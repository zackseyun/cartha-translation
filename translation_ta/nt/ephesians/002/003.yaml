  source_fidelity: 'வரி முழுவதும் மூலத்தின் அமைப்பையும் கருத்தையும் பெரும்பாலும் நன்றாகப் பாதுகாக்கிறது: ἐν οἷς-ஐ மனிதர்களைக் குறிக்கும் வகையில் “அவர்களிடையே” எனவும், φύσει τέκνα ὀργῆς-ஐ விளக்கித் தீர்க்காமல் எனவும் மொழிபெயர்க்கிறது. ஆனால் τὰ θελήματα τῆς σαρκὸς καὶ τῶν διανοιῶν என்பது மாம்சம் மற்றும் சிந்தனைகளின் ‘விருப்பங்கள்/நோக்கங்கள்’ என்பதைக் குறிக்கிறது. “மாம்சமும் சிந்தனைகளும் விரும்பியவற்றை” என்பது பொருளில் நெருக்கமாக இருந்தாலும், மூலத்தின் பெயர்ச்சொல் அமைப்பையும் ‘ஆசைகள்’ (ἐπιθυμίαις) மற்றும் ‘விருப்பங்கள்’ (θελήματα) இடையிலான வேறுபாட்டையும் மங்கலாக்குகிறது.'
  naturalness: திருத்தப்பட்ட நடை நவீன பொதுத்தமிழில் இயல்பாக உள்ளது. “நாம் அனைவரும்” என்பது “நாமும் எல்லாரும்” என்பதைக் காட்டிலும் சீரானது. “விருப்பங்களை நிறைவேற்றி” என்பது பங்கேற்புச் செயலைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
