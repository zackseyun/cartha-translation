  text: οὐκ ἐξ ἔργων, ἵνα μή τις καυχήσηται.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/009.yaml
  text: not from works[a], so that no one may boast.
translation:
  language: ta
  text: இது செயல்களிலிருந்து வந்ததல்ல[a]; யாரும் பெருமை பேசாதபடி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘செயல்களிலிருந்து அல்ல.’ இச்சொற்றொடர் மூலம் அல்லது தோற்றத்தைக் குறிக்கிறது; சிலர் இதைக் கருவிப்பொருளில் (‘செயல்களால் அல்ல’) புரிந்துகொள்கிறார்கள். ஆனால் கிரேக்கச் சொற்றொடரின் மிக நேரடியான பொருள் ‘செயல்களிலிருந்து அல்ல’ என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ
  choice: அல்ல
  rationale: நிலையான மறுப்புச் சொல்; இங்கு ἐξ ἔργων என்ற முழுச் சொற்றொடரையும் மறுக்கிறது.
- source_word: ἐξ
  choice: இலிருந்து வந்தது
  rationale: ἐκ/ἐξ பொதுவாக மூலம் அல்லது தோற்றத்தைக் குறிக்கிறது. தமிழில் இயல்பாக இருக்கவும், ‘செயல்களால்’ என்ற கருவிப்பொருளை மட்டும் வலியுறுத்தாமல் இருக்கவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: ἔργων
  choice: செயல்கள்
  rationale: ἔργων என்பதன் விரிவான பொருளைத் தக்கவைக்கிறது. மூலத்தில் இல்லாத ‘திருச்சட்டத்தின் செயல்கள்,’ ‘நற்செயல்கள்’ போன்ற வரையறைகளைச் சேர்க்கவில்லை.
- source_word: ἵνα μή τις
  choice: யாரும் ... ஆதபடி
  rationale: எதிர்மறையான நோக்கம் அல்லது விளைவை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; τις என்பதையும் பாலின வேறுபாடின்றி மொழிபெயர்க்கிறது.
- source_word: καυχήσηται
  choice: பெருமை பேச
  rationale: καυχάομαι என்பதன் ‘boast’ என்ற நேரடியான கருத்தை, சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: ‘செயல்கள்’ என்பதன் பொருள்
  choice: ‘செயல்கள்’ என்ற விரிவான சொல்லையே வரையறுக்காமல் தக்கவைத்தல்
  alternative: ‘திருச்சட்டத்தின் செயல்கள்,’ ‘மனித முயற்சி,’ அல்லது ‘நற்செயல்கள்’ என்று குறிப்பாக்குதல்
  rationale: கிரேக்க மூலத்தில் ἔργων (‘செயல்கள்’) என்று மட்டுமே உள்ளது. ஒரு குறிப்பிட்ட இறையியல் விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்க்காமல், மூலத்தின் சுருக்கத்தையும் பொருள் விரிவையும் காக்கிறது.
- issue: ἵνα உட்பிரிவின் தொடர்பு
  choice: ‘யாரும் பெருமை பேசாதபடி’ என்று நோக்கம்/விளைவு இரண்டிற்கும் இடமளித்தல்
  alternative: ‘எனவே யாரும் பெருமை பேச முடியாது’ என்று விளைவை மட்டும் தெளிவுபடுத்துதல்
  rationale: ἵνα பொதுவாக நோக்கம் அல்லது எதிர்பார்க்கப்பட்ட விளைவை அறிமுகப்படுத்தலாம். ‘ஆதபடி’ என்ற வடிவம் அதன் இயல்பான இறையியல் பதற்றத்தைத் தீர்மானித்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், இயல்பும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. முந்தைய வசனத்திலிருந்து தொடரும் கருத்து தமிழில் தெளிவாக இருக்க ‘இது’ மற்றும் ‘வந்தது’ சேர்க்கப்பட்டுள்ளன; அவை புதிய இறையியல் தகவலைச் சேர்ப்பதில்லை. ‘பெருமை பேச’ என்பது இன்றைய வாசகர்களுக்கு ‘மேன்மைபாராட்ட’ என்பதைக் காட்டிலும் இயல்பாகப் புரியும்.
