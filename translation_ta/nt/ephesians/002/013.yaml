  text: νυνὶ δὲ ἐν Χριστῷ Ἰησοῦ ὑμεῖς οἵ ποτε ὄντες μακρὰν ⸂ἐγενήθητε ἐγγὺς⸃ ἐν τῷ αἵματι τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/013.yaml
  text: But now in Messiah Jesus[d][c][b][a], you who once were far away have become near by the blood of the Messiah.
translation:
  language: ta
  text: ஆனால் இப்போது, மெசியாவாகிய இயேசுவுக்குள் நீங்கள்—ஒருகாலத்தில் தொலைவில் இருந்த நீங்கள்—மெசியாவின் இரத்தத்தினால் அருகில் வந்திருக்கிறீர்கள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அருகில் கொண்டுவரப்பட்டிருக்கிறீர்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘மெசியாவின் இரத்தத்தின் மூலம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: ஆனால் இப்போது
  rationale: δέ-யின் மாறுபாட்டுத் தொடர்பையும் νυνί-யின் கால வலியுறுத்தலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: மெசியாவாகிய இயேசுவுக்குள் இருக்கும்
  rationale: ἐν என்பதன் பவுலின் ஒன்றிணைவு/உட்பட்டிருத்தல் கருத்தை ‘உக்குள்’ காக்கிறது; Χριστός பட்டமாக இருப்பதால் ‘மெசியா’ எனப் பொருள் மொழிபெயர்க்கப்படுகிறது. தமிழ் வாக்கியத்தில் தொடர்பைத் தெளிவாக்க ‘இருக்கும்’ சேர்க்கப்பட்டுள்ளது.
- source_word: ὑμεῖς οἵ ποτε ὄντες
  choice: ஒருகாலத்தில் ... இருந்த நீங்கள்
  rationale: முன்னைய நிலையைக் குறிக்கும் ποτε மற்றும் ὄντες ஆகியவற்றை இயல்பாகவும் வலியுறுத்தலுடனும் வழங்குகிறது.
- source_word: μακρὰν
  choice: தொலைவில்
  rationale: இடவியல் உருவகத்தையும் உறவுசார் விலகலையும் தீர்மானித்து விளக்காமல் காக்கும் தற்போதைய பொதுத்தமிழ்ச் சொல்.
- source_word: ἐγενήθητε ἐγγὺς
  choice: அருகில் வந்திருக்கிறீர்கள்
  rationale: γίνομαι என்பதன் ‘நிலையாகுதல்/ஆகுதல்’ பொருளையும் நிகழ்காலத்தில் நீடிக்கும் முடிவையும் இயல்பான தமிழில் தருகிறது; மறைமுகச் செய்பவரை தேவையின்றி சேர்க்கவில்லை.
- source_word: ἐν τῷ αἵματι
  choice: இரத்தத்தினால்
  rationale: இங்கு ἐν வழிமுறை அல்லது கருவியைக் குறிக்கக்கூடும்; ‘-இனால்’ அந்தப் பொருளைச் சுருக்கமாகத் தருகிறது. ‘இரத்தத்தின் மூலம்’ என்ற மாற்றும் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: τοῦ Χριστοῦ
  choice: மெசியாவின்
  rationale: Χριστός என்பதைக் பெயர்போல ஒலிபெயர்க்காமல், அதன் பட்டப் பொருளைத் தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இவ்வசனத்தில் Χριστός இறையியல் முக்கியத்துவமுள்ள பட்டமாகச் செயல்படுகிறது; ஆகவே பட்டத்தின் பொருளை மொழிபெயர்ப்பது பொருத்தமானது.
- issue: ἐγενήθητε ἐγγὺς என்பதன் செயற்பாட்டு வலிமை
  choice: அருகில் வந்திருக்கிறீர்கள்
  alternative: அருகில் கொண்டுவரப்பட்டிருக்கிறீர்கள்
  rationale: மூலத்தின் ἐγενήθητε நேரடியாக ‘ஆனீர்கள்/வந்தீர்கள்’ என்ற நிலைமாற்றத்தைக் குறிக்கிறது. தெய்வீக செயற்பாடு சூழலில் உணரப்பட்டாலும், அதை வெளிப்படையாகச் சேர்க்காமல் மூலத்தின் திறந்த தன்மையைப் பாதுகாக்கிறது.
- issue: ἐν τῷ αἵματι τοῦ Χριστοῦ என்பதன் வலிமை
  choice: மெசியாவின் இரத்தத்தினால்
  alternative: மெசியாவின் இரத்தத்தின் மூலம்; மெசியாவின் இரத்தத்தில்
  rationale: வழிமுறைப் பொருள் சூழலுக்கு ஏற்றது; அதேவேளை ‘இரத்தம்’ என்பதை மேலும் விரிவான பரிகாரக் கோட்பாடாக விளக்காமல் உரையின் இறையியல் செறிவைக் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய மதிப்புமிக்க நடையில் வடிவமைக்கப்பட்டது. பவுலின் ‘உக்குள்’ மொழியும் தொலைவு–அருகு உருவகமும் காக்கப்பட்டுள்ளன; இயேசு என்ற பெயருக்கும் மெசியா என்ற பட்டத்திற்கும் இடையிலான உறவு ‘மெசியாவாகிய இயேசு’ என இயல்பாக்கப்பட்டுள்ளது. அனைத்து அடிக்குறிப்பு குறியீடுகளும் பிரதான உரையில் இடம்பெற்றுள்ளன.
