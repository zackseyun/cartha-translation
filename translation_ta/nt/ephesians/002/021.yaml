translation:
  language: ta
  text: அவரில் முழுக் கட்டிடமும்[a] ஒன்றாகப் பொருத்தப்பட்டு, ஆண்டவருக்குள் ஒரு பரிசுத்த ஆலயமாக வளர்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒவ்வொரு கட்டிடமும்.” கிரேக்கச் சொற்றொடரை ஒவ்வொரு கட்டிடத்தையும் தனித்தனியாகக் குறிப்பதாகவோ, கட்டிடம் முழுவதையும் ஒன்றாகக் குறிப்பதாகவோ வாசிக்கலாம். சூழலில் காணப்படும் ஒருங்கிணைந்த ஆலய உருவகத்தைப் பின்பற்றி முதன்மை உரையில் “முழுக் கட்டிடமும்” என உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: அவரில்
  rationale: உறவுப்பெயர் முந்தைய வசனத்தில் மூலைக்கல்லாகக் குறிப்பிடப்படும் கிறிஸ்து இயேசுவையே இயல்பாகச் சுட்டுகிறது; தனிப்பட்ட சுட்டுதலைத் தக்கவைக்கிறது.
- source_word: πᾶσα οἰκοδομὴ
  choice: முழுக் கட்டிடமும்
  rationale: கட்டுரைச் சொல் இல்லாத ஒருமை அமைப்பு ‘ஒவ்வொரு கட்டிடமும்’ என்றும் ‘முழுக் கட்டிடமும்’ என்றும் பொருள்படலாம். யூதரும் பிற இனத்தாரும் ஒன்றாக ஒரே ஆலயமாகக் கட்டப்படுகின்ற சூழலில் ஒருங்கிணைந்த மொத்தப் பொருள் முதன்மை உரையில் ஏற்றது.
- source_word: συναρμολογουμένη
  choice: ஒன்றாகப் பொருத்தப்பட்டு
  rationale: நிகழ்காலச் செயப்பாட்டு வினையெச்சம் பல பகுதிகள் தொடர்ந்து இசைவாக இணைக்கப்படுவதைச் சுட்டுகிறது; கட்டிட உருவகத்தையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: αὔξει
  choice: வளர்கிறது
  rationale: நிகழ்கால வினை தொடர்ச்சியான வளர்ச்சியை வெளிப்படுத்துகிறது; கட்டிடம் உயிருள்ள ஒன்றைப் போல வளர்கிறது என்ற கலப்பு உருவகத்தையும் அப்படியே காக்கிறது.
- source_word: εἰς
  choice: ஆக
  rationale: இங்கு εἰς வளர்ச்சியின் முடிவையோ இலக்கையோ குறிக்கிறது; தமிழில் ‘ஆலயமாக வளர்கிறது’ என்பது அந்த விளைவு சார்ந்த திசையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ναὸν ἅγιον
  choice: ஒரு பரிசுத்த ஆலயம்
  rationale: ναός ஆலய வளாகம் முழுவதையும் விட இறைப் பிரசன்னத்திற்குரிய ஆலயத்தைச் சுட்டுகிறது. ‘பரிசுத்த ஆலயம்’ என்பது பொருளை நேரடியாகவும் திருச்சபை நடையில் புரியத்தக்கவாறும் தருகிறது.
- source_word: ἐν κυρίῳ
  choice: ஆண்டவருக்குள்
  rationale: ἐν என்பதன் உறவு அல்லது ஒன்றிப்பின் பரந்த தன்மையைத் தீர்மானித்து விடாமல் ‘ஆண்டவருக்குள்’ காக்கிறது; κύριος என்பதற்கு மரியாதைமிக்க பொதுத் தமிழ் ‘ஆண்டவர்’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: ᾧ என்பதன் முன்னிலை கிறிஸ்துவைத் தனிப்பட்ட முறையில் குறிக்கிறதா, அல்லது கட்டிட உருவகத்தைப் பொருளாகக் குறிக்கிறதா?
  choice: கிறிஸ்துவைத் தனிப்பட்ட முறையில் குறிக்கும் ‘அவரில்’
  alternative: கட்டிடத்தைக் குறிக்கும் ‘அதில்’
  rationale: முந்தைய வசனத்தின் உடனடி தனிப்பட்ட மையம் ‘கிறிஸ்து இயேசு தாமே’; மேலும் இப்பகுதியின் ‘அவரில்’ மொழிநடை தனிப்பட்ட கிறிஸ்துவுடனான உறவை ஆதரிக்கிறது.
- issue: πᾶσα οἰκοδομὴ என்பது ஒருங்கிணைந்த முழுக் கட்டிடமா அல்லது பகிர்ந்தளிக்கும் பொருளில் ஒவ்வொரு கட்டிடமா?
  choice: ஒருங்கிணைந்த ‘முழுக் கட்டிடம்’
  alternative: ‘ஒவ்வொரு கட்டிடமும்’
  rationale: 2:14–22-இல் ஒரே புதிய மனிதகுலமும் ஒரே ஆலயமும் என்ற ஒற்றுமை வலியுறுத்தப்படுகிறது. ஆயினும் கிரேக்க இலக்கணத்தில் பகிர்ந்தளிக்கும் வாசிப்பும் உண்மையான வாய்ப்பாக இருப்பதால் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஒன்றாகப் பொருத்தப்பட்டு’ கட்டிட உருவகத்தைத் தெளிவாக்குகிறது; ‘வளர்கிறது’ என்பது மூலத்தில் உள்ள உயிரியல்-கட்டிட கலப்பு உருவகத்தை மாற்றாமல் காக்கிறது. ‘ஆண்டவருக்குள்’ பவுலின் ἐν κυρίῳ சொற்றொடரின் உறவு மற்றும் ஒன்றிப்பு சார்ந்த திறந்த பொருளைத் தக்கவைக்கிறது.
