  yaml_path: translation/nt/ephesians/002/017.yaml
  text: And he came and proclaimed peace to you who were far away[b][a], and peace to those who were near.
translation:
  language: ta
  text: அவர் வந்து, தொலைவில் இருந்த உங்களுக்கு[a] சமாதானத்தையும், அருகில் இருந்தவர்களுக்குச் சமாதானத்தையும் அறிவித்தார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, முன்பு தொலைவில் இருந்தவர்களுக்கும் அருகில் இருந்தவர்களுக்கும் சமாதானம் அறிவிக்கப்பட்டது; சூழலின்படி இவர்கள் முறையே புறஜாதியினரும் யூதர்களும் ஆவர் (எபேசியர் 2:11–13 பார்க்கவும்).
    reason: cross_reference
  - marker: b
    text: அல்லது, “சமாதானத்தின் நற்செய்தியை அறிவித்தார்.” கிரேக்க வினை பொதுவாக ‘நற்செய்தியை அறிவித்தல்’ என்று பொருள்படும்; இங்கு அதன் நேரடிச் செயப்படுபொருள் ‘சமாதானம்’ மட்டுமே.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: அவர் வந்து
  rationale: இறந்தகாலப் பங்கேற்புவினை இங்கு முதன்மை வினையோடு இணைந்த முன்னோடி செயலாக உள்ளது. ‘அவர் வந்து’ என்பது இயக்க உருவகத்தையும் கிரேக்கத் தொடரமைப்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: εὐηγγελίσατο
  choice: அறிவித்தார்
  rationale: இவ்வினை நல்ல செய்தியை அறிவித்தல் என்ற பொருள் கொண்டது; இங்கு அதன் நேரடிச் செயப்படுபொருள் ‘சமாதானம்.’ ஆகவே, மூலத்தில் இல்லாத ‘நற்செய்தி’ என்ற பெயர்ச்சொல்லை முதன்மை உரையில் சேர்க்காமல் ‘அறிவித்தார்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: εἰρήνην
  choice: சமாதானம்
  rationale: இது εἰρήνη என்பதற்கான நேரடியான, வேதாகமச் சூழலிலும் நவீனத் தமிழிலும் புரியக்கூடிய இணை. இச்சூழலில் ஒப்புரவு மற்றும் முழுமை ஆகிய நுண்ணர்த்தங்களையும் தாங்குகிறது.
- source_word: ὑμῖν
  choice: உங்களுக்கு
  rationale: மறைமுகச் செயப்படுபொருளான பன்மை இரண்டாம் நபரை நேரடியாகக் காட்டுகிறது; உடனடிச் சூழலில் புறஜாதி வாசகர்களை நோக்கிய உரையாகும்.
- source_word: τοῖς μακρὰν
  choice: தொலைவில் இருந்த
  rationale: இடஞ்சார்ந்த உருவகத்தையும் தேவனுடைய மக்களிடமிருந்து இருந்த முந்தைய விலகலையும் விளக்கத்தை உட்புகுத்தாமல் காக்கிறது.
- source_word: τοῖς ἐγγύς
  choice: அருகில் இருந்தவர்களுக்கு
  rationale: ‘தொலைவில் இருந்த’ என்பதற்கு இணையான எதிர்மறை அமைப்பை இயல்பான தமிழில் காக்கிறது.
- source_word: καὶ ... καὶ
  choice: …யும், …யும்
  rationale: இரு குழுக்களுக்கும் ஒரே சமாதான அறிவிப்பு சென்றதைத் தமிழின் இணைப்பும்மை அமைப்பு தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘தொலைவில் இருந்தவர்கள்’ மற்றும் ‘அருகில் இருந்தவர்கள்’ யார்?
  choice: முதன்மை உரையில் உருவகச் சொற்றொடர்களை அப்படியே காத்து, சூழல்சார்ந்த அடையாளத்தை அடிக்குறிப்பில் தருதல்.
  alternative: ‘தொலைவில் இருந்த புறஜாதியினரான உங்களுக்கும், அருகில் இருந்த யூதர்களுக்கும்’ என்று நேரடியாக அடையாளப்படுத்துதல்.
  rationale: எபேசியர் 2:11–13 சூழலில் முறையே புறஜாதியினரும் யூதர்களும் குறிக்கப்படுவது தெளிவாக இருந்தாலும், இவ்வசனம் தானாகவே ‘தொலைவு/அருகு’ என்ற உருவகத்தையே பயன்படுத்துகிறது. அதைக் காப்பது பவுலின் சொல்லாட்சியையும் அதன் விரிந்த இறையியல் ஒலிப்பையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தொலைவில்/அருகில்’ என்ற இணை உருவகம் காக்கப்பட்டுள்ளது. அடிக்குறி [a] அது விளக்கும் சொற்றொடருக்குப் பின்பும், [b] முழு அறிவித்தல் வினைக்கு மாற்று மொழிபெயர்ப்பைக் குறிப்பதால் வசன முடிவிலும் வைக்கப்பட்டுள்ளது.
