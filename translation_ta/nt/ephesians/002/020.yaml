translation:
  language: ta
  text: அப்போஸ்தலர்கள் மற்றும் இறைவாக்கினர்களின் அடித்தளத்தின்மேல்[a] நீங்கள் கட்டப்பட்டிருக்கிறீர்கள்; மெசியாவாகிய இயேசுவே[b] மூலைக்கல்லாக இருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அப்போஸ்தலர்கள் மற்றும் இறைவாக்கினர்களின் அடித்தளம்” என்பது அவர்களோடு அல்லது அவர்களுடைய சாட்சியோடு தொடர்புடைய அடித்தளத்தையோ, அவர்களால் இடப்பட்ட அடித்தளத்தையோ, அவர்களையே அடித்தளமாகவோ குறிக்கலாம்; கிரேக்க உடைமைத் தொடர் இதை இன்னும் குறிப்பாக வரையறுக்கவில்லை.
