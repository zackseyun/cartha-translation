    reason: alternative_reading
lexical_decisions:
- source_word: ἐποικοδομηθέντες
  choice: நீங்கள் கட்டப்பட்டிருக்கிறீர்கள்
  rationale: இறந்தகாலச் செயலின் தொடரும் விளைவை உணர்த்தும் இறந்தகாலச் செயப்பாட்டு வினையெச்சத்தைத் தமிழில் இயல்பான செயப்பாட்டு நிறைவுநிலையாகத் தருகிறது. ‘நீங்கள்’ என்பது சுற்றியுள்ள வாக்கிய அமைப்பிலிருந்து தெளிவாகும் பன்மை முன்னிலையை வெளிப்படுத்துகிறது.
- source_word: ἐπὶ τῷ θεμελίῳ
  choice: அடித்தளத்தின்மேல்
  rationale: கட்டட உருவகத்தில் தாங்கும் அடிப்படையின்மேல் கட்டப்படுதல் என்ற இட/ஆதார உறவை இயல்பாகக் காட்டுகிறது.
- source_word: τῶν ἀποστόλων καὶ προφητῶν
  choice: அப்போஸ்தலர்கள் மற்றும் இறைவாக்கினர்களின்
  rationale: கிரேக்க உருபின் பரந்த பொருளைச் சுருக்காமல் உடைமைத் தொடர்பாகவே வைக்கிறது; அடித்தளம் அவர்களைக் கொண்டதா, அவர்களால் இடப்பட்டதா, அவர்களுடைய சாட்சியோடு தொடர்புடையதா என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- source_word: ὄντος
  choice: இருக்கிறார்
  rationale: தமிழில் இயல்பான முழு வாக்கியமாக அமைய, கிரேக்க வினையெச்சத்தின் நிலையை வினைமுற்றாக வெளிப்படுத்துகிறது.
- source_word: ἀκρογωνιαίου
  choice: மூலைக்கல்
  rationale: கட்டட உருவகத்தில் முக்கிய இணைப்புக் கல்லைக் குறிக்கும் நேரடியான, வழக்கமான தமிழ் இணை.
- source_word: αὐτοῦ
  choice: இயேசுவே
  rationale: ‘வே’ என்னும் வலியுறுத்தல் உருபு, இயேசு தாமே மூலைக்கல் என்ற αὐτοῦ-வின் வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Χριστοῦ Ἰησοῦ
  choice: மெசியாவாகிய இயேசு
  rationale: Χριστός இங்கு பட்டப்பெயரின் பொருளைத் தக்கவைக்கும் வகையில் ‘மெசியா’ என்று தரப்படுகிறது; ‘ஆகிய’ என்பது தமிழில் பட்டப்பெயரையும் இயற்பெயரையும் இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: ‘அப்போஸ்தலர்கள் மற்றும் இறைவாக்கினர்களின் அடித்தளம்’ என்பதன் பொருள்
  choice: தெளிவுபடுத்தாமல் உடைமைத் தொடர்பை அப்படியே தக்கவைத்தல்
  alternative: அப்போஸ்தலர்களும் இறைவாக்கினர்களும் இட்ட அடித்தளம்; அல்லது அவர்களே அடித்தளம்
  rationale: கிரேக்க உடைமை உருபு இவற்றுள் ஒன்றை மட்டும் கட்டாயப்படுத்தவில்லை. ஆகவே அவர்களுடைய நபர்கள், போதனை, சாட்சி, அல்லது அவர்கள் இட்ட அடித்தளம் ஆகிய சாத்தியங்களை மொழிபெயர்ப்பு முன்கூட்டியே முடிவு செய்யவில்லை.
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு அது இயேசுவின் பட்டத்தைத் தெளிவாகக் குறிக்கிறது; ‘மெசியா’ அபிஷேகம் பெற்றவர் என்ற பட்டப்பொருளை வெளிப்படுத்துகிறது, அதேவேளை பரிச்சயமான மாற்று வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாகப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘அப்போஸ்தலர்’, ‘இறைவாக்கினர்’, ‘மெசியா’, ‘மூலைக்கல்’ ஆகியவை கட்டட உருவகத்தையும் பட்டப்பெயரின் பொருளையும் தெளிவாகக் காக்கின்றன. கிரேக்க வினையெச்சத் துணை அமைப்பு தமிழில் இயல்பான முழு வாக்கியமாக மாற்றப்பட்டுள்ளது; சுற்றுச் சூழலில் உள்ள பன்மை முன்னிலையை ‘நீங்கள்’ வெளிப்படுத்துகிறது.
