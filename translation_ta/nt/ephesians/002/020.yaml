  terminology: “அப்போஸ்தலர்கள்,” “இறைவாக்கினர்கள்,” “மெசியா,” and “மூலைக்கல்” are appropriate. “மெசியாவாகிய இயேசுவே” adequately expresses Χριστοῦ Ἰησοῦ together with the emphasis of αὐτοῦ, while the alternative familiar form is supplied in the note.
