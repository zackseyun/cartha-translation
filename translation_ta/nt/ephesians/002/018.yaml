  text: ὅτι δι’ αὐτοῦ ἔχομεν τὴν προσαγωγὴν οἱ ἀμφότεροι ἐν ἑνὶ πνεύματι πρὸς τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/018.yaml
  text: For through him we both have access in one Spirit to the Father[a][b][c].
translation:
  language: ta
  text: ஏனெனில், அவர் மூலமாக நாம் இரு தரப்பினரும் ஒரே ஆவியில் பிதாவை அணுகும் வாய்ப்பைப் பெற்றிருக்கிறோம்.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏனென்றால், அவர் மூலமாக நாம் இரு தரப்பினரும் ஒரே ஆவியில் பிதாவை அணுகும் வாய்ப்பைப் பெற்றிருக்கிறோம்.”
    reason: lexical_alternative
  - marker: b
    text: “அணுகும் வாய்ப்பு” என்பதை “அணுகும் உரிமை” அல்லது “முன்னிலையில் அறிமுகப்படுத்தப்படுதல்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “ஒரே ஆவியின் மூலமாக.” “ஒரே ஆவியில்” என்பது கிரேக்கச் சொல்லமைப்பைப் பாதுகாக்கிறது; அது வழிமுறையையோ பங்கேற்கும் தளத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் இணைப்புச்சொல். நவீனத் தமிழில் “ஏனெனில்” இந்தத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: δι’ αὐτοῦ
  choice: அவர் மூலமாக
  rationale: διά + genitive காட்டும் வழிமுறை அல்லது இடைநிலையைப் பாதுகாக்கிறது; சூழலில் கிறிஸ்துவின் இடைநிலைப் பங்கை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἔχομεν
  choice: பெற்றிருக்கிறோம்
  rationale: இப்போது இரு தரப்பினருக்கும் உரியதாக உள்ள பகிரப்பட்ட நிலையை இயல்பான தமிழில் கூறுகிறது. “உடையவர்களாக இருக்கிறோம்” என்பதைவிட இது அணுகும் வாய்ப்பு அருளப்பட்டுள்ளதையும் தெளிவாக உணர்த்துகிறது.
- source_word: τὴν προσαγωγὴν
  choice: அணுகும் வாய்ப்பு
  rationale: உயர்ந்த ஒருவரின் முன்னிலைக்குச் செல்ல அனுமதிக்கப்படுதல் அல்லது அறிமுகப்படுத்தப்படுதல் என்ற சொல்லின் கருத்தை எளிய நவீனத் தமிழில் தருகிறது; “உரிமை” என்று மொழிபெயர்த்து சட்டரீதியான நுணுக்கத்தை அளவுக்கு மீறிச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: οἱ ἀμφότεροι
  choice: நாம் இரு தரப்பினரும்
  rationale: முன்னைய சூழலில் கூறப்பட்ட யூதர், பிற இனத்தார் ஆகிய இரு தரப்பையும் குறிக்கிறது; கிரேக்கத்தின் முதலாம் நபர் ஒருமைப்பாட்டையும் பாதுகாக்கிறது.
- source_word: ἐν ἑνὶ πνεύματι
  choice: ஒரே ஆவியில்
  rationale: ἐν என்பதன் அடிப்படை வடிவத்தைப் பாதுகாத்து, ஒரே ஆவிக்குள் பகிரப்படும் பங்கேற்பையோ அந்த ஆவியின் வழியாக நிகழும் செயலையோ தீர்மானிக்காமல் விடுகிறது. சூழலின் மூவொரு அமைப்பு இதைத் தூய ஆவியைக் குறிப்பதாக வலுவாகச் சுட்டுகிறது.
- source_word: πρὸς τὸν πατέρα
  choice: பிதாவை
  rationale: πρός இங்கு பிதாவின் முன்னிலையை நோக்கிய அணுகுதலைக் குறிக்கிறது. தமிழில் “அணுகு” நேரடியாகச் செயப்படுபொருளை ஏற்றுக்கொள்வதால் “பிதாவை அணுகுதல்” இயல்பாகவும் துல்லியமாகவும் உள்ளது.
theological_decisions:
- issue: “ஒரே ஆவி” என்பதன் குறிப்பு
  choice: தூய ஆவி
  alternative: இரு தரப்பினரும் பகிர்ந்துகொள்ளும் மனித மனப்பான்மை அல்லது ஆவி
  rationale: “அவர் மூலமாக” (கிறிஸ்து), “ஒரே ஆவியில்,” “பிதாவை” என்ற அமைப்பும் எபேசியர் திருமுகத்தின் சூழலும் தூய ஆவியையே பெரிதும் சுட்டுகின்றன. இருப்பினும் விளக்கச் சொற்களை மூலவசனத்துக்குள் சேர்க்காமல் “ஆவி” என்றே வைக்கப்படுகிறது.
- issue: προσαγωγή என்பதன் வலிமை
  choice: பிதாவை அணுகும் பகிரப்பட்ட வாய்ப்பு
  alternative: பிதாவின் முன்னிலையில் முறைப்படி அறிமுகப்படுத்தப்படுதல்
  rationale: இந்தப் பெயர்ச்சொல்லில் அரசவையையோ வழிபாட்டிடத்தையையோ நினைவூட்டும் அறிமுகம்/நுழைவு நிழல் இருக்கலாம். ஆனால் இங்கு இரு தரப்பினருக்கும் தொடர்ந்து கிடைத்துள்ள அணுகுதலை “அணுகும் வாய்ப்பு” தெளிவாகத் தெரிவிக்கிறது; உருவகத்தை அளவுக்கு மீறி வரையறுப்பதில்லை.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. “பிதா” என்பது இப்பகுதியின் கிறிஸ்தவத் தெய்வவியல் தொடர்பைச் சுருக்கமாகவும் பரிச்சயமாகவும் காக்கிறது. “நாம் இரு தரப்பினரும்” என்பது பின்னணியை உரைக்குள் விரிவாக்காமல் யூதர்–பிற இனத்தார் என்ற இரு குழுக்களையும் சுட்டுகிறது.
