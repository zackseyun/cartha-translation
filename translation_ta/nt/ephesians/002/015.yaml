translation:
  language: ta
  text: விதிமுறைகளில் அமைந்த கட்டளைகளின் சட்டத்தை ஒழித்து[a], அந்த இருவரையும் தம்மில் ஒரே புதிய மனிதனாகப் படைத்து, சமாதானத்தை ஏற்படுத்தும்படியாக அவர் செய்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “விதிமுறைகளில்,” “விதிமுறைகளைக் கொண்ட,” அல்லது பாரம்பரியமாக “நியமங்களில்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “ஒரே புதிய மனிதன்” என்பது இரு குழுக்களையும் குறிக்கும் ஒருமைக் கூட்டுரு உருவகம்; “ஒரே புதிய மனிதகுலம்” என்றும் மொழிபெயர்க்கலாம். சொல் வரிசையைப் பொருத்து, “அந்த இருவரையும் தம்மில் ஒரே புதிய மனிதனாகப் படைக்கும்படியாக” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν νόμον τῶν ἐντολῶν
  choice: கட்டளைகளைக் கொண்ட சட்டம்
  rationale: νόμος–ἐντολή என்ற உடைமைத் தொடர்பை இயல்பான நவீனத் தமிழில் காட்டுகிறது; சூழலில் இது கட்டளைகளால் வரையறுக்கப்படும் சட்டத்தைக் குறிக்கிறது.
- source_word: ἐν δόγμασιν
  choice: அதன் விதிமுறைகளோடு
  rationale: δόγμα என்பதன் கட்டளை/விதிமுறைப் பொருளைப் பேணுகிறது. ἐν என்பதற்கும் முந்தைய சொற்றொடருக்கும் உள்ள துல்லியமான தொடர்பு தெளிவற்றதால், மாற்று விளக்கங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: καταργήσας
  choice: செயலற்றதாக்கினார்
  rationale: καταργέω என்பதன் ‘செயலிழக்கச் செய்தல், செல்லுபடியாகாததாக்குதல், ஒழித்தல்’ என்ற பொருள் வரம்பில், இங்கு வலிமையைப் பேணியும் சட்டம் முழுவதையும் பற்றிய தேவையற்ற கோட்பாட்டு விரிவாக்கத்தைத் தவிர்த்தும் மொழிபெயர்க்கிறது.
- source_word: ἵνα
  choice: நோக்கம்
  rationale: நோக்கத்தைச் சுட்டும் ἵνα உட்பிரிவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τοὺς δύο
  choice: அந்த இருவரையும்
  rationale: முந்தைய சூழலில் கூறப்பட்ட யூதர்–பிற இனத்தார் ஆகிய இரு குழுக்களையும் சுட்டும் வெளிப்படையான எண்ணைக் காக்கிறது.
- source_word: κτίσῃ
  choice: படைத்து
  rationale: κτίζω-வின் படைப்பு சார்ந்த வலிமையையும் புதிய படைப்பு நுண்ணொலியையும் காக்கிறது.
- source_word: ἐν αὑτῷ
  choice: தமக்குள்
  rationale: செய்பவரையே திரும்பச் சுட்டும் αὑτῷ என்பதைக் கண்ணியமான தமிழ் பிரதிப்பெயரால் காட்டுகிறது.
- source_word: εἰς ἕνα καινὸν ἄνθρωπον
  choice: ஒரே புதிய மனிதனாக
  rationale: ஒருமை உருவகத்தையும் பிரதிநிதித்துவ/கூட்டுரு வலிமையையும் பேணுகிறது; ‘புதிய மனிதகுலம்’ என்பது விளக்கமான மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ποιῶν εἰρήνην
  choice: சமாதானத்தை ஏற்படுத்தி
  rationale: ποιέω + εἰρήνη என்பதன் செயற்பாட்டு பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἄνθρωπον என்ற ஒருமைச் சொல்லின் கூட்டுரு பொருள்
  choice: ஒரே புதிய மனிதன்
  alternative: ஒரே புதிய மனிதகுலம்
  rationale: யூதர் மற்றும் பிற இனத்தார் ஒன்றாக்கப்படுவதே சூழல் என்றாலும், கிரேக்கத்தின் ஒருமை மனித உருவகத்தை முதன்மை உரை காக்கிறது; கூட்டுரு விளக்கம் அடிக்குறிப்பில் வழங்கப்படுகிறது.
- issue: καταργήσας என்பதன் வலிமையும் சட்டத்தைப் பற்றிய பரப்பும்
  choice: செயலற்றதாக்கினார்
  alternative: ஒழித்தார்
  rationale: வினையின் தீர்மானமான செயலைக் காட்டுகிறது; அதேவேளை, இவ்வசனத்தின் குறிப்பிட்ட இலக்கு ‘விதிமுறைகளோடு உள்ள கட்டளைகளின் சட்டம்’ என்பதைக் கடந்து கோட்பாட்டு முடிவை மொழிபெயர்ப்பே தீர்மானிக்காமல் விடுகிறது.
- issue: ἐν αὑτῷ என்பதன் இணைப்பு
  choice: அந்த இருவரையும் தமக்குள் ஒரே புதிய மனிதனாகப் படைத்து
  alternative: அந்த இருவரையும் ஒரே புதிய மனிதனாகத் தமக்குள் படைத்து
  rationale: கிரேக்கச் சொல் வரிசையையும், ஒருமைப்படுத்தல் கிறிஸ்துவுக்குள் நிகழ்கிறது என்ற வாசிப்பையும் பேணுகிறது; மாற்றுச் சொல் வரிசையும் இலக்கண ரீதியாக சாத்தியம்.
translation_notes:
  register: நவீன தரத் தமிழ்; எளிதில் புரியும் அதேவேளை கண்ணியமான நடையில் அமைக்கப்பட்டது. வசனம் முந்தைய வாக்கியத்திலிருந்து தொடரும் கிரேக்கத் துணைப்பகுதியாக இருந்தாலும், தனித்து வாசிக்க ஏதுவாக தமிழில் முழு வாக்கியமாக வடிவமைக்கப்பட்டது. மரியாதைப் பிரதிப்பெயரான ‘தமக்குள்’ பயன்படுத்தப்பட்டுள்ளது.
