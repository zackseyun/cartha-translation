id: EPH.2.4
reference: Ephesians 2:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς πλούσιος ὢν ἐν ἐλέει, διὰ τὴν πολλὴν ἀγάπην αὐτοῦ ἣν ἠγάπησεν ἡμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/004.yaml
  text: But God[a], being rich in mercy, because of his great love with which he loved us,
translation:
  language: ta
  text: ஆனால், இரக்கத்தில் செல்வம் மிக்க கடவுள், தாம் நம்மை நேசித்த தமது மாபெரும் அன்பினால்—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனங்களில் மனிதரின் மரித்த நிலையையும் கோபத்திற்குரிய நிலையையும் விவரித்ததற்கு எதிரான வலுவான திருப்பத்தை இது இயல்பாகக் காட்டுகிறது.
- source_word: πλούσιος ὢν ἐν ἐλέει
  choice: இரக்கத்தில் செல்வந்தராயிருக்கிற
  rationale: செல்வத்தின் உருவகத்தையும் ἐν ἐλέει என்பதன் சொற்படிமத்தையும் காக்கிறது; கடவுளிடம் இரக்கம் மிகுதியாக இருப்பதைத் தெரிவிக்கிறது.
- source_word: διὰ τὴν πολλὴν ἀγάπην αὐτοῦ
  choice: நம்மீது அவர் கொண்ட மாபெரும் அன்பினால்
  rationale: διά + குற்றுவேற்றுமையின் காரணப் பொருளை ‘அன்பினால்’ எனக் காட்டுகிறது; πολλήν என்பதன் வலிமையை ‘மாபெரும்’ தக்கவைக்கிறது. தமிழில் இயல்புக்காக ‘நம்மீது அவர் கொண்ட’ முன்வைக்கப்படுகிறது.
- source_word: ἣν ἠγάπησεν ἡμᾶς
  choice: அந்த அன்பினால் அவர் நம்மை நேசித்தார்
  rationale: ἀγάπην ... ἠγάπησεν என்ற பெயர்ச்சொல்–வினைச்சொல் மீளுரையை ‘அன்பு ... நேசித்தார்’ என முடிந்தவரை வெளிப்படையாகக் காக்கிறது; உறவுப்பெயர்ச்சொல் தொடரை நவீன தமிழில் தெளிவாக அமைக்கிறது.
theological_decisions:
- issue: ‘அன்பு ... நேசித்தார்’ என்ற ஒரே வேர்ச் சொல்லைச் சார்ந்த வலியுறுத்தலைத் தக்கவைத்தல்
  choice: ‘நம்மீது அவர் கொண்ட மாபெரும் அன்பினால்—அந்த அன்பினால் அவர் நம்மை நேசித்தார்—’
  alternative: ‘நம்மீது அவர் கொண்ட மாபெரும் அன்பினால்’ என்று மட்டும் சுருக்குதல்
  rationale: கிரேக்கத்தில் ἀγάπην ... ἠγάπησεν என நோக்கமுள்ள பெயர்ச்சொல்–வினைச்சொல் மீளுரை உள்ளது. தமிழில் ஒரே வேர் இயல்பாகக் கிடைக்காதபோதிலும் ‘அன்பு ... நேசித்தார்’ என்பதன் மூலம் அதன் சொல்லாட்சிசார் வலியுறுத்தல் காக்கப்படுகிறது.
- issue: இரக்கத்துக்கும் அன்புக்கும் உள்ள தொடர்பு
  choice: ‘இரக்கத்தில் செல்வந்தர்’ என்பதையும் ‘மாபெரும் அன்பினால்’ என்பதையும் தனித்தனியாக வைத்தல்
  alternative: ‘இரக்கமுள்ள அன்பினால்’ என இரண்டையும் ஒன்றிணைத்தல்
  rationale: மூலவாக்கியம் இரக்கத்தையும் அன்பையும் தொடர்புடைய, ஆனால் தனித்த கருத்துகளாக முன்வைக்கிறது; அவற்றை ஒன்றாக்குவது இறையியல் நுணுக்கத்தைச் சுருக்கும்.
- issue: வாக்கியம் அடுத்த வசனத்தில் தொடர்வது
  choice: முடிவில் நீண்ட கோடு வைத்து தொடர்ச்சியைச் சுட்டுதல்
  alternative: முற்றுப்புள்ளியுடன் தனி வாக்கியமாக முடித்தல்
  rationale: கிரேக்கத்தில் இவ்வசனம் பிரதான வினைச்செயலை இன்னும் வழங்காமல் அடுத்த வசனத்திற்குத் தொடர்கிறது. இதை முழுமையான தனி வாக்கியமாக மாற்றாமல் தொடர்ச்சியையும் எதிர்பார்ப்பையும் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகருக்குப் புரியும் நடை. ‘செல்வந்தர்’ என்ற உருவகம் மூலத்தின் πλούσιος என்பதைக் காக்கிறது. ‘அவர்’ மரியாதை ஒருமையாகக் கடவுளைக் குறிக்கிறது. வசனம் இலக்கண ரீதியாக அடுத்த வசனத்துடன் தொடருவதால் நீண்ட கோட்டில் முடிகிறது.
