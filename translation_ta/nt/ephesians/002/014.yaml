source:
  edition: SBLGNT
  text: αὐτὸς γάρ ἐστιν ἡ εἰρήνη ἡμῶν, ὁ ποιήσας τὰ ἀμφότερα ἓν καὶ τὸ μεσότοιχον τοῦ φραγμοῦ λύσας, τὴν ἔχθραν ἐν τῇ σαρκὶ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/014.yaml
  text: For he himself is our peace[a], who made both one and broke down the dividing wall of the barrier—the hostility—in his flesh[d][c][b],
translation:
  language: ta
  text: ஏனெனில், அவரே நமது சமாதானம்; இரு தரப்பினரையும் ஒன்றாக்கி, பிரிக்கும் தடுப்புச் சுவரை—அதாவது பகைமையை—தமது மாம்சத்தில் தகர்த்தவர் அவரே.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτὸς
  choice: அவரே
  rationale: வலியுறுத்தும் சுட்டுப்பெயரின் அழுத்தத்தைக் காக்கிறது; கிறிஸ்து சமாதானத்தை ஏற்படுத்துபவர் மட்டுமல்ல, அவரே நமது சமாதானம் என்பதைக் காட்டுகிறது.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἡ εἰρήνη ἡμῶν
  choice: நமது சமாதானம்
  rationale: εἰρήνη என்பதன் வழக்கமான பொருளையும், இங்கு கிறிஸ்துவில் உருவாகும் ஒப்புரவையும் காக்கிறது.
- source_word: τὰ ἀμφότερα
  choice: இரு தரப்பினரையும்
  rationale: சூழலில் யூதர்களும் யூதரல்லாதவர்களும் குறிக்கப்படுகின்றனர்; 'இரண்டையும்' என்பதைக் காட்டிலும் மனிதக் குழுக்களைக் குறிக்கும் இயல்பான தமிழ்.
- source_word: ἓν
  choice: ஒன்றாக்கி
  rationale: இரு தரப்பையும் ஒன்றாக ஆக்கிய முடிவைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: τὸ μεσότοιχον τοῦ φραγμοῦ
  choice: பிரித்து நின்ற தடுப்புச் சுவர்
  rationale: μεσότοιχον மற்றும் φραγμός ஆகியவற்றின் பிரிப்பு, தடை என்ற உருவகத்தை மீளுரையாக்காமல் இயல்பான தமிழில் காக்கிறது.
- source_word: λύσας
  choice: தகர்த்தவர்
  rationale: சுவர் உருவகத்துக்கு ஏற்றவாறு அதை இடித்து அகற்றிய செயலைத் தெரிவிக்கிறது.
- source_word: τὴν ἔχθραν
  choice: பகைமையை
  rationale: உறவுகளுக்கிடையிலான விரோதத்தை நவீன, தெளிவான தமிழில் குறிக்கிறது.
- source_word: ἐν τῇ σαρκὶ αὐτοῦ
  choice: தமது மாம்சத்தில்
  rationale: σάρξ என்பதன் சொற்படிவத்தையும் கிறிஸ்துவின் உடல்சார்ந்த மரணத்தை நோக்கும் கருத்தையும் காக்கிறது; 'பாவ இயல்பு' என்ற தவறான பொருளைத் தவிர்க்கிறது.
theological_decisions:
- issue: τὰ ἀμφότερα என்பதன் குறிப்பு
  choice: இரு தரப்பினரையும்
  alternative: இரண்டையும்
  rationale: உடனடிச் சூழல் யூதர்களையும் யூதரல்லாதவர்களையும் எதிரெதிராகக் குறிப்பிடுகிறது. பெயர்களை வசனத்துக்குள் சேர்க்காமல் மனிதக் குழுக்கள் என்பதைக் காட்டுகிறது.
- issue: τὴν ἔχθραν என்பதன் தொடரியல் உறவு
  choice: தடுப்புச் சுவரை விளக்கும் இணைப்பாகிய 'தடுப்புச் சுவராகிய பகைமை'
  alternative: பகைமையைத் தனியான இரண்டாவது செயப்படுபொருளாகக் கொள்ளுதல்
  rationale: கிரேக்கத்தில் 'பகைமை' முன் கூறிய தடையை விளக்கும் இணைப்பாகப் படிக்க இயலும்; அதேவேளை சிந்தனை அடுத்த வசனத்திலும் தொடர்கிறது. இந்த வடிவம் அந்த உறவை இயல்பான தமிழில் காட்டுகிறது.
- issue: ἐν τῇ σαρκὶ αὐτοῦ எதனுடன் இணைகிறது
  choice: தகர்த்த செயலுடன் இணைத்தல்
  alternative: '''அவருடைய மாம்சத்திலிருந்த பகைமை'' என்று இணைத்தல்'
  rationale: பகைமை கிறிஸ்துவின் மாம்சத்துக்குள் இருந்ததாகத் தவறாகப் புரிந்துகொள்ளப்படாமல், அவர் தமது மாம்சத்தில் அதைத் தகர்த்தார் என்ற பொருளைத் தெளிவாக்குகிறது.
- issue: σάρξ என்பதன் மொழிபெயர்ப்பு
  choice: மாம்சம்
  alternative: உடல்
  rationale: மூலச்சொல்லின் உடல்சார்ந்த வலிமையையும் கிறிஸ்துவின் உருவேற்றம் மற்றும் மரணத்துடனான தொடர்பையும் காக்கிறது; இங்கு அது 'பாவ இயல்பு' அல்ல.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு விளங்கும் வகையில் இயல்பாகவும், வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. வசனம் கிரேக்கத்தில் அடுத்த வசனத்துக்குத் தொடரும் நீண்ட வாக்கியத்தின் ஒரு பகுதி; தமிழில் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டது.
