revisions:
- from: 'ஆகையால், முன்பு உடலின்படி பிற இனத்தவர்களாக இருந்த நீங்கள்[a]—உடலில் கையால் செய்யப்பட்ட “விருத்தசேதனம்” எனப்படும் தரப்பினரால் “விருத்தசேதனம் இல்லாதவர்கள்” என்று அழைக்கப்பட்ட நீங்கள்[b][c]—நினைவில் கொள்ளுங்கள்:'
  to: 'ஆகையால், முன்பு உடலின்படி பிற இனத்தவர்களாக இருந்த நீங்கள்[a]—உடலில் கையால் செய்யப்பட்ட விருத்தசேதனத்தைக் கொண்ட, “விருத்தசேதனம்” எனப்படுகிறவர்களால் “விருத்தசேதனம் இல்லாதவர்கள்” என்று அழைக்கப்பட்டவர்கள்[b][c]—நினைவில் கொள்ளுங்கள்:'
  rationale: The revision keeps the audience’s former Gentile bodily/ethnic status, the two parallel conventional labels, and the possible rhetorical qualification conveyed by λεγομένης. It clarifies that “made by hands in the flesh” describes the circumcision possessed by the calling group. The colon is retained because the thought continues into verse 12.
