source:
  edition: SBLGNT
  text: Διὸ μνημονεύετε ὅτι ⸂ποτὲ ὑμεῖς⸃ τὰ ἔθνη ἐν σαρκί, οἱ λεγόμενοι ἀκροβυστία ὑπὸ τῆς λεγομένης περιτομῆς ἐν σαρκὶ χειροποιήτου,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/011.yaml
  text: Therefore remember that formerly you[a], the Gentiles in the flesh[d][c][b], who are called “uncircumcision” by what is called “circumcision,” made by hands in the flesh—
translation:
  language: ta
  text: 'ஆகையால், முன்பு உடலின்படி பிற இனத்தவர்களாக இருந்த நீங்கள்[a]—உடலில் கையால் செய்யப்பட்ட விருத்தசேதனத்தைக் கொண்ட, “விருத்தசேதனம்” எனப்படுகிறவர்களால் “விருத்தசேதனம் இல்லாதவர்கள்” என்று அழைக்கப்பட்டவர்கள்[b][c]—நினைவில் கொள்ளுங்கள்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “முன்பு உடலின்படி பிற இனத்தவர்களாக இருந்த நீங்கள்” என்பதை “முன்பு மாம்சத்தில் இருந்த பிற இனத்தவர்களாகிய நீங்கள்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் “நீங்கள்” என்பது வலியுறுத்தப்படுகிறது; “பிற இனத்தவர்கள்” என்பது இங்கு யூதரல்லாதவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “விருத்தசேதனம்” மற்றும் “விருத்தசேதனம் இல்லாதவர்கள்” என்பவை இங்கு வெறும் உடற்கூறு விளக்கங்கள் அல்ல; உடன்படிக்கை மற்றும் இன அடையாளப் பட்டங்கள்.
    reason: cultural_note
  - marker: c
    text: சொல்லர்த்தத்திற்கு நெருக்கமாக, “உடலில் கையால் செய்யப்பட்ட, ‘விருத்தசேதனம்’ என்று அழைக்கப்படுவதால்” எனலாம். “எனப்படுகிற” என்ற பவுலின் சொல், வெளிப்புற விருத்தசேதனத்தைப் பற்றிய ஓர் அளவான விமர்சனத் தொனியைக் கொண்டிருக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: Διὸ
  choice: ஆகையால்
  rationale: முந்தைய கருத்திலிருந்து வரும் முடிவை இயல்பான தமிழில் குறிக்கிறது.
- source_word: μνημονεύετε
  choice: நினைவில் கொள்ளுங்கள்
  rationale: பன்மை நிகழ்காலக் கட்டளையின் வலிமையைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ποτὲ ὑμεῖς
  choice: முன்பு ... இருந்த நீங்கள்
  rationale: கடந்த நிலைக்கும் தற்போதைய நிலைக்கும் உள்ள கால வேறுபாட்டையும் ‘நீங்கள்’ என்பதற்கான அழுத்தத்தையும் காக்கிறது.
- source_word: τὰ ἔθνη
  choice: பிற இனத்தவர்கள்
  rationale: இங்கு அரசியல் நாடுகளை அல்ல, யூதரல்லாத மக்களைக் குறிக்கிறது; நவீன தமிழில் இச்சொற்றொடர் தெளிவானது.
- source_word: ἐν σαρκί
  choice: உடலின்படி / உடலில்
  rationale: இவ்விடத்தில் σάρξ பாவ இயல்பைக் குறிக்காமல் உடல்சார்ந்த இன-உடன்படிக்கை அடையாளத்தைக் குறிக்கிறது; இயல்பான தமிழுக்காக ‘உடல்’ பயன்படுத்தப்பட்டது.
- source_word: ἀκροβυστία
  choice: “விருத்தசேதனம் இல்லாதவர்கள்”
  rationale: உடற்கூறை மட்டும் விவரிக்காமல், பிற இனத்தவர்களுக்கு இடப்பட்ட கூட்டு இன-சமயப் பட்டமாகச் செயல்படுவதைக் காட்டுகிறது.
- source_word: ὑπὸ τῆς λεγομένης περιτομῆς
  choice: “விருத்தசேதனம்” எனப்படும் தரப்பினரால்
  rationale: περιτομή என்ற கருத்துப்பெயர் விருத்தசேதனம் பெற்ற குழுவைக் குறிக்கும் விதத்தை தமிழில் புரியும்படி வெளிப்படுத்துகிறது; λεγομένης தரும் சொல்லாடல் இடைவெளியும் காக்கப்படுகிறது.
- source_word: ἐν σαρκὶ χειροποιήτου
  choice: உடலில் கையால் செய்யப்பட்ட
  rationale: χειροποίητος என்பதன் ‘மனிதக் கையால் செய்யப்பட்டது’ என்ற பொருளையும், அது வெளிப்புற உடல் அடையாளம் என்பதையும் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: σάρξ என்பதன் பொருள்
  choice: உடல்
  alternative: மாம்சம்
  rationale: இங்கு ஒழுக்கச் சீர்கேடோ ‘பாவ இயல்போ’ குறிக்கப்படவில்லை; உடல்சார்ந்த இன மற்றும் உடன்படிக்கை நிலையே குறிக்கப்படுகிறது. ஆகவே தமிழில் தவறான இறையியல் பொருள் எழாமல் ‘உடல்’ தேர்ந்தெடுக்கப்பட்டது.
- issue: λεγομένης περιτομῆς என்பதிலுள்ள சொல்லாடல் இடைவெளி
  choice: “விருத்தசேதனம்” எனப்படும் தரப்பினர்
  alternative: விருத்தசேதனம் பெற்றவர்கள்
  rationale: இரு குழுக்களும் எவ்வாறு ‘அழைக்கப்படுகின்றன’ என்ற பவுலின் இணையான சொல்லமைப்பையும், வெளிப்புற அடையாளத்தின் மீதான சாத்தியமான விமர்சனத் தொனியையும் மிகைப்படுத்தாமல் காக்கிறது.
- issue: ἀκροβυστία மற்றும் περιτομή ஆகியவற்றின் கூட்டு அடையாளப் பயன்பாடு
  choice: மக்கள் குழுக்களுக்கான அடையாளப் பட்டங்களாக மொழிபெயர்த்தல்
  alternative: உடலமைப்பை மட்டும் குறிக்கும் பெயர்ச்சொற்களாக மொழிபெயர்த்தல்
  rationale: இச்சூழலில் அவை வெறும் உடற்கூறு விளக்கங்கள் அல்ல; யூதர்–பிற இனத்தவர் என்ற உடன்படிக்கை மற்றும் இனப் பிரிவைக் குறிக்கும் வழக்குப் பெயர்கள்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. நீண்ட கிரேக்க வாக்கியத்தின் இடைச்செருகலை இரட்டை இடைக்கோடுகள் காக்கின்றன; அடுத்த வசனத்துடன் கருத்து தொடர்வதை உணர்த்த இறுதியில் முக்காற்புள்ளி இடப்பட்டது. ‘விருத்தசேதனம்’ என்ற நிலைபெற்ற வேதாகமச் சொல் தக்கவைக்கப்பட்டு, குழுவைக் குறிக்கும் பொருள் வெளிப்படையாகச் சொல்லப்பட்டது.
