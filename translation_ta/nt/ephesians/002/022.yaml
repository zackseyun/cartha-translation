  text: in whom you also are being built together into a dwelling place for God in the Spirit[a][b].
translation:
  language: ta
  text: அவருக்குள்[a] நீங்களும் கடவுளுக்கான உறைவிடமாக ஆவியானவரில்[b] ஒன்றாகக் கட்டப்பட்டு வருகிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இங்குள்ள தொடர்புப்பெயர் கிறிஸ்துவை நேரடியாகக் குறிக்காமல், முழுக் கட்டடத்தைக் குறிப்பதாக எடுத்துக்கொண்டால், ‘அதில்’.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘ஆவியில்’ அல்லது ‘ஆவியானவரால்’. இச்சொற்றொடர் கடவுள் வாசம்பண்ணும் சூழலைக் குறிக்கலாம்; அல்லது பரிசுத்த ஆவியானவரின் செயலாற்றுதலைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: அவருக்குள்
  rationale: முந்தைய வசனங்களில் உடனடியான முன்னிலைச் சுட்டு கிறிஸ்துவாக இருப்பதால், தனிப்பட்ட நபரைக் குறிக்கும் ‘அவருக்குள்’ இயல்பானது. இருப்பினும், முழுக் கட்டடத்தைக் குறிக்கும் வாய்ப்பும் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: καὶ
  choice: நீங்களும்
  rationale: καί என்பதன் சேர்க்கைப் பொருளைத் தமிழில் ‘-உம்’ இயல்பாக வெளிப்படுத்துகிறது; வாசகர்களும் கடவுளுடைய மக்களாகிய கட்டடத்தில் சேர்க்கப்படுவதை இது காட்டுகிறது.
- source_word: ὑμεῖς
  choice: நீங்கள்
  rationale: வலியுறுத்திக் கூறப்பட்ட இரண்டாம் நபர் பன்மையை நேரடியாகப் பாதுகாக்கிறது.
- source_word: συνοικοδομεῖσθε
  choice: ஒன்றாகக் கட்டப்பட்டு வருகிறீர்கள்
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவத்தின் தொடரும் செயலையும் σύν முன்னொட்டின் ‘ஒன்றாக’ என்ற பொருளையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: εἰς
  choice: உறைவிடமாக
  rationale: கட்டப்படுவதன் இலக்கு அல்லது விளைவைத் தமிழின் ‘-ஆக’ அமைப்பு இயல்பாகத் தெரிவிக்கிறது.
- source_word: κατοικητήριον
  choice: உறைவிடம்
  rationale: கடவுள் தங்கும் இடம் என்ற ஆலய உருவகத்தை நவீன, தெளிவான தமிழில் தருகிறது.
- source_word: τοῦ θεοῦ
  choice: கடவுளுக்கான
  rationale: கடவுளே அங்கு வசிப்பவர் என்ற உடைமை/நோக்க உறவைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἐν πνεύματι
  choice: ஆவியானவரில்
  rationale: எபேசியர் நிருபத்தின் ஆலயமும் கடவுளின் வாசமும் சார்ந்த சூழலில் பரிசுத்த ஆவியானவரே மிகச் சாத்தியமான குறிப்பு. ἐν என்பதின் இடம்/சூழல் நயத்தை ‘-இல்’ காக்கிறது; கருவிப்பொருள் சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: ἐν ᾧ என்பதன் முன்னிலைச் சுட்டு
  choice: கிறிஸ்துவைக் குறிப்பதாக ‘அவருக்குள்’
  alternative: முழுக் கட்டடத்தைக் குறிப்பதாக ‘அதில்’
  rationale: முந்தைய வசனத்தின் தொடரில் கட்டடம் கிறிஸ்துவுக்குள் இணைந்து வளர்கிறது; ஆகவே கிறிஸ்துவைச் சுட்டுவது சூழலுக்கு மிகவும் இயல்பானது. இலக்கண மற்றும் உருவக மாற்றுவாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἐν πνεύματι என்பதன் பொருள்
  choice: பரிசுத்த ஆவியானவரைக் குறிப்பதாக ‘ஆவியானவரில்’
  alternative: ‘ஆவியில்’ அல்லது ‘ஆவியானவரால்’
  rationale: ஆலயமும் கடவுளின் வாசமும் பற்றிய சூழல் பரிசுத்த ஆவியானவரின் பிரசன்னத்தையும் செயலையும் சுட்டுகிறது. மூலத்தின் ἐν என்பதைக் காத்து, அது சூழலையா செயலாற்றும் கருவியையா குறிக்கிறது என்பதை மொழிபெயர்ப்பு தேவையின்றி முடிவுசெய்யவில்லை.
