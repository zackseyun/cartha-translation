  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குத் தெளிவாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டது. ‘கட்டப்பட்டு வருகிறீர்கள்’ தொடரும் நிகழ்காலச் செயலைக் காக்கிறது; ‘உறைவிடம்’ ஆலய உருவகத்தை இயல்பாகப் பேணுகிறது.
