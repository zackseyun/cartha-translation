source:
  edition: SBLGNT
  text: καὶ ἀποκαταλλάξῃ τοὺς ἀμφοτέρους ἐν ἑνὶ σώματι τῷ θεῷ διὰ τοῦ σταυροῦ ἀποκτείνας τὴν ἔχθραν ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/016.yaml
  text: and might reconcile both to God in one body through the cross, having put the hostility to death by it.
translation:
  language: ta
  text: சிலுவையின் மூலம், பகைமையை அதன் மூலம் கொன்று, இரு தரப்பினரையும் ஒரே உடலில் கடவுளோடு ஒப்புரவாக்கவும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκαταλλάξῃ
  choice: ஒப்புரவாக்குவதற்காகவும்
  rationale: வலுப்படுத்தப்பட்ட ‘மீண்டும் ஒப்புரவாக்குதல்’ என்ற வினையின் கருத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; சூழலில் முந்தைய நோக்கக் கட்டமைப்பைத் தொடரும் வகையில் வினையெச்ச வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: τοὺς ἀμφοτέρους
  choice: இருவரையும்
  rationale: சூழலில் யூதர், பிற இனத்தார் ஆகிய இரு குழுக்களையும் குறிக்கும் கிரேக்கச் சொல்லைச் சுருக்கமாகவும் துல்லியமாகவும் வழங்குகிறது.
- source_word: ἐν ἑνὶ σώματι
  choice: ஒரே உடலில்
  rationale: ‘ஒரு/ஒரே உடலில்’ என்ற உருவகத்தை விளக்கிச் சுருக்காமல் அப்படியே பாதுகாக்கிறது.
- source_word: διὰ τοῦ σταυροῦ
  choice: சிலுவையின் மூலம்
  rationale: சிலுவை ஒப்புரவின் வழிமுறை என்பதைக் காட்டும் διά + genitive அமைப்பை இயல்பாகத் தருகிறது.
- source_word: ἀποκτείνας τὴν ἔχθραν
  choice: பகைமையைக் கொன்று
  rationale: ‘பகைமையை கொன்றார்’ என்ற வலுவான மூல உருவகத்தை மென்மையாக்காமல் பாதுகாக்கிறது.
- source_word: ἐν αὐτῷ
  choice: சிலுவையின் மூலம்
  rationale: αὐτῷ என்பதன் முன்னிலைச் சுட்டு ‘சிலுவை’ எனப் புரிந்துகொள்ளப்பட்டு, கருவிப் பொருளில் இயல்பான தமிழில் வழங்கப்பட்டுள்ளது; மூலத்தின் சுட்டுப்பெயர் தெளிவின்மையைத் தீர்மானிக்கும் இத்தேர்வு கீழே பதிவு செய்யப்பட்டுள்ளது.
theological_decisions:
- issue: ἐν ἑνὶ σώματι என்பதிலுள்ள ‘ஒரே உடல்’ எதைக் குறிக்கிறது?
  choice: “ஒரே உடலில்” என்று உருவகத்தைத் திறந்தவாறே வைத்தல்
  alternative: “ஒரே திருச்சபையாக” அல்லது “தமது ஒரே உடலில்” என்று விளக்குதல்
  rationale: இது கிறிஸ்துவின் உடலையோ, ஒன்றுபட்ட புதிய மனிதகுலம்/திருச்சபையையோ சுட்டலாம்; மொழிபெயர்ப்பு குறிப்பிட்ட விளக்கத்தைத் திணிக்காமல் மூலத்தின் இறையியல் செறிவைப் பாதுகாக்கிறது.
- issue: ἐν αὐτῷ என்பதன் antecedent மற்றும் பொருள்
  choice: “சிலுவையின் மூலம்”
  alternative: “அதில்,” அதாவது ஒரே உடலில்; அல்லது “அவரில்”
  rationale: அருகிலுள்ள σταυρός (சிலுவை) ஆண்பால் பெயர்ச்சொல்லுடன் αὐτῷ இயைந்து வருவதாலும், சிலுவையால் பகைமை கொல்லப்பட்டது என்ற பொருள் சூழலுக்கு ஏற்றதாலும் இவ்வாசிப்பு தேர்ந்தெடுக்கப்பட்டது. இருப்பினும் இலக்கண ரீதியாக வேறு தொடர்புகளுக்குச் சிறு வாய்ப்பு உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. வசனம் முந்தைய வாக்கியத்தின் நோக்கத் தொடராக இருப்பதால் இறுதியில் “-வதற்காகவும்” பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘ஒரே உடல்’ மற்றும் ‘பகைமையைக் கொன்று’ என்ற உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன.
