  text: καὶ συνήγειρεν καὶ συνεκάθισεν ἐν τοῖς ἐπουρανίοις ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/006.yaml
  text: and raised us up with him and seated us with him in the heavenly places in Messiah Jesus[b][a],
translation:
  language: ta
  text: மேலும், மேசியாவாகிய இயேசுவுக்குள்[a] அவர் நம்மை அவரோடு எழுப்பி, வானுலகங்களில் அவரோடு அமரச் செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்து இயேசுவுக்குள்.”
    reason: Χριστός என்பதற்கான மரபான மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: συνήγειρεν
  choice: நம்மை அவரோடு எழுப்பி
  rationale: συν- முன்னொட்டு இயேசுவோடு பகிர்ந்த பங்கேற்பைக் குறிக்கிறது. முந்தைய வசனச் சூழலிலிருந்து வரும் ‘நம்மை’ என்ற செயப்படுபொருளையும், ‘அவரோடு’ என்பதன் மூலம் கூட்டுப்பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: συνεκάθισεν
  choice: அவரோடு அமரச் செய்தார்
  rationale: ‘ஒன்றாக அமரச் செய்தல்’ என்ற வினையின் பொருளைத் தெளிவாகத் தருகிறது; ‘அரியணையில் அமர்த்தினார்’ என்று சூழல் சுட்டக்கூடிய கருத்தைத் தேவையின்றி வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: வானுலகங்களில்
  rationale: பெயரடை பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்டுள்ள கிரேக்கப் பன்மையை, பரலோகத் தளங்கள் அல்லது வட்டாரங்கள் என்ற இடப்பொருளுடன் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: மேசியாவாகிய இயேசுவுக்குள்
  rationale: Χριστός என்பதன் பட்டப்பெயர்ப் பொருளை ‘மேசியா’ என்று காத்து, ἐν என்பதன் ஒன்றிப்பைக் குறிக்கும் ‘உள்’ பொருளையும் வெளிப்படுத்துகிறது.
- source_word: καὶ
  choice: மேலும் … -உம்
  rationale: முந்தைய வாக்கியத்தோடு தொடரும் செயல்களின் கூட்டு வரிசையை தமிழில் இயல்பாகத் தொடர்கிறது.
theological_decisions:
- issue: συν- கூட்டுவினைகளில் கிறிஸ்துவோடுள்ள பங்கேற்பு
  choice: இரு வினைகளிலும் ‘அவரோடு’ என்பதை வெளிப்படையாகக் கூறுதல்
  alternative: ‘நம்மை எழுப்பி, அமரச் செய்தார்’ என்று தொடர்பை மறைமுகமாக விடுதல்
  rationale: இரு கிரேக்க வினைகளும் இயேசுவுடன் சேர்ந்து நிகழும் பங்கேற்பைச் சொல்கின்றன; ‘அவரோடு’ என்பது அந்த வலியுறுத்தலைக் கூட்டுப் பொருள் சேர்க்காமல் காக்கிறது.
- issue: Χριστῷ என்பது பட்டப்பெயரா அல்லது பெயரைப் போன்ற நிலையான வடிவமா
  choice: மேசியாவாகிய இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: இங்கு Χριστός என்பதன் ‘அபிஷேகம் பெற்றவர்/மேசியா’ என்ற பட்டப்பெயர்ப் பொருள் இன்னும் தெளிவாக உள்ளது; அதே நேரத்தில் பரவலான மாற்றுவடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: இறந்தகால வினைகள் குறிக்கும் நிறைவேறிய நிலை
  choice: ‘எழுப்பி … அமரச் செய்தார்’ என்ற நிறைவேறிய செயல்களாக மொழிபெயர்த்தல்
  alternative: எதிர்கால நம்பிக்கையாக அல்லது வெறும் உருவக வாய்ப்பாக மாற்றிக் கூறுதல்
  rationale: கிரேக்க ஏோரிஸ்ட் வினைகள் செயலை நிறைவேறியதாக முன்வைக்கின்றன. அது உண்டாக்கும் இறையியல் பதற்றத்தை மொழிபெயர்ப்பு தணிக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘வானுலகங்களில்’ என்பது கிரேக்கப் பன்மையையும் இடம்/வட்டாரம் என்ற பொருளையும் சுருக்கமாகத் தருகிறது; ‘அவரோடு’ என்ற மீளுரை மூலத்தின் இரு கூட்டுவினைகளிலுள்ள வலியுறுத்தலைப் பாதுகாக்கிறது.
