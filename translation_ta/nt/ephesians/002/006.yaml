  source_fidelity: மூலத்தின் இரண்டு συν- கூட்டுவினைகளும் ‘அவரோடு’ என்று இரு இடங்களிலும் துல்லியமாக வெளிப்படுத்தப்பட்டுள்ளன. ἐν τοῖς ἐπουρανίοις என்பதற்கான ‘வானுலகங்களில்’ இடப்பொருளையும் பன்மைச் சாயலையும் காக்கிறது; ἐν Χριστῷ Ἰησοῦ என்பதும் ‘மேசியாவாகிய இயேசுவுக்குள்’ என ஒன்றிப்பு உறவுடன் தரப்பட்டுள்ளது. தொடக்க ‘மேலும்’ προηγிய சூழலோடு இணைக்கும் καὶ-யின் சேர்க்கைத் தன்மைக்கு ஏற்றது.
