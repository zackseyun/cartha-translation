  terminology: ‘மேசியாவாகிய இயேசு’ என்பது Χριστός-இன் பட்டப்பெயர்ப் பொருளைச் சரியாகக் காக்கிறது. மாற்றாகப் பரவலாகப் பயன்படும் ‘கிறிஸ்து இயேசு’ அடிக்குறிப்பில் முறையாகக் கொடுக்கப்பட்டுள்ளது. ‘வானுலகங்கள்’ இங்கு எளிதில் புரியத்தக்க, பதிவுக்கு ஏற்ற சொல்லாக உள்ளது.
