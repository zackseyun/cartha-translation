source:
  edition: SBLGNT
  text: ἐν αἷς ποτε περιεπατήσατε κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου, κατὰ τὸν ἄρχοντα τῆς ἐξουσίας τοῦ ἀέρος, τοῦ πνεύματος τοῦ νῦν ἐνεργοῦντος ἐν τοῖς υἱοῖς τῆς ἀπειθείας·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/002.yaml
  text: in which you once walked[a], according to the age of this world, according to the ruler of the authority of the air[c][b], the spirit now at work in the sons of disobedience.
translation:
  language: ta
  text: நீங்கள் முன்பு அவற்றில் வாழ்ந்தீர்கள்[a]; இவ்வுலகத்தின் யுகத்துக்கு[b] ஏற்பவும், காற்றின் அதிகாரத்தின்[c] ஆளுநனாகிய, கீழ்ப்படியாமையின் மகன்களுக்குள்[d] இப்போது செயல்படும் ஆவிக்கு ஏற்பவும் வாழ்ந்தீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “அவற்றில் நடந்தீர்கள்”; இது ஒருவரின் வாழ்க்கை முறையைக் குறிக்கும் உருவகம்.
    reason: lexical_alternative
  - marker: b
    text: '“யுகம்” என்பதற்கான கிரேக்கச் சொல் αἰών; இது இப்போதைய உலக ஒழுங்கின் காலத்தையும் அதன் நடைமுறையையும் குறிக்கலாம். வேறு மொழிபெயர்ப்பு: “இவ்வுலகத்தின் போக்குக்கு ஏற்ப.”'
    reason: lexical_alternative
  - marker: c
    text: “காற்று” என்பது பகைமையான ஆன்மிக வல்லமைகளுடன் தொடர்புபடுத்தப்பட்ட மண்டலத்தைக் குறிக்கும் பண்டைய உலகப்பார்வை மொழியைப் பிரதிபலிக்கிறது.
    reason: cultural_note
  - marker: d
    text: '“கீழ்ப்படியாமையின் மகன்கள்” என்பது கீழ்ப்படியாமையால் பண்புபெற்ற மக்களைக் குறிக்கும் மரபுத்தொடர். வேறு மொழிபெயர்ப்பு: “கீழ்ப்படியாமையின் பிள்ளைகள்” அல்லது “கீழ்ப்படியாதவர்கள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αἷς
  choice: அவற்றிலேயே
  rationale: முந்தைய வசனத்திலுள்ள ‘மீறுதல்களும் பாவங்களும்’ என்பவற்றைச் சுட்டும் பெண்பால் பன்மை சார்புப்பெயரின் தொடர்பையும், அவற்றுக்குள் வாழ்ந்த நிலையின் வலியுறுத்தலையும் காக்கிறது.
- source_word: ποτε περιεπατήσατε
  choice: நீங்கள் முன்பு வாழ்ந்துவந்தீர்கள்
  rationale: περιπατέω என்பதன் சொற்பொருள் ‘நடத்தல்’ என்றாலும், இங்கு வாழ்க்கை முறையைக் குறிக்கும் உருவகம். நவீனத் தமிழில் இயல்பாகப் புரிய ‘வாழ்ந்துவந்தீர்கள்’ என மொழிபெயர்க்கப்பட்டது; அடிக்குறிப்பில் உருவகம் தெரிவிக்கப்படுகிறது.
- source_word: κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου
  choice: இவ்வுலகத்தின் யுகத்துக்கு ஏற்ப
  rationale: αἰών (‘யுகம்’) மற்றும் κόσμος (‘உலகம்’) ஆகிய இரு வேறு சொற்களின் வேறுபாட்டைக் காத்து, κατά குறிக்கும் ஒத்திசைவு அல்லது பின்பற்றுதலை ‘ஏற்ப’ என வெளிப்படுத்துகிறது.
- source_word: τὸν ἄρχοντα τῆς ἐξουσίας τοῦ ἀέρος
  choice: காற்றிலுள்ள அதிகாரத்தின் ஆளுநன்
  rationale: ἄρχων என்பதற்கு தெளிவான ‘ஆளுநன்’ என்பதையும், ἐξουσία என்பதற்கு ‘அதிகாரம்’ என்பதையும் பயன்படுத்தி, தொடர்ச்சியான கிரேக்க உரிமைவேற்றுமை அமைப்பை இயன்றவரை காக்கிறது.
- source_word: τοῦ πνεύματος τοῦ νῦν ἐνεργοῦντος
  choice: இப்போது செயல்பட்டுக்கொண்டிருக்கும் ஆவி
  rationale: சூழலில் இது பரிசுத்த ஆவியைக் குறிக்காததால் ‘ஆவி’ எனச் சிற்றெழுத்துப் பொருளில் கொள்ளப்படுகிறது; நிகழ்காலச் செயற்பாட்டின் தொடர்ச்சியை ‘செயல்பட்டுக்கொண்டிருக்கும்’ காட்டுகிறது.
- source_word: ἐν τοῖς υἱοῖς τῆς ἀπειθείας
  choice: கீழ்ப்படியாமையின் மகன்களில்
  rationale: செமித்திய மரபுத்தொடரையும் υἱοί என்பதன் ஆண்பால் வடிவையும் காக்கிறது; அதன் பண்புசார் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: ‘இப்போது செயல்படும் ஆவி’ என்பதற்கும் ‘காற்றிலுள்ள அதிகாரத்தின் ஆளுநன்’ என்பதற்கும் உள்ள தொடர்பு
  choice: கோடுகளுக்குள் ‘அதாவது’ என்று அமைத்து, ஆவி என்ற தொடர் முந்தைய தீய ஆளும் வல்லமையை மேலும் விவரிப்பதாகக் காட்டப்பட்டது.
  alternative: இது சாத்தானுக்கான முற்றிலும் ஒரே இரண்டாம் பெயர் எனத் திட்டவட்டமாக்குதல்; அல்லது ஆளுநனுக்குக் கீழ்ப்பட்ட தனியான ஆளற்ற ஆன்மிக சக்தியாக விளக்குதல்.
  rationale: கிரேக்க உரிமைவேற்றுமைத் தொடரும் சொல்லமைப்பும் விளக்கநிலைத் தொடர்பை அனுமதிக்கின்றன; ஆனால் அந்த ஆவியின் இருப்பியல் இயல்பை வசனம் தெளிவாக வரையறுக்கவில்லை. ஆகவே தொடர்பு காட்டப்பட்டாலும் அது மேலதிகமாகத் தீர்மானிக்கப்படவில்லை.
- issue: υἱοῖς τῆς ἀπειθείας என்ற மரபுத்தொடர்
  choice: முதன்மை உரையில் ‘கீழ்ப்படியாமையின் மகன்கள்’ எனப் பாலினத் துல்லியத்துடன் வைக்கப்பட்டது.
  alternative: ‘கீழ்ப்படியாமையின் பிள்ளைகள்’ அல்லது ‘கீழ்ப்படியாதவர்கள்’.
  rationale: மூலத்தின் ஆண்பால் பெயர்ச்சொல்லையும் மரபுத்தொடரையும் காக்கிறது; இது கீழ்ப்படியாமையால் பண்புபெற்ற மக்களைக் குறிக்கும் என்பது அடிக்குறிப்பில் தெளிவாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் dignified நடை பயன்படுத்தப்பட்டது. ‘வாழ்ந்துவந்தீர்கள்’ இயல்பான தமிழ் நடைக்காகத் தேர்ந்தெடுக்கப்பட்டாலும், ‘நடந்தீர்கள்’ என்ற பவுலின் உருவகம் அடிக்குறிப்பில் காக்கப்பட்டது. ‘யுகம்’, ‘அதிகாரம்’, ‘ஆளுநன்’, ‘ஆவி’ ஆகியவை மூலத்தின் கருத்து வேறுபாடுகளையும் இறையியல் பதற்றத்தையும் சுருக்காமல் தக்கவைக்கின்றன.
