source:
  edition: SBLGNT
  text: καὶ ὄντας ἡμᾶς νεκροὺς τοῖς παραπτώμασιν συνεζωοποίησεν τῷ Χριστῷ— χάριτί ἐστε σεσῳσμένοι—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/005.yaml
  text: even when we were dead in our trespasses[a], he made us alive together with Messiah—by grace you have been saved—
translation:
  language: ta
  text: நாம் நம் மீறுதல்களில் இறந்தவர்களாக இருந்தபோதும், அவர் நம்மை மேசியாவுடன்[a] சேர்த்து உயிர்ப்பித்தார்—அருளால் நீங்கள் மீட்கப்பட்டிருக்கிறீர்கள்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்துவுடன்.” கிரேக்கச் சொல்லான Χριστός என்பது “அபிஷேகம் செய்யப்பட்டவர்” என்ற பட்டம்; இங்கு அதன் பொருளைக் காக்க “மேசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: translation_alternative
lexical_decisions:
- source_word: ὄντας ἡμᾶς νεκροὺς
  choice: நாம் ... இறந்தவர்களாக இருந்தபோதும்
  rationale: இந்தப் பங்கேற்புவினை அமைப்பு காலத்தையும் விட்டுக்கொடுக்கும் பொருளையும் கொண்டிருக்கலாம். சூழலில் உள்ள முரண்பாட்டை இயல்பான தமிழில் காட்ட “இருந்தபோதும்” பயன்படுத்தப்பட்டது.
- source_word: τοῖς παραπτώμασιν
  choice: நம் மீறுதல்களில்
  rationale: இவ்விடத்து வேற்றுமை உருபு காரணத்தையோ வாழ்நிலையின் தளத்தையோ குறிக்கக்கூடும். “மீறுதல்களில்” என்பது பவுலின் உருவகத்தைப் பாதுகாத்து, காரணப்பொருளை மட்டும் கட்டாயப்படுத்தாமல் விடுகிறது; “நம்” என்பது முதலாம் நபர் பன்மைச் சூழலிலிருந்து வெளிப்படையாக வழங்கப்படுகிறது.
- source_word: συνεζωοποίησεν
  choice: நம்மை ... சேர்த்து உயிர்ப்பித்தார்
  rationale: கூட்டு வினைச்சொல்லில் உயிரளித்தல் மற்றும் ஒருவருடன் இணைந்து நிகழ்தல் ஆகிய இரண்டும் உள்ளன. தமிழ் சொல் வரிசையில் “சேர்த்து உயிர்ப்பித்தார்” அவற்றை இயல்பாகத் தெரிவிக்கிறது.
- source_word: τῷ Χριστῷ
  choice: மேசியாவுடன்
  rationale: இங்கு Χριστός அபிஷேகம் செய்யப்பட்ட அரசரைக் குறிக்கும் பட்டமாகச் செயல்படுகிறது. உடனிகழ்ச்சி வேற்றுமை “உடன்” மூலம் வெளிப்படுத்தப்படுகிறது.
- source_word: χάριτί
  choice: அருளால்
  rationale: கருவிப் பொருளைச் சுருக்கமாகவும் தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் தெளிவாகவும் தெரிவிக்கிறது; மூலத்தில் இல்லாத “மட்டுமே” என்ற வலியுறுத்தல் சேர்க்கப்படவில்லை.
- source_word: ἐστε σεσῳσμένοι
  choice: நீங்கள் மீட்கப்பட்டிருக்கிறீர்கள்
  rationale: சுற்றுவழிப் பூர்த்திநிலை அமைப்பு, முடிந்த செயலில் இருந்து தொடரும் தற்போதைய நிலையையும் செயப்பாட்டு வடிவையும் காட்டுகிறது. “மீட்கப்பட்டிருக்கிறீர்கள்” இவ்விரண்டையும் காக்கிறது.
theological_decisions:
- issue: Χριστῷ என்பதன் மொழிபெயர்ப்பு
  choice: மேசியாவுடன்
  alternative: கிறிஸ்துவுடன்
  rationale: Χριστός இங்கு பெயராக மட்டுமல்ல, பட்டமாகவும் பொருள் தருவதால் “மேசியா” அதன் எதிர்பார்க்கப்பட்ட அபிஷேகம் செய்யப்பட்டவரைப் பற்றிய பொருளைக் காக்கிறது. பழக்கமான “கிறிஸ்து” வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: χάριτί ἐστε σεσῳσμένοι என்ற இடைச்செருகலின் நடை
  choice: நீண்ட கோடுகளுக்குள் திடீர் வலியுறுத்தலாக வைத்தல்
  alternative: வாக்கியத்தோடு இடைநிறுத்தமின்றி இணைத்தல்
  rationale: இந்தத் திடீர் இடைச்செருகல் அருளை வலியுறுத்தி 8–9ஆம் வசனங்களின் விரிவான விளக்கத்தை முன்கூட்டியே சுட்டுகிறது. மூலத்தின் சொல்லாட்சி இயக்கம் காக்கப்படுகிறது.
- issue: τοῖς παραπτώμασιν என்பதன் தொடர்பு
  choice: மீறுதல்களில்
  alternative: மீறுதல்களால்
  rationale: வேற்றுமை உருபு தளம்/தொடர்பு அல்லது காரணம் எனப் புரியக்கூடியது. “மீறுதல்களில்” இறந்த நிலையின் தளத்தை நேரடியாகக் காத்து, காரணப்பொருளைத் தீர்மானித்து விடாமல் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதைமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. “மீறுதல்கள்,” “அருள்,” “மீட்கப்பட்டிருக்கிறீர்கள்” ஆகியவை பழக்கமான இறையியல் சொற்களாக இருந்தாலும் வாக்கிய அமைப்பு இயல்பாக வைக்கப்பட்டுள்ளது. மூலத்தின் இடைச்செருகல் நீண்ட கோடுகளால் பாதுகாக்கப்பட்டுள்ளது.
