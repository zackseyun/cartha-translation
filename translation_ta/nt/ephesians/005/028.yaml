  text: In the same way, husbands also ought to love their own wives as their own bodies. He who loves his own wife loves himself,
translation:
  language: ta
  text: அவ்வாறே, கணவர்களும் தங்கள் சொந்த மனைவிகளைத் தங்கள் சொந்த உடல்களைப் போல அன்புகூரக் கடமைப்பட்டிருக்கிறார்கள். தன் சொந்த மனைவியை அன்புகூருகிறவன் தன்னையே அன்புகூருகிறான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: அவ்வாறே
  rationale: முந்தைய ஒப்புமையையும் அறிவுறுத்தலையும் தொடரும் பொருளை இயல்பான, சுருக்கமான தமிழில் தருகிறது.
- source_word: ὀφείλουσιν
  choice: கடமைப்பட்டிருக்கிறார்கள்
  rationale: இது கட்டளை வடிவமாக மாற்றாமல், வினைச்சொல்லில் உள்ள ஒழுக்கக் கடப்பாட்டைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: καὶ
  choice: உம்
  rationale: கணவர்களும் முன் கூறப்பட்ட மாதிரியைப் பின்பற்ற வேண்டும் என்ற சேர்க்கைப் பொருளைத் தருகிறது.
- source_word: οἱ ἄνδρες
  choice: கணவர்கள்
  rationale: மனைவிகளைப் பற்றிய திருமணச் சூழலில் ἀνήρ என்பது பொதுவாக ஆண்களை அல்ல, கணவர்களைக் குறிக்கிறது.
- source_word: ἀγαπᾶν / ἀγαπῶν / ἀγαπᾷ
  choice: அன்புகூர
  rationale: வசனத்தில் மீண்டும் வரும் ἀγαπάω என்ற ஒரே வினையின் சொற்பிணைப்பைத் தொடர்ந்து பாதுகாக்கிறது; dignified modern Tamil.
- source_word: τὰς ἑαυτῶν γυναῖκας
  choice: தங்கள் சொந்த மனைவிகளை
  rationale: γυναῖκας என்பதன் திருமணப் பொருளையும் ἑαυτῶν என்பதன் தற்சுட்டு வலியுறுத்தலையும் காக்கிறது.
- source_word: ὡς τὰ ἑαυτῶν σώματα
  choice: தங்கள் சொந்த உடல்களைப் போல
  rationale: ὡς குறிக்கும் ஒப்புமையை இயல்பான தமிழில் தருவதோடு σώματα என்பதை நேரடியாக ‘உடல்கள்’ என்று மொழிபெயர்க்கிறது.
- source_word: ὁ ἀγαπῶν τὴν ἑαυτοῦ γυναῖκα
  choice: தன் சொந்த மனைவியை அன்புகூருகிறவன்
  rationale: இது பெயர்ச்சொல் தன்மையுள்ள ஆண்பால் பங்கேற்பு வினையையும் உடனடி கணவர் குறிப்பையும், ἑαυτοῦ வலியுறுத்தலையும் காக்கிறது.
- source_word: ἑαυτὸν ἀγαπᾷ
  choice: தன்னையே அன்புகூருகிறான்
  rationale: தற்சுட்டுப் பெயர்ச்சொல்லையும் அதன் வலியுறுத்தலையும், வசனத்தின் திரும்பவரும் ‘அன்புகூர்’ வினையையும் நேரடியாகப் பிரதிபலிக்கிறது.
theological_decisions:
- issue: குடும்ப ஒழுங்கு அறிவுறுத்தலில் பாலினத்தைக் குறிக்கும் மொழி
  choice: οἱ ἄνδρες மற்றும் ὁ ἀγαπῶν ஆகியவற்றை ‘கணவர்கள்’, ‘அன்புகூருகிறவன்’ என ஆண்பால் குறிப்புடன் மொழிபெயர்த்தல்
  alternative: ‘ஆண்கள்’ அல்லது பாலினம் வெளிப்படாத ‘அன்புகூருபவர்’
  rationale: சூழல் மனிதகுலத்தைப் பற்றிய பொதுக்கூற்று அல்ல; கணவன்-மனைவி உறவைப் பற்றிய குறிப்பிட்ட அறிவுறுத்தல். ஆகவே மூலத்தின் திருமண மற்றும் பாலினக் குறிப்புகள் பாதுகாக்கப்படுகின்றன.
- issue: மனைவிக்கும் உடலுக்கும் இடையிலான ஒப்புமையின் இயல்பு
  choice: ஒப்புமையை வெளிப்படையாக வைத்து, இறுதிக் கூற்றை விரிவுபடுத்தாமல் மொழிபெயர்த்தல்
  alternative: இதை மெய்யியல் அடையாளக் கூற்றாக விளக்கி மொழிபெயர்த்தல்
  rationale: கணவன் மனைவியை நேசிப்பதைத் தன் உடலை நேசிப்பதுடன் பவுல் ஒப்பிட்டு, மனைவியை நேசிப்பவன் தன்னையே நேசிக்கிறான் என்கிறார். மொழிபெயர்ப்பு இந்த ஒழுக்க மற்றும் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது; கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. ‘அன்புகூருதல்’ என்ற சொல் மீளுமையைப் பாதுகாக்கிறது. மூலத்தில் இல்லாத விளக்கங்கள் சேர்க்கப்படவில்லை; அடிக்குறிப்புகள் தேவையில்லை.
