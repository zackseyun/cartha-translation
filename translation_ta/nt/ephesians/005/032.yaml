source:
  edition: SBLGNT
  text: τὸ μυστήριον τοῦτο μέγα ἐστίν, ἐγὼ δὲ λέγω εἰς Χριστὸν καὶ εἰς τὴν ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/032.yaml
  text: This mystery is great[c][b][a], but I am speaking with reference to Messiah and the church.
translation:
  language: ta
  text: இந்த மறைபொருள் மகத்தானது[a]; ஆனால் மெசியாவையும் சபையையும் குறித்து நான் பேசுகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த மறைபொருள் ஆழமானது.” கிரேக்கத்தில் நேரடியாக “பெரியது” என்று உள்ளது; அது ஆழத்தை மட்டும் அல்லாமல் பெருமையையோ முக்கியத்துவத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήριον
  choice: மறைபொருள்
  rationale: பவுலின் பயன்பாட்டில் இது வெறுமனே புரியாத புதிரை அல்ல, முன்பு மறைக்கப்பட்டிருந்து வெளிப்படுத்தப்பட்ட இறை உண்மையைக் குறிக்கிறது. ‘மறைபொருள்’ அந்தப் பொருளையும் இறையியல் கனத்தையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: μέγα
  choice: மகத்தானது
  rationale: கிரேக்கச் சொல்லின் நேரடிப் பொருளான பெருமையையும் முக்கியத்துவத்தையும் ‘மகத்தானது’ இயல்பாக வெளிப்படுத்துகிறது; அறிவுசார் ஆழம் என்ற ஒரே பொருளுக்குள் அதைச் சுருக்கவில்லை.
- source_word: δὲ
  choice: ஆனால்
  rationale: மறைபொருளைப் பற்றிய கூற்றிலிருந்து பவுல் தாம் எதைக் குறித்துப் பேசுகிறார் என்ற விளக்கத்துக்கு வரும் மென்மையான மாறுபாட்டை இது காட்டுகிறது.
- source_word: λέγω
  choice: பேசுகிறேன்
  rationale: நிகழ்கால வினையின் இயல்பான தமிழாக்கம்; ‘நான் பொருள்படுத்துவது’ என்று விளக்கத்தை மிகுதியாக்காமல் வினைச்செயலைத் தக்கவைக்கிறது.
- source_word: εἰς
  choice: குறித்து
  rationale: λέγω என்பதுடன் இங்கு திசையைக் காட்டாமல் தொடர்பையோ குறிப்பையோ காட்டுகிறது. ‘குறித்து’ என்பது தமிழில் தெளிவான, இயல்பான இணைப்பு.
- source_word: Χριστόν
  choice: மெசியா
  rationale: Χριστός இச்சூழலில் தனிப்பெயராக மட்டுமல்லாமல் அபிஷேகம் செய்யப்பட்டவர் என்ற பட்டப்பொருளுடன் செயல்படுவதால் ‘மெசியா’ எனத் தரப்பட்டுள்ளது.
- source_word: ἐκκλησίαν
  choice: சபை
  rationale: இங்கு குடிமக்கள் கூட்டத்தை அல்ல, இறைமக்களின் ஒருங்கிணைந்த சமூகத்தைச் சுட்டுகிறது. ‘சபை’ நவீனத் தமிழில் தெளிவாகவும் பரவலாகவும் புரிகிறது.
theological_decisions:
- issue: ‘இந்த மறைபொருள்’ எதைக் குறிக்கிறது?
  choice: திருமணம், ஆதியாகமம் 2:24 மேற்கோள், அல்லது மெசியாவுக்கும் சபைக்கும் இடையிலான உருவகத் தொடர்பு ஆகியவற்றில் ஒன்றை மட்டும் முதன்மை உரையில் தீர்மானிக்காமல், கிரேக்கத்தின் விளக்க நகர்வை அப்படியே வைத்தல்.
  alternative: இந்த மறைபொருள் ஒரே உடலாகும் திருமண ஒன்றிப்பை மட்டும் குறிக்கிறது; அல்லது ஆதியாகமம் 2:24-ஐ மட்டும் குறிக்கிறது; அல்லது திருமணம் மெசியா–சபை உறவை முன்குறிப்பதை மட்டும் குறிக்கிறது என்று வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: மூல உரை ‘இந்த மறைபொருள் மகத்தானது’ என்று கூறிவிட்டு, பவுல் மெசியாவையும் சபையையும் குறித்துப் பேசுவதாக விளக்குகிறது. அதன் சாத்தியமான குறிப்பை மொழிபெயர்ப்பிலேயே குறுகலாக முடிவுசெய்யாமல் இந்த இறையியல் இழுவிசையைப் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மகத்தானது’ என்பது ‘பெரியது’ என்பதைக் காட்டிலும் இச்சூழலில் இயல்பாக இருந்து, அளவை மட்டும் குறிக்கும் தவறான எண்ணத்தைத் தவிர்க்கிறது. ‘மெசியா’ பட்டப்பொருளைத் தக்கவைக்கிறது; ‘சபை’ தேவையற்ற பிரிவுசார் நிறமின்றி ἐκκλησία-வின் சமூகப் பொருளை வழங்குகிறது.
