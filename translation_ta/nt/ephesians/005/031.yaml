source:
  edition: SBLGNT
  text: ἀντὶ τούτου καταλείψει ἄνθρωπος ⸀τὸν ⸀πατέρα καὶ ⸀τὴν μητέρα καὶ προσκολληθήσεται ⸂τῇ γυναικὶ⸃ αὐτοῦ, καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/031.yaml
  text: For this reason a man will leave his father and mother and be joined to his wife[a], and the two will become one flesh.
translation:
  language: ta
  text: “இதன் காரணமாக[a] ஒரு ஆண் தன் தந்தையையும் தாயையும் விட்டுவிட்டு, தன் மனைவியுடன் இணைவான்; இருவரும் ஒரே மாம்சமாவார்கள்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இதனால்.” கிரேக்கச் சொற்றொடரைத் தனித்தனியாக எடுத்தால் “இதற்குப் பதிலாக” என்றும் பொருள் கொள்ளலாம்; ஆனால் ஆதியாகம மேற்கோளில் அது இங்கு காரண அல்லது விளைவுத் தொடர்பைச் சுட்டுகிறது.
    reason: ἀντὶ τούτου என்ற சொற்றொடரின் சொற்பொருளையும் இச்சூழலில் அதன் இணைப்புப் பணியையும் வெளிப்படுத்தும் lexical alternative.
lexical_decisions:
- source_word: ἀντὶ τούτου
  choice: இதன் காரணமாக
  rationale: ஆதியாகமம் 2:24 மேற்கோளில் இச்சொற்றொடர் பதிலீட்டைக் காட்டுவதற்குப் பதிலாக, முன்னர் கூறப்பட்டதோடு காரண அல்லது விளைவுத் தொடர்பை ஏற்படுத்துகிறது. ‘இதன் காரணமாக’ என்பது அந்தத் தொடர்பை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: καταλείψει
  choice: விட்டுவிட்டு
  rationale: பெற்றோரின் குடும்ப வாழ்வை விட்டு புதிய திருமண ஒன்றிப்பை ஏற்படுத்துவதை இது குறிக்கிறது. உணர்ச்சிபூர்வமான கைவிடுதலைக் குறிக்கும் சொற்களைத் தவிர்த்து, இயல்பான தமிழில் பொருள் தரப்பட்டுள்ளது.
- source_word: ἄνθρωπος
  choice: ஒரு ஆண்
  rationale: ἄνθρωπος பொதுவாக ‘மனிதர்’ எனப் பொருள்படக்கூடியதாயினும், இங்கு ‘தன் மனைவி’ என்பதுடன் இணைந்த திருமணச் சூழலில் ஆண் துணையைக் குறிக்கிறது.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: தன் தந்தையையும் தாயையும்
  rationale: உறவையும் இரு பெயர்களையும் தெளிவாகக் காட்டும் இயல்பான தமிழ் அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: προσκολληθήσεται
  choice: இணைந்திருப்பான்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவம் நெருக்கமாக இணைக்கப்படுதல் அல்லது பற்றிக்கொள்ளுதல் என்ற கருத்தைக் கொண்டுள்ளது. ‘இணைந்திருப்பான்’ திருமண ஒன்றிப்பையும் அதன் தொடர்ச்சியையும் இயல்பாக வெளிப்படுத்துகிறது; வெறும் உடல்சார்ந்த பற்றுதலாக அதைக் குறுக்குவதில்லை.
- source_word: τῇ γυναικὶ αὐτοῦ
  choice: தன் மனைவியோடு
  rationale: γυνή என்பதற்கு ‘பெண்’ அல்லது ‘மனைவி’ என்று பொருள் வரலாம்; திருமணச் சூழல் இங்கு ‘மனைவி’ என்பதையே கோருகிறது.
- source_word: ἔσονται οἱ δύο
  choice: இருவரும் ... ஆவார்கள்
  rationale: சொல்லுக்குச் சொல்லாக ‘இருவரும் இருப்பார்கள்’ என்றாலும், εἰς σάρκα μίαν குறிக்கும் விளைவுநிலையைத் தமிழில் ‘ஆவார்கள்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἰς σάρκα μίαν
  choice: ஒரே மாம்சம்
  rationale: σάρξ இங்கு பாவ இயல்பைக் குறிக்கும் உருவகம் அல்ல; ஆதியாகமத்திலிருந்து வரும் திருமண ஒன்றிப்பு மொழி. ஆகவே அதை ‘ஒரே உடல்’ என்று சுருக்காமல் ‘ஒரே மாம்சம்’ என்று பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: திருமண மேற்கோளிலுள்ள பாலினக் குறிப்புகள்
  choice: ஒரு ஆண் ... தன் மனைவி
  alternative: ஒருவர் ... தன் வாழ்க்கைத்துணை
  rationale: மூல உரை ஆதியாகமம் 2:24-ஐ மேற்கோள் காட்டி ஆண்–பெண் திருமண இணையைச் சித்தரிக்கிறது. எனவே அதன் பாலினக் குறிப்புகள் பொதுமைப்படுத்தப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
- issue: εἰς σάρκα μίαν என்பதில் σάρξ-ஐ மொழிபெயர்த்தல்
  choice: ஒரே மாம்சம்
  alternative: ஒரே உடல்
  rationale: இது ஆதியாகம மேற்கோளிலுள்ள உறவு மற்றும் திருமண ஒன்றிப்பு மொழி; பவுலின் பிற இடங்களில் காணப்படும் ‘பாவ இயல்பு’ என்ற கருத்தை இங்கு ஏற்றவில்லை. நிலைபெற்ற வேதாகமச் சொல்லாட்சியின் இறையியல் நிறைவைப் பாதுகாக்க ‘மாம்சம்’ பயன்படுத்தப்பட்டுள்ளது.
- issue: ἔσονται என்பதன் நிலை அல்லது விளைவு நுணுக்கம்
  choice: ஆவார்கள்
  alternative: இருப்பார்கள்
  rationale: கிரேக்க வினை வடிவம் சொல்லளவில் ‘இருப்பார்கள்’ என்றாலும், εἰς உடன் வரும் அமைப்பு விளைவுநிலையைச் சுட்டுகிறது. தமிழ் மொழியில் ‘ஒரே மாம்சமாவார்கள்’ அந்த நுணுக்கத்தை இயல்பாகத் தருகிறது; ஒன்றிப்பு எவ்வாறு நிகழ்கிறது என்பதை மேலதிகமாக விளக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘மாம்சம்’ என்பது அன்றாடப் பேச்சில் குறைவாக இருந்தாலும், மூலத்தின் உடல்–உறவு சார்ந்த நிறைவையும் ஆதியாகம மேற்கோளின் ஒலிப்பையும் பாதுகாப்பதால் வைத்திருக்கப்பட்டுள்ளது. மேற்கோள் வடிவத்தைத் தெளிவுபடுத்த தமிழ் மேற்கோள் குறிகள் பயன்படுத்தப்பட்டுள்ளன.
