- from: ஆகவே, அவர்களோடு பங்காளிகளாக ஆகாதீர்கள்.[a]
  to: ஆகவே, அவர்களுடன் பங்குகொள்பவர்களாக மாறாதீர்கள்.[a]
  rationale: ‘மாறாதீர்கள்’ preserves the ingressive force of γίνεσθε, and ‘அவர்களுடன் பங்குகொள்பவர்களாக’ naturally conveys συμμέτοχοι αὐτῶν without importing ‘their deeds’ into the verse. The footnote marks the contextual application as possible rather than making it an explicit element of the Greek wording.
