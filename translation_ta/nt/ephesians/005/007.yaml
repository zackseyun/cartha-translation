  text: μὴ οὖν γίνεσθε συμμέτοχοι αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/007.yaml
  text: Therefore[a], do not become partners with them.
translation:
  language: ta
  text: ஆகவே, அவர்களுடன் பங்குகொள்பவர்களாக மாறாதீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடன் பங்கேற்பவர்களாக” அல்லது “அவர்களுடன் பங்குபெறுபவர்களாக.” சூழலின்படி, அவர்களின் பாவமான நடத்தையிலோ அதன் விளைவுகளிலோ பங்குகொள்வதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: ஆகாதீர்கள்
  rationale: γίνεσθε என்பதோடு இணைந்த தடைச்சொல்; தமிழில் எதிர்மறை ஏவல் வினைமுற்றாக இயல்பாக வெளிப்படுகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வசனங்களிலுள்ள எச்சரிக்கையிலிருந்து வரும் முடிவைத் தெளிவாகக் குறிக்கிறது.
- source_word: γίνεσθε
  choice: ஆகாதீர்கள்
  rationale: வெறுமனே ஒரு நிலையில் இருப்பதை அல்ல, அந்த நிலைக்கு வருவதையோ அப்படிப்பட்டவர்களாக மாறுவதையோ தடுக்கிற கட்டளையின் நுட்பத்தைப் பாதுகாக்கிறது.
- source_word: συμμέτοχοι
  choice: பங்காளிகளாக
  rationale: மற்றவர்களுடன் ஒன்றில் பங்குபெறுவோரைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் மூலத்தின் பொதுவான பொருளை மிகைப்படுத்தாமலும் உள்ளது.
- source_word: αὐτῶν
  choice: அவர்களோடு
  rationale: சுட்டுப்பெயர் மனிதர்களைக் குறிக்கிறது; ‘அவர்களுடைய செயல்களில்’ என்று விரிவுபடுத்தாமல் மூலத்தின் வெளிப்பாட்டைப் பாதுகாக்கிறது.
theological_decisions:
- issue: συμμέτοχοι αὐτῶν என்பதில் குறிக்கப்படும் பங்கேற்பின் பரப்பு
  choice: ‘அவர்களோடு பங்காளிகளாக’ என்று பொதுவாக மொழிபெயர்த்து, அவர்களின் பாவ நடத்தையிலோ அதன் விளைவுகளிலோ பங்குபெறுதல் என்ற சூழல்சார் பொருளை அடிக்குறிப்பில் விளக்குதல்.
  alternative: ‘அவர்களுடைய செயல்களில் பங்குபெறாதீர்கள்’
  rationale: கிரேக்க உரை செயல்களை வெளிப்படையாகச் சொல்லாமல் ‘அவர்கள்’ என்ற மனிதர்களைக் குறிப்பிடுகிறது. ஆகவே, சூழலின் பொருளை மறைக்காமலும் உரையில் இல்லாத பொருளைச் சேர்க்காமலும் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘பங்காளிகள்’ என்பது இயல்பான சொல்; அடிக்குறிப்பு அதன் சூழல்சார் நுட்பத்தைத் தெளிவுபடுத்துகிறது.
