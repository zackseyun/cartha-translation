source:
  edition: SBLGNT
  text: Πορνεία δὲ καὶ ⸂ἀκαθαρσία πᾶσα⸃ ἢ πλεονεξία μηδὲ ὀνομαζέσθω ἐν ὑμῖν, καθὼς πρέπει ἁγίοις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/003.yaml
  text: But sexual immorality and every impurity or greed must not even be named among you[a], as is proper for saints[c][b],
translation:
  language: ta
  text: ஆனால், பரிசுத்த மக்களுக்கு ஏற்றதுபோல, பாலியல் ஒழுக்கக்கேடோ, எல்லாவித அசுத்தமோ, பேராசையோ[b] உங்களிடையே பெயரளவிற்குக்கூட இடம்பெறக்கூடாது[a]. பரிசுத்த மக்கள்[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றைப் பற்றிய பேச்சில்கூட உங்களிடையே இடமிருக்கக் கூடாது.”
    reason: lexical_alternative
  - marker: b
    text: “பேராசை” என்பதற்கு “பிறர் உடைமையை இச்சித்தல்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “பரிசுத்த மக்கள்” என்பது தேவனுக்கெனப் பிரித்தெடுக்கப்பட்ட விசுவாசிகள் அனைவரையும் குறிக்கிறது; பிற்காலத்தில் சிறப்பாகப் புனிதர் என்று அங்கீகரிக்கப்பட்ட ஒரு வகுப்பினரை மட்டும் அல்ல.
    reason: cultural_note
lexical_decisions:
- source_word: Πορνεία
  choice: பாலியல் ஒழுக்கக்கேடு
  rationale: சட்டவிரோதமான அல்லது ஒழுக்கத்துக்கு மாறான பாலியல் நடத்தையை விரிவாகக் குறிக்கிறது; திருமணத்திற்கு முந்தைய உறவுக்கு மட்டும் இதைக் குறுக்கவில்லை.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய அறிவுரையிலிருந்து மென்மையான எதிர்மறைத் திருப்பத்தைக் காட்டுகிறது.
- source_word: ἀκαθαρσία πᾶσα
  choice: எல்லாவித அசுத்தம்
  rationale: πᾶσα தரும் முழுமையான பரப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἢ
  choice: அல்லது
  rationale: கிரேக்கச் சொல்லின் பிரிநிலை இணைப்பை நேரடியாகப் பாதுகாக்கிறது.
- source_word: πλεονεξία
  choice: பேராசை
  rationale: மேலும் மேலும் பெற வேண்டும் என்ற பிடிவாதமான, பிறரைச் சுரண்டும் ஆசையைப் பொதுவாகக் குறிக்கிறது; பாலியல் இச்சையாக மட்டும் குறுக்கப்படவில்லை.
- source_word: μηδὲ ὀνομαζέσθω ἐν ὑμῖν
  choice: உங்களிடையே பெயரளவிற்குக்கூட இருக்கக் கூடாது
  rationale: சொல்லுக்குச் சொல் ‘பெயரிடப்படக்கூடாது’ என்றாலும், சமூகத்தில் இத்தகைய நடத்தைக்கு இடமே இருக்கக்கூடாது என்ற வலுவான தடையைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது; ‘பேசப்படக்கூடாது’ என்ற மாற்றுப் பொருளையும் அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: καθὼς πρέπει
  choice: இதுவே … ஏற்றது
  rationale: விசுவாசிகளின் பரிசுத்த அடையாளத்திற்குப் பொருந்தும் நெறியை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἁγίοις
  choice: பரிசுத்த மக்கள்
  rationale: தேவனுக்கெனப் பிரித்தெடுக்கப்பட்ட விசுவாசிகள் அனைவரையும் குறிக்கிறது; பிற்காலத்தில் சிறப்பாக அங்கீகரிக்கப்பட்ட சிலரை மட்டும் குறிக்கும் எண்ணத்தைத் தவிர்க்கிறது.
theological_decisions:
- issue: பாலியல் பாவங்களுடன் வரும் πλεονεξία என்பதன் பொருள்
  choice: பொதுவான ‘பேராசை’
  alternative: பிறர் உடைமையை இச்சித்தல்; பாலியல் பேராசை
  rationale: சூழலில் பாலியல் நெறி இடம்பெற்றாலும், பவுலின் பயன்பாட்டில் இச்சொல் பரந்த பேராசையைக் குறிக்கிறது; வெளிப்படையான உரை ஆதாரமின்றி அதை பாலியல் இச்சையாக மட்டும் குறுக்கவில்லை.
- issue: ἁγίοις என்பதன் சுட்டுப்பொருள்
  choice: தேவனுக்கெனப் பிரித்தெடுக்கப்பட்ட விசுவாசிகள் அனைவரும்
  alternative: புனிதர்கள்
  rationale: பிற்காலத் திருச்சபை அங்கீகாரம் பெற்ற தனிப்பட்ட ஒரு வகுப்பை அல்லாமல், தேவனுடைய பரிசுத்த மக்களாகிய விசுவாசிகளை இங்கு குறிக்கிறது.
- issue: μηδὲ ὀνομαζέσθω என்ற தடையின் அளவு
  choice: அத்தகைய தீமைகள் சமூகத்தில் பெயரளவிற்குக்கூட இடம்பெறக் கூடாது
  alternative: அவற்றைப் பற்றிப் பேச்சில்கூட குறிப்பிடக் கூடாது
  rationale: ‘பெயரிடப்படுதல்’ என்ற சொற்றொடர் நடத்தை சமூகத்தில் காணப்படாதிருப்பதையும், அதைப் பற்றிய ஒழுக்கமற்ற பேச்சு இல்லாதிருப்பதையும் சுட்டக்கூடும்; முதன்மை உரை முதலாவது இயல்பான பொருளைத் தருகிறது, மாற்று அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், பொதுமக்கள் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘பாலியல் ஒழுக்கக்கேடு’ என்பது πορνεία-வின் பரப்பைத் தக்கவைக்கிறது. ‘பரிசுத்த மக்கள்’ என்பது ‘புனிதர்கள்’ என்பதில் எழக்கூடிய பிற்காலச் சிறப்பு வகுப்பு சார்ந்த தவறான புரிதலைத் தவிர்க்கிறது. அடிக்குறிப்பு குறிகள் அனைத்தும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
