  text: Μηδεὶς ὑμᾶς ἀπατάτω κενοῖς λόγοις, διὰ ταῦτα γὰρ ἔρχεται ἡ ὀργὴ τοῦ θεοῦ ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/006.yaml
  text: Let no one deceive you with empty words[a], for because of these things the wrath of God comes upon the sons of disobedience.
translation:
  language: ta
  text: யாரும் உங்களை வெற்று வார்த்தைகளால் ஏமாற்றாதிருக்கட்டும். ஏனெனில், இவற்றின் காரணமாகக் கடவுளின் கோபம் கீழ்ப்படியாமையின் மகன்கள்மேல்[a] வருகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கீழ்ப்படியாமையின் பிள்ளைகள்’; அதாவது, கீழ்ப்படியாமையால் பண்புபெற்றவர்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδεὶς ὑμᾶς ἀπατάτω
  choice: யாரும் உங்களை ஏமாற்றிவிடாதபடி பார்த்துக்கொள்ளுங்கள்
  rationale: கிரேக்கத் தடைச் சொல்லின் எச்சரிக்கை வலிமையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; ‘ஏமாற்று’ என்பது ἀπατάω என்பதன் நேரடியான பொருளைத் தக்கவைக்கிறது.
- source_word: κενοῖς λόγοις
  choice: வெற்று வார்த்தைகளால்
  rationale: κενοῖς என்பதிலுள்ள உள்ளடக்கமற்ற, பயனற்ற தன்மையையும் λόγοις என்பதன் பொதுவான ‘வார்த்தைகள்’ என்ற பொருளையும் உருவகத்தோடு காக்கிறது.
- source_word: διὰ ταῦτα
  choice: இவற்றின் காரணமாக
  rationale: διά + accusative இங்குக் காரணத்தைக் குறிக்கிறது; முந்தைய வசனங்களில் கூறப்பட்ட செயல்களைச் சுட்டும் பன்மையையும் தக்கவைக்கிறது.
- source_word: ἔρχεται
  choice: வருகிறது
  rationale: நிகழ்கால வடிவத்தை நேரடியாகக் காக்கிறது; இது பொதுவான நியதியா அல்லது நெருங்கிவரும் நிகழ்வா என்பதைத் தேவையின்றி முடிவுசெய்யவில்லை.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: கடவுளின் கோபம்
  rationale: ὀργή என்பதன் வலுவான இறையியல் மொழியை ‘தீர்ப்பு’ என்று மென்மையாக்காமல் நேரடியாக வழங்குகிறது.
- source_word: τοὺς υἱοὺς τῆς ἀπειθείας
  choice: கீழ்ப்படியாமையின் மகன்கள்
  rationale: கிரேக்கத்தின் செமித்தியத் தன்மையுள்ள சொற்றொடரையும் υἱούς என்பதன் ‘மகன்கள்’ என்ற வடிவத்தையும் முதன்மை உரையில் காக்கிறது; அதன் பண்புசார் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: தெய்வீகக் கோபத்தைக் குறிக்கும் மொழி
  choice: கடவுளின் கோபம்
  alternative: கடவுளின் தீர்ப்பு
  rationale: மூலத்தில் பொதுவான ‘தீர்ப்பு’ என்ற சொல் அல்ல, ὀργή என்ற ‘கோபம்’ உள்ளது; ஆகவே அதன் இறையியல் அழுத்தம் மென்மையாக்கப்படவில்லை.
- issue: τοὺς υἱοὺς τῆς ἀπειθείας என்ற மரபுத்தொடர்
  choice: கீழ்ப்படியாமையின் மகன்கள்
  alternative: கீழ்ப்படியாதவர்கள்
  rationale: மூலத்தின் உருவக வடிவத்தையும் ஆண்பால் பன்மையையும் முதன்மை உரை காக்கிறது; அது கீழ்ப்படியாமையால் பண்புபெற்றவர்களைக் குறிக்கும் என்பது அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘ஏமாற்றிவிடாதபடி பார்த்துக்கொள்ளுங்கள்’ என்பது கிரேக்கத் தடை அமைப்பைத் தமிழில் இயல்பாக வழங்குகிறது. ‘கீழ்ப்படியாமையின் மகன்கள்’ திட்டமிட்டே சற்றே செறிவான வேதாகம உருவகமாக வைக்கப்பட்டு, அதன் இயல்பான பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
