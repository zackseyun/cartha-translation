- from: வெற்று வார்த்தைகளால் யாரும் உங்களை ஏமாற்றிவிடாதபடி பார்த்துக்கொள்ளுங்கள். ஏனெனில், இவற்றின் காரணமாகக் கடவுளின் கோபம் கீழ்ப்படியாமையின் மகன்கள்மீது[a] வருகிறது.
