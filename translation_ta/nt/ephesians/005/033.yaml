  source_fidelity: திருத்தம் தேவை. «எப்படியாயினும்» ஏற்கத்தக்கதாயினும், πλὴν-இன் சுருக்க/எதிரிணை மாற்றத்திற்கு «ஆயினும்» நேர்த்தியானது. οὕτως-இன் முன்சுட்டுப் பொருளை «இவ்வாறே» வெளிப்படுத்துவது நல்லது. φοβῆται என்பதற்கு முதன்மை உரையில் «அஞ்சி மரியாதை காட்ட வேண்டும்» என்பது ‘அஞ்சுதல்’ மற்றும் ‘மரியாதை காட்டுதல்’ என்ற இரண்டு கூறுகளைச் சேர்க்கிறது; மூலத்தில் ஒரே வினை மட்டுமே உள்ளது. «அஞ்ச வேண்டும்» என வைத்து, அதன் பயபக்தி/மரியாதைப் பொருளை அடிக்குறிப்பில் விளக்குவது மூலத்தின் சொற்பொருள் இழுபறியைச் சிறப்பாகப் பாதுகாக்கிறது.
