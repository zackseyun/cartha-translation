  to: ஆயினும், உங்களில் ஒவ்வொருவனும் தன்னையே நேசிப்பதுபோல, தன் மனைவியை இவ்வாறே நேசிக்க வேண்டும்; மனைவியோ தன் கணவனுக்கு அஞ்ச வேண்டும்.[a]
  rationale: முதன்மை உரையிலிருந்து சேர்க்கையான «மரியாதை காட்ட வேண்டும்» என்பதை நீக்கி, φοβῆται-யின் நேரடியான அஞ்சுதல் பொருளை வைத்துள்ளோம். அதேவேளையில், திருமணச் சூழலிலுள்ள பயபக்தி/மரியாதை சார்ந்த சாத்தியமான நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. «இவ்வாறே» οὕτως-இன் முன்சுட்டு முறையை வெளிப்படுத்துகிறது; மற்ற பாலின, திருமண, மற்றும் பகிர்வுச் சுட்டுகள் தக்கவைக்கப்பட்டுள்ளன.
