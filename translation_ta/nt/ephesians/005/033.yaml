  text: πλὴν καὶ ὑμεῖς οἱ καθ’ ἕνα ἕκαστος τὴν ἑαυτοῦ γυναῖκα οὕτως ἀγαπάτω ὡς ἑαυτόν, ἡ δὲ γυνὴ ἵνα φοβῆται τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/033.yaml
  text: Nevertheless[a], you also—each one individually—must love his own wife as himself[b], and the wife must fear her husband.
translation:
  language: ta
  text: ஆயினும், உங்களில் ஒவ்வொருவனும் தன்னையே நேசிப்பதுபோல, தன் மனைவியை இவ்வாறே நேசிக்க வேண்டும்; மனைவியோ தன் கணவனுக்கு அஞ்ச வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «அஞ்ச வேண்டும்» என்பதற்கான கிரேக்க வினை சொற்பட அஞ்சுதலைக் குறிக்கிறது; இச்சூழலில் அது பயபக்தியுடனான மரியாதை அல்லது கனத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: எப்படியாயினும்
  rationale: முந்தைய விரிவான உரையிலிருந்து நடைமுறைச் சுருக்கத்திற்கு மாறும் முடிவுரைத்தன்மையையும் ஓரளவு எதிர்மறைத் திருப்பத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: καὶ ὑμεῖς οἱ καθ’ ἕνα ἕκαστος
  choice: உங்களில் ஒவ்வொருவனும்
  rationale: καθ’ ἕνα ἕκαστος என்பதன் வலியுறுத்தப்பட்ட பகிர்வுப் பொருளை, ஒவ்வொரு கணவனுக்கும் தனித்தனியாகப் பொருந்தும் அறிவுறுத்தலாகத் தெளிவாகக் காட்டுகிறது; καὶ என்பதன் உள்ளடக்கும் வலியுறுத்தல் தமிழில் சூழலோடு இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: தன் மனைவியையும்
  rationale: திருமணச் சூழலில் γυνή என்பதற்கு ‘மனைவி’ என்றும், ἑαυτοῦ என்பதன் தற்சுட்டுப் பொருளுக்கு ‘தன்’ என்றும் மொழிபெயர்க்கிறது. ‘-யும்’ முந்தைய ஒப்பீட்டோடு இணைப்பைத் தருகிறது.
- source_word: οὕτως ἀγαπάτω ὡς ἑαυτόν
  choice: தன்னையே நேசிப்பதுபோல ... நேசிக்க வேண்டும்
  rationale: οὕτως மற்றும் ὡς ἑαυτόν ஆகியவற்றின் முறையையும் ஒப்பீட்டையும் வெளிப்படையாக வைத்தபடி, மூன்றாம் நபர் கட்டளையின் வலிமையை நவீன தமிழில் ‘வேண்டும்’ என அளிக்கிறது.
- source_word: ἡ δὲ γυνὴ
  choice: மனைவியோ
  rationale: δέ குறிக்கும் இரண்டாம், மாறுபட்ட இணைப் பகுதியை ‘-யோ’ இயல்பாகக் குறிக்கிறது; திருமணச் சூழலால் γυνή ‘மனைவி’ ஆகிறது.
- source_word: ἵνα φοβῆται τὸν ἄνδρα
  choice: தன் கணவனுக்கு அஞ்சி மரியாதை காட்ட வேண்டும்
  rationale: φοβέομαι என்பதன் உண்மையான ‘அஞ்சுதல்’ கூறை அழிக்காமல், இச்சூழலில் உள்ள மரியாதை/பயபக்தி சார்ந்த உறவுப் பொருளையும் தெளிவுபடுத்துகிறது. ἀνήρ திருமணச் சூழலில் ‘கணவன்’ ஆகிறது.
theological_decisions:
- issue: திருமண அறிவுறுத்தலில் φοβῆται என்பதன் பொருள்
  choice: அஞ்சி மரியாதை காட்ட வேண்டும்
  alternative: பயப்பட வேண்டும்; மதிக்க வேண்டும்; பயபக்தி கொள்ள வேண்டும்
  rationale: மூல வினை ‘அஞ்சுதல்’ முதல் ‘பயபக்தியுடன் மதித்தல்’ வரை பொருள் கொள்ளலாம். ‘மதிக்க வேண்டும்’ மட்டும் என்பது அதன் கூர்மையை இழக்கச் செய்யும்; ‘பயப்பட வேண்டும்’ மட்டும் என்பது திகில் அல்லது ஒடுக்குமுறைப் பயத்தைத் தவறாக உணர்த்தலாம். தேர்ந்த வடிவம் அந்தச் சொற்பொருள் இழுபறியைப் பாதுகாத்து, திருமணச் சூழலிலுள்ள மரியாதைத் திசையையும் காட்டுகிறது.
- issue: பாலினத்தைக் குறிப்பிட்ட ஒருமை அறிவுறுத்தல்
  choice: ஒவ்வொருவனும் ... தன் மனைவி; மனைவி ... தன் கணவன்
  alternative: ஒவ்வொருவரும் தங்கள் வாழ்க்கைத்துணையை
  rationale: கிரேக்க உரை கணவன்–மனைவி உறவைக் குறிப்பிட்ட பாலின ஒருமை வடிவங்களில் பேசுவதால், அதை பாலினப் பொதுமைப்படுத்தாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை. ‘எப்படியாயினும்’ முடிவுரைத் திருப்பத்தைத் தருகிறது. வலியுறுத்தப்பட்ட பகிர்வுப் பொருள் ‘உங்களில் ஒவ்வொருவனும்’ எனச் சுருக்கமாக வெளிப்படுகிறது. φοβῆται என்பதிலுள்ள ‘அச்சம்—மரியாதை’ பொருள் இழுபறி முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
