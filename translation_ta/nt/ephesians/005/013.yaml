source:
  edition: SBLGNT
  text: τὰ δὲ πάντα ἐλεγχόμενα ὑπὸ τοῦ φωτὸς φανεροῦται,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/013.yaml
  text: But all things[a], when exposed by the light, are made visible,
translation:
  language: ta
  text: ஆனால், அனைத்தும் ஒளியால் அம்பலப்படுத்தப்படும்போது புலப்படுகின்றன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒளியால் அம்பலப்படுத்தப்படும் அனைத்தும் புலப்படுகின்றன.” கிரேக்கப் பங்கேற்புவினையையும் முதன்மை வினையையும் நெருக்கமாகத் தொடர்புபடுத்தி, அம்பலப்படுத்தும் செயலையோ அதன் விளைவாகப் புலப்படுவதையோ வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ... πάντα
  choice: அனைத்தும்
  rationale: கட்டுரையுடன் வரும் நடுநிலைப் பன்மை, எதையும் விலக்காத விரிவான பொருளைக் கொண்டது; நவீனத் தமிழில் ‘அனைத்தும்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய கூற்றுடன் உள்ள மென்மையான முரண்பாட்டையும் கருத்தின் அடுத்த நகர்வையும் குறிக்கிறது.
- source_word: ἐλεγχόμενα
  choice: அம்பலப்படுத்தப்படும்போது
  rationale: ἐλέγχω என்பதற்கு கண்டித்தல், குற்றத்தை உணர்த்துதல், வெளிப்படுத்துதல் ஆகிய பொருள்கள் இருக்கலாம். இங்கு ‘ஒளியால்’ என்பதும் தொடர்ந்து வரும் φανεροῦται என்பதும் மறைந்திருப்பதை வெளிக்கொணரும் பொருளை முன்னிறுத்துகின்றன. செயப்பாட்டு வடிவமும் காலம்/நிபந்தனை சார்ந்த தொடர்பும் தமிழில் இயல்பாகப் பாதுகாக்கப்படுகின்றன.
- source_word: ὑπὸ τοῦ φωτὸς
  choice: ஒளியால்
  rationale: ὑπό + உரிமை வேற்றுமை இங்கு செயற்படுத்தும் காரணியைச் சுட்டுகிறது. சூழலில் ஏற்கெனவே குறிப்பிடப்பட்ட ஒளியைத் தமிழ் இயல்பாக ‘ஒளியால்’ எனக் குறிக்கிறது.
- source_word: φανεροῦται
  choice: புலப்படுகின்றன
  rationale: φανερόω என்பதன் செயப்பாட்டு வடிவம் காணக்கூடியதாகுதல் அல்லது வெளிப்படுதல் என்ற பொருளைத் தருகிறது. ‘புலப்படுகின்றன’ ஒளி உருவகத்துக்கு ஏற்ற இயல்பான, சுருக்கமான தமிழாக்கம்.
theological_decisions:
- issue: சூழலில் ‘ஒளி’ என்பதன் குறிப்பு
  choice: இந்த வசனத்திலேயே அதன் குறிப்பைத் தனியாக வரையறுக்காமல் ‘ஒளி’ என்ற உருவகத்தைப் பாதுகாத்தல்
  alternative: கிறிஸ்து; நற்செய்தி; அறநெறி உண்மை; விசுவாசிகளின் சாட்சி
  rationale: உடனடியான சூழல் விசுவாசிகள் ஆண்டவரில் ஒளியாக இருப்பதையும் இருளின் செயல்களை அம்பலப்படுத்துவதையும் பேசுகிறது. ஆனால் இந்த வசனம் ‘ஒளி’ என்பதை ஒரே குறிப்புடன் வெளிப்படையாக அடையாளப்படுத்தவில்லை; ஆகவே அதன் இறையியல் விரிவும் பதற்றமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘அம்பலப்படுத்தப்படும்போது’ மறைந்ததை ஒளி வெளிக்கொணரும் உருவகத்தைத் தெளிவாகத் தருகிறது; ‘புலப்படுகின்றன’ தேவையற்ற விளக்கச் சேர்க்கையின்றி விளைவைக் கூறுகிறது.
