id: EPH.5.24
reference: Ephesians 5:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλὰ ⸀ὡς ἡ ἐκκλησία ὑποτάσσεται τῷ Χριστῷ, οὕτως καὶ αἱ γυναῖκες ⸀τοῖς ἀνδράσιν ἐν παντί.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/024.yaml
  text: But as the church submits to Messiah[a], so also wives to their husbands in everything.
translation:
  language: ta
  text: ஆனால் திருச்சபை மேசியாவுக்கு[a] கீழ்ப்படிவதுபோல, மனைவிகளும் தங்கள் கணவர்களுக்கு எல்லாவற்றிலும் கீழ்ப்படிய வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்துவுக்கு.” கிரேக்கப் பட்டமான Χριστός இங்கு “மேசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய கூற்றுடன் உள்ள மாறுபாட்டையும் உரையின் தொடர்ச்சியையும் இயல்பான தமிழில் குறிக்கிறது.
- source_word: ὡς ... οὕτως καὶ
  choice: …போல, …வும்
  rationale: கிரேக்கத்தின் ஒப்புமை அமைப்பை இயல்பான நவீனத் தமிழில் பாதுகாக்கிறது.
- source_word: ἡ ἐκκλησία
  choice: திருச்சபை
  rationale: பவுலின் இச்சூழலில் கிறிஸ்தவ விசுவாசிகளின் சமூகத்தைக் குறிக்கும் பரவலாகப் புரிந்துகொள்ளப்படும் தமிழ்ச் சொல்.
- source_word: ὑποτάσσεται
  choice: கீழ்ப்படிவது
  rationale: தன்னார்வமற்ற வற்புறுத்தலை உரையில் புதிதாகச் சேர்க்காமல், ஒழுங்குக்குட்பட்ட கீழ்ப்படிதல் என்ற உறவுசார் பொருளைத் தருகிறது.
- source_word: τῷ Χριστῷ
  choice: மேசியாவுக்கு
  rationale: Χριστός இங்கு பட்டமாகச் செயல்படுவதால் அதன் பட்டப்பொருளை வெளிப்படுத்தும் ‘மேசியா’ பயன்படுத்தப்பட்டுள்ளது; மரபான ‘கிறிஸ்து’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: αἱ γυναῖκες
  choice: மனைவிகளும்
  rationale: இல்லற ஒழுங்கைப் பற்றிய சூழலும் ἀνδράσιν என்பதுடனான இணைப்பும் பொதுவான ‘பெண்கள்’ என்பதைவிட ‘மனைவிகள்’ என்ற பொருளைத் தேவைப்படுத்துகின்றன.
- source_word: τοῖς ἀνδράσιν
  choice: தங்கள் கணவர்களுக்கு
  rationale: இல்லறச் சூழலில் ἀνήρ என்பது ‘கணவர்’ எனப் பொருள்படுகிறது; கிரேக்கத்தில் உடைமைப்பெயர் இல்லாவிட்டாலும் திருமண உறவின் பரஸ்பர இணைப்பை இயல்பான தமிழில் ‘தங்கள்’ வெளிப்படுத்துகிறது.
- source_word: ἐν παντί
  choice: எல்லாவற்றிலும்
  rationale: சொற்றொடரின் விரிவான வரம்பைச் சுருக்காமலும் விளக்கக் கட்டுப்பாடுகளைச் சேர்க்காமலும் நேரடியாகத் தருகிறது.
- source_word: '[ellipsis of ὑποτάσσεται in the second clause]'
  choice: கீழ்ப்படிய வேண்டும்
  rationale: இரண்டாம் கூறில் கிரேக்கத்தில் விடுபட்டுள்ள வினை முதல் கூறிலிருந்து பொருளால் தொடர்கிறது. தமிழில் முழுமையான, தெளிவான வாக்கியத்திற்காக வினை மீண்டும் வழங்கப்பட்டுள்ளது; ‘வேண்டும்’ இச்சூழலின் ஒழுக்க அறிவுறுத்தல் தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு இச்சொல் வெறும் பெயர்போல அல்லாமல் பட்டமாகச் செயல்படுகிறது. ஆகவே பட்டப்பொருளை வெளிப்படுத்தும் ‘மேசியா’ முதன்மை உரையில் தரப்பட்டு, வலுவான தமிழ் கிறிஸ்தவ மரபுடைய ‘கிறிஸ்து’ அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: திருமணக் கீழ்ப்படிதல் கூறின் வரம்பு
  choice: ‘எல்லாவற்றிலும்’ என்பதை எந்த விளக்கத் தகுதியும் சேர்க்காமல் வைத்தல்
  alternative: ‘பொருத்தமான எல்லாவற்றிலும்’ அல்லது ‘தகுந்த எல்லாவற்றிலும்’ போன்ற விளக்க விரிவாக்கங்கள்
  rationale: கிரேக்கத்தில் ἐν παντί என்று மட்டுமே உள்ளது. இவ்வசனத்தில் இல்லாத வரம்பை மொழிபெயர்ப்பில் சேர்ப்பது அதன் இறையியல் பதற்றத்தை மறைத்துவிடும்.
- issue: இரண்டாம் கூறில் விடுபட்ட வினை
  choice: தமிழில் ‘கீழ்ப்படிய வேண்டும்’ என்று வெளிப்படையாக வழங்குதல்
  alternative: ‘மனைவிகளும் தங்கள் கணவர்களுக்கு எல்லாவற்றிலும்’ என்று வினையின்றி விடுதல்
  rationale: கிரேக்கத்தில் வினை ஒப்புமை அமைப்பினால் எளிதாகப் புரிகிறது; தமிழில் அதை முற்றிலும் விடுவது இயல்பற்ற வாக்கியத் துண்டாகிவிடும். வினையை வழங்குவது பொருளை மாற்றாமல் தெளிவை அளிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. ‘திருச்சபை,’ ‘மேசியா,’ ‘கீழ்ப்படிதல்’ ஆகியவை இச்சூழலின் சமய மற்றும் உறவுசார் பொருளைத் தக்கவைக்கின்றன; மூலத்தில் இல்லாத வரம்புகள் சேர்க்கப்படவில்லை.
