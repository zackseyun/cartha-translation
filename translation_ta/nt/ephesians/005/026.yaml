  rationale: இச்சொற்றொடர் திருமுழுக்கு சார்ந்த உருவகத்தை நினைவூட்டக்கூடும்; ஆனால் அதன் சடங்கு சார்ந்த தன்மையை கிரேக்க வாசகம் தானாகவே முழுமையாகத் தீர்மானிப்பதில்லை. எனவே எந்தச் சபை மரபின் குறிப்பிட்ட கோட்பாடும் உரைக்குள் சேர்க்கப்படவில்லை.
- issue: ῥήματι என்பதன் குறிப்பான பொருள்
