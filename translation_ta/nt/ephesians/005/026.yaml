- issue: ἁγιάζω மற்றும் καθαρίζω ஆகியவற்றின் வேறுபாடு
  choice: முறையே ‘புனிதமாக்க’ மற்றும் ‘தூய்மைப்படுத்தி’ என்று வேறுபடுத்துதல்
  alternative: இரண்டையும் ‘பரிசுத்தப்படுத்துதல்’ போன்ற ஒரே சொல்லால் மொழிபெயர்த்தல்
  rationale: மூலத்தில் உள்ள தொடர்புடைய ஆனால் தனித்த இரு செயல்களையும் ஒன்றாக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. இது முந்தைய வசனத்துடன் தொடரும் நோக்கத் துணைவாக்கியம் என்பதால், மூலத்தைப் போலவே வாக்கியத் துண்டு அமைப்பு தக்கவைக்கப்பட்டுள்ளது. ‘தண்ணீர்க் கழுவுதல்’ என்பது ‘நீராட்டு’ அல்லது ‘திருமுழுக்கு’ என்பவற்றைவிடக் குறைவாக விளக்கமளிக்கும் நடுநிலைச் சொற்றொடராகத் தேர்ந்தெடுக்கப்பட்டது.
