  text: τὰ γὰρ κρυφῇ γινόμενα ὑπ’ αὐτῶν αἰσχρόν ἐστιν καὶ λέγειν·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/012.yaml
  text: For it is shameful even to speak of the things done by them in secret[a].
translation:
  language: ta
  text: ஏனெனில், அவர்கள் மறைவாகச் செய்கிறவற்றைப் பற்றிப் பேசுவதுகூட வெட்கக்கேடானது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் மறைவாகச் செய்வதைப் பற்றிப் பேசுவதுகூட.”
    reason: τὰ ... γινόμενα என்ற பொருளாக்கப்பட்ட பங்கேற்புவினையைத் தமிழில் ஒருமைத் தொகுப்பாகவும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான காரணத்தை விளக்கும் இணைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὰ ... γινόμενα
  choice: செய்கிறவற்றை
  rationale: இடைச்சொல்லுடன் வரும் நிகழ்காலப் பங்கேற்புவினையின் பொருளாக்கப்பட்ட தன்மையைச் செயல்கள் அல்லது செய்யப்படுகிறவை என்ற பொருளில் சுருக்கமாகக் காட்டுகிறது.
- source_word: κρυφῇ
  choice: மறைவாக
  rationale: பிறர் அறியாதபடி, மறைவில் நிகழ்வதைக் குறிக்கும் வினையடைப் பொருளை இயல்பாகத் தருகிறது.
- source_word: ὑπ’ αὐτῶν
  choice: அவர்கள் ... செய்கிற
  rationale: கிரேக்கத்தில் ὑπό உடன் வரும் செயப்படுபொருள் அமைப்பு செய்பவர்களைச் சுட்டுகிறது; தமிழில் இயல்பான செய்வினை அமைப்பாக மாற்றப்பட்டாலும் ‘அவர்கள்’ என்ற சுட்டுப்பெயர் பாதுகாக்கப்படுகிறது.
- source_word: αἰσχρόν
  choice: வெட்கக்கேடானது
  rationale: ஒழுக்கரீதியாக அவமானகரமானது அல்லது இழிவானது என்ற வலிமையை நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: καὶ λέγειν
  choice: பற்றிப் பேசுவதுகூட
  rationale: καί இங்கு வலியுறுத்தும் ‘கூட’ என்ற பொருளைக் கொண்டுள்ளது; λέγειν என்பதற்கு இச்சூழலில் ‘பற்றிப் பேசுவது’ இயல்பான தமிழ்.
theological_decisions:
- issue: αὐτῶν என்பதன் சுட்டுப்பொருள்
  choice: வசனத்தில் ‘அவர்கள்’ என்ற சுட்டுப்பெயரை மட்டும் வைத்திருத்தல்
  alternative: ‘இருளின் செயல்களைச் செய்கிறவர்கள்’ என்று வெளிப்படையாக விரித்துரைத்தல்
  rationale: சுட்டுப்பெயரின் முன்னிலைச் சூழலிலிருந்து அறியப்படுகிறது. வசனத்திலேயே அதை விரிவாக்குவது மூலத்தில் இல்லாத விளக்கத்தை உரைக்குள் சேர்க்கும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை. கிரேக்கத்தின் விளக்க இணைப்பு, மறைவுத் தன்மை, சுட்டுப்பெயரின் தெளிவின்மை, ‘பேசுவதுகூட’ என்ற வலியுறுத்தல் ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
