translation:
  language: ta
  text: சங்கீதங்களாலும் துதிப்பாடல்களாலும் ஆவிக்குரிய பாடல்களாலும் ஒருவரோடு ஒருவர் பேசிக்கொண்டும்[a], உங்கள் இதயத்தில் ஆண்டவருக்குப் பாடிக்கொண்டும் இன்னிசை எழுப்பிக்கொண்டும் இருங்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உங்களுக்குள்ளே’ அல்லது ‘உங்களிடமே’; இங்குள்ள கிரேக்கத் தற்சுட்டுச் சொல் பொதுவாகப் பரஸ்பரப் பொருளில், ‘ஒருவரோடு ஒருவர்’ என்று புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘துதித்துப் பாடிக்கொண்டும் இருங்கள்’; கிரேக்கச் சொல் துதித்துப் பாடுவதையோ இன்னிசை எழுப்புவதையோ குறிக்கலாம்; இசைக்கருவி உடனிருப்பதை அது கட்டாயமாகக் குறிப்பிடுவதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλοῦντες
  choice: பேசிக்கொண்டு
  rationale: நிகழ்காலப் பெயரெச்சத்தின் தொடர்ச்சியான செயலை இயல்பான தமிழில் காக்கிறது; முறையான உரையாற்றலைத் தேவையின்றி குறிப்பதில்லை.
- source_word: ἑαυτοῖς
  choice: ஒருவரோடு ஒருவர்
  rationale: பன்மைச் சூழலில் தற்சுட்டுப் பதிலிப்பெயர் பரஸ்பரப் பொருளில் வருவது இயல்பு; சமூகத்தினருக்கிடையிலான செயலைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: ψαλμοῖς
  choice: சங்கீதங்களாலும்
  rationale: வேதாகமச் சங்கீதங்களையும் சங்கீத வடிவிலான பாடல்களையும் உள்ளடக்கக்கூடிய சொற்பரப்பைத் திறந்தவாறே வைக்கிறது.
- source_word: ὕμνοις
  choice: துதிப்பாடல்களாலும்
  rationale: தமிழில் இயல்பாகவும் ὕμνος என்பதன் புகழ்ந்து பாடும் தன்மையைத் தெளிவாகவும் வெளிப்படுத்துகிறது; மூவகை வரிசையையும் காக்கிறது.
- source_word: ᾠδαῖς πνευματικαῖς
  choice: ஆவிக்குரிய பாடல்களாலும்
  rationale: πνευματικός என்பதன் உண்மையான தெளிவின்மையைப் பாதுகாத்து, பரிசுத்த ஆவியால் நேரடியாக அருளப்பட்டவை என்ற வலுவான கூற்றைச் சேர்ப்பதில்லை.
- source_word: ᾄδοντες
  choice: பாடி
  rationale: பாடும் செயலை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ψάλλοντες
  choice: இன்னிசை எழுப்புங்கள்
  rationale: இசைமிகு துதிப்பின் நுணுக்கத்தை வெளிப்படுத்துகிறது; இசைக்கருவி கட்டாயம் எனவும் இல்லை எனவும் உரை கூறாத நிலையில் எந்தப் பக்கத்தையும் திணிப்பதில்லை.
- source_word: τῇ καρδίᾳ ὑμῶν
  choice: உங்கள் இதயத்தால்
  rationale: தத்துவேற்றுமையை செயல் நடைபெறும் உள்ளார்ந்த முறை அல்லது கருவியாக இயல்பான தமிழில் வெளிப்படுத்துகிறது; கிரேக்க ஒருமையான ‘இதயம்’ என்பதையும் காக்கிறது.
- source_word: τῷ κυρίῳ
  choice: ஆண்டவருக்கு
  rationale: பாடலும் இன்னிசையும் யாரை நோக்கி செலுத்தப்படுகின்றன என்பதைத் தத்துவேற்றுமையுடன் தருகிறது; வசனத்தில் இல்லாத வகையில் அந்த ஆண்டவர் யார் என்பதை விரிவுபடுத்துவதில்லை.
theological_decisions:
- issue: ψάλλοντες என்பதற்கும் இசை நடைமுறைக்கும் உள்ள தொடர்பு
  choice: இசைக்கருவியைக் குறிப்பாகச் சொல்லாமல் ‘இன்னிசை எழுப்புங்கள்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘துதித்துப் பாடுங்கள்’ அல்லது ‘இசைக்கருவி வாசியுங்கள்’ என்று மொழிபெயர்த்தல்.
  rationale: இச்சொல் வரலாற்றில் நரம்புகளை மீட்டுவதைக் குறித்தாலும், கொய்னே பயன்பாட்டிலும் இச்சூழலிலும் இசைக்கருவியை அவசியமாக்குவதில்லை. எனவே இசைக்கருவிப் பயன்பாட்டை ஆதரிக்கும் அல்லது எதிர்க்கும் சபை மரபை மொழிபெயர்ப்பில் புகுத்தவில்லை.
- issue: ‘ஆண்டவர்’ என்பதன் குறிப்பு
  choice: வசனத்தின் κύριος என்பதற்கேற்ப ‘ஆண்டவர்’ என்று மட்டும் வைக்கப்பட்டது.
  alternative: ‘ஆண்டவராகிய இயேசு’ அல்லது ‘கிறிஸ்து’ என்று வெளிப்படையாக அடையாளப்படுத்துதல்.
  rationale: எபேசியர் நிருபத்தின் சூழல் கிறிஸ்துவைக் குறிக்கக்கூடும்; ஆயினும் இவ்வசனம் κύριος என்று மட்டுமே கூறுவதால், சூழல் தீர்மானிக்க வேண்டியதை மொழிபெயர்ப்பு முன்கூட்டியே தீர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘சங்கீதங்கள்—துதிப்பாடல்கள்—ஆவிக்குரிய பாடல்கள்’ என்ற மூவகை அமைப்பும், தொடர்ச்சியான பெயரெச்சச் செயல்களின் தொடர்பும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
