  source_fidelity: மூவகைப் பாடல் வரிசை, பரஸ்பரமான ἑαυτοῖς, மற்றும் ψάλλοντες என்பதன் இசைக்கருவியை வலியுறுத்தாத பொருள் ஆகியவை நன்றாகப் பாதுகாக்கப்பட்டுள்ளன. ஆனால் மூலத்தில் மூன்றும் நிகழ்காலப் பெயரெச்சங்களாக உள்ள நிலையில், வரைவின் இறுதிச் சொல் மட்டும் கட்டளைப் பன்மையாக (‘எழுப்புங்கள்’) மாறுகிறது. மேலும் τῇ καρδίᾳ ὑμῶν என்பதற்கு ‘உங்கள் இதயத்தில்’ என்பது இடம்/உள்ளார்ந்த வெளிப்பாடு என்ற இயல்பான நுணுக்கத்தை ‘இதயத்தால்’ என்பதைக் காட்டிலும் நேரடியாகத் தருகிறது.
