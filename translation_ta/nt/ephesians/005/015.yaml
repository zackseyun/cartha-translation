translation:
  language: ta
  text: ஆகவே, நீங்கள் எவ்வாறு வாழ்கிறீர்கள் என்பதை மிகக் கவனமாகக் கவனியுங்கள்—ஞானமற்றவர்களாக அல்ல, ஞானமுள்ளவர்களாக.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βλέπετε
  choice: பார்த்துக்கொள்ளுங்கள்
  rationale: நிகழ்கால கட்டளை வடிவத்தின் தொடர்ச்சியான விழிப்புணர்வையும் கவனத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய கருத்துகளிலிருந்து வரும் முடிவுறுத்தும் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἀκριβῶς πῶς
  choice: எப்படி ... என்பதை மிகக் கவனமாக
  rationale: வாழ்க்கை நடத்தையின் விதத்தை ஆராய்ந்து கவனிக்க வேண்டும் என்ற கிரேக்கச் சொற்றொடரின் வலியுறுத்தலை இயல்பான தமிழ் சொல் வரிசையில் தருகிறது.
- source_word: περιπατεῖτε
  choice: வாழ்கிறீர்கள்
  rationale: சொல்லுக்கு சொல் பொருள் ‘நடக்கிறீர்கள்’ என்றாலும், இங்கு அது ஒருவரின் வாழ்க்கை நடத்தையைக் குறிக்கும் பவுலின் உருவகப் பயன்பாடு; நவீன தமிழில் நோக்கத்தைத் தெளிவாகத் தர ‘வாழ்கிறீர்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது, நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: μὴ ὡς ἄσοφοι
  choice: ஞானமற்றவர்களாக அல்ல
  rationale: ἄσοφοι என்பதன் ‘ஞானமற்ற’ என்ற எதிர்மறைப் பொருளையும் ὡς உடன் வரும் ‘அவ்வாறானவர்களாக’ என்ற ஒப்புமைத் தன்மையையும் காக்கிறது; தமிழ் பன்மை வடிவம் முழுச் சமூகத்தையும் இயல்பாக உள்ளடக்குகிறது.
- source_word: ἀλλ’ ὡς σοφοί
  choice: ஞானமுள்ளவர்களாக வாழுங்கள்
  rationale: முந்தைய எதிர்மறைக் கூறுக்கு இணையான நேர்மறை முரண்பாட்டைத் தெளிவுபடுத்துகிறது; தமிழில் முழுமையான, இயல்பான வாக்கியமாக இருக்க ‘வாழுங்கள்’ மீண்டும் வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: ἄσοφοι / σοφοί என்ற ஆண்பால் பன்மை வடிவங்களின் பிரதிநிதித்துவப் பயன்பாடு
  choice: ஞானமற்றவர்களாக ... ஞானமுள்ளவர்களாக
  alternative: ஞானமற்ற ஆண்களாக ... ஞானமுள்ள ஆண்களாக
  rationale: கிரேக்க ஆண்பால் பன்மை வடிவங்கள் இங்கு ஆண்களை மட்டும் குறிக்காமல் முழு விசுவாசக் குழுவையும் பிரதிநிதித்துவமாகக் குறிக்கின்றன. தமிழ் ‘-வர்கள்’ வடிவம் பாலினத்தைத் தேவையின்றி வரையறுக்காமல் அந்த பொதுவான குறிக்கையைத் துல்லியமாக வழங்குகிறது.
- issue: περιπατεῖτε என்பதிலுள்ள ‘நடத்தல்’ உருவகம்
  choice: முதன்மை உரையில் ‘வாழ்கிறீர்கள்’; நேரடிப் பொருள் அடிக்குறிப்பில்
  alternative: நீங்கள் எப்படி நடக்கிறீர்கள்
  rationale: சூழலில் இது உடல் நடையை அல்ல, வாழ்க்கை நடத்தையைக் குறிக்கிறது. முதன்மை உரை சாதாரண வாசகருக்குத் தெளிவாக இருக்கவும் மூல உருவகம் மறையாமல் இருக்கவும் இந்த இருநிலைத் தீர்வு தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவான, மரியாதைமிக்க அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘மிகக் கவனமாகப் பார்த்துக்கொள்ளுங்கள்’ என்பது ἀκριβῶς என்பதன் வலியுறுத்தலையும் Βλέπετε என்பதன் கட்டளைத் தன்மையையும் இணைத்துத் தருகிறது.
