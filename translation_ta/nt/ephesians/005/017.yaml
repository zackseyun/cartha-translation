  text: διὰ τοῦτο μὴ γίνεσθε ἄφρονες, ἀλλὰ ⸀συνίετε τί τὸ θέλημα τοῦ κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/017.yaml
  text: For this reason[a], do not become foolish, but understand what the will of the Lord is.
translation:
  language: ta
  text: இதனால்[a], அறிவற்றவர்களாகிவிடாதீர்கள்; மாறாக, ஆண்டவரின் சித்தம் என்ன என்பதைப் புரிந்துகொள்ளுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆகவே, அறிவற்றவர்களாக இராதீர்கள்.” கிரேக்க வினைச்சொல் நிலையான பொருளில் ‘இராதீர்கள்’ என்றும் மொழிபெயர்க்கப்படலாம்; ஆனால் ‘அறிவற்றவர்களாகிவிடாதீர்கள்’ என்பது γίνεσθε என்பதிலுள்ள ஒரு நிலைக்கு வருதல் என்ற நுட்பத்தைச் சிறப்பாகப் பிரதிபலிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: இதனால்
  rationale: முந்தைய அறிவுறுத்தலைச் சுட்டி, அதிலிருந்து வரும் காரணம் அல்லது முடிவை இயல்பான தமிழில் இணைக்கிறது.
- source_word: μὴ γίνεσθε
  choice: ஆகாதீர்கள்
  rationale: γίνομαι என்பதிலுள்ள ஒரு நிலைக்கு வருதல் என்ற இயக்கநுட்பத்தை, வெறும் ‘இராதீர்கள்’ என்பதைக் காட்டிலும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἄφρονες
  choice: அறிவற்றவர்களாக
  rationale: புரிந்துணர்வும் நடைமுறை விவேகமும் இல்லாத நிலையைக் குறிக்கிறது; தொடர்ந்து வரும் ‘புரிந்துகொள்ளுங்கள்’ என்பதுடன் தெளிவான எதிர்மறை இணைப்பை உருவாக்குகிறது.
- source_word: ἀλλὰ
  choice: மாறாக
  rationale: எதிர்மறைக் கட்டளைக்கும் நேர்மறைக் கட்டளைக்கும் இடையிலான வலுவான முரண்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: συνίετε
  choice: புரிந்துகொள்ளுங்கள்
  rationale: உணர்ந்து அறிதல், பொருளைப் பற்றிக்கொள்ளுதல் என்ற மூலச்சொல்லின் பரப்பை நவீனத் தமிழில் தெளிவாக வழங்குகிறது.
- source_word: τί
  choice: என்ன என்பதை
  rationale: புரிந்துகொள்ள வேண்டிய உள்ளடக்கத்தை அறிமுகப்படுத்தும் மறைமுக வினாவை இயல்பான தமிழ் தொடரமைப்பில் தருகிறது.
- source_word: τὸ θέλημα
  choice: விருப்பம்
  rationale: θέλημα குறிக்கும் சித்தம், நோக்கம், விரும்பப்படுவது ஆகியவற்றை பொதுவாசகருக்கு இயல்பான தமிழில் தருகிறது; இங்கு வெறும் உணர்ச்சி ஆசை என்று குறுகச் செய்யாது.
- source_word: τοῦ κυρίου
  choice: ஆண்டவருடைய
  rationale: κύριος என்பதற்கான மரியாதைமிக்க, வழக்கமான தமிழ் இணை; கிரேக்கம் குறிப்பிடாத ‘இயேசு’ அல்லது ‘கடவுள்’ என்ற அடையாளத்தை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
theological_decisions:
- issue: τοῦ κυρίου என்பதன் குறிப்பு
  choice: ஆண்டவர் என்று மட்டும் மொழிபெயர்க்கப்பட்டது.
  alternative: ஆண்டவராகிய இயேசு; கடவுள்
  rationale: சூழலில் இது இயேசுவைக் குறிக்க வாய்ப்பிருந்தாலும், இவ்வசனம் κύριος என்று மட்டுமே கூறுகிறது. மூலத்தின் தெளிவின்மையைப் பாதுகாக்க அடையாளம் கூடுதலாகச் சேர்க்கப்படவில்லை.
- issue: μὴ γίνεσθε என்ற தடையின் வலிமை
  choice: ஆகாதீர்கள்
  alternative: இராதீர்கள்; அப்படி ஆகிக்கொண்டிருப்பதை நிறுத்துங்கள்
  rationale: கேட்போர் ஏற்கெனவே முழுமையாக அறிவற்றவர்கள் என்று முன்கூட்டியே தீர்மானிக்காமல், அந்த நிலைக்கு வருவதைத் தடுக்கும் γίνομαι என்பதன் இயக்கநுட்பத்தைப் பாதுகாக்கிறது.
- issue: τὸ θέλημα என்பதன் மொழிபெயர்ப்பு
  choice: விருப்பம்
  alternative: சித்தம்; நோக்கம்
  rationale: ‘சித்தம்’ இறையியல் வழக்கில் பரவலாக இருந்தாலும் சில பொதுவாசகர்களுக்கு உயர்நடைச் சொல்லாக அமையலாம். ‘விருப்பம்’ இயல்பானது; அதேவேளை ஆண்டவர் விரும்புவது என்ன என்ற கட்டளையின் பொருளைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க பன்மைக் கட்டளை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. ‘ஆண்டவர்’ என்ற வழக்கமான வேதாகமச் சொல் தக்கவைக்கப்பட்டாலும், வாக்கிய அமைப்பு பொதுவாசகருக்கு இயல்பாக வைக்கப்பட்டுள்ளது.
