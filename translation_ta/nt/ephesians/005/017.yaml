revisions:
- from: இதனால்[a], அறிவற்றவர்களாக ஆகாதீர்கள்; மாறாக, ஆண்டவருடைய விருப்பம் என்ன என்பதைப் புரிந்துகொள்ளுங்கள்.
  to: இதனால்[a], அறிவற்றவர்களாகிவிடாதீர்கள்; மாறாக, ஆண்டவரின் சித்தம் என்ன என்பதைப் புரிந்துகொள்ளுங்கள்.
  rationale: The revision improves Tamil idiom, uses ‘சித்தம்’ for the Lord’s will, and corrects the footnote’s description of the negative prohibition. It preserves the source’s contrast, its non-specific reference to ‘the Lord,’ and the process-oriented force of γίνεσθε.
