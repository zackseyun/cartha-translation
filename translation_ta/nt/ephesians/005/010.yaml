- from: ஆண்டவருக்கு எது உகந்தது என்பதைச் சோதித்து அறிந்துகொள்ளுங்கள்.[a]
  to: ஆண்டவருக்கு எது உகந்தது என்பதைச் சோதித்து அறிந்துகொண்டு,[a]
  rationale: The revision changes the imperative to a continuative participial expression, matching the Greek participle and allowing the verse to continue syntactically with its context. It otherwise retains the draft’s faithful and natural lexical choices, including the ambiguity of “ஆண்டவர்.”
