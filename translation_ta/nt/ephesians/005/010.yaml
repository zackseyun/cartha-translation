  text: testing what is pleasing to the Lord;[a]
translation:
  language: ta
  text: ஆண்டவருக்கு எது உகந்தது என்பதைச் சோதித்து அறிந்துகொண்டு,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்டவருக்கு எது உகந்தது என்பதைப் பகுத்தறிந்து” அல்லது “கண்டறிந்து.”
    reason: δοκιμάζοντες என்பது சோதித்தல், பகுத்தறிதல், கண்டறிதல் ஆகிய தொடர்புடைய பொருள்களைத் தரக்கூடும்.
lexical_decisions:
- source_word: δοκιμάζοντες
  choice: சோதித்து அறிந்துகொள்ளுங்கள்
  rationale: இந்த நிகழ்காலச் செயப்பாட்டு எச்சம் தொடர்ந்து ஆராய்ந்து, மதிப்பிட்டு, உறுதிப்படுத்தும் செயலைக் குறிக்கிறது. தமிழில் வசனத்தின் அறிவுறுத்தல் ஓட்டத்தை இயல்பாக வெளிப்படுத்த வினையெச்சத்தின் பொருள் ஏவல் வடிவில் தரப்பட்டுள்ளது; ‘சோதித்து’ என்பது மதிப்பீட்டு வலிமையையும், ‘அறிந்துகொள்ளுங்கள்’ என்பது அதன் விளைவையும் காக்கிறது.
- source_word: τί
  choice: எது
  rationale: மறைமுக வினாவை நவீன தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: ἐστιν
  choice: என்பதை
  rationale: கிரேக்க இணைப்புவினையின் பொருள் தமிழின் மறைமுக வினா அமைப்பான ‘எது … என்பதை’ என்பதில் இயல்பாக அடங்குகிறது.
- source_word: εὐάρεστον
  choice: உகந்தது
  rationale: ஆண்டவருக்கு ஏற்புடையதும் அவரை மகிழ்விப்பதுமானதை இயல்பான, கண்ணியமான தமிழில் தெரிவிக்கிறது; ‘பிரியமானது’ என்பதைவிட இச்சூழலில் தெளிவானது.
- source_word: τῷ κυρίῳ
  choice: ஆண்டவருக்கு
  rationale: εὐάρεστον உடன் வரும் தத்திவை ‘ஆண்டவருக்கு உகந்தது’ என்று இயல்பாக மொழிபெயர்க்கிறது. κύριος என்ற பட்டத்தின் சுட்டுப்பொருளை விரிவாக்காமல் பாதுகாக்கிறது.
theological_decisions:
- issue: κύριος என்பவரின் சுட்டுப்பொருள்
  choice: ஆண்டவர்
  alternative: ஆண்டவராகிய இயேசு; கடவுள்
  rationale: கிரேக்க உரை κύριος என்ற பட்டத்தை மட்டுமே பயன்படுத்துகிறது. சூழலில் அது கிறிஸ்துவைக் குறிக்கலாம் என்றாலும், மொழிபெயர்ப்பு வசனம் வெளிப்படையாகக் கூறாத அடையாளத்தைச் சேர்க்காமல் அதன் இறையியல் திறந்தநிலையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்கு தெளிவாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. தனியே வாசிக்கப்படும் வசனமாக இயல்பதற்காக கிரேக்க வினையெச்சத்தின் அறிவுறுத்தல் வலிமை ஏவல் வடிவில் வெளிப்படுத்தப்பட்டுள்ளது; அடிக்குறிப்பு மாற்றுப் பொருள்களைப் பாதுகாக்கிறது.
