lexical_decisions:
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான விளக்கக் காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக இயல்பாக அமைகிறது.
- source_word: καρπὸς
  choice: கனி
  rationale: ஒழுக்க மற்றும் ஆவிக்குரிய பண்புகள் உருவாகுவதைச் சுட்டும் பவுலின் உருவகத்தைத் தக்கவைக்கிறது.
- source_word: τοῦ φωτός
  choice: ஒளியின்
  rationale: 8ஆம் வசனத்தில் வரும் ‘ஒளி’ என்பதைத் தொடர்ந்து சுட்டும் உருபுடைய மரபுத்தொடரை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: ἐν
  choice: காணப்படுகிறது
  rationale: தமிழில் இடப்பொருளாகத் தவறாகப் புரியக்கூடிய ‘இருக்கிறது’ என்பதற்குப் பதிலாக, இந்தப் பண்புகளில் கனி வெளிப்படுகிறது என்ற சூழல் சார்ந்த பொருளை இயல்பாகத் தருகிறது.
- source_word: πάσῃ
  choice: எல்லா
  rationale: ஒருமை கருத்துப்பெயர்களுடன் வரும் πᾶς-இன் முழுமையான, பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: ἀγαθωσύνῃ
  choice: நற்குணம்
  rationale: ஒழுக்க நன்மையையும் நன்மை செய்யும் பண்பையும் உள்ளடக்கக்கூடிய இயல்பான தமிழ் சொல்.
- source_word: δικαιοσύνῃ
  choice: நீதி
  rationale: இச்சூழலில் நேர்மையான வாழ்வையும் நியாயத்தையும் உள்ளடக்கக்கூடிய பொதுத் தமிழ் சொல்; ‘நீதித்தன்மை’ என்ற மாற்றும் குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἀληθείᾳ
  choice: உண்மை
  rationale: மெய்மை மற்றும் உண்மைத்தன்மை ஆகிய இரண்டையும் சுருக்காமல் பரந்த பொருளில் காக்கிறது.
theological_decisions:
- issue: Genitive phrase textual variant
  choice: ஒளியின் கனி
  alternative: ஆவியானவரின் கனி
  rationale: SBLGNT-இன் φωτός என்ற வாசகம் முந்தைய வசனத்தின் ஒளி சார்ந்த சூழலுடன் நன்கு பொருந்துகிறது; πνεύματος என்ற கையெழுத்துப் பிரதி வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: δικαιοσύνη என்பதன் பொருள்
  choice: நீதி
  alternative: நீதித்தன்மை
  rationale: சொல் நீதியான நடத்தை மற்றும் நியாயம் ஆகிய இரண்டையும் குறிக்கலாம்; முதன்மை உரை இயல்பான தமிழைப் பயன்படுத்தி, மாற்றுச் சாயலை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீனத் தரமான, எளிதில் புரியும், கண்ணியமான தமிழ். ‘கனி’ என்ற வேதாகம உருவகம் தக்கவைக்கப்பட்டுள்ளது; ἐν என்பதன் வெளிப்பாட்டு நுணுக்கம் இயல்பான தமிழில் ‘காணப்படுகிறது’ என வழங்கப்பட்டுள்ளது.
