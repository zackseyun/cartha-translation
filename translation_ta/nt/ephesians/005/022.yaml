  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பல மொழிபெயர்ப்புகள் 21ஆம் வசனத்திலிருந்து ‘கீழ்ப்படியுங்கள்’ என்பதை இங்கேச் சேர்த்து, ‘மனைவிகளே, ஆண்டவருக்குக் கீழ்ப்படிவதுபோல உங்கள் சொந்தக் கணவர்களுக்குக் கீழ்ப்படியுங்கள்’ என்று மொழிபெயர்க்கின்றன. ஆனால் 22ஆம் வசனத்தின் கிரேக்க உரையிலேயே வினைச்சொல் இல்லை; இது 21ஆம் வசனத்தில் உள்ள ‘கீழ்ப்படிந்து’ என்ற சொல்லைச் சார்ந்த நிறைவுறாத தொடராகும்.
