lexical_decisions:
- source_word: Αἱ γυναῖκες
  choice: மனைவிகளே
  rationale: இல்லற உறவுகளைப் பற்றிய இந்தச் சூழலிலும், ‘தங்கள் சொந்தக் கணவர்களுக்கு’ என்ற இணைச் சொற்றொடராலும், γυνή என்பது பொதுவாக ‘பெண்கள்’ என்பதைக் காட்டிலும் உறவுமுறைப் பொருளில் ‘மனைவிகள்’ என்பதைக் குறிக்கிறது. தமிழில் நேரடியாக அழைக்கும் இயல்பைத் தர ‘மனைவிகளே’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: உங்கள் சொந்தக் கணவர்களுக்கு
  rationale: ἀνήρ இங்கு ‘ஆண்’ என்பதை அல்ல, திருமண உறவில் ‘கணவர்’ என்பதைக் குறிக்கிறது. ἰδίοις என்பதிலுள்ள குறிப்பிட்ட உறவின் வலியுறுத்தலைக் காக்க ‘சொந்த’ என்பதும் தக்கவைக்கப்பட்டது.
- source_word: ὡς
  choice: இருப்பதுபோல
  rationale: ὡς காட்டும் ஒப்பீட்டைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; அந்த ஒப்பீட்டின் முழுத் தன்மையை விளக்கிச் சேர்க்காமல் விடுகிறது.
- source_word: τῷ κυρίῳ
  choice: ஆண்டவருக்கு
  rationale: பவுலின் இச்சூழலில் κύριος ஆண்டவராகிய இயேசுவைக் குறிக்கிறது; தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் தெளிவானதும் கண்ணியமானதுமான ‘ஆண்டவர்’ பயன்படுத்தப்பட்டது.
- source_word: implicit verb from context
  choice: முதன்மை உரையில் வினைச்சொல் சேர்க்கப்படவில்லை
  rationale: இந்த வசனத்தின் கிரேக்க உரையில் தனி வினைச்சொல் இல்லை; 21ஆம் வசனத்திலுள்ள ὑποτασσόμενοι என்பதிலிருந்து கருத்து தொடர்கிறது. இறுதிக் கோடு இந்த இலக்கணத் தொடர்ச்சியையும் நிறைவுறாத அமைப்பையும் சுட்டுகிறது.
theological_decisions:
- issue: 22ஆம் வசனத்தின் கிரேக்க உரையில் இல்லாத ‘கீழ்ப்படியுங்கள்’ என்ற வினையை முதன்மை உரையில் சேர்ப்பதா?
  choice: வினைச்சொல்லைச் சேர்க்காமல், மூலத்தின் நிறைவுறாத சொற்றொடர் அமைப்பைத் தக்கவைத்தல்
  alternative: மனைவிகளே, ஆண்டவருக்குக் கீழ்ப்படிவதுபோல உங்கள் சொந்தக் கணவர்களுக்குக் கீழ்ப்படியுங்கள்.
  rationale: ‘கீழ்ப்படிதல்’ என்ற கருத்து 21ஆம் வசனத்திலிருந்து இயல்பாகத் தொடர்கிறது. ஆயினும் அதை 22ஆம் வசனத்துக்குள்ளேயே வெளிப்படையான கட்டளையாகச் சேர்ப்பது, இந்த வசனத்தின் கிரேக்கச் சொற்களில் இல்லாததைச் சேர்த்துவிடும். மூலத்தின் சார்புநிலையையும் இறையியல் அழுத்தத்தையும் மாற்றாமல் இருக்க வினை விடுபட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான நேரடி அழைப்பு பயன்படுத்தப்பட்டுள்ளது. மூல கிரேக்கத்தின் நிறைவுறாத இலக்கண அமைப்பைத் தமிழிலும் உணர்த்த இறுதியில் நீண்ட கோடு இடப்பட்டுள்ளது; அடிக்குறிப்பு இல்லாமலும் வாசகர் முந்தைய வசனத்துடன் தொடர்ச்சியை உணர இது உதவுகிறது.
