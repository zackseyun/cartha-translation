revisions:
- from: 'ஏனெனில், இதை நீங்கள் அறிந்து புரிந்திருக்கிறீர்கள்: பாலியல் ஒழுக்கக்கேடுள்ளவனோ, அசுத்தமானவனோ, பேராசைக்காரனோ—அவன் சிலைவழிபாட்டுக்காரன்[a]—மேசியாவுக்கும் கடவுளுக்கும் உரிய அரசில் சுதந்தர உரிமை பெற்றிருக்கவில்லை.'
  to: 'ஏனெனில், இதை நீங்கள் உறுதியாக அறிந்துகொள்ளுங்கள்: பாலியல் ஒழுக்கக்கேடுள்ளவனோ, அசுத்தமானவனோ, அல்லது பேராசைக்காரனோ—பேராசைக்காரன் சிலைவழிபாட்டுக்காரன்[a]—மேசியாவுக்கும் கடவுளுக்கும் உரிய அரசில் சுதந்தர உரிமை இல்லை.'
  rationale: The revision retains the draft’s meaning and terminology while making the idolatry clause’s most likely contextual connection—especially with greed—clear in Tamil. The footnote continues to preserve the Greek neuter-relative construction’s abstract alternative. It also changes the inheritance clause to a present-status expression and gives the opening a more natural emphatic form.
