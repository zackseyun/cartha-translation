reference: Ephesians 5:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τοῦτο γὰρ ⸀ἴστε γινώσκοντες ὅτι πᾶς πόρνος ἢ ἀκάθαρτος ἢ πλεονέκτης, ⸀ὅ ἐστιν εἰδωλολάτρης, οὐκ ἔχει κληρονομίαν ἐν τῇ βασιλείᾳ τοῦ Χριστοῦ καὶ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/005.yaml
  text: For you know this[a], understanding that every sexually immoral or unclean or greedy person, who is an idolater[b], has no inheritance in the kingdom of Messiah and God.
translation:
  language: ta
  text: 'ஏனெனில், இதை நீங்கள் உறுதியாக அறிந்துகொள்ளுங்கள்: பாலியல் ஒழுக்கக்கேடுள்ளவனோ, அசுத்தமானவனோ, அல்லது பேராசைக்காரனோ—பேராசைக்காரன் சிலைவழிபாட்டுக்காரன்[a]—மேசியாவுக்கும் கடவுளுக்கும் உரிய அரசில் சுதந்தர உரிமை இல்லை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொற்படியான வகையில், “அது சிலைவழிபாடு”; இது குறிப்பாக பேராசையைக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἴστε γινώσκοντες
  choice: அறிந்து புரிந்திருக்கிறீர்கள்
  rationale: οἶδα என்பதையும் γινώσκω என்பதன் பங்கேற்பு வடிவத்தையும் பிரதிபலித்து, வலியுறுத்தப்பட்ட அறிதல் மற்றும் புரிதல் ஆகிய இரு நுணுக்கங்களையும் இயல்பான தமிழில் காக்கிறது.
- source_word: πόρνος
  choice: பாலியல் ஒழுக்கக்கேடுள்ளவன்
  rationale: பாலியல் ஒழுக்கக்கேட்டால் அடையாளப்படுத்தப்படும் நபரைக் குறிக்கிறது; குறுகிய அல்லது பழமையான சொல்லைத் தவிர்த்து நவீன வாசகருக்குத் தெளிவாக உள்ளது.
- source_word: ἀκάθαρτος
  choice: அசுத்தமானவன்
  rationale: ஒழுக்கரீதியான தூய்மையின்மையைச் சுட்டுவதோடு, மூலச்சொல்லிலுள்ள தூய்மை–அசுத்தம் என்ற உருவக ஒலியையும் காக்கிறது.
- source_word: πλεονέκτης
  choice: பேராசைக்காரன்
  rationale: மேலும் மேலும் கைப்பற்ற விரும்பும் பேராசையால் அடையாளப்படுத்தப்படும் நபரை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: ὅ ἐστιν εἰδωλολάτρης
  choice: அவன் சிலைவழிபாட்டுக்காரன்
  rationale: சூழலிலும் கொலோசெயர் 3:5-இன் ஒத்த தொடரிலும் பேராசைக்காரன் சிலைவழிபாட்டுக்காரனாக விவரிக்கப்படுவது இயல்பான பொருள். மூலத்தின் இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: κληρονομίαν
  choice: சுதந்தர உரிமை
  rationale: பவுலின் உடன்படிக்கை மற்றும் இறுதிக்காலப் பின்னணியுள்ள ‘inheritance’ கருத்தை வெறும் ‘பங்கு’ என்பதைக் காட்டிலும் முழுமையாகக் காக்கிறது.
- source_word: βασιλείᾳ
  choice: அரசு
  rationale: ஆட்சி மற்றும் ஆளுகைக்குட்பட்ட தளம் ஆகிய இரு நுணுக்கங்களையும் சூழலுக்கேற்ற நிறுவப்பட்ட தமிழ்ச் சொல்லால் வெளிப்படுத்துகிறது.
- source_word: Χριστοῦ
  choice: மேசியா
  rationale: Χριστός இங்கு பெயராக அல்ல, பட்டமாகச் செயல்படுவதால் ‘மேசியா’ என்று மொழிபெயர்க்கப்படுகிறது.
- source_word: τοῦ Χριστοῦ καὶ θεοῦ
  choice: மேசியாவுக்கும் கடவுளுக்கும் உரிய
  rationale: இரு ஒருமைப் பெயர்ச்சொற்களுக்கிடையிலான நெருங்கிய தொடர்பைத் தக்கவைத்தாலும், விவாதத்திற்குரிய குறிப்பிட்ட கிறிஸ்தியல் இலக்கண முடிவை மொழிபெயர்ப்பில் திணிக்காமல் நேரடியாக இணைக்கிறது.
theological_decisions:
- issue: ὅ ἐστιν εἰδωλολάτρης என்பதன் தொடர்பு
  choice: முன்னர் குறிப்பிடப்பட்ட நபருக்கு, குறிப்பாக பேராசைக்காரனுக்கு, பொருந்துமாறு ‘அவன் சிலைவழிபாட்டுக்காரன்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அது சிலைவழிபாடு’ என்று பேராசையைச் செயல் அல்லது பண்பாகக் குறிப்பிடுதல்.
  rationale: ὅ என்பது நடுநிலைப் பால்; εἰδωλολάτρης என்பது ஆண்பால். இந்த இலக்கண இழுப்பு உண்மையான தெளிவின்மையை உண்டாக்குகிறது. சூழலும் கொலோசெயர் 3:5-உம் தனிநபரை மைய உரையில் குறிப்பிடுவதை ஆதரிக்கின்றன; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: அரசில் சுதந்தர உரிமை இல்லாமை
  choice: οὐκ ἔχει என்ற நிகழ்காலத்தை ‘சுதந்தர உரிமை பெற்றிருக்கவில்லை’ என நிகழ்நிலை அறிக்கையாக வைத்தல்.
  alternative: ‘அரசைச் சுதந்தரித்துக்கொள்ள மாட்டான்’ என்று எதிர்கால நிகழ்வாக மொழிபெயர்த்தல்.
  rationale: மூலத்தில் எதிர்கால வினை இல்லை. நிகழ்கால நிலையைத் தக்கவைத்தல் எச்சரிக்கையின் வலிமையைக் குறைக்காமலும் அதை வெறும் எதிர்கால நிகழ்வாக மாற்றாமலும் உள்ளது.
- issue: ‘மேசியா மற்றும் கடவுள்’ ஆகியோரின் தொடர்பு
  choice: ‘மேசியாவுக்கும் கடவுளுக்கும் உரிய அரசு’ என இரு இணை உரிமையாளர்களைக் குறிக்கும் அமைப்பை நேரடியாகக் காத்தல்.
  alternative: ஒரு குறிப்பிட்ட கிறிஸ்தியல் இலக்கண முடிவை வெளிப்படையாக வலியுறுத்தும் விளக்க மொழிபெயர்ப்பு.
  rationale: ஒரே சுட்டுப்பெயருடன் வரும் இரண்டு ஒருமை உரிமை வேற்றுமைகள் நெருங்கிய கருத்தியல் ஒன்றிப்பை உணர்த்தலாம்; எனினும் மூலவாசகம் தெளிவாகச் சொல்வதைத் தாண்டி விவாதத்திற்குரிய முடிவை மொழிபெயர்ப்பு கட்டாயப்படுத்தக்கூடாது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. பட்டியலின் ஓட்டத்தையும் கடுமையான எச்சரிக்கையையும் காக்க முக்காற்புள்ளியும் இடைக்கோடுகளும் பயன்படுத்தப்பட்டுள்ளன; சமயப்பிரிவுக்குரிய தனிச்சொற்கள் தவிர்க்கப்பட்டுள்ளன.
