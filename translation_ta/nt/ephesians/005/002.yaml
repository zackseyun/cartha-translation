base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/002.yaml
  text: and walk in love[a], just as the Messiah also loved us and gave himself up for us[c][b], an offering and sacrifice to God for a fragrant aroma.
translation:
  language: ta
  text: மேசியாவும் நம்மை அன்புகூர்ந்து, நமக்காகத் தம்மையே கடவுளுக்கு நறுமணம் வீசும் காணிக்கையாகவும் பலியாகவும் ஒப்புக்கொடுத்ததுபோல, அன்பில் நடங்கள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நமக்காக” என்பது “நமது சார்பாக” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “நறுமணம் வீசும்” என்ற சொற்றொடர், கடவுளுக்கு ஏற்ற பலியைப் பற்றிய பழைய ஏற்பாட்டின் பலியியல் மொழியை எதிரொலிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: περιπατεῖτε
  choice: நடங்கள்
  rationale: வாழ்க்கை நடத்தையைக் குறிக்கும் பவுலின் உருவகத்தைத் தக்கவைக்கிறது; தமிழிலும் சூழலில் புரிந்துகொள்ளத்தக்கது.
- source_word: ἐν ἀγάπῃ
  choice: அன்பில்
  rationale: அன்பே வாழ்வின் சூழலும் பண்பும் என்ற இரு நுணுக்கங்களையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ὁ Χριστός
  choice: மேசியா
  rationale: இங்கு அடைமொழியுடன் வரும் Χριστός பெயர்போல அல்லாமல் பட்டமாகச் செயல்படுவதால், அதன் பொருளைத் தெரிவிக்கும் ‘மேசியா’ பயன்படுத்தப்பட்டது.
- source_word: ἠγάπησεν ἡμᾶς
  choice: நம்மை அன்புகூர்ந்து
  rationale: ἀγάπη என்பதுடனான சொற்பொருள் தொடர்பைப் பேணுகிறது; இறந்தகாலச் செயலை இயல்பான தமிழ் வினையெச்சத் தொடரால் வெளிப்படுத்துகிறது.
- source_word: παρέδωκεν ἑαυτὸν
  choice: தம்மையே ஒப்புக்கொடுத்தார்
  rationale: தன்னார்வமான சுய அர்ப்பணிப்பையும் தியாகச் சூழலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὑπὲρ ἡμῶν
  choice: நமக்காக
  rationale: நமது நன்மைக்காக அல்லது நமது சார்பாக என்ற பரப்பைத் தக்கவைத்து, ‘நமது இடத்தில்’ என்று தேவையற்ற வகையில் குறுக்கவில்லை.
- source_word: προσφορὰν καὶ θυσίαν
  choice: காணிக்கையாகவும் பலியாகவும்
  rationale: இரு பலியியல் சொற்களையும் ஒன்றாகக் கலக்காமல் தனித்தனியாகப் பாதுகாக்கிறது.
- source_word: τῷ θεῷ
  choice: கடவுளுக்கு
  rationale: காணிக்கை செலுத்தப்படும் பெறுநர் அல்லது திசையைத் தெளிவாகக் காட்டுகிறது.
- source_word: εἰς ὀσμὴν εὐωδίας
  choice: நறுமணம் வீசும்
  rationale: பழைய ஏற்பாட்டுப் பலியியல் மொழியின் மணம் சார்ந்த தெளிவான உருவகத்தைப் பேணும் இயல்பான தமிழ் சொற்றொடர்.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: கிரேக்கத்தில் இங்கு இது பட்டமாகச் செயல்படுகிறது; ஆகவே அதன் பட்டப் பொருளை வெளிப்படுத்தும் மொழிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
- issue: பலியியல் சூழலில் ὑπὲρ ἡμῶν என்பதன் வலிமை
  choice: நமக்காக
  alternative: நமது சார்பாக; நமது இடத்தில்
  rationale: சுய அர்ப்பணிப்பு நமக்கு நன்மை பயப்பதையும் நமது சார்பில் இருப்பதையும் அனுமதிக்கிறது; ஆனால் முன்னிடைச்சொல் தனியாகக் கூறாத அளவுக்கு பதிலீட்டுப் பொருளை உரையில் கட்டாயப்படுத்தவில்லை.
- issue: εἰς ὀσμὴν εὐωδίας என்பதன் பலியியல் எதிரொலி
  choice: நறுமணம் வீசும் காணிக்கையாகவும் பலியாகவும்
  alternative: கடவுளுக்குப் பிரியமான வாசனையாக
  rationale: கடவுளுக்குப் பிரியமானது என்ற உட்கருத்தை விளக்கமாகச் சேர்க்காமல், மூலத்தின் மணம் சார்ந்த பலியியல் உருவகத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அன்பில் நடங்கள்’ என்ற உருவகம் மூலத்தின் சொற்படிமத்தைப் பேணுகிறது. நீண்ட கிரேக்க வாக்கியத்தை இயல்பான தமிழாக்கமாக அமைக்க, ஒப்பீட்டு தொடர் இறுதியில் மீளும் ‘நடங்கள்’ மூலம் தெளிவாக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
