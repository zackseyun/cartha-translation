  text: ἐξαγοραζόμενοι τὸν καιρόν, ὅτι αἱ ἡμέραι πονηραί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/016.yaml
  text: making the most of the time[a], because the days are evil.
translation:
  language: ta
  text: காலத்தைச் சிறந்த முறையில் பயன்படுத்திக்கொள்ளுங்கள்[a]; ஏனெனில் நாட்கள் தீயவையாக இருக்கின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “காலத்தை மீட்டுக்கொள்ளுங்கள்”; கிரேக்கச் சொற்றொடர் சொற்படியாக “காலத்தை விலைகொடுத்து வாங்கிக்கொள்ளுதல்” என்ற உருவகத்தைக் கொண்டது; “வாய்ப்பை முழுமையாகப் பயன்படுத்திக்கொள்ளுதல்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαγοραζόμενοι
  choice: முழுமையாகப் பயன்படுத்திக்கொள்ளுங்கள்
  rationale: இந்தச் சூழலில் இச்சொல் நேரடியாக ‘விலைகொடுத்து வாங்குதல்’ என்பதைக் காட்டிலும், கிடைக்கும் காலம் அல்லது வாய்ப்பைத் தவறவிடாமல் சிறந்த முறையில் பயன்படுத்துதல் என்ற இடைமொழிப் பொருளைத் தருகிறது. தமிழில் இயல்பான அறிவுறுத்தலாக வினைமுற்று வடிவில் தரப்பட்டுள்ளது.
- source_word: τὸν καιρόν
  choice: கிடைக்கும் காலத்தை
  rationale: καιρός என்பது பொதுவான காலத்தை மட்டுமல்லாமல் ஏற்ற நேரம் அல்லது வாய்ப்பையும் குறிக்கலாம். ‘கிடைக்கும் காலம்’ என்பது காலம் என்ற உருவகத்தைத் தக்கவைத்தபடியே வாய்ப்பின் நுண்ணுணர்வையும் வெளிப்படுத்துகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்தும் நவீன, கண்ணியமான தமிழ் இணைப்புச்சொல்.
- source_word: αἱ ἡμέραι
  choice: நாட்கள்
  rationale: மூலத்தின் பன்மை வடிவத்தையும் நிகழ்காலச் சூழ்நிலைகளைக் குறிக்கும் அதன் சுருக்கமான மொழியையும் நேரடியாகப் பேணுகிறது.
- source_word: πονηραί
  choice: தீயவையாக
  rationale: இச்சொல்லின் ஒழுக்கரீதியான தீமை மற்றும் எதிர்மறைத் தன்மையைப் பேணுகிறது; ‘கடினமானவை’ அல்லது ‘துன்பமானவை’ என்று மொழிபெயர்ப்பது அதன் ஒழுக்க நுண்ணுணர்வைத் தளர்த்தும்.
theological_decisions:
- issue: ἐξαγοραζόμενοι என்பதைக் மீட்பு அல்லது இரட்சிப்பு சார்ந்த சொல்லாகப் புரிந்துகொள்ளும் வாய்ப்பு
  choice: காலம் அல்லது வாய்ப்பை முழுமையாகப் பயன்படுத்துமாறு கூறும் நடைமுறை அறிவுறுத்தல்
  alternative: காலத்தை மீட்டுக்கொள்ளுங்கள்
  rationale: இந்த அறிவுரைச் சூழலில் வினைச்சொல் இரட்சிப்பியல் மீட்பை வெளிப்படையாகக் குறிப்பிடாமல், கிடைக்கும் வாய்ப்பைப் பயன்படுத்துவதைக் குறிக்கிறது. இருப்பினும் அதன் சொற்படையான வணிக/மீட்பு உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் தரப்பட்டுள்ளது. முந்தைய வசனத்தின் அறிவுறுத்தல் தொடர்வதால் பங்கேற்புவினை தமிழில் இயல்பான கட்டளை வடிவமாக மாற்றப்பட்டுள்ளது; [a] குறியீடு பிரதான உரையில் இடம்பெற்றுள்ளது.
