review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the exhortative force of ἐξαγοραζόμενοι and preserves the causal clause and the moral force of πονηραί. However, “கிடைக்கும் காலம்” adds the idea of time merely being available; καιρός more specifically denotes a time/occasion, often an opportunity, without explicitly asserting availability.
  naturalness: The sentence is clear and idiomatic modern standard Tamil. “காலத்தைச் சிறந்த முறையில் பயன்படுத்திக்கொள்ளுங்கள்” is slightly more natural and avoids the added nuance of “கிடைக்கும்.”
  terminology: “தீயவையாக இருக்கின்றன” appropriately preserves the morally negative sense of πονηραί. The footnote should retain both the traditional “redeem” rendering and the commercial image more precisely, without suggesting salvific redemption in the main text.
  issues:
  - severity: low
    issue: “கிடைக்கும் காலத்தை” adds a nuance not explicit in the Greek.
    rationale: While καιρός can refer to an opportunity, the adjective-like notion “available” is not stated. Rendering it simply as “காலத்தை” maintains the source's compact ambiguity; the opportunity sense can remain in the footnote.
  - severity: low
    issue: The footnote’s literal alternative does not clearly preserve the buying-up image of ἐξαγοραζόμενοι.
    rationale: “காலத்தை மீட்டுக்கொள்ளுங்கள்” reflects the traditional alternative, but adding “விலைகொடுத்து வாங்கிக்கொள்ளுதல்” more transparently represents the verb’s commercial metaphor and aligns with the English audit trail.
  revised_text: காலத்தைச் சிறந்த முறையில் பயன்படுத்திக்கொள்ளுங்கள்[a]; ஏனெனில் நாட்கள் தீயவையாக இருக்கின்றன.
