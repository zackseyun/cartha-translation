review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the prohibition against sharing in the unfruitful works associated with darkness and appropriately renders ἐλέγχετε in its contextual sense of exposure. However, its main text does not represent the additive/intensifying force of καὶ in μᾶλλον δὲ καὶ.
  naturalness: The Tamil is clear, dignified, and natural for modern standard Tamil. “வெளிச்சத்துக்குக் கொண்டுவாருங்கள்” is understandable, but “வெளிப்படுத்துங்கள்” is more direct and avoids adding the specific verb phrase “bring to light” where the Greek uses ἐλέγχετε, while still retaining the contextual implication of exposure.
  terminology: “பலனற்ற செயல்கள்,” “இருளுக்குரிய,” and “பங்குகொள்ளாதீர்கள்” are suitable modern Tamil equivalents. “வெளிப்படுத்துங்கள்” preserves the semantic range of ἐλέγχετε without limiting it to verbal rebuke; the footnote appropriately records that alternative.
  issues:
  - severity: low
    issue: The additive force of καὶ in μᾶλλον δὲ καὶ is not reflected in the main text.
    rationale: 'The Greek moves beyond nonparticipation to an additionally emphatic command: “but rather even/also expose.” Tamil can express this naturally with “மேலும்.”'
  - severity: low
    issue: “வெளிச்சத்துக்குக் கொண்டுவாருங்கள்” is a contextually valid interpretive expression, but it is less lexically direct than the source verb.
    rationale: ἐλέγχετε can mean expose, reprove, or convict. “வெளிப்படுத்துங்கள்” keeps the command suitably broad, and the note can explain the light-imagery and verbal-correction senses.
