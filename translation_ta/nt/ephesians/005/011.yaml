lexical_decisions:
- source_word: συγκοινωνεῖτε
  choice: பங்குகொள்ளாதீர்கள்
  rationale: இந்த வினைச்சொல் மற்றவர்களோடு சேர்ந்து ஒன்றில் பங்கெடுப்பதை அல்லது உடந்தையாக இருப்பதைக் குறிக்கிறது. ‘பங்குகொள்ளாதீர்கள்’ என்பது செயலில் ஈடுபடாதிருப்பதைக் குறிக்கும் இயல்பான நவீனத் தமிழ்.
- source_word: ἔργοις
  choice: செயல்களில்
  rationale: ‘செயல்கள்’ என்பது ἔργοις என்பதன் ஒழுக்கச் சூழலுக்கேற்ற இயல்பான தமிழ்; ‘கிரியைகள்’ என்பதைவிட பொதுவாசகர்களுக்கு தெளிவானது.
- source_word: ἀκάρποις
  choice: பலனற்ற
  rationale: இது கிரேக்கச் சொல்லிலுள்ள கனி/பலன் உருவகத்தைப் பாதுகாப்பதோடு, பயனுள்ள நற்பலனைத் தராத செயல்கள் என்ற ஒழுக்கப் பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: σκότους
  choice: இருளுக்குரிய
  rationale: தொடர்பைக் குறிப்பிடும் மரபுத்தொகையைத் தமிழில் இயல்பாகச் சொல்கிறது; இருளில் செய்யப்படுபவை என்று மட்டும் குறுக்காமல், இருளோடு அவற்றுக்குள்ள ஒழுக்கத் தொடர்பைப் பாதுகாக்கிறது.
- source_word: μᾶλλον δὲ καὶ
  choice: மாறாக
  rationale: இது தடைசெய்யப்பட்ட பங்கேற்புக்கும் கட்டளையிடப்பட்ட எதிர்செயலுக்கும் இடையிலான வலுவான முரண்பாட்டை இயல்பான தமிழில் காட்டுகிறது. அடுத்த கட்டளையின் நேர்மறையான செயற்பாடு கிரேக்க καί தரும் கூடுதல் வலிமையையும் சூழலில் உணர்த்துகிறது.
- source_word: ἐλέγχετε
  choice: வெளிச்சத்துக்குக் கொண்டுவாருங்கள்
  rationale: ἐλέγχω என்பது கண்டித்தல், குற்றத்தை வெளிப்படுத்துதல், உண்மை நிலையைத் தெளிவாக்குதல் ஆகிய நிழற்பொருள்களைக் கொண்டது. உடனுள்ள இருள்–ஒளி உருவகத்தின் அடிப்படையில் இத்தேர்வு வெளிப்படுத்தும் பொருளை முன்னிறுத்துகிறது; சொல்வழிக் கண்டித்தல் என்ற சாத்தியத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
theological_decisions:
- issue: தீய செயல்களை நோக்கிய ἐλέγχετε என்பதன் பொருள்
  choice: அவற்றை வெளிச்சத்துக்குக் கொண்டுவாருங்கள்
  alternative: அவற்றைக் கண்டியுங்கள் / அவற்றின் குற்றத்தை வெளிப்படுத்துங்கள்
  rationale: எபேசியர் 5:8–13 இல் ஒளி, இருள், புலப்படுதல் ஆகியவை மைய உருவகங்களாக உள்ளன. ஆகவே குற்றத்தை வெளிக்கொணரும் பொருள் இங்கு முதன்மையானது; எனினும் கிரேக்கச் சொல் ஒழுக்கக் கண்டிப்பையும் உள்ளடக்கக்கூடும் என்பதைக் குறிப்பில் வைத்திருக்கிறது.
- issue: எதிர்மறைத் தடைக்கும் நேர்மறைக் கட்டளைக்கும் இடையிலான வலிமை
  choice: பங்குகொள்ளாதீர்கள்; மாறாக ... வெளிச்சத்துக்குக் கொண்டுவாருங்கள்
  alternative: பகிர்ந்துகொள்ளாதீர்கள்; அதற்கு மாறாகக் கண்டியுங்கள்
  rationale: வசனம் தீமையிலிருந்து விலகுவதோடு நிற்காமல், அதை எதிர்கொண்டு வெளிப்படுத்தும் செயற்பாட்டையும் கட்டளையிடுகிறது. கிரேக்கம் குறிப்பிடாத குறிப்பிட்ட நடைமுறையை மொழிபெயர்ப்பு சேர்க்கவில்லை.
