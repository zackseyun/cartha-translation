lexical_decisions:
- source_word: γίνεσθε
  choice: ஆகுங்கள்
  rationale: γίνομαι என்பதன் நிகழ்காலக் கட்டளை வடிவம் ஒரு நிலைக்கு வருவதையும் அதில் தொடர்ந்து வளருவதையும் சுட்டலாம். ‘ஆகுங்கள்’ அதன் செயல்முறை சார்ந்த அறிவுறுத்தலை இயல்பான தமிழில் காக்கிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய கருத்திலிருந்து வரும் முடிவையோ நடைமுறை விளைவையோ குறிக்கிறது; ‘ஆகவே’ அந்தத் தர்க்கத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: μιμηταὶ
  choice: பின்பற்றுபவர்கள்
  rationale: மற்றொருவரின் பண்பையும் செயலையும் முன்மாதிரியாகக் கொண்டு அதன்படி நடப்பவர்களைக் குறிக்கிறது. ‘பின்பற்றுபவர்கள்’ என்பது நவீனத் தமிழில் இயல்பாக இருந்து, வெறும் சீடத்துவத்தைவிடப் பின்போலச் செய்தல் என்ற கருத்தையும் சூழலில் வெளிப்படுத்துகிறது.
- source_word: τοῦ θεοῦ
  choice: கடவுளைப்
  rationale: மூலத்தின் உரிமைத் தொடர்பு தமிழில் ‘கடவுளைப் பின்பற்றுபவர்கள்’ என்ற இயல்பான வினைத் தொடரால் வெளிப்படுகிறது.
- source_word: ὡς
  choice: …ஆக
  rationale: ஒப்புமை, முறை, அடையாளம் அல்லது அடிப்படை ஆகியவற்றுக்கிடையிலான சுருக்கமான தொடர்பை வெளிப்படையாகக் காரணவாக்கியமாக மாற்றாமல் காக்கிறது.
- source_word: τέκνα
  choice: பிள்ளைகள்
  rationale: பாலினம் சாராத குடும்ப உறவைக் குறிக்கிறது; ‘பிள்ளைகள்’ துல்லியமும் பொதுவாகப் புரியும் இயல்பும் உடையது.
- source_word: ἀγαπητά
  choice: அன்புக்குரிய
  rationale: அன்பு செலுத்தப்பட்ட, அருமையானவர்கள் என்ற பாச நிறைந்த பொருளைக் காக்கிறது; ‘அன்புக்குரிய’ dignified and natural in modern Tamil.
theological_decisions:
- issue: கடவுளின் பிள்ளைகள் என்ற அடையாளத்துக்கும் அவரைப் பின்பற்றும் கட்டளைக்கும் உள்ள தொடர்பு
  choice: விசுவாசிகள் அன்புக்குரிய பிள்ளைகளாக இருப்பதன் அடிப்படையிலும் முறையிலும் கடவுளைப் பின்பற்றுபவர்கள் ஆகும்படி அறிவுறுத்தப்படுகிறார்கள்; பின்பற்றுவதால் அவர்கள் பிள்ளைகளாகிறார்கள் என்று மொழிபெயர்ப்பு கூறவில்லை.
  alternative: ‘அன்புக்குரிய பிள்ளைகள் செய்வதுபோல கடவுளைப் பின்பற்றுங்கள்’ என்ற தளர்வான ஒப்புமையாக மட்டும் எடுத்துக்கொள்ளலாம்.
  rationale: ὡς τέκνα ἀγαπητά கட்டளையின் முறையையோ அடிப்படையையோ சுட்டுகிறது. ‘அன்புக்குரிய பிள்ளைகளாக’ என்பது காரணத்தை மிகையாக விளக்காமலும், பின்பற்றுதலால் பிள்ளை நிலை கிடைக்கிறது எனச் சொல்லாமலும் மூலத்தின் இறுக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘பின்பற்றுபவர்கள் ஆகுங்கள்’ என்ற அமைப்பு சற்றே திட்டமிட்ட முறையில் வைக்கப்பட்டுள்ளது; இது μιμηταί என்பதன் பெயர்ச்சொல் வடிவத்தையும் γίνεσθε என்பதன் ‘ஆகுதல்’ வலிமையையும் ஒருங்கே பாதுகாக்கிறது.
