  text: Οἱ ἄνδρες, ἀγαπᾶτε τὰς ⸀γυναῖκας, καθὼς καὶ ὁ Χριστὸς ἠγάπησεν τὴν ἐκκλησίαν καὶ ἑαυτὸν παρέδωκεν ὑπὲρ αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/025.yaml
  text: Husbands[a], love your wives, just as Messiah also loved the church and gave himself up for her[b],
translation:
  language: ta
  text: கணவர்களே, மேசியா[a] திருச்சபையை அன்புகூர்ந்து அதற்காகத் தம்மையே ஒப்புக்கொடுத்ததுபோல[b], நீங்களும் உங்கள் மனைவிகளை அன்புகூருங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கிறிஸ்து.’ கிரேக்கச் சொல்லான Χριστός இங்கு ஒரு பட்டமாக இருப்பதால், அதன் பொருளைக் காக்க ‘மேசியா’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘தம்மையே ஒப்புக்கொடுத்ததுபோல’ என்பதை ‘தம்மையே கையளித்ததுபோல’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνδρες
  choice: கணவர்களே
  rationale: இல்லற ஒழுங்கைப் பற்றிய சூழலிலும் γυναῖκας என்பதுடன் உள்ள இணைப்பிலும் இது பொதுவாக ஆண்களை அல்ல, மனைவிகளோடு உறவுடைய கணவர்களைக் குறிக்கிறது; அழைப்புவேற்றுமையை ‘-ஏ’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀγαπᾶτε / ἠγάπησεν
  choice: அன்புகூருங்கள் / அன்புகூர்ந்து
  rationale: இரு இடங்களிலும் ஒரே வேர்ச்சொல்லின் தொடர்பைக் காக்க ‘அன்புகூர்’ பயன்படுத்தப்பட்டது. முதல் வடிவம் தொடர்ச்சியான கட்டளையையும் இரண்டாவது மேசியாவின் கடந்தகாலச் செயலையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὰς γυναῖκας
  choice: உங்கள் மனைவிகளை
  rationale: திருமணச் சூழலில் γυναῖκας என்பது ‘மனைவிகள்’ என்று பொருள்படும். கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘உங்கள்’ என்பது கணவர்களுக்கான நேரடி அழைப்பில் உள்ள உறவுப் பொருளை தமிழில் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: καθὼς καὶ
  choice: …போல, நீங்களும்
  rationale: καθώς தரும் ஒப்புமையையும் καί தரும் இணைப்பு அல்லது வலியுறுத்தலையும் தமிழ் வாக்கிய அமைப்பில் ‘…போல, நீங்களும்’ இயல்பாகக் காக்கிறது.
- source_word: ὁ Χριστός
  choice: மேசியா
  rationale: Χριστός இங்கு அபிஷேகம் பெற்றவர் என்ற பட்டமாகச் செயல்படுகிறது; ‘மேசியா’ அதன் பட்டப்பொருளைக் காக்கிறது.
- source_word: τὴν ἐκκλησίαν
  choice: திருச்சபையை
  rationale: இங்கு ἐκκλησία தேவனுடைய மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது. நவீனத் தமிழ் கிறிஸ்தவப் பயன்பாட்டில் ‘திருச்சபை’ தெளிவான, நிலைபெற்ற இணைச்சொல்.
- source_word: ἑαυτὸν παρέδωκεν
  choice: தம்மையே ஒப்புக்கொடுத்தார்
  rationale: இது தன்னார்வமான சுயஒப்புக்கொடுத்தலை வெளிப்படுத்துகிறது. ‘தம்மையே’ என்பதில் பிரதிபெயரின் வலியுறுத்தல் காக்கப்படுகிறது; மூலத்தில் வெளிப்படையாக இல்லாத கூடுதல் பரிகார விளக்கம் சேர்க்கப்படவில்லை.
- source_word: ὑπὲρ αὐτῆς
  choice: அதற்காக
  rationale: ὑπέρ உடன் வரும் இத்தொடர் ‘அதற்காக/அதன் சார்பாக’ என்ற பொருளைத் தருகிறது. αὐτῆς திருச்சபையைச் சுட்டினாலும், தமிழில் உயிரற்ற பெண்பால் பிரதிப்பெயரைத் திணிக்காமல் ‘அதற்காக’ இயல்பாகப் பொருளைக் காக்கிறது.
theological_decisions:
- issue: திருமண–திருச்சபை ஒப்புமையில் Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: பட்டத்தின் பொருளை வெளிப்படையாகக் காக்க ‘மேசியா’ தேர்ந்தெடுக்கப்பட்டது; வாசகர்களுக்குப் பழக்கமான ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: παρέδωκεν ὑπὲρ αὐτῆς என்பதில் உள்ள பலியர்ப்பணச் சாயலின் அளவு
  choice: அதற்காகத் தம்மையே ஒப்புக்கொடுத்தார்
  alternative: அதன் சார்பாகத் தம்மைக் கையளித்தார்
  rationale: மேசியாவின் தன்னார்வமான சுயஒப்புக்கொடுத்தலையும் திருச்சபைக்கான செயலைவும் காக்கிறது; ஆனால் இக்கூற்றில் நேரடியாக இல்லாத குறிப்பிட்ட பரிகாரக் கோட்பாட்டுச் சொற்களைச் சேர்க்கவில்லை.
- issue: ἐκκλησίαν / αὐτῆς என்பதிலுள்ள கிரேக்கப் பெண்பால் வடிவம்
  choice: திருச்சபையை … அதற்காக
  alternative: திருச்சபையை … அவளுக்காக
  rationale: கிரேக்கத்தில் இலக்கணப் பெண்பால் இருப்பினும், தமிழில் ‘அவளுக்காக’ என்பது இவ்விடத்தில் இயல்பற்றதாகவும் மூலத்தைவிட வெளிப்படையான பெண் உருவகத்தை உருவாக்குவதாகவும் அமையும். ‘அதற்காக’ சுட்டுப்பொருளையும் இயல்பான தமிழ் நடையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தமிழ் வாக்கிய ஓட்டத்திற்காக ஒப்புமைக் கூறு முதலில் வைக்கப்பட்டு, கட்டளை இறுதியில் தரப்பட்டுள்ளது. ‘கணவர்களே’ மற்றும் ‘நீங்களும்’ நேரடி அழைப்பைத் தெளிவாக்குகின்றன; ஒரே அன்புச் சொல்லின் தொடர்பு இரு கூறுகளிலும் காக்கப்பட்டுள்ளது.
