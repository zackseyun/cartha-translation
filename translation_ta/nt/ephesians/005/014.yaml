source:
  edition: SBLGNT
  text: πᾶν γὰρ τὸ φανερούμενον φῶς ἐστιν. διὸ λέγει· Ἔγειρε, ὁ καθεύδων, καὶ ἀνάστα ἐκ τῶν νεκρῶν, καὶ ἐπιφαύσει σοι ὁ Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/014.yaml
  text: For everything that is made visible is light[a]. Therefore it says, “Wake up, sleeper, and rise from the dead[c][b], and Messiah will shine on you.”
translation:
  language: ta
  text: 'ஏனெனில், வெளிப்படுத்தப்படுவது அனைத்தும் ஒளியாக இருக்கிறது.[a] ஆகையால், இவ்வாறு சொல்லப்படுகிறது: “தூங்குகிறவனே, விழித்தெழு; இறந்தவர்களிடமிருந்து எழுந்திரு; மேசியா உன் மேல் ஒளிவீசுவார்.”[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வெளிச்சத்துக்குக் கொண்டுவரப்படுவது அனைத்தும் ஒளியாக இருக்கிறது’ அல்லது ‘காணத்தக்கதாக ஆக்கப்படுவது அனைத்தும் ஒளியாக இருக்கிறது’ என்றும் மொழிபெயர்க்கலாம். φανερούμενον என்பதற்கு ‘வெளிப்படுத்தப்படுவது’, ‘காணத்தக்கதாக ஆக்கப்படுவது’ ஆகிய பொருள்கள் வரலாம்.
    reason: lexical_alternative
  - marker: b
    text: இந்த மேற்கோளின் துல்லியமான மூலம் உறுதியாகத் தெரியவில்லை. இது வேதவசனக் கருத்துகளை, குறிப்பாக ஏசாயா 60:1-ஐ, எதிரொலிக்கலாம்; அல்லது தொடக்ககாலக் கிறிஸ்தவப் பாடலிலிருந்து வந்திருக்கலாம்.
    reason: cross_reference
  - marker: c
    text: கிரேக்கத்தில் ‘ὁ Χριστός’—‘மேசியா’; பாரம்பரியமாக ‘கிறிஸ்து’ என்றும் வழங்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶν
  choice: அனைத்தும்
  rationale: நபர்களை மட்டும் குறிப்பதாகக் கட்டுப்படுத்தாமல், நடுநிலை ஒருமை வடிவத்தின் பொதுவான பரப்பைத் தக்கவைக்கிறது.
- source_word: φανερούμενον
  choice: வெளிப்படச் செய்யப்படும்
  rationale: செயப்பாட்டு வினையெச்சத்தின் ‘காணத்தக்கதாக ஆக்கப்படும்’ என்ற பொருளைத் தருகிறது; ‘வெளிச்சத்துக்குக் கொண்டுவரப்படும்/வெளிப்படுத்தப்படும்’ என்ற சாத்தியமும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: φῶς
  choice: ஒளி
  rationale: ஒளி என்ற உருவகத்தை விளக்கவுரையால் குறுக்காமல் நேரடியாகத் தக்கவைக்கிறது.
- source_word: διὸ
  choice: ஆகையால்
  rationale: முந்தைய கூற்றிலிருந்து வரும் முடிவுறுத்தலை இயல்பான தமிழில் குறிக்கிறது.
- source_word: λέγει
  choice: இவ்வாறு கூறுகிறது
  rationale: கிரேக்கத்தில் எழுவாய் குறிப்பிடப்படாததால், வேதவசனம், கடவுள் அல்லது பாடல் என்று மூலத்தைத் தீர்மானிக்காமல் தமிழிலும் எழுவாயை வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: Ἔγειρε
  choice: விழித்தெழு
  rationale: உறக்க உருவகத்தையும் கட்டளைத் தொனியையும் இயல்பாகத் தருகிறது.
- source_word: ὁ καθεύδων
  choice: தூங்குகிறவனே
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் வினையெச்சத்தையும் நேரடி அழைப்பையும் தெளிவாகத் தக்கவைக்கிறது.
- source_word: ἀνάστα
  choice: எழுந்திரு
  rationale: இறந்தவர்களிடமிருந்து எழுதல் என்ற உயிர்த்தெழுதல் சார்ந்த ஒலிப்பையும் பொதுவான எழுந்திருத்தல் பொருளையும் காக்கிறது.
- source_word: ἐκ τῶν νεκρῶν
  choice: இறந்தவர்களிடமிருந்து
  rationale: ‘இறந்தவர்களின் நடுவிலிருந்து’ என்ற கருத்தைச் சுருக்கமான, இயல்பான தமிழில் வழங்குகிறது.
- source_word: ἐπιφαύσει
  choice: ஒளிவீசுவார்
  rationale: ‘மேல் ஒளிர்தல்/ஒளி கொடுத்தல்’ என்ற ஒளி உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: ὁ Χριστός
  choice: மேசியா
  rationale: இங்கு முன்னொட்டுடன் வரும் Χριστός பட்டமாகச் செயல்படுவதால் அதன் பொருளைத் தமிழில் வழங்குகிறது; பாரம்பரிய ‘கிறிஸ்து’ வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: மேற்கோளை அறிமுகப்படுத்தும் குரல் அல்லது மூலம்
  choice: எழுவாயைக் குறிப்பிடாமல் ‘இவ்வாறு கூறுகிறது’ என்று மொழிபெயர்த்தல்
  alternative: ‘வேதவசனம் கூறுகிறது’, ‘அவர் கூறுகிறார்’, அல்லது ‘ஒரு பாடலில் கூறப்படுகிறது’
  rationale: கிரேக்க உரை பேசுபவரையோ மேற்கோளின் மூலத்தையோ அடையாளப்படுத்தவில்லை; ஆகவே விவாதத்துக்குரிய அந்தக் கேள்வியை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: ὁ Χριστός இங்கு பட்டமாகத் தோன்றுவதால் அதன் பட்டப்பொருளை வெளிப்படுத்துகிறது; வழக்கமான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ‘இறந்தவர்களிடமிருந்து எழுந்திரு’ என்பதன் குறிப்பு
  choice: உயிர்த்தெழுதல் உருவகத்தை விளக்கமின்றித் தக்கவைத்தல்
  alternative: ஆவிக்குரிய உணர்வைப் பெறுதல் என்று விளக்கிப் பெயர்த்தல்
  rationale: உரை உடல்சார் உயிர்த்தெழுதல் மொழியையும் உருவகப் பயன்பாட்டையும் ஒன்றாக ஒலிக்க விடுகிறது; அவற்றில் ஒன்றாக மட்டும் பொருளைச் சுருக்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘விழித்தெழு’, ‘எழுந்திரு’, ‘ஒளிவீசுவார்’ ஆகிய சொற்கள் கவிதைநயமுள்ள மேற்கோளின் இணை அமைப்பையும் சாதாரண வாசகருக்கான தெளிவையும் காக்கின்றன. ‘இவ்வாறு கூறுகிறது’ என்பது தமிழில் சற்றே நூல்நடைத் தன்மை கொண்டிருந்தாலும், மூலத்தில் எழுவாய் குறிப்பிடப்படாதிருப்பதைப் பாதுகாக்கத் தேர்ந்தெடுக்கப்பட்டது.
