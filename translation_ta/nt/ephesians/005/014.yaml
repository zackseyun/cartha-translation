revisions:
- from: 'ஏனெனில், வெளிப்படச் செய்யப்படும் அனைத்தும் ஒளியாக இருக்கிறது.[a] ஆகையால், இவ்வாறு கூறுகிறது: “தூங்குகிறவனே, விழித்தெழு! இறந்தவர்களிடமிருந்து எழுந்திரு![b] மேசியா[c] உன்மேல் ஒளிவீசுவார்.”'
  to: 'ஏனெனில், வெளிப்படுத்தப்படுவது அனைத்தும் ஒளியாக இருக்கிறது.[a] ஆகையால், இவ்வாறு சொல்லப்படுகிறது: “தூங்குகிறவனே, விழித்தெழு; இறந்தவர்களிடமிருந்து எழுந்திரு; மேசியா உன் மேல் ஒளிவீசுவார்.”[b][c]'
  rationale: முதன்மைச் செயப்பாட்டு வினையெச்சம் நவீனத் தமிழில் இயல்பாக அமையச் செய்யப்பட்டு, மேற்கோளை அறிமுகப்படுத்தும் பெயரிலா நடை மேம்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு a-வும் முதன்மைத் தேர்வுடன் முரண்படாத வகையில் மாற்று வாசிப்புகளைத் தெளிவுபடுத்துகிறது. மேற்கோளின் உறுதியற்ற மூலமும் Χριστός என்பதன் மாற்று வழங்கலும் அவற்றுக்குரிய சொற்களோடு இணைக்கப்பட்டுள்ளன.
