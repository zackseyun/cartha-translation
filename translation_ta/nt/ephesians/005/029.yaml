  text: οὐδεὶς γάρ ποτε τὴν ἑαυτοῦ σάρκα ἐμίσησεν, ἀλλὰ ἐκτρέφει καὶ θάλπει αὐτήν, καθὼς καὶ ὁ ⸀Χριστὸς τὴν ἐκκλησίαν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/029.yaml
  text: For no one ever hated his own flesh[a], but nourishes and cherishes it, just as the Messiah also does the church[c][b],
translation:
  language: ta
  text: ஏனெனில், ஒருவனும் ஒருபோதும் தன் சொந்த மாம்சத்தை[a] வெறுத்ததில்லை; மாறாக, அதைப் போஷித்து அரவணைக்கிறான். அதுபோலவே மேசியாவும்[b] திருச்சபையைப் போஷித்து அரவணைக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘மாம்சம்’ என்பது பாவ இயல்பை அல்ல, ஒருவருடைய உடல்சார்ந்த சுயத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘கிறிஸ்துவும்.’ ‘மேசியா’ என்பது Χριστός என்ற கிரேக்கப் பட்டப்பெயரின் பொருளைத் தருகிறது.
    reason: alternative_rendering
lexical_decisions:
- source_word: οὐδεὶς γάρ ποτε
  choice: ஏனெனில், ஒருவனும் ஒருபோதும்
  rationale: γάρ முந்தைய கருத்துக்கான காரணத்தை அறிமுகப்படுத்துகிறது; οὐδεὶς ... ποτε என்பதன் பொதுவான மறுப்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὴν ἑαυτοῦ σάρκα
  choice: தன் சொந்த உடலை
  rationale: இங்கு σάρξ பாவ இயல்பைக் குறிக்காமல், ஒருவருடைய உடல்சார்ந்த சுயத்தைக் குறிக்கிறது. ‘உடல்’ என்பது நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது; ‘சொந்த’ என்பது ἑαυτοῦ-வின் வலியுறுத்தலைக் காக்கிறது.
- source_word: ἐμίσησεν
  choice: வெறுத்ததில்லை
  rationale: மισέω என்பதன் நேரான, இயல்பான தமிழ் இணை; இறந்தகால கிரேக்க வினையையும் உலகளாவிய அனுபவக் கூற்றையும் பொருத்தமாகத் தருகிறது.
- source_word: ἐκτρέφει
  choice: ஊட்டி
  rationale: உணவளித்து வளர்த்துப் பராமரிக்கும் பொருளை உடல் உருவகத்திற்கு ஏற்ற தெளிவான தமிழில் தருகிறது.
- source_word: θάλπει
  choice: அன்புடன் பேணுகிறான்
  rationale: வெப்பமளித்தல் என்ற அடிப்படை நிழற்பொருளிலிருந்து வரும் கனிவான பராமரிப்பை ‘அன்புடன் பேணுதல்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: καθὼς καὶ
  choice: அதுபோலவே ... உம்
  rationale: ஒப்பீட்டையும் καί-யின் சேர்க்கை வலியுறுத்தலையும் தமிழ் கட்டமைப்பில் காக்கிறது.
- source_word: ὁ Χριστὸς
  choice: மேசியா
  rationale: கட்டுரையுடன் வரும் Χριστός இங்கு பட்டப்பெயராகச் செயல்படுவதால் அதன் பொருளை மொழிபெயர்க்கிறது; பழக்கமான ‘கிறிஸ்து’ வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τὴν ἐκκλησίαν
  choice: திருச்சபையை
  rationale: பவுலின் பயன்பாட்டில் தேவனுடைய மக்களின் கூட்டுத்தொகுதியைக் குறிக்கும் ἐκκλησία-வுக்கான பரவலாகப் புரியப்படும், மரியாதைக்குரிய தமிழ் சொல்.
theological_decisions:
- issue: σάρξ என்பதன் மொழிபெயர்ப்பு
  choice: உடல்
  alternative: மாம்சம்
  rationale: சூழல் ஒருவரின் உடல்சார்ந்த சுயத்தைக் குறிக்கிறது; பாவ இயல்பைக் குறிக்கவில்லை. ‘உடல்’ நவீன தமிழில் தவறான இறையியல் பொருளைத் தவிர்த்து கருத்தைத் தெளிவாக்குகிறது; மூலச்சொல்லின் சொற்படியான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு Χριστός கட்டுரையுடன் பட்டப்பெயராக வருவதால் அதன் அர்த்தத்தை வெளிப்படுத்தும் ‘மேசியா’ தேர்ந்தெடுக்கப்பட்டது; பாரம்பரிய ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: இறுதி ஒப்பீட்டில் விடுபட்டுள்ள வினைகள்
  choice: ‘ஊட்டி அன்புடன் பேணுகிறார்’ என்று மீண்டும் வெளிப்படையாகக் கூறுதல்
  alternative: ‘அதுபோலவே மேசியாவும் திருச்சபையை’ என்று வினையை விடுதல்
  rationale: கிரேக்கத்தில் வினைகள் பொருளால் நிரப்பப்பட வேண்டிய நீக்கவடிவில் உள்ளன. தமிழில் முழுமையற்ற வாக்கியத்தைத் தவிர்க்க, முன் வந்த இரு வினைகளும் மீண்டும் கூறப்பட்டன; புதிய கருத்து சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதையுடனும் வடிவமைக்கப்பட்டது. ‘ஊட்டி அன்புடன் பேணுதல்’ என்ற இணைச்சொல், இரண்டு கிரேக்க வினைகளின் வேறுபாட்டைத் தக்கவைக்கிறது. இறுதி கிரேக்க நீக்கவடிவு தமிழில் தெளிவுக்காக முழுமைப்படுத்தப்பட்டுள்ளது.
