- from: ஏனெனில், ஒருவனும் ஒருபோதும் தன் சொந்த உடலை[a] வெறுத்ததில்லை. மாறாக, அதை ஊட்டி அன்புடன் பேணுகிறான்; அதுபோலவே மேசியாவும்[b] திருச்சபையை ஊட்டி அன்புடன் பேணுகிறார்.
