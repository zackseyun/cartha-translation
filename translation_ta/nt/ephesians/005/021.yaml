lexical_decisions:
- source_word: ὑποτασσόμενοι
  choice: பணிந்திருங்கள்
  rationale: நிகழ்காலப் பங்கேற்புவினை வடிவம் முந்தைய கட்டளைச் சூழலைத் தொடர்ந்து வருகிறது. தமிழில் தனி வசனமாக இயல்பாகவும் தெளிவாகவும் இருக்க, அதன் தொடர்ச்சியான அறிவுறுத்தல் பொருள் கட்டளை வடிவில் தரப்படுகிறது; ‘கீழ்ப்படிந்திருங்கள்’ என்பதைவிட ‘பணிந்திருங்கள்’ பரஸ்பரத் தாழ்மையையும் ஒப்புக்கொடுத்தலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀλλήλοις
  choice: ஒருவருக்கொருவர்
  rationale: பன்மை பரஸ்பரச் சுட்டுப்பெயரின் பொருளைத் தெளிவாகவும் வழக்கமான நவீனத் தமிழிலும் தருகிறது.
- source_word: ἐν φόβῳ
  choice: அஞ்சுகிறவர்களாய்
  rationale: ἐν உடன் வரும் φόβος குறிக்கும் மனநிலை அல்லது முறையை இயல்பான தமிழில் வெளிப்படுத்துகிறது. ‘பயம்’ என்ற பெயர்ச்சொல்லைக் காட்டிலும் ‘அஞ்சுதல்’ இங்கு மரியாதை கலந்த அச்சத்தையும் வலிமையான அடிப்படைப் பொருளையும் தக்கவைக்கிறது.
- source_word: Χριστοῦ
  choice: மேசியாவுக்கு
  rationale: Χριστός இங்கு பட்டப்பெயராகச் செயல்படுவதால் ‘மேசியா’ என வழங்கப்படுகிறது. கிரேக்க மரபுத்தொடரின் இயல்பான நோக்குப் பொருளைத் தமிழில் ‘மேசியாவுக்கு அஞ்சுதல்’ எனத் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: φόβῳ Χριστοῦ என்பதன் பொருள்
  choice: மேசியாவை நோக்கிய மரியாதை கலந்த அச்சம்
  alternative: மேசியாவால் உண்டாகும் அச்சம்; மேசியாவுக்கான பயபக்தி
  rationale: உடைமை வேற்றுமையை நோக்குப் பொருளாகப் புரிந்துகொள்வதே சூழலில் நேரடியான வாசிப்பு. எனினும் ‘அஞ்சுதல்’ என்ற வலிமையான சொல் வைக்கப்பட்டதால் இதை வெறும் மரியாதையாக மென்மையாக்காமல், உரையின் இறையியல் அழுத்தமும் பதற்றமும் காக்கப்படுகின்றன.
- issue: Χριστοῦ என்பதன் தமிழ் வடிவம்
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு Χριστός பெயரைப்போல அல்லாமல் பட்டமாகச் செயல்படுகிறது; ஆகவே பட்டப்பொருளை வெளிப்படுத்த ‘மேசியா’ பயன்படுத்தப்படுகிறது. மரபான ‘கிறிஸ்து’ வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ὑποτασσόμενοι பங்கேற்புவினையின் தொடர்பு
  choice: முந்தைய அறிவுறுத்தலைத் தொடரும் கட்டளைப் பொருள்
  alternative: ‘பணிகிறவர்களாய்’ என்று பங்கேற்புவினை வடிவை அப்படியே வைத்தல்
  rationale: கிரேக்கத்தில் இது முந்தைய கட்டளைச் சூழலைச் சார்ந்த பங்கேற்புவினை. தனி வசனமாகத் தரப்படும் தமிழில் வெறும் பங்கேற்புவினை முற்றாத வாக்கியமாக ஒலிக்கும்; கட்டளை வடிவம் செயல்பாட்டைத் தெளிவாக்குகிறது. ‘அஞ்சுகிறவர்களாய்’ என்ற தொடரால் சூழல் சார்ந்த அமைப்பின் ஓர் அளவு தக்கவைக்கப்படுகிறது.
translation_notes:
