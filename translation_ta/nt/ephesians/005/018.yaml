lexical_decisions:
- source_word: μεθύσκεσθε
  choice: குடித்து வெறிகொள்ளாதீர்கள்
  rationale: μή உடன் வரும் நிகழ்கால கட்டளை வடிவம் ஒரு தடையைத் தெரிவிக்கிறது. தமிழில் ‘குடித்து வெறிகொள்ளாதீர்கள்’ என்பது மதுவினால் போதை அடையும் செயலை இயல்பாகவும் தெளிவாகவும் கூறுகிறது.
- source_word: οἴνῳ
  choice: திராட்சை மது
  rationale: οἶνος என்பது இங்கு திராட்சை மதுவைக் குறிக்கிறது; பொதுவான ‘மது’ என்பதைவிட மூலச்சொல்லின் குறிப்பை இது தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἐν ᾧ
  choice: அதில்
  rationale: தொடர்புப்பெயர் முன் குறிப்பிடப்பட்ட திராட்சை மதுவையோ அதனுடன் தொடர்புடைய குடிவெறியையோ சுட்டலாம். ‘அதில்’ அந்த இணைப்பை மிகையாக விளக்காமல் வைத்திருக்கிறது.
- source_word: ἀσωτία
  choice: கட்டுப்பாடற்ற ஒழுக்கக்கேடு
  rationale: இந்தச் சொல் வீணான, வரம்பற்ற, ஒழுக்கமற்ற வாழ்க்கை நடத்தையைக் குறிக்கிறது. ‘கட்டுப்பாடற்ற ஒழுக்கக்கேடு’ அதன் நெறிசார் வலிமையையும் பரந்த பொருளையும் நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: πληροῦσθε
  choice: நிரப்பப்படுங்கள்
  rationale: இது நிகழ்காலச் செயப்பாட்டு கட்டளை. தொடர்ச்சியான அல்லது மீண்டும் நிகழும் தன்மை வடிவத்தில் இருந்தாலும், தமிழில் இயல்பான கட்டளைச் சொல்லே அதைப் போதுமான அளவு எடுத்துரைக்கிறது.
- source_word: ἐν πνεύματι
  choice: ஆவியால்
  rationale: ἐν உடன் வரும் வேற்றுமை வடிவம் கருவி, செயற்படுத்தும் ஆற்றல், அல்லது செயலின் தளம் ஆகிய நிழற்பொருள்களைத் தரலாம். ‘ஆவியால்’ தமிழில் இயல்பாக இருந்து தூய ஆவியைக் குறிக்கும் முதன்மை வாசிப்பைத் தருகிறது; மாற்றுப் புரிதல்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: πνεύματι என்பதன் சுட்டுப்பொருள் மற்றும் ἐν என்பதன் உறவு
  choice: தூய ஆவியைக் குறிக்கும் ‘ஆவியால்’
  alternative: ‘ஆவிக்குள்’ அல்லது பொதுவாக ‘ஆவியில்/உள்ளத்தில்’
  rationale: பவுலின் அறிவுரையின் சூழலில் πνεύματι என்பது தூய ஆவியைக் குறிக்கும் வாய்ப்பே அதிகம். எனினும் கிரேக்கத்தில் சுட்டுச்சொல் இல்லாததாலும் ἐν பல உறவுகளைத் தெரிவிக்கக்கூடியதாலும், தளம் சார்ந்த அல்லது மனித ஆவி சார்ந்த புரிதலை முற்றிலும் நீக்காமல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘திராட்சை மது’ மூலத்தின் குறிப்பைத் தக்கவைக்கிறது; ‘கட்டுப்பாடற்ற ஒழுக்கக்கேடு’ என்பது ἀσωτία என்பதின் வரம்பற்ற, ஒழுக்கமற்ற வாழ்க்கை நடத்தையை வெளிப்படுத்துகிறது. இறுதிச் சொற்றொடரின் உண்மையான பொருள் நிழல்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
