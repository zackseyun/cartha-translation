revisions:
- from: திராட்சை மது குடித்து வெறிகொள்ளாதீர்கள்; அதில் கட்டுப்பாடற்ற ஒழுக்கக்கேடு இருக்கிறது. மாறாக, ஆவியால்[a] நிரப்பப்படுங்கள்.
  to: திராட்சை மதுவால் வெறிகொள்ளாதீர்கள்; அதில் கட்டுப்பாடற்ற வாழ்வு உள்ளது. மாறாக, ஆவியால்[a] நிரப்பப்படுங்கள்.
  rationale: The revision improves idiomatic modern Tamil and removes redundancy in the rendering of ἀσωτία. It retains the Greek contrast between intoxication by wine and being filled in/with the Spirit. The footnote anchor remains correctly placed after “ஆவியால்,” and the footnote continues to preserve the grammatical and referential ambiguity of ἐν πνεύματι without treating a disputed interpretation as certain.
