  text: always giving thanks for everything to God the Father in the name of our Lord Jesus the Messiah[b][a],
translation:
  language: ta
  text: எல்லாவற்றிற்காகவும் எப்போதும் நம் ஆண்டவராகிய இயேசு மெசியாவின்[a] பெயரில் பிதாவாகிய கடவுளுக்கு நன்றி செலுத்துங்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, மரபான முறையில், “இயேசு கிறிஸ்து.”
