  - marker: b
    text: “எல்லாவற்றிற்காகவும்” என்பதை இன்னும் சொற்சொல்லாக “அனைத்துக் காரியங்களுக்காகவும்” என்றும் கொள்ளலாம்; சிலர் “எல்லாருக்காகவும்” என்றும் புரிந்துகொள்கிறார்கள். ஆனால் சூழல் எல்லாச் சூழ்நிலைகள் அல்லது காரியங்கள் என்ற விரிவான பொருளை ஆதரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστοῦντες
  choice: நன்றி செலுத்துங்கள்
  rationale: நிகழ்காலச் செயப்பெயரெச்சம் முந்தைய கட்டளையைத் தொடர்ந்து, நீடித்த செயலைக் குறிக்கிறது. தனி வசனமாக இயல்பான தமிழில் வாசிக்க கட்டளை வினையாக மொழிபெயர்க்கப்பட்டது; அதன் தொடர்ச்சியான தன்மை ‘எப்போதும்’ என்பதால் தெளிவாகிறது.
- source_word: πάντοτε
  choice: எப்போதும்
  rationale: காலமெல்லாம் தொடரும் நன்றியுணர்வைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ὑπὲρ πάντων
  choice: எல்லாவற்றிற்காகவும்
  rationale: πάντων வடிவில் ஆண்பால் அல்லது நடுப்பால் என இருவகையாக இருக்க முடிந்தாலும், இச்சூழலில் அனைத்துச் சூழ்நிலைகள் அல்லது காரியங்கள் என்ற விரிவான பொருள் சிறப்பாகப் பொருந்துகிறது; ‘எல்லாருக்காகவும்’ என்பது சாத்தியமான மாற்றுப் பொருளாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐν ὀνόματι
  choice: பெயரில்
  rationale: பிரதிநிதித்துவம் அல்லது மத்தியஸ்தச் சார்பை உள்ளடக்கும் வேதாகம மரபுத்தொடரைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான நிலையான கிறிஸ்துவியல் பட்டப்பெயரைத் தருகிறது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியா
  rationale: Χριστός இங்கு பட்டப்பெயரின் வலிமையைத் தக்கவைத்திருப்பதால் ‘மெசியா’ என மொழிபெயர்க்கப்படுகிறது; மரபான ‘இயேசு கிறிஸ்து’ அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: τῷ θεῷ καὶ πατρί
  choice: பிதாவாகிய கடவுளுக்கு
  rationale: நன்றியின் பெறுநரைத் தெளிவாகக் காட்டுகிறது. ஒரே நபரைக் குறிக்கும் ‘கடவுளும் பிதாவுமானவருக்கு’ என்பதைக் காட்டிலும் இது நவீன தமிழில் இயல்பாக உள்ளது.
theological_decisions:
- issue: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ என்பதில் Χριστοῦ-வை மொழிபெயர்த்தல்
  choice: நம் ஆண்டவராகிய இயேசு மெசியா
  alternative: நம் ஆண்டவராகிய இயேசு கிறிஸ்து
  rationale: Χριστός இங்கு வெறும் பெயரின் பகுதியாக மட்டும் அல்லாமல் ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற பட்டப்பெயரின் தன்மையையும் கொண்டுள்ளது. ஆகவே பிரதான உரையில் ‘மெசியா’ என்றும், பரவலான மரபு வடிவம் அடிக்குறிப்பிலும் தரப்படுகிறது.
- issue: ὑπὲρ πάντων என்பதன் பரப்பு
  choice: எல்லாவற்றிற்காகவும்
  alternative: எல்லாருக்காகவும்
  rationale: இலக்கண வடிவம் பொருட்களையோ நபர்களையோ குறிக்க இயலும். இருப்பினும் சுற்றியுள்ள அறிவுரைகளில் எல்லாச் சூழ்நிலைகளிலும் நன்றி செலுத்துதல் வலியுறுத்தப்படுவதால் விரிவான நடுப்பால் பொருள் பிரதான உரையில் தேர்ந்தெடுக்கப்படுகிறது; உண்மையான தெளிவின்மை அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்களுக்கு விளங்கும் கண்ணியமான வேதாகம நடையைக் கடைப்பிடிக்கிறது. ‘பிதா’ என்ற பரிச்சயமான வேதாகமப் பட்டப்பெயரும் ‘மெசியா’ என்ற மொழிபெயர்க்கப்பட்ட பட்டமும் பயன்படுத்தப்பட்டுள்ளன. வசனம் கிரேக்கத்தில் முந்தைய கட்டளையைச் சார்ந்த செயப்பெயரெச்சமாக இருந்தாலும், தனி வசன மேற்கோளில் இயல்பாக வாசிக்க ‘நன்றி செலுத்துங்கள்’ என அமைக்கப்பட்டுள்ளது; [b] குறிப்பு வாக்கிய முடிவில் முழு கூறோடு இணைக்கப்பட்டுள்ளது.
