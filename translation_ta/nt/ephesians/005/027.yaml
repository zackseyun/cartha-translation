  source_fidelity: வரைவில் αὐτός (‘அவர் தாமே’), ἐκκλησία, σπίλος/ῥυτίς, மற்றும் ἅγιος/ἄμωμος ஆகியவை பொதுவாகச் சரியாகக் காக்கப்பட்டுள்ளன. ஆனால் மூலத்தில் இரு ἵνα நோக்கக் கூறுகளே உள்ள நிலையில், இறுதியில் ‘இப்படிச் செய்தார்’ சேர்ப்பது இவ்வசனத்தில் இல்லாத ஒரு நிறைவேறிய முதன்மை வினையைச் சேர்க்கிறது. மேலும் ἑαυτῷ-க்கு ‘தமக்குமுன்’ என்பது சாத்தியமான உருவக விரிவாக்கமாக இருந்தாலும், ‘தமக்கே’ பிரதிபெயர்ச்சியை இன்னும் நேரடியாகக் காட்டுகிறது.
  naturalness: ‘மகிமை பொருந்தியதாகத் தமக்குமுன் நிறுத்திக்கொள்ளவும்’ என்ற தொடர் சற்றே கனமாக உள்ளது. ‘மகிமையுள்ள திருச்சபையைத் தமக்கே முன் நிறுத்தவும்’ என்பது நவீன நிலையான தமிழில் இயல்பாகவும், மூலத்தின் வலியுறுத்தலையும் பிரதிபெயர்ச்சியையும் தெளிவாகவும் வெளிப்படுத்துகிறது. நோக்கத் தொடரை நிறைவேறிய நிகழ்வாக மாற்றாமல் வைத்தல் அவசியம்.
  terminology: ‘திருச்சபை,’ ‘கறை,’ ‘சுருக்கம்,’ ‘பரிசுத்தம்,’ ‘குற்றமற்றது’ ஆகிய தேர்வுகள் பொருத்தமானவை. ἄμωμος-க்கு ‘குற்றமற்றவளாக’ என்பது சூழலிலுள்ள திருச்சபையின் பெண்பால் உருவகத்துடன் நன்கு பொருந்துகிறது. அசல் ‘or anything like that’ என்பதற்குப் ‘அத்தகைய வேறு எதுவும்’ நேரடியான மாற்றாகும்.
