- from: அவர் தாமே திருச்சபையை மகிமை பொருந்தியதாக[a]த் தமக்குமுன் நிறுத்திக்கொள்ளவும், அது கறையோ சுருக்கமோ அவை போன்ற வேறு எதுவுமோ[b] உடையதாக இல்லாமல், பரிசுத்தமும் குற்றமற்றதுமாய் இருக்கவும் இப்படிச் செய்தார்.
