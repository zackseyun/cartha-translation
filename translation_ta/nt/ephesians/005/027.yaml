  text: so that he himself might present the church to himself in splendor[a], not having spot or wrinkle or anything like that[c][b], but so that she might be holy and blameless.
translation:
  language: ta
  text: அவர் தாமே மகிமையுள்ள திருச்சபையைத் தமக்கே முன் நிறுத்தவும், கறையோ சுருக்கமோ அத்தகைய வேறு எதுவுமோ இல்லாதவளாக, பரிசுத்தமும் குற்றமற்றவளுமாக அவள் இருக்கவும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραστήσῃ
  choice: தமக்குமுன் நிறுத்திக்கொள்ளவும்
  rationale: ἵνα உடன் வரும் இறந்தகாலத் துணைவினை நோக்கத்தை வெளிப்படுத்துகிறது. திருமண உருவகத்துக்கு ஏற்ற முறையில், ஒருவரை முறையாகத் தம்முன் நிறுத்தும் பொருளையும் தமிழில் இயல்பாகக் காக்கிறது.
- source_word: αὐτὸς
  choice: அவர் தாமே
  rationale: வெளிப்படையாக வந்துள்ள வலியுறுத்தும் சுட்டுப்பெயரின் அழுத்தத்தைத் தக்கவைக்கிறது.
- source_word: ἑαυτῷ
  choice: தமக்குமுன்
  rationale: செயலைச் செய்பவரையே நோக்கி நிகழும் பிரதிபெயர்ச்சிப் பொருளைத் தெளிவாகக் காக்கிறது; அதை தேவனுக்கு முன்பான நிகழ்வாக விளக்கிச் சுருக்கவில்லை.
- source_word: ἔνδοξον
  choice: மகிமை பொருந்தியதாக
  rationale: திருச்சபை நிறுத்தப்படும் மகிமையான நிலையைக் குறிக்கிறது. ‘மகிமையுள்ள’ என்பதைக் காட்டிலும் இச்சூழலில் இயல்பான பெயரடைப் பயனிலை அமைப்பாக உள்ளது.
- source_word: ἐκκλησίαν
  choice: திருச்சபையை
  rationale: இங்கு பவுலின் பயன்பாட்டில் தேவனுடைய மக்களை ஒட்டுமொத்தமாகக் குறிக்கும் நிலைபெற்ற தமிழ் வேதாகமச் சொல்.
- source_word: μὴ ἔχουσαν
  choice: உடையதாக இல்லாமல்
  rationale: திருச்சபையின் நிலையை விவரிக்கும் பங்கெச்சத் தொடரின் பொருளைத் தக்கவைக்கிறது.
- source_word: σπίλον
  choice: கறை
  rationale: தூய்மைக்கு எதிரான தெளிவான வெளிப்புறக் குறியைச் சுட்டும் இயல்பான நவீனத் தமிழ் சொல்; ‘சுருக்கம்’ என்பதோடு நன்றாக இணைகிறது.
- source_word: ῥυτίδα
  choice: சுருக்கம்
  rationale: உடல் அல்லது ஆடையில் தோன்றும் wrinkle என்பதற்கான நேரடியான, இயல்பான தமிழ் இணை.
- source_word: ἤ τι τῶν τοιούτων
  choice: அவை போன்ற வேறு எதுவுமோ
  rationale: முன் குறிப்பிடப்பட்ட இரு எடுத்துக்காட்டுகளுக்கும் அப்பாற்பட்ட அதே வகையைத் திறந்த நிலையில் வைத்திருக்கிறது.
- source_word: ἀλλ’ ἵνα ᾖ
  choice: இருக்கவும்
  rationale: முதல் ἵνα நோக்கத்துடன் இணைந்த நேர்மறை நோக்கத்தை தமிழில் இணைநிலை வினையமைப்பால் வெளிப்படுத்துகிறது.
- source_word: ἁγία
  choice: பரிசுத்தம்
  rationale: ἅγιος என்பதன் நிலைபெற்ற, இறையியல் நிறை கொண்ட தமிழ் மொழிபெயர்ப்பு.
- source_word: ἄμωμος
  choice: குற்றமற்றது
  rationale: குறை அல்லது பழிக்கு இடமில்லாத நிலையை இயல்பாகக் குறிக்கிறது; முன்புள்ள ‘கறை’ உருவகத்தை அப்படியே மீண்டும் கூறாமல் நெறிசார் பரிமாணத்தையும் காக்கிறது.
theological_decisions:
- issue: கிறிஸ்து திருச்சபையைத் தமக்கே முன்பாக நிறுத்தும் பிரதிபெயர்ச்சி உருவகம்
  choice: ‘அவர் தாமே...தமக்குமுன் நிறுத்திக்கொள்ளவும்’ என்று வலியுறுத்தலும் பிரதிபெயர்ச்சியும் காக்கப்பட்டன.
  alternative: ‘திருச்சபையை நிறுத்தவும்’ என்று எளிமைப்படுத்துதல் அல்லது ‘தேவனுக்குமுன் நிறுத்தவும்’ என்று வெளிப்படையாக விளக்குதல்.
  rationale: கிரேக்கத்தில் αὐτός மற்றும் ἑαυτῷ இரண்டும் உள்ளன. வசனம் வெளிப்படையாகத் தீர்மானிக்காத இறையியல் தொடர்பை மொழிபெயர்ப்பு தீர்த்துவிடாமல், அதன் இலக்கிய மற்றும் இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
- issue: திருச்சபையின் தூய்மையைச் சித்தரிக்கும் உருவகங்கள்
  choice: ‘கறையோ சுருக்கமோ...பரிசுத்தமும் குற்றமற்றதுமாய்’ என்று உடல்/மணமகள் உருவகமும் நெறிசார் தூய்மையும் இணைந்து காக்கப்பட்டன.
  alternative: ‘மாசோ சுருக்கமோ...பரிசுத்தமும் பழுதற்றதுமாய்’ என்று பலியியல் குறையின்மை மொழியை முன்னிலைப்படுத்துதல்.
  rationale: வசனம் காணக்கூடிய அழகுக் குறைகளின் உருவகத்தையும் பரிசுத்தம் மற்றும் குற்றமின்மை மொழியையும் ஒன்றாக இணைக்கிறது; ஒரு தனிப்பட்ட கோட்பாட்டு வாசிப்புக்குள் அதைச் சுருக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘திருச்சபை,’ ‘பரிசுத்தம்’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் காக்கப்பட்டுள்ளன; வாக்கியத்தின் இரு நோக்கக் கூறுகளும் தமிழில் இயல்பாக இணைக்கப்பட்டுள்ளன.
