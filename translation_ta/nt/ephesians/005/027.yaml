  rationale: மூலத்தின் இரு ἵνα நோக்கக் கூறுகளும் தமிழில் ‘நிறுத்தவும் ... இருக்கவும்’ எனத் தக்கவைக்கப்பட்டுள்ளன; மூலத்தில் இல்லாத ‘இப்படிச் செய்தார்’ நீக்கப்பட்டுள்ளது. ‘அவர் தாமே’ மற்றும் ‘தமக்கே’ மூலம் αὐτός மற்றும் ἑαυτῷ-இன் வலியுறுத்தலும் பிரதிபெயர்ச்சியும் காக்கப்பட்டுள்ளன. திருச்சபையின் பெண்பால் உருவகம் ‘இல்லாதவளாக ... அவள் இருக்கவும்’ என இயல்பாகத் தொடர்கிறது.
