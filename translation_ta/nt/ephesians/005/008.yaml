    text: கிரேக்கச் சொல் நேரடியாக ‘நடங்கள்’ என்று பொருள்படும்; பவுலின் வழக்கில் இது ஒருவரின் வாழ்க்கை முறையைக் குறிக்கும் உருவகம். இதை விளக்கமாக ‘ஒளியின் பிள்ளைகளாக வாழுங்கள்’ என்றும் மொழிபெயர்க்கலாம்.
