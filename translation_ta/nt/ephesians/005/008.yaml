lexical_decisions:
- source_word: ἦτε
  choice: இருந்தீர்கள்
  rationale: εἰμί என்பதன் இறந்தகாலத் தொடர்நிலை வடிவம், முன்பு நிலவிய நிலையைக் குறிக்கிறது; தமிழில் ‘இருந்தீர்கள்’ அதை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான விளக்க அடிப்படையை γάρ வழங்குகிறது; ‘ஏனெனில்’ அதன் இணைப்புச் செயல்பாட்டைத் தெளிவாகக் காக்கிறது.
- source_word: ποτε
  choice: முன்பு
  rationale: முந்தைய நிலையையும் தற்போதைய நிலையையும் எதிரெதிராகக் காட்டும் காலக் குறிப்பை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: σκότος
  choice: இருள்
  rationale: இது முன்னிலைச் சொல் இல்லாத பயனிலைப் பெயர்ச்சொல். ஆகவே ‘இருளில்’ என்று மெலிதாக்காமல், ‘இருளாக’ என்று அடையாளம் மற்றும் நிலைமாற்றத்தின் வலிமை காக்கப்படுகிறது.
- source_word: νῦν δὲ
  choice: இப்போதோ
  rationale: முந்தைய நிலையுடன் வலுவான எதிர்மறை வேறுபாட்டைக் குறிக்கும் νῦν δὲ என்பதைக் concise-ஆகவும் இயல்பாகவும் தருகிறது.
- source_word: φῶς
  choice: ஒளி
  rationale: σκότος போலவே இதுவும் உருவகப் பயனிலைப் பெயர்ச்சொல்; ‘ஒளியில்’ அல்லது ‘ஒளியூட்டப்பட்டவர்கள்’ என்று மாற்றாமல் ‘ஒளியாக’ எனும் அடையாள மொழி காக்கப்படுகிறது.
- source_word: ἐν κυρίῳ
  choice: ஆண்டவரில்
  rationale: ἐν + வேற்றுமை இங்கு ஆண்டவருடனான உறவு அல்லது அவருக்குள் அமைந்த வாழ்வுத் தளத்தைக் குறிக்கிறது. ‘ஆண்டவரில்’ பவுலின் சுருக்கமான சொல்லாட்சியையும் இறையியல் திறந்த தன்மையையும் காக்கிறது.
- source_word: ὡς
  choice: ஆக
  rationale: அவர்கள் யாரோ அதற்கேற்ற முறையில் வாழ வேண்டும் என்பதைக் காட்டுகிறது; ‘போல’ என்ற வெறும் ஒப்புமையைவிட ‘பிள்ளைகளாக’ அடையாளத்துக்கும் நடத்தைக்கும் உள்ள தொடர்பைக் காக்கிறது.
- source_word: τέκνα φωτός
  choice: ஒளியின் பிள்ளைகள்
  rationale: τέκνα பாலினப் பொதுமை கொண்ட ‘பிள்ளைகள்’ என்பதாகும்; ‘ஒளியின்’ என்ற உறவுமுறை உருவகத்தின் செமித்தியப் பண்பையும் காக்கிறது.
- source_word: περιπατεῖτε
  choice: நடந்துகொள்ளுங்கள்
  rationale: நிகழ்காலக் கட்டளை வடிவம் தொடர்ந்து அமைய வேண்டிய வாழ்க்கை நடத்தையைச் சுட்டுகிறது. ‘நடந்துகொள்ளுங்கள்’ தமிழில் நடத்தையைக் குறிக்கும் இயல்பான சொல்லாக இருப்பதுடன் நடப்பது என்ற மூல உருவகத்தையும் ஓரளவு காக்கிறது.
theological_decisions:
- issue: ‘முன்பு இருள்; இப்போது ஒளி’ என்ற உருவக அடையாள மொழி
  choice: ‘இருளாக இருந்தீர்கள்; ... ஒளியாக இருக்கிறீர்கள்’ என்று வலுவான பயனிலை உருவகங்களைத் தக்கவைத்தல்
  alternative: ‘இருளில் இருந்தீர்கள்; இப்போது ஒளியில் இருக்கிறீர்கள்’
  rationale: கிரேக்கத்தில் σκότος, φῶς இரண்டும் முன்னிலைச் சொற்களில்லாத பயனிலைப் பெயர்ச்சொற்கள். எனவே சூழலை மட்டும் அல்ல, அடையாளம் மற்றும் ஒழுக்க-ஆவிக்குரிய நிலைமாற்றத்தையும் வலியுறுத்தும் பதற்றம் காக்கப்படுகிறது.
- issue: κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: ‘ஆண்டவர்’ புதிய ஏற்பாட்டின் இறையியல் ஒலிப்பையும் மரியாதைமிக்க நவீன தமிழ் நடையையும் காக்கிறது; ‘எஜமான்’ இங்கு பொருளை சமூக உறவுக்குள் தேவையின்றி சுருக்கக்கூடும்.
- issue: ἐν κυρίῳ என்பதன் உறவு
  choice: ஆண்டவரில்
  alternative: ஆண்டவரால்
  rationale: ‘ஆண்டவரில்’ என்பது ஒன்றிப்பு, உறவு, வாழ்வுத் தளம் ஆகிய சாத்தியங்களைத் திறந்தவையாக வைத்திருக்கிறது; ‘ஆண்டவரால்’ என்று காரணம் அல்லது செயற்பாட்டாளராக மட்டும் தீர்மானிப்பதைத் தவிர்க்கிறது.
