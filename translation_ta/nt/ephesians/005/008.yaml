  text: ஏனெனில், முன்பு நீங்கள் இருளாக இருந்தீர்கள்; இப்போதோ ஆண்டவரில் ஒளியாக இருக்கிறீர்கள். ஒளியின் பிள்ளைகளாக நடந்துகொள்ளுங்கள்.[a]
  philosophy: optimal-equivalence
