lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல். கிரேக்கத்தின் காரணப் பொருளை இயல்பான நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: μέλη
  choice: உறுப்புகள்
  rationale: ஓர் உடலை அமைக்கும் பகுதிகளைக் குறிக்கிறது. பவுலின் உடல் உருவகத்தையும் விசுவாசிகளின் ஒன்றிணைந்த உறவையும் தேவையின்றி மிகைப்படுத்தாமல் தக்கவைக்கிறது.
- source_word: ἐσμὲν
  choice: இருக்கிறோம்
  rationale: முதலாம் நபர் பன்மை நிகழ்கால வினையை இயல்பான தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: σώματος
  choice: உடல்
  rationale: சூழலில் கிறிஸ்துவின் உடலைக் குறிக்கும் பவுலின் உருவகத்தை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: αὐτοῦ
  choice: அவருடைய
  rationale: சுற்றியுள்ள வசனங்களின்படி இந்த ஆண்பால் ஒருமை உரிமைப் பெயர் கிறிஸ்துவைக் குறிக்கிறது; மரியாதையான தமிழ் நடை பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: “அவருடைய சதையிலிருந்தும் அவருடைய எலும்புகளிலிருந்தும்” என்ற நீண்ட வாசகத்தை மூல உரையில் சேர்ப்பதா
  choice: SBLGNT-இன் குறுகிய வாசகத்தை மட்டும் முதன்மை உரையில் மொழிபெயர்த்தல்
  alternative: “ஏனெனில், நாம் அவருடைய உடலின் உறுப்புகள்; அவருடைய சதையிலிருந்தும் அவருடைய எலும்புகளிலிருந்தும் ஆனவர்கள்” என்ற நீண்ட வாசகம்
  rationale: கொடுக்கப்பட்ட கிரேக்க மூல உரையில் குறுகிய வாசகமே உள்ளது. நீண்ட வாசகம் சில கையெழுத்துப் பிரதிகளில் காணப்படும் உரை வேறுபாடு என்பதால், அதை முதன்மை உரையில் சேர்க்காமல் அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடுவது மூலச் சான்றுக்கு உண்மையாக இருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் இயல்பானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. “உடலின் உறுப்புகள்” என்பது உடல் உருவகத்தையும் கூட்டுறவுப் பொருளையும் தக்கவைக்கிறது.
