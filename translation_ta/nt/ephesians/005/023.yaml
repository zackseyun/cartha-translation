  source_fidelity: மூலத்தின் விளக்கத் தொடர்பான ὅτι-யை “ஏனெனில்” சரியாகக் காட்டுகிறது. ἀνήρ/γυνή திருமணச் சூழலுக்கு ஏற்ப “கணவன்/மனைவி” எனவும், κεφαλή உருவகத்தை விளக்கமாக்காமல் “தலை” எனவும் மொழிபெயர்க்கப்பட்டுள்ளது. ὡς καὶ-யின் ஒப்புமை, αὐτός-இன் வலியுறுத்தல், மற்றும் σωτὴρ τοῦ σώματος-இன் “உடலின் மீட்பர்” என்ற genitive தொடர்பு அனைத்தும் பாதுகாக்கப்பட்டுள்ளன.
