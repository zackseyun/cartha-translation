  terminology: “மேசியா,” “சபை,” “தலை,” “உடல்,” “மீட்பர்” ஆகிய சொற்கள் திட்டத்தின் சொற்தேர்வுடனும் பவுலின் உருவக மொழியுடனும் ஒத்திருக்கின்றன. “தலை” குறித்த அடிக்குறிப்பு அதிகாரம், முதன்மை, மூலம் என்ற விவாதிக்கப்படும் சாத்தியங்களை ஒரு குறிப்பிட்ட விளக்கமாகத் திணிக்காமல் சரியாகச் சுட்டுகிறது.
