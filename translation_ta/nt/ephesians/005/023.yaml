id: EPH.5.23
reference: Ephesians 5:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι ἀνήρ ἐστιν κεφαλὴ τῆς γυναικὸς ὡς καὶ ὁ Χριστὸς κεφαλὴ τῆς ἐκκλησίας, ⸀αὐτὸς σωτὴρ τοῦ σώματος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/023.yaml
  text: For the husband is the head of the wife[a], as the Messiah also is the head of the church[d][c][b], himself the Savior of the body.
translation:
  language: ta
  text: ஏனெனில், கணவன் மனைவிக்குத் தலையாக இருப்பதுபோல, மேசியாவும் சபைக்குத் தலையாக இருக்கிறார்[a]; அவரே உடலின் மீட்பர்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தலை” என்பது கிரேக்க உருவகத்தைத் தக்கவைக்கிறது. இங்கு அது அதிகாரம், முதன்மை அல்லது மூலம் ஆகியவற்றில் எதைச் சுட்டுகிறது என்பது பலவாறு விளக்கப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உடலை மீட்பவரும் அவரே.”
    reason: alternative_rendering
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுரைக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக இங்கு வருகிறது; தமிழில் “ஏனெனில்” அந்த விளக்கத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀνήρ
  choice: கணவன்
  rationale: கணவன்–மனைவி உறவைப் பற்றிய உடனடிச் சூழலில் பொதுவான “ஆண்” என்பதல்ல, திருமண உறவைக் குறிக்கும் பொருளே தேவைப்படுகிறது.
- source_word: κεφαλή
  choice: தலை
  rationale: கிரேக்க உருவகத்தை அப்படியே காக்கிறது; அதை “அதிகாரி”, “தலைவர்” அல்லது “மூலம்” என்று ஒரே விளக்கத்துக்குள் சுருக்கவில்லை.
- source_word: γυνή
  choice: மனைவி
  rationale: ἀνήρ என்பதுடன் இணைந்து வரும் குடும்பச் சூழல், திருமண உறவிலுள்ள மனைவியைக் குறிக்கிறது.
- source_word: ὡς καὶ
  choice: இருப்பதுபோல, ...வும்
  rationale: கணவன்–மனைவி உறவுக்கும் மேசியா–சபை உறவுக்கும் இடையிலான ஒப்புமையை இயல்பான தமிழில் காக்கிறது; இரு உறவுகளும் எல்லா விதத்திலும் ஒன்றே என்று மிகைப்படுத்தவில்லை.
- source_word: Χριστός
  choice: மேசியா
  rationale: இங்கு இது வெறும் பெயராக இல்லாமல் அபிஷேகம் செய்யப்பட்டவர் என்ற பட்டப்பொருளுடன் செயல்படுவதால் “மேசியா” என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἐκκλησία
  choice: சபை
  rationale: பவுலின் இச்சூழலில் மேசியாவைச் சேர்ந்த விசுவாசிகளின் சமூகத்தைக் குறிக்கும் தெளிவான, வழக்கிலுள்ள தமிழ் சொல்.
- source_word: αὐτός
  choice: அவரே
  rationale: கிரேக்கச் சுட்டுப்பெயரின் வலியுறுத்தலைக் காத்து, உடலின் மீட்பர் மேசியாதாமே என்பதைத் தெளிவுபடுத்துகிறது.
- source_word: σωτήρ
  choice: மீட்பர்
  rationale: காப்பாற்றி விடுவிப்பவர் என்ற பொருளை மரியாதையான, இயல்பான தமிழில் தருகிறது; இங்கு மேசியாவுக்குரிய பட்டமாகவும் செயல்படுகிறது.
- source_word: σῶμα
  choice: உடல்
  rationale: சபையைக் குறிக்கும் பவுலின் உடல் உருவகத்தைப் பராபரப்பாமல் காக்கிறது; கிரேக்கத்தில் வெளிப்படையாக இல்லாத “அவருடைய” என்பதையும் சேர்க்கவில்லை.
theological_decisions:
- issue: கணவன்–மனைவி மற்றும் மேசியா–சபை ஒப்புமையில் κεφαλή என்பதன் பொருள்
  choice: முதன்மை உரையில் “தலை” என்ற உருவகத்தைத் தக்கவைத்தல்
  alternative: மூலம்; தலைவர்; அதிகாரம் உடையவர்
  rationale: இந்தச் சொல்லின் துல்லியமான உறவுப்பொருள் விளக்கவியலில் விவாதிக்கப்படுகிறது. மொழிபெயர்ப்பு அந்த விவாதத்தை மறைமுகமாகத் தீர்மானிக்காமல், மூல உருவகத்தையும் அதன் இறையியல் இழுபறியையும் காக்கிறது.
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இவ்விடத்தில் அபிஷேகம் செய்யப்பட்டவர் என்ற பட்டப்பொருள் செயல்படுகிறது; ஆகவே அதன் மேசியத் தன்மையை வெளிப்படுத்தும் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- issue: αὐτὸς σωτὴρ τοῦ σώματος என்ற சொற்றொடரின் இலக்கணத் தொடர்பு
  choice: “அவரே உடலின் மீட்பர்” என்ற வலியுறுத்தப்பட்ட இணைப்புரை
  alternative: “அவர் உடலை மீட்பவராக இருப்பதால்”
  rationale: கிரேக்கத்தில் வெளிப்படையான வினையெச்சக் காரணத் தொடர்பு இல்லை. சுருக்கமான பெயர்ச் சொல் இணைப்பையும் αὐτός என்பதன் வலியுறுத்தலையும் காப்பதற்காக நேரடி கூற்று பயன்படுத்தப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையில் அமைக்கப்பட்டது. “தலை” மற்றும் “உடல்” ஆகிய இணைந்த உருவகங்கள் காக்கப்பட்டுள்ளன. முதன்மை வாக்கியத்தில் அரைப்புள்ளி பயன்படுத்தி, இறுதி சொற்றொடரின் வலியுறுத்தப்பட்ட இணைப்புத் தன்மை தெளிவாக்கப்பட்டுள்ளது.
