id: EPH.1.11
reference: Ephesians 1:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐν ᾧ καὶ ἐκληρώθημεν προορισθέντες κατὰ πρόθεσιν τοῦ τὰ πάντα ἐνεργοῦντος κατὰ τὴν βουλὴν τοῦ θελήματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/011.yaml
  text: In him we also were made an inheritance[a], having been predestined according to the purpose of the one who works all things according to the counsel of his will,
translation:
  language: ta
  text: அவரில் நாமும் அவருடைய உரிமைப்பங்காக ஆக்கப்பட்டோம்[a]; தமது விருப்பத்தின் ஆலோசனைக்கு ஏற்ப எல்லாவற்றையும் செயல்படுத்துகிறவரின் நோக்கத்தின்படி, நாம் முன்னரே தீர்மானிக்கப்பட்டிருந்தோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாமும் ஓர் உரிமைப்பங்கைப் பெற்றோம்.” கிரேக்க வினைச்சொல், உரிமைப்பங்கைப் பெறுதல் என்றோ, கடவுளுடைய உரிமைப்பங்காக ஆக்கப்படுதல் என்றோ பொருள்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: அவரில்
  rationale: முந்தைய சூழலில் உள்ள கிறிஸ்துவையே சார்புப்பெயர் குறிக்கிறது. ‘அவரில்’ என்பது கிறிஸ்துவோடு உள்ள இணைப்பையும் கிரேக்கச் சொற்றொடரின் சுருக்கத்தையும் காக்கிறது.
- source_word: ἐκληρώθημεν
  choice: உரிமைச்சொத்தாக ஆக்கப்பட்டோம்
  rationale: செயப்பாட்டு வடிவம், விசுவாசிகள் கடவுளுக்கு ஒதுக்கப்பட்ட உரிமைமக்களாக அல்லது உடைமையாக ஆக்கப்பட்டார்கள் என்ற பொருளைக் கொள்ள முடியும். ‘உரிமைச்சொத்து’ மரபுரிமை மற்றும் ஒதுக்கப்பட்ட உடைமை ஆகிய இரு பின்னணிகளையும் சுருக்கமாக வெளிப்படுத்துகிறது; வேறு சாத்தியமான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: προορισθέντες
  choice: முன்னரே தீர்மானிக்கப்பட்டிருந்தோம்
  rationale: முன்கூட்டிய தீர்மானத்தைத் தெளிவாகக் கூறுகிறது; ஆனால் அந்தத் தீர்மானத்தின் முறை அல்லது பரப்பைப் பற்றிய எந்த ஒரு இறையியல் அமைப்பையும் வசனத்திற்குள் சேர்ப்பதில்லை.
- source_word: κατὰ πρόθεσιν
  choice: நோக்கத்திற்கு ஏற்ப
  rationale: πρόθεσις குறிக்கும் நோக்கமுள்ள திட்டத்தையும் எண்ணத்தையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: τοῦ τὰ πάντα ἐνεργοῦντος
  choice: எல்லாவற்றையும் செயல்படுத்துகிறவருடைய
  rationale: கடவுளைச் செயல்படும் நபராக அடையாளப்படுத்தி, τὰ πάντα என்பதன் விரிவையும் ἐνεργέω என்பதன் செயற்பாட்டு வலிமையையும் காக்கிறது.
- source_word: κατὰ τὴν βουλὴν τοῦ θελήματος αὐτοῦ
  choice: தமது விருப்பத்தின் தீர்மானத்தின்படி
  rationale: βουλή என்பதிலுள்ள ஆலோசித்து எடுத்த உறுதியான முடிவு என்ற நுணுக்கத்தை ‘தீர்மானம்’ வெளிப்படுத்துகிறது; θέλημα என்பதற்கு ‘விருப்பம்’ தெளிவான தற்காலத் தமிழை வழங்குகிறது.
theological_decisions:
- issue: ἐκληρώθημεν என்பதன் பொருள்
  choice: விசுவாசிகள் கடவுளுடைய உரிமைச்சொத்தாக ஆக்கப்பட்டார்கள்.
  alternative: விசுவாசிகள் ஓர் உரிமைப்பங்கைப் பெற்றார்கள்.
  rationale: κληρόω என்பதன் செயப்பாட்டு வடிவம், ஒருவர் உரிமைப்பங்கைப் பெறுதல் அல்லது கடவுளுக்கு ஒதுக்கப்பட்ட உரிமைமக்களாக ஆக்கப்படுதல் ஆகிய இரு பொருள்களையும் அனுமதிக்கிறது. பழைய ஏற்பாட்டில் கடவுளுடைய மக்கள் அவருடைய உரிமைப்பங்காக வருணிக்கப்படும் பின்னணி முதன்மை வாசிப்பை ஆதரிக்கிறது; எனினும் மற்ற வாசிப்பும் வலுவான சாத்தியம் என்பதால் அது அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘சித்தம்’, ‘முன்குறித்தல்’ போன்ற அதிகம் திருச்சபைச் சார்ந்த சொற்களுக்குப் பதிலாக ‘விருப்பம்’, ‘முன்னரே தீர்மானிக்கப்பட்டிருந்தோம்’ பயன்படுத்தப்பட்டுள்ளன. நீண்ட கிரேக்க வாக்கியத்தின் தொடர்பை நீள்கோடு காக்கிறது; அடிக்குறிப்பு குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
