source:
  edition: SBLGNT
  text: καὶ τί τὸ ὑπερβάλλον μέγεθος τῆς δυνάμεως αὐτοῦ εἰς ἡμᾶς τοὺς πιστεύοντας κατὰ τὴν ἐνέργειαν τοῦ κράτους τῆς ἰσχύος αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/019.yaml
  text: and what is the surpassing greatness of his power toward us who believe[a], according to the working of the might of his strength
translation:
  language: ta
  text: மேலும், விசுவாசிக்கிற நம்மை நோக்கிய அவருடைய வல்லமையின் அளவுகடந்த மகத்துவம் எத்தகையது என்பதையும், அவருடைய வலிமையின் வல்லாற்றலின் செயல்பாட்டிற்கு ஏற்ப இருப்பதையும்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερβάλλον
  choice: அளவுகடந்த
  rationale: மகத்துவம் வழக்கமான எல்லைகளை விஞ்சுகிறது என்ற ஒப்பீட்டு மிகுதியை இயல்பான தமிழில் வெளிப்படுத்துகிறது; முற்றிலும் அளவிட முடியாதது என்ற கூடுதல் கருத்தைத் திணிக்கவில்லை.
- source_word: μέγεθος
  choice: மகத்துவம்
  rationale: அளவு மற்றும் மேன்மை இரண்டையும் உணர்த்தும், தற்போதைய கண்ணியமான தமிழுக்கு ஏற்ற அருவப்பெயர்.
- source_word: δύναμις
  choice: வல்லமை
  rationale: செயல்படும் திறனையும் சக்தியையும் குறிக்கும் பவுலின் சொல்லுக்கு இயல்பான தமிழ் இணை; பின்னரும் வரும் வலிமைச் சொற்களிலிருந்து இதை வேறுபடுத்துகிறது.
- source_word: εἰς ἡμᾶς
  choice: நம்மை நோக்கிய
  rationale: εἰς என்பதன் திசை அல்லது தொடர்பு சார்ந்த பொருளைப் பேணுகிறது; வல்லமை விசுவாசிகளுக்குள் மட்டுமே செயல்படுகிறது என்ற விளக்கத்தை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: τοὺς πιστεύοντας
  choice: விசுவாசிக்கிற
  rationale: நிகழ்காலப் பங்கேற்புவினையின் வினைத் தன்மையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: κατά
  choice: ஏற்ப
  rationale: அளவுகோல் அல்லது ஒத்திசைவைச் சுட்டும் κατά என்பதன் உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐνέργεια
  choice: செயல்படும் விதம்
  rationale: பயனுள்ள, செயலில் வெளிப்படும் ஆற்றலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; ‘எனர்ஜி’ போன்ற தவறாகப் புரியக்கூடிய சொல்லைத் தவிர்க்கிறது.
- source_word: κράτος
  choice: வல்லாற்றல்
  rationale: வெளிப்பட்டு விளங்கும் பேராற்றலைக் குறிக்கிறது; δύναμις மற்றும் ἰσχύς ஆகியவற்றுக்கான தமிழ்ச் சொற்களோடு ஒன்றாக்காமல் பவுலின் சொற்குவிப்பைப் பேணுகிறது.
- source_word: ἰσχύς
  choice: வலிமை
  rationale: உள்ளார்ந்த பலம் அல்லது வலுவைக் குறிக்கும் இயல்பான சொல்; κράτος என்பதற்கான ‘வல்லாற்றல்’ என்பதிலிருந்து வேறுபாட்டைத் தக்கவைக்கிறது.
- source_word: καὶ τί
  choice: மேலும் ... எத்தகையது என்பதையும்
  rationale: முந்தைய வசனத்தில் தொடங்கிய ஜெப வாக்கியத்தைத் தொடரும் இணைப்பையும் மறைமுகக் கேள்வி அமைப்பையும் தமிழில் இயல்பாகப் பேணுகிறது.
theological_decisions:
- issue: δύναμις / ἐνέργεια / κράτος / ἰσχύς என்ற வலிமைச் சொற்களின் குவிப்பு
  choice: ‘வல்லமை ... செயல்படும் விதம் ... வல்லாற்றல் ... வலிமை’ என்று தொடர்புடைய, ஆனால் வேறுபட்ட சொற்களால் குவிப்பைப் பேணுதல்
  alternative: அவற்றைச் சுருக்கி ‘அவருடைய முழு வல்லமை’ என்று மொழிபெயர்த்தல்
  rationale: பவுல் கடவுளுடைய வல்லமையின் பெருமையையும் பயனுள்ள செயலையும் வலியுறுத்த அருகிய பொருளுள்ள பல சொற்களைக் குவிக்கிறார். அவற்றை ஒன்றாக்குவது அந்த சொல்லாட்சியின் அழுத்தத்தைக் குறைக்கும்; அதேவேளை ஒவ்வொரு சொல்லுக்கும் தனித்த தொழில்நுட்பக் கோட்பாட்டுப் பொருள் அளிக்கப்படவில்லை.
- issue: εἰς ἡμᾶς என்பதில் கடவுளுடைய வல்லமையின் திசை
  choice: ‘நம்மை நோக்கிய’
  alternative: ‘விசுவாசிக்கிற நமக்குள் செயல்படும்’ அல்லது ‘நமக்காக உள்ள’
  rationale: மூலத்தில் ἐν அல்ல, εἰς உள்ளது. ஆகவே வல்லமை உள்நிலையில் செயல்படுகிறதா அல்லது நன்மைக்காக வெளியில் செயல்படுகிறதா என்பதைத் தீர்மானிக்காமல் திசை சார்ந்த உணர்வைப் பேணுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. இது முந்தைய வசனத்தில் தொடங்கிய நீண்ட வாக்கியத்தின் தொடர்ச்சி என்பதால், மூலத்தின் தொடரமைப்பைக் காட்ட இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது; தனி வசனமாக வாசிக்கும் போது இது நிறைவுறாத தொடராகத் தோன்றலாம்.
