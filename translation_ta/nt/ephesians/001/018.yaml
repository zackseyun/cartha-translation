id: EPH.1.18
reference: Ephesians 1:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πεφωτισμένους τοὺς ὀφθαλμοὺς τῆς καρδίας ὑμῶν εἰς τὸ εἰδέναι ὑμᾶς τίς ἐστιν ἡ ἐλπὶς τῆς κλήσεως αὐτοῦ, ⸀τίς ὁ πλοῦτος τῆς δόξης τῆς κληρονομίας αὐτοῦ ἐν τοῖς ἁγίοις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/018.yaml
  text: having the eyes of your heart enlightened[a], so that you may know what is the hope of his calling, what is the wealth of the glory of his inheritance among the saints[b],
translation:
  language: ta
  text: உங்கள் இதயத்தின் கண்கள் ஒளியூட்டப்பட்டு, அவருடைய அழைப்பின் நம்பிக்கை என்ன என்றும், பரிசுத்தவான்களிடையே[a] அவருடைய உரிமைப்பேற்றின் மகிமைச் செல்வம் என்ன என்றும் நீங்கள் அறியும்படி,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்தவான்களில்.”
    reason: ἐν என்பதற்கு இங்கு ‘இடையே’ என்றும் ‘இல்/உள்ளே’ என்றும் பொருள் கொள்ள முடியும்; இந்த வேறுபாடு உரிமைப்பேறு குறித்த விளக்கத்தைப் பாதிக்கலாம்.
lexical_decisions:
- source_word: πεφωτισμένους
  choice: ஒளியூட்டப்பட்டு
  rationale: நிறைவேற்றப்பட்ட செயலின் தொடரும் விளைவைக் குறிக்கும் நிறைநிலைச் செயப்பாட்டு வடிவத்தை இயல்பான தமிழில் தருகிறது; ஒளியூட்டுவது வேறொருவரால் நிகழ்வதையும் காக்கிறது.
- source_word: τοὺς ὀφθαλμοὺς τῆς καρδίας ὑμῶν
  choice: உங்கள் இதயத்தின் கண்கள்
  rationale: ‘புரிந்துகொள்ளும் திறன்’ என்று உருவகத்தைத் தட்டையாக்காமல், கிரேக்க மூலத்தின் ‘இதயத்தின் கண்கள்’ என்ற படிமத்தைக் காக்கிறது.
- source_word: εἰς τὸ εἰδέναι ὑμᾶς
  choice: நீங்கள் அறியும்படி
  rationale: நோக்கத்தைக் குறிக்கும் கிரேக்க அமைப்பை இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἡ ἐλπὶς τῆς κλήσεως αὐτοῦ
  choice: அவருடைய அழைப்பின் நம்பிக்கை
  rationale: ‘அழைப்பு’ மற்றும் ‘நம்பிக்கை’ என்ற பவுலின் முக்கிய சொற்களைப் பேணி, அவற்றின் உறவை விளக்கிச் சுருக்காமல் விடுகிறது.
- source_word: ὁ πλοῦτος τῆς δόξης
  choice: மகிமைச் செல்வம்
  rationale: πλοῦτος குறிக்கும் மிகுதியை ‘செல்வம்’ என்றும் δόξα குறிக்கும் வேதாகமத் தன்மையை ‘மகிமை’ என்றும் இயல்பான தமிழ்ச் சேர்க்கையில் தருகிறது.
- source_word: τῆς κληρονομίας αὐτοῦ
  choice: அவருடைய உரிமைப்பேற்றின்
  rationale: இது அவருக்குச் சொந்தமான உரிமைப்பேறா அல்லது அவர் அளிக்கும் உரிமைப்பேறா என்பதைத் தீர்மானிக்காமல், கிரேக்க உடைமைத் தொடர்பின் திறந்த பொருளைக் காக்கிறது.
- source_word: ἐν τοῖς ἁγίοις
  choice: பரிசுத்தவான்களிடையே
  rationale: ἐν என்பதற்கான இயல்பான கூட்டுறவுப் பொருளை முதன்மை உரையில் தருகிறது; ‘பரிசுத்தவான்களில்’ என்ற சாத்தியத்தைக் குறிப்பில் காக்கிறது.
theological_decisions:
- issue: ‘பரிசுத்தவான்களிடையே/பரிசுத்தவான்களில் அவருடைய உரிமைப்பேறு’ என்பது தேவன் தம் மக்களைத் தமது உடைமையாகப் பெறுவதைக் குறிக்கிறதா, அல்லது விசுவாசிகளுக்கு அவர் அளிக்கும் உரிமைப்பேற்றைக் குறிக்கிறதா?
  choice: பரிசுத்தவான்களிடையே அவருடைய உரிமைப்பேறு
  alternative: பரிசுத்தவான்களில் அவருடைய உரிமைப்பேறு; பரிசுத்தவான்களிடையே அவர் அளிக்கும் உரிமைப்பேறு
  rationale: கிரேக்க உடைமை வேற்றுமையும் ἐν என்ற முன்னிடைச்சொல்லும் ஒன்றுக்கு மேற்பட்ட நுண்பொருள்களை அனுமதிக்கின்றன. முதன்மை உரை எந்த ஒரு கோட்பாட்டு விளக்கத்தையும் கட்டாயப்படுத்தாமல் அந்த இறையியல் இழுபறியைப் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. இது முந்தைய வசனத்தின் ஜெபவாக்கியத்தைத் தொடரும் துணைவாக்கியம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. ‘இதயத்தின் கண்கள்’ என்ற மூல உருவகமும் ‘அழைப்பு,’ ‘நம்பிக்கை,’ ‘மகிமை,’ ‘உரிமைப்பேறு,’ ‘பரிசுத்தவான்கள்’ என்ற இறையியல் சொற்களும் பேணப்பட்டுள்ளன.
