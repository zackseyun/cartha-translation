  source_fidelity: 'முக்கிய அமைப்பு நன்றாகக் காக்கப்பட்டுள்ளது: ‘நீங்களும்,’ சத்தியத்தின் செய்தி/உங்கள் மீட்பின் நற்செய்தி என்ற இணைநிலை, கேட்டலும் நம்புதலும், செயப்பாட்டு ‘முத்திரையிடப்பட்டீர்கள்’ ஆகியவை கிரேக்கத்தோடு பொருந்துகின்றன. ஆயினும் ‘நம்பிக்கை கொண்ட பின்பும்’ என்பதில் உள்ள -உம், இங்கு தேவையற்ற ‘என்றாலும்/கூட’ என்ற நுணுக்கத்தை உருவாக்குகிறது; அது καί-யின் இயல்பான பயன்பாட்டைச் சரிவரக் காட்டவில்லை. ‘வாக்குத்தத்தத்துக்குரிய’ என்பது τῆς ἐπαγγελίας-ன் தொடர்பை மிகத் தெளிவற்றதாகவும் ‘உரிமையுடைய’ என்ற வேறுபொருளுக்கு இடமளிப்பதாகவும் உள்ளது.'
  naturalness: ‘பின்பும்’ நீக்கப்பட்ட திருத்தம் நவீன பொதுத்தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது. ‘வாக்குத்தத்தத்தின் பரிசுத்த ஆவி’ என்பது சற்றே மரபுநடையானாலும், திருவிவிலியப் பதிவுக்கு ஏற்றது; மூலத்தின் சுருக்கமான உருபுத் தொடர்பையும் பாதுகாக்கிறது.
