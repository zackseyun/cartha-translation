reference: Ephesians 1:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐν ᾧ καὶ ὑμεῖς ἀκούσαντες τὸν λόγον τῆς ἀληθείας, τὸ εὐαγγέλιον τῆς σωτηρίας ὑμῶν, ἐν ᾧ καὶ πιστεύσαντες ἐσφραγίσθητε τῷ πνεύματι τῆς ἐπαγγελίας τῷ ἁγίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/013.yaml
  text: In him[a], you also, after hearing the word of truth, the good news of your salvation, in him, and after believing, were sealed with the Holy Spirit of promise[d][c][b],
translation:
  language: ta
  text: அவருக்குள்[a] நீங்களும் சத்தியத்தின் செய்தியாகிய உங்கள் மீட்பின் நற்செய்தியைக்[b] கேட்ட பின்பு, அவருக்குள் நம்பிக்கை கொண்ட பின்பு[d], வாக்குத்தத்தத்தின் பரிசுத்த ஆவியால்[c] முத்திரையிடப்பட்டீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எவருக்குள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உங்கள் மீட்பைப் பற்றிய நற்செய்தியை.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “வாக்குத்தத்தம் செய்யப்பட்ட பரிசுத்த ஆவியால்.”
    reason: alternative_reading
  - marker: d
    text: அல்லது, “அவர்மீது நம்பிக்கை கொண்ட பின்பு.”
    reason: syntactic_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: அவருக்குள்
  rationale: முந்தைய சூழலில் கிறிஸ்துவைக் குறிக்கும் உறவுப்பெயரின் பொருளையும், கிறிஸ்துவோடு இணைந்திருத்தல் என்ற பவுலின் கருத்தையும் காக்கிறது.
- source_word: καὶ ὑμεῖς
  choice: நீங்களும்
  rationale: முந்தைய வசனங்களிலுள்ள ‘நாங்கள்’ என்பவர்களோடு வாசகர்களும் சேர்க்கப்படுகிறார்கள் என்ற கூட்டல் வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀκούσαντες
  choice: கேட்ட பின்பு
  rationale: முதன்மை வினைக்கு முன்னதாக நிகழ்ந்த செயலைக் குறிக்கும் இறந்தகாலப் பங்கேற்புவினையின் இயல்பான தொடர்ச்சிப் பொருளைத் தருகிறது; அதேவேளை இரட்சிப்பின் துல்லியமான காலவரிசையை அளவுக்கு மீறி வரையறுக்கவில்லை.
- source_word: τὸν λόγον τῆς ἀληθείας
  choice: சத்தியத்தின் செய்தி
  rationale: λόγος என்பதன் ‘சொல்/செய்தி’ பொருளில், இச்சூழலில் ordinary readersக்கு தெளிவான ‘செய்தி’ என்பதைக் கொண்டு மூலத்தின் உருபுத் தொடர்பைப் பாதுகாக்கிறது.
- source_word: τὸ εὐαγγέλιον τῆς σωτηρίας ὑμῶν
  choice: உங்கள் மீட்பின் நற்செய்தி
  rationale: εὐαγγέλιον என்பதை அணுகத்தக்க ‘நற்செய்தி’ என வழங்கி, மீட்பு அந்தச் செய்தியின் உள்ளடக்கமா விளைவா என்ற கிரேக்க உருபுத் தொடர்பின் சுருக்கத்தைத் திறந்தே வைக்கிறது.
- source_word: πιστεύσαντες
  choice: நம்பிக்கை கொண்ட பின்பு
  rationale: முத்திரையிடப்படுதலுக்கு முன்னதாக அல்லது அதனோடு நெருக்கமாக நிகழும் நம்புதலைக் காட்டுகிறது; குறிப்பிட்ட சமயக்கோட்பாட்டு காலவரிசையைச் சேர்க்கவில்லை.
- source_word: ἐσφραγίσθητε
  choice: முத்திரையிடப்பட்டீர்கள்
  rationale: அடையாளமிடுதல், உரிமையை உறுதிப்படுத்துதல் ஆகிய உருவகத் திறன்களைக் காக்கும் நேரடியான, புரிந்துகொள்ளத்தக்க செயப்பாட்டு வடிவம்.
- source_word: τῷ πνεύματι
  choice: ஆவியால்
  rationale: கிரேக்க வேற்றுமை உருபின் கருவி அல்லது செயல்பாட்டுத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது; ஆவியை வெறும் உயிரற்ற கருவியாகச் சுருக்கவில்லை.
- source_word: τῆς ἐπαγγελίας
  choice: வாக்குத்தத்தத்துக்குரிய
  rationale: ‘வாக்குத்தத்தத்தின் ஆவி’ என்ற கடினமான சொல்லுக்குச் சமமாக, ஆவி வாக்குத்தத்தத்தோடு தொடர்புடையவர் என்ற சுருக்கத்தைக் காக்கிறது; ‘வாக்குத்தத்தம் செய்யப்பட்ட’ என்ற விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τῷ ἁγίῳ
  choice: பரிசுத்த
  rationale: πνεύματι உடன் சேர்ந்து ‘பரிசுத்த ஆவி’ என்ற அறியப்பட்ட பட்டப்பெயரை உருவாக்குகிறது.
theological_decisions:
- issue: கேட்டல், நம்புதல், முத்திரையிடப்படுதல் ஆகியவற்றின் தொடர்பு
  choice: ‘கேட்ட பின்பு … நம்பிக்கை கொண்ட பின்பும் … முத்திரையிடப்பட்டீர்கள்’ என்று தொடர்ச்சியாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘கேட்டபோது … நம்பியபோது’ என்று ஏறத்தாழ ஒரே நேரச் செயல்களாக வழங்கலாம்.
  rationale: முதன்மை வினைக்கு முன்வரும் இறந்தகாலப் பங்கேற்புவினைகள் முன் நிகழ்வை இயல்பாகச் சுட்டுகின்றன. இருப்பினும், ஆவியைப் பெறுவதன் துல்லியமான சமயக்கோட்பாட்டு காலவரிசையை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- issue: ‘வாக்குத்தத்தத்தின் ஆவி’ என்பதன் பொருள்
  choice: ‘வாக்குத்தத்தத்துக்குரிய பரிசுத்த ஆவி’ என்று தொடர்பைக் குறிக்கும் வகையில் வழங்கப்பட்டது.
  alternative: ‘வாக்குத்தத்தம் செய்யப்பட்ட பரிசுத்த ஆவி’ அல்லது ‘வாக்குத்தத்தத்தை உறுதிப்படுத்தும் பரிசுத்த ஆவி’.
  rationale: கிரேக்க மரபுத்தொடர் சுருக்கமானதும் பலவகைத் தொடர்பை அனுமதிப்பதும் ஆகும். முதன்மை உரை அந்தத் தொடர்பைத் திறந்தே வைக்கிறது; அதிகமாக வெளிப்படுத்திய இயல்பான வாசகம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἐν ᾧ என்பதன் இரண்டாவது பயன்பாடு
  choice: ‘அவருக்குள் நம்பிக்கை கொண்ட’ என்று கிறிஸ்துவுக்குள் இருப்பதையும் நம்புதலையும் இணைத்துப் பாதுகாக்கிறது.
  alternative: ‘அவர்மீது நம்பிக்கை கொண்ட’ என்று நம்பிக்கையின் பொருளாகக் கிறிஸ்துவை நேரடியாகக் குறிப்பிடலாம்.
  rationale: மூலத்தில் ἐν ᾧ மீண்டும் வருகிறது. ‘அவருக்குள்’ என்பது அந்த இடவியல்/இணைவு மொழியை மறைக்காமல் காக்கிறது; தமிழில் சாத்தியமான மற்ற வாசிப்பு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், திருவிவிலிய உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சத்தியம்,’ ‘நற்செய்தி,’ ‘பரிசுத்த ஆவி,’ ‘முத்திரையிடப்பட்டீர்கள்’ போன்ற பரவலாக அறியப்பட்ட சொற்கள் தக்கவைக்கப்பட்டுள்ளன; தேவையற்ற சமயப்பிரிவு சார்ந்த விளக்கங்கள் தவிர்க்கப்பட்டுள்ளன.
