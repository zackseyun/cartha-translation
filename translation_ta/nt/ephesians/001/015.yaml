source:
  edition: SBLGNT
  text: Διὰ τοῦτο κἀγώ, ἀκούσας τὴν καθ’ ὑμᾶς πίστιν ἐν τῷ κυρίῳ Ἰησοῦ καὶ τὴν ⸂ἀγάπην τὴν⸃ εἰς πάντας τοὺς ἁγίους,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/015.yaml
  text: For this reason[a], I also, having heard of your faith in the Lord Jesus and your love for all the saints[b],
translation:
  language: ta
  text: இதனால், ஆண்டவராகிய இயேசுவில் உங்களுக்குள்ள விசுவாசத்தையும்[a], பரிசுத்தவான்கள் அனைவர்மீதும் உங்களுக்குள்ள அன்பையும்[b] கேள்விப்பட்ட நானும்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்டவராகிய இயேசுவில் உங்களுக்குள்ள நம்பிக்கை.” கிரேக்கச் சொல் சில சூழல்களில் “உண்மைத்தன்மை” என்ற பொருளையும் தரலாம்.
    reason: lexical_alternative
  - marker: b
    text: இன்னும் சொற்சொல்லாக, “பரிசுத்தவான்கள் அனைவரையும் நோக்கிய உங்கள் அன்பு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: இதனால்
  rationale: முந்தைய பகுதியில் கூறப்பட்டவற்றை நோக்கி, பவுலின் அடுத்த செயலை அவை அடிப்படையாக்குகின்றன என்பதைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: κἀγώ
  choice: நானும்
  rationale: καί + ἐγώ என்பதன் சேர்க்கைப் பொருளை மிகைப்படுத்தாமல் காக்கிறது.
- source_word: ἀκούσας
  choice: கேள்விப்பட்ட
  rationale: இது பவுலைக் குறிக்கும் இறந்தகாலப் பங்கேற்பு வடிவம்; அடுத்த வசனத்தில் நிறைவடையும் வாக்கியத் தொடரைத் தமிழிலும் திறந்த நிலையில் வைக்கிறது.
- source_word: τὴν καθ’ ὑμᾶς πίστιν
  choice: உங்களுக்குள்ள விசுவாசம்
  rationale: வாசகர்களுக்குரிய அல்லது அவர்களிடையே காணப்படும் விசுவாசத்தை இயல்பான தமிழில் குறிக்கிறது.
- source_word: πίστιν
  choice: விசுவாசம்
  rationale: இச்சூழலில் ஆண்டவராகிய இயேசுவுடன் வாசகர்களுக்கு உள்ள நம்பிக்கை உறவே முதன்மைப் பொருள்; சொல்லின் பிற சாத்தியமான நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐν τῷ κυρίῳ Ἰησοῦ
  choice: ஆண்டவராகிய இயேசுவில்
  rationale: ἐν என்பதன் ‘இல்’ வடிவத்தையும், இயேசுவுடன் உள்ள பவுலின் உறவுசார் மொழியின் திறந்த பொருளையும் காக்கிறது.
- source_word: κυρίῳ
  choice: ஆண்டவர்
  rationale: இயேசுவுக்குரிய கிறிஸ்துவியல் பட்டத்தைத் தெளிவாகவும் நவீனத் தமிழுக்கு ஏற்றவாறும் தருகிறது.
- source_word: ἀγάπην
  choice: அன்பு
  rationale: ἀγάπη என்பதற்கான இயல்பான, தற்போதைய தமிழ் இணைச்சொல்.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: பரிசுத்தவான்கள் அனைவர்மீதும்
  rationale: அன்பு செலுத்தப்படும் மனிதர்களை நோக்கிய εἰς என்பதன் திசைநோக்கை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἁγίους
  choice: பரிசுத்தவான்கள்
  rationale: பவுல் விசுவாசிகளை அழைக்கும் ‘பரிசுத்தமானவர்கள்’ என்ற அடையாளத்தைப் பாதுகாக்கிறது; பிற்காலப் புனிதர் பட்டமளிப்பு என்ற கருத்தைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: πίστις என்பதன் பொருள்
  choice: விசுவாசம்
  alternative: நம்பிக்கை; சில சூழல்களில் உண்மைத்தன்மை
  rationale: இங்கு ‘ஆண்டவராகிய இயேசுவில்’ என்ற தொடரால், வாசகர்களின் நம்பிக்கை சார்ந்த உறவே நேரடியான பொருள். இருந்தாலும் சொல்லின் விரிந்த பொருள் அடிக்குறிப்பில் மறைக்கப்படவில்லை.
- issue: ἐν τῷ κυρίῳ Ἰησοῦ என்பதிலுள்ள ἐν
  choice: ஆண்டவராகிய இயேசுவில்
  alternative: ஆண்டவராகிய இயேசுவின்மேல்
  rationale: ‘இயேசுவின்மேல்’ என்பது தமிழில் நம்பிக்கையின் இலக்கைத் தெளிவாக்கும்; ஆனால் ‘இயேசுவில்’ என்பது கிரேக்க முன்னிடைச்சொல்லையும் பவுலின் உறவுசார் மொழியிலுள்ள சாத்தியமான ஆழத்தையும் காக்கிறது.
- issue: κύριος என்ற கிறிஸ்துவியல் பட்டம்
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: இங்கு இயேசுவின் பட்டமாக வரும் κύριος என்பதன் தெய்வவியல் கனத்தையும் மரியாதையையும் ‘ஆண்டவர்’ காக்கிறது.
- issue: ἅγιοι என்பவர்களின் அடையாளம்
  choice: பரிசுத்தவான்கள்
  alternative: பரிசுத்த மக்கள்
  rationale: கிரேக்கப் பெயரடையைப் பெயர்ச்சொல் வகையில் பயன்படுத்தும் பவுலின் சொல்லாட்சியைத் தக்கவைக்கிறது; குறிப்பிட்ட சிலருக்கான பிற்காலப் பட்டமாக இதை வரையறுப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதையும் வாசிப்பின் இயல்பும் சமநிலைப்படுத்தப்பட்டுள்ளன. கிரேக்க வசனம் அடுத்த வசனத்தில் தொடரும் நீண்ட வாக்கியத்தின் தொடக்கமாக இருப்பதால், தமிழிலும் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. ‘விசுவாசம்’, ‘ஆண்டவர்’, ‘பரிசுத்தவான்கள்’ ஆகியவை தெய்வவியல் நிறையைத் தக்கவைத்தாலும், வாக்கிய அமைப்பு சாதாரண வாசகர்களுக்குப் புரியுமாறு அமைக்கப்பட்டுள்ளது.
