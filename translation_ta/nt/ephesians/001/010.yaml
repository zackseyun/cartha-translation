revisions:
- from: காலங்கள் நிறைவடையும்போது செயல்படுத்தப்படும் ஏற்பாட்டின்படி, பரலோகங்களில் உள்ளவையும் பூமியில் உள்ளவையுமாகிய அனைத்தையும் மேசியாவில் ஒன்றுதிரட்டுவதற்காக[a]—ஆம், அவரிலேயே ஒன்றுதிரட்டுவதற்காக—
  to: காலங்களின் நிறைவுக்கான ஒழுங்கமைப்பாக, பரலோகங்களில் உள்ளவையும் பூமியில் உள்ளவையுமாகிய அனைத்தையும் மேசியாவில் ஒன்றுதிரட்டுவதற்கு[a]—அவரில்,
