source:
  edition: SBLGNT
  text: εἰς οἰκονομίαν τοῦ πληρώματος τῶν καιρῶν, ἀνακεφαλαιώσασθαι τὰ πάντα ἐν τῷ Χριστῷ, τὰ ἐπὶ τοῖς οὐρανοῖς καὶ τὰ ἐπὶ τῆς γῆς· ἐν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/010.yaml
  text: for the administration of the fullness of the times[a], to sum up all things in the Messiah—the things in the heavens and the things on the earth—in him,
translation:
  language: ta
  text: காலங்களின் நிறைவுக்கான ஒழுங்கமைப்பாக, பரலோகங்களில் உள்ளவையும் பூமியில் உள்ளவையுமாகிய அனைத்தையும் மேசியாவில் ஒன்றுதிரட்டுவதற்கு[a]—அவரில்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அனைத்தையும் மேசியாவின் தலைமையின்கீழ் ஒன்றுசேர்ப்பதற்கு.” கிரேக்க வினைச்சொல் அனைத்தையும் தொகுத்தல் அல்லது ஒரே தலைமையின்கீழ் ஒன்றிணைத்தல் என்ற பொருள்களையும் தரக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκονομίαν
  choice: செயல்படுத்தப்படும் ஏற்பாடு
  rationale: இச்சொல் நிர்வாகம், ஒழுங்கமைப்பு, திட்ட ஏற்பாடு ஆகிய பொருள்களைத் தரலாம். தமிழில் வெறும் ‘நிர்வாகம்’ என்பது நிறுவனச் செயல்பாட்டைப் போல ஒலிக்கக்கூடும்; ‘செயல்படுத்தப்படும் ஏற்பாடு’ என்பது கடவுளுடைய ஒழுங்கமைந்த நோக்கை மிகையின்றி வெளிப்படுத்துகிறது.
- source_word: πληρώματος τῶν καιρῶν
  choice: காலங்கள் நிறைவடையும்போது
  rationale: ‘காலங்களின் நிறைவு’ என்ற மூல உருவகத்தை இயல்பான தமிழில் காலநிலைச் சூழலாக அளிக்கிறது; καιροί குறிக்கும் குறிக்கப்பட்ட காலக்கட்டங்களின் நிறைவைப் பாதுகாக்கிறது.
- source_word: ἀνακεφαλαιώσασθαι
  choice: ஒன்றுதிரட்டுவதற்காக
  rationale: வினைச்சொல் அனைத்தையும் சுருக்கித் தொகுத்தல் அல்லது ஒரே தலைமையின் கீழ் ஒன்றுசேர்த்தல் என்ற இரு நுணுக்கங்களையும் கொண்டிருக்கலாம். ‘ஒன்றுதிரட்டுதல்’ cosmic unification-ஐ இயல்பாகக் கூறுகிறது; தலைமை சார்ந்த மாற்று அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: τὰ πάντα
  choice: அனைத்தையும்
  rationale: கிரேக்க நடுநிலைப் பன்மையின் முழுமையான பரப்பைச் சுருக்கமாகவும் அழுத்தமாகவும் தருகிறது.
- source_word: ἐν τῷ Χριστῷ
  choice: மேசியாவில்
  rationale: Χριστός இங்கு பட்டப்பெயராகச் செயல்படுவதால் ‘கிறிஸ்துவில்’ என்பதற்குப் பதிலாக ‘மேசியாவில்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: τὰ ἐπὶ τοῖς οὐρανοῖς
  choice: பரலோகங்களில் உள்ளவை
  rationale: οὐρανοῖς என்ற பன்மையையும், பரலோக மண்டலங்களில் அமைந்துள்ளவற்றைக் குறிக்கும் இடப்பொருளையும் காக்கிறது.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: பூமியில் உள்ளவை
  rationale: பரலோகங்களுடன் மாறுபடுத்தப்படும் பூமிசார் இடப்பொருளை நேரடியாகக் காட்டுகிறது.
- source_word: ἐν αὐτῷ
  choice: அவரிலேயே
  rationale: சுட்டுப்பெயர் மேசியாவையே இயல்பாகச் சுட்டுகிறது. கிரேக்கத்தின் இறுதி மறுபடியுரைத்தலையும் வலியுறுத்தலையும் தமிழில் இயல்பாகப் பாதுகாக்க ‘அவரிலேயே’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: Χριστῷ என்பதன் மொழிபெயர்ப்பு
  choice: மேசியாவில்
  alternative: கிறிஸ்துவில்
  rationale: இங்கு Χριστός தனிப்பெயர் போல அல்லாமல் பட்டப்பெயராகவும் கடவுளுடைய உலகளாவிய நோக்கின் மையமாகவும் வருகிறது.
- issue: ἀνακεφαλαιώσασθαι என்பதன் பொருள்
  choice: அனைத்தையும் ஒன்றுதிரட்டுதல்
  alternative: அனைத்தையும் ஒரே தலைவரின்கீழ் ஒன்றுசேர்த்தல்
  rationale: மூல வினைச்சொல் தொகுத்தல்/ஒன்றிணைத்தல் மற்றும் ஒரே தலைமையின்கீழ் கொண்டுவருதல் ஆகிய நுணுக்கங்களுக்கு இடமளிக்கிறது. பிரதான உரை இயல்பான, விரிவான பொருளைக் கொடுக்கிறது; தலைமை நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἐν αὐτῷ என்ற இறுதித் தொடரின் தொடர்பு
  choice: மேசியாவைச் சுட்டும் வலியுறுத்தலாக ‘அவரிலேயே’
  alternative: முன்னுள்ள ‘மேசியாவில்’ என்பதுடன் இணைந்த சாதாரண ‘அவரில்’
  rationale: சுட்டுப்பெயர் இயல்பாக மேசியாவையே குறிக்கிறது. அதன் இடத்தையும் மறுபடியுரைத்தலையும் அழிக்காமல் தமிழில் வலியுறுத்தலாகத் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வேதாகமத்திற்குரிய கண்ணியத்தைத் தக்கவைத்த இயல்பான நடை. இவ்வசனம் முந்தைய வாக்கியத்துடன் இலக்கண ரீதியாகத் தொடர்வதால் இறுதியில் நிறுத்துப்புள்ளி இடப்படவில்லை. ‘செயல்படுத்தப்படும் ஏற்பாடு’ என்பது ‘நிர்வாகம்’ என்ற அலுவலகத் தொனியைத் தவிர்த்து οἰκονομίαν என்பதன் ஒழுங்கமைந்த செயலாக்கப் பொருளை வெளிப்படுத்துகிறது.
