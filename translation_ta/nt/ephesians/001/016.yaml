translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. கிரேக்க வாக்கியத்தின் பங்கேற்புவினைத் தொடர்பு தமிழில் இயல்பாக அமைய, ஜெபங்களில் குறிப்பிடுதல் முதலில் வைக்கப்பட்டு, நன்றி செலுத்துவதை நிறுத்தாதிருத்தல் முதன்மை வினையாகக் காக்கப்பட்டுள்ளது.
