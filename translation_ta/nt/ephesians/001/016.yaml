lexical_decisions:
- source_word: οὐ παύομαι
  choice: நான் நிறுத்துவதில்லை
  rationale: நிகழ்காலத்தில் தொடரும் நிறுத்தாமையை வெளிப்படுத்துகிறது; தமிழில் இயல்பாகவும் மூலத்தின் வலிமையுடனும் அமைகிறது.
- source_word: εὐχαριστῶν
  choice: நன்றி செலுத்துவதை
  rationale: παύομαι என்பதோடு இணைந்த நிகழ்காலப் பங்கேற்புவினையின் தொடர்ச்சியான நன்றிசெலுத்துதலைத் தெளிவாகக் காக்கிறது.
- source_word: ὑπὲρ ὑμῶν
  choice: உங்களுக்காக
  rationale: நன்றி செலுத்தப்படுவதற்கான நபர்களைச் சுட்டும் ὑπέρ + பிறப்புவேற்றுமையின் பொருளை இயல்பாகத் தருகிறது.
- source_word: μνείαν ποιούμενος
  choice: உங்களைக் குறிப்பிட்டு
  rationale: ‘குறிப்பிடுதல்’ என்ற கிரேக்க மரபுத்தொடரின் வெளிப்படையான பொருளைக் காக்கிறது; சூழலில் மறைந்துள்ள ‘உங்களை’ என்ற செயப்படுபொருள் தெளிவாக்கப்பட்டுள்ளது.
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: என் ஜெபங்களில்
  rationale: குறிப்பிடுதல் நிகழும் சூழல் அல்லது சந்தர்ப்பத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
