  text: ὑπεράνω πάσης ἀρχῆς καὶ ἐξουσίας καὶ δυνάμεως καὶ κυριότητος καὶ παντὸς ὀνόματος ὀνομαζομένου οὐ μόνον ἐν τῷ αἰῶνι τούτῳ ἀλλὰ καὶ ἐν τῷ μέλλοντι·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/021.yaml
  text: far above every rule and authority and power and dominion[a], and every name that is named[c][b], not only in this age but also in the one to come.
translation:
  language: ta
  text: எல்லா ஆட்சிக்கும் அதிகாரத்துக்கும் வல்லமைக்கும் ஆதிக்கத்துக்கும்[a], பெயரிட்டு அழைக்கப்படும் ஒவ்வொரு பெயருக்கும்[b] மிகவும் மேலாக—இந்தக் காலத்தில் மட்டுமல்ல, வரவிருக்கும் காலத்திலும்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஒவ்வொரு முதன்மை அதிகாரத்துக்கும், அதிகாரத்துக்கும், வல்லமைக்கும், ஆண்டாட்சிக்கும்’ என்றும் மொழிபெயர்க்கலாம். இந்தக் கிரேக்கச் சொற்கள் ஆவிக்குரிய அல்லது பிரபஞ்ச அதிகாரங்கள் உட்பட ஆட்சியின் நிலைகள் அல்லது வட்டங்களைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘வழங்கப்படும் ஒவ்வொரு பட்டத்துக்கும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπεράνω
  choice: மிகவும் மேலாக
  rationale: சாதாரண இடநிலையை மட்டுமல்லாமல் உயர்வையும் மேலாதிக்கத்தையும் உணர்த்தும் தீவிரத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πάσης ἀρχῆς
  choice: எல்லா ஆட்சிக்கும்
  rationale: இச்சூழலில் ἀρχή என்பது தொடக்கத்தைக் காட்டிலும் ஆளுகை அல்லது ஆட்சிச் சக்தியின் வகையைக் குறிக்கிறது; அதை ஆளும் நபர்கள் என்று மட்டும் சுருக்காமல் பொதுவாக வைத்திருக்கிறது.
- source_word: ἐξουσίας
  choice: அதிகாரத்துக்கும்
  rationale: அதிகாரம் செலுத்தும் உரிமை அல்லது ஆளுகை வட்டத்தைச் சுட்டுகிறது; δύναμις என்பதிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: δυνάμεως
  choice: வல்லமைக்கும்
  rationale: செயலாற்றும் சக்தியை இயல்பாகக் குறிக்கிறது; முந்தைய ‘அதிகாரம்’ என்பதுடன் கலந்துவிடாமல் தொடரின் வேறுபாட்டைப் பேணுகிறது.
- source_word: κυριότητος
  choice: ஆதிக்கத்துக்கும்
  rationale: ஆண்டமை அல்லது மேலாதிக்கத்தின் வகையைக் குறிக்கிறது; இதைத் தெய்வீகப் பட்டமான ‘கர்த்தத்துவம்’ என்று தேவையின்றி குறுக்காமல் விடுகிறது.
- source_word: παντὸς ὀνόματος ὀνομαζομένου
  choice: பெயரிடப்படும் ஒவ்வொரு பெயருக்கும்
  rationale: மூலத்தின் ‘பெயர்/பெயரிடு’ என்ற சொல்லாட்சித் திருப்பத்தைப் பேணுகிறது; அதே நேரத்தில் பெயர், பட்டம், பதவி ஆகியவற்றை உள்ளடக்கக்கூடிய பரப்பையும் திறந்தே வைக்கிறது.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: மட்டுமல்ல ... காலத்திலும்
  rationale: இரு காலங்களையும் இணைத்துக் காட்டும் கிரேக்க இணைப்பமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: இந்தக் காலத்தில்
  rationale: αἰών என்பதன் காலகட்டப் பொருளைத் தக்கவைத்து, ‘உலகம்’ என்ற இடவியல் பொருளுக்குச் சுருக்குவதைத் தவிர்க்கிறது.
- source_word: ἐν τῷ μέλλοντι
  choice: வரவிருக்கும் காலத்திலும்
  rationale: முன்னர் வந்த αἰών இங்கு புரிந்துகொள்ளப்படுவதைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἀρχή, ἐξουσία, δύναμις, κυριότης ஆகியவை குறிக்கும் அதிகாரங்களின் இயல்பு
  choice: மனித, விண்ணுலக அல்லது ஆவிக்குரிய அதிகாரங்கள் என்று பிரதான உரையில் குறிப்பாக வரையறுக்காமல், ஆட்சி மற்றும் அதிகாரத்தின் பரந்த வகைகளாக மொழிபெயர்த்தல்.
  alternative: இவற்றை வெளிப்படையாக விண்ணுலக சக்திகள் அல்லது தேவதூதர் படிநிலைகள் என்று மொழிபெயர்த்தல்.
  rationale: சூழல் ஆவிக்குரிய அல்லது பிரபஞ்ச அதிகாரங்களையும் உள்ளடக்கக்கூடும்; ஆனால் கிரேக்கம் அவற்றின் இயல்பை வெளிப்படையாக வரையறுக்காமல் அதிகார வகைகளைப் பட்டியலிடுகிறது. ஆகவே அதன் பரப்பும் இறையியல் அழுத்தமும் திறந்தே வைக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் dignified நடையைப் பயன்படுத்துகிறது. இது முந்தைய வசனத்தில் தொடங்கிய வாக்கியத்தின் தொடராக இருப்பதால் இறுதியில் முடிவுறாத இணைப்பு ஓட்டம் பேணப்பட்டுள்ளது; em dash காலச்சார்ந்த விரிவாக்கத்தைத் தெளிவுபடுத்துகிறது.
