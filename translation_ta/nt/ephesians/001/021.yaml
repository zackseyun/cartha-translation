  - severity: low
    issue: Footnote a uses less natural alternative terminology
    rationale: “ஆளுகை” and especially “ஆண்டமை” are less idiomatic in this register. “முதன்மை அதிகாரம்” and “ஆண்டாட்சி” communicate the lexical alternatives more clearly without changing the main-text ambiguity.
