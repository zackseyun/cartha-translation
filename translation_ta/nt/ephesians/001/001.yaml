id: EPH.1.1
reference: Ephesians 1:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ τοῖς ἁγίοις τοῖς οὖσιν ⸂[ἐν Ἐφέσῳ]⸃ καὶ πιστοῖς ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/001.yaml
  text: 'Paul[a], an apostle of Messiah Jesus by the will of God[c][b], to the saints who are [in Ephesus] and faithful in Messiah Jesus:'
translation:
  language: ta
  text: 'தேவனுடைய திருவுளத்தினால் மெசியாவாகிய இயேசுவின்[c] அப்போஸ்தலனான பவுல், [எபேசுவில்][a] இருக்கும் பரிசுத்தவான்களும் மெசியாவாகிய இயேசுவில் உண்மையுள்ளவர்களுமான[b] உங்களுக்கு:


    [a] தொடக்ககாலக் கையெழுத்துப் பிரதிகள் சிலவற்றில் “எபேசுவில்” என்ற சொற்கள் இல்லை. எனவே, இந்தக் கடிதம் எபேசுவிலுள்ள திருச்சபைக்கு மட்டும் அல்லாமல், பல இடங்களிலுள்ள திருச்சபைகளிலும் வாசிக்கப்படுவதற்காக எழுதப்பட்டிருக்கலாம் என்று சிலர் கருதுகின்றனர்.


    [b] அல்லது, “மெசியாவாகிய இயேசுவில் விசுவாசமுள்ளவர்களுமான.”


    [c] கிரேக்கத்தில், “கிறிஸ்து இயேசு.” இங்கு Χριστός (கிறிஸ்தோஸ்) என்பது ஒரு பெயராக அல்லாமல் “மெசியா” என்ற பட்டமாகச் செயல்படுவதால், “மெசியாவாகிய இயேசு” என்று மொழிபெயர்க்கப்பட்டுள்ளது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: தொடக்ககாலக் கையெழுத்துப் பிரதிகள் சிலவற்றில் “எபேசுவில்” என்ற சொற்கள் இல்லை. எனவே, இந்தக் கடிதம் எபேசுவிலுள்ள திருச்சபைக்கு மட்டும் அல்லாமல், பல இடங்களிலுள்ள திருச்சபைகளிலும் வாசிக்கப்படுவதற்காக எழுதப்பட்டிருக்கலாம் என்று சிலர் கருதுகின்றனர்.
    reason: textual_variant
  - marker: b
    text: அல்லது, “மெசியாவாகிய இயேசுவில் விசுவாசமுள்ளவர்களுமான.”
    reason: lexical_alternative
  - marker: c
    text: கிரேக்கத்தில், “கிறிஸ்து இயேசு.” இங்கு Χριστός (கிறிஸ்தோஸ்) என்பது ஒரு பெயராக அல்லாமல் “மெசியா” என்ற பட்டமாகச் செயல்படுவதால், “மெசியாவாகிய இயேசு” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστολος
  choice: அப்போஸ்தலன்
  rationale: இங்கு இது வெறும் ‘தூதர்’ என்பதைக் காட்டிலும், அனுப்பப்பட்ட அதிகாரப்பூர்வ ஊழியத்தைக் குறிக்கும் தொடக்ககாலக் கிறிஸ்தவப் பதவிப்பெயராக உள்ளது; தமிழில் பரவலாக அறியப்பட்ட தொழில்நுட்பச் சொல்லைத் தக்கவைக்கிறது.
- source_word: Χριστοῦ Ἰησοῦ / ἐν Χριστῷ Ἰησοῦ
  choice: மெசியாவாகிய இயேசுவின் / மெசியாவாகிய இயேசுவில்
  rationale: Χριστός இவ்வாழ்த்துரையில் பட்டத்தன்மையைத் தக்கவைக்கிறது. ‘மெசியாவாகிய’ என்பது தமிழில் இயல்பாக அந்தப் பட்டத்தை வெளிப்படுத்துகிறது; ἐν என்பதையும் ‘இல்’ என்று தக்கவைக்கிறது.
- source_word: διὰ θελήματος θεοῦ
  choice: தேவனுடைய திருவுளத்தினால்
  rationale: διά + genitive இங்கு பவுலின் அப்போஸ்தல நியமனத்திற்கான தெய்வீக காரணத்தையும் அதிகாரத்தையும் குறிக்கிறது; ‘திருவுளத்தினால்’ என்பது இயல்பான, கண்ணியமான தமிழ்.
- source_word: ἁγίοις
  choice: பரிசுத்தவான்கள்
  rationale: தேவனுக்கென்று பிரித்தெடுக்கப்பட்ட மக்களைக் குறிக்கும் பவுலின் சமூகப் பெயரிடலைத் தக்கவைக்கிறது; தனிப்பட்ட முறையில் விசேஷ புனித நிலை பெற்றவர்களை மட்டும் குறிக்கும் வகையில் சுருக்கவில்லை.
- source_word: '[ἐν Ἐφέσῳ]'
  choice: '[எபேசுவில்]'
  rationale: சொற்றொடரின் உரைநிலை உறுதியற்றிருப்பதை மூலப் பதிப்பைப் போலவே சதுர அடைப்புக்குறிகளால் வெளிப்படையாகக் காட்டுகிறது.
- source_word: πιστοῖς
  choice: உண்மையுள்ளவர்கள்
  rationale: πιστός என்பதிலுள்ள ‘உண்மையுள்ள/விசுவாசமுள்ள’ என்ற பண்புத்தன்மையைத் தக்கவைக்கிறது. ‘விசுவாசிக்கிறவர்கள்’ என்பதும் சாத்தியமானதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: Χριστός என்பதன் பட்டத்தன்மை
  choice: மெசியாவாகிய இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: இவ்விடத்தில் Χριστός வெறும் பெயரின் பகுதியாக உறைந்துவிடாமல், இயேசுவின் பட்டமாகத் தெளிவாகச் செயல்படுகிறது; ஆகவே பட்டப்பொருள் மொழிபெயர்ப்பில் வெளிப்படுத்தப்பட்டுள்ளது.
- issue: ἐν Ἐφέσῳ என்பதன் உரைநிலை
  choice: '[எபேசுவில்] என்று அடைப்புக்குறிக்குள் தக்கவைத்தல்'
  alternative: ‘எபேசுவில்’ என்பதை விடுத்தல்
  rationale: சில முக்கிய தொடக்ககாலச் சாட்சிகளில் இச்சொற்கள் இல்லை. எந்த வாசகத்தையும் மறைமுகமாகத் தீர்மானிக்காமல், மூலத்தில் காணப்படும் உரைநிலை ஐயத்தை நேரடியாகப் பாதுகாக்கிறது.
- issue: πιστοῖς என்பதன் பொருள்
  choice: உண்மையுள்ளவர்கள்
  alternative: விசுவாசிக்கிறவர்கள்
  rationale: இச்சொல் நம்புகிற அடையாளத்தையும் உண்மைத்தன்மையையும் குறிக்க முடியும். முதன்மை உரையில் பண்புத்தன்மை தக்கவைக்கப்பட்டு, மற்ற பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில் கண்ணியமான வேதாகம நடையைப் பயன்படுத்தியுள்ளது. ‘அப்போஸ்தலன்’, ‘பரிசுத்தவான்கள்’, ‘திருவுளம்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டாலும், வாக்கிய அமைப்பு சாதாரண வாசகருக்குப் புரியும் வகையில் அமைக்கப்பட்டுள்ளது. கிரேக்க வாழ்த்துரையின் முழுமையற்ற கடிதத் தொடக்க அமைப்பை ‘எழுதுவது’ போன்ற மூலத்தில் இல்லாத வினைச்சொல்லால் நிரப்பாமல் பாதுகாத்துள்ளது.
