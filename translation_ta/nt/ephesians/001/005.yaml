source:
  edition: SBLGNT
  text: προορίσας ἡμᾶς εἰς υἱοθεσίαν διὰ Ἰησοῦ Χριστοῦ εἰς αὐτόν, κατὰ τὴν εὐδοκίαν τοῦ θελήματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/005.yaml
  text: having predestined us for adoption through Jesus the Messiah to himself[a], according to the good pleasure of his will[c][b],
translation:
  language: ta
  text: அவர் தமது திருவுளத்தின் நல்விருப்பத்தின்படி, இயேசு மெசியா வழியாக நம்மைத் தமக்காக[c] மகன்களாகத் தத்தெடுக்க[a] முன்குறித்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மகன்களாகத் தத்தெடுக்க” என்பதற்கான கிரேக்கச் சொல், மகனுக்குரிய சட்டநிலையையும் வாரிசுரிமையையும் அளிப்பதைக் குறிக்கிறது. இது ஆண், பெண் என விசுவாசிகள் அனைவருக்கும் பொருந்தும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “முன்பே தீர்மானித்தார்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “தம்மிடம் சேரும்படி.” கிரேக்கச் சொற்றொடர் தேவனை நோக்கிய இலக்கையையோ, “தமக்காக” என்ற நோக்கத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: προορίσας
  choice: முன்குறித்தார்
  rationale: προορίζω என்பதில் உள்ள ‘முன்பே நிர்ணயித்தல்’ என்ற கால மற்றும் தீர்மான நுணுக்கத்தைத் தணிக்காமல் தருகிறது. தமிழில் தனி வசனமாக இயல்பாக வாசிக்க, கிரேக்க இறந்தகால வினையெச்சம் முற்றுவினையாக வழங்கப்பட்டுள்ளது; அதன் தொடரியல் தொடர்பைச் சூழல் காட்டுகிறது.
- source_word: εἰς υἱοθεσίαν
  choice: மகன்களாகத் தத்தெடுக்க
  rationale: υἱοθεσία என்பது வெறும் குடும்பத்தில் சேர்த்தலை மட்டுமல்லாமல், மகனுக்குரிய சட்டநிலை மற்றும் வாரிசுரிமையைப் பெறச் செய்வதையும் குறிக்கிறது. மூலத்தின் பாலினக் கூறைத் தக்கவைத்துள்ளது; இது விசுவாசிகள் அனைவருக்கும் பொருந்துவதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியா வழியாக
  rationale: διά + உரிமை வேற்றுமை, வழிமுறை அல்லது செயலாற்றுபவரைக் குறிக்கிறது. Χριστός என்பது பட்டமாக இருப்பதால் அதன் பொருளை வெளிப்படுத்தும் ‘மெசியா’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: εἰς αὐτόν
  choice: தமக்கென
  rationale: சூழலில் αὐτόν தேவனைச் சுட்டுகிறது. εἰς என்பதன் இலக்கு அல்லது நோக்கம் ஆகிய இரு சாத்தியங்களையும் தமிழில் சுருக்கமாகத் தாங்கும் சொல்; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: κατὰ τὴν εὐδοκίαν
  choice: நல்விருப்பத்தின்படி
  rationale: κατά என்பதன் ‘ஒத்தபடி/இணங்க’ என்ற பொருளையும், εὐδοκία என்பதன் மனமுவந்த நல்ல நோக்கம் அல்லது மகிழ்ச்சியான விருப்பம் என்ற பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: τοῦ θελήματος αὐτοῦ
  choice: தமது திருவுளத்தின்
  rationale: θέλημα என்பதற்கு ‘விருப்பம்/சித்தம்’ என்ற நேரடிப் பொருள் உண்டு. தேவனைச் சார்ந்த கண்ணியமான நவீன தமிழ் வழக்கில் ‘திருவுளம்’ இயல்பானது; அதை ‘திட்டம்’ என்று விளக்கவுரையாக்கவில்லை.
theological_decisions:
- issue: προορίσας என்ற சர்ச்சைக்குரிய இறையியல் சொல்லின் மொழிபெயர்ப்பு
  choice: முன்குறித்தார்
  alternative: முன்பே தீர்மானித்தார்
  rationale: மூலச்சொல்லின் ‘முன்பே நிர்ணயித்தல்’ என்ற வலிமையைப் பாதுகாக்கிறது; ஆனால் முன்குறித்தலின் முறை அல்லது விரிவைப் பற்றிய எந்த ஓர் சமயப்பிரிவின் கோட்பாட்டையும் வசனத்துக்குள் சேர்க்கவில்லை.
- issue: υἱοθεσία என்பதிலுள்ள பாலினமும் சட்டநிலையும்
  choice: மகன்களாகத் தத்தெடுக்க
  alternative: பிள்ளைகளாகத் தத்தெடுக்க
  rationale: கிரேக்கச் சொல்லில் ‘மகன்’ என்ற கூறும் வாரிசுரிமை சார்ந்த சட்டநிலையும் உள்ளன. ‘மகன்களாக’ என்பது அந்த நுணுக்கத்தைப் பாதுகாக்கிறது; இதன் பயன் ஆண், பெண் என அனைத்து விசுவாசிகளுக்கும் உரியது என்பதை அடிக்குறிப்பு விளக்குகிறது.
- issue: Χριστοῦ என்ற பட்டம்
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: Χριστός இங்கு இயேசுவின் பட்டமாகச் செயல்படுவதால், அதன் பொருளை வெளிப்படுத்தும் ‘மெசியா’ பயன்படுத்தப்பட்டுள்ளது.
- issue: εἰς αὐτόν என்பதின் இலக்கு/நோக்கத் தெளிவின்மை
  choice: தமக்கென
  alternative: தம்மிடம் சேரும்படி
  rationale: ‘தமக்காக’ என்ற நோக்கப் பொருளை முதன்மையாகக் காட்டினாலும், தேவனே தத்தெடுப்பின் இலக்கு என்ற வாசிப்பை நிராகரிக்காமல் அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகருக்குப் புரியும் நடையில் அமைக்கப்பட்டுள்ளது. ‘திருவுளம்’ தேவனைச் சார்ந்த மரியாதைமிக்க வழக்கைத் தக்கவைக்கிறது. கிரேக்க நீண்ட வாக்கியத்தின் வினையெச்ச அமைப்பு, தனி வசன வாசிப்பின் இயல்புக்காக முற்றுவினையாக மாற்றப்பட்டுள்ளது; கருத்து உறவு மாறவில்லை.
