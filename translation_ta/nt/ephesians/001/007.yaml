  text: ἐν ᾧ ἔχομεν τὴν ἀπολύτρωσιν διὰ τοῦ αἵματος αὐτοῦ, τὴν ἄφεσιν τῶν παραπτωμάτων, κατὰ ⸂τὸ πλοῦτος⸃ τῆς χάριτος αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/007.yaml
  text: In him we have redemption through his blood[a], the forgiveness of trespasses[b], according to the riches of his grace
translation:
  language: ta
  text: அவருக்குள்[a] அவருடைய இரத்தத்தின் மூலம் நமக்கு மீட்பு உண்டு—குற்றங்களின் மன்னிப்பு[b]—அவருடைய அருளின் செல்வத்திற்கேற்ப.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாரில்.” இச்சொல் முந்தைய வசனத்தில் கூறப்பட்ட அன்புக்குரியவரைச் சுட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மீறுதல்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: அவருக்குள்
  rationale: முந்தைய வசனத்திலுள்ள அன்புக்குரியவரையே உறவுப்பெயர் சுட்டுகிறது. “அவருக்குள்” என்பது கிறிஸ்துவோடு உள்ள இணைப்புணர்வைப் பாதுகாக்கிறது; தமிழிலும் இயல்பாக உள்ளது.
- source_word: ἔχομεν
  choice: நமக்கு ... உண்டு
  rationale: நிகழ்காலத்தில் உள்ள உரிமை அல்லது நிஜநிலையைத் தமிழில் நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀπολύτρωσιν
  choice: மீட்பு
  rationale: விலைகொடுத்து விடுவித்தல் என்ற பின்னணியையும் பவுலின் இறையியல் நிறையையும் தக்கவைக்கும் நிலையான தமிழ்ச் சொல்.
- source_word: διὰ τοῦ αἵματος αὐτοῦ
  choice: அவருடைய இரத்தத்தின் மூலம்
  rationale: διά + உடைமை வேற்றுமை இங்கு வழிமுறை அல்லது கருவியைக் குறிக்கிறது. மூலத்தின் பலி மற்றும் மரணம் சார்ந்த இரத்த உருவகத்தை விளக்கவுரையாக்காமல் அப்படியே காக்கிறது.
- source_word: ἄφεσιν
  choice: மன்னிப்பு
  rationale: குற்றங்களை நீக்குதல் அல்லது பொறுத்தருளுதல் என்ற பொருளைத் தெளிவாகத் தருகிறது; இச்சூழலில் “விடுதலை” என்பதைவிட இயல்பானது.
- source_word: παραπτωμάτων
  choice: குற்றங்கள்
  rationale: தவறான அடியெடுப்பு, ஒழுக்கத் தவறு, மீறல் ஆகிய பொருள் வரம்பை பொதுவான நவீன தமிழில் கொண்டுவருகிறது. “மீறுதல்கள்” என்பதும் சாத்தியமான மாற்று.
- source_word: κατὰ τὸ πλοῦτος
  choice: பெருவளத்திற்கு ஏற்ப
  rationale: κατά இங்கு ஆதாரத்தை மட்டும் அல்லாமல் அளவுகோல் அல்லது பொருத்தத்தையும் குறிக்கிறது. “பெருவளம்” அருளின் மிகுதியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: χάριτος
  choice: அருள்
  rationale: கடவுளின் தகுதியற்றவர்களுக்குக் காட்டப்படும் நன்மையும் தயவும் குறிக்கும் பவுலின் மையச் சொல்லுக்கு ஏற்ற, நிலைபெற்ற தமிழ் மொழிபெயர்ப்பு.
theological_decisions:
- issue: “மீட்பு” என்பதற்கும் “குற்றங்களுக்கான மன்னிப்பு” என்பதற்கும் உள்ள தொடர்பு
  choice: இரண்டாவது பெயர்த்தொடரை இடைச்செருகல் apposition ஆகக் கோடுகளுக்குள் அமைத்தல்
  alternative: “மீட்பு, அதாவது குற்றங்களுக்கான மன்னிப்பு” என்று வெளிப்படையாக விளக்குதல்
  rationale: இரண்டாவது குற்றச்சாட்டு வேற்றுமைத் தொடர் முதல்வருடன் apposition ஆக இருந்து அதை விளக்குகிறது. கோடுகள் கிரேக்க அமைப்பையும் இரண்டிற்குள்ள நெருங்கிய தொடர்பையும் காக்கின்றன; “அதாவது” என்று சேர்த்து உறவை அளவுக்கு மீறி விளக்குவதில்லை.
- issue: “அவருடைய இரத்தத்தின் மூலம்” என்ற பாவநிவாரண மொழி
  choice: இரத்தம் என்ற தெளிவான உருவகத்தை அப்படியே வைத்தல்
  alternative: “அவருடைய மரணத்தின் மூலம்” அல்லது “அவருடைய பலிமரணத்தின் மூலம்”
  rationale: மூலம் நேரடியாக “இரத்தம்” என்கிறது; அதை “மரணம்” என்று மாற்றுவது மொழிபெயர்ப்பைவிட விளக்கமாகிவிடும், மேலும் பலி மற்றும் உடன்படிக்கை சார்ந்த ஒலிப்பை மங்கச் செய்யும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. இயல்பான தமிழ் சொல்வரிசைக்காக “அவருடைய அருளின் பெருவளத்திற்கு ஏற்ப” முன்னிலைப்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியத்தின் apposition தொடர்பை கோடுகள் தெளிவாக்குகின்றன; தேவையற்ற கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
