revisions:
- from: அவருடைய அருளின் பெருவளத்திற்கு ஏற்ப, அவருக்குள்[a] அவருடைய இரத்தத்தின் மூலம் நமக்கு மீட்பு உண்டு—குற்றங்களுக்கான மன்னிப்பு[b].
  to: அவருக்குள்[a] அவருடைய இரத்தத்தின் மூலம் நமக்கு மீட்பு உண்டு—குற்றங்களின் மன்னிப்பு[b]—அவருடைய அருளின் செல்வத்திற்கேற்ப.
  rationale: The revision restores the source order, renders the appositional phrase with a Tamil genitive that unambiguously means forgiveness of offences, and uses ‘செல்வம்’ for the riches of grace. The dashes retain the close explanatory/appositional relationship without adding an interpretive phrase such as ‘அதாவது.’
  reviewer_model: gpt-5.6-terra
