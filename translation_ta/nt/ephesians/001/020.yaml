  edition: SBLGNT
  text: ἣν ⸀ἐνήργηκεν ἐν τῷ Χριστῷ ἐγείρας αὐτὸν ⸀ἐκ νεκρῶν, καὶ ⸀καθίσας ἐν δεξιᾷ αὐτοῦ ἐν τοῖς ἐπουρανίοις
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/020.yaml
  text: which he worked in the Messiah when he raised him from the dead and seated him at his right hand in the heavenly places[b][a],
translation:
  language: ta
  text: அந்த வல்லமையை அவர் மெசியாவில்[a] செயல்படுத்தினார்; அவரை இறந்தோரிடமிருந்து எழுப்பி, வானுலக மண்டலங்களில்[b] தமது வலப்பக்கத்தில் அமரச் செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்துவில்.”
    reason: alternative_reading
  - marker: b
    text: அல்லது, “வானுக்குரிய இடங்களில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν
  choice: அந்த வல்லமையை
  rationale: இந்தப் பெண்பால் சார்புப்பெயர் முந்தைய வசனத்தில் கூறப்பட்ட இறைவல்லமையைச் சுட்டுகிறது. தமிழில் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் காட்ட பெயர்ச்சொல் மீண்டும் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐνήργηκεν
  choice: செயல்படுத்தினார்
  rationale: வல்லமை பயனுறச் செயல்பட்டதைச் சுட்டும் வினை. ‘செயல்படுத்தினார்’ என்பது இறைவன் தமது வல்லமையை ஆற்றலுடன் நிகழ்த்தினார் என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: ἐν τῷ Χριστῷ
  choice: மெசியாவில்
  rationale: Χριστός இங்கு பட்டப்பெயராகச் செயல்படுகிறது; ἐν என்பதையும் மறைக்காமல் ‘மெசியாவில்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἐγείρας αὐτὸν ἐκ νεκρῶν
  choice: அவரை இறந்தோரிடமிருந்து எழுப்பி
  rationale: உயிர்த்தெழுதல் குறித்த கிரேக்க வழக்கைத் துல்லியமாகவும் இயல்பான தமிழிலும் தருகிறது; இறந்தோர் என்பதன் பன்மையும் காக்கப்படுகிறது.
- source_word: καθίσας ἐν δεξιᾷ αὐτοῦ
  choice: தமது வலப்பக்கத்தில் அமரச் செய்தார்
  rationale: καθίζω இங்கு ஒருவரை அமர வைப்பதைக் குறிக்கிறது. ‘வலப்பக்கம்’ உயர்ந்த நிலை மற்றும் அதிகாரத்தை உணர்த்தும் மரபுத்தொடரை இயல்பாகக் காக்கிறது.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: வானுலக மண்டலங்களில்
  rationale: பெயர்ச்சொல் இல்லாமல் பயன்படுத்தப்பட்ட பன்மை அடைமொழி வானுக்குரிய உலகம் அல்லது பரப்புகளைக் குறிக்கிறது. ‘மண்டலங்கள்’ அதன் பரப்புசார் பொருளையும் பன்மையையும் வாசிக்க எளிதாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: Χριστῷ என்பதன் மொழிபெயர்ப்பு
  choice: மெசியாவில்
  alternative: கிறிஸ்துவில்
  rationale: இச்சூழலில் இது வெறும் பெயரைப்போல அல்லாமல் அபிஷேகம் செய்யப்பட்ட அரசருக்கான பட்டமாகத் தோன்றுகிறது. பழக்கமான மாற்று வடிவம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: ἐν τοῖς ἐπουρανίοις என்பதன் பரப்புசார் பொருள்
  choice: வானுலக மண்டலங்களில்
  alternative: வானுக்குரிய இடங்களில்
  rationale: இது உயர்த்தப்பட்ட மெசியா அமர்த்தப்பட்ட வானுலகப் பரப்பைக் குறிக்கிறது. கிரேக்கத்தில் வெளிப்படையான ‘இடங்கள்’ என்ற பெயர்ச்சொல் இல்லாததால், பொதுவான பரப்புசார் மொழிபெயர்ப்பு முதன்மை உரையில் வைக்கப்பட்டு இடம்சார் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் தொடர்ச்சியைத் தமிழில் தெளிவாக்க ‘அந்த வல்லமையை’ என முந்தைய கருத்து மீட்டுரைக்கப்பட்டுள்ளது; இரண்டு பங்கேற்பு வினைகளும் தொடர்ச்சியான இறைச்செயல்களாக இயல்பாக அமைக்கப்பட்டுள்ளன.
