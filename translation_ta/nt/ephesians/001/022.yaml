lexical_decisions:
- source_word: πάντα
  choice: எல்லாவற்றையும் / எல்லாவற்றிற்கும்
  rationale: இருமுறையும் வரும் நடுநிலைப் பன்மைச் சொல், குறிப்பாக மனிதர்களை மட்டும் அல்லாமல் அனைத்தையும் உள்ளடக்கிய முழுமையைக் குறிக்கிறது.
- source_word: ὑπέταξεν
  choice: கீழ்ப்படுத்தி
  rationale: ஒன்றை மற்றொன்றின் ஆளுகைக்குக் கீழ் வைப்பதைக் குறிக்கும் வினையின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: கிறிஸ்துவின் காலடிக்கு
  rationale: ஆளுகையையும் வெற்றியையும் குறிக்கும் உருவகத்தையும் சங்கீதம் 8:6 உடனான தொடர்பையும் காக்கிறது. சூழலில் சுட்டுப்பெயரின் முன்னிலை கிறிஸ்து என்பதால் தமிழில் தெளிவுக்காக அவரது பெயர் தரப்பட்டுள்ளது.
- source_word: αὐτὸν ἔδωκεν
  choice: அவரைக் கொடுத்தார்
  rationale: δίδωμι என்பதன் நேரடியான ‘கொடு’ என்ற பொருளைக் காத்து, ‘நியமித்தார்’ என்று விளக்கமாக மாற்றுவதைத் தவிர்க்கிறது.
- source_word: κεφαλὴν
  choice: தலையாக
  rationale: அதிகாரம் மற்றும் முதன்மையைக் குறிக்கும் மூலமொழியின் உருவகத்தை விளக்கவுரையாக மாற்றாமல் காக்கிறது.
- source_word: ὑπὲρ πάντα
  choice: எல்லாவற்றிற்கும் மேலான
  rationale: கிறிஸ்துவின் அனைத்துலக மேலாதிக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τῇ ἐκκλησίᾳ
  choice: திருச்சபைக்கு
  rationale: பெறுநரைக் குறிக்கும் வேற்றுமைப் பொருளை நேரடியாகக் காக்கிறது; அதே வடிவம் நன்மைக்காக என்ற பொருளையும் தரக்கூடும் என்பதால் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: கிறிஸ்துவின் தலைமைக்கும் திருச்சபைக்கும் உள்ள தொடர்பு
  choice: எல்லாவற்றிற்கும் மேலான தலையாகிய கிறிஸ்துவைத் தேவன் திருச்சபைக்குக் கொடுத்தார்.
  alternative: திருச்சபையின் நன்மைக்காகக் கிறிஸ்துவை எல்லாவற்றிற்கும் மேலான தலையாகக் கொடுத்தார்.
  rationale: κεφαλὴν ὑπὲρ πάντα என்பதை ஒன்றாக வைத்துக் கிறிஸ்துவின் உலகளாவிய மேலாதிக்கத்தை வெளிப்படுத்துகிறது; τῇ ἐκκλησίᾳ என்பது பெறுநரையோ பயனாளியையோ குறிக்கக்கூடிய தெளிவின்மையை அடிக்குறிப்பு காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தலை’ மற்றும் ‘காலடி’ என்ற மூல உருவகங்கள் காக்கப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறிகள் அவற்றின் உள்ளடக்கத்துடன் இடமாறியிருந்ததால், மூலமொழி சார்ந்த பொருத்தத்தின்படி [a] காலடி உருவகத்திற்கும் [b] திருச்சபைக்கு/திருச்சபையின் நன்மைக்காக என்ற மாற்றுக்கும் இணைக்கப்பட்டுள்ளன.
