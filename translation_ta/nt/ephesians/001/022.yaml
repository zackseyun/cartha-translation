  text: அவர் எல்லாவற்றையும் கிறிஸ்துவின் காலடிக்குக் கீழ்ப்படுத்தினார்[a]; எல்லாவற்றிற்கும் மேலான தலையாக அவரைத் திருச்சபைக்குக் கொடுத்தார்[b].
