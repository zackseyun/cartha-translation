translation:
  language: ta
  text: அது அவரின் உடல்; எல்லாவற்றையும் எல்லாவற்றிலும் நிரப்புகிறவரின் நிறைவு.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எல்லாவற்றிலும்” என்பதற்கு, சூழலைப் பொறுத்து, “அனைவரிலும்” அல்லது “அனைத்து வகைகளிலும்” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: “நிரப்புகிறவர்” என்பதற்கான கிரேக்கச் சொல், “நிரப்பப்படுகிறவர்” என்றும் புரிந்துகொள்ளப்படலாம்; ஆனால் இங்கு பெரும்பாலோர் அதைச் செய்பாட்டு பொருளிலேயே புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἥτις
  choice: அது
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட திருச்சபையைச் சுட்டுகிறது; தமிழில் இயல்பாகத் தொடரும் வகையில் பெயர்ச்சுட்டாக மொழிபெயர்க்கப்பட்டது.
- source_word: σῶμα
  choice: உடல்
  rationale: திருச்சபைக்கும் கிறிஸ்துவுக்கும் உள்ள உறவை விளக்கும் பவுலின் உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: πλήρωμα
  choice: நிறைவு
  rationale: ‘நிரப்பப்பட்ட ஒன்று’, ‘முழுமையாக்குவது’ போன்ற சாத்தியங்களைத் தீர்மானிக்காமல், மூலச்சொல்லின் செறிவையும் விளக்கத் திறந்த தன்மையையும் பாதுகாக்கிறது.
- source_word: τοῦ ... πληρουμένου
  choice: நிரப்புகிறவருடைய
  rationale: வடிவத்தில் இடை/செயப்பாட்டு வினையெச்சமாக இருந்தாலும், சூழலில் செய்பாட்டு பொருள் இயல்பானதாக உள்ளது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τὰ πάντα
  choice: எல்லாவற்றையும்
  rationale: நடுநிலைப் பன்மையின் விரிவான, அனைத்தையும் உள்ளடக்கும் பொருளைத் தருகிறது.
- source_word: ἐν πᾶσιν
  choice: எல்லாவற்றிலும்
  rationale: ‘அனைத்து விதங்களிலும்’, ‘அனைவரிலும்’ என்று குறுக்காமல், கிரேக்கத் தொடரின் சுருக்கத்தையும் உண்மையான தெளிவின்மையையும் பாதுகாக்கிறது.
theological_decisions:
- issue: πλήρωμα என்பது திருச்சபைக்கும் கிறிஸ்துவுக்கும் இடையில் குறிக்கும் உறவு
  choice: ‘நிறைவு’ எனத் திறந்த நிலையில் வைக்கப்பட்டது.
  alternative: கிறிஸ்துவால் நிரப்பப்படுவது; அல்லது கிறிஸ்துவை ஒரு வகையில் முழுமைப்படுத்தும் இணைவு
  rationale: எந்த ஓர் இறையியல் விளக்கத்தையும் உரைக்குள் திணிக்காமல், கிரேக்கத்தின் பலவகை விளக்கச் சாத்தியத்தைப் பாதுகாக்கிறது.
- issue: πληρουμένου என்பதன் வினைக்குரல்/பொருள்
  choice: ‘நிரப்புகிறவர்’ என்ற செய்பாட்டு பொருள்
  alternative: ‘நிரப்பப்படுகிறவர்’
  rationale: உடனுள்ள τὰ πάντα என்ற வேற்றுமைத் தொடருடன் செய்பாட்டு பொருள் சூழலுக்கு மிகவும் இயல்பானது; எனினும் உருவியல் அடிப்படையில் செயப்பாட்டு வாசிப்பும் சாத்தியமானதால் அது அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு மரியாதையைக் காக்கும் அதேவேளையில் பொதுவாசகருக்குப் புரியும் நடை. ‘நிறைவு’ மற்றும் ‘எல்லாவற்றிலும்’ ஆகிய சொற்கள் மூலத்தின் இறையியல் செறிவையும் தெளிவின்மையையும் பாதுகாக்கின்றன.
