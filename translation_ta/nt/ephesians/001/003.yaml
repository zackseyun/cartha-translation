  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ εὐλογήσας ἡμᾶς ἐν πάσῃ εὐλογίᾳ πνευματικῇ ἐν τοῖς ἐπουρανίοις ἐν Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], who has blessed us with every spiritual blessing in the heavenly realms in Messiah[c][b],
translation:
  language: ta
  text: நம் ஆண்டவராகிய இயேசு மேசியாவின்[a] கடவுளும் தந்தையுமானவர் போற்றப்படுவாராக! பரலோக மண்டலங்களில்[c] உள்ள ஒவ்வோர் ஆவிக்குரிய[b] ஆசீர்வாதத்தாலும் மேசியாவில்[a] நம்மை ஆசீர்வதித்தவர் அவரே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வழக்கமான மொழிபெயர்ப்பு: ‘இயேசு கிறிஸ்து’ என்றும் ‘கிறிஸ்துவில்’ என்றும். கிரேக்க Χριστός என்பது ‘மேசியா’, அதாவது ‘அபிஷேகம் செய்யப்பட்டவர்’ என்னும் பட்டமாகும்.'
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘ஆவியால் அருளப்படும் ஒவ்வோர் ஆசீர்வாதம்.’ கிரேக்கப் பெயரடை பொதுவாக ‘ஆவிக்குரிய’ என்பதையோ குறிப்பாக இறை ஆவியுடன் தொடர்புடையதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘பரலோக இடங்களில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: போற்றப்படுவாராக
  rationale: கடவுளை நோக்கிய வாழ்த்துரையும் புகழுரையுமான கிரேக்கப் பயன்பாட்டை இயல்பான, உயர்வான தமிழில் வெளிப்படுத்துகிறது; வெறும் ‘ஆசீர்வதிக்கப்பட்டவர்’ என்பதைக் காட்டிலும் இங்கு பொருத்தமானது.
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: கடவுளும் தந்தையுமானவர்
  rationale: ஒரே நபரைக் குறிக்கும் இணைந்த இரு பெயர்களையும் தமிழில் தெளிவாகத் தக்கவைக்கிறது.
- source_word: τοῦ κυρίου ἡμῶν
  choice: நம் ஆண்டவராகிய
  rationale: κύριος என்பதன் பட்டப்பெயர் வலிமையை ‘ஆண்டவர்’ காக்கிறது; தமிழ் உறவுத்தொடரில் இயல்பாக அமைகிறது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மேசியாவின்
  rationale: Ἰησοῦ என்பதைப் பெயராக ஒலிபெயர்த்தும் Χριστός என்பதைப் பட்டமான ‘மேசியா’ என்று மொழிபெயர்த்தும், இரண்டையும் உரிய வேற்றுமையுடன் இணைக்கிறது.
- source_word: ὁ εὐλογήσας ἡμᾶς
  choice: நம்மை ஆசீர்வதித்தவர் அவரே
  rationale: இறந்தகாலப் பங்கேற்புச் சொல்லின் நிறைவேறிய செயலைத் தக்கவைத்து, தமிழில் முதன்மை வாக்கியத்துடன் தெளிவாக இணைக்கிறது.
- source_word: ἐν πάσῃ εὐλογίᾳ πνευματικῇ
  choice: ஆவிக்குரிய ஒவ்வோர் ஆசீர்வாதத்தாலும்
  rationale: ἐν என்பதன் வழிமுறை அல்லது வழங்கப்பட்ட உள்ளடக்கம் சார்ந்த பொருளை ‘-ஆல்’ வழியாக இயல்பாகக் காட்டுகிறது; πάσῃ என்பதன் முழுமையை ‘ஒவ்வோர்’ தக்கவைக்கிறது.
- source_word: πνευματικῇ
  choice: ஆவிக்குரிய
  rationale: ‘ஆன்மிகமான’ என்ற பரந்த பொருளையும் ‘ஆவியுடன் தொடர்புடைய’ என்ற சாத்தியத்தையும் முற்றிலும் சுருக்காமல் வைத்திருக்கிறது.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: பரலோக மண்டலங்களில்
  rationale: எபேசியரில் காணப்படும் இந்தப் பன்மைச் சொற்றொடரை ஒரு பரலோகத் தளம் அல்லது ஆட்சிப்பரப்பு என்ற வகையில் வாசிக்கக்கூடிய தமிழில் தருகிறது.
- source_word: ἐν Χριστῷ
  choice: மேசியாவில்
  rationale: பவுலின் சுருக்கமான ‘ἐν Χριστῷ’ அமைப்பை விரிவுரையாக்காமல் தக்கவைத்து, Χριστός என்பதன் பட்டப்பொருளையும் காக்கிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: ‘இயேசு மேசியா’ மற்றும் ‘மேசியாவில்’
  alternative: ‘இயேசு கிறிஸ்து’ மற்றும் ‘கிறிஸ்துவில்’
  rationale: Χριστός இங்கு பட்டப்பெயர் சார்ந்த பொருளைக் கொண்டிருப்பதால் ‘மேசியா’ அதன் வரலாற்று மற்றும் வேதாகமப் பொருளை வெளிப்படுத்துகிறது; வழக்கமான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: πνευματικῇ என்பதன் குறிப்பு
  choice: ஆவிக்குரிய
  alternative: ஆவியால் அருளப்படும்
  rationale: இச்சொல் பொதுவாக ஆவிக்குரிய தன்மையையோ குறிப்பாக இறை ஆவியுடனான தொடர்பையோ குறிக்கலாம். மூலத்தில் உள்ள பரப்பை முதன்மை உரை காக்கிறது; குறிப்பான வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἐν τοῖς ἐπουρανίοις என்பதன் பரப்பு
  choice: பரலோக மண்டலங்களில்
  alternative: பரலோக இடங்களில்
  rationale: இது வெறும் குறிப்பிட்ட இடங்களைக் குறிக்கிறதா அல்லது பரலோகத் தளம்/மண்டலத்தைக் குறிக்கிறதா என்பதை மூலவாசகம் முழுமையாகத் தீர்மானிக்கவில்லை; முதன்மை உரை இயல்பான பரப்புப் பொருளைத் தேர்ந்தெடுக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான புகழுரை நடை பயன்படுத்தப்பட்டுள்ளது. ‘போற்றப்படுவாராக’ என்பது தொடக்க வாழ்த்துரையின் வலிமையைத் தருகிறது; ‘மேசியாவில்’ என்ற சுருக்கமான அமைப்பு பவுலின் மொழியியல் மற்றும் இறையியல் செறிவை விரிவுரையாக்காமல் காக்கிறது.
