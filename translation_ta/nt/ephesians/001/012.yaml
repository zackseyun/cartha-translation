source:
  edition: SBLGNT
  text: εἰς τὸ εἶναι ἡμᾶς εἰς ἔπαινον δόξης αὐτοῦ τοὺς προηλπικότας ἐν τῷ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/012.yaml
  text: so that we who had already hoped in Messiah might be for the praise of his glory[a][b].
translation:
  language: ta
  text: மேசியாவில் முன்பே நம்பிக்கை வைத்திருந்த நாங்கள் அவருடைய மகிமைக்கான புகழாக இருக்கும்படி[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேசியாவில் முதலில் நம்பிக்கை வைத்திருந்த நாங்கள்.”
    reason: προηλπικότας என்பதற்கு ‘முன்பே நம்பிக்கை வைத்திருந்த’ என்றும், வலுவாக ‘முதலில் நம்பிக்கை வைத்திருந்த’ என்றும் பொருள் கொள்ள வாய்ப்புள்ளது.
  - marker: b
    text: அல்லது, “நாங்கள், மேசியாவில் முன்பே நம்பிக்கை வைத்திருந்தவர்களாக, அவருடைய மகிமைக்கான புகழாக இருக்கும்படி.”
    reason: கிரேக்கத்தில் ‘முன்பே நம்பிக்கை வைத்திருந்தவர்கள்’ என்பது ‘நாங்கள்’ என்பதை விளக்கும் பங்கேற்புத் தொடராக உள்ளது; அதை இடைச்செருகலாக வாசிக்கும் சாத்தியத்தை இது காட்டுகிறது.
lexical_decisions:
- source_word: εἰς τὸ εἶναι
  choice: இருக்கும்படி
  rationale: εἰς உடன் வரும் பெயராக்கப்பட்ட வினையெச்சம் நோக்கம் அல்லது விளைவைச் சுட்டுகிறது. முந்தைய வசனத்துடன் தொடரும் தமிழ்ச் சொல்லமைப்பில் ‘இருக்கும்படி’ என்பது இயல்பாகவும் மூலத்தின் திறந்த நுணுக்கத்தைப் பாதுகாக்கும் வகையிலும் உள்ளது.
- source_word: ἡμᾶς
  choice: நாங்கள்
  rationale: கிரேக்கத்தில் இது வினையெச்சத்தின் எழுவாயாக வேற்றுமை உருபு பெற்றிருந்தாலும், தமிழில் மறுவடிவமைக்கப்பட்ட நோக்கத் தொடரின் எழுவாயாக ‘நாங்கள்’ இயல்பானது.
- source_word: εἰς ἔπαινον
  choice: புகழாக
  rationale: இந்தச் சொற்றொடர் நோக்கம் அல்லது விளைவைக் குறிக்கிறது. ‘புகழாக’ என்பது εἶναι என்பதுடன் இணைந்து, நாங்கள் அவருடைய மகிமையைப் புகழும் விளைவுக்காக இருப்பதைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: δόξης αὐτοῦ
  choice: அவருடைய மகிமைக்கு
  rationale: δόξα என்பதன் இறையியல் நிறைவைத் தளர்த்தாமல் ‘மகிமை’ எனப் பாதுகாக்கிறது; தமிழில் ‘மகிமைக்குப் புகழாக’ என்ற அமைப்பு கிரேக்க உருபுத்தொடரின் நோக்கத்தை இயல்பாக எடுத்துரைக்கிறது.
- source_word: τοὺς προηλπικότας
  choice: முன்பே நம்பிக்கை வைத்திருந்த
  rationale: முற்றுப்பெற்ற வினையெச்சம், முன்னரே தொடங்கி தொடர்ந்து பொருத்தமுடைய நம்பிக்கையைச் சுட்டுகிறது. ‘முன்பே’ என்பது கால முன்னுரிமையைத் தெரிவிக்கிறது; இவர்களே முதலில் நம்பியவர்கள் என்று முதன்மை உரையில் தீர்மானிப்பதில்லை.
- source_word: ἐν τῷ Χριστῷ
  choice: மேசியாவில்
  rationale: Χριστός இங்கு அபிஷேகம் பெற்றவர் என்ற பட்டப்பெயரின் பொருளில் உள்ளது. ‘மேசியா’ அந்தப் பட்டப்பெயரின் அர்த்தத்தைப் பாதுகாக்கிறது; ‘-வில்’ என்பது அவரை மையமாகக் கொண்ட நம்பிக்கையையும் அவருடனான உறவையும் திறந்த நிலையில் வைத்திருக்கிறது.
theological_decisions:
- issue: προηλπικότας என்பது முன்பே நம்பிக்கை வைத்திருந்தவர்களைக் குறிக்கிறதா, அல்லது முதன்முதலில் நம்பிக்கை வைத்த தனிக் குழுவைக் குறிக்கிறதா?
  choice: முன்பே நம்பிக்கை வைத்திருந்த
  alternative: மேசியாவில் முதலில் நம்பிக்கை வைத்திருந்த
  rationale: προ- கால முன்னுரிமையைத் தெளிவாகக் காட்டினாலும், அது ‘முதலில் நம்பிய குழு’ என்ற வரலாற்று வேறுபாட்டை அவசியமாக நிர்ணயிக்காது. எனவே எச்சரிக்கையான வாசகம் முதன்மை உரையில் வைக்கப்பட்டு, வலுவான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἐν τῷ Χριστῷ என்பதில் Χριστός என்பதை எவ்வாறு வழங்குவது?
  choice: மேசியாவில்
  alternative: கிறிஸ்துவில்
  rationale: இங்கு சொல் அபிஷேகம் பெற்றவர் என்ற பட்டப்பெயராகச் செயல்படுவதால் ‘மேசியா’ அதன் பொருளை வெளிப்படையாகப் பாதுகாக்கிறது; அதே நேரத்தில் ‘-வில்’ என்ற உருபு பவுலின் உறவு சார்ந்த சொல்லாட்சியைச் சுருக்கிவிடாமல் வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், திருச்சபை வழக்குக்கு மட்டும் கட்டுப்படாத ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இவ்வசனம் முந்தைய வாக்கியத்தின் தொடராக இருப்பதால், மூலத்தைப் போலவே ‘இருக்கும்படி’ என முடியும் சார்புத் தொடராக வைக்கப்பட்டுள்ளது. ‘முன்பே நம்பிக்கை வைத்திருந்த’ என்ற வரையறுக்கும் தொடர் முதன்மை உரையில் காற்புள்ளிகளின்றி அமைக்கப்பட்டுள்ளது.
