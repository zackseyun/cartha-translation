base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/017.yaml
  text: that the God of our Lord Jesus the Messiah[a], the Father of glory, may give you a spirit of wisdom and revelation in the knowledge of him[c][b],
translation:
  language: ta
  text: நம் ஆண்டவராகிய இயேசு மெசியாவின்[a] கடவுளும், மகிமையின் தந்தையுமானவர்[b], அவரை அறிந்துகொள்வதில் ஞானத்தையும் வெளிப்பாட்டையும் அளிக்கும் ஓர் ஆவியை[c] உங்களுக்குத் தந்தருளும்படி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'மரபுவழி மொழிபெயர்ப்பு: “இயேசு கிறிஸ்து.” கிரேக்கப் பட்டப்பெயரான Χριστός என்பதன் பொருள் “மெசியா.”'
    reason: lexical_alternative
  - marker: b
    text: '“மகிமைமிக்க தந்தை” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் சொல்லுக்கு சொல்: “மகிமையின் தந்தை.”'
    reason: lexical_alternative
  - marker: c
    text: “ஞானத்தையும் வெளிப்பாட்டையும் அருளும் பரிசுத்த ஆவி” என்றும் புரிந்துகொள்ளலாம். கிரேக்கச் சொல் கடவுள் அருளும் ஓர் ஆவிநிலையையோ பரிசுத்த ஆவியையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: …வேண்டும் என்று வேண்டுகிறேன்
  rationale: முந்தைய வசனத்தில் தொடங்கிய பவுலின் வேண்டுதலின் நோக்கம்/உள்ளடக்கத்தை இயல்பான தமிழில் தொடர்கிறது; தனித்த வசனமாக வாசிக்கும்போதும் பொருள் தெளிவாகிறது.
- source_word: ὁ θεὸς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: நம் ஆண்டவராகிய இயேசு மெசியாவின் கடவுள்
  rationale: உடைமைத் தொடர்பை நெருக்கமாகப் பேணுகிறது; Χριστός என்பதை மரபுவழிப் பெயராக அல்லாமல் ‘மெசியா’ என்ற பட்டமாக மொழிபெயர்க்கிறது.
- source_word: ὁ πατὴρ τῆς δόξης
  choice: மகிமையின் தந்தை
  rationale: மூலத்தின் பிறப்புவேற்றுமைத் தொடரை நேரடியாகப் பேணி, ‘மகிமைமிக்க தந்தை’ என்று அதன் பொருளை ஒரே வகையில் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: δώῃ ὑμῖν
  choice: உங்களுக்குத் தந்தருள வேண்டும்
  rationale: வேண்டுதல் சூழலில் இறைவன் தருவதைக் குறிக்கும் மரியாதையான, இயல்பான தமிழ் வடிவம்.
- source_word: πνεῦμα σοφίας καὶ ἀποκαλύψεως
  choice: ஞானமும் வெளிப்பாடும் அருளும் ஆவி
  rationale: πνεῦμα என்பது மனித உள்ளார்ந்த மனப்பாங்கையோ பரிசுத்த ஆவியையோ குறிக்கக்கூடிய தெளிவின்மையை ‘ஆவி’ பேணுகிறது; பெயர்ச்சொல்லை பெரிய எழுத்தால் வேறுபடுத்த முடியாத தமிழின் இயல்பும் இதற்கு உதவுகிறது.
- source_word: ἐν ἐπιγνώσει αὐτοῦ
  choice: அவரை அறிந்துகொள்வதில்
  rationale: ἐπίγνωσις என்பதன் உறவு சார்ந்த அறிதலை இயல்பான தமிழில் தருகிறது; ‘அவரைப் பற்றிய அறிவில்’ என்பதைக் காட்டிலும் நேரடியும் வாசிக்க எளிதுமானதும் ஆகும்.
theological_decisions:
- issue: πνεῦμα என்பது பரிசுத்த ஆவியையா, கடவுள் அருளும் உள்ளார்ந்த ஆவிநிலையையா குறிக்கிறது?
  choice: ஆவி
  alternative: பரிசுத்த ஆவி; அல்லது ஆவிநிலை/மனப்பாங்கு
  rationale: கிரேக்கத்தில் சொல்லுக்கு உருபு இல்லை; இரு புரிதல்களும் சாத்தியம். பிரதான உரை பொதுவான ‘ஆவி’ என்பதன் மூலம் தெளிவின்மையைப் பேணுகிறது; அடிக்குறிப்பு மாற்றுப் புரிதல்களைத் தெரிவிக்கிறது.
- issue: Χριστός என்பதைக் எவ்வாறு மொழிபெயர்ப்பது?
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு அது அபிஷேகம் செய்யப்பட்ட அரசர்/மீட்பர் என்ற பட்டத்தைக் குறிக்கிறது. ‘மெசியா’ அந்தப் பட்டப்பொருளை வெளிப்படையாக வைத்திருக்கிறது.
- issue: ὁ πατὴρ τῆς δόξης என்ற தொடரின் பொருள்
  choice: மகிமையின் தந்தை
  alternative: மகிமைமிக்க தந்தை
  rationale: மூலத்தின் அடர்த்தியான இறையியல் தொடரைத் தீர்த்து விடாமல் பேணுகிறது; மாற்று உரை பண்புக் குறிப்பு எனப் புரிந்துகொள்ளும் சாத்தியத்தைச் சொல்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வேதாகமத்துக்குரிய கண்ணியமும் கொண்ட நடை. ‘தந்தை’, ‘மகிமை’, ‘வெளிப்பாடு’, ‘ஆவி’ போன்ற பரவலாகப் புரியக்கூடிய சொற்கள் பயன்படுத்தப்பட்டுள்ளன; தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்பிரயோகம் தவிர்க்கப்பட்டுள்ளது.
