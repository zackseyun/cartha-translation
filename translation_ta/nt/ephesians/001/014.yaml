translation:
  language: ta
  text: அவரே நமது உரிமைப்பேற்றின் முன்பணம்[a]; உடைமையின்[b] மீட்பை நோக்கி, அவரது மகிமைக்குப் புகழாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “முன்பணம்” என்பது முழு உரிமைப்பேறும் பின்னர் கிடைக்கும் என்பதற்கு உறுதியளிக்கும் முதல் தவணையைக் குறிக்கிறது.
    reason: ἀρραβών என்ற வணிக உருவகத்தின் உறுதி மற்றும் முதல் தவணை ஆகிய இரு கூறுகளையும் விளக்குகிறது.
  - marker: b
    text: “உடைமை” என்பது பெற்றுக்கொள்ளப்பட்ட உடைமையையோ, கடவுளுக்குச் சொந்தமான மக்களையோ குறிக்கலாம்.
    reason: περιποίησις என்ற சொல்லின் உண்மையான பொருள் தெளிவின்மையை வாசகருக்குத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: ἀρραβών
  choice: முன்பணம்
  rationale: முழுமையாகப் பின்னர் வழங்கப்படவிருப்பதற்கான முதல் தவணையையும் உறுதியையும் குறிக்கும் வணிக உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: κληρονομία
  choice: உரிமைப்பேறு
  rationale: சுதந்தரித்துப் பெறும் பங்கு அல்லது உரிமை என்ற பொருளைத் தருகிறது; வெறும் பொருள்சார் ‘சொத்து’ என்று குறுக்கவில்லை.
- source_word: ἀπολύτρωσις
  choice: மீட்கப்படுதல்
  rationale: விடுதலை அல்லது விலை கொடுத்து மீட்டல் ஆகிய பின்னணிகளை உள்ளடக்கும் வழக்கமான வேதாகமச் சொல்லாட்சியைப் பேணுகிறது.
- source_word: περιποίησις
  choice: உடைமை
  rationale: இங்கு ‘பெற்றுக்கொள்ளப்பட்ட உடைமை’ அல்லது ‘சொந்தமான மக்கள்’ எனப் பொருள்படக்கூடிய கிரேக்கச் சொல்லின் தெளிவின்மையை, உரையில் யாருடைய உடைமை என்று சேர்க்காமல் பாதுகாக்கிறது.
- source_word: εἰς
  choice: நோக்கியும் … உண்டாகும்படிக்கும்
  rationale: இரு இடங்களிலும் குறிக்கோள் அல்லது இறுதி விளைவைச் சுட்டும் திசைநோக்கை வெளிப்படுத்துகிறது; ‘க்காக’ என்று ஒரே பொருளில் இறுக்கவில்லை.
theological_decisions:
- issue: περιποίησις என்பது உடைமையையா, கடவுளுக்குச் சொந்தமான மக்களையா குறிக்கிறது?
  choice: அந்த உடைமை
  alternative: கடவுளுக்குச் சொந்தமான மக்கள்
  rationale: மூலவாக்கியம் உரிமையாளரை வெளிப்படையாகக் குறிப்பிடவில்லை. ஆகவே கடவுளுடைய மக்கள் என்ற சாத்தியமான பொருளை அடிக்குறிப்பில் தெரிவித்து, முதன்மை உரையில் உள்ள பொருள் நெகிழ்வைத் தக்கவைத்துள்ளது.
- issue: தூய ஆவியானவர் தனிப்பட்டவராகக் குறிப்பிடப்படுகிறாரா?
  choice: அவரே
  alternative: அதுவே
  rationale: ὅ என்பது πνεῦμα என்பதுடன் இலக்கணப் பாலில் ஒத்திருந்தாலும், சூழலில் தூய ஆவியானவரைக் குறிக்கிறது. தமிழில் மரியாதைமிக்க ஆள்சுட்டுப் பெயர் இயல்பானது; இலக்கணப் பாலினை இயந்திரமாகப் பின்பற்றவில்லை.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. வசனம் முந்தைய வசனத்தில் குறிப்பிடப்பட்ட தூய ஆவியானவரைத் தொடர்வதால் “அவரே” எனத் தொடங்குகிறது. கிரேக்க வாக்கியத்தின் நெருக்கமான தொடரமைப்பு தமிழில் இயல்பாக அமைய, இறுதியில் “இது அமைந்துள்ளது” எனக் குறிக்கோள் உறவு வெளிப்படுத்தப்பட்டுள்ளது.
