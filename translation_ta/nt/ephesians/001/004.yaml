  naturalness: ‘நாம் அவருக்கு முன்பாக அன்பில் பரிசுத்தமானவர்களும் குற்றமற்றவர்களுமாய் இருக்கும்படி தேர்ந்தெடுத்தார்’ என்பது ஒரே வினையை மறுபடியும் பயன்படுத்துவதால் இயல்பற்றதாகவும் தேவையற்ற மீளுரையாகவும் உள்ளது. நோக்கக் கூற்றைத் தேர்ந்தெடுத்தலுக்கு முன் அமைத்தால் நவீனத் தமிழில் தெளிவாகவும் ஓட்டமாகவும் அமையும்.
