translation:
  language: ta
  text: அதுபோலவே, உலகம் உருவாக்கப்படுவதற்கு முன்பே, நாம் அவருக்கு முன்பாக அன்பில்[a] பரிசுத்தமானவர்களாகவும் குற்றமற்றவர்களாகவும் இருக்கும்படி[c] அவர் நம்மை அவருக்குள் தேர்ந்தெடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘அன்பில்’ என்ற சொற்றொடரை அடுத்த வசனத்துடன் இணைத்தும் வாசிக்கலாம்: ‘அன்பில் அவர் நம்மை முன்குறித்தார் …’'
    reason: alternative_reading
  - marker: c
    text: அல்லது, ‘நாம் … இருக்கவேண்டும் என்று.’
    reason: translation_alternative
lexical_decisions:
- source_word: καθὼς
  choice: அதுபோலவே
  rationale: முந்தைய வசனத்திலுள்ள ஆசீர்வாதக் கூற்றுடன் இவ்வசனத்தை இணைக்கும் ஒப்புமை/விளக்கத் தொடர்பை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ἐξελέξατο
  choice: தேர்ந்தெடுத்தார்
  rationale: இறைவனுடைய தேர்வைத் தெளிவாகக் கூறுகிறது; பிற்காலத் தனிப்பட்ட இறையியல் அமைப்புகளைச் சொல்லுக்குள் திணிப்பதைத் தவிர்க்கிறது.
- source_word: ἡμᾶς
  choice: நம்மை
  rationale: வினையின் நேரடிச் செயப்படுபொருளாகிய முதல் நபர் பன்மையை இயல்பாக வழங்குகிறது.
- source_word: ἐν αὐτῷ
  choice: அவருக்குள்
  rationale: கிறிஸ்துவுடனான தொடர்பைக் குறிக்கும் பவுலின் சுருக்கமான ἐν மொழிநடையை விரிவாக விளக்காமல் தக்கவைக்கிறது.
- source_word: πρὸ καταβολῆς κόσμου
  choice: உலகம் உருவாக்கப்படுவதற்கு முன்பே
  rationale: உலகத்தின் தொடக்கத்திற்கு முந்திய காலத்தைக் குறிக்கும் சொற்றொடரின் காலப் பொருளைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: εἶναι ἡμᾶς
  choice: நாம் ... இருக்கும்படி
  rationale: தேர்ந்தெடுத்ததன் நோக்கம் அல்லது விளைவைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; infinitive-இன் வெளிப்படையான எழுவாயையும் பிரதிபலிக்கிறது.
- source_word: ἁγίους
  choice: பரிசுத்தமானவர்கள்
  rationale: ஒழுக்கத் தூய்மையையும் கடவுளுக்கெனப் பிரித்துவைக்கப்பட்ட நிலையையும் உள்ளடக்கும் வழக்கமான சமமான சொல்லைத் தக்கவைக்கிறது.
- source_word: ἀμώμους
  choice: குற்றமற்றவர்கள்
  rationale: ஒழுக்கரீதியான பழியின்மையை இயல்பாகக் கூறுகிறது; ‘களங்கமற்றவர்கள்’ என்ற பலியிடல் சார்ந்த ஒலிப்பும் மாற்றாகச் சாத்தியம்.
- source_word: κατενώπιον αὐτοῦ
  choice: அவருக்கு முன்பாக
  rationale: கடவுளின் முன்னிலையிலும் பார்வையிலும் இருப்பதைக் குறிக்கும் கிரேக்கச் சொற்றொடரைச் சுருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: ἐν ἀγάπῃ
  choice: அன்பில்
  rationale: ἀγάπη என்பதன் அடிப்படைப் பொருளைத் தருவதோடு, இச்சொற்றொடர் முந்தைய கூற்றுடனா அடுத்த வசனத்துடனா இணையுமென்ற தொடரியல் ஐயத்தை அதன் இடத்தின் மூலம் தக்கவைக்கிறது.
theological_decisions:
- issue: முன்குறித்தல் சூழலில் ἐξελέξατο என்பதற்கு அளவுக்கு மீறிய கோட்பாட்டுப் பொருள் அளிக்கும் வாய்ப்பு
  choice: தேர்ந்தெடுத்தார்
  alternative: தெரிந்துகொண்டார் / நியமித்தார்
  rationale: கிரேக்கம் இறைவனுடைய தேர்வைத் தெளிவாகக் கூறுகிறது; ஆனால் குறிப்பிட்ட பிற்காலப் பிரிவுசார் கோட்பாட்டை மொழிபெயர்ப்பே தீர்மானிப்பதை ‘தேர்ந்தெடுத்தார்’ தவிர்க்கிறது.
- issue: ἐν ἀγάπῃ எந்தக் கூற்றுடன் தொடரியல் ரீதியாக இணைகிறது
  choice: வசனம் 4-ன் இறுதியில் ‘அன்பில்’ என வைத்தல்
  alternative: அடுத்த வசனத்துடன் இணைத்து, ‘அன்பில் அவர் நம்மை முன்குறித்தார்’ என வாசித்தல்
  rationale: கிரேக்கத்தில் இரு இணைப்புகளும் சாத்தியம். முதன்மை உரை மூலச் சொல் வரிசையை ஒட்டி நிற்கிறது; அடிக்குறிப்பு மாற்று இணைப்பைத் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் நீண்ட வாக்கியத் தொடர்பைத் தக்கவைத்தபடியே வாசிப்புத் தெளிவுக்காக அரைப்புள்ளி இடப்பட்டுள்ளது. நோக்கக் கூற்றின் எழுவாயைத் தெளிவாக்க ‘நாம்’ மீண்டும் சொல்லப்பட்டுள்ளது.
