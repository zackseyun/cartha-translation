- source_word: ἐχαρίτωσεν
  choice: நம்மீது அருள்கூர்ந்த
  rationale: χαριτόω என்பது χάρις என்பதோடு ஒரே சொல்வேரைப் பகிர்கிறது. ‘அருள் / அருள்கூர்ந்த’ என்ற இணைப்பு அந்தச் சொல்விளையாட்டைத் தமிழில் ஓரளவு காக்கிறது; அதேவேளை கடவுள் நம்மிடம் தயவுடன் செயல்பட்டார் என்ற பொருளையும் தருகிறது.
- source_word: ἡμᾶς
  choice: நம்மீது
  rationale: ‘அருள்கூருதல்’ என்ற தமிழ்ச் சொல்லுடன் இயல்பாக வரும் வேற்றுமை வடிவம்; கிரேக்கத்தில் இது வினையின் நேரடிச் செயப்படுபொருள்.
- source_word: ἐν τῷ ἠγαπημένῳ
  choice: தாம் அன்புகூர்ந்தவரில்
  rationale: ἐν என்பதன் அடிப்படை ‘இல்’ பொருளைக் காத்து, உறவு அல்லது செயல்படும் தளம் குறித்த உட்பொருளைத் தீர்மானித்துவிடாமல் விடுகிறது. ἠγαπημένῳ பெயராக்கப்பட்ட இறந்தகாலப் பங்கேற்புச் சொல் என்பதால், மூலத்தில் இல்லாத ‘மகன்’ என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
