source:
  edition: SBLGNT
  text: γνωρίσας ἡμῖν τὸ μυστήριον τοῦ θελήματος αὐτοῦ, κατὰ τὴν εὐδοκίαν αὐτοῦ ἣν προέθετο ἐν αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/009.yaml
  text: having made known to us the mystery of his will[a], according to his good pleasure, which he purposed in himself
translation:
  language: ta
  text: தமது திருவுளத்தின் மறைபொருளை நமக்குத் தெரியப்படுத்தி, தாம் அவருக்குள்[a] தீர்மானித்த தமது நல்விருப்பத்தின்படி,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கிறிஸ்துவுக்குள்’; சிலர் ‘அவருக்குள்’ என்பதைத் தற்சுட்டாகப் புரிந்து, ‘தமக்குள்’ என்று கொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: γνωρίσας
  choice: தெரியப்படுத்தி
  rationale: இது இறந்தகாலச் செயவெச்சமாக இருந்து, சுற்றியுள்ள நீண்ட வாக்கியத்தின் எழுவாயாகிய கடவுளின் செயலைக் குறிக்கிறது. ‘வெளிப்படுத்தி’ என்பதைக் காட்டிலும், ஒருவருக்கு ஒன்றை அறியச் செய்தல் என்ற பொருளை ‘தெரியப்படுத்தி’ நேரடியாகத் தருகிறது.
- source_word: ἡμῖν
  choice: நமக்கு
  rationale: γνωρίζω என்ற வினையின் மறைமுகச் செயப்படுபொருளை இயல்பான தமிழில் குறிக்கிறது.
- source_word: μυστήριον
  choice: மறைபொருள்
  rationale: முன்பு மறைக்கப்பட்டிருந்து இப்போது தெரியப்படுத்தப்பட்ட இறைத் திட்டம் என்ற பவுலின் பயன்பாட்டை இது காட்டுகிறது; புரிந்துகொள்ளவே முடியாத புதிர் என்ற எண்ணத்தைத் தவிர்க்கிறது.
- source_word: θέλημα
  choice: திருவுளம்
  rationale: கடவுளின் θέλημα என்பதற்கான கண்ணியமான, நவீனத் தமிழில் பரவலாகப் புரியக்கூடிய சொல். பின்னர் வரும் προέθετο என்பதிலிருந்து இதன் பொருள் வேறுபடுத்தப்படுகிறது.
- source_word: κατὰ
  choice: …படி
  rationale: ஒரு தரத்திற்கோ நோக்கத்திற்கோ இணங்க நிகழ்வதைத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: εὐδοκίαν
  choice: நல்விருப்பம்
  rationale: நல்லெண்ணம், மனமுவந்த விருப்பம், அருள்நோக்கம் ஆகிய பொருள் நிழல்களை அளவுக்கு மீறி விளக்காமல் தக்கவைக்கிறது.
- source_word: προέθετο
  choice: தீர்மானித்திருந்த
  rationale: தமக்குள் ஒரு நோக்கத்தை வகுத்தல் அல்லது முன்வைத்துக் கொள்ளுதல் என்ற நடுத்தர வினை உணர்வை இயல்பான தமிழில் தெரிவிக்கிறது. ‘முன்கூட்டியே’ என்பதைச் சேர்த்து காலப்பொருளை மிகைப்படுத்தவில்லை.
- source_word: ἐν αὐτῷ
  choice: அவருக்குள்
  rationale: கிரேக்கத்திலுள்ள ஆண்பால் ஒருமைப் பிரதிப்பெயரை வெளிப்படையாக மொழிபெயர்த்து, அதன் குறிப்பீட்டை முதன்மை உரையில் தீர்மானிக்காமல் விடுகிறது.
theological_decisions:
- issue: ἐν αὐτῷ என்பதன் குறிப்பீடு
  choice: முதன்மை உரையில் ‘அவருக்குள்’ என்று பிரதிப்பெயர் தக்கவைக்கப்படுகிறது.
  alternative: ‘கிறிஸ்துவுக்குள்’ அல்லது ‘தமக்குள்’
  rationale: சூழலில் இது கிறிஸ்துவைக் குறிக்கலாம்; சிலர் இதைக் கடவுளையே சுட்டும் தற்சுட்டுப் பொருளில் புரிந்துகொள்கிறார்கள். மூலத்தின் தெளிவின்மையை முதன்மை உரை தீர்த்துவிடாமல், மாற்றுப் புரிதல்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான நடையைக் கொண்டுள்ளது. இவ்வசனம் கிரேக்கத்தில் தொடரும் நீண்ட வாக்கியத்தின் ஒரு பகுதியாக இருப்பதால், இறுதியில் செயவெச்ச வடிவமும் காற்புள்ளியும் வைக்கப்பட்டுள்ளன. ‘திருவுளம்’ இறைச் சூழலுக்கேற்ற மரியாதைத் தொனியைத் தருகிறது; மற்ற சொற்கள் பொதுவாகப் புரியக்கூடியவையாக வைக்கப்பட்டுள்ளன.
