revisions:
- from: அவருக்குள்[a] தாம் தீர்மானித்திருந்த தமது நல்விருப்பத்தின்படி, தமது திருவுளத்தின் மறைபொருளை நமக்குத் தெரியப்படுத்தி,
  to: தமது திருவுளத்தின் மறைபொருளை நமக்குத் தெரியப்படுத்தி, தாம் அவருக்குள்[a] தீர்மானித்த தமது நல்விருப்பத்தின்படி,
  rationale: The revision removes the added pluperfect force of ‘தீர்மானித்திருந்த’ and slightly adjusts word order for natural clarity. It retains the source’s participial form, the open reference of ἐν αὐτῷ, and the footnoted alternatives.
