  text: which he lavished on us in all wisdom and insight[b][a],
translation:
  language: ta
  text: அந்தக் கிருபையை அவர் எல்லா ஞானத்தோடும் நுண்ணறிவோடும் நம்மீது தாராளமாகப் பொழிந்தார்[b][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்தக் கிருபையை அவர் நம்மை நோக்கிப் பொங்கிப் பெருகச் செய்தார்.”
    reason: lexical_alternative
  - marker: b
    text: “எல்லா ஞானத்தோடும் நுண்ணறிவோடும்” என்ற சொற்றொடர், கடவுள் தமது கிருபையைப் பொழிந்த விதத்தையோ அல்லது விசுவாசிகளுக்கு அவர் வழங்கியவற்றுடன் தொடர்புடைய ஞானத்தையும் நுண்ணறிவையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἧς
  choice: அந்தக் கிருபையை
  rationale: பெண்பால் ஒருமை உறவுப்பெயர் முந்தைய வசனத்திலுள்ள ‘அவருடைய கிருபையின் செல்வத்தை’ச் சுட்டுகிறது. தமிழில் தொடர்பை இயல்பாகவும் தெளிவாகவும் தொடர ‘அந்தக் கிருபையை’ என வழங்கப்பட்டுள்ளது.
- source_word: ἐπερίσσευσεν
  choice: தாராளமாகப் பொழிந்தார்
  rationale: περισσεύω இங்கு கிருபையை மிகுதியாக வழங்கியதைக் குறிக்கும் செயப்படுபொருள் கொண்ட பயன்பாடு. ‘தாராளமாகப் பொழிந்தார்’ என்பது நிரம்பி வழியும் அளவிலான கொடையை நவீன தமிழில் இயல்பாக உணர்த்துகிறது.
- source_word: εἰς ἡμᾶς
  choice: நம்மீது
  rationale: εἰς என்பது இங்கு அருள் பெறுவோரை நோக்கிய திசையையும் அவர்கள் மீது அது வழங்கப்பட்டதையும் குறிக்கிறது; ‘பொழிந்தார்’ என்பதுடன் ‘நம்மீது’ இயல்பாக இணைகிறது.
- source_word: ἐν πάσῃ σοφίᾳ καὶ φρονήσει
  choice: எல்லா ஞானத்தோடும் நுண்ணறிவோடும்
  rationale: ἐν என்பதன் உடனிகழ்ச்சி அல்லது கருவிப்பொருளை ‘-ஓடும்’ இயல்பாகத் தருகிறது. σοφίαக்கு ‘ஞானம்’; நடைமுறை சார்ந்த புரிந்துணர்வை வலியுறுத்தும் φρόνησιςக்கு அதிலிருந்து வேறுபட்ட ‘நுண்ணறிவு’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘எல்லா ஞானத்தோடும் நுண்ணறிவோடும்’ என்ற சொற்றொடரின் தொடர்பு
  choice: முதன்மை உரையில் அந்தச் சொற்றொடர் கடவுள் கிருபையைப் பொழிந்த விதத்தையோ, விசுவாசிகளுக்கு வழங்கப்பட்ட கிருபையுடன் தொடர்புடைய ஞானம் மற்றும் நுண்ணறிவையோ வெளிப்படையாகத் தீர்மானிக்காத வகையில் வைக்கப்பட்டுள்ளது.
  alternative: இது கடவுள் தமது ஞானத்தோடும் நுண்ணறிவோடும் கிருபையை வழங்கியதைக் குறிப்பதாகவோ, விசுவாசிகளுக்குக் கிருபையுடன் ஞானத்தையும் நுண்ணறிவையும் வழங்கியதைக் குறிப்பதாகவோ புரிந்துகொள்ளலாம்.
  rationale: கிரேக்கத் தொடரமைப்பு இரு தொடர்புகளுக்கும் இடமளிக்கிறது. ஆகவே உண்மையான பொருள் இருமை அடிக்குறிப்பில் வெளிப்படுத்தப்பட்டு எந்தத் தனிப்பட்ட இறையியல் முடிவும் உரைக்குள் திணிக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தாராளமாகப் பொழிந்தார்’ மிகுதியின் உருவகத்தை எளிதில் புரியும்படி காக்கிறது; ‘நுண்ணறிவு’ என்பது ‘ஞானம்’ என்பதுடன் தேவையற்ற மறுபடியுரைத்தலைத் தவிர்த்து φρόνησις-ன் புரிந்துணர்வு/பகுத்தறிவு நுணுக்கத்தை வெளிப்படுத்துகிறது.
