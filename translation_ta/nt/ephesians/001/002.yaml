  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b].
translation:
  language: ta
  text: நம் தந்தையாகிய கடவுளிடமிருந்தும் ஆண்டவராகிய இயேசு மெசியாவிடமிருந்தும் உங்களுக்கு அருளும் அமைதியும் உண்டாவதாக.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இயேசு கிறிஸ்து.” கிரேக்க Χριστός என்பது “மெசியா” என்ற பட்டமாகவும், சில சூழல்களில் பெயர்போன்ற “கிறிஸ்து” என்ற வடிவமாகவும் செயல்படலாம்.
    reason: alternative_reading
  - marker: b
    text: 'முந்தைய மொழிபெயர்ப்பில்: “ஆண்டவர் இயேசு கிறிஸ்து.”'
    reason: previous_rendering
lexical_decisions:
- source_word: χάρις
  choice: அருள்
  rationale: பவுலின் வாழ்த்தில் இது வழக்கமான வாழ்த்துச் சொல்லாகவும் கடவுள் வழங்கும் நன்மையைச் சுட்டும் இறையியல் சொல்லாகவும் உள்ளது. இயல்பான நவீனத் தமிழில் இரு பரிமாணங்களையும் ‘அருள்’ காக்கிறது.
- source_word: ὑμῖν
  choice: உங்களுக்கு
  rationale: வாழ்த்திலும் ஆசிமொழியிலும் வரும் இத்தரவுவேற்றுமையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἰρήνη
  choice: அமைதி
  rationale: பொதுவான சமாதானத்தையும் நலமுழுமையையும் உள்ளடக்கக்கூடிய, இன்றைய வாசகருக்கு எளிதில் புரியும் தமிழ் சொல்.
- source_word: ἀπὸ
  choice: …இடமிருந்தும்
  rationale: அருளும் அமைதியும் வரும் மூலத்தைச் சுட்டுகிறது. ஒரே கிரேக்க முன்னிடைச்சொல் இரு இணைக்கப்பட்ட மூலங்களுக்கும் பொருந்துவதால், தமிழில் தெளிவுக்காக இரண்டிலும் பின்னுருபு இடப்பட்டுள்ளது.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: நம் தந்தையாகிய கடவுள்
  rationale: πατρός என்பதை θεοῦ-க்கு இணையாக எடுத்துக்கொண்டு, கிரேக்கத்தில் இல்லாத ‘மற்றும்’ என்பதைக் கூட்டாமல் ‘God our Father’ என்ற பொருளைக் காக்கிறது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: இங்கு இயேசுவுக்குரிய மரியாதைமிக்க கிறிஸ்தியல் பட்டத்தை இயல்பாகக் குறிக்கிறது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியா
  rationale: Ἰησοῦ பெயராகவும் Χριστοῦ ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற பட்டமாகவும் வழங்கப்படுகிறது; ‘ஆகிய’ என்ற தமிழ் இணைப்பு தலைப்பின் இயல்பைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ என்பதில் Χριστοῦ-வை எவ்வாறு வழங்குவது
  choice: இயேசு மெசியா
  alternative: இயேசு கிறிஸ்து
  rationale: Χριστός இங்கு பட்டமாகப் புரிந்துகொள்ளப்பட முடிவதால் அதன் மெசியானிய பொருளை மொழிபெயர்ப்பில் வெளிப்படுத்துகிறது; பெயரைப்போல் நிலைபெற்ற ‘கிறிஸ்து’ என்ற வாசிப்பும் அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: θεοῦ πατρὸς ἡμῶν என்பதன் உறவு
  choice: நம் தந்தையாகிய கடவுள்
  alternative: நம் கடவுளும் தந்தையும்
  rationale: கிரேக்கத்தில் θεοῦ மற்றும் πατρός இடையே καί இல்லை; ஆகவே ‘கடவுள்’ மற்றும் ‘தந்தை’ என இரண்டு இணைப் பெயர்களாக்காமல், ‘தந்தை’ என்பதை ‘கடவுள்’ என்பதற்கான இணைவிளக்கமாக வழங்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான ஆசிமொழி நடை பயன்படுத்தப்பட்டுள்ளது. ‘உண்டாவதாக’ என்பது கிரேக்கத்தில் வினை வெளிப்படையாக இல்லாவிட்டாலும், வாழ்த்தின் பொருளைத் தமிழில் இயல்பாக நிறைவு செய்கிறது. ‘நம்’ என்பது எழுத்தாளரையும் வாசகர்களையும் உள்ளடக்கும் ἡμῶν-ஐச் சுருக்கமாகக் காக்கிறது.
