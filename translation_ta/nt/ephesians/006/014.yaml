translation:
  language: ta
  text: ஆகையால், உங்கள் இடுப்பை உண்மையால் இறுக்கிக் கட்டிக்கொண்டு, நீதியின்[a] மார்புக்கவசத்தை அணிந்துகொண்டு நில்லுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நேர்மையின் மார்புக்கவசம்” அல்லது “நியாயத்தின் மார்புக்கவசம்” என்றும் பொருள்கொள்ளலாம். கிரேக்கச் சொல் நீதி, நேர்மை, நியாயம் ஆகிய பொருள்களைத் தாங்கக்கூடும்.
