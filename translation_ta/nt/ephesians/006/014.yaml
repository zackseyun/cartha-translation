lexical_decisions:
- source_word: στῆτε
  choice: நில்லுங்கள்
  rationale: இது இரண்டாம் நபர் பன்மை இறந்தகால ஏவல் வடிவம்; தீர்மானமாக நிற்கும்படி அழைக்கிறது. மூலச்சொல்லில் தனியாக ‘உறுதியாக’ என்ற வினையடை இல்லாததால் எளிய கட்டளைப் பொருள் பாதுகாக்கப்படுகிறது.
- source_word: οὖν
  choice: ஆகையால்
  rationale: முந்தைய அறிவுறுத்தலிலிருந்து வரும் முடிவைச் சுட்டும் இயல்பான தமிழ் இணைப்புச்சொல்.
- source_word: περιζωσάμενοι
  choice: இறுக்கிக் கட்டிக்கொண்டு
  rationale: இடுப்பைச் சுற்றிக் கட்டும் செயலைக் குறிக்கும் நடுநிலைப் பங்கேற்புவினை. பட்டை என்ற பெயர்ச்சொல் கிரேக்கத்தில் வெளிப்படையாக இல்லாததால் அதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: τὴν ὀσφὺν ὑμῶν
  choice: உங்கள் இடுப்பை
  rationale: ὀσφύς குறிக்கும் இடுப்பு/அரைக்கட்டுப் பகுதியை நவீனத் தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: ἐν ἀληθείᾳ
  choice: உண்மையால்
  rationale: ἐν என்பதன் கருவிப் பொருளை இயல்பான தமிழில் தருகிறது; ‘உண்மை’ என்பது வெளிப்படுத்தப்பட்ட சத்தியத்தையும் உண்மைத்தன்மையையும் உள்ளடக்கக்கூடிய தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: ἐνδυσάμενοι
  choice: அணிந்துகொண்டு
  rationale: ஆடை அல்லது போர்க்கவசத்தை அணிதல் என்ற ἐνδύω வினையின் இயல்பான தமிழ் வடிவம்.
- source_word: θώρακα
  choice: மார்புக்கவசத்தை
  rationale: உடலின் மார்புப் பகுதியைப் பாதுகாக்கும் போர்க்கவசத்தைத் துல்லியமாகவும் புரியும்படியும் குறிக்கிறது.
- source_word: δικαιοσύνης
  choice: நீதியின்
  rationale: δικαιοσύνη என்பதன் அறச்சார்ந்த நேர்மை மற்றும் நியாயம் ஆகிய இரு பரிமாணங்களையும் ‘நீதி’ இயல்பான தமிழில் தாங்குகிறது; உடைமை வேற்றுமை போர்க்கவச உருவகத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: பவுலின் போர்க்கவச உருவகத்தில் δικαιοσύνη என்பதன் பொருள்
  choice: நீதி
  alternative: நேர்மை / நீதியான நிலை
  rationale: தமிழில் ‘நீதி’ என்பது righteousness மற்றும் justice ஆகியவற்றைச் சூழலுக்கேற்ப தாங்கக்கூடியது. சொல்லை ஒரு குறிப்பிட்ட இறையியல் கோட்பாட்டுக்கு மட்டும் கட்டுப்படுத்தாமல், மாற்றுப் பொருளை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
- issue: ἐν ἀληθείᾳ என்பதில் உண்மை எதைக் குறிக்கிறது
  choice: உண்மையால்
  alternative: உண்மைத்தன்மையால் / உண்மையைப் பட்டையாகக் கொண்டு
  rationale: மூலத்தின் கருவி அல்லது தொடர்புச் சார்ந்த நுணுக்கத்தையும், உண்மை மற்றும் உண்மைத்தன்மை ஆகிய இரண்டிற்கும் இடமளிக்கும் தெளிவின்மையையும் பாதுகாக்கிறது; கிரேக்கத்தில் இல்லாத ‘பட்டை’ என்பதைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, வாசிக்க எளிய நடை. கிரேக்கத்தின் பிரதான ஏவலைத் தமிழில் தொடக்கத்திலும் முடிவிலும் ‘நில்லுங்கள்’ என அமைத்தது, இடைப்பட்ட இரு பங்கேற்புவினைகளும் எவ்வாறு நிற்க வேண்டும் என்பதைக் காட்டுவதைத் தெளிவாக்குகிறது. இது சொல் மீளுரையாக இருந்தாலும் தமிழில் வாக்கிய அமைப்பை இயல்பாக்கும் இலக்கணத் தேவைக்கான மீளுரையாகும்.
