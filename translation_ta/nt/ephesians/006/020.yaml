base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/020.yaml
  text: for which I am an ambassador in chains[a], so that in it I may speak boldly[c][b], as I ought to speak.
translation:
  language: ta
  text: அதற்காக நான் சங்கிலியில் கட்டப்பட்ட தூதுவராக இருக்கிறேன்; அதில் நான் பேச வேண்டியபடி துணிவுடன் பேசுவதற்காக.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπὲρ οὗ
  choice: அதற்காகவே
  rationale: ὑπέρ இங்கு ‘அதன் பொருட்டு / அதற்காக’ என்ற பொருளைத் தருகிறது. οὗ என்பது நடுநிலை ஒருமை வடிவம்; ஆகவே முந்தைய வசனத்திலுள்ள ‘நற்செய்தியின் மறைபொருள்’ என்பதையே இயல்பாகச் சுட்டுகிறது.
- source_word: πρεσβεύω
  choice: தூதுவராகப் பணியாற்றுகிறேன்
  rationale: அதிகாரப்பூர்வமாக ஒருவரையோ ஒரு செய்தியையோ பிரதிநிதித்துவப்படுத்தும் தூதுவரின் பணியை இந்த வினை குறிக்கிறது. ‘பணியாற்றுகிறேன்’ என்பது அதன் செயற்பாட்டு வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν ἁλύσει
  choice: சங்கிலியில் கட்டப்பட்ட
  rationale: கிரேக்கத்தில் ‘ஒரு சங்கிலியில்’ என ஒருமையில் இருந்தாலும், சிறைக்காவலில் கட்டுண்டிருந்த நிலையை இயல்பாகவும் அதன் உருவகத்தைத் தக்கவைத்தும் இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἵνα
  choice: பேசும்படியாக
  rationale: ἵνα குறிக்கும் நோக்கத்தைத் தமிழில் இயல்பான நோக்கத் தொடராக வெளிப்படுத்துகிறது.
- source_word: ἐν αὐτῷ
  choice: அதைக் குறித்து
  rationale: αὐτῷ இங்கு நடுநிலை ஒருமை வடிவம். சொல்லுக்குச் சொல் ‘அதில்’ என்பது தமிழில் தெளிவற்றதாக இருக்கும்; நற்செய்தி அல்லது அதன் மறைபொருளைச் சார்ந்து பேசுவதை ‘அதைக் குறித்து’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: παρρησιάσωμαι
  choice: துணிவுடன் பேசும்படியாக
  rationale: இந்த வினை வெளிப்படையாகவும் அச்சமின்றியும் பேசுவதைக் குறிக்கிறது. சூழலில் பேச்சே கருத்தாக இருப்பதால் ‘துணிவுடன் பேச’ என்பது இயல்பான சமமான மொழியாகும்.
- source_word: ὡς δεῖ με λαλῆσαι
  choice: நான் பேச வேண்டிய விதத்தில்
  rationale: δεῖ தரும் அவசியம் அல்லது கடமை உணர்வைத் தக்கவைத்தபடி, நவீனத் தமிழில் இயல்பாக அமைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: οὗ மற்றும் αὐτῷ ஆகிய பதிலிடுபெயர்களின் சுட்டுப்பொருள்
  choice: இரண்டுமே முந்தைய வசனத்திலுள்ள நற்செய்தி அல்லது ‘நற்செய்தியின் மறைபொருள்’ என்பதைக் குறிக்கும் நடுநிலைச் சுட்டுகளாக எடுத்துக்கொள்ளப்பட்டுள்ளன.
  alternative: சிலர் இதை ஒருவரைக் குறிக்கும் விதத்தில் ‘அவருக்காக’ அல்லது ‘அவரில்’ என்று புரிந்துகொள்கிறார்கள்; அல்லது பொதுவாக நற்செய்தி அறிவிப்பைச் சுட்டுவதாகக் கொள்கிறார்கள்.
  rationale: SBLGNT வடிவவியல் படி οὗ நடுநிலை ஒருமை உரிமைவேற்றுமையிலும் αὐτῷ நடுநிலை ஒருமை நான்காம் வேற்றுமையிலும் உள்ளன. எனவே தனிப்பட்ட ஆண்பால் சுட்டை மொழிபெயர்ப்பில் புகுத்தாமல், நடுநிலைத் தொடர்பை முதன்மைப்படுத்துவது இலக்கணத்துக்கு ஏற்றது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தூதுவர்,’ ‘சங்கிலி,’ ‘துணிவுடன் பேசுதல்’ ஆகிய மூலப்படிமங்கள் தக்கவைக்கப்பட்டுள்ளன. வசனம் முந்தைய வாக்கியத்தின் நோக்கத் தொடராக இருப்பதால், இறுதியில் ‘பேசும்படியாக’ என்ற சார்புநிலை அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
