id: EPH.6.21
reference: Ephesians 6:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἵνα δὲ ⸂εἰδῆτε καὶ ὑμεῖς⸃ τὰ κατ’ ἐμέ, τί πράσσω, πάντα ⸂γνωρίσει ὑμῖν⸃ Τυχικὸς ὁ ἀγαπητὸς ἀδελφὸς καὶ πιστὸς διάκονος ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/021.yaml
  text: So that you also may know the things concerning me[a], what I am doing, Tychicus, the beloved brother and faithful minister in the Lord[b], will make everything known to you.
translation:
  language: ta
  text: நீங்களும் என்னைக் குறித்த காரியங்களையும், நான் என்ன செய்கிறேன் என்பதையும் அறிந்துகொள்ளும்படி, அன்பான சகோதரனும் ஆண்டவருக்குள் உண்மையுள்ள ஊழியனுமாகிய தீகிக்கு எல்லாவற்றையும் உங்களுக்குத் தெரிவிப்பார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஊழியன்” என்பதற்கு “பணியாளர்” என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் διάκονος சில சூழல்களில் ஒரு முறையான திருச்சபைப் பதவியான “திருத்தொண்டர்” என்பதையும் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἵνα δὲ
  choice: அறிந்துகொள்ளும்படி
  rationale: ἵνα நோக்கத்தைக் குறிக்கிறது; δέ இங்கு மென்மையான தொடர்பை அளிப்பதால் தமிழில் தனியே வலியுறுத்தாமல் இயல்பான வாக்கிய அமைப்பில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: εἰδῆτε καὶ ὑμεῖς
  choice: நீங்களும் ... அறிந்துகொள்ளும்படி
  rationale: καί உடன் வரும் வலியுறுத்தப்பட்ட ὑμεῖς, பெறுநர்களும் அறிய வேண்டும் என்ற கூடுதல் வலியுறுத்தலைக் காட்டுகிறது.
- source_word: τὰ κατ’ ἐμέ
  choice: என்னைப் பற்றிய செய்திகள்
  rationale: இந்த கிரேக்கச் சொற்றொடர் பவுலைப் பற்றிய காரியங்கள் அல்லது அவரது சூழ்நிலையைக் குறிக்கிறது. 'செய்திகள்' என்பது சூழலை அளவுக்கு மீறித் தீர்மானிக்காமல் தமிழில் இயல்பாக உள்ளது.
- source_word: τί πράσσω
  choice: நான் என்ன செய்துகொண்டிருக்கிறேன் என்பது
  rationale: πράσσω இங்கு பவுல் செய்து கொண்டிருப்பதையோ ஈடுபட்டிருப்பதையோ நேரடியாகக் குறிக்கிறது.
- source_word: πάντα γνωρίσει ὑμῖν
  choice: எல்லாவற்றையும் உங்களுக்குத் தெரிவிப்பார்
  rationale: γνωρίζω என்பது அறியச் செய்தல் அல்லது தெரிவித்தல்; தமிழில் தெளிவான, இயல்பான எதிர்கால வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: Τυχικὸς
  choice: தீகிக்கு
  rationale: பெயர் நவீனத் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: ὁ ἀγαπητὸς ἀδελφὸς
  choice: அன்புக்குரிய சகோதரன்
  rationale: ἀγαπητός-இன் அன்பும் ἀδελφός-இன் ஆண் ஒருமை உறவுமுறையும் இயல்பாகப் பாதுகாக்கப்படுகின்றன.
- source_word: πιστὸς διάκονος
  choice: உண்மையுள்ள ஊழியன்
  rationale: πιστός நம்பிக்கைக்குரிய அல்லது உண்மையுள்ள தன்மையைக் குறிக்கிறது; διάκονος இங்கு கட்டாயமாக ஒரு முறையான திருச்சபைப் பதவியைக் குறிக்காததால் செயல்பாட்டு ஊழியைக் காட்டும் பொதுச் சொல் தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: ἐν κυρίῳ
  choice: ஆண்டவருக்குள்
  rationale: பவுலின் வழக்கமான உறவு அல்லது செயல்பாட்டுத் தளத்தைக் குறிக்கும் சொற்றொடரை நெருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: தீகிக்குவைக் குறிக்கும் διάκονος என்பதன் மொழிபெயர்ப்பு
  choice: ஊழியன்
  alternative: பணியாளர்; திருத்தொண்டர்
  rationale: இச்சூழல் தீகிக்குவை நம்பிக்கைக்குரிய உடன் ஊழியராகப் பாராட்டுகிறது; முறையான திருச்சபைப் பதவி இங்கு ஐயமின்றி சுட்டப்படவில்லை. ஆகவே பதவிசார் பொருளைத் திணிக்காமல் ஊழியச் செயல்பாட்டை வெளிப்படுத்துகிறது.
- issue: ἀδελφός என்பதன் மொழிபெயர்ப்பு
  choice: சகோதரன்
  alternative: உடன்பிறந்தவர்
  rationale: இங்கு குறிப்பிடப்படுபவர் தனிப்பட்ட ஆண் உடன் ஊழியரான தீகிக்கு; எனவே ஆண்பால் ஒருமையைத் துல்லியமாகப் பாதுகாக்கிறது.
- issue: κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: ἐν κυρίῳ என்பது பவுலின் வழக்கமான கிறிஸ்துவியல் சொற்றொடர்; 'ஆண்டவர்' அதன் தலைப்புச் சிறப்பையும் உடன்படிக்கை ஒலியையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் நோக்க அமைப்பையும் தீகிக்குவைப் பற்றிய இரட்டை வருணனையையும் காத்து, தமிழுக்கேற்ற சொல் வரிசை பயன்படுத்தப்பட்டுள்ளது.
