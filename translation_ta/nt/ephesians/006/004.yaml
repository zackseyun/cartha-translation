id: EPH.6.4
reference: Ephesians 6:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ οἱ πατέρες, μὴ παροργίζετε τὰ τέκνα ὑμῶν, ἀλλὰ ἐκτρέφετε αὐτὰ ἐν παιδείᾳ καὶ νουθεσίᾳ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/004.yaml
  text: And fathers[a], do not provoke your children to anger[c][b], but bring them up in the discipline and instruction of the Lord.
translation:
  language: ta
  text: தந்தையரே, நீங்களும் உங்கள் பிள்ளைகளுக்குக் கோபமூட்டாதீர்கள்[a]. மாறாக, ஆண்டவருடைய[c] ஒழுக்கப் பயிற்சியிலும் அறிவுறுத்தலிலும்[b] அவர்களை வளர்த்தெடுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உங்கள் பிள்ளைகளை மனக்கசப்படையச் செய்யாதீர்கள்.’ கிரேக்க வினைச்சொல் கோபத்தையோ மனக்கசப்பையோ தூண்டுவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பயிற்சியிலும் புத்திமதியிலும்.’
    reason: lexical_alternative
  - marker: c
    text: ‘ஆண்டவருடைய’ என்பது அந்த ஒழுக்கப் பயிற்சியும் அறிவுறுத்தலும் ஆண்டவரிடமிருந்து வருபவை, அவருக்குரியவை, அல்லது அவரால் வழிநடத்தப்படுபவை என்பதைக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: πατέρες
  choice: தந்தையரே
  rationale: கிரேக்கப் பன்மை ஆண்பால் பெயர்ச்சொல் குறிப்பாகத் தந்தையரை அழைக்கிறது; மூலத்தின் வரம்பை விரிவுபடுத்தி ‘பெற்றோரே’ என்று மொழிபெயர்க்கவில்லை.
- source_word: παροργίζετε
  choice: கோபமூட்டாதீர்கள்
  rationale: ஒருவரிடம் கோபத்தையோ மனக்கசப்பையோ எழச் செய்தல் என்ற காரணவினைப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: τέκνα
  choice: பிள்ளைகள்
  rationale: குடும்ப உறவில் மகன்களையும் மகள்களையும் உள்ளடக்கும் இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: ἐκτρέφετε
  choice: வளர்த்தெடுங்கள்
  rationale: இங்கு வெறுமனே உணவளிப்பதை அல்ல, பிள்ளைகளைப் பேணி வளர்த்து உருவாக்குவதைச் சுட்டுகிறது.
- source_word: παιδείᾳ
  choice: ஒழுக்கப் பயிற்சி
  rationale: வளர்ப்பில் அடங்கிய உருவாக்கும் பயிற்சியையும் திருத்தத்தையும் உள்ளடக்குகிறது; வெறும் தண்டனை என்ற குறுகிய பொருளைத் தவிர்க்கிறது.
- source_word: νουθεσίᾳ
  choice: அறிவுறுத்தல்
  rationale: வாய்மொழியான வழிகாட்டுதல், எச்சரிக்கை, திருத்தும் ஆலோசனை ஆகிய பொருள் நிழல்களை இயல்பாகத் தாங்குகிறது.
- source_word: κυρίου
  choice: ஆண்டவருடைய
  rationale: உடைமை, மூலம், பண்பு அல்லது நோக்குநிலை ஆகியவற்றில் எதைக் குறிக்கிறது என்பதைத் தேவையின்றி முடிவுசெய்யாமல் கிரேக்கப் பிறப்புவேற்றுமையின் அகலத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: πατέρες என்ற அழைப்பின் வரம்பு
  choice: தந்தையரே
  alternative: பெற்றோரே
  rationale: பயன்பாடு விரிவாக இருக்கக்கூடும் என்றாலும், மூல உரை நேரடியாகத் தந்தையரையே குறிப்பிடுவதால் மொழிபெயர்ப்பு அந்தக் குறிப்பிட்ட அழைப்பைப் பாதுகாக்கிறது.
- issue: ἐν παιδείᾳ καὶ νουθεσίᾳ κυρίου என்பதில் κυρίου-வின் தொடர்பு
  choice: ஆண்டவருடைய
  alternative: ஆண்டவரிடமிருந்து வரும் / ஆண்டவரைப் பற்றிய / ஆண்டவரின்படி அமைந்த
  rationale: இந்தப் பிறப்புவேற்றுமை மூலம், உடைமை, தன்மை அல்லது நோக்குநிலையைக் குறிக்கலாம். ‘ஆண்டவருடைய’ என்பது அந்த உண்மையான பொருள் அகலத்தையும் இறையியல் அழுத்தத்தையும் திறந்தே வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நீங்களும்’ என்பது முந்தைய அறிவுறுத்தலோடு இணைக்கும் Καί-யை இயல்பாக வெளிப்படுத்துகிறது. ‘ஒழுக்கப் பயிற்சி’ என்பது παιδεία-வை வெறும் தண்டனையாகக் குறுக்காமல், உருவாக்கமும் திருத்தமும் சேர்ந்த வளர்ப்பாகக் காட்டுகிறது.
