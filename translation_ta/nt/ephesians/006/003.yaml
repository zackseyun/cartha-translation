lexical_decisions:
- source_word: ἵνα
  choice: அப்போது
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட கட்டளையோடு இணைந்துள்ள நோக்கம் அல்லது விளைவைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εὖ σοι γένηται
  choice: உனக்கு நன்மை உண்டாகும்
  rationale: ‘உனக்கு நன்றாக அமையும்படி’ என்ற கிரேக்க மொழிப்பாங்கின் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: καὶ
  choice: ;
  rationale: இரண்டு இணையான வாக்குறுதிகளையும் தமிழில் தெளிவாக இணைக்க அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது; இணைப்பின் உறவு தொடர்கிறது.
- source_word: ἔσῃ μακροχρόνιος
  choice: நீண்ட காலம் வாழ்வாய்
  rationale: சொல்லுக்கு சொல் ‘நீ நீண்ட ஆயுளுடையவனாய் இருப்பாய்’; அதன் இயல்பான தமிழ்ப் பொருள் ‘நீண்ட காலம் வாழ்வாய்’ என்பதாகும்.
- source_word: ἐπὶ τῆς γῆς
  choice: பூமியில்
  rationale: கிரேக்கச் சொற்றொடரின் பரந்த பொருளை நேரடியாகக் காக்கிறது; பத்துக் கட்டளையின் பின்னணியில் ‘நாட்டில்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: ஐந்தாம் கட்டளையின் வாக்குறுதியுடன் தொடர்புடைய ἐπὶ τῆς γῆς என்பதன் எல்லை
  choice: பூமியில்
  alternative: நாட்டில்
  rationale: இங்கு உள்ள கிரேக்க வாசகம் ஒரு குறிப்பிட்ட உடன்படிக்கை நாட்டை வெளிப்படையாகச் சுட்டவில்லை. ஆகவே அதன் பரந்த சொல்லாட்சியை முதன்மை உரை காக்கிறது; யாத்திராகமம் 20:12 மற்றும் உபாகமம் 5:16 ஆகியவற்றின் எதிரொலியான ‘நாட்டில்’ என்ற சாத்தியமும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் எளிமையான, கண்ணியமான ஒருமை நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. முந்தைய வசனத்தின் வாக்கியத் தொடர்ச்சியை உணர்த்த ‘அப்போது’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தில் உள்ள எதிர்கால வடிவங்கள் தமிழிலும் எதிர்காலமாக வைக்கப்பட்டுள்ளன.
