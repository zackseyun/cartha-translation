review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the overall exhortation, distinguishes prayer from petition, and correctly understands ἅγιοι as the whole community of believers. However, ‘ஆவியானவருக்குள்’ is not a natural Tamil equivalent for ἐν πνεύματι and introduces a spatial ‘inside’ sense. Also, the main rendering of ἐν πάσῃ προσκαρτερήσει καὶ δεήσει compresses the two explicitly coordinated Greek nouns into a single interpretation; the coordination should be retained in the text.
  naturalness: The register is modern and generally clear. Replacing ‘ஆவியானவருக்குள்’ with the idiomatic, deliberately open ‘ஆவியில்’ improves Tamil usage while preserving the Greek ambiguity. A direct coordinated rendering of perseverance and petition is also clearer than ‘வேண்டுதல் செய்வதில் ... நிலைத்திருங்கள்.’
  terminology: ‘ஜெபம்,’ ‘வேண்டுதல்,’ ‘விழிப்புடன்,’ and ‘தூய மக்கள்’ are suitable modern-standard Tamil terms. ‘தூய மக்கள்’ appropriately avoids importing a later restricted meaning of ‘saints.’ The footnote should identify the likely Holy-Spirit sense without forcing it into the main text.
  issues:
  - severity: medium
    issue: ‘ஆவியானவருக்குள்’ for ἐν πνεύματι
    rationale: In Tamil this wording is spatially marked and unnatural in this context. The Greek anarthrous phrase permits a more general reading; ‘ஆவியில்’ preserves that openness, with a note explaining that the Holy Spirit is likely intended.
  - severity: medium
    issue: The coordinated phrase ‘ἐν πάσῃ προσκαρτερήσει καὶ δεήσει’ is reduced in the main text.
    rationale: Although perseverance in petition is a possible interpretive construal, καὶ explicitly coordinates perseverance and petition. Retaining both in the main text better reflects the source and avoids making a disputed syntactic decision primary.
  revised_text: எல்லா வகையான ஜெபத்தோடும் வேண்டுதலோடும், எல்லா நேரங்களிலும் ஆவியில்[a] ஜெபித்துக்கொண்டிருங்கள். இதற்காக, இறைவனுடைய தூய மக்கள் அனைவருக்காகவும்[b] முழு விடாமுயற்சியோடும் வேண்டுதலோடும் விழிப்புடன் இருங்கள்.
