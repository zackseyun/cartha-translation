  text: with every prayer and petition, praying at all times in the Spirit, and for this very thing staying alert with all perseverance in petition for all the saints,
translation:
  language: ta
  text: எல்லா வகையான ஜெபத்தோடும் வேண்டுதலோடும், எல்லா நேரங்களிலும் ஆவியில்[a] ஜெபித்துக்கொண்டிருங்கள். இதற்காக, இறைவனுடைய தூய மக்கள் அனைவருக்காகவும்[b] முழு விடாமுயற்சியோடும் வேண்டுதலோடும் விழிப்புடன் இருங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பரிசுத்த ஆவியில்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடரைப் பொதுவான பொருளிலும் வாசிக்க முடியும்; ஆனால் இச்சூழலில் அது பரிசுத்த ஆவியானவரைக் குறிப்பதே அதிக சாத்தியம்.
    reason: alternative_reading
  - marker: b
    text: ‘தூய மக்கள்’ என்பதற்கான கிரேக்கச் சொல் சொல்லடியாக ‘தூயவர்கள்’ எனப் பொருள்படும்; இங்கு அது இறைவனை நம்புகிற மக்கள் அனைவரையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ πάσης προσευχῆς καὶ δεήσεως
  choice: எல்லா வகையான ஜெபத்தோடும் வேண்டுதலோடும்
  rationale: διά உடன் வரும் சொற்றொடர் இங்கு வழிமுறை அல்லது உடனிகழ்வைக் குறிக்கிறது. προσευχή என்பதற்கு பொதுவான ‘ஜெபம்’ என்றும், δέησις என்பதற்கு குறிப்பிட்ட கோரிக்கையைக் குறிக்கும் ‘வேண்டுதல்’ என்றும் வேறுபடுத்தப்பட்டுள்ளது. πάσης என்பதன் விரிவான பொருளை இயல்பான தமிழில் ‘எல்லா வகையான’ எனத் தருகிறது.
- source_word: προσευχόμενοι ἐν παντὶ καιρῷ
  choice: எல்லா நேரங்களிலும் … ஜெபித்துக்கொண்டிருங்கள்
  rationale: நிகழ்காலப் பங்கேற்புவினையின் தொடர்ச்சியான செயலை ‘ஜெபித்துக்கொண்டிருங்கள்’ வெளிப்படுத்துகிறது; ἐν παντὶ καιρῷ எல்லா நேரங்களையும் அல்லது எல்லா சந்தர்ப்பங்களையும் உள்ளடக்குகிறது.
- source_word: ἐν πνεύματι
  choice: ஆவியானவருக்குள்
  rationale: எபேசியர் நிருபத்தின் சூழலில் இது தூய ஆவியானவரைக் குறிப்பதே அதிக சாத்தியம். ‘-க்குள்’ என்ற வடிவம் கிரேக்க ἐν என்பதன் உறவுசார் திறந்த தன்மையைப் பாதுகாக்கிறது; ‘ஆவியால் தூண்டப்பட்டு’ போன்ற விளக்கவுரை சேர்க்கப்படவில்லை.
- source_word: εἰς αὐτό
  choice: இதற்காகவே
  rationale: இச்சொற்றொடர் முன்கூறிய ஜெபத்தைக் குறித்த நோக்கத்தையும் வலியுறுத்தலையும் காட்டுகிறது. ‘இதற்காகவே’ என்பது αὐτό-வின் வலியுறுத்தலை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ἀγρυπνοῦντες
  choice: விழிப்புடன் இருந்து
  rationale: உறங்காமல் கண்காணிக்கும் விழிப்புணர்வையும் தொடர்ந்த கவனத்தையும் குறிக்கும் சொல்லை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν πάσῃ προσκαρτερήσει καὶ δεήσει
  choice: வேண்டுதல் செய்வதில் முழு விடாமுயற்சியுடன் நிலைத்திருங்கள்
  rationale: προσκαρτέρησις நீடித்த பற்றுறுதியையும் விடாமுயற்சியையும் குறிக்கிறது. இங்கு வேண்டுதலும் விடாமுயற்சியும் நெருங்கிய ஒருங்கிணைப்பில் உள்ளதாகத் தமிழாக்கம் காட்டுகிறது; καί-ஐ இரண்டு முற்றிலும் தனித்த செயல்களாக வலுக்கட்டாயமாகப் பிரிக்கவில்லை.
- source_word: περὶ πάντων τῶν ἁγίων
  choice: இறைவனுடைய தூய மக்கள் அனைவருக்காகவும்
  rationale: ἅγιοι பவுலின் பயன்பாட்டில் இறைவனுக்கெனப் பிரித்தெடுக்கப்பட்ட விசுவாசிகள் அனைவரையும் குறிக்கிறது. ‘தூய மக்கள்’ என்பது பிற்காலத்தில் சிறப்பாக அங்கீகரிக்கப்பட்ட சிலரை மட்டும் குறிக்கும் தவறான புரிதலைத் தவிர்க்கிறது.
theological_decisions:
- issue: πνεύματι என்பதன் குறிப்பு
  choice: தூய ஆவியானவர் (‘ஆவியானவருக்குள்’)
  alternative: மனிதனுடைய ஆவி அல்லது ஆவிக்குரிய மனநிலை (‘ஆவியில்’)
  rationale: உடனடிச் சூழலில் 6:17-இல் ‘ஆவியானவரின் வாள்’ வருவதும், எபேசியரில் ஆவியானவரோடு தொடர்புடைய ஜெபம் இடம்பெறுவதும் தூய ஆவியானவரைக் குறிக்கும் வாசிப்பை ஆதரிக்கின்றன. எனினும் கிரேக்கத்தில் இங்கு சுட்டு உருபு இல்லாததால் மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἅγιοι என்பதன் பொருள்
  choice: இறைவனுடைய தூய மக்கள், அதாவது விசுவாசிகள் அனைவரும்
  alternative: பிற்காலத் திருச்சபைப் பயன்பாட்டில் தனியாக அங்கீகரிக்கப்பட்ட புனிதர்கள் மட்டும்
  rationale: பவுலின் வழக்கமான பயன்பாட்டில் ἅγιοι முழு விசுவாசக் கூட்டத்தையும் குறிக்கிறது; பின்னாளைய குறுகிய வகைப்பாட்டை இங்கு இறக்குமதி செய்யக் கூடாது.
- issue: ἐν πάσῃ προσκαρτερήσει καὶ δεήσει என்பதன் தொடரமைப்பு
  choice: வேண்டுதல் செய்வதில் முழு விடாமுயற்சி
  alternative: முழு விடாமுயற்சியோடும் வேண்டுதலோடும்
  rationale: இரு பெயர்ச்சொற்களும் தனித்தனியான இணை அம்சங்களாகவும், வேண்டுதலில் நிலைத்திருப்பதை ஒருங்கிணைந்து கூறுவதாகவும் எடுத்துக்கொள்ளலாம். பிரதான உரை இயல்பான ஒருங்கிணைந்த வாசிப்பைத் தருகிறது; நேரடியான இணை வாசிப்பு அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஜெபம்’, ‘வேண்டுதல்’, ‘விழிப்புடன்’, ‘விடாமுயற்சி’ ஆகியவை பொதுவாக அறியப்படும் சொற்கள். பிரிவுசார் சொல்லாட்சியைத் தவிர்க்க ‘பரிசுத்தவான்கள்/புனிதர்கள்’ என்பதற்குப் பதிலாக மூலத்தின் சமூகப் பொருளை வெளிப்படுத்தும் ‘இறைவனுடைய தூய மக்கள்’ பயன்படுத்தப்பட்டுள்ளது. முதல் பங்கேற்புவினை தமிழில் தொடர்ச்சியான கட்டளையாகவும், இரண்டாவது அதனுடன் இணைந்த விழிப்புச் செயலாகவும் இயல்பாக்கப்பட்டுள்ளது.
