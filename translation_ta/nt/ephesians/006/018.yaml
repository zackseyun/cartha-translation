revisions:
- from: எல்லா வகையான ஜெபத்தோடும் வேண்டுதலோடும், எல்லா நேரங்களிலும் ஆவியானவருக்குள்[a] ஜெபித்துக்கொண்டிருங்கள். இதற்காகவே விழிப்புடன் இருந்து, இறைவனுடைய தூய மக்கள் அனைவருக்காகவும்[b] வேண்டுதல் செய்வதில் முழு விடாமுயற்சியுடன் நிலைத்திருங்கள்.[c]
  to: எல்லா வகையான ஜெபத்தோடும் வேண்டுதலோடும், எல்லா நேரங்களிலும் ஆவியில்[a] ஜெபித்துக்கொண்டிருங்கள். இதற்காக, இறைவனுடைய தூய மக்கள் அனைவருக்காகவும்[b] முழு விடாமுயற்சியோடும் வேண்டுதலோடும் விழிப்புடன் இருங்கள்.
  rationale: The revision removes the unnatural spatial force of ‘ஆவியானவருக்குள்’ and leaves the referent of πνεύματι appropriately open in the text, while retaining the likely contextual interpretation in a footnote. It also restores the explicit coordination of ‘perseverance and petition’ in the main rendering, so that the alternative syntactic interpretation no longer needs a separate footnote.
  reviewer_model: gpt-5.6-terra
