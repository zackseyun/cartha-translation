  source_fidelity: மூலத்தின் எதிரிகளின் பட்டியல், πρὸς என்ற மீளும் எதிர்ப்பு உறவு, ‘இந்த இருளின் உலக ஆட்சியாளர்கள்,’ மற்றும் பரலோகத் தளத்தில் உள்ள தீய ஆவிக்குரிய சக்திகள் ஆகியவை வரைவு உரையில் நன்றாகப் பிரதிபலிக்கின்றன. இருப்பினும், ‘சதையும் இரத்தமுமானவர்களுக்கு’ என்பது தமிழில் இயல்பற்றதாக உள்ளது; கிரேக்க மரபுத்தொடரின் மனிதர்-குறிப்பை வெளிப்படையாகக் காட்டுவது பாதுகாப்பானது. மேலும் τῆς πονηρίας என்பதற்கான ‘தீமையின்’ என்ற உருபுத் தொடர்பு நேரடியானது.
  naturalness: வாக்கிய அமைப்பு பொதுவாக நவீன நிலையான தமிழுக்கு ஏற்றது. ‘சதையும் இரத்தமுமுள்ள மனிதர்கள்’ என்பது மூல உருவகத்தைத் தக்கவைத்துக்கொண்டு இயல்பான தெளிவை அளிக்கிறது. ‘அதிகாரங்களுக்கும்’ என்பது பெயர்ச்சொல்லாக உள்ள ἐξουσίας-ஐ ‘அதிகாரம் கொண்டவர்கள்’ என்பதைக் காட்டிலும் சுருக்கமாகவும் மூலத்திற்கு அண்மையாகவும் தருகிறது.
  terminology: ‘ஆட்சியாளர்கள்,’ ‘அதிகாரங்கள்,’ ‘உலக ஆட்சியாளர்கள்,’ ‘ஆவிக்குரிய சக்திகள்,’ மற்றும் ‘பரலோக மண்டலங்கள்’ ஆகியவை வேறுபட்ட கிரேக்கச் சொற்களின் வேறுபாட்டைத் தக்கவைக்கின்றன. ‘தீமையின் ஆவிக்குரிய சக்திகள்’ என்பது τὰ πνευματικὰ τῆς πονηρίας என்பதன் பொருளை அதிகப்படுத்தாமல் தருகிறது.
