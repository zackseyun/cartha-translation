reference: Ephesians 6:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι οὐκ ἔστιν ἡμῖν ἡ πάλη πρὸς αἷμα καὶ σάρκα, ἀλλὰ πρὸς τὰς ἀρχάς, πρὸς τὰς ἐξουσίας, πρὸς τοὺς κοσμοκράτορας τοῦ ⸀σκότους τούτου, πρὸς τὰ πνευματικὰ τῆς πονηρίας ἐν τοῖς ἐπουρανίοις.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/012.yaml
  text: For our struggle is not against flesh and blood[a], but against the rulers, against the authorities, against the world-rulers of this darkness[c][b], against the spiritual forces of evil in the heavenly realms.
translation:
  language: ta
  text: ஏனெனில், நமது போராட்டம் சதையும் இரத்தமுமுள்ள மனிதர்களுக்கு எதிரானது அல்ல[a]; ஆட்சியாளர்களுக்கும், அதிகாரங்களுக்கும், இந்த இருளின் உலக ஆட்சியாளர்களுக்கும்[b], பரலோக மண்டலங்களில்[c] உள்ள தீமையின் ஆவிக்குரிய சக்திகளுக்கும் எதிரானது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நமது மல்யுத்தம் சதையும் இரத்தமுமுள்ள மனிதர்களுக்கு எதிரானது அல்ல.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இந்தத் தற்போதைய இருளின் உலக ஆட்சியாளர்களுக்கு எதிராக.” ‘தற்போதைய’ என்பது பொருளை விளக்கும் சேர்க்கை; கிரேக்கத்தில் அந்தச் சொல் வெளிப்படையாக இல்லை.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “பரலோக இடங்களில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλη
  choice: போராட்டம்
  rationale: இந்தச் சொல் மல்யுத்தத்தையோ நெருக்கமான மோதலையோ குறிக்கலாம். உருவகத்தின் வலிமையைத் தக்கவைத்தபடி நவீன தமிழில் இயல்பாக இருப்பதால் ‘போராட்டம்’ தேர்ந்தெடுக்கப்பட்டது; நேரடியான ‘மல்யுத்தம்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: πρὸς αἷμα καὶ σάρκα
  choice: சதையும் இரத்தமுமானவர்களுக்கு எதிராக
  rationale: கிரேக்கத்தில் சொற்களின் வரிசை ‘இரத்தமும் சதையும்’ என்றிருந்தாலும், இது உடலுடைய மனிதர்களைக் குறிக்கும் மரபுத்தொடர். மனித எதிரிகள் குறிக்கப்படுவதைத் தமிழில் தெளிவாகவும், ‘சதை/இரத்தம்’ என்ற உருவகத்தைத் தக்கவைத்தும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: ἀρχάς
  choice: ஆட்சியாளர்கள்
  rationale: இச்சூழலில் ஆளும் அதிகாரமுள்ள சக்திகளைக் குறிக்கிறது. பழமையான அல்லது தெளிவற்ற சமயச் சொல்லுக்கு மாறாக, நவீன வாசகருக்குப் புரியும் சொல் பயன்படுத்தப்பட்டது.
- source_word: ἐξουσίας
  choice: அதிகாரம் கொண்டவர்கள்
  rationale: அதிகாரத்தையோ அதிகாரம் செலுத்தும் சக்திகளையோ குறிக்கும். ἀρχάς என்பதிலிருந்து வேறுபாடு தெரியும்படி அதிகாரத்தின் அம்சம் வெளிப்படுத்தப்பட்டது.
- source_word: κοσμοκράτορας
  choice: உலக ஆட்சியாளர்கள்
  rationale: ‘உலகம்/பிரபஞ்சத்தை ஆளுவோர்’ என்ற கூட்டுச்சொல்லின் அமைப்பை முடிந்தவரை வெளிப்படையாகத் தக்கவைக்கிறது; ‘பிரபஞ்ச சக்திகள்’ என்பது அதிக விளக்கமளிக்கும் மொழிபெயர்ப்பாகிவிடும்.
- source_word: τοῦ σκότους τούτου
  choice: இந்த இருளின்
  rationale: ‘இந்த இருளுக்குரிய’ அல்லது அதனால் பண்புபெற்ற உலக ஆட்சியாளர்கள் என்ற இயல்பான உருபுத் தொடர்பைத் தக்கவைக்கிறது. மூலத்தில் வெளிப்படையாக இல்லாத ‘தற்போதைய’ என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: τὰ πνευματικὰ τῆς πονηρίας
  choice: தீமைசார்ந்த ஆவிக்குரிய சக்திகள்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட நடுநிலைப் பன்மை அடைமொழி இங்கு ஆவிக்குரிய இருப்புகளையோ சக்திகளையோ குறிக்கிறது. ‘சக்திகள்’ என்பது குறிப்பை விளங்கச் செய்கிறது; ‘படைகள்’ என்று மொழிபெயர்த்து மூலத்தைவிட மிகுதியாக வரையறுக்கவில்லை.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: பரலோக மண்டலங்களில்
  rationale: எபேசியரில் மீண்டும் வரும் இச்சொற்றொடர் பரலோகச் சூழல் அல்லது தளத்தைக் குறிக்கிறது. ‘மண்டலங்கள்’ என்பது வெறும் குறிப்பிட்ட இடங்களாகச் சுருக்காமல், நவீன தமிழில் இயல்பாக அந்தத் தளத்தைக் காட்டுகிறது.
theological_decisions:
- issue: இவ்வசனத்தில் குறிப்பிடப்படும் எதிரிகளின் இயல்பு
  choice: மனிதர்களை மட்டுமல்லாமல், மனிதருக்கு அப்பாற்பட்ட தீய ஆவிக்குரிய சக்திகளை வசனம் நேரடியாகக் குறிப்பிடுகிறது.
  alternative: இச்சொற்கள் மனித ஆட்சியாளர்களையும் அமைப்புகளையும் முதன்மையாகக் குறிக்கலாம்; அல்லது ஆவிக்குரிய சக்திகளையும் அவற்றின் உலகியல் வெளிப்பாடுகளையும் சேர்த்துக் குறிக்கலாம்.
  rationale: κοσμοκράτορας மற்றும் τὰ πνευματικὰ τῆς πονηρίας ஆகிய சொற்களின் சேர்க்கை ஆவிக்குரிய எதிரிகளைத் தெளிவாகச் சுட்டுகிறது. ஆகவே இறுதித் தொடர் ‘தீமைசார்ந்த ஆவிக்குரிய சக்திகள்’ எனத் தரப்பட்டது; அவை உலகியல் அமைப்புகள் வழியாகச் செயல்படலாம் என்ற சாத்தியம் மறுக்கப்படவில்லை.
- issue: σάρξ என்ற சொல்லின் பொருள்
  choice: மனித உடல்சார்ந்த வாழ்வைக் குறிக்கும் மரபுத்தொடரின் ஒரு பகுதியாக ‘சதை’ என மொழிபெயர்க்கப்பட்டது.
  alternative: ‘பாவ இயல்பு’ என்று மொழிபெயர்த்தல்.
  rationale: இங்கு σάρξ என்பது பவுலின் சில வேறு இடங்களில் காணப்படும் ஒழுக்க அல்லது பாவ இயல்பைக் குறிக்கவில்லை; αἷμα உடன் சேர்ந்து மனிதர்களைக் குறிக்கிறது. எனவே ‘பாவ இயல்பு’ என்பதைச் சேர்ப்பது சூழலுக்கு ஒவ்வாது.
- issue: ἐν τοῖς ἐπουρανίοις என்பதன் தொடர்பு
  choice: அருகிலுள்ள ‘தீமைசார்ந்த ஆவிக்குரிய சக்திகள்’ என்பதோடு நேரடியாக இணைக்கப்பட்டது.
  alternative: முன்னர் பட்டியலிடப்பட்ட எல்லா ஆவிக்குரிய எதிரிகளின் இருப்புத் தளத்தையும் இச்சொற்றொடர் விரிவாகக் குறிப்பிடலாம்.
  rationale: கிரேக்கச் சொல் வரிசையில் இத்தொடர் இறுதி எதிரிக் குழுவுக்குப் பின்னர் வருகிறது. முதன்மை உரை அந்த இயல்பான தொடர்பைக் காட்டுகிறது; முழுப் பட்டியலுக்கும் பொருந்தும் வாய்ப்பை நிராகரிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ஆட்சிச் சக்திகளைக் குறிக்கும் தொடர்ச்சியான πρὸς அமைப்பு தமிழில் ‘எதிரானது’ என்ற மீளும் தொடர்பால் ஒன்றுபடுத்தப்பட்டது. ‘சதையும் இரத்தமுமானவர்கள்’ என்பது மூல உருவகத்தையும் அதன் மனிதர்களைக் குறிக்கும் பொருளையும் ஒருசேர வெளிப்படுத்துகிறது. சமய மரபில் பயன்படும் தெளிவற்ற வடிவங்களைத் தவிர்த்து, ஆவிக்குரிய எதிரிகள் என்ற குறிப்பை மட்டும் மூலத்தின் அளவுக்கே வெளிப்படுத்துகிறது.
