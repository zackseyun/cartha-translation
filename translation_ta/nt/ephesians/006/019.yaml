source:
  edition: SBLGNT
  text: καὶ ὑπὲρ ἐμοῦ, ἵνα μοι δοθῇ λόγος ἐν ἀνοίξει τοῦ στόματός μου, ἐν παρρησίᾳ γνωρίσαι τὸ μυστήριον τοῦ εὐαγγελίου
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/019.yaml
  text: and for me[a], that words may be given to me in opening my mouth, to make known with boldness the mystery of the gospel[e][d][c][b],
translation:
  language: ta
  text: 'எனக்காகவும் வேண்டிக்கொள்ளுங்கள்: நான் வாய் திறக்கும்போது, நற்செய்தியின் மறைபொருளைத் துணிவுடன் தெரியப்படுத்த எனக்கு வார்த்தைகள்[a] வழங்கப்பட வேண்டும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வார்த்தைகள்” என்பதற்கு “செய்தி” அல்லது “பேச வேண்டியது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ ἐμοῦ
  choice: எனக்காகவும் வேண்டிக்கொள்ளுங்கள்
  rationale: முந்தைய வசனத்திலிருந்து தொடரும் ஜெப வேண்டுகோளைத் தமிழில் முழுமையான, இயல்பான வாக்கியமாக வெளிப்படுத்துகிறது; ‘வேண்டிக்கொள்ளுங்கள்’ என்பது சூழலிலிருந்து நிரப்பப்பட்டது.
- source_word: δοθῇ λόγος
  choice: வார்த்தைகள் எனக்கு அருளப்பட வேண்டும்
  rationale: λόγος ஒருமையாக இருந்தாலும் இங்கு பேசுவதற்குக் கொடுக்கப்படும் சொல் அல்லது உரையைச் சுட்டுகிறது. தமிழ் வழக்கில் ‘வார்த்தைகள்’ இயல்பாக உள்ளது; தெய்வீக வழங்கலை ‘அருளப்பட’ தெளிவாகக் காட்டுகிறது.
- source_word: ἐν ἀνοίξει τοῦ στόματός μου
  choice: நான் வாய் திறந்து பேசும்போது
  rationale: மூலத்தின் உருவகத்தைப் பேணியபடி, இது பேச்சைத் தொடங்குவதைக் குறிக்கும் இயல்பான தமிழாக அமைக்கப்பட்டுள்ளது.
- source_word: ἐν παρρησίᾳ
  choice: துணிவுடன்
  rationale: வெளிப்படையாகவும் அச்சமின்றியும் பேசும் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: γνωρίσαι
  choice: தெரியப்படுத்துவதற்கு
  rationale: ‘அறியச் செய்தல்’ என்ற மூலப் பொருளை நேரடியாகத் தருகிறது; ‘பிரசங்கித்தல்’ போன்ற கூடுதல் குறிப்பைச் சேர்க்கவில்லை.
- source_word: τὸ μυστήριον τοῦ εὐαγγελίου
  choice: நற்செய்தியின் மறைபொருள்
  rationale: μυστήριον என்பது தீர்க்க முடியாத புதிரை அல்ல, முன்பு மறைக்கப்பட்டிருந்து வெளிப்படுத்தப்பட்ட தெய்வீகத் திட்டத்தைச் சுட்டுகிறது. ‘மறைபொருள்’ அந்தப் பவுலிய நுணுக்கத்தை இயல்பான தமிழில் பேணுகிறது; εὐαγγέλιον என்பதற்கு தெளிவான ‘நற்செய்தி’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: λόγος என்பதன் பொருள்
  choice: வார்த்தைகள்
  alternative: செய்தி / பேச்சாற்றல்
  rationale: மூலம் பேச்சின் உள்ளடக்கமா, சொல்ல வேண்டிய வார்த்தைகளா என்பதில் ஓரளவு விரிவை அனுமதிக்கிறது. ‘வார்த்தைகள்’ மூலத்துக்கு அண்மையாக இருந்து, விசேஷமான ஏவுதல் கோட்பாட்டை உரைக்குள் சேர்ப்பதில்லை.
- issue: παρρησία என்பதன் வலிமை
  choice: துணிவுடன்
  alternative: நம்பிக்கையுடன் / வெளிப்படையாக
  rationale: இங்கு பொது சாட்சியில் அச்சமற்ற வெளிப்படைத்தன்மை முக்கியம்; வெறும் உள்ளார்ந்த தன்னம்பிக்கையாகக் குறுக்கப்படாமல் ‘துணிவுடன்’ என்று தரப்பட்டுள்ளது.
- issue: μυστήριον என்பதன் இறையியல் நுணுக்கம்
  choice: மறைபொருள்
  alternative: இரகசியம்
  rationale: இது மனிதர்களிடமிருந்து தொடர்ந்து மறைக்கப்படும் இரகசியம் என்ற கருத்தை அல்ல, தேவனால் வெளிப்படுத்தப்படும் முன் மறைந்திருந்த திட்டத்தைச் சுட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஜெபச் சூழலைத் தெளிவாக்கும் வகையில் முந்தைய வசனத்திலிருந்து ‘வேண்டிக்கொள்ளுங்கள்’ நிரப்பப்பட்டுள்ளது. மொழிநடை மரியாதையானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமாக வைக்கப்பட்டுள்ளது.
