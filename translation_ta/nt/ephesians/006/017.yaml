  text: καὶ τὴν περικεφαλαίαν τοῦ σωτηρίου ⸀δέξασθε, καὶ τὴν μάχαιραν τοῦ πνεύματος, ὅ ἐστιν ῥῆμα θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/017.yaml
  text: And receive the helmet of salvation[a], and the sword of the Spirit, which is the word of God[b],
translation:
  language: ta
  text: மீட்பின் தலைக்கவசத்தையும்[a], ஆவியானவரின் வாளையும் பெற்றுக்கொள்ளுங்கள். அந்த வாள் கடவுளுடைய சொல்லாகும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மீட்பின் தலைக்கவசத்தை எடுத்துக்கொள்ளுங்கள்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘கடவுளுடைய உரை’ அல்லது ‘கடவுள் அறிவிக்கும் செய்தி’; கிரேக்கச் சொல் பேசப்பட்ட வார்த்தையையோ அறிவிக்கப்பட்ட செய்தியையோ வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: δέξασθε
  choice: பெற்றுக்கொள்ளுங்கள்
  rationale: இது பன்மை ஏவல் வடிவம். கொடுக்கப்படும் போர்க்கவசத்தை ஏற்றுப் பயன்படுத்தும் பொருளை ‘பெற்றுக்கொள்ளுங்கள்’ இயல்பாக வெளிப்படுத்துகிறது; ‘எடுத்துக்கொள்ளுங்கள்’ என்பதும் சாத்தியம்.
- source_word: περικεφαλαίαν
  choice: தலைக்கவசம்
  rationale: போரில் தலையைப் பாதுகாக்கும் கவசத்திற்கான நேரடியான, இன்றைய தமிழில் எளிதில் புரியும் சொல்.
- source_word: τοῦ σωτηρίου
  choice: மீட்பின்
  rationale: σωτήριος இங்கு மீட்பு அல்லது காப்பைக் குறிக்கிறது. ‘மீட்பு’ இயல்பான தமிழில் பவுலின் இறையியல் பொருளையும் கவச உருவகத்தையும் அளவுக்கு மீறி விளக்காமல் தக்கவைக்கிறது.
- source_word: μάχαιραν
  choice: வாள்
  rationale: μάχαιρα பொதுவாக வெட்டும் போராயுதத்தைக் குறிக்கிறது; அதன் துல்லியமான நீளத்தை உரை கூறாததால் ‘குறுவாள்’ என்று குறுக்காமல் ‘வாள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: τοῦ πνεύματος
  choice: ஆவியானவரின்
  rationale: இச்சூழலில் πνεῦμα தூய ஆவியானவரைக் குறிப்பதே மிக இயல்பான வாசிப்பு. கிரேக்கத்தில் உள்ள உறவுநிலைப் பொருளை மேலும் குறிப்பாக்காமல் ‘ஆவியானவரின்’ என்று வைக்கப்பட்டது.
- source_word: ὅ ἐστιν
  choice: அந்த வாள் ... ஆகும்
  rationale: கிரேக்க உறவுப்பெயரின் விளக்கத் தொடர்பைத் தெளிவான நவீனத் தமிழில் காட்ட, தனி வாக்கியமாக அமைக்கப்பட்டது.
- source_word: ῥῆμα θεοῦ
  choice: கடவுளுடைய சொல்
  rationale: ῥῆμα ஒரு சொல், உரைப்பு அல்லது அறிவிக்கப்பட்ட செய்தியைச் சுட்டலாம். ‘கடவுளுடைய சொல்’ அடிப்படைப் பொருளைத் தக்கவைக்கிறது; உரைக்கப்பட்ட செய்தி என்ற நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: τοῦ πνεύματος என்பதன் குறிப்பு
  choice: தூய ஆவியானவர்
  alternative: மனித ஆவி அல்லது பொதுவான ஆவிக்குரிய தன்மை
  rationale: கடவுளின் முழுக் கவசம் பற்றிய இச்சூழலிலும், வாள் கடவுளுடைய சொல்லுடன் அடையாளப்படுத்தப்படுவதாலும், இது தூய ஆவியானவரைக் குறிப்பதாகப் புரிவது மிக இயல்பானது. ஆயினும் மூலத்தில் இல்லாத ‘தூய’ என்ற சொல்லை முதன்மை உரையில் சேர்க்கவில்லை.
- issue: ῥῆμα θεοῦ என்பதன் நுணுக்கம்
  choice: கடவுளுடைய சொல்
  alternative: கடவுளுடைய உரைப்பு அல்லது கடவுள் அறிவிக்கும் செய்தி
  rationale: மூலச்சொல் பேசப்பட்ட உரை அல்லது செய்தியை வலியுறுத்தக்கூடும். முதன்மை உரை பரந்த பொருளைத் தக்கவைக்கிறது; சாத்தியமான நுணுக்கம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ஒரே கிரேக்க ஏவல்வினை தலைக்கவசத்தையும் வாளையும் ஆளுவதைக் காக்க இரண்டும் ஒரே வாக்கியத்தில் இணைக்கப்பட்டன; பின்னுள்ள விளக்க உறவுத்தொடர் தமிழில் தெளிவுக்காக தனி வாக்கியமாக்கப்பட்டது.
