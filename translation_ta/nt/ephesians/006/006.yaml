id: EPH.6.6
reference: Ephesians 6:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μὴ κατ’ ὀφθαλμοδουλίαν ὡς ἀνθρωπάρεσκοι ἀλλ’ ὡς ⸀δοῦλοι Χριστοῦ ποιοῦντες τὸ θέλημα τοῦ θεοῦ, ἐκ ψυχῆς
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/006.yaml
  text: not by eye-service[a], as people-pleasers, but as servants of Messiah[c][b], doing the will of God from the soul.
translation:
  language: ta
  text: மனிதர்களைப் பிரியப்படுத்துகிறவர்களைப்போல், பார்க்கப்படும்போது மட்டும் பணி செய்யாமல்[a], மெசியாவின் அடிமைகளாக[b], கடவுளின் விருப்பத்தை முழு உள்ளத்தோடு[c] நிறைவேற்றுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படி, “கண்-சேவையின்படி அல்ல”; அதாவது, ஒருவர் பார்த்துக்கொண்டிருக்கும்போது மட்டும் செய்யும் பணி அல்ல.
    reason: lexical_alternative
  - marker: b
    text: “மெசியா” என்பதற்கு மாற்றாக “கிறிஸ்து” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் Christos, “அபிஷேகம் செய்யப்பட்டவர்” என்ற பட்டத்தைக் குறிக்கிறது.
    reason: alternative_reading
  - marker: c
    text: அல்லது, “உயிரார” அல்லது “மனப்பூர்வமாக”; கிரேக்கத்தில் சொற்படி, “உயிரிலிருந்து.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀφθαλμοδουλίαν
  choice: பார்க்கப்படும்போது மட்டும் பணிசெய்தல்
  rationale: ‘கண்’ மற்றும் ‘அடிமைப்பணி’ என்பவற்றால் ஆன அரிய கிரேக்கக் கூட்டுச்சொல், மேற்பார்வையில் இருக்கும்போது மட்டும் வெளித்தோற்றத்திற்காகச் செய்யப்படும் பணியைக் குறிக்கிறது. தமிழில் சொற்படி உருவாக்கப்படும் கூட்டுச்சொல் இயல்பாக இல்லாததால், அதன் கருத்தையும் எதிர்மறைத் தாக்கத்தையும் தெளிவாக வெளிப்படுத்தும் இயல்பான சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἀνθρωπάρεσκοι
  choice: மனிதர்களைப் பிரியப்படுத்துகிறவர்கள்
  rationale: மனிதர்களின் பாராட்டைப் பெறுவதற்காக அவர்களை மகிழ்விக்க முயல்வோரைக் குறிக்கிறது; இந்தத் தமிழ் வடிவம் அதன் எதிர்மறையான ஒழுக்கப் பொருளை இயல்பாகத் தக்கவைக்கிறது.
- source_word: δοῦλοι
  choice: அடிமைகள்
  rationale: உடனடிச் சூழல் உண்மையான அடிமைகளைப் பற்றியது; மேலும் அவர்கள் மெசியாவுக்குச் சொந்தமானவர்கள் என்ற வலுவான உறவை இச்சொல் எடுத்துக்காட்டுவதால், மென்மையான ‘பணியாளர்கள்’ என்பதற்குப் பதிலாக ‘அடிமைகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: Χριστοῦ
  choice: மெசியாவின்
  rationale: Χριστός என்பது ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற அரசர்சார் பட்டம். இங்கு அவருக்குரிய சொந்தத்தையும் கீழ்ப்படிதலையும் குறிக்கும் தலைப்பாக இருப்பதால் ‘மெசியா’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ποιοῦντες
  choice: நிறைவேற்றுங்கள்
  rationale: சொற்படி ‘செய்கிறவர்களாக’ என்று வரும் பங்கேற்புவினை, முந்தைய வசனத்தின் கட்டளையைச் சார்ந்துள்ளது. தனிவசனத் தமிழில் தெளிவாக இருக்க, அந்தக் கட்டளைநடை வெளிப்படுத்தப்பட்டு ‘கடவுளின் விருப்பத்தை நிறைவேற்றுங்கள்’ என வழங்கப்பட்டது.
- source_word: θέλημα
  choice: விருப்பம்
  rationale: இந்தச் சூழலில் கடவுள் செய்யப்பட வேண்டும் என்று விரும்புவதைச் சுட்டுகிறது. ‘விருப்பம்’ நவீன தமிழில் தெளிவானது; ‘சித்தம்’ என்பதைக் காட்டிலும் பொதுவாசகருக்கு இயல்பானது.
- source_word: ἐκ ψυχῆς
  choice: முழு உள்ளத்தோடு
  rationale: சொற்படி ‘உயிரிலிருந்து/ஆத்துமாவிலிருந்து’ என்றாலும், இங்கு உள்ளார்ந்த நேர்மையுடனும் முழுமையான ஈடுபாட்டுடனும் செய்வதைக் குறிக்கிறது. ‘முழு உள்ளத்தோடு’ இயல்பான தமிழில் அந்த வலிமையைத் தருகிறது; சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: வீட்டுறவு அறிவுரையின் சூழலில் δοῦλοι என்பதன் மொழிபெயர்ப்பு
  choice: மெசியாவின் அடிமைகள்
  alternative: மெசியாவின் பணியாளர்கள்
  rationale: இந்தப் பகுதி நேரடியாக அடிமைகளிடம் பேசுகிறது; அதேவேளையில் அவர்களுடைய இறுதியான சொந்தமும் கீழ்ப்படிதலும் மெசியாவுக்குரியது என்று மறுவரையறை செய்கிறது. ஆகவே அடிமைத்தன்மையின் கடினமான வரலாற்று மற்றும் சொல்லியல் வலிமையை மென்மைப்படுத்தாமல் ‘அடிமைகள்’ எனத் தக்கவைத்தது.
- issue: Χριστοῦ என்பதைப் பட்டமாகவா பெயர்போன்ற வடிவமாகவா வழங்குவது
  choice: மெசியாவின்
  alternative: கிறிஸ்துவின்
  rationale: இங்கு அபிஷேகம் செய்யப்பட்ட ஆட்சியாளருக்குரிய கீழ்ப்படிதல் முன்னிலைப்படுவதால் பட்டப்பொருள் செயலில் உள்ளது. எனவே பொருளை வெளிப்படுத்தும் ‘மெசியா’ தேர்ந்தெடுக்கப்பட்டது.
- issue: ἐκ ψυχῆς என்பதிலுள்ள மனித இயல்பியல் சொல்லை எவ்வளவு சொற்படியாக வழங்குவது
  choice: முழு உள்ளத்தோடு
  alternative: ஆத்துமாவிலிருந்து
  rationale: சொற்படியான வடிவம் தமிழில் இயல்பற்றதாகவும் வேறொரு தத்துவப் பிரிவை வலியுறுத்துவதாகவும் தோன்றக்கூடும். சூழலில் குறிக்கப்படும் உள்ளார்ந்த, முழுமையான ஈடுபாட்டை முதன்மை உரை வழங்குகிறது; கிரேக்கச் சொற்படிவம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவான, கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. வசனம் முந்தைய வசனத்தின் வினையைச் சார்ந்த கிரேக்கத் தொடராக இருந்தாலும், தனியாக வாசிக்கத் தெளிவாக ‘நிறைவேற்றுங்கள்’ எனக் கட்டளை வெளிப்படுத்தப்பட்டுள்ளது. ‘அடிமைகள்’ என்ற கடினமான வரலாற்றுச் சொல்லும் ‘மெசியா’ என்ற பட்டப்பொருளும் மென்மைப்படுத்தப்படவில்லை; ἐκ ψυχῆς என்பதின் சொற்படிவம் இயல்பான முதன்மை உரையுடன் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
