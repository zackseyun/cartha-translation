  text: τίμα τὸν πατέρα σου καὶ τὴν μητέρα, ἥτις ἐστὶν ἐντολὴ πρώτη ἐν ἐπαγγελίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/002.yaml
  text: Honor your father and mother—which is the first commandment with a promise—[a]
translation:
  language: ta
  text: “உன் தந்தையையும் தாயையும் மதித்திடு”—இது வாக்குறுதியுடன் கூடிய முதல் கட்டளை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு இன்னும் நெருக்கமாக, “வாக்குறுதியில் முதல் கட்டளை.” இங்கு வாக்குறுதியுடன் இணைந்து வரும் முதல் கட்டளை என்பதே பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίμα
  choice: மதித்து நட
  rationale: கட்டளை வடிவிலுள்ள τιμάω வெறும் உள்ளார்ந்த மரியாதை உணர்வை மட்டுமல்லாமல், செயலில் வெளிப்படும் மதிப்பையும் குறிக்கிறது. இயல்பான நவீனத் தமிழில் இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: உன் தந்தையையும் தாயையும்
  rationale: நேரடியான குடும்ப உறவுச் சொற்களைத் துல்லியமாகவும் கண்ணியமாகவும் தருகிறது; இணைப்பின் அமைப்பையும் காக்கிறது.
- source_word: ἥτις ἐστὶν
  choice: இதுவே
  rationale: மேற்கோள் காட்டப்பட்ட கட்டளையைச் சுட்டும் தொடர்புப் பெயரின் விளக்கத் தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐντολὴ πρώτη
  choice: முதலாவது கட்டளை
  rationale: πρώτη என்பதை வரிசை எண்ணாகவே வைத்திருக்கிறது; இதை ‘முதன்மையானது’ என்று பொருள் தீர்மானித்து மொழிபெயர்ப்பதைத் தவிர்க்கிறது.
- source_word: ἐν ἐπαγγελίᾳ
  choice: வாக்குறுதியுடன் கூடிய
  rationale: சொல்லுக்கு நெருக்கமான ‘வாக்குறுதியில்’ என்பது தமிழில் தெளிவற்றதாக இருக்கும். கட்டளையோடு வாக்குறுதி இணைந்துள்ளது என்ற சூழல்சார் பொருளை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: ‘முதலாவது கட்டளை’ என்பதற்கும் பத்துக் கட்டளைகளின் வரிசைக்கும் உள்ள தொடர்பு
  choice: ‘வாக்குறுதியுடன் கூடிய முதலாவது கட்டளை’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘இரண்டாம் பலகையின் முதலாவது கட்டளை’ அல்லது ‘வாக்குறுதியுள்ள முதன்மையான கட்டளை’
  rationale: மூலமொழி ‘முதலாவது’ என்ற வரிசைப் பொருளைத் தருகிறது; ஆனால் எந்தக் கட்டளைப் பிரிவைக் குறிக்கிறது என்பதை வெளிப்படையாகக் கூறவில்லை. எனவே ஒரு குறிப்பிட்ட பத்துக் கட்டளை எண் முறையையோ ‘மிக முக்கியமானது’ என்ற விளக்கத்தையோ உரைக்குள் சேர்க்காமல், கிரேக்கத்தின் பதற்றமும் சுருக்கமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், வேதாகம மேற்கோளுக்கேற்ற கண்ணியமான நடையுடன் வடிவமைக்கப்பட்டது. ‘மதித்து நட’ என்பது கட்டளையின் செயல்முகமான வலிமையைத் தருகிறது. மேற்கோளுக்குப் பின் வரும் பவுலின் விளக்கக் குறிப்பைத் தனி வாக்கியமாக அமைத்ததால் தமிழ் வாசிப்பு இயல்பாக உள்ளது.
