  yaml_path: translation/nt/ephesians/006/010.yaml
  text: Finally[a], be strengthened in the Lord and in the strength of his might.
translation:
  language: ta
  text: இறுதியாக[a], ஆண்டவருக்குள்ளும் அவருடைய வல்லமையின் ஆற்றலிலும் வலிமைப்படுத்தப்படுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இனிமேல்.” இந்தக் கிரேக்கச் சொற்றொடர் முடிவுப் பகுதியை அறிமுகப்படுத்தலாம் அல்லது இதுமுதல் தொடரும் காலத்தைச் சுட்டலாம்.
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: Τοῦ λοιποῦ
  choice: இறுதியாக
  rationale: கடிதத்தின் முடிவுப் பகுதியை அறிமுகப்படுத்தும் இயல்பான உரைமாற்றக் குறியீடாக இங்கு வருகிறது. ‘இனிமேல்’ என்பதும் சாத்தியம்; ஆனால் சூழலில் முடிவுரைத் திருப்பத்தை ‘இறுதியாக’ தெளிவாகக் காட்டுகிறது.
- source_word: ἐνδυναμοῦσθε
  choice: வலிமைப்படுத்தப்படுங்கள்
  rationale: நிகழ்காலப் பன்மை ஏவலின் செயல்படுபொருள் நுணுக்கத்தைப் பாதுகாத்து, வாசகர்கள் தாங்களாகவே வலிமையை உருவாக்க வேண்டும் என்பதற்குப் பதிலாக வலிமையைப் பெற வேண்டும் என்பதை வெளிப்படுத்துகிறது.
- source_word: ἐν κυρίῳ
  choice: ஆண்டவருக்குள்
  rationale: ἐν என்பதின் உறவு அல்லது ஆளுகைக்குட்பட்ட நிலை சார்ந்த மொழியைத் திறந்தவாறே வைத்திருக்க ‘-க்குள்’ பயன்படுத்தப்படுகிறது. ‘ஆண்டவரால்’ என்பது கருவிக் கருத்தை அளவுக்கு மீறித் தீர்மானித்துவிடும்.
- source_word: κράτει
  choice: பேராற்றல்
  rationale: வெளிப்படும் அல்லது செயல்படும் வலிமையைக் குறிக்கும் κράτος-ஐ, ἰσχύς என்பதிலிருந்து வேறுபடுத்தியும் கிரேக்கத்தின் வலிமைச் சொற்களின் அடுக்கைத் தக்கவைத்தும் தெரிவிக்கிறது.
- source_word: ἰσχύος
  choice: வல்லமை
  rationale: உள்ளார்ந்த பலம் அல்லது ஆற்றலைக் குறிக்கும் சொல்லாக இயல்பாக இருந்து, κράτος உடனான செறிவான ‘வல்லமையின் பேராற்றல்’ என்ற அமைப்பைப் பாதுகாக்கிறது.
- source_word: αὐτοῦ
  choice: அவருடைய
  rationale: முன்னர் குறிப்பிடப்பட்ட ஆண்டவரையே இயல்பாகச் சுட்டுகிறது; பெயரை மீண்டும் விரித்துரைக்கத் தேவையில்லை.
theological_decisions:
- issue: ἐνδυναμοῦσθε என்பதில் வினைக்குரலும் வலிமையின் மூலமும்
  choice: விசுவாசிகள் ஆண்டவருக்குள் வலிமையைப் பெறுமாறு அழைக்கப்படுகிறார்கள் என்ற பெறுநிலை ஏவல்
  alternative: ‘ஆண்டவருக்குள் வலிமையாயிருங்கள்’ என்ற செய்பொருள் சார்ந்த மரபுத்தொடர்
  rationale: வினை வடிவத்தின் passive/middle நுணுக்கத்தை ‘வலிமைப்படுத்தப்படுங்கள்’ பாதுகாக்கிறது; வெறும் உள்ளார்ந்த மனவுறுதியைத் திரட்டுங்கள் என்று உரையை மாற்றாமல், வலிமைக்காக ஆண்டவரைச் சார்ந்திருப்பதை வெளிப்படுத்துகிறது.
- issue: κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: இந்தப் பவுலின் சூழலில் உயர்த்தப்பட்ட இயேசுவை இயல்பாகக் குறிக்கும் மரியாதைமிக்க, பொதுவாகப் புரியக்கூடிய தமிழ் பதம் ‘ஆண்டவர்’; உரையில் இல்லாத விளக்கத்தைச் சேர்க்கவில்லை.
- issue: ἐν என்பதன் இரண்டாம் பயன்பாடு
  choice: ‘அவருடைய வல்லமையின் பேராற்றலுக்குள்’ என்று உறவு/ஆளுகைச் சூழலைத் திறந்தவாறே வைத்தல்
  alternative: ‘அவருடைய வல்லமையான பேராற்றலால்’ என்று கருவியாக மொழிபெயர்த்தல்
  rationale: கிரேக்கத்தில் இரு இடங்களிலும் வரும் ἐν-ஐ ஒரே அடிப்படை உறவோடு தக்கவைக்கிறது; அது கருவி, ஆதாரம், அல்லது ஆளுகைக்குட்பட்ட நிலை ஆகியவற்றில் ஒன்றை மட்டும் கட்டாயப்படுத்தாமல் உண்மையான விளக்கத் திறப்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதைமிக்க பன்மை ஏவல் பயன்படுத்தப்பட்டுள்ளது. ‘வலிமைப்படுத்தப்படுங்கள்’ என்பது அன்றாடப் பேச்சைவிட சற்றுச் செறிவானது; ஆனால் கிரேக்க வினையின் பெறுநிலை நுணுக்கத்தைப் பாதுகாக்கிறது. κράτος மற்றும் ἰσχύς ஆகிய இரு வலிமைச் சொற்களின் வேறுபாட்டை ‘பேராற்றல்’ மற்றும் ‘வல்லமை’ எனத் தக்கவைத்து, மூலத்தின் செறிவையும் இறையியல் அழுத்தத்தையும் பாதுகாக்கப்பட்டுள்ளது.
