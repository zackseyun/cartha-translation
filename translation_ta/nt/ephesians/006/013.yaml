id: EPH.6.13
reference: Ephesians 6:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἀναλάβετε τὴν πανοπλίαν τοῦ θεοῦ, ἵνα δυνηθῆτε ἀντιστῆναι ἐν τῇ ἡμέρᾳ τῇ πονηρᾷ καὶ ἅπαντα κατεργασάμενοι στῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/013.yaml
  text: Therefore take up the full armor of God[a], so that you may be able to withstand in the evil day, and having done everything[d][c][b], to stand firm.
translation:
  language: ta
  text: ஆகையால், தீய நாளில்[c] எதிர்த்து நிற்கவும்[b], எல்லாவற்றையும் செய்து முடித்தபின்[d] நிலைத்து நிற்கவும் இயலும்படி, கடவுளின் முழுப் போர்க்கவசத்தையும்[a] எடுத்துக்கொள்ளுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடவுளின் முழுமையான போர்ச் சாதனங்கள்.’ கிரேக்கச் சொல் ஒரு போர்வீரனின் முழுப் போர்க் கருவிகளையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘எதிர்க்கவும்’ அல்லது ‘எதிராக நிலைகொள்ளவும்.’
    reason: lexical_alternative
  - marker: c
    text: ‘தீய நாள்’ என்பது ஒரு குறிப்பிட்ட இறுதிக்கால நிகழ்வை மட்டும் அல்லாமல், தீமை அல்லது சோதனை தீவிரமடையும் காலத்தையும் குறிக்கலாம்.
    reason: alternative_reading
  - marker: d
    text: அல்லது, ‘எல்லாவற்றையும் நிறைவேற்றியபின்’ அல்லது ‘செய்ய வேண்டிய அனைத்தையும் செய்தபின்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ஆகையால்
  rationale: முந்தைய அறிவுறுத்தலிலிருந்து வரும் முடிவைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: ἀναλάβετε
  choice: எடுத்துக்கொள்ளுங்கள்
  rationale: ஒரு போர்வீரன் தன் போர்க்கருவிகளை எடுத்துக்கொள்ளும் படிமத்தைத் தக்கவைக்கிறது; ‘அணிந்துகொள்ளுங்கள்’ என்பது வினையின் நேரடிப் பொருளைவிடக் குறுகியது.
- source_word: πανοπλίαν
  choice: முழுப் போர்க்கவசம்
  rationale: ஒரு போர்வீரனின் முழுமையான போர்ச் சாதனங்களைக் குறிக்கும் கிரேக்கச் சொல்லின் நிறைவுப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τοῦ θεοῦ
  choice: கடவுளின்
  rationale: இது கடவுளுக்குச் சொந்தமானதா, அவர் வழங்குவதா என்பதைக் குறிப்பாகத் தீர்மானிக்காமல் கிரேக்க உருபின் விரிவைத் தக்கவைக்கிறது.
- source_word: ἵνα δυνηθῆτε
  choice: இயலும்படி
  rationale: நோக்கத்தையும் அதற்கான ஆற்றலையும் இயல்பான தமிழில் ஒருங்கே வெளிப்படுத்துகிறது.
- source_word: ἀντιστῆναι
  choice: எதிர்த்து நிற்க
  rationale: எதிர்ப்பைச் சந்தித்து நிலைகொள்வது என்ற இராணுவச் சூழலுக்குரிய பொருளைத் தக்கவைக்கிறது.
- source_word: ἐν τῇ ἡμέρᾳ τῇ πονηρᾷ
  choice: தீய நாளில்
  rationale: குறிப்பிட்ட இறுதிக்கால நாளாக மட்டும் குறுக்காமல், மூலத்தின் செறிவையும் திறந்த பொருளையும் காக்கும் நேரடியான மொழிபெயர்ப்பு.
- source_word: ἅπαντα κατεργασάμενοι
  choice: எல்லாவற்றையும் செய்து முடித்தபின்
  rationale: தேவையான அனைத்தையும் செய்து நிறைவேற்றுதல் என்ற விரிவான பொருளைத் தக்கவைக்கிறது; வெற்றி பெற்றதாக உரையில் இல்லாத கருத்தைச் சேர்ப்பதில்லை.
- source_word: στῆναι
  choice: நிலைத்து நிற்க
  rationale: வெறுமனே நிற்பதைவிட, தாக்குதலுக்குப் பின்பும் தன் இடத்தை விட்டுக்கொடுக்காமல் நிற்பது என்ற சூழல்சார் வலிமையை இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: ‘தீய நாள்’ என்பதன் பொருள்
  choice: தீமை அல்லது தீவிரமான ஆன்மிகப் போராட்டம் நிறைந்த காலம் எனப் பொதுவாக விடப்பட்டுள்ளது
  alternative: குறிப்பிட்ட இறுதிக்கால நாள் அல்லது ஒருவரின் தனிப்பட்ட சோதனை நாள்
  rationale: கிரேக்கச் சொற்றொடர் ஒரு குறிப்பிட்ட இறுதிக்கால நிகழ்வை கட்டாயப்படுத்துவதில்லை; எனவே அதன் பொருள் விரிவு தீர்மானிக்கப்படாமல் காக்கப்படுகிறது.
- issue: ‘கடவுளின் போர்க்கவசம்’ என்ற உடைமை வேற்றுமையின் வலிமை
  choice: ‘கடவுளின்’ என விரிவாகவே வைக்கப்பட்டுள்ளது
  alternative: கடவுளுக்குச் சொந்தமான போர்க்கவசம் அல்லது கடவுள் வழங்கும் போர்க்கவசம்
  rationale: இரு தொடர்புப் பொருள்களுக்கும் கிரேக்க அமைப்பு இடமளிக்கிறது; அவற்றில் ஒன்றை மட்டும் மொழிபெயர்ப்பில் தேர்ந்தெடுப்பது மூலத்தை தேவையின்றிக் குறுக்கும்.
- issue: இறுதி στῆναι என்பதன் வலிமை
  choice: ‘நிலைத்து நிற்க’
  alternative: ‘நிற்க’ அல்லது ‘நின்றுகொண்டிருக்க’
  rationale: இராணுவச் சூழலில் தன் நிலையை விட்டுக்கொடுக்காமல் நிற்பதைக் காட்டுகிறது; அதே நேரத்தில் உரைக்கு அப்பாற்பட்ட வெற்றி என்ற கருத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியத்தின் நோக்கத் தொடர்பு தமிழில் தெளிவாக இருக்க வினைமுற்று இறுதியில் வைக்கப்பட்டுள்ளது; இராணுவப் படிமமும் ‘எதிர்த்து நிற்க / நிலைத்து நிற்க’ என்ற சொல்லொத்திசையும் தக்கவைக்கப்பட்டுள்ளன.
