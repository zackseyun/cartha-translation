id: EPH.6.7
reference: Ephesians 6:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μετ’ εὐνοίας δουλεύοντες, ὡς τῷ κυρίῳ καὶ οὐκ ἀνθρώποις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/007.yaml
  text: serving with goodwill[a], as to the Lord and not to men,
translation:
  language: ta
  text: நல்மனத்துடன் பணிசெய்யுங்கள்; மனிதர்களுக்குச் செய்வதுபோல் அல்ல, ஆண்டவருக்குச் செய்வதுபோல்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετ’ εὐνοίας
  choice: நல்மனத்துடன்
  rationale: μετά + genitive இங்கு செயல் நடைபெறும் மனப்பாங்கைக் குறிக்கிறது; εὔνοια என்பது நல்லெண்ணம், விருப்பமுள்ள நல்ல மனநிலை என்பவற்றைக் குறிக்கிறது. ‘நல்மனத்துடன்’ என்பது இயல்பாகவும் சுருக்கமாகவும் அந்த உட்புற மனப்பாங்கைத் தருகிறது.
- source_word: δουλεύοντες
  choice: பணிசெய்யுங்கள்
  rationale: δουλεύω அடிமையாகச் சேவை செய்வதை அடிப்படையாகக் குறித்தாலும், 6:5-இல் கேட்போரின் அடிமை நிலை ஏற்கெனவே தெளிவாக உள்ளது. இங்கு பங்கேற்புவினை கட்டளைச் சூழலில் சேவை செய்யும் செயலை வலியுறுத்துவதால், இயல்பான தமிழில் ‘பணிசெய்யுங்கள்’ என வழங்கப்பட்டது.
- source_word: ὡς
  choice: செய்வதுபோல்
  rationale: ὡς ஒப்புமையையோ செயல் முறையையோ அறிமுகப்படுத்துகிறது. தமிழில் இரு தரப்பையும் வெளிப்படையாக அமைக்கும் ‘செய்வதுபோல்’ அந்த உறவைத் தெளிவாகக் காட்டுகிறது; ‘செய்வதாக எண்ணி’ போன்ற கூடுதல் விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: τῷ κυρίῳ
  choice: ஆண்டவருக்கு
  rationale: κύριος இங்கு மனித எஜமானர்களுக்கு மாறாக உயர்ந்த ஆண்டவரைக் குறிக்கும் கிறிஸ்துவியல் பட்டமாக இயங்குகிறது. ‘ஆண்டவர்’ அந்த வேறுபாட்டையும் பட்டத்தையும் காக்கிறது.
- source_word: ἀνθρώποις
  choice: மனிதர்களுக்கு
  rationale: ἄνθρωποι இங்கு பாலினத்தை முன்னிறுத்தாமல் மனிதர்களை ஆண்டவரோடு வேறுபடுத்துகிறது. நவீனத் தமிழில் ‘மனிதர்கள்’ மூலத்தின் பொதுவான மனிதக் குறிப்பைத் துல்லியமாகத் தருகிறது.
theological_decisions:
- issue: κύριος என்பதை மனித எஜமானர்களுக்கு மாறாக எவ்வாறு வழங்குவது
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: ‘ஆண்டவர்’ தெய்வீக/கிறிஸ்துவியல் பட்டத்தைப் பாதுகாத்து, சூழலிலுள்ள உலகியலான எஜமானர்களோடு குழப்பம் ஏற்படுவதைத் தவிர்க்கிறது.
- issue: δουλεύοντες என்பதிலுள்ள அடிமைத்தன நுணுக்கத்தை எவ்வளவு வெளிப்படையாகக் காட்டுவது
  choice: பணிசெய்யுங்கள்
  alternative: அடிமைகளாகப் பணிசெய்யுங்கள்
  rationale: முந்தைய வசனத்தின் சூழல் கேட்போர் அடிமைகள் என்பதை ஏற்கெனவே தெரிவிக்கிறது. இங்கு மீண்டும் ‘அடிமைகளாக’ என்று சேர்ப்பது மூலத்தில் இல்லாத வெளிப்படுத்தலை ஏற்படுத்தும்; ‘பணிசெய்யுங்கள்’ செயல் மற்றும் மனப்பாங்கில் கவனத்தை வைக்கிறது.
- issue: ἀνθρώποις என்பதன் பாலினப் பரப்பை எவ்வாறு வழங்குவது
  choice: மனிதர்களுக்கு
  alternative: ஆண்களுக்கு
  rationale: ἄνθρωποι என்ற பன்மை இங்கு ஆண்டவருக்கு மாறான மனிதர்களை பொதுவாகக் குறிக்கிறது. ‘ஆண்கள்’ என்று வழங்குவது தேவையற்ற பாலினக் கட்டுப்பாட்டை உருவாக்கும்.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்கு புரியும் கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கப் பங்கேற்புவினை முந்தைய கட்டளையைத் தொடரும் கட்டளையாக இயல்பாக்கப்பட்டுள்ளது. ஆண்டவர்/மனிதர்கள் என்ற மூல எதிர்மறைத் தொடர்பு தெளிவாகப் பாதுகாக்கப்பட்டுள்ளது.
