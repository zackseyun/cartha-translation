revisions:
- from: நல்மனத்துடன் பணிசெய்யுங்கள்; மனிதர்களுக்குச் செய்வதுபோல் அல்ல, ஆண்டவருக்குச் செய்வதுபோல் செய்யுங்கள்.
  to: நல்மனத்துடன் பணிசெய்யுங்கள்; மனிதர்களுக்குச் செய்வதுபோல் அல்ல, ஆண்டவருக்குச் செய்வதுபோல்.
  rationale: 'The revision removes an unnecessary repeated verb while preserving the source order of thought: service is rendered with goodwill, as to the Lord and not as to human beings. No footnote is needed in Tamil, since ‘மனிதர்கள்’ already expresses the generic scope of ἀνθρώποις naturally.'
