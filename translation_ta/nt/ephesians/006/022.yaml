id: EPH.6.22
reference: Ephesians 6:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὃν ἔπεμψα πρὸς ὑμᾶς εἰς αὐτὸ τοῦτο ἵνα γνῶτε τὰ περὶ ἡμῶν καὶ παρακαλέσῃ τὰς καρδίας ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/022.yaml
  text: 'I sent him to you for this very purpose: that you may know how we are[a], and that he may encourage your hearts.'
translation:
  language: ta
  text: 'இந்த நோக்கத்திற்காகவே நான் அவனை உங்களிடம் அனுப்பினேன்: எங்களைப் பற்றிய காரியங்களை நீங்கள் அறிந்துகொள்ளவும், அவன் உங்கள் உள்ளங்களை ஊக்கப்படுத்தவும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃν ἔπεμψα πρὸς ὑμᾶς
  choice: நான் அவனை உங்களிடம் அனுப்பினேன்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட தீகிக்குவையே ஆண்பால் ஒருமை தொடர்புப்பெயர் குறிக்கிறது. தமிழில் இயல்பான வாக்கிய அமைப்புக்காகத் தொடர்புப்பெயர் தனியே மொழிபெயர்க்கப்படாமல், ‘அவனை’ எனத் தெளிவுபடுத்தப்பட்டுள்ளது; அஓரிஸ்ட் வினை எளிய இறந்தகாலமாக வழங்கப்பட்டுள்ளது.
- source_word: εἰς αὐτὸ τοῦτο
  choice: இதற்காகவே
  rationale: αὐτὸ τοῦτο தரும் வலியுறுத்தலை ‘வே’ காக்கிறது; நோக்கத்தையும் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἵνα γνῶτε τὰ περὶ ἡμῶν
  choice: எங்களைப் பற்றிய செய்திகளை நீங்கள் அறிந்துகொள்ளவும்
  rationale: τὰ περὶ ἡμῶν என்பது எங்களைச் சார்ந்த நிலை, சூழ்நிலை, செய்திகள் ஆகியவற்றை உள்ளடக்கக்கூடிய பரந்த சொற்றொடர். ‘செய்திகள்’ என்பது தமிழில் இயல்பாக இருந்து, வெளிப்புறச் சூழ்நிலைக்கு மட்டும் பொருளைச் சுருக்காது.
- source_word: παρακαλέσῃ
  choice: ஊக்கப்படுத்தவும்
  rationale: παρακαλέω என்பதற்கு ஆறுதலளித்தல், ஊக்கப்படுத்துதல், அறிவுறுத்துதல் ஆகிய பொருள்கள் உண்டு. ‘உள்ளங்கள்’ என்பதுடன் இச்சூழலில் ‘ஊக்கப்படுத்துதல்’ மேய்ப்புப் பணியின் பலப்படுத்தும் உணர்வை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὰς καρδίας ὑμῶν
  choice: உங்கள் உள்ளங்களை
  rationale: καρδία இங்கு மனிதரின் உள்நிலை, எண்ணம், மனவுறுதி ஆகியவற்றின் மையத்தைக் குறிக்கிறது. நவீன தமிழில் ‘உள்ளங்கள்’ என்பது கண்ணியமானதும் இயல்பானதும்; வெறும் உணர்ச்சிகளாக மட்டும் பொருளைக் குறுக்காது.
theological_decisions:
- issue: τὰ περὶ ἡμῶν என்பதன் பொருள் வரம்பு
  choice: ‘எங்களைப் பற்றிய செய்திகள்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘நாங்கள் எப்படி இருக்கிறோம்’ அல்லது ‘எங்கள் சூழ்நிலைகளை’
  rationale: கிரேக்கச் சொற்றொடர் தனிப்பட்ட நலநிலையையும் சூழ்நிலைகளையும் பொதுவாக எங்களைப் பற்றிய காரியங்களையும் குறிக்கலாம். முதன்மை உரை இயல்பான தமிழில் அந்தப் பரப்பைத் திறந்துவைக்கிறது; அடிக்குறிப்பு உண்மையான மாற்றுப் பொருள்களைப் பதிவு செய்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் எளிமை, கண்ணியம், வாசிப்போட்டம் ஆகியவை பேணப்பட்டுள்ளன. இரு நோக்கங்களையும் தெளிவாக இணைக்க ‘அறிந்துகொள்ளவும் … ஊக்கப்படுத்தவும்’ என்ற இணை அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
