lexical_decisions:
- source_word: ὑποδησάμενοι
  choice: செருப்பாக அணிந்துகொண்டும் இருங்கள்
  rationale: கால்களுக்குக் கீழே கட்டுதல் அல்லது காலணி அணிதல் என்ற உருவகத்தைத் தக்கவைக்கிறது. முற்பகுதியிலுள்ள பிரதான கட்டளையோடு தொடர்புடைய பங்கேற்புவினையின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τοὺς πόδας
  choice: உங்கள் கால்களில்
  rationale: மூலத்தில் உள்ள ‘கால்கள்’ என்ற உடல் உறுப்பை நேரடியாகத் தக்கவைத்து, போர்க்கவச உருவகத்தைத் தெளிவாக வைத்திருக்கிறது.
- source_word: ἐν
  choice: உங்கள் கால்களில் செருப்பாக
  rationale: இங்கு ἐν என்பது அணியும் சாதனம் அல்லது வழிமுறையைக் குறிக்கிறது; தமிழில் ‘செருப்பாக’ என்பது அந்தக் கவச உருவகத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἑτοιμασίᾳ
  choice: ஆயத்தநிலை
  rationale: ஆயத்தம் அல்லது தயார்நிலை என்ற அடிப்படைப் பொருளைத் தருகிறது; நற்செய்தியை அறிவிப்பதற்கான ஆயத்தம் அல்லது உறுதியான நிலைப்பாடு என்று முதன்மை உரையிலேயே தீர்மானிக்கவில்லை.
- source_word: εὐαγγελίου
  choice: நற்செய்தி
  rationale: εὐαγγέλιον என்பதன் பொருளை நவீனத் தமிழில் தெளிவாகவும் பவுலின் கருத்துச் செறிவைத் தக்கவைத்தும் தருகிறது.
- source_word: εἰρήνης
  choice: சமாதானத்தின்
  rationale: εἰρήνη என்பதற்கான இயல்பான இறையியல் பயன்பாட்டுச் சொல்; நற்செய்தியை விவரிக்கும் மூலமொழியின் உருபுத்தொடரைத் தக்கவைக்கிறது.
theological_decisions:
- issue: ἐν ἑτοιμασίᾳ τοῦ εὐαγγελίου τῆς εἰρήνης என்ற சொற்றொடரின் பொருள்
  choice: சமாதானத்தின் நற்செய்திக்குரிய ஆயத்தநிலையால் கால்கள் செருப்பணிவிக்கப்பட்டிருத்தல்
  alternative: சமாதானத்தின் நற்செய்தியை அறிவிக்க ஆயத்தமாக இருத்தல்; அல்லது சமாதானத்தின் நற்செய்தி தரும் உறுதியான காலூன்றலைப் பெற்றிருத்தல்
  rationale: கிரேக்கச் சொற்றொடர் சுருக்கமானது; ஆயத்தநிலை நற்செய்தியை அறிவிப்பதைக் குறிக்கிறதா, நற்செய்தியால் உண்டாகிறதா, அல்லது அது தரும் உறுதியான நிலைப்பாட்டைக் குறிக்கிறதா என்பது வெளிப்படையாகத் தீர்மானிக்கப்படவில்லை. எனவே முதன்மை உரை ‘நற்செய்திக்குரிய ஆயத்தநிலை’ என்று அந்தத் தெளிவின்மையைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘செருப்பாக அணிதல்’ என்பது போர்க்கவசத்தில் காலணி அணியும் உருவகத்தை எளிதில் புரியுமாறு காட்டுகிறது. வசனம் முந்தைய ‘நில்லுங்கள்’ என்ற கட்டளையைச் சார்ந்திருந்தாலும், தமிழில் தனியாகவும் புரியும்படி ‘இருங்கள்’ சேர்க்கப்பட்டுள்ளது.
