source:
  edition: SBLGNT
  text: εἰδότες ὅτι ⸂ἕκαστος, ὃ ἂν⸃ ποιήσῃ ἀγαθόν, τοῦτο ⸀κομίσεται ⸀παρὰ κυρίου, εἴτε δοῦλος εἴτε ἐλεύθερος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/008.yaml
  text: knowing that each one[a], whatever good he does, this he will receive back from the Lord[b], whether servant or free.
translation:
  language: ta
  text: ஒவ்வொருவரும் தாம் செய்யும் எந்த நன்மையான செயலையும், அதற்குரியதை ஆண்டவரிடமிருந்து திரும்பப் பெறுவார்[a] என்பதை அறிந்தவர்களாய், அடிமையாயிருந்தாலும் சுதந்திரமானவராயிருந்தாலும் சரி.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த நன்மையான செயலுக்குரியதை ஆண்டவரிடமிருந்து பெறுவார்.” கிரேக்க வினைச்சொல், ஒருவர் செய்த செயலுக்கு ஒத்தது அவருக்குத் திரும்பக் கிடைப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, சமூக நிலையில் அடிமையாக இருந்தாலும் அடிமையல்லாத சுதந்திரமானவராக இருந்தாலும்.
    reason: lexical_clarification
lexical_decisions:
- source_word: εἰδότες
  choice: அறிந்தவர்களாய்
  rationale: இது வினையெச்ச வடிவில் முந்தைய அறிவுறுத்தலோடு இணைகிறது. வெளிப்படையான காரணச் சொல்லைச் சேர்க்காமல் அந்தத் தொடர்பைத் தக்கவைக்கிறது.
- source_word: ἕκαστος
  choice: ஒவ்வொருவரும்
  rationale: ஒவ்வொரு தனிநபரையும் தனித்தனியாக வலியுறுத்தும் பகிர்மானப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ὃ ἂν ποιήσῃ ἀγαθόν
  choice: தான் எந்த நன்மையைச் செய்தாலும்
  rationale: ἄν உடன் வரும் தொடர்புச் சொற்றொடரின் வரையறையற்ற ‘எந்த ... ஆனாலும்’ என்ற பொருளையும், செயலின் நன்மைத் தன்மையையும் பாதுகாக்கிறது.
- source_word: τοῦτο
  choice: அதையே
  rationale: முன்னர் கூறப்பட்ட நற்செயலையே சுட்டுகிறது; ‘-ஏ’ அதன் நேரடியான ஒத்திசைவைத் தெளிவுபடுத்துகிறது.
- source_word: κομίσεται
  choice: திரும்பப் பெறுவார்
  rationale: ஒருவரின் செயலுக்கேற்ப அவருக்குத் திரும்பக் கிடைப்பது என்ற பொருளைத் தருகிறது; வணிகரீதியான ‘கூலி கொடுக்கப்படும்’ என்ற மிகை விளக்கத்தைத் தவிர்க்கிறது.
- source_word: παρὰ κυρίου
  choice: ஆண்டவரிடமிருந்து
  rationale: παρά + genitive காட்டும் மூலத்தை ‘இடமிருந்து’ எனத் தருகிறது; κύριος என்பதின் தெய்வீக மற்றும் கிறிஸ்துவைக் குறிக்கும் நிறையை ‘ஆண்டவர்’ பாதுகாக்கிறது.
- source_word: δοῦλος
  choice: அடிமை
  rationale: ἐλεύθερος என்பதற்கு எதிராக இங்கு சமூக அடிமைநிலை வெளிப்படையாகக் குறிக்கப்படுவதால், மென்மைப்படுத்தாமல் ‘அடிமை’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: ἐλεύθερος
  choice: சுதந்திரமானவர்
  rationale: அடிமைநிலைக்கு எதிரான சுதந்திர சமூகநிலையை இயல்பாகவும் பாலினப் பொதுமையுடனும் குறிக்கிறது.
theological_decisions:
- issue: குடும்ப ஒழுங்கு பற்றிய சூழலில் δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: அடிமை
  alternative: வேலைக்காரர் / பணியாளர்
  rationale: δοῦλος–ἐλεύθερος என்ற நேரடி எதிரிணை அடிமை மற்றும் சுதந்திர சமூகநிலைகளையே மையப்படுத்துகிறது. வரலாற்று உண்மையை மென்மைப்படுத்தாமல் பாதுகாக்க ‘அடிமை’ தேர்ந்தெடுக்கப்பட்டது.
- issue: κυρίου என்பதன் குறிப்பு மற்றும் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: அருகிலுள்ள சூழல் மனித எஜமான்களைப் பற்றியதாக இருந்தாலும், கைம்மாறு வரும் மூலமாக இங்கு தெய்வீக ஆண்டவரே குறிக்கப்படுகிறார். ‘ஆண்டவர்’ என்பது அந்த இறையியல் நிறையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வினையெச்சத்தின் முந்தைய வசனத்துடனான தொடர்ச்சியை ‘அறிந்தவர்களாய்’ பாதுகாக்கிறது; அதனால் தனியாக வாசிக்கும்போது இது முந்தைய அறிவுறுத்தலோடு இணையும் வாக்கியத் துண்டாகத் தோன்றுவது மூலத்தின் கட்டமைப்பையே பிரதிபலிக்கிறது. ‘அடிமை’ என்ற சொல் வரலாற்று சமூகநிலையை மறைக்காமல் நேரடியாகக் கூறுகிறது.
