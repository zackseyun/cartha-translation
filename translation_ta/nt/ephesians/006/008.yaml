revisions:
- from: ஒவ்வொருவரும், தான் எந்த நன்மையைச் செய்தாலும், அதையே ஆண்டவரிடமிருந்து திரும்பப் பெறுவார்[a] என்பதை அறிந்தவர்களாய்—அவர் அடிமையாக இருந்தாலும் சுதந்திரமானவராக இருந்தாலும்[b] சரி.
  to: ஒவ்வொருவரும் தாம் செய்யும் எந்த நன்மையான செயலையும், அதற்குரியதை ஆண்டவரிடமிருந்து திரும்பப் பெறுவார்[a] என்பதை அறிந்தவர்களாய், அடிமையாயிருந்தாலும் சுதந்திரமானவராயிருந்தாலும் சரி.[b]
  rationale: 'The revision integrates the final concessive slave/free contrast into the sentence, avoids the unclear appended pronoun, and renders the good done as a good action. It retains the source order and force: knowing that each person will receive back from the Lord what corresponds to any good action done, irrespective of slave or free status. Footnote anchors remain attached to the reciprocal-recompense expression and the slave/free contrast respectively.'
