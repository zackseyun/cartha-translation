  text: Εἰρήνη τοῖς ἀδελφοῖς καὶ ἀγάπη μετὰ πίστεως ἀπὸ θεοῦ πατρὸς καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/023.yaml
  text: Peace to the brothers[a], and love with faith[c][b], from God the Father and the Lord Jesus the Messiah.
translation:
  language: ta
  text: சகோதரர்களுக்குச்[a] சமாதானமும், விசுவாசத்துடன்[b] அன்பும், தந்தையாகிய கடவுளிடமிருந்தும் ஆண்டவர் இயேசு மெசியாவிடமிருந்தும்[c] உண்டாவதாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சகோதர சகோதரிகளுக்கு.” கிரேக்கத்தில் ஆண்பால் பன்மையான “சகோதரர்கள்” என்ற சொல் உள்ளது; அது விசுவாசிகள் அனைவரையும் குறிக்கக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “நம்பிக்கையுடன்” அல்லது “உண்மைத்தன்மையுடன்.” கிரேக்கச் சொல் இப்பொருள்களையும் தரக்கூடும்; இங்கு “விசுவாசம்” என்பது முதன்மை மொழிபெயர்ப்பு.
    reason: lexical_alternative
  - marker: c
    text: கிரேக்கத்தில் “இயேசு கிறிஸ்து.” இங்கு Χριστός என்ற பட்டத்தின் பொருளைத் தக்கவைக்க “மெசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἰρήνη
  choice: சமாதானம்
  rationale: வினைச்சொல் இல்லாத கிரேக்க ஆசீர்வாதத் தொடரைத் தமிழில் இயல்பாக வெளிப்படுத்த, இறுதியில் ‘உண்டாவதாக’ சேர்க்கப்பட்டுள்ளது; ‘சமாதானம்’ என்பதே சொல்லின் வழக்கமான பொருளைத் தக்கவைக்கிறது.
- source_word: τοῖς ἀδελφοῖς
  choice: சகோதரர்களுக்கு
  rationale: கிரேக்கச் சொல் இலக்கணப்படி ஆண்பால் பன்மை. அது முழு விசுவாசக் கூட்டத்தையும் குறிக்கக்கூடியதால் உள்ளடக்கிய பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἀγάπη
  choice: அன்பு
  rationale: ἀγάπη என்பதன் நேரடியான, இயல்பான தமிழ் இணைச்சொல்.
- source_word: μετὰ πίστεως
  choice: விசுவாசத்தோடுகூடிய
  rationale: μετά உடனிருப்பைக் குறிக்கிறது; πίστις இங்கு முதன்மையாக ‘விசுவாசம்’ என்று மொழிபெயர்க்கப்படுகிறது. ‘நம்பிக்கை’ அல்லது ‘உண்மைத்தன்மை’ என்ற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
- source_word: ἀπὸ
  choice: இடமிருந்து
  rationale: ஆசீர்வாதங்கள் யாரிடமிருந்து வருகின்றன என்ற மூலத்தைக் குறிக்கும் பொருள்.
- source_word: θεοῦ πατρὸς
  choice: தந்தையாகிய கடவுள்
  rationale: கிரேக்கத்தில் ‘நமது’ என்ற சொல் இல்லாததால் அதைச் சேர்க்காமல், πατήρ என்ற உறவுப்பெயரை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான நவீன, கண்ணியமான, வழக்கமான தமிழ் மொழிபெயர்ப்பு.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியா
  rationale: Ἰησοῦ என்பது பெயராகவும் Χριστός என்பது பட்டமாகவும் தக்கவைக்கப்படுகிறது; ‘மெசியா’ அந்தப் பட்டத்தின் பொருளையும் வேதாகமப் பயன்பாட்டையும் காட்டுகிறது.
theological_decisions:
- issue: Χριστοῦ என்ற பட்டத்தின் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து; அபிஷேகம் பெற்றவர்
  rationale: Χριστός இங்கு பெயரின் ஓர் அங்கமாக மட்டும் அல்லாமல் பட்டத்தன்மையையும் கொண்டுள்ளது. ‘மெசியா’ என்பதைப் பயன்படுத்துவது அந்தப் பட்டத்தை வெளிப்படையாகத் தக்கவைக்கிறது; கிரேக்கத்தின் சொற்படி வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- issue: ἀδελφοῖς என்பதிலுள்ள பாலினமும் சமூக அளவும்
  choice: சகோதரர்கள்
  alternative: சகோதர சகோதரிகள்; இறைமக்கள்
  rationale: முதன்மை உரை கிரேக்கத்தின் ஆண்பால் பன்மை வடிவத்தைப் பிரதிபலிக்கிறது; அது முழுத் திருச்சபையையும் உள்ளடக்கக்கூடிய பயன்பாடு என்பதை அடிக்குறிப்பு விளக்குகிறது.
- issue: πίστις என்பதன் பொருள்
  choice: விசுவாசம்
  alternative: நம்பிக்கை; உண்மைத்தன்மை
  rationale: இச்சூழலில் ‘விசுவாசம்’ இயல்பான முதன்மைப் பொருள். சொல்லுக்குள்ள பிற நியாயமான பொருள் வாய்ப்புகளை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: வினைச்சொல் இல்லாத ஆசீர்வாதத் தொடர்
  choice: உண்டாவதாக
  alternative: வினைச்சொல் சேர்க்காமல் பெயர்ச்சொல் தொடராக விடுதல்
  rationale: கிரேக்கத்தில் ஆசீர்வாத விருப்பம் மறைமுகமாக உள்ளது. தமிழில் முழுமையான, இயல்பான வாழ்த்தாக அமைய ‘உண்டாவதாக’ சேர்க்கப்படுகிறது; புதிய இறையியல் கருத்து சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான திருச்சபைச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. கிரேக்கத்தின் சுருக்கமான ஆசீர்வாத வடிவம் தமிழில் இயல்பாக அமைய ‘உண்டாவதாக’ சேர்க்கப்பட்டது. ‘கர்த்தர்’ என்பதற்குப் பதிலாக நவீனத் தமிழில் தெளிவான ‘ஆண்டவர்’ பயன்படுத்தப்பட்டுள்ளது.
