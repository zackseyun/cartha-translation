    issue: The rendering of μετὰ πίστεως is stylistically over-compounded.
    rationale: 'The Greek prepositional phrase means “with faith.” Recasting it as “விசுவாசத்துடன்” is more idiomatic and keeps the parallel structure: peace, and love with faith.'
