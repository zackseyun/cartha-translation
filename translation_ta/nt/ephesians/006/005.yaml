id: EPH.6.5
reference: Ephesians 6:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Οἱ δοῦλοι, ὑπακούετε τοῖς ⸂κατὰ σάρκα κυρίοις⸃ μετὰ φόβου καὶ τρόμου ἐν ἁπλότητι τῆς καρδίας ὑμῶν ὡς τῷ Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/005.yaml
  text: Servants[a], obey your masters according to the flesh with fear and trembling, in sincerity of your heart, as to Messiah[b],
translation:
  language: ta
  text: அடிமைகளே, இவ்வுலகில் உங்களுக்கு எஜமானர்களாக இருப்பவர்களுக்கு[a], பயத்தோடும் நடுக்கத்தோடும், கபடமற்ற உள்ளத்தோடும், மெசியாவுக்குக் கீழ்ப்படிவதுபோல[b] கீழ்ப்படியுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “மாம்சத்தின்படியான எஜமானர்களுக்கு”; அதாவது, மனித அல்லது இவ்வுலக உறவின்படி எஜமானர்களாக இருப்பவர்களுக்கு.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் “கிறிஸ்துவுக்கு”; இங்கே அந்தச் சொல் பட்டப்பெயராகச் செயல்படுவதால் “மெசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλοι
  choice: அடிமைகளே
  rationale: உடைமைக்கும் கட்டுப்பாட்டுக்கும் உட்பட்ட அடிமை நிலையிலிருந்தவர்களையே குடும்ப ஒழுங்கு குறித்த இந்தச் சூழல் நேரடியாகக் குறிப்பிடுகிறது; ‘வேலைக்காரர்கள்’ என்று மொழிபெயர்ப்பது அந்தச் சமூக உண்மையை மங்கச் செய்யும்.
- source_word: ὑπακούετε
  choice: கீழ்ப்படியுங்கள்
  rationale: தொடர்ந்து கீழ்ப்படிதலைக் கோரும் நிகழ்காலக் கட்டளையின் இயல்பான தமிழ் வடிவம்.
- source_word: κατὰ σάρκα κυρίοις
  choice: இவ்வுலகில் உங்களுக்கு எஜமானர்களாக இருப்பவர்களுக்கு
  rationale: κατὰ σάρκα என்பது இங்கே பாவ இயல்பைக் குறிக்காமல், மனித மற்றும் இவ்வுலக உறவின் எல்லைக்குள் உள்ள எஜமானத்துவத்தைக் குறிக்கிறது. சொல்லுக்குச் சொல் மொழிபெயர்ப்பால் ஏற்படும் தவறான புரிதலைத் தவிர்த்து அதன் எதிர்மறை வரம்பை இவ்வடிவம் தெரிவிக்கிறது.
- source_word: μετὰ φόβου καὶ τρόμου
  choice: பயத்தோடும் நடுக்கத்தோடும்
  rationale: பவுலின் வலிமையான இணைச்சொல் தொடரை முறையாகவும் நினைவில் நிற்கும் வகையிலும் பாதுகாக்கிறது.
- source_word: ἐν ἁπλότητι τῆς καρδίας ὑμῶν
  choice: கபடமற்ற உள்ளத்தோடும்
  rationale: ἁπλότης இங்கே இரட்டை நோக்கமின்மை, நேர்மை, உண்மையான உள்ளநிலை ஆகியவற்றைக் குறிக்கிறது; ‘கபடமற்ற உள்ளம்’ நவீன தமிழில் இயல்பாக அந்தப் பொருளைத் தருகிறது.
- source_word: ὡς τῷ Χριστῷ
  choice: மெசியாவுக்குக் கீழ்ப்படிவதுபோல
  rationale: ὡς என்பதன் ஒப்புமையைத் தெளிவாகக் காக்கிறது; பூமிக்குரிய எஜமானர்களையும் மெசியாவையும் ஒன்றாக்காமல், கீழ்ப்படிதலின் முறையை ஒப்பிடுகிறது. Χριστός இங்கே பட்டப்பெயராக இருப்பதால் ‘மெசியா’ என மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: Χριστῷ என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: Χριστός இவ்விடத்தில் பெயராக அல்ல, ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற பட்டமாகச் செயல்படுகிறது; ஆகவே அதன் பொருளை வெளிப்படுத்தும் ‘மெசியா’ தேர்ந்தெடுக்கப்பட்டது.
- issue: δοῦλοι என்பதன் சமூகப் பொருள்
  choice: அடிமைகள்
  alternative: வேலைக்காரர்கள் / பணியாளர்கள்
  rationale: எஜமானரின் அதிகாரத்திற்கும் உடைமை அமைப்பிற்கும் உட்பட்டவர்களை வசனம் குறிப்பிடுகிறது. மென்மைப்படுத்தப்பட்ட மாற்றுச் சொற்கள் வரலாற்றுச் சமூக நிலையை மறைக்கக்கூடும்.
- issue: κατὰ σάρκα என்பதன் வரம்பு
  choice: இவ்வுலகில் உங்களுக்கு எஜமானர்களாக இருப்பவர்கள்
  alternative: மாம்சத்தின்படியான எஜமானர்கள்
  rationale: இது ‘பாவ இயல்பு’ என்ற பொருளைத் தரவில்லை; மனித, தற்காலிக உறவின் எல்லைக்குள் உள்ள எஜமானர்களைக் குறிக்கிறது. இயல்பான தமிழ் வடிவம் அந்த வேறுபாட்டைத் தெரிவிக்கிறது; நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. அடிமை நிலை மென்மைப்படுத்தப்படவில்லை; κατὰ σάρκα என்பதின் உண்மையான பொருள் பிரதான உரையில் இயல்பாகவும் அடிக்குறிப்பில் நேரடியாகவும் வழங்கப்பட்டது. வசன முடிவிலுள்ள ஒப்புமை தமிழில் தெளிவடைய ‘கீழ்ப்படிவதுபோல’ என்று விரிக்கப்பட்டுள்ளது.
