- issue: பழங்கால வீட்டமைப்பின் சமூக அந்தஸ்தைக் குறிக்கும் சொல்
  choice: ‘எஜமான்கள்’ என்று வரலாற்றுச் சமூக உறவைப் பாதுகாத்தல்
  alternative: ‘முதலாளிகள்’ அல்லது ‘வேலை கொடுப்பவர்கள்’
  rationale: ‘முதலாளிகள்’ என்பது நவீன வேலைவாய்ப்பு உறவை நினைவூட்டலாம்; ‘வேலை கொடுப்பவர்கள்’ என்பது காலத்துக்குப் பிந்தைய கருத்தை உரைக்குள் கொண்டுவரும். ‘எஜமான்கள்’ மூலச் சூழலின் கடினமான சமூக உண்மையை மறைக்காது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. நீண்ட கிரேக்க வாக்கியம் தமிழின் இயல்புக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டது. ‘அவர்களை’ என்பது முந்தைய வசனங்களில் குறிப்பிடப்பட்ட அடிமைகளைச் சுட்டுகிறது; ‘அவர்களிடம்’ என்ற வடிவம் மரியாதையையும் பரஸ்பர நடத்தையையும் இயல்பாகக் காட்டுகிறது.
