- source_word: καὶ αὐτῶν καὶ ὑμῶν ὁ κύριος
  choice: அவர்களுக்கும் உங்களுக்கும் எஜமானர்
  rationale: ஒரே κύριος என்ற சொல்லை மனித எஜமானர்களுக்கும் பரலோக அதிகாரிக்கும் பயன்படுத்தும் கிரேக்கச் சொல்லாட்டத்தையும், பூமிக்குரிய எஜமானர்களும் உயர்ந்த எஜமானருக்குக் கீழ்ப்பட்டவர்கள் என்ற முரணையும் தமிழில் பாதுகாக்கிறது.
