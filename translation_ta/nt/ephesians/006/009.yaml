  rationale: முந்தைய அறிவுரையுடனான தொடர்பையும் பரஸ்பரக் கடமையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘நீங்களும்’ என்பது καί-இன் வலியுறுத்தலைக் காட்டுகிறது.
- source_word: ἀνιέντες τὴν ἀπειλήν
