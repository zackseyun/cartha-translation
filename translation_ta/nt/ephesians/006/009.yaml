  text: Καὶ οἱ κύριοι, τὰ αὐτὰ ποιεῖτε πρὸς αὐτούς, ἀνιέντες τὴν ἀπειλήν, εἰδότες ὅτι καὶ ⸂αὐτῶν καὶ ὑμῶν⸃ ὁ κύριός ἐστιν ἐν οὐρανοῖς, καὶ προσωπολημψία οὐκ ἔστιν παρ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/009.yaml
  text: And masters[a], do the same things toward them, giving up threatening, knowing that both their Master and yours is in heaven[c][b], and there is no partiality with him.
translation:
  language: ta
  text: எஜமான்களே, நீங்களும் அவர்களிடம் அதேபோல் நடந்துகொள்ளுங்கள்[a]. அவர்களை மிரட்டுவதை விட்டுவிடுங்கள்[b]. அவர்களுக்கும் உங்களுக்கும் எஜமானர் பரலோகத்தில் இருக்கிறார்[c] என்றும், அவரிடம் பாரபட்சம் இல்லை என்றும் அறிந்திருங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்களுக்கும் அதையே செய்யுங்கள்.’ கிரேக்க வாசகம் முந்தைய அறிவுரையை நெருக்கமாக எதிரொலித்து, பரஸ்பரப் பொறுப்பை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உங்கள் மிரட்டல்களை நிறுத்துங்கள்.’ கிரேக்கச் சொல் மிரட்டும் பழக்கத்தைத் தளர்த்துதல் அல்லது முற்றிலும் கைவிடுதல் என்ற பொருளைக் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: c
    text: சொல்லர்த்தமாக, ‘வானங்களில்.’ தமிழில் இம்மரபுத்தொடர் இயல்பாக ‘பரலோகத்தில்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
