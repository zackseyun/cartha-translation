  rationale: அச்சுறுத்தும் வழக்கத்தைக் கைவிடுதல் என்ற பொருளைத் தெளிவாகத் தருகிறது. கிரேக்கப் பங்கேற்புவினையின் கட்டளையுடன் இணைந்த செயல்பாட்டை தமிழில் தனி கட்டளையாக இயல்பாக வழங்குகிறது.
