source:
  edition: SBLGNT
  text: ⸀ἐν πᾶσιν ἀναλαβόντες τὸν θυρεὸν τῆς πίστεως, ἐν ᾧ δυνήσεσθε πάντα τὰ βέλη τοῦ ⸀πονηροῦ πεπυρωμένα σβέσαι·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/016.yaml
  text: In all circumstances[a], taking up the shield of faith[c][b], with which you will be able to extinguish all the flaming arrows of the evil one.
translation:
  language: ta
  text: எல்லாச் சூழ்நிலைகளிலும்[a] விசுவாசத்தின் கேடயத்தை எடுத்துக்கொண்டு, அதைக் கொண்டு தீயவனுடைய[b] எரியும் அம்புகள்[c] அனைத்தையும் அணைக்க உங்களால் முடியும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எல்லாவற்றிலும்.”
    reason: ἐν πᾶσιν என்பது பரந்த பொருளில் ‘எல்லாவற்றிலும்’ என்றும் மொழிபெயர்க்கப்படலாம்; இச்சூழலில் ‘எல்லாச் சூழ்நிலைகளிலும்’ இயல்பானது.
  - marker: b
    text: அல்லது, “தீமையின்.”
    reason: τοῦ πονηροῦ என்பது தீயவனைக் குறிக்கலாம்; இலக்கணப்படி ‘தீமை’ என்ற கருத்துப்பொருளாகவும் புரிந்துகொள்ளப்படலாம்.
  - marker: c
    text: அல்லது, “எறியாயுதங்கள்”; மரபான மொழிபெயர்ப்பு, “தீ அம்புகள்.”
    reason: βέλη என்பது அம்புகளை மட்டுமல்ல, எய்யப்படும் அல்லது எறியப்படும் ஆயுதங்களையும் பொதுவாகக் குறிக்கலாம். πεπυρωμένα என்பதன் தீ மூட்டப்பட்ட படிமத்தை மரபான சொற்றொடர் வெளிப்படுத்துகிறது.
lexical_decisions:
- source_word: ἐν πᾶσιν
  choice: எல்லாச் சூழ்நிலைகளிலும்
  rationale: இங்கு இச்சொற்றொடர் கவசப் பட்டியலின் சூழலில் வினையடைப் பொருளில் வந்து, ஒவ்வொரு சூழ்நிலையிலும் என்பதைக் குறிக்கிறது. கிரேக்கத்தின் சுருக்கமான வடிவில் உள்ள வேறு சாத்தியத்தை அடிக்குறிப்பில் வைத்துள்ளோம்.
- source_word: ἀναλαβόντες
  choice: எடுத்துக்கொண்டு
  rationale: இறந்தகால வினையெச்சத்தின் துணைச் செயல் தன்மையை இயல்பான தமிழில் காக்கிறது; இதைத் தனி கட்டளையாக மாற்றவில்லை.
- source_word: θυρεὸν τῆς πίστεως
  choice: விசுவாசம் என்னும் கேடயம்
  rationale: உருவக அடையாளத்தைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது. θυρεός பெரிய பாதுகாப்புக் கேடயத்தைக் குறித்தாலும், மூல வசனம் அதன் அளவைத் தனியாக வலியுறுத்தாததால் ‘கேடயம்’ போதுமானது.
- source_word: ἐν ᾧ
  choice: அதைக் கொண்டு
  rationale: முன்னுள்ள கேடயத்தைக் குறிக்கும் தொடர்புப்பெயரின் கருவிப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: δυνήσεσθε
  choice: உங்களால் முடியும்
  rationale: எதிர்கால திறன் அல்லது ஆற்றலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: βέλη
  choice: அம்புகள்
  rationale: இச்சொல் பொதுவாக எறியப்படும் அல்லது எய்யப்படும் ஆயுதங்களைக் குறிக்கலாம்; போர்க்கள உருவகத்தில் ‘அம்புகள்’ எளிதில் புரியும் தேர்வு.
- source_word: τοῦ πονηροῦ
  choice: தீயவனுடைய
  rationale: ஆவிக்குரிய போராட்டச் சூழலில் பெயரடையை ஆளைக் குறிக்கும் சொல்லாகப் புரிந்துகொள்வது மிகவும் பொருத்தமானது; கருத்துப்பொருளான ‘தீமை’ என்ற வாசிப்பும் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: πεπυρωμένα
  choice: தீப்பற்றி எரியும்
  rationale: ‘தீ மூட்டப்பட்டவை’ என்ற நிறைவுற்ற செயப்பாட்டு உருவத்தை இயல்பான தமிழில் தெளிவான எரியும் படிமமாக வழங்குகிறது.
- source_word: σβέσαι
  choice: அணைத்துவிட
  rationale: தீயை முற்றிலும் அணைக்கும் செயலைத் தெளிவாகவும் வழக்கமான தமிழிலும் தெரிவிக்கிறது.
theological_decisions:
- issue: τοῦ πονηροῦ என்பது ஆளைக் குறிக்கிறதா அல்லது தீமையைக் குறிக்கிறதா?
  choice: தீயவன்
  alternative: தீமை
  rationale: பகைத் தாக்குதலும் ஆவிக்குரிய போராட்டமும் இடம்பெறும் உடனடிச் சூழலில் ஆளைக் குறிக்கும் வாசிப்பு சிறப்பாகப் பொருந்துகிறது. இருப்பினும் கிரேக்க இலக்கணத்தில் கருத்துப்பொருள் வாசிப்பும் சாத்தியமாதலால் அது அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- issue: πίστις என்பதன் பொருள்
  choice: விசுவாசம்
  alternative: நம்பிக்கை / நம்பியிருத்தல்
  rationale: இங்கு கடவுளைச் சார்ந்திருக்கும் விசுவாசமே பாதுகாப்புக் கேடயமாக உருவகிக்கப்படுகிறது. ‘விசுவாசம்’ என்பது திருச்சபைச் சொல்வழக்கிலும் பொது நவீன தமிழிலும் அறியப்பட்டு, சொல்லின் இறையியல் பரப்பைச் சுருக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமக் கவிதைப் படிமத்தின் கண்ணியத்தைத் தக்கவைத்தும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘எடுத்துக்கொண்டு’ என்பது கிரேக்க வினையெச்ச அமைப்பை காக்கிறது; ‘அதைக் கொண்டு’ என்ற மீளுரை தமிழில் கருவிப் பொருளைத் தெளிவாக்குகிறது.
