id: EPH.6.11
reference: Ephesians 6:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐνδύσασθε τὴν πανοπλίαν τοῦ θεοῦ πρὸς τὸ δύνασθαι ὑμᾶς στῆναι πρὸς τὰς μεθοδείας τοῦ διαβόλου·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/011.yaml
  text: Put on the full armor of God[b][a], so that you may be able to stand against the schemes of the devil.
translation:
  language: ta
  text: பிசாசின் சூழ்ச்சிகளை[b] எதிர்த்து நிலைநிற்க உங்களால் முடியும்படி, தேவனுடைய முழுப் போர்ப் படைக்கலன்களையும்[a] அணிந்துகொள்ளுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தேவனுடைய முழுப் போர்க்கவசத்தையும்.’ கிரேக்கச் சொல் ஒரு படைவீரனின் முழுமையான போர்ச் சாதனங்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘வஞ்சகத் தந்திரங்களை’ அல்லது ‘தந்திரமான வழிமுறைகளை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδύσασθε
  choice: அணிந்துகொள்ளுங்கள்
  rationale: இது இரண்டாம் நபர் பன்மை ஏவல் வடிவம். போர்க்கவசத்தைத் தரித்துக்கொள்வதைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்லாகவும் கட்டளையின் வலிமையைத் தக்கவைத்ததாகவும் உள்ளது.
- source_word: πανοπλίαν
  choice: முழுப் போர்ப் படைக்கலன்களையும்
  rationale: இந்தச் சொல் வெறும் உடற்கவசத்தை மட்டும் அல்லாமல், ஒரு படைவீரனின் முழுமையான போர்ச் சாதனங்களையும் குறிக்கிறது. ‘முழுப் போர்ப் படைக்கலன்கள்’ அந்த விரிவையும் முழுமையையும் தெளிவாகக் காட்டுகிறது.
- source_word: τοῦ θεοῦ
  choice: தேவனுடைய
  rationale: கிரேக்க உடைமை வேற்றுமை, இவை தேவனுக்குரியவை அல்லது அவரால் வழங்கப்படுபவை என்ற இரு நெருங்கிய நுணுக்கங்களையும் கொண்டிருக்கலாம். ‘தேவனுடைய’ என்பது மூலத்தின் பரந்த பொருளை அளவுக்கு மீறி விளக்காமல் தக்கவைக்கிறது.
- source_word: πρὸς τὸ δύνασθαι ὑμᾶς στῆναι
  choice: நிலைநிற்க உங்களால் முடியும்படி
  rationale: இத்தொடர் நோக்கம் அல்லது நோக்கத்தின் விளைவை வெளிப்படுத்துகிறது. தமிழ் வாக்கியத்தில் நோக்கத்தொடரை முதலில் அமைப்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: στῆναι
  choice: நிலைநிற்க
  rationale: சொல் அடிப்படையில் ‘நிற்க’ என்று பொருள்பட்டாலும், இங்குள்ள போர்ச் சூழலில் எதிர்ப்புக்கு இடையே தன் நிலையை விட்டுக்கொடுக்காமல் நிற்பது உட்பொருள். ‘நிலைநிற்க’ இதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: μεθοδείας
  choice: சூழ்ச்சிகளை
  rationale: வஞ்சகமான திட்டங்கள் அல்லது தந்திரமான வழிமுறைகள் என்பதே இங்கு பொருள். ‘சூழ்ச்சிகள்’ என்பது பகைமையும் வஞ்சகமும் கலந்த நுணுக்கத்தை நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: τοῦ διαβόλου
  choice: பிசாசின்
  rationale: ஆவிக்குரிய போராட்டத்தைப் பற்றிய உடனடிச் சூழலில் διάβολος ஒரு பொதுவான ‘அவதூறு பேசுபவன்’ என்பதைவிட தனிப்பட்ட தீய எதிரியைக் குறிக்கும் பெயராகப் பயன்படுகிறது. ‘பிசாசு’ என்பது தமிழில் நிலைபெற்ற, தெளிவான மொழிபெயர்ப்பு.
theological_decisions:
- issue: διάβολος என்பதன் குறிப்பு
  choice: தனிப்பட்ட தீய எதிரியைக் குறிக்கும் ‘பிசாசு’
  alternative: ‘அவதூறு பேசுபவன்’ என்ற பொதுப்பொருள்
  rationale: எபேசியர் 6-இன் ஆவிக்குரிய போராட்டச் சூழல், ஒரு சாதாரண மனித அவதூறாளனை அல்லாமல் தனிப்பட்ட இயற்கைக்கு அப்பாற்பட்ட தீய எதிரியையே சுட்டுகிறது; வசனம் கூறுவதைத் தாண்டிய கோட்பாட்டு விவரங்கள் சேர்க்கப்படவில்லை.
- issue: τοῦ θεοῦ என்ற உடைமை வேற்றுமையின் தொடர்பு
  choice: ‘தேவனுடைய’ என்று பரந்த தொடர்பைத் தக்கவைத்தல்
  alternative: ‘தேவன் தரும்’ என்று மூலத்தை மட்டும் வெளிப்படையாக்குதல்
  rationale: படைக்கலன்கள் தேவனுக்குரியவை என்றும் அவரால் வழங்கப்படுபவை என்றும் இத்தொடர் உணர்த்தக்கூடும். ஒரு நுணுக்கத்தை மட்டும் தீர்மானிக்காமல் மூலத்தின் இயல்பான பரப்பை மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘போர்ப் படைக்கலன்கள்’ என்ற சொற்றொடர் உருவகத்தின் இராணுவப் பின்னணியையும் πανοπλία என்பதன் முழுமையான சாதனத் தொகுப்பு என்ற பொருளையும் காக்கிறது. நோக்கத்தொடர் தமிழின் இயல்பான வாக்கிய ஓட்டத்திற்காக முன்னால் வைக்கப்பட்டுள்ளது.
