source:
  edition: SBLGNT
  text: ἡ χάρις μετὰ πάντων τῶν ἀγαπώντων τὸν κύριον ἡμῶν Ἰησοῦν Χριστὸν ἐν ⸀ἀφθαρσίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/024.yaml
  text: Grace be with all who love our Lord Jesus the Messiah with incorruptibility[a].
translation:
  language: ta
  text: அழியாமையில் நம் ஆண்டவராகிய இயேசு மேசியாவை நேசிக்கிற அனைவரோடும் அருள் இருப்பதாக.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அழியாத அன்புடன்”; வேறு விதமாக, “உண்மை மனத்துடன்” அல்லது “தணியாத அன்புடன்.” “அழியாமையில்” என்ற கிரேக்கத் தொடர் சுருக்கமானதும் ஒன்றுக்கு மேற்பட்ட பொருள்களுக்கு இடமளிப்பதும் ஆகும்.
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: அருள்
  rationale: பவுலின் கடித நிறைவு வாழ்த்துக்கேற்ற இயல்பான தமிழ்ச் சொல்; இங்கு ஆசீர்வாத வேண்டுதலாக வருகிறது.
- source_word: μετὰ πάντων
  choice: அனைவரோடும் ... இருப்பதாக
  rationale: வினைச்சொல் இல்லாத கிரேக்க வாழ்த்துத் தொடரை இயல்பான தமிழில் வேண்டுதல் வடிவில் வெளிப்படுத்துகிறது; μετά என்பதன் உடனிருப்புப் பொருளையும் காக்கிறது.
- source_word: ἀγαπώντων
  choice: நேசிக்கிற
  rationale: நிகழ்காலப் பங்கேற்புவினையின் தொடரும் பண்பை இயல்பான உறவுத்தொடராகக் காட்டுகிறது.
- source_word: κύριον
  choice: ஆண்டவர்
  rationale: இங்கு இயேசுவுக்குரிய பட்டமாக வரும் κύριος என்பதற்கான வழக்கமான, மரியாதைமிக்க தமிழாக்கம்.
- source_word: Ἰησοῦν Χριστόν
  choice: இயேசு மேசியா
  rationale: Χριστός என்பதை வெறும் பெயராக அல்ல, ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற பட்டப்பொருளுடைய ‘மேசியா’ எனத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐν ἀφθαρσίᾳ
  choice: அழியாமையில்
  rationale: கிரேக்கத்தின் சுருக்கத்தையும் இலக்கணப் பொருள் மயக்கத்தையும் முடிந்தவரைத் தக்கவைக்கிறது; இது அன்பின் தன்மையையோ, ஆசீர்வாதத்தின் நிலையையோ குறிக்கிறதா என்பதை முதன்மை உரையில் தீர்மானிக்கவில்லை.
theological_decisions:
- issue: ἐν ἀφθαρσίᾳ என்பதன் தொடர்பும் பொருளும்
  choice: முதன்மை உரையில் ‘அழியாமையில்’ என்ற சுருக்கமான, பொருள் மயக்கத்தைத் தக்கவைக்கும் வடிவம்
  alternative: ‘அழியாத அன்புடன்’, ‘உண்மை மனத்துடன்’, அல்லது ‘தணியாத அன்புடன்’
  rationale: ἀφθαρσία அன்பின் அழியாத தன்மையைக் குறிக்கிறதா, நேர்மையைச் சுட்டுகிறதா, அல்லது அருள் நிலவும் அழிவற்ற நிலையைக் குறிக்கிறதா என்பதை கிரேக்கம் வெளிப்படையாகத் தீர்மானிக்கவில்லை. ஆகவே அந்த இறையியல் மற்றும் இலக்கணத் தெளிவின்மை முதன்மை உரையில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க கடித நிறைவு வாழ்த்தாகவும் அமைக்கப்பட்டுள்ளது. ‘அழியாமையில்’ சற்றுச் செறிவான சொற்றொடராக இருந்தாலும், மூலத்தின் உண்மையான பொருள் மயக்கத்தைப் பாதுகாப்பதற்காகத் தக்கவைக்கப்பட்டுள்ளது.
