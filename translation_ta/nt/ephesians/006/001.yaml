id: EPH.6.1
reference: Ephesians 6:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τὰ τέκνα, ὑπακούετε τοῖς γονεῦσιν ὑμῶν ἐν κυρίῳ, τοῦτο γάρ ἐστιν δίκαιον·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/001.yaml
  text: Children[a], obey your parents in the Lord, for this is right.
translation:
  language: ta
  text: பிள்ளைகளே, ஆண்டவருக்குள் உங்கள் பெற்றோருக்குக் கீழ்ப்படியுங்கள்[a]; ஏனெனில் இது சரியானது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆண்டவருக்குள்” என்பது கீழ்ப்படிதல் நடைபெறும் உறவுச் சூழலை அல்லது அதன் முறையைக் குறிக்கலாம்; ஆண்டவருக்கான பற்றுறுதியே அத்தகைய கீழ்ப்படிதலின் வரம்பு என்பதையும் இது உணர்த்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνα
  choice: பிள்ளைகளே
  rationale: குடும்பத்தின் இளைய உறுப்பினர்களை நேரடியாக அழைக்கும் விளிவேற்றுமைப் பன்மையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὑπακούετε
  choice: கீழ்ப்படியுங்கள்
  rationale: வெறுமனே கேட்பதை அல்ல, கேட்டதற்கு இணங்கி நடக்கும் தொடர்ச்சியான கீழ்ப்படிதலைக் கோரும் நிகழ்காலக் கட்டளையின் வலிமையைத் துல்லியமாகக் காட்டுகிறது.
- source_word: γονεῦσιν
  choice: பெற்றோருக்கு
  rationale: தந்தை, தாய் ஆகிய இருவரையும் கூட்டாகக் குறிக்கும் கிரேக்கப் பன்மைப் பெயர்ச்சொல்லுக்கு இயல்பான, துல்லியமான தமிழ் இணைச்சொல்.
- source_word: ἐν κυρίῳ
  choice: ஆண்டவருக்குள்
  rationale: பவுலின் செறிவான சொற்றொடரைப் பாதுகாத்து, ஆண்டவருடனான உறவின் வெளியில் அல்லது சூழலில் கீழ்ப்படிதல் என்ற பொருளையும், அந்தக் கீழ்ப்படிதலின் முறை அல்லது வரம்பு குறித்த திறந்த நிலையையும் தக்கவைக்கிறது.
- source_word: δίκαιον
  choice: சரியானது
  rationale: இச்சூழலில் ஒழுக்கநெறிப்படி உரியது அல்லது தகுந்தது என்ற பொருளை சாதாரண நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘ஆண்டவருக்குள்’ (ἐν κυρίῳ) என்ற சொற்றொடரின் தொடர்பும் வரம்பும்
  choice: ‘ஆண்டவருக்குள் உங்கள் பெற்றோருக்குக் கீழ்ப்படியுங்கள்’ என்று கட்டளையுடன் இணைத்துப் பெயர்த்தல்
  alternative: ‘ஆண்டவருக்குள் இருக்கிற பிள்ளைகளே, உங்கள் பெற்றோருக்குக் கீழ்ப்படியுங்கள்’ அல்லது ‘ஆண்டவருக்கு ஏற்றபடி கீழ்ப்படியுங்கள்’
  rationale: கிரேக்கச் சொல் வரிசையில் இச்சொற்றொடர் இயல்பாகக் கட்டளையுடன் தொடர்புபடுகிறது; ஆயினும் அது பிள்ளைகளின் ஆண்டவருடனான அடையாளத்தைச் சொல்கிறதா, கீழ்ப்படிதலின் சூழல் அல்லது முறையைச் சொல்கிறதா, அல்லது ஆண்டவருக்கான பற்றுறுதியால் அதன் வரம்பை உணர்த்துகிறதா என்பது முழுமையாகத் தீர்மானிக்கப்படவில்லை. ஆகவே அதன் சுருக்கமும் இறையியல் பதற்றமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், குடும்ப உரையாடலுக்கு ஏற்ற தெளிவுடனும் வேதாகம உரைக்கு உரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘ஆண்டவருக்குள்’ என்ற பவுலின் செறிவான சொற்றொடர் விளக்கிப் பரப்பப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
