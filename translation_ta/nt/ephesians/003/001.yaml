  text: For this reason I[a], Paul[c][b], the prisoner of Messiah Jesus on behalf of you Gentiles—
translation:
  language: ta
  text: இதன் காரணமாக, யூதரல்லாதவர்களாகிய உங்களுக்காக மேசியா[a] இயேசுவின் கைதியான பவுலாகிய நான்—
  philosophy: optimal-equivalence
