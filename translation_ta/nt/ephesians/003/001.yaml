    text: 'அல்லது: “கிறிஸ்து இயேசு.”'
    reason: Χριστός என்பதற்கான மரபுவழி ஒலிபெயர்ப்பும் முழு மாற்றுச் சொல்லிணையும்.
lexical_decisions:
- source_word: Τούτου χάριν
  choice: இதன் காரணமாக
  rationale: முந்தைய கருத்தைச் சுட்டி அதிலிருந்து வரும் முடிவை அறிமுகப்படுத்தும் சொற்றொடர்; தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἐγὼ Παῦλος
  choice: பவுலாகிய நான்
  rationale: வலியுறுத்தப்பட்ட தன்மைப் பெயரையும் பவுலின் சுயஅடையாளத்தையும் இயல்பான தமிழ் அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: ὁ δέσμιος
  choice: கைதியான
  rationale: காவலில் வைக்கப்பட்ட ஒருவரைக் குறிக்கும் மூலச்சொல்லின் நேரடியான, பொதுவாகப் புரியும் மொழிபெயர்ப்பு.
- source_word: τοῦ Χριστοῦ Ἰησοῦ
  choice: மேசியா இயேசுவின்
  rationale: Χριστός என்பதைப் பெயர்போல் ஒலிபெயர்க்காமல் அதன் பட்டப்பெயர்ச் சிறப்பைத் தக்கவைத்து ‘மேசியா’ என மொழிபெயர்க்கிறது; வேற்றுமைத் தொடர்பின் பொருளைத் தீர்மானிக்காமல் ‘இயேசுவின்’ எனப் பாதுகாக்கிறது.
- source_word: ὑπὲρ ὑμῶν
  choice: உங்களுக்காக
  rationale: இங்கு உள்ள நன்மை அல்லது பொருட்டு என்ற நுணுக்கத்தை இயல்பான தமிழில் தருகிறது.
- source_word: τῶν ἐθνῶν
  choice: யூதரல்லாதவர்களாகிய
  rationale: இந்தப் பவுலியச் சூழலில் அரசியல் நாடுகளை அல்ல, யூதரல்லாத மக்களைச் சுட்டுவதால் பொருளைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: Χριστοῦ என்பதைப் பட்டப்பெயராகவா, மரபுவழிப் பெயர்போன்ற வடிவமாகவா மொழிபெயர்ப்பது
  choice: மேசியா இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: இங்கு Χριστός இயேசுவுக்குரிய பட்டப்பெயராகச் செயல்படுவதால் அதன் பொருளைக் காட்டும் ‘மேசியா’ முதன்மை உரையில் பயன்படுத்தப்பட்டது; பரவலான மரபுவழி வடிவம் அடிக்குறிப்பில் தரப்பட்டது.
- issue: ‘மேசியா இயேசுவின் கைதி’ என்ற உரிமை/தொடர்பு வேற்றுமையின் நுணுக்கம்
  choice: மேசியா இயேசுவின் கைதி
  alternative: மேசியா இயேசுவுக்காகச் சிறைப்பட்டவன்
  rationale: மூலத்தின் genitive அமைப்பு உடைமை, சேவைத் தொடர்பு அல்லது அவருக்காக ஏற்பட்ட சிறைநிலை ஆகியவற்றை ஒலிக்கச் செய்யலாம். அவற்றில் ஒன்றை மட்டும் விளக்கமாகத் தேர்ந்தெடுக்காமல் மூலத்தின் சுருக்கத்தையும் இறையியல் அழுத்தத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடை பயன்படுத்தப்பட்டுள்ளது. ‘யூதரல்லாதவர்கள்’ என்பது ‘புறவினத்தார்’ என்பதைக் காட்டிலும் இன்றைய பொதுவாசகருக்குத் தெளிவானது. கிரேக்க வாக்கியம் அடுத்த வசனங்களில் தொடர்வதால் இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது.
