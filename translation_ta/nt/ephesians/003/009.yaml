lexical_decisions:
- source_word: φωτίσαι
  choice: வெளிச்சமிட்டுக் காட்டவும்
  rationale: வெளிச்சம் அளித்தல் என்ற உருவகத்தைத் தக்கவைத்தபடியே, தொடர்ந்து வரும் கருத்தை எல்லாருக்கும் தெளிவாக வெளிப்படுத்துதல் என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: πάντας
  choice: எல்லாருக்கும்
  rationale: இங்கு குறிக்கப்படுவது மனிதர்களை; தமிழில் வேற்றுமை உருபுடன் அமைந்த இச்சொல், வெளிப்படுத்துதலின் பொதுவான நோக்கை இயல்பாகக் காட்டுகிறது.
- source_word: τίς ἡ οἰκονομία
  choice: நிர்வாகம் என்ன
  rationale: οἰκονομία என்பதில் உள்ள பொறுப்புடன் ஒழுங்குபடுத்தி நடைமுறைப்படுத்தும் கருத்தை ‘நிர்வாகம்’ காக்கிறது; அதைப் பொதுவான ‘திட்டம்’ என்று மட்டும் குறுக்கவில்லை.
- source_word: μυστήριον
  choice: மறைபொருள்
  rationale: முன்பு மறைக்கப்பட்டு இப்போது வெளிப்படுத்தப்படும் இறைநோக்கைக் குறிக்கும் பவுலின் பயன்பாட்டை இது தருகிறது; வெறும் மனித இரகசியம் என்ற எண்ணத்தைக் குறைக்கிறது.
- source_word: ἀποκεκρυμμένου
  choice: மறைத்து வைக்கப்பட்டிருந்த
  rationale: முன்னர் மறைக்கப்பட்டதன் விளைவாகத் தொடர்ந்து இருந்த நிலையைக் கிரேக்க நிறைவுக்காலப் பெயரெச்சத்துக்கு ஏற்றவாறு வெளிப்படுத்துகிறது.
- source_word: ἀπὸ τῶν αἰώνων
  choice: காலங்களிலிருந்தே
  rationale: ‘காலங்கள்’ என்ற மூலச்சொல்லைத் தக்கவைத்து, ‘நித்தியத்திலிருந்து’ என்று பொருளை மிகத் திட்டவட்டமாக்காமல் காலத்தின் நீண்ட பரப்பைச் சுட்டுகிறது.
- source_word: ἐν τῷ θεῷ
  choice: கடவுளுக்குள்
  rationale: ἐν என்பதன் அடிப்படை இடப்பொருளையும், மறைபொருள் கடவுளில் மறைந்திருந்தது என்ற இறையியல் நுட்பத்தையும் தக்கவைக்கிறது.
- source_word: τῷ τὰ πάντα κτίσαντι
  choice: எல்லாவற்றையும் படைத்த கடவுள்
  rationale: கடவுளை விவரிக்கும் கிரேக்கப் பெயரெச்சத் தொடரை இயல்பான தமிழ்ச் சொல்லமைப்பில் அளிக்கிறது; τὰ πάντα என்பதற்கு ‘எல்லாவற்றையும்’ நேரான இணையாகும்.
theological_decisions:
- issue: மறைபொருளுடன் தொடர்புடைய οἰκονομία என்பதன் பொருள்
  choice: நிர்வாகம்
  alternative: பொறுப்பாட்சி; திட்டம்
  rationale: மறைபொருள் நடைமுறைப்படுத்தப்படும் ஒழுங்கு அல்லது செயல்பாட்டை இது குறிக்கிறது. பிற்காலச் சமய அமைப்பொன்றின் தொழில்நுட்பப் பொருளை இறக்குமதி செய்யாமல், வீட்டுப்பொறுப்பு/மேலாண்மை சார்ந்த மூலக் கருத்தைத் தக்கவைக்கிறது.
- issue: ἀπὸ τῶν αἰώνων என்பதன் காலப் பொருள்
  choice: காலங்களிலிருந்தே
  alternative: காலங்காலமாக; நித்தியத்திலிருந்து
  rationale: கிரேக்கம் நேரடியாக ‘காலங்கள்’ அல்லது ‘யுகங்கள்’ என்பதையே குறிப்பிடுகிறது; ‘நித்தியம்’ என்று வெளிப்படையாகக் கூறவில்லை. ஆகவே மூலத்திலுள்ள காலவியல் நுட்பத்தைத் தீர்த்துவிடாமல் வைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் தெளிவும் கொண்ட நடையைப் பயன்படுத்துகிறது. முந்தைய வசனத்தின் நோக்கத் தொடரைத் தொடரும் வினையெச்ச அமைப்பைக் காக்க இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. அடிக்குறி குறிகள் அவை விளக்கும் சொற்றொடர்களுக்கு உடனடியாக இணைக்கப்பட்டுள்ளன.
