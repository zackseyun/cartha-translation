  text: according to the eternal purpose that he accomplished in Messiah Jesus our Lord[c][b][a],
translation:
  language: ta
  text: அவர் நம் ஆண்டவராகிய மேசியா[c] இயேசுவில்[b] நிறைவேற்றிய நித்திய நோக்கத்தின்படி[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘காலங்களின் நோக்கத்தின்படி.’ கிரேக்கச் சொற்றொடர் இன்னும் நேரடியாக ‘காலங்களின் நோக்கம்’ என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மேசியா இயேசுவின் மூலம்.’ கிரேக்கத்தில் ‘-இல்’ என்று உள்ளது; சூழலில் அது கருவிப் பொருளிலும் புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
  - marker: c
    text: கிரேக்கத்தில் ‘கிறிஸ்து’; இங்கு அந்தச் சொல் ஒரு பட்டமாகச் செயல்படுவதால் ‘மேசியா’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ
  choice: நோக்கத்தின்படி
  rationale: κατά, குற்றுவேற்றுமையில் வரும் πρόθεσις என்பதுடன் இணைந்து, அதற்கு இசைவாக அல்லது அதன்படி நிகழ்வதைக் குறிக்கிறது; ‘-இன்படி’ என்பது இயல்பான தமிழ் வடிவம்.
- source_word: πρόθεσιν
  choice: நோக்கம்
  rationale: திட்டமிட்டு எடுத்த தீர்மானத்தையும் இலக்கையும் πρόθεσις குறிக்கிறது; ‘நோக்கம்’ இந்த இரு நுணுக்கங்களையும் சுருக்கமாகத் தருகிறது.
- source_word: τῶν αἰώνων
  choice: நித்திய
  rationale: சொல்லுக்குச் சொல் ‘காலங்களின்’ என்று இருந்தாலும், இங்கு கடவுளுடைய நோக்கத்தின் காலங்கடந்த தன்மையை இயல்பான தமிழில் ‘நித்திய’ தெரிவிக்கிறது; மூலத்தின் நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἣν
  choice: அவர் ... நிறைவேற்றிய
  rationale: பெண்பால் தொடர்புப்பெயர் πρόθεσις என்பதைக் குறிக்கிறது. தமிழில் தனித் தொடர்புப்பெயரை விட தொடர்பெச்ச அமைப்பு இயல்பாக இருப்பதால் ‘நிறைவேற்றிய’ என அமைக்கப்பட்டுள்ளது.
- source_word: ἐποίησεν
  choice: நிறைவேற்றிய
  rationale: ποιέω அடிப்படையில் ‘செய்தார்’ எனப் பொருள்பட்டாலும், ‘நோக்கம்’ என்பதுடன் இங்கு அதைச் செயலாக்கி நிறைவேற்றியதை ‘நிறைவேற்றிய’ தெளிவாகக் கூறுகிறது.
- source_word: ἐν
  choice: -இல்
  rationale: ἐν என்பதன் நேரடியான இடைச்சொல் பொருள் பாதுகாக்கப்படுகிறது. கருவிப் பொருளாக ‘மூலம்’ என்றும் புரிந்துகொள்ள வாய்ப்புள்ளது; அது அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: Χριστῷ
  choice: மேசியா
  rationale: Χριστός இங்கு பட்டமாகச் செயல்படுவதால், அதன் யூதப் பின்னணியையும் ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற பட்டப் பொருளையும் சுட்டும் வழக்கமான தமிழ் வடிவமான ‘மேசியா’ பயன்படுத்தப்படுகிறது.
- source_word: Ἰησοῦ
  choice: இயேசு
  rationale: தமிழில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: κυρίῳ
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான இயல்பான, மரியாதைமிக்க புதிய ஏற்பாட்டுத் தமிழ் இணைச்சொல்.
- source_word: ἡμῶν
  choice: நம்
  rationale: முதல் நபர் பன்மை உடைமையை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: πρόθεσιν τῶν αἰώνων என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘நித்திய நோக்கம்’
  alternative: ‘காலங்களின் நோக்கம்’
  rationale: τῶν αἰώνων என்பதன் வடிவம் நேரடியாக ‘காலங்களின்’ என்றாலும், சொற்றொடர் கடவுளுடைய காலங்கடந்த நோக்கத்தைக் குறிக்கிறது. வாசிக்க இயல்பான ‘நித்திய’ முதன்மை உரையில் வைக்கப்பட்டு, மூலத்தின் உருவகமான நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἐν τῷ Χριστῷ Ἰησοῦ என்பதில் ἐν-இன் வலிமை
  choice: ‘மேசியா இயேசுவில்’
  alternative: ‘மேசியா இயேசுவின் மூலம்’
  rationale: ἐν என்பதன் நேரடி வடிவத்தையும், மேசியாவுடன் உள்ள தொடர்பைச் சுட்டும் இறையியல் அழுத்தத்தையும் ‘-இல்’ காக்கிறது; கருவிப் பொருளைத் தீர்மானமாக்காமல் மாற்று வாசிப்பாக அடிக்குறிப்பில் தருகிறது.
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு சொல் வெறும் பெயர்க் கூறாக அல்லாமல் பட்டமாகத் தோன்றுவதால் ‘மேசியா’ அதன் பொருளையும் யூதப் பின்னணியையும் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வேதவசனத்திற்குரிய மரியாதைமிக்க ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் முந்தைய வாக்கியத்தைத் தொடரும் சார்பு கூறாக இருப்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. தமிழின் இயல்பான தொடர்பெச்ச வரிசைக்காக ‘அவர் ... நிறைவேற்றிய’ என அமைக்கப்பட்டாலும், மூலத்தின் பொருள் உறவுகள் காக்கப்பட்டுள்ளன.
