lexical_decisions:
- source_word: κατὰ ἀποκάλυψιν
  choice: வெளிப்படுத்துதலின் வழியாக
  rationale: κατά + ஏவல் வேற்றுமை இங்கு முறை அல்லது வழியைச் சுட்டுகிறது. ‘வழியாக’ என்பது இறைவனால் மறைக்கப்பட்ட ஒன்று வெளிப்படுத்தப்பட்டதன் மூலம் அறிவிக்கப்பட்டது என்ற பொருளை இயல்பான தமிழில் தருகிறது; செய்பவரை உரையில் இல்லாதவாறு வெளிப்படையாகச் சேர்ப்பதில்லை.
- source_word: ἐγνωρίσθη μοι
  choice: எனக்கு அறியச்செய்யப்பட்டது
  rationale: γνωρίζω வினையின் இறந்தகாலச் செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது. ‘எனக்கு வெளிப்படுத்தப்பட்டது’ என்பதும் சாத்தியம்; ஆனால் ἀποκάλυψις ஏற்கெனவே வெளிப்படுத்துதல் என்ற கருத்தைக் கொண்டிருப்பதால் தேவையற்ற மறுபடியுரைத்தலை இது தவிர்க்கிறது.
- source_word: τὸ μυστήριον
  choice: அந்த மறைபொருள்
  rationale: பவுலின் பயன்பாட்டில் μυστήριον என்பது முன்பு மறைந்திருந்து இப்போது வெளிப்படுத்தப்பட்ட இறை நோக்கைக் குறிக்கிறது. ‘மறைபொருள்’ என்பது புரியாத புதிர் என்ற எண்ணத்தைவிட, மறைக்கப்பட்டிருந்த பொருள் என்ற கருத்தைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது; அதன் உள்ளடக்கத்தை இவ்வசனத்திலேயே விரித்துரைக்கவில்லை.
- source_word: καθὼς
  choice: இதைக் குறித்து
  rationale: καθώς அடிப்படையில் ‘எப்படியோ/அதன்படியே’ என்ற ஒப்பீட்டுத் தொடர்பைத் தருகிறது. தமிழில் முந்தைய கூற்றுக்கும் முன் எழுதியதற்கும் உள்ள தொடர்பை இயல்பாக்க ‘இதைக் குறித்து’ என வழங்கப்படுகிறது; ஒப்பீட்டுச் சாயல் வாக்கிய அமைப்பில் தொடர்கிறது.
- source_word: προέγραψα
  choice: முன்பு … எழுதியிருந்தேன்
  rationale: இச்சூழலில் προγράφω இதே கடிதத்தில் முன்னதாக எழுதியதைக் குறிக்கிறது. ‘முன்பு எழுதியிருந்தேன்’ என்பது அந்தக் காலத் தொடர்பை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἐν ὀλίγῳ
  choice: சில வார்த்தைகளில்
  rationale: இந்தச் சொற்றொடர் சுருக்கமாக அல்லது சிறிதளவே எழுதியதைக் குறிக்கலாம். ‘சில வார்த்தைகளில்’ என்பது அதன் உருவக அமைப்பையும் சுருக்கத்தையும் வாசகருக்கு இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: பவுலின் பயன்பாட்டில் μυστήριον என்பதன் பொருள்
  choice: அந்த மறைபொருள்
  alternative: அந்த இரகசியம்; கடவுளின் மறைவான திட்டம்
  rationale: இவ்வசனம் கருத்தைப் பெயரிடுகிறது; அதன் முழு உள்ளடக்கத்தை இன்னும் வரையறுக்கவில்லை. ‘கடவுளின் மறைவான திட்டம்’ என்று விரித்துரைப்பது சுற்றுப்பகுதியிலுள்ள விளக்கத்தை முன்கூட்டியே இங்கு சேர்த்துவிடும். ‘மறைபொருள்’ என்பது மறைந்திருந்து வெளிப்படுத்தப்பட்ட இறை நோக்கம் என்ற பவுலின் கருத்தைத் தக்கவைக்கிறது.
- issue: அறியச்செய்த செயற்பாட்டாளர்
  choice: செயப்பாட்டு வடிவத்தைத் தக்கவைத்து, செயற்பாட்டாளரை வெளிப்படையாகப் பெயரிடாமல் விடுதல்
  alternative: கடவுள் எனக்கு அறியச்செய்தார்
  rationale: கிரேக்க உரையில் வினை செயப்பாட்டில் உள்ளது; செயற்பாட்டாளர் சூழலில் இறைவன் எனப் புரிந்தாலும் இவ்வசனத்தில் நேரடியாகப் பெயரிடப்படவில்லை. ஆகவே மூலத்தின் இறையியல் மறைமுகத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. செயப்பாட்டு வடிவமும் μυστήριον குறித்த இறையியல் செறிவும் பாதுகாக்கப்பட்டுள்ளன. வாக்கியம் பொதுவாசகருக்குப் புரியும்படி இயல்பாக்கப்பட்டாலும், மூலத்தில் இல்லாத செயற்பாட்டாளரோ மறைபொருளின் விரிவான விளக்கமோ சேர்க்கப்படவில்லை.
