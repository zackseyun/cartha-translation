revisions:
- from: வெளிப்படுத்துதலின் வழியாக அந்த மறைபொருள் எனக்கு அறியச்செய்யப்பட்டது[a]; இதைக் குறித்து முன்பு சில வார்த்தைகளில் எழுதியிருந்தேன்[b].
  to: வெளிப்படுத்துதலின் மூலம் மறைபொருள் எனக்கு அறியச்செய்யப்பட்டது[a], நான் முன்பு சுருக்கமாக எழுதியபடியே[b].
  rationale: The revision restores the comparative force of καθὼς with ‘எழுதியபடியே,’ uses a direct past form for προέγραψα, and smooths the revelation phrase while preserving the Greek passive and leaving its implied agent unnamed. The definite Greek noun is naturally expressed in Tamil without an added demonstrative, which could suggest stronger deixis than the source requires.
