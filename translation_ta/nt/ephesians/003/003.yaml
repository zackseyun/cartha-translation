    text: அல்லது, ‘வெளிப்படுத்துதலின்படி’ அல்லது ‘வெளிப்படுத்துதலால்.’ ‘மறைபொருள் எனக்கு வெளிப்படுத்தப்பட்டது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘சில வார்த்தைகளில்’ அல்லது ‘சுருக்கமாக.’
