translation:
  language: ta
  text: வெளிப்படுத்துதலின் மூலம் மறைபொருள் எனக்கு அறியச்செய்யப்பட்டது[a], நான் முன்பு சுருக்கமாக எழுதியபடியே[b].
  philosophy: optimal-equivalence
  footnotes:
