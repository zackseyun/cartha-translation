id: EPH.3.21
reference: Ephesians 3:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: αὐτῷ ἡ δόξα ἐν τῇ ἐκκλησίᾳ ⸀καὶ ἐν Χριστῷ Ἰησοῦ εἰς πάσας τὰς γενεὰς τοῦ αἰῶνος τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/021.yaml
  text: To him be glory in the church and in Messiah Jesus through all generations forever and ever[a]. Amen.
translation:
  language: ta
  text: திருச்சபையிலும் மேசியாவாகிய இயேசுவிலும்[a] எல்லாத் தலைமுறைகளிலும், என்றென்றைக்கும் அவருக்கு மகிமை உண்டாவதாக. ஆமென்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்து இயேசுவிலும்.” கிரேக்கப் பட்டப்பெயரான Χριστός என்பதன் பொருளைப் பாதுகாக்க இங்கு “மேசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτῷ ἡ δόξα
  choice: அவருக்கே மகிமை உண்டாவதாக
  rationale: வினைச்சொல் இல்லாத கிரேக்கத் துதிமொழியின் மகிமை உரித்தாக்கும் பொருளை இயல்பான தமிழ் வாழ்த்துவடிவில் தருகிறது; ‘அவருக்கே’ என்பது வலியுறுத்தலையும் தெளிவாக்குகிறது.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: திருச்சபையில்
  rationale: ἐκκλησία இங்கு இறைவனுடைய மக்கள் சமூகத்தைக் குறிக்கிறது. நிறுவப்பட்ட தமிழ் வேதாகமச் சொல்லான ‘திருச்சபை’ இயல்பாகவும் கண்ணியமாகவும் உள்ளது; ἐν என்பதற்கு ‘இல்’ வடிவம் பாதுகாக்கப்படுகிறது.
- source_word: καὶ ἐν Χριστῷ Ἰησοῦ
  choice: மேசியாவாகிய இயேசுவிலும்
  rationale: Χριστός என்பதன் பட்டப்பெயர்ப் பொருளை ‘மேசியா’ எனப் பாதுகாக்கிறது. ‘ஆகிய’ என்பது தமிழில் பட்டத்தையும் இயற்பெயரையும் தெளிவாக இணைக்கிறது; இணைநிலை ἐν ... καὶ ἐν அமைப்பு ‘திருச்சபையிலும் ... இயேசுவிலும்’ எனத் தக்கவைக்கப்படுகிறது.
- source_word: εἰς πάσας τὰς γενεὰς
  choice: தலைமுறை தலைமுறையாக
  rationale: எல்லாத் தலைமுறைகளிலும் தொடரும் காலவிரிவை இயல்பான தமிழ் மரபுத்தொடராக வெளிப்படுத்துகிறது.
- source_word: τοῦ αἰῶνος τῶν αἰώνων
  choice: என்றென்றைக்கும்
  rationale: சொல்லுக்குச் சொல் ‘யுகங்களின் யுகம்’ என்பது நவீன தமிழில் தெளிவற்றது; இக்கிரேக்க மிகையுயர்வுத் தொடர் குறிக்கும் முடிவில்லாத காலத்தை ‘என்றென்றைக்கும்’ இயல்பாகத் தருகிறது.
- source_word: ἀμήν
  choice: ஆமென்
  rationale: வழிபாட்டு உறுதிமொழிக்கான பரவலாக அறியப்பட்ட தமிழ் ஒலிபெயர்ப்பு.
theological_decisions:
- issue: Χριστῷ என்பதைப் பட்டப்பெயராகவா, பெயர்போன்ற மரபுவடிவாகவா மொழிபெயர்ப்பது
  choice: மேசியாவாகிய இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: Χριστός இங்கு அர்த்தமுள்ள பட்டப்பெயராக உள்ளது. ‘மேசியா’ அதன் அபிஷேகம் பெற்றவர் என்ற பட்டப்பெயர்ப் பொருளைப் பாதுகாக்கிறது; ‘கிறிஸ்து இயேசு’ என்ற வழக்கமான மாற்றும் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἐν என்பதன் இரு இணைநிலைப் பயன்பாடுகள்
  choice: திருச்சபையிலும் மேசியாவாகிய இயேசுவிலும்
  alternative: திருச்சபையின் மூலமாகவும் மேசியாவாகிய இயேசுவின் மூலமாகவும்
  rationale: கிரேக்கத்தின் ‘ἐν ... καὶ ἐν ...’ இணைநிலையையும் அதன் பரந்த பொருள் சாத்தியத்தையும் ‘இல்’ வேற்றுமை பாதுகாக்கிறது; ‘மூலமாக’ என்று கருவிப் பொருளை மட்டும் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான துதிமொழி நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க இணைநிலை அமைப்பை இயல்பான ‘-இலும் ... -இலும்’ வடிவில் பாதுகாத்து, காலத்தொடரைத் தமிழ் வழக்கிற்கு ஏற்றவாறு அமைத்துள்ளது. அடிக்குறி [a] முதன்மை உரையில் இடம்பெற்றுள்ளது.
