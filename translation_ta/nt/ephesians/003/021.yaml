revisions:
- from: திருச்சபையிலும் மேசியாவாகிய இயேசுவிலும் தலைமுறை தலைமுறையாக என்றென்றைக்கும் அவருக்கே மகிமை உண்டாவதாக.[a] ஆமென்.
  to: திருச்சபையிலும் மேசியாவாகிய இயேசுவிலும்[a] எல்லாத் தலைமுறைகளிலும், என்றென்றைக்கும் அவருக்கு மகிமை உண்டாவதாக. ஆமென்.
  rationale: The revision removes added exclusivity, explicitly renders 'all generations,' and relocates the alternative-rendering footnote anchor to 'Messiah Jesus.' It preserves the source's parallel locative phrases and the conventional Tamil doxological form.
