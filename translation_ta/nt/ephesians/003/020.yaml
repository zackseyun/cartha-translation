source:
  edition: SBLGNT
  text: Τῷ δὲ δυναμένῳ ὑπὲρ πάντα ποιῆσαι ὑπερεκπερισσοῦ ὧν αἰτούμεθα ἢ νοοῦμεν κατὰ τὴν δύναμιν τὴν ἐνεργουμένην ἐν ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/020.yaml
  text: To the one who is able to do far beyond all that we ask or think[a], according to the power at work in us[b],
translation:
  language: ta
  text: நாம் கேட்பவை அல்லது நினைப்பவை[b] எல்லாவற்றையும் விட அளவுக்கு மீறி அதிகமாகச் செய்ய[a] வல்லவருக்கு, நமக்குள்[c] செயல்படும் வல்லமையின்படி,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அளவுக்கு மீறி அதிகமாக’ என்பதற்கு ‘மிக மிக அதிகமாக’ அல்லது ‘அளவுக்கு அப்பாற்பட்டு’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் கேட்பதையும் நினைப்பதையும் மீறிச் செய்யும் மிகுதியை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘நினைப்பவை’ என்பதற்கு இங்கு ‘மனதில் கற்பனை செய்பவை’ அல்லது ‘எண்ணிப் பார்க்கிறவை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘நமக்குள்’ என்பதற்கு ‘நம்மிடையே’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῷ ... δυναμένῳ
  choice: செய்ய வல்லவருக்கு
  rationale: வேற்றுமை உருபுடன் வரும் பெயர்ச்சொல் தன்மையுடைய பங்கேற்புவினையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; கிரேக்கத்தில் இல்லாத ‘தேவன்’ என்ற பெயரை இங்கே சேர்க்கவில்லை.
- source_word: δὲ
  choice: தனிச் சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது வலுவான எதிர்மறையைக் காட்டாமல் துதிமொழிக்கான மெல்லிய உரைமாற்றத்தைக் குறிக்கிறது. வசனம் முந்தைய வாக்கியத்தின் தொடராக இருப்பதால் தமிழில் தனி இணைப்புச்சொல் சேர்ப்பது தேவையில்லை.
- source_word: ὑπὲρ πάντα ... ὑπερεκπερισσοῦ
  choice: அனைத்திற்கும் அப்பாற்பட்டு, அளவுகடந்த மிகுதியாக
  rationale: ὑπέρ தரும் எல்லைமீறும் ஒப்பீட்டையும், ὑπερεκπερισσοῦ தரும் வலுவூட்டப்பட்ட அளவுமீறிய மிகுதியையும் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ποιῆσαι
  choice: செய்ய
  rationale: மூலத்தின் பரந்த, எளிய பொருளைத் தக்கவைக்கிறது; ‘நிறைவேற்ற’ போன்ற குறிப்பான விளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: ὧν αἰτούμεθα ἢ νοοῦμεν
  choice: நாம் கேட்பவை அல்லது நினைப்பவை
  rationale: αἰτέω என்பதற்கு ‘கேட்பது’ என்றும், νοέω என்பதற்கு மனதில் நினைத்தல் அல்லது கருத்தில் கொள்ளுதல் என்ற பரந்த பொருளைத் தக்கவைக்கும் ‘நினைப்பது’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: κατὰ τὴν δύναμιν
  choice: வல்லமையின்படி
  rationale: κατά இங்கு வெறும் கருவியை அல்ல, செயல் நிகழும் அளவையோ நியமத்தையோ குறிக்கிறது; ‘மூலம்’ என்பதைக் காட்டிலும் ‘இன்படி’ அந்த நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: τὴν ἐνεργουμένην
  choice: செயல்படுகிற
  rationale: வல்லமை தற்போது தொடர்ந்து பயனுறச் செயல்படுவதைக் காட்டும் பங்கேற்புவினையின் நிகழ்காலத் தன்மையை இயல்பான தமிழில் தருகிறது.
- source_word: ἐν ἡμῖν
  choice: நமக்குள்
  rationale: விசுவாசிகளுக்குள் அல்லது அவர்களின் சமூகத்துக்குள் செயல்படும் வல்லமையைத் திறந்த வகையில் கூறுகிறது; ‘நம்மிடையே’ என்பதும் சூழல்படி சாத்தியம்.
theological_decisions:
- issue: துதிக்குரியவரின் மறைமுகக் குறிப்பு
  choice: ‘வல்லவருக்கு’ என்று மட்டும் மொழிபெயர்த்து, ‘தேவன்’ என்பதைச் சேர்க்கவில்லை
  alternative: ‘செய்ய வல்ல தேவனுக்கு’
  rationale: சூழல் தேவனைக் குறிப்பதாக இருந்தாலும், இந்த வசனத்தில் கிரேக்க மூலம் ‘தேவன்’ என்ற பெயரைத் திரும்பக் கூறவில்லை. அடுத்த வசனத்திற்குத் தொடரும் துதிமொழியின் இலக்கண அமைப்பு இவ்வாறு பாதுகாக்கப்படுகிறது.
- issue: விசுவாசிகளுடன் தொடர்புடைய தெய்வீக வல்லமையின் செயல்பாடு
  choice: ‘நமக்குள் செயல்படுகிற வல்லமை’
  alternative: ‘நம்மிடையே செயல்படுகிற வல்லமை’
  rationale: விசுவாசிகளுக்குள் பயனுறச் செயல்படும் வல்லமையை உறுதிப்படுத்துகிறது; அதே நேரத்தில் பரிசுத்தமாக்கல் அல்லது ஆவிக்குரிய வரங்கள் குறித்த எந்த ஒரு பிரிவுசார் விளக்கத்தையும் திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், துதிமொழிக்குரிய கண்ணியத்தையும் பொதுவாசகர்களுக்கான தெளிவையும் இணைக்கும் நடை. வசனம் 21ஆம் வசனத்தில் நிறைவுபெறும் வாக்கியத்தின் ஒரு பகுதி என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
