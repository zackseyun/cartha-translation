id: EPH.3.4
reference: Ephesians 3:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πρὸς ὃ δύνασθε ἀναγινώσκοντες νοῆσαι τὴν σύνεσίν μου ἐν τῷ μυστηρίῳ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/004.yaml
  text: By reading this[a], you are able to understand my insight into the mystery of Messiah,
translation:
  language: ta
  text: இதை வாசிப்பதன் மூலம், மேசியாவின் மறைபொருளைக் குறித்த எனக்குள்ள புரிதலை நீங்கள் புரிந்துகொள்ள முடியும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρὸς ὃ … ἀναγινώσκοντες
  choice: இதை வாசிப்பதன் மூலம்
  rationale: πρὸς ὃ முந்தைய வசனங்களில் பவுல் எழுதியதைக் குறிக்கிறது; ἀναγινώσκοντες உடன் சேர்த்து, வாசிப்பதே புரிந்துகொள்வதற்கான வழி என்ற பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δύνασθε
  choice: முடியும்
  rationale: வாசகர்களுக்குள்ள திறன் அல்லது சாத்தியத்தைக் குறிக்கும் எளிய, இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: νοῆσαι
  choice: அறிந்துகொள்ள
  rationale: மனத்தால் உணர்ந்து புரிந்துகொள்வதைக் குறிக்கிறது; அடுத்து வரும் σύνεσις என்பதுடன் தேவையற்ற சொல் மறுபடியும் வருவதைத் தவிர்க்கிறது.
- source_word: τὴν σύνεσίν μου
  choice: எனது புரிந்துணர்வை
  rationale: பவுலுக்குள்ள ஆழமான புரிதல் அல்லது உட்கருத்துணர்வைக் குறிக்கிறது; 'எனது' என்பது μου என்ற உடைமைப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐν τῷ μυστηρίῳ
  choice: மறைபொருளைக் குறித்த
  rationale: ἐν இங்கு புரிந்துணர்வின் துறை அல்லது பொருளைக் குறிக்கிறது. தமிழில் 'குறித்த' என்பது அந்த உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τοῦ Χριστοῦ
  choice: மேசியாவின்
  rationale: Χριστός இங்கு பட்டப்பெயராகச் செயல்படுவதால் அதன் பொருளைத் தரும் 'மேசியா' பயன்படுத்தப்பட்டுள்ளது; கிரேக்க மரபுத்தொடரின் உறவைத் தீர்மானித்து விடாமல் தமிழின் உடைமை வடிவம் பாதுகாக்கிறது.
theological_decisions:
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மேசியாவின்
  alternative: கிறிஸ்துவின்
  rationale: Χριστός என்பது 'அபிஷேகம் செய்யப்பட்டவர்' என்ற பட்டப்பெயர்; இச்சூழலில் அதன் பொருளைத் தெளிவாக்க 'மேசியா' முதன்மை உரையில் இடப்பட்டுள்ளது. மரபுவழி வடிவமான 'கிறிஸ்து' அடிக்குறிப்பில் தரப்படுகிறது.
- issue: τοῦ Χριστοῦ என்ற உருபுத்தொடரின் உறவு
  choice: மேசியாவின் மறைபொருள்
  alternative: மேசியாவைக் குறித்த மறைபொருள்
  rationale: கிரேக்கப் பிறப்புவேற்றுமை உருபு, மறைபொருள் மேசியாவுக்குரியது என்பதையோ அவரைக் குறித்தது என்பதையோ சுட்டலாம். முதன்மை உரையின் உடைமை அமைப்பு இந்தத் தெளிவின்மையை ஓரளவு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதே நேரத்தில் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. 'மறைபொருள்' என்பது வெளிப்படுத்தப்பட்ட தெய்வீக இரகசியம் என்ற சூழல்பொருளைச் சுமக்கிறது; வெறும் புரியாத புதிர் என்ற எண்ணத்தை முன்னிறுத்தவில்லை.
