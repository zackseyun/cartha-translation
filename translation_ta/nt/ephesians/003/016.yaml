revisions:
- from: தமது மகிமையின் செல்வ வளத்திற்கு ஏற்றபடி, தமது ஆவியின் மூலமாக வல்லமையால் உங்கள் உள்ளான மனிதனில்[a] நீங்கள் பலப்படுத்தப்பட அவர் உங்களுக்கு அருளவேண்டும் என்று,
  to: தமது மகிமையின் செல்வத்திற்கு ஏற்ப, தமது ஆவியின் மூலம் வல்லமையால் உங்கள் உள்ளான மனிதனில் நீங்கள் பலப்படுத்தப்படுவதற்கு அவர் உங்களுக்கு அருளவேண்டும் என்று,
