reference: Ephesians 3:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἵνα ⸀δῷ ὑμῖν κατὰ ⸂τὸ πλοῦτος⸃ τῆς δόξης αὐτοῦ δυνάμει κραταιωθῆναι διὰ τοῦ πνεύματος αὐτοῦ εἰς τὸν ἔσω ἄνθρωπον,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/016.yaml
  text: that he may grant you[a], according to the riches of his glory, to be strengthened with power through his Spirit in the inner man,
translation:
  language: ta
  text: தமது மகிமையின் செல்வத்திற்கு ஏற்ப, தமது ஆவியின் மூலம் வல்லமையால் உங்கள் உள்ளான மனிதனில் நீங்கள் பலப்படுத்தப்படுவதற்கு அவர் உங்களுக்கு அருளவேண்டும் என்று,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: என்று
  rationale: முந்தைய வசனங்களில் தொடங்கிய பவுலின் வேண்டுதலின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் இணைப்பாக இங்கு இயல்பாக அமைகிறது; வசனம் ஒரு சார்பு வாக்கியமாக இருப்பதையும் காக்கிறது.
- source_word: δῷ
  choice: அவர் உங்களுக்கு அருளவேண்டும்
  rationale: δίδωμι என்பதன் வேண்டுதல் சூழலிலான பொருளை ‘அருளவேண்டும்’ இயல்பாக வெளிப்படுத்துகிறது; கொடுப்பவர் தேவன் என்பதையும் பெறுபவர்கள் வாசகர்கள் என்பதையும் தெளிவாக்குகிறது.
- source_word: κατὰ τὸ πλοῦτος τῆς δόξης αὐτοῦ
  choice: தமது மகிமையின் செல்வ வளத்திற்கு ஏற்றபடி
  rationale: κατά குறிக்கும் அளவுகோல் அல்லது தரத்தைக் ‘ஏற்றபடி’ காக்கிறது. πλοῦτος என்பதன் நிறைவையும் வளத்தையும் ‘செல்வ வளம்’ தற்போதைய தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: δυνάμει
  choice: வல்லமையால்
  rationale: பலப்படுத்துதலுக்கான வழிமுறை அல்லது கருவியைக் குறிக்கும் வேற்றுமைப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: κραταιωθῆναι
  choice: பலப்படுத்தப்பட
  rationale: வலிமையாக்கப்படுதல் என்ற பொருளையும் கிரேக்கச் சொல்லின் செயப்பாட்டு வடிவத்தையும் காக்கிறது.
- source_word: διὰ τοῦ πνεύματος αὐτοῦ
  choice: தமது ஆவியின் மூலமாக
  rationale: διά உடன் வரும் கருவி அல்லது செயலாண்மை பொருளை ‘மூலமாக’ தெளிவாகக் காட்டுகிறது. சூழலில் இது தேவனுடைய ஆவியைக் குறிக்கிறது.
- source_word: εἰς τὸν ἔσω ἄνθρωπον
  choice: உங்கள் உள்ளான மனிதனில்
  rationale: பலப்படுத்துதல் நிகழும் உள்ளார்ந்த மனித இயல்பைச் சுட்டுகிறது. ἄνθρωπος ஆண் பாலிலக்கண ஒருமையாக இருந்தாலும் இங்கு எல்லா மனிதர்களையும் பிரதிநிதித்துவப்படுத்துகிறது; மூலத்தின் தனித்துவமான உருவகத்தை மொழிபெயர்ப்பில் காக்கிறது.
theological_decisions:
- issue: πνεῦμα என்பதன் குறிப்பு
  choice: தேவனுடைய ஆவி — ‘தமது ஆவி’
  alternative: தனிப்பட்ட ஆளாக அல்லாத தெய்வீக ஆற்றல் அல்லது செல்வாக்கு
  rationale: பவுலின் சூழலும் ‘அவருடைய ஆவி’ என்ற உடைமைத் தொடரும் விசுவாசிகளில் செயல்படும் தேவனுடைய ஆவியை வலுவாகச் சுட்டுகின்றன. மொழிபெயர்ப்பு கிரேக்கத்தில் உள்ள எளிய ‘தமது ஆவி’ என்ற வடிவையே காக்கிறது.
- issue: ἔσω ἄνθρωπον என்பதன் மொழிபெயர்ப்பு
  choice: உள்ளான மனிதன்
  alternative: உள்ளான ஆளுமை / உள்ளார்ந்த தன்மை
  rationale: இது உட்புறமான சுயத்தைச் சுட்டும் பிரதிநிதித்துவ ஒருமை. மூலத்தின் பவுலிய உருவகத்தை முதன்மை உரையில் காத்து, பாலினத் தனிப்பொருள் நோக்கப்படவில்லை என்பதை அடிக்குறிப்பு விளக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் வேதாகமச் செறிவும் காக்கப்பட்டுள்ளன. முந்தைய வசனத்திலிருந்து தொடரும் வேண்டுதல் என்பதால் வசனம் சார்பு வாக்கியமாகவும் இறுதியில் காற்புள்ளியுடனும் வைக்கப்பட்டுள்ளது. ‘உள்ளான மனிதன்’ என்ற மூல உருவகம் முதன்மை உரையில் காக்கப்பட்டு, அதன் அனைவரையும் உள்ளடக்கும் பொருள் அடிக்குறிப்பில் தெளிவாக்கப்பட்டுள்ளது.
