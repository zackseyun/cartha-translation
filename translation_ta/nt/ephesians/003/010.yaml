lexical_decisions:
- source_word: ἵνα
  choice: என்பதற்காகவே
  rationale: நோக்கத்தைக் குறிக்கும் இணைப்புச் சொல்லின் வலிமையைப் பாதுகாக்கிறது; முந்தைய வசனத்தோடு இயல்பாக இணையும் வகையில் வாக்கிய இறுதியில் அமைக்கப்பட்டுள்ளது.
- source_word: γνωρισθῇ
  choice: தெரியப்படுத்தப்பட வேண்டும்
  rationale: இறந்தகாலச் செயப்பாட்டு வினைமுறையும் ἵνα உடன் வரும் நோக்க நுணுக்கமும் தமிழில் தெளிவாக வெளிப்படுகின்றன; இது கட்டளையைக் காட்டாமல் நோக்கப்பட்ட விளைவைச் சுட்டுகிறது.
- source_word: νῦν
  choice: இப்போது
  rationale: காலத்தைக் குறிக்கும் சொல்லின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: ταῖς ἀρχαῖς καὶ ταῖς ἐξουσίαις
  choice: ஆட்சியாளர்களுக்கும் அதிகாரங்களுக்கும்
  rationale: இரு வேறுபட்ட சொற்களையும் காக்கிறது; அவற்றை முதன்மை உரையிலேயே ‘தேவதூதர்கள்’ அல்லது ‘தீய ஆவிகள்’ என்று குறுக்கி விளக்கவில்லை.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: பரலோக மண்டலங்களிலுள்ள
  rationale: எபேசியரில் காணப்படும் பரலோகத் தளத்தைக் குறிக்கும் சொற்றொடரை இயல்பான தமிழில் இடவியல் மிகைப்படுத்தலின்றி வழங்குகிறது.
- source_word: διὰ τῆς ἐκκλησίας
  choice: திருச்சபையின் வழியாக
  rationale: διά + genitive குறிக்கும் கருவி அல்லது ஊடகப் பொருளைப் பாதுகாக்கிறது.
- source_word: ἡ πολυποίκιλος σοφία
  choice: பல்வகைப்பட்ட ஞானம்
  rationale: πολυποίκιλος என்பதிலுள்ள பல பரிமாணங்கள், செறிவான வேறுபாடு ஆகிய கருத்துகளை எளிதில் புரியும் நவீன தமிழில் தருகிறது.
- source_word: τοῦ θεοῦ
  choice: கடவுளுடைய
  rationale: ஞானம் கடவுளுக்குரியது என்பதைத் தெரிவிக்கும் இயல்பான உடைமை வடிவம்.
theological_decisions:
- issue: ‘ஆட்சியாளர்களும் அதிகாரங்களும்’ என்போரின் அடையாளம்
  choice: முதன்மை உரையில் பொதுவான சொற்கள் காக்கப்பட்டு, அடிக்குறிப்பில் அண்டம்சார் அல்லது ஆவிக்குரிய வல்லமைகள் என்பதே சூழலுக்குப் பொருத்தமானது எனக் குறிப்பிடப்பட்டுள்ளது.
  alternative: மனித அரசியல் ஆட்சியாளர்கள் மட்டும்; அல்லது பூமிக்குரியவர்களையும் பரலோகத்துக்குரியவர்களையும் உள்ளடக்கும் பரந்த குறிப்பு.
  rationale: ‘பரலோக மண்டலங்களிலுள்ள’ என்ற வரையறையும் பவுலின் வழக்கமான சொல் இணைப்பும் மனிதருக்கு அப்பாற்பட்ட வல்லமைகளை வலுவாகச் சுட்டுகின்றன. எனினும், அவர்களின் இயல்பை முதன்மை உரை சொல்லாத அளவுக்கு மொழிபெயர்ப்பு குறிப்பாக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, வாசிக்க எளிய நடை. கிரேக்க வாக்கியத்தின் நோக்க அமைப்பைத் தமிழில் இயல்பாக்க வினைச்சொல் இறுதியில் வைக்கப்பட்டுள்ளது. இந்த வசனம் முந்தைய வாக்கியத்தைத் தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
