translation:
  language: ta
  text: இப்போது, திருச்சபையின் வழியாக, கடவுளுடைய பன்முகமான ஞானம் பரலோக மண்டலங்களிலுள்ள[a] ஆட்சியாளர்களுக்கும் அதிகாரங்களுக்கும்[b] அறிவிக்கப்படும்படியாக,
