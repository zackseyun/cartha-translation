revisions:
- from: இப்போது, திருச்சபையின் வழியாக, கடவுளுடைய பல்வகைப்பட்ட ஞானம் பரலோக மண்டலங்களிலுள்ள[a] ஆட்சியாளர்களுக்கும் அதிகாரங்களுக்கும்[b] தெரியப்படுத்தப்பட வேண்டும் என்பதற்காகவே,
  to: இப்போது, திருச்சபையின் வழியாக, கடவுளுடைய பன்முகமான ஞானம் பரலோக மண்டலங்களிலுள்ள[a] ஆட்சியாளர்களுக்கும் அதிகாரங்களுக்கும்[b] அறிவிக்கப்படும்படியாக,
  rationale: The revision removes the unintended necessity sense introduced by “வேண்டும்” and uses a Tamil purpose construction corresponding to ἵνα + subjunctive. It also adopts “பன்முகமான” for a more natural modern-Tamil expression of God’s many-faceted wisdom. The text remains a dependent clause and therefore retains the closing comma.
