id: EPH.3.14
reference: Ephesians 3:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τούτου χάριν κάμπτω τὰ γόνατά μου πρὸς τὸν ⸀πατέρα,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/014.yaml
  text: For this reason I bend my knees to the Father,
translation:
  language: ta
  text: இதன் காரணமாக நான் தந்தையை நோக்கி என் முழங்கால்களை மடக்குகிறேன்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τούτου χάριν
  choice: இதன் காரணமாக
  rationale: இந்த சொற்றொடர் தொடர்ந்து வருகிற செயலுக்கான காரணத்தை முந்திய உரையுடன் இணைக்கிறது. ‘இதன் காரணமாக’ என்பது அந்த உரையாடல் தொடர்பை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: κάμπτω
  choice: மடக்குகிறேன்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘வளைத்தல்/மடக்குதல்.’ ‘என் முழங்கால்களை’ என்ற வெளிப்படையான செயப்படுபொருளுடன் ‘மடக்குகிறேன்’ என்பது கிரேக்க உருவகத்தைத் தக்கவைக்கிறது; ‘முழங்கால்படியிடுகிறேன்’ என்று சொல்வது செயலைச் சுருக்கி விளக்குவதாகிவிடும்.
- source_word: τὰ γόνατά μου
  choice: என் முழங்கால்களை
  rationale: உடல் உறுப்பைக் குறிப்பிடும் கிரேக்கச் சொற்றொடரை இயல்பான தமிழில் நேரடியாகத் தக்கவைத்து, ஜெபத்தின் உடல் நிலையை வெளிப்படுத்துகிறது.
- source_word: πρὸς
  choice: நோக்கி
  rationale: இங்கு πρός என்பது ஜெபம் யாரை நோக்கிச் செலுத்தப்படுகிறது என்பதைக் காட்டுகிறது. ‘நோக்கி’ திசை/முகப்பைத் தக்கவைக்கிறது; ‘முன்பாக’ என்பது மூலத்தில் கட்டாயமில்லாத கூடுதல் நுணுக்கத்தைச் சேர்க்கலாம்.
- source_word: πατέρα
  choice: தந்தையை
  rationale: சூழலில் இது ஜெபம் செலுத்தப்படும் கடவுளைக் குறிக்கிறது. தமிழ் எழுத்துமுறையில் பெரிய எழுத்து வேறுபாடு இல்லாததால், திட்டவட்டமான ‘தந்தையை’ என்பதும் சூழலும் தெய்வீகக் குறிப்பை வெளிப்படுத்துகின்றன.
theological_decisions:
- issue: πατέρα என்பதைத் தெய்வீகப் பட்டப்பெயராக மொழிபெயர்க்க வேண்டுமா
  choice: தந்தையை
  alternative: ஒரு தந்தையை / தகப்பனை
  rationale: பவுல் கடவுளை நோக்கிச் செய்யும் ஜெபத்தை இச்சூழல் விவரிக்கிறது; அடுத்த வசனமும் தந்தை என்ற மொழியை விரிவாக்குகிறது. எனவே திட்டவட்டமான ‘தந்தையை’ என்பது குறிப்பிட்ட தெய்வீக நபரைக் காட்டுகிறது; அதற்கு அப்பாற்பட்ட விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடை. கிரேக்கத்தின் ‘முழங்கால்களை மடக்குதல்’ என்ற வெளிப்படையான உடல் உருவகம் பாதுகாக்கப்பட்டுள்ளது. வசனம் அடுத்த வாக்கியத்துக்குத் தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
