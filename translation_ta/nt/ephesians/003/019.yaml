  text: γνῶναί τε τὴν ὑπερβάλλουσαν τῆς γνώσεως ἀγάπην τοῦ Χριστοῦ, ἵνα πληρωθῆτε εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/019.yaml
  text: and to know the love of Messiah that surpasses knowledge[b][a], so that you may be filled unto all the fullness of God.
translation:
  language: ta
  text: மேலும், அறிவை விஞ்சும் மேசியாவின்[a] அன்பை அறிந்துகொள்ளவும், கடவுளின் முழு நிறைவை நோக்கி நீங்கள் நிரப்பப்படும்படியாகவும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, மரபாக, “கிறிஸ்துவின்.”
    reason: alternative_reading
lexical_decisions:
- source_word: γνῶναί
  choice: அறிந்துகொள்ளவும்
  rationale: γινώσκω என்பதன் நேரடியான பொருளைத் தக்கவைத்து, சூழலில் அறிவுசார் அறிதலையும் அனுபவத்தில் அறிதலையும் உள்ளடக்க இடமளிக்கிறது.
- source_word: τε
  choice: மேலும்
  rationale: முந்தைய வேண்டுதலோடு இந்த வினையெச்சக் கருத்தை மென்மையாக இணைக்கும் தொடர்ச்சியை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ὑπερβάλλουσαν τῆς γνώσεως
  choice: அறிவை விஞ்சும்
  rationale: ‘அறிந்துகொள்ள’ என்பதற்கும் ‘அறிவு’ என்பதற்கும் இடையிலான சொற்பொருள் தொடர்பையும், அறிவை விஞ்சுவதை அறிதல் என்ற பவுலின் முரண்தோற்றத்தையும் காக்கிறது.
- source_word: ἀγάπην τοῦ Χριστοῦ
  choice: மேசியாவின் அன்பை
  rationale: Χριστός என்பதை அதன் பட்டப்பெயர் சார்ந்த பொருளுடன் ‘மேசியா’ என்று மொழிபெயர்த்து, தெளிவுபடுத்தாமல் கிரேக்க உரையின் உரிமை/நோக்கு வேற்றுமைத் திறந்தநிலையைத் தக்கவைக்கிறது.
- source_word: ἵνα
  choice: அதன் மூலம்
  rationale: இங்கு நோக்கத்தையும் விளைவையும் இணைக்கும் ἵνα என்பதன் விசையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; இரண்டிற்கும் இடையிலான எல்லையை மிகையாகத் தீர்மானிக்கவில்லை.
- source_word: πληρωθῆτε
  choice: நீங்கள் நிரப்பப்படவும் வேண்டும்
  rationale: இறந்தகாலச் செயப்பாட்டு வாய்பாட்டு வடிவத்தைத் தெளிவாகப் பிரதிபலிக்கிறது; ‘நிறைவேற்றப்படுதல்’ போன்ற வேறு பொருட்களுக்குச் செல்லாமல் இருக்கிறது.
- source_word: εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ
  choice: கடவுளின் முழுநிறைவு அனைத்தையும் அடையும் அளவுக்கு
  rationale: εἰς என்பதிலுள்ள இலக்கு நோக்கிய இயக்கத்தை இயல்பான தமிழில் காட்டி, சுருக்கமான கிரேக்கத் தொடரின் உயர்ந்த கருத்தை ‘நிரப்பப்படுதல்’ என்ற எளிய உடனிகழ்வுப் பொருளாக மட்டுப்படுத்தாமல் காக்கிறது.
theological_decisions:
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மேசியாவின்
  alternative: கிறிஸ்துவின்
  rationale: Χριστός இங்கு பட்டப்பெயரின் பொருளைத் தக்கவைத்திருப்பதால் ‘மேசியா’ முதன்மை உரையில் பயன்படுத்தப்படுகிறது; வழக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ‘மேசியாவின் அன்பு’ என்பதிலுள்ள வேற்றுமைப் பொருள்
  choice: மேசியாவின் அன்பு என்று முறையாகவே திறந்த நிலையில் விடப்பட்டது
  alternative: மேசியா நம்மீது வைத்திருக்கும் அன்பு / மேசியாவின்மீது வைத்திருக்கும் அன்பு
  rationale: சூழல் மேசியா விசுவாசிகள்மீது காட்டும் அன்பை வலுவாகச் சுட்டினாலும், கிரேக்க உரையின் மரபுத்தொடர் அதை இலக்கண ரீதியாக வெளிப்படையாகத் தீர்மானிப்பதில்லை.
- issue: εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ என்பதன் கருத்து
  choice: கடவுளின் முழுநிறைவு அனைத்தையும் அடையும் அளவுக்கு நிரப்பப்படுதல்
  alternative: கடவுளின் முழுநிறைவு அனைத்தாலும் நிரப்பப்படுதல்
  rationale: εἰς என்பதன் இலக்கு நோக்கிய விசையைத் தக்கவைத்து, மனிதர்கள் கடவுளோடு சாராம்ச ரீதியாக ஒன்றாகிவிடுகிறார்கள் என்ற கருத்தை உரைக்குள் சேர்க்காமல் பவுலின் செறிவான சொல்லமைப்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஜெபத்தின் உயர்ந்த ஆனால் புரிந்துகொள்ளத்தக்க நடையைப் பேணுகிறது. ‘அறிந்துகொள்ள’/‘அறிவு’ என்ற தொடர்பும், ‘அறிவை விஞ்சும் அன்பை அறிதல்’ என்ற திட்டமிட்ட முரண்தோற்றமும் காக்கப்பட்டுள்ளன. ‘முழுநிறைவு’ என்பது πλήρωμα என்பதற்கான செறிவான இறையியல் சொல்; அதை விளக்கிப் பரப்பாமல் முதன்மை உரையில் வைத்திருக்கிறது.
