revisions:
- from: மேலும், அறிவை விஞ்சும் மேசியாவின்[a] அன்பை அறிந்துகொள்ளவும், அதன் மூலம் கடவுளின் முழுநிறைவு அனைத்தையும் அடையும் அளவுக்கு நீங்கள் நிரப்பப்படவும் வேண்டும்.[b]
  to: மேலும், அறிவை விஞ்சும் மேசியாவின்[a] அன்பை அறிந்துகொள்ளவும், கடவுளின் முழு நிறைவை நோக்கி நீங்கள் நிரப்பப்படும்படியாகவும்.
  rationale: The revision renders ἵνα with ‘நிரப்பப்படும்படியாகவும்,’ preserving purpose/result without adding instrumentality or obligation. ‘நோக்கி’ reflects εἰς as directional while retaining the compressed and elevated character of the Greek. Footnote b is corrected to state the Greek construction accurately and to remove the unwarranted modal ‘வேண்டும்.’
