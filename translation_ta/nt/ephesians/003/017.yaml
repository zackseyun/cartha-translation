- source_word: κατοικῆσαι
  choice: குடியிருக்கவும்
  rationale: முந்தைய வேண்டுதல் தொடருடன் சார்ந்த நோக்கம் அல்லது விளைவைக் காட்டும் இறந்தகால வினையெச்ச infinitive. தற்காலிகமாக இருப்பதைவிட நிலையான குடியிருப்பைக் குறிக்கும் பொருளை இச்சொல் இயல்பாகத் தருகிறது.
- source_word: τὸν Χριστόν
  choice: அபிஷேகம் பெற்றவர்
  rationale: Χριστός இங்கு ஒருவரின் பெயராக மட்டுமல்லாமல் ‘அபிஷேகம் பெற்றவர்’ என்ற பட்டமாகச் செயல்படுகிறது; ஆகவே பட்டத்தின் பொருள் முதன்மை உரையில் வெளிப்படுத்தப்படுகிறது.
- source_word: διὰ τῆς πίστεως
  choice: விசுவாசத்தின் வழியாக
  rationale: இச்சூழலில் πίστις, அபிஷேகம் பெற்றவர் விசுவாசிகளின் உள்ளங்களில் குடியிருப்பதற்கான வழிமுறையாகிய விசுவாசத்தைக் குறிப்பது இயல்பானது.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: உங்கள் உள்ளங்களில்
  rationale: καρδία இங்கு உணர்ச்சிகளை மட்டும் அல்லாமல் மனிதரின் அகநிலையைக் குறிக்கிறது; ‘உள்ளங்கள்’ என்பது நவீன தமிழில் அந்த விரிவான பொருளை இயல்பாகத் தருகிறது.
- source_word: ἐν ἀγάπῃ
  choice: அன்பில்
  rationale: ἀγάπη என்பதன் நேரான, இயல்பான தமிழ் இணை ‘அன்பு’; இங்கு வேரூன்றுதல் மற்றும் அடித்தளம் அமைக்கப்படுதல் நிகழும் தளத்தைக் குறிக்கிறது.
- source_word: ἐρριζωμένοι
  choice: வேரூன்றியவர்களாக
  rationale: முடிவுற்ற செயலில் இருந்து தொடரும் நிலையை உணர்த்தும் perfect passive participle-ஐத் தாவரவியல் உருவகத்தோடு இயல்பாகப் பாதுகாக்கிறது.
- source_word: τεθεμελιωμένοι
  choice: அடித்தளம் அமைக்கப்பட்டவர்களாக
  rationale: கட்டட உருவகத்தையும் passive பொருளையும் பாதுகாத்து, இணையாக வரும் ‘வேரூன்றியவர்களாக’ என்பதோடு தெளிவாகச் சேர்கிறது.
