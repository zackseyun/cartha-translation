  rationale: சொல் ஒழுங்கும் கருத்தோட்டமும் ‘அன்பில்’ என்பதைத் தொடர்ந்து வரும் இரண்டு participle-களோடு இணைப்பதை அதிகம் ஆதரிக்கின்றன; மாற்று இலக்கண இணைப்பு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
