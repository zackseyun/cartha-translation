- source_word: συγκληρονόμα
  choice: உடன் வாரிசுகள்
  rationale: σύν- என்ற முன்னொட்டு மற்றவர்களோடு பகிர்ந்துகொள்ளும் ஒரே வாரிசுரிமையை வலியுறுத்துகிறது; மூன்று கூட்டுச் சொற்களின் இணைநிலையையும் இச்சொல் காக்கிறது.
- source_word: σύσσωμα
  choice: ஒரே உடலின் உடன் உறுப்பினர்கள்
  rationale: அரிதான இச்சொல் ஒரே உடலில் இணைக்கப்பட்டிருப்பதைக் குறிக்கிறது. உடல் உருவகம் தமிழில் தெளிவாகவும் மூன்று தொடர்களின் ஒத்த அமைப்பு இயன்றவரை காக்கப்படவும் இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: συμμέτοχα
  choice: உடன் பங்காளிகள்
  rationale: மற்றவர்களுடன் சேர்ந்து ஒன்றில் பங்குபெறுவதை இது குறிக்கிறது; முந்தைய இரண்டு σύν- கூட்டுச் சொற்களுடனான இணைநிலையையும் காக்கிறது.
- source_word: τῆς ἐπαγγελίας
  choice: வாக்குறுதியில்
  rationale: சார்புப்பொருள் வடிவம் συμμέτοχα என்பதுடன் இணைந்து, வாக்குறுதியில் பங்குபெறுதலைக் குறிக்கிறது; ஒருமை வடிவமும் காக்கப்பட்டுள்ளது.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: கிறிஸ்து இயேசுவுக்குள்
  rationale: ἐν என்பதன் ஒன்றிப்பை உணர்த்தும் மொழிநடையும் Χριστός என்பதன் பட்டப்பெயர் தன்மையும் ‘கிறிஸ்து இயேசு’ என்ற தமிழில் பரவலாகப் புரியும் வடிவில் காக்கப்படுகின்றன.
- source_word: διὰ τοῦ εὐαγγελίου
  choice: நற்செய்தியின் வழியாக
  rationale: διά + genitive இங்கு வழிமுறை அல்லது கருவியைக் குறிக்கிறது; நற்செய்தியின் வழியாகவே இப்பங்குபெறுதல் நிகழ்வதாக உரை கூறுகிறது.
theological_decisions:
- issue: Χριστῷ என்பது பட்டப்பெயராகவா அல்லது பெயர்போன்ற வடிவமாகவா மொழிபெயர்க்கப்பட வேண்டும்
  choice: கிறிஸ்து இயேசு
  alternative: மேசியா இயேசு
  rationale: இங்கு மெசியா சார்ந்த அர்த்தம் செயலில் இருந்தாலும், ‘கிறிஸ்து’ என்பது நவீனத் தமிழில் இயல்பாகப் புரியும் நிலைபெற்ற பட்டப்பெயர். ‘மேசியா’ என்ற மாற்று அடிக்குறிப்பில் தரப்பட்டு பட்டப்பெயரின் விசை வெளிப்படுத்தப்படுகிறது.
- issue: ἔθνη என்பதன் குறிப்பு
  choice: யூதரல்லாத மக்கள்
  alternative: பிற இனத்தார் / தேசங்கள்
  rationale: உடனடியான சூழல் யூதரல்லாதோர் கடவுளுடைய வாக்குறுதியில் சமமாக இணைக்கப்படுவதைப் பற்றியது; ‘தேசங்கள்’ புவியியல் அல்லது அரசியல் பொருளைத் தவறாக உணர்த்தக்கூடும்.
- issue: மூன்று σύν- கூட்டுச் சொற்களின் இறையியல் மற்றும் சொல்லாட்சிசார் இணைநிலை
  choice: உடன் வாரிசுகள்; ஒரே உடலின் உடன் உறுப்பினர்கள்; உடன் பங்காளிகள்
  alternative: கூட்டு வாரிசுகள்; ஒரே உடலைச் சேர்ந்தவர்கள்; சேர்ந்து பங்குபெறுகிறவர்கள்
  rationale: மூன்று பிரிவுகளிலும் சமமான இணைப்பை வலியுறுத்தும் மூலமொழியின் ஒலிநயத்தையும் கருத்து இணைநிலையையும் இயன்றவரை வெளிப்படையாக வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உடன்’ என்ற மீளுருவாக்கம் சற்று செறிவானதாக இருந்தாலும், συγκληρονόμα, σύσσωμα, συμμέτοχα ஆகிய மூன்று σύν- கூட்டுச் சொற்களின் திட்டமிட்ட இணைநிலையையும் சமபங்கையும் காக்கிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் உரையில் இடம்பெற்றுள்ளன.
