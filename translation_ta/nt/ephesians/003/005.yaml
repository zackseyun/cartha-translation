  terminology: Use ‘பரிசுத்த ஆவி’ rather than ‘தூய ஆவி’ for the conventional theological term without adding doctrinal specificity. ‘அப்போஸ்தலர்கள்’ and ‘தீர்க்கதரிசிகள்’ are appropriate established terms.
