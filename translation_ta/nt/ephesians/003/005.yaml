lexical_decisions:
- source_word: ὃ
  choice: அது
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட மறைபொருளைச் சுட்டும் தொடர்புப் பிரதிப்பெயரின் இணைப்பைத் தக்கவைக்கிறது; இவ்வசனத்துக்குள் ‘மறைபொருள்’ என்பதை வெளிப்படையாகச் சேர்ப்பதில்லை.
- source_word: ἑτέραις γενεαῖς
  choice: வேறு தலைமுறைகளில்
  rationale: ἑτέραις என்பதன் ‘வேறு’ என்ற பொருளையும், இங்கு காலத்தைக் குறிக்கும் வேற்றுமை உருபின் செயலையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: οὐκ ἐγνωρίσθη
  choice: தெரிவிக்கப்படவில்லை
  rationale: γνωρίζω என்பதிலுள்ள ‘தெரியப்படுத்துதல்/அறிவித்தல்’ என்ற காரணவினைப் பொருளையும் அதன் செயப்பாட்டு வடிவத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: மனிதரின் பிள்ளைகளுக்கு
  rationale: கிரேக்கத்தின் செமித்திய நடையிலான உருவகத்தை முடிந்தவரைத் தக்கவைக்கிறது; அது மனிதர்கள் அனைவரையும் குறிக்கும் என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: ὡς νῦν
  choice: இப்போது … வெளிப்படுத்தப்பட்டிருப்பதுபோல்
  rationale: முன்பு அறியப்படுத்தப்பட்ட விதத்தையோ அளவையோ தற்போதைய வெளிப்பாட்டுடன் ஒப்பிடும் ὡς என்பதன் திறந்த ஒப்பீட்டுப் பொருளைத் தக்கவைக்கிறது.
- source_word: ἀπεκαλύφθη
  choice: வெளிப்படுத்தப்பட்டிருக்கிறது
  rationale: வெளிப்பாடு சார்ந்த பவுலின் முக்கியச் சொல்லையும் செயப்பாட்டு வடிவத்தையும் தெளிவாகக் காக்கிறது.
- source_word: τοῖς ἁγίοις ἀποστόλοις αὐτοῦ καὶ προφήταις
  choice: அவருடைய பரிசுத்த அப்போஸ்தலர்களுக்கும் தீர்க்கதரிசிகளுக்கும்
  rationale: ἁγίοις இரு இணைக்கப்பட்ட குழுக்களையும் இயல்பாகத் தழுவுமாறு அமைக்கிறது; αὐτοῦ என்பதன் குறிப்பை ‘அவருடைய’ என்று வைத்துக் கொண்டு அதன் நபரை மொழிபெயர்ப்பிலேயே கூடுதலாக நிர்ணயிக்கவில்லை.
- source_word: ἐν πνεύματι
  choice: தூய ஆவியில்
  rationale: வெளிப்பாட்டின் சூழலில் πνεῦμα தூய ஆவியைக் குறிப்பது மிகச் சாத்தியம். ‘ஆவியில்’ என்பது ἐν என்பதன் இடம்/சூழல் நுணுக்கத்தைத் தக்கவைக்கிறது; கருவிப்பொருளும் சாத்தியம் என்பதை அடிக்குறிப்பு காட்டுகிறது.
theological_decisions:
- issue: πνεύματι என்பதன் குறிப்பு
  choice: தூய ஆவி
  alternative: மனித ஆவி அல்லது ஆவிக்குரிய நிலை/முறை
  rationale: தெய்வீக வெளிப்பாடு அப்போஸ்தலர்களுக்கும் தீர்க்கதரிசிகளுக்கும் அளிக்கப்படும் இச்சூழலில், பவுலின் வழக்குப்படி தூய ஆவியே மிகச் சாத்தியமான குறிப்பு. எனினும் ἐν என்பது சூழலையோ கருவியையோ குறிக்கக்கூடியதால் அந்த நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன, மரியாதையான பொதுத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அப்போஸ்தலர்கள்’, ‘தீர்க்கதரிசிகள்’ ஆகியவை பரவலாக அறியப்பட்ட வேதாகமச் சொற்களாக வைக்கப்பட்டுள்ளன. மூலத்தின் நீண்ட தொடர்பு வாக்கிய அமைப்பும், முன் காலத்துக்கும் தற்போதைய வெளிப்பாட்டுக்கும் இடையிலான ஒப்பீட்டின் திட்டமிட்ட திறந்த தன்மையும் காக்கப்பட்டுள்ளன.
