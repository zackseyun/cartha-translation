  text: ὃ ἑτέραις γενεαῖς οὐκ ἐγνωρίσθη τοῖς υἱοῖς τῶν ἀνθρώπων ὡς νῦν ἀπεκαλύφθη τοῖς ἁγίοις ἀποστόλοις αὐτοῦ καὶ προφήταις ἐν πνεύματι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/005.yaml
  text: which was not made known to the sons of men in other generations as it has now been revealed to his holy apostles and prophets in the Spirit[b][a],
translation:
  language: ta
  text: அது, வேறு தலைமுறைகளில் மனிதர்களுக்கு தெரிவிக்கப்படவில்லை; ஆனால் இப்போது பரிசுத்த ஆவியில்[b] அவருடைய பரிசுத்த அப்போஸ்தலர்களுக்கும் தீர்க்கதரிசிகளுக்கும் வெளிப்படுத்தப்பட்டதுபோல் அல்ல.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: அல்லது, “பரிசுத்த ஆவியால்”; கிரேக்கச் சொற்றொடர் ஆவிக்குள்ளான சூழலையோ ஆவியை வழிமுறையாகவோ குறிக்கலாம்.
