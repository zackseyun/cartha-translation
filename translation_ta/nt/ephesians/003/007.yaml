source:
  edition: SBLGNT
  text: οὗ ⸀ἐγενήθην διάκονος κατὰ τὴν δωρεὰν τῆς χάριτος τοῦ θεοῦ ⸂τῆς δοθείσης⸃ μοι κατὰ τὴν ἐνέργειαν τῆς δυνάμεως αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/007.yaml
  text: of which I became a servant according to the gift of God's grace given to me according to the working of his power—[a]
translation:
  language: ta
  text: எனக்கு அளிக்கப்பட்ட கடவுளுடைய அருளின் கொடைக்கும் அவருடைய வல்லமையின் செயல்பாட்டுக்கும் ஏற்ப, அந்த நற்செய்தியின் பணியாளனாக நான் ஆனேன்—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த நற்செய்தியின் பணியாளனாக நான் ஆக்கப்பட்டேன்.”
    reason: ἐγενήθην என்பதற்கு இச்சூழலில் செயப்பாட்டு நிழலுடன் மொழிபெயர்க்கும் வாய்ப்பும் உள்ளது.
lexical_decisions:
- source_word: οὗ
  choice: அந்த நற்செய்தியின்
  rationale: முந்தைய வசனத்திலுள்ள εὐαγγέλιον (‘நற்செய்தி’) என்பதையே சார்புப்பெயர் குறிக்கிறது. தமிழில் அதன் தொடர்பை வெளிப்படையாகக் கூறுவது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἐγενήθην
  choice: நான் ஆனேன்
  rationale: γίνομαι என்பதன் பொதுவான ‘ஆனேன்/ஆகிவிட்டேன்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது; அதேவேளையில் சுற்றியுள்ள சொற்றொடர்கள் கடவுளின் அருளும் வல்லமையுமே இதற்குக் காரணம் என்பதைத் தெளிவாக்குகின்றன.
- source_word: διάκονος
  choice: பணியாளன்
  rationale: இங்கு நற்செய்திக்காகச் சேவை செய்பவரைக் குறிக்கிறது. ‘திருத்தொண்டர்’ போன்ற பிற்காலத் திருச்சபைப் பதவிப் பொருளைத் தேவையின்றி இறக்குமதி செய்யாமல் செயல்சார் பொருளைப் பாதுகாக்கிறது.
- source_word: κατὰ τὴν δωρεὰν
  choice: கொடைக்கு ஏற்ப
  rationale: κατά + வேற்றுமை உருபு இங்கு அளவு, அடிப்படை அல்லது ஒத்திசைவைச் சுட்டுகிறது. ‘ஏற்ப’ என்பது அந்த உறவை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: τῆς χάριτος τοῦ θεοῦ τῆς δοθείσης μοι
  choice: எனக்கு அளிக்கப்பட்ட கடவுளுடைய அருளின்
  rationale: δοθείσης என்பது இலக்கணப்படி ‘அருள்’ என்பதையே விளக்குகிறது. எனவே அருளே பவுலுக்கு அளிக்கப்பட்டது என்ற தொடர்பு பாதுகாக்கப்படுகிறது.
- source_word: κατὰ τὴν ἐνέργειαν
  choice: செயல்பாட்டுக்கு ஏற்ப
  rationale: ἐνέργεια என்பது செயலில் வெளிப்படும் ஆற்றலையோ பயனுறச் செயல்படுதலையோ குறிக்கிறது. ‘செயல்பாடு’ நவீனத் தமிழில் தெளிவாக உள்ளது.
- source_word: τῆς δυνάμεως αὐτοῦ
  choice: அவருடைய வல்லமையின்
  rationale: δύναμις என்பதன் வலிமை மற்றும் ஆற்றல் சார்ந்த பொருளை ‘வல்லமை’ தக்கவைக்கிறது; பவுலின் இறையியல் சொற்பயன்பாட்டுக்கும் ஏற்றது.
theological_decisions:
- issue: διάκονος குறிக்கும் பவுலின் பங்கு
  choice: பணியாளன்
  alternative: ஊழியக்காரன்; திருத்தொண்டர்
  rationale: இந்தச் சூழலில் நற்செய்திக்கான சேவையே முன்னிலையில் உள்ளது; முறையான திருச்சபைப் பதவி வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
- issue: ἐγενήθην என்பதில் உள்ள செயப்படுபொருள் நிழல்
  choice: நான் ஆனேன்
  alternative: நான் ஆக்கப்பட்டேன்
  rationale: மூல வினை ‘ஆனேன்’ என்றும் செயப்பாட்டு நிழலுடன் ‘ஆக்கப்பட்டேன்’ என்றும் புரிந்துகொள்ள இடமளிக்கிறது. முதன்மை உரை இயல்பான தமிழ் வடிவைத் தருகிறது; மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: அருளும் வல்லமையும் பவுலின் பணிக்கு அடிப்படையாக இருப்பது
  choice: இரண்டு κατὰ சொற்றொடர்களையும் ‘ஏற்ப’ என்று இணையாக வழங்குதல்
  alternative: ‘மூலம்’ என்று காரணக் கருவியாக மொழிபெயர்த்தல்
  rationale: மூலத்தில் உள்ள அளவு/நெறி/அடிப்படை சார்ந்த நுணுக்கத்தைப் பாதுகாத்து, அருளின் கொடையும் கடவுளின் வல்லமையின் செயல்பாடும் பவுலின் பணியை நிர்ணயிப்பதை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கிய அமைப்பு தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; முடிவிலுள்ள கோடு அடுத்த கருத்துடன் தொடரும் மூலநடையைச் சுட்டுகிறது.
