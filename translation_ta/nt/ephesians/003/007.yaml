revisions:
- from: அந்த நற்செய்தியின் பணியாளனாக நான் ஆனேன்.[a] இது எனக்கு அளிக்கப்பட்ட கடவுளுடைய அருளின் கொடைக்கு ஏற்பவும், அவருடைய வல்லமையின் செயல்பாட்டுக்கு ஏற்பவும் நிகழ்ந்தது—
  to: எனக்கு அளிக்கப்பட்ட கடவுளுடைய அருளின் கொடைக்கும் அவருடைய வல்லமையின் செயல்பாட்டுக்கும் ஏற்ப, அந்த நற்செய்தியின் பணியாளனாக நான் ஆனேன்—[a]
  rationale: The revision preserves the Greek sentence structure by attaching both ‘according to’ phrases directly to Paul’s becoming a servant. It removes the added, vague ‘this happened’ formulation while retaining the draft’s sound lexical and theological choices. The footnote continues to preserve the possible passive nuance of ἐγενήθην without forcing it into the main text.
  reviewer_model: gpt-5.6-terra
