lexical_decisions:
- source_word: ἵνα
  choice: அதனால் … பெறுவீர்களாக
  rationale: முந்தைய வசனங்களில் தொடரும் பவுலின் வேண்டுதலின் நோக்கம் அல்லது எதிர்பார்க்கப்படும் விளைவைத் தெரிவிக்கிறது. தமிழில் ஜெப வேண்டுதலின் ஓட்டத்துக்கு ஏற்றவாறு விருப்பவினை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐξισχύσητε
  choice: போதிய வலிமையை நீங்கள் பெறுவீர்களாக
  rationale: அடுத்து சொல்லப்படும் ஒன்றைப் புரிந்துகொள்ளத் தேவையான வலிமை அல்லது திறன் போதிய அளவில் இருப்பதை இந்த வினை குறிக்கிறது.
- source_word: καταλαβέσθαι
  choice: புரிந்துகொள்ள
  rationale: இச்சூழலில் மனத்தால் பற்றிக்கொள்வது அல்லது ஆழமாக உணர்ந்துகொள்வது என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: σὺν πᾶσιν τοῖς ἁγίοις
  choice: பரிசுத்தவான்கள் அனைவரோடும் சேர்ந்து
  rationale: σύν குறிக்கும் கூட்டுப் பங்கேற்பை ‘சேர்ந்து’ தெளிவாக்குகிறது; ‘பரிசுத்தவான்கள்’ என்பது பவுலின் வழக்கமான விசுவாசிகள் குறித்த சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: τί
  choice: என்ன என்பதை
  rationale: நான்கு பரிமாணங்களைப் புரிந்துகொள்ள வேண்டிய உள்ளடக்கமாக அறிமுகப்படுத்துகிறது; ‘எவ்வளவு பெரியது’ என்று விளக்கமாக மாற்றாமல் கிரேக்கத்தின் திறந்த அமைப்பைப் பேணுகிறது.
- source_word: τὸ πλάτος
  choice: அகலம்
  rationale: πλάτος என்பதற்கான நேரடியான, பொதுவாகப் புரியும் நவீன தமிழ்ச் சொல்.
- source_word: μῆκος
  choice: நீளம்
  rationale: பரிமாணத்தைக் குறிக்கும் நேரடியான தமிழ் இணைச்சொல்.
- source_word: ὕψος
  choice: உயரம்
  rationale: பரிமாணத்தைக் குறிக்கும் நேரடியான தமிழ் இணைச்சொல்.
- source_word: βάθος
  choice: ஆழம்
  rationale: பரிமாணத்தைக் குறிக்கும் நேரடியான தமிழ் இணைச்சொல்.
theological_decisions:
- issue: நான்கு பரிமாணங்கள் எதைக் குறிக்கின்றன?
  choice: அகலம், நீளம், உயரம், ஆழம் எதனுடையவை என்பதை முதன்மை உரையில் குறிப்பிடாமல் விடுதல்
  alternative: அவை மெசியாவின் அன்பின் பரிமாணங்கள் என்று இவ்வசனத்திலேயே வெளிப்படையாகச் சேர்த்தல்
  rationale: இந்தக் கிரேக்க வசனம் அந்தப் பரிமாணங்களுக்குரிய பொருளை வெளிப்படையாகக் கூறவில்லை. அடுத்த வசனத்திலுள்ள மெசியாவின் அன்புடன் பலர் இதை இணைத்துப் புரிந்துகொண்டாலும், அதை இங்கே சேர்ப்பது மூலத்தில் உள்ள திறந்த தன்மையையும் இறையியல் அழுத்தத்தையும் முன்கூட்டியே தீர்த்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified ஜெப மொழிநடை பயன்படுத்தப்பட்டுள்ளது. ‘பரிசுத்தவான்கள்’ என்ற நிறுவப்பட்ட பவுலிய சொல்லாட்சி தக்கவைக்கப்பட்டுள்ளது; நான்கு பரிமாணங்களின் குறிப்பிடப்படாத பொருள் விளக்கிச் சேர்க்கப்படவில்லை.
