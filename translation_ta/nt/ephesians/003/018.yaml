  text: நீங்கள் அகலம்[a], நீளம், உயரம், ஆழம் ஆகியவை என்ன என்பதைப் பரிசுத்தவான்கள் அனைவரோடும் சேர்ந்து புரிந்துகொள்ளப் போதிய வல்லமையைப் பெறும்படி,
