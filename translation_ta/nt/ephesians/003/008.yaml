  text: ἐμοὶ τῷ ἐλαχιστοτέρῳ πάντων ἁγίων ἐδόθη ἡ χάρις αὕτη— ⸀τοῖς ἔθνεσιν εὐαγγελίσασθαι ⸂τὸ ἀνεξιχνίαστον πλοῦτος⸃ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/008.yaml
  text: To me[a], the very least of all the saints, this grace was given—to proclaim to the Gentiles the unsearchable riches of Messiah[c][b],
translation:
  language: ta
  text: தூய மக்கள் அனைவரிலும் மிகச் சிறியவனாகிய[a] எனக்கு இந்த அருள் அளிக்கப்பட்டது—யூதரல்லாத மக்களுக்கு[b] மெசியாவின்[c] ஆராய்ந்தறிய முடியாத செல்வத்தை நற்செய்தியாக அறிவிக்கும்படி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு நெருக்கமாக, ‘தூய மக்கள் அனைவரிலும் சிறியவனிலும் சிறியவனாகிய.’ இந்த அசாதாரண வடிவம் மிகுந்த தாழ்மையை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நாடுகளுக்கு.’ இச்சூழலில் யூதரல்லாத மக்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘கிறிஸ்துவின்.’ கிரேக்கப் பட்டமான Χριστός என்பதைக் ‘மெசியா’ என்றும் ‘கிறிஸ்து’ என்றும் வழங்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλαχιστοτέρῳ
  choice: மிகச் சிறியவனாகிய
  rationale: வழக்கத்திற்கு மாறான ஒப்பீட்டு வடிவம் பவுலின் ஆழ்ந்த தாழ்மையை வலியுறுத்துகிறது. ‘மிகச் சிறியவன்’ என்பது அதன் தீவிரத்தை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἁγίων
  choice: தூய மக்கள்
  rationale: பவுலின் பயன்பாட்டில் இது இறைவனுக்கெனப் பிரித்தெடுக்கப்பட்ட விசுவாசிகளைக் குறிக்கிறது. ‘தூய மக்கள்’ என்பது தேவையற்ற சமயக் குழு சார்பின்றி, நவீன வாசகருக்குப் புரியும் வகையில் உள்ளது.
- source_word: χάρις
  choice: அருள்
  rationale: இங்கு இறைவன் இலவசமாக அளிக்கும் தயவையும் அதனால் வழங்கப்பட்ட பணியையும் குறிக்கிறது. ‘அருள்’ இரு நுணுக்கங்களுக்கும் இடமளிக்கிறது.
- source_word: ἔθνεσιν
  choice: பிற இனத்தாருக்கு
  rationale: இச்சூழலில் இது அரசியல் நாடுகளைவிட யூதரல்லாத மக்களைக் குறிக்கிறது. ‘பிற இனத்தார்’ அந்த யூதர்–யூதரல்லாதவர் வேறுபாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εὐαγγελίσασθαι
  choice: நற்செய்தியாக அறிவிப்பதற்காக
  rationale: வினைச்சொல் நல்ல செய்தியை அறிவிக்கும் பணியைக் குறிக்கிறது. தொடர்ந்து வரும் ‘செல்வம்’ என்பதையே அந்த நற்செய்தியின் உள்ளடக்கமாகத் தெளிவாக இணைக்கிறது.
- source_word: ἀνεξιχνίαστον
  choice: ஆராய்ந்தறிய முடியாத
  rationale: முழுமையாகத் தடமறிந்து கண்டுபிடிக்கவோ புரிந்துகொள்ளவோ முடியாதது என்ற உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: πλοῦτος
  choice: செல்வம்
  rationale: கிறிஸ்துவில் உள்ள மீட்பின் அளவற்ற நிறைவை பவுல் செல்வ உருவகத்தால் கூறுகிறார்; ஒருமை வடிவிலுள்ள கிரேக்கச் சொல்லுக்கு ‘செல்வம்’ நேர்த்தியான இணை.
- source_word: Χριστοῦ
  choice: மெசியாவின்
  rationale: Χριστός இங்கு அபிஷேகம் செய்யப்பட்டவர் என்ற பட்டமாகப் புரிந்துகொள்ள முடிவதால் அதன் பொருளைத் தரும் ‘மெசியா’ பயன்படுத்தப்பட்டுள்ளது; பரவலான ‘கிறிஸ்து’ மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மெசியாவின்
  alternative: கிறிஸ்துவின்
  rationale: பட்டத்தின் பொருளை வெளிப்படுத்தும் வகையில் ‘மெசியா’ முதன்மைப் பாடத்தில் வைக்கப்பட்டுள்ளது. ‘கிறிஸ்து’ என்ற மரபான ஒலிபெயர்ப்பும் செல்லத்தக்கது என்பதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἔθνεσιν என்பதன் சூழல்சார் குறிப்பு
  choice: பிற இனத்தாருக்கு
  alternative: நாடுகளுக்கு
  rationale: எபேசியர் 3-ன் யூதர்–யூதரல்லாதவர் சூழலில் யூதரல்லாத மக்களே முதன்மைக் குறிப்பு. இருப்பினும் சொல்லின் விரிவான ‘நாடுகள்’ பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பரிசுத்தவான்கள்’ என்ற மரபுசார் சொல்லுக்குப் பதில் பொதுவாசகருக்கு நேரடியாகப் புரியும் ‘தூய மக்கள்’ தேர்ந்தெடுக்கப்பட்டது. மூலத்தின் நீண்ட வாக்கிய அமைப்பும் அருளிலிருந்து அறிவிப்புப் பணிக்குச் செல்லும் தொடர்பும் நீண்ட கோட்டால் காக்கப்பட்டுள்ளன.
