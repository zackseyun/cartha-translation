  text: εἴ γε ἠκούσατε τὴν οἰκονομίαν τῆς χάριτος τοῦ θεοῦ τῆς δοθείσης μοι εἰς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/002.yaml
  text: assuming indeed that you have heard of the stewardship of God's grace that was given to me for you[b][a],
translation:
  language: ta
  text: உங்களுக்காக எனக்குக் கொடுக்கப்பட்ட கடவுளுடைய அருளின் நிர்வாகப் பொறுப்பைப்[b] பற்றி நீங்கள் கேள்விப்பட்டிருக்கிறீர்கள் என்று வைத்துக்கொண்டால்[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உண்மையிலேயே நீங்கள் கேள்விப்பட்டிருந்தால்.” கிரேக்கத்தில் நிபந்தனை வடிவம் உள்ளது; எனினும், சூழலில் இது உண்மை என்றே பவுல் கருதுவதாகத் தெரிகிறது.
    reason: alternative_reading
  - marker: b
    text: “நிர்வாகம்” அல்லது “ஒப்படைக்கப்பட்ட பணி” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ஒருவரிடம் ஒப்படைக்கப்பட்ட ஒன்றை நிர்வகிக்கும் பொறுப்பைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: கேள்விப்பட்டிருப்பீர்கள் என்றே கருதுகிறேன்
  rationale: இது உண்மையாக இருக்கும் என்று பவுல் எதிர்பார்க்கும் நிபந்தனைத் தொனியை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; கிரேக்கத்தின் நேரடி நிபந்தனை வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἠκούσατε
  choice: கேள்விப்பட்டிருப்பீர்கள்
  rationale: கடந்த காலத்தில் அறிய வந்ததன் தற்போதைய பொருத்தத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: οἰκονομίαν
  choice: நிர்வாகப் பொறுப்பு
  rationale: ஒருவரிடம் ஒப்படைக்கப்பட்ட நிர்வாகத்தையும் அதனுடன் சேர்ந்த பொறுப்பையும் குறிக்கிறது; ‘திட்டம்’ என்று மொழிபெயர்த்து கருத்தை அளவுக்கு மீறி பொதுமைப்படுத்தவில்லை.
- source_word: χάριτος τοῦ θεοῦ
  choice: கடவுளுடைய அருள்
  rationale: அருள் கடவுளிடமிருந்து வருவதையும் அவருக்குரியதாயிருப்பதையும் இயல்பாகப் பாதுகாக்கிறது; பவுலின் சொற்பயன்பாட்டுத் தொடர்ச்சிக்கும் ஏற்றது.
- source_word: τῆς δοθείσης μοι
  choice: எனக்குக் கொடுக்கப்பட்ட
  rationale: பெண்பால் ஒருமை வடிவமான பங்கேற்புச்சொல் இலக்கணப்படி ‘அருள்’ என்பதோடு நெருக்கமாக இணைவதைப் பாதுகாக்கிறது; கொடுப்பவர் வெளிப்படையாகச் சொல்லப்படாத இறைச் செயப்பாட்டையும் நிலைநிறுத்துகிறது.
- source_word: εἰς ὑμᾶς
  choice: உங்களுக்காக
  rationale: பவுலிடம் ஒப்படைக்கப்பட்ட பணி வாசகர்களை நோக்கியதும் அவர்களுடைய நன்மைக்கானதும் என்பதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘கடவுளுடைய அருளின் நிர்வாகப் பொறுப்பு’ என்பதன் குறிப்பு
  choice: வாசகர்களுக்காகப் பவுலிடம் ஒப்படைக்கப்பட்ட, கடவுளுடைய அருளைச் சார்ந்த நிர்வாகப் பொறுப்பு
  alternative: கடவுளுடைய இரட்சிப்புத் திட்டம் அல்லது ஏற்பாடு என்ற பொதுவான பொருள்
  rationale: உடனடிச் சூழல் பிற இனத்தாருக்கான பவுலின் ஊழியப் பொறுப்பை வலியுறுத்துகிறது. ‘நிர்வாகப் பொறுப்பு’ என்பது ஒப்படைக்கப்பட்ட பணியை முன்னிறுத்துகிறது; அதற்குப் பின்னுள்ள விரிவான இறைத்திட்டத்தை மறுப்பதில்லை.
- issue: εἴ γε என்பதன் வலிமை
  choice: உண்மை என்று எதிர்பார்க்கப்படும் சொல்லாட்சிசார் அனுமானம்
  alternative: உண்மையான ஐயத்தை வெளிப்படுத்தும் ‘உண்மையிலேயே நீங்கள் கேள்விப்பட்டிருந்தால்’ என்ற நேரடி நிபந்தனை
  rationale: பவுல் வாசகர்கள் இதை அறிந்திருப்பார்கள் என்ற எதிர்பார்ப்போடு எழுதுகிறார். முதன்மை உரை அந்த எதிர்பார்ப்பை இயல்பான தமிழில் தருகிறது; கிரேக்கத்தின் நிபந்தனை வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: τῆς δοθείσης என்பதன் தொடர்பு
  choice: இலக்கணப்படி ‘அருள்’ என்பதோடு இணைத்து, ‘எனக்குக் கொடுக்கப்பட்ட ... அருள்’ என்று மொழிபெயர்த்தல்
  alternative: முழு ‘நிர்வாகப் பொறுப்பும்’ பவுலுக்குக் கொடுக்கப்பட்டது என்று பொருளை வெளிப்படையாக்குதல்
  rationale: கிரேக்கப் பங்கேற்புச்சொல் ‘அருள்’ என்பதோடு பாலிலும் வேற்றுமையிலும் ஒத்துள்ளது. அதேவேளை, சூழலில் அந்த அருளோடு இணைந்த பொறுப்பும் பவுலிடம் ஒப்படைக்கப்பட்டதாகப் புரிந்துகொள்ள முடியும்; மொழிபெயர்ப்பு இந்த நெருக்கத்தைத் தீர்த்துவிடாமல் வைக்கிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் காக்கப்பட்டுள்ளன. ‘நிர்வாகப் பொறுப்பு’ என்பது அன்றாட வாசகருக்கு விளங்கக்கூடியதாயும், οἰκονομία என்ற சொல்லின் ஒப்படைக்கப்பட்ட நிர்வாக நுணுக்கத்தைத் தக்கவைத்ததாயும் தேர்ந்தெடுக்கப்பட்டது.
