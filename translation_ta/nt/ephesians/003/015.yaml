source:
  edition: SBLGNT
  text: ἐξ οὗ πᾶσα πατριὰ ἐν οὐρανοῖς καὶ ἐπὶ γῆς ὀνομάζεται,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/015.yaml
  text: from whom every family in heaven and on earth is named,[a]
translation:
  language: ta
  text: அவரிடமிருந்தே பரலோகத்திலும் பூமியிலும் உள்ள ஒவ்வொரு குடும்பமும் தன் பெயரைப் பெறுகிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரிடமிருந்தே பரலோகத்திலும் பூமியிலும் உள்ள முழுக் குடும்பமும் தன் பெயரைப் பெறுகிறது”; இன்னும் விளக்கமாக, “பரலோகத்திலும் பூமியிலும் உள்ள எல்லாத் தந்தைத்துவமும் அவரிடமிருந்தே தன் பெயரைப் பெறுகிறது.”
    reason: πᾶσα πατριά என்பதற்கு ‘ஒவ்வொரு குடும்பமும்’ அல்லது ‘முழுக் குடும்பமும்’ என்ற இரு வாசிப்புகள் சாத்தியம்; முந்தைய வசனத்திலுள்ள ‘தந்தை’ என்பதுடனான சொல் தொடர்பால் ‘எல்லாத் தந்தைத்துவமும்’ என்ற விளக்கப் பொருளும் முன்வைக்கப்படுகிறது.
lexical_decisions:
- source_word: ἐξ οὗ
  choice: அவரிடமிருந்தே
  rationale: ἐκ + உறவுப்பெயர் மூலத்தைக் குறிக்கிறது. ‘அவரிடமிருந்தே’ என்பது ‘from whom’ என்ற பொருளை இயல்பான தமிழில் தருவதோடு, ‘-ஏ’ மூலம் மூல உறவைத் தெளிவுபடுத்துகிறது.
- source_word: πᾶσα
  choice: ஒவ்வொரு
  rationale: ஒருமை பெயர்ச்சொல்லுடன் வரும் πᾶσα இங்கு பகிர்வுப் பொருளில் ‘ஒவ்வொரு’ என இயல்பாகப் புரிகிறது. ‘முழுக் குடும்பமும்’ என்ற கூட்டுப் பொருளும் இலக்கண ரீதியாகச் சாத்தியமாதலால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: πατριὰ
  choice: குடும்பம்
  rationale: πατριά பொதுவாக குடும்பக் குழு, குலம், அல்லது வம்சத்தைக் குறிக்கிறது. நவீனத் தமிழில் ‘குடும்பம்’ தெளிவாகவும் பரவலாகப் புரியக்கூடியதாகவும் உள்ளது. முந்தைய வசனத்தின் πατήρ உடனான சொல் தொடர்பை ‘தந்தைத்துவம்’ என விளக்கமாக மாற்றுவது முதன்மைப் பொருளை மீறும்.
- source_word: ἐν οὐρανοῖς
  choice: பரலோகத்தில்
  rationale: கிரேக்கத்தில் பன்மையாக இருந்தாலும், வானுலக மண்டலத்தைக் குறிக்க நவீனத் தமிழில் ‘பரலோகத்தில்’ இயல்பான இடவியல் வடிவமாகும்.
- source_word: ἐπὶ γῆς
  choice: பூமியில்
  rationale: இது நேரடியான இடவியல் பொருள்; ‘பூமியில்’ நவீனத் தமிழில் இயல்பும் துல்லியமும் உடையது.
- source_word: ὀνομάζεται
  choice: தன் பெயரைப் பெறுகிறது
  rationale: நிகழ்காலச் செயப்பாட்டு வினையான ὀνομάζεται அடிப்படையில் ‘பெயரிடப்படுகிறது/அழைக்கப்படுகிறது’ என்று பொருள்படும். தமிழில் ‘அவரிடமிருந்தே ... பெயரிடப்படுகிறது’ என்பதைக் காட்டிலும் ‘அவரிடமிருந்தே ... தன் பெயரைப் பெறுகிறது’ என்பது மூலத்திலிருந்து பெயர் கிடைக்கும் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது; ‘தன்’ என்பது தமிழின் இயல்பான மீள்சுட்டுப் பயன்பாடு.
theological_decisions:
- issue: முந்தைய வசனத்திலுள்ள ‘தந்தை’ என்பதுடன் πᾶσα πατριὰ கொண்டுள்ள தொடர்பு
  choice: ஒவ்வொரு குடும்பமும்
  alternative: முழுக் குடும்பமும்; எல்லாத் தந்தைத்துவமும்
  rationale: πατήρ (‘தந்தை’) மற்றும் πατριά (‘குடும்பம்/குலம்’) இடையே சொல்விளையாட்டு இருக்கலாம். இருப்பினும், மூலச்சொல்லின் வழக்கமான சமூகக் குழுப் பொருளை முதன்மை உரை காக்கிறது; அதை ‘எல்லாத் தந்தைத்துவமும்’ என்ற அருவமான இறையியல் கூற்றாக மாற்றவில்லை. πᾶσα + ஒருமை பெயர்ச்சொல்லின் பகிர்வுப் பொருளை ‘ஒவ்வொரு குடும்பமும்’ வெளிப்படுத்துகிறது; கூட்டுப் பொருளான ‘முழுக் குடும்பமும்’ அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: பெயரிடுதல் மூலத்தையோ அதிகாரத்தையோ குறிக்கிறதா
  choice: அவரிடமிருந்தே ... தன் பெயரைப் பெறுகிறது
  alternative: அவரால் பெயரிடப்படுகிறது; அவரிடமிருந்து பெயர் பெறுகிறது என்ற விளக்கமான வாசிப்பு
  rationale: ἐξ οὗ மூலத்தைச் சுட்டுகிறது; ὀνομάζεται பெயரிடப்படுதலைக் குறிக்கிறது. முதன்மை மொழிபெயர்ப்பு இந்தத் தொடர்பை வெளிப்படுத்துகிறது, ஆனால் குடும்பங்களின் இருப்பு, தன்மை, அல்லது தந்தைத்துவம் அனைத்தும் அவரிடமிருந்து ‘பெறப்படுகிறது’ என்ற விரிவான இறையியல் விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; சாதாரண வாசகருக்கு புரியும் வகையில் இயல்பானதும் மதிப்புமிக்கதுமான நடை. ‘குடும்பம்’ பொதுப் பொருளைக் காக்கிறது. ‘தன் பெயரைப் பெறுகிறது’ தமிழில் இயல்பாக இருந்தாலும், கிரேக்கச் செயப்பாட்டு வடிவத்தின் ‘பெயரிடப்படுகிறது’ என்ற நேரடி சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
