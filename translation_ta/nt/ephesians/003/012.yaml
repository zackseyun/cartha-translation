  text: ἐν ᾧ ἔχομεν τὴν παρρησίαν ⸀καὶ προσαγωγὴν ἐν πεποιθήσει διὰ τῆς πίστεως αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/012.yaml
  text: in whom we have boldness and access with confidence through faith in him[a].
translation:
  language: ta
  text: அவரில், அவர்மேல் உள்ள விசுவாசத்தின் மூலம்[a], நாம் துணிவையும் நம்பிக்கையுடன் அணுகும் வாய்ப்பையும் பெற்றிருக்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய உண்மைத்தன்மையின் மூலம்.” கிரேக்கத் தொடர் அவர்மேல் உள்ள விசுவாசத்தையோ அவருடைய சொந்த உண்மைத்தன்மையையோ குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: அவருக்குள் இருப்பதால்
  rationale: ஆண்பால் ஒருமை உறவுப்பெயர் முந்தைய சூழலில் கிறிஸ்துவைக் குறிக்கிறது. ‘அவருக்குள்’ என்பது கிறிஸ்துவோடு உள்ள இணைப்பைத் தக்கவைக்கிறது; காரணத் தொடர்பு தமிழில் இயல்பாகத் தெளிவாக இருக்க ‘இருப்பதால்’ சேர்க்கப்பட்டது.
- source_word: παρρησίαν
  choice: துணிவு
  rationale: இச்சொல் வெளிப்படையாகவும் அச்சமின்றியும் பேசுதல் அல்லது செயல்படுதல் என்ற பொருளைக் கொண்டது. ‘துணிவு’ இயல்பான தமிழாக இருப்பதோடு, பின்னர் வரும் πεποίθησις என்பதிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: προσαγωγὴν
  choice: கடவுளை அணுகும் உரிமை
  rationale: பவுலின் பயன்பாட்டில் இது கடவுளுடைய முன்னிலைக்குள் அணுகுதலைக் குறிக்கிறது. தமிழில் வெறும் ‘அணுகல்’ என்பதைவிட ‘கடவுளை அணுகும் உரிமை’ சூழலை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது; ‘கடவுளை’ என்பது சூழலால் உணர்த்தப்படும் பொருள்.
- source_word: ἐν πεποιθήσει
  choice: நம்பிக்கையோடு
  rationale: உறுதியான நம்பிக்கையுடன் அணுகும் முறையை இயல்பான தமிழில் தெரிவிக்கிறது; இதை παρρησίαν என்பதற்கான ‘துணிவு’ என்பதோடு ஒன்றாக்காமல் தனியே காக்கிறது.
- source_word: διὰ τῆς πίστεως αὐτοῦ
  choice: அவர்மேல் வைத்துள்ள விசுவாசத்தின் மூலம்
  rationale: முதன்மை உரை αὐτοῦ என்பதை நோக்குநிலைப் பிறப்புவேற்றுமையாகக் கொண்டு, கிறிஸ்துவை நோக்கிய விசுவாசம் என்று மொழிபெயர்க்கிறது. கிறிஸ்துவின் சொந்த உண்மைத்தன்மை என்ற சாத்தியமான வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: αὐτοῦ
  choice: அவர்மேல்
  rationale: முதன்மை உரையில் இது ‘அவர்மேல் வைத்துள்ள விசுவாசம்’ என நோக்குநிலைப் பொருளில் எடுத்துக்கொள்ளப்படுகிறது; ‘அவருடைய உண்மைத்தன்மை’ என்ற மாற்று புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: διὰ τῆς πίστεως αὐτοῦ என்பதன் பொருள்
  choice: அவர்மேல் வைத்துள்ள விசுவாசத்தின் மூலம்
  alternative: அவருடைய உண்மைத்தன்மையின் மூலம்
  rationale: கிரேக்கப் பிறப்புவேற்றுமை கிறிஸ்துவை நோக்கிய விசுவாசத்தையோ கிறிஸ்துவின் சொந்த உண்மைத்தன்மையையோ குறிக்கக்கூடும். விசுவாசிகளுக்குக் கிடைத்துள்ள அணுகலை இவ்வசனம் வலியுறுத்துவதால் பொதுவான நோக்குநிலை வாசிப்பு முதன்மை உரையில் வைக்கப்படுகிறது; உண்மையான மாற்று விளக்கம் அடிக்குறிப்பில் தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டது. ‘துணிவு’ மற்றும் ‘நம்பிக்கையோடு’ எனும் சொற்கள் மூலத்திலுள்ள παρρησία மற்றும் πεποίθησις ஆகியவற்றின் வேறுபாட்டைக் காக்கின்றன. ‘கடவுளை’ என்பது προσαγωγή குறிக்கும் அணுகலின் சூழல்சார் இலக்கை வெளிப்படையாக்குகிறது.
