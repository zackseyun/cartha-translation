source:
  edition: SBLGNT
  text: διὸ αἰτοῦμαι μὴ ⸀ἐγκακεῖν ἐν ταῖς θλίψεσίν μου ὑπὲρ ὑμῶν, ἥτις ἐστὶν δόξα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/013.yaml
  text: Therefore I ask you not to lose heart because of my afflictions for your sake[b][a], which are your glory.
translation:
  language: ta
  text: ஆகையால், உங்களுக்காக நான் படும் துன்பங்களைக் கண்டு நீங்கள் மனந்தளர வேண்டாம் என்று கேட்டுக்கொள்கிறேன்.[a] அவையே உங்கள் மகிமை.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களுக்காக நான் படும் துன்பங்களினால் நீங்கள் சோர்ந்துபோக வேண்டாம்.” கிரேக்கத்தில் பவுல் யாரிடம் கேட்டுக்கொள்கிறார் என்பது வெளிப்படையாகக் கூறப்படவில்லை.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, பவுல் அவர்களுக்காக அனுபவிக்கும் துன்பங்களே அவர்களின் மகிமை என்று கூறப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: ஆகையால்
  rationale: முந்தைய வாதத்திலிருந்து வரும் முடிவைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: αἰτοῦμαι
  choice: கேட்டுக்கொள்கிறேன்
  rationale: பவுலின் பணிவான வேண்டுகோளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது. கிரேக்கத்தில் கேட்கப்படுபவர் வெளிப்படையாகக் குறிப்பிடப்படாததால், முதன்மை உரையிலும் நேரடி செயப்படுபொருள் சேர்க்கப்படவில்லை.
- source_word: μὴ ἐγκακεῖν
  choice: மனந்தளர வேண்டாம்
  rationale: தைரியம் இழத்தல் அல்லது சோர்ந்துபோதல் என்ற பொருளைச் செறிவாகவும் வழக்கான தமிழிலும் தருகிறது.
- source_word: ἐν ταῖς θλίψεσίν μου
  choice: நான் படும் துன்பங்களைக் கண்டு
  rationale: ἐν என்பதன் சொற்பொருள் ‘இல்’ என்றாலும், இங்கு துன்பங்கள் மனந்தளர்வதற்கான சூழல் அல்லது காரணமாக இருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: θλίψεσίν
  choice: துன்பங்கள்
  rationale: அழுத்தம், இடுக்கண், வேதனை ஆகிய தீவிரமான அனுபவங்களை உள்ளடக்கும் பொதுவான, கண்ணியமான தமிழ் சொல்.
- source_word: ὑπὲρ ὑμῶν
  choice: உங்களுக்காக
  rationale: வாசகர்களின் நன்மைக்காக அல்லது அவர்கள் சார்பாகப் பவுல் துன்பப்படுகிறார் என்ற பயன்சார் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἥτις
  choice: அவையே
  rationale: முன்னுள்ள பவுலின் துன்பங்களைச் சுட்டுகிறது; கிரேக்க ஒருமை சார்புப்பெயர் அந்தத் துன்பநிலையை ஒரு முழுமையாகக் கருதினாலும், தமிழில் பன்மை இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: δόξα ὑμῶν
  choice: உங்கள் மகிமை
  rationale: δόξα என்பதிலுள்ள மகிமை மற்றும் கனம் ஆகிய இறையியல்-சொல்லாட்சிசார் வலிமையைத் தக்கவைக்கிறது; ‘பெருமை’ என்று மட்டும் குறுக்கவில்லை.
theological_decisions:
- issue: ἥτις ἐστὶν δόξα ὑμῶν என்பதன் முன்னிலைச் சுட்டு
  choice: பவுலின் துன்பங்களே வாசகர்களின் மகிமை என்று சுட்டுகிறது.
  alternative: அவர்களுக்கான பவுலின் ஊழியமும் அதனுடன் சேர்ந்த துன்பமும் மொத்தமாக அவர்களின் மகிமை என்று சுட்டலாம்.
  rationale: அருகிலுள்ள முன்னிலை ‘என் துன்பங்கள்’ என்பதே. அதேவேளை, அடிக்குறிப்பு அந்த மகிமை எவ்வாறு புரிந்துகொள்ளப்பட வேண்டும் என்பதை அளவுக்கு மீறி கோட்பாட்டாக்காமல், அவர்களுக்காக அவர் துன்பப்படுவதன் கனத்தைக் குறிப்பிடுகிறது.
- issue: αἰτοῦμαι என்பதன் மறைமுகச் செயப்படுபொருள்
  choice: முதன்மை உரையில் கேட்கப்படுபவரை வெளிப்படையாகச் சேர்க்காமல், சூழலின்படி வாசகர்களுக்கான வேண்டுகோளாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: ‘உங்களை கேட்டுக்கொள்கிறேன்’ என்று வாசகர்களை வெளிப்படையான செயப்படுபொருளாகக் குறிப்பிடலாம்; அல்லது பவுல் கடவுளிடம் வேண்டுகிறார் என்று எடுத்துக்கொள்ளலாம்.
  rationale: கிரேக்க உரையில் செயப்படுபொருள் வெளிப்படையாக இல்லை. தமிழ் வாக்கியம் இயல்பாக இருக்கும்போதே அந்த இலக்கணத் திறந்தநிலையை ஓரளவு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘மனந்தளர’ மற்றும் ‘மகிமை’ ஆகியவை முறையே இயல்புத்தன்மையையும் மூலத்தின் இறையியல் வலிமையையும் காக்கின்றன.
