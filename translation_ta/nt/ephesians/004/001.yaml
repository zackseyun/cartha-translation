id: EPH.4.1
reference: Ephesians 4:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν ὑμᾶς ἐγὼ ὁ δέσμιος ἐν κυρίῳ ἀξίως περιπατῆσαι τῆς κλήσεως ἧς ἐκλήθητε,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/001.yaml
  text: Therefore I[a], the prisoner in the Lord, urge you to walk worthily of the calling with which you were called[b],
translation:
  language: ta
  text: ஆகையால், ஆண்டவருக்குள் கைதியாகிய நான்[a], நீங்கள் அழைக்கப்பட்ட அழைப்புக்கு ஏற்றவாறு நடக்கும்படி[b] உங்களை வலியுறுத்துகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்டவரின் கைதியாகிய நான்” அல்லது “ஆண்டவருக்காகக் கைதியான நான்.”
    reason: alternative_reading
  - marker: b
    text: அல்லது, “நீங்கள் அழைக்கப்பட்ட அழைப்புக்குத் தகுந்த விதத்தில் வாழும்படி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: வலியுறுத்துகிறேன்
  rationale: இங்கு παρακαλέω ஒரு சாதாரண வேண்டுகோளை அல்ல, வலுவான மேய்ப்புப் பணிசார்ந்த அறிவுறுத்தலைக் குறிக்கிறது. ‘வலியுறுத்துகிறேன்’ அதன் தீவிரத்தையும் இயல்பான நவீன தமிழையும் காக்கிறது.
- source_word: οὖν
  choice: ஆகையால்
  rationale: முந்தைய பகுதியின் கருத்துகளிலிருந்து வரும் முடிவை οὖν சுட்டுகிறது; ‘ஆகையால்’ அந்தத் தர்க்கத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: δέσμιος
  choice: கைதி
  rationale: δέσμιος என்பதன் நேரடியான பொருள் ‘கைதி’; ‘சங்கிலியால் கட்டப்பட்டவன்’ போன்ற விரிவாக்கத்தைவிட இது தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: ἐν κυρίῳ
  choice: ஆண்டவருக்குள்
  rationale: பவுலுக்கே உரிய ‘ஆண்டவருக்குள்’ என்ற பரந்த இறையியல் சொல்லாட்சியை இது காக்கிறது; ‘ஆண்டவருக்காக’ என்று மொழிபெயர்ப்பது காரணம் அல்லது நோக்கம் என்ற ஒரே பொருளுக்குள் இதைச் சுருக்கிவிடும்.
- source_word: ἀξίως
  choice: ஏற்றவாறு
  rationale: அழைப்புக்கு பொருந்தும் வாழ்க்கை நடத்தையை ἀξίως குறிக்கிறது. தமிழில் ‘ஏற்றவாறு’ என்பது இயல்பாகவும் துல்லியமாகவும் அந்த உறவை வெளிப்படுத்துகிறது.
- source_word: περιπατῆσαι
  choice: நடக்கும்படி
  rationale: வாழ்க்கை நடத்தையைக் குறிக்கும் பவுலின் உருவகத்தை ‘நடக்க’ காக்கிறது; ‘வாழ’ என்பது பொருளைத் தெளிவாக்கினாலும் உருவகத்தைத் தட்டையாக்கும்.
- source_word: κλήσεως
  choice: அழைப்பு
  rationale: κλῆσις இங்கு கடவுளின் அழைப்பை அல்லது விசுவாசிகள் அழைக்கப்பட்ட நிலையைச் சுட்டுகிறது; ‘அழைப்பு’ நவீன தமிழில் தெளிவானதும் இறையியல் அகலத்தைத் தக்கவைப்பதும் ஆகும்.
- source_word: ἧς ἐκλήθητε
  choice: நீங்கள் அழைக்கப்பட்ட அழைப்புக்கு
  rationale: கிரேக்கத்தின் தொடர்புச் சொல்லமைப்பை அப்படியே கடினமாகப் பிரதிபலிக்காமல், அழைப்புக்கும் அழைக்கப்பட்டவர்களுக்கும் உள்ள உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ὁ δέσμιος ἐν κυρίῳ என்ற பவுலின் சுயவிவரிப்பின் பொருள்
  choice: ஆண்டவருக்குள் கைதியாகிய நான்
  alternative: ஆண்டவரின் கைதியாகிய நான் / ஆண்டவருக்காகக் கைதியான நான்
  rationale: கிரேக்க முன்னிடைச்சொல் தொடரை உரிமை (‘ஆண்டவரின்’) அல்லது காரணம்/நோக்கம் (‘ஆண்டவருக்காக’) என்று ஒரே விதமாகத் தீர்மானிக்காமல் மொழிபெயர்க்கிறது. இதனால் பவுலின் சிறைவாசம் ஆண்டவரோடு கொண்டுள்ள உறவின் பரந்த இறையியல் நுட்பம் காக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘ஆண்டவருக்குள்’ மற்றும் ‘நடக்க’ ஆகியவை சற்றே செறிவான பவுலிய சொல்லாட்சிகளாக இருந்தாலும், மூலத்தின் இறையியல் அகலத்தையும் வாழ்க்கை உருவகத்தையும் காக்கின்றன; அடிக்குறிப்புகள் இயல்பான மாற்று வாசிப்புகளை வழங்குகின்றன.
