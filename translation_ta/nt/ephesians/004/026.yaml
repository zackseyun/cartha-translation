  rationale: திருத்தம் கிரேக்கத்தின் கட்டளைத் தன்மையையும் கோபம்-பாவம் இடையிலான தீர்க்கப்படாத பதற்றத்தையும் பாதுகாக்கிறது. இறுதி உருவகம் நவீனத் தமிழில் இயல்பாகத் தெரிவதற்காக, சூரியன் மறைவதற்கு முன் கோபம் தொடரக்கூடாது என்ற அதன் காலநிலைப் பொருள் வெளிப்படுத்தப்பட்டுள்ளது; எந்தக் குறிப்பிட்ட கோட்பாட்டு விளக்கமும் சேர்க்கப்படவில்லை. அடிக்குறிப்பு அடையாளங்களும் காரணங்களும் முழுமையாகத் தக்கவைக்கப்பட்டுள்ளன.
