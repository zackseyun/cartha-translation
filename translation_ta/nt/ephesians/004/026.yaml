  text: ὀργίζεσθε καὶ μὴ ἁμαρτάνετε· ὁ ἥλιος μὴ ἐπιδυέτω ⸀ἐπὶ παροργισμῷ ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/026.yaml
  text: Be angry[a], and do not sin. Do not let the sun go down on your anger[c][b],
translation:
  language: ta
  text: கோபப்படுங்கள்[a]; பாவம் செய்யாதீர்கள்.[b] உங்கள் கோபம் நீடிக்கும்போது சூரியன் மறைய விடாதீர்கள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் கோபப்பட்டாலும், பாவம் செய்யாதீர்கள்.” கிரேக்கத்தில் இது இலக்கணப்படி கட்டளை வடிவில் (“கோபப்படுங்கள்”) உள்ளது; ஆனால் சூழலில் சிலர் இதைச் சலுகைப் பொருளில் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: b
    text: இங்கு பவுல் சங்கீதம் 4:4-ஐ (கிரேக்கப் பழைய ஏற்பாட்டில் 4:5) எதிரொலிப்பதாகத் தெரிகிறது; அங்கே கோபம் பாவம் செய்யாதிருக்கும் கட்டளையுடன் இணைக்கப்படுகிறது.
    reason: cross_reference
  - marker: c
    text: அல்லது, “உங்கள் எரிச்சல் நீடிக்கும்போது”; அல்லது, “உங்களைத் தூண்டியதன் காரணமாக.” கிரேக்கச் சொல் கோபம் அல்லது எரிச்சலைக் குறிக்கலாம்; சில சூழல்களில் அந்த உணர்வைத் தூண்டும் காரணத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργίζεσθε
  choice: கோபப்படுங்கள்
  rationale: கிரேக்கத்தில் உள்ள கட்டளை வடிவை நேரடியாகப் பாதுகாக்கிறது; இதை நிபந்தனையாக மட்டும் மாற்றாமல், அடுத்துள்ள தடையுடன் காணப்படும் பதற்றத்தையும் தக்கவைக்கிறது.
- source_word: μὴ ἁμαρτάνετε
  choice: பாவம் செய்யாதீர்கள்
  rationale: கிரேக்கத் தடைச் சொல்லின் இயல்பான, நேரடியான நவீனத் தமிழ் வடிவம்.
- source_word: ὁ ἥλιος
  choice: சூரியன்
  rationale: மூலத்தின் தெளிவான நேரடிப் பொருள்.
- source_word: μὴ ἐπιδυέτω
  choice: மறைய வேண்டாம்
  rationale: மூன்றாம் நபர் தடை வடிவை இயல்பான தமிழில் வெளிப்படுத்துகிறது; சூரியன் அஸ்தமிப்பதைக் குறிக்கும் சூழலிலும் பொருத்தமானது.
- source_word: ἐπὶ παροργισμῷ ὑμῶν
  choice: உங்கள் கோபத்தின்மேல்
  rationale: παροργισμός என்பது கோபம், எரிச்சல் அல்லது கோபமூட்டுதல் ஆகிய நிழற்பொருள்களைக் கொள்ளலாம். முன்னுள்ள ὀργίζεσθε உடன் உள்ள தொடர்பையும் கிரேக்கத்தின் உருவக அமைப்பையும் இத்தேர்வு பாதுகாக்கிறது.
theological_decisions:
- issue: தொடக்கச் சொற்றொடர் கோபப்படும்படி கட்டளையா அல்லது நிபந்தனைச் சலுகையா?
  choice: “கோபப்படுங்கள்” என்று கட்டளை வடிவில் மொழிபெயர்க்கப்பட்டது.
  alternative: “நீங்கள் கோபப்பட்டாலும்” அல்லது “நீங்கள் கோபப்பட்டால்” என்று நிபந்தனை/சலுகை வடிவில் மொழிபெயர்த்தல்.
  rationale: மூல கிரேக்கச் சொல் கட்டளை வடிவில் உள்ளது. அதைத் தக்கவைப்பது கோபத்தை எல்லையின்றி அங்கீகரிப்பதல்ல; உடனே வரும் பாவம் செய்யாதிருக்கும் தடையும், சூரியன் மறைவதற்குள் அதற்கு முடிவுகட்ட வேண்டிய அறிவுறுத்தலும் அதன் ஒழுக்க மற்றும் கால எல்லைகளை வெளிப்படுத்துகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில் dignified கட்டளை நடை பயன்படுத்தப்பட்டுள்ளது. “கோபப்படுங்கள்” என்ற மூலத்தின் அதிர்ச்சியூட்டும் கட்டளை வலிமை மெலிதாக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளது. “ஆனால்” என்பது இரு கட்டளைகளுக்கிடையிலான எதிர்மறை உறவை இயல்பான தமிழில் தெளிவாக்குகிறது.
