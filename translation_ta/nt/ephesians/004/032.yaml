reference: Ephesians 4:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀γίνεσθε εἰς ἀλλήλους χρηστοί, εὔσπλαγχνοι, χαριζόμενοι ἑαυτοῖς καθὼς καὶ ὁ θεὸς ἐν Χριστῷ ἐχαρίσατο ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/032.yaml
  text: And be kind to one another[a], tenderhearted, forgiving one another[b], just as God in Messiah forgave you.
translation:
  language: ta
  text: ஒருவருக்கொருவர் கனிவானவர்களாகவும், இரக்கமுள்ளவர்களாகவும் இருங்கள்; மெசியாவில்[a] கடவுள் உங்களை மன்னித்ததுபோல, நீங்களும் ஒருவரை ஒருவர் மன்னியுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கிறிஸ்துவில்” என்றும் மொழிபெயர்க்கலாம்.
    reason: Χριστός என்பதற்கான மரபுவழிப் பதிப்பையும் வாசகருக்குத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: γίνεσθε
  choice: இருங்கள்
  rationale: நிகழ்காலக் கட்டளை தொடர்ச்சியான பண்பை வலியுறுத்துகிறது; இயல்பான நவீனத் தமிழில் ‘இருங்கள்’ அந்தக் கட்டளை வலிமையைத் தெளிவாகக் காக்கிறது.
- source_word: εἰς ἀλλήλους
  choice: ஒருவருக்கொருவர்
  rationale: உறவுசார் திசையையும் பரஸ்பரத்தன்மையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: χρηστοί
  choice: கனிவுள்ளவர்களாக
  rationale: இச்சூழலில் பிறரிடம் காட்டும் நன்மை, தயவு, மென்மை ஆகியவற்றை ‘கனிவு’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: εὔσπλαγχνοι
  choice: இரக்கமுள்ள இதயமுடையவர்களாக
  rationale: ஆழ்ந்த உள்ளார்ந்த இரக்கத்தை வெளிப்படுத்தி, χρηστοί என்பதோடு ஒரே பொருளாகக் கலந்துவிடாமல் அதன் உணர்ச்சிசார் வலிமையைக் காக்கிறது.
- source_word: χαριζόμενοι ἑαυτοῖς
  choice: ஒருவரை ஒருவர் மன்னியுங்கள்
  rationale: இங்கே தொடரும் கடவுளின் செயலோடு செய்யப்படும் ஒப்பீடு காரணமாக χαρίζομαι என்பது குற்றத்தை மன்னித்தல் என்ற பொருளைக் கொண்டுள்ளது; பன்மைத் தற்சுட்டுப் பெயர் இச்சூழலில் பரஸ்பரப் பொருளில் வருகிறது. தமிழில் கட்டளை வடிவம் முதன்மை வினையின் அறிவுறுத்தலைத் தெளிவாகத் தொடர்கிறது.
- source_word: καθὼς καὶ
  choice: …போல, நீங்களும்
  rationale: καθώς என்பதன் ஒப்பீட்டையும் καί என்பதன் இணை/வலியுறுத்தும் நுணுக்கத்தையும் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἐν Χριστῷ
  choice: மெசியாவில்
  rationale: ἐν என்பதைக் ‘-இல்’ எனப் பாதுகாத்து, Χριστός என்பதைக் பெயராக ஒலிபெயர்க்காமல் ‘மெசியா’ என்ற பட்டமாக வழங்குகிறது.
- source_word: ἐχαρίσατο ὑμῖν
  choice: உங்களை மன்னித்தார்
  rationale: இச்சூழலில் நிறைவுற்ற கடவுளுடைய மன்னிப்புச் செயலை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: ἐν Χριστῷ என்பதன் மொழிபெயர்ப்பு
  choice: மெசியாவில்
  alternative: கிறிஸ்துவில்; மெசியாவின் மூலமாக
  rationale: Χριστός இங்கு பட்டமாக இருப்பதால் ‘மெசியா’ என மொழிபெயர்க்கப்படுகிறது. ἐν என்பதன் உண்மையான பரப்பைச் சுருக்கி கருவிப் பொருளாக மட்டும் தீர்மானிக்காமல் ‘மெசியாவில்’ என வைத்திருக்கிறது.
- issue: καθὼς καὶ-இல் உள்ள καί
  choice: ‘நீங்களும்’ என்பதன் மூலம் வெளிப்படுத்தப்பட்டது
  alternative: καί-ஐ வெளிப்படையாக மொழிபெயர்க்காமல் ‘…போல’ என்று மட்டும் கூறுதல்
  rationale: விசுவாசிகளின் மன்னிப்புக்கும் கடவுளின் மன்னிப்புக்கும் இடையிலான வலியுறுத்தப்பட்ட ஒப்புமையை இயல்பான தமிழில் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகமத்துக்குரிய கண்ணியமும் கொண்ட நடை. ‘கனிவு’ மற்றும் ‘இரக்கமுள்ள இதயம்’ ஆகியவை இரண்டு கிரேக்கப் பண்புச் சொற்களின் வேறுபாட்டைத் தக்கவைக்கின்றன. நீண்ட தொடரைத் தெளிவாக்க அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது; வசனத்தின் கட்டளை மற்றும் காரண ஒப்புமை பாதுகாக்கப்பட்டுள்ளன.
