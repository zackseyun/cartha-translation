revisions:
- from: ஒருவருக்கொருவர் கனிவுள்ளவர்களாகவும், இரக்கமுள்ள இதயமுடையவர்களாகவும் இருங்கள்; மெசியாவில் கடவுள் உங்களை மன்னித்ததுபோல, நீங்களும் ஒருவரை ஒருவர் மன்னியுங்கள்.[a]
  to: ஒருவருக்கொருவர் கனிவானவர்களாகவும், இரக்கமுள்ளவர்களாகவும் இருங்கள்; மெசியாவில்[a] கடவுள் உங்களை மன்னித்ததுபோல, நீங்களும் ஒருவரை ஒருவர் மன்னியுங்கள்.
  rationale: The revision improves modern Tamil idiom by simplifying the second ethical adjective without reducing its meaning, and relocates the note marker to its precise source expression. All other elements of the draft are retained because they faithfully convey the Greek and preserve the intended non-instrumental breadth of ἐν Χριστῷ.
