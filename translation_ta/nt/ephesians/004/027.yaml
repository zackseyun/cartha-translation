  text: and do not give place to the devil[a].
translation:
  language: ta
  text: பிசாசுக்கு இடம் கொடுக்காதீர்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பிசாசுக்கு வாய்ப்புக் கொடுக்காதீர்கள்.” கிரேக்கத்தில் நேரடியாக, “பிசாசுக்கு இடம் கொடுக்காதீர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: இடமும் … கொடுக்காதீர்கள்
  rationale: முந்தைய அறிவுறுத்தலுடன் இந்தத் தடையை இணைக்கும் தொடர்ச்சிப் பொருளை ‘-உம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δίδοτε
  choice: கொடுக்காதீர்கள்
  rationale: δίδωμι என்பதன் நேரடியான பொருள் ‘கொடு’; எதிர்மறை நிகழ்காலக் கட்டளை இங்கு பன்மை மரியாதை வடிவில் இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: τόπον
  choice: இடம்
  rationale: ‘இடம்’ என்பது சொல்லின் நேரடிப் பொருளையும், ஒருவருக்குச் செயல்பட இடமளித்தல் என்ற தமிழ் மரபுத்தொடரின் பொருளையும் ஒருங்கே காக்கிறது; ‘பிடிமானம்’ போன்ற கூடுதல் உருவகத்தைப் புகுத்தவில்லை.
- source_word: τῷ διαβόλῳ
  choice: பிசாசுக்கு
  rationale: கட்டுரையுடன் வரும் διάβολος இச்சூழலில் மனித அவதூறுக்காரனை அல்ல, தனிப்பட்ட தீய எதிரியைச் சுட்டுகிறது; அதற்கான வழக்கமான, தெளிவான தமிழ்ச் சொல் ‘பிசாசு’.
theological_decisions:
- issue: διάβολος என்பது பொதுப்பெயரான ‘அவதூறுக்காரன்’ என்பதையா, தனிப்பட்ட தீயவனான ‘பிசாசு’ என்பதையா குறிக்கிறது?
  choice: பிசாசு
  alternative: அவதூறுக்காரன்
  rationale: பவுலின் அறிவுறுத்தல் சூழலில் இச்சொல் தனிப்பட்ட தீய எதிரியையே வழக்கமாகக் குறிக்கிறது. ‘பிசாசு’ என்பது உரையை விரிவாக்காமல் அந்தக் குறிப்பிடுபொருளைத் தெளிவாகத் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான, கண்ணியமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘இடம் கொடு’ என்ற இயல்பான தமிழ் மரபுத்தொடர் மூலத்தின் நேரடி உருவகத்தையும் அதன் சூழற்பொருளையும் காக்கிறது.
