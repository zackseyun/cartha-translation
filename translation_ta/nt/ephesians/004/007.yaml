source:
  edition: SBLGNT
  text: Ἑνὶ δὲ ἑκάστῳ ἡμῶν ἐδόθη ⸀ἡ χάρις κατὰ τὸ μέτρον τῆς δωρεᾶς τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/007.yaml
  text: But grace was given to each one of us according to the measure of Messiah’s gift[a].
translation:
  language: ta
  text: ஆனால் நம் ஒவ்வொருவருக்கும் மேசியாவின் கொடையின் அளவுக்கேற்ப அருள் கொடுக்கப்பட்டது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்துவின் கொடை.” கிரேக்கச் சொல்லான Χριστοῦ பெயரைப்போலச் செயல்படும் இடங்களில் “கிறிஸ்து” என்று மொழிபெயர்க்கலாம்; இங்கு “மேசியா” என்பது அந்தப் பட்டப்பெயரின் பொருளைத் தக்கவைக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑνὶ ... ἑκάστῳ ἡμῶν
  choice: நம் ஒவ்வொருவருக்கும்
  rationale: ἑνί மற்றும் ἑκάστῳ இணைந்து சமூகத்திலுள்ள ஒவ்வொரு நபருக்கும் தனித்தனியாக வழங்கப்படுவதை வலியுறுத்துகின்றன. “நம் ஒவ்வொருவருக்கும்” அந்தப் பகிர்ந்தளிக்கும் வலியுறுத்தலை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனங்களில் வலியுறுத்தப்பட்ட ஒருமையிலிருந்து, இங்கு தனித்தனியாக அளிக்கப்படும் அருளை நோக்கி வரும் மென்மையான மாறுபாட்டை இது குறிக்கிறது.
- source_word: ἐδόθη
  choice: கொடுக்கப்பட்டது
  rationale: இறந்தகாலச் செயப்பாட்டு வடிவத்தை நேரடியாகவும் இயல்பாகவும் எடுத்துரைக்கிறது.
- source_word: ἡ χάρις
  choice: அருள்
  rationale: பவுலின் முக்கியமான இறையியல் சொல்லாட்சியைத் தக்கவைக்கிறது; சூழல் இதைத் திருச்சபையில் ஊழியத்திற்காகத் தனித்தனியாக அளிக்கப்படும் அருளாக உணர்த்தினாலும், மொழிபெயர்ப்பு அதன் பொருளை அளவுக்கு மீறிக் குறுக்கவில்லை.
- source_word: κατὰ τὸ μέτρον
  choice: அளவுக்கேற்ப
  rationale: κατά இங்கு அளவுகோல் அல்லது விகிதத்தைக் குறிக்கிறது. “அளவுக்கேற்ப” என்பது அந்த உறவைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: τῆς δωρεᾶς
  choice: கொடையின்
  rationale: δωρεά என்பது இலவசமாக வழங்கப்படும் கொடையைக் குறிக்கிறது. “கொடை” அதன் அடிப்படைப் பொருளைச் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: τοῦ Χριστοῦ
  choice: மேசியாவின்
  rationale: Χριστός இங்கு பட்டப்பெயரின் பொருளைத் தக்கவைத்திருப்பதால் “மேசியா” என்று பொருளாக்கப்பட்டுள்ளது. உருபுச் சேர்க்கை, கொடை மேசியாவுக்குரியது அல்லது அவரால் வழங்கப்பட்டது என்ற கிரேக்கத்தின் இயல்பான தொடர்பைத் திறந்தவாறே வைக்கிறது.
theological_decisions:
- issue: இச்சூழலில் “அருள்” என்பதன் பொருள்
  choice: “அருள்” என்ற விரிவான இறையியல் சொல்லையே தக்கவைத்து, சூழலில் அது தனித்தனியாகப் பகிர்ந்தளிக்கப்படும் ஊழிய வல்லமையையும் கொடையையும் சுட்ட அனுமதித்தல்
  alternative: “ஊழியத்திற்கான அருள்கொடை” என்று வெளிப்படையாக விளக்குதல்; அல்லது இரட்சிக்கும் அருள் என்று குறுக்குதல்
  rationale: அடுத்தடுத்த வசனங்கள் வேறுபட்ட ஊழியக் கொடைகளைப் பற்றிப் பேசினாலும், χάρις என்ற சொல்லை விளக்கவுரையாக விரிவாக்குவது அதன் இறையியல் செறிவையும் இயல்பான பதற்றத்தையும் குறைக்கும்.
- issue: Χριστοῦ என்பதன் மொழியாக்கம்
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு Χριστός பட்டப்பெயரின் அர்த்தத்தை இன்னும் வெளிப்படுத்துகிறது. எனவே பொருளைத் தெளிவாகக் காக்க “மேசியா” முதன்மை உரையில் பயன்படுத்தப்பட்டு, பாரம்பரிய ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதே நேரத்தில் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. “அளவுக்கேற்ப” என்பது சொல்லுக்குச் சொல் கடினத்தன்மையைத் தவிர்த்து கிரேக்கத்தின் விகிதப் பொருளைக் காக்கிறது; “நம் ஒவ்வொருவருக்கும்” தனிநபர் சார்ந்த வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
