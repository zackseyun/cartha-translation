  text: if indeed you heard him and were taught in him[a], just as truth is in Jesus[b],
translation:
  language: ta
  text: உண்மையிலேயே நீங்கள் அவரைக் கேட்டும்[a], அவருக்குள் போதிக்கப்பட்டும் இருந்தீர்களானால், இயேசுவில் உண்மை இருப்பதுபோல[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவரைப் பற்றிக் கேட்டீர்கள்.’ கிரேக்கம் இன்னும் நேரடியாக, ‘அவரைக் கேட்டீர்கள்’ என்கிறது. அப்போஸ்தலர்கள் அறிவித்த செய்தியின் வழியாகக் கேட்பவர்கள் கிறிஸ்துவையே கேட்டார்கள் என்ற கருத்தை இது உணர்த்தக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: ‘அவருக்குள்’ என்பதும் ‘இயேசுவில்’ என்பதும் நிலைக்களம், ஒன்றிப்பு, அல்லது நெருங்கிய தொடர்பைக் குறிக்கலாம். கிரேக்கச் சொற்றொடர் வெறுமனே ‘அவரால்’ என்பதைக் காட்டிலும் விரிந்த பொருளை அனுமதிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: உண்மையிலேயே … இருந்தீர்களானால்
  rationale: நிபந்தனை வடிவத்தையும் γε தரும் மிதமான வலியுறுத்தலையும் காக்கிறது; இதை உறுதியான காரணவாக்கியமாக மாற்றவில்லை.
- source_word: αὐτὸν ἠκούσατε
  choice: நீங்கள் அவரைக் கேட்டும்
  rationale: αὐτόν நேரடி செயப்படுபொருளாக இருப்பதைப் பின்பற்றி, ‘அவரைப் பற்றிக் கேட்டீர்கள்’ என்று விளக்கமாக மாற்றாமல் மூலத்தின் குறிப்பிடத்தக்க சொல்லமைப்பைக் காக்கிறது.
- source_word: ἐν αὐτῷ
  choice: அவருக்குள்
  rationale: ἐν என்பதன் இடம், உறவு, ஒன்றிப்பு ஆகிய சாத்தியமான நுட்பங்களைத் திறந்தவையாக வைக்கிறது; ‘அவரால்’ என்று வெறும் கருவிப்பொருளாகக் குறுக்கவில்லை.
- source_word: ἐδιδάχθητε
  choice: கற்பிக்கப்பட்டும் இருந்தீர்கள்
  rationale: இறந்தகாலச் செயப்பாட்டு வடிவத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: καθώς
  choice: இருப்பதற்கேற்ப
  rationale: வாசகர்களுக்குக் கிடைத்த போதனைக்கும் இயேசுவில் இருக்கும் உண்மைக்கும் இடையிலான ஒத்திசைவை வெளிப்படுத்துகிறது.
- source_word: ἀλήθεια
  choice: உண்மை
  rationale: கிரேக்கத்தில் குறிப்புச் சுட்டு இல்லாததால் ‘அந்த உண்மை’ என்று வரையறுக்காமல் எளிய பெயர்ச்சொல்லாக மொழிபெயர்க்கிறது.
- source_word: ἐν τῷ Ἰησοῦ
  choice: இயேசுவில்
  rationale: ‘இயேசு’ என்ற தனிப்பட்ட பெயரையும் ἐν என்பதன் விரிந்த இடம்/உறவு நுட்பத்தையும் காக்கிறது.
theological_decisions:
- issue: αὐτὸν ἠκούσατε என்பது ‘அவரைக் கேட்டீர்கள்’ எனவா, ‘அவரைப் பற்றிக் கேட்டீர்கள்’ எனவா மொழிபெயர்க்கப்பட வேண்டும்?
  choice: அவரைக் கேட்டீர்கள்
  alternative: அவரைப் பற்றிக் கேட்டீர்கள்
  rationale: கிரேக்கத்தில் αὐτόν நேரடி செயப்படுபொருளாக உள்ளது; ஆகவே அப்போஸ்தல அறிவிப்பின் வழியாகக் கிறிஸ்துவையே கேட்டார்கள் என்ற சாத்தியத்தை மறைக்காமல் நேரடியாக மொழிபெயர்க்கப்படுகிறது.
- issue: ἐν αὐτῷ மற்றும் ἐν τῷ Ἰησοῦ ஆகியவற்றின் பொருள்
  choice: அவருக்குள் / இயேசுவில்
  alternative: அவரால் / இயேசுவோடு ஒன்றிப்பில்
  rationale: பவுலின் ἐν மொழிநடையில் இடம், உறவு, ஒன்றிப்பு ஆகியவை ஒருங்கே ஒலிக்கலாம். ஒரே ஒரு விளக்கத்துக்குள் பொருளைச் சுருக்காமல் மூலத்தின் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகருக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் நிபந்தனை வடிவமும் ‘அவருக்குள்/இயேசுவில்’ என்ற திட்டமிட்ட இறையியல் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன; தமிழில் வாக்கியம் இயல்பாக ஓடுவதற்காக καθώς தொடங்கும் பகுதி முன்வைக்கப்பட்டுள்ளது.
