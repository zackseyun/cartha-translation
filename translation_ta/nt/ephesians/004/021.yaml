- from: உண்மையிலேயே நீங்கள் அவரைக் கேட்டும்[a], இயேசுவில்[b] உண்மை இருப்பதற்கேற்ப அவருக்குள் கற்பிக்கப்பட்டும் இருந்தீர்களானால்,
  to: உண்மையிலேயே நீங்கள் அவரைக் கேட்டும்[a], அவருக்குள் போதிக்கப்பட்டும் இருந்தீர்களானால், இயேசுவில் உண்மை இருப்பதுபோல[b],
  rationale: The revision replaces a less idiomatic passive verb with ‘போதிக்கப்பட்டும் இருந்தீர்கள்’ and renders καθώς as ‘இருப்பதுபோல,’ preserving its comparative force. It retains the conditional syntax, the direct-object ambiguity of ‘heard him,’ the two distinct ἐν expressions, and the verse’s intentionally continuing syntax.
