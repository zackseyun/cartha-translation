  text: καὶ αὐτὸς ἔδωκεν τοὺς μὲν ἀποστόλους, τοὺς δὲ προφήτας, τοὺς δὲ εὐαγγελιστάς, τοὺς δὲ ποιμένας καὶ διδασκάλους,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/011.yaml
  text: And he himself gave some as apostles[a], some as prophets, some as evangelists, and some as shepherds and teachers[b],
translation:
  language: ta
  text: அவரே சிலரை அப்போஸ்தலர்களாகவும், சிலரை இறைவாக்கினர்களாகவும், சிலரை நற்செய்தியாளர்களாகவும், சிலரை மேய்ப்பர்களாகவும் போதகர்களாகவும்[a] கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மேய்ப்பர்களும் போதகர்களும்” என்பவற்றுக்கு முன் கிரேக்கத்தில் ஒரே வரையறைச் சுட்டே உள்ளது. ஆகவே இந்த இரு பணிகளுக்கும் மிக நெருங்கிய தொடர்பு இருக்கலாம்; எனினும் அவை ஒரே பதவியைத்தான் குறிக்கின்றன என்று இதனால் கட்டாயமாக முடிவுசெய்ய முடியாது.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: உம்மை இணைக்கும் தனிச்சொல்லாக மொழிபெயர்க்காமல் வாக்கியத் தொடர்ச்சியில் வெளிப்படுத்தப்பட்டது
  rationale: தமிழில் வசனத்தைத் தனியே வாசிக்கும்போது தொடக்கத்தில் ‘மேலும்’ அல்லது ‘மற்றும்’ என்பது இயல்பற்றதாக இருக்கலாம்; முந்தைய கருத்தின் தொடர்ச்சி வாக்கிய ஓட்டத்திலேயே உள்ளது.
- source_word: αὐτὸς
  choice: அவரே
  rationale: எழுவாய்க்குக் கொடுக்கப்பட்டுள்ள கிரேக்க அழுத்தத்தைத் தமிழின் ‘-ஏ’ விகுதி இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἔδωκεν
  choice: கொடுத்தார்
  rationale: δίδωμι என்பதன் நேரடியான பொருளைப் பாதுகாக்கிறது; ‘நியமித்தார்’ என்பது மூலத்தில் இல்லாத அலுவல் சார்ந்த விளக்கத்தைச் சேர்க்கும்.
- source_word: τοὺς μὲν ἀποστόλους ... τοὺς δὲ
  choice: சிலரை ... சிலரை
  rationale: μέν/δέ உடன் மீண்டும் வரும் உறுப்புகள் பல்வேறு நபர்களை அவரவர் பணிகளில் கொடுத்தார் என்ற பகிர்வைச் சுட்டுகின்றன.
- source_word: ἀποστόλους
  choice: அப்போஸ்தலர்களாக
  rationale: நவீன தமிழ் கிறிஸ்தவப் பயன்பாட்டில் அறியப்பட்ட, மூலச் சொல்லின் தனிப்பட்ட பணிப்பெயரைப் பாதுகாக்கும் வடிவம்.
- source_word: προφήτας
  choice: இறைவாக்கினர்களாக
  rationale: தீர்க்கதரிசனம் என்பது எதிர்கால முன்னறிவிப்பாக மட்டும் தவறாகக் குறுக்கப்படக்கூடும்; ‘இறைவாக்கினர்’ கடவுளின் செய்தியை உரைப்பவர் என்ற பரந்த மூலப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εὐαγγελιστάς
  choice: நற்செய்தியாளர்களாக
  rationale: நற்செய்தியை அறிவிப்பவர்களைக் குறிக்கும் தெளிவான, சுருக்கமான நவீன தமிழ்ச் சொல்.
- source_word: ποιμένας
  choice: மேய்ப்பர்களாக
  rationale: ποιμήν என்பதிலுள்ள மேய்ப்பன் உருவகத்தைப் பாதுகாக்கிறது; ‘போதகர்கள்/பாஸ்டர்கள்’ போன்ற பிற்கால சபைப் பதவிச்சொல்லை மூலத்தில் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: διδασκάλους
  choice: போதகர்களாக
  rationale: கற்பிப்பவர்களைக் குறிக்கும் வழக்கமான, கண்ணியமான தமிழ்ப் பணிப்பெயர்.
theological_decisions:
- issue: ποιμένας என்பது பாரம்பரிய சபைப் பதவிப்பெயராக மொழிபெயர்க்கப்பட வேண்டுமா, மேய்ப்பன் உருவகம் பாதுகாக்கப்பட வேண்டுமா?
  choice: மேய்ப்பர்களாக
  alternative: பாஸ்டர்களாக அல்லது சபைப் போதகர்களாக
  rationale: முதன்மை உரை கிரேக்கச் சொல்லின் மேய்ப்பன் உருவகத்தைப் பாதுகாக்கிறது; பாரம்பரியப் பதவிப்பெயர் மூலத்தின் பொருளைச் சபை அமைப்பின் குறிப்பிட்ட அலுவலாகக் குறுக்கக்கூடும்.
- issue: ποιμένας καὶ διδασκάλους ஒரே இணைந்த பதவியா அல்லது இரு தனித்த பணிகளா?
  choice: ‘மேய்ப்பர்களாகவும் போதகர்களாகவும்’ என்று இரு பெயர்களையும் இணைத்தே வைத்து விவாதத்தைத் தீர்மானிக்காமல் விடுதல்
  alternative: ‘மேய்ப்பர்-போதகர்களாக’ என்ற ஒரே இணைந்த பதவி; அல்லது முற்றிலும் தனித்த இரு குழுக்கள்
  rationale: ‘மேய்ப்பர்கள் மற்றும் போதகர்கள்’ என்பவற்றுக்கு முன் ஒரே கிரேக்க வரையறைச் சுட்டு இருப்பது நெருங்கிய தொடர்பைக் காட்டக்கூடும்; ஆயினும் அவை ஒரே பதவி என்று கட்டாயப்படுத்தாது. அடிக்குறிப்பு இந்த உண்மையான இலக்கணத் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான பட்டியல் அமைப்பு பயன்படுத்தப்பட்டுள்ளது. ‘அவரே’ மூலத்தின் வலியுறுத்தலைக் காக்கிறது. ‘மேய்ப்பர்கள்’ உருவகத்தைப் பாதுகாக்கிறது; ‘இறைவாக்கினர்’ என்பது προφήτης என்பதைக் வெறும் எதிர்காலக் கணிப்பவராகச் சுருக்காமல் வழங்குகிறது. பிரதான உரையில் உள்ள [a] குறி தொடர்புடைய இலக்கணத் தெளிவின்மையை அடிக்குறிப்புடன் இணைக்கிறது.
