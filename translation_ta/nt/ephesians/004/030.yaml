source:
  edition: SBLGNT
  text: καὶ μὴ λυπεῖτε τὸ πνεῦμα τὸ ἅγιον τοῦ θεοῦ, ἐν ᾧ ἐσφραγίσθητε εἰς ἡμέραν ἀπολυτρώσεως.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/030.yaml
  text: And do not grieve the Holy Spirit of God[a], in whom you were sealed for the day of redemption.
translation:
  language: ta
  text: தேவனுடைய பரிசுத்த ஆவியை வருத்தப்படுத்தாதீர்கள்; மீட்பின் நாளுக்காக அவரில் நீங்கள் முத்திரையிடப்பட்டீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மீட்பின் நாள் வரை’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் ‘மீட்பின் நாளுக்காக’ (εἰς ἡμέραν ἀπολυτρώσεως) என்று உள்ளது; இது எதிர்காலத்தை நோக்கிய காலப் பொருளிலும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπεῖτε
  choice: துயரப்படுத்தாதீர்கள்
  rationale: μή உடன் வரும் நிகழ்காலக் கட்டளை வடிவத்தின் தடைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது. மேலும், பரிசுத்த ஆவியுடனான தனிப்பட்ட உறவின் வலிமையையும் காக்கிறது.
- source_word: πνεῦμα τὸ ἅγιον τοῦ θεοῦ
  choice: தேவனுடைய பரிசுத்த ஆவி
  rationale: τοῦ θεοῦ என்ற வெளிப்படையான உடைமை வேற்றுமையைத் தக்கவைத்து, தமிழில் வழக்கமான மரியாதைமிக்க இறையியல் சொல்லாட்சியைப் பயன்படுத்துகிறது.
- source_word: ἐν ᾧ
  choice: அவருக்குள்
  rationale: ἐν என்பதன் அடிப்படைப் பொருளான ‘உள்/இல்’ என்பதைத் தக்கவைக்கிறது; அதேவேளையில் ஆவியை உயிரற்ற ஒன்றாகக் காட்டாமல் தனிப்பட்ட சுட்டை வெளிப்படுத்துகிறது. ‘அவரால்’ என்பது கருவி அல்லது செயலாண்மையைத் தெளிவாக நிர்ணயித்துவிடும் என்பதால் தவிர்க்கப்பட்டது.
- source_word: ἐσφραγίσθητε
  choice: நீங்கள் முத்திரையிடப்பட்டீர்கள்
  rationale: இறந்தகாலச் செயப்பாட்டு வடிவத்தையும், உரிமை, உறுதிப்படுத்தல் அல்லது பாதுகாப்பைக் குறிக்கக்கூடிய முத்திரை உருவகத்தையும் மேலதிக விளக்கமின்றித் தக்கவைக்கிறது.
- source_word: εἰς ἡμέραν ἀπολυτρώσεως
  choice: மீட்பின் நாளுக்காக
  rationale: εἰς என்பதன் இலக்கு அல்லது நோக்கை நோக்கிய பொருளை நேரடியாகக் காக்கிறது. சூழலில் எதிர்கால நிறைவைச் சுட்டும் ‘மீட்பின் நாள்’ என்ற இயல்பான தமிழையும் தருகிறது.
theological_decisions:
- issue: பரிசுத்த ஆவியைச் சுட்டும் உறவுப்பெயரின் தனிப்பட்ட தன்மை
  choice: ‘அவருக்குள்’ என்று தனிப்பட்ட சுட்டுடன் மொழிபெயர்த்தல்
  alternative: ‘அதற்குள்’ அல்லது ‘அதிலே’
  rationale: πνεῦμα என்பதன் இலக்கணப் பால் காரணமாக கிரேக்க உறவுப்பெயர் நடுநிலை வடிவில் இருந்தாலும், துயரப்படக்கூடிய பரிசுத்த ஆவியே இங்கு குறிக்கப்படுகிறார். எனவே தமிழில் உயிரற்ற பொருளுக்குரிய சுட்டைப் பயன்படுத்தாமல் தனிப்பட்ட சுட்டு தரப்பட்டுள்ளது.
- issue: முத்திரையிடப்படுதல் மீட்பின் நாளுடன் கொண்டுள்ள தொடர்பு
  choice: ‘மீட்பின் நாளுக்காக’
  alternative: ‘மீட்பின் நாள் வரை’
  rationale: இந்தத் தேர்வு εἰς என்பதன் இலக்கு நோக்கிய வலிமையைத் தக்கவைக்கிறது; முத்திரையின் காலவரம்பு அல்லது குறிப்பிட்ட இரட்சிப்பியல் அமைப்பு குறித்து வசனம் கூறுவதைவிட அதிகமாக முடிவுசெய்வதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பான, மரியாதைமிக்க வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. ‘முத்திரையிடப்பட்டீர்கள்’ என்ற உருவகமும் ‘அவருக்குள்’ என்ற கிரேக்க முன்னிடைச்சொல் அமைப்பும் திட்டமிட்டுத் தக்கவைக்கப்பட்டுள்ளன.
