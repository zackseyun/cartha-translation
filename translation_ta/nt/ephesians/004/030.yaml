revisions:
- from: தேவனுடைய பரிசுத்த ஆவியைத் துயரப்படுத்தாதீர்கள்; மீட்பின் நாளுக்காக அவருக்குள் நீங்கள் முத்திரையிடப்பட்டீர்கள்.[a]
  to: தேவனுடைய பரிசுத்த ஆவியை வருத்தப்படுத்தாதீர்கள்; மீட்பின் நாளுக்காக அவரில் நீங்கள் முத்திரையிடப்பட்டீர்கள்.[a]
  rationale: 'The revision makes two limited stylistic corrections: ‘வருத்தப்படுத்தாதீர்கள்’ is more idiomatic for the command not to grieve, and ‘அவரில்’ more naturally renders the personal locative phrase ἐν ᾧ. The passive sealing metaphor, its past reference, and its orientation toward the day of redemption remain unchanged. The alternative temporal nuance is retained in the footnote.'
