    reason: alternative_reading
lexical_decisions:
- source_word: ἐνδύσασθαι
  choice: அணிந்துகொள்ளவும்
  rationale: முந்தைய வசனத்தில் உள்ள பழைய மனிதனைக் களைதல் என்ற ஆடை உருவகத்தைத் தொடர்ந்து, நடுநிலை வினைவடிவத்தின் தன்மையையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: καινὸν ἄνθρωπον
  choice: புதிய மனிதனை
  rationale: καινός குறிப்பிடும் பண்பில் புதிய தன்மையையும், சூழலில் உள்ள “பழைய மனிதன்” என்பதுடனான நேரடி சொல்லிணைப்பையும் பாதுகாக்கிறது; “சுயம்” என்பது சாத்தியமான ஆனால் விளக்கமளிக்கும் மொழிபெயர்ப்பு என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: κατὰ θεὸν
  choice: கடவுளுக்கு ஏற்ப
  rationale: κατά + accusative என்பதன் ஒத்திசைவு அல்லது மாதிரிக்கு ஏற்ப என்ற பரந்த பொருளைத் திறந்தவாறே வைத்து, “சாயல்” என்ற விளக்கத்தை முதன்மை உரைக்குள் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: κτισθέντα
  choice: படைக்கப்பட்ட
  rationale: செயப்பாட்டு இறந்தகாலப் பங்கேற்புவினையின் படைப்பு மொழியையும், அது “புதிய மனிதனை” வர்ணிப்பதையும் தெளிவாகக் காக்கிறது.
- source_word: δικαιοσύνῃ
  choice: நீதியிலும்
  rationale: δικαιοσύνη என்பதற்கான வழக்கமான பரந்த இறையியல் மற்றும் ஒழுக்கப் பொருளை “நீதி” தக்கவைக்கிறது; “நியாயம்” என்ற மாற்று அடிக்குறிப்பில் பதிவு செய்யப்படுகிறது.
- source_word: ὁσιότητι
  choice: பரிசுத்தத்திலும்
  rationale: கடவுளுக்குரிய தூய்மை, பக்திநெறி ஆகியவற்றைக் குறிக்கும் ὁσιότης என்பதற்கு இயல்பான, மதிப்புமிக்க தமிழ் இணைச்சொல்.
- source_word: τῆς ἀληθείας
  choice: உண்மையின்
  rationale: மூலத்தின் உருபுடைமைத் தொடர்பை முற்றிலும் “உண்மையான” என்று விளக்கிவிடாமல் பாதுகாக்கிறது; அந்தத் தொடர்பு நீதிக்கும் பரிசுத்தத்திற்கும் பொருந்தும் வகையில் வாக்கிய அமைப்பு வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: “புதிய மனிதன்” என்ற மானுடவியல் சொற்றொடர்
  choice: புதிய மனிதனை
  alternative: புதிய சுயத்தை / புதிய நபரை
  rationale: ἄνθρωπος என்ற சொல்லையும், உடனடி சூழலில் உள்ள “பழைய மனிதன்” என்ற இணை உருவகத்தையும் முதன்மை உரை பாதுகாக்கிறது. மாற்றுகள் வாசகருக்காக அடிக்குறிப்பில் தரப்படுகின்றன.
- issue: κατὰ θεὸν என்பதன் உறவு
  choice: கடவுளுக்கு ஏற்ப
  alternative: கடவுளின் சாயலில் / கடவுளைப் பின்பற்றி
  rationale: இது கடவுளோடு ஒத்திசைவு, அவரது மாதிரி, அல்லது அவரது சாயல் ஆகிய நுணுக்கங்களுக்கு இடமளித்து, ஒரே விளக்கத்தைத் தீர்மானமாக்காமல் இருக்கிறது.
- issue: τῆς ἀληθείας என்ற உருபுடைமைத் தொடர்
  choice: உண்மையின் நீதியிலும் பரிசுத்தத்திலும்
  alternative: உண்மையான நீதியிலும் பரிசுத்தத்திலும்
  rationale: மூலத்தின் தெளிவற்ற உருபுடைமை உறவை முதன்மை உரை பாதுகாக்கிறது; குணவிளக்கப் பொருளான “உண்மையான” என்பது இயல்பான மாற்றுப் புரிதலாக அடிக்குறிப்பில் தரப்படுகிறது.
- issue: δικαιοσύνη என்பதன் பொருள் பரப்பு
  choice: நீதி
  alternative: நியாயம்
  rationale: “நீதி” பவுலின் பயன்பாட்டிலுள்ள ஒழுக்க மற்றும் உறவுசார் பரப்பைத் தக்கவைக்கிறது; சமூக அல்லது தீர்ப்புசார் நியாயம் என்ற நுணுக்கம் சாத்தியமாதலால் மாற்று பதிவு செய்யப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதாகப் புரியும், ஆனால் வேதாகம உரைக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. “அணிந்துகொள்ளுதல்” என்ற ஆடை உருவகமும் “பழைய மனிதன்/புதிய மனிதன்” என்ற சூழல்சார் இணைப்பும் பாதுகாக்கப்பட்டுள்ளன. வசனம் முந்தைய வாக்கிய அமைப்பைத் தொடரும் infinitive தொடர் என்பதால் “மேலும் ... அணிந்துகொள்ளவும்” என்ற இணை வடிவம் வைக்கப்பட்டுள்ளது.
