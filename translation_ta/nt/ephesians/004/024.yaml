  text: καὶ ἐνδύσασθαι τὸν καινὸν ἄνθρωπον τὸν κατὰ θεὸν κτισθέντα ἐν δικαιοσύνῃ καὶ ὁσιότητι τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/024.yaml
  text: and to put on the new man[d][c][b][a], created according to God in righteousness and holiness of the truth.
translation:
  language: ta
  text: 'மேலும், கடவுளுக்கு ஏற்பப்[b] உண்மையின் நீதியிலும்[c] பரிசுத்தத்திலும்[d] படைக்கப்பட்ட புதிய மனிதனை[a] அணிந்துகொள்ளவும்.


    [a] “புதிய சுயத்தை” அல்லது “புதிய நபரை” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் “புதிய மனிதன்”; சுற்றியுள்ள பகுதியில் வரும் “பழைய மனிதன்” என்ற சொல்லோடு இது இணைகிறது.


    [b] “கடவுளின் சாயலில்” அல்லது “கடவுளைப் பின்பற்றி” என்றும் பொருள் கொள்ளலாம்.


    [c] “நீதி” என்பதற்கு இங்கே “நியாயம்” என்றும் மொழிபெயர்க்கலாம்.


    [d] “உண்மையான நீதியிலும் பரிசுத்தத்திலும்” என்றும் பொருள் கொள்ளலாம்.'
  philosophy: optimal-equivalence
