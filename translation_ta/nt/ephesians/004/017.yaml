  text: Τοῦτο οὖν λέγω καὶ μαρτύρομαι ἐν κυρίῳ, μηκέτι ὑμᾶς περιπατεῖν καθὼς καὶ ⸀τὰ ἔθνη περιπατεῖ ἐν ματαιότητι τοῦ νοὸς αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/017.yaml
  text: 'Therefore I say this and testify in the Lord: you must no longer walk as the Gentiles walk[a], in the futility of their minds,'
translation:
  language: ta
  text: 'ஆகவே, இதை நான் சொல்லுகிறேன்; ஆண்டவருக்குள் சாட்சியமும் அளிக்கிறேன்: இனி நீங்கள் பிற இனத்தவர்கள் நடப்பதுபோல்[a] நடக்கக்கூடாது; அவர்கள் தங்கள் மனதின் வீண்மையில் நடக்கிறார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தேசங்கள்’; சில மொழிபெயர்ப்புகள் ἔθνη என்பதை இங்கு ‘புறமதத்தார்’ என வழங்குகின்றன.
