lexical_decisions:
- source_word: Τοῦτο οὖν
  choice: ஆகவே, நான் இதைச் சொல்லி
  rationale: οὖν முந்தைய அறிவுரையிலிருந்து வரும் முடிவுறு தொடர்பைக் காட்டுவதால் ‘ஆகவே’ என மொழிபெயர்க்கப்பட்டது; Τοῦτο, λέγω என்பதன் நேரடிப் பொருளாக இயல்பாக வைக்கப்பட்டது.
- source_word: μαρτύρομαι
  choice: உறுதியாகச் சாட்சியளிக்கிறேன்
  rationale: இச்சொல் தனிப்பட்ட, ஆணித்தரமான சான்றுரையின் வலிமையைக் கொண்டது. ‘உறுதியாக’ என்பது அறிவுரையின் தீவிரத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘சாட்சியளிக்கிறேன்’ அதன் சாட்சி சார்ந்த அடிப்படை உருவகத்தைப் பேணுகிறது.
- source_word: ἐν κυρίῳ
  choice: ஆண்டவருக்குள்
  rationale: பவுல் பேசும் உறவும் அதிகாரச் சூழலும் ஆகிய இரண்டையும் திறந்தவாறு வைக்க, மூலத்தின் ἐν அமைப்பு நேரடியாகப் பேணப்பட்டது.
- source_word: μηκέτι ὑμᾶς περιπατεῖν
  choice: நீங்களும் இனி நடக்கக்கூடாது
  rationale: μηκέτι முந்தைய வாழ்க்கை முறையைத் தொடராதிருப்பதைக் குறிக்கிறது. சார்பு வினையெச்சத்தின் அறிவுரை வலிமை தமிழில் ‘நடக்கக்கூடாது’ எனத் தெளிவாக்கப்பட்டுள்ளது; περιπατέω என்பதன் ஒழுக்கவாழ்வு உருவகம் ‘நட’ என்பதில் பேணப்பட்டுள்ளது.
- source_word: τὰ ἔθνη
  choice: பிற இனத்தார்
  rationale: இது யூதரல்லாத மக்களைக் குறிக்கும் பவுலின் பயன்பாட்டை இயல்பான தமிழில் தருகிறது. ‘புறமதத்தார்’ என்பது மூலப் பெயர்ச்சொல்லில் வெளிப்படையாக இல்லாத மதத் தீர்ப்பைச் சேர்க்கக்கூடும்.
- source_word: ἐν ματαιότητι
  choice: பயனற்ற தன்மையில்
  rationale: ματαιότης வெறுமை, வீண்போக்கு, பயனின்மை ஆகிய பொருள் நிழல்களைக் கொண்டது. ‘பயனற்ற தன்மை’ நோக்கமற்ற, பலனற்ற மனப்போக்கைத் தெளிவாகக் காட்டுகிறது.
- source_word: τοῦ νοὸς αὐτῶν
  choice: தங்கள் மனத்தின்
  rationale: νοῦς என்பதை நேரடியாக ‘மனம்’ என வழங்கி, அடுத்த வசனத்தில் வரும் புரிதல் சார்ந்த வேறு சொல்லோடு தேவையின்றி ஒன்றுபடுத்தாமல் வைத்துள்ளது.
theological_decisions:
- issue: பெரும்பாலும் பிற இனப் பின்னணியுடைய சபையிடம் சொல்லப்படும் ஒழுக்க வேறுபாட்டில் ἔθνη என்பதன் பொருள்
  choice: பிற இனத்தார்
  alternative: தேசத்தார்; புறமதத்தார்
  rationale: ‘பிற இனத்தார்’ என்பது பவுலின் இன மற்றும் உடன்படிக்கை சார்ந்த வகைப்பாட்டைப் பேணுகிறது; ‘புறமதத்தார்’ எனும் வலுவான இழிவான மதநிறத்தைச் சேர்ப்பதில்லை. இது எல்லா யூதரல்லாதவர்களையும் எல்லா விதத்திலும் மதிப்பிடாமல், அவர்களின் முந்தைய வாழ்க்கை முறையையே வேறுபடுத்துகிறது.
- issue: λέγω καὶ μαρτύρομαι என்பவற்றைச் சார்ந்த περιπατεῖν என்ற வினையெச்சத்தின் அறிவுரை வலிமை
  choice: நீங்களும் இனி நடக்கக்கூடாது
  alternative: நீங்கள் இனி நடக்காதிருக்க வேண்டும்
  rationale: தமிழில் கட்டளையின் ஒழுக்கத் தீவிரத்தை இயல்பாக வெளிப்படுத்த ‘நடக்கக்கூடாது’ பயன்படுத்தப்பட்டுள்ளது; இது இலக்கணத்தில் உள்ள அறிவுரையைத் தெளிவாக்குகிறதே தவிர தனியான கோட்பாட்டுக் கருத்தைச் சேர்ப்பதில்லை.
- issue: ἐν κυρίῳ என்பதில் உறவுச் சூழலா அல்லது அதிகாரமா
  choice: ஆண்டவருக்குள்
  alternative: ஆண்டவரால்; ஆண்டவருக்கு முன்பாக
  rationale: ‘ஆண்டவருக்குள்’ என்ற நேரடி வடிவம் உறவுச் சூழலும் அதிகாரமும் ஆகிய சாத்தியங்களைத் தேவையின்றி ஒன்றாக முடிவுசெய்யாமல் பேணுகிறது.
