revisions:
- from: 'ஆகவே, நான் இதைச் சொல்லி, ஆண்டவருக்குள் உறுதியாகச் சாட்சியளிக்கிறேன்: பிற இனத்தார் நடப்பதுபோல்[a] நீங்களும் இனி நடக்கக்கூடாது; அவர்கள் தங்கள் மனத்தின் பயனற்ற தன்மையில் நடக்கிறார்கள்.'
