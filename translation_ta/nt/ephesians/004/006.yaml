  text: one God and Father of all[b][a], who is over all and through all and in all.
translation:
  language: ta
  text: அனைத்திற்கும் ஒரே கடவுளும் தந்தையுமானவர் இருக்கிறார்; அவர் அனைத்திற்கும் மேலாகவும், அனைத்தின் வழியாகவும், அனைத்திலும் இருக்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அனைவருக்கும் ஒரே கடவுளும் தந்தையுமானவர்; அவர் அனைவருக்கும் மேலாகவும், அனைவரின் வழியாகவும், அனைவருக்குள்ளும் இருக்கிறார்.” கிரேக்கத்தில் மீண்டும் வரும் சொல் வெளிப்படையான பெயர்ச்சொல் இன்றி உள்ளது; எனவே அது “அனைத்தையும்” அல்லது “அனைவரையும்” குறிக்கலாம். சில கையெழுத்துப் பிரதிகளில், “உங்கள் எல்லாருக்குள்ளும்” என்று உள்ளது.
    reason: lexical_alternative; textual_variant
lexical_decisions:
- source_word: εἷς θεὸς καὶ πατὴρ πάντων
  choice: எல்லாருக்கும் ஒரே கடவுளும் தந்தையுமானவர்
  rationale: εἷς என்பதன் வலியுறுத்தலையும், சுற்றியுள்ள ‘ஒரே’ என்ற ஒருமைப்பாட்டு வரிசையையும் காக்கிறது. πάντων என்பதற்கு வெளிப்படையான பெயர்ச்சொல் இல்லாவிட்டாலும், நவீனத் தமிழில் இயல்பாக வாசிக்க ‘எல்லாருக்கும்’ பயன்படுத்தப்பட்டுள்ளது; அதன் பரந்த மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ὁ ἐπὶ πάντων
  choice: அவர் எல்லாருக்கும் மேலானவர்
  rationale: ἐπί + மரபுவேற்றுமை இங்கு மேலாதிக்கம் அல்லது உயர்நிலையை உணர்த்துகிறது; ‘மேலானவர்’ இயல்பான, கண்ணியமான தமிழாகும்.
- source_word: διὰ πάντων
  choice: எல்லார் வழியாகவும் செயல்படுகிறவர்
  rationale: διά + மரபுவேற்றுமையின் வழிமுறை அல்லது செயற்பாட்டு ஊடகம் என்ற பொருளைத் தெளிவான தமிழில் வெளிப்படுத்த ‘செயல்படுகிறவர்’ சேர்க்கப்பட்டுள்ளது. இது உள்ளார்ந்த செயற்பாட்டை விளக்குகிறது; புதிய செயலைக் கற்பிப்பதில்லை.
- source_word: ἐν πᾶσιν
  choice: எல்லாருக்குள்ளும் இருப்பவர்
  rationale: ἐν என்பதன் உள்ளிருப்பு பொருளையும் மும்மை இணைப்பையும் காக்கிறது. பெயர்ச்சொல் குறிப்பிடப்படாததால் உள்ள பரந்த சாத்தியம் அடிக்குறிப்பில் சுட்டப்படுகிறது.
theological_decisions:
- issue: πάντων / πᾶσιν என்பவற்றின் வரம்பு
  choice: முதன்மை உரையில் ‘எல்லார்’ என்று மனிதர்களைக் குறிக்கும் இயல்பான தமிழைப் பயன்படுத்தி, பரந்த சாத்தியத்தை அடிக்குறிப்பில் காக்குதல்
  alternative: ‘அனைத்துக்கும் / அனைத்தின் வழியாகவும் / அனைத்திலும்’ என்று படைத்த அனைத்தையும் உள்ளடக்கும் வகையில் மொழிபெயர்த்தல்
  rationale: உடனடிச் சூழல் திருச்சபையின் ஒருமைப்பாட்டைப் பற்றியது; ஆகவே மனிதர்களைக் குறிக்கும் வாசிப்பு இயல்பானது. எனினும் கிரேக்கத்தில் வெளிப்படையான பெயர்ச்சொல் இல்லாததால் ‘எல்லாவற்றையும்’ குறிக்கும் பரந்த வாசிப்பை நிராகரிக்காமல் அடிக்குறிப்பில் பதிவு செய்கிறது.
- issue: ἐν πᾶσιν என்ற இடத்தின் உரைவேறுபாடு
  choice: SBLGNT முதன்மை உரையான ‘எல்லாருக்குள்ளும்’ என்பதைப் பின்பற்றுதல்
  alternative: சில கையெழுத்துப் பிரதிகளின்படி ‘உங்கள் எல்லாருக்குள்ளும்’
  rationale: கொடுக்கப்பட்ட விமர்சனப் பதிப்பின் உரையே முதன்மையாக மொழிபெயர்க்கப்படுகிறது; முக்கியமான கையெழுத்துப் பிரதி வேறுபாடு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. கிரேக்கத்தின் சுருக்கமான மும்மை அமைப்பு தமிழில் தெளிவடைய இணையான வினைமுற்றுகளாக விரிக்கப்பட்டுள்ளது; மூன்று முறை வரும் ‘எல்லார்’ என்ற ஒலிப்பிணைப்பு இயன்றவரை காக்கப்பட்டுள்ளது.
