  text: for the equipping of the saints for the work of ministry[a], for the building up of the body of Messiah[c][b],
translation:
  language: ta
  text: பரிசுத்த மக்களைத் தகுதிப்படுத்துவதற்காக, ஊழியப் பணிக்காக[a], மெசியாவின் உடலைக்[b] கட்டியெழுப்புவதற்காக[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சேவைப் பணிக்காக.’ கிரேக்கச் சொல்லான διακονία என்பதற்கு ‘ஊழியம்’ அல்லது ‘சேவை’ என்று பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘கிறிஸ்துவின் உடலை.’ கிரேக்கப் பட்டப்பெயரான Χριστός என்பதன் பட்டப்பெயர்ச் சார்ந்த பொருளைப் பாதுகாக்க இங்கே ‘மெசியா’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: c
    text: இந்தக் கிரேக்கத் தொடரை, ‘பரிசுத்த மக்களை ஊழியப் பணிக்காகத் தகுதிப்படுத்தி, மெசியாவின் உடலைக் கட்டியெழுப்புவதற்காக’ என்ற படிநிலைப் பொருளிலும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς τὸν καταρτισμὸν
  choice: தகுதிப்படுத்துவதற்காக
  rationale: καταρτισμός என்பது ஒருவரைப் பணிக்குப் பொருத்தமாக ஆயத்தப்படுத்துவதைக் குறிக்கிறது. ‘தகுதிப்படுத்துதல்’ அதன் நோக்கத்தையும் செயல்திறனையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: τῶν ἁγίων
  choice: பரிசுத்த மக்களை
  rationale: இது தேவனுக்கென்று பிரித்தெடுக்கப்பட்ட விசுவாசிகளைக் குறிக்கும் பவுலின் வழக்கமான சொற்றொடர். ‘மக்கள்’ என்பது பிற்காலத்தில் தனிநபர்களுக்கு வழங்கப்படும் சிறப்புப் பட்டம் என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: εἰς ἔργον διακονίας
  choice: ஊழியப் பணிக்காக
  rationale: διακονία என்பது ஊழியம் அல்லது சேவை எனப் பொருள்படலாம். திருச்சபைச் சூழலில் ‘ஊழியப் பணி’ இயல்பாக இருந்தாலும், அதை மதகுருக்களின் பணியாக மட்டும் கட்டுப்படுத்தவில்லை.
- source_word: εἰς οἰκοδομὴν
  choice: கட்டியெழுப்புவதற்காக
  rationale: οἰκοδομή இங்கு சமூகத்தை வலுப்படுத்தும் கட்டுமான உருவகமாகப் பயன்படுத்தப்பட்டுள்ளது. ‘கட்டியெழுப்புதல்’ அந்த உருவகத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: τοῦ σώματος
  choice: உடலை
  rationale: σῶμα என்பதன் நேரடிப் பொருளான ‘உடல்’ பவுலின் சமூக உருவகத்தையும் காக்கிறது.
- source_word: τοῦ Χριστοῦ
  choice: மெசியாவின்
  rationale: Χριστός இங்கு பட்டப்பெயராக இருப்பதால் அதன் அபிஷேகம் பெற்றவர் என்ற பொருளை வெளிப்படுத்த ‘மெசியா’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: மூன்று நோக்கச் சொற்றொடர்களுக்கிடையிலான தொடரியல் உறவு
  choice: மூன்றையும் தனித்தனி நோக்கச் சொற்றொடர்களாக அமைத்து, கிரேக்கத்தின் πρὸς ... εἰς ... εἰς என்ற வரிசையைப் பாதுகாத்தல்
  alternative: பரிசுத்த மக்கள் ஊழியப் பணிக்காகத் தகுதிப்படுத்தப்படுகிறார்கள்; அந்த ஊழியம் மெசியாவின் உடலைக் கட்டியெழுப்புகிறது என்ற படிநிலை வாசிப்பு
  rationale: கிரேக்கத் தொடரை ஒருங்கிணைந்த மூன்று நோக்கங்களாகவும், ஒன்றிலிருந்து மற்றொன்று விளையும் படிநிலையாகவும் புரிந்துகொள்ள முடியும். முதன்மை உரை உறவைத் தீர்மானிக்காமல் அமைப்பைப் பாதுகாக்கிறது; மாற்று புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. வசனம் 11-இல் தொடங்கும் வாக்கியத்தின் தொடர்ச்சி என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. ‘பரிசுத்த மக்கள்’ என்பது திருச்சபையிலுள்ள விசுவாசிகள் அனைவரையும் உள்ளடக்கும் பொதுவான சொல்லாக்கம்; ‘ஊழியம்’ மதகுருக்களுக்கு மட்டும் உரியது என உரை வரையறுக்கவில்லை.
