translation:
  language: ta
  text: மேலும், உங்கள் மனத்தின் ஆவியில் புதுப்பிக்கப்படவும்[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் மனத்தின் ஆவியால் புதுப்பிக்கப்படவும்.” எனினும், இச்சொற்றொடர் நேரடியாகப் பரிசுத்த ஆவியைக் குறிப்பதைவிட, உங்கள் மனத்தின் உள்ளார்ந்த மனப்பாங்கை அல்லது திசைநிலையைக் குறிக்க அதிக வாய்ப்புள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνανεοῦσθαι
  choice: புதுப்பிக்கப்படவும்
  rationale: நிகழ்காலச் செயல்பாட்டு வடிவமல்லாத, செயப்படுபொருள் பொருளுடைய வினையெச்சத் தொடரைத் தக்கவைக்கிறது. புதுப்பித்தல் தொடர்ந்து நிகழும் செயலாக இருக்கலாம்; ஆனால் மூலத்தில் வெளிப்படையாக இல்லாத காலவிளக்கத்தை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: δὲ
  choice: மேலும்
  rationale: இங்கு வலுவான எதிர்மறைத் திருப்பத்தைவிட, தொடர்ச்சியாக வரும் வினையெச்சங்களை இணைக்கும் மென்மையான இணைப்பாக உள்ளது.
- source_word: τῷ πνεύματι
  choice: ஆவியில்
  rationale: இடம் அல்லது தொடர்பின் கோணத்தைக் குறிக்கும் தத்தியைப் பாதுகாக்கிறது. இங்கு ‘ஆவி’ என்பது மனத்தின் உள்ளார்ந்த மனப்பாங்கையோ திசைநிலையையோ குறிக்க அதிக வாய்ப்புள்ளது; இருப்பினும் கருவிப்பொருளாக வாசிக்கும் சாத்தியத்தை அடிக்குறிப்பு தக்கவைக்கிறது.
- source_word: νοὸς
  choice: மனத்தின்
  rationale: νοῦς என்பதன் நேரடியான, இயல்பான பொருளான ‘மனம்’ என்பதைக் கொண்டு, ‘மனத்தின் ஆவி’ என்ற மூலத்தின் நெருக்கமான தொடர்பைப் பாதுகாக்கிறது.
- source_word: ὑμῶν
  choice: உங்கள்
  rationale: இரண்டாம் நபர் பன்மை உடைமையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: πνεύματι என்பது தூய ஆவியைக் குறிக்கிறதா, மனிதரின் உள்ளார்ந்த ஆவி அல்லது மனப்பாங்கைக் குறிக்கிறதா?
  choice: ‘உங்கள் மனத்தின் ஆவியில்’—மனத்தின் உள்ளார்ந்த மனப்பாங்கு அல்லது திசைநிலையை முதன்மையாகக் குறிக்கும் வாசிப்பு
  alternative: ‘உங்கள் மனத்தின் ஆவியால்’—ஆவியைப் புதுப்பித்தலின் கருவி அல்லது செயற்பாட்டாளராக வாசித்தல்; இதைத் தூய ஆவியோடும் தொடர்புபடுத்தலாம்
  rationale: τοῦ νοὸς ὑμῶν என்பது πνεύματι என்பதை இயல்பாகத் தகுதிப்படுத்துவதால், மனிதரின் உள்ளார்ந்த மனநிலையைச் சுட்டும் சொற்றொடராகப் புரிவது அதிக வாய்ப்புள்ளது. ஆயினும் தத்தியின் கருவிப்பொருள் சாத்தியத்தையும் ‘ஆவி’ என்ற சொல்லின் இறையியல் எதிரொலியையும் முற்றாக நீக்காமல் அடிக்குறிப்பில் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வேதவசனத்திற்குரிய கண்ணியத்துடன் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. சுற்றியுள்ள ‘களைந்துபோடவும் / புதுப்பிக்கப்படவும் / அணிந்துகொள்ளவும்’ என்ற வினையெச்சத் தொடருடன் பொருந்துமாறு ‘புதுப்பிக்கப்படவும்’ தேர்ந்தெடுக்கப்பட்டது. ‘மனத்தின் ஆவி’ என்பது தமிழில் சற்றே செறிவான சொற்றொடராக இருந்தாலும், மூலத்தின் உண்மையான பொருள் நெருக்கத்தையும் தெளிவின்மையையும் பாதுகாக்கிறது.
