review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the contrast of abandoning theft, undertaking honest manual labor, and sharing with a needy person. However, “திருடாமல்” functions chiefly as a participial prohibition and does not state the Greek third-person imperative as clearly as “இனி திருடக் கூடாது.” “அப்போது” weakens the ἵνα purpose clause into a temporal result; “...இருக்கும்படி” retains the stated purpose. “பகிர்ந்தளிக்க” is clearer than “உடன் பகிர்ந்துகொள்ள,” which can suggest jointly enjoying something.
  naturalness: The revision uses natural modern standard Tamil while retaining a dignified exhortative register. “தன் சொந்தக் கைகளால் நல்லதைச் செய்து கடினமாக உழைக்கட்டும்” is intelligible and reflects the source sequence without needless stiffness.
  terminology: “திருடுகிறவன்” preserves the substantival present participle without labeling the person permanently as “திருடன்.” “நல்லதை” appropriately preserves the breadth of τὸ ἀγαθόν; the viable contextual alternative “நல்ல வேலையை” is retained in a footnote. “தேவையில் இருப்பவர்” naturally renders the person who has need.
  issues:
  - severity: medium
    issue: The purpose clause is rendered with “அப்போது” (“then/at that time”).
    rationale: ἵνα ἔχῃ expresses purpose, not merely a subsequent temporal outcome. “இருக்கும்படி” explicitly preserves the purpose relation.
  - severity: medium
    issue: “திருடாமல்” does not fully express the negative imperative.
    rationale: Although understandable in context, it is a nonfinite form. “இனி திருடக் கூடாது” gives the required prohibition clearly in modern Tamil.
  - severity: low
    issue: “தேவையில் இருப்பவருடன் பகிர்ந்துகொள்ள” may imply sharing jointly with someone.
    rationale: The Greek dative identifies the recipient. “தேவையில் இருப்பவருக்குப் பகிர்ந்தளிக்க” more clearly conveys giving from one’s resources to that person.
  revised_text: திருடுகிறவன் இனி திருடக் கூடாது; அதற்குப் பதிலாகத் தன் சொந்தக் கைகளால் நல்லதைச் செய்து கடினமாக உழைக்கட்டும்[a], தேவையில் இருப்பவருக்குப் பகிர்ந்தளிக்க அவனிடம் ஏதாவது இருக்கும்படி[b].
