  text: ὁ κλέπτων μηκέτι κλεπτέτω, μᾶλλον δὲ κοπιάτω ἐργαζόμενος ⸂ταῖς ἰδίαις χερσὶν τὸ ἀγαθόν⸃, ἵνα ἔχῃ μεταδιδόναι τῷ χρείαν ἔχοντι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/028.yaml
  text: The one who steals must steal no longer[a], but rather must labor, doing good work with his own hands[b], so that he may have something to share with the one who has need.
translation:
  language: ta
  text: திருடுகிறவன் இனி திருடக் கூடாது; அதற்குப் பதிலாகத் தன் சொந்தக் கைகளால் நல்லதைச் செய்து கடினமாக உழைக்கட்டும்[a], தேவையில் இருப்பவருக்குப் பகிர்ந்தளிக்க அவனிடம் ஏதாவது இருக்கும்படி[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் சொந்தக் கைகளால் நல்ல வேலையைச் செய்து கடினமாக உழைக்கட்டும்.”
    reason: ἐργαζόμενος ... τὸ ἀγαθόν என்பதை, பரந்த பொருளில் ‘நல்லதைச் செய்தல்’ என்றும், இச்சூழலில் ‘நல்ல வேலையைச் செய்தல்’ என்றும் மொழிபெயர்க்கலாம்.
  - marker: b
    text: அல்லது, “தேவையில் இருப்பவருக்குக் கொடுக்க அவனிடம் ஏதாவது இருக்கும்படி.”
    reason: μεταδιδόναι என்பது ஒருவருக்குத் தனக்குள்ளதிலிருந்து பகிர்ந்தளித்தல் அல்லது கொடுத்தல் என மொழிபெயர்க்கப்படலாம்.
lexical_decisions:
- source_word: ὁ κλέπτων
  choice: திருடுகிறவன்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புவினை; ஒருவரை நிலையான அடையாளப்பெயரால் முத்திரையிடாமல், திருடும் பழக்கமுள்ளவரைக் குறிக்கிறது.
- source_word: μηκέτι κλεπτέτω
  choice: இனி திருடாமல்
  rationale: முன்னைய செயலுக்கு முற்றுப்புள்ளி வைக்கும் கட்டளையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; அடுத்துள்ள நேர்மறைக் கட்டளையுடன் இணைந்து நிற்கிறது.
- source_word: μᾶλλον δὲ
  choice: அதற்குப் பதிலாக
  rationale: திருடுதலுக்கும் உழைப்புக்கும் இடையிலான வலுவான திருத்தும் எதிர்மறையைத் தெளிவாகக் காட்டுகிறது.
- source_word: κοπιάτω
  choice: கடினமாக உழைக்கட்டும்
  rationale: சாதாரணமாக வேலை செய்வதைவிட முயற்சியும் களைப்பும் உடைய உழைப்பைக் குறிக்கும் வினையின் வலிமையையும் மூன்றாம் நபர் கட்டளைத் தன்மையையும் காக்கிறது.
- source_word: ἐργαζόμενος ... τὸ ἀγαθόν
  choice: நல்லதைச் செய்து
  rationale: ἐργάζομαι மற்றும் பெயர்ச்சொல்லாகப் பயன்படும் τὸ ἀγαθόν ஆகியவற்றின் அமைப்பைச் சுருக்காமல், நல்லது அல்லது பயனுள்ளது எனும் பரந்த பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: ταῖς ἰδίαις χερσὶν
  choice: தன் சொந்தக் கைகளால்
  rationale: ἰδίαις என்பதன் தனிப்பட்ட உழைப்பு வலியுறுத்தலையும் கைகளால் உழைத்தல் என்ற தெளிவான உருவகத்தையும் பாதுகாக்கிறது.
- source_word: ἵνα ἔχῃ μεταδιδόναι
  choice: பகிர்ந்துகொள்ள அவனிடம் ஏதாவது இருக்கும்
  rationale: நோக்கத்தைக் குறிக்கும் ἵνα வாக்கியத்தையும், தனக்குள்ளதிலிருந்து பிறருக்குப் பகிர்தல் என்ற μεταδίδω வினையின் நுணுக்கத்தையும் இயல்பாகத் தருகிறது; ‘ஏதாவது’ என்பது தமிழில் தேவையான மறைபொருள் நிரப்பு.
- source_word: τῷ χρείαν ἔχοντι
  choice: தேவையில் இருப்பவருடன்
  rationale: தேவை உடைய நபரைச் சுட்டும் தத்திவுப் பங்கேற்புத் தொடரை இயல்பாக வழங்குகிறது; μεταδιδόναι உடன் ‘உடன் பகிர்ந்துகொள்ள’ என்பது பொருத்தமான தமிழ் இணைவு.
theological_decisions:
- issue: உழைப்பின் அறநெறி நோக்கம்
  choice: திருடுதலுக்குப் பதிலாக நேர்மையான உழைப்பையும், அதன் பலனைத் தேவையில் இருப்பவருடன் பகிர்வதையும் வசனம் முன்வைக்கிறது.
  alternative: இவ்வசனத்தின் முதன்மை நோக்கம் தன்னிறைவு அல்லது திருப்பிச் செலுத்துதல் மட்டுமே என்று மொழிபெயர்த்தல்.
  rationale: ἵνα நோக்க வாக்கியம் உழைப்பின் இலக்கைத் தன்வாழ்வாதாரத்தைக் கடந்து தேவையுள்ளவருடன் பகிர்வதாக வெளிப்படையாகக் கூறுகிறது; உரையில் இல்லாத தனிப்பட்ட ஈடுசெய்தல் கோட்பாடு சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ‘திருடன்’ என்ற அடையாளப்படுத்தும் பெயருக்குப் பதிலாக மூலத்தின் பங்கேற்புவினைத் தன்மையைப் பிரதிபலிக்கும் ‘திருடுகிறவன்’ தேர்ந்தெடுக்கப்பட்டது. ‘நல்லதைச் செய்து’ என்பது மூலத்தின் பொருள் அகலத்தை முதன்மை உரையில் காக்கிறது; சூழலுக்குரிய ‘நல்ல வேலை’ அடிக்குறிப்பில் தரப்பட்டுள்ளது.
