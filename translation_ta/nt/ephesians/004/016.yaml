source:
  edition: SBLGNT
  text: ἐξ οὗ πᾶν τὸ σῶμα συναρμολογούμενον καὶ συμβιβαζόμενον διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας κατ’ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους τὴν αὔξησιν τοῦ σώματος ποιεῖται εἰς οἰκοδομὴν ἑαυτοῦ ἐν ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/016.yaml
  text: from whom the whole body[a], being joined together and held together through every supporting joint, according to the working in measure of each individual part[d][c][b], causes the growth of the body for building itself up in love.
translation:
  language: ta
  text: அவரிடமிருந்து முழு உடலும் ஒன்றாகப் பொருத்தப்பட்டும் ஒன்றிணைக்கப்பட்டும், ஆதரவளிக்கும் ஒவ்வொரு இணைப்பின்[a] வழியாகவும், ஒவ்வொரு உறுப்பும் தனக்குரிய அளவில் செயல்படுவதற்கேற்ப, தன் வளர்ச்சியை ஏற்படுத்தி அன்பில் தன்னையே கட்டியெழுப்பிக்கொள்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆதரவளிக்கும் இணைப்பு” என்பதை “தேவையானதை வழங்கும் மூட்டு,” “ஆதரிக்கும் தசைநார்,” அல்லது “வழங்குதலுக்கான தொடர்பு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ οὗ
  choice: அவரிடமிருந்தே
  rationale: முந்தைய வசனத்தில் உள்ள கிறிஸ்துவே இதன் முன்னிலைப் பொருள். ஆண்பால் உறவுப்பெயரையும் வளர்ச்சியின் மூலமாக அவர் இருப்பதையும் இயல்பான தமிழில் காக்கிறது.
- source_word: πᾶν τὸ σῶμα
  choice: முழு உடலும்
  rationale: ஒருமையான கூட்டு உருவகத்தைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: συναρμολογούμενον
  choice: ஒன்றாகப் பொருத்தப்பட்டு
  rationale: தனித்தனி உறுப்புகள் பொருத்தமாக இணைக்கப்படுகின்றன என்ற செயல்படுபொருள் நிலையைப் பாதுகாக்கிறது.
- source_word: συμβιβαζόμενον
  choice: ஒன்றாகப் பிணைக்கப்படுகிறது
  rationale: உடலின் பகுதிகள் ஒருங்கிணைந்து ஒன்றாக நிலைத்திருக்கும் கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας
  choice: ஆதரவளிக்கும் ஒவ்வொரு இணைப்பின் வழியாகவும்
  rationale: ἁφή குறிக்கும் இணைப்பு அல்லது தொடுபுள்ளியையும் ἐπιχορηγία குறிக்கும் ஆதரவு அல்லது வழங்குதலையும் ஒன்றாக வெளிப்படுத்துகிறது; கிரேக்கச் சொற்றொடரின் துல்லியமான உடற்கூறு குறிப்பு உறுதியல்ல என்பதால் அடிக்குறிப்பில் மாற்றுகள் தரப்படுகின்றன.
- source_word: κατ’ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους
  choice: ஒவ்வொரு உறுப்பும் தனக்குரிய அளவில் செயல்படுவதற்கேற்ப
  rationale: ஒவ்வொரு பகுதிக்கும் உரிய அளவான செயல்பாட்டைத் தெளிவாகக் கூறுகிறது; கிரேக்கத்தின் அளவு சார்ந்த கருத்தை ‘சரியாக’ போன்ற விளக்கச் சொல்லைச் சேர்க்காமல் காக்கிறது.
- source_word: τὴν αὔξησιν τοῦ σώματος ποιεῖται
  choice: உடல் வளர்ந்து
  rationale: உடலே தன் வளர்ச்சியில் ஈடுபடும் நடுநிலை வினைநயத்தை இயல்பான தமிழில் தருகிறது. சொற்சொல்லான ‘உடலின் வளர்ச்சியை உண்டாக்குகிறது’ என்பது தமிழில் தேவையற்ற மீளுரைப்பாக இருக்கும்.
- source_word: εἰς οἰκοδομὴν ἑαυτοῦ
  choice: தன்னையே கட்டியெழுப்பிக்கொள்கிறது
  rationale: οἰκοδομήயின் கட்டியெழுப்புதல் உருவகத்தையும் ἑαυτοῦவின் தற்சுட்டுப் பொருளையும் காக்கிறது.
- source_word: ἐν ἀγάπῃ
  choice: அன்பில்
  rationale: பவுலின் சூழலிலுள்ள அன்பு என்ற மையக் கருத்தை நேரடியாகவும் மரபான தமிழிலும் தருகிறது.
theological_decisions:
- issue: திருச்சபையின் வளர்ச்சிக்கான மூலமும் செயல்படும் வழியும்
  choice: வளர்ச்சி கிறிஸ்துவிடமிருந்து வருகிறது; அதேவேளையில் ஒவ்வொரு உறுப்பின் அளவான செயல்பாட்டின் வழியாக உடல் வளர்கிறது.
  alternative: உறுப்புகளின் செயல்பாட்டையே ஒரே மூலமாக வலியுறுத்துவது, அல்லது கிறிஸ்துவின் செயலையே மட்டும் கூறி உறுப்புகளின் பங்களிப்பை மங்கச் செய்வது.
  rationale: ἐξ οὗ கிறிஸ்துவை மூலமாகக் காட்டுகிறது; κατ’ ἐνέργειαν...ἑκάστου μέρους ஒவ்வொரு உறுப்பின் செயல்பாட்டையும் உண்மையான வழிமுறையாகக் காட்டுகிறது. மொழிபெயர்ப்பு இரண்டையும் பதற்றமின்றி அல்ல, அவற்றின் பரஸ்பரத் தொடர்புடன் காக்கிறது.
- issue: உடல் தன்னை வளர்த்துக் கட்டியெழுப்பும் வினைநயம்
  choice: ‘உடல் வளர்ந்து, அன்பில் தன்னையே கட்டியெழுப்பிக்கொள்கிறது’ என்று தற்சுட்டு நயத்துடன் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘கிறிஸ்து உடலை வளர்க்கிறார்’ என்று வினையின் எழுவாயை நேரடியாக கிறிஸ்துவாக மாற்றுவது.
  rationale: கிறிஸ்து வளர்ச்சியின் மூலமாக இருந்தாலும், இவ்வாக்கியத்தில் πᾶν τὸ σῶμα என்பதே ποιεῖται என்பதன் இலக்கண எழுவாய். ஆகவே மூலத்தையும் உடலின் ஒருங்கிணைந்த செயலையும் வேறுபடுத்திக் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம உருவகத்தின் செறிவும் காக்கப்பட்டுள்ளன. மிகச் சொற்சொல்லான மீளுரைப்பைத் தவிர்த்து, இரண்டு வாக்கியங்களாகப் பிரிப்பதன் மூலம் நீண்ட கிரேக்கத் தொடரின் தொடர்புகள் தெளிவாக்கப்பட்டுள்ளன.
