  to: 'ஆகவே, இவ்வாறு கூறப்படுகிறது[a]:


    “அவர் உயரத்திற்கு ஏறிச் சென்று,


    சிறைப்பட்டோரின் அணிவகுப்பைச் சிறைபிடித்தார்[b];


    மனிதர்களுக்கு[c] வரங்களைக் கொடுத்தார்.”'
  rationale: மூலத்தின் வலியுறுத்தும், சங்கீதத்தை எதிரொலிக்கும் cognate சொற்றொடரைப் பாதுகாக்கும் வகையில் ‘சிறையிருப்பு’ என்ற நிலையைக் குறிக்கும் சொல்லுக்குப் பதிலாக, சிறைபிடிக்கப்பட்டோரின் அணியைக் குறிக்கும் ‘சிறைப்பட்டோரின் அணிவகுப்பு’ பயன்படுத்தப்பட்டுள்ளது. இது உருவகத்தின் அடையாளத்தை விளக்கமாகத் தீர்மானிக்காமல், தமிழில் தெளிவான மற்றும் வாசிக்கத்தக்க மொழிநடையை வழங்குகிறது. மற்ற சொல் தேர்வுகளும் அடிக்குறிப்பு அடையாளங்களும் பாதுகாக்கப்பட்டுள்ளன.
