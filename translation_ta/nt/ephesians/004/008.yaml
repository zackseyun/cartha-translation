  source_fidelity: διὸ மற்றும் λέγει ஆகியவற்றின் தர்க்கத் தொடர்பும், வெளிப்படையற்ற எழுவாயும் சரியாகக் காக்கப்பட்டுள்ளன. Ἀναβὰς εἰς ὕψος என்பதற்கு ‘உயரத்திற்கு ஏறிச் சென்று’ பொருளளவில் நெருக்கமானது. ஆனால் ᾐχμαλώτευσεν αἰχμαλωσίαν என்பது ‘சிறையிருப்பு’ என்ற நிலையைக் கைப்பற்றுதல் அல்ல; சிறைபிடித்தல்/சிறைக்கைதிகள் சார்ந்த வலியுறுத்தும் cognate அமைப்பு. ‘சிறையிருப்பைச் சிறைப்பிடித்தார்’ தமிழில் பொருள்மயக்கத்தையும் செயற்கைத்தன்மையையும் உருவாக்குகிறது. ‘சிறைப்பட்டோரின் அணிவகுப்பைச் சிறைபிடித்தார்’ என்பது சொல்வேர்ச் செறிவையும் உருவகத் திறந்த தன்மையையும் நன்றாகக் காக்கிறது.
  naturalness: முக்கிய உரை கண்ணியமான நவீனத் தமிழ் நடையில் உள்ளது. இருப்பினும் ‘சிறையிருப்பைச் சிறைப்பிடித்தார்’ வழக்கமான தமிழில் இயல்பாகப் புரியாது; ‘சிறைப்பட்டோரின் அணிவகுப்பைச் சிறைபிடித்தார்’ என்பது கவிதைநயமுள்ளதாயினும் தெளிவாக உள்ளது. ‘இவ்வாறு கூறப்படுகிறது’ என்ற மேற்கோள் அறிமுகம் இயல்பானதும் எழுவாயை நிர்ணயிக்காததும் ஆகும்.
