  text: διὸ λέγει· Ἀναβὰς εἰς ὕψος ᾐχμαλώτευσεν αἰχμαλωσίαν, ⸀ἔδωκεν δόματα τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/008.yaml
  text: Therefore it says[a], “Having ascended on high[b], he led captivity captive and gave gifts to men.”
translation:
  language: ta
  text: 'ஆகவே, இவ்வாறு கூறப்படுகிறது[a]:


    “அவர் உயரத்திற்கு ஏறிச் சென்று,


    சிறைப்பட்டோரின் அணிவகுப்பைச் சிறைபிடித்தார்[b];


    மனிதர்களுக்கு[c] வரங்களைக் கொடுத்தார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர் கூறுகிறார்” அல்லது “வேதவாக்கியம் கூறுகிறது” என்றும் மொழிபெயர்க்கலாம்; கிரேக்கத்தில் எழுவாய் வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
    reason: source_ambiguity
  - marker: b
    text: “சிறைப்பட்டவர்களைச் சிறைபிடித்தார்” அல்லது “ஏராளமான சிறைப்பட்டவர்களைப் பிடித்தார்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் சங்கீதம் 68:18-ஐ எதிரொலிக்கும் வகையில் ஒரே சொல்வேரைக் கொண்ட செறிவான சொற்றொடர் உள்ளது.
    reason: lexical_alternative
  - marker: c
    text: இங்குள்ள “மனிதர்கள்” என்பது ஆண்களை மட்டும் அல்லாமல் மனிதர்களைப் பொதுவாகக் குறிக்கலாம்.
    reason: lexical_clarification
lexical_decisions:
- source_word: διὸ
  choice: ஆகவே
  rationale: முந்தைய கருத்திலிருந்து மேற்கோளுக்குச் செல்லும் காரணவிளைவு தொடர்பை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: λέγει
  choice: இவ்வாறு கூறப்படுகிறது
  rationale: கிரேக்கத்தில் வெளிப்படையான எழுவாய் இல்லாததால், ‘அவர்’ அல்லது ‘வேதவாக்கியம்’ என்று நிர்ணயிக்காமல் மேற்கோள் அறிமுகத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: Ἀναβὰς εἰς ὕψος
  choice: அவர் உயரத்திற்கு ஏறிச் சென்று
  rationale: இறந்தகாலப் பங்கேற்புவினையின் முன்னிகழ்வையும் ‘உயரத்திற்கு’ என்ற சங்கீத எதிரொலியையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ᾐχμαλώτευσεν αἰχμαλωσίαν
  choice: சிறையிருப்பைச் சிறைப்பிடித்தார்
  rationale: ஒரே சொல்வேரை மீளப் பயன்படுத்தும் கிரேக்கத்தின் செறிவான சொற்றொடரையும் சங்கீத எதிரொலியையும் திட்டமிட்டு தக்கவைக்கிறது; அதன் இயல்பான மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: ἔδωκεν δόματα
  choice: வரங்களைக் கொடுத்தார்
  rationale: கொடுத்தல் மற்றும் பரிசுகள்/வரங்கள் என்ற நேரடியான பொருளைச் சூழலுக்கேற்ற வழக்கமான தமிழில் வழங்குகிறது.
- source_word: τοῖς ἀνθρώποις
  choice: மனிதர்களுக்கு
  rationale: ἄνθρωποι இங்கு பொதுவாக மனிதர்களைக் குறிக்கக்கூடியதால், ஆண்களை மட்டும் குறிக்கும் ‘ஆண்களுக்கு’ என்பதைக் காட்டிலும் பாலினத் துல்லியமுள்ள பொதுப்பொருளை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சங்கீதம் 68:18-ஐ ஒட்டிய சிறை தொடர்பான செறிவான சொற்றொடர்
  choice: சிறையிருப்பைச் சிறைப்பிடித்தார்
  alternative: சிறைப்பட்டவர்களைச் சிறைபிடித்துச் சென்றார்; ஏராளமான சிறைப்பட்டவர்களைப் பிடித்தார்
  rationale: உருவகத்தின் பொருள் யாரைக் குறிக்கிறது என்று மொழிபெயர்ப்பிலேயே தீர்மானிக்காமல், கிரேக்கத்தின் ஒரே சொல்வேரை உடைய வலிமையான அமைப்பையும் அதன் வேதவாக்கிய எதிரொலியையும் பாதுகாக்கிறது.
- issue: λέγει என்பதன் வெளிப்படையாகக் கூறப்படாத எழுவாய்
  choice: இவ்வாறு கூறப்படுகிறது
  alternative: அவர் கூறுகிறார்; வேதவாக்கியம் கூறுகிறது
  rationale: எழுவாய் யார் என்பதை கிரேக்கம் வெளிப்படையாகக் குறிப்பிடாததால், தேவன், கிறிஸ்து அல்லது வேதவாக்கியம் என்று மொழிபெயர்ப்பில் தேவையின்றி முடிவுசெய்யவில்லை.
- issue: τοῖς ἀνθρώποις என்பதன் பாலின வீச்சு
  choice: மனிதர்களுக்கு
  alternative: ஆண்களுக்கு; மக்களுக்கு
  rationale: இச்சொல் இலக்கண வடிவில் ஆண்பால் பன்மையாக இருந்தாலும் இங்கு மனிதர்களைப் பொதுவாகக் குறிக்க இயலும்; ஆகவே ஆண்களுக்கு மட்டும் வரம்பிடாத துல்லியமான தமிழ்ச் சொல் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான வேதமொழிநடை பயன்படுத்தப்பட்டுள்ளது. மேற்கோளின் கவிதைநயம் வரிப்பிரிப்பால் காட்டப்பட்டுள்ளது. ‘சிறையிருப்பைச் சிறைப்பிடித்தார்’ என்பது வழக்கத்திற்கு மாறானதாக இருந்தாலும் மூலத்தின் திட்டமிட்ட சொல்லொலியையும் விளக்கத் திறந்த தன்மையையும் காக்கிறது; இயல்பான விளக்க மாற்றுகள் அடிக்குறிப்பில் வழங்கப்பட்டுள்ளன.
