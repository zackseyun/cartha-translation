id: EPH.4.19
reference: Ephesians 4:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἵτινες ἀπηλγηκότες ἑαυτοὺς παρέδωκαν τῇ ἀσελγείᾳ εἰς ἐργασίαν ἀκαθαρσίας πάσης ἐν πλεονεξίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/019.yaml
  text: who[a], having become callous[c][b], gave themselves over to sensuality for the practice of every kind of impurity with greediness.
translation:
  language: ta
  text: அவர்கள் உணர்வற்றுப் போய்[a], எல்லாவித அசுத்தத்தையும் பேராசையோடு[c] செய்துவருவதற்காகத் தங்களை வெட்கங்கெட்ட நடத்தைக்கு[b] ஒப்புக்கொடுத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உணரும் திறனை முற்றிலும் இழந்து’ அல்லது ‘எந்த உணர்வும் இல்லாதவர்களாகி.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘கட்டுப்பாடற்ற இச்சை வாழ்க்கைக்கு’ அல்லது ‘ஒழுக்கக்கேட்டுக்கு.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘பேராசையில்’ அல்லது ‘அடங்காத ஆசையோடு.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: அவர்கள்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட பிற இனத்தாரைத் தொடர்ந்து சுட்டுகிறது. தமிழில் இயல்பான வாக்கியத் தொடர்ச்சிக்காகத் தனிப்பட்ட தொடர்புப்பெயருக்குப் பதிலாக ‘அவர்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἀπηλγηκότες
  choice: உணர்வற்றுப் போய்
  rationale: முற்றுப்பெற்ற வினையெச்சம் காட்டும், உணர்திறனை இழந்து அந்த நிலையிலேயே இருப்பதைக் கூறுகிறது. சூழலில் இது வெறும் உணர்ச்சியின்மையல்ல, நெறியுணர்வு மழுங்கிய நிலையைக் குறிக்கிறது.
- source_word: ἑαυτοὺς παρέδωκαν
  choice: தங்களை ... ஒப்புக்கொடுத்தார்கள்
  rationale: தாங்களே விருப்பத்துடன் ஒரு தீய நடத்தையின் ஆளுகைக்கு உட்பட்டதைத் தெளிவாகக் காட்டுகிறது.
- source_word: τῇ ἀσελγείᾳ
  choice: வெட்கங்கெட்ட நடத்தைக்கு
  rationale: ἀσέλγεια என்பது பாலியல் ஒழுக்கக்கேட்டை உள்ளடக்கக்கூடியதாயினும், அதைவிட விரிவாக வெட்கமின்றி எல்லைமீறும் நடத்தையைக் குறிக்கிறது. இந்தத் தமிழாக்கம் அந்த விரிவைத் தக்கவைக்கிறது.
- source_word: εἰς ἐργασίαν
  choice: செய்துவருவதற்காக
  rationale: இங்கு ἐργασία வழக்கமாக அல்லது தொடர்ந்து ஈடுபடும் செயலைக் குறிக்கிறது; நோக்கம் அல்லது விளைவு சார்ந்த εἰς என்பதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀκαθαρσίας πάσης
  choice: எல்லாவித அசுத்தத்தையும்
  rationale: πάσης என்பதன் முழுமையான, பலவகைப்பட்ட பரப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐν πλεονεξίᾳ
  choice: பேராசையோடு
  rationale: மேலும் மேலும் நாடும் அடங்காத ஆசையை உணர்த்துகிறது; இங்கு அசுத்தச் செயல்களில் ஈடுபடும் விதத்தைக் குறிப்பதாக எடுத்துக்கொள்ளப்பட்டுள்ளது.
theological_decisions:
- issue: ἀπηλγηκότες என்பதன் அறநெறி மற்றும் மனநிலை சார்ந்த வலிமை
  choice: உணர்வற்றுப் போய்
  alternative: மனச்சாட்சி மழுங்கி / உணரும் திறனை இழந்து
  rationale: சூழல் அறநெறி உணர்வின்மையைச் சுட்டுகிறது. ஆனால் ‘மனச்சாட்சி’ என்ற சொல் மூலத்தில் நேரடியாக இல்லாததால் முதன்மை உரையில் சேர்க்கப்படவில்லை.
- issue: ἀσέλγεια என்பதன் பொருள் வரம்பு
  choice: வெட்கங்கெட்ட நடத்தை
  alternative: கட்டுப்பாடற்ற இச்சை வாழ்க்கை / காமவெறி
  rationale: இச்சொல் பாலியல் பாவத்தை மட்டும் குறுகலாகக் குறிப்பிடாமல், வெட்கமற்ற எல்லைமீறிய நடத்தையையும் குறிக்கலாம்; ஆகவே அதன் பரந்த பொருள் பாதுகாக்கப்பட்டுள்ளது.
- issue: ἐν πλεονεξίᾳ என்பதன் இலக்கணத் தொடர்பு
  choice: அசுத்தத்தைச் செய்துவரும் முறையை விளக்கும் ‘பேராசையோடு’
  alternative: பேராசையில் / ஆதாய ஆசையுடன்
  rationale: இந்தச் சொற்றொடரின் தொடர்பில் ஓரளவு தெளிவின்மை உள்ளது. முதன்மை உரை மிகைமிக்க, அடங்காத ஆசையின் கருத்தைப் பாதுகாக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் இயல்பான ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வெட்கங்கெட்ட நடத்தை’ என்பது மூலச்சொல்லின் பரந்த அறநெறிப் பொருளைக் காக்கிறது; ‘செய்துவருவதற்காக’ என்பது தொடர்ச்சியான பழக்கச் செயலை உணர்த்துகிறது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்பே வைக்கப்பட்டுள்ளன.
