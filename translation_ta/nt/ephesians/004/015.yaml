- issue: ἀληθεύοντες என்பதன் பொருள் எல்லை
  choice: முதன்மை உரையில் ‘உண்மையைப் பேசி’
  alternative: ‘உண்மையுள்ளவர்களாய் இருந்து’ அல்லது ‘உண்மையைக் கடைப்பிடித்து’
  rationale: உடனடிச் சூழலில் பொய்ப் போதனையும் வஞ்சகமும் பேசப்படுவதால் பேச்சு சார்ந்த மொழிபெயர்ப்பு இயல்பானது. எனினும், வினைச்சொல்லின் நடத்தை சார்ந்த விரிவான நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: κεφαλή என்ற உருவகத்தின் விளக்கவியல் வலிமை
  choice: ‘தலை’ என்று மட்டும் மொழிபெயர்த்தல்
  alternative: ‘மூலம்’ அல்லது ‘அதிகாரம் செலுத்துபவர்’
  rationale: கிரேக்க உரை தரும் உருவகத்தைத் தக்கவைத்து, விவாதத்திற்குரிய இறையியல் முடிவை மொழிபெயர்ப்பே தீர்மானிக்காமல் விடுகிறது.
- issue: εἰς αὐτόν என்பதன் திசை மற்றும் இணைப்பு
  choice: ‘அவருக்குள்’
  alternative: ‘அவரை நோக்கி’
  rationale: ‘அவரை நோக்கி’ என்பது திசையை மட்டும் தெளிவாக்கும்; ‘அவருக்குள்’ என்பது திசையோடு கிறிஸ்துவின் உடலுக்குள் நிகழும் வளர்ச்சி உருவகத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘வளர்வோமாக’ என்பது கூட்டான அறிவுறுத்தலைத் தக்கவைக்கிறது; குறுகிய இரண்டாம் வாக்கியம் கிரேக்கத்தின் தொடர்புச் சொற்றொடரை தமிழில் இயல்பாகவும் தெளிவாகவும் வழங்குகிறது.
