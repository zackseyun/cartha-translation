  text: ὁ καταβὰς αὐτός ἐστιν καὶ ὁ ἀναβὰς ὑπεράνω πάντων τῶν οὐρανῶν, ἵνα πληρώσῃ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/010.yaml
  text: The one who descended is himself also the one who ascended far above all the heavens[b][a], so that he might fill all things.
translation:
  language: ta
  text: கீழே இறங்கியவரே, அனைத்தையும் நிரப்புவதற்காக[b] எல்லா வானங்களுக்கும் வெகு மேலாக[a] ஏறிச் சென்றவரும் ஆவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எல்லா வானங்களுக்கும் மேலாக.” இந்தச் சொற்றொடர் ஒவ்வொரு வான மண்டலத்திற்கும் மேலான உயர்வை வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அனைத்தையும் நிறைவேற்றுவதற்காக.” கிரேக்க வினைச்சொல் சில சூழல்களில் “நிறைவேற்றுதல்” என்று பொருள்படலாம்; இங்கு “நிரப்புதல்” என்பது உடனடிச் சூழலுக்கு மிகவும் பொருத்தமானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καταβὰς
  choice: கீழே இறங்கியவர்
  rationale: இறந்தகால வினையெச்சத்துடன் வரும் கிரேக்கச் சுட்டுப்பெயரமைப்பு ஒருவரைக் குறிக்கும் பெயர்ச்சொல் தொடராக உள்ளது; நவீனத் தமிழில் ‘கீழே இறங்கியவர்’ அதன் பொருளை இயல்பாகத் தருகிறது.
- source_word: αὐτός ... καὶ
  choice: இறங்கியவரே ... ஏறிச் சென்றவரும்
  rationale: இறங்கியவரும் ஏறிச் சென்றவரும் ஒரே நபர் என்பதற்கு αὐτός தரும் அழுத்தத்தை ‘-ஏ’ விகுதி காக்கிறது; καὶ-இன் இணைப்புப் பொருள் ‘-உம்’ மூலம் வெளிப்படுகிறது.
- source_word: ὁ ἀναβὰς
  choice: ஏறிச் சென்றவர்
  rationale: ὁ καταβὰς என்பதற்கு இணையான பெயர்ச்சொல் சார்ந்த வினையெச்ச அமைப்பைத் தமிழில் இயல்பாகவும் தெளிவாகவும் பிரதிபலிக்கிறது.
- source_word: ὑπεράνω
  choice: வெகு மேலாக
  rationale: வெறும் இடநிலையை மட்டுமல்லாமல் எல்லா வானங்களையும் கடந்த உயர்வையும் மேன்மையையும் இச்சூழலில் குறிக்கும் தீவிரத்தை ‘வெகு மேலாக’ காக்கிறது.
- source_word: πάντων τῶν οὐρανῶν
  choice: எல்லா வானங்களுக்கும்
  rationale: கிரேக்கத்தின் பன்மையையும் πάντων என்பதன் முழுமையான பரப்பையும் தமிழில் காக்கிறது.
- source_word: ἵνα
  choice: நிரப்புவதற்காக
  rationale: ἵνα இங்கு நோக்கத்தைக் குறிக்கிறது; தமிழின் ‘-வதற்காக’ அமைப்பு அந்த நோக்கப்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πληρώσῃ
  choice: நிரப்புவதற்காக
  rationale: πληρόω என்பதற்கு இச்சூழலில் ‘நிரப்பு’ என்பதே நேரடியான பொருள்; ‘நிறைவேற்று’ என்ற சாத்தியமான பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: τὰ πάντα
  choice: அனைத்தையும்
  rationale: இந்த நடுநிலைப் பன்மைச் சொற்றொடரின் விரிவான, வரையறுக்கப்படாத பரப்பைக் காக்கிறது; அதை மக்கள் அல்லது பிரபஞ்சம் என்று குறுக்கவோ விளக்கி விரிவாக்கவோ இல்லை.
theological_decisions:
- issue: இறங்கியவரும் ஏறிச் சென்றவரும் ஒரே நபர் என்பது
  choice: ‘இறங்கியவரே ... ஏறிச் சென்றவரும்’ என்று அடையாள அழுத்தம் காக்கப்பட்டது.
  alternative: அடையாளத்தை வலியுறுத்தாமல், இறங்குதல் மற்றும் ஏறுதல் ஆகியவற்றை அடுத்தடுத்த செயல்களாக மட்டும் கூறுதல்.
  rationale: αὐτός என்பதும் மீண்டும் வரும் இரு பெயர்ச்சொல் சார்ந்த வினையெச்சங்களும் ஒரே நபரின் அடையாளத்தை வலியுறுத்துகின்றன; உரைக்கு அப்பாற்பட்ட விளக்கம் சேர்க்காமல் இது தமிழில் காக்கப்படுகிறது.
- issue: τὰ πάντα என்பதன் பரப்பு
  choice: ‘அனைத்தையும்’ என்று விரிவான பொருள் காக்கப்பட்டது.
  alternative: ‘எல்லா மக்களையும்’ அல்லது ‘முழுப் பிரபஞ்சத்தையும்’ என்று பொருளை வரையறுத்தல்.
  rationale: கிரேக்கச் சொற்றொடர் திட்டமிட்டே விரிவாக உள்ளது. அதன் பரப்பை ஒரு குறிப்பிட்ட வகைக்குள் சுருக்காமல், மூலத்தின் இறையியல் அகலமும் பதற்றமும் காக்கப்படுகின்றன.
- issue: πληρώσῃ என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘நிரப்புவதற்காக’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘நிறைவேற்றுவதற்காக.’
  rationale: உடனடிச் சூழலில் ‘நிரப்புதல்’ என்பதே பொருத்தமான முதன்மைப் பொருள்; எனினும் ‘நிறைவேற்றுதல்’ என்ற சொற்பொருள் சாத்தியத்தை அடிக்குறிப்பு வெளிப்படையாகக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘-ஏ’ மற்றும் ‘-உம்’ ஆகியவை மூலத்தில் உள்ள அடையாள அழுத்தத்தையும் இணைப்பையும் சுருக்கமாகக் காக்கின்றன. நோக்கத் தொடர் தமிழில் இயல்பாக அமைய வாக்கியத்தின் நடுப்பகுதிக்கு நகர்த்தப்பட்டுள்ளது; இதனால் மூலத்தின் கருத்துறவு மாறவில்லை.
