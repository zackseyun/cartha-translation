id: EPH.4.25
reference: Ephesians 4:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Διὸ ἀποθέμενοι τὸ ψεῦδος λαλεῖτε ἀλήθειαν ἕκαστος μετὰ τοῦ πλησίον αὐτοῦ, ὅτι ἐσμὲν ἀλλήλων μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/025.yaml
  text: Therefore[a], having put away falsehood, let each one speak truth with his neighbor, because we are members of one another.
translation:
  language: ta
  text: ஆகையால், பொய்மையை[a] விட்டொழித்து, நீங்கள் ஒவ்வொருவரும் தம் அயலாரோடு உண்மையைப் பேசுங்கள். ஏனெனில், நாம் ஒருவருக்கொருவர் உறுப்புகளாக இருக்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பொய்யை.”
    reason: τὸ ψεῦδος என்பதிலுள்ள சுட்டுடன் கூடிய ஒருமை வடிவத்தின் சாத்தியமான நேரடி மொழிபெயர்ப்பைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: Διὸ
  choice: ஆகையால்
  rationale: முந்தைய அறிவுறுத்தலிலிருந்து பெறப்படும் முடிவைத் தெளிவாகக் காட்டும் இயல்பான நவீனத் தமிழ் இணைப்புச்சொல்.
- source_word: ἀποθέμενοι
  choice: விட்டொழித்து
  rationale: முதன்மைக் கட்டளைக்கு முன்நிபந்தனையாக உள்ள உறுதியான கைவிடுதலை இயல்பாக வெளிப்படுத்துகிறது; இறந்தகால வினையெச்சத்தின் நிறைவுற்ற நுணுக்கத்தையும் சூழலில் போதுமான அளவு தக்கவைக்கிறது.
- source_word: τὸ ψεῦδος
  choice: பொய்மையை
  rationale: ஒரு குறிப்பிட்ட பொய்யை மட்டுமல்லாமல், பொய்யுரைத்தல் அல்லது பொய்மை என்ற ஒழுக்கத் தீமையின் பொதுவகையைக் குறிக்க ஏற்றது. பெயர்ச்சொல்லோடு வரும் சுட்டின் காரணமாகச் சாத்தியமான ‘பொய்யை’ என்ற வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: λαλεῖτε ἀλήθειαν
  choice: உண்மையைப் பேசுங்கள்
  rationale: நிகழ்காலப் பன்மைக் கட்டளையை நேரடியாகவும் இயல்பாகவும் தருகிறது; பொய்மைக்கு எதிரான உண்மை என்ற முரணையும் காக்கிறது.
- source_word: ἕκαστος
  choice: நீங்கள் ஒவ்வொருவரும்
  rationale: பன்மை வாசகர்களுக்கு வழங்கப்பட்ட கட்டளைக்குள் ஒவ்வொரு நபரின் தனிப்பட்ட பொறுப்பையும் தெளிவாக்குகிறது.
- source_word: μετὰ τοῦ πλησίον αὐτοῦ
  choice: தம் அயலாரோடு
  rationale: μετά என்பதன் உடனிணைவு உணர்வை ‘-ஓடு’ காக்கிறது. ‘தம்’ என்பது பாலின வேறுபாடு இல்லாமல் ஒவ்வொருவரையும் திரும்பச் சுட்டும் இயல்பான தமிழ் வடிவம்.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: கட்டளைக்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: ἐσμὲν ἀλλήλων μέλη
  choice: நாம் ஒருவருக்கொருவர் உறுப்புகளாக இருக்கிறோம்
  rationale: μέλη என்பதிலுள்ள உடல்-உறுப்பு உருவகத்தையும் ἀλλήλων என்பதிலுள்ள பரஸ்பர உறவையும் விளக்கிச் சேர்க்காமல் பாதுகாக்கிறது.
theological_decisions:
- issue: ψεῦδος என்பதன் பொருள் வரம்பு
  choice: பொய்மை என்ற பொதுவான ஒழுக்கத் தீமையாக மொழிபெயர்த்தல்
  alternative: ‘பொய்யை’ என்று, சுட்டப்பட்ட அல்லது தொகுப்பான ‘பொய்’ என மொழிபெயர்த்தல்
  rationale: உடனடிச் சூழல் பொய்யான நடத்தையை உண்மை பேசுதலோடு முரண்படுத்துகிறது. இருப்பினும் கிரேக்கச் சுட்டுடன் கூடிய ஒருமை வடிவம் ‘பொய்யை’ என்பதையும் அனுமதிப்பதால் அந்த வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἕκαστος ... αὐτοῦ என்பதிலுள்ள பொதுப்பொருள் ஒருமை
  choice: ‘நீங்கள் ஒவ்வொருவரும் தம் அயலாரோடு’
  alternative: ‘ஒவ்வொருவனும் தன் அயலானோடு’
  rationale: கிரேக்க இலக்கண வடிவம் ஆண்பால் ஒருமையாக இருந்தாலும் கட்டளை முழுச் சபையையும் உள்ளடக்குகிறது. தமிழ் ‘தம்’ அந்தப் பொதுப்பொருளை இயல்பாகத் தருவதோடு தனிநபர் சார்ந்த கட்டளையையும் காக்கிறது.
- issue: ἀλλήλων μέλη என்பதிலுள்ள உடல் உருவகம்
  choice: ‘ஒருவருக்கொருவர் உறுப்புகள்’ என்ற நெருக்கமான வடிவத்தைத் தக்கவைத்தல்
  alternative: ‘ஒரே உடலின் உறுப்புகள்’ என்று விளக்குதல்
  rationale: ‘ஒரே உடல்’ என்பது சூழலுக்கு ஏற்ற விளக்கமாக இருந்தாலும் இவ்வசனத்தில் நேரடியாக இல்லை. மூலத்தின் பரஸ்பரச் சொற்றொடரையும் இறையியல் நெருக்கடியையும் மொழிபெயர்ப்பு தானாகத் தீர்க்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘விட்டொழித்து’ என்பது ஒழுக்க அறிவுறுத்தலுக்கேற்ற வலிமையைக் கொண்டது; ‘அயலாரோடு’ மற்றும் ‘உறுப்புகளாக’ ஆகியவை மூலத்தின் சமூக உறவையும் உடல் உருவகத்தையும் தக்கவைக்கின்றன.
