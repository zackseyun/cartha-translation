id: EPH.4.31
reference: Ephesians 4:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πᾶσα πικρία καὶ θυμὸς καὶ ὀργὴ καὶ κραυγὴ καὶ βλασφημία ἀρθήτω ἀφ’ ὑμῶν σὺν πάσῃ κακίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/031.yaml
  text: Let all bitterness and wrath and anger and clamor and slander be taken away from you[a], along with all malice.
translation:
  language: ta
  text: எல்லாக் கசப்பும் சீற்றமும் கோபமும் கூச்சலும் அவதூறான பேச்சும் உங்களிடமிருந்து அகற்றப்படட்டும்; எல்லாத் தீங்கிழைக்கும் மனப்பான்மையுடனும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶσα πικρία
  choice: எல்லா மனக்கசப்பும்
  rationale: πᾶσα முழுமையான நீக்கத்தை வலியுறுத்துகிறது; πικρία நீடித்த கசப்புணர்வையும் மனவருத்தத்தையும் குறிக்கும் என்பதால், நவீன தமிழில் இயல்பான ‘மனக்கசப்பு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: θυμός
  choice: சீற்றம்
  rationale: திடீரெனப் பொங்கும் தீவிர உணர்ச்சியைச் சுட்டுவதால், தொடர்ந்து வரும் ὀργή என்பதிலிருந்து வேறுபடுத்த ‘சீற்றம்’ பயன்படுத்தப்பட்டது.
- source_word: ὀργή
  choice: கோபம்
  rationale: θυμός-இன் வெடிப்பான சீற்றத்திலிருந்து வேறுபடும் பொதுவான கோபநிலையை இயல்பாகக் காட்டுகிறது.
- source_word: κραυγή
  choice: கூச்சல்
  rationale: இச்சூழலில் பகைமையோடு எழுப்பப்படும் உரத்த குரல் அல்லது சச்சரவுக் கூச்சலைக் குறிக்கிறது; ‘கூச்சல்’ சாதாரண வாசகர்களுக்குத் தெளிவானது.
- source_word: βλασφημία
  choice: அவதூறான பேச்சு
  rationale: மனித உறவுகளைப் பற்றிய இந்தத் தீய நடத்தைகளின் பட்டியலில், பிறரைக் கேவலப்படுத்தும் அல்லது தீங்கிழைக்கும் பேச்சு என்பதே இயல்பான பொருள். ‘அவதூறான பேச்சு’ குற்றச்சாட்டு என்ற குறுகிய சட்டப்பொருளில் மட்டும் இதைக் கட்டுப்படுத்தாமல் பேச்சின் தன்மையைக் காட்டுகிறது.
- source_word: ἀρθήτω ἀφ’ ὑμῶν
  choice: உங்களைவிட்டு அகற்றப்படட்டும்
  rationale: இறந்தகாலத் தோற்றமுடைய கட்டளைப் பயனிலையின் passive force-ஐப் பாதுகாத்து, இவை விசுவாசிகளின் வாழ்விலிருந்தும் சமூகத்திலிருந்தும் முற்றிலும் நீக்கப்பட வேண்டும் என்பதைக் காட்டுகிறது.
- source_word: σὺν πάσῃ κακίᾳ
  choice: எல்லா தீய எண்ணத்தோடுகூட
  rationale: σύν என்பதன் ‘கூட/உடன்’ தொடர்பையும் πάσῃ என்பதன் முழுமையையும் காக்கிறது. இச்சூழலில் κακία பொதுவான ‘தீமை’ என்பதைவிட பிறருக்குத் தீங்கு நினைக்கும் மனப்பாங்கைக் குறிக்கிறது.
theological_decisions:
- issue: βλασφημία என்பதன் பொருள்
  choice: மனிதர்களுக்கு எதிரான ‘அவதூறான பேச்சு’
  alternative: தேவதூஷணம்; வசைபேச்சு
  rationale: சுற்றியுள்ள சொற்கள் மனித உறவுகளில் வெளிப்படும் அழிவான மனப்பாங்குகளையும் பேச்சையும் குறிக்கின்றன. ஆகவே தேவனை எதிர்த்து பேசுதல் என்ற குறுகிய பொருளை முதன்மை உரையில் திணிக்காமல், பரந்த தீங்கிழைக்கும் பேச்சைத் தேர்ந்தெடுத்து மாற்றுப் பொருளை அடிக்குறிப்பில் வைத்தோம்.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமானதாயினும் பொதுவாசகர்களுக்குப் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. ‘சீற்றம்/கோபம்’ என்ற இணை கிரேக்கத்தின் இரு வேறு கோபச் சொற்களையும் காக்கிறது; செயலற்ற கட்டளை வடிவம் ‘அகற்றப்படட்டும்’ என்பதில் பாதுகாக்கப்பட்டுள்ளது.
