revisions:
- from: எல்லா மனக்கசப்பும் சீற்றமும் கோபமும் கூச்சலும் அவதூறான பேச்சும்[a], எல்லா தீய எண்ணத்தோடுகூட, உங்களைவிட்டு அகற்றப்படட்டும்.
  to: எல்லாக் கசப்பும் சீற்றமும் கோபமும் கூச்சலும் அவதூறான பேச்சும் உங்களிடமிருந்து அகற்றப்படட்டும்; எல்லாத் தீங்கிழைக்கும் மனப்பான்மையுடனும்.
  rationale: The revision retains the source order and passive imperative while replacing ‘தீய எண்ணம்’ with a phrase that represents κακία as comprehensive malice or ill will. The semicolon makes clear that this final phrase accompanies the removal of every item in the preceding list. The existing footnote remains appropriate and its anchor stays with ‘அவதூறான பேச்சும்.’
  reviewer_model: gpt-5.6-terra
