- from: “அவர் மேலே ஏறினார்” என்பதன் பொருள், அவர் பூமியின் தாழ்வான பகுதிகளுக்குள் இறங்கினார் என்பதைத்தவிர வேறென்ன?[a]
  to: “அவர் மேலே ஏறினார்” என்பதன் பொருள், அவரும் பூமியின் கீழான பகுதிகளுக்குள் இறங்கினார் என்பதைத்தவிர வேறென்ன?[a]
  rationale: கிரேக்க καί-யின் சேர்க்கைப் பொருளை “அவரும்” என்று வெளிப்படையாகச் சேர்த்துள்ளோம். κατώτερα-வின் ஒப்பீட்டு இடவியல் பொருளை நவீனத் தமிழில் இயல்பாகத் தருவதற்காக “தாழ்வான” என்பதற்குப் பதிலாக “கீழான” பயன்படுத்தப்பட்டுள்ளது. முதன்மை உரை பூமி, அதன் கீழ்ப்பகுதிகள், அல்லது இறந்தோரின் உலகம் என்ற எந்த விளக்கத்தையும் கட்டாயப்படுத்தவில்லை; மாற்று வாசிப்புகள் அடிக்குறிப்பில் மட்டுமே தரப்பட்டுள்ளன.
