source:
  edition: SBLGNT
  text: τὸ δὲ Ἀνέβη τί ἐστιν εἰ μὴ ὅτι καὶ ⸀κατέβη εἰς τὰ κατώτερα μέρη τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/009.yaml
  text: What does “he ascended” mean except that he also descended into the lower parts of the earth?[a]
translation:
  language: ta
  text: “அவர் மேலே ஏறினார்” என்பதன் பொருள், அவரும் பூமியின் கீழான பகுதிகளுக்குள் இறங்கினார் என்பதைத்தவிர வேறென்ன?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கீழான பகுதிகளாகிய பூமிக்கு.” இத்தொடர் அவர் பூமிக்கு இறங்கிவந்ததை மட்டும் குறிக்கலாம்; அல்லது இன்னும் குறிப்பாக, இறந்தோரின் உலகத்திற்குள் இறங்கியதைக் குறிக்கலாம்.
    reason: மூலத்தொடரின் இலக்கண மற்றும் விளக்கத் தெளிவின்மையைப் பாதுகாக்கும் மாற்று வாசிப்பு.
lexical_decisions:
- source_word: Ἀνέβη
  choice: அவர் மேலே ஏறினார்
  rationale: மேல்நோக்கிய இயக்கத்தைத் தெளிவாகக் காட்டுவதோடு, அடுத்துவரும் ‘இறங்கினார்’ என்பதுடனான எதிரிணையையும் பாதுகாக்கிறது.
- source_word: τί ἐστιν εἰ μὴ ὅτι
  choice: என்பதன் பொருள் ... என்பதைத்தவிர வேறென்ன?
  rationale: மேற்கோள் காட்டப்பட்ட ‘ஏறினார்’ என்ற சொல்லிலிருந்து எடுக்கப்படும் முடிவை இயல்பான நவீனத் தமிழில் வினாவடிவில் வெளிப்படுத்துகிறது.
- source_word: καὶ κατέβη
  choice: அவர் ... இறங்கினார்
  rationale: ஏறுவதற்கு முன் இறங்கியதைக் குறிக்கும் தர்க்கத் தொடர்பை வாக்கிய அமைப்பு தமிழில் இயல்பாக வெளிப்படுத்துகிறது; καί-யின் சேர்க்கைப் பொருள் இந்த இணைந்த எதிரிணையில் அடங்கியுள்ளது.
- source_word: εἰς τὰ κατώτερα μέρη
  choice: தாழ்வான பகுதிகளுக்குள்
  rationale: εἰς என்பதன் உள்ள்நோக்கிய இயக்கத்தையும், κατώτερα μέρη என்பதன் ஒப்பீட்டு மற்றும் பன்மைத் தன்மையையும் காக்கிறது.
- source_word: τῆς γῆς
  choice: பூமியின்
  rationale: வானத்துக்கும் பூமிக்கும் இடையிலான சூழல்சார் எதிர்மறையைப் பொருத்தமாகக் காட்டுகிறது; இதன் இலக்கணத் தொடர்பிலுள்ள தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: εἰς τὰ κατώτερα μέρη τῆς γῆς என்பதன் விளக்கம்
  choice: பூமியின் தாழ்வான பகுதிகளுக்குள்
  alternative: தாழ்வான பகுதிகளாகிய பூமிக்கு; அல்லது இறந்தோரின் உலகத்திற்குள்
  rationale: கிரேக்கத் தொடர் பூமிக்கு இறங்கிவந்ததை பொதுவாகக் குறிக்கிறதா, அல்லது பூமியின் அடிப்பகுதி/இறந்தோரின் உலகத்திற்குள் இறங்கியதைச் சிறப்பாகக் குறிக்கிறதா என்பது விவாதத்திற்குரியது. முதன்மை உரை எந்த ஓர் இறையியல் விளக்கத்தையும் கட்டாயப்படுத்தாமல் அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. மேற்கோள் சொற்றொடரும் ஏறுதல்–இறங்குதல் எதிரிணையும் காக்கப்பட்டுள்ளன; பிரிவுசார் இறையியல் சொற்கள் முதன்மை உரையில் சேர்க்கப்படவில்லை.
