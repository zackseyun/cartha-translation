  yaml_path: translation/nt/ephesians/004/003.yaml
  text: making every effort to keep the unity of the Spirit in the bond of peace[a][b].
translation:
  language: ta
  text: சமாதானத்தின் பிணைப்பில் ஆவியின் ஒருமைப்பாட்டைக் காத்துக்கொள்வதில் முழு முயற்சி செய்யுங்கள்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதைப் பேணி நிலைநிறுத்துவதில் ஆர்வமாக இருங்கள்” அல்லது “அதைப் பாதுகாக்கத் தீவிரமாக முயலுங்கள்.”
    reason: lexical_alternative
  - marker: b
    text: “ஆவி” என்பது இங்கு பெரும்பாலும் பரிசுத்த ஆவியானவரைக் குறிக்கிறது; சிலர் இதை விசுவாசிகளிடையே பகிரப்படும் ஒரே மனப்பான்மை அல்லது ஆவி என்று பொதுவாகப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: σπουδάζοντες
  choice: எல்லா முயற்சியும் செய்யுங்கள்
  rationale: இது ஆர்வமான, தீவிரமான முயற்சியைக் குறிக்கும் நிகழ்கால வினையெச்சம். முந்தைய வசனங்களின் அறிவுறுத்தல் ஓட்டத்தை இயல்பான தமிழ் கட்டளை வடிவில் தொடர்கிறது.
- source_word: τηρεῖν
  choice: காத்துக்கொள்ள
  rationale: ஏற்கெனவே உள்ள ஒன்றைப் புதிதாக உருவாக்காமல், அதைப் பேணி நிலைநிறுத்தும் பொருளைத் தருகிறது.
- source_word: τὴν ἑνότητα
  choice: ஒருமைப்பாட்டை
  rationale: ἑνότης என்பதன் இயல்பான நவீனத் தமிழ் இணை; ஒன்றுபட்ட நிலையைத் தெளிவாகக் குறிக்கிறது.
- source_word: τοῦ πνεύματος
  choice: ஆவியானவர் அருளிய
  rationale: சூழலில் πνεῦμα பெரும்பாலும் பரிசுத்த ஆவியானவரைக் குறிக்கிறது. கிரேக்க உரையின் உறவுவேற்றுமை பலவிதமாகப் புரிந்துகொள்ளப்படலாம்; இங்கு ஒருமைப்பாட்டின் மூலமாக ஆவியானவர் இருப்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν τῷ συνδέσμῳ
  choice: பிணைப்பில்
  rationale: சேர்த்துப் பிணைக்கும் ஒன்றைச் சுட்டும் உருவகத்தைத் தக்கவைத்து, ἐν என்பதையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: τῆς εἰρήνης
  choice: சமாதானம் என்னும்
  rationale: சமாதானமே பிணைக்கும் கூறு எனும் சாத்தியமான உறவை இயல்பான தமிழில் காட்டுகிறது; கிரேக்கத்தின் சுருக்கமான உறவுவேற்றுமையை அளவுக்கு மீறி விளக்கவில்லை.
theological_decisions:
- issue: πνεύματος என்பதன் குறிப்பு
  choice: பரிசுத்த ஆவியானவர்
  alternative: விசுவாசிகளிடையே பகிரப்படும் ஒரே மனப்பான்மை அல்லது ஆவி
  rationale: எபேசியர் நிருபத்தின் அருகிலுள்ள சூழல், குறிப்பாக 4:4 மற்றும் 4:30, பரிசுத்த ஆவியானவரையே வலுவாகச் சுட்டுகிறது. இருப்பினும் மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ஒருமைப்பாட்டின் இயல்பு
  choice: ஏற்கெனவே அருளப்பட்டு, காக்கப்பட வேண்டிய ஒருமைப்பாடு
  alternative: விசுவாசிகள் புதிதாக உருவாக்க வேண்டிய ஒருமைப்பாடு
  rationale: τηρεῖν என்பது பொதுவாக ஏற்கெனவே இருப்பதைப் பேணுதல் அல்லது காத்தல் என்று பொருள்படுகிறது; உருவாக்குதல் என்று அல்ல.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. வசனம் முந்தைய அறிவுறுத்தலின் தொடர்ச்சியாக இருப்பதால், தனித்து வாசிக்க இயல்பாகக் கட்டளை வடிவம் பயன்படுத்தப்பட்டது. “பிணைப்பு” என்ற உருவகம் பாதுகாக்கப்பட்டுள்ளது.
