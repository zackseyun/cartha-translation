revisions:
- from: உங்களுடைய முந்தைய வாழ்க்கை முறையைப் பொறுத்தவரை, வஞ்சகத்தால் வடிவமைக்கப்பட்ட ஆசைகளுக்கு ஏற்பச் சீரழிந்துகொண்டிருக்கும் பழைய மனிதனை[a]க் களைந்துபோட வேண்டும்[b],
  to: உங்களுடைய முந்தைய வாழ்க்கை முறையைப் பொறுத்தவரை, வஞ்சகத்தின் ஆசைகளுக்கு[b] ஏற்பச் சீரழிந்துகொண்டிருக்கும் பழைய மனிதனை[a]க் களைந்துபோட,
  rationale: The revision preserves the Greek infinitive without imposing ‘must,’ retains the ongoing corrupting/decaying sense, and renders the genitive ‘of deceit’ more transparently and less interpretively. The verse-ending comma appropriately signals dependence on the preceding sentence.
