  yaml_path: translation/nt/ephesians/004/022.yaml
  text: to put off[a], with respect to your former way of life, the old man, which is being corrupted according to deceitful desires[b],
translation:
  language: ta
  text: உங்களுடைய முந்தைய வாழ்க்கை முறையைப் பொறுத்தவரை, வஞ்சகத்தின் ஆசைகளுக்கு[b] ஏற்பச் சீரழிந்துகொண்டிருக்கும் பழைய மனிதனை[a]க் களைந்துபோட,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பழைய சுயம்” என்றும் பொருள் கொள்ளலாம். சொல்லுக்குச் சொல், “பழைய மனிதன்.” இங்கு ஆண்பால் வடிவம் ஆண்களை மட்டும் அல்லாமல், முந்தைய மனித வாழ்நிலையைப் பிரதிநிதித்துவமாகக் குறிக்கிறது.
    reason: alternative_reading
  - marker: b
    text: சொல்லுக்குச் சொல், “வஞ்சகத்தின் ஆசைகள்”; அதாவது, வஞ்சகத்துடன் தொடர்புடைய அல்லது வஞ்சகத்தால் தூண்டப்படும் ஆசைகள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποθέσθαι
  choice: களைந்துபோட வேண்டும்
  rationale: ஆடையைக் கழற்றுவது போன்ற உருவகத்தைத் தக்கவைத்து, 24ஆம் வசனத்தின் ‘அணிந்துகொள்ளுதல்’ என்ற எதிரிணையோடு பொருந்துகிறது. தமிழில் தனித்து நிற்கும் சொற்றொடராக இயல்பாக இருக்க ‘வேண்டும்’ சேர்க்கப்பட்டுள்ளது; இது முந்தைய வசனத்திலிருந்து தொடரும் போதனையின் உள்ளடக்கத்தைத் தெரிவிக்கிறது.
- source_word: κατὰ τὴν προτέραν ἀναστροφὴν
  choice: உங்களுடைய முந்தைய வாழ்க்கை முறையைப் பொறுத்தவரை
  rationale: ἀναστροφή நடத்தை அல்லது வாழும் முறையைக் குறிக்கிறது; இங்கு κατά தொடர்பு அல்லது பரப்பைக் காட்டுவதால் ‘பொறுத்தவரை’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: τὸν παλαιὸν ἄνθρωπον
  choice: பழைய மனிதனை
  rationale: கிரேக்கத்தின் மனிதவியல் உருவகத்தை நேரடியாகத் தக்கவைக்கிறது. இது ஆண்களை மட்டும் குறிக்காமல், ஒருவரின் முந்தைய மனித நிலை அல்லது வாழ்வுமுறையைப் பிரதிநிதித்துவமாகக் குறிக்கிறது.
- source_word: φθειρόμενον
  choice: சீரழிந்துகொண்டிருக்கும்
  rationale: நிகழ்காலச் செயப்பாட்டு வினையெச்சத்தின் தொடர்ச்சியான சீர்கேடு அல்லது அழிவை வெளிப்படுத்துகிறது.
- source_word: κατὰ τὰς ἐπιθυμίας τῆς ἀπάτης
  choice: வஞ்சகத்தால் வடிவமைக்கப்பட்ட ஆசைகளுக்கு ஏற்ப
  rationale: κατά கட்டுப்படுத்தும் நெறி அல்லது தாக்கத்தைச் சுட்டுகிறது. ‘வஞ்சகத்தின் ஆசைகள்’ என்ற சொற்சொல் அமைப்பின் பொருளை இயல்பான தமிழில், அந்த ஆசைகள் வஞ்சகத்தால் உருவாக்கப்பட்டவை என வெளிப்படுத்துகிறது.
theological_decisions:
- issue: τὸν παλαιὸν ἄνθρωπον என்பதன் மொழிபெயர்ப்பு
  choice: பழைய மனிதன்
  alternative: பழைய சுயம்
  rationale: ἄνθρωπος என்பதன் மனிதவியல் மற்றும் பிரதிநிதித்துவப் படிமத்தைத் தக்கவைக்கிறது; ‘சுயம்’ என்று மாற்றுவது மூலத்தின் மனிதன் என்ற உருவகத்தையும் சாத்தியமான கூட்டு சார்பையும் மங்கச் செய்யலாம். இதன் உள்ளடக்கிய பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- issue: ἀποθέσθαι என்ற முடிவிலியின் சூழல்சார் வலிமை
  choice: களைந்துபோட வேண்டும்
  alternative: களைந்துபோடும்படி / களைந்துபோட்டீர்கள்
  rationale: இது 21ஆம் வசனத்திலிருந்து வரும் கற்பித்தலின் உள்ளடக்கமாக இருப்பதைத் தெரிவிக்கிறது; கடந்தகால மனமாற்ற நிகழ்வாக மட்டுமே தீர்மானிக்கவில்லை. இருப்பினும் தமிழ் இலக்கணத் தெளிவுக்காக கடமை அல்லது அறிவுறுத்தலை உணர்த்தும் ‘வேண்டும்’ பயன்படுத்தப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் பொதுவாசகர்களுக்கான தெளிவும் கொண்ட நடை. வசனம் முந்தைய வாக்கியத்திலிருந்து தொடர்வதை இறுதி காற்புள்ளி உணர்த்துகிறது. ‘பழைய மனிதன்’ என்ற மூல உருவகம் தக்கவைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
