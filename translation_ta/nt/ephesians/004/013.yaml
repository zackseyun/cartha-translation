source:
  edition: SBLGNT
  text: μέχρι καταντήσωμεν οἱ πάντες εἰς τὴν ἑνότητα τῆς πίστεως καὶ τῆς ἐπιγνώσεως τοῦ υἱοῦ τοῦ θεοῦ, εἰς ἄνδρα τέλειον, εἰς μέτρον ἡλικίας τοῦ πληρώματος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/013.yaml
  text: until we all attain to the unity of the faith and of the knowledge of the Son of God[a], to a mature man, to the measure of the stature of the fullness of Messiah[e][d][c][b],
translation:
  language: ta
  text: நாம் அனைவரும் விசுவாசத்தின்[a] மற்றும் கடவுளுடைய மகனைப் பற்றிய அறிவின்[b] ஒருமையை அடைந்து, முதிர்ந்த மனிதனின் நிலையை அடைந்து[c], மெசியாவின்[e] நிறைவின் வளர்ச்சிநிலையின்[d] அளவை அடையும்வரை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விசுவாசத்தின்’ என்பது அனைவரும் பகிர்ந்துகொள்ளும் விசுவாசப் போதனையையோ, விசுவாசிகள் செலுத்தும் விசுவாசத்தையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: ‘அறிவு’ என்பதற்கு ‘முழுமையான அறிவு’ அல்லது ‘ஆழ்ந்த அறிவு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: கிரேக்கம் நேரடியாக ‘முதிர்ந்த ஆணிடம்’ என்று கூறுகிறது; முழுத் திருச்சபையின் கூட்டு முதிர்ச்சியை ஒரே முதிர்ந்த ஆண் என்ற உருவகத்தால் விவரிக்கிறது. ‘முழு முதிர்ச்சியை அடைந்து’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: d
    text: ‘வளர்ச்சிநிலை’ என்பதற்கு ‘முதிர்ச்சி’ அல்லது ‘உயரம்’ என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: e
    text: கிரேக்கத்தில் ‘கிறிஸ்து’; இங்கு அது பட்டப்பெயராக இருப்பதால் ‘மெசியா’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: μέχρι
  choice: எட்டும்வரை
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட பணியின் இலக்கை அடையும் கால எல்லையை இயல்பான தமிழில் குறிக்கிறது.
- source_word: καταντήσωμεν οἱ πάντες
  choice: நாம் அனைவரும் ... அடைந்து
  rationale: முழு விசுவாசக் குழுவையும் உள்ளடக்கும் οἱ πάντες என்பதையும், ஓர் இலக்கை வந்து அடையும் καταντάω என்பதையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: εἰς τὴν ἑνότητα τῆς πίστεως καὶ τῆς ἐπιγνώσεως
  choice: விசுவாசத்திலும் ... அறிவிலும் ஒருமையை
  rationale: ஒரே ἑνότητα என்பதற்கு இரண்டு பிறப்புவேற்றுமைத் தொடர்கள் சார்ந்திருப்பதை இயல்பான தமிழில் காட்டுகிறது; இருவகை ஒருமைகள் என்று தவறாகப் பிரிக்கவில்லை.
- source_word: τῆς πίστεως
  choice: விசுவாசத்தில்
  rationale: πίστις என்பதன் சமயச் சூழலுக்கேற்ற வழக்கமான தமிழ்ச் சொல்லைத் தக்கவைத்து, அது பொதுவான நம்பிக்கையா அல்லது பகிரப்பட்ட விசுவாச உள்ளடக்கமா என்ற நுணுக்கத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: ἐπιγνώσεως
  choice: அறிவில்
  rationale: சொல்லின் அடிப்படைப் பொருளை மிகைப்படுத்தாமல் தருகிறது; ‘முழுமையான அறிவு’ என்ற தீவிரப் பொருள் சாத்தியம் என்பதை அடிக்குறிப்பு குறிப்பிடுகிறது.
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: கடவுளுடைய மகனைப் பற்றிய
  rationale: அறிவின் பொருள் கடவுளுடைய மகன் என்பதைத் தெளிவான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: εἰς ἄνδρα τέλειον
  choice: முதிர்ச்சியடைந்த மனிதனாகி
  rationale: τέλειος இங்கு குற்றமற்ற பரிபூரணத்தைவிட முழு வளர்ச்சியடைந்த முதிர்ச்சியைக் குறிக்கிறது. ஒருமை மனித உருவகமும் தக்கவைக்கப்படுகிறது.
- source_word: μέτρον ἡλικίας
  choice: வளர்ச்சிநிலையின் அளவை
  rationale: ἡλικία என்பதன் வளர்ச்சி, உடலளவு, முதிர்ச்சி ஆகிய தொடர்புடைய நுணுக்கங்களைத் தமிழில் வளர்ச்சி உருவகத்தோடு பாதுகாக்கிறது.
- source_word: τοῦ πληρώματος
  choice: நிறைவுக்குரிய
  rationale: πλήρωμα என்பதன் இறையியல் செறிவை ‘நிறைவு’ மூலம் தக்கவைத்து, அந்நிறைவுடன் தொடர்புடைய வளர்ச்சியளவு என்பதை இயல்பாக இணைக்கிறது.
- source_word: τοῦ Χριστοῦ
  choice: மெசியாவின்
  rationale: Χριστός இங்கு அபிஷேகம் செய்யப்பட்டவரைக் குறிக்கும் பட்டப்பெயராகச் செயல்படுவதால் ‘மெசியா’ என மொழிபெயர்க்கப்படுகிறது.
