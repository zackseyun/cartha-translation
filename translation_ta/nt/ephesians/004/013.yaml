translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. கிரேக்கத்தின் நீண்ட இலக்கு அமைப்பை ஒரே வாக்கியமாக வைத்தாலும், தமிழில் இயல்பாகப் படிக்க வினையெச்சத் தொடர்கள் பயன்படுத்தப்பட்டுள்ளன. ‘கடவுளுடைய மகன்’, ‘விசுவாசம்’, ‘மெசியா’ ஆகியவை தெளிவான சமயச் சொற்களாகத் தக்கவைக்கப்பட்டுள்ளன.
