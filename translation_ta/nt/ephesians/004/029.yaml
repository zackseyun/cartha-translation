source:
  edition: SBLGNT
  text: πᾶς λόγος σαπρὸς ἐκ τοῦ στόματος ὑμῶν μὴ ἐκπορευέσθω, ἀλλὰ εἴ τις ἀγαθὸς πρὸς οἰκοδομὴν τῆς χρείας, ἵνα δῷ χάριν τοῖς ἀκούουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/029.yaml
  text: Let no rotten word come out of your mouth[a], but only such as is good for building up according to the need[d][c][b], so that it may give grace to those who hear.
translation:
  language: ta
  text: உங்கள் வாயிலிருந்து அழுகிய பேச்சு எதுவும் வெளிவர வேண்டாம்[a]. மாறாக, தேவைக்கேற்பக் கட்டியெழுப்புவதற்கு ஏற்ற நல்ல பேச்சை மட்டும் பேசுங்கள்[b]; அது கேட்கிறவர்களுக்கு அருளை அளிக்கும்படி[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கெட்டுப்போன பேச்சு எதுவும்” அல்லது “தீங்கான பேச்சு எதுவும்.” கிரேக்கச் சொல் நேரடியாக அழுகிய அல்லது கெட்டுப்போன ஒன்றைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “தேவைக்கேற்ப” என்பதை “தேவை கோருகிறபடி” அல்லது “அந்தச் சூழ்நிலைக்கு ஏற்றபடி” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “கேட்கிறவர்களுக்கு நன்மை அளிக்கும்படி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς λόγος σαπρὸς
  choice: அழுகிய பேச்சு எதுவும்
  rationale: மறுப்புக் கட்டளையின் கீழ் வரும் πᾶς என்பதன் ‘எதுவும் ... வேண்டாம்’ என்ற பகிர்வுப் பொருளைத் தெளிவாகக் காட்டுகிறது. σαπρός என்பதிலுள்ள அழுகல் உருவகத்தைத் தக்கவைத்து, λόγος என்பதை இச்சூழலில் இயல்பான ‘பேச்சு’ என மொழிபெயர்க்கிறது.
- source_word: ἐκ τοῦ στόματος ὑμῶν μὴ ἐκπορευέσθω
  choice: உங்கள் வாயிலிருந்து ... வெளிவர வேண்டாம்
  rationale: பேச்சு வாயிலிருந்து புறப்படும் உடல்சார் உருவகத்தையும், μή உடன் வரும் கட்டளைத் தடையின் வலிமையையும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: ἀλλὰ εἴ τις ἀγαθὸς
  choice: மாறாக ... நல்ல பேச்சையே பேசுங்கள்
  rationale: கிரேக்கத்தில் விடுபட்டுள்ள வினைச்சொல்லைத் தமிழில் இயல்பாக நிறைவு செய்கிறது; தீய பேச்சுக்கு எதிராக நல்ல பேச்சு மட்டுமே இருக்க வேண்டும் என்ற முரணை ‘-ஏ’ வலியுறுத்துகிறது.
- source_word: πρὸς οἰκοδομὴν τῆς χρείας
  choice: தேவைக்கேற்ப கட்டியெழுப்ப உதவும்
  rationale: οἰκοδομή என்பதின் கட்டட உருவகத்தை ‘கட்டியெழுப்ப’ எனத் தக்கவைக்கிறது. τῆς χρείας என்பதின் சுருக்கமான, ஓரளவு தெளிவற்ற தொடர்பை ‘தேவைக்கேற்ப’ என வழங்குகிறது; அது குறிப்பிட்ட தேவை அல்லது சூழ்நிலைக்கேற்ற தேவை ஆகிய இரண்டையும் முற்றிலும் மூடிவிடாது.
- source_word: ἵνα δῷ χάριν
  choice: அருளை அளிக்கும்படி
  rationale: ἵνα குறிக்கும் நோக்கம் அல்லது விளைவை ‘-ும்படி’ எனக் காட்டுகிறது. χάρις என்பதைக் ‘அருள்’ என வழங்குவது பவுலின் சொற்பயன்பாட்டின் ஆன்மிக மற்றும் உறவுசார் ஒலியைப் பாதுகாக்கிறது; ‘நன்மை’ என்ற சூழல்சார் பொருளை அடிக்குறிப்பில் தருகிறது.
- source_word: τοῖς ἀκούουσιν
  choice: கேட்கிறவர்களுக்கு
  rationale: நிகழ்காலப் பங்கேற்புச் சொல்லின் தொடர்ச்சியான கேட்புச் செயலை எளிய, இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ஒழுக்க அறிவுரையின் சூழலில் χάριν என்பதன் பொருள்
  choice: அருள்
  alternative: நன்மை
  rationale: இங்கு பேச்சு கேட்பவர்கள்மீது ஏற்படுத்தும் நல்ல விளைவு முன்னிலையில் உள்ளது. எனினும் ‘அருள்’ என்பது பவுலின் தனிச்சிறப்பான சொல்லாட்சியையும் அதன் உறவுசார் மற்றும் இறையியல் ஒலியையும் தக்கவைக்கிறது; வெறும் பயன்தன்மையாகப் பொருளைச் சுருக்குவதில்லை. ‘நன்மை’ என்ற சாத்தியத்தை அடிக்குறிப்பு வெளிப்படையாகக் குறிப்பிடுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிதில் புரியும், ஆனால் கண்ணியமான அறிவுரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அழுகிய பேச்சு’ மற்றும் ‘கட்டியெழுப்ப’ ஆகியவை மூலத்தின் இரு உயிருள்ள உருவகங்களையும் தக்கவைக்கின்றன. சொற்சொற் வரிசையைப் பின்பற்றாமல், தமிழில் இயல்பான வாக்கிய ஓட்டத்திற்காக கிரேக்கத்தின் விடுபட்ட வினை ‘பேசுங்கள்’ என வெளிப்படுத்தப்பட்டுள்ளது.
