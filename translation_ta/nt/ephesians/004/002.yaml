  text: μετὰ πάσης ταπεινοφροσύνης καὶ πραΰτητος, μετὰ μακροθυμίας, ἀνεχόμενοι ἀλλήλων ἐν ἀγάπῃ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/002.yaml
  text: with all humility and gentleness, with patience, bearing with one another in love,
translation:
  language: ta
  text: முழு மனத்தாழ்மையுடனும் மென்மையுடனும், பொறுமையுடனும், அன்பில் ஒருவரை ஒருவர் பொறுத்துக்கொண்டு,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ πάσης
  choice: முழு … ஓடும்
  rationale: μετά + பிறப்புவேற்றுமை உடனிருப்பதைக் குறிக்கிறது; πάσης பண்பின் முழுமையை வலியுறுத்துகிறது. தமிழில் ‘முழு … ஓடும்’ என்பது இரண்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ταπεινοφροσύνης
  choice: மனத்தாழ்மை
  rationale: இந்தச் சொல் தாழ்மையான மனப்பான்மையைக் குறிக்கிறது. ‘மனத்தாழ்மை’ நவீனத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: πραΰτητος
  choice: மென்மை
  rationale: πραΰτης கட்டுப்படுத்தப்பட்ட வலிமையோடு கூடிய கனிவான, கடுமையற்ற நடத்தையைக் குறிக்கலாம். ‘மென்மை’ இதை இயல்பான தமிழில் தெரிவிக்கிறது; ‘சாந்தம்’ என்ற மாற்றும் சாத்தியம்.
- source_word: μακροθυμίας
  choice: பொறுமை
  rationale: மற்றவர்களிடம் நீடிய பொறுமையுடனும் கோபிக்கத் தாமதித்தும் இருப்பதை இந்தச் சொல் குறிக்கிறது. ‘பொறுமை’ தெளிவான நவீனத் தமிழ்.
- source_word: ἀνεχόμενοι
  choice: தாங்கிக்கொண்டு
  rationale: நிகழ்காலப் பங்கேற்புவினை தொடர்ச்சியான சகிப்புத்தன்மையைச் சுட்டுகிறது. ‘தாங்கிக்கொண்டு’ அதன் நீடித்த, உறவுசார் பொருளைப் பாதுகாக்கிறது.
- source_word: ἀλλήλων
  choice: ஒருவரை ஒருவர்
  rationale: பரஸ்பரச் சுட்டுப்பெயரின் இயல்பான தமிழ் இணை இது.
- source_word: ἐν ἀγάπῃ
  choice: அன்பில்
  rationale: ἐν + நான்காம் வேற்றுமை இங்கு பரஸ்பரம் தாங்குவதற்கான சூழலையோ முறையையோ குறிக்கலாம். ‘அன்பில்’ அந்தச் சுருக்கமான இருபொருள் வாய்ப்பையும் காக்கிறது.
theological_decisions:
- issue: ἀγάπη என்பதன் மொழிபெயர்ப்பு
  choice: அன்பு
  alternative: அன்புடனே
  rationale: ‘அன்பு’ என்பது ἀγάπη-யின் இயல்பான, சமயப்பிரிவு சாராத நவீனத் தமிழ். ‘அன்பில்’ என்பது கிரேக்க ἐν அமைப்பை நேரடியாகப் பாதுகாத்து, அன்பைச் சூழலாகவோ செயல்முறையாகவோ புரிந்துகொள்ளும் வாய்ப்பைத் திறந்துவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குத் தெளிவாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. இது முந்தைய வசனத்தில் தொடங்கிய அறிவுறுத்தலைத் தொடரும் சொற்றொடர் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
