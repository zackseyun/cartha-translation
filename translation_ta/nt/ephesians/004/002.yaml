- from: முழு மனத்தாழ்மையோடும் மென்மையோடும், பொறுமையோடும், அன்பில் ஒருவரை ஒருவர் தாங்கிக்கொண்டு,
  to: முழு மனத்தாழ்மையுடனும் மென்மையுடனும், பொறுமையுடனும், அன்பில் ஒருவரை ஒருவர் பொறுத்துக்கொண்டு,
