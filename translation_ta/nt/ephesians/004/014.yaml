reference: Ephesians 4:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἵνα μηκέτι ὦμεν νήπιοι, κλυδωνιζόμενοι καὶ περιφερόμενοι παντὶ ἀνέμῳ τῆς διδασκαλίας ἐν τῇ κυβείᾳ τῶν ἀνθρώπων ἐν πανουργίᾳ πρὸς τὴν μεθοδείαν τῆς πλάνης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/014.yaml
  text: so that we may no longer be children[a], tossed by waves and carried about by every wind of teaching, by human trickery, by craftiness in the scheming of error[c][b],
translation:
  language: ta
  text: இதனால் நாம் இனி சிறுபிள்ளைகளாய் இருந்து, அலைகளால் அலைக்கழிக்கப்பட்டு, ஒவ்வொரு போதனைக் காற்றாலும் அங்குமிங்கும் அடித்துச் செல்லப்படுகிறவர்களாக இருக்காதபடி, மனிதரின் ஏமாற்று வித்தையினாலும்[a], தவறின் திட்டமிட்ட சூழ்ச்சியை நோக்கிய வஞ்சகத்தினாலும்[b] இருக்கக்கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஏமாற்று வித்தை’ என்பதற்கான கிரேக்கச் சொல் நேரடியாக ‘பகடை விளையாட்டு’ என்று பொருள்படும்; மோசடியாக விளையாடுவதை உருவகமாகக் கொண்டு ஏமாற்றுதலைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, “தவறின் திட்டமிட்ட சூழ்ச்சிக்காகப் பயன்படுத்தப்படும் வஞ்சகத்தினாலும்.” ‘தவறு’ என்பதற்கான கிரேக்கச் சொல் ‘வழிதவறுதல்’ அல்லது ‘ஏமாற்றுதல்’ என்றும் பொருள்படலாம்.
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: ἵνα μηκέτι ὦμεν
  choice: இதனால் நாம் இனி ... இராமல் இருப்போம்
  rationale: ἵνα முந்தைய கருத்தின் நோக்கம் அல்லது விளைவை அறிமுகப்படுத்துகிறது; μηκέτι முன்னிருந்த நிலை இனி தொடராததைச் சுட்டுகிறது. தமிழில் இயல்பாக வாசிக்க நோக்கம்/விளைவு நுணுக்கம் இவ்வாறு வெளிப்படுத்தப்பட்டது.
- source_word: νήπιοι
  choice: சிறுபிள்ளைகள்
  rationale: உடல் வயதை மட்டும் அல்லாமல் முதிர்ச்சியின்மையையும் உருவகமாகக் குறிக்கிறது. ‘குழந்தைகள்’ என்பதைக் காட்டிலும் ‘சிறுபிள்ளைகள்’ இங்கு உருவகத் தன்மையைத் தெளிவாக வைத்திருக்கிறது; ‘கைக்குழந்தைகள்’ என்பது அளவுக்கு மீறிய குறிப்பாக்கமாகும்.
- source_word: κλυδωνιζόμενοι
  choice: அலைகளால் அலைக்கழிக்கப்பட்டு
  rationale: கடல் அலைகளால் தூக்கி எறியப்படுதல் அல்லது தடுமாறச் செய்யப்படுதல் என்ற உருவகத்தை நேரடியாகவும் இயல்பாகவும் காக்கிறது.
- source_word: περιφερόμενοι παντὶ ἀνέμῳ τῆς διδασκαλίας
  choice: ஒவ்வொரு போதனைக் காற்றாலும் அங்குமிங்கும் அடித்துச் செல்லப்பட்டு
  rationale: செயப்பாட்டு நிலையும் காற்றின் உருவகமும் காக்கப்படுகின்றன. διδασκαλία என்பதற்கு தொழில்நுட்பமான ‘கோட்பாடு’ என்பதற்குப் பதில் பரந்த பொருளுடைய ‘போதனை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἐν τῇ κυβείᾳ τῶν ἀνθρώπων
  choice: மனிதர்களின் ஏமாற்று வித்தையால்
  rationale: κυβεία என்பதன் நேரடிப் பின்னணி பகடை விளையாட்டு; இங்கு மோசடி அல்லது தந்திரமான ஏமாற்று என்பதே சூழல்சார் பொருள். ‘ஏமாற்று வித்தை’ அந்தச் செயலின் திறமையாக மறைக்கப்பட்ட தன்மையையும் தருகிறது.
- source_word: ἐν πανουργίᾳ
  choice: வஞ்சகத் தந்திரத்தால்
  rationale: πανουργία அறநெறியற்ற கூர்மையையும் சூழ்ச்சியையும் குறிக்கிறது; ‘வஞ்சகத் தந்திரம்’ அதன் எதிர்மறையான ஒழுக்கத் தன்மையை வெளிப்படுத்துகிறது.
- source_word: πρὸς τὴν μεθοδείαν τῆς πλάνης
  choice: தவறின் சூழ்ச்சியை முன்னெடுக்கும்
  rationale: μεθοδεία திட்டமிட்ட சூழ்ச்சியைக் குறிக்கிறது; πλάνη தவறு, வழிதவறுதல், அல்லது ஏமாற்றுதல் எனப் பொருள்படலாம். πρός குறிக்கும் திசை அல்லது நோக்கம் தமிழில் ‘முன்னெடுக்கும்’ என்பதால் வெளிப்படுத்தப்பட்டுள்ளது; தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: διδασκαλία என்பதன் மொழிபெயர்ப்பு
  choice: போதனை
  alternative: கோட்பாடு / உபதேசம்
  rationale: இந்தச் சொல் எல்லா வகையான கற்பித்தலையும் குறிக்கக்கூடும்; குறிப்பிட்ட சமயக் கோட்பாட்டு அமைப்பாக அதைச் சுருக்காமல் ‘போதனை’ என்று தருவது மூலத்தின் பரப்பை காக்கிறது.
- issue: πλάνη என்பதன் பொருள்
  choice: தவறு
  alternative: ஏமாற்றுதல் / வழிதவறச் செய்தல்
  rationale: இச்சொல் தவறான நிலை, வழிதவறுதல், அல்லது பிறரை ஏமாற்றுதல் ஆகிய பொருட்களை ஏற்கக்கூடும். சுற்றியுள்ள சொற்கள் மனித வஞ்சகத்தை ஏற்கெனவே வெளிப்படுத்துவதால், ‘தவறு’ அதன் பொருள் பரப்பையும் இறையியல் பதற்றத்தையும் அளவுக்கு மீறாமல் காக்கிறது.
- issue: πρὸς உடன் வரும் இறுதிச் சொற்றொடரின் தொடர்பு
  choice: தவறின் சூழ்ச்சியை முன்னெடுக்கும் வஞ்சகத் தந்திரம்
  alternative: தவறின் சூழ்ச்சியை நோக்கிய வஞ்சகத் தந்திரம்
  rationale: கிரேக்கச் சொற்றொடர் சுருக்கமாகவும் தொடர்பில் ஓரளவு தெளிவற்றதாகவும் உள்ளது. ‘முன்னெடுக்கும்’ என்பது நோக்கம்/திசையை இயல்பான தமிழில் தருகிறது; ஆனால் தந்திரம், சூழ்ச்சி, தவறு ஆகியவற்றின் உறவை முழுமையாகத் தீர்மானிப்பதைத் தவிர்க்க மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகமத்துக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. கடல் அலை மற்றும் காற்று ஆகிய இணைந்த உருவகங்கள் தெளிவாகப் பாதுகாக்கப்பட்டன. நீண்ட கிரேக்க வாக்கியத்தின் கருத்தோட்டத்தை வாசகர் எளிதில் பின்பற்ற இரு தமிழ் வாக்கியங்களாகப் பிரித்தாலும், இரண்டாவது வாக்கியத்தில் ‘இவ்வாறு’ என்று இணைப்பு வெளிப்படையாக வைக்கப்பட்டது.
