lexical_decisions:
- source_word: ὑμεῖς
  choice: நீங்கள்
  rationale: இரண்டாம் நபர் பன்மைப் பெயர்ச்சொல் வெளிப்படையாக வந்து வலியுறுத்துகிறது; ‘நீங்களோ’ என்பதில் அந்த வலியுறுத்தலும் முந்தையவர்களுடனான வேறுபாடும் இயல்பாகத் தெரிகின்றன.
- source_word: δὲ
  choice: -ஓ
  rationale: முந்தைய வசனங்களில் விவரிக்கப்பட்ட பிற இனத்தாரின் வாழ்க்கை முறைக்கு எதிரான வேறுபாட்டைத் தமிழில் ‘நீங்களோ’ என்ற எதிர்மறை இணைப்புக் கட்டமைப்பு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὐχ οὕτως
  choice: இவ்வாறு ... இல்லை
  rationale: οὕτως குறிக்கும் முறைசார் பொருளைத் தெளிவாகக் காக்கிறது; முன்பு விவரிக்கப்பட்ட வாழ்க்கை முறையையே சுட்டுகிறது.
- source_word: ἐμάθετε
  choice: கற்றுக்கொள்ளவில்லை
  rationale: μανθάνω என்பதன் அடிப்படைப் பொருளான ‘கற்றுக்கொள்’ என்பதைக் காக்கிறது. ‘உங்களுக்குக் கற்பிக்கப்படவில்லை’ என்று மொழிபெயர்த்தால் மூலத்தில் இல்லாத செயப்பாட்டு வடிவம் புகுத்தப்படும்; ‘அறிந்துகொள்ளவில்லை’ என்பது அதிக விளக்கமாகிவிடும்.
- source_word: τὸν Χριστόν
  choice: மெசியாவை
  rationale: Χριστός என்பதன் அபிஷேகம் பெற்றவர் என்ற பட்டப் பொருளை ‘மெசியா’ காக்கிறது. ஒரு நபரை ‘கற்றுக்கொள்வது’ என்ற பவுலின் வழக்கத்திற்கு மாறான, செறிவான சொற்றொடரை விளக்கவுரையாக மாற்றாமல் வைத்திருக்கிறது.
theological_decisions:
- issue: Χριστόν என்பதைப் பட்டமாக மொழிபெயர்ப்பதா, பெயர்போன்ற வழக்குச் சொல்லாக மொழிபெயர்ப்பதா
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு இயேசுவின் பெயரை மட்டும் கூறாமல், நற்செய்தியில் விசுவாசிகள் கற்றுக்கொண்ட அபிஷேகம் பெற்றவரைக் குறிக்கும் பட்டப் பொருள் நிலைத்திருக்கிறது. ஆயினும் ‘கிறிஸ்து’ என்ற மரபான மொழிபெயர்ப்பும் சாத்தியமானதால் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ‘மெசியாவைக் கற்றுக்கொண்டீர்கள்’ என்ற வழக்கத்திற்கு மாறான பொருள்
  choice: அந்த நேரடி அமைப்பைப் பாதுகாத்தல்
  alternative: மெசியாவைப் பற்றிய செய்தியைக் கற்றுக்கொண்டீர்கள்
  rationale: மூலவாக்கியம் τὸν Χριστόν என்பதை நேரடி செயப்படுபொருளாகக் கொண்டுள்ளது. ‘அவரைப் பற்றிய செய்தி’ என்று விரிவாக்குவது பொருளை ஓரளவு விளக்கினாலும், நபரையும் அவரைப்பற்றிய போதனையையும் இணைக்கும் மூலத்தின் செறிவையும் இறையியல் பதற்றத்தையும் குறைத்துவிடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், சுருக்கமானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நீங்களோ’ என்பது ὑμεῖς δὲ-யின் வலியுறுத்தலையும் எதிர்மறைத் தொடர்பையும் ஒரே இயல்பான தமிழ்க் கட்டமைப்பில் தருகிறது. வழக்கத்திற்கு மாறான ‘மெசியாவைக் கற்றுக்கொள்’ என்ற மூல உருவகம் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளது.
