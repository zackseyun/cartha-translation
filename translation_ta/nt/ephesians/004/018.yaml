lexical_decisions:
- source_word: ἐσκοτωμένοι
  choice: இருளடைந்திருக்கிறது
  rationale: முடிவுற்ற செயலால் தொடரும் நிலையைக் காட்டும் நிறைவு காலச் செயப்பாட்டு வடிவத்தை, புரிந்துணர்வு இப்போது இருண்ட நிலையில் இருப்பதாக இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τῇ διανοίᾳ
  choice: புரிந்துணர்வு
  rationale: சிந்தை, மனம், புரிந்துகொள்ளும் ஆற்றல் ஆகிய பொருள் வளையத்தைக் கொண்ட சொல்லுக்கு, இங்கு அறிவுணர்வுச் செயல்பாட்டைத் தெளிவாகக் காட்டும் நவீனத் தமிழ் சொல்.
- source_word: ἀπηλλοτριωμένοι
  choice: அந்நியப்பட்டிருக்கிறார்கள்
  rationale: பிரிக்கப்பட்ட அல்லது விலக்கப்பட்ட நிலையில் இருப்பதைக் காட்டும் நிறைவு காலச் செயப்பாட்டு பொருளைத் தக்கவைத்து, சட்டரீதியான விலக்கல் என்று மட்டும் குறுக்கவில்லை.
- source_word: τῆς ζωῆς τοῦ θεοῦ
  choice: கடவுளின் வாழ்விலிருந்து
  rationale: கடவுளுக்குச் சொந்தமான வாழ்வா அல்லது கடவுளிடமிருந்து வரும் வாழ்வா என்ற கிரேக்க மரபுத்தொடரின் உண்மையான இருபொருள் வாய்ப்பைத் தீர்மானிக்காமல் வைக்கிறது.
- source_word: διὰ τὴν ἄγνοιαν τὴν οὖσαν ἐν αὐτοῖς
  choice: அவர்களுக்குள் இருக்கும் அறியாமையினாலும்
  rationale: διά + ஏவல் வேற்றுமையின் காரணப் பொருளையும், அறியாமை அவர்களுக்குள் இருப்பதாகக் கூறும் அடைமொழித் தொடரையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: διὰ τὴν πώρωσιν
  choice: கடினத்தினாலும்
  rationale: πώρωσις என்பதன் கடினமாதல் அல்லது உணர்விழந்த மழுங்கிய நிலை என்ற உருவகத்தைச் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: τῆς καρδίας αὐτῶν
  choice: அவர்களுடைய இதயங்களின்
  rationale: கிரேக்கத்தில் இதயம் ஒருமையில் இருந்தாலும், பன்மை மனிதர்களைக் குறிக்கும் தமிழில் ‘இதயங்கள்’ என்பது இயல்பாகவும் தெளிவாகவும் அமைகிறது; மூலத்தின் ஒருமை அடிக்குறிப்பில் பதிவு செய்யப்படுகிறது.
theological_decisions:
- issue: ‘கடவுளின் வாழ்வு’ என்பதன் பொருள்
  choice: உடைமை அல்லது மூலாதாரம் எது என்று தீர்மானிக்காமல் ‘கடவுளின் வாழ்வு’ என்று மொழிபெயர்த்தல்
  alternative: கடவுளிடமிருந்து வரும் வாழ்வு / கடவுளுக்குரிய வாழ்வு
  rationale: τοῦ θεοῦ என்ற உறவுவேற்றுமை, கடவுளுக்குச் சொந்தமான வாழ்வையோ கடவுள் வழங்கும் வாழ்வையோ குறிக்கக்கூடும். மொழிபெயர்ப்பு கிரேக்கம் திறந்துவைக்கும் பொருள் வாய்ப்பைத் திறந்தே வைக்கிறது.
- issue: பன்மை நபர்களோடு வரும் ஒருமை ‘இதயம்’
  choice: இயல்பான தமிழுக்காக ‘அவர்களுடைய இதயங்கள்’ என்று வழங்கி, கிரேக்க ஒருமையை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: அவர்களுடைய இதயம்
  rationale: ஒருமை வடிவத்தைத் தமிழில் அப்படியே வைத்தால் செயற்கையாக ஒலிக்கலாம். பன்மை வடிவம் ஒவ்வொருவரின் உள்ளார்ந்த மையத்தையும் இயல்பாகக் குறிக்கிறது; மூல வடிவம் மறைக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் காரணத் தொடர்புகள் ‘அறியாமையினாலும்… கடினத்தினாலும்’ என இணையாக வைக்கப்பட்டுள்ளன. நீண்ட கிரேக்கப் பங்கேற்பு அமைப்பு தமிழில் தெளிவுக்காக இரண்டு முதன்மை வினைநிலைகளாக இயல்பாக்கப்பட்டுள்ளது.
