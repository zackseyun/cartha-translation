translation:
  language: ta
  text: அவர்களுடைய புரிந்துணர்வு[a] இருளடைந்திருக்கிறது; அவர்களுக்குள் இருக்கும் அறியாமையினாலும், அவர்களுடைய இதயத்தின்[e] கடினத்தினாலும்[d], அவர்கள் கடவுளின் வாழ்விலிருந்து[b][c] அந்நியப்பட்டிருக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘புரிந்துணர்வு’ என்பதற்குப் பதிலாக ‘சிந்தை’ என்றும் மொழிபெயர்க்கலாம் (διανοίᾳ).
    reason: lexical_alternative
  - marker: b
    text: ‘கடவுளின் வாழ்விலிருந்து அந்நியப்பட்டிருக்கிறார்கள்’ என்பதற்குப் பதிலாக ‘கடவுளின் வாழ்விலிருந்து விலக்கப்பட்டிருக்கிறார்கள்’ என்றும் மொழிபெயர்க்கலாம்.
