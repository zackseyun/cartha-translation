base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/004.yaml
  text: There is one body and one Spirit[a], just as you also were called in one hope of your calling.
translation:
  language: ta
  text: ஒரே உடலும் ஒரே ஆவியும்[a] உண்டு; அதுபோலவே, உங்கள் அழைப்பின் ஒரே நம்பிக்கையில் நீங்களும் அழைக்கப்பட்டீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரே தூய ஆவியானவர்.’ கிரேக்கத்தில் பெரிய எழுத்து, சிறிய எழுத்து வேறுபாடு இல்லை. இங்கு ‘ஆவி’ என்பது தூய ஆவியானவரைக் குறிக்கலாம்; இப்பகுதியின் ஒற்றுமை வரிசையில் அது அதிகம் சாத்தியமான பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἓν
  choice: ஒரே
  rationale: ஒற்றுமையை வலியுறுத்தும் இந்தச் சொல், அதன் ஒவ்வொரு பயன்பாட்டிலும் இயல்பான தமிழில் ‘ஒரே’ என்று சீராக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: σῶμα
  choice: உடல்
  rationale: அடிப்படை உருவகத்தை விளக்கிச் சுருக்காமல் அப்படியே காக்கிறது; இங்கு இது விசுவாசிகளின் ஒன்றுபட்ட உடலைக் குறிக்கலாம்.
- source_word: πνεῦμα
  choice: ஆவி
  rationale: கிரேக்கச் சொல் தூய ஆவியானவரையோ ‘ஆவி’ என்ற பொதுப் பொருளையோ குறிக்கக்கூடும். முதன்மை உரையில் ‘ஆவி’ என்று வைத்து மூலத்தின் சொல்லியல் தெளிவின்மையைப் பாதுகாத்து, சூழலால் அதிகம் சாத்தியமான பொருளை அடிக்குறிப்பில் குறிப்பிடுகிறது.
- source_word: καθὼς καὶ
  choice: அதுபோலவே ... நீங்களும்
  rationale: ஒப்புமையையும் καί தரும் ‘நீங்களும்’ என்ற வலியுறுத்தலையும் இயல்பான தமிழ் சொல்வரிசையில் காக்கிறது.
- source_word: ἐκλήθητε
  choice: அழைக்கப்பட்டீர்கள்
  rationale: இறந்தகாலச் செயப்பாட்டு வடிவத்தையும், அழைத்தவர் யார் என்பதை வெளிப்படையாகச் சேர்க்காத மூலத்தின் அமைப்பையும் காக்கிறது.
- source_word: ἐν μιᾷ ἐλπίδι
  choice: ஒரே நம்பிக்கையில்
  rationale: ἐν என்பதன் ‘இல்’ உறவையும், இப்பகுதியின் ஒற்றுமை வலியுறுத்தலையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: τῆς κλήσεως ὑμῶν
  choice: உங்கள் அழைப்புக்குரிய
  rationale: ‘அழைக்கப்பட்டீர்கள்’ என்பதற்கும் ‘அழைப்பு’ என்பதற்கும் இடையிலான மூலச் சொல்லிணைப்பைத் தமிழில் தெளிவாகக் காக்கிறது; நம்பிக்கை அந்த அழைப்புடன் தொடர்புடையது என்பதையும் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: πνεῦμα என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘ஆவி’; சூழலில் தூய ஆவியானவரைக் குறிக்கும் வாசிப்புக்கு முன்னுரிமை
  alternative: விசுவாசிகள் பகிர்ந்துகொள்ளும் ஆவிக்குரிய நிலை அல்லது மனப்பான்மை
  rationale: எபேசியர் 4:4–6-இல் வரும் ‘ஒரே உடல் ... ஒரே ஆவி ... ஒரே ஆண்டவர் ... ஒரே கடவுளும் தந்தையும்’ என்ற ஒற்றுமை வரிசை, தூய ஆவியானவரைக் குறிப்பதே மிகவும் சாத்தியம் எனக் காட்டுகிறது. எனினும் கிரேக்க மூலத்தில் பெரிய/சிறிய எழுத்து வேறுபாடு இல்லாததால், தமிழில் ‘தூய’ அல்லது ‘ஆவியானவர்’ என்று விளக்கத்தை மூல உரைக்குள் சேர்க்காமல், மாற்று வாய்ப்பை அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. கிரேக்கத்தில் வினைச்சொல் வெளிப்படையாக இல்லாத இடத்தில், இயல்பான தமிழ் வாக்கியத்திற்காக ‘உண்டு’ சேர்க்கப்பட்டுள்ளது.
