translation:
  language: ta
  text: ஒரே ஆண்டவர், ஒரே விசுவாசம்[a], ஒரே திருமுழுக்கு;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விசுவாசம்’ (πίστις) என்பதற்கு ‘நம்பிக்கை’ அல்லது ‘நம்பகத்தன்மை’ என்றும் பொருள் இருக்கலாம்; எனினும் இங்கு வலியுறுத்தப்படும் அனைவருக்கும் பொதுவான ஒருமைக்கு ‘விசுவாசம்’ என்பதே சிறப்பாகப் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς / μία / ἓν
  choice: ஒரே
  rationale: மூன்று பாலின வடிவங்களிலும் வரும் ‘ஒன்று’ என்ற எண்ணுப்பெயர் ஒருமையை வலியுறுத்துகிறது. தமிழில் இணைப்புப் பயன்பாட்டுக்கேற்ற ‘ஒரே’ என்பதை மூன்றிடங்களிலும் ஒரேவிதமாகப் பயன்படுத்தி இணைநடையைப் பாதுகாக்கிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: பவுலின் இச்சூழலில் இது வெறும் எஜமானைக் குறிக்காமல் கிறிஸ்துவுக்குரிய பட்டமாகப் பயன்படுகிறது; நவீனத் தமிழ் வேதாகம நடையில் ‘ஆண்டவர்’ இயல்பானதும் மரியாதைக்குரியதும் ஆகும்.
- source_word: πίστις
  choice: விசுவாசம்
  rationale: இங்கு திருச்சபையை ஒன்றிணைக்கும் பொதுவான விசுவாசம் அல்லது நம்புகிற மறுமொழி முதன்மையாகக் குறிக்கப்படுகிறது. ‘நம்பிக்கை’ என்பதும் சாத்தியமான மொழிபெயர்ப்பு; ஆனால் இறையியல் சூழலில் πίστις என்பதன் பரந்த பொருளை ‘விசுவாசம்’ தெளிவாகத் தக்கவைக்கிறது.
- source_word: βάπτισμα
  choice: திருமுழுக்கு
  rationale: கிறிஸ்தவத் தொடக்கச் சடங்கைக் குறிக்கும் துல்லியமான, தமிழில் புரிந்துகொள்ளத்தக்க சொல். அதன் முறை, விளைவு அல்லது இறையியல் தன்மையை மொழிபெயர்ப்பிலேயே தீர்மானிக்காமல் மூலத்தின் நடுநிலையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘ஆண்டவர்’ என்பவர் யார்
  choice: கிறிஸ்துவுக்குரிய பட்டமாக ‘ஆண்டவர்’ என்று மொழிபெயர்க்கப்பட்டது; எபேசியர் 4:4–6 இன் ஓட்டத்தில் இது இயேசுவை இயல்பாகக் குறிக்கிறது.
  alternative: பொதுவாகக் கடவுளைக் குறிக்கும் சொல்
  rationale: ஒரே ஆவி (வ. 4), ஒரே ஆண்டவர் (வ. 5), ஒரே கடவுளும் தந்தையும் (வ. 6) என்ற மும்மைச் சூழல் மகனைச் சுட்டுகிறது; இருப்பினும் மொழிபெயர்ப்பு உரையில் பெயரைச் சேர்த்து மூலத்தை விரிவாக்கவில்லை.
- issue: ‘ஒரே திருமுழுக்கு’ என்பதன் பொருள்
  choice: முறை, செயல்திறன், அல்லது சடங்கு/ஆவிக்குரிய தன்மை எதையும் குறிப்பாக வரையறுக்காமல் ‘ஒரே திருமுழுக்கு’ என்று நடுநிலையாக வைக்கப்பட்டது.
  alternative: குறிப்பாக அருள்சாதனச் சடங்கைக் குறித்தல்; அல்லது முதன்மையாக உருவகமான/ஆவிக்குரிய திருமுழுக்கைக் குறித்தல்
  rationale: இவ்வசனம் ஒருமையை உறுதிப்படுத்துகிறது; திருமுழுக்கைப் பற்றிய பிரிவுசார்ந்த விவாதங்களைத் தானாகத் தீர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான மூவகை இணைநடையையும் ‘ஒரே’ என்ற மறுமொழியின் வலியுறுத்தலையும் காத்துள்ளோம். மொழிநடை கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியத்தக்கதும் ஆகும்.
