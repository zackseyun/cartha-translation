  yaml_path: translation/nt/2_thessalonians/001/011.yaml
  text: To this end also we always pray for you[a], that our God may count you worthy of the calling and may fulfill every good resolve and work of faith with power[c][b],
translation:
  language: ta
  text: 'இதற்காகவும் நாங்கள் உங்களுக்காக எப்போதும் வேண்டிக்கொள்கிறோம்: நம் கடவுள் உங்களை அந்த அழைப்புக்குத் தகுதியானவர்களாகக் கருதவும்[a], நன்மைக்கான ஒவ்வொரு தீர்மானத்தையும்[b], விசுவாசத்தின் செயலையும்[c] வல்லமையால் நிறைவேற்றவும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அழைப்புக்குத் தகுதியானவர்களாக உங்களை ஆக்கவும்.” கிரேக்க வினைச்சொல் “தகுதியானவர்களாகக் கருதுதல்” அல்லது “தகுதியானவர்களாக்குதல்” ஆகிய இரு பொருள்களையும் தரலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “நன்மை நிறைந்த ஒவ்வொரு நோக்கத்தையும்” அல்லது “நன்மை செய்யும் ஒவ்வொரு தீர்மானத்தையும்.”
    reason: lexical_alternative
  - marker: c
    text: “விசுவாசத்தின் செயல்” என்பதை “விசுவாசத்தால் உண்டாகும் செயல்” என்றும் புரிந்துகொள்ளலாம்; இங்கு “விசுவாசம்” என்பது “விசுவாசத்தன்மை” என்றும் பொருள்படக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ καὶ
  choice: இதற்காகவும்
  rationale: முந்தைய கருத்தை நோக்கமாக எடுத்துரைக்கும் தொடர்; εἰς என்பதன் நோக்கப் பொருளையும் καὶ என்பதன் சேர்க்கைப் பொருளையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: προσευχόμεθα πάντοτε περὶ ὑμῶν
  choice: நாங்கள் உங்களுக்காக எப்போதும் வேண்டிக்கொள்கிறோம்
  rationale: தொடர்ந்து வழக்கமாகச் செய்யப்படும் வேண்டுதலை நிகழ்கால வினையும் πάντοτε என்பதும் காட்டுகின்றன; περὶ ὑμῶν இங்கு இயல்பாக ‘உங்களுக்காக’ என வருகிறது.
- source_word: ἀξιώσῃ
  choice: தகுதியுள்ளவர்களாகக் கருதுமாறும்
  rationale: வினைச்சொல்லின் ‘தகுதியுள்ளவர்களெனக் கருதுதல்’ என்ற மதிப்பீட்டுப் பொருளை முதன்மை உரையில் தருகிறது; ‘தகுதியுள்ளவர்களாக்குதல்’ என்ற சாத்தியமான பொருள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: τῆς κλήσεως
  choice: அந்த அழைப்புக்கு
  rationale: கிரேக்கத்தில் உடைமைப்பெயர் இல்லாமல் குறிப்பிட்ட அறியப்பட்ட அழைப்பு சுட்டப்படுகிறது; ‘அவருடைய’ அல்லது ‘உங்களுடைய’ என்று சேர்க்காமல் சுட்டுப்பொருள் காக்கப்படுகிறது.
- source_word: ὁ θεὸς ἡμῶν
  choice: நம் கடவுள்
  rationale: மூலத்தில் உள்ள முதல் நபர் பன்மை உடைமைத் தொடர்பைத் தெளிவாகத் தக்கவைக்கிறது.
- source_word: πληρώσῃ
  choice: நிறைவேற்றுமாறும்
  rationale: தீர்மானத்தையும் செயலையும் முழுமையாகச் சாதிக்கச் செய்வது என்ற பொருளை இயல்பான தமிழில் வழங்குகிறது.
- source_word: πᾶσαν εὐδοκίαν ἀγαθωσύνης
  choice: நன்மைக்கான ஒவ்வொரு தீர்மானத்தையும்
  rationale: εὐδοκία என்பதன் நோக்கம் அல்லது மனத்தீர்மானம் என்ற பொருளையும் ἀγαθωσύνη என்பதன் நன்மை என்ற பொருளையும் தெளிவாகவும் இயல்பாகவும் தருகிறது; வேறு சாத்தியமான தொடர்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: ἔργον πίστεως
  choice: விசுவாசத்தின் செயலையும்
  rationale: சுருக்கமான கிரேக்க உடைமைத் தொடரைத் திறந்த நிலையில் வைத்திருப்பதால், விசுவாசத்தால் உண்டாகும் செயல் அல்லது விசுவாசத்தன்மை கொண்ட செயல் என்ற நுணுக்கங்களை முதன்மை உரை முடிவு செய்துவிடவில்லை.
- source_word: ἐν δυνάμει
  choice: வல்லமையால்
  rationale: செயல் நிறைவேறுவதற்கான ஆற்றல் அல்லது வழிமுறையைச் சுருக்கமாகக் காட்டுகிறது; மூலத்தில் இல்லாத உடைமைப்பெயரைச் சேர்க்கவில்லை.
theological_decisions:
- issue: ἀξιώσῃ என்பது அழைப்புடன் கொண்டுள்ள தொடர்பு
  choice: தகுதியுள்ளவர்களாகக் கருதுமாறும்
  alternative: தகுதியுள்ளவர்களாக்குமாறும்
  rationale: கடவுள் அவர்களைத் தகுதியுள்ளவர்களென மதிப்பிடுகிறார் என்ற பொருளை முதன்மையாகக் கொண்டாலும், கடவுள் அவர்களைத் தகுதிப்படுத்துகிறார் என்ற சாத்தியத்தையும் அடிக்குறிப்பு பாதுகாக்கிறது; மூலத்தின் இறையியல் பதற்றம் தீர்த்துவைக்கப்படவில்லை.
- issue: ἔργον πίστεως என்பதில் πίστις என்பதன் பொருளும் உடைமைத் தொடர்பும்
  choice: விசுவாசத்தின் செயல்
  alternative: விசுவாசத்தால் உண்டாகும் செயல்; விசுவாசத்தன்மையின் செயல்
  rationale: πίστις என்பதற்கு முதன்மையாக ‘விசுவாசம்’ பயன்படுத்தப்பட்டு, அது செயலை உருவாக்குகிறதா அல்லது விசுவாசத்தன்மையைக் குறிக்கிறதா என்பது அடிக்குறிப்பில் திறந்துவைக்கப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதையும் செறிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘வேண்டிக்கொள்கிறோம்’ என்ற தொடக்கம் மற்றும் முடிவு தமிழில் நீளமாக இருந்தாலும், ἵνα அறிமுகப்படுத்தும் வேண்டுதலின் உள்ளடக்கத்தையும் இணையான இரண்டு வினைகளையும் தெளிவாகக் காட்டுவதற்காகத் தக்கவைக்கப்பட்டுள்ளது.
