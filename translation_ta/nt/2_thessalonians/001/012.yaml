  to: நம்முடைய ஆண்டவராகிய இயேசுவின் பெயர் உங்களில்[a] மகிமைப்படும்படியாகவும், நீங்கள் அவரில் மகிமைப்படும்படியாகவும், நம்முடைய கடவுள் மற்றும் ஆண்டவர் இயேசு மெசியாவின் அருளின்படியும்.
  rationale: Removed the unsupported “இப்படிச் செய்கிறோம்,” retained the dependent purpose-clause force of ὅπως, and adjusted the final coordinated phrase and footnote so that the disputed relationship of “God” and “Lord Jesus Messiah” is not settled by translation.
