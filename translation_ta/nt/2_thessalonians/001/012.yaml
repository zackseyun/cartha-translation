  text: ὅπως ἐνδοξασθῇ τὸ ὄνομα τοῦ κυρίου ἡμῶν Ἰησοῦ ἐν ὑμῖν, καὶ ὑμεῖς ἐν αὐτῷ, κατὰ τὴν χάριν τοῦ θεοῦ ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/012.yaml
  text: so that the name of our Lord Jesus may be glorified in you[a], and you in him[c][b], according to the grace of our God and the Lord Jesus the Messiah.
translation:
  language: ta
  text: நம்முடைய ஆண்டவராகிய இயேசுவின் பெயர் உங்களில்[a] மகிமைப்படும்படியாகவும், நீங்கள் அவரில் மகிமைப்படும்படியாகவும், நம்முடைய கடவுள் மற்றும் ஆண்டவர் இயேசு மெசியாவின் அருளின்படியும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உங்களில்’ என்பதை ‘உங்கள் நடுவில்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்க முன்னிடைச்சொல் சூழலில் இரு நுணுக்கங்களையும் தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: மகிமைப்படும்படிக்கும்
  rationale: முந்தைய வசனத்தின் ஜெபத்திலிருந்து வரும் நோக்கம் அல்லது விளைவைத் தெரிவிக்கிறது. வசனம் தனியாக வழங்கப்பட்டாலும் தொடர்ச்சியை உணர்த்தும் வகையில் இறுதியில் ‘இப்படிச் செய்கிறோம்’ சேர்க்கப்பட்டது.
- source_word: ἐνδοξασθῇ
  choice: மகிமைப்படும்படிக்கும்
  rationale: இறந்தகாலச் செயப்படுபொருள் நோக்குநிலை வினையின் விரும்பப்படும் விளைவையும் செயப்பாட்டு வடிவத்தையும் காக்கிறது.
- source_word: τὸ ὄνομα
  choice: பெயர்
  rationale: ஒருவரின் வெளிப்படுத்தப்பட்ட அடையாளத்தையும் புகழையும் குறிக்கக்கூடிய வேதாகம உருவகப் பயன்பாட்டை விரித்துரைக்காமல் மூலச் சொல்லை நேரடியாகக் காக்கிறது.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: நம்முடைய ஆண்டவராகிய இயேசுவின்
  rationale: தமிழில் இயல்பான உடைமைத் தொடராகவும் κύριος என்பதன் பட்டப்பெயர் மதிப்பைத் தெளிவாகவும் வழங்குகிறது.
- source_word: ἐν ὑμῖν
  choice: உங்களில்
  rationale: ἐν என்பதன் ‘உங்களுக்குள்’ மற்றும் ‘உங்கள் நடுவில்’ ஆகிய இரு சாத்திய நுணுக்கங்களையும் ஓரளவு திறந்துவைக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: καὶ ὑμεῖς ἐν αὐτῷ
  choice: நீங்கள் அவரில் மகிமைப்படும்படிக்கும்
  rationale: இணையான அமைப்பில் விடுபட்டுள்ள ‘மகிமைப்படுதல்’ வினையைத் தமிழில் தெளிவுக்காக நிரப்புகிறது; αὐτῷ ஆண்பால் ஒருமை என்பதால் ஆண்டவர் இயேசுவைக் குறிக்கும் ‘அவரில்’ என வழங்கப்படுகிறது.
- source_word: κατὰ τὴν χάριν
  choice: அருளின்படி
  rationale: κατά + வேற்றுமை வடிவம் தரும் அளவுகோல் அல்லது அடிப்படை சார்ந்த பொருளை, வெறும் கருவிப்பொருளாகக் குறுக்காமல் காக்கிறது.
- source_word: χάριν
  choice: அருள்
  rationale: பவுலின் பயன்பாட்டில் χάρις என்பதற்கான நிலைபெற்ற, இயல்பான தமிழ் இறையியல் சொல்.
- source_word: τοῦ θεοῦ ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ
  choice: நம்முடைய கடவுளும் ஆண்டவருமாகிய இயேசு மெசியாவின்
  rationale: ஒரே பெயர்ச்சுட்டியால் நெருக்கமாக இணைக்கப்பட்ட கிரேக்கத் தொடரைத் தமிழில் இயல்பாகக் காத்து, இயேசுவை ‘கடவுளும் ஆண்டவரும்’ என வாசிக்கும் முதன்மை இலக்கண வாய்ப்பை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு Χριστός பட்டமாகச் செயல்படுவதால் அதன் பொருளை வெளிப்படுத்தும் ‘மெசியா’ பயன்படுத்தப்பட்டது; தமிழில் ‘கிறிஸ்து’ என்பதும் மரபான மாற்று.
- issue: αὐτῷ என்பதன் சுட்டுப்பொருள்
  choice: அவரில்—ஆண்டவர் இயேசுவில்
  alternative: அதில்—பெயரில்
  rationale: ஆண்பால் ஒருமைச் சுட்டுப்பெயரும் பரஸ்பர மகிமைப்படுத்தலின் இணை அமைப்பும் ஆண்டவர் இயேசுவையே வலுவாகச் சுட்டுகின்றன.
- issue: இறுதி உடைமைத் தொடரின் பொருள்
  choice: ஒரே நபரை நெருக்கமாகக் குறிக்கும் ‘நம்முடைய கடவுளும் ஆண்டவருமாகிய இயேசு மெசியா’
  alternative: ‘நம்முடைய கடவுள்’ மற்றும் ‘ஆண்டவர் இயேசு மெசியா’ என்ற இரு தனித்த சுட்டுப்பொருள்கள்
  rationale: θεοῦ முன் உள்ள ஒரே உருபும் καί மூலம் κυρίου Ἰησοῦ Χριστοῦ இணைக்கப்படுவதும் ஒரே சுட்டுப்பொருள் வாசிப்பை இயல்பாக்குகின்றன. ஆயினும் இரு சுட்டுப்பொருள் வாசிப்பு வரலாற்றில் காணப்படுவதால் அடிக்குறிப்பில் பதிவு செய்யப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. ‘ஆண்டவர்’, ‘அருள்’, ‘மகிமைப்படுதல்’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் காக்கப்பட்டுள்ளன. வசனம் முந்தைய ஜெபத்துடன் இலக்கணமாக இணைந்திருப்பதைத் தமிழில் முழுமையான வாக்கியமாக்க இறுதியில் ‘இப்படிச் செய்கிறோம்’ என சூழல்சார் நிரப்பு சேர்க்கப்பட்டுள்ளது.
