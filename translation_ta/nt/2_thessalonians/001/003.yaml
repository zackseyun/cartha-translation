  edition: SBLGNT
  text: Εὐχαριστεῖν ὀφείλομεν τῷ θεῷ πάντοτε περὶ ὑμῶν, ἀδελφοί, καθὼς ἄξιόν ἐστιν, ὅτι ὑπεραυξάνει ἡ πίστις ὑμῶν καὶ πλεονάζει ἡ ἀγάπη ἑνὸς ἑκάστου πάντων ὑμῶν εἰς ἀλλήλους,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/003.yaml
  text: We ought always to give thanks to God for you[a], brothers, as is fitting, because your faith is growing abundantly and the love of each and every one of you for one another is increasing[c][b],
translation:
  language: ta
  text: நாங்கள் எப்போதும் உங்களுக்காகக் கடவுளுக்கு நன்றி செலுத்தக் கடமைப்பட்டிருக்கிறோம், சகோதரர்களே[a]; அவ்வாறு செய்வது தகுந்ததே. ஏனெனில், உங்கள் விசுவாசம்[b] மிகுதியாக வளர்கிறது; உங்கள் அனைவரில் ஒவ்வொருவருக்கும் மற்றவர்கள்மேல் உள்ள அன்பு பெருகுகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சகோதர சகோதரிகளே”; “சகோதரர்கள்” எனும் கிரேக்கச் சொல் விசுவாசிகளான ஆண்களும் பெண்களும் அடங்கிய முழுச் சமூகத்தையும் அழைக்கப் பயன்படுத்தப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “விசுவாசம்” என்பதற்கான கிரேக்கச் சொல் சில சூழல்களில் “நம்பிக்கை” அல்லது “நம்பகத்தன்மை” என்றும் பொருள்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐχαριστεῖν ὀφείλομεν
  choice: நன்றி செலுத்த நாங்கள் கடமைப்பட்டிருக்கிறோம்
  rationale: கிரேக்க வாக்கியத்தில் நன்றி செலுத்துவது ஒரு தார்மிகக் கடமை அல்லது பொறுப்பு எனக் கூறப்படுகிறது. ‘கடமைப்பட்டிருக்கிறோம்’ என்பது அந்த வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: πάντοτε περὶ ὑμῶν
  choice: உங்களுக்காக எப்போதும்
  rationale: நன்றி செலுத்தும் சூழலில் περί என்பது ‘உங்களைக் குறித்து’ என்பதைவிட இயல்பாக ‘உங்களுக்காக’ என வருகிறது; πάντοτε என்பதன் காலத் தொடர்ச்சியை ‘எப்போதும்’ காக்கிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: மூலத்தில் உள்ள ஆண்பால் பன்மை அழைப்பை நேரடியாகக் காக்கிறது; அது முழு விசுவாசக் குழுவையும் உள்ளடக்கக்கூடும் என்பது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: καθὼς ἄξιόν ἐστιν
  choice: அவ்வாறு செய்வது தகுந்ததே
  rationale: நன்றி செலுத்துவது பொருத்தமானது என்ற கருத்தை நவீன, தெளிவான தமிழில் கூறுகிறது; ‘தகுதியானது’ எனும் செயற்கையான சொல்லாட்சியைத் தவிர்க்கிறது.
- source_word: ὑπεραυξάνει ἡ πίστις ὑμῶν
  choice: உங்கள் விசுவாசம் மிகுதியாக வளர்கிறது
  rationale: ὑπεραυξάνει என்ற தீவிரப்படுத்தப்பட்ட வளர்ச்சிப் பொருளை ‘மிகுதியாக வளர்கிறது’ காக்கிறது; πίστις என்பதற்கு இச்சூழலில் வழக்கமான ‘விசுவாசம்’ பயன்படுத்தப்படுகிறது.
- source_word: πλεονάζει ἡ ἀγάπη
  choice: அன்பும் பெருகுகிறது
  rationale: πλεονάζει என்பது அளவில் அதிகரித்தல் அல்லது மிகுதல் என்பதைக் குறிக்கிறது; ‘பெருகுகிறது’ இயல்பாகவும் சுருக்கமாகவும் அதைக் காட்டுகிறது.
- source_word: ἑνὸς ἑκάστου πάντων ὑμῶν εἰς ἀλλήλους
  choice: நீங்கள் ஒவ்வொருவரும் ஒருவர்மீது ஒருவர் கொண்டிருக்கும்
  rationale: மூலத்தின் வலியுறுத்தலான பகிர்ந்தளிக்கும் கருத்தையும் பரஸ்பரத் தன்மையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: πίστις என்பதன் பொருள்
  choice: விசுவாசம்
  alternative: நம்பகத்தன்மை / உண்மைத்தன்மை
  rationale: இச்சூழலில் தெசலோனிக்கேயரின் வளர்ந்துவரும் விசுவாசமே முதன்மையான பொருள். இருப்பினும் πίστις சில சூழல்களில் நம்பகத்தன்மையையும் குறிக்கலாம்; அந்த வாய்ப்பை அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: ἀδελφοί என்ற அழைப்பின் உள்ளடக்கம்
  choice: சகோதரர்களே
  alternative: சகோதர சகோதரிகளே
  rationale: மூலத்தின் இலக்கண ஆண்பால் பன்மையை முதன்மை உரை காக்கிறது. அந்த அழைப்பு முழுச் சபையையும், பெண்கள் உட்பட, குறிக்கக்கூடும் என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான சபைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் நன்றியுணர்வு, கடமை, விசுவாசத்தின் தீவிர வளர்ச்சி, ஒவ்வொருவரின் பரஸ்பர அன்பு ஆகியவை காக்கப்பட்டுள்ளன.
