  text: οἵτινες δίκην τίσουσιν ὄλεθρον αἰώνιον ἀπὸ προσώπου τοῦ κυρίου καὶ ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/009.yaml
  text: These will pay the penalty of eternal destruction[a], away from the presence of the Lord and from the glory of his might,
translation:
  language: ta
  text: இவர்கள் ஆண்டவரின் முன்னிலையிலிருந்தும் அவருடைய வல்லமையின் மகிமையிலிருந்தும் விலக்கப்பட்டு, நித்திய அழிவாகிய தண்டனையை அனுபவிப்பார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்டவரின் முன்னிலையிலிருந்தும் அவருடைய வல்லமையின் மகிமையிலிருந்தும் வரும் நித்திய அழிவாகிய தண்டனை.” கிரேக்க முன்னிடைச்சொல் பிரிவைக் குறிக்கலாம் (“…இலிருந்து விலக்கப்பட்டு”); அல்லது மூலத்தைக் குறிக்கலாம் (“…இலிருந்து வரும்”).
    reason: alternative_reading
lexical_decisions:
- source_word: οἵτινες
  choice: இவர்கள்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்டவர்களை மீண்டும் சுட்டுகிறது. தமிழில் இயல்பான சுட்டுப்பெயராகவும் கிரேக்கச் சொல்லின் தொடர்பை மிகைப்படுத்தாமலும் உள்ளது.
- source_word: δίκην τίσουσιν
  choice: தண்டனைக்கு உள்ளாவார்கள்
  rationale: நீதித்தீர்ப்பின் விளைவாகத் தண்டனையை ஏற்க வேண்டியிருப்பதைக் குறிக்கும் கிரேக்கச் சொற்றொடரின் சட்டவியல் நுணுக்கத்தை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ὄλεθρον αἰώνιον
  choice: நித்திய அழிவாகிய
  rationale: தீர்ப்பின் கடுமையையும் நீடித்த இறுதித்தன்மையையும் காக்கிறது; அந்த அழிவின் துல்லியமான இயல்பைப் பற்றிய ஒரு குறிப்பிட்ட கோட்பாட்டை மொழிபெயர்ப்புக்குள் சேர்க்கவில்லை.
- source_word: ἀπὸ προσώπου τοῦ κυρίου
  choice: ஆண்டவரின் முன்னிலையிலிருந்தும் விலக்கப்படுவார்கள்
  rationale: πρόσωπον என்பதன் இச்சூழலுக்குரிய பொருளை ‘முன்னிலை’ என இயல்பாகத் தருகிறது. ἀπό என்பதை முதன்மை வாசிப்பில் பிரிவு அல்லது விலக்கப்படுதல் எனப் புரிந்துகொள்கிறது.
- source_word: ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ
  choice: அவருடைய வல்லமையின் மகிமையிலிருந்தும்
  rationale: δόξα என்பதற்கு ‘மகிமை’, ἰσχύς என்பதற்கு ‘வல்லமை’ என்று வழங்கி, மூலத்தின் பெயர்ச்சொல் தொடர்பையும் உயர்ந்த ஆனால் புரியக்கூடிய நடையையும் காக்கிறது.
theological_decisions:
- issue: இறுதித் தீர்ப்பை விவரிக்கும் ἀπό என்பதன் பொருள்
  choice: ஆண்டவரின் முன்னிலையிலிருந்து பிரித்தல் அல்லது விலக்குதல்
  alternative: ஆண்டவரின் முன்னிலையிலிருந்தும் அவருடைய வல்லமையின் மகிமையிலிருந்தும் வரும் அழிவு
  rationale: ἀπό பிரிவையும் மூலத்தையும் குறிக்கக்கூடும். சூழலில் பிரிவு என்ற வாசிப்பு வலுவானதும் தமிழில் இயல்பானதும் ஆகும்; ஆயினும் இலக்கண ரீதியாகச் சாத்தியமான மூலப் பொருளை அடிக்குறிப்பில் காக்கிறது.
- issue: ‘நித்திய அழிவு’ என்பதன் கோட்பாட்டு உட்பொருள்
  choice: அழிவின் துல்லியமான தன்மையை விளக்காமல் மூலச் சொற்றொடரைத் தக்கவைத்தல்
  alternative: முழுமையான இல்லாமை எனவோ முடிவில்லாத உணர்வுள்ள தண்டனை எனவோ குறிப்பாக விளக்குதல்
  rationale: இவ்வசனத்தின் சொற்றொடர் தண்டனையை அறிவிக்கிறது; ஆனால் இறுதித் தண்டனையின் துல்லியமான இயல்பைப் பற்றிய பரந்த கோட்பாட்டு விவாதத்தைத் தனியே தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க வேதாகம நடையுடனும் வடிவமைக்கப்பட்டது. ‘முன்னிலை’, ‘வல்லமை’, ‘மகிமை’ ஆகியவை பொதுவாகப் புரியக்கூடியவையாக இருந்து மூலத்தின் கருத்துச் செறிவையும் காக்கின்றன.
