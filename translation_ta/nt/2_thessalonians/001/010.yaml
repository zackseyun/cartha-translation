id: 2TH.1.10
reference: 2 Thessalonians 1:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅταν ἔλθῃ ἐνδοξασθῆναι ἐν τοῖς ἁγίοις αὐτοῦ καὶ θαυμασθῆναι ἐν πᾶσιν τοῖς πιστεύσασιν, ὅτι ἐπιστεύθη τὸ μαρτύριον ἡμῶν ἐφ’ ὑμᾶς, ἐν τῇ ἡμέρᾳ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/010.yaml
  text: on that day when he comes to be glorified among his saints and to be marveled at among all who have believed[b][a], because our testimony to you was believed.
translation:
  language: ta
  text: அந்த நாளில், அவர் தம்முடைய பரிசுத்த மக்களிடையே மகிமைப்படுத்தப்படவும், விசுவாசித்த அனைவரிடையே வியந்து போற்றப்படவும் வருவார்[a]; ஏனெனில், உங்களிடம் நாங்கள் அளித்த சாட்சி நம்பப்பட்டது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தம்முடைய பரிசுத்த மக்களில் மகிமைப்படுத்தப்படவும், விசுவாசித்த அனைவரிலும் வியந்து போற்றப்படவும்.” கிரேக்க முன்னிடைச்சொல் அவர் தம் மக்களிடையே மகிமைப்படுத்தப்படுகிறார் என்றோ, அவருடைய மகிமை அவர்களில் வெளிப்படுகிறது என்றோ பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'மூலத்தின் சொல் வரிசையை நெருக்கமாகப் பின்பற்றினால்: “அவர் தம்முடைய பரிசுத்த மக்களிடையே மகிமைப்படுத்தப்படவும், விசுவாசித்த அனைவரிடையே வியந்து போற்றப்படவும் வரும்போது—ஏனெனில், உங்களிடம் நாங்கள் அளித்த சாட்சி நம்பப்பட்டது—அந்த நாளில்.”'
    reason: word_order_alternative
lexical_decisions:
- source_word: ὅταν ἔλθῃ
  choice: அவர் ... வருவார்
  rationale: ὅταν உடன் வரும் இறந்தகாலத் துணைவினை வடிவம் இங்கு உறுதியான எதிர்கால நிகழ்வைக் குறிக்கிறது; தமிழில் இயல்பான எதிர்கால வினை வடிவம் அந்தப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: ἐνδοξασθῆναι
  choice: மகிமைப்படுத்தப்படவும்
  rationale: செயப்பாட்டு வினையெச்சம் கிறிஸ்துவின் வருகையின் நோக்கம் அல்லது விளைவைக் காட்டுகிறது; ‘மகிமைப்படுத்தப்பட’ என்பது தெய்வீக மகிமை சார்ந்த வலிமையைத் தக்கவைக்கிறது.
- source_word: ἐν τοῖς ἁγίοις αὐτοῦ
  choice: தம்முடைய பரிசுத்த மக்களிடையே
  rationale: ἐν இங்கு ‘உள்ளே’ அல்லது ‘இடையே’ எனப் பொருள்படலாம். முதன்மை உரையில் இயல்பான குழுமப் பொருளுக்காக ‘இடையே’ பயன்படுத்தப்படுகிறது; ‘பரிசுத்த மக்கள்’ என்பது சாதாரண வாசகருக்கு தெளிவாக ἅγιοι என்பதைக் குறிக்கிறது.
- source_word: θαυμασθῆναι
  choice: வியந்து போற்றப்படவும்
  rationale: வியப்பும் உயர்ந்த மதிப்பும் கலந்த எதிர்வினையை இந்தச் சொற்றொடர் வெளிப்படுத்துகிறது; வெறும் ‘பாராட்டப்பட’ என்பதைவிட மூலச்சொல்லின் வலிமையை நன்றாகக் காக்கிறது.
- source_word: ἐν πᾶσιν τοῖς πιστεύσασιν
  choice: விசுவாசித்த அனைவரிடையே
  rationale: பெயர்ச்சொல் வடிவமான ‘விசுவாசிகள்’ என்பதற்குப் பதிலாக, மூலத்தின் வினைத் தன்மையையும் நிகழ்ந்த நம்புதலையும் தக்கவைக்கிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: தெசலோனிக்கேயர்கள் விசுவாசித்தவர்களுள் அடங்குவதற்கான காரணத்தை இங்கு ὅτι அறிமுகப்படுத்துகிறது.
- source_word: ἐπιστεύθη
  choice: நம்பப்பட்டது
  rationale: τὸ μαρτύριον எழுவாயாக உள்ள செயப்பாட்டு வடிவத்தை நேரடியாகத் தருகிறது; ‘விசுவாசித்த’ என்பதுடன் ஒரே தமிழ்ச் சொல்லை மீண்டும் பயன்படுத்துவதால் ஏற்படும் செயற்கைத்தன்மையையும் தவிர்க்கிறது.
- source_word: τὸ μαρτύριον ἡμῶν
  choice: நாங்கள் அளித்த சாட்சி
  rationale: அப்போஸ்தலரின் அறிவிப்பும் சாட்சியமும் குறிக்கப்படுகிறது; தமிழில் இயல்பாகவும் திசையைக் காட்டும் அடுத்த தொடருடன் தெளிவாகவும் அமைகிறது.
- source_word: ἐφ’ ὑμᾶς
  choice: உங்களிடம்
  rationale: சாட்சி தெசலோனிக்கேயரிடம் சென்றடைந்து அவர்களால் நம்பப்பட்டது என்ற திசைப் பொருளை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: அந்த நாளில்
  rationale: இறுதிக்காலச் சூழலுக்குரிய வழக்கமான காலக் குறிப்பைத் தக்கவைக்கிறது; தமிழின் இயல்புக்காக வாக்கியத்தின் தொடக்கத்தில் வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘தம்முடைய பரிசுத்த மக்கள்’ என்பதன் குறிப்பு மற்றும் ἐν என்பதன் நுட்பம்
  choice: கிறிஸ்துவுக்குரிய பரிசுத்த மக்களைக் குறிக்கும் வகையில் ‘தம்முடைய பரிசுத்த மக்களிடையே’
  alternative: ‘தம்முடைய பரிசுத்த மக்களில்’—அவருடைய மகிமை அவர்களில் வெளிப்படுகிறது என்ற நுட்பத்துடன்
  rationale: அடுத்துள்ள ‘விசுவாசித்த அனைவரும்’ என்ற இணைத் தொடர் விசுவாசிகளையே முதன்மையாகச் சுட்டுகிறது. ஆயினும் ἐν என்பது ‘இடையே’ மட்டுமல்லாமல் ‘அவர்களில்’ என்றும் பொருள்படக்கூடியதால் அந்த உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: πιστεύσασιν மற்றும் ἐπιστεύθη ஆகியவற்றின் பொருள்
  choice: அப்போஸ்தல சாட்சியை நம்பியதைச் சாதாரண விசுவாச மொழியில் மொழிபெயர்த்தல்
  alternative: தனிப்பட்ட சார்ந்திருத்தலை வலியுறுத்தும் ‘நம்பிக்கை வைத்தவர்கள்’
  rationale: இந்தச் சூழலில் தனிப்பட்ட கோட்பாட்டு விளக்கத்தைச் சேர்க்கத் தேவையில்லை; மூலத்தின் நம்புதல் சார்ந்த மொழி நேரடியாகப் பாதுகாக்கப்படுகிறது.
- issue: ἐν τῇ ἡμέρᾳ ἐκείνῃ தொடரின் இணைப்பு
  choice: தமிழின் இயல்புக்காக ‘அந்த நாளில்’ என்பதை வாக்கியத்தின் தொடக்கத்தில் வைத்து முழு வருகை நிகழ்வையும் காலவரையறை செய்தல்
  alternative: மூலச் சொல் வரிசையைப் பின்பற்றி வாக்கியத்தின் இறுதியில் ‘அந்த நாளில்’ என வைத்தல்
  rationale: கிரேக்கத்தில் இறுதியில் வரும் காலத்தொடர் வருகை மற்றும் அதனுடன் சேர்ந்த மகிமைப்படுத்தல், வியந்து போற்றுதல் அனைத்தையும் சூழ்கிறது. தொடக்க இடமாற்றம் பொருளை மாற்றாமல் வாசிப்பைத் தெளிவாக்குகிறது; மாற்று அமைப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; மரியாதையும் இறையியல் செறிவும் கொண்டிருந்தாலும் பொதுவாசகருக்குத் தெளிவான நடை. ‘பரிசுத்தவான்கள்’ என்பதற்குப் பதிலாக இயல்பான ‘பரிசுத்த மக்கள்’ பயன்படுத்தப்பட்டுள்ளது. ‘வியந்து போற்றப்பட’ என்பது θαυμασθῆναι-இன் வியப்பும் மதிப்பும் சேர்ந்த வலிமையை வெளிப்படுத்துகிறது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
