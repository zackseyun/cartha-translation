  source_fidelity: மூலக் கிரேக்கத்தின் காலத் தொடர்பு, இரு இணையான செயப்பாட்டு infinitive-கள், ἐν-தொடர்களின் ‘இடையே/அவர்களில்’ நுட்பம், மற்றும் ὅτι-யின் காரணத் தொடர்பு ஆகியவை நன்றாகப் பாதுகாக்கப்பட்டுள்ளன. ‘உங்களிடம் நாங்கள் அளித்த சாட்சி நம்பப்பட்டது’ என்பது ἐπιστεύθη τὸ μαρτύριον ἡμῶν ἐφ’ ὑμᾶς என்பதற்குச் சூழலுக்கு ஏற்ற, நேரடியான மொழிபெயர்ப்பு.
