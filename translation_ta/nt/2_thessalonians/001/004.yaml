lexical_decisions:
- source_word: ὥστε
  choice: அதனால்
  rationale: முந்தைய கூற்றின் விளைவை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: αὐτοὺς ἡμᾶς
  choice: நாங்களே
  rationale: பவுலையும் அவருடைய உடன் ஊழியர்களையும் வலியுறுத்தும் கிரேக்கச் சொல்லமைப்பைப் பாதுகாக்கிறது.
- source_word: ἐν ὑμῖν ... ἐγκαυχᾶσθαι
  choice: உங்களைப் பற்றிப் பெருமையாகப் பேசுகிறோம்
  rationale: இங்கு ἐν என்பது பெருமைப்படுதலின் பொருளைக் குறிக்கிறது; வினையின் வலிமையைத் தணிக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: ἐν ταῖς ἐκκλησίαις τοῦ θεοῦ
  choice: கடவுளின் திருச்சபைகளிடையே
  rationale: பெருமையாகப் பேசுதல் நடைபெறும் சமூகச் சூழலையும், பன்மையையும் பாதுகாக்கிறது.
- source_word: ὑπὲρ
  choice: குறித்து
  rationale: அவர்களைக் குறித்த பெருமைப் பேச்சின் குறிப்பிட்ட அடிப்படையை இயல்பாக இணைக்கிறது.
- source_word: ὑπομονῆς
  choice: விடாமுயற்சி
  rationale: அழுத்தத்தின் மத்தியில் தொடர்ந்து நிலைத்திருக்கும் பொறுமையையும் உறுதியையும் பொதுவாசகருக்குப் புரியும் வகையில் தெரிவிக்கிறது.
- source_word: πίστεως
  choice: விசுவாசம்
  rationale: πίστις என்பதன் வழக்கமான இறையியல் பொருளைப் பாதுகாக்கிறது; இச்சூழலில் சாத்தியமான ‘உண்மைத்தன்மை’ என்ற பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: διωγμοῖς
  choice: துன்புறுத்தல்கள்
  rationale: நம்பிக்கையின் காரணமாக வரும் பகைமையான ஒடுக்குதலைத் தெளிவாகக் குறிக்கிறது.
- source_word: θλίψεσιν
  choice: உபத்திரவங்கள்
  rationale: வெளிப்புற அழுத்தங்கள் மற்றும் கடும் இன்னல்களைக் குறிக்கும் சொல்லின் கனத்தைப் பாதுகாக்கிறது; துன்புறுத்தல்களிலிருந்து வேறுபாட்டையும் வைத்திருக்கிறது.
- source_word: αἷς ἀνέχεσθε
  choice: நீங்கள் சகித்துவரும்
  rationale: நிகழ்காலத்தில் தொடர்ந்து அனுபவித்து தாங்கிக்கொண்டிருப்பதைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
theological_decisions:
- issue: துன்பத்தின் சூழலில் πίστις என்பது ‘விசுவாசம்’ அல்லது ‘உண்மைத்தன்மை’ என இருவகையில் புரியக்கூடியது
  choice: விசுவாசம்
  alternative: உண்மைத்தன்மை
  rationale: முதன்மை உரையில் சொல்லின் வழக்கமான பொருளான ‘விசுவாசம்’ வைக்கப்பட்டுள்ளது; துன்பத்தில் உறுதியாக நிலைத்திருப்பது என்ற சூழலால் எழும் ‘உண்மைத்தன்மை’ என்னும் நியாயமான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமானதாயும் பொதுவாசகருக்கு எளிதில் புரியத்தக்கதாயும் அமைந்த நடை. ‘நாங்களே’ என்ற வலியுறுத்தலும், துன்புறுத்தல்/உபத்திரவம் என்ற சொற்பொருள் வேறுபாடும் பாதுகாக்கப்பட்டுள்ளன.
