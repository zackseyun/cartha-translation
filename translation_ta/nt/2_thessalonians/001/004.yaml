    text: அல்லது, “உண்மைத்தன்மை”; πίστις என்ற கிரேக்கச் சொல், குறிப்பாகத் துன்பத்தின் சூழலில், விசுவாசத்தையோ உறுதியான உண்மைத்தன்மையையோ குறிக்கலாம்.
