  text: எனவே, நீங்கள் சகித்துவரும் எல்லாத் துன்புறுத்தல்களிலும் இன்னல்களிலும் வெளிப்படும் உங்கள் விடாமுயற்சியையும் விசுவாசத்தையும்[a] குறித்து, கடவுளின் சபைகளில் நாங்களே உங்களைப் பெருமைபாராட்டுகிறோம்.
  philosophy: optimal-equivalence
