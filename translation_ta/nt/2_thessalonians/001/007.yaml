  text: καὶ ὑμῖν τοῖς θλιβομένοις ἄνεσιν μεθ’ ἡμῶν ἐν τῇ ἀποκαλύψει τοῦ κυρίου Ἰησοῦ ἀπ’ οὐρανοῦ μετ’ ἀγγέλων δυνάμεως αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/007.yaml
  text: and to you who are being afflicted[a], relief with us at the revelation of the Lord Jesus from heaven with his mighty angels.
translation:
  language: ta
  text: துன்புறுத்தப்படுகிற உங்களுக்கோ, வானத்திலிருந்து தமது வல்லமையின் தூதர்களோடு[a] ஆண்டவராகிய இயேசு வெளிப்படும்போது, எங்களோடுகூட நிவாரணம் அளிப்பதும் நீதியானதே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் இயல்பாக, “தமது வல்லமையுள்ள தூதர்களோடு.”
    reason: ἀγγέλων δυνάμεως αὐτοῦ என்ற தொடரை பண்புப்பொருளில் புரிந்துகொள்ளும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: θλιβομένοις
  choice: ஒடுக்கப்படுகிற
  rationale: நிகழ்காலச் செயப்பாட்டு வினையெச்சம், அவர்கள் இப்போது பிறரால் நெருக்கடிக்கும் துன்புறுத்தலுக்கும் உள்ளாக்கப்படுவதைச் சுட்டுகிறது. ‘ஒடுக்கப்படுகிற’ என்பது அந்தச் செயப்பாட்டு நுணுக்கத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: ἄνεσιν
  choice: நிவாரணம்
  rationale: அழுத்தம் அல்லது துன்பத்திலிருந்து விடுதலை, தளர்வு என்ற பொருளைத் தருகிறது. ‘நிவாரணம்’ என்பது வெறும் உள்ளார்ந்த இளைப்பாறுதலைவிட, தற்போதைய ஒடுக்குதலிலிருந்து கிடைக்கும் விடுவிப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: μεθ’ ἡμῶν
  choice: எங்களோடுகூட
  rationale: பவுலும் அவருடைய உடன் ஊழியர்களும் அதே நிவாரணத்தில் பங்குபெறுவார்கள் என்ற இணைப்பை நேரடியாகக் காக்கிறது.
- source_word: ἐν τῇ ἀποκαλύψει
  choice: வெளிப்படும்போது
  rationale: இங்கு ἐν நிகழ்வின் காலத்தைக் குறிக்கிறது. பெயர்ச்சொல் அமைப்பைத் தமிழில் வினைமயமாக்குவது இயல்பாகவும், நிவாரணம் எப்போது கிடைக்கும் என்பதையும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: ἀπ’ οὐρανοῦ
  choice: வானத்திலிருந்து
  rationale: ἀπό குறிக்கும் தோற்ற இடத்தை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: μετ’ ἀγγέλων δυνάμεως αὐτοῦ
  choice: தமது வல்லமையின் தூதர்களோடு
  rationale: ‘அவருடைய வல்லமையின் தூதர்கள்’ என்ற கிரேக்க மரபுத்தொடரின் அமைப்பையும் அதன் சுருக்கமான பொருள் நுணுக்கத்தையும் காக்கிறது; ‘வல்லமையுள்ள தூதர்கள்’ என்ற பண்புப்பொருள் வாசிப்பை அடிக்குறிப்பில் தருகிறது.
theological_decisions:
- issue: ἀγγέλων δυνάμεως αὐτοῦ என்ற பிறப்புவேற்றுமைத் தொடரின் பொருள்
  choice: தமது வல்லமையின் தூதர்களோடு
  alternative: தமது வல்லமையுள்ள தூதர்களோடு
  rationale: இத்தொடரைத் தூதர்கள் ஆண்டவருடைய வல்லமையுடன் தொடர்புடையவர்கள் என்று கொள்ளலாம்; அல்லது அவர்களை ‘வல்லமையுள்ள தூதர்கள்’ என்று பண்புப்பொருளில் கொள்ளலாம். மூலத்தின் இறுக்கமான அமைப்பை முதன்மை உரை காக்கிறது; இயல்பான மற்றொரு வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἐν τῇ ἀποκαλύψει என்பதன் காலப்பொருள்
  choice: ஆண்டவராகிய இயேசு வெளிப்படும்போது
  alternative: ஆண்டவராகிய இயேசுவின் வெளிப்பாட்டின்போது
  rationale: இயேசுவின் இறுதிக்கால வெளிப்பாட்டோடு நிவாரணம் காலரீதியாக இணைக்கப்படுகிறது. தமிழில் வினைமயமான வடிவம் பொருளை மாற்றாமல் இயல்பான தொடரைத் தருகிறது.
- issue: முந்தைய வசனத்திலிருந்து தொடரும் வாக்கிய அமைப்பு
  choice: நிவாரணம் அளிப்பதும் நீதியானதே
  alternative: நிவாரணம்
  rationale: கிரேக்கத்தில் இவ்வசனம் 6ஆம் வசனத்தின் ‘நீதியானதே’ மற்றும் கைம்மாறு அளித்தல் என்ற கருத்தைத் தொடர்ந்து வருகிறது. தனியாக வாசிக்கத்தக்க தமிழுக்காக அந்தத் தொடர்ச்சி வெளிப்படையாக நிறைவு செய்யப்பட்டுள்ளது; புதிய இறையியல் கருத்து சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியத்தக்க நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் முந்தைய வாக்கியத்தைத் தொடர்வதால், தமிழில் இலக்கண நிறைவுக்காக ‘அளிப்பதும் நீதியானதே’ என முந்தைய வசனத்தின் கருத்து வெளிப்படுத்தப்பட்டுள்ளது. ‘தமது’ என்பது ஆண்டவராகிய இயேசுவைத் தெளிவாகச் சுட்டுகிறது.
