  yaml_path: translation/nt/2_thessalonians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: ta
  text: தந்தையாகிய கடவுளிடமிருந்தும் ஆண்டவராகிய இயேசு மேசியாவிடமிருந்தும் உங்களுக்கு அருளும் சமாதானமும் உண்டாவதாக.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இயேசு கிறிஸ்து.” கிரேக்கச் சொல்லான Χριστός என்பதை “கிறிஸ்து” என்றும் “மேசியா” என்றும் மொழிபெயர்க்கலாம்; இங்கு “மேசியா” என்பது அந்தப் பட்டப்பெயரின் பொருளை வெளிப்படுத்துகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: அருள்
  rationale: பவுலின் வாழ்த்துகளில் இது வாழ்த்துச் சொல்லாகவும் இறையியல் நிறைந்த சொல்லாகவும் உள்ளது; ‘அருள்’ இரு பரிமாணங்களையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: ὑμῖν
  choice: உங்களுக்கு
  rationale: கடித வாழ்த்து மொழியில் வரும் இந்த வேற்றுமையை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἰρήνη
  choice: சமாதானம்
  rationale: அமைதி மட்டுமல்லாமல் நலமும் முழுமையும் உட்படும் வேதாகம வாழ்த்தின் பரந்த பொருளைத் தக்கவைக்கும் நிலையான சொல்.
- source_word: ἀπὸ
  choice: இடமிருந்து
  rationale: அருளும் சமாதானமும் வரும் மூலத்தைத் தெளிவாகக் குறிக்கிறது.
- source_word: θεοῦ πατρὸς
  choice: தந்தையாகிய கடவுள்
  rationale: அச்சிடப்பட்ட கிரேக்க மூலத்தில் ‘நம்’ என்பதற்குரிய ἡμῶν இல்லை. எனவே அதைச் சேர்க்காமல், பெயரடைப்புத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: κύριος என்பதன் பட்டப்பெயர் சார்ந்த வலிமையையும் புதிய ஏற்பாட்டின் வழக்கமான பயன்பாட்டையும் தக்கவைக்கிறது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியா
  rationale: Χριστός என்பதன் பட்டப்பெயர் பொருளை நேரடியாகத் தர ‘மெசியா’ பயன்படுத்தப்படுகிறது; தமிழில் இணைப்பை இயல்பாக்க ‘ஆகிய’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: πατρὸς என்பதுடன் ‘நம்’ என்பதைச் சேர்ப்பதா
  choice: ‘நம்’ என்பதைச் சேர்க்காமல் ‘தந்தையாகிய கடவுள்’ என்று மொழிபெயர்த்தல்
  alternative: ‘நம் தந்தையாகிய கடவுள்’
  rationale: SBLGNT உரையில் ἡμῶν (‘நம்’) இல்லை. பவுலின் வழக்கமான வாழ்த்து அமைப்பு உறவுப் பொருளை உணர்த்தினாலும், வெளிப்படையாக இல்லாத உடைமைச் சொல்லை முதன்மை உரையில் சேர்க்காமல் இருப்பது மூலச் சான்றை நெருக்கமாகப் பாதுகாக்கிறது.
- issue: வினைச்சொல் இல்லாத கிரேக்க வாழ்த்தைத் தமிழில் வெளிப்படுத்துதல்
  choice: ‘உண்டாவதாக’ என்று வாழ்த்து வினையை நிரப்புதல்
  alternative: ‘உங்களுக்கு அருளும் சமாதானமும்’
  rationale: கிரேக்கத்தில் வினைச்சொல் விடுபட்டுள்ள வாழ்த்து அமைப்பு இயல்பானது; தமிழில் முழுமையான, தெளிவான ஆசிவாக்கியமாக இருக்க ‘உண்டாவதாக’ என்பது பொருளை மாற்றாமல் நிரப்பப்படுகிறது.
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு இயேசுவுக்குரிய பட்டப்பெயராக உள்ள Χριστός என்பதன் ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற மெசியப் பொருளை முதன்மை உரையில் வெளிப்படையாகத் தக்கவைக்கிறது; மரபான மாற்று வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கடித-ஆசிவாக்கிய நடை பயன்படுத்தப்பட்டுள்ளது. ‘பிதா’ என்பதற்குப் பதில் தற்போதைய இயல்பான ‘தந்தை’ தேர்ந்தெடுக்கப்பட்டுள்ளது; ‘ஆண்டவர்’, ‘அருள்’, ‘சமாதானம்’ ஆகிய நிலையான வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன.
