  text: since it is just before God to repay affliction to those who afflict you[a]
translation:
  language: ta
  text: ஏனெனில், உங்களைத் துன்புறுத்துகிறவர்களுக்குத் துன்பத்தைப் பதிலாக அளிப்பது கடவுளின் பார்வையில் நீதியானது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களைத் துன்புறுத்துகிறவர்களுக்குத் துன்பத்தைப் பதிலாக அளிப்பது கடவுளின் பார்வையில் நீதியானது என்றால்.”
    reason: εἴπερ என்பதை அதன் நேரடியான நிபந்தனை வடிவத்தில் மொழிபெயர்க்கும் மாற்று வாசிப்பு.
lexical_decisions:
- source_word: εἴπερ
  choice: ஏனெனில்
  rationale: இங்கு இது ஐயத்திற்குரிய நிபந்தனையை அல்ல, உண்மை என்று கருதப்படும் ஒரு காரண அடிப்படையை வலியுறுத்துகிறது. எனவே இயல்பான நவீனத் தமிழில் ‘ஏனெனில்’ என்று மொழிபெயர்க்கப்பட்டது; நேரடியான நிபந்தனை வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: δίκαιον
  choice: நீதியானது
  rationale: கடவுளுடைய தீர்ப்பில் அறநெறிப்படியும் நியாயப்படியும் சரியான செயலைக் குறிக்கிறது; இத்தீர்ப்பு சார்ந்த சூழலில் ‘நீதியானது’ பொருத்தமானது.
- source_word: παρὰ θεῷ
  choice: கடவுளின் பார்வையில்
  rationale: ஒரு செயல் கடவுளுடைய மதிப்பீட்டின்படி நீதியானது என்ற உறவுநிலையை இயல்பான தமிழில் தெரிவிக்கிறது; இடத்தைக் குறிக்கும் பொருளைத் தவிர்க்கிறது.
- source_word: ἀνταποδοῦναι
  choice: பதிலாக அளிப்பது
  rationale: ஒருவர் செய்ததற்கு ஏற்றதைத் திருப்பிச் செலுத்தும் கைம்மாற்றுப் பொருளைத் தெளிவாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: τοῖς θλίβουσιν ὑμᾶς
  choice: உங்களைத் துன்புறுத்துகிறவர்களுக்கு
  rationale: θλίβω குறிக்கும் அழுத்தம், இன்னல், ஒடுக்குதல் ஆகிய தீவிரத்தை ‘துன்புறுத்துதல்’ இயல்பாக வெளிப்படுத்துகிறது; அடுத்துள்ள θλῖψις என்பதுடனான சொற்பொருள் தொடர்பையும் காக்கிறது.
- source_word: θλῖψιν
  choice: துன்பத்தையே
  rationale: துன்புறுத்துகிறவர்களுக்கு அதற்கேற்ற துன்பம் பதிலாக அளிக்கப்படும் என்ற சொல் எதிரொலியைக் காக்கிறது. ‘-ஏ’ என்பது அந்த அளவான கைம்மாற்றைத் தமிழில் தெளிவுபடுத்துகிறது; புதிய கருத்தைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: கடவுள் அளிக்கும் கைம்மாற்றின் இயல்பு
  choice: துன்புறுத்துகிறவர்களுக்குத் துன்பத்தைப் பதிலாக அளிப்பது நீதியானது என்று மட்டும் வசனம் கூறுகிறது; அதன் காலத்தையோ முறையையோ இக்கூற்றில் வரையறுக்கவில்லை.
  alternative: இது இறுதிக்காலத் தீர்ப்பை மட்டுமே குறிக்கிறது; அல்லது தற்போதைய வரலாற்றுத் தீர்ப்புகளையும் இறுதித் தீர்ப்பையும் சேர்த்துக் குறிக்கிறது.
  rationale: கிரேக்க வாசகம் கடவுளின் கைம்மாற்று நீதியானது என்பதை உறுதிப்படுத்துகிறது; ஆனால் அது எப்போது, எவ்வாறு நிறைவேறும் என்பதை இந்தத் துணைவாக்கியம் மட்டும் தீர்மானிப்பதில்லை. ஆகவே மொழிபெயர்ப்பு அந்தத் தத்துவத் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘துன்புறுத்துதல்—துன்பம்’ என்ற மூலமொழியின் சொல் எதிரொலி பாதுகாக்கப்பட்டுள்ளது. இவ்வசனம் முந்தைய மற்றும் அடுத்த வசனங்களுடன் தொடரும் வாக்கியத்தின் ஒரு பகுதியாக இருப்பதால் தொடக்கத்தில் ‘ஏனெனில்’ வைக்கப்பட்டுள்ளது.
