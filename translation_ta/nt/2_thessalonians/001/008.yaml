lexical_decisions:
- source_word: ἐν φλογὶ πυρός
  choice: எரிகிற நெருப்பில்
  rationale: நெருப்புச் சுவாலையின் தீவிரமான காட்சியை இயல்பான நவீனத் தமிழில் தருகிறது; முந்தைய வசனத்தில் கூறப்பட்ட ஆண்டவரின் வெளிப்பாட்டோடு இலக்கணத் தொடர்பையும் தக்கவைக்கிறது.
- source_word: διδόντος ἐκδίκησιν
  choice: பழிவாங்கும் தண்டனையை அளிப்பார்
  rationale: ‘அளித்தல்’ என்ற வினை உணர்வையும், நீதித்தீர்ப்பாக வழங்கப்படும் ἐκδίκησις என்பதன் கடுமையையும் ஒன்றாகக் காக்கிறது; இது கட்டுப்பாடற்ற மனிதக் கோபத்தைக் குறிக்காமல், சூழலில் உள்ள நீதியான தண்டனையைக் குறிக்கிறது.
- source_word: τοῖς μὴ εἰδόσι θεὸν
  choice: கடவுளை அறியாதவர்களுக்கு
  rationale: οἶδα என்பதன் நிகழ்கால நிலை உணர்வைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: τοῖς μὴ ὑπακούουσιν
  choice: கீழ்ப்படியாதவர்களுக்கு
  rationale: மூலத்தில் வெளிப்படையாக இல்லாத ‘மறுக்கிற’ என்ற மனவுறுதி சார்ந்த பொருளைச் சேர்க்காமல், கீழ்ப்படியாமையை நேரடியாகத் தெரிவிக்கிறது.
- source_word: τῷ εὐαγγελίῳ
  choice: நற்செய்திக்கு
  rationale: பவுலின் பயன்பாட்டில் உள்ள ‘சுவிசேஷம்/நல்ல செய்தி’ என்ற கருத்தை இன்றைய பொதுத் தமிழில் புரியும் நிலையான சொலால் தருகிறது.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: நம் ஆண்டவராகிய இயேசுவின்
  rationale: κύριος என்ற பட்டத்தையும், ‘நம்’ என்ற உறவையும், இயேசுவின் நற்செய்தி என்ற உடைமைத் தொடர்பையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: தெய்வீக நீதித்தீர்ப்பில் ἐκδίκησις என்பதன் இயல்பு
  choice: பழிவாங்கும் தண்டனை
  alternative: நீதியான பதில்தண்டனை
  rationale: மூலச்சொல்லின் கடுமையைக் குறைக்காமல் காக்கிறது; அதேவேளையில் ‘தண்டனை’ என்பதன் மூலம் இது பாவமுள்ள மனிதரின் உணர்ச்சிவசப்பட்ட பழிவாங்கல் அல்ல, நீதித்தீர்ப்பின் செயலென்பதைச் சூழலுக்கேற்ப உணர்த்துகிறது.
- issue: διδόντος என்ற பங்கெச்சத்தின் கர்த்தா மற்றும் காலத் தொடர்பு
  choice: ‘அளிப்பார்’ என்று ஆண்டவர் இயேசுவோடு இணைத்தல்
  alternative: ‘அளித்துக்கொண்டு’ என்ற பங்கெச்ச வடிவம்
  rationale: முந்தைய வசனத்திலிருந்து தொடரும் வாக்கியத்தைத் தமிழில் வாசிக்கத்தக்க முழு வினையாக அளிக்கிறது; தண்டனை வழங்குபவர் வெளிப்படும் ஆண்டவர் என்பதைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் முந்தைய வசனத்தின் தொடராக இருப்பதால் ‘வெளிப்பட்டு’ சேர்க்கப்பட்டுள்ளது; இது புதிய கருத்தல்ல, 1:7-இன் ἀποκαλύψει என்ற தொடரை வெளிப்படுத்தும் தமிழாக்க இணைப்பு. ‘பழிவாங்கும் தண்டனை’ மூலத்தின் நீதித்தீர்ப்பு சார்ந்த தீவிரத்தைக் காக்கிறது.
