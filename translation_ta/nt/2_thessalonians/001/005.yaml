source:
  edition: SBLGNT
  text: ἔνδειγμα τῆς δικαίας κρίσεως τοῦ θεοῦ, εἰς τὸ καταξιωθῆναι ὑμᾶς τῆς βασιλείας τοῦ θεοῦ, ὑπὲρ ἧς καὶ πάσχετε,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/005.yaml
  text: This is evidence of the righteous judgment of God[a], so that you may be counted worthy of the kingdom of God, for which you are also suffering[c][b],
translation:
  language: ta
  text: இது கடவுளின் நீதியான தீர்ப்புக்குச் சான்றாக இருக்கிறது[a]; நீங்கள் கடவுளின் அரசாட்சிக்குத் தகுதியுள்ளவர்களாகக் கருதப்படும்படியாக. அந்த அரசாட்சியின் பொருட்டே நீங்களும் துன்பப்படுகிறீர்கள்[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சான்று’ என்பதற்குப் பதிலாக ‘அடையாளம்’ அல்லது ‘நிரூபணம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘நீங்கள் தகுதியுள்ளவர்களாகக் கருதப்படுவதற்காக’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க அமைப்பு நோக்கத்தையோ விளைவையோ குறிக்கக்கூடும்.
    reason: alternative_reading
  - marker: c
    text: ‘அந்த அரசாட்சிக்காகவே’ அல்லது ‘அதன் சார்பாகவே’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔνδειγμα
  choice: சான்று
  rationale: ஒரு உண்மையைச் சுட்டிக்காட்டி உறுதிப்படுத்தும் பொருளைத் தருகிறது. முடிவான நிரூபணம் என்று மிகைப்படுத்தாமல், கிரேக்கச் சொல்லின் சான்றளிக்கும் வலிமையை இயல்பான தமிழில் காக்கிறது. கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘இது ... இருக்கிறது’ என்பது முந்தைய வசனத்தைச் சார்ந்த வினையற்ற தொடரைத் தமிழில் நிறைவு செய்யச் சேர்க்கப்பட்டுள்ளது.
- source_word: δικαίας κρίσεως
  choice: நீதியான தீர்ப்பு
  rationale: கடவுளின் தீர்ப்பில் உள்ள நீதித் தன்மையை நேரடியாகவும் dignified modern Tamil-இலும் வெளிப்படுத்துகிறது.
- source_word: εἰς τὸ καταξιωθῆναι
  choice: இதனால் ... தகுதியுள்ளவர்களாகக் கருதப்படுவீர்கள்
  rationale: கிரேக்கத்தின் நோக்கம் அல்லது விளைவு ஆகிய இரண்டையும் ஏற்கக்கூடிய அமைப்பில், சூழலில் இயல்பாகத் தோன்றும் விளைவு நுணுக்கத்தை முதன்மைப்படுத்துகிறது. செயல்பாட்டு வினையின் passive வடிவத்தை ‘கருதப்படுவீர்கள்’ என்று காத்து, அவர்கள் உள்ளார்ந்த முறையில் தகுதியாக்கப்படுகிறார்கள் அல்லது துன்பத்தால் தகுதியைச் சம்பாதிக்கிறார்கள் என்று கூறவில்லை.
- source_word: βασιλείας τοῦ θεοῦ
  choice: கடவுளின் அரசாட்சி
  rationale: ‘கடவுளின்’ என்ற உரிமைத் தொடர்பையும் βασιλεία என்பதன் ஆட்சி/அரசாட்சி கருத்தையும் தெளிவாகக் காக்கும் இயல்பான நவீனத் தமிழ்.
- source_word: ὑπὲρ ἧς
  choice: அந்த அரசாட்சியின் பொருட்டே
  rationale: ὑπέρ உடன் வரும் ‘அதன் நிமித்தம்/அதன் சார்பாக’ என்ற பயன் அல்லது நோக்கத் தொடர்பைத் தெளிவாகக் காட்டுகிறது; ‘அதற்காக’ என்பதைக் காட்டிலும் இங்கு துன்பத்தின் காரணத் தொடர்பைச் சற்று துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: καὶ πάσχετε
  choice: நீங்களும் துன்பப்படுகிறீர்கள்
  rationale: நிகழ்காலத்தின் தொடரும் செயலை ‘துன்பப்படுகிறீர்கள்’ என்றும், καί தரும் இணைப்பை ‘உம்’ என்றும் காக்கிறது.
theological_decisions:
- issue: துன்பத்திற்கும் கடவுளின் அரசாட்சிக்குத் தகுதியுள்ளவர்களாகக் கருதப்படுவதற்கும் உள்ள தொடர்பு
  choice: அவர்களுடைய நிலைத்திருத்தலும் துன்பமும் கடவுளின் நீதியான தீர்ப்புக்குச் சான்றாக உள்ளன; அதன் விளைவாக அல்லது நோக்கமாக அவர்கள் அரசாட்சிக்குத் தகுதியுள்ளவர்களாகக் கருதப்படுகிறார்கள்.
  alternative: அவர்களுடைய துன்பமே அரசாட்சியில் நுழைவதற்கான தகுதியைச் சம்பாதிக்கிறது.
  rationale: καταξιωθῆναι என்பது passive வடிவில் ‘தகுதியுள்ளவர்களாகக் கருதப்படுதல்’ என்று பொருள்படுகிறது; ‘தகுதியைச் சம்பாதித்தல்’ அல்லது ‘உள்ளார்ந்த முறையில் தகுதியாக்கப்படுதல்’ என்று அல்ல. εἰς τό அமைப்பிலுள்ள நோக்கம்/விளைவு பதற்றம் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: இயல்பான, தற்போதைய செந்தமிழ் கலந்த பொதுநடை பயன்படுத்தப்பட்டுள்ளது. ‘தேவன்/ராஜ்யம்’ போன்ற சில மரபுசார் வடிவங்களுக்கு மாற்றாக, பல தரப்பட்ட வாசகர்களுக்கும் நேரடியாகப் புரியும் ‘கடவுள்/அரசாட்சி’ தேர்ந்தெடுக்கப்பட்டுள்ளது. வசனத்தின் dignified theological tone காக்கப்பட்டுள்ளது.
