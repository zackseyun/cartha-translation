id: 2TH.1.1
reference: 2 Thessalonians 1:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Παῦλος καὶ Σιλουανὸς καὶ Τιμόθεος τῇ ἐκκλησίᾳ Θεσσαλονικέων ἐν θεῷ πατρὶ ἡμῶν καὶ κυρίῳ Ἰησοῦ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/001.yaml
  text: 'Paul and Silvanus and Timothy[b][a], to the church of the Thessalonians in God our Father and the Lord Jesus the Messiah:'
translation:
  language: ta
  text: 'பவுலும் சில்வானுவும் தீமோத்தேயுவும், நம் தந்தையாகிய கடவுளிலும் ஆண்டவராகிய இயேசு மெசியாவிலும் இருக்கும் தெசலோனிக்கேயரின் திருச்சபைக்கு[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இயேசு கிறிஸ்து’ என்றும் வழங்கலாம். Χριστός என்ற கிரேக்கப் பட்டத்தை ‘மெசியா’ என்றும், மரபுப்படி ‘கிறிஸ்து’ என்றும் வழங்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: பவுல்
  rationale: Παῦλος என்ற நபர்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: Σιλουανὸς
  choice: சில்வானு
  rationale: மூலத்தில் உள்ள Σιλουανός என்பதையே நேரடியாக ஒலிபெயர்த்து, அப்போஸ்தலர் நூலில் காணப்படும் சுருக்கப் பெயரான ‘சீலா’ என்பதோடு ஒத்திசைக்கவில்லை.
- source_word: Τιμόθεος
  choice: தீமோத்தேயு
  rationale: Τιμόθεος என்ற நபர்பெயரின் தமிழில் வழக்கமான ஒலிபெயர்ப்பு.
- source_word: ἐκκλησίᾳ
  choice: திருச்சபை
  rationale: பவுலின் கடிதப் பயன்பாட்டில் விசுவாசிகளின் சமூகத்தைக் குறிக்கும் ἐκκλησία என்பதற்கான இயல்பான, கண்ணியமான தமிழ் இணைச்சொல்.
- source_word: Θεσσαλονικέων
  choice: தெசலோனிக்கேயரின்
  rationale: இது நகரத்தைக் குறிக்கும் இடவெச்சம் அல்ல, மக்களைக் குறிக்கும் பன்மை உரிமைவேற்றுமை; அதனால் ‘தெசலோனிக்கேயரின்’ என வடிவமைக்கப்பட்டது.
- source_word: ἐν
  choice: இல் / இருக்கும்
  rationale: கடவுளுடனும் ஆண்டவர் இயேசுவுடனும் திருச்சபைக்கு உள்ள உறவை ‘இல்’ என்ற அடிப்படைப் பொருளில் வைத்தே, தமிழில் இயல்பாக ‘இருக்கும்’ என இணைத்துள்ளது; ஒன்றிப்பு, சூழல், ஆதாரம் ஆகிய சாத்தியங்களைத் தீர்மானித்து விடவில்லை.
- source_word: θεῷ πατρὶ ἡμῶν
  choice: நம் தந்தையாகிய கடவுள்
  rationale: ἡμῶν என்ற உடைமைப் பொருளை ‘நம்’ என்று வெளிப்படையாகப் பாதுகாக்கிறது; தமிழ் நடைத் தெளிவுக்காக ‘தந்தையாகிய’ பயன்படுத்தப்பட்டது.
- source_word: κυρίῳ
  choice: ஆண்டவர்
  rationale: இயேசுவுக்கான κύριος என்ற பட்டத்துக்கு நிலைபெற்ற தமிழ் மொழிபெயர்ப்பு.
- source_word: Χριστῷ
  choice: மெசியா
  rationale: Χριστός இங்கு இயேசுவுடன் இணைந்த பட்டமாகச் செயல்படுவதால் அதன் பொருளை மொழிபெயர்க்கும் ‘மெசியா’ தேர்ந்தெடுக்கப்பட்டது; மரபான ‘கிறிஸ்து’ அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: Ἰησοῦ Χριστῷ என்பதில் Χριστῷ-ஐ மொழிபெயர்த்தல்
  choice: இயேசு மெசியா
  alternative: இயேசு கிறிஸ்து
  rationale: Χριστός என்பதன் பட்டத்தன்மையை ‘மெசியா’ வெளிப்படுத்துகிறது. தமிழில் தனிப்பட்ட சுட்டுச் சொல்லைச் சேர்க்காமல் பட்டத்தைப் பெயருடன் இணைப்பது இயல்பாக இருப்பதால் ‘இயேசு மெசியா’ எனத் தரப்பட்டுள்ளது; மரபான ஒலிபெயர்ப்பு மாற்றாகக் குறிப்பிடப்படுகிறது.
- issue: ἐν θεῷ πατρὶ ἡμῶν καὶ κυρίῳ Ἰησοῦ Χριστῷ வெளிப்படுத்தும் உறவு
  choice: நம் தந்தையாகிய கடவுளிலும் ஆண்டவராகிய இயேசு மெசியாவிலும் இருக்கும்
  alternative: நம் தந்தையாகிய கடவுளுக்கும் ஆண்டவராகிய இயேசு மெசியாவுக்கும் உரிய
  rationale: ἐν என்பதைக் ‘உரிய’ அல்லது ‘நிறுவப்பட்ட’ என்று விரிவாக விளக்காமல், ‘இல்’ என்ற அமைப்பைப் பாதுகாக்கிறது. இதனால் சூழல், ஒன்றிப்பு, ஆதாரம் ஆகிய இறையியல் நுணுக்கங்கள் திறந்தவையாக இருக்கின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், கடிதத் தொடக்கத்தின் கண்ணியமான தொனியைப் பேணும் வகையில் அமைக்கப்பட்டது. கிரேக்கத்தின் நீண்ட முகவரிச் சொற்றொடர் தமிழில் தெளிவாக இருக்க ‘எழுதுவது’ சேர்க்கப்பட்டுள்ளது. ‘தெசலோனிக்கேயரின்’ என்பது மக்களைச் சுட்டும் மூல இலக்கணத்தைப் பாதுகாக்கிறது; ‘கடவுளிலும் ... இயேசு மெசியாவிலும் இருக்கும்’ என்பது ἐν என்பதன் செறிந்த, தெளிவாகத் தீர்க்கப்படாத உறவைத் தக்கவைக்கிறது.
