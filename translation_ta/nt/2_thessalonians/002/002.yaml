reference: 2 Thessalonians 2:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰς τὸ μὴ ταχέως σαλευθῆναι ὑμᾶς ἀπὸ τοῦ νοὸς ⸀μηδὲ θροεῖσθαι μήτε διὰ πνεύματος μήτε διὰ λόγου μήτε δι’ ἐπιστολῆς ὡς δι’ ἡμῶν, ὡς ὅτι ἐνέστηκεν ἡ ἡμέρα τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/002.yaml
  text: that you not be quickly shaken from your mind or alarmed[a], either by a spirit or by a message or by a letter as if from us[b], to the effect that the day of the Lord has come.
translation:
  language: ta
  text: ஆண்டவருடைய நாள் வந்துவிட்டது[b] என்று கூறும் ஓர் ஆவியினாலோ[a], ஒரு செய்தியினாலோ, எங்களிடமிருந்து வந்ததுபோல் கூறப்படும் ஒரு கடிதத்தினாலோ, நீங்கள் உங்கள் நிதானமான மனநிலையிலிருந்து விரைவில் அசைக்கப்படவோ கலக்கமடையவோ வேண்டாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆவிக்குரிய ஓர் உரையினாலோ’ அல்லது ‘தீர்க்கதரிசன வெளிப்பாட்டினாலோ.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘இப்போது நிலவுகிறது’ அல்லது ‘தற்போது இருக்கிறது.’ இங்குள்ள கிரேக்க நிறைவுக் கால வினை, ஆண்டவருடைய நாள் ஏற்கெனவே வந்து தற்போது இருக்கிறது என்று கூறப்படுவதைக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ταχέως
  choice: விரைவில்
  rationale: எச்சரிக்கையின் பொருள் நிகழ்வு சீக்கிரம் நடைபெறும் என்பதல்ல; வாசகர்கள் எளிதில் அல்லது உடனடியாகக் கலங்கிவிடக் கூடாது என்பதாகும்.
- source_word: σαλευθῆναι
  choice: அசைக்கப்படாமல்
  rationale: மனநிலை குலைக்கப்படுவதைச் சுட்டும் கிரேக்க உருவகத்தைத் தமிழிலும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἀπὸ τοῦ νοὸς
  choice: உங்கள் நிதானமான மனநிலையிலிருந்து
  rationale: νοῦς இங்கு வெறும் அறிவாற்றலை மட்டுமல்லாமல் நிலையான சிந்தனை அல்லது மனத்திடத்தையும் குறிக்கலாம்; சூழலுக்கேற்ற இந்த விரிவைத் தமிழ் சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: θροεῖσθαι
  choice: கலக்கமடையாமல்
  rationale: அச்சுறுத்தப்பட்டு மனக்குழப்பம் அடைவதைக் குறிக்கும் வினையின் உணர்ச்சிசார் வலிமையை மிகைப்படுத்தாமல் தருகிறது.
- source_word: πνεύματος
  choice: ஓர் ஆவியினால்
  rationale: மூலத்தின் நேரடியான, குறிப்பற்ற சொல்லாக்கத்தைப் பாதுகாக்கிறது; கூறப்படுகிற ஆவிக்குரிய வெளிப்பாடு என்ற சூழல்சார் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: λόγου
  choice: ஒரு செய்தியினால்
  rationale: கடிதத்துடன் வேறுபடுத்திக் காட்டப்படும் வாய்மொழிச் செய்தி அல்லது போதனையைத் தெளிவாக உணர்த்துகிறது.
- source_word: ἐπιστολῆς
  choice: ஒரு கடிதத்தினால்
  rationale: எழுத்துவழித் தொடர்புக்கான இயல்பான நவீனத் தமிழ் சொல்.
- source_word: ὡς δι’ ἡμῶν
  choice: எங்களிடமிருந்து வந்ததுபோல் காட்டப்படும்
  rationale: பவுலுக்கும் அவருடைய உடன் ஊழியர்களுக்கும் பொய்யாக உரிமைசாட்டப்பட்ட கடிதம் என்பதைக் கிரேக்கத்தின் ‘எங்கள் மூலமாக வந்ததுபோல்’ என்ற பொருளுக்கு இணங்க இயல்பாகச் சொல்கிறது.
- source_word: ἐνέστηκεν
  choice: வந்துவிட்டது
  rationale: அந்த நாள் ஏற்கெனவே வந்து இப்போது நிலவுகிறது என்ற கூற்றை இயல்பான தமிழில் தெரிவிக்கிறது; ‘இப்போது வந்திருக்கிறது/நிலவுகிறது’ என்ற நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἡμέρα τοῦ κυρίου
  choice: ஆண்டவருடைய நாள்
  rationale: வாராந்திர வழிபாட்டு நாளை அல்ல, இறுதிக்காலத்துக்குரிய நிலைபெற்ற வேதாகமச் சொற்றொடரைச் சுட்டுகிறது.
theological_decisions:
- issue: ἐνέστηκεν என்பதன் இறுதிக்காலக் கூற்றிலுள்ள பொருள்
  choice: வந்துவிட்டது
  alternative: இப்போது வந்திருக்கிறது; இப்போது நிலவுகிறது
  rationale: நிறைவுக் கால வினை, வந்து சேர்ந்ததன் விளைவாக அது தற்போது இருக்கிறது என்ற பொருளைக் கொண்டுள்ளது. முதன்மை உரை இயல்பான தமிழைப் பயன்படுத்துகிறது; விளக்க முக்கியத்துவம் உடைய மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- issue: மூன்று கூறப்பட்ட ஆதாரங்களில் πνεύματος என்பதன் பொருள்
  choice: ஓர் ஆவி
  alternative: ஆவிக்குரிய உரை; தீர்க்கதரிசன வெளிப்பாடு; ஆவியானவர்
  rationale: உறுப்பில்லாத πνεῦμα இச்சூழலில் பரிசுத்த ஆவியானவரைத் திட்டவட்டமாக அடையாளப்படுத்தாமல், ஆவியிலிருந்து வந்ததாகக் கூறப்பட்ட வெளிப்பாட்டைக் குறிக்கலாம். நேரடியான சொல்லாக்கம் முதன்மை உரையிலும் சூழல்சார் மாற்று அடிக்குறிப்பிலும் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் தெளிவும் கொண்ட நடை. மூலத்தின் உருவகமான ‘அசைக்கப்படுதல்’ பாதுகாக்கப்பட்டுள்ளது; ஆனால் ἀπὸ τοῦ νοὸς தமிழில் தவறாக ‘மனத்தை இழத்தல்’ எனப் புரியாதபடி ‘நிதானமான மனநிலை’ என்று இயல்பாக்கப்பட்டுள்ளது. வசனம் முந்தைய வசனத்தின் வேண்டுகோளைத் தொடரும் நோக்கத்தைத் தமிழில் முழுமையான எச்சரிக்கை வாக்கியங்களாகத் தெளிவுபடுத்துகிறது.
