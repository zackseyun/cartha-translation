revisions:
- from: நீங்கள் உங்கள் நிதானமான மனநிலையிலிருந்து விரைவில் அசைக்கப்படாமலும் கலக்கமடையாமலும் இருக்க வேண்டும். ஆண்டவருடைய நாள் வந்துவிட்டது[b] என்று கூறும் ஓர் ஆவியினாலோ[a], ஒரு செய்தியினாலோ, எங்களிடமிருந்து வந்ததுபோல் காட்டப்படும் ஒரு கடிதத்தினாலோ இவ்வாறு ஆகிவிடாதீர்கள்.
