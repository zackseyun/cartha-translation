revisions:
- from: நான் இன்னும் உங்களோடு இருந்தபோது இவற்றை உங்களுக்குச் சொல்லிக்கொண்டிருந்தேன் என்பது உங்களுக்கு நினைவில்லையா?
  to: நான் இன்னும் உங்களோடு இருந்தபோது, இவற்றை உங்களுக்குச் சொல்லிவந்தேன் என்பது உங்களுக்கு நினைவில்லையா?
  rationale: Replaced ‘சொல்லிக்கொண்டிருந்தேன்’ with ‘சொல்லிவந்தேன்’ to express the imperfect ἔλεγον as repeated or ongoing instruction in more natural modern Tamil. The rest of the wording faithfully preserves the Greek syntax and sense.
