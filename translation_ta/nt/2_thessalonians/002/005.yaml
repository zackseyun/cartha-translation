  text: Do you not remember that while I was still with you, I was telling you these things?
translation:
  language: ta
  text: நான் இன்னும் உங்களோடு இருந்தபோது, இவற்றை உங்களுக்குச் சொல்லிவந்தேன் என்பது உங்களுக்கு நினைவில்லையா?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μνημονεύετε
  choice: நினைவில்லையா
  rationale: முன்பு கற்பிக்கப்பட்டவற்றை வாசகர்கள் நினைவில் வைத்திருக்கிறார்களா என்று கேட்கும் வினைச்சொல். எதிர்மறை வினாவாகிய οὐ μνημονεύετε என்பதைக் இயல்பான நவீனத் தமிழில் இவ்வாறு தருகிறது.
- source_word: ἔτι
  choice: இன்னும்
  rationale: பவுல் அந்த நேரத்தில் தொடர்ந்து அவர்களோடு இருந்த நிலையைக் குறிக்கும் காலப் பொருளைப் பாதுகாக்கிறது.
- source_word: ὢν πρὸς ὑμᾶς
  choice: உங்களோடு இருந்தபோது
  rationale: அவர்களிடையே பவுல் நேரில் இருந்ததையும், பங்கேற்புவினையின் காலத் தொடர்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ταῦτα
  choice: இவற்றை
  rationale: சூழலில் முன்பு குறிப்பிடப்பட்ட பல காரியங்களைச் சுட்டும் பன்மைச் சுட்டுப்பெயரின் பொருளைப் பாதுகாக்கிறது.
- source_word: ἔλεγον
  choice: சொல்லிக்கொண்டிருந்தேன்
  rationale: முற்றுப்பெறா இறந்தகால வடிவம் காட்டும் தொடர்ந்த அல்லது மீண்டும் நிகழ்ந்த போதனையைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: οὐ ... ὅτι
  choice: என்பது உங்களுக்கு நினைவில்லையா?
  rationale: ὅτι அறிமுகப்படுத்தும் நினைவின் உள்ளடக்கத்தை ‘என்பது’ எனக் காட்டி, முழுக் கட்டமைப்பையும் இயல்பான தமிழ் எதிர்மறை வினாவாக அமைக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘சொல்லிக்கொண்டிருந்தேன்’ என்பது ἔλεγον என்பதன் தொடர்ச்சியான இறந்தகால நுணுக்கத்தைப் பாதுகாக்கிறது; விளக்கவுரை அல்லது சமயப்பிரிவு சார்ந்த சொற்கள் சேர்க்கப்படவில்லை.
