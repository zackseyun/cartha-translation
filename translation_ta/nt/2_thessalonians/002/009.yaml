  yaml_path: translation/nt/2_thessalonians/002/009.yaml
  text: whose coming is according to the working of Satan[b][a], with all power and signs and wonders of falsehood.
translation:
  language: ta
  text: அவனுடைய வருகை சாத்தானின் செயல்பாட்டுக்கு ஏற்ப, எல்லா வல்லமையுடனும் பொய்யைச் சார்ந்த அடையாளங்களுடனும் அற்புதங்களுடனும் இருக்கும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பொய்யைச் சார்ந்த’ என்பதை ‘பொய்மையின் அடையாளங்களும் அற்புதங்களும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: அவனுடைய
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட ‘அக்கிரமக்காரனை’க் குறிக்கும் உடைமை வேற்றுமை சார்புப்பெயர்; தமிழில் இயல்பான தொடர்பை உருவாக்குகிறது.
- source_word: παρουσία
  choice: வருகை
  rationale: இறுதிக்காலச் சூழலில் வெறும் இருப்பைக் காட்டிலும் ஒருவரின் வந்துசேர்தலைக் குறிக்கிறது; ‘வருகை’ அந்தப் பொருளை dignified modern Tamil-ல் இயல்பாகத் தருகிறது.
- source_word: κατ’ ἐνέργειαν
  choice: செயல்பாட்டுக்கு ஏற்ப
  rationale: சாத்தானின் செயலாற்றலுக்கு இசைவான முறை அல்லது தன்மையைச் சுட்டுகிறது; காரணத்தை அளவுக்கு மீறி வலியுறுத்தாமல் கிரேக்க அமைப்பைப் பேணுகிறது.
- source_word: τοῦ Σατανᾶ
  choice: சாத்தானின்
  rationale: புதிய ஏற்பாட்டில் வழக்கமான பெயரெழுத்தாக்கம்; செயல்பாடு சாத்தானுக்குரியது அல்லது அவனிடமிருந்து வருவது என்பதை உடைமை வடிவில் காட்டுகிறது.
- source_word: ἐν πάσῃ δυνάμει
  choice: எல்லா வல்லமையோடும்
  rationale: ἐν இங்கு உடனிகழ்வு அல்லது கருவிப் பொருளைக் கொண்டுள்ளது; πάσῃ என்பதன் விரிவான வலிமையையும் ‘எல்லா’ பேணுகிறது.
- source_word: σημείοις
  choice: அடையாளங்களோடும்
  rationale: σημεῖον என்பதற்கான வழக்கமான பொருள்; எதையாவது சுட்டிக்காட்டும் அல்லது உறுதிப்படுத்தும் வியப்பூட்டும் செயல்களைத் தீர்மானமாக ‘அற்புத அடையாளங்கள்’ என்று சுருக்காமல் தருகிறது.
- source_word: τέρασιν
  choice: அற்புதங்களோடும்
  rationale: வியப்பை உண்டாக்கும் நிகழ்வுகளைக் குறிக்கும் τέρας என்பதற்கு இயல்பான தமிழ்; ‘அடையாளங்கள்’ என்பதுடன் வரும் இணைப்பையும் பேணுகிறது.
- source_word: ψεύδους
  choice: பொய்யைச் சார்ந்த
  rationale: ‘பொய்யின்’ என்ற எபிரேயமயமான/முறுக்கான நடையைத் தவிர்த்து, இவை பொய்மையால் வகைப்படுத்தப்படலாம் அல்லது ஏமாற்றத்துடன் தொடர்புடையவையாக இருக்கலாம் என்ற உறவைப் பேணுகிறது; அவை வெறும் போலித்தந்திரங்கள் என்று முடிவுசெய்யவில்லை.
theological_decisions:
- issue: சாத்தானுடன் தொடர்புடைய நிகழ்வுகளின் இயல்பு
  choice: வல்லமை, அடையாளங்கள், அற்புதங்கள் ஆகியவை பொய்யைச் சார்ந்தவை என்று மொழிபெயர்த்து, அவை ஏமாற்றத்தால் வகைப்படுத்தப்படுகின்றன அல்லது ஏமாற்றத்திற்குப் பயன்படுகின்றன என்ற திறந்த நிலையைப் பேணுதல்
  alternative: இவை முற்றிலும் போலியான தந்திரங்கள் என்று மொழிபெயர்த்தல்; அல்லது சாத்தான் நிகழ்த்தும் உண்மையான அற்புதங்கள் என்று வெளிப்படையாகக் கூறுதல்
  rationale: கிரேக்கம் அவற்றின் மெய்யியல் இயல்பைத் தீர்மானிப்பதில்லை. ψεύδους அவற்றைப் பொய்மையுடன் இணைக்கிறது; ஆனால் அவை முழுவதும் போலியானவையா அல்லது உண்மையான அமானுஷ்ய நிகழ்வுகளா என்பதைத் தெளிவுபடுத்தாது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதையான வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. ‘செயல்பாட்டுக்கு ஏற்ப’ என்பது மூலத்தின் முறையைக் காட்டும் தொடர்பைப் பேணுகிறது; ‘பொய்யைச் சார்ந்த’ என்பது நிகழ்வுகளை வெறும் போலிகள் என்று முன்கூட்டியே தீர்மானிக்காமல் மூலத்திலுள்ள இறையியல் அழுத்தத்தையும் தெளிவின்மையையும் காக்கிறது.
