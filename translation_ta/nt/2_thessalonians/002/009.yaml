- from: அவனுடைய வருகை சாத்தானின் செயல்பாட்டுக்கு ஏற்ப, எல்லா வல்லமையோடும் பொய்யைச் சார்ந்த அடையாளங்களோடும் அற்புதங்களோடும் இருக்கும்.[a]
  to: அவனுடைய வருகை சாத்தானின் செயல்பாட்டுக்கு ஏற்ப, எல்லா வல்லமையுடனும் பொய்யைச் சார்ந்த அடையாளங்களுடனும் அற்புதங்களுடனும் இருக்கும்.[a]
  rationale: The text is retained apart from a minor idiomatic refinement. The footnote is corrected so that it reflects the most natural syntactic connection of ψεύδους with ‘signs and wonders,’ while preserving the ambiguity about whether these displays are false, deceptive, or associated with falsehood. No doctrinal conclusion about the nature of the phenomena is introduced.
