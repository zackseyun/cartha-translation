translation:
  language: ta
  text: உங்கள் இதயங்களை ஊக்கப்படுத்தி[a], ஒவ்வொரு நல்ல செயலிலும் சொல்லிலும் உங்களை உறுதிப்படுத்துவாராக[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உங்கள் இதயங்களுக்கு ஆறுதலளித்து’ என்றும் மொழிபெயர்க்கலாம்; παρακαλέσαι என்பது ‘ஆறுதலளித்தல்’ அல்லது ‘அறிவுறுத்துதல்’ என்ற பொருளையும் தரக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘ஒவ்வொரு நல்ல செயலிலும் சொல்லிலும் உங்களை நிலைநிறுத்துவாராக’ அல்லது ‘திடப்படுத்துவாராக’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλέσαι
  choice: ஊக்கப்படுத்தி
  rationale: παρακαλέω என்பதற்கு ஊக்கப்படுத்துதல், ஆறுதலளித்தல், அறிவுறுத்துதல் ஆகிய பொருள் நிழல்கள் உள்ளன. முந்தைய வசனத்தில் வரும் நித்திய ஊக்கத்துடன் உள்ள தொடர்பையும், இங்கு வேண்டுதலாக உள்ள பரந்த பொருளையும் ‘ஊக்கப்படுத்தி’ இயல்பாகத் தருகிறது.
- source_word: καρδίας
  choice: இதயங்களை
  rationale: καρδία குறிக்கும் உள்ளார்ந்த மனிதனை வெறும் உணர்ச்சியாகவோ அறிவாகவோ சுருக்காமல், வேதாகமத்தின் மனித இயல்பு சார்ந்த உருவகத்தைப் பாதுகாக்கிறது.
- source_word: στηρίξαι
  choice: உறுதிப்படுத்துவாராக
  rationale: στηρίζω என்பது உறுதியாக்குதல் அல்லது நிலைநிறுத்துதல் என்று பொருள்படும். வேண்டுதல் அமைப்புக்கு ஏற்ற இயல்பான தமிழில், விசுவாசமான செயலுக்கும் சொல்லுக்கும் திடப்படுத்தப்படுதல் என்ற கருத்தை இது தெரிவிக்கிறது.
- source_word: ἐν παντὶ
  choice: ஒவ்வொரு … இலும்
  rationale: ἐν உடன் வரும் வேற்றுமை, உறுதிப்படுத்துதல் நிகழும் செயல்பாட்டு வட்டத்தைச் சுட்டுகிறது; ‘ஒவ்வொரு … இலும்’ இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἔργῳ
  choice: செயலில்
  rationale: ἔργον என்பது செயல் அல்லது செய்கை. λόγος உடன் இணைந்து மனித வாழ்வின் செயலும் சொல்லும் என்ற இயல்பான இணையை உருவாக்குகிறது.
- source_word: λόγῳ
  choice: சொல்லிலும்
  rationale: இங்கு λόγος, ‘செயல்’ என்பதற்கு இணையாகப் பேச்சு அல்லது சொல்லைச் சுட்டுவது இயல்பானது. ‘சொல்’ மூலத்தின் சுருக்கமான இணை அமைப்பைப் பாதுகாக்கிறது.
- source_word: ἀγαθῷ
  choice: நல்ல
  rationale: ἀγαθός என்பது செயல், சொல் இரண்டையும் பொருளில் வரையறுக்கிறது. ‘நல்ல’ என்பது அதன் நேரடியான, பரந்த தமிழ் இணை.
- source_word: ὑμῶν
  choice: உங்கள்
  rationale: இரண்டாம் நபர் பன்மை உடைமைப் பெயர் καρδίας என்பதுடன் தொடர்புடையதால் ‘உங்கள் இதயங்களை’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: καὶ
  choice: மற்றும் / -உம்
  rationale: இரு வேண்டுதல் வினைகளையும் ‘செயல்—சொல்’ என்ற இரு பெயர்களையும் இணைக்கிறது; இயல்பான தமிழ் தொடரில் காற்புள்ளியும் ‘-உம்’ இணைப்பும் பயன்படுத்தப்பட்டுள்ளன.
theological_decisions:
- issue: καρδία என்பதை நவீன உளவியல் வகையாக விளக்கி மொழிபெயர்க்கலாமா
  choice: இதயங்களை
  alternative: உள்ளங்களை; மனங்களை
  rationale: ‘இதயம்’ என்ற வேதாகம உருவகம் பாதுகாக்கப்படுகிறது; அதை உணர்ச்சி அல்லது அறிவு என்ற குறுகிய பொருளுக்குள் அடைக்கவில்லை.
- issue: στηρίξαι என்பதை ‘நிலைநிறுத்துதல்’ என்ற முறையான சொல்லால் தரலாமா
  choice: உறுதிப்படுத்துவாராக
  alternative: நிலைநிறுத்துவாராக; திடப்படுத்துவாராக
  rationale: உறுதியாக்குதல் என்ற மூலப்பொருளைத் தக்கவைத்தபடி, நவீன வாசகர்களுக்குப் புரியும் இயல்பான வேண்டுதல் நடையை இது வழங்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேண்டுதல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘இதயம்’ என்ற வேதாகம உருவகமும் ‘செயல்—சொல்’ என்ற மூலத்தின் இணை அமைப்பும் பாதுகாக்கப்பட்டுள்ளன.
