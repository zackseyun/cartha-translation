  text: καὶ τότε ἀποκαλυφθήσεται ὁ ἄνομος, ὃν ὁ κύριος ⸀Ἰησοῦς ⸀ἀνελεῖ τῷ πνεύματι τοῦ στόματος αὐτοῦ καὶ καταργήσει τῇ ἐπιφανείᾳ τῆς παρουσίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/008.yaml
  text: And then the lawless one will be revealed[a], whom the Lord Jesus will slay with the breath of his mouth and bring to nothing by the appearance of his coming[b],
translation:
  language: ta
  text: அப்பொழுது அந்தச் சட்டமற்றவன் வெளிப்படுத்தப்படுவான்; அவனை ஆண்டவராகிய இயேசு தமது வாயின் மூச்சினால்[a] கொல்வார்; தமது வருகையின் வெளிப்பாட்டினால்[b] செயலற்றவனாக்குவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தமது வாயின் ஆவியினால்.” கிரேக்கச் சொல் “மூச்சு” அல்லது “ஆவி” என்று இருவிதமாகவும் பொருள்படலாம்; இங்குள்ள சொற்றொடருக்கு “மூச்சு” இயல்பாகப் பொருந்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தமது பிரசன்னத்தின் வெளிப்பாட்டினால்.” இச்சூழலில் கிரேக்கச் சொல் பொதுவாக “வருகை” என்று பொருள்படும்; “பிரசன்னம்” என்பதும் அதன் பொருள் வரம்பிற்குள் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκαλυφθήσεται
  choice: வெளிப்படுத்தப்படுவான்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தையும், மறைந்திருந்தவன் வெளிப்படையாக அறியப்படுவதையும் காக்கிறது.
- source_word: ὁ ἄνομος
  choice: அந்தச் சட்டமற்றவன்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட பெயரடையை இயல்பான தமிழில் தருகிறது; இவ்வசனத்தில் இல்லாத ‘மனிதன்’ என்ற சொல்லைச் சேர்ப்பதில்லை.
- source_word: ὁ κύριος Ἰησοῦς
  choice: ஆண்டவராகிய இயேசு
  rationale: κύριος என்பதன் பட்டப்பெயரையும் இயேசுவின் பெயரையும் தெளிவாகவும் வழக்கமான புதிய ஏற்பாட்டுத் தமிழிலும் வழங்குகிறது.
- source_word: ἀνελεῖ
  choice: கொன்றுபோட்டு
  rationale: இச்சூழலில் கொல்லுதல் என்ற வினையின் வலிமையைத் தெளிவாகக் காட்டுகிறது; அடுத்த வினையுடன் இயல்பாக இணைகிறது.
- source_word: τῷ πνεύματι τοῦ στόματος αὐτοῦ
  choice: தமது வாயின் மூச்சினால்
  rationale: πνεῦμα என்பதற்கு இச்சொற்றொடரில் இயல்பாக அமையும் ‘மூச்சு’ என்ற பொருளைத் தேர்ந்தெடுக்கிறது; ‘ஆவி’ என்ற சாத்தியத்தை அடிக்குறிப்பில் காக்கிறது.
- source_word: καταργήσει
  choice: செயலற்றவனாக்குவார்
  rationale: முற்றிலும் அழித்தல் என்று மிகைப்படுத்தாமல், வல்லமையை ஒழித்து பயனற்றதாக்குதல் என்ற καταργέω வினையின் நுட்பத்தைத் தருகிறது.
- source_word: τῇ ἐπιφανείᾳ
  choice: வெளிப்பாட்டினால்
  rationale: கண்ணுக்குப் புலப்படும் தோற்றம் அல்லது வெளிப்படுதல் என்ற ἐπιφάνεια சொல்லின் பொருளைக் காக்கிறது.
- source_word: τῆς παρουσίας αὐτοῦ
  choice: தமது வருகையின்
  rationale: இறுதிக்காலச் சூழலில் παρουσία வழக்கமாகக் குறிக்கும் வருகையை இயல்பான தமிழில் தருகிறது; ‘பிரசன்னம்’ என்ற சொற்பொருள் வாய்ப்பை அடிக்குறிப்பில் குறிப்பிடுகிறது.
theological_decisions:
- issue: இறுதிக்கால எதிரியின் அடையாளமும் வருணனையும்
  choice: அந்தச் சட்டமற்றவன்
  alternative: அக்கிரம மனிதன்
  rationale: இவ்வசனத்தில் ὁ ἄνομος என்ற பெயர்ச்சொல்லாக்கப்பட்ட பெயரடையே உள்ளது; அருகிலுள்ள வசனத்தின் விரிவான சொற்றொடரை இங்கே இறக்குமதி செய்யாமல் மூல வடிவத்தைப் பாதுகாக்கிறது.
- issue: ஆண்டவராகிய இயேசு வெற்றிபெறும் வழி
  choice: தமது வாயின் மூச்சினால்
  alternative: தமது வாயின் ஆவியினால்
  rationale: இந்த மொழிநடையில் ‘மூச்சு’ இயல்பான பொருளாகவும் தீர்க்கதரிசன நியாயத்தீர்ப்பு உருவகத்துக்கு ஏற்றதாகவும் உள்ளது; ‘ஆவி’ என்ற உண்மையான சொற்பொருள் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: καταργήσει என்பதன் விளைவு
  choice: செயலற்றவனாக்குவார்
  alternative: அழித்துவிடுவார்
  rationale: எதிரியின் வல்லமையை ஒழித்து முடிவுக்குக் கொண்டுவருதல் என்ற பொருளை வெளிப்படுத்துகிறது; இருப்பே முற்றிலும் அழிக்கப்படுதல் என்ற தீர்மானத்தை உரையில் தேவையின்றி புகுத்துவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் தெளிவான, கண்ணியமான வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. ‘சட்டமற்றவன்’ மூலத்தின் பெயரடைவடிவத்தைப் பாதுகாக்கிறது; ‘கொன்றுபோட்டு’ மற்றும் ‘செயலற்றவனாக்குவார்’ ஆகியவை இரண்டு வேறுபட்ட கிரேக்க வினைகளின் வலிமையையும் நுட்பத்தையும் தனித்தனியாகக் காட்டுகின்றன. எல்லா அடிக்குறிப்புக் குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
