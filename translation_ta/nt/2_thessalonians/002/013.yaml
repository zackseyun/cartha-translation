source:
  edition: SBLGNT
  text: Ἡμεῖς δὲ ὀφείλομεν εὐχαριστεῖν τῷ θεῷ πάντοτε περὶ ὑμῶν, ἀδελφοὶ ἠγαπημένοι ὑπὸ κυρίου, ὅτι εἵλατο ὑμᾶς ὁ θεὸς ⸀ἀπαρχὴν εἰς σωτηρίαν ἐν ἁγιασμῷ πνεύματος καὶ πίστει ἀληθείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/013.yaml
  text: But we ought always to give thanks to God for you[a], brothers beloved by the Lord, because God chose you as firstfruits for salvation through sanctification by the Spirit and faith in the truth[b],
translation:
  language: ta
  text: ஆனால், ஆண்டவரால் அன்புகூரப்பட்ட சகோதரர்களே[b], உங்களுக்காக நாங்கள் எப்போதும் கடவுளுக்கு நன்றி செலுத்தக் கடமைப்பட்டுள்ளோம். ஏனெனில், ஆவியால் பரிசுத்தமாக்கப்படுதலினாலும் உண்மையின்மேல் உள்ள விசுவாசத்தினாலும் மீட்புக்காகக் கடவுள் உங்களை முதற்கனியாகத் தேர்ந்தெடுத்தார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “முதற்கனியாக” என்பதற்குப் பதிலாக, “கடவுள் உங்களை மீட்புக்காகத் தொடக்கத்திலிருந்தே தேர்ந்தெடுத்தார்” என்று உள்ளது. முதன்மை உரை ἀπαρχήν (“முதற்கனி”) என்ற பாடத்தைப் பின்பற்றுகிறது; மாற்றுப் பாடம் ἀπ’ ἀρχῆς (“தொடக்கத்திலிருந்து”) என்பதாகும்.
    reason: textual_variant
  - marker: b
    text: “சகோதரர்களே” என்பது ஆண்பால் பன்மையிலுள்ள ἀδελφοί என்ற சொல்லை மொழிபெயர்க்கிறது; இந்த அழைப்பு விசுவாசக் குழுவிலுள்ள ஆண்களையும் பெண்களையும் உள்ளடக்கக்கூடும்.
    reason: cultural_note
lexical_decisions:
- source_word: Ἡμεῖς δὲ
  choice: ஆனால் ... நாங்கள்
  rationale: δέ முந்தைய பகுதியில் அழிவோரைக் குறித்த விளக்கத்துடன் வேறுபாட்டைக் காட்டுகிறது; வெளிப்படையான Ἡμεῖς வலியுறுத்தலைத் தக்கவைக்கிறது.
- source_word: ὀφείλομεν
  choice: கடமைப்பட்டிருக்கிறோம்
  rationale: நன்றிசெலுத்துவது பொருத்தமான தார்மீகக் கடமை என்ற பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: εὐχαριστεῖν τῷ θεῷ πάντοτε περὶ ὑμῶν
  choice: உங்களுக்காக நாங்கள் எப்போதும் கடவுளுக்கு நன்றி செலுத்த
  rationale: பவுலின் வழக்கமான நன்றியறிதல் தொடரைத் தெளிவான நவீன தமிழில் வழங்குகிறது.
- source_word: ἀδελφοὶ ἠγαπημένοι ὑπὸ κυρίου
  choice: ஆண்டவரால் அன்புகூரப்பட்ட சகோதரர்களே
  rationale: செயப்பாட்டு வடிவத்தையும் அன்பான நேரடி அழைப்பையும் காக்கிறது; ἀδελφοί என்பதன் ஆண்பால் பன்மை வடிவம் முதன்மை உரையில் தக்கவைக்கப்படுகிறது.
- source_word: εἵλατο
  choice: தேர்ந்தெடுத்தார்
  rationale: αἱρέομαι என்பதன் நேரடியான தேர்வு என்ற பொருளை, குறிப்பிட்ட ஓர் தேர்தல் கோட்பாட்டைச் சேர்க்காமல் தருகிறது.
- source_word: ἀπαρχὴν
  choice: முதற்கனியாக
  rationale: SBLGNT அச்சுப் பாடமான ἀπαρχήν என்பதிலுள்ள அறுவடை/அர்ப்பணிப்பு உருவகத்தைத் தக்கவைக்கிறது.
- source_word: εἰς σωτηρίαν
  choice: நீங்கள் மீட்படைவதற்காக
  rationale: εἰς காட்டும் இலக்கு அல்லது விளைவை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: ἐν ἁγιασμῷ πνεύματος
  choice: ஆவியானவர் தூயவர்களாக்குவதன் மூலமும்
  rationale: ἁγιασμός என்பதன் செயல்முறை சார்ந்த பொருளையும் ἐν என்பதன் கருவிப் பொருளையும் தெரிவிக்கிறது; சூழலில் πνεῦμα பரிசுத்த ஆவியானவரைக் குறிக்கிறது.
- source_word: καὶ πίστει ἀληθείας
  choice: உண்மையின்மேல் வைக்கும் விசுவாசத்தின் மூலமும்
  rationale: ἀληθείας என்பதை πίστις என்பதன் பொருளாகப் புரிந்து, 'உண்மையில் விசுவாசம்' என்ற உறவைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: ἐν ἁγιασμῷ πνεύματος என்பதில் πνεύματος யாரைக் குறிக்கிறது?
  choice: ஆவியானவர்
  alternative: மனித ஆவி
  rationale: பவுலின் இந்த மீட்பியல் சூழலில் தூயவர்களாக்கும் செயல் பரிசுத்த ஆவியானவருடையதாக இருப்பதே இயல்பான வாசிப்பு; இருப்பினும் கிரேக்கத்தில் 'பரிசுத்த' என்ற அடைமொழி இங்கு இல்லை.
- issue: εἵλατο ὑμᾶς ὁ θεὸς என்பதன் கோட்பாட்டுச் சுட்டு
  choice: கடவுள் உங்களைத் தேர்ந்தெடுத்தார்
  alternative: கடவுள் உங்களைத் தமக்கென எடுத்துக்கொண்டார்
  rationale: தெய்வீகத் தேர்வை உரை கூறும் அளவிலேயே வழங்குகிறது; அதன் முறை அல்லது நிபந்தனை குறித்து எந்தச் சமயப் பிரிவின் தனிப்பட்ட விளக்கத்தையும் சேர்க்கவில்லை.
- issue: ἀπαρχήν / ἀπ’ ἀρχῆς பாட வேறுபாடு
  choice: முதற்கனியாக
  alternative: தொடக்கத்திலிருந்தே
  rationale: கொடுக்கப்பட்ட SBLGNT மூல உரையின் ἀπαρχήν பாடத்தை முதன்மை உரை பின்பற்றுகிறது; முக்கியமான மாற்றுப் பாடம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியம் தமிழில் இயல்பாக வாசிக்க இரு வாக்கியங்களாகப் பிரிக்கப்பட்டது. பாரம்பரிய வேதாகமச் சொல்லான “விசுவாசம்” தக்கவைக்கப்பட்டாலும், “பரிசுத்தமாக்குதல்” என்பதற்குப் பதிலாக எளிதில் புரியும் “தூயவர்களாக்குதல்” பயன்படுத்தப்பட்டது. இரு அடிக்குறிப்பு குறிப்பான்களும் தொடர்புடைய முதன்மை உரைப் பகுதிக்குப் பின் சேர்க்கப்பட்டுள்ளன.
