- from: ஆனால், ஆண்டவரால் அன்புகூரப்பட்ட சகோதரர்களே, உங்களுக்காக நாங்கள் எப்போதும் கடவுளுக்கு நன்றி செலுத்தக் கடமைப்பட்டிருக்கிறோம். ஏனெனில், ஆவியானவர் தூயவர்களாக்குவதன் மூலமும், உண்மையின்மேல் வைக்கும் விசுவாசத்தின் மூலமும் நீங்கள் மீட்படைவதற்காக, கடவுள் உங்களை முதற்கனியாகத் தேர்ந்தெடுத்தார்[a][b].
