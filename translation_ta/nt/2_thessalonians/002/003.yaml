reference: 2 Thessalonians 2:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μή τις ὑμᾶς ἐξαπατήσῃ κατὰ μηδένα τρόπον· ὅτι ἐὰν μὴ ἔλθῃ ἡ ἀποστασία πρῶτον καὶ ἀποκαλυφθῇ ὁ ἄνθρωπος τῆς ⸀ἀνομίας, ὁ υἱὸς τῆς ἀπωλείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/003.yaml
  text: Let no one deceive you in any way[a], because that day will not come unless the rebellion comes first and the man of lawlessness is revealed[b], the son of destruction.
translation:
  language: ta
  text: எவரும் எவ்விதத்திலும் உங்களை ஏமாற்றாதபடி பார்த்துக்கொள்ளுங்கள். ஏனெனில், முதலில் கிளர்ச்சி[a] ஏற்பட்டு, அக்கிரமத்தின் மனிதன்[b]—அழிவின் மகன்—வெளிப்படுத்தப்பட்டாலன்றி, அந்த நாள் வராது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விசுவாசத் துறப்பு’ அல்லது ‘விலகிப்போதல்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் தீர்மானமான ஒரு கிளர்ச்சியைக் குறிக்கலாம்; அது பெரும்பாலும் மத விசுவாசத்திலிருந்து விலகுவதாகவும் புரிந்துகொள்ளப்படுகிறது.
    reason: alternative_reading
  - marker: b
    text: சில கையெழுத்துப் பிரதிகளில் ‘அக்கிரமத்தின் மனிதன்’ என்பதற்குப் பதிலாக ‘பாவத்தின் மனிதன்’ என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: ἐξαπατήσῃ
  choice: ஏமாற்றாதபடி
  rationale: இவ்வினைச்சொல் ஏமாற்றுதல் அல்லது தவறாக வழிநடத்துதல் எனப் பொருள்படும். எச்சரிக்கையின் வலிமையை இயல்பான நவீனத் தமிழில் தெரிவிக்க ‘ஏமாற்று’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: κατὰ μηδένα τρόπον
  choice: எவ்விதத்திலும்
  rationale: எந்த முறையிலான ஏமாற்றத்திற்கும் இடமளிக்கக் கூடாது என்பதை வலியுறுத்தும் கிரேக்க மரபுத்தொடருக்கு இயல்பான தமிழாக்கம்.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய எச்சரிக்கைக்கான காரணத்தை அறிமுகப்படுத்துவதால் காரணப் பொருள் தெளிவாகத் தரப்பட்டது.
- source_word: ἐὰν μὴ ἔλθῃ
  choice: ஏற்பட்டு ... வெளிப்படுத்தப்பட்டாலன்றி, அந்த நாள் வராது
  rationale: முந்தைய வசனத்திலிருந்து புரிந்துகொள்ளப்படும் ‘அந்த நாள்’ தமிழில் தெளிவுக்காக வெளிப்படையாகச் சேர்க்கப்பட்டது. குறிப்பிட்ட நிகழ்வுகள் முதலில் நடப்பது அவசியம் என்பதையும் இவ்வமைப்பு காட்டுகிறது.
- source_word: ἀποστασία
  choice: கிளர்ச்சி
  rationale: இச்சொல் கலகம், கிளர்ச்சி அல்லது விசுவாசத்திலிருந்து விலகுதல் ஆகிய பொருட்களைக் கொண்டிருக்கலாம். குறிப்பாக மதத் துறப்பாக மட்டும் குறுக்காமல் அதன் பரந்த பொருளையும் விவாதத்திற்குரிய தெளிவின்மையையும் காக்க ‘கிளர்ச்சி’ பயன்படுத்தப்பட்டது.
- source_word: πρῶτον
  choice: முதலில்
  rationale: நிகழ்வுகளின் வரிசையை நேரடியாகக் குறிக்கிறது.
- source_word: ἀποκαλυφθῇ
  choice: வெளிப்படுத்தப்பட்டு
  rationale: அந்த மனிதன் வெளிப்படச் செய்யப்படுவதைச் சுட்டும் செயலப்பாட்டு வடிவத்தையும் வெளிப்பாட்டு நுண்ணுணர்வையும் காக்கிறது.
- source_word: ὁ ἄνθρωπος τῆς ἀνομίας
  choice: அக்கிரமத்தின் மனிதன்
  rationale: ἀνομία என்பதன் சட்டத்திற்கும் ஒழுங்கிற்கும் எதிரான தன்மையை ‘அக்கிரமம்’ இயல்பாகக் காட்டுகிறது; குறிப்பிட்ட ஓர் ஆண் நபரைக் குறிக்கும் ஒருமை ஆண்பால் வடிவம் ‘மனிதன்’ எனத் தக்கவைக்கப்பட்டது.
- source_word: ὁ υἱὸς τῆς ἀπωλείας
  choice: அழிவின் மகன்
  rationale: அழிவால் அடையாளப்படுத்தப்படுகிற அல்லது அழிவுக்கு உரிய ஒருவனைக் குறிக்கும் செமித்திய மரபுத்தொடரின் வடிவத்தைத் தமிழிலும் காக்கிறது.
theological_decisions:
- issue: ‘வராது’ என்பதற்கான மறைந்துள்ள எழுவாயை முந்தைய வசனத்திலிருந்து நிரப்புதல்
  choice: ‘அந்த நாள்’ என்பதைத் தமிழில் வெளிப்படையாகச் சேர்த்தல்
  alternative: ‘ஏனெனில், முதலில் கிளர்ச்சி ஏற்பட்டு... அல்லாமல்’ என்று வாக்கியத்தை மறை எழுவாயுடன் விடுதல்
  rationale: கிரேக்கத்தில் எழுவாய் முந்தைய வசனத்திலுள்ள ஆண்டவரின் நாளிலிருந்து தெளிவாகப் புரிகிறது. தமிழில் வாக்கியம் முழுமையாகவும் தெளிவாகவும் இருக்க, உடனடி சூழல் தரும் ‘அந்த நாள்’ சேர்க்கப்பட்டது.
- issue: ἀποστασία என்பதன் பொருள்
  choice: ‘கிளர்ச்சி’ என்ற பரந்த பொருள்
  alternative: ‘விசுவாசத் துறப்பு’ அல்லது ‘விலகிப்போதல்’
  rationale: இச்சொல் பொதுவான கிளர்ச்சியையோ மத விசுவாசத்திலிருந்து விலகுதலையோ குறிக்கலாம். விவாதத்திற்குரிய இறுதிக்கால விளக்கத்தை மொழிபெயர்ப்பிலேயே முடிவுசெய்யாமல் இருக்க பரந்த சொல் முதன்மைப் பாடத்தில் தரப்பட்டு, குறுகிய மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்பட்டது.
- issue: τῆς ἀνομίας இடத்திலுள்ள பாடவேறுபாடு
  choice: SBLGNT பாடத்தின்படி ‘அக்கிரமத்தின்’
  alternative: சில கையெழுத்துப் பிரதிகளின்படி ‘பாவத்தின்’
  rationale: வழங்கப்பட்ட மூலப்பாடம் ἀνομίας என்று வாசிப்பதால் அது முதன்மைப் பாடத்தில் பின்பற்றப்பட்டது. அறியப்பட்ட ἁμαρτίας பாடவேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
