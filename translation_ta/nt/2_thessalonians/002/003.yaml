  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘அக்கிரமத்தின் மனிதன்’, ‘அழிவின் மகன்’ ஆகிய அடையாளத் தொடர்கள் மூலத்தின் இறையியல் மற்றும் அபோகலிப்டிக் நுண்ணுணர்வைத் தக்கவைக்க ஓரளவு முறைசார்ந்த வடிவில் வைக்கப்பட்டுள்ளன. அடிக்குறிப்பு [a] அது விளக்கும் ‘கிளர்ச்சி’ என்ற சொல்லுக்குப் பின்னால் இடப்பட்டுள்ளது.
