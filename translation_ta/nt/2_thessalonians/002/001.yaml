  text: Ἐρωτῶμεν δὲ ὑμᾶς, ἀδελφοί, ὑπὲρ τῆς παρουσίας τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ ἡμῶν ἐπισυναγωγῆς ἐπ’ αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/001.yaml
  text: We ask you[a], brothers, concerning the coming of our Lord Jesus the Messiah and our gathering together to him[b],
translation:
  language: ta
  text: 'சகோதரர்களே[a], நம் ஆண்டவராகிய இயேசு மேசியாவின்[b] வருகையையும், அவரிடம் நாம் ஒன்றுகூடுவதையும் குறித்து உங்களைக் கேட்டுக்கொள்கிறோம்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சகோதரர்களே’ என்பது பவுலின் அழைப்புமுறை; இச்சூழலில் அவர் விசுவாசிகள் அனைவரையும்—ஆண்களையும் பெண்களையும்—நோக்கிப் பேசுகிறார் எனப் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘இயேசு கிறிஸ்துவின்.’ கிரேக்கப் பட்டமான Χριστός என்பதன் பொருளைப் பாதுகாக்க இங்கு ‘மேசியா’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐρωτῶμεν
  choice: உங்களைக் கேட்டுக்கொள்கிறோம்
  rationale: இங்கு வினைச்சொல் ஒரு கட்டளையை அல்ல, மேய்ப்புப் பணிக்குரிய கனிவான வேண்டுகோளை அறிமுகப்படுத்துகிறது. ‘கேட்டுக்கொள்கிறோம்’ என்பது அதன் மென்மையான வேண்டுகோள் வலிமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: தனி வார்த்தையாக மொழிபெயர்க்கப்படவில்லை
  rationale: δέ இங்கு வலுவான முரண்பாட்டைக் காட்டாமல் உரையின் புதிய தொடர்புடைய பகுதியைத் தொடங்குகிறது. தமிழில் வசனத் தொடக்கத்திலேயே அழைப்புமுறை இயல்பாக மாற்றத்தைக் காட்டுவதால், தேவையற்ற ‘இப்போது’ அல்லது ‘ஆனால்’ சேர்க்கப்படவில்லை.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: மூலத்தின் இலக்கண ஆண்பால் அழைப்புமுறை பாதுகாக்கப்படுகிறது. பவுல் முழு விசுவாசக் குழுவையும் நோக்கிப் பேசக்கூடிய சூழல் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ὑπὲρ
  choice: குறித்து
  rationale: இங்கு ὑπέρ பயனாளரைக் குறிக்காமல் விவாதிக்கப்படும் பொருளை அறிமுகப்படுத்துகிறது; ‘குறித்து’ தெளிவான, இயல்பான தமிழ்.
- source_word: παρουσίας
  choice: வருகை
  rationale: παρουσία அடிப்படையில் ‘இருப்பு’ அல்லது ‘வந்தடைதல்’ எனப் பொருள்படலாம்; இயேசுவைக் குறிக்கும் இவ்விறுதிக்காலச் சூழலில் அவரது எதிர்கால வருகையே நோக்கமாக உள்ளது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: κύριος என்பதன் அதிகாரத்தையும் புதிய ஏற்பாட்டில் நிலைபெற்ற இறையியல் வலிமையையும் ‘ஆண்டவர்’ காக்கிறது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மேசியா
  rationale: Χριστός இங்கு வெறும் பெயரின் பகுதியாக இல்லாமல் பட்டத்தின் பொருளைத் தக்கவைக்கிறது. ஆகவே ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற கருத்தைக் கொண்ட வழக்கமான பட்டமாக ‘மேசியா’ பயன்படுத்தப்படுகிறது; பாரம்பரிய ‘கிறிஸ்து’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐπισυναγωγῆς
  choice: நாம் ஒன்றுகூடுவது
  rationale: இந்தப் பெயர்ச்சொல் விசுவாசிகள் ஒருங்கே சேர்க்கப்படுதலைக் குறிக்கிறது. தமிழ் வினைப்பெயர் வடிவம் கூட்டு வலிமையை இயல்பாக வெளிப்படுத்தி, நிறுவனரீதியான ‘சபை’ என்ற தேவையற்ற கருத்தைத் தவிர்க்கிறது.
- source_word: ἐπ’ αὐτόν
  choice: அவரிடம்
  rationale: ἐπί மற்றும் குற்றுவேற்றுமை இங்கு மேசியாவை நோக்கிய நகர்வு அல்லது ஒன்றுகூடுதலின் திசையைக் குறிக்கின்றன; ‘அவரிடம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
theological_decisions:
- issue: Χριστοῦ என்ற கிறிஸ்தியல் பட்டத்தின் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இவ்விடத்தில் Χριστός என்பதன் பட்டத்தன்மை செயலில் உள்ளது. அதனால் அதன் பொருளைக் காட்டும் ‘மேசியா’ முதன்மை உரையில் வைக்கப்பட்டு, தமிழ் கிறிஸ்தவ மரபில் நிலைபெற்ற ‘கிறிஸ்து’ மாற்றாக அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἀδελφοί என்பதன் சூழல்சார் பரப்பு
  choice: சகோதரர்களே
  alternative: சகோதர சகோதரிகளே
  rationale: மூலத்தின் இலக்கண ஆண்பால் வடிவம் முதன்மை உரையில் காக்கப்படுகிறது; பவுல் முழுச் சபையாரையும் உள்ளடக்கி அழைக்கக்கூடிய சூழல்சார் பரப்பு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: ‘வருகை’க்கும் ‘நாம் ஒன்றுகூடுவது’க்கும் இடையிலான உறவு
  choice: இரண்டும் இணைப்புச் சொல்லால் ஒருங்கிணைக்கப்பட்ட, நெருக்கமாகத் தொடர்புடைய இரண்டு கருத்துகளாக விடப்பட்டுள்ளன
  alternative: அவரது வருகையின்போது நாம் ஒன்றுகூடுவது
  rationale: ὑπέρ என்பதன் கீழ் இரண்டு பெயர்ச்சொற்களையும் καί இணைக்கிறது; ஆனால் அவற்றின் துல்லியமான கால அல்லது தர்க்க உறவை விளக்கவில்லை. எனவே ஒரு குறிப்பிட்ட இறுதிக்காலத் திட்டத்தை மொழிபெயர்ப்பில் புகுத்தாமல் மூலத்தின் திறந்த ஒருங்கிணைப்பு பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்துவரும் வேண்டுகோளுக்கான முன்னுரையாக இருப்பதால் முடிவில் முக்காற்புள்ளி வைக்கப்பட்டுள்ளது. ‘நம்’ என்பது ‘நம்முடைய’ என்பதன் இயல்பான சுருக்கம்; ‘ஆண்டவராகிய’ என்ற அமைப்பு இயேசுவோடு பட்டத்தைத் தெளிவாக இணைக்கிறது.
