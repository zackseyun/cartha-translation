id: 2TH.2.15
reference: 2 Thessalonians 2:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἄρα οὖν, ἀδελφοί, στήκετε, καὶ κρατεῖτε τὰς παραδόσεις ἃς ἐδιδάχθητε εἴτε διὰ λόγου εἴτε δι’ ἐπιστολῆς ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/015.yaml
  text: So then[a], brothers, stand firm and hold fast to the traditions that you were taught, whether by word or by our letter.
translation:
  language: ta
  text: ஆகையால், சகோதரர்களே[a], உறுதியாக நில்லுங்கள்; வாய்மொழியாகவோ எங்கள் கடிதம் மூலமாகவோ உங்களுக்குக் கற்பிக்கப்பட்ட மரபுகளைப் பற்றிக்கொள்ளுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சகோதர சகோதரிகளே’; கிரேக்கத்தில் ‘சகோதரர்களே’ என்று உள்ளது; ஆனால் இச்சொல் முழுச் சபையையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: ஆகவே
  rationale: இரு முடிவுரைக் கூறுகளும் முந்தைய வாதத்திலிருந்து வரும் தீர்மானத்தை வலியுறுத்துகின்றன; நவீனத் தமிழில் ‘ஆகவே’ இயல்பாக அந்தத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: கிரேக்க ஆண்பால் பன்மை அழைப்பை நேரடியாகப் பிரதிபலிக்கிறது; இங்கு முழுச் சபையும் குறிக்கப்பட வாய்ப்புள்ளதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: στήκετε
  choice: உறுதியாக நில்லுங்கள்
  rationale: தொடர்ந்து நிலைத்திருக்க வேண்டும் என்ற நிகழ்காலக் கட்டளையின் வலிமையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: κρατεῖτε
  choice: உறுதியாகப் பற்றிக்கொள்ளுங்கள்
  rationale: விடாமல் இறுகப் பிடித்து, தொடர்ந்து கடைப்பிடிக்கும் பொருளை வலிமையாகக் கொண்டுவருகிறது.
- source_word: παραδόσεις
  choice: மரபுகளை
  rationale: παράδοσις என்பது கையளிக்கப்பட்ட அல்லது வழிவழியாக ஒப்படைக்கப்பட்டவற்றைக் குறிக்கிறது; ‘போதனைகள்’ என்பதைவிட ‘மரபுகள்’ அந்த ஒப்படைப்பு சார்ந்த பொருளைப் பாதுகாக்கிறது.
- source_word: ἐδιδάχθητε
  choice: நீங்கள் ... கற்பிக்கப்பட்ட
  rationale: சபையார் அப்போஸ்தல அறிவுறுத்தலைப் பெற்றவர்கள் என்பதைச் செயப்பாட்டு வடிவில் தக்கவைக்கிறது.
- source_word: διὰ λόγου
  choice: எங்கள் வாய்மொழியினால்
  rationale: கடிதத்துடன் உள்ள மாறுபாட்டில் λόγος பேசப்பட்ட செய்தியைக் குறிக்கிறது; ‘வாய்மொழி’ தமிழில் இதைத் தெளிவாகக் காட்டுகிறது.
- source_word: δι’ ἐπιστολῆς ἡμῶν
  choice: எங்கள் கடிதத்தினால்
  rationale: எழுத்து வழியாக வழங்கப்பட்ட அப்போஸ்தல அறிவுறுத்தலையும் ἡμῶν என்பதன் உடைமைப் பொருளையும் இயல்பாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: அப்போஸ்தல மரபு குறித்த விவாதங்களில் παράδοσις என்பதன் மொழிபெயர்ப்பு
  choice: மரபுகள்
  alternative: போதனைகள் / அறிவுறுத்தல்கள்
  rationale: இவ்வசனம் வாய்மொழியிலும் கடிதத்திலும் ஒப்படைக்கப்பட்ட அப்போஸ்தல உள்ளடக்கத்தை உறுதிப்படுத்துகிறது. ‘மரபுகள்’ மூலச்சொல்லின் ஒப்படைக்கப்பட்டவை என்ற பொருளைப் பாதுகாக்கிறது; ஆனால் பிற்கால மரபுகளின் வரம்பையோ அதிகாரத்தையோ இவ்வசனத்திலிருந்து தீர்மானிப்பதில்லை.
- issue: கலப்புப் பாலினச் சபையை நோக்கக்கூடிய ἀδελφοί என்ற அழைப்பு
  choice: சகோதரர்களே
  alternative: சகோதர சகோதரிகளே
  rationale: மூலத்தின் ஆண்பால் பன்மை வடிவம் முதன்மை உரையில் தக்கவைக்கப்படுகிறது; முழுச் சபையும் குறிக்கப்படலாம் என்ற உள்ளடக்கிய பயன்பாடு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உறுதியாக நில்லுங்கள்’ மற்றும் ‘உறுதியாகப் பற்றிக்கொள்ளுங்கள்’ ஆகிய இணைச் சொற்றொடர்கள் இரு நிகழ்காலக் கட்டளைகளின் தொடர்ச்சியையும் வலிமையையும் காட்டுகின்றன. வாய்மொழி–கடிதம் என்ற மாறுபாடு வெளிப்படையாக வைக்கப்பட்டுள்ளது.
