source:
  edition: SBLGNT
  text: ἵνα κριθῶσιν ⸀πάντες οἱ μὴ πιστεύσαντες τῇ ἀληθείᾳ ἀλλὰ εὐδοκήσαντες ⸀τῇ ἀδικίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/012.yaml
  text: so that all may be judged who did not believe the truth but took pleasure in unrighteousness[a].
translation:
  language: ta
  text: உண்மையை நம்பாமல், மாறாக அநீதியில் மகிழ்ந்த அனைவரும் தீர்ப்பிடப்படும்படியாக[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கண்டிக்கப்படும்படியாக.’ கிரேக்க வினைச்சொல் அடிப்படையில் ‘தீர்ப்பிடப்படுதல்’ என்பதைக் குறிக்கிறது; ஆனால் இச்சூழலில் அது பாதகமான தீர்ப்பையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: உள்ளாகும்படியாக
  rationale: முந்தைய வசனத்துடன் இணையும் நோக்கம் அல்லது விளைவைத் தெளிவாக ஒன்றாக மட்டும் வரையறுக்காமல், தமிழில் இயல்பான சார்பு வாக்கிய அமைப்பால் காட்டுகிறது.
- source_word: κριθῶσιν
  choice: நியாயத்தீர்ப்புக்கு உள்ளாக
  rationale: κρίνω என்பதன் அடிப்படை நீதித்துறைப் பொருளான ‘தீர்ப்பிடப்படுதல்’ என்பதைப் பாதுகாக்கிறது. சூழல் பாதகமான தீர்ப்பைக் குறிப்பிட்டாலும், முதன்மை உரையில் ‘தண்டனைத் தீர்ப்பு’ என்று பொருளை மேலும் வலுப்படுத்தவில்லை.
- source_word: πάντες
  choice: அனைவரும்
  rationale: மூலத்தின் முழுமையான பன்மைப் பொருளை இயல்பான தமிழில் நேரடியாகக் கொடுக்கிறது.
- source_word: οἱ μὴ πιστεύσαντες τῇ ἀληθείᾳ
  choice: உண்மையை நம்பாமல்
  rationale: பெயர்ச்சொல் தன்மையில் செயல்படும் இறந்தகாலப் பங்கேற்புச் சொல்லை, பின்னர் வரும் இணையான பங்கேற்புடன் பொருந்தும் இயல்பான தமிழ் வினையெச்சத் தொடராக வழங்குகிறது; ‘உண்மை’ இங்கு குறிப்பிட்ட நற்செய்தி உண்மையைக் குறிக்கும் வகையில் உள்ளது.
- source_word: ἀλλὰ
  choice: மாறுபட்ட இரு வினையெச்சத் தொடர்களின் எதிர்மறை இணைப்பு
  rationale: தமிழில் ‘நம்பாமல், ... மகிழ்ந்த’ என்ற அமைப்பே ‘அல்லாமல்/ஆனால்’ என்பதைக் கட்டாயமாகச் சேர்க்காமலும் கிரேக்கத்தின் தெளிவான முரண்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εὐδοκήσαντες
  choice: மகிழ்ந்த
  rationale: வெறும் ஒப்புதலை விட, மனவிருப்பத்தோடு இன்பம் கண்ட உணர்வையும் விருப்பத்தையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: τῇ ἀδικίᾳ
  choice: அநீதியில்
  rationale: பவுலின் அறநெறி மற்றும் இறையியல் சொல்லாட்சியைத் தக்கவைத்து, ‘தவறான செயல்’ என்பதைக் காட்டிலும் ἀδικία என்பதன் பரந்த பொருளை வழங்குகிறது.
theological_decisions:
- issue: κριθῶσιν என்பது பொதுவாக ‘தீர்ப்பிடப்படுதல்’ எனவா, தெளிவாக ‘கண்டனம்/தண்டனை பெறுதல்’ எனவா மொழிபெயர்க்கப்பட வேண்டும்?
  choice: நியாயத்தீர்ப்புக்கு உள்ளாக
  alternative: கண்டனத் தீர்ப்புக்கு உள்ளாக
  rationale: உடனடி சூழல் பாதகமான முடிவைக் குறித்தாலும், κρίνω என்ற வினை தன்னளவில் தீர்ப்பிடுதலைக் குறிக்கிறது. ஆகவே மூலத்தில் வெளிப்படையாகக் கூறப்பட்டதை விட வலுவான இறையியல் முடிவை முதன்மை உரையில் புகுத்தாமல், சூழலின் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இது முந்தைய வசனத்தைச் சார்ந்த ἵνα நோக்கம்/விளைவு வாக்கியம் என்பதால், மூலத்தைப் போலவே சார்பு வாக்கியமாக வைக்கப்பட்டுள்ளது. ‘நியாயத்தீர்ப்பு’ என்ற சொல் நீதித்துறை மற்றும் இறையியல் நுணுக்கத்தைத் தக்கவைக்கிறது.
