source:
  edition: SBLGNT
  text: καὶ διὰ τοῦτο ⸀πέμπει αὐτοῖς ὁ θεὸς ἐνέργειαν πλάνης εἰς τὸ πιστεῦσαι αὐτοὺς τῷ ψεύδει,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/011.yaml
  text: And because of this[a], God sends them a working of delusion so that they may believe the lie,
translation:
  language: ta
  text: இதன் காரணமாக, அவர்கள் அந்தப் பொய்யை நம்பும்படி, கடவுள் அவர்களுக்கு மயக்கத்தின் செயல்பாட்டை[a] அனுப்புகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மயக்கும் தாக்கத்தை,” “வஞ்சகச் செயல்பாட்டை”; மரபாக, “வலுவான மயக்கத்தை.”
    reason: ἐνέργειαν πλάνης என்ற சொற்றொடர் செயற்படும் மயக்கத்தையோ, மயக்கும் தாக்கத்தையோ, வஞ்சனையால் குறிக்கப்படும் செயல்பாட்டையோ உணர்த்தக்கூடும்.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: இதன் காரணமாக
  rationale: முந்தைய வசனத்தில் அவர்கள் உண்மையை நேசிக்க மறுத்ததைக் காரணமாகச் சுட்டுகிறது; வெறும் முடிவைக் குறிக்கும் ‘ஆகவே’ என்பதைவிட வெளிப்படையான காரணத் தொடர்பைப் பாதுகாக்கிறது.
- source_word: πέμπει
  choice: அனுப்புகிறார்
  rationale: நிகழ்கால வினையை இயல்பான நிகழ்காலமாகத் தருவதோடு, கடவுளின் நேரடியான செயலை மென்மையாக்காமல் பாதுகாக்கிறது.
- source_word: ἐνέργειαν πλάνης
  choice: மயக்கத்தின் செயலாற்றலை
  rationale: ἐνέργεια மற்றும் πλάνη ஆகிய இரு பெயர்ச்சொற்களின் உறவைத் தெளிவாக வைத்திருக்கிறது; இது மயக்கும் தாக்கமா, வஞ்சனையால் குறிக்கப்படும் செயற்பாடா என்ற பொருள் நுட்பத்தைத் தீர்மானித்துவிடாமல் பாதுகாக்கிறது.
- source_word: εἰς τὸ πιστεῦσαι
  choice: நம்பும்படி
  rationale: கிரேக்கத் தொடரிலுள்ள நோக்கம் அல்லது விளைவு என்ற இரு சாத்தியங்களையும் இயல்பான தமிழில் அளவுக்கு மீறித் தீர்மானிக்காமல் தருகிறது.
- source_word: τῷ ψεύδει
  choice: அந்தப் பொய்யை
  rationale: ஒருமையையும் குறிப்பிட்ட சுட்டையும் பாதுகாத்து, சூழலில் சட்டமற்றவனைச் சார்ந்த குறிப்பிட்ட பொய்யைக் குறிக்கக்கூடிய தன்மையை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: நியாயத்தீர்ப்பாக வரும் கடினப்படுத்துதலில் கடவுளின் செயற்பாடு
  choice: கடவுள் ... அனுப்புகிறார்
  alternative: கடவுள் மயக்கத்தின் செயலாற்றல் அவர்களிடம் வர அனுமதிக்கிறார்
  rationale: கிரேக்கத்தில் πέμπει என்பதன் எழுவாய் கடவுளே. ஆகவே, அதை வெறும் அனுமதியாக மென்மையாக்காமல், மனிதர்கள் உண்மையை நிராகரிப்பதற்குப் பதிலாக வரும் கடவுளின் நியாயத்தீர்ப்பு குறித்த இறையியல் பதற்றத்தை அப்படியே பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘மயக்கத்தின் செயலாற்றல்’ என்பது அன்றாடப் பேச்சைவிட சற்றே முறையான சொற்றொடராக இருந்தாலும், மூலத்தின் பெயர்ச்சொல் அமைப்பையும் அதன் பொருள் தெளிவின்மையையும் பாதுகாக்கத் தேர்ந்தெடுக்கப்பட்டது.
