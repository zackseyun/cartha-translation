revisions:
- from: இதன் காரணமாக, அவர்கள் அந்தப் பொய்யை நம்பும்படி, கடவுள் அவர்களிடம் மயக்கத்தின் செயலாற்றலை[a] அனுப்புகிறார்.
  to: இதன் காரணமாக, அவர்கள் அந்தப் பொய்யை நம்பும்படி, கடவுள் அவர்களுக்கு மயக்கத்தின் செயல்பாட்டை[a] அனுப்புகிறார்.
  rationale: The revision replaces the less idiomatic செயலாற்றல் with செயல்பாடு and uses the natural Tamil recipient form அவர்களுக்கு. It retains the source's direct statement that God sends this operative delusion, the causal connection, and the purpose/result clause without resolving interpretive or theological ambiguity.
