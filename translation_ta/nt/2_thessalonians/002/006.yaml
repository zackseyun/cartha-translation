  yaml_path: translation/nt/2_thessalonians/002/006.yaml
  text: And now you know what is restraining him[b][a], so that he may be revealed in his own time.
translation:
  language: ta
  text: இப்போது, அவர் தமக்குரிய காலத்தில் வெளிப்படுத்தப்படும்படி அவரைத் தடுத்துக்கொண்டிருப்பது எது என்பதை உங்களுக்குத் தெரியும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரைப் பின்னடக்கி வைத்திருப்பது எது.” கிரேக்க மொழி இங்கே நடுநிலை இலக்கண வடிவைப் பயன்படுத்துகிறது; தடுத்துக்கொண்டிருப்பது யார் அல்லது எது என்பதை அடையாளப்படுத்தவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ κατέχον
  choice: அவரைத் தடுத்துக்கொண்டிருப்பது எது
  rationale: நபரையோ சக்தியையோ அடையாளப்படுத்தாத கிரேக்க மொழியின் நடுநிலை ஒருமைப் பெயரெச்சத் தொடரை இயல்பான தமிழில் கேள்வியற்ற தொடர்புத் தொடராக வழங்குகிறது. αὐτόν என்பதையும் வெளிப்படையாகக் காட்டுகிறது.
- source_word: οἴδατε
  choice: உங்களுக்குத் தெரியும்
  rationale: முற்றுவடிவத்தில் இருந்தாலும் நிகழ்காலப் பொருள் தரும் வினையை இயல்பான நவீனத் தமிழில் வழங்குகிறது; முன்பு கற்பிக்கப்பட்டதை வாசகர்கள் அறிந்திருப்பதையும் காக்கிறது.
- source_word: εἰς τὸ ἀποκαλυφθῆναι αὐτόν
  choice: இதனால் அவர் ... வெளிப்படுத்தப்படுவார்
  rationale: εἰς + பெயராக்கப்பட்ட வினையெச்சம் இங்கு நோக்கம் அல்லது விளைவைக் குறிக்கலாம். ‘இதனால்’ என்பது அந்தத் தொடர்பை இயல்பாகக் காட்டி, செயப்பாட்டு வடிவத்தையும் காக்கிறது.
- source_word: ἐν τῷ ἑαυτοῦ καιρῷ
  choice: தமக்குரிய காலத்தில்
  rationale: ἑαυτοῦ என்பதின் தற்சுட்டுப் பொருளையும் καιρός என்பதின் ஏற்ற அல்லது குறிக்கப்பட்ட கால உணர்வையும் மிகையாக விளக்காமல் காக்கிறது.
- source_word: νῦν
  choice: இப்போது
  rationale: எளிய கால வினையடை; உரையாடலின் முன்னேற்றத்தை இயல்பாகக் குறிக்கிறது.
- source_word: αὐτόν
  choice: அவரை / அவர்
  rationale: முன்னர் குறிப்பிடப்பட்டு வெளிப்படுத்தப்படவிருக்கும் ஆண் நபரையே சுட்டுகிறது; அவர் யார் என்பதை மொழிபெயர்ப்பு கூடுதலாக நிர்ணயிக்கவில்லை.
theological_decisions:
- issue: தடுத்துக்கொண்டிருப்பதின் அடையாளம்
  choice: ‘அவரைத் தடுத்துக்கொண்டிருப்பது எது’ என்று நடுநிலையாக மொழிபெயர்த்து, அதை அடையாளப்படுத்தாமல் விடுதல்
  alternative: ரோம ஆட்சி, தூய ஆவி, ஒரு தேவதூத சக்தி, அல்லது கடவுளின் திட்டம் எனக் குறிப்பாக்குதல்
  rationale: τὸ κατέχον என்பது நடுநிலை இலக்கண வடிவம்; இந்த வசனம் தடுப்பது யார் அல்லது எது என்று சொல்லவில்லை. ஆகவே நீண்டகால விளக்கவுரை விவாதத்தை மொழிபெயர்ப்பில் தீர்மானிக்கவில்லை.
- issue: καιρός என்பதின் இறுதிக்காலப் பொருள்
  choice: ‘தமக்குரிய காலத்தில்’
  alternative: ‘அவருக்குக் குறிக்கப்பட்ட காலத்தில்’ அல்லது ‘உரிய காலத்தில்’
  rationale: καιρός குறிக்கப்பட்ட அல்லது ஏற்ற காலத்தைக் குறிக்கக்கூடும். முதன்மை உரை ἑαυτοῦ என்பதைக் காத்து, தெய்வீக நியமனம் என்ற கூடுதல் விளக்கத்தை நேரடியாகச் சேர்க்காமல் உள்ளது.
- issue: εἰς τὸ ἀποκαλυφθῆναι என்பதின் தொடர்பு
  choice: ‘இதனால் ... வெளிப்படுத்தப்படுவார்’ என்று நோக்கம்/விளைவு இரண்டுக்கும் இடமளித்தல்
  alternative: ‘அவர் வெளிப்படுத்தப்படுவதற்காக’ என்று நோக்கத்தை மட்டும் வலியுறுத்துதல்
  rationale: இந்த அமைப்பு நோக்கத்தையும் விளைவையும் சுட்டக்கூடும்; தமிழ் வடிவம் ஒன்றை மட்டும் கடுமையாக நிர்ணயிக்காமல் காரண-நோக்கத் தொடர்பை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவான, கண்ணியமான நடை. ‘தடுத்துக்கொண்டிருப்பது’ என்பது தொடரும் செயலை உணர்த்துகிறது; ‘தமக்குரிய’ என்பது ஆண் ஒருமை முன்னிலையின் தற்சுட்டுப் பொருளை இயல்பாகக் காக்கிறது. அடையாளம் தெரியாத தடுப்புச் சக்தி குறித்து பாலினம் அல்லது கோட்பாட்டைச் சேர்க்கவில்லை.
