  yaml_path: translation/nt/2_thessalonians/002/004.yaml
  text: the one who opposes and exalts himself over every so-called god or object of worship[a], so that he takes his seat in the temple of God[b], displaying himself as being God.
translation:
  language: ta
  text: எதிர்த்து நிற்பவனும், கடவுள் என்று அழைக்கப்படும் ஒவ்வொன்றிற்கும் அல்லது வழிபாட்டுப் பொருளான ஒவ்வொன்றிற்கும் மேலாகத் தன்னை உயர்த்திக்கொள்கிறவனுமான அவன், அதன் விளைவாகக் கடவுளின் ஆலயத்தில்[a] அமர்ந்து, தான் கடவுள் என்று தன்னைக் காட்டிக்கொள்கிறான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளின் பரிசுத்த இடத்தில்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தான் ஒரு கடவுள் என்று தன்னைக் காட்டிக்கொள்கிறான்.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀντικείμενος
  choice: எதிர்த்து நிற்பவன்
  rationale: இது பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட நிகழ்காலப் பங்கேற்புவினை. தனிப்பட்ட ஒரு தொழில்நுட்பப் பட்டத்தைச் சேர்க்காமல், தொடர்ந்து எதிர்க்கும் செயலை வெளிப்படுத்துகிறது.
- source_word: ὑπεραιρόμενος
  choice: தன்னை உயர்த்துகிறவன்
  rationale: நடுநிலை வடிவத்தின் தற்சுட்டுப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐπὶ πάντα λεγόμενον θεὸν ἢ σέβασμα
  choice: கடவுள் என்று சொல்லப்படும் எதற்கும் அல்லது வழிபாட்டுக்குரிய எதற்கும் மேலாக
  rationale: ἐπί இங்கு மேலான நிலையை உரிமைகோருவதைக் குறிக்கிறது; λεγόμενον அந்தப் பெயரிடலை மட்டும் தெரிவிக்கிறது, அதன் உண்மைத்தன்மையை உறுதிப்படுத்தவில்லை. ἢ என்பதன் ‘அல்லது’ இணைப்பும் காக்கப்பட்டுள்ளது.
- source_word: ὥστε
  choice: அதன் விளைவாக
  rationale: முன்னர் கூறப்பட்ட தன்னுயர்த்தலின் விளைவைத் தொடர்ந்து வரும் அமர்தல் காட்டுகிறது.
- source_word: εἰς τὸν ναὸν τοῦ θεοῦ
  choice: கடவுளின் ஆலயத்தில்
  rationale: ναός ஆலயம் அல்லது அதன் பரிசுத்த உட்பகுதியைக் குறிக்கலாம். ‘ஆலயம்’ இயல்பான முதன்மைத் தேர்வு; குறிப்பான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: καθίσαι
  choice: அமர்ந்து
  rationale: விளைவைக் குறிக்கும் வினையெச்ச அமைப்பில், குறிப்பிட்ட இடத்தில் அமரும் செயலைத் தெளிவாகவும் மிகைப்படுத்தாமலும் தருகிறது.
- source_word: ἀποδεικνύντα ἑαυτὸν
  choice: தன்னைக் காட்டிக்கொள்வான்
  rationale: ஒரு வாய்மொழிப் பிரகடனத்தை அவசியமாக்காமல், தன்னைப் பொதுவாக ஒரு குறிப்பிட்ட நிலையில் வெளிக்காட்டும் பொருளைப் பாதுகாக்கிறது.
- source_word: ὅτι ἔστιν θεός
  choice: தான் கடவுள் என்று
  rationale: ஆலயச் சூழலில் உச்சமான தெய்வீக உரிமைகோரலின் வலிமையை வெளிப்படுத்துகிறது; ஆனால் அவன் உண்மையில் கடவுள் என்று மொழிபெயர்ப்பு உறுதிப்படுத்துவதில்லை.
theological_decisions:
- issue: இறுதியில் வரும் கட்டுரையில்லாத θεός என்பதை ‘கடவுள்’ என்றா ‘ஒரு கடவுள்’ என்றா மொழிபெயர்ப்பது
  choice: தான் கடவுள் என்று
  alternative: தான் ஒரு கடவுள் என்று
  rationale: கடவுளின் ஆலயத்தில் அமரும் சூழல், உச்சமான தெய்வீக உரிமைகோரலைக் காட்டுகிறது. அதேவேளையில் கட்டுரையில்லாத கிரேக்கச் சொல் அனுமதிக்கும் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ναός என்பதை பொதுவாக ‘ஆலயம்’ என்றா குறிப்பாக ‘பரிசுத்த இடம்’ என்றா மொழிபெயர்ப்பது
  choice: கடவுளின் ஆலயம்
  alternative: கடவுளின் பரிசுத்த இடம்
  rationale: ‘ஆலயம்’ என்பது இயல்பான, தெளிவான தமிழ்; இது சொல்லப்படுவது நேரடியான கட்டடமா உருவகமான பரிசுத்தத் தளமா என்ற விளக்கவியல் கேள்வியைத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் பங்கேற்புவினைத் தொடர் தமிழில் தெளிவாக இருக்க இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது; ‘அல்லது’ மற்றும் விளைவுறவு வெளிப்படையாகக் காக்கப்பட்டுள்ளன.
