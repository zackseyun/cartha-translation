base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/010.yaml
  text: and with every deception of unrighteousness for those who are perishing[d][c][b][a], because they did not accept the love of the truth so as to be saved.
translation:
  language: ta
  text: அழிந்துகொண்டிருப்பவர்களிடம்[b] அநீதியான எல்லா வஞ்சகத்தோடும்[a] வருவான். ஏனெனில், அவர்கள் மீட்கப்படும்படி[d] சத்தியத்தின்மீதுள்ள அன்பை அவர்கள் ஏற்றுக்கொள்ளவில்லை[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: ‘அநீதியின் எல்லா வஞ்சகத்தோடும்.’'
    reason: lexical_alternative
  - marker: b
    text: 'வேறு மொழிபெயர்ப்பு: ‘அழிந்துகொண்டிருப்பவர்களிடையே’ அல்லது ‘அழிந்துகொண்டிருப்பவர்களுக்கு.’'
    reason: lexical_alternative
  - marker: c
    text: ‘ஏற்றுக்கொள்ளவில்லை’ என்பதற்கு ‘பெற்றுக்கொள்ளவில்லை’ அல்லது ‘வரவேற்கவில்லை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: d
    text: 'வேறு மொழிபெயர்ப்பு: ‘அவர்கள் மீட்கப்படுவதற்காக.’ இத்தொடர் நோக்கத்தையோ விளைவையோ குறிக்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπάτῃ
  choice: வஞ்சகத்தோடும்
  rationale: ἀπάτη என்பது ஏமாற்றுதல் அல்லது வஞ்சகத்தைக் குறிக்கிறது. சூழலில் செயற்படும் தவறான வழிநடத்தலை ‘வஞ்சகம்’ இயல்பாக வெளிப்படுத்துகிறது; ἐν என்பதன் உடனிகழ்வு/கருவிப் பொருளை ‘-தோடும்’ தக்கவைக்கிறது.
- source_word: ἀδικίας
  choice: அநீதியான
  rationale: இந்தப் பிறப்புநிலைச் சொல் வஞ்சகத்தின் ஒழுக்கத் தன்மையை வரையறுக்கிறது. தமிழில் ‘அநீதியான வஞ்சகம்’ என்பது இயல்பாகவும், ἀδικία என்பதன் ஒழுக்க-இறையியல் வலிமையைத் தக்கவைத்தும் உள்ளது.
- source_word: τοῖς ἀπολλυμένοις
  choice: அழிந்துகொண்டிருப்பவர்களிடம்
  rationale: நிகழ்காலப் பங்கேற்புவினை நடைபெற்று வரும் நிலையாக மொழிபெயர்க்கப்படுகிறது. ‘-இடம்’ என்பது வஞ்சகம் யாரை நோக்கிச் செயல்படுகிறது என்பதைக் காட்டுகிறது; மாற்றாக இடச்சூழலை வலியுறுத்தும் ‘அழிந்துகொண்டிருப்பவர்களிடையே’ என்பதும் சாத்தியம்.
- source_word: ἀνθ’ ὧν
  choice: ஏனெனில்
  rationale: இங்கு இச்சொற்றொடர் அவர்களுடைய நிலைக்கான காரணத்தை அறிமுகப்படுத்துகிறது. ‘ஏனெனில்’ அதன் காரணப்பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: τὴν ἀγάπην τῆς ἀληθείας
  choice: சத்தியத்தின்மீதுள்ள அன்பை
  rationale: சத்தியத்தை நேசித்து வரவேற்பதே சூழலில் கருத்தாக இருப்பதால், objective genitive பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘அன்பு’ ἀγάπη என்பதைக் நேரடியாகத் தக்கவைக்கிறது.
- source_word: ἐδέξαντο
  choice: ஏற்றுக்கொள்ளவில்லை
  rationale: δέχομαι என்பதற்கு பெறுதல், ஏற்றுக்கொள்ளுதல், வரவேற்றல் ஆகிய பொருள்கள் உண்டு. கருத்துருவான ‘அன்பு’ என்ற பொருளுடன் ‘ஏற்றுக்கொள்ளுதல்’ இயல்பாக அமைந்து, அவர்களுடைய மறுப்பையும் வெளிப்படுத்துகிறது.
- source_word: εἰς τὸ σωθῆναι αὐτούς
  choice: தாங்கள் மீட்கப்படும்படி
  rationale: εἰς உடன் வரும் பெயரெச்ச வினையெச்சத் தொடர் நோக்கம் அல்லது விளைவைச் சுட்டலாம். ‘மீட்கப்படும்படி’ அந்த இலக்குநோக்கிய நுணுக்கத்தைச் சுருக்கமாகத் தக்கவைக்கிறது; αὐτούς என்பதைக் ‘தாங்கள்’ தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: ‘அழிந்துகொண்டிருப்பவர்கள்’ என்பது முடிவாகத் தீர்மானிக்கப்பட்ட வகுப்பா அல்லது நடைபெற்று வரும் நிலையா?
  choice: அழிந்துகொண்டிருப்பவர்கள்
  alternative: அழிவுக்குத் தீர்ப்பிடப்பட்டவர்கள் / அழிக்கப்படுகிறவர்கள்
  rationale: ἀπολλυμένοις என்பது நிகழ்கால நடுநிலை/செயப்பாட்டு பங்கேற்புவினை. அதை நடைபெற்று வரும் நிலையாக மொழிபெயர்ப்பது, குறிப்பிட்ட இரட்சிப்பியல் அமைப்பை வசனத்தில் புகுத்தாமல் மூலத்தின் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
- issue: ‘சத்தியத்தின் அன்பு’ என்பது சத்தியத்தின்மீதான அன்பா அல்லது சத்தியம் அவர்களிடம் காட்டும் அன்பா?
  choice: சத்தியத்தின்மீதுள்ள அன்பு
  alternative: சத்தியத்தின் அன்பு
  rationale: பின்னணி அவர்கள் சத்தியத்தை ஏற்றுக்கொள்ளத் தவறியதைக் குறிக்கிறது; ஆகவே சத்தியத்தின்மீதான அன்பு என்ற objective genitive வாசிப்பு மிக இயல்பானது. எனினும் பிறப்புநிலையின் வடிவியல் சாத்தியத்தை முற்றிலும் மறைக்காமல் குறிப்பில் மாற்று வடிவம் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. வசனம் முந்தைய வசனத்தின் வாக்கியத்தைத் தொடர்வதால், தமிழில் கருத்தோட்டத்தைத் தெளிவாக்க ‘வருவான்’ சேர்க்கப்பட்டுள்ளது. ‘இரட்சிக்கப்பட’ என்பதற்குப் பதில் பொதுவாகப் புரியும் ‘மீட்கப்பட’ பயன்படுத்தப்பட்டுள்ளது.
