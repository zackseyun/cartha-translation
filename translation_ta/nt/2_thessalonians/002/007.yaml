revisions:
- from: ஏனெனில், நெறிமீறலின் மறைபொருள் ஏற்கெனவே செயல்பட்டுக்கொண்டிருக்கிறது. ஆனால் இப்போது அதைத் தடுத்து நிறுத்துகிறவர்[a], இடையிலிருந்து நீங்கும்வரை[b] தொடர்ந்து தடுத்து நிறுத்துவார்.
  to: ஏனெனில், நெறிமீறலின் மறைபொருள் ஏற்கெனவே செயல்பட்டுக்கொண்டிருக்கிறது; இப்போது தடுத்து நிறுத்துகிறவர்[a] இடையிலிருந்து நீங்கும்வரை[b] மட்டும் தடுத்து நிறுத்திக்கொண்டிருப்பார்.
