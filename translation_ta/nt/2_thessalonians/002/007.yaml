source:
  edition: SBLGNT
  text: τὸ γὰρ μυστήριον ἤδη ἐνεργεῖται τῆς ἀνομίας· μόνον ὁ κατέχων ἄρτι ἕως ἐκ μέσου γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/007.yaml
  text: For the mystery of lawlessness is already at work[b][a]; only the one who now restrains will do so until he is out of the way.
translation:
  language: ta
  text: ஏனெனில், நெறிமீறலின் மறைபொருள் ஏற்கெனவே செயல்பட்டுக்கொண்டிருக்கிறது; இப்போது தடுத்து நிறுத்துகிறவர்[a] இடையிலிருந்து நீங்கும்வரை[b] மட்டும் தடுத்து நிறுத்திக்கொண்டிருப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இப்போது தடுத்து வைத்திருப்பவர்’; தடுத்து நிறுத்துகிறவர் யார் என்று கிரேக்க உரை அடையாளம் காட்டவில்லை.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘அகற்றப்படும்வரை’ அல்லது ‘வழியிலிருந்து அகற்றப்படும்வரை.’ இது எவ்வாறு நிகழ்கிறது என்பதை கிரேக்க உரை வெளிப்படையாகக் கூறவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήριον
  choice: மறைபொருள்
  rationale: வெறும் புதிர் என்ற எண்ணத்தைத் தவிர்த்து, மறைந்திருந்தாலும் இப்போது செயல்பட்டுக்கொண்டிருக்கும் ஓர் உண்மையைக் குறிக்கும் பவுலின் சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: ἐνεργεῖται
  choice: செயல்பட்டுக்கொண்டிருக்கிறது
  rationale: ஏற்கெனவே தொடங்கி தற்போது தொடர்ந்து இயங்கிவரும் செயலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἀνομίας
  choice: நெறிமீறலின்
  rationale: சட்டமின்மை என்ற சொற்பொருளை மட்டும் குறுகலாகச் சுட்டாமல், கடவுளுடைய ஒழுங்குக்கு எதிரான மீறல் என்ற சூழல்சார் கருத்தைத் தருகிறது; அதேவேளையில் பொதுவான ‘தீமை’ என்று மங்கச் செய்யவில்லை.
- source_word: μόνον
  choice: ஆனால்
  rationale: முந்தைய கூற்றுக்கு வரம்பிடும் திருப்பத்தை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது; தொடர்ந்து தடுத்துநிறுத்துதல் அந்த வரம்பை வெளிப்படுத்துகிறது.
- source_word: ὁ κατέχων
  choice: இப்போது அதைத் தடுத்து நிறுத்துகிறவர்
  rationale: பெயரெச்ச அமைப்பையும் தடுக்கும் செயற்பாட்டையும் காக்கிறது; அந்த நபர் யார் என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை. தமிழில் பொருள் தெளிவாக இருக்க ‘அதை’ என்பது சூழலிலிருந்து நிரப்பப்பட்டுள்ளது.
- source_word: ἄρτι
  choice: இப்போது
  rationale: தடுக்கும் செயல் தற்போதைய காலத்தில் நடைபெறுவதை நேரடியாகக் குறிக்கிறது.
- source_word: ἕως ἐκ μέσου γένηται
  choice: இடையிலிருந்து நீங்கும்வரை
  rationale: ஒருவர் இடையிலிருந்து அல்லது தடுக்கும் நிலையிலிருந்து விலகியிருக்கும் முடிவுநிலையைத் தருகிறது; அவரை யாரோ அகற்றுவதாக வெளிப்படையாகக் கூறாமல் கிரேக்கத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ὁ κατέχων என்பவரின் அடையாளம்
  choice: ‘இப்போது அதைத் தடுத்து நிறுத்துகிறவர்’ என்று பொதுவாக மொழிபெயர்த்து, அவரை அடையாளப்படுத்தாமல் விடுதல்.
  alternative: ரோம அரசு, மனித ஆட்சி, பரிசுத்த ஆவி, ஒரு தேவதூதர், பவுல் அல்லது அப்போஸ்தலப் பிரசங்கம் என அடையாளப்படுத்துதல்.
  rationale: இவ்வசனத்தின் கிரேக்க உரை தடுக்கிற ஒருவரைக் குறிப்பிடுகிறது; ஆனால் அவர் யார் என்று கூறவில்லை. விவாதத்துக்குரிய இறுதிக்கால விளக்கத்தை மொழிபெயர்ப்புக்குள் கொண்டுவராமல் மூலத்தின் தெளிவின்மையைப் பாதுகாக்க வேண்டும்.
- issue: ἕως ἐκ μέσου γένηται என்பதில் செயலை நிகழ்த்துபவர் யார் என்பது
  choice: ‘இடையிலிருந்து நீங்கும்வரை’ என்று, வெளிப்புறச் செயற்பாட்டாளரைச் சுட்டாத வடிவைப் பயன்படுத்துதல்.
  alternative: ‘அகற்றப்படும்வரை’ அல்லது ‘வழியிலிருந்து எடுத்துப்போடப்படும்வரை’ என்று மொழிபெயர்த்தல்.
  rationale: கிரேக்கச் சொற்றொடர் இடையிலிருந்து நீங்கியிருக்கும் நிலையைத் தெரிவிக்கலாம்; யார் அல்லது எது இதை நிகழ்த்துகிறது என்பதை வெளிப்படையாகக் கூறவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடையைப் பயன்படுத்துகிறது. ‘மறைபொருள்’ மற்றும் ‘நெறிமீறல்’ ஆகியவை இறையியல் செறிவைத் தக்கவைத்தும் பழமையான அல்லது பிரிவுசார் சொற்களைத் தவிர்த்தும் உள்ளன. கிரேக்கத்தில் விடுபட்டுள்ள தொடர்ச்சியான தடுக்கும் செயல், தமிழில் முழுமையான வாக்கியமாக அமைய ‘தொடர்ந்து தடுத்து நிறுத்துவார்’ என்று வெளிப்படுத்தப்பட்டுள்ளது.
