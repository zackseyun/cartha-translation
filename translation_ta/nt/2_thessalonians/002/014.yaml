revisions:
- from: இதற்கே அவர் எங்கள் நற்செய்தியின் மூலம் உங்களை அழைத்தார்; நம்முடைய ஆண்டவராகிய இயேசு மெசியாவின்[a] மகிமையை நீங்கள் பெற்றுக்கொள்ளும்படியாக[b] அப்படி அழைத்தார்.
  to: இதற்காகவே அவர் எங்கள் நற்செய்தியின் மூலம் உங்களை அழைத்தார்; நம்முடைய ஆண்டவராகிய இயேசு மேசியாவின்[a] மகிமையைப் பெற்றுக்கொள்ளும்படியாக[b].
  rationale: The revision removes the source-unrepresented repetition of ‘called,’ uses a more idiomatic Tamil expression for the relative-purpose connection, and standardizes ‘Messiah’ as “மேசியா.” It retains the deliberately broad rendering ‘பெற்றுக்கொள்ளுதல்’ for περιποίησις and preserves its lexical alternatives in the anchored footnote.
  reviewer_model: gpt-5.6-terra
