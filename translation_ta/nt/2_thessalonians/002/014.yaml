id: 2TH.2.14
reference: 2 Thessalonians 2:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰς ⸀ὃ ἐκάλεσεν ὑμᾶς διὰ τοῦ εὐαγγελίου ἡμῶν, εἰς περιποίησιν δόξης τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/014.yaml
  text: to which he called you through our gospel[b][a], for obtaining the glory of our Lord Jesus the Messiah.
translation:
  language: ta
  text: இதற்காகவே அவர் எங்கள் நற்செய்தியின் மூலம் உங்களை அழைத்தார்; நம்முடைய ஆண்டவராகிய இயேசு மேசியாவின்[a] மகிமையைப் பெற்றுக்கொள்ளும்படியாக[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, மரபாக, “நம்முடைய ஆண்டவராகிய இயேசு கிறிஸ்துவின்.”
    reason: alternative_reading
  - marker: b
    text: “மகிமையைப் பெற்றுக்கொள்ளும்படியாக” என்பதை “மகிமையை உரிமையாக்கிக்கொள்ளும்படியாக” அல்லது “மகிமையில் பங்குபெறும்படியாக” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: இதற்கே
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட மீட்பு, ஆவியானவரால் தூய்மையாக்கப்படுதல், சத்தியத்தை நம்புதல் ஆகிய கருத்துத் தொகுப்பைச் சுட்டுகிறது. எந்த ஒரு முன்னிலையையும் மட்டும் குறிப்பதாகச் சுருக்காமல், கிரேக்கத்தின் பின்னோக்கிச் சுட்டும் இயல்பை இது காக்கிறது.
- source_word: ἐκάλεσεν
  choice: அவர் ... அழைத்தார்
  rationale: இங்கே மறைமுக எழுவாய் கடவுள். ‘அழைத்தார்’ என்பது பவுலின் மீட்புசார் பயன்பாட்டின் வலிமையைத் தக்கவைத்தும், அந்த அழைப்பின் செயல்முறையை ஒரு குறிப்பிட்ட இறையியல் முறையில் வரையறுக்காமலும் உள்ளது.
- source_word: διὰ τοῦ εὐαγγελίου ἡμῶν
  choice: எங்கள் நற்செய்தியின் மூலம்
  rationale: διά + genitive குறிக்கும் கருவி அல்லது வழிமுறையை ‘மூலம்’ தெளிவாக வெளிப்படுத்துகிறது. ‘எங்கள் நற்செய்தி’ என்பது அப்போஸ்தலர்கள் அறிவித்த நற்செய்தியைக் குறிக்கும் பவுலின் சுருக்கமான சொல்லாட்சியையே தக்கவைக்கிறது.
- source_word: εἰς περιποίησιν
  choice: பெற்றுக்கொள்ளும்படியாக
  rationale: περιποίησις என்பதன் பெறுதல், உடைமையாக்குதல், உரிமைபெறுதல் ஆகிய பொருள் வரம்புகளில், இங்கு மகிமையை இலக்காகப் பெறுவதை இயல்பான தமிழில் இது தெரிவிக்கிறது. சாத்தியமான ‘பங்குபெறுதல்’ நுணுக்கம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: δόξης
  choice: மகிமையை
  rationale: περιποίησις என்பதற்கான நிறைவு/செயப்படுபொருள் உறவைத் தமிழில் இயல்பாகக் காட்டுகிறது; இறுதிக்கால ஆண்டவரின் மகிமை என்ற குறிப்பிட்ட கருத்தையும் ‘மகிமை’ தக்கவைக்கிறது.
- source_word: τοῦ κυρίου ἡμῶν
  choice: நம்முடைய ஆண்டவராகிய
  rationale: κύριος என்பதன் வழக்கமான புதிய ஏற்பாட்டு பட்டத்தையும் இறையியல் முக்கியத்துவத்தையும் ‘ஆண்டவர்’ காக்கிறது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியா
  rationale: Χριστός இங்கு பட்டத்தின் பொருளைத் தக்கவைத்திருப்பதால் ‘மெசியா’ பயன்படுத்தப்படுகிறது. தமிழின் உருபியல் தொடரில் ‘இயேசு மெசியாவின்’ என இயல்பாக இணைக்கப்பட்டுள்ளது; பாரம்பரிய ‘கிறிஸ்து’ அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: பவுலின் மீட்பியலில் கடவுளுடைய அழைப்பின் இயல்பு
  choice: ‘அவர் ... அழைத்தார்’ என்று மட்டும் மொழிபெயர்த்தல்
  alternative: ‘தவறாமல் இரட்சிப்புக்குள் அழைத்தார்’ அல்லது ‘அழைப்பு விடுத்தார்’
  rationale: கடவுள் நற்செய்தியின் மூலம் அழைத்தார் என்பதை வசனம் கூறுகிறது. ஆனால் அந்த அழைப்பை ஒரு குறிப்பிட்ட அருளியல் கோட்பாட்டின்படி விளக்குவதோ, அதை வெறும் அழைப்பிதழாக மெலிதாக்குவதோ மொழிபெயர்ப்பின் பணி அல்ல.
- issue: Χριστοῦ என்பதன் பட்டப்பொருள்
  choice: முதன்மை உரையில் ‘மெசியா’
  alternative: ‘கிறிஸ்து’
  rationale: இங்கு Χριστός வெறும் பெயரின் பகுதியாக மட்டுமல்லாமல் பட்டப்பொருளையும் கொண்டுள்ளது. ஆகவே பொருளை வெளிப்படுத்தும் ‘மெசியா’ முதன்மை உரையில் வைக்கப்பட்டு, மரபான வடிவம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: περιποίησιν δόξης என்பதன் உறவு
  choice: ஆண்டவருடைய மகிமையைப் பெற்றுக்கொள்ளுதல்
  alternative: அந்த மகிமையை உடைமையாக்குதல் அல்லது அதில் பங்குபெறுதல்
  rationale: கிரேக்கச் சொற்றொடர் பெறுதல்/உடைமை என்ற கருத்தை நேரடியாகத் தருகிறது; சூழலில் மகிமையில் பங்குபெறுதல் என்ற பொருளும் சாத்தியம். முதன்மை உரை பரந்த ‘பெற்றுக்கொள்ளுதல்’ என்பதைக் கொண்டு, நுணுக்கங்களை அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் வேதாகமத்திற்குரிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் இரு εἰς தொடர்களையும் தமிழில் சொற்சொல்லாகப் பின்பற்றினால் ஏற்படும் செயற்கைத் தன்மையைத் தவிர்க்க அரைப்புள்ளிக்குப் பின் நோக்கத்தைத் தெளிவுபடுத்தும் ‘அப்படி அழைத்தார்’ சேர்க்கப்பட்டுள்ளது; இது புதிய தகவலைச் சேர்க்காமல் கிரேக்கத்தின் நோக்கத் தொடர்பை வெளிப்படுத்துகிறது.
