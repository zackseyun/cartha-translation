lexical_decisions:
- source_word: Αὐτὸς
  choice: தாமே
  rationale: தீவிரச் சுட்டுப்பெயரின் வலியுறுத்தலை இயல்பான, மரியாதைமிக்க தமிழில் காக்கிறது; ஒருங்கிணைந்த இரு எழுவாய்களையும் சேர்த்து வலியுறுத்தும் இடத்தில் வைக்கப்பட்டுள்ளது.
- source_word: δὲ
  choice: வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது மென்மையான உரைமாற்ற இணைப்பாக உள்ளது. தனியாக ‘இப்போது’ அல்லது வலுவான ‘ஆனால்’ எனச் சேர்ப்பது மூலத்தில் இல்லாத கால அல்லது முரண்பாட்டு நிழலை உருவாக்கலாம்.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: இயேசுவுக்குரிய பட்டமாக இயல்பும் மரியாதையும் கொண்ட நிலையான தமிழ் இணைச்சொல்.
- source_word: Ἰησοῦς Χριστὸς
  choice: இயேசு மேசியா
  rationale: Χριστός இங்கு பொருளுள்ள பட்டமாக இருப்பதால், அதை வெறும் பெயர்போல் மறைக்காமல் ‘மேசியா’ என்று வழங்குகிறது.
- source_word: θεὸς ὁ πατὴρ ἡμῶν
  choice: நம்முடைய தந்தையாகிய கடவுள்
  rationale: θεός மற்றும் πατήρ இரண்டையும் காத்து, அவற்றின் அடையாள உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὁ ἀγαπήσας
  choice: நம்மை அன்புகூர்ந்து
  rationale: இறந்தகாலப் பங்கேற்பு வடிவத்தை இயல்பான தமிழ் வினையெச்சத் தொடராக வழங்குகிறது; அன்பின் செயலை மிகையாக காலவிளக்கமின்றி காக்கிறது.
- source_word: δοὺς
  choice: நமக்குக் கொடுத்த
  rationale: ἀγαπήσας உடன் இணைந்த கொடைச் செயலை நேரடியான இறந்தகால உறவுவினையாக வழங்குகிறது.
- source_word: παράκλησιν
  choice: ஊக்கம்
  rationale: சூழலில் விசுவாசிகளை உறுதிப்படுத்தும் பொருளைத் தெளிவாகக் காட்டுகிறது. ‘ஆறுதல்’, ‘தேற்றுதல்’ ஆகியவையும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: αἰωνίαν
  choice: நித்திய
  rationale: ஊக்கத்தின் முடிவில்லாத, நிலையான தன்மையைச் சுருக்கமாகவும் மரியாதைமிக்க தமிழிலும் காக்கிறது.
- source_word: ἐλπίδα ἀγαθὴν
  choice: நல்ல நம்பிக்கை
  rationale: பெயரடையின் நேர்மறை மதிப்பையும் நம்பிக்கையின் தரத்தையும் விரிவாக்கமின்றி காக்கிறது.
- source_word: ἐν χάριτι
  choice: கிருபையினால்
  rationale: 'ἐν என்பதன் கருவி அல்லது காரண நிழலை இங்கு இயல்பாக வெளிப்படுத்துகிறது: இக்கொடைகள் கிருபையினால் அளிக்கப்பட்டவை.'
theological_decisions:
- issue: ஒருங்கிணைந்த ‘ஆண்டவர் இயேசு மேசியா’ மற்றும் ‘தந்தையாகிய கடவுள்’ ஆகிய எழுவாய்களுக்குப் பின் வரும் ஒருமை வடிவிலான ὁ ἀγαπήσας, δοὺς என்பவற்றின் தொடர்பு
  choice: விளக்கத் தொடரை ஒருமுறை மட்டுமே வழங்கி, அது யாரை மட்டும் குறிக்கிறது என்று மொழிபெயர்ப்பில் தீர்மானிக்காமல் மூலத்தின் திறந்த அமைப்பைக் காத்தல்
  alternative: அந்த விளக்கத் தொடர் தந்தையாகிய கடவுளை மட்டும் குறிக்கிறது என்று வெளிப்படையாக அமைத்தல்; அல்லது இருவரையும் வெளிப்படையாக அதன் முன்னோடிகளாக விரிவாக்குதல்
  rationale: கிரேக்கத்தில் இரண்டு எழுவாய்கள் ஒருங்கிணைக்கப்பட்ட பின்னர் ஒருமை வடிவிலான விளக்கச் சொற்கள் வருகின்றன. தமிழ் வடிவம் இதை ஒரு விளக்கத் தொடராக வைத்திருந்து, கிறிஸ்துவியல் முடிவை மிகைப்படுத்தவோ தளர்த்தவோ செய்யாமல் உண்மையான இலக்கணத் திணறலைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு புரியும் மரியாதைமிக்க நடையைப் பயன்படுத்துகிறது. இந்த வசனம் அடுத்த வசனத்தில் நிறைவுபெறும் வேண்டுதல் வாக்கியத்தின் தொடக்கம் என்பதால் முடிவில் முற்றுப்புள்ளி இடப்படவில்லை; இடைக்கோடுகள் நீண்ட எழுவாய் மற்றும் அதனை விளக்கும் தொடரை வாசிக்க உதவுகின்றன.
