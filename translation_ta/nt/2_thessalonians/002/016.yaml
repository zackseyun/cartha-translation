translation:
  language: ta
  text: நம்முடைய ஆண்டவராகிய இயேசு மேசியாவும், நம்முடைய தந்தையாகிய கடவுளும் தாமே, நம்மை அன்புகூர்ந்து, கிருபையினால் நித்திய ஊக்கத்தையும்[a] நல்ல நம்பிக்கையையும் நமக்குக் கொடுத்தவராய்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஊக்கம்” என்பதற்குப் பதிலாக “ஆறுதல்” அல்லது “தேற்றுதல்” என்றும் மொழிபெயர்க்கலாம் (παράκλησιν).
