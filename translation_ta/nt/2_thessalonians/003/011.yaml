reference: 2 Thessalonians 3:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀκούομεν γάρ τινας περιπατοῦντας ἐν ὑμῖν ἀτάκτως, μηδὲν ἐργαζομένους ἀλλὰ περιεργαζομένους·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/011.yaml
  text: For we hear that some among you are walking disorderly[a], doing no work at all[b], but meddling.
translation:
  language: ta
  text: ஏனெனில், உங்களிடையே சிலர் ஒழுங்கின்றி வாழ்கிறார்கள்[a] என்றும், எந்த வேலையும் செய்யாமல்[b] பிறர் காரியங்களில் தலையிடுகிறார்கள் என்றும் கேள்விப்படுகிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சோம்பலாக வாழ்கிறார்கள்’ அல்லது ‘கட்டுப்பாடற்ற விதத்தில் வாழ்கிறார்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினையடை, சமூகத்தில் எதிர்பார்க்கப்படும் ஒழுங்கிற்கு மாறான அல்லது சோம்பலான நடத்தையைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'கிரேக்கத்தில் ஒரு சொல்விளையாட்டு உள்ளது: அவர்கள் எந்த ‘வேலையும் செய்வதில்லை’; ஆனால் தங்களுக்குச் சம்பந்தமில்லாத காரியங்களைச் சுற்றி ‘வேலை செய்கிறார்கள்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούομεν
  choice: கேள்விப்படுகிறோம்
  rationale: நிகழ்கால வினை வடிவம் தற்போது கிடைத்துவரும் செய்தியையோ தொடர்ந்த அறிதலையோ குறிக்கிறது; ‘கேள்விப்படுகிறோம்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான காரணத்தை அல்லது விளக்கத்தை அறிமுகப்படுத்தும் இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: τινας
  choice: சிலர்
  rationale: சமூகத்திற்குள் பெயர் குறிப்பிடப்படாத ஒரு பகுதியினரைக் குறிக்கும் இயல்பான சுருக்கமான மொழிபெயர்ப்பு.
- source_word: περιπατοῦντας
  choice: வாழ்கிறார்கள்
  rationale: இங்கு ‘நடத்தல்’ என்பது வாழ்க்கை முறை அல்லது நடத்தை குறிக்கும் கிரேக்க மரபுத்தொடர்; தமிழில் ‘வாழ்கிறார்கள்’ அதனை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν ὑμῖν
  choice: உங்களிடையே
  rationale: தெசலோனிக்கேய விசுவாசச் சமூகத்தின் நடுவில் இருப்பதைக் குறிக்கிறது.
- source_word: ἀτάκτως
  choice: ஒழுங்கின்றி
  rationale: சமூக ஒழுங்குக்கு மாறாக, கட்டுப்பாடின்றி அல்லது சோம்பலாக நடப்பது என்ற பரந்த பொருளைத் தக்கவைக்கிறது; அதை வெறும் சோம்பலாக மட்டும் குறுக்கவில்லை.
- source_word: μηδὲν ἐργαζομένους
  choice: எந்த வேலையும் செய்யாமல்
  rationale: μηδέν தரும் முழுமையான மறுப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀλλὰ
  choice: ஆனால் என்ற தனிச் சொல் இல்லாமல் ‘செய்யாமல் … தலையிடுகிறார்கள்’ என்ற எதிர்மறை அமைப்பு
  rationale: கிரேக்கத்தின் வலுவான முரண்பாட்டை தமிழின் இயல்பான ‘செய்யாமல் …’ அமைப்பு தெளிவாகக் காட்டுகிறது.
- source_word: περιεργαζομένους
  choice: பிறர் காரியங்களில் தலையிடுகிறார்கள்
  rationale: தமக்குரிய வேலையைச் செய்யாமல் பொருத்தமற்ற பிற காரியங்களில் ஈடுபடுவதை நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது; ἐργάζομαι உடனான சொல்விளையாட்டு அடிக்குறிப்பில் சுட்டப்படுகிறது.
