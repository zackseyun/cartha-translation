translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘நடக்கிறார்கள்’ என்ற கிரேக்க உருவகத்தைச் சொற்சொல்லாகத் தராமல், தமிழில் வாழ்க்கை நடத்தையை இயல்பாகக் குறிக்கும் ‘வாழ்கிறார்கள்’ பயன்படுத்தப்பட்டது. இரண்டு அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் சேர்க்கப்பட்டுள்ளன.
