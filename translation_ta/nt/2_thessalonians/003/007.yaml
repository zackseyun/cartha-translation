revisions:
- from: நாங்கள் நடந்துகொண்டதைப் போல நீங்கள் எப்படி நடந்துகொள்ள வேண்டும் என்பது உங்களுக்கே தெரியும்; ஏனெனில், நாங்கள் உங்களிடையே ஒழுங்கின்றி நடந்துகொள்ளவில்லை.[a]
  to: நீங்கள் எங்களை எவ்வாறு பின்பற்ற வேண்டும் என்பது உங்களுக்கே தெரியும்; ஏனெனில், நாங்கள் உங்களிடையே ஒழுங்கீனமாக நடக்கவில்லை.[a]
  rationale: The revision restores the Greek's direct expression “imitate us” while retaining δεῖ as “வேண்டும்,” the emphatic force of αὐτοὶ in “உங்களுக்கே,” and the broad sense of ἀτακτέω in the main text. The note retains the immediate contextual alternative, “idle,” in idiomatic Tamil.
