source:
  edition: SBLGNT
  text: αὐτοὶ γὰρ οἴδατε πῶς δεῖ μιμεῖσθαι ἡμᾶς, ὅτι οὐκ ἠτακτήσαμεν ἐν ὑμῖν
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/007.yaml
  text: For you yourselves know how you ought to imitate us[a], because we did not behave disorderly among you.
translation:
  language: ta
  text: நீங்கள் எங்களை எவ்வாறு பின்பற்ற வேண்டும் என்பது உங்களுக்கே தெரியும்; ஏனெனில், நாங்கள் உங்களிடையே ஒழுங்கீனமாக நடக்கவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இந்தச் சூழலில் இன்னும் குறிப்பாக, “நாங்கள் உங்களிடையே சோம்பலாக இருந்ததில்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: உங்களுக்கே
  rationale: எழுவாயில் உள்ள வலியுறுத்தலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான விளக்கத்தை அறிமுகப்படுத்தும் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: οἴδατε
  choice: தெரியும்
  rationale: வடிவில் நிறைவுக்காலமாக இருந்தாலும், இங்கு நிகழ்கால அறிவை இயல்பாகக் குறிக்கிறது.
- source_word: πῶς δεῖ μιμεῖσθαι ἡμᾶς
  choice: நாங்கள் நடந்துகொண்டதைப் போல நீங்கள் எப்படி நடந்துகொள்ள வேண்டும்
  rationale: μιμεῖσθαι என்பதன் முன்மாதிரியைப் பின்பற்றும் கருத்தையும் δεῖ என்பதன் கடப்பாட்டையும் இயல்பான தமிழில் காக்கிறது; வெறும் வெளிப்புற நகலெடுப்பைக் குறிக்கும் சொல் தவிர்க்கப்படுகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: அவர்கள் எவ்வாறு பின்பற்ற வேண்டும் என்பதை அறிந்திருப்பதற்கான அடிப்படையாகத் தூதர்களின் நடத்தை முன்வைக்கப்படுவதை காரணத் தொடர்புடன் காட்டுகிறது.
- source_word: οὐκ ἠτακτήσαμεν
  choice: ஒழுங்கின்றி நடந்துகொள்ளவில்லை
  rationale: ἀτακτέω என்பதன் பரந்த ஒழுங்கற்ற அல்லது கட்டுப்பாடற்ற நடத்தை என்ற பொருளைக் காக்கிறது; சோம்பியிருத்தல் என்ற சூழல்சார் குறுகிய பொருளை முதன்மை உரையில் மட்டும் நிர்ணயிக்கவில்லை.
- source_word: ἐν ὑμῖν
  choice: உங்களிடையே
  rationale: தெசலோனிக்கேயரின் நடுவில் இருந்தபோதைய நடத்தையை இயல்பாகக் குறிக்கிறது.
theological_decisions:
- issue: ἀτακτέω என்பதன் உடனடிச் சூழலிலான பொருள்
  choice: ஒழுங்கற்ற அல்லது கட்டுப்பாடற்ற நடத்தை என்ற பரந்த பொருள்
  alternative: குறிப்பாக, உங்களிடையே சோம்பியிருக்கவில்லை
  rationale: இந்த அதிகாரத்தில் வேலை செய்ய மறுப்பது முக்கியமான சூழலாக இருந்தாலும், கிரேக்க வினை அதைவிடப் பரந்த பொருளைக் கொண்டது. ஆகவே முதன்மை உரை பரந்த பொருளைக் காக்கிறது; சூழல்சார் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பின்பற்றுதல்’ என்ற கருத்தை தமிழில் தெளிவாக்க, ‘நாங்கள் நடந்துகொண்டதைப் போல ... நடந்துகொள்ள’ என்ற அமைப்பு தேர்ந்தெடுக்கப்பட்டது; δεῖ என்பதன் கடப்பாடு ‘வேண்டும்’ என்பதால் காக்கப்பட்டுள்ளது.
