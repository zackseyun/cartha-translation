reference: 2 Thessalonians 3:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πεποίθαμεν δὲ ἐν κυρίῳ ἐφ’ ὑμᾶς, ὅτι ἃ ⸀παραγγέλλομεν καὶ ποιεῖτε καὶ ποιήσετε.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/004.yaml
  text: And we have confidence in the Lord about you, that you are doing and will do what we command.
translation:
  language: ta
  text: நாங்கள் கட்டளையிடுகிறவற்றை நீங்கள் செய்கிறீர்கள், மேலும் செய்வீர்கள் என்று உங்களைக் குறித்து ஆண்டவரில் நம்பிக்கை கொண்டிருக்கிறோம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεποίθαμεν
  choice: நம்பிக்கையுடன் இருக்கிறோம்
  rationale: நிகழ்காலத்தில் தொடரும் உறுதியான நம்பிக்கையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν κυρίῳ
  choice: ஆண்டவருக்குள்
  rationale: நம்பிக்கையின் அடிப்படையும் வட்டாரமும் ஆண்டவர் என்பதைக் காட்டும் கிரேக்கச் சொற்றொடரின் இறையியல் செறிவைப் பாதுகாக்கிறது.
- source_word: ἐφ’ ὑμᾶς
  choice: உங்களைக் குறித்து
  rationale: இங்கு நம்பிக்கையின் பொருள் வாசகர்களே என்பதை இயல்பாகத் தெரிவிக்கிறது; ஆங்கில ஆலோசனை அடுக்கிலுள்ள ‘about you’ என்பதற்கும் ஒத்துள்ளது.
- source_word: παραγγέλλομεν
  choice: கட்டளையிடுகிறவற்றை
  rationale: அப்போஸ்தல அதிகாரத்தோடு வழங்கப்படும் அறிவுறுத்தலின் வலிமையை ‘கட்டளை’ தெளிவாகப் பாதுகாக்கிறது.
- source_word: ποιεῖτε καὶ ποιήσετε
  choice: செய்துவருகிறீர்கள், இனியும் செய்வீர்கள்
  rationale: நிகழ்காலச் செயல்பாட்டையும் எதிர்காலத் தொடர்ச்சியையும் தமிழில் தெளிவாக வேறுபடுத்துகிறது.
theological_decisions:
- issue: நம்பிக்கையின் அடித்தளம்
  choice: ஆண்டவருக்குள் நம்பிக்கையுடன் இருக்கிறோம்
  alternative: ஆண்டவரால் உங்கள்மேல் நம்பிக்கை வைத்திருக்கிறோம்
  rationale: ἐν κυρίῳ என்பதை வெறும் காரணமாக மாற்றாமல், பவுலின் நம்பிக்கை ஆண்டவரோடு உள்ள உறவுக்குள் நிலைகொண்டது என்ற திறந்த இறையியல் பொருளைப் பாதுகாக்கிறது.
- issue: அப்போஸ்தல அறிவுறுத்தலின் வலிமை
  choice: கட்டளையிடுகிறவற்றை
  alternative: அறிவுறுத்துகிறவற்றை
  rationale: παραγγέλλομεν என்பதன் அதிகாரபூர்வமான நுணுக்கத்தை மெலிதாக்காமல் தருகிறது; அதேவேளை எந்தச் சமயப் பிரிவின் தனிப்பட்ட அதிகாரக் கோட்பாட்டையும் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமானதும் சாதாரண வாசகர்களுக்குப் புரியத்தக்கதுமான நடை. கிரேக்க வாக்கியத்தின் நம்பிக்கை–ஆண்டவர்–வாசகர்கள் என்ற உறவையும் நிகழ்காலம்/எதிர்காலம் வேறுபாட்டையும் இயல்பாகப் பாதுகாக்கிறது.
