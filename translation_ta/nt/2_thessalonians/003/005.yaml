source:
  edition: SBLGNT
  text: ὁ δὲ κύριος κατευθύναι ὑμῶν τὰς καρδίας εἰς τὴν ἀγάπην τοῦ θεοῦ καὶ εἰς τὴν ὑπομονὴν τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/005.yaml
  text: May the Lord direct your hearts into the love of God and into the steadfastness of Messiah[a][b][c].
translation:
  language: ta
  text: ஆண்டவர் உங்கள் இதயங்களை இறைவனின் அன்புக்குள்ளும்[a] மெசியாவின் நிலைத்த பொறுமைக்குள்ளும்[b][c] வழிநடத்துவாராக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இறைவன்மீது அன்புக்குள்ளும்.” கிரேக்கத் தொடர் “இறைவன் செலுத்தும் அன்புக்குள்ளும்” என்றும் பொருள்படலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “மெசியாவுக்காக நிலைத்திருக்கும் பொறுமைக்குள்ளும்”; “மெசியா காட்டிய நிலைத்த பொறுமைக்குள்ளும்” என்றும் பொருள்படலாம்.
    reason: alternative_reading
  - marker: c
    text: கிரேக்கத்தில் “கிறிஸ்து”; இங்கு அது ஒரு பட்டமாகச் செயல்படுவதால் “மெசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: புதிய ஏற்பாட்டில் இறைமை/கிறிஸ்துவியல் பட்டமாக வரும் κύριος என்பதன் பொருளையும் கனத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: κατευθύναι
  choice: வழிநடத்துவாராக
  rationale: இது வேண்டுதல் அல்லது செபத்தை வெளிப்படுத்தும் optative வடிவம்; ‘வழிநடத்துவாராக’ அந்த வேண்டுதல் தொனியையும் உள்ளார்ந்த திசைப்படுத்துதலையும் இயல்பாகத் தருகிறது.
- source_word: καρδίας
  choice: இதயங்களை
  rationale: சிந்தனை, விருப்பம், பற்று ஆகியவற்றின் மையத்தைக் குறிக்கும் வேதாகம உருவகத்தைப் பாதுகாக்கிறது.
- source_word: ἀγάπην
  choice: அன்பு
  rationale: ἀγάπη என்பதற்கான தெளிவான, வழக்கமான தமிழ் இணைச்சொல்.
- source_word: τοῦ θεοῦ
  choice: இறைவனின்
  rationale: உடைமை வேற்றுமையை நேரடியாகக் காத்து, ‘இறைவன் செலுத்தும் அன்பு’ அல்லது ‘இறைவன்மீது கொள்ளும் அன்பு’ என்ற இரு சாத்தியங்களையும் பிரதான உரையில் தீர்மானிக்காமல் விடுகிறது.
- source_word: ὑπομονὴν
  choice: நிலைத்த பொறுமை
  rationale: அழுத்தம் அல்லது துன்பத்தின் நடுவே தொடர்ந்து தாங்கிநிற்கும் ὑπομονή-யின் செயற்பாட்டுப் பொருளை சாதாரண வாசகருக்குத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: τοῦ Χριστοῦ
  choice: மெசியாவின்
  rationale: Χριστός இங்கு பட்டமாகச் செயல்படுவதால் அதன் பொருளைத் தரும் ‘மெசியா’ பயன்படுத்தப்படுகிறது; உடைமை வடிவம் மூலத்தின் genitive அமைப்பைக் காக்கிறது.
theological_decisions:
- issue: τὴν ἀγάπην τοῦ θεοῦ என்பதிலுள்ள தெளிவற்ற genitive
  choice: இறைவனின் அன்பு
  alternative: இறைவன்மீது அன்பு; இறைவன் செலுத்தும் அன்பு
  rationale: மூலக்கிரேக்கம் அன்பின் செய்பவர் அல்லது இலக்கு யார் என்பதைத் தீர்மானிக்கவில்லை. பிரதான உரை அந்த இறையியல் பதற்றத்தைப் பாதுகாக்கிறது; அடிக்குறிப்பு சாத்தியங்களை விளக்குகிறது.
- issue: τὴν ὑπομονὴν τοῦ Χριστοῦ என்பதிலுள்ள தெளிவற்ற genitive
  choice: மெசியாவின் நிலைத்த பொறுமை
  alternative: மெசியாவுக்காக நிலைத்திருக்கும் பொறுமை; மெசியா காட்டிய நிலைத்த பொறுமை; மெசியாவைப் போன்ற நிலைத்த பொறுமை
  rationale: இத்தொடர் மெசியாவின் சொந்தப் பொறுமையையோ, அவருக்காக நிலைத்திருப்பதையோ, அவரால் வகைப்படுத்தப்படும் பொறுமையையோ குறிக்கலாம். பிரதான உரை உடைமை அமைப்பை வைத்திருக்கிறது; அடிக்குறிப்பு மாற்று விளக்கங்களைத் தருகிறது.
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: Χριστός இங்கு வெறும் பெயராக அல்லாமல் பட்டமாக இருப்பதால், அதன் பொருளைத் தமிழில் வெளிப்படுத்தும் ‘மெசியா’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், செபத்துக்குரிய கண்ணியமான தொனி பயன்படுத்தப்பட்டுள்ளது. ‘இதயம்’ என்ற வேதாகம உருவகமும் இரு genitive தொடர்களின் உண்மையான பொருள் தெளிவின்மையும் காக்கப்பட்டுள்ளன. மூலத்தில் வெளிப்படையான காலக் குறிப்பு இல்லாததால் தொடக்கத்தில் ‘இப்போது’ சேர்க்கப்படவில்லை.
