base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/012.yaml
  text: To such people we command and urge in the Lord Jesus the Messiah that[a], working quietly[c][b], they should eat their own bread.
translation:
  language: ta
  text: 'இப்படிப்பட்டவர்களுக்கு நாங்கள் கர்த்தராகிய இயேசு மெசியாவுக்குள் கட்டளையிடுகிறோம், மேலும் வற்புறுத்துகிறோம்: அவர்கள் அமைதியுடன் உழைத்து, தங்கள் சொந்த அப்பத்தை உண்ண வேண்டும்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அப்பம்’ என்பது இங்கு ஒருவர் தம் உழைப்பால் பெறும் உணவு அல்லது வாழ்வாதாரத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς δὲ τοιούτοις
  choice: இப்படிப்பட்டவர்களுக்கு
  rationale: முந்தைய சூழலில் ஒழுங்கின்றி சோம்பித் திரிபவர்களைக் குறிக்கிறது. δέ இங்கு மென்மையான தொடர்ச்சியைத் தருவதால் தனிச் சொல்லாக மொழிபெயர்க்கப்படவில்லை.
- source_word: παραγγέλλομεν καὶ παρακαλοῦμεν
  choice: நாங்கள் கட்டளையிட்டு வேண்டிக்கொள்வது
  rationale: முதல் வினைச்சொல்லின் அதிகாரத்தையும் இரண்டாவது வினைச்சொல்லின் அக்கறைமிக்க வற்புறுத்தலையும் தனித்தனியே காக்கிறது.
- source_word: ἐν κυρίῳ Ἰησοῦ Χριστῷ
  choice: கர்த்தராகிய இயேசு மெசியாவுக்குள்
  rationale: ἐν என்பதன் ஒன்றிப்பு அல்லது அதிகாரச் சூழல் சார்ந்த பொருளைக் காக்கிறது; Χριστός இங்கு பட்டமாக இருப்பதால் ‘மெசியா’ என வழங்கப்பட்டுள்ளது.
- source_word: μετὰ ἡσυχίας ἐργαζόμενοι
  choice: அமைதியுடன் உழைத்து
  rationale: தொந்தரவு ஏற்படுத்தும் சோம்பலுக்கு மாறாக அமைதியான, ஒழுங்கான முறையில் உழைப்பதைக் குறிக்கும் பெயர்ச்சொல் அமைப்பையும் பங்கேற்பு வினையின் சூழ்நிலைப் பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὸν ἑαυτῶν ἄρτον
  choice: தங்களுடைய சொந்த உணவை
  rationale: ἄρτος என்பதன் நேர்ப்பொருள் ‘அப்பம்’; இச்சூழலில் அது ஒருவர் தம் உழைப்பால் பெறும் உணவு அல்லது வாழ்வாதாரத்தைக் குறிக்கிறது. நவீன தமிழில் நோக்கப்பட்ட கருத்தைத் தெளிவாகச் சொல்ல ‘உணவு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἐσθίωσιν
  choice: உண்ண வேண்டும்
  rationale: ἵνα உடன் வரும் நிகழ்காலத் துணைநிலை வினையின் கட்டளை சார்ந்த கடமையுணர்வைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு Χριστός இயேசுவின் பட்டமாகச் செயல்படுவதால் அதன் பொருள் வெளிப்படுமாறு ‘மெசியா’ என மொழிபெயர்க்கப்பட்டது.
- issue: ἐν κυρίῳ என்பதன் உறவு
  choice: கர்த்தராகிய இயேசு மெசியாவுக்குள்
  alternative: கர்த்தராகிய இயேசு மெசியாவின் அதிகாரத்தால்
  rationale: ‘அதிகாரத்தால்’ என்பது சூழலில் சாத்தியமான உட்பொருள்; ஆனால் கிரேக்க ἐν-இன் ஒன்றிப்பு, செயல்படும் ஆளுகைச் சூழல் ஆகிய பரந்த பதற்றத்தைச் சுருக்காமல் ‘-க்குள்’ காக்கிறது.
- issue: அப்போஸ்தல அறிவுறுத்தலின் இரட்டை வலிமை
  choice: கட்டளையிட்டு வேண்டிக்கொள்வது
  alternative: அறிவுறுத்துவது
  rationale: அதிகாரபூர்வமான கட்டளையையும் மேய்ப்பருக்குரிய அக்கறைமிக்க வேண்டுகோளையும் ஒரே பொதுவான வினைச்சொல்லாகத் தட்டையாக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘கர்த்தர்’, ‘மெசியா’ ஆகியவை வேதாகமத் தகுதியைத் தக்கவைக்கின்றன; ‘அமைதியுடன் உழைத்து’ என்பது பேசாமல் வேலை செய்வதை மட்டும் அல்ல, தொந்தரவு செய்யாத ஒழுங்கான வாழ்க்கையைச் சுட்டுகிறது.
