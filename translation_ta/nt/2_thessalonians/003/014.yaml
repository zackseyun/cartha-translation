id: 2TH.3.14
reference: 2 Thessalonians 3:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Εἰ δέ τις οὐχ ὑπακούει τῷ λόγῳ ἡμῶν διὰ τῆς ἐπιστολῆς, τοῦτον σημειοῦσθε, ⸀μὴ ⸀συναναμίγνυσθαι αὐτῷ, ἵνα ἐντραπῇ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/014.yaml
  text: And if anyone does not obey our word through this letter[a], take note of that person; do not associate with him[d][c][b], so that he may be ashamed.
translation:
  language: ta
  text: இந்தக் கடிதத்தின் வாயிலாக வரும் எங்கள் அறிவுறுத்தலுக்குக் கீழ்ப்படியாதவர் யாராவது இருந்தால்[a], அந்த நபரைக் குறித்துவைத்துக்கொள்ளுங்கள்[b]; அவர் வெட்கமடையும்படி அவருடன் பழகாதிருங்கள்[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இந்தக் கடிதத்தின் மூலம்’ அல்லது ‘இந்தக் கடிதத்தில்’ என்றும் மொழிபெயர்க்கலாம். அறிவுறுத்தல் எந்த வழியில் தெரிவிக்கப்படுகிறது என்பதை இந்தக் கிரேக்கச் சொற்றொடர் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அந்த நபரை அடையாளம் கண்டுகொள்ளுங்கள்’ அல்லது ‘அவரைக் கவனத்தில் வைத்திருங்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘அவருடன் சேர்ந்து உறவாடாதிருங்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: d
    text: இது அவரைத் திருத்துவதை நோக்கமாகக் கொண்டது. 15ஆம் வசனத்தில் அவரைப் பகைவனாகக் கருதாமல், ‘சகோதரனாக’ எச்சரிக்க வேண்டும் என்று கூறப்படுவதை ஒப்பிடுக.
    reason: cross_reference
lexical_decisions:
- source_word: ὑπακούει
  choice: கீழ்ப்படியாதவர்
  rationale: ὑπακούω என்பது அதிகாரமுள்ள அறிவுறுத்தலைக் கேட்டு அதன்படி நடப்பதைக் குறிக்கிறது. எதிர்மறை நிபந்தனையில் ‘கீழ்ப்படியாதவர்’ என்பது பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: τῷ λόγῳ ἡμῶν
  choice: எங்கள் அறிவுறுத்தலுக்கு
  rationale: இங்கு λόγος ஒரு தனி உச்சரிப்பை அல்ல, அப்போஸ்தலரின் போதனையையும் கட்டளையையும் குறிக்கிறது. ‘அறிவுறுத்தல்’ சூழலுக்கேற்ற பொருளைத் தெளிவாகத் தருகிறது; ‘எங்கள் வார்த்தை’ என்ற சொற்சார்ந்த மாற்று அடிக்குறிப்பில் தேவையின்றி வைக்கப்படவில்லை.
- source_word: διὰ τῆς ἐπιστολῆς
  choice: இந்தக் கடிதத்தின் வாயிலாக வரும்
  rationale: διά + genitive இங்கு அறிவுறுத்தல் தெரிவிக்கப்படும் வழிமுறையைக் குறிக்கிறது. ‘இந்த’ என்பது வாசகரின் கையில் உள்ள கடிதத்தைச் சூழலிலிருந்து தெளிவுபடுத்துகிறது; வேறு இலக்கணத் தொடர்புகளுக்கான வாய்ப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: σημειοῦσθε
  choice: குறித்துவைத்துக்கொள்ளுங்கள்
  rationale: இந்த நடுவினைக் கட்டளை வடிவம் அந்த நபரை கவனித்து அடையாளப்படுத்துமாறு கூறுகிறது. ‘குறித்துவைத்துக்கொள்ளுங்கள்’ என்பது மிகையான தண்டனைத் தொனியின்றி கட்டளையின் வலிமையைத் தருகிறது.
- source_word: τοῦτον
  choice: அந்த நபரை
  rationale: சுட்டுப்பெயர், கீழ்ப்படியாத குறிப்பிட்ட நபரைக் குறிக்கிறது. ‘அந்த நபர்’ என்பது தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: μὴ συναναμίγνυσθαι αὐτῷ
  choice: அவருடன் பழகாதிருங்கள்
  rationale: συναναμίγνυμι என்பது ஒருவருடன் கலந்து பழகுதல் அல்லது தொடர்பு வைத்திருத்தலைக் குறிக்கிறது. ‘பழகாதிருங்கள்’ நவீனத் தமிழில் இயல்பாக இருந்து, சூழலின் சமூக விலகலைத் தெரிவிக்கிறது.
- source_word: ἐντραπῇ
  choice: அவர் வெட்கமடையும்படி
  rationale: செயப்பாட்டு வாய்பாட்டு subjunctive வடிவம் வெட்க உணர்வு ஏற்படுவதை நோக்கமாகக் காட்டுகிறது. இந்தச் சொற்றொடர் பழிவாங்கும் அவமானத்தை மிகைப்படுத்தாமல் நோக்கக் கிளவியைப் பாதுகாக்கிறது.
- source_word: τις
  choice: யாராவது
  rationale: வரையறையற்ற சுட்டுப்பெயரின் பொதுவான, திறந்த நிபந்தனைப் பொருளை ‘யாராவது’ இயல்பாகத் தருகிறது.
- source_word: αὐτῷ
  choice: அவருடன்
  rationale: இது முன் குறிப்பிடப்பட்ட தனிநபரைக் குறிக்கிறது. தமிழில் ‘அவர்’ என்பது பாலைக் கட்டாயமாக முன்வைக்காமல் மரியாதையுடனும் இயல்பாகவும் தனிநபரைச் சுட்டுகிறது.
theological_decisions:
- issue: μὴ συναναμίγνυσθαι αὐτῷ கட்டளையிடும் ஒழுங்கு நடவடிக்கையின் தன்மை
  choice: கீழ்ப்படியாத விசுவாசியைத் திருத்தும் நோக்கமுள்ள சமூக அல்லது சபைசார் விலகல்
  alternative: முழுமையான முறையான சபைநீக்கம்; அல்லது சபைசார் பரிமாணமற்ற சாதாரணத் தவிர்ப்பு
  rationale: அடுத்த வசனம் அவரைப் பகைவனாக எண்ணாமல் சகோதரனாக எச்சரிக்கச் சொல்கிறது. ஆகவே ‘அவருடன் பழகாதிருங்கள்’ என்பது இறுதித் தீர்ப்பையோ பிற்காலச் சபைச்சட்ட வகைப்பாட்டையோ புகுத்தாமல் ஒழுங்கு நடவடிக்கையின் தீவிரத்தைக் காக்கிறது.
- issue: ἐντραπῇ என்பதன் நோக்கம்
  choice: திருத்தத்துக்கு வழிவகுக்கும் வெட்க உணர்வு
  alternative: அவமானப்படுத்துவதையே இறுதி நோக்கமாகக் கொண்ட பொதுவான இழிவு
  rationale: ἵνα நோக்கக் கிளவியும் அடுத்த வசனத்தின் சகோதர உறவுச் சூழலும் இந்த வெட்கம் திருத்தும் நோக்கமுடையது என்பதைக் காட்டுகின்றன. மொழிபெயர்ப்பு மனந்திரும்புதலை வெளிப்படையாகச் சேர்க்காமல் அந்த நோக்கத்தை மட்டும் காக்கிறது.
translation_notes:
  register: நடை நவீன, பொதுவாகப் புரியும், கண்ணியமான தமிழில் உள்ளது. ‘அறிவுறுத்தல்’ சூழலிலுள்ள λόγος என்பதன் செயல்பாட்டுப் பொருளைத் தருகிறது. ‘குறித்துவைத்துக்கொள்ளுங்கள்’ மற்றும் ‘பழகாதிருங்கள்’ ஆகியவை கட்டளையின் தீவிரத்தைக் காக்கின்றன; அதேவேளையில் பிற்காலத் தொழில்நுட்ப சபைச்சட்டச் சொற்களைத் தவிர்க்கின்றன.
