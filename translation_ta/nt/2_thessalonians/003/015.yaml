revisions:
- from: அவனைப் பகைவனாகக் கருதாதீர்கள்; மாறாக, சகோதரனாக எண்ணி அவனுக்கு அறிவுரை கூறுங்கள்.[a]
  to: அவரைப் பகைவனாகக் கருதாதீர்கள்; மாறாக, அவரைச் சகோதரராகக் கருதி அறிவுறுத்துங்கள்.[a]
  rationale: The revision makes “as a brother” govern the manner and relational posture of the admonition, as in the Greek, and uses “அறிவுறுத்துங்கள்” to retain νουθετεῖτε’s corrective force. The footnote is retained with the headword adjusted to match the grammatical form in the revised text.
