review_pass:
  verdict: revise
  source_fidelity: 'The first clause accurately conveys μὴ ὡς ἐχθρὸν ἡγεῖσθε. In the second clause, however, the draft attaches “சகோதரனாக எண்ணி” to the addressee’s mental posture and then renders νουθετεῖτε as a separate action. The Greek directly qualifies the admonishing: admonish him as a brother. Recasting it as “அவரைச் சகோதரராகக் கருதி அறிவுறுத்துங்கள்” preserves both the continuing familial/community regard and the corrective imperative.'
  naturalness: The revised wording is idiomatic modern standard Tamil, maintains the respectful plural imperative, and is concise.
  terminology: “பகைவன்” appropriately renders ἐχθρός. “அறிவுறுத்துங்கள்” is a more direct modern Tamil rendering of νουθετεῖτε than the broader “அறிவுரை கூறுங்கள்,” while retaining corrective instruction rather than hostile condemnation. “சகோதரர்” is retained, with the existing note appropriately explaining its community-representative sense.
  issues:
  - severity: medium
    issue: The second occurrence of ὡς is not attached closely enough to the act of admonishing.
    rationale: “சகோதரனாக எண்ணி அவனுக்கு அறிவுரை கூறுங்கள்” can be understood as first considering him a brother and then merely giving advice. The source calls for corrective admonition conducted toward him as a brother.
