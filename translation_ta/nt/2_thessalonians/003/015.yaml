  yaml_path: translation/nt/2_thessalonians/003/015.yaml
  text: And do not regard him as an enemy[b][a], but admonish him as a brother.
translation:
  language: ta
  text: அவரைப் பகைவனாகக் கருதாதீர்கள்; மாறாக, அவரைச் சகோதரராகக் கருதி அறிவுறுத்துங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சகோதரர்’ என்பது இங்கு உடன்பிறந்தவரை அல்ல, உடன் விசுவாசியைக் குறிக்கிறது; கிறிஸ்தவச் சமூகத்தின் ஓர் உறுப்பினரைக் குறிக்க இந்தச் சொல் பிரதிநிதித்துவமாகப் பயன்படுத்தப்படலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: ἡγεῖσθε
  choice: கருதாதீர்கள்
  rationale: ஒருவரை ஒரு குறிப்பிட்ட வகையைச் சேர்ந்தவராக எண்ணுதல் அல்லது மதிப்பிடுதல் என்ற பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἐχθρὸν
  choice: பகைவன்
  rationale: அந்த நபரை எதிரியாக வகைப்படுத்தக் கூடாது என்ற கருத்தைத் தெளிவாகவும் நேரடியாகவும் தருகிறது.
- source_word: νουθετεῖτε
  choice: அறிவுரை கூறுங்கள்
  rationale: νουθετέω என்பதில் எச்சரிப்பும் திருத்தும் நோக்கமுள்ள அறிவுறுத்தலும் அடங்குகின்றன; ‘அறிவுரை கூறுங்கள்’ மேய்ப்புப் பரிவையும் திருத்தும் நோக்கத்தையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: ἀδελφόν
  choice: சகோதரன்
  rationale: மூலத்தின் ஒருமை ஆண்பால் சொல்லைத் தக்கவைத்துக் கொண்டு, கிறிஸ்தவச் சமூகத்தின் சக உறுப்பினரைக் குறிக்கும் பிரதிநிதித்துவப் பயன்பாட்டை அடிக்குறிப்பில் விளக்குகிறது.
- source_word: ὡς
  choice: -ஆக
  rationale: இரண்டு இடங்களிலும் ஒருவரை எந்த நிலையில் கருத வேண்டும் அல்லது அணுக வேண்டும் என்பதைக் குறிக்கும் வகைப்பாட்டு/முறைப் பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: καὶ μὴ ... ἀλλὰ
  choice: '...ஆகக் கருதாதீர்கள்; மாறாக...'
  rationale: முந்தைய அறிவுறுத்தலோடு தொடர்ச்சியையும் இவ்வசனத்திற்குள் உள்ள வலுவான எதிர்மறை–நேர்மறை முரணையும் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: கீழ்ப்படியாத விசுவாசியிடம் கடைப்பிடிக்க வேண்டிய ஒழுங்கு நடவடிக்கையின் மனப்பான்மை
  choice: அந்த நபரைப் பகைவனாகக் கருதாமல், சகோதரனாகவே எண்ணி திருத்தும் நோக்குடன் அறிவுரை கூற வேண்டும்.
  alternative: இதைத் திருச்சபை ஒழுங்கு நடவடிக்கையைப் பற்றியதாக அல்லாமல், பொதுவான தனிப்பட்ட மோதலுக்கான அறிவுரையாக வாசிக்கலாம்.
  rationale: 2 தெசலோனிக்கேயர் 3:14–15 சூழலில், சமூகத்துக்குள் கீழ்ப்படியாத ஒருவரைக் குறித்துக் கவனித்து, அவர் வெட்கப்படும்படி விலகியிருக்குமாறு பவுல் கூறுகிறார். ஆயினும் ‘சகோதரன்’ என்பது அவர் இன்னும் சமூக உறவுக்குள் கருதப்படுவதையும் நடவடிக்கை பகைமையால் அல்ல, திருத்தும் நோக்கால் அமைய வேண்டியதையும் காட்டுகிறது.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையைப் பயன்படுத்துகிறது. ‘அறிவுரை கூறுங்கள்’ என்பது கடுமையான கண்டனமாக மட்டும் ஒலிக்காமல், திருத்தும் நோக்கமுள்ள νουθετεῖτε என்பதன் பரந்த பொருளைத் தக்கவைக்கிறது. மூலத்தில் ἡγεῖσθε என்பதற்கான ‘கருதுங்கள்/எண்ணுங்கள்’ வேறுபாடு தமிழில் குறிப்பிடத்தக்க பொருள் வேறுபாட்டை உருவாக்காததால் தனி அடிக்குறிப்பு சேர்க்கப்படவில்லை.
