id: 2TH.3.18
reference: 2 Thessalonians 3:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/018.yaml
  text: The grace of our Lord Jesus Christ be with all of you[a].
translation:
  language: ta
  text: நம் ஆண்டவராகிய இயேசு கிறிஸ்துவின்[a] அருள் உங்கள் அனைவரோடும் இருப்பதாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கிறிஸ்து’ என்பதற்கு ‘மேசியா’, அதாவது ‘அபிஷேகம் செய்யப்பட்டவர்’ என்று பொருள்.
    reason: Χριστός என்ற சொல்லின் பட்டப் பொருளைத் தெளிவுபடுத்துதல்.
lexical_decisions:
- source_word: χάρις
  choice: அருள்
  rationale: பவுலின் வாழ்த்துச் சூத்திரத்தில், கிறிஸ்துவின் கருணைமிக்க தயவையும் கொடையையும் குறிக்கும் இயல்பான, மரபாக நிலைபெற்ற தமிழ் சொல்.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: இயேசுவின் அதிகாரத்தையும் உயர்வையும் மரியாதையுடன் வெளிப்படுத்தும், κύριος என்பதற்கான நிலையான தமிழ் இறையியல் வழக்கு.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு கிறிஸ்து
  rationale: Ἰησοῦς என்ற பெயரையும் Χριστός என்ற பட்டத்தையும் தமிழில் பரவலாக அறியப்பட்ட வடிவில் தருகிறது; ‘கிறிஸ்து’ என்பதன் பட்டப் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: μετὰ πάντων ὑμῶν
  choice: உங்கள் அனைவரோடும் இருப்பதாக
  rationale: μετάவின் ‘உடன்’ என்ற பொருளையும் πάντων ὑμῶν என்பதன் முழுச் சமூகத்தையும் உள்ளடக்கும் வலியுறுத்தலையும் காக்கிறது; ஆசிவாழ்த்தின் இயல்புக்கேற்ப ‘இருப்பதாக’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: Χριστοῦ என்ற பட்டத்தைத் தமிழில் வழங்குதல்
  choice: கிறிஸ்து
  alternative: மேசியா
  rationale: ‘கிறிஸ்து’ என்பது தமிழில் நிலைபெற்ற வடிவாகவும் இவ்வாழ்த்துச் சூத்திரத்தில் இயல்பாகவும் உள்ளது. அதேவேளை, அது வெறும் இரண்டாம் பெயர் அல்ல, ‘அபிஷேகம் செய்யப்பட்டவர்/மேசியா’ என்ற பட்டம் என்பதை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், திருச்சபை வாசிப்புக்கும் பொதுவாசிப்புக்கும் ஏற்ற கண்ணியமான ஆசிவாழ்த்து நடை. ‘உங்கள் அனைவரோடும்’ என்பது வாழ்த்து முழுச் சமூகத்தையும் உள்ளடக்குவதைத் தெளிவாகக் காக்கிறது.
