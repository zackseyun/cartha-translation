id: 2TH.3.3
reference: 2 Thessalonians 3:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πιστὸς δέ ἐστιν ὁ κύριος, ὃς στηρίξει ὑμᾶς καὶ φυλάξει ἀπὸ τοῦ πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/003.yaml
  text: But the Lord is faithful[a], who will strengthen you and guard you from the evil one.
translation:
  language: ta
  text: ஆனால் ஆண்டவர் நம்பிக்கைக்குரியவர்; அவர் உங்களை உறுதிப்படுத்தி, தீயவனிடமிருந்து[a] காத்துக்கொள்வார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “தீமையிலிருந்து.” கிரேக்கத்தில் உள்ள τοῦ πονηροῦ என்பதை ஆண்பாலாக “தீயவன்” என்றும், நடுநிலையாக “தீமை” என்றும் புரிந்துகொள்ளலாம்.'
    reason: alternative_reading
lexical_decisions:
- source_word: πιστὸς
  choice: நம்பிக்கைக்குரியவர்
  rationale: ஆண்டவரின் நம்பகத்தன்மையையும் மாறாத உண்மைத்தன்மையையும் குறிக்கிறது; முந்தைய வசனத்தில் மனிதர்களிடம் நம்பிக்கை இல்லாமையுடன் உள்ள வேறுபாட்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δέ
  choice: ஆனால்
  rationale: முந்தைய கூற்றுடன் உள்ள தெளிவான முரண்பாட்டைத் தக்கவைக்கிறது.
- source_word: ὁ κύριος
  choice: ஆண்டவர்
  rationale: κύριος என்ற பட்டத்தை வழக்கமான, மரியாதைக்குரிய தமிழில் தருகிறது; அது யாரைக் குறிக்கிறது என்பதை மொழிபெயர்ப்பில் தேவையின்றி மேலதிகமாகக் குறிப்பிடவில்லை.
- source_word: στηρίξει
  choice: உறுதிப்படுத்தி
  rationale: நிலைபெறச் செய்தல், பலப்படுத்துதல் என்ற பொருள் வரம்பைத் தக்கவைத்து, தமிழில் இயல்பாக உள்ளது.
- source_word: φυλάξει
  choice: காத்துக்கொள்வார்
  rationale: கவனமாகப் பாதுகாத்தல் என்ற செயற்பாட்டுப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀπὸ
  choice: -இடமிருந்து
  rationale: அடுத்து குறிப்பிடப்படும் ஆபத்திலிருந்து விலக்கிக் காக்கப்படுதல் என்ற உறவை வெளிப்படுத்துகிறது.
- source_word: τοῦ πονηροῦ
  choice: தீயவன்
  rationale: இலக்கண ரீதியாக ஆண்பால் ‘தீயவன்’ என்றும் நடுநிலை ‘தீமை’ என்றும் புரிந்துகொள்ள முடியும். பிரதான உரையில் தனிப்பட்ட எதிரியைக் குறிக்கும் வாசிப்பு ஏற்கப்பட்டு, உண்மையான இருபொருள் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: τοῦ πονηροῦ என்பதன் குறிப்பு
  choice: தீயவன்
  alternative: தீமை
  rationale: கிரேக்க வடிவம் ஆண்பாலாகவும் நடுநிலையாகவும் இருக்கக்கூடியதால் இரு வாசிப்புகளும் சாத்தியம். புதிய ஏற்பாட்டுப் பயன்பாட்டுக்கு ஏற்ற தனிப்பட்ட வாசிப்பு பிரதான உரையில் தரப்படுகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் வைக்கப்பட்டு இறையியல் அழுத்தம் தீர்த்துவிடப்படாமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நம்பிக்கைக்குரியவர்,’ ‘உறுதிப்படுத்தி,’ ‘காத்துக்கொள்வார்’ ஆகிய சொற்கள் மூலத்தின் பொருளையும் மேய்ப்புப் பணிசார் உறுதியளிக்கும் தொனியையும் இணைக்கின்றன.
