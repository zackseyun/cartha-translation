source:
  edition: SBLGNT
  text: Παραγγέλλομεν δὲ ὑμῖν, ἀδελφοί, ἐν ὀνόματι τοῦ κυρίου ⸀ἡμῶν Ἰησοῦ Χριστοῦ στέλλεσθαι ὑμᾶς ἀπὸ παντὸς ἀδελφοῦ ἀτάκτως περιπατοῦντος καὶ μὴ κατὰ τὴν παράδοσιν ἣν ⸀παρελάβοσαν παρ’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/006.yaml
  text: We command you[a], brothers, in the name of our Lord Jesus the Messiah[e][d][c][b], to keep away from every brother who is walking disorderly and not according to the tradition that they received from us.
translation:
  language: ta
  text: சகோதரர்களே[a], ஒழுங்கின்றி நடந்து[e], எங்களிடமிருந்து அவர்கள் பெற்றுக்கொண்ட[d] மரபின்படி நடக்காத ஒவ்வொரு சகோதரனிடமிருந்தும் விலகியிருக்கும்படி[b], நம்முடைய ஆண்டவராகிய இயேசு மெசியாவின்[c] பெயரில் உங்களுக்குக் கட்டளையிடுகிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதரர்களே” என்பது ஆண்பால் பன்மையான ἀδελφοί என்பதன் மொழிபெயர்ப்பு; பவுல் திருச்சபை முழுவதையும் நோக்கிப் பேசுகிறார்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தொடர்பிலிருந்து பின்வாங்கும்படி”; நெருங்கிய தொடர்பிலிருந்து ஒருவர் தம்மை விலக்கிக்கொள்வதை கிரேக்கச் சொல் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: “மெசியா” என்பதை “கிறிஸ்து” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: d
    text: சில கையெழுத்துப் பிரதிகளில், “நீங்கள் எங்களிடமிருந்து பெற்றுக்கொண்ட” அல்லது “அவன் எங்களிடமிருந்து பெற்றுக்கொண்ட” என்று உள்ளது; இவை “ஒவ்வொரு சகோதரன்” என்பதற்குப் பின்வரும் தொடரை இலக்கண ரீதியாகச் சீராக்குகின்றன. இங்கு பின்பற்றப்படும் அச்சிட்ட மூலபாடம், “அவர்கள் எங்களிடமிருந்து பெற்றுக்கொண்ட” என்று வாசிக்கிறது.
    reason: textual_variant
  - marker: e
    text: அல்லது, “ஒழுங்கின்றி வாழும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Παραγγέλλομεν
  choice: உங்களுக்குக் கட்டளையிடுகிறோம்
  rationale: அதிகாரத்துடன் வழங்கப்படும் கட்டளையைக் குறிக்கும் வினை; வெறும் அறிவுரை அல்லது வேண்டுகோள் என்பதைவிட வலிமையானது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: ஆண்பால் பன்மை விளிப்பை நேரடியாகப் பாதுகாக்கிறது; பவுல் முழுத் திருச்சபையையும் அழைக்கிறார் என்பது அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: ἐν ὀνόματι τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: நம்முடைய ஆண்டவராகிய இயேசு மெசியாவின் பெயரில்
  rationale: ‘பெயரில்’ என்பது மூல மொழியின் இறுக்கமான சொற்றொடரையும் அதிகாரம் சார்ந்த கருத்தையும் காக்கிறது; Χριστός இங்கு பட்டமாக இருப்பதால் ‘மெசியா’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: στέλλεσθαι ὑμᾶς ἀπὸ
  choice: விலகியிருக்கும்படி
  rationale: நெருங்கிய தொடர்பிலிருந்து தம்மை விலக்கிக்கொள்வதைக் குறிக்கிறது; முறையான சபைநீக்கத்தை உரையில் இல்லாதபடி சேர்க்கவில்லை.
- source_word: παντὸς ἀδελφοῦ
  choice: ஒவ்வொரு சகோதரனிடமிருந்தும்
  rationale: மூலத்தின் ஒருமை ஆண்பால் வடிவத்தையும் திருச்சபைக் குடும்ப உறவுச் சொல்லையும் பாதுகாக்கிறது.
- source_word: ἀτάκτως
  choice: ஒழுங்கின்றி
  rationale: ஒழுங்குக்கும் கட்டுப்பாட்டுக்கும் புறம்பான நடத்தையைக் குறிக்கும் பரந்த பொருளைப் பாதுகாக்கிறது; பிந்தைய வசனங்களின் அடிப்படையில் இதை ‘சோம்பலாக’ என்று மட்டும் குறுக்கவில்லை.
- source_word: περιπατοῦντος
  choice: நடக்கிற
  rationale: வாழ்க்கை நடத்தையைக் குறிக்கும் பவுலின் ‘நடத்தல்’ உருவகத்தைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: μὴ κατὰ τὴν παράδοσιν
  choice: மரபின்படி நடக்காத
  rationale: παράδοσις என்பது ஒப்படைக்கப்பட்ட அல்லது வழிவழியாக வழங்கப்பட்ட ஒன்றைக் குறிக்கிறது; இங்கு அது அப்போஸ்தலர்களிடமிருந்து பெற்ற மரபு என்று சூழல் வரையறுக்கிறது.
- source_word: ἣν παρελάβοσαν παρ’ ἡμῶν
  choice: எங்களிடமிருந்து அவர்கள் பெற்றுக்கொண்ட
  rationale: SBLGNT அச்சிட்டுள்ள மூன்றாம் நபர் பன்மை வாசகத்தைப் பாதுகாக்கிறது; முந்தைய ஒருமை ‘ஒவ்வொரு சகோதரன்’ என்பதுடன் காணப்படும் இலக்கண இறுக்கம் மென்மையாக்கப்படவில்லை.
theological_decisions:
- issue: Χριστοῦ என்னும் கிறிஸ்துவியல் பட்டத்தின் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு Χριστός பெயரைப்போல் அல்லாமல் பட்டமாகச் செயல்படுகிறது; ‘மெசியா’ அபிஷேகம் செய்யப்பட்டவர் என்ற பட்டப்பொருளை வெளிப்படுத்துகிறது.
- issue: στέλλεσθαι ὑμᾶς ἀπὸ கட்டளையிடும் பிரிவின் அளவு
  choice: விலகியிருக்கும்படி
  alternative: தொடர்பைத் துண்டித்துக்கொள்ளும்படி
  rationale: விசுவாசியிடமிருந்து சமூக ரீதியாக விலகியிருக்கும் ஒழுக்க நடவடிக்கையைத் தெரிவிக்கிறது; இதை முறையான சபைநீக்கம் என்ற தொழில்நுட்ப வகையாகக் கூர்மைப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான திருச்சபை நடையுடன் வடிவமைக்கப்பட்டது. கிரேக்க மூலத்தின் ‘நடத்தல்’ உருவகம், ‘மரபு’ என்ற நேரடி சொல், மேலும் ஒருமைத் தொடருக்குப் பின் வரும் பன்மை வினையின் உரைசார் இறுக்கம் ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
