source:
  edition: SBLGNT
  text: οὐχ ὅτι οὐκ ἔχομεν ἐξουσίαν, ἀλλ’ ἵνα ἑαυτοὺς τύπον δῶμεν ὑμῖν εἰς τὸ μιμεῖσθαι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/009.yaml
  text: not because we do not have the right, but in order to give ourselves to you as an example for you to imitate us.
translation:
  language: ta
  text: எங்களுக்கு உரிமை இல்லை என்பதால் அல்ல; மாறாக, நீங்கள் எங்களைப் பின்பற்றுவதற்காக, எங்களையே உங்களுக்கு ஒரு முன்மாதிரியாகக் காட்டுவதற்காக.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξουσίαν
  choice: அந்த உரிமை
  rationale: உடனடி சூழலில் பவுலும் அவருடைய உடன் ஊழியர்களும் பொருளுதவி பெறுவதற்கான நியாயமான உரிமையைக் குறிக்கிறது. முந்தைய வசனச் சூழலைச் சுட்டுவதால் ‘அந்த’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἑαυτοὺς
  choice: எங்களையே
  rationale: பவுலையும் அவருடைய உடன் ஊழியர்களையும் குறிக்கும் தற்சுட்டுப் பன்மையை வலியுறுத்திப் பாதுகாக்கிறது.
- source_word: τύπον
  choice: ஒரு முன்மாதிரியாக
  rationale: பின்பற்றத்தக்க நடத்தை வடிவத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: δῶμεν
  choice: அளிப்பதற்காக
  rationale: ‘எங்களையே ... முன்மாதிரியாக அளித்தல்’ என்ற கிரேக்க உருவகத்தைப் பாதுகாக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: εἰς τὸ μιμεῖσθαι ἡμᾶς
  choice: நீங்கள் எங்களைப் பின்பற்றும்படி
  rationale: நோக்கைக் குறிக்கும் தொடரையும் ‘எங்களைப் பின்பற்றுதல்’ என்ற நேரடியான பொருளையும் தெளிவாகத் தருகிறது.
- source_word: οὐχ ὅτι οὐκ ... ἀλλ’ ἵνα
  choice: '... இல்லை என்பதால் அல்ல; மாறாக ... அளிப்பதற்காகவே'
  rationale: மறுக்கப்பட்ட காரணத்துக்கும் உண்மையான நோக்கத்துக்கும் இடையிலான கிரேக்க எதிர்மறை அமைப்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ἐξουσίαν என்பதன் பொருள்
  choice: பொருளுதவி பெறுவதற்கான நியாயமான உரிமை
  alternative: பொதுவான அப்போஸ்தல அதிகாரம் அல்லது வல்லமை
  rationale: வேலை செய்து பிறருக்குச் சுமையாகாமல் இருந்ததைப் பற்றிய உடனடி சூழல், இங்கு நியாயமான உரிமையையே முன்னிறுத்துகிறது; பரந்த அதிகாரக் கோட்பாடு மொழிபெயர்ப்பில் சேர்க்கப்படவில்லை.
- issue: வசனத்தின் முடிவில் மறைந்திருக்கும் செயல்
  choice: ‘இப்படிச் செய்தோம்’ என்று சூழலிலிருந்து வெளிப்படுத்தப்பட்டது
  alternative: வாக்கியத்தை ‘அளிப்பதற்காக’ என்பதோடு மட்டும் நிறுத்துதல்
  rationale: கிரேக்க வசனம் முந்தைய வசனத்தின் செயலைச் சார்ந்த எதிர்மறை–நோக்கு அமைப்பாக உள்ளது. தனி வசனமாக இயல்பாகவும் தெளிவாகவும் இருக்க, புதிய கருத்தைச் சேர்க்காமல் அந்தச் சூழல்சார் செயல் வெளிப்படுத்தப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘முன்மாதிரி’ என்பது τύπος என்பதின் பின்பற்றத்தக்க நடத்தைப் பொருளைத் தெளிவாக்குகிறது; ‘இப்படிச் செய்தோம்’ முந்தைய வசனத்தைச் சார்ந்த தமிழ்ச் சொற்றொடரின் நிறைவை வழங்குகிறது.
