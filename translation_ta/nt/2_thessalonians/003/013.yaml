  text: But as for you[a], brothers, do not grow weary in doing good.
translation:
  language: ta
  text: ஆனால் நீங்களோ, சகோதரர்களே,[a] நன்மை செய்வதில் சோர்ந்துபோகாதீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சகோதர சகோதரிகளே”; கிரேக்கத்தில் “சகோதரர்களே” என்று உள்ளது; அது முழு விசுவாசக் குழுமத்தையும் உள்ளடக்கி அழைப்பதாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: ஆனால் நீங்களோ
  rationale: δέ முந்தைய வசனங்களில் குறிப்பிடப்பட்ட ஒழுங்கற்றவர்களிலிருந்து இவ்வாசகர்களை வேறுபடுத்தும் முரண்பாட்டைக் குறிக்கிறது; முன்வைக்கப்பட்ட ὑμεῖς வலியுறுத்தலைக் கொண்டுள்ளது. “ஆனால் நீங்களோ” இரண்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: இந்த ஆண்பால் பன்மை விளிவடிவம் சொற்பொருளில் “சகோதரர்களே” என்பதாகும். பவுல் இதை விசுவாசக் குழுமம் முழுவதையும் நோக்கிப் பயன்படுத்துவதால், அதன் உள்ளடக்கும் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: μὴ ἐγκακήσητε
  choice: சோர்ந்துபோகாதீர்கள்
  rationale: μή உடன் வரும் இறந்தகாலத் துணைவினை வடிவம் தடையைத் தெரிவிக்கிறது. ἐγκακέω தொடர்ந்து ஒரு செயலைச் செய்வதில் சோர்வடைவதையோ மனந்தளர்வதையோ குறிக்கலாம்; இச்சூழலில் “சோர்ந்துபோகாதீர்கள்” இயல்பாகவும் பொருத்தமாகவும் உள்ளது.
- source_word: καλοποιοῦντες
  choice: நன்மை செய்வதில்
  rationale: நிகழ்கால வினையெச்சம் தொடர்ந்து நடைபெறும் நற்செயலின் தளத்தைச் சுட்டுகிறது. “நன்மை செய்வதில்” அதன் தொடர்ச்சியான செயற்பொருளைத் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: சபையாரை அழைக்கும் ἀδελφοί என்பதன் மொழிபெயர்ப்பு
  choice: சகோதரர்களே
  alternative: சகோதர சகோதரிகளே
  rationale: கிரேக்கச் சொல் இலக்கணத்தில் ஆண்பால் பன்மையாக இருந்தாலும், இச்சூழலில் முழு விசுவாசக் குழுமத்தையும் உள்ளடக்கக்கூடும். மூல வடிவத்தை முதன்மை உரையில் காத்து, அதன் உள்ளடக்கும் பயன்பாட்டை அடிக்குறிப்பில் குறிப்பிடுவது உண்மையான வடிவத்தையும் சூழற்பொருளையும் இரண்டையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. “நீங்களோ” என்பது வாசகர்கள்மீது உள்ள வலியுறுத்தலையும் முந்தைய குழுவுடனான வேறுபாட்டையும் காக்கிறது; “சோர்ந்துபோகாதீர்கள்” பொதுவாகப் புரியும் தொடர்ச்சிச் சோர்வை வெளிப்படுத்துகிறது.
