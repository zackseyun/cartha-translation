  yaml_path: translation/nt/2_thessalonians/003/001.yaml
  text: Finally[a], brothers, pray for us, that the word of the Lord may spread rapidly and be honored, just as it was among you[b],
translation:
  language: ta
  text: இறுதியாக, சகோதரர்களே[a], ஆண்டவரின் வார்த்தை விரைவாகப் பரவி மதிப்புப் பெறும்படி[b], உங்களிடமும் அது நிகழ்ந்ததுபோலவே, எங்களுக்காக ஜெபியுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சகோதர சகோதரிகளே’; கிரேக்கத்தில் ‘சகோதரர்களே’ என்று இருந்தாலும், அது முழுச் சபையையும் பிரதிநிதித்துவமாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘ஓடி மகிமைப்படுத்தப்படும்படி.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ λοιπὸν
  choice: இறுதியாக
  rationale: கடிதத்தின் இறுதிப் பகுதியை அறிமுகப்படுத்தும் உரையாடல் குறியீடாக இயல்பான நவீனத் தமிழில் தரப்பட்டுள்ளது.
- source_word: προσεύχεσθε
  choice: வேண்டிக்கொள்ளுங்கள்
  rationale: பன்மை ஏவலை இயல்பாக வெளிப்படுத்துகிறது; சூழலில் தொடர்ந்த ஜெபத்திற்கான அழைப்பும் இதில் அடங்குகிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: கிரேக்கத்தின் ஆண்பால் பன்மை அழைப்பை நேரடியாகப் பாதுகாக்கிறது; இது முழுச் சபையையும் பிரதிநிதித்துவமாகக் குறிக்கக்கூடும் என்பது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: περὶ ἡμῶν
  choice: எங்களுக்காக
  rationale: προσεύχεσθε என்பதுடன் சேர்ந்துள்ள περί + பிறப்புவேற்றுமையின் இயல்பான தமிழ்ப் பொருள்.
- source_word: ὁ λόγος τοῦ κυρίου
  choice: ஆண்டவரின் வார்த்தை
  rationale: மூலத்தின் உறவுநிலைத் தொடரையும் வேதாகம வழக்கையும் பாதுகாக்கிறது; இங்கு அறிவிக்கப்படும் நற்செய்தியைக் குறிக்கிறது.
- source_word: τρέχῃ
  choice: விரைவாகப் பரவி
  rationale: ‘ஓடுதல்’ என்ற உருவகத்தின் சூழல்சார் கருத்தான செய்தியின் விரைவான முன்னேற்றத்தைத் தெளிவான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δοξάζηται
  choice: மதிப்புப் பெறும்படி
  rationale: வார்த்தை உரிய பெருமையுடன் ஏற்றுக்கொள்ளப்படுவதை இயல்பான தமிழில் கூறுகிறது; சொல்லுக்குச் சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: καθὼς καὶ πρὸς ὑμᾶς
  choice: உங்களிடையே நடந்ததுபோலவே
  rationale: தெசலோனிக்கேயர்களின் நடுவில் ஏற்கெனவே நிகழ்ந்ததைச் சுட்டும் ஒப்பீட்டை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சபையை நோக்கிய ἀδελφοί என்ற அழைப்பு
  choice: சகோதரர்களே
  alternative: சகோதர சகோதரிகளே
  rationale: மூலத்தின் இலக்கண ஆண்பால் வடிவம் முதன்மை உரையில் பாதுகாக்கப்படுகிறது; கலப்புப் பாலினச் சபை முழுவதையும் அது பிரதிநிதித்துவமாகக் குறிக்கக்கூடிய தன்மை அடிக்குறிப்பில் விளக்கப்படுகிறது.
- issue: ஆண்டவரின் வார்த்தை ‘ஓடுதல்’ மற்றும் ‘மகிமைப்படுத்தப்படுதல்’
  choice: விரைவாகப் பரவி மதிப்புப் பெறும்படி
  alternative: ஓடி மகிமைப்படுத்தப்படும்படி
  rationale: உருவகத்தின் நோக்கமான நற்செய்தியின் விரைவான முன்னேற்றத்தையும் அதற்குக் கிடைக்கும் உரிய வரவேற்பையும் தெளிவாகச் சொல்கிறது; மூல உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான சபை வாசிப்பு நடை பயன்படுத்தப்பட்டுள்ளது. உருவகத்தை முதன்மை உரையில் தெளிவாக்கி, அதன் சொல்லுக்குச் சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
