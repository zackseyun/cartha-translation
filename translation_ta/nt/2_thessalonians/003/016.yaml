  text: Αὐτὸς δὲ ὁ κύριος τῆς εἰρήνης δῴη ὑμῖν τὴν εἰρήνην διὰ παντὸς ἐν παντὶ τρόπῳ. ὁ κύριος μετὰ πάντων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/016.yaml
  text: May the Lord of peace himself give you peace at all times in every way[b][a]. The Lord be with all of you.
translation:
  language: ta
  text: சமாதானத்தின் ஆண்டவர் தாமே உங்களுக்கு எப்போதும்[a] எல்லா விதத்திலும்[b] சமாதானத்தைத் தருவாராக. ஆண்டவர் உங்கள் அனைவரோடும் இருப்பாராக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தொடர்ந்து.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எல்லா முறையிலும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: தாமே
  rationale: எழுவாயான ஆண்டவரை வலியுறுத்தும் intensive பயன்பாட்டை இயல்பான, மரியாதையான தமிழில் காட்டுகிறது.
- source_word: δὲ
  choice: வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது வலுவான முரண்பாட்டை அல்ல, நிறைவு ஆசீர்வாதத்திற்கான மென்மையான உரைமாற்றத்தையே குறிக்கிறது; தமிழில் தனி இணைப்புச் சொல் இல்லாமலேயே அந்த மாற்றம் இயல்பாகத் தெரிகிறது.
- source_word: ὁ κύριος τῆς εἰρήνης
  choice: சமாதானத்தின் ஆண்டவர்
  rationale: மூலத்தின் பெயரடைபோன்ற உறவுநிலைத் தொடரை விளக்கவுரை சேர்க்காமல் காக்கிறது.
- source_word: δῴη
  choice: தருவாராக
  rationale: வாழ்த்து அல்லது வேண்டுதலைக் குறிக்கும் optative வினையின் பொருளை தமிழின் ஆசிவடிவம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὴν εἰρήνην
  choice: சமாதானத்தை
  rationale: இங்கு εἰρήνη குறிக்கும் முழுமையான நலன் மற்றும் அமைதி என்ற வேதாகமப் பொருள் பரப்பை மரபுடனும் தெளிவுடனும் தக்கவைக்கிறது.
- source_word: διὰ παντὸς
  choice: எப்போதும்
  rationale: எல்லாக் காலங்களிலும் என்ற தொடர்ச்சியான காலப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐν παντὶ τρόπῳ
  choice: எல்லா விதத்திலும்
  rationale: τρόπος என்பதன் முறை அல்லது விதம் என்ற பரந்த பொருளை விளக்கமாகக் குறுக்காமல் காக்கிறது.
- source_word: μετὰ πάντων ὑμῶν
  choice: உங்கள் அனைவரோடும்
  rationale: πάντων என்பதன் அனைவரையும் உள்ளடக்கும் வலியுறுத்தலை இயல்பான தமிழில் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: ஆசீர்வாதத்தில் “ஆண்டவர்” என்பவர் யார்?
  choice: மூலத்தைப் போலவே “ஆண்டவர்” என்று மட்டும் கூறுவது
  alternative: “ஆண்டவராகிய இயேசு” என்று வெளிப்படையாக விரித்துரைப்பது அல்லது பொதுவாகக் கடவுளைக் குறிப்பதாக மாற்றுவது
  rationale: பவுலின் சூழலில் இது ஆண்டவராகிய இயேசுவைக் குறிக்கும் வாய்ப்பு மிகுந்தாலும், கிரேக்க வசனம் ὁ κύριος என்று மட்டுமே கூறுகிறது. ஆகவே மொழிபெயர்ப்பு மூலத்தில் இல்லாத அடையாளத்தைச் சேர்க்காமல் அதன் திறந்த தன்மையைப் பேணுகிறது.
- issue: இறுதி வினையில்லா கூறின் வலிமை
  choice: “ஆண்டவர் உங்கள் அனைவரோடும் இருப்பாராக” என்ற ஆசீர்வாத வேண்டுதல்
  alternative: “ஆண்டவர் உங்கள் அனைவரோடும் இருக்கிறார்” என்ற நிகழ்காலக் கூற்று
  rationale: கிரேக்கத்தில் வெளிப்படையான வினை இல்லாவிட்டாலும், சூழலில் இக்கூறு ஒரு நிறைவு ஆசீர்வாதமாகச் செயல்படுகிறது; “இருப்பாராக” அந்த வேண்டுதல் தன்மையைத் துல்லியமாகக் காட்டுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified வேதாகம நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. “தாமே” மூலத்தின் வலியுறுத்தலைக் காக்கிறது; “தருவாராக/இருப்பாராக” ஆகியவை ஆசீர்வாதத்தின் வேண்டுதல் தொனியைத் தக்கவைக்கின்றன.
