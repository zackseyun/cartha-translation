source:
  edition: SBLGNT
  text: καὶ γὰρ ὅτε ἦμεν πρὸς ὑμᾶς, τοῦτο παρηγγέλλομεν ὑμῖν, ὅτι εἴ τις οὐ θέλει ἐργάζεσθαι μηδὲ ἐσθιέτω.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/010.yaml
  text: 'For even when we were with you, we kept commanding you this: if anyone is not willing to work, neither let him eat.'
translation:
  language: ta
  text: 'ஏனெனில், நாங்கள் உங்களோடு இருந்தபோதுகூட உங்களுக்கு இதைக் கட்டளையிட்டுவந்தோம்: யாராவது வேலை செய்ய விரும்பாவிட்டால்[b], அவர் சாப்பிடவும் கூடாது[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் சாப்பிடாதிருக்கட்டும்.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்க வாசகம் “வேலை செய்ய மனமில்லாதிருப்பதை” குறிக்கிறது; வேலை செய்ய இயலாதிருப்பதை அல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: ஏனெனில் … இருந்தபோதே
  rationale: γάρ தரும் விளக்கத் தொடர்பை ‘ஏனெனில்’ என்பதும், καί தரும் வலியுறுத்தலை ‘போதே’ என்பதும் இயல்பான தமிழில் வெளிப்படுத்துகின்றன.
- source_word: ὅτε ἦμεν πρὸς ὑμᾶς
  choice: நாங்கள் உங்களோடு இருந்தபோது
  rationale: πρός இங்கு ஒருவருடன் இருப்பதைக் குறிக்கிறது; ‘உங்களோடு’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: τοῦτο
  choice: இதை
  rationale: இந்தச் சுட்டுப்பெயர் தொடர்ந்து வரும் கட்டளையின் உள்ளடக்கத்தைச் சுட்டுகிறது; ‘கட்டளை’ என்பதை மீண்டும் சேர்க்காமல் கிரேக்க அமைப்பைப் பாதுகாக்கிறது.
- source_word: παρηγγέλλομεν
  choice: கட்டளையிட்டுவந்தோம்
  rationale: முற்றுப்பெறாத இறந்தகால வடிவம் கடந்தகாலத்தில் தொடர்ந்து அல்லது வழக்கமாக வழங்கப்பட்ட கட்டளையை உணர்த்துகிறது.
- source_word: εἴ τις
  choice: யாராவது … என்றால்
  rationale: குறிப்பிடப்படாத எந்த நபருக்கும் பொருந்தும் நிபந்தனையை இயல்பான தமிழில் தருகிறது.
- source_word: οὐ θέλει ἐργάζεσθαι
  choice: வேலை செய்ய விரும்பாவிட்டால்
  rationale: θέλει திறனின்மையை அல்ல, மனவிருப்பம் அல்லது மனமுள்ள நிலையைச் சுட்டுகிறது; ‘மறுத்தால்’ என்பது மூலத்தைவிட வலுவானதாக இருக்கும்.
- source_word: μηδὲ ἐσθιέτω
  choice: அவர் சாப்பிடவும் கூடாது
  rationale: μηδέ முந்தைய எதிர்மறை நிலையைத் தொடர்ந்து ‘அப்படியானால் சாப்பிடவும் கூடாது’ என்ற கட்டளை வலிமையைத் தருகிறது. மரியாதை ஒருமையான ‘அவர்’ தமிழில் பொதுப்படையான நபரை இயல்பாகக் குறிக்கிறது.
theological_decisions:
- issue: இந்தக் கூற்று வேலை செய்ய இயலாதவர்களையா, வேலை செய்ய மனமில்லாதவர்களையா குறிக்கிறது?
  choice: வேலை செய்ய விரும்பாதவர்களைக் குறிக்கும் வகையில் ‘வேலை செய்ய விரும்பாவிட்டால்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: வேலை செய்ய முடியாவிட்டால்
  rationale: θέλει என்பது விருப்பத்தையும் மனமுள்ள நிலையையும் குறிக்கிறது; திறனின்மையைக் குறிக்கவில்லை. ஆகவே இயலாமையை உள்ளடக்குவது மூலத்தின் நெறிசார் கவனத்தை மாற்றிவிடும்.
- issue: τις என்பதற்குப் பின் வரும் ஒருமை கட்டளையின் பொதுப்படையான நபர் குறிப்பு
  choice: ‘அவர்’ என்ற மரியாதை ஒருமை பயன்படுத்தப்பட்டது.
  alternative: அவர்கள்
  rationale: கிரேக்கத்தில் குறிப்பிடப்படாத நபரும் தொடரும் வினையும் ஒருமையில் உள்ளன. தமிழில் ‘அவர்’ பாலினத்தைத் தேவையின்றி வரையறுக்காமல் ஒருமையையும் கண்ணியத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘கட்டளையிட்டுவந்தோம்’ தொடர்ச்சியான கடந்தகாலச் செயலைக் காக்கிறது; ‘சாப்பிடவும் கூடாது’ கட்டளையின் வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
