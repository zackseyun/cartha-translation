id: 2TH.3.2
reference: 2 Thessalonians 3:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἵνα ῥυσθῶμεν ἀπὸ τῶν ἀτόπων καὶ πονηρῶν ἀνθρώπων, οὐ γὰρ πάντων ἡ πίστις.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/002.yaml
  text: and that we may be delivered from wicked and evil men[b][a], for not all have faith.
translation:
  language: ta
  text: மேலும், முறைகெட்ட[a] தீய மனிதர்களிடமிருந்து நாங்கள் விடுவிக்கப்படும்படியும் வேண்டிக்கொள்ளுங்கள்; ஏனெனில், எல்லாரிடமும் விசுவாசம் இல்லை.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நியாயமற்ற.” கிரேக்கச் சொல் “தகாத,” “பொருத்தமற்ற,” அல்லது “நியாயமற்ற” என்றும் பொருள்படலாம்; இச்சூழலில் அது நெறிபிறழ்ந்த எதிரிகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஏனெனில், எல்லாரும் நம்பிக்கைக்குரியவர்கள் அல்ல.” கிரேக்க வாசகம் சொல்லுக்குச் சொல், “ஏனெனில், விசுவாசம் எல்லாருக்குரியதல்ல” என உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ῥυσθῶμεν
  choice: நாங்கள் விடுவிக்கப்படும்படி
  rationale: ἵνα என்பதற்குப் பின் வரும் இறந்தகாலச் செயப்பாட்டு வாய்பாட்டு வடிவத்தின் நோக்கப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; பகைவர்களின் பிடியிலிருந்து மீட்கப்படுதல் என்ற கருத்தையும் காக்கிறது.
- source_word: ἀτόπων
  choice: முறைகெட்ட
  rationale: ‘தகாத, பொருத்தமற்ற, நியாயமற்ற’ என்ற பொருள் வரம்பைக் கொண்ட இச்சொல், πονηρῶν என்பதோடு இணையும் இச்சூழலில் ஒழுக்கத்திலும் நடத்தையிலும் நெறிபிறழ்ந்த எதிரிகளைக் குறிக்கிறது. அடுத்துள்ள ‘தீய’ என்பதன் பொருளையே மீண்டும் சொல்லாமல் வேறுபாட்டைக் காக்கிறது.
- source_word: πονηρῶν
  choice: தீய
  rationale: ஒழுக்கரீதியான தீமையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கும் பொதுவான நவீனத் தமிழ் சொல்.
- source_word: ἀνθρώπων
  choice: மனிதர்களிடமிருந்து
  rationale: மனித நபர்களைக் குறிக்கும் பன்மைச் சொல்லை நேரடியாக வழங்குகிறது; ἀπό உடன் வரும் பிரிவுப் பொருளை ‘-இடமிருந்து’ வெளிப்படுத்துகிறது.
- source_word: πίστις
  choice: விசுவாசம்
  rationale: இங்கு எதிர்த்து நிற்கும் மனிதர்களைப் பற்றிய சூழலில், நம்பிக்கை அல்லது விசுவாசம் எல்லாரிடமும் இல்லை என்பதே மிக இயல்பான வாசிப்பு. இருப்பினும் ‘நம்பிக்கைக்குரிய தன்மை’ என்ற சாத்தியப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: οὐ γὰρ πάντων ἡ πίστις
  choice: ஏனெனில், எல்லாரிடமும் விசுவாசம் இல்லை
  rationale: ‘ஏனெனில், விசுவாசம் எல்லாருக்குரியதல்ல’ என்ற கிரேக்கச் சொல்லமைப்பின் சுருக்கத்தை, அளவுக்கு மீறிய இறையியல் முடிவைச் சேர்க்காமல் இயல்பான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: 'πίστις என்பதன் பொருள்: விசுவாசமா அல்லது நம்பிக்கைக்குரிய தன்மையா'
  choice: எல்லாரிடமும் விசுவாசம் இல்லை
  alternative: எல்லாரும் நம்பிக்கைக்குரியவர்கள் அல்ல
  rationale: அப்போஸ்தலப் பணியை எதிர்க்கும் மனிதர்களைப் பற்றிய உடனடிச் சூழலில் ‘விசுவாசம்’ என்பது முதன்மையான வாசிப்பு. எனினும் πίστις ‘நம்பிக்கைக்குரிய தன்மை/உண்மைத்தன்மை’ என்றும் பொருள்பட முடிவதால் அந்த உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. முந்தைய வசனத்திலிருந்து தொடரும் ἵνα நோக்கத் தொடரைத் தெளிவாக்க, தமிழில் இயல்பாகத் தேவைப்படும் ‘வேண்டிக்கொள்ளுங்கள்’ சேர்க்கப்பட்டுள்ளது. உண்மையான சொற்பொருள் மற்றும் இறையியல் தெளிவின்மைகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
