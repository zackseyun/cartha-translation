revisions:
- from: பவுலாகிய நான் என் சொந்தக் கையால் எழுதும் வாழ்த்து இது. ஒவ்வொரு கடிதத்திலும் இதுவே அடையாளம்[a]; நான் இப்படித்தான் எழுதுகிறேன்.
  to: என் சொந்தக் கையால் எழுதப்பட்ட வாழ்த்து இது—பவுல். ஒவ்வொரு கடிதத்திலும் இதுவே அடையாளம்[a]; இவ்வாறே எழுதுகிறேன்.
  rationale: The revision retains the personal-handwriting and authentication sense while avoiding the added present-tense relative-clause framing. The dash followed by “பவுல்” represents the Greek’s compact self-identification naturally in Tamil. The final clause remains deliberately open, as in the Greek.
  reviewer_model: gpt-5.6-terra
