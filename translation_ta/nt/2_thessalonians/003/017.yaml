source:
  edition: SBLGNT
  text: Ὁ ἀσπασμὸς τῇ ἐμῇ χειρὶ Παύλου, ὅ ἐστιν σημεῖον ἐν πάσῃ ἐπιστολῇ· οὕτως γράφω.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/017.yaml
  text: The greeting is by my own hand—Paul's—which is a sign in every letter[a]; this is how I write.
translation:
  language: ta
  text: என் சொந்தக் கையால் எழுதப்பட்ட வாழ்த்து இது—பவுல். ஒவ்வொரு கடிதத்திலும் இதுவே அடையாளம்[a]; இவ்வாறே எழுதுகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் சொந்தக் கையால் எழுதப்பட்ட வாழ்த்து—பவுல்—ஒவ்வொரு கடிதத்திலும் அடையாளம்; இவ்வாறே எழுதுகிறேன்.” கடைசிச் சொற்றொடரை, “நான் இப்படித்தான் எழுதுகிறேன்” என்றும் மொழிபெயர்க்கலாம்.
    reason: வாழ்த்துக்கும் ‘ஒவ்வொரு கடிதத்திலும் அடையாளம்’ என்பதற்கும் உள்ள தொடர்பின் மாற்றுச் சொற்றொடரமைப்பையும், οὕτως γράφω என்பதன் முறை/வழக்கைக் குறிக்கும் சாத்தியத்தையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: Ὁ ἀσπασμὸς
  choice: வாழ்த்து
  rationale: கடிதத்தின் முடிவில் சொல்லப்படும் வாழ்த்தைக் குறிக்கும் இயல்பான, தற்காலத் தமிழ் சொல்.
- source_word: τῇ ἐμῇ χειρὶ Παύλου
  choice: பவுலாகிய நான் என் சொந்தக் கையால் எழுதும்
  rationale: பவுலே இப்பகுதியைத் தன் கையெழுத்தில் எழுதுகிறார் என்ற வலியுறுத்தலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ὅ ἐστιν σημεῖον
  choice: இதுவே அடையாளம்
  rationale: முன்னுள்ள சொந்தக் கையெழுத்து வாழ்த்தை உறுதிப்படுத்தும் அடையாளமாகக் காட்டுகிறது; σημεῖον என்பதன் நேரடியான பொருளையும் காக்கிறது.
- source_word: ἐν πάσῃ ἐπιστολῇ
  choice: ஒவ்வொரு கடிதத்திலும்
  rationale: பவுலின் கடிதங்களில் காணப்படும் வழக்கத்தைக் குறிக்கிறது; ‘நிருபம்’ என்பதைவிட ‘கடிதம்’ இன்றைய வாசகர்களுக்கு இயல்பானது.
- source_word: οὕτως γράφω
  choice: நான் இப்படித்தான் எழுதுகிறேன்
  rationale: οὕτως என்பதில் உள்ள எழுதும் முறை அல்லது அடையாள வடிவைக் குறிக்கும் சாத்தியத்தை இயல்பான தமிழில் தருகிறது; குறுகிய ‘இவ்வாறு எழுதுகிறேன்’ என்ற பொருளும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: பவுலின் சொந்தக் கையெழுத்துக் குறிப்பின் நோக்கம்
  choice: இந்த வாழ்த்து பவுலின் கடிதங்களை அடையாளப்படுத்தும் அவரது சொந்தக் கையெழுத்து என மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: கடைசி வாக்கியம் இப்போதைய வாழ்த்தை மட்டும் சுட்டி, ‘இவ்வாறு எழுதுகிறேன்’ எனக் குறுகிய பொருளில் கொள்ளப்படலாம்.
  rationale: ‘ஒவ்வொரு கடிதத்திலும் அடையாளம்’ என்ற உடனடிச் சூழல் உண்மைத்தன்மையை உறுதிப்படுத்தும் கையெழுத்தைக் குறிக்கிறது; எனினும் இறுதி சொற்றொடரின் பரப்பை அடிக்குறிப்பு திறந்தவையாக வைக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் கடிதத்தின் நிறைவுக்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. ‘சொந்தக் கையால்’ என்பது பவுலின் தனிப்பட்ட கையெழுத்து என்ற வலியுறுத்தலைத் தக்கவைக்கிறது.
