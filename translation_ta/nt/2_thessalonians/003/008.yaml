source:
  edition: SBLGNT
  text: οὐδὲ δωρεὰν ἄρτον ἐφάγομεν παρά τινος, ἀλλ’ ἐν κόπῳ καὶ μόχθῳ ⸂νυκτὸς καὶ ἡμέρας⸃ ἐργαζόμενοι πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/008.yaml
  text: nor did we eat bread from anyone free of charge[a], but with labor and hardship, working night and day so as not to burden any of you.
translation:
  language: ta
  text: யாரிடமிருந்தும் இலவசமாக அப்பம் உண்ணவுமில்லை[a]; மாறாக, உங்களில் எவருக்கும் சுமையாயிருக்காதபடி, கடின உழைப்பிலும் பாடுகளிலும் இரவும் பகலும் வேலை செய்தோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாருடைய அப்பத்தையும் விலையின்றி உண்ணவில்லை.” கிரேக்கத்தில் “அப்பம்” என்பது நேரடியாகவே உள்ளது; ஆனால் அது உணவையோ பொருளாதார ஆதரவையோ விரிவாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: δωρεὰν
  choice: இலவசமாக
  rationale: பணம் அல்லது ஈடு கொடுக்காமல் பெற்றுக்கொள்வதைக் குறிக்கும் பொருளாதார நுட்பத்தை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἄρτον
  choice: அப்பம்
  rationale: சொல்லின் நேரடிப் பொருளைத் தக்கவைக்கிறது; இச்சூழலில் அது உணவு அல்லது பொருளாதார ஆதரவையும் விரிவாகக் குறிக்கலாம்.
- source_word: παρά τινος
  choice: யாரிடமிருந்தும்
  rationale: παρά + மரபுவேற்றுமை குறிக்கும் மூலத்தையும் τις தரும் வரையறையற்ற மறுப்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν κόπῳ καὶ μόχθῳ
  choice: பாடுபட்டு, கடினமாக
  rationale: இரு நெருங்கிய சொற்களும் சேர்ந்து வலியுறுத்தும் கடுமையான முயற்சியையும் துன்பத்தையும் தமிழில் இயல்பாகக் குவித்து வெளிப்படுத்துகிறது.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: இரவும் பகலும்
  rationale: தொடர்ச்சியான உழைப்பைக் குறிக்கும் கால மரபுத்தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: ἐργαζόμενοι
  choice: உழைத்தோம்
  rationale: முதன்மை வாக்கியத்துடன் இயல்பாக இணைத்து, தங்களைத் தாங்களே ஆதரிக்கச் செய்த வேலையைத் தெளிவாகக் காட்டுகிறது.
- source_word: πρὸς τὸ μὴ ἐπιβαρῆσαί
  choice: சுமையாக இருக்கக் கூடாது என்பதற்காக
  rationale: நோக்கத்தைக் காட்டும் கட்டமைப்பையும், பொருளாதார அல்லது பொருட்சார்ந்த பாரம் சுமத்தாதிருப்பதையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τινα ὑμῶν
  choice: உங்களில் எவருக்கும்
  rationale: ஒவ்வொருவரையும் தனித்தனியாக உள்ளடக்கும் வரையறையற்ற பொருளைத் தக்கவைக்கிறது.
- source_word: οὐδὲ ... ἀλλ’
  choice: மேலும் ... இல்லை; மாறாக
  rationale: முந்தைய கருத்துடன் தொடர்ச்சியையும், இலவச ஆதரவைப் பெறாமைக்கும் கடுமையாக உழைத்ததற்கும் இடையேயான வலுவான மாறுபாட்டையும் காட்டுகிறது.
