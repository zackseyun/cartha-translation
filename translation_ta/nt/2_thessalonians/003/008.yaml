translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டது. ‘அப்பம்’ என்ற தெளிவான உருவகம் தக்கவைக்கப்பட்டு, அதன் விரிவான பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
