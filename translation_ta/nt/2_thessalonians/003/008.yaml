review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the principal sense: refusing free support, working continually, and avoiding burdening anyone. However, “மேலும்” does not adequately represent the verse-initial negative connective οὐδέ (“nor/not even” in continuity with the preceding statement). The paired κόπῳ καὶ μόχθῳ is also better represented as strenuous labor together with hardship, rather than the somewhat loosely phrased “பாடுபட்டு, கடினமாக.”'
  naturalness: The draft is generally clear and modern. “சுமையாக இருக்கக் கூடாது என்பதற்காக” is understandable, but “சுமையாயிருக்காதபடி” is more concise and idiomatic in this purpose clause. A revised phrasing also avoids the awkward adverbial sequence “பாடுபட்டு, கடினமாக உழைத்தோம்.”
  terminology: “அப்பம்” appropriately retains the literal Greek ἄρτον, with a suitable note for its broader contextual sense. “இலவசமாக,” “இரவும் பகலும்,” and “உங்களில் எவருக்கும்” are accurate modern Tamil choices. No theological terminology requires alteration.
  issues:
  - severity: medium
    issue: The opening connective “மேலும்” weakens οὐδέ.
    rationale: οὐδέ continues a preceding negation as “nor” (or “nor did we”), not merely “furthermore.” Tamil “உண்ணவுமில்லை” naturally conveys the negative continuation.
  - severity: low
    issue: The rendering of ἐν κόπῳ καὶ μόχθῳ is stylistically imprecise.
    rationale: “பாடுபட்டு, கடினமாக உழைத்தோம்” is understandable but somewhat repetitive and does not distinctly convey both labor and hardship. “கடின உழைப்பிலும் பாடுகளிலும்” preserves the cumulative emphasis more naturally.
  revised_text: யாரிடமிருந்தும் இலவசமாக அப்பம் உண்ணவுமில்லை[a]; மாறாக, உங்களில் எவருக்கும் சுமையாயிருக்காதபடி, கடின உழைப்பிலும் பாடுகளிலும் இரவும் பகலும் வேலை செய்தோம்.
