revisions:
- from: மேலும், நாங்கள் யாரிடமிருந்தும் இலவசமாக அப்பம் உண்ணவில்லை[a]. மாறாக, உங்களில் எவருக்கும் சுமையாக இருக்கக் கூடாது என்பதற்காக, இரவும் பகலும் பாடுபட்டு, கடினமாக உழைத்தோம்.
  to: யாரிடமிருந்தும் இலவசமாக அப்பம் உண்ணவுமில்லை[a]; மாறாக, உங்களில் எவருக்கும் சுமையாயிருக்காதபடி, கடின உழைப்பிலும் பாடுகளிலும் இரவும் பகலும் வேலை செய்தோம்.
  rationale: The revision renders οὐδέ through the negative-continuative “உண்ணவுமில்லை,” retains the literal “அப்பம்,” clearly expresses the purpose of not burdening any individual among the readers, and gives κόπος plus μόχθος as “கடின உழைப்பிலும் பாடுகளிலும்.” The footnote remains anchored to “அப்பம்” and preserves the English audit trail’s lexical alternative without adding interpretation.
