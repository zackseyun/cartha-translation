revisions:
- from: ஏனெனில், சகோதரர்கள்[a] வந்து உன்னுடைய உண்மைக்குச் சாட்சி கூறியபோது[b]—நீ உண்மையில் நடக்கிறபடியே—நான் மிகவும் மகிழ்ந்தேன்.
  to: ஏனெனில், சகோதரர்கள்[a] வந்து, நீ உண்மையில் நடந்து வருகிறாய் என்று உன்னைப் பற்றிச் சாட்சி கூறியபோது, நான் மிகவும் மகிழ்ந்தேன்.
  rationale: The revision makes the testimony construction idiomatic Tamil by presenting the brothers’ report as testimony that Gaius is walking in truth. This reflects the likely sense of σου τῇ ἀληθείᾳ in light of the following καθὼς clause, while retaining “உண்மை” and the walking metaphor. Footnote b preserves the more formally close expression and the alternative interpretive formulation.
