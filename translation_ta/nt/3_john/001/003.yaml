source:
  edition: SBLGNT
  text: ἐχάρην γὰρ λίαν ἐρχομένων ἀδελφῶν καὶ μαρτυρούντων σου τῇ ἀληθείᾳ, καθὼς σὺ ἐν ἀληθείᾳ περιπατεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/003.yaml
  text: For I rejoiced greatly when brothers came and testified to your truth[c][b][a], just as you are walking in truth.
translation:
  language: ta
  text: ஏனெனில், சகோதரர்கள்[a] வந்து, நீ உண்மையில் நடந்து வருகிறாய் என்று உன்னைப் பற்றிச் சாட்சி கூறியபோது, நான் மிகவும் மகிழ்ந்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சகோதர சகோதரிகள்”; இங்கு சக விசுவாசிகள் குறிக்கப்படலாம். கிரேக்கத்தில் “சகோதரர்கள்” என்ற ஆண்பால் சொல் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχάρην
  choice: நான் மிகவும் மகிழ்ந்தேன்
  rationale: χαίρω என்பதன் இறந்தகால வடிவம் இங்கு செயப்பாட்டு அர்த்தத்தில் உள்ளது. λίαν என்பதன் வலியுறுத்தலையும் சேர்த்து இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்துடன் உள்ள விளக்கத் தொடர்பைப் பாதுகாக்கிறது.
- source_word: ἐρχομένων ἀδελφῶν
  choice: சகோதரர்கள் வந்து ... கூறியபோது
  rationale: மரபுத்தொடரின் காலச்சூழல் பொருளைத் தெளிவான தமிழ் வாக்கிய அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: ἀδελφῶν
  choice: சகோதரர்கள்
  rationale: கிரேக்கச் சொல்லின் ஆண்பால் பன்மையை நேரடியாகப் பாதுகாக்கிறது; இது சக விசுவாசிகளை உள்ளடக்கலாம் என்பதைக் குறிப்பில் தெரிவிக்கிறது.
- source_word: μαρτυρούντων
  choice: சாட்சி கூறியபோது
  rationale: μαρτυρέω என்பதிலுள்ள சாட்சியமளிக்கும் கருத்தைப் பாதுகாத்து, தமிழில் இயல்பாக ஒலிக்கிறது.
- source_word: σου τῇ ἀληθείᾳ
  choice: உன்னுடைய உண்மைக்குச் சாட்சி
  rationale: சொந்தக்குறிப்பான σου மற்றும் வேற்றுமை வடிவிலுள்ள ἀληθείᾳ ஆகியவற்றை நெருக்கமாகப் பிரதிபலிக்கிறது; இது காயுவின் தனிப்பட்ட ‘உண்மை’ என்று தவறாக முடிவுசெய்யாமல், உண்மையுடன் அவனுக்குள்ள தொடர்பைப் பற்றிய மூலத்தின் சுருக்கத்தையும் தெளிவின்மையையும் காக்கிறது.
- source_word: ἐν ἀληθείᾳ περιπατεῖς
  choice: நீ உண்மையில் நடக்கிறபடியே
  rationale: περιπατέω என்பதன் ஒழுக்க வாழ்வைக் குறிக்கும் நடை உருவகத்தையும், ἀλήθεια என்பதன் யோவானியச் சொல்லாட்சியையும் பாதுகாக்கிறது.
theological_decisions:
- issue: யோவானிய ஒழுக்கச் சூழலில் ‘உண்மை’ என்பதன் பொருள்
  choice: இரு இடங்களிலும் ‘உண்மை’ என்று மொழிபெயர்த்து, கோட்பாட்டு நம்பிக்கையும் வாழ்வின் நேர்மையும் ஒன்றுடன் ஒன்று தொடர்புடையதாக இருக்கும் பதற்றத்தைப் பாதுகாத்தல்
  alternative: ‘உண்மைக்கான உன் உண்மைத்தன்மை’ அல்லது ‘உன்னிடமுள்ள உண்மை’
  rationale: மூலவசனம் ஏற்றுக்கொள்ளப்பட்ட உண்மையையும் அதற்கேற்ற வாழ்க்கையையும் இணைக்கிறது; அதை வெறும் நேர்மை, விசுவாசம் அல்லது கோட்பாடு எனச் சுருக்குவது தேவையற்ற விளக்கத் தீர்மானமாகிவிடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘உண்மையில் நடத்தல்’ என்ற வேதாகம உருவகம் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளது; இடைக்கோடுகள் καθὼς உட்பிரிவின் விளக்கத் தன்மையைத் தெளிவாக்குகின்றன.
