id: 3JN.1.9
reference: 3 John 1:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἔγραψά ⸀τι τῇ ἐκκλησίᾳ· ἀλλ’ ὁ φιλοπρωτεύων αὐτῶν Διοτρέφης οὐκ ἐπιδέχεται ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/009.yaml
  text: I wrote something to the church[a], but Diotrephes, who loves to be first among them[b], does not receive us.
translation:
  language: ta
  text: சபைக்கு நான் ஏதோ எழுதினேன்[a]. ஆனால் அவர்களிடையே முதலிடத்தில் இருக்க விரும்புகிற தியோத்திரேப்பு நம்மை ஏற்றுக்கொள்வதில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சபைக்கு ஒரு சிறு குறிப்பு எழுதினேன்.” கிரேக்க மூலத்தில் பொருள் குறிப்பிடப்படாமல் “ஏதோ எழுதினேன்” என்று உள்ளது; சில கையெழுத்துப் பிரதிகள் இந்தச் சொற்றொடரை விரிவுபடுத்துகின்றன.
    reason: textual_variant
  - marker: b
    text: அல்லது, “நம்மை வரவேற்பதில்லை” அல்லது “நம்மை அங்கீகரிப்பதில்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔγραψά
  choice: நான் எழுதினேன்
  rationale: இறந்தகால வினை வடிவத்தைத் தமிழில் இயல்பான எளிய இறந்தகாலமாக மொழிபெயர்க்கிறது.
- source_word: τι
  choice: ஏதோ
  rationale: மூலத்தில் உள்ள பொருள் குறிப்பிடப்படாத சுட்டுப்பெயரின் தெளிவின்மையைப் பாதுகாக்கிறது; வெளிப்படையாக இல்லாத ‘குறிப்பு’ போன்ற பொருளைச் சேர்ப்பதில்லை.
- source_word: τῇ ἐκκλησίᾳ
  choice: சபைக்கு
  rationale: இங்கு உள்ளூர் கிறிஸ்தவக் கூடுகையைக் குறிக்கும் ἐκκλησία என்பதற்கான தமிழில் பரவலாக அறியப்படும் இயல்பான சொல்.
- source_word: ἀλλ’
  choice: ஆனால்
  rationale: எழுத்தாளரின் செயலுக்கும் தியோத்திரேப்பின் மறுப்புக்கும் இடையிலான வலுவான முரண்பாட்டைக் காட்டுகிறது.
- source_word: ὁ φιλοπρωτεύων
  choice: முதன்மையாக இருக்க விரும்புகிற
  rationale: முதலிடம் அல்லது முதன்மை நிலையை நாடும் மனப்பான்மையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; பதவி சார்ந்த ஒரு குறிப்பிட்ட பொருளைத் திணிப்பதில்லை.
- source_word: αὐτῶν
  choice: அவர்களிடையே
  rationale: அவன் முதன்மையை நாடும் குழு அல்லது வட்டத்தைச் சுட்டுகிறது; ‘அவர்கள்மேல்’ என்று மொழிபெயர்த்து அதிகாரத்தின் தன்மையை மிகுதியாக நிர்ணயிப்பதைத் தவிர்க்கிறது.
- source_word: Διοτρέφης
  choice: தியோத்திரேப்பு
  rationale: கிரேக்கப் பெயரைத் தமிழின் வழக்கமான வேதாகம ஒலிபெயர்ப்பு முறைக்கு ஏற்ப வழங்குகிறது.
- source_word: οὐκ ἐπιδέχεται ἡμᾶς
  choice: நம்மை ஏற்றுக்கொள்வதில்லை
  rationale: வரவேற்பு, அங்கீகாரம், ஏற்றுக்கொள்ளுதல் ஆகிய சாத்தியமான பொருட்களை உள்ளடக்கக்கூடிய பரந்த சொல்லாக்கம்; ஒரு பொருளை மட்டும் முடிவாக நிர்ணயிப்பதில்லை.
theological_decisions:
- issue: தியோத்திரேப்பின் எதிர்ப்பின் தன்மை
  choice: நம்மை ஏற்றுக்கொள்வதில்லை
  alternative: நம்மை வரவேற்பதில்லை; நம்மை அங்கீகரிப்பதில்லை
  rationale: ἐπιδέχεται என்பது விருந்தோம்பலையும், தனிப்பட்ட ஏற்றுக்கொள்ளுதலையும், எழுத்தாளர் அல்லது அவருடைய பிரதிநிதிகளின் அதிகாரத்தை அங்கீகரிப்பதையும் குறிக்கக்கூடும். மொழிபெயர்ப்பு இவற்றில் ஒன்றை மட்டும் தேர்ந்தெடுக்காமல் மூலத்தின் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவான வாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நடை. ‘ஏதோ’ என்பது மூலத்தின் பொருள் குறிப்பிடாத தன்மையைப் பாதுகாக்கிறது. ‘முதன்மையாக இருக்க விரும்புகிற’ என்பது அரிதான அல்லது பழமையான சமயச் சொல்லாக்கத்தைத் தவிர்க்கிறது.
