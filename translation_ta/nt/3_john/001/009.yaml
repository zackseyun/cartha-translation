  rationale: A small idiomatic revision replaces “முதன்மையாக இருக்க” with “முதலிடத்தில் இருக்க.” This more directly conveys Diotrephes’s desire for preeminence while retaining the source text’s noncommittal wording about the nature of his refusal to receive “us.” Footnote content and anchors remain valid.
