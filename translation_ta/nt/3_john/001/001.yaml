source:
  edition: SBLGNT
  text: Ὁ πρεσβύτερος Γαΐῳ τῷ ἀγαπητῷ, ὃν ἐγὼ ἀγαπῶ ἐν ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/001.yaml
  text: The elder to beloved Gaius[a], whom I love in truth.
translation:
  language: ta
  text: மூப்பர், அன்புக்குரிய காயுவுக்கு—அவரை நான் உண்மையில்[a] நேசிக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உண்மையாக’ என்றும் மொழிபெயர்க்கலாம்; அல்லது ‘உண்மையின் அடிப்படையில்’ என்றும் புரிந்துகொள்ளலாம். கிரேக்கச் சொற்றொடர் நேர்மையான அன்பையோ, நற்செய்தியின் உண்மையில் வேரூன்றிய அன்பையோ, அல்லது இரண்டையுமோ குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ πρεσβύτερος
  choice: மூப்பராகிய நான்
  rationale: இது கடிதத்தை அனுப்புபவர் தம்மைக் குறித்துக்கொள்ளும் அடையாளப் பெயர். ‘மூப்பர்’ என்பது வயது அல்லது சபைநிலை சார்ந்த நுட்பத்தைத் தேவையின்றி மிகத் தொழில்நுட்பமாக்காமல் காக்கிறது; இயல்பான தமிழ் கடிதத் தொடக்கத்திற்காக ‘ஆகிய நான்’ சேர்க்கப்பட்டுள்ளது.
- source_word: Γαΐῳ
  choice: காயுவுக்கு
  rationale: Γαΐος என்ற பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பாக ‘காயு’ பயன்படுத்தப்பட்டு, தந்தை வேற்றுமை ‘-க்கு’ மூலம் காட்டப்படுகிறது.
- source_word: τῷ ἀγαπητῷ
  choice: அன்புக்குரிய
  rationale: பெறுநர்மீதான பாசத்தைக் காட்டும் இந்த அடைமொழி, அடுத்து வரும் ἀγαπῶ என்பதுடனான பொருள் தொடர்பையும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: ὃν ἐγὼ ἀγαπῶ
  choice: உன்னை நான் நேசிக்கிறேன்
  rationale: உறவுப்பெயரால் அமைந்த கிரேக்க தொடரை தமிழில் இயல்பாக நேரடி இரண்டாம் நபர் தொடராக வழங்குகிறது. வெளிப்படையான ἐγώ-வின் மிதமான வலியுறுத்தலை ‘நான்’ காக்கிறது.
- source_word: ἐν ἀληθείᾳ
  choice: உண்மையில்
  rationale: இது நேர்மையாக அல்லது உண்மையாக நேசிப்பதையும், யோவானிய ‘உண்மை’யில் வேரூன்றிய அன்பையும் சுட்டக்கூடும். ‘உண்மையில்’ இரு நுட்பங்களுக்கும் இடமளிக்கிறது; அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: ἐν ἀληθείᾳ என்பதிலுள்ள யோவானிய ‘உண்மை’யின் நுட்பம்
  choice: உண்மையில்
  alternative: உண்மையாக; உண்மைக்குள்
  rationale: இந்த சொற்றொடர் வெறும் மனப்பூர்வத்தையோ, நற்செய்தியின் உண்மையை அடிப்படையாகக் கொண்ட அன்பையோ, இரண்டையுமோ குறிக்கலாம். முதன்மைப் பாடம் ஒன்றை மட்டும் இறுதியாகத் தீர்மானிக்காமல் பொருள் விரிவைக் காக்கிறது; மாற்று நுட்பங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் கடித நடையைக் கொண்ட மொழிபெயர்ப்பு. கிரேக்கத்தின் பெயர்ச்சொல் சார்ந்த தொடக்கத்தைத் தமிழில் முழுமையான கடித அறிமுகமாக்க ‘எழுதுவது’ சேர்க்கப்பட்டுள்ளது. ‘அன்புக்குரிய’ மற்றும் ‘நேசிக்கிறேன்’ பாசத்தையும் மூலத்தின் சொற்பொருள் தொடர்பையும் காக்கின்றன.
