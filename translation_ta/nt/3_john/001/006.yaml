source:
  edition: SBLGNT
  text: οἳ ἐμαρτύρησάν σου τῇ ἀγάπῃ ἐνώπιον ἐκκλησίας, οὓς καλῶς ποιήσεις προπέμψας ἀξίως τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/006.yaml
  text: They testified before the church about your love[a], and you will do well to send them on their way in a manner worthy of God.
translation:
  language: ta
  text: அவர்கள் சபையின் முன்னிலையில் உங்களுடைய அன்பைக் குறித்துச் சாட்சி அளித்தார்கள். அவர்களைக் கடவுளுக்குத் தகுந்தவிதமாக வழியனுப்பினால்[a], நீங்கள் நன்றாகச் செய்வீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய பயணத்திற்கு உதவி செய்து அனுப்பினால்”; கிரேக்கச் சொல் பயணிகள் தொடர்ந்து செல்லத் தேவையான நடைமுறை உதவிகளை வழங்குவதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρησάν
  choice: சாட்சி அளித்தார்கள்
  rationale: இறந்தகால வினைமுற்று நிகழ்ந்து முடிந்த சாட்சியளிப்பைக் குறிக்கிறது; தமிழில் எளிய இறந்தகாலம் இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: σου τῇ ἀγάπῃ
  choice: உங்களுடைய அன்பைக் குறித்து
  rationale: வேற்றுமை உருபு சாட்சியின் பொருளைச் சுட்டுகிறது; காயுவின் அன்பைப் பற்றி அவர்கள் தெரிவித்தார்கள் என்ற பொருளை இது இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐνώπιον ἐκκλησίας
  choice: திருச்சபையின் முன்னிலையில்
  rationale: கூடியிருந்த கிறிஸ்தவச் சமூகத்தின் முன்னிலையில் நடந்த பொதுச் சாட்சியைக் குறிக்கிறது.
- source_word: καλῶς ποιήσεις
  choice: நீங்கள் நல்லது செய்வீர்கள்
  rationale: எதிர்கால வடிவத்தையும், பணிவான அறிவுரை அல்லது பாராட்டுக் கலந்த வேண்டுகோள் என்ற சொல்லாட்சியின் வலிமையையும் காக்கிறது.
- source_word: προπέμψας
  choice: வழியனுப்பினால்
  rationale: பயணிகளை அடுத்த கட்டப் பயணத்திற்கு அனுப்புவதைக் குறிக்கிறது; நடைமுறை உதவியும் இதில் உட்படக்கூடும் என்பதால் அந்த நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀξίως τοῦ θεοῦ
  choice: கடவுளுக்கு ஏற்ற முறையில்
  rationale: அவர்களை அனுப்பும் விதம் கடவுளின் மாண்புக்கும் விருப்பத்துக்கும் ஏற்றதாக இருக்க வேண்டும் என்ற கருத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: προπέμπω என்பதில் அடங்கிய கிறிஸ்தவ விருந்தோம்பலின் நுணுக்கம்
  choice: முதன்மை உரையில் “வழியனுப்பினால்” என்று மொழிபெயர்த்து, பயணத்திற்கான நடைமுறை உதவி என்ற நுணுக்கத்தை அடிக்குறிப்பில் காத்தல்
  alternative: “அவர்களுடைய பயணத்திற்கு உதவி செய்து அனுப்பினால்”
  rationale: இந்தச் சொல் வெறுமனே விடை கொடுத்து அனுப்புவதை மட்டுமல்லாமல், அடுத்த கட்டப் பயணத்திற்குத் தேவையான உதவிகளை வழங்குவதையும் குறிக்கலாம். ஆனால் உதவியின் வடிவத்தை மூலவசனம் குறிப்பாக வரையறுக்காததால், முதன்மை உரை அதை மிகையாக விளக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் தொடர்பு காக்கப்பட்டாலும், தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது. காயுவைக் குறிக்கும் ஒருமை இரண்டாம் நபருக்கு மரியாதைப் பன்மையான “உங்கள்/நீங்கள்” பயன்படுத்தப்பட்டுள்ளது.
