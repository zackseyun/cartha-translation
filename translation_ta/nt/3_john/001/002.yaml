id: 3JN.1.2
reference: 3 John 1:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἀγαπητέ, περὶ πάντων εὔχομαί σε εὐοδοῦσθαι καὶ ὑγιαίνειν, καθὼς εὐοδοῦταί σου ἡ ψυχή.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/002.yaml
  text: Beloved[a], I pray that in all respects you may prosper and be healthy[d][c][b], just as your soul prospers.
translation:
  language: ta
  text: அன்புக்குரியவனே[a], உன் ஆன்மா[d] நலம்பெறுவதுபோல, நீ எல்லா வகையிலும்[b] நலம்பெற்று உடல்நலத்தோடு[c] இருக்கவும் நான் ஜெபிக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அன்பானவனே’ அல்லது ‘அன்புக்குரிய நண்பனே’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, ‘எல்லாவற்றிலும்’ அல்லது ‘ஒவ்வொரு வகையிலும்.’ ‘எல்லாவற்றிற்கும் மேலாக’ என்பது மரபான மொழிபெயர்ப்பு; ஆனால் கிரேக்கம் முன்னுரிமையைவிடப் பரப்பையே இயல்பாகக் குறிக்கிறது. ‘எல்லாவற்றைக் குறித்தும், நீ நலம்பெறவும் உடல்நலத்தோடு இருக்கவும் நான் ஜெபிக்கிறேன்’ என்றும் தொடரை அமைக்கலாம்.
    reason: alternative_reading
  - marker: c
    text: ‘நல்ல உடல்நிலையில் இருக்க’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: d
    text: ‘உன் உள்ளான வாழ்வு நலம்பெறுவதுபோல’ அல்லது ‘உன் ஆன்மா செழித்திருப்பதுபோல’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: அன்புக்குரியவனே
  rationale: அன்பை வெளிப்படுத்தும் ஒருமை விளிப்பை இயல்பான, கண்ணியமான தமிழில் தருகிறது; ἀγάπη என்ற அன்புச் சொல்லுடனான பொருள் தொடர்பையும் தக்கவைக்கிறது.
- source_word: περὶ πάντων
  choice: எல்லா வகையிலும்
  rationale: முன்னுரிமையை அல்ல, வாழ்வின் அனைத்துப் பரிமாணங்களையும் குறிக்கும் பரப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εὔχομαί
  choice: நான் வேண்டிக்கொள்கிறேன்
  rationale: கடிதச் சூழலில் உள்ள வேண்டுதல் அல்லது ஜெப விருப்பத்தின் நயத்தைத் தக்கவைக்கிறது; யாரிடம் வேண்டுகிறார் என்பதை மூலவாக்கியத்தைவிடத் தெளிவாகச் சேர்க்கவில்லை.
- source_word: σε εὐοδοῦσθαι
  choice: நீ நலம்பெற்று
  rationale: காரியங்கள் நன்றாக நடைபெறுதல், வாழ்வு சிறத்தல் என்ற விரிவான பொருளை உடல்நலத்துக்கு மட்டும் சுருக்காமல் தருகிறது.
- source_word: ὑγιαίνειν
  choice: உடல்நலத்துடன் இருக்க
  rationale: இச்சூழலில் உடல் ஆரோக்கியத்தை இயல்பாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: καθὼς
  choice: போல
  rationale: வெளிப்புற நல்வாழ்வுக்கும் ஆன்மாவின் நல்வாழ்வுக்கும் இடையிலான ஒப்புமையை நேரடியாகக் காட்டுகிறது.
- source_word: εὐοδοῦταί σου ἡ ψυχή
  choice: உன் ஆன்மா நலம்பெறுவதுபோல
  rationale: முன்னுள்ள εὐοδοῦσθαι என்பதுடனான சொற்பொருள் எதிரொலியை ‘நலம்பெறு’ என்ற மறுபயன்பாட்டால் தக்கவைக்கிறது.
- source_word: ψυχή
  choice: ஆன்மா
  rationale: உயிர், தன்மையுள்ள நபர், உள்ளான வாழ்வு ஆகிய பொருள் வாய்ப்புகளை உடைய சொல்லுக்கு மரபாகப் புரியக்கூடிய இணையைத் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
theological_decisions:
- issue: தொடக்க வேண்டுதலில் περὶ πάντων என்பதன் பொருள்
  choice: எல்லா வகையிலும்
  alternative: எல்லாவற்றிற்கும் மேலாக
  rationale: கிரேக்கச் சொற்றொடர் முன்னுரிமையைவிடப் பரப்பைக் குறிப்பதே இயல்பானது. ஆகவே இதை மிக உயர்ந்த முன்னுரிமை பற்றிய கூற்றாக மாற்றவில்லை.
- issue: ψυχή என்பதன் பொருள்
  choice: ஆன்மா
  alternative: உள்ளான வாழ்வு / உயிர்
  rationale: உடல்நலத்துடன் ஒப்பிடப்படும் உள்ளார்ந்த நலத்தைச் சுட்டுகிறது; மனித இயல்பின் அமைப்பு குறித்த விரிவான கோட்பாட்டை வசனத்துக்குள் திணிக்காமல் மூலத்தின் தெளிவின்மையை அடிக்குறிப்பில் காக்கிறது.
- issue: εὔχομαι என்பதில் ஜெபமா விருப்பமா என்ற நயம்
  choice: வேண்டிக்கொள்கிறேன்
  alternative: விரும்புகிறேன்
  rationale: இச்சொல் ஜெபத்தையும் நல்வாழ்த்தான விருப்பத்தையும் உணர்த்தக்கூடும். ‘வேண்டிக்கொள்கிறேன்’ அதன் சமய நயத்தைத் தக்கவைத்தாலும், மூலத்தில் சொல்லப்படாத வேண்டுதலின் பெறுநரைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான தனிப்பட்ட கடித நடையைப் பயன்படுத்துகிறது. ‘நலம்பெறு’ என்பதை இருமுறை பயன்படுத்துவது கிரேக்கத்தில் εὐοδοῦσθαι / εὐοδοῦται என்ற வினைச்சொல் மீண்டும் வருவதைக் காக்கிறது. சொல் வரிசை இயல்பான தமிழுக்காக மாற்றப்பட்டாலும், வேண்டுதல், அதன் பரப்பு, உடல்நலம், ஆன்மாவின் நலம் ஆகிய கூறுகள் அனைத்தும் தக்கவைக்கப்பட்டுள்ளன.
