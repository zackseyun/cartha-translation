source:
  edition: SBLGNT
  text: ὑπὲρ γὰρ τοῦ ὀνόματος ἐξῆλθον μηδὲν λαμβάνοντες ἀπὸ τῶν ⸀ἐθνικῶν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/007.yaml
  text: For they went out for the sake of the Name[a], taking nothing from the Gentiles.
translation:
  language: ta
  text: ஏனெனில், அவர்கள் திருநாமத்திற்காகப் புறப்பட்டுச் சென்றார்கள்; பிற இனத்தாரிடமிருந்து[a] எதையும் ஏற்றுக்கொள்ளாமல்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘புறச்சமயத்தாரிடமிருந்து’ அல்லது ‘நம்பிக்கையற்றவர்களிடமிருந்து.’
    reason: ἐθνικῶν என்பது ‘பிற இனத்தார்’ என்பதைக் குறித்தாலும், இச்சூழலில் கிறிஸ்தவ நம்பிக்கைக்கு வெளியே உள்ளவர்களைக் குறிக்கும் சமயப் பொருளும் இருக்கலாம்.
lexical_decisions:
- source_word: ὑπὲρ
  choice: -க்காக
  rationale: இங்கு இறுதிப்பொருளுடன் வரும் ὑπέρ, பதிலீட்டைக் காட்டாமல் நோக்கம் அல்லது காரணத்தைக் காட்டுகிறது. ‘-க்காக’ என்பது இதை இயல்பான நவீனத் தமிழில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: τοῦ ὀνόματος
  choice: திருப்பெயர்
  rationale: கிரேக்கத்தில் உள்ள ‘அந்தப் பெயர்’ என்பது இயேசுவை அல்லது ஆண்டவரை நேரடியாகக் குறிப்பிடாமல் மரியாதையுடன் சுட்டும் தொடக்ககாலக் கிறிஸ்தவ வழக்கு. ‘திருப்பெயர்’ அந்த மறைமுகமான மரியாதையையும் இறையியல் செறிவையும் காக்கிறது; மூலத்தில் இல்லாத ‘கிறிஸ்துவின்’ என்ற விளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: ἐξῆλθον
  choice: புறப்பட்டுச் சென்றார்கள்
  rationale: இறைப்பணிப் பயணத்திற்காக அவர்கள் தங்கள் இடத்திலிருந்து சென்றதை இயல்பாகத் தெரிவிக்கிறது. வெறும் ‘சென்றார்கள்’ என்பதைவிட புறப்படுதலின் கருத்தையும் காக்கிறது.
- source_word: μηδὲν λαμβάνοντες
  choice: எதையும் பெற்றுக்கொள்ளவில்லை
  rationale: பெயரெச்ச வினை வடிவம் அவர்கள் புறப்பட்டுச் சென்ற விதத்தை விவரிக்கிறது. தமிழில் இயல்புக்காக முற்றுவினையாக அமைக்கப்பட்டாலும், பணமோ பொருளுதவியோ எதையும் ஏற்கவில்லை என்ற பொருள் காக்கப்படுகிறது.
- source_word: ἀπὸ τῶν ἐθνικῶν
  choice: பிற இனத்தாரிடமிருந்து
  rationale: ἐθνικοί என்பதன் இன-சமயப் பின்னணியை ‘பிற இனத்தார்’ காக்கிறது. சூழலில் இது கிறிஸ்தவ நம்பிக்கைக்கு வெளியே இருந்தவர்களைக் குறிக்கலாம்; அந்தச் சூழல்சார் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: ‘திருப்பெயர்’ யாரைக் குறிக்கிறது?
  choice: இயேசுவை அல்லது ஆண்டவரை மரியாதையுடன் மறைமுகமாகக் குறிக்கும் சொல்லாகவே முதன்மை உரையில் விடப்பட்டுள்ளது.
  alternative: ‘கிறிஸ்துவின் பெயருக்காக’ அல்லது ‘அவருடைய பெயருக்காக’ என்று வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: மூல உரை யாருடைய பெயர் என்று நேரடியாகச் சொல்லாமல் ‘பெயர்’ என்ற மரியாதைமிக்க சுருக்கத்தையே பயன்படுத்துகிறது. அதையே காப்பது மூலத்தின் இறையியல் ஒலிப்பை நிலைநிறுத்துவதோடு, உரையில் இல்லாத விளக்கத்தையும் சேர்க்காமல் தவிர்க்கிறது.
- issue: ἐθνικῶν என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘பிற இனத்தார்’.
  alternative: ‘புறச்சமயத்தார்’ அல்லது ‘நம்பிக்கையற்றவர்கள்’.
  rationale: இச்சொல் சூழலில் சமயத்திற்கு வெளியே இருப்பவர்களைக் குறித்தாலும், அதன் வரலாற்று இன-சமய நிறத்தை ‘பிற இனத்தார்’ சிறப்பாகக் காக்கிறது. சூழல்சார் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘திருப்பெயர்’ மரியாதைமிக்க மறைமுகக் குறிப்பை இயல்பாகக் காக்கிறது; ‘புறப்பட்டுச் சென்றார்கள்’ பயணத்தின் தொடக்கத்தைத் தெளிவாக்குகிறது.
