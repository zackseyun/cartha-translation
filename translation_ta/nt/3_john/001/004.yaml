source:
  edition: SBLGNT
  text: μειζοτέραν τούτων οὐκ ἔχω ⸀χαράν, ἵνα ἀκούω τὰ ἐμὰ τέκνα ἐν ⸀τῇ ἀληθείᾳ περιπατοῦντα.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/004.yaml
  text: 'I have no greater joy than this: to hear that my children are walking in the truth[a][b].'
translation:
  language: ta
  text: என் பிள்ளைகள் உண்மையின் வழியில் வாழ்கிறார்கள் என்று கேள்விப்படுவதைவிட எனக்குப் பெரிய மகிழ்ச்சி எதுவும் இல்லை.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக மொழிபெயர்த்தால், “இவற்றைவிடப் பெரிய மகிழ்ச்சி எனக்கு இல்லை.”
    reason: lexical_alternative
  - marker: b
    text: “என் பிள்ளைகள்” என்பது எழுத்தாளரின் மேய்ப்புப் பராமரிப்பில் இருந்த விசுவாசிகளாகிய அவருடைய ஆன்மிகப் பிள்ளைகளைக் குறிக்க வாய்ப்புள்ளது.
    reason: cultural_note
lexical_decisions:
- source_word: μειζοτέραν
  choice: பெரிய
  rationale: χαράν என்பதுடன் வரும் ஒப்பீட்டுப் பெயரடை. ‘இதைவிடப் பெரிய மகிழ்ச்சி இல்லை’ என்பது இயல்பான நவீனத் தமிழ் நடை.
- source_word: τούτων
  choice: …வதைவிட
  rationale: ஒப்பீட்டைக் குறிக்கும் பன்மைச் சுட்டுப்பெயர். அடுத்து வரும் கருத்தையே மகிழ்ச்சிக்கான காரணமாகக் கொண்டு, தமிழில் இயல்பாக வினைப்பெயர் ஒப்பீடாக வடிவமைக்கப்பட்டுள்ளது; மூலத்தின் நேரடியான பன்மை அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: χαράν
  choice: மகிழ்ச்சி
  rationale: உணர்ச்சியின் ஆழத்தையும் வேதாகமச் சொல்லாட்சியின் கண்ணியத்தையும் இயல்பாகக் காக்கும் பொதுவான தமிழ் இணைச்சொல்.
- source_word: ἵνα ἀκούω
  choice: என்று கேள்விப்படுவதை
  rationale: இங்கு ἵνα நோக்கத்தை மட்டும் அல்லாமல், மகிழ்ச்சி எதில் அடங்கியுள்ளது என்பதைக் கூறுகிறது. தமிழ் வினைப்பெயர் அமைப்பு அந்த உறவைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: τὰ ἐμὰ τέκνα
  choice: என் பிள்ளைகள்
  rationale: கிரேக்கத்தின் குடும்ப உறவு உருவகத்தை அப்படியே காக்கிறது; அவர்கள் உடல் வழிப் பிள்ளைகளா, ஆன்மிகப் பிள்ளைகளா என்பதை முதன்மை உரையில் தீர்மானிக்கவில்லை.
- source_word: ἐν τῇ ἀληθείᾳ
  choice: உண்மையின் வழியில்
  rationale: யோவானின் பயன்பாட்டில் ‘உண்மை’ என்பது உண்மையான நடத்தையையும் வெளிப்படுத்தப்பட்ட உண்மையால் வடிவமைக்கப்பட்ட வாழ்வையும் ஒருங்கே சுட்டலாம். ‘உண்மையின் வழியில்’ என்பது அந்த விரிவைச் சுருக்காமல் தமிழில் இயல்பாகத் தருகிறது.
- source_word: περιπατοῦντα
  choice: வாழ்கிறார்கள்
  rationale: இது வாழ்க்கை நடத்தையைக் குறிக்கும் கிரேக்க உருவகம். தமிழில் வெறுமனே ‘நடக்கிறார்கள்’ என்றால் உடல் இயக்கமாகத் தவறாகப் புரியலாம்; ‘வழியில் வாழ்கிறார்கள்’ என்பது பாதை உருவகத்தின் சாயலையும் நெறியான வாழ்வையும் ஒருங்கே தெரிவிக்கிறது.
theological_decisions:
- issue: τέκνα என்பது உடல் வழிப் பிள்ளைகளையா ஆன்மிகப் பிள்ளைகளையா குறிக்கிறது?
  choice: முதன்மை உரையில் ‘என் பிள்ளைகள்’ என்று குடும்ப உறவுச் சொல்லைத் தக்கவைத்தல்.
  alternative: என் ஆன்மிகப் பிள்ளைகள்; என்னால் விசுவாசத்திற்கு வந்தவர்கள்
  rationale: சூழல் மேய்ப்புப் பராமரிப்பில் உள்ள விசுவாசிகளைச் சுட்டுவதாக வலுவாக உணர்த்தினாலும், கிரேக்கம் ‘பிள்ளைகள்’ என்ற உருவகத்தையே பயன்படுத்துகிறது. குறுகிய விளக்கத்தை உரைக்குள் புகுத்தாமல் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: ἐν τῇ ἀληθείᾳ என்பதன் பொருள்
  choice: ‘உண்மையின் வழியில்’ என்று மொழிபெயர்த்து, கோட்பாட்டு உண்மையையும் அதற்கேற்ற வாழ்க்கையையும் இணைக்கும் பரப்பைத் தக்கவைத்தல்.
  alternative: உண்மையாக; உண்மையான போதனைக்கேற்ப
  rationale: யோவானிய மொழிநடையில் ‘உண்மை’ என்பது நேர்மையான நடத்தைக்கு மட்டுமோ சரியான போதனைக்கு மட்டுமோ சுருக்கப்படுவதில்லை. இரு பரிமாணங்களும் இணைந்திருக்கக்கூடிய பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நடக்கிறார்கள்’ என்ற நேரடி மொழிபெயர்ப்பு தமிழில் உடல் இயக்கமாகத் தவறாகப் புரியக்கூடும் என்பதால், ‘உண்மையின் வழியில் வாழ்கிறார்கள்’ என வாழ்க்கைநடத்தைக் கருத்தும் பாதை உருவகத்தின் சாயலும் இணைக்கப்பட்டுள்ளன.
