source:
  edition: SBLGNT
  text: Πολλὰ εἶχον ⸂γράψαι σοι⸃, ἀλλ’ οὐ θέλω διὰ μέλανος καὶ καλάμου σοι ⸀γράφειν·
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/013.yaml
  text: I had many things to write to you[a], but I do not want to write to you with ink and pen;
translation:
  language: ta
  text: உனக்கு எழுத எனக்குப் பல காரியங்கள் இருந்தன. ஆனால் மையாலும் எழுதுகோலாலும்[a] உனக்கு எழுத நான் விரும்பவில்லை;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எழுதுகோல்” என்பதற்கான கிரேக்கச் சொல் சொல்லுக்குச் சொல் “நாணல்” என்று பொருள்படும்; எழுதுவதற்கு நாணலால் செய்யப்பட்ட எழுதுகோல் பயன்படுத்தப்பட்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλὰ
  choice: பல காரியங்கள்
  rationale: நபுஞ்சகப் பன்மை பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்டுள்ளதால், பன்மை உணர்வைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: εἶχον
  choice: எனக்கு ... இருந்தன
  rationale: கிரேக்க இறந்தகாலத் தொடரைத் தக்கவைத்து, எழுதப்படாமல் இருந்த பல காரியங்களைக் குறிக்கிறது.
- source_word: γράψαι σοι
  choice: உனக்கு எழுத
  rationale: எண்ணப்பட்ட எழுதும் செயலை எளிய, இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἀλλ’ οὐ θέλω
  choice: ஆனால் ... நான் விரும்பவில்லை
  rationale: θέλω என்பதன் விருப்பம் அல்லது மனவிருப்பம் சார்ந்த பொருளை, தேவையற்ற வலுப்படுத்தல் இன்றி நேரடியாகத் தருகிறது.
- source_word: διὰ μέλανος καὶ καλάμου
  choice: மையாலும் எழுதுகோலாலும்
  rationale: διά உடன் வரும் கருவிப்பொருளைத் தமிழின் ‘ஆல்’ வேற்றுமையால் காட்டுகிறது. κάλαμος சொல்லின் எழுத்துக் கருவி சார்ந்த செயல்பாட்டை முதன்மை உரையில் ‘எழுதுகோல்’ என இயல்பாக வழங்கி, அதன் நேரடிப் பொருளை அடிக்குறிப்பில் தருகிறது.
- source_word: γράφειν
  choice: எழுத
  rationale: நிகழ்கால வினையெச்சத்தின் செயற்பாட்டு அம்சத்தை மிகைப்படுத்தாமல், தமிழில் இயல்பான வினை வடிவில் தருகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் கடிதத்தின் நேரடியான, கண்ணியமான தொனியுடனும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பல காரியங்கள்’ என்பது பன்மையைப் பாதுகாக்கிறது; ‘உனக்கு’ என்பது மூலத்தின் ஒருமை நெருக்கத்தைத் தக்கவைக்கிறது.
