  text: But I hope to see you soon[a], and we will speak face to face.
translation:
  language: ta
  text: ஆனால், உன்னை விரைவில் காண்பேன் என்று நம்புகிறேன்; நாம் நேருக்கு நேர்[a] பேசுவோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், ‘வாயோடு வாய்.’ இச்சொற்றொடர் நேரடியான தனிப்பட்ட உரையாடலைக் குறிக்கிறது; அதாவது, ‘நேருக்கு நேர்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίζω
  choice: நம்புகிறேன்
  rationale: நிகழ்கால வினைச்சொல் எழுத்தாளரின் தற்போதைய நம்பிக்கையையும் எதிர்பார்ப்பையும் தெரிவிக்கிறது. தமிழில் கடித முடிவுரைக்கு இயல்பாக அமையும் சொல் இது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய கருத்திலிருந்து மென்மையான எதிர்மறைத் திருப்பத்தை இது குறிக்கிறது; அதைத் தமிழில் இயல்பாகக் காக்கிறது.
- source_word: εὐθέως
  choice: விரைவில்
  rationale: இங்கு உடனடியான கணப்பொழுது நடவடிக்கையைவிட, சந்திப்பு அண்மையில் நிகழும் என்ற காலக் கருத்தே சூழலுக்குப் பொருந்துகிறது.
- source_word: σε ἰδεῖν
  choice: உன்னை ... காண்பேன்
  rationale: கிரேக்கச் சொற்றொடரின் நேரடியான பொருளைத் தக்கவைக்கிறது; ‘உன்னைச் சந்திக்க’ என்பது சற்றுக் கூடுதலான விளக்கமாக இருக்கும்.
- source_word: στόμα πρὸς στόμα
  choice: நேருக்கு நேர்
  rationale: சொல்லுக்குச் சொல் ‘வாயோடு வாய்’ என்றாலும், இச்சொல்லடை நேரடியாக ஒருவருடன் ஒருவர் உரையாடுவதைக் குறிக்கிறது. ‘நேருக்கு நேர்’ நவீனத் தமிழில் இயல்பான இணைச்சொல்லடை.
- source_word: λαλήσομεν
  choice: பேசுவோம்
  rationale: எதிர்கால வினை வடிவத்தையும், எதிர்பார்க்கப்படும் தனிப்பட்ட உரையாடலையும் எளிய, மரியாதையான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions: []
