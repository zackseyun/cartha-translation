reference: 3 John 1:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διὰ τοῦτο, ἐὰν ἔλθω, ὑπομνήσω αὐτοῦ τὰ ἔργα ἃ ποιεῖ, λόγοις πονηροῖς φλυαρῶν ἡμᾶς, καὶ μὴ ἀρκούμενος ἐπὶ τούτοις οὔτε αὐτὸς ἐπιδέχεται τοὺς ἀδελφοὺς καὶ τοὺς βουλομένους κωλύει καὶ ἐκ τῆς ἐκκλησίας ἐκβάλλει.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/010.yaml
  text: For this reason[a], if I come, I will call attention to the works he is doing, maliciously babbling against us with evil words; and not content with these things, he himself does not receive the brothers[c][b], and he hinders those who want to do so and throws them out of the church.
translation:
  language: ta
  text: 'இதனால், நான் வந்தால், அவன் செய்துவரும் செயல்களைச் சுட்டிக்காட்டுவேன்: அவன் தீய சொற்களால் எங்களைப் பற்றி வீண்பேச்சுப் பேசுகிறான். இவற்றோடும் நிறைவடையாமல், அவனே சகோதரர்களை ஏற்றுக்கொள்வதில்லை[a][b]; அவர்களை ஏற்றுக்கொள்ள விரும்புகிறவர்களையும் தடுத்து, திருச்சபையிலிருந்து வெளியேற்றுகிறான்[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சகோதரர்களை வரவேற்பதில்லை.’ கிரேக்க வினைச்சொல், குறிப்பாக விருந்தோம்பும் பொருளில், ஏற்றுக்கொள்வதையோ வரவேற்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘சகோதரர்கள்’ என்பது பயணம் செய்யும் கிறிஸ்தவ சகோதரர்கள் அல்லது நற்செய்திப் பணியாளர்களைக் குறிக்க வாய்ப்புள்ளது; சில மொழிபெயர்ப்புகள் இதை ‘சகோதர சகோதரிகள்’ அல்லது ‘உடன்விசுவாசிகள்’ என்று விரிவாக வழங்குகின்றன.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘திருச்சபையிலிருந்து அவர்களை நீக்குகிறான்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: இதனால்
  rationale: முந்தைய கருத்திலிருந்து வரும் காரண–விளைவு தொடர்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐὰν ἔλθω
  choice: நான் வந்தால்
  rationale: கடித எழுத்தாளரின் நோக்குநிலையையும் நிபந்தனை அமைப்பையும் நேரடியாகக் காக்கிறது.
- source_word: ὑπομνήσω
  choice: சுட்டிக்காட்டுவேன்
  rationale: வெறுமனே நினைவூட்டுதல் என்பதைக் காட்டிலும், தியோத்திரேப்புவின் செயல்களை கவனத்துக்கும் பொறுப்புக்கூறலுக்கும் கொண்டுவரும் சூழல்சார் பொருளைத் தருகிறது.
- source_word: αὐτοῦ τὰ ἔργα ἃ ποιεῖ
  choice: அவன் செய்துவரும் செயல்களை
  rationale: பன்மையான ἔργα என்பதையும், தொடரும் செயலைக் குறிக்கும் நிகழ்காலத்தையும் இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: λόγοις πονηροῖς φλυαρῶν ἡμᾶς
  choice: அவன் தீய சொற்களால் எங்களைப் பற்றி வீண்பேச்சுப் பேசுகிறான்
  rationale: φλυαρέω என்பதிலுள்ள ஆதாரமற்ற அல்லது வெற்றுப் பேச்சின் உணர்வையும், λόγοις πονηροῖς என்பதிலுள்ள தீய தன்மையையும் காக்கிறது; ἡμᾶς என்பதை தமிழில் இயல்பாக ‘எங்களைப் பற்றி’ என வழங்குகிறது.
- source_word: μὴ ἀρκούμενος ἐπὶ τούτοις
  choice: இவற்றோடும் நிறைவடையாமல்
  rationale: அவனுடைய தவறு தீய பேச்சுடன் நின்றுவிடவில்லை என்ற தொடர்ச்சி உணர்வைத் தருகிறது.
- source_word: οὔτε αὐτὸς ἐπιδέχεται τοὺς ἀδελφούς
  choice: அவனே சகோதரர்களை ஏற்றுக்கொள்வதில்லை
  rationale: αὐτός என்பதன் வலியுறுத்தலை ‘அவனே’ எனக் காத்து, ἐπιδέχομαι என்பதன் ஏற்றுக்கொள்ளுதல் அல்லது வரவேற்றல் சார்ந்த பரப்பை முதன்மை உரையில் மிகைப்படுத்தாமல் வழங்குகிறது.
- source_word: τοὺς βουλομένους κωλύει
  choice: அவர்களை ஏற்றுக்கொள்ள விரும்புகிறவர்களையும் தடுத்து
  rationale: முந்தைய வினையின் மறைபொருளான ‘சகோதரர்களை ஏற்றுக்கொள்ளுதல்’ என்பதைத் தமிழில் தெளிவாக நிரப்பி, βούλομαι என்பதன் விருப்பத்தையும் κωλύω என்பதன் தடுப்பையும் காக்கிறது.
- source_word: ἐκ τῆς ἐκκλησίας ἐκβάλλει
  choice: திருச்சபையிலிருந்து வெளியேற்றுகிறான்
  rationale: உள்ளூர் கிறிஸ்தவக் கூடுகையிலிருந்து வலுக்கட்டாயமாக நீக்கும் செயலைத் தெளிவாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: சபை விருந்தோம்பல் சூழலில் τοὺς ἀδελφούς என்பதன் குறிப்பு
  choice: சகோதரர்கள்
  alternative: சகோதர சகோதரிகள்; உடன்விசுவாசிகள்
  rationale: உடனடி சூழல் பயணம் செய்யும் கிறிஸ்தவப் பணியாளர்களைக் குறிக்க வாய்ப்புள்ளதாலும், கிரேக்கச் சொல் ஆண்பால் பன்மையாக இருப்பதாலும் ‘சகோதரர்கள்’ எனத் தக்கவைக்கப்பட்டது. பரந்த விளக்கத்தைக் குறிப்பில் தெரிவித்து, முதன்மை உரையில் பாலினத்தை அமைதியாகப் பொதுமைப்படுத்தவில்லை.
- issue: ἐκκλησία என்பதன் பொருள்
  choice: திருச்சபை
  alternative: சபை; கூடுகை
  rationale: இங்கு உள்ளூர் கிறிஸ்தவச் சமூகத்தைச் சுட்டுகிறது. ‘திருச்சபை’ நவீனத் தமிழில் பரவலாகப் புரியப்படுவதோடு, எந்த ஒரு குறிப்பிட்ட சபை ஆட்சிமுறையையும் உரையில் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும்படி இயல்பாகவும், கடிதத்தின் கண்டனத் தொனியைத் தக்கவைக்கும் அளவு கண்ணியமாகவும் அமைக்கப்பட்டது. கிரேக்க வாக்கியத்தின் தொடர் குற்றச்சாட்டுகள் தமிழில் தெளிவாகத் தெரிய இருபுள்ளி மற்றும் அரைப்புள்ளி பயன்படுத்தப்படாமல், குறுகிய வாக்கியங்களாகப் பிரிக்கப்பட்டன; பொருள் உறவு காக்கப்பட்டது.
