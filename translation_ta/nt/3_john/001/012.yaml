  source_fidelity: திருத்தம் தேவை. முதல் சாட்சியும் ‘சத்தியம்’ தரும் சாட்சியும் ஒரே கிரேக்க நிறைவுற்ற செயப்பாட்டு வினையான μεμαρτύρηται-க்குச் சார்ந்தவை. வரைவில் இரண்டாவதை நிகழ்காலமான ‘சாட்சி அளிக்கிறது’ என்று மாற்றுவது அந்த அம்ச ஒற்றுமையை இழக்கச் செய்கிறது. ‘சத்தியமேகூட’ என்பதும் இயல்பான நவீனத் தமிழ் இணைப்பு அல்ல.
