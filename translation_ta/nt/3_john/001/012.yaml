id: 3JN.1.12
reference: 3 John 1:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Δημητρίῳ μεμαρτύρηται ὑπὸ πάντων καὶ ὑπὸ αὐτῆς τῆς ἀληθείας· καὶ ἡμεῖς δὲ μαρτυροῦμεν, καὶ ⸀οἶδας ὅτι ἡ μαρτυρία ἡμῶν ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/012.yaml
  text: Demetrius has received testimony from everyone[a], and from the truth itself. We also testify[b], and you know that our testimony is true.
translation:
  language: ta
  text: தேமேத்திரியுவைப் பற்றி அனைவரும் சாட்சி கூறியுள்ளனர்[a]; மேலும், சத்தியமே அவரைப் பற்றி சாட்சி கூறியுள்ளது[b]. நாங்களும் சாட்சி கூறுகிறோம்; எங்கள் சாட்சி உண்மையானது என்று உனக்குத் தெரியும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தேமேத்திரியுவுக்கு அனைவராலும் சாட்சி அளிக்கப்பட்டுள்ளது.’ கிரேக்கத்தில் ‘சாட்சி கூறு’ என்பதற்கான வினை நிறைவுற்ற செயப்பாட்டு வடிவத்தில் உள்ளது; இது ஏற்கெனவே நிலைபெற்றுள்ள சான்றைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘சத்தியமே’ என்பது தேமேத்திரியுவின் வாழ்க்கை சத்தியத்துக்கு இசைவாக இருப்பதைக் குறிக்கலாம்; அல்லது யோவானிய நடையில் சத்தியம், விரிவாக நற்செய்தியைச் சுட்டி, அவருக்குச் சாதகமாகச் சாட்சி கூறுவதாக இருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Δημητρίῳ
  choice: தேமேத்திரியுவைக் குறித்து
  rationale: தனிப்பட்ட பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது. சாட்சி கூறப்படுகிற நபரைத் தமிழில் இயல்பாகக் குறிக்க ‘தேமேத்திரியுவைக் குறித்து’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: μεμαρτύρηται
  choice: சாட்சி அளித்திருக்கிறார்கள்
  rationale: நிறைவுற்ற செயலும் அதன் தற்போதைய விளைவும் உணர்த்தும் கிரேக்க perfect passive வடிவத்தின் கருத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது. மூலத்தில் இல்லாத ‘நல்ல’ என்ற அடைமொழி சேர்க்கப்படவில்லை.
- source_word: ὑπὸ πάντων
  choice: அனைவரும்
  rationale: ὑπό உடன் வரும் எழுவாய் செய்பவர்களைக் குறிக்கிறது; ‘அனைவரும்’ அதன் முழுமையான பரப்பைத் தக்கவைக்கிறது.
- source_word: ὑπὸ αὐτῆς τῆς ἀληθείας
  choice: சத்தியமேகூட
  rationale: αὐτῆς என்பதன் வலியுறுத்தலை ‘-மே’ தக்கவைக்கிறது; καί என்பதன் கூடுதல் பொருளை ‘கூட’ வெளிப்படுத்துகிறது. ‘சத்தியம்’ என்பது ‘நற்செய்தி’ அல்லது ‘அவருடைய வாழ்க்கை’ என்று குறுக்கிப் பொருளுரைக்கப்படவில்லை.
- source_word: καὶ ἡμεῖς δὲ μαρτυροῦμεν
  choice: நாங்களும் சாட்சி அளிக்கிறோம்
  rationale: ἡμεῖς என்பதன் வலியுறுத்தலும் additive force-உம் ‘நாங்களும்’ என்பதால் வெளிப்படுகின்றன; μαρτυρέω தொடர்ந்து ‘சாட்சி அளி’ என்று மொழிபெயர்க்கப்படுகிறது.
- source_word: οἶδας
  choice: உனக்குத் தெரியும்
  rationale: οἶδα வடிவத்தில் perfect ஆக இருந்தாலும் கொய்னே கிரேக்கத்தில் நிகழ்கால அறிவுநிலையைக் குறிக்கிறது.
- source_word: ἡ μαρτυρία ἡμῶν
  choice: எங்கள் சாட்சி
  rationale: μαρτυρέω என்ற வினையுடனான சொல்லியல் தொடர்பைத் தக்கவைக்க ‘சாட்சி’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἀληθής ἐστιν
  choice: உண்மையானது
  rationale: எளிய predicate adjective-ஐ நேரடியாகத் தருகிறது; முன்வரும் ‘சத்தியம்’ என்ற கருத்துடனான தொடர்பும் தொடர்கிறது.
theological_decisions:
- issue: யோவானிய நடையில் ‘சத்தியமே’ என்பதன் பொருள்
  choice: ‘சத்தியமேகூட அவருக்குச் சாட்சி அளிக்கிறது’ என்று உருவகத்தையும் பொருள் அகலத்தையும் தக்கவைத்தல்
  alternative: ‘நற்செய்தியே அவருக்குச் சாட்சி அளிக்கிறது’ அல்லது ‘அவருடைய வாழ்க்கை சத்தியத்துக்கு ஏற்ப உள்ளது’
  rationale: கிரேக்கச் சொற்றொடர் சத்தியத்தை உருவகமாகச் சாட்சி அளிப்பதாகக் கூறுகிறது. அது தேமேத்திரியுவின் வாழ்க்கை சத்தியத்துக்கு இசைவதைக் குறிக்கலாம்; அல்லது யோவானிய நடையில் சத்தியம்/நற்செய்தியை விரிவாகக் குறிக்கலாம். ஒரு பொருளுக்குள் அதைச் சுருக்காமல் மூலத்தின் இறையியல் செறிவும் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சியான சாட்சிச் சொற்களைத் தக்கவைக்க ‘சாட்சி அளி/சாட்சி’ ஒரே சொல்லியல் குடும்பமாக வழங்கப்பட்டுள்ளது; இயல்பற்ற நீண்ட passive அமைப்புக்கு மாற்றாக முதல் வாக்கியம் செயப்பாட்டு நடையில் அமைக்கப்பட்டுள்ளது.
