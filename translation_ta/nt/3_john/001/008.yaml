source:
  edition: SBLGNT
  text: ἡμεῖς οὖν ὀφείλομεν ⸀ὑπολαμβάνειν τοὺς τοιούτους, ἵνα συνεργοὶ γινώμεθα τῇ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/008.yaml
  text: Therefore[a], we ought to receive such people[b], so that we may become fellow workers for the truth.
translation:
  language: ta
  text: ஆகவே, இப்படிப்பட்டவர்களை நாம் ஏற்றுக்கொண்டு ஆதரிக்கக் கடமைப்பட்டுள்ளோம்; நாம் சத்தியத்திற்காக[a] இணைந்து உழைப்பவர்களாக ஆவதற்காகவே இவ்வாறு செய்கிறோம்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சத்தியத்துடன்” அல்லது “சத்தியத்தில்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத் தரவுவேற்றுமையை ஒன்றுக்கு மேற்பட்ட விதங்களில் புரிந்துகொள்ள முடியும்; முதன்மை உரை சத்தியத்தின் நோக்கத்திற்குத் துணைநிற்பது என்ற பொருளைத் தருகிறது.
    reason: alternative_reading
  - marker: b
    text: “ஏற்றுக்கொண்டு ஆதரிக்க” என்பதற்கான கிரேக்க வினைச்சொல், இப்படிப்பட்ட பயணப் பணியாளர்களை வரவேற்று விருந்தோம்பி, தேவையான உதவியை வழங்குதல் என்ற பொருளையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: நாம்
  rationale: வலியுறுத்திக் கூறப்பட்டுள்ள கிரேக்கப் பிரதிப்பெயரைத் தக்கவைத்து, நம்பிக்கையாளர் சமூகத்தின் பொறுப்பை வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வசனத்திலிருந்து பெறப்படும் முடிவை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: ὀφείλομεν
  choice: கடமைப்பட்டிருக்கிறோம்
  rationale: ஒழுக்க மற்றும் சமூகப் பொறுப்பைக் காட்டுகிறது; வெறும் ஆலோசனையாகவோ அளவுக்கு மீறிய கட்டளையாகவோ ஆக்கவில்லை.
- source_word: ὑπολαμβάνειν
  choice: ஆதரிக்க
  rationale: இச்சூழலில் பயணம் செய்யும் பணியாளர்களை ஏற்றுக்கொள்வது, விருந்தோம்புவது, தேவையான உதவி அளிப்பது ஆகியவற்றை உள்ளடக்கும் சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது.
- source_word: τοὺς τοιούτους
  choice: இப்படிப்பட்டவர்களை
  rationale: முந்தைய வசனத்தில் விவரிக்கப்பட்ட வகையைச் சேர்ந்தவர்களைக் குறிக்கிறது; தேவையற்ற பாலினக் குறிப்பைத் தவிர்க்கிறது.
- source_word: ἵνα
  choice: அப்போதுதான்
  rationale: அவர்களை ஆதரிப்பதன் நோக்கத்தையும் அதன் விளைவாக உருவாகும் பங்கேற்பையும் இயல்பாக இணைக்கிறது.
- source_word: συνεργοὶ
  choice: உடன் உழைப்பவர்களாக
  rationale: ஒரே பணியில் பங்குகொள்ளும் கூட்டுழைப்பின் கருத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: γινώμεθα
  choice: ஆவோம்
  rationale: ஆதரிப்பதன் மூலம் அந்தப் பணியில் பங்காளிகளாக ஆகும் நிகழ்வுநிலையைப் பாதுகாக்கிறது.
- source_word: τῇ ἀληθείᾳ
  choice: சத்தியத்திற்காக
  rationale: சத்தியத்தின் நோக்கத்திற்கும் முன்னேற்றத்திற்கும் துணைநிற்பதை முதன்மைப் பொருளாகக் காட்டுகிறது; கிரேக்க வேற்றுமையின் பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: συνεργοὶ என்பதுடன் τῇ ἀληθείᾳ கொண்டுள்ள உறவு
  choice: சத்தியத்திற்காக உடன் உழைப்பவர்கள்
  alternative: சத்தியத்துடன் உடன் உழைப்பவர்கள்; சத்தியத்தில் உடன் உழைப்பவர்கள்
  rationale: பெயருக்காகப் புறப்பட்டுச் சென்ற பணியாளர்களை ஆதரிப்பதே உடனடிச் சூழல். எனவே சத்தியத்தின் பணிக்காகக் கூட்டாக உழைப்பது முதன்மை உரையில் பொருத்தமானது; அதேவேளையில் கிரேக்கத் தரவுவேற்றுமையின் உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கடிதத்தின் கண்ணியமான அறிவுறுத்தல் தொனி பேணப்பட்டுள்ளது. “ஆதரிக்க” என்பது விருந்தோம்பலையும் பொருளுதவியையும் சூழலுக்கேற்ப உள்ளடக்குகிறது. அனைத்து அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
