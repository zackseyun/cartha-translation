id: 3JN.1.11
reference: 3 John 1:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἀγαπητέ, μὴ μιμοῦ τὸ κακὸν ἀλλὰ τὸ ἀγαθόν. ὁ ἀγαθοποιῶν ἐκ τοῦ θεοῦ ἐστιν· ὁ κακοποιῶν οὐχ ἑώρακεν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/011.yaml
  text: Beloved[a], do not imitate what is evil, but what is good. The one who does good is from God; the one who does evil has not seen God.
translation:
  language: ta
  text: அன்புக்குரியவரே, தீமையானதைப் பின்பற்றாதீர்கள்; நன்மையானதைப் பின்பற்றுங்கள். நன்மை செய்கிறவர்[a] கடவுளிடமிருந்து வந்தவர்; தீமை செய்கிறவர் கடவுளைக் கண்டதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நன்மை செய்துகொண்டிருப்பவர் … தீமை செய்துகொண்டிருப்பவர்” என்றும் மொழிபெயர்க்கலாம்; கிரேக்கப் பங்கேற்புவினைகள் தொடரும் பழக்கத்தையோ ஒருவருக்குப் பண்பாகிவிட்ட நடத்தையையோ வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: அன்புக்குரியவரே
  rationale: ஒருமை விளிவேற்றுமையில் வரும் அன்பான அழைப்பை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது; யோவானின் எழுத்துகளுக்குரிய பாசத்தையும் காக்கிறது.
- source_word: μὴ μιμοῦ
  choice: பின்பற்றாமல் ... பின்பற்றுங்கள்
  rationale: μιμέομαι என்பதன் முன்மாதிரியைப் பின்பற்றுதல் என்ற ஒழுக்கப் பொருளை இயல்பான தமிழில் தருகிறது; எதிர்மறை–நேர்மறை இணைப்பை ஒரே கட்டளையாக அமைக்கிறது.
- source_word: τὸ κακὸν / τὸ ἀγαθόν
  choice: தீமையானதை / நன்மையானதை
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நடுநிலைப் பெயரடைகளின் பொதுவான ஒழுக்க வகைகளை, ஒரு தனிச் செயலாகக் குறுக்காமல் வெளிப்படுத்துகிறது.
- source_word: ὁ ἀγαθοποιῶν
  choice: நன்மை செய்கிறவர்
  rationale: பெயர்ச்சொல் தன்மையில் வரும் நிகழ்காலப் பங்கேற்புவினையின் தொடர்ச்சியான அல்லது பண்பாகிய நடத்தைக்கான சாத்தியத்தைத் தக்கவைக்கிறது.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: கடவுளிடமிருந்து வந்தவர்
  rationale: ἐκ குறிக்கும் மூலத்தோற்றம் அல்லது சார்பை இயல்பான தமிழில் தெரிவிக்கிறது; பிற்கால முறைப்படுத்தப்பட்ட இறையியல் சொல்லாடலைச் சேர்க்கவில்லை.
- source_word: ὁ κακοποιῶν
  choice: தீமை செய்கிறவர்
  rationale: முந்தைய பங்கேற்புவினைக்கு இணையான அமைப்பையும், தொடர்ச்சியான அல்லது குணநலனாகிய தீய நடத்தையின் சாத்தியத்தையும் காக்கிறது.
- source_word: οὐχ ἑώρακεν τὸν θεόν
  choice: கடவுளைக் கண்டதில்லை
  rationale: ὁράω என்பதன் நிறைவுக்கால வடிவத்தையும் யோவானுக்குரிய ‘காணுதல்’ மொழியையும் நேரடியாகப் பாதுகாக்கிறது; அதை ‘அறியவில்லை’ என்று விளக்கி மொழிபெயர்ப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: ஒழுக்க நடத்தைக்கும் கடவுளுடனான உறவுக்கும் இடையிலான யோவானிய கூற்று
  choice: ‘கடவுளிடமிருந்து வந்தவர்’ என்றும் ‘கடவுளைக் கண்டதில்லை’ என்றும் உரையின் சொந்த வகைப்பாடுகளையே வைத்தல்
  alternative: இவற்றை மறுபிறப்பு குறித்த முறைப்படுத்தப்பட்ட கோட்பாடாகவோ, பாவமற்ற பரிபூரணத்தைக் குறிக்கும் கூற்றாகவோ வெளிப்படையாக விளக்குதல்
  rationale: கிரேக்க உரை ஒழுக்க–ஆவிக்குரிய அடையாளத்தை யோவானிய மொழியில் வலுவாகக் கூறுகிறது. அதன் எச்சரிக்கையை மென்மைப்படுத்தாமலும் பிற்கால சமயப்பிரிவு சார்ந்த முடிவுகளைச் சேர்க்காமலும் இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமும் எளிமையும் கொண்ட நடை. ‘அன்புக்குரியவரே’ என்பது மூலத்தின் ஒருமை அன்பழைப்பைக் காக்கிறது. ‘பின்பற்றுங்கள்’ மரியாதை ஒருமையாகப் புரிந்துகொள்ளப்பட வேண்டும்; அது மூலத்தில் ஒருவரை நோக்கிய கட்டளை.
