  to: அன்புக்குரியவரே, தீமையானதைப் பின்பற்றாதீர்கள்; நன்மையானதைப் பின்பற்றுங்கள். நன்மை செய்கிறவர்[a] கடவுளிடமிருந்து வந்தவர்; தீமை செய்கிறவர் கடவுளைக் கண்டதில்லை.
