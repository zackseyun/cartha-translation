  text: Ἀγαπητέ, πιστὸν ποιεῖς ὃ ἐὰν ἐργάσῃ εἰς τοὺς ἀδελφοὺς καὶ ⸀τοῦτο ξένους,
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/005.yaml
  text: Beloved[a], you are acting faithfully in whatever you do for the brothers[b], and especially when they are strangers.
translation:
  language: ta
  text: அன்புக்குரியவனே, சகோதரர்களுக்காக, அதுவும் உனக்குத் தெரியாதவர்களாக இருக்கும் சகோதரர்களுக்காக, நீ செய்வதெல்லாம் நம்பகமாகச் செய்கிறாய்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சகோதரர்கள்’ என்பது ஆண்பால் பன்மையான ἀδελφούς என்பதன் மொழிபெயர்ப்பு. இச்சூழலில் அது சக விசுவாசிகளைக் குறிக்கிறது; அந்தக் குழுவில் பெண்களும் இருந்திருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இதை இன்னும் சொல்லுக்குச் சொல் முறையில், ‘அன்புக்குரியவனே, சகோதரர்களுக்காக—அதுவும் அறிமுகமில்லாதவர்களாக இருக்கும் சகோதரர்களுக்காக—நீ செய்யும் எதிலும் நம்பகமான செயலைச் செய்கிறாய்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: structural_ambiguity
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: அன்புக்குரியவனே
  rationale: ἀγαπητός என்பதன் ஆண்பால் ஒருமை விளிவேற்றுமையையும், கடிதத்தில் காணப்படும் அன்பான நேரடி அழைப்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: πιστὸν ποιεῖς
  choice: உண்மையுடன் செய்கிறாய்
  rationale: சொல்லுக்குச் சொல் வடிவில் ‘உண்மையான ஒரு செயலைச் செய்கிறாய்’ எனவும் கொள்ளக்கூடிய இந்தச் சொற்றொடர், இச்சூழலில் காயுவின் உண்மைத்தன்மையையும் நம்பகமான நடத்தையையும் பாராட்டுகிறது. ‘உண்மையுடன் செய்கிறாய்’ என்பது இதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ὃ ἐὰν ἐργάσῃ
  choice: நீ எதைச் செய்தாலும்
  rationale: ἐάν உடன் வரும் இறந்தகாலமல்லாத நிபந்தனைமுக வினை வடிவம் வரையறையற்ற ‘எதைச் செய்தாலும்’ என்ற பொருளைத் தருகிறது; இங்கு ἐργάζομαι பொதுவாக நடைமுறை உதவிகளைச் செய்வதைக் குறிக்கிறது.
- source_word: εἰς τοὺς ἀδελφοὺς
  choice: சகோதரர்களுக்காக
  rationale: εἰς இங்கு அவர்களுடைய நன்மையை நோக்கிய செயலைக் குறிக்கிறது; ஆண்பால் பன்மையான ἀδελφούς என்பதன் வடிவை ‘சகோதரர்கள்’ காக்கிறது.
- source_word: καὶ τοῦτο ξένους
  choice: அதுவும் உனக்கு அறிமுகமில்லாதவர்களுக்காக
  rationale: ξένοι இங்கு அந்நிய நாட்டவர்களை அவசியம் குறிக்காமல், காயுவுக்கு தனிப்பட்ட முறையில் அறிமுகமில்லாத விசுவாசிகளைக் குறிக்கிறது. καὶ τοῦτο தரும் வலியுறுத்தலை ‘அதுவும்’ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘சகோதரர்கள்’ என்பதன் சூழல்சார் வரம்பு
  choice: மூலத்தின் ஆண்பால் பன்மையை முதன்மை உரையில் ‘சகோதரர்கள்’ எனக் காத்தல்
  alternative: ‘சகோதர சகோதரிகள்’ அல்லது ‘சக விசுவாசிகள்’
  rationale: மூலச் சொல் இலக்கணப்படி ஆண்பால் பன்மை. சூழலில் இது சக விசுவாசிகளைக் குறிக்கிறது; குழுவில் பெண்கள் இருந்திருக்கக்கூடிய வாய்ப்பை அடிக்குறிப்பு விளக்குகிறது, ஆனால் முதன்மை உரை அதைத் தீர்மானித்து விரிவாக்கவில்லை.
- issue: ξένους என்பதன் பொருள்
  choice: ‘உனக்கு அறிமுகமில்லாதவர்கள்’
  alternative: ‘அந்நியர்கள்’
  rationale: விருந்தோம்பல் சூழலில் இச்சொல் வேறு நாட்டினரை அல்ல, வரவேற்பவருக்கு முன்பே தெரியாதவர்களை முதன்மையாகக் குறிக்கிறது. ஆகவே இனம் அல்லது நாட்டைச் சார்ந்த பொருளைத் தேவையின்றி புகுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், அன்பான கடித நடையையும் மரியாதையான வேதாகமத் தொனியையும் இணைக்கிறது. ‘அந்நியர்கள்’ என்பதால் ஏற்படக்கூடிய வெளிநாட்டவர் என்ற தவறான எண்ணத்தைத் தவிர்த்து, தனிப்பட்ட அறிமுகமின்மையைத் தெளிவுபடுத்துகிறது; அதேவேளை மூலத்தின் ஆண்பால் பன்மை வடிவம் அடிக்குறிப்புடன் காக்கப்பட்டுள்ளது.
