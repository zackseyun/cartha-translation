revisions:
- from: உனக்குச் சமாதானம் உண்டாவதாக.[a] நண்பர்கள் உனக்கு வாழ்த்துச் சொல்கிறார்கள். நண்பர்கள் ஒவ்வொருவருக்கும் பெயர் சொல்லி வாழ்த்துச் சொல்.[b]
  to: உனக்குச் சமாதானம்.[a] நண்பர்கள் உனக்கு வாழ்த்துச் சொல்கிறார்கள். நண்பர்கள் ஒவ்வொருவரின் பெயரையும் சொல்லி வாழ்த்துச் சொல்.[b]
  rationale: The revision preserves the Greek’s compact nominal blessing in the main text, while placing the expanded Tamil benedictory form in the alternative footnote. It also makes the personal force of κατ’ ὄνομα explicit and idiomatic without changing the meaning.
