base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/015.yaml
  text: Peace to you[a]. The friends greet you[b]. Greet the friends by name.
translation:
  language: ta
  text: உனக்குச் சமாதானம்.[a] நண்பர்கள் உனக்கு வாழ்த்துச் சொல்கிறார்கள். நண்பர்கள் ஒவ்வொருவரின் பெயரையும் சொல்லி வாழ்த்துச் சொல்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உனக்குச் சமாதானம் உண்டாவதாக.” கிரேக்கத்தில் வினைச்சொல் இல்லாமல், “உனக்குச் சமாதானம்” என்ற சுருக்கமான கடித வாழ்த்து உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நண்பர்கள் ஒவ்வொருவரையும் தனித்தனியாக வாழ்த்துச் சொல்.” கிரேக்கத்தில் “பெயரின்படி” என்று உள்ளது; இது ஒவ்வொருவருக்கும் தனிப்பட்ட முறையில் வாழ்த்துச் சொல்வதை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰρήνη σοι
  choice: உனக்குச் சமாதானம் உண்டாவதாக
  rationale: வினைச்சொல் வெளிப்படையாக இல்லாத சுருக்கமான கிரேக்க வாழ்த்தை, இயல்பான நவீன தமிழில் ஆசீர்வாத வாழ்த்தாக வெளிப்படுத்துகிறது; ஒருமை இரண்டாம் நபர் வடிவமும் காக்கப்படுகிறது.
- source_word: ἀσπάζονταί σε
  choice: உனக்கு வாழ்த்துச் சொல்கிறார்கள்
  rationale: கடித நிறைவில் பயன்படுத்தப்படும் வாழ்த்துத் தெரிவிக்கும் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: οἱ φίλοι / τοὺς φίλους
  choice: நண்பர்கள்
  rationale: φίλοι என்பதன் நேரடியான பொருளைக் காத்து, 'சகோதரர்கள்' போன்ற வேறு கடித மரபுச் சொல்லுடன் ஒன்றாக்காமல் மொழிபெயர்க்கிறது.
- source_word: κατ’ ὄνομα
  choice: ஒவ்வொருவருக்கும் பெயர் சொல்லி
  rationale: '''பெயரின்படி'' என்ற கிரேக்கச் சொற்றொடரின் தனிப்பட்ட, ஒவ்வொருவரையும் குறிப்பிட்டுச் செய்யும் வாழ்த்தின் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.'
