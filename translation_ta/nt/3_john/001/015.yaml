translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட கடித நிறைவு நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை இரண்டாம் நபரைக் காட்ட ‘உனக்கு/சொல்’ என்பவை பயன்படுத்தப்பட்டுள்ளன; φίλοι இரு இடங்களிலும் ஒரேபோல ‘நண்பர்கள்’ என வழங்கப்பட்டுள்ளது.
