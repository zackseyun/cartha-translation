reference: 2 Peter 1:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὡς πάντα ἡμῖν τῆς θείας δυνάμεως αὐτοῦ τὰ πρὸς ζωὴν καὶ εὐσέβειαν δεδωρημένης διὰ τῆς ἐπιγνώσεως τοῦ καλέσαντος ἡμᾶς ⸂ἰδίᾳ δόξῃ καὶ ἀρετῇ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/003.yaml
  text: As his divine power has granted to us all things for life and godliness[a], through the knowledge of the one who called us by his own glory and excellence,
translation:
  language: ta
  text: அவருடைய தெய்வீக வல்லமை, தமது சொந்த மகிமையாலும் மேன்மையாலும்[a] நம்மை அழைத்தவரைப் பற்றிய அறிவின் மூலம், வாழ்வுக்கும் இறைப்பற்றுக்கும் உரிய அனைத்தையும் நமக்கு அருளியிருப்பதால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “தமது சொந்த மகிமைக்கும் மேன்மைக்கும் நம்மை அழைத்தவர்.” கிரேக்க மொழியிலுள்ள இந்த வேற்றுமைத் தொடரை ஒன்றுக்கு மேற்பட்ட விதங்களில் புரிந்துகொள்ளலாம்.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὡς
  choice: அருளியிருக்கிறதே
  rationale: அடுத்துவரும் கருத்துக்கு அடிப்படையை அறிமுகப்படுத்தும் Ὡς என்பதன் இணைப்புத் தன்மையை, தமிழில் இயல்பான வலியுறுத்தல் விகுதியால் வெளிப்படுத்துகிறது; இதை முற்றிலும் காரணவாக்கியமாக மட்டும் கட்டுப்படுத்தவில்லை.
- source_word: πάντα ... τὰ πρὸς ζωὴν καὶ εὐσέβειαν
  choice: வாழ்வுக்கும் இறைப்பற்றுக்கும் உரிய அனைத்தையும்
  rationale: τὰ πρὸς என்பதன் ‘தொடர்புடைய/உரிய’ பரப்பைத் தக்கவைத்து, மூலத்தில் இல்லாத ‘தேவையான’ என்ற கருத்தைச் சேர்க்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: θείας δυνάμεως αὐτοῦ
  choice: அவருடைய தெய்வீக வல்லமை
  rationale: உடைமைத் தொடர்பையும் θεῖος என்பதன் தெய்வீகத் தன்மையையும் தெளிவாகக் காட்டுகிறது.
- source_word: δεδωρημένης
  choice: அருளியிருக்கிறதே
  rationale: கொடையாக வழங்கப்பட்டதையும், நிறைவுற்ற செயல் இப்போதும் விளைவுடையதாக இருப்பதையும் தமிழ் வினை வடிவம் உணர்த்துகிறது.
- source_word: διὰ τῆς ἐπιγνώσεως
  choice: அறிவின் வழியாக
  rationale: ἐπίγνωσις என்பதைக் குறிப்பிட்ட தொழில்நுட்பக் கருத்தாக மிகைப்படுத்தாமல், அது வழிமுறை என்பதைக் காட்டுகிறது.
- source_word: τοῦ καλέσαντος ἡμᾶς
  choice: நம்மை அழைத்தவர்
  rationale: பெயர்ச்சொல் தன்மையுடைய பங்கேற்பு வினையை இயல்பான தனிப்பட்ட குறிப்பாக மொழிபெயர்க்கிறது.
- source_word: ἰδίᾳ
  choice: தமது சொந்த
  rationale: ἴδιος தரும் தனிப்பட்ட உடைமை வலியுறுத்தலைத் தக்கவைக்கிறது.
- source_word: δόξῃ
  choice: மகிமையால்
  rationale: தெய்வீக மாட்சியையும் வெளிப்படும் பெருமையையும் குறிக்கும் வழக்கமான, கண்ணியமான சொல்.
- source_word: ἀρετῇ
  choice: மேன்மையால்
  rationale: ἀρετή என்பதன் விரிவான ‘சிறப்பு/மேன்மை’ பொருளைத் தருகிறது; அதை மனித ஒழுக்கநெறிக்கு மட்டும் சுருக்கவில்லை.
- source_word: ζωὴν
  choice: வாழ்வு
  rationale: மூலத்தில் அடைமொழி இல்லாததால், நிகழ்கால மற்றும் இறுதிக்கால ஒலிப்புகள் இரண்டுக்கும் இடமளிக்கும் பரந்த சொல்லைத் தக்கவைக்கிறது.
- source_word: εὐσέβειαν
  choice: இறைப்பற்று
  rationale: கடவுளை நோக்கிய பக்தியையும் அதற்கேற்ற வாழ்க்கை நடத்தையையும் நவீன தமிழில் இயல்பாக உணர்த்துகிறது.
theological_decisions:
- issue: ἰδίᾳ δόξῃ καὶ ἀρετῇ என்ற சொற்றொடரில் வேற்றுமையின் பொருள்
  choice: தமது சொந்த மகிமையாலும் மேன்மையாலும்
  alternative: தமது சொந்த மகிமைக்கும் மேன்மைக்கும்
  rationale: SBLGNT-இன் கிரேக்கத் தரவிலுள்ள நான்காம் வேற்றுமை வடிவத்தை வழிமுறை/கருவி எனப் புரிவது இயல்பானது. இருப்பினும் இலக்கு அல்லது நோக்கம் என்ற புரிதலும் இலக்கண ரீதியில் சாத்தியமுள்ளதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பேணுகிறது. வசனம் அடுத்த வசனத்துடன் இலக்கண ரீதியாகத் தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. ‘இறைப்பற்று’ என்பது வழக்கமான வாசகருக்கு புரியும் வகையில் εὐσέβεια-வின் கடவுள் நோக்கிய வாழ்வியலை வெளிப்படுத்துகிறது.
