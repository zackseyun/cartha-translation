source:
  edition: SBLGNT
  text: ταῦτα γὰρ ὑμῖν ὑπάρχοντα καὶ πλεονάζοντα οὐκ ἀργοὺς οὐδὲ ἀκάρπους καθίστησιν εἰς τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἐπίγνωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/008.yaml
  text: For if these things are yours and are increasing[c][b][a], they keep you from being ineffective or unfruitful in the knowledge of our Lord Jesus the Messiah.
translation:
  language: ta
  text: ஏனெனில், இவை உங்களிடம் இருந்து மேலும் பெருகி வருவதால், நம்முடைய ஆண்டவராகிய இயேசு மெசியாவைப் பற்றிய அறிவில் உங்களைச் செயலற்றவர்களாகவோ கனியற்றவர்களாகவோ ஆக்காது.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மேலும் நிறைவாக இருப்பதால்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘முழுமையான அறிவில்.’
    reason: lexical_alternative
  - marker: c
    text: ‘மெசியா’ என்பதற்கான கிரேக்கச் சொல் கிறிஸ்தோஸ்; எனவே இதை ‘இயேசு கிறிஸ்து’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: இவை
  rationale: முந்தைய வசனங்களில் பட்டியலிடப்பட்ட பண்புகளைச் சுட்டுகிறது; விளக்கச் சொல்லைச் சேர்க்காமல் மூலத்தின் பொதுவான சுட்டுப்பெயரைப் பாதுகாக்கிறது.
- source_word: ὑμῖν ὑπάρχοντα
  choice: உங்களிடம் காணப்பட்டு
  rationale: தத்திவும் வினையெச்சமும் சேர்ந்து, இப்பண்புகள் வாசகர்களிடம் இருப்பதை உணர்த்துகின்றன; உள்ளார்ந்த இடத்தைக் கட்டாயப்படுத்தாமல் இருப்பு அல்லது உடைமையின் நுணுக்கத்தைத் தருகிறது.
- source_word: πλεονάζοντα
  choice: மேலும் பெருகிவந்தால்
  rationale: அதிகமாக இருத்தல், பெருகுதல் ஆகிய இரு சாத்தியங்களுள், ஒழுக்க வளர்ச்சியின் சூழலில் தொடர்ச்சியான அதிகரிப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀργοὺς
  choice: செயலற்றவர்களாக
  rationale: வெறும் சோம்பலை மட்டும் அல்லாமல் பயனளிக்கும் செயல்பாடு இல்லாத நிலையையும் இச்சூழலில் குறிக்கிறது.
- source_word: ἀκάρπους
  choice: கனியற்றவர்களாக
  rationale: ஆவிக்குரிய விளைவு இல்லாமையைச் சுட்டும் மூல உருவகத்தைத் தமிழிலும் பாதுகாக்கிறது.
- source_word: καθίστησιν
  choice: இல்லாதிருக்க அவை செய்யும்
  rationale: οὐκ … οὐδὲ என்பதுடன் வரும் விளைவாக்கும் பொருளை, இயல்பான தமிழில் ‘இரண்டுமாக இல்லாதிருக்கச் செய்யும்’ என்ற கட்டமைப்பால் தருகிறது.
- source_word: εἰς τὴν ... ἐπίγνωσιν
  choice: அறிவில்
  rationale: இந்த அறிவுடன் தொடர்புடைய செயல்திறன் மற்றும் கனி ஆகியவற்றின் தளத்தைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: ἐπίγνωσιν
  choice: அறிவு
  rationale: முழுமையான அல்லது ஆழமான அறிவு என்ற நுணுக்கம் இருக்கக்கூடும்; ஆனால் அதை முதன்மை உரையில் மிகைப்படுத்தாமல் அடிப்படைப் பொருளை வழங்குகிறது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியா
  rationale: Χριστός என்பதன் பட்டப்பெயர்ப் பொருளை ஒலிபெயர்ப்பில் மறைக்காமல் ‘மெசியா’ என்று வெளிப்படுத்துகிறது.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ என்பதில் Χριστοῦ-ஐ எவ்வாறு வழங்குவது
  choice: இயேசு மெசியா
  alternative: இயேசு கிறிஸ்து
  rationale: Χριστός இங்கு இயேசுவின் பட்டப்பெயராக இருப்பதால் அதன் பொருளை வெளிப்படையாகப் பாதுகாக்க ‘மெசியா’ பயன்படுத்தப்பட்டுள்ளது; வழக்கமான ‘கிறிஸ்து’ வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἐπίγνωσις என்பதன் வலிமை
  choice: அறிவு
  alternative: முழுமையான அறிவு
  rationale: இச்சொல் ஆழமான அல்லது முழுமையான அறிவைக் குறிக்கக்கூடும்; எனினும் அந்த நுணுக்கம் ஒவ்வொரு இடத்திலும் கட்டாயமல்ல என்பதால் முதன்மை உரையில் தெளிவான பொதுச் சொல்லும் அடிக்குறிப்பில் மாற்றும் தரப்பட்டுள்ளன.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் எளிமையும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. முந்தைய வசனங்களோடு உள்ள சுட்டுத் தொடர்பும் ‘கனி’ உருவகமும் பாதுகாக்கப்பட்டுள்ளன. கிரேக்க வினையெச்சக் கட்டமைப்பு தமிழில் இயல்பாக இருக்க நிபந்தனை வடிவில் வழங்கப்பட்டுள்ளது.
