reference: 2 Peter 1:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὕτως γὰρ πλουσίως ἐπιχορηγηθήσεται ὑμῖν ἡ εἴσοδος εἰς τὴν αἰώνιον βασιλείαν τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/011.yaml
  text: For in this way entry into the eternal kingdom of our Lord and Savior Jesus the Messiah will be richly provided for you[a][b][c].
translation:
  language: ta
  text: ஏனெனில், இவ்விதமாக நம் ஆண்டவரும் மீட்பருமான இயேசு மெசியாவின் நித்திய அரசுக்குள் நுழைவு[a][b] உங்களுக்கு மிகுதியாக வழங்கப்படும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நுழைவாயில்.’ கிரேக்க εἴσοδος என்பது நுழைவு அல்லது நுழைவாயிலைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'மரபுவழி மொழிபெயர்ப்பு: ‘இயேசு கிறிஸ்து.’ இங்கு Χριστός என்ற பட்டத்தின் பொருளைக் காக்க ‘மெசியா’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.'
    reason: alternative_reading
  - marker: c
    text: ‘மிகுதியாக’ என்பது கிரேக்க πλουσίως சொல்லின் ஏராளமாக அல்லது தாராளமாக என்ற பொருளை வெளிப்படுத்துகிறது.
    reason: clarification
lexical_decisions:
- source_word: οὕτως
  choice: இவ்விதமாக
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட வாழ்க்கை முறையோடு இவ்வசனத்தை இணைக்கும் சுட்டுப் பொருளைப் பாதுகாக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: πλουσίως
  choice: நிறைவாக
  rationale: அளவான அல்லது குறைந்த வழங்குதலுக்கு மாறாக, மிகுதியாக வழங்கப்படுதல் என்ற பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐπιχορηγηθήσεται
  choice: வழங்கப்படும்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தைக் காத்து, நுழைவு வாசகர்களுக்கு அருளப்படுவதை இயல்பாகச் சொல்கிறது.
- source_word: ὑμῖν
  choice: உங்களுக்கு
  rationale: வழங்கப்படுவதால் பயன் பெறுவோரைச் சுட்டும் மூன்றாம் வேற்றுமைப் பொருளை நேரடியாகக் காட்டுகிறது.
- source_word: ἡ εἴσοδος
  choice: நுழைவு
  rationale: ஒரு நாட்டிற்குள் பிரவேசிக்கும் செயல் அல்லது அனுமதி ஆகிய இரு நுணுக்கங்களையும் தாங்கக்கூடிய இயல்பான சொல்.
- source_word: εἰς τὴν αἰώνιον βασιλείαν
  choice: நித்திய அரசுக்குள்
  rationale: εἰς என்பதன் உள்நோக்கிய இயக்கத்தையும் αἰώνιος என்பதன் முடிவில்லாத காலப் பொருளையும் சுருக்கமாகக் காக்கிறது.
- source_word: τοῦ κυρίου ἡμῶν καὶ σωτῆρος
  choice: நம் ஆண்டவரும் மீட்பருமான
  rationale: ஒரே இடைச்சொல்லால் ஆளப்படும் இரு பட்டங்களும் ஒரே நபரைக் குறிப்பதைத் தமிழின் ‘-உம் ... -மான’ அமைப்பு தெளிவாக வெளிப்படுத்துகிறது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியாவின்
  rationale: Χριστός என்பதைக் வெறும் ஒலிபெயர்ப்பாக அல்லாமல், அபிஷேகம் செய்யப்பட்ட அரசர் என்ற பட்டப் பொருளைத் தாங்கும் ‘மெசியா’ என வழங்குகிறது.
theological_decisions:
- issue: ‘நம் ஆண்டவரும் மீட்பருமான’ என்ற இரு பட்டங்களின் குறிப்பு
  choice: இரு பட்டங்களும் இயேசு மெசியா என்ற ஒரே நபரைக் குறிக்கின்றன.
  alternative: இரு பட்டங்களையும் வெவ்வேறு குறிப்புகளாகத் தளர்வாக வாசித்தல்.
  rationale: τοῦ என்ற ஒரே உருபின்கீழ் κύριος மற்றும் σωτήρ ஆகிய ஒருமை நபர்ப் பெயர்கள் καί மூலம் இணைந்து, பின்னர் Ἰησοῦ Χριστοῦ என அடையாளப்படுத்தப்படுவதால், கிரேக்க இலக்கணம் ஒரே குறிப்பை வலுவாக ஆதரிக்கிறது.
- issue: நுழைவு எவ்வாறு வழங்கப்படுகிறது
  choice: ‘நுழைவு’தான் நிறைவாக வழங்கப்படும் எனும் கிரேக்கச் செயப்பாட்டு அமைப்பு காக்கப்பட்டது.
  alternative: ‘நீங்கள் மிகுந்த வரவேற்பைப் பெறுவீர்கள்’ அல்லது ‘உங்களுக்கு நுழையும் உரிமை கிடைக்கும்’ என்று விளக்கமாக மாற்றுதல்.
  rationale: மூலத்தின் உருவகத்தையும், வழங்குபவர் வெளிப்படையாகச் சொல்லப்படாத செயப்பாட்டு வடிவத்தையும் காக்கிறது; அந்த வழங்குபவரை மொழிபெயர்ப்பில் தனியாக அடையாளப்படுத்தவில்லை.
translation_notes:
  register: நவீன செந்தமிழ்ச் சொற்றொடர் பயன்படுத்தப்பட்டுள்ளது. ‘அரசு’ என்பது βασιλεία-வின் ஆட்சி/அரசாட்சி நுணுக்கத்தைக் காக்கிறது; ‘நித்திய ராஜ்யம்’ என்ற மரபுச் சொற்றொடரைவிட பொதுவாசகருக்கு இயல்பாக அமைக்கப்பட்டுள்ளது. வாக்கியத்தின் செயப்பாட்டு அமைப்பும் மூலத்தின் இறையியல் திறந்தநிலையும் பாதுகாக்கப்பட்டுள்ளன.
