source:
  edition: SBLGNT
  text: καὶ αὐτὸ τοῦτο δὲ σπουδὴν πᾶσαν παρεισενέγκαντες ἐπιχορηγήσατε ἐν τῇ πίστει ὑμῶν τὴν ἀρετήν, ἐν δὲ τῇ ἀρετῇ τὴν γνῶσιν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/005.yaml
  text: And for this very reason[a], making every effort, supply in your faith virtue, and in virtue knowledge[d][c][b],
translation:
  language: ta
  text: இந்தக் காரணத்தினாலேயே, எல்லா முயற்சியையும் மேற்கொண்டு, உங்கள் விசுவாசத்தோடு நற்பண்பையும், நற்பண்போடு அறிவையும் வளர்த்துக்கொள்ளுங்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ αὐτὸ τοῦτο δὲ
  choice: இதனாலேயே
  rationale: முந்தைய வசனத்தில் கூறப்பட்டதையே வலியுறுத்திக் காரணத் தொடர்பை ஏற்படுத்தும் கிரேக்கச் சொற்றொடரை இயல்பான, சுருக்கமான தமிழில் தருகிறது.
- source_word: σπουδὴν πᾶσαν παρεισενέγκαντες
  choice: நீங்கள் எல்லா முயற்சியையும் மேற்கொண்டு
  rationale: முழுமையான முனைப்போடு செயல்படுவதைச் சுட்டும் பெயர்ச்சொல் மற்றும் பங்கேற்புவினையின் இணைந்த பொருளை நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐπιχορηγήσατε
  choice: சேர்த்துக்கொள்ளுங்கள்
  rationale: ஒரு பண்புடன் மற்றொரு பண்பை வழங்கி இணைக்க வேண்டும் என்ற சூழல்சார் கருத்தை இயல்பான தமிழில் தருகிறது; மூல வினையில் உள்ள ‘வழங்கு/நிறைவாக அளி’ என்ற நிழற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐν τῇ πίστει ὑμῶν
  choice: உங்கள் விசுவாசத்தோடு
  rationale: ἐν + வேற்றுமை அமைப்பைச் சொற்சொல்லாக ‘விசுவாசத்தில்’ என்று தருவது தமிழில் தெளிவில்லாமல் இருக்கலாம். ‘விசுவாசத்தோடு’ என்பது பண்புகளுக்கிடையிலான தொடர்பை இயல்பாகக் காட்டுகிறது; சொற்சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: πίστει
  choice: விசுவாசம்
  rationale: இச்சூழலில் πίστις என்பதன் நேரடியான, வழக்கமான பொருள் ‘விசுவாசம்.’ ‘நம்பிக்கை,’ ‘உண்மைத்தன்மை’ ஆகிய சாத்தியங்களும் அடிக்குறிப்பில் குறிப்பிடப்படுகின்றன.
- source_word: ἀρετήν
  choice: நற்பண்பு
  rationale: ἀρετή குறிக்கும் நற்குணம் அல்லது ஒழுக்க மேன்மையை சாதாரண வாசகருக்கு இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: γνῶσιν
  choice: அறிவு
  rationale: γνῶσις என்பதன் அடிப்படைப் பொருளையும் பண்புகளின் தொடரில் அதன் இடத்தையும் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: பண்புகளின் பட்டியலில் πίστις என்பதன் பொருள்
  choice: விசுவாசம்
  alternative: நம்பிக்கை அல்லது உண்மைத்தன்மை
  rationale: இங்கு ‘விசுவாசம்’ நேரடியான வாசிப்பாக இருந்தாலும், πίστις என்ற சொல்லின் பொருள் எல்லையில் நம்புதல் மற்றும் உண்மையாயிருத்தல் ஆகிய நிழற்பொருள்களும் இருக்கலாம்; அவை அடிக்குறிப்பில் திறந்தவையாக வைக்கப்படுகின்றன.
- issue: ἐν என்பதால் பண்புகளுக்கிடையில் குறிக்கப்படும் உறவு
  choice: —த்தோடு
  alternative: —த்தில்
  rationale: இத்தொடர் ஒரு பண்புடன் மற்றொன்றை இணைத்து வளர்ப்பதைக் குறிக்கக்கூடும். எனினும் கிரேக்கத்தின் ‘உள்ளே/இல்’ வடிவம் வேறு நுணுக்கத்தை அனுமதிப்பதால், சொற்சொல் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் தொடரமைப்பு ‘விசுவாசம்—நற்பண்பு—அறிவு’ எனப் பாதுகாக்கப்பட்டாலும், தமிழில் இயல்பற்ற ‘—த்தில்’ அமைப்பை முதன்மை உரையில் தவிர்த்து அதன் சாத்தியத்தை அடிக்குறிப்பில் வைத்துள்ளோம்.
