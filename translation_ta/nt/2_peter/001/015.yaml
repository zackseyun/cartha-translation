revisions:
- from: மேலும், நான் பிரிந்துபோன பிறகும்[a] நீங்கள் எப்போதும் இவற்றை நினைவுகூர இயலும்படி எல்லா முயற்சியும் செய்வேன்.
  to: மேலும், என் பிரிவுக்குப் பிறகு[a] நீங்கள் எந்த நேரத்திலும் இவற்றை நினைவுகூர இயலும்படி நான் எல்லா முயற்சியும் செய்வேன்.
  rationale: The revision removes the unsupported concessive ‘-உம்,’ renders ἑκάστοτε as availability ‘at any time,’ and preserves ἔξοδος as a departure metaphor in the main text while retaining the explicit contextual sense ‘death’ in the footnote.
