id: 2PE.1.15
reference: 2 Peter 1:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: σπουδάσω δὲ καὶ ἑκάστοτε ἔχειν ὑμᾶς μετὰ τὴν ἐμὴν ἔξοδον τὴν τούτων μνήμην ποιεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/015.yaml
  text: And I will make every effort so that[a], after my departure, you may be able at any time to recall these things.
translation:
  language: ta
  text: மேலும், என் பிரிவுக்குப் பிறகு[a] நீங்கள் எந்த நேரத்திலும் இவற்றை நினைவுகூர இயலும்படி நான் எல்லா முயற்சியும் செய்வேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, மேலும் வெளிப்படையாக, ‘என் மரணத்துக்குப் பிறகு.’ கிரேக்கத்தில் ‘என் புறப்பாட்டுக்குப் பிறகு’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπουδάσω
  choice: எல்லா முயற்சியும் செய்வேன்
  rationale: வருங்கால வினைச்சொல் ஆர்வமுள்ள, தீவிரமான முயற்சியைக் குறிக்கிறது; இந்தத் தமிழாக்கம் அதன் வலிமையையும் இயல்பான நடையையும் காக்கிறது.
- source_word: δὲ
  choice: மேலும்
  rationale: இங்கு வலுவான எதிர்மறையைக் காட்டாமல், முந்தைய வசனத்தின் கருத்தைத் தொடர்ந்து மேலும் ஒன்றைச் சேர்க்கிறது.
- source_word: καὶ
  choice: -உம்படி
  rationale: இறந்தகாலமல்லாத infinitive அமைப்புடன் வரும் καί, பேதுருவின் முயற்சியின் கூடுதல் நோக்கத்தை உணர்த்துகிறது; தமிழில் நோக்கத்தைக் காட்டும் ‘இயலும்படி’ இயல்பாக உள்ளது.
- source_word: ἑκάστοτε
  choice: எப்போதும்
  rationale: தேவைப்படும் ஒவ்வொரு சந்தர்ப்பத்திலும் அல்லது எந்த நேரத்திலும் என்ற நடைமுறைப் பொருளைக் குறிக்கிறது.
- source_word: ἔχειν ὑμᾶς
  choice: நீங்கள் … இயலும்படி
  rationale: ἔχειν இங்கு திறன் அல்லது வாய்ப்பைக் குறிக்கும்; தமிழில் ‘இயலும்படி’ அதனைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: μετὰ τὴν ἐμὴν ἔξοδον
  choice: நான் பிரிந்துபோன பிறகும்
  rationale: ἔξοδος என்பதன் ‘புறப்படுதல்/பிரிதல்’ என்ற உருவகத்தைப் பாதுகாத்து, இங்கு பேதுருவின் மரணத்தைக் குறிக்கும் மறைமுகப் பயன்பாட்டையும் தக்கவைக்கிறது.
- source_word: τὴν τούτων μνήμην ποιεῖσθαι
  choice: இவற்றை நினைவுகூர
  rationale: இந்தக் கிரேக்க மரபுத்தொடர் ஒன்றை மனத்திற்குக் கொண்டுவருதல் அல்லது நினைவில் கொள்ளுதல் என்று பொருள்படும்; ‘நினைவுகூர’ அதன் செயற்பாட்டு நுணுக்கத்தைத் தருகிறது.
- source_word: τούτων
  choice: இவற்றை
  rationale: உடனடியான சூழலில் பேதுரு வலியுறுத்திவந்த கருத்துகளை நேரடியாகச் சுட்டுகிறது.
theological_decisions:
- issue: பேதுருவின் வரவிருக்கும் முடிவைக் குறிக்கும் ἔξοδος என்பதன் பொருள்
  choice: பிரிந்துபோன பிறகு
  alternative: இறந்த பிறகு
  rationale: மூலமொழி மரணத்தை நேரடியாகச் சொல்லாமல் ‘புறப்படுதல்’ என்ற உருவகச் சொல்லைப் பயன்படுத்துகிறது. முதன்மை உரையில் அந்த உருவகம் பாதுகாக்கப்பட்டு, வெளிப்படையான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பிரிந்துபோன’ என்பது மரணத்தைக் குறிக்கும் மூல உருவகத்தை இயல்பான தமிழில் பாதுகாக்கிறது; அடிக்குறிப்பு அதன் வெளிப்படையான பொருளை விளக்குகிறது.
