id: 2PE.1.1
reference: 2 Peter 1:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀Συμεὼν Πέτρος δοῦλος καὶ ἀπόστολος Ἰησοῦ Χριστοῦ τοῖς ἰσότιμον ἡμῖν λαχοῦσιν πίστιν ἐν δικαιοσύνῃ τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/001.yaml
  text: 'Simeon Peter[a], a servant and apostle of Jesus the Messiah[d][c][b], to those who have obtained a faith as precious as ours in the righteousness of our God and Savior Jesus the Messiah:'
translation:
  language: ta
  text: 'இயேசு மெசியாவின் அடிமையும் அப்போஸ்தலனுமான சிமியோன் பேதுரு, நம்முடைய கடவுளும் மீட்பருமான இயேசு மெசியாவின்[b] நீதியில்[a] எங்களோடு சம மதிப்புள்ள விசுவாசத்தைப் பங்காகப் பெற்றவர்களுக்கு:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நீதியின் மூலம்” அல்லது “நீதியால்” என்றும் மொழிபெயர்க்கலாம். கிரேக்க முன்னிடைச்சொல் ஒரு தளத்தையோ வழிமுறையையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கச் சொற்றொடர் இயல்பாகவே இயேசு மெசியாவை ‘நம்முடைய கடவுளும் மீட்பருமானவர்’ என்று ஒரே நபராகக் குறிப்பிடுகிறது. குறைவான சாத்தியமுள்ள மாற்று வாசிப்பில், ‘நம்முடைய கடவுள்’ மற்றும் ‘மீட்பராகிய இயேசு மெசியா’ என இரண்டு நபர்கள் குறிக்கப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Συμεὼν Πέτρος
  choice: சிமியோன் பேதுரு
  rationale: Συμεών என்ற மூல வடிவை ‘சிமியோன்’ நேரடியாகப் பிரதிபலிக்கிறது; Πέτρος என்பதற்கு தமிழில் நிலைபெற்ற வடிவம் ‘பேதுரு’.
- source_word: δοῦλος
  choice: அடிமை
  rationale: வெறும் பணிசெய்பவரை விட, இயேசு மெசியாவுக்கு முழுமையாக உரியவர் என்ற δοῦλος என்பதன் வலிமையைப் பாதுகாக்கிறது.
- source_word: ἀπόστολος
  choice: அப்போஸ்தலன்
  rationale: அதிகாரமளித்து அனுப்பப்பட்ட பணியையும் பதவியையும் குறிக்கும் தமிழ்க் கிறிஸ்தவ வழக்கில் நிலைபெற்ற துல்லியமான சொல்.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியா
  rationale: Χριστός இங்கு ‘மெசியா’ என்ற பட்டத்தைத் தக்கவைக்கிறது; தமிழில் பெயருடன் இயல்பாக இணைகிறது.
- source_word: τοῖς ... λαχοῦσιν
  choice: பெற்றவர்களுக்கு
  rationale: λαγχάνω என்பதில் உள்ள, முயன்று சம்பாதித்தல் அல்லாமல் பங்காகப் பெறுதல் என்ற கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἰσότιμον ... πίστιν
  choice: எங்களுடைய விசுவாசத்துக்குச் சம மதிப்புள்ள விசுவாசம்
  rationale: ἰσότιμος குறிக்கும் சம மதிப்பு, கண்ணியம் அல்லது உரிமைநிலையை ‘சம மதிப்புள்ள’ என்பது தெளிவாகப் பாதுகாக்கிறது.
- source_word: πίστιν
  choice: விசுவாசம்
  rationale: இங்கு விசுவாசிகளும் அப்போஸ்தலர்களும் பகிரும் நம்பிக்கையைச் சுட்டுவதால், நிலைபெற்ற ‘விசுவாசம்’ பொருத்தமானது.
- source_word: ἐν δικαιοσύνῃ
  choice: நீதியில்
  rationale: ἐν என்பதன் தளம் அல்லது கருவி ஆகிய இரு சாத்தியங்களையும் தமிழின் ஏழாம் வேற்றுமை திறந்த நிலையில் வைத்திருக்கிறது.
- source_word: δικαιοσύνῃ
  choice: நீதி
  rationale: கடவுளின் நேர்மையான குணத்தையும் செயலையும் குறிக்கும் δικαιοσύνη என்பதற்கு இயல்பான, பரவலாகப் புரியும் தமிழ் இணை.
- source_word: τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ
  choice: நம்முடைய கடவுளும் மீட்பருமான இயேசு மெசியா
  rationale: ஒரே சுட்டுக் கட்டமைப்பில் வரும் θεός மற்றும் σωτήρ ஆகிய இரு பட்டங்களும் இயேசு மெசியா என்ற ஒரே நபரைக் குறிப்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘நம்முடைய கடவுளும் மீட்பருமான இயேசு மெசியா’ என்பது ஒரே நபரையா அல்லது இரண்டு நபர்களையா குறிக்கிறது?
  choice: 'ஒரே நபர்: இயேசு ‘நம்முடைய கடவுளும் மீட்பருமானவர்’ என்று அழைக்கப்படுகிறார்.'
  alternative: 'இரண்டு நபர்கள்: ‘நம்முடைய கடவுள்’ மற்றும் ‘மீட்பராகிய இயேசு மெசியா’.'
  rationale: ஒரே άρθροவின் கீழ் καί மூலம் இணைக்கப்பட்ட இரண்டு ஒருமை தனிநபர் பெயர்ச்சொற்கள் பொதுவாக ஒரே குறிப்பிடுபவரைச் சுட்டுகின்றன. எனினும், இறையியல் முக்கியத்துவம் வாய்ந்த குறைவான சாத்தியமுள்ள மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான கடிதத் தொடக்கமாக வடிவமைக்கப்பட்டது. ‘அடிமை’ மூலத்தின் வலிமையைத் தக்கவைக்கிறது; ‘அப்போஸ்தலன்’, ‘விசுவாசம்’, ‘மெசியா’ ஆகியவை பரவலாக அறியப்பட்ட வேதாகமச் சொற்களாகப் பயன்படுத்தப்பட்டுள்ளன. மூலத்தில் இல்லாத இறுதி வினையைத் தமிழ் வாக்கிய நிறைவுக்காக ‘எழுதுவது’ எனச் சுருக்கமாக வழங்கியுள்ளோம்.
