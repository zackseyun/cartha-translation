  terminology: ‘கூடாரம்’ மூல உருவகத்தைச் சரியாகக் காக்கிறது; அதை ‘உடல்’ என முதன்மை உரையில் விளக்கமாக்கவில்லை. அடிக்குறிப்பு ‘உறைவிடம்’ மற்றும் ‘உடல்’ என்பவற்றை மாற்று/விளக்க வாசிப்புகளாகத் தகுந்த முறையில் வழங்குகிறது. ‘பேதுரு’ பெயரின் பயன்பாடும் நிலையானது.
