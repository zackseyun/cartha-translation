id: 2PE.1.13
reference: 2 Peter 1:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: δίκαιον δὲ ἡγοῦμαι, ἐφ’ ὅσον εἰμὶ ἐν τούτῳ τῷ σκηνώματι, διεγείρειν ὑμᾶς ἐν ὑπομνήσει,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/013.yaml
  text: But I consider it right[a], as long as I am in this tent, to stir you up by way of reminder,
translation:
  language: ta
  text: ஆனால், நான் இந்தக் கூடாரத்தில்[a] இருக்கும் வரையில், உங்களுக்கு நினைவூட்டி உங்களை விழிப்பூட்டுவது சரியானது என்று கருதுகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், ‘கூடாரம்’; இது பேதுருவின் தற்போதைய அழிவுக்குரிய உடல் வாழ்வைக் குறிக்கும் உருவகம். ‘உறைவிடம்’ அல்லது ‘உடல்’ என்றும் பொருள் விளக்கமாக மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιον
  choice: சரியானது
  rationale: ἡγοῦμαι என்பதுடன் இணைந்து, செய்யத் தகுந்ததும் முறையானதும் என்ற தீர்மானத்தை இது வெளிப்படுத்துகிறது. ‘சரியானது’ என்பது நவீன தமிழில் இயல்பாக இருந்து அதன் அறநெறி மற்றும் பொருத்தப்பாட்டு நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்திலிருந்து மென்மையான மாறுபாட்டையும் கருத்து வளர்ச்சியையும் குறிக்கிறது.
- source_word: ἡγοῦμαι
  choice: கருதுகிறேன்
  rationale: வெறும் எண்ணத்தை அல்லாமல், ஆராய்ந்து எடுக்கப்பட்ட தீர்மானத்தைச் சுட்டுகிறது.
- source_word: ἐφ’ ὅσον
  choice: இருக்கும் வரையில்
  rationale: εἰμί என்பதுடன் சேர்ந்த இத்தொடர் கால எல்லையைக் குறிக்கிறது; தமிழில் ‘இருக்கும் வரையில்’ என்பது தெளிவான இயல்பான வடிவம்.
- source_word: σκηνώματι
  choice: கூடாரத்தில்
  rationale: மூலத்தின் ‘கூடாரம்’ என்ற உருவகத்தை நேரடியாகப் பாதுகாக்கிறது. இது பேதுருவின் தற்போதைய அழிவுக்குரிய உடல் வாழ்வைக் குறிக்கிறது; அடுத்த வசனத்தில் அதை அகற்றுவது பற்றிய உருவகத்துக்கும் வழியமைக்கிறது.
- source_word: διεγείρειν
  choice: விழிப்பூட்டுவது
  rationale: விழித்தெழச் செய்தல் அல்லது செயல்படத் தூண்டுதல் என்ற பொருளைச் சூழலுக்கேற்ற இயல்பான தமிழில் தருகிறது.
- source_word: ἐν ὑπομνήσει
  choice: நினைவூட்டி
  rationale: நினைவூட்டுவதன் மூலம் அவர்களை விழிப்பூட்டுவதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘இந்தக் கூடாரம்’ என்ற உருவகத்தின் குறிப்பு
  choice: ‘இந்த உடல்’ என்று விளக்கமாக மாற்றாமல், ‘இந்தக் கூடாரம்’ என்ற மூல உருவகத்தை முதன்மை உரையில் வைத்தல்.
  alternative: இந்த உடலில் / இந்த உறைவிடத்தில்
  rationale: கிரேக்க உரை அழிவுக்குரிய உடல் வாழ்வை ‘கூடாரம்’ என உருவகிக்கிறது. அதை அப்படியே வைப்பது வாழ்வின் நிலையாமையையும் அடுத்த வசனத்துடனான உருவகத் தொடர்பையும் காக்கிறது; தேவையற்ற கோட்பாட்டு விளக்கத்தை முதன்மை உரைக்குள் புகுத்துவதையும் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கூடாரம்’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டு, அதன் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. அடிக்குறிப்புக் குறி அது விளக்கும் சொல்லுக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
