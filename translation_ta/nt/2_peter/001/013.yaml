  source_fidelity: மூல கிரேக்கத்தின் கருத்தும் வாக்கிய உறவுகளும் துல்லியமாகக் காக்கப்பட்டுள்ளன. δίκαιον…ἡγοῦμαι என்பதற்கு ‘சரியானது என்று கருதுகிறேன்,’ ἐφ’ ὅσον என்பதற்கு ‘இருக்கும் வரையில்,’ σκηνώματι என்பதற்கு ‘கூடாரத்தில்,’ மற்றும் ἐν ὑπομνήσει என்பதற்கு ‘நினைவூட்டி’ ஆகியவை பொருத்தமானவை. ‘உங்களுக்கு நினைவூட்டி உங்களை விழிப்பூட்டுவது’ என்பது διεγείρειν ὑμᾶς ἐν ὑπομνήσει என்ற அமைப்பை இயல்பாக வெளிப்படுத்துகிறது.
