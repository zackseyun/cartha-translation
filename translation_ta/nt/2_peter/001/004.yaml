id: 2PE.1.4
reference: 2 Peter 1:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: δι’ ὧν τὰ ⸂τίμια καὶ μέγιστα ἡμῖν⸃ ἐπαγγέλματα δεδώρηται, ἵνα διὰ τούτων γένησθε θείας κοινωνοὶ φύσεως, ἀποφυγόντες τῆς ἐν ⸀τῷ κόσμῳ ἐν ἐπιθυμίᾳ φθορᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/004.yaml
  text: through which he has granted to us his precious and very great promises[a], so that through these you may become sharers in the divine nature[b], having escaped the corruption that is in the world because of sinful desire.
translation:
  language: ta
  text: இவற்றின் வழியாக அவர் விலைமதிப்புள்ளவையும் மிகப் பெரியவையுமான வாக்குறுதிகளை நமக்கு அருளியிருக்கிறார்; அவற்றின் வழியாக நீங்கள் தீய ஆசையால் உலகத்தில் உண்டாகும் சீரழிவிலிருந்து தப்பி, தெய்வீக இயல்பில் பங்குபெறுகிறவர்களாக ஆகும்படி.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δι’ ὧν
  choice: இவற்றின் வழியாக
  rationale: διά + genitive கருவி அல்லது இடைமுகப் பொருளைக் குறிக்கிறது. உறவுப்பெயரின் முந்தைய தொடர்பைத் திட்டவட்டமாகக் குறுக்காமல் “இவற்றின் வழியாக” பாதுகாக்கிறது.
- source_word: τίμια καὶ μέγιστα
  choice: விலைமதிப்புள்ளவையும் மிகப் பெரியவையுமான
  rationale: τίμια என்பதன் மதிப்புமிக்க தன்மையையும் μέγιστα என்பதன் உயர்நிலை வலிமையையும் இயல்பான நவீன தமிழில் எடுத்துரைக்கிறது.
- source_word: ἐπαγγέλματα
  choice: வாக்குறுதிகள்
  rationale: இச்சூழலில் தெளிவான, வழக்கமான தமிழ் இணைச்சொல்.
- source_word: δεδώρηται
  choice: அருளியிருக்கிறார்
  rationale: Perfect வடிவில் உள்ள கொடையின் நிறைவேற்றத்தையும் தொடரும் விளைவையும், δωρέομαι-இன் கொடைத்தன்மையையும் வெளிப்படுத்துகிறது; மறைமுக எழுவாய் முந்தைய வசனச் சூழலிலிருந்து பெறப்படுகிறது.
- source_word: διὰ τούτων
  choice: இவற்றின் வழியாக
  rationale: இங்கு “இவை” என்பது உடனடியாக முன் சொல்லப்பட்ட வாக்குறுதிகளைச் சுட்டுகிறது; διά-வின் இடைமுகப் பொருள் காக்கப்படுகிறது.
- source_word: γένησθε
  choice: ஆகும்படிக்கு
  rationale: γίνομαι-இன் ‘ஆகுதல்’ என்ற மாற்றப் பொருளையும் ἵνα அறிமுகப்படுத்தும் நோக்கத்தையும் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: θείας κοινωνοὶ φύσεως
  choice: தெய்வீக இயல்பில் பங்குபெறுகிறவர்கள்
  rationale: κοινωνός குறிக்கும் உண்மையான பங்கேற்பை வலுவிழக்கச் செய்யாமலும், சாராம்சத்தில் தெய்வமாகிவிடுதல் என்று விரிவாக்காமலும் மொழிபெயர்க்கிறது.
- source_word: ἀποφυγόντες
  choice: தப்பி
  rationale: Aorist participle-இன் துணை/முன்னிகழ்வுச் செயலை இயல்பான தமிழ் வினையெச்சத்தால் காட்டுகிறது.
- source_word: φθορᾶς
  choice: சீரழிவு
  rationale: இச்சூழலில் உள்ள ஒழுக்க மற்றும் ஆன்மீகக் கெடுதலை இயல்பாகக் குறிக்கிறது.
- source_word: ἐν τῷ κόσμῳ ἐν ἐπιθυμίᾳ
  choice: தீய ஆசையால் உலகத்தில் உண்டாகும்
  rationale: முதல் ἐν அமைப்பின் உலகத்திலுள்ள நிலைப்பாட்டையும் இரண்டாவது ἐν அமைப்பின் காரண/சூழல் வலிமையையும் தெளிவாக்குகிறது; ἐπιθυμία இச்சூழலில் எதிர்மறையானது.
theological_decisions:
- issue: θείας κοινωνοὶ φύσεως என்பதில் தெய்வீக இயல்பில் பங்கேற்பு
  choice: தெய்வீக இயல்பில் பங்குபெறுகிறவர்கள்
  alternative: தெய்வீக இயல்பில் பங்கேற்பவர்கள்
  rationale: மூலத்தின் வலிமையான இறையியல் மொழியைப் பாதுகாக்கிறது; அதேவேளையில் பிற்காலக் கோட்பாட்டு விளக்கத்தை வசனத்துக்குள் சேர்ப்பதோ, மனிதர்கள் தெய்வீகச் சாராம்சமாக மாறுகிறார்கள் என்று கூறுவதோ தவிர்க்கப்படுகிறது.
- issue: ἐπιθυμία என்பதன் ஒழுக்கரீதியான எதிர்மறைப் பொருள்
  choice: தீய ஆசை
  alternative: ஆசை; இச்சை
  rationale: இச்சொல் தனியாக பொதுவான ஆசையையும் குறிக்கலாம்; ஆனால் இங்கு உலகத்தின் சீரழிவோடு இணைக்கப்பட்டிருப்பதால் எதிர்மறை ஒழுக்கப் பொருள் வெளிப்படையாகத் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடையில் அமைக்கப்பட்டது. நீண்ட கிரேக்க வாக்கியம் தமிழின் இயல்புக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், காரண–நோக்கத் தொடர்பு இரண்டாவது வாக்கியத்தில் மீண்டும் வரும் “அருளியிருக்கிறார்” மூலம் தெளிவாக வைக்கப்பட்டது. மூலத்தில் முதலில் வரும் பங்கேற்புச் சொற்றொடரும் பின்னர் வரும் வினையெச்சமும் தமிழின் இயல்பான நோக்கக் கட்டமைப்புக்காக இடமாற்றப்பட்டுள்ளன.
