revisions:
- from: இவற்றின் வழியாக அவர் விலைமதிப்புள்ளவையும் மிகப் பெரியவையுமான வாக்குறுதிகளை நமக்கு அருளியிருக்கிறார். இவற்றின் வழியாக நீங்கள் தீய ஆசையால்[b] உலகத்தில் உண்டாகும் சீரழிவிலிருந்து தப்பி, தெய்வீக இயல்பில் பங்குபெறுகிறவர்களாக[a] ஆகும்படிக்கே அவர் அவற்றை அருளியிருக்கிறார்.
