reference: 2 Peter 1:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐ γὰρ θελήματι ἀνθρώπου ἠνέχθη ⸂προφητεία ποτέ⸃, ἀλλὰ ὑπὸ πνεύματος ἁγίου φερόμενοι ἐλάλησαν ⸀ἀπὸ θεοῦ ἄνθρωποι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/021.yaml
  text: For prophecy was never brought forth by the will of man[c][b][a], but men spoke from God as they were carried along by the Holy Spirit.
translation:
  language: ta
  text: ஏனெனில், தீர்க்கதரிசனம் ஒருபோதும் மனித விருப்பத்தால் கொண்டுவரப்படவில்லை[a]; மாறாக, பரிசுத்த ஆவியால் சுமந்து செல்லப்பட்டபடி[b] மனிதர்கள் கடவுளிடமிருந்து பேசினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உருவாக்கப்படவில்லை’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் செயப்பாட்டு வடிவில் உள்ளது; இதே வேர்ச்சொல் வசனத்தின் பிற்பகுதியில் ‘சுமந்து செல்லப்பட்டபடி’ என்பதிலும் வருகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘பரிசுத்த ஆவியால் உந்தப்பட்டு’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் இன்னும் நேரடியாக ‘சுமந்து செல்லப்பட்டபடி’ என்ற கருத்து உள்ளது; அது ஆவியின் செயலுள்ள வழிநடத்துதலை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: θελήματι ἀνθρώπου
  choice: மனித விருப்பத்தால்
  rationale: கருவிப் பொருளுடைய வேற்றுமையை ‘-ஆல்’ மூலம் காட்டுகிறது; தீர்க்கதரிசனத்தின் தோற்றம் மனிதத் தீர்மானத்தில் இல்லை என்பதையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἠνέχθη
  choice: கொண்டுவரப்படவில்லை
  rationale: φέρω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது; பின்னர் வரும் φερόμενοι உடனான சொற்பொருள் தொடர்பையும் இயன்றவரை நிலைநிறுத்துகிறது.
- source_word: προφητεία
  choice: தீர்க்கதரிசனம்
  rationale: தீர்க்கதரிசன வெளிப்பாடு அல்லது உரையைக் குறிக்கும் வழக்கமான வேதாகமச் சொல்; வெறும் எதிர்கால முன்னறிவிப்பாக மட்டும் குறுக்கப்படவில்லை.
- source_word: ποτέ
  choice: ஒருபோதும்
  rationale: οὐ உடன் சேர்ந்துள்ள வலியுறுத்தப்பட்ட மறுப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὑπὸ πνεύματος ἁγίου
  choice: பரிசுத்த ஆவியால்
  rationale: ὑπό உடன் வரும் செயற்படுத்தும் காரணத்தை ‘-ஆல்’ தெளிவாகக் காட்டுகிறது.
- source_word: φερόμενοι
  choice: சுமந்து நடத்தப்பட்டபடி
  rationale: ஆவியின் செயலில் வழிநடத்தும் ஆற்றலைக் காட்டுவதோடு, φέρω என்பதிலுள்ள ‘சுமந்து செல்லுதல்’ என்ற உருவகத் தன்மையையும் பாதுகாக்கிறது.
- source_word: ἐλάλησαν
  choice: பேசினார்கள்
  rationale: λαλέω என்பதன் நேரடியான, இயல்பான பொருளை உயர்த்தியோ குறைத்தோ காட்டாமல் தருகிறது.
- source_word: ἀπὸ θεοῦ
  choice: கடவுளிடமிருந்து
  rationale: ἀπό குறிக்கும் மூலம் அல்லது தோற்றத்தைப் பாதுகாக்கிறது; ஆவியின் செயற்படுத்தும் காரணத்திலிருந்து இதை வேறுபடுத்துகிறது.
- source_word: ἄνθρωποι
  choice: மனிதர்கள்
  rationale: மனிதப் பேச்சாளர்களைக் குறிக்கும் பொதுப்பொருளை பாலின வரையறையின்றி நவீனத் தமிழில் இயல்பாகத் தருகிறது.
theological_decisions:
- issue: தீர்க்கதரிசனத்தில் கடவுளின் செயலுக்கும் மனிதர்களின் செயலுக்கும் உள்ள உறவு
  choice: தீர்க்கதரிசனம் மனித விருப்பத்தில் தோன்றவில்லை; பரிசுத்த ஆவியால் சுமந்து நடத்தப்பட்ட மனிதர்கள் கடவுளிடமிருந்து பேசினார்கள்.
  alternative: ஆவி மனிதர்களை இயந்திரம்போல் பயன்படுத்தி சொற்களைச் சொல்லவைத்தார்; அல்லது மனித முனைப்பும் தெய்வீகத் தாக்கமும் சமமாகத் தீர்க்கதரிசனத்தை உருவாக்கின.
  rationale: ‘மனிதர்கள் பேசினார்கள்’ என்பது உண்மையான மனிதச் செயலைக் காக்கிறது; ‘கடவுளிடமிருந்து’ மற்றும் ‘பரிசுத்த ஆவியால் சுமந்து நடத்தப்பட்டபடி’ என்பவை தெய்வீக மூலத்தையும் தீர்மானமான வழிநடத்துதலையும் காக்கின்றன. மூலமொழி விடும் இந்த இறையியல் அழுத்தம் எந்த ஒரு முனையிலும் கரைக்கப்படவில்லை.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘மனிதர்கள்’ என்பது இங்கு மனிதப் பேச்சாளர்களை பொதுவாகக் குறிக்கிறது. முதல் வாக்கியத்திலும் பங்கேற்பு தொடரிலும் உள்ள φέρω சொல்வேரின் ஒலிப்பை தமிழில் முழுமையாக மீட்டெடுக்க முடியாததால், ‘கொண்டுவரப்படவில்லை / சுமந்து நடத்தப்பட்டபடி’ என்ற இணை தேர்ந்தெடுக்கப்பட்டது.
