    issue: The rendering ‘சுமந்து நடத்தப்பட்டபடி’ adds the distinct idea of conducting/guiding.
    rationale: φερόμενοι is a passive participle of φέρω and more directly means ‘being carried/carried along.’ Guidance is a reasonable implication but should not replace the image in the main text.
