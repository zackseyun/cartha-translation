id: 2PE.1.16
reference: 2 Peter 1:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Οὐ γὰρ σεσοφισμένοις μύθοις ἐξακολουθήσαντες ἐγνωρίσαμεν ὑμῖν τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ δύναμιν καὶ παρουσίαν, ἀλλ’ ἐπόπται γενηθέντες τῆς ἐκείνου μεγαλειότητος.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/016.yaml
  text: For we did not make known to you the power and coming of our Lord Jesus the Messiah by following cleverly devised myths[b][a], but by becoming eyewitnesses of his majesty.
translation:
  language: ta
  text: ஏனெனில், திறமையாகப் புனையப்பட்ட கட்டுக்கதைகளைப் பின்பற்றி நம் ஆண்டவராகிய இயேசு மெசியாவின் வல்லமையையும் வருகையையும்[a] உங்களுக்கு அறிவிக்கவில்லை; மாறாக, அவருடைய மாட்சிமையை நேரில் கண்ட சாட்சிகளானோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வருகை” என்பதற்கான கிரேக்கச் சொல் παρουσία; இதற்கு “இருப்பு” அல்லது “வந்தடைதல்” என்றும் பொருள் கொள்ளலாம். புதிய ஏற்பாட்டில் பல இடங்களில் இது மெசியாவின் வருகையைக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: σεσοφισμένοις μύθοις
  choice: திறமையாகப் புனையப்பட்ட கட்டுக்கதைகள்
  rationale: σοφίζω என்பதன் பூர்த்தியான செயப்பாட்டு வடிவம், இக்கதைகள் சாதுரியமாக உருவாக்கப்பட்டவை என்ற இழிவான நுண்பொருளைக் கொண்டுள்ளது; இத்தமிழாக்கம் அவற்றின் புனைவு தன்மையையும் திட்டமிட்ட உருவாக்கத்தையும் தெளிவாக்குகிறது.
- source_word: ἐξακολουθήσαντες
  choice: பின்பற்றவில்லை
  rationale: முதன்மை வினையோடு இணைந்த பின்னணிச் செயலை இயல்பான தமிழில் தருகிறது; ‘கட்டுக்கதைகளைப் பின்பற்றி அறிவிக்கவில்லை’ என்ற கருவி/வழிமுறை சார்ந்த எதிர்மறைக் கருத்தைச் சூழமைப்பு தெளிவாக்குகிறது.
- source_word: ἐγνωρίσαμεν ὑμῖν
  choice: உங்களுக்கு அறிவித்தபோது
  rationale: γνωρίζω என்பது ‘தெரியப்படுத்துதல், அறிவித்தல்’ என்று பொருள்படும். தமிழில் காலத்தொடராக அமைப்பது, கிரேக்கப் பங்கேற்பு அமைப்பின் ‘அறிவித்த செயல் எவ்வாறு நடைபெறவில்லை’ என்ற தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: δύναμιν
  choice: வல்லமை
  rationale: δύναμις என்பதன் நேரடியான பொருளான ஆற்றல் அல்லது வலிமையை, கிறிஸ்தவத் தமிழ் வழக்கிலும் இயல்பான உயர்நடையிலும் ‘வல்லமை’ துல்லியமாகக் காட்டுகிறது.
- source_word: παρουσίαν
  choice: வருகை
  rationale: παρουσία என்பதற்கு ‘இருப்பு’, ‘வந்தடைதல்’, ‘வருகை’ ஆகிய பொருள்கள் உண்டு. இயேசுவைக் குறிக்கும் புதிய ஏற்பாட்டு சூழலில் எதிர்கால வருகை என்பது இங்கு மிகச் சாத்தியமான பொருள்; பிற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: κύριος என்பதன் இயல்பான மற்றும் நிலைபெற்ற புதிய ஏற்பாட்டுத் தமிழாக்கம் ‘ஆண்டவர்’ ஆகும்.
- source_word: Χριστοῦ
  choice: மெசியா
  rationale: Χριστός இங்கு இயேசுவின் பட்டமாகச் செயல்படுகிறது; அதன் பொருளை வெளிப்படையாக வைத்திருக்க ‘மெசியா’ பயன்படுத்தப்படுகிறது.
- source_word: ἐπόπται γενηθέντες
  choice: நேரில் கண்ட சாட்சிகளானோம்
  rationale: ἐπόπτης என்பது ஒருவர் தாமே கண்ட நேரடிச் சாட்சியைக் குறிக்கிறது. ‘நேரில் கண்ட சாட்சிகள்’ என்பது கட்டுக்கதைகளுக்கு எதிராக உள்ள ஆதார வலிமையை இயல்பாகத் தருகிறது.
- source_word: μεγαλειότητος
  choice: மாட்சிமை
  rationale: μεγαλειότης குறிக்கும் மகத்துவம், மேன்மை, கம்பீரம் ஆகியவற்றை dignified modern Tamil-இல் ‘மாட்சிமை’ சுருக்கமாகவும் பொருத்தமாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐκείνου
  choice: அவருடைய
  rationale: ἐκεῖνος முன் குறிப்பிடப்பட்ட ஆண்டவராகிய இயேசு மெசியாவையே சுட்டுகிறது; தமிழில் மரியாதைக்கும் தெளிவுக்கும் ஏற்ற உடைமை வடிவம் ‘அவருடைய’.
theological_decisions:
- issue: கிறிஸ்துவியல் சூழலில் παρουσία என்பதன் பொருள்
  choice: வருகை
  alternative: இருப்பு அல்லது வந்தடைதல்
  rationale: இச்சொல் பொதுவாக ‘இருப்பு’ அல்லது ‘வந்தடைதல்’ என்றும் பொருள்படலாம்; ஆனால் இயேசுவைப் பற்றிய புதிய ஏற்பாட்டுப் பயன்பாட்டிலும் ‘வல்லமை’ என்பதோடு இணையும் இச்சூழலிலும் அவரது வருகை என்பது மிகச் சாத்தியமான வாசிப்பு. உண்மையான சொற்பொருள் விரிவை அழிக்காமல் அடிக்குறிப்பில் மாற்று தரப்படுகிறது.
- issue: Χριστός என்பதைப் பட்டமாகவா பெயரின் பகுதியாகவா மொழிபெயர்ப்பது
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு Χριστός இயேசுவின் அபிஷேகம் பெற்ற அரசப் பட்டத்தைக் கொண்டதாகப் புரிந்துகொள்ள முடிகிறது. ஆகவே அதன் பொருளை வெளிப்படையாக வைத்திருக்க ‘மெசியா’ தேர்ந்தெடுக்கப்பட்டது.
- issue: சாட்சியின் தன்மை
  choice: நேரில் கண்ட சாட்சிகள்
  alternative: கண்டவர்கள்
  rationale: ἐπόπται என்பது வெறுமனே பார்த்தவர்களைக் காட்டிலும் நேரடி அனுபவத்தின் அடிப்படையில் சாட்சி கூறுவோரைக் குறிக்கிறது; கட்டுக்கதைகளோடு செய்யப்படும் எதிர்மறை ஒப்பீட்டில் இந்த ஆதாரத் தன்மை முக்கியம்.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழ்; சாதாரண வாசகர்களுக்குப் புரியக்கூடியதாய் இருந்தாலும் வேதவசனத்துக்கேற்ற கண்ணியமான நடை பேணப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் ‘கட்டுக்கதைகள் அல்ல, நேரில் கண்ட சாட்சி’ என்ற எதிர்மறை அமைப்பு தெளிவாக வைக்கப்பட்டுள்ளது. ஒரே அடிக்குறிப்பு குறியீடு [a] முதன்மை உரையில் இடம்பெற்றுள்ளது.
