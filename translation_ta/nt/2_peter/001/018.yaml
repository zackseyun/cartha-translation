source:
  edition: SBLGNT
  text: καὶ ταύτην τὴν φωνὴν ἡμεῖς ἠκούσαμεν ἐξ οὐρανοῦ ἐνεχθεῖσαν σὺν αὐτῷ ὄντες ἐν τῷ ⸂ἁγίῳ ὄρει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/018.yaml
  text: And we ourselves heard this voice brought from heaven when we were with him on the holy mountain[a].
translation:
  language: ta
  text: நாங்களே அவரோடு பரிசுத்த மலையில் இருந்தபோது, பரலோகத்திலிருந்து கொண்டுவரப்பட்ட இந்தக் குரலைக் கேட்டோம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பரலோகத்திலிருந்து சுமந்து வரப்பட்ட’ என்றும் மொழிபெயர்க்கலாம்.
    reason: ἐνεχθεῖσαν என்பதற்கான மாற்று மொழிபெயர்ப்பு; குரல் பரலோகத்திலிருந்து கொண்டு வரப்பட்டதைக் குறிக்கிறது.
lexical_decisions:
- source_word: ταύτην τὴν φωνὴν
  choice: இந்தக் குரலை
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட இறை உரையைச் சுட்டுவதால், பொதுவான ‘ஒலி’ என்பதைவிட ‘குரல்’ துல்லியமானது; ταύτην என்பதன் சுட்டுப்பொருளும் காக்கப்படுகிறது.
- source_word: ἡμεῖς
  choice: நாங்களே
  rationale: வினைச்சொல்லிலேயே நபரும் எண்ணும் தெரிந்திருந்தும் தனிப்பட்ட சுட்டுப்பெயர் இடம்பெறுவது வலியுறுத்தலைக் காட்டுகிறது; ‘நாங்களே’ நேரில் கேட்ட சாட்சியத்தின் வலிமையைப் பாதுகாக்கிறது.
- source_word: ἠκούσαμεν
  choice: கேட்டோம்
  rationale: இறந்தகாலத்தில் நிகழ்ந்த கேட்கும் சம்பவத்தைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: ἐξ οὐρανοῦ
  choice: பரலோகத்திலிருந்து
  rationale: குரலின் மூலத்தைத் தெரிவிக்கும் இயல்பான நவீனத் தமிழ்; ‘வானத்திலிருந்து’ என்பதும் சாத்தியம் என்றாலும் சூழலில் இறை வாசஸ்தலப் பொருளை ‘பரலோகம்’ தெளிவாகத் தருகிறது.
- source_word: ἐνεχθεῖσαν
  choice: கொண்டுவரப்பட்ட
  rationale: φέρω என்பதன் இறந்தகாலச் செயலப்பாட்டு வினையெச்சம் குரலை விவரிக்கிறது. ‘கொண்டுவரப்பட்ட’ என்பது அதன் செயலப்பாட்டு வடிவத்தையும் பரலோகத்திலிருந்து குரல் வந்து சேர்ந்த கருத்தையும் காக்கிறது.
- source_word: σὺν αὐτῷ ὄντες
  choice: நாங்கள் அவரோடு ... இருந்தபோது
  rationale: பங்கேற்பு அமைப்பின் காலத் தொடர்பை இயல்பான தமிழில் ‘இருந்தபோது’ எனத் தருகிறது; ‘அவர்’ சூழலில் இயேசுவைக் குறித்தாலும் பெயரை மொழிபெயர்ப்புக்குள் சேர்க்கவில்லை.
- source_word: ἐν τῷ ἁγίῳ ὄρει
  choice: பரிசுத்த மலையில்
  rationale: தமிழில் மலைக்குச் செல்லுதல் அல்லது அதில் இருத்தல் என்பதற்கு ‘மலையில்’ இயல்பானது. ἅγιος என்பதன் வேதாகமச் சூழலுக்கேற்ற அர்த்தத்தை ‘பரிசுத்த’ காக்கிறது.
theological_decisions:
- issue: ‘பரிசுத்த மலை’ எதைக் குறிக்கிறது?
  choice: இயேசுவின் மறுரூப நிகழ்வு நடந்த மலையை அதன் பெயரைக் குறிப்பிடாமல் விவரிக்கும் குறிப்பு
  alternative: அதைத் தாபோர் மலை அல்லது எர்மோன் மலை என்று வெளிப்படையாக அடையாளப்படுத்துதல்
  rationale: கிரேக்க மூலவாக்கியம் மலையை ‘பரிசுத்த மலை’ என்று மட்டுமே அழைக்கிறது; எந்த மலையெனப் பெயரிடவில்லை. ஆகவே மரபுவழி அடையாளத்தை உரைக்குள் இறக்குமதி செய்யாமல் மூலத்தின் திறந்த தன்மை காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையில் வடிவமைக்கப்பட்டது. கிரேக்கச் சொல்வரிசையை அப்படியே பின்பற்றாமல் இயல்பான தமிழ் வாக்கிய அமைப்பு பயன்படுத்தப்பட்டுள்ளது; அதேவேளையில் ‘நாங்களே’ என்ற வலியுறுத்தலும் ἐνεχθεῖσαν என்பதன் செயலப்பாட்டு நுணுக்கமும் பாதுகாக்கப்பட்டுள்ளன.
