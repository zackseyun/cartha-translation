source:
  edition: SBLGNT
  text: λαβὼν γὰρ παρὰ θεοῦ πατρὸς τιμὴν καὶ δόξαν φωνῆς ἐνεχθείσης αὐτῷ τοιᾶσδε ὑπὸ τῆς μεγαλοπρεποῦς δόξης· ⸂Ὁ υἱός μου ὁ ἀγαπητός μου οὗτός ἐστιν⸃, εἰς ὃν ἐγὼ εὐδόκησα—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/017.yaml
  text: 'For when he received honor and glory from God the Father[a], such a voice was borne to him from the Majestic Glory: “This is my Son, my Beloved[c][b], in whom I am well pleased”—'
translation:
  language: ta
  text: 'ஏனெனில், பிதாவாகிய தேவனிடமிருந்து அவர் மரியாதையையும் மகிமையையும் பெற்றபோது, மாட்சிமைமிக்க மகிமையிலிருந்து அவருக்கு இவ்வாறான குரல் வந்தது: “இவரே என் மகன், என் அன்புக்குரியவர்; இவரில் நான் பிரியம்கொண்டேன்”—'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβὼν γὰρ παρὰ θεοῦ πατρὸς
  choice: ஏனெனில், பிதாவாகிய தேவனிடமிருந்து அவர் ... பெற்றபோது
  rationale: λαβών என்ற இறந்தகாலப் பங்கேற்பு வடிவத்தின் காலத் தொடர்பையும், παρά + உரிமை வேற்றுமையின் மூலப்பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: τιμὴν καὶ δόξαν
  choice: கனத்தையும் மகிமையையும்
  rationale: இரு பெயர்ச்சொற்களையும் தனித்தனியாகக் காக்கிறது; ‘கனம்’ என்பது இங்கு அளிக்கப்படும் மதிப்பு அல்லது மேன்மையைக் குறிக்கிறது.
- source_word: φωνῆς ἐνεχθείσης αὐτῷ τοιᾶσδε
  choice: இத்தகைய குரல் அவரிடம் கொண்டுவரப்பட்டது
  rationale: ἐνεχθείσης என்பதன் செயப்பாட்டு வடிவத்தையும், τοιᾶσδε அடுத்து வரும் மேற்கோளைச் சுட்டுவதையும் நெருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: ὑπὸ τῆς μεγαλοπρεποῦς δόξης
  choice: மகத்துவமிக்க மகிமையிடமிருந்து
  rationale: மரியாதைமிக்க தெய்வீகச் சுற்றுக்குறிப்பை விளக்கிவிடாமல் காக்கிறது; ὑπό இங்கு முகமை அல்லது மூலத்தைச் சுட்டக்கூடும்.
- source_word: Ὁ υἱός μου ὁ ἀγαπητός μου οὗτός ἐστιν
  choice: இவரே என் மகன், என் அன்புக்குரியவர்
  rationale: ‘என் மகன்’ மற்றும் ‘என் அன்புக்குரியவர்’ என்ற இணைநிலை அமைப்பையும், மீண்டும் வரும் μου என்பதையும் வெளிப்படையாகக் காக்கிறது.
- source_word: εἰς ὃν ἐγὼ εὐδόκησα
  choice: இவரில் நான் மகிழ்ந்தேன்
  rationale: εἰς என்பதன் அசாதாரணமான ‘இவரில்’ அமைப்பையும் εὐδόκησα என்பதன் இறந்தகால வடிவத்தையும் பாதுகாக்கிறது; வழக்கான தமிழ் மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: τῆς μεγαλοπρεποῦς δόξης என்ற தெய்வீகச் சுற்றுக்குறிப்பு
  choice: மகத்துவமிக்க மகிமை
  alternative: மாட்சிமை பொருந்திய மகிமை; மகத்துவமான மகிமை
  rationale: இது தேவனுடைய மகிமைமிக்க பிரசன்னத்தைக் குறிக்கும் மரியாதைச் சுற்றுக்குறிப்பாக இருக்கலாம்; ‘தேவன்’ என்று விரிவாக்காமல் மூலத்தின் உருவகத்தையும் மறைமுகத்தன்மையையும் காக்கிறது.
- issue: மகனைப் பற்றிய பிதாவின் அறிவிப்பின் இணைநிலை அமைப்பு
  choice: இவரே என் மகன், என் அன்புக்குரியவர்
  alternative: இவரே என் அன்புக்குரிய மகன்
  rationale: மூலத்தில் ‘மகன்’ மற்றும் ‘அன்புக்குரியவர்’ தனித்த இணைநிலைச் சொற்றொடர்களாக இருப்பதைத் தெளிவாகக் காட்டுகிறது; பின்னைய கோட்பாட்டு மொழியைச் சேர்ப்பதில்லை.
- issue: εἰς ὃν ἐγὼ εὐδόκησα என்பதின் காலமும் தொடர்பும்
  choice: இவரில் நான் மகிழ்ந்தேன்
  alternative: இவரிடம் நான் மகிழ்ச்சியாயிருக்கிறேன்; இவரில் நான் பிரியமாயிருந்தேன்
  rationale: மூலத்தின் εἰς என்ற முன்னிடைச்சொல் மற்றும் இறந்தகால εὐδόκησα ஆகியவற்றை முதன்மை உரையில் காக்கிறது; அதன் இயல்பான நிகழ்காலப் பொருள் சாத்தியத்தை அடிக்குறிப்பில் திறந்துவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க வேதாகம நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கொண்டுவரப்பட்டது’ என்ற உயர்நடைச் செயப்பாட்டு வடிவம் மூலத்தின் ἐνεχθείσης-ஐ காக்கிறது; மேற்கோளின் முடிவிலுள்ள நீண்ட கோடு அடுத்த வசனத்தில் வாக்கியம் தொடர்வதைச் சுட்டுகிறது.
