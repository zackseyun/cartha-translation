revisions:
- from: 'ஏனெனில், பிதாவாகிய தேவனிடமிருந்து அவர் கனத்தையும் மகிமையையும் பெற்றபோது, மகத்துவமிக்க மகிமையிடமிருந்து[a] இத்தகைய குரல் அவரிடம் கொண்டுவரப்பட்டது: “இவரே என் மகன், என் அன்புக்குரியவர்[b]; இவரில் நான் மகிழ்ந்தேன்[c]”—'
