  text: τοῦτο πρῶτον γινώσκοντες ὅτι πᾶσα προφητεία γραφῆς ἰδίας ἐπιλύσεως οὐ γίνεται,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/020.yaml
  text: 'knowing this first: that every prophecy of Scripture does not come about from one''s own interpretation.'
translation:
  language: ta
  text: 'முதலாவதாக இதை அறிந்துகொள்ளுங்கள்: வேதவாக்கிலுள்ள ஒவ்வொரு தீர்க்கதரிசனமும் ஒருவருடைய சொந்த விளக்கத்திலிருந்து உருவாவதில்லை.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο πρῶτον γινώσκοντες
  choice: முதலாவதாக இதை அறிந்துகொள்ளுங்கள்
  rationale: The participial expression is rendered as a natural Tamil exhortation while retaining the priority expressed by πρῶτον.
- source_word: πᾶσα προφητεία γραφῆς
  choice: வேதவாக்கிலுள்ள ஒவ்வொரு தீர்க்கதரிசனமும்
  rationale: Preserves the distributive force of πᾶσα and takes γραφῆς as identifying prophecy belonging to Scripture.
- source_word: ἰδίας ἐπιλύσεως
  choice: ஒருவருடைய சொந்த விளக்கத்திலிருந்து
  rationale: ἐπίλυσις is rendered as ‘explanation/interpretation’; ‘one’s own’ preserves ἰδίας without specifying whether the person is the prophet or the reader.
- source_word: οὐ γίνεται
  choice: உருவாவதில்லை
  rationale: Retains the broad coming-about/origin sense of γίνεται rather than reducing it to an act of reading or interpretation.
theological_decisions:
- issue: Whose ‘own interpretation’ is meant
  choice: ஒருவருடைய சொந்த விளக்கம்
  alternative: தீர்க்கதரிசியின் சொந்த விளக்கம் / வாசகரின் சொந்த விளக்கம்
  rationale: The Greek does not explicitly identify the person; the translation therefore avoids resolving the phrase specifically toward either prophetic origin or readerly interpretation.
- issue: Scope of πᾶσα with negation
  choice: ஒவ்வொரு தீர்க்கதரிசனமும் ... உருவாவதில்லை
  alternative: எந்தத் தீர்க்கதரிசனமும் ... உருவாவதில்லை
  rationale: This follows the source wording and audited consultation layer by preserving the overt distributive ‘every’ plus negation, despite the more idiomatic Tamil universal-negative alternative.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய மரியாதைமிக்க நடை. ‘வேதவாக்கு’ என்பது γραφή என்பதற்கான சுருக்கமான, இயல்பான வேதாகமப் பயன்பாடு; ‘உருவாவதில்லை’ அடுத்த வசனத்தில் விவரிக்கப்படும் தோற்றம்/மூலம் சார்ந்த கருத்துக்கு இடமளிக்கிறது.
