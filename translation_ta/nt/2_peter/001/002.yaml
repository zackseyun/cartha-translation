source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη ἐν ἐπιγνώσει τοῦ θεοῦ καὶ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/002.yaml
  text: Grace to you and peace be multiplied in the knowledge of God and of Jesus our Lord[a][b].
translation:
  language: ta
  text: கடவுளையும் நம் ஆண்டவராகிய இயேசுவையும் குறித்த அறிவில், உங்களுக்கு அருளும் சமாதானமும் பெருகட்டும்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளையும் நம் ஆண்டவராகிய இயேசுவையும் குறித்த அறிவின் மூலம்.” கிரேக்க முன்னிடைச்சொல் ஒரு சூழலை (“அறிவில்”) அல்லது ஒரு வழிமுறையை (“அறிவின் மூலம்”) குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: “அறிவு” என்பதற்குப் பதிலாக, “முழுமையான அறிவு” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ஆழ்ந்த அல்லது இன்னும் நிறைவான அறிவைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: அருள்
  rationale: கடவுளின் தயவையும் திருமுக வாழ்த்தின் இறையியல் செறிவையும் இயல்பாகத் தக்கவைக்கும் வழக்கமான தமிழ்ச் சொல்.
- source_word: εἰρήνη
  choice: சமாதானம்
  rationale: திருமுக வாழ்த்தில் வரும் ‘அமைதி’ மற்றும் முழுமையான நல்வாழ்வு ஆகிய செறிவுகளைத் தக்கவைக்கும் பரவலான வேதாகமத் தமிழ் வழக்கு.
- source_word: πληθυνθείη
  choice: பெருகட்டும்
  rationale: வாழ்த்தாக வரும் இறந்தகாலச் செயப்பாட்டு விருப்பவினையின் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; அருளும் சமாதானமும் மிகுதியாக வழங்கப்பட வேண்டும் என்ற வாழ்த்தைத் தக்கவைக்கிறது.
- source_word: ἐν
  choice: அறிவில்
  rationale: ἐν என்பதன் முதன்மையான இடம்/சூழல் சார்ந்த பொருளைத் தக்கவைத்து, அது கருவியையும் (‘மூலம்’) குறிக்கக்கூடும் என்ற தெளிவின்மையை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: ἐπιγνώσει
  choice: அறிவு
  rationale: இச்சூழலில் இயல்பான தமிழாக்கம். ‘முழுமையான அறிவு’ என்ற வலுப்படுத்தப்பட்ட நுண்பொருள் சாத்தியமானது; ஆனால் அதை முதன்மை உரையில் கட்டாயப்படுத்தாமல் அடிக்குறிப்பில் தருகிறது.
- source_word: τοῦ θεοῦ καὶ Ἰησοῦ τοῦ κυρίου ἡμῶν
  choice: கடவுளையும் நம் ஆண்டவராகிய இயேசுவையும் குறித்த
  rationale: அறிவின் பொருளாகக் கடவுளும் இயேசுவும் தனித்தனியாகக் குறிப்பிடப்படுவதைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது; ‘நம் ஆண்டவர்’ என்பது இயேசுவைக் குறிப்பதையும் பாதுகாக்கிறது.
theological_decisions:
- issue: ἐπίγνωσις என்பதன் வலுப்படுத்தப்பட்ட நுண்பொருள்
  choice: அறிவு
  alternative: முழுமையான அறிவு
  rationale: இரண்டாம் பேதுருவில் இச்சொல் ஆழ்ந்த அல்லது முழுமையான அறிவைக் குறிக்கக்கூடும். ஆயினும், உடனடிச் சூழல் அந்த வலுப்படுத்தப்பட்ட பொருளை வெளிப்படையாகக் கட்டாயப்படுத்தாததால், முதன்மை உரை பொதுவான பொருளைத் தக்கவைக்கிறது.
- issue: ἐν ἐπιγνώσει என்பதில் ἐν-இன் தொடர்பு
  choice: அறிவில்
  alternative: அறிவின் மூலம்
  rationale: கிரேக்க முன்னிடைச்சொல் அறிவை அருளும் சமாதானமும் பெருகும் சூழலாகவோ, அவை பெருகும் வழிமுறையாகவோ காட்டக்கூடும். முதன்மை உரையில் ‘அறிவில்’ என நேரடியாக மொழிபெயர்த்து, மாற்றுச் சாத்தியத்தை அடிக்குறிப்பில் அளிக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டுள்ளது. ‘கடவுள்’, ‘அருள்’, ‘சமாதானம்’, ‘ஆண்டவர்’ ஆகியவை சாதாரண வாசகர்களுக்குப் புரியும், கிறிஸ்தவச் சூழலில் பரவலாக அறியப்பட்ட சொற்களாகத் தேர்ந்தெடுக்கப்பட்டன. கிரேக்க வாழ்த்தின் சுருக்கமும் ஆசீர்வாதத் தொனியும் காக்கப்பட்டுள்ளன.
