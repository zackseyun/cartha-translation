source:
  edition: SBLGNT
  text: ἐν δὲ τῇ εὐσεβείᾳ τὴν φιλαδελφίαν, ἐν δὲ τῇ φιλαδελφίᾳ τὴν ἀγάπην·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/007.yaml
  text: and in godliness[a], brotherly affection; and in brotherly affection, love.
translation:
  language: ta
  text: இறைப்பற்றுடன் சகோதரப் பாசத்தையும்[a], சகோதரப் பாசத்துடன் அன்பையும் சேர்த்துக்கொள்ளுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சகோதர அன்பு.” கிரேக்கச் சொல் உடன்பிறந்தோருக்குரிய பாசத்தையும், குறிப்பாக உடன் விசுவாசிகளிடம் காட்டும் பாசத்தையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσεβείᾳ
  choice: இறைப்பற்று
  rationale: இச்சொல் கடவுள்மீது கொண்ட பயபக்தியும் அது வாழ்க்கை மற்றும் நடத்தையில் வெளிப்படுவதும் ஆகிய இரு பரிமாணங்களையும் குறிக்கிறது. ‘இறைப்பற்று’ என்பது இவற்றை இயல்பான நவீன தமிழில் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: φιλαδελφίαν
  choice: சகோதரப் பாசம்
  rationale: φιλαδελφία என்பது சகோதரர்களிடம், குறிப்பாக உடன் விசுவாசிகளிடம் காட்டும் குடும்ப நெருக்கமுள்ள பாசத்தைக் குறிக்கிறது. அடுத்து வரும் ἀγάπη என்பதிலிருந்து வேறுபாட்டைத் தெளிவாக வைத்திருக்க ‘அன்பு’ என்பதற்குப் பதிலாக இங்கு ‘பாசம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἀγάπην
  choice: அன்பு
  rationale: ἀγάπη என்பதற்கான இயல்பான, பரந்த பொருளுடைய தமிழ் இணை ‘அன்பு.’ இதற்கு முந்திய சகோதரப் பாசத்தைவிட விரிந்த உச்சப் பண்பாக இது வருவதை மேலதிக விளக்கமின்றிப் பாதுகாக்கிறது.
- source_word: ἐν δὲ τῇ ... τὴν ...
  choice: '...உடன் ...ஐயும் சேர்த்துக்கொள்ளுங்கள்'
  rationale: ἐν என்பதன் துல்லியமான தொடர்பைத் தமிழில் இயல்பாகக் காட்ட ‘உடன்’ பயன்படுத்தப்பட்டுள்ளது. முந்திய வசனங்களிலிருந்து தொடரும் ‘சேர்த்துக்கொள்ளுங்கள்’ என்ற வினை, தனி வசனமாக வாசிக்கும்போது பொருள் நிறைவுறுவதற்காக வெளிப்படையாக வழங்கப்பட்டுள்ளது; மூலத்தின் மீளும் அமைப்பும் தக்கவைக்கப்பட்டுள்ளது.
- source_word: δέ
  choice: -ஐயும்
  rationale: இங்கு δέ எதிர்மறை இணைப்பல்ல; பண்புப் பட்டியலைத் தொடரும் மென்மையான இணைப்பு. தமிழில் ‘-ஐயும்’ அந்தச் சேர்க்கைத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பண்புகளின் தொடரில் φιλαδελφία மற்றும் ἀγάπη ஆகியவற்றை வேறுபடுத்துதல்
  choice: φιλαδελφία என்பதை ‘சகோதரப் பாசம்’ என்றும் ἀγάπη என்பதை ‘அன்பு’ என்றும் மொழிபெயர்த்தல்
  alternative: இரண்டிலும் ‘அன்பு’ என்பதைப் பயன்படுத்தி, முதலாவதை ‘சகோதர அன்பு’ என மொழிபெயர்த்தல்
  rationale: கிரேக்க மூலம் தொடர்புடைய ஆனால் வேறுபட்ட இரண்டு சொற்களை அடுத்தடுத்து வைக்கிறது. ‘சகோதரப் பாசம்’ என்பது உடன் விசுவாசிகளுக்கிடையிலான குடும்ப நெருக்கத்தை வெளிப்படுத்துகிறது; ‘அன்பு’ என்பது அதன் பரந்த பொருளையும் தொடரின் உச்சநிலையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. முந்திய வசனத்திலிருந்து தொடரும் கட்டளை வினை வெளிப்படையாகச் சேர்க்கப்பட்டு, இரு இணையான சொற்றொடர்களின் அமைப்பு பாதுகாக்கப்பட்டுள்ளது. அடிக்குறிப்புக் குறி அது விளக்கும் ‘சகோதரப் பாசம்’ என்பதற்குப் பின்னர் வைக்கப்பட்டுள்ளது.
