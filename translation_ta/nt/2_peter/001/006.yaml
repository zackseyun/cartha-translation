id: 2PE.1.6
reference: 2 Peter 1:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐν δὲ τῇ γνώσει τὴν ἐγκράτειαν, ἐν δὲ τῇ ἐγκρατείᾳ τὴν ὑπομονήν, ἐν δὲ τῇ ὑπομονῇ τὴν εὐσέβειαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/006.yaml
  text: and in knowledge[a], self-control; and in self-control, steadfastness; and in steadfastness, godliness[b],
translation:
  language: ta
  text: அறிவுடன் தன்னடக்கத்தையும், தன்னடக்கத்துடன் நிலைத்திருத்தலையும்[a], நிலைத்திருத்தலுடன் இறைபக்தியையும்[b] சேர்த்துக்கொள்ளுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நிலைத்திருத்தல்’ என்பதற்கான கிரேக்கச் சொல் ‘சகித்திருத்தல்,’ ‘விடாமுயற்சி,’ அல்லது ‘பொறுமையுடன் நிலைத்திருத்தல்’ என்றும் மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் இத்தொடர் சுருக்கமாக உள்ளது; முந்தைய வசனத்தில் தொடங்கியபடி, ஒரு நற்பண்புடன் அடுத்த நற்பண்பைச் சேர்த்துக்கொள்ள வேண்டும் என்ற பொருள் தொடர்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: γνώσει
  choice: அறிவு
  rationale: γνῶσις என்பதன் நேரடியான, இயல்பான பொருள் ‘அறிவு’; நற்பண்புகளின் தொடரிலும் இது தெளிவாகப் பொருந்துகிறது.
- source_word: ἐγκράτειαν / ἐγκρατείᾳ
  choice: தன்னடக்கம்
  rationale: ஒருவரின் ஆசைகளையும் உந்துதல்களையும் கட்டுப்படுத்தும் ஆற்றலைக் குறிக்கிறது; ‘தன்னடக்கம்’ நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: ὑπομονήν / ὑπομονῇ
  choice: நிலைத்திருத்தல்
  rationale: இடரின்கீழும் தளராமல் தொடர்ந்து நிற்பதை இச்சொல் குறிக்கிறது. ‘நிலைத்திருத்தல்’ வெறும் செயலற்ற பொறுமையாகக் குறுக்காமல் அதன் உறுதியான தொடர்ச்சியை வெளிப்படுத்துகிறது.
- source_word: εὐσέβειαν
  choice: இறைபக்தி
  rationale: கடவுள்மீதான பயபக்தியும் அது வாழ்க்கையில் வெளிப்படுவதும் இங்கு குறிக்கப்படுகின்றன; ‘இறைபக்தி’ பொதுவாகப் புரியக்கூடிய, சமயப் பிரிவுசார்பற்ற சொல்.
- source_word: ἐν δὲ τῇ ... τὴν ...
  choice: '...உடன் ...ஐயும்'
  rationale: முந்தைய வசனத்திலிருந்து தொடரும் ஒரு நற்பண்புடன் அடுத்த நற்பண்பைச் சேர்க்கும் அமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; கிரேக்கத்தின் சுருக்கமான தொடர் வடிவமும் பெருமளவு காக்கப்படுகிறது.
- source_word: δέ
  choice: -உம் / தொடரமைப்பு
  rationale: இங்கு δέ எதிர்மறை வேறுபாட்டைக் காட்டாமல் தொடரிலுள்ள கூறுகளை இணைக்கிறது; தமிழின் ‘-உம்’ சேர்க்கை ஓட்டத்தை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: நற்பண்புத் தொடரின் விடுபட்ட வினைச்சொல் அமைப்பு
  choice: முந்தைய வசனத்திலிருந்து பொருளில் தொடரும் ‘சேர்த்துக்கொள்ளுங்கள்’ என்பதை ஒருமுறை வெளிப்படையாகக் கொடுத்தல்
  alternative: வினைச்சொல்லைச் சேர்க்காமல், கிரேக்கத்தைப் போலச் சுருக்கமான பெயர்ச்சொல் தொடராக மட்டும் விடுதல்
  rationale: கிரேக்கத்தில் வினைச்சொல் முந்தைய வசனத்திலிருந்து புரிந்துகொள்ளப்படுகிறது. தனி வசனமாக வாசிக்கும்போது இயல்பான தமிழுக்கும் தெளிவுக்கும் அதை ஒருமுறை வெளிப்படுத்துவது உதவுகிறது; புதிய கட்டளையையோ கோட்பாட்டையோ சேர்ப்பதில்லை.
- issue: εὐσέβεια என்பதின் சமயப் பொருள்
  choice: இறைபக்தி
  alternative: தேவபக்தி; பக்தியுள்ள வாழ்க்கை
  rationale: இச்சொல் வெறும் வெளிப்புற மதச்சடங்கையோ ஒரு குறிப்பிட்ட சமயப் பிரிவின் ஆன்மிகத் தரத்தையோ மட்டும் குறிக்காது; கடவுளை மதிக்கும் பக்தி வாழ்க்கையில் வெளிப்படுவதைத் திறந்தவாறு வைத்திருக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் மரியாதையான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பட்டியலின் ஒத்திசைவைப் பேண ‘...உடன் ...ஐயும்’ என்ற தொடர் பயன்படுத்தப்பட்டுள்ளது. தனித்த வசன வாசிப்பின் தெளிவுக்காக முந்தைய வசனத்திலிருந்து புரிந்துகொள்ளப்படும் வினைச்சொல் இறுதியில் வெளிப்படுத்தப்பட்டுள்ளது.
