source:
  edition: SBLGNT
  text: καὶ ἔχομεν βεβαιότερον τὸν προφητικὸν λόγον, ᾧ καλῶς ποιεῖτε προσέχοντες ὡς λύχνῳ φαίνοντι ἐν αὐχμηρῷ τόπῳ, ἕως οὗ ἡμέρα διαυγάσῃ καὶ φωσφόρος ἀνατείλῃ ἐν ταῖς καρδίαις ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/019.yaml
  text: And we have the prophetic word more certain[a], to which you do well to pay attention as to a lamp shining in a dark place[b], until the day dawns and the morning star rises in your hearts.
translation:
  language: ta
  text: மேலும், தீர்க்கதரிசன வார்த்தை நமக்கு மேலும் உறுதியானதாக உள்ளது[a]. இருண்ட இடத்தில் ஒளிரும் விளக்கிற்கு நீங்கள் கவனம் செலுத்துவதுபோல், பொழுது புலர்ந்து உங்கள் இதயங்களில் விடிவெள்ளி[b] உதிக்கும்வரை அந்த வார்த்தைக்குக் கவனம் செலுத்துவது நல்லது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இன்னும் உறுதியான தீர்க்கதரிசன வார்த்தை நமக்கு இருக்கிறது” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தை, அப்போஸ்தலரின் சாட்சியால் தீர்க்கதரிசன வார்த்தை உறுதிப்படுகிறது என்றோ, அந்த வார்த்தையின் உறுதியான தன்மை வலியுறுத்தப்படுகிறது என்றோ புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: “விடிவெள்ளி” என்பது மேசியாவைக் குறிக்கும் உருவகத்தை நினைவூட்டக்கூடும்; வெளிப்படுத்தின விசேஷம் 22:16-ஐ ஒப்பிடுக.
    reason: cross_reference
lexical_decisions:
- source_word: βεβαιότερον
  choice: இன்னும் உறுதியானதாக இருக்கிறது
  rationale: ஒப்பீட்டுப் பொருளை வெளிப்படையாகக் காக்கிறது. கிரேக்கத்தில் இல்லாத செயப்படுத்தும் கருத்தைச் சேர்க்காமல், முந்தைய அப்போஸ்தல சாட்சியால் தீர்க்கதரிசன வார்த்தை உறுதிப்படுத்தப்படுகிறது என்ற வாசிப்புக்கும், அதன் உறுதியான தன்மை வலியுறுத்தப்படுகிறது என்ற வாசிப்புக்கும் இடமளிக்கிறது.
- source_word: τὸν προφητικὸν λόγον
  choice: தீர்க்கதரிசன வார்த்தை
  rationale: λόγος என்பதையும் προφητικός என்ற பெயரடையையும் இயல்பான, மரியாதையான தமிழில் நெருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: ᾧ καλῶς ποιεῖτε προσέχοντες
  choice: அந்த வார்த்தைக்குக் கவனம் செலுத்துவது நல்லது
  rationale: προσέχω என்பதன் கவனமாகச் செவிகொடுத்தல்/கவனம் செலுத்துதல் என்ற பொருளையும் καλῶς ποιεῖτε என்ற பாராட்டையும் இயல்பான தமிழில் தருகிறது.
- source_word: ὡς λύχνῳ φαίνοντι
  choice: ஒளிரும் விளக்கைப் போலுள்ள
  rationale: உவமையையும் நிகழ்காலப் பங்கேற்புச் சொல்லின் தொடரும் ஒளிர்தலையும் காக்கிறது.
- source_word: ἐν αὐχμηρῷ τόπῳ
  choice: இருண்ட இடத்தில்
  rationale: விளக்கு உருவகத்துடன் இயல்பாகப் பொருந்தும் தெளிவான தமிழ்; αὐχμηρός என்பதன் இருள்/மங்கல் சார்ந்த பொருளை அளிக்கிறது.
- source_word: ἕως οὗ ἡμέρα διαυγάσῃ
  choice: பொழுது புலரும்வரை
  rationale: காலவரம்பையும் வெளிச்சம் உதிக்கும் உருவகத்தையும் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: φωσφόρος
  choice: விடிவெள்ளி
  rationale: விடியற்கால நட்சத்திரத்தைச் சுட்டும் இயல்பான தமிழ் சொல்; உருவகத்தின் குறிப்பிடப்படாத இறையியல் சார்பை முதன்மை உரையில் விளக்கிவிடாமல் காக்கிறது.
- source_word: ἀνατείλῃ
  choice: உதிக்கும்
  rationale: வானியல் உருவகத்தில் நட்சத்திரம் எழுவதைக் குறிக்கும் இயல்பான தமிழ் வினை.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: உங்கள் இதயங்களில்
  rationale: உள்ளான மனிதரைச் சுட்டும் வேதாகம உருவகத்தை விளக்கச் சேர்க்காமல் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: βεβαιότερον என்பது அப்போஸ்தலரின் நேரடி சாட்சிக்கும் தீர்க்கதரிசன வார்த்தைக்கும் இடையில் எவ்வாறு தொடர்புபடுகிறது
  choice: “தீர்க்கதரிசன வார்த்தை நமக்கு இன்னும் உறுதியானதாக இருக்கிறது” என்று மொழிபெயர்க்கப்பட்டது.
  alternative: “இன்னும் உறுதியான தீர்க்கதரிசன வார்த்தை நமக்கு இருக்கிறது” அல்லது “தீர்க்கதரிசன வார்த்தை நமக்கு மேலும் உறுதிப்படுத்தப்பட்டுள்ளது.”
  rationale: கிரேக்க ஒப்பீட்டுப் பொருளைக் காத்து, தீர்க்கதரிசன வார்த்தை அப்போஸ்தல சாட்சியால் உறுதிப்படுகிறது என்ற வாசிப்பையோ, அதன் இயல்பான உறுதி வலியுறுத்தப்படுகிறது என்ற வாசிப்பையோ கட்டாயமாகத் தீர்மானிக்கவில்லை.
- issue: φωσφόρος என்பதன் குறிப்பு
  choice: முதன்மை உரையில் “விடிவெள்ளி” என்ற உருவகம் மட்டும் வைக்கப்பட்டது.
  alternative: கிறிஸ்துவை நேரடியாகப் பெயரிடுதல் அல்லது இறுதிக்கால உள்ளொளி என விளக்குதல்.
  rationale: உரையில் குறிப்பு வெளிப்படையாக அடையாளப்படுத்தப்படவில்லை. மேசியாவை நினைவூட்டும் ஒலி இருக்கக்கூடும்; ஆனாலும் அதனை மொழிபெயர்ப்பிலேயே முடிவு செய்யாமல் உருவகமும் இறையியல் அழுத்தமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமச் சூழலுக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. கிரேக்கத்தின் நீண்ட வாக்கியம் தமிழில் இயல்பாக வாசிக்க இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது; பொருள் தொடர்பு காக்கப்பட்டது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
