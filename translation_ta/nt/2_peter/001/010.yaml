- from: ஆகையால், சகோதரர்களே[a], உங்களுடைய அழைப்பையும் தேர்ந்தெடுக்கப்பட்ட நிலையையும் உறுதிப்படுத்த இன்னும் அதிகமாக முயற்சி செய்யுங்கள். ஏனெனில் இவற்றைச் செய்துவருகிற நீங்கள் ஒருபோதும் இடறவே மாட்டீர்கள்.
