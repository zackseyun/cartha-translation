id: 2PE.1.10
reference: 2 Peter 1:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διὸ μᾶλλον, ἀδελφοί, σπουδάσατε βεβαίαν ὑμῶν τὴν κλῆσιν καὶ ἐκλογὴν ποιεῖσθαι· ταῦτα γὰρ ποιοῦντες οὐ μὴ πταίσητέ ποτε·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/010.yaml
  text: Therefore[a], brothers, be all the more diligent to make your calling and election sure, for if you do these things, you will certainly never stumble.
translation:
  language: ta
  text: ஆகையால், சகோதரர்களே[a], உங்கள் அழைப்பையும் தேர்ந்தெடுத்தலையும் உறுதிப்படுத்துவதற்கு இன்னும் அதிகக் கருத்துடன் முயற்சி செய்யுங்கள். ஏனெனில் இவற்றைச் செய்தால், நீங்கள் ஒருபோதும் இடறமாட்டீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதர சகோதரிகளே” என்றும் பொருள் கொள்ளலாம்; கிரேக்கத்தில் “சகோதரர்களே” என்று உள்ளது. ஆனால் அது விசுவாசக் குழு முழுவதையும் உள்ளடக்கி அழைக்கும் சொல்லாகவும் பயன்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: ஆகையால்
  rationale: முந்தைய அறிவுரைகளிலிருந்து வரும் முடிவை இயல்பான தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: μᾶλλον
  choice: இன்னும் அதிகமாக
  rationale: σπουδάσατε என்ற கட்டளையை வலுப்படுத்தும் ஒப்பீட்டு நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: கிரேக்கச் சொல்லின் ஆண்பால் பன்மை வடிவத்தை முதன்மை உரையில் காக்கிறது; விசுவாசக் குழு முழுவதையும் உள்ளடக்கக்கூடிய பயன்பாடு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: σπουδάσατε
  choice: முயற்சி செய்யுங்கள்
  rationale: ஆர்வமும் கருத்தூன்றிய உழைப்பும் கோரும் கட்டளையை சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான நடையில் தருகிறது.
- source_word: βεβαίαν
  choice: உறுதிப்படுத்த
  rationale: உறுதியானதாக அல்லது நிலைநாட்டப்பட்டதாக ஆக்குதல் என்ற பொருளைத் தருகிறது; அழைப்பையும் தேர்ந்தெடுக்கப்பட்ட நிலையையும் மனித முயற்சியால் தொடக்கி உருவாக்குவதாகச் சொல்லவில்லை.
- source_word: κλῆσιν
  choice: அழைப்பு
  rationale: தேவனுடைய அழைப்பைக் குறிக்கும் புதிய ஏற்பாட்டின் வழக்கமான கருத்தைச் சுருக்கமாகக் காக்கிறது.
- source_word: ἐκλογὴν
  choice: தேர்ந்தெடுக்கப்பட்ட நிலை
  rationale: தேவனால் தேர்ந்தெடுக்கப்பட்டிருத்தல் என்ற பெயர்ச்சொல் கருத்தை நவீன தமிழில் தெளிவுபடுத்துகிறது; குறிப்பிட்ட ஒரு இறையியல் அமைப்பை உரைக்குள் திணிக்கவில்லை.
- source_word: ποιεῖσθαι
  choice: உறுதிப்படுத்த
  rationale: βεβαίαν என்பதுடன் இணைந்து உறுதியானதாக ஆக்குதல் அல்லது உறுதிசெய்தல் என்ற செயற்பாட்டுப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ταῦτα
  choice: இவற்றை
  rationale: முந்தைய வசனங்களில் சொல்லப்பட்ட பண்புகளையும் செயல்களையும் சுட்டுகிறது.
- source_word: ποιοῦντες
  choice: செய்துவருகிற
  rationale: பங்கேற்பு வினையின் தொடர்ச்சியான செயற்பாட்டு நுணுக்கத்தையும், அதனுடன் தொடர்புடைய விளைவையும் காக்கிறது.
- source_word: οὐ μὴ
  choice: ஒருபோதும் … வே மாட்டீர்கள்
  rationale: கிரேக்கத்தின் வலுவான மறுப்பை தமிழின் அழுத்த விகுதியுடன் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πταίσητέ
  choice: இடறவே மாட்டீர்கள்
  rationale: இடறுதல் என்ற உருவகத்தைத் தக்கவைத்து, பாவமற்ற பரிபூரணத்தையோ இறுதி விசுவாசத் துறப்பையோ தேவையின்றி உரைக்குள் குறிப்பாக்கவில்லை.
theological_decisions:
- issue: “உங்களுடைய அழைப்பையும் தேர்ந்தெடுக்கப்பட்ட நிலையையும் உறுதிப்படுத்த” என்பதன் பொருள்
  choice: தேவனுடைய அழைப்பையும் தேர்ந்தெடுத்தலையும் மனிதர்கள் உருவாக்குகிறார்கள் என்று அல்லாமல், விடாமுயற்சியுள்ள நற்பண்புகளால் அவற்றின் உண்மையை உறுதிப்படுத்தி நிலைநாட்ட வேண்டும் என்ற அறிவுரை.
  alternative: மனித முயற்சியே தேவனுடைய தேர்ந்தெடுத்தலை ஏற்படுத்துகிறது அல்லது தீர்மானிக்கிறது என்ற வாசிப்பு.
  rationale: ποιεῖσθαι என்பதுடன் βεβαίαν சேர்ந்திருப்பது உறுதியானதாக ஆக்குதல் அல்லது உறுதிப்படுத்துதல் என்பதைக் காட்டுகிறது. அதேவேளையில், வசனத்தில் உள்ள மனிதப் பொறுப்புக்கும் தேவனுடைய அழைப்பு மற்றும் தேர்ந்தெடுத்தலுக்கும் இடையிலான இறையியல் அழுத்தம் தீர்த்துவிடப்படாமல் காக்கப்படுகிறது.
- issue: “ஒருபோதும் இடறவே மாட்டீர்கள்” என்பதன் வலிமை
  choice: உண்மையுடன் இவற்றைச் செய்துவரும் வாழ்வில் இடறுதலிலிருந்து காக்கப்படுவீர்கள் என்ற வலுவான வாக்குறுதி.
  alternative: எந்தப் பாவத்தையும் ஒருபோதும் செய்யமாட்டார்கள் என்ற முழுமையான பாவமின்மை; அல்லது இது இறுதி விசுவாசத் துறப்பை மட்டுமே குறிக்கிறது என்ற குறுகிய விளக்கம்.
  rationale: πταίω என்பது இடறுதல் அல்லது தவறிவிழுதல் என்ற உருவகத்தைத் தருகிறது. οὐ μὴ அதன் மறுப்பை மிகவும் வலுப்படுத்துகிறது; ஆனால் எந்த வகையான இடறுதல் என்பது குறித்து உரை கூறுவதைவிட மொழிபெயர்ப்பு அதிகமாக வரையறுக்கக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் அறிவுரைத் தொனியும் காக்கப்பட்டுள்ளன. “தேர்ந்தெடுக்கப்பட்ட நிலை” என்பது பழமையான அல்லது குழப்பமளிக்கக்கூடிய திருச்சபைச் சொற்களைத் தவிர்த்து ἐκλογή என்பதைக் கருத்தளவில் தெளிவாக வழங்குகிறது. வலுவான மறுப்பை “ஒருபோதும் … வே மாட்டீர்கள்” என்ற இயல்பான தமிழ் அமைப்பு வெளிப்படுத்துகிறது.
