review_pass:
  verdict: revise
  source_fidelity: The draft preserves the tent metaphor and correctly renders the Lord's making the matter known to Peter. However, it renders ταχινή chiefly as rapid occurrence ('விரைவில் நிகழும்'), whereas in this predicate it more naturally conveys that the laying aside is near/imminent. The Greek participle εἰδώς is also better retained as a participial connection to the preceding context than recast as the main finite assertion.
  naturalness: ‘என் கூடாரத்தைக் கழற்றிவைப்பது விரைவில் நிகழும்’ is understandable, but ‘கூடாரத்தை அகற்றிவைப்பது நெருங்கியுள்ளது’ is more idiomatic Tamil for the nearness of this event and avoids the slightly awkward image of stripping off a tent. Restoring the participial opening also gives a smoother formal correspondence to the Greek.
  terminology: ‘ஆண்டவர்’ for κύριος and ‘இயேசு மெசியா’ for Ἰησοῦς Χριστός appropriately retain the title sense. ‘கூடாரம்’ properly preserves σκηνώμα as a temporary-dwelling metaphor without prematurely substituting ‘body’ or ‘death.’
  issues:
  - severity: medium
    issue: ταχινή is rendered as ‘விரைவில் நிகழும்.’
    rationale: While ‘soon’ is possible, the Greek construction states that the putting off is near. ‘நெருங்கியுள்ளது’ more directly represents the temporal proximity and is natural modern Tamil.
  - severity: low
    issue: εἰδώς is translated with the finite main-clause form ‘அறிந்திருக்கிறேன்.’
    rationale: The Greek uses a participle that continues the thought from the preceding verse. ‘அறிந்து’ preserves that linkage without imposing an explicit causal relation.
  - severity: low
    issue: ‘கழற்றிவைப்பது’ is less apt for laying aside a tent.
    rationale: In current Tamil, ‘கழற்றுதல்’ most readily evokes removing clothing. ‘அகற்றிவைப்பது’ more naturally carries the intended removal/laying-aside metaphor for a tent.
  revised_text: என் கூடாரத்தை அகற்றிவைப்பது நெருங்கியுள்ளது என்பதை அறிந்து, நம் ஆண்டவராகிய இயேசு மெசியா எனக்குத் தெளிவுபடுத்தியபடியே,[a][b]
