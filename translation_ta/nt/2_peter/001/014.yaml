revisions:
- from: நம் ஆண்டவராகிய இயேசு மெசியா எனக்குத் தெளிவுபடுத்தியபடியே, என் கூடாரத்தைக் கழற்றிவைப்பது விரைவில் நிகழும்[a][b] என்பதை அறிந்திருக்கிறேன்.
  to: என் கூடாரத்தை அகற்றிவைப்பது நெருங்கியுள்ளது என்பதை அறிந்து, நம் ஆண்டவராகிய இயேசு மெசியா எனக்குத் தெளிவுபடுத்தியபடியே,[a][b]
