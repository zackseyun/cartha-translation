source:
  edition: SBLGNT
  text: εἰδὼς ὅτι ταχινή ἐστιν ἡ ἀπόθεσις τοῦ σκηνώματός μου, καθὼς καὶ ὁ κύριος ἡμῶν Ἰησοῦς Χριστὸς ἐδήλωσέν μοι·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/014.yaml
  text: knowing that the putting off of my tent is near[c][b][a], just as our Lord Jesus the Messiah made clear to me.
translation:
  language: ta
  text: என் கூடாரத்தை அகற்றிவைப்பது நெருங்கியுள்ளது என்பதை அறிந்து, நம் ஆண்டவராகிய இயேசு மெசியா எனக்குத் தெளிவுபடுத்தியபடியே,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விரைவில் வரவிருக்கிறது.”
    reason: ταχινή நிகழ்வு நெருங்கியிருப்பதையோ விரைவில் நடைபெறவிருப்பதையோ குறிக்கலாம்.
  - marker: b
    text: “என் கூடாரத்தை அகற்றிவைப்பது” என்பது பேதுரு தன் நெருங்கிய மரணத்தைத் தற்காலிக உறைவிடத்தை அகற்றிவைப்பதற்கு ஒப்பிட்டுக் கூறும் உருவகம்.
    reason: மூலத்தின் கூடார உருவகத்தைத் தக்கவைத்தபடி அதன் குறிப்பு வாசகருக்குத் தெளிவாகிறது.
lexical_decisions:
- source_word: εἰδὼς
  choice: அறிந்திருக்கிறேன்
  rationale: முந்தைய வசனத்துடனான தொடர்பைத் தக்கவைத்தபடி, காரணப் பொருளை வெளிப்படையாகச் சேர்க்காமல் கிரேக்கப் பங்கேற்பு வடிவத்தின் கருத்தை இயல்பான தமிழில் தருகிறது.
- source_word: ταχινή
  choice: விரைவில் நிகழும்
  rationale: நிகழ்வு சீக்கிரம் அல்லது அண்மையில் இருப்பதைக் குறிக்கும் சொல்லை இயல்பான தமிழில் தருகிறது; அதன் காலநெருக்கத்தின் நுண்ணிய இருமையை அடிக்குறிப்பு சுட்டுகிறது.
- source_word: ἀπόθεσις
  choice: கழற்றிவைப்பது
  rationale: களைதல் அல்லது அகற்றிவைத்தல் என்ற உருவகத்தைப் பாதுகாக்கிறது; அதை நேரடியாக ‘மரணம்’ என்று விளக்கிவிடவில்லை.
- source_word: σκηνώματός
  choice: கூடாரம்
  rationale: தற்காலிக உறைவிடமாகிய கூடாரம் என்ற உடல் சார்ந்த உருவகத்தைத் தெளிவாகவும் அணுகத்தக்க வகையிலும் தக்கவைக்கிறது.
- source_word: καθὼς καὶ
  choice: தெளிவுபடுத்தியபடியே
  rationale: ஆண்டவர் முன்பே தெரிவித்ததற்கும் பேதுருவின் அறிவுக்கும் இடையிலான ஒப்புமை அல்லது உறுதிப்படுத்தும் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: இங்கு இயேசுவுக்கான நிலையான மரியாதைத் தலைப்பாகப் பொருந்துகிறது.
- source_word: Ἰησοῦς Χριστός
  choice: இயேசு மெசியா
  rationale: Χριστός என்பதன் ‘அபிஷேகம் பெற்றவர்/மெசியா’ என்ற தலைப்புப் பொருளைத் தக்கவைக்கிறது; அதை வெறும் பெயரின் பகுதியாக மாற்றவில்லை.
- source_word: ἐδήλωσέν
  choice: தெளிவுபடுத்தினார்
  rationale: ஒன்றைத் தெளிவாகத் தெரியப்படுத்துதல் என்ற வினையின் பொருளை மிகைப்படுத்தாமல் நேர்த்தியாக வழங்குகிறது.
- source_word: μοι
  choice: எனக்கு
  rationale: மறைமுகப் பொருளைக் குறிக்கும் வேற்றுமையை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: பேதுருவின் நெருங்கிய மரணத்தைக் குறிக்கும் உருவகம்
  choice: என் கூடாரத்தைக் கழற்றிவைப்பது
  alternative: நான் விரைவில் இறந்துவிடுவேன்
  rationale: மூலத்தில் உடல் ஒரு தற்காலிகக் கூடாரம் எனக் காட்டும் உருவகம் உள்ளது. நேரடியாக ‘மரணம்’ என்று மாற்றாமல் அந்த உருவகத்தையும் அதன் இறையியல் ஆழத்தையும் பாதுகாக்கிறது.
- issue: Ἰησοῦς Χριστός என்பதிலுள்ள Χριστός
  choice: இயேசு மெசியா
  alternative: இயேசு கிறிஸ்து
  rationale: இச்சூழலில் Χριστός ஒரு பொருளுள்ள தலைப்பாக வாசிக்கப்பட முடிவதால், ‘மெசியா’ என்று மொழிபெயர்க்கப்பட்டுள்ளது; பெயர்போன்ற பாரம்பரிய வடிவம் மாற்று வாய்ப்பாக உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் உருவகமும் காலநெருக்கம் குறித்த நுண்ணிய இருமையும் பாதுகாக்கப்பட்டுள்ளன; தமிழின் இயல்புக்காக ‘தெளிவுபடுத்தியபடியே’ என்ற பகுதி முன்வைக்கப்பட்டுள்ளது.
