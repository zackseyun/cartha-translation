id: 2PE.1.9
reference: 2 Peter 1:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ᾧ γὰρ μὴ πάρεστιν ταῦτα, τυφλός ἐστιν μυωπάζων, λήθην λαβὼν τοῦ καθαρισμοῦ τῶν πάλαι αὐτοῦ ⸀ἁμαρτημάτων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/009.yaml
  text: For whoever lacks these things is blind[a], being shortsighted[b], having forgotten the cleansing of his former sins.
translation:
  language: ta
  text: ஏனெனில், இவை[a] இல்லாதவர் குருடர்; அவர் கிட்டப்பார்வையுடையவராய்[b], தமது முந்தைய பாவங்களிலிருந்து தாம் தூய்மையாக்கப்பட்டதை மறந்துவிட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இவை” என்பது முந்தைய வசனங்களில் குறிப்பிடப்பட்ட பண்புகளைக் குறிக்கிறது; அல்லது “இந்தப் பண்புகள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது “அருகிலிருப்பதை மட்டுமே காண்கிறவராய்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ γὰρ μὴ πάρεστιν ταῦτα
  choice: ஏனெனில், இவை இல்லாதவர்
  rationale: இது முன் வசனங்களில் கூறப்பட்ட பண்புகள் ஒருவரிடம் இல்லாத நிலையைக் குறிக்கிறது. பொதுவான ஒருமையை இயல்பான, மரியாதையான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τυφλός ἐστιν
  choice: குருடர்
  rationale: ஆவிக்குரிய பார்வையின்மையைக் குறிக்கும் மூல உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: μυωπάζων
  choice: கிட்டப்பார்வையுடையவராய்
  rationale: அருகிலிருப்பதை மட்டுமே தெளிவாகப் பார்க்கும் குறுகிய பார்வை என்ற உருவகத்தைப் பாதுகாக்கிறது; இது ‘குருடர்’ என்பதுடன் உள்ள மூலத்தின் பதற்றத்தையும் நீக்கவில்லை.
- source_word: λήθην λαβὼν
  choice: மறந்துவிட்டார்
  rationale: சொல்லுக்கு சொல் ‘மறதியைப் பெற்றவர்’ என்ற கிரேக்க மரபுத்தொடரை இயல்பான தமிழில் அதன் பொருளோடு தருகிறது.
- source_word: τοῦ καθαρισμοῦ
  choice: தாம் தூய்மையாக்கப்பட்டதை
  rationale: ‘தூய்மையாக்குதல்’ என்ற ஆன்மிக-ஒழுக்கச் சுத்திகரிப்பு கருத்தை பொதுவாசகருக்குத் தெளிவாகத் தருகிறது.
- source_word: τῶν πάλαι αὐτοῦ ἁμαρτημάτων
  choice: தமது முந்தைய பாவங்களிலிருந்து
  rationale: πάλαι என்பதன் கடந்தகாலக் குறிப்பையும், பாவங்களிலிருந்து கிடைத்த தூய்மையாக்குதலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: αὐτοῦ என்ற ஒருமை ஆண்பால் பிரதிப்பெயரின் பொதுவான குறிப்பு
  choice: தமது… தாம்
  alternative: அவனுடைய… அவன்
  rationale: கிரேக்கத்தின் பிரதிநிதித்துவ ஒருமையைப் பாதுகாத்தபடியே, ஆண்களுக்கு மட்டும் உரியதாகத் தோன்றாத மரியாதையான பொதுமைத் தமிழைப் பயன்படுத்துகிறது.
- issue: ‘குருடர்’ மற்றும் μυωπάζων ஆகிய உருவகங்களின் தொடர்பு
  choice: குருடர்; அவர் கிட்டப்பார்வையுடையவராய்
  alternative: கிட்டப்பார்வையால் குருடரானவர்
  rationale: மூலத்தில் இரு படிமங்களுக்கும் இடையே உள்ள விளக்க அல்லது தீவிரப்படுத்தும் தொடர்பு முழுமையாகத் தீர்மானிக்கப்படவில்லை; ஆகவே அவற்றை ஒன்றாகக் கலக்காமல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் மரியாதையான ஒருமை நடையுடன் மொழிபெயர்க்கப்பட்டது. வாக்கியத்தின் உருவகத் தீவிரமும் ‘குருடர்/கிட்டப்பார்வை’ என்ற மூலப் பதற்றமும் பாதுகாக்கப்பட்டுள்ளன.
