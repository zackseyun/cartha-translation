id: 2PE.1.12
reference: 2 Peter 1:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Διὸ ⸀μελλήσω ἀεὶ ὑμᾶς ὑπομιμνῄσκειν περὶ τούτων, καίπερ εἰδότας καὶ ἐστηριγμένους ἐν τῇ παρούσῃ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/012.yaml
  text: Therefore I will always be ready to remind you about these things[a], even though you know them and have been established in the present truth.
translation:
  language: ta
  text: ஆகையால், நீங்கள் இவற்றை அறிந்தவர்களாகவும், தற்போதுள்ள சத்தியத்தில்[a] உறுதியாக நிலைநிறுத்தப்பட்டவர்களாகவும் இருந்தபோதிலும், இவற்றைக் குறித்து உங்களுக்கு எப்போதும் நினைவூட்டத் தயாராக இருப்பேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இப்போது உங்களிடம் உள்ள சத்தியத்தில்.”
    reason: παρούσῃ என்பது ‘தற்போதுள்ள’ என்றும், சூழலில் ‘இப்போது உங்களிடம் உள்ள’ என்றும் புரிந்துகொள்ளப்படலாம்.
lexical_decisions:
- source_word: Διὸ
  choice: ஆகையால்
  rationale: முந்தைய கருத்துகளிலிருந்து பெறப்படும் முடிவைத் தெளிவாகக் காட்டும் இயல்பான தமிழ்ச் சொல்.
- source_word: μελλήσω ... ἀεὶ
  choice: எப்போதும் ... ஆயத்தமாக இருப்பேன்
  rationale: μέλλω என்பதன் நோக்கம் அல்லது ஆயத்தநிலையையும், ἀεί என்பதன் தொடர்ச்சியான தன்மையையும் இணைத்துப் பாதுகாக்கிறது.
- source_word: ὑπομιμνῄσκειν
  choice: நினைவூட்ட
  rationale: ஒருவர் ஏற்கெனவே அறிந்ததை மீண்டும் நினைவுக்குக் கொண்டுவருதல் என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: περὶ τούτων
  choice: இவற்றைக் குறித்து
  rationale: περί உடன் வரும் இவ்விடத்து உரிய ‘இவற்றைப் பற்றி’ என்ற பொருளைத் தெளிவாகக் கொடுக்கிறது.
- source_word: καίπερ εἰδότας
  choice: அறிந்தவர்களாகவும் ... இருந்தபோதிலும்
  rationale: கிரேக்கத்தின் விட்டுக்கொடுக்கும் பொருளையும், ஏற்கெனவே நிலைத்துள்ள அறிவையும் பாதுகாக்கிறது.
- source_word: ἐστηριγμένους
  choice: உறுதிப்படுத்தப்பட்டவர்களாக
  rationale: முன்னர் செய்யப்பட்ட செயல் விளைவாகத் தொடரும் நிலையை உணர்த்தும் நிறைவுற்ற செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது.
- source_word: ἐν τῇ παρούσῃ ἀληθείᾳ
  choice: தற்போதுள்ள சத்தியத்தில்
  rationale: παρούσῃ என்பதன் ‘தற்போது இருக்கிற’ என்ற நேரடியான பொருளைப் பாதுகாத்து, அது வாசகர்களிடம் உள்ள சத்தியமா அல்லது அவர்களிடையே இருக்கும் சத்தியமா என்பதை பிரதான உரையில் தீர்மானிக்காமல் விடுகிறது.
theological_decisions:
- issue: ‘தற்போதுள்ள சத்தியம்’ என்பதன் பொருள்
  choice: தற்போதுள்ள சத்தியத்தில்
  alternative: இப்போது உங்களிடம் உள்ள சத்தியத்தில்
  rationale: இது ஒரு தனிப்பட்ட காலகட்டத்துக்குரிய தொழில்நுட்பக் கோட்பாட்டுச் சொல்லாக கிரேக்க உரை குறிப்பிடவில்லை. ஆகவே சொற்றொடரின் இயல்பான தெளிவின்மையைப் பாதுகாத்து, மாற்றுப் பொருளை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் நீண்ட வாக்கிய அமைப்பு இயன்றவரை காக்கப்பட்டாலும், தமிழ் வாசிப்புக்கு ஏற்ற சொல் வரிசை அமைக்கப்பட்டுள்ளது.
