id: 2PE.3.15
reference: 2 Peter 3:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ τὴν τοῦ κυρίου ἡμῶν μακροθυμίαν σωτηρίαν ἡγεῖσθε, καθὼς καὶ ὁ ἀγαπητὸς ἡμῶν ἀδελφὸς Παῦλος κατὰ τὴν ⸂δοθεῖσαν αὐτῷ⸃ σοφίαν ἔγραψεν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/015.yaml
  text: And regard the patience of our Lord as salvation[a], just as our beloved brother Paul also wrote to you according to the wisdom given to him[b],
translation:
  language: ta
  text: நம்முடைய ஆண்டவரின் பொறுமையை மீட்பாகக் கருதுங்கள்[a]. அதுபோலவே, நமக்கு அன்பான சகோதரர் பவுலும் தனக்குக் கொடுக்கப்பட்ட ஞானத்தின்படி உங்களுக்கு எழுதினார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பொறுமை’ என்பதற்கு ‘பொறுமையுடன் சகித்தல்’ என்றும் பொருள் கொள்ளலாம். ஆண்டவர் தாமதிப்பது அக்கறையின்மையால் அல்ல; மக்கள் மீட்படைய வேண்டும் என்ற நோக்கத்தினாலேயே என்பது இங்குள்ள கருத்து.
    reason: lexical_alternative
  - marker: b
    text: ‘தனக்குக் கொடுக்கப்பட்ட ஞானம்’ என்பது கடவுள் கொடுத்த ஞானத்தைக் குறிப்பதாக இருக்கலாம்; எனினும், கிரேக்க உரை அதைக் கொடுத்தவர் யார் என்பதை வெளிப்படையாகச் சொல்லவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: μακροθυμίαν
  choice: பொறுமை
  rationale: இச்சொல் தீர்ப்பை உடனே நிறைவேற்றாமல் நீடிய பொறுமையோடு காத்திருப்பதைக் குறிக்கிறது. முந்தைய வசனத்தின் பின்னணியில் ஆண்டவரின் தாமதத்தை இயல்பான நவீன தமிழில் இது தெரிவிக்கிறது.
- source_word: σωτηρίαν
  choice: மீட்பு
  rationale: இறுதிக்காலச் சூழலில், ஆண்டவரின் பொறுமையான தாமதத்தின் மீட்பளிக்கும் நோக்கத்தை இச்சொல் காக்கிறது; வெறும் பொதுவான விடுதலை என்ற பொருளுக்கு இதைச் சுருக்கவில்லை.
- source_word: ἡγεῖσθε
  choice: மீட்பாகக் கருதுங்கள்
  rationale: கட்டளை வடிவிலுள்ள வினை, ஒன்றை மற்றொன்றாக எண்ணும்படி வாசகர்களை அழைக்கிறது. ‘…ஆகக் கருதுங்கள்’ என்பது σωτηρίαν உடனான நேரடித் தொடர்பைத் தெளிவாகத் தருகிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: சூழலில் இயேசுவைக் குறிக்கும் மரியாதைமிக்க பட்டப்பெயரை இயல்பான தமிழ் கிறிஸ்தவ வழக்கில் காக்கிறது.
- source_word: ἀγαπητὸς ... ἀδελφὸς
  choice: அன்பான சகோதரர்
  rationale: பவுலைப் பற்றிய பாசத்தையும் உடன்பிறப்புத் தொடர்பையும் இயல்பான, மரியாதையான தமிழில் வெளிப்படுத்துகிறது.
- source_word: κατὰ τὴν δοθεῖσαν αὐτῷ σοφίαν
  choice: தனக்குக் கொடுக்கப்பட்ட ஞானத்தின்படி
  rationale: κατά என்பதன் ‘இணங்க/அதன்படி’ என்ற பொருளையும், கொடுத்தவர் வெளிப்படையாகக் குறிப்பிடப்படாத δοθεῖσαν என்ற செயப்பாட்டு வடிவையும் காக்கிறது.
- source_word: ἔγραψεν ὑμῖν
  choice: உங்களுக்கு எழுதினார்
  rationale: கிரேக்க இறந்தகால வினையைத் தமிழில் இயல்பான எளிய இறந்தகாலமாக வழங்குகிறது.
- source_word: καθὼς καὶ
  choice: அதுபோலவே ... உம்
  rationale: பேதுருவின் அறிவுரையையும் பவுலின் எழுத்தையும் ஒப்பிட்டு இணைக்கும் பொருளையும் கூடுதல் நுணுக்கத்தையும் காக்கிறது.
theological_decisions:
- issue: ‘தனக்குக் கொடுக்கப்பட்ட ஞானம்’ என்பதில் கொடுத்தவரின் அடையாளம்
  choice: மூலத்தைப் போலவே ‘தனக்குக் கொடுக்கப்பட்ட’ என்ற செயப்பாட்டு வடிவை வைத்தல்
  alternative: ‘கடவுள் தனக்குக் கொடுத்த ஞானத்தின்படி’
  rationale: இங்கு கடவுளே கொடுத்தவர் என்பது வலுவாக உணர்த்தப்பட்டாலும், கிரேக்க உரை அவரை வெளிப்படையாகக் குறிப்பிடவில்லை. ஆகவே உட்கருத்தை விளக்கவுரையாக முதன்மை உரைக்குள் சேர்க்கவில்லை.
- issue: ஆண்டவரின் தாமதத்தின் பொருள்
  choice: ‘பொறுமையை மீட்பாகக் கருதுங்கள்’ என்ற நேரடிக் கூற்றைத் தக்கவைத்தல்
  alternative: ‘பொறுமையை மீட்புக்கான வாய்ப்பாகக் கருதுங்கள்’
  rationale: மூல உரை ‘வாய்ப்பு’ போன்ற விளக்கச் சொல்லைச் சேர்க்காமல் பொறுமையையும் மீட்பையும் நேரடியாக இணைக்கிறது. அந்த இறையியல் அழுத்தமும் நோக்கரீதியான பதற்றமும் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘அதுபோலவே’ மற்றும் ‘…உம்’ ஆகியவை καθὼς καὶ என்பதன் ஒப்பீட்டு மற்றும் கூட்டல் நுணுக்கங்களை இயல்பாகத் தருகின்றன. ‘இரட்சிப்பு’ என்பதற்குப் பதிலாக இன்றைய பொதுத் தமிழில் தெளிவாகப் புரியும் ‘மீட்பு’ பயன்படுத்தப்பட்டது.
