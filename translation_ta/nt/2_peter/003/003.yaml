base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/003.yaml
  text: 'knowing this first: that in the last days scoffers will come with scoffing[a], walking according to their own desires[b],'
translation:
  language: ta
  text: 'முதலாவதாக இதை அறிந்துகொண்டு: கடைசி நாட்களில், ஏளனத்தோடு, தங்கள் சொந்த ஆசைகளின்படி நடக்கிற ஏளனக்காரர்கள் வருவார்கள்[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஏளனத்தோடு ஏளனக்காரர்கள் வருவார்கள்” என்றும் மொழிபெயர்க்கலாம். வலியுறுத்துவதற்காக கிரேக்க மொழியில் ஒரே வேரிலிருந்து வந்த “ஏளனக்காரர்கள்,” “ஏளனம்” என்ற சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
  - marker: b
    text: “ஆசைகள்” என்பதை “இச்சைகள்” என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் பாலியல் ஆசையை மட்டும் அல்லாமல், வலுவான விருப்பங்களைப் பொதுவாகவும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο πρῶτον γινώσκοντες
  choice: முதலாவதாக இதை அறிந்துகொள்ளுங்கள்
  rationale: கிரேக்கத்தில் இது ஒரு பங்கேற்புவினைத் தொடராக இருந்தாலும், தமிழில் முந்தைய சூழலின் அறிவுறுத்தல் வலிமையை இயல்பாக வெளிப்படுத்த கட்டளை வடிவம் பயன்படுத்தப்பட்டது; πρῶτον என்பதன் முன்னுரிமையும் காக்கப்படுகிறது.
- source_word: ἐλεύσονται
  choice: வருவார்கள்
  rationale: ἔρχομαι என்பதன் எதிர்கால வடிவத்திற்கான நேரடியான, இயல்பான தமிழ் இணை.
- source_word: ἐπ’ ἐσχάτων τῶν ἡμερῶν
  choice: கடைசி நாட்களில்
  rationale: காலத்தைக் குறிக்கும் இந்த மரபான இறுதிக்காலச் சொற்றொடரை எந்தக் குறிப்பிட்ட இறுதிக்காலக் கோட்பாட்டிற்கும் உட்படுத்தாமல் காக்கிறது.
- source_word: ἐν ἐμπαιγμονῇ … ἐμπαῖκται
  choice: ஏளனம் செய்துகொண்டு ஏளனக்காரர்கள்
  rationale: ஒரே வேரிலிருந்து வந்த கிரேக்கச் சொற்களின் வலியுறுத்தலைத் தமிழிலும் இயன்றவரை ஒரே சொல்வேரால் வெளிப்படுத்துகிறது.
- source_word: κατὰ τὰς ἰδίας ἐπιθυμίας αὐτῶν
  choice: தங்களுடைய சொந்த ஆசைகளின்படி
  rationale: ἰδίας αὐτῶν தரும் தற்சார்பு வலியுறுத்தலை ‘தங்களுடைய சொந்த’ என்று காக்கிறது; ἐπιθυμίαι என்பதைக் பாலியல் இச்சைக்கு மட்டும் குறுக்காமல் பரந்த ‘ஆசைகள்’ என மொழிபெயர்க்கிறது.
- source_word: πορευόμενοι
  choice: நடப்பார்கள்
  rationale: வாழ்க்கை நடத்தை என்னும் உருவகப் பொருளைக் காக்கும் இயல்பான தமிழ் வேதாகமச் சொல்லாட்சி.
theological_decisions:
- issue: ἐπ’ ἐσχάτων τῶν ἡμερῶν என்ற இறுதிக்காலச் சொற்றொடர்
  choice: கடைசி நாட்களில்
  alternative: நாட்களின் முடிவில்
  rationale: வசனம் கூறுவதைத் தாண்டி ஒரு குறிப்பிட்ட இறுதிக்கால காலக்கட்டத்தையோ சமயப்பிரிவின் திட்டத்தையோ நிர்ணயிக்காமல், சொற்றொடரின் மரபான இறுதிக்காலப் பொருளையும் எச்சரிக்கைத் தன்மையையும் காக்கிறது.
- issue: ἐπιθυμίαι என்பதன் ஒழுக்கவியல் பரப்பு
  choice: ஆசைகள்
  alternative: இச்சைகள்
  rationale: சூழலில் எதிர்மறையான ஒழுக்கப் பொருள் இருந்தாலும், கிரேக்கச் சொல் வலுவான விருப்பங்களைப் பரந்த வகையில் குறிக்கக்கூடும்; அதை பாலியல் பொருளுக்கு மட்டும் குறுக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. கிரேக்கத்தின் இணைவேர் வலியுறுத்தல் ‘ஏளனம் … ஏளனக்காரர்கள்’ எனக் காக்கப்பட்டுள்ளது. ‘நடப்பார்கள்’ என்பது வாழ்க்கை நடத்தையைச் சுட்டும் உருவகமாகப் பயன்படுத்தப்பட்டுள்ளது; வாசகருக்குத் தெளிவாக இருக்க வாக்கியம் இரண்டு பிரதான கூறுகளாக நிறுத்தக்குறியால் பிரிக்கப்பட்டுள்ளது.
