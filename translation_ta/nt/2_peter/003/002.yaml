id: 2PE.3.2
reference: 2 Peter 3:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μνησθῆναι τῶν προειρημένων ῥημάτων ὑπὸ τῶν ἁγίων προφητῶν καὶ τῆς τῶν ἀποστόλων ὑμῶν ἐντολῆς τοῦ κυρίου καὶ σωτῆρος,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/002.yaml
  text: to remember the words spoken beforehand by the holy prophets and the commandment of your apostles from the Lord and Savior[b][a],
translation:
  language: ta
  text: தூய இறைவாக்கினர்கள் முன்பே கூறிய வார்த்தைகளையும்[b], உங்கள் திருத்தூதர்கள் அறிவித்த ஆண்டவரும் மீட்பருமானவரின் கட்டளையையும்[a] நீங்கள் நினைவுகூரும்படி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்டவரும் மீட்பருமானவரிடமிருந்து வந்த உங்கள் திருத்தூதர்களின் கட்டளையையும்.” கிரேக்க உடைமைவேற்றுமைத் தொடர்களை ஒன்றுக்கு மேற்பட்ட இயல்பான முறையில் இணைத்துப் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “ஏற்கெனவே சொல்லப்பட்ட வார்த்தைகளையும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μνησθῆναι
  choice: நீங்கள் நினைவுகூரும்படி
  rationale: இது முந்தைய வசனத்தின் நோக்கத்தைத் தொடரும் இறந்தகாலச் செயல்பாட்டு வடிவமுடைய வினையெச்சம். தமிழில் ‘நினைவுகூரும்படி’ என்பது அந்தத் தொடர்ச்சியையும் நோக்கத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: προειρημένων ῥημάτων
  choice: முன்பே கூறிய வார்த்தைகள்
  rationale: προειρημένων என்பது இங்கு குறிப்பாக முன்னறிவித்தல் என்ற குறுகிய பொருளைவிட, காலத்தில் முன்பே சொல்லப்பட்டதைச் சுட்டுகிறது. ‘வார்த்தைகள்’ என்பது ῥημάτων என்பதன் தெளிவான பொதுமொழி இணை.
- source_word: ὑπὸ τῶν ἁγίων προφητῶν
  choice: தூய இறைவாக்கினர்கள் ... கூறிய
  rationale: ὑπό தொடர் சொல்லப்பட்ட வார்த்தைகளின் செய்பவர்களைக் குறிக்கிறது. ‘தூய இறைவாக்கினர்கள்’ என்பது நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: ἐντολῆς
  choice: கட்டளை
  rationale: ஒருமை பாதுகாக்கப்பட்டுள்ளது; ἐντολή என்பதிலுள்ள அதிகாரப்பூர்வமான ஆணையின் பொருளையும் ‘கட்டளை’ தெளிவாகத் தருகிறது.
- source_word: τῶν ἀποστόλων ὑμῶν
  choice: உங்கள் திருத்தூதர்களின்
  rationale: சொல் வரிசையின்படி ὑμῶν என்பது இயல்பாக ἀποστόλων-ஐச் சார்கிறது. ‘உங்கள்’ என்பது வாசகர்களோடு தொடர்புடைய அல்லது அவர்களிடம் அனுப்பப்பட்ட திருத்தூதர்களைக் குறிக்கிறது; சொந்த உரிமையை வலியுறுத்துவதில்லை.
- source_word: τοῦ κυρίου καὶ σωτῆρος
  choice: ஆண்டவரும் மீட்பருமானவரிடமிருந்து வந்த
  rationale: இந்த உடைமைவேற்றுமைத் தொடர் கட்டளையின் மூலத்தைச் சுட்டுவதாக முதன்மை உரையில் எடுத்துக்கொள்ளப்பட்டுள்ளது. கிரேக்கத்தில் இல்லாத ‘நமது’ சேர்க்கப்படவில்லை.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: κύριος என்பதன் அதிகாரத்தையும் புதிய ஏற்பாட்டுத் தலைப்புப் பயன்பாட்டையும் இயல்பான நவீனத் தமிழில் பாதுகாக்கிறது.
- source_word: σωτῆρος
  choice: மீட்பர்
  rationale: கிறிஸ்துவைக் குறிக்கும் இச்சூழலில் σωτήρ என்பதற்கான தெளிவான, கண்ணியமான நவீனத் தமிழ் இணை.
theological_decisions:
- issue: τῶν ἀποστόλων ὑμῶν என்பதில் ὑμῶν எதனுடன் இணைகிறது
  choice: ‘உங்கள்’ என்பது ‘திருத்தூதர்கள்’ என்பதைக் குறிக்கிறது
  alternative: ‘திருத்தூதர்களால் உங்களுக்குக் கொடுக்கப்பட்ட கட்டளை’
  rationale: கிரேக்கச் சொல் வரிசை ὑμῶν என்பதை ἀποστόλων உடன் மிக இயல்பாக இணைக்கிறது. இது வாசகர்களுக்கு அறியப்பட்ட அல்லது அவர்களிடம் அனுப்பப்பட்ட திருத்தூதர்களைக் குறிக்கிறது.
- issue: τοῦ κυρίου καὶ σωτῆρος என்பதன் தொடரியல் தொடர்பு
  choice: கட்டளை ஆண்டவரும் மீட்பருமானவரிடமிருந்து வந்தது; அது திருத்தூதர்களால் தெரிவிக்கப்பட்டது
  alternative: திருத்தூதர்கள் ஆண்டவரும் மீட்பருமானவருக்குரியவர்கள் என்று இத்தொடர் விவரிக்கிறது
  rationale: ἐντολῆς உடனான தொடர்பு பொருளில் மிகவும் ஒத்திசைவாக உள்ளது. ஆயினும் கிரேக்க உடைமைவேற்றுமைத் தொடர்களின் அமைப்பு ஒன்றுக்கு மேற்பட்ட இயல்பான வெளிப்பாடுகளை அனுமதிப்பதால் மாற்று அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தூய இறைவாக்கினர்கள்,’ ‘திருத்தூதர்கள்,’ ‘ஆண்டவர்,’ ‘மீட்பர்’ ஆகியவை தெளிவான சமயச் சொற்களாகத் தேர்ந்தெடுக்கப்பட்டன. வசனம் முந்தைய வசனத்தின் வாக்கியத்தைத் தொடர்வதால், μνησθῆναι என்பதற்கு ‘நினைவுகூரும்படி’ என்ற தொடர்ச்சி வடிவம் வைக்கப்பட்டது.
