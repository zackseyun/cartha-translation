id: 2PE.3.17
reference: 2 Peter 3:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὑμεῖς οὖν, ἀγαπητοί, προγινώσκοντες φυλάσσεσθε ἵνα μὴ τῇ τῶν ἀθέσμων πλάνῃ συναπαχθέντες ἐκπέσητε τοῦ ἰδίου στηριγμοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/017.yaml
  text: Therefore[a], you, beloved, knowing this beforehand, guard yourselves so that, being carried away by the error of the lawless[b], you may not fall from your own stability.
translation:
  language: ta
  text: ஆகவே, அன்புக்குரியவர்களே, இதை முன்கூட்டியே அறிந்திருக்கிற நீங்கள், நெறியற்றவர்களின் தவறால் அவர்களோடு இழுத்துச் செல்லப்பட்டு, உங்கள் சொந்த உறுதியான நிலையிலிருந்து[a] விழுந்துவிடாதபடி[b] உங்களைக் காத்துக்கொள்ளுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உங்கள் சொந்த நிலைத்தன்மையிலிருந்து’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் στηριγμός உறுதி, நிலைத்தன்மை அல்லது உறுதியான நிலையைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘விழுந்துவிடுதல்’ என்பதை ‘விலகிவிடுதல்’ என்றும் மொழிபெயர்க்கலாம். ஆனால் கிரேக்கச் சொல் ஒரு குறிப்பிட்ட இறையியல் விளக்கத்தை கட்டாயப்படுத்தாததால், முதன்மை உரை நடுநிலையான ‘விழுந்துவிடுதல்’ என்பதைக் பயன்படுத்துகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑμεῖς οὖν
  choice: ஆகவே, ... நீங்கள்
  rationale: οὖν முந்தைய எச்சரிக்கையிலிருந்து வரும் முடிவைச் சுட்டுகிறது; வெளிப்படையான ὑμεῖς வலியுறுத்தும் அழைப்பாக இருப்பதால் ‘நீங்கள்’ தக்கவைக்கப்பட்டது.
- source_word: ἀγαπητοί
  choice: அன்புக்குரியவர்களே
  rationale: அன்பும் கடிதநடையின் கண்ணியமும் கொண்ட அழைப்புமுறையை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: προγινώσκοντες
  choice: இதை முன்கூட்டியே அறிந்திருக்கிற
  rationale: முன்னதாக அறிந்திருத்தல் அல்லது எச்சரிக்கப்பட்டிருத்தல் என்ற காலப் பொருளைப் பாதுகாக்கிறது; சூழலிலிருந்து புரியும் சுட்டுப்பொருளுக்காக ‘இதை’ சேர்க்கப்பட்டது.
- source_word: φυλάσσεσθε
  choice: உங்களைக் காத்துக்கொள்ளுங்கள்
  rationale: நடுநிலை வினையின் தற்சார்புப் பொருளையும் தொடர்ந்து விழிப்புடன் இருக்க வேண்டிய கட்டளையையும் தெளிவாகத் தருகிறது.
- source_word: τῇ τῶν ἀθέσμων πλάνῃ
  choice: நெறியற்றவர்களின் தவறால்
  rationale: πλάνη இங்கு தவறு அல்லது வழுவைக் குறிக்கிறது; ἀθέσμοι ஏற்றுக்கொள்ளப்பட்ட ஒழுக்க நெறியைப் பொருட்படுத்தாதவர்களைக் குறிப்பதால் ‘நெறியற்றவர்கள்’ என மொழிபெயர்க்கப்பட்டது. வேற்றுமை உருபு இழுத்துச் செல்லப்படும் காரணம் அல்லது கருவியாக எடுத்துக்கொள்ளப்பட்டது.
- source_word: συναπαχθέντες
  choice: அவர்களோடு இழுத்துச் செல்லப்பட்டு
  rationale: செயப்பாட்டு பொருளையும் σύν- என்ற முன்னொட்டிலுள்ள ‘மற்றவர்களோடு சேர்ந்து’ என்ற நுண்பொருளையும் வெளிப்படுத்துகிறது.
- source_word: ἐκπέσητε
  choice: விழுந்துவிடாதபடி
  rationale: ‘விழுதல்’ என்ற மூல உருவகத்தைப் பாதுகாக்கிறது; இரட்சிப்பை இழத்தல் அல்லது விசுவாசத்தை முற்றிலும் கைவிடுதல் என்று தேவையின்றி இறையியல் சார்பாகக் குறிப்பாக்கவில்லை.
- source_word: τοῦ ἰδίου στηριγμοῦ
  choice: உங்களுக்கே உரிய உறுதியான நிலையிலிருந்து
  rationale: στηριγμός குறிக்கும் உறுதி, நிலைத்தன்மை, உறுதியான நிலை ஆகிய பொருள்களை இயல்பான தமிழில் தருகிறது; ἰδίου என்பதன் வலியுறுத்தலை ‘உங்களுக்கே உரிய’ எனப் பாதுகாக்கிறது.
theological_decisions:
- issue: ἐκπέσητε என்பது இரட்சிப்பு இழப்பையோ விசுவாசத் துறப்பையோ கட்டாயமாகக் குறிக்கிறதா?
  choice: ‘உங்களுக்கே உரிய உறுதியான நிலையிலிருந்து விழுந்துவிடாதபடி’ என்று கோட்பாட்டுச் சிறப்பாக்கமின்றி மொழிபெயர்க்கப்பட்டது.
  alternative: ‘விசுவாசத்தின் பாதுகாப்பான நிலையிலிருந்து விலகிவிடாதபடி’ அல்லது ‘உங்கள் உறுதிப்பாட்டை இழந்துவிடாதபடி.’
  rationale: கிரேக்க வாசகம் ஒருவர் தமது உறுதியான நிலையிலிருந்து விழக்கூடிய அபாயத்தை வலுவாக எச்சரிக்கிறது; ஆனால் அது இரட்சிப்பு இழப்பு குறித்த ஒரு குறிப்பிட்ட கோட்பாட்டு முடிவைத் தானாக நிர்ணயிக்கவில்லை. எனவே எச்சரிக்கையின் தீவிரமும் இறையியல் பதற்றமும் இரண்டும் பாதுகாக்கப்பட்டன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கடிதநடை பயன்படுத்தப்பட்டது. கிரேக்க வாக்கியத்தின் நீண்ட எச்சரிக்கை அமைப்பு தமிழில் இயல்பாக ஒழுங்குபடுத்தப்பட்டாலும், காரணவியல் தொடர்பும் செயப்பாட்டு எச்சரிக்கையும் இறுதி கட்டளையும் பாதுகாக்கப்பட்டன.
