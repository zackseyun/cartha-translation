id: 2PE.3.18
reference: 2 Peter 3:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: αὐξάνετε δὲ ἐν χάριτι καὶ γνώσει τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ. αὐτῷ ἡ δόξα καὶ νῦν καὶ εἰς ἡμέραν αἰῶνος. ⸀ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/018.yaml
  text: But grow in the grace and knowledge of our Lord and Savior Jesus the Messiah[a]. To him be the glory both now and to the day of eternity[b]. Amen.
translation:
  language: ta
  text: ஆனால், நம்முடைய ஆண்டவரும் மீட்பருமான இயேசு மேசியாவின்[a] அருளிலும், அவரை அறியும் அறிவிலும் வளருங்கள். அவருக்கே இப்பொழுதும் நித்தியத்தின் நாள்வரையிலும்[b] மகிமை உண்டாவதாக. ஆமென்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, பாரம்பரிய தமிழ் கிறிஸ்தவப் பயன்பாட்டின்படி, ‘இயேசு கிறிஸ்து.’
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘இப்பொழுதும் என்றென்றும்.’ கிரேக்கச் சொற்றொடரை இன்னும் நேரடியாக மொழிபெயர்த்தால், ‘இப்பொழுதும் நித்தியத்தின் நாள்வரையிலும்’ என்று வரும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐξάνετε
  choice: வளருங்கள்
  rationale: நிகழ்காலச் செயப்பாட்டு ஏவல், பன்மை. தொடர்ந்து வளர வேண்டிய கட்டளையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய எச்சரிக்கைகளுக்கு மாறாக வரும் மென்மையான எதிர்மறைத் தொடர்பைத் தக்கவைக்கிறது.
- source_word: ἐν χάριτι καὶ γνώσει
  choice: அருளிலும், அவரை அறியும் அறிவிலும்
  rationale: ἐν இரு பெயர்ச்சொற்களையும் ஆள்கிறது. χάρις என்பதற்கு வழக்கமான ‘அருள்’ பயன்படுத்தப்பட்டுள்ளது; γνῶσις வெறும் தகவலை அல்ல, இயேசுவை அறிதலைக் குறிக்கும் என்பதைக் தமிழில் தெளிவாகவும் இயல்பாகவும் கூறுகிறது.
- source_word: τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ
  choice: நம்முடைய ஆண்டவரும் மீட்பருமான இயேசு மேசியாவின்
  rationale: ஒரே குறிப்புச் சுட்டு κύριος மற்றும் σωτήρ ஆகிய இரு பட்டங்களையும் ஒரே நபருடன் இணைக்கிறது. Χριστός பட்டமாக இருப்பதால் ‘மேசியா’ என்று பொருள் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: αὐτῷ ἡ δόξα
  choice: அவருக்கே ... மகிமை உண்டாவதாக
  rationale: வினைச்சொல் வெளிப்படையாக இல்லாத கிரேக்கப் புகழுரையை மரியாதையான, இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘-க்கே’ அர்ப்பணிப்பின் வலியுறுத்தலைக் காட்டுகிறது.
- source_word: καὶ νῦν καὶ εἰς ἡμέραν αἰῶνος
  choice: இப்பொழுதும் நித்தியத்தின் நாள்வரையிலும்
  rationale: அசாதாரணமான மூலச் சொற்றொடரில் உள்ள ‘நாள்’ என்பதையும் ‘நித்தியம்’ சார்ந்த காலவிரிவையும் சுருக்காமல் தக்கவைக்கிறது.
- source_word: ἀμήν
  choice: ஆமென்
  rationale: தமிழ் கிறிஸ்தவப் பயன்பாட்டில் நிலைபெற்ற ஒலிபெயர்ப்பு.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ என்பதில் Χριστοῦ-வின் மொழிபெயர்ப்பு
  choice: இயேசு மேசியா
  alternative: இயேசு கிறிஸ்து
  rationale: Χριστός இங்கு ஒரு பட்டத்தின் பொருளைத் தாங்குவதால் ‘மேசியா’ என்று மொழிபெயர்க்கப்பட்டுள்ளது; பாரம்பரிய ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- issue: ‘நம்முடைய ஆண்டவரும் மீட்பரும்’ என்பதன் குறிப்பு
  choice: இரு பட்டங்களும் ஒரே நபரான இயேசு மேசியாவைக் குறிக்கின்றன
  alternative: இரு பட்டங்களின் தொடர்பைத் தமிழில் தெளிவுபடுத்தாமல் விடுதல்
  rationale: ஒரே குறிப்புச் சுட்டின் கீழ் κύριος, σωτήρ இரண்டும் வருவதால் ஒரே நபரைக் குறிப்பது கிரேக்க இலக்கணத்தின் இயல்பான வாசிப்பு.
- issue: γνώσει τοῦ κυρίου என்பதன் உறவு
  choice: அவரை அறியும் அறிவு
  alternative: அவருடைய அறிவு
  rationale: சூழலில் விசுவாசிகள் ஆண்டவரை அறிதலில் வளர வேண்டும் என்பதே இயல்பான பொருள். ‘அவருடைய அறிவு’ என்பது அவர் கொண்டிருக்கும் அறிவு எனத் தவறாகப் புரியக்கூடியதால் தவிர்க்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க வேதாகம நடையைப் பயன்படுத்துகிறது. அரிதான காலச் சொற்றொடர் மூலத்தின் தனித்தன்மையைப் பாதுகாக்கிறது; அதன் இயல்பான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
