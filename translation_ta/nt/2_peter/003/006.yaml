  text: δι’ ὧν ὁ τότε κόσμος ὕδατι κατακλυσθεὶς ἀπώλετο·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/006.yaml
  text: through which the world of that time[a], having been flooded with water[b], perished.
translation:
  language: ta
  text: அவற்றின் வழியாக[a] அப்போதைய உலகம் தண்ணீரால் மூழ்கடிக்கப்பட்டு அழிந்துபோனது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றால்.” இங்குள்ள “அவை” பன்மையில் உள்ளது; முந்தைய வசனத்தில் குறிப்பிடப்பட்ட வழிமுறைகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அழிக்கப்பட்டது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ὧν
  choice: அவற்றின் மூலமாக
  rationale: διά என்பதுடன் வரும் பன்மை உறவுப்பெயர், முந்தைய வசனத்தில் குறிப்பிடப்பட்ட வழிமுறைகளைக் குறிக்கிறது. அதன் பன்மையையும், அது துல்லியமாக எதைக் குறிக்கிறது என்ற திறந்த நிலையையும் இந்த மொழிபெயர்ப்பு காக்கிறது.
- source_word: ὁ τότε κόσμος
  choice: அப்போதைய உலகம்
  rationale: τότε காட்டும் கடந்தகாலத்துக்கும் தற்போதைய உலகத்துக்கும் இடையிலான வேறுபாட்டை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; κόσμος என்பதை பூமிக்கோளம் என்று மட்டும் குறுக்கவில்லை.
- source_word: ὕδατι
  choice: தண்ணீரால்
  rationale: இங்குள்ள வேற்றுமை உருபு வெள்ளத்தில் மூழ்கடித்த கருவி அல்லது வழிமுறையைச் சுட்டுகிறது. ‘தண்ணீரால்’ என்பது இதைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: κατακλυσθεὶς
  choice: வெள்ளத்தில் மூழ்கி
  rationale: இறந்தகாலச் செயப்பாட்டு எச்சவினையின் பொருளை இயல்பான தமிழில் தருகிறது; பேரழிவைச் சுட்டினாலும், மூலத்தில் இல்லாத கூடுதல் விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: ἀπώλετο
  choice: அழிந்துபோனது
  rationale: இடை/தன்னிலைப் பொருளான ‘அழிந்தது, கேடடைந்தது’ என்பதைக் காக்கிறது; முற்றிலும் இல்லாமலாக்கப்பட்டது என்ற தேவையற்ற கருத்தைத் திணிக்கவில்லை.
theological_decisions:
- issue: வெள்ளத் தீர்ப்பின் இயல்பு
  choice: அழிந்துபோனது
  alternative: அழிக்கப்பட்டது
  rationale: கிரேக்க வினை பேரழிவையும் தீர்ப்பையும் தெரிவிக்கிறது; ஆனால் முழுமையான இல்லாமையாக்கத்தைக் கட்டாயப்படுத்தாது. ‘அழிந்துபோனது’ அந்தக் கடுமையை வைத்துக்கொண்டு உரையின் எல்லையை மீறாமல் உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘அவற்றின் மூலமாக’ என்ற சொற்றொடர் மூலத்தின் பன்மை மற்றும் தெளிவுபடுத்தப்படாத முன்னிலையைப் பாதுகாக்கிறது.
