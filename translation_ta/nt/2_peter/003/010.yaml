source:
  edition: SBLGNT
  text: ἥξει δὲ ⸀ἡμέρα κυρίου ὡς ⸀κλέπτης, ἐν ᾗ οἱ οὐρανοὶ ῥοιζηδὸν παρελεύσονται, στοιχεῖα δὲ καυσούμενα ⸀λυθήσεται, καὶ γῆ καὶ τὰ ἐν αὐτῇ ἔργα ⸀εὑρεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/010.yaml
  text: But the day of the Lord will come like a thief[a], in which the heavens will pass away with a roar, and the elements, being burned, will be dissolved[c][b], and the earth and the works in it will be found.
translation:
  language: ta
  text: ஆனால் ஆண்டவருடைய நாள் திருடனைப்போல் வரும். அந்த நாளில் வானங்கள் பெரும் ஓசையுடன் கடந்துபோகும்; அடிப்படைக் கூறுகள்[a] எரிக்கப்படும்போது கலைந்துபோகும்; பூமியும் அதிலுள்ள செயல்களும் காணப்படும்[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அடிப்படைக் கூறுகள்’ (στοιχεῖα) என்பதற்கு ‘வானப் பொருட்கள்’ என்றும் மொழிபெயர்க்கலாம்; இச்சூழலில் அந்தச் சொல் அண்டத்தின் கூறுகளை இன்னும் குறிப்பாகக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘காணப்படும்’ என்பதைச் சிலர் ‘வெளிப்படுத்தப்படும்’ அல்லது ‘வெளிப்படையாகத் தெரியவரும்’ என்று புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: c
    text: பல கையெழுத்துப் பிரதிகளில் ‘காணப்படும்’ என்பதற்குப் பதிலாக ‘எரித்தழிக்கப்படும்’ என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: ἥξει
  choice: வரும்
  rationale: ἥκω என்பதன் எதிர்கால வடிவம் இங்கு ‘வரும்’ என்று இயல்பாகப் பொருள்படுகிறது; ஆண்டவருடைய நாளின் வருகையை நேரடியாகச் சொல்கிறது.
- source_word: ἡμέρα κυρίου
  choice: ஆண்டவருடைய நாள்
  rationale: இது வாராந்திர வழிபாட்டு நாளைக் குறிக்காமல், தீர்க்கதரிசன மற்றும் இறுதிக்காலச் சூழலில் வரும் நிலையான சொற்றொடர்.
- source_word: κλέπτης
  choice: திருடன்
  rationale: எதிர்பாராத வருகையை உணர்த்தும் ஒப்புமையைத் தமிழில் இயல்பாகக் காக்கிறது.
- source_word: ἐν ᾗ
  choice: அந்த நாளில்
  rationale: முன்னர் குறிப்பிடப்பட்ட ஆண்டவருடைய நாளோடு அடுத்து வரும் நிகழ்வுகளைத் தெளிவாக இணைக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: οἱ οὐρανοὶ
  choice: வானங்கள்
  rationale: மூலமொழியின் பன்மையைப் பேணி, பிரபஞ்ச அளவிலான சூழலுக்கு ஏற்றதாக உள்ளது.
- source_word: ῥοιζηδόν
  choice: பேரிரைச்சலுடன்
  rationale: வேகமாகப் பாயும் அல்லது உறுமும் பெரும் ஓசையை உணர்த்தும் வினையடையின் செறிவை இயல்பான தமிழில் தருகிறது.
- source_word: παρελεύσονται
  choice: மறைந்துபோகும்
  rationale: இறுதிக்காலச் சூழலில் ‘கடந்துபோதல்/ஒழிந்துபோதல்’ என்ற பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: στοιχεῖα
  choice: மூலக்கூறுகள்
  rationale: இச்சூழலில் பிரபஞ்சத்தின் அடிப்படைக் கூறுகள் அல்லது வானுலகப் பொருட்கள் எனப் பொருள்படக்கூடிய சொல்லை மிகையாகக் குறிப்பாக்காமல் மொழிபெயர்க்கிறது.
- source_word: καυσούμενα
  choice: எரிந்து
  rationale: எரியும் செயற்பாடு சிதைவோடு சேர்ந்தே நிகழ்வதைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது; வெளிப்படையான செய்பவரைச் சேர்ப்பதில்லை.
- source_word: λυθήσεται
  choice: சிதைந்துபோகும்
  rationale: λύω இங்கு கட்டவிழ்தல், பிரிந்துபோதல் அல்லது கரைந்தழிதல் என்ற படிமத்தைக் கொண்டுள்ளது; ‘அழிக்கப்படும்’ என்பதைக் காட்டிலும் துல்லியமாக அதைக் காக்கிறது.
- source_word: γῆ
  choice: பூமி
  rationale: வானங்களும் மூலக்கூறுகளும் குறிப்பிடப்படும் பிரபஞ்சச் சூழலில், உள்ளூரான ‘நிலம்’ என்பதைக் காட்டிலும் ‘பூமி’ பொருத்தமானது.
- source_word: τὰ ἐν αὐτῇ ἔργα
  choice: அதிலுள்ள செயல்கள்
  rationale: பூமியில் உள்ள அல்லது அதில் செய்யப்பட்ட செயல்கள்/வேலைகள் என்ற பரப்பை முற்றிலும் குறுக்காமல், மூலச்சொல்லுக்கு நெருக்கமாக உள்ளது.
- source_word: εὑρεθήσεται
  choice: காணப்படும்
  rationale: சிக்கலான மூலவாசகத்தின் அடிப்படைப் பொருளான ‘கண்டறியப்படும்/காணப்படும்’ என்பதைத் தக்கவைத்து, ‘வெளிப்படுத்தப்படும்’ என்று விளக்கமாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: καὶ γῆ καὶ τὰ ἐν αὐτῇ ἔργα εὑρεθήσεται என்ற இறுதிக் கூற்றின் பொருள்
  choice: ‘பூமியும் அதிலுள்ள செயல்களும் காணப்படும்’ என்ற கடினமான வாசகத்தை முதன்மை உரையில் வைத்தல்
  alternative: ‘வெளிப்படுத்தப்படும்’ அல்லது ‘எரித்தழிக்கப்படும்’
  rationale: கொடுக்கப்பட்ட SBLGNT உரையில் εὑρεθήσεται உள்ளது; அதன் நேரடிப் பொருள் ‘காணப்படும்.’ உரை மற்றும் பொருள் இரண்டிலும் விவாதம் இருப்பதால், இறையியல் முடிவை மொழிபெயர்ப்புக்குள் புகுத்தாமல் மாற்றுகளை அடிக்குறிப்பில் தருவது வெளிப்படைத்தன்மையைக் காக்கிறது.
- issue: στοιχεῖα என்பதன் குறிப்பு
  choice: ‘மூலக்கூறுகள்’ என்று பரந்த பொருளில் மொழிபெயர்த்தல்
  alternative: ‘வானுலகப் பொருட்கள்’
  rationale: இச்சொல் பிரபஞ்சத்தின் அடிப்படைக் கூறுகளையோ வானுலகப் பொருட்களையோ குறிக்கலாம். வசனம் இதைத் தெளிவாகத் தீர்மானிக்காததால், முதன்மை உரை குறிப்பிட்ட ஒரு விளக்கத்தைத் திணிக்கவில்லை.
translation_notes:
  register: நவீன தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘ஆண்டவருடைய நாள்’ என்ற இறுதிக்காலச் சொற்றொடர் தெளிவாக வைக்கப்பட்டுள்ளது. மூலத்தின் கடினமான இறுதிக் கூற்றும் στοιχεῖα என்பதிலுள்ள பொருள் தெளிவின்மையும் தீர்த்துவைக்கப்படாமல், அடிக்குறிப்புகள் மூலம் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன.
