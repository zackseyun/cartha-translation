source:
  edition: SBLGNT
  text: Ταύτην ἤδη, ἀγαπητοί, δευτέραν ὑμῖν γράφω ἐπιστολήν, ἐν αἷς διεγείρω ὑμῶν ἐν ὑπομνήσει τὴν εἰλικρινῆ διάνοιαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/001.yaml
  text: Beloved[a], this is now the second letter I am writing to you; in both of them I am stirring up your sincere mind by way of reminder[b],
translation:
  language: ta
  text: அன்புக்குரியவர்களே, உங்களுக்கு நான் இப்போது எழுதும் இது இரண்டாவது கடிதம். இந்த இரு கடிதங்களிலும்[a], நினைவூட்டுவதன் மூலம் உங்கள் கபடமற்ற சிந்தனையை[b] தூண்டி எழுப்புகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவற்றில்” என்றும் மொழிபெயர்க்கலாம்; கிரேக்கத்தில் இச்சொல் பன்மையில் உள்ளது; ஆகவே அது மிக இயல்பாக இரண்டு கடிதங்களையும் குறிக்கிறது.
    reason: alternative_reading
  - marker: b
    text: அல்லது “உங்கள் தூய்மையான சிந்தனையை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπητοί
  choice: அன்புக்குரியவர்களே
  rationale: அன்பும் கடிதத்தின் அழைப்புத் தொனியும் வெளிப்படும் மரியாதையான பன்மை விளி வடிவம்.
- source_word: Ταύτην ἤδη ... δευτέραν ... ἐπιστολήν
  choice: இப்போது நான் உங்களுக்கு எழுதுவது இரண்டாவது கடிதம்
  rationale: கிரேக்கச் சொல் வரிசையை இயல்பான தமிழில் அமைத்து, தற்போதைய கடிதம் இரண்டாவது என்பதையும் ἤδη தரும் ‘இப்போது’ என்ற காலச் சுட்டையும் காக்கிறது.
- source_word: γράφω
  choice: நான் ... எழுதுவது
  rationale: கடிதத்தை எழுதிக்கொண்டிருக்கும் நிகழ்காலச் சூழலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐν αἷς
  choice: இவ்விரண்டிலும்
  rationale: பெண்பால் பன்மை உறவுப்பெயர் முன் குறிப்பிடப்பட்ட இரண்டு கடிதங்களையும் இயல்பாகச் சுட்டுகிறது.
- source_word: διεγείρω
  choice: விழிப்பூட்டுகிறேன்
  rationale: கவனத்தையும் சிந்தனையையும் செயல்படும்படி எழுப்புதல் என்ற உருவகப் பொருளை இயல்பாகக் கொடுக்கிறது.
- source_word: ἐν ὑπομνήσει
  choice: நினைவூட்டுவதன் மூலம்
  rationale: நினைவூட்டுதல் கருவி அல்லது வழிமுறையாக இருப்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: εἰλικρινῆ διάνοιαν
  choice: நேர்மையான மனதை
  rationale: διάνοια என்பதன் மனம்/சிந்தனைப் பொருளையும் εἰλικρινής என்பதன் கபடமற்ற, தூய தன்மையையும் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ὑμῶν
  choice: உங்கள்
  rationale: διάνοιαν என்பதுடன் தொடர்புடைய உடைமைப் பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: ἐν αἷς என்ற பன்மை உறவுப்பெயர் எதைக் குறிக்கிறது?
  choice: பேதுரு வாசகர்களுக்கு எழுதிய இரண்டு கடிதங்களையும் குறிக்கிறது.
  alternative: வழக்கத்திற்கு மாறான பன்மைப் பயன்பாட்டில் தற்போதைய கடிதத்தை மட்டும் குறிக்கிறது.
  rationale: இரண்டாவது கடிதம் என்று உடனே கூறப்பட்டிருப்பதால், பன்மை உறவுப்பெயர் இரண்டு கடிதங்களையும் சுட்டுவதே இலக்கணப்படி மிக இயல்பான வாசிப்பு; இதற்கு மேலான கோட்பாட்டுக் கருத்து எதுவும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் கடிதத்திற்குரிய கண்ணியத்தையும் அன்பான அழைப்புத் தொனியையும் காக்கும் நடை பயன்படுத்தப்பட்டது.
