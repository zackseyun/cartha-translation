reference: 2 Peter 3:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐ βραδύνει ⸀κύριος τῆς ἐπαγγελίας, ὥς τινες βραδύτητα ἡγοῦνται, ἀλλὰ μακροθυμεῖ εἰς ⸀ὑμᾶς, μὴ βουλόμενός τινας ἀπολέσθαι ἀλλὰ πάντας εἰς μετάνοιαν χωρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/009.yaml
  text: The Lord is not slow concerning the promise[a], as some consider slowness, but is patient toward you[c][b], not wanting any to perish but all to come to repentance.
translation:
  language: ta
  text: வாக்குறுதியைக் குறித்து ஆண்டவர் தாமதிப்பதில்லை; சிலர் கருதுகிறபடி அவர் தாமதிப்பதில்லை. மாறாக, அவர் உங்களிடம்[a] பொறுமை காட்டுகிறார்; ஒருவரும் அழிந்துபோக வேண்டும் என்று விரும்பாமல், எல்லாரும் மனந்திரும்புதலுக்கு வர வேண்டும் என்று விரும்புகிறார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உங்களிடம்’ என்பதற்கு ‘உங்களோடு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘ஒருவரும்’, ‘எல்லாரும்’ என்பவற்றின் வரம்பை கிரேக்க உரை கூறியபடியே மொழிபெயர்ப்பு விட்டுள்ளது. பேதுரு தன் வாசகர்களையே குறிப்பாகக் குறிக்கிறாரா, அல்லது மனிதர்களை இன்னும் விரிவாகக் குறிக்கிறாரா என்பதில் விளக்கவுரையாளர்கள் வேறுபடுகின்றனர்.
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: தெய்வீகப் பட்டமாக வரும் κύριος என்பதற்கான இயல்பான, மரியாதைமிக்க தமிழ் வடிவம்.
- source_word: οὐ βραδύνει ... τῆς ἐπαγγελίας
  choice: வாக்குறுதியைக் குறித்து ... தாமதிப்பதில்லை
  rationale: βραδύνει என்பதன் தாமதம்/மெதுவாயிருத்தல் என்ற கருத்தையும், τῆς ἐπαγγελίας உடனான தொடர்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; வாக்குறுதியை நிறைவேற்றுதல் என்று வெளிப்படையாக விரித்துரைக்கவில்லை.
- source_word: ὥς τινες βραδύτητα ἡγοῦνται
  choice: சிலர் தாமதம் என்று கருதுவதுபோல்
  rationale: ἡγέομαι என்பதன் ‘கருது’ என்ற பொருளையும், βραδύνει–βραδύτητα என்ற சொல் மீளுருவாக்கத்தையும் ‘தாமதம்’ மூலம் காக்கிறது.
- source_word: μακροθυμεῖ
  choice: பொறுமையாயிருக்கிறார்
  rationale: நீண்டகாலப் பொறுமையையும் தன்னடக்கத்தையும் குறிக்கும் வினையின் கருத்தை, தற்போதைய தமிழில் தெளிவாகத் தருகிறது.
- source_word: εἰς ὑμᾶς
  choice: உங்களிடம்
  rationale: நபர்களை நோக்கிய மனப்பாங்கைக் காட்டும் εἰς என்பதற்கு நெருக்கமான இயல்பான வடிவம்; ‘உங்களுக்காக’ என நோக்கத்தைச் சேர்ப்பதில்லை.
- source_word: μὴ βουλόμενός
  choice: வேண்டும் என்று விரும்பி
  rationale: βούλομαι-இன் விருப்பம்/சித்தம் சார்ந்த வலிமையை காக்கிறது; பிற்கால இறையியல் வகைப்பாடுகளைப் புகுத்தவில்லை.
- source_word: τινας ἀπολέσθαι
  choice: ஒருவரும் அழிந்துபோகாமல்
  rationale: τινας என்பதை எதிர்மறை அமைப்பில் இயல்பான ‘ஒருவரும் ... இல்லாமல்’ எனவும், ἀπολέσθαι என்பதை வெளிப்புறக் காரணத்தை வலியுறுத்தாத ‘அழிந்துபோக’ எனவும் வழங்குகிறது.
- source_word: πάντας
  choice: எல்லாரும்
  rationale: ‘ஒருவரும்’ என்பதற்கு எதிரிணையாக கிரேக்கத்தின் சுருக்கமான பரப்பை அப்படியே காக்கிறது; குறிப்பிட்ட குழுவாகக் குறுக்கவோ மனிதகுலம் முழுவதென விரிக்கவோ இல்லை.
- source_word: εἰς μετάνοιαν χωρῆσαι
  choice: மனந்திரும்புதலுக்கு வர
  rationale: χωρέω இங்கு ஒரு நிலையை அடைதல்/அதற்குள் வருதல் என்ற பொருளில் உள்ளது; μετάνοια என்பதற்கான தெளிவான, வழக்கமான வேதாகமத் தமிழ் ‘மனந்திரும்புதல்’ ஆகும்.
theological_decisions:
- issue: ‘உங்கள்’, ‘ஒருவரும்’, ‘எல்லாரும்’ என்பவற்றின் வரம்பு
  choice: ‘உங்களிடம் ... ஒருவரும் ... எல்லாரும்’ என்று கிரேக்கம் கூறும் அளவிலேயே மொழிபெயர்த்து, வரம்பைத் தீர்மானிக்காமல் விடுதல்
  alternative: இவை கடித வாசகர்களை மட்டும் குறிக்கும் என்று வரையறுத்தல், அல்லது மனிதகுலம் முழுவதையும் வெளிப்படையாகக் குறிக்கும் என்று விரிவாக்குதல்
  rationale: கிரேக்க உரை இவ்வசனத்திலேயே அந்த வரம்பை வெளிப்படையாகத் தீர்மானிக்கவில்லை. ஆகவே இறையியல் இழுபறியை மொழிபெயர்ப்பு தானாகத் தீர்க்கவில்லை.
- issue: βούλομαι மூலம் தெரிவிக்கப்படும் தேவனுடைய விருப்பத்தின் தன்மை
  choice: ‘வேண்டும் என்று விரும்பி’
  alternative: ‘தீர்மானிக்காமல்’, ‘கட்டளையிடாமல்’, அல்லது இறையியல் தொழில்நுட்பப் பொருளில் ‘சித்தங்கொள்ளாமல்’
  rationale: மூலச் சொல் விருப்பம்/சித்தத்தைத் தெரிவிக்கிறது; ஆனால் தேவசித்தத்தின் தொழில்நுட்ப வகையை இவ்வசனம் வரையறுக்காததால், அத்தகைய வேறுபாட்டை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் அதேவேளையில் மரியாதையும் வேதாகமத்திற்கேற்ற கண்ணியமும் கொண்ட நடை. βραδύνει/βραδύτητα ஆகியவற்றின் சொல் தொடர்பை ‘தாமதிப்பதில்லை/தாமதம்’ எனக் காத்துள்ளது. நீண்ட கிரேக்க வாக்கியத்தை தமிழில் வாசிக்க எளிதாக இரு வாக்கியங்களாக அமைத்தாலும், தர்க்கத் தொடர்பு மாறாமல் பாதுகாக்கப்பட்டுள்ளது.
