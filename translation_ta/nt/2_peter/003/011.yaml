lexical_decisions:
- source_word: Τούτων ... πάντων
  choice: இவையெல்லாம்
  rationale: இந்தச் சொற்றொடர் உடனடி முந்தைய சூழலில் கூறப்பட்ட படைப்புலகக் கூறுகள் அனைத்தையும் சுட்டுகிறது; ‘இவையெல்லாம்’ என்பது தமிழில் இயல்பாகவும் சுருக்கமாகவும் அந்தக் குறிப்பைத் தருகிறது.
- source_word: οὕτως
  choice: இவ்வாறு
  rationale: கலைந்துபோகுதல் நிகழும் விதத்தை இந்த வினையடை குறிக்கிறது; ‘இவ்வாறு’ அதன் முறைசார்ந்த பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: λυομένων
  choice: கலைந்துபோகிறபடியால்
  rationale: λύω என்பதன் நிகழ்காலச் செயல்பாட்டு மதிப்பையும், அவிழ்தல் அல்லது சிதைவுறுதல் என்ற அடிப்படைப் பொருளையும் இது காக்கிறது; ‘அழிக்கப்படுதல்’ என்று பொருளை வலுப்படுத்தவில்லை.
- source_word: ποταποὺς
  choice: எப்படிப்பட்டவர்களாக
  rationale: இங்கு மனிதர்களின் வகை அல்லது ஒழுக்கத் தரம் குறித்த வினா எழுப்பப்படுகிறது; இந்தத் தமிழ் வடிவம் அதன் வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δεῖ ὑπάρχειν ὑμᾶς
  choice: நீங்கள் ... இருக்க வேண்டும்
  rationale: δεῖ வெளிப்படுத்தும் தார்மீக அவசியத்தையும் ὑπάρχειν என்பதன் இயல்பான ‘இருத்தல்’ பொருளையும் இந்த அமைப்பு காக்கிறது.
- source_word: ἐν ἁγίαις ἀναστροφαῖς
  choice: பரிசுத்தமான நடத்தையில்
  rationale: ἀναστροφή என்பது வாழ்க்கை முறை அல்லது நடத்தையைக் குறிக்கிறது. கிரேக்கப் பன்மையைத் தமிழில் இயல்பான தொகுப்பொருள் ஒருமையாக வழங்குவது பொருளை மாற்றாது.
- source_word: εὐσεβείαις
  choice: இறைப்பற்றில்
  rationale: இந்தச் சொல் வாழ்க்கையில் வெளிப்படும் பயபக்தியுள்ள இறைநோக்கைக் குறிக்கிறது; ‘இறைப்பற்று’ நவீனத் தமிழில் தெளிவாகவும் மதிப்புடனும் உள்ளது.
theological_decisions:
- issue: இப்போதைய உலக ஒழுங்கின் இறுதிக்கால நிலை
  choice: λυομένων என்பதை ‘கலைந்துபோகிற’ என்று மொழிபெயர்த்தல்
  alternative: ‘அழிக்கப்படுகிற’ அல்லது ‘சிதைந்துபோகிற’
  rationale: கிரேக்கச் சொல் அடிப்படையில் அவிழ்தல் அல்லது கலைதலைக் கூறுகிறது. சூழல் இறுதிக்கால நிகழ்வைக் குறித்தாலும், ‘அழிவு’ என்ற வலுவான விளக்கத்தை மொழிபெயர்ப்பிலேயே திணிக்காமல் மூலத்தின் உருவகத்தையும் இறையியல் பதற்றத்தையும் காக்கிறது.
- issue: ἁγίαις ἀναστροφαῖς மற்றும் εὐσεβείαις ஆகிய பன்மை வடிவங்கள்
  choice: தமிழில் ‘நடத்தை’ மற்றும் ‘இறைப்பற்று’ என்ற தொகுப்பொருள் ஒருமைகளைப் பயன்படுத்துதல்
  alternative: ‘நடத்தைகள்’ மற்றும் ‘இறைப்பற்றுச் செயல்கள்’ என்று வெளிப்படையான பன்மையாக வழங்குதல்
  rationale: சுருக்கப் பெயர்களின் பன்மை தமிழில் செயற்கையாக ஒலிக்கக்கூடும். தொகுப்பொருள் ஒருமை ஒழுக்க வாழ்வின் பல வெளிப்பாடுகளை மறுக்காமல் இயல்பான தமிழை வழங்குகிறது; மூலப் பன்மை அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மதிப்புமிக்க நடையைப் பயன்படுத்துகிறது. வசனம் அடுத்த வசனத்தின் பங்கேற்பு வினைகளோடு இலக்கணரீதியாகத் தொடர்வதால், SBLGNT மற்றும் ஆலோசனை உரையைப் போல முடிவில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
