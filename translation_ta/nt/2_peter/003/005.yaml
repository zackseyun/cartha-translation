  source_fidelity: மூலக் கிரேக்கத்தின் வலியுறுத்தலான θέλοντας உடனான λανθάνει அமைப்பு, ‘வேண்டுமென்றே ... புறக்கணிக்கிறார்கள்’ என்பதில் நன்றாக வெளிப்படுகிறது. οὐρανοὶ என்பதன் பன்மை ‘வானங்கள்’ எனவும், ἐξ/διά என்ற வேறுபாடு ‘தண்ணீரிலிருந்து, தண்ணீரின் வழியாக’ எனவும் பாதுகாக்கப்பட்டுள்ளன. συνεστῶσα-வின் படைப்புச் சூழலுக்கேற்ற ‘உருவாக்கப்பட்டிருந்தது’ என்ற வெளிப்பாடு ஏற்றுக்கொள்ளத்தக்கது; τῷ τοῦ θεοῦ λόγῳ என்பதும் ‘கடவுளுடைய வார்த்தையால்’ எனத் துல்லியமாக உள்ளது.
  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘இந்த உண்மையை’ என்பது τοῦτο-வை சற்றே விளக்கமாக்கினாலும், உடன்வரும் உள்ளடக்கத்தின் அடிப்படையில் இயல்பானதும் பொருளை மாற்றாததுமாக உள்ளது. நிறுத்தற்குறிகளும் வாக்கிய ஓட்டமும் வாசிப்பிற்கு ஏற்றவை.
  terminology: ‘வானங்கள்,’ ‘பூமி,’ ‘தண்ணீர்,’ ‘கடவுளுடைய வார்த்தை’ ஆகிய சொற்கள் வேதாகமப் பதிவிற்கும் நவீன பொதுத்தமிழுக்கும் ஏற்றவை. λόγος-ஐ தனிப்பட்ட லோகோஸ் பட்டமாகக் கட்டாயப்படுத்தாமலும், வெறும் ‘கட்டளை’ என்று குறுக்காமலும் மொழிபெயர்ப்பு திறந்தநிலையைப் பாதுகாக்கிறது.
