source:
  edition: SBLGNT
  text: λανθάνει γὰρ αὐτοὺς τοῦτο θέλοντας ὅτι οὐρανοὶ ἦσαν ἔκπαλαι καὶ γῆ ἐξ ὕδατος καὶ δι’ ὕδατος συνεστῶσα τῷ τοῦ θεοῦ λόγῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/005.yaml
  text: 'For they deliberately overlook this: that the heavens existed long ago[a], and the earth was formed out of water and through water by the word of God[c][b],'
translation:
  language: ta
  text: ஏனெனில், அவர்கள் வேண்டுமென்றே இந்த உண்மையைப் புறக்கணிக்கிறார்கள்:[a] வெகுகாலத்திற்கு முன்பே வானங்கள் இருந்தன; பூமி[b] தண்ணீரிலிருந்து, தண்ணீரின் வழியாக, கடவுளுடைய வார்த்தையால்[c] உருவாக்கப்பட்டிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்கள் விரும்பியே இதை அறியாமல் இருக்கிறார்கள்’ அல்லது ‘அவர்கள் மனப்பூர்வமாக இதைக் கவனிக்காமல் விடுகிறார்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத் தொடர் அறியாமையையும் மனப்பூர்வமான புறக்கணிப்பையும் இணைக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘நிலம்’ என்றும் மொழிபெயர்க்கலாம். இங்கு கிரேக்கச் சொல்லுக்கு நிர்ணயச் சுட்டு இல்லை; எனினும் படைப்புச் சூழலில் அது பூமியாகிய உலகைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘கடவுளுடைய கட்டளையால்’ என்றும் மொழிபெயர்க்கலாம். இன்னும் சொற்சார்ந்த மொழிபெயர்ப்பு ‘கடவுளுடைய வார்த்தையால்’ என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: λανθάνει γὰρ αὐτοὺς τοῦτο θέλοντας
  choice: ஏனெனில், அவர்கள் வேண்டுமென்றே இந்த உண்மையைப் புறக்கணிக்கிறார்கள்
  rationale: λανθάνει என்ற அறியாமை/கவனிக்காமை சார்ந்த கருத்தையும் θέλοντας காட்டும் மனப்பூர்வமான நிலைப்பாட்டையும் இயல்பான நவீன தமிழில் ஒருங்கிணைக்கிறது.
- source_word: οὐρανοὶ ἦσαν ἔκπαλαι
  choice: வெகுகாலத்திற்கு முன்பே வானங்கள் இருந்தன
  rationale: οὐρανοὶ என்பதன் பன்மையை ‘வானங்கள்’ என்றும், ἔκπαλαι என்பதன் நீண்டகாலத்துக்கு முந்திய காலக் குறிப்பை ‘வெகுகாலத்திற்கு முன்பே’ என்றும் பாதுகாக்கிறது.
- source_word: γῆ
  choice: பூமி
  rationale: படைப்பைப் பற்றிய இந்த அண்டவியல் சூழலில் γῆ என்பது உலகமாகிய பூமியைக் குறிக்கிறது; தமிழில் தனித்த நிர்ணயச் சுட்டு இல்லாததால் இயல்பான ‘பூமி’ பயன்படுத்தப்படுகிறது.
- source_word: ἐξ ὕδατος καὶ δι’ ὕδατος
  choice: தண்ணீரிலிருந்து, தண்ணீரின் வழியாக
  rationale: ἐξ என்பதன் தோற்றமூலக் கருத்தையும் διά என்பதன் வழி அல்லது ஊடகக் கருத்தையும் வேறுபடுத்திப் பாதுகாக்கிறது.
- source_word: συνεστῶσα
  choice: உருவாக்கப்பட்டிருந்தது
  rationale: பூமி அமைக்கப்பட்டு இருந்ததைக் குறிக்கும் நிறைநிலைப் பங்கேற்பு வடிவத்தை படைப்புச் சூழலுக்கு ஏற்ற தெளிவான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τῷ τοῦ θεοῦ λόγῳ
  choice: கடவுளுடைய வார்த்தையால்
  rationale: கருவிப் பொருளுடைய வேற்றுமையை ‘-ஆல்’ மூலம் காட்டி, λόγος என்பதை ‘கட்டளை’ என்று குறுக்காமல் அதன் முறையான ‘வார்த்தை’ என்ற பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: λόγος என்பது தனிப்பட்ட ‘லோகோஸ்’ பட்டத்தைக் குறிக்கிறதா, கடவுளின் செயலாற்றும் வார்த்தையைக் குறிக்கிறதா
  choice: கடவுளுடைய வார்த்தையால்
  alternative: கடவுளுடைய கட்டளையால்
  rationale: இந்த வசனம் கிறிஸ்துவை ‘வார்த்தை’ என்ற பட்டத்தால் வெளிப்படையாக அடையாளப்படுத்தவில்லை. அதேவேளை λόγος என்பதை வெறும் ‘கட்டளை’ என்று தீர்மானித்துவிடாமல், மூலத்தின் இறையியல் திறந்தநிலையை மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குத் தெளிவாகவும் வேதாகமப் பொருளுக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘வானங்கள்’ என்ற பன்மையும், தண்ணீரைக் குறிக்கும் இரண்டு வேறுபட்ட கிரேக்க முன்னிடைச்சொற்களும் பாதுகாக்கப்பட்டுள்ளன.
