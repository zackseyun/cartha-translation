id: 2PE.3.7
reference: 2 Peter 3:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἱ δὲ νῦν οὐρανοὶ καὶ ἡ γῆ τῷ ⸀αὐτῷ λόγῳ τεθησαυρισμένοι εἰσὶν πυρὶ τηρούμενοι εἰς ἡμέραν κρίσεως καὶ ἀπωλείας τῶν ἀσεβῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/007.yaml
  text: But the present heavens and the earth are stored up by the same word, being kept for fire until the day of judgment and destruction of ungodly men.
translation:
  language: ta
  text: ஆனால், இப்போது உள்ள வானங்களும் பூமியும் அதே வார்த்தையால் சேமித்து வைக்கப்பட்டுள்ளன; நியாயத்தீர்ப்பும் இறைப்பக்தியற்ற மனிதர்களின் அழிவும் நிகழும் நாள்வரை, அவை நெருப்புக்காகக் காக்கப்பட்டு வருகின்றன.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ νῦν οὐρανοὶ καὶ ἡ γῆ
  choice: ஆனால், இப்போது இருக்கும் வானங்களும் பூமியும்
  rationale: δέ முன்னுள்ள உலகத்துக்கும் இப்போதைய படைப்பொழுங்குக்கும் உள்ள வேறுபாட்டைச் சுட்டுவதால் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது. νῦν என்பது தற்போதுள்ள வானங்களையும் பூமியையும் குறிக்கிறது; οὐρανοί என்பதன் பன்மையும் காக்கப்பட்டது.
- source_word: τῷ αὐτῷ λόγῳ
  choice: அதே வார்த்தையினால்
  rationale: λόγος சூழலில் முன்பு குறிப்பிடப்பட்ட கடவுளின் செயலாற்றும் வார்த்தையைத் திரும்பச் சுட்டுகிறது. வேற்றுமை உருபின் கருவிப்பொருளை ‘-இனால்’ வெளிப்படுத்துகிறது.
- source_word: τεθησαυρισμένοι εἰσὶν
  choice: சேமித்து வைக்கப்பட்டுள்ளன
  rationale: இந்தச் சுற்றுவழிப் பூர்த்திநிலை வினையமைப்பு, முன்பு நிகழ்ந்த செயலும் அதன் விளைவாக இப்போது தொடரும் நிலையும் இரண்டையும் தெரிவிக்கிறது.
- source_word: πυρὶ τηρούμενοι
  choice: நெருப்புக்கென்று … காக்கப்பட்டு வருகின்றன
  rationale: πυρί இங்கு நோக்கம் அல்லது ஒதுக்கப்பட்ட முடிவைக் குறிக்கிறது. ‘நெருப்புக்கென்று’ என்பது வரவிருக்கும் நெருப்புத் தீர்ப்பைச் சுட்டுகிறது; மூலத்தில் இல்லாத திட்டவட்ட உருபு சேர்க்கப்படவில்லை.
- source_word: εἰς ἡμέραν κρίσεως
  choice: நியாயத்தீர்ப்பின் நாளுக்கும் … என
  rationale: εἰς அந்தக் காத்துவைப்பின் எதிர்கால நோக்கை அல்லது முடிவைச் சுட்டுகிறது. தமிழ் வாக்கியத்தில் ‘என’ என்பதுடன் சேர்ந்து ‘அந்த நாளுக்காக’ என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: καὶ ἀπωλείας
  choice: அழிவுக்கும்
  rationale: ἀπώλεια என்பதற்கு இத்தீர்ப்புச் சூழலில் ‘அழிவு’ என்பது தெளிவான, நடுநிலையான இணைச்சொல்; அதன் இயல்பைப் பற்றிய கூடுதல் கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
- source_word: τῶν ἀσεβῶν ἀνθρώπων
  choice: இறைப்பற்றற்ற மனிதர்களின்
  rationale: ἀσεβής என்பது கடவுளுக்கு உரிய பக்தி அல்லது மரியாதை இல்லாத நிலையைக் குறிக்கிறது; ‘இறைப்பற்றற்ற’ அதை இயல்பாகத் தெரிவிக்கிறது. ἄνθρωποι மனிதர்களைப் பொதுவாகக் குறிக்க முடிவதால் பாலின உள்ளடக்கமுள்ள ‘மனிதர்கள்’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: வரவிருக்கும் நெருப்புத் தீர்ப்பின் இயல்பு
  choice: இப்போதைய வானங்களும் பூமியும் எதிர்கால நெருப்புக்காகக் காக்கப்படுகின்றன என்றும், இறைப்பற்றற்ற மனிதர்களுக்கு அழிவு நேரும் என்றும் வசனம் சொல்வதற்குள் மொழிபெயர்ப்பு நிற்கிறது.
  alternative: பிரபஞ்சம் முற்றிலும் இல்லாமற்போகும் என்று அல்லது படைப்பு நெருப்பால் தூய்மைப்படுத்தப்பட்டுப் புதுப்பிக்கப்படும் என்று வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: ‘அழிவு’ என்பதுடன் வெளிப்படையாக இணைக்கப்பட்டவர்கள் இறைப்பற்றற்ற மனிதர்களே. வானங்களுக்கும் பூமிக்கும் நெருப்பு என்ன செய்யும் என்பதை இந்த வசனம் தனியாகத் தீர்மானிப்பதில்லை; ஆகவே அந்த இறையியல் பதற்றம் காக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் புரியக்கூடியதாயும், வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘சேமித்து வைக்கப்பட்டுள்ளன’ மற்றும் ‘காக்கப்பட்டு வருகின்றன’ என்பவை τεθησαυρισμένοι மற்றும் τηρούμενοι ஆகிய இரு தனித்த கிரேக்கச் செயல்களையும் வேறுபடுத்திக் காட்டுகின்றன.
