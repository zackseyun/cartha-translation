id: 2PE.3.12
reference: 2 Peter 3:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: προσδοκῶντας καὶ σπεύδοντας τὴν παρουσίαν τῆς τοῦ θεοῦ ἡμέρας, δι’ ἣν οὐρανοὶ πυρούμενοι λυθήσονται καὶ στοιχεῖα καυσούμενα τήκεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/012.yaml
  text: as you wait for and hasten the coming of the day of God[a], because of which the heavens, being set on fire, will be dissolved, and the elements, burning[b], will melt.
translation:
  language: ta
  text: தேவனுடைய நாளின் வருகையை எதிர்நோக்கி, அதை விரைவுபடுத்துகிறவர்களாக இருங்கள்[a]. அந்த நாளின் காரணமாக வானங்கள் தீப்பற்றி சிதைந்துபோகும்; அடிப்படைக் கூறுகள் எரிந்து[b] உருகிப்போகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேவனுடைய நாளின் வருகையை ஆவலுடன் எதிர்நோக்குகிறவர்களாக இருங்கள்.” கிரேக்க வினைச்சொல் “விரைவுபடுத்து” அல்லது “ஆவலுடன் எதிர்நோக்கு” என்று பொருள்படலாம்.
    reason: alternative_reading
  - marker: b
    text: “அடிப்படைக் கூறுகள்” என்பது உலகின் அடிப்படைக் கூறுகளையோ, ஒருவேளை வானுலகப் பொருட்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδοκῶντας
  choice: எதிர்நோக்கி
  rationale: எதிர்பார்ப்புடன் காத்திருக்கும் தொடர்ச்சியான மனநிலையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: σπεύδοντας
  choice: விரைவுபடுத்துகிறவர்களாக
  rationale: வருகையை விரைவுபடுத்துதல் என்ற நேரடியான பொருளை முதன்மை உரையில் வைத்துக் கொண்டு, ‘ஆவலுடன் எதிர்நோக்குதல்’ என்ற சாத்தியப் பொருளை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: παρουσίαν
  choice: வருவதை
  rationale: இறுதிக்காலச் சூழலில் ‘வருகை’ என்பதைக் காட்டும் இயல்பான வினைச்சொல் வடிவம்.
- source_word: τῆς τοῦ θεοῦ ἡμέρας
  choice: தேவனுடைய நாள்
  rationale: ‘கர்த்தருடைய நாள்’ என்ற வழக்கமான சொற்றொடராக மாற்றாமல், மூலத்தின் தனித்துவமான ‘தேவனுடைய நாள்’ என்பதைக் காக்கிறது.
- source_word: δι’ ἣν
  choice: அந்த நாளின் காரணமாக
  rationale: διά + accusative இங்குக் காரணத்தைக் குறிக்கிறது; தமிழில் தொடர்பு தெளிவாக இருக்க ‘அந்த நாள்’ என்று மீள்குறிக்கப்படுகிறது.
- source_word: οὐρανοὶ
  choice: வானங்கள்
  rationale: கிரேக்கப் பன்மையைப் பாதுகாத்து, அண்டவியல் சூழலுக்கு ஏற்ற சொல்லைப் பயன்படுத்துகிறது.
- source_word: πυρούμενοι
  choice: தீப்பற்றி
  rationale: தீக்கு உட்படுத்தப்படும் அல்லது தீப்பிடிக்கும் கருத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: λυθήσονται
  choice: சிதைந்துபோகும்
  rationale: முற்றிலும் இல்லாமலாக்கப்படுதல் என்று வலியுறுத்தாமல், கட்டவிழ்ந்து பிரிந்துபோதல் அல்லது கரைந்துபோதல் என்ற பொருளைத் தருகிறது.
- source_word: στοιχεῖα
  choice: மூலக்கூறுகள்
  rationale: உலகின் அடிப்படைக் கூறுகள் என்ற பரந்த பொருளைத் தருகிறது; வானுலகப் பொருட்கள் என்ற மாற்று விளக்கத்தை அடிக்குறிப்பில் காக்கிறது.
- source_word: καυσούμενα
  choice: எரிந்து
  rationale: வெப்பம் அல்லது நெருப்புக்கு உட்படுவதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τήκεται
  choice: உருகிப்போகும்
  rationale: வெப்பத்தால் உருகுதல் என்ற அடிப்படைப் பொருளை, சுற்றியுள்ள எதிர்கால நிகழ்வுகளோடு இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: σπεύδοντας τὴν παρουσίαν என்பதன் பொருள்
  choice: அதை விரைவுபடுத்துகிறவர்களாக
  alternative: அது வருவதை ஆவலுடன் எதிர்நோக்குகிறவர்களாக
  rationale: கிரேக்கச் சொல் வருகையை விரைவுபடுத்துதல் அல்லது அதற்காக ஆவலாயிருத்தல் ஆகிய இரு பொருள்களையும் அனுமதிக்கிறது. நேரடியான பொருள் முதன்மை உரையிலும், குறைவான காரணவியல் பொருள் அடிக்குறிப்பிலும் வைக்கப்படுகிறது.
- issue: στοιχεῖα என்பதன் குறிப்பு
  choice: மூலக்கூறுகள்
  alternative: வானுலகப் பொருட்கள்
  rationale: குறிப்பிட்ட ஓர் அண்டவியல் விளக்கத்தைத் திணிக்காமல், சொல்லின் பரந்த பொருளை முதன்மை உரையில் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. வசனம் முந்தைய அறிவுறுத்தலின் தொடர்ச்சி என்பதால் ‘இருங்கள்’ சேர்க்கப்பட்டுள்ளது. உண்மையான சொற்பொருள் மற்றும் இறையியல் தெளிவின்மைகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
