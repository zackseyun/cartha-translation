    issue: Tense/aspect of “என்று சொல்வார்கள்”
    rationale: λέγοντες is a present participle coordinated with the preceding description. A present Tamil reporting form, “என்று கூறுகிறார்கள்,” better preserves this than the future “சொல்வார்கள்.”
  - severity: medium
    issue: Placement and force of “ἀπ’ ἀρχῆς κτίσεως”
