source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ποῦ ἐστιν ἡ ἐπαγγελία τῆς παρουσίας αὐτοῦ; ἀφ’ ἧς γὰρ οἱ πατέρες ἐκοιμήθησαν, πάντα οὕτως διαμένει ἀπ’ ἀρχῆς κτίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/004.yaml
  text: and saying[a], “Where is the promise of his coming? For ever since the fathers fell asleep[b], all things continue just as they have from the beginning of creation.”
translation:
  language: ta
  text: மேலும் அவர்கள், “அவருடைய வருகையைப் பற்றிய வாக்குறுதி[a] எங்கே? முன்னோர்கள் நித்திரையடைந்ததிலிருந்து[b], படைப்பு தொடங்கிய காலத்திலிருந்தே எல்லாம் அப்படியே தொடர்ந்து இருக்கின்றன” என்று கூறுகிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வருகை” என்பதற்கான கிரேக்கச் சொல் (παρουσία), “பிரசன்னம்” அல்லது “வந்தடைதல்” என்றும் பொருள்படலாம். இச்சூழலில் அது கிறிஸ்துவின் எதிர்பார்க்கப்பட்ட எதிர்கால வருகையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “நித்திரையடைந்தனர்” என்பது இறந்ததைக் குறிக்கும் கிரேக்க மென்மொழி.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: என்று சொல்வார்கள்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்படும் ஏளனம் செய்பவர்களின் செயலைத் தொடரும் நிகழ்காலப் பங்கேற்புவினையை, தமிழில் இயல்பாகப் புரியும் வரையறை வினையாக வழங்குகிறது; தொடக்கத்திலுள்ள καί-ஐ ‘மேலும்’ எனக் காக்கிறது.
- source_word: ἐπαγγελία
  choice: வாக்குறுதி
  rationale: கொடுக்கப்பட்ட உறுதியைக் குறிக்கும் வழக்கமான, தெளிவான தமிழ் சொல்.
- source_word: παρουσίας
  choice: வருகை
  rationale: இச்சூழலில் எதிர்பார்க்கப்படும் கிறிஸ்துவின் எதிர்கால வருகையை இயல்பாகக் குறிக்கிறது; சொல்லின் ‘இருப்பு/வந்திருத்தல்’ சார்ந்த பரந்த பொருள் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: ἀφ’ ἧς
  choice: நித்திரையடைந்ததுமுதல்
  rationale: கடந்தகால நிகழ்விலிருந்து இன்றுவரையிலான காலத் தொடர்ச்சியைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: οἱ πατέρες
  choice: முன்னோர்கள்
  rationale: உடைமைச் சுட்டுப்பெயர் இல்லாத கிரேக்கத்தை மதித்து ‘நம்’ என்பதைச் சேர்க்காமல், முந்தைய தலைமுறையினரை நவீன தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: ἐκοιμήθησαν
  choice: நித்திரையடைந்தனர்
  rationale: இறப்பைக் குறிக்கும் மூலமொழியின் மென்மொழி உருவகத்தைப் பாதுகாக்கிறது.
- source_word: πάντα
  choice: எல்லாம்
  rationale: முழுமையான பரப்பைக் குறிக்கும் நடுநிலைப் பன்மையின் இயல்பான தமிழ் வடிவம்.
- source_word: οὕτως διαμένει
  choice: இருந்தபடியே தொடர்ந்து இருக்கின்றன
  rationale: அனைத்தும் அதே நிலையிலேயே நிலைத்திருக்கின்றன என்ற ஏளனம் செய்பவர்களின் கூற்றைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἀπ’ ἀρχῆς κτίσεως
  choice: படைப்பின் தொடக்கத்தில்
  rationale: படைப்பின் ஆரம்ப நிலையை ஒப்பீட்டின் தொடக்கப் புள்ளியாகக் காட்டுகிறது; ‘இருந்தபடியே’ என்பதுடன் சேர்ந்து கிரேக்கத் தொடரின் பொருளை இயல்பாக அளிக்கிறது.
theological_decisions:
- issue: இறுதிக்காலச் சூழலில் παρουσία என்பதன் பொருள்
  choice: அவருடைய வருகை
  alternative: அவருடைய பிரசன்னம் / வந்தடைதல்
  rationale: தாமதமாவதாக ஏளனம் செய்யப்படும் எதிர்கால நிகழ்வை இச்சூழல் சுட்டுவதால் ‘வருகை’ மிகத் தெளிவானது; எனினும் மூலச்சொல்லின் பொருள் வரம்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἐκοιμήθησαν என்ற இறப்பு மென்மொழி
  choice: நித்திரையடைந்தனர்
  alternative: இறந்தனர்
  rationale: மூலத்தில் நேரடியாக ‘இறந்தனர்’ என்று சொல்லாமல் பயன்படுத்தப்பட்டுள்ள உறக்க உருவகத்தைப் பாதுகாக்கிறது; அதற்கு மேற்பட்ட கோட்பாட்டுப் பொருள் திணிக்கப்படவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘நித்திரையடைந்தனர்’ என்ற மரபான உருவகம் மூலத்தின் மொழிநயத்தைப் பாதுகாக்கிறது; ‘இருந்தபடியே எல்லாம் தொடர்ந்து இருக்கின்றனவே’ என்பது ஏளனம் கலந்த வாதத்தின் தொனியை இயல்பாக வெளிப்படுத்துகிறது.
