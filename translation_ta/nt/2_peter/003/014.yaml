id: 2PE.3.14
reference: 2 Peter 3:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Διό, ἀγαπητοί, ταῦτα προσδοκῶντες σπουδάσατε ἄσπιλοι καὶ ἀμώμητοι αὐτῷ εὑρεθῆναι ἐν εἰρήνῃ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/014.yaml
  text: Therefore[a], beloved, since you are waiting for these things, make every effort to be found by him spotless and blameless in peace.
translation:
  language: ta
  text: ஆகவே, அன்புக்குரியவர்களே, இவற்றை எதிர்பார்த்துக்கொண்டிருக்கும் நீங்கள், சமாதானத்தில் கறையற்றவர்களாகவும் குற்றமற்றவர்களாகவும் அவரால் காணப்படுவதற்கு முழு முயற்சியும் செய்யுங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சமாதானத்தில் கறையற்றவர்களாகவும் குற்றமற்றவர்களாகவும் அவருக்கு முன்பாகக் காணப்படுவதற்கு.” கிரேக்க இடைவேற்றுமை வடிவத்தை “அவரால்” என்றும் “அவருக்கு முன்பாக” என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Διό
  choice: ஆகவே
  rationale: முந்தைய பகுதியில் கூறப்பட்ட ஆண்டவரின் நாளையும் புதிய வானங்களையும் புதிய பூமியையும் அடிப்படையாகக் கொண்டு முடிவை அறிமுகப்படுத்தும் இயல்பான காரணவிளைவுச் சொல்.
- source_word: ἀγαπητοί
  choice: அன்புக்குரியவர்களே
  rationale: பன்மை விளியாகிய அன்பான அழைப்பையும் கடித நடையின் கண்ணியத்தையும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: ταῦτα προσδοκῶντες
  choice: இவற்றை எதிர்பார்த்துக் காத்திருக்கிற நீங்கள்
  rationale: முன்னர் சொல்லப்பட்ட இறுதிக்கால நிகழ்வுகளைச் சுட்டும் ταῦτα என்பதையும், தொடரும் எதிர்பார்ப்பைக் குறிக்கும் நிகழ்காலப் பங்கேற்பு வினையையும் வெளிப்படுத்துகிறது; அதன் கால-காரணத் தொடர்பைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: σπουδάσατε
  choice: முழு முயற்சி செய்யுங்கள்
  rationale: ஆர்வத்துடனும் அக்கறையுடனும் தீவிரமாக முயலும்படி கட்டளையிடும் வலிமையைத் தெளிவாகத் தருகிறது.
- source_word: ἄσπιλοι
  choice: கறையற்றவர்களாக
  rationale: ஒழுக்கத் தூய்மையைச் சித்தரிக்கும் ‘கறை’ என்ற உருவகத்தைப் பாதுகாக்கிறது.
- source_word: ἀμώμητοι
  choice: குற்றமற்றவர்களாக
  rationale: ἄσπιλοι உடன் இணைந்து வரும் ஒழுக்க நேர்மையைச் சுட்டுகிறது; அதே நேரத்தில் இரு சொற்களையும் தமிழில் வேறுபடுத்திக் காட்டுகிறது.
- source_word: αὐτῷ εὑρεθῆναι
  choice: அவரால் காணப்படுவதற்கு
  rationale: இறுதிக்கால மதிப்பீட்டின் சூழலில் αὐτῷ என்பதை செயப்படுபொருள் வினையின் முகவராக எடுத்துக்கொள்கிறது; சுட்டுப்பெயரின் இறைச் சுட்டை மேலும் வெளிப்படையாகக் குறிப்பிடாமல் மூலத்தின் சுருக்கத்தைப் பேணுகிறது. மாற்று இலக்கணப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐν εἰρήνῃ
  choice: சமாதானத்தில்
  rationale: அவர்கள் காணப்பட வேண்டிய நிலையைச் சுட்டும் சொற்றொடரை நெருக்கமாக மொழிபெயர்த்து, உள்ளார்ந்த அமைதி, நல்லுறவு அல்லது ஒப்புரவான நிலை ஆகிய சாத்தியங்களைத் திறந்தவையாக வைத்திருக்கிறது.
theological_decisions:
- issue: இறுதிக்காலச் சூழலில் αὐτῷ என்பதன் பொருளும் இலக்கணப் பங்கும்
  choice: அவரால் காணப்படுவதற்கு
  alternative: அவருக்கு முன்பாகக் காணப்படுவதற்கு
  rationale: εὑρεθῆναι உடன் வரும் வேற்றுமை வடிவம் செயலை மேற்கொள்பவரைக் குறிக்கும் ‘அவரால்’ என்றும், முன்னிலை/தொடர்பைக் குறிக்கும் ‘அவருக்கு முன்பாக’ என்றும் புரிந்துகொள்ளப்படலாம். முதன்மை உரை முதலாவது வாசிப்பை ஏற்கிறது; உண்மையான இரட்டைப் பொருளை அடிக்குறிப்பு பாதுகாக்கிறது. ‘அவர்’ யார் என்பதை வசனத்தில் இல்லாத பெயரால் வெளிப்படையாக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கடித நடை. ‘அன்புக்குரியவர்களே’, ‘சமாதானத்தில்’ ஆகியவை வேதாகமச் சூழலுக்கேற்ற உயர்வைத் தக்கவைத்தாலும் பழமையான அல்லது சமயப்பிரிவு சார்ந்த சொற்களைத் தவிர்க்கின்றன. அடிக்குறிப்பு குறி தொடர்புடைய தெளிவின்மைக்குப் பின், வசன முடிவில் வைக்கப்பட்டுள்ளது.
