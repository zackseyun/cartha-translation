id: 2PE.3.13
reference: 2 Peter 3:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καινοὺς δὲ οὐρανοὺς καὶ γῆν καινὴν κατὰ τὸ ἐπάγγελμα αὐτοῦ προσδοκῶμεν, ἐν οἷς δικαιοσύνη κατοικεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/013.yaml
  text: But according to his promise[a], we are waiting for new heavens and a new earth, in which righteousness dwells.
translation:
  language: ta
  text: ஆனால், அவருடைய வாக்குறுதியின்படி, நீதி[a] குடியிருக்கும் புதிய வானங்களையும் புதிய பூமியையும் நாம் எதிர்நோக்கிக் காத்திருக்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நீதிநெறி குடியிருக்கும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: δικαιοσύνη என்பது நீதி, கடவுளுக்கு முன்பாகச் சரியான நிலை, அல்லது நீதிநெறி ஆகிய தொடர்புடைய நுண்பொருள்களைக் கொண்டிருக்கலாம்.
lexical_decisions:
- source_word: καινοὺς ... οὐρανοὺς / γῆν καινὴν
  choice: புதிய வானங்களையும் புதிய பூமியையும்
  rationale: καινός என்பதன் பண்புசார் ‘புதிய’ என்ற பொருளைத் தக்கவைக்கிறது. ‘வானங்கள்—பூமி’ என்ற வேதாகமத்தின் அண்டமுழுதையும் குறிக்கும் மொழிநடையையும், ஏசாயா 65:17; 66:22 ஆகியவற்றின் எதிரொலியையும் காக்கிறது; ‘புதுப்பிக்கப்பட்ட’ என்பது மூலச் சொல்லுக்கு அப்பாற்பட்ட விளக்கமாகிவிடும்.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட தற்போதைய வானங்களும் பூமியும் அழிவதற்கும், இங்கு எதிர்பார்க்கப்படும் புதிய படைப்புக்கும் இடையிலான மென்மையான முரண்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: κατὰ τὸ ἐπάγγελμα αὐτοῦ
  choice: அவருடைய வாக்குறுதியின்படி
  rationale: κατά இங்கு ஒத்திசைவு அல்லது அடிப்படையைக் குறிக்கிறது; ἐπάγγελμα என்பது ‘வாக்குறுதி’. αὐτοῦ என்பதைத் தெளிவுபடுத்தாமல் ‘அவருடைய’ என்று மொழிபெயர்த்து, மூலத்தின் சுட்டலைப் பாதுகாக்கிறது.
- source_word: προσδοκῶμεν
  choice: எதிர்நோக்கிக் காத்திருக்கிறோம்
  rationale: நிகழ்கால வினை வடிவத்தின் தொடர்ச்சியான, நம்பிக்கை நிறைந்த எதிர்பார்ப்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν οἷς
  choice: குடியிருக்கும் புதிய வானங்களையும் புதிய பூமியையும்
  rationale: இடத்தைக் குறிக்கும் தொடர்பைத் தமிழின் இயல்பான பெயரெச்சத் தொடரால் காட்டுகிறது. பன்மை தொடர்புப்பெயர் புதிய வானங்களையும் புதிய பூமியையும் ஒன்றாகிய புதிய படைப்பாகச் சுட்டுகிறது.
- source_word: δικαιοσύνη
  choice: நீதிநெறி
  rationale: கடவுளுக்கு முன்பாகச் சரியான நிலை, ஒழுக்கநேர்மை, சரியான ஒழுங்கு ஆகியவற்றை உள்ளடக்கும் பரந்த பொருளை ‘நீதிநெறி’ காக்கிறது. சமூக நியாயம் என்ற நுண்பொருளும் சாத்தியமாதலால் அது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: κατοικεῖ
  choice: குடியிருக்கும்
  rationale: κατοικέω குறிக்கும் நிலையான வசிப்பை இயல்பாகவும் கண்ணியமாகவும் தெரிவிக்கிறது; புதிய படைப்பில் நீதிநெறி நிரந்தரமாக நிலைபெறுவதைச் சுட்டும் உருவகத்தையும் காக்கிறது.
theological_decisions:
- issue: முடிவுக்காலப் புதிய படைப்பின் சூழலில் δικαιοσύνη என்பதன் மொழிபெயர்ப்பு
  choice: நீதிநெறி
  alternative: நீதி
  rationale: இச்சொல் தனிநபர் ஒழுக்கநேர்மையை மட்டும் அல்லாமல், கடவுளுக்கு முன்பாகச் சரியான முழு ஒழுங்கையும் குறிக்கக்கூடும். ‘நீதிநெறி’ அந்தப் பரப்பை முதன்மை உரையில் காக்கிறது; ‘நீதி’ சமூக நியாயத்தையும் சரியான தீர்ப்பையும் வலியுறுத்தும் உண்மையான மாற்று நுண்பொருளாக அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘வானங்கள்’ என்ற பன்மை மூலத்தின் அண்டமுழுதையும் குறிக்கும் வேதாகம மொழியைத் தக்கவைக்கிறது. கிரேக்கத்தின் உருவகப் பயன்பாட்டின்படி ‘நீதிநெறி குடியிருக்கும்’ என்ற ஆளுருவாக்கம் பாதுகாக்கப்பட்டுள்ளது.
