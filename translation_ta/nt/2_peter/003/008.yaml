reference: 2 Peter 3:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἓν δὲ τοῦτο μὴ λανθανέτω ὑμᾶς, ἀγαπητοί, ὅτι μία ἡμέρα παρὰ κυρίῳ ὡς χίλια ἔτη καὶ χίλια ἔτη ὡς ἡμέρα μία.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/008.yaml
  text: 'But do not let this one thing escape your notice[a], beloved: with the Lord one day is like a thousand years[c][b], and a thousand years like one day.'
translation:
  language: ta
  text: 'ஆனால், அன்பானவர்களே, இந்த ஒரு காரியம் உங்கள் கவனத்திலிருந்து தப்பிவிடாதிருக்கட்டும்[a]: ஆண்டவருக்கு முன்பாக ஒரு நாள் ஆயிரம் ஆண்டுகளைப் போலவும்[c][b], ஆயிரம் ஆண்டுகள் ஒரு நாளைப் போலவும் உள்ளன.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த ஒரு காரியத்தை அறியாதவர்களாய் இருக்காதீர்கள்.”
    reason: lexical_alternative
  - marker: b
    text: இங்கு “போல” என்ற சொல் ஒப்புமையைக் குறிக்கிறது; ஒரு நாளும் ஆயிரம் ஆண்டுகளும் சொல்லர்த்தமாகச் சமம் என்று கூறவில்லை.
    reason: cultural_note
  - marker: c
    text: சங்கீதம் 90:4-ஐ எதிரொலிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: Ἓν ... τοῦτο
  choice: இந்த ஒரு காரியம்
  rationale: Ἓν என்பதன் ‘ஒரு’ என்ற வலியுறுத்தலையும், τοῦτο என்பதன் சுட்டுப்பொருளையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: μὴ λανθανέτω ὑμᾶς
  choice: உங்கள் கவனத்திலிருந்து தப்பிவிடாதிருக்கட்டும்
  rationale: ஒரு காரியம் ஒருவருக்குத் தெரியாமல் அல்லது கவனிக்கப்படாமல் போவதைக் குறிக்கும் λανθάνω என்பதன் பொருளையும் கட்டளைத் தொனியையும் பாதுகாக்கிறது.
- source_word: ἀγαπητοί
  choice: அன்புக்குரியவர்களே
  rationale: சக விசுவாசிகளை நோக்கிய பாசமுள்ள அழைப்பை கண்ணியமான, புரிந்துகொள்ள எளிய தமிழில் தருகிறது.
- source_word: παρὰ κυρίῳ
  choice: ஆண்டவரிடம்
  rationale: παρά + dative இங்குக் குறிக்கும் ஆண்டவருடைய முன்னிலை அல்லது பார்வை சார்ந்த பொருளை மிகையாக விளக்காமல் சுருக்கமாகத் தருகிறது.
- source_word: μία ἡμέρα ... ὡς χίλια ἔτη
  choice: ஒரு நாள் ஆயிரம் ஆண்டுகளைப் போல
  rationale: ὡς குறிக்கும் ஒப்புமையைத் தெளிவாகக் காத்து, இரண்டையும் நேரடியாகச் சமமாக்குவதைத் தவிர்க்கிறது.
- source_word: καὶ χίλια ἔτη ὡς ἡμέρα μία
  choice: ஆயிரம் ஆண்டுகள் ஒரு நாளைப் போல
  rationale: முதல் ஒப்புமைக்கு எதிரிணையான சமநிலையையும் கிரேக்க வசனத்தின் அமைப்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: χίλια ἔτη
  choice: ஆயிரம் ஆண்டுகள்
  rationale: எண்ணளவை விளக்கவுரையோ குறியீட்டு அர்த்தமோ சேர்க்காமல் நேரடியாக மொழிபெயர்க்கிறது.
theological_decisions:
- issue: கால ஒப்புமையின் இயல்பு
  choice: ஆண்டவருக்கும் காலத்திற்கும் உள்ள உறவைப் பற்றிய ஒப்புமையாக மொழிபெயர்த்தல்
  alternative: ஒரு நாள் சொல்லர்த்தமாக ஆயிரம் ஆண்டுகளுக்குச் சமம் என்றோ, இறுதிக்காலக் கணக்கீட்டுக்கான சூத்திரம் என்றோ எடுத்துரைத்தல்
  rationale: இருமுறை வரும் ὡς என்பது ‘போல’ என்ற ஒப்புமையைக் குறிக்கிறது; ஆகவே உரையில் இல்லாத தீர்க்கதரிசனக் காலக்கணிப்பு முறையை மொழிபெயர்ப்புக்குள் புகுத்தாமல் ஒப்புமையையும் அதன் இறையியல் அழுத்தத்தையும் காக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான வேதாகமத் தொனி. ‘அன்புக்குரியவர்களே’ என்பது அன்பான அழைப்பைத் தக்கவைக்கிறது. ‘ஆண்டவரிடம்’ என்பது παρὰ κυρίῳ என்பதின் சுருக்கமான பார்வை/முன்னிலை சார்ந்த நுணுக்கத்தைப் பாதுகாக்கிறது. ஒப்புமையின் இணை அமைப்பு வாசிப்பில் தெளிவாக இருக்க ‘போலவும் ... போலவும்’ பயன்படுத்தப்பட்டுள்ளது.
