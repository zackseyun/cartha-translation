id: 2PE.3.16
reference: 2 Peter 3:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὡς καὶ ἐν πάσαις ⸀ταῖς ἐπιστολαῖς λαλῶν ἐν αὐταῖς περὶ τούτων, ἐν ⸀αἷς ἐστιν δυσνόητά τινα, ἃ οἱ ἀμαθεῖς καὶ ἀστήρικτοι στρεβλοῦσιν ὡς καὶ τὰς λοιπὰς γραφὰς πρὸς τὴν ἰδίαν αὐτῶν ἀπώλειαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/016.yaml
  text: as also in all his letters[a], speaking in them about these things. In them are some things hard to understand, which the ignorant and unstable twist, as they do the rest of the Scriptures[c][b], to their own destruction.
translation:
  language: ta
  text: அவர் தமது எல்லாக் கடிதங்களிலும் இவற்றைப் பற்றிப் பேசுகிறார். அந்தக் கடிதங்களில் புரிந்துகொள்வதற்குக் கடினமான சில விஷயங்கள் உள்ளன. கற்றறியாதவர்களும்[a] நிலையற்றவர்களும் மற்ற வேதவாக்கியங்களை[c]த் திரிப்பதுபோல, அந்த விஷயங்களையும் திரித்து[b], தங்களுக்கே அழிவை உண்டாக்கிக்கொள்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அறியாதவர்களும்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உருக்குலைத்து.’
    reason: lexical_alternative
  - marker: c
    text: ‘மற்ற வேதவாக்கியங்கள்’ என்பதை ‘வேதவாக்கியங்களில் எஞ்சியவை’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் இரு பொருள்களையும் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστολαῖς
  choice: கடிதங்களிலும்
  rationale: ‘நிருபங்கள்’ என்பதைவிட இன்றைய பொதுத் தமிழில் இயல்பாக உள்ள ‘கடிதங்கள்’ என்பதைக் கொண்டு, எழுத்து மூலமான தொடர்பு என்ற பொருளைப் பாதுகாக்கிறது.
- source_word: λαλῶν
  choice: பேசும்போதும்
  rationale: கடிதங்களின் வழியாகப் பவுல் தெரிவிப்பதைக் குறித்தாலும், கிரேக்கச் சொல்லின் அடிப்படைப் பொருளான ‘பேசுதல்’ என்பதைப் பாதுகாக்கிறது.
- source_word: περὶ τούτων
  choice: இவற்றைப் பற்றி
  rationale: முன்பு கூறப்பட்ட காரியங்களைச் சுட்டும் கிரேக்கக் குறிப்பை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: δυσνόητά τινα
  choice: புரிந்துகொள்வதற்குக் கடினமான சில விஷயங்கள்
  rationale: τινα என்பதன் உறுதியற்ற ‘சில’ என்ற பொருளையும், δυσνόητα என்பதன் ‘புரிந்துகொள்ளக் கடினமான’ என்ற பொருளையும் தெளிவாகக் காக்கிறது.
- source_word: ἀμαθεῖς
  choice: கற்றறியாதவர்கள்
  rationale: முறையான கல்வியின்மை மட்டும் அல்லாமல் போதனையோ புரிதலோ இல்லாத நிலையைச் சுட்டுகிறது; ‘அறியாதவர்கள்’ என்பதும் சாத்தியம்.
- source_word: ἀστήρικτοι
  choice: நிலையற்றவர்கள்
  rationale: உறுதியாக நிலைநிறுத்தப்படாத மன அல்லது விசுவாச நிலையைக் குறிக்கும் சொல்லின் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: στρεβλοῦσιν
  choice: திரித்து
  rationale: ஒன்றை அதன் சரியான வடிவத்திலிருந்து வளைத்துவிடும் உருவகத்தைச் சுருக்கமாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: τὰς λοιπὰς γραφὰς
  choice: மற்ற வேதவாக்கியங்கள்
  rationale: γραφαί என்பதன் புனித எழுத்துகள் என்ற பொருளை ‘வேதவாக்கியங்கள்’ எனக் காத்து, λοιπάς என்பதைக் ‘மற்ற’ என இயல்பாகத் தருகிறது; பவுலின் கடிதங்கள் அவற்றோடு ஒப்பிடப்படுவதையும் மறைக்கவில்லை.
- source_word: ἀπώλειαν
  choice: அழிவு
  rationale: தீர்ப்பின் தீவிரமான விளைவைத் தெளிவாகக் கூறுகிறது; மூலத்தில் இல்லாத கூடுதல் கோட்பாட்டு விவரத்தைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: τὰς λοιπὰς γραφὰς என்பதில் பவுலின் கடிதங்களுக்கும் வேதவாக்கியங்களுக்கும் உள்ள உறவு
  choice: ‘மற்ற வேதவாக்கியங்கள்’ என்று மொழிபெயர்த்து, பவுலின் கடிதங்கள் வேதவாக்கியங்களோடு ஒப்பிடப்படுகின்றன என்ற இயல்பான உட்பொருளைப் பாதுகாத்தல்
  alternative: ‘மற்ற எழுத்துகள்’
  rationale: புதிய ஏற்பாட்டுப் பயன்பாட்டில் γραφαί பொதுவாகப் புனித எழுத்துகளைக் குறிக்கிறது. ‘எழுத்துகள்’ என்று பொதுமைப்படுத்துவது இந்த உட்பொருளை மங்கச் செய்யும்; அதேவேளை மொழிபெயர்ப்பு மூலவாக்கியம் கூறுவதைத் தாண்டிய கோட்பாட்டுக் கூற்றைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத் தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. ‘கடிதங்கள்,’ ‘புரிந்துகொள்வதற்குக் கடினமான,’ ‘நிலையற்றவர்கள்’ போன்ற சொற்கள் பொதுவாசகருக்குத் தெளிவாக உள்ளன. முந்தைய வசனத்தோடு இலக்கணத் தொடர்பை இயல்பாக்க, ὡς καὶ என்பதற்கு ‘இப்படியே செய்கிறார்’ என்று வழங்கப்பட்டுள்ளது.
