  source_fidelity: 'மூலக் கிரேக்கத்தின் முக்கிய கூறுகள் துல்லியமாகக் காக்கப்பட்டுள்ளன: βλέμματι καὶ ἀκοῇ என்பதின் கருவிப்பொருள், லோத்தைச் சுட்டும் ὁ δίκαιος, தொடர்நிலை ἐγκατοικῶν, மீள்மீளும் ἡμέραν ἐξ ἡμέρας, ψυχὴν δικαίαν என்பதன் மறுபயன்பாடு, மற்றும் ἐβασάνιζεν என்பதன் நிறைவுறாத கடந்தகாலத் தீவிரம் ஆகியவை அனைத்தும் வெளிப்படுகின்றன. ‘கண்டவற்றாலும் கேட்டவற்றாலும்—அவர்களுடைய சட்டமீறிய செயல்களால்—’ என்ற இடைச்செருகல், பார்வை/கேள்வி மற்றும் சட்டமீறிய செயல்கள் இடையிலான கிரேக்கத் தொடர்பமைப்பின் நெகிழ்வைத் திணிக்காமல் காக்கிறது.'
