id: 2PE.2.8
reference: 2 Peter 2:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: βλέμματι γὰρ καὶ ἀκοῇ ⸀ὁ δίκαιος ἐγκατοικῶν ἐν αὐτοῖς ἡμέραν ἐξ ἡμέρας ψυχὴν δικαίαν ἀνόμοις ἔργοις ἐβασάνιζεν—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/008.yaml
  text: for by what he saw and heard[a], that righteous man, living among them[c][b], was tormenting his righteous soul day after day with their lawless deeds—
translation:
  language: ta
  text: ஏனெனில், அந்த நீதிமான் அவர்களிடையே வாழ்ந்துகொண்டு, தான் கண்டவற்றாலும் கேட்டவற்றாலும்[a]—அவர்களுடைய சட்டமீறிய செயல்களால்—நாள்தோறும் தன் நீதியுள்ள உள்ளத்தை வதைத்துக்கொண்டிருந்தார்[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, ‘பார்வையாலும் கேள்வியாலும்.’
    reason: lexical_alternative
  - marker: b
    text: 'வேறு வகையில்: ‘அவர் கண்டும் கேட்டும் வந்த சட்டமீறிய செயல்களால், தன் நீதியுள்ள உள்ளத்தை நாள்தோறும் வதைத்துக்கொண்டிருந்தார்.’ கிரேக்கத்தில் ‘பார்வையாலும் கேள்வியாலும்’ என்பது வாக்கியத்தின் தொடக்கத்திலும், ‘சட்டமீறிய செயல்களால்’ என்பது பின்னரும் வருவதால், அவற்றுக்கிடையிலான சரியான தொடர்பைத் தமிழில் ஒன்றுக்கு மேற்பட்ட விதத்தில் அமைக்க முடியும்.'
    reason: source_ambiguity
lexical_decisions:
- source_word: βλέμματι καὶ ἀκοῇ
  choice: தான் கண்டவற்றாலும் கேட்டவற்றாலும்
  rationale: இரு வேற்றுமை வடிவங்களும் பார்வை மற்றும் கேள்வியின் வழியாக அவர் அனுபவித்தவற்றைக் குறிக்கின்றன. சொற்சொல்லான ‘பார்வையாலும் கேள்வியாலும்’ என்பதைக் காட்டிலும் இவ்வடிவு இயல்பான நவீன தமிழில் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: ὁ δίκαιος
  choice: அந்த நீதிமான்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் இவ்வடைமொழி முந்தைய வசனத்தில் குறிப்பிடப்பட்ட லோத்தைச் சுட்டுகிறது. ‘அந்த’ என்பது அந்தப் பின்னோக்கிய சுட்டுதலைத் தெளிவாக்குகிறது.
- source_word: ἐγκατοικῶν ἐν αὐτοῖς
  choice: அவர்களிடையே வாழ்ந்துகொண்டு
  rationale: அவர்களின் நடுவில் தொடர்ந்து குடியிருந்த நிலையை வினையெச்ச வடிவில் இயல்பாகக் காட்டுகிறது.
- source_word: ἡμέραν ἐξ ἡμέρας
  choice: நாள்தோறும்
  rationale: தொடர்ச்சியாக மீண்டும் மீண்டும் நிகழ்ந்த செயலைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ψυχὴν δικαίαν
  choice: தன் நீதியுள்ள உள்ளத்தை
  rationale: இங்கு ψυχή லோத்தின் அகநிலை அல்லது உள்ளார்ந்த தன்மையைக் குறிக்கிறது. ‘உள்ளம்’ என்பது உடலிலிருந்து பிரிந்த தனிப்பொருளைப் பற்றிய கோட்பாட்டைத் தேவையின்றி முன்வைக்காமல் பொருளைக் காக்கிறது; ‘தன்’ என்பது சூழலிலிருந்து தெளிவாகிறது.
- source_word: ἀνόμοις ἔργοις
  choice: அவர்களுடைய சட்டமீறிய செயல்களால்
  rationale: ἄνομος என்பதிலுள்ள சட்டத்திற்குப் புறம்பான ஒழுக்கப் பொருளை ‘சட்டமீறிய’ காக்கிறது. செயல்கள் அங்கிருந்த மக்களுடையவை என்பது சூழலால் தெளிவாக இருப்பதால் ‘அவர்களுடைய’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἐβασάνιζεν
  choice: வதைத்துக்கொண்டிருந்தார்
  rationale: இறந்தகாலத்தில் தொடர்ந்து நடந்த தீவிரமான அகவேதனையை வினையின் imperfect வடிவுக்கேற்பக் காட்டுகிறது. தனக்கே செய்யப்பட்ட செயல் என்பதால் தமிழில் தற்சுட்டுப் பொருளுள்ள ‘-க்கொண்டிருந்தார்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: ψυχή குறிக்கும் மனித இயல்பின் அம்சம்
  choice: ‘உள்ளம்’ என்று, லோத்தின் உள்ளார்ந்த தன்மை அல்லது அகநிலையைக் குறிக்கும் வகையில் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஆன்மா’ அல்லது ‘உயிர்’
  rationale: இவ்வசனம் உடல்–ஆன்மா அமைப்பைப் பற்றிய தொழில்நுட்பக் கோட்பாட்டை வகுப்பதல்ல; லோத்தின் உள்ளார்ந்த ஒழுக்க வேதனையைச் சொல்கிறது. ஆகவே தேவையற்ற கோட்பாட்டு முடிவைத் திணிக்காமல் ‘உள்ளம்’ தேர்ந்தெடுக்கப்பட்டது.
- issue: ἐβασάνιζεν என்பதின் செயப்பாட்டு அமைப்பு
  choice: லோத் ‘தன் ... உள்ளத்தை வதைத்துக்கொண்டிருந்தார்’ என்ற செய்நிலைத் தற்சுட்டு அமைப்பு காக்கப்பட்டது.
  alternative: ‘அவருடைய உள்ளம் வேதனைப்பட்டது’
  rationale: மாற்று வடிவு இயல்பாக இருந்தாலும், அது கிரேக்கச் செய்நிலை வினையின் தீவிரத்தையும் வாக்கிய அமைப்பையும் மென்மையாக்கிவிடும்.
translation_notes:
  register: நவீன பொதுநிலைத் தமிழ்; மரியாதையும் வேதாகமத்துக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. ‘நீதிமான் / நீதியுள்ள’ என்ற மூலத்தின் மறுபயன்பாடு அப்படியே பேணப்பட்டுள்ளது. கிரேக்க வாக்கியம் அடுத்த வசனப்பகுதியுடன் தொடர்வதைக் காட்ட இறுதி நீண்ட கோடு வைக்கப்பட்டுள்ளது.
