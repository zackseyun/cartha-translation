  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: κρεῖττον γὰρ ἦν αὐτοῖς μὴ ἐπεγνωκέναι τὴν ὁδὸν τῆς δικαιοσύνης ἢ ἐπιγνοῦσιν ⸀ὑποστρέψαι ἐκ τῆς παραδοθείσης αὐτοῖς ἁγίας ἐντολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/021.yaml
  text: For it would have been better for them not to have known the way of righteousness than[a], after knowing it[c][b], to turn back from the holy commandment delivered to them.
translation:
  language: ta
  text: ஏனெனில், நீதியின் வழியை[a] அறிந்துகொள்ளாமல் இருந்திருப்பதே, அதை அறிந்துகொண்ட பின்பு அவர்களுக்குக் கையளிக்கப்பட்ட[c] பரிசுத்த கட்டளையிலிருந்து பின்வாங்குவதைவிட[b] அவர்களுக்கு நலமாயிருந்திருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நீதியின் பாதை.’ δικαιοσύνη என்பதற்கு சில சூழல்களில் ‘நியாயம்’ என்றும் பொருள் வரலாம்; இங்கே ஒழுக்கரீதியாகச் சரியான வாழ்க்கை வழி என்பதே பொருத்தமானது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘திரும்புவது’ அல்லது ‘விலகுவது.’ மூலச்சொல் பின்னோக்கித் திரும்பும் கருத்தைக் கொண்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘ஒப்படைக்கப்பட்ட’ அல்லது ‘வழங்கப்பட்ட.’
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖττον ... ἦν
  choice: நலமாயிருந்திருக்கும்
  rationale: ஒப்பீட்டையும் கடந்தகாலத்திற்கு எதிரான சாத்தியநிலையையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐπεγνωκέναι / ἐπιγνοῦσιν
  choice: அறிந்துகொள்ளாமல் இருந்திருப்பதே / அறிந்துகொண்ட பின்பு
  rationale: ஒரே வினைச்சொல்லின் மறுபயன்பாட்டைத் தமிழிலும் காத்து, உண்மையான அல்லது திட்டவட்டமான அறிவைச் சுட்டுகிறது; ‘முழுமையாக அறிதல்’ என்று மிகைப்படுத்தவில்லை.
- source_word: ὁδὸν τῆς δικαιοσύνης
  choice: நீதியின் வழி
  rationale: ὁδός என்பதன் உருவகமான வாழ்க்கைமுறை அல்லது நடத்தைப் பாதை என்ற பொருளையும், δικαιοσύνη என்பதன் ஒழுக்கநீதிசார் பொருளையும் சுருக்கமாகக் காக்கிறது.
- source_word: ὑποστρέψαι ἐκ
  choice: இலிருந்து பின்வாங்குவது
  rationale: முன்பு அறிந்த ஒன்றிலிருந்து பின்னோக்கித் திரும்பும் கருத்தையும் பிரிவையும் வெளிப்படுத்துகிறது; வெறும் நடுநிலையான ‘திரும்புதல்’ என்பதைக் காட்டிலும் சூழலுக்கு ஏற்றது.
- source_word: παραδοθείσης αὐτοῖς
  choice: தங்களிடம் ஒப்படைக்கப்பட்ட
  rationale: கட்டளை அவர்களிடம் வழங்கப்பட்ட அல்லது கையளிக்கப்பட்டது என்ற இறந்தகாலச் செயப்பாட்டு பொருளைக் காக்கிறது; ‘பாரம்பரியமாகக் கையளிக்கப்பட்டது’ என்ற கூடுதல் கருத்தைத் திணிக்கவில்லை.
- source_word: ἁγίας ἐντολῆς
  choice: பரிசுத்த கட்டளை
  rationale: ஒருமையைப் பேணி, கட்டளையின் கடவுளுக்குரிய தூய்மையையும் மதிப்பையும் இயல்பான தமிழ் வேதாகம நடையில் தருகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணவிளக்கத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: இந்த வசனம் விசுவாசத்தை முற்றிலும் இழப்பதையா அல்லது மேலோட்டமான அறிமுகத்தையா குறிக்கிறது என்பது
  choice: அவர்கள் நீதியின் வழியை அறிந்துகொண்டதையும் பின்னர் பரிசுத்த கட்டளையிலிருந்து பின்வாங்கியதையும் உரை கூறும் அளவிலேயே மொழிபெயர்த்தல்
  alternative: இரட்சிப்பை இழந்தார்கள் என்றோ, உண்மையில் ஒருபோதும் விசுவாசிக்கவில்லை என்றோ வெளிப்படையாகப் பொருளுரைத்தல்
  rationale: கிரேக்க உரை உண்மையான அறிவையும் அதற்குப் பிந்தைய திரும்புதலையும் கூறுகிறது; ஆனால் நிலைத்திருத்தல் அல்லது விசுவாசத் துறப்பு பற்றிய சமயப்பிரிவுச் சார்ந்த முடிவைத் தானாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified வேதாகம நடையைப் பயன்படுத்துகிறது. நீண்ட கிரேக்க ஒப்பீட்டு அமைப்பு தமிழில் இயல்பாக இருக்கும்படி மறுவரிசைப்படுத்தப்பட்டாலும், ‘அறிதல்’ என்ற மறுபயன்பாடும், கட்டளையிலிருந்து பின்வாங்கும் தீவிரமும், ஒருமையான ‘கட்டளை’ என்பதும் காக்கப்பட்டுள்ளன.
