  text: especially those who go after the flesh in the desire for defilement and despise authority[a]. Bold, self-willed, they do not tremble as they blaspheme glorious ones[d][c][b],
translation:
  language: ta
  text: குறிப்பாக, தீட்டுக்கான வேட்கையோடு[a] மாம்சத்தைப் பின்தொடர்கிறவர்களையும், அதிகாரத்தை[b] இகழ்கிறவர்களையும் அவர் தண்டிப்பார். அவர்கள் துணிகரமானவர்கள்; தன்னிச்சையாக நடப்பவர்கள். மகிமைமிக்கவர்களை[c] பழித்துரைக்கும்போது அவர்கள் நடுங்குவதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீட்டான இச்சையோடு” அல்லது “தீட்டுப்படுத்தும் இச்சையோடு.”
    reason: lexical_alternative
  - marker: b
    text: “அதிகாரம்” என்பதற்கு “ஆளுகை” அல்லது “ஆண்டத்துவம்” என்றும் பொருள் இருக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “மகிமைமிக்கவர்கள்” என்பது மகிமை பொருந்திய பரலோக உயிர்களைக் குறிக்கலாம்; ஒருவேளை தேவதூதர்களாக இருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: μάλιστα
  choice: குறிப்பாக
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட தண்டனைக்கு உள்ளாவோரில் இக்குழுவைச் சிறப்பாக வலியுறுத்துகிறது.
- source_word: ὀπίσω σαρκὸς
  choice: மாம்சத்தைப் பின்பற்றி
  rationale: σάρξ என்பதன் உருவகத்தையும் ஒழுக்கரீதியான அழுத்தத்தையும் காக்கிறது; ‘பாவ இயல்பு’ என்று விளக்கி ambiguity-ஐ முடித்துவிடவில்லை.
- source_word: ἐν ἐπιθυμίᾳ μιασμοῦ
  choice: தீட்டுப்படுத்தும் இச்சையோடு
  rationale: μιασμός குறிக்கும் ஒழுக்கத் தீட்டையும் ἐπιθυμία குறிக்கும் தவறான வேட்கையையும் இயல்பான தமிழில் தருகிறது; கிரேக்கப் பெயர்ச்சொல் தொடர்பின் நுட்பமான ambiguity அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: πορευομένους
  choice: செல்கிறவர்கள்
  rationale: வாழ்க்கை நடத்தையைக் குறிக்கும் வினையெச்சத்தை, ‘பின்பற்றி’ என்பதோடு இயல்பாக இணைக்கிறது.
- source_word: κυριότητος
  choice: அதிகாரம்
  rationale: குறிப்பிட்ட அதிகாரத்தின் அடையாளத்தை நிர்ணயிக்காமல், ஆளுகை அல்லது தலைமை என்ற பரந்த பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: καταφρονοῦντας
  choice: இகழ்கிறவர்கள்
  rationale: வெறும் அலட்சியம் அல்லாமல் செயற்படும் அவமதிப்பை வெளிப்படுத்துகிறது.
- source_word: Τολμηταί
  choice: துணிகரமானவர்கள்
  rationale: சூழலில் கண்டனத்துக்குரிய அஞ்சாமையையும் வரம்புமீறிய துணிவையும் குறிக்கிறது.
- source_word: αὐθάδεις
  choice: தன்னிச்சையாக நடப்பவர்கள்
  rationale: தன் விருப்பத்தையே முன்னிறுத்தும் பிடிவாதமான சுயநோக்கை நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: δόξας
  choice: மகிமைக்குரியவர்கள்
  rationale: மகிமை பொருந்திய பரலோக உயிர்களைக் குறிக்கக்கூடிய பன்மையைத் தருகிறது; ‘தேவதூதர்கள்’ என்று குறிப்பாகத் தீர்மானிக்கவில்லை.
- source_word: οὐ τρέμουσιν
  choice: நடுங்குவதில்லை
  rationale: அச்சம் அல்லது பயபக்தியால் உடல் நடுங்கும் வலிமையான உருவகத்தைப் பாதுகாக்கிறது.
- source_word: βλασφημοῦντες
  choice: பழித்துப் பேசும்போது
  rationale: தேவனை மட்டுமே இலக்காகக் கொண்டதாகத் தோன்றக்கூடிய சொல்லைத் தவிர்த்து, உயர்ந்தவர்களுக்கு எதிரான அவதூறான பேச்சை வெளிப்படுத்துகிறது; நிகழ்கால வினையெச்சத் தொடர்பும் காக்கப்படுகிறது.
theological_decisions:
- issue: κυριότης என்பதன் குறிப்பு
  choice: பொதுவான ஆளுகை அதிகாரம்; பிரதான உரையில் குறிப்பு திறந்துவைக்கப்படுகிறது
  alternative: ஆண்டவரின் ஆளுகை அல்லது பரலோக அதிகாரம்
  rationale: சொல் ‘அதிகாரம்’, ‘ஆளுகை’, ‘ஆண்டத்துவம்’ ஆகிய பொருள்களை ஏற்கக்கூடும். இவ்வசனம் குறிப்பைத் தெளிவாக நிர்ணயிக்காததால் ஒரு தனிப்பட்ட கிறிஸ்தவியல் விளக்கத்தைச் சேர்க்கவில்லை.
- issue: δόξας என்பதன் குறிப்பு
  choice: மகிமைக்குரியவர்கள் என அடையாளம் குறிப்பிடப்படாமல் வைக்கப்படுகிறது
  alternative: தேவதூதர்கள் அல்லது மற்ற பரலோக மகிமையுள்ள உயிர்கள்
  rationale: அடுத்த வசனத்தின் தேவதூதர் குறிப்பு பரலோக உயிர்கள் என்ற வாசிப்பை ஆதரித்தாலும், இங்கே உள்ள δόξας அதைவிட ambiguity உடையது; ஆகவே பிரதான உரை அதைத் தீர்மானிக்கவில்லை.
- issue: βλασφημοῦντες என்பதன் இலக்கணத் தொடர்பு
  choice: ‘பழித்துப் பேசும்போது ... நடுங்குவதில்லை’
  alternative: ‘பழித்துப் பேசுவதற்கு நடுங்குவதில்லை’
  rationale: கிரேக்க நிகழ்கால வினையெச்சம் பிரதான வினையோடு ஒரே நேரத்தில் நிகழும் செயலை இயல்பாகக் குறிக்கிறது; நோக்கம் அல்லது முடிவைக் கட்டாயப்படுத்தாமல் அந்தத் தொடர்பு காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் தொடக்கத் தொடர்பு தமிழில் முழு வாக்கியமாகத் தெளிவதற்காக முந்தைய வசனத்திலிருந்து உள்ளடங்கிய ‘அவர் தண்டிப்பார்’ சேர்க்கப்பட்டுள்ளது. குறுகிய, கண்டனத் தொனியுள்ள Τολμηταί, αὐθάδεις ஆகிய சொற்கள் இரண்டு நேரடி வாக்கியப் பகுதிகளாக வழங்கப்பட்டுள்ளன.
