id: 2PE.2.20
reference: 2 Peter 2:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ γὰρ ἀποφυγόντες τὰ μιάσματα τοῦ κόσμου ἐν ἐπιγνώσει τοῦ ⸀κυρίου καὶ σωτῆρος Ἰησοῦ Χριστοῦ τούτοις δὲ πάλιν ἐμπλακέντες ἡττῶνται, γέγονεν αὐτοῖς τὰ ἔσχατα χείρονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/020.yaml
  text: For if[a], after escaping the defilements of the world through the knowledge of the Lord and Savior Jesus the Messiah, they are again entangled in these things and overcome[b], the last state has become worse for them than the first.
translation:
  language: ta
  text: ஏனெனில், ஆண்டவரும் மீட்பருமான இயேசு மெசியாவைப் பற்றிய அறிவின் மூலம் உலகத்தின் மாசுகளிலிருந்து தப்பியவர்கள், மீண்டும் அவற்றில் சிக்கித் தோற்கடிக்கப்படுகிறார்களோ, அவர்களுடைய பிந்தைய நிலை முந்தைய நிலையைவிட மோசமானதாகிவிட்டது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பிந்தையவை முந்தையவற்றைவிட மோசமானவையாகிவிட்டன’ என்பது இன்னும் சொல்லுக்குச் சொல் அமைந்த மொழிபெயர்ப்பு. இங்கு ஒருவரின் பின்னைய நிலையையும் முந்தைய நிலையையும் ஒப்பிடுவதாகப் பொருள் கொள்ளப்பட்டுள்ளது.
    reason: idiom_clarification
lexical_decisions:
- source_word: ἀποφυγόντες
  choice: தப்பியவர்கள்
  rationale: இறந்தகாலப் பங்கேற்புவினை, பின்னர் மீண்டும் சிக்கிக்கொள்வதற்கு முன் நிகழ்ந்த தப்புதலைக் குறிக்கிறது; தமிழில் இயல்பாகப் பெயரெச்சத் தொடராக வழங்கப்பட்டுள்ளது.
- source_word: τὰ μιάσματα τοῦ κόσμου
  choice: உலகத்தின் தீட்டுகள்
  rationale: μίασμα என்பதில் ஒழுக்கரீதியான மாசும் தீட்டும் அடங்குகின்றன. ‘தீட்டுகள்’ அந்த மாசுபடுத்தும் தன்மையைச் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: ἐν ἐπιγνώσει
  choice: அறிந்ததன் மூலம்
  rationale: ἐν இங்கு வழிமுறை அல்லது கருவிப் பொருளைத் தருகிறது. ἐπίγνωσις என்பதன் வலிமையை ‘முழுமையான அறிவு’ என்று கட்டாயமாக மிகைப்படுத்தாமல், இயல்பான தமிழில் செயல்முறை அறிவாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: κυρίου καὶ σωτῆρος
  choice: ஆண்டவரும் மீட்பருமான
  rationale: இரு பட்டங்களும் ஒரே நபரான இயேசுவைக் குறிக்கும் வகையில் தமிழில் இணைக்கப்பட்டுள்ளன.
- source_word: Ἰησοῦ Χριστοῦ
  choice: மெசியா இயேசு
  rationale: Χριστός இங்கு பட்டத்தன்மையைத் தக்கவைக்க ‘மெசியா’ எனவும், தமிழில் தெளிவாக ஒரே நபரின் பட்டமும் பெயரும் அமைய ‘மெசியா இயேசு’ எனவும் வழங்கப்பட்டுள்ளது.
- source_word: πάλιν ἐμπλακέντες
  choice: மீண்டும் அவற்றில் சிக்கி
  rationale: முன்பு தப்பிய அதே தீட்டுகளில் மறுபடியும் அகப்பட்டுக்கொள்ளும் உருவகத்தைத் தக்கவைக்கிறது.
- source_word: ἡττῶνται
  choice: அவற்றால் தோற்கடிக்கப்பட்டால்
  rationale: வினைச்சொல் அடக்கப்படுதல் அல்லது வெல்லப்படுதல் என்ற பொருளைக் கொண்டது; செயப்படுபொருளான தீட்டுகளுடனான தொடர்பு தமிழில் வெளிப்படையாகக் காட்டப்பட்டுள்ளது.
- source_word: τὰ ἔσχατα χείρονα τῶν πρώτων
  choice: பிந்தைய நிலை முந்தைய நிலையைவிட மோசமானதாக
  rationale: சொல்லுக்குச் சொல் ‘கடைசியானவை’ என்பதற்குப் பதிலாக, இறுதி காலத்தைத் தனிப்படக் குறிக்காமல் ஒருவரின் பின்னைய நிலையைச் சுட்டும் கிரேக்க மரபுத்தொடரின் பொருள் வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: ἐπίγνωσις குறிப்பிடும் அறிவின் தன்மை
  choice: ‘அறிந்ததன் மூலம்’ என்று மட்டும் மொழிபெயர்த்து, அது இரட்சிப்பளிக்கும் உள்ளார்ந்த அறிவா அல்லது உண்மையான அறிமுகமா என்பதைத் தீர்மானிக்காமல் விடுதல்
  alternative: ‘இரட்சிப்பளிக்கும் அறிவு’ அல்லது ‘வெளிப்புற அறிவு’
  rationale: கிரேக்கச் சொல் தனியாக இந்த இறையியல் விவாதத்தை முடிவுசெய்யாது. மொழிபெயர்ப்பு உரையிலுள்ள பதற்றத்தையும் தெளிவின்மையையும் பாதுகாக்கிறது.
- issue: Χριστός என்பதன் பட்டத்தன்மை
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இந்தச் சூழலில் Χριστός ஒரு பட்டமாகக் கேட்பதால் அதன் பொருளை நேரடியாக வெளிப்படுத்தும் ‘மெசியா’ பயன்படுத்தப்பட்டுள்ளது.
- issue: தப்பியவர்கள் முன்பு உண்மையாக இரட்சிக்கப்பட்டவர்களா என்பது
  choice: உரை கூறும் தப்புதல், மறுபடியும் சிக்குதல், தோற்கடிக்கப்படுதல் ஆகியவற்றை மட்டும் கூறுதல்
  alternative: அவர்கள் இரட்சிப்பை இழந்தார்கள் அல்லது ஒருபோதும் உண்மையாக இரட்சிக்கப்படவில்லை என்று விளக்குதல்
  rationale: இந்த இரு கோட்பாட்டு முடிவுகளில் எதையும் வசனம் வெளிப்படையாகத் தீர்மானிக்கவில்லை; ஆகவே மொழிபெயர்ப்பு எந்தப் பிரிவுச் சார்ந்த முடிவையும் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘தீட்டுகள்’, ‘சிக்கி’, ‘தோற்கடிக்கப்பட்டால்’ ஆகியவை மூலத்தின் மாசு, வலைப்படுதல், வெல்லப்படுதல் என்ற படிமங்களைத் தக்கவைக்கின்றன. வசனத்தின் நீண்ட நிபந்தனை அமைப்பு தமிழில் வாசிக்க இயலுமாறு சீரமைக்கப்பட்டாலும் அதன் தர்க்க உறவு பாதுகாக்கப்பட்டுள்ளது.
