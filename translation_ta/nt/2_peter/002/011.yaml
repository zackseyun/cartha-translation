source:
  edition: SBLGNT
  text: ὅπου ἄγγελοι ἰσχύϊ καὶ δυνάμει μείζονες ὄντες οὐ φέρουσιν κατ’ ⸀αὐτῶν βλάσφημον κρίσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/011.yaml
  text: whereas angels[a], though greater in might and power[b], do not bring a slanderous judgment against them.
translation:
  language: ta
  text: ஆனால், வலிமையிலும் ஆற்றலிலும் மேலானவர்களாக இருந்தபோதிலும், தேவதூதர்கள் அவர்களுக்கு[b] எதிராகப் பழிதூற்றும்[a] தீர்ப்பை முன்வைப்பதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவதூறான தீர்ப்பு’ அல்லது ‘நிந்திக்கும் தீர்ப்பு’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க அடைமொழி இழிவுபடுத்தும், நிந்திக்கும் அல்லது பழிதூற்றும் பேச்சைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘அவர்கள்’ என்பது முந்தைய வசனத்திலுள்ள ‘மகிமைக்குரியவர்கள்’ என்பவர்களைக் குறிக்கக்கூடும்; ஆனால் பேதுரு இங்கு அவர்களை இன்னும் தெளிவாக அடையாளப்படுத்தவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπου
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்டவர்களின் நடத்தைக்கும் தேவதூதர்களின் நடத்தைக்கும் இடையிலான முரண்பாட்டை இங்கு ὅπου சுட்டுகிறது; தமிழில் ‘ஆனால்’ இயல்பாக அந்த எதிர்மறை ஒப்பீட்டை வெளிப்படுத்துகிறது.
- source_word: ἄγγελοι
  choice: தேவதூதர்கள்
  rationale: இச்சூழலில் மனிதத் தூதர்கள் அல்ல, பரலோக உயிர்களே குறிக்கப்படுகின்றனர்.
- source_word: ἰσχύϊ καὶ δυνάμει
  choice: வலிமையிலும் ஆற்றலிலும்
  rationale: இரண்டு நெருங்கிய பொருளுடைய சொற்களையும் தனித்தனியாக வைத்துக்கொண்டு, எந்த வகையில் தேவதூதர்கள் மேலானவர்கள் என்பதைத் தமிழ் இயல்பாகக் காட்டுகிறது.
- source_word: μείζονες ὄντες
  choice: மேலானவர்களாக இருக்கும் ... கூட
  rationale: 'பங்கேற்புச் சொல்லின் concessive தன்மையை ‘கூட’ வெளிப்படுத்துகிறது: அவர்கள் மேலானவர்களாக இருந்தபோதிலும் அத்தகைய தீர்ப்பை முன்வைப்பதில்லை.'
- source_word: οὐ φέρουσιν
  choice: முன்வைப்பதில்லை
  rationale: φέρω + κρίσιν என்பது தீர்ப்பை அல்லது குற்றச்சாட்டை முன்கொண்டுவருதல் என்ற நீதித்துறைச் சாயலைக் கொண்டது; ‘முன்வைப்பதில்லை’ என்பது இதை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: κατ’ αὐτῶν
  choice: அவர்களுக்கு எதிராக
  rationale: மூலத்தில் உள்ள பன்மைச் சுட்டுப்பெயரைத் தெளிவுபடுத்தாமல் அப்படியே பாதுகாக்கிறது.
- source_word: βλάσφημον
  choice: பழிதூற்றும்
  rationale: இங்கு சொல் இழிவுபடுத்தும், நிந்திக்கும் அல்லது அவதூறான பேச்சைக் குறிக்கலாம்; கடவுளுக்கு எதிரான பேச்சு என்ற குறுகிய பொருளைத் திணிக்காமல் ‘பழிதூற்றும்’ பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: κρίσιν
  choice: தீர்ப்பு
  rationale: நீதித்துறை மதிப்பீடு அல்லது தீர்ப்பு என்ற பரந்த பொருளைத் தக்கவைக்கிறது; அதின் பழிதூற்றும் தன்மையை அடைமொழி விளக்குகிறது.
theological_decisions:
- issue: αὐτῶν (‘அவர்கள்’) என்பதன் முந்தைய வசனத்திலுள்ள ‘மகிமைக்குரியவர்கள்’ என்பதுடனான தொடர்பு
  choice: முதன்மை உரையில் ‘அவர்களுக்கு’ என்று மட்டுமே வைக்கப்பட்டுள்ளது.
  alternative: விழுந்துபோன தேவதூதர்கள்; மனித அதிகாரிகள்; பொதுவாக மகிமைமிக்க பரலோக உயிர்கள்
  rationale: இந்த வசனம் சுட்டுப்பெயரின் முன்னிலையை இன்னும் குறிப்பாக அடையாளப்படுத்தவில்லை. எனவே ஒரு குறிப்பிட்ட கோட்பாட்டு விளக்கத்தை உரைக்குள் சேர்க்காமல், கிரேக்கத்தின் தெளிவின்மையை மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘தேவதூதர்கள்கூட’ என்பது மூலத்தின் concessive வலிமையை வெளிப்படுத்துகிறது; ‘அவர்கள்’ என்பதன் தெளிவின்மை திட்டமிட்டுப் பாதுகாக்கப்பட்டுள்ளது.
