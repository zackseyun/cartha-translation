review_pass:
  verdict: revise
  source_fidelity: The opening accurately conveys the perfect συμβέβηκεν and the elliptical force of τὸ τῆς ἀληθοῦς παροιμίας. The proverbial sense and the implied verbal completion in both images are appropriately represented. However, ‘குளிப்பாட்டப்பட்ட’ specifically introduces an external causer (‘made to bathe’) that λουσαμένη does not specify; its middle/passive form is best left without that added agency in Tamil.
  naturalness: The rendering is clear, dignified, and readily understandable in modern standard Tamil. ‘குளித்த பெண்பன்றி’ is natural in a proverbial quotation and avoids the somewhat cumbersome causative-passive wording.
  terminology: ‘உண்மையான பழமொழி,’ ‘வாந்தி,’ ‘பெண்பன்றி,’ ‘சேறு,’ and ‘புரளுதல்’ are suitable, accurate choices. The footnote wording is adjusted slightly for more idiomatic Tamil while retaining the formal alternative and the literal participial construction.
  issues:
  - severity: medium
    issue: ‘குளிப்பாட்டப்பட்ட பெண்பன்றி’ adds an external agent/cause.
    rationale: The Greek λουσαμένη is morphologically capable of middle or passive sense and does not identify someone as causing the sow to bathe. The Tamil causative-passive ‘குளிப்பாட்டப்பட்ட’ narrows this ambiguity and adds agency. ‘குளித்த’ gives the resulting washed/bathed state without importing an external actor.
