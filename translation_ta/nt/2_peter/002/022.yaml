  text: ⸀συμβέβηκεν αὐτοῖς τὸ τῆς ἀληθοῦς παροιμίας· Κύων ἐπιστρέψας ἐπὶ τὸ ἴδιον ἐξέραμα, καί· Ὗς λουσαμένη εἰς ⸀κυλισμὸν βορβόρου.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/022.yaml
  text: 'What the true proverb says has happened to them: “A dog returns to its own vomit,” and[b][a], “A washed sow returns to wallowing in the mud.”'
translation:
  language: ta
  text: உண்மையான பழமொழி சொல்வது அவர்களுக்கு நடந்திருக்கிறது:[a] “நாய் தனது வாந்தியிடமே திரும்புகிறது”;[b] மேலும், “குளித்த பெண்பன்றி சேற்றில் புரளத் திரும்புகிறது.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்வடிவத்திற்கு நெருக்கமாக, “உண்மையான பழமொழியின் சொல் அவர்களுக்கு நடந்திருக்கிறது.”
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “நாய், தனது வாந்தியிடமே திரும்பிய பின் … மேலும், குளித்த பெண்பன்றி, சேற்றில் புரளுவதற்கு.” முதல் வரி நீதிமொழிகள் 26:11-ஐ எதிரொலிக்கிறது.'
    reason: cross_reference
lexical_decisions:
- source_word: συμβέβηκεν αὐτοῖς
  choice: அவர்களுக்கு நடந்திருக்கிறது
  rationale: நிகழ்ந்து அதன் விளைவு இப்போதும் நிலைப்பதைக் காட்டும் நிறைவேற்றுக் காலத்தின் வலிமையை இயல்பான தமிழில் தருகிறது; αὐτοῖς என்பதையும் ‘அவர்களுக்கு’ என்று நேரடியாகப் பேணுகிறது.
- source_word: τὸ τῆς ἀληθοῦς παροιμίας
  choice: உண்மையான பழமொழி சொல்வது
  rationale: சற்றே விடுபட்ட அமைப்புடைய கிரேக்கத் தொடரை இயல்பான தமிழில் வெளிப்படுத்தி, அந்தப் பழமொழியின் உள்ளடக்கம் இவர்களுடைய நிலையில் மெய்ப்பட்டது என்ற பொருளைப் பேணுகிறது.
- source_word: Κύων ἐπιστρέψας ἐπὶ τὸ ἴδιον ἐξέραμα
  choice: நாய் தனது வாந்தியிடமே திரும்புகிறது
  rationale: பழமொழிக்குரிய பொதுப்படையான வலிமையையும் ‘தனது சொந்த வாந்தி’ என்ற கருத்தையும் இயல்பாகத் தருகிறது; நீதிமொழிகள் 26:11-ன் எதிரொலியையும் பேணுகிறது.
- source_word: Ὗς λουσαμένη
  choice: குளிப்பாட்டப்பட்ட பெண்பன்றி
  rationale: Ὗς-இன் பெண்பால் நுணுக்கத்தை ‘பெண்பன்றி’ என்று பேணுகிறது. λουσαμένη என்பதன் நடு/செயப்பாட்டு வடிவத்தைத் தேவையின்றி தற்செயலாகத் தீர்மானிக்காமல், சூழலுக்கு இயல்பான செயப்பாட்டு வாசிப்பை வழங்குகிறது.
- source_word: εἰς κυλισμὸν βορβόρου
  choice: சேற்றில் புரளத் திரும்புகிறது
  rationale: κυλισμός-இன் புரளுதல்/உழலுதல் படிமத்தையும் βόρβορος-இன் சேறு/அசுத்தமான சகதி என்ற பொருளையும் தெளிவான நவீன தமிழில் தருகிறது; கிரேக்கத்தில் விடுபட்டுள்ள வினையை பழமொழியின் பொருளுக்கேற்ப வெளிப்படையாக்குகிறது.
theological_decisions:
- issue: விடுபட்ட அமைப்புடைய பழமொழி மேற்கோளின் வலிமை
  choice: பழமொழி சொல்வது அவர்களுடைய நிலையில் நடந்திருக்கிறது என்று மொழிபெயர்த்தல்
  alternative: ‘உண்மையான பழமொழியின் சொல் அவர்களுக்கு நடந்திருக்கிறது’ என்று அதிக வடிவநேர்மையுடன் மொழிபெயர்த்தல்
  rationale: கிரேக்கத்தின் விடுபட்ட அமைப்பை வாசிக்கத்தக்க தமிழில் அளிக்கிறது; அதேவேளை பின்னடைவைச் சித்தரிக்கும் படிமத்திற்கு அப்பால் இரட்சிப்பு அல்லது விசுவாசவிலகல் குறித்த கூடுதல் கோட்பாட்டை வசனத்திற்குள் சேர்ப்பதில்லை.
- issue: λουσαμένη என்பதன் நடு/செயப்பாட்டு தெளிவின்மை
  choice: ‘குளிப்பாட்டப்பட்ட’ என்று சூழலுக்கேற்ற செயப்பாட்டு வடிவம்
  alternative: ‘குளித்துக்கொண்ட’ அல்லது ‘தன்னைக் கழுவிக்கொண்ட’
  rationale: கிரேக்க வடிவம் நடு அல்லது செயப்பாட்டுப் பொருளை ஏற்கக்கூடியது. இங்கு பன்றியின் சுத்தமான நிலையே முக்கியம்; அதை யார் குளிப்பாட்டினர் என்பதற்கு இறையியல் முக்கியத்துவம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் dignified நடையைப் பயன்படுத்துகிறது. ‘வாந்தி’, ‘சேறு’, ‘புரளுதல்’ ஆகிய தெளிவான படிமங்களை மென்மையாக்காமல் பேணுகிறது. மேற்கோள்களில் தமிழுக்கேற்ற இயல்பான வினைமுற்றுகள் சேர்க்கப்பட்டுள்ளன; அடிக்குறிப்பில் கிரேக்கத்தின் சுருக்கமான பங்கேற்புவினை அமைப்பு காட்டப்பட்டுள்ளது.
