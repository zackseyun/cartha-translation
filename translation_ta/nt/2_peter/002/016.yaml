language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἔλεγξιν δὲ ἔσχεν ἰδίας παρανομίας· ὑποζύγιον ἄφωνον ἐν ἀνθρώπου φωνῇ φθεγξάμενον ἐκώλυσεν τὴν τοῦ προφήτου παραφρονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/016.yaml
  text: 'But he received a rebuke for his own transgression: a mute beast of burden[a], speaking with a human voice[b], restrained the prophet’s madness.'
translation:
  language: ta
  text: 'ஆனால், அவன் தன் சட்டமீறலுக்காகக் கடிந்துரை பெற்றான்: பேச்சற்ற ஒரு சுமை விலங்கு[a], மனிதக் குரலில்[b] பேசி, அந்தத் தீர்க்கதரிசியின் மதிகேட்டைத் தடுத்து நிறுத்தியது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், ‘சுமை விலங்கு’; இது பிலேயாமின் கழுதையைக் குறிக்கிறது (எண் 22:28–30).
    reason: cross_reference
  - marker: b
    text: அல்லது, ‘ஒரு மனிதனின் குரலில்.’ விலங்கின் பேச்சற்ற தன்மையோடு மனிதக் குரலை வேறுபடுத்திக் காட்டுவதே கிரேக்கச் சொற்றொடரின் பொருளாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγξιν
  choice: கடிந்துகொள்ளப்பட்டான்
  rationale: ἔλεγξις என்பது தவற்றைச் சுட்டிக்காட்டும் கடிந்துரையைக் குறிக்கிறது. தமிழ் வாக்கியத்தில் இயல்பாக அமைய பெயர்ச்சொல் அமைப்பு வினை அமைப்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: ἰδίας παρανομίας
  choice: தன் அத்துமீறலுக்காக
  rationale: ἰδίας தனிப்பட்ட பொறுப்பை வலியுறுத்துகிறது; παρανομία வெறும் தவறைவிட வலுவான, வரம்பை அல்லது நெறியை மீறும் செயலைக் குறிக்கிறது. ‘அத்துமீறல்’ அந்த வலிமையைத் தக்கவைக்கிறது.
- source_word: ὑποζύγιον
  choice: சுமைதாங்கும் விலங்கு
  rationale: இந்தச் சொல் நுகத்தடியின் கீழுள்ள அல்லது சுமை சுமக்கும் விலங்கைப் பொதுவாகக் குறிக்கிறது. எண்ணாகமப் பின்னணியில் இது பிலேயாமின் கழுதை என்றாலும், மூலத்தின் பொதுவான சொல்லாட்சி முதன்மை உரையில் பாதுகாக்கப்படுகிறது.
- source_word: ἄφωνον
  choice: பேச்சற்ற
  rationale: ἄφωνος குரல் அல்லது பேச்சு இல்லாததைக் குறிக்கிறது. விலங்கு மனிதக் குரலில் பேசிய முரண்பாட்டை ‘பேச்சற்ற’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐν ἀνθρώπου φωνῇ
  choice: மனிதக் குரலில்
  rationale: இங்கு ἄνθρωπος ஆண் பாலினத்தைக் குறிப்பதற்குப் பதிலாக விலங்குக்கும் மனிதருக்கும் உள்ள வேறுபாட்டைக் காட்டுகிறது. ஆகவே ‘மனிதக் குரலில்’ என்பதே பொருள்துல்லியமானது.
- source_word: φθεγξάμενον
  choice: பேசி
  rationale: இந்தப் பங்கேற்பு வினை தெளிவான, புரிந்துகொள்ளத்தக்க உரைப்பைக் குறிக்கிறது; ‘பேசி’ இயல்பான நவீனத் தமிழ்.
- source_word: ἐκώλυσεν
  choice: தடுத்து நிறுத்தியது
  rationale: κωλύω தடுத்தல், கட்டுப்படுத்தல் அல்லது தொடராமல் நிறுத்துதல் என்ற பொருளுடையது. ‘தடுத்து நிறுத்தியது’ நிகழ்வின் வலிமையையும் தமிழின் இயல்பையும் காக்கிறது.
- source_word: παραφρονίαν
  choice: மதிகேட்டை
  rationale: παραφρονία பகுத்தறிவற்ற மனநிலையையோ பைத்தியக்காரத்தனத்தையோ குறிக்கிறது. ‘மதிகேடு’ அதன் வலுவான எதிர்மறைப் பொருளை dignified, இயல்பான தமிழில் தருகிறது.
- source_word: τοῦ προφήτου
  choice: அந்தத் தீர்க்கதரிசியின்
  rationale: குறிப்பிட்ட தீர்க்கதரிசியைச் சுட்டும் கிரேக்க உரையைத் தமிழில் தெளிவாக்க ‘அந்தத்’ சேர்க்கப்பட்டுள்ளது; இது பிலேயாமின் நடத்தையை அங்கீகரிக்காமல், உரையின் அடையாளப்படுத்தலை மட்டும் பிரதிபலிக்கிறது.
theological_decisions:
- issue: ὑποζύγιον என்பதைப் பின்னணியின் அடிப்படையில் நேரடியாக ‘கழுதை’ என்று குறிப்பிடலாமா
  choice: முதன்மை உரையில் ‘சுமைதாங்கும் விலங்கு’ என்ற பொதுவான சொல்லைப் பேணுதல்
  alternative: கழுதை
  rationale: எண்ணாகமம் 22:28–30 பிலேயாமின் கழுதையையே குறிக்கிறது என்பது தெளிவானாலும், இவ்வசனத்தின் கிரேக்க உரை ὄνος என்பதற்குப் பதிலாக ὑποζύγιον என்ற பொதுச் சொல்லைப் பயன்படுத்துகிறது. எனவே குறிப்பான அடையாளம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἐν ἀνθρώπου φωνῇ என்பதில் ἀνθρώπου-ஐ எவ்வாறு மொழிபெயர்ப்பது
  choice: மனிதக் குரலில்
  alternative: ஒரு மனிதனின் குரலில் / ஓர் ஆணின் குரலில்
  rationale: இங்கு நோக்கம் ஆண்–பெண் வேறுபாடு அல்ல; பேச்சற்ற விலங்குக்கும் மனிதப் பேச்சுக்கும் உள்ள வேறுபாடே. ‘மனிதக் குரலில்’ அந்தப் பொருளைத் துல்லியமாகக் காக்கிறது.
- issue: παραφρονίαν என்பதன் தீவிரத்தைத் தமிழில் எவ்வாறு வெளிப்படுத்துவது
  choice: மதிகேடு
  alternative: பைத்தியக்காரத்தனம் / மூடத்தனம்
  rationale: ‘மூடத்தனம்’ மூலச்சொல்லின் வலிமையைக் குறைக்கும்; ‘பைத்தியக்காரத்தனம்’ நவீன தமிழில் தேவையற்ற மருத்துவ அல்லது இழிவான ஒலிப்பை ஏற்படுத்தலாம். ‘மதிகேடு’ பகுத்தறிவற்ற தீவிரமான போக்கைச் சுருக்கமாகப் பேணுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வழிபாட்டு வாசிப்புக்கும் தனிப்பட்ட வாசிப்புக்கும் ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் பொதுவான ‘சுமைதாங்கும் விலங்கு’ என்ற சொல்லும் ‘மதிகேடு’ என்பதன் வலிமையும் பாதுகாக்கப்பட்டுள்ளன; பின்னணியிலிருந்து ‘கழுதை’ என்பதை முதன்மை உரைக்குள் இறக்குமதி செய்யவில்லை.
