source:
  edition: SBLGNT
  text: οὗτοι δέ, ὡς ἄλογα ζῷα ⸂γεγεννημένα φυσικὰ⸃ εἰς ἅλωσιν καὶ φθοράν, ἐν οἷς ἀγνοοῦσιν βλασφημοῦντες, ἐν τῇ φθορᾷ αὐτῶν ⸂καὶ φθαρήσονται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/012.yaml
  text: But these[a], like irrational animals—creatures of instinct, born for capture and destruction—blaspheming about things they do not understand, will also be destroyed in their destruction[d][c][b],
translation:
  language: ta
  text: ஆனால் இவர்கள், பிடிபட்டு அழிவதற்காக இயல்பாகப் பிறந்த பகுத்தறிவற்ற விலங்குகளைப் போல[a][b], தாங்கள் அறியாதவற்றைப் பற்றி இழிவாகப் பேசுகிறார்கள்[c]; தங்கள் அழிவிலேயே தாங்களும் அழிந்துபோவார்கள்[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பகுத்தறியாத விலங்குகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் சொற்சொல்லாக, ‘இயல்பானவையாகப் பிறந்தவை’; இயற்கை உந்துதலின்படி இயங்கும் உயிரினங்கள் என்பதே கருத்து.
    reason: lexical_alternative
  - marker: c
    text: ‘தாங்கள் அறியாதவற்றைத் தூஷித்துப் பேசுகிறார்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: d
    text: கிரேக்கத்தில் ‘அழிவு’ மற்றும் ‘அழிந்துபோவார்கள்’ என்பதற்கு ஒரே வேரைச் சேர்ந்த சொற்கள் பயன்படுத்தப்பட்டு, அழிவைப் பற்றிய சொல்விளையாட்டு உருவாக்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλογα ζῷα
  choice: பகுத்தறிவற்ற விலங்குகள்
  rationale: ἄλογα என்பது பேச இயலாதவை என்பதைவிட பகுத்தறிவு இல்லாதவை என்ற கருத்தை இங்கு தருகிறது; நவீன தமிழில் தெளிவாகவும் ஒப்பீட்டின் கூர்மையைத் தக்கவைத்தும் உள்ளது.
- source_word: γεγεννημένα φυσικὰ
  choice: இயல்புணர்வால் இயக்கப்படப் பிறந்து
  rationale: கிரேக்கச் சொற்றொடர் பிறப்பு மற்றும் இயற்கை உந்துதலின்படி இயங்குதல் ஆகிய இரண்டையும் சுருக்கமாக இணைக்கிறது. தமிழ் வடிவம் இரண்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἰς ἅλωσιν καὶ φθοράν
  choice: பிடிபட்டு அழிவதற்குரிய
  rationale: εἰς இங்கு நோக்கம் அல்லது விளைவைக் குறிக்கலாம். ἅλωσις என்பதன் ‘பிடிபடுதல்’ பொருளையும் φθορά என்பதன் ‘அழிவு’ பொருளையும் இவ்வடிவம் காக்கிறது.
- source_word: ἐν οἷς ἀγνοοῦσιν
  choice: தங்களுக்குத் தெரியாதவற்றை
  rationale: οἷς என்பது பன்மை நடுநிலை வடிவம்; எனவே நபர்களைக் குறிப்பிடாமல், அவர்கள் அறியாத காரியங்கள் அல்லது பொருள்களைத் திறந்த நிலையில் வைக்கிறது.
- source_word: βλασφημοῦντες
  choice: பழித்துப் பேசுகிறார்கள்
  rationale: βλασφημέω என்பது தூஷித்தல், அவதூறாக அல்லது இழிவாகப் பேசுதல் ஆகிய பொருள்களை உடையது. குறிப்பிடப்பட்ட பொருள் தெளிவாக இல்லாததால், தமிழில் இறைநிந்தையை மட்டும் குறிக்கும் சொல்லைக் கட்டாயப்படுத்தாமல் கடுமையான பழிப்புப் பேச்சை வெளிப்படுத்துகிறது.
- source_word: ἐν τῇ φθορᾷ αὐτῶν καὶ φθαρήσονται
  choice: தங்கள் அழிவிலேயே தாங்களும் அழிந்துபோவார்கள்
  rationale: φθορά மற்றும் φθαρήσονται ஆகிய ஒரே வேரைச் சேர்ந்த சொற்களின் மறுமொழியை ‘அழிவு/அழிந்துபோவார்கள்’ எனத் தக்கவைக்கிறது; ἐν என்பதையும் ‘-இலேயே’ என்று பிரதிபலிக்கிறது.
theological_decisions:
- issue: βλασφημοῦντες என்பதன் பொருள்
  choice: பழித்துப் பேசுகிறார்கள்
  alternative: இறைநிந்தை செய்கிறார்கள் / தூஷிக்கிறார்கள்
  rationale: கிரேக்க வினை கடுமையான இழிவுப் பேச்சைக் குறித்தாலும், அதன் பொருள் இவ்வசனத்தில் வெளிப்படையாகச் சொல்லப்படவில்லை. ‘இறைநிந்தை’ என்று மொழிபெயர்ப்பது அந்தப் பழிப்பின் இலக்கைத் தேவையின்றி வரையறுக்கும்; ‘பழித்துப் பேசுதல்’ அதன் எதிர்மறை வலிமையையும் சூழலின் தெளிவின்மையையும் காக்கிறது.
- issue: φθορά / φθαρήσονται என்பவற்றின் பொருள்
  choice: அழிவு / அழிந்துபோவார்கள்
  alternative: சீர்கேடு / கெட்டுப்போவார்கள்
  rationale: பிடிபட்டு அழியும் விலங்குகளின் உடனடிச் சூழல் அழிவு என்ற பொருளை ஆதரிக்கிறது. அதேவேளை ஒரே வேர்ச்சொல்லின் மறுமொழியும் தீர்ப்பின் தீவிரமும் தமிழில் காக்கப்படுகின்றன.
- issue: ἐν τῇ φθορᾷ αὐτῶν என்பதிலுள்ள αὐτῶν குறிப்பு
  choice: தங்கள் அழிவிலேயே
  alternative: அந்த விலங்குகளின் அழிவிலேயே / அவர்களுடைய சீர்கேட்டினாலேயே
  rationale: சுட்டுப்பெயரின் தொடர்பையும் ἐν என்பதன் துல்லிய உறவையும் கிரேக்கம் முழுமையாகத் தீர்மானிக்கவில்லை. ‘தங்கள்’ என்ற வடிவம் பொய்ப் போதகர்களை நேரடியாகச் சுட்டினாலும், அழிவின் விதம் குறித்த மேலதிக விளக்கத்தைச் சேர்க்காமல் மூலத்தின் சுருக்கத்தைக் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் கண்டனத்தின் கண்ணியமான தீவிரம் குறையாத வகையிலும் அமைக்கப்பட்டுள்ளது. விலங்கு ஒப்பீட்டை நீண்ட, செயற்கையான ஒரே வாக்கியமாக்காமல் இடைக்கோடுகளும் இரு வாக்கியங்களும் பயன்படுத்தப்பட்டுள்ளன; கிரேக்கத்தின் கருத்துத் தொடர் அப்படியே காக்கப்படுகிறது.
