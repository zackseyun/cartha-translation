revisions:
- from: ஆனால் இவர்களோ, பகுத்தறிவற்ற விலங்குகளைப் போல[a]—இயல்புணர்வால் இயக்கப்படப் பிறந்து[b], பிடிபட்டு அழிவதற்குரிய உயிரினங்களைப் போல—தங்களுக்குத் தெரியாதவற்றைப் பழித்துப் பேசுகிறார்கள்[c]. தங்கள் அழிவிலேயே தாங்களும் அழிந்துபோவார்கள்[d].
  to: ஆனால் இவர்கள், பிடிபட்டு அழிவதற்காக இயல்பாகப் பிறந்த பகுத்தறிவற்ற விலங்குகளைப் போல[a][b], தாங்கள் அறியாதவற்றைப் பற்றி இழிவாகப் பேசுகிறார்கள்[c]; தங்கள் அழிவிலேயே தாங்களும் அழிந்துபோவார்கள்[d].
  rationale: 'The revision joins the Greek modifiers into one coherent Tamil comparison: irrational animals that are naturally/instinctively constituted and born for capture and destruction. It retains the source’s ambiguity concerning the object of βλασφημοῦντες, preserves the destruction wordplay, and uses modern standard Tamil.'
