source:
  edition: SBLGNT
  text: Οὗτοί εἰσιν πηγαὶ ἄνυδροι ⸂καὶ ὁμίχλαι⸃ ὑπὸ λαίλαπος ἐλαυνόμεναι, οἷς ὁ ζόφος τοῦ ⸀σκότους τετήρηται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/017.yaml
  text: These are waterless springs and mists driven by a storm[b][a], for whom the gloom of darkness has been kept.
translation:
  language: ta
  text: இவர்கள் தண்ணீரில்லாத நீரூற்றுகளும், புயலால் அடித்துச் செல்லப்படும் பனிமூட்டங்களுமாய்[a] இருக்கிறார்கள். இவர்களுக்காக இருளின் காரிருள் ஒதுக்கிவைக்கப்பட்டுள்ளது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘புயலால் அடித்துச் செல்லப்படும் மேகங்களுமாய்.’ கிரேக்கச் சொல் இன்னும் துல்லியமாக மூடுபனி அல்லது பனிமூட்டத்தைக் குறிக்கிறது; சில மொழிபெயர்ப்புகள் அதை விரிவான பொருளில் ‘மேகங்கள்’ என வழங்குகின்றன.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘இருளின் காரிருள் இவர்களுக்காக வைத்திருக்கப்பட்டுள்ளது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πηγαὶ ἄνυδροι
  choice: தண்ணீரில்லாத நீரூற்றுகள்
  rationale: πηγή என்பது பொதுவாகத் தோண்டப்பட்ட கிணற்றை அல்ல, ஊற்றை அல்லது நீரூற்றைக் குறிக்கிறது; ἄνυδρος என்பது தண்ணீர் இல்லாததைக் குறிக்கிறது. தண்ணீர் தரவேண்டிய ஒன்று தண்ணீரின்றி இருப்பதிலுள்ள முரண்பாட்டை இச்சொற்றொடர் காக்கிறது.
- source_word: ὁμίχλαι
  choice: பனிமூட்டங்கள்
  rationale: ὁμίχλη என்பது மேகத்தைவிடத் துல்லியமாக மூடுபனி அல்லது பனிமூட்டத்தைக் குறிக்கிறது. பன்மை வடிவத்தையும் நிலையற்ற வளிமண்டலப் படிமத்தையும் ‘பனிமூட்டங்கள்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὑπὸ λαίλαπος ἐλαυνόμεναι
  choice: புயலால் அடித்துச் செல்லப்படும்
  rationale: λαῖλαψ வலிமையான காற்றுப் புயலைக் குறிக்கிறது; ἐλαύνω தள்ளிச் செல்லுதல் அல்லது விரட்டிச் செல்லுதலைக் குறிக்கிறது. கிரேக்கத்தின் செயப்பாட்டு வினைநிலையை இவ்வாக்கியம் காக்கிறது.
- source_word: οἷς
  choice: இவர்களுக்காக
  rationale: இடைப்பட்ட உருவகங்கள் அஃறிணைப் பொருள்களாக இருந்தாலும், சார்புப்பெயர் பொய்ப் போதகர்களையே சுட்டுகிறது. ஆகவே மனிதர்களைக் குறிக்கும் ‘இவர்களுக்காக’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ὁ ζόφος τοῦ σκότους
  choice: இருளின் காரிருள்
  rationale: ζόφος அச்சமூட்டும் அடர்ந்த இருளையும், σκότος இருளையும் குறிக்கிறது. ‘இருளின் காரிருள்’ இரண்டு சொற்களாலான தீவிரமான படிமத்தைச் சுருக்காமல் தமிழில் காக்கிறது.
- source_word: τετήρηται
  choice: ஒதுக்கிவைக்கப்பட்டுள்ளது
  rationale: τηρέω என்பதன் நிறைவுற்ற செயப்பாட்டு வடிவம், ஒன்று ஒதுக்கிவைக்கப்பட்டு இன்னும் அப்படியே இருப்பதைக் காட்டுகிறது. வரவிருக்கும் தீர்ப்புச் சூழலில் இத்தமிழ்ச் சொல் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
theological_decisions:
- issue: இறுதி கூற்று தண்டனைத் தீர்ப்பைக் குறிப்பது
  choice: தீர்ப்பை ஒதுக்கிவைத்த செய்பவர் யார் என்று வெளிப்படையாகச் சேர்க்காமல் செயப்பாட்டு வடிவம் காக்கப்பட்டது.
  alternative: ‘கடவுள் ஒதுக்கிவைத்துள்ளார்’ என்று செய்பவரை வெளிப்படையாகச் சேர்த்தல்.
  rationale: கிரேக்கம் தெய்வீகத் தீர்ப்பை உட்பொருளாக உணர்த்தினாலும், செய்பவரை பெயரிட்டு குறிப்பிடவில்லை. எனவே மூலத்தில் இல்லாத இறையியல் விளக்கத்தை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நீரூற்றுகள்—பனிமூட்டங்கள்—காரிருள்’ என்ற தொடர்ச்சியான உருவக வலிமையும், இறுதி வாக்கியத்தின் பெயரிடப்படாத செய்பவரும் காக்கப்பட்டுள்ளன.
