  text: ⸀ἀδικούμενοι μισθὸν ἀδικίας· ἡδονὴν ἡγούμενοι τὴν ἐν ἡμέρᾳ τρυφήν, σπίλοι καὶ μῶμοι ἐντρυφῶντες ἐν ταῖς ⸀ἀπάταις αὐτῶν συνευωχούμενοι ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/013.yaml
  text: suffering the wages of unrighteousness[a], considering daytime indulgence a pleasure. They are stains and blemishes, reveling in their deceptions while feasting with you[b],
translation:
  language: ta
  text: அநீதியின் கூலியை அனுபவிக்கிறார்கள்[b]. பகலிலேயே ஆடம்பர வாழ்வில் திளைப்பதை இன்பம் எனக் கருதுகிறார்கள். அவர்கள் கறைகளும் களங்கங்களும் ஆவர்; உங்களோடு விருந்துண்ணும்போது தங்கள் வஞ்சகங்களில்[a] திளைக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சில கையெழுத்துப் பிரதிகளில் ‘வஞ்சகங்கள்’ என்பதற்குப் பதிலாக ‘அன்பு விருந்துகள்’ என்று உள்ளது: ‘உங்களோடு விருந்துண்ணும்போது தங்கள் அன்பு விருந்துகளில் திளைக்கிறார்கள்.’'
    reason: textual_variant
  - marker: b
    text: அல்லது, ‘தவறான செயலுக்கான கைம்மாறைப் பெறுகிறார்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικούμενοι μισθὸν ἀδικίας
  choice: தாங்கள் செய்த அநீதிக்குரிய கூலியாகத் தீங்கை அனுபவிக்கிறார்கள்
  rationale: ἀδικούμενοι என்ற செயல்பாட்டின் passive வடிவத்தையும் μισθὸν ἀδικίας என்ற கைம்மாறு/கூலி கருத்தையும் ஒருங்கிணைத்து, அவர்கள் தங்கள் தவறான செயலின் விளைவாகத் தீங்கை அனுபவிக்கிறார்கள் என்ற சூழல்சார் பொருளைத் தருகிறது. ‘அநீதி’ என்ற ஒழுக்க வலிமையும் ‘கூலி’ என்ற உருவகமும் காக்கப்படுகின்றன.
- source_word: ἡδονὴν ἡγούμενοι
  choice: இன்பம் எனக் கருதுகிறார்கள்
  rationale: ἡγέομαι என்பதன் ‘எனக் கருது’ என்ற மதிப்பீட்டுப் பொருளையும் ἡδονή என்பதன் ‘இன்பம்’ என்ற பொருளையும் இயல்பான தமிழில் நேரடியாகக் காக்கிறது.
- source_word: τὴν ἐν ἡμέρᾳ τρυφήν
  choice: பகலில் ஆடம்பரமாக இன்பம் அனுபவிப்பதை
  rationale: ἐν ἡμέρᾳ என்பதன் ‘பகலில்’ என்ற வெளிப்படையான காலக் குறிப்பையும், τρυφή என்பதிலுள்ள ஆடம்பரமான சுயஇன்ப நாட்டத்தையும் வெளிப்படுத்துகிறது; அவர்களுடைய வெட்கமற்ற நடத்தையை மொழிபெயர்ப்பு மறைக்கவில்லை.
- source_word: σπίλοι καὶ μῶμοι
  choice: கறைகளும் களங்கங்களும்
  rationale: ஒழுக்கத் தீட்டையும் குறைபாட்டையும் சுட்டும் இணை உருவகத்தை இயல்பான, கண்ணியமான தமிழில் காக்கிறது.
- source_word: ἐντρυφῶντες
  choice: திளைக்கிறார்கள்
  rationale: தன்னிச்சையான அளவுமீறிய இன்பத்தில் மூழ்கியிருக்கும் கருத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐν ταῖς ἀπάταις αὐτῶν
  choice: தங்கள் வஞ்சகங்களில்
  rationale: SBLGNT-இன் ἀπάταις என்ற வாசகத்தைப் பின்பற்றி ‘வஞ்சகங்கள்’ என்று மொழிபெயர்க்கிறது; பொய்ப் போதகர்களைப் பற்றிய உடனடிச் சூழலுக்கும் இது பொருந்துகிறது.
- source_word: συνευωχούμενοι ὑμῖν
  choice: உங்களோடு விருந்துண்ணும்போது
  rationale: ஒன்றாக விருந்துண்ணுதல் என்ற வினையின் சமூகப் பொருளையும், மற்ற செயல் அதே நேரத்தில் நடைபெறுகிறது என்ற participial தொடர்பையும் காக்கிறது; விருந்தின் தன்மையைத் தேவையின்றி வரையறுக்கவில்லை.
theological_decisions:
- issue: ἀπάταις / ἀγάπαις என்ற பாடவேறுபாடு
  choice: முதன்மை உரையில் ἀπάταις என்பதற்கு ‘தங்கள் வஞ்சகங்களில்’
  alternative: ἀγάπαις என்பதற்கு ‘தங்கள் அன்பு விருந்துகளில்’
  rationale: கொடுக்கப்பட்ட SBLGNT உரை ἀπάταις என்று வாசிக்கிறது; ஆகவே அது முதன்மை உரையில் மொழிபெயர்க்கப்பட்டது. திருச்சபையின் கூட்டு உணவைக் குறிக்கக்கூடிய ἀγάπαις என்ற பொருளுள்ள மாற்று வாசகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἀδικούμενοι μισθὸν ἀδικίας என்பதிலுள்ள கைம்மாறு கருத்து
  choice: ‘தாங்கள் செய்த அநீதிக்குரிய கூலியாகத் தீங்கை அனுபவிக்கிறார்கள்’ என்று விளைவையும் தண்டனைத் தன்மையையும் வெளிப்படுத்துதல்
  alternative: ‘அநீதியின் கூலியைப் பெறுகிறார்கள்’ என்ற அதிக சொற்சார்ந்த மொழிபெயர்ப்பு
  rationale: ἀδικούμενοι என்பதை வெறுமனே பிறரால் அநியாயம் செய்யப்படுதல் என்று எடுத்தால் சூழலிலுள்ள நீதியான கைம்மாறு மறைந்துவிடலாம். அதேவேளை ‘கூலி’ உருவகம் முதன்மை உரையிலும் மாற்று மொழியாக அடிக்குறிப்பிலும் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கத்தில் உள்ள ‘இன்பம்’ சார்ந்த சொல் மீளுருவாக்கம் ஓரளவு காக்கப்பட்டுள்ளது; விருந்து அன்பு விருந்தா அல்லது பொதுவான கூட்டு உணவா என்பதை முதன்மை உரை தேவையின்றி தீர்மானிக்கவில்லை.
