id: 2PE.2.2
reference: 2 Peter 2:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ πολλοὶ ἐξακολουθήσουσιν αὐτῶν ταῖς ἀσελγείαις, δι’ οὓς ἡ ὁδὸς τῆς ἀληθείας βλασφημηθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/002.yaml
  text: And many will follow their sensuality[c][b][a], and because of them the way of the truth will be blasphemed.
translation:
  language: ta
  text: பலரும் அவர்களுடைய வெட்கங்கெட்ட நடத்தைகளைப் பின்பற்றுவார்கள்[a]. அவர்கள் காரணமாகச் சத்தியத்தின் வழி[b] பழித்துப் பேசப்படும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கட்டுப்பாடற்ற ஒழுக்கக்கேடுகளை,’ ‘இன்பவெறிச் செயல்களை’ அல்லது ‘காமவெறி நடத்தைகளை’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் வெட்கமற்ற, கட்டுப்பாடற்ற நடத்தையைக் குறிக்கிறது; அதில் பெரும்பாலும் பாலியல் உட்பொருளும் உண்டு.
    reason: lexical_alternative
  - marker: b
    text: ‘சத்திய வழி’ என்றும் மொழிபெயர்க்கலாம். இச்சொற்றொடர் கிறிஸ்தவ விசுவாசத்தையும் அதற்கேற்ற வாழ்க்கை முறையையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: ‘அவதூறாகப் பேசப்படும்,’ ‘இகழப்படும்’ அல்லது ‘தூற்றப்படும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: பலரும்
  rationale: எண்ணிக்கையில் பலரை இயல்பாகக் குறிக்கும் நவீனத் தமிழ் வடிவம்; கிரேக்கச் சொல்லின் அழுத்தத்தை மிகைப்படுத்தவில்லை.
- source_word: ἐξακολουθήσουσιν
  choice: பின்பற்றுவார்கள்
  rationale: ஒருவரின் பாதையையோ நடத்தையையோ தொடர்ந்து செல்லுதல் என்ற பொருளையும் எதிர்கால வினை வடிவையும் தெளிவாகக் காக்கிறது.
- source_word: αὐτῶν
  choice: அவர்களுடைய
  rationale: சூழலில் முன்பு குறிப்பிடப்பட்ட பொய்ப் போதகர்களைக் குறிக்கும் பன்மை உரிமை வடிவத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ταῖς ἀσελγείαις
  choice: வெட்கங்கெட்ட நடத்தைகளை
  rationale: பன்மையைப் பேணுவதோடு, பாலியல் உட்பொருளைக் கொண்டிருக்கக்கூடிய கட்டுப்பாடற்ற, வெட்கமற்ற ஒழுக்கக்கேட்டை ஒரே குறிப்பிட்ட செயலாகக் குறுக்காமல் தெரிவிக்கிறது.
- source_word: δι’ οὓς
  choice: அவர்கள் காரணமாக
  rationale: διά + accusative இங்குக் காரணத்தைக் குறிக்கிறது. தமிழ் சொற்றொடர் இதைச் செயப்படுபொருளை நிகழ்த்தும் முகவர் எனத் தவறாகப் புரிந்துகொள்ளாதபடி தெளிவாக்குகிறது.
- source_word: ἡ ὁδὸς τῆς ἀληθείας
  choice: சத்தியத்தின் வழி
  rationale: மூலத்தின் உருபுடைமைத் தொடர்பையும் ‘வழி’ என்ற உருவகத்தையும் காக்கிறது; கிறிஸ்தவ நம்பிக்கையையும் அதற்கேற்ற வாழ்க்கை முறையையும் குறிக்கும் சாத்தியத்தைத் திறந்தே வைக்கிறது.
- source_word: βλασφημηθήσεται
  choice: பழித்துப் பேசப்படும்
  rationale: இழிவாகவும் தீங்காகவும் பேசப்படுதல் என்ற செயப்பாட்டு எதிர்காலப் பொருளை இயல்பான தமிழில் தருகிறது; தேவனை நேரடியாகப் பழித்தல் என்ற பொருளுக்கு மட்டும் சொல்லை வரையறுக்கவில்லை.
theological_decisions:
- issue: ‘சத்தியத்தின் வழி’ என்பதன் குறிப்பு மற்றும் பொருள்
  choice: உண்மையான விசுவாசத்தையும் அதற்கேற்ற வாழ்க்கை முறையையும் குறிக்கக்கூடிய ஆரம்பகால கிறிஸ்தவச் சொல்லாட்சியாக உருவகத்தை அப்படியே வைத்தல்.
  alternative: ‘உண்மையான வழி’ அல்லது ‘கிறிஸ்தவ நம்பிக்கை’ என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: மூலத்தின் உருபுடைமை அமைப்பும் ‘வழி’ உருவகமும் பாதுகாக்கப்படுகின்றன; இதை வெறும் கோட்பாடாகவோ வெறும் வாழ்க்கை முறையாகவோ குறுக்காமல் இரண்டிற்குமுள்ள உறவு திறந்தே வைக்கப்படுகிறது.
- issue: ἀσέλγεια என்பதன் ஒழுக்க மற்றும் பாலியல் பரப்பு
  choice: ‘வெட்கங்கெட்ட நடத்தைகள்’ என்று பரந்த பொருளில் மொழிபெயர்த்தல்.
  alternative: ‘காமவெறிச் செயல்கள்’, ‘ஒழுக்கக்கேடுகள்’ அல்லது ‘கட்டுப்பாடற்ற இன்பவெறி’ என்று மொழிபெயர்த்தல்.
  rationale: இந்தச் சொல் பாலியல் மீறல்களை உள்ளடக்கலாம்; ஆனால் அதற்கு மட்டும் வரையறுக்கப்படாது. தேர்ந்தெடுத்த வடிவம் வெட்கமற்ற, கட்டுப்பாடற்ற நடத்தையின் பரப்பைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் dignified நடையில் வடிவமைக்கப்பட்டது. ‘பலரும்’, ‘பின்பற்றுவார்கள்’, ‘அவர்கள் காரணமாக’ ஆகியவை இயல்பான தொடர்ச்சியைக் கொடுக்கின்றன. ‘சத்தியத்தின் வழி’ என்பது வேதாகமத் தன்மையுள்ள உருவகத்தைப் பேணுகிறது; ‘பழித்துப் பேசப்படும்’ என்பது βλασφημέω என்பதன் கடுமையைத் தக்கவைத்தபடியே இயல்பான தமிழாக உள்ளது.
