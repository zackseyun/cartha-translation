  terminology: ‘நேரான வழி,’ ‘வழிதவறிப்போனார்கள்,’ ‘வழி,’ and ‘அநீதியின் கூலி’ preserve the moral-path metaphor and biblical register well. ‘போசோர்’ properly follows the SBLGNT reading, while the footnote appropriately identifies the familiar Old Testament form ‘பெயோர்.’
  issues:
