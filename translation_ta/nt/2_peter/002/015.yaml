id: 2PE.2.15
reference: 2 Peter 2:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀καταλιπόντες εὐθεῖαν ὁδὸν ἐπλανήθησαν, ἐξακολουθήσαντες τῇ ὁδῷ τοῦ Βαλαὰμ τοῦ ⸀Βοσὸρ ὃς μισθὸν ἀδικίας ἠγάπησεν
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/015.yaml
  text: Having abandoned the straight way[a], they went astray, having followed the way of Balaam son of Bosor[b], who loved the wages of unrighteousness.
translation:
  language: ta
  text: நேரான வழியைக் கைவிட்ட அவர்கள், போசோரின் மகனான பிலேயாமின்[a] வழியைப் பின்பற்றி வழிதவறிப்போனார்கள். அவன் அநீதியின் கூலியை நேசித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்க உரையில் பெயர் ‘போசோர்’ என்று உள்ளது; பழைய ஏற்பாட்டில் பிலேயாம் பொதுவாக ‘பெயோரின் மகன்’ என்று அழைக்கப்படுகிறான்.
    reason: alternative_reading
lexical_decisions:
- source_word: καταλιπόντες
  choice: கைவிட்ட
  rationale: முதன்மை வினைக்கு முன்பான செயலைக் குறிக்கும் இறந்தகாலப் பங்கேற்பு வடிவம். ‘கைவிட்ட’ என்பது வெறுமனே இடத்தைவிட்டு நீங்கியதைக் காட்டிலும், தெரிந்தே ஒரு வழியைத் துறந்த நெறிசார் கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εὐθεῖαν ὁδὸν
  choice: நேரான வழியை
  rationale: மூலத்தின் ‘நேரான வழி’ என்ற உருவகத்தை அப்படியே பேணுகிறது; ‘சரியான வழி’ என்று விளக்கிப் பொருளைச் சுருக்கவில்லை.
- source_word: ἐπλανήθησαν
  choice: வழிதவறிப்போனார்கள்
  rationale: வெளிப்புற ஒருவர் அவர்களைத் தவறச் செய்தார் என்று கிரேக்கம் வெளிப்படையாகக் கூறாததால், செயப்பாட்டு காரணியைச் சேர்க்காமல் நெறிசார் வழிதவறுதலைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐξακολουθήσαντες
  choice: பின்பற்றி
  rationale: முதன்மை வினையோடு நெருக்கமாக இணைந்த பங்கேற்பு செயலை இயல்பான தமிழில் காட்டுகிறது; அது காலத் தொடர்பா, உடனிகழ்வா, வழிதவறிய விதமா என்பதை அளவுக்கு மீறித் தீர்மானிக்கவில்லை.
- source_word: τῇ ὁδῷ
  choice: வழியை
  rationale: வசனத்தின் முதல் பகுதியில் உள்ள ὁδός என்பதோடு ஒரே பாதை உருவகத்தைத் தொடர்ந்து பேணுகிறது.
- source_word: τοῦ Βαλαὰμ
  choice: பிலேயாமின்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவம்.
- source_word: τοῦ Βοσὸρ
  choice: போசோரின் மகன்
  rationale: SBLGNT-யின் Βοσόρ என்ற வடிவத்தை முதன்மை உரையில் ஒலிபெயர்த்து, தொடர்ச்சியான உறவுமுறை வேற்றுமையை இயல்பான தமிழில் தந்தை-மகன் உறவாக வெளிப்படுத்துகிறது.
- source_word: μισθὸν ἀδικίας
  choice: அநீதியின் கூலியை
  rationale: ‘கூலி’ என்பது ஈடாகக் கிடைக்கும் பலனைச் சுட்டுகிறது; ‘அநீதி’ என்பது ἀδικία-வின் நெறிசார் எடையைப் பேணுகிறது. மூலத்தின் சுருக்கமான சொற்றொடரும் காக்கப்படுகிறது.
- source_word: ἠγάπησεν
  choice: நேசித்தான்
  rationale: ἀγαπάω என்பதன் நேரடியான பொருளை எளிய இறந்தகால வினையாக வழங்குகிறது.
theological_decisions:
- issue: εὐθεῖαν ὁδὸν / τῇ ὁδῷ ஆகியவற்றின் நெறிசார் பாதை உருவகம்
  choice: ‘நேரான வழி’ மற்றும் ‘பிலேயாமின் வழி’ என்று வழி உருவகத்தைப் பேணுதல்
  alternative: ‘சரியான நெறி’ அல்லது ‘தீய நடத்தை’ என்று விளக்கிப் பெயர்த்தல்
  rationale: இரண்டு இடங்களிலும் ὁδός என்ற ஒரே சொல்லைப் பயன்படுத்தும் மூலத்தின் எதிர்மறை ஒப்புமையை இது காக்கிறது; குறிப்பிட்ட ஒரு கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: Βοσόρ என்ற பெயர் வடிவம்
  choice: முதன்மை உரையில் ‘போசோர்’; அடிக்குறிப்பில் பழைய ஏற்பாட்டின் ‘பெயோர்’ வடிவம்
  alternative: முதன்மை உரையிலேயே ‘பெயோர்’ என்று ஒத்திசைத்தல்
  rationale: கொடுக்கப்பட்ட கிரேக்க மூல உரைக்கு முன்னுரிமை அளித்து Βοσόρ-ஐ வெளிப்படையாகப் பிரதிபலிக்கிறது; அதே நேரத்தில் பழைய ஏற்பாட்டில் வாசகர்களுக்குப் பரிச்சயமான பெயர் வடிவத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: ἐξακολουθήσαντες என்பதற்கும் ἐπλανήθησαν என்பதற்கும் உள்ள தொடரியல் உறவு
  choice: ‘பின்பற்றி வழிதவறிப்போனார்கள்’ என்று நெருக்கமாக இணைத்தல்
  alternative: ‘பின்பற்றியதால் வழிதவறிப்போனார்கள்’ என்று வெளிப்படையான காரண உறவாக்குதல்
  rationale: பங்கேற்பு வடிவம் வழிதவறிய விதத்தைக் குறிக்கக்கூடும்; ஆனால் காரணத்தை மட்டும் கட்டாயமாக்காமல் மூலத்தில் உள்ள தொடரியல் நெகிழ்வைத் தமிழ் வாக்கியம் ஓரளவு பேணுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஆனால் வேதாகமத்துக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘வழி’, ‘அநீதி’, ‘கூலி’ ஆகிய சொற்கள் மூலத்தின் உருவகத்தையும் நெறிசார் தீவிரத்தையும் பேணுகின்றன. அரிதான ‘போசோர்’ பெயர் வடிவம் மூல உரைச் சான்றின் காரணமாக வைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
