source:
  edition: SBLGNT
  text: καὶ ἀρχαίου κόσμου οὐκ ἐφείσατο, ἀλλὰ ὄγδοον Νῶε δικαιοσύνης κήρυκα ἐφύλαξεν, κατακλυσμὸν κόσμῳ ἀσεβῶν ἐπάξας,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/005.yaml
  text: and if he did not spare the ancient world[a], but preserved Noah, an eighth person, a herald of righteousness, when he brought a flood upon a world of the ungodly[c][b],
translation:
  language: ta
  text: பண்டைய உலகத்தை அவர் விட்டுவைக்காமல், நீதியை[c] அறிவிப்பவரான[b] நோவாவை எட்டாவது நபராக[a]க் காத்தார்; இறைப்பற்றற்றவர்களின் உலகத்தின்மேல் பெருவெள்ளத்தைக் கொண்டுவந்து என்றால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எட்டுப் பேரில் ஒருவரான நோவாவை’; கிரேக்கச் சொற்றொடர் சுருக்கமானது. நோவா மற்ற ஏழு பேருடன் காக்கப்பட்டார் என்று இது பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நீதியைப் பிரசங்கித்தவரான’; இச்சொல் பொதுவெளியில் செய்தியை அறிவிப்பவரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘நீதி’ என்பதற்கு இங்கு ‘நீதிநெறி’ அல்லது ‘நேர்மை’ என்றும் பொருள் கொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀρχαίου κόσμου
  choice: பண்டைய உலகம்
  rationale: வெள்ளத்திற்கு முந்தைய முற்கால உலகைக் குறிக்கும் சொற்றொடரை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: οὐκ ἐφείσατο
  choice: தப்பவிடாமல்
  rationale: தீர்ப்பிலிருந்து விடுவிக்காமல் இருப்பதைக் குறிக்கும் φείδομαι என்பதன் நீதித்தீர்ப்புச் சார்ந்த வலிமையைப் பேணுகிறது.
- source_word: ὄγδοον Νῶε
  choice: நோவாவை எட்டாவது நபராக
  rationale: கிரேக்கத்தில் உள்ள சுருக்கமான வரிசை எண்ணைக் கூடியவரை நேரடியாகப் பேணுகிறது; அது நோவாவுடன் மேலும் ஏழு பேர் காக்கப்பட்டதைக் குறிக்கலாம்.
- source_word: δικαιοσύνης κήρυκα
  choice: நீதியை அறிவிப்பவரான
  rationale: κήρυξ என்பதிலுள்ள பொதுவெளியில் அறிவிக்கும் கருத்தைப் பேணுகிறது; δικαιοσύνηக்கு இயல்பான தமிழ் இணையாக ‘நீதி’ பயன்படுத்தப்படுகிறது.
- source_word: ἐφύλαξεν
  choice: காத்து
  rationale: தீர்ப்பின் நடுவில் நோவா பாதுகாக்கப்பட்டார் என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: κατακλυσμὸν
  choice: பெருவெள்ளம்
  rationale: நோவாவின் காலத்தில் நிகழ்ந்த பேரளவிலான வெள்ளத்தைத் தெளிவாகக் குறிக்கும் வழக்கமான தமிழ் சொல்.
- source_word: κόσμῳ ἀσεβῶν
  choice: இறைப்பற்றற்றவர்களின் உலகத்தின்மேல்
  rationale: ἀσεβῶν என்பதை மனிதர்களைக் குறிக்கும் பெயர்ச்சொல்லாகவும், உலகத்தை அவர்களுடன் தொடர்புபடுத்தும் கிரேக்க அமைப்பையும் பேணுகிறது.
- source_word: ἐπάξας
  choice: கொண்டுவந்தார்
  rationale: வெள்ளத்தை அந்த உலகின்மேல் வரச்செய்த செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: δικαιοσύνη என்பதன் மொழிபெயர்ப்பு
  choice: நீதி
  alternative: நீதிநெறி / நேர்மை
  rationale: இங்கு நோவா அறிவித்த கடவுளின் நெறிக்கும் நேர்மையான வாழ்வுக்கும் பொருந்தும் பரந்த சொல்லாக ‘நீதி’ உள்ளது; அதை வெறும் சட்டநீதியாக மட்டுப்படுத்தவில்லை.
- issue: ὄγδοον Νῶε என்பதன் பொருள்
  choice: நோவாவை எட்டாவது நபராக
  alternative: எட்டுப் பேரில் ஒருவரான நோவாவை
  rationale: மூலத்தின் சுருக்கமான, ஓரளவு தெளிவற்ற வரிசை எண் வடிவத்தை முதன்மை உரையில் பேணி, இயல்பான கூட்டெண் விளக்கத்தை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டது. இவ்வசனம் முந்தைய வசனத்தில் தொடங்கிய நிபந்தனைத் தொடரின் ஒரு பகுதியாக இருப்பதால் இறுதியில் ‘என்றால்’ வைக்கப்பட்டு வாக்கியம் தொடர்வது காட்டப்பட்டுள்ளது.
