reference: 2 Peter 2:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὑπέρογκα γὰρ ματαιότητος φθεγγόμενοι δελεάζουσιν ἐν ἐπιθυμίαις σαρκὸς ἀσελγείαις τοὺς ⸀ὀλίγως ⸀ἀποφεύγοντας τοὺς ἐν πλάνῃ ἀναστρεφομένους,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/018.yaml
  text: For[a], speaking inflated words of emptiness, they entice by fleshly desires and sensuality those who are barely escaping from those who live in error[d][c][b],
translation:
  language: ta
  text: ஏனெனில், வெறுமை நிறைந்த வீம்புப் பேச்சுகளைப் பேசி[a], வழிதவறி வாழ்கிறவர்களிடமிருந்து எப்படியோ தப்பித்துக்கொண்டிருக்கிறவர்களை[c], மாம்சத்தின் ஆசைகளாலும்[b] கட்டுப்பாடற்ற இச்சைச் செயல்களாலும்[d] அவர்கள் கவர்ந்திழுக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வெறுமையான ஆணவப் பேச்சுகளைப் பேசி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, ‘மாம்சத்தின் ஆசைகளால்’. இங்கு ‘மாம்சம்’ என்பது ஒழுக்கச்சூழலில் உருவகமாகப் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: ‘இப்போதுதான் தப்பித்துக்கொண்டிருக்கிறவர்களை’ என்றும் பொருள் கொள்ளலாம்.
    reason: alternative_reading
  - marker: d
    text: ‘மாம்சத்தின் கட்டுப்பாடற்ற ஆசைகளால்’ என்றும் இச்சொற்றொடரைப் புரிந்துகொள்ளலாம்.
    reason: syntactical_alternative
lexical_decisions:
- source_word: ὑπέρογκα ματαιότητος
  choice: வெறுமை நிறைந்த வீம்புப் பேச்சுகள்
  rationale: ὑπέρογκα என்பது அளவுமீறிய, பகட்டான அல்லது ஆணவமானவற்றைக் குறிக்கிறது; φθεγγόμενοι என்பதுடன் வருவதால் தமிழில் ‘பேச்சுகள்’ என்று வெளிப்படுத்துவது இயல்பானது. ματαιότητος அவற்றின் பொருளற்ற தன்மையைச் சுட்டுவதால் ‘வெறுமை நிறைந்த’ என மொழிபெயர்க்கப்பட்டது.
- source_word: φθεγγόμενοι
  choice: பேசி
  rationale: முக்கிய வினையான ‘கவர்ந்திழுக்கிறார்கள்’ என்பதுடன் இணைந்து, அவர்கள் பயன்படுத்தும் வழியை இயல்பான தமிழில் காட்டுகிறது.
- source_word: δελεάζουσιν
  choice: கவர்ந்திழுக்கிறார்கள்
  rationale: இரை காட்டி மயக்கிக் கண்ணியில் சிக்கவைக்கும் நுண்பொருளை, நவீன தமிழில் தெளிவாகவும் ஒழுக்கரீதியான ஈர்ப்பை உணர்த்துமாறும் தருகிறது.
- source_word: ἐν ἐπιθυμίαις σαρκὸς
  choice: மாம்சத்தின் ஆசைகளால்
  rationale: ἐν இங்கு கருவி அல்லது வழிமுறையைக் காட்டுகிறது. σάρξ என்பதன் உருவகத்தை ‘மாம்சம்’ என்று தக்கவைத்து, அதை ‘பாவ இயல்பு’ என்று கோட்பாட்டுரீதியாக விரிவுபடுத்துவது தவிர்க்கப்பட்டது.
- source_word: ἀσελγείαις
  choice: கட்டுப்பாடற்ற இச்சைச் செயல்களால்
  rationale: இந்தச் சொல் வெட்கமற்ற, கட்டுப்பாடற்ற சிற்றின்ப நடத்தையைக் குறிக்கிறது. வெறும் மனநிலையாக அல்லாமல் நடத்தையையும் உணர்த்தும் வகையில் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: ὀλίγως ἀποφεύγοντας
  choice: அரிதாகவே தப்பித்துக்கொண்டிருக்கிறவர்கள்
  rationale: ὀλίγως என்பதன் ‘மிகக் குறைந்த அளவில்/அரிதாகவே’ என்ற பொருளையும், நிகழ்காலப் பங்கேற்புச் சொல்லின் இன்னும் நடந்துகொண்டிருக்கும், உறுதியற்ற தப்பிப்பையும் பாதுகாக்கிறது.
- source_word: τοὺς ἐν πλάνῃ ἀναστρεφομένους
  choice: வழிதவறி வாழ்கிறவர்கள்
  rationale: πλάνη என்பது வழுவுதல் அல்லது தவறான நிலை; ἀναστρεφομένους என்பது ஒருவரின் வழக்கமான வாழ்க்கை நடத்தையைக் குறிக்கிறது. இரண்டையும் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: σάρξ என்பதன் ஒழுக்கச்சூழல் பொருள்
  choice: ‘மாம்சத்தின் ஆசைகள்’ என்று உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘பாவ இயல்பின் ஆசைகள்’ அல்லது ‘உடல்சார்ந்த ஆசைகள்’
  rationale: ‘பாவ இயல்பு’ என்பது மூலத்தில் உள்ளதைவிட அதிகமான கோட்பாட்டு விளக்கத்தைச் சேர்க்கும்; ‘உடல்சார்ந்த’ என்பது உடலைத் தானே எதிர்மறையாகக் காட்டக்கூடும். ‘மாம்சம்’ மூல உருவகத்தையும் அதன் பதற்றத்தையும் பாதுகாக்கிறது.
- issue: கவரப்படுகிறவர்களின் தப்பிப்பு எந்த நிலையில் உள்ளது
  choice: அவர்கள் வழிதவறி வாழ்கிறவர்களிடமிருந்து அரிதாகவே தப்பித்துக்கொண்டிருக்கிறார்கள்
  alternative: அவர்கள் முழுமையாகத் தப்பிவிட்டார்கள்; அல்லது அவர்கள் தவறிலிருந்தே தப்பிக்கிறார்கள்
  rationale: நிகழ்காலப் பங்கேற்புச் சொல்லும் ὀλίγως என்பதும் தப்பிப்பு இன்னும் நடைபெறுவதையும் அதன் உறுதியற்ற நிலையையும் காட்டுகின்றன. இரட்சிப்பு நிறைவேறிவிட்டதா என்பதைக் கூறாமல் மூலத்தின் இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
- issue: ἀσελγείαις என்பது ஆசைகளுடன் எவ்வாறு தொடர்புபடுகிறது
  choice: இணைந்த இன்னொரு கவர்ச்சி வழியாக ‘ஆசைகளாலும்… செயல்களாலும்’ என்று வழங்குதல்
  alternative: ‘கட்டுப்பாடற்ற இச்சைகளாகிய மாம்சத்தின் ஆசைகளால்’ என்று விளக்கச் சமாநிலையாகக் கொள்ளுதல்
  rationale: கிரேக்கத்தில் இரண்டும் வேற்றுமை ஒற்றுமையில் இருப்பதால் விளக்கச் சமாநிலையும் சாத்தியம்; ஆனால் இணைந்த கருவிகளாக வாசிப்பதும் இயல்பானது. முதன்மை உரை தொடரமைப்பைத் தெளிவாக வைத்திருக்கிறது; மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடியதாயும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘வீம்புப் பேச்சுகள்’, ‘வழிதவறி வாழ்கிறவர்கள்’, ‘கவர்ந்திழுக்கிறார்கள்’ ஆகியவை இயல்பான நடப்பு வழக்கைச் சேர்ந்தாலும் கொச்சையற்றவை. மூலத்தில் உள்ள தொடரமைப்பும் தப்பிப்பின் உறுதியற்ற தன்மையும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
