source:
  edition: SBLGNT
  text: ἐλευθερίαν αὐτοῖς ἐπαγγελλόμενοι, αὐτοὶ δοῦλοι ὑπάρχοντες τῆς φθορᾶς· ᾧ γάρ τις ἥττηται, τούτῳ ⸀καὶ δεδούλωται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/019.yaml
  text: promising them freedom while they themselves are servants of corruption[a]; for whatever a person is overcome by[b], by this he is also enslaved.
translation:
  language: ta
  text: அவர்களுக்குச் சுதந்திரத்தை வாக்களித்துக்கொண்டே, அவர்களே சீரழிவுக்கு[a] அடிமைகளாக இருக்கிறார்கள்; ஏனெனில், ஒருவர் எதனால் தோற்கடிக்கப்பட்டிருக்கிறாரோ, அதற்கே அவர் அடிமையாக்கப்பட்டிருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சீரழிவு” என்பதற்கு “அழிவு” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλευθερίαν
  choice: சுதந்திரம்
  rationale: விடுதலையான நிலையைக் குறிக்கும் வழக்கமான, இயல்பான நவீனத் தமிழ்ச் சொல்; பின்னர் வரும் அடிமைத்தனத்துடனான முரண்பாட்டையும் தெளிவாகக் காட்டுகிறது.
- source_word: ἐπαγγελλόμενοι
  choice: வாக்களித்துக்கொண்டே
  rationale: வாக்குறுதி அளித்தல் என்ற வினை வலிமையைப் பாதுகாப்பதோடு, அவர்கள் அதே நேரத்தில் அடிமைகளாக இருப்பதையும் தொடர்நிலை வடிவில் வெளிப்படுத்துகிறது.
- source_word: δοῦλοι
  choice: அடிமைகள்
  rationale: சுதந்திரம் என்ற பொய்யான வாக்குறுதிக்கும் அவர்களுடைய உண்மையான கட்டுப்பட்ட நிலைக்கும் இடையிலான கூர்மையான முரண்பாட்டைப் பாதுகாக்கிறது.
- source_word: φθορᾶς
  choice: சீரழிவு
  rationale: ஒழுக்கக் கெடுதலையும் அதன் அழிவுக்குரிய விளைவையும் ஒருங்கே உணர்த்துகிறது; பொருளை வெறும் உடல் அழிவாகவோ தனிப்பட்ட தீய குணமாகவோ சுருக்கவில்லை.
- source_word: ᾧ γάρ τις ἥττηται
  choice: ஏனெனில், ஒருவர் எதனால் தோற்கடிக்கப்பட்டிருக்கிறாரோ
  rationale: பொதுவான நியதியாக வரும் τις என்பதற்கு இயல்பான ‘ஒருவர்’ பயன்படுத்தப்பட்டுள்ளது; perfect passive வடிவின் முடிவுற்ற தோல்வியும் தொடரும் நிலையும் ‘தோற்கடிக்கப்பட்டிருக்கிறாரோ’ என்பதில் காக்கப்படுகின்றன.
- source_word: τούτῳ καὶ δεδούλωται
  choice: அதற்கே அவர் அடிமையாக்கப்பட்டிருக்கிறார்
  rationale: தொடர்ந்து நிலைக்கும் அடிமைப்பட்ட நிலையைக் perfect passive வடிவில் வெளிப்படுத்துகிறது; ‘அதற்கே’ என்பது கிரேக்க dative அமைப்பையும் வாக்கியத்தின் இணை அமைப்பையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: சுதந்திரத்தின் வாக்குறுதிக்கும் சீரழிவின் ஆளுகைக்கும் இடையிலான முரண்பாடு
  choice: δοῦλοι/δεδούλωται என்பவற்றை ‘அடிமைகள்/அடிமையாக்கப்பட்டிருக்கிறார்’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘ஊழியர்கள்/கட்டுப்பாட்டில் இருக்கிறார்’ போன்ற மென்மையான சொற்கள்
  rationale: இவ்வசனத்தின் வாதம், சுதந்திரம் தருவதாகச் சொல்பவர்களே சீரழிவால் ஆளப்பட்டிருக்கிறார்கள் என்ற கடுமையான முரண்பாட்டில் நிலைகொண்டுள்ளது. மென்மையான சொற்கள் அந்த வலிமையைத் தளர்த்தும்.
- issue: φθορά என்பதிலுள்ள ஒழுக்கச் சீர்கேடு மற்றும் அழிவு சார்ந்த பொருள் நிழல்கள்
  choice: முதன்மை உரையில் ‘சீரழிவு’ என்றும் அடிக்குறிப்பில் ‘அழிவு’ என்ற மாற்றையும் தருதல்
  alternative: ‘கெட்ட நடத்தை’ அல்லது ‘அழிவு’ என்று ஒரே பொருளாகத் தீர்மானித்தல்
  rationale: மூலச்சொல் ஒழுக்கக் கெடுதலையும் அழிவையும் சுட்டக்கூடும்; ஒரு தனிப்பொருளை மட்டும் கட்டாயப்படுத்தாமல் அதன் உண்மையான பொருள் விரிவைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வாக்களித்துக்கொண்டே’ என்பது ஒரே நேரத்தில் நிகழும் செயலும் நிலையுமாகிய எதிர்மறை முரண்பாட்டை இயல்பாக வெளிப்படுத்துகிறது; ‘ஒருவர்… அவர்’ என்பது தமிழில் இயல்பான பொதுமை ஒருமை அமைப்பு.
