translation:
  language: ta
  text: அவர்கள் விபசாரியால் நிறைந்தும் பாவம் செய்வதை நிறுத்தாதும் இருக்கும் கண்களைக் கொண்டவர்கள்[a][b]; உறுதியற்றவர்களைக் கவர்ந்து இழுக்கிறார்கள்; பேராசையில் பயிற்சி பெற்ற இருதயமுடைய அவர்கள் சாபத்தின் பிள்ளைகள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “ஒரு விபசாரியால் நிறைந்த கண்கள்.” இதை “விபசாரத்தால் நிறைந்த கண்கள்” அல்லது “விபசார ஆசை நிறைந்த கண்கள்” என்றும் பொருள் விளக்கமாக மொழிபெயர்க்கலாம்.'
    reason: lexical_alternative
  - marker: b
    text: அல்லது “பாவம் செய்வதை நிறுத்த இயலாத கண்கள்” அல்லது “பாவத்திலிருந்து ஓயாத கண்கள்.” கண்களைச் சார்ந்த உருவகத்தின் அடிப்படையில், “பாவத்திற்குத் தீராத வேட்கையுள்ள கண்கள்” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεστοὺς μοιχαλίδος
  choice: விபசாரியால் நிறைந்த
  rationale: மூலத்தில் ‘ஒரு விபசாரியால் நிறைந்த’ என்ற திடுக்கிடும் ஒருமை உருவகம் உள்ளது. தமிழில் அதன் கூர்மையைத் தக்கவைத்து, அதன் பொருள் விளக்கங்களை அடிக்குறிப்பில் தருகிறது.
- source_word: ἀκαταπαύστους ἁμαρτίας
  choice: பாவத்திலிருந்து ஓயாதவர்கள்
  rationale: இலக்கணப்படி ‘பாவத்திலிருந்து ஓயாத’ என்பது கண்களை விவரித்தாலும், அந்தக் கண்கள் வழியாக மனிதர்களின் தொடர்ச்சியான பாவச் செயலைக் குறிக்கும் உருவகத்தைத் தமிழில் இயல்பாக வெளிப்படுத்த மனிதர்களைக் குறித்துச் சொல்லப்பட்டுள்ளது. ‘பாவத்திற்குத் தீராத வேட்கையுள்ள’ என்ற பொருள் வாய்ப்பும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: δελεάζοντες
  choice: வலையில் சிக்கவைக்கிறார்கள்
  rationale: இந்த வினை இரை வைத்து கவர்தல் அல்லது வலையில் இழுத்தல் என்ற வேட்டையாடும் நிழற்பொருளைக் கொண்டது; இத்தமிழ் வடிவம் அந்தப் படிமத்தை இயல்பாகத் தருகிறது.
- source_word: ψυχὰς ἀστηρίκτους
  choice: உறுதியற்றவர்களை
  rationale: ψυχαί இங்கு உடலிலிருந்து பிரிந்த ஆத்துமாக்களை அல்ல, உறுதிப்படுத்தப்படாத அல்லது எளிதில் வழுவக்கூடிய மனிதர்களைக் குறிக்கிறது. ஆகவே நவீனத் தமிழில் ‘உறுதியற்றவர்கள்’ தெளிவாக உள்ளது.
- source_word: καρδίαν γεγυμνασμένην πλεονεξίας
  choice: பேராசையில் பயிற்றுவிக்கப்பட்ட இருதயம்
  rationale: γεγυμνασμένην தொடர்ந்த பயிற்சியால் பழக்கப்படுத்தப்பட்ட நிலையைக் காட்டுகிறது; πλεονεξία இங்கு பேராசையைக் குறிக்கிறது. மூல உருவகம் தெளிவாகத் தக்கவைக்கப்படுகிறது.
- source_word: κατάρας τέκνα
  choice: சாபத்தின் பிள்ளைகள்
  rationale: கிரேக்கத்தின் உறவுநிலைச் சொல்லமைப்பைத் தக்கவைக்கும் மரியாதைமிக்க, புரிந்துகொள்ளக்கூடிய தமிழ். இது சாபத்தால் வகைப்படுத்தப்பட்ட அல்லது சாபத்திற்கு உரியவர்களைக் குறிக்கும் தீவிர மொழிநடை.
- source_word: ἔχοντες ... ἔχοντες
  choice: கொண்டவர்கள் ... கொண்ட அவர்கள்
  rationale: மீண்டும் வரும் பங்கேற்புவினை வடிவங்களின் குவியும் கண்டன நடையை, தமிழின் இயல்புக்கேற்ற அளவில் மீளுரைப்பதன் மூலம் தக்கவைக்கிறது.
theological_decisions:
- issue: μοιχαλίδος என்ற பாலியல் உருவகத்தை மென்மைப்படுத்தலாமா
  choice: ‘விபசாரியால் நிறைந்த’ என்ற தெளிவான உருவகத்தை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘விபசாரத்தால் நிறைந்த’ அல்லது ‘விபசார ஆசை நிறைந்த’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: மூலத்தின் கூர்மையான ஒருமை உருவகத்தை மரபு அல்லது நடையழகுக்காக மறைக்காமல் பாதுகாக்கிறது; தமிழில் ஏற்படும் புதுமையை அடிக்குறிப்பு விளக்குகிறது.
- issue: ἀκαταπαύστους ἁμαρτίας தொடரின் பொருள்
  choice: ‘பாவத்திலிருந்து ஓயாதவர்கள்’ என்று தொடர்ச்சியான பாவச் செயலை முன்னிறுத்துதல்
  alternative: ‘பாவத்திற்குத் தீராத வேட்கையுள்ளவர்கள்’ என்று அடங்காத ஆசையை முன்னிறுத்துதல்
  rationale: ἀκατάπαυστος என்பதன் நேரடியான ‘ஓயாத/நிறுத்தாத’ வலிமையை முதன்மைப்படுத்துகிறது; இருப்பினும் கண்களைச் சார்ந்த சூழலில் ‘தீராத வேட்கை’ என்ற புரிதலும் சாத்தியமானதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
- issue: πλεονεξία என்பதற்குப் பாரம்பரியமான விருப்பவெறி சார்ந்த சொல்லா அல்லது எளிய நவீனச் சொல்லா
  choice: பேராசை
  alternative: பொருளாசை
  rationale: இங்கு எந்தக் கோட்பாட்டு வேறுபாடும் தேர்வை நிர்ணயிக்கவில்லை; ‘பேராசை’ பரந்த தீய ஆசையையும் அதிகம் பெறும் நாட்டத்தையும் பொதுவாசகர்களுக்குத் தெளிவாகச் சொல்கிறது.
