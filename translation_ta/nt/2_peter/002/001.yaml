id: 2PE.2.1
reference: 2 Peter 2:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἐγένοντο δὲ καὶ ψευδοπροφῆται ἐν τῷ λαῷ, ὡς καὶ ἐν ὑμῖν ἔσονται ψευδοδιδάσκαλοι, οἵτινες παρεισάξουσιν αἱρέσεις ἀπωλείας, καὶ τὸν ἀγοράσαντα αὐτοὺς δεσπότην ἀρνούμενοι, ἐπάγοντες ἑαυτοῖς ταχινὴν ἀπώλειαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/001.yaml
  text: But false prophets also arose among the people[a], just as there will also be false teachers among you, who will secretly bring in destructive heresies, even denying the Master who bought them[b], bringing swift destruction on themselves.
translation:
  language: ta
  text: ஆனால், மக்களிடையே போலித் தீர்க்கதரிசிகளும் தோன்றினார்கள். அதுபோலவே, உங்களிடையேயும் பொய்ப் போதகர்கள் தோன்றுவார்கள். அவர்கள் அழிவை விளைவிக்கும் வழிபிறழ்ந்த போதனைகளை[a] இரகசியமாக நுழைப்பார்கள். தங்களை விலைக்கு வாங்கிய எஜமானரையே[b] மறுதலித்து, தங்கள்மீது விரைவான அழிவை வரவழைத்துக்கொள்வார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அழிவை விளைவிக்கும் பிரிவுகளை.” கிரேக்கச் சொல் கட்சிகள் அல்லது பிரிவினைக் குழுக்களைக் குறிக்கலாம்; இங்கு அழிவுக்கு வழிநடத்தும் போதனைகள் அல்லது இயக்கங்கள் கருத்தில் இருப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தங்களை மீட்ட ஆண்டவரையே.” கிரேக்கத்தில் நேரடியாக, “தங்களை வாங்கிய எஜமானர்” என்று உள்ளது. வாங்குதல் என்ற உருவகம், அதன் இறையியல் வரம்பைப் பற்றிய விவாதத்தைத் தீர்மானிக்காமல் இங்கு பாதுகாக்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγένοντο
  choice: தோன்றினார்கள்
  rationale: போலித் தீர்க்கதரிசிகள் மக்களிடையே வரலாற்றில் உருவாகித் தோன்றியதைக் குறிக்கும் இயல்பான நவீனத் தமிழ்.
- source_word: ψευδοπροφῆται
  choice: போலித் தீர்க்கதரிசிகள்
  rationale: கூட்டுச்சொல்லின் பொருளை நேரடியாகவும் தெளிவாகவும் தருகிறது.
- source_word: ἐν τῷ λαῷ
  choice: மக்களிடையே
  rationale: ஒரு சமூகத்தின் நடுவில் என்பதைக் காட்டுகிறது; முதன்மை உரையில் ‘இஸ்ரவேல் மக்கள்’ என்று சூழலைவிட அதிகமாகக் குறிப்பாக்கவில்லை.
- source_word: ψευδοδιδάσκαλοι
  choice: பொய்ப் போதகர்கள்
  rationale: ‘போலித் தீர்க்கதரிசிகள்’ என்பதுடன் உள்ள இணைப்பைத் தக்கவைத்து, தவறை போதிப்பவர்களைத் தெளிவாகக் குறிக்கிறது.
- source_word: παρεισάξουσιν
  choice: இரகசியமாக நுழைப்பார்கள்
  rationale: மறைவாக அல்லது கள்ளத்தனமாக உள்ளே கொண்டுவருதல் என்ற வினையின் நுணுக்கத்தையும் எதிர்காலச் செயலையும் காக்கிறது.
- source_word: αἱρέσεις ἀπωλείας
  choice: அழிவை விளைவிக்கும் வழிபிறழ்ந்த போதனைகள்
  rationale: இங்கு எஜமானை மறுதலிப்பதோடு தொடர்புடைய தவறான போதனை முன்னிலையாகிறது. அதேவேளை, αἵρεσις என்பதன் ‘பிரிவுகள்/கட்சிகள்’ என்ற சாத்தியத்தை அடிக்குறிப்பு பதிவு செய்கிறது.
- source_word: τὸν ... δεσπότην
  choice: எஜமானர்
  rationale: δεσπότης என்பதன் உரிமையும் அதிகாரமும் சார்ந்த பொருளைத் தருவதோடு, κύριος என்பதற்குரிய வழக்கமான ‘ஆண்டவர்’ என்ற மொழிபெயர்ப்பிலிருந்து வேறுபாட்டைக் காக்கிறது.
- source_word: ἀγοράσαντα αὐτοὺς
  choice: தங்களை விலைக்கு வாங்கிய
  rationale: ἀγοράζω என்பதிலுள்ள வாங்குதல் உருவகத்தை நேரடியாகக் காக்கிறது; ‘மீட்ட’ என்று மொழிபெயர்த்து அதன் இறையியல் வரம்பை முன்கூட்டியே தீர்மானிக்கவில்லை.
- source_word: ἀρνούμενοι
  choice: மறுதலித்து
  rationale: அவருடைய உரிமையையும் அதிகாரத்தையும் ஏற்க மறுப்பதைக் குறிக்கும் வலிமையான, மரபாகத் தெளிவான தமிழ்.
- source_word: ἐπάγοντες ἑαυτοῖς ταχινὴν ἀπώλειαν
  choice: தங்கள்மீது விரைவான அழிவை வரவழைத்துக்கொள்வார்கள்
  rationale: அவர்களுடைய செயலால் அழிவு அவர்களுக்கே நேர்கிறது என்ற தற்சுட்டுப் பொருளையும், ταχινή என்பதன் விரைவையும் காக்கிறது.
theological_decisions:
- issue: இச்சூழலில் αἱρέσεις என்பதன் பொருள்
  choice: வழிபிறழ்ந்த போதனைகள்
  alternative: அழிவை விளைவிக்கும் பிரிவுகள் / பிரிவினைக் குழுக்கள்
  rationale: இரகசியமாக நுழைத்தலும் எஜமானை மறுதலித்தலும் தவறான போதனையை முன்னிலைப்படுத்துகின்றன. எனினும், கிரேக்கச் சொல் கட்சி அல்லது பிரிவையும் குறிக்கக்கூடும் என்பதால் அந்த உண்மையான பல்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: τὸν ἀγοράσαντα αὐτοὺς δεσπότην என்பதன் இறையியல் அழுத்தம்
  choice: தங்களை விலைக்கு வாங்கிய எஜமானர்
  alternative: தங்களை மீட்ட ஆண்டவர்
  rationale: இந்தப் பொய்ப் போதகர்களை எஜமானர் ‘வாங்கினார்’ என்று உரை கூறும் இறையியல் பதற்றத்தை அப்படியே வைக்கிறது; அந்த வாங்குதலின் இயல்பு அல்லது வரம்பைப் பற்றிய விவாதத்தை மொழிபெயர்ப்பு தீர்த்துவிடவில்லை.
- issue: δεσπότης என்பதை κύριος என்பதிலிருந்து வேறுபடுத்துதல்
  choice: எஜமானர்
  alternative: ஆண்டவர் / இறையாண்மையுள்ளவர்
  rationale: மூலத்தில் பயன்படுத்தப்பட்ட தனித்த தலைப்பையும் அது உணர்த்தும் உரிமை மற்றும் அதிகாரத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் வேதாகம எச்சரிக்கைக்குரிய கண்ணியமான தொனியிலும் அமைக்கப்பட்டது. நீண்ட கிரேக்க வாக்கியம் தமிழில் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டது. ‘வழிபிறழ்ந்த போதனைகள்’, ‘எஜமானர்’, ‘விலைக்கு வாங்கிய’ ஆகியவை முறையே கருத்துப் புரிதல், மூலச் சொல் வேறுபாடு, வாங்குதல் உருவகம் ஆகியவற்றைச் சமநிலைப்படுத்துகின்றன.
