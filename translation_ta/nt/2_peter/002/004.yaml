reference: 2 Peter 2:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Εἰ γὰρ ὁ θεὸς ἀγγέλων ἁμαρτησάντων οὐκ ἐφείσατο, ἀλλὰ ⸀σειραῖς ζόφου ταρταρώσας παρέδωκεν εἰς κρίσιν τηρουμένους,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/004.yaml
  text: For if God did not spare angels when they sinned[a], but cast them into Tartarus and committed them to chains of gloom, to be kept for judgment[b],
translation:
  language: ta
  text: ஏனெனில், பாவம் செய்த தேவதூதர்களைக் கடவுள் தப்பவிடாமல், அவர்களைத் தார்த்தரஸுக்குள் தள்ளி[a], காரிருளின் சங்கிலிகளுக்கு ஒப்புவித்து, தீர்ப்புக்காகக் காவலில் வைக்கப்பட்டிருக்கும்படி செய்தாரானால்[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தார்த்தரஸுக்குள் தள்ளி’ என்பதற்குப் பதிலாக, ‘நரகத்தில் தள்ளி’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் குறிப்பாக ஒருவரைத் தார்த்தரஸில் தள்ளுவதைக் குறிக்கிறது; எனவே மூலவாசகத்தின் துல்லியமான சொல்லாட்சி முதன்மை உரையில் வைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: சில கையெழுத்துப் பிரதிகளில் ‘காரிருளின் சங்கிலிகள்’ என்பதற்குப் பதிலாக ‘காரிருளின் குழிகள்’ என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: ἐφείσατο
  choice: தப்பவிடாமல்
  rationale: தண்டனையிலிருந்து விட்டுவைக்கவில்லை என்ற நீதித்துறைச் சூழலிலான பொருளை, இயல்பான நவீன தமிழில் சுருக்கமாகத் தருகிறது.
- source_word: ἀγγέλων ἁμαρτησάντων
  choice: பாவம் செய்த தேவதூதர்களை
  rationale: இறந்தகாலப் பங்கேற்புச் சொல்லின் நிகழ்வுத்தன்மையைப் பேணுகிறது; தேவதூதர்கள் பாவம் செய்ததைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது.
- source_word: σειραῖς ζόφου
  choice: காரிருளின் சங்கிலிகளில்
  rationale: σειραί என்பதைக் ‘சங்கிலிகள்’ என்றும் ζόφος என்பதைக் சாதாரண இருளைவிட அச்சமூட்டும் அடர்ந்த இருளைக் குறிக்கும் ‘காரிருள்’ என்றும் வழங்குகிறது; தத்திவ் அமைப்பின் தொடர்பை அளவுக்கு மீறி விளக்காமல் விடுகிறது.
- source_word: ταρταρώσας
  choice: தார்த்தரஸுக்குள் தள்ளி
  rationale: அரிய கிரேக்க வினைச்சொல் குறிப்பாகத் தார்த்தரஸில் அடைப்பதைக் குறிக்கிறது. பொதுவான ‘நரகம்’ என்ற சொல்லால் அதன் தனிப்பட்ட படிமத்தை மங்கச் செய்யாமல் பாதுகாக்கிறது.
- source_word: παρέδωκεν
  choice: ஒப்புவித்து
  rationale: நீதித்துறை அல்லது காவல் சூழலில் ஒருவரைக் கட்டுப்பாட்டிற்குள் ஒப்படைக்கும் பொருளைத் தருகிறது.
- source_word: εἰς κρίσιν
  choice: தீர்ப்புக்காக
  rationale: இன்னும் வரவிருக்கும் நியாயத்தீர்ப்பைச் சுட்டுகிறது; ‘தண்டனைத் தீர்ப்பு’ என்று முடிவை முன்கூட்டியே நிர்ணயிப்பதைத் தவிர்க்கிறது.
- source_word: τηρουμένους
  choice: காவலில் வைக்கப்பட்டிருக்கச் செய்து
  rationale: தீர்ப்பு வரும்வரை தொடரும் காவல் நிலையைக் குறிக்கும் நிகழ்காலச் செயப்பாட்டு பங்கேற்பின் நீடித்த தன்மையை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ταρταρώσας என்ற சொல்லின் தனித்துவத்தைப் பின்னாளைய நரகக் கோட்பாடுகளுடன் ஒன்றாக்காமல் வழங்குதல்
  choice: தார்த்தரஸுக்குள் தள்ளி
  alternative: நரகத்தில் தள்ளி
  rationale: ταρταρόω என்பது பொதுவான பாதாளம் அல்லது நரகம் என்பதைக் காட்டிலும் தார்த்தரஸைக் குறிப்பாக நினைவூட்டுகிறது. ஒலிபெயர்ப்பு மூலத்தின் குறிப்பிட்ட படிமத்தைப் பேணுகிறது; அடிக்குறிப்பு வாசகருக்கு அதன் பொருளை விளக்குகிறது.
- issue: ‘காரிருளின் சங்கிலிகள்’, தார்த்தரஸ், காவலில் வைத்தல் ஆகியவற்றின் தொடரியல் உறவு
  choice: அவர்களைத் தார்த்தரஸுக்குள் தள்ளி, காரிருளின் சங்கிலிகளில் ஒப்புவித்து, தீர்ப்புக்காகக் காவலில் வைக்கப்பட்டிருக்கச் செய்தார்
  alternative: காரிருளின் சங்கிலிகளால் கட்டி தார்த்தரஸில் தீர்ப்புவரை வைத்தார்
  rationale: மாற்று வடிவம் சங்கிலிகளைத் தெளிவாகக் கருவியாக்குகிறது. தேர்ந்த வடிவம் கிரேக்கத்தின் செறிவான தொடரைத் தக்கவைத்து, சங்கிலிகள் கருவியா, இடநிலைக் கட்டுப்பாட்டின் படிமமா என்பதைத் தேவையின்றித் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வேதவாக்கியத்திற்குரிய கனமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. இவ்வசனம் அடுத்துவரும் நிபந்தனைத் தொடரின் தொடக்கமாக இருப்பதால் ‘செய்தாரானால்’ என்றும் இறுதியில் காற்புள்ளியுடனும் முடிகிறது. ‘தார்த்தரஸ்’ பொதுவாசகருக்கு அறிமுகமில்லாததாக இருக்கலாம் என்பதால், அதன் துல்லியம் முதன்மை உரையில் காக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
