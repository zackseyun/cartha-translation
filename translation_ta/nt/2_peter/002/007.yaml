theological_decisions:
- issue: ஆதியாகமத்தில் லோத்தின் செயல்களை முன்னிட்டு அவருக்குக் கொடுக்கப்படும் அறநிலை வருணனை
  choice: நீதிமானாகிய லோத்து
  alternative: லோத்து என்ற நீதிமான்; அல்லது மதிப்பீட்டைத் தளர்த்திய மொழிபெயர்ப்பு
  rationale: δίκαιον என்ற சொல் லோத்தைத் தெளிவாக ‘நீதிமான்’ என்று வருணிக்கிறது. பிற விவரங்களுடன் ஒத்திசைக்க முயன்று மூல உரையின் மதிப்பீட்டைத் தளர்த்தாமல் அப்படியே தக்கவைக்கப்படுகிறது.
- issue: ἀσέλγεια என்பதன் அறநெறிப் பரப்பு
  choice: வெட்கங்கெட்ட காமவெறி நிறைந்த
  alternative: ஒழுக்கக்கேடான; கட்டுப்பாடற்ற
  rationale: சூழலில் புலனின்பம் சார்ந்த வெட்கமற்ற ஒழுக்கமீறல் முன்னிலையில் இருப்பதைத் தெரிவிக்கிறது; அதேவேளை ஒரு குறிப்பிட்ட பாலியல் செயலை மட்டும் மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் தொடர்ச்சியைக் காட்ட இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது. ‘நெறிகெட்டவர்கள்’ என்பது அளவுக்கு மீறிய சட்டத் தொழில்நுட்பச் சொல்லாக்கத்தைத் தவிர்த்து அற-ஒழுங்கை மீறுதல் என்ற கருத்தைத் தருகிறது.
