source:
  edition: SBLGNT
  text: οἶδεν κύριος εὐσεβεῖς ἐκ πειρασμοῦ ῥύεσθαι, ἀδίκους δὲ εἰς ἡμέραν κρίσεως κολαζομένους τηρεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/009.yaml
  text: then the Lord knows how to rescue the godly from trial[a], and to keep the unrighteous under punishment until the day of judgment[b],
translation:
  language: ta
  text: ஆகவே, இறைபக்தியுள்ளவர்களைச் சோதனையிலிருந்து[a] மீட்பதற்கும், நீதியற்றவர்களைத் தண்டனைக்கு உட்பட்ட நிலையில் நியாயத்தீர்ப்பு நாள்வரை காத்துவைப்பதற்கும் எப்படியென்று ஆண்டவர் அறிந்திருக்கிறார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாவத் தூண்டுதலிலிருந்து.” கிரேக்கச் சொல் சோதனை அல்லது பாவம் செய்யத் தூண்டுதல் ஆகிய இரண்டையும் குறிக்கலாம்; இங்கு சூழல் துன்பச் சோதனையிலிருந்து மீட்பதையே அதிகம் ஆதரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நீதியற்றவர்களை நியாயத்தீர்ப்பு நாளில் தண்டிப்பதற்காகக் காத்துவைப்பதற்கும்.” கிரேக்கப் பங்கேற்புவினை, அவர்கள் இப்போது தண்டனைக்கு உட்பட்டுக் காத்துவைக்கப்படுவதையோ, வரவிருக்கும் நியாயத்தீர்ப்பில் தண்டிக்கப்படுவதற்காகக் காத்துவைக்கப்படுவதையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: οἶδεν
  choice: அறிந்திருக்கிறார்
  rationale: οἶδα இங்கு இரண்டு வினையெச்சங்களோடு வந்து, ஆண்டவர் எவ்வாறு மீட்கவும் காத்துவைக்கவும் வேண்டும் என்பதை அறிந்திருப்பதைக் குறிக்கிறது. தமிழில் ‘அறிந்திருக்கிறார்’ இயல்பாக இந்த நடைமுறை அறிவையும் திறனையும் தெரிவிக்கிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான வழக்கமான, கண்ணியமான தமிழ் வேதாகமச் சொல்; இங்கு குறிப்பிட்ட ஆண்டவரைக் குறிக்கிறது.
- source_word: εὐσεβεῖς
  choice: இறைப்பற்றுள்ளவர்களை
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட இந்தப் பெயரடை, கடவுளிடம் பக்தியும் மரியாதையும் கொண்டவர்களைக் குறிக்கிறது. ‘இறைப்பற்றுள்ளவர்கள்’ நவீன தமிழில் இயல்பானது; வெறும் ஒழுக்கநிலையாக அதைச் சுருக்குவதில்லை.
- source_word: ἐκ πειρασμοῦ
  choice: சோதனையிலிருந்து
  rationale: πειρασμός சோதனை, பரீட்சை அல்லது பாவத் தூண்டுதல் எனப் பொருள்படலாம். நோவா மற்றும் லோத்து பற்றிய முந்தைய சூழலில் துன்பகரமான சோதனையிலிருந்து விடுவித்தல் முன்னிலையில் இருப்பதால் ‘சோதனை’ தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ῥύεσθαι
  choice: மீட்கவும்
  rationale: ῥύομαι ஆபத்து அல்லது துன்பத்திலிருந்து விடுவிப்பதைக் குறிக்கிறது. ‘மீட்க’ இயல்பாகவும் செறிவாகவும் அந்தப் பொருளைத் தருகிறது.
- source_word: ἀδίκους
  choice: அநீதியுள்ளவர்களை
  rationale: ἄδικος என்பதன் ஒழுக்க மற்றும் நீதித்துறை சார்ந்த வலிமையைப் பாதுகாக்கிறது; ‘தீயவர்கள்’ என்று பொதுமைப்படுத்தவில்லை.
- source_word: εἰς ἡμέραν κρίσεως
  choice: நியாயத்தீர்ப்பு நாள்வரை
  rationale: τηρεῖν உடன் வரும் εἰς, வரவிருக்கும் நியாயத்தீர்ப்பு நாளை நோக்கிய கால எல்லையை இச்சூழலில் இயல்பாகக் குறிக்கிறது. மாற்றாக ‘நியாயத்தீர்ப்பு நாளுக்காக’ என்றும் கொள்ள இயலும்.
- source_word: κολαζομένους
  choice: தண்டனைக்கு உட்பட்டவர்களாக
  rationale: நிகழ்காலப் பங்கேற்புவினையின் தொடர்நிலைத் தன்மையைப் பாதுகாத்து, அவர்கள் காத்துவைக்கப்படும் நிலையில் தண்டனைக்கு உட்பட்டிருப்பதை வெளிப்படுத்துகிறது; இதை இறுதி நாளில் மட்டுமே தொடங்கும் தண்டனையாகத் தீர்மானிக்கவில்லை.
- source_word: τηρεῖν
  choice: காத்துவைக்கவும்
  rationale: τηρέω என்பதன் காத்தல், பாதுகாத்து வைத்தல் அல்லது ஒதுக்கிவைத்தல் என்ற பரப்பை இங்கு ‘காத்துவைக்க’ இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: πειρασμός என்பதன் சூழல்சார் பொருள்
  choice: பொதுவான சோதனை/துன்பச் சோதனை
  alternative: பாவம் செய்யத் தூண்டும் சோதனை
  rationale: முந்தைய வசனங்களில் பேரழிவு மற்றும் ஒடுக்கமான சூழல்களிலிருந்து நோவாவும் லோத்தும் விடுவிக்கப்பட்டது எடுத்துக்காட்டாக இருப்பதால், இங்கு ‘சோதனை’ முதன்மைப் பொருளாக ஏற்றது. இருப்பினும் கிரேக்கச் சொல்லின் மற்ற பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: κολαζομένους என்பதன் கால மற்றும் பொருள் வலிமை
  choice: நியாயத்தீர்ப்பு நாள்வரை தண்டனைக்கு உட்பட்ட நிலையில் காத்துவைக்கப்படுதல்
  alternative: நியாயத்தீர்ப்பு நாளில் தண்டிக்கப்படுவதற்காகக் காத்துவைக்கப்படுதல்
  rationale: நிகழ்காலப் பங்கேற்புவினை தொடரும் தண்டனை நிலையைச் சுட்டக்கூடும்; ஆனால் εἰς ἡμέραν κρίσεως இறுதி நாளை நோக்கியும் நிற்கிறது. முதன்மை உரை தொடர்நிலையை வெளிப்படுத்துகிறது; எதிர்காலத் தண்டனை வாசிப்பு அடிக்குறிப்பில் தரப்பட்டு உண்மையான இலக்கணத் தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘இறைப்பற்றுள்ளவர்கள்’ சாதாரண வாசகர்களுக்குப் புரியும்படியும் εὐσεβεῖς என்பதன் சமயப்பற்று சார்ந்த பொருளைப் பாதுகாக்கும்படியும் தேர்ந்தெடுக்கப்பட்டது. வசனம் முந்தைய நிபந்தனை அமைப்பின் முடிவாக இருப்பதால் ‘ஆகவே’ சேர்க்கப்பட்டுள்ளது. இரு அடிக்குறிப்பு குறிகளும் தொடர்புடைய சொற்றொடர்களின் அருகில் முதன்மை உரையில் இடம்பெற்றுள்ளன.
