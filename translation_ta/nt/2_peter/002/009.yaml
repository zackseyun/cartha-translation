revisions:
- from: ஆகவே, இறைப்பற்றுள்ளவர்களைச் சோதனையிலிருந்து[a] மீட்கவும், அநீதியுள்ளவர்களைத் தண்டனைக்கு உட்பட்டவர்களாக நியாயத்தீர்ப்பு நாள்வரை காத்துவைக்கவும் ஆண்டவர் அறிந்திருக்கிறார்[b].
  to: ஆகவே, இறைபக்தியுள்ளவர்களைச் சோதனையிலிருந்து[a] மீட்பதற்கும், நீதியற்றவர்களைத் தண்டனைக்கு உட்பட்ட நிலையில் நியாயத்தீர்ப்பு நாள்வரை காத்துவைப்பதற்கும் எப்படியென்று ஆண்டவர் அறிந்திருக்கிறார்[b].
  rationale: The revision explicitly conveys the capability sense of οἶδεν, improves modern Tamil idiom, and locates footnote [b] at the clause it explains. It retains the main reading of ongoing punishment while preserving the legitimate alternative syntactical reading in the footnote.
  reviewer_model: gpt-5.6-terra
