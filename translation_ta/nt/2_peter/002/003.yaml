revisions:
- from: பேராசையால், புனைந்த வார்த்தைகளைப் பயன்படுத்தி அவர்கள் உங்களைத் தங்கள் இலாபத்திற்காகச் சுரண்டுவார்கள்.[a] வெகுகாலத்திற்கு முன்பே தீர்மானிக்கப்பட்ட அவர்களுடைய நியாயத்தீர்ப்பு செயலற்றுப் போகவில்லை; அவர்களுடைய அழிவு உறங்கிக்கொண்டிருக்கவில்லை.
  to: பேராசையால், புனையப்பட்ட சொற்களால் அவர்கள் உங்களைச் சுரண்டுவார்கள்.[a] வெகுகாலத்திற்கு முன்பிருந்தே அவர்களுக்கான நியாயத்தீர்ப்பு செயலற்றிருக்கவில்லை; அவர்களுடைய அழிவு உறங்கிக்கொண்டிருக்கவில்லை.
  rationale: The revision removes the added idea that judgment was ‘determined,’ while retaining the Greek temporal emphasis that it has not been inactive from long ago. It also makes the phrase for fabricated speech more concise and source-near, without changing the commercial-exploitation sense or the personified imagery of destruction.
