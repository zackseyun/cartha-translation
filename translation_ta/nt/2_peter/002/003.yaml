source:
  edition: SBLGNT
  text: καὶ ἐν πλεονεξίᾳ πλαστοῖς λόγοις ὑμᾶς ἐμπορεύσονται· οἷς τὸ κρίμα ἔκπαλαι οὐκ ἀργεῖ, καὶ ἡ ἀπώλεια αὐτῶν οὐ ⸀νυστάζει.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/003.yaml
  text: And in greed they will exploit you with fabricated words. Their judgment from long ago is not idle[a], and their destruction is not asleep.
translation:
  language: ta
  text: பேராசையால், புனையப்பட்ட சொற்களால் அவர்கள் உங்களைச் சுரண்டுவார்கள்.[a] வெகுகாலத்திற்கு முன்பிருந்தே அவர்களுக்கான நியாயத்தீர்ப்பு செயலற்றிருக்கவில்லை; அவர்களுடைய அழிவு உறங்கிக்கொண்டிருக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் உங்களை வணிகப் பொருளாக்குவார்கள்.” மக்களிடமிருந்து இலாபம் பெற அவர்களைப் பொருள்போல் நடத்துவதை கிரேக்கச் சொல் வணிக உருவகமாகக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλεονεξίᾳ
  choice: பேராசையால்
  rationale: இங்கு பேராசை பொய்ப் போதகர்களின் செயலுக்கான உந்துதலாக உள்ளது; காரணத்தைக் காட்டும் இந்தச் சொல் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: πλαστοῖς λόγοις
  choice: புனைந்த வார்த்தைகளைப் பயன்படுத்தி
  rationale: πλαστός என்பது உருவாக்கப்பட்ட, புனையப்பட்ட என்ற பொருளுடையது; வெறும் பொய்யை மட்டுமல்லாமல் திட்டமிட்டுக் கட்டமைக்கப்பட்ட பேச்சையும் இச்சொற்றொடர் உணர்த்துகிறது.
- source_word: ἐμπορεύσονται
  choice: உங்களைத் தங்கள் இலாபத்திற்காகச் சுரண்டுவார்கள்
  rationale: மக்களை வணிகப் பொருள்போல் நடத்தி அவர்களிடமிருந்து இலாபம் பெறும் வணிக உருவகத்தை, நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: κρίμα
  choice: நியாயத்தீர்ப்பு
  rationale: நீதிசார் தீர்ப்பு அல்லது தண்டனை என்ற பரந்த பொருளைத் தக்கவைத்து, அதன் இயல்பைத் தேவையின்றி மிகுதியாக வரையறுக்காமல் விடுகிறது.
- source_word: ἔκπαλαι
  choice: வெகுகாலத்திற்கு முன்பே தீர்மானிக்கப்பட்ட
  rationale: நியாயத்தீர்ப்பு பழங்காலத்திலிருந்தே நிலைநிறுத்தப்பட்டுள்ளது என்ற காலச்சார்ந்த வலியுறுத்தலைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: οὐκ ἀργεῖ
  choice: செயலற்றுப் போகவில்லை
  rationale: ἀργέω என்பதன் செயலற்றிருத்தல் அல்லது பயனின்றிப் போதல் என்ற உருவகத்தைத் தக்கவைக்கிறது; வெறும் காலதாமதம் என்று மட்டும் குறுக்கவில்லை.
- source_word: ἀπώλεια
  choice: அழிவு
  rationale: அழிதல் அல்லது கேடு என்ற பரந்த பொருளைத் தெளிவாகக் கூறுகிறது; தண்டனையின் முறை அல்லது காலத்தை உரை கூறுவதற்கு அப்பால் வரையறுக்கவில்லை.
- source_word: οὐ νυστάζει
  choice: உறங்கிக்கொண்டிருக்கவில்லை
  rationale: அழிவை மனிதர்போல் உருவகப்படுத்தும் கிரேக்க மொழியின் உயிரோட்டமான படிமத்தைத் தமிழிலும் பாதுகாக்கிறது.
theological_decisions:
- issue: அறிவிக்கப்படும் தண்டனையின் இயல்பு
  choice: வரவிருக்கும் தெய்வீக நியாயத்தீர்ப்பையும் அழிவையும் உரையில் உள்ளபடியே கூறுதல்
  alternative: ‘அழிவு’ என்பதை முற்றிலும் இல்லாமற்போதல் என்றோ, இறுதி நியாயத்தீர்ப்பற்ற வெறும் கேடு என்றோ குறிப்பாக விளக்குதல்
  rationale: பொய்ப் போதகர்கள்மீது நிச்சயமான தீர்ப்பு வருவதாக வசனம் கூறுகிறது; ஆனால் அந்தத் தண்டனையின் செயல்முறையையோ காலநீளத்தையோ வரையறுக்கவில்லை. எனவே அந்தத் தத்துவத் திறந்தநிலை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் வேதவாக்கியத்திற்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘செயலற்றுப் போகவில்லை’ மற்றும் ‘உறங்கிக்கொண்டிருக்கவில்லை’ என்பவை மூலத்தின் இணையான உயிர்ப்பூட்டும் உருவகங்களைப் பாதுகாக்கின்றன.
