source:
  edition: SBLGNT
  text: καὶ πόλεις Σοδόμων καὶ Γομόρρας τεφρώσας ⸀καταστροφῇ κατέκρινεν, ὑπόδειγμα μελλόντων ⸀ἀσεβέσιν τεθεικώς,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/006.yaml
  text: and if by reducing the cities of Sodom and Gomorrah to ashes he condemned them to destruction[a], having made them an example for those who would be ungodly[b],
translation:
  language: ta
  text: சோதோம், கொமோரா நகரங்களைச் சாம்பலாக்கி, அவற்றை அழிவுக்குத் தீர்ப்பளித்து[a], எதிர்காலத்தில் இறைப்பற்றில்லாமல் வாழப்போகிறவர்களுக்கு அவற்றை ஓர் எடுத்துக்காட்டாக வைத்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவற்றைச் சாம்பலாக மாற்றி.’
    reason: τεφρώσας என்பதற்கு ‘சாம்பலாக்கி’ என்பதற்கான நேரடியான சொற்பொருள் மாற்று.
  - marker: b
    text: அல்லது, ‘எதிர்காலத்தில் இறைப்பற்றில்லாதவர்களுக்கு அவற்றை ஓர் எடுத்துக்காட்டாக வைத்தார்.’
    reason: μελλόντων ἀσεβέσιν என்பதை எதிர்காலத்தில் இருக்கும் இறைப்பற்றில்லாத நபர்களைக் குறிக்கும் தொடராக மொழிபெயர்க்கும் மாற்று.
lexical_decisions:
- source_word: τεφρώσας
  choice: சாம்பலாக்கி
  rationale: வெறுமனே எரித்தல் அல்லாமல், சாம்பலாகும் முடிவை τεφρόω குறிக்கிறது; தமிழில் இயல்பாகவும் சுருக்கமாகவும் இதைத் தெரிவிக்கிறது.
- source_word: καταστροφῇ κατέκρινεν
  choice: அழிவுக்குத் தீர்ப்பளித்து
  rationale: καταστροφῇ என்பதன் விளைவு/இலக்கையும் κατέκρινεν என்பதன் நீதித்துறை சார்ந்த கண்டனத் தீர்ப்பையும் இணைத்துப் பாதுகாக்கிறது.
- source_word: ὑπόδειγμα
  choice: ஓர் எடுத்துக்காட்டு
  rationale: சூழலில் எச்சரிக்கைப் பொருள் இருந்தாலும், கிரேக்கச் சொல்லின் பொதுவான ‘எடுத்துக்காட்டு’ என்ற பொருளைத் தக்கவைத்து, எச்சரிக்கை வலிமையைச் சூழல் உணர்த்த விடுகிறது.
- source_word: μελλόντων ἀσεβέσιν
  choice: இனி இறைப்பற்றில்லாமல் வாழப்போகிறவர்களுக்கு
  rationale: μέλλω சார்ந்த எதிர்கால நோக்கையும் ἀσεβής என்பதன் இறைநெறி மறுக்கும் வாழ்க்கைத் தன்மையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τεθεικώς
  choice: வைத்தார்
  rationale: τίθημι என்பதன் ‘நிறுவுதல்/வைத்தல்’ என்ற கருத்தையும், அவை தொடர்ந்து எடுத்துக்காட்டாக நிற்கும் விளைவுநிலையையும் சுருக்கமாகத் தருகிறது.
- source_word: πόλεις Σοδόμων καὶ Γομόρρας
  choice: சோதோம், கொமோரா நகரங்களை
  rationale: இரு பெயர்களுடனும் தொடர்புடைய நகரங்களைச் சுட்டும் கிரேக்கப் பன்மையைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: சுற்றியுள்ள வசனங்களிலிருந்து புரிந்துகொள்ளப்படும் எழுவாய்
  choice: வினைமுற்றின் மரியாதை ஒருமை வழியாக மறைமுகமாக வைத்தல் (‘வைத்தார்’)
  alternative: ‘தேவன்’ அல்லது ‘ஆண்டவர்’ என்று வெளிப்படையாகச் சேர்த்தல்
  rationale: கிரேக்கத்தில் இக்கூற்றுக்குள் எழுவாய் பெயரிடப்படவில்லை; முன்னுள்ள சூழலிலிருந்து அது புரிகிறது. தமிழில் இயல்பாகத் தொடர, குறிப்பிடப்படாத தெய்வீகப் பட்டத்தைச் சேர்க்காமல் மறைமுக எழுவாயைப் பாதுகாக்கிறது.
- issue: ἀσεβέσιν என்பதன் வலிமை
  choice: இறைப்பற்றில்லாமல் வாழப்போகிறவர்கள்
  alternative: இறைப்பற்றில்லாதவர்கள்
  rationale: நபர்களைக் குறிக்கும் சொல்லின் இறைநெறி சார்ந்த எதிர்மறை வலிமையையும் μέλλω-வின் எதிர்கால நோக்கையும் தெரிவிக்கிறது; குறிப்பிட்ட பாவப்பட்டியலையோ சமயப் பிரிவு சார்ந்த விளக்கத்தையோ சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. இது நீளமான ‘என்றால்’ தொடரின் ஒரு பகுதி என்பதால், தனி வசனத்தில் ‘என்றால்’ சேர்க்காமல் கிரேக்கத் தொடரின் இணைப்பை இயல்பான வாக்கிய ஓட்டத்தில் வைத்துள்ளது. ‘சோதோம், கொமோரா’ என்பது தமிழில் பரவலாக அறியப்பட்ட வேதாகமப் பெயருருக்கள்.
