source:
  edition: SBLGNT
  text: εἰ δὲ ζητοῦντες δικαιωθῆναι ἐν Χριστῷ εὑρέθημεν καὶ αὐτοὶ ἁμαρτωλοί, ἆρα Χριστὸς ἁμαρτίας διάκονος; μὴ γένοιτο·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/017.yaml
  text: But if[a], while seeking to be justified in Messiah, we ourselves also were found to be sinners, is Messiah then a servant of sin? May it never be!
translation:
  language: ta
  text: ஆனால், மேசியாவில்[a] நீதிமான்களாக்கப்பட நாடும்போது, நாமேகூட பாவிகள் என்று காணப்பட்டோம் என்றால், மேசியா பாவத்திற்குச் சேவை செய்பவரா? ஒருபோதும் இல்லை!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மேசியா” என்பது பாரம்பரியமாக “கிறிஸ்து” என்று மொழிபெயர்க்கப்படுகிறது; இவ்வசனத்தில் அடுத்து வரும் இடத்திலும் இதே சொல் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητοῦντες
  choice: நாடுகிற
  rationale: முதன்மை வினையோடு ஒரே நேரத்தில் நடைபெறும் முயற்சியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δικαιωθῆναι
  choice: நீதிமான்களாக்கப்பட
  rationale: இறைவனால் நீதிமான்களாக ஏற்றுக்கொள்ளப்படுதல் அல்லது அறிவிக்கப்படுதல் என்ற பவுலின் சட்டவியல் நுணுக்கத்தைத் தீர்த்துவிடாமல், கிரேக்கச் செயப்பாட்டு வடிவத்தையும் காக்கிறது.
- source_word: ἐν Χριστῷ
  choice: மேசியாவில்
  rationale: ἐν என்பதின் உறவு, இணைவு, அல்லது தளப் பொருள் சார்ந்த நெகிழ்வை விளக்கிச் சுருக்காமல் காக்கிறது; Χριστός இங்கு பட்டப்பெயராக மொழிபெயர்க்கப்படுகிறது.
- source_word: εὑρέθημεν
  choice: காணப்பட்டால்
  rationale: கிரேக்கச் செயப்பாட்டு வடிவத்தையும், உண்மை வெளிப்பட்டதாகக் காட்டும் சொல்லாட்சியையும் பாதுகாக்கிறது.
- source_word: καὶ αὐτοὶ ἁμαρτωλοί
  choice: நாமும்கூட பாவிகள்
  rationale: αὐτοὶ தரும் தன்வலியுறுத்தலையும் καί தரும் ‘கூட’ என்ற சேர்க்கைப் பொருளையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἁμαρτίας διάκονος
  choice: பாவத்துக்குத் தொண்டு செய்பவர்
  rationale: διάκονος என்பதைக் குறிப்பிட்ட திருச்சபைப் பதவியாகத் தவறாக உணர்த்தாமல், பாவத்தின் சார்பில் சேவை செய்வது என்ற குற்றச்சாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: μὴ γένοιτο
  choice: ஒருபோதும் இல்லை!
  rationale: சொல்லுக்குச் சொல் அமைப்பை விட, பவுலின் மிக வலுவான மறுப்பை நவீனத் தமிழில் நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: மேசியாவை பாவத்திற்குக் காரணமானவர் என்று வாக்கியம் கூறுகிறதா என்பது
  choice: மேசியா பாவத்துக்குத் தொண்டு செய்பவரா?
  alternative: மேசியா பாவத்தை உண்டாக்குகிறவரா?
  rationale: கிரேக்கம் ஒரு விளைவைச் சோதிக்கும் சொல்லாட்சிக் கேள்வியை எழுப்புகிறது; மேசியா பாவத்தை உண்டாக்குகிறார் என்று உறுதிப்படுத்தவில்லை. ‘தொண்டு செய்பவர்’ என்பது நிராகரிக்கப்படும் குற்றச்சாட்டை மேலதிகக் கோட்பாட்டு விளக்கமின்றி காக்கிறது.
- issue: ἐν Χριστῷ என்பதின் உறவுப் பொருள்
  choice: மேசியாவில்
  alternative: மேசியாவுடன் இணைந்திருப்பதன் மூலம்
  rationale: ‘மேசியாவில்’ என்பது கிரேக்கத்தின் சுருக்கத்தையும் உண்மையான பொருள் நெகிழ்வையும் காக்கிறது; விரிவான மாற்று இணைவு என்ற ஒரே விளக்கத்தை முதன்மைப்படுத்திவிடும்.
translation_notes:
  register: நவீன பொதுத்தமிழில், பவுலின் வாதத்தின் இறுக்கத்தையும் சொல்லாட்சிக் கேள்வியின் வலிமையையும் காக்கும் கண்ணியமான நடை. ‘நீதிமான்களாக்கப்பட’ மற்றும் ‘மேசியாவில்’ ஆகியவை இறையியல் நுணுக்கத்தை விளக்கிச் சுருக்காமல் பாதுகாக்கத் தேர்ந்தெடுக்கப்பட்டன.
