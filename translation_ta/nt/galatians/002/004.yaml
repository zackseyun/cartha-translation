reference: Galatians 2:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διὰ δὲ τοὺς παρεισάκτους ψευδαδέλφους, οἵτινες παρεισῆλθον κατασκοπῆσαι τὴν ἐλευθερίαν ἡμῶν ἣν ἔχομεν ἐν Χριστῷ Ἰησοῦ, ἵνα ἡμᾶς ⸀καταδουλώσουσιν—
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/004.yaml
  text: But because of the false brothers secretly brought in[a], who slipped in to spy out our freedom that we have in Messiah Jesus[b], so that they might enslave us—
translation:
  language: ta
  text: ஆனால், இரகசியமாக உள்ளே கொண்டுவரப்பட்ட பொய்ச் சகோதரர்களின் காரணமாக—அவர்கள் மெசியா இயேசுவில் நமக்குள்ள விடுதலையை உளவு பார்ப்பதற்காக இரகசியமாக நுழைந்தார்கள்; நம்மை அடிமைப்படுத்துவதற்காக—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεισάκτους
  choice: இரகசியமாக உள்ளே கொண்டுவரப்பட்ட
  rationale: வெளியிலிருந்து மறைவாக அறிமுகப்படுத்தப்பட்டவர்கள் என்ற பெயரடைச் சாயலைக் காக்கிறது; தொடர்ந்து வரும் παρεισῆλθον என்ற வினையிலிருந்தும் இதை வேறுபடுத்துகிறது.
- source_word: ψευδαδέλφους
  choice: போலிச் சகோதரர்கள்
  rationale: பவுலின் குடும்ப உறவுச் சொல்லையும் கடுமையான மதிப்பீட்டையும் காக்கும் இயல்பான நவீனத் தமிழ்; தங்களைச் சக விசுவாசிகளாகக் காட்டிக்கொண்ட ஆண்களைக் குறிக்கிறது.
- source_word: παρεισῆλθον
  choice: இரகசியமாக நுழைந்தார்கள்
  rationale: மறைவாக உள்ளே வந்தார்கள் என்ற வினையின் சாயலைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: κατασκοπῆσαι
  choice: உளவுபார்த்து
  rationale: வெறுமனே கவனிப்பதைவிட பகைநோக்குடன் மறைவாக ஆராயும் பொருளைக் காக்கிறது.
- source_word: ἐλευθερίαν
  choice: விடுதலை
  rationale: கட்டுப்பாட்டிலிருந்து விடுபட்ட நிலை என்ற பவுலின் சமூக மற்றும் இறையியல் கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: மெசியா இயேசுவுக்குள்
  rationale: Χριστός என்பதன் பட்டப்பெயர்ச் சாயலைக் காத்து, ἐν என்பதன் ஒன்றிப்பைச் சுட்டும் உருவகத்தையும் மறைக்காமல் தருகிறது.
- source_word: καταδουλώσουσιν
  choice: அடிமைப்படுத்துவதற்காக
  rationale: ஒருவரை அடிமை நிலைக்குக் கொண்டுவருதல் என்ற வலுவான பொருளை நேரடியாகக் காக்கிறது.
- source_word: ἵνα ... καταδουλώσουσιν
  choice: நம்மை அடிமைப்படுத்துவதற்காக
  rationale: ἵνα கூறும் நோக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; அரிதான எதிர்காலக் குறிப்பு வினையுடன் வந்தாலும் இங்கு நோக்கப் பொருளே சூழலுக்கு ஏற்றது.
theological_decisions:
- issue: Χριστῷ என்பதை பட்டப்பெயராக மொழிபெயர்ப்பதா அல்லது பெயர்போன்ற வடிவமாக வைத்திருப்பதா
  choice: மெசியா இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: இச்சூழலில் Χριστός என்பதன் ‘அபிஷேகம் செய்யப்பட்டவர்/மெசியா’ என்ற பட்டப்பெயர்ச் சாயல் இன்னும் கேட்கக்கூடியது; ஆகவே அதை வெறும் பெயரின் பகுதிபோல் ஒலிக்கச் செய்யாமல் மொழிபெயர்க்கிறது.
- issue: ἐν Χριστῷ Ἰησοῦ என்பதன் உறவுச் சாயல்
  choice: மெசியா இயேசுவுக்குள்
  alternative: மெசியா இயேசுவில்
  rationale: பவுலின் ‘மெசியாவுக்குள்’ என்ற பங்கேற்பு/ஒன்றிப்பு உருவகத்தைத் தமிழில் வெளிப்படையாகக் காக்கிறது; அதன் இறையியல் பொருளை ‘மூலமாக’ என்று ஒரே விதமாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியக்கூடியதுமான நடை. இந்த வசனம் கிரேக்கத்திலும் முழுமையடையாத தொடராக இருப்பதால் இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது. ‘போலிச் சகோதரர்கள்’ என்ற குடும்ப உறவுச் சொல்லும், ‘உளவுபார்த்து’ மற்றும் ‘அடிமைப்படுத்த’ என்பவற்றின் மோதல் வலிமையும் பாதுகாக்கப்பட்டுள்ளன.
