review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the covert introduction of the false brothers, their covert entry, the freedom belonging to believers in Messiah Jesus, and the purpose of enslaving them. However, «உளவுபார்த்து» reads as a participial action (“having spied”) rather than the Greek purpose infinitive κατασκοπῆσαι (“in order to spy out”).
  naturalness: «மெசியா இயேசுவுக்குள்» is intelligible but less idiomatic in modern standard Tamil for Paul’s recurring ἐν Χριστῷ expression; «மெசியா இயேசுவில்» preserves the relational metaphor without the overly concrete spatial sound of «உள்ளே». The revised sentence also makes both Greek purpose clauses clear while retaining the source’s unfinished dash.
  terminology: «பொய்ச் சகோதரர்கள்» is a more direct and established equivalent for ψευδαδέλφους than «போலிச் சகோதரர்கள்», while preserving Paul’s familial term and polemical assessment. «அடிமைப்படுத்த» appropriately retains the force of καταδουλόω.
  issues:
  - severity: medium
    issue: The purpose nuance of κατασκοπῆσαι is obscured.
    rationale: The Greek infinitive expresses why they entered secretly. Tamil «உளவுபார்த்து» normally presents an accompanying or prior action; «உளவு பார்ப்பதற்காக» represents the purposive syntax more accurately.
  - severity: low
    issue: The rendering of ἐν Χριστῷ Ἰησοῦ is somewhat wooden in Tamil.
    rationale: «மெசியா இயேசுவில்» is the natural modern Tamil form for this Pauline union/participation expression and does not over-specify its theological sense.
  - severity: low
    issue: «போலிச் சகோதரர்கள்» is less precise than a direct rendering of ψευδαδέλφους.
    rationale: «பொய்ச் சகோதரர்கள்» naturally conveys people falsely claiming the status of fellow believers and maintains the source’s familial imagery.
  revised_text: ஆனால், இரகசியமாக உள்ளே கொண்டுவரப்பட்ட பொய்ச் சகோதரர்களின் காரணமாக—அவர்கள் மெசியா இயேசுவில் நமக்குள்ள விடுதலையை உளவு பார்ப்பதற்காக இரகசியமாக நுழைந்தார்கள்; நம்மை அடிமைப்படுத்துவதற்காக—
