revisions:
- from: ஆனால் இரகசியமாக உள்ளே கொண்டுவரப்பட்ட போலிச் சகோதரர்களின் காரணமாக—அவர்கள் மெசியா இயேசுவுக்குள் நமக்குள்ள விடுதலையை உளவுபார்த்து, நம்மை அடிமைப்படுத்துவதற்காக இரகசியமாக நுழைந்தார்கள்—
  to: ஆனால், இரகசியமாக உள்ளே கொண்டுவரப்பட்ட பொய்ச் சகோதரர்களின் காரணமாக—அவர்கள் மெசியா இயேசுவில் நமக்குள்ள விடுதலையை உளவு பார்ப்பதற்காக இரகசியமாக நுழைந்தார்கள்; நம்மை அடிமைப்படுத்துவதற்காக—
  rationale: 'The revision preserves the Greek’s fragmentary syntax and final dash, distinguishes the covertly introduced false brothers from their covert entry, and renders both infinitival clauses as purposes. No footnote is required: the wording does not introduce a textual variant or explanatory claim needing an anchor.'
  reviewer_model: gpt-5.6-terra
