  text: ὁ γὰρ ἐνεργήσας Πέτρῳ εἰς ἀποστολὴν τῆς περιτομῆς ἐνήργησεν καὶ ἐμοὶ εἰς τὰ ἔθνη,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/008.yaml
  text: For the one who worked through Peter for apostleship to the circumcised also worked through me for the Gentiles[b][a],
translation:
  language: ta
  text: ஏனெனில், விருத்தசேதனம் பெற்றவர்களுக்கான அப்போஸ்தலப் பணிக்காக பேதுருவின் மூலம் செயல்பட்டவர், பிற இனத்தவர்களுக்கான அப்போஸ்தலப் பணிக்காக என் மூலமும் செயல்பட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνεργήσας / ἐνήργησεν
  choice: செயல்பட்டவர் / செயல்பட்டார்
  rationale: ஒரே கிரேக்க வினைச்சொல்லின் மீளுரைப்பையும் பேதுரு–பவுல் இணை அமைப்பையும் காக்க, இரு இடங்களிலும் ‘செயல்படு’ பயன்படுத்தப்பட்டது; தெய்வீகச் செயலின் முறையை இதற்கு மேல் விளக்கவில்லை.
- source_word: Πέτρῳ / ἐμοὶ
  choice: பேதுருவின் மூலம் / என் மூலமும்
  rationale: இவ்விடத்தில் வேற்றுமை உருபு கருவிப் பொருளில் வருவதாகச் சூழல் காட்டுவதால், அவர்களுடைய அப்போஸ்தலப் பணியின் மூலம் நிகழ்ந்த செயலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: εἰς ἀποστολὴν
  choice: அப்போஸ்தலப் பணியில்
  rationale: ἀποστολή என்பதன் பணியையும் பொறுப்பையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது; செயல் அந்த அப்போஸ்தல ஊழியத்தை நோக்கியிருந்தது என்ற பொருளைச் சூழல் தாங்குகிறது.
- source_word: τῆς περιτομῆς
  choice: விருத்தசேதனம் பெற்றவர்களுக்கான
  rationale: சொல்லுக்குச் சொல் வடிவான ‘விருத்தசேதனத்தின்’ என்பதற்குப் பதிலாக, இங்கு குறிக்கப்படும் விருத்தசேதனம் பெற்ற யூத மக்களைத் தெளிவாகச் சொல்கிறது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τὰ ἔθνη
  choice: பிற இனத்தவர்கள்
  rationale: விருத்தசேதனம் பெற்றவர்களுடன் அமைந்த எதிரிணையில், யூதரல்லாத மக்களை இச்சொல் குறிக்கிறது. ‘பிற இனத்தவர்கள்’ என்பது பொதுவான நவீன தமிழில் அந்தச் சூழற்பொருளைத் தருகிறது.
theological_decisions:
- issue: செயல்பட்டவரை ‘தேவன்’ என்று வெளிப்படையாக அடையாளப்படுத்துவதா
  choice: செயல்பட்டவர்
  alternative: தேவன் செயல்பட்டதால்
  rationale: கிரேக்கத்தில் வெளிப்படையான ‘தேவன்’ என்ற பெயர்ச்சொல் இல்லை; பெயர்ச்சொல்லாக்கப்பட்ட வினையெச்சம், ‘செயல்பட்டவர்,’ மட்டுமே உள்ளது. சூழலில் உள்ள மறைமுகத் தெய்வீக எழுவாயை வாசகர் உணர இடமளித்து, மூலத்தின் வடிவத்தையும் அதன் மறைமுகத்தன்மையையும் காக்கிறது.
translation_notes:
  register: இயல்பான, கண்ணியமான நவீனத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அப்போஸ்தலப் பணி’ என்பது திருச்சபைச் சூழலில் புரியக்கூடிய சொல்லாக இருந்தாலும், தேவையற்ற சமயப்பிரிவு சார்ந்த விளக்கங்களைச் சேர்க்கவில்லை. மூலத்தின் இணை அமைப்பைக் காக்க ‘பேதுருவின் மூலம் … என் மூலமும்’ மற்றும் ‘செயல்பட்டவர் … செயல்பட்டார்’ என்ற ஒத்திசைவு பேணப்பட்டுள்ளது.
