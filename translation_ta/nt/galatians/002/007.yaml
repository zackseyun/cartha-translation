  source_fidelity: 'மூலத்தின் முக்கியப் பொருள் காக்கப்பட்டுள்ளது: பவுலுக்கும் பேதுருவுக்கும் ஒப்படைக்கப்பட்ட நற்செய்திப் பணிகளின் இணைநிலையும், விருத்தசேதன அடையாளங்களால் குறிக்கப்படும் இரு குழுக்களும் தெளிவாக உள்ளன. ஆயினும், ஒப்பீட்டின் மறைமுகமான இரண்டாம் கூறில் ‘பேதுருவுக்கும்’ எனத் தத்திவை வெளிப்படுத்துவது தமிழில் மூலத்தின் இணைநிலையை இன்னும் துல்லியமாக்கும்.'
