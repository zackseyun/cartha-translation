  text: ἀλλὰ τοὐναντίον ἰδόντες ὅτι πεπίστευμαι τὸ εὐαγγέλιον τῆς ἀκροβυστίας καθὼς Πέτρος τῆς περιτομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/007.yaml
  text: But on the contrary[a], when they saw that I had been entrusted with the gospel for the uncircumcised, just as Peter had been for the circumcised,
translation:
  language: ta
  text: மாறாக, விருத்தசேதனம் செய்யப்படாதவர்களுக்கான நற்செய்தி எனக்கு ஒப்படைக்கப்பட்டிருப்பதை அவர்கள் கண்டார்கள்; அதுபோலவே விருத்தசேதனம் செய்யப்பட்டவர்களுக்கான நற்செய்தி பேதுருவுக்கும் ஒப்படைக்கப்பட்டிருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லாட்சிப்படி, “விருத்தசேதனம் செய்யப்படாதவர்களின் நற்செய்தி … விருத்தசேதனம் செய்யப்பட்டவர்களின் நற்செய்தி”; அதாவது, அந்தந்த மக்களுக்காக ஒப்படைக்கப்பட்ட நற்செய்தி.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ τοὐναντίον
  choice: மாறாக
  rationale: இரு சொற்களும் சேர்ந்து முந்தைய கருத்துக்கு வலுவான எதிர்மறைத் திருப்பத்தைக் குறிக்கின்றன; இயல்பான நவீன தமிழில் ‘மாறாக’ அந்த வலிமையைச் சுருக்கமாகத் தருகிறது.
- source_word: ἰδόντες
  choice: அவர்கள் கண்டார்கள்
  rationale: இறந்தகாலப் பங்கேற்பு முக்கியக் கருத்தின் சூழ்நிலையைக் குறிப்பிடுகிறது. தமிழில் தனி வினைமுற்றாக அமைப்பது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: πεπίστευμαι
  choice: என்னிடம் ஒப்படைக்கப்பட்டிருப்பதை
  rationale: πιστεύω என்பதன் நிறைவுக்காலச் செயப்பாட்டு வடிவம் இங்கு ஒரு பொறுப்பு அல்லது பணி ஒப்படைக்கப்பட்ட நிலையைச் சுட்டுகிறது; ‘ஒப்படைக்கப்பட்டிருக்கிறது’ அதன் நீடிக்கும் விளைவைப் பாதுகாக்கிறது.
- source_word: τὸ εὐαγγέλιον
  choice: நற்செய்தி
  rationale: பவுலின் சூழலில் εὐαγγέλιον என்பதற்கான பொருளையும் இறையியல் நிறையையும் இயல்பான தமிழில் தருகிறது.
- source_word: τῆς ἀκροβυστίας
  choice: விருத்தசேதனம் செய்யப்படாதவர்களுக்கான
  rationale: கிரேக்கச் சொற்றொடரின் சொல்லாட்சியைப் பாதுகாத்தபடி, அந்த நற்செய்திப் பணி நோக்கப்பட்ட மக்களைக் குறிக்கும் உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: καθὼς
  choice: அதுபோலவே
  rationale: பவுலுக்கும் பேதுருவுக்கும் ஒப்படைக்கப்பட்ட பணிகளுக்கிடையிலான இணையான ஒப்பீட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: Πέτρος
  choice: பேதுரு
  rationale: தமிழ் வேதாகம மரபில் பரவலாக அறியப்பட்ட பெயர் வடிவம்.
- source_word: τῆς περιτομῆς
  choice: விருத்தசேதனம் செய்யப்பட்டவர்களுக்கான
  rationale: முந்தைய சொற்றொடருடன் இணையான அமைப்பைப் பேணி, கிரேக்கத்தில் உள்ள உடன்படிக்கை அடையாளத்தையே குறிப்பிடுகிறது.
- source_word: '[ellipsis after Πέτρος τῆς περιτομῆς]'
  choice: நற்செய்தி பேதுருவிடம் ஒப்படைக்கப்பட்டிருந்தது
  rationale: கிரேக்கத்தில் முன் கூறிய கருத்து இங்கு மறைமுகமாகத் தொடர்கிறது; முழுமையான, தெளிவான தமிழ் வாக்கியத்திற்காக அது வெளிப்படையாக வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: ἀκροβυστία / περιτομή என்பவற்றை இனப்பெயர்களாக மொழிபெயர்ப்பதா அல்லது கிரேக்கத்தில் உள்ள விருத்தசேதன அடையாளங்களையே பேணுவதா
  choice: ‘விருத்தசேதனம் செய்யப்படாதவர்கள்’ / ‘விருத்தசேதனம் செய்யப்பட்டவர்கள்’ என்று வழங்கப்பட்டது.
  alternative: ‘யூதரல்லாதவர்கள்’ / ‘யூதர்கள்’ அல்லது ‘விருத்தசேதனமின்மை’ / ‘விருத்தசேதனம்’
  rationale: மூலவசனம் இனக்குழுக்களை நேரடியாகப் பெயரிடாமல், உடன்படிக்கை சார்ந்த விருத்தசேதன நிலையால் குறிப்பிடுகிறது. அதையே பேணுவது பவுலின் சொல்லாட்சியையும் அதன் இறையியல் பதற்றத்தையும் தேவையற்ற விளக்கமின்றி காக்கிறது.
- issue: பவுலுக்கும் பேதுருவுக்கும் வேறுபட்ட நற்செய்திகள் கொடுக்கப்பட்டனவா அல்லது ஒரே நற்செய்தி வேறுபட்ட மக்களுக்காக ஒப்படைக்கப்பட்டதா
  choice: இருவரிடமும் ‘நற்செய்தி’ ஒப்படைக்கப்பட்டது என்றும், வேறுபாடு நோக்கப்பட்ட மக்களில்தான் உள்ளது என்றும் வாக்கிய அமைப்பு காட்டுகிறது.
  alternative: ‘விருத்தசேதனம் செய்யப்படாதோரின் நற்செய்தி’ மற்றும் ‘விருத்தசேதனம் செய்யப்பட்டோரின் நற்செய்தி’ என மிகச் சொல்லாட்சிப்பூர்வமாக வழங்குதல்
  rationale: இனவகைச் சார்பைக் குறிக்கும் மரபுத்தொடரைத் தமிழில் இயல்பாகப் புரியவைக்கிறது; இரண்டு தனித்த நற்செய்திகள் என்ற தேவையற்ற முடிவைத் திணிக்காமல் மூலத்தின் உறவைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘விருத்தசேதனம்’ என்பது தொழில்நுட்பமான வேதாகமச் சொல் என்றாலும், மூலத்தின் உடன்படிக்கை சார்ந்த சொல்லாட்சியைப் பாதுகாப்பதற்காக வைத்திருக்கப்படுகிறது.
