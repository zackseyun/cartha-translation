  text: καὶ γνόντες τὴν χάριν τὴν δοθεῖσάν μοι, Ἰάκωβος καὶ Κηφᾶς καὶ Ἰωάννης, οἱ δοκοῦντες στῦλοι εἶναι, δεξιὰς ἔδωκαν ἐμοὶ καὶ Βαρναβᾷ κοινωνίας, ἵνα ⸀ἡμεῖς εἰς τὰ ἔθνη, αὐτοὶ δὲ εἰς τὴν περιτομήν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/009.yaml
  text: and recognizing the grace that had been given to me[a], James and Cephas and John, who were regarded as pillars, gave to Barnabas and me the right hands of fellowship[c][b], so that we would go to the Gentiles and they to the circumcised.
translation:
  language: ta
  text: எனக்கு அருளப்பட்ட கிருபையை உணர்ந்து, தூண்களாகக் கருதப்பட்ட யாக்கோபும் கேபாவும் யோவானும், நாங்கள் பிற இனத்தவர்களிடமும்[b] அவர்கள் விருத்தசேதனம் பெற்றவர்களிடமும்[c] செல்லும்படி, பர்னபாவுக்கும் எனக்கும் ஐக்கியத்தின் அடையாளமாகத் தங்கள் வலக்கைகளைக் கொடுத்தார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “ஐக்கியத்தின் வலக்கைகளைக் கொடுத்தார்கள்”; இது உடன்பாட்டையும் பகிர்ந்த பணியுறவையும் வெளிப்படுத்தும் செய்கை.'
    reason: idiom_explanation
  - marker: b
    text: அல்லது “நாடுகளிடமும்”; இங்கு யூதரல்லாத மக்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: 'சொல்லுக்குச் சொல்: “விருத்தசேதனத்தாரிடமும்”; அதாவது யூதர்களிடமும்.'
    reason: metonym_explanation
lexical_decisions:
- source_word: γνόντες
  choice: உணர்ந்துகொண்டபோது
  rationale: அடுத்து நிகழும் செயலுக்கான அடிப்படையை இந்த இறந்தகால வினையெச்சம் தருகிறது; அறிதல் மட்டுமன்றி அங்கீகரித்தலையும் இச்சொல் இயல்பாக உணர்த்துகிறது.
- source_word: χάριν τὴν δοθεῖσάν μοι
  choice: எனக்கு அருளப்பட்ட கிருபை
  rationale: பவுலின் அழைப்பிலும் பணியிலும் செயல்படும் இறை அருளை குறுகலாக்காமல் ‘கிருபை’ என்ற பரந்த பொருளிலேயே வைத்திருக்கிறது.
- source_word: Κηφᾶς
  choice: கேபா
  rationale: மூல உரையிலுள்ள பெயரையே ஒலிபெயர்க்கிறது; அதற்குப் பதிலாக ‘பேதுரு’ என மாற்றவில்லை.
- source_word: οἱ δοκοῦντες στῦλοι εἶναι
  choice: தூண்களாகக் கருதப்பட்ட
  rationale: அவர்கள் பெற்றிருந்த பொதுவான மதிப்பையும் தலைமை நிலையையும் தெரிவிக்கிறது; பவுல் அவர்களை இகழ்ந்ததாகத் தேவையின்றி உணர்த்துவதில்லை.
- source_word: δεξιὰς ἔδωκαν ... κοινωνίας
  choice: ஐக்கியத்தின் அடையாளமாகத் தங்கள் வலக்கைகளைக் கொடுத்தார்கள்
  rationale: δεξιὰς என்பதன் பன்மையைப் பாதுகாத்து, உடன்பாட்டையும் பகிர்ந்த பணியுறவையும் குறிக்கும் மரபுத்தொடரின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἔθνη
  choice: பிற இனத்தவர்கள்
  rationale: இச்சூழலில் யூதரல்லாத மக்களைச் சுட்டுகிறது; ‘நாடுகள்’ என்ற அரசியல் சார்ந்த பொருளைத் தவிர்க்கிறது.
- source_word: περιτομήν
  choice: விருத்தசேதனம் பெற்றவர்கள்
  rationale: ‘விருத்தசேதனம்’ என்ற பெயர்ச்சொல் இங்கு யூத மக்களைக் குறிக்கும் ஆகுபெயராக வருவதைக் தெளிவாக்குகிறது.
theological_decisions:
- issue: κοινωνία என்பதை ‘ஐக்கியம்’ எனவா அல்லது ‘கூட்டுப்பணி’ எனவா மொழிபெயர்ப்பது
  choice: ஐக்கியத்தின் அடையாளமாக
  alternative: கூட்டுப்பணியின் அடையாளமாக
  rationale: சூழல் அப்போஸ்தலப் பணியின் அங்கீகாரத்தையும் பணி பகிர்வையும் வலியுறுத்தினாலும், κοινωνία என்பதிலுள்ள பகிர்ந்துறவு மற்றும் பங்கேற்பு என்ற பரந்த பொருளை ‘ஐக்கியம்’ காக்கிறது; ‘அடையாளமாக’ என்பது வலக்கை கொடுத்த செயலின் உடன்பாட்டு இயல்பைத் தெளிவாக்குகிறது.
- issue: περιτομήν என்பதன் ஆகுபெயர்ப் பயன்பாடு
  choice: விருத்தசேதனம் பெற்றவர்கள்
  alternative: யூதர்கள்
  rationale: மூலத்தின் ‘விருத்தசேதனம்’ என்ற சொல்லாட்சியையும், பிற இனத்தவர்களோடு அமைந்துள்ள இறையியல்-வரலாற்று எதிர்மறை இணைப்பையும் காக்கிறது; அடிக்குறிப்பு அதன் குறிப்பை விளக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘கிருபை’, ‘விருத்தசேதனம்’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் தேவையான இறையியல் தொடர்பைத் தக்கவைக்கப் பயன்படுத்தப்பட்டுள்ளன; அரிதாக இருக்கக்கூடிய ஆகுபெயர் மற்றும் மரபுத்தொடர்கள் அடிக்குறிப்புகளில் விளக்கப்பட்டுள்ளன.
