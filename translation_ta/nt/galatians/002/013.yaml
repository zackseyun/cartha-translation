id: GAL.2.13
reference: Galatians 2:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ συνυπεκρίθησαν αὐτῷ ⸀καὶ οἱ λοιποὶ Ἰουδαῖοι, ὥστε καὶ Βαρναβᾶς συναπήχθη αὐτῶν τῇ ὑποκρίσει.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/013.yaml
  text: And the rest of the Jews also joined him in hypocrisy[b][a], so that even Barnabas was carried away by their hypocrisy.
translation:
  language: ta
  text: மற்ற யூதர்களும் அவருடன் சேர்ந்து பாசாங்காக நடந்துகொண்டார்கள்; அதனால் பர்னபாவும்கூட அவர்களுடைய பாசாங்கினால் இழுத்துச் செல்லப்பட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνυπεκρίθησαν
  choice: அவருடன் சேர்ந்து வெளிவேடம் போட்டார்கள்
  rationale: σύν- முன்னொட்டு காட்டும் கூட்டுப்பங்கேற்பையும், ὑποκρίνομαι குறிக்கும் உண்மையான நிலைப்பாட்டுக்கு மாறாக நடந்துகொள்ளுதலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: αὐτῷ
  choice: அவருடன்
  rationale: இங்கு நான்காம் வேற்றுமை புறநிலையுடன் இணைந்து செயல்பட்ட தொடர்பைக் குறிக்கிறது; தமிழில் ‘அவருடன்’ என்பது அதைத் தெளிவாகக் காட்டுகிறது.
- source_word: οἱ λοιποὶ Ἰουδαῖοι
  choice: மற்ற யூதர்கள்
  rationale: λοιποί முன்பு குறிப்பிடப்பட்ட பேதுருவைத் தவிர அங்கிருந்த மற்றவர்களைக் குறிக்கிறது. ‘மற்ற யூதர்கள்’ இயல்பாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: συναπήχθη
  choice: இழுத்துச் செல்லப்பட்டார்
  rationale: கூட்டத்தினரின் செல்வாக்கினால் ஒருவரும் அதே நடத்தைக்குள் கொண்டுசெல்லப்பட்டார் என்ற செயல்பாட்டு வினையின் பாதிப்பாட்டு வலிமையைப் பாதுகாக்கிறது.
- source_word: ὑποκρίσει
  choice: வெளிவேடத்தால்
  rationale: சொல் குறிக்கும் இரட்டைநடிப்பு அல்லது பாசாங்கான நடத்தையை ‘வெளிவேடம்’ தெளிவாகவும் dignified modern Tamil-இலும் தருகிறது; காரண/கருவிப் பொருளையும் ‘-ஆல்’ காட்டுகிறது.
theological_decisions:
- issue: பர்னபாவின் பொறுப்பும் பிறரின் செல்வாக்கும் இடையிலான பதற்றம்
  choice: ‘இழுத்துச் செல்லப்பட்டார்’ என்ற பாதிப்பாட்டு வடிவத்தைப் பேணுதல்
  alternative: ‘அவர்களுடன் சேர்ந்துகொண்டார்’
  rationale: மூலத்தின் συναπάγω பாதிப்பாட்டு வடிவம் பர்னபா முற்றிலும் பொறுப்பற்றவர் என்று கூறாமலேயே, பிறரின் வெளிவேடம் அவர்மீது செலுத்திய செல்வாக்கை முன்னிறுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘வெளிவேடம்’ இருமுறை வருவது மூலத்தில் ὑποκρίνομαι/ὑπόκρισις என்ற ஒரே சொல்ல்குடும்பம் மீளப் பயன்படுத்தப்படுவதைத் தென்படுத்துகிறது.
