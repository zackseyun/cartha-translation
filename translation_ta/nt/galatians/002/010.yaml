translation:
  language: ta
  text: ஏழைகளை நினைவில் வைத்துக்கொள்ள வேண்டும் என்பதே ஒரே வேண்டுகோள். அந்தக் காரியத்தையே செய்ய நானும் மிகுந்த முனைப்புடன் இருந்தேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μόνον
  choice: மட்டுமே
  rationale: உடன்பாட்டுடன் இணைக்கப்பட்ட ஒரே வேண்டுகோள் இதுவே என்பதைத் தெளிவாகக் குறிக்கிறது.
- source_word: τῶν πτωχῶν
  choice: ஏழைகளை
  rationale: πτωχός இங்கு பொருளாதாரத் தேவையில் உள்ள ஏழை மக்களைக் குறிக்கிறது; எளிய, வழக்கமான தமிழ்ச் சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἵνα μνημονεύωμεν
  choice: நினைவில் வைத்துக்கொள்ள வேண்டும்
  rationale: ἵνα கூறும் வேண்டுகோளின் உள்ளடக்கத்தையும், μνημονεύω என்பதன் ‘நினைவுகூர்ந்து அக்கறை செலுத்துதல்’ என்ற நடைமுறைச் சாயலையும் மிகைப்படுத்தாமல் காக்கிறது.
- source_word: ὃ
  choice: அதையே
  rationale: முந்தைய வேண்டுகோள் முழுவதையும் சுட்டுகிறது; தமிழில் இயல்பான இணைப்பாகவும் அடுத்துள்ள வலியுறுத்தலைத் தாங்குவதாகவும் உள்ளது.
- source_word: ἐσπούδασα
  choice: ஆர்வமாயிருந்தேன்
  rationale: செய்ய வேண்டும் என்ற தீவிர விருப்பத்தையும் முனைப்பையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: αὐτὸ τοῦτο ποιῆσαι
  choice: அதையே செய்ய
  rationale: αὐτὸ τοῦτο தரும் ‘அந்தக் குறிப்பிட்ட காரியத்தையே’ என்ற வலியுறுத்தலைச் சுருக்கமாகக் காக்கிறது.
theological_decisions:
- issue: வேண்டுகோளை வைத்தவரைத் தமிழில் வெளிப்படையாகக் குறிப்பிடுதல்
  choice: அவர்களுடைய வேண்டுகோள்
  alternative: ‘ஏழைகளை நினைவில் வைத்துக்கொள்ள வேண்டும் என்பது மட்டுமே’ என்று உருபில்லாமல் விடுதல்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட தலைவர்களே இதை வேண்டினர் என்பது தொடர்ச்சியிலிருந்து தெளிவாகிறது. கிரேக்கத்தின் சுருக்கமான அமைப்பை இயல்பான தமிழாக்கமாக்க இந்தச் சொற்றொடர் சேர்க்கப்பட்டது; புதிய இறையியல் பொருள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. ‘நினைவில் வைத்துக்கொள்ளுதல்’ என்பது வெறும் மன நினைவாக மட்டுப்படாமல் நடைமுறை அக்கறையையும் சூழலில் உணர்த்துகிறது.
