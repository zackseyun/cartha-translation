revisions:
- from: ஏனெனில், யாக்கோபிடமிருந்து சிலர் வருவதற்கு முன்பு, அவர் பிற இனத்தாரோடு வழக்கமாகச் சேர்ந்து சாப்பிட்டு வந்தார். ஆனால் அவர்கள் வந்தபோது, விருத்தசேதனம் செய்தவர்களுக்கு அஞ்சி, அவர் பின்வாங்கி, தம்மைப் பிரித்துக்கொள்ளத் தொடங்கினார்.[a][b]
  to: ஏனெனில், யாக்கோபிடமிருந்து[a] சிலர் வருவதற்கு முன்பு, அவர் பிற இனத்தவர்களோடு வழக்கமாகச் சேர்ந்து சாப்பிட்டு வந்தார். ஆனால் அவர்கள் வந்தபோது, விருத்தசேதனத்தைச் சேர்ந்தவர்களுக்கு[b] அஞ்சி, அவர் பின்வாங்கிக்கொண்டும் தம்மைத் தனிமைப்படுத்திக்கொண்டும் இருந்தார்.
  rationale: The revision corrects the referent of τοὺς ἐκ περιτομῆς, preserves the Greek imperfects as continuing actions, and places each note marker at its relevant phrase. It retains the ambiguity of ἀπὸ Ἰακώβου and does not identify the circumcision-associated people as a formal faction in the main text.
