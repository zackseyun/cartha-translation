source:
  edition: SBLGNT
  text: πρὸ τοῦ γὰρ ἐλθεῖν τινας ἀπὸ Ἰακώβου μετὰ τῶν ἐθνῶν συνήσθιεν· ὅτε δὲ ⸀ἦλθον, ὑπέστελλεν καὶ ἀφώριζεν ἑαυτόν, φοβούμενος τοὺς ἐκ περιτομῆς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/012.yaml
  text: For before certain men came from James[a], he used to eat with the Gentiles; but when they came, he began to draw back and separate himself[c][b], fearing those of the circumcision.
translation:
  language: ta
  text: ஏனெனில், யாக்கோபிடமிருந்து[a] சிலர் வருவதற்கு முன்பு, அவர் பிற இனத்தவர்களோடு வழக்கமாகச் சேர்ந்து சாப்பிட்டு வந்தார். ஆனால் அவர்கள் வந்தபோது, விருத்தசேதனத்தைச் சேர்ந்தவர்களுக்கு[b] அஞ்சி, அவர் பின்வாங்கிக்கொண்டும் தம்மைத் தனிமைப்படுத்திக்கொண்டும் இருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யாக்கோபின் கூட்டத்தைச் சேர்ந்த சிலர்” என்றும் பொருள் கொள்ளலாம்; யாக்கோபு அவர்களை அதிகாரபூர்வமாக அனுப்பினார் என்று கிரேக்க வாசகம் தானாகவே குறிப்பிடவில்லை.
    reason: alternative_reading
  - marker: b
    text: “விருத்தசேதனக் குழுவினருக்கு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ τοῦ ἐλθεῖν
  choice: வருவதற்கு முன்பு
  rationale: πρό உடன் வரும் articular infinitive-இன் காலத்தொடர்பை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: τινας
  choice: சிலர்
  rationale: குறிப்பிடப்படாத சில நபர்களைக் குறிக்கும் ஆண்பால் பன்மையை இயல்பாகப் பிரதிபலிக்கிறது; ‘குறிப்பிட்ட சிலர்’ என்று தேவையின்றி வலுப்படுத்தவில்லை.
- source_word: ἀπὸ Ἰακώβου
  choice: யாக்கோபிடமிருந்து
  rationale: தோற்றம் அல்லது தொடர்பை நேரடியாகக் காட்டுகிறது; யாக்கோபு அவர்களை முறையாக அனுப்பினார் அல்லது அவர்களுடைய நிலைப்பாட்டை ஏற்றார் என்று தீர்மானித்துவிடவில்லை.
- source_word: μετὰ τῶν ἐθνῶν
  choice: பிற இனத்தாரோடு
  rationale: பவுலின் சூழலில் ἔθνη என்பது யூதரல்லாத பிற இன மக்களைக் குறிக்கிறது; மூலத்தில் இல்லாத ‘விசுவாசிகள்’ என்பதைச் சேர்க்கவில்லை.
- source_word: συνήσθιεν
  choice: வழக்கமாகச் சேர்ந்து சாப்பிட்டு வந்தார்
  rationale: இறந்தகாலத்தில் தொடர்ந்து அல்லது வழக்கமாக நடந்த செயலைக் காட்டும் imperfect வடிவத்தின் பொருளையும், ஒன்றாக உணவு உண்ட சமூக உறவையும் வெளிப்படுத்துகிறது.
- source_word: ὑπέστελλεν
  choice: பின்வாங்கி ... தொடங்கினார்
  rationale: விலகிப் பின்வாங்கும் இயக்கத்தையும், imperfect வடிவத்தின் தொடக்க/தொடர்ச்சிச் சாயலையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἀφώριζεν ἑαυτόν
  choice: தம்மைப் பிரித்துக்கொள்ளத் தொடங்கினார்
  rationale: reflexive பொருளையும் சமூக ரீதியான பிரிவையும் காக்கிறது.
- source_word: φοβούμενος
  choice: அஞ்சி
  rationale: செயலுக்கான காரணத்தைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: τοὺς ἐκ περιτομῆς
  choice: விருத்தசேதனம் செய்தவர்கள்
  rationale: அந்தக் குழுவை விருத்தசேதனத்தின் அடிப்படையில் அடையாளப்படுத்துகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘கட்சி’ என்ற சொல்லை முதன்மை உரையில் சேர்க்கவில்லை.
theological_decisions:
- issue: ἀπὸ Ἰακώβου என்பது யாக்கோபின் அதிகாரபூர்வ அனுப்புதலையோ ஒப்புதலையோ குறிக்கிறதா
  choice: யாக்கோபிடமிருந்து
  alternative: யாக்கோபின் கூட்டத்தைச் சேர்ந்தவர்கள் / யாக்கோபால் அனுப்பப்பட்டவர்கள்
  rationale: கிரேக்கச் சொற்றொடர் தோற்றம் அல்லது தொடர்பைக் காட்டினாலும், அதிகாரபூர்வமாக அனுப்பப்பட்டனர் என்று தனியாகக் கூறவில்லை. ஆகவே யாக்கோபின் பொறுப்பை உரை சொல்வதைவிட அதிகமாக நிர்ணயிக்காமல் தெளிவின்மையைப் பாதுகாக்கிறது.
- issue: τοὺς ἐκ περιτομῆς என்பதை ஒரு குறிப்பிட்ட ‘விருத்தசேதனக் கட்சி’ என்று அழைக்க வேண்டுமா
  choice: விருத்தசேதனம் செய்தவர்கள்
  alternative: விருத்தசேதனக் குழுவினர்
  rationale: மூலம் அவர்களை விருத்தசேதனத்துடன் தொடர்புடையவர்களாக அடையாளப்படுத்துகிறது; ஆனால் ஒரு முறையான கட்சி அல்லது பிரிவு என்று வெளிப்படையாகப் பெயரிடவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சேர்ந்து சாப்பிட்டு வந்தார்’ என்பது உணவுப் பந்தியின் சமூகத் தொடர்பை இயல்பாக உணர்த்துகிறது. மரியாதை ஒருமையைத் தொடர்ந்து ‘அவர்/தம்மை’ பயன்படுத்தியுள்ளது; ‘விருத்தசேதனம்’ என்பது வேதாகமப் பயன்பாட்டில் நிலைபெற்ற சொல்லாகத் தக்கவைக்கப்பட்டுள்ளது.
