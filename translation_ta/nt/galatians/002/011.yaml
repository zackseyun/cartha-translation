  source_fidelity: மூலத்தின் காலத் தொடர் மற்றும் δέ-யின் மென்மையான மாறுபாடு ‘ஆனால் … வந்தபோது’ என்பதில் நன்றாகத் தரப்பட்டுள்ளன. Κηφᾶς ‘கேபா’ எனப் பெயர்வடிவத்தோடு பாதுகாக்கப்பட்டுள்ளது. κατὰ πρόσωπον αὐτῷ மற்றும் ἀντέστην ஆகியவை ‘அவரை நேருக்கு நேராக எதிர்த்தேன்’ என்பதில் நேரடியான மோதலாகத் துல்லியமாக வருகின்றன. κατεγνωσμένος ἦν என்பதன் செயப்பாட்டு/விளைவுநிலை நுணுக்கத்தை ‘கண்டனத்துக்கு உள்ளாகியிருந்ததால்’ போதுமான அளவு காக்கிறது; கண்டித்தவர் யார் என்பதையும் சேர்க்கவில்லை.
