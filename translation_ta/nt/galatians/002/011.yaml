source:
  edition: SBLGNT
  text: Ὅτε δὲ ἦλθεν ⸀Κηφᾶς εἰς Ἀντιόχειαν, κατὰ πρόσωπον αὐτῷ ἀντέστην, ὅτι κατεγνωσμένος ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/011.yaml
  text: But when Cephas came to Antioch[a], I opposed him to his face[b], because he stood condemned.
translation:
  language: ta
  text: ஆனால் கேபா[a] அந்தியோகியாவுக்கு வந்தபோது, அவர் கண்டனத்துக்கு உள்ளாகியிருந்ததால்[b], நான் அவரை நேருக்கு நேராக எதிர்த்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கேபா என்பது பேதுருவின் அரமேயப் பெயர்.
    reason: cross_reference
  - marker: b
    text: அல்லது, “அவர் தெளிவாகத் தவறு செய்திருந்ததால்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ
  choice: ஆனால் … வந்தபோது
  rationale: δέ காட்டும் மிதமான முரண்பாட்டையும் ὅτε காட்டும் காலத் தொடர்பையும் இயல்பான நவீனத் தமிழில் பாதுகாக்கிறது.
- source_word: Κηφᾶς
  choice: கேபா
  rationale: மூல கிரேக்கத்தில் உள்ள பெயர்வடிவத்தை மாற்றி ‘பேதுரு’ என்று எழுதாமல், தமிழில் ஒலிபெயர்த்துப் பாதுகாக்கிறது.
- source_word: ἦλθεν εἰς Ἀντιόχειαν
  choice: அந்தியோகியாவுக்கு வந்தபோது
  rationale: ஒரு நகரத்தை நோக்கிய வருகையைத் தமிழில் இயல்பாகச் சொல்கிறது.
- source_word: κατὰ πρόσωπον αὐτῷ
  choice: அவரை நேருக்கு நேராக
  rationale: மறைமுகமாக அல்லாமல் நேரடியாக எதிர்கொண்டதைக் காட்டும் மூலமொழியின் உயிரோட்டமான மரபுத்தொடரைப் பாதுகாக்கிறது.
- source_word: ἀντέστην
  choice: எதிர்த்தேன்
  rationale: பவுல் வெளிப்படையாக எதிர்த்து நின்றதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ὅτι
  choice: …தால்
  rationale: பவுல் எதிர்த்ததற்கான காரணத்தைத் தமிழுக்குரிய காரண விகுதியால் இயல்பாக இணைக்கிறது.
- source_word: κατεγνωσμένος ἦν
  choice: கண்டனத்துக்கு உள்ளாகியிருந்ததால்
  rationale: செயப்பாட்டு வடிவத்தையும், ஏற்கெனவே ஏற்பட்ட தீர்ப்பின் தொடரும் நிலையையும் இயன்றவரை பாதுகாக்கிறது; யார் கண்டனம் செய்தார் என்பதை உரை கூறாததால் அதைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: Κηφᾶς என்பவரின் அடையாளமும் பெயரின் வடிவமும்
  choice: முதன்மை உரையில் ‘கேபா’ என்று வைத்தல்
  alternative: வாசகர்களுக்கு நன்கு அறிமுகமான ‘பேதுரு’ என்று மொழிபெயர்த்தல்
  rationale: மூல உரை Κηφᾶς என்ற பெயரையே பயன்படுத்துகிறது. ஆகவே அந்தப் பெயரை ஒலிபெயர்த்து, பேதுருவே இவர் என்ற அடையாளத்தை அடிக்குறிப்பில் தெரிவிப்பது மூலத்துக்கு வெளிப்படையாக உண்மையாயிருக்கிறது.
- issue: κατεγνωσμένος ἦν என்பதன் தீர்ப்பு சார்ந்த அல்லது தவறு சார்ந்த பொருள்
  choice: ‘கண்டனத்துக்கு உள்ளாகியிருந்ததால்’ என்று செயப்பாட்டு மற்றும் நிலை நுணுக்கத்தைப் பாதுகாத்தல்
  alternative: ‘அவர் தெளிவாகத் தவறு செய்திருந்ததால்’ என்று பொருளை வெளிப்படையாக்குதல்
  rationale: முதன்மை உரை கிரேக்கத்தின் செயப்பாட்டு, விளைவுநிலை அமைப்பைப் பாதுகாக்கிறது. அதேவேளை, இது ஒருவரால் முறையாகத் தீர்ப்பளிக்கப்பட்டதைக் கட்டாயமாகக் குறிக்காமல், அவரது தவறு வெளிப்பட்டிருந்ததையும் குறிக்கக்கூடும் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிதாகப் புரியும், அதேவேளை வேதாகம உரைக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நேருக்கு நேராக’ என்ற வழக்கமான சொற்றொடர் மூலத்தின் நேரடி மோதல் உணர்வைப் பாதுகாக்கிறது; ‘கண்டனத்துக்கு உள்ளாகியிருந்தார்’ என்பது சற்றே முறையான மொழிநடையாக இருந்தாலும் மூலத்தின் செயப்பாட்டு மற்றும் விளைவுநிலை நுணுக்கத்திற்கு ஏற்றது.
