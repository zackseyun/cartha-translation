  terminology: ‘கேபா’ என்ற ஒலிபெயர்ப்பு திட்டக் கொள்கைக்கும் கிரேக்கப் பெயர்வடிவத்திற்கும் ஏற்றது. ‘பேதுருவின் அரமேயப் பெயர்’ என்ற அடிக்குறிப்பு அடையாளத்தைத் தெளிவுபடுத்துகிறது. ‘கண்டனம்’ என்பது தீர்ப்புசார்ந்த சொல்வளத்தைத் திணிக்காமல் κατεγνωσμένος என்பதன் பரந்த பொருள்வெளியைத் தக்கவைக்கிறது.
