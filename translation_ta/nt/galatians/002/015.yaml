lexical_decisions:
- source_word: Ἡμεῖς
  choice: நாம்
  rationale: வெளிப்படையாக இடம்பெறும் முதலாம் நபர் பன்மைப் பெயர்ச்சொல்லைத் தக்கவைத்து, வாக்கியத்தின் மிதமான அழுத்தத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: φύσει
  choice: பிறப்பால்
  rationale: இங்கு உள்ளார்ந்த ஒழுக்க இயல்பை அல்ல, இயற்கையான இனப் பிறப்பைச் சுட்டுகிறது; நவீன தமிழில் ‘பிறப்பால்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: Ἰουδαῖοι
  choice: யூதர்களாகிய
  rationale: இன அடையாளத்தைக் குறிக்கும் பெயர்ச்சொல் சார்ந்த பயனைத் தக்கவைத்து, ‘நாம்’ என்பதோடு இயல்பாக இணைக்கிறது.
- source_word: ἐξ ἐθνῶν
  choice: பிற இனத்தாரிலிருந்து வந்த
  rationale: ἐκ என்ற முன்னிடைச்சொல்லின் ‘இலிருந்து/நடுவிலிருந்து’ என்ற அமைப்பைப் பாதுகாத்து, யூதரல்லாத மக்களை இச்சூழலில் தெளிவாகக் குறிக்கிறது.
- source_word: ἁμαρτωλοί
  choice: பாவிகள்
  rationale: பவுலின் சொல்லாட்சியில் வழக்கமான நேரடியான சொல்லைத் தக்கவைத்து, மூலத்தின் கூர்மையான இனவழி எதிர்மறை ஒப்பீட்டை மென்மையாக்காமல் வழங்குகிறது.
theological_decisions:
- issue: இந்த வசனம் பிற இனத்தாரைவிட யூதர்கள் இயல்பாகவே ஒழுக்கத்தில் உயர்ந்தவர்கள் என்று பவுல் உறுதிப்படுத்துவதுபோல் ஒலிக்க வேண்டுமா?
  choice: மூலத்தில் உள்ள சுருக்கமான இனவழி எதிர்மறை ஒப்பீடு விளக்கச் சேர்க்கையின்றி தக்கவைக்கப்படுகிறது.
  alternative: ‘பிற இனத்தாரைப் போலப் பாவிகளாகக் கருதப்படாத நாம்’ என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: கிரேக்கம் எதிர்மறை ஒப்பீட்டை நேரடியாகச் சொல்கிறது. தொடரும் சூழல் அதைப் பற்றிய பவுலின் வாதத்தை வெளிப்படுத்துகிறது; அந்த விளக்கத்தை இவ்வசனத்துக்குள் முன்கூட்டியே சேர்க்கக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிய புரிதலும் கொண்ட நடையில் வடிவமைக்கப்பட்டது. இவ்வாக்கியம் அடுத்த வசனத்துடன் தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. அடிக்குறிக் குறிகள் அனைத்தும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
