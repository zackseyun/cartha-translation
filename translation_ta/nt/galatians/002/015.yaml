    reason: lexical_alternative
  - marker: b
    text: “பிறப்பால்” என்பதற்கான கிரேக்கச் சொற்றொடரின் நேர்ப்பொருள் “இயல்பால்”; இங்கு அது இயற்கையான இனப் பிறப்பைக் குறிக்கிறது.
