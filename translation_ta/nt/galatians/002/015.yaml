  verdict: revise
  source_fidelity: ‘பிறப்பால்’ accurately conveys φύσει in its ethnic-origin sense, and ‘யூதர்களான நாம்’ preserves the explicit first-person plural and Jewish ethnic identity. However, ‘பிற இனத்தாரிலிருந்து வந்த பாவிகள்’ can suggest people who have physically come from other groups, rather than the source’s compressed designation of Gentile-associated sinners. ‘பிற இனத்தாரைச் சேர்ந்த பாவிகள்’ retains the group/origin contrast more idiomatically.
  naturalness: The revision uses natural modern standard Tamil. It avoids the somewhat cumbersome ‘இலிருந்து வந்த’ while retaining the direct, rhetorically sharp contrast of the Greek.
  terminology: ‘யூதர்கள்’ and ‘பாவிகள்’ are appropriate established terms. ‘பிற இனத்தார்’ is a suitable modern rendering in this context for ἐθνῶν without importing a theological explanation.
