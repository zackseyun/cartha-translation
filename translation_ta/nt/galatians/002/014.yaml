  naturalness: ‘நற்செய்தியின் உண்மைக்கு ஏற்ப நேராக நடக்கவில்லை’ என்பது சொற்றொடராகச் சற்றே செயற்கையாக உள்ளது. ‘நற்செய்தியின் உண்மையோடு ஒத்துப்போகும் விதத்தில் நேராக நடக்கவில்லை’ என்பது ὀρθοποδοῦσιν உருவகத்தையும் πρός-இன் ஒத்திசைவு உணர்வையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது. ‘யூத முறைப்படி’ மற்றும் ‘யூதர்களைப் போல’ என்ற இணை வழக்கு சிறிய ஒத்திசைவின்மையை உருவாக்குகிறது; இரண்டிலும் ‘யூதர்களைப் போல’ என இணையாகக் கொடுக்கலாம்.
  terminology: ‘கேபா’ என்ற ஒலிபெயர்ப்பு மூலத்தின் பெயர்வடிவத்தைச் சரியாகக் காக்கிறது. ‘பிற இனத்தார்’ ἔθνη-க்கு இச்சூழலில் பொருத்தமானது. ‘கட்டாயப்படுத்துகிறாய்’ ἀναγκάζεις-ன் வலிமையைப் பாதுகாக்கிறது. Ἰουδαΐζειν-ஐ ‘யூதர்களைப் போல வாழும்படி’ என வழங்குவது தெளிவானதும் பிற்காலத் தொழில்நுட்பப் பொருளைத் திணிக்காததுமாகும்.
