source:
  edition: SBLGNT
  text: ἀλλ’ ὅτε εἶδον ὅτι οὐκ ὀρθοποδοῦσιν πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου, εἶπον τῷ ⸀Κηφᾷ ἔμπροσθεν πάντων· Εἰ σὺ Ἰουδαῖος ὑπάρχων ἐθνικῶς ⸂καὶ ⸀οὐκ Ἰουδαϊκῶς ζῇς⸃, ⸀πῶς τὰ ἔθνη ἀναγκάζεις Ἰουδαΐζειν;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/014.yaml
  text: But when I saw that they were not walking in step with the truth of the gospel[a], I said to Cephas before them all, “If you, though a Jew, live like a Gentile and not like a Jew[b], how do you compel the Gentiles to live like Jews?”
translation:
  language: ta
  text: ஆனால், அவர்கள் நற்செய்தியின் உண்மையோடு ஒத்துப்போகும் விதத்தில் நேராக நடக்கவில்லை என்பதை நான் கண்டபோது[a], எல்லாருக்கும் முன்பாக கேபாவிடம், “நீ யூதனாக இருந்தும், யூதர்களைப் போல வாழாமல் பிற இனத்தாரைப் போல வாழ்கிறாயே; அப்படியிருக்க, பிற இனத்தாரை யூதர்களைப் போல வாழும்படி எப்படிக் கட்டாயப்படுத்துகிறாய்?[b]” என்று கேட்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லடிப்படையாக, ‘நற்செய்தியின் உண்மையை நோக்கி நேராக நடக்கவில்லை.’
    reason: lexical_alternative
  - marker: b
    text: ‘பிற இனத்தாரை யூதமுறையைப் பின்பற்றும்படி எப்படிக் கட்டாயப்படுத்துகிறாய்?’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀρθοποδοῦσιν
  choice: நேராக நடக்கவில்லை
  rationale: இந்த வினைச்சொல் சொல்லடிப்படையில் ‘நேராக நடத்தல்’ என்ற உருவகத்தையும், சூழலில் சரியான நடத்தையையும் குறிக்கிறது. ‘நேராக நடக்கவில்லை’ என்பது உருவகத்தைத் தக்கவைத்து நவீன தமிழிலும் தெளிவாக உள்ளது.
- source_word: πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου
  choice: நற்செய்தியின் உண்மைக்கு ஏற்ப
  rationale: ὀρθοποδοῦσιν என்பதோடு சேர்ந்த πρός, வெறும் திசையை அல்லாமல் ஒத்திசைவு அல்லது அளவுகோலுக்கு ஏற்ற நடத்தையைக் குறிக்கிறது. ‘உண்மைக்கு ஏற்ப’ என்பது இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Κηφᾷ
  choice: கேபாவிடம்
  rationale: பவுல் இங்கு பயன்படுத்தும் கேபா என்ற பெயரையே பேதுரு என்று மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
- source_word: ἐθνικῶς
  choice: பிற இனத்தாரைப் போல
  rationale: இந்த வினையடை வாழும் முறையைக் குறிக்கிறது. சூழலிலுள்ள யூதர்—பிற இனத்தார் என்ற வேறுபாட்டை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: Ἰουδαϊκῶς
  choice: யூத முறைப்படி
  rationale: ἐθνικῶς என்பதற்கு எதிரிணையாக, யூதருக்குரிய வாழ்க்கை முறையைக் குறிக்கிறது. ‘யூத முறைப்படி’ என்பது சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἀναγκάζεις
  choice: கட்டாயப்படுத்துகிறாய்
  rationale: வினைச்சொல்லிலுள்ள வற்புறுத்தல் அல்லது நிர்ப்பந்தத்தின் வலிமையை நேரடியாகப் பாதுகாக்கிறது.
- source_word: Ἰουδαΐζειν
  choice: யூதர்களைப் போல வாழும்படி
  rationale: தனித்த யூத வாழ்க்கை முறைகளை ஏற்றுக்கொள்வதை இச்சொல் குறிக்கிறது. பிற்கால சர்ச்சைக்குரிய தொழில்நுட்பச் சொல்லைத் தவிர்த்து, உடனடிச் சூழலின் சமூக-சமயப் பொருளைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: Ἰουδαΐζειν என்பதைப் பிற்காலக் கோட்பாட்டுச் சர்ச்சைகளைப் புகுத்தாமல் மொழிபெயர்த்தல்
  choice: யூதர்களைப் போல வாழும்படி
  alternative: யூதமுறையைப் பின்பற்றும்படி; யூதராக்கும்படி
  rationale: உடனடிச் சூழல் ஒன்றாக உணவருந்துதல் மற்றும் இன-சமய எல்லைகளைக் குறிக்கும் பழக்கங்களைப் பற்றியது. தேர்ந்தெடுத்த வாசகம் அந்தச் சூழலைத் தக்கவைத்து, பிற்கால இறையியல் விவாதத்தை வசனத்துக்குள் முன்கூட்டியே புகுத்துவதில்லை.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘நடத்தல்’ உருவகமும் கேள்வியின் நேரடியான கண்டனத் தொனியும் பாதுகாக்கப்பட்டுள்ளன; கேபா என்ற மூலப் பெயரும் அப்படியே ஒலிபெயர்க்கப்பட்டுள்ளது.
