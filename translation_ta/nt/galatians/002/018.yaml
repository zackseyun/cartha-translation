source:
  edition: SBLGNT
  text: εἰ γὰρ ἃ κατέλυσα ταῦτα πάλιν οἰκοδομῶ, παραβάτην ἐμαυτὸν ⸀συνιστάνω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/018.yaml
  text: For if I rebuild the things I tore down[b][a], I prove myself to be a transgressor.
translation:
  language: ta
  text: ஏனெனில், நான் இடித்துப்போட்டவற்றையே[a] மீண்டும் கட்டியெழுப்பினால், என்னை நானே மீறுபவனாக நிரூபிக்கிறேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் அழித்தவற்றையே” அல்லது “நான் பிரித்து அகற்றியவற்றையே.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என்னை நானே மீறுபவனாகக் காட்டுகிறேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: ஏனெனில், ... என்றால்
  rationale: γάρ முந்தைய வாதத்தோடு இவ்வாக்கியத்தை விளக்க முறையில் இணைக்கிறது; εἰ நிபந்தனையைக் குறிக்கிறது. இந்தத் தமிழ் அமைப்பு இரண்டையும் இயல்பாகக் காக்கிறது.
- source_word: ἃ ... ταῦτα
  choice: இடித்துப்போட்டவற்றையே
  rationale: தொடர்புப்பெயர்–சுட்டுப்பெயர் அமைப்பின் வலியுறுத்தலை ‘-வற்றையே’ இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: κατέλυσα
  choice: இடித்துப்போட்ட
  rationale: οἰκοδομῶ என்பதுடன் இணைந்த கட்டட உருவகத்தை இது தெளிவாகக் காக்கிறது; ‘ஒழித்த’ என்பது சூழலை அதிகமாக விளக்கிவிடக்கூடும்.
- source_word: πάλιν οἰκοδομῶ
  choice: மீண்டும் கட்டியெழுப்பினால்
  rationale: πάλιν என்பதின் மறுபடியும் நிகழும் பொருளையும் οἰκοδομέω என்பதின் கட்டட உருவகத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: παραβάτην
  choice: மீறி நடப்பவனாக
  rationale: எதை மீறுவது என்பதை மூலவாக்கியம் வெளிப்படையாகச் சொல்லாததால் ‘சட்டத்தை மீறுகிறவன்’ என்று குறுக்காமல், சொல்லின் ஒழுக்க–சட்ட நுணுக்கத்தையும் உண்மையான தெளிவின்மையையும் காக்கிறது.
- source_word: ἐμαυτὸν συνιστάνω
  choice: என்னை நானே ... நிரூபிக்கிறேன்
  rationale: தன்னையே அத்தகையவனாக நிறுவிக் காட்டும் பிரதிபெயர்ச் சொல்லின் வலிமையை வெளிப்படுத்துகிறது; ‘காட்டுகிறேன்’ என்பதும் சாத்தியமான பொருள்.
theological_decisions:
- issue: இடித்துப்போட்டதும் மீண்டும் கட்டப்படுவதும் எதைச் சுட்டுகின்றன?
  choice: பொருளை வெளிப்படையாக அடையாளப்படுத்தாமல் கட்டட உருவகத்தை அப்படியே வைத்தல்
  alternative: ‘சட்டத்தை’ அல்லது குறிப்பிட்ட நடைமுறைகளை நேரடியாகச் சேர்த்தல்
  rationale: இந்த வசனத்தில் அவை பெயரிட்டு சொல்லப்படவில்லை; சூழலிலிருந்து வாசகர் தொடர்பை உணர அனுமதிப்பது மூலத்தின் இறையியல் அழுத்தத்தையும் தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘இடித்துப்போட்ட—கட்டியெழுப்புதல்’ என்ற இணைச்சொற்கள் மூலத்தின் கட்டட உருவகத்தைத் தெளிவாக வைத்திருக்கின்றன; தேவையற்ற சட்டவியல் விளக்கம் முதன்மை உரையில் சேர்க்கப்படவில்லை.
