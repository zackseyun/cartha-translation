source:
  edition: SBLGNT
  text: ἀνέβην δὲ κατὰ ἀποκάλυψιν· καὶ ἀνεθέμην αὐτοῖς τὸ εὐαγγέλιον ὃ κηρύσσω ἐν τοῖς ἔθνεσιν, κατ’ ἰδίαν δὲ τοῖς δοκοῦσιν, μή πως εἰς κενὸν τρέχω ἢ ἔδραμον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/002.yaml
  text: But I went up in response to a revelation[a], and I laid before them the gospel that I proclaim among the Gentiles—but privately before those of repute—lest somehow I should be running, or had run[c][b], in vain.
translation:
  language: ta
  text: ஆனால், ஒரு வெளிப்பாட்டின்படி[a] நான் சென்றேன்; பிற இனத்தாரிடையே நான் அறிவிக்கும் நற்செய்தியை அவர்களிடம் எடுத்துரைத்தேன்; மேலும், மதிப்புக்குரியவர்களாகக் கருதப்பட்டவர்களிடம்[b] அதைத் தனிப்பட்ட முறையில் எடுத்துரைத்தேன். ஒருவேளை நான் வீணாக ஓடிக்கொண்டிருக்கிறேனோ அல்லது ஓடியிருக்கிறேனோ என்ற அச்சத்தால்[c] அப்படிச் செய்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரு வெளிப்பாட்டின் காரணமாக.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘செல்வாக்குள்ளவர்களாகத் தோன்றியவர்களிடம்.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘ஒருவேளை நான் வீணாக ஓடிக்கொண்டிருக்கிறேனோ அல்லது ஓடியிருக்கிறேனோ என்ற அச்சத்தால்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβην
  choice: நான் அங்குச் சென்றேன்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘மேலே சென்றேன்’ என்பதாக இருந்தாலும், தமிழில் இலக்கு குறிப்பிடப்படாமல் அப்படிச் சொல்வது இயல்பற்றது. முந்தைய வசனச் சூழலில் இலக்கு தெளிவாக இருப்பதால், இவ்வசனத்தில் ‘எருசலேமுக்கு’ என்று வெளிப்படையாகச் சேர்க்காமல் இயல்பான ‘அங்குச் சென்றேன்’ பயன்படுத்தப்படுகிறது.
- source_word: κατὰ ἀποκάλυψιν
  choice: ஒரு வெளிப்பாட்டின்படி
  rationale: பவுலின் பயணம் வெளிப்பாட்டை அடிப்படையாகக் கொண்டது அல்லது அதனால் தூண்டப்பட்டது என்ற உறவைப் பாதுகாக்கிறது; காரணப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀνεθέμην
  choice: எடுத்துரைத்தேன்
  rationale: மற்றவர்கள் பரிசீலிக்கும்படி நற்செய்தியை அவர்கள்முன் வைத்ததை இயல்பான தமிழில் தெரிவிக்கிறது; முறையான கீழ்ப்படிதல் அல்லது அங்கீகாரம் கோருதல் என்ற கருத்தைத் தேவையின்றிச் சேர்ப்பதில்லை.
- source_word: τὸ εὐαγγέλιον
  choice: நற்செய்தி
  rationale: εὐαγγέλιον என்பதன் பொருளைத் தெளிவாகவும் தமிழ்க் கிறிஸ்தவப் பயன்பாட்டுக்கு ஏற்றவாறும் தருகிறது.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: பிற இனத்தாரிடையே
  rationale: இச்சூழலில் யூதரல்லாத மக்களைச் சுட்டுகிறது; அரசியல் நாடுகள் என்ற தவறான புரிதலைத் தவிர்க்கிறது.
- source_word: κατ’ ἰδίαν
  choice: தனிப்பட்ட முறையில்
  rationale: பெரிய கூட்டத்திலிருந்து வேறுபட்ட தனிப்பட்ட சந்திப்பை இயல்பாகக் குறிக்கிறது.
- source_word: τοῖς δοκοῦσιν
  choice: மதிப்புக்குரியவர்களாகக் கருதப்பட்டவர்களிடம்
  rationale: அவர்கள் முக்கியமானவர்களாக மதிக்கப்பட்டதைத் தெரிவிக்கிறது; பவுல் அந்த மதிப்பீட்டை முழுமையாக ஏற்றுக்கொண்டாரா அல்லது ஓரளவு விலகி நின்றாரா என்ற கிரேக்கத்தின் நுட்பமான தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: μή πως εἰς κενὸν τρέχω ἢ ἔδραμον
  choice: ஒருவேளை நான் வீணாக ஓடிக்கொண்டிருக்கவோ, இதுவரை ஓடியிருக்கவோ கூடாது
  rationale: ‘ஓடுதல்’ என்ற உருவகத்தையும், தற்போதைய பணிக்கும் ஏற்கெனவே செய்த பணிக்கும் இடையிலான கால வேறுபாட்டையும் பாதுகாக்கிறது.
theological_decisions:
- issue: பவுல் நற்செய்தியைத் தனிப்பட்ட முறையில் எடுத்துரைத்தது அப்போஸ்தலர்களின் திருத்தத்திற்கோ அங்கீகாரத்திற்கோ உட்பட்டதைக் குறிக்கிறதா?
  choice: ‘எடுத்துரைத்தேன்’ என்ற நடுநிலையான சொல் பயன்படுத்தப்பட்டது.
  alternative: ‘அங்கீகாரத்திற்காகச் சமர்ப்பித்தேன்’ அல்லது ‘வெறுமனே தெரிவித்தேன்’.
  rationale: கிரேக்க வினைச்சொல் பரிசீலனைக்காக ஒரு விஷயத்தை முன்வைக்கும் கருத்தைத் தருகிறது; ஆனால் முறையான கீழ்ப்படிதலையோ, எந்த மதிப்பீடும் இல்லாத தகவல் பரிமாற்றத்தையோ கட்டாயப்படுத்தவில்லை. ஆகவே மூலத்தின் இறையியல் பதற்றம் தீர்க்கப்படாமல் விடப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியம் தமிழில் மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், அதன் கருத்து தொடர்புகளும் ‘ஓடுதல்’ உருவகமும் பாதுகாக்கப்பட்டுள்ளன. ‘பிற இனத்தார்’ என்பது இச்சூழலில் யூதரல்லாத மக்களைக் குறிக்கிறது.
