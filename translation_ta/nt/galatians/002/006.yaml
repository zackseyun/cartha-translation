  text: ἀπὸ δὲ τῶν δοκούντων εἶναί τι— ὁποῖοί ποτε ἦσαν οὐδέν μοι διαφέρει· πρόσωπον ⸀θεὸς ἀνθρώπου οὐ λαμβάνει— ἐμοὶ γὰρ οἱ δοκοῦντες οὐδὲν προσανέθεντο,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/006.yaml
  text: But from those who were reputed to be something—whatever they once were makes no difference to me[a]; God shows no partiality—to me, indeed[c][b], those of reputation added nothing.
translation:
  language: ta
  text: ஆனால், முக்கியமானவர்கள் என்று கருதப்பட்டவர்களைப் பொறுத்தவரை[a]—முன்பு அவர்கள் எப்படிப்பட்டவர்களாக இருந்தார்கள் என்பது எனக்கு ஒரு பொருட்டல்ல; கடவுள் மனிதர்களிடம் பாரபட்சம் காட்டுவதில்லை[b]—முக்கியமானவர்கள் என்று கருதப்பட்ட அவர்கள் எனக்கு எதையும் கூடுதலாகச் சேர்க்கவில்லை[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஏதோ முக்கியத்துவம் உள்ளவர்களாகத் தோன்றியவர்கள்.’
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘கடவுள் மனிதனுடைய முகத்தை ஏற்றுக்கொள்வதில்லை’; இது கடவுள் ஒருவரின் அந்தஸ்தையோ வெளிப்புற நிலையையோ பார்த்துப் பாரபட்சம் காட்டுவதில்லை என்னும் மரபுத்தொடர்.
    reason: cultural_note
