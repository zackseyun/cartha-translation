    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν δοκούντων εἶναί τι / οἱ δοκοῦντες
  choice: முக்கியமானவர்கள் என்று கருதப்பட்டவர்கள் / மதிப்புக்குரியவர்கள்
  rationale: δοκέω இங்கு வெறும் தோற்றத்தை அல்ல, பிறர் அளித்த மதிப்பையும் செல்வாக்கையும் குறிக்கிறது. இந்தச் சொற்கள் பவுலின் சற்றே விலகி நிற்கும் தொனியைப் பாதுகாக்கின்றன; அதேவேளையில் அந்தத் தலைவர்களை இழிவுபடுத்துவதில்லை.
- source_word: ὁποῖοί ποτε ἦσαν
  choice: முன்பு அவர்கள் எப்படிப்பட்டவர்களாக இருந்தார்கள்
  rationale: அவர்களுடைய முந்தைய நிலை அல்லது அடையாளம் தன் மதிப்பீட்டுக்கு பொருத்தமற்றது என்பதே பவுலின் கருத்து. ποτε என்பதன் காலநுணுக்கத்தை ‘முன்பு’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὐδέν μοι διαφέρει
  choice: எனக்கு ஒரு பொருட்டல்ல
  rationale: அவர்களுடைய முந்தைய நிலை பவுலின் நிலைப்பாட்டில் எந்த மாற்றத்தையும் ஏற்படுத்தவில்லை என்ற கிரேக்க மரபுத்தொடரின் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: πρόσωπον θεὸς ἀνθρώπου οὐ λαμβάνει
  choice: கடவுள் மனிதர்களிடம் பாரபட்சம் காட்டுவதில்லை
  rationale: சொல்லுக்குச் சொல் ‘மனிதனுடைய முகத்தை ஏற்றுக்கொள்வதில்லை’ என்றாலும், இது ஒருவரின் வெளிப்புற நிலை அல்லது அந்தஸ்தின் அடிப்படையில் பட்சம் காட்டுவதை மறுக்கும் மரபுத்தொடர்.
- source_word: οὐδὲν προσανέθεντο
  choice: எதையும் கூடுதலாகச் சேர்க்கவில்லை
  rationale: προσανατίθημι என்பதிலுள்ள ‘மேலும் சேர்த்தல்’ என்ற அடிப்படை எண்ணத்தைப் பாதுகாக்கிறது; அவர்கள் பவுலின் செய்திக்கு எதையும் பங்களித்தார்களா அல்லது அவர்மீது எதையும் மேலதிகமாக விதித்தார்களா என்ற சூழல் சார்ந்த நுணுக்கத்தை அடிக்குறிப்பு திறந்தவாறு வைக்கிறது.
theological_decisions:
- issue: எருசலேம் தலைவர்களைப் பற்றிய பவுலின் சொற்கள் இகழ்ச்சியா, அல்லது அவர்களுடைய அந்தஸ்திலிருந்து தன் நற்செய்தியின் சுதந்திரத்தை வலியுறுத்துவதா?
  choice: அவர்களுக்கு இருந்த பொதுமதிப்பை ஏற்றுக்கொண்டபடியே, அந்த அந்தஸ்து தன் நற்செய்தியின் உண்மையை நிர்ணயிக்கவில்லை என்ற பவுலின் விலகிய தொனி பாதுகாக்கப்பட்டது.
  alternative: ‘முக்கியமானவர்களாகத் தோன்றியவர்கள்’ என்று மொழிபெயர்த்தால் கூர்மையான சந்தேகத் தொனி தோன்றலாம்; ‘அங்கீகரிக்கப்பட்ட தலைவர்கள்’ என்றால் பவுலின் சொல்லாட்சியிலுள்ள இடைவெளி மங்கலாம்.
  rationale: இந்த வசனத்தின் வாதம் அவர்களுடைய தலைமை சட்டவிரோதமானது என்பதல்ல; அவர்களுடைய புகழோ முந்தைய நிலையோ பவுலின் செய்திக்கு அதிகாரம் வழங்கவில்லை என்பதே.
- issue: οὐδὲν προσανέθεντο என்பது பவுலின் செய்திக்கு எதையும் சேர்க்கவில்லை என்பதா, அவர்மீது மேலதிக நிபந்தனைகளை விதிக்கவில்லை என்பதா?
  choice: முதன்மை உரையில் ‘எதையும் கூடுதலாகச் சேர்க்கவில்லை’ என்று பரந்த பொருள் வைக்கப்பட்டது.
  alternative: ‘என்மீது மேலதிகமாக எதையும் விதிக்கவில்லை’ என்று குறிப்பாகக் கட்டுப்பாடுகள் அல்லது நிபந்தனைகள் பற்றிய பொருளில் மொழிபெயர்க்கலாம்.
  rationale: கிரேக்க வினைச்சொல் இரு நுணுக்கங்களுக்கும் இடமளிக்கிறது; ஆகவே முதன்மை உரை ஒன்றை மட்டும் இறுதியானதாகத் தீர்மானிக்காமல், மாற்றுப் பொருளை அடிக்குறிப்பில் காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் இடைச்செருகல் அமைப்பை நீண்ட கோடுகள் பாதுகாக்கின்றன; ஆனால் தமிழில் இயல்பாக வாசிக்க ‘அவர்களைப் பொறுத்தவரை’ என்ற தொடர் பயன்படுத்தப்பட்டுள்ளது.
