source:
  edition: SBLGNT
  text: ἐγὼ γὰρ διὰ νόμου νόμῳ ἀπέθανον ἵνα θεῷ ζήσω· Χριστῷ συνεσταύρωμαι·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/019.yaml
  text: For through the law I died to the law, so that I might live to God. I have been crucified with Messiah.
translation:
  language: ta
  text: ஏனெனில், நான் கடவுளுக்கென்று வாழும்படி சட்டத்தின் வழியாகச் சட்டத்துக்கு இறந்தேன். மெசியாவுடன் நான் சிலுவையில் அறையப்பட்டிருக்கிறேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத்தை அறிமுகப்படுத்தும் வாதத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: διὰ νόμου
  choice: சட்டத்தின் வழியாக
  rationale: διά + genitive என்பதன் கருவி அல்லது வழிமுறை சார்ந்த பொருளைப் பாதுகாக்கிறது; சூழலில் νόμος மோசேயின் சட்டத்தைக் குறித்தாலும், மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்காமல் ‘சட்டம்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: νόμῳ
  choice: சட்டத்துக்கு
  rationale: ‘சட்டத்துக்கு இறந்தேன்’ என்ற சுருக்கமான பவுலின் சொல்லாட்சியையும், சட்டத்துடனான உறவு முறிந்ததைக் குறிக்கும் dative அமைப்பையும் விளக்கி விரிவுபடுத்தாமல் தக்கவைக்கிறது.
- source_word: ἀπέθανον
  choice: இறந்தேன்
  rationale: Aorist வடிவம் குறிக்கும் தீர்மானமான நிகழ்வை எளிய இறந்தகாலத்தில் தருகிறது.
- source_word: ἵνα
  choice: வாழும்படியாகவே
  rationale: நோக்கத்தைத் தெளிவாகக் காட்டுகிறது; ‘வே’ அந்த நோக்கத் தொடர்பை இயல்பான தமிழில் வலியுறுத்துகிறது.
- source_word: θεῷ ζήσω
  choice: கடவுளுக்கென்று வாழ
  rationale: வெறும் பயனுக்காக வாழ்வது என்ற பொருளாகக் குறுக்காமல், கடவுளை நோக்கிய உறவும் அர்ப்பணிப்பும் கொண்ட dative பொருளை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: Χριστῷ
  choice: மெசியாவுடன்
  rationale: Χριστός என்பதன் பட்டப்பெயர் சார்ந்த பொருளை ‘மெசியா’ எனப் பாதுகாக்கிறது; dative இங்கு συνεσταύρωμαι உடன் இணைந்து ‘உடன்’ என்ற பொருளைத் தருகிறது.
- source_word: συνεσταύρωμαι
  choice: சிலுவையில் அறையப்பட்டிருக்கிறேன்
  rationale: Perfect passive வடிவம் குறிக்கும் கடந்த நிகழ்வையும் அதன் தொடரும் விளைவையும் தமிழின் ‘அறையப்பட்டிருக்கிறேன்’ என்ற வடிவம் வெளிப்படுத்துகிறது; ‘மெசியாவுடன்’ என்பது συν- முன்னொட்டின் கூட்டுறவுப் பொருளைத் தருகிறது.
theological_decisions:
- issue: சட்டத்தின் வழியாகச் சட்டத்துக்கு இறந்தேன் என்ற கூற்றை விளக்கி விரிவுபடுத்த வேண்டுமா?
  choice: மூலத்தின் சுருக்கமான, பதற்றமுள்ள சொல்லாட்சியைத் தக்கவைத்தல்
  alternative: சட்டத்தின் கண்டனத்தால் சட்டத்தின் அதிகாரத்திலிருந்து விடுபட்டேன் / சட்டத்தைக் கடைப்பிடிப்பதற்கு இறந்தேன்
  rationale: கிரேக்க வாசகம் திட்டமிட்டே சுருக்கமாகவும் இறையியல் செறிவுடனும் உள்ளது. ‘கண்டனம்’, ‘அதிகாரம்’, அல்லது ‘கடைப்பிடித்தல்’ போன்ற விளக்கங்களைச் சேர்ப்பது குறிப்பிட்ட ஒரு பொருளுரையை முதன்மை உரைக்குள் கொண்டுவரும்.
- issue: Χριστός என்பதை பெயராகவா பட்டப்பெயராகவா வழங்குவது?
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு மெசியாவுடன் ஒன்றிணைந்த சிலுவை மரணம் வலியுறுத்தப்படுவதால், அபிஷேகம் செய்யப்பட்டவர் என்ற பட்டப்பெயர் சார்ந்த பொருளை ‘மெசியா’ வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘சட்டத்தின் வழியாகச் சட்டத்துக்கு இறந்தேன்’ என்பது தமிழில் சற்றுச் செறிவாக இருந்தாலும், மூலத்தின் திட்டமிட்ட மறுமொழியையும் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது. இரண்டாம் கூறில் ‘இவ்வாறு இறந்தேன்’ என்பது நோக்கத் தொடர்பைத் தமிழில் தெளிவாக்குகிறது; சட்டத்தின் செயல்பாட்டைப் பற்றிய கூடுதல் விளக்கத்தைச் சேர்ப்பதில்லை.
