source:
  edition: SBLGNT
  text: οὐκ ἀθετῶ τὴν χάριν τοῦ θεοῦ· εἰ γὰρ διὰ νόμου δικαιοσύνη, ἄρα Χριστὸς δωρεὰν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/021.yaml
  text: I do not nullify the grace of God[a], for if righteousness comes through the law[c][b], then Messiah died for nothing.
translation:
  language: ta
  text: தேவனுடைய அருளை நான் ஒதுக்கித் தள்ளுவதில்லை. ஏனெனில், சட்டத்தின் மூலம் நீதி[a] கிடைக்குமானால், மேசியா[b] வீணாகவே[c] இறந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நீதி’ என்பதை இங்கு ‘நீதியான நிலை’ என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘கிறிஸ்து’; கிரேக்கத்தில் ‘கிறிஸ்தோஸ்,’ அதாவது ‘அபிஷேகம் செய்யப்பட்டவர்.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘பயனின்றி.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετῶ
  choice: செல்லாததாக்குவதில்லை
  rationale: ‘ஒதுக்கிவிடுதல்’ என்ற பொருளையும், ஒன்றின் செயல்திறன் அல்லது செல்லுபடியை நீக்குதல் என்ற வாதத்தின் வலிமையையும் இயன்றவரை தக்கவைக்கிறது.
- source_word: χάριν
  choice: அருள்
  rationale: தேவனுடைய இலவசமான நன்மை மற்றும் தயவைச் சுட்டும் பவுலின் வழக்கமான இறையியல் சொல்லுக்கு இயல்பான தமிழ் இணை.
- source_word: διὰ νόμου
  choice: சட்டத்தின் வழியாக
  rationale: διά + உரிமைவேற்றுமை தரும் வழிமுறைப் பொருளைத் தெளிவாகக் காட்டுகிறது; கிரேக்கத்தில் இல்லாத வினைச்சொல் தமிழில் ‘கிடைக்குமானால்’ என்று இயல்பாக நிறைவு செய்யப்பட்டுள்ளது.
- source_word: δικαιοσύνη
  choice: நீதி
  rationale: ‘நீதியான நிலை’ மற்றும் ‘நியாயம்’ ஆகிய பொருள் பரப்பை அளவுக்கு மீறி விளக்காமல் தக்கவைக்கும் சுருக்கமான பெயர்ச்சொல்.
- source_word: Χριστὸς
  choice: மேசியா
  rationale: Χριστός இங்கு அபிஷேகம் செய்யப்பட்டவர் என்ற பட்டப்பெயரின் வலிமையைக் கொண்டிருப்பதால் ‘மேசியா’ என மொழிபெயர்க்கப்பட்டது.
- source_word: δωρεὰν
  choice: வீணாகவே
  rationale: இந்த நிபந்தனை வாதத்தில் மரணம் பயனற்றதாகவோ நோக்கமற்றதாகவோ ஆகிவிடும் என்ற கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: சட்டத்திற்கும் நீதிக்கும் இடையிலான தொடர்பு
  choice: சட்டத்தின் வழியாக நீதி கிடைக்கக்கூடும் என்ற நிபந்தனையை பவுல் முன்வைத்து, அப்படியானால் மேசியாவின் மரணம் வீணாகிவிடும் எனக் கூறுகிறார்.
  alternative: ‘நீதி’ என்பதைத் தனிமனிதன் தேவனுக்கு ஏற்புடையவனாக அறிவிக்கப்படுதல் என்று விரிவாக மொழிபெயர்க்கலாம்.
  rationale: மூலத்தின் சுருக்கத்தையும் ‘நீதி’ என்பதிலுள்ள உறவுசார் மற்றும் நெறிசார் பொருள் பரப்பையும் காக்கிறது; வசனத்திலேயே ஒரு குறிப்பிட்ட கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
- issue: Χριστός என்பதன் பெயர் அல்லது பட்டப்பெயர் தன்மை
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இச்சூழலில் அபிஷேகம் செய்யப்பட்ட மீட்பர் என்ற பட்டப்பெயரின் வாதப் பொருத்தத்தை வெளிப்படுத்துகிறது; அதேவேளை அடிக்குறிப்பில் பரவலான ‘கிறிஸ்து’ வடிவம் தரப்படுகிறது.
- issue: δωρεάν என்பதன் சூழல்சார் பொருள்
  choice: வீணாகவே
  alternative: காரணமின்றி
  rationale: இங்கு பவுலின் முடிவு மேசியாவின் மரணம் வரலாற்றுக் காரணமின்றி நிகழ்ந்தது என்பதல்ல; அது தேவையற்றதாகவும் பயனற்றதாகவும் ஆகிவிடும் என்பதே.
translation_notes:
  register: நவீன பொதுத்தமிழில், வாசிப்புக்கு எளிதானதாயும் பவுலின் கூர்மையான நிபந்தனை வாதத்தைத் தக்கவைத்தும் அமைக்கப்பட்டது. ‘செல்லாததாக்குதல்’ சற்றே முறையான சொற்பயன்பாடாக இருந்தாலும் ἀθετέω என்பதன் வலிமையைத் தருகிறது; ‘சட்டம்,’ ‘நீதி,’ ‘மேசியா’ ஆகியவை விளக்க விரிவாக்கமின்றி பயன்படுத்தப்பட்டுள்ளன.
