  to: தேவனுடைய அருளை நான் ஒதுக்கித் தள்ளுவதில்லை. ஏனெனில், சட்டத்தின் மூலம் நீதி[a] கிடைக்குமானால், மேசியா[b] வீணாகவே[c] இறந்தார்.
