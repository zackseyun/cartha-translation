id: GAL.2.3
reference: Galatians 2:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλ’ οὐδὲ Τίτος ὁ σὺν ἐμοί, Ἕλλην ὤν, ἠναγκάσθη περιτμηθῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/003.yaml
  text: But not even Titus[a], who was with me, though he was a Greek[b], was compelled to be circumcised.
translation:
  language: ta
  text: ஆனால், என்னுடன் இருந்த தீத்துக்கூட, கிரேக்கராக இருந்தபோதிலும்[a], விருத்தசேதனம் பெறும்படி கட்டாயப்படுத்தப்படவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிரேக்கராக இருந்த அவர்.” இச்சொற்றொடர் தீத்து கிரேக்கர் என்பதை நேரடியாகக் கூறுகிறது; சூழலில் அதன் விட்டுக்கொடுப்பு சார்ந்த பொருள், “இருந்தபோதிலும்” எனப் புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: ஆனால்
  rationale: முந்தைய கருத்துடன் உள்ள முரண்பாட்டை இயல்பாகவும் சுருக்கமாகவும் குறிக்கிறது.
- source_word: οὐδὲ
  choice: தீத்துகூட ... இல்லை
  rationale: தீத்துவை மையப்படுத்தும் ‘not even’ என்ற வலியுறுத்தலைத் தமிழில் ‘கூட ... இல்லை’ என்ற அமைப்பு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Τίτος
  choice: தீத்து
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவம்.
- source_word: ὁ σὺν ἐμοί
  choice: என்னுடன் இருந்த
  rationale: தீத்துவை அடையாளப்படுத்தும் கிரேக்கச் சொற்றொடரை எந்தக் கூடுதல் உறவுமுறையையும் சேர்க்காமல் நேரடியாகத் தருகிறது.
- source_word: Ἕλλην ὤν
  choice: கிரேக்கராக இருந்தபோதிலும்
  rationale: சூழலில் காணப்படும் விட்டுக்கொடுப்பு சார்ந்த பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; பங்கேற்பு வினையின் அடிப்படை அமைப்பை விளக்கும் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: Ἕλλην
  choice: கிரேக்கர்
  rationale: ‘புறவினத்தவர்’ என்ற விரிவான விளக்கச் சொல்லுக்கு மாற்றாமல், மூலத்தில் உள்ள குறிப்பான இன-பண்பாட்டு சொல்லையே தக்கவைக்கிறது.
- source_word: ἠναγκάσθη
  choice: கட்டாயப்படுத்தப்படவில்லை
  rationale: வெளியிலிருந்து வந்திருக்கக்கூடிய வற்புறுத்தலைக் காட்டும் இறந்தகாலச் செயலப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது.
- source_word: περιτμηθῆναι
  choice: விருத்தசேதனம் செய்துகொள்ள
  rationale: சடங்கைக் குறிக்கும் நிலைபெற்ற தமிழ்ச் சொல்லைப் பயன்படுத்தி, தமிழ் வழக்கில் இயல்பாகச் செயலை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: Ἕλλην என்பதை குறிப்பான இன-பண்பாட்டுச் சொல்லாக மொழிபெயர்ப்பதா அல்லது சமயச் சூழலை விளக்கும் பொதுச் சொல்லாக மொழிபெயர்ப்பதா
  choice: கிரேக்கர்
  alternative: புறவினத்தவர்
  rationale: மூலவசனம் தீத்துவைக் குறிப்பாக ‘கிரேக்கர்’ என்கிறது. இச்சூழலில் அது விருத்தசேதனம் செய்யப்படாத புறவினத்தவர் என்ற நிலையைக் குறிப்பால் உணர்த்தினாலும், மொழிபெயர்ப்பு அந்த விளக்கத்தை மூலச்சொல்லுக்குப் பதிலாக இடக்கூடாது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘கூட ... இல்லை’ என்பது οὐδὲ என்பதன் வலியுறுத்தலை இயல்பாகக் காக்கிறது. ‘கிரேக்கர்’ என்ற மூலத்தின் குறிப்பான சொல்லைத் தக்கவைத்து, ‘புறவினத்தவர்’ என்ற விளக்கப் பொதுமைப்படுத்தல் தவிர்க்கப்பட்டுள்ளது.
