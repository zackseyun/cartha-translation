id: GAL.2.16
reference: Galatians 2:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰδότες ⸀δὲ ὅτι οὐ δικαιοῦται ἄνθρωπος ἐξ ἔργων νόμου ἐὰν μὴ διὰ πίστεως ⸂Ἰησοῦ Χριστοῦ⸃, καὶ ἡμεῖς εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν, ἵνα δικαιωθῶμεν ἐκ πίστεως Χριστοῦ καὶ οὐκ ἐξ ἔργων νόμου, ⸂ὅτι ἐξ ἔργων νόμου οὐ δικαιωθήσεται⸃ πᾶσα σάρξ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/016.yaml
  text: Yet knowing that a person is not justified by works of the law except through faith in Jesus the Messiah[a], even we have believed in Messiah Jesus, so that we might be justified by faith in Messiah and not by works of the law[c][b], because by works of the law no flesh will be justified.
translation:
  language: ta
  text: ஆயினும், திருச்சட்டத்தின் செயல்களால் ஒருவர் நீதிமான் என்று அறிவிக்கப்படுவதில்லை; இயேசு மேசியாவின்மேல் உள்ள நம்பிக்கையினாலே அறிவிக்கப்படுகிறார்[a] என்பதை அறிந்த நாமும், மேசியா இயேசுவின்மேல் நம்பிக்கை வைத்தோம்; அது, திருச்சட்டத்தின் செயல்களால் அல்ல, மேசியாவின்மேல் உள்ள நம்பிக்கையால் நாம் நீதிமான் என்று அறிவிக்கப்படுவதற்காகவே[b]. ஏனெனில், திருச்சட்டத்தின் செயல்களால் மனிதர் எவரும்[c] நீதிமான் என்று அறிவிக்கப்படமாட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இயேசு மேசியாவின் உண்மைத்தன்மையின் வழியாகவே.”
    reason: alternative_reading
  - marker: b
    text: அல்லது, “மேசியாவின் உண்மைத்தன்மையால்.”
    reason: alternative_reading
  - marker: c
    text: சொற்சொல்லாக, “எந்த மாம்சமும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιοῦται / δικαιωθῶμεν / δικαιωθήσεται
  choice: நீதிமான் என்று அறிவிக்கப்படுதல்
  rationale: பவுலின் நீதித்துறைச் சார்ந்த சொல்லாற்றலைத் தெளிவாகக் காக்கிறது; மூன்று இடங்களிலும் ஒரே சொல்லாக்கம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἄνθρωπος
  choice: ஒருவர்
  rationale: பொதுவாக எல்லா மனிதரையும் குறிக்கும் ஒருமையை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἐξ ἔργων νόμου
  choice: திருச்சட்டம் சார்ந்த செயல்களால்
  rationale: இதனைப் பொதுவான ‘நற்செயல்கள்’ என்று விரிவுபடுத்தாமல், νόμος என்பதுடனான நேரடி தொடர்பைக் காக்கிறது.
- source_word: διὰ πίστεως Ἰησοῦ Χριστοῦ
  choice: இயேசு மேசியாவின்மேல் வைக்கும் நம்பிக்கையின் வழியாக
  rationale: πίστις என்பதற்கு முதன்மை உரையில் ‘நம்பிக்கை’ என்ற பொருளையும், சர்ச்சைக்குரிய இறைவேற்றுமைத் தொடர்புக்கு இயேசுவை நோக்கிய நம்பிக்கை என்ற வாசிப்பையும் அளிக்கிறது.
- source_word: εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν
  choice: மேசியா இயேசுவின்மேல் நம்பிக்கை வைத்தோம்
  rationale: πιστεύω εἰς என்பதன் நோக்குநிலைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்தி, கிரேக்கப் பெயர்–பட்ட வரிசையையும் முடிந்தவரை காக்கிறது.
- source_word: ἐκ πίστεως Χριστοῦ
  choice: மேசியாவின்மேல் வைக்கும் நம்பிக்கையால்
  rationale: முந்தைய πίστις Χριστοῦ தொடருடன் ஒத்திசைவாக உள்ளது; மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: Χριστός
  choice: மேசியா
  rationale: பட்டத்தின் செயற்படும் பொருளைக் காக்க, ஒலிபெயர்க்கப்பட்ட ‘கிறிஸ்து’ என்பதற்குப் பதிலாக பட்டம் மொழிபெயர்க்கப்படுகிறது.
- source_word: πᾶσα σάρξ
  choice: மனிதர் எவரும்
  rationale: எதிர்மறை வாக்கியத்தில் உள்ள ‘எந்த மாம்சமும் இல்லை’ என்ற பொருளைத் தெளிவான நவீனத் தமிழில் தருகிறது; சொற்சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: εἰδότες δὲ
  choice: ஆனாலும் … அறிந்திருக்கிற
  rationale: δέ என்பதன் மென்மையான எதிரிடைத் தொடர்பையும், பங்கேற்புவினையின் முந்தைய சூழலுடனான தொடர்ச்சியையும் காக்கிறது.
- source_word: ἐὰν μὴ διὰ
  choice: … அல்ல; … வழியாகவே
  rationale: கிரேக்கத்தின் விலக்கும் முரண்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது; திருச்சட்டச் செயல்கள் அல்ல, நம்பிக்கையே வழி என்ற வலியுறுத்தலைக் காக்கிறது.
theological_decisions:
- issue: πίστις Ἰησοῦ Χριστοῦ / πίστις Χριστοῦ என்பதன் பொருள்
  choice: இயேசு மேசியாவின்மேல் வைக்கும் நம்பிக்கை / மேசியாவின்மேல் வைக்கும் நம்பிக்கை
  alternative: இயேசு மேசியாவின் உண்மைத்தன்மை / மேசியாவின் உண்மைத்தன்மை
  rationale: இறைவேற்றுமைத் தொடர்பு நோக்குநிலையா அல்லது எழுவாய்நிலையா என்பது உண்மையாகவே சர்ச்சைக்குரியது. முதன்மை உரையில் நோக்குநிலை வாசிப்பு தரப்பட்டாலும், எழுவாய்நிலை வாசிப்பு இரு இடங்களிலும் அடிக்குறிப்புகளில் பாதுகாக்கப்படுகிறது.
- issue: δικαιόω என்பதன் நீதித்துறை மற்றும் மாற்றமளிக்கும் நுணுக்கம்
  choice: நீதிமான் என்று அறிவிக்கப்படுதல்
  alternative: நீதிமானாக்கப்படுதல் / நீதிமானாக ஏற்றுக்கொள்ளப்படுதல்
  rationale: நீதித்துறைத் தொனியைத் தெளிவாக்குகிறது; அதேவேளையில் யார் அறிவிக்கிறார் என்பதை உரையில் புதிதாகச் சேர்க்கவில்லை.
- issue: πᾶσα σάρξ என்ற வேதாகம மொழிநடை
  choice: மனிதர் எவரும்
  alternative: எந்த மாம்சமும்
  rationale: முதன்மை உரை சாதாரண வாசகருக்குத் தெளிவாக இருக்கிறது; எபிரெய வேதாகமத்தை நினைவூட்டும் சொற்சொல் மொழிநடை அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வேதாகம வாதத்தின் அடர்த்தியும் காக்கப்பட்டுள்ளன. பழமையான ‘நியாயப்பிரமாணம்’, ‘கிரியைகள்’, ‘விசுவாசம்’ போன்ற சொற்களுக்கு மாற்றாக ‘திருச்சட்டம்’, ‘செயல்கள்’, ‘நம்பிக்கை’ பயன்படுத்தப்பட்டுள்ளன. பவுலின் மீளுரைகளும் எதிர்மறை–நேர்மறை அமைப்பும் சுருக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
