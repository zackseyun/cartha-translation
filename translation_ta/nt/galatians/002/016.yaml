revisions:
- from: ஆனாலும், திருச்சட்டம் சார்ந்த செயல்களால் ஒருவர் நீதிமான் என்று அறிவிக்கப்படுவதில்லை; இயேசு மேசியாவின்மேல் வைக்கும் நம்பிக்கையின் வழியாகவே நீதிமான் என்று அறிவிக்கப்படுகிறார்[a] என்பதை அறிந்திருக்கிற நாமுங்கூட, திருச்சட்டம் சார்ந்த செயல்களால் அல்ல, மேசியாவின்மேல் வைக்கும் நம்பிக்கையால் நீதிமான் என்று அறிவிக்கப்படுவதற்காக மேசியா இயேசுவின்மேல் நம்பிக்கை வைத்தோம்[b]. ஏனெனில், திருச்சட்டம் சார்ந்த செயல்களால் மனிதர் எவரும்[c] நீதிமான் என்று அறிவிக்கப்படமாட்டார்.
  to: ஆயினும், திருச்சட்டத்தின் செயல்களால் ஒருவர் நீதிமான் என்று அறிவிக்கப்படுவதில்லை; இயேசு மேசியாவின்மேல் உள்ள நம்பிக்கையினாலே அறிவிக்கப்படுகிறார்[a] என்பதை அறிந்த நாமும், மேசியா இயேசுவின்மேல் நம்பிக்கை வைத்தோம்; அது, திருச்சட்டத்தின் செயல்களால் அல்ல, மேசியாவின்மேல் உள்ள நம்பிக்கையால் நாம் நீதிமான் என்று அறிவிக்கப்படுவதற்காகவே[b]. ஏனெனில், திருச்சட்டத்தின் செயல்களால் மனிதர் எவரும்[c] நீதிமான் என்று அறிவிக்கப்படமாட்டார்.
  rationale: The revision directly renders “works of law” as “திருச்சட்டத்தின் செயல்கள்,” regularizes formal modern Tamil syntax, and makes the objective-genitive faith expressions more idiomatic. It retains the judicial wording for δικαιόω, the translated title “மேசியா,” the disputed subjective-genitive alternatives in both locations, and the lexical note for πᾶσα σάρξ.
