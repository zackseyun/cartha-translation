source:
  edition: SBLGNT
  text: ζῶ δὲ οὐκέτι ἐγώ, ζῇ δὲ ἐν ἐμοὶ Χριστός· ὃ δὲ νῦν ζῶ ἐν σαρκί, ἐν πίστει ζῶ τῇ τοῦ ⸂υἱοῦ τοῦ θεοῦ⸃ τοῦ ἀγαπήσαντός με καὶ παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/020.yaml
  text: And it is no longer I who live[a], but Messiah lives in me. And the life that I now live in the flesh, I live by faith in the Son of God, who loved me and gave himself for me.
translation:
  language: ta
  text: நான் இனி வாழ்வதில்லை; மெசியா என்னில் வாழ்கிறார். இப்போது நான் மாம்சத்தில் வாழும் வாழ்க்கையை, என்னை அன்புகூர்ந்து எனக்காகத் தம்மையே ஒப்புக்கொடுத்த கடவுளின் மகன்மீது வைத்துள்ள நம்பிக்கையால் வாழ்கிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளின் மகனுடைய உண்மைத்தன்மையால் வாழ்கிறேன்.”
    reason: πίστις மற்றும் அதைத் தொடரும் உருபுத்தொடர், ‘மகன்மீது நம்பிக்கை’ என்றும் ‘மகனுடைய உண்மைத்தன்மை’ என்றும் இலக்கணரீதியாகப் புரிந்துகொள்ளப்படலாம்.
lexical_decisions:
- source_word: Χριστός
  choice: மெசியா
  rationale: Χριστός இங்கு ஒருவரின் பெயராக மட்டுமல்லாமல் அபிஷேகம் செய்யப்பட்ட அரசரைக் குறிக்கும் பட்டமாகச் செயல்படுவதால், அதன் பட்டப்பொருளை வெளிப்படுத்தும் ‘மெசியா’ பயன்படுத்தப்பட்டது.
- source_word: ζῶ δὲ οὐκέτι ἐγώ
  choice: வாழ்கிறேன்; ஆனால் இனி வாழ்வது நான் அல்ல
  rationale: கிரேக்கத்தின் தொடக்க வினையையும் அதனைத் தொடர்ந்து வரும் வலியுறுத்தப்பட்ட முரண்பாட்டையும் தமிழில் இயல்பாகவும் தெளிவாகவும் காக்கிறது.
- source_word: ὃ δὲ νῦν ζῶ
  choice: இப்போது நான் ... வாழும் வாழ்வை
  rationale: நடுநிலை உறவுப்பெயரால் அமைந்துள்ள கிரேக்கச் சொற்றொடர் நீக்கவுருபுடையது; தமிழில் அதன் உட்பொருளான ‘வாழ்வு’ வெளிப்படையாகக் கூறப்பட்டது.
- source_word: σάρξ
  choice: மாம்சம்
  rationale: இங்கு பாவ இயல்பைத் தெளிவாகக் குறிப்பிடாமல், தற்போதைய உடல்சார்ந்த மண்ணுலக வாழ்வைக் குறிக்கும் பவுலின் முக்கிய சொல்லைத் தக்கவைக்கிறது.
- source_word: πίστις
  choice: நம்பிக்கை
  rationale: நவீனத் தமிழில் இயல்பாகப் புரியும் சொல்லாகும்; இங்குள்ள உருபுத்தொடரின் மாற்றுப் பொருளான ‘உண்மைத்தன்மை’ அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: τῇ τοῦ υἱοῦ τοῦ θεοῦ
  choice: கடவுளின் மகன்மீது வைத்துள்ள நம்பிக்கையால்
  rationale: உருபுத்தொடரை நோக்குப்பொருள் சார்ந்ததாகப் புரிந்து, மகன்மீது வைக்கும் நம்பிக்கை என்ற முதன்மை வாசிப்பைத் தெளிவான தமிழில் தருகிறது; வேறு இலக்கண வாய்ப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ
  choice: எனக்காகத் தம்மையே ஒப்புக்கொடுத்த
  rationale: தன்னையே பிறருக்காகக் கையளித்த பலியார்ந்த செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘தம்மையே’ தன்னார்வமான முழுமையான அர்ப்பணிப்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: πίστις என்பதுடன் τοῦ υἱοῦ τοῦ θεοῦ என்ற உருபுத்தொடர் இணைவதன் பொருள்
  choice: கடவுளின் மகன்மீது வைத்துள்ள நம்பிக்கையால்
  alternative: கடவுளின் மகனுடைய உண்மைத்தன்மையால்
  rationale: கிரேக்க உருபுத்தொடர், மகனை நோக்கிய மனித நம்பிக்கையையோ மகனுக்குரிய உண்மைத்தன்மையையோ குறிக்கக்கூடும். பொதுவாக எளிதில் புரியும் நோக்குப்பொருள் வாசிப்பு முதன்மை உரையில் வைக்கப்பட்டு, உண்மையான மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘மாம்சம்’ போன்ற பவுலின் கருத்துச்சுமை கொண்ட சொல்லைத் தக்கவைத்தபோதும், வாக்கிய அமைப்பு இயல்பான தமிழாக அமைக்கப்பட்டது. மரியாதை ஒருமை வடிவங்கள் மெசியாவைக் குறிக்கப் பயன்படுத்தப்பட்டன.
