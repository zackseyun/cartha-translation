id: GAL.2.5
reference: Galatians 2:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἷς οὐδὲ πρὸς ὥραν εἴξαμεν τῇ ὑποταγῇ, ἵνα ἡ ἀλήθεια τοῦ εὐαγγελίου διαμείνῃ πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/005.yaml
  text: To them we did not yield in submission even for a moment[b][a], so that the truth of the gospel might remain for you.
translation:
  language: ta
  text: நற்செய்தியின் உண்மை உங்களுக்காக நிலைத்திருக்கும்படியாக, அவர்களுக்கு அடிபணிந்து ஒரு கணப்பொழுதுகூட நாங்கள் விட்டுக்கொடுக்கவில்லை[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், ‘ஒரு மணிநேரத்திற்குக்கூட இல்லை’; இங்கு ‘ஒரு கணப்பொழுதுகூட இல்லை’ என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உங்களிடத்தில்.’
    reason: alternative_reading
lexical_decisions:
- source_word: οἷς
  choice: அவர்களுக்கு
  rationale: இந்த உறவுப்பெயர் முந்தைய வசனத்தில் குறிப்பிடப்பட்டவர்களைக் குறிக்கிறது; தமிழில் அந்தத் தொடர்பை இயல்பாகத் தொடர்கிறது.
- source_word: οὐδὲ πρὸς ὥραν
  choice: ஒரு கணப்பொழுதுகூட
  rationale: சொல்லுக்கு சொல் ‘ஒரு மணிநேரம்கூட’ என்றிருந்தாலும், இங்கு மிகக் குறுகிய நேரத்தைக்கூட குறிக்கும் மரபுத்தொடரின் வலிமையை ‘ஒரு கணப்பொழுதுகூட’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: εἴξαμεν
  choice: விட்டுக்கொடுக்கவில்லை
  rationale: எதிர்ப்புக்கு இடங்கொடுத்து இணங்குதல் அல்லது பின்வாங்குதல் என்ற வினையின் பொருளை இயல்பான நவீன தமிழில் தருகிறது; அதைத் தொடர்ந்து வரும் ‘அடிபணிந்து’ என்பதோடு ஒன்றாக்கிவிடவில்லை.
- source_word: τῇ ὑποταγῇ
  choice: அடிபணிந்து
  rationale: விட்டுக்கொடுப்பது எந்த வகையில் நிகழ்ந்திருக்கும் என்பதைக் காட்டும் தத்த வேற்றுமையின் முறை அல்லது நிலை சார்ந்த பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἵνα
  choice: நிலைத்திருக்கும்படியே
  rationale: பவுலின் மறுப்புக்கான நோக்கத்தைத் தெளிவாகக் காட்டுகிறது; ‘ஏ’ விகுதி அந்த நோக்கத்தின் வலிமையை எடுத்துரைக்கிறது.
- source_word: ἡ ἀλήθεια τοῦ εὐαγγελίου
  choice: நற்செய்தியின் உண்மை
  rationale: பவுலின் முக்கியமான சொற்றொடரை நேரடியாகவும் புரிந்துகொள்ளத்தக்க நவீன தமிழிலும் காக்கிறது.
- source_word: διαμείνῃ
  choice: நிலைத்திருக்க
  rationale: தொடர்ந்து நீடித்திருத்தல் அல்லது பாதுகாக்கப்படுதல் என்ற வினையின் பொருளை மிகைப்படுத்தாமல் தருகிறது.
- source_word: πρὸς ὑμᾶς
  choice: உங்களுக்காக
  rationale: கலாத்தியர்களை நோக்கிய பயன் அல்லது அவர்களுக்கான அக்கறை என்ற பொருளை இயல்பாகத் தருகிறது; ‘உங்களிடம்’ என்ற இடம்சார்ந்த வாசிப்பும் சாத்தியம் என்பதால் அது அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: எதிர்ப்பாளர்களிடம் பவுல் காட்டிய மறுப்பின் தன்மை
  choice: அவர்களுக்கு அடிபணிந்து எந்த அளவிலும் விட்டுக்கொடுக்கவில்லை என்று பொதுவாக மொழிபெயர்க்கப்பட்டது.
  alternative: தனிப்பட்ட முறையில் தன்னை ஒப்படைக்க மறுத்தார்; அல்லது அமைப்புரீதியான சலுகை அளிக்க மறுத்தார்.
  rationale: கிரேக்க வாசகம் ‘அடிபணிதலில் விட்டுக்கொடுத்தல்’ என்பதைப் பொதுவாகக் கூறுகிறது. இதைத் தனிப்பட்ட மறுப்பு என்றோ அமைப்புரீதியான மறுப்பு என்றோ மட்டும் குறுக்காமல், மூலத்தின் பரப்பையும் இறையியல் இழுபறியையும் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியம் தமிழில் இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், மறுப்புக்கும் அதன் நோக்கத்திற்கும் இடையிலான தொடர்பை ‘அப்படிச் செய்தோம்’ தெளிவாகக் காக்கிறது.
