  source_fidelity: மூலக் கிரேக்கத்தின் காலத் தொடர்ச்சி (Ἔπειτα), பதினான்கு ஆண்டுகளுக்குப் பிந்தைய இடைவெளி, எருசலேமுக்கான மீள்வருகை, பர்னபாவின் உடனிருப்பு, தீத்துவையும் கூட்டிச் சென்ற கூடுதல் செயல் ஆகிய அனைத்தும் துல்லியமாக வெளிப்படுத்தப்பட்டுள்ளன. ἀνέβην என்பதிலுள்ள வழக்கமான ‘மேலே’ என்ற பயணநுணுக்கம் தமிழில் இயல்பான ‘போனேன்’ என்பதில் விடப்பட்டாலும், பொருளிழப்பு ஏற்படவில்லை.
  naturalness: நடை நவீன தரத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘தீத்துவையும் உடன் அழைத்துச் சென்றேன்’ என்பது இயல்பாகப் புரிகிறது; பர்னபாவுடன் சென்றதையும் தீத்துவைக் கூட்டிச் சென்றதையும் தெளிவாக வேறுபடுத்துகிறது.
  terminology: எருசலேம், பர்னபா, தீத்து ஆகிய பெயர்வடிவங்கள் தமிழ்வேதாகமப் பயன்பாட்டிற்கு ஏற்றவை. குறிப்பிடத்தக்க இறையியல் சொல் அல்லது மொழிபெயர்ப்பு முடிவு இவ்வசனத்தில் இல்லை.
