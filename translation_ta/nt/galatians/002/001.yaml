id: GAL.2.1
reference: Galatians 2:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἔπειτα διὰ δεκατεσσάρων ἐτῶν πάλιν ἀνέβην εἰς Ἱεροσόλυμα μετὰ Βαρναβᾶ συμπαραλαβὼν καὶ Τίτον·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/001.yaml
  text: Then after fourteen years I went up again to Jerusalem with Barnabas, also taking Titus along.
translation:
  language: ta
  text: பின்பு, பதினான்கு ஆண்டுகளுக்குப் பிறகு, பர்னபாவுடன் மீண்டும் எருசலேமுக்குப் போனேன்; தீத்துவையும் உடன் அழைத்துச் சென்றேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔπειτα
  choice: பின்பு
  rationale: பவுலின் விவரிப்பில் நிகழ்வுகளின் தொடர்ச்சியைக் குறிக்கும் இயல்பான தமிழ் இணைப்புச் சொல்.
- source_word: διὰ δεκατεσσάρων ἐτῶν
  choice: பதினான்கு ஆண்டுகளுக்குப் பிறகு
  rationale: διά + பிறப்புவேற்றுமை இங்கு கடந்த கால இடைவெளியைக் குறிக்கிறது; தமிழில் இதுவே இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: எருசலேமுக்குச் சென்ற பயணம் திரும்ப நிகழ்ந்ததைக் குறிக்கும் நேரடியான மொழிபெயர்ப்பு.
- source_word: ἀνέβην
  choice: போனேன்
  rationale: எருசலேமுக்குச் செல்வதை மூலத்தில் 'மேலே சென்றேன்' என்று கூறினாலும், நவீன தமிழில் 'போனேன்' இயல்பான பயணச் சொல்லாக்கம்; இலக்கைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: εἰς Ἱεροσόλυμα
  choice: எருசலேமுக்கு
  rationale: இலக்கைக் குறிக்கும் εἰς என்பதன் இயல்பான தமிழ் வடிவம்.
- source_word: μετὰ Βαρναβᾶ
  choice: பர்னபாவுடன்
  rationale: உடன்செல்லுதலை எளிமையாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: συμπαραλαβὼν καὶ Τίτον
  choice: தீத்துவையும் உடன் அழைத்துச் சென்றேன்
  rationale: συμπαραλαμβάνω என்பதன் 'தன்னுடன் கூட்டிச் செல்லுதல்' என்ற பொருளையும் καί என்பதன் சேர்க்கைப் பொருளையும் '-வும்' மூலம் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்குரிய கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டது. கிரேக்க வாக்கியத்தின் நிகழ்வுக்கால வரிசையும் உடன்செல்லும் நபர்களுக்கிடையேயான வேறுபாடும் பாதுகாக்கப்பட்டுள்ளன.
