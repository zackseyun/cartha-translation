  text: ἵνα τοὺς ὑπὸ νόμον ἐξαγοράσῃ, ἵνα τὴν υἱοθεσίαν ἀπολάβωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/005.yaml
  text: so that he might redeem those under the law[a], so that we might receive adoption as sons.
translation:
  language: ta
  text: திருச்சட்டத்தின் கீழிருந்தவர்களை அவர் மீட்பதற்காகவும், நாம் மகன்களாகத் தத்தெடுக்கப்படும் நிலையைப் பெறுவதற்காகவும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தத்தெடுக்கப்படும் நிலையை.” கிரேக்கச் சொல் சொல்லுக்கு சொல் “மகன்களாகத் தத்தெடுத்தல்” என்ற பொருளைத் தருகிறது. இது குடும்பத்தில் முழுமையான பிள்ளைநிலையையும் வாரிசுரிமையையும் வலியுறுத்துகிறது; இங்கு பெண்கள், ஆண்கள் ஆகிய எல்லா விசுவாசிகளும் உள்ளடங்குகிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα … ἵνα
  choice: … செய்வதற்காகவும், … செய்வதற்காகவும்
  rationale: இரண்டு உட்பிரிவுகளிலும் உள்ள நோக்கப் பொருளை இயல்பான தமிழ் இணை அமைப்பில் காக்கிறது.
- source_word: τοὺς ὑπὸ νόμον
  choice: திருச்சட்டத்தின் கீழ் இருந்தவர்களை
  rationale: இச்சூழலில் νόμος முதன்மையாக மோசேயின் திருச்சட்டத்தைக் குறிக்கிறது; ὑπό என்பதன் அதிகாரத்திற்குக் கீழிருக்கும் நிலையும் காக்கப்படுகிறது.
- source_word: ἐξαγοράσῃ
  choice: மீட்டுக்கொள்வதற்காக
  rationale: விடுதலையையும் விலைகொடுத்து மீட்கும் பின்னணியையும் தாங்கக்கூடிய, தமிழில் புரியத்தக்க சொல்.
- source_word: τὴν υἱοθεσίαν
  choice: மகன்களாகத் தத்தெடுக்கப்படும் நிலை
  rationale: υἱοθεσία என்பதிலுள்ள மகன் என்ற உறவுநிலையையும் அதனுடன் தொடர்புடைய முழுமையான வாரிசுரிமையையும் காக்கிறது; இது பெண்களையும் ஆண்களையும் உள்ளடக்கும் நிலை என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: ἀπολάβωμεν
  choice: நாம் … பெற்றுக்கொள்வதற்காக
  rationale: கூட்டு வினையின் இச்சூழலுக்குரிய இயல்பான பொருள் ‘பெறுதல்’; ‘திரும்பப் பெறுதல்’ என்ற பொருள் இங்கு வலியுறுத்தப்படவில்லை.
theological_decisions:
- issue: υἱοθεσία என்பதிலுள்ள பாலினம் குறித்த உறவுமொழி
  choice: மகன்களாகத் தத்தெடுக்கப்படும் நிலை
  alternative: தத்தெடுக்கப்படும் நிலை; பிள்ளைநிலை
  rationale: பவுலின் வாரிசுரிமை சார்ந்த வாதத்தில் ‘மகன்’ என்ற சட்டப்பூர்வ உறவுநிலை பொருளுடையது. அதே நேரத்தில், இந்த வரம் விசுவாசிகளான பெண்கள் ஆண்கள் அனைவரையும் உள்ளடக்குகிறது என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
- issue: ‘திருச்சட்டத்தின் கீழ் இருந்தவர்கள்’ என்பதன் குறிப்பு
  choice: முதன்மையாக மோசேயின் திருச்சட்டத்தின் கீழிருந்தவர்கள்
  alternative: பொதுவாக ஏதோ ஒரு சட்டத்திற்குக் கீழிருந்த அனைவரும்
  rationale: கலாத்தியர் 4:4–5-ன் உடனடிச் சூழல் மோசேயின் திருச்சட்டத்தை முதன்மையாகச் சுட்டுகிறது; அதற்கப்பாற்பட்ட பரந்த பயன்பாட்டை உரை வெளிப்படையாகத் தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிமையும் கொண்ட நடையைப் பயன்படுத்துகிறது. மூலத்தில் முந்தைய வசனத்தைச் சார்ந்த இரண்டு நோக்க உட்பிரிவுகள் இருப்பதால், தனிவசனமாக வாசிக்க இயல ‘அப்படிச் செய்தார்’ என முந்தைய செயலைச் சுட்டும் இயல்பான நிறைவு சேர்க்கப்பட்டுள்ளது.
