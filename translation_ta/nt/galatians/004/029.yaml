base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/029.yaml
  text: But just as then the one born according to the flesh persecuted the one born according to the Spirit[b][a], so also it is now.
translation:
  language: ta
  text: ஆனால், அப்போது மாம்சத்தின்படி[a] பிறந்தவன் ஆவியின்படி பிறந்தவனை[b] துன்புறுத்தியதுபோல, இப்போதும் அப்படியே நடக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இயல்பான மனித முறையில் பிறந்தவன்”; சொல்லுக்குச் சொல், “மாம்சத்தின்படி பிறந்தவன்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஆவியின்படி உள்ளவனை.” இரண்டாம் கூறில் “பிறந்த” என்ற சொல் கிரேக்கத்தில் வெளிப்படையாக இல்லை; முதல் கூறிலிருந்து புரிந்துகொள்ளப்பட்டு இங்கே சேர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: ஆனால்
  rationale: முந்தைய விளக்கத்துடன் உள்ள எதிர்மறைத் தொடர்பை இயல்பாகக் குறிக்கிறது.
- source_word: ὥσπερ τότε ... οὕτως καὶ νῦν
  choice: அப்போது ... போலவே, இப்போதும் நடக்கிறது
  rationale: அன்றைய நிலைக்கும் பவுலின் காலத்து நிலைக்கும் இடையிலான ஒப்புமையையும் கால வேறுபாட்டையும் தெளிவாகப் பேணுகிறது; இறுதியில் உள்ள கிரேக்க நீக்கவாக்கியத்தைத் தமிழில் இயல்பாக நிறைவு செய்கிறது.
- source_word: ὁ ... γεννηθεὶς
  choice: பிறந்தவன்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் இறந்தகாலச் செயப்பாட்டு எச்சத்தைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: κατὰ σάρκα
  choice: மாம்சத்தின்படி
  rationale: இயல்பான மனித இனப்பெருக்கத்தைக் குறிக்கும் சூழலிலும், பவுலின் ‘மாம்சம்—ஆவி’ என்ற சொல் இணைப்பையும் இறையியல் நெருக்கத்தையும் காக்கிறது.
- source_word: ἐδίωκε
  choice: துன்புறுத்தினான்
  rationale: பகைமையுடன் ஒடுக்குதல் என்ற பொருளைத் தெளிவாகத் தருகிறது; கிரேக்க இறந்தகாலத் தொடர்ச்சிச் செயலைத் தமிழ் சூழல் போதுமான அளவு உணர்த்துகிறது.
- source_word: τὸν κατὰ πνεῦμα
  choice: ஆவியின்படி பிறந்தவனை
  rationale: ‘பிறந்த’ என்பது இரண்டாம் கூறில் வெளிப்படையாக இல்லாவிட்டாலும், முதல் கூறிலிருந்து புரிந்துகொள்ளப்படும் இணைப்பைத் தமிழில் தெளிவாக்குகிறது; κατά என்பதைக் கருவிப்பொருளாக மட்டும் சுருக்கவில்லை.
- source_word: πνεῦμα
  choice: ஆவி
  rationale: கலாத்தியர் நிருபத்தின் சூழலில் இது பரிசுத்த ஆவியைக் குறிக்கும் எனப் புரிந்துகொள்ளப்படுகிறது; தமிழில் ‘ஆவி’ என்ற வடிவம் சூழலால் அந்தக் குறிப்பைத் தாங்குகிறது.
- source_word: νῦν
  choice: இப்போது
  rationale: பழைய நிகழ்வின் வடிவம் பவுலின் நிகழ்காலத்திலும் தொடர்வதை நேரடியாகக் குறிக்கிறது.
theological_decisions:
- issue: காத்தா சார்கா (κατὰ σάρκα) என்பதன் பொருள்
  choice: இயல்பான மனிதப் பிறப்பைக் குறிக்கிறது; பிரதான உரையில் ‘மாம்சத்தின்படி’ எனப் பேணப்பட்டது.
  alternative: பாவ இயல்பின்படி பிறந்தவன்; சாதாரண மனித முறையில் பிறந்தவன்
  rationale: உடனடி சூழல் இஸ்மவேலின் இயல்பான பிறப்பையும் ஈசாக்கின் வாக்குத்தத்தம்/ஆவியோடு தொடர்புடைய பிறப்பையும் வேறுபடுத்துகிறது. இங்கு பாவ இயல்பு என்ற பொருளைத் திணிக்காமல் பவுலின் சொல்வடிவம் காக்கப்படுகிறது.
- issue: πνεῦμα என்பதன் குறிப்பு
  choice: பரிசுத்த ஆவி
  alternative: மனித ஆவி; ஆவிக்குரிய தளம் அல்லது கோட்பாடு
  rationale: வாக்குத்தத்தத்தின்படி பிறந்த பிள்ளையையும் விசுவாசிகளின் தற்போதைய அடையாளத்தையும் இணைக்கும் கலாத்தியர் சூழலில் தெய்வீக ஆவியே மிகச் சாத்தியமான குறிப்பு; எனினும் பிரதான உரை கிரேக்கத்தின் சுருக்கமான வடிவத்துக்கு அருகில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘மாம்சம்—ஆவி’ என்ற பவுலின் முக்கிய எதிரிணை பிரதான உரையில் காக்கப்பட்டு, இயல்பான மனிதப் பிறப்பு என்ற சூழற்பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
