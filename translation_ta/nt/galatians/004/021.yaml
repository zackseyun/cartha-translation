  text: Λέγετέ μοι, οἱ ὑπὸ νόμον θέλοντες εἶναι, τὸν νόμον οὐκ ἀκούετε;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/021.yaml
  text: Tell me[a], you who want to be under the law, do you not listen to the law?
translation:
  language: ta
  text: 'எனக்குச் சொல்லுங்கள்: நியாயப்பிரமாணத்துக்குக் கீழ்ப்பட்டிருக்க விரும்புகிறவர்களே, நீங்கள் நியாயப்பிரமாணத்தைக் கேட்பதில்லையா?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நியாயப்பிரமாணத்திற்குச் செவிகொடுப்பதில்லையா?” கிரேக்க வினைச்சொல் ‘கேள்’ அல்லது ‘செவிகொடு’ என்று பொருள்படலாம். இங்கு “நியாயப்பிரமாணம்” என்பது மோசேயின் நியாயப்பிரமாணத்தையும், குறிப்பாகப் பவுல் அடுத்து எடுத்துரைக்கும் வேதப்பகுதியையும் சுட்டக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγετέ μοι
  choice: எனக்குச் சொல்லுங்கள்
  rationale: பன்மை நிகழ்காலக் கட்டளை வடிவத்தின் நேரடியான சவாலை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: οἱ ὑπὸ νόμον θέλοντες εἶναι
  choice: நியாயப்பிரமாணத்துக்குக் கீழ்ப்பட்டிருக்க விரும்புகிறவர்களே
  rationale: ὑπὸ νόμον என்ற பவுலின் சட்ட/உடன்படிக்கை சார்ந்த சொல்லாட்சியைத் தக்கவைத்து, அழைக்கப்படும் குழுவை விளிவேற்றுமையில் இயல்பாகக் குறிக்கிறது.
- source_word: νόμον / τὸν νόμον
  choice: நியாயப்பிரமாணம்
  rationale: இரு இடங்களிலும் ஒரே சொல்லைப் பயன்படுத்துவது, நியாயப்பிரமாணத்துக்குக் கீழிருப்பதற்கும் அது சொல்வதைக் கேட்பதற்கும் இடையிலான பவுலின் சொல்விளையாட்டைப் பாதுகாக்கிறது. சூழலில் இது மோசேயின் நியாயப்பிரமாணத்தையும் அடுத்து மேற்கோள் காட்டப்படும் வேதப்பகுதியையும் சுட்டுகிறது.
- source_word: οὐκ ἀκούετε
  choice: சொல்வதை நீங்கள் கேட்பதில்லையா?
  rationale: ἀκούω என்பதிலுள்ள ‘கேள்’ மற்றும் ‘செவிகொடு’ ஆகிய இரு சாத்தியங்களையும் இயல்பாகத் தாங்குகிறது; ‘சொல்வதை’ என்பது அடுத்து வரும் வேதவசன வாதத்துடன் பொருந்துகிறது.
theological_decisions:
- issue: ‘நியாயப்பிரமாணம்’ என்பதன் குறிப்பு
  choice: இரு இடங்களிலும் ‘நியாயப்பிரமாணம்’ என்று மொழிபெயர்த்து, முதல் இடத்தில் ஆளுகை/உடன்படிக்கை நிலையும் இரண்டாவது இடத்தில் வேத எழுத்தின் சாட்சியும் ஒலிக்குமாறு வைத்தல்
  alternative: முதல் இடத்தில் ‘சட்டம்’, இரண்டாவது இடத்தில் ‘திருச்சட்டம்’ அல்லது ‘மோசேயின் நியாயப்பிரமாணம்’ என்று வேறுபடுத்துதல்
  rationale: νόμος என்ற ஒரே கிரேக்கச் சொல்லின் மறுபயன்பாடு இவ்வசனத்தின் இறையியல் பதற்றத்துக்கும் வாதத்துக்கும் முக்கியம்; அதை முன்கூட்டியே இரண்டு வேறு கருத்துகளாகப் பிரிக்கக் கூடாது.
- issue: ἀκούετε என்பதின் வலிமை
  choice: ‘கேட்பதில்லையா?’ என்று வைத்து, செவியுறுதலும் கவனித்துக் கீழ்ப்படிதலும் ஆகிய நிழற்பொருள்களைத் திறந்துவைத்தல்
  alternative: ‘செவிகொடுப்பதில்லையா?’
  rationale: ‘செவிகொடு’ என்பது கவனித்தல்/கீழ்ப்படிதலைத் தெளிவாக்கினாலும், கிரேக்கத்தில் உள்ள எளிய ‘கேள்’ என்ற பொருளைச் சற்றே குறுக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதைமிக்க பன்மை அழைப்பும் நேரடியான வினாவும் பயன்படுத்தப்பட்டுள்ளன. தமிழ்க் கிறிஸ்தவ வாசகர்களுக்கு பரிச்சயமான ‘நியாயப்பிரமாணம்’ தேர்ந்தெடுக்கப்பட்டாலும், வாக்கிய அமைப்பு எளிமையாகவும் பொதுவாசகர்களுக்குப் புரியுமாறும் வைக்கப்பட்டுள்ளது.
