- from: 'நியாயப்பிரமாணத்துக்குக் கீழ்ப்பட்டிருக்க விரும்புகிறவர்களே, எனக்குச் சொல்லுங்கள்: நியாயப்பிரமாணம் சொல்வதை நீங்கள் கேட்பதில்லையா?[a]'
  to: 'எனக்குச் சொல்லுங்கள்: நியாயப்பிரமாணத்துக்குக் கீழ்ப்பட்டிருக்க விரும்புகிறவர்களே, நீங்கள் நியாயப்பிரமாணத்தைக் கேட்பதில்லையா?[a]'
