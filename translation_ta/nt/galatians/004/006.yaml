reference: Galatians 4:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι δέ ἐστε υἱοί, ἐξαπέστειλεν ὁ θεὸς τὸ πνεῦμα τοῦ υἱοῦ αὐτοῦ εἰς τὰς καρδίας ⸀ἡμῶν, κρᾶζον· Αββα ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/006.yaml
  text: And because you are sons[a], God sent the Spirit of his Son into our hearts, crying, “Abba[c][b], Father.”
translation:
  language: ta
  text: மேலும், நீங்கள் மகன்களாக[b] இருப்பதால், கடவுள் தமது மகனின் ஆவியை நமது இதயங்களுக்குள்[a] அனுப்பினார். அந்த ஆவி, “அப்பா[c], தந்தையே!” என்று உரக்கக் கூப்பிடுகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் ‘நமது இதயங்களுக்குள்’ என்பதற்குப் பதிலாக ‘உங்கள் இதயங்களுக்குள்’ என்று உள்ளது.
    reason: textual_variant
  - marker: b
    text: ‘மகன்கள்’ என்பது இங்கு பவுல் பயன்படுத்தும் தத்தெடுப்பு மற்றும் வாரிசுரிமை மொழியைப் பாதுகாக்கிறது; இது ஆண்களை மட்டும் அல்ல, விசுவாசிகள் அனைவரையும் உள்ளடக்குகிறது.
    reason: cultural_note
  - marker: c
    text: ‘அப்பா’ என்பது ‘தந்தை’ என்று அழைக்கும் அரமேயச் சொல்; மூல உரையின் வலியுறுத்தலையும் நெருக்கத்தையும் காக்க அது இங்கு ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι δέ
  choice: மேலும், ... இருப்பதால்
  rationale: ὅτι தரும் காரணப் பொருளையும் δέ தரும் மென்மையான இணைப்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἐστε
  choice: இருப்பதால்
  rationale: வாசகர்கள் தற்போது பெற்றிருக்கும் நிலையை நிகழ்காலப் பொருளில் தெரிவிக்கிறது; ‘ஆகிவிட்டதால்’ என்ற மாற்றத்தைத் தேவையின்றி சேர்க்கவில்லை.
- source_word: υἱοί
  choice: மகன்களாக
  rationale: கலாத்தியர் 3–4 அதிகாரங்களில் தத்தெடுப்பு, மகனுரிமை, வாரிசுரிமை ஆகியவற்றோடு இணைந்துள்ள ஆண்பால் பன்மைச் சொல்லின் சட்ட மற்றும் இறையியல் உருவகத்தைப் பாதுகாக்கிறது. இது ஆண் விசுவாசிகளை மட்டும் குறிக்கவில்லை என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: ἐξαπέστειλεν
  choice: அனுப்பினார்
  rationale: கடவுளின் நிறைவேற்றப்பட்ட செயலை இயல்பான, கண்ணியமான தமிழில் தெரிவிக்கிறது.
- source_word: τὸ πνεῦμα τοῦ υἱοῦ αὐτοῦ
  choice: தமது மகனின் ஆவி
  rationale: மகனுக்கும் ஆவிக்கும் இடையிலான மூலமொழியின் உடைமைத் தொடர்பைத் தெளிவாகப் பாதுகாக்கிறது; ‘தமது’ என்பது எழுவாயான கடவுளையே சுட்டுகிறது.
- source_word: εἰς τὰς καρδίας ἡμῶν
  choice: நமது இதயங்களுக்குள்
  rationale: εἰς என்பதன் ‘உள்ளே/உட்புகுதல்’ பொருளையும், இதயம் என்ற வேதாகம மனிதவியல் சொல்லையும் காக்கிறது.
- source_word: κρᾶζον
  choice: உரக்கக் கூப்பிடுகிறது
  rationale: பங்கேற்புவினை πνεῦμα என்பதோடு இலக்கண ஒத்திசைவில் இருப்பதால் ஆவியே கூப்பிடுவதாகத் தெளிவாக்குகிறது; κράζω என்பதன் வலிமையையும் இயல்பான தமிழில் தருகிறது.
- source_word: Αββα
  choice: அப்பா
  rationale: கிரேக்க உரைக்குள் அப்படியே வைக்கப்பட்ட அரமேய அழைப்புமுறையைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: ὁ πατήρ
  choice: தந்தையே
  rationale: வடிவில் குறிப்புச் சுட்டுடன் இருந்தாலும் இங்கு அழைப்புப் பொருளில் வருவதால், தமிழ் விளிவேற்றுமையுடன் இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: தத்தெடுப்பு மற்றும் வாரிசுரிமைச் சூழலில் υἱοί என்பதன் மொழிபெயர்ப்பு
  choice: மகன்களாக
  alternative: பிள்ளைகளாக
  rationale: பவுலின் வாதம் பொதுவான பிள்ளைநிலையை மட்டுமல்ல, மகனுரிமையோடு இணைந்த வாரிசுரிமையையும் சார்ந்தது. ஆகவே பாலினத்தைப் பொதுமைப்படுத்தி உருவகத்தை மங்கச் செய்யாமல் ‘மகன்கள்’ காக்கப்படுகிறது; அது எல்லா விசுவாசிகளையும் உள்ளடக்கும் என்பது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: ‘இதயங்கள்’ என்பதுடன் வரும் உடைமைப் பெயர்ச்சொல்லின் பாடவேறுபாடு
  choice: நமது இதயங்களுக்குள்
  alternative: உங்கள் இதயங்களுக்குள்
  rationale: கொடுக்கப்பட்ட SBLGNT மூல உரை ἡμῶν (‘நமது’) என்று வாசிப்பதால் அது முதன்மை உரையில் பின்பற்றப்படுகிறது; γνωστόமான ὑμῶν (‘உங்கள்’) பாடம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: கூப்பிடுபவர் யார்?
  choice: ஆவியே கூப்பிடுகிறது
  alternative: விசுவாசிகள் ஆவியினால் கூப்பிடுகிறார்கள்
  rationale: κρᾶζον என்ற நடுநிலை ஒருமைப் பங்கேற்புவினை τὸ πνεῦμα என்பதோடு இலக்கண ரீதியாக ஒத்துப்போவதால், இவ்வாக்கியத்தில் ஆவியே நேரடியான செய்பவர். விசுவாசிகள் ஆவியினால் இவ்வாறு அழைப்பது உட்பொருளாக இருக்கலாம்; ஆனால் அதை முதன்மை இலக்கணக் கட்டமைப்புக்கு மாற்றாக வைக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. ‘மகன்கள்’ என்ற சொல் சட்டபூர்வ மகனுரிமை–வாரிசுரிமை உருவகத்திற்காகத் திட்டமிட்டு காக்கப்பட்டுள்ளது. ‘அப்பா, தந்தையே’ என்ற இரட்டை அழைப்பு மூல உரையின் அரமேய–கிரேக்க அமைப்பைத் தமிழில் வெளிப்படுத்துகிறது; ‘உரக்கக் கூப்பிடுகிறது’ என்பது ஆவியின் செயலைத் தெளிவாகவும் உயிரோட்டமாகவும் தருகிறது.
