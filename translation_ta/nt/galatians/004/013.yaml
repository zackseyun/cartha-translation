source:
  edition: SBLGNT
  text: οἴδατε δὲ ὅτι δι’ ἀσθένειαν τῆς σαρκὸς εὐηγγελισάμην ὑμῖν τὸ πρότερον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/013.yaml
  text: But you know that it was because of an illness of the flesh that I first proclaimed the good news to you,[a]
translation:
  language: ta
  text: ஆனால், உடல் நோயின் காரணமாக நான் முதன்முதலில் உங்களுக்கு நற்செய்தியை அறிவித்தேன் என்பது உங்களுக்குத் தெரியும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உடல் பலவீனத்தின் காரணமாக.” கிரேக்கச் சொற்றொடர் சொற்சொல்லாக “மாம்சத்தின் பலவீனம்/நோய்” என்று கூறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: உங்களுக்குத் தெரியும்
  rationale: οἶδα என்பதன் நிறைவுவடிவம் இங்கு நிகழ்காலப் பொருளில் வருகிறது; கலாத்தியர்கள் ஏற்கெனவே அறிந்திருந்ததைப் பவுல் நினைவூட்டுவதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய கருத்திலிருந்து மென்மையான மாறுபாட்டையும் உரையாடல் திருப்பத்தையும் குறிக்கிறது.
- source_word: ὅτι
  choice: என்பது
  rationale: கலாத்தியர்களுக்குத் தெரிந்த செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் இணைப்பாக இயல்பான தமிழில் அமைகிறது.
- source_word: δι’ ἀσθένειαν τῆς σαρκὸς
  choice: உடல் நோயின் காரணமாகவே
  rationale: διά + குற்றுவேற்றுமை காரணத்தைக் குறிக்கிறது. ἀσθένεια என்பது பலவீனம் அல்லது நோய் எனப் பொருள்படலாம்; σάρξ உடன் இச்சூழலில் உடல்சார்ந்த நோய் என்பதே அதிக சாத்தியம். அடிக்குறிப்பு உண்மையான சொற்பொருள் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: εὐηγγελισάμην
  choice: நற்செய்தியை அறிவித்தேன்
  rationale: εὐαγγελίζω என்ற வினையின் அறிவித்தல் செயலை, சமகால வாசகருக்குப் புரியும் இயல்பான மொழியில் தருகிறது.
- source_word: ὑμῖν
  choice: உங்களுக்கு
  rationale: மறைமுகச் செயப்படுபொருளைக் குறிக்கும் வேற்றுமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὸ πρότερον
  choice: முதன்முதலில்
  rationale: பவுல் அவர்களிடம் ஆரம்பத்தில் நற்செய்தி அறிவித்த சந்தர்ப்பத்தைச் சுட்டுகிறது; ‘முதன்முதலில்’ என்பது அந்த முன் நிகழ்வை இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: ἀσθένειαν τῆς σαρκὸς என்பதில் σάρξ என்பதன் பொருள்
  choice: 'உடல்சார்ந்த பொருள்: ‘உடல் நோய்’'
  alternative: உடல் பலவீனம்; உருவகமான பலவீனம்; பாவ இயல்பு
  rationale: பவுல் கலாத்தியாவில் முன்னர் இருந்த சூழ்நிலையை நினைவுகூருவதால், இச்சொற்றொடர் அறநெறிசார்ந்த ‘பாவ இயல்பை’ அல்ல, உடல்நிலையையே குறிப்பதாகத் தெரிகிறது. எனினும் ἀσθένεια ‘நோய்’ அல்லது ‘பலவீனம்’ இரண்டையும் குறிக்கக்கூடும் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘நற்செய்தி’ என்ற பரவலாகப் புரிந்துகொள்ளப்படும் சொல்லைப் பயன்படுத்தி, மூலத்தின் வினைச்செயல் காக்கப்பட்டது; ‘நோய்/பலவீனம்’ என்ற தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
