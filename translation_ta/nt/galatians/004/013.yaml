    issue: Unwarranted emphasis in ‘காரணமாகவே’
    rationale: The Greek δι’ ἀσθένειαν expresses cause, ‘because of/on account of,’ but does not itself supply the restrictive or emphatic force expressed by -வே. Removing it more closely preserves the source's scope.
