  source_fidelity: வரைவில் γνόντες மற்றும் γνωσθέντες ஆகியவற்றின் செயப்பாட்டு எதிர்மறை இணைவும், μᾶλλον δέ-இன் திருத்தவலிமையும், στοιχεῖα-வின் திறந்த பொருளும், அடிமைத்தன உருவகமும் பெரும்பாலும் நன்றாகக் காக்கப்பட்டுள்ளன. ஆனால் ‘அறிந்துகொண்டிருக்கிறீர்கள் / அறியப்பட்டிருக்கிறீர்கள்’ என்பது மூலத்தின் அஓரிஸ்து பங்கேற்புகளைத் தமிழில் நிகழ்கால நிறைவு நிலையாக மாற்றுகிறது. மேலும் πάλιν ἄνωθεν என்பதற்கு ‘மறுபடியும் முதலிலிருந்து’ என்பதற்குப் பதில் ‘மீண்டும் புதிதாக’ என்பது இயல்பாகவும் பொருளுக்கு நெருக்கமாகவும் உள்ளது.
  naturalness: ‘அடிப்படைக் கூறுகளிடம்’ மற்றும் ‘அவற்றுக்கு ... அடிமையாக இருக்க’ என்பவை புரிந்துகொள்ளத்தக்கவை; ஆயினும் ‘அடிப்படைக் கூறுகளிடம் திரும்பி’ என்பதற்குப் பதில் ‘அடிப்படைக் கூறுகளுக்குத் திரும்பி,’ ‘அவற்றுக்கு அடிமைகளாக’ என்பவை நவீன பொதுத்தமிழில் சீராக அமையும். பங்கேற்பு வடிவங்களையும் ‘அறிந்தவர்களானபின்—அல்லது, இன்னும் சரியாகச் சொன்னால், கடவுளால் அறியப்பட்டவர்களானபின்—’ என்று அமைத்தால் வாக்கியத் தொடர்பு தெளிவாகும்.
  terminology: ‘அடிப்படைக் கூறுகள்’ என்பது στοιχεῖα-வின் விவாதத்திற்குரிய பொருளைத் தேவையின்றி ஒரு குறிப்பிட்ட இறையியல் விளக்கமாக்காமல் காக்கும் ஏற்ற முதன்மைச் சொல். அடிக்குறிப்பில் உள்ள ‘மூலசக்திகள்,’ ‘அடிப்படைக் கோட்பாடுகள்,’ ‘தொடக்கநிலைக் காரியங்கள்’ என்ற மாற்றுகள் பொருத்தமானவை. ‘அடிமைகளாக’ என்பது δουλεύειν-இன் அடிமைத்தன வலிமையைப் பாதுகாக்கிறது.
