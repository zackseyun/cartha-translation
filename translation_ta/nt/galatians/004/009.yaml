id: GAL.4.9
reference: Galatians 4:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: νῦν δὲ γνόντες θεόν, μᾶλλον δὲ γνωσθέντες ὑπὸ θεοῦ, πῶς ἐπιστρέφετε πάλιν ἐπὶ τὰ ἀσθενῆ καὶ πτωχὰ στοιχεῖα, οἷς πάλιν ἄνωθεν ⸀δουλεύειν θέλετε;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/009.yaml
  text: But now[a], having come to know God—or rather, having been known by God—how can you turn back again to the weak and poor elemental principles, to which you want to be enslaved all over again?
translation:
  language: ta
  text: ஆனால் இப்போது நீங்கள் கடவுளை அறிந்தவர்களானபின்—அல்லது, இன்னும் சரியாகச் சொன்னால், கடவுளால் அறியப்பட்டவர்களானபின்—பலவீனமும் வறுமையும் கொண்ட அடிப்படைக் கூறுகளுக்குத்[a] திரும்பி, அவற்றுக்கு மீண்டும் புதிதாக அடிமைகளாக விரும்புவது எப்படி?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மூலசக்திகள்,” “அடிப்படைக் கோட்பாடுகள்,” அல்லது “தொடக்கநிலைக் காரியங்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: στοιχεῖα என்பதற்கான உண்மையான பொருள் வாய்ப்புகளைப் பாதுகாக்கும் சொற்பொருள் மாற்றுகள்.
lexical_decisions:
- source_word: γνόντες θεόν
  choice: கடவுளை அறிந்துகொண்டிருக்கிறீர்கள்
  rationale: இறந்தகாலப் பங்கேற்பு, கடவுளை அறியும் நிலைக்குள் அவர்கள் வந்ததைச் சூழலில் குறிக்கிறது. தமிழில் முதன்மை வினையுடன் இயல்பாக இணைவதற்காக இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: μᾶλλον δὲ γνωσθέντες ὑπὸ θεοῦ
  choice: இன்னும் சரியாகச் சொன்னால், கடவுளால் அறியப்பட்டிருக்கிறீர்கள்
  rationale: μᾶλλον δέ முந்தைய கூற்றைத் திருத்தி ஆழப்படுத்துகிறது. இறையியல் விளக்கத்தைச் சேர்க்காமல், செயப்பாட்டு வடிவமும் கடவுளின் முன்னுரிமையும் வெளிப்படையாக வைக்கப்படுகின்றன.
- source_word: πῶς
  choice: எப்படி
  rationale: பவுலின் வியப்பும் கண்டனமும் நிறைந்த வினாவை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἐπιστρέφετε πάλιν
  choice: மீண்டும் ... திரும்பி
  rationale: திரும்பிச் செல்லும் தற்போதைய செயலையும் πάλιν தரும் மறுபடியும் என்ற வலியுறுத்தலையும் காக்கிறது.
- source_word: τὰ ἀσθενῆ καὶ πτωχὰ στοιχεῖα
  choice: பலவீனமும் வறுமையும் கொண்ட அடிப்படைக் கூறுகள்
  rationale: ἀσθενῆ மற்றும் πτωχὰ என்பவற்றை முறையே பலவீனம், வறுமை என நேரடியாகக் காட்டுகிறது. στοιχεῖα என்பதன் விவாதத்திற்குரிய பொருளை ஒரே விளக்கத்துக்குள் அடைக்காமல் ‘அடிப்படைக் கூறுகள்’ என வழங்குகிறது.
- source_word: πάλιν ἄνωθεν
  choice: மறுபடியும் முதலிலிருந்து
  rationale: மீண்டும் தொடங்கி முழுமையாக அதே அடிமைநிலைக்குச் செல்வதை வலியுறுத்தும் இரு சொற்களின் கூட்டு அர்த்தத்தைப் பாதுகாக்கிறது.
- source_word: δουλεύειν
  choice: அடிமையாக இருக்க
  rationale: கலாத்தியரில் முக்கியமான அடிமைத்தன உருவகத்தை ‘சேவை செய்ய’ என்று மென்மைப்படுத்தாமல் தெளிவாகக் காக்கிறது.
- source_word: θέλετε
  choice: விரும்புகிறீர்கள்
  rationale: அவர்களுடைய விருப்பம் அல்லது நோக்கத்தைச் சுட்டும் θέλω என்பதன் நேரான, இயல்பான தமிழ் இணை.
theological_decisions:
- issue: கலாத்தியர் 4:9-இல் στοιχεῖα என்பதன் பொருள்
  choice: அடிப்படைக் கூறுகள்
  alternative: மூலசக்திகள்; அடிப்படைக் கோட்பாடுகள்; தொடக்கநிலைக் காரியங்கள்
  rationale: இச்சொல் அடிப்படை சமயக் கோட்பாடுகளையோ, உலக ஒழுங்குடன் தொடர்புடைய சக்திகளையோ குறிக்கக்கூடும். மூலமொழியிலுள்ள தெளிவின்மையை முதன்மை உரை காக்கிறது; பிற வாய்ப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
- issue: ‘கடவுளால் அறியப்பட்டவர்கள்’ என்பதன் வலிமை
  choice: கடவுள் அவர்களை அறிந்திருப்பதைத் திருத்தி வலியுறுத்தும் செயப்பாட்டு வடிவமாக வைத்தல்
  alternative: அவர்களுக்கும் கடவுளுக்கும் உள்ள உறவை மட்டும் பொதுவாகச் சுட்டுதல்
  rationale: μᾶλλον δέ உண்மையான திருத்தத்தை வெளிப்படுத்துகிறது. ஆகவே கடவுளின் செயல் முன்னிலையில் வைக்கப்படுகிறது; ஆனால் இதற்கு அப்பாற்பட்ட ஓர் இறையியல் அமைப்பு உரைக்குள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், பவுலின் வியப்பும் கண்டனமும் குறையாத கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. நீண்ட கிரேக்க வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ்வாக்கியங்களாக அமைக்கப்பட்டாலும், இரண்டாவது வினாவின் தர்க்கத் தொடர்பு ‘அப்படியிருக்க’ என்பதால் காக்கப்படுகிறது.
