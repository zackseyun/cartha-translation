- from: ஆனால் இப்போது நீங்கள் கடவுளை அறிந்துகொண்டிருக்கிறீர்கள்—இன்னும் சரியாகச் சொன்னால், கடவுளால் அறியப்பட்டிருக்கிறீர்கள். அப்படியிருக்க, பலவீனமும் வறுமையும் கொண்ட அடிப்படைக் கூறுகளிடம்[a] மீண்டும் எப்படித் திரும்பி, அவற்றுக்கு மறுபடியும் முதலிலிருந்து அடிமையாக இருக்க விரும்புகிறீர்கள்?
  to: ஆனால் இப்போது நீங்கள் கடவுளை அறிந்தவர்களானபின்—அல்லது, இன்னும் சரியாகச் சொன்னால், கடவுளால் அறியப்பட்டவர்களானபின்—பலவீனமும் வறுமையும் கொண்ட அடிப்படைக் கூறுகளுக்குத்[a] திரும்பி, அவற்றுக்கு மீண்டும் புதிதாக அடிமைகளாக விரும்புவது எப்படி?
  rationale: திருத்தம் மூலத்தின் அஓரிஸ்து பங்கேற்புகள் பிரதான வினாவுடன் கொண்டிருக்கும் தொடர்பைத் தெளிவாகக் காட்டுகிறது; μᾶλλον δέ-இன் திருத்தத் தன்மையையும் கடவுளால் அறியப்பட்டதன் செயப்பாட்டு வடிவத்தையும் காக்கிறது. στοιχεῖα பற்றிய மூலமொழித் தெளிவின்மை முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்படுகிறது. πάλιν ἄνωθεν மற்றும் δουλεύειν ஆகியவற்றுக்கான தமிழ் மேலும் இயல்பாகவும் துல்லியமாகவும் அமைக்கப்பட்டுள்ளது.
