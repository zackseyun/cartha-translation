id: GAL.4.3
reference: Galatians 4:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὕτως καὶ ἡμεῖς, ὅτε ἦμεν νήπιοι, ὑπὸ τὰ στοιχεῖα τοῦ κόσμου ⸀ἤμεθα δεδουλωμένοι·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/003.yaml
  text: So also we[a], when we were children, were enslaved under the elemental principles of the world.
translation:
  language: ta
  text: அவ்வாறே நாமும், சிறுபிள்ளைகளாக இருந்தபோது, உலகத்தின் அடிப்படைக் கூறுகளுக்குக் கீழ் அடிமைப்படுத்தப்பட்டிருந்தோம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως καὶ
  choice: அவ்வாறே
  rationale: முந்தைய வசனத்தில் வாரிசைப் பற்றிய உவமைக்கும் இவ்வசனத்திற்கும் உள்ள ஒப்புமையை இயல்பாகவும் சுருக்கமாகவும் காட்டுகிறது.
- source_word: ἡμεῖς
  choice: நாமும்
  rationale: கிரேக்கத்தில் வலியுறுத்தப்பட்டுள்ள முதலாம் நபர் பன்மையை வெளிப்படையாகத் தக்கவைக்கிறது; καὶ என்பதன் ‘-உம்’ பொருளையும் இணைக்கிறது.
- source_word: ὅτε ἦμεν νήπιοι
  choice: சிறுபிள்ளைகளாக இருந்தபோது
  rationale: முந்தைய வாரிசு உவமையின் பின்னணியில் νήπιοι என்பது நேரடியான குழந்தைப் பருவத்தைவிட சட்டப்பூர்வ அல்லது சமூக முதிர்ச்சியின்மையைச் சுட்டுகிறது; ‘சிறுபிள்ளைகள்’ இதை எளிய தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὑπὸ
  choice: -க்கு
  rationale: கட்டுப்பாட்டின்கீழ் இருப்பதைக் குறிக்கும் உறவை இயல்பான தமிழ் வேற்றுமை உருபால் தெரிவிக்கிறது; அடிமைப்படுத்தப்பட்டிருந்தோம் என்ற வினை அந்தக் கீழ்ப்படிதல் உருவகத்தை வலுவாகத் தக்கவைக்கிறது.
- source_word: τὰ στοιχεῖα τοῦ κόσμου
  choice: உலகத்தின் அடிப்படைக் கூறுகள்
  rationale: στοιχεῖα என்பதற்கு அடிப்படைக் கூறுகள், அடிப்படைக் கோட்பாடுகள், அல்லது அண்டத்துக்குரிய ஆவிக்குரிய சக்திகள் என்ற பொருள் வாய்ப்புகள் உள்ளன. ‘அடிப்படைக் கூறுகள்’ என்பது முதன்மை உரையில் தனிப்பட்ட ஆவிகளைத் திட்டவட்டமாகக் குறிப்பிடாமல் சொல்லின் பரப்பை ஓரளவு தக்கவைக்கிறது.
- source_word: ἤμεθα δεδουλωμένοι
  choice: அடிமைப்படுத்தப்பட்டிருந்தோம்
  rationale: சுற்றிவளைந்த இறந்தகாலப் பயனிலை அமைப்பையும் செயல்படுத்தப்பட்ட அடிமைத்தனத்தின் வலிமையையும் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: τὰ στοιχεῖα τοῦ κόσμου என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘உலகத்தின் அடிப்படைக் கூறுகள்’
  alternative: ‘உலகத்தின் அடிப்படை ஆவிக்குரிய சக்திகள்’ அல்லது ‘உலகத்தின் அடிப்படைக் கோட்பாடுகள்’
  rationale: கலாத்தியரிலும் கொலோசெயரிலும் இச்சொற்றொடரின் பொருள் விவாதத்திற்குரியது. உடனடி சூழல் முதிராத வாரிசு பாதுகாவலர்களுக்குக் கீழிருப்பதை வலியுறுத்துவதால் தனிநபர் அல்லாத பொருள் முதன்மை உரையில் பொருத்தமானது. எனினும் அண்டத்துக்குரிய ஆவிக்குரிய சக்திகளையும் இது குறிக்கலாம் என்பதால் அந்த இறையியல் பதற்றம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘அடிமைப்படுத்தப்பட்டிருந்தோம்’ என்பது மூலத்தின் வலுவான அடிமைத்தன மொழியைத் தக்கவைக்கிறது; விவாதத்திற்குரிய στοιχεῖα என்பதன் மாற்றுப் பொருள் அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
