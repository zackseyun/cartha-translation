id: GAL.4.22
reference: Galatians 4:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: γέγραπται γὰρ ὅτι Ἀβραὰμ δύο υἱοὺς ἔσχεν, ἕνα ἐκ τῆς παιδίσκης καὶ ἕνα ἐκ τῆς ἐλευθέρας·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/022.yaml
  text: For it is written that Abraham had two sons[a], one by the servant woman and one by the free woman.
translation:
  language: ta
  text: 'ஏனெனில், ஆபிரகாமுக்கு இரண்டு மகன்கள் இருந்தார்கள் என்று எழுதப்பட்டிருக்கிறது: ஒருவன் அடிமைப் பெண்ணுக்குப் பிறந்தவன்; மற்றொருவன் சுதந்திரப் பெண்ணுக்குப் பிறந்தவன்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται
  choice: எழுதப்பட்டிருக்கிறது
  rationale: மறைநூல் சான்றை அறிமுகப்படுத்தும் நிறைவு காலச் செயப்பாட்டு வடிவத்தின் நிலைத்த அதிகாரத் தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வாதத்திற்கான ஆதாரத்தை அறிமுகப்படுத்தும் காரணத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ὅτι
  choice: என்று
  rationale: எழுதப்பட்டுள்ள செய்தியின் உள்ளடக்கத்தை இயல்பான தமிழ் மேற்கோள் அமைப்பில் அறிமுகப்படுத்துகிறது.
- source_word: Ἀβραὰμ
  choice: ஆபிரகாம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட பெயர்வடிவம்.
- source_word: δύο υἱοὺς
  choice: இரண்டு மகன்கள்
  rationale: υἱούς என்பதன் ஆண்பால் குறிப்பைத் துல்லியமாகப் பேணுகிறது.
- source_word: ἔσχεν
  choice: இருந்தார்கள்
  rationale: ஆபிரகாமுக்கு மகன்கள் இருந்தனர் என்ற பெற்றோர் உறவை இயல்பான தமிழில் தெரிவிக்கிறது; ‘பெற்றெடுத்தார்’ என்ற தவறான தாய்மைச் சாயலைத் தவிர்க்கிறது.
- source_word: ἕνα ... καὶ ἕνα
  choice: ஒருவன் ... ஒருவன்
  rationale: கிரேக்கத்தின் சமச்சீரான இணை அமைப்பைப் பேணுகிறது.
- source_word: ἐκ
  choice: இடமிருந்தும் ... பிறந்தவர்கள்
  rationale: தாய்வழிப் பிறப்பைக் குறிக்கும் ἐκ என்பதைக் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: παιδίσκης
  choice: அடிமைப் பெண்
  rationale: பெண் அடிமை அல்லது பணிப்பெண் என்ற பொருளுடைய சொல்லை, பவுலின் அடிமைத்தனம்–சுதந்திரம் எதிர்மறையைத் தெளிவாகப் பேணும் வகையில் மொழிபெயர்க்கிறது.
- source_word: ἐλευθέρας
  choice: சுதந்திரப் பெண்
  rationale: சுதந்திரமான சமூக நிலையுடைய பெண்ணைக் குறிக்கும் பெயராக்கப்பட்ட பெயரடையை, ‘அடிமைப் பெண்’ என்பதற்கு இணையான எதிர்மறை வடிவில் தருகிறது.
theological_decisions:
- issue: பவுலின் உருவக வாதத்தில் மையமான அடிமைத்தனம்–சுதந்திரம் என்ற சமூகநிலை எதிர்மறை
  choice: παιδίσκη/ἐλευθέρα என்பவற்றை ‘அடிமைப் பெண்’/‘சுதந்திரப் பெண்’ என்று மொழிபெயர்த்தல்
  alternative: ‘பணிப்பெண்’/‘சுதந்திரப் பெண்’
  rationale: சுற்றியுள்ள வாதம் அடிமைத்தனத்தையும் சுதந்திரத்தையும் நேரடியாக எதிர்நிறுத்துவதால், ‘அடிமைப் பெண்’ என்பது உரையில் உள்ள சமூகநிலையையும் இறையியல் அழுத்தத்தையும் கூடுதல் விளக்கமின்றிப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘ஒருவன் ... ஒருவன்’ என்ற இணை அமைப்பு மூலத்தின் சமநிலையைப் பேணுகிறது; இறுதியில் ‘பிறந்தவர்கள்’ சேர்க்கப்பட்டது ἐκ குறிக்கும் தாய்வழிப் பிறப்பை இயல்பான தமிழில் வெளிப்படுத்துவதற்காக.
