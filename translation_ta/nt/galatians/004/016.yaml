reference: Galatians 4:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὥστε ἐχθρὸς ὑμῶν γέγονα ἀληθεύων ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/016.yaml
  text: So then[a], have I become your enemy by telling you the truth?
translation:
  language: ta
  text: அப்படியானால், உங்களிடம் உண்மையைச் சொல்வதால்[a] நான் உங்கள் பகைவனாகிவிட்டேனா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உங்களிடம் உண்மையாகப் பேசுவதால்.’ ἀληθεύων என்ற கிரேக்கச் சொல் ‘உண்மையாகப் பேசுதல்’ அல்லது ‘உண்மையைச் சொல்லுதல்’ என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: அப்படியானால்
  rationale: முந்தைய கருத்திலிருந்து ஒரு முடிவை எடுத்துக் காட்டும் இணைப்புச் சொல்; தமிழில் இயல்பான வினாவுக்குரிய மாற்றத்தைத் தருகிறது.
- source_word: ἐχθρὸς ὑμῶν
  choice: உங்கள் பகைவன்
  rationale: ஒருவருக்குப் பகைவனாகக் கருதப்படுபவர் என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: γέγονα
  choice: ஆகிவிட்டேனா
  rationale: γίνομαι என்பதன் நிறைவுக்கால வடிவம், ஏற்பட்ட மாற்றமும் அதன் தற்போதைய விளைவும் தொடர்வதைச் சுட்டுகிறது; ‘ஆகிவிட்டேனா’ இந்த நுட்பத்தைப் பாதுகாக்கிறது.
- source_word: ἀληθεύων ὑμῖν
  choice: உங்களிடம் உண்மையைச் சொல்வதால்
  rationale: கலாத்தியரிடம் பவுல் உண்மையை எடுத்துரைத்ததையே சூழல் சுட்டுகிறது. காரணம் அல்லது வழிமுறையை உணர்த்தும் வினையெச்சத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ‘உண்மையாகப் பேசுதல்’ என்ற பரந்த நுட்பம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: பவுலின் வினாவில் ἀληθεύων என்பதன் பொருள்
  choice: கலாத்தியரிடம் உண்மையைச் சொன்னதால் தாம் அவர்களுடைய பகைவனாகிவிட்டாரா என்று பவுல் கேட்கிறார்.
  alternative: அவர்களிடம் பொதுவாக உண்மையாகப் பேசியதால் அல்லது உண்மையுடன் நடந்துகொண்டதால் தாம் பகைவனானாரா என்று கேட்கிறார்.
  rationale: உடனடி சூழல் பவுலின் நேரடியான கண்டிப்பையும் வேண்டுகோளையும் பற்றியது. ‘உண்மையைச் சொல்வதால்’ என்பது தொடர்பாடல் சார்ந்த பொருளைத் தெளிவாகக் காட்டுகிறது; கிரேக்க வினையின் பரந்த சாத்தியத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட சொல்லாக்கம் பயன்படுத்தப்பட்டுள்ளது. வாக்கியத்தின் வினாவுரையும், ஏற்பட்ட மாற்றத்தின் தற்போதைய விளைவைக் காட்டும் நிறைவுநிலையும் பாதுகாக்கப்பட்டுள்ளன.
