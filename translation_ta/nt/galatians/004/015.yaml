source:
  edition: SBLGNT
  text: ⸀ποῦ ⸀οὖν ὁ μακαρισμὸς ὑμῶν; μαρτυρῶ γὰρ ὑμῖν ὅτι εἰ δυνατὸν τοὺς ὀφθαλμοὺς ὑμῶν ⸀ἐξορύξαντες ἐδώκατέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/015.yaml
  text: Where then is your blessedness? For I testify to you that[a], if possible[b], you would have torn out your eyes and given them to me.
translation:
  language: ta
  text: 'அப்படியானால், உங்களுடைய அந்தப் பேறு[a] இப்போது எங்கே? ஏனெனில், நான் உங்களுக்குச் சான்றாகச் சொல்கிறேன்: முடிந்திருந்தால்[b], உங்கள் கண்களையே பிடுங்கி எனக்குக் கொடுத்திருப்பீர்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பேறு’ என்பதற்கான கிரேக்கச் சொல், பேறுபெற்ற நிலை அல்லது ஒருவரைப் பேறுபெற்றவர் என்று கருதுதல் அல்லது அறிவித்தல் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘கண்களைப் பிடுங்குதல்’ என்பது அவர்களுடைய முந்தைய ஆழ்ந்த அர்ப்பணிப்பைக் காட்டும் மிகைப்படுத்தலாக இருக்கலாம்; பவுலின் உடல்நிலையை இது மறைமுகமாகச் சுட்டுவதாகவும் சிலர் கருதுகின்றனர்.
    reason: interpretive_ambiguity
lexical_decisions:
- source_word: ποῦ οὖν
  choice: அப்படியானால் ... இப்போது எங்கே?
  rationale: οὖν என்பதன் முடிவுரை/தொடர்ச்சி வலிமையையும், முன்பு இருந்த மனநிலை இப்போது என்ன ஆனது என்று கேட்கும் சொல்லாட்சியையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: μακαρισμὸς ὑμῶν
  choice: உங்களுடைய அந்தப் பேறு
  rationale: μακαρισμός என்பது பேறுபெற்ற நிலை அல்லது அப்படிப் பேறுபெற்றதாகக் கருதுதல்/அறிவித்தல் ஆகியவற்றைக் குறிக்கலாம். ‘பேறு’ இந்தச் செறிவைத் தக்கவைக்கிறது; ‘அந்த’ என்பது அவர்கள் முன்பு அனுபவித்ததாகச் சூழல் காட்டும் நிலையைக் குறிக்கிறது.
- source_word: μαρτυρῶ γὰρ ὑμῖν
  choice: உங்களைப் பற்றி நான் சாட்சி கூறுகிறேன்
  rationale: இங்கு பவுல் கலாத்தியரின் முந்தைய அர்ப்பணிப்புக்கு ஆதரவாகச் சான்றளிக்கிறார். தமிழில் ‘உங்களைப் பற்றி ... சாட்சி கூறுகிறேன்’ என்பது அந்தச் சான்றுரைப் பொருளையும் வலியுறுத்தலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἰ δυνατὸν
  choice: முடிந்திருந்தால்
  rationale: கிரேக்கத்தின் சுருக்கமான நிபந்தனையைப் பாதுகாத்து, நிகழாத கடந்தகாலச் சாத்தியத்தைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: τοὺς ὀφθαλμοὺς ὑμῶν ἐξορύξαντες ἐδώκατέ μοι
  choice: உங்கள் கண்களையே பிடுங்கி எனக்குக் கொடுத்திருப்பீர்கள்
  rationale: ἐξορύσσω என்பதன் கடுமையான, காட்சிப்படுத்தும் பொருளை ‘பிடுங்கி’ தக்கவைக்கிறது. ‘கண்களையே’ என்பது அவர்களின் மிகுதியான அர்ப்பணிப்பைச் சுட்டும் வலியுறுத்தலை இயல்பாக அளிக்கிறது.
theological_decisions:
- issue: கண்களைப் பிடுங்கிக் கொடுப்பது நேரடி உடல்நிலைச் சுட்டுமா அல்லது மிகைப்படுத்தப்பட்ட அர்ப்பணிப்பின் மொழியா?
  choice: ‘உங்கள் கண்களையே பிடுங்கி எனக்குக் கொடுத்திருப்பீர்கள்’ என்ற நேரடியான உருவகத்தை முதன்மை உரையில் தக்கவைத்தல்.
  alternative: ‘எனக்காக எதையும் கொடுத்திருப்பீர்கள்’ என்று பொதுமைப்படுத்துதல்.
  rationale: கிரேக்கம் கண்களையும் அவற்றைப் பிடுங்குவதையும் வெளிப்படையாகக் குறிப்பிடுகிறது. இது மிகைப்படுத்தலாக இருக்கலாம்; பவுலின் உடல்நிலையைக் குறிக்கவும் கூடும். மொழிபெயர்ப்பு எந்த விளக்கத்தையும் முடிவாகத் திணிக்காமல் மூலத்தின் தெளிவான உருவகத்தையும் விளக்கத் திறப்பையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும்படியும் வேதவாக்கியத்துக்குரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘பேறு’ என்ற சுருக்கமான சொல் மூலத்தின் பொருள் விரிவைத் தக்கவைக்கிறது; கண்களைப் பற்றிய கடுமையான உருவகம் மென்மைப்படுத்தப்படவில்லை.
