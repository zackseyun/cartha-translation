  source_fidelity: மூல கிரேக்கத்தின் எதிர்மறைத் தொடர்பு (Ἀλλὰ), முந்தைய காலநிலை (τότε μὲν), கடவுளை அறியாத நிலை, δουλεύω-வின் அடிமைத்தன வலிமை, மற்றும் φύσει μὴ οὖσι θεοῖς என்பதின் ‘இயல்பிலேயே கடவுள்கள் அல்லாத’ இருப்பியல் மறுப்பு ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. ‘அவற்றுக்கு’ என்பது மூலத்தில் குறிப்பிடப்படாத குறிப்புப் பொருளின் தெளிவின்மையைப் பாதுகாக்கிறது.
