id: GAL.4.8
reference: Galatians 4:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἀλλὰ τότε μὲν οὐκ εἰδότες θεὸν ἐδουλεύσατε τοῖς ⸂φύσει μὴ⸃ οὖσι θεοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/008.yaml
  text: But at that time[a], when you did not know God, you were enslaved to those that by nature are not gods.
translation:
  language: ta
  text: ஆனால் அக்காலத்தில்[a], நீங்கள் கடவுளை அறியாதிருந்தபோது, இயல்பிலேயே கடவுள்கள் அல்லாதவற்றுக்கு அடிமைகளாக இருந்தீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆனால் முன்பு, கடவுளை அறியாதவர்களாய், உண்மையில் கடவுள்கள் அல்லாதவற்றுக்கு அடிமைகளாக இருந்தீர்கள்.”
    reason: τότε μὲν என்பதை ‘முன்பு’ என்றும், φύσει என்ற கருத்தை ‘உண்மையில்’ என்றும் இயல்பாக வெளிப்படுத்தக்கூடிய மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: Ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய கருத்துடன் உள்ள முரண்பாட்டை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: τότε μὲν
  choice: அக்காலத்தில்
  rationale: கலாத்தியர்களின் முந்தைய நிலையைக் குறிக்கும் காலப்பொருளையும், அடுத்த வசனத்தில் வரும் எதிர்மாற்றத்திற்கான μέν-இன் பங்கையும் காக்கிறது.
- source_word: οὐκ εἰδότες θεὸν
  choice: நீங்கள் கடவுளை அறியாதிருந்தபோது
  rationale: பங்கேற்பெச்சத்தின் காலச்சார்பைப் பொருத்தமாக வெளிப்படுத்துகிறது; இங்கு ‘அறிதல்’ என்பது உண்மைக் கடவுளுடனான உறவுசார் அறிவையும் உள்ளடக்கக்கூடியதாகவே விடப்படுகிறது.
- source_word: θεὸν
  choice: கடவுள்
  rationale: பின்னர் வரும் பன்மை ‘கடவுள்கள்’ என்பதற்கு மாறாக, ஒரே உண்மைக் கடவுளைக் குறிக்கும் இயல்பான பொதுத்தமிழ்ச் சொல்.
- source_word: ἐδουλεύσατε
  choice: அடிமைகளாக இருந்தீர்கள்
  rationale: δουλεύω என்பதிலுள்ள அடிமைத்தனப் பொருளைக் காக்கிறது; ‘சேவை செய்தீர்கள்’ என்று மட்டும் மொழிபெயர்ப்பதால் கலாத்தியரில் முக்கியமான அடிமைத்தனம்–விடுதலை எதிர்நிலை மங்கிவிடும்.
- source_word: τοῖς ... οὖσι θεοῖς
  choice: '... கடவுள்கள் அல்லாதவற்றுக்கு'
  rationale: மூலத்தில் குறிப்பிடப்படாத ‘சிலைகள்’ அல்லது ‘பேய்கள்’ போன்ற அடையாளங்களைச் சேர்க்காமல், உயிருள்ளவையா உயிரற்றவையா என்ற தெளிவின்மையை ‘அவற்றுக்கு’ என்பதன் மூலம் காக்கிறது.
- source_word: φύσει μὴ
  choice: இயல்பிலேயே ... அல்லாத
  rationale: அவை வெறும் பெயரளவில் அல்ல, அவற்றின் உண்மை இயல்பின்படியே கடவுள்கள் அல்ல என்பதைக் குறிக்கிறது.
- source_word: θεοῖς
  choice: கடவுள்கள்
  rationale: மூலத்தின் நேரடியான பன்மைச் சொல்லையும், ‘கடவுள்’ என்பதுடனான முரண்பாட்டையும் காக்கிறது.
theological_decisions:
- issue: முன்பு வணங்கப்பட்டவற்றின் இயல்பு
  choice: ‘இயல்பிலேயே கடவுள்கள் அல்லாதவை’ என்று பவுலின் இருப்பியல் மறுப்பு நேரடியாக மொழிபெயர்க்கப்படுகிறது.
  alternative: ‘உண்மையில் கடவுள்கள் அல்லாதவை’ அல்லது ‘பொய்யாகக் கடவுள்கள் எனப்படுபவை’
  rationale: φύσει μὴ οὖσι θεοῖς என்பது அவை உண்மையில் என்னவாக இருக்கின்றன என்பதைப் பேசுகிறது. அவை சிலைகளா அல்லது தீய ஆவிக்குரிய வல்லமைகளா என்பதை பவுல் இங்கு குறிப்பிடாததால், மொழிபெயர்ப்பும் அதைத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அடிமைகளாக இருந்தீர்கள்’ என்பது சற்றே கடினமான அடிமைத்தனப் பொருளைத் திட்டமிட்டு காக்கிறது; ‘அவற்றுக்கு’ என்பது மூலத்தின் குறிப்பிடப்படாத பொருட்கள் அல்லது உயிர்கள் குறித்த தெளிவின்மையைப் பாதுகாக்கிறது.
