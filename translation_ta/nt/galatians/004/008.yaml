  terminology: ‘கடவுள்’ / ‘கடவுள்கள்’ என்ற ஒருமை–பன்மை வேறுபாடும், ‘அடிமைகளாக’ என்ற சொல்லின் கலாத்தியர் நூலுக்குரிய அடிமைத்தனம்–விடுதலைப் பின்னணியும் நன்றாகப் பேணப்பட்டுள்ளன. எந்தக் குறிப்பிட்ட அடையாளத்தையும்—சிலைகள் அல்லது ஆவிக்குரிய வல்லமைகள் போன்றவற்றை—உரையில் சேர்க்கவில்லை.
