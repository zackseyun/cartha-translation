reference: Galatians 4:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Γίνεσθε ὡς ἐγώ, ὅτι κἀγὼ ὡς ὑμεῖς, ἀδελφοί, δέομαι ὑμῶν. οὐδέν με ἠδικήσατε·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/012.yaml
  text: Become as I am[a], because I also am as you are, brothers; I beg you[c][b], you did me no wrong.
translation:
  language: ta
  text: 'சகோதரர்களே,[b] என்னைப் போல ஆகுங்கள்; ஏனெனில் நானும் உங்களைப் போல ஆனேன்.[c] உங்களை வேண்டிக்கொள்கிறேன்: நீங்கள் எனக்கு எந்தத் தீங்கும் செய்யவில்லை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘சகோதரர்களே’ என்பது இங்கு விசுவாசக் குழுவினர் அனைவரையும் அழைக்கிறது; பெண்களும் இதில் உட்பட்டிருக்கலாம்.
    reason: cultural_note
  - marker: c
    text: அல்லது, “நானும் உங்களைப் போல இருக்கிறேன்.” கிரேக்கத்தில் இத்தொடரில் வினைச்சொல் வெளிப்படையாக இல்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: Γίνεσθε
  choice: ஆகுங்கள்
  rationale: γίνομαι என்பதன் நிகழ்கால கட்டளை வடிவம்; வெறுமனே ஒரு நிலையில் ‘இருங்கள்’ என்பதற்குப் பதிலாக, அந்த நிலையை ஏற்றுக்கொள்ளுமாறு அழைப்பதை ‘ஆகுங்கள்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὡς ἐγώ
  choice: என்னைப் போல
  rationale: ὡς உடன் ἐγώ ஒப்புமையைக் குறிக்கிறது. தமிழில் ‘என்னைப் போல’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: இங்கு ὅτι வேண்டுகோளுக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: κἀγὼ ὡς ὑμεῖς
  choice: நானும் உங்களைப் போல ஆனேன்
  rationale: கிரேக்கத்தில் வினைச்சொல் வெளிப்படையாக மீண்டும் வரவில்லை. முன் வரும் Γίνεσθε என்பதிலிருந்து ‘ஆனேன்’ என்பதை நிரப்புவது, பவுல் கலாத்தியர்களோடு தன்னை இணைத்துக்கொண்ட சூழலை இயல்பான தமிழில் எடுத்துரைக்கிறது; எனினும் ‘இருக்கிறேன்’ என்பதும் இலக்கண ரீதியாகச் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: ஆண்பால் பன்மை அழைப்புவடிவத்தை நேரடியாகப் பிரதிபலிக்கிறது; அது விசுவாசக் குழுவின் பெண்களையும் உள்ளடக்கியிருக்கலாம் என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: δέομαι ὑμῶν
  choice: உங்களை வேண்டிக்கொள்கிறேன்
  rationale: δέομαι என்பதிலுள்ள உருக்கமான வேண்டுகோளை, மிகைப்படுத்தாமலும் பழமையான நடையின்றியும் வெளிப்படுத்துகிறது.
- source_word: οὐδέν με ἠδικήσατε
  choice: நீங்கள் எனக்கு எந்தத் தீங்கும் செய்யவில்லை
  rationale: οὐδέν உடன் ἀδικέω தரும் ‘எந்த வகையிலும் எனக்குத் தீங்கு செய்யவில்லை’ என்ற பொருளை இயல்பான தமிழில் நேரடியாகத் தருகிறது.
theological_decisions:
- issue: கலாத்தியச் சபைகளுக்கான அழைப்பில் ἀδελφοί என்பதன் உள்ளடக்கும் வலிமை
  choice: மூலத்தின் ஆண்பால் பன்மை வடிவத்தை ‘சகோதரர்களே’ என்று முதன்மை உரையில் வைத்து, பெண்களும் உட்பட முழு விசுவாசக் குழுவையும் இது குறிக்கலாம் என்பதை அடிக்குறிப்பில் விளக்குதல்
  alternative: சகோதர சகோதரிகளே
  rationale: மூல இலக்கண வடிவத்தைப் பாதுகாப்பதோடு, வரலாற்றுச் சூழலில் அதன் சாத்தியமான உள்ளடக்கும் பயன்பாட்டையும் மறைக்காமல் காட்டுகிறது.
- issue: κἀγὼ ὡς ὑμεῖς என்ற வினையற்ற தொடரின் பொருள்
  choice: ‘நானும் உங்களைப் போல ஆனேன்’ என்று சூழலிலிருந்து வினையை நிரப்புதல்
  alternative: ‘நானும் உங்களைப் போல இருக்கிறேன்’
  rationale: முன் வரும் Γίνεσθε-இலிருந்து ‘ஆகுதல்’ என்ற எண்ணத்தை எடுத்துக்கொள்வது சூழலுக்கு ஏற்றது; ஆனால் கிரேக்கத்தின் சுருக்கமான அமைப்பு நிகழ்நிலை வாசிப்புக்கும் இடமளிப்பதால் மாற்று அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, கண்ணியமான மற்றும் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை. கிரேக்க வாக்கியத்தின் உருக்கமான நேரடி அழைப்பு பாதுகாக்கப்பட்டுள்ளது. ‘என்னைப் போல’ தமிழில் இயல்பானதால் தனி lexical-alternative அடிக்குறிப்பு தேவையில்லை; பயன்படுத்தப்பட்ட அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
