    issue: “வேதவசனம்” is less precise than “வேதாகமம்” for ἡ γραφή.
    rationale: The Greek citation formula refers to Scripture as an authoritative body/text, not specifically to a single ‘Scripture verse’ or utterance.
  - severity: medium
    issue: “சொத்துரிமை பெறமாட்டான்” can narrow κληρονομήσει to property rights.
    rationale: The Greek verb means ‘inherit’; “வாரிசுரிமை பெறமாட்டான்” preserves the familial-heir sense while remaining natural Tamil.
