  text: ἀλλὰ τί λέγει ἡ γραφή; Ἔκβαλε τὴν παιδίσκην καὶ τὸν υἱὸν αὐτῆς, οὐ γὰρ μὴ ⸀κληρονομήσει ὁ υἱὸς τῆς παιδίσκης μετὰ τοῦ υἱοῦ τῆς ἐλευθέρας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/030.yaml
  text: But what does the Scripture say? “Cast out the servant woman and her son[c][b][a], for the son of the servant woman will certainly not inherit with the son of the free woman.”
translation:
  language: ta
  text: ஆனால் வேதாகமம் என்ன சொல்கிறது? “அடிமைப் பெண்ணையும் அவளுடைய மகனையும் துரத்திவிடு; ஏனெனில் அடிமைப் பெண்ணின் மகன் சுதந்திரப் பெண்ணின் மகனோடு நிச்சயமாக வாரிசுரிமை பெறமாட்டான்.”[b][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த மேற்கோள் ஆதியாகமம் 21:10-ஐ எதிரொலிக்கிறது.
    reason: cross_reference
  - marker: b
    text: “நிச்சயமாக ... பெறமாட்டான்” என்பது கிரேக்கத்தில் உள்ள வலியுறுத்தப்பட்ட மறுப்பைக் காட்டுகிறது; “எவ்விதத்திலும் வாரிசுரிமை பெறமாட்டான்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய வாதத்திலிருந்து மாறுபாட்டைக் குறிக்கும் இயல்பான தமிழ் இணைப்புச்சொல்.
- source_word: τί λέγει ἡ γραφή
  choice: வேதவசனம் என்ன சொல்கிறது?
  rationale: நிகழ்கால வினையையும் அதிகாரப்பூர்வமான எழுத்துச் சாட்சியை ஆளுருவப்படுத்தும் மேற்கோள் முறையையும் காக்கிறது.
- source_word: Ἔκβαλε
  choice: துரத்திவிடு
  rationale: ἐκβάλλω என்பதிலுள்ள வலுவான வெளியேற்றும் கட்டளையை, மென்மையான ‘அனுப்பிவிடு’ என்பதைவிடத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: παιδίσκην
  choice: அடிமைப் பெண்
  rationale: சூழலில் அடிமைத்தனம்–சுதந்திரம் என்ற மைய எதிர்மறையைத் தெளிவாகக் காக்கிறது; வெறும் ‘வேலைக்காரி’ என்பது சட்ட/சமூக நிலையைக் குறைத்துக் காட்டக்கூடும்.
- source_word: υἱὸν αὐτῆς
  choice: அவளுடைய மகன்
  rationale: கிரேக்கத்தின் நேரடியான உடைமைத் தொடர்பை இயல்பான தமிழில் தருகிறது.
- source_word: οὐ γὰρ μὴ κληρονομήσει
  choice: நிச்சயமாகச் சொத்துரிமை பெறமாட்டான்
  rationale: οὐ μή உடன் வரும் எதிர்கால வினையின் வலியுறுத்தப்பட்ட மறுப்பைத் தற்காலத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: κληρονομήσει
  choice: சொத்துரிமை பெறுவான்
  rationale: குடும்ப மற்றும் வாரிசுரிமைச் சூழலில் ‘inherit’ என்பதன் பொருளை சாதாரண வாசகருக்குத் தெளிவுபடுத்துகிறது.
- source_word: μετὰ τοῦ υἱοῦ τῆς ἐλευθέρας
  choice: சுதந்திரப் பெண்ணின் மகனோடு
  rationale: μετά இங்குக் குறிக்கும் இணைந்த வாரிசுரிமையைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பவுலின் ஆகார்–சாராள் உருவகத்தில் παιδίσκη என்பதன் மொழிபெயர்ப்பு
  choice: அடிமைப் பெண்
  alternative: வேலைக்காரப் பெண் / பணிப்பெண்
  rationale: சுற்றியுள்ள வாதத்தின் இறையியல் அழுத்தம் அடிமைத்தனத்திற்கும் சுதந்திரத்திற்கும் இடையிலான எதிர்மறையில் உள்ளது. ‘அடிமைப் பெண்’ என்பது அந்த நிலையை மறைக்காமல் காக்கிறது.
- issue: οὐ γὰρ μὴ κληρονομήσει என்பதிலுள்ள மறுப்பின் வலிமை
  choice: நிச்சயமாகச் சொத்துரிமை பெறமாட்டான்
  alternative: ஒருபோதும் சொத்துரிமை பெறமாட்டான் / எவ்விதத்திலும் வாரிசாக மாட்டான்
  rationale: மேற்கோளில் உள்ள திட்டவட்டமான விலக்கைத் தக்கவைக்கிறது; வசனம் கூறுவதைத் தாண்டி இறையியல் விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் வேதவசனத்திற்குரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘அடிமைப் பெண்/சுதந்திரப் பெண்’ என்ற இணைச்சொற்கள் மூலத்தின் மைய எதிர்மறையைத் தெளிவாகக் காக்கின்றன. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
