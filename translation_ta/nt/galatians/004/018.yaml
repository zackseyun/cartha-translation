  text: καλὸν ⸀δὲ ζηλοῦσθαι ἐν καλῷ πάντοτε, καὶ μὴ μόνον ἐν τῷ παρεῖναί με πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/018.yaml
  text: But it is good to be sought eagerly for a good purpose at all times[b][a], and not only when I am present with you.
translation:
  language: ta
  text: ஆனால், நல்ல நோக்கத்திற்காக எப்போதும் உங்களை ஆர்வமுடன் நாடுவது நல்லதே[b][a]; நான் உங்களோடு இருக்கும்போது மட்டும் அல்ல.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆர்வமாயிருப்பது” / “ஆர்வம் காட்டுவது.” ζηλοῦσθαι என்ற கிரேக்க வினை வடிவத்தை வெவ்வேறு விதமாகப் புரிந்துகொள்ளலாம். ஆனால் முந்தைய வசனத்தில் மற்றவர்கள் கலாத்தியரை நாடுவதுடன் உள்ள நேரடியான தொடர்பால், செயப்பாட்டுப் பொருள் இங்கு நன்கு பொருந்துகிறது.
    reason: alternative_reading
  - marker: b
    text: சொல்லுக்குச் சொல், “நல்ல ஒன்றில்.” இது நல்ல உள்நோக்கத்துடன் அல்லது நல்ல நோக்கத்திற்காக என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: நல்லது
  rationale: வினையெச்சத்துடன் பயனிலையாக வரும் பெயரடை; தமிழில் இயல்பாக ‘நல்லது’ என வழங்கப்படுகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட தவறான நோக்கத்துடனான ஆர்வத்திற்கு மாறான கருத்தை அறிமுகப்படுத்துகிறது.
- source_word: ζηλοῦσθαι
  choice: உங்களை ஆர்வத்துடன் நாடுவது
  rationale: இது நிகழ்காலச் செயப்பாட்டு வினையெச்சம். முந்தைய வசனத்தில் மற்றவர்கள் கலாத்தியரை ஆர்வத்துடன் நாடியதற்கு இணையான நேர்மறை எதிர்மறையை இவ்வாறு காக்கிறது; தமிழில் மறைமுகச் செயப்பாட்டைவிட இவ்வடிவம் இயல்பானது.
- source_word: ἐν καλῷ
  choice: நல்ல நோக்கத்திற்காக
  rationale: சொல்லுக்குச் சொல் ‘நல்ல ஒன்றில்’ என்றாலும், சூழலில் நாடுதலின் நல்வகை நோக்கத்தைச் சுட்டுவது இயல்பான பொருள்.
- source_word: πάντοτε
  choice: எப்போதும்
  rationale: பின்வரும் ‘மட்டும்’ என்ற கால வரம்புக்கு நேரான எதிரிணையாக உள்ளது.
- source_word: καὶ μὴ μόνον
  choice: மட்டும் ... நல்லதல்ல
  rationale: கிரேக்கத்தில் உள்ள ‘அது மட்டுமல்ல’ என்ற வரம்பைத் தமிழில் முழு வாக்கியமாக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν τῷ παρεῖναί με πρὸς ὑμᾶς
  choice: நான் உங்களோடு இருக்கும்போது
  rationale: ἐν உடன் வரும் பெயராக்கப்பட்ட வினையெச்சம் காலத்தைக் குறிக்கிறது; தமிழில் தெளிவான, இயல்பான வடிவம்.
theological_decisions:
- issue: ζηλοῦσθαι என்பதன் வினைக்குரலும் மறைபொருள் எழுவாயும்
  choice: 'செயப்பாட்டுப் பொருள்: மற்றவர்கள் கலாத்தியரை ஆர்வத்துடன் நாடுதல்'
  alternative: ‘ஆர்வமாயிருப்பது’ அல்லது ‘ஆர்வம் காட்டுவது’ என்ற இடை/செய்வினைப் பொருள்
  rationale: 17–18ஆம் வசனங்களில் ζηλόω சொல் தொடர்ச்சியாக வருவதாலும், 17ஆம் வசனத்தில் பிறர் கலாத்தியரைத் தவறான நோக்கத்துடன் நாடுவது கூறப்படுவதாலும், இங்கு நல்ல நோக்கத்துடன் நாடப்படுவதைச் சுட்டும் செயப்பாட்டுப் பொருள் உடனடிச் சூழலுக்கு மிகவும் பொருந்துகிறது. இருப்பினும் இலக்கண மாற்றுப் புரிதல் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. கிரேக்கச் செயப்பாட்டைத் தமிழில் இயல்பாக்க ‘உங்களை ஆர்வத்துடன் நாடுவது’ எனச் செய்பவரைக் குறிப்பிடாத பொதுவான செய்வினை அமைப்பு பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் ஆங்கில ஆலோசனை அடுக்கின் வரிசைப்படி [b][a] என முதன்மை உரையில் வைக்கப்பட்டுள்ளன.
