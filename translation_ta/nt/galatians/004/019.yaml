  text: My children[a], for whom I am again suffering birth pains until Messiah is formed in you[c][b],
translation:
  language: ta
  text: என் பிள்ளைகளே, மேசியா[a] உங்களில்[b] உருவாகும்வரை, உங்களுக்காக நான் மீண்டும் பிரசவ வேதனையை அனுபவிக்கிறேன்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கிறிஸ்து.’ Χριστός என்ற பட்டப்பெயர் இங்கு ‘மேசியா’ என்று மொழிபெயர்க்கப்பட்டுள்ளது; ‘கிறிஸ்து’ என்பது பரிச்சயமான மாற்று வடிவம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘உங்கள் நடுவில்’; இவ்வாறு எடுத்தால் சமூகமாகிய அவர்களிடையே உருவாகுதல் என்ற பொருள் வலுப்பெறும்.
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்குச் சொல், ‘நான் மீண்டும் பேறுகால வேதனையில் இருக்கிறேன்’ அல்லது ‘நான் மீண்டும் பிரசவ வேதனையை அனுபவிக்கிறேன்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνα μου
  choice: என் பிள்ளைகளே
  rationale: அன்பும் நெருக்கமும் கொண்ட நேரடி அழைப்பை இயல்பான நவீனத் தமிழில் தருகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘சிறு’ என்ற பொருளைச் சேர்க்கவில்லை.
- source_word: οὓς
  choice: உங்களுக்காக
  rationale: ὠδίνω என்ற பிரசவ உருவகத்துடன் தொடர்புடைய ஆட்களைக் குறிக்கும் உறவைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: செயல் மறுபடியும் நிகழ்வதை நேரடியாகக் குறிக்கிறது.
- source_word: ὠδίνω
  choice: பிரசவ வேதனைப்படுகிறேன்
  rationale: பவுல் பயன்படுத்தும் தாய்மையுள்ள பிரசவ உருவகத்தின் தீவிரத்தையும் வேதனையையும் பாதுகாக்கிறது.
- source_word: μέχρις οὗ
  choice: உருவாகும்வரை
  rationale: செயல் நீடிக்கும் கால எல்லையையும் நோக்கையும் தமிழில் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: μορφωθῇ
  choice: உருவாகும்
  rationale: மேசியா அவர்களில் வடிவம் பெறுவதைச் சுட்டும் passive கருத்தைத் தமிழின் இயல்பான அமைப்பில் பாதுகாக்கிறது; அதை ஒரு குறிப்பிட்ட கோட்பாட்டு விளக்கமாக விரித்துரைக்கவில்லை.
- source_word: Χριστὸς
  choice: மேசியா
  rationale: Χριστός இங்கு அபிஷேகம் பெற்றவர் என்ற பட்டப்பெயரின் பொருளைத் தக்கவைக்கிறது; பரிச்சயமான ‘கிறிஸ்து’ மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐν ὑμῖν
  choice: உங்களில்
  rationale: ἐν என்பதன் முதன்மையான ‘உள்ளே/இல்’ பொருளையும், பன்மைச் சுட்டின் தனிநபர் மற்றும் சமூக நுணுக்கங்களையும் திறந்தவாறு வைத்திருக்கிறது.
theological_decisions:
- issue: ‘மேசியா உங்களில் உருவாகுதல்’ என்பதன் பொருள்
  choice: மேசியா விசுவாசிகளுக்குள் உருவாகுதல் என்ற பவுலின் உருவகம் அப்படியே வைக்கப்படுகிறது.
  alternative: மேசியா ஒரு சமூகமாகிய அவர்களிடையே உருவாகுதல்; அல்லது இதை மனமாற்றம்/புதிய பிறப்புக்கான குறிப்பிட்ட தொழில்நுட்பச் சொல்லாக விளக்குதல்.
  rationale: கிரேக்கப் பன்மை தனிநபர் உள்ளார்ந்த மாற்றத்தையும் சமூகப் பரிமாணத்தையும் அனுமதிக்கிறது. வசனம் தானாகக் குறிப்பிடாத கோட்பாட்டு செயல்முறையை மொழிபெயர்ப்பு நிர்ணயிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் உணர்ச்சி வலிமையும் கொண்ட மேய்ப்புப் பாணி பயன்படுத்தப்பட்டுள்ளது. ‘பிரசவ வேதனை’ என்ற தெளிவான சொற்றொடர் மூலத்தின் தாய்மை உருவகத்தை மறைக்காமல் சாதாரண வாசகருக்கும் புரியுமாறு தருகிறது.
