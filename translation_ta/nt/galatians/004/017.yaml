base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/017.yaml
  text: They are zealous for you[a], but not in a good way. Rather, they want to shut you out[b], so that you may be zealous for them.
translation:
  language: ta
  text: அவர்கள் உங்கள்மீது மிகுந்த ஆர்வம் காட்டுகிறார்கள்[a]; ஆனால் நல்ல விதத்தில் அல்ல. மாறாக, நீங்கள் அவர்கள்மீது மிகுந்த ஆர்வம் காட்டும்படி உங்களை விலக்கிவிட விரும்புகிறார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்கள் உங்களைத் தீவிரமாக நாடுகிறார்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் தீவிர ஆர்வம் காட்டுதல் அல்லது ஒருவரைத் தம் பக்கம் ஈர்க்க நாடுதல் என்ற பொருள்களையும் தரலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘உங்களை ஒதுக்கிவிட’ என்றும் மொழிபெயர்க்கலாம். யாரிடமிருந்து அல்லது எதிலிருந்து விலக்குவது என்பதை கிரேக்க வாக்கியம் வெளிப்படையாகக் கூறவில்லை; சூழலில், உங்களைப் பவுலிடமிருந்தும் அவருடன் இருந்தவர்களிடமிருந்தும் பிரித்து, தங்களை நாடச் செய்வதே நோக்கமாக இருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ζηλοῦσιν / ζηλοῦτε (ζηλόω)
  choice: மிகுந்த ஆர்வம் காட்டுகிறார்கள் / மிகுந்த ஆர்வம் காட்டவேண்டும்
  rationale: இந்த வினைச்சொல் தீவிர அக்கறை, ஆவல், ஒருவரைத் தம் பக்கம் ஈர்க்க முயலுதல் ஆகிய பொருள்களைத் தரலாம். இரு இடங்களிலும் ஒரே சொற்றொடரைப் பயன்படுத்துவது கிரேக்க மூலத்திலுள்ள சொல்லிசை ஒற்றுமையையும் எதிரிகளின் சுயநல நோக்கையும் காக்கிறது; காதல் சார்ந்த பொருளைத் தேவையின்றி புகுத்துவதில்லை.
- source_word: οὐ καλῶς
  choice: நல்ல நோக்கத்தோடு அல்ல
  rationale: இங்கு எதிரிகளின் ஆர்வம் தோற்றத்தில் நன்மையாகத் தெரிந்தாலும் அதன் நோக்கம் முறையானதல்ல என்பதே சூழலின் வலியுறுத்தல். இயல்பான தமிழில் அந்த ஒழுக்க மதிப்பீட்டைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: ἀλλὰ
  choice: மாறாக
  rationale: முந்தைய கூற்றைத் திருத்தி, அவர்களின் உண்மையான நோக்கத்தை விளக்கும் வலுவான எதிர்மறை இணைப்பை வெளிப்படுத்துகிறது.
- source_word: ἐκκλεῖσαι
  choice: விலக்கிவிட
  rationale: ἐκκλείω என்பதன் ‘வெளியே வைத்தல்/விலக்குதல்’ என்ற கருத்தை இயல்பான தமிழில் தருகிறது. யாரிடமிருந்து அல்லது எதிலிருந்து விலக்குவது என்பதை மூலவாக்கியம் வெளிப்படையாகக் கூறாததால் மொழிபெயர்ப்பும் அதை நிர்ணயிக்கவில்லை.
- source_word: θέλουσιν
  choice: விரும்புகிறார்கள்
  rationale: விருப்பத்தையும் திட்டமிட்ட நோக்கத்தையும் குறிக்கும் பொதுவான, இயல்பான தமிழ் வினைச்சொல்.
- source_word: ἵνα
  choice: என்பதற்காக
  rationale: அவர்கள் விலக்க முயல்வதன் நோக்கத்தைத் தெளிவாகக் குறிக்கிறது.
theological_decisions:
- issue: ἐκκλεῖσαι ὑμᾶς என்பதில் கலாத்தியர்கள் யாரிடமிருந்து அல்லது எதிலிருந்து விலக்கப்படுகிறார்கள்?
  choice: முதன்மை உரையில் ‘உங்களை விலக்கிவிட’ என்று மட்டும் கூறி, அதன் இலக்கைத் திறந்த நிலையில் வைத்தல்
  alternative: ‘பவுலிடமிருந்தும் அவருடைய கூட்டத்தாரிடமிருந்தும் உங்களைப் பிரித்துவிட’ அல்லது ‘திருச்சபையிலிருந்து உங்களை விலக்கிவிட’ என்று வெளிப்படையாகக் கூறுதல்
  rationale: உடனடிச் சூழல் பவுலுக்கும் கலாத்தியர்களுக்கும் இடையிலான உறவையும் போட்டிப் போதகர்களின் செல்வாக்கையும் சுட்டுகிறது. இருந்தாலும் கிரேக்க வாக்கியம் விலக்கப்படுகிற இடத்தையோ நபரையோ குறிப்பிடவில்லை. ஆகவே ஒரு குறிப்பிட்ட திருச்சபை அல்லது இரட்சிப்பியல் விளக்கத்தை முதன்மை உரையில் சேர்க்காமல், சாத்தியமான உறவுசார் பொருளை அடிக்குறிப்பில் குறிப்பிடுவது பொருத்தமானது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘மிகுந்த ஆர்வம் காட்டுதல்’ என்ற சொற்றொடர் சாதாரண வாசகர்களுக்குப் புரியக்கூடியதாக இருப்பதோடு, ζηλόω இருமுறை வருவதிலுள்ள சொல்லிசை ஒற்றுமையையும் காக்கிறது. மூலத்தில் வெளிப்படையாக இல்லாத விலக்கலின் இலக்கு முதன்மை உரையில் சேர்க்கப்படவில்லை.
