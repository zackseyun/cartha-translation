review_pass:
  verdict: revise
  source_fidelity: The draft preserves the repeated ζηλόω terminology and appropriately leaves the unstated object of ἐκκλεῖσαι unspecified in the main text. However, ‘நல்ல நோக்கத்தோடு அல்ல’ restricts οὐ καλῶς to motive, whereas the Greek more broadly evaluates the manner/quality as not good or not right. More significantly, ‘காட்டவேண்டும்’ introduces obligation (‘must show’) where the ἵνα purpose clause expresses the opponents’ intended result.
  naturalness: The Tamil is generally clear and modern. ‘நல்ல விதத்தில் அல்ல’ naturally conveys the broad evaluative force, and ‘காட்டும்படி’ accurately and idiomatically expresses intended purpose without adding a command.
  terminology: ‘மிகுந்த ஆர்வம் காட்டுகிறார்கள் / மிகுந்த ஆர்வம் காட்ட’ retains the rhetorical correspondence of the two occurrences of ζηλόω. ‘விலக்கிவிட’ is a suitable rendering of ἐκκλεῖσαι and preserves the source ambiguity.
  issues:
  - severity: medium
    issue: ‘நல்ல நோக்கத்தோடு அல்ல’ is narrower than οὐ καλῶς.
    rationale: The Greek does not specify only their motive; it characterizes their zeal as not good/right in a broader sense. ‘நல்ல விதத்தில் அல்ல’ preserves that breadth.
  - severity: high
    issue: ‘நீங்கள் அவர்கள்மீது மிகுந்த ஆர்வம் காட்டவேண்டும்’ adds deontic force.
    rationale: The Greek ἵνα αὐτοὺς ζηλοῦτε states the rivals’ purpose—so that the Galatians may/become eager for them—not that the Galatians ought to be eager for them. ‘காட்டும்படி’ retains the purposive sense.
