id: GAL.4.20
reference: Galatians 4:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἤθελον δὲ παρεῖναι πρὸς ὑμᾶς ἄρτι, καὶ ἀλλάξαι τὴν φωνήν μου, ὅτι ἀποροῦμαι ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/020.yaml
  text: But I wish I could be with you right now and change my tone[a], because I am perplexed about you.
translation:
  language: ta
  text: ஆனால், இப்போதே உங்களோடு இருக்கவும், என் பேசும் தொனியை மாற்றவும் விரும்புகிறேன்[a]; ஏனெனில், உங்களைக் குறித்து நான் குழப்பமடைந்திருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் குரலை மாற்றவும்.” கிரேக்கத்தில் நேரடியாக, “என் குரலை மாற்றவும்” என்று உள்ளது; இங்கு அது பவுலின் பேசும் தொனியை அல்லது முறையைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤθελον
  choice: விரும்புகிறேன்
  rationale: இறந்தகால வடிவம் இங்கு நிறைவேறாத தற்போதைய விருப்பத்தை மென்மையாக வெளிப்படுத்துகிறது; தமிழில் இயல்பாக தற்போதைய விருப்பமாக மொழிபெயர்க்கப்படுகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வேண்டுகோளுக்கும் இப்போதைய தனிப்பட்ட விருப்பத்திற்கும் இடையிலான மென்மையான மாறுபாட்டைக் காட்டுகிறது.
- source_word: παρεῖναι πρὸς ὑμᾶς
  choice: உங்களோடு இருக்கவும்
  rationale: கலாத்தியரிடம் நேரில் உடனிருப்பதைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: ἄρτι
  choice: இப்போதே
  rationale: உடனடித் தன்மையையும் பவுலின் அவசரமான விருப்பத்தையும் வெளிப்படுத்துகிறது.
- source_word: ἀλλάξαι τὴν φωνήν μου
  choice: என் பேசும் தொனியை மாற்றவும்
  rationale: φωνή என்பதன் நேரடிப் பொருள் ‘குரல்’ என்றாலும், இச்சூழலில் பேசும் முறை அல்லது தொனியைக் குறிக்கிறது; ‘பேசும் தொனி’ என்பது பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: பவுலின் விருப்பத்திற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: ἀποροῦμαι
  choice: என்ன செய்வதென்று தெரியாமல் தவிக்கிறேன்
  rationale: வழியறியாமை, குழப்பம், மனக்கலக்கம் ஆகியவற்றை உள்ளடக்கும் வினையின் வலிமையை இயல்பான தமிழில் தெரிவிக்கிறது; வெறும் அறிவுசார் சந்தேகமாகக் குறுக்கவில்லை.
- source_word: ἐν ὑμῖν
  choice: உங்களைக் குறித்து
  rationale: இங்கு ἐν என்பது கலாத்தியரைப் பற்றிய அல்லது அவர்களுடன் தொடர்புடைய பவுலின் குழப்பத்தைக் குறிக்கிறது; நேரடியான ‘உங்களில்’ என்பது தமிழில் தவறாகப் புரியக்கூடும்.
theological_decisions:
- issue: φωνή என்பதன் சூழல்சார் பொருள்
  choice: பவுல் தன் பேசும் தொனி அல்லது முறையை மாற்ற விரும்புகிறார்.
  alternative: பவுல் தன் உடல்சார் குரலொலியை மாற்ற விரும்புகிறார்.
  rationale: சூழல் மேய்ப்புப்பணி சார்ந்த கண்டிப்பும் அக்கறையும் பற்றியது; ஆகவே நேரில் இருந்தால் அவர்களை அணுகும் தொனியை மாற்ற முடியும் என்பதே இயல்பான பொருள். நேரடிப் பொருளை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: ἀποροῦμαι என்பதன் உணர்வளவு
  choice: அவர்களைக் குறித்து என்ன செய்வதென்று தெரியாமல் பவுல் தவிக்கிறார்.
  alternative: அவர்களைப் பற்றி பவுலுக்குச் சந்தேகம் உள்ளது.
  rationale: கிரேக்க வினை வெறும் சந்தேகத்தைவிட வழியறியாத குழப்பத்தையும் மனக்கலக்கத்தையும் உணர்த்துகிறது; இருப்பினும் அவர்களின் இறுதி நிலை குறித்து ஒரு கோட்பாட்டுத் தீர்ப்பை மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் பவுலின் அக்கறை கலந்த மனக்கலக்கத்தைத் தக்கவைத்தும் அமைக்கப்பட்டது. ‘என் பேசும் தொனி’ என்பது இயல்பான தமிழையும் கிரேக்கச் சொல்லின் உருவகப் பயன்பாட்டையும் சமநிலைப்படுத்துகிறது; நேரடிப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
