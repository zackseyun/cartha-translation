language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὥστε οὐκέτι εἶ δοῦλος ἀλλὰ υἱός· εἰ δὲ υἱός, καὶ κληρονόμος ⸂διὰ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/007.yaml
  text: So you are no longer a servant but a son[a]; and if a son[b], then also an heir through God.
translation:
  language: ta
  text: ஆகவே, நீ இனி அடிமை அல்ல, ஆனால் மகன்[a]; மகனாக இருந்தால், கடவுளின் மூலமாக வாரிசும் ஆவாய்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பிள்ளை.” கிரேக்கத்தில் “மகன்” என்று உள்ளது. இப்பகுதியின் தத்தெடுப்பு மற்றும் வாரிசுரிமை சார்ந்த கருத்தை அது பாதுகாக்கிறது; எனினும் பவுல் இந்த நிலையை எல்லா விசுவாசிகளுக்கும் பொருந்தச் செய்கிறார்.
    reason: lexical_alternative
  - marker: b
    text: சில கையெழுத்துப் பிரதிகளில், “கிறிஸ்துவின் மூலமாகக் கடவுளின் வாரிசு” (அல்லது, “மேசியாவின் மூலமாகக் கடவுளின் வாரிசு”) என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: ὥστε
  choice: ஆகவே
  rationale: முந்தைய வாதத்திலிருந்து வரும் முடிவை இயல்பான தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: οὐκέτι εἶ
  choice: நீ இனி ... அல்ல
  rationale: இரண்டாம் நபர் ஒருமையையும் மாறிவிட்ட நிலையைக் குறிக்கும் கால மறுப்பையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: δοῦλος
  choice: அடிமை
  rationale: மகனாகவும் வாரிசாகவும் இருப்பதற்கு எதிராக நிறுத்தப்படும் கட்டுப்பட்ட நிலையைக் ‘அடிமை’ துல்லியமாகக் காட்டுகிறது.
- source_word: ἀλλὰ υἱός
  choice: மகன்
  rationale: தத்தெடுப்பு மற்றும் வாரிசுரிமை சார்ந்த வாதத்தில் உள்ள ஆண்பால் ஒருமைச் சொல்லையும் அதன் சட்ட-சமூக நுணுக்கத்தையும் பாதுகாக்கிறது.
- source_word: εἰ δὲ υἱός
  choice: மகன் என்றால்
  rationale: மகனாக இருப்பதிலிருந்து வாரிசு நிலைக்குச் செல்லும் நிபந்தனை சார்ந்த வாத முன்னேற்றத்தை இயல்பான தமிழில் தருகிறது.
- source_word: καὶ κληρονόμος
  choice: வாரிசும்கூட
  rationale: மகன் என்ற நிலையுடன் வாரிசு நிலையும் சேர்ந்திருப்பதை καὶ என்பதன் கூட்டுப் பொருளோடு வெளிப்படுத்துகிறது.
- source_word: διὰ θεοῦ
  choice: கடவுளின் மூலமாக
  rationale: SBLGNT வாசகத்தில் உள்ள διά + genitive என்பதன் இடைமுகப் பொருளைத் தீர்மானமின்றி நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: υἱός என்பதிலுள்ள பாலினம் குறித்த மகன் மொழி
  choice: மகன்
  alternative: பிள்ளை
  rationale: பவுலின் தத்தெடுப்பு–வாரிசுரிமை வாதத்தில் ‘மகன்’ என்பதன் வரலாற்றுச் சட்ட நுணுக்கம் முக்கியமானது. இந்நிலை எல்லா விசுவாசிகளுக்கும் பொருந்துவதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: வசன முடிவிலுள்ள மூலபாட வாசகம்
  choice: கடவுளின் மூலமாக
  alternative: கிறிஸ்துவின் மூலமாகக் கடவுளின் வாரிசு
  rationale: கொடுக்கப்பட்ட SBLGNT மூலபாடம் διὰ θεοῦ என்று வாசிப்பதால் முதன்மைப் பாடம் அதையே பின்பற்றுகிறது; குறிப்பிடத்தக்க மாற்று வாசகம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, சாதாரண வாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ஒருமை ‘நீ’ மூலத்தின் நேரடி உரையாடல் வலிமையைப் பாதுகாக்கிறது; ‘அடிமை—மகன்—வாரிசு’ என்ற வாதத் தொடரும் தெளிவாக வைக்கப்பட்டுள்ளது.
