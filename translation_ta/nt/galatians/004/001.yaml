id: GAL.4.1
reference: Galatians 4:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Λέγω δέ, ἐφ’ ὅσον χρόνον ὁ κληρονόμος νήπιός ἐστιν, οὐδὲν διαφέρει δούλου κύριος πάντων ὤν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/001.yaml
  text: I say that as long as the heir is a child[a], he differs in nothing from a servant, though he is lord of all[b],
translation:
  language: ta
  text: நான் சொல்வது என்னவென்றால், வாரிசானவன் சிறுவனாக[a] இருக்கும் காலமெல்லாம், அவன் எல்லாவற்றுக்கும் உரிமையாளனாக இருந்தாலும், அவனுக்கும் ஓர் அடிமைக்கும்[b] எந்த வேறுபாடும் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வயது வராதவனாக.” கிரேக்கச் சொல்லான νήπιος ஒரு சிறு குழந்தையைக் குறிக்கலாம்; இந்தச் சூழலில், சட்டப்படி உரிய வயதை இன்னும் அடையாத வாரிசு என்ற பொருளையும் கொண்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பணியாளுக்கும்.” கிரேக்கச் சொல்லான δοῦλος பொதுவாக அடிமைப்பட்ட அல்லது கட்டுப்பட்ட நிலையிலுள்ள ஒருவரைக் குறிக்கிறது; இங்கு பவுலின் ஒப்பீட்டின் வலிமையைப் பாதுகாக்க “அடிமை” பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δέ
  choice: நான் சொல்வது என்னவென்றால்
  rationale: λέγω விளக்கத்தை அறிமுகப்படுத்துகிறது; δέ மென்மையான தொடர்பை ஏற்படுத்துகிறது. தமிழில் தேவையற்ற வலுவான எதிர்மறைத் தொடர்பைச் சேர்க்காமல், இயல்பான விளக்கத் தொடக்கமாக இவ்வாறு தரப்பட்டுள்ளது.
- source_word: ἐφ’ ὅσον χρόνον
  choice: இருக்கும் காலமெல்லாம்
  rationale: ஒரு வரம்பு வரையிலான காலநீட்சியைக் குறிக்கும் இந்த மரபுத்தொடரின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὁ κληρονόμος
  choice: வாரிசானவன்
  rationale: κληρονόμος என்பது சொத்துரிமையைப் பெறுகிற வாரிசைக் குறிக்கிறது; உவமையின் சட்ட மற்றும் குடும்பப் பின்னணியை இச்சொல் தெளிவாக வைத்திருக்கிறது.
- source_word: νήπιός
  choice: சிறுவனாக
  rationale: νήπιος குழந்தையையோ முதிர்ச்சியடையாதவரையோ குறிக்கலாம். இங்குள்ள வாரிசுரிமைச் சூழலில், வயது வராத நிலையை இயல்பாக உணர்த்தும் பொதுவான சொல் இது; துல்லியமான மாற்றுப்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: οὐδὲν διαφέρει
  choice: எந்த வேறுபாடும் இல்லை
  rationale: நடைமுறையில் முற்றிலும் வேறுபாடு இல்லை என்ற கிரேக்கச் சொற்றொடரின் வலிமையைத் தெளிவான நவீன தமிழில் வழங்குகிறது.
- source_word: δούλου
  choice: ஓர் அடிமைக்கும்
  rationale: δοῦλος இங்கு கட்டுப்பாட்டின்கீழ் உரிமையின்றி இருக்கும் ஒருவரைக் குறிக்கிறது. வாரிசின் தற்கால நிலையை ஒப்பிடும் பவுலின் உவமையின் வலிமையை ‘அடிமை’ காக்கிறது.
- source_word: κύριος πάντων ὤν
  choice: அவன் எல்லாவற்றுக்கும் உரிமையாளனாக இருந்தாலும்
  rationale: κύριος இங்கு தெய்வீகப் பட்டம் அல்ல; உடைமை மற்றும் அதிகாரத்தைக் குறிக்கிறது. ὤν என்ற பங்கேற்புவினையின் விட்டுக்கொடுப்பு சார்ந்த பொருளை ‘இருந்தாலும்’ தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பவுலின் உவமையில் δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: அடிமை
  alternative: பணியாள்
  rationale: இந்த ஒப்பீடு சாதாரண வேலை அல்லது சேவையைப் பற்றியது மட்டுமல்ல; பிறரது அதிகாரத்தின்கீழ் இருக்கும் கட்டுப்பட்ட நிலையையே சார்ந்தது. ஆகவே ‘அடிமை’ மூலச்சொல்லின் சமூக மற்றும் சொல்லாட்சிசார் வலிமையைப் பாதுகாக்கிறது.
- issue: κύριος πάντων என்பதில் κύριος என்பதன் பொருள்
  choice: எல்லாவற்றுக்கும் உரிமையாளன்
  alternative: எல்லாவற்றுக்கும் எஜமான்
  rationale: இங்கு κύριος என்பது ஆண்டவரைக் குறிக்கும் தெய்வீகப் பட்டமாக அல்லாமல், வாரிசுக்குரிய சொத்துகளின் உடைமை நிலையைக் குறிக்கிறது. ‘உரிமையாளன்’ அந்தச் சூழலைத் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. சட்டநடைச் சுமையை அதிகரிக்காமல் வாரிசின் வயது வராத நிலையையும், அடிமையுடன் செய்யப்படும் கூர்மையான ஒப்பீட்டையும் காக்கிறது.
