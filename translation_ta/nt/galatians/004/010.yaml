  text: You are carefully observing days and months and seasons and years.
translation:
  language: ta
  text: நாட்களையும் மாதங்களையும் காலங்களையும்[a] ஆண்டுகளையும் நீங்கள் கவனமாகக் கடைப்பிடிக்கிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நியமிக்கப்பட்ட காலங்களையும்.” இப்பட்டியல் நாட்காட்டி சார்ந்த அனுசரிப்புகளைக் குறிக்கிறது; καιρούς என்பதற்கு இவ்வாறு மொழிபெயர்க்கவும் இடமுண்டு.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας
  choice: நாட்களை
  rationale: ἡμέρα என்பதன் நேரடியான பன்மை வடிவத்தை எளிமையாக மொழிபெயர்க்கிறது; இவை சமய நாட்கள் என்ற சூழல்சார்ந்த பொருளைச் சொல்லுக்குள் கூடுதலாகச் சேர்க்கவில்லை.
- source_word: παρατηρεῖσθε
  choice: கவனமாகக் கடைப்பிடிக்கிறீர்கள்
  rationale: நிகழ்கால இரண்டாம் நபர் பன்மை வினை. இச்சூழலில் நாட்காட்டி சார்ந்த காலங்களை உன்னிப்பாக அனுசரிப்பதைக் குறிக்கிறது; ‘கவனமாகக் கடைப்பிடிக்கிறீர்கள்’ என்பது தொடர்ச்சியையும் கூர்ந்த அனுசரிப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: μῆνας
  choice: மாதங்களை
  rationale: μήν என்பதன் நேரடியான பன்மைப் பொருளைத் தக்கவைக்கிறது.
- source_word: καιρούς
  choice: காலங்களை
  rationale: καιρός என்பது குறிப்பிட்ட அல்லது தகுந்த காலத்தைக் குறிக்கலாம். ‘காலங்கள்’ என்பது அதன் பொதுவான காலப்பொருளையும் மூலத்தின் தெளிவின்மையையும் தக்கவைக்கிறது; ‘நியமிக்கப்பட்ட காலங்கள்’ என்பது சாத்தியமான மாற்று.
- source_word: ἐνιαυτούς
  choice: ஆண்டுகளை
  rationale: ἐνιαυτός என்பதன் நேரடியான பன்மைப் பொருள்; பட்டியலின் காலவரிசையை இயல்பாக நிறைவு செய்கிறது.
- source_word: καὶ
  choice: -யும் / -ஐயும்
  rationale: ஒவ்வொரு καὶ-யும் தமிழின் இணைப்பும்மை விகுதியால் வெளிப்படுத்தப்பட்டு, பட்டியலின் சேர்க்கை ஓசை தக்கவைக்கப்படுகிறது.
theological_decisions:
- issue: இவை யூத அல்லது சமய நாட்காட்டி அனுசரிப்புகள் என்பதை வெளிப்படையாகச் சேர்ப்பதா
  choice: மூலத்தில் உள்ள நாட்கள், மாதங்கள், காலங்கள், ஆண்டுகள் என்ற காலச்சொற்களை மட்டும் முதன்மை உரையில் வைத்தல்
  alternative: சிறப்பு நாட்கள், சமயக் காலங்கள் அல்லது பண்டிகைகள் என்று குறிப்பாக்குதல்
  rationale: கலாத்தியர் நிருபத்தின் சூழல் சடங்கு அல்லது நாட்காட்டி அனுசரிப்பைச் சுட்டினாலும், கிரேக்க வசனம் இப்பெயர்ச்சொற்களுக்கு ‘சிறப்பு,’ ‘புனித,’ அல்லது ‘பண்டிகை’ என்ற அடைமொழிகளைச் சேர்க்கவில்லை. ஆகவே அந்தக் குறிப்பாக்கத்தை மொழிபெயர்ப்பில் புகுத்தாமல் மூலத்தின் திறந்த தன்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘அனுசரிக்கிறீர்கள்’ என்பதைக் காட்டிலும் பொதுவாகப் புரியும் ‘கடைப்பிடிக்கிறீர்கள்’ தேர்ந்தெடுக்கப்பட்டது; ‘கவனமாக’ என்பது παρατηρεῖσθε வினையின் உன்னிப்பான அனுசரிப்பு நிழலை வெளிப்படுத்துகிறது.
