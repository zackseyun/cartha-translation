source:
  edition: SBLGNT
  text: ἅτινά ἐστιν ἀλληγορούμενα· αὗται γάρ εἰσιν δύο διαθῆκαι, μία μὲν ἀπὸ ὄρους Σινᾶ, εἰς δουλείαν γεννῶσα, ἥτις ἐστὶν Ἁγάρ,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/024.yaml
  text: 'These things are being interpreted allegorically[a], for these women are two covenants: one from Mount Sinai, bearing children for slavery[b]; she is Hagar.'
translation:
  language: ta
  text: இவை உருவகமாக விளக்கப்படுகின்றன[a]; ஏனெனில் இந்தப் பெண்களே இரண்டு உடன்படிக்கைகள். அவற்றில் ஒன்று சீனாய் மலையிலிருந்து வந்தது; அது அடிமைத்தனத்துக்காகப் பிள்ளைகளைப் பெற்றெடுக்கிறது[b]. அதுவே ஆகார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவை உருவகமாகச் சொல்லப்படுகின்றன,” அல்லது “இவை ஓர் உருவகமாக உள்ளன.” முந்தைய நிகழ்ச்சிக்குறிப்பை பவுல் உருவக முறையில் பயன்படுத்துவதை கிரேக்கச் சொற்றொடர் சுட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அடிமைத்தனத்துக்குள் பிள்ளைகளைப் பெற்றெடுக்கிறது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅτινά
  choice: இவை
  rationale: முன்னதாகக் கூறப்பட்ட ஆகார்–சாராள் நிகழ்வுகளைச் சுட்டும் நடுநிலைப் பன்மை உறவுப்பெயரின் பின்னோக்குச் சுட்டலை இயல்பான தமிழில் தருகிறது.
- source_word: ἀλληγορούμενα
  choice: உருவகமாக விளக்கப்படுகின்றன
  rationale: ἐστιν உடன் வரும் நிகழ்காலச் செயப்பாட்டு வினையெச்சம், முந்தைய நிகழ்வு உருவக முறையில் பொருள் கொள்ளப்படுவதைச் சுட்டுகிறது; அதை வெறுமனே ‘ஓர் உருவகம்’ என்று சமப்படுத்தாமல் செயப்பாட்டு நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: αὗται
  choice: இந்தப் பெண்கள்
  rationale: பெண்பால் பன்மைச் சுட்டுப்பெயர் முன்னர் கூறப்பட்ட இரு பெண்களையே குறிக்கிறது; தமிழில் ‘பெண்கள்’ என்பதை வெளிப்படையாகச் சேர்ப்பது தெளிவை அளிக்கிறது.
- source_word: διαθῆκαι
  choice: உடன்படிக்கைகள்
  rationale: சீனாய் பின்னணியிலும் பவுலின் மீட்பு வரலாற்றுச் சூழலிலும் ‘உடன்படிக்கை’ என்பதே பொருத்தமான நிறுவப்பட்ட வேதாகமச் சொல்.
- source_word: μία μὲν ἀπὸ ὄρους Σινᾶ
  choice: ஒன்று சீனாய் மலையிலிருந்து வந்தது
  rationale: μέν அடுத்த வசனத்தில் தொடரும் எதிரிணையின் முதல் உறுப்பை அறிமுகப்படுத்துகிறது. ‘வந்தது’ என்பது ἀπό குறிக்கும் மூலத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἰς δουλείαν
  choice: அடிமைத்தனத்திற்காக
  rationale: εἰς இங்கு விளைவு அல்லது நோக்குத் திசையைக் குறிக்கலாம்; ‘அடிமைத்தனத்திற்காக’ என்பது இயல்பான தமிழில் வலுவான அடிமைநிலையைத் தக்கவைக்கிறது, மற்ற சாத்தியத்தை அடிக்குறிப்பு தருகிறது.
- source_word: γεννῶσα
  choice: பிள்ளைகளைப் பெறுகிறது
  rationale: உடன்படிக்கையைப் பெண் உருவில் காட்டும் தாய்மை உருவகத்தையும் நிகழ்கால வினையெச்சத்தின் தொடர்ச்சியான செயலையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: ἥτις ἐστὶν Ἁγάρ
  choice: அதுவே ஆகார்
  rationale: பெண்பால் ஒருமை முன்னிலையான உடன்படிக்கையை ஆகாருடன் அடையாளப்படுத்துகிறது; தமிழில் பாலின வேறுபாடுள்ள சுட்டுப்பெயர் இல்லாததால் ‘அதுவே’ அடையாளப்படுத்தலைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: சாராள்–ஆகார் நிகழ்வை பவுல் பயன்படுத்தும் விதம்
  choice: முந்தைய நிகழ்வுகள் உருவகமாக விளக்கப்படுகின்றன என்று மொழிபெயர்த்தல்
  alternative: அவை இயல்பிலேயே ஓர் உருவகம் என்று மொழிபெயர்த்தல்
  rationale: ἀλληγορούμενα என்ற செயப்பாட்டு வடிவம் ஓர் விளக்க அல்லது பயன்பாட்டு முறையைச் சுட்டுகிறது. ஆதியாகம நபர்களின் வரலாற்றுத்தன்மையை மறுப்பதாகவோ உறுதிப்படுத்துவதாகவோ உரையைத் தாண்டி முடிவுகட்டாமல் அதன் இறையியல் இழுபறியைப் பாதுகாக்கிறது.
- issue: δουλεία என்பதன் வலிமை
  choice: அடிமைத்தனம்
  alternative: கட்டுப்பாடு அல்லது அடிமைநிலை
  rationale: இரு உடன்படிக்கைகளின் வேறுபாட்டில் கட்டுண்ட கீழ்ப்படிநிலையே மையமாக இருப்பதால், ‘அடிமைத்தனம்’ மூலச்சொல்லின் வலிமையைத் தெளிவாகப் பாதுகாக்கிறது.
- issue: இரு பெண்களும் இரு உடன்படிக்கைகளும் இடையிலான அடையாளம்
  choice: ‘இந்தப் பெண்கள் இரண்டு உடன்படிக்கைகளைக் குறிக்கிறார்கள்’
  alternative: ‘இந்தப் பெண்களே இரண்டு உடன்படிக்கைகள்’
  rationale: தமிழில் நேரடியான சமன்பாடு பெண்களும் உடன்படிக்கைகளும் ஒன்றே என்ற சாராம்சக் கூற்றாகத் தவறாக ஒலிக்கக்கூடும். ‘குறிக்கிறார்கள்’ உருவக அடையாளத்தை இயல்பாகத் தெரிவிக்கிறது; அடுத்துள்ள ‘அதுவே ஆகார்’ அதன் வலிமையைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘உடன்படிக்கை’, ‘அடிமைத்தனம்’, ‘உருவகம்’ ஆகிய நிறுவப்பட்ட வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டன. நீண்ட கிரேக்க வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டது; மூலத்தின் தர்க்கத் தொடர்பு பாதுகாக்கப்பட்டது.
