id: GAL.4.14
reference: Galatians 4:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ τὸν πειρασμὸν ⸀ὑμῶν ἐν τῇ σαρκί μου οὐκ ἐξουθενήσατε οὐδὲ ἐξεπτύσατε, ἀλλὰ ὡς ἄγγελον θεοῦ ἐδέξασθέ με, ὡς Χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/014.yaml
  text: And though my bodily condition was a trial to you[a], you did not treat me with contempt or disgust; rather, you welcomed me as an angel of God[c][b], as Messiah Jesus.
translation:
  language: ta
  text: என் உடல் நிலை உங்களுக்குச் சோதனையாக இருந்தபோதிலும்[a], நீங்கள் என்னை இகழவோ அருவருத்துத் தள்ளவோ இல்லை[b]. மாறாக, கடவுளின் தேவதூதரைப்போலவும் மேசியாவாகிய இயேசுவைப்போலவும் என்னை வரவேற்றீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் உடலில் உங்களுக்கு ஏற்பட்ட சோதனை.” கிரேக்கத் தொடரின் பாடமும் இலக்கணத் தொடர்பும் சிக்கலானவை.
    reason: alternative_reading
  - marker: b
    text: 'நேர்ப்பொருள்: “துப்பிவிடவோ இல்லை”; இது அருவருத்து நிராகரிப்பதைக் குறிக்கும் சொல்லாட்சி.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πειρασμὸν
  choice: சோதனை
  rationale: இங்கு பாவத்திற்கான தூண்டுதல் அல்ல, பவுலின் உடல் நிலையால் கலாத்தியருக்கு ஏற்பட்ட கடினமான பரிசோதனையே குறிக்கப்படுகிறது.
- source_word: ὑμῶν ἐν τῇ σαρκί μου
  choice: என் உடல் நிலை உங்களுக்குச் சோதனையாக இருந்தபோதிலும்
  rationale: சிக்கலான கிரேக்கத் தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது; சோதனை கலாத்தியருக்குரியது என்றும், அதற்குக் காரணம் பவுலின் உடல் நிலை என்றும் புரிந்துகொள்ளப்படுகிறது. மாற்றுச் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐξουθενήσατε
  choice: இகழவோ
  rationale: ஒருவரை மதிப்பற்றவராக எண்ணி அவமதிக்கும் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐξεπτύσατε
  choice: அருவருத்து ஒதுக்கவோ
  rationale: சொல்லின் நேர்ப்பொருளான ‘துப்புதல்’ வெளிப்படுத்தும் அருவருப்பு மற்றும் நிராகரிப்பு ஆகிய இரண்டையும் நவீன தமிழில் இயல்பாகக் கூறுகிறது; நேர்ப்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐδέξασθέ
  choice: வரவேற்றீர்கள்
  rationale: வெறுமனே ஏற்றுக்கொள்வதைவிட அன்புடனும் மரியாதையுடனும் பெற்றுக்கொண்டதைக் காட்டுகிறது.
- source_word: ἄγγελον θεοῦ
  choice: கடவுளின் தேவதூதர்
  rationale: ἄγγελος என்பதற்கு ‘தூதர்’ என்றும் பொருள் வரலாம்; ஆனால் மேசியாவாகிய இயேசுவுடன் உயர்த்திக் கூறப்படும் ஒப்புமை இங்கு தேவதூதர் என்ற பொருளை ஆதரிக்கிறது.
- source_word: Χριστὸν Ἰησοῦν
  choice: மேசியாவாகிய இயேசு
  rationale: Χριστός இங்கு வெறும் பெயராக அல்லாமல் பட்டமாகச் செயல்படுவதால் ‘மேசியா’ என மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: ‘கடவுளின் தேவதூதரைப்போல, மேசியாவாகிய இயேசுவைப்போல’ என்ற ஒப்புமையின் பொருள்
  choice: கலாத்தியர் பவுலை மிகுந்த மரியாதையுடன் வரவேற்ற விதத்தை விவரிக்கும் ஒப்புமை
  alternative: இரண்டாவது ஒப்புமை முதலாவதைச் சொல்லணிநயத்துடன் தீவிரப்படுத்துகிறது
  rationale: இரண்டு ὡς தொடர்களும் பவுலின் இயல்பையோ அடையாளத்தையோ அல்ல, அவரை அவர்கள் ஏற்றுக்கொண்ட விதத்தைக் குறிக்கின்றன. அதனால் தமிழில் ‘வரவேற்பதுபோல’ என்று வெளிப்படையாக அமைக்கப்பட்டுள்ளது.
- issue: σάρξ என்பதன் பொருள்
  choice: உடல் நிலை
  alternative: மாம்சம்; பாவ இயல்பு
  rationale: உடனடியான சூழலில் பவுலின் நோய், பலவீனம் அல்லது உடல்சார்ந்த நிலையே கருத்தில் உள்ளது; ஒழுக்க அல்லது பாவ இயல்பை இங்கு புகுத்த ஆதாரம் இல்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. சிக்கலான தொடக்கத் தொடரின் இயல்பான முதன்மைப் பொருள் உரையில் தரப்பட்டு, அதன் உண்மையான மாற்றுச் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
