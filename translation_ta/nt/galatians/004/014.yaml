  source_fidelity: மூலத்தின் கடினமான πειρασμὸν ὑμῶν ἐν τῇ σαρκί μου தொடரை, பவுலின் உடல் நிலை கலாத்தியருக்கு ஏற்பட்ட சோதனையாகப் புரிந்துகொள்வது சூழலுக்கு ஏற்றது. இகழ்தல், அருவருப்புடன் நிராகரித்தல், மற்றும் சிறப்பான வரவேற்பு ஆகியவற்றையும் வரைவு உண்மையாகக் கொண்டுள்ளது. ஆனால் இரண்டு ὡς ஒப்புமைகளும் நேரடியாகப் பவுலை எவ்வாறு வரவேற்றார்கள் என்பதோடு இணைவது தமிழில் தெளிவாக அமைய வேண்டும்.
  naturalness: ‘கடவுளின் தேவதூதரை வரவேற்பதுபோலவும் ... வரவேற்பதுபோலவும் என்னை வரவேற்றீர்கள்’ என்ற அமைப்பு தேவையற்ற மீளுரையும் சற்றே கனமான நடையும் கொண்டுள்ளது. ‘தேவதூதரைப்போலவும் ... இயேசுவைப்போலவும் என்னை வரவேற்றீர்கள்’ என்பது நவீன நிலையான தமிழில் இயல்பாகவும் மூல வாக்கிய அமைப்புக்கு நெருக்கமாகவும் உள்ளது. அடிக்குறிப்பு அ-வில் உள்ள மாற்று வாசகமும் இயல்பாகத் திருத்தப்பட வேண்டும்.
