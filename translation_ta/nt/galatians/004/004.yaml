  text: ὅτε δὲ ἦλθεν τὸ πλήρωμα τοῦ χρόνου, ἐξαπέστειλεν ὁ θεὸς τὸν υἱὸν αὐτοῦ, γενόμενον ἐκ γυναικός, γενόμενον ὑπὸ νόμον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/004.yaml
  text: But when the fullness of time had come[a], God sent out his Son, born of a woman, born under the law[d][c][b],
translation:
  language: ta
  text: ஆனால் காலம் நிறைவடைந்தபோது[a], கடவுள் ஒரு பெண்ணிடமிருந்து பிறந்தவராகவும்[c], சட்டத்தின் கீழ் பிறந்தவராகவும்[d] இருந்த தமது மகனை அனுப்பிவைத்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: “காலத்தின் நிறைவு வந்தபோது” அல்லது “குறிக்கப்பட்ட காலம் நிறைவடைந்தபோது.”'
    reason: lexical_alternative
  - marker: b
    text: “அனுப்பினார்” என்றும் மொழிபெயர்க்கலாம்; கிரேக்கத்தில் இங்கு பயன்படுத்தப்பட்ட வினை, “அனுப்பு” என்பதன் வலியுறுத்தப்பட்ட கூட்டுவடிவம்.
    reason: lexical_alternative
  - marker: c
    text: 'வேறு மொழிபெயர்ப்பு: “ஒரு பெண்ணிடமிருந்து வந்தவராக.” இச்சொற்றொடர் மகனின் உண்மையான மனிதப் பிறப்பை வலியுறுத்துகிறது.'
    reason: lexical_alternative
  - marker: d
    text: அதாவது, மோசேயின் சட்டத்தின் அதிகாரத்துக்கு உட்பட்டவராக.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτε δὲ
  choice: ஆனால் …போது
  rationale: δέ குறிக்கும் மென்மையான உரைமாற்றத்தையும் ὅτε குறிக்கும் காலத் தொடர்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; முரண்பாட்டை அளவுக்கு மீறி வலியுறுத்தவில்லை.
- source_word: ἦλθεν τὸ πλήρωμα τοῦ χρόνου
  choice: காலம் முழுமை அடைந்தபோது
  rationale: சொல்லுக்குச் சொல் அமைப்பைத் திணிக்காமல், காலம் குறிக்கப்பட்ட நிறைவை எட்டியதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐξαπέστειλεν
  choice: அனுப்பினார்
  rationale: இறைமகனின் அனுப்பப்படுதலைத் தெளிவாகக் கூறும் இயல்பான தமிழ் வினை; கிரேக்கக் கூட்டுவினையின் வலிமை அடிக்குறிப்பில் சுட்டப்பட்டுள்ளது.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: தமது மகனை
  rationale: எழுவாய் கடவுள் என்பதால் உயர்திணைத் தற்சுட்டுப் பெயரடையான ‘தமது’ இயல்பாக உள்ளது; உறவையும் நேரடி செயப்படுபொருளையும் காக்கிறது.
- source_word: γενόμενον ἐκ γυναικός
  choice: ஒரு பெண்ணுக்குப் பிறந்தவராக
  rationale: γίνομαι மற்றும் ἐκ γυναικός சேர்ந்த இவ்விடத்தில் உண்மையான மனிதப் பிறப்பைக் குறிக்கின்றன; தமிழில் ‘ஒரு பெண்ணுக்குப் பிறந்தவர்’ இயல்பான சொல்லாக்கம்.
- source_word: γενόμενον ὑπὸ νόμον
  choice: திருச்சட்டத்தின் கீழ் பிறந்தவராக
  rationale: முந்தைய γενόμενον உடனான இணை அமைப்பைக் காத்து, பிறந்தது முதலே சட்டத்தின் அதிகாரத்துக்கு உட்பட்ட நிலையை வெளிப்படுத்துகிறது.
- source_word: νόμον
  choice: திருச்சட்டம்
  rationale: கலாத்தியர் நிருபத்தின் சூழலில் மோசேயின் சட்டத்தைக் குறிக்கும் νόμος என்பதற்கு நவீன கிறிஸ்தவத் தமிழில் தெளிவான, சுருக்கமான இணை.
theological_decisions:
- issue: γενόμενον ἐκ γυναικός என்பதில் கிறிஸ்துவின் உண்மையான மனிதத்தன்மை
  choice: ‘ஒரு பெண்ணுக்குப் பிறந்தவராக’ என்று மொழிபெயர்த்து உண்மையான மனிதப் பிறப்பைத் தெரிவிப்பது
  alternative: ‘ஒரு பெண்ணிடமிருந்து வந்தவராக’
  rationale: ‘கடவுள் தமது மகனை அனுப்பினார்’ என்பது முன் இருப்பை உணர்த்தும் நிலையில், இச்சொற்றொடர் அவரது உண்மையான மனிதப் பிறப்பையும் காக்கிறது; எந்தக் கோட்பாட்டு விரிவாக்கத்தையும் மூலவசனத்தில் சேர்க்கவில்லை.
- issue: ὑπὸ νόμον என்பதில் νόμος குறிக்கும் சட்டம்
  choice: மோசேயின் திருச்சட்டத்தின் அதிகாரத்துக்கு உட்பட்ட நிலை எனப் புரிந்து, மூல உரையின் சுருக்கத்தைப் பேணுதல்
  alternative: பொதுவாக ஏதோ ஒரு சட்டத்துக்கு உட்பட்ட நிலை
  rationale: கலாத்தியர் நிருபத்தின் உடனடிச் சூழல் மோசேயின் சட்டத்தை வலுவாகச் சுட்டுகிறது; இருப்பினும் அந்த விளக்கம் முதன்மை உரைக்குள் விரிவாக்கப்படாமல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இரண்டு இணையான γενόμενον சொற்றொடர்களும் ‘பிறந்தவராகவும் … பிறந்தவராகவும்’ எனக் காக்கப்பட்டுள்ளன. ‘நியாயப்பிரமாணம்’ போன்ற பழமையான சொல் தவிர்க்கப்பட்டு, சூழலுக்கேற்ற ‘திருச்சட்டம்’ பயன்படுத்தப்பட்டுள்ளது.
