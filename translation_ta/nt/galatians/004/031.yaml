base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/031.yaml
  text: Therefore[a], brothers, we are not children of the servant woman[b], but of the free woman.
translation:
  language: ta
  text: ஆகவே, சகோதரர்களே[a], நாம் அடிமைப் பெண்ணின்[b] பிள்ளைகள் அல்ல; மாறாக, சுதந்திரப் பெண்ணின் பிள்ளைகள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சகோதர சகோதரிகளே’; கிரேக்கத்தில் ‘சகோதரர்களே’ என்று உள்ளது; இச்சொல் பெண்களும் ஆண்களும் சேர்ந்த குழுவை பிரதிநிதித்துவமாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பணிப்பெண்ணின்’; கிரேக்கச் சொல் ஓர் அடிமைப் பெண்ணையோ பணிப்பெண்ணையோ குறிக்கிறது. இங்கு பவுலின் உருவகத்தில் (கலா 4:21–31) ஆகார் சாராளுடன் ஒப்பிட்டு வேறுபடுத்தப்படுகிறார்.
    reason: lexical_alternative
