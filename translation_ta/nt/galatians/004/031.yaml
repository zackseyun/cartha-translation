theological_decisions:
- issue: ஆகார்–சாராள் உருவகத்தில் அடிமைத்தனத்துக்கும் சுதந்திரத்துக்கும் உள்ள எதிர்மறையை எவ்வளவு வெளிப்படையாக மொழிபெயர்ப்பது
  choice: ‘அடிமைப் பெண்’ மற்றும் ‘சுதந்திரப் பெண்’ என்று முதன்மை உரையில் மொழிபெயர்த்தல்
  alternative: ‘பணிப்பெண் ... சுதந்திரமான பெண்’
  rationale: கலாத்தியர் 4:21–31 இன் வாதத்தில் அடிமைத்தனம்–சுதந்திரம் என்ற எதிர்மறை முக்கியமானது. இச்சொற்கள் கூடுதல் கோட்பாட்டுக் கருத்தைச் சேர்க்காமல் அந்தக் கூர்மையைத் தக்கவைக்கின்றன.
- issue: கலப்புப் பாலின வாசகர்களை நோக்கிய ἀδελφοί என்பதை எவ்வாறு மொழிபெயர்ப்பது
  choice: முதன்மை உரையில் ‘சகோதரர்களே’ என்று வைத்து, விரிவான பிரதிநிதித்துவப் பொருளை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘சகோதர சகோதரிகளே’
  rationale: மூலத்தின் ஆண்பால் குடும்ப அழைப்பைத் தக்கவைத்தபடியே, அது பெண்களையும் உள்ளடக்கிய குழுவை நோக்கிப் பயன்படுத்தப்படலாம் என்ற உண்மையை மறைக்காமல் விளக்குகிறது.
