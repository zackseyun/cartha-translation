- source_word: οὐκ ἐσμὲν
  choice: நாம் ... அல்ல
  rationale: கிரேக்கத்தின் நிகழ்கால மறுப்பை நேரடியாகக் காட்டுகிறது; மூலத்தில் இல்லாத ‘இனி அல்ல’ போன்ற காலப் பொருளைச் சேர்ப்பதில்லை.
- source_word: παιδίσκης
