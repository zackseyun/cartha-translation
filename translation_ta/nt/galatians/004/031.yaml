  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அடிமைப் பெண் / சுதந்திரப் பெண்’ என்ற இணையான சொற்றொடர்கள் மூலத்தின் சமூக நிலையையும் இறையியல் பதற்றத்தையும் தெளிவாகத் தக்கவைக்கின்றன.
