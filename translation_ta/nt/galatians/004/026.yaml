  yaml_path: translation/nt/galatians/004/026.yaml
  text: But the Jerusalem above is free[a], and she is our mother.
translation:
  language: ta
  text: ஆனால் மேலே உள்ள எருசலேமோ சுதந்திரமானவள்; அவள் நம் தாய்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் சொற்சார்பாக, “நம் தாயாகியவள்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் பெண்பால் தொடர்புப் பெயர் பயன்படுத்தப்பட்டுள்ளது; இங்கு எருசலேம் ஒரு தாயாக ஆளுருவாக்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட தற்போதைய எருசலேமுடன் உள்ள முரண்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἄνω
  choice: மேலே உள்ள
  rationale: பூமிக்குரிய எருசலேமுக்கு மாறாக உயரிடத்திலுள்ள எருசலேம் என்ற உருவகத்தைப் பாதுகாக்கிறது; ‘பரலோக’ என்று விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: Ἰερουσαλήμ
  choice: எருசலேம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: ἐλευθέρα
  choice: சுதந்திரமானவள்
  rationale: சுற்றியுள்ள அடிமை–சுதந்திரம் என்ற எதிர்மறை இணைப்பைப் பாதுகாக்கிறது. தாய் உருவகத்தோடு தொடர்புடைய எருசலேம் இங்கு ஆளுருவாக்கப்படுவதால் பெண்பால் வடிவம் இயல்பாக உள்ளது.
- source_word: ἥτις
  choice: அவள்
  rationale: கிரேக்கத்தில் இது தொடர்புப் பெயராக இருந்தாலும், எருசலேம் தாயாக ஆளுருவாக்கப்படுவதை இயல்பான தமிழில் வெளிப்படுத்துகிறது; தேவையற்ற கூடுதல் விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: μήτηρ
  choice: தாய்
  rationale: பவுலின் ஆகார்–சாராள் உருவக வாதத்தின் மையத்திலுள்ள தாய்மை உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἡμῶν
  choice: நம்
  rationale: முதல் நபர் பன்மை உடைமையை இயல்பான, உள்ளடக்கும் தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘மேலே உள்ள எருசலேம்’ என்பதன் ஆளுருவாக்கம்
  choice: ‘சுதந்திரமானவள்; அவள் நம் தாய்’ என்று பெண்பால் ஆளுருவாக்கத்துடன் மொழிபெயர்த்தல்
  alternative: ‘சுதந்திரமானது; அது நம் தாய்’ என்று இலக்கணரீதியாக நடுநிலை வடிவில் மொழிபெயர்த்தல்
  rationale: சாராளுக்கும் சுதந்திரமான பெண்ணுக்கும் ஒப்பான தாய் உருவமாக எருசலேமைப் பவுல் முன்வைக்கிறார். பெண்பால் வடிவம் அந்த உருவகத்தைத் தெளிவாக்குகிறது; அதற்கு அப்பாற்பட்ட சமயவியல் விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடை. ‘மேலே உள்ள’ என்பது மூலத்தின் இடவியல் உருவகத்தைப் பாதுகாக்கிறது; ‘சுதந்திரமானவள்’ மற்றும் ‘அவள்’ என்பவை சூழலில் உள்ள தாய் உருவகத்தை இயல்பாகத் தொடர்கின்றன.
