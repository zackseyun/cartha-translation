id: GAL.4.23
reference: Galatians 4:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλ’ ὁ μὲν ἐκ τῆς παιδίσκης κατὰ σάρκα γεγέννηται, ὁ δὲ ἐκ τῆς ἐλευθέρας ⸀δι’ ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/023.yaml
  text: But the son by the servant woman was born according to the flesh[b][a], while the son by the free woman was born through promise.
translation:
  language: ta
  text: ஆனால் அடிமைப் பெண்ணின் மகன் மாம்சத்தின்படி[a] பிறந்தான்; சுதந்திரப் பெண்ணின் மகனோ வாக்குறுதியின் மூலம்[b] பிறந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இயல்பான மனித முறையில்” / “மனித வழிமுறையின்படி.” கிரேக்கத்தில், “மாம்சத்தின்படி.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வாக்குறுதியால்.” இச்சொற்றொடர், வெறும் இயல்பான மனித இனப்பெருக்கத்தால் மட்டுமல்லாமல், கடவுளுடைய வாக்குறுதியின் விளைவாக அந்தப் பிறப்பு நிகழ்ந்ததைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίσκη
  choice: அடிமைப் பெண்
  rationale: சாராள்–ஆகார் வேறுபாட்டில் அவளுடைய அடிமை நிலையே பவுலின் வாதத்திற்கு மையமானது; ஆகவே மென்மையான ‘வேலைக்காரப் பெண்’ என்பதைவிட ‘அடிமைப் பெண்’ சமூக மற்றும் இறையியல் வலிமையைத் தக்கவைக்கிறது.
- source_word: κατὰ σάρκα
  choice: மாம்சத்தின்படி
  rationale: பவுலின் முக்கியச் சொல்லான σάρξ என்பதையும், இயல்பான மனிதப் பிறப்புக்கும் வாக்குறுதியால் நிகழ்ந்த பிறப்புக்கும் இடையிலான அழுத்தத்தையும் நேரடியாகத் தக்கவைக்கிறது.
- source_word: γεγέννηται
  choice: பிறந்தான்
  rationale: இங்கு ஆண் மகன்களே மறைமுக எழுவாய்கள்; தமிழில் இயல்பாகவும் தெளிவாகவும் இறந்தகால வடிவம் அமைகிறது.
- source_word: ἐλευθέρα
  choice: சுதந்திரப் பெண்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட அடைமொழியை வெளிப்படையாக்கி, அடிமைப் பெண்ணுக்கு எதிரான சமூக நிலை வேறுபாட்டைப் பாதுகாக்கிறது.
- source_word: δι’ ἐπαγγελίας
  choice: வாக்குறுதியின் மூலம்
  rationale: διά கூறும் வழிமுறை அல்லது காரணப்பங்கைக் காட்டுகிறது; சூழலில் இது கடவுளுடைய வாக்குறுதியைக் குறித்தாலும், மூலத்தில் இல்லாத சொல்லை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: ὁ μὲν ... ὁ δὲ
  choice: மகன் ... மகனோ
  rationale: கிரேக்கத்தில் மறைமுகமாக உள்ள இரு மகன்களையும் தமிழில் தெளிவாக்கி, மாறுபாட்டை ‘-ஓ’ மூலம் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: κατὰ σάρκα மற்றும் δι’ ἐπαγγελίας இடையிலான வேறுபாடு
  choice: ‘மாம்சத்தின்படி’ என்பதையும் ‘வாக்குறுதியின் மூலம்’ என்பதையும் முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘இயல்பான மனித முறையில்’ மற்றும் ‘கடவுளுடைய வாக்குறுதியின் விளைவாக’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: இது உடல்சார்ந்த பிறப்பே பாவமானது என்று கூறுவதில்லை; இயல்பான மனித இனப்பெருக்கத்தையும் கடவுளுடைய வாக்குறுதியால் நிகழ்ந்த பிறப்பையும் வேறுபடுத்துகிறது. ‘மாம்சம்’ என்ற பவுலின் சொல்லைத் தக்கவைத்தல் இறையியல் அழுத்தத்தை முன்கூட்டியே தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘மாம்சத்தின்படி’ என்பது பொதுவழக்கில் சற்றே முறையானதாக இருந்தாலும் பவுலின் சொற்பயன்பாட்டையும் திட்டமிட்ட இறையியல் அழுத்தத்தையும் காக்கிறது; அதன் சூழல்சார் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
