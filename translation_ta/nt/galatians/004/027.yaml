reference: Galatians 4:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: γέγραπται γάρ· Εὐφράνθητι, στεῖρα ἡ οὐ τίκτουσα, ῥῆξον καὶ βόησον, ἡ οὐκ ὠδίνουσα· ὅτι πολλὰ τὰ τέκνα τῆς ἐρήμου μᾶλλον ἢ τῆς ἐχούσης τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/027.yaml
  text: 'For it is written: “Rejoice[a], barren woman who is not bearing children; break forth and cry out, you who are not in labor[c][b]; because the children of the desolate woman are more numerous than those of the woman who has a husband.”'
translation:
  language: ta
  text: 'ஏனெனில், இவ்வாறு எழுதப்பட்டுள்ளது: “பிள்ளை பெறாத மலடியே, மகிழ்ந்திரு![a] பிரசவ வேதனைப்படாதவளே, மகிழ்ச்சி பொங்கி ஆரவாரி! ஏனெனில், கணவனுள்ளவளின் பிள்ளைகளைக் காட்டிலும் கைவிடப்பட்டவளின் பிள்ளைகள் அதிகம்.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஏசாயா 54:1-இலிருந்து மேற்கோள்.
    reason: cross_reference
  - marker: b
    text: “கைவிடப்பட்டவள்” என்பதற்கான கிரேக்கச் சொல், இந்த உருவகச் சூழலில் “பாழடைந்தவள்” அல்லது “தனிமையில் விடப்பட்டவள்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: இவ்வாறு எழுதப்பட்டுள்ளது
  rationale: வேதவாக்கை அறிமுகப்படுத்தும் நிறைநிலைச் செயப்பாட்டு வடிவத்தின் தொடரும் அதிகாரத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Εὐφράνθητι
  choice: மகிழ்ந்திரு
  rationale: மகிழ்ச்சிக்கான கட்டளையையும் தீர்க்கதரிசன மேற்கோளின் உயர்ந்த நடையையும் காக்கிறது.
- source_word: στεῖρα ἡ οὐ τίκτουσα
  choice: பிள்ளை பெறாத மலடியே
  rationale: பெண்ணை நேரடியாக அழைக்கும் substantival adjective-ஐத் தெளிவாகக் காட்டி, தொடரும் பிள்ளையின்மையை இயல்பான தமிழில் சொல்கிறது.
- source_word: ῥῆξον καὶ βόησον
  choice: மகிழ்ச்சி பொங்க உரக்கக் கூவு
  rationale: திடீரென வெடித்தெழும் உணர்ச்சியையும் உரத்த குரலையும் ஒருங்கே தெரிவிக்கிறது; சொல்லுக்கு சொல் செயற்கையான அமைப்பைத் தவிர்க்கிறது.
- source_word: ἡ οὐκ ὠδίνουσα
  choice: பிரசவ வேதனைப்படாதவளே
  rationale: ὠδίνω குறிக்கும் மகப்பேற்று வேதனையைத் துல்லியமாகப் பாதுகாக்கிறது.
- source_word: τῆς ἐρήμου
  choice: கைவிடப்பட்டவளின்
  rationale: இச்சூழலில் உள்ள தனிமை, புறக்கணிப்பு அல்லது கைவிடப்பட்ட நிலை என்ற உருவகப் பொருளைக் காட்டுகிறது; வெறும் பாலைவனப் பொருளைத் தவிர்க்கிறது.
- source_word: πολλὰ τὰ τέκνα ... μᾶλλον ἢ
  choice: பிள்ளைகளைவிட ... பிள்ளைகள் மிகுதி
  rationale: ஒப்பீட்டு வலிமையைத் தெளிவான, இயல்பான தமிழ்ச் சொற்றொடரில் தருகிறது.
- source_word: τῆς ἐχούσης τὸν ἄνδρα
  choice: கணவனை உடையவளின்
  rationale: ἀνήρ இங்கு ‘கணவன்’ என்பதைக் குறிக்கும்; ‘திருமணமானவள்’ என்று பொதுமைப்படுத்தாமல் மூலத்தின் எதிர்மறை இணைப்பை காக்கிறது.
theological_decisions:
- issue: கலாத்தியர் 4-இன் உருவக விளக்கச் சூழலில் ஏசாயா 54:1 மேற்கோள்
  choice: மேற்கோளின் தீர்க்கதரிசனப் படிமங்களை அவற்றின் சொந்த வடிவில் மொழிபெயர்த்து, பவுலின் உருவக அடையாளத்தை வசனத்துக்குள் சேர்க்கவில்லை.
  alternative: ‘மேலுள்ள எருசலேம்’ அல்லது சாராளை நேரடியாகச் சுட்டும் வகையில் மேற்கோளை விளக்கமாக மொழிபெயர்த்தல்.
  rationale: இது வெளிப்படையான வேதமேற்கோள்; அதன் படிமத்தைப் பாதுகாத்து, சூழலிலுள்ள பவுலின் வாதமே அதன் பயன்பாட்டை விளக்க அனுமதிப்பது பொருத்தமானது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. தீர்க்கதரிசன மேற்கோளுக்குரிய ஓசையைப் பேணியபடியே பொதுவாசகர்கள் புரிந்துகொள்ளும் சொற்கள் தேர்ந்தெடுக்கப்பட்டன. ‘மலடி’ என்பது மூலத்தின் நேரடியான அழைப்பைச் சுருக்கமாகக் காக்கிறது; இழிவுபடுத்தும் நோக்கம் இல்லாமல் மேற்கோள் மொழியாக வருகிறது.
