id: GAL.4.11
reference: Galatians 4:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: φοβοῦμαι ὑμᾶς μή πως εἰκῇ κεκοπίακα εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/011.yaml
  text: I fear for you[a], that somehow I have labored over you in vain.
translation:
  language: ta
  text: உங்களுக்காக நான் அஞ்சுகிறேன்; ஒருவேளை உங்களுக்காக நான் செய்த உழைப்பு வீணாயிற்றோ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβοῦμαι
  choice: நான் அஞ்சுகிறேன்
  rationale: நிகழ்காலத்தில் பவுலுக்கு இருக்கும் ஆழ்ந்த கவலையை இயல்பான, கண்ணியமான தமிழில் தெரிவிக்கிறது.
- source_word: ὑμᾶς
  choice: உங்களைக் குறித்து
  rationale: அவர்கள் தனக்கு அச்சுறுத்தல் என்பதல்ல, அவர்களுடைய நிலை குறித்த அக்கறையே பொருள் என்பதைத் தெளிவாக்குகிறது.
- source_word: μή πως
  choice: ஒருவேளை ... ஆயிற்றோ என்று
  rationale: அஞ்சப்படும் சாத்தியத்தைத் தமிழில் இயல்பாகவும், உறுதியாகத் தீர்மானிக்காமல் ஐயத்துடனும் வெளிப்படுத்துகிறது.
- source_word: εἰκῇ
  choice: வீணாயிற்றோ
  rationale: முயற்சி எதிர்பார்த்த பலனைத் தராமல் போயிருக்கலாம் என்ற ‘வீணாக’ என்னும் பொருளைப் பாதுகாக்கிறது.
- source_word: κεκοπίακα
  choice: நான் பட்ட பாடெல்லாம்
  rationale: κοπιάω குறிக்கும் கடுமையான உழைப்பை இயல்பான தமிழில் வலியுறுத்துகிறது; கிரேக்க நிறைவுநிலையின் கடந்த உழைப்பும் அதன் தற்போதைய விளைவும் சூழலில் வெளிப்படுகின்றன.
- source_word: εἰς ὑμᾶς
  choice: உங்களுக்காக
  rationale: பவுலின் உழைப்பு அவர்களை நோக்கியும் அவர்களுக்காகவும் செலுத்தப்பட்டது என்ற திசை மற்றும் அக்கறையை இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: பவுலின் அச்சத்தின் தன்மை
  choice: கலாத்தியர்களுக்காகத் தாம் பட்ட பாடு பலனற்றுப் போயிருக்குமோ என்ற மேய்ப்பருக்குரிய அக்கறை
  alternative: தம் சொந்த நிலை குறித்த பொதுவான தனிப்பட்ட பதற்றம்
  rationale: φοβοῦμαι ... μή πως ... εἰκῇ κεκοπίακα என்ற அமைப்பு, சாதாரண பதற்றத்தை அல்லாமல் அவர்களிடையே செய்த உழைப்பு பலனற்றுப் போகும் சாத்தியம் குறித்த அச்சத்தை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘பட்ட பாடெல்லாம்’ என்பது கடுமையான உழைப்பை சாதாரண வாசகருக்கு இயல்பாக உணர்த்துகிறது; வசனத்தின் மேய்ப்பருக்குரிய அக்கறையும் ஐயமும் பாதுகாக்கப்படுகின்றன.
