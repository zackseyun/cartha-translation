  text: τὸ ⸀δὲ Ἁγὰρ Σινᾶ ὄρος ἐστὶν ἐν τῇ Ἀραβίᾳ, συστοιχεῖ δὲ τῇ νῦν Ἰερουσαλήμ, δουλεύει ⸀γὰρ μετὰ τῶν τέκνων αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/025.yaml
  text: Hagar is Mount Sinai in Arabia[a], and she corresponds to the present Jerusalem, for she is enslaved with her children.
translation:
  language: ta
  text: ஆகார் அரேபியாவில் உள்ள சீனாய் மலை; அவள் இப்போதுள்ள எருசலேமுக்கு ஒத்தவளாக இருக்கிறாள்; ஏனெனில் அவள் தன் பிள்ளைகளோடு அடிமைத்தனத்தில் இருக்கிறாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த ஆகார் அரேபியாவில் உள்ள சீனாய் மலை.” கிரேக்கத்தில் ‘ஆகார்’ என்பதற்கு முன் ஒரு உருபு உள்ளது; அதனால் இச்சொற்றொடரின் இலக்கண அமைப்பு கடினமாக இருக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δὲ Ἁγὰρ
  choice: ஆகார் என்பது
  rationale: δέ-ஐ வலுவான எதிர்மறை இணைப்பாக மாற்றாமல் விடுகிறது; பெயருக்கு முன் உள்ள கடினமான τὸ-வைத் தமிழில் இயல்பாகச் சொல்ல ‘என்பது’ பயன்படுத்தப்படுகிறது. கிரேக்கத் தொடரின் வேறு சாத்தியமான பிரதிபலிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: Σινᾶ ὄρος ἐστὶν ἐν τῇ Ἀραβίᾳ
  choice: அரேபியாவில் உள்ள சீனாய் மலை
  rationale: பவுலின் உருவக வாதத்திலுள்ள நேரடியான அடையாளப்படுத்தலை ‘பிரதிநிதித்துவப்படுத்துகிறது’ என்று விளக்கமாக மாற்றாமல் காக்கிறது; Ἀραβία-வை அரசியல் எல்லைகளால் மிகுதியாக வரையறுக்கவில்லை.
- source_word: συστοιχεῖ
  choice: இணையாக இருக்கிறாள்
  rationale: ஒரே வரிசை அல்லது ஒத்த பிரிவில் நிற்பது என்ற கருத்தை, உருவக ஒப்புமையின் பொருளைக் காக்கும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: τῇ νῦν Ἰερουσαλήμ
  choice: இப்போதுள்ள எருசலேம்
  rationale: அடுத்த வசனத்தின் ‘மேலான எருசலேம்’ என்பதிலிருந்து பவுலின் காலத்தில் இருந்த எருசலேமை வேறுபடுத்தும் νῦν-ன் காலப்பொருளைக் காக்கிறது.
- source_word: δουλεύει
  choice: அடிமைத்தனத்தில் இருக்கிறாள்
  rationale: δουλ- சொல்லின் அடிமைநிலையைப் பொதுவான ‘சேவை’ என்று மென்மையாக்காமல், இப்பகுதியின் அடிமைத்தனம்–சுதந்திரம் முரண்பாட்டைத் தெளிவாக வைத்திருக்கிறது.
- source_word: μετὰ τῶν τέκνων αὐτῆς
  choice: தன் பிள்ளைகளோடு
  rationale: μετά + உரிமை வேற்றுமையின் உடனிணைப்பையும், உருவகத்திலுள்ள குடும்ப உறவைக் குறிக்கும் τέκνα என்பதையும் இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: ஆகாரை சீனாய் மலையுடனும் இப்போதுள்ள எருசலேமுடனும் பவுல் இணைத்தல்
  choice: ‘ஆகார் என்பது ... சீனாய் மலை’ என்று நேரடியான அடையாளப்படுத்தலையும், ‘எருசலேமுக்கு இணையாக இருக்கிறாள்’ என்று அடுத்த ஒப்புமையையும் வேறுபடுத்திக் காக்கிறது.
  alternative: ‘ஆகார் சீனாய் மலையைக் குறிக்கிறாள்’ என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: கிரேக்கத்தில் முதலில் நேரடியான சமன்பாட்டு மொழியும், பின்னர் συστοιχεῖ என்ற ஒத்திணைவு வினையும் உள்ளன. அவற்றை ஒரே விதமான ‘குறிக்கிறது’ என்ற விளக்கமாகச் சமப்படுத்தாமல் உரையின் இறையியல் அழுத்தத்தைக் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அடிமைத்தனம்’ என்ற சொல் சூழலின் மைய முரண்பாட்டை வெளிப்படையாகக் காக்கிறது; நேரடியான உருவக அடையாளப்படுத்தல் விளக்கவுரையாக மென்மையாக்கப்படவில்லை.
