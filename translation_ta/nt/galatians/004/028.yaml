  text: ⸂ὑμεῖς δέ, ἀδελφοί, κατὰ Ἰσαὰκ ἐπαγγελίας τέκνα ἐστέ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/028.yaml
  text: You[a], brothers, like Isaac, are children of promise.
translation:
  language: ta
  text: நீங்களோ, சகோதரர்களே[a], ஈசாக்கைப் போல வாக்குறுதியின் பிள்ளைகளாக இருக்கிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கே ‘சகோதரர்களே’ என்பது ஆண்பால் பன்மை வடிவில் சபையாரை அழைக்கும் சொல்; அது ஆண்களையும் பெண்களையும் உள்ளடக்கியிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: நீங்களோ
  rationale: வெளிப்படையாக இடம்பெறும் இரண்டாம் நபர் பன்மைப் பெயர்ச்சொல்லின் வலியுறுத்தலையும், δέ காட்டும் மென்மையான வேறுபாடு அல்லது தொடர்ச்சி மாற்றத்தையும் தமிழ் மொழியின் இயல்பான ‘-ஓ’ அமைப்பு சேர்த்துக் காட்டுகிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: விளிவேற்றுமையில் உள்ள ஆண்பால் பன்மை அழைப்பை நேரடியாகப் பாதுகாக்கிறது; சபையிலுள்ள ஆண்களையும் பெண்களையும் பிரதிநிதித்துவமாக உள்ளடக்கும் பயன்பாடு அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: κατὰ Ἰσαὰκ
  choice: ஈசாக்கைப் போல
  rationale: இங்கு κατά, ஈசாக்கை ஒத்த மாதிரி அல்லது ஒப்புமையைக் குறிக்கிறது; ‘ஈசாக்கின்படி’ என்பதைவிட இது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἐπαγγελίας
  choice: வாக்குறுதியின்
  rationale: ‘வாக்குறுதியின் பிள்ளைகள்’ என்ற பவுலின் செறிவான உறவுநிலைச் சொல்லாட்சியைப் பாதுகாக்கிறது; அதை விளக்கவுரையாக விரித்துச் சொல்லவில்லை.
- source_word: τέκνα
  choice: பிள்ளைகள்
  rationale: பாலினத்தைச் சுட்டாத பன்மைச் சொல்; குடும்ப உறவுநிலையையும் பிள்ளை என்ற நிலையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐστέ
  choice: இருக்கிறீர்கள்
  rationale: இரண்டாம் நபர் பன்மை நிகழ்கால வினையை இயல்பான தமிழில் வெளிப்படுத்தி, வாசகர்களை ‘வாக்குறுதியின் பிள்ளைகள்’ என்ற பயனிலையுடன் இணைக்கிறது.
theological_decisions:
- issue: பவுலின் உருவக வாதத்தில் விசுவாசிகள் ஈசாக்குடன் ஒப்பிடப்படுதல்
  choice: ‘ஈசாக்கைப் போல வாக்குறுதியின் பிள்ளைகளாக இருக்கிறீர்கள்’
  alternative: ‘ஈசாக்கைப் போன்ற வாக்குறுதியால் பிறந்த பிள்ளைகள் நீங்கள்’
  rationale: கிரேக்கத் தொடரமைப்பில் ஈசாக்கு ஒப்புமையின் மாதிரியாகவும், ‘வாக்குறுதியின் பிள்ளைகள்’ பயனிலையாகவும் உள்ளது. பிறப்பின் முறையை விளக்கமாகச் சேர்க்காமல் இந்த இரு கூறுகளையும் மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதைமிக்க சபை வாசிப்பு நடை பயன்படுத்தப்பட்டுள்ளது. ‘நீங்களோ’ என்பது ὑμεῖς என்பதன் வலியுறுத்தலையும் δέ என்பதன் மென்மையான எதிர்மறைத் தொடர்பையும் சுருக்கமாகத் தாங்குகிறது; மூலத்தில் இல்லாத காலச் சுட்டான ‘இப்போது’ சேர்க்கப்படவில்லை.
