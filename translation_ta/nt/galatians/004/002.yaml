source:
  edition: SBLGNT
  text: ἀλλὰ ὑπὸ ἐπιτρόπους ἐστὶ καὶ οἰκονόμους ἄχρι τῆς προθεσμίας τοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/002.yaml
  text: but he is under guardians and stewards until the time set by his father[a][b].
translation:
  language: ta
  text: ஆனால், தந்தை நிர்ணயித்த காலம்வரை[b] அவன் பாதுகாவலர்களுக்கும் சொத்து நிர்வாகிகளுக்கும்[a] கீழ்ப்பட்டிருக்கிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வீட்டு நிர்வாகிகள்”; கிரேக்கச் சொல் ஒரு வீடு அல்லது சொத்துக்களை நிர்வகிப்பவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தந்தையின் நியமிக்கப்பட்ட காலம்வரை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட வாரிசின் நிலைக்கும், சிறுவனாக இருக்கும்போது அவன் நடைமுறையில் அதிகாரத்திற்குக் கீழ்ப்பட்டிருப்பதற்கும் இடையிலான முரண்பாட்டைக் காட்டுகிறது.
- source_word: ὑπὸ
  choice: கீழ்ப்பட்டிருக்கிறான்
  rationale: இங்கு அதிகாரம் அல்லது மேற்பார்வைக்கு உட்பட்டிருப்பதைக் குறிக்கிறது; தமிழில் இயல்பாக இருக்க வினைச்சொல்லுடன் இணைத்துத் தரப்பட்டுள்ளது.
- source_word: ἐπιτρόπους
  choice: பாதுகாவலர்கள்
  rationale: சிறுவனின் நலனையும் நடத்தையையும் கவனிக்க ஒப்படைக்கப்பட்டவர்களைக் குறிக்கிறது; சொத்து நிர்வாகிகளிலிருந்து இவர்களை வேறுபடுத்துகிறது.
- source_word: ἐστὶ
  choice: இருக்கிறான்
  rationale: முந்தைய வசனத்திலிருந்து தொடரும் ‘வாரிசு’ என்னும் ஒருமை ஆண்பால் எழுவாயைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: καὶ
  choice: -உம் … -உம்
  rationale: இரு வகையான மேற்பார்வையாளர்களையும் இணைக்கும் கிரேக்கச் சொல்லைத் தமிழின் இணைப்புப் பின்னொட்டுகள் இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: οἰκονόμους
  choice: சொத்து நிர்வாகிகள்
  rationale: வீடு அல்லது குடும்பச் சொத்தின் காரியங்களை நிர்வகிப்பவர்களைக் குறிக்கிறது; இச்சூழலில் வாரிசின் சொத்து நிர்வாகம் முன்னிலையாக இருப்பதால் இந்தச் சொற்றொடர் தெளிவாக உள்ளது.
- source_word: ἄχρι
  choice: காலம்வரை
  rationale: இந்த ஏற்பாட்டின் கால எல்லையைக் குறிக்கும் நேரப் பொருளை நேரடியாகத் தருகிறது.
- source_word: τῆς προθεσμίας
  choice: நிர்ணயித்த காலம்
  rationale: முன்கூட்டியே குறிக்கப்பட்ட அல்லது தீர்மானிக்கப்பட்ட நேரம் என்னும் பொருளை நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: τοῦ πατρός
  choice: தந்தை
  rationale: சூழலில் வாரிசின் தந்தையே அந்தக் காலத்தை நிர்ணயிப்பவர் என்று இயல்பாகப் புரிகிறது; ‘அவனுடைய’ என்பதைச் சேர்க்காமலேயே உறவு சூழலால் தெளிவாகிறது.
theological_decisions:
- issue: τοῦ πατρός என்ற உடைமை வேற்றுமையின் பொருள்
  choice: காலத்தை நிர்ணயிப்பவர் தந்தை என்பதைக் காட்டும் வகையில் ‘தந்தை நிர்ணயித்த’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘தந்தையின் நியமிக்கப்பட்ட காலம்வரை’ என்று உடைமைத் தொடர்பை இன்னும் நேரடியாகக் காட்டலாம்.
  rationale: சிறுவனான வாரிசைப் பற்றிய உவமையில், அவன் எப்போது மேற்பார்வையிலிருந்து வெளியே வருவான் என்பதைத் தந்தை தீர்மானிப்பதே இயல்பான சூழல். எனினும் கிரேக்க உடைமை வேற்றுமையின் வடிவத்தை மாற்றாக அடிக்குறிப்பு பாதுகாக்கிறது; கூடுதல் இறையியல் கருத்து சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பாதுகாவலர்கள்’ மற்றும் ‘சொத்து நிர்வாகிகள்’ என்ற சொற்கள் நபரைக் கவனிக்கும் பொறுப்பையும் சொத்தை நிர்வகிக்கும் பொறுப்பையும் தெளிவாக வேறுபடுத்துகின்றன.
