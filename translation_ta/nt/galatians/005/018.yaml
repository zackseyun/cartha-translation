reference: Galatians 5:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ δὲ πνεύματι ἄγεσθε, οὐκ ἐστὲ ὑπὸ νόμον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/018.yaml
  text: But if you are led by the Spirit[b][a], you are not under the law.
translation:
  language: ta
  text: ஆனால் ஆவியானவரால் நீங்கள் வழிநடத்தப்படுகிறீர்கள் என்றால்[a], நீங்கள் திருச்சட்டத்தின் கீழ் இல்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆவியானவரால் நீங்கள் வழிநடத்தப்பட்டுக்கொண்டிருக்கிறீர்கள் என்றால்.’
    reason: நிகழ்கால வினை வடிவத்தின் தொடர்ச்சியான நுண்பொருளை இன்னும் வெளிப்படையாகக் காட்டும் மாற்று மொழிபெயர்ப்பு.
  - marker: b
    text: ‘திருச்சட்டத்தின் கீழ்’ என்பது அதன் அதிகாரம் அல்லது ஆளுகைக்கு உட்பட்டிருப்பதைக் குறிக்கிறது; கலாத்தியர் 5:23-ஐ ஒப்பிடுக.
    reason: பவுலின் சொல்லாட்சியின் பொருளைத் தெளிவுபடுத்தி தொடர்புடைய வசனத்தைக் காட்டுகிறது.
lexical_decisions:
- source_word: εἰ
  choice: என்றால்
  rationale: நிபந்தனையை அறிமுகப்படுத்தும் சொல்லாக இருப்பதால், தமிழில் இயல்பான நிபந்தனைத் தொடரான ‘என்றால்’ பயன்படுத்தப்பட்டது.
- source_word: δὲ
  choice: ஆனால்
  rationale: மாம்சத்துக்கும் ஆவிக்கும் இடையிலான சூழமைவுக் கருத்து வேறுபாட்டை மென்மையாகக் காட்டுகிறது.
- source_word: πνεύματι
  choice: ஆவியானவரால்
  rationale: இது கருவி அல்லது செயற்பாட்டாளர் பொருளுடைய வேற்றுமை வடிவம்; கலாத்தியர் 5:16–25 சூழலில் கடவுளுடைய ஆவியைக் குறிக்கிறது. ‘ஆவியானவரால்’ என்பது அந்தச் செயற்பாட்டையும் தனிப்பட்ட குறிப்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἄγεσθε
  choice: வழிநடத்தப்படுகிறீர்கள்
  rationale: நிகழ்காலச் செயலப்பாட்டு வடிவத்தையும் பன்மை முன்னிலையையும் காக்கிறது; தொடரும் வழிநடத்துதலை மிகைப்படுத்தாமல் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: οὐκ ἐστὲ
  choice: நீங்கள் ... இல்லை
  rationale: மறுக்கப்பட்ட இருப்புநிலைத் தொடரைத் தமிழில் நேரடியாகவும் இயல்பாகவும் அளிக்கிறது.
- source_word: ὑπὸ νόμον
  choice: திருச்சட்டத்தின் கீழ்
  rationale: கலாத்தியர் சூழலில் மோசேயின் சட்டத்தைக் குறிக்கும் பவுலின் சொல்லாட்சியைப் பாதுகாக்கிறது; ‘கீழ்’ என்பது அதன் ஆளுகை அல்லது அதிகாரத்திற்குட்பட்ட நிலையைக் காட்டுகிறது.
theological_decisions:
- issue: πνεύματι என்பதன் குறிப்பு
  choice: கடவுளுடைய ஆவி—‘ஆவியானவர்’
  alternative: மனித ஆவி
  rationale: உடனடிச் சூழலில் மாம்சத்துக்கும் ஆவியானவருக்கும் இடையிலான தொடர்ச்சியான எதிர்மறை ஒப்பீடு உள்ளது. எனவே கடவுளுடைய ஆவியே இங்கு செயற்படுபவர் என்ற வாசிப்பு சூழலுக்கு ஏற்றது.
- issue: ὑπὸ νόμον என்பதன் பொருள்
  choice: திருச்சட்டத்தின் ஆளுகை அல்லது அதிகாரத்திற்குக் கீழ்ப்பட்டிராத நிலை
  alternative: எந்தச் சட்டத்திற்கும் பொதுவாகக் கீழ்ப்பட்டிராத நிலை
  rationale: கலாத்தியரில் இந்தச் சொற்றொடர் மோசேயின் சட்டம் ஓர் ஆளுகை அமைப்பாக இருப்பதைக் குறிக்கிறது. மொழிபெயர்ப்பு இதைப் பாதுகாக்கிறது; விரிவான கோட்பாட்டு விளக்கத்தை வசனத்திற்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘வழிநடத்தப்படுகிறீர்கள்’ என்பது கிரேக்கச் செயலப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது; ‘திருச்சட்டம்’ என்பது சூழலில் மோசேயின் சட்டத்தைக் குறிக்கிறது.
