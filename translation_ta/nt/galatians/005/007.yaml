  yaml_path: translation/nt/galatians/005/007.yaml
  text: You were running well[a]. Who hindered you from obeying the truth?
translation:
  language: ta
  text: நீங்கள் நன்றாக ஓடிக்கொண்டிருந்தீர்கள். உண்மைக்குக் கீழ்ப்படியாதபடி[a] உங்களைத் தடுத்தவர் யார்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உண்மையால் இணங்கச் செய்யப்படாதபடி.” கிரேக்க வினைச்சொல் “கீழ்ப்படுதல்” அல்லது “இணங்கச் செய்யப்படுதல்” என்ற இரு பொருள்களையும் தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐτρέχετε
  choice: ஓடிக்கொண்டிருந்தீர்கள்
  rationale: இறந்தகாலத்தில் தொடர்ந்த செயலைக் குறிக்கும் வினைவடிவத்தையும் பவுலின் ஓட்ட உருவகத்தையும் நேரடியாகப் பாதுகாக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘பந்தயம்’ என்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: καλῶς
  choice: நன்றாக
  rationale: ஓடிய விதத்தையும் அவர்கள் முன்பு சரியான முறையில் முன்னேறியதையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: τίς
  choice: யார்
  rationale: தடையை ஏற்படுத்திய நபரைப் பற்றிய நேரடியான வினாப்பெயராக உள்ளது.
- source_word: ἐνέκοψεν
  choice: தடுத்தவர்
  rationale: ஓடுபவரின் வழியை மறித்தல் அல்லது அவருக்கு இடையூறு செய்தல் என்ற உருவக நுணுக்கத்தைத் தமிழில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: τῇ ἀληθείᾳ
  choice: உண்மைக்கு
  rationale: πείθεσθαι என்பதோடு இணைந்து, ஏற்கெனவே அறிவிக்கப்பட்ட நற்செய்தியின் உண்மைக்கு அவர்கள் அளிக்க வேண்டிய பதிலைக் குறிக்கிறது.
- source_word: μὴ πείθεσθαι
  choice: கீழ்ப்படியாதபடி
  rationale: இச்சூழலில் உண்மைக்குக் கீழ்ப்படிதல் என்ற நடைமுறைப் பதிலை இயல்பாக வெளிப்படுத்துகிறது; ‘நம்பி ஏற்றுக்கொள்’ என்ற சாத்தியமான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: πείθεσθαι என்பதன் பொருள்
  choice: உண்மைக்குக் கீழ்ப்படிதல்
  alternative: உண்மையை நம்பி ஏற்றுக்கொள்ளுதல்
  rationale: சூழல் கலாத்தியர்கள் நற்செய்தியின் உண்மைக்கு நடைமுறையில் அளித்த பதிலைப் பற்றியது. ‘கீழ்ப்படிதல்’ அந்த அம்சத்தைத் தெரிவிக்கிறது; அதேவேளையில், கிரேக்க வினைச்சொல்லிலுள்ள ‘நம்பவைக்கப்படுதல்/நம்பி ஏற்றுக்கொள்ளுதல்’ என்ற பொருள் அடிக்குறிப்பில் விடப்படுகிறது.
translation_notes:
  register: நவீன தரமான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘ஓடிக்கொண்டிருந்தீர்கள்’ என்ற சொல் தடகள உருவகத்தைப் பாதுகாக்கிறது; வாக்கிய அமைப்பு தமிழில் இயல்பாக இருக்க ‘உங்களைத் தடுத்தவர் யார்?’ என அமைக்கப்பட்டுள்ளது.
