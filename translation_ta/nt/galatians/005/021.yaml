  text: ⸀φθόνοι, μέθαι, κῶμοι, καὶ τὰ ὅμοια τούτοις, ἃ προλέγω ὑμῖν ⸀καθὼς προεῖπον ὅτι οἱ τὰ τοιαῦτα πράσσοντες βασιλείαν θεοῦ οὐ κληρονομήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/021.yaml
  text: envy[a], drunkenness, carousing, and things like these, about which I warn you, just as I warned before, that those who practice such things will not inherit the kingdom of God.
translation:
  language: ta
  text: பொறாமை, குடிவெறி, கட்டுப்பாடற்ற களியாட்டங்கள்[a], இவற்றைப் போன்றவை; இவற்றைக் குறித்து நான் உங்களை எச்சரிக்கிறேன்—முன்பும் எச்சரித்ததுபோலவே—இப்படிப்பட்டவற்றைச் செய்துவருகிறவர்கள் கடவுளின் அரசை உரிமையாகப் பெறமாட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆரவாரக் கொண்டாட்டங்கள்.” கிரேக்கச் சொல், பெரும்பாலும் மது அருந்துதலோடு தொடர்புடைய வரம்புமீறிய, கட்டுப்பாடற்ற கொண்டாட்டங்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: φθόνοι
  choice: பொறாமை
  rationale: மற்றொருவரின் நன்மையைக் கண்டு மனம் பொறுக்காத தீய விருப்பத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ்ச் சொல். கிரேக்கத்தில் பன்மையாக இருந்தாலும், தமிழில் தீய பண்புகளின் பட்டியலில் ஒருமை வகைப்பெயர் இயல்பாக உள்ளது.
- source_word: μέθαι
  choice: குடிவெறி
  rationale: மது அருந்தி போதையடையும் நிலை அல்லது அதில் ஈடுபடும் நிகழ்வுகளைக் குறிக்கிறது; நவீனத் தமிழில் தெளிவாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: κῶμοι
  choice: கட்டுப்பாடற்ற களியாட்டங்கள்
  rationale: மது அருந்துதலோடு அடிக்கடி தொடர்புடைய, வரம்புமீறிய ஆரவாரக் கொண்டாட்டங்களைக் குறிக்கிறது. பாலியல் பொருளைத் தேவையின்றி சேர்க்காமல் சமூக மற்றும் ஒழுக்கச் சீர்கேட்டின் கூறை வெளிப்படுத்துகிறது.
- source_word: τὰ ὅμοια τούτοις
  choice: இவற்றைப் போன்றவை
  rationale: பெயரிடப்பட்ட தீய செயல்களோடு பட்டியல் முடிவதில்லை என்ற திறந்த பொருளை இயல்பாகப் பேணுகிறது.
- source_word: ἃ προλέγω ὑμῖν ... καθὼς προεῖπον
  choice: இவற்றைக் குறித்து முன்பு உங்களை எச்சரித்ததுபோல இப்போதும் எச்சரிக்கிறேன்
  rationale: προλέγω என்பதன் முன்கூறுதல் மற்றும் எச்சரித்தல் ஆகிய பொருள்களில், இந்த ஒழுக்க அறிவுறுத்தல் சூழலில் எச்சரித்தல் என்ற வலிமையைத் தேர்ந்தெடுத்து, முந்தைய எச்சரிப்பையும் தற்போதைய எச்சரிப்பையும் தெளிவாக்குகிறது.
- source_word: οἱ τὰ τοιαῦτα πράσσοντες
  choice: இப்படிப்பட்டவற்றைச் செய்துவருகிறவர்கள்
  rationale: நிகழ்காலப் பங்கேற்புவினை காட்டும் தொடர்ச்சியான அல்லது வாழ்க்கை முறையான செயலை வெளிப்படுத்துகிறது; ஒரே ஒரு தனித்த தவறாகப் பொருள் குறுக்கப்படுவதைத் தவிர்க்கிறது.
- source_word: βασιλείαν θεοῦ
  choice: கடவுளின் அரசு
  rationale: புதிய ஏற்பாட்டின் முக்கிய இறையியல் சொற்றொடரை எளிய, நவீனத் தமிழில் நேரடியாக வழங்குகிறது.
- source_word: οὐ κληρονομήσουσιν
  choice: உரிமையாகப் பெறமாட்டார்கள்
  rationale: κληρονομέω என்பதிலுள்ள பரம்பரை உரிமை அல்லது சுதந்தரப் பெறுதல் என்ற உருவகத்தை இயல்பான நவீனத் தமிழில் காக்கிறது.
theological_decisions:
- issue: இந்த எச்சரிக்கை தனித்தனி செயல்களையா அல்லது தொடர்ச்சியான வாழ்க்கை முறையையா குறிக்கிறது?
  choice: “செய்துவருகிறவர்கள்” என்று மொழிபெயர்த்து, தொடர்ச்சியான அல்லது பண்பான நடைமுறையை வெளிப்படுத்துதல்.
  alternative: “செய்கிறவர்கள்” அல்லது “இவற்றைச் செய்பவர்கள்.”
  rationale: πράσσοντες என்ற நிகழ்காலப் பங்கேற்புவினை இந்தத் தீய செயல்களின் பட்டியல் சூழலில் வழக்கமான நடைமுறையை இயல்பாகச் சுட்டுகிறது. அதேவேளையில், ஒவ்வொரு தனித்த தவறைப் பற்றியும் உரை கூறாத ஒரு கோட்பாட்டு முடிவைச் சேர்க்கவில்லை.
- issue: βασιλείαν θεοῦ என்பதிலுள்ள அரசாட்சி மற்றும் பெறப்படும் பங்கு ஆகிய இரு கூறுகள்
  choice: “கடவுளின் அரசை உரிமையாகப் பெறமாட்டார்கள்” என்று அரசையும் சுதந்தர மொழியையும் இரண்டையும் பேணுதல்.
  alternative: “கடவுளின் ஆட்சியில் பங்குபெறமாட்டார்கள்.”
  rationale: “ஆட்சி” என்பது இயக்கமிக்க பொருளை வலியுறுத்தினாலும், இங்கு நேரடி பொருளாக வரும் βασιλείαν மற்றும் κληρονομήσουσιν என்பதன் சுதந்தர உருவகத்தை “அரசை உரிமையாகப் பெறுதல்” நெருக்கமாகப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கப் பன்மைகள் தமிழில் இயல்பான இடங்களில் வகைப்பெயர் ஒருமையாகவும், κῶμοι மட்டும் நிகழ்வுகளைக் குறிக்கும் பன்மையாகவும் வழங்கப்பட்டுள்ளது. எச்சரிப்பின் மீளுரைத்தல் மற்றும் சுதந்தர உருவகம் காக்கப்பட்டுள்ளன.
