reference: Galatians 5:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τῇ ἐλευθερίᾳ ⸂ἡμᾶς Χριστὸς ἠλευθέρωσεν· στήκετε οὖν⸃ καὶ μὴ πάλιν ζυγῷ δουλείας ἐνέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/001.yaml
  text: For freedom Messiah set us free[a]; therefore stand firm[b], and do not again be held by a yoke of slavery.
translation:
  language: ta
  text: விடுதலைக்காக மேசியா நம்மை விடுதலை செய்தார்; ஆகவே உறுதியாக நில்லுங்கள்; மீண்டும் அடிமைத்தனத்தின் நுகத்துக்கு உட்படாதீர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ ἐλευθερίᾳ
  choice: விடுதலைக்காகவே
  rationale: தொடக்க வேற்றுமை வடிவம் நோக்கம் அல்லது விளைவைச் சுருக்கமாகக் குறிக்கக்கூடும். ‘விடுதலைக்காகவே’ என்பது அதன் வலியுறுத்தலையும் சொல்லாட்சியின் இறுக்கத்தையும் காக்கிறது.
- source_word: Χριστὸς
  choice: மேசியா
  rationale: Χριστός இங்கு அபிஷேகம் பெற்ற அரசரைச் சுட்டும் பட்டமாக உள்ளது; ‘மேசியா’ என்பது அதன் யூத மெசியானியச் சூழலைக் காக்கிறது.
- source_word: ἠλευθέρωσεν
  choice: விடுதலையாக்கினார்
  rationale: ἐλευθερόω என்பது விடுதலை செய்வதைக் குறிக்கிறது. ‘விடுதலை’ என்ற தொடக்கப் பெயர்ச்சொல்லுடன் உள்ள மூலமொழிச் சொல்விளையாட்டையும் இத்தேர்வு ஓரளவு காக்கிறது.
- source_word: στήκετε
  choice: உறுதியாக நில்லுங்கள்
  rationale: நிகழ்காலக் கட்டளை தொடர்ந்து உறுதியாக நிற்பதை வலியுறுத்துகிறது; இத்தொடர் நவீனத் தமிழில் இயல்பாகவும் வலிமையாகவும் உள்ளது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய அறிவிப்பிலிருந்து வரும் முடிவைத் தெளிவாகக் குறிக்கிறது.
- source_word: ζυγῷ δουλείας
  choice: அடிமைத்தனத்தின் நுகத்துக்கு
  rationale: ζυγός என்பதன் நுகம் என்ற உருவகத்தையும் δουλεία என்பதன் கடுமையான அடிமை நிலையையும் காக்கிறது.
- source_word: ἐνέχεσθε
  choice: உட்படாதீர்கள்
  rationale: ஒரு கட்டுப்பாட்டுக்கு ஆளாதிருத்தல் அல்லது அதில் சிக்காதிருத்தல் என்ற இடை/செயப்பாட்டு நுணுக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: முந்தைய நிலைக்குத் திரும்புவதைக் குறிக்கும் நேரடியான தமிழ் இணை.
theological_decisions:
- issue: Χριστός என்பதைப் பட்டமாகவா, பெயரைப் போன்ற மரபுச் சொல்லாகவா வழங்குவது
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு விடுதலை அளிப்பவரின் மெசியானியப் பதவி முன்வைக்கப்படுகிறது. ‘மேசியா’ என்பது பட்டத்தின் பொருளையும் யூதச் சூழலையும் வெளிப்படையாகக் காக்கிறது.
- issue: δουλεία என்பதன் வலிமையை எவ்வாறு வழங்குவது
  choice: அடிமைத்தனம்
  alternative: கட்டுண்ட நிலை
  rationale: விடுதலைக்கு நேரெதிரான, ஒருவரை ஆளுகைக்குள் வைத்திருக்கும் கடுமையான நிலையையே மூலச்சொல் குறிக்கிறது; ‘அடிமைத்தனம்’ அந்த வலிமையைத் தக்கவைக்கிறது.
- issue: தொடக்கத் τῇ ἐλευθερίᾳ என்பதன் தொடர்பு
  choice: நோக்கை வலியுறுத்தும் ‘விடுதலைக்காகவே’
  alternative: நிலையைச் சுட்டும் ‘விடுதலையில்’
  rationale: இலக்கண அமைப்பு சுருக்கமானதும் ஒன்றுக்கொன்று நெருக்கமான இரு புரிதல்களுக்கும் இடமளிப்பதுமானதால், முதன்மை வாசிப்பை உரையில் கொடுத்து மாற்றுப் புரிதலை அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நுகம்’ என்ற வேதாகம உருவகம் காக்கப்பட்டாலும், அதைத் தெளிவுபடுத்த ‘அடிமைத்தனம்’ இணைக்கப்பட்டுள்ளது. மூலத்தின் ‘விடுதலை—விடுதலையாக்கினார்’ என்ற ஒத்தசொல் வலியுறுத்தலும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளது.
