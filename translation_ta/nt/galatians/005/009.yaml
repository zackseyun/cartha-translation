source:
  edition: SBLGNT
  text: μικρὰ ζύμη ὅλον τὸ φύραμα ζυμοῖ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/009.yaml
  text: A little leaven leavens the whole batch of dough[a].
translation:
  language: ta
  text: சிறிதளவு புளிப்புமாவு, பிசைந்த மாவு முழுவதையும் புளிக்கச் செய்கிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கொஞ்சம் புளிப்புமாவு மாவுத்திரள் முழுவதையும் புளிக்கவைக்கிறது.”
    reason: ‘φύραμα’ என்பதற்கான ‘மாவுத்திரள்’ என்ற நெருக்கமான சொல்லையும், பழமொழிக்குரிய இன்னும் சுருக்கமான தமிழாக்கத்தையும் காட்டும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: μικρὰ
  choice: சிறிதளவு
  rationale: இங்கு பெயரடை அளவில் குறைவான புளிப்புமாவைக் குறிக்கிறது. ‘சிறிதளவு’ என்பது பழமொழியின் சுருக்கத்தையும் இயல்பான நவீன தமிழையும் காக்கிறது.
- source_word: ζύμη
  choice: புளிப்புமாவு
  rationale: பண்டைய மாவைப் புளிக்கச் செய்யப் பயன்படுத்தப்பட்ட புளித்த மாவுப் பகுதியை இது குறிக்கிறது. ‘ஈஸ்ட்’ என்பதைவிட ‘புளிப்புமாவு’ பண்டைய பொருளையும் வேதாகம உருவகத் தொடர்பையும் தெளிவாகக் காக்கிறது.
- source_word: ὅλον
  choice: முழுவதையும்
  rationale: விளைவு பிசைந்த மாவின் அனைத்துப் பகுதிகளுக்கும் பரவுவதைத் தெளிவாகக் காட்டுகிறது.
- source_word: φύραμα
  choice: பிசைந்த மாவு
  rationale: இச்சொல் கலந்து பிசையப்பட்ட மாவுத்திரளைக் குறிக்கிறது. ‘பிசைந்த மாவு’ என்பது உருவகத்தை நவீன வாசகர்களுக்குத் தெளிவாகவும் இயல்பாகவும் அளிக்கிறது.
- source_word: ζυμοῖ
  choice: புளிக்கச் செய்கிறது
  rationale: காரணவினைப் பொருளை நேரடியாக வெளிப்படுத்தி, புளிப்புமாவு முழு மாவிலும் ஏற்படுத்தும் விளைவைத் துல்லியமாகக் காட்டுகிறது.
theological_decisions:
- issue: பழமொழியின் உருவகப் பொருள்
  choice: புளிப்புமாவும் பிசைந்த மாவும் என்ற நேரடியான உருவகத்தை மட்டும் மொழிபெயர்த்து, அதன் சூழல்சார் பயன்பாட்டை வசனத்துக்குள் விளக்காமல் விடுதல்
  alternative: ‘சிறிதளவு தவறான போதனை முழுச் சமூகத்திலும் பரவுகிறது’ என்று பொருளை வெளிப்படையாக விளக்குதல்
  rationale: பவுல் இவ்வசனத்தில் விளக்கவுரை தராமல் ஒரு பழமொழியையே கூறுகிறார். எனவே அதன் எச்சரிக்கைத் தாக்கத்தையும் உண்மையான உருவகத் திறப்பையும் காக்க, பயன்பாட்டை மொழிபெயர்ப்புக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான பழமொழி நடையும் கண்ணியமான வேதாகம மொழிநடையும் பேணப்பட்டுள்ளன. ‘புளிப்புமாவு’ பொதுவாசகருக்குப் புரியும்படியும் பண்டைய உருவகத்தைத் துல்லியமாகக் காக்கும்படியும் தேர்ந்தெடுக்கப்பட்டது.
