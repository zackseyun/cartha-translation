lexical_decisions:
- source_word: εἰδωλολατρία
  choice: சிலைவழிபாடு
  rationale: சிலைகளையோ உருவங்களையோ தெய்வமாக வழிபடுவதைக் குறிக்கும் சொல்லை, பழமையான சமயக் கலைச்சொல்லைத் தவிர்த்து நவீனத் தமிழில் தெளிவாக வழங்குகிறது.
- source_word: φαρμακεία
  choice: சூனியம்
  rationale: இங்கு மருத்துவத்தைக் குறிக்காமல், மந்திரங்கள் அல்லது மருந்துப் பொருட்களுடன் தொடர்புடைய மறைமந்திரச் செயல்களைக் குறிக்கிறது; ‘சூனியம்’ அந்த எதிர்மறையான மாந்திரிகப் பொருளை இயல்பாகத் தருகிறது.
- source_word: ἔχθραι
  choice: பகைமைகள்
  rationale: பன்மையில் வரும் இச்சொல் பகை உணர்வுகளையும் அவற்றின் வெளிப்பாடுகளையும் குறிக்கிறது; மூலத்தின் பன்மை வடிவமும் காக்கப்படுகிறது.
- source_word: ἔρις
  choice: சச்சரவு
  rationale: வாக்குவாதமும் மோதலும் நிறைந்த உறவுநிலையைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: ζῆλος
  choice: பொறாமை
  rationale: நற்பொருளுடைய ஆர்வம் என்ற சாத்தியம் இச்சூழலில் பொருந்தாது; தீய செயல்களின் பட்டியலில் போட்டி கலந்த பொறாமையே பொருத்தமான பொருள்.
- source_word: θυμοί
  choice: கோப வெடிப்புகள்
  rationale: பன்மை வடிவம் தொடர்ச்சியான மனநிலையைவிட மீண்டும் மீண்டும் திடீரென வெளிப்படும் கோபத்தைக் காட்டுவதால் இவ்வாறு மொழிபெயர்க்கப்படுகிறது.
- source_word: ἐριθεῖαι
  choice: தன்னலமான முனைப்புகள்
  rationale: சொந்த நலனுக்காகத் தன்னை முன்னிறுத்தி செயல்படும் மனப்பாங்கையும் நடத்தையையும் குறிக்கிறது; வெறும் உயர்வை நாடுதல் என்று நேர்மறையாகப் புரிந்துகொள்ளப்படுவதை இது தவிர்க்கிறது.
- source_word: διχοστασίαι
  choice: பிளவுகள்
  rationale: ஒரு சமூகத்தில் மக்கள் எதிரெதிராகப் பிரிந்து நிற்பதைக் குறிக்கும் பரந்த, இயல்பான தமிழ்ச் சொல்.
- source_word: αἱρέσεις
  choice: பிரிவினைக் குழுக்கள்
  rationale: இச்சூழலில் பிற்காலக் கோட்பாட்டுக் கலைச்சொல்லான ‘மதப்புரட்டுகள்’ என்பதைக் காட்டிலும், சமூகத்தைப் பிரிக்கும் அணிகள் அல்லது குழுக்கள் என்ற பொருளே முதன்மையானது.
theological_decisions:
- issue: αἱρέσεις என்பதன் பொருள்
  choice: பிரிவினைக் குழுக்கள்
  alternative: பிரிவுகள்; சமயப் பிரிவுகள்; பிற்காலத் திருச்சபைப் பயன்பாட்டில் ‘மதப்புரட்டுகள்’
  rationale: சுற்றியுள்ள சொற்கள் உறவுகளையும் சமூக ஒற்றுமையையும் சிதைக்கும் தீய செயல்களைப் பட்டியலிடுகின்றன. ஆகவே இங்கு பிரிவினை உண்டாக்கும் குழுக்கள் என்ற சமூகப் பொருள் முதன்மையானது; பிற்காலத் திருச்சபையின் கோட்பாட்டுக் கலைச்சொல்லை மூலத்தில் கட்டாயமில்லாமல் புகுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், வசனத்தின் பட்டியல் அமைப்பையும் சுருக்கத்தையும் காத்து மொழிபெயர்க்கப்பட்டுள்ளது. பாரம்பரியமாக இருந்தாலும் இன்றைய வாசகருக்குக் கடினமான கூட்டுச்சொற்கள் தவிர்க்கப்பட்டுள்ளன; சமூகப் பிளவைச் சுட்டும் சொற்களுக்கிடையிலான வேறுபாடும் இயன்றவரை காக்கப்பட்டுள்ளது.
