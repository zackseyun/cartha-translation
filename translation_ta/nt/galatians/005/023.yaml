translation:
  language: ta
  text: சாந்த குணம், தன்னடக்கம்; இப்படிப்பட்டவற்றுக்கு[a] எதிராக எந்தச் சட்டமும்[b] இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இப்படிப்பட்டவர்களுக்கு எதிராக எந்தச் சட்டமும் இல்லை.” எனினும், இங்கு முன்பு பட்டியலிடப்பட்ட பண்புகளையே இது பெரும்பாலும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இப்படிப்பட்டவற்றுக்கு எதிராகச் சட்டம் இல்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πραΰτης
  choice: சாந்தம்
  rationale: மென்மையும் தாழ்மையும் கொண்ட, கடுமையற்ற பண்பை இச்சொல் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் அறநெறிப் பண்பாகவும் புரியும் வகையில் “சாந்தம்” தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἐγκράτεια
  choice: தன்னடக்கம்
  rationale: ஆசைகளையும் உந்துதல்களையும் ஒருவர் கட்டுப்படுத்துவதைக் குறிக்கும் இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: κατὰ τῶν τοιούτων
  choice: இப்படிப்பட்டவற்றுக்கு எதிராக
  rationale: τοιούτων என்பது இலக்கணப்படி பொருட்களையோ மனிதர்களையோ குறிக்கக்கூடும். இச்சூழலில் முன் பட்டியலிடப்பட்ட ஆவியின் கனியான பண்புகளைக் குறிப்பதே மிக இயல்பானது; இருப்பினும் மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: νόμος
  choice: சட்டம்
  rationale: கிரேக்கத்தில் இச்சொல்லுக்கு குறிப்புச் சுட்டு இல்லை. ஆகவே மோசேயின் சட்டத்தை மட்டும் வெளிப்படையாகக் குறிப்பதுபோல் தோன்றக்கூடிய “நியாயப்பிரமாணம்” என்பதற்குப் பதிலாக, கூற்றின் பரந்த பொருளைக் காக்கும் “சட்டம்” பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: νόμος என்பதன் பொருள் எல்லை
  choice: ஒரு குறிப்பிட்ட சட்டத்தை மட்டும் சுட்டாமல், பரந்த பொருளில் “சட்டம்” என மொழிபெயர்த்தல்
  alternative: மோசேயின் சட்டத்தைச் சிறப்பாகக் குறிக்கும் “நியாயப்பிரமாணம்”
  rationale: கலாத்தியர் கடிதத்தின் பின்னணியில் மோசேயின் சட்டம் கருத்தில் இருக்கலாம். எனினும் கிரேக்கச் சொல்லுக்கு குறிப்புச் சுட்டு இல்லாததால், எந்தச் சட்டமும் இத்தகைய பண்புகளுக்கு எதிரானதல்ல என்ற பரந்த, பழமொழித் தன்மையுள்ள வலிமையை மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டது. “சாந்தம்” மற்றும் “தன்னடக்கம்” ஆகியவை அறநெறிப் பட்டியலின் சுருக்கமான பெயர்ச்சொல் வடிவத்தைப் பேணுகின்றன.
