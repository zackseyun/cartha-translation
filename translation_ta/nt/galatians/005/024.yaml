id: GAL.5.24
reference: Galatians 5:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἱ δὲ τοῦ ⸀Χριστοῦ τὴν σάρκα ἐσταύρωσαν σὺν τοῖς παθήμασιν καὶ ταῖς ἐπιθυμίαις.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/024.yaml
  text: Those who belong to Messiah have crucified the flesh along with its passions and desires[a][b].
translation:
  language: ta
  text: மேசியாவுக்கு உரியவர்களோ[a], சதையை[b] அதன் வேட்கைகளோடும் இச்சைகளோடும் சேர்த்துச் சிலுவையில் அறைந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மேசியா’ என்பதற்குப் பதிலாக ‘கிறிஸ்து’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: b
    text: இங்கு ‘சதை’ என்பது ஆவிக்கு எதிராகச் செயல்படும் வீழ்ச்சியுற்ற மனித இயல்பைக் குறிக்கிறது; சில மொழிபெயர்ப்புகள் இதை ‘பாவ இயல்பு’ என்று தருகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ τοῦ Χριστοῦ
  choice: மேசியாவுக்குரியவர்களோ
  rationale: உடைமை அல்லது உறவுச் சார்பைக் குறிக்கும் τοῦ Χριστοῦ என்பதை இயல்பான தமிழில் ‘மேசியாவுக்குரியவர்கள்’ எனத் தருகிறது. இறுதியிலுள்ள ‘-ஓ’ துகள் δὲ குறிக்கும் மென்மையான வேறுபாட்டை, தனியாக ‘ஆனால்’ என்று மிகைப்படுத்தாமல் வெளிப்படுத்துகிறது.
- source_word: σάρκα
  choice: சதையை
  rationale: பவுலின் உருவகச் சொல்லாட்சியையும் ஆவிக்கு எதிரான ‘சதை’ என்ற இறையியல் பதற்றத்தையும் தக்கவைக்கிறது; ‘பாவ இயல்பு’ என்ற விளக்க மொழிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐσταύρωσαν
  choice: சிலுவையில் அறைந்துவிட்டார்கள்
  rationale: வினைச்சொல்லின் சிலுவை குறித்த வெளிப்படையான படிமத்தைத் தக்கவைக்கிறது. ‘-விட்டார்கள்’ என்பது முடிவுற்ற, தீர்மானமான செயலை இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: σὺν τοῖς παθήμασιν καὶ ταῖς ἐπιθυμίαις
  choice: அதன் உணர்ச்சிவேகங்களோடும் இச்சைகளோடும் சேர்த்து
  rationale: σύν குறிக்கும் உடனிணைப்பை ‘சேர்த்து’ என்பதும் இணைப்புருபுகளும் தெளிவாக்குகின்றன. πάθημα இச்சூழலில் துன்பத்தை அல்ல, வலிமையான உணர்ச்சி உந்துதல்களைக் குறிக்கிறது; ἐπιθυμία என்பது வலுவான இச்சைகளைக் குறிக்கிறது.
theological_decisions:
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு இயேசுவின் அபிஷேகம் பெற்ற அரசர் என்ற பட்டப்பொருளை ‘மேசியா’ வெளிப்படையாகக் காட்டுகிறது; பெயரைப்போன்ற ‘கிறிஸ்து’ என்ற வழக்கமான வடிவமும் சாத்தியம் என்பதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: பவுலின் அறநெறிசார் எதிர்மறை அமைப்பில் σάρξ
  choice: சதை
  alternative: பாவ இயல்பு
  rationale: ‘சதை’ மூல உருவகத்தையும் அதன் இறையியல் பலபொருள் தன்மையையும் பாதுகாக்கிறது. ‘பாவ இயல்பு’ பொருளை விளக்கினாலும், மூலத்தின் உருவகத்தைத் தீர்மானமாக ஒரே பொருளுக்குள் சுருக்கிவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மேசியாவுக்குரியவர்களோ’ என்பது உறவுச் சார்பையும் மென்மையான எதிர்மறை மாற்றத்தையும் சுருக்கமாகத் தருகிறது; ‘சதை’ என்ற பவுலின் முக்கிய உருவகம் விளக்கச் சொல்லால் மாற்றப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
