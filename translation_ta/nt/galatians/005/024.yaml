- from: மேசியாவுக்குரியவர்களோ[a], சதையை[b] அதன் உணர்ச்சிவேகங்களோடும் இச்சைகளோடும் சேர்த்துச் சிலுவையில் அறைந்துவிட்டார்கள்.
  to: மேசியாவுக்கு உரியவர்களோ[a], சதையை[b] அதன் வேட்கைகளோடும் இச்சைகளோடும் சேர்த்துச் சிலுவையில் அறைந்தார்கள்.
  rationale: The revision removes the added completive force in அறைந்துவிட்டார்கள், uses the more idiomatic separated form மேசியாவுக்கு உரியவர்களோ, and replaces the somewhat technical உணர்ச்சிவேகங்கள் with the contextually fitting வேட்கைகள். It preserves the Greek contrast marker, the Messiah terminology policy, Paul’s ‘flesh’ metaphor, and both existing footnote anchors and purposes.
