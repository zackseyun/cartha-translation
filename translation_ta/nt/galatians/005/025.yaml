  text: If we live by the Spirit[a], let us also walk by the Spirit.
translation:
  language: ta
  text: நாம் ஆவியினால் வாழ்கிறோம் என்றால், ஆவிக்கு ஏற்பவும் நடப்போமாக.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “நாம் ஆவியில் வாழ்கிறோம் என்றால், ஆவியோடு ஒத்திசைந்து நடப்போமாக.”'
    reason: πνεύματι என்பதற்கு ‘ஆவியில்’ என்ற இட/உறவு நுணுக்கமும், στοιχῶμεν என்பதற்கு ‘அடியொற்றி, ஒரே வரிசையில் நடத்தல்’ என்ற குறிப்பான பொருளும் இருக்கலாம்.
lexical_decisions:
- source_word: εἰ
  choice: என்றால்
  rationale: கிரேக்க நிபந்தனை அமைப்பை இயல்பான தமிழில் காக்கிறது; சூழல்படி ‘வாழ்கிறபடியால்’ எனப் பொருள் கொள்ள வாய்ப்பிருந்தாலும், அதைத் தீர்மானித்து விடவில்லை.
- source_word: ζῶμεν
  choice: நாம் வாழ்கிறோம்
  rationale: நிகழ்கால வினையின் இயல்பான தமிழ் வடிவம்; இச்சூழலில் ஆவியிடமிருந்து பெறும் வாழ்வைக் குறிக்கிறது.
- source_word: πνεύματι
  choice: ஆவியினால் / ஆவிக்கு ஏற்ப
  rationale: முதல் இடத்தில் வாழ்வின் மூலமோ செயலாக்குபவரோ என்ற கருவிப்பொருளையும், இரண்டாம் இடத்தில் நடத்தையை வழிநடத்தும் நெறியையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: καὶ
  choice: வே
  rationale: வாழ்வுக்கும் அதற்கேற்ற நடத்தைக்கும் இடையிலான வலியுறுத்தப்பட்ட தொடர்பை ‘ஏற்பவே’ என்பதில் வெளிப்படுத்துகிறது.
- source_word: στοιχῶμεν
  choice: நடப்போமாக
  rationale: அறைகூவல் பொருளுடைய subjunctive வடிவத்தைப் பாதுகாக்கிறது. இவ்வினை வரிசையில் செல்லுதல் அல்லது அடியொற்றி நடத்தல் என்ற குறிப்பான நுணுக்கத்தையும் கொண்டுள்ளது; அது அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: πνεύματι என்பதன் குறிப்பு
  choice: தேவ ஆவி
  alternative: மனித ஆவி
  rationale: கலாத்தியர் 5-இல் மாம்சத்துக்கும் ஆவிக்கும் இடையிலான தொடர்ச்சியான எதிர்மறை ஒப்பீடு தேவ ஆவியையே சுட்டுகிறது. தமிழில் ‘ஆவி’ என்ற வடிவம் சூழலால் இதை உணர்த்துகிறது.
- issue: இருமுறை வரும் πνεύματι என்பதன் தத்துவ உறவு
  choice: முதல் பயன்பாட்டில் வாழ்வின் மூலம்; இரண்டாவது பயன்பாட்டில் நடத்தையின் ஒழுங்கு/வழிகாட்டுதல்
  alternative: இரு இடங்களிலும் ஒரே விதமாக ‘ஆவியினால்’
  rationale: ஒரே கிரேக்க தத்திவை இயந்திரமாக ஒரே தமிழ்ச் சொல்லால் தராமல், ζῶμεν மற்றும் στοιχῶμεν ஆகிய வினைகளுடன் அது கொள்ளும் இயல்பான தொடர்புகளை வெளிப்படுத்துகிறது; இருப்பினும் இரண்டிலும் அதே ஆவியே குறிக்கப்படுகிறார்.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான அறைகூவல் நடை. ‘நடப்போமாக’ என்பது வேதாகம நெறிநடத்தை உருவகத்தைத் தக்கவைத்தாலும் பொதுவாகப் புரியக்கூடியது; குறிப்பான ‘keep in step’ நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
