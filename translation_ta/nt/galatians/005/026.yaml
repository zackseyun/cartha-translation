  text: μὴ γινώμεθα κενόδοξοι, ἀλλήλους προκαλούμενοι, ἀλλήλοις φθονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/026.yaml
  text: Let us not become conceited[a], provoking one another, envying one another.
translation:
  language: ta
  text: நாம் தற்பெருமை கொண்டவர்களாகவும், ஒருவரையொருவர் தூண்டிவிடுபவர்களாகவும், ஒருவர்மீது ஒருவர் பொறாமைப்படுபவர்களாகவும் ஆகாதிருப்போமாக[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வீண்பெருமை கொண்டவர்களாக.” கிரேக்கச் சொல் வெறுமையான புகழையோ அடிப்படையற்ற சுயமுக்கியத்துவத்தையோ நாடும் மனப்பான்மையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γινώμεθα
  choice: நாம் ... ஆகாதிருப்போமாக
  rationale: முதல் நபர் பன்மை நிகழ்காலத் துணைவினை வடிவத்துடன் வரும் μή, அனைவரையும் உள்ளடக்கிய தடைசார் அறிவுறுத்தலைக் கொடுக்கிறது. ‘ஆகாதிருப்போமாக’ என்பது அறிவுறுத்தலையும் γίνομαι என்பதன் ‘ஆகுதல்’ என்ற இயக்கநிலையையும் காக்கிறது.
- source_word: κενόδοξοι
  choice: தற்பெருமை கொண்டவர்கள்
  rationale: அடிப்படையற்ற சுயமுக்கியத்துவத்தையும் வெறுமையான புகழ்நாட்டத்தையும் குறிக்கும் சொல்லுக்கு இது இயல்பான, இன்றைய தமிழில் புரியக்கூடிய மொழிபெயர்ப்பு. சொல்லின் ‘வீண் மகிமை’ சார்ந்த நுண்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀλλήλους / ἀλλήλοις
  choice: ஒருவரையொருவர் / ஒருவர்மீது ஒருவர்
  rationale: இரு இடங்களிலும் பரஸ்பரச் செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; பொறாமையின் இலக்கைத் தெளிவாகக் காட்ட ‘ஒருவர்மீது ஒருவர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: προκαλούμενοι
  choice: தூண்டிவிடுகிறவர்களாக
  rationale: மற்றவரை எதிர்வினைக்கோ போட்டிக்கோ வரவழைக்கும் பரந்த பொருளைக் காக்கிறது; வெறும் எரிச்சலூட்டுதல் என்று குறுக்கவில்லை.
- source_word: φθονοῦντες
  choice: பொறாமைப்படுகிறவர்களாக
  rationale: மற்றவரிடம் உள்ளதைக் கண்டு பொறாமை கொள்ளுதல் என்ற φθονέω-வின் பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: முதன்மை அறிவுறுத்தலுக்கும் பங்கேற்பு வினைச்சொற்களுக்கும் உள்ள தொடர்பு
  choice: தற்பெருமையின் உடன்வரும் வெளிப்பாடுகளாக ‘தூண்டிவிடுகிறவர்களாகவும் ... பொறாமைப்படுகிறவர்களாகவும்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஒருவரையொருவர் தூண்டிவிடுவதாலும் பொறாமைப்படுவதாலும் தற்பெருமை கொண்டவர்களாக ஆக வேண்டாம்’ என்று காரண அல்லது வழிமுறைத் தொடர்பாகப் புரிந்துகொள்ளலாம்.
  rationale: கிரேக்க வாக்கியத்தில் κενόδοξοι முதன்மை பயனிலையாகவும், பங்கேற்பு வினைச்சொற்கள் உடன்வரும் நடத்தைகளை விவரிப்பவையாகவும் இயல்பாக அமைகின்றன. அவற்றின் துல்லியமான தர்க்கத் தொடர்பை அளவுக்கு மீறி நிர்ணயிக்காமல் இந்த அமைப்பு காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகப் புரியும் அதேவேளையில் வேதாகம அறிவுறுத்தலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆகாதிருப்போமாக’ அனைவரையும் உள்ளடக்கிய அறிவுறுத்தல் தொனியைத் தக்கவைக்கிறது; இணையான இரு பங்கேற்பு தொடர்களும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
