revisions:
- from: நாம் தற்பெருமை கொண்டவர்களாக ஆகாதிருப்போமாக[a]; ஒருவரையொருவர் தூண்டிவிடுகிறவர்களாகவும், ஒருவர்மீது ஒருவர் பொறாமைப்படுகிறவர்களாகவும் இருக்க வேண்டாம்.
  to: நாம் தற்பெருமை கொண்டவர்களாகவும், ஒருவரையொருவர் தூண்டிவிடுபவர்களாகவும், ஒருவர்மீது ஒருவர் பொறாமைப்படுபவர்களாகவும் ஆகாதிருப்போமாக[a].
  rationale: The revision retains the ingressive, inclusive exhortation of μὴ γινώμεθα (“ஆகாதிருப்போமாக”) and places the three coordinated descriptions under that one frame. This avoids adding a second directive while preserving the Greek participles’ attendant descriptive force. The footnote marker and lexical alternative are retained, with only punctuation normalized for Tamil usage.
  reviewer_model: gpt-5.6-terra
