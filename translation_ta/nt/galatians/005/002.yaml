source:
  edition: SBLGNT
  text: Ἴδε ἐγὼ Παῦλος λέγω ὑμῖν ὅτι ἐὰν περιτέμνησθε Χριστὸς ὑμᾶς οὐδὲν ὠφελήσει.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/002.yaml
  text: 'Look: I[a], Paul, say to you that if you receive circumcision[b], Messiah will benefit you nothing.'
translation:
  language: ta
  text: 'கவனியுங்கள்: பவுலாகிய நான் உங்களுக்குச் சொல்கிறேன்—நீங்கள் விருத்தசேதனம் செய்துகொண்டால்[a], மேசியா[b] உங்களுக்கு எந்தப் பயனும் அளிக்கமாட்டார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் விருத்தசேதனம் செய்யப்பட்டால்” அல்லது “உங்களை விருத்தசேதனம் செய்ய அனுமதித்தால்.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் “கிறிஸ்து”; இங்கு Χριστός ஒரு பட்டமாகச் செயல்படுவதால் “மேசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἴδε
  choice: 'கவனியுங்கள்:'
  rationale: இது கவனத்தை ஈர்க்கும் எச்சரிக்கைச் சொல். ‘கவனியுங்கள்’ என்பது பவுலின் வலியுறுத்தலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐγὼ Παῦλος
  choice: பவுலாகிய நான்
  rationale: வெளிப்படையாக வரும் ‘நான்’ என்ற பதிற்பெயரையும் பவுலின் பெயரையும் தக்கவைத்து, அவரது சுயஅடையாளத்திற்கும் வலியுறுத்தலுக்கும் இடமளிக்கிறது.
- source_word: λέγω ὑμῖν
  choice: உங்களுக்குச் சொல்கிறேன்
  rationale: வினைச்சொல்லின் நேரடித் தன்மையையும் பன்மை முன்னிலையையும் தெளிவாகக் காக்கும் இயல்பான தமிழ்.
- source_word: ἐὰν περιτέμνησθε
  choice: நீங்கள் விருத்தசேதனம் செய்துகொண்டால்
  rationale: நிகழ்காலச் செயல்முறைப் பொருளுடைய செயப்பாட்டு நிபந்தனை வடிவத்தை, அந்தச் சடங்கிற்கு உட்படுவதைச் சுட்டும் இயல்பான தமிழில் தருகிறது; மருத்துவ அல்லது இன அடையாள நடைமுறை அனைத்தையும் பொதுவாகக் கண்டிப்பதாக விரிவுபடுத்தவில்லை.
- source_word: Χριστὸς
  choice: மேசியா
  rationale: இங்கு Χριστός இயேசுவின் பட்டமாகச் செயல்படுவதால், அதன் பட்டப்பொருளைக் காக்க ‘மேசியா’ பயன்படுத்தப்படுகிறது.
- source_word: οὐδὲν ὠφελήσει
  choice: உங்களுக்கு எந்தப் பயனும் அளிக்கமாட்டார்
  rationale: எதிர்காலத்தில் முற்றிலும் பயனற்றதாக இருப்பதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இந்த இடத்தில் சொல் பெயரைப் போல மட்டுமல்லாமல் பட்டமாகவும் பொருள்படுவதால் ‘மேசியா’ அதன் பட்டப்பொருளை வெளிப்படுத்துகிறது; ‘கிறிஸ்து’ என்ற மரபுவழி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: விருத்தசேதனம் குறித்த பவுலின் எச்சரிக்கையின் வரம்பு
  choice: விருத்தசேதனச் சடங்கிற்கு உட்படுவதைக் குறிக்கும் வகையில் மூலவாக்கியத்துக்கு நெருக்கமாக மொழிபெயர்த்தல்
  alternative: எல்லா மருத்துவ அல்லது இன அடையாள விருத்தசேதனத்தையும் நிபந்தனையின்றிக் கண்டிக்கும் வகையில் விரிவுபடுத்தல்
  rationale: உடனடியான சூழல் நியாயப்பிரமாணக் கடமையாக விருத்தசேதனத்தை ஏற்றுக்கொள்வதைப் பற்றியது. வசனத்தில் இல்லாத விளக்கத்தை முதன்மை உரைக்குள் சேர்க்காமல் அதன் இறையியல் இறுக்கம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய மதிப்புமிக்க நேரடி நடை பயன்படுத்தப்பட்டுள்ளது. ‘கவனியுங்கள்’ எச்சரிக்கையின் வலிமையையும், நீண்ட கோடு பவுலின் அறிவிப்பின் திடமான நகர்வையும் வெளிப்படுத்துகின்றன.
