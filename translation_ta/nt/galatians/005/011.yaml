id: GAL.5.11
reference: Galatians 5:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐγὼ δέ, ἀδελφοί, εἰ περιτομὴν ἔτι κηρύσσω, τί ἔτι διώκομαι; ἄρα κατήργηται τὸ σκάνδαλον τοῦ σταυροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/011.yaml
  text: But I[a], brothers, if I am still preaching circumcision[b], why am I still being persecuted? Then the offense of the cross has been removed.
translation:
  language: ta
  text: ஆனால் சகோதரர்களே[a], நான் இன்னும் விருத்தசேதனத்தைப் பிரசங்கிக்கிறேன் என்றால், இன்னும் ஏன் துன்புறுத்தப்படுகிறேன்? அப்படியானால், சிலுவையினால் ஏற்படும் இடறல் அகற்றப்பட்டுவிட்டது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதர சகோதரிகளே” என்றும் பொருள் கொள்ளலாம்; கிரேக்கத்தில் “சகோதரர்கள்” என்ற சொல் ஆண்களும் பெண்களும் சேர்ந்த குழுவை அழைக்கப் பயன்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “சிலுவையினால் ஏற்படும் அவமதிப்பு அகற்றப்பட்டுவிட்டது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: ஆண்பால் பன்மை விளிவடிவத்தை நேரடியாகவும் இயல்பாகவும் தருகிறது; கலந்த பாலின விசுவாசிகள் குழுவையும் இச்சொல் குறிக்கக்கூடும் என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: περιτομήν
  choice: விருத்தசேதனத்தை
  rationale: கலாத்தியர் சூழலில் தோரா அடையாளமாக வலியுறுத்தப்பட்ட நடைமுறையைக் குறிக்கும் நிலையான, துல்லியமான தமிழ் இறையியல் சொல்.
- source_word: ἔτι
  choice: இன்னும்
  rationale: இரு இடங்களிலும் தொடரும் காலநிலையையும் பவுலின் வாதத்தின் முரண்பாட்டையும் காக்கிறது.
- source_word: κηρύσσω
  choice: பிரசங்கிக்கிறேன்
  rationale: பொதுவாக அறிவித்தல் என்ற நிகழ்காலச் செயலை திருச்சபைச் சூழலில் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: διώκομαι
  choice: துன்புறுத்தப்படுகிறேன்
  rationale: நிகழ்காலச் செயப்பாட்டுவினையையும் பகைமையான எதிர்ப்பையும் தெளிவாகத் தருகிறது.
- source_word: ἄρα
  choice: அப்படியானால்
  rationale: முன்வைக்கப்பட்ட நிபந்தனையிலிருந்து வரும் முடிவை இயல்பான தமிழில் காட்டுகிறது.
- source_word: κατήργηται
  choice: அகற்றப்பட்டுவிட்டதே
  rationale: நிறைவேற்றப்பட்ட செயப்பாட்டு வினையின் விளைவுநிலையைத் தருகிறது; இறுதி ‘-தே’ கேள்வியிலிருந்து வரும் வலியுறுத்தப்பட்ட முடிவை இயல்பாக்குகிறது.
- source_word: σκάνδαλον
  choice: இடறல்
  rationale: இடறச்செய்யும் தடையையும் எதிர்ப்பைத் தூண்டும் தன்மையையும் சுருக்கமாகக் காக்கிறது; ‘அவமதிப்பு’ போன்ற ஒரே பொருளுக்குள் சொல்லைச் சுருக்கவில்லை.
- source_word: σταυροῦ
  choice: சிலுவையினால் ஏற்படும்
  rationale: தொடரின் உறவை இயல்பான தமிழில் வெளிப்படுத்தி, இடறலுக்குக் காரணமாகச் சிலுவை இருப்பதைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: கலந்த பாலினக் குழுவை நோக்கிய ἀδελφοί என்ற அழைப்பு
  choice: சகோதரர்களே
  alternative: சகோதர சகோதரிகளே
  rationale: மூலத்தின் ஆண்பால் வடிவத்தை முதன்மை உரையில் காக்கிறது; அதன் உள்ளடக்கும் பயன்பாடு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- issue: σκάνδαλον τοῦ σταυροῦ என்பதன் பொருள்
  choice: சிலுவையினால் ஏற்படும் இடறல்
  alternative: சிலுவையினால் ஏற்படும் அவமதிப்பு
  rationale: σκάνδαλον என்பதிலுள்ள இடறச்செய்யும் தடை மற்றும் மனக்கசப்பு/எதிர்ப்பு ஆகிய பொருள் அழுத்தங்களைத் தீர்த்துவிடாமல் காக்கிறது.
- issue: நிபந்தனை வாக்கியத்தின் வாதத் தன்மை
  choice: நான் இன்னும் விருத்தசேதனத்தைப் பிரசங்கிக்கிறேன் என்றால்
  alternative: நான் இன்னும் விருத்தசேதனத்தைப் பிரசங்கித்துக்கொண்டிருந்தால்
  rationale: εἰ உடன் வரும் நிகழ்காலத்தை நேரடியாகக் காத்து, பவுல் முன்வைக்கும் கூற்றின் வாதரீதியான முரண்பாட்டை வாசகர் உணர அனுமதிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. ‘விருத்தசேதனம்’ என்பது இச்சூழலுக்குத் தேவையான நிலையான இறையியல் சொல். சொல்லுக்கு சொல் கடினத்தன்மையைத் தவிர்த்தாலும், இரு ‘இன்னும்’ வடிவங்களும், செயப்பாட்டுவினையும், சிலுவையின் இடறச்செய்யும் இறையியல் அழுத்தமும் காக்கப்பட்டுள்ளன.
