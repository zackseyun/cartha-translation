  source_fidelity: முக்கியப் பொருள் மூலத்துடன் ஒத்துள்ளது. ஆனால் πέποιθα என்பதற்கு ‘நான் உறுதியாயிருக்கிறேன்’ என்பது பவுலின் நம்பிக்கையைச் சற்றுக் கடுமையான உறுதியாக மாற்றக்கூடும்; ‘நம்பிக்கை கொண்டிருக்கிறேன்’ என்பது துல்லியமானது. ‘வேறெதையும் எண்ணமாட்டீர்கள்’ என்பதில் φρονέω-வின் கருத்து/நிலைப்பாடு சார்ந்த நுணுக்கம் தமிழில் தெளிவாக இல்லை.
