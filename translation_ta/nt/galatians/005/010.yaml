  to: நீங்கள் வேறுவிதமான கருத்தைக் கொள்ளமாட்டீர்கள்[a] என்று ஆண்டவரில், உங்களைப் பற்றி நான் நம்பிக்கை கொண்டிருக்கிறேன். ஆனால் உங்களைக் குழப்புகிறவன், அவன் யாராயிருந்தாலும்[b], அந்தத் தீர்ப்பைச் சுமப்பான்.
  rationale: திருத்தம் πέποιθα என்பதன் நம்பிக்கைப் பொருளைச் சரியாகக் காட்டுகிறது; φρονέω-வின் கருத்து அல்லது நிலைப்பாடு சார்ந்த பொருளை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது; மேலும் b அடிக்குறிப்பை உண்மையான விளக்க/மாற்று வாசிப்பாகச் சீரமைக்கிறது. κρίμα என்பதன் திட்டமிட்ட பரந்த பொருளை ‘தீர்ப்பு’ எனப் பாதுகாக்கிறது.
