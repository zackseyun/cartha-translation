source:
  edition: SBLGNT
  text: ἐγὼ πέποιθα εἰς ὑμᾶς ἐν κυρίῳ ὅτι οὐδὲν ἄλλο φρονήσετε· ὁ δὲ ταράσσων ὑμᾶς βαστάσει τὸ κρίμα, ὅστις ⸀ἐὰν ᾖ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/010.yaml
  text: I am confident in the Lord about you[a], that you will think nothing else; but the one who is troubling you will bear the judgment[b], whoever he may be.
translation:
  language: ta
  text: நீங்கள் வேறுவிதமான கருத்தைக் கொள்ளமாட்டீர்கள்[a] என்று ஆண்டவரில், உங்களைப் பற்றி நான் நம்பிக்கை கொண்டிருக்கிறேன். ஆனால் உங்களைக் குழப்புகிறவன், அவன் யாராயிருந்தாலும்[b], அந்தத் தீர்ப்பைச் சுமப்பான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் வேறு எந்தக் கருத்தையும் கொள்ளமாட்டீர்கள்.” கிரேக்க வினைச்சொல் பொதுவாக எண்ணுவதையும், குறிப்பிட்ட மனப்போக்கு அல்லது கருத்தைக் கொண்டிருப்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவன் யாராக இருந்தாலும்” அல்லது “அவன் எவனாக இருந்தாலும்.” கிரேக்கச் சொற்றொடர் அந்த நபரின் அடையாளம் முக்கியமல்ல என்பதைக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: πέποιθα
  choice: நான் உறுதியாயிருக்கிறேன்
  rationale: இறந்தகால வடிவில் இருந்தாலும் நிகழ்காலத்தில் நிலைத்திருக்கும் நம்பிக்கையைக் குறிக்கும் கிரேக்கப் பயன்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἰς ὑμᾶς
  choice: உங்களைக் குறித்து
  rationale: பவுலின் நம்பிக்கை கலாத்தியர்களின் எதிர்வினையைப் பற்றியது என்பதைத் தெளிவாகக் கூறுகிறது; இயல்பில்லாத சொல்லுக்குச் சொல் வடிவத்தைத் தவிர்க்கிறது.
- source_word: ἐν κυρίῳ
  choice: ஆண்டவரில்
  rationale: பவுலின் நம்பிக்கைக்குரிய உறவுசார் சூழலையோ அடிப்படையையோ முற்றிலும் பிரித்துத் தீர்மானிக்காமல், கிரேக்கச் சொற்றொடரின் இறையியல் செறிவைப் பாதுகாக்கிறது.
- source_word: οὐδὲν ἄλλο φρονήσετε
  choice: நீங்கள் வேறெதையும் எண்ணமாட்டீர்கள்
  rationale: மாற்றான எண்ணத்தையோ நிலைப்பாட்டையோ மறுக்கும் வலிமையைப் பாதுகாக்கும் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: ὁ ταράσσων ὑμᾶς
  choice: உங்களைக் கலங்கடிக்கிறவன்
  rationale: சபையினரிடையே தற்போது குழப்பத்தையும் அமைதியின்மையையும் ஏற்படுத்துகிற நபரைக் குறிக்கும் நிகழ்காலப் பங்கேற்புச் சொல்லின் வலிமையை வெளிப்படுத்துகிறது.
- source_word: βαστάσει τὸ κρίμα
  choice: அந்தத் தீர்ப்பைச் சுமப்பான்
  rationale: ‘சுமத்தல்’ என்ற உருவகத்தைப் பாதுகாத்து, κρίμα என்பது தீர்ப்பா, தண்டனைத் தீர்ப்பா, அதன் விளைவா என்பதைத் தேவையின்றி வரையறுக்காமல் விடுகிறது.
- source_word: ὅστις ἐὰν ᾖ
  choice: அவன் யாராயிருந்தாலும்
  rationale: அந்த நபரின் அடையாளம் அல்லது பதவி எதுவாக இருந்தாலும் எச்சரிக்கை பொருந்தும் என்ற வரையறையற்ற, விட்டுக்கொடுப்புச் சார்ந்த பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: கலாத்தியர்களைப் பற்றிய பவுலின் உறுதியின் இயல்பு
  choice: அவர்களுடைய வருங்கால மனப்போக்கைப் பற்றிய பவுலின் உறுதி ஆண்டவரில் நிலைகொண்டது என்று உரை கூறுகிறது; விளைவு நிபந்தனையற்ற முறையில் உத்தரவாதப்படுத்தப்படுகிறது என்று கூடுதலாகக் கூறவில்லை.
  alternative: எல்லாக் கலாத்தியர்களும் நிச்சயமாக நிலைத்திருப்பார்கள் என்ற முழுமையான உத்தரவாதம்; அல்லது இறையியல் அடிப்படையற்ற தனிப்பட்ட நம்பிக்கை.
  rationale: πέποιθα என்ற தனிப்பட்ட உறுதியையும் ἐν κυρίῳ என்ற ஆண்டவருடனான அடிப்படையையும், எதிர்கால வினைச்சொல்லையும் ஒருங்கே பாதுகாக்கிறது.
- issue: τὸ κρίμα என்பதன் தன்மை
  choice: கலங்கடிப்பவன் எதிர்கொள்ள வேண்டிய தீர்ப்பை பொதுவாகக் கூறுகிறது; அது நித்தியத் தண்டனை என்று குறிப்பாக வரையறுக்கப்படவில்லை.
  alternative: நித்திய அழிவுக்கான தண்டனை; அல்லது வெறும் சமூக விளைவு அல்லது சபை ஒழுங்கு நடவடிக்கை.
  rationale: κρίμα என்பது தீர்ப்பு, நீதித் தீர்ப்பு, அல்லது அதன் தண்டனை விளைவு ஆகியவற்றைக் குறிக்கக்கூடும். ‘தீர்ப்பு’ என்ற சொல் எச்சரிக்கையின் தீவிரத்தைக் காத்தபடி இவ்வசனம் கூறாத விவரத்தைச் சேர்க்காமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆண்டவரில்’ என்ற சுருக்கமான பவுலின் சொற்றொடர் பாதுகாக்கப்பட்டுள்ளது; ‘கலங்கடிக்கிறவன்’ சூழலிலுள்ள குழப்பத்தை இயல்பாக வெளிப்படுத்துகிறது. பாரம்பரிய மதப்பிரிவுசார் சொற்களும் தேவையற்ற விளக்கச் சேர்க்கைகளும் தவிர்க்கப்பட்டுள்ளன.
