id: GAL.5.6
reference: Galatians 5:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐν γὰρ Χριστῷ Ἰησοῦ οὔτε περιτομή τι ἰσχύει οὔτε ἀκροβυστία, ἀλλὰ πίστις δι’ ἀγάπης ἐνεργουμένη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/006.yaml
  text: For in Messiah Jesus neither circumcision nor uncircumcision counts for anything[c][b][a], but faith working through love.
translation:
  language: ta
  text: ஏனெனில், மேசியாவாகிய இயேசுவுக்குள்[a] விருத்தசேதனமோ விருத்தசேதனம் செய்யப்படாத நிலையோ எந்த மதிப்பும் கொண்டதல்ல; மாறாக, அன்பின் வழியாகச் செயல்படும்[c] விசுவாசமே[b] மதிப்புள்ளது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மேசியாவாகிய இயேசுவுக்குள்’ என்பதற்குப் பதிலாக, ‘கிறிஸ்து இயேசுவுக்குள்’ என்றும் மொழிபெயர்க்கலாம். Χριστός என்பது ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற பொருளுடைய பட்டப்பெயர்.
    reason: alternative_reading
  - marker: b
    text: πίστις என்பதை ‘நம்பிக்கை’ அல்லது ‘விசுவாசத்தன்மை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘அன்பின் வழியாகச் செயல்படும்’ என்பதை ‘அன்பின் வழியாகச் செயலாற்றும்,’ ‘அன்பின் வழியாகத் தன்னை வெளிப்படுத்தும்,’ அல்லது ‘அன்பின் வழியாகச் செயல்திறன் பெறும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν γὰρ Χριστῷ Ἰησοῦ
  choice: ஏனெனில், மேசியாவாகிய இயேசுவுக்குள்
  rationale: γάρ முந்தைய கருத்துக்கான காரணத்தை அறிமுகப்படுத்துவதால் ‘ஏனெனில்’ என மொழிபெயர்க்கப்பட்டது. ἐν என்பதற்கு ‘-க்குள்’ என்று கொடுத்து, பவுலின் மேசியாவுடனான ஒன்றிப்பைக் குறிக்கும் மொழியைத் தக்கவைத்துள்ளது. Χριστός என்பதன் பட்டப்பெயர் சார்ந்த பொருளை ‘மேசியா’ வெளிப்படுத்துகிறது.
- source_word: περιτομή
  choice: விருத்தசேதனம்
  rationale: யூத உடன்படிக்கை மற்றும் அடையாளப் பின்னணியையும் சடங்கின் நேரடிப் பொருளையும் தக்கவைக்கும் நிலையான தமிழ் வேதாகமச் சொல்.
- source_word: ἀκροβυστία
  choice: விருத்தசேதனம் செய்யப்படாத நிலை
  rationale: περιτομή என்பதற்கு இணையான எதிர்நிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ஒரு மக்கள் குழுவைக் காட்டிலும் அந்த நிலையையே முன்னிறுத்துகிறது.
- source_word: τι ἰσχύει
  choice: எந்த மதிப்பும் கொண்டதல்ல
  rationale: இங்கு ἰσχύει உடல் வலிமையை அல்ல, பொருந்தும் மதிப்பு அல்லது செயல்திறனைச் சுட்டுகிறது. தமிழ் வாசகருக்கு இயல்பாகப் புரியும்படி, இரு அடையாள நிலைகளும் தீர்மானிக்கும் மதிப்பற்றவை என்ற கருத்தைத் தருகிறது.
- source_word: ἀλλὰ
  choice: மாறாக
  rationale: மதிப்பற்ற இரு நிலைகளுக்கும் உண்மையில் மதிப்புடைய விசுவாசத்துக்கும் இடையிலான வலுவான முரண்பாட்டைக் காட்டுகிறது.
- source_word: πίστις
  choice: விசுவாசம்
  rationale: πίστις என்பதற்கான வழக்கமான, பரவலாகப் புரிந்துகொள்ளப்படும் தமிழ் இறையியல் சொல்; ‘நம்பிக்கை’ அல்லது ‘நம்பகத்தன்மை’ என்ற சாத்திய நுணுக்கங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: δι’ ἀγάπης
  choice: அன்பின் வழியாக
  rationale: διά + genitive காட்டும் வழிமுறை அல்லது ஊடகப் பொருளை காரணமாக மிகைப்படுத்தாமல் தக்கவைக்கிறது.
- source_word: ἐνεργουμένη
  choice: செயல்படும்
  rationale: நிகழ்கால நடு/செயப்பாட்டு வடிவத்தின் தெளிவின்மையை ஓரளவு தக்கவைத்து, விசுவாசம் அன்பின் வழியாகச் செயலாற்றுவதைக் கூறுகிறது; ‘தன்னை வெளிப்படுத்தும்’ அல்லது ‘செயல்திறன் பெறும்’ என ஒருதலைப்பட்சமாகத் தீர்மானிக்கவில்லை.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியாவாகிய
  alternative: கிறிஸ்துவாகிய
  rationale: இங்கு Χριστός இயேசுவின் பட்டப்பெயராகச் செயல்படுவதால் அதன் பொருளை வெளிப்படுத்தும் ‘மேசியா’ தேர்ந்தெடுக்கப்பட்டது; தமிழ் இலக்கணத்திற்காக ‘-வாகிய’ இணைக்கப்பட்டது.
- issue: πίστις என்பதன் பொருள்
  choice: விசுவாசம்
  alternative: நம்பிக்கை; நம்பகத்தன்மை
  rationale: இவ்வசனத்தில் அன்பின் வழியாகச் செயல்படுவது விசுவாசம் எனக் கூறப்படுகிறது. மூலச்சொல்லின் விரிவான பொருள் வரம்பை முதன்மை உரையில் ஒரே விளக்கமாகத் தீர்க்காமல், மாற்றுகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- issue: ἐνεργουμένη என்பதன் நடு/செயப்பாட்டு தெளிவின்மை
  choice: செயல்படும்
  alternative: செயலாற்றும்; அன்பின் வழியாகத் தன்னை வெளிப்படுத்தும்; செயல்திறன் பெறும்
  rationale: கிரேக்க வடிவம் நடுவினை அல்லது செயப்பாட்டு நுணுக்கத்தை அனுமதிக்கிறது. ‘செயல்படும்’ என்பது விசுவாசத்துக்கும் அன்புக்கும் உள்ள உறவைப் பாதுகாத்து, விசுவாசத்தின் செயற்பாடு குறித்த விவாதத்தைத் தேவையின்றித் தீர்மானிக்காது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘விருத்தசேதனம்’ மற்றும் ‘விசுவாசம்’ ஆகியவை பரவலாக அறியப்பட்ட வேதாகமச் சொற்களாகத் தக்கவைக்கப்பட்டுள்ளன. மூலத்தின் எதிர்மறை–நேர்மறை அமைப்பு அரைப்புள்ளி மற்றும் ‘மாறாக’ என்பதன் மூலம் தெளிவாக்கப்பட்டுள்ளது.
