source:
  edition: SBLGNT
  text: ὁ γὰρ πᾶς νόμος ἐν ἑνὶ λόγῳ ⸀πεπλήρωται, ἐν τῷ· Ἀγαπήσεις τὸν πλησίον σου ὡς ⸀σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/014.yaml
  text: 'For the whole law is fulfilled in one statement: “You shall love your neighbor as yourself.”[a][b]'
translation:
  language: ta
  text: ஏனெனில், முழுத் திருச்சட்டமும், “உன்னைப் போலவே உன் அயலாரையும் நேசிக்க வேண்டும்” என்ற ஒரே கூற்றில்[a] நிறைவேறியுள்ளது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஒரே சொல்லில்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் எழுத்துப்படி “ஒரே சொல்/கூற்று” என்று உள்ளது; இங்கு அது ஒரே வாசகத்தையோ கட்டளையையோ குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “நிறைவேறியிருக்கிறது” என்றும், விளக்கமாக “தொகுத்துக் கூறப்பட்டுள்ளது” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் நேரடியாக “நிறைவேறியுள்ளது” என்று பொருள்படுகிறது; இந்தக் கட்டளையில் திருச்சட்டத்தின் நோக்கம் முழுமையை அடைகிறது என்பதையும் அது உணர்த்தக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ γὰρ
  choice: ஏனெனில்
  rationale: γάρ முந்தைய அறிவுறுத்தலுக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்துகிறது; “ஏனெனில்” தமிழில் இந்தத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: πᾶς νόμος
  choice: திருச்சட்டம் முழுவதும்
  rationale: ஒருமையில் குறிப்பிட்டுச் சொல்லப்படும் νόμος சட்டத்தை ஒரு முழுமையாகக் குறிக்கிறது. “முழுவதும்” என்பது πᾶς என்பதன் விரிவான வலிமையைப் பாதுகாக்கிறது; எந்தப் பகுதியையும் மட்டும் என்று மொழிபெயர்ப்பு வரையறுக்கவில்லை.
- source_word: ἐν ἑνὶ λόγῳ
  choice: ஒரே கூற்றில்
  rationale: λόγος இங்கு தனியொரு சொல்லை அல்ல, தொடர்ந்து மேற்கோளிடப்படும் ஒரு கூற்றை அல்லது கட்டளையைக் குறிக்கிறது. ஆகவே “ஒரே கூற்றில்” என்பது நவீன தமிழில் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: πεπλήρωται
  choice: நிறைவேறியிருக்கிறது
  rationale: நிறைவேற்றப்பட்டதன் விளைவாகத் தொடரும் தற்போதைய நிலையை perfect passive வடிவம் உணர்த்துகிறது. “நிறைவேறியிருக்கிறது” என்பது அந்த வினையின் வலிமையைப் பாதுகாக்கிறது; வெறுமனே “தொகுத்துக் கூறப்பட்டுள்ளது” என்று பொருளைச் சுருக்கவில்லை.
- source_word: ἐν τῷ
  choice: என்ற … கூற்றில்
  rationale: இந்த அமைப்பு நிறைவேற்றம் எதில் இருக்கிறது என்பதைத் தொடர்ந்து வரும் மேற்கோள் மூலம் விளக்குகிறது. இயல்பான தமிழுக்காக மேற்கோளை “என்ற … கூற்றில்” என்ற அமைப்புடன் இணைத்துள்ளோம்.
- source_word: Ἀγαπήσεις
  choice: நேசிக்க வேண்டும்
  rationale: இது லேவியராகமம் 19:18-இலிருந்து மேற்கோளிடப்படும் கட்டளைக்குரிய எதிர்கால வினைவடிவம். “நேசிக்க வேண்டும்” என்பது அதன் கட்டளை வலிமையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὸν πλησίον σου
  choice: உன் அயலாரையும்
  rationale: இந்த அறச்சூழலில் πλησίον என்பது “அயலார்” அல்லது அருகிலுள்ள சக மனிதரைக் குறிக்கிறது. “அயலார்” வேதாகம மேற்கோளுடனும் பொதுவான தமிழ் பயன்பாட்டுடனும் பொருந்துகிறது.
- source_word: ὡς σεαυτόν
  choice: உன்னைப் போலவே
  rationale: ஒப்புமையின் வலிமையை “போலவே” இயல்பாகவும் துல்லியமாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: அன்புக் கட்டளைக்கும் திருச்சட்டம் முழுவதற்கும் உள்ள தொடர்பு
  choice: திருச்சட்டம் முழுவதும் அயலாரை நேசிக்கும் கட்டளையில் நிறைவேறியிருக்கிறது
  alternative: திருச்சட்டம் முழுவதும் இந்தக் கட்டளையில் தொகுத்துக் கூறப்பட்டுள்ளது
  rationale: πληρόω என்பதன் முதன்மையான வலிமை வெறும் சுருக்கத்தைக் காட்டிலும் நிறைவேற்றத்தைக் குறிக்கிறது. அதேவேளை, இக்கூற்று சட்டம் ஒழிக்கப்பட்டது என்ற முடிவையோ, அறநெறிப் பகுதிகள் மட்டுமே குறிக்கப்படுகின்றன என்ற வரையறையையோ மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. “நேசிக்க வேண்டும்” என்பது பழமையான கட்டளை வடிவங்களைத் தவிர்த்து மேற்கோளின் கட்டளை வலிமையைப் பாதுகாக்கிறது; “திருச்சட்டம்” என்பது இச்சூழலில் νόμος என்பதற்கான தெளிவான வேதாகமத் தமிழ் வழக்கு.
