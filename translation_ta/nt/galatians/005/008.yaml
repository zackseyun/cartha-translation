  text: ἡ πεισμονὴ οὐκ ἐκ τοῦ καλοῦντος ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/008.yaml
  text: This persuasion is not from the one who calls you[a].
translation:
  language: ta
  text: இந்த இணங்கவைப்பு[a] உங்களை அழைக்கிறவரிடமிருந்து வந்ததல்ல.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தச் செல்வாக்கு உங்களை அழைக்கிறவரிடமிருந்து வந்ததல்ல.”
    reason: πεισμονή என்பது இணங்கவைத்தல் அல்லது அதற்குக் காரணமான செல்வாக்கைக் குறிக்கக்கூடும் என்பதைக் காட்டும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: πεισμονὴ
  choice: இப்படி இணங்கிப்போனது
  rationale: இந்த அரிய பெயர்ச்சொல், ஒருவரால் இணங்கச் செய்யப்படுவதையோ அதனால் ஏற்பட்ட மனநிலையையோ குறிக்கலாம். முந்தைய வசனத்தின் சூழலில் கலாத்தியர்கள் வேறொரு செய்திக்கு இணங்கிப்போன நிலையைக் குறிக்க, இயல்பான நவீனத் தமிழில் இவ்வாறு மொழிபெயர்க்கப்பட்டது; ‘போதனை’ போன்ற பொருளை மூலத்தில் இல்லாமல் சேர்ப்பதும் தவிர்க்கப்பட்டது.
- source_word: ἐκ
  choice: இருந்து வந்தது
  rationale: ἐκ இங்கு தோற்றுவாய் அல்லது மூலத்தைக் குறிக்கிறது. தமிழில் ‘...இடமிருந்து வந்தது’ என்பது அந்த உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τοῦ καλοῦντος ὑμᾶς
  choice: உங்களை அழைக்கிறவரிடமிருந்து
  rationale: நிகழ்காலப் பங்கேற்புப் பெயரெச்சத்தின் பெயர்ச்சொல் செயல்பாட்டையும் தொடர்ந்து அழைக்கும் செயற்பொருளையும் இது காக்கிறது. மூலத்தில் ‘கடவுள்’ என்று நேரடியாக இல்லாததால் அதைச் சேர்க்கவில்லை.
- source_word: οὐκ
  choice: அல்ல
  rationale: பவுலின் நேரடியான மறுப்பைத் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: ‘உங்களை அழைக்கிறவர்’ என்பவரின் அடையாளம்
  choice: மூலத்தைப் போலவே ‘உங்களை அழைக்கிறவர்’ என்று குறிப்பிடப்பட்டது.
  alternative: ‘உங்களை அழைக்கிற கடவுள்’ என்று வெளிப்படையாக விரித்துரைத்தல்.
  rationale: பரந்த சூழலில் இது கடவுளைக் குறிப்பதாக வலுவாகத் தெரிந்தாலும், கிரேக்க மூலத்தில் ‘கடவுள்’ என்ற பெயர்ச்சொல் இல்லை. ஆகவே வாசகர் சூழலிலிருந்து அடையாளம் காணுமாறு மூலத்தின் சொல்லமைப்பு காக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியக்கூடிய அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. அரிய கிரேக்கப் பெயர்ச்சொல்லை செயற்பண்புள்ள தமிழ்த் தொடராக வழங்கி இயல்புத்தன்மையும் மூலப்பொருளின் தெளிவின்மையும் சமநிலைப்படுத்தப்பட்டுள்ளன.
