- from: இப்படி இணங்கிப்போனது[a] உங்களை அழைக்கிறவரிடமிருந்து வந்ததல்ல.
  to: இந்த இணங்கவைப்பு[a] உங்களை அழைக்கிறவரிடமிருந்து வந்ததல்ல.
  rationale: The revision removes the unexpressed “இப்படி” and replaces the completed-result wording with a compact abstract noun, preserving the lexical range of πεισμονή while retaining the source expression and the Greek’s indirect designation of the caller.
