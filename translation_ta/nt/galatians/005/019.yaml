id: GAL.5.19
reference: Galatians 5:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: φανερὰ δέ ἐστιν τὰ ἔργα τῆς σαρκός, ἅτινά ⸀ἐστιν πορνεία, ἀκαθαρσία, ἀσέλγεια,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/019.yaml
  text: 'The works of the flesh are evident: sexual immorality[a], impurity, sensuality,'
translation:
  language: ta
  text: 'மாம்சத்தின்[a] செயல்களோ வெளிப்படையானவை. அவையாவன: பாலியல் ஒழுக்கக்கேடு, அசுத்தம், வெட்கங்கெட்ட நடத்தை,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாவ இயல்பின்.” இதற்கான கிரேக்கச் சொல் “மாம்சம்” (σάρξ). இங்கே பவுல் அதை, பாவத்தால் சீர்கெட்ட மனித ஆசைகளையும் மனப்போக்கையும் குறிக்கும் உருவகமாகப் பயன்படுத்துகிறார்.
    reason: மூல உருவகத்தைக் காத்தபடி, சூழலுக்குரிய மாற்று விளக்கத்தை வழங்குதல்.
lexical_decisions:
- source_word: φανερὰ
  choice: வெளிப்படையானவை
  rationale: தெளிவாகக் காணக்கூடியவை அல்லது அறியக்கூடியவை என்ற பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: δέ
  choice: செயல்களோ என்பதிலுள்ள -ஓ
  rationale: முந்தைய கருத்திலிருந்து வரும் மெல்லிய மாற்றத்தையும் வேறுபாட்டையும், தேவையற்ற வலுவான ‘ஆனால்’ என்பதைக் கூட்டாமல், தமிழின் தலைப்புச் சார்ந்த எதிர்மறை நுணுக்கத்தால் காட்டுகிறது.
- source_word: τὰ ἔργα
  choice: செயல்கள்
  rationale: ἔργα என்பதன் செயல்/செய்கை சார்ந்த பொருளை எளிய தமிழில் தருவதோடு, தொடர்ந்து வரும் பட்டியலோடும் இயல்பாக இணைகிறது.
- source_word: τῆς σαρκός
  choice: மாம்சத்தின்
  rationale: பவுலின் மாம்சம்–ஆவி என்ற பொருள் நிறைந்த எதிர்மறையைத் தக்கவைத்து, அதை ஒரே விளக்கமாகச் சுருக்காமல் மூல உருவகத்தைக் காக்கிறது.
- source_word: ἅτινά ἐστιν
  choice: 'அவையாவன:'
  rationale: பின்வரும் எடுத்துக்காட்டுப் பட்டியலைத் தெளிவாகவும் சுருக்கமாகவும் அறிமுகப்படுத்துகிறது.
- source_word: πορνεία
  choice: பாலியல் ஒழுக்கக்கேடு
  rationale: தவறான பாலியல் நடத்தைகளைப் பரந்த வகையில் குறிக்கும் சொல்லை, குறுகிய அல்லது பழமையான சொல்லாக்கமின்றி நவீன வாசகருக்குத் தெளிவாகத் தருகிறது.
- source_word: ἀκαθαρσία
  choice: அசுத்தம்
  rationale: இங்கு உள்ள ஒழுக்கரீதியான தூய்மையின்மையைச் சுருக்கமாகவும் வழக்கமான தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: ἀσέλγεια
  choice: வெட்கங்கெட்ட நடத்தை
  rationale: வெட்க உணர்வின்றி எல்லை மீறும் தன்னிச்சையான நடத்தையைக் குறிக்கும் பரந்த பொருளைத் தக்கவைக்கிறது; இதை பாலியல் காமத்திற்கு மட்டும் தேவையின்றிக் குறுக்கவில்லை.
theological_decisions:
- issue: பவுலின் ஒழுக்கப் போதனையில் σάρξ என்பதன் மொழிபெயர்ப்பு
  choice: மாம்சம்
  alternative: பாவ இயல்பு
  rationale: இச்சூழலில் மனிதனின் பாவச் சார்பை உருவகமாகக் குறித்தாலும், ‘மாம்சம்’ என்பது பவுலின் சொல் உருவகத்தையும் மாம்சம்–ஆவி என்ற இறையியல் இழுபறியையும் காக்கிறது. ‘பாவ இயல்பு’ என்பது சாத்தியமான விளக்கமாக அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. δέ என்பதன் மெல்லிய மாற்றம் ‘செயல்களோ’ மூலம் வெளிப்படுத்தப்பட்டுள்ளது. பட்டியல் அடுத்த வசனத்தில் தொடருவதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
