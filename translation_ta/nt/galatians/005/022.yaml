lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனங்களில் கூறப்பட்ட மாம்சத்தின் செயல்களுக்கு எதிர்மாறாக ஆவியானவரின் கனியை அறிமுகப்படுத்தும் முரண்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: καρπὸς
  choice: கனி
  rationale: பவுலின் உருவகத்தை நேரடியாகப் பாதுகாக்கிறது; ஒருமை வடிவம் இந்தப் பண்புகளை ஒருங்கிணைந்த விளைவாகக் காட்டுகிறது.
- source_word: τοῦ πνεύματός
  choice: ஆவியானவரின்
  rationale: சுற்றியுள்ள பகுதியில் மாம்சத்தோடு வேறுபடுத்தப்படுவது தூய ஆவியானவர் என்பதைக் கருத்தில் கொண்டு, தமிழில் அந்த ஆள்தன்மையுள்ள இறைச் சுட்டலைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἀγάπη
  choice: அன்பு
  rationale: இச்சொல்லின் விரிவான உறவியல் மற்றும் ஒழுக்கப் பொருளை இயல்பாகத் தரும் பொதுவான நவீனத் தமிழ் இணைச்சொல்.
- source_word: χαρά
  choice: மகிழ்ச்சி
  rationale: நற்பண்புப் பட்டியலில் இயல்பாகவும் சுருக்கமாகவும் வரும் நவீனத் தமிழ் சொல்.
- source_word: εἰρήνη
  choice: சமாதானம்
  rationale: உள்ளார்ந்த அமைதியையும் உறவுகளிலான சமாதானத்தையும் தேவையின்றி குறுக்காமல் தக்கவைக்கிறது.
- source_word: μακροθυμία
  choice: பொறுமை
  rationale: நீண்டகாலம் சகித்திருக்கும் பண்பை நவீன வாசகர்களுக்கு தெளிவாகக் கூறுகிறது; பழமையான அல்லது மிக விரிவான சொற்றொடரைத் தவிர்க்கிறது.
- source_word: χρηστότης
  choice: கனிவு
  rationale: பிறரிடம் நன்மையாகவும் இரக்கத்துடனும் நடக்கும் பண்பை இயல்பான தமிழில் வேறுபடுத்திக் காட்டுகிறது.
- source_word: ἀγαθωσύνη
  choice: நற்குணம்
  rationale: பரந்த ஒழுக்க நன்மையைச் சுட்டுகிறது; முந்தைய ‘கனிவு’ என்பதிலிருந்து போதிய வேறுபாட்டையும் காக்கிறது.
- source_word: πίστις
  choice: விசுவாசம்
  rationale: πίστις என்பதற்கான மரபானதும் பரவலாகப் புரிந்துகொள்ளப்படுவதுமான தமிழ் இணைச்சொல்; இங்கு ‘நம்பகத்தன்மை’ என்பதும் சாத்தியம் என்பதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: πνεῦμα என்பதன் குறிப்பு
  choice: தூய ஆவியானவரைக் குறிக்கும் வகையில் ‘ஆவியானவர்’
  alternative: மனித ஆவி
  rationale: கலாத்தியர் 5-இல் மாம்சத்துக்கும் ஆவிக்கும் இடையிலான உடனடித் தொடர்பும் பவுலின் விரிவான வாதமும், இது வெறும் மனித ஆவியைக் காட்டிலும் தூய ஆவியானவரின் செயலைக் குறிக்கிறது என்பதை ஆதரிக்கின்றன.
- issue: நற்பண்புப் பட்டியலில் πίστις என்பதன் பொருள்
  choice: விசுவாசம்
  alternative: நம்பகத்தன்மை
  rationale: πίστις என்பது விசுவாசம், நம்பிக்கை, நம்பகத்தன்மை ஆகிய பொருட்களைத் தரக்கூடும். இங்கு இரு வாசிப்புகளும் சாத்தியமானதால் முதன்மை உரையில் ‘விசுவாசம்’ வைக்கப்பட்டு மற்றொரு பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமப் பாங்கின் கண்ணியத்தைத் தக்கவைத்தும் மொழிபெயர்க்கப்பட்டுள்ளது. பட்டியலின் இயல்பான ஓட்டத்திற்காக இறுதியில் ‘ஆகியவையாகும்’ சேர்க்கப்பட்டுள்ளது; மூலத்தின் ஒருமையான ‘கனி’ மாற்றப்படவில்லை.
