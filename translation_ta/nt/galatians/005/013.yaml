  revised_text: ஏனெனில், சகோதரர்களே[a], நீங்கள் விடுதலைக்காக அழைக்கப்பட்டீர்கள்[b]; ஆனால் உங்கள் விடுதலையை மாம்சத்திற்கான வாய்ப்பாகப் பயன்படுத்தாதீர்கள்[c]. மாறாக, அன்பினால் ஒருவருக்கொருவர் சேவை செய்யுங்கள்[d].
