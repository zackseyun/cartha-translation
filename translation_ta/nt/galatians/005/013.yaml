source:
  edition: SBLGNT
  text: Ὑμεῖς γὰρ ἐπ’ ἐλευθερίᾳ ἐκλήθητε, ἀδελφοί· μόνον μὴ τὴν ἐλευθερίαν εἰς ἀφορμὴν τῇ σαρκί, ἀλλὰ διὰ τῆς ἀγάπης δουλεύετε ἀλλήλοις·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/013.yaml
  text: For you were called to freedom[a], brothers; only do not use your freedom as an opportunity for the flesh[d][c][b], but through love serve one another.
translation:
  language: ta
  text: ஏனெனில், சகோதரர்களே[a], நீங்கள் விடுதலைக்காக அழைக்கப்பட்டீர்கள்[b]; ஆனால் உங்கள் விடுதலையை மாம்சத்திற்கான வாய்ப்பாகப் பயன்படுத்தாதீர்கள்[c]. மாறாக, அன்பினால் ஒருவருக்கொருவர் சேவை செய்யுங்கள்[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதரர்களே” என்பது கிரேக்கத்தில் ஆண்பால் பன்மையாக இருந்தாலும், இக்கடிதத்தில் பெண்கள் உட்பட முழு விசுவாசக் குழுவையும் நோக்கிய அழைப்பாகப் பயன்படுத்தப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: “விடுதலைக்காக” என்பதைக் “விடுதலைக்கென்று” அல்லது “விடுதலைக்குள்” என்றும் புரிந்துகொள்ளலாம்; கிரேக்கச் சொற்றொடர் அழைப்பின் நோக்கம், அடிப்படை அல்லது விளைவுநிலை ஆகிய நுணுக்கங்களைத் தாங்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: “வாய்ப்பு” என்பதற்கான கிரேக்கச் சொல் ஒரு சந்தர்ப்பம் அல்லது செயல்படுவதற்கான தளத்தைக் குறிக்கலாம். இங்கு “மாம்சம்” என்பது வெறும் உடலை மட்டும் குறிக்கவில்லை; கடவுளுக்கு எதிராகத் தன்னையே மையப்படுத்தும், பாவத்தால் வழிநடத்தப்படும் மனித உந்துதல்களையும் குறிக்கிறது. சில மொழிபெயர்ப்புகள் இதை “பாவ இயல்பு” என்று விளக்குகின்றன.
    reason: alternative_reading
  - marker: d
    text: “சேவை செய்யுங்கள்” என்பதற்கான கிரேக்க வினைச்சொல் “அடிமை” என்ற சொல்லோடு தொடர்புடையது; அன்பினால் ஒருவருக்கொருவர் தம்மை அர்ப்பணித்துப் பணியாற்றும் வலுவான கருத்தை இது தருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: நீங்கள்
  rationale: வலியுறுத்தலுடன் வெளிப்படையாக உள்ள இரண்டாம் நபர் பன்மைப் பெயர்ச்சொல்லை இயல்பான தமிழில் நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கருத்துக்கு விளக்கம் அல்லது ஆதாரம் தரும் இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐπ’ ἐλευθερίᾳ
  choice: விடுதலைக்காக
  rationale: அழைப்பின் நோக்கம் அல்லது இலக்காக விடுதலையைச் சுட்டும் சொற்றொடரை இயல்பான தமிழில் தருகிறது; அதன் இலக்கண நுணுக்கம் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ἐκλήθητε
  choice: அழைக்கப்பட்டீர்கள்
  rationale: இறைவனுடைய அழைப்பைக் குறிக்கும் செயப்பாட்டு வடிவத்தை எந்தக் குறிப்பிட்ட இறையியல் அமைப்பையும் திணிக்காமல் காக்கிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: கிரேக்கத்தின் ஆண்பால் பன்மை அழைப்புமுறையைப் பாதுகாக்கிறது; முழு விசுவாசக் குழுவையும் உள்ளடக்கும் பயன்பாடு அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: μόνον
  choice: ஆனால்
  rationale: விடுதலையைப் பற்றிய கூற்றுக்குப் பின்வரும் கட்டுப்படுத்தும் எச்சரிக்கையைத் தமிழில் இயல்பாக அறிமுகப்படுத்துகிறது; சொற்சொல்லான ‘மட்டும்’ இங்கு தவறான சொல்லுறுப்பை வலியுறுத்தக்கூடும்.
- source_word: μὴ...εἰς ἀφορμὴν
  choice: ஒரு வாய்ப்பாக ஆக்காதீர்கள்
  rationale: விடுதலையைத் தவறான நோக்கத்துக்கான தொடக்கப் புள்ளியாக அல்லது சந்தர்ப்பமாக மாற்ற வேண்டாம் என்ற எச்சரிக்கையைத் தெளிவாகச் சொல்கிறது.
- source_word: σάρξ
  choice: மாம்சம்
  rationale: பவுலின் இறையியல் நிறைந்த உருவகச் சொல்லை விளக்கவுரையாக மாற்றாமல் காக்கிறது; இங்கு வெறும் உடலைக் குறிக்காத பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: διὰ τῆς ἀγάπης
  choice: அன்பின் வழியாக
  rationale: διά உடன் வரும் கருவி அல்லது வழிமுறை சார்ந்த நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: δουλεύετε
  choice: அடிமையாகச் சேவை செய்யுங்கள்
  rationale: வெறும் பொதுவான உதவியை விட, அடிமைப் பணியோடு தொடர்புடைய வலுவான வினைச்சொல் உருவகத்தைத் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἀλλήλοις
  choice: ஒருவருக்கொருவர்
  rationale: பரஸ்பர உறவைச் சுட்டும் இயல்பான நவீனத் தமிழ் வடிவம்.
theological_decisions:
- issue: கலந்த பாலின விசுவாசக் குழுவை நோக்கிய ἀδελφοί என்ற அழைப்பு
  choice: சகோதரர்களே
  alternative: சகோதர சகோதரிகளே
  rationale: மூலத்தின் இலக்கண ஆண்பால் வடிவத்தை முதன்மை உரையில் காக்கிறது; பெண்களையும் உள்ளடக்கிய சமூகப் பயன்பாட்டை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
- issue: பவுலின் ஒழுக்கவியல் சூழலில் σάρξ என்பதன் பொருள்
  choice: மாம்சம்
  alternative: பாவ இயல்பு
  rationale: உடல், மனித பலவீனம், பாவத்தால் வழிநடத்தப்படும் உந்துதல்கள் ஆகியவற்றுக்கிடையிலான பவுலின் சொற்பொருள் நெருக்கடியை ஒரே விளக்கமாகச் சுருக்காமல் பாதுகாக்கிறது.
- issue: δουλεύετε என்பதில் உள்ள அடிமைப் பணி உருவகம்
  choice: அடிமையாகச் சேவை செய்யுங்கள்
  alternative: ஒருவருக்கொருவர் சேவை செய்யுங்கள்
  rationale: அன்பினால் பிறருக்குத் தம்மை ஒப்புக்கொடுத்து பணிபுரிதல் என்ற வலுவான முரண்பாட்டை—விடுதலையும் தன்னார்வ அடிமைப் பணியும்—மூலத்தைப் போலவே காக்கிறது.
- issue: ἐπ’ ἐλευθερίᾳ என்பதன் தொடர்பு
  choice: விடுதலைக்காக
  alternative: விடுதலைக்குள்
  rationale: அழைப்பின் நோக்கம் அல்லது இலக்கை முதன்மைப்படுத்துகிறது; இச்சொற்றொடரை அழைப்பின் அடிப்படை அல்லது விளைவுநிலை எனப் புரிந்துகொள்ளும் சாத்தியத்தை அடிக்குறிப்பில் மறைக்காமல் குறிப்பிடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையில் வடிவமைக்கப்பட்டது. “மாம்சம்” என்ற வேதாகமச் சொல் அதன் இறையியல் மற்றும் உருவகத் திறந்தநிலையைப் பாதுகாக்க வைக்கப்பட்டுள்ளது. “அடிமையாகச் சேவை செய்யுங்கள்” என்பது விடுதலைக்கும் அன்பினால் செய்யும் தன்னார்வ அடிமைப் பணிக்கும் இடையிலான பவுலின் திட்டமிட்ட முரண்பாட்டைத் தெளிவாகக் காக்கிறது.
