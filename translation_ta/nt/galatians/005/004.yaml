base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/004.yaml
  text: You who are seeking to be justified by law have been severed from the Messiah; you have fallen away from grace.
translation:
  language: ta
  text: திருச்சட்டத்தின் அடிப்படையில் நீதிமான்களாக்கப்பட முயல்கின்ற நீங்கள்[b] கிறிஸ்துவிடமிருந்து துண்டிக்கப்பட்டீர்கள்[a]; அருளிலிருந்து விழுந்துவிட்டீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்துவுக்கு அந்நியமாகிவிட்டீர்கள்” அல்லது “கிறிஸ்துவிடமிருந்து பிரிக்கப்பட்டீர்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “திருச்சட்டத்தின் அடிப்படையில் நீதிமான்களாக்கப்படுகிற நீங்கள்.” கிரேக்க நிகழ்காலச் செயப்பாட்டு வடிவத்தை இவ்வாறு நேரடியாக மொழிபெயர்க்கலாம்; இங்கு பவுலின் வாதத்தின் சூழலுக்கு ஏற்ப ‘நீதிமான்களாக்கப்பட முயல்கின்ற’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατηργήθητε
  choice: துண்டிக்கப்பட்டீர்கள்
  rationale: ἀπὸ Χριστοῦ என்பதோடு வருவதால், கிறிஸ்துவுடனான உறவிலிருந்து பிரிக்கப்பட்டிருப்பதை வலுவாகக் காட்டுகிறது. ‘பயனற்றவர்களாக்கப்பட்டீர்கள்’ என்பது இச்சூழலுக்குக் குறைவாகப் பொருந்தும்; ‘அந்நியமாகிவிட்டீர்கள்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀπὸ Χριστοῦ
  choice: கிறிஸ்துவிடமிருந்து
  rationale: ἀπό பிரிவைக் குறிக்கிறது. Χριστός என்பதற்கு நவீனத் தமிழ் வேதாகம வழக்கில் இயல்பாகவும் தலைப்பின் பொருளைத் தக்கவைத்தும் ‘கிறிஸ்து’ பயன்படுத்தப்படுகிறது.
- source_word: οἵτινες
  choice: நீங்கள்
  rationale: கலாத்தியர்களில் குறிப்பிட்ட செயலில் ஈடுபடுகிறவர்களை நேரடியாகச் சுட்டுகிறது; தமிழில் தொடர்ந்துவரும் உறவெச்ச அமைப்பு இந்த வரையறுக்கும் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν νόμῳ
  choice: திருச்சட்டத்தால்
  rationale: இங்கு ἐν என்பது நீதிமான்களாக்கப்படுவதற்கான அடிப்படை அல்லது வழிமுறையைக் குறிக்கிறது. νόμος என்பதன் பவுலியச் சூழலைத் தெளிவுபடுத்த ‘திருச்சட்டம்’ என மொழிபெயர்க்கப்படுகிறது; கிரேக்கத்தில் கட்டுரை இல்லாததால் குறிப்பிட்ட ஒரு சட்டத் தொகுப்பை மொழிபெயர்ப்பே தேவையின்றி வரையறுக்கவில்லை.
- source_word: δικαιοῦσθε
  choice: நீதிமான்களாக்கப்பட நாடுகிற
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவத்தின் அடிப்படைப் பொருள் ‘நீதிமான்களாக்கப்படுகிற’ என்பதாக இருந்தாலும், திருச்சட்டத்தின் அடிப்படையில் நீதிமான்களாக்கப்பட முயல்வோரைப் பற்றிய பவுலின் வாதத்தை ‘நாடுகிற’ இயல்பாக வெளிப்படுத்துகிறது. முறையான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τῆς χάριτος
  choice: அருளிலிருந்து
  rationale: ἐκπίπτω உடன் வரும் மரபுத்தொடரில், அருளுடன் இருந்த நிலையிலிருந்து விலகுவதை இயல்பாகக் குறிக்கிறது. χάρις என்பதற்கு dignified modern Tamil ஆக ‘அருள்’ தேர்ந்தெடுக்கப்படுகிறது.
- source_word: ἐξεπέσατε
  choice: விழுந்துவிட்டீர்கள்
  rationale: ἐκπίπτω-வின் விழுதல் உருவகத்தையும், இறந்தகால வடிவம் காட்டும் தீர்மானமான விளைவையும் தக்கவைக்கிறது. ‘விலகிவிட்டீர்கள்’ இயல்பானதாக இருந்தாலும் உருவகத்தின் கூர்மையைத் தணிக்கும்.
theological_decisions:
- issue: இந்த எச்சரிக்கை இரட்சிப்பை இழப்பதையா, அருளின் கொள்கையை விட்டுவிடுவதையா தீர்மானிக்கிறதா?
  choice: ‘கிறிஸ்துவிடமிருந்து துண்டிக்கப்பட்டீர்கள்; அருளிலிருந்து விழுந்துவிட்டீர்கள்’ என்ற நேரடியான, கடுமையான மொழியைத் தக்கவைத்தல்
  alternative: ‘கிறிஸ்துவுக்கு அந்நியமாகிவிட்டீர்கள்’ அல்லது ‘அருளின் வழியைக் கைவிட்டீர்கள்’ என்று மெல்லியதாகவோ விளக்கமாகவோ மொழிபெயர்த்தல்
  rationale: கிரேக்க உரை உறவுசார் பிரிவையும் அருளிலிருந்து விழுதலையும் வலுவாகச் சொல்கிறது; ஆனால் அதன் முறையியல் இறையியல் விளைவைக் குறிப்பாக வரையறுக்கவில்லை. ஆகவே எந்தச் சமயப்பிரிவின் முடிவையும் மொழிபெயர்ப்பில் புகுத்தாமல் உரையின் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘நீதிமான்களாக்கப்பட’ என்பது செயப்பாட்டு வடிவத்தையும் நீதித்தீர்ப்பு சார்ந்த பொருளையும் காக்கிறது; ‘திருச்சட்டம்’ νόμος என்பதைக் பொதுவான சட்டம் என்று தவறாகப் புரிந்துகொள்ளாமல் உதவுகிறது. ஒரே அடிக்குறிப்பு குறி பிரதான உரையில் இடம்பெற்றுள்ளது.
