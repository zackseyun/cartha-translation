id: GAL.5.16
reference: Galatians 5:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Λέγω δέ, πνεύματι περιπατεῖτε καὶ ἐπιθυμίαν σαρκὸς οὐ μὴ τελέσητε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/016.yaml
  text: But I say[a], walk by the Spirit, and you will certainly not carry out the desire of the flesh.
translation:
  language: ta
  text: 'ஆனால் நான் சொல்கிறேன்: ஆவியானவருக்கேற்ப நடந்துகொள்ளுங்கள்; அப்போது மாம்சத்தின்[a] ஆசையை நிறைவேற்றவே மாட்டீர்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பாவ இயல்பின்.’ ‘மாம்சம்’ என்பதற்கான கிரேக்கச் சொல், பவுலின் எழுத்துகளில் ஆவியானவருக்கு எதிராக நிற்கும் வீழ்ச்சியுற்ற மனித இயல்பைக் குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: Λέγω δέ
  choice: ஆனால் நான் சொல்கிறேன்
  rationale: δέ இங்கு முந்தைய அறிவுறுத்தலிலிருந்து ஒரு மிதமான எதிர்மறைத் திருப்பத்தைச் சுட்டுகிறது; ‘ஆனால்’ அதை மிகைப்படுத்தாமல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πνεύματι
  choice: ஆவியானவருக்கேற்ப
  rationale: இந்த வேற்றுமை உருபு கருவியையோ வாழ்வின் வழிநடத்தும் வட்டாரத்தையோ குறிக்கலாம். உடனடிச் சூழலில் தூய ஆவியானவரே குறிக்கப்படுவதால், தமிழில் அவரது வழிநடத்தலுக்கேற்ற வாழ்வை இயல்பாகத் தெரிவிக்கும் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: περιπατεῖτε
  choice: நடந்துகொள்ளுங்கள்
  rationale: பவுலின் ‘நடத்தல்’ என்ற வாழ்வியல் உருவகத்தைத் தக்கவைத்தபடியே, ஒருவரின் வாழ்க்கை முறையைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம் இது.
- source_word: ἐπιθυμίαν
  choice: ஆசையை
  rationale: ἐπιθυμία தன்னளவில் நல்ல அல்லது தீய விருப்பத்தைக் குறிக்கலாம்; இங்கு ‘மாம்சத்தின்’ என்ற தொடர்பே அதன் எதிர்மறைப் பொருளைத் தருகிறது. ஆகவே ‘இச்சை’ அல்லது ‘காமம்’ எனப் பொருளைக் குறுக்காமல் பரந்த ‘ஆசை’ பயன்படுத்தப்பட்டது.
- source_word: σαρκὸς
  choice: மாம்சத்தின்
  rationale: இங்கு இது ஆவியானவருக்கு எதிராக நிற்கும் வீழ்ச்சியுற்ற மனித இயல்பைக் குறித்தாலும், பவுலின் சொல் மற்றும் அதிலுள்ள இறையியல் இழுபறியைத் தக்கவைக்க நேரடியான ‘மாம்சம்’ முதன்மை உரையில் வைக்கப்பட்டது.
- source_word: οὐ μὴ τελέσητε
  choice: நிறைவேற்றவே மாட்டீர்கள்
  rationale: οὐ μή உடன் வரும் வலியுறுத்தப்பட்ட மறுப்பு, தமிழில் ‘-வே மாட்டீர்கள்’ என்பதால் இயல்பாகக் காட்டப்படுகிறது. τελέω ஆசையைச் செயலாக நிறைவேற்றுவதைக் குறிக்கிறது.
theological_decisions:
- issue: πνεύματι என்பதன் குறிப்பு
  choice: தூய ஆவியானவர்
  alternative: மனித ஆவி அல்லது பொதுவான ஆன்மிகக் கோட்பாடு
  rationale: கலாத்தியர் 5-இன் உடனடிச் சூழலில் ஆவியானவரும் மாம்சமும் எதிரெதிராக நிறுத்தப்படுவதால், இங்கு தூய ஆவியானவரே குறிக்கப்படுகிறார். ‘ஆவியானவர்’ என்ற மரியாதைமிக்க ஆள்சுட்டு வடிவம் இதைத் தெரிவிக்கிறது; ஆனால் மூலத்தில் இல்லாத ‘தூய’ என்பது முதன்மை உரையில் சேர்க்கப்படவில்லை.
- issue: σάρξ என்பதன் மொழிபெயர்ப்பு
  choice: மாம்சம்
  alternative: பாவ இயல்பு
  rationale: இங்கு அறநெறி சார்ந்த உருவகப் பொருள் இருந்தாலும், ‘பாவ இயல்பு’ என்று மட்டும் விளக்கிவிடுவது பவுலின் விரிவான சொற்பயன்பாட்டையும் இறையியல் இழுபறியையும் குறுக்கும். எனவே ‘மாம்சம்’ உரையில் தக்கவைக்கப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘நடந்துகொள்ளுங்கள்’ என்பது மூலத்தின் நடை உருவகத்தையும் வாழ்வியல் பொருளையும் இணைக்கிறது. வலியுறுத்தப்பட்ட மறுப்பு இயல்பான தமிழ் ‘-வே மாட்டீர்கள்’ வடிவில் கொடுக்கப்பட்டுள்ளது.
