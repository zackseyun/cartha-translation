  source_fidelity: மூலத்தின் Λέγω δέ-க்கு ‘ஆனால் நான் சொல்கிறேன்’ பொருத்தமான உரையாடல் திருப்பத்தைத் தருகிறது. πνεύματι-க்கு ‘ஆவியானவருக்கேற்ப’ என்பது கருவி/வாழ்வியல்-வட்டார நுணுக்கத்தை இயல்பாக வெளிப்படுத்துகிறது. περιπατεῖτε-இன் தொடர்ச்சியான வாழ்வியல் உருவகமும், σαρκὸς ἐπιθυμίαν-இன் ‘மாம்சத்தின் ஆசை’ என்ற தொடர்பும், οὐ μὴ τελέσητε-இன் வலியுறுத்தப்பட்ட மறுப்பும் காக்கப்பட்டுள்ளன.
  naturalness: உரை நவீனத் தரத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘நடந்துகொள்ளுங்கள்’ வாழ்வுமுறையைக் குறிக்கும் பொருத்தமான வழக்கு; ‘நிறைவேற்றவே மாட்டீர்கள்’ வலிமையான, இயல்பான மறுப்பாகும்.
  terminology: ‘ஆவியானவர்’ சூழலுக்கேற்ப பரிசுத்த ஆவியைக் குறிக்கிறது; மூலத்தில் இல்லாத ‘பரிசுத்த’ என்பதை உரையில் சேர்க்கவில்லை. ‘மாம்சம்’ பவுலின் முக்கியமான சொல்லாட்சியைப் பாதுகாக்கிறது; மாற்று விளக்கமான ‘பாவ இயல்பு’ அடிக்குறிப்பில் மட்டுமே வைக்கப்பட்டுள்ளது. பெயரியல் அல்லது இறையியல் சார்ந்த தேவையற்ற விளக்கச் சேர்க்கை இல்லை.
