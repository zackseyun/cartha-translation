source:
  edition: SBLGNT
  text: μαρτύρομαι δὲ πάλιν παντὶ ἀνθρώπῳ περιτεμνομένῳ ὅτι ὀφειλέτης ἐστὶν ὅλον τὸν νόμον ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/003.yaml
  text: And I testify again to every man who receives circumcision that he is obligated to keep the whole law[a][b][c].
translation:
  language: ta
  text: 'மேலும், விருத்தசேதனம் செய்துகொள்ளும் ஒவ்வொரு மனிதனுக்கும்[a][b] நான் மீண்டும் சாட்சியளிக்கிறேன்: அவன் முழுச் சட்டத்தையும் கடைப்பிடிக்கக் கடமைப்பட்டிருக்கிறான்[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒவ்வொருவருக்கும்.’ கிரேக்கத்தில் ‘மனிதன்’ என்பதற்கான சொல் ஒருமையில் உள்ளது; இங்கு அது பொதுப்படையான பொருளில் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘விருத்தசேதனம் செய்யப்படும்’ அல்லது ‘தன்னை விருத்தசேதனம் செய்ய அனுமதிக்கும்.’ கிரேக்கப் பங்கேற்புவினையை இவ்வாறு நெருக்கமான பல வழிகளில் மொழிபெயர்க்கலாம்; இந்த விவாதச் சூழல், விருத்தசேதனத்துக்கு உட்படுகிற ஒருவரைக் குறிக்கிறது.
    reason: alternative_reading
  - marker: c
    text: சொல்லுக்குச் சொல், ‘கடன்பட்டவனாக இருக்கிறான்’; அதாவது, அவன் கடமையின் கீழ் இருக்கிறான்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτύρομαι
  choice: சாட்சியளிக்கிறேன்
  rationale: இது பவுலின் வலியுறுத்தப்பட்ட தனிப்பட்ட உறுதிப்படுத்தலை முறையான தொனியில் வெளிப்படுத்துகிறது; ‘எச்சரிக்கிறேன்’ என்பது சூழலின் விளைவைச் சேர்த்து விளக்கும் மொழியாகிவிடும்.
- source_word: δὲ
  choice: மேலும்
  rationale: இங்கு வலுவான எதிர்மறையைவிட முந்தைய கூற்றுடன் தொடர்ச்சியை δέ காட்டுகிறது; ‘மேலும்’ அந்த மென்மையான இணைப்பை இயல்பாகக் கொண்டுவருகிறது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: கூற்றின் மறுபடியான வலியுறுத்தலை நேரடியாகத் தெரிவிக்கிறது.
- source_word: παντὶ ἀνθρώπῳ
  choice: ஒவ்வொரு மனிதனுக்கும்
  rationale: கிரேக்கத்தின் ஒருமை, பகிர்ந்தளிக்கும் அமைப்பையும் மனிதரைக் குறிக்கும் பொதுப்படையான பயன்பாட்டையும் காக்கிறது.
- source_word: περιτεμνομένῳ
  choice: விருத்தசேதனம் செய்துகொள்ளும்
  rationale: இவ்விவாதத்தில் விருத்தசேதனத்துக்கு உட்படுகிற ஒருவரைக் குறிக்கும் நிகழ்காலப் பங்கேற்புவினையின் சூழல்சார் பொருளை வெளிப்படுத்துகிறது; செய்பவரின் முகமையை தேவையின்றி குறிப்பாக்கவில்லை.
- source_word: ὀφειλέτης
  choice: கடமைப்பட்டிருக்கிறான்
  rationale: நிதிக்கடன் என்ற தவறான எண்ணத்தைத் தவிர்த்து, ஒருவன் முழுச் சட்டத்தையும் நிறைவேற்ற வேண்டிய கட்டுப்பாட்டின்கீழ் இருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ὅλον τὸν νόμον
  choice: முழுச் சட்டத்தையும்
  rationale: சட்டத்தின் ஒரு பகுதியை மட்டுமல்ல, அதன் முழுமையையும் குறிக்கும் வலியுறுத்தலைக் காக்கிறது.
- source_word: ποιῆσαι
  choice: கடைப்பிடிக்க
  rationale: νόμος என்பதுடன் வரும் ποιέω-வின் பொருளை, மரத்துப் போன ‘செய்ய’ என்பதற்குப் பதிலாக சட்டத்துக்குக் கீழ்ப்படிதலைக் குறிக்கும் இயல்பான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: விருத்தசேதனமும் முழுச் சட்டத்திற்கான கடமையும் பற்றிய கூற்றின் வரம்பு
  choice: கலாத்தியர் விவாதத்தில் விருத்தசேதனத்துக்கு உட்படுகிற ஒருவர் முழுச் சட்டத்தையும் கடைப்பிடிக்க வேண்டிய கடமைக்குள் வருவதாகப் பவுல் கூறுகிறார்.
  alternative: குழந்தைப் பருவத்திலேயே விருத்தசேதனம் செய்யப்பட்ட யூதர்கள் உட்பட, விருத்தசேதனம் செய்யப்பட்ட எந்த ஆணையும் இந்தக் கூற்று பொதுவாகக் குறிக்கிறது.
  rationale: 5:2-ஐத் தொடர்ந்து வரும் περιτεμνομένῳ, இச்சூழலில் விருத்தசேதனத்துக்கு உட்படுவதைச் சுட்டுகிறது. ‘செய்துகொள்ளும்’ என்பது அந்தச் சூழல்சார் வலிமையைத் தருகிறது; ஆனால் கிரேக்கத்தில் வெளிப்படையாக இல்லாத நோக்கத்தை முதன்மை உரையில் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன, நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘விருத்தசேதனம்’ வேதாகமச் சூழலில் பரவலாக அறியப்பட்ட துல்லியமான சொலாக வைக்கப்பட்டுள்ளது. ‘முழுச் சட்டம்’ என்பது νόμος-ஐ தேவையற்ற விளக்கச் சேர்க்கையின்றி தருகிறது; ‘கடமைப்பட்டிருக்கிறான்’ என்பது ὀφειλέτης-இன் சட்ட/உடன்படிக்கை சார்ந்த கட்டுப்பாட்டை நிதிக்கடனாகத் தவறாகப் புரிந்துகொள்ளாமல் தெளிவாக்குகிறது.
