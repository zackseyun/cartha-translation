  terminology: “விருத்தசேதனம்,” “சட்டம்,” “கடைப்பிடிக்க,” and “கடமைப்பட்டிருக்கிறான்” are accurate and consistent choices. The wording avoids wrongly narrowing the statement to financial indebtedness while retaining the source’s obligation imagery in footnote c. The notes preserve the generic sense of ἄνθρωπος and the contextual nuance of the participle without inserting motive into the main text.
