source:
  edition: SBLGNT
  text: εἰ δὲ ἀλλήλους δάκνετε καὶ κατεσθίετε, βλέπετε μὴ ὑπ’ ἀλλήλων ἀναλωθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/015.yaml
  text: But if you bite and devour one another[a], watch out that you are not consumed by one another.
translation:
  language: ta
  text: ஆனால், நீங்கள் ஒருவரையொருவர் கடித்து விழுங்குகிறீர்கள் என்றால், ஒருவரால் ஒருவர் விழுங்கப்பட்டுவிடாதபடி எச்சரிக்கையாக இருங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒருவரால் ஒருவர் விழுங்கப்பட்டுவிடாதபடி கவனமாக இருங்கள்.”
    reason: βλέπετε என்பதற்கான இயல்பான மாற்றுச் சொல்லைத் தருகிறது; முதன்மை உரையில் ἀναλωθῆτε-ன் உருவகப் படிமம் தக்கவைக்கப்பட்டுள்ளது.
lexical_decisions:
- source_word: εἰ δὲ
  choice: ஆனால் ... என்றால்
  rationale: εἰ நிபந்தனையையும் δέ முந்தைய அறிவுரையுடன் உள்ள மென்மையான மாறுபாட்டையும் காட்டுகின்றன. இச்சேர்க்கை நவீனத் தமிழில் இயல்பாக அந்த இரண்டையும் வெளிப்படுத்துகிறது.
- source_word: ἀλλήλους
  choice: ஒருவரையொருவர்
  rationale: சமூகத்தினருக்குள் நிகழும் பரஸ்பரச் செயலைத் தெளிவாகக் காட்டும் இயல்பான தமிழ்ச் சொற்றொடர்.
- source_word: δάκνετε
  choice: கடித்து
  rationale: வினைச்சொல்லின் நேரடியான பொருளான ‘கடித்தல்’ என்பதைக் காத்து, பவுலின் விலங்குத் தாக்குதல் உருவகத்தை மென்மைப்படுத்தாமல் தருகிறது.
- source_word: κατεσθίετε
  choice: விழுங்குகிறீர்கள்
  rationale: சாதாரணமாக உண்பதைவிட வன்மையாக முற்றிலும் தின்றுவிடும் கருத்தைத் தருகிறது; ‘கடித்து’ என்பதுடன் இணைந்து மூலத்தின் தீவிர உருவகத்தைக் காக்கிறது.
- source_word: βλέπετε
  choice: எச்சரிக்கையாக இருங்கள்
  rationale: இது விழிப்புடன் இருக்கும்படி வலியுறுத்தும் கட்டளை. நவீனத் தமிழில் இயல்பாகவும் அவசர எச்சரிக்கையாகவும் ஒலிக்கிறது.
- source_word: μὴ
  choice: '...விடாதபடி'
  rationale: μή உடன் வரும் எதிர்மறை எச்சரிக்கையையும் ஏற்படக்கூடிய விளைவைத் தவிர்க்க வேண்டியதையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ὑπ’ ἀλλήλων
  choice: ஒருவரால் ஒருவர்
  rationale: ὑπό உடன் வரும் செயப்படுபொருள் அமைப்பின் செயற்பாட்டாளரையும் பரஸ்பர அழிவின் முரண்பாட்டையும் காக்கிறது.
- source_word: ἀναλωθῆτε
  choice: அழிக்கப்பட்டுவிடாதபடி
  rationale: இங்கு ἀναλίσκω முற்றிலும் தீர்த்துவிடுதல் அல்லது அழித்துவிடுதல் என்ற விளைவைக் குறிக்கிறது. சூழலில் சமூகத்தின் பரஸ்பர அழிவைத் தெளிவாகச் சொல்லும் தேர்வு இது; ‘விழுங்கப்பட்டுவிடாதபடி’ என்ற உருவகத்திற்கு நெருக்கமான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: விசுவாசச் சமூகத்திற்குள் நிகழும் வன்முறைக்கான உருவகம்
  choice: ‘கடித்து விழுங்குகிறீர்கள்’ என்ற விலங்குத் தாக்குதல் உருவகத்தை நேரடியாகத் தக்கவைத்தல்
  alternative: ‘ஒருவருக்கொருவர் தீங்கு செய்து அழிக்கிறீர்கள்’ என்று பொதுவான மோதல் மொழியாக மாற்றுதல்
  rationale: பவுலின் சொற்கள் திட்டமிட்டே கூர்மையானவையும் அதிர்ச்சியூட்டுவனவுமாக உள்ளன. அவற்றை பொதுவான மோதல் மொழியாக மென்மைப்படுத்துவது எச்சரிக்கையின் அறநெறித் தீவிரத்தையும் சமூகத் தன்னழிவின் படிமத்தையும் குறைத்துவிடும்.
- issue: ἀναλωθῆτε என்பதிலுள்ள அழிவு மற்றும் முற்றிலும் நுகரப்படுதல் ஆகிய பொருள் நிழல்கள்
  choice: முதன்மை உரையில் ‘அழிக்கப்பட்டுவிடாதபடி’ என்று கொடுத்து, உருவகத்திற்கு நெருக்கமான ‘முற்றிலும் விழுங்கப்பட்டுவிடாதபடி’ என்பதை அடிக்குறிப்பில் தருதல்
  alternative: முதன்மை உரையிலேயே ‘முற்றிலும் விழுங்கப்பட்டுவிடாதபடி’ என்று மொழிபெயர்த்தல்
  rationale: சூழலில் நோக்கப்படும் இறுதி விளைவு அழிவு என்பதைக் ‘அழிக்கப்பட்டுவிடாதபடி’ இயல்பாக வெளிப்படுத்துகிறது. அதேவேளையில், மூலச்சொல்லின் நுகர்ந்து தீர்த்துவிடும் படிமத்தை அடிக்குறிப்பு பாதுகாக்கிறது; இரண்டில் ஒன்றை மட்டுமே இறுதியான பொருளாகத் திணிப்பதை இது தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதவாக்கியத்திற்கேற்ற கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பட்சித்தல்’ போன்ற வழக்கிழந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன. ‘கடித்து விழுங்குதல்’ என்ற உயிரோட்டமுள்ள உருவகம் தக்கவைக்கப்பட்டு, இறுதி அழிவைக் குறிக்கும் வாக்கியம் இயல்பான தமிழ்ச் செயப்பாட்டு அமைப்பில் தரப்பட்டுள்ளது.
