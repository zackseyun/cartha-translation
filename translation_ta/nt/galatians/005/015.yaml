- from: ஆனால் நீங்கள் ஒருவரையொருவர் கடித்து விழுங்குகிறீர்கள் என்றால், ஒருவரால் ஒருவர் அழிக்கப்பட்டுவிடாதபடி எச்சரிக்கையாக இருங்கள்.[a]
  to: ஆனால், நீங்கள் ஒருவரையொருவர் கடித்து விழுங்குகிறீர்கள் என்றால், ஒருவரால் ஒருவர் விழுங்கப்பட்டுவிடாதபடி எச்சரிக்கையாக இருங்கள்.[a]
  rationale: மூலத்தின் கடித்தல்–விழுங்குதல்–விழுங்கப்படுதல் என்ற தொடர்ச்சியான, திட்டமிட்ட விலங்கு உருவகத்தை முதன்மை உரையிலேயே பாதுகாக்க ‘அழிக்கப்பட்டுவிடாதபடி’ என்பதற்குப் பதிலாக ‘விழுங்கப்பட்டுவிடாதபடி’ இடப்பட்டுள்ளது. ὑπ’ ἀλλήλων-ன் பரஸ்பரச் செயற்பாட்டாளர் பொருளும் காக்கப்படுகிறது. அடிக்குறிப்பு ஒரு தெளிவான சொல்லாட்சி மாற்றாக மட்டுப்படுத்தப்பட்டுள்ளது.
