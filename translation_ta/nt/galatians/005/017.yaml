id: GAL.5.17
reference: Galatians 5:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἡ γὰρ σὰρξ ἐπιθυμεῖ κατὰ τοῦ πνεύματος, τὸ δὲ πνεῦμα κατὰ τῆς σαρκός, ταῦτα ⸀γὰρ ⸂ἀλλήλοις ἀντίκειται⸃, ἵνα μὴ ἃ ⸀ἐὰν θέλητε ταῦτα ποιῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/017.yaml
  text: For the flesh desires what is against the Spirit[a], and the Spirit what is against the flesh; for these oppose each other[b], so that you do not do the things you want.
translation:
  language: ta
  text: ஏனெனில், மாம்சம் ஆவியானவருக்கு எதிரானவற்றை விரும்புகிறது[a]; ஆவியானவரோ மாம்சத்திற்கு எதிரானவற்றை விரும்புகிறார். இவை ஒன்றுக்கொன்று எதிராக நிற்கின்றன[b]. அதன் விளைவாக, நீங்கள் விரும்புகிறவற்றைச் செய்வதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மாம்சம்’ என்பதற்குப் பதிலாக ‘பாவ இயல்பு’ என்றும் பொருள் கொள்ளலாம். கிரேக்கச் சொல் σάρξ (சார்க்ஸ்); இங்கு அது வெறும் உடலைவிடப் பரந்த அறநெறிப் பொருளில் பயன்படுத்தப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘ஆவியானவர்’ என்பதற்குப் பதிலாக, இது மனித ‘ஆவி’யைக் குறிக்கிறது என்றும் பொருள் கொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: σὰρξ
  choice: மாம்சம்
  rationale: பவுலின் உருவகத்தையும் இறையியல் சொல்வழக்கையும் காக்கும் வகையில் ‘மாம்சம்’ பயன்படுத்தப்பட்டது. இங்கு அது வெறும் உடலை அல்லாமல், கடவுளுக்கு எதிராகச் செல்லும் மனிதச் சாய்வைக் குறிக்கும்; ‘பாவ இயல்பு’ என்பது விளக்கவுரையான மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐπιθυμεῖ
  choice: விரும்புகிறது / விரும்புகிறார்
  rationale: வலுவான ஆசை அல்லது நாட்டத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது. κατά அமைப்பிலுள்ள எதிர்மறைத் திசை ‘எதிரானவற்றை’ என்பதால் வெளிப்படுகிறது.
- source_word: κατὰ τοῦ πνεύματος / κατὰ τῆς σαρκός
  choice: ஆவியானவருக்கு எதிரானவற்றை / மாம்சத்திற்கு எதிரானவற்றை
  rationale: κατά + genitive என்பதன் எதிர்ப்புப் பொருளைக் காத்து, ἐπιθυμεῖ என்பதுடன் தமிழில் இயல்பாக இணைய ‘எதிரானவற்றை’ என வழங்கப்பட்டது.
- source_word: πνεῦμα
  choice: ஆவியானவர்
  rationale: கலாத்தியர் 5-ன் சுற்றுப்பகுதியில் இது பரிசுத்த ஆவியானவரைக் குறிக்கும் வாய்ப்பே மிகுதியானதால் மரியாதைப் பன்மையுடன் நபரைக் குறிக்கும் வடிவம் தேர்ந்தெடுக்கப்பட்டது; மனித ஆவி என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἀλλήλοις ἀντίκειται
  choice: ஒன்றுக்கொன்று எதிராக நிற்கின்றன
  rationale: இருதரப்பு எதிர்ப்பைச் சுருக்கமாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: ἵνα μὴ
  choice: ஆகவே ... முடிவதில்லை
  rationale: இந்த எதிர்ப்பின் நடைமுறை விளைவை இயல்பான தமிழில் தெரிவிக்கிறது. கிரேக்க ἵνα இங்கு நோக்கம் அல்லது விளைவு எனப் புரிந்துகொள்ளக்கூடிய நுணுக்கத்தைக் கொண்டுள்ளது.
- source_word: ἃ ἐὰν θέλητε ταῦτα ποιῆτε
  choice: நீங்கள் விரும்புகிறவற்றை உங்களால் செய்ய முடிவதில்லை
  rationale: குறிப்பிடப்படாத பன்மைச் செயல்களைக் குறிக்கும் தொடர்புச் சொற்றொடரையும், அவற்றைச் செய்வது தடுக்கப்படுவதையும் தெளிவான தமிழில் தருகிறது.
theological_decisions:
- issue: பவுலின் அறநெறிச் சூழலில் σάρξ என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘மாம்சம்’ என உருவகத்தைத் தக்கவைத்தல்
  alternative: பாவ இயல்பு
  rationale: இங்கு சொல் வெறும் உடலைவிடப் பரந்த, கடவுளுக்கு எதிரான மனிதச் சாய்வைக் குறித்தாலும், ‘பாவ இயல்பு’ என நேரடியாக மாற்றுவது பவுலின் உருவகத்தை ஒரே விளக்கமாகச் சுருக்கிவிடும்.
- issue: πνεῦμα என்பதன் குறிப்பு
  choice: பரிசுத்த ஆவியானவரைக் குறிக்கும் ‘ஆவியானவர்’
  alternative: மனித ஆவி
  rationale: கலாத்தியர் 5-ன் உடனடிச் சூழலில் ஆவியானவரால் நடத்தப்படுதல் மற்றும் ஆவியின் கனியைப் பற்றிய வாதம் இருப்பதால் பரிசுத்த ஆவியானவரே அதிகம் சாத்தியம்; எனினும் மனித ஆவி என்ற வாசிப்பு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- issue: ἵνα μὴ என்பதன் நோக்கம்–விளைவு நுணுக்கம்
  choice: எதிர்ப்பின் நடைமுறை விளைவாக ‘ஆகவே ... முடிவதில்லை’
  alternative: ‘செய்யாதபடிக்கு’ என்ற நோக்கவாசிப்பு
  rationale: கிரேக்க அமைப்பு நோக்கத்தையும் விளைவையும் அனுமதிக்கிறது. தமிழில் ‘செய்யாதபடிக்கு’ என்பது மாம்சமும் ஆவியும் நோக்கமுடன் ஒரே விளைவை நாடுகின்றன என்ற தவறான எண்ணத்தை ஏற்படுத்தக்கூடும்; ஆகவே சூழலின் நடைமுறை விளைவு முன்னிறுத்தப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘மாம்சம்’ என்ற வேதாகம உருவகம் பாதுகாக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டது. ஆவியானவரைக் குறிக்கும் வினைச்சொல்லில் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது.
