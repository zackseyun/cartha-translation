  text: ἡμεῖς γὰρ πνεύματι ἐκ πίστεως ἐλπίδα δικαιοσύνης ἀπεκδεχόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/005.yaml
  text: For through the Spirit[a], by faith[d][c][b], we eagerly await the hope of righteousness.
translation:
  language: ta
  text: ஏனெனில், நாம் ஆவியால்[a], விசுவாசத்தின் அடிப்படையில்[b], நீதியின் நம்பிக்கையை[c][d] ஆவலுடன் எதிர்நோக்கிக் காத்திருக்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆவியில்.’ πνεύματι என்ற கிரேக்க வடிவம் ‘ஆவியால்’ என்ற கருவிப் பொருளையோ ‘ஆவியில்’ என்ற நிலையியல் பொருளையோ தரலாம். இச்சூழலில் பரிசுத்த ஆவி குறிக்கப்படுவது மிகவும் சாத்தியம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, ‘விசுவாசத்திலிருந்து.’ πίστις என்பதற்கு சூழலைப் பொறுத்து ‘விசுவாசம்,’ ‘நம்பிக்கை,’ அல்லது ‘உண்மைத்தன்மை’ என்ற நுணுக்கங்கள் இருக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: δικαιοσύνη என்பதற்கு ‘நீதி,’ ‘நீதிநிலை,’ அல்லது சில சூழல்களில் ‘நியாயம்’ என்ற பொருள் இருக்கலாம்; இங்கு ‘நீதி’ முதன்மைத் தேர்வாக உள்ளது.
    reason: alternative_reading
  - marker: d
    text: ‘நீதியின் நம்பிக்கை’ என்பது ‘எதிர்பார்க்கப்படும் நீதி’ என்றோ, நீதியோடு தொடர்புடைய நம்பிக்கை என்றோ புரிந்துகொள்ளப்படலாம். கிரேக்கச் சொற்றொடர் அந்தத் தொடர்பை முழுமையாக விளக்கவில்லை.
    reason: ambiguity
lexical_decisions:
- source_word: ἡμεῖς
  choice: நாம்
  rationale: முதல் நபர் பன்மை எழுவாய். கிரேக்கத்தில் ஓரளவு வலியுறுத்தல் இருந்தாலும், தமிழில் இயல்பான ‘நாம்’ போதுமானது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத்தையோ ஆதாரத்தையோ அறிமுகப்படுத்தும் இணைப்புச் சொல்; பவுலின் வாத ஓட்டத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: πνεύματι
  choice: ஆவியால்
  rationale: வேற்றுமை வடிவம் கருவி அல்லது செயல்படும் வட்டாரம் ஆகிய இரு நுணுக்கங்களையும் கொண்டிருக்கலாம். கலாத்தியர் 5-ன் சூழலில் பரிசுத்த ஆவியே பெரும்பாலும் குறிக்கப்படுகிறார்; ‘ஆவியால்’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: ἐκ πίστεως
  choice: விசுவாசத்தின் அடிப்படையில்
  rationale: ἐκ இங்கு மூலத்தையோ அடிப்படையையோ குறிக்கிறது. தமிழில் ‘விசுவாசத்திலிருந்து’ என்பது இயல்பற்றதால், அதன் பொருளைத் துல்லியமாக வழங்க ‘விசுவாசத்தின் அடிப்படையில்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐλπίδα
  choice: நம்பிக்கையை
  rationale: ἀπεκδεχόμεθα என்பதன் நேரடிச் செயப்படுபொருள்; இங்கு எதிர்கால நிறைவேற்றத்தை எதிர்நோக்கும் நம்பிக்கையைக் குறிக்கிறது.
- source_word: δικαιοσύνης
  choice: நீதியின்
  rationale: δικαιοσύνη என்பதற்கு பவுலின் பயன்பாட்டில் ‘நீதி/நீதிநிலை’ முதன்மையான பொருள். உரிமை வேற்றுமைத் தொடர்பின் திறந்த தன்மையைப் பாதுகாக்க ‘நீதியின்’ என நேரடியாக வைக்கப்பட்டுள்ளது.
- source_word: ἀπεκδεχόμεθα
  choice: ஆவலுடன் எதிர்நோக்கிக் காத்திருக்கிறோம்
  rationale: வெறும் காத்திருப்பை மட்டுமல்லாமல், தீவிரமான எதிர்பார்ப்பையும் குறிக்கும் வினைச்சொல்லின் வலிமையைத் தமிழில் முழுமையாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: πνεύματι என்பதன் குறிப்பு
  choice: பரிசுத்த ஆவி
  alternative: மனித ஆவி
  rationale: இப்பகுதியில் ஆவிக்கும் மாம்சத்திற்கும் இடையிலான வேறுபாடும் மீட்புச் சூழலும் பரிசுத்த ஆவியைக் குறிப்பதையே வலுவாக ஆதரிக்கின்றன. இருப்பினும், முதன்மை உரையில் ‘பரிசுத்த’ என்பதைச் சேர்க்காமல் மூலத்தின் வடிவம் பாதுகாக்கப்பட்டுள்ளது.
- issue: πνεύματι என்பதன் வேற்றுமைப் பொருள்
  choice: கருவிப் பொருள்—‘ஆவியால்’
  alternative: வட்டாரம்—‘ஆவியில்’
  rationale: இரண்டும் இலக்கண ரீதியாகச் சாத்தியம். சூழலில் ஆவியின் செயல்பாடு முன்னிலைப்படுவதால் கருவிப் பொருள் முதன்மை உரையில் கொள்ளப்பட்டுள்ளது; மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- issue: ἐλπίδα δικαιοσύνης என்பதன் தொடர்பு
  choice: ‘நீதியின் நம்பிக்கை’ என்ற திறந்த உரிமை வேற்றுமை அமைப்பு
  alternative: ‘எதிர்பார்க்கப்படும் நீதி’ அல்லது ‘நீதியால் உண்டாகும் நம்பிக்கை’
  rationale: இந்த சொற்றொடர் இறுதிக்காலத்தில் எதிர்பார்க்கப்படும் நீதிநிலையைக் குறிக்கலாம்; அதேவேளையில், உரிமை வேற்றுமையின் தொடர்பை ஒரே விளக்கமாகத் தீர்மானிக்காமல் முதன்மை உரை பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆவியால்’ மற்றும் ‘விசுவாசத்தின் அடிப்படையில்’ இயல்பான தமிழையும் மூல இலக்கண நுணுக்கத்தையும் சமநிலைப்படுத்துகின்றன. ‘நீதியின் நம்பிக்கை’ சற்றே செறிவான சொற்றொடராக இருந்தாலும், கிரேக்க உரிமை வேற்றுமையின் இறையியல் திறந்த தன்மையைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
