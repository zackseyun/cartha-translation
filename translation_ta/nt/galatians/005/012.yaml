  text: I wish those who are upsetting you would even mutilate themselves[a][b].
translation:
  language: ta
  text: உங்களைக் குழப்புகிறவர்கள் தங்களையே கூட வெட்டிச் சிதைத்துக்கொண்டால் நலமாயிருக்கும்![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் சொல்லுக்குச் சொல்லாக, “தங்களைத் துண்டித்துக்கொண்டால்” என்றும் மொழிபெயர்க்கலாம். சூழலில், விருத்தசேதனத்தையும் தாண்டித் தங்களையே வெட்டிச் சிதைத்துக்கொள்வதை அல்லது ஆணுறுப்பை வெட்டிக்கொள்வதைப் பவுல் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: b
    text: “உங்களுக்குத் தொல்லை கொடுக்கிறவர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄφελον
  choice: நலமாயிருக்கும்
  rationale: நிறைவேறாத ஓர் தீவிர விருப்பத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; இங்கு பவுலின் கூர்மையான ஏளனத் தொனியையும் தாங்குகிறது.
- source_word: καὶ
  choice: — (தங்களையே வெட்டிச் சிதைத்துக்கொண்டால் என்பதில் தீவிரப்படுத்தல்)
  rationale: καί இங்கு வெறும் இணைப்புச் சொல் அல்ல; விருத்தசேதனத்தைத் தாண்டிச் செல்லும் வெட்டுதலைத் தீவிரப்படுத்துகிறது. தமிழில் தனியே ‘கூட’ சேர்ப்பதைவிட வினைத்தொடரின் வலிமையால் இது இயல்பாக வெளிப்படுகிறது.
- source_word: ἀποκόψονται
  choice: தங்களையே வெட்டிச் சிதைத்துக்கொண்டால்
  rationale: ἀποκόπτω என்பதன் ‘வெட்டுதல்/வெட்டிப்போடுதல்’ என்ற படிமத்தையும் மத்திய வினையின் தற்சுட்டுப் பொருளையும் காக்கிறது. விருத்தசேதனச் சூழலில் உள்ள உடல் உறுப்பை வெட்டும் கூர்மையான சொல்விளையாட்டைத் தெரிவிக்கிறது; ஆனால் ‘ஆணுறுப்பை முற்றிலும் நீக்குதல்’ என்று மூலத்தைவிட மிகத் துல்லியமாக வரையறுக்கவில்லை.
- source_word: οἱ ἀναστατοῦντες
  choice: குழப்புகிறவர்கள்
  rationale: கலாத்திய விசுவாசிகளிடையே கலக்கத்தையும் சீர்குலைவையும் ஏற்படுத்துபவர்களைக் குறிக்கும் நிகழ்காலச் செயப்பெயரின் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὑμᾶς
  choice: உங்களை
  rationale: கலாத்திய விசுவாசிகள் அனைவரையும் குறிக்கும் இரண்டாம் நபர் பன்மை நேரடி செயப்படுபொருள்.
theological_decisions:
- issue: விருத்தசேதனம் குறித்த பவுலின் கூர்மையான விருப்பத்தின் பொருள்
  choice: விருத்தசேதனத்தை வற்புறுத்துகிறவர்கள் அதையும் தாண்டித் தங்களையே வெட்டிச் சிதைத்துக்கொள்ளட்டும் என்ற கூர்மையான ஏளனம்/மிகைப்படுத்தல்
  alternative: அவர்கள் சமூகத்திலிருந்து தங்களைத் துண்டித்துக்கொள்ளட்டும் என்பதே பொருள்
  rationale: கலாத்தியர் 5-இன் உடனடிச் சூழல் விருத்தசேதனத்தைப் பற்றியது. ஆகவே ἀποκόψονται என்பது வெட்டுதலைச் சார்ந்த சொல்விளையாட்டாக இருப்பதே சூழலுக்கு மிகவும் பொருந்துகிறது. எனினும் ‘தங்களைத் துண்டித்துக்கொள்வது’ என்ற சொல்லுக்குரிய மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், பவுலின் அதிர்ச்சியூட்டும் கூர்மையான சொல்லாட்சியை மென்மைப்படுத்தாமலும் அமைக்கப்பட்டது. ‘வெட்டிச் சிதைத்துக்கொள்’ என்பது வெளிப்படையானதாயினும் மருத்துவத் தொழில்நுட்பச் சொல்லாக இல்லை; மூலத்தின் திட்டமிட்ட இரட்டைப் பொருளுக்கான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
