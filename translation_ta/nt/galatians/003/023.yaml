source:
  edition: SBLGNT
  text: Πρὸ τοῦ δὲ ἐλθεῖν τὴν πίστιν ὑπὸ νόμον ἐφρουρούμεθα ⸀συγκλειόμενοι εἰς τὴν μέλλουσαν πίστιν ἀποκαλυφθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/023.yaml
  text: But before faith came[a], we were being guarded under the law[d][c][b], confined until the faith that was about to be revealed.
translation:
  language: ta
  text: ஆனால், விசுவாசம் வருவதற்கு முன்பு[a][d], நாம் சட்டத்தின் கீழ் காவலில் வைக்கப்பட்டு[b], வெளிப்படுத்தப்படவிருந்த அந்த விசுவாசம் வெளிப்படும் வரையில் அடைத்து வைக்கப்பட்டிருந்தோம்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அந்த விசுவாசம் வருவதற்கு முன்பு’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கத்தில் குறிப்புருபு இருப்பதால், கிறிஸ்துவோடு தொடங்கிய விசுவாசத்தின் காலத்தை இது சுட்டக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: ‘காவலில் பிடித்து வைக்கப்பட்டு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘சிறைப்படுத்தப்பட்டு’ அல்லது ‘மூடி அடைக்கப்பட்டு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: d
    text: πίστις என்பதற்கு ‘நம்புதல்’ அல்லது ‘நம்பகத்தன்மை’ என்ற பொருள்களும் இருக்கலாம்; இச்சூழலில் ‘விசுவாசம்’ என்பதே சிறப்பாகப் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸ τοῦ ... ἐλθεῖν
  choice: '... வருவதற்கு முன்பு'
  rationale: πρό என்பதுடன் வரும் பெயர்ச்சொல் தன்மை பெற்ற வினையெச்சம் காலத்தைச் சுட்டுகிறது; இத்தமிழாக்கம் அதன் ‘வருகைக்கு முன்’ என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வாதத்துடன் உள்ள மென்மையான மாறுபாட்டைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τὴν πίστιν
  choice: விசுவாசம்
  rationale: இங்கு πίστις தனிநபரின் நம்புதலையும் கிறிஸ்துவோடு தொடங்கிய மீட்பு வரலாற்றுக் காலத்தையும் சுட்டக்கூடியதால், அந்தத் திறந்த பொருளை ‘விசுவாசம்’ பாதுகாக்கிறது.
- source_word: ὑπὸ νόμον
  choice: சட்டத்தின் கீழ்
  rationale: சட்டத்தின் ஆட்சி அல்லது அதிகாரத்திற்கு உட்பட்ட நிலையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; சூழல் மோசேயின் சட்டத்தை அடையாளப்படுத்துகிறது.
- source_word: ἐφρουρούμεθα
  choice: காவலில் வைக்கப்பட்டு ... இருந்தோம்
  rationale: முற்றுப்பெறாத இறந்தகாலச் செயப்பாட்டு வடிவத்தின் தொடர்ச்சியான கடந்தகால நிலையையும், φρουρέω என்பதன் காவல் சார்ந்த பொருளையும் காக்கிறது.
- source_word: συγκλειόμενοι
  choice: அடைத்து வைக்கப்பட்டு
  rationale: சுற்றி மூடப்படுதல் அல்லது கட்டுப்பாட்டுக்குள் வைக்கப்படுதல் என்ற வலுவான பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: εἰς
  choice: '... வரும் வரையில்'
  rationale: இச்சூழலில் பின்னர் வெளிப்படவிருந்த விசுவாசத்தை நோக்கிய கால எல்லை அல்லது முன்னேற்றத்தை வெளிப்படுத்துகிறது.
- source_word: τὴν μέλλουσαν πίστιν
  choice: வெளிப்படுத்தப்படவிருந்த விசுவாசம்
  rationale: μέλλουσαν என்பதன் எதிர்நோக்கிய காலப் பொருளையும், πίστις என்பதன் மீளுரைப்பையும் தக்கவைக்கிறது.
- source_word: ἀποκαλυφθῆναι
  choice: வெளிப்படுத்தப்படவிருந்த
  rationale: செயப்பாட்டு வடிவத்தையும் வெளிப்பாடு சார்ந்த பவுலின் சொல்லாட்சியையும் பாதுகாக்கிறது.
theological_decisions:
- issue: πίστις என்பது பொதுவான தனிநபர் விசுவாசத்தையா, கிறிஸ்துவோடு தொடங்கிய மீட்பு வரலாற்று யதார்த்தத்தையா சுட்டுகிறது?
  choice: முதன்மை உரையில் ‘விசுவாசம்’ என்று மொழிபெயர்த்து, இரு பொருள் வாய்ப்புகளையும் சூழலுக்குள் திறந்தவையாக வைத்தல்.
  alternative: ‘விசுவாசத்தின் காலம்’ அல்லது ‘விசுவாச ஒழுங்கு’ என்று வெளிப்படையாக விரித்துரைத்தல்; அல்லது ‘உண்மைத்தன்மை’ என்று மொழிபெயர்த்தல்.
  rationale: கலாத்தியர் 3-ல் கிறிஸ்துவுக்கு முந்தையதும் பிந்தையதுமான காலங்கள் வேறுபடுத்தப்படுகின்றன. ஆயினும் உரை ‘காலம்’ அல்லது ‘ஒழுங்கு’ என்று நேரடியாகச் சொல்லாததால், அத்தகைய விளக்கத்தை முதன்மை உரைக்குள் சேர்க்காமல் உண்மையான இறையியல் இழுவையைப் பாதுகாக்கிறது.
- issue: சட்டத்தின் பங்கு பாதுகாப்பா அல்லது சிறைக்காவலா?
  choice: ‘காவலில் வைக்கப்பட்டு’ என்பதையும் ‘அடைத்து வைக்கப்பட்டு’ என்பதையும் சேர்த்து, இரு நுணுக்கங்களையும் தக்கவைத்தல்.
  alternative: முழுவதையும் நேர்மறையாக ‘பாதுகாக்கப்பட்டோம்’ என்றோ, முழுவதையும் எதிர்மறையாக ‘சிறைப்படுத்தப்பட்டோம்’ என்றோ மொழிபெயர்த்தல்.
  rationale: ἐφρουρούμεθα காவல் அல்லது பாதுகாப்பைச் சுட்டலாம்; συγκλειόμενοι கட்டுப்படுத்தி அடைப்பதை வலியுறுத்துகிறது. இரண்டையும் தக்கவைப்பது சட்டத்தின் பங்கை ஒருதலைப்பட்சமாகத் தீர்மானிக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. பழமையான ‘நியாயப்பிரமாணம்’ என்பதற்குப் பதிலாக இயல்பான ‘சட்டம்’ பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் நீண்ட வாக்கிய ஓட்டம் காக்கப்பட்டாலும், தமிழ் வாசிப்புத் தெளிவுக்காக கால எல்லைச் சொற்றொடர் முன்வைக்கப்பட்டுள்ளது.
