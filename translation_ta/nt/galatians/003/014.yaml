base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/014.yaml
  text: so that the blessing of Abraham might come to the Gentiles in Messiah Jesus[c][b][a], so that we might receive the promise of the Spirit through faith.
translation:
  language: ta
  text: ஆபிரகாமின் ஆசீர்வாதம் பிற இனத்தாருக்கு[a] மேசியாவாகிய இயேசுவுக்குள்[b] வந்து சேரும்படியாகவும், ஆவியின் வாக்குறுதியை[c] நாம் விசுவாசத்தின் மூலம் பெற்றுக்கொள்ளும்படியாகவும் இது நிகழ்ந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேசங்களுக்கு.”
    reason: lexical_alternative
  - marker: b
    text: 'மரபான மொழிபெயர்ப்பு: “கிறிஸ்து இயேசுவுக்குள்.”'
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “வாக்குறுதி அளிக்கப்பட்ட ஆவியை.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα … ἵνα
  choice: … வந்து சேரும்படிக்கும், … பெற்றுக்கொள்ளும்படிக்கும்
  rationale: இரண்டு ἵνα தொடர்களின் இணையான நோக்கக் கட்டமைப்பைத் தமிழில் இயல்பாகவும் தெளிவாகவும் காக்கிறது.
- source_word: εἰς τὰ ἔθνη
  choice: பிற இனத்தாருக்கு
  rationale: இச்சூழலில் யூதரல்லாத மக்களைச் சுட்டும் பவுலின் பயன்பாட்டை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; ‘தேசங்களுக்கு’ என்ற சொற்சார்ந்த மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἡ εὐλογία τοῦ Ἀβραὰμ
  choice: ஆபிரகாமின் ஆசீர்வாதம்
  rationale: ஆபிரகாமுடன் தொடர்புடைய ஆசீர்வாதத்தைச் சுட்டும் மரபான, தெளிவான தமிழ் வடிவம்.
- source_word: γένηται
  choice: வந்து சேரும்படி
  rationale: γίνομαι என்பதன் இச்சூழலுக்குரிய விளைவு/சென்றடைதல் பொருளை, தமிழில் கடினமான ‘ஆகும்படி’ என்பதைக் காட்டிலும் இயல்பாகத் தருகிறது.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: மேசியாவாகிய இயேசுவுக்குள்
  rationale: Χριστός என்பதன் பட்டப்பெயர் வலிமையை ‘மேசியா’ என மொழிபெயர்த்து, ἐν என்பதன் ஒன்றிப்பைச் சுட்டும் வடிவத்தையும் காக்கிறது.
- source_word: τὴν ἐπαγγελίαν τοῦ πνεύματος
  choice: ஆவியின் வாக்குறுதி
  rationale: கிரேக்க மரபுத்தொடரின் இலக்கணத் திறந்தநிலையைப் பாதுகாக்கிறது; ‘வாக்குறுதி அளிக்கப்பட்ட ஆவி’ என்ற சூழல்சார் விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: λάβωμεν
  choice: நாம் பெற்றுக்கொள்ளும்படி
  rationale: ἵνα உடன் வரும் நோக்கத்தை இயல்பான தமிழ் வினைவடிவில் வெளிப்படுத்துகிறது.
- source_word: διὰ τῆς πίστεως
  choice: விசுவாசத்தின் வழியாக
  rationale: πίστις என்பதற்கு இச்சூழலில் ‘விசுவாசம்’ பொருத்தமானது; διά குறிக்கும் வழிமுறையையும் வெளிப்படையாக வைத்திருக்கிறது.
theological_decisions:
- issue: Χριστῷ என்பது பட்டப்பெயரா அல்லது பெயர்போன்ற வடிவமா
  choice: மேசியாவாகிய இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: ஆபிரகாமிய வாக்குறுதியைப் பற்றிய பவுலின் வாதத்தில் Χριστός என்பதன் பட்டப்பெயர் பொருள் உயிருடன் உள்ளது; ‘மேசியாவாகிய’ என்பது இயல்பான தமிழில் அதைத் தெளிவாக்குகிறது.
- issue: τοῦ πνεύματος என்ற உருபுத்தொடரின் பொருள்
  choice: ஆவியின் வாக்குறுதி
  alternative: வாக்குறுதி அளிக்கப்பட்ட ஆவி
  rationale: முதன்மை உரை கிரேக்கத்தின் உறவைத் தீர்மானிக்காமல் காக்கிறது; ஆவியே வாக்குறுதியின் உள்ளடக்கம் என்ற வலுவான சூழல்சார் வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: இரட்டை ἵνα தொடர்களின் தொடர்பு
  choice: இணையான இரண்டு நோக்கங்கள்
  alternative: இரண்டாவது தொடர் முதலாவதன் விளக்கம் அல்லது விளைவு
  rationale: இரு தொடர்களையும் ஒரே தமிழ் நோக்கவடிவில் அமைப்பது மூலத்தின் இணைப்பைத் தெளிவாகக் காக்கிறது; அவற்றின் துல்லியமான தர்க்கத் தொடர்பை மேலதிகமாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘இது நிகழ்ந்தது’ என்பது முந்தைய வசனத்தில் கூறப்பட்ட மீட்புச் செயலை நோக்கும் ἵνα சார்புத்தொடர்களைத் தமிழில் முழுமையான வாக்கியமாக்குகிறது; புதிய காரணத்தைச் சேர்ப்பதில்லை. எல்லா அடிக்குறிப்பு குறிகளும் தொடர்புடைய சொற்றொடர்களுக்குப் பின் முதன்மை உரையில் இடம்பெற்றுள்ளன.
