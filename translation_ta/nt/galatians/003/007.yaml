  text: Γινώσκετε ἄρα ὅτι οἱ ἐκ πίστεως, οὗτοι ⸂υἱοί εἰσιν⸃ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/007.yaml
  text: Know, then, that those of faith—these are Abraham’s sons.
translation:
  language: ta
  text: ஆகவே, விசுவாசத்தைச் சார்ந்தவர்களே ஆபிரகாமின் பிள்ளைகள் என்பதை அறிந்துகொள்ளுங்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γινώσκετε
  choice: அறிந்துகொள்ளுங்கள்
  rationale: இவ்வடிவம் கட்டளையாகவும் கூற்றாகவும் புரியக்கூடியது; சூழலில் பவுல் வாசகர்கள் உணர வேண்டிய முடிவை வலியுறுத்துவதால் கட்டளைத் தொனியில் மொழிபெயர்க்கப்பட்டது.
- source_word: ἄρα
  choice: ஆகவே
  rationale: முந்தைய வசனத்திலிருந்து எடுக்கப்படும் முடிவைக் குறிக்கும் இயல்பான தமிழ் இணைப்புச் சொல்.
- source_word: οἱ ἐκ πίστεως
  choice: விசுவாசத்தைச் சார்ந்தவர்கள்
  rationale: ἐκ என்பதன் மூலாதாரம்/அடையாளம் சார்ந்த நுணுக்கத்தை இயல்பான தமிழில் தக்கவைக்கிறது; வெறுமனே ‘விசுவாசிக்கிறவர்கள்’ என்று சுருக்கவில்லை.
- source_word: οὗτοι
  choice: அவர்களே
  rationale: கிரேக்கத்தின் சுட்டும் வலியுறுத்தலைத் தமிழின் ‘-ஏ’ விகுதி இயல்பாக வெளிப்படுத்துகிறது.
- source_word: υἱοί
  choice: பிள்ளைகள்
  rationale: இங்கு ஆபிரகாமோடு உள்ள உடன்படிக்கை/வம்ச உறவைச் சுட்டுகிறது; கலப்பின மக்களைக் கொண்ட குழுவைக் குறிக்கும் சூழலில் நவீனத் தமிழில் உள்ளடக்கமான மரபியல் சொல்லாக ‘பிள்ளைகள்’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: ஆபிரகாமின் பிள்ளைகள் யார் என்ற அடையாளம்
  choice: ‘விசுவாசத்தைச் சார்ந்தவர்களே’ என்ற வலியுறுத்தலைப் பாதுகாத்தல்
  alternative: ‘விசுவாசிக்கிறவர்கள் ஆபிரகாமின் சந்ததியினர்’
  rationale: மூலத்தில் οὗτοι மூலம் வரும் எதிர்மறை ஒப்பீட்டு வலியுறுத்தலைத் தக்கவைக்கிறது; ‘சந்ததியினர்’ என்பது υἱοί என்பதைக் குறிப்பாக வம்சப் பொருளுக்குள் சுருக்கக்கூடும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. கிரேக்கச் சுட்டுப்பெயரின் வலியுறுத்தல் தமிழின் ‘அவர்களே’ என்பதில் இணைக்கப்பட்டுள்ளது.
