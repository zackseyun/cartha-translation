id: GAL.3.8
reference: Galatians 3:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: προϊδοῦσα δὲ ἡ γραφὴ ὅτι ἐκ πίστεως δικαιοῖ τὰ ἔθνη ὁ θεὸς προευηγγελίσατο τῷ Ἀβραὰμ ὅτι Ἐνευλογηθήσονται ἐν σοὶ πάντα τὰ ἔθνη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/008.yaml
  text: 'And the Scripture[a], foreseeing that God justifies the nations by faith[b], proclaimed the good news beforehand to Abraham: “In you all the nations will be blessed.”'
translation:
  language: ta
  text: 'விசுவாசத்தின் அடிப்படையில் கடவுள் மக்களினங்களை[a] நீதிமான்களாக அறிவிக்கிறார் என்பதை வேதம் முன்கூட்டியே கண்டு, ஆபிரகாமுக்கு நற்செய்தியை முன்னதாகவே அறிவித்தது[b]: “உன்னில் எல்லா மக்களினங்களும் ஆசீர்வதிக்கப்படும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “யூதரல்லாதவர்களை”; கிரேக்கத்தில் ἔθνη என்பது “மக்களினங்கள்” அல்லது “யூதரல்லாதவர்கள்” என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “ஆபிரகாமுக்கு நற்செய்தியை முன்கூட்டியே பிரசங்கித்தது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προϊδοῦσα
  choice: முன்கூட்டியே கண்டு
  rationale: முதன்மை வினைக்கு முன்னதாக நிகழ்ந்த பார்வையை அசல் இறந்தகாலப் பங்கேற்பு உணர்த்துகிறது; இந்தத் தேர்வு அந்தக் காலத் தொடர்பையும் வேதத்தின் உருவகப்படுத்தலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἡ γραφή
  choice: வேதம்
  rationale: இங்கு பொதுவான ஓர் எழுத்தை அல்ல, பவுல் ஆளுருவாக்கிப் பேசும் அதிகாரமுள்ள வேதத்தைக் குறிக்கிறது.
- source_word: ἐκ πίστεως
  choice: விசுவாசத்தின் அடிப்படையில்
  rationale: ἐκ என்பதன் அடிப்படை/ஆதாரப் பொருளைத் தெளிவுபடுத்துகிறது; πίστις என்பதற்கு நிலையான ‘விசுவாசம்’ என்ற சொல்லைக் காக்கிறது.
- source_word: δικαιοῖ
  choice: நீதிமான்களாக அறிவிக்கிறார்
  rationale: பவுலின் சூழலில் உள்ள நீதித்தீர்ப்பு சார்ந்த வலிமையைப் பாதுகாக்கிறது; உள்ளார்ந்த மாற்றம் மட்டுமே என்று பொருள் சுருக்கப்படுவதைத் தவிர்க்கிறது.
- source_word: τὰ ἔθνη ... πάντα τὰ ἔθνη
  choice: மக்களினங்களை ... எல்லா மக்களினங்களும்
  rationale: இரு இடங்களிலும் ஒரே தமிழ்ச் சொல்லைப் பயன்படுத்தி, பவுலின் கூற்றுக்கும் ஆபிரகாமிய வாக்குறுதிக்கும் உள்ள வெளிப்படையான தொடர்பைக் காக்கிறது. ‘நாடுகள்’ என்பதைவிட மனிதக் குழுக்களை இயல்பாகக் குறிக்கிறது.
- source_word: προευηγγελίσατο
  choice: நற்செய்தியை முன்னதாகவே அறிவித்தது
  rationale: வினையில் உள்ள εὐαγγελ- என்ற நற்செய்திப் பொருளையும் முன்கூட்டிய அறிவிப்பையும் தெளிவாகக் காக்கிறது.
- source_word: τῷ Ἀβραὰμ
  choice: ஆபிரகாமுக்கு
  rationale: மறைமுகப் பொருளைக் குறிக்கும் வேற்றுமையை இயல்பான தமிழில் நேரடியாக வழங்குகிறது.
- source_word: Ἐνευλογηθήσονται
  choice: ஆசீர்வதிக்கப்படும்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தையும் வாக்குறுதியின் வடிவத்தையும் விளக்கவுரை சேர்க்காமல் காக்கிறது.
- source_word: ἐν σοὶ
  choice: உன்னில்
  rationale: ஆதியாகம மேற்கோளின் உடன்படிக்கை மற்றும் பிரதிநிதித்துவப் பேச்சைத் தீர்மானித்து விளக்காமல், கிரேக்க முன்னிடைச்சொல்லின் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ἔθνη என்பதை ‘மக்களினங்கள்’ என்றா, ‘யூதரல்லாதவர்கள்’ என்றா மொழிபெயர்ப்பது
  choice: இரு இடங்களிலும் ‘மக்களினங்கள்’
  alternative: முதல் இடத்தில் ‘யூதரல்லாதவர்கள்’, மேற்கோளில் ‘எல்லா மக்களினங்களும்’
  rationale: பவுலின் பயன்பாட்டில் ‘யூதரல்லாதவர்கள்’ என்ற பொருள் சாத்தியமானதாயிருந்தாலும், ஒரே சொல்லை இரு இடங்களிலும் காப்பது நீதிமான்களாக்கப்படுவோருக்கும் ஆபிரகாமிய வாக்குறுதியில் காணப்படும் உலக மக்களுக்கும் உள்ள தொடர்பை வெளிப்படையாக வைத்திருக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: δικαιοῖ என்பதன் நீதித்தீர்ப்பு சார்ந்த நுண்பொருள்
  choice: நீதிமான்களாக அறிவிக்கிறார்
  alternative: நீதிமான்களாக்குகிறார்
  rationale: இச்சூழலில் கடவுளின் நீதித் தீர்ப்புச் செயலைத் தெளிவாகக் காட்டுகிறது; அதேவேளையில் விரிவான ஒரு குறிப்பிட்ட கோட்பாட்டு அமைப்பை வசனத்திற்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘வேதம் ... கண்டு ... அறிவித்தது’ என்ற ஆளுருவாக்கம் அசலின் சொல்லாட்சியைப் பாதுகாக்கிறது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பிறகு வைக்கப்பட்டுள்ளன.
