  yaml_path: translation/nt/galatians/003/024.yaml
  text: So then[a], the law has become our guardian until Messiah[b], so that we might be justified by faith.
translation:
  language: ta
  text: ஆகவே, திருச்சட்டம் மேசியாவரைக்கும்[b] நம்முடைய காப்பாளராக[a] ஆகியிருக்கிறது; விசுவாசத்தினால் நாம் நீதிமான்கள் எனத் தீர்க்கப்படும்படியாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மேற்பார்வையாளர்’; மரபாக, ‘ஆசிரியர்’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்க παιδαγωγός என்பது முதன்மையாக வகுப்பறை ஆசிரியரைக் குறிக்காமல், ஒரு பிள்ளையைக் கண்காணிக்கும் குடும்பப் பொறுப்பாளரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘மேசியாவை நோக்கி’; இதை ‘மேசியாவிடம் வழிநடத்துவதாக’ என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: ஆகவே
  rationale: முந்தைய வாதத்திலிருந்து பெறப்படும் முடிவை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; இதனை நோக்கப்பொருளாகப் புரிந்துகொள்வதைத் தவிர்க்கிறது.
- source_word: ὁ νόμος
  choice: திருச்சட்டம்
  rationale: இச்சூழலில் அறியப்பட்ட மோசேயின் சட்டத்தைக் குறிக்கிறது. ‘திருச்சட்டம்’ என்பது அதன் வேதச்சூழலைத் தெளிவாக்கும், வாசிக்க எளிய சுருக்கமான சொல்.
- source_word: παιδαγωγὸς
  choice: காப்பாளர்
  rationale: கிரேக்க-ரோம உலகில் παιδαγωγός என்பவர் முதன்மையாக வகுப்பறை ஆசிரியர் அல்ல; வயதுவராத பிள்ளையைக் கண்காணித்து வழிநடத்தும் குடும்பப் பொறுப்பாளர். ‘காப்பாளர்’ அந்தப் பங்கை இயல்பாகக் காட்டுகிறது.
- source_word: ἡμῶν
  choice: நம்முடைய
  rationale: παιδαγωγός என்பதோடு உள்ள உடைமை அல்லது உறவைக் குறிக்கும் பன்மைத் தன்மையை நேரடியாகப் பாதுகாக்கிறது.
- source_word: γέγονεν
  choice: ஆகியிருக்கிறது
  rationale: கடந்த காலத்தில் ஏற்பட்ட செயல் இப்போது விளைவுநிலையில் இருப்பதைச் சுட்டும் perfect காலத்தின் வலிமையைப் பாதுகாக்கிறது.
- source_word: εἰς Χριστόν
  choice: மேசியாவரைக்கும்
  rationale: εἰς என்பதன் இலக்கு அல்லது எல்லை சார்ந்த பொருளையும், சட்டத்தின் தற்காலிகக் காப்பாளர் பணியையும் சுருக்கமாக வெளிப்படுத்துகிறது; வேறு சாத்தியமான புரிதல்கள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
- source_word: Χριστόν
  choice: மேசியா
  rationale: Χριστός இங்கு பட்டப்பெயரின் வலிமையுடன் வருவதால், பெயர்போல் ஒலிபெயர்க்காமல் அதன் பொருளைத் தரும் ‘மேசியா’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἵνα
  choice: என்பதற்காக
  rationale: இங்கு ἵνα அறிமுகப்படுத்தும் நோக்கத்தை இயல்பான தமிழில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: ἐκ πίστεως
  choice: விசுவாசத்தின் அடிப்படையில்
  rationale: ἐκ என்பதன் அடிப்படை அல்லது வழிமுறை சார்ந்த பொருளைத் தெளிவாக வெளிப்படுத்தி, அதை வெறும் தோற்றுவாய் என்ற பொருளில் வாசிப்பதைத் தவிர்க்கிறது.
- source_word: δικαιωθῶμεν
  choice: நீதிமான்களாகத் தீர்க்கப்படுவதற்கு
  rationale: செயப்பாட்டு வடிவத்தையும், நீதிமன்றத் தீர்ப்பை ஒத்த ‘நீதிமான்கள் என அறிவிக்கப்படுதல்’ என்ற பவுலின் சொல்லாட்சியையும் பாதுகாக்கிறது; உள்ளார்ந்த மாற்றம் மட்டுமே எனக் குறுக்கிவிடவில்லை.
theological_decisions:
- issue: εἰς Χριστόν என்பதில் திருச்சட்டத்தின் பணிக்கும் மேசியாவுக்கும் உள்ள உறவு
  choice: ‘மேசியாவரைக்கும்’ என்று மொழிபெயர்த்து, மேசியாவைத் திருச்சட்டத்தின் காப்பாளர் பணியின் இலக்கு அல்லது முடிவெல்லையாகக் காட்டுதல்
  alternative: ‘மேசியாவை நோக்கி’ அல்லது ‘மேசியாவிடம் வழிநடத்துவதாக’ புரிந்துகொள்ளுதல்
  rationale: கலாத்தியர் 3-இன் சூழல் மேசியாவோடு தொடர்புடைய விசுவாசம் வெளிப்படுவதற்கு முந்தைய திருச்சட்டத்தின் தற்காலிகப் பணியை வலியுறுத்துகிறது. அதேவேளை εἰς என்பதில் திசை அல்லது இலக்கு சார்ந்த நுணுக்கமும் இருப்பதால் மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: δικαιωθῶμεν என்பதன் பொருள்
  choice: ‘நீதிமான்களாகத் தீர்க்கப்படுதல்’ என்ற நீதிமன்றத் தீர்ப்பு சார்ந்த மொழியைப் பயன்படுத்துதல்
  alternative: ‘நீதிமான்களாக்கப்படுதல்’
  rationale: கிரேக்கச் செயப்பாட்டு வினையின் அறிவிப்பு/தீர்ப்பு சார்ந்த வலிமையைத் தெளிவாக வைத்திருக்கிறது; அந்தச் சொல்லை நெறிமுறை மாற்றம் மட்டும் எனத் தீர்மானிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வேதநடை பயன்படுத்தப்பட்டுள்ளது. ‘காப்பாளர்’ பழங்கால சமூகப் பங்கைப் புரியத்தக்கவாறு தெரிவிக்கிறது; ‘நீதிமான்களாகத் தீர்க்கப்படுதல்’ சட்ட/நீதிமன்ற நுணுக்கத்தைப் பாதுகாக்கிறது. அனைத்து அடிக்குறிப்பு குறிகளும் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்பே வைக்கப்பட்டுள்ளன.
