id: GAL.3.29
reference: Galatians 3:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ δὲ ὑμεῖς Χριστοῦ, ἄρα τοῦ Ἀβραὰμ σπέρμα ἐστέ, ⸀κατ’ ἐπαγγελίαν κληρονόμοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/029.yaml
  text: And if you are Messiah’s[a], then you are Abraham’s seed[b], heirs according to promise.
translation:
  language: ta
  text: நீங்கள் மெசியாவுக்குரியவர்கள்[a] என்றால், அப்படியானால் நீங்கள் ஆபிரகாமின் வித்தாகவும்[b], வாக்குறுதியின்படி வாரிசுகளாகவும் இருக்கிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்துவுக்குரியவர்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “சந்ததியினர்” அல்லது “வழித்தோன்றல்கள்.” கிரேக்கத்தில் ‘வித்து’ என்பது இங்கு ஒருமையில் இருந்து கூட்டுப்பொருளைக் கொண்டுள்ளது; இந்த அதிகாரத்தில் பவுல் முன்பு பயன்படுத்திய அதே சொல்லையும் இது எதிரொலிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστοῦ
  choice: மெசியாவுக்குரியவர்கள்
  rationale: Χριστοῦ என்பது உடைமை அல்லது உரிமைத் தொடர்பைக் காட்டும் மரபுவேற்றுமை வடிவம். ‘மெசியாவுக்குரியவர்கள்’ என்பது அந்தச் சேர்ந்திருத்தலை இயல்பான தமிழில் தெரிவிக்கிறது; Χριστός என்பதன் பட்டப்பெயர் தன்மையையும் காக்கிறது.
- source_word: σπέρμα
  choice: வித்து
  rationale: இது ஒருமை வடிவில் இருந்தாலும் கூட்டுப்பொருளில் வருகிறது. கலாத்தியர் 3-இன் முந்தைய பகுதியில் பவுல் பயன்படுத்திய ‘வித்து’ என்ற சொல்லுடனான திட்டமிட்ட சொல் தொடர்பைக் காக்க இச்சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: κληρονόμοι
  choice: வாரிசுகள்
  rationale: குடும்ப மற்றும் உடன்படிக்கைச் சூழலில் κληρονόμοι என்பதற்கான இயல்பான நவீனத் தமிழ் இணைச்சொல் இது.
- source_word: κατ’ ἐπαγγελίαν
  choice: வாக்குறுதியின்படி
  rationale: இந்தச் சொற்றொடர் வாக்குறுதியை அடிப்படையாகவோ அளவுகோலாகவோ குறிப்பிடலாம்; அந்த நுட்பத்தை மிகையாகத் தீர்மானிக்காமல் கிரேக்கத்தின் திறந்த பொருளை இவ்வாக்கம் காக்கிறது.
- source_word: εἰ δὲ ὑμεῖς ... ἄρα
  choice: நீங்கள் ... என்றால், அப்படியானால்
  rationale: நிபந்தனையையும் அதிலிருந்து வரும் முடிவையும் தெளிவாகக் காட்டும் இயல்பான தமிழாக்கம்.
theological_decisions:
- issue: σπέρμα என்பதை இயல்பான பன்மைச் சொல்லால் மொழிபெயர்ப்பதா, அல்லது அதிகாரத்தின் முந்தைய வாதத்துடன் உள்ள ஒருமைச் சொல் தொடர்பைக் காப்பதா?
  choice: வித்து
  alternative: சந்ததியினர் / வழித்தோன்றல்கள்
  rationale: கலாத்தியர் 3:16 உட்பட முந்தைய வசனங்களில் ஆபிரகாமின் ‘வித்து’ குறித்த பவுலின் வாதத்துடன் 3:29 நேரடியாக இணைகிறது. ‘வித்து’ அந்தச் சொல் மற்றும் இறையியல் தொடர்பைக் காக்கிறது; அது இங்கு கூட்டுப்பொருள் கொண்டது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: Χριστός என்பதை பெயர்போல் ‘கிறிஸ்து’ எனவா அல்லது பட்டப்பெயராக ‘மெசியா’ எனவா வழங்குவது?
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு Χριστός பட்டப்பெயரின் பொருளைத் தக்கவைத்தே வருகிறது. ‘மெசியா’ அந்தப் பொருளை வெளிப்படையாகக் காக்கிறது; பரவலான மாற்று வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான மொழி பயன்படுத்தப்பட்டுள்ளது. ‘வித்து’ அன்றாட வழக்கில் சற்றுக் குறைவாக இருந்தாலும், கலாத்தியர் 3 முழுவதும் உள்ள முக்கியமான சொல் தொடர்பைக் காக்கும் பொருட்டு முதன்மை உரையில் வைக்கப்பட்டு, இயல்பான மாற்றுகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
