id: GAL.3.27
reference: Galatians 3:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅσοι γὰρ εἰς Χριστὸν ἐβαπτίσθητε, Χριστὸν ἐνεδύσασθε·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/027.yaml
  text: For as many of you as were baptized into Messiah have put on Messiah[a][b].
translation:
  language: ta
  text: ஏனெனில், உங்களில் மெசியாவுக்குள் திருமுழுக்குப் பெற்ற அனைவரும் மெசியாவை அணிந்துகொண்டீர்கள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மெசியா” வரும் இரு இடங்களிலும் “கிறிஸ்து” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “மெசியாவை ஆடையாக அணிந்துகொண்டீர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι
  choice: உங்களில் ... அனைவரும்
  rationale: ὅσοι என்பதன் ‘எத்தனை பேரோ அத்தனை பேரும்’ என்ற தொடர்புறுத்தும் வலிமையை, கலாத்தியர்களை நேரடியாகக் குறிப்பதோடு இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தின் கூற்றை இவ்வசனம் விளக்குகிறது என்பதைக் காக்கிறது.
- source_word: εἰς
  choice: -க்குள்
  rationale: மெசியாவுடனான ஒன்றிணைவு அல்லது அவருக்குள் இணைக்கப்படுதல் என்ற பொருளை விரிவான கோட்பாட்டு விளக்கமாக மாற்றாமல் நேரடியாகக் காக்கிறது.
- source_word: Χριστόν
  choice: மெசியா
  rationale: Χριστός இங்கு அபிஷேகம் பெற்றவர் என்ற பட்டப்பொருளுடன் செயல்படுவதால் ‘மெசியா’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἐβαπτίσθητε
  choice: திருமுழுக்குப் பெற்ற
  rationale: கிரேக்க வினையின் செயப்பாட்டு வடிவத்தைக் காக்கிறது; திருமுழுக்கின் முறை குறித்து ஒரு குறிப்பிட்ட மரபின் முடிவைத் திணிக்கவில்லை.
- source_word: ἐνεδύσασθε
  choice: அணிந்துகொண்டீர்கள்
  rationale: ஆடையை அணிதல் என்ற உருவகத்தை இயல்பான நவீன தமிழில் தெளிவாகக் காக்கிறது; கிரேக்க நடுநிலை வினையின் நுணுக்கத்தையும் ஏற்ற அளவில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: திருமுழுக்கு பற்றிய சொற்றொடர் ஒரு குறிப்பிட்ட திருவருட்சாதனக் கோட்பாட்டையோ திருமுழுக்கு முறையையோ கட்டாயமாகக் குறிக்க வேண்டுமா?
  choice: மெசியாவுக்குள் திருமுழுக்குப் பெற்ற
  alternative: மெசியாவுக்குள் மூழ்கடிக்கப்பட்ட / மெசியாவைச் சார்ந்து திருமுழுக்குப் பெற்ற
  rationale: கிரேக்கம் மெசியாவுக்குள் இணைக்கப்படுதலைக் கூறுகிறது; ஆனால் திருமுழுக்கின் பயன் அல்லது உடல்சார் முறை பற்றிய பிற்காலக் கோட்பாட்டு விவாதங்களை இச்சொற்றொடர் தனியாகத் தீர்மானிப்பதில்லை. ஆகவே அந்த இறையியல் பதற்றம் அப்படியே பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘உங்களில் ... அனைவரும்’ என்பது மூலத்தின் ὅσοι அமைப்பை இயல்பாக எடுத்துரைக்கிறது. ‘அணிந்துகொண்டீர்கள்’ என்ற சொல் ஆடை உருவகத்தைத் தக்கவைக்கிறது; அடிக்குறிப்பு அதன் சொல்லர்த்த வடிவத்தைத் தெளிவுபடுத்துகிறது.
