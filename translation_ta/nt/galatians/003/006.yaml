reference: Galatians 3:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καθὼς Ἀβραὰμ ἐπίστευσεν τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/006.yaml
  text: Just as Abraham believed God[a], and it was counted to him as righteousness,
translation:
  language: ta
  text: அவ்வாறே, ஆபிரகாம் கடவுளை நம்பினார்; அது அவருக்கு நீதியாகக் கணக்கிடப்பட்டது[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நியாயமாக.”
    reason: δικαιοσύνη என்பதற்கான உண்மையான சொற்பொருள் மாற்றைச் சுட்டுகிறது.
lexical_decisions:
- source_word: καθὼς
  choice: அவ்வாறே
  rationale: முந்தைய கருத்தை ஆபிரகாமின் எடுத்துக்காட்டுடன் ஒப்பிட்டு உறுதிப்படுத்தும் தொடர்பை இயல்பான தமிழில் காக்கிறது.
- source_word: Ἀβραὰμ
  choice: ஆபிரகாம்
  rationale: தமிழ் வேதாகம மரபில் பரவலாக அறியப்படும் பெயர்வடிவம்.
- source_word: ἐπίστευσεν
  choice: நம்பினார்
  rationale: πιστεύω என்பதன் நேரடியான பொருளைக் கொடுக்கிறது; ‘விசுவாசம் வைத்தார்’ போன்ற விளக்க விரிவைச் சேர்க்கவில்லை.
- source_word: τῷ θεῷ
  choice: கடவுளை
  rationale: πιστεύω உடன் வரும் இறைவனைக் குறிக்கும் வேற்றுமையை, கடவுள் கூறியதை உண்மையென ஏற்றுக்கொண்டார் என்ற நேரடித் தன்மையுடன் ‘கடவுளை நம்பினார்’ என வழங்குகிறது.
- source_word: ἐλογίσθη
  choice: கணக்கிடப்பட்டது
  rationale: λογίζομαι என்பதிலுள்ள கணக்கில் சேர்த்தல் அல்லது மதித்தல் என்ற பொருளைத் தக்கவைக்கும் இயல்பான செயப்பாட்டு வடிவம்.
- source_word: αὐτῷ
  choice: அவருக்கு
  rationale: எவருக்காக அல்லது எவருடைய கணக்கில் அது மதிக்கப்பட்டது என்பதைத் தெளிவாகக் குறிக்கிறது.
- source_word: εἰς δικαιοσύνην
  choice: நீதியாக
  rationale: εἰς உடன் வரும் δικαιοσύνην-ஐ முடிவு அல்லது மதிப்பீடாகக் காட்டுகிறது; தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
theological_decisions:
- issue: பவுலின் மேற்கோளில் δικαιοσύνη என்பதன் மொழிபெயர்ப்பு
  choice: நீதி
  alternative: நியாயம்
  rationale: இங்கு ஆபிரகாமுக்குக் கணக்கிடப்பட்ட நிலை அல்லது ஏற்றுக்கொள்ளப்பட்ட நேர்மையான நிலையை ‘நீதி’ நன்கு வெளிப்படுத்துகிறது. δικαιοσύνη என்பதன் சமூக/நியாயத் தளத்தையும் முற்றாக மறைக்காமல் மாற்று ‘நியாயம்’ அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், கண்ணியமான தமிழ். கிரேக்க வாக்கியம் அடுத்த வசனத்தில் தொடர்வதால் இறுதியில் முற்றுப்புள்ளிக்குப் பதிலாக காற்புள்ளி வைக்கப்பட்டுள்ளது. மேற்கோளின் இரு கூறுகளைத் தெளிவுபடுத்த அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
