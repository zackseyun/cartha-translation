  text: A mediator is not of one[b][a], but God is one.
translation:
  language: ta
  text: மத்தியஸ்தர் ஒருவருக்கானவர் அல்ல[a]; ஆனால் கடவுள் ஒருவரே[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல்லாக, “மத்தியஸ்தர் ஒருவருடையவர் அல்ல.” இதன் பொருள், “அவர் ஒருவருக்காக மட்டும் செயல்படுவதில்லை” அல்லது “அவர் ஒரு தரப்புக்கு மட்டும் உரியவர் அல்ல” என்பதாக இருக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: “கடவுள் ஒருவரே” என்பது ஒரே கடவுள் என்ற இஸ்ரயேலின் நம்பிக்கை அறிக்கையை எதிரொலிக்கலாம்; உபாகமம் 6:4-ஐ ஒப்பிடுக.
    reason: cross_reference
lexical_decisions:
- source_word: μεσίτης
  choice: மத்தியஸ்தர்
  rationale: இரு தரப்புகளுக்கு இடையில் நின்று உடன்பாட்டை ஏற்படுத்துகிறவரைக் குறிக்கும் துல்லியமான, வழக்கிலுள்ள சொல்; சட்ட மற்றும் உடன்படிக்கைச் சார்ந்த நுட்பத்தையும் காக்கிறது.
- source_word: ἑνὸς
  choice: ஒருவருக்கு மட்டும் உரியவர்
  rationale: ‘ஒருவருடையவர்’ என்ற நேரடி வடிவம் தமிழில் தெளிவின்றியும் இயல்பற்றும் இருப்பதால், கிரேக்கத்தின் சுருக்கமான தொடர்புப் பொருளை குறைந்த அளவு மட்டும் வெளிப்படுத்துகிறது; ‘தரப்பு’ என்பதை மூலத்தில் இல்லாத அளவுக்கு வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: οὐκ ἔστιν
  choice: அல்ல
  rationale: மூலத்தின் நேரடியான மறுப்பையும் புதிரான சுருக்கத்தையும் காக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: δὲ
  choice: ஆனால்
  rationale: இரண்டாவது δέ வெளிப்படுத்தும் முரண்பாட்டைத் தெளிவாகக் காட்டுகிறது; முதல் δέ-க்கு தனிச் சொல் சேர்க்காமல் தமிழ் வாக்கிய ஓட்டத்தில் மாற்றத்தை உணர்த்துகிறது.
- source_word: ὁ δὲ θεὸς εἷς ἐστιν
  choice: ஆனால் கடவுள் ஒருவரே
  rationale: கிரேக்கத்தின் எளிய வலியுறுத்தலையும் ஒரே கடவுள் குறித்த வேதாகம அறிக்கையின் எதிரொலியையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: முதல் அரையடியில் பவுலின் சுருக்கமான, பலவாறு புரிந்துகொள்ளக்கூடிய வாதம்
  choice: மத்தியஸ்தர் ஒருவருக்கு மட்டும் உரியவர் அல்ல
  alternative: மத்தியஸ்தர் ஒருவருடையவர் அல்ல; மத்தியஸ்தர் ஒரு தரப்புக்காக மட்டும் செயல்படுவதில்லை
  rationale: மோசே, கிறிஸ்து, சட்டம் அல்லது உடன்படிக்கை குறித்த ஒரு குறிப்பிட்ட விளக்கத்தை வசனத்திற்குள் புகுத்தாமல், மத்தியஸ்தம் ஒருவரை மட்டும் சார்ந்ததல்ல என்ற குறைந்தபட்ச தொடர்புப் பொருளையும் மூலத்தின் இறையியல் பதற்றத்தையும் காக்கிறது.
- issue: ‘கடவுள் ஒருவரே’ என்ற அறிக்கையின் பொருள்
  choice: கடவுள் ஒருவரே
  alternative: ஒரே கடவுள்தான் இருக்கிறார்
  rationale: உபாகமம் 6:4-ஐ எதிரொலிக்கக்கூடிய ஒருமைத்துவ அறிக்கையை நேரடியாகக் காக்கிறது; அந்த எதிரொலியை மொழிபெயர்ப்பிலேயே விளக்கமாக விரிவாக்கவில்லை.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, கண்ணியமான பொதுநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் புகழ்பெற்ற சுருக்கமும் தெளிவின்மையும் முற்றாகத் தீர்க்கப்படாமல், தமிழில் புரியத் தேவையான அளவு மட்டும் வெளிப்படுத்தப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் உரையில் இடம்பெற்றுள்ளன.
