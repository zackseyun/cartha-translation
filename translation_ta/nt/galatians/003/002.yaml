id: GAL.3.2
reference: Galatians 3:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τοῦτο μόνον θέλω μαθεῖν ἀφ’ ὑμῶν, ἐξ ἔργων νόμου τὸ πνεῦμα ἐλάβετε ἢ ἐξ ἀκοῆς πίστεως;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/002.yaml
  text: 'This only I want to learn from you: did you receive the Spirit by works of the law[b][a], or by hearing with faith?'
translation:
  language: ta
  text: 'உங்களிடமிருந்து இதை மட்டும் தெரிந்துகொள்ள விரும்புகிறேன்: சட்டத்தின் செயல்களால் நீங்கள் ஆவியானவரைப் பெற்றீர்களா, அல்லது விசுவாசத்துடன்[b] கேட்டதாலா[a]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விசுவாசத்தின் கேள்வியால்.” இந்தச் சுருக்கமான கிரேக்கச் சொற்றொடர், விசுவாசத்தின் செய்தியைக் கேட்டதைக் குறிக்கவும் முடியும்.
    reason: alternative_reading
  - marker: b
    text: இங்கு “விசுவாசம்” என்பதற்கு “உண்மைத்தன்மை” என்ற நுண்பொருள் உண்டு எனச் சிலர் கருதுகின்றனர்; ஆனால் இச்சூழலில் அது குறைவான சாத்தியமுள்ள பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο μόνον
  choice: இதை மட்டும்
  rationale: பவுல் வலியுறுத்தி முன்வைக்கும் ஒரே கேள்வியை இயல்பான நவீனத் தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: θέλω μαθεῖν
  choice: தெரிந்துகொள்ள விரும்புகிறேன்
  rationale: θέλω + μαθεῖν என்பதிலுள்ள விருப்பத்தையும், அவர்களிடமிருந்து விடையை அறிய முற்படும் கேள்வித் தொனியையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀφ’ ὑμῶν
  choice: உங்களிடமிருந்து
  rationale: முன்னிடைச்சொல்லையும் பன்மைச் சுட்டையும் நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: ἐξ ἔργων νόμου
  choice: திருச்சட்டத்தின் செயல்களினாலா
  rationale: பவுலின் சுருக்கமான சொற்றொடரை விளக்கி விரிவாக்காமல் காக்கிறது; ἐξ என்பதன் வழிமுறை அல்லது அடிப்படை சார்ந்த பொருளை ‘-இனால்’ வெளிப்படுத்துகிறது. ‘திருச்சட்டம்’ என்பது நவீன வாசகர்களுக்குப் புரியக்கூடிய, கண்ணியமான சொல்.
- source_word: τὸ πνεῦμα
  choice: ஆவியானவரை
  rationale: இச்சூழலில் விசுவாசிகளுக்குக் கொடுக்கப்பட்ட இறை ஆவியே குறிக்கப்படுகிறார். கிரேக்கத்தில் இல்லாத ‘பரிசுத்த’ என்ற சொல்லைச் சேர்க்காமல், தமிழில் தனிப்பட்ட இறைச் சுட்டை இயல்பாகக் காட்டுகிறது.
- source_word: ἐλάβετε
  choice: பெற்றீர்கள்
  rationale: நிகழ்ந்து முடிந்த பெற்றுக்கொள்ளுதலைக் குறிக்கும் இறந்தகால வினையாக அஓரிஸ்டை இயல்பாக வழங்குகிறது.
- source_word: ἐξ ἀκοῆς πίστεως
  choice: விசுவாசத்தோடு கேட்டதினாலா
  rationale: திருச்சட்டத்தின் செயல்களுக்கு எதிராக, விசுவாசத்துடன் கேட்பதை ஆவியைப் பெற்றுக்கொண்ட வழியாக இயல்பான தமிழில் காட்டுகிறது. சுருக்கமான கிரேக்க உருபுத்தொடரின் வேறு சாத்தியங்களை அடிக்குறிப்புகளில் காக்கிறது.
- source_word: πίστεως
  choice: விசுவாசம்
  rationale: இச்சூழலில் πίστις என்பதற்கான மிக இயல்பான பொருள் ‘விசுவாசம்’. குறைவான சாத்தியமுள்ள ‘உண்மைத்தன்மை’ என்ற நுண்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: τὸ πνεῦμα என்பதன் குறிப்பு
  choice: விசுவாசிகளுக்குக் கொடுக்கப்பட்ட இறை ஆவியைக் குறிக்கும் ‘ஆவியானவர்’
  alternative: பொதுவான ஆன்மிக அனுபவம் அல்லது ஆன்மிக வல்லமை
  rationale: கலாத்தியர் 3-ன் உடனடிச் சூழல், கலாத்தியர்கள் கடவுளுடைய ஆவியைப் பெற்றதைப் பற்றிப் பேசுவதால் தனிப்பட்ட இறை ஆவியே குறிக்கப்படுவது மிகப் பொருத்தமானது.
- issue: ἀκοῆς πίστεως என்ற சுருக்கமான சொற்றொடரின் உறவு
  choice: விசுவாசத்தோடு கேட்டல்
  alternative: ‘விசுவாசத்தின் கேள்வி’ அல்லது விசுவாசத்தைப் பற்றிய செய்தியைக் கேட்டல்
  rationale: செயல்களுக்கும் விசுவாசத்துடன் கேட்பதற்கும் இடையிலான பவுலின் எதிர்மறை ஒப்பீட்டைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; எனினும் கிரேக்க உருபுத்தொடரின் உண்மையான இலக்கணச் சுருக்கத்தை அடிக்குறிப்பில் திறந்தவாறே வைக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘நியாயப்பிரமாணம்’, ‘கிரியைகள்’ போன்ற இன்றைய பொதுவாசகர்களுக்கு அரிதாகத் தோன்றக்கூடிய மரபுச் சொற்களுக்கு மாற்றாக ‘திருச்சட்டம்’, ‘செயல்கள்’ பயன்படுத்தப்பட்டுள்ளன. வாக்கியத்தின் கூர்மையான வினாவும், ‘இதை மட்டும்’ என்ற முன்னிலை வலியுறுத்தலும் காக்கப்பட்டுள்ளன.
