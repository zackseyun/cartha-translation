source:
  edition: SBLGNT
  text: εἰ γὰρ ἐκ νόμου ἡ κληρονομία, οὐκέτι ἐξ ἐπαγγελίας· τῷ δὲ Ἀβραὰμ δι’ ἐπαγγελίας κεχάρισται ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/018.yaml
  text: For if the inheritance is from the law[a], it is no longer from a promise; but God has graciously given it to Abraham through a promise.
translation:
  language: ta
  text: ஏனெனில், வாரிசுரிமை திருச்சட்டத்திலிருந்து வருமானால், அது இனி வாக்குறுதியிலிருந்து வருவதல்ல. ஆனால் கடவுள் வாக்குறுதியின் மூலம் அதை ஆபிரகாமுக்கு அருள்கூர்ந்து வழங்கியிருக்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுள் வாக்குறுதியினால் அதை ஆபிரகாமுக்கு வழங்கியிருக்கிறார்.”
    reason: κεχάρισται என்பதிலுள்ள அருள் சார்ந்த நுண்ணுணர்வை வெளிப்படுத்தாத எளிய ‘வழங்கியிருக்கிறார்’ என்ற மாற்றையும், διά என்பதற்கான இயல்பான கருவிப் பொருளான ‘வாக்குறுதியினால்’ என்பதையும் பதிவு செய்கிறது.
lexical_decisions:
- source_word: κληρονομία
  choice: வாரிசுரிமை
  rationale: ஒருவர் வாரிசாகப் பெறுவதைக் குறிக்கும் பவுலின் கருத்தைத் தெளிவாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: νόμου
  choice: திருச்சட்டம்
  rationale: சூழலில் மோசேயின் சட்டத்தைக் குறிக்கிறது; பொதுவான ‘சட்டம்’ என்பதைக் காட்டிலும் இந்த உடன்படிக்கைச் சூழலைத் தெளிவுபடுத்துகிறது.
- source_word: ἐκ νόμου
  choice: திருச்சட்டத்திலிருந்து
  rationale: ἐκ என்பதன் மூலாதாரம் அல்லது அடிப்படை என்ற பொருளைப் பேணி, ἐξ ἐπαγγελίας என்பதுடனான நேரடி முரண்பாட்டைக் காக்கிறது.
- source_word: ἐπαγγελίας
  choice: வாக்குறுதி
  rationale: ஆபிரகாமுக்குக் கடவுள் அளித்த வாக்குறுதியைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: οὐκέτι
  choice: இனி ... அல்ல
  rationale: திருச்சட்டம் மற்றும் வாக்குறுதி ஆகிய இரு அடிப்படைகளும் ஒரே நேரத்தில் வாரிசுரிமையின் மூலமாக இருக்க முடியாது என்ற விலக்கைத் தெளிவாகத் தருகிறது.
- source_word: δι’ ἐπαγγελίας
  choice: வாக்குறுதியின் மூலமாகவே
  rationale: διά என்பதன் வழிமுறைப் பொருளைக் காத்து, திருச்சட்டத்துடனான முரண்பாட்டை ‘வே’ என்ற வலியுறுத்தலால் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: κεχάρισται
  choice: அருளாக வழங்கியிருக்கிறார்
  rationale: χαρίζομαι என்பதிலுள்ள அருளான, இலவசமான கொடை என்ற நுண்ணுணர்வையும் நிறைவேறிய செயல் தொடரும் விளைவையும் வெளிப்படுத்துகிறது.
- source_word: ὁ θεός
  choice: கடவுள்
  rationale: நவீனத் தரத் தமிழில் இயல்பான பொதுவான இறைப் பெயர்.
theological_decisions:
- issue: χαρίζομαι என்பதிலுள்ள அருள் சார்ந்த நுண்ணுணர்வை வெளிப்படையாக மொழிபெயர்ப்பதா
  choice: ‘அருளாக வழங்கியிருக்கிறார்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘வழங்கியிருக்கிறார்’ அல்லது ‘கொடுத்திருக்கிறார்’
  rationale: பவுலின் திருச்சட்டம்–வாக்குறுதி முரண்பாட்டில் கொடை தகுதியால் ஈட்டப்பட்டது அல்ல என்ற சொல் நுண்ணுணர்வை இது காக்கிறது; அதேவேளையில் கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: வாரிசுரிமையின் அடிப்படையை ἐκ என்ற ஒரே முன்னொட்டின் இணையான மொழியாக்கத்தால் காட்டுவதா
  choice: ‘திருச்சட்டத்திலிருந்து’ மற்றும் ‘வாக்குறுதியிலிருந்து’ என்ற இணையான அமைப்பு பயன்படுத்தப்பட்டது.
  alternative: ‘திருச்சட்டத்தைச் சார்ந்தது’ மற்றும் ‘வாக்குறுதியின் அடிப்படையில்’
  rationale: மூல உரையின் இறுக்கமான முரண்பாட்டையும் வாரிசுரிமையின் மூலாதாரம் குறித்த இறையியல் அழுத்தத்தையும் தீர்த்துவிடாமல் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘திருச்சட்டத்திலிருந்து / வாக்குறுதியிலிருந்து’ என்ற இணை முரண்பாடு நோக்கத்துடன் பேணப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் அடிக்குறி குறியீடு ‘law’ என்பதற்குப் பின் இருந்தாலும், அதன் உள்ளடக்கம் இறுதி உட்பிரிவுக்கான மாற்று மொழியாக்கமாக இருப்பதால் தமிழில் பொருத்தமான இடத்தில் குறியீடு வைக்கப்பட்டுள்ளது.
