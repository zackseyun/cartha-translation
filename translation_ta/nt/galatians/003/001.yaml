  source_fidelity: மூலத்தின் முக்கியச் சொற்களான ἀνόητοι, βασκαίνω, Χριστός, மற்றும் ἐσταυρωμένος ஆகியவை பெரும்பாலும் துல்லியமாகத் தரப்பட்டுள்ளன. ஆனால் கிரேக்கத்தில் முழு வாக்கியமும் ஒரு வினாவாக உள்ளது; வரைவில் இரண்டாவது பகுதி வியப்பு/உறுதிமொழியாக மாற்றப்பட்டுள்ளது. மேலும் τίς என்பதற்கு ‘மயக்கியது யார்?’ என்பதற்குப் பதில் மனிதக் கர்த்தாவைத் தெளிவாகக் காட்டும் ‘மயக்கியவன் யார்?’ இயல்பானது.
  naturalness: ‘புத்தியற்ற கலாத்தியர்களே’ மற்றும் ‘மேசியாவாகிய இயேசு’ நவீன நிலையான தமிழில் புரியக்கூடியவை. முழு வினாவை ஒரே தமிழ்வாக்கியமாக அமைப்பது மூலத்தின் சொல்லாட்சி மற்றும் பவுலின் கண்டனத் தொனியைச் சிறப்பாகக் காக்கும். ‘வெளிப்படையாகச் சித்தரிக்கப்பட்டார்’ ஏற்கத்தக்கது; அது பொது அறிவிப்பின் உருவகத்தையும் உயிரோட்டமாகத் தருகிறது.
