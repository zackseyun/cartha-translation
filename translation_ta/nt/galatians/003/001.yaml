reference: Galatians 3:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὦ ἀνόητοι Γαλάται, τίς ὑμᾶς ⸀ἐβάσκανεν, οἷς κατ’ ὀφθαλμοὺς Ἰησοῦς Χριστὸς ⸀προεγράφη ἐσταυρωμένος;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/001.yaml
  text: You foolish Galatians[a], who has bewitched you[c][b], before whose eyes Jesus the Messiah was publicly portrayed as crucified?
translation:
  language: ta
  text: புத்தியற்ற கலாத்தியர்களே, உங்கள் கண்முன்னே மேசியாவாகிய இயேசு[b] சிலுவையில் அறையப்பட்டவராக வெளிப்படையாகச் சித்தரிக்கப்பட்டிருந்தபோது, உங்களை மயக்கியவன் யார்?[a][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உங்களை ஏமாற்றியது யார்?’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் மந்திரவசப்படுத்துதல் அல்லது தீய செல்வாக்குக்கு உட்படுத்துதல் என்ற உருவகத்தையும் எழுப்புகிறது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் ‘இயேசு கிறிஸ்து.’ இங்கே Χριστός என்பது ‘அபிஷேகம் செய்யப்பட்டவர்,’ அதாவது ‘மேசியா’ என்னும் பட்டமாக மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: ‘தெளிவாக முன்வைக்கப்பட்டார்’ அல்லது ‘சிலுவையில் அறையப்பட்டவராகப் பொதுவில் அறிவிப்புப் பலகையில் காட்டப்பட்டார்’ என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόητοι
  choice: புத்தியற்ற
  rationale: புரிந்துகொள்ளாமையையும் சிந்தனையின்மையையும் கண்டிக்கும் சொல்லாக, மூலத்தின் கடுமையைத் தக்கவைத்துக்கொண்டு தேவையற்ற ஒழுக்கத் தீர்ப்பைச் சேர்க்காமல் உள்ளது.
- source_word: Γαλάται
  choice: கலாத்தியர்கள்
  rationale: அந்தப் பகுதி மக்களைக் குறிக்கும் பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: ἐβάσκανεν
  choice: மயக்கியது
  rationale: தீய செல்வாக்கு அல்லது மந்திரவசப்படுத்துதல் போன்ற உயிரோட்டமான உருவகத்தைத் தக்கவைக்கிறது; வெறும் ‘ஏமாற்றியது’ என்பதைவிட மூலத்தின் சொல்லாட்சிக்கு நெருக்கமானது.
- source_word: οἷς κατ’ ὀφθαλμοὺς
  choice: உங்கள் கண்முன்னே
  rationale: நேரடியாகவும் தெளிவாகவும் அவர்கள் பார்வைக்கு முன் வைக்கப்பட்டதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: Ἰησοῦς Χριστός
  choice: மேசியாவாகிய இயேசு
  rationale: Χριστός என்பதை வெறும் பெயர்போல் ஒலிபெயர்க்காமல், இயேசுவின் பட்டமாகக் கேட்கச் செய்கிறது; தமிழில் இயல்பான பெயர்–பட்டப் பெயர் அமைப்பைப் பயன்படுத்துகிறது.
- source_word: προεγράφη
  choice: வெளிப்படையாகச் சித்தரிக்கப்பட்டார்
  rationale: அனைவரும் காணும்படி தெளிவாக முன்வைக்கப்பட்ட அல்லது அறிவிக்கப்பட்ட பொருளைச் சுமக்கிறது; சூழலில் உள்ள ‘கண்முன்னே’ என்ற சொல்லோடும் பொருந்துகிறது.
- source_word: ἐσταυρωμένος
  choice: சிலுவையில் அறையப்பட்டவராக
  rationale: இறந்தகால செயப்பாட்டு வினையெச்சம் காட்டும், சிலுவையில் அறையப்பட்ட நிலையில் இயேசு சித்தரிக்கப்பட்டார் என்ற பொருளைத் தெளிவாகப் பிரதிபலிக்கிறது.
theological_decisions:
- issue: Ἰησοῦς Χριστός என்பதில் Χριστός என்ற பட்டத்தின் மொழிபெயர்ப்பு
  choice: மேசியாவாகிய இயேசு
  alternative: கிறிஸ்து இயேசு / இயேசு கிறிஸ்து
  rationale: Χριστός என்பதன் பட்டத் தன்மையை மறைக்காமல் வைத்திருக்க ‘மேசியா’ பயன்படுத்தப்படுகிறது. இது இயேசுவின் அடையாளத்தையும் பணியையும் சுட்டும் பட்டமாக வாசிக்க உதவுகிறது; குறிப்பிட்ட சமயப் பிரிவின் தனிப்பட்ட விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பவுலின் கூர்மையான கண்டனத் தொனியைத் தக்கவைத்தபடியே பொதுவாசகர்களுக்குப் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. கிரேக்க வாக்கியத்தின் நீண்ட உறவுத்தொடரை அப்படியே கட்டாயப்படுத்தாமல், தமிழில் தெளிவாக இரு வாக்கியங்களாக அமைத்துள்ளோம்; இரண்டாவது வாக்கியத்தின் ‘-ஆரே’ முடிவு பவுலின் வியப்பும் கண்டனமும் கலந்த வலியுறுத்தலைக் காக்கிறது.
