id: GAL.3.16
reference: Galatians 3:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τῷ δὲ Ἀβραὰμ ἐρρέθησαν αἱ ἐπαγγελίαι καὶ τῷ σπέρματι αὐτοῦ· οὐ λέγει· Καὶ τοῖς σπέρμασιν, ὡς ἐπὶ πολλῶν, ἀλλ’ ὡς ἐφ’ ἑνός· Καὶ τῷ σπέρματί σου, ὅς ἐστιν Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/016.yaml
  text: The promises were spoken to Abraham and to his offspring[a]. It does not say, “And to offsprings,” as referring to many, but as referring to one[c][b], “And to your offspring,” who is Messiah.
translation:
  language: ta
  text: வாக்குறுதிகள் ஆபிரகாமுக்கும் அவரது வித்துக்கும்[a] சொல்லப்பட்டன. “பலரைக் குறிப்பதுபோல், ‘மேலும் வித்துகளுக்கும்’[b] என்று சொல்லவில்லை; மாறாக, ஒருவரைக் குறிப்பதுபோல், ‘மேலும் உன் வித்துக்கும்’ என்று சொல்கிறது.” அந்த வித்து மெசியா[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த வசனம் முழுவதிலும் ‘வித்து’ என்பது கிரேக்கத்தில் ஒருமை வடிவிலுள்ள கூட்டுப்பெயர்; அது ஒருவரையோ ஒரு சந்ததிக்குழுவையோ குறிக்கலாம். இந்த ஒருமை வடிவமே பவுலின் வாதத்துக்கு மையம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் நேரடியாக, ‘மேலும் வித்துகளுக்கும்.’ ஒருமை வடிவத்துக்கும் பன்மை வடிவத்துக்கும் உள்ள வேறுபாட்டைப் பவுல் வலியுறுத்துகிறார்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது ‘கிறிஸ்து.’
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρρέθησαν
  choice: சொல்லப்பட்டன
  rationale: இறந்தகாலச் செயப்பாட்டு வடிவத்தையும், வாக்குறுதிகள் உரைக்கப்பட்டன என்ற இயல்பான தமிழ்ப் பொருளையும் காக்கிறது.
- source_word: ἐπαγγελίαι
  choice: வாக்குறுதிகள்
  rationale: தேவனுடைய promises என்பதற்கான தெளிவான, வழக்கமான நவீனத் தமிழ் சொல்.
- source_word: σπέρμα / σπέρματι
  choice: வித்து
  rationale: பவுலின் வாதத்துக்கு மையமான ஒருமை வடிவத்தையும், ஒருவரையோ ஒரு கூட்டத்தையோ குறிக்கக்கூடிய மூலச்சொல்லின் கூட்டுப்பொருள் வாய்ப்பையும் காக்கிறது; ‘சந்ததி’ இயல்பான மாற்றாக இருந்தாலும் ஒருமை–பன்மை சொல்விளையாட்டை இவ்வளவு தெளிவாகக் காட்டாது.
- source_word: τοῖς σπέρμασιν
  choice: வித்துகளுக்கும்
  rationale: மூலத்தில் வேண்டுமென்றே பயன்படுத்தப்பட்ட பன்மையைத் தெளிவாகக் காட்டி, பவுலின் இலக்கண வாதத்தைப் பாதுகாக்கிறது.
- source_word: ὡς ἐπὶ πολλῶν / ἀλλ’ ὡς ἐφ’ ἑνός
  choice: பலரைக் குறிப்பதுபோல் / ஒருவரைக் குறிப்பதுபோல்
  rationale: எண்ணிக்கையை மையப்படுத்தும் எதிர்மறை ஒப்புமையை இயல்பான தமிழில் சமச்சீராக வெளிப்படுத்துகிறது.
- source_word: Χριστός
  choice: மெசியா
  rationale: இங்கு வாக்குறுதி பெற்ற வித்து யார் என்பதை அபிஷேகம் பெற்ற மீட்பர் என்ற பட்டத்தோடு அடையாளப்படுத்துவதால், பட்டத்தின் பொருளை வெளிப்படையாகக் காக்கிறது.
theological_decisions:
- issue: ஒருமைக் கூட்டுப்பெயரான σπέρμα குறித்த பவுலின் வாதம்
  choice: ‘வித்து / வித்துகள்’ என்ற வெளிப்படையான ஒருமை–பன்மை வேறுபாடு
  alternative: ‘சந்ததி / சந்ததிகள்’
  rationale: σπέρμα ஒருமையில் கூட்டுப்பொருள் கொள்ளக்கூடியதாக இருந்தாலும், இவ்வசனத்தில் பவுல் அதன் ஒருமை வடிவத்தை ஒருவரான மெசியாவோடு தொடர்புபடுத்துகிறார். மொழியியல் பதற்றத்தைத் தீர்த்துவிடாமல் இரு அம்சங்களையும் குறிப்பு விளக்குகிறது.
- issue: Χριστός என்பதன் பட்டப் பொருள்
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு ஆபிரகாமுக்கு வாக்களிக்கப்பட்ட வித்து யார் என்ற அடையாளக் கூற்றில் பட்டப் பொருள் செயல்படுகிறது; ஆகவே ‘மெசியா’ பொருளை வெளிப்படையாக்குகிறது. பழக்கமான ‘கிறிஸ்து’ வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: λέγει என்பதன் மறைமுக எழுவாய்
  choice: “அவர் சொல்லவில்லை… சொல்கிறார்”
  alternative: “அது சொல்லவில்லை… சொல்கிறது” அல்லது எழுவாயில்லா அமைப்பு
  rationale: மூலத்தில் எழுவாய் வெளிப்படையாகக் குறிப்பிடப்படவில்லை. சூழலில் தேவன் வாக்குறுதிகளைச் சொன்னவர் என்பதால் ‘அவர்’ இயல்பான தமிழ்; இது வேதவாக்கே பேசுகிறது என்ற சாத்தியமான சொல்லாட்சியை முற்றிலும் மறுப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் வாசிப்புத் தெளிவும் காக்கப்பட்டுள்ளன. ‘வித்து’ அன்றாட மொழியில் சற்றுப் பாரம்பரியமாகத் தோன்றினாலும், இவ்வசனத்தின் ஒருமை–பன்மை வாதத்தைத் தமிழில் வெளிப்படையாக வைத்திருக்க அது அவசியமான, நோக்கமுள்ள தேர்வு. மேற்கோள்களின் அமைப்பு தமிழில் இயல்பாக மறுசீரமைக்கப்பட்டுள்ளது.
