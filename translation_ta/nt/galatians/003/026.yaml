id: GAL.3.26
reference: Galatians 3:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πάντες γὰρ υἱοὶ θεοῦ ἐστε διὰ τῆς πίστεως ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/026.yaml
  text: For you are all sons of God through faith in Messiah Jesus[a][b].
translation:
  language: ta
  text: ஏனெனில், விசுவாசத்தின் மூலம், மேசியாவாகிய இயேசுவுக்குள்[b] நீங்கள் அனைவரும் கடவுளின் மகன்களாக[a] இருக்கிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடவுளின் பிள்ளைகளாக.’ கிரேக்க மூலத்தில் ‘மகன்களாக’ என்று உள்ளது; இது மகனுக்குரிய நிலை மற்றும் வாரிசுரிமை நுணுக்கத்தைப் பேணுகிறது.
    reason: lexical_alternative
  - marker: b
    text: 'மரபான மொழிபெயர்ப்பு: ‘கிறிஸ்து இயேசுவுக்குள்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: நீங்கள் அனைவரும்
  rationale: இரண்டாம் நபர் பன்மை வினையுடன் சேர்ந்து, கலாத்திய விசுவாசிகள் அனைவரையும் உள்ளடக்கும் வலியுறுத்தலைத் தெளிவாகக் காட்டுகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான அடிப்படையையோ காரணத்தையோ அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையைப் பேணுகிறது.
- source_word: υἱοὶ
  choice: மகன்களாக
  rationale: கிரேக்கச் சொல்லின் ஆண்பால் வடிவத்தையும், பவுலின் உரையில் உள்ள மகனுக்குரிய நிலை மற்றும் வாரிசுரிமை நுணுக்கத்தையும் பேணுகிறது.
- source_word: θεοῦ
  choice: கடவுளின்
  rationale: உடைமை அல்லது உறவைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: διὰ τῆς πίστεως
  choice: விசுவாசத்தின் மூலம்
  rationale: διά உடன் வரும் உருபின் கருவி அல்லது வழிமுறைப் பொருளை வெளிப்படுத்துகிறது; πίστις என்பதற்கு இச்சூழலில் நிலைபெற்ற, இயல்பான வேதாகமத் தமிழ் சொல்லான ‘விசுவாசம்’ பயன்படுத்தப்படுகிறது.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: மேசியாவாகிய இயேசுவுக்குள்
  rationale: ἐν என்பதன் ‘உள்ளிருத்தல்/ஒன்றிப்பில் இருத்தல்’ சார்ந்த பவுலின் மொழியைப் பேண ‘-க்குள்’ பயன்படுத்தப்படுகிறது. Χριστός ஒரு பட்டமாக இருப்பதால் அதன் பொருளைச் சுட்டும் ‘மேசியா’ என வழங்கப்படுகிறது.
theological_decisions:
- issue: பாலினம் குறிக்கப்பட்ட மகத்துவ/உறவு மொழி
  choice: கடவுளின் மகன்கள்
  alternative: கடவுளின் பிள்ளைகள்
  rationale: மூலத்தில் υἱοὶ (‘மகன்கள்’) என்றே உள்ளது. இது பாலினக் குறிப்பை மட்டுமல்லாமல் மகனுக்குரிய நிலை மற்றும் வாரிசுரிமை நுணுக்கத்தையும் கொண்டிருப்பதால் முதன்மை உரையில் பேணப்படுகிறது; அதன் உள்ளடக்கும் நோக்கம் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- issue: Χριστός என்ற பட்டத்தின் மொழிபெயர்ப்பு
  choice: மேசியாவாகிய இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: Χριστός இங்கு பெயராக மட்டும் அல்லாமல் பட்டமாகச் செயல்படுகிறது. எனவே அதன் மேசியத் தன்மையை வெளிப்படுத்தும் வடிவம் முதன்மை உரையில் வைக்கப்படுகிறது; மரபான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἐν Χριστῷ Ἰησοῦ என்பதன் தொடர்பு
  choice: மேசியாவாகிய இயேசுவுக்குள் நீங்கள் ... மகன்களாக இருக்கிறீர்கள்
  alternative: மேசியாவாகிய இயேசுவில் கொண்ட விசுவாசத்தின் மூலம்
  rationale: ‘இயேசுவுக்குள்’ என்பதை மகன்களாக இருக்கும் நிலையோடு தொடர்புபடுத்தி, ஒன்றிப்பைக் குறிக்கும் பவுலின் ἐν Χριστῷ மொழியைப் பேணுகிறது; அதை வெறுமனே விசுவாசத்தின் பொருளாக மாற்றவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘மேசியாவாகிய இயேசுவுக்குள்’ என்பது சற்றே செறிவான பவுலிய சொற்றொடராக இருந்தாலும், மூலத்தின் ஒன்றிப்பு மொழியைச் சுருக்காமல் பேணுகிறது. அடிக்குறிப்பு குறியீடுகள் அவை விளக்கும் சொற்றொடர்களுக்கு உடனடியாக அடுத்ததாக வைக்கப்பட்டுள்ளன.
