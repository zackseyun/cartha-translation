  yaml_path: translation/nt/galatians/003/012.yaml
  text: But the law is not from faith[a]; rather[b], “The one who does them will live by them.”
translation:
  language: ta
  text: ஆனால் திருச்சட்டம் விசுவாசத்திலிருந்து வருவதல்ல; மாறாக, “அவற்றைக் கடைப்பிடிப்பவர் அவற்றால்[a] வாழ்வார்.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றில் வாழ்வார்.”
    reason: lexical_alternative
  - marker: b
    text: லேவியராகமம் 18:5-இலிருந்து மேற்கோள்.
    reason: cross_reference
lexical_decisions:
- source_word: νόμος
  choice: திருச்சட்டம்
  rationale: சூழலில் மோசேயின் சட்டம் கருத்தில் இருப்பதை இயல்பான நவீனத் தமிழில் காட்டுகிறது; அதே நேரத்தில் கூடுதல் விளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: ἐκ πίστεως
  choice: விசுவாசத்திலிருந்து
  rationale: ἐκ என்பதன் மூலாதாரம் அல்லது அடிப்படை சார்ந்த நுணுக்கத்தையும், சட்டத்துக்கும் விசுவாசத்துக்கும் இடையிலான பவுலின் எதிர்மறை ஒப்பீட்டையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἀλλά
  choice: மாறாக
  rationale: முந்தைய கூற்றுக்கு எதிரான வேதவாக்கியத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: ὁ ποιήσας αὐτά
  choice: அவற்றைக் கடைப்பிடிப்பவர்
  rationale: சட்டத்தின் கட்டளைகளைச் செயலில் நிறைவேற்றுதல் என்ற பொருளை இயல்பான தமிழில் தருகிறது; கிரேக்கத்தின் பொதுப்படையான ஒருமைத் தன்மையையும் காக்கிறது.
- source_word: ζήσεται ἐν αὐτοῖς
  choice: அவற்றால் வாழ்வார்
  rationale: இச்சூழலில் ἐν என்பது வழி அல்லது அடிப்படையைக் குறிக்கலாம் என்பதால் ‘அவற்றால்’ என மொழிபெயர்க்கப்பட்டது; ‘அவற்றில்’ என்ற நேரடியான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: திருச்சட்டத்துக்கும் விசுவாசத்துக்கும் இடையிலான பவுலின் எதிர்மறை ஒப்பீடு
  choice: திருச்சட்டம் விசுவாசத்திலிருந்து வருவதல்ல
  alternative: திருச்சட்டம் விசுவாசத்தை அடிப்படையாகக் கொண்டதல்ல
  rationale: கிரேக்கத்தின் சுருக்கமான, வலுவான எதிர்மறை ஒப்பீட்டைத் தக்கவைத்து, அது எவ்வாறு செயல்படுகிறது என்பதைக் கூடுதல் இறையியல் விளக்கத்தால் தீர்மானிக்காமல் விடுகிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘கடைப்பிடிப்பவர்’ என்பது வெறும் தனிச்செயலைவிட சட்டத்தின் கட்டளைகளை நிறைவேற்றும் கருத்தை இயல்பாக வெளிப்படுத்துகிறது. அனைத்து அடிக்குறிப்புக் குறிகளும் பிரதான உரையில் இடம்பெற்றுள்ளன.
