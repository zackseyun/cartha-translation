source:
  edition: SBLGNT
  text: τοῦτο δὲ λέγω· διαθήκην προκεκυρωμένην ὑπὸ τοῦ ⸀θεοῦ ὁ μετὰ ⸂τετρακόσια καὶ τριάκοντα ἔτη⸃ γεγονὼς νόμος οὐκ ἀκυροῖ, εἰς τὸ καταργῆσαι τὴν ἐπαγγελίαν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/017.yaml
  text: 'This is what I mean: the law[a], which came four hundred and thirty years later, does not invalidate a covenant previously ratified by God[b], so as to abolish the promise.'
translation:
  language: ta
  text: 'நான் சொல்வது இதுதான்: கடவுளால் முன்னரே உறுதிப்படுத்தப்பட்ட உடன்படிக்கையை, நானூற்று முப்பது ஆண்டுகளுக்குப் பிறகு வந்த திருச்சட்டம், வாக்குறுதியை ஒழித்துவிடும் வகையில் செல்லாததாக்குவதில்லை[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ரத்து செய்வதில்லை.’
    reason: ‘செல்லாததாக்குவதில்லை’ என்பதற்கான சொற்சார் மாற்று.
  - marker: b
    text: அல்லது, ‘வாக்குறுதியை செயலற்றதாக்கும் வகையில்’ அல்லது ‘வாக்குறுதியை ஒதுக்கிவிடும் வகையில்.’
    reason: καταργῆσαι என்பதற்கான சொற்சார் மாற்றுகளையும் εἰς τὸ அமைப்பின் தொடர்பையும் காக்கிறது.
lexical_decisions:
- source_word: τοῦτο δὲ λέγω
  choice: நான் சொல்வது இதுதான்
  rationale: பவுல் தன் வாதத்தை விளக்கும் உரையாடல் தொடரை, மூலத்தில் இல்லாத காலக் குறிப்பைச் சேர்க்காமல் இயல்பான தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: διαθήκην
  choice: உடன்படிக்கையை
  rationale: ஆபிரகாமுக்குக் கடவுள் அளித்த வாக்குறுதியை மையமாகக் கொண்ட சூழலில், ‘ஏற்பாடு’ அல்லது ‘உயில்’ என்பவற்றைவிட உடன்படிக்கை சார்ந்த பொருளைத் துல்லியமாகக் காட்டுகிறது.
- source_word: προκεκυρωμένην
  choice: முன்னரே உறுதிப்படுத்தப்பட்ட
  rationale: முன்னதாக நிகழ்ந்து தொடர்ந்து செல்லுபடியாக இருக்கும் சட்டப்பூர்வ உறுதிப்பாட்டை, வினைமுற்றின் காலநிலையோடு வெளிப்படுத்துகிறது.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: கடவுளால்
  rationale: செயலைச் செய்தவர் கடவுள் என்பதை நேரடியாகக் காட்டுகிறது; மூலத்தில் இல்லாத கூடுதல் அழுத்தம் சேர்க்கப்படவில்லை.
- source_word: ὁ ... γεγονὼς νόμος
  choice: வந்த திருச்சட்டம்
  rationale: வரலாற்றில் பின்னர் வழங்கப்பட்ட சட்டத்தைக் குறிக்கும் γίνομαι என்பதன் சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது. νόμος என்பதற்கு வேதாகமச் சூழலில் தெளிவாக இருக்க ‘திருச்சட்டம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: μετὰ τετρακόσια καὶ τριάκοντα ἔτη
  choice: நானூற்று முப்பது ஆண்டுகளுக்குப் பிறகு
  rationale: கால இடைவெளியையும் பின்னர் நிகழ்ந்ததையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: οὐκ ἀκυροῖ
  choice: செல்லாததாக்குவதில்லை
  rationale: உடன்படிக்கையின் சட்டப்பூர்வ செல்லுபடியை நீக்கவில்லை என்ற ἀκυρόω என்பதன் வலிமையைத் தெளிவாகத் தருகிறது.
- source_word: εἰς τὸ καταργῆσαι
  choice: அதன் மூலம் ... ஒழித்துவிடுவதுமில்லை
  rationale: முந்தைய உடன்படிக்கையைச் செல்லாததாக்குவதால் வாக்குறுதி ஒழிக்கப்படும் என்ற நோக்கம் அல்லது விளைவு சார்ந்த தொடர்பை இயல்பான தமிழில் காட்டுகிறது; நோக்கம்–விளைவு நுட்பத்தை மிகையாகத் தீர்மானிக்கவில்லை.
- source_word: τὴν ἐπαγγελίαν
  choice: வாக்குறுதியை
  rationale: ஆபிரகாமுக்குக் கொடுக்கப்பட்ட கடவுளின் வாக்குறுதியைக் குறிக்கும் சூழலுக்கு நேரானதும் நிலையானதுமான சொல்.
theological_decisions:
- issue: பவுலின் வாதத்தில் διαθήκη என்பதன் பொருள்
  choice: உடன்படிக்கை
  alternative: உயில்; சட்டப்பூர்வ ஏற்பாடு
  rationale: சுற்றியுள்ள பகுதி ஆபிரகாமுக்குக் கடவுள் முன்பே அளித்த வாக்குறுதியை மையமாகக் கொண்டிருப்பதால், ‘உடன்படிக்கை’ என்பது இரட்சிப்பு வரலாற்று வாதத்தைப் பாதுகாக்கிறது; இருப்பினும் சொல்லின் சட்டப்பூர்வ நிழற்பொருள் மொழிபெயர்ப்பில் முற்றிலும் அகற்றப்படவில்லை.
- issue: εἰς τὸ καταργῆσαι என்பதில் நோக்கமா விளைவா
  choice: அதன் மூலம் ... ஒழித்துவிடுவதுமில்லை
  alternative: வாக்குறுதியை ஒழித்துவிடும் வகையில்; வாக்குறுதியை செயலற்றதாக்கும்படி
  rationale: கிரேக்க அமைப்பு நோக்கம் அல்லது விளைவு இரண்டையும் சுட்டக்கூடியதால், அவற்றில் ஒன்றை மட்டும் இறுக்கமாகத் தீர்மானிக்காமல் காரண–விளைவு தொடர்பை வைத்திருக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம வாதத்தின் சட்டப்பூர்வத் தொனியும் காக்கப்பட்டுள்ளன. நீளமான கிரேக்க வாக்கியத்தின் தர்க்கத் தொடர்பைத் தெளிவாக்க அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்புக் குறிகள் அவை விளக்கும் தமிழ்ச் சொற்றொடர்களுக்குப் பின்பே வைக்கப்பட்டுள்ளன.
