  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι δὲ ἐν νόμῳ οὐδεὶς δικαιοῦται παρὰ τῷ θεῷ δῆλον, ὅτι Ὁ δίκαιος ἐκ πίστεως ζήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/011.yaml
  text: It is evident that no one is justified before God by the law[b][a], because "The righteous will live by faith."
translation:
  language: ta
  text: திருச்சட்டத்தின் மூலம் எவரும் கடவுளுக்கு முன்பாக நீதிமானென்று தீர்ப்பிடப்படுவதில்லை என்பது தெளிவு. ஏனெனில், “நீதிமான் நம்பிக்கையினால் வாழ்வான்”[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீதிமான் விசுவாசத்தன்மையினால் வாழ்வான்.”
    reason: lexical_alternative
  - marker: b
    text: பவுல் இங்கு ஆபகூக் 2:4-ஐ மேற்கோள் காட்டுகிறார். மேற்கோளில் உள்ள கிரேக்கத் தொடரை, “நம்பிக்கையினால் நீதிமானாக இருப்பவன் வாழ்வான்” என்றும் புரிந்துகொள்ளலாம்.
    reason: cross_reference_and_syntactic_ambiguity
lexical_decisions:
- source_word: ὅτι δὲ
  choice: என்பது
  rationale: δὲ இங்கு வலுவான எதிர்மறையைக் காட்டாமல் வாதத்தின் அடுத்த கட்டத்துக்கு மென்மையாக நகர்த்துகிறது. தமிழில் தேவையற்ற ‘இப்போது’ அல்லது மிகையான ‘ஆனால்’ என்பவற்றைச் சேர்க்காமல், வாக்கிய அமைப்பிலேயே அந்த நகர்வு இயல்பாக வெளிப்படுகிறது.
- source_word: ἐν νόμῳ
  choice: திருச்சட்டத்தின் மூலம்
  rationale: ἐν இங்கு வழிமுறை அல்லது அடிப்படையைக் குறிக்கிறது. சூழலில் νόμος என்பது மோசேயின் திருச்சட்டத்தைக் குறிப்பதால், ‘திருச்சட்டத்தின் மூலம்’ என்பது பொருளைத் தெளிவாகத் தருகிறது.
- source_word: οὐδεὶς
  choice: எவரும் ... இல்லை
  rationale: மூலத்தின் முழுமையான மறுப்பை இயல்பான நவீன தமிழில் பாதுகாக்கிறது.
- source_word: δικαιοῦται
  choice: நீதிமானென்று தீர்ப்பளிக்கப்படுவதில்லை
  rationale: வினைச்சொல்லின் நீதிமன்றத் தன்மையை வெளிப்படுத்துகிறது; வெறும் ஒழுக்க மாற்றமாகப் புரிந்துகொள்ளப்படுவதைத் தவிர்த்து, கடவுளின் முன்னிலையில் அளிக்கப்படும் தீர்ப்பைச் சுட்டுகிறது.
- source_word: παρὰ τῷ θεῷ
  choice: கடவுளுக்கு முன்பாக
  rationale: கடவுளின் மதிப்பீடு அல்லது தீர்ப்பின் முன்னிலையில் ஒருவருடைய நிலையைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: δῆλον
  choice: தெளிவு
  rationale: பவுலின் வாதத் தொனியையும், இது வெளிப்படையான முடிவு என்பதையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: Ὁ δίκαιος
  choice: நீதிமான்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட கிரேக்கப் பெயரடையைச் சுருக்கமாகவும் மரியாதையான தமிழிலும் தருகிறது.
- source_word: ἐκ πίστεως
  choice: நம்பிக்கையினால்
  rationale: πίστις என்பதற்கு இங்கு முதன்மைத் தேர்வாக ‘நம்பிக்கை’ பயன்படுத்தப்படுகிறது. ‘உண்மைத்தன்மை’ என்ற சாத்தியமான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ζήσεται
  choice: வாழ்வான்
  rationale: எதிர்கால வினையின் நேரடியான பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: Ὁ δίκαιος ἐκ πίστεως ζήσεται என்ற மேற்கோளின் பொருள் அமைப்பு
  choice: “நீதிமான் நம்பிக்கையினால் வாழ்வான்”
  alternative: “நம்பிக்கையினால் நீதிமானாக இருப்பவன் வாழ்வான்”
  rationale: கிரேக்கத்தில் ἐκ πίστεως என்பது ‘வாழ்வான்’ என்பதோடு சேர்கிறதா, ‘நீதிமான்’ என்பதோடு சேர்கிறதா என்ற இலக்கணத் தெளிவின்மை உள்ளது. முதன்மை உரை மிகவும் நேரடியான வாசிப்பைத் தருகிறது; மற்ற சாத்தியத்தை அடிக்குறிப்பு விளக்குகிறது.
- issue: πίστις என்பதன் பொருள்
  choice: நம்பிக்கை
  alternative: உண்மைத்தன்மை / விசுவாசநிலை
  rationale: பவுலின் இச்சூழலில் ‘நம்பிக்கை’ என்பது இயல்பான முதன்மை மொழிபெயர்ப்பு. ஆயினும், கிரேக்கச் சொல் ‘உண்மைத்தன்மை’ அல்லது ‘விசுவாசநிலை’ என்ற பொருளையும் தாங்கக்கூடும் என்பதால் அந்தத் தத்துவப் பதற்றம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதையான வாதநடை பயன்படுத்தப்பட்டுள்ளது. ‘நீதிமானென்று தீர்ப்பளிக்கப்படுதல்’ என்பது சட்டரீதியான நுண்ணுணர்வைத் தெளிவாக்குகிறது. மேற்கோளின் கிரேக்க இலக்கணத் தெளிவின்மையும் πίστις என்பதன் மாற்றுப் பொருளும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
