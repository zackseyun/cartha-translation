  to: திருச்சட்டத்தின் மூலம் எவரும் கடவுளுக்கு முன்பாக நீதிமானென்று தீர்ப்பிடப்படுவதில்லை என்பது தெளிவு. ஏனெனில், “நீதிமான் நம்பிக்கையினால் வாழ்வான்”[a][b].
