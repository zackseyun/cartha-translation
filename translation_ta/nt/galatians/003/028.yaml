base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/028.yaml
  text: There is no Jew or Greek[a], there is no servant or free, there is no male and female[b]; for you are all one in Messiah Jesus.
translation:
  language: ta
  text: யூதரோ கிரேக்கரோ இல்லை; அடிமையோ சுதந்திரமானவரோ இல்லை; ஆணும் பெண்ணும் இல்லை[a]. ஏனெனில், நீங்கள் அனைவரும் மேசியாவாகிய இயேசுவுக்குள் ஒன்றாயிருக்கிறீர்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில், “ஆணும் பெண்ணும் இல்லை.” முதல் இரு இணைகளில் உள்ள ‘அல்லது/அன்றியும்’ வகை இணைப்புக்குப் பதிலாக இங்கு ‘மற்றும்’ என்ற இணைப்பு உள்ளது; இது ஆதியாகமம் 1:27-இல் உள்ள “ஆணும் பெண்ணுமாக” என்ற சொற்றொடரை எதிரொலிக்கக்கூடும்.
    reason: மூன்றாவது இணையில் வரும் καὶ என்ற தனித்த வடிவத்தையும் சாத்தியமான படைப்பு உரை எதிரொலியையும் பதிவு செய்கிறது.
  - marker: b
    text: கிரேக்கத்தில், “கிறிஸ்து இயேசுவுக்குள்”; இங்கு Χριστός ஒரு பட்டம் என்பதால் “மேசியாவாகிய இயேசு” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: பட்டத்திற்கான மாற்று மரபுவழி மொழிபெயர்ப்பைத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: οὐκ ἔνι
  choice: … என்றும் … என்றும் இல்லை
  rationale: மூன்று முறை வரும் இருப்பு மறுப்பை இயல்பான தமிழில் வலியுறுத்தலுடன் மீளுரைக்கிறது.
- source_word: Ἰουδαῖος / Ἕλλην
  choice: யூதர் / கிரேக்கர்
  rationale: இன-மத அடையாளத்தையும் கிரேக்க மூலத்தின் குறிப்பான இணைப்பையும் காக்கிறது; ‘பிற இனத்தவர்’ என விரிவாக்கவில்லை.
- source_word: δοῦλος / ἐλεύθερος
  choice: அடிமை / சுதந்திரமானவர்
  rationale: சமூக நிலையிலுள்ள நேரடியான முரண்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἄρσεν καὶ θῆλυ
  choice: ஆண் என்றும் பெண் என்றும்
  rationale: பாலைக் குறிக்கும் சொற்களைத் துல்லியமாகத் தருகிறது; தமிழில் மறுப்புத் தொடரை இயல்பாக்கினாலும், மூலத்தில் உள்ள καὶ மற்றும் ஆதியாகமம் 1:27 எதிரொலி அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: πάντες ὑμεῖς εἷς ἐστε
  choice: நீங்கள் அனைவரும் … ஒன்றாயிருக்கிறீர்கள்
  rationale: இரண்டாம் நபர் பன்மை வலியுறுத்தலையும் கூட்டு ஒருமையையும் விளக்க விரிவாக்கமின்றிக் காக்கிறது.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: மேசியாவாகிய இயேசுவுக்குள்
  rationale: Χριστός என்பதை இங்கு பெயராக அல்ல, பட்டமாக வெளிப்படுத்தி, ἐν என்பதன் ஒன்றிப்பு சார்ந்த உருவகத்தையும் காக்கிறது.
theological_decisions:
- issue: ἄρσεν καὶ θῆλυ என்பதில் καὶ-ஐ எவ்வாறு பிரதிபலிப்பது
  choice: முதன்மை உரையில் இயல்பான தமிழ் மறுப்பாக ‘ஆண் என்றும் பெண் என்றும் இல்லை’; சொற்சொல் வடிவத்தை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘ஆணும் பெண்ணும் இல்லை’
  rationale: மூலத்தின் முதல் இரண்டு இணைகளில் οὐδὲ, மூன்றாவது இணையில் καὶ என்ற வேறுபாடும் ஆதியாகமம் 1:27-ன் சாத்தியமான எதிரொலியும் மறையாமல் இருக்க வேண்டும்; அதேவேளை முதன்மை உரை சாதாரண வாசகருக்கு இயல்பாக இருக்க வேண்டும்.
- issue: εἷς ἐστε என்பதை விளக்கி விரிவாக்கலாமா
  choice: ‘ஒன்றாயிருக்கிறீர்கள்’
  alternative: ‘ஒரே மனிதராக இருக்கிறீர்கள்’ அல்லது ‘ஒற்றுமையாக இருக்கிறீர்கள்’
  rationale: மேசியாவுக்குள் உள்ள ஒருமையை மட்டும் உரை கூறும் அளவில் வைத்திருந்து, வேறுபாடுகள் அனைத்தும் அழிக்கப்படுகின்றன என்ற கூடுதல் கோட்பாட்டை இறக்குமதி செய்யவில்லை.
- issue: Χριστός பெயரா பட்டமா
  choice: ‘மேசியாவாகிய இயேசு’
  alternative: ‘கிறிஸ்து இயேசு’
  rationale: இவ்விடத்தில் பட்டத்தின் வலிமையை வெளிப்படையாகக் காட்டுகிறது; இயேசுவின் மேசியா அடையாளத்துக்குள் உள்ள ஒன்றிப்பைத் தெரிவிக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; மரியாதையும் எளிமையும் கொண்ட வேதாகம நடை. சமச்சீர் அமைப்பைக் காக்க அரைப்புள்ளிகள் பயன்படுத்தப்பட்டுள்ளன. ‘அடிமை’ என்பது δοῦλος-ன் சமூக நிலையை மெல்லப்படுத்தாமல் தருகிறது; ‘சுதந்திரமானவர்’ பாலினத்தைத் தேவையின்றி சுட்டாத இயல்பான எதிர்ச்சொல்.
