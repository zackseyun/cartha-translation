  text: Did you suffer so many things in vain?—if indeed it really was in vain[a].
translation:
  language: ta
  text: இவ்வளவு துன்பங்களை வீணாக அனுபவித்தீர்களா?[a]—உண்மையிலேயே வீணாக இருந்திருந்தால்!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவ்வளவு பலவற்றை வீணாக அனுபவித்தீர்களா?”
    reason: ἐπάθετε என்பது ‘துன்பப்பட்டீர்கள்’ என்பதோடு, பொதுவாக ‘அனுபவித்தீர்கள்’ என்றும் பொருள்படலாம்.
lexical_decisions:
- source_word: τοσαῦτα
  choice: இவ்வளவு துன்பங்களை
  rationale: நபுஞ்சகப் பன்மையான τοσαῦτα, கலாத்தியர்கள் எதிர்கொண்ட பலவற்றையும் கூட்டாகக் குறிக்கிறது. ἐπάθετε என்பதோடு இணைத்து, இயல்பான தமிழில் பன்மை உணர்வைத் தக்கவைக்கிறது.
- source_word: ἐπάθετε
  choice: அனுபவித்தீர்களா
  rationale: πάσχω என்பதன் துன்புறுதல் என்ற வலுவான பொருள், ‘துன்பங்களை’ என்பதால் வெளிப்படுகிறது; ‘அனுபவித்தீர்களா’ என்பது தமிழில் இயல்பான வினை வடிவம். மேலும் பொதுவான ‘அனுபவித்தல்’ என்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: εἰκῇ
  choice: வீணாக
  rationale: நோக்கமற்றுப் போதல் அல்லது பயனின்றிப் போதல் என்ற கருத்தைச் சுருக்கமாகவும் துல்லியமாகவும் தெரிவிக்கிறது; மூலத்தின் மறுபயன்பாடு தமிழிலும் தக்கவைக்கப்பட்டுள்ளது.
- source_word: εἴ γε
  choice: உண்மையிலேயே … இருந்தால்
  rationale: பவுல் முன்கூறிய கேள்வியை எச்சரிக்கையுடன் நிபந்தனைப்படுத்தும் தொனியை இது காக்கிறது.
- source_word: καὶ
  choice: உண்மையிலேயே
  rationale: இங்கு καὶ நிபந்தனைக் கூற்றை வலியுறுத்துவதால், தனியே ‘கூட’ என்று மொழிபெயர்ப்பதைவிட ‘உண்மையிலேயே’ என்பது இயல்பான தமிழில் அதன் வலியுறுத்தலைக் கொண்டுவருகிறது.
theological_decisions:
- issue: இரண்டாம் கூற்றின் சுருக்கமான, நம்பிக்கை கலந்த நிபந்தனைத் தன்மை
  choice: அவை உண்மையிலேயே வீணாகியிருந்தால்!
  alternative: அவை உண்மையிலேயே வீணாகிவிட்டன என்றால்!
  rationale: மூலத்தில் வினைச்சொல் வெளிப்படையாக இல்லாத சுருக்கமான நிபந்தனை உள்ளது. அது அவர்களின் அனுபவம் இறுதியில் வீணாகவில்லை என்ற பவுலின் நம்பிக்கையைச் சுட்டலாம்; ஆனால் அதைத் தெளிவான உறுதிப்பாடாக மாற்றாமல், மூலத்தின் இறுக்கத்தையும் தெளிவின்மையையும் இந்த வடிவம் காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. கேள்விக்குப் பின் வரும் முற்றுப்பெறாத நிபந்தனையின் சொல்லாட்சியைச் சீராக்கிப் பொருள் நிரப்பாமல், மூலத்தின் சொல்லாட்சிச் சுருக்கமும் வாத அழுத்தமும் தக்கவைக்கப்பட்டுள்ளன.
