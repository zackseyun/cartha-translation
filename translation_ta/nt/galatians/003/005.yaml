    rationale: தமிழில் இது அருகிலுள்ள “அற்புதங்களை” மட்டுமே சுட்டுவது இயல்பு. மூல வாக்கியத்தின் “by works … or by hearing …?” என்ற வினா, ஆவியை அளித்தலும் வல்ல செயல்களைச் செய்தலும் ஆகிய இரண்டிற்கும் பொருந்துகிறது. “அவ்வாறு செய்கிறாரா?” இரு பங்கேற்புச் செயல்களையும் மீள்சுட்டும்.
