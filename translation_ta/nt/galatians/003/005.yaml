reference: Galatians 3:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ οὖν ἐπιχορηγῶν ὑμῖν τὸ πνεῦμα καὶ ἐνεργῶν δυνάμεις ἐν ὑμῖν ἐξ ἔργων νόμου ἢ ἐξ ἀκοῆς πίστεως;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/005.yaml
  text: So then[a], does the one who supplies the Spirit to you and works miracles among you do so by works of the law[b], or by hearing with faith?
translation:
  language: ta
  text: அப்படியானால், உங்களுக்கு ஆவியானவரை அளித்து, உங்களிடையே[a] அற்புதங்களைச் செய்கிறவர், திருச்சட்டத்தின் செயல்களினாலா அல்லது விசுவாசத்துடன் கேட்பதினாலா[b] அவ்வாறு செய்கிறாரா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களுக்குள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “விசுவாசத்தின் கேள்வியினாலா”; அல்லது, “விசுவாசத்துடன் கேட்கப்பட்ட செய்தியினாலா.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιχορηγῶν
  choice: வழங்கி
  rationale: தேவையானதைத் தொடர்ந்து அளித்தல் என்ற நிகழ்காலப் பொருளை இயல்பான தமிழில் தருகிறது; அளவுக்கு மீறிய விளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: τὸ πνεῦμα
  choice: ஆவியானவரை
  rationale: இங்கு குறிப்பிட்ட இறை ஆவியானவரையே பவுல் சுட்டுகிறார். கிரேக்கத்தில் இல்லாத ‘தூய’ என்ற சொல்லைச் சேர்க்காமல், தமிழில் தனிப்பட்டவரைக் குறிக்கும் மரியாதையான வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐνεργῶν δυνάμεις
  choice: அற்புதங்களைச் செய்கிறவர்
  rationale: δυνάμεις என்பதன் அடிப்படை எண்ணம் வல்ல செயல்கள் என்றாலும், இச்சூழலில் இறைவல்லமையால் நிகழும் அற்புதச் செயல்களைக் குறிக்கிறது; இந்தத் தமிழ் வடிவம் சாதாரண வாசகருக்குத் தெளிவாக உள்ளது.
- source_word: ἐν ὑμῖν
  choice: உங்களிடையே
  rationale: கலாத்திய சபைகளின் நடுவில் நிகழும் காணத்தக்க அற்புதங்கள் என்ற சூழலுக்கு இது இயல்பானது. ‘உங்களுக்குள்’ என்பதும் இலக்கணப்படி சாத்தியமாதலால் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: ἐξ ἔργων νόμου
  choice: திருச்சட்டத்தின் செயல்களினால்
  rationale: மோசேயின் சட்டத்தோடு தொடர்புடைய பவுலின் நிலையான சொற்றொடரைத் தெரிவிக்கிறது. ‘திருச்சட்டம்’ என்பது சாதாரண சட்டத்திலிருந்து இதை வேறுபடுத்தும் இயல்பான தமிழ் வேதாகமச் சொல்; ‘செயல்களினால்’ ἐξ என்பதன் வழிமுறை அல்லது அடிப்படைப் பொருளை வெளிப்படுத்துகிறது.
- source_word: ἀκοῆς πίστεως
  choice: விசுவாசத்துடன் கேட்பதினாலா
  rationale: சட்டத்தின் செயல்களுக்கு எதிராக, விசுவாசத்தோடு கேட்பதை முன்வைக்கும் வாசிப்பை இயல்பான தமிழில் தருகிறது. கிரேக்க மரபுத்தொடரின் சுருக்கமான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: πίστεως
  choice: விசுவாசம்
  rationale: இச்சூழலில் πίστις என்பது நம்பிக்கையோடு ஏற்றுக்கொள்ளுதலைக் குறிக்கிறது; பவுலின் எதிர்மறை ஒப்பீட்டில் ‘விசுவாசம்’ துல்லியமாகவும் பரிச்சயமாகவும் உள்ளது.
theological_decisions:
- issue: ἀκοῆς πίστεως என்ற மரபுத்தொடரின் தொடரியல் உறவு ஒன்றுக்கு மேற்பட்ட வகையில் புரிந்துகொள்ளப்படலாம்.
  choice: விசுவாசத்துடன் கேட்பதினால்
  alternative: விசுவாசத்தைக் குறித்த செய்தியைக் கேட்பதினால்; விசுவாசத்துடன் கேட்ட செய்தியினால்
  rationale: முதன்மை வாசிப்பு, சட்டச் செயல்களுக்கும் விசுவாசத்தோடு கேட்பதற்கும் இடையிலான பவுலின் எதிர்மறை ஒப்பீட்டைத் தெளிவாகக் காட்டுகிறது. எனினும் ‘கேள்வி/கேட்ட செய்தி’ என்ற பெயர்ச்சொல் பொருளும், πίστεως என்பதன் உறவும் முற்றிலும் தீர்மானிக்கப்படாததால் மாற்று வாய்ப்புகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்பின் இயல்பும் பேணப்பட்டுள்ளன. கிரேக்க வாக்கியத்தின் சொல்லப்படாமல் விடப்பட்ட செயற்பொருளைத் தமிழில் தெளிவாக்க ‘அவற்றைச் செய்கிறார்’ சேர்க்கப்பட்டுள்ளது; இது புதிய கருத்தைச் சேர்க்காமல் வினாவின் இயல்பான நிறைவை அளிக்கிறது. எல்லா அடிக்குறிப்பு குறிகளும் உரிய சொற்றொடர்களுக்குப் பின்பு முதன்மை உரையில் இடம்பெற்றுள்ளன.
