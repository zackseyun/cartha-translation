revisions:
- from: ஆகவே, உங்களுக்கு ஆவியானவரை வழங்கி, உங்களிடையே[a] அற்புதங்களைச் செய்கிறவர், திருச்சட்டத்தின் செயல்களினாலா அல்லது விசுவாசத்துடன் கேட்பதினாலா[b] அவற்றைச் செய்கிறார்?
  to: அப்படியானால், உங்களுக்கு ஆவியானவரை அளித்து, உங்களிடையே[a] அற்புதங்களைச் செய்கிறவர், திருச்சட்டத்தின் செயல்களினாலா அல்லது விசுவாசத்துடன் கேட்பதினாலா[b] அவ்வாறு செய்கிறாரா?
  rationale: வினாவின் வழிமுறையைக் குறிக்கும் இறுதிப் பகுதி, மூலத்தில் உள்ள இரு செயல்களுக்கும் பொருந்துமாறு “அவ்வாறு செய்கிறாரா?” எனத் திருத்தப்பட்டது. ἀκοῆς πίστεως பற்றிய மாற்றுவாசிப்பும், ஒரு குறிப்பிட்ட விளக்கத்தை மட்டும் திணிக்காமல், மூலத்தின் தொடரியல் தெளிவின்மையைப் பாதுகாக்கத் திருத்தப்பட்டது. மற்ற சொற்களும் அடிக்குறிப்பு a-வின் இடமும் பொருளும் பாதுகாக்கப்பட்டுள்ளன.
