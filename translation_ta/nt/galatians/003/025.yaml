id: GAL.3.25
reference: Galatians 3:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐλθούσης δὲ τῆς πίστεως οὐκέτι ὑπὸ παιδαγωγόν ἐσμεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/025.yaml
  text: But now that faith has come[b][a], we are no longer under a guardian.
translation:
  language: ta
  text: ஆனால், விசுவாசம் வந்துவிட்டபின்[a], நாம் இனி காப்பாளரின்[b] கீழ் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த விசுவாசம் வந்துவிட்டபின்.”
    reason: alternative_reading
  - marker: b
    text: கிரேக்கச் சொல், பண்டைய வீட்டில் சிறாரைக் கண்காணித்த காப்பாளரைக் குறிக்கிறது; அது முதன்மையாக வகுப்பறை ஆசிரியரைக் குறிக்கவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθούσης
  choice: வந்துவிட்டதால்
  rationale: இறந்தகாலப் பங்கேற்புவினையுடன் அமைந்த தனி உருபுத்தொடரை இயல்பான தமிழில் காலத்தையும் காரணச்சாயலையும் கொண்ட துணைவாக்கியமாக வழங்குகிறது; நிகழ்ந்த வருகையின் தற்போதைய விளைவையும் உணர்த்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட சட்டத்தின் கீழான காலத்துக்கும் தற்போதைய நிலைக்கும் இடையிலான மென்மையான முரண்பாட்டைக் காட்டுகிறது.
- source_word: πίστεως
  choice: விசுவாசம்
  rationale: πίστις என்பதன் முதன்மையான பொருளைத் தக்கவைக்கிறது. இங்கு அது சட்டத்தின் முந்தைய காப்பாளர் பங்குக்கு மாறாக விசுவாசம் வந்த புதிய கட்டத்தையும் குறிக்கலாம்; அந்தச் சூழல்சார் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: οὐκέτι
  choice: இனி ... இல்லை
  rationale: முன்பு இருந்த நிலை முடிவடைந்ததை இயல்பான நவீன தமிழில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: ὑπὸ
  choice: கீழ்
  rationale: ஒருவரின் கண்காணிப்பு அல்லது அதிகாரத்திற்குக் கீழிருப்பது என்ற பவுலின் உருவகத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: παιδαγωγόν
  choice: காப்பாளர்
  rationale: பண்டைய வீட்டில் சிறுவனை மேற்பார்வை செய்து ஒழுங்குபடுத்திய பொறுப்பாளரைக் குறிக்கும் சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது; வகுப்பறை ஆசிரியர் என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: ἐσμεν
  choice: நாம் ... இல்லை
  rationale: நிகழ்கால εἰμί வினையைத் தமிழின் இயல்பான எதிர்மறைப் பெயர்ப்பயனிலை அமைப்பில் வழங்குகிறது.
theological_decisions:
- issue: “விசுவாசம் வந்தது” என்பதன் சூழல்சார் பொருள்
  choice: விசுவாசம் வந்துவிட்டதால்
  alternative: அந்த விசுவாசம் வந்துவிட்டதால்
  rationale: சட்டத்தின் காப்பாளர் காலத்திலிருந்து இரட்சிப்பு வரலாற்றின் புதிய கட்டத்திற்கான மாற்றத்தை இச்சொற்றொடர் சுட்டலாம். இருப்பினும் πίστις என்பதை ஒரு நிலைபெற்ற சமய அமைப்பாக மட்டுமே தீர்மானிக்காமல், ‘விசுவாசம்’ என்ற இயல்பான மொழிபெயர்ப்பை முதன்மை உரையில் வைத்து மாற்று வாசிப்பை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. “காப்பாளர்” என்ற சொல் உருவகத்தைத் தக்கவைக்கிறது; அதன் வரலாற்றுப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
