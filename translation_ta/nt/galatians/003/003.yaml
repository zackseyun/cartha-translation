source:
  edition: SBLGNT
  text: οὕτως ἀνόητοί ἐστε; ἐναρξάμενοι πνεύματι νῦν σαρκὶ ἐπιτελεῖσθε;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/003.yaml
  text: Are you so foolish? Having begun by the Spirit[c][b][a], are you now being perfected by the flesh?
translation:
  language: ta
  text: நீங்கள் இவ்வளவு விவேகமற்றவர்களா? ஆவியால்[a] தொடங்கிய நீங்கள், இப்போது மாம்சத்தால்[b] முழுமையாக்கப்படுகிறீர்களா?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆவிக்குள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மனித முயற்சியால்”; “பாவ இயல்பால்” என்பதும் சாத்தியம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “நிறைவுக்குக் கொண்டுவரப்படுகிறீர்களா?”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: இவ்வளவு
  rationale: இங்கு பவுலின் வினா செய்முறையைவிட அளவை வலியுறுத்துகிறது; ‘இவ்வளவு’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: ἀνόητοί
  choice: விவேகமற்றவர்கள்
  rationale: புரிந்துணர்வும் பகுத்தறிவும் இல்லாமல் நடப்பதைக் குறிக்கிறது; தேவையற்ற இழிவுச் சாயலைத் தவிர்க்கிறது.
- source_word: ἐναρξάμενοι
  choice: தொடங்கிய நீங்கள்
  rationale: முதலில் நிகழ்ந்த செயலை, தற்போதைய முரண்பட்ட நிலையோடு தெளிவாக இணைக்கிறது.
- source_word: πνεύματι
  choice: ஆவியால்
  rationale: கலாத்தியர் 3-ன் உடனடிச் சூழலில் இது பரிசுத்த ஆவியைக் குறிக்கிறது; வேற்றுமை உருபு பெரும்பாலும் கருவிப்பொருளைக் காட்டுவதால் ‘ஆவியால்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: νῦν
  choice: இப்போது
  rationale: முந்தைய தொடக்கத்திற்கும் தற்போதைய முயற்சிக்கும் இடையிலான கால முரண்பாட்டைக் கூர்மையாகக் காக்கிறது.
- source_word: σαρκὶ
  choice: மாம்சத்தால்
  rationale: பவுலின் ஆவி–மாம்சம் என்ற அடுக்குப் பொருளுள்ள எதிரிணையைத் தீர்த்துவிடாமல் காக்கிறது; சாத்தியமான விளக்கங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: ἐπιτελεῖσθε
  choice: முழுமையாக்கப்படுகிறீர்களா?
  rationale: நிகழ்கால நடுநிலை/செயப்பாட்டு வடிவத்தின் தெளிவின்மையை ஓரளவு காத்து, தொடக்கத்திலிருந்து முழுமையை நோக்கிச் செல்லும் கருத்தை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: πνεύματι என்பதன் சுட்டுப்பொருள்
  choice: பரிசுத்த ஆவி
  alternative: மனித ஆவி அல்லது ஓர் ஆன்மிகக் கோட்பாடு
  rationale: ஆவியைப் பெறுதல், விசுவாசம், தேவனுடைய செயல் ஆகியவற்றைப் பேசும் கலாத்தியர் 3-ன் சூழல் பரிசுத்த ஆவியையே வலுவாகச் சுட்டுகிறது.
- issue: ஆவிக்கு எதிராக வரும் σάρξ என்பதன் பொருள்
  choice: மாம்சம்
  alternative: மனித முயற்சி அல்லது பாவ இயல்பு
  rationale: இந்தப் பவுலின் சொல்லில் மனித வல்லமை, விழுந்துபோன மனித நிலை ஆகிய பல சாயல்கள் இருக்கக்கூடும்; ஆகவே பிரதான உரை ‘மாம்சம்’ என்ற உருவகத்தை அப்படியே காக்கிறது.
- issue: ἐπιτελεῖσθε என்பதன் நடுநிலை/செயப்பாட்டு சாத்தியம்
  choice: முழுமையாக்கப்படுகிறீர்களா?
  alternative: நிறைவுக்குக் கொண்டுவரப்படுகிறீர்களா? அல்லது நிறைவு செய்கிறீர்களா?
  rationale: வடிவம் நடுநிலை அல்லது செயப்பாட்டுப் பொருளை ஏற்கலாம். சூழலில் அவர்களே தங்களை நிறைவு செய்ய முயல்வதும், மாம்சத்தின் வழியாக முழுமை அடைவதாக எண்ணுவதும் ஒன்றோடொன்று பின்னியிருப்பதால், பிரதான உரை செயப்பாட்டுச் சாயலைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியான கண்டனத்தின் வலிமையைத் தக்கவைத்தும் தேவையற்ற வசைநடையைத் தவிர்த்தும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆவி’ மற்றும் ‘மாம்சம்’ என்ற பவுலின் முக்கிய எதிரிணை பிரதான உரையில் பாதுகாக்கப்பட்டுள்ளது.
