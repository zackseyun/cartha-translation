id: GAL.3.9
reference: Galatians 3:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὥστε οἱ ἐκ πίστεως εὐλογοῦνται σὺν τῷ πιστῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/009.yaml
  text: So then[a], those who are of faith are blessed along with Abraham, the faithful one.
translation:
  language: ta
  text: ஆகவே, விசுவாசத்தைச் சார்ந்தவர்கள் விசுவாசமுள்ள ஆபிரகாமோடு ஆசீர்வதிக்கப்படுகிறார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விசுவாசித்த ஆபிரகாமோடு”; அல்லது, “உண்மையுள்ள ஆபிரகாமோடு.”
    reason: πιστός என்ற கிரேக்கச் சொல் இங்கு ‘விசுவாசிக்கிற’ என்றும் ‘உண்மையுள்ள’ என்றும் புரிந்துகொள்ளப்படலாம்.
lexical_decisions:
- source_word: ὥστε
  choice: ஆகவே
  rationale: முந்தைய வாதத்திலிருந்து வரும் முடிவை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: οἱ ἐκ πίστεως
  choice: விசுவாசத்தைச் சார்ந்தவர்கள்
  rationale: ἐκ πίστεως என்பதிலுள்ள, விசுவாசத்தால் அடையாளப்படுத்தப்படும் மக்கள் என்ற பொருளை வெறும் ‘விசுவாசிக்கிறவர்கள்’ என்ற வினைமுறைப் பொழிப்பைவிட நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: πίστεως
  choice: விசுவாசம்
  rationale: இச்சூழலில் πίστις என்பது முதன்மையாக நம்பிக்கை அல்லது விசுவாசத்தைக் குறிக்கிறது; ‘உண்மைத்தன்மை’ என்பதை அல்ல.
- source_word: εὐλογοῦνται
  choice: ஆசீர்வதிக்கப்படுகிறார்கள்
  rationale: ஆசீர்வாதம் அடையப்படுவது அல்ல, பெற்றுக்கொள்ளப்படுவது என்பதைச் செயப்பாட்டு வடிவில் பாதுகாக்கிறது; கிரேக்க நிகழ்காலத்தையும் பிரதிபலிக்கிறது.
- source_word: σὺν
  choice: ஆபிரகாமோடு
  rationale: பகிர்ந்துகொள்ளப்படும் ஆசீர்வாதத்தில் ஆபிரகாமுடன் இணைந்திருப்பதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τῷ πιστῷ Ἀβραάμ
  choice: விசுவாசமுள்ள ஆபிரகாம்
  rationale: πιστός என்பதிலுள்ள ‘விசுவாசிக்கிற’ மற்றும் ‘விசுவாசத்தில் நிலைத்த/உண்மையுள்ள’ என்ற நுண்பொருட்களைத் தமிழில் ஓரளவு திறந்தவாறே வைத்திருக்கிறது.
theological_decisions:
- issue: விசுவாசத்தை மையமாகக் கொண்ட சூழலில் ஆபிரகாமைக் குறிக்கும் πιστός என்பதை எவ்வாறு மொழிபெயர்ப்பது
  choice: விசுவாசமுள்ள ஆபிரகாம்
  alternative: விசுவாசித்த ஆபிரகாம்; உண்மையுள்ள ஆபிரகாம்
  rationale: πιστός என்பது நம்புகிறவர் என்றும் உண்மையுள்ளவர் என்றும் பொருள்படலாம். கலாத்தியர் 3-இன் உடனடிச் சூழல் ஆபிரகாமின் விசுவாசத்தை வலியுறுத்துவதால் ‘விசுவாசமுள்ள’ என்பது இரு நுண்பொருட்களையும் தேவையின்றி ஒன்றாக முடிவுசெய்யாமல் தக்கவைக்கிறது; மாற்றுப் புரிதல்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘விசுவாசத்தைச் சார்ந்தவர்கள்’ என்பது கிரேக்க ἐκ πίστεως கட்டமைப்பின் அடையாளப்படுத்தும் வலிமையைப் பாதுகாக்கிறது; அடிக்குறிப்பு குறியீடு அது விளக்கும் தெளிவின்மைக்குப் பிறகு வைக்கப்பட்டுள்ளது.
