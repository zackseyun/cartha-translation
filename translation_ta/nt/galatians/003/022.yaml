revisions:
- from: ஆனால், வேதவாக்கியம் எல்லாவற்றையும் பாவத்தின்கீழ் சிறைப்படுத்தியது[b]. இவ்வாறு, இயேசு மெசியாவின்மேல் வைக்கும் விசுவாசத்தின் மூலம் கிடைக்கும் வாக்குத்தத்தம்[a], விசுவாசிக்கிறவர்களுக்குக் கொடுக்கப்படும்படி செய்தது.
  to: ஆனால், இயேசு மெசியாவின்மேல் கொண்டிருக்கும் விசுவாசத்தினால் வரும் வாக்குத்தத்தம் விசுவாசிக்கிறவர்களுக்குக் கொடுக்கப்படுவதற்காக, வேதவாக்கியம் எல்லாவற்றையும் பாவத்தின்கீழ் சிறைப்படுத்தியது[b][a].
  rationale: 'The revision restores the Greek purpose structure: the Scripture''s act of confinement is performed so that the promise, derived from faith in Jesus Messiah, may be given to those who believe. It preserves the disputed πίστεως Ἰησοῦ Χριστοῦ construction through a clearly marked footnote alternative and retains both supplied footnote anchors.'
