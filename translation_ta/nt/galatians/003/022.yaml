language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλὰ συνέκλεισεν ἡ γραφὴ τὰ πάντα ὑπὸ ἁμαρτίαν ἵνα ἡ ἐπαγγελία ἐκ πίστεως Ἰησοῦ Χριστοῦ δοθῇ τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/022.yaml
  text: But the Scripture imprisoned everything under sin[b][a], so that the promise by faith in Jesus the Messiah might be given to those who believe.
translation:
  language: ta
  text: ஆனால், இயேசு மெசியாவின்மேல் கொண்டிருக்கும் விசுவாசத்தினால் வரும் வாக்குத்தத்தம் விசுவாசிக்கிறவர்களுக்குக் கொடுக்கப்படுவதற்காக, வேதவாக்கியம் எல்லாவற்றையும் பாவத்தின்கீழ் சிறைப்படுத்தியது[b][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இயேசு மெசியாவின் உண்மைத்தன்மையினால் வரும் வாக்குத்தத்தம்.”
    reason: alternative_reading
  - marker: b
    text: அல்லது, “எல்லாவற்றையும் பாவத்தின்கீழ் அடைத்து வைத்தது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέκλεισεν
  choice: சிறைப்படுத்தியது
  rationale: சுற்றிலும் அடைத்து ஒருவரை அல்லது ஒன்றைத் தன் கட்டுப்பாட்டின்கீழ் வைக்கும் கிரேக்கச் சொல்லின் வலிமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἡ γραφή
  choice: வேதவாக்கியம்
  rationale: ஒருமையில் வரும் இச்சொல், ஒருங்கிணைந்த சாட்சியாகச் செயல்படும் வேதத்தைப் பவுல் ஆளுருவகப்படுத்துவதைப் பாதுகாக்கிறது.
- source_word: τὰ πάντα
  choice: எல்லாவற்றையும்
  rationale: நபர்களுக்கு மட்டும் வரம்பிடாமல், நடுநிலைப் பன்மையின் விரிவான, முழுமையான பரப்பைப் பாதுகாக்கிறது.
- source_word: ὑπὸ ἁμαρτίαν
  choice: பாவத்தின்கீழ்
  rationale: பாவத்தின் ஆதிக்கத்திற்கு உட்பட்டிருப்பது என்ற உருவகத்தை விளக்க விரிவாக்கமின்றி நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἡ ἐπαγγελία
  choice: வாக்குத்தத்தம்
  rationale: கிரேக்கப் பெயர்ச்சொல்லின் அடிப்படைப் பொருளைச் சுருக்கமாகவும் வேதாகமத் தமிழில் அறியப்பட்ட முறையிலும் தருகிறது.
- source_word: ἐκ πίστεως Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியாவின்மேல் வைக்கும் விசுவாசத்தின் மூலம் கிடைக்கும்
  rationale: சர்ச்சைக்குரிய πίστις Χριστοῦ தொடரை முதன்மை உரையில் நோக்குநிலை உருபாகப் புரிந்து, தமிழில் பொருள் தெளிவாக இருக்கும்படி அமைக்கிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: Χριστοῦ
  choice: மெசியா
  rationale: இங்கு இயேசுவோடு இணைந்த பட்டப்பெயராக வருவதால், அபிஷேகம் செய்யப்பட்டவர் என்ற பட்டப்பொருளை வெளிப்படுத்துகிறது.
- source_word: δοθῇ
  choice: கொடுக்கப்படும்படி
  rationale: ἵνα-வுக்குப் பின்வரும் இறந்தகாலச் செயப்பாட்டு வினைமுற்றின் நோக்கப்பொருளை இயல்பான தமிழில் காட்டுகிறது.
- source_word: τοῖς πιστεύουσιν
  choice: விசுவாசிக்கிறவர்களுக்கு
  rationale: கிரேக்க நிகழ்காலப் பெயரெச்சத்தின் செயற்பாட்டுத் தன்மையைப் பாதுகாத்து, அதை வெறும் குழுப் பெயராக மாற்றாமல் வழங்குகிறது.
theological_decisions:
- issue: πίστεως Ἰησοῦ Χριστοῦ என்ற உருபுத் தொடர்பு
  choice: 'நோக்குநிலை உருபு: ‘இயேசு மெசியாவின்மேல் வைக்கும் விசுவாசம்’'
  alternative: 'எழுவாய்நிலை உருபு: ‘இயேசு மெசியாவின் விசுவாச உண்மை’'
  rationale: இத்தொடரின் இலக்கணப் பொருள் உண்மையாகவே சர்ச்சைக்குரியது. முதன்மை உரை பரவலான நோக்குநிலை வாசிப்பைத் தருகிறது; கிறிஸ்துவின் விசுவாச உண்மையைக் குறிக்கும் மாற்று வாசிப்பு அடிக்குறிப்பில் வைக்கப்பட்டு இறையியல் இழுபறை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘பாவத்தின்கீழ்’ என்ற பவுலின் உருவகமும், வேதவாக்கியத்தின் ஆளுருவகமும் விளக்கச் சேர்க்கையின்றிப் பாதுகாக்கப்பட்டுள்ளன.
