id: GAL.3.15
reference: Galatians 3:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἀδελφοί, κατὰ ἄνθρωπον λέγω· ὅμως ἀνθρώπου κεκυρωμένην διαθήκην οὐδεὶς ἀθετεῖ ἢ ἐπιδιατάσσεται.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/015.yaml
  text: 'Brothers[a], I am speaking in human terms: even a covenant ratified by a man[b], no one sets aside or adds to it.'
translation:
  language: ta
  text: 'சகோதரர்களே[a], மனித வழக்கின்படி சொல்கிறேன்: ஒரு மனிதரால் உறுதிசெய்யப்பட்ட உடன்படிக்கையைக்கூட[b] எவரும் செல்லாததாக்குவதுமில்லை, அதனுடன் எதையும் சேர்ப்பதுமில்லை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சகோதரர்களே’ என்பது ἀδελφοί என்ற ஆண்பால் பன்மைச் சொல்லை மொழிபெயர்க்கிறது; பவுல் பெண்களும் அடங்கியிருக்கக்கூடிய சக விசுவாசிகளிடம் பேசுகிறார்.
    reason: cultural_note
  - marker: b
    text: ‘உடன்படிக்கை’ என்பதற்குப் பதிலாக ‘உயில்’ அல்லது ‘மரணசாசனம்’ என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: சகோதரர்களே
  rationale: ἀδελφός என்பதன் ஆண்பால் பன்மை விளிவடிவத்தை நேரடியாகப் பிரதிபலிக்கிறது. பவுல் பெண்களும் அடங்கியிருக்கக்கூடிய சக விசுவாசிகளை அழைக்கிறார் என்பதைக் குறிப்பில் தெளிவுபடுத்துகிறது.
- source_word: κατὰ ἄνθρωπον λέγω
  choice: மனித வழக்கின்படி சொல்கிறேன்
  rationale: பவுல் சாதாரண மனித வாழ்விலிருந்து, குறிப்பாக நடைமுறையிலுள்ள சட்ட வழக்கிலிருந்து, ஓர் ஒப்புமையை முன்வைக்கிறார். இதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ὅμως
  choice: -க்கைக்கூட
  rationale: சாதாரண மனிதச் சூழலிலேயே இந்த நியதி பொருந்தும் என்பதை வலியுறுத்தும் ὅμως என்பதன் argumentative force-ஐ தமிழின் ‘கூட’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀνθρώπου
  choice: ஒரு மனிதரால்
  rationale: ஒருமை மனிதரைக் குறிக்கும் கிரேக்கச் சொல்லை மங்கலான ‘மனித’ என்ற பெயரடையாக மாற்றாமல், செய்பவரைத் தெளிவாக வைத்திருக்கிறது.
- source_word: κεκυρωμένην
  choice: உறுதிசெய்யப்பட்ட
  rationale: முறைப்படி நிலைநாட்டப்பட்டு நடைமுறையில் இருக்கும் ஒன்றைக் குறிக்கும் நிறைவு செயலின் விளைவைத் தக்கவைக்கிறது; தமிழில் சட்டச்சூழலுக்கும் இயல்பாக உள்ளது.
- source_word: διαθήκην
  choice: உடன்படிக்கை
  rationale: கலாத்தியர் 3-இல் ஆபிரகாமுக்குக் கொடுக்கப்பட்ட வாக்குறுதியும் உடன்படிக்கையும் பற்றிய வாதத்துடன் தொடர்ச்சியைப் பேணுகிறது. ‘உயில்’ என்ற சட்டப் பொருள் குறிப்பில் தரப்படுகிறது.
- source_word: ἀθετεῖ
  choice: செல்லாததாக்குவதுமில்லை
  rationale: ஏற்கெனவே உறுதிசெய்யப்பட்டதை ரத்துசெய்து அதன் செல்லுபடியை நீக்குதல் என்ற சட்ட வலிமையைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐπιδιατάσσεται
  choice: அதனுடன் எதையும் சேர்ப்பதுமில்லை
  rationale: பின்னர் கூடுதல் நிபந்தனைகளையோ விதிகளையோ இணைப்பதைச் சுட்டுகிறது; மூலத்தின் பொருளை மிகைப்படுத்தாமல் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: διαθήκη என்பதை ‘உடன்படிக்கை’ என்றா, ‘உயில்’ என்றா மொழிபெயர்ப்பது
  choice: உடன்படிக்கை
  alternative: உயில் / மரணசாசனம்
  rationale: இப்பகுதியில் பவுலின் வாதம் ஆபிரகாமுக்கான இறைவாக்குறுதியையும் உடன்படிக்கையையும் மையமாகக் கொண்டுள்ளது. ஆகவே ‘உடன்படிக்கை’ சூழலுக்கும் இறையியல் தொடர்ச்சிக்கும் மிகப் பொருத்தமானது; இருப்பினும் ‘உயில்’ என்ற உண்மையான சட்டப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான மொழி பயன்படுத்தப்பட்டுள்ளது. சட்ட ஒப்புமையின் வலிமையைப் பேண ‘உறுதிசெய்யப்பட்ட’, ‘செல்லாததாக்குதல்’, ‘சேர்த்தல்’ ஆகிய சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன; மூலத்திலுள்ள உடன்படிக்கை/உயில் பொருள் நெகிழ்வு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
