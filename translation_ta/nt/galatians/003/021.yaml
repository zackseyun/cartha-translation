- from: அப்படியானால், திருச்சட்டம் கடவுளுடைய வாக்குறுதிகளுக்கு எதிரானதா? ஒருபோதும் இல்லை! ஏனெனில், உயிரளிக்க வல்ல ஒரு சட்டம் கொடுக்கப்பட்டிருந்தால், நீதி[a] உண்மையிலேயே சட்டத்திலிருந்து வந்திருக்கும்.
  to: அப்படியானால், சட்டம் கடவுளுடைய வாக்குறுதிகளுக்கு எதிரானதா? ஒருபோதும் இல்லை! ஏனெனில், உயிரளிக்கக்கூடிய ஒரு சட்டம் கொடுக்கப்பட்டிருந்தால், நீதி[a] உண்மையிலேயே சட்டத்திலிருந்து வந்திருக்கும்.
