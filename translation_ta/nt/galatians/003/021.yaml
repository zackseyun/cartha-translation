source:
  edition: SBLGNT
  text: Ὁ οὖν νόμος κατὰ τῶν ἐπαγγελιῶν τοῦ θεοῦ; μὴ γένοιτο· εἰ γὰρ ἐδόθη νόμος ὁ δυνάμενος ζῳοποιῆσαι, ὄντως ⸂ἐκ νόμου ἂν⸃ ἦν ἡ δικαιοσύνη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/021.yaml
  text: Is the law then against the promises of God? May it never be! For if a law had been given that was able to give life[a], then righteousness really would have been from the law.
translation:
  language: ta
  text: அப்படியானால், சட்டம் கடவுளுடைய வாக்குறுதிகளுக்கு எதிரானதா? ஒருபோதும் இல்லை! ஏனெனில், உயிரளிக்கக்கூடிய ஒரு சட்டம் கொடுக்கப்பட்டிருந்தால், நீதி[a] உண்மையிலேயே சட்டத்திலிருந்து வந்திருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீதியான நிலை.”
    reason: δικαιοσύνη என்பது நீதி என்ற பண்பையும் கடவுளுக்கு முன்பான சரியான நிலையையும் குறிக்கக்கூடியதால் மாற்று மொழிபெயர்ப்பு தரப்படுகிறது.
lexical_decisions:
- source_word: νόμος
  choice: திருச்சட்டம் / சட்டம்
  rationale: முதல் குறிப்பில் மோசேயின் திருச்சட்டம் பின்னணியில் இருப்பதைத் தெளிவாக்க ‘திருச்சட்டம்’ எனவும், அனர்த்த நிபந்தனையில் சட்டம் என்ற பொதுவகையைச் சுட்ட ‘ஒரு சட்டம்’ எனவும் மொழிபெயர்க்கப்பட்டது; இறுதியில் அதே வாதத்தை இயல்பாகத் தொடர ‘சட்டம்’ பயன்படுத்தப்பட்டது.
- source_word: κατὰ
  choice: எதிரான
  rationale: Genitive உடன் வரும் κατά குறிக்கும் எதிர்ப்பு அல்லது முரண்பாட்டு உறவை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐπαγγελιῶν
  choice: வாக்குறுதிகள்
  rationale: கிரேக்க மூலத்தின் பன்மை அப்படியே பாதுகாக்கப்படுகிறது.
- source_word: μὴ γένοιτο
  choice: ஒருபோதும் இல்லை!
  rationale: பவுலின் வலுவான மறுப்பை நவீன தமிழில் இயல்பாகவும் அழுத்தமாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐδόθη
  choice: கொடுக்கப்பட்டிருந்தால்
  rationale: இறந்தகாலத்தில் நிறைவேறாத அனுமான நிபந்தனையைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: δυνάμενος ζῳοποιῆσαι
  choice: உயிரளிக்க வல்ல
  rationale: சட்டத்துக்கு உயிர் கொடுக்கும் ஆற்றல் இருக்கிறதா என்பதே கருத்து; சுருக்கமாகவும் இயல்பாகவும் மொழிபெயர்க்கப்பட்டது.
- source_word: ὄντως
  choice: உண்மையிலேயே
  rationale: முடிவுரையின் வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: ἐκ νόμου
  choice: சட்டத்திலிருந்து
  rationale: ἐκ குறிக்கும் மூலம் அல்லது தோற்றத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: δικαιοσύνη
  choice: நீதி
  rationale: தமிழில் ‘நீதி’ என்பது கடவுளுக்கு முன்பான சரியான நிலை மற்றும் நீதித்தன்மை ஆகிய இரு பரிமாணங்களுக்கும் இடமளிக்கும் மரியாதையான, பரவலாகப் புரியக்கூடிய சொல்.
theological_decisions:
- issue: δικαιοσύνη என்பதன் பவுலியப் பொருள்
  choice: நீதி
  alternative: நீதிமானாக்கப்படுதல் / நீதியான நிலை
  rationale: மூலச் சொல்லை ஒரு குறிப்பிட்ட நீதிமானாக்குதல் கோட்பாட்டுக்குள் சுருக்காமல், கடவுளுக்கு முன்பான சரியான நிலை மற்றும் நீதி என்ற பரந்த பொருள் பதற்றத்தை ‘நீதி’ பாதுகாக்கிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: νόμος என்பது மோசேயின் திருச்சட்டமா அல்லது சட்டம் என்ற பொதுவகையா
  choice: முதல் குறிப்பில் ‘திருச்சட்டம்’; அனுமான வாக்கியத்தில் ‘ஒரு சட்டம்’
  alternative: எங்கும் ‘திருச்சட்டம்’ அல்லது எங்கும் ‘சட்டம்’
  rationale: சூழலில் மோசேயின் திருச்சட்டம் தெளிவாகப் பின்னணியில் இருந்தாலும், εἰ ... νόμος என்ற அனுமான அமைப்பு உயிரளிக்கக்கூடிய எந்தச் சட்டத்தையும் வகையாக முன்வைக்கிறது. இரு நுணுக்கங்களும் பாதுகாக்கப்பட்டன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் அதேவேளை வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. வினா–வலுவான மறுப்பு–அனுமான முடிவு என்ற கிரேக்க வாத அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
