  - marker: d
    text: “மரம்” என்பதற்கான கிரேக்கச் சொல் சொற்படியாக “மரம்” அல்லது “மரப்பொருள்” எனப் பொருள்படும்; இங்கு “மரம்” என்பது வேதமேற்கோளின் சொல்லாட்சியைப் பாதுகாக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστός
  choice: மேசியா
  rationale: Χριστός என்பதன் பட்டப்பெயர் சார்ந்த பொருளைத் தமிழில் இயல்பாகத் தெரிவிக்க ‘மேசியா’ பயன்படுத்தப்பட்டது; ‘கிறிஸ்து’ என்பதும் சாத்தியமான மாற்று.
- source_word: ἐξηγόρασεν
  choice: மீட்டார்
  rationale: விலை கொடுத்து விடுவித்தல் என்ற வணிகப் பின்னணியையும் பவுலின் இரட்சிப்பு சார்ந்த பயன்பாட்டையும் இயல்பான தமிழில் சுமக்கிறது.
- source_word: κατάρα / Ἐπικατάρατος
  choice: சாபம் / சபிக்கப்பட்டவர்
  rationale: கிரேக்கச் சொற்களின் உடன்படிக்கை மற்றும் தீர்ப்புச் சார்ந்த வலிமையை விளக்க விரிவாக்கமின்றிப் பாதுகாக்கிறது.
- source_word: τοῦ νόμου
  choice: சட்டத்தின்
  rationale: கிரேக்கத்தின் நேரடியான பொருளைப் பாதுகாக்கிறது; சூழலில் மோசேயின் சட்டம் குறிக்கப்பட்டாலும், அதை மொழிபெயர்ப்பிலேயே கூடுதலாகச் சொல்லவில்லை.
- source_word: γενόμενος
  choice: சாபமாகி
  rationale: வினையெச்சத் தொடர்பை இயல்பான தமிழில் காத்து, மீட்பு எவ்வாறு நிகழ்ந்தது என்பதைக் காட்டுகிறது.
- source_word: ὑπὲρ ἡμῶν
  choice: நமக்காக
  rationale: நமது நன்மைக்காக அல்லது நமது சார்பாக என்ற பொருள் அகலத்தைப் பாதுகாக்கிறது; ‘நமது இடத்தில்’ என்ற குறுகிய விளக்கத்தை முதன்மை உரையில் திணிக்கவில்லை.
- source_word: ὅτι γέγραπται
  choice: ஏனெனில் ... என்று எழுதப்பட்டுள்ளது
  rationale: மேற்கோள் முந்தைய கூற்றுக்கான வேதவசன ஆதாரமாக வருவதை இயல்பாகக் காட்டுகிறது.
- source_word: κρεμάμενος
  choice: தொங்குகிற
  rationale: வேதமேற்கோளின் பொதுப்படையான கூற்றை நிகழ்காலப் பெயரெச்ச வடிவில் பாதுகாக்கிறது.
- source_word: ξύλου
  choice: மரத்தில்
  rationale: ξύλον என்பதன் ‘மரம்/மரப்பொருள்’ பொருள்களில், உபாகம மேற்கோளுடனான சொல் தொடர்பைப் பாதுகாக்க ‘மரம்’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: ὑπὲρ ἡμῶν என்பதன் பரிகாரப் பொருள் எல்லை
  choice: நமக்காக
  alternative: நமது சார்பாக; நமது இடத்தில்
  rationale: இந்தச் சொற்றொடர் பயனையும் பிரதிநிதித்துவத்தையும் தெளிவாகச் சுட்டுகிறது; ஆனால் ὑπέρ மட்டும் ஒரு குறிப்பிட்ட பரிகாரக் கோட்பாட்டை கட்டாயப்படுத்தாததால் அகன்ற பொருள் முதன்மை உரையில் பாதுகாக்கப்பட்டது.
- issue: γενόμενος ὑπὲρ ἡμῶν κατάρα என்பதன் அதிர்ச்சியூட்டும் பெயர்ச்சொல் நடை
  choice: நமக்காகச் சாபமாகி
  alternative: நமக்காகச் சபிக்கப்பட்டவராகி
  rationale: பவுல் பயன்படுத்தும் ‘சாபம்’ என்ற பயனிலைப் பெயர்ச்சொல்லை மென்மைப்படுத்தாமல் அப்படியே காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் dignified நடையில் வடிவமைக்கப்பட்டது. ‘சட்டம்’ என்பது νόμος என்பதன் வெளிப்படையான பொருளைக் காக்கிறது; ‘சாபமாகி’ என்பது மூலத்தின் வலிமையையும் இறையியல் பதற்றத்தையும் மென்மைப்படுத்தாமல் வைத்திருக்கிறது. மேற்கோள் குறிகள் நேரடி வேதமேற்கோளைத் தெளிவுபடுத்துகின்றன.
