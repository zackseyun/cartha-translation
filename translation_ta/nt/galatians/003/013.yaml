  text: 'The Messiah redeemed us from the curse of the law by becoming a curse for us[d][c][b][a], because it is written: “Cursed is everyone who hangs on a tree.”'
translation:
  language: ta
  text: மேசியா நமக்காகச் சாபமாகி, சட்டத்தின் சாபத்திலிருந்து நம்மை மீட்டார்[a][b]. ஏனெனில்[c], “மரத்தில்[d] தொங்குகிற ஒவ்வொருவரும் சபிக்கப்பட்டவர்” என்று எழுதப்பட்டுள்ளது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்து நம்மை மீட்டார்.”
    reason: lexical_alternative
  - marker: b
    text: “நமக்காக” என்பதை “நமது சார்பாக” என்றும், ஒருவேளை “நமது இடத்தில்” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “உண்மையில் எழுதப்பட்டுள்ளது.”
