  - severity: medium
    issue: Footnote anchors are not attached to all of the terms they explain.
    rationale: Marker a is attached to the added explanatory sentence rather than to “வித்து,” and marker c should be attached directly to the rendering of διαταγεὶς. Anchoring them at the relevant translated expressions resolves the structural and reader-navigation problem.
  - severity: low
