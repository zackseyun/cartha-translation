source:
  edition: SBLGNT
  text: Τί οὖν ὁ νόμος; τῶν παραβάσεων χάριν προσετέθη, ἄχρις ⸀οὗ ἔλθῃ τὸ σπέρμα ᾧ ἐπήγγελται, διαταγεὶς δι’ ἀγγέλων ἐν χειρὶ μεσίτου·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/019.yaml
  text: Why then the law? It was added because of transgressions until the seed should come to whom the promise had been made[c][b][a], having been ordained through angels by the hand of a mediator.
translation:
  language: ta
  text: அப்படியானால், திருச்சட்டம் எதற்காக? மீறுதல்களின் காரணமாக[b], வாக்குறுதி அளிக்கப்பட்டிருந்த வித்து[a] வரும் வரை அது சேர்க்கப்பட்டது; தேவதூதர்கள் வழியாக ஒரு நடுவரின் கையால் அது ஒழுங்குபடுத்தப்பட்டது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வித்து” என்பதை “சந்ததி” அல்லது “வழித்தோன்றல்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “மீறுதல்களின் காரணமாக” என்பது மீறுதல்களை எதிர்கொள்ளவோ, வெளிப்படுத்தவோ, கட்டுப்படுத்தவோ என்பதைக் குறிக்கலாம்; கிரேக்க உரை இதை மேலும் குறிப்பாகச் சொல்லவில்லை.
    reason: alternative_reading
  - marker: c
    text: “ஒழுங்குபடுத்தப்பட்டது” என்பதை “ஏற்பாடு செய்யப்பட்டது” அல்லது “நிறுவப்பட்டது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ὁ νόμος;
  choice: அப்படியானால், திருச்சட்டம் எதற்காக?
  rationale: சட்டத்தின் இயல்பை வரையறுப்பதைவிட, பவுலின் வாதத்தில் அதன் நோக்கத்தைக் கேட்கும் சுருக்கமான கிரேக்க வினாவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: νόμος
  choice: திருச்சட்டம்
  rationale: இங்கு மோசேயின் சட்டத்தைக் குறிக்கும் அடையாளம் பெற்ற உடன்படிக்கைச் சொல்லாக இருப்பதால், நவீன தமிழ் வேதாகம நடையில் தெளிவாக ‘திருச்சட்டம்’ என வழங்கப்படுகிறது.
- source_word: τῶν παραβάσεων χάριν
  choice: மீறுதல்களின் காரணமாக
  rationale: χάριν என்பதிலுள்ள காரணம்/நோக்கம் சார்ந்த நெகிழ்வைத் தக்கவைத்து, மீறுதல்களைத் தடுக்கவா, வெளிப்படுத்தவா, அல்லது வேறு விதமாகக் கையாளவா என்று உரை சொல்லாததை மொழிபெயர்ப்பு முடிவுசெய்யவில்லை.
- source_word: προσετέθη
  choice: சேர்க்கப்பட்டது
  rationale: சட்டம் முன்பிருந்த வாக்குறுதியுடன் பின்னர் சேர்க்கப்பட்டது என்ற προστίθημι வினையின் செயப்பாட்டு வடிவத்தையும் துணைநிலையையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἄχρις οὗ ἔλθῃ
  choice: வரும் வரை
  rationale: சட்டம் சேர்க்கப்பட்ட காலத்திலிருந்து எதிர்நோக்கப்பட்ட வருகையைச் சுட்டும் கால எல்லையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τὸ σπέρμα
  choice: அந்த வித்து
  rationale: ஆபிரகாமுக்கான வாக்குறுதியோடும் முந்தைய வசனத்தின் ஒருமை சார்ந்த வாதத்தோடும் உள்ள சொல் தொடர்பைப் பாதுகாக்க ‘வித்து’ வைக்கப்படுகிறது; வழக்கமான மாற்றுச் சொற்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: ᾧ ἐπήγγελται
  choice: வாக்குறுதி அளிக்கப்பட்டிருந்த அந்த
  rationale: தத்திவின் பெறுநரையும், முன்பு அளிக்கப்பட்டு தொடர்ந்து நிலைத்திருந்த வாக்குறுதியைக் குறிக்கும் நிறைவுக்கால நுணுக்கத்தையும் தமிழில் வெளிப்படுத்துகிறது.
- source_word: διαταγεὶς
  choice: ஏற்பாடு செய்யப்பட்டது
  rationale: சட்டம் அதிகாரபூர்வமாக ஒழுங்கமைக்கப்பட்டு நிறுவப்பட்டதைக் குறிக்கும் διατάσσω என்பதன் பரந்த பொருளை அளிக்கிறது; மிகக் குறுகிய இறையியல் பொருளைத் திணிக்கவில்லை.
- source_word: δι’ ἀγγέλων
  choice: தேவதூதர்கள் வழியாக
  rationale: διά உடன் வரும் இடைமுகச் செயலாண்மையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐν χειρὶ μεσίτου
  choice: ஒரு நடுவரின் கையால்
  rationale: கிரேக்கத்தின் உருவகமான ‘கை’ மொழிப்பாங்கையும், நடுவர் வழியான இடைமுகத்தையும் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘மீறுதல்களின் காரணமாக’ என்பதன் பொருள்
  choice: மீறுதல்களின் காரணமாக
  alternative: மீறுதல்களைத் தடுக்க / வெளிப்படுத்த / அவற்றைக் கையாள
  rationale: கிரேக்கச் சொற்றொடர் காரணத்தையோ நோக்கத்தையோ சுருக்கமாகக் கூறுகிறது; அதன் துல்லிய செயல்பாட்டைச் சுருக்கிப் பொருள் தீர்மானிக்காமல் இறையியல் அழுத்தத்தைத் தக்கவைக்கிறது.
- issue: பவுலின் வாதத்தில் σπέρμα என்பதன் மொழிபெயர்ப்பு
  choice: வித்து
  alternative: சந்ததி; வழித்தோன்றல்
  rationale: தமிழில் ‘சந்ததி’ இயல்பாக இருந்தாலும், ‘வித்து’ ஆபிரகாமிய வாக்குறுதியுடனான சொல் ஒற்றுமையையும் இப்பகுதியின் ஒருமை வாதத்தையும் நெருக்கமாகப் பாதுகாக்கிறது.
- issue: சட்டம் வழங்கப்பட்டதில் தேவதூதர்களும் நடுவரும் வகிக்கும் பங்கு
  choice: தேவதூதர்கள் வழியாக ஒரு நடுவரின் கையால் ஏற்பாடு செய்யப்பட்டது
  alternative: தேவதூதர்களால் ஒரு நடுவர் மூலம் நிறுவப்பட்டது
  rationale: மூலத்தின் இரட்டை இடைமுக அமைப்பையும் ‘கை’ என்ற உருவகத்தையும் பாதுகாக்கிறது; நடுவர் யார் என்பதை உரை இங்கு குறிப்பிடாததால் அடையாளப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. ‘திருச்சட்டம்’, ‘வித்து’, ‘நடுவர்’ ஆகியவை சூழலின் முக்கிய சொல் தொடர்புகளைப் பாதுகாக்கின்றன. அனைத்து அடிக்குறிப்பு குறிகளும் தொடர்புடைய முக்கிய உரைப் பகுதிகளில் இணைக்கப்பட்டுள்ளன.
