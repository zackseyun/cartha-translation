  terminology: “திருச்சட்டம்,” “மீறுதல்கள்,” “வித்து,” “தேவதூதர்கள்,” and “நடுவர்” are appropriate and mutually consistent. “வித்து” retains the lexical link with the Abrahamic promise; its idiomatic alternatives belong in a footnote, not in the running text.
