  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகருக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘திருச்சட்டம்,’ ‘சாபத்திற்குக் கீழ்,’ ‘நிலைத்திருந்து’ ஆகியவை வேதவாக்கியத்தின் செறிவைத் தக்கவைத்தபடியே பழமையான அல்லது சமயப்பிரிவு சார்ந்த சொற்களைத் தவிர்க்கின்றன.
