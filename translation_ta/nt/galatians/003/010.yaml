source:
  edition: SBLGNT
  text: Ὅσοι γὰρ ἐξ ἔργων νόμου εἰσὶν ὑπὸ κατάραν εἰσίν, γέγραπται γὰρ ⸀ὅτι Ἐπικατάρατος πᾶς ὃς οὐκ ⸀ἐμμένει πᾶσιν τοῖς γεγραμμένοις ἐν τῷ βιβλίῳ τοῦ νόμου τοῦ ποιῆσαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/010.yaml
  text: For all who are of works of the law are under a curse[a], for it is written, “Cursed is everyone who does not remain in all the things written in the book of the law[b], to do them.”
translation:
  language: ta
  text: ஏனெனில், திருச்சட்டத்தின் செயல்களைச் சார்ந்திருப்பவர்கள்[a] அனைவரும் சாபத்திற்குக் கீழ் இருக்கிறார்கள். ஏனெனில், “அவற்றைச் செய்யும்படி திருச்சட்ட நூலில் எழுதப்பட்டுள்ள அனைத்தையும் தொடர்ந்து கடைப்பிடிக்காத ஒவ்வொருவரும் சபிக்கப்பட்டவர்” என்று எழுதப்பட்டுள்ளது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திருச்சட்டத்தின் செயல்களை நம்பியிருப்பவர்கள்.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅσοι γὰρ
  choice: ஏனெனில், … அனைவரும்
  rationale: γάρ என்பதன் விளக்கக் காரணத் தொடர்பையும் Ὅσοι என்பதன் பன்மைத் தொகுதிச் சுட்டுதலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἐξ ἔργων νόμου
  choice: திருச்சட்டத்தின் செயல்களைச் சார்ந்திருப்பவர்கள்
  rationale: ἐξ என்பதன் உறவு அல்லது அடிப்படை சார்ந்த நுண்பொருளைத் தமிழில் வாசிக்கத்தக்க வகையில் தருகிறது; ‘நம்பியிருப்பவர்கள்’ என்று மட்டும் கூறி இறையியல் பொருளை முழுமையாக முன்தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: ὑπὸ κατάραν
  choice: சாபத்திற்குக் கீழ்
  rationale: சாபத்தின் ஆளுகைக்கு அல்லது தீர்ப்புக்கு உட்பட்ட நிலையைக் காட்டும் இயல்பான தமிழ் வடிவம்; கிரேக்கத்தில் குறிப்பிட்ட ஒரே சாபம் என்று கட்டாயப்படுத்தும் உருபு இல்லை.
- source_word: γέγραπται
  choice: என்று எழுதப்பட்டுள்ளது
  rationale: வேதமேற்கோள் அறிமுகச் சூத்திரத்தையும் perfect passive வடிவத்தின் நிலைத்த அதிகார நுண்பொருளையும் காக்கிறது.
- source_word: Ἐπικατάρατος πᾶς ὃς
  choice: … செய்யாத ஒவ்வொருவரும் சபிக்கப்பட்டவர்
  rationale: πᾶς ὃς என்பதன் அனைவரையும் உள்ளடக்கும் வலிமையையும் Ἐπικατάρατος என்பதன் தீர்ப்புசார் பொருளையும் தெளிவாக வழங்குகிறது.
- source_word: ἐμμένει
  choice: நிலைத்திருந்து
  rationale: தொடர்ந்து பற்றிக்கொண்டு நடப்பது என்ற நீடித்த கடைப்பிடிப்பின் பொருளை, மூலத்தின் உருவகத்தை அதிகம் இழக்காமல் தருகிறது.
- source_word: πᾶσιν τοῖς γεγραμμένοις
  choice: எழுதப்பட்டுள்ள அனைத்திலும்
  rationale: πᾶσιν என்பதன் முழுமையான எல்லையையும் எழுதப்பட்ட கட்டளைகளுடனான தொடர்பையும் முறையாகக் காக்கிறது.
- source_word: ἐν τῷ βιβλίῳ τοῦ νόμου
  choice: திருச்சட்ட நூலில்
  rationale: ‘சுருள்’ என வரலாற்று வடிவத்தை முன்னிறுத்தாமல், βιβλίον என்பதற்கு நவீன வாசகருக்குப் புரியும் ‘நூல்’ என்பதையும் νόμος என்பதற்கு ‘திருச்சட்டம்’ என்பதையும் பயன்படுத்துகிறது.
- source_word: τοῦ ποιῆσαι αὐτά
  choice: அவற்றைச் செய்ய
  rationale: எழுதப்பட்டவற்றை நடைமுறையில் நிறைவேற்ற வேண்டும் என்ற infinitive சொற்றொடரின் நேரடியான பொருளைக் காக்கிறது.
theological_decisions:
- issue: ἐξ ἔργων νόμου என்பதன் இறையியல் சார்ந்த பொருள்
  choice: திருச்சட்டத்தின் செயல்களைச் சார்ந்திருப்பவர்கள்
  alternative: திருச்சட்டத்தின் செயல்களை நம்பியிருப்பவர்கள் / திருச்சட்டத்தின் செயல்களின் அடிப்படையில் இருப்பவர்கள்
  rationale: இந்தப் பவுலியச் சொற்றொடர் அடையாளம், அடிப்படை, சார்பு ஆகிய ஒன்றோடொன்று தொடர்புடைய நுண்பொருள்களைத் தாங்கலாம். முதன்மை உரை அவற்றில் ஒன்றை முழுமையாகத் தீர்மானிக்காமல் வாசிக்கத்தக்க தமிழில் பதற்றத்தைப் பாதுகாக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: சாபத்தின் குறிப்புத்தன்மை
  choice: சாபத்திற்குக் கீழ்
  alternative: அந்தச் சாபத்திற்குக் கீழ்
  rationale: κατάραν என்பதற்கு கிரேக்கத்தில் உருபு இல்லாததால், குறிப்பிட்ட ஒரே சாபம் என்று தமிழ் உரையில் கூடுதலாக வரையறுக்கப்படவில்லை.
