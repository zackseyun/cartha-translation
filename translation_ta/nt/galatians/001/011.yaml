  text: Γνωρίζω ⸀γὰρ ὑμῖν, ἀδελφοί, τὸ εὐαγγέλιον τὸ εὐαγγελισθὲν ὑπ’ ἐμοῦ ὅτι οὐκ ἔστιν κατὰ ἄνθρωπον·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/011.yaml
  text: For I make known to you[a], brothers[b], that the gospel proclaimed by me is not according to man.
translation:
  language: ta
  text: 'ஏனெனில், சகோதரர்களே[a], நான் உங்களுக்குத் தெரிவிக்கிறேன்: நான் அறிவித்த நற்செய்தி மனிதரிடமிருந்து வந்தது அல்ல[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதர சகோதரிகளே” என்றும் பொருள்படலாம்; இங்குள்ள கிரேக்க ஆண்பால் பன்மைச் சொல் முழு விசுவாசக் குழுவையும் உள்ளடக்கி அழைக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: முறையாக, “மனிதனுக்கு ஏற்ப அல்ல”; இது “மனிதரிடமிருந்து வந்தது அல்ல” அல்லது “மனித அளவுகோலின்படி அமைந்தது அல்ல” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζω ὑμῖν
  choice: நான் உங்களுக்குத் தெரியப்படுத்துகிறேன்
  rationale: ‘தெரியப்படுத்துகிறேன்’ என்பது வினையின் அடிப்படைப் பொருளைப் பேணுவதோடு, முக்கியமான விளக்கத்தை அறிமுகப்படுத்தும் அதன் உரையாடல் செயலையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய உரைக்கு காரணம் அல்லது விளக்கம் அளிக்கும் இணைப்புச் சக்தியைப் பேணுகிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: கிரேக்கச் சொல்லின் ஆண்பால் பன்மை வடிவத்தை முதன்மை உரையில் பேணுகிறது; இது முழு விசுவாசக் குழுவையும் உள்ளடக்கக்கூடிய அழைப்பு என்பது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: εὐαγγέλιον
  choice: நற்செய்தி
  rationale: பவுலின் செய்தியைக் குறிக்கும் நிலைபெற்ற, தெளிவான தமிழ் வேதாகமச் சொல்.
- source_word: τὸ εὐαγγελισθὲν ὑπ’ ἐμοῦ
  choice: நான் அறிவித்த
  rationale: பவுல் நற்செய்தியைப் பொதுவாகப் பிரசித்தப்படுத்திய செயலை இயல்பான செயப்பாட்டு நடையில் தெளிவாகத் தருகிறது.
- source_word: κατὰ ἄνθρωπον
  choice: மனிதரிடமிருந்து வந்தது
  rationale: அடுத்த வசனத்தில் மனிதரிடமிருந்து பெறவில்லை, மனிதரால் கற்பிக்கப்படவில்லை என்று பவுல் விளக்குவதால், இங்கு மனித மூலத்தை மறுக்கும் பொருள் சூழலுக்கு மிகவும் பொருந்துகிறது; கிரேக்கத் தொடரின் பிற சாத்தியமான நுட்பம் அடிக்குறிப்பில் பேணப்படுகிறது.
theological_decisions:
- issue: κατὰ ἄνθρωπον என்பது மனித மூலத்தையா அல்லது மனித அளவுகோலையா குறிக்கிறது?
  choice: மனிதரிடமிருந்து வந்தது அல்ல
  alternative: 'மனித அளவுகோலின்படி அமைந்தது அல்ல / சொல்லுக்குச் சொல்: மனிதனுக்கு ஏற்ப அல்ல'
  rationale: கலாத்தியர் 1:12-ல் மனிதரிடமிருந்து பெறுதல் மற்றும் மனிதரால் கற்பிக்கப்படுதல் மறுக்கப்படுவதால், மூலத்தைக் குறிக்கும் வாசிப்பு உடனடிச் சூழலுக்கு ஏற்றது. ஆயினும் κατά என்ற முன்னிடைச்சொல் அளவுகோல் அல்லது தன்மையையும் உணர்த்தக்கூடியதால் அந்த நுட்பம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பானதும் கண்ணியமானதும் ஆன நடை பயன்படுத்தப்பட்டுள்ளது. ‘தெரியப்படுத்துகிறேன்’ மூல வினையின் வெளிப்படையான அறிவித்தல் நுணுக்கத்தைப் பேணுகிறது; ‘நான் அறிவித்த நற்செய்தி’ தேவையற்ற சொல் மீளுரைப்பைத் தவிர்த்து கிரேக்கப் பெயரெச்சத் தொடரின் பொருளைத் தெளிவாக வழங்குகிறது.
