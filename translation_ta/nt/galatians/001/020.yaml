base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/020.yaml
  text: What I am writing to you—behold[a], before God[b], I am not lying.
translation:
  language: ta
  text: நான் உங்களுக்கு எழுதுகிறவற்றைப் பற்றி—இதோ[a], கடவுளின் முன்னிலையில்[b]—நான் பொய் சொல்லவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இதோ’ என்பது கிரேக்கத்தில் உள்ள வலியுறுத்தும் சொல்லை மொழிபெயர்க்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘கடவுளுக்கு முன்பாக.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
  choice: எழுதுகிறவற்றை
  rationale: நபுஞ்சகப் பன்மை உறவுப்பெயரின் பொருளை இயல்பான நவீனத் தமிழில் ‘எழுதுகிறவற்றை’ எனக் கொடுக்கிறது.
- source_word: δὲ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது மென்மையான உரையாடல் நகர்வைக் குறிக்கிறது; முந்தைய சூழலிலிருந்து தமிழில் இயல்பாகத் தொடர்வதால் ‘இப்போது’ அல்லது ‘ஆனால்’ என்று வெளிப்படையாகச் சேர்ப்பது தேவையில்லை.
- source_word: γράφω ὑμῖν
  choice: நான் உங்களுக்கு எழுதுகிற
  rationale: நிகழ்கால வினையையும் கடிதத்தைப் பெறுபவர்களைக் குறிக்கும் வேற்றுமைப் பொருளையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: பவுலின் கூற்றுக்கு வலியுறுத்தலையும் வாசகரின் கவனத்தை ஈர்க்கும் தன்மையையும் தரும் துகளைக் காணாமல் விடாமல், தமிழில் சுருக்கமாகக் காட்டுகிறது.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: கடவுளுக்கு முன்பாக
  rationale: கடவுளின் முன்னிலையில் பொறுப்புடன் கூறும் ஆணைபோன்ற தீவிரத்தைப் பாதுகாக்கிறது; இதை வெளிப்படையான சத்தியப்பிரமாணமாக மிகைப்படுத்தவில்லை.
- source_word: ὅτι
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: பின்வரும் உண்மைக் கூற்றை அறிமுகப்படுத்தும் இதன் பணியை தமிழில் நிறுத்தக்குறியும் நேரடியான கூற்றும் இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: οὐ ψεύδομαι
  choice: நான் பொய் சொல்லவில்லை
  rationale: பவுலின் நேரடியான மறுப்பையும் நிகழ்காலப் பொருளையும் தெளிவான நவீனத் தமிழில் தருகிறது.
theological_decisions:
- issue: கடவுளை முன்னிறுத்தி பவுல் கூறும் கூற்றின் வலிமை
  choice: ‘கடவுளுக்கு முன்பாக ... நான் பொய் சொல்லவில்லை’ என்ற தீவிரமான பொறுப்புணர்வுள்ள உறுதிப்பாடாக மொழிபெயர்க்கப்பட்டது.
  alternative: வெறும் பொதுவான வலியுறுத்தலாக மொழிபெயர்த்தல் அல்லது வெளிப்படையான சத்தியப்பிரமாணமாக விரிவாக்குதல்.
  rationale: ἐνώπιον τοῦ θεοῦ என்பது கடவுளின் முன்னிலையில் உண்மை கூறுவதாகத் தெரிவிக்கிறது; ஆனால் மூலத்தில் இல்லாத முறையான சத்தியப்பிரமாணச் சொற்களைச் சேர்க்கக் கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையானதாயினும் கண்ணியமான நடையில் அமைக்கப்பட்டது. மூலத்தின் திடீர் வலியுறுத்தலையும் ஆணைபோன்ற அமைப்பையும் கோடுகளால் பாதுகாக்கிறது; ‘இதோ’ சற்றே உயர்ந்த நடையை உடையதாக இருந்தாலும் இங்கு மூலத்தின் ἰδοὺ என்பதைக் காட்ட வேண்டி வைக்கப்பட்டுள்ளது.
