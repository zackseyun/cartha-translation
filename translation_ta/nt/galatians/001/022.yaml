  text: ἤμην δὲ ἀγνοούμενος τῷ προσώπῳ ταῖς ἐκκλησίαις τῆς Ἰουδαίας ταῖς ἐν Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/022.yaml
  text: But I was personally unknown by face to the churches of Judea that are in Messiah[b][a],
translation:
  language: ta
  text: ஆனால், யூதேயாவில் மேசியாவுக்குள் இருக்கும்[b] திருச்சபைகளுக்கு நான் நேரில் அறிமுகமில்லாதவனாக இருந்தேன்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முகத்தால் அறியப்படாதவனாக இருந்தேன்” அல்லது “நேரில் அறியப்படாதவனாக இருந்தேன்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கிறிஸ்துவுக்குள் இருக்கும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய கூற்றுடன் உள்ள மென்மையான மாறுபாட்டை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἀγνοούμενος τῷ προσώπῳ
  choice: என்னை நேரில் அறிந்திருக்கவில்லை
  rationale: இந்தக் கிரேக்க மரபுத்தொடர், பவுலை முகத்தால் அல்லது நேரடியான சந்திப்பால் அவர்கள் அறிந்திருக்கவில்லை என்பதைக் குறிக்கிறது. செயப்பாட்டு அமைப்பை இயல்பான தமிழுக்காகச் செய்பாட்டு வாக்கியமாக மாற்றியுள்ளோம்.
- source_word: ἐκκλησίαις
  choice: திருச்சபைகள்
  rationale: இங்கு கிறிஸ்தவ விசுவாசிகளின் உள்ளூர் கூடுகைகளைக் குறிக்கிறது; நவீனத் தமிழில் தெளிவாகவும் மரியாதைக்குரிய நடையிலும் உள்ளது.
- source_word: Ἰουδαίας
  choice: யூதேயாவின்
  rationale: குறிப்பிடப்பட்ட நிலப்பகுதியின் வழக்கமான தமிழ்ப் பெயரைப் பயன்படுத்துகிறது.
- source_word: ἐν Χριστῷ
  choice: மேசியாவுக்குள் இருக்கும்
  rationale: ἐν என்பதன் உருவகத் தன்மையையும் Χριστός என்பதன் பட்டப்பெயர் வலிமையையும் காத்து, அந்தத் திருச்சபைகள் மேசியாவுடன் கொண்ட உறவை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἐν Χριστῷ என்பதிலுள்ள Χριστῷ-ஐ மொழிபெயர்த்தல்
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு Χριστός வெறும் பெயரைப்போல் அல்லாமல் ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற பட்டப்பெயரின் வலிமையுடன் உள்ளது. ஆகவே ‘மேசியா’ என்று தரப்பட்டுள்ளது; வழக்கமான ‘கிறிஸ்து’ மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἐν என்பதன் உறவுசார் உருவகம்
  choice: மேசியாவுக்குள் இருக்கும்
  alternative: மேசியாவோடு இணைந்திருக்கும்
  rationale: பவுலின் ‘மேசியாவுக்குள்’ என்ற இறையியல் உருவகத்தை விளக்கிச் சுருக்காமல் காக்கிறது. அதேவேளை இது இடஞ்சார் அர்த்தத்தில் மட்டும் புரிந்துகொள்ளப்பட வேண்டியதல்ல.
translation_notes:
  register: நடை நவீனமானதும் மரியாதைக்குரியதும் ஆகும். கிரேக்கத்தின் செயப்பாட்டு வடிவம் தமிழில் இயல்பாக இருக்கச் செய்பாட்டு வாக்கியமாக மாற்றப்பட்டுள்ளது; ‘நேரில்’ என்பது τῷ προσώπῳ என்ற மரபுத்தொடரின் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது. ‘மேசியாவுக்குள்’ என்ற பவுலின் உருவகம் திட்டமிட்டு அப்படியே காக்கப்பட்டுள்ளது.
