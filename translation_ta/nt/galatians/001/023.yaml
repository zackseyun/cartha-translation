source:
  edition: SBLGNT
  text: μόνον δὲ ἀκούοντες ἦσαν ὅτι Ὁ διώκων ἡμᾶς ποτε νῦν εὐαγγελίζεται τὴν πίστιν ἥν ποτε ἐπόρθει,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/023.yaml
  text: They were only hearing[a], “The one who formerly persecuted us now proclaims the faith he once tried to destroy.”
translation:
  language: ta
  text: 'அவர்கள் இதை மட்டுமே கேட்டுக்கொண்டே இருந்தார்கள்: “முன்பு நம்மைத் துன்புறுத்தியவன், தான் ஒருகாலத்தில் அழித்துக்கொண்டிருந்த விசுவாசத்தை[a] இப்போது பிரசங்கிக்கிறான்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நற்செய்தியை.” கிரேக்கத்தில் “விசுவாசத்தை”; இங்கு இது பவுல் முன்பு அழித்துக்கொண்டிருந்த கிறிஸ்தவச் செய்தி அல்லது விசுவாசத்தின் உள்ளடக்கத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνον
  choice: இதை மட்டுமே
  rationale: அந்தச் சபையாரின் அறிவு இந்தச் செய்தியுடன் மட்டுப்பட்டிருந்ததை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἀκούοντες ἦσαν
  choice: கேள்விப்பட்டுக்கொண்டிருந்தது
  rationale: தொடர்ந்து அல்லது மீண்டும் மீண்டும் செய்தி கேள்விப்பட்டதை உணர்த்தும் சுற்றுவழி இறந்தகால வினை அமைப்பைப் பிரதிபலிக்கிறது.
- source_word: ὁ διώκων ἡμᾶς ποτε
  choice: முன்பு நம்மைத் துன்புறுத்தியவன்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்கால வினையெச்சத்தையும் ποτέ குறிக்கும் முந்தைய காலத்தையும் தெளிவாகக் கொண்டுவருகிறது.
- source_word: νῦν εὐαγγελίζεται
  choice: இப்போது அறிவித்து வருகிறான்
  rationale: நற்செய்தியைப் பிரசங்கிக்கும் செயலைத் தொடர்ச்சியான நிகழ்காலத்தில் இயல்பாகச் சொல்கிறது; அதன் பொருளாக அடுத்து வரும் ‘விசுவாசம்’ என்பதைக் காக்கிறது.
- source_word: τὴν πίστιν
  choice: விசுவாசத்தை
  rationale: இங்கு தனிப்பட்ட நம்பிக்கைச் செயலைவிடக் கிறிஸ்தவ விசுவாசச் செய்தியையே குறிக்கும் புறவயப் பொருளைத் தக்கவைக்கிறது.
- source_word: ἣν ποτε ἐπόρθει
  choice: தான் ஒருகாலத்தில் அழிக்க முற்பட்ட
  rationale: πορθέω என்பதிலுள்ள கடுமையான அழிவு நோக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; அந்த விசுவாசம் உண்மையில் அழிக்கப்பட்டது என்ற தேவையற்ற முடிவைத் தவிர்க்கிறது.
theological_decisions:
- issue: τὴν πίστιν என்பதன் பொருள்
  choice: பவுல் இப்போது அறிவிக்கும் கிறிஸ்தவ விசுவாசச் செய்தி
  alternative: தனிப்பட்ட நம்பிக்கைச் செயல்; அல்லது நேரடியாக ‘நற்செய்தி’ என்று மொழிபெயர்த்தல்
  rationale: கட்டுரையுடனான πίστις, முன்பு தாக்கப்பட்டு இப்போது அறிவிக்கப்படும் விசுவாசச் செய்தி அல்லது விசுவாசத்தின் உள்ளடக்கத்தைக் குறிக்கிறது. ‘விசுவாசம்’ என்று முதன்மை உரையில் வைத்திருப்பது மூலச்சொல்லைத் தக்கவைக்கிறது; சூழல்சார் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. மேற்கோள் வடிவம் மூலத்தில் கேட்டறிந்த செய்தியைத் தெளிவாகக் காட்டுகிறது; ‘அறிவித்து வருகிறான்’ தொடரும் செயலை உணர்த்துகிறது.
