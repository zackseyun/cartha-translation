source:
  edition: SBLGNT
  text: οὐδὲ γὰρ ἐγὼ παρὰ ἀνθρώπου παρέλαβον αὐτό, ⸀οὔτε ἐδιδάχθην, ἀλλὰ δι’ ἀποκαλύψεως Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/012.yaml
  text: For I neither received it from a human source[a], nor was I taught it, but through a revelation of Jesus the Messiah.
translation:
  language: ta
  text: ஏனெனில், நான் அதை எந்த மனிதரிடமிருந்தும் பெறவும் இல்லை; அது எனக்குக் கற்பிக்கப்படவும் இல்லை. மாறாக, இயேசு மெசியாவின் வெளிப்பாட்டின் மூலம்[a] அதைப் பெற்றேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இயேசு மெசியாவின் வெளிப்பாடு’ என்பது இயேசு மெசியாவிடமிருந்து வந்த வெளிப்பாட்டையோ, அவரைப் பற்றிய வெளிப்பாட்டையோ குறிக்கலாம்.
    reason: மூலமொழியிலுள்ள உடைமை வேற்றுமை, வெளிப்பாட்டின் மூலத்தையோ அதன் பொருளையோ குறிக்கக்கூடிய உண்மையான இருபொருள் வாய்ப்பைக் கொண்டுள்ளது.
lexical_decisions:
- source_word: παρὰ ἀνθρώπου
  choice: மனிதர் ஒருவரிடமிருந்து
  rationale: ஒரு குறிப்பிட்ட நபரைக் குறிக்காமல், மனித வழிமுறையைப் பொதுவாகக் குறிக்கும் கிரேக்க ஒருமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: παρέλαβον
  choice: பெற்றுக்கொள்ளவும் இல்லை
  rationale: போதனை அல்லது மரபு ஒருவரிடம் ஒப்படைக்கப்பட்டு அவர் அதைப் பெறுவதைக் குறிக்கும் வினையின் பொருளைத் தக்கவைக்கிறது.
- source_word: ἐδιδάχθην
  choice: அது எனக்குக் கற்றுக்கொடுக்கப்படவும் இல்லை
  rationale: கிரேக்கச் செயப்பாட்டு வடிவத்தையும், மனித போதனையைப் பவுல் மறுக்கும் கருத்தையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: δι’ ἀποκαλύψεως
  choice: வெளிப்பாட்டின் மூலமாகவே
  rationale: διά இங்கு வழிமுறை அல்லது ஊடகத்தைக் குறிக்கிறது; ‘மூலமாக’ என்பது அதை இயல்பான தமிழில் தருகிறது. ‘வே’ மனித வழிக்கும் வெளிப்பாட்டுக்கும் உள்ள வலுவான எதிர்மறை வேறுபாட்டை வெளிப்படுத்துகிறது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியாவின்
  rationale: Χριστός என்பதைக் பட்டப்பெயரான ‘மெசியா’ என்று தருகிறது. உடைமை வேற்றுமை வடிவம், வெளிப்பாடு இயேசு மெசியாவிடமிருந்து வந்ததா அல்லது அவரைப் பற்றியதா என்ற மூலமொழியின் உண்மையான இருபொருள் வாய்ப்பை முதன்மை உரையில் திறந்தவாறே வைக்கிறது.
theological_decisions:
- issue: ἀποκαλύψεως Ἰησοῦ Χριστοῦ என்பதில் உள்ள உடைமை வேற்றுமையின் பொருள்
  choice: ‘இயேசு மெசியாவின் வெளிப்பாடு’ என்று இருபொருள் வாய்ப்புடன் தரப்பட்டது
  alternative: ‘இயேசு மெசியாவிடமிருந்து வந்த வெளிப்பாடு’ அல்லது ‘இயேசு மெசியாவைப் பற்றிய வெளிப்பாடு’
  rationale: உடனடி சூழல் வெளிப்பாடு இயேசு மெசியாவிடமிருந்து வந்தது என்ற பொருளை ஆதரித்தாலும், கிரேக்கத் தொடர் அவரைப் பற்றிய வெளிப்பாடு என்ற பொருளையும் இலக்கணரீதியாக அனுமதிக்கிறது. ஆகவே முதன்மை உரை அந்த இறையியல் அழுத்தத்தைத் தீர்மானித்து விடாமல் பாதுகாக்கிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. முதல் இரண்டு மறுப்புகளின் இணை அமைப்பும், ‘மாறாக’ என்பதன் எதிர்மறைத் திருப்பமும் பாதுகாக்கப்பட்டுள்ளன; கடைசி பகுதியில் தமிழில் இயல்பாக அமைய மறைந்துள்ள ‘பெற்றேன்’ வினை வெளிப்படையாக மீண்டும் சொல்லப்பட்டுள்ளது.
