- from: யூதமதத்தில் நான் முன்பு வாழ்ந்த விதத்தைப் பற்றி நீங்கள் கேள்விப்பட்டிருக்கிறீர்கள். அதாவது, நான் அளவுக்கு மீறி கடவுளுடைய திருச்சபையைத் துன்புறுத்தி, அதை அழிக்க முயன்றுகொண்டிருந்தேன்.[a]
  to: ஏனெனில், யூதமதத்தில் நான் முன்பு கொண்டிருந்த வாழ்க்கை முறையைப் பற்றி நீங்கள் கேள்விப்பட்டிருக்கிறீர்கள்; நான் அளவுக்கு மீறி கடவுளுடைய திருச்சபையைத் துன்புறுத்திக்கொண்டும் அதைப் பாழாக்கிக்கொண்டும் இருந்தேன்.[a]
  rationale: ‘ஏனெனில்’ γάρ-இன் விளக்கத் தொடர்பை வெளிப்படுத்துகிறது. ‘நான் முன்பு கொண்டிருந்த வாழ்க்கை முறை’ ἀναστροφήν ποτε-இன் விரிவான பொருளை இயல்பாகக் காக்கிறது. இரண்டு தொடர்நிலைச் செயல்களான ἐδίωκον மற்றும் ἐπόρθουν ஆகியவற்றை ‘துன்புறுத்திக்கொண்டும் ... பாழாக்கிக்கொண்டும் இருந்தேன்’ என இணையாக மொழிபெயர்த்துள்ளோம். முக்கிய உரையில் ‘பாழாக்கிக்கொண்டிருந்தேன்’ என்பதை வைத்ததால் ἐπόρθουν-இன் வலுவான, நேரடியான பொருள் காக்கப்படுகிறது; மாற்று விளக்கங்கள் அடிக்குறிப்பில் வழங்கப்படுகின்றன.
