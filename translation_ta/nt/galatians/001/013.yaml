  text: Ἠκούσατε γὰρ τὴν ἐμὴν ἀναστροφήν ποτε ἐν τῷ Ἰουδαϊσμῷ, ὅτι καθ’ ὑπερβολὴν ἐδίωκον τὴν ἐκκλησίαν τοῦ θεοῦ καὶ ἐπόρθουν αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/013.yaml
  text: For you have heard of my former way of life in Judaism[d][c][b][a], that I was persecuting the church of God beyond measure and was ravaging it.
translation:
  language: ta
  text: ஏனெனில், யூதமதத்தில் நான் முன்பு கொண்டிருந்த வாழ்க்கை முறையைப் பற்றி நீங்கள் கேள்விப்பட்டிருக்கிறீர்கள்; நான் அளவுக்கு மீறி கடவுளுடைய திருச்சபையைத் துன்புறுத்திக்கொண்டும் அதைப் பாழாக்கிக்கொண்டும் இருந்தேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதை அழித்துக்கொண்டிருந்தேன்” அல்லது “அதை அழிக்க முயன்றுகொண்டிருந்தேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστροφήν ποτε
  choice: நான் முன்பு வாழ்ந்த விதம்
  rationale: ἀναστροφή என்பது ஒருவரின் நடத்தை மட்டும் அல்லாமல் அவரது வாழ்க்கை முறையையும் குறிக்கிறது; ποτε முன்னைய காலத்தைக் குறிக்கிறது. இவ்விரண்டையும் இயல்பான நவீன தமிழில் இச்சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: Ἰουδαϊσμῷ
  choice: யூதமதத்தில்
  rationale: இங்கு பவுலின் முன்னைய யூத சமய அடையாளம், நம்பிக்கை, நடைமுறை ஆகியவற்றின் சூழலைக் குறிக்கிறது. ‘யூதமதம்’ என்பது தெளிவான, நிலைபெற்ற தமிழ் வழக்கு.
- source_word: καθ’ ὑπερβολὴν
  choice: அளவுக்கு மீறி
  rationale: துன்புறுத்தலின் அசாதாரண தீவிரத்தை இயல்பான தமிழில் வலியுறுத்துகிறது.
- source_word: ἐδίωκον
  choice: துன்புறுத்தி
  rationale: ἐπόρθουν என்பதுடன் ஒரே தொடர்நிலை வினையமைப்பில் இணைந்து, கடந்த காலத்தில் நீடித்த செயலை ‘முயன்றுகொண்டிருந்தேன்’ என்ற முடிவுற்ற வினையுடன் வெளிப்படுத்துகிறது.
- source_word: ἐκκλησίαν τοῦ θεοῦ
  choice: கடவுளுடைய திருச்சபை
  rationale: இங்கு கடவுளுக்குரிய மெசியாவைப் பின்பற்றும் சமூகத்தைக் குறிக்கிறது; ‘திருச்சபை’ தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் இயல்பாகவும் அடையாளம் காணத்தக்கதாகவும் உள்ளது.
- source_word: ἐπόρθουν
  choice: அதை அழிக்க முயன்றுகொண்டிருந்தேன்
  rationale: இந்த வினை நாசப்படுத்துதல் அல்லது அழித்தொழித்தல் என்ற வலுவான பொருளைக் கொண்டது. இறந்தகாலத் தொடர்நிலையும் செயல் நிறைவேறியதா என்ற திறந்த தன்மையும் தமிழில் ‘அழிக்க முயன்றுகொண்டிருந்தேன்’ என வெளிப்படுகின்றன.
theological_decisions:
- issue: ἐκκλησία என்பதை ‘திருச்சபை’ அல்லது ‘சபை’ என்று மொழிபெயர்த்தல்
  choice: கடவுளுடைய திருச்சபை
  alternative: கடவுளுடைய சபை
  rationale: குறிப்பிட்ட மெசியா விசுவாசிகளின் சமூகத்தைத் தெளிவாகச் சுட்ட ‘திருச்சபை’ உதவுகிறது; கூடுதல் திருச்சபைப் பிரிவுசார் கருத்தைச் சேர்க்கவில்லை.
- issue: ἐπόρθουν செயல் நிறைவேறிய அழிவையா அல்லது அழிக்கும் முயற்சியையா குறிக்கிறது
  choice: அதை அழிக்க முயன்றுகொண்டிருந்தேன்
  alternative: அதைப் பாழாக்கிக்கொண்டிருந்தேன்
  rationale: கிரேக்க இறந்தகாலத் தொடர்நிலை வினையின் நீடித்த செயலைப் பாதுகாத்து, திருச்சபை உண்மையில் முற்றாக அழிக்கப்பட்டதாகத் தவறாக உணர்த்துவதைத் தவிர்க்கிறது. வினையின் வலிமை ‘அழிக்க’ என்பதில் நிலைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. கிரேக்கத்தின் γὰρ முந்தைய வசனத்துக்கான விளக்கத் தொடர்பைக் காட்டுகிறது; தனிவசனத் தமிழில் தேவையற்ற கடினத்தன்மையைத் தவிர்க்க அது வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை. மூலத்தின் தொடர்ச்சியான கடந்தகாலச் செயல் ‘முயன்றுகொண்டிருந்தேன்’ மூலம் காக்கப்பட்டுள்ளது.
