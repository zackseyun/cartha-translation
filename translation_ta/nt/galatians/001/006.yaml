lexical_decisions:
- source_word: Θαυμάζω
  choice: நான் திகைக்கிறேன்
  rationale: பவுலின் வியப்போடு கலந்த அதிர்ச்சியையும் கண்டனத் தொனியையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὕτως ταχέως
  choice: இவ்வளவு விரைவாக
  rationale: அவர்கள் மாறிச் செல்லும் வேகம் வியப்புக்குரியது என்ற கிரேக்க வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: μετατίθεσθε
  choice: திரும்பிக்கொண்டிருக்கிறீர்கள்
  rationale: நிகழ்ந்துமுடிந்த மாற்றமாக அல்லாமல் நடந்துகொண்டிருக்கும் விலகலை நிகழ்கால வடிவில் காட்டுகிறது; ἀπό மற்றும் εἰς ஆகியவற்றுடன் சேர்ந்து ஒருவரைவிட்டு வேறொன்றை நோக்கிச் செல்லும் இயக்கத்தையும் வெளிப்படுத்துகிறது.
- source_word: τοῦ καλέσαντος ὑμᾶς
  choice: உங்களை அழைத்தவர்
  rationale: அழைத்தவர் யார் என்பதை மூலவாக்கியம் வெளிப்படையாகக் குறிப்பிடாததால், அதைத் தமிழிலும் குறிப்பிட்டுச் சேர்க்காமல் பாதுகாக்கிறது.
- source_word: ἐν χάριτι Χριστοῦ
  choice: மேசியாவின் அருளில்
  rationale: ἐν என்பதன் பொருளை ஒரு வரம்பு அல்லது சூழல் எனத் திறந்தவாறு வைத்திருக்கிறது; அது கருவியையும் குறிக்கக்கூடும் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: Χριστοῦ
  choice: மேசியாவின்
  rationale: Χριστός இங்கு பட்டமாகச் செயல்படுவதால் அதன் பட்டப் பொருளை வெளிப்படையாகக் காட்டுகிறது.
- source_word: εἰς ἕτερον εὐαγγέλιον
  choice: வேறொரு நற்செய்திக்கு
  rationale: εἰς குறிக்கும் நோக்கிய இயக்கத்தையும் ἕτερον குறிக்கும் வேறுபாட்டையும் இயல்பான தமிழில் தக்கவைக்கிறது.
theological_decisions:
- issue: “உங்களை அழைத்தவர்” என்பவரின் அடையாளம்
  choice: அழைத்தவர் யார் என்று முதன்மை உரையில் வெளிப்படையாகச் சேர்க்கப்படவில்லை.
  alternative: “உங்களை அழைத்த கடவுள்” அல்லது “உங்களை அழைத்த மேசியா”
  rationale: உடனடியான கிரேக்க வாக்கியத்தில் எழுவாய் மறைமுகமாகவே உள்ளது; இறையியல் பதற்றத்தை மொழிபெயர்ப்பு தானாகத் தீர்மானிக்கவில்லை.
- issue: ἐν χάριτι என்பதில் ἐν-இன் நுண்பொருள்
  choice: “அருளில்”
  alternative: “அருளால்”
  rationale: இது அருளின் வரம்பையோ சூழலையோ அல்லது அருளை வழிமுறையாகவோ குறிக்கலாம்; முதன்மை உரை ஒப்பீட்டளவில் வடிவநெருக்கமாக இருந்து மாற்றுப் பொருளை அடிக்குறிப்பில் வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டுள்ளது. “திரும்பிக்கொண்டிருக்கிறீர்களே” என்பது நடந்துகொண்டிருக்கும் விலகலையும் பவுலின் அதிர்ச்சியையும் இயல்பாகச் சுமக்கிறது; “நற்செய்தி” என்பது εὐαγγέλιον என்பதற்கான தெளிவான தமிழ்ச் சொல்.
