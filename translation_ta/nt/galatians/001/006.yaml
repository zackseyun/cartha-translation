base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/006.yaml
  text: I am astonished that you are so quickly deserting the one who called you in the grace of Messiah for a different gospel[c][b][a],
translation:
  language: ta
  text: மேசியாவின்[b] அருளில்[a] உங்களை அழைத்தவரை விட்டு, இவ்வளவு விரைவாக வேறொரு நற்செய்திக்குத்[c] மாறிக்கொண்டிருக்கிறீர்களே என்று நான் திகைக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேசியாவின் அருளால்.” ἐν என்னும் முன்னிடைச்சொல் சூழலையோ வழிமுறையையோ குறிக்கலாம்.
