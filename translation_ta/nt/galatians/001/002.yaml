  text: 'மேலும், என்னுடன் இருக்கும் சகோதரர்கள் அனைவரும்[a], கலாத்தியாவிலுள்ள திருச்சபைகளுக்கு:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதரர்களும் சகோதரிகளும்” என்றும் பொருள்படலாம். கிரேக்க உரையில் “சகோதரர்கள்” என்று இருந்தாலும், அது ஆண்களையும் பெண்களையும் உள்ளடக்கிய உடன் விசுவாசிகளைக் குறிக்கக்கூடும்.
