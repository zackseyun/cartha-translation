lexical_decisions:
- source_word: καὶ
  choice: மேலும்
  rationale: முந்தைய வசனத்தில் பவுலுடன் தொடங்கிய அனுப்புநர் பட்டியலில் மற்றவர்களையும் இணைக்கும் தொடர்ச்சியை இயல்பான தமிழில் காட்டுகிறது.
- source_word: οἱ σὺν ἐμοὶ πάντες ἀδελφοί
  choice: என்னுடன் இருக்கும் சகோதரர்கள் அனைவரும்
  rationale: சொற்றொடரின் வலியுறுத்தலையும், பவுலுடன் அப்போது இருந்த உடன்விசுவாசிகளைக் குறிக்கும் பொருளையும் காக்கிறது. ἀδελφοί இலக்கணப்படி ஆண்பால் பன்மை; இருபாலரையும் உள்ளடக்கக்கூடிய சாத்தியம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἐκκλησίαις
  choice: திருச்சபைகளுக்கு
  rationale: பவுலின் கடித முகப்புகளில் விசுவாசிகளின் உள்ளூர் கூடுகைகளைக் குறிக்கத் தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் இயல்பாகவும் பரவலாகவும் உள்ள சொல்.
- source_word: τῆς Γαλατίας
  choice: கலாத்தியாவிலுள்ள
  rationale: கிரேக்க உரையின் உறவுநிலை அமைப்பை இயல்பான தமிழில் இடத்தொடராக வழங்கி, கலாத்தியாவைச் சேர்ந்த சபைகள் என்ற பொருளைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: ἀδελφοί என்பதன் பாலின உள்ளடக்கம்
  choice: முதன்மை உரையில் “சகோதரர்கள்”
  alternative: “சகோதர சகோதரிகள்”
  rationale: கிரேக்கச் சொல் இலக்கணப்படி ஆண்பால் பன்மையாக இருப்பதால் அதன் வடிவம் முதன்மை உரையில் காக்கப்படுகிறது; அதேவேளை, உடன்விசுவாசிகள் என்ற கூட்டுப் பயன்பாட்டில் பெண்களும் அடங்கியிருக்கலாம் என்பதால் அந்த உண்மையான பொருள் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட கடித முகப்பு நடை பயன்படுத்தப்பட்டுள்ளது. இது முந்தைய வசனத்தின் வாக்கியத் தொடர்ச்சி என்பதைக் காட்ட “மேலும்” எனத் தொடங்கி, மூலத்தின் நிறுத்தக்குறி அமைப்புக்கு ஏற்ப இறுதியில் முக்காற்புள்ளி வைக்கப்பட்டுள்ளது.
