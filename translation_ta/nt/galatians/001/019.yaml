base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/019.yaml
  text: But I saw none of the other apostles except James[a], the Lord’s brother.
translation:
  language: ta
  text: ஆனால், அப்போஸ்தலர்களில் ஆண்டவரின் சகோதரனான யாக்கோபைத் தவிர வேறு யாரையும் நான் காணவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερον
  choice: வேறு யாரையும்
  rationale: τῶν ἀποστόλων என்ற பகுதிப்பொருள் அமைப்புடன், அப்போஸ்தலர்களில் ‘வேறொருவரை’ குறிக்கிறது; தமிழில் எதிர்மறை வாக்கியத்தில் ‘வேறு யாரையும்’ இயல்பாக உள்ளது.
- source_word: δέ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தோடு உள்ள மென்மையான முரண்பாட்டை அல்லது தொடர்ச்சியான திருப்பத்தை வெளிப்படுத்துகிறது.
- source_word: ἀποστόλων
  choice: அப்போஸ்தலர்களில்
  rationale: இங்கு அங்கீகரிக்கப்பட்ட அப்போஸ்தலர் வட்டத்தைக் குறிக்கும் நிலைபெற்ற தமிழ்ச் சொல் பயன்படுத்தப்பட்டுள்ளது; ‘-இல்’ என்பது கிரேக்க பகுதிப்பொருள் அமைப்பைப் பாதுகாக்கிறது.
- source_word: οὐκ εἶδον
  choice: நான் காணவில்லை
  rationale: இறந்தகால மறுப்பை நேரடியாகவும் இயல்பான தமிழிலும் வழங்குகிறது.
- source_word: εἰ μὴ
  choice: தவிர
  rationale: இங்கு நிபந்தனையாக அல்லாமல் விதிவிலக்கை அறிமுகப்படுத்தும் சொற்றொடராகச் செயல்படுகிறது.
- source_word: Ἰάκωβον
  choice: யாக்கோபை
  rationale: Ἰάκωβος என்ற பெயரின் நிலைபெற்ற தமிழ் வடிவம்; வினையின் நேர்செயப்படுபொருளாக வேற்றுமை உருபு சேர்க்கப்பட்டுள்ளது.
- source_word: ἀδελφὸν
  choice: சகோதரனான
  rationale: சொல்லின் நேரடியான குடும்ப உறவுப் பொருளான ‘சகோதரன்’ பாதுகாக்கப்படுகிறது; ‘உறவினர்’ போன்ற விரிவான பொருள் இங்கு தேவையின்றி சேர்க்கப்படவில்லை.
- source_word: τοῦ κυρίου
  choice: ஆண்டவரின்
  rationale: κύριος என்பதன் பட்டப்பெயர்ப் பொருளை ‘ஆண்டவர்’ என்று வழங்கி, கிரேக்க உடைமைத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: இந்த வாக்கிய அமைப்பு யாக்கோபை ‘அப்போஸ்தலர்களில்’ ஒருவராகக் கணக்கிடுகிறதா?
  choice: முதன்மை உரை, யாக்கோபை மற்ற அப்போஸ்தலர்களுக்குள் வரும் விதிவிலக்காகக் காட்டும் இயல்பான கிரேக்க தொடரமைப்பைப் பாதுகாக்கிறது.
  alternative: பேதுருவைத் தவிர வேறு எந்த அப்போஸ்தலரையும் பவுல் காணவில்லை; அத்துடன் யாக்கோபைக் கண்டார், ஆனால் யாக்கோபை அப்போஸ்தலராக அவசியம் வகைப்படுத்தவில்லை என்று சிலர் புரிந்துகொள்கிறார்கள்.
  rationale: εἰ μὴ என்பது இயல்பாக ‘மற்ற அப்போஸ்தலர்களில் வேறு யாரையும் காணவில்லை’ என்பதற்கான விதிவிலக்கை அறிமுகப்படுத்துகிறது. இருப்பினும், யாக்கோபின் அப்போஸ்தலர் நிலையைப் பற்றிய வேறு தொடரமைப்புப் புரிதல் சாத்தியமுள்ளதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான வேதாகம நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அப்போஸ்தலர்’ மற்றும் ‘ஆண்டவர்’ என்ற பரவலாக அறியப்பட்ட சொற்கள் பயன்படுத்தப்பட்டுள்ளன. கிரேக்கத்தின் பகுதிப்பொருள் அமைப்பும், யாக்கோபின் நிலையைச் சுற்றியுள்ள உண்மையான தொடரமைப்பு ஐயமும் முறையே முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளன.
