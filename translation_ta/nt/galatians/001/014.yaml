  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ προέκοπτον ἐν τῷ Ἰουδαϊσμῷ ὑπὲρ πολλοὺς συνηλικιώτας ἐν τῷ γένει μου, περισσοτέρως ζηλωτὴς ὑπάρχων τῶν πατρικῶν μου παραδόσεων.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/014.yaml
  text: And I was advancing in Judaism beyond many of my contemporaries among my people[b][a], being far more zealous for the traditions of my fathers.
translation:
  language: ta
  text: மேலும், என் சொந்த மக்களிடையே என் வயதொத்த பலரைவிட யூத சமயத்தில்[a] நான் முன்னேறிக்கொண்டிருந்தேன்; என் முன்னோர்களிடமிருந்து வந்த என் மரபுகளின்மேல் மிக அதிக ஆர்வம் கொண்டவனாக இருந்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யூத சமயம்” என்பதற்கான கிரேக்கச் சொல், இச்சூழலில் “யூத மதம்” அல்லது “யூத வாழ்க்கைமுறை” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: προέκοπτον
  choice: முன்னேறிக்கொண்டிருந்தேன்
  rationale: முற்றுப்பெறாத இறந்தகால வினையின் தொடர்ச்சியான முன்னேற்றத்தைக் காட்டுகிறது; ஒப்பீட்டுச் சூழலையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: Ἰουδαϊσμῷ
  choice: யூத சமயத்தில்
  rationale: இங்கு யூத மதநம்பிக்கை, நடைமுறை, வாழ்க்கைமுறை ஆகியவற்றை உள்ளடக்கக்கூடிய சொல்லை நவீன தமிழில் தெளிவாகக் காட்டுகிறது; அதன் விரிவான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ὑπὲρ πολλοὺς συνηλικιώτας
  choice: என் வயதையொத்த பலரைவிட
  rationale: ὑπέρ என்பதன் ஒப்பீட்டுப் பொருளையும், συνηλικιώτας என்பதன் ஒரே வயதினரைச் சுட்டும் பொருளையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: ἐν τῷ γένει μου
  choice: என் சொந்த மக்களிடையே
  rationale: γένος குறிக்கும் இன-மக்கள் சார்ந்த உறவை, நவீன தமிழில் தவறாகப் புரிந்துகொள்ளப்படக்கூடிய ‘இனம்’ என்ற சொல்லைத் தவிர்த்து இயல்பாகத் தெரிவிக்கிறது.
- source_word: περισσοτέρως
  choice: மிகுந்த
  rationale: பவுலின் வைராக்கியத்தின் தீவிரத்தை இயல்பான தமிழில் வலுப்படுத்துகிறது; முந்தைய ஒப்பீட்டின் பின்னணியில் அதன் அதிகப்படியான தன்மையும் தெளிவாகிறது.
- source_word: ζηλωτὴς ὑπάρχων
  choice: வைராக்கியம் கொண்டிருந்தேன்
  rationale: அரசியல் சார்ந்த ‘தீவிரவாதி’ போன்ற தவறான உட்பொருளைத் தவிர்த்து, மரபுகள்மீது கொண்ட தீவிர பற்றை dignified modern Tamil-இல் தெரிவிக்கிறது.
- source_word: τῶν πατρικῶν μου παραδόσεων
  choice: என் முன்னோர்களின் மரபுகளுக்காக
  rationale: πατρικός என்பதன் மூதாதையரிடமிருந்து வந்தது என்ற பொருளையும், παραδόσεις என்பதன் பரம்பரை மரபுகள் என்ற பொருளையும் நெருக்கமாகப் பாதுகாக்கிறது.
