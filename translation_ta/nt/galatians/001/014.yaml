translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தொடர்ச்சியான இறந்தகால முன்னேற்றமும், வயதொத்தவர்களுடனான ஒப்பீடும், முன்னோர் மரபுகள்மீதான தீவிரப் பற்றும் பாதுகாக்கப்பட்டுள்ளன.
