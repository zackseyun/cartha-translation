source:
  edition: SBLGNT
  text: ὡς προειρήκαμεν, καὶ ἄρτι πάλιν λέγω, εἴ τις ὑμᾶς εὐαγγελίζεται παρ’ ὃ παρελάβετε, ἀνάθεμα ἔστω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/009.yaml
  text: 'As we have said before[a], so now I say again: if anyone is preaching a gospel to you contrary to what you received[b], let him be accursed.'
translation:
  language: ta
  text: 'நாங்கள் முன்பே சொன்னதுபோல, இப்போதும் நான் மீண்டும் சொல்கிறேன்: நீங்கள் பெற்றுக்கொண்டதற்கு மாறாக[a] யாராவது உங்களுக்கு நற்செய்தி அறிவித்தால், அவர் சாபத்துக்குள்ளாகட்டும்.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நீங்கள் பெற்றுக்கொண்டதற்கு அப்பாற்பட்டு” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடர் பெற்றுக்கொண்ட செய்தியிலிருந்து விலகுவதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: '“அவர் சபிக்கப்பட்டவராக இருக்கட்டும்” என்றும் மொழிபெயர்க்கலாம்; கிரேக்கத்தில்: ἀνάθεμα ἔστω.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς προειρήκαμεν
  choice: நாங்கள் முன்பே சொன்னதுபோல
  rationale: முன்னரே கூறப்பட்டதையும் அது இப்போது பொருந்துவதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἄρτι πάλιν λέγω
  choice: இப்போதும் மறுபடியும் சொல்கிறேன்
  rationale: ἄρτι என்பதன் நிகழ்கால வலியுறுத்தலையும் πάλιν என்பதன் மறுபடியும் கூறும் பொருளையும் பாதுகாக்கிறது.
- source_word: εἴ τις ὑμᾶς εὐαγγελίζεται
  choice: யாராவது உங்களுக்கு நற்செய்தியாக அறிவித்தால்
  rationale: εὐαγγελίζομαι என்பதன் அறிவித்தல் சார்ந்த வினை வலிமையைத் தக்கவைத்து, சூழலின் முரண்பாட்டையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: παρ’ ὃ
  choice: மாறான ஒன்றை
  rationale: பெற்ற செய்தியிலிருந்து விலகி அதற்கு முரண்படும் பொருளை இச்சூழலில் சுருக்கமாக வெளிப்படுத்துகிறது; ‘அப்பாற்பட்ட’ என்ற சாத்தியமான நுண்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: παρελάβετε
  choice: நீங்கள் பெற்றுக்கொண்ட
  rationale: ஒரு செய்தி அல்லது மரபைப் பெற்றுக்கொள்ளுதல் என்ற παραλαμβάνω என்பதன் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἀνάθεμα ἔστω
  choice: அவர் சாபத்துக்குள்ளாகட்டும்
  rationale: தெய்வீகச் சாபத்தின் கடுமையான நீதித்தீர்ப்பு வலிமையைப் பாதுகாக்கிறது; மூலத்தில் இல்லாத கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: ἀνάθεμα ἔστω என்பதில் பவுலின் கண்டனத்தின் வலிமை
  choice: அவர் சாபத்துக்குள்ளாகட்டும்
  alternative: அவர் சபிக்கப்பட்டவராக இருக்கட்டும்
  rationale: கிரேக்கச் சொற்றொடரின் கடுமையை இயல்பான நவீன தமிழில் தருகிறது; சாபத்தின் செயல்பாட்டைப் பற்றி மூலவசனம் குறிப்பிடாத விவரத்தைச் சேர்க்கவில்லை.
- issue: παρ’ ὃ குறிக்கும் உறவு
  choice: நீங்கள் பெற்றுக்கொண்ட நற்செய்திக்கு மாறான ஒன்றை
  alternative: நீங்கள் பெற்றுக்கொண்டதற்கு அப்பாற்பட்ட ஒன்றை
  rationale: இச்சூழலில் ஏற்கெனவே பெற்ற நற்செய்தியிலிருந்து விலகும் முரண்பாட்டை முதன்மைப்படுத்துகிறது; உண்மையான சொற்பொருள் நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நற்செய்தியாக அறிவித்தால்’ என்பது மூலத்தின் வினைச்சொல் வடிவத்தைப் பாதுகாக்கிறது; ‘சாபத்துக்குள்ளாகட்டும்’ என்பது வசனத்தின் கடுமையைத் தணிக்காமல் இயல்பாக வழங்குகிறது.
