  source_fidelity: திருத்தம் தேவை. மூலத்தில் ὡς προειρήκαμεν என்பதற்கு பன்மை ‘நாங்கள் சொன்னது’வும், ἄρτι πάλιν λέγω என்பதற்கு ஒருமை ‘நான் மீண்டும் சொல்கிறேன்’வும் உள்ளன; இது திருத்தப்பட்ட உரையில் தெளிவாகப் பாதுகாக்கப்படுகிறது. παρ’ ὃ என்பது ‘நீங்கள் பெற்றுக்கொண்ட நற்செய்திக்கு’ மட்டும் அல்ல, இலக்கணப்படி ‘நீங்கள் பெற்றுக்கொண்டதற்கு’ என்பதைக் குறிக்கிறது; நற்செய்தி சூழலால் புரிகிறது. அடிக்குறிப்பு மாற்றுவாசிப்புக்குரிய இடத்திலேயே இணைக்கப்பட்டுள்ளது.
  naturalness: வரைவு பொதுவாக இயல்பானது. ஆனால் ‘நீங்கள் பெற்றுக்கொண்ட நற்செய்திக்கு மாறான ஒன்றை ... நற்செய்தியாக அறிவித்தால்’ என்பது ஒரே கருத்தைச் சற்றே மீளச்சொல்கிறது. ‘நீங்கள் பெற்றுக்கொண்டதற்கு மாறாக யாராவது உங்களுக்கு நற்செய்தி அறிவித்தால்’ என்பது நவீன நிலையான தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
  terminology: ‘நற்செய்தி’ εὐαγγελίζεται-இன் கலாத்தியர் சூழலுக்கேற்ற சொல்லாகும். ‘சாபத்துக்குள்ளாகட்டும்’ ἀνάθεμα ἔστω-வின் கடுமையான வேண்டுதல்/தீர்ப்புவகை வலிமையை, மூலத்தில் வெளிப்படையாக இல்லாத கூடுதல் இறையியல் விளக்கமின்றி தருகிறது.
