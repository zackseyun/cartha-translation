  text: Ἔπειτα μετὰ ⸂ἔτη τρία⸃ ἀνῆλθον εἰς Ἱεροσόλυμα ἱστορῆσαι ⸀Κηφᾶν, καὶ ἐπέμεινα πρὸς αὐτὸν ἡμέρας δεκαπέντε·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/018.yaml
  text: Then after three years I went up to Jerusalem to visit Cephas[b][a], and I stayed with him fifteen days.
translation:
  language: ta
  text: பின்பு, மூன்று ஆண்டுகளுக்குப் பிறகு, கேபாவை[a] சந்திப்பதற்காக[b] எருசலேமுக்குப் போனேன்; அவருடன் பதினைந்து நாட்கள் தங்கினேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கேபா என்பது பேதுருவின் அரமேயப் பெயர்.
    reason: alternative_reading
  - marker: b
    text: “கேபாவை நேரில் சந்தித்து அவரைப் பற்றி அறிந்துகொள்வதற்காக” என்றும் மொழிபெயர்க்கலாம்; கிரேக்க வினைச்சொல், ஒருவரை நேரில் சந்திப்பதன் மூலம் அவரைப் பற்றித் தெரிந்துகொள்வதையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔπειτα
  choice: பின்பு
  rationale: பவுல் விவரிக்கும் நிகழ்வுகளின் அடுத்த கட்டத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: μετὰ ἔτη τρία
  choice: மூன்று ஆண்டுகளுக்குப் பிறகு
  rationale: கிரேக்கத்தின் காலக் குறிப்பைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἀνῆλθον
  choice: போனேன்
  rationale: எருசலேமுக்குச் செல்வதை கிரேக்கம் ‘மேலே சென்றேன்’ என்ற வழக்கில் கூறினாலும், தமிழில் ‘போனேன்’ என்பது இயல்பானது; பயணத்தின் இலக்கு அடுத்த சொற்றொடரில் தெளிவாகிறது.
- source_word: εἰς Ἱεροσόλυμα
  choice: எருசலேமுக்கு
  rationale: இடப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பையும் இலக்கைக் குறிக்கும் வேற்றுமையையும் பயன்படுத்துகிறது.
- source_word: ἱστορῆσαι
  choice: நேரில் சந்தித்து அறிமுகமாகிக்கொள்வதற்காக
  rationale: இது வெறும் சாதாரண வருகையைவிட, ஒருவரைத் தனிப்பட்ட முறையில் சந்தித்து அறிமுகம் பெறும் பொருளைக் கொண்ட அரிய வினைச்சொல். அதேவேளை ‘சந்திப்பதற்காக’ என்ற சுருக்கமான பொருளுக்கும் இடமிருப்பதால் அடிக்குறிப்பு தரப்படுகிறது.
- source_word: Κηφᾶν
  choice: கேபாவை
  rationale: பவுல் இங்கு பயன்படுத்தும் அரமேயப் பெயரையே ஒலிபெயர்த்து, ‘பேதுரு’ என்று ஒருமைப்படுத்தாமல் பாதுகாக்கிறது.
- source_word: ἐπέμεινα πρὸς αὐτὸν
  choice: அவருடன் ... தங்கியிருந்தேன்
  rationale: குறிப்பிட்ட காலம் முழுவதும் கேபாவுடன் தங்கியிருந்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἡμέρας δεκαπέντε
  choice: பதினைந்து நாட்கள்
  rationale: கால நீட்சியைக் குறிக்கும் கிரேக்க வேற்றுமையைத் தமிழில் நேரடியாகவும் தெளிவாகவும் தருகிறது.
