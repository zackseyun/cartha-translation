id: GAL.1.17
reference: Galatians 1:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐδὲ ἀνῆλθον εἰς Ἱεροσόλυμα πρὸς τοὺς πρὸ ἐμοῦ ἀποστόλους, ἀλλὰ ἀπῆλθον εἰς Ἀραβίαν, καὶ πάλιν ὑπέστρεψα εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/017.yaml
  text: Nor did I go up to Jerusalem to those who were apostles before me, but I went away to Arabia, and returned again to Damascus.
translation:
  language: ta
  text: எனக்கு முன்பே அப்போஸ்தலர்களாக இருந்தவர்களிடம் போக எருசலேமுக்கு நான் ஏறிச் செல்லவும் இல்லை; மாறாக, அரேபியாவுக்குப் புறப்பட்டுச் சென்றேன்; பின்னர் மீண்டும் தமஸ்குவுக்குத் திரும்பினேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ
  choice: செல்லவும் இல்லை
  rationale: முந்தைய சூழலில் உள்ள மறுப்பைத் தொடர்ந்து, இச்செயலும் நடைபெறவில்லை என்பதை இயல்பான தமிழில் இணைத்துக் காட்டுகிறது.
- source_word: ἀνῆλθον
  choice: ஏறிச் செல்ல
  rationale: எருசலேமுக்குச் செல்வதை வழக்கமாக ‘ஏறிச் செல்வது’ எனக் குறிப்பிடும் புவியியல் மற்றும் மரபுசார் நயத்தைப் பாதுகாக்கிறது.
- source_word: Ἱεροσόλυμα
  choice: எருசலேம்
  rationale: இடப்பெயரின் தமிழில் பரவலாக அறியப்பட்ட நிலையான வடிவம்.
- source_word: πρὸς τοὺς πρὸ ἐμοῦ ἀποστόλους
  choice: எனக்கு முன்பே அப்போஸ்தலர்களாக இருந்தவர்களிடம்
  rationale: πρὸ ἐμοῦ என்பதன் கால முன்னுரிமையைத் தெளிவாகக் காட்டுகிறது; அதிகாரம் அல்லது பதவியில் உயர்ந்தவர்கள் என்ற பொருளைச் சேர்ப்பதில்லை.
- source_word: ἀλλὰ
  choice: மாறாக
  rationale: எருசலேமுக்குச் செல்லாததற்கும் அரேபியாவுக்குச் சென்றதற்கும் இடையிலான வலுவான எதிர்மறை மாற்றத்தை இயல்பாகக் குறிக்கிறது.
- source_word: ἀπῆλθον
  choice: புறப்பட்டுச் சென்றேன்
  rationale: ἀπ- முன்னொட்டில் உள்ள ஓரிடத்திலிருந்து நீங்கிச் செல்லும் நயத்தைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: Ἀραβίαν
  choice: அரேபியா
  rationale: அந்தப் பகுதியின் நிலையான தமிழ் ஒலிபெயர்ப்பு; அதன் வரலாற்று எல்லையை வசனம் வரையறுக்காததால் கூடுதல் விளக்கம் சேர்க்கப்படவில்லை.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: திரும்பிச் சென்ற இயக்கத்தை இயல்பாக வலியுறுத்துகிறது.
- source_word: ὑπέστρεψα
  choice: திரும்பினேன்
  rationale: பயணச் சூழலில் ὑποστρέφω என்பதற்கான சுருக்கமான, இயல்பான தமிழ் இணை.
- source_word: Δαμασκόν
  choice: தமஸ்கு
  rationale: நகரப்பெயரின் தமிழில் பரவலாகப் பயன்படுத்தப்படும் வடிவம்.
theological_decisions:
- issue: ‘எனக்கு முன்பு’ என்று அப்போஸ்தலர்களைக் குறிப்பிடுவதன் பொருள்
  choice: பவுலுக்கு முன்பே அப்போஸ்தலர்களாக இருந்தவர்கள் என்ற கால முன்னுரிமை
  alternative: பவுலைவிட அதிகாரத்தில் அல்லது பதவியில் உயர்ந்தவர்கள்
  rationale: πρὸ ἐμοῦ என்பது இயல்பாகக் கால முன்னுரிமையைக் குறிக்கிறது. மொழிபெயர்ப்பு அதிகாரப் படிநிலை குறித்த கூற்றை வசனத்தில் புகுத்தாமல் அந்தப் பொருளைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான வேதாகம நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘அப்போஸ்தலர்’ என்ற பரவலாக அறியப்பட்ட திருச்சொல் வைக்கப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் மறுப்பு, எதிர்மாற்றம், பயண வரிசை ஆகியவை தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
