  text: ὃ οὐκ ἔστιν ἄλλο· εἰ μή τινές εἰσιν οἱ ταράσσοντες ὑμᾶς καὶ θέλοντες μεταστρέψαι τὸ εὐαγγέλιον τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/007.yaml
  text: which is not another gospel[b][a]; except that there are some who are troubling you and wanting to distort the gospel of Messiah.
translation:
  language: ta
  text: அது வேறொரு நற்செய்தி அல்ல; உங்களைக் குழப்பி, மேசியாவின்[a] நற்செய்தியைத் திரித்துவிட விரும்புகிற சிலர் இருக்கிறார்களே தவிர.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கிறிஸ்துவின்.’
    reason: lexical_alternative
  - marker: b
    text: ‘திரித்துவிட’ என்பதற்கு ‘கெடுத்துவிட’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο
  choice: வேறொரு நற்செய்தி
  rationale: ἄλλο என்பதுடன் பெயர்ச்சொல் வெளிப்படையாக இல்லாவிட்டாலும், முந்தைய வசனத்திலுள்ள εὐαγγέλιον இங்கே பொருளாகத் தொடர்கிறது; தமிழில் தெளிவுக்காக ‘நற்செய்தி’ சேர்க்கப்பட்டது.
- source_word: εἰ μή
  choice: ஆனால்
  rationale: இங்கு இது கடுமையான நிபந்தனையை அல்ல, முன்னைய கூற்றை விளக்கும் விதிவிலக்கு/தகுதிப்பாட்டை அறிமுகப்படுத்துகிறது; இயல்பான தமிழில் ‘ஆனால்’ அந்தத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ταράσσοντες
  choice: குழப்பி
  rationale: இந்த வினை மனக்கலக்கம் உண்டாக்குதல், நிலைகுலையச் செய்தல் ஆகிய பொருள்களை ஏந்துகிறது; ‘குழப்பி’ நவீன தமிழில் இயல்பாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: θέλοντες
  choice: விரும்புகிற
  rationale: அவர்களின் நோக்கத்தை மிகைப்படுத்தாமல், θέλω வினையின் விருப்பம்/எண்ணம் என்ற வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: μεταστρέψαι
  choice: திரித்துவிட
  rationale: ஒன்றை அதன் உண்மை வடிவிலிருந்து மாற்றி எதிர்மாறாக்கும் அல்லது கெடுக்கும் கருத்தை ‘திரித்துவிட’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: εὐαγγέλιον
  choice: நற்செய்தி
  rationale: தமிழ் வேதாகம மற்றும் பொதுக் கிறிஸ்தவப் பயன்பாட்டில் நிலைபெற்ற, அதேவேளை சாதாரண வாசகருக்கும் புரியும் சொல்.
- source_word: Χριστοῦ
  choice: மேசியாவின்
  rationale: Χριστός இங்கு உரிமை/தொடர்பு குறிக்கும் வேற்றுமையில் இருந்தாலும் அதன் பட்டப்பெயர் சார்ந்த மேசியத் தளம் உயிரோடு உள்ளது; ‘மேசியா’ அதைத் தக்கவைக்கிறது.
theological_decisions:
- issue: Χριστοῦ என்பதை பட்டப்பெயராகவா, பெயர்போன்ற வடிவமாகவா மொழிபெயர்ப்பது
  choice: மேசியாவின்
  alternative: கிறிஸ்துவின்
  rationale: இந்தச் சொற்றொடர் மேசியாவுக்குரிய அல்லது அவரைப் பற்றிய நற்செய்தியைச் சுட்டலாம்; கிரேக்க உரை அந்த உறவைத் துல்லியமாக வரையறுக்காததால் தமிழிலும் உடைமை வேற்றுமை அமைப்பு பாதுகாக்கப்பட்டது. பட்டப்பெயரின் யூத-மேசியப் பின்னணியை ‘மேசியா’ தக்கவைக்கிறது.
- issue: τοῦ Χριστοῦ என்ற உடைமை வேற்றுமையின் பொருள்
  choice: ‘மேசியாவின் நற்செய்தி’ என்று உறவைத் திறந்தவாறே வைத்தல்
  alternative: ‘மேசியாவைப் பற்றிய நற்செய்தி’ அல்லது ‘மேசியாவிடமிருந்து வந்த நற்செய்தி’
  rationale: கிரேக்க உடைமை வேற்றுமை நற்செய்தி மேசியாவுக்குரியது, அவரைப் பற்றியது, அல்லது அவரிடமிருந்து வந்தது ஆகிய நுணுக்கங்களுக்கு இடமளிக்கலாம்; அவற்றில் ஒன்றை மட்டும் உரையில் கட்டாயப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான ஆனால் கண்ணியமான பவுலின் கண்டனத் தொனி பாதுகாக்கப்பட்டது. முந்தைய வசனத்தைத் தொடரும் தொடர்பு இயல்பாக அமைய முதல் வாக்கியம் ‘அது’ என்று தொடங்குகிறது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
