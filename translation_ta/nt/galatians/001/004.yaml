reference: Galatians 1:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τοῦ δόντος ἑαυτὸν ⸀ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν ὅπως ἐξέληται ἡμᾶς ἐκ τοῦ ⸂αἰῶνος τοῦ ἐνεστῶτος⸃ πονηροῦ κατὰ τὸ θέλημα τοῦ θεοῦ καὶ πατρὸς ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/004.yaml
  text: who gave himself for our sins so that he might rescue us from the present evil age[a], according to the will of our God and Father,
translation:
  language: ta
  text: நம்முடைய கடவுளும் தந்தையுமானவரின் விருப்பத்தின்படி, தற்போதைய தீய காலத்திலிருந்து[a] நம்மை விடுவிப்பதற்காக அவர் நம்முடைய பாவங்களுக்காகத் தம்மையே கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தற்போதைய தீய உலகத்திலிருந்து.’
    reason: αἰών என்பதன் முதன்மைப் பொருள் இச்சூழலில் ஒரு காலஒழுங்கு அல்லது காலகட்டம்; ‘உலகம்’ என்பது மரபான சாத்தியமான மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: δόντος ἑαυτόν
  choice: தம்மையே கொடுத்தார்
  rationale: தம்மைத் தாமே மனமுவந்து அளித்ததைக் கிரேக்கச் சொற்றொடர் வலியுறுத்துகிறது. ‘ஒப்புக்கொடுத்தார்’ என்பது சாத்தியமானாலும், அது இங்கு தேவையற்ற கூடுதல் நுண்பொருளைச் சேர்க்கலாம்.
- source_word: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: நம்முடைய பாவங்களுக்காக
  rationale: ὑπέρ என்பதன் மீட்பு சார்ந்த வலிமையை இது தக்கவைக்கிறது; அதே நேரத்தில் பாவநிவாரணம் குறித்த ஒரு குறிப்பிட்ட கோட்பாட்டை வசனத்துக்குள் சேர்ப்பதில்லை.
- source_word: ὅπως ἐξέληται ἡμᾶς
  choice: நம்மை விடுவிப்பதற்காக
  rationale: ἐξαιρέω என்பது ஆபத்திலிருந்தோ கட்டுப்படுத்தும் சூழலிலிருந்தோ ஒருவரை வெளியே கொண்டுவருவதைக் குறிக்கிறது. ‘விடுவிக்க’ என்பது இயல்பான நவீனத் தமிழில் அந்த மீட்புப் பொருளைத் தருகிறது.
- source_word: ἐκ τοῦ αἰῶνος τοῦ ἐνεστῶτος πονηροῦ
  choice: இப்போதுள்ள தீய காலத்திலிருந்து
  rationale: αἰών முதன்மையாக உலகம் என்ற இடத்தைக் காட்டாமல் ஒரு காலகட்டத்தைக் குறிக்கிறது; ἐνεστῶτος அதன் தற்போதைய தன்மையையும் πονηροῦ அதன் தீய இயல்பையும் காட்டுகின்றன.
- source_word: κατὰ τὸ θέλημα
  choice: விருப்பத்தின்படி
  rationale: கடவுளுடைய நோக்கத்துக்கும் விருப்பத்துக்கும் ஏற்ப நிகழ்வதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: நம்முடைய கடவுளும் தந்தையுமானவரின்
  rationale: ‘கடவுள்’ மற்றும் ‘தந்தை’ ஆகிய இரு பெயர்களும் ஒரே நபரைக் குறிக்கின்றன என்பதை இந்த அமைப்பு தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν என்பதில் பாவநிவாரணத்தின் முறையை மொழிபெயர்ப்பிலேயே குறிப்பாக வரையறுக்க வேண்டுமா?
  choice: நம்முடைய பாவங்களுக்காக
  alternative: நம்முடைய பாவங்களின் காரணமாக / நம்முடைய பாவங்களைச் சுமப்பதற்காக
  rationale: கிரேக்கம் மீட்பு மற்றும் பிரதிநிதித்துவம் சார்ந்த பொருளை அனுமதிக்கிறது; ஆனால் பாவநிவாரணத்தின் முழுமையான செயல்முறையை இங்கே வரையறுப்பதில்லை. தேர்ந்த வடிவம் அந்த இறையியல் அழுத்தத்தையும் திறந்த தன்மையையும் காக்கிறது.
- issue: αἰών என்பதை ‘காலம்’ என்றா ‘உலகம்’ என்றா மொழிபெயர்ப்பது?
  choice: இப்போதுள்ள தீய காலம்
  alternative: இப்போதுள்ள தீய உலகம்
  rationale: பவுலின் சொல் வெறும் இடம் அல்லது படைக்கப்பட்ட உலகத்தைக் காட்டிலும் தற்போதைய கால ஒழுங்கைக் குறிக்கிறது. ‘காலம்’ மூலத்தின் காலவியல்-அண்டவியல் பொருளை நெருக்கமாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. தனிவசனமாக வாசிக்கத் தெளிவாக இருக்க, கிரேக்கத்தின் தொடர்பெச்ச வடிவம் தமிழில் முழு வாக்கியமாக மாற்றப்பட்டுள்ளது. நோக்கத் தொடர் முன்வைக்கப்பட்டாலும், மூலத்தின் காரண-நோக்க உறவு மாற்றப்படவில்லை.
