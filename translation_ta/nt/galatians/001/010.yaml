id: GAL.1.10
reference: Galatians 1:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἄρτι γὰρ ἀνθρώπους πείθω ἢ τὸν θεόν; ἢ ζητῶ ἀνθρώποις ἀρέσκειν; ⸀εἰ ἔτι ἀνθρώποις ἤρεσκον, Χριστοῦ δοῦλος οὐκ ἂν ἤμην.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/010.yaml
  text: For am I now persuading people[a], or God? Or am I seeking to please people? If I were still pleasing people[b], I would not be Messiah’s servant.
translation:
  language: ta
  text: ஏனெனில், இப்போது நான் மனிதர்களை இணங்க வைக்க முயல்கிறேனா[a], அல்லது கடவுளையா? அல்லது மனிதர்களைப் பிரியப்படுத்த முயல்கிறேனா? நான் இன்னும் மனிதர்களைப் பிரியப்படுத்திக்கொண்டிருந்தேன் என்றால், மேசியாவின் அடிமையாக இருந்திருக்க மாட்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இப்போது நான் மனிதர்களின் அங்கீகாரத்தை நாடுகிறேனா, அல்லது கடவுளின் அங்கீகாரத்தையா?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρτι
  choice: இப்போது
  rationale: பவுலின் தற்போதைய நிலைப்பாட்டை அவரது முந்தைய வாழ்க்கை முறையோடு மறைமுகமாக வேறுபடுத்திக் காட்டும் இயல்பான தமிழ் சொல்.
- source_word: πείθω
  choice: இணங்கச் செய்ய முயல்கிறேன்
  rationale: ‘இணங்கச் செய்தல்/வற்புறுத்தி ஏற்கச் செய்தல்’ என்ற வினையின் அடிப்படைப் பொருளைப் பேணுகிறது; கடவுளைப் பற்றிய அதே வினைப்பயன்பாட்டின் திட்டமிட்ட சொல்லாட்சி அழுத்தத்தையும் மறைக்கவில்லை.
- source_word: ἀνθρώπους
  choice: மனிதர்கள்
  rationale: ஆண்களை மட்டும் அல்லாமல் மனிதர்களைப் பொதுவாகக் குறிக்கும் கிரேக்கச் சொல்லின் பரப்பைத் துல்லியமாகக் காட்டுகிறது.
- source_word: ζητῶ
  choice: முயல்கிறேன்
  rationale: தற்போது தொடர்ந்து நாடும் செயலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἀρέσκειν / ἤρεσκον
  choice: பிரியப்படுத்த / பிரியப்படுத்திக்கொண்டிருந்தேன்
  rationale: மனிதர்களின் விருப்பத்துக்கும் அங்கீகாரத்துக்கும் ஏற்றவாறு நடப்பதைக் குறிக்கும் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: εἰ ἔτι
  choice: நான் இன்னும் ... கொண்டிருந்தால்
  rationale: ஒரு முந்தைய நடைமுறை தொடர்ந்திருந்தால் என்னும் எதிர்நிலை நிபந்தனையையும் ἔτι என்பதன் ‘இன்னும்’ என்ற பொருளையும் பேணுகிறது.
- source_word: Χριστοῦ
  choice: மேசியாவின்
  rationale: Χριστός இங்கு தனிப்பட்ட பெயராக மட்டும் அல்லாமல் அபிஷேகம் செய்யப்பட்ட அரசருக்குரிய பட்டமாகவும் செயல்படுவதால் ‘மேசியா’ என வழங்கப்படுகிறது.
- source_word: δοῦλος
  choice: அடிமை
  rationale: மனிதர்களைப் பிரியப்படுத்துவதற்கு மாறாக மேசியாவுக்கே முழுமையாகச் சொந்தமானவர் என்ற உரிமை மற்றும் முழு விசுவாசப் பற்றின் வலிமையைப் பேணுகிறது.
theological_decisions:
- issue: Χριστοῦ δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: மேசியாவின் அடிமை
  alternative: கிறிஸ்துவின் ஊழியன்
  rationale: இந்த வசனத்தில் மனிதர்களின் அங்கீகாரத்தை நாடுவதற்கும் மேசியாவுக்கே முழுமையாகச் சொந்தமாயிருப்பதற்கும் இடையிலான கூர்மையான எதிர்மறை வலியுறுத்தப்படுகிறது. ஆகவே பட்டத்தன்மைக்கு ‘மேசியா’ என்றும், கட்டுப்பட்ட சொந்தத்தன்மைக்கு ‘அடிமை’ என்றும் வழங்கப்பட்டுள்ளது.
- issue: πείθω என்பதன் கடவுளை நோக்கிய பயன்பாடு
  choice: மனிதர்களை இணங்கச் செய்ய முயல்கிறேனா, அல்லது கடவுளையா?
  alternative: மனிதர்களின் அங்கீகாரத்தை நாடுகிறேனா, அல்லது கடவுளின் அங்கீகாரத்தையா?
  rationale: கிரேக்க வினையின் நேரடியான ‘இணங்கச் செய்தல்’ என்ற பொருளையும், மனிதர்களுக்கும் கடவுளுக்கும் ஒரே வினை பயன்படுத்தப்படுவதால் உருவாகும் சொல்லாட்சி பதற்றத்தையும் முதன்மை உரை பேணுகிறது; சூழலுக்கேற்ற ‘அங்கீகாரத்தை நாடுதல்’ என்ற புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தொடக்க γάρ ‘ஏனெனில்’ எனத் தெளிவாகப் பேணப்பட்டுள்ளது. தொடர் வினாக்க்களின் சொல்லாட்சி வலிமையும் இறுதி எதிர்நிலை நிபந்தனையும் பாதுகாக்கப்பட்டுள்ளன.
