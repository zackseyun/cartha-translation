reference: Galatians 1:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτε δὲ ⸀εὐδόκησεν ὁ ἀφορίσας με ἐκ κοιλίας μητρός μου καὶ καλέσας διὰ τῆς χάριτος αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/015.yaml
  text: But when the one who set me apart from my mother’s womb and called me through his grace was pleased[a]
translation:
  language: ta
  text: ஆனால், என் தாயின் கருவிலிருந்தே[a] என்னைப் பிரித்துவைத்து, தமது அருளால் என்னை அழைத்தவர் மனமுவந்தபோது,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் பிறந்ததிலிருந்தே.” எரேமியா 1:5 மற்றும் ஏசாயா 49:1 ஆகியவற்றிலுள்ள தீர்க்கதரிசன அழைப்பு மொழிநடையுடன் ஒப்பிடுக.
    reason: மூலச் சொற்றொடரின் சாத்தியமான காலப் பொருளைச் சுட்டி, அதனுடன் ஒத்த தீர்க்கதரிசன அழைப்பு மொழியை மேற்கோள் காட்டுகிறது.
lexical_decisions:
- source_word: ὅτε δὲ
  choice: ஆனால், ... போது
  rationale: ὅτε என்பதன் காலப் பொருளையும் δέ என்பதன் மென்மையான மாறுபாட்டையும் தொடர்ச்சியையும் இயல்பான தமிழில் காக்கிறது.
- source_word: εὐδόκησεν
  choice: மனமுவந்தபோது
  rationale: வெறும் தீர்மானம் என்ற பொருளாகக் குறுக்காமல், தெய்வீக நல்விருப்பத்தையும் மனமகிழ்ந்த இசைவையும் வெளிப்படுத்துகிறது.
- source_word: ὁ ἀφορίσας με
  choice: என்னைப் பிரித்துவைத்து ... அழைத்தவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் கிரேக்கப் பங்கேற்பு வினையை இயல்பான தொடர்பெயர் அமைப்பில் தருகிறது. ‘பிரித்துவைத்து’ என்பது குறிப்பிட்ட முன்நியமனக் கோட்பாட்டை உரைக்குள் சேர்க்காமல், ஒரு நோக்கத்திற்காக வேறுபடுத்தியதைத் தெரிவிக்கிறது.
- source_word: ἐκ κοιλίας μητρός μου
  choice: என் தாயின் கருவிலிருந்தே
  rationale: கிரேக்கத்தின் தெளிவான கருப்பை உருவகத்தையும் தீர்க்கதரிசன அழைப்பு மொழிநடையையும் காக்கிறது; ‘நான் பிறப்பதற்கு முன்பே’ என்று விளக்கி விரிவாக்கவில்லை.
- source_word: καλέσας
  choice: என்னை அழைத்தவர்
  rationale: தெய்வீக அழைப்பின் பணிசார் மற்றும் இரட்சிப்புசார் நுண்ணர்த்தங்களைத் திறந்த நிலையில் வைத்திருக்கும் வழக்கமான, இயல்பான தமிழ் சொல்.
- source_word: διὰ τῆς χάριτος αὐτοῦ
  choice: தமது அருளால்
  rationale: διά + தொடர்பு வேற்றுமை காட்டும் வழிமுறை அல்லது கருவிப் பொருளை இயல்பான தமிழில் தருகிறது; அழைப்பு அருளால் நிகழ்ந்ததைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: ἀφορίσας என்பதை முன்நியமனம் அல்லது தெரிந்தெடுத்தல் குறித்த ஒரு குறிப்பிட்ட கோட்பாட்டை நேரடியாகச் சொல்லும் விதத்தில் மொழிபெயர்க்க வேண்டுமா?
  choice: பிரித்துவைத்து
  alternative: தேர்ந்தெடுத்து / நியமித்து
  rationale: இங்கு தீர்க்கதரிசன அழைப்பை நினைவூட்டும் தெய்வீகப் பிரித்துவைத்தல் உள்ளது; ஆனால் ‘தேர்ந்தெடுத்தார்’ அல்லது ‘நியமித்தார்’ என்று குறிப்பிட்ட கோட்பாட்டு முடிவைத் திணிக்க கிரேக்கம் கட்டாயப்படுத்தவில்லை.
- issue: εὐδόκησεν என்பதிலுள்ள தெய்வீக நல்விருப்பத்தை வெறும் முடிவாகக் குறுக்கலாமா?
  choice: மனமுவந்தபோது
  alternative: தீர்மானித்தபோது / விரும்பியபோது
  rationale: ‘மனமுவந்தபோது’ என்பது நல்விருப்பத்தையும் இசைவையும் காக்கிறது; ‘தீர்மானித்தபோது’ மூலச்சொல்லின் உணர்வை வெறும் மனத் தீர்மானமாகக் குறைக்கும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. இது அடுத்த வசனத்தில் நிறைவுபெறும் சார்பு வாக்கியம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. மரியாதைத் தற்சுட்டான ‘தமது’ பயன்படுத்தப்பட்டாலும், மூலத்தில் இல்லாத இறைபெயர் சேர்க்கப்படவில்லை.
