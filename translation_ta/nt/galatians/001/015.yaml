  source_fidelity: மூலத்தின் ὅτε δέ-யின் கால/மென் எதிர்மறைத் திருப்பம் «ஆனால், ...போது» எனத் தக்கவாறு வந்துள்ளது. ἀφορίσας, ἐκ κοιλίας μητρός μου, καλέσας, διὰ τῆς χάριτος αὐτοῦ, εὐδόκησεν ஆகிய அனைத்தும் முறையே «பிரித்துவைத்து», «என் தாயின் கருவிலிருந்தே», «அழைத்தவர்», «தமது அருளால்», «மனமுவந்தபோது» என மூலப் பொருளையும் தொடரியல் சார்பையும் காக்கின்றன. வசனம் அடுத்த வசனத்தில் தொடரும் வாக்கியமாக இருப்பதால் இறுதிக் காற்புள்ளி பொருத்தமானது.
  naturalness: நடை நவீனத் தரத் தமிழில் கண்ணியமாகவும் இயல்பாகவும் உள்ளது. தொடர்பெயர் அமைப்பு நீளமான கிரேக்கப் பங்கேற்பு அமைப்பைத் தமிழில் சீராக வெளிப்படுத்துகிறது. «கருவிலிருந்தே» என்பது வேதாகமப் பயன்பாட்டிலும் பொதுநடையிலும் ‘கருவறையிலிருந்து/பிறப்பிலிருந்து’ என்ற பொருளைத் தெளிவாகத் தருகிறது.
  terminology: «பிரித்துவைத்து» என்பது ‘தேர்ந்தெடுத்தார்’ அல்லது ‘நியமித்தார்’ போன்ற கூடுதல் கோட்பாட்டுச் சுமையை ஏற்றாமல் ἀφορίσας-ஐச் சரியாகக் காட்டுகிறது. «அருள்» மற்றும் «அழைத்தவர்» பவுலின் சொற்பயன்பாட்டுக்கு ஏற்றவை. மரியாதைத் தற்சுட்டான «தமது» தமிழில் உரிய பதிவை வழங்குகிறது.
