translation:
  language: ta
  text: அவருக்கு என்றென்றும் மகிமை உண்டாவதாக. ஆமென்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾧ
  choice: அவருக்கே
  rationale: உறவுப்பெயரின் வேற்றுமை உருபு முந்தைய வசனத்தில் வரும் ‘நம்முடைய கடவுளும் தந்தையுமானவர்’ என்பவரைக் குறிக்கிறது. ‘-க்கே’ என்பது புகழுரையின் இயல்பான தமிழ்நடையையும் வலியுறுத்தலையும் தருகிறது.
- source_word: δόξα
  choice: மகிமை
  rationale: புகழுரையின் சூழலில் δόξα என்பதற்குரிய மரபான, கருத்துச் செறிவுள்ள தமிழ் இணைச்சொல் ‘மகிமை’; இது ‘புகழ்’ அல்லது ‘கனம்’ என்பதைக் காட்டிலும் மூலத்தின் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: என்றென்றும்
  rationale: முடிவில்லாத காலத்தைக் குறிக்கும் கிரேக்க மரபுத்தொடரின் பொருளை இயல்பான நவீன தமிழில் ‘என்றென்றும்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἀμήν
  choice: ஆமென்
  rationale: புகழுரையை முடிக்கும் உறுதியான ஒப்புதலாக, தமிழ் வேதாகமப் பயன்பாட்டில் பழக்கமான ஒலிபெயர்ப்பு தக்கவைக்கப்படுகிறது.
theological_decisions:
- issue: வினைச்சொல் வெளிப்படையாக இல்லாத புகழுரை
  choice: மகிமை உண்டாவதாக
  alternative: மகிமை உரியது / மகிமை உண்டு
  rationale: கிரேக்கத்தில் முடிவுற்ற வினைச்சொல் இல்லை. ‘உண்டாவதாக’ என்பது புகழுரை அல்லது வேண்டுதல் சார்ந்த ஒலியை இயல்பான தமிழில் வெளிப்படுத்துகிறது; அதேவேளையில் மூலத்தில் இல்லாத கூடுதல் கோட்பாட்டுப் பொருளைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் புரியக்கூடிய, சுருக்கமான, கண்ணியமான புகழுரை நடை. ‘அவருக்கே’ முந்தைய தொடரின் குறிப்பை இயல்பாகத் தக்கவைக்கிறது; ‘என்றென்றும்’ கிரேக்கத்தின் வலுப்படுத்தப்பட்ட கால மரபுத்தொடரைச் செறிவாக அளிக்கிறது.
