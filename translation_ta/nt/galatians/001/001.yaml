  text: Παῦλος ἀπόστολος, οὐκ ἀπ’ ἀνθρώπων οὐδὲ δι’ ἀνθρώπου ἀλλὰ διὰ Ἰησοῦ Χριστοῦ καὶ θεοῦ πατρὸς τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/001.yaml
  text: Paul[a], an apostle—not from men nor through a man, but through Jesus the Messiah and God the Father, who raised him from the dead,
translation:
  language: ta
  text: பவுல், ஒரு அப்போஸ்தலன்—மனிதர்களிடமிருந்தோ ஒரு மனிதன் மூலமாகவோ அல்ல; மாறாக மெசியாவாகிய இயேசுவின் மூலமாகவும், அவரை இறந்தோரிலிருந்து உயிர்த்தெழச் செய்த தந்தையாகிய கடவுளின் மூலமாகவும்—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόστολος
  choice: அப்போஸ்தலன்
  rationale: பவுலின் அதிகாரப்பூர்வ அனுப்புதலையும் பணிப்பொறுப்பையும் குறிக்கும் நிலைபெற்ற பட்டமாக இருப்பதால், பொதுவான ‘தூதன்’ என்பதைக் காட்டிலும் மூலத்தின் சிறப்புப் பொருளைத் தக்கவைக்கிறது.
- source_word: ἀπ’ ἀνθρώπων
  choice: மனிதர்களிடமிருந்து
  rationale: ἀπό உடன் வரும் பன்மை மனித மூலத்தைக் குறிக்கிறது; அடுத்து வரும் ஒருமையுடனான சொல்லாட்சிசார் வேறுபாட்டையும் இது காக்கிறது.
- source_word: δι’ ἀνθρώπου
  choice: ஒரு மனிதன் மூலமாக
  rationale: διά உடன் வரும் ஒருமை மனித முகமை அல்லது இடைமுகத்தைக் குறிக்கிறது; இயல்பான தமிழில் ஒருமைத் தன்மையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: மெசியாவாகிய இயேசு மூலமாக
  rationale: மீண்டும் வரும் διά உண்மையான முகமையை எடுத்துக்காட்டுகிறது; Χριστός இங்கு பட்டப்பொருளைத் தாங்குவதால் ‘மெசியா’ என்ற பொருள் இயல்பான தமிழ் அமைப்பில் வெளிப்படுத்தப்படுகிறது.
- source_word: θεοῦ πατρὸς
  choice: தந்தையாகிய கடவுள்
  rationale: இது ஒருங்கிணைக்கப்பட்ட இறைப்பட்டத்தைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; இயேசுவோடு இணைந்து வரும் முகமையையும் காக்கிறது.
- source_word: τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν
  choice: அவரை இறந்தோரிலிருந்து உயிர்த்தெழச் செய்த
  rationale: செயப்படுபொருளான ‘அவரை’யும், செய்பவராகத் தந்தையாகிய கடவுளையும் தெளிவாக வைத்தபடி உயிர்த்தெழுதல் கூற்றை மொழிபெயர்க்கிறது.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ என்பதில் Χριστοῦ-ஐ மொழிபெயர்த்தல்
  choice: மெசியாவாகிய இயேசு
  alternative: இயேசு கிறிஸ்து
  rationale: இவ்வாழ்த்துரையில் Χριστός வெறும் பெயரின் பகுதியாக மட்டுமல்லாமல் பட்டப்பொருளையும் தாங்குகிறது. ஆகவே ‘மெசியாவாகிய’ என்பது அந்தப் பொருளை வெளிப்படையாகக் காக்கிறது; பரவலாக அறியப்பட்ட மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான கடிதத் தொடக்க நடையைக் காக்கிறது. ‘மனிதர்களிடமிருந்து’ என்ற பன்மைக்கும் ‘ஒரு மனிதன் மூலமாக’ என்ற ஒருமைக்கும் இடையிலான கிரேக்க சொல்லாட்சிசார் எதிர்மறை வேறுபாடு பாதுகாக்கப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் தொடரும் வாக்கியத்தின் தொடக்கம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
