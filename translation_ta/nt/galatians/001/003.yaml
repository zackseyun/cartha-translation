  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ⸂καὶ κυρίου ἡμῶν⸃ Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah,[a]
translation:
  language: ta
  text: தந்தையாகிய கடவுளிடமிருந்தும் நம் ஆண்டவராகிய இயேசு மேசியாவிடமிருந்தும் உங்களுக்கு அருளும் சமாதானமும் உண்டாவதாக.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “இயேசு கிறிஸ்து.”'
    reason: Χριστός என்பதன் மரபான பெயர்சார் ஒலிபெயர்ப்பு மாற்று வடிவத்தைப் பதிவு செய்கிறது.
lexical_decisions:
- source_word: χάρις
  choice: அருள்
  rationale: பவுலின் கடித வாழ்த்தில் வரும் இறை நன்மை, தயவு ஆகிய பொருள் ஆழத்தையும் வாழ்த்தின் இயல்பையும் சுருக்கமாகக் காக்கிறது.
- source_word: ὑμῖν
  choice: உங்களுக்கு
  rationale: வாழ்த்தைப் பெறுபவர்களைக் குறிக்கும் கிரேக்க இடவேற்றுமையின் இயல்பான தமிழ் வடிவம்.
- source_word: εἰρήνη
  choice: சமாதானம்
  rationale: யூத வாழ்த்து மரபையும் இறையியல் நிறைவையும் தக்கவைக்கும் நிலையான வேதாகமத் தமிழ் சொல்.
- source_word: ἀπό
  choice: இடமிருந்தும்
  rationale: அருளும் சமாதானமும் வரும் மூலத்தைத் தெளிவாகக் குறிக்கிறது; இணைக்கப்பட்ட இரு மூலங்களுடனும் தமிழ் இலக்கணத்துக்கேற்ப பயன்படுத்தப்பட்டுள்ளது.
- source_word: θεοῦ πατρὸς
  choice: தந்தையாகிய கடவுள்
  rationale: கிரேக்கத்தில் வெளிப்படையாக உள்ள 'கடவுள்—தந்தை' என்ற அடையாளப்படுத்தும் உறவை இயல்பான தமிழில் தருகிறது; ἡμῶν நேரடியாக κυρίου என்பதோடு நிற்பதால் இங்கு 'நம்' சேர்க்கப்படவில்லை.
- source_word: κυρίου ἡμῶν
  choice: நம் ஆண்டவர்
  rationale: κύριος என்பதன் புதிய ஏற்பாட்டுக் கிறிஸ்துவியல் பட்டப்பொருளையும் ἡμῶν எனும் உடைமைச் சுட்டையும் நேரடியாகக் காக்கிறது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மேசியா
  rationale: Χριστός இங்கு இன்னும் பட்டமாகச் செயல்படுவதால் அதன் பொருளை மொழிபெயர்த்து வழங்குகிறது; தமிழில் பெயருடன் இயல்பாக இணைகிறது.
theological_decisions:
- issue: Χριστοῦ என்பதை பொருள் மொழிபெயர்க்கப்பட்ட பட்டமாக வழங்குவதா, மரபான 'கிறிஸ்து' வடிவில் வழங்குவதா
  choice: இயேசு மேசியா
  alternative: இயேசு கிறிஸ்து
  rationale: இவ்வாழ்த்தில் Χριστός ஒரு கிறிஸ்துவியல் பட்டத்தின் வலிமையைத் தக்கவைத்திருப்பதால் 'மேசியா' முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டது; பரவலாக அறியப்பட்ட மரபு வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἡμῶν என்பது 'தந்தை' மற்றும் 'ஆண்டவர்' இரண்டுடனும் தொடர்புடையதா
  choice: '''நம்'' என்பதை ''ஆண்டவர்'' என்பதுடன் மட்டும் வெளிப்படையாக இணைத்தல்'
  alternative: நம் தந்தையாகிய கடவுளும் நம் ஆண்டவரும்
  rationale: கொடுக்கப்பட்ட கிரேக்கச் சொல் வரிசையில் ἡμῶν என்பது κυρίου என்பதற்குப் பின் நேரடியாக வந்து அதனுடன் இயல்பாக இணைகிறது. 'கடவுள் நம் தந்தை' என்பது கலாத்தியரில் உண்மையான கருத்தாக இருந்தாலும், இவ்வசனத்தின் வடிவில் அதை வெளிப்படையாகச் சேர்க்காமல் மூலத்தின் இலக்கண அமைப்பு காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கடித வாழ்த்துக்குரிய கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. தமிழ் வாக்கிய இயல்புக்கேற்ப ஆசீர்வாத வினைமுற்று இறுதியில் வைக்கப்பட்டுள்ளது. 'அருள்', 'சமாதானம்', 'ஆண்டவர்' ஆகிய பரிச்சயமான வேதாகமச் சொற்கள் தொடரப்பட்டுள்ளன; தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
