  source_fidelity: 'மூலக் கிரேக்கத்தின் வாழ்த்து அமைப்பு துல்லியமாகத் தரப்பட்டுள்ளது: χάρις/εἰρήνηக்கு “அருள்/சமாதானம்,” ἀπόக்கு இருமுறை வரும் “-இடமிருந்தும்,” மற்றும் κυρίου ἡμῶνக்கு “நம் ஆண்டவராகிய” ஆகியவை பொருத்தமானவை. ἡμῶν கிரேக்கத்தில் κυρίου என்பதோடு நேரடியாக இணைந்திருப்பதால், “தந்தையாகிய கடவுள்” என்பதற்கு “நம்” சேர்க்காமல் இருப்பது மூலச் சொல்வரிசை மற்றும் இலக்கணத்திற்கு நெருக்கமானது. ஆங்கில POB-இன் “God our Father” என்பது சாத்தியமான விளக்கமாக இருந்தாலும், தமிழ்வரைவு எடுத்துள்ள குறுகிய இணைப்பு மூலத்திற்கு மேலும் நேரடியானது. SBLGNT-இல் அடைப்புக்குறிக்குள் உள்ள καὶ κυρίου ἡμῶν பிரதான உரையில் இருப்பதால் அது மொழிபெயர்க்கப்பட்டுள்ளது; இவ்விடத்தில் தனித் தாழ்வார/உரைமாறுபாட்டு அடிக்குறிப்பு அவசியமில்லை.'
