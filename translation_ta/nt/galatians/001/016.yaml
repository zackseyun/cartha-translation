  text: ἀποκαλύψαι τὸν υἱὸν αὐτοῦ ἐν ἐμοὶ ἵνα εὐαγγελίζωμαι αὐτὸν ἐν τοῖς ἔθνεσιν, εὐθέως οὐ προσανεθέμην σαρκὶ καὶ αἵματι,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/016.yaml
  text: to reveal his Son in me[a], so that I might proclaim him among the Gentiles, I did not immediately consult with flesh and blood[b],
translation:
  language: ta
  text: தம்முடைய மகனை எனக்குள்[a] வெளிப்படுத்தவும், பிற இனத்தாரிடையே அவரைப் பற்றிய நற்செய்தியை நான் அறிவிக்கவும் அவர் விரும்பியபோது, உடனே நான் சதையும் இரத்தமுமானவர்களோடு[b] கலந்தாலோசிக்கவில்லை;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “எனக்கு” அல்லது “என் வழியாக.”
    reason: alternative_reading
  - marker: b
    text: “சதையும் இரத்தமும்” என்பது ஒரு மனிதரையோ மனிதர்களையோ குறிக்கும் மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκαλύψαι
  choice: வெளிப்படுத்தவும்
  rationale: தெய்வீக வெளிப்படுத்துதலின் பொருளைத் தெளிவாகத் தருகிறது; முந்தைய வசனத்திலிருந்து தொடரும் இறை விருப்பத்தின் நோக்கத்தையும் காக்கிறது.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: தம்முடைய மகனை
  rationale: உறவுமுறைப் பட்டத்தின் கிறிஸ்துவியல் வலிமையை விரிவாக்கமின்றி இயல்பான தமிழில் காக்கிறது.
- source_word: ἐν ἐμοὶ
  choice: எனக்குள்
  rationale: ἐν என்பதன் அடிப்படைப் பொருளான ‘உள்ளே/உள்’ என்பதைப் பேணுகிறது; பவுலுக்குள் நிகழ்ந்த வெளிப்பாடு, பவுலுக்கு அளிக்கப்பட்ட வெளிப்பாடு, அல்லது பவுலின் வழியாக நிகழ்ந்த வெளிப்பாடு என்ற உண்மையான தெளிவின்மையை அடிக்குறிப்பில் காக்கிறது.
- source_word: ἵνα εὐαγγελίζωμαι αὐτὸν
  choice: அவரை நற்செய்தியாக அறிவிக்கும்படியும்
  rationale: εὐαγγελίζωμαι என்பதிலுள்ள நற்செய்தி அறிவித்தலையும் αὐτόν என்ற நேரடிச் செயப்படுபொருளையும் ஒன்றாகக் காக்கிறது; மகனைப் பற்றிய செய்தி மட்டுமல்ல, அவரையே அறிவிப்பது என்ற செறிவைத் தருகிறது.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: பிற இனத்தாரிடையே
  rationale: பவுலின் சூழலில் யூதரல்லாத மக்களைக் குறிக்கும் பொருளை, இன்றைய தமிழில் புரியக்கூடிய மற்றும் தேவையற்ற சமயக் குழுமச் சொல்லாடலைத் தவிர்க்கும் வகையில் தருகிறது.
- source_word: εὐθέως
  choice: உடனே
  rationale: காலத் தொடர்பை இயல்பாகவும் துல்லியமாகவும் தெரிவிக்கும் நவீனத் தமிழ் சொல்.
- source_word: οὐ προσανεθέμην
  choice: ஆலோசனை கேட்கவில்லை
  rationale: மற்றவரிடம் சென்று கலந்தாலோசித்தல் அல்லது ஆலோசனை நாடுதல் என்ற நடுவினை வடிவின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: σαρκὶ καὶ αἵματι
  choice: சதையும் இரத்தமுமானவர்களிடம்
  rationale: மூலத்தின் உயிரோட்டமான மரபுத்தொடரைப் பேணியபடியே, அது மனிதர்களைக் குறிப்பதைத் தமிழில் இலக்கணரீதியாகத் தெளிவாக்குகிறது; அதன் மரபுப்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: மகன் வெளிப்படுத்தப்பட்ட விதத்தைச் சுட்டும் ἐν ἐμοὶ என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘எனக்குள்’ என்று நேரடியாகவும் தெளிவின்மையுடனும் வைத்தல்
  alternative: ‘எனக்கு’ அல்லது ‘என் வழியாக’
  rationale: இச்சொற்றொடர் உள்ளார்ந்த வெளிப்பாடு, பவுலுக்கு அளிக்கப்பட்ட வெளிப்பாடு, அல்லது பவுலின் வழியாக நிகழும் வெளிப்பாடு எனப் பலவாறு புரிந்துகொள்ளப்படலாம். அவற்றில் ஒன்றை மட்டும் இறையியல் ரீதியாகத் தீர்மானிக்காமல், மூலத்தின் பதற்றத்தை முதன்மை உரையிலும் அடிக்குறிப்பிலும் காக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, கண்ணியமான மற்றும் பொதுவாசகர்களுக்குப் புரியக்கூடிய நடை. இது வசனம் 15-இலிருந்து தொடரும் வாக்கியத் துணுக்கு என்பதால் இறுதியில் அரைப்புள்ளி வைக்கப்பட்டுள்ளது. ‘பிற இனத்தார்’ என்பது யூதரல்லாத மக்களை இயல்பாகக் குறிக்கிறது; ‘எனக்குள்’ என்ற இடத்தில் மூலத்தின் நோக்கமுள்ள தெளிவின்மை பேணப்பட்டுள்ளது.
