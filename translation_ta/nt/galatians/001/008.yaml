base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/008.yaml
  text: But even if we or an angel from heaven should proclaim good news to you contrary to what we proclaimed to you[c][b][a], let him be accursed.
translation:
  language: ta
  text: ஆனால், நாங்களாயிருந்தாலும் வானத்திலிருந்து வரும் ஒரு தூதனாயிருந்தாலும், நாங்கள் உங்களுக்கு அறிவித்த நற்செய்திக்கு மாறானதை உங்களுக்கு நற்செய்தியாக அறிவித்தால்,[a] அவன் சபிக்கப்பட்டவனாக இருக்கட்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நற்செய்திக்கு மாறானதை” என்பதற்கு “நாங்கள் உங்களுக்கு அறிவித்ததற்கு வேறானதை” அல்லது “நாங்கள் உங்களுக்கு அறிவித்ததைத் தாண்டியதை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவன் சாபத்திற்குள்ளாகட்டும்”; பாரம்பரியச் சொல்லில், “அவன் அனாதேமாவாக இருக்கட்டும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ ἐὰν
  choice: ஆனால் ... அறிவித்தால்கூட
  rationale: ἀλλά என்பதன் வலுவான எதிர்மறைத் திருப்பத்தையும் καί + ἐάν என்பதன் வலியுறுத்தப்பட்ட நிபந்தனையையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἡμεῖς ἢ ἄγγελος ἐξ οὐρανοῦ
  choice: நாங்களோ வானத்திலிருந்து வரும் ஒரு தூதரோ
  rationale: பவுல் தன்னையும் உடன் இருப்பவர்களையும் வலியுறுத்தி உட்படுத்துவதையும், பரலோகத் தூதருடனான உயர்த்தப்பட்ட முரண்பாட்டையும் பாதுகாக்கிறது.
- source_word: εὐαγγελίζηται
  choice: நற்செய்தியாக அறிவித்தால்
  rationale: கிரேக்க வினைச்சொல்லின் செயற்பாட்டு வடிவத்தைப் பாதுகாத்து, சாதாரண வாசகருக்குத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: παρ’ ὃ
  choice: அறிவித்ததற்கு மாறான ஒன்றை
  rationale: முன்பு அறிவிக்கப்பட்ட செய்தியிலிருந்து விலகுதல் அல்லது அதற்கு முரணாக இருத்தல் என்ற இச்சூழலின் வலிமையைத் தருகிறது; 'வேறான' அல்லது 'அப்பாற்பட்ட' என்பதும் மொழியியல் சாத்தியம் என்பதால் அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
- source_word: εὐηγγελισάμεθα
  choice: நற்செய்தியாக அறிவித்த
  rationale: முந்தைய εὐαγγελίζηται என்பதுடனான சொற்பொருள் தொடர்பை வெளிப்படையாகப் பேணுகிறது; தமிழில் இந்த மீளுரைத்தல் தெளிவாக உள்ளது.
- source_word: ἀνάθεμα ἔστω
  choice: அவன் சபிக்கப்பட்டவனாக இருக்கட்டும்
  rationale: சாபத் தீர்ப்பின் கடுமையையும் விருப்ப/கட்டளைத் தன்மையையும் நவீன, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது; பிற்கால திருச்சபைத் தொழில்நுட்பப் பொருளைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: பவுலின் சாபச் சூத்திரத்தின் பொருள்
  choice: எதிரான செய்தியை அறிவிப்பவன் சபிக்கப்பட்டவனாக இருக்கட்டும்
  alternative: அவன் சாபத்திற்குள்ளாகட்டும்; அவன் விலக்கப்பட்டவனாக இருக்கட்டும்
  rationale: ἀνάθεμα ἔστω உண்மையான, கடுமையான சாபத் தீர்ப்பைக் குறிக்கிறது. 'சபிக்கப்பட்டவனாக இருக்கட்டும்' அந்த வலிமையைப் பேணுகிறது; அதனை முறையான திருச்சபை நீக்கமாக மட்டும் வரையறுப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, நேரடியான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் வினைச்சொல் வடிவமான ‘நற்செய்தியாக அறிவித்தல்’ இரு இடங்களிலும் பேணப்பட்டு, எச்சரிக்கையின் கடுமை மென்மைப்படுத்தப்படவில்லை.
