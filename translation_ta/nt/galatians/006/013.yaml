source:
  edition: SBLGNT
  text: οὐδὲ γὰρ οἱ ⸀περιτεμνόμενοι αὐτοὶ νόμον φυλάσσουσιν, ἀλλὰ θέλουσιν ὑμᾶς περιτέμνεσθαι ἵνα ἐν τῇ ὑμετέρᾳ σαρκὶ καυχήσωνται.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/013.yaml
  text: For not even those who are circumcised themselves keep the law[a], but they want you to be circumcised so that they may boast in your flesh.
translation:
  language: ta
  text: ஏனெனில், விருத்தசேதனம் செய்யப்பட்டவர்கள்கூட[a] தாங்களே திருச்சட்டத்தைக் கடைப்பிடிப்பதில்லை; ஆனால், உங்கள் உடலில் பெருமைபாராட்டிக்கொள்வதற்காக நீங்கள் விருத்தசேதனம் செய்துகொள்ள வேண்டும் என்று விரும்புகிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விருத்தசேதனம் செய்துகொள்கிறவர்கள்.” கிரேக்கத்தில் பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட நிகழ்காலச் செயப்பாட்டுப் பங்கேற்புவினை உள்ளது; அது “விருத்தசேதனம் செய்யப்படுகிறவர்கள் / விருத்தசேதனம் செய்யப்பட்டவர்கள்” எனப் பொருள்படும்.
    reason: περιτεμνόμενοι என்பதன் நிகழ்காலச் செயப்பாட்டு வடிவத்தையும், தமிழில் சாத்தியமான மாற்றுச் சொல்லாட்சியையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: ஏனெனில், ...கூட ... இல்லை
  rationale: γάρ என்பதன் விளக்கத் தொடர்பை ‘ஏனெனில்’ என்பதும், οὐδέ என்பதன் வலியுறுத்தலை ‘கூட ... இல்லை’ என்ற இயல்பான தமிழ் அமைப்பும் வெளிப்படுத்துகின்றன.
- source_word: οἱ περιτεμνόμενοι
  choice: விருத்தசேதனம் செய்துகொள்கிறவர்கள்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புவினையை நெருக்கமாகப் பிரதிபலிக்கிறது; இவர்களை ‘விருத்தசேதனத்தை ஆதரிப்பவர்கள்’ என்று விளக்கமாக மாற்றவில்லை.
- source_word: αὐτοὶ
  choice: தாங்களே
  rationale: சட்டத்தைக் கடைப்பிடிக்கத் தவறுவது அந்த நபர்களே என்பதைச் சுட்டும் அழுத்தத்தைப் பாதுகாக்கிறது.
- source_word: νόμον φυλάσσουσιν
  choice: திருச்சட்டத்தைக் கடைப்பிடிப்பதில்லை
  rationale: நியாயப்பிரமாணத்திற்குக் கீழ்ப்படிந்து நடப்பதைக் குறிக்கும் இயல்பான நவீனத் தமிழ்; ‘திருச்சட்டம்’ இச்சூழலில் தேவனுடைய சட்டத்தைக் கண்ணியமாகக் குறிக்கிறது.
- source_word: ἀλλὰ θέλουσιν
  choice: மாறாக, ... விரும்புகிறார்கள்
  rationale: ἀλλά குறிக்கும் முரண்பாட்டையும் θέλω குறிக்கும் விருப்பத்தையும் தெளிவாகக் காக்கிறது.
- source_word: ὑμᾶς περιτέμνεσθαι
  choice: நீங்கள் விருத்தசேதனம் செய்துகொள்ள வேண்டும்
  rationale: தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது; விருத்தசேதனம் பெறுவதே வாக்கியத்தின் பொருள் என்பதை வெளிப்படுத்துகிறது.
- source_word: ἵνα
  choice: '...வதற்காக'
  rationale: இச்செயலை அவர்கள் விரும்புவதன் நோக்கத்தைத் தெளிவாகக் குறிக்கிறது.
- source_word: ἐν τῇ ὑμετέρᾳ σαρκὶ
  choice: உங்களுடைய சதையில்
  rationale: σάρξ என்பதன் இங்குள்ள நேரடியான உடல்சார் பொருளையும் ἐν என்பதன் சொற்றொடர் வடிவையும் பாதுகாக்கிறது; ‘பாவ இயல்பு’ என்ற பொருளை இறக்குமதி செய்யவில்லை.
- source_word: καυχήσωνται
  choice: பெருமைபாராட்டிக்கொள்வதற்காக
  rationale: காணக்கூடிய சாதனையைத் தங்களுக்கான பெருமையாகக் கூறிக்கொள்ளும் எதிர்மறையான சொல்லாட்சியை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இச்சூழலில் σάρξ என்பதன் பொருள்
  choice: விருத்தசேதனத்தின் உடல்சார் அடையாளம் அமைந்துள்ள நேரடியான ‘சதை’
  alternative: ‘பாவ இயல்பு’ என்ற உருவகப் பொருள்
  rationale: உடனடிச் சூழல் விருத்தசேதனத்தைப் பற்றியது. ஆகவே இங்கு σάρξ உடலையே குறிக்கிறது; ‘பாவ இயல்பு’ என்பது இவ்வசனம் ஆதரிக்காத இறையியல் விளக்கத்தைச் சேர்த்துவிடும்.
- issue: περιτεμνόμενοι என்ற பங்கேற்புவினையின் விசை
  choice: விருத்தசேதனம் செய்துகொள்கிறவர்கள் என்ற விளக்க அடையாளம்
  alternative: விருத்தசேதனத்தைப் பரப்புகிறவர்கள்
  rationale: பரந்த சூழலில் அவர்கள் விருத்தசேதனத்தை வலியுறுத்தினாலும், இச்சொல் அவர்களை அந்தச் செயல் அல்லது நிலையின் அடிப்படையில் அடையாளப்படுத்துகிறது. எனவே பரப்புரையாளர்கள் என்று மட்டும் சுருக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘விருத்தசேதனம்’ மற்றும் ‘திருச்சட்டம்’ ஆகியவை வேதாகமச் சூழலைத் தெளிவாக வைத்திருக்கின்றன. ‘சதை’ என்பது இங்கு வேண்டுமென்றே நேரடியாக வைக்கப்பட்டுள்ளது; உடலை மட்டும் குறிக்கும் பொருளை மென்மைப்படுத்தி மறைக்கவோ, ‘பாவ இயல்பு’ என இறையியல் விளக்கமாக மாற்றவோ இல்லை.
