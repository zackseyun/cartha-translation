translation:
  language: ta
  text: வார்த்தையில் போதனை பெறுகிறவர், தமக்குப் போதிப்பவருடன் எல்லா நல்லவற்றையும் பகிர்ந்துகொள்ளட்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தமக்குப் போதிப்பவருடன் எல்லா நன்மைகளிலும் பங்குகொள்ளட்டும்.” இதில் பொருளாதார உதவியும் அடங்கியிருக்கலாம்.
    reason: κοινωνέω மற்றும் ἐν πᾶσιν ἀγαθοῖς ஆகியவற்றை “பங்குகொள்ளுதல்” என்ற விரிவான பொருளில் மொழிபெயர்க்கக்கூடிய மாற்றைச் சுட்டுகிறது; முக்கிய உரை நல்லவற்றைப் பகிர்வதைத் தெளிவாகக் காட்டுகிறது.
lexical_decisions:
- source_word: Κοινωνείτω
  choice: பங்குகொள்ளட்டும்
  rationale: நிகழ்காலக் கட்டளை வடிவம் தொடர்ந்து கடைப்பிடிக்க வேண்டிய நடைமுறையைக் குறிக்கிறது. ‘பங்குகொள்ளட்டும்’ என்பது பொதுவான பங்கேற்பையும் நடைமுறை அல்லது பொருளாதாரப் பகிர்வையும் உள்ளடக்கக்கூடியதால் மூலத்தின் பொருள் அகலத்தைப் பாதுகாக்கிறது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: δέ இங்கு வலுவான எதிர்மறையைக் காட்டாமல் மென்மையான உரைத் தொடர்ச்சியை மட்டுமே குறிக்கிறது. தமிழில் செயற்கையான ‘இப்போது’ அல்லது தேவையற்ற ‘ஆனால்’ சேர்க்காமல் இயல்பான தொடராக அமைக்கப்பட்டுள்ளது.
- source_word: ὁ κατηχούμενος τὸν λόγον
  choice: வார்த்தையைப் பற்றிப் போதனை பெறுகிறவர்
  rationale: செயப்பாட்டு நிகழ்காலப் பெயரெச்சம் போதனையைப் பெற்றுக்கொண்டிருப்பவரைக் குறிக்கிறது. ‘வார்த்தை’ λόγος என்பதன் பரிச்சயமான வடிவத்தைப் பேணுகிறது; ‘பற்றிப்’ என்பது தமிழில் கற்பித்தலின் உள்ளடக்கத்தை இயல்பாகக் காட்டுகிறது.
- source_word: τῷ κατηχοῦντι
  choice: தமக்குப் போதிக்கிறவருடன்
  rationale: செய்வினை நிகழ்காலப் பெயரெச்சம் போதிப்பவரைக் குறிக்கிறது. ‘தமக்கு’ என்பது போதனை பெறுகிறவருக்கும் போதிப்பவருக்கும் உள்ள தொடர்பைத் தெளிவாக்குகிறது; ‘உடன்’ κοινωνέω வினையின் பகிர்வு உறவை வெளிப்படுத்துகிறது.
- source_word: ἐν πᾶσιν ἀγαθοῖς
  choice: எல்லா நன்மைகளிலும்
  rationale: கிரேக்கத் தொடரின் பரந்த தன்மையைப் பேணி, நன்மையான பொருட்கள், நடைமுறை உதவி, பொருளாதார ஆதரவு ஆகியவற்றுள் ஒன்றாக மட்டும் பொருளைக் குறுக்காமல் விடுகிறது.
theological_decisions:
- issue: கட்டளையிடப்பட்ட பங்குபெறுதலின் இயல்பு
  choice: போதனை பெறுகிறவர், போதிப்பவருடன் எல்லா நன்மைகளிலும் பங்குகொள்ள வேண்டும்; இதில் பொருளாதார அல்லது நடைமுறை ஆதரவும் அடங்கியிருக்கலாம்.
  alternative: இது பொருளாதார ஆதரவைக் குறிக்காமல் ஆன்மீக ஐக்கியத்தை மட்டும் குறிக்கிறது.
  rationale: κοινωνέω என்பதுடன் போதிப்பவரைக் குறிக்கும் நான்காம் வேற்றுமையும் ‘எல்லா நன்மைகளிலும்’ என்ற தொடரும் வருவதால் நடைமுறைப் பகிர்வு, குறிப்பாக பொருளாதார ஆதரவு, இயல்பாக உள்ளடங்குகிறது. ஆயினும் வசனம் அதை பண உதவியாக மட்டும் வரையறுக்காததால் மொழிபெயர்ப்பு அந்த அகலத்தையும் இறையியல் இழுபறியையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், மரியாதையும் எளிமையும் கொண்ட நடையில் அமைக்கப்பட்டுள்ளது. ‘வார்த்தை’ என்ற பவுலின் பரிச்சயமான சொல்லாட்சி பேணப்பட்டுள்ளது; பின்னாளைய தொழில்நுட்பத் திருச்சபைச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
