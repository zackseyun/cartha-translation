revisions:
- from: வார்த்தையைப் பற்றிப் போதனை பெறுகிறவர், தமக்குப் போதிக்கிறவருடன் எல்லா நன்மைகளிலும் பங்குகொள்ளட்டும்.[a]
  to: வார்த்தையில் போதனை பெறுகிறவர், தமக்குப் போதிப்பவருடன் எல்லா நல்லவற்றையும் பகிர்ந்துகொள்ளட்டும்.[a]
  rationale: முக்கிய உரையில் “நல்லவற்றை ... பகிர்ந்துகொள்ளுதல்” என்பதைப் பயன்படுத்துவது, போதனை பெறுபவர் போதிப்பவருடன் நல்லவற்றைப் பகிர வேண்டும் என்ற கிரேக்க வாக்கியத்தின் இயல்பான பொருளைத் தெளிவாகக் காட்டுகிறது. இது பொருளாதார ஆதரவை மட்டுமே கட்டாயப்படுத்தாமல், வெளிப்பாட்டின் பரந்த தன்மையைப் பாதுகாக்கிறது. அடிக்குறிப்பு “எல்லா நன்மைகளிலும் பங்குகொள்ளுதல்” என்ற நெருக்கமான, விரிவான மாற்றைத் தக்கவைக்கிறது.
