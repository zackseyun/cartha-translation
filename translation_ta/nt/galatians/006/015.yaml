  text: ⸂οὔτε γὰρ⸃ περιτομή τί ⸀ἐστιν οὔτε ἀκροβυστία, ἀλλὰ καινὴ κτίσις.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/015.yaml
  text: For neither circumcision counts for anything[a], nor uncircumcision[b], but a new creation.
translation:
  language: ta
  text: ஏனெனில், விருத்தசேதனமும் ஒரு பொருட்டல்ல[a]; விருத்தசேதனம் இல்லாமையும் ஒரு பொருட்டல்ல; புதிய படைப்பே பொருட்டு[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எந்த மதிப்பும் இல்லை.’
    reason: lexical_alternative
  - marker: b
    text: ‘புதிய படைப்பு’ என்ற சொற்றொடரை வினைச்சொல் சேர்க்காமல் ‘ஆனால் புதிய படைப்பு’ என்றும் மிக நெருக்கமாக மொழிபெயர்க்கலாம்; இச்சூழலில் வாய்ப்பு குறைவாக இருந்தாலும், ‘புதிதாகப் படைக்கப்பட்ட ஒருவர்’ என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε γὰρ
  choice: ஏனெனில் ... அல்ல
  rationale: γάρ முந்தைய கருத்திற்கான விளக்கத் தொடர்பைச் சுட்டுவதால் ‘ஏனெனில்’ என மொழிபெயர்க்கப்பட்டது; οὔτε ... οὔτε என்ற இணை அமைப்பு தமிழில் இரு கூறுகளிலும் ‘அல்ல’ என இயல்பாகக் கொடுக்கப்பட்டது.
- source_word: περιτομή
  choice: விருத்தசேதனம்
  rationale: உடல்சார்ந்த சடங்கையும் அதனால் குறிக்கப்படும் உடன்படிக்கை அடையாளத்தையும் தக்கவைக்கும், நவீனத் தமிழில் நிலைபெற்ற வேதாகமச் சொல்.
- source_word: τί ἐστιν
  choice: ஒரு பொருட்டல்ல
  rationale: இங்கு இந்தச் சொற்றொடர் ‘எதுவுமாக இல்லை’ என்பதைக் காட்டிலும் தீர்மானிக்கும் மதிப்போ முக்கியத்துவமோ இல்லை என்ற பொருளைத் தருகிறது; ‘ஒரு பொருட்டல்ல’ என்பது தமிழில் இயல்பாகவும் சுருக்கமாகவும் அதை வெளிப்படுத்துகிறது.
- source_word: οὔτε ἀκροβυστία
  choice: விருத்தசேதனம் இல்லாமையும் ஒரு பொருட்டல்ல
  rationale: ἀκροβυστία இங்கு உடற்கூற்றைக் குறிப்பதல்ல; விருத்தசேதனம் செய்யப்படாத புறவினத்தார் நிலையைக் குறிக்கிறது. ஆகவே ‘விருத்தசேதனம் இல்லாமை’ சூழலுக்கேற்றது.
- source_word: ἀλλὰ
  choice: ; ... ஏ
  rationale: தமிழில் எதிர்மறையாக மறுக்கப்பட்ட இரு நிலைகளுக்கு மாறாக உண்மையில் பொருட்படும் ஒன்றை வலியுறுத்த, தனி வாக்கியப் பகுதியும் ‘ஏ’ விகுதியும் பயன்படுத்தப்பட்டன.
- source_word: καινὴ κτίσις
  choice: புதிய படைப்பு
  rationale: κτίσις என்பதற்கு ‘படைப்பு’ அல்லது ‘படைக்கப்பட்ட உயிர்’ என்ற பொருள் இருக்கலாம். இச்சூழலில் ‘புதிய படைப்பு’ என்பது பவுலின் விரிவான புதுப்பித்தல் கருத்தைத் தக்கவைத்து, தனிநபரை மட்டும் குறிப்பதாகச் சுருக்கிவிடாமல் காக்கிறது.
theological_decisions:
- issue: விருத்தசேதனம், விருத்தசேதனம் இல்லாமை ஆகியவற்றுக்கும் புதிய படைப்புக்கும் இடையிலான முரண்
  choice: இரு சடங்கு/அடையாள நிலைகளும் தீர்மானிக்கும் பொருட்டல்ல; புதிய படைப்பே பொருட்டு என்று உரை கூறுகிறது.
  alternative: இது சமூக அடையாளங்களைப் பற்றி மட்டுமே பேசுகிறது; அல்லது இரு நிலைகளும் சமமான இரட்சிப்பு வழிகள் என்று எடுத்துக்கொள்வது.
  rationale: கிரேக்க உரை இரு நிலைகளையும் ஒரேபோல் மறுத்து, அவற்றுக்கு மாறாக ‘புதிய படைப்பு’ என்பதை நிறுத்துகிறது. மொழிபெயர்ப்பு இந்த முரணைத் தக்கவைக்கிறது; ஆனால் உரையில் இல்லாத சமயக்கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
- issue: καινὴ κτίσις என்பது ‘புதிய படைப்பு’தானா அல்லது ‘புதிதாகப் படைக்கப்பட்ட ஒருவர்’தானா
  choice: புதிய படைப்பு
  alternative: புதிதாகப் படைக்கப்பட்ட ஒருவர்
  rationale: கிரேக்கச் சொற்றொடர் இரு பொருளுக்கும் இடமளிக்கக்கூடும். பவுலின் இச்சூழலில் விரிவான ‘புதிய படைப்பு’ வாசிப்பு அதிகம் பொருந்துகிறது; குறைந்த வாய்ப்புள்ள தனிநபர் வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘விருத்தசேதனம்’ என்பது தொழில்நுட்பமானாலும் தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் நிலைபெற்ற சொல். கிரேக்கத்தின் வினையற்ற இறுதி எதிர்மறை அமைப்பை இயல்பான தமிழாக்கமாக்க ‘பொருட்டு’ ஒருமுறை நிரப்பப்பட்டது; இதனால் புதிய படைப்பின் முக்கியத்துவம் வெளிப்படுகிறது, ஆனால் அதன் இயல்பைப் பற்றிய கூடுதல் கோட்பாடு சேர்க்கப்படவில்லை.
