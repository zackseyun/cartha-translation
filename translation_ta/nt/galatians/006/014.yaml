source:
  edition: SBLGNT
  text: ἐμοὶ δὲ μὴ γένοιτο καυχᾶσθαι εἰ μὴ ἐν τῷ σταυρῷ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ ἐμοὶ κόσμος ἐσταύρωται ⸀κἀγὼ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/014.yaml
  text: But far be it from me to boast except in the cross of our Lord Jesus the Messiah[a], through which the world has been crucified to me[b], and I to the world.
translation:
  language: ta
  text: நானோ, நம் ஆண்டவராகிய இயேசு மேசியாவின் சிலுவையைத் தவிர வேறு எதைக் குறித்தும் பெருமைபாராட்டுவது எனக்கு ஒருபோதும் ஆகாதிருக்கட்டும். அந்தச் சிலுவையின் மூலமாக[a] உலகம் எனக்குச் சிலுவையில் அறையப்பட்டிருக்கிறது; நானும் உலகத்திற்குச் சிலுவையில் அறையப்பட்டிருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவரின் மூலமாக’ என்றும் மொழிபெயர்க்கலாம்; இவ்வாறு எடுத்தால் தொடர்புப்பெயர் சிலுவையைக் குறிக்காமல் ஆண்டவராகிய இயேசு மேசியாவைக் குறிக்கும்.
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: பெருமைபாராட்டாதிருப்பேனாக
  rationale: வலுவான தனிப்பட்ட மறுப்பைத் தமிழில் இயல்பான விருப்பவினை வடிவில் தருகிறது; ‘ஒருபோதும் நிகழாதிருக்கட்டும்’ என்ற சொற்சொல் மொழிபெயர்ப்பின் செயற்கைத்தன்மையைத் தவிர்க்கிறது.
- source_word: καυχᾶσθαι
  choice: பெருமைபாராட்ட
  rationale: தன்னுடைய பெருமைக்கான ஆதாரமாக ஒன்றை உயர்த்திப் பேசுதல் என்ற பவுலின் சொல்லாட்சியைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: εἰ μὴ
  choice: தவிர வேறு எதைக் குறித்தும்
  rationale: சிலுவை மட்டுமே முறையான பெருமைக்குரிய ஆதாரம் என்ற விலக்குப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: σταυρῷ
  choice: சிலுவை
  rationale: புதிய ஏற்பாட்டின் சிலுவை மரணச் சூழலுக்கு நிலைபெற்ற, இயல்பான தமிழ் இணைச்சொல்.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: κύριος என்பதன் மரியாதைமிக்க மற்றும் ஒப்புதல் சார்ந்த புதிய ஏற்பாட்டுப் பயன்பாட்டைத் தருகிறது.
- source_word: Χριστοῦ
  choice: மேசியா
  rationale: Χριστός என்பதன் பட்டப்பெயர் சார்ந்த பொருளை மொழிபெயர்க்கிறது; அதை வெறும் பெயராக ஒலிபெயர்ப்பதைத் தவிர்க்கிறது.
- source_word: δι’ οὗ
  choice: அந்தச் சிலுவையின் மூலமாக
  rationale: அருகிலுள்ள இலக்கண முன்னிலையான σταυρῷ-ஐச் சுட்டுவதாக எடுத்துக்கொண்டு கருவிப்பொருளைத் தெளிவாகத் தருகிறது; மாற்று முன்னிலை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: κόσμος
  choice: உலகம்
  rationale: தேவனுக்கு எதிராக நிற்கும் உலக ஒழுங்கையும் உள்ளடக்கக்கூடிய, பரந்த மற்றும் வழக்கமான தமிழ் இணைச்சொல்.
- source_word: ἐσταύρωται
  choice: சிலுவையில் அறையப்பட்டிருக்கிறது
  rationale: நிறைவேறிய செயலின் தொடரும் விளைவை உணர்த்தும் கிரேக்க நிறைவுக்காலத்தையும் சிலுவை உருவகத்தையும் காக்கிறது.
- source_word: κἀγὼ κόσμῳ
  choice: நானும் உலகத்திற்குச் சிலுவையில் அறையப்பட்டிருக்கிறேன்
  rationale: கிரேக்கத்தில் விடுபட்டுள்ள வினையை முந்தைய கூறிலிருந்து தமிழில் வெளிப்படையாக நிரப்பி, இணையான இரு உறவுகளையும் தெளிவாக்குகிறது.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ என்பதில் Χριστοῦ-வின் நிலை
  choice: இயேசு மேசியா
  alternative: இயேசு கிறிஸ்து
  rationale: இங்கு Χριστός பட்டப்பெயர் சார்ந்த பொருளைக் கொண்டிருப்பதால் ‘மேசியா’ என்று பொருள்மொழிபெயர்க்கப்படுகிறது; ஒரு குறிப்பிட்ட சமயப் பிரிவின் விளக்கத்தை இதில் சேர்க்கவில்லை.
- issue: δι’ οὗ என்பதன் முன்னிலைச் சொல்
  choice: 'சிலுவை முன்னிலை: ‘அந்தச் சிலுவையின் மூலமாக’'
  alternative: 'ஆண்டவராகிய இயேசு மேசியா முன்னிலை: ‘அவரின் மூலமாக’'
  rationale: σταυρῷ அருகிலுள்ளதும் இலக்கணப் பாலிலும் எண்ணிலும் பொருந்துவதுமாக இருப்பதால் முதன்மை உரையில் சிலுவை முன்னிலையாக எடுக்கப்படுகிறது. எனினும் வடிவரீதியாக κύριος/Ἰησοῦ Χριστοῦ-ஐச் சுட்டும் சாத்தியத்தை முற்றிலும் நீக்க முடியாததால் அது அடிக்குறிப்பில் தரப்படுகிறது.
- issue: உலகத்துக்கும் பவுலுக்கும் இடையிலான பரஸ்பர சிலுவை உறவு
  choice: இரு கூறுகளிலும் ‘சிலுவையில் அறையப்பட்டிருக்கிறது/இருக்கிறேன்’ என்பதை வெளிப்படையாகக் கூறுதல்
  alternative: இரண்டாம் கூறில் வினையை விடுத்து ‘நானும் உலகத்திற்கு’ என அமைத்தல்
  rationale: கிரேக்கத்தின் சுருக்கமான இணை அமைப்பைப் பொருளில் காத்தபடி, தமிழில் தவறான புரிதல் ஏற்படாத வகையில் விடுபட்ட வினை நிரப்பப்படுகிறது; உருவகத்தின் இறையியல் பதற்றம் விளக்கி மென்மையாக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையுடன் வடிவமைக்கப்பட்டது. ‘நானோ’ என்பது ἐμοὶ δέ-யின் எதிர்மறை வலியுறுத்தலைக் காக்கிறது. சிலுவை உருவகமும் நிறைவுக்காலத்தின் தொடரும் விளைவும் விளக்கவுரை சேர்க்காமல் பாதுகாக்கப்பட்டுள்ளன.
