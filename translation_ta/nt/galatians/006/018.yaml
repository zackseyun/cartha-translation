  text: Ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μετὰ τοῦ πνεύματος ὑμῶν, ἀδελφοί· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/018.yaml
  text: The grace of our Lord Jesus Christ be with your spirit[a], brothers[b]. Amen.
translation:
  language: ta
  text: நம்முடைய ஆண்டவராகிய இயேசு மேசியாவின்[a] அருள் உங்கள் ஆவியோடு இருப்பதாக, சகோதரர்களே[b]. ஆமென்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மரபாக, “இயேசு கிறிஸ்துவின்” என்றும் மொழிபெயர்க்கப்படுகிறது. கிரேக்க Χριστός என்பது “மேசியா,” அதாவது “அபிஷேகம் செய்யப்பட்டவர்” என்னும் பட்டம்.
    reason: lexical_alternative
  - marker: b
    text: “சகோதரர்களே” என்பது இங்கு விசுவாசிகள் அனைவரையும் நோக்குகிறது; பெண்களையும் உள்ளடக்கக்கூடும். மாற்றாக, “சகோதர சகோதரிகளே.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: அருள்
  rationale: பவுலின் ஆசீர்வாத நிறைவுரைகளில் வரும் சொல்லின் இறையியல் செறிவையும் தமிழில் இயல்பான வாழ்த்துமுறையையும் காக்கிறது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான மரியாதைமிக்க, வழக்கமான தமிழ் இணைச்சொல்; இங்கு இயேசுவுக்குரிய பட்டமாகப் பயன்படுகிறது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மேசியா
  rationale: Ἰησοῦ என்பது பெயராகவும் Χριστός என்பது ‘அபிஷேகம் செய்யப்பட்டவர்/மேசியா’ என்ற பட்டமாகவும் இருப்பதை வெளிப்படுத்துகிறது; மரபான ‘இயேசு கிறிஸ்து’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: μετὰ
  choice: உங்கள் ஆவியோடு இருப்பதாக
  rationale: கிரேக்கத்தில் வினைச்சொல் வெளிப்படையாக இல்லாத ஆசீர்வாத வாக்கியம் இது; இயல்பான தமிழுக்காக ‘இருப்பதாக’ சேர்க்கப்பட்டுள்ளது.
- source_word: πνεύματος ὑμῶν
  choice: உங்கள் ஆவியோடு
  rationale: பன்மையினரை நோக்கும் ὑμῶν என்பதையும் ஒருமை πνεύματος என்பதையும் அப்படியே காக்கிறது; ‘உங்களோடு’ என்று பொதுமைப்படுத்தவில்லை.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: மூலத்தின் ஆண்பால் பன்மை விளிப்பைத் தக்கவைக்கிறது; முழு விசுவாசக் குழுவையும், பெண்கள் உட்பட, குறிக்கக்கூடிய பயன்பாடு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ἀμήν
  choice: ஆமென்
  rationale: வழிபாட்டு நிறைவுச் சொல்லுக்கான தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
theological_decisions:
- issue: Χριστός என்பதை பவுலின் நிறைவு ஆசீர்வாதத்தில் எவ்வாறு மொழிபெயர்ப்பது
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: Χριστός இங்கு வெறும் பெயரின் இரண்டாம் கூறாக இல்லாமல் பட்டத்தின் பொருளையும் தாங்குகிறது. ‘மேசியா’ அந்தப் பொருளை வெளிப்படுத்துகிறது; பழக்கமான மரபு வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: கலப்பு விசுவாசக் குழுவை நோக்கும் ἀδελφοί என்பதன் மொழிபெயர்ப்பு
  choice: சகோதரர்களே
  alternative: சகோதர சகோதரிகளே
  rationale: கிரேக்க வடிவத்தின் ஆண்பால் பன்மையை முதன்மை உரை காக்கிறது; அது பெண்களையும் உள்ளடக்கிய முழுச் சபையைக் குறிக்கக்கூடும் என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: πνεύματος ὑμῶν என்பதில் ஒருமை ‘ஆவி’யைத் தக்கவைத்தல்
  choice: உங்கள் ஆவியோடு
  alternative: உங்களோடு
  rationale: பவுலின் குறிப்பிட்ட சொற்றொடரையும், பலரிடம் சொல்லப்படும் ஒருமை ‘ஆவி’ ஏற்படுத்தும் கூட்டுத் தன்மை அல்லது தனிநபர் சார்ந்த சாத்தியமான நுணுக்கத்தையும் தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதைமிக்க, சுருக்கமான ஆசீர்வாத நிறைவுரையாக வடிவமைக்கப்பட்டுள்ளது. ‘இருப்பதாக’ என்பது கிரேக்கத்தில் மறைந்துள்ள வாழ்த்து வினையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘உங்கள் ஆவி’ என்ற மூலத்தின் ஒருமை அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
