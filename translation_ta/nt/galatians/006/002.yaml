  source_fidelity: மூலக் கிரேக்கத்தின் பரஸ்பரக் குறிப்பு (ἀλλήλων), ‘சுமைகள்’ என்ற பன்மை (τὰ βάρη), நிகழ்காலப் பன்மைக் கட்டளை (βαστάζετε), விளைவு-இணைப்பு (οὕτως), மற்றும் எதிர்கால வினை (ἀναπληρώσετε) ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. ‘மேசியாவின் சட்டம்’ என்பது τοῦ Χριστοῦ-இன் விளக்கப்படுத்தப்படாத உறவை மிகைப்படுத்தாமல் பாதுகாக்கிறது.
