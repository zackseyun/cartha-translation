source:
  edition: SBLGNT
  text: ἀλλήλων τὰ βάρη βαστάζετε, καὶ οὕτως ⸀ἀναπληρώσετε τὸν νόμον τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/002.yaml
  text: Carry one another’s burdens[a], and in this way you will fulfill the law of Messiah.
translation:
  language: ta
  text: ஒருவருக்கொருவர் சுமைகளைச் சுமந்துகொள்ளுங்கள்; இவ்வாறு நீங்கள் மேசியாவின் சட்டத்தை[a] நிறைவேற்றுவீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “கிறிஸ்துவின் சட்டத்தை.”'
    reason: Χριστός என்ற பட்டத்திற்கான தமிழ்க் கிறிஸ்தவ மரபில் பரவலாக உள்ள மாற்று வடிவம்.
lexical_decisions:
- source_word: ἀλλήλων
  choice: ஒருவருக்கொருவர்
  rationale: சமூகத்தினரிடையே இருக்க வேண்டிய பரஸ்பரச் செயலைத் தெளிவாகவும் இயல்பான நவீனத் தமிழிலும் தெரிவிக்கிறது.
- source_word: τὰ βάρη
  choice: சுமைகளை
  rationale: βάρη என்பதன் அடிப்படைப் படிமமான பாரத்தையும், இங்கு குறிக்கப்படும் பிறரின் துன்பங்கள், நெருக்கடிகள், பொறுப்புகள் ஆகிய விரிந்த பொருளையும் காக்கிறது.
- source_word: βαστάζετε
  choice: சுமந்துகொள்ளுங்கள்
  rationale: பன்மை நிகழ்காலக் கட்டளையின் தொடர்ச்சியான செயல் வலிமையைத் தக்கவைக்கிறது; ‘சுமைகள்’ என்பதோடு இயல்பாக இணைகிறது.
- source_word: οὕτως
  choice: இவ்வாறு
  rationale: முந்தைய கட்டளையைத் தொடர்ந்து வரும் விளைவோடு நேரடியாக இணைக்கிறது; ‘இப்படிச் செய்வதன் மூலம்’ என்று விரித்துரைக்காமல் சுருக்கத்தைக் காக்கிறது.
- source_word: ἀναπληρώσετε
  choice: நிறைவேற்றுவீர்கள்
  rationale: எதிர்காலக் குறிப்பு வினையைத் தக்கவைத்து, νόμος என்பதோடு தமிழில் இயல்பாகப் பயன்படும் ‘நிறைவேற்று’ என்பதைப் பயன்படுத்துகிறது.
- source_word: νόμον
  choice: சட்டத்தை
  rationale: ‘கொள்கை’ என்று பொருளைச் சுருக்காமல், νόμος என்பதன் நேரடியான சட்ட/கட்டளைச் சார்பை நவீனத் தமிழில் காக்கிறது.
- source_word: τοῦ Χριστοῦ
  choice: மேசியாவின்
  rationale: Χριστός இங்கு ‘சட்டம்’ என்பதை உரிமை அல்லது தொடர்பு அடிப்படையில் வரையறுக்கும் பட்டமாக இருப்பதால், அதன் மேசியத் தன்மையை வெளிப்படையாகக் காட்டுகிறது.
theological_decisions:
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மேசியாவின்
  alternative: கிறிஸ்துவின்
  rationale: இங்கு Χριστός ஒரு பட்டமாகச் செயல்படுவதால் அதன் பொருளை மொழிபெயர்த்து யூத மேசியச் சூழலைக் காக்கிறது. தமிழ்க் கிறிஸ்தவ மரபில் பரவலாக உள்ள ‘கிறிஸ்து’ என்ற வடிவம் அடிக்குறிப்பில் மாற்றாக வழங்கப்படுகிறது.
- issue: ‘மேசியாவின் சட்டம்’ என்பதிலுள்ள உறவின் தன்மை
  choice: மூலத்தின் பொதுவான உடைமைத் தொடர்பை அப்படியே வைத்தல்
  alternative: மேசியா கொடுத்த சட்டம் / மேசியாவுக்குரிய சட்டம்
  rationale: τοῦ Χριστοῦ என்பது சட்டம் மேசியாவால் கொடுக்கப்பட்டதா, அவருக்குரியதா, அல்லது அவரால் வடிவமைக்கப்பட்டதா என்பதைத் தனியாகத் தீர்மானிக்கவில்லை. ஆகவே விளக்கத்தை உரைக்குள் சேர்க்காமல் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. பாரம்பரியமான ஆனால் இன்றைய பொதுப் பயன்பாட்டில் கடினமாகத் தோன்றக்கூடிய ‘நியாயப்பிரமாணம்’ என்பதற்குப் பதிலாக ‘சட்டம்’ தேர்ந்தெடுக்கப்பட்டுள்ளது; மூலத்தின் சுமைச் சொல்லுருவும் எதிர்கால வினையும் காக்கப்பட்டுள்ளன.
