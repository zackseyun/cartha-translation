  text: Ἴδετε πηλίκοις ὑμῖν γράμμασιν ἔγραψα τῇ ἐμῇ χειρί.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/011.yaml
  text: See with what large letters I have written to you with my own hand[a].
translation:
  language: ta
  text: நான் என் சொந்தக் கையால் எவ்வளவு பெரிய எழுத்துகளில் உங்களுக்கு எழுதியிருக்கிறேன் என்று பாருங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் என் சொந்தக் கையால் எவ்வளவு நீளமான கடிதத்தை உங்களுக்கு எழுதியிருக்கிறேன் என்று பாருங்கள்.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἴδετε
  choice: பாருங்கள்
  rationale: இது பன்மை ஏவல்வினையாகக் கவனத்தை ஈர்க்கிறது. ‘பாருங்கள்’ என்பது நேரடியும் இயல்பானதுமான தமிழ் வடிவம்.
- source_word: πηλίκοις
  choice: எவ்வளவு பெரிய
  rationale: இந்தச் சொல் அளவையோ பருமனையோ குறிக்கலாம். γράμμασιν என்பதுடன் சேர்ந்திருப்பதால் எழுத்துருக்களின் பெரிய அளவைக் குறிப்பது முதன்மையான வாசிப்பு.
- source_word: γράμμασιν
  choice: எழுத்துகளில்
  rationale: இங்கு பன்மை வடிவம் எழுத்துமுறையின் தனித்தனி எழுத்துகள் அல்லது எழுத்துருக்களைக் குறிக்கிறது; கடிதத்தை மட்டுமே குறிக்க வேண்டியதில்லை.
- source_word: ὑμῖν
  choice: உங்களுக்கு
  rationale: இது ἔγραψα என்பதன் மறைமுகச் செயப்படுபொருளாக இருந்து, எழுதப்பட்டவர்கள் கலாத்தியர்கள் என்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἔγραψα
  choice: எழுதியிருக்கிறேன்
  rationale: கிரேக்க இறந்தகால வடிவம் எழுதப்பட்டு தற்போது வாசகர்கள்முன் நிற்கும் உரையைச் சுட்டுவதால், தமிழில் நிறைவுற்ற தற்போதைய விளைவைக் காட்டும் இவ்வடிவம் இயல்பாக உள்ளது.
- source_word: τῇ ἐμῇ χειρί
  choice: என் சொந்தக் கையால்
  rationale: கருவிப் பொருளுடைய இச்சொற்றொடர் பவுலே தனிப்பட்ட முறையில் எழுதியதை வலியுறுத்துகிறது; ἐμῇ என்பதன் அழுத்தத்தை ‘சொந்த’ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: πηλίκοις γράμμασιν என்பதன் பொருள்
  choice: எழுத்துருக்களின் பெரிய அளவு
  alternative: நான் உங்களுக்கு எவ்வளவு நீளமான கடிதம் எழுதியிருக்கிறேன்
  rationale: γράμματα என்பதன் வழக்கமான பொருளும் ‘என் சொந்தக் கையால்’ என்ற உடனடிச் சூழலும் கையெழுத்தின் எழுத்தளவைக் குறிக்கும் வாசிப்பை ஆதரிக்கின்றன. எனினும், கடிதத்தின் நீளத்தைக் குறிக்கும் விளக்கத்திற்கும் வரலாற்று ஆதரவு இருப்பதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் நேரடியான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. மூலத்தின் கவன ஈர்ப்பும் ‘என் சொந்தக் கையால்’ என்பதிலுள்ள வலியுறுத்தலும் காக்கப்பட்டுள்ளன; உண்மையான பொருள் இருமை அடிக்குறிப்பில் தரப்பட்டுள்ளது.
