source:
  edition: SBLGNT
  text: καὶ ὅσοι τῷ κανόνι τούτῳ στοιχήσουσιν, εἰρήνη ἐπ’ αὐτοὺς καὶ ἔλεος, καὶ ἐπὶ τὸν Ἰσραὴλ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/016.yaml
  text: And as many as will walk by this rule—peace be upon them and mercy[c][b][a], and upon the Israel of God.
translation:
  language: ta
  text: இந்த நெறியின்படி நடப்பவர்கள் அனைவர்மேலும்[a] சமாதானமும் இரக்கமும் உண்டாவதாக; மேலும்[c] தேவனுடைய இஸ்ரவேலின்மேலும்[b] உண்டாவதாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த அளவுகோலைப் பின்பற்றும் அனைவர்மேலும்.” இங்கு வரும் வினைச்சொல் ஒரு நெறிக்கு ஏற்ப வரிசையாக நடப்பது அல்லது அதனோடு அடியொற்றி நடப்பது என்ற பொருளைக் கொண்டது.
    reason: lexical_alternative
  - marker: b
    text: “தேவனுடைய இஸ்ரவேல்” என்பது விவாதிக்கப்படும் சொற்றொடர். இது நம்பிக்கை கொண்ட யூதர்களையோ, முழுத் திருச்சபையையோ, அல்லது விரிவான பொருளில் தேவனுடைய மக்களையோ குறிக்கலாம். கிரேக்கச் சொற்றொடரின் தெளிவின்மையை மொழிபெயர்ப்பு தக்கவைக்கிறது.
    reason: alternative_reading
  - marker: c
    text: இறுதியில் வரும் “மேலும்” என்பது வேறொரு குழுவைச் சேர்ப்பதாகவும் (“தேவனுடைய இஸ்ரவேலின்மேலும்”), அதே குழுவை வேறு விதமாகச் சுட்டுவதாகவும் (“அதாவது, தேவனுடைய இஸ்ரவேலின்மேலும்”) புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσοι
  choice: நடப்பவர்கள் அனைவர்மேலும்
  rationale: ὅσοι என்பதன் ‘அவ்வாறு நடக்கும் அனைவரும்’ என்ற விரிவான பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: κανόνι
  choice: நெறி
  rationale: இங்கு κανών என்பது நடத்தையை ஒழுங்குபடுத்தும் அளவுகோல் அல்லது விதிமுறையைக் குறிக்கிறது. ‘நெறி’ என்பது தற்போதைய தமிழில் இயல்பாகவும் கண்ணியமாகவும் இருந்து, ஒழுக்க வழிகாட்டி என்ற பொருளையும் தக்கவைக்கிறது.
- source_word: στοιχήσουσιν
  choice: நெறியின்படி நடப்பவர்கள்
  rationale: στοιχέω என்பதில் ஒரு வரிசை அல்லது அளவுகோலுக்கு ஏற்ப நடப்பது என்ற உருவகம் உள்ளது. ‘நடப்பவர்கள்’ அந்த உருவகத்தையும் பவுலின் ஒழுக்கவியல் பயன்பாட்டையும் தக்கவைக்கிறது; தமிழ் உறவெச்ச வடிவம் சூழலில் எதிர்கால நோக்கையும் இயல்பாக ஏற்கிறது.
- source_word: εἰρήνη
  choice: சமாதானம்
  rationale: ஆசீர்வாத வாழ்த்தில் வரும் εἰρήνη என்பதற்கான தெளிவான, வழக்கமான தமிழ் இணைச்சொல்.
- source_word: ἔλεος
  choice: இரக்கம்
  rationale: ἔλεος என்பதன் கருணைமிக்க தயவு என்ற பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐπ’ αὐτοὺς ... καὶ ἐπὶ
  choice: அனைவர்மேலும் ... மேலும் ... இஸ்ரவேலின்மேலும்
  rationale: ἐπί என்ற முன்னிடைச்சொல்லின் மீளுரைப்பையும் ஆசீர்வாதம் அவர்கள்மேல் இருப்பதாக வேண்டுகின்ற தொனியையும் ‘மேல்’ என்பதன் மூலம் தக்கவைக்கிறது.
- source_word: Ἰσραὴλ τοῦ θεοῦ
  choice: தேவனுடைய இஸ்ரவேல்
  rationale: கிரேக்க உரையின் உரிமைத் தொடர்பை வெளிப்படையாகத் தக்கவைத்து, இந்தச் சொற்றொடர் யாரைக் குறிக்கிறது என்ற விவாதத்தை மொழிபெயர்ப்பிலேயே தீர்மானிக்காமல் விடுகிறது.
theological_decisions:
- issue: ‘தேவனுடைய இஸ்ரவேல்’ யாரைக் குறிக்கிறது
  choice: ‘தேவனுடைய இஸ்ரவேல்’ என்று நேரடியாக மொழிபெயர்த்து, குறிப்பிட்ட ஒரு குழுவாக விளக்கவில்லை.
  alternative: இயேசுவை நம்பும் யூதர்கள்; முழுத் திருச்சபை; அல்லது யூதர், பிற இனத்தார் ஆகிய நம்பிக்கையாளர்கள் அனைவரும் அடங்கிய தேவனுடைய மக்கள் என்று வெளிப்படையாக விளக்குதல்.
  rationale: கிரேக்கச் சொற்றொடரின் குறிப்பு விவாதத்திற்குரியது. எந்த ஒரு இறையியல் முடிவையும் உரைக்குள் புகுத்தாமல் அதன் தெளிவின்மையையும் இழுபறியையும் தக்கவைத்தல் பொருத்தமானது.
- issue: ‘தேவனுடைய இஸ்ரவேல்’ என்பதற்கு முன் வரும் இறுதி καί என்பதன் தன்மை
  choice: ‘மேலும்’ என்று மொழிபெயர்த்து, அதை வேறொரு குழுவைச் சேர்ப்பதாகவோ அதே குழுவை மறுபெயரிட்டு விளக்குவதாகவோ வாசிக்க இடமளிக்கப்பட்டுள்ளது.
  alternative: ‘அதாவது தேவனுடைய இஸ்ரவேலின்மேலும்’ என்று ஒரே குழுவாகத் தீர்மானித்தல், அல்லது ‘அவர்களோடு சேர்த்து தேவனுடைய இஸ்ரவேலின்மேலும்’ என்று இரண்டு தனிக் குழுக்களாகத் தீர்மானித்தல்.
  rationale: சூழலில் καί சேர்க்கைப் பொருளிலோ மறுவிளக்கப் பொருளிலோ புரிந்துகொள்ளப்படலாம். எளிய இணைப்பை வைத்திருப்பது விவாதிக்கப்படும் இலக்கண மற்றும் இறையியல் கேள்வியைத் தீர்க்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான ஆசீர்வாதத் தொனி பயன்படுத்தப்பட்டுள்ளது. ‘நெறி’, ‘நடப்பவர்கள்’, ‘மேல்’ ஆகிய சொற்கள் மூலத்தின் ஒழுக்க அளவுகோல், நடை உருவகம், மீளுரைக்கப்படும் முன்னிடைச்சொல் ஆகியவற்றைத் தெளிவாகத் தக்கவைக்கின்றன. ‘தேவனுடைய இஸ்ரவேல்’ என்ற மரபான சொற்றொடர் விளக்கத் தீர்ப்பு இன்றி வைக்கப்பட்டுள்ளது.
