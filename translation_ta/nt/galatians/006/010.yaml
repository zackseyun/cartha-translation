id: GAL.6.10
reference: Galatians 6:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἄρα οὖν ὡς καιρὸν ⸀ἔχομεν, ἐργαζώμεθα τὸ ἀγαθὸν πρὸς πάντας, μάλιστα δὲ πρὸς τοὺς οἰκείους τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/010.yaml
  text: So then[a], as we have opportunity, let us do what is good toward everyone[c][b], and especially toward those who are of the household of faith.
translation:
  language: ta
  text: ஆகவே, நமக்கு வாய்ப்பிருக்கும் போதெல்லாம்[a], எல்லாருக்கும் நன்மை செய்வோமாக; குறிப்பாக, விசுவாசக் குடும்பத்தினருக்கு[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நமக்கு ஏற்ற காலம் இருக்கும்வரை.’ கிரேக்கச் சொல்லான καιρός பொதுவான காலத்தை மட்டும் அல்லாமல், ஏற்ற அல்லது தகுந்த நேரத்தை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘விசுவாசக் குடும்பத்தைச் சேர்ந்தவர்களுக்கு.’ கிரேக்க உரை, விசுவாசிகளின் சமூகத்தைச் சேர்ந்தவர்களைக் குறிக்கக் குடும்ப உருவகத்தைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘விசுவாசம்’ என்பது இங்கு கிறிஸ்தவர்கள் பகிர்ந்துகொள்ளும் ‘அந்த விசுவாசம்’ என்ற பொருளிலும் புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρα οὖν
  choice: ஆகவே
  rationale: முந்தைய கருத்திலிருந்து பெறப்படும் முடிவை இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ὡς καιρὸν ἔχομεν
  choice: நமக்கு வாய்ப்பிருக்கும் போதெல்லாம்
  rationale: καιρός என்பது பொதுவான காலத்தை மட்டும் அல்லாமல், செயற்படுவதற்கு ஏற்ற நேரத்தையோ வாய்ப்பையோ குறிக்கிறது. நிகழும் ஒவ்வொரு வாய்ப்பிலும் தொடர்ந்து செயல்பட வேண்டும் என்ற அறிவுறுத்தலையும் இச்சொற்றொடர் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐργαζώμεθα
  choice: செய்வோமாக
  rationale: இது சமூகத்தாரைத் தன்னுடன் இணைத்து ஊக்குவிக்கும் நிகழ்காலத் துணைவினை வடிவம். ‘செய்வோமாக’ என்பது τὸ ἀγαθόν என்பதுடன் இயல்பாக இணைந்து தொடர்ச்சியான செயலை ஊக்குவிக்கிறது.
- source_word: τὸ ἀγαθὸν
  choice: நன்மை
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட இந்நடுநிலை அடைமொழி நல்லதைக் செய்வதைக் குறிக்கிறது; ‘நன்மை செய்வது’ என்பது தெளிவான, இயல்பான தமிழ்ச் சொற்றொடர்.
- source_word: πρὸς πάντας
  choice: எல்லாருக்கும்
  rationale: செயலின் பயனும் நோக்கும் எல்லா மக்களையும் உள்ளடக்குவதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: μάλιστα δὲ
  choice: குறிப்பாக
  rationale: மற்றவர்களை விலக்காமல், பரந்த கட்டளைக்குள் ஒரு குழுவுக்கு சிறப்பு முன்னுரிமை அளிப்பதைப் பாதுகாக்கிறது.
- source_word: τοὺς οἰκείους τῆς πίστεως
  choice: விசுவாசக் குடும்பத்தைச் சேர்ந்தவர்கள்
  rationale: οἰκεῖοι என்பதிலுள்ள வீட்டார் அல்லது குடும்பத்தினர் என்ற உருவகத்தைத் தக்கவைத்து, விசுவாசத்தால் அடையாளப்படுத்தப்படும் சமூகத்தைச் சுட்டுகிறது.
- source_word: πίστεως
  choice: விசுவாசம்
  rationale: இச்சூழலில் πίστις என்பதன் அடிப்படைப் பொருளைத் தக்கவைக்கிறது; பகிரப்பட்ட கிறிஸ்தவ விசுவாசம் என்ற சாத்தியத்தையும் தேவையின்றி குறுக்கவில்லை.
theological_decisions:
- issue: நன்மை செய்வதன் பரப்பும் முன்னுரிமையும்
  choice: எல்லா மக்களுக்கும் நன்மை செய்ய வேண்டும்; விசுவாசக் குடும்பத்தாருக்கு சிறப்பு முன்னுரிமை அளிக்க வேண்டும்.
  alternative: விசுவாசிகளுக்கு மட்டுமே நன்மை செய்ய வேண்டும்; அல்லது விசுவாசிகளிடம் எந்தச் சிறப்புக் கடமையும் இல்லை.
  rationale: πρὸς πάντας உலகளாவிய பரப்பைக் காட்டுகிறது; μάλιστα அதற்குள் விசுவாசக் குடும்பத்தாருக்கு சிறப்பு முன்னுரிமையைச் சேர்க்கிறது. மொழிபெயர்ப்பு இரண்டையும் ஒன்றை ஒன்று நீக்காமல் தக்கவைக்கிறது.
- issue: τῆς πίστεως என்பதன் பொருள்
  choice: குடும்பத்தை அடையாளப்படுத்தும் ‘விசுவாசம்’ என்ற பொருள் பிரதான உரையில் தக்கவைக்கப்பட்டது.
  alternative: பகிரப்பட்ட கிறிஸ்தவ அறிக்கையைக் குறிக்கும் ‘அந்த விசுவாசம்’; அல்லது ‘உண்மைத்தன்மை’.
  rationale: மூலச்சொல் இங்கு விசுவாசத்தால் இணைக்கப்பட்ட சமூகத்தை இயல்பாகக் குறிக்கிறது. இன்னும் குறுகிய சமய நிறுவனப் பொருளை உரைக்குள் கட்டாயப்படுத்தாமல், ‘அந்த விசுவாசம்’ என்ற சாத்தியத்தை அடிக்குறிப்பில் தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கொண்டுள்ளது. ‘விசுவாசக் குடும்பம்’ என்ற சொற்றொடர் மூலத்தின் குடும்ப உருவகத்தைத் தக்கவைக்கிறது. இடைக்கோடுகள், எல்லாரையும் உள்ளடக்கும் கட்டளைக்குள் விசுவாசக் குடும்பத்தாருக்கான சிறப்பு முன்னுரிமையைத் தெளிவுபடுத்துகின்றன.
