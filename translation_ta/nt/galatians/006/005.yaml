source:
  edition: SBLGNT
  text: ἕκαστος γὰρ τὸ ἴδιον φορτίον βαστάσει.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/005.yaml
  text: For each one will carry his own load[a].
translation:
  language: ta
  text: ஏனெனில், ஒவ்வொருவரும் அவரவருக்குரிய சுமையைச் சுமப்பார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவரவருக்குரிய பாரத்தைத் தாங்குவார்கள்.’ இங்கே பயன்படுத்தப்பட்டுள்ள கிரேக்கச் சொல் φορτίον (‘சுமை’); இது 2ஆம் வசனத்திலுள்ள βάρη (‘பாரங்கள்’) என்பதிலிருந்து வேறுபட்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: ஒவ்வொருவரும்
  rationale: பகிர்ந்தளிக்கும் ஒருமைப் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; ஒவ்வொரு தனிநபரையும் தனித்தனியாக வலியுறுத்துகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கருத்துக்கான விளக்கக் காரணத்தை அறிமுகப்படுத்தும் இணைப்பைத் தெளிவாகக் காக்கிறது.
- source_word: τὸ ἴδιον
  choice: அவரவருக்குரிய
  rationale: ஒவ்வொருவருக்கும் தனிப்பட்டதாக உரியதைத் தமிழின் இயல்பான பகிர்ந்தளிக்கும் வடிவில் தெரிவிக்கிறது; தேவையற்ற பாலினக் கட்டுப்பாட்டையும் தவிர்க்கிறது.
- source_word: φορτίον
  choice: சுமை
  rationale: சுமந்து செல்லப்படுகிற ஒரு load என்ற தெளிவான பொருளைத் தருகிறது; 2ஆம் வசனத்திலுள்ள βάρη என்பதற்கு பயன்படுத்தக்கூடிய ‘பாரங்கள்’ என்ற சொல்லிலிருந்து சொல்வேறுபாட்டையும் காக்கிறது.
- source_word: βαστάσει
  choice: சுமப்பார்கள்
  rationale: எதிர்காலச் செயலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத கடமை அல்லது கட்டளைப் பொருளைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: கலாத்தியர் 6:5க்கும் 6:2க்கும் உள்ள தொடர்பு
  choice: 6:2இன் βάρη என்பதையும் இவ்வசனத்தின் φορτίον என்பதையும் வேறுபடுத்தும் வகையில் இங்கே ‘சுமை’ பயன்படுத்தப்பட்டுள்ளது; ஒவ்வொருவருக்கும் உரிய தனிப்பட்ட பொறுப்பை வசனம் திறந்த நிலையில் வைத்திருக்கிறது.
  alternative: இரண்டு வசனங்களிலும் ஒரே தமிழ்ச் சொல்லைப் பயன்படுத்துதல்; அல்லது இவ்வசனத்தை இறுதித் தீர்ப்பில் தனிப்பட்ட கணக்கொப்புவித்தல் என்று வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: உடனடியான சூழலில் பவுல் இரண்டு வேறு கிரேக்கப் பெயர்ச்சொற்களைப் பயன்படுத்துகிறார். பிறருடைய பெரும் பாரங்களைப் பகிர்ந்து தாங்குவதற்கும், ஒவ்வொருவரும் தமக்குரிய சுமையைச் சுமப்பதற்கும் இடையிலுள்ள பதற்றத்தை மொழிபெயர்ப்பு காக்கிறது; குறிப்பிட்ட ஓர் இறையியல் சமரசத்தை மூலவாசகத்திற்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘ஒவ்வொருவரும் அவரவருக்குரிய’ என்பது மூலத்தின் பகிர்ந்தளிக்கும் தனிப்பட்ட வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது; பன்மை வினைமுற்று தமிழின் மரியாதைமிக்க பொதுப்பயன்பாட்டுக்கு ஏற்ப உள்ளது.
