  source_fidelity: 'மூலக் கிரேக்கத்தின் அனைத்துக் கூறுகளும் துல்லியமாகக் காக்கப்பட்டுள்ளன: ἕκαστος என்பதன் பகிர்ந்தளிக்கும் தன்மை ‘ஒவ்வொருவரும்/அவரவருக்குரிய’ என்பதிலும், γάρ என்பதன் விளக்கத் தொடர்பு ‘ஏனெனில்’ என்பதிலும், எதிர்கால βαστάσει ‘சுமப்பார்கள்’ என்பதிலும் வெளிப்படுகிறது. φορτίον என்பதற்கு ‘சுமை’ எனத் தெரிவுசெய்திருப்பது பொருத்தமானது.'
