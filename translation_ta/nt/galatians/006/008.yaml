reference: Galatians 6:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι ὁ σπείρων εἰς τὴν σάρκα ἑαυτοῦ ἐκ τῆς σαρκὸς θερίσει φθοράν, ὁ δὲ σπείρων εἰς τὸ πνεῦμα ἐκ τοῦ πνεύματος θερίσει ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/008.yaml
  text: For the one who sows to his own flesh will reap corruption from the flesh[c][b][a], but the one who sows to the Spirit will reap eternal life from the Spirit.
translation:
  language: ta
  text: ஏனெனில், தன் மாம்சத்திற்கென்று[a] விதைக்கிறவன் மாம்சத்திலிருந்து அழிவை[b] அறுவடை செய்வான்; ஆனால் ஆவிக்கென்று[c] விதைக்கிறவன் ஆவியிலிருந்து நித்திய வாழ்வை அறுவடை செய்வான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தன் பாவ இயல்புக்கென்று’ என்றும் மொழிபெயர்க்கலாம். ‘மாம்சம்’ என்பதற்கான கிரேக்கச் சொல் (sarx) உடலை நேரடியாகக் குறிக்கலாம்; பவுலின் நெறிசார் எதிர்மறை இணைப்புகளில், ஆவிக்கு எதிரான வீழ்ச்சியுற்ற மனித மனப்போக்கையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘கேட்டை’ அல்லது ‘சிதைவை’ என்றும் மொழிபெயர்க்கலாம். இக்கிரேக்கச் சொல் அழிவு, கேடு அல்லது சிதைவு ஆகியவற்றைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: இங்கே கடவுளின் பரிசுத்த ஆவியே குறிக்கப்படுகிறார் என்பது சூழலில் மிகச் சாத்தியம். எனினும், சிலர் இதை மனித ‘ஆவி’ என்று புரிந்துகொள்ளக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுரைக்கான காரணத்தை அல்லது விளக்கத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: ὁ σπείρων
  choice: விதைக்கிறவன்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்பு வடிவத்தின் பொதுவான, பழமொழி போன்ற தன்மையைப் பாதுகாக்கிறது.
- source_word: εἰς τὴν σάρκα ἑαυτοῦ
  choice: தன் மாம்சத்திற்கென்று
  rationale: εἰς என்பதன் நோக்கு அல்லது சார்பு உணர்வை ‘-க்கென்று’ இயல்பாக வெளிப்படுத்துகிறது; ἑαυτοῦ என்பதன் தற்சுட்டு வலியுறுத்தல் ‘தன்’ எனத் தக்கவைக்கப்படுகிறது. σάρξ என்பதற்கு விளக்கவுரையான ‘பாவ இயல்பு’ என்பதை நேரடியாக இடாமல், பவுலின் சொற்பயன்பாடும் அதன் பொருள் அழுத்தமும் ‘மாம்சம்’ எனப் பாதுகாக்கப்படுகின்றன.
- source_word: ἐκ τῆς σαρκὸς
  choice: மாம்சத்திலிருந்து
  rationale: ἐκ குறிக்கும் மூலம் அல்லது தோற்றத்தை நேரடியாகக் காட்டுகிறது; இரண்டாம் பாதியிலுள்ள இணையான சொற்றொடருடனும் ஒத்திசைகிறது.
- source_word: θερίσει
  choice: அறுவடை செய்வான்
  rationale: விதைத்தல்–அறுவடை செய்தல் என்ற வேளாண்மை உருவகத்தைத் தெளிவாகப் பேணுகிறது.
- source_word: φθοράν
  choice: அழிவை
  rationale: φθορά குறிக்கக்கூடிய கேடு, சிதைவு, இறுதி அழிவு ஆகிய பரப்பைச் சூழலில் இயல்பாக எடுத்துரைக்கிறது; அதை வெறும் உடல் சிதைவாக மட்டும் குறுக்கவில்லை.
- source_word: ὁ δὲ σπείρων
  choice: ஆனால் … விதைக்கிறவன்
  rationale: δέ குறிக்கும் முரண்பாட்டை ‘ஆனால்’ வெளிப்படுத்துகிறது; முதல் பாதியின் சமநிலையான இலக்கண அமைப்பும் மீண்டும் பயன்படுத்தப்படுகிறது.
- source_word: εἰς τὸ πνεῦμα
  choice: ஆவிக்கென்று
  rationale: கலாத்தியரில் மாம்சம்–ஆவி என்ற எதிர்மறை இணை பெரும்பாலும் கடவுளின் பரிசுத்த ஆவியைக் குறிக்கிறது. தமிழில் பெரிய/சிறிய எழுத்து வேறுபாடு இல்லாததால், சாத்தியமான குறிப்பை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: ἐκ τοῦ πνεύματος
  choice: ஆவியிலிருந்து
  rationale: ἐκ குறிக்கும் மூலத்தைப் பாதுகாத்து, ‘மாம்சத்திலிருந்து’ என்பதுடன் உள்ள மூலமொழி இணை அமைப்பைத் தக்கவைக்கிறது.
- source_word: ζωὴν αἰώνιον
  choice: நித்திய வாழ்வை
  rationale: இச்சொற்றொடரின் காலமுடிவற்றதும் வரவிருக்கும் காலத்தைச் சார்ந்ததுமான பொருளை நிலைபெற்ற, புரிந்துகொள்ளக்கூடிய தமிழில் வழங்குகிறது.
theological_decisions:
- issue: பவுலின் நெறிசார் எதிர்மறை இணைப்பில் σάρξ என்பதன் மொழிபெயர்ப்பு
  choice: மாம்சம்
  alternative: பாவ இயல்பு
  rationale: இங்கு ‘பாவ இயல்பு’ என்பது பொருத்தமான விளக்கமாக இருந்தாலும், அதை முதன்மை உரையில் பயன்படுத்துவது பவுலின் பலபொருள் கொண்ட சொல்லை ஒரே விளக்கமாகத் தீர்மானித்துவிடும். ‘மாம்சம்’ அவரது சொல்வழக்கையும் மாம்சம்–ஆவி என்ற இறையியல் அழுத்தத்தையும் பாதுகாக்கிறது.
- issue: πνεῦμα என்பதன் குறிப்பு
  choice: ஆவி—சூழலில் பரிசுத்த ஆவி
  alternative: மனித ஆவி அல்லது சிற்றெழுத்தில் ‘spirit’ எனப் புரிதல்
  rationale: கலாத்தியரில், குறிப்பாக மாம்சத்திற்கு எதிரான இவ்விணைப்பில், πνεῦμα கடவுளின் ஆவியைக் குறிப்பதே மிக இயல்பானது. எனினும் மூலச்சொல்லுக்கு தனிப் பெரியெழுத்துக் குறியீடு இல்லாததாலும் தமிழில் அத்தகைய எழுத்து வேறுபாடு இல்லாததாலும், முதன்மை உரையில் ‘ஆவி’ என வைத்து அடிக்குறிப்பில் குறிப்பை விளக்குவது உண்மையான மொழிசார் நிலையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘மாம்சம்’, ‘ஆவி’, ‘நித்திய வாழ்வு’ ஆகிய நிலைபெற்ற வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; அரிதான வடிவங்களுக்குப் பதிலாக ‘விதைக்கிறவன்’, ‘அறுவடை செய்வான்’ போன்ற பொதுவாகப் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
