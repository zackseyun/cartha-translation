id: GAL.6.7
reference: Galatians 6:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μὴ πλανᾶσθε, θεὸς οὐ μυκτηρίζεται· ὃ γὰρ ⸀ἐὰν σπείρῃ ἄνθρωπος, τοῦτο καὶ θερίσει·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/007.yaml
  text: 'Do not be deceived: God is not mocked[a], for whatever a man sows, this he will also reap.'
translation:
  language: ta
  text: ஏமாறாதீர்கள்; கடவுளை ஏளனம் செய்து தப்பிவிட முடியாது. ஏனெனில், ஒருவர் எதை விதைக்கிறாரோ, அதையே அறுவடை செய்வார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: ஏமாந்துபோகாதீர்கள்
  rationale: நிகழ்காலச் செயப்பாட்டு எதிர்மறைக் கட்டளையின் எச்சரிக்கைத் தொனியையும், பிறராலோ தம்மாலோ தவறாக வழிநடத்தப்படுதல் என்ற பரந்த பொருளையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: θεὸς
  choice: கடவுள்
  rationale: இங்கு ஒரே உண்மையான கடவுளைக் குறிக்கும் θεός என்பதற்கான தெளிவான, வழக்கமான தமிழ் இணைச்சொல்.
- source_word: οὐ μυκτηρίζεται
  choice: கடவுளை ஏளனம் செய்ய முடியாது
  rationale: μυκτηρίζω என்பது மூக்கைச் சுளித்து இகழ்தல், ஏளனம் செய்தல், அவமதித்தல் என்ற பொருளுடையது. கிரேக்கச் செயப்பாட்டு வடிவத்தை தமிழில் சொல்லுக்குச் சொல் பின்பற்றுவதைவிட, மனிதர்கள் கடவுளை ஏளனம் செய்து விளைவிலிருந்து தப்ப முடியாது என்ற பழமொழித் தன்மையுள்ள வலிமையை இவ்வாறு இயல்பாகக் காக்கிறது.
- source_word: ὃ γὰρ ἐὰν
  choice: ஏனெனில், ஒருவர் எதை ... ஓ
  rationale: குறிப்பிடப்படாத பொதுவான நிபந்தனையைத் தமிழின் இயல்பான தொடர்பிணை அமைப்பில் தருகிறது.
- source_word: σπείρῃ
  choice: விதைக்கிறாரோ
  rationale: வேளாண்மை உருவகத்தை நேரடியாகக் காத்து, தொடர்ந்து வரும் அறுவடை உருவகத்துடன் இயல்பாக இணைக்கிறது.
- source_word: ἄνθρωπος
  choice: ஒருவர்
  rationale: ἄνθρωπος இங்கு எந்த மனிதருக்கும் பொருந்தும் பிரதிநிதித்துவ ஒருமையாக உள்ளது. தமிழ் மொழியில் ‘ஒருவர்’ பாலினத்தைத் தேவையின்றிக் குறிப்பாக்காமல் அந்தப் பொதுப்பொருளையும் ஒருமையையும் துல்லியமாகத் தருகிறது.
- source_word: τοῦτο καὶ θερίσει
  choice: அதையே அறுவடை செய்வார்
  rationale: τοῦτο என்பதன் சுட்டுவலிமையையும் καί தரும் துல்லியமான பொருத்த வலியுறுத்தலையும் ‘அதையே’ காக்கிறது; விதைப்பு–அறுவடை உருவகமும் தொடர்கிறது.
theological_decisions:
- issue: ἄνθρωπος என்பதன் பொதுமனித ஒருமை
  choice: ஒருவர்
  alternative: ஒரு மனிதன்
  rationale: இவ்வசனம் ஆண்களை மட்டும் குறிக்காமல் அனைவருக்கும் பொருந்தும் பொதுக் கொள்கையை பிரதிநிதித்துவ ஒருமையில் கூறுகிறது. நவீன தமிழில் ‘ஒருவர்’ அந்தப் பொதுவான மனிதக் குறிப்பைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; இறையியல் நோக்கத்தைச் சுருக்குவதில்லை.
- issue: θεὸς οὐ μυκτηρίζεται என்பதன் பொருள்
  choice: கடவுளை ஏளனம் செய்ய முடியாது
  alternative: கடவுள் ஏளனம் செய்யப்படுவதில்லை
  rationale: செயப்பாட்டு இலக்கண வடிவத்தை மாற்றினாலும், கடவுளை அவமதித்து அதற்குரிய விளைவுகளைத் தவிர்க்கலாம் என்று யாரும் எண்ணக்கூடாது என்ற மூலத்தின் எச்சரிக்கை மற்றும் பழமொழி வலிமை இயல்பான தமிழில் காக்கப்படுகிறது. இது கடவுளை மனிதர்கள் முயன்றே இகழ முடியாது என்று மறுப்பதல்ல; அத்தகைய இகழ்ச்சி வெற்றியடையாது என்பதே கருத்து.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ். விதைப்பு–அறுவடை உருவகம் அப்படியே காக்கப்பட்டுள்ளது. தேவையற்ற ஆங்கிலப் பாலினக் குறிப்பைத் தமிழில் இறக்குமதி செய்யாமல், கிரேக்கத்தின் உண்மையான பொதுமனிதப் பொருள் வழங்கப்பட்டுள்ளது.
