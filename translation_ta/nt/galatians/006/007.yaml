revisions:
- from: 'ஏமாந்துபோகாதீர்கள்: கடவுளை ஏளனம் செய்ய முடியாது. ஏனெனில், ஒருவர் எதை விதைக்கிறாரோ, அதையே அறுவடை செய்வார்.'
  to: ஏமாறாதீர்கள்; கடவுளை ஏளனம் செய்து தப்பிவிட முடியாது. ஏனெனில், ஒருவர் எதை விதைக்கிறாரோ, அதையே அறுவடை செய்வார்.
  rationale: The revision improves the opening imperative and clarifies the proverbial force of “God is not mocked” in natural Tamil. It retains the generality of ἄνθρωπος, the emphatic correspondence between what is sown and reaped (“அதையே”), and the agricultural metaphor.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:11:34Z'
review_pass:
  verdict: revise
  source_fidelity: 'The warning, God-reference, general conditional statement, and sowing–reaping metaphor are retained. However, “கடவுளை ஏளனம் செய்ய முடியாது” can be heard as saying that no one is able even to mock God, whereas οὐ μυκτηρίζεται is a passive proverbial assertion: God is not one whom people can mock with impunity. Adding “செய்து தப்பிவிட” makes the intended proverbial force explicit in idiomatic Tamil without making the statement about the impossibility of attempting ridicule.'
  naturalness: “ஏமாறாதீர்கள்” is a more concise and natural modern Tamil imperative than “ஏமாந்துபோகாதீர்கள்” here. The revised middle clause is also idiomatic and preserves the warning’s force.
  terminology: “கடவுள்,” “விதைக்கிறாரோ,” and “அறுவடை செய்வார்” are appropriate, clear modern-standard Tamil choices. “ஒருவர்” naturally conveys the generic singular ἄνθρωπος and does not require a gender footnote in Tamil.
  issues:
  - severity: medium
    issue: The rendering “கடவுளை ஏளனம் செய்ய முடியாது” may imply that humans cannot even attempt to ridicule God.
    rationale: The Greek passive θεὸς οὐ μυκτηρίζεται states that God is not mocked/sneered at, in a proverbial warning reinforced by the sowing-and-reaping clause. Tamil can naturally express this as inability to mock God and escape the consequence; this avoids an unintended claim about the mere possibility of an attempt while retaining the force.
  revised_text: ஏமாறாதீர்கள்; கடவுளை ஏளனம் செய்து தப்பிவிட முடியாது. ஏனெனில், ஒருவர் எதை விதைக்கிறாரோ, அதையே அறுவடை செய்வார்.
  revised_footnotes: []
  revision_rationale: The revision improves the opening imperative and clarifies the proverbial force of “God is not mocked” in natural Tamil. It retains the generality of ἄνθρωπος, the emphatic correspondence between what is sown and reaped (“அதையே”), and the agricultural metaphor.
