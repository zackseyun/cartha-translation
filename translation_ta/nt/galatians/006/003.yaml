  text: For if anyone thinks he is something when he is nothing[a], he deceives himself.
translation:
  language: ta
  text: ஏனெனில், ஒருவன் ஒன்றுமில்லாதவனாக இருக்கும்போது, தான் ஏதோ ஒருவன் என்று நினைத்தால், அவன் தன்னைத்தானே ஏமாற்றிக்கொள்கிறான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன்னைத்தானே மயக்கிக்கொள்கிறான்.”
    reason: φρεναπατᾷ என்பதற்கு ‘ஏமாற்றுதல்’ என்பதோடு ‘மயக்குதல்/தவறாக எண்ணச் செய்தல்’ என்ற நெருங்கிய பொருளும் உண்டு.
lexical_decisions:
- source_word: εἰ γὰρ
  choice: ஏனெனில், ... இருந்தால்
  rationale: γάρ என்பதன் விளக்கமளிக்கும் பொருளை ‘ஏனெனில்’ என்பதும், εἰ என்பதன் நிபந்தனைப் பொருளை ‘இருந்தால்’ என்பதும் இயல்பான தமிழில் காக்கின்றன.
- source_word: δοκεῖ
  choice: நினைத்துக்கொண்டு
  rationale: இங்கு இந்த வினை வெளிப்புறத் தோற்றத்தைக் குறிக்காமல், ஒருவர் தன்னைப் பற்றி செய்துகொள்ளும் மதிப்பீட்டைக் குறிக்கிறது.
- source_word: τις
  choice: ஒருவன்
  rationale: τις பொதுவாக எவரையும் குறிக்கும் ஒருமைச் சொல். கிரேக்கத்தின் பிரதிநிதித்துவ ஒருமையைத் தமிழில் ‘ஒருவன்’ இயல்பாகத் தக்கவைக்கிறது.
- source_word: εἶναί τι
  choice: தான் ஏதோ பெரியவன்
  rationale: ‘ஏதோ ஒன்றாக இருத்தல்’ என்ற சொற்றொடர் இங்கு தன்னை முக்கியமானவனாகக் கருதுவதை உணர்த்துகிறது. ‘பெரியவன்’ என்பது அந்தச் சொற்றொடரின் கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது; அதேவேளை அடுத்துள்ள ‘ஒன்றுமில்லாதவன்’ என்ற முரண்பாட்டையும் காக்கிறது.
- source_word: μηδὲν ὤν
  choice: உண்மையில் ஒன்றுமில்லாதவனாக இருந்தால்
  rationale: μηδέν பயனிலையாக வந்து, அந்த நபரின் உண்மையான நிலையையும் அவரது சுயமதிப்பீட்டுக்கு எதிரான முரண்பாட்டையும் குறிக்கிறது. ‘உண்மையில்’ என்பது கிரேக்கத்தில் உள்ள வெளிப்படையான எதிர்மறை மோதலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: φρεναπατᾷ
  choice: ஏமாற்றிக்கொள்கிறான்
  rationale: இந்த வினை ஒருவரது மனம் தவறாக வழிநடத்தப்படுவதையோ ஏமாறுவதையோ குறிக்கிறது. ‘ஏமாற்றிக்கொள்கிறான்’ என்பது தெளிவான, பொதுவான தமிழ் இணை.
- source_word: ἑαυτόν
  choice: தன்னையே
  rationale: இது எழுவாயையே திரும்பச் சுட்டும் தற்சுட்டுப் பெயர். ‘-ஏ’ என்பது ஏமாற்றப்படுவது வேறு யாருமல்ல, அவனே என்ற வலியுறுத்தலை இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: பொதுப்பொருளில் வரும் ஆண்பால் ஒருமை
  choice: ஒருவன் / அவன் / தன்னையே
  alternative: ஒருவர் / அவர் / தம்மையே
  rationale: கிரேக்கத்தில் இலக்கண ரீதியாக ஆண்பால் ஒருமை வடிவங்கள் பொதுவான பிரதிநிதித்துவப் பொருளில் வருகின்றன. தமிழிலும் ஒருமை ஆண்பால் வடிவங்களை வைத்திருப்பது மூலத்தின் வடிவத்தைத் தக்கவைக்கிறது; இது ஆண்களை மட்டும் குறிக்கும் வரம்பாக எடுத்துக்கொள்ளப்பட வேண்டியதல்ல.
- issue: τι εἶναι என்பதன் முக்கியத்துவப் பொருள்
  choice: ஏதோ பெரியவன்
  alternative: ஏதோ ஒன்றாக இருப்பவன்
  rationale: இந்தச் சூழலில் சொற்றொடர் வெறும் இருப்பைக் குறிக்காமல், தன்னை முக்கியமானவனாக மதிப்பிடுவதைக் குறிக்கிறது. இருப்பினும் ‘பெரியவன்’ என்பது குறிப்பிட்ட பதவி, ஆன்மீக நிலை அல்லது கோட்பாட்டு மேன்மையைச் சேர்க்காமல் பொதுவான சுயமுக்கியத்துவத்தை மட்டுமே தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஏதோ பெரியவன்’ மற்றும் ‘ஒன்றுமில்லாதவன்’ ஆகியவை பவுலின் கூர்மையான எதிர்மறை மோதலை இயல்பாகக் காக்கின்றன. அடிக்குறிப்பு குறியீடு அது விளக்கும் வினைக்குப் பின் வைக்கப்பட்டுள்ளது.
