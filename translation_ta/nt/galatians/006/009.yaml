revisions:
- from: நன்மை செய்வதில் நாம் சோர்ந்துபோகாமல் இருப்போமாக[a]. ஏனெனில், நாம் தளர்ந்துவிடாவிட்டால், உரிய காலத்தில்[b] அறுவடை செய்வோம்.
  to: நன்மை செய்வதில் நாம் மனந்தளராதிருப்போமாக[a]; ஏனெனில், நாம் களைப்படையாமல் இருந்தால், உரிய காலத்தில்[b] அறுவடை செய்வோம்.
