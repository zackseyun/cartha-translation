  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τὸ δὲ καλὸν ποιοῦντες μὴ ⸀ἐγκακῶμεν, καιρῷ γὰρ ἰδίῳ θερίσομεν μὴ ἐκλυόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/009.yaml
  text: And let us not grow weary in doing good[a], for in due time we will reap[c][b], if we do not give up.
translation:
  language: ta
  text: நன்மை செய்வதில் நாம் மனந்தளராதிருப்போமாக[a]; ஏனெனில், நாம் களைப்படையாமல் இருந்தால், உரிய காலத்தில்[b] அறுவடை செய்வோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நல்லதைச் செய்வதில் நாம் சோர்ந்துபோகாதிருப்போமாக.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அதற்குரிய காலத்தில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ καλὸν ποιοῦντες
  choice: நன்மை செய்வதில்
  rationale: τὸ καλὸν என்பது நல்லதும் நற்பண்புடையதுமான செயலைக் குறிக்கிறது; ποιοῦντες உடன் சேர்ந்து தொடர்ச்சியாக நன்மை செய்வதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: μὴ ἐγκακῶμεν
  choice: நாம் சோர்ந்துபோகாமல் இருப்போமாக
  rationale: இந்த வினை மனந்தளர்ந்து முயற்சியைக் கைவிடும் நிலையைச் சுட்டுகிறது. தமிழில் ஊக்கத்தை இழக்காதிருக்க வேண்டிய கூட்டான அறிவுரையை இச்சொற்றொடர் தெளிவாகத் தருகிறது.
- source_word: καιρῷ ... ἰδίῳ
  choice: உரிய காலத்தில்
  rationale: καιρός பொருத்தமான அல்லது குறிக்கப்பட்ட காலத்தையும் ἴδιος அதற்கே உரிய தன்மையையும் காட்டுகிறது; ‘உரிய காலத்தில்’ இரண்டையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: θερίσομεν
  choice: அறுவடை செய்வோம்
  rationale: சுற்றியுள்ள விதைத்தல்–அறுவடை உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: μὴ ἐκλυόμενοι
  choice: நாம் தளர்ந்துவிடாவிட்டால்
  rationale: இப்பங்கேற்பு வடிவம் சோர்ந்து சக்தியிழந்து கைவிடாதிருப்பதை நிபந்தனைத் தொனியுடன் காட்டுகிறது. முந்தைய ἐγκακῶμεν என்பதிலிருந்து சொல் வேறுபாட்டையும் தமிழில் ஓரளவு பாதுகாக்கிறது.
theological_decisions:
- issue: ἐγκακῶμεν மற்றும் ἐκλυόμενοι ஆகிய இரு விடாமுயற்சி வெளிப்பாடுகளுக்கிடையிலான உறவு
  choice: ‘சோர்ந்துபோகாமல்’ என்றும் ‘தளர்ந்துவிடாவிட்டால்’ என்றும் தொடர்புடைய ஆனால் வேறுபட்ட சொற்களால் மொழிபெயர்த்தல்
  alternative: இரண்டையும் ‘மனந்தளராமல்’ அல்லது ‘சோராமல்’ என்று ஒரே சொல்லால் மொழிபெயர்த்தல்
  rationale: பவுல் பயன்படுத்தும் தொடர்புடைய இரு வேறு வெளிப்பாடுகளையும் ஒன்றாக்காமல், விடாமுயற்சிக்கான அறிவுரையையும் நிபந்தனைத் தொனியையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், மரியாதையும் எளிமையும் கொண்ட கூட்டான அறிவுரை நடையில் அமைக்கப்பட்டது. வேளாண்மை உருவகம் காக்கப்பட்டுள்ளது; ஒரே கருத்தைக் குறிக்கும் கிரேக்கச் சொற்களுக்கிடையிலான நுண்ணிய வேறுபாடும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளது.
