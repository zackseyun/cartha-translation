id: GAL.6.12
reference: Galatians 6:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅσοι θέλουσιν εὐπροσωπῆσαι ἐν σαρκί, οὗτοι ἀναγκάζουσιν ὑμᾶς περιτέμνεσθαι, μόνον ⸀ἵνα τῷ σταυρῷ τοῦ ⸀Χριστοῦ ⸀μὴ διώκωνται·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/012.yaml
  text: As many as want to make a good showing in the flesh[a], these are forcing you to be circumcised[c][b], only so that they may not be persecuted for the cross of the Messiah.
translation:
  language: ta
  text: மாம்சத்தில் நல்ல தோற்றம் காட்ட விரும்பும் அனைவரும்[a] உங்களை விருத்தசேதனம் பெறும்படி வற்புறுத்துகிறார்கள்; மேசியாவின் சிலுவையின் காரணமாகத் தாங்கள் துன்புறுத்தப்படாமல் இருப்பதற்காக மட்டுமே அவர்கள் அவ்வாறு செய்கிறார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெளிப்புறமாகச் சாதகமான தோற்றம் ஏற்படுத்த விரும்பும் அனைவரும்.”
    reason: lexical_alternative
  - marker: b
    text: '“மேசியாவின் சிலுவையின் காரணமாக” என்பதை “மேசியாவின் சிலுவைக்காக” என்றும் மொழிபெயர்க்கலாம். மரபுவழி மொழிபெயர்ப்பு: “கிறிஸ்துவின் சிலுவை.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσοι θέλουσιν
  choice: விரும்புகிறவர்கள் எவர்களோ
  rationale: ஒரு முழு வகுப்பினரைக் குறிக்கும் ὅσοι என்பதன் விரிவான வலிமையையும், θέλουσιν என்பதன் விருப்பத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εὐπροσωπῆσαι ἐν σαρκί
  choice: மாம்சத்தில் நல்ல தோற்றத்தைக் காட்ட
  rationale: εὐπροσωπῆσαι என்பதிலுள்ள பிறர்முன் சாதகமான தோற்றம் ஏற்படுத்தும் கருத்தையும், பவுலின் பொருள் செறிந்த σάρξ சொல்லையும் தக்கவைக்கிறது; வெளிப்புற மத அடையாளம் என்ற சூழல்சார் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: οὗτοι
  choice: அவர்களே
  rationale: குறிப்புச் சுட்டுப்பெயரின் வலியுறுத்தலை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: ἀναγκάζουσιν
  choice: வற்புறுத்துகிறார்கள்
  rationale: தொடர்ந்து கொடுக்கப்படும் கட்டாய அழுத்தத்தைத் தெளிவாகக் காட்டுகிறது; இங்கு உடல் வன்முறையை அவசியமாகக் குறிக்காததால் 'கட்டாயப்படுத்துகிறார்கள்' என்பதைவிட பொருத்தமானது.
- source_word: ὑμᾶς περιτέμνεσθαι
  choice: உங்களை விருத்தசேதனம் செய்துகொள்ளும்படி
  rationale: விருத்தசேதனம் பெறும்படி அவர்கள்மீது அழுத்தம் கொடுக்கப்படுவதைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: μόνον ἵνα
  choice: '... இருப்பதற்காக மட்டுமே'
  rationale: அவர்களுக்குப் பவுல் சாட்டும் ஒரே நோக்கத்தையும் ἵνα-வின் நோக்கப் பொருளையும் பாதுகாக்கிறது.
- source_word: τῷ σταυρῷ τοῦ Χριστοῦ
  choice: மேசியாவின் சிலுவையின் காரணமாக
  rationale: துன்புறுத்தலுக்கான காரணம் அல்லது தொடர்பு என்ற தத்திவின் பொருளைத் தெளிவுபடுத்தி, Χριστός என்பதை இங்கு பட்டமாக மொழிபெயர்க்கிறது.
- source_word: μὴ διώκωνται
  choice: தாங்கள் துன்புறுத்தப்படாமல் இருப்பதற்காக
  rationale: ἵνα உடன் வரும் இறைப்பாட்டு வினையின் நோக்கத்தையும், செயப்படுபொருள் நிலையையும் பாதுகாக்கிறது.
theological_decisions:
- issue: ἐν σαρκί என்பதன் பொருள்
  choice: மாம்சத்தில்
  alternative: வெளித்தோற்றத்தில் / வெளிப்புறமாக
  rationale: பவுலின் σάρξ சொல்லிலுள்ள தத்துவ-இறையியல் பதற்றத்தை முதன்மை உரையில் தக்கவைக்கிறது; இச்சூழலில் உடல்சார்ந்த வெளிப்புற மத அடையாளத்தைக் குறிக்கலாம் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
- issue: τοῦ Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மேசியாவின்
  alternative: கிறிஸ்துவின்
  rationale: இங்கு Χριστός சிலுவையை உடையவரின் பட்டமாகத் தெளிவாகச் செயல்படுவதால் அதன் பொருளை மொழிபெயர்க்கிறது; தமிழில் மரபான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: τῷ σταυρῷ என்பதன் தத்திவுப் பொருள்
  choice: சிலுவையின் காரணமாக
  alternative: சிலுவைக்காக / சிலுவையை முன்னிட்டு
  rationale: διώκωνται உடன் காரணப் பொருள் இயல்பானது. இருப்பினும் தத்திவு காரணம் அல்லது தொடர்பு எனப் புரிந்துகொள்ளப்படக்கூடிய சிறு தெளிவின்மையை அடிக்குறிப்பில் பதிவு செய்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மாம்சம்’ மற்றும் ‘மேசியா’ போன்ற மூலத்தின் இறையியல் முக்கியத்துவமுள்ள சொற்கள் தக்கவைக்கப்பட்டு, தேவையான இயல்பான மாற்றுகள் அடிக்குறிப்புகளில் கொடுக்கப்பட்டுள்ளன.
