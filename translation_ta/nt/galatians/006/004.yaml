lexical_decisions:
- source_word: ἔργον
  choice: சொந்தச் செயல்
  rationale: ஒருவருடைய நடத்தை அல்லது செயல்பாட்டை விரிவாகக் குறிக்கும் வகையில் ‘செயல்’ பயன்படுத்தப்பட்டுள்ளது; ‘சொந்த’ என்பது ἑαυτοῦ என்பதன் தற்சுட்டுப் பொருளை வெளிப்படுத்துகிறது.
