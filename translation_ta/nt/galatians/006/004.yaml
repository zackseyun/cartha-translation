theological_decisions:
- issue: பவுலின் சூழலில் καύχημα என்பதன் பொருள்
  choice: ‘பெருமைப்படுவதற்கான காரணம்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘பெருமை’ அல்லது ‘பெருமைப்படுதல்’
  rationale: பெருமைப்படும் செயலுக்கும் அதற்கான அடிப்படைக்கும் இடையிலுள்ள சொல்லின் பொருள் நுட்பத்தைப் பாதுகாக்கிறது. இது நல்ல தன்னம்பிக்கையா அல்லது தேவனுக்கு முன்பான நியாயமான பெருமையா என்பதை உரை கூறுவதைவிட அதிகமாகத் தீர்மானிக்கவில்லை.
- issue: தன்சோதனையும் மற்றவருடனான ஒப்பீடும்
  choice: εἰς ἑαυτόν / εἰς τὸν ἕτερον என்ற இணையான அமைப்பு ‘அவரைப் பொறுத்தவரையில்... மற்றவரைப் பொறுத்தவரையில்’ எனக் காக்கப்பட்டது.
  alternative: ‘மற்றவரோடு தன்னை ஒப்பிடாமல்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: ஒப்பீடு என்பது சூழலில் தெளிவாக இருந்தாலும், கிரேக்கத்தில் உள்ள துல்லியமான உறவுநிலைச் சொல்லாக்கத்தின் தெளிவின்மையை விரிவுரை செய்து முற்றிலும் தீர்த்துவிடாமல் பாதுகாக்கிறது.
- issue: பொதுப்பொருளுடைய ஆண்பால் ஒருமை
  choice: தமிழில் இயல்பான பொதுப்பொருளுடன் ‘ஒவ்வொருவரும்... தன்... அவர்’ பயன்படுத்தப்பட்டது.
  alternative: ‘ஒவ்வொரு ஆணும்... அவன்’
  rationale: கிரேக்க ஆண்பால் ஒருமை இங்கு மனிதர் ஒவ்வொருவரையும் பொதுவாகக் குறிக்கிறது. தமிழின் மரியாதை ஒருமையான ‘அவர்’ அந்த ஒருமையைத் தக்கவைத்தபடி தேவையற்ற ஆண்பால் வரையறையைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சோதித்துப் பார்க்கட்டும்’ என்பது கட்டளையின் வலிமையையும் இயல்பான பேச்சு-எழுத்து நடையையும் இணைக்கிறது. மூலத்தில் உள்ள இணையான ‘தன்னைப் பொறுத்தவரையில் / மற்றவரைப் பொறுத்தவரையில்’ அமைப்பு தெளிவின்மையைத் தீர்க்காமல் காக்கப்பட்டுள்ளது. வழங்கப்பட்ட ஆங்கில ஆலோசனை உரையில் [a] குறி ‘work’ என்பதற்குப் பின் இருந்தாலும் அதன் அடிக்குறிப்பு καύχημα பற்றியது; ஆகவே தமிழ் முதன்மை உரையில் அது பொருத்தமான ‘பெருமைப்படுவதற்கான காரணம்’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
