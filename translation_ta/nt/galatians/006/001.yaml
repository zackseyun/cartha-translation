revisions:
- from: சகோதரர்களே[a], ஒருவர்[c] ஏதாவது ஒரு மீறுதலில் அகப்பட்டாலும்[b], ஆவிக்குரியவர்களாகிய நீங்கள் சாந்தமான மனப்பான்மையோடு அப்படிப்பட்டவரைச் சீர்படுத்துங்கள். நீங்களும் சோதனைக்கு உள்ளாகாதபடி உங்களையே கவனித்துக்கொள்ளுங்கள்.
  to: சகோதரர்களே[a], ஒருவர்[c] ஏதேனும் ஒரு தவறில் அகப்பட்டிருந்தால்[b], ஆவிக்குரியவர்களாகிய நீங்கள் கனிவான மனப்பான்மையுடன் அப்படிப்பட்டவரைச் சீர்படுத்துங்கள். உங்களில் ஒவ்வொருவரும் தம்மைக் கவனித்துக்கொள்ளுங்கள்; நீங்களும் சோதனைக்கு உள்ளாகாதபடி அவ்வாறு செய்யுங்கள்.
  rationale: The revision replaces a less precise term for gentleness, smooths an awkward Tamil collocation, and brings out the individualized force of the Greek singular self-warning. The added ‘அவ்வாறு செய்யுங்கள்’ only makes the Tamil purpose relation explicit and does not add a theological interpretation. Footnote anchors and all three supplied footnote functions are retained.
