id: GAL.6.1
reference: Galatians 6:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἀδελφοί, ἐὰν καὶ προλημφθῇ ἄνθρωπος ἔν τινι παραπτώματι, ὑμεῖς οἱ πνευματικοὶ καταρτίζετε τὸν τοιοῦτον ἐν πνεύματι πραΰτητος, σκοπῶν σεαυτόν, μὴ καὶ σὺ πειρασθῇς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/001.yaml
  text: Brothers[a], even if a man is caught in some trespass, you who are spiritual should restore such a one in a spirit of gentleness, watching yourself[c][b], lest you also be tempted.
translation:
  language: ta
  text: சகோதரர்களே[a], ஒருவர்[c] ஏதேனும் ஒரு தவறில் அகப்பட்டிருந்தால்[b], ஆவிக்குரியவர்களாகிய நீங்கள் கனிவான மனப்பான்மையுடன் அப்படிப்பட்டவரைச் சீர்படுத்துங்கள். உங்களில் ஒவ்வொருவரும் தம்மைக் கவனித்துக்கொள்ளுங்கள்; நீங்களும் சோதனைக்கு உள்ளாகாதபடி அவ்வாறு செய்யுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சகோதரர்களே’ என்பது ஆண்பால் பன்மை வடிவத்தின் மொழிபெயர்ப்பு; அது சகோதரிகளும் அடங்கிய சக விசுவாசிகள் குழுவை அழைக்கவும் பயன்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மீறுதல் அவரை ஆட்கொண்டிருந்தால்’ அல்லது ‘அதில் எதிர்பாராமல் சிக்கிக்கொண்டிருந்தால்.’
    reason: alternative_reading
  - marker: c
    text: ‘ஒருவர்’ என்பதற்கான கிரேக்கச் சொல் பொதுவாக ஒரு மனிதரைக் குறிக்கிறது; இங்கு ஆண் அல்லது பெண் எனக் குறிப்பாக வரையறுக்கவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: சகோதரர்களே
  rationale: ஆண்பால் பன்மை விளிவடிவத்தை நேரடியாகப் பிரதிபலிக்கிறது; இச்சூழலில் சக விசுவாசிகள் அடங்கிய முழுக் குழுவையும் குறிக்கக்கூடிய பயன்பாடு அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: ἐὰν καὶ
  choice: …ஆலும்
  rationale: நிபந்தனையோடு கூடிய விட்டுக்கொடுக்கும் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: προλημφθῇ
  choice: அகப்பட்டாலும்
  rationale: ஒரு மீறுதலில் பிடிபடுதல் அல்லது அதனால் எதிர்பாராமல் ஆட்கொள்ளப்படுதல் ஆகிய இரு சாத்திய நுணுக்கங்களுக்கும் இடமளிக்கிறது.
- source_word: ἄνθρωπος
  choice: ஒருவர்
  rationale: பொதுவாக ஒரு மனிதரைக் குறிக்கும் ஒருமையை இயல்பான நவீன தமிழில் தக்கவைக்கிறது; பாலினத்தை கிரேக்கம் இங்கு குறிப்பாக வரையறுப்பதில்லை.
- source_word: ἔν τινι παραπτώματι
  choice: ஏதாவது ஒரு மீறுதலில்
  rationale: τινι என்பதன் குறிப்பிடப்படாத தன்மையையும் παράπτωμα என்பதன் ஒழுக்கத் தவறு அல்லது எல்லைமீறல் சார்ந்த தீவிரத்தையும் வெளிப்படுத்துகிறது.
- source_word: οἱ πνευματικοὶ
  choice: ஆவிக்குரியவர்களாகிய நீங்கள்
  rationale: ஆவியால் பண்புபெற்றவர்கள் அல்லது ஆன்மிக முதிர்ச்சியுள்ளவர்கள் என்ற பவுலின் பரந்த சொல்லாட்சியைச் சுருக்காமல் வைத்திருக்கிறது.
- source_word: καταρτίζετε
  choice: சீர்படுத்துங்கள்
  rationale: தவறியவரை உரிய நிலைக்குத் திரும்பக் கொண்டுவருதல், பழுதைச் சரிசெய்தல் என்ற வினையின் கருத்தையும் கட்டளை வலிமையையும் தருகிறது.
- source_word: τὸν τοιοῦτον
  choice: அப்படிப்பட்டவரை
  rationale: முன்னர் குறிப்பிடப்பட்ட அந்த வகையான நபரைச் சுட்டும் ஒருமையை இயல்பாகக் காட்டுகிறது.
- source_word: ἐν πνεύματι πραΰτητος
  choice: சாந்தமான மனப்பான்மையோடு
  rationale: கடுமையின்றி, சாந்தம் பண்பாக விளங்கும் உள்ளார்ந்த அணுகுமுறையோடு செயல்பட வேண்டும் என்ற கருத்தை இயல்பான தமிழில் தருகிறது.
- source_word: σκοπῶν σεαυτόν
  choice: உங்களையே கவனித்துக்கொள்ளுங்கள்
  rationale: மற்றவரைச் சீர்படுத்துகிற ஒவ்வொருவரும் தம்மைக் குறித்து விழிப்புடன் இருக்க வேண்டும் என்ற தொடர்ச்சியான எச்சரிக்கையைத் தெளிவாகக் கூறுகிறது; கிரேக்க ஒருமை தமிழில் குழுவை நோக்கிய இயல்பான மரியாதைப் பன்மையாக வருகிறது.
- source_word: μὴ καὶ σὺ πειρασθῇς
  choice: நீங்களும் சோதனைக்கு உள்ளாகாதபடி
  rationale: καί காட்டும் ‘நீங்களும்’ என்ற பகிரப்பட்ட ஆபத்தையும், πειράζω என்பதில் உள்ள சோதிக்கப்படுதல்/பாவத்திற்கு இழுக்கப்படுதல் என்ற நுணுக்கத்தையும் பாதுகாக்கிறது.
theological_decisions:
- issue: Ἀδελφοί என்பதன் பாலின வடிவமும் சபை முழுவதையும் குறிக்கும் பயன்பாடும்
  choice: முதன்மை உரையில் ‘சகோதரர்களே’ என்று வைத்து, கலப்புப் பாலின விசுவாசிகள் குழுவையும் குறிக்கலாம் என்பதை அடிக்குறிப்பில் தெரிவிப்பது
  alternative: ‘சகோதர சகோதரிகளே’
  rationale: கிரேக்கத்தின் ஆண்பால் பன்மை வடிவத்தை வெளிப்படையாக வைத்தபடியே அதன் சூழல்சார் உள்ளடக்கிய பயன்பாட்டை மறைக்காமல் விளக்குகிறது.
- issue: προλημφθῇ என்பதன் பொருள்
  choice: ‘அகப்பட்டாலும்’ என்று மொழிபெயர்த்து இரு நுணுக்கங்களையும் அடிக்குறிப்பில் வைப்பது
  alternative: ‘மீறுதல் அவரை ஆட்கொண்டாலும்’ அல்லது ‘எதிர்பாராமல் சிக்கிக்கொண்டாலும்’
  rationale: அவர் தவறு செய்யும்போது கண்டுபிடிக்கப்படுதல் என்றும், தவறு அவரை முந்தி ஆட்கொள்ளுதல் என்றும் புரிந்துகொள்ளும் சாத்தியங்களைத் தீர்மானமாக ஒன்றாக்காமல் பாதுகாக்கிறது.
- issue: ἐν πνεύματι πραΰτητος என்பதில் πνεῦμα குறிக்கும் தளம்
  choice: ‘சாந்தமான மனப்பான்மையோடு’
  alternative: ‘சாந்தத்தின் ஆவியோடு’ அல்லது ‘ஆவியால் உண்டாகும் சாந்தத்தோடு’
  rationale: இலக்கண ரீதியில் மனிதரின் அணுகுமுறை முதன்மையாகத் தோன்றினாலும், கலாத்தியர் 5:23-இன் ஆவியின் கனியுடனான எதிரொலியை மறுக்கும் வகையில் பரிசுத்த ஆவியை உரையில் தனியாகச் சேர்க்கவில்லை.
- issue: πειρασθῇς என்பதன் சோதனை/தூண்டுதல் நுணுக்கம்
  choice: ‘சோதனைக்கு உள்ளாகாதபடி’
  alternative: ‘பாவத்தூண்டுதலுக்கு உள்ளாகாதபடி’
  rationale: ஒழுக்கச் சூழலில் பாவத்திற்கு இழுக்கப்படுதல் முக்கியமாக இருந்தாலும், கிரேக்க வினையின் பரந்த ‘சோதிக்கப்படுதல்’ பொருளைச் சுருக்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சபையில் பொதுவாசிப்பதற்கு ஏற்ற கண்ணியமான நடையைக் கொண்டுள்ளது. ‘சீர்படுத்துங்கள்’ என்பது தண்டித்தல் அல்ல, உரிய நிலைக்குத் திரும்பக் கொண்டுவருதல் என்ற மேய்ப்புப் பொருளைத் தருகிறது. ஒருமை எச்சரிக்கை தமிழில் இயல்பான மரியாதைப் பன்மையால் வழங்கப்பட்டுள்ளது.
