id: GAL.6.17
reference: Galatians 6:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τοῦ λοιποῦ κόπους μοι μηδεὶς παρεχέτω, ἐγὼ γὰρ τὰ στίγματα ⸀τοῦ Ἰησοῦ ἐν τῷ σώματί μου βαστάζω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/017.yaml
  text: From now on let no one cause me trouble[a], for I bear the marks of Jesus on my body.
translation:
  language: ta
  text: இனிமேல் யாரும் எனக்குத் தொல்லை கொடுக்க வேண்டாம். ஏனெனில், இயேசுவின் குறிகளை[a] என் உடலில் தாங்கிக்கொண்டிருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சூட்டுக் குறிகளை”; இச்சொல் உடலில் பதிக்கப்பட்ட குறிகளைக் குறிக்கலாம்; அவை ஒருவர் யாருக்குச் சொந்தமானவர் என்பதையோ அவர் கொண்ட பற்றுறுதியையோ அடையாளப்படுத்தக்கூடும்.
    reason: στίγματα என்பதிலுள்ள உடலில் பதிக்கப்பட்ட முத்திரை, உடைமை அல்லது பற்றுறுதி ஆகிய நுணுக்கங்களைச் சொல் மாற்றில் பாதுகாக்கிறது.
lexical_decisions:
- source_word: Τοῦ λοιποῦ
  choice: இனிமேல்
  rationale: இது ‘இப்போதிலிருந்து’ அல்லது ‘இதுமுதல்’ என்ற காலப்பொருளைத் தரும் இயல்பான தமிழ்ச் சொல்; பவுலின் நிறைவுரைச் சூழலுக்கும் பொருந்துகிறது.
- source_word: κόπους μοι μηδεὶς παρεχέτω
  choice: யாரும் எனக்குத் தொல்லை கொடுக்க வேண்டாம்
  rationale: κόπος பொதுவாக உழைப்பு அல்லது களைப்பைக் குறிக்கலாம்; ஆனால் κόπους παρέχειν என்ற சொற்றொடர் ஒருவருக்குத் தொல்லை அல்லது இடையூறு ஏற்படுத்துவதைக் குறிக்கிறது. மூன்றாம் நபர் கட்டளை வடிவத்தின் தடைப்பொருளை ‘வேண்டாம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὰ στίγματα
  choice: அடையாளக் குறிகளை
  rationale: στίγματα என்பது உடலில் பதிக்கப்பட்ட அல்லது ஏற்பட்ட, உரிமையையோ பற்றுறுதியையோ காட்டக்கூடிய குறிகளைக் குறிக்கலாம். ‘அடையாளக் குறிகள்’ என்பது தழும்புகள், சூட்டுக்குறிகள் அல்லது உருவக அடையாளங்கள் என்று ஒன்றை மட்டும் கட்டாயப்படுத்தாமல் சொல்லின் பரப்பைப் பாதுகாக்கிறது.
- source_word: τοῦ Ἰησοῦ
  choice: இயேசுவின்
  rationale: மூலத்தின் உருபுத் தொடர்பை நேரடியாகப் பாதுகாக்கிறது; இக்குறிகள் இயேசுவுக்குச் சொந்தமானவர் என்பதைக் காட்டுகின்றனவா, இயேசுவுக்காகப் பெற்றவையா, அல்லது அவரோடு ஒன்றுபட்ட துன்பத்தின் குறிகளா என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- source_word: ἐν τῷ σώματί μου
  choice: என் உடலில்
  rationale: ἐν என்பதன் இடப்பொருளை இயல்பான தமிழில் நேரடியாகத் தருகிறது; குறிகள் உடலின்மேல் காணப்படுவதை தமிழில் ‘உடலில்’ தெளிவாகச் சொல்லலாம்.
- source_word: βαστάζω
  choice: சுமக்கிறேன்
  rationale: βαστάζω என்பதன் ‘சுமத்தல்/தாங்குதல்’ பொருளையும், அந்தக் குறிகள் பவுலின் உடலில் தொடர்ந்து இருப்பதையும் ‘சுமக்கிறேன்’ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பவுலின் στίγματα என்பவற்றின் தன்மை
  choice: ‘இயேசுவின் அடையாளக் குறிகள்’ என்று நடுநிலையாக மொழிபெயர்க்கப்பட்டது.
  alternative: துன்புறுத்தலால் ஏற்பட்ட நேரடி தழும்புகள்; இயேசுவுக்குச் சொந்தமானவர் என்பதைக் காட்டும் சூட்டுக்குறிகள்; அப்போஸ்தலத் துன்பத்தையும் இயேசுவோடு அடையாளப்படுத்தப்படுதலையும் குறிக்கும் உருவகம்.
  rationale: இச்சொல் பவுலின் துன்பங்களால் உடலில் ஏற்பட்ட குறிகளையும், அவர் இயேசுவுக்குச் சொந்தமானவர் என்ற அடையாளத்தையும் ஒருங்கே நினைவூட்டக்கூடும். ஆனால் வசனம் இவற்றில் ஒன்றை மட்டும் வெளிப்படையாகத் தேர்ந்தெடுக்காததால் அந்த விளக்கத் திறந்தநிலை பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நிறைவுரைத் தொனி பயன்படுத்தப்பட்டுள்ளது. ‘தொல்லை கொடுக்க வேண்டாம்’ என்பது கிரேக்கச் சொற்றொடரின் வழக்குப் பொருளை இயல்பாகத் தருகிறது; ‘அடையாளக் குறிகள்’ என்பது தேவையற்ற விளக்கச் சுருக்கத்தைத் தவிர்க்கிறது.
