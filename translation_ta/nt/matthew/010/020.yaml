id: MAT.10.20
reference: Matthew 10:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐ γὰρ ὑμεῖς ἐστε οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τοῦ πατρὸς ὑμῶν τὸ λαλοῦν ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/020.yaml
  text: For it is not you who are speaking[b][a], but the Spirit of your Father speaking in you.
translation:
  language: ta
  text: ஏனெனில், பேசுகிறவர்கள் நீங்கள் அல்ல; உங்கள் தந்தையின் ஆவியே உங்களுக்குள் பேசுகிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் மூலமாகப் பேசுகிறார்.” கிரேக்கத்தில் நேரடியாக “உங்களுக்குள்” என்று உள்ளது; சீடர்கள் மூலமாக வெளிப்படும் பேச்சையும் அது குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: ஏனெனில் ... அல்ல
  rationale: γάρ முந்தைய வாக்குறுதிக்கான விளக்கத்தை அறிமுகப்படுத்துகிறது; οὐ மறுப்பைத் தெளிவாகக் காக்கிறது.
- source_word: ὑμεῖς
  choice: நீங்கள்
  rationale: கிரேக்கத்தில் வெளிப்படையாகவும் அழுத்தத்துடனும் வரும் பன்மை முன்னிலைப்பெயரை இயல்பான தமிழில் காக்கிறது.
- source_word: ἐστε οἱ λαλοῦντες
  choice: பேசுகிறவர்கள்
  rationale: தொடர்ந்து நடைபெறும் பேச்சையும், பேசுபவர்கள் யார் என்பதிலுள்ள அழுத்தத்தையும் நிகழ்கால வினையெச்சப் பெயராக்கம் வெளிப்படுத்துகிறது.
- source_word: ἀλλὰ
  choice: ஆனால் என்பதற்குப் பதிலாக அரைப்புள்ளிக்குப் பின் எதிர்மறை அமைப்பு
  rationale: தமிழில் ‘அல்ல; ... ஆவியே’ என்ற அமைப்பு ἀλλὰ குறிக்கும் வலுவான முரண்பாட்டை இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: τὸ πνεῦμα
  choice: ஆவி
  rationale: சூழலில் இது மனித மனப்பாங்கையோ மூச்சையோ அல்ல, தெய்வீக ஆவியைக் குறிக்கிறது.
- source_word: τοῦ πατρὸς ὑμῶν
  choice: உங்கள் தந்தையின்
  rationale: மூலத்தில் இல்லாத ‘பரலோக’ என்ற சொல்லைச் சேர்க்காமல் உறவைக் குறிக்கும் மரபுத்தொடரை நேரடியாகக் காக்கிறது.
- source_word: τὸ λαλοῦν
  choice: பேசுகிறார்
  rationale: ஆவியே பேசும் எழுவாய் என்பதைத் தெளிவாக்கி, நிகழ்காலத் தொடர்ச்சியை இயல்பான தமிழில் வழங்குகிறது.
- source_word: ἐν ὑμῖν
  choice: உங்களுக்குள்
  rationale: ἐν என்பதன் நேரடியான இடப்பொருளைத் தக்கவைத்து, ‘உங்கள் மூலமாக’ என்று கருவிப்பொருளாக மட்டும் முடிவுசெய்வதைத் தவிர்க்கிறது.
theological_decisions:
- issue: ἐν ὑμῖν என்பது ‘உங்களுக்குள்’ என்ற உள்ளிருப்பையா, ‘உங்கள் மூலமாக’ என்ற செயலாண்மையையா குறிக்கிறது?
  choice: உங்களுக்குள்
  alternative: உங்கள் மூலமாக
  rationale: ἐν என்பதன் நேரடியான பொருள் ‘உள்ளே/உள்’ என்பதாகும். சூழல் சீடர்கள் வாயிலாக வெளிப்படும் பேச்சைக் குறிப்பதாக இருக்கலாம்; ஆயினும் மூலத்தில் உள்ள இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் முதன்மை உரை நேரடியான பொருளைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை. ‘பேசுகிறவர்கள் நீங்கள் அல்ல; ... ஆவியே’ என்ற அமைப்பு கிரேக்கத்தின் வலியுறுத்தலையும் எதிர்மறை முரண்பாட்டையும் காக்கிறது. ‘ஆவியானவர்’ போன்ற மரபுசார் விரிவாக்கம் சேர்க்கப்படவில்லை.
