id: MAT.10.31
reference: Matthew 10:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μὴ οὖν ⸀φοβεῖσθε· πολλῶν στρουθίων διαφέρετε ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/031.yaml
  text: Therefore[a], do not be afraid; you are worth more than many sparrows.
translation:
  language: ta
  text: ஆகவே, பயப்படாதீர்கள்; பல சிட்டுக்குருவிகளைவிட நீங்கள் மதிப்புமிக்கவர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ οὖν
  choice: ஆகவே, ... பயப்படாதீர்கள்
  rationale: οὖν முந்தைய வசனங்களில் கூறப்பட்ட தந்தையின் பராமரிப்பிலிருந்து வரும் முடிவைக் குறிக்கிறது; μὴ உடன் வரும் நிகழ்காலக் கட்டளை எதிர்மறைக் கட்டளையாக இயல்பாக மொழிபெயர்க்கப்படுகிறது.
- source_word: φοβεῖσθε
  choice: பயப்படாதீர்கள்
  rationale: φοβέομαι என்பதன் இக்கட்டளை வடிவம் அஞ்ச வேண்டாம் என்ற பொருளைத் தருகிறது; நவீனத் தமிழில் இது இயல்பானதும் நேரடியானதும் ஆகும்.
- source_word: πολλῶν στρουθίων
  choice: பல சிட்டுக்குருவிகளைவிட
  rationale: உடனடி சூழலில் στρουθίον சிட்டுக்குருவிகளைக் குறிக்கிறது; διαφέρετε உடனான ஒப்பீட்டுப் பொருளை ‘-ஐவிட’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: διαφέρετε
  choice: மதிப்புமிக்கவர்கள்
  rationale: இங்கு διαφέρω வெறுமனே வேறுபடுதல் அல்ல, மதிப்பில் மேலானவர்களாக இருத்தலைக் குறிக்கிறது. ‘மதிப்புமிக்கவர்கள்’ என்பது அந்த ஒப்பீட்டு மதிப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ὑμεῖς
  choice: நீங்கள்
  rationale: வெளிப்படையாக உள்ள சுட்டுப்பெயர் சீடர்களைச் சிட்டுக்குருவிகளுடன் ஒப்பிட்டு வலியுறுத்துகிறது; தமிழில் ‘நீங்கள்’ என்பதைச் சேர்ப்பது அந்த அழுத்தத்தைப் பேணுகிறது.
theological_decisions:
- issue: இயேசுவின் போதனையில் மனிதர்களுக்கும் சிட்டுக்குருவிகளுக்கும் இடையிலான ஒப்பீட்டு மதிப்பு
  choice: பல சிட்டுக்குருவிகளைவிட நீங்கள் மதிப்புமிக்கவர்கள்
  alternative: பல சிட்டுக்குருவிகளைவிட நீங்கள் மேலானவர்கள்
  rationale: இவ்வசனம் சிட்டுக்குருவிகள்மீது கடவுளுக்கு அக்கறை இல்லை என்று கூறாமல், சீடர்கள்மீது அவர் கொண்டுள்ள அதிகமான அக்கறையை ஒப்பீட்டின் மூலம் வலியுறுத்துகிறது. ‘மதிப்புமிக்கவர்கள்’ என்பது διαφέρετε என்பதன் சூழல்சார் மதிப்புப் பொருளைத் தெளிவாகப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆகவே’ தர்க்கத் தொடர்பையும், ‘பயப்படாதீர்கள்’ பன்மை கட்டளையையும், ‘நீங்கள்’ மூலமொழியின் வலியுறுத்தலையும் பேணுகின்றன.
