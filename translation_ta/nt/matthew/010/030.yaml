  text: But even the hairs of your head are all numbered[a].
translation:
  language: ta
  text: ஆனால், உங்கள் தலையிலுள்ள முடிகள்கூட அனைத்தும் எண்ணப்பட்டிருக்கின்றன[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எண்ணப்பட்டுள்ளன.’ கிரேக்கத்தின் சுற்றுரையான நிறைவுக்காலச் செயப்பாட்டு அமைப்பு, முடிவுற்ற செயலையும் அதன் விளைவாக நீடிக்கும் நிலையையும் வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμῶν
  choice: உங்கள்
  rationale: இரண்டாம் நபர் பன்மை உடைமைப் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய சூழலில் வரும் ஆறுதலோடு தொடர்புடைய மென்மையான எதிர்மாற்றத்தைப் பாதுகாக்கிறது.
- source_word: καὶ
  choice: கூட
  rationale: சிறியதாகத் தோன்றும் தலைமுடிகளும் விதிவிலக்கல்ல என்ற வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
- source_word: αἱ τρίχες τῆς κεφαλῆς
  choice: உங்கள் தலையிலுள்ள முடிகள்
  rationale: கிரேக்க உடைமைத் தொடர்பைச் சொற்சுமையின்றி, இயல்பான தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: πᾶσαι
  choice: எல்லாம்
  rationale: ஒவ்வொரு முடியையும் உள்ளடக்கும் முழுமையைப் பாதுகாக்கிறது.
- source_word: ἠριθμημέναι εἰσίν
  choice: எண்ணப்பட்டிருக்கின்றன
  rationale: முன்னரே நிறைவேறிய செயலும் தற்போது நீடிக்கும் அதன் விளைவு நிலையும் ஆகிய கிரேக்க நிறைவுக்காலச் செயப்பாட்டு வடிவின் இரு கூறுகளையும் தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இறைவனுடைய அறிவும் அக்கறையும் எந்த அளவு விரிந்தவை என்பது குறித்த உட்பொருள்
  choice: முடிகள் அனைத்தும் எண்ணப்பட்டிருக்கின்றன என்ற தெளிவான உருவகக் கூற்றை அப்படியே வைத்தல்
  alternative: இறைவனுடைய பராமரிப்பு அல்லது ஆளுகையை விளக்கமாக மொழிபெயர்த்தல்
  rationale: மூலவசனம் நேரடியாகக் கூறும் concrete உருவகத்தைப் பாதுகாத்து, அதன் இறையியல் உட்பொருளைச் சூழலிலிருந்து வாசகர் உணர இடமளிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயினும் கண்ணியமான நடை. ‘தலைமுடிகள்’ என்பதற்குப் பதிலாக ‘தலையிலுள்ள முடிகள்’ என்பது ஒவ்வொரு முடியையும் குறிக்கும் மூலத்தின் பன்மை உருவகத்தைத் தெளிவாகப் பாதுகாக்கிறது.
