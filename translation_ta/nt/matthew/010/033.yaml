id: MAT.10.33
reference: Matthew 10:33
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅστις ⸂δ’ ἂν⸃ ἀρνήσηταί με ἔμπροσθεν τῶν ἀνθρώπων, ἀρνήσομαι ⸂κἀγὼ αὐτὸν⸃ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/033.yaml
  text: But whoever denies me before men[b][a], I also will deny him before my Father who is in heaven.
translation:
  language: ta
  text: ஆனால், மனிதர்கள் முன்னிலையில் என்னை மறுதலிக்கிறவன் எவனோ, அவனை நானும் பரலோகத்தில் இருக்கிற என் தந்தையின் முன்பாக மறுதலிப்பேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படியாக, ‘வானங்களில் இருக்கிறவர்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις δ’ ἂν
  choice: ஆனால், ... எவனோ
  rationale: δέ முந்தைய வசனத்துடன் உள்ள எதிர்மறை மாறுபாட்டைச் சுட்டுகிறது; ὅστις ... ἂν பொதுவான நிபந்தனையைத் தருவதால், தமிழில் ‘... எவனோ’ என்று இயல்பாகவும் விரிந்த பொருளுடனும் மொழிபெயர்க்கப்பட்டது.
- source_word: ἀρνήσηταί με
  choice: என்னை மறுதலிக்கிறவன்
  rationale: ἀρνέομαι என்பது மறுத்தல் அல்லது உறவை ஏற்க மறுத்தல் என்னும் பொருளைக் கொண்டது. ‘மறுதலிக்கிறவன்’ இங்குள்ள பொதுவெளி மறுப்பையும் அடுத்த வினையுடனான சொல்லிணைப்பையும் காக்கிறது.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: மனிதர்களுக்கு முன்பாக
  rationale: ἔμπροσθεν என்பது ‘முன்பாக/முன்னிலையில்’ என்றும், ἀνθρώπων இங்கு பொதுவாக மனிதர்களைக் குறிக்கிறது; நவீன தமிழில் ‘மனிதர்கள்’ மூலத்தின் பொதுவான வரம்பைத் தெளிவாகத் தருகிறது.
- source_word: ἀρνήσομαι κἀγὼ αὐτόν
  choice: அவனை நானும் ... மறுதலிப்பேன்
  rationale: κἀγώ தரும் ‘நானும்’ என்ற பதிலொத்த வலியுறுத்தல் காக்கப்பட்டுள்ளது. இரு இடங்களிலும் ஒரே தமிழ் வினையைப் பயன்படுத்துவது மூலத்தின் நேரடியான பரஸ்பர ஒப்புமையைப் பாதுகாக்கிறது.
- source_word: ἔμπροσθεν τοῦ πατρός μου
  choice: என் தந்தைக்கு முன்பாக
  rationale: இயேசுவின் முதல் நபர் உறவுச் சொல்லை விரிவாக்கமின்றி நேரடியாகக் கொடுக்கிறது.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: பரலோகத்திலிருக்கிற
  rationale: οὐρανοῖς கிரேக்கத்தில் பன்மை வடிவில் இருந்தாலும், தமிழில் ‘பரலோகம்’ என்பது இயல்பான நிலைபெற்ற ஒருமை வழக்கு; சொற்படியான பன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: மறுதலிப்பின் பதிலொத்த மொழி
  choice: என்னை மறுதலிக்கிறவன் ... அவனை நானும் ... மறுதலிப்பேன்
  alternative: என்னை ஏற்க மறுக்கிறவன் ... அவனை நானும் ஏற்க மறுப்பேன்
  rationale: இரு இடங்களிலும் வரும் ἀρνέομαι என்பதற்கு ஒரே சொல்லைப் பயன்படுத்தி, வசனத்தின் கடுமையான பரஸ்பர அமைப்பைத் தக்கவைக்கிறது; அதன் விளைவின் தன்மையை உரைக்கு அப்பால் விளக்கவில்லை.
- issue: ἀνθρώπων மற்றும் αὐτόν ஆகியவற்றின் சுட்டல்
  choice: மனிதர்களுக்கு முன்பாக ... அவனை
  alternative: மக்களுக்கு முன்பாக ... அந்த நபரை
  rationale: ἀνθρώπων இங்கு மனிதர்களை பொதுவாகக் குறிக்கிறது; ‘மனிதர்கள்’ அதை இயல்பாகக் காட்டுகிறது. αὐτόν முன் குறிப்பிடப்பட்ட தனிநபரை ஆண்பால் ஒருமையில் மீண்டும் சுட்டுவதால் ‘அவனை’ என வழங்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘மறுதலித்தல்’ என்ற வேதாகமப் பயன்பாட்டில் பரிச்சயமான சொல், இரண்டு வினைகளின் சொல்லொற்றுமையைப் பாதுகாக்கத் தேர்ந்தெடுக்கப்பட்டது. அடிக்குறி [a] முதன்மை உரையில் இடம்பெறுகிறது.
