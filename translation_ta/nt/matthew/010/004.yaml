  text: Σίμων ὁ ⸀Καναναῖος καὶ Ἰούδας ⸀ὁ Ἰσκαριώτης ὁ καὶ παραδοὺς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/004.yaml
  text: Simon the Cananaean[a], and Judas Iscariot[b], who also betrayed him.
translation:
  language: ta
  text: கனானேயனான சீமோன்[a], இஸ்கரியோத் யூதாஸ்—அவரைக் காட்டிக்கொடுத்தவனும் அவனே[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீவிர ஆர்வலனான சீமோன்.” இங்குள்ள கிரேக்கச் சொல் “கனானேயன்” என்று உள்ளது; இது பொதுவாக “தீவிர ஆர்வலன்” என்று புரிந்துகொள்ளப்படும் அரமேய அல்லது எபிரேயப் பெயரைக் பிரதிபலிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவரை ஒப்படைத்தவன்.” கிரேக்க வினைச்சொல் பொதுவாக “ஒப்படைத்தல்” எனப் பொருள்படலாம்; யூதாஸைப் பற்றிய இந்தக் கதைச்சூழலில் “காட்டிக்கொடுத்தல்” என்பது பொருத்தமானது.
    reason: alternative_reading
lexical_decisions:
- source_word: Καναναῖος
  choice: கனானேயன்
  rationale: கிரேக்க வடிவை விளக்கமாக மாற்றாமல் ஒலிபெயர்த்து, மத்தேயுவின் சொல்வடிவத்தைப் பாதுகாக்கிறது. அரமேய/எபிரேயப் பின்னணியில் இது ‘தீவிர ஆர்வலன்’ எனப் புரிந்துகொள்ளப்படுவது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: Ἰσκαριώτης
  choice: இஸ்கரியோத்
  rationale: யூதாஸின் அடைபெயருக்கான தமிழில் வழக்கமான ஒலிபெயர்ப்பு.
- source_word: παραδοὺς
  choice: காட்டிக்கொடுத்தவன்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘ஒப்படைத்தல்’ என்றாலும், யூதாஸைக் குறிக்கும் இந்தக் கதைச்சூழலில் வஞ்சகமாக எதிரிகளிடம் ஒப்படைத்த செயலை இயல்பான தமிழில் தெரிவிக்கிறது; பரந்த சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ὁ καὶ παραδοὺς αὐτόν
  choice: இவனே அவரைக் காட்டிக்கொடுத்தவன்
  rationale: பெயரெச்சத் தொடரை இயல்பான தமிழ் அடையாளப்படுத்தும் வாக்கியமாக வழங்குகிறது. καί-யின் வலியுறுத்தலை ‘இவனே’ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: παραδοὺς என்பதை நடுநிலையான ‘ஒப்படைத்தவன்’ என்றா அல்லது சூழலுக்கேற்ற ‘காட்டிக்கொடுத்தவன்’ என்றா மொழிபெயர்ப்பது
  choice: காட்டிக்கொடுத்தவன்
  alternative: ஒப்படைத்தவன்
  rationale: நற்செய்திக் கதைச்சூழலில் யூதாஸ் இயேசுவை வஞ்சகமாக எதிரிகளிடம் ஒப்படைத்ததையே இது அடையாளப்படுத்துகிறது. ‘காட்டிக்கொடுத்தவன்’ அந்த உறவுசார் மற்றும் அறச்சார் வலிமையை இயல்பான தமிழில் தருகிறது; கிரேக்க வினையின் பரந்த பொருள் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. பெயர்கள் தமிழ் வேதாகம வழக்குக்கு ஏற்ப ஒலிபெயர்க்கப்பட்டுள்ளன; மூலத்தின் சொற்பொருள் வேறுபாடுகள் அடிக்குறிப்புகளில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன.
