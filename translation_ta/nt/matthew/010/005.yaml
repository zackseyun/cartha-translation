id: MAT.10.5
reference: Matthew 10:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τούτους τοὺς δώδεκα ἀπέστειλεν ὁ Ἰησοῦς παραγγείλας αὐτοῖς λέγων· Εἰς ὁδὸν ἐθνῶν μὴ ἀπέλθητε καὶ εἰς πόλιν Σαμαριτῶν μὴ εἰσέλθητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/005.yaml
  text: Jesus sent out these twelve, instructing them, saying, “Do not go on the road to the Gentiles, and do not enter a town of the Samaritans.”
translation:
  language: ta
  text: 'இயேசு இந்தப் பன்னிருவரையும் அனுப்பி, அவர்களுக்குக் கட்டளையிட்டுக் கூறினார்: “யூதரல்லாதவர்களிடம் செல்லும் வழியில் போகாதீர்கள்[a]; ஒரு சமாரியர் ஊருக்குள் நுழையாதீர்கள்[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதரல்லாதவர்களின் வழியில் போகாதீர்கள்.” கிரேக்கத்தில் சொல்லுக்குச் சொல் ‘யூதரல்லாதவர்களின் வழிக்குள்’ என உள்ளது; அது யூதரல்லாதவர்களிடம் அல்லது அவர்கள் வாழும் பகுதிகளை நோக்கிச் செல்வதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “சமாரியர்களின் ஒரு ஊருக்குள் நுழையாதீர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτους τοὺς δώδεκα
  choice: இந்தப் பன்னிருவரையும்
  rationale: முன்னரே பெயரிடப்பட்ட குழுவைச் சுட்டுகிறது. கிரேக்கத்தில் இல்லாத ‘சீடர்கள்’ என்ற சொல்லைச் சேர்க்காமல் இயல்பான தமிழில் தரப்படுகிறது.
- source_word: ἀπέστειλεν
  choice: அனுப்பி
  rationale: ஒரு பணிக்காக அனுப்புதல் என்ற பொருளைச் சூழல் வெளிப்படுத்துகிறது; அடுத்த வினையுடன் இயல்பாக இணைக்க ‘அனுப்பி’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: παραγγείλας αὐτοῖς λέγων
  choice: அவர்களுக்குக் கட்டளையிட்டுச் சொன்னார்
  rationale: παραγγέλλω என்பதிலுள்ள அதிகாரபூர்வமான அறிவுறுத்தலின் வலிமையையும் λέγων அறிமுகப்படுத்தும் நேரடிக் கூற்றையும் இயல்பான தமிழில் காக்கிறது.
- source_word: Εἰς ὁδὸν ἐθνῶν
  choice: யூதரல்லாதவர்களின் பகுதிக்குச் செல்லும் பாதையில்
  rationale: ὁδός என்பதன் பாதை மொழியைத் தக்கவைத்து, இச்சூழலில் ἔθνη குறிக்கும் யூதரல்லாத மக்களின் பகுதிகளை நோக்கிச் செல்வதைக் கூறுகிறது; கிரேக்கத் தொடரின் சுருக்கத்தால் உண்டாகும் மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐθνῶν
  choice: யூதரல்லாதவர்கள்
  rationale: இங்கு ἔθνη என்பது யூதரல்லாத மக்களைக் குறிக்கிறது. ‘புறவினத்தார்’ என்பதைவிட இன்றைய பொதுவாசகருக்குத் தெளிவான சொல்.
- source_word: μὴ ἀπέλθητε
  choice: போகாதீர்கள்
  rationale: μή உடன் வரும் aorist subjunctive தடை கட்டளையாக உள்ளது; தமிழில் நேரடியான பன்மை மரியாதை ஏவல் வடிவம் பொருத்தமானது.
- source_word: εἰς πόλιν Σαμαριτῶν
  choice: சமாரியர்களின் எந்த ஊருக்குள்ளும்
  rationale: πόλις இங்கு நகரம் அல்லது ஊர் என வரலாம்; ‘ஊர்’ அளவை மிகைப்படுத்தாமல் இயல்பாக உள்ளது. எதிர்மறை வாக்கியத்தில் கட்டுரையற்ற ஒருமையின் பொதுவான வலிமையை ‘எந்த ... உம்’ வெளிப்படுத்துகிறது.
- source_word: μὴ εἰσέλθητε
  choice: நுழையாதீர்கள்
  rationale: ஒரு சமாரிய ஊருக்குள் செல்வதைத் தடைசெய்யும் கிரேக்க வினையின் நேரடியான பொருளைக் காக்கிறது.
theological_decisions:
- issue: யூதரல்லாதவர்களையும் சமாரியர்களையும் குறித்த தடையின் காலமும் வரம்பும்
  choice: இந்த அனுப்புதலுக்குரிய நேரடியான பணி அறிவுறுத்தலாக மட்டும் மொழிபெயர்க்கப்பட்டது; அதன் வலிமை குறைக்கப்படவில்லை.
  alternative: இதை எல்லாக் காலத்திற்குமான முழுமையான விலக்காகத் தோன்றச் செய்யும் சொற்றொடர்.
  rationale: இந்த வசனம் தடையைத் தெளிவாகக் கூறுகிறது; ஆனால் அது நிரந்தரமானது என்று கூறவில்லை. ஆகவே மொழிபெயர்ப்பு வசனத்தின் இறையியல் பதற்றத்தைத் தக்கவைத்து, கூடுதல் முடிவை இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘யூதரல்லாதவர்கள்’ தெளிவுக்காகத் தேர்ந்தெடுக்கப்பட்டது; ‘புறவினத்தார்’ போன்ற மரபுசார் ஆனால் இன்றைக்கு குறைவாக இயல்பான சொல்லைத் தவிர்த்துள்ளது. நேரடிக் கட்டளையின் வலிமை ‘போகாதீர்கள் / நுழையாதீர்கள்’ என்பவற்றால் காக்கப்படுகிறது.
