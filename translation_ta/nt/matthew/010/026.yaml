review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys οὖν (‘therefore’), the plural object of the command (‘them’), and both parallel assertions. It preserves the distinction between κεκαλυμμένον (‘covered/concealed’) and κρυπτόν (‘hidden’), as well as the future passive outcomes of revelation and being made known.
  naturalness: The sentence structure is clear and appropriately formal for modern standard Tamil. However, ‘மறைவாயிருப்பது’ is less idiomatic than ‘மறைந்திருப்பது’ in contemporary Tamil and does not improve precision.
  terminology: ‘ஆகையால்,’ ‘அவர்களுக்குப் பயப்படாதீர்கள்,’ ‘மூடப்பட்டிருப்பது,’ ‘வெளிப்படுத்தப்படாமல்,’ and ‘அறியப்படாமல்’ are suitable. Replacing only ‘மறைவாயிருப்பது’ with ‘மறைந்திருப்பது’ improves natural usage while retaining the source distinction from ‘மூடப்பட்டிருப்பது.’
  issues:
  - severity: low
    issue: Less natural expression ‘மறைவாயிருப்பது’
    rationale: Modern standard Tamil ordinarily expresses the state denoted by κρυπτόν as ‘மறைந்திருப்பது.’ The proposed wording is more idiomatic and leaves the meaning unchanged.
  revised_text: ஆகையால், அவர்களுக்குப் பயப்படாதீர்கள். ஏனெனில், வெளிப்படுத்தப்படாமல் மூடப்பட்டிருப்பது எதுவும் இல்லை; அறியப்படாமல் மறைந்திருப்பதும் எதுவும் இல்லை.
  revised_footnotes: []
  revision_rationale: A minimal idiomatic revision changes ‘மறைவாயிருப்பது’ to ‘மறைந்திருப்பது.’ The translation continues to avoid specifying what is covered or hidden, as the Greek leaves that referent open.
