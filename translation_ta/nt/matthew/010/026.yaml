revisions:
- from: ஆகையால், அவர்களுக்குப் பயப்படாதீர்கள். ஏனெனில், வெளிப்படுத்தப்படாமல் மூடப்பட்டிருப்பது எதுவும் இல்லை; அறியப்படாமல் மறைவாயிருப்பதும் எதுவும் இல்லை.
  to: ஆகையால், அவர்களுக்குப் பயப்படாதீர்கள். ஏனெனில், வெளிப்படுத்தப்படாமல் மூடப்பட்டிருப்பது எதுவும் இல்லை; அறியப்படாமல் மறைந்திருப்பதும் எதுவும் இல்லை.
  rationale: A minimal idiomatic revision changes ‘மறைவாயிருப்பது’ to ‘மறைந்திருப்பது.’ The translation continues to avoid specifying what is covered or hidden, as the Greek leaves that referent open.
