id: MAT.10.26
reference: Matthew 10:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Μὴ οὖν φοβηθῆτε αὐτούς· οὐδὲν γάρ ἐστιν κεκαλυμμένον ὃ οὐκ ἀποκαλυφθήσεται, καὶ κρυπτὸν ὃ οὐ γνωσθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/026.yaml
  text: Therefore, do not fear them, for nothing is covered that will not be revealed, and hidden that will not be made known.
translation:
  language: ta
  text: ஆகையால், அவர்களுக்குப் பயப்படாதீர்கள். ஏனெனில், வெளிப்படுத்தப்படாமல் மூடப்பட்டிருப்பது எதுவும் இல்லை; அறியப்படாமல் மறைந்திருப்பதும் எதுவும் இல்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: ஆகையால்
  rationale: முந்தைய போதனையிலிருந்து வரும் முடிவுறு தொடர்பை இயல்பாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: φοβηθῆτε αὐτούς
  choice: அவர்களுக்குப் பயப்படாதீர்கள்
  rationale: எதிர்மறை கட்டளையின் வலிமையையும் αὐτούς என்பதன் குறிப்பையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: κεκαλυμμένον
  choice: மூடப்பட்டிருப்பது
  rationale: καλύπτω என்பதன் ‘மூடுதல்/மறைத்தல்’ உருவகத்தைப் பாதுகாக்கிறது; அடுத்துள்ள κρυπτόν என்பதிலிருந்து சொல் வேறுபாட்டையும் வைத்திருக்கிறது.
- source_word: ἀποκαλυφθήσεται
  choice: வெளிப்படுத்தப்படாமல்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவமான ‘வெளிப்படுத்தப்படும்’ என்ற பொருளை, தமிழின் ‘எதுவும் இல்லை’ அமைப்புக்கேற்ற எதிர்மறை வினையெச்சத் தொடரில் இயல்பாக வழங்குகிறது.
- source_word: κρυπτὸν
  choice: மறைவாயிருப்பது
  rationale: மறைந்திருக்கும் ஒன்றைக் குறிக்கும் பெயரடைத் தன்மையை இயல்பான தமிழில் தருகிறது.
- source_word: γνωσθήσεται
  choice: அறியப்படாமல்
  rationale: செயப்பாட்டு வடிவத்தையும் ‘அறியப்படும்/தெரியவரும்’ என்ற பரந்த பொருளையும் தேவையின்றி விளக்காமல் பாதுகாக்கிறது.
theological_decisions:
- issue: மூடப்பட்டதும் மறைவானதும் பின்னர் வெளிப்பட்டு அறியப்படும் என்ற கூற்றின் பரப்பு
  choice: ‘எதுவும் இல்லை’ என்ற முழுமையான சொல்லாட்சியை அப்படியே பாதுகாத்தல்
  alternative: இதை சீடர்களின் செய்தி அல்லது துன்புறுத்துவோரின் செயல்கள் என்று குறிப்பாக விளக்குதல்
  rationale: கிரேக்க வசனம் எந்த ஒரு பொருளையும் வெளிப்படையாக நிர்ணயிக்கவில்லை; சூழல் பல தொடர்புகளை அனுமதிப்பதால் மொழிபெயர்ப்பு அந்தத் திறந்த தன்மையைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதைமிக்க பன்மை கட்டளை பயன்படுத்தப்பட்டுள்ளது. இரண்டு இணையான கூறுகளிலும் மூலத்தின் ‘மூடப்பட்டிருப்பது / மறைவாயிருப்பது’ மற்றும் ‘வெளிப்படுத்தப்படுதல் / அறியப்படுதல்’ என்ற வேறுபாடுகள் காக்கப்பட்டுள்ளன.
