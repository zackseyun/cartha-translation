  to: 'அவர்கள் உங்களை இந்த நகரத்தில் துன்புறுத்தும்போதெல்லாம், வேறொரு நகரத்திற்குத் தப்பிச் செல்லுங்கள்.[a] உண்மையாக உங்களுக்குச் சொல்கிறேன்: மனிதகுமாரன் வரும்வரை நீங்கள் இஸ்ரவேலின் நகரங்களுக்குச் சென்று முடிக்கவே மாட்டீர்கள்.[b][c]'
  rationale: The revision replaces the overly specific ‘next city’ with ‘another city,’ preserving the breadth of ἑτέραν, and smooths the future-negative expression. It retains the explicit contextual traversal sense, the emphatic negation, the conventional title ‘மனிதகுமாரன்,’ and the source text’s intentionally unresolved reference to the Son of Man’s coming.
