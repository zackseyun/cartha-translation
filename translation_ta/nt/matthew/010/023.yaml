id: MAT.10.23
reference: Matthew 10:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅταν δὲ διώκωσιν ὑμᾶς ἐν τῇ πόλει ταύτῃ, φεύγετε εἰς τὴν ⸀ἑτέραν· ἀμὴν γὰρ λέγω ὑμῖν, οὐ μὴ τελέσητε τὰς πόλεις ⸀τοῦ Ἰσραὴλ ἕως ⸀ἂν ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/023.yaml
  text: But whenever they persecute you in this city[a], flee to the next one. For truly I say to you[c][b], you will certainly not finish going through the cities of Israel until the Son of Man comes.
translation:
  language: ta
  text: 'அவர்கள் உங்களை இந்த நகரத்தில் துன்புறுத்தும்போதெல்லாம், வேறொரு நகரத்திற்குத் தப்பிச் செல்லுங்கள்.[a] உண்மையாக உங்களுக்குச் சொல்கிறேன்: மனிதகுமாரன் வரும்வரை நீங்கள் இஸ்ரவேலின் நகரங்களுக்குச் சென்று முடிக்கவே மாட்டீர்கள்.[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அடுத்த நகரத்திற்குத் தப்பிச் செல்லுங்கள்.’ கிரேக்கத்தில் சொல்லுக்குச் சொல் ‘மற்றதற்கு’ என்று உள்ளது; முந்தைய தொடரிலிருந்து ‘நகரம்’ என்பது பொருளில் கொள்ளப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘இஸ்ரவேலின் நகரங்களை நீங்கள் முடிக்கவே மாட்டீர்கள்.’ ‘சென்று முடிக்க’ என்பது, சூழல் உணர்த்தும் நகரம்தோறும் செல்லும் பணியை வெளிப்படையாக்குகிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘மனிதகுமாரன் வரும்வரை’ என்பது திட்டமிட்டே விளக்கத்திற்குத் திறந்தவாறு விடப்பட்டுள்ளது. இது இயேசுவின் நியாயப்படுத்தப்படுதல், தீர்ப்பளிக்க அவர் வருதல், அல்லது அவரது இறுதி வருகை ஆகியவற்றில் எதைக் குறிக்கிறது என்பதில் விளக்கங்கள் வேறுபடுகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν
  choice: துன்புறுத்தும்போதெல்லாம்
  rationale: குறிப்பிடப்படாத காலத்தில் நிகழக்கூடிய அல்லது மீண்டும் நிகழக்கூடிய செயலைக் குறிக்கும் ὅταν என்பதன் திறந்த கால உணர்வை ‘போதெல்லாம்’ வெளிப்படுத்துகிறது.
- source_word: διώκωσιν
  choice: துன்புறுத்து
  rationale: இங்கு வெறுமனே பின்தொடர்வதை அல்ல, சீடர்களுக்கு எதிரான பகைமையான துன்புறுத்தலைக் குறிக்கிறது.
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: இந்த நகரத்தில்
  rationale: ταύτῃ என்பதன் அண்மைச் சுட்டை நேரடியாகப் பாதுகாக்கிறது.
- source_word: φεύγετε
  choice: தப்பிச் செல்லுங்கள்
  rationale: துன்புறுத்தலின் நடுவில் உடனடியாக விலகிச் செல்லுமாறு கூறும் கட்டளையின் அவசரத்தையும் இயல்பான நவீனத் தமிழையும் இணைக்கிறது.
- source_word: εἰς τὴν ἑτέραν
  choice: அடுத்த நகரத்திற்கு
  rationale: முந்தைய தொடரிலுள்ள ‘நகரம்’ இங்கே விடுபட்டுப் பொருளில் கொள்ளப்படுகிறது; ἑτέραν மற்றொரு அல்லது அடுத்த நகரத்தைக் குறிக்கிறது.
- source_word: ἀμὴν
  choice: உண்மையாகவே
  rationale: இயேசுவின் அதிகாரமிக்க உறுதியுரையை நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: οὐ μὴ τελέσητε
  choice: சென்று முடித்திருக்கவே மாட்டீர்கள்
  rationale: οὐ μή என்பதன் வலியுறுத்தப்பட்ட மறுப்பை ‘வே மாட்டீர்கள்’ காட்டுகிறது; நகரங்களைப் பற்றிய τελέω என்பதில் சூழல் உணர்த்தும் பயணச் செயல் ‘சென்று’ என வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: τὰς πόλεις τοῦ Ἰσραήλ
  choice: இஸ்ரவேலின் நகரங்கள்
  rationale: மூலத்தின் உரிமை/தொடர்பு அமைப்பை இயல்பான தமிழில் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἕως ἂν ἔλθῃ
  choice: வரும்வரை
  rationale: எதிர்காலத்தில் நிகழும் ஒரு எல்லைப் புள்ளிவரை செயல் நிறைவடையாது என்ற காலத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: தமிழ் வேதாகம மரபில் அறியப்பட்ட பட்டப்பெயராக இருந்து, சொற்சார்ந்த வடிவத்தையும் தானியேல் நூல் சார்ந்த இறையியல் எதிரொலியையும் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘மனிதகுமாரன் வரும்வரை’ என்பதன் குறிப்பு
  choice: எந்த நிகழ்வைக் குறிக்கிறது என்று முதன்மை உரையில் வரையறுக்காமல் சொற்றொடரைத் திறந்தவாறே வைத்தல்
  alternative: உயிர்த்தெழுதல்/நியாயப்படுத்தப்படுதல், எருசலேமின்மீதான தீர்ப்பு, அல்லது இறுதி வருகை என்று குறிப்பாக்குதல்
  rationale: கிரேக்கச் சொற்றொடர் இவ்வசனத்தில் எந்த ஒரு விளக்கத்தையும் வெளிப்படையாகத் தீர்மானிப்பதில்லை; ஆகவே உண்மையான இறையியல் தெளிவின்மையும் பதற்றமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் வடிவமைக்கப்பட்டது. ‘தப்பிச் செல்லுங்கள்’ கட்டளையின் அவசரத்தைத் தருகிறது; ‘உண்மையாகவே’ உறுதியுரையின் கனத்தைப் பாதுகாக்கிறது. ‘மனிதகுமாரன்’ வாசகர்களுக்கு அறிமுகமான வேதாகமப் பட்டப்பெயராகத் தக்கவைக்கப்பட்டது.
