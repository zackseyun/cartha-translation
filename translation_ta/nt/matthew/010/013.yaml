id: MAT.10.13
reference: Matthew 10:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐὰν μὲν ᾖ ἡ οἰκία ἀξία, ἐλθάτω ἡ εἰρήνη ὑμῶν ἐπ’ αὐτήν· ἐὰν δὲ μὴ ᾖ ἀξία, ἡ εἰρήνη ὑμῶν ⸀πρὸς ὑμᾶς ἐπιστραφήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/013.yaml
  text: And if the house is worthy[a], let your peace come upon it; but if it is not worthy[c][b], let your peace return to you.
translation:
  language: ta
  text: அந்த வீடு தகுதியானதாக இருந்தால்[a], உங்கள் சமாதானம் அதன்மேல் வரட்டும்; அது தகுதியானதாக இல்லாவிட்டால்[b], உங்கள் சமாதானம் உங்களிடமே திரும்பி வரட்டும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வீடு’ என்பது இங்கே குடியிருப்பிடத்தையும், விரிவான பொருளில் அதில் வாழும் குடும்பத்தாரையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கே ‘தகுதியானது’ என்பது பாவமற்றது என்று பொருளல்ல; அனுப்பப்பட்டவர்களையும் அவர்கள் கொண்டுவரும் சமாதானத்தையும் ஏற்கத் தக்கது என்று பொருள்.
    reason: cultural_note
  - marker: c
    text: அல்லது, ‘உங்கள் சமாதானம் உங்களிடம் திரும்பட்டும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκία
  choice: வீடு
  rationale: கிரேக்கச் சொல்லின் நேரடியான பொருளைத் தருகிறது; சூழலில் அந்த வீட்டில் இருப்போரையும் குறிக்கக்கூடும்.
- source_word: ἀξία
  choice: தகுதியானதாக
  rationale: ஏற்றுக்கொள்ளத் தக்கது என்ற மதிப்பீட்டுப் பொருளைப் பாதுகாக்கிறது; இதை வெறும் மனப்பூர்வ வரவேற்பாக மட்டும் சுருக்கவில்லை.
- source_word: ἐλθάτω
  choice: வரட்டும்
  rationale: கிரேக்க இறைமொழியின் கட்டளை/அனுமதி வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἰρήνη
  choice: சமாதானம்
  rationale: εἰρήνη என்பதன் வழக்கமான வேதாகமத் தமிழ் இணைச்சொல்; நலமும் ஆசீர்வாதமும் உள்ளடங்கிய பரந்த பொருளைச் சூழல் உணர்த்த அனுமதிக்கிறது.
- source_word: ἐπ’ αὐτήν
  choice: அதன்மேல்
  rationale: சமாதானம் வீட்டின்மேல் வந்து தங்கும் திசைசார் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: πρὸς ὑμᾶς
  choice: உங்களிடமே
  rationale: திரும்புதல் சீடர்களை நோக்கியது என்பதைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது; ‘-மே’ மீள்வருகையின் வலியுறுத்தலை வழங்குகிறது.
- source_word: ἐπιστραφήτω
  choice: திரும்பி வரட்டும்
  rationale: மீண்டும் சீடர்களிடம் வருதல் என்ற கருத்தை இயல்பான தமிழில் தருகிறது; ‘திரும்பட்டும்’ என்பதைக் காட்டிலும் ஓட்டம் தெளிவாக உள்ளது.
- source_word: μὲν ... δὲ
  choice: இருந்தால் ... இல்லாவிட்டால்
  rationale: இரு நிபந்தனைகளுக்கிடையிலான கிரேக்க எதிர்மறை இணைப்பை இயல்பான தமிழ் அமைப்பில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘உங்கள் சமாதானம்’ என்பதன் இயல்பு
  choice: சீடர்களின் சமாதானம் வீட்டின்மேல் வந்து, ஏற்கப்படாவிட்டால் அவர்களிடமே திரும்புவதாகிய மூல உருவகம் அப்படியே வைக்கப்பட்டது.
  alternative: ‘நீங்கள் கூறும் சமாதான வாழ்த்து’ அல்லது ‘உங்கள் ஆசீர்வாதம்’ என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: மூலவசனம் இதை வெறும் வாழ்த்தாகவும் இயந்திரமுறையில் செயல்படும் சக்தியாகவும் வரையறுக்கவில்லை; ஆகவே அதன் செறிவும் இறையியல் பதற்றமும் பாதுகாக்கப்படுகின்றன.
- issue: ‘தகுதியானது’ என்பதன் பொருள்
  choice: முதன்மை உரையில் மதிப்பீட்டுச் சொல்லைத் தக்கவைத்து, சூழலுக்குரிய பொருளை அடிக்குறிப்பில் விளக்குதல்.
  alternative: ‘தூதர்களை ஏற்கத் தயாராக இருந்தால்’ என்று விளக்கி மொழிபெயர்த்தல்.
  rationale: ἀξία என்பதன் பரந்த மதிப்பீட்டுப் பொருளைச் சுருக்காமல், இது பாவமற்ற ஒழுக்கத் தகுதியைக் குறிக்கிறது என்ற தவறான புரிதலையும் அடிக்குறிப்பு தவிர்க்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பேணுகிறது. ‘சமாதானம்’ என்ற பரிச்சயமான இறையியல் சொல்லை வைத்துக்கொண்டு, வாக்கிய அமைப்பு சாதாரண வாசகர்களுக்கும் தெளிவாக இருக்குமாறு அமைக்கப்பட்டது.
