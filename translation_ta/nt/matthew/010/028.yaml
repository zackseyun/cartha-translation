id: MAT.10.28
reference: Matthew 10:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ μὴ ⸀φοβεῖσθε ἀπὸ τῶν ἀποκτεννόντων τὸ σῶμα τὴν δὲ ψυχὴν μὴ δυναμένων ἀποκτεῖναι· ⸁φοβεῖσθε δὲ μᾶλλον τὸν δυνάμενον ⸀καὶ ψυχὴν ⸁καὶ σῶμα ἀπολέσαι ἐν γεέννῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/028.yaml
  text: And do not fear those who kill the body but are not able to kill the soul. Rather[a], fear the one who is able to destroy both soul and body in Gehenna.
translation:
  language: ta
  text: உடலைக் கொல்கிறவர்களுக்கு அஞ்சாதீர்கள்; அவர்களால் ஆன்மாவைக் கொல்ல முடியாது. மாறாக, ஆன்மாவையும் உடலையும் கெஹென்னாவில்[a] அழிக்க வல்லவருக்கே அஞ்சுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நரகத்தில்.” “கெஹென்னா” என்பது இன்னோம் பள்ளத்தாக்கின் பெயரிலிருந்து வந்த கிரேக்கச் சொல்; இறுதித் தீர்ப்பின் இடத்தைக் குறிக்கப் பயன்படுத்தப்பட்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβεῖσθε
  choice: அஞ்சாதீர்கள் / அஞ்சுங்கள்
  rationale: இரு கட்டளைகளிலும் ஒரே வினைச்சொல்லைப் பயன்படுத்தி கிரேக்கத்தின் எதிர்மறை–நேர்மறை முரண்பாட்டைப் பாதுகாக்கிறது; நவீன தமிழிலும் இயல்பாகவும் வலிமையாகவும் உள்ளது.
- source_word: ἀπὸ τῶν ἀποκτεννόντων
  choice: உடலைக் கொல்கிறவர்களுக்கு
  rationale: பெயர்ச்சொல் செயல்பாட்டிலுள்ள நிகழ்காலப் பங்கேற்புச் சொல்லை ஒரு பொதுவகுப்பைக் குறிக்கும் இயல்பான தமிழாக வழங்குகிறது. φοβεῖσθε ἀπό என்ற அமைப்பின் பொருளைத் தமிழில் ‘அவர்களுக்கு அஞ்சுதல்’ என இயல்பாக்குகிறது.
- source_word: σῶμα
  choice: உடல்
  rationale: மனிதரின் சரீரத்தைக் குறிக்கும் நேரடியான, பொதுவாகப் புரியும் தமிழ் இணைச்சொல்.
- source_word: ψυχήν
  choice: ஆன்மா
  rationale: இவ்வசனத்தில் ‘உடல்’ என்பதுடன் வெளிப்படையாக முரண்படுத்தப்படுவதால், வெறும் ‘உயிர்’ என்பதைவிட உடலல்லாத மனித அம்சத்தைக் குறிக்கும் ‘ஆன்மா’ பொருத்தமானது.
- source_word: μὴ δυναμένων ἀποκτεῖναι
  choice: அவர்களால் ... கொல்ல முடியாது
  rationale: செய்ய இயலாமையைத் தெளிவாகவும் இயல்பான தமிழ் வாக்கிய அமைப்பிலும் வெளிப்படுத்துகிறது.
- source_word: μᾶλλον
  choice: மாறாக
  rationale: ‘இவர்களுக்கு அல்ல, அவருக்கே’ என்ற திருத்தும் எதிர்மறை ஒப்பீட்டை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τὸν δυνάμενον
  choice: வல்லவருக்கே
  rationale: கிரேக்கத்தின் பெயர்ச்சொல் செயல்பாட்டிலுள்ள பங்கேற்புச் சொல்லைச் சுருக்கமாக வழங்குகிறது; அந்த நபர் யார் என்று மொழிபெயர்ப்பிலேயே பெயரிட்டு தீர்மானிக்கவில்லை. ‘-க்கே’ எதிர்மறை வலியுறுத்தலைத் தருகிறது.
- source_word: ἀπολέσαι
  choice: அழிக்க
  rationale: தீர்ப்பின் கடுமையைக் காக்கும் நேரடியான இணைச்சொல்; அழிவின் துல்லியமான இயல்பை தேவையின்றி விளக்குவதில்லை.
- source_word: ἐν γεέννῃ
  choice: கெஹென்னாவில்
  rationale: யூதப் பின்னணி கொண்ட கிரேக்கச் சொல்லை ஒலிபெயர்த்து, பின்னாளைய மொழிபெயர்ப்பு மரபுகளின் கூடுதல் கருத்துகளை முதன்மை உரைக்குள் புகுத்தாமல் பாதுகாக்கிறது.
theological_decisions:
- issue: கெஹென்னாவில் ஆன்மாவையும் உடலையும் அழிக்க வல்லவரின் அடையாளம்
  choice: முதன்மை உரையில் ‘வல்லவர்’ என்று மட்டும் வழங்கப்பட்டுள்ளது.
  alternative: ‘கடவுள்’ அல்லது ‘சாத்தான்’ என்று வெளிப்படையாக அடையாளப்படுத்துதல்.
  rationale: சூழலில் இது இறுதித் தீர்ப்பின் அதிகாரமுள்ள கடவுளைக் குறிப்பதாக இயல்பாகப் புரிந்தாலும், கிரேக்க உரை அந்தப் பெயரை வெளிப்படையாகச் சொல்லவில்லை. ஆகவே உரையின் மறைமுகத் தன்மையும் இறையியல் அழுத்தமும் பாதுகாக்கப்படுகின்றன.
- issue: γέεννα என்பதன் மொழிபெயர்ப்பு
  choice: கெஹென்னா
  alternative: நரகம்
  rationale: மூலச் சொல்லின் வரலாற்று மற்றும் யூதப் பின்னணியை முதன்மை உரையில் பாதுகாக்கிறது; பரிச்சயமான விளக்க இணைச்சொல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடை. ‘அஞ்சு’, ‘ஆன்மா’, ‘அழி’ ஆகிய சொற்கள் வசனத்தின் எச்சரிக்கைத் தொனியையும் உடல்–ஆன்மா வேறுபாட்டையும் காக்கின்றன. ‘வல்லவருக்கே’ என்பது referent-ஐ பெயரிடாமல் கிரேக்கத்தின் திறந்த தன்மையைப் பாதுகாக்கிறது.
