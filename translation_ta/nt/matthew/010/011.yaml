  yaml_path: translation/nt/matthew/010/011.yaml
  text: Into whatever city or village you enter[a], find out who in it is worthy[b], and stay there until you leave.
translation:
  language: ta
  text: நீங்கள் எந்த நகரத்திற்கோ கிராமத்திற்கோ நுழைந்தாலும், அதில் தகுதியுள்ளவர் யார் என்று விசாரித்து அறிந்துகொள்ளுங்கள்[a]; அங்கேயே நீங்கள் புறப்படும் வரை தங்கியிருங்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “விசாரித்து அறிந்துகொள்ளுங்கள்” என்பது “கவனமாகக் கேட்டறியுங்கள்,” “ஆராய்ந்து கண்டறியுங்கள்” என்றும் மொழிபெயர்க்கப்படலாம். “தகுதியுள்ளவர்” என்பது இச்சூழலில் தூதர்களை ஏற்றுக்கொள்ள ஏற்றவர் என்பதைக் குறிக்கலாம்; கடவுளுடைய அருளைச் சம்பாதித்தவர் என்று அவசியம் பொருளல்ல.
    reason: lexical_alternative
  - marker: b
    text: 'வேறு மொழிபெயர்ப்பு: “நீங்கள் புறப்படும் வரை அங்கே தங்கியிருங்கள்.” “அங்கேயே” என்பது மூலத்தில் உள்ள இடச்சுட்டின் வலியுறுத்தலைத் தமிழில் வெளிப்படுத்துகிறது.'
    reason: translation_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην εἰσέλθητε
  choice: நீங்கள் எந்த நகரத்திற்கோ கிராமத்திற்கோ சென்றாலும்
  rationale: εἰς என்பதன் திசைநோக்கிய பொருளையும் ἄν உடன் வரும் வரையறையற்ற சார்புத்தொடரையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது. εἰσέρχομαι என்பதற்கு இச்சூழலில் ‘செல்லுதல்’ இயல்பாக இருந்தாலும், ஒரு குடியிருப்புக்குள் நுழையும் கருத்து தொடரில் தெளிவாக உள்ளது.
- source_word: ἐξετάσατε
  choice: விசாரித்து அறிந்துகொள்ளுங்கள்
  rationale: கவனமாகக் கேட்டறிதல் அல்லது ஆராய்ந்து கண்டறிதல் என்ற வினையின் வலிமையைத் தக்கவைக்கிறது; வெறும் ‘கண்டுபிடியுங்கள்’ என்பதைவிட திட்டமிட்ட விசாரணையைத் தெளிவாக்குகிறது.
- source_word: τίς ἐν αὐτῇ ἄξιός ἐστιν
  choice: அங்கே தகுதியுள்ளவர் யார்
  rationale: τίς ἐν αὐτῇ என்பதை இயல்பாக ‘அங்கே ... யார்’ என்றும், ἄξιος என்பதன் மதிப்பீட்டு நுணுக்கத்தை அளவுக்கு மீறி விளக்காமல் ‘தகுதியுள்ளவர்’ என்றும் தருகிறது.
- source_word: κἀκεῖ μείνατε
  choice: அவரிடமே தங்கியிருங்கள்
  rationale: ἐκεῖ இலக்கணப்படி ‘அங்கே’ என்றாலும், சூழலில் விசாரித்தறிந்த தகுதியுள்ள நபரின் இல்லத்தில் தங்குவதைக் குறிக்கிறது. தமிழில் ‘அவரிடமே’ என்பது இந்தக் குறிப்பு தொடர்பை இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது; -ஏ தொடர்ந்தும் அதே இடத்தில் தங்க வேண்டும் என்ற வலியுறுத்தலைக் காட்டுகிறது.
- source_word: ἕως ἂν ἐξέλθητε
  choice: நீங்கள் புறப்படும் வரை
  rationale: எதிர்காலப் புறப்பாட்டின் எல்லைவரை தங்க வேண்டும் என்ற காலப்பொருளை இயல்பான தமிழில் தருகிறது. ‘வெளியேறும் வரை’ என்பதைக் காட்டிலும் நகரம் அல்லது கிராமத்தை விட்டுப் புறப்படுதல் என்ற சூழலுக்கு ஏற்றது.
theological_decisions:
- issue: ἄξιος (‘தகுதியுள்ளவர்’) என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘தகுதியுள்ளவர்’ என்று மதிப்பீட்டு நுணுக்கத்தைத் தக்கவைத்து, அடிக்குறிப்பில் விருந்தேற்க ஏற்றவர் அல்லது மனமுள்ளவர் என்ற சூழல்சார் வாய்ப்பை விளக்குதல்
  alternative: ‘ஏற்றுக்கொள்ள மனமுள்ளவர்’ என்று முதன்மை உரையிலேயே பொருளைத் தீர்மானித்தல்; அல்லது பரந்த ஒழுக்கப் பொருளில் ‘பாத்திரமானவர்’ என மொழிபெயர்த்தல்
  rationale: இச்சூழல் தூதர்களை ஏற்றுத் தங்கவைக்க ஏற்ற ஒருவரைக் கண்டறிவதைச் சுட்டினாலும், ἄξιος என்ற சொல்லில் உள்ள மதிப்பீட்டு பரப்பை மூல உரை முற்றிலும் வரையறுக்கவில்லை. ஆகவே தெய்வ அருளைச் சம்பாதித்தவர் என்ற கருத்தைச் சேர்க்காமலும், உண்மையான தெளிவின்மையை நீக்காமலும் மொழிபெயர்க்கப்படுகிறது.
- issue: κἀκεῖ குறிக்கும் தங்குமிடம்
  choice: தமிழில் ‘அவரிடமே’ என்று குறிப்பிட்டு, கண்டறியப்பட்ட நபரிடம் தங்குவதை வெளிப்படுத்துதல்
  alternative: மூலத்தின் இடச்சுட்டை நேரடியாகப் பின்பற்றி ‘அங்கேயே’ என்று மொழிபெயர்த்தல்
  rationale: கிரேக்கச் சொல் முறையாக இடத்தைக் குறிக்கிறது; ஆனால் சூழலில் அந்த நபருடைய இடமே குறிக்கப்படுகிறது. ‘அவரிடமே’ என்பது புதிய இறையியல் கருத்தைச் சேர்க்காமல் தமிழில் இயல்பான குறிப்பு தொடர்பை உருவாக்குகிறது; மாற்றை அடிக்குறிப்பு பதிவு செய்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதைமிக்க பன்மை ஏவல்வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. நடை dignified ஆனாலும் பொதுவாசகர்களுக்கு எளிதாக உள்ளது. ‘தகுதியுள்ளவர்’ மூலத்தின் மதிப்பீட்டு நுணுக்கத்தையும் சூழலிலுள்ள தெளிவின்மையையும் தக்கவைக்கிறது; அடிக்குறிப்புகள் தேவையான சொற்பொருள் மற்றும் குறிப்பு மாற்றுகளை மட்டும் விளக்குகின்றன.
