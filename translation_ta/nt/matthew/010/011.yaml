  source_fidelity: The draft accurately conveys the indefinite instruction, careful inquiry, and temporal limit. However, “அவரிடமே” renders κἀκεῖ (“and there”) as a person-directed expression (“with/at that person”), whereas the Greek explicitly retains a locative reference. The context may imply the worthy person's lodging, but the wording should not replace the source's location reference.
  naturalness: The register and imperative plurals are natural modern standard Tamil. “நுழைந்தாலும்,” “விசாரித்து அறிந்துகொள்ளுங்கள்,” and “அங்கேயே ... தங்கியிருங்கள்” are clear and idiomatic.
  terminology: “தகுதியுள்ளவர்” appropriately preserves ἄξιος without imposing a salvation-related meaning. “நகரம் அல்லது கிராமம்” maintains the πόλις/κώμη distinction.
