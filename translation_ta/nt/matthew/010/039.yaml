    issue: Footnote marker interrupts the Tamil accusative suffix
    rationale: 'In ‘உயிரை[a]க்’, the marker separates the noun stem/case form from the final accusative consonant. Tamil orthography and readable footnote anchoring require the fully inflected form first: ‘உயிரைக்[a]’.'
  - severity: low
    issue: Generic participial expression can be smoother
    rationale: ‘கண்டடைபவன்’ is understandable, but ‘கண்டடைகிறவன்’ more naturally conveys the representative, proverbial sense of ὁ εὑρών in contemporary Tamil, while retaining the find/lose symmetry.
