id: MAT.10.39
reference: Matthew 10:39
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ εὑρὼν τὴν ψυχὴν αὐτοῦ ἀπολέσει αὐτήν, καὶ ὁ ἀπολέσας τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/039.yaml
  text: The one who finds his life will lose it[a], and the one who loses his life for my sake will find it.
translation:
  language: ta
  text: தன் உயிரைக்[a] கண்டடைகிறவன் அதை இழந்துவிடுவான்; என் பொருட்டுத் தன் உயிரை இழப்பவன் அதைக் கண்டடைவான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இரண்டு இடங்களிலும் ‘ஆன்மா’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்க ψυχή என்பதற்கு ‘உயிர்’ அல்லது ‘ஆன்மா’ என்று பொருள் வரலாம். இங்கு சீடத்துவத்தில் ஒருவர் தன் உயிரை இழப்பதும் கண்டடைவதும் பற்றிய சூழலுக்கு ‘உயிர்’ சிறப்பாகப் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εὑρὼν
  choice: கண்டடைபவன்
  rationale: பெயர்ச்சொல் தன்மையில் வரும் இறந்தகாலப் பங்கேற்புவினை பொதுவாக ஒருவரைக் குறிக்கிறது. ‘கண்டடைபவன்’ என்பது இந்தப் பொதுப்பொருளையும் ‘கண்டடைதல்—இழத்தல்’ என்ற சொல்லணியையும் காக்கிறது.
- source_word: ψυχὴν
  choice: உயிரை
  rationale: இச்சீடத்துவச் சூழலில் ψυχή என்பது உடலிலிருந்து வேறான ஓர் அருவ ஆன்மாவை முதன்மையாகக் குறிக்காமல், ஒருவர் பற்றிக்கொள்ளவோ ஒப்புக்கொடுக்கவோ கூடிய அவரது உயிரைக் குறிக்கிறது. இருப்பினும் அதன் விரிந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἀπολέσει / ὁ ἀπολέσας
  choice: இழந்துவிடுவான் / இழப்பவன்
  rationale: ἀπόλλυμι இங்கு அழித்தொழித்தலைவிட இழப்பைக் குறிக்கிறது. எதிர்கால முதன்மை வினைக்கு ‘இழந்துவிடுவான்’ என்றும், பழமொழித் தன்மையுள்ள பொதுக் கூற்றின் பங்கேற்புவினைக்கு ‘இழப்பவன்’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἕνεκεν ἐμοῦ
  choice: என் பொருட்டு
  rationale: இச்சொற்றொடர் காரணத்தையோ நோக்கத்தையோ குறிக்கிறது; ‘என் பொருட்டு’ என்பது இயேசுவின் நிமித்தம் உயிரை இழப்பதைக் குறிக்கும் இயல்பான, சுருக்கமான தமிழ் நடை.
- source_word: εὑρήσει
  choice: கண்டடைவான்
  rationale: முந்தைய εὑρὼν என்பதோடு உள்ள திட்டமிட்ட சொல் ஒற்றுமையையும் கூற்றின் முரண்நயத்தையும் இது காக்கிறது.
- source_word: αὐτοῦ / αὐτήν
  choice: தன் / அதை
  rationale: கிரேக்கத்தின் ஒருமை பொதுப்பிரதிநிதித் தன்மை தமிழில் ‘தன்’ மற்றும் ‘அதை’ மூலம் இயல்பாகத் தக்கவைக்கப்படுகிறது.
theological_decisions:
- issue: சீடத்துவ முரண்கூற்றில் ψυχή என்பதன் பொருள்
  choice: உயிர்
  alternative: ஆன்மா
  rationale: இவ்வசனம் இயேசுவுக்கான பற்றுறுதியால் ஒருவர் தன் உயிரைப் பாதுகாக்க முயல்வதையோ அதை இழப்பதையோ பற்றியது. ‘உயிர்’ என்பது இந்தச் சூழலுக்குச் சிறப்பாகப் பொருந்துகிறது; ψυχή என்பதன் விரிந்த பொருளைத் தீர்மானமாகக் குறுக்காமல் ‘ஆன்மா’ என்ற மாற்றும் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘கண்டடை—இழ’ என்ற மூலத்தின் முரண்நயமும் இரு கூறுகளின் சமச்சீரும் பாதுகாக்கப்பட்டுள்ளன; ‘காத்துக்கொள்’ போன்ற விளக்கவுரை மூலம் மறைமுகப் பொருள் முன்கூட்டியே தீர்மானிக்கப்படவில்லை.
