id: MAT.10.15
reference: Matthew 10:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ἀνεκτότερον ἔσται γῇ Σοδόμων καὶ Γομόρρων ἐν ἡμέρᾳ κρίσεως ἢ τῇ πόλει ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/015.yaml
  text: Truly I say to you[c][b][a], it will be more bearable for the land of Sodom and Gomorrah on the day of judgment than for that town.
translation:
  language: ta
  text: 'உறுதியாக உங்களுக்குச் சொல்கிறேன்: தீர்ப்பு நாளில் அந்த ஊரைவிடச் சோதோம் மற்றும் கொமோரா நிலப்பகுதியின் நிலை அதிகம் தாங்கத்தக்கதாக இருக்கும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν
  choice: உறுதியாக
  rationale: இயேசுவின் கூற்றை வலியுறுத்தும் உறுதிமொழித் தன்மையை, நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: λέγω ὑμῖν
  choice: உங்களுக்குச் சொல்கிறேன்
  rationale: கிரேக்கத்தின் நேரடிப் பேச்சு வடிவத்தை இயல்பான தமிழில் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: ἀνεκτότερον
  choice: அதிகம் தாங்கத்தக்கதாக
  rationale: ஒப்பீட்டு வடிவமான ‘மேலும் பொறுத்துக்கொள்ளக்கூடியதாக’ என்ற பொருளைத் தெளிவாகத் தருகிறது; தீர்ப்பின் அளவைப் பற்றிய உரையின் வலிமையையும் காக்கிறது.
- source_word: γῇ
  choice: நிலப்பகுதியின்
  rationale: இங்கு γῆ பூமி முழுவதையும் அல்ல, சோதோம் மற்றும் கொமோராவுடன் தொடர்புடைய நிலப்பரப்பைக் குறிக்கிறது. ‘நிலப்பகுதி’ என்பது நவீனத் தமிழில் அரசியல் ‘நாடு’ என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: Σοδόμων καὶ Γομόρρων
  choice: சோதோம், கொமோரா
  rationale: தமிழில் பரவலாக அறியப்பட்ட இடப்பெயர் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: தீர்ப்பு நாளில்
  rationale: வருங்காலத் தெய்வீகத் தீர்ப்பைக் குறிக்கும் சொற்றொடரை, அதற்கு அப்பாற்பட்ட கோட்பாட்டு விவரங்களைச் சேர்க்காமல் இயல்பாக வழங்குகிறது.
- source_word: πόλει ἐκείνῃ
  choice: அந்த ஊர்
  rationale: πόλις என்பதன் நகரம்/பட்டணம் என்ற பரப்பை ‘ஊர்’ இயல்பாக உள்ளடக்குகிறது; முன்பு குறிப்பிடப்பட்ட குறிப்பிட்ட இடத்தையே ‘அந்த’ சுட்டுகிறது.
theological_decisions:
- issue: ‘தீர்ப்பு நாள்’ என்பதன் தன்மை
  choice: வருங்காலத் தெய்வீகத் தீர்ப்பின் நாளாக மொழிபெயர்க்கப்பட்டது; மேலதிக காலவரிசையோ கோட்பாட்டு அமைப்போ குறிப்பிடப்படவில்லை.
  alternative: பொதுவான ஒரு தீர்ப்புக் காலம்
  rationale: ἐν ἡμέρᾳ κρίσεως இயல்பாக இறுதிக்காலத் தீர்ப்பை நோக்கினாலும், வசனம் கூறுவதைவிட அதிகமாக அதன் இயல்பை வரையறுக்காமல் இருப்பது மூலத்தின் இறையியல் அழுத்தத்தைக் காக்கிறது.
- issue: நிலப்பகுதிக்குத் தாங்கத்தக்க நிலை எனும் உருவகம்
  choice: சோதோம், கொமோரா நிலப்பகுதியின் ‘நிலை’ என்று வழங்கி, இடத்தைக் குடியிருப்போருக்கான ஆகுபெயராகப் பயன்படுத்தும் மூலத்தின் ஒப்பீட்டைத் தக்கவைத்தது.
  alternative: சோதோம், கொமோரா மக்களுக்கு என்று வெளிப்படையாக மாற்றுவது
  rationale: மக்களை வெளிப்படையாகச் சேர்ப்பது பொருளை விளக்கினாலும், γῇ என்ற மூலச் சொல்லின் புவியியல் உருவகத்தை அழித்துவிடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான நடை. ‘உறுதியாக உங்களுக்குச் சொல்கிறேன்’ என்ற வடிவம் உறுதிமொழியின் தீவிரத்தைத் தருகிறது. தமிழில் முழுமையான ஒப்பீட்டு வாக்கியமாக இயங்க ‘நிலை’ சேர்க்கப்பட்டுள்ளது; இது விளக்கச் சேர்க்கை மட்டுமே, தீர்ப்பின் தன்மையை விரிவுபடுத்துவதில்லை.
