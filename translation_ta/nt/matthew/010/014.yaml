id: MAT.10.14
reference: Matthew 10:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν μὴ δέξηται ὑμᾶς μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν, ἐξερχόμενοι ⸀ἔξω τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης ἐκτινάξατε τὸν κονιορτὸν τῶν ποδῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/014.yaml
  text: And whoever does not receive you or listen to your words[a], as you go out of that house or that town[c][b], shake off the dust from your feet.
translation:
  language: ta
  text: யாராவது உங்களை ஏற்றுக்கொள்ளாமலும் உங்கள் வார்த்தைகளைக் கேட்காமலும் இருந்தால்[a], அந்த வீட்டையோ அந்த ஊரையோ விட்டு நீங்கள் வெளியேறும்போது[c], உங்கள் கால்களில் உள்ள தூசியை உதறிவிடுங்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களை வரவேற்காமலும் உங்கள் வார்த்தைகளுக்குச் செவிகொடுக்காமலும் இருந்தால்.”
    reason: lexical_alternative
  - marker: b
    text: “கால்களில் உள்ள தூசியை உதறிவிடுவது” செய்தியை நிராகரித்தவர்களிடமிருந்து விலகுவதையும் அவர்கள்மீது வரும் தீர்ப்பையும் குறிக்கும் ஓர் அடையாளச் செயலாக இருந்தது.
    reason: cultural_note
  - marker: c
    text: அல்லது, “அந்த வீட்டையோ அந்த நகரத்தையோ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἂν μὴ
  choice: யாராவது ... இருந்தால்
  rationale: இக்கட்டமைப்பின் வரையறுக்கப்படாத பொதுவான நிபந்தனைப் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: δέξηται ὑμᾶς
  choice: உங்களை ஏற்றுக்கொள்ளாமலும்
  rationale: சீடர்களுக்கு விருந்தோம்பல் அளிப்பதையும் அவர்களையும் அவர்களுடைய பணியையும் ஏற்றுக்கொள்வதையும் உள்ளடக்கும் பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν
  choice: உங்கள் வார்த்தைகளைக் கேட்காமலும்
  rationale: ἀκούω என்பதன் அடிப்படை கேட்பது/கவனித்துக் கேட்பது என்ற பொருளைத் தருகிறது; ‘கீழ்ப்படியாமல்’ என்று பொருளை மிகையாகக் குறிப்பாக்கவில்லை.
- source_word: ἐξερχόμενοι ἔξω
  choice: விட்டு நீங்கள் வெளியேறும்போது
  rationale: இடத்திலிருந்து வெளியே செல்லும் உடன்நிகழ்வை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης
  choice: அந்த வீட்டையோ அந்த ஊரையோ
  rationale: ἐκείνης என்பதன் சுட்டுப்பொருளைப் பாதுகாக்கிறது; πόλις குறிக்கும் குடியிருப்பிடம் பெரிய நகரமாக மட்டுமே புரிந்துகொள்ளப்படாதபடி ‘ஊர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐκτινάξατε
  choice: உதறிவிடுங்கள்
  rationale: தூசியைத் திட்டவட்டமாக அகற்றும் கட்டளையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὸν κονιορτὸν τῶν ποδῶν ὑμῶν
  choice: உங்கள் கால்களில் உள்ள தூசியை
  rationale: கால்களிலிருந்து அகற்றப்படும் தூசி என்ற உறவை இயல்பான தமிழில் தெளிவாக்குகிறது; ‘அழுக்கு’ என்ற பொதுப்பொருளைத் தவிர்க்கிறது.
theological_decisions:
- issue: சீடர்களின் செய்தியை நிராகரிப்போருக்கு எதிரான அடையாளச் செயல்
  choice: ‘உங்கள் கால்களில் உள்ள தூசியை உதறிவிடுங்கள்’ என்ற உருவகமற்ற நேரடிக் கட்டளையை முதன்மை உரையில் வைத்திருத்தல்
  alternative: ‘அவர்களுக்கு எதிரான சாட்சியாக’ என்று இணைவசனங்களிலிருந்து விளக்கச் சொற்களைச் சேர்த்தல் அல்லது ‘அவர்களைத் தீர்ப்புக்குள்ளாக விட்டுவிடுங்கள்’ என்று பொருள்விளக்கமாக மொழிபெயர்த்தல்
  rationale: இந்த வசனம் செயலைக் கட்டளையிடுகிறது; அதன் பொருளை நேரடியாக விளக்கவில்லை. எனவே இணைவசனச் சொற்களையோ ஒரு குறிப்பிட்ட இறையியல் முடிவையோ முதன்மை உரைக்குள் சேர்க்காமல், பண்பாட்டு விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஊர்’ என்பது πόλις என்பதன் அளவை மிகையாகக் குறிப்பாக்காமல் உள்ளூரைக் குறிக்கிறது; ‘நகரம்’ அடிக்குறிப்பில் மாற்றாக வழங்கப்பட்டுள்ளது. மூலத்தின் நிபந்தனைத் தன்மையும் இரண்டு மறுப்புகளும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
