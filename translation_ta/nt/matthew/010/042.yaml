id: MAT.10.42
reference: Matthew 10:42
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν ποτίσῃ ἕνα τῶν μικρῶν τούτων ποτήριον ψυχροῦ μόνον εἰς ὄνομα μαθητοῦ, ἀμὴν λέγω ὑμῖν, οὐ μὴ ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/042.yaml
  text: And whoever gives one of these little ones even a cup of cold water in the name of a disciple[a], truly I say to you[b], he will certainly not lose his reward.
translation:
  language: ta
  text: இந்தச் சிறியவர்களில்[a] ஒருவருக்கு, அவர் சீடர் என்பதற்காக, ஒரு குவளை குளிர்ந்த தண்ணீரைக்கூட குடிக்கக் கொடுப்பவர் எவராயினும்—உறுதியாக உங்களுக்குச் சொல்கிறேன்—தமது வெகுமதியை நிச்சயமாக இழக்கமாட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சிறியவர்கள்” என்பது இங்கு குழந்தைகளை மட்டும் அல்லாமல், இயேசுவைப் பின்பற்றுகிறவர்களில் தாழ்ந்தவர்களாக அல்லது முக்கியமற்றவர்களாகக் கருதப்படுபவர்களையும் குறிக்கலாம்.
    reason: cross_reference
lexical_decisions:
- source_word: ὃς ἂν
  choice: எவரும்
  rationale: ἄν உடன் வரும் தொடர்புப்பெயர் பொதுவான, வரையறுக்கப்படாத பொருளைத் தருகிறது; ‘எவரும்’ அதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ποτίσῃ
  choice: குடிக்கக் கொடுக்கிற
  rationale: வினைச்சொல்லின் நேரடிப் பொருள் ‘குடிக்கக் கொடுத்தல்’; தமிழிலும் இது இயல்பாக இருந்து செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἕνα τῶν μικρῶν τούτων
  choice: இந்தச் சிறியவர்களில் ஒருவருக்கு
  rationale: μικρῶν என்பதை குழந்தைகள் என்று மட்டும் குறுக்காமல், தாழ்ந்தவர்களாக அல்லது முக்கியமற்றவர்களாகக் கருதப்படக்கூடிய சீடர்களையும் உள்ளடக்கும் திறந்த சொல்லாட்சியாகப் பாதுகாக்கிறது.
- source_word: ποτήριον ψυχροῦ
  choice: ஒரு குவளை குளிர்ந்த தண்ணீர்
  rationale: ψυχροῦ உடன் ‘தண்ணீர்’ உள்ளுறைவாக உள்ளது; இந்தத் தமிழ் சொற்றொடர் சாதாரணமான சிறிய உதவியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μόνον
  choice: மட்டுமே
  rationale: கொடுக்கப்படும் உதவியின் மிகச் சிறிய அளவை நேரடியாகப் பாதுகாக்கிறது.
- source_word: εἰς ὄνομα μαθητοῦ
  choice: அவர் சீடர் என்பதற்காக
  rationale: பெறுபவரின் சீடர் என்ற அடையாளமே செய்கைக்கான காரணம் அல்லது அடிப்படை என்பதைக் காலத்திற்கேற்ற தெளிவான தமிழில் தருகிறது.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: உறுதியாக உங்களுக்குச் சொல்கிறேன்
  rationale: இயேசுவின் ஆணித்தரமான அறிவிப்பின் வலிமையை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὐ μὴ ἀπολέσῃ
  choice: நிச்சயமாக இழக்கமாட்டார்
  rationale: οὐ μή என்ற வலியுறுத்தப்பட்ட மறுப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: τὸν μισθὸν αὐτοῦ
  choice: தமது வெகுமதியை
  rationale: μισθός இங்கு கூலி என்ற குறுகிய பொருளைவிட கைம்மாறு அல்லது வெகுமதி என்ற பொருளை உடையது; பாலினம் குறிக்காத மரியாதைமிக்க ‘தமது’ பொதுவான நபரைக் குறிக்கிறது.
theological_decisions:
- issue: ‘சிறியவர்கள்’ என்பதன் குறிப்பு
  choice: ‘இந்தச் சிறியவர்கள்’ என்று திறந்த நிலையில் வைக்கப்பட்டது; சூழலில் தாழ்ந்தவர்களாகக் கருதப்படும் இயேசுவின் சீடர்களை இது குறிக்கலாம்.
  alternative: குழந்தைகள் மட்டும்; புதிய அல்லது பலவீனமான விசுவாசிகள் மட்டும்
  rationale: உடனடி சூழல் சீடர்களை ஏற்றுக்கொள்வதைப் பற்றியது; மூலத்தின் பரந்த சொல்லாட்சியை ஒரு குறிப்பிட்ட குழுவாகக் குறுக்கவில்லை.
- issue: εἰς ὄνομα μαθητοῦ என்பதன் பொருள்
  choice: ‘அவர் சீடர் என்பதற்காக’
  alternative: ‘சீடர் என்ற பெயரில்’; ‘ஒரு சீடராக’
  rationale: செயல் பெறுபவரின் சீடர் அடையாளத்தின் காரணமாகச் செய்யப்படுகிறது என்பதைத் தெளிவாக்குகிறது; மூலத்தில் அவசியமில்லாத சடங்கு அல்லது வாய்பாட்டு உணர்வைச் சேர்க்கவில்லை.
- issue: வெகுமதியின் தன்மை
  choice: ‘தமது வெகுமதி’ என்று மட்டும் மொழிபெயர்க்கப்பட்டு, அதன் காலம் அல்லது வடிவம் விளக்கப்படவில்லை.
  alternative: இவ்வுலகப் பலன்; இறுதி நியாயத்தீர்ப்பில் கிடைக்கும் பலன்
  rationale: வசனம் வெகுமதியின் தன்மையை இங்கே வரையறுக்காததால், அந்த இறையியல் திறந்தநிலை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குத் தெளிவானதும் கண்ணியமானதும். ‘சிறியவர்கள்’ என்ற மூல உருவகமும், வலியுறுத்தப்பட்ட மறுப்பும் பாதுகாக்கப்பட்டுள்ளன. அடிக்குறி குறியீடு வசனத்தின் இறுதியில் வைக்கப்பட்டுள்ளது.
