translation:
  language: ta
  text: மேலும், ஒரு மனிதனுடைய பகைவர்கள் அவனுடைய வீட்டாரே[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒருவருடைய பகைவர்கள் அவருடைய வீட்டாரே.” கிரேக்கத்தில் ஆண்பால் ஒருமையான “மனிதன்” என்ற சொல் பொதுப்படையாகப் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: (தனி வசனத்தில் வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை)
  rationale: καὶ முந்தைய கூற்றுடன் இவ்வாக்கியத்தை இணைக்கிறது. தமிழ் மேற்கோள் நடையில் வசனம் தனியாக நிற்கும்போது தொடக்கத்தில் ‘மேலும்’ அல்லது ‘அப்பொழுது’ சேர்ப்பது இயல்பற்றதாகவும் கூடுதல் நுண்பொருளைத் தருவதாகவும் இருக்கும்; ஆகவே அதன் தொடர்ச்சிப் பணி நிறுத்தக்குறியால் மறைமுகமாகப் பேணப்படுகிறது.
- source_word: ἐχθροὶ
  choice: பகைவர்கள்
  rationale: பகைமை கொண்டவர்களைக் குறிக்கும் பெயர்ச்சொல் பயன்பாட்டை இயல்பாகவும் அதன் வலிமை குறையாமலும் தருகிறது.
- source_word: τοῦ ἀνθρώπου
  choice: ஒரு மனிதனுடைய
  rationale: மரபணுப் பொருளை உடைமைத் தொடர்பாக இயல்பான தமிழில் தருகிறது. ஆண்பால் ஒருமை வடிவம் பொதுப்படையாகப் பயன்படுத்தப்பட்டுள்ள மூலத்தின் வடிவமும் பேணப்படுகிறது.
- source_word: οἱ οἰκιακοὶ αὐτοῦ
  choice: அவனுடைய வீட்டாரே
  rationale: οἰκιακοί என்பது கட்டடமான வீட்டை அல்ல, அந்த வீட்டைச் சேர்ந்த உறுப்பினர்களைக் குறிக்கிறது. ‘வீட்டார்’ அந்த உறவுப் பொருளை இயல்பாகத் தருகிறது; ‘-ஏ’ வாக்கியத்தின் அடையாளப்படுத்தும் அழுத்தத்தை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἀνθρώπου என்பதில் உள்ள ஆண்பால் பொதுப்படை மொழி
  choice: ஒரு மனிதனுடைய … அவனுடைய
  alternative: ஒருவருடைய … அவருடைய
  rationale: கிரேக்கத்தில் ஆண்பால் ஒருமை பொதுப்படையாக வருகிறது. முதன்மை உரை அந்த வடிவத்தைப் பேணுகிறது; அது ஆண்களுக்கு மட்டுமே பொருந்தும் என்று கட்டுப்படுத்தாமல் இருக்க, பொதுப்படை மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான பழமொழித் தன்மை பேணப்பட்டுள்ளது. ‘வீட்டார்’ என்பது குடும்பத்தாரையும் ஒரே வீட்டைச் சேர்ந்தவர்களையும் உள்ளடக்கக்கூடியதால், οἰκιακοί என்பதன் பரப்பை ‘குடும்பத்தினர்’ என்று தேவையின்றி சுருக்கவில்லை.
