id: MAT.10.8
reference: Matthew 10:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀσθενοῦντας θεραπεύετε, ⸂νεκροὺς ἐγείρετε⸃, λεπροὺς καθαρίζετε, δαιμόνια ἐκβάλλετε· δωρεὰν ἐλάβετε, δωρεὰν δότε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/008.yaml
  text: Heal the sick[a], raise the dead, cleanse lepers, cast out demons. Freely you received; freely give.
translation:
  language: ta
  text: நோயுற்றவர்களைக் குணமாக்குங்கள்; இறந்தவர்களை உயிர்ப்பியுங்கள்; தொழுநோயாளிகளைத் தூய்மையாக்குங்கள்[a]; தீய ஆவிகளை வெளியேற்றுங்கள். இலவசமாகப் பெற்றீர்கள்; இலவசமாகக் கொடுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தொழுநோயாளிகள்’ என்று பாரம்பரியமாக மொழிபெயர்க்கப்படும் சொல், நவீன தொழுநோயை (ஹான்சன் நோய்) மட்டும் அல்லாமல், வேதாகமப் பயன்பாட்டில் கடுமையான பலவகைத் தோல் நோய்களையும் குறிக்கக்கூடும்.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσθενοῦντας
  choice: நோயுற்றவர்களை
  rationale: இக்குணமாக்கும் பணியின் சூழலில் நோயுற்றவர்களைக் குறிக்கிறது; ‘பலவீனமானவர்கள்’ என்பது இங்கு அளவுக்கு மீறிய பொதுமைப்படுத்தல்.
- source_word: θεραπεύετε
  choice: குணமாக்குங்கள்
  rationale: அற்புத குணமாக்குதலைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வினைச்சொல்.
- source_word: νεκροὺς ἐγείρετε
  choice: இறந்தவர்களை உயிரோடு எழுப்புங்கள்
  rationale: ἐγείρω இங்கு தூக்கத்திலிருந்து எழுப்புவதை அல்ல, மரணத்திலிருந்து உயிரோடு எழுப்புவதைக் குறிக்கிறது; ‘உயிரோடு’ என்பது தமிழில் பொருளைத் தெளிவாக்குகிறது.
- source_word: λεπροὺς
  choice: தொழுநோயாளிகளை
  rationale: பாரம்பரியமாகவும் பரவலாகவும் புரிந்துகொள்ளப்படும் சொல்; வேதாகமப் பயன்பாடு நவீன ஹான்சன் நோயைவிட விரிவாக இருக்கலாம் என்பதைக் காலடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: καθαρίζετε
  choice: தூய்மையாக்குங்கள்
  rationale: உடல்நல மீட்புடன் சடங்குசார் தூய்மை என்ற பொருளையும் காக்கிறது; ‘குணமாக்குங்கள்’ என்று மட்டும் மொழிபெயர்ப்பதைவிட மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- source_word: δαιμόνια ἐκβάλλετε
  choice: பேய்களை விரட்டுங்கள்
  rationale: தீய ஆவிகளை வலுக்கட்டாயமாக வெளியேற்றும் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: δωρεὰν
  choice: இலவசமாக
  rationale: பணம் அல்லது கட்டணம் இன்றி என்பதே இங்கு முதன்மைப் பொருள்; இரு வாக்கியப் பகுதிகளிலும் மீளுருவைத் தக்கவைக்கிறது.
- source_word: ἐλάβετε
  choice: பெற்றீர்கள்
  rationale: சீடர்கள் ஏற்கெனவே பெற்றதைக் குறிக்கும் இறந்தகால வடிவம்.
- source_word: δότε
  choice: கொடுங்கள்
  rationale: நேரடியான பன்மை ஏவலைத் தக்கவைக்கிறது; கொடுக்கும் முறை ‘இலவசமாக’ என்ற வினையடையால் தெரிவிக்கப்படுகிறது.
theological_decisions:
- issue: அற்புதச் செயல்களுக்கான கட்டளைகளின் வரம்பு
  choice: இந்த அனுப்புதல் உரையில் பன்னிருவருக்குக் கொடுக்கப்பட்ட நேரடியான கட்டளைகளாக மொழிபெயர்க்கப்பட்டது.
  alternative: இவற்றில் சிலவற்றை உருவகங்களாகவோ பிற்காலத் திருச்சபை நடைமுறைகளாக மட்டும் விளக்கவோ செய்வது.
  rationale: கிரேக்கம் தெளிவான பன்மை ஏவல் வடிவங்களில் செயல்களின் பட்டியலைக் கொடுக்கிறது. அவற்றின் பிற்காலப் பயன்பாட்டை மொழிபெயர்ப்பே தீர்மானிக்காமல், உரையின் வரலாற்று மற்றும் இறையியல் அழுத்தம் காக்கப்படுகிறது.
- issue: καθαρίζω என்பதிலுள்ள குணமாக்குதல் மற்றும் தூய்மைப்படுத்துதல்
  choice: ‘தூய்மையாக்குங்கள்’ என்று மொழிபெயர்த்து உடல் மற்றும் சடங்குசார் நுணுக்கம் இரண்டையும் தக்கவைத்தல்.
  alternative: ‘குணமாக்குங்கள்’ என்று மருத்துவ மீட்சியை மட்டும் முன்னிறுத்துதல்.
  rationale: λεπρός குறித்த வேதாகமச் சூழலில் καθαρίζω தூய்மை நிலைக்குத் திரும்புதலையும் சுட்டுகிறது; அந்த இறையியல்-சமூக நுணுக்கத்தை ஒழிக்கக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையில் நேரடி பன்மை ஏவல்கள் பயன்படுத்தப்பட்டுள்ளன. கிரேக்கத்தின் தொடர்ச்சியான கட்டளைகளும் இறுதிப் பகுதியின் ‘இலவசமாக… இலவசமாக…’ என்ற இணை அமைப்பும் காக்கப்பட்டுள்ளன.
