source:
  edition: SBLGNT
  text: προσέχετε δὲ ἀπὸ τῶν ἀνθρώπων· παραδώσουσιν γὰρ ὑμᾶς εἰς συνέδρια, καὶ ἐν ταῖς συναγωγαῖς αὐτῶν μαστιγώσουσιν ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/017.yaml
  text: But beware of people[a], for they will hand you over to councils, and in their synagogues they will flog you.
translation:
  language: ta
  text: ஆனால், மனிதர்களைக் குறித்து எச்சரிக்கையாக இருங்கள்[a]. ஏனெனில், அவர்கள் உங்களை மன்றங்களுக்கு ஒப்படைப்பார்கள்; அவர்களுடைய ஜெப ஆலயங்களில் உங்களைச் சாட்டையால் அடிப்பார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மக்களைக் குறித்து.” கிரேக்கச் சொல் இலக்கணத்தில் ஆண்பால் பன்மையாக இருந்தாலும், இங்கு மனிதர்களைப் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέχετε
  choice: எச்சரிக்கையாக இருங்கள்
  rationale: பன்மை கட்டளை வடிவிலுள்ள இந்த வினைச்சொல், வரவிருக்கும் ஆபத்தைக் குறித்து விழிப்புடன் இருக்கும்படி எச்சரிக்கிறது. இத்தமிழ் நடை அதன் எச்சரிக்கை வலிமையை இயல்பாகக் கொண்டுவருகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய அறிவுறுத்தலிலிருந்து எச்சரிக்கைக்குத் திரும்பும் மென்மையான முரண்பாட்டை இது குறிக்கிறது.
- source_word: ἀπὸ τῶν ἀνθρώπων
  choice: மனிதர்களிடம்
  rationale: προσέχω என்பதுடன் ἀπό ஆபத்து வரும் தரப்பைக் குறிக்கிறது. ἄνθρωποι இங்கு ஆண்களை மட்டும் அல்லாமல், எதிர்ப்பவர்களான மனிதர்களைப் பொதுவாகக் குறிக்கிறது.
- source_word: παραδώσουσιν
  choice: ஒப்படைப்பார்கள்
  rationale: அதிகாரம் செலுத்தும் அமைப்புகளின் கையில் ஒருவரை ஒப்படைப்பது என்ற சட்டம் சார்ந்த பொருளைத் தெளிவாகக் காட்டுகிறது; உறவுத் துரோகத்தை தேவையின்றி முன்வைப்பதில்லை.
- source_word: συνέδρια
  choice: மன்றங்கள்
  rationale: பன்மை வடிவம் உள்ளூர் ஆட்சி அல்லது நீதித்துறை மன்றங்களைக் குறிக்கக்கூடும்; எருசலேமின் குறிப்பிட்ட சனெத்ரினை மட்டும் குறிக்கிறது என்று வரையறுக்காமல் நிறுவனப் பொருளைப் பாதுகாக்கிறது.
- source_word: συναγωγαῖς
  choice: ஜெபக்கூடங்கள்
  rationale: யூதர்களின் வழிபாடு மற்றும் சமூகக் கூடுகைக்குரிய இடங்களைத் தமிழில் வழக்கமாகவும் தெளிவாகவும் குறிக்கும் சொல்.
- source_word: αὐτῶν
  choice: தங்களுடைய
  rationale: ஒப்படைப்பவர்களோடு தொடர்புடைய ஜெபக்கூடங்கள் என்பதைக் காட்டுகிறது; தமிழில் எழுவாயோடு இயல்பாகப் பொருந்தும் தற்சுட்டுப் பெயரடை பயன்படுத்தப்பட்டுள்ளது.
- source_word: μαστιγώσουσιν
  choice: சாட்டையால் அடிப்பார்கள்
  rationale: சாட்டையால் வழங்கப்படும் உடல் தண்டனையை நவீன வாசகருக்குத் தெளிவாகவும் தீவிரத்தைத் தளர்த்தாமலும் தெரிவிக்கிறது.
theological_decisions:
- issue: ἀνθρώπων என்பதன் பாலினப் பொருள்
  choice: மனிதர்கள்
  alternative: ஆண்கள்
  rationale: கிரேக்கச் சொல் இலக்கணத்தில் ஆண்பால் பன்மையாக இருந்தாலும், இங்கு துன்புறுத்தும் மனிதர்களைப் பொதுவாகக் குறிக்கிறது. ‘ஆண்கள்’ என்பது மூலத்தில் இல்லாத பாலின வரம்பை ஏற்படுத்தும்.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மன்றங்கள்’ என்பது குறிப்பிட்ட ஒரே உயர்மன்றத்தைச் சுட்டாமல் மூலத்தின் பன்மையையும் நிறுவனத் தெளிவின்மையையும் பாதுகாக்கிறது.
