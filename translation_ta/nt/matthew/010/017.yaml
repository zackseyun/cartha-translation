- from: ஆனால், மனிதர்களிடம் எச்சரிக்கையாக இருங்கள்[a]. ஏனெனில், அவர்கள் உங்களை மன்றங்களிடம் ஒப்படைப்பார்கள்; தங்களுடைய ஜெபக்கூடங்களில் உங்களைச் சாட்டையால் அடிப்பார்கள்.
