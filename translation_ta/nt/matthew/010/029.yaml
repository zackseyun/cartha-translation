source:
  edition: SBLGNT
  text: οὐχὶ δύο στρουθία ἀσσαρίου πωλεῖται; καὶ ἓν ἐξ αὐτῶν οὐ πεσεῖται ἐπὶ τὴν γῆν ἄνευ τοῦ πατρὸς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/029.yaml
  text: Are not two sparrows sold for an assarion? Yet not one of them will fall to the ground apart from your Father[a][b].
translation:
  language: ta
  text: இரண்டு சிட்டுக்குருவிகள் ஓர் அசாரியோனுக்கு விற்கப்படுகின்றன அல்லவா? ஆனாலும், அவற்றில் ஒன்றுகூட உங்கள் தந்தையின்றித் தரையில் விழாது.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உங்கள் தந்தையைத் தவிர்த்து’ என்றும் மொழிபெயர்க்கலாம். இத்தொடர் அவரது அறிவு, அக்கறை, அல்லது சித்தத்துக்கு அப்பாற்பட்டு இது நிகழ்வதில்லை என்பதைக் குறிக்கலாம்; ஆனால் இவற்றில் எதைக் குறிப்பாகக் குறிக்கிறது என்று கிரேக்கம் சொல்லவில்லை.
    reason: alternative_reading
  - marker: b
    text: அசாரியோன் என்பது மிகக் குறைந்த மதிப்புடைய ஒரு சிறிய ரோம செப்பு நாணயம்.
    reason: cultural_note
lexical_decisions:
- source_word: στρουθία
  choice: சிட்டுக்குருவிகள்
  rationale: இச்சூழலில் இச்சொல் பொதுவாகச் சிட்டுக்குருவிகளைக் குறிக்கிறது; ‘சிறு பறவைகள்’ என்பதைக் காட்டிலும் இது இயல்பானதும் குறிப்பானதும் ஆகும்.
- source_word: ἀσσαρίου
  choice: ஓர் அசாரியோனுக்கு
  rationale: இது மிகக் குறைந்த மதிப்புடைய ஒரு குறிப்பிட்ட ரோம செப்பு நாணயம். வரலாற்றுத் தனித்தன்மையைப் பாதுகாக்க அதன் பெயர் ஒலிபெயர்க்கப்பட்டு, விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: πωλεῖται
  choice: விற்கப்படுகின்றன
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவத்தையும் வணிகப் பொருளையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἓν ἐξ αὐτῶν
  choice: அவற்றில் ஒன்றுகூட
  rationale: பகுதிப்பொருளைக் காட்டும் கிரேக்கத் தொடரை இயல்பான தமிழில் தருவதோடு, சூழலில் உள்ள ‘ஒன்றுகூட இல்லை’ என்ற வலியுறுத்தலையும் வெளிப்படுத்துகிறது.
- source_word: πεσεῖται ἐπὶ τὴν γῆν
  choice: நிலத்தில் விழாது
  rationale: எதிர்கால நிகழ்வை இயல்பான தமிழில் தெரிவிக்கிறது; எதிர்மறைக் கேள்வியைத் தொடர்ந்து வரும் கிரேக்க எதிர்மறையின் பொருளும் பாதுகாக்கப்படுகிறது.
- source_word: ἄνευ τοῦ πατρὸς ὑμῶν
  choice: உங்கள் தந்தைக்கு அப்பாற்பட்டு
  rationale: தந்தையின் அறிவு, அக்கறை, அனுமதி அல்லது சித்தம் என்று ஒன்றை மட்டும் குறிப்பாக்காமல், மூலத்தின் திட்டமிட்ட தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: οὐχὶ ... ;
  choice: '... அல்லவா?'
  rationale: உறுதிப்படுத்தும் பதிலை எதிர்பார்க்கும் கிரேக்க வினாவின் சொல்லாட்சியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: καὶ
  choice: ஆனாலும்
  rationale: பறவைகளின் மிகக் குறைந்த விலைக்கும் அவற்றின்மீது தந்தைக்கு உள்ள தொடர்பிற்கும் இடையிலான கருத்து மாறுபாட்டை இச்சூழலில் தெளிவாக்குகிறது.
theological_decisions:
- issue: ‘உங்கள் தந்தைக்கு அப்பாற்பட்டு’ என்பது இறை பராமரிப்புடன் கொண்டுள்ள தொடர்பு
  choice: தந்தையின் தொடர்பு எந்த வகையானது என்பதை வரையறுக்காமல், ‘உங்கள் தந்தைக்கு அப்பாற்பட்டு’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘உங்கள் தந்தையின் அறிவில்லாமல்’ அல்லது ‘உங்கள் தந்தையின் சித்தமில்லாமல்’
  rationale: வசனம் தந்தையின் பராமரிப்புத் தொடர்பை உறுதிப்படுத்துகிறது; ஆனால் அது அறிவா, அக்கறையா, அனுமதியா, சித்தமா என்பதை கிரேக்கம் வெளிப்படையாகக் குறிப்பிடவில்லை. ஆகவே ஒரு குறிப்பிட்ட இறையியல் விளக்கம் முதன்மை உரையில் புகுத்தப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘தந்தை’ என்பது சூழலின் இறையியல் உறவுமுறையைப் பாதுகாக்கிறது. வரலாற்று நாணயப் பெயர் ஒலிபெயர்க்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது; மூலத்தின் இறையியல் தெளிவின்மை திட்டமிட்டு நிலைநிறுத்தப்பட்டுள்ளது.
