  yaml_path: translation/nt/matthew/010/012.yaml
  text: As you enter the house[a], greet it.
translation:
  language: ta
  text: நீங்கள் அந்த வீட்டிற்குள் நுழையும்போது, அந்த வீட்டுக்கு வாழ்த்துச் சொல்லுங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, ‘வீட்டாருக்கு வாழ்த்துச் சொல்லுங்கள்.’ கிரேக்கத்தில் ‘வீடு’ என்பதைக் குறிக்கும் ஒருமைச் சுட்டுப்பெயர் உள்ளது: ‘அதை வாழ்த்துங்கள்.’ இது அங்கு வாழ்பவர்களைக் குறிக்கும் ஆகுபெயராக இருக்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσερχόμενοι
  choice: நீங்கள் ... நுழையும்போது
  rationale: நிகழ்காலப் பன்மை வினையெச்சம் கட்டளையுடன் காலத் தொடர்பில் நிற்கிறது; இயல்பான நவீனத் தமிழில் ‘நுழையும்போது’ அந்தத் தொடர்பைத் தெளிவாகத் தருகிறது.
- source_word: δὲ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது மென்மையான இணைப்புச்சொல்; இங்கு தமிழின் வாக்கிய அமைப்பே தொடர்பை இயல்பாக வெளிப்படுத்துவதால் ‘ஆனால்’ போன்ற வலுவான எதிர்மறை இணைப்பு சேர்க்கப்படவில்லை.
- source_word: οἰκίαν
  choice: அந்த வீட்டிற்குள்
  rationale: οἰκία என்பது வீடு அல்லது வீட்டார் எனப் பொருள்படலாம். ‘நுழைதல்’ என்ற உடனடிச் சூழலில் கட்டடமாகிய ‘வீடு’ முதன்மையான பொருத்தம்; சுட்டுத் தீர்மானிப்பைத் தமிழில் இயல்பாகக் காட்ட ‘அந்த’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἀσπάσασθε
  choice: வாழ்த்துச் சொல்லுங்கள்
  rationale: இறந்தகாலத் தோற்றமுடைய நடுநிலைப் பன்மைக் கட்டளை. ‘வாழ்த்துச் சொல்லுங்கள்’ என்பது மரியாதைமிக்க, தற்போதைய தமிழில் இயல்பான நேரடிக் கட்டளை.
- source_word: αὐτήν
  choice: அதற்கு
  rationale: பெண்பால் ஒருமைச் சுட்டுப்பெயர் οἰκίαν என்பதுடன் இலக்கண ஒத்திசைவில் உள்ளது. தமிழில் வீட்டை நோக்கிய உருவகக் குறிப்பை ‘அதற்கு’ நேரடியாகப் பாதுகாக்கிறது; வீட்டாரைக் குறிக்கும் சாத்தியம் அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: வீட்டையே உருவகமாக வாழ்த்துதல் அல்லது வீட்டாரை வெளிப்படையாகக் குறிப்பிடுதல்
  choice: முதன்மை உரையில் ‘அதற்கு வாழ்த்துச் சொல்லுங்கள்’ என்று உருவகக் குறிப்பைப் பாதுகாத்தல்
  alternative: ‘வீட்டாருக்கு வாழ்த்துச் சொல்லுங்கள்’ அல்லது ‘அதில் இருப்பவர்களுக்கு வாழ்த்துச் சொல்லுங்கள்’
  rationale: கிரேக்க உரையில் αὐτήν என்பது οἰκίαν என்ற ஒருமைச் சொல்லையே நேரடியாகச் சுட்டுகிறது. அதன் சமூக நோக்கம் வீட்டாராக இருக்க வாய்ப்பிருந்தாலும், அந்த விளக்கத்தை முதன்மை உரைக்குள் கட்டாயமாக்காமல் அடிக்குறிப்பில் தருவது மூலத்தின் உண்மையான கூறுமுறையையும் பொருள் நுட்பத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, மரியாதைமிக்க கட்டளை நடை பயன்படுத்தப்பட்டுள்ளது. ‘அதற்கு’ என்பது தமிழில் சற்றே குறிப்பான உருவகப் பயன்பாடாக இருந்தாலும், கிரேக்கத்தின் வீட்டை நோக்கிய ஒருமைக் குறிப்பைத் திட்டமிட்டு பாதுகாக்கிறது; அடிக்குறிப்பு வாசகருக்கு இயல்பான மாற்றுப் பொருளைத் தருகிறது.
