  text: μὴ κτήσησθε χρυσὸν μηδὲ ἄργυρον μηδὲ χαλκὸν εἰς τὰς ζώνας ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/009.yaml
  text: Do not acquire gold or silver or copper for your belts[b][a],
translation:
  language: ta
  text: உங்கள் இடுப்புப் பட்டைகளில் வைப்பதற்காகத் தங்கமோ வெள்ளியோ செம்போ பெற்றுக்கொள்ளாதீர்கள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘செம்பு’ என்பதற்குப் பதிலாக ‘வெண்கலம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, இடுப்புப் பட்டையில் அல்லது இடுப்பில் அணிந்த பணப்பையில் வைத்துச் செல்லும் பணம்.
    reason: cultural_note
lexical_decisions:
- source_word: μὴ κτήσησθε
  choice: சம்பாதித்துக்கொள்ளாதீர்கள்
  rationale: κτάομαι என்பது இங்கு வெறுமனே எடுத்துச் செல்வதை அல்ல, தங்களுக்காகப் பெற்றுக்கொள்வதை அல்லது திரட்டிக்கொள்வதைக் குறிக்கிறது. ‘சம்பாதித்துக்கொள்ளாதீர்கள்’ அந்தச் செயற்பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: χρυσὸν μηδὲ ἄργυρον
  choice: தங்கமோ வெள்ளியோ
  rationale: இவை பொருட்களின் பெயர்களாக இருந்தாலும், இச்சூழலில் பணமாகப் பயன்படும் தங்கத்தையும் வெள்ளியையும் குறிக்கின்றன; மூலத்தின் சுருக்கமான பட்டியல் வடிவம் பாதுகாக்கப்படுகிறது.
- source_word: μηδὲ χαλκὸν
  choice: செம்புக் காசுகளோ
  rationale: χαλκός செம்பு அல்லது வெண்கலத்தைக் குறிக்கலாம். தங்கம், வெள்ளி ஆகியவற்றுடன் வரும் பணப் பட்டியலில் குறைந்த மதிப்புள்ள காசுகள் என்பது தெளிவாக இருக்க ‘செம்புக் காசுகள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: εἰς τὰς ζώνας ὑμῶν
  choice: உங்கள் இடுப்புப் பட்டைகளில் வைப்பதற்காக
  rationale: ζώνη இடுப்புப் பட்டையைக் குறிக்கிறது; அக்காலத்தில் அதில் பணத்தை வைத்துச் சென்றனர். εἰς என்பதன் இலக்கு/இடுதல் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையான பன்மைக் கட்டளை வடிவம் பயன்படுத்தப்பட்டுள்ளது. பணத்தைப் பட்டையில் வைத்துச் சென்ற பண்பாட்டுப் பின்னணி முதன்மை உரையில் அளவோடு வெளிப்படுத்தப்பட்டு, கூடுதல் விளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
