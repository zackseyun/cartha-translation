source:
  edition: SBLGNT
  text: ὃ λέγω ὑμῖν ἐν τῇ σκοτίᾳ, εἴπατε ἐν τῷ φωτί· καὶ ὃ εἰς τὸ οὖς ἀκούετε, κηρύξατε ἐπὶ τῶν δωμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/027.yaml
  text: What I tell you in the darkness[a], say in the light; and what you hear in the ear[b], proclaim on the housetops.
translation:
  language: ta
  text: நான் உங்களிடம் இருளில் சொல்வதை வெளிச்சத்தில் சொல்லுங்கள்; காதில் கேட்பதை வீடுகளின் மொட்டைமாடிகளில் பிரகடனப்படுத்துங்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃ λέγω ὑμῖν
  choice: நான் உங்களிடம் ... சொல்வதை
  rationale: உறவுப்பெயரின் பொருள் இயல்பான தமிழில் வினைப்பெயர் அமைப்பால் தரப்படுகிறது; λέγω என்பதன் நேரடியான அறிவுறுத்தல் பொருளும் காக்கப்படுகிறது.
- source_word: ἐν τῇ σκοτίᾳ
  choice: இருளில்
  rationale: ‘வெளிச்சத்தில்’ என்பதுடனான உருவக எதிர்மறையை விளக்கவுரையாக மாற்றாமல் அப்படியே காக்கிறது.
- source_word: εἴπατε ἐν τῷ φωτί
  choice: வெளிச்சத்தில் சொல்லுங்கள்
  rationale: கிரேக்க கட்டளைத் தொனியையும் இருள்–வெளிச்சம் படிமத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: εἰς τὸ οὖς ἀκούετε
  choice: உங்கள் காதில் நீங்கள் கேட்பதை
  rationale: கிரேக்கத்தின் ஒருமைக் காது படிமத்தைத் தக்கவைக்கிறது; தமிழில் தொடர்பைத் தெளிவாக்க ‘உங்கள்’ சேர்க்கப்படுகிறது.
- source_word: κηρύξατε
  choice: அறிவியுங்கள்
  rationale: பொதுவெளியில் பிரகடனப்படுத்தும் பொருளைத் தருகிறது; ‘பிரசங்கியுங்கள்’ எனச் சுருக்கி சமயச் சொற்பொழிவாக மட்டும் காட்டுவதைத் தவிர்க்கிறது.
- source_word: ἐπὶ τῶν δωμάτων
  choice: வீடுகளின் மொட்டைமாடிகளிலிருந்து
  rationale: பண்டைய தட்டையான வீட்டுக் கூரைகளைக் குறிக்கும் கலாசாரப் படிமத்தை நவீனத் தமிழருக்குத் தெளிவாகக் காட்டுகிறது; அறிவிப்பு அங்கிருந்து செய்யப்படுவதால் ‘-இலிருந்து’ இயல்பான இலக்கு மொழி வடிவம்.
theological_decisions:
- issue: இருள்/வெளிச்சம் மற்றும் காது/மொட்டைமாடி மொழியைப் படிமமாக வைப்பதா, இரகசியம்/பொதுவெளி என்று விளக்கிப் பெயர்ப்பதா
  choice: படிமங்களை முதன்மை உரையில் காக்குதல்
  alternative: ‘இரகசியமாக ... வெளிப்படையாக ... தனிப்பட்ட முறையில் கேட்டதை ... எல்லாருக்கும் அறிவியுங்கள்’
  rationale: இயேசுவின் கூற்றிலுள்ள தீவிரமான எதிரிணைப் படிமத்தையும் அதன் திறந்த பொருள் வளத்தையும் காக்கிறது; உட்கருத்தை மட்டும் கொடுத்து சொல்லாட்சியைத் தட்டையாக்குவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயினும் கண்ணியமான கட்டளைத் தொனி. ‘இருளில் ... வெளிச்சத்தில்’ என்ற மூலப் படிமம் காக்கப்பட்டுள்ளது. ‘வீடுகளின் மொட்டைமாடிகள்’ என்பது ‘கூரைகள்’ என்பதைக் காட்டிலும் பண்டைய தட்டையான δώματα-வைத் தெளிவாக உணர்த்துகிறது.
