id: MAT.10.37
reference: Matthew 10:37
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ φιλῶν πατέρα ἢ μητέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος· καὶ ὁ φιλῶν υἱὸν ἢ θυγατέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/037.yaml
  text: The one who loves father or mother more than me is not worthy of me[a], and the one who loves son or daughter more than me is not worthy of me.
translation:
  language: ta
  text: தந்தையையோ தாயையையோ என்னைவிட அதிகமாக நேசிக்கிறவர் எனக்குத் தகுதியானவர் அல்ல[a]; மகனையோ மகளையையோ என்னைவிட அதிகமாக நேசிக்கிறவரும் எனக்குத் தகுதியானவர் அல்ல.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எனக்கு மேலாக.’ கிரேக்கச் சொற்றொடர், இயேசுவைக் காட்டிலும் வேறொருவரை முன்னிலைப்படுத்தி நேசிப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: நேசிக்கிறவர்
  rationale: பெயர்ச்சொல் தன்மையில் வரும் நிகழ்காலப் பங்கேற்புவினை, இச்செயலால் அடையாளப்படுத்தப்படும் எவரையும் பொதுவாகக் குறிக்கிறது. ‘நேசிக்கிறவர்’ என்பது இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: πατέρα ἢ μητέρα
  choice: தந்தையையோ தாயையையோ
  rationale: கிரேக்கத்தில் உடைமைப்பெயர் வெளிப்படையாக இல்லாததால் ‘தன்’ என்பதைச் சேர்க்காமல் உறவுப்பெயர்கள் நேரடியாக மொழிபெயர்க்கப்பட்டன.
- source_word: ὑπὲρ ἐμέ
  choice: என்னைவிட அதிகமாக
  rationale: இவ்வொப்பீட்டுச் சூழலில் ὑπέρ, இயேசுவைக் காட்டிலும் ஒருவருக்கு அதிக அன்பு அல்லது முன்னுரிமை கொடுப்பதைக் குறிக்கிறது. இத்தமிழ் வடிவம் அந்த ஒப்பீட்டைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: οὐκ ἔστιν μου ἄξιος
  choice: எனக்குத் தகுதியானவர் அல்ல
  rationale: ἄξιος உடன் வரும் μου என்பதன் உறவை இயல்பான தமிழில் நேரடியாகப் பாதுகாக்கிறது; ‘என்னைச் சேர்ந்தவர்’ போன்ற விளக்க விரிவாக்கத்தைத் தவிர்க்கிறது.
- source_word: καὶ
  choice: …வரும்
  rationale: இரு இணையான கூற்றுகளையும் தமிழில் இயல்பாக இணைக்க ‘-உம்’ இணைப்புவிகுதி பயன்படுத்தப்பட்டது; இது கிரேக்க καὶ என்பதன் ஒருங்கிணைப்புச் செயல்பாட்டைப் பாதுகாக்கிறது.
- source_word: υἱὸν ἢ θυγατέρα
  choice: மகனையோ மகளையையோ
  rationale: மூலத்தில் இல்லாத உடைமைப்பெயரைச் சேர்க்காமல் உறவுப்பெயர்கள் நேரடியாகவும் இயல்பாகவும் தரப்பட்டன.
theological_decisions:
- issue: குடும்ப அன்புடன் தொடர்புடைய இயேசுவின் கோரிக்கை தவறாகப் புரிந்துகொள்ளப்படும் சாத்தியம்
  choice: மிக நெருங்கிய குடும்ப உறவுகளையும் விட இயேசுவுக்கே மேலான அன்பும் பற்றுறுதியும் கொடுக்கப்பட வேண்டும் என்ற ஒப்பீட்டுக் கோரிக்கை பாதுகாக்கப்பட்டது.
  alternative: ‘என்னைப் போதுமான அளவு நேசிக்காதவர்’ என்று மென்மையாக்குதல் அல்லது குடும்பத்தாரை வெறுக்க வேண்டும் என்று விளக்கமாக விரிவாக்குதல்.
  rationale: ὑπὲρ ἐμέ என்பது ஒப்பீட்டு முன்னுரிமையைக் குறிக்கிறது; வசனம் குடும்ப அன்பைத் தானாக மறுப்பதில்லை. அதேவேளை, ‘எனக்குத் தகுதியானவர் அல்ல’ என்ற கடுமையான தீர்ப்பை மென்மையாக்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்கள் எளிதில் புரிந்துகொள்ளக்கூடிய அதேவேளை கண்ணியமான நடை பயன்படுத்தப்பட்டது. இணையான இரு வாக்கிய அமைப்புகளும் பாதுகாக்கப்பட்டன; இரண்டாவது கூற்றில் ‘-உம்’ மூலம் καὶ இயல்பாக வெளிப்படுத்தப்பட்டது.
