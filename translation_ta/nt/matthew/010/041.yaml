id: MAT.10.41
reference: Matthew 10:41
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δεχόμενος προφήτην εἰς ὄνομα προφήτου μισθὸν προφήτου λήμψεται, καὶ ὁ δεχόμενος δίκαιον εἰς ὄνομα δικαίου μισθὸν δικαίου λήμψεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/041.yaml
  text: The one who receives a prophet in the name of a prophet will receive a prophet’s reward[b][a], and the one who receives a righteous man in the name of a righteous man will receive a righteous man’s reward.
translation:
  language: ta
  text: தீர்க்கதரிசியைத் தீர்க்கதரிசியின் பெயரில் ஏற்றுக்கொள்கிறவர்[a], தீர்க்கதரிசியின் வெகுமதியைப் பெறுவார்; நீதிமானை நீதிமானின் பெயரில் ஏற்றுக்கொள்கிறவர்[b], நீதிமானின் வெகுமதியைப் பெறுவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் ஒரு தீர்க்கதரிசி என்பதால்” அல்லது “அவரைத் தீர்க்கதரிசியாகக் கருதி.” கிரேக்கத்தில் சொல்லுக்குச் சொல், “தீர்க்கதரிசியின் பெயரில்” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர் ஒரு நீதிமான் என்பதால்” அல்லது “அவரை நீதிமானாகக் கருதி.” கிரேக்கத்தில் சொல்லுக்குச் சொல், “நீதிமானின் பெயரில்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δεχόμενος
  choice: ஏற்றுக்கொள்கிறவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புவினையின் பொதுவான, தொடர்ந்த பண்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது. சூழலில் ஒருவரை வரவேற்று ஏற்றுக்கொள்வது என்ற பொருளையும் தக்கவைக்கிறது.
- source_word: προφήτην
  choice: தீர்க்கதரிசியை
  rationale: அங்கீகரிக்கப்பட்ட பணியையும் அடையாளத்தையும் கூடுதல் விளக்கமின்றி நேரடியாகக் குறிக்கும் நிலையான தமிழ் வேதாகமச் சொல்.
- source_word: εἰς ὄνομα προφήτου
  choice: தீர்க்கதரிசியின் பெயரில்
  rationale: கிரேக்கத் தொடரின் வடிவத்தையும் அதன் இறையியல் ஒலிநயத்தையும் தக்கவைக்கிறது; அந்த நபரைத் தீர்க்கதரிசி என்பதன் அடிப்படையில் ஏற்றுக்கொள்வது என்ற வழக்குப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: μισθὸν προφήτου
  choice: தீர்க்கதரிசியின் கைம்மாறு
  rationale: தீர்க்கதரிசிக்குக் கிடைக்கும் கைம்மாறா அல்லது தீர்க்கதரிசியை ஏற்றுக்கொள்பவருக்குரிய கைம்மாறா என்ற தொடர்பின் இயல்பான தெளிவின்மையை மிகையாகத் தீர்மானிக்காமல் கிரேக்க மரபுத்தொடரைத் தக்கவைக்கிறது.
- source_word: λήμψεται
  choice: பெறுவார்
  rationale: எதிர்கால வினையின் பொருளைச் சுருக்கமாகவும் dignified modern Tamil-இலும் வெளிப்படுத்துகிறது.
- source_word: δίκαιον
  choice: நீதிமானை
  rationale: ஆண்பால் ஒருமையில் பெயர்ச்சொல்லாகப் பயன்படும் பெயரடையைத் துல்லியமாகவும் தமிழில் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: εἰς ὄνομα δικαίου
  choice: நீதிமானின் பெயரில்
  rationale: முதல் உட்பிரிவின் இணை அமைப்பையும் கிரேக்க வழக்குத்தொடரையும் தக்கவைக்கிறது; பொருள் விளக்கம் அடிக்குறிப்பில் வழங்கப்படுகிறது.
- source_word: μισθὸν δικαίου
  choice: நீதிமானின் கைம்மாறு
  rationale: முதல் உட்பிரிவுடனான இணைநிலையைப் பாதுகாத்து, உரிமை அல்லது தொடர்பைக் குறிக்கும் பிறப்புவேற்றுமையின் தெளிவின்மையைத் தீர்க்காமல் விடுகிறது.
theological_decisions:
- issue: εἰς ὄνομα + பிறப்புவேற்றுமை என்ற வழக்குத்தொடரின் பொருள்
  choice: முதன்மை உரையில் “பெயரில்” என்ற வடிவத்தைத் தக்கவைத்து, “அவர் ... என்பதால்” அல்லது “... என்று கருதி” என்ற பொருள்களை அடிக்குறிப்புகளில் வழங்குதல்.
  alternative: முதன்மை உரையிலேயே “அவர் ஒரு தீர்க்கதரிசி/நீதிமான் என்பதால்” அல்லது “அவரைத் தீர்க்கதரிசி/நீதிமான் என்று கருதி” எனத் தெளிவுபடுத்துதல்.
  rationale: இந்தத் தொடர் ஒருவரை அவரது அங்கீகரிக்கப்பட்ட அடையாளம் அல்லது பணிநிலையின் அடிப்படையில் ஏற்றுக்கொள்வதைக் குறிக்கலாம். அதேவேளை, “பெயரில்” என்ற மீள்வடிவத்தையும் அதன் இறையியல் ஒலிநயத்தையும் அழிக்காமல் உண்மையான பொருள் வாய்ப்புகளை அடிக்குறிப்புகளில் பாதுகாக்கிறது.
- issue: δίκαιον / δικαίου என்பவற்றின் ஆண்பால் வடிவம்
  choice: “நீதிமான்” என்ற ஆண்பால் ஒருமை வடிவத்தைப் பயன்படுத்துதல்.
  alternative: “நீதியுள்ள ஒருவர்” என்ற பாலினப் பொதுமைப்படுத்தப்பட்ட வடிவம்.
  rationale: கிரேக்கத்தில் இச்சொல் ஆண்பால் ஒருமையில் பெயர்ச்சொல்லாகச் செயல்படுகிறது. “நீதிமான்” என்பது அதன் வடிவத்தையும் பொருளையும் இயல்பான தமிழில் தக்கவைக்கிறது; இதனால் கூற்றின் பொதுவான பயன்பாட்டைத் தேவையின்றி மறுப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. மூலத்தின் இரு இணை உட்பிரிவுகளும் திட்டமிட்ட மீளுரையும் பாதுகாக்கப்பட்டுள்ளன. “கைம்மாறு” என்பது μισθός என்பதன் பலன்/பரிசு சார்ந்த பொருளைச் சுமக்கிறது; இங்கு ஊதியம் என்ற குறுகிய தொழில்சார் பொருளைத் தவிர்க்கிறது.
