source:
  edition: SBLGNT
  text: Μὴ νομίσητε ὅτι ἦλθον βαλεῖν εἰρήνην ἐπὶ τὴν γῆν· οὐκ ἦλθον βαλεῖν εἰρήνην ἀλλὰ μάχαιραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/034.yaml
  text: Do not think that I came to bring peace on the earth[a]; I did not come to bring peace[b], but a sword.
translation:
  language: ta
  text: “நான் பூமியில் சமாதானத்தைக் கொண்டுவர வந்தேன் என்று நினைக்காதீர்கள்; சமாதானத்தைக் கொண்டுவர நான் வரவில்லை; வாளைக் கொண்டுவரவே வந்தேன்.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்குள்ள “வாள்” என்பது வன்முறையை ஆதரிப்பதாக அல்ல; தொடர்ந்து வரும் சூழலில் இது பிரிவைச் சித்தரிக்கும் உருவகமாகப் புரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: நினைக்காதீர்கள்
  rationale: μή உடன் வரும் aorist subjunctive இங்கு தடையைத் தெரிவிக்கிறது. ‘நினைக்காதீர்கள்’ என்பது நேரடியானதும் இயல்பானதும் ஆகும்.
- source_word: ἦλθον
  choice: வந்தேன்
  rationale: இறந்தகால aorist வடிவம் இங்கு இயேசுவின் வருகையின் நோக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் ‘வந்தேன்’ இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: βαλεῖν
  choice: கொண்டுவர
  rationale: βάλλω என்பதன் அடிப்படைப் பொருள் ‘எறிதல்’ என்றாலும், சமாதானம் மற்றும் வாள் ஆகியவற்றுடன் வரும் இவ்விடத்து ‘கொண்டுவர’ என்பதே நோக்கப்பட்ட விளைவைத் தெளிவாகத் தருகிறது.
- source_word: εἰρήνην
  choice: சமாதானம்
  rationale: εἰρήνη என்பதற்கான வழக்கமான, கண்ணியமான தமிழ் இணைச்சொல்; வேதாகமப் பயன்பாட்டிலும் பொதுவாகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: ἐπὶ τὴν γῆν
  choice: பூமியில்
  rationale: γῆ இங்கு பரந்த பொருளில் ‘பூமி’யைக் குறிக்கிறது. ‘பூமியில்’ என்பது நவீன தமிழில் இயல்பாக இருந்து, தொடரின் பொருளைத் தெளிவாகக் கொண்டுவருகிறது.
- source_word: ἀλλὰ
  choice: அல்ல, ...வே
  rationale: வலுவான எதிர்மறை முரணைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘அல்ல’ என்பதோடு இறுதியில் ‘வே’ வலியுறுத்தல் பயன்படுத்தப்பட்டுள்ளது.
- source_word: μάχαιραν
  choice: வாள்
  rationale: μάχαιρα வாள் அல்லது குறுவாளைக் குறிக்கலாம். மூலத்தின் தெளிவான உருவகத்தை விளக்கவுரையாக மாற்றாமல் ‘வாள்’ என்று தக்கவைத்துள்ளது.
theological_decisions:
- issue: இயேசுவின் கூற்றிலுள்ள ‘வாள்’ உருவகத்தை முதன்மை உரையில் ‘பிரிவு’ என்று மென்மைப்படுத்தலாமா?
  choice: ‘வாள்’ என்ற உறுதியான உருவகத்தை முதன்மை உரையில் தக்கவைத்தல்
  alternative: பிரிவு
  rationale: கிரேக்க மூலத்தில் வெளிப்படையாக μάχαιραν (‘வாள்’) உள்ளது. அடுத்துவரும் சூழல் அதன் பிரிவுண்டாக்கும் விளைவை விளக்கினாலும், மொழிபெயர்ப்பு உருவகத்தை விளக்கவுரையாக மாற்றாமல் அதன் இறையியல் பதற்றத்தைப் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் மீள்வரிசையும் ‘சமாதானம்—வாள்’ என்ற கூர்மையான முரணும் பாதுகாக்கப்பட்டுள்ளன.
