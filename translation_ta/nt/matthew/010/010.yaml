id: MAT.10.10
reference: Matthew 10:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μὴ πήραν εἰς ὁδὸν μηδὲ δύο χιτῶνας μηδὲ ὑποδήματα μηδὲ ⸀ῥάβδον· ἄξιος γὰρ ὁ ἐργάτης τῆς τροφῆς ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/010.yaml
  text: do not take a traveler's bag for the road[a], or two tunics, or sandals, or a staff; for the worker is worthy of his food.
translation:
  language: ta
  text: பயணத்திற்குப் பையையோ, இரண்டு அங்கிகளையோ, செருப்புகளையோ, கோலையோ[a] எடுத்துச் செல்லாதீர்கள்; ஏனெனில் வேலை செய்பவர் தனக்குரிய உணவைப் பெறத் தகுதியுள்ளவர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மாற்கு 6:8-இல் கோலை எடுத்துச் செல்ல அனுமதிக்கப்படுவதைக் கருத்தில் கொண்டு, இங்குள்ள ‘கோலையோ’ என்பது கூடுதலான கோலைக் குறிக்கிறது என்று சிலர் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: πήραν
  choice: பயணப்பை
  rationale: பயணத்தின்போது, குறிப்பாகத் தேவையான பொருள்களையோ உணவையோ எடுத்துச் செல்லப் பயன்படும் பையைச் சுட்டுகிறது. ‘பயணப்பை’ என்பது பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: εἰς ὁδὸν
  choice: வழிப்பயணத்திற்காக
  rationale: பயணத்தில் எடுத்துச் செல்வதற்காக என்ற நோக்கத்தை இந்தச் சொற்றொடர் குறிக்கிறது. தமிழில் அதன் பயணச் சூழலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δύο χιτῶνας
  choice: இரண்டு அங்கிகள்
  rationale: χιτών என்பது உடலில் அணியும் அடிப்படை ஆடையைக் குறிக்கிறது. ‘அங்கி’ வரலாற்றுச் சூழலுக்கு ஏற்றதாகவும், பொதுவான ‘ஆடை’ என்பதைவிடத் துல்லியமாகவும் உள்ளது.
- source_word: ὑποδήματα
  choice: செருப்புகள்
  rationale: காலில் கட்டி அணியும் பாதணிகளைச் சுட்டுகிறது. முதலாம் நூற்றாண்டுச் சூழலில் ‘செருப்புகள்’ இயல்பான, எளிதில் புரியும் தமிழ்ச் சொல்.
- source_word: ῥάβδον
  choice: கோல்
  rationale: இங்கு பயணத்தின்போது பயன்படுத்தப்படும் கோலைக் குறிக்கிறது. மாற்கு 6:8-இல் கோலை எடுத்துச் செல்ல அனுமதிப்பதுபோல் தோன்றினாலும், மத்தேயுவின் சொற்றொடர் நேரடியாகத் தக்கவைக்கப்பட்டுள்ளது.
- source_word: ἄξιος
  choice: தகுதியுள்ளவர்
  rationale: ஒருவர் ஒன்றைப் பெறுவதற்கு உரியவர் அல்லது தகுதியானவர் என்ற மதிப்பீட்டுப் பொருளைத் தக்கவைக்கிறது.
- source_word: ὁ ἐργάτης
  choice: வேலை செய்பவர்
  rationale: வேலை அல்லது உழைப்பு செய்கிற ஒருவரைக் குறிக்கிறது. தனிப்பட்ட திருச்சபைத் தொழில்நுட்பப் பொருளைச் சேர்க்காமல், நவீனத் தமிழில் தெளிவாக உள்ளது.
- source_word: τῆς τροφῆς αὐτοῦ
  choice: தமக்குரிய உணவைப் பெற
  rationale: τροφή என்பதன் நேரடியான பொருள் உணவு அல்லது ஊட்டம். αὐτοῦ என்பதையும் ‘தமக்குரிய’ என்று வெளிப்படுத்தி, ‘ஆதரவு’ போன்ற விரிவான விளக்கத்தைச் சேர்க்காமல் உறுதியான பொருளைத் தக்கவைக்கிறது.
theological_decisions:
- issue: பயண உபகரணங்களைக் குறித்து இணை நற்செய்தி விவரங்களுடன் ஒத்திசைக்க வேண்டுமா என்பது
  choice: மத்தேயுவின் உரையில் உள்ள ‘கோலையோ எடுத்துச் செல்லாதீர்கள்’ என்ற தடையை முதன்மை உரையில் தக்கவைத்தல்
  alternative: மாற்கு 6:8-ஐக் கருத்தில் கொண்டு, கூடுதலான கோலை மட்டுமே தடைசெய்வதாகப் புரிந்துகொள்ளுதல்
  rationale: கிரேக்க உரை ῥάβδον என்பதைத் தடைசெய்யப்பட்ட பொருள்களின் பட்டியலில் வெளிப்படையாக வைக்கிறது. ஆகவே இணை விவரங்களுக்கிடையிலான இறுக்கத்தை மொழிபெயர்ப்பில் மறைக்காமல், மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வரலாற்றுச் சூழலை உணர்த்த ‘அங்கி’ என்றும், எளிதில் புரிய ‘செருப்புகள்’ என்றும் தேர்ந்தெடுக்கப்பட்டுள்ளது. அடிக்குறி அது விளக்கும் ‘கோல்’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
