  text: πορεύεσθε δὲ μᾶλλον πρὸς τὰ πρόβατα τὰ ἀπολωλότα οἴκου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/006.yaml
  text: but go instead to the lost sheep of the house of Israel[a].
translation:
  language: ta
  text: மாறாக, இஸ்ரவேல் வீட்டாராகிய காணாமற்போன ஆடுகளிடமே செல்லுங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேல் வீட்டாரிலிருந்து காணாமற்போன ஆடுகளிடமே செல்லுங்கள்.”
    reason: οἴκου Ἰσραήλ என்ற genitive-இன் தொடர்பை, ‘இஸ்ரவேல் வீட்டாராகிய காணாமற்போன ஆடுகள்’ என்பதற்குப் பதிலாக ‘இஸ்ரவேல் வீட்டாரிலிருந்து காணாமற்போன ஆடுகள்’ என்றும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: πορεύεσθε
  choice: செல்லுங்கள்
  rationale: இது பன்மை ஏவல் வடிவம். சீடர்களுக்குக் கொடுக்கப்படும் கட்டளையை இயல்பான, மரியாதையான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: δὲ μᾶλλον
  choice: மாறாக
  rationale: முந்தைய வசனத்தில் தடைசெய்யப்பட்ட இடங்களுக்குப் பதிலாக வேறொரு இலக்கை நோக்கித் திருப்பும் எதிர்மறைத் தொடர்பைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: πρὸς
  choice: இடமே
  rationale: இயக்க வினையுடன் இலக்கைச் சுட்டுகிறது; ‘-இடமே’ என்பது செல்ல வேண்டியவர்களை வலியுறுத்தி, முந்தைய இலக்குகளுக்கு மாறான திசையைத் தெளிவாக்குகிறது.
- source_word: τὰ πρόβατα
  choice: ஆடுகள்
  rationale: மூலத்தின் மேய்ப்பர் உருவகத்தைத் தக்கவைக்கிறது; ‘மந்தை’ என்று பொதுமைப்படுத்தாமல் பன்மை உருவகத்தைப் பாதுகாக்கிறது.
- source_word: τὰ ἀπολωλότα
  choice: காணாமற்போன
  rationale: ἀπόλλυμι என்பதன் நிறைநிலைப் பங்கேற்பு வடிவம் இங்கு வழிதவறி இழக்கப்பட்ட ஆடுகளின் உருவகத்தில் வருகிறது. ‘காணாமற்போன’ என்பது அழிவைத் தீர்மானமாகச் சேர்க்காமல் ‘lost’ என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: οἴκου Ἰσραήλ
  choice: இஸ்ரவேல் வீட்டார்
  rationale: ‘வீடு’ என்ற வேதாகமக் கூட்டு அடையாளத்தைத் தமிழில் புரியக்கூடிய ‘வீட்டார்’ மூலம் வெளிப்படுத்தி, இஸ்ரவேல் மக்களின் உடன்படிக்கைச் சார்ந்த சமூகப் பொருளையும் தக்கவைக்கிறது.
theological_decisions:
- issue: இஸ்ரவேலைக் குறிக்கும் மேய்ப்பர் உருவகம்
  choice: ‘இஸ்ரவேல் வீட்டாரில் காணாமற்போன ஆடுகள்’ என்ற உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘வழிதவறிய இஸ்ரவேல் மக்கள்’ என்று விளக்கிப் பெயர்த்தல்
  rationale: கிரேக்க மூலத்தில் ஆடுகள் என்ற உருவகம் வெளிப்படையாக உள்ளது; அது எபிரெய வேதாகமத்தின் மேய்ப்பர் மற்றும் வழிதவறிய ஆடுகள் சார்ந்த பின்னணியையும் தாங்குகிறது. அதை விளக்கவுரையாக மாற்றாமல் இலக்கிய மற்றும் இறையியல் தொடர்பைத் தக்கவைக்கிறது.
- issue: οἴκου Ἰσραήλ என்பதுடன் ἀπολωλότα கொண்டுள்ள தொடரியல் உறவு
  choice: ‘இஸ்ரவேல் வீட்டாரில் காணாமற்போன ஆடுகள்’
  alternative: ‘இஸ்ரவேல் வீட்டாரிலிருந்து காணாமற்போன ஆடுகள்’
  rationale: முதன்மை உரை ‘இஸ்ரவேல் வீட்டாருக்குள் காணாமற்போன ஆடுகள்’ என்ற வழக்கமான பண்புப்பெயர் தொடர்பைத் தருகிறது. அதேவேளையில், கிரேக்க மரபுத்தொடர் ‘வீட்டிலிருந்து இழந்துபோனவை’ என்ற தொடர்பையும் அனுமதிப்பதால் அதை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் மரியாதையான கட்டளை நடை. ‘ஆடுகள்’ என்ற வேதாகம உருவகமும் ‘இஸ்ரவேல் வீட்டார்’ என்ற கூட்டு அடையாளமும் இயல்பான தமிழில் பாதுகாக்கப்பட்டுள்ளன.
