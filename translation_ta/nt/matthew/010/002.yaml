id: MAT.10.2
reference: Matthew 10:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τῶν δὲ δώδεκα ἀποστόλων τὰ ὀνόματά ἐστιν ταῦτα· πρῶτος Σίμων ὁ λεγόμενος Πέτρος καὶ Ἀνδρέας ὁ ἀδελφὸς ⸀αὐτοῦ, Ἰάκωβος ὁ τοῦ Ζεβεδαίου καὶ Ἰωάννης ὁ ἀδελφὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/002.yaml
  text: 'These are the names of the twelve apostles: first[a], Simon who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother,'
translation:
  language: ta
  text: 'பன்னிரண்டு அப்போஸ்தலர்களின் பெயர்கள் இவை: முதலாவது[a], பேதுரு என்று அழைக்கப்படும் சீமோனும் அவனுடைய சகோதரன் அந்திரேயாவும்; செபெதேயுவின் மகன் யாக்கோபும் அவனுடைய சகோதரன் யோவானும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘முதலாவது’ என்பது பட்டியலில் முதலில் வருவதைக் குறிப்பதோடு, பன்னிருவருள் சிறப்பிடம் அல்லது முன்னிலையையும் உணர்த்தக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: தனி இணைப்புச் சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ பெயர்ப்பட்டியலுக்கான மென்மையான உரைமாற்றத்தைக் குறிக்கிறது. தமிழில் தனியாக ‘இப்போது’ அல்லது ‘ஆனால்’ என்று சேர்ப்பது தேவையற்ற கால அல்லது முரண்பாட்டு நுண்பொருளை உண்டாக்கும்; வாக்கிய அமைப்பே மாற்றத்தை இயல்பாகக் காட்டுகிறது.
- source_word: δώδεκα ἀποστόλων
  choice: பன்னிரண்டு அப்போஸ்தலர்களின்
  rationale: ἀπόστολος என்பது இயேசுவால் அனுப்பப்பட்ட, அறியப்பட்ட பன்னிருவர் குழுவைக் குறிக்கிறது. தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் தெளிவாக அடையாளம் காணப்படும் ‘அப்போஸ்தலர்’ என்பதே பொருத்தமான மரபுச் சொல்.
- source_word: τὰ ὀνόματά ἐστιν ταῦτα
  choice: பெயர்கள் இவை
  rationale: கிரேக்கத்தின் சுட்டுப்பெயர் அமைப்பைப் பாதுகாத்தபடி இயல்பான நவீனத் தமிழ் சொற்றொடராக உள்ளது.
- source_word: πρῶτος
  choice: முதலாவது
  rationale: பட்டியலில் முதலில் வருபவர் என்ற அடிப்படைப் பொருளைத் தருகிறது; அதிகார முதன்மையை முதன்மை உரையில் தீர்மானித்து விடவில்லை.
- source_word: ὁ λεγόμενος
  choice: என்று அழைக்கப்படும்
  rationale: சீமோன் ‘பேதுரு’ என்னும் பெயரால் அழைக்கப்படுவதை கிரேக்கப் பங்கேற்புச் சொல்லுக்கு வெளிப்படையாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: Πέτρος
  choice: பேதுரு
  rationale: தமிழ் வேதாகம மற்றும் பொதுக் கிறிஸ்தவ வழக்கில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: ὁ ἀδελφὸς αὐτοῦ
  choice: அவனுடைய சகோதரன்
  rationale: இரு இடங்களிலும் உடன்பிறந்த ஆண் உறவைக் குறிக்கிறது; முதல் இடத்தில் சீமோனையும் இரண்டாம் இடத்தில் யாக்கோபையும் αὐτοῦ சுட்டுகிறது.
- source_word: ὁ τοῦ Ζεβεδαίου
  choice: செபெதேயுவின் மகன்
  rationale: கிரேக்கத்திலுள்ள உறவுமுறை சார்ந்த இனங்காட்டலை தமிழில் தேவையான ‘மகன்’ என்ற சொல்லுடன் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சீமோன்/பேதுருவுடன் வரும் πρῶτος என்பதன் பொருள்
  choice: பட்டியலின் வரிசையைக் காட்டும் ‘முதலாவது’ என்று முதன்மை உரையில் மொழிபெயர்க்கப்பட்டது.
  alternative: பன்னிருவருள் சிறப்பிடம் அல்லது முன்னிலை உடையவர் என்ற நுண்பொருள் இருக்கலாம்.
  rationale: πρῶτος வரிசையில் முதலாவதைக் குறிக்கலாம்; சில சூழல்களில் முன்னிலையையும் உணர்த்தலாம். இவ்வசனம் பெயர்ப்பட்டியலைத் தொடங்குவதால் முதன்மை உரை எளிய சொற்பொருளைக் காக்கிறது; அதிகார முதன்மை குறித்த சமயப்பிரிவுச் சார்ந்த முடிவைத் திணிக்காமல் சாத்தியமான நுண்பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க ஆனால் சாதாரண வாசகருக்கு எளிதில் புரியும் நடையில் வடிவமைக்கப்பட்டது. பட்டியல் தெளிவாகத் தெரிய அரைப்புள்ளிகள் பயன்படுத்தப்பட்டுள்ளன; பெயர்கள் தமிழ்க் கிறிஸ்தவ வழக்கில் நிலைபெற்ற வடிவங்களில் தரப்பட்டுள்ளன.
