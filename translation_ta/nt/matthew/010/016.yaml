id: MAT.10.16
reference: Matthew 10:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἰδοὺ ἐγὼ ἀποστέλλω ὑμᾶς ὡς πρόβατα ἐν μέσῳ λύκων· γίνεσθε οὖν φρόνιμοι ὡς οἱ ὄφεις καὶ ἀκέραιοι ὡς αἱ περιστεραί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/016.yaml
  text: Look, I am sending you out as sheep in the midst of wolves; therefore be wise as the snakes and innocent as the doves.
translation:
  language: ta
  text: “இதோ, ஓநாய்களின் நடுவே ஆடுகளைப்போல் நான் உங்களை அனுப்புகிறேன். ஆகவே, பாம்புகளைப்போல் விவேகமுள்ளவர்களாகவும் புறாக்களைப்போல் கபடமற்றவர்களாகவும் இருங்கள்.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் கிரேக்கச் சொல்லின் வலிமையையும் கண்ணியமான நவீன தமிழ் நடையையும் காக்கிறது.
- source_word: πρόβατα
  choice: ஆடுகள்
  rationale: இங்கு மந்தையில் வளர்க்கப்படும் sheep என்பதற்கான இயல்பான பொதுத் தமிழ்ச் சொல்; உருவகத்தைத் தெளிவாக வைத்திருக்கிறது.
- source_word: φρόνιμοι
  choice: விவேகமுள்ளவர்கள்
  rationale: சூழ்நிலையை உணர்ந்து புத்திசாலித்தனமாக நடந்துகொள்ளும் நடைமுறை அறிவை வெளிப்படுத்துகிறது; வெறும் கல்வியறிவையோ சூழ்ச்சியையோ குறிக்கவில்லை.
- source_word: ὄφεις
  choice: பாம்புகள்
  rationale: நவீன தமிழில் இயல்பான பொதுப்பெயர்; கிரேக்கத்தின் பொதுவான snake/serpent குறிப்பை தேவையற்ற சிறப்பாக்கமின்றி தருகிறது.
- source_word: ἀκέραιοι
  choice: கபடமற்றவர்கள்
  rationale: கலப்பற்ற, நேர்மையான, தீய நோக்கமற்ற தன்மையை இச்சூழலில் இயல்பாக வெளிப்படுத்துகிறது; 'விவேகம்' என்பது வஞ்சகமாக மாறக்கூடாது என்ற எதிரிணையையும் காக்கிறது.
- source_word: περιστεραί
  choice: புறாக்கள்
  rationale: கிரேக்கச் சொல்லுக்கான இயல்பான தமிழ் இணை; உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: விவேகமும் குற்றமற்ற தன்மையும் இடையிலான பதற்றம்
  choice: “விவேகமுள்ளவர்களாகவும் … கபடமற்றவர்களாகவும்” என்ற இணைப்பை அப்படியே வைத்தல்
  alternative: “தந்திரமுள்ளவர்களாகவும் … தீங்கற்றவர்களாகவும்”
  rationale: இயேசு எச்சரிக்கையான நடைமுறை அறிவையும் வஞ்சகமற்ற நடத்தையையும் ஒன்றாகக் கோருகிறார். 'தந்திரம்' எதிர்மறையான சூழ்ச்சியைத் தூண்டக்கூடும்; 'கபடமற்ற' என்பது விவேகம் வஞ்சகமாக மாறாதிருக்க வேண்டிய பதற்றத்தைத் தெளிவாகக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நேரடி நடை. கிரேக்க வாக்கியத்தின் உருவகங்கள், முதல் நபர் வலியுறுத்தல் (“நான்”), மற்றும் காரணவிளைவு இணைப்பு (“ஆகவே”) பாதுகாக்கப்பட்டுள்ளன.
