id: MAT.10.40
reference: Matthew 10:40
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὁ δεχόμενος ὑμᾶς ἐμὲ δέχεται, καὶ ὁ ἐμὲ δεχόμενος δέχεται τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/040.yaml
  text: The one who receives you receives me[a], and the one who receives me receives the one who sent me.
translation:
  language: ta
  text: உங்களை ஏற்றுக்கொள்கிறவர் என்னை ஏற்றுக்கொள்கிறார்[a]; என்னை ஏற்றுக்கொள்கிறவர் என்னை அனுப்பியவரை ஏற்றுக்கொள்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வரவேற்கிறவர்”; கிரேக்க வினை, குறிப்பாக ஒரு தூதரைப் பெற்றுக்கொள்ளும் சூழலில், ஒருவரை வரவேற்பது, ஏற்றுக்கொள்வது அல்லது அங்கீகரிப்பது என்ற பொருள்களைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ δεχόμενος
  choice: ஏற்றுக்கொள்கிறவர்
  rationale: பெயர்ச்சொல் தன்மையில் வரும் நிகழ்காலப் பங்கேற்புவினையை, பொதுவாக ஒருவரைக் குறிக்கும் இயல்பான நவீனத் தமிழில் இவ்வாறு வழங்குகிறது.
- source_word: δέχομαι / δέχεται
  choice: ஏற்றுக்கொள்கிறார்
  rationale: ஒருவரை வரவேற்று ஏற்பது, அவரையும் அவரது செய்தியையும் ஏற்றுக்கொள்வது ஆகிய பரந்த பொருளைத் தக்கவைக்கிறது; மூன்று இடங்களிலும் ஒரே வினையைப் பயன்படுத்துவது கிரேக்க மூலத்தின் திட்டமிட்ட தொடர் இணைப்பைப் பாதுகாக்கிறது.
- source_word: ὑμᾶς
  choice: உங்களை
  rationale: இரண்டாம் நபர் பன்மைச் சுட்டுப்பெயராக, இயேசு உரையாடும் சீடர்களைக் குறிக்கிறது; தமிழில் பன்மைத் தன்மை தெளிவாக உள்ளது.
- source_word: ἐμέ
  choice: என்னை
  rationale: இயேசுவைக் குறிக்கும் முதல்நபர் ஒருமை நேரடிச் செயப்படுபொருளைத் தெளிவாக வழங்குகிறது.
- source_word: τὸν ἀποστείλαντά με
  choice: என்னை அனுப்பியவரை
  rationale: பெயர்ச்சொல் தன்மையில் வரும் இறந்தகாலப் பங்கேற்புவினையை இயல்பான தமிழில் வழங்கி, அனுப்பியவர் யார் என்பதை மூலத்தைவிட அதிகமாக வெளிப்படுத்தாமல் விடுகிறது.
theological_decisions:
- issue: இயேசுவை அனுப்பியவரின் அடையாளம்
  choice: என்னை அனுப்பியவர்
  alternative: என்னை அனுப்பிய பிதா
  rationale: மத்தேயுவின் சூழலில் இது பிதாவைக் குறிப்பது தெளிவாக இருந்தாலும், கிரேக்க வாசகம் ‘என்னை அனுப்பியவர்’ என்று மட்டுமே கூறுகிறது. ஆகவே, இறையியல் உட்பொருளை மறைக்காமலும் மூலத்தில் இல்லாத அடையாளத்தைச் சேர்க்காமலும் அதன் சொற்பாங்கு பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை. ‘ஏற்றுக்கொள்கிறார்’ என்ற சொல்லைத் தொடர்ந்து பயன்படுத்தி மூலத்தின் சொல் மீளுரைப்பையும், சீடர்கள்–இயேசு–அனுப்பியவர் என்ற பிரதிநிதித்துவத் தொடரையும் காக்கிறது.
