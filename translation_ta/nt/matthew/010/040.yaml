  naturalness: ‘உங்களை ஏற்றுக்கொள்கிறவர் ...’ என்ற அமைப்பு நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது. மீளுரைக்கப்படும் வினை செயற்பாடு தெளிவாக வாசிக்கப்படுகிறது.
  terminology: ‘ஏற்றுக்கொள்கிறவர்/ஏற்றுக்கொள்கிறார்’ என்பது இச்சூழலில் δέχομαι என்பதற்குப் பொருத்தமானது; வரவேற்பு மற்றும் ஏற்றுக்கொள்ளுதல் ஆகிய பரந்த பொருளைத் தக்கவைக்கிறது. ‘என்னை அனுப்பியவரை’ என்பது மூலத்தில் இல்லாத ‘பிதா’ என்ற அடையாளத்தைச் சேர்க்காமல் சரியாக வழங்குகிறது.
