base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/024.yaml
  text: A disciple is not above the teacher[b][a], nor a slave above his master.
translation:
  language: ta
  text: ஒரு சீடன் ஆசிரியரைவிட மேலானவன் அல்ல; ஒரு அடிமை[a] தன் எஜமான்[b]விட மேலானவன் அல்ல.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அடிமை” என்பதற்கு “பணியாள்” என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் (δοῦλος) சூழலுக்கேற்ப இரு பொருள்களிலும் பயன்படுத்தப்படலாம்.
    reason: alternative_reading
  - marker: b
    text: “எஜமான்” என்பதற்கான கிரேக்கச் சொல் (κύριος) “ஆண்டவர்” என்றும் பொருள்படும்; ஆனால் இங்கு ஒப்புமையில் மனித அதிகாரியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητής
  choice: சீடன்
  rationale: நற்செய்தி நூலின் சூழலில், வெறும் மாணவனைக் காட்டிலும் ஆசிரியரைப் பின்பற்றிக் கற்றுக்கொள்கிற உறவையும் பயிற்சியையும் ‘சீடன்’ நன்றாக வெளிப்படுத்துகிறது.
- source_word: ὑπέρ
  choice: விட மேலானவன்
  rationale: வேற்றுமை உருபுடன் இங்கு ஒருவரைவிட உயர்ந்த நிலை அல்லது மேன்மையைக் குறிக்கிறது; நவீன தமிழில் ஒப்பீட்டை இயல்பாகத் தெரிவிக்கிறது.
- source_word: διδάσκαλος
  choice: போதகர்
  rationale: கற்பிப்பவரைக் குறிக்கும் சொல்லாகவும், ‘எஜமான்’ என்பதுடன் குழப்பமடையாமல் சீடன்–போதகர் உறவை வெளிப்படுத்துவதாகவும் உள்ளது.
- source_word: δοῦλος
  choice: அடிமை
  rationale: κύριος என்பவருக்குக் கீழ்ப்பட்ட சமூக நிலையையும் உடைமை சார்ந்த கட்டுப்பாட்டையும் இந்த ஒப்புமையில் ‘அடிமை’ தெளிவாகப் பாதுகாக்கிறது.
- source_word: κύριος
  choice: எஜமான்
  rationale: இங்கு தெய்வீகப் பட்டப்பெயர் அல்லாமல் அடிமைக்கு மேலுள்ள மனித அதிகாரியைக் குறிக்கிறது; அதனால் ‘எஜமான்’ சூழலுக்குப் பொருத்தமானது.
- source_word: αὐτοῦ
  choice: தன்
  rationale: அடிமைக்கும் அவனுடைய எஜமானுக்கும் இடையிலான தொடர்பை இயல்பான தமிழில் பிரதிபலிக்கிறது.
- source_word: οὐδέ
  choice: -உம் ... அல்ல
  rationale: முதல் மறுப்புடன் இரண்டாம் ஒப்பீட்டை இணைக்கும் கிரேக்க அமைப்பை தமிழின் இணை மறுப்பு வடிவில் இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: இறையியல் சாராத சமூக ஒப்புமையில் δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: அடிமை
  alternative: வேலைக்காரன் / பணியாளர்
  rationale: இவ்வசனத்தில் சீடன்–போதகர் என்பதற்கு இணையாக அடிமை–எஜமான் என்ற நிலை உறவு வருகிறது. கீழ்ப்படிதலும் கட்டுப்பட்ட நிலையும் முக்கியமாதலால் ‘அடிமை’ மூலச்சொல்லின் வலிமையைப் பாதுகாக்கிறது; மென்மையான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: மனித குடும்ப/சமூகச் சூழலில் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: எஜமான்
  alternative: ஆண்டவர்
  rationale: இங்கு κύριος என்பது தெய்வீகப் பட்டம் அல்ல; δοῦλος என்பதுடன் இணைந்த மனித அதிகாரியைக் குறிக்கிறது. ஆகவே ‘எஜமான்’ சூழலைத் தெளிவாக்குகிறது; மூலச்சொல்லின் வேறு வழக்கை அடிக்குறிப்பு குறிப்பிடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. இணையான இரு கூறுகளும் ‘மேலானவன் அல்ல’ என்று முழுமையாகக் கூறப்பட்டு கிரேக்க வாக்கியத்தின் சமச்சீர் அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
