id: MAT.10.21
reference: Matthew 10:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: παραδώσει δὲ ἀδελφὸς ἀδελφὸν εἰς θάνατον καὶ πατὴρ τέκνον, καὶ ἐπαναστήσονται τέκνα ἐπὶ γονεῖς καὶ θανατώσουσιν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/021.yaml
  text: And brother will hand over brother to death[a], and a father his child, and children will rise up against parents and put them to death.
translation:
  language: ta
  text: சகோதரன் தன் சகோதரனை மரணத்திற்கு ஒப்படைப்பான்[a]; தந்தை தன் பிள்ளையை மரணத்திற்கு ஒப்படைப்பான்; பிள்ளைகள் தங்கள் பெற்றோருக்கு எதிராக எழுந்து, அவர்களைக் கொன்றுவிடுவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கையளிப்பான்’; துரோகச் சூழல்களில் இந்த வினைச்சொல் ‘காட்டிக்கொடுப்பான்’ என்ற பொருளையும் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδώσει
  choice: ஒப்புக்கொடுப்பான்
  rationale: பகைமை கொண்டவர்களின் கையில் ஒருவரை ஒப்படைத்து, மரணத்திற்கு உள்ளாக்கும் பொருளை இது இயல்பாக வெளிப்படுத்துகிறது; ‘காட்டிக்கொடுப்பான்’ என மொழிபெயர்த்து துரோகத்தின் கருத்தை மட்டும் கட்டாயப்படுத்தவில்லை.
- source_word: ἀδελφὸς ... ἀδελφὸν
  choice: சகோதரன் தன் சகோதரனை
  rationale: கிரேக்கத்தின் ஆண்பால், பிரதிநிதித்துவ ஒருமையையும் நெருங்கிய குடும்ப உறவையும் காக்கிறது.
- source_word: εἰς θάνατον
  choice: மரணத்திற்கு
  rationale: ஒப்புக்கொடுத்தலின் முடிவு அல்லது நோக்கம் மரணம் என்பதைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: πατὴρ τέκνον
  choice: தகப்பன் தன் பிள்ளையை
  rationale: πατήρ என்பதன் ஆண்பால் பொருளையும் τέκνον என்பதன் பாலினம் குறிப்பிடாத பரந்த பொருளையும் காக்கிறது; ‘தன்’ என்பது தமிழில் உறவைத் தெளிவாக்குகிறது.
- source_word: ἐπαναστήσονται
  choice: எதிராக எழும்பி
  rationale: எதிர்த்து எழுதல் என்ற கிரேக்கத்தின் உயிரோட்டமான பகைமைப் பொருளைத் தக்கவைக்கிறது.
- source_word: τέκνα
  choice: பிள்ளைகள்
  rationale: ஆண், பெண் இருபாலரையும் உள்ளடக்கும் τέκνα என்பதற்கான இயல்பான தமிழ் சொல்.
- source_word: ἐπὶ γονεῖς
  choice: தங்கள் பெற்றோருக்கு எதிராக
  rationale: பகைமையைக் குறிக்கும் சூழலில் ἐπί என்பதன் ‘எதிராக’ என்ற பொருளையும் γονεῖς என்பதன் பன்மையையும் தெளிவாகத் தருகிறது.
- source_word: θανατώσουσιν
  choice: கொலைசெய்வார்கள்
  rationale: ஒருவரை வேண்டுமென்றே மரணமடையச் செய்வதைக் குறிக்கிறது; தமிழில் இயல்பாகவும் கடுமையை இழக்காமலும் உள்ளது.
- source_word: αὐτούς
  choice: அவர்களை
  rationale: உடனடி முன்னிலையான ‘பெற்றோர்’ என்பதையே சுட்டுகிறது; கிரேக்கத்தின் சுட்டுப்பெயர் ஓட்டத்தைக் காக்கிறது.
theological_decisions:
- issue: பாலினத்தைக் குறிக்கும் மற்றும் பிரதிநிதித்துவ குடும்பச் சொற்கள்
  choice: ἀδελφός என்பதற்கு ‘சகோதரன்’ என்றும், τέκνα/γονεῖς என்பவற்றுக்கு ‘பிள்ளைகள்/பெற்றோர்’ என்றும் மொழிபெயர்த்தல்
  alternative: ἀδελφός என்பதைப் பொதுப்பாலில் ‘உடன்பிறந்தவர்’ என மொழிபெயர்த்தல்
  rationale: மூலத்தில் ἀδελφός ஆண்பால் உறவைக் குறிப்பதால் ‘சகோதரன்’ அதனைத் துல்லியமாகக் காக்கிறது; τέκνα மற்றும் γονεῖς பாலினம் கடந்த குடும்பச் சொற்களாதலால் முறையே ‘பிள்ளைகள்’, ‘பெற்றோர்’ என்று தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘தகப்பன்’ மூலத்தின் ஆண்பால் உறவைத் தெளிவாகக் காக்கிறது; இரண்டாம் கூறில் முன் வினை இயல்பாகத் தொடர்ந்தாலும் தமிழின் தெளிவிற்காக ‘ஒப்புக்கொடுப்பான்’ மீண்டும் இடப்பட்டுள்ளது.
