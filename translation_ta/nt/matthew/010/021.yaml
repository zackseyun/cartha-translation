    text: அல்லது, ‘கையளிப்பான்’; துரோகச் சூழல்களில் இந்த வினைச்சொல் ‘காட்டிக்கொடுப்பான்’ என்ற பொருளையும் கொள்ளலாம்.
    reason: lexical_alternative
  revision_rationale: The revision makes the shared ‘to death’ phrase explicit for both first clauses, uses standard modern Tamil family terminology, and improves idiom and orthography while retaining the Greek syntax, familial distinctions, and severity of the final action. The lexical footnote remains anchored to ‘ஒப்படைப்பான்’ and preserves the non-forced betrayal alternative.
