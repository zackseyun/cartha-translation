id: MAT.10.1
reference: Matthew 10:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος τοὺς δώδεκα μαθητὰς αὐτοῦ ἔδωκεν αὐτοῖς ἐξουσίαν πνευμάτων ἀκαθάρτων ὥστε ἐκβάλλειν αὐτὰ καὶ θεραπεύειν πᾶσαν νόσον καὶ πᾶσαν μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/001.yaml
  text: And calling his twelve disciples to himself[a], he gave them authority over unclean spirits[c][b], to cast them out and to heal every disease and every sickness.
translation:
  language: ta
  text: இயேசு தம்முடைய பன்னிரண்டு சீடர்களையும் தம்மிடம் அழைத்து, அசுத்த ஆவிகளின்மேல் அதிகாரத்தை அவர்களுக்குக் கொடுத்தார்; அவற்றை வெளியேற்றவும் எல்லா நோய்களையும் எல்லா உடல்நலக் குறைவுகளையும் குணமாக்கவும் கொடுத்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நோய்கள்’ மற்றும் ‘உடல்நலக் குறைவுகள்’ என்பவை மூலமொழியிலுள்ள தொடர்புடைய, ஆனால் வேறுபட்ட இரண்டு சொற்களை (νόσος, μαλακία) பிரதிபலிக்கின்றன; பின்னையதை ‘பலவீனங்கள்’ அல்லது ‘நலிவுகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: தம்மிடம் அழைத்து
  rationale: இறந்தகால நடுவினைப் பெயரெச்சம், சீடர்களைத் தம்மிடம் அழைத்த செயலைக் குறிக்கிறது. தமிழில் இயல்பான பெயரெச்சத் தொடரால் கால உறவை அளவுக்கு மீறித் துல்லியப்படுத்தாமல் தருகிறது.
- source_word: τοὺς δώδεκα μαθητὰς αὐτοῦ
  choice: தம்முடைய பன்னிரண்டு சீடர்களையும்
  rationale: μαθητής என்பதற்குச் சுவிசேஷச் சூழலில் நிலைபெற்றதும் இயல்பானதுமான சொல் ‘சீடர்’; αὐτοῦ என்பதன் உடைமைத் தொடர்பும் தெளிவாகப் பாதுகாக்கப்படுகிறது.
- source_word: ἔδωκεν
  choice: கொடுத்தார்
  rationale: δίδωμι என்பதன் நேரடியான பொருளைத் தக்கவைக்கிறது; ‘அளித்தார்’ என்பதைக் காட்டிலும் எளிமையானது.
- source_word: ἐξουσίαν
  choice: அதிகாரத்தை
  rationale: வெறும் வல்லமையை மட்டுமல்லாமல், செயல்பட வழங்கப்பட்ட உரிமை அல்லது அதிகாரத்தைக் குறிக்கும் சொல்லாக ἐξουσία இச்சூழலில் அமைகிறது.
- source_word: πνευμάτων ἀκαθάρτων
  choice: அசுத்த ஆவிகளை ... அவற்றின்மேல்
  rationale: ‘அசுத்த ஆவிகள்’ என்பது நற்செய்தி நூல்களின் வழக்கமான சொற்றொடர். கிரேக்க வேற்றுமைத் தொடர்பை இயல்பான தமிழில் ‘அவற்றின்மேல் அதிகாரம்’ என வெளிப்படுத்துகிறது.
- source_word: ὥστε ἐκβάλλειν αὐτά
  choice: அசுத்த ஆவிகளை வெளியேற்றவும்
  rationale: ὥστε உடன் வரும் வினையெச்சம் நோக்கம் அல்லது விளைவு ஆகிய இரண்டுக்கும் இடமளிக்கிறது; தமிழின் ‘-வும்’ இணைப்பு அதிகாரத்தின் செயல்பாட்டை இயல்பாகக் காட்டி, உறவை மிகையாக நிர்ணயிப்பதில்லை.
- source_word: θεραπεύειν
  choice: குணமாக்கவும்
  rationale: இச்சூழலில் நோயுற்றவர்களைக் குணப்படுத்துவதைத் தெளிவாகக் குறிக்கிறது.
- source_word: πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: எல்லா வகையான நோய்களையும் உடல்நலக் குறைவுகளையும்
  rationale: νόσος மற்றும் μαλακία ஆகிய தொடர்புடைய இரு சொற்களையும் ஒன்றாகச் சுருக்காமல், முறையே ‘நோய்கள்’ மற்றும் ‘உடல்நலக் குறைவுகள்’ என்று வேறுபடுத்துகிறது. திரும்பத் திரும்ப வரும் πᾶσαν என்பதன் முழுமையும் ‘எல்லா வகையான’ என்பதில் வெளிப்படுகிறது.
theological_decisions:
- issue: சீடர்களுக்குக் கொடுக்கப்பட்டதன் இயல்பு
  choice: இயேசு அசுத்த ஆவிகளின்மேல் அதிகாரத்தைப் பன்னிருவருக்குக் கொடுத்தார்
  alternative: அசுத்த ஆவிகளுக்கு எதிரான வல்லமையை அவர்களுக்குக் கொடுத்தார்
  rationale: ἐξουσία என்பது இங்கு வெறும் ஆற்றலைவிட, இயேசுவிடமிருந்து வழங்கப்பட்ட செயல்பாட்டு அதிகாரத்தை முன்னிறுத்துகிறது. மூலவசனத்திற்கு அப்பாற்பட்ட கோட்பாட்டுக் கருத்துகள் சேர்க்கப்படவில்லை.
- issue: ὥστε உடன் வரும் வினையெச்சங்களின் நோக்கம்/விளைவு உறவு
  choice: அதிகாரம் வெளியேற்றுதலிலும் குணமாக்குதலிலும் செயல்படுகிறது என திறந்த அமைப்பில் மொழிபெயர்த்தல்
  alternative: ‘இதன் விளைவாக’ என்று முழுமையான விளைவாகவோ, ‘இதற்காகவே’ என்று முழுமையான நோக்கமாகவோ குறிப்பிடுதல்
  rationale: கிரேக்க அமைப்பு நோக்கத்தையும் விளைவையும் தொட்டுச் செல்லக்கூடும்; தமிழ் வாக்கிய அமைப்பு இந்த நுணுக்கத்தைத் தேவையின்றி முடிவு செய்யாமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையில் அமைக்கப்பட்டது. இயேசுவைக் குறிக்கும் இடங்களில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. ‘அசுத்த ஆவிகள்’, ‘சீடர்கள்’, ‘அதிகாரம்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன.
