id: MAT.10.19
reference: Matthew 10:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀παραδῶσιν ὑμᾶς, μὴ μεριμνήσητε πῶς ἢ τί λαλήσητε· δοθήσεται γὰρ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τί ⸀λαλήσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/019.yaml
  text: But when they hand you over[a], do not worry about how or what you should speak[b], for what you should speak will be given to you in that hour.
translation:
  language: ta
  text: ஆனால் அவர்கள் உங்களை ஒப்படைக்கும்போது[a], எப்படிப் பேசுவது அல்லது என்ன பேசுவது என்று கவலைப்படாதீர்கள். ஏனெனில், நீங்கள் பேச வேண்டியது என்னவோ, அது அந்த வேளையில் உங்களுக்குக் கொடுக்கப்படும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஒப்படைக்கும்போது’ என்பது இங்கு விசாரணைக்காக அல்லது தண்டனைக்காக அதிகாரிகளிடம் ஒப்புக்கொடுப்பதைக் குறிக்கலாம்; ‘காட்டிக்கொடுக்கும்போது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘கொடுக்கப்படும்’ என்ற செயப்பாட்டு வடிவம் கொடுப்பவர் யார் என்பதை இங்கு வெளிப்படையாகக் கூறவில்லை; அடுத்த வசனம் உங்களுக்குள் பேசுகிறவர் உங்கள் தந்தையின் ஆவியானவர் என்று கூறுகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: ὅταν δὲ
  choice: ஆனால் ... போது
  rationale: ὅταν வருங்காலத்தில் நிகழக்கூடிய சூழலைக் குறிக்கிறது; δέ முந்தைய எச்சரிக்கையிலிருந்து இவ்வழிகாட்டுதலுக்கான மென்மையான மாறுதலைக் காட்டுவதால் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: παραδῶσιν ὑμᾶς
  choice: அவர்கள் உங்களை ஒப்படைக்கும்போது
  rationale: παραδίδωμι இச்சூழலில் விசாரணை அல்லது தண்டனைக்காக அதிகாரிகளிடம் ஒப்புக்கொடுப்பதைக் குறிக்கிறது. ‘ஒப்படைக்கும்போது’ என்பது ‘காட்டிக்கொடுக்கும்போது’ என்ற துரோகப் பொருளைத் தேவையின்றி சேர்க்காமல் நீதித்துறை சார்ந்த பகைமையான சூழலைத் தக்கவைக்கிறது.
- source_word: μὴ μεριμνήσητε
  choice: கவலைப்படாதீர்கள்
  rationale: μεριμνάω இங்கு வரவிருக்கும் சாட்சியுரையைப் பற்றிய பதற்றமான கவலையைத் தடைசெய்கிறது; ‘கவலைப்படாதீர்கள்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: πῶς ἢ τί λαλήσητε
  choice: எப்படிப் பேசுவது அல்லது என்ன பேசுவது
  rationale: πῶς மற்றும் τί ஆகியவை பேசும் விதத்தையும் உள்ளடக்கத்தையும் வேறுபடுத்துகின்றன; ἤ என்பதற்கு ஏற்ப ‘அல்லது’ பயன்படுத்தப்பட்டு, தமிழில் தெளிவிற்காக ‘பேசுவது’ இருமுறை வெளிப்படுத்தப்பட்டது.
- source_word: δοθήσεται
  choice: கொடுக்கப்படும்
  rationale: δίδωμι என்பதன் எதிர்காலச் செயப்பாட்டுவினை வடிவம். கொடுப்பவர் யார் என்பதை இந்த வசனம் வெளிப்படையாகக் குறிப்பிடாததால் தமிழ் மொழிபெயர்ப்பிலும் செயப்பாட்டு அமைப்பு தக்கவைக்கப்பட்டது.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: அந்த வேளையில்
  rationale: தேவையான சமயத்திலேயே உதவி கிடைக்கும் என்ற உடனடித் தன்மையை இயல்பான, கண்ணியமான தமிழில் ‘அந்த வேளையில்’ வெளிப்படுத்துகிறது.
- source_word: τί λαλήσητε
  choice: நீங்கள் என்ன பேசவேண்டும் என்பது
  rationale: λαλέω உடனான சொல்லிணைப்பைத் தக்கவைக்க ‘பேசவேண்டும்’ பயன்படுத்தப்பட்டது; சூழலில் எண்ணிப் பார்த்து முன்னேற்பாடு செய்ய வேண்டிய உரையைக் குறிக்கும் கருத்தையும் இது இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: δοθήσεται என்பதில் மறைமுகமாக உள்ள தெய்வீகச் செயற்பாடு
  choice: கொடுப்பவர் யார் என்று பெயரிடாமல் ‘உங்களுக்குக் கொடுக்கப்படும்’ என்ற செயப்பாட்டு வடிவத்தைத் தக்கவைத்தல்
  alternative: ‘கடவுள் உங்களுக்குக் கொடுப்பார்’ அல்லது ‘ஆவியானவர் உங்களுக்குக் கொடுப்பார்’
  rationale: கிரேக்க மூலவசனம் கொடுப்பவரை வெளிப்படையாக அடையாளப்படுத்தவில்லை. அடுத்த வசனம் அவர்கள்மூலம் பேசுகிறவர் ஆவியானவர் என்று தெளிவுபடுத்துவதால், அந்த விளக்கத்தை இவ்வசனத்திற்குள் முன்கூட்டியே சேர்க்காமல் மூலத்தின் கட்டுப்பாடும் இறையியல் அழுத்தமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘அந்த வேளையில்’ என்ற சொற்றொடர் மூலத்தின் உடனடித் தன்மையையும் வேதாகமத் தொனியையும் அளவான முறையில் தக்கவைக்கிறது; தேவையற்ற பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
