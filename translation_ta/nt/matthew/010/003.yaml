source:
  edition: SBLGNT
  text: Φίλιππος καὶ Βαρθολομαῖος, Θωμᾶς καὶ Μαθθαῖος ὁ τελώνης, Ἰάκωβος ὁ τοῦ Ἁλφαίου καὶ ⸀Θαδδαῖος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/003.yaml
  text: Philip and Bartholomew[a], Thomas and Matthew the tax collector, James the son of Alphaeus and Thaddaeus,
translation:
  language: ta
  text: பிலிப்பும் பர்த்தலொமேயும், தோமாவும் வரி வசூலிப்பவரான மத்தேயுவும், அல்பேயுவின் மகன் யாக்கோபும் ததேயுவும்,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகள் “லெப்பேயு” என்று வாசிக்கின்றன; சிலவற்றில் “ததேயு என அழைக்கப்பட்ட லெப்பேயு” என்று உள்ளது. இதற்கு இணையான இடத்தில் லூக்காவின் அப்போஸ்தலர் பட்டியல்கள் “யாக்கோபின் மகன் யூதா” என்று குறிப்பிடுகின்றன.
    reason: textual_variant
lexical_decisions:
- source_word: Φίλιππος
  choice: பிலிப்பு
  rationale: புதிய ஏற்பாட்டுத் தமிழில் அறிமுகமான, கிரேக்கப் பெயருக்கு நெருக்கமான ஒலிபெயர்ப்பு.
- source_word: Βαρθολομαῖος
  choice: பர்த்தொலொமேயு
  rationale: தனிப்பெயரை மொழிபெயர்க்காமல், தமிழில் இயல்பாக வேற்றுமை உருபு ஏற்கும் வகையில் ஒலிபெயர்க்கிறது.
- source_word: Θωμᾶς
  choice: தோமா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நன்கு அறிமுகமான பெயர்வடிவம்.
- source_word: Μαθθαῖος
  choice: மத்தேயு
  rationale: தமிழில் பரவலாக அறியப்படும் புதிய ஏற்பாட்டுப் பெயர்வடிவம்.
- source_word: ὁ τελώνης
  choice: வரி வசூலிப்பவர்
  rationale: வரி அல்லது சுங்கம் வசூலித்தவரைக் குறிக்கும் சொல்லை, பழமையான அல்லது குறுகிய தொழிற்பெயரைத் தவிர்த்து, இன்றைய வாசகருக்குத் தெளிவாக வழங்குகிறது.
- source_word: Ἰάκωβος
  choice: யாக்கோபு
  rationale: Ἰάκωβος என்ற பெயரின் மூல வடிவத்தையும் தமிழ் வேதாகம மரபில் அதன் அடையாளத்தையும் பாதுகாக்கும் ஒலிபெயர்ப்பு.
- source_word: ὁ τοῦ Ἁλφαίου
  choice: அல்பேயுவின் மகன்
  rationale: கிரேக்கத்தில் சுருக்கமாக உள்ள தந்தைவழி அடையாளத்தைத் தமிழில் இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: Ἁλφαίου
  choice: அல்பேயு
  rationale: கிரேக்கத் தனிப்பெயரின் தமிழுக்கு ஏற்ற ஒலிபெயர்ப்பு.
- source_word: Θαδδαῖος
  choice: ததேயு
  rationale: வழங்கப்பட்ட SBLGNT மூலவாசகத்தை நேரடியாகப் பின்பற்றும் ஒலிபெயர்ப்பு; வேறு பெயர்வடிவங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: καὶ
  choice: -உம்
  rationale: இணையாக அமைந்த பெயர்ப்பட்டியலில் கிரேக்க καὶ-இன் தொடர்ச்சியான இணைப்பை இயல்பான தமிழ் இணைப்பிடை வடிவமான ‘-உம்’ மூலம் பாதுகாக்கிறது.
theological_decisions:
- issue: பட்டியலின் இறுதி அப்போஸ்தலரின் அடையாளம்
  choice: ததேயு
  alternative: லெப்பேயு; யாக்கோபின் மகன் யூதா
  rationale: வழங்கப்பட்ட SBLGNT வாசகம் Θαδδαῖος என்பதால் முதன்மை உரை அதையே பின்பற்றுகிறது. வேறு கையெழுத்துப் பிரதிகளும் லூக்காவின் இணைப் பட்டியல்களும் தரும் பெயர்களை ஒன்றிணைக்காமல் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பெயர்ப்பட்டியலின் இணை அமைப்பை ‘-உம்’ மூலம் இயல்பாக வைத்துள்ளது. ‘வரி வசூலிப்பவர்’ என்பது தெளிவான பொதுநடை; வாக்கியத்தின் மரியாதைமிக்க வேதாகமத் தொனி காக்கப்பட்டுள்ளது.
