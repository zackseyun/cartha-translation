id: MAT.10.18
reference: Matthew 10:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐπὶ ἡγεμόνας δὲ καὶ βασιλεῖς ἀχθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς καὶ τοῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/018.yaml
  text: And you will be brought before governors and kings because of me[b][a], as a testimony to them and to the Gentiles.
translation:
  language: ta
  text: என் காரணமாக நீங்கள் ஆளுநர்கள் மற்றும் அரசர்கள் முன் கொண்டுவரப்படுவீர்கள்; இவ்வாறு அவர்களுக்கும்[a] பிற இனத்தாருக்கும்[b] ஒரு சாட்சியாக இருப்பீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்களுக்கு” என்பதைச் சூழலின்படி “அவர்களுக்கு எதிராக” என்றும் புரிந்துகொள்ளலாம்; ஆனால் கிரேக்க இடைவேற்றுமை வடிவம் அதை வெளிப்படையாகக் கூறவில்லை.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “நாடுகளுக்கும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ ἡγεμόνας ... καὶ βασιλεῖς
  choice: ஆளுநர்களுக்கும் அரசர்களுக்கும் முன்பாக
  rationale: ἐπί + வேற்றுமை உருபின் பயன்பாடும் ἀχθήσεσθε என்ற வினையும் சேர்ந்து, அதிகாரிகளின் முன்னிலையில் நிறுத்தப்படுவதைக் குறிக்கின்றன. ἡγεμών என்பதற்கு ‘ஆளுநர்’ இயல்பான நிர்வாகப் பதவி; βασιλεύς என்பதற்கு ‘அரசர்’ பொருத்தமானது.
- source_word: ἀχθήσεσθε
  choice: கொண்டுபோகப்படுவீர்கள்
  rationale: ἄγω என்பதன் எதிர்காலச் செயப்பாட்டு வடிவம். நீதித்துறைச் சூழலில் ஒருவரை அதிகாரிகளிடம் கொண்டு செல்வதை இது இயல்பாகச் சொல்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத வன்முறையைச் சேர்க்கவில்லை.
- source_word: ἕνεκεν ἐμοῦ
  choice: என்னிமித்தம்
  rationale: ἕνεκεν + பிறப்புவேற்றுமை காரணத்தைத் தெரிவிக்கிறது. ‘என்னிமித்தம்’ என்பது இயேசுவே காரணம் என்பதைச் சுருக்கமாகவும் dignified modern Tamil register-இலும் வெளிப்படுத்துகிறது.
- source_word: εἰς μαρτύριον
  choice: ஒரு சாட்சியாக அமையும்
  rationale: இங்கு εἰς நோக்கம் அல்லது விளைவைக் குறிக்கலாம். ‘சாட்சியாக அமையும்’ என்பது பெயர்ச்சொல் வடிவத்தைப் பேணுவதோடு, அவர்களது ஆஜராக்கப்படுதல் சாட்சியாகச் செயல்படும் என்பதை இயல்பான தமிழில் காட்டுகிறது.
- source_word: αὐτοῖς
  choice: அவர்களுக்கு
  rationale: இந்தப் பன்மைச் சுட்டுப்பெயர் இயல்பாக முன்பு சொல்லப்பட்ட ஆளுநர்களையும் அரசர்களையும் குறிக்கிறது. கிரேக்க இடைவேற்றுமை தானாகவே ‘அவர்களுக்கு எதிராக’ என்று கூறாததால், நடுநிலையான மொழிபெயர்ப்பு மூலத்தின் தெளிவின்மையைப் பேணுகிறது.
- source_word: τοῖς ἔθνεσιν
  choice: பிற இனத்தாருக்கு
  rationale: மத்தேயுவில் ἔθνη பல இடங்களில் இஸ்ரவேலரல்லாத மக்களைக் குறிக்கிறது. ‘பிற இனத்தார்’ அந்தக் கருத்தை இன்றைய வாசகர்களுக்கு இயல்பாகத் தருகிறது; ‘நாடுகள்’ என்ற மாற்றும் சொற்பொருளில் சாத்தியம்.
theological_decisions:
- issue: μαρτύριον αὐτοῖς என்பதன் நோக்கு
  choice: அவர்களுக்கு ஒரு சாட்சியாக
  alternative: அவர்களுக்கு எதிரான ஒரு சாட்சியாக
  rationale: αὐτοῖς என்ற இடைவேற்றுமை வடிவம் சாட்சி அவர்களை நோக்கியதா அல்லது அவர்களுக்கு எதிரானதா என்பதைத் தனியே தீர்மானிக்கவில்லை. ஆகவே கண்டனத்தை உரையில் சேர்க்காமல், சாட்சி அழைப்பாகவும் மறுப்பின் நிலையில் எதிர்ச்சாட்சியாகவும் அமையக்கூடிய இறையியல் இழுபறி பேணப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆளுநர்கள்’, ‘அரசர்கள்’ ஆகியவை வரலாற்று அதிகாரப் பதவிகளைத் தெளிவாகக் காட்டுகின்றன. வசனத்தின் நீண்ட கிரேக்க வாக்கிய அமைப்பு தமிழில் தெளிவாகப் புரிய அரைப்புள்ளியால் பிரிக்கப்பட்டது; பொருள் அல்லது இறையியல் தெளிவின்மை நீக்கப்படவில்லை.
