  source_fidelity: மூலக் கிரேக்கத்தின் எதிர்காலப் பொருளும், ‘அனைவராலும் வெறுக்கப்படுதல்,’ ‘என் பெயரின் காரணமாக,’ முடிவுவரைத் தாங்கி நிற்றல், மற்றும் காப்பு ஆகிய முக்கியக் கூறுகளும் துல்லியமாகத் தரப்பட்டுள்ளன. οὗτος-இன் வலியுறுத்தலைத் தமிழில் தனிச்சொல்லாகக் கொடுக்காமல் விடுவது இயல்பானது; பொருள் இழப்பதில்லை.
  naturalness: “என் பெயரின் காரணமாக எல்லாரும் உங்களை வெறுப்பார்கள்” மற்றும் “முடிவுவரை நிலைத்திருப்பவர் காப்பாற்றப்படுவார்” ஆகியவை நவீனத் தரத் தமிழில் தெளிவாகவும் கண்ணியமான வேதாகம நடையுடனும் உள்ளன. செயப்பாட்டு வடிவத்தைச் செயல்வடிவமாக மாற்றியிருப்பது தமிழில் இயல்பானது; முகவர்-விரிவான பொருளும் தக்கவைக்கப்பட்டுள்ளது.
  terminology: ‘நிலைத்திருப்பவர்’ ὑπομείνας என்பதற்குத் தகுந்த, துன்பத்தின் மத்தியில் உறுதியாகத் தொடர்தலைக் குறிக்கும் சொல். ‘காப்பாற்றப்படுவார்’ σῴζω-வின் பரந்த பொருளைத் திறந்தவாறே வைத்திருக்கிறது; அடிக்குறிப்பு மாற்றுவாசிப்புகளையும் சூழல் சார்ந்த புரிதலையும் முறையாகக் குறிக்கிறது. ‘என் பெயர்’ என்ற சொற்றொடர் மூலத்தின் நோக்கமுள்ள திறந்த தன்மையைப் பாதுகாக்கிறது.
