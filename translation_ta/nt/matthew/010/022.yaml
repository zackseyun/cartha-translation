id: MAT.10.22
reference: Matthew 10:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου· ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/022.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: ta
  text: என் பெயரின் காரணமாக எல்லாரும் உங்களை வெறுப்பார்கள்.[a] ஆனால் முடிவுவரை நிலைத்திருப்பவர் காப்பாற்றப்படுவார்.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் பெயருக்காக.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “முடிவுவரை விடாமுயற்சியுடன் இருப்பவர்.”
    reason: lexical_alternative
  - marker: c
    text: “காப்பாற்றப்படுவார்” என்பதைச் சூழலின்படி “விடுவிக்கப்படுவார்” அல்லது “மீட்கப்படுவார்” என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: μισούμενοι ὑπὸ πάντων
  choice: எல்லாரும் உங்களை வெறுப்பார்கள்
  rationale: எதிர்காலத் தொடர்நிலையை இயல்பான நவீனத் தமிழில் கூறுகிறது; ὑπό உடன் வரும் πάντων வெறுப்பின் மனிதச் செயற்பாட்டாளர்களை முழுமையாகக் குறிக்கிறது.
- source_word: διὰ τὸ ὄνομά μου
  choice: என் பெயரின் காரணமாக
  rationale: διά + வேற்றுமை வடிவம் காரணத்தைச் சுட்டுகிறது. ‘பெயர்’ என்பதைத் தக்கவைத்து, இயேசுவின் ஆளுமை, அதிகாரம், அவருடனான அடையாளம் ஆகிய பரந்த பொருள்களைச் சுருக்காமல் விடுகிறது.
- source_word: ὁ δὲ ὑπομείνας εἰς τέλος
  choice: ஆனால் முடிவுவரை நிலைத்திருப்பவர்
  rationale: ὑπομένω துன்புறுத்தலின் மத்தியில் தொடர்ந்து உறுதியாக இருப்பதைக் குறிக்கிறது. ‘நிலைத்திருப்பவர்’ இயல்பான தமிழில் அந்தப் பொருளைத் தருகிறது; εἰς τέλος என்பதற்கு ‘முடிவுவரை’ தெளிவான இணை.
- source_word: οὗτος
  choice: வினைச்சொல்லில் தனியே மொழிபெயர்க்கப்படவில்லை
  rationale: கிரேக்கத்தில் இது முன்வந்த பங்கேற்புப் பெயரெச்சத் தொடரை மீண்டும் எடுத்துக் காட்டி வலியுறுத்துகிறது. தமிழில் ‘அவரே’ என்று சேர்க்கலாம்; ஆனால் இங்கு வாக்கிய ஓட்டத்திற்காக அந்த வலியுறுத்தல் இயல்பாக உட்பொதிக்கப்பட்டுள்ளது.
- source_word: σωθήσεται
  choice: காப்பாற்றப்படுவார்
  rationale: σῴζω என்பதன் ‘இரட்சிக்கப்படுதல்/மீட்கப்படுதல்/காப்பாற்றப்படுதல்’ என்ற பரந்த வரம்பை ‘காப்பாற்றப்படுவார்’ தக்கவைக்கிறது; சூழலை உடல் விடுதலைக்கு மட்டும் குறுக்குவதில்லை.
theological_decisions:
- issue: முடிவுவரை நிலைத்திருப்பதற்கும் இறுதிக் காப்பிற்கும் உள்ள தொடர்பு
  choice: ‘காப்பாற்றப்படுவார்’ என்ற பரந்த சொல்லாட்சியைத் தக்கவைத்தல்
  alternative: ‘உடல் ஆபத்திலிருந்து விடுவிக்கப்படுவார்’ அல்லது குறிப்பிட்ட நிலைத்திருத்தல் கோட்பாட்டை வெளிப்படையாகக் கூறுதல்
  rationale: வசனம் துன்புறுத்தலின்போது நிலைத்திருப்பதையும் காப்பையும் இணைக்கிறது; ஆனால் அந்தக் காப்பு உடனடியான மீட்பா, இறுதிக்கால இரட்சிப்பா என்பதை மொழிபெயர்ப்பு ஒருதலைப்பட்சமாகத் தீர்மானிக்கக் கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; எளிமையானதாயினும் கண்ணியமான நடை. கிரேக்கச் சொல் வரிசையை அப்படியே பின்பற்றாமல் தமிழின் இயல்பான எழுவாய்–செயப்படுபொருள் அமைப்பு பயன்படுத்தப்பட்டுள்ளது. ‘இரட்சிக்கப்படுவார்’ என்பதற்குப் பதிலாக பொதுவாகப் புரியும் ‘காப்பாற்றப்படுவார்’ தேர்ந்தெடுக்கப்பட்டு, இறையியல் அகலம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
