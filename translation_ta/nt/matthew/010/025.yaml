id: MAT.10.25
reference: Matthew 10:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀρκετὸν τῷ μαθητῇ ἵνα γένηται ὡς ὁ διδάσκαλος αὐτοῦ, καὶ ὁ δοῦλος ὡς ὁ κύριος αὐτοῦ. εἰ τὸν οἰκοδεσπότην Βεελζεβοὺλ ⸀ἐπεκάλεσαν, πόσῳ μᾶλλον τοὺς οἰκιακοὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/025.yaml
  text: It is enough for the disciple that he become like his teacher[a], and the slave like his master. If they called the master of the house Beelzebul, how much more those of his household.
translation:
  language: ta
  text: சீடன் தன் ஆசிரியரைப் போலவும், அடிமை தன் எஜமானைப் போலவும் ஆவது போதும். வீட்டின் எஜமானை பெயல்செபூல்[a] என்று அழைத்தார்கள் என்றால், அவருடைய வீட்டைச் சேர்ந்தவர்களை இன்னும் எவ்வளவு அதிகமாக அப்படி அழைப்பார்கள்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு பெயர் வடிவம்: ‘பெயல்செபூப்.’'
    reason: மூல கிரேக்கத்தில் ‘பெயல்செபூல்’ என்ற வடிவம் உள்ளது; ‘பெயல்செபூப்’ என்பது மரபில் பரிச்சயமான மாற்று வடிவம்.
lexical_decisions:
- source_word: ἀρκετὸν
  choice: போதும்
  rationale: போதுமானது என்ற கருத்தை இயல்பான நவீனத் தமிழில் சுருக்கமாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: μαθητῇ
  choice: சீடன்
  rationale: வெறும் கல்வி பயிலும் மாணவனைவிட, ஆசிரியரைப் பின்பற்றிக் கற்றுக்கொள்பவர் என்ற உறவுசார் நற்செய்தி நூல் பொருளைத் தக்கவைக்கிறது.
- source_word: ἵνα γένηται
  choice: ஆவது
  rationale: ἀρκετόν என்பதுடன் இணைந்துள்ள ஆகுதல்/ஒத்த நிலையை அடைதல் என்ற கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: διδάσκαλος
  choice: ஆசிரியர்
  rationale: μαθητής என்பதற்கு இயல்பான இணையாக இருந்து, பின்னர் வரும் κύριος என்பதிலிருந்து வேறுபாட்டைக் காக்கிறது.
- source_word: δοῦλος
  choice: அடிமை
  rationale: κύριος உடனான சமூகப் படிநிலை எதிரிணையில் கட்டுப்பட்ட கீழ்நிலையைத் தெளிவாகக் காட்டுகிறது; வேலைக்காரன் என்ற மென்மையான சொல்லைவிட மூலத்தின் வலிமையைப் பேணுகிறது.
- source_word: κύριος
  choice: எஜமான்
  rationale: இங்கு கிறிஸ்துவைப் பற்றிய பட்டமாக அல்லாமல் அடிமைக்கு அதிகாரமுள்ளவர் என்ற குடும்பச் சமூகப் பொருளில் வருகிறது.
- source_word: οἰκοδεσπότην
  choice: வீட்டின் எஜமான்
  rationale: ஒரு வீட்டார்மீது அதிகாரமுள்ளவரைக் குறிக்கும் கூட்டு சொல்லின் வீட்டையும் அதிகாரத்தையும் இரண்டையும் வெளிப்படுத்துகிறது.
- source_word: Βεελζεβοὺλ
  choice: பெயல்செபூல்
  rationale: SBLGNT கிரேக்க உரையிலுள்ள பெயர் வடிவத்தைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: ἐπεκάλεσαν
  choice: என்று அழைத்தார்கள்
  rationale: ஒருவருக்கு ஒரு பெயரைச் சூட்டி அல்லது அந்தப் பெயரால் குறிப்பிட்டார்கள் என்ற சூழல்சார் பொருளை நேரடியாக வழங்குகிறது.
- source_word: πόσῳ μᾶλλον
  choice: இன்னும் எவ்வளவு அதிகமாக
  rationale: குறைந்ததிலிருந்து அதிகத்திற்குச் செல்லும் வாதத்தின் வலிமையையும் வினாவடிவத்தையும் காக்கிறது.
- source_word: οἰκιακοὺς
  choice: அவனுடைய வீட்டார்
  rationale: அடிமைகளை மட்டும் அல்லாமல் வீட்டைச் சேர்ந்த அனைவரையும் உள்ளடக்கும் சொல்லின் பரந்த பொருளையும் οἰκοδεσπότης உடனான சொல் தொடர்பையும் காக்கிறது.
theological_decisions:
- issue: குடும்பச் சமூக உவமையில் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: எஜமான்
  alternative: ஆண்டவர்
  rationale: உடனடி இணை δοῦλος என்பதும் தொடர்ந்து வரும் வீட்டின் எஜமான்/வீட்டார் உருவகமும் சமூக அதிகார உறவைக் குறிக்கின்றன; இவ்விடத்தில் வெளிப்படையாக இல்லாத கிறிஸ்தியல் பட்டப்பொருளைச் சேர்க்காமல் இருக்கிறது.
- issue: δοῦλος என்பதன் சமூக நிலை
  choice: அடிமை
  alternative: வேலைக்காரன்
  rationale: எஜமானுக்கு எதிரிணையாக வரும் இந்தச் சூழலில் கட்டுப்பட்ட கீழ்நிலை முக்கியமானது; ஆகவே மூலச்சொல்லின் கடினமான சமூக உண்மையை மென்மையாக்கவில்லை.
- issue: இறுதிக் கூற்றிலுள்ள விடுபட்ட வினை
  choice: அப்படி அழைப்பார்கள் என்று வெளிப்படையாக நிறைவு செய்தல்
  alternative: அவனுடைய வீட்டாரை இன்னும் எவ்வளவு அதிகமாக என்று விடுபட்ட அமைப்பைப் பேணுதல்
  rationale: கிரேக்கத்தில் முந்தைய வினை இயல்பாகப் புரிந்துகொள்ளப்படும் விடுபட்ட அமைப்பு உள்ளது. தமிழில் பொருள் தெளிவாகவும் சொல்லாட்சியின் வாத வலிமை இயல்பாகவும் இருக்க, அதே வினையை மறைமுகமாக அப்படி அழைப்பார்கள் என்று நிறைவு செய்கிறது; புதிய கருத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சீடன்–ஆசிரியர்’, ‘அடிமை–எஜமான்’, ‘வீட்டின் எஜமான்–வீட்டார்’ ஆகிய மூல எதிரிணைகளும் சொல் தொடர்புகளும் தெளிவாகப் பேணப்பட்டுள்ளன. இறுதி ஒப்புமையின் வலிமையைத் தமிழில் இயல்பாக வெளிப்படுத்த வியப்புக்குறி பயன்படுத்தப்பட்டுள்ளது.
