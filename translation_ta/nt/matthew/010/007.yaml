id: MAT.10.7
reference: Matthew 10:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πορευόμενοι δὲ κηρύσσετε λέγοντες ὅτι Ἤγγικεν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/007.yaml
  text: And as you go[a], proclaim, saying[c][b], ‘The kingdom of heaven has drawn near.’
translation:
  language: ta
  text: நீங்கள் போகும்போது, “பரலோக அரசாட்சி[a] நெருங்கி வந்துள்ளது[b]” என்று அறிவியுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மத்தேயு வழக்கமாக “பரலோக அரசாட்சி” என்கிறார்; மற்ற நற்செய்தி நூல்கள் பல இடங்களில் “தேவனுடைய அரசாட்சி” என்கின்றன.
    reason: cross_reference
  - marker: b
    text: “அருகில் வந்துவிட்டது” அல்லது “நெருங்கியுள்ளது” என்றும் மொழிபெயர்க்கலாம். கிரேக்க நிறைவுக்கால வினை, வந்தடைந்த நெருக்கம் தொடர்ந்து நிலவுவதை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευόμενοι δὲ
  choice: நீங்கள் போகும்போது
  rationale: நிகழ்காலப் பங்கேற்புவினை, முதன்மைக் கட்டளையோடு நிகழும் செயலைக் குறிக்கிறது. δὲ இங்கு மென்மையான இணைப்புச்சொல்; தமிழில் தனியே மொழிபெயர்க்காமல் வாக்கிய ஓட்டத்தில் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: κηρύσσετε λέγοντες
  choice: என்று அறிவியுங்கள்
  rationale: κηρύσσετε பொதுவெளியில் அதிகாரப்பூர்வமாக அறிவிப்பதைக் குறிக்கிறது; λέγοντες அறிவிக்க வேண்டிய செய்தியை அறிமுகப்படுத்துகிறது. தமிழில் மேற்கோளுக்குப் பின் “என்று அறிவியுங்கள்” என்பது இரண்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: பரலோக அரசாட்சி
  rationale: βασιλεία அரசரின் ஆட்சியையும் அவரது அரசின் பரப்பையும் குறிக்கக்கூடும். “அரசாட்சி” அதன் ஆட்சிசார் பொருளைத் தெளிவாக வைத்திருக்கிறது; “பரலோக” என்பது மத்தேயுவின் தனித்துவமான τῶν οὐρανῶν என்ற சொல்லாட்சியை, “தேவனுடைய” என்று ஒத்திசைக்காமல் பாதுகாக்கிறது.
- source_word: Ἤγγικεν
  choice: நெருங்கிவந்திருக்கிறது
  rationale: கிரேக்க நிறைவுக்கால வினை, நெருங்கி வந்த நிகழ்வும் அதன் தொடரும் விளைவும் சேர்ந்த பொருளைத் தருகிறது. இத்தமிழ் வடிவம் வெறும் “அருகில் இருக்கிறது” என்பதைக் காட்டிலும் அந்த அம்சத்தை நன்கு பாதுகாக்கிறது.
theological_decisions:
- issue: “பரலோக அரசாட்சி” என்பதன் பொருள்
  choice: மத்தேயுவின் “பரலோகங்களின் அரசாட்சி” என்ற தனித்துவமான சொல்லாட்சி “பரலோக அரசாட்சி” என்று தக்கவைக்கப்பட்டது.
  alternative: தேவனுடைய அரசாட்சி; இறையாட்சி
  rationale: இணையான நற்செய்திப் பகுதிகளோடு ஒத்திசைக்காமல் மூலத்தின் சொற்களைப் பாதுகாக்கிறது. “அரசாட்சி” ஆட்சி என்ற இயக்கநிலையை வெளிப்படுத்தினாலும், அரசருக்குரிய ஆட்சியின் விரிந்த பொருளை முன்கூட்டியே ஒரு கோட்பாட்டுக்குள் சுருக்கவில்லை.
- issue: Ἤγγικεν என்பதன் காலவினை அம்சம்
  choice: நெருங்கிவந்திருக்கிறது
  alternative: அருகில் இருக்கிறது; நெருங்கிவிட்டது
  rationale: நெருக்கம் வந்தடைந்து தற்போது விளைவுடன் நிலைக்கிறது என்ற நிறைவுக்காலச் சாயலைப் பாதுகாக்கிறது; அரசாட்சியைப் பற்றிய விரிவான இறையியல் காலவரிசையை இதற்கு மேல் தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. “பிரசங்கியுங்கள்” என்ற திருச்சபைச் சார்ந்த சொல்லைவிட “அறிவியுங்கள்” பொதுவெளி அறிவிப்பின் பொருளை இயல்பாகத் தருகிறது. மேற்கோள் அமைப்பு λέγοντες என்பதையும் தமிழின் இயல்பான தொடரமைப்பில் பாதுகாக்கிறது.
