source:
  edition: SBLGNT
  text: καὶ ὃς οὐ λαμβάνει τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθεῖ ὀπίσω μου, οὐκ ἔστιν μου ἄξιος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/038.yaml
  text: And whoever does not take up his cross and follow after me is not worthy of me[a][b].
translation:
  language: ta
  text: தன் சிலுவையை எடுத்துக்கொண்டு எனக்குப் பின்னால் வராத எவனும் எனக்குத் தகுதியானவன் அல்ல.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தன் சிலுவை” என்று ஒருமையில் கூறப்பட்டிருந்தாலும், இது பொதுப்பொருளில் ஒவ்வொரு சீடரும் அவரவருடைய சிலுவையை எடுத்துக்கொள்ள வேண்டும் என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “எனக்குப் பின்னால் வருதல்” என்பதை “என்னைப் பின்பற்றுதல்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கம் இன்னும் வெளிப்படையாக “எனக்குப் பின்னால்” என்று கூறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: எவனும்
  rationale: இங்கு ஆண்பால் ஒருமை வடிவில் பொதுவாக ஒவ்வொருவரையும் குறிக்கும் தொடர்புப்பெயரின் நிபந்தனைத் தன்மையை இது இயல்பாக வெளிப்படுத்துகிறது.
- source_word: λαμβάνει
  choice: எடுத்துக்கொண்டு
  rationale: சிலுவையுடன் வரும் இச்சொல் வெறுமனே பெறுவதைக் காட்டாமல், அதைத் தானாக ஏற்றுச் சுமக்க முனைவதைச் சுட்டுகிறது.
- source_word: σταυρὸν
  choice: சிலுவையை
  rationale: ரோமரின் மரணதண்டனைக் கருவியையும், மத்தேயுவில் சீடத்துவத்தோடு அதற்குள்ள வலுவான தொடர்பையும் மிகையின்றி காக்கும் வழக்கமான நேரடி சொல்.
- source_word: αὐτοῦ
  choice: தன்
  rationale: எழுவாயையே திரும்பச் சுட்டும் கிரேக்க ஆண்பால் ஒருமையின் பொருளைத் தமிழில் இயல்பாகக் காக்கிறது; இங்கு அது பொதுப்பொருளில் ஒவ்வொரு சீடரையும் குறிக்கிறது.
- source_word: ἀκολουθεῖ ὀπίσω μου
  choice: எனக்குப் பின்னால் வராத
  rationale: ἀκολουθέω உடன் வரும் ὀπίσω, இயேசுவுக்குப் பின்னால் சீடனாகச் செல்வதை வெளிப்படையாகக் காட்டுகிறது; எளிய ‘என்னைப் பின்பற்றாத’ என்பதைக் காட்டிலும் மூலத்தின் இடவுருவகத்தை இது காக்கிறது.
- source_word: ἄξιος
  choice: தகுதியானவன்
  rationale: தகுதி அல்லது பொருத்தம் குறித்த வசனத்தின் கடுமையான மதிப்பீட்டை இயல்பான தமிழில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: μου ἄξιος
  choice: எனக்குத் தகுதியானவன்
  rationale: ἄξιος உடன் வரும் முதலாம் நபர் உரிமை வேற்றுமையைச் சுருக்கமாகக் காக்கிறது; ‘என்னைச் சேர்ந்திருக்கத் தகுதியானவன்’ போன்ற விளக்க விரிவைத் தவிர்க்கிறது.
theological_decisions:
- issue: சிலுவையை எடுத்துக்கொள்வது என்ற சீடத்துவக் கூற்று
  choice: ‘தன் சிலுவையை எடுத்துக்கொண்டு’ என்ற தெளிவான உருவகத்தை அப்படியே வைத்தல்
  alternative: ‘துன்பத்தை ஏற்றுக்கொண்டு’ அல்லது ‘தன்னை மறுத்து’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: மூலம் சிலுவை என்ற வரலாற்று மற்றும் இறையியல் நிறைவுள்ள உருவகத்தையே பயன்படுத்துகிறது. அதை பொதுவான துன்பம் அல்லது சுயமறுப்பு என்று மட்டும் குறுக்குவது அதன் தீவிரத்தையும் பொருள் வளத்தையும் குறைக்கும்.
- issue: αὐτοῦ என்ற ஆண்பால் ஒருமையின் பொதுப்பயன்பாடு
  choice: தமிழில் எழுவாயைத் திரும்பச் சுட்டும் ‘தன்’ என்பதையும், பொதுப்பொருளைக் கொண்ட ‘எவனும்’ என்பதையும் பயன்படுத்தல்
  alternative: பன்மை அல்லது பாலினக் குறியீடற்ற விளக்க வாக்கியமாக மாற்றுதல்
  rationale: கிரேக்கத்தின் பிரதிநிதித்துவ ஆண்பால் ஒருமையை இயன்றவரை காக்கும் அதேவேளையில், ‘தன்’ என்பது தமிழில் இயல்பாக ஒவ்வொருவருடைய சொந்தச் சிலுவையைச் சுட்டுகிறது. பொதுப்பொருள் அடிக்குறிப்பில் தெளிவாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வசனத்தின் கடுமையான, கண்ணியமான தொனியைத் தக்கவைத்தும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘எவனும்/தகுதியானவன்’ என்பது மூலத்தின் ஆண்பால் ஒருமை பொதுப்பயன்பாட்டை பிரதிபலிக்கிறது; அது ஆண்களை மட்டும் குறிக்கவில்லை.
