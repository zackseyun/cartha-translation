source:
  edition: SBLGNT
  text: ἦλθον γὰρ διχάσαι ἄνθρωπον κατὰ τοῦ πατρὸς αὐτοῦ καὶ θυγατέρα κατὰ τῆς μητρὸς αὐτῆς καὶ νύμφην κατὰ τῆς πενθερᾶς αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/035.yaml
  text: For I came to set a man against his father[a], and a daughter against her mother, and a daughter-in-law against her mother-in-law[b],
translation:
  language: ta
  text: ஏனெனில், ஒரு மனிதனை அவனுடைய தந்தைக்கு எதிராகவும், ஒரு மகளை அவளுடைய தாய்க்கு எதிராகவும், ஒரு மருமகளை[b] அவளுடைய மாமியாருக்கு எதிராகவும் நிறுத்தவே[a] நான் வந்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எதிராக நிறுத்த’ என்பதற்குப் பதிலாக, ‘பிரிக்க’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்க வினைச்சொல் பிளவைச் சுட்டுகிறது, தொடர்ந்து வரும் ‘எதிராக’ என்ற தொடர்கள் உறவுசார் எதிர்ப்பை வெளிப்படுத்துகின்றன.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்க νύμφη சில சூழல்களில் ‘மணமகள்’ என்றும் பொருள்படும்; இங்கு ‘மாமியார்’ என்பதுடன் இணைந்து வருவதால் ‘மருமகள்’ என்று பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: நான் வந்தேன்
  rationale: இறந்தகால வினை வடிவம் இங்கு இயேசுவின் வருகையையும் பணியையும் குறிக்கிறது; தமிழில் எளிய இறந்தகாலம் இயல்பாக உள்ளது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் காரணவிளக்கத் தொடர்பைப் பாதுகாக்கிறது.
- source_word: διχάσαι
  choice: பிரிக்கவே
  rationale: ‘பிளவுபடுத்துதல்/பிரித்தல்’ என்ற அடிப்படைப் பொருளைப் பாதுகாக்கிறது; தொடர்ந்து வரும் ‘எதிராக’ தொடர்கள் குடும்ப உறவுகளில் உருவாகும் எதிர்ப்பைத் தெளிவாக்குகின்றன.
- source_word: ἄνθρωπον
  choice: ஒரு மகனை
  rationale: இங்கு தந்தையுடன் எதிர்நிறுத்தப்படும் ஆண் குடும்ப உறுப்பினரைக் குறிக்கிறது; மீகா 7:6-ஐ ஒத்த குடும்ப உறவு அமைப்பில் ‘மகன்’ என்பது தமிழில் இயல்பாகவும் சூழலுக்கு ஏற்றவாறும் உள்ளது.
- source_word: κατὰ τοῦ πατρὸς αὐτοῦ
  choice: அவனுடைய தந்தைக்கு எதிராக
  rationale: κατά + genitive காட்டும் எதிர்நிலையைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: θυγατέρα
  choice: ஒரு மகளை
  rationale: பெண்பால் ஒருமை உறவுப்பெயரின் நேரடியான தமிழ் இணை.
- source_word: κατὰ τῆς μητρὸς αὐτῆς
  choice: அவளுடைய தாய்க்கு எதிராக
  rationale: மீண்டும் வரும் எதிர்நிலை அமைப்பையும் பெண்பால் சுட்டையும் பாதுகாக்கிறது.
- source_word: νύμφην
  choice: ஒரு மருமகளை
  rationale: νύμφη சில சூழல்களில் ‘மணமகள்’ எனப் பொருள்பட்டாலும், πενθερά உடன் இணைக்கப்பட்டுள்ளதால் இங்கு ‘மருமகள்’ என்ற உறவுப் பொருள் தேவைப்படுகிறது.
- source_word: κατὰ τῆς πενθερᾶς αὐτῆς
  choice: அவளுடைய மாமியாருக்கு எதிராக
  rationale: மருமகளின் கணவனுடைய தாயைக் குறிக்கும் உறவுப்பெயரையும் எதிர்நிலையையும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: இயேசுவின் வருகையின் பிரிவுண்டாக்கும் தன்மை
  choice: குடும்ப உறுப்பினர்கள் ஒருவருக்கொருவர் எதிராக நிற்கும் அளவிலான பிளவைச் சொல்லின் கடுமையுடன் வெளிப்படுத்துதல்
  alternative: இது இயேசுவின்மீது கொண்ட பற்றினால் ஏற்படும் துன்புறுத்தல் என்று விளக்கிச் சொல்லுதல்
  rationale: கிரேக்க உரை குடும்ப எதிர்ப்பை நேரடியாகக் கூறுகிறது; அதன் இறையியல் பதற்றத்தைத் தணிக்காமலும், இயேசு குடும்பப் பகையை இறுதி நன்மையாக விரும்புகிறார் என்ற கூடுதல் முடிவைச் சேர்க்காமலும் மொழிபெயர்க்க வேண்டும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. மீண்டும் வரும் ‘எதிராகவும்’ என்ற அமைப்பு மூலத்தின் ஒத்திசைவையும் வலியுறுத்தலையும் பாதுகாக்கிறது; ‘பிரிக்கவே’ நோக்கத்தைக் குறிக்கும் infinitive-ஐச் சுருக்கமாக வெளிப்படுத்துகிறது.
