  text: Πᾶς οὖν ὅστις ὁμολογήσει ἐν ἐμοὶ ἔμπροσθεν τῶν ἀνθρώπων, ὁμολογήσω κἀγὼ ἐν αὐτῷ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/032.yaml
  text: Therefore everyone who confesses me before men[b][a], I also will confess before my Father who is in heaven.
translation:
  language: ta
  text: ஆகவே, மனிதர்கள் முன்பாக என்னை அறிக்கையிடுவோர் ஒவ்வொருவரையும்[a], பரலோகத்தில் இருக்கிற என் தந்தையின் முன்பாக நானும் அறிக்கையிடுவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு கிரேக்கத்தில் சொற்சார்ந்து ‘அவரில்’ அல்லது ‘அவரைக் குறித்து’ உள்ளது; தமிழில் அந்த நபரை அறிக்கையிடுவேன் என்று இயல்பாகத் தரப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: ஆகவே, ... ஒவ்வொருவரையும்
  rationale: Πᾶς ... ὅστις என்பதன் பொதுமைப்படுத்தும், அனைவரையும் உள்ளடக்கும் பொருளை இயல்பான தமிழில் ‘ஒவ்வொருவரையும்’ எனத் தருகிறது; οὖν முந்தைய சூழலுடனான முடிவுறு தொடர்பைக் காட்ட ‘ஆகவே’ எனப் பாதுகாக்கப்படுகிறது.
- source_word: ὁμολογήσει
  choice: அறிக்கையிடுகிற
  rationale: ὁμολογέω இங்கு இயேசுவை வெளிப்படையாக ஏற்றுக்கொண்டு அறிவிப்பதைக் குறிக்கிறது. ‘அறிக்கையிடு’ அதன் பொது மற்றும் வாய்மொழித் தன்மையைத் தக்கவைக்கிறது; வசனத்தின் இரண்டாம் பாதியிலும் அதே வினை பயன்படுத்தப்படுகிறது.
- source_word: ἐν ἐμοὶ
  choice: என்னை
  rationale: கிரேக்கத்தில் ἐν இருந்தாலும், ὁμολογέω உடனான இக்கட்டமைப்பு இயேசுவையே அறிக்கையின் பொருளாகக் காட்டுகிறது. தமிழில் ‘என்னில் அறிக்கையிடு’ இயல்பற்றதால் ‘என்னை அறிக்கையிடு’ என வழங்கப்படுகிறது.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: மனிதர்களுக்கு முன்பாக
  rationale: ἔμπροσθεν என்பது முன்னிலையில் அல்லது முன்பாக என்பதைக் குறிக்கிறது. ἀνθρώπων இங்கு பொதுவாக மனிதர்களைக் குறிப்பதால், பாலினக் குழப்பமில்லாத இயல்பான தமிழ் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: ὁμολογήσω κἀγὼ
  choice: நானும் அறிக்கையிடுவேன்
  rationale: முதல் ὁμολογέω வினையுடனான நேரடியான இணைப்பைத் தக்கவைக்க அதே தமிழ்ச் சொல் மீண்டும் பயன்படுத்தப்படுகிறது; κἀγώ-வின் வலியுறுத்தலை ‘நானும்’ தெரிவிக்கிறது.
- source_word: ἐν αὐτῷ
  choice: அவரையும்
  rationale: முந்தைய ἐν ἐμοί-க்கு இணையான பரஸ்பரக் கட்டமைப்பில், அந்த நபரையே இயேசு அறிக்கையிடுவார் என்பது பொருள். பாலினம் குறிப்பிடப்படாத ஒருமை மனிதரைக் குறிக்க மரியாதை ஒருமையான ‘அவரையும்’ இயல்பாக உள்ளது; கிரேக்கத்தின் சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: பரலோகத்தில் இருக்கிற என் தந்தைக்கு முன்பாக
  rationale: மத்தேயுவில் வழக்கமான இச்சொற்றொடரை நவீன, தெளிவான தமிழில் தருகிறது. οὐρανοῖς கிரேக்கத்தில் பன்மையாக இருந்தாலும், ‘பரலோகம்’ தமிழ் வேதாகம நடையில் இயல்பான இடக்குறிப்பு.
theological_decisions:
- issue: இயேசுவை மனிதர்கள்முன் வெளிப்படையாக ஏற்றறிவிப்பதும், அதற்கு இணையாக இயேசு தந்தையின் முன் அந்த நபரை ஏற்றறிவிப்பதும்
  choice: பரஸ்பர அறிக்கையிடுதலாக வசனத்தை நேரடியாக மொழிபெயர்த்தல்
  alternative: இதை இறுதி நியாயத்தீர்ப்பில் நிகழும் சட்டவியல் அங்கீகாரமாக மட்டும் அல்லது தற்போதைய சீடத்துவ மொழியாக மட்டும் விளக்குதல்
  rationale: வசனம் தந்தையின் முன் நிகழும் இயேசுவின் பதிலளிக்கும் அறிக்கையை உறுதிப்படுத்துகிறது; ஆனால் அதன் காலத்தையோ இரட்சிப்பியல் செயல்முறையையோ இங்கே தனியாக வரையறுப்பதில்லை. எனவே அந்தத் தெய்வவியல் திறந்தநிலை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘அறிக்கையிடு’ என்ற சொல் வசனத்தின் இரு பாதிகளிலும் உள்ள ὁμολογέω இணைப்பைப் பாதுகாக்கிறது. பிரதான உரையில் [a] குறி அதற்குரிய சொல்லுக்குப் பின் வைக்கப்பட்டுள்ளது.
