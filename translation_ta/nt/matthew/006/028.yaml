source:
  edition: SBLGNT
  text: καὶ περὶ ἐνδύματος τί μεριμνᾶτε; καταμάθετε τὰ κρίνα τοῦ ἀγροῦ πῶς ⸂αὐξάνουσιν· οὐ κοπιῶσιν οὐδὲ νήθουσιν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/028.yaml
  text: 'And why are you anxious about clothing? Consider the lilies of the field[a], how they grow: they do not labor[c][b], nor do they spin.'
translation:
  language: ta
  text: உடையைப் பற்றி ஏன் கவலைப்படுகிறீர்கள்? வயல்வெளியில் உள்ள லில்லி மலர்கள் எவ்வாறு வளருகின்றன என்பதைக் கவனித்துப் பாருங்கள்[a]. அவை உழைப்பதும் இல்லை, நூல் நூற்பதும் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘லில்லி மலர்கள்’ என்பதற்கான கிரேக்கச் சொல்லை இங்கு பொதுவாக ‘வயல்வெளி மலர்கள்’ அல்லது ‘காட்டு மலர்கள்’ என்றும் சிலர் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ ἐνδύματος
  choice: உடையைப் பற்றி
  rationale: ἔνδυμα இங்கு ஒரு குறிப்பிட்ட ஆடையைக் காட்டிலும் உடை என்ற பொதுவகையைக் குறிக்கிறது; περί என்பதன் தொடர்புப் பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τί μεριμνᾶτε
  choice: ஏன் கவலைப்படுகிறீர்கள்?
  rationale: μεριμνάω இச்சூழலில் சாதாரண அக்கறையை அல்ல, தேவைகளைப் பற்றிய மனக்கவலையைக் குறிக்கிறது; τί இங்கு காரணம் கேட்கும் வினாவாக இயல்பாக ‘ஏன்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: καταμάθετε
  choice: கவனித்துப் பாருங்கள்
  rationale: இந்த இறைச்சொல் உன்னிப்பாகக் கவனித்து உணரும்படி அழைக்கிறது. ‘கவனித்துப் பாருங்கள்’ என்பது பார்வையிடுதலையும் சிந்தித்தறிதலையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: τὰ κρίνα τοῦ ἀγροῦ
  choice: வயல்வெளியின் அல்லி மலர்கள்
  rationale: κρίνα என்பதன் நேரடியான பொருள் ‘அல்லி மலர்கள்’; τοῦ ἀγροῦ அவை வயல்வெளியைச் சேர்ந்தவை என்பதைக் குறிக்கிறது. இதற்கு இருக்கக்கூடிய விரிவான பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: πῶς αὐξάνουσιν
  choice: எப்படி வளருகின்றன
  rationale: αὐξάνω இங்கு தாவரங்களின் இயற்கையான வளர்ச்சியைக் குறிக்கிறது; ‘வளருகின்றன’ தெளிவான, இயல்பான இணைச்சொல்.
- source_word: οὐ κοπιῶσιν
  choice: அவை உழைப்பதும் இல்லை
  rationale: κοπιάω கடினமாக உழைப்பதைக் குறிக்கிறது. ‘உழைப்பதும் இல்லை’ அடுத்துவரும் இணை அமைப்புடன் சுருக்கமாகவும் இயல்பாகவும் பொருந்துகிறது.
- source_word: οὐδὲ νήθουσιν
  choice: நூல் நூற்பதும் இல்லை
  rationale: νήθω என்பது நூல் அல்லது இழை நூற்பதைக் குறிக்கிறது. தமிழில் ‘நூற்பது’ மட்டும் தெளிவற்றிருக்கக்கூடும் என்பதால் ‘நூல் நூற்பது’ என வெளிப்படுத்தப்படுகிறது.
theological_decisions:
- issue: μεριμνάω என்ற சொல்லின் பொருள்—அக்கறையா அல்லது மனக்கவலையா
  choice: கவலைப்படுகிறீர்கள்
  alternative: அக்கறைகொள்கிறீர்கள்
  rationale: சுற்றியுள்ள போதனையில் பொருள் தேவைகளைப் பற்றிய பதற்றமான கவலையே எதிர்கொள்ளப்படுகிறது. அதேவேளையில், இந்தத் தேர்வு பொறுப்பான முன்னேற்பாடு அனைத்தையும் கண்டிப்பதாக வசனத்தை விரிவுபடுத்தாது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதை பன்மை வினைமுற்றுகளுடன் இயல்பான போதனை நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கத்தின் சுருக்கமான இணை அமைப்பு ‘உழைப்பதும் இல்லை, நூல் நூற்பதும் இல்லை’ என்று பாதுகாக்கப்பட்டுள்ளது.
