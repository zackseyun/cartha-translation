source:
  edition: SBLGNT
  text: σοῦ δὲ ποιοῦντος ἐλεημοσύνην μὴ γνώτω ἡ ἀριστερά σου τί ποιεῖ ἡ δεξιά σου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/003.yaml
  text: But when you give to the needy[a], do not let your left hand know what your right hand is doing,
translation:
  language: ta
  text: ஆனால் நீ தேவையுள்ளவர்களுக்குக் கொடுக்கும்போது[a], உன் வலது கை செய்வது என்னவென்று உன் இடது கைக்குத் தெரியாதிருக்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீ தருமம் செய்யும்போது”; கிரேக்கச் சொல் ஏழைகள் அல்லது தேவையுள்ளவர்களுக்குச் செய்யும் அறக்கொடையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: σοῦ δὲ ποιοῦντος
  choice: ஆனால் நீ ... கொடுக்கும்போது
  rationale: δέ முந்தைய அறிவுறுத்தலுடன் உள்ள எதிர்மறை வேறுபாட்டைக் குறிக்கிறது; பிறவேற்றுமைத் தனிநிலை அமைப்பை நவீன தமிழில் இயல்பாக நிபந்தனைக் காலத் தொடராக வழங்குகிறது. ἐλεημοσύνην என்பதுடன் வரும் ποιέω இங்கு அறச்செயலாகக் கொடுப்பதைக் குறிக்கிறது.
- source_word: ἐλεημοσύνην
  choice: தேவையுள்ளவர்களுக்குக் கொடுக்கும்போது
  rationale: இந்தக் கிரேக்கச் சொல் ஏழைகள் அல்லது தேவையுள்ளவர்களுக்குச் செய்யும் தரும உதவியைக் குறிக்கிறது. இலக்குப் பெறுநரையும் செயற்பாட்டையும் வெளிப்படுத்தும் இச்சொற்றொடர் நவீன தமிழில் தெளிவாக உள்ளது; மாற்றாகிய ‘தருமம் செய்யும்போது’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: μὴ γνώτω
  choice: தெரியாதிருக்கட்டும்
  rationale: μή உடன் வரும் மூன்றாம் நபர் கட்டளை வடிவத்தின் தடையைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது; கைகளின் ஆளுருவகத்தையும் பாதுகாக்கிறது.
- source_word: ἡ ἀριστερά σου
  choice: உன் இடது கை
  rationale: மூலத்தின் நேரடியான, நினைவில் நிற்கும் உருவகத்தைப் பாதுகாக்கும் இயல்பான தமிழ்.
- source_word: τί ποιεῖ ἡ δεξιά σου
  choice: உன் வலது கை செய்வது என்னவென்று
  rationale: ποιεῖ நிகழ்காலச் செயலைக் குறிக்கிறது. தமிழ் மறைமுக வினா அமைப்பில் ‘செய்வது என்னவென்று’ மூலத்தின் பொருளையும் உருவகத்தையும் இயல்பாகக் கடத்துகிறது.
theological_decisions:
- issue: இடது கையும் வலது கையும் பற்றிய கூற்றின் விளக்கம்
  choice: கொடுப்பதில் தன்னைக் காட்டிக்கொள்ளாத ஆழ்ந்த மறைவைக் கூறும் உருவகத்தை அப்படியே வைத்தல்
  alternative: பொதுவான தாழ்மைக்கான மிகைப்படுத்தல் என்று விளக்கிப் பெயர்த்தல்; அல்லது வெளிப்படையாகச் செய்யப்படும் எல்லா உதவியையும் முற்றிலும் தடைசெய்வதாகக் குறுக்குதல்
  rationale: வசனம் ஆளுருவகத்தையும் மிகைப்படுத்தலையும் பயன்படுத்துகிறது. மொழிபெயர்ப்பு அதை விளக்கவுரையாகத் தட்டையாக்காமல் பாதுகாக்கிறது; இதனால் இயேசுவின் மறைவான தாராளத்திற்கான வலியுறுத்தல் நிலைத்திருக்கிறது, ஆனால் உரை கூறுவதைவிடக் கடுமையான கோட்பாட்டு முடிவு திணிக்கப்படுவதில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் இயல்பான, கண்ணியமான நடை. ‘தெரியாதிருக்கட்டும்’ என்பது வேதாகமக் கூற்றின் செறிவையும் கட்டளைத் தொனியையும் காக்கிறது; தொழில்நுட்பமான அல்லது சமயப் பிரிவுசார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
