id: MAT.6.19
reference: Matthew 6:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Μὴ θησαυρίζετε ὑμῖν θησαυροὺς ἐπὶ τῆς γῆς, ὅπου σὴς καὶ βρῶσις ἀφανίζει, καὶ ὅπου κλέπται διορύσσουσιν καὶ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/019.yaml
  text: Do not store up for yourselves treasures on earth[a], where moth and decay destroy[b], and where thieves break in and steal.
translation:
  language: ta
  text: பூமியில் உங்களுக்கென்று செல்வங்களைச் சேர்த்துவைக்காதீர்கள். அங்கே அந்துப்பூச்சியும் சிதைவும்[a] அவற்றை அழிக்கின்றன; அங்கே திருடர்கள் உடைத்துக்கொண்டு உள்ளே புகுந்து[b] திருடுகின்றனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘துரு’. கிரேக்கச் சொல் உலோகத்தில் ஏற்படும் துருவை மட்டுமல்லாமல், பொருளை அரித்து அழிக்கும் சிதைவையும் பரந்த வகையில் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘தோண்டித் துளைக்கிறார்கள்’. மண் செங்கற்களால் கட்டப்பட்ட சுவர்களைத் திருடர்கள் துளைத்து நுழைவதை இது குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: Μὴ θησαυρίζετε
  choice: சேர்த்துவைக்காதீர்கள்
  rationale: μή உடன் வரும் நிகழ்காலக் கட்டளை ஒரு தடையைத் தெரிவிக்கிறது. ‘சேர்த்துவைக்காதீர்கள்’ என்பது செல்வத்தைக் குவித்துப் பாதுகாப்பதை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὑμῖν
  choice: உங்களுக்கென்று
  rationale: தங்களுடைய உடைமையாக அல்லது பயனுக்காகச் சேர்ப்பது என்ற தற்சுட்டுப் பொருளைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: θησαυροὺς
  choice: செல்வங்களை
  rationale: பணம் மட்டுமல்லாமல் மதிப்புமிக்க உலக உடைமைகளையும் உள்ளடக்கும் பரந்த பொருளை இயல்பாகத் தருகிறது.
- source_word: ἐπὶ τῆς γῆς
  choice: பூமியில்
  rationale: அடுத்த வசனத்தில் வரும் விண்ணுலக இடத்துக்கு எதிரான பூமிக்குரிய இடத்தைக் குறிக்கிறது.
- source_word: σὴς
  choice: அந்துப்பூச்சி
  rationale: சேமித்து வைக்கப்பட்ட ஆடைகளையும் பொருட்களையும் அரிக்கும் பூச்சியைத் துல்லியமாகக் குறிக்கிறது.
- source_word: βρῶσις
  choice: சிதைவு
  rationale: இச்சொல் ‘தின்னுதல்/அரித்தல்’ என்பதிலிருந்து அழிவு அல்லது தேய்மானம் என்ற பரந்த பொருளைக் கொண்டது; உலோகத் துருவை மட்டும் குறிப்பதாகக் கட்டுப்படுத்தாமல் ‘சிதைவு’ அதை வெளிப்படுத்துகிறது.
- source_word: ἀφανίζει
  choice: அழிக்கின்றன
  rationale: மறையச்செய்தல் அல்லது பாழாக்குதல் என்ற வினையின் விளைவைச் சுருக்கமாகத் தருகிறது.
- source_word: διορύσσουσιν
  choice: உடைத்துக்கொண்டு உள்ளே புகுந்து
  rationale: சொல்லுக்குச் சொல் ‘தோண்டித் துளைத்தல்’ என்றாலும், வீட்டுச் சுவரைத் துளைத்துத் திருடர்கள் நுழைவதன் செயற்பொருளை நவீனத் தமிழில் இயல்பாகக் கூறுகிறது.
- source_word: κλέπτουσιν
  choice: திருடுகின்றனர்
  rationale: திருடுதல் என்ற வினையின் நேரடியான தமிழ் இணைச்சொல்.
theological_decisions:
- issue: γῆ என்பதன் இடப்பொருள்
  choice: பூமியில்
  alternative: உலகத்தில்
  rationale: உடனடிச் சூழலில் விண்ணுலகத்துடன் காணப்படும் இடம்சார் முரண்பாட்டைப் பாதுகாக்கிறது; உரையில் இல்லாத தனிப்பட்ட இறையியல் வேறுபாட்டைச் சேர்க்கவில்லை.
- issue: βρῶσις என்பதன் பொருள்
  choice: சிதைவு
  alternative: துரு
  rationale: ‘துரு’ என்பது சூழலில் சாத்தியமான பாரம்பரியப் பொருள்; ஆனால் கிரேக்கச் சொல் உலோக அரிப்பைவிடப் பரந்த அழிவையும் உட்கொள்ளுதலையும் குறிக்க முடியும். ஆகவே முதன்மை உரையில் ‘சிதைவு’ என்றும் மாற்றை அடிக்குறிப்பிலும் தருவது மூலத்தின் பொருள் அகலத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்கு விளங்கும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டது. கிரேக்கத்தில் இருமுறை வரும் ὅπου என்பதற்கேற்ப ‘அங்கே’ இருமுறை வைக்கப்பட்டு, பூமிக்குரிய செல்வத்தின் இருவகைப் பாதிப்புகளும் தெளிவாகப் பிரிக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறிகளும் அவை விளக்கும் சொற்றொடர்களின் உடனேயே இடப்பட்டுள்ளன.
