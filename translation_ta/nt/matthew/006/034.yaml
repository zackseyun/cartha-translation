source:
  edition: SBLGNT
  text: μὴ οὖν μεριμνήσητε εἰς τὴν αὔριον, ἡ γὰρ αὔριον μεριμνήσει ⸀αὑτῆς· ἀρκετὸν τῇ ἡμέρᾳ ἡ κακία αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/034.yaml
  text: Therefore do not worry about tomorrow[a], for tomorrow will worry about itself. Each day has enough trouble of its own.
translation:
  language: ta
  text: ஆகவே, நாளையைப் பற்றிக் கவலைப்படாதீர்கள்; நாளை தன்னைப் பற்றித் தானே கவலைப்படும். ஒவ்வொரு நாளுக்கும் அதற்குரிய துன்பமே போதும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒவ்வொரு நாளுக்கும் அதற்குரிய தீமையே போதும்.” கிரேக்கச் சொல் “தீமை” என்றும் பொருள்படலாம்; இங்கு அது அந்த நாளின் துன்பம் அல்லது இடரைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεριμνήσητε
  choice: கவலைப்படாதீர்கள்
  rationale: இப்பகுதி முழுவதிலும் இந்த வினைச்சொல் பதற்றம் நிறைந்த கவலையைக் குறிக்கிறது. ‘கவலைப்படாதீர்கள்’ என்பது இயல்பான நவீனத் தமிழில் இதைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: εἰς τὴν αὔριον
  choice: நாளையைப் பற்றி
  rationale: கவலை எதை நோக்கியது என்பதைத் தமிழில் இயல்பாகக் காட்டும் சொல்லாக்கம்.
- source_word: ἡ αὔριον
  choice: நாளை
  rationale: கிரேக்கத்தில் ‘நாளை’ எழுவாயாக வந்து மனிதரைப்போல் செயல்படுவதாக உருவகப்படுத்தப்படுகிறது; தமிழிலும் இதை இயல்பாகப் பாதுகாக்கிறது.
- source_word: μεριμνήσει αὑτῆς
  choice: தன்னைப் பற்றித் தானே கவலைப்படும்
  rationale: முந்தைய ‘கவலைப்படாதீர்கள்’ என்பதுடனான சொல் தொடர்பையும், நாளை உருவகப்படுத்தப்படுவதையும், தற்சுட்டுப் பொருளையும் பாதுகாக்கிறது.
- source_word: ἀρκετὸν
  choice: போதும்
  rationale: ‘போதுமானது’ என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: τῇ ἡμέρᾳ
  choice: ஒவ்வொரு நாளுக்கும்
  rationale: நாள்தோறும் பொருந்தும் பொதுநெறியாக உள்ள பகிர்ந்தளிக்கும் பொருளைத் தெளிவுபடுத்துகிறது.
- source_word: κακία
  choice: துன்பம்
  rationale: இங்கு ஒழுக்கத் தீமையைவிட அன்றாட இடர், துயரம் அல்லது கஷ்டத்தைக் குறிக்கும் சூழல்சார் பொருளை வழங்குகிறது; ‘தொல்லை’ என்பதைவிட வேதனை மற்றும் இடரின் பரப்பைச் சிறப்பாகக் கொண்டுள்ளது.
- source_word: αὐτῆς
  choice: அதற்குரிய
  rationale: அந்தந்த நாளுக்குச் சொந்தமான துன்பம் என்ற உடைமைப் பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: கவலையைப் பற்றிய ஞானவாக்கில் κακία என்பதன் பொருள்
  choice: துன்பம்
  alternative: தீமை
  rationale: எதிர்காலத்தைப் பற்றிய கவலையே உடனடிச் சூழல். ஆகவே ஒவ்வொரு நாளின் இடர் அல்லது கஷ்டம் என்ற நடைமுறைப் பொருள் முதன்மை உரையில் இயல்பாகிறது. எனினும் ‘தீமை’ என்ற நேரடியான சொற்பொருள் உண்மையான மாற்றுப் புரிதலாக அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைப் பன்மை கட்டளையுடன், இயல்பும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘நாளை ... கவலைப்படும்’ என்ற மூலத்தின் உருவகப்படுத்தல் பாதுகாக்கப்பட்டுள்ளது; இறுதி வாக்கியம் தமிழில் இயல்பாக இருக்கும்போதே கிரேக்கத்தின் ‘ஒவ்வொரு நாளுக்கும் ... போதும்’ என்ற அமைப்பை நெருக்கமாகப் பின்பற்றுகிறது.
