  yaml_path: translation/nt/matthew/006/011.yaml
  text: Give us today our daily bread[a].
translation:
  language: ta
  text: எங்கள் அன்றாட அப்பத்தை இன்று எங்களுக்குத் தாரும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்களுக்கான இன்றைய அப்பத்தை,” “வரவிருக்கும் நாளுக்கான எங்கள் அப்பத்தை,” அல்லது “எங்களுக்குத் தேவையான அப்பத்தை.” ἐπιούσιον என்ற கிரேக்கப் பெயரடை அரிதானது; அதன் துல்லியமான பொருள் குறித்து கருத்து வேறுபாடு உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρτον (ἄρτος)
  choice: அப்பத்தை
  rationale: மூலச்சொல்லின் நேரடியான பொருள் ‘அப்பம்’. அது பொதுவாக உணவையோ வாழ்வாதாரத்தையோ குறிக்கக்கூடியதாக இருந்தாலும், மூலத்தின் தெளிவான உருவகத்தை முதன்மை உரையில் பாதுகாக்கிறது.
- source_word: ἡμῶν
  choice: எங்களுக்கு … தேவையான
  rationale: கிரேக்கத்தில் ‘எங்கள் அப்பம்’ என உரிமைப் பொருள் உள்ளது. இயல்பான நவீனத் தமிழில், அப்பம் எங்களுக்குரியது அல்லது எங்களுக்கு வேண்டியது என்ற பொருளை இவ்வமைப்பு வெளிப்படுத்துகிறது.
- source_word: ἐπιούσιον (ἐπιούσιος)
  choice: அன்றாடம் தேவையான
  rationale: அரிதானதும் பொருள் விவாதத்திற்குரியதுமான இச்சொல்லை, நாள்தோறும் தேவைப்படும் அப்பம் என்ற பரவலாக ஏற்கப்பட்ட பொருளில் இயல்பாக வழங்குகிறது; மற்ற முக்கிய வாய்ப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: δὸς (δίδωμι)
  choice: தாரும்
  rationale: கட்டளை வடிவத்தின் நேரடியான வேண்டுகோளை, ஜெபத்திற்கு ஏற்ற மரியாதையான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἡμῖν
  choice: எங்களுக்கு
  rationale: வினையின் மறைமுகச் செயப்படுபொருளை நேரடியாகக் காட்டுகிறது.
- source_word: σήμερον
  choice: இன்று
  rationale: கிரேக்கச் சொல்லின் காலக் குறிப்பைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
theological_decisions:
- issue: கர்த்தருடைய ஜெபத்தில் ἐπιούσιον என்பதன் பொருள்
  choice: அன்றாடம் தேவையான
  alternative: இன்றைக்கான; வரவிருக்கும் நாளுக்கான; உயிர்வாழத் தேவையான
  rationale: இச்சொல் இன்றைய தேவையையோ, வரவிருக்கும் நாளுக்கான தேவையையோ, வாழ்விற்கு இன்றியமையாத அளவையோ குறிக்கலாம். முதன்மை உரை இறைவனை நாள்தோறும் சார்ந்திருக்கும் வேண்டுதலை இயல்பாகத் தெரிவிக்கிறது; உறுதியாகத் தீர்க்க முடியாத பிற பொருள்கள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் ஜெபத்திற்குரிய கண்ணியமும் இணைந்த நடை. ‘தாரும்’ என்பது மரியாதையான நேரடி வேண்டுகோள்; ‘அப்பம்’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது.
