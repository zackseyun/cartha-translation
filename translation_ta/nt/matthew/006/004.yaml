id: MAT.6.4
reference: Matthew 6:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅπως ᾖ σου ἡ ἐλεημοσύνη ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸀κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/004.yaml
  text: so that your giving to the poor may be in secret[b][a]; and your Father who sees in secret will reward you.
translation:
  language: ta
  text: உன் ஏழைகளுக்குக் கொடுப்பது[a] மறைவில் இருக்கும்படி; மறைவில் காணும் உன் தந்தை உனக்குப் பலனளிப்பார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தர்மம் செய்வது.” கிரேக்கச் சொல் குறிப்பாக ஏழைகளுக்குக் கொடுப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உனக்குத் திருப்பிக் கொடுப்பார்.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως ᾖ
  choice: இருக்கும்படியாகச் செய்
  rationale: ὅπως உடன் வரும் நிகழ்கால இறைநிலை வினைச்சொல் நோக்கத்தைக் குறிக்கிறது. முந்தைய வசனத்தின் அறிவுறுத்தலைத் தொடர்ந்து வரும் அந்த நோக்கத் தொடர்பைத் தமிழில் இயல்பாக வெளிப்படுத்த இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: ἐλεημοσύνη
  choice: ஏழைகளுக்குக் கொடுப்பது
  rationale: இச்சொல் பொதுவான இரக்கத்தையோ எந்தவகை நன்கொடையையோ அல்ல, குறிப்பாக ஏழைகளுக்கு உதவியாகக் கொடுப்பதைக் குறிக்கிறது.
- source_word: ἐν τῷ κρυπτῷ
  choice: மறைவில்
  rationale: பிறர் பார்வைக்கு வெளிப்படாமல் இருப்பதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது; இரு கூறுகளிலும் உள்ள மூலமொழியின் மறைவு கருத்தும் பாதுகாக்கப்படுகிறது.
- source_word: ὁ πατήρ σου
  choice: உன் தந்தை
  rationale: மூலத்தில் ‘பரலோக’ என்ற அடைமொழி இல்லை; அருகிலுள்ள வசனங்களிலிருந்து அதைச் சேர்க்காமல், உள்ளபடியே மொழிபெயர்க்கப்பட்டது.
- source_word: ὁ βλέπων
  choice: காண்கிற
  rationale: பெயர்ச்சொல் தன்மையுள்ள நிகழ்காலப் பெயரெச்சம் தமிழில் இயல்பான உறவுத்தொடராக வழங்கப்பட்டது.
- source_word: ἀποδώσει σοι
  choice: உனக்குக் கைம்மாறு அளிப்பார்
  rationale: வினைச்சொல்லின் திருப்பிக் கொடுத்தல் அல்லது தக்க பதிலளித்தல் என்ற கருத்தை ‘கைம்மாறு அளிப்பார்’ பாதுகாக்கிறது; அந்தக் கைம்மாறின் வடிவத்தை வசனம் வரையறுக்காததால் மொழிபெயர்ப்பும் அதை வரையறுக்கவில்லை.
theological_decisions:
- issue: ἀποδώσει குறிக்கும் இறை கைம்மாற்றின் இயல்பு
  choice: உனக்குக் கைம்மாறு அளிப்பார்
  alternative: உனக்குப் பலன் அளிப்பார்
  rationale: கடவுள் மறைவான கொடைக்கு ஏற்ற பதில் அளிப்பார் என்ற வாக்குறுதியை இது வெளிப்படுத்துகிறது. அந்தக் கைம்மாறு இவ்வுலகத்துக்குரியதா, மறுமைக்குரியதா, பொருள்சார்ந்ததா, ஆவிக்குரியதா என்பதைத் தீர்மானிக்காமல் வசனத்தின் திறந்த தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிமையாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. வசனம் முந்தைய அறிவுறுத்தலைச் சார்ந்த நோக்கத்தொடராகத் தொடங்குவதால், தமிழில் முழுமையான வாக்கியமாக இயங்க ‘செய்’ பயன்படுத்தப்பட்டுள்ளது. ‘தந்தை’ என்பது மரியாதை ஒருமை வினையுடன் இணைக்கப்பட்டுள்ளது.
