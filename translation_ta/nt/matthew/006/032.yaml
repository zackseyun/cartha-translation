  text: For the Gentiles eagerly seek all these things; for your heavenly Father knows that you need all these things.
translation:
  language: ta
  text: ஏனெனில், யூதரல்லாத மக்கள் இவை அனைத்தையும் முனைப்புடன் நாடுகிறார்கள்[a][b]; ஏனெனில், இவை அனைத்தும் உங்களுக்குத் தேவை என்பதை உங்கள் பரலோகத் தந்தை அறிந்திருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: “பிற இனத்தார்” அல்லது “புறவினத்தார்.” கிரேக்கச் சொல் பொதுவாக “நாடுகள்” என்றும் பொருள்படலாம்; இங்கே அது யூதரல்லாத மக்களைக் குறிப்பதாகத் தெரிகிறது.'
    reason: alternative_reading
  - marker: b
    text: 'வேறு மொழிபெயர்ப்பு: “நாடுகிறார்கள்” அல்லது “தேடிக்கொண்டிருக்கிறார்கள்.” இவ்வினைச்சொல் முனைப்பான அல்லது தொடர்ச்சியான நாடுதலைக் குறிக்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: யூதரல்லாத மக்கள்
  rationale: இச்சூழலில் இயேசுவின் சீடர்களுக்கு மாறாக யூதரல்லாத மக்களைக் குறிக்கிறது. ‘புறவினத்தார்’ என்பதைவிட இது இன்றைய வாசகர்களுக்குத் தெளிவாகவும் இழிவுத் தொனி இல்லாமலும் உள்ளது.
- source_word: ἐπιζητοῦσιν
  choice: முனைப்புடன் நாடுகிறார்கள்
  rationale: ἐπιζητέω என்பதிலுள்ள தீவிரமான அல்லது தொடர்ச்சியான தேடலின் நுண்ணுணர்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது; வெறும் ‘நாடுகிறார்கள்’ என்பதைவிட வலிமையானது, ஆனால் ‘போராடுகிறார்கள்’ என்று மிகைப்படுத்துவதில்லை.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: உங்கள் பரலோகத் தந்தை
  rationale: உடமைத் தொடர்பையும் பரலோக அடையாளத்தையும் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: οἶδεν
  choice: அறிந்திருக்கிறார்
  rationale: வடிவில் நிறைவுக்காலமான οἶδα நிகழ்காலப் பொருளில் செயல்படுகிறது; தமிழில் நிலைத்த அறிவை இயல்பாக உணர்த்துகிறது.
- source_word: χρῄζετε
  choice: உங்களுக்குத் தேவை
  rationale: தேவையைக் குறிக்கும் கிரேக்க வினையின் பொருளை எளிய நவீன தமிழில் துல்லியமாக வழங்குகிறது.
- source_word: πάντα γὰρ ταῦτα ... τούτων ἁπάντων
  choice: இவை எல்லாவற்றையும் ... இவை எல்லாமே
  rationale: கிரேக்கத்தில் உள்ள மீளுரையைத் தமிழிலும் காத்து, இரண்டாம் இடத்தில் ‘எல்லாமே’ என்பதன் மூலம் இயல்பான வலியுறுத்தலை வழங்குகிறது.
- source_word: γὰρ ... γὰρ
  choice: ஏனெனில் ... [தனி வாக்கியமாக காரண விளக்கம்]
  rationale: முதல் γάρ முந்தைய வசனத்திற்கான காரணத் தொடர்பாக வெளிப்படையாக மொழிபெயர்க்கப்பட்டுள்ளது. இரண்டாம் γάρ தரும் விளக்கத் தொடர்பு தமிழ் வாக்கிய வரிசையிலும் சூழலிலும் இயல்பாகத் தெளிவாக இருப்பதால் மீண்டும் ‘ஏனெனில்’ சேர்க்கப்படவில்லை.
theological_decisions:
- issue: இயேசுவின் போதனையில் τὰ ἔθνη என்பதன் குறிப்பு
  choice: யூதரல்லாத மக்கள்
  alternative: பிற இனத்தார்; புறவினத்தார்; நாடுகள்
  rationale: உடன்படிக்கை மக்களுக்கும் அவர்களுக்கு வெளியிலுள்ள மக்களுக்கும் இடையிலான வரலாற்றுச் சூழல் வேறுபாட்டைக் காக்கிறது; அதேவேளையில் எல்லா யூதரல்லாத மக்கள்மீதும் ஒட்டுமொத்த ஒழுக்கத் தீர்ப்பைச் சுமத்துவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; எளிமையானாலும் கண்ணியமான நடை. ‘பரலோகத் தந்தை’ என்ற வழக்கமான வேதாகமச் சொல்லாட்சி காக்கப்பட்டுள்ளது. அடிக்குறிப்புக் குறிகள் அவை விளக்கும் சொற்றொடருக்குப் பின்னர் அமைக்கப்பட்டுள்ளன.
