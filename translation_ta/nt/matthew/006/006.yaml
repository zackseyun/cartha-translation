id: MAT.6.6
reference: Matthew 6:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: σὺ δὲ ὅταν προσεύχῃ, εἴσελθε εἰς τὸ ταμεῖόν σου καὶ κλείσας τὴν θύραν σου πρόσευξαι τῷ πατρί σου τῷ ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/006.yaml
  text: But when you pray[a], go into your inner room, and after shutting your door, pray to your Father who is in secret; and your Father, who sees in secret[b], will reward you.
translation:
  language: ta
  text: ஆனால் நீ ஜெபிக்கும்போது, உன் உள்ளறைக்குள் சென்று, உன் கதவை மூடிய பின்பு, மறைவில் இருக்கிற உன் தந்தையிடம் ஜெபி; மறைவானவற்றைக் காண்கிற உன் தந்தை உனக்குப் பலனளிப்பார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உனக்குத் திருப்பியளிப்பார்” அல்லது “உனக்கு வெகுமதி அளிப்பார்” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் சூழலுக்கேற்ப திருப்பியளித்தல், ஈடுசெய்தல், அல்லது வெகுமதி அளித்தல் ஆகிய பொருள்களைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: ஆனால் நீ
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட வெளிக்காட்டான ஜெபத்துக்கு மாறாக, வலியுறுத்தப்பட்ட σὺ தரும் எதிர்மறை ஒப்பீட்டை இயல்பான தமிழில் காக்கிறது.
- source_word: ὅταν προσεύχῃ
  choice: ஜெபிக்கும்போது
  rationale: ὅταν உடன் வரும் துணைவினை பொதுவான அல்லது மீண்டும் நிகழக்கூடிய காலச் சூழலைக் குறிக்கிறது; இத்தமிழ் வடிவம் அதனை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἴσελθε εἰς τὸ ταμεῖόν σου
  choice: உன் உள்ளறைக்குள் சென்று
  rationale: ταμεῖον என்பது தனிமைக்கோ சேமிப்புக்கோ பயன்படும் வீட்டின் உட்புற அறையைக் குறிக்கலாம். ‘உள்ளறை’ அதன் ஒதுக்கமான உட்புறத் தன்மையைச் சுருக்கமாகக் காக்கிறது.
- source_word: κλείσας τὴν θύραν σου
  choice: உன் கதவை மூடிய பின்பு
  rationale: இறந்தகாலப் பங்கேற்புவினை பிரதான கட்டளைக்கு முன் நிகழும் செயலைக் காட்டுவதால், செயல்களின் வரிசை தெளிவாகப் பாதுகாக்கப்படுகிறது.
- source_word: πρόσευξαι τῷ πατρί σου
  choice: உன் தந்தையிடம் ஜெபி
  rationale: மூலத்தில் உள்ள உறவுமுறைப் பெயரை விரிவாக்காமல் காக்கிறது; தமிழில் ஜெபத்தின் நோக்குநரைக் குறிக்க ‘இடம்’ உருபு இயல்பானது.
- source_word: τῷ ἐν τῷ κρυπτῷ
  choice: மறைவில் இருக்கிற
  rationale: காணப்படாமை அல்லது மறைவிடம் என்ற இரு சாயல்களையும் முற்றிலும் ஒன்றாகத் தீர்மானிக்காமல், மூலத்தின் சுருக்கத்தையும் மறைவு கருத்தையும் காக்கிறது.
- source_word: ὁ βλέπων ἐν τῷ κρυπτῷ
  choice: மறைவில் காண்கிற
  rationale: ἐν τῷ κρυπτῷ என்ற சொற்றொடரின் மீளுரையைப் பாதுகாத்து, தந்தை மறைவானதைக் காண்கிறாரா அல்லது மறைவிலிருந்து காண்கிறாரா என்ற இலக்கணச் சுருக்கத்தைத் திறந்தவாறே வைக்கிறது.
- source_word: ἀποδώσει σοι
  choice: உனக்குக் கைம்மாறு அளிப்பார்
  rationale: ἀποδίδωμι என்பதன் ‘திருப்பியளித்தல்/பதிலளித்தல்/பலனளித்தல்’ பரப்பை ‘கைம்மாறு’ காக்கிறது; வெகுமதியின் தன்மையைத் தேவையின்றி வரையறுக்கவில்லை.
theological_decisions:
- issue: ἐν τῷ κρυπτῷ என்ற சொற்றொடரின் இருமுறை பயன்பாடு
  choice: இரு இடங்களிலும் ‘மறைவில்’ என்று மீளுரையைப் பாதுகாத்தல்
  alternative: ‘மறைவிடத்தில்’ மற்றும் ‘மறைவானவற்றைக்’ என்று பொருளை வேறுபடுத்தி விளக்குதல்
  rationale: இயேசு பொதுக் காட்சிக்கும் மறைவுக்கும் இடையே அமைக்கும் எதிர்மறை ஒப்பீட்டை இது காக்கிறது; அதேவேளை சொற்றொடரின் இடவியல் மற்றும் செயற்பாட்டு நுணுக்கத்தைத் தீர்த்து விடுவதில்லை.
- issue: πατήρ என்பதன் இறையியல் உறவுமுறை
  choice: தந்தை
  alternative: பரலோகத் தந்தை
  rationale: இந்த வசனத்தில் இல்லாத ‘பரலோக’ என்ற சொல்லைச் சேர்க்காமல், இயேசு பயன்படுத்திய நேரடியான உறவுமுறைப் பெயரைப் பாதுகாக்கிறது.
- issue: ἀποδώσει என்பதன் விளைவு
  choice: கைம்மாறு அளிப்பார்
  alternative: வெகுமதி அளிப்பார்
  rationale: தெய்வீகப் பதிலின் துல்லிய வடிவத்தை விளக்காமல், மூல வினைச்சொல்லின் திருப்பியளிக்கும் அல்லது பதிலளிக்கும் சாயலைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியக்கூடிய கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘ஜெபி’ என்பது கிறிஸ்தவச் சூழலில் பரவலாகப் புரியப்படும் இயல்பான சொல். ‘தந்தை’ மூலத்தின் உறவுமுறைச் சொல்லை நேரடியாகக் காக்கிறது. ‘உள்ளறை’ ஒதுக்கமான உட்புற அறையைக் குறிக்கிறது; அதிகம் பழமையான ‘அந்தரங்க அறை’ போன்ற சொற்கள் தவிர்க்கப்பட்டன.
