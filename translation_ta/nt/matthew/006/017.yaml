id: MAT.6.17
reference: Matthew 6:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: σὺ δὲ νηστεύων ἄλειψαί σου τὴν κεφαλὴν καὶ τὸ πρόσωπόν σου νίψαι,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/017.yaml
  text: But you[a], when you fast, anoint your head and wash your face[b],
translation:
  language: ta
  text: நீயோ நோன்பிருக்கும்போது, உன் தலையில் எண்ணெய் பூசி[a], உன் முகத்தைக் கழுவு[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உன் தலையை எண்ணெயால் பூசு’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல், வழக்கமான உடல் பராமரிப்பின் ஒரு பகுதியாக எண்ணெய் தடவுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, நீ நோன்பிருப்பது மற்றவர்களுக்குத் தெளிவாகத் தெரியும்படி செய்யாமல், உன் வழக்கமான தோற்றத்தைப் பேணிக்கொள்.
    reason: cultural_note
lexical_decisions:
- source_word: σὺ δὲ
  choice: நீயோ
  rationale: வலியுறுத்தப்பட்ட σὺ மற்றும் மாறுபாட்டைக் குறிக்கும் δέ ஆகியவற்றின் பொருளை இயல்பான தமிழில் வெளிப்படுத்தி, முந்தைய வசனத்தில் கூறப்பட்ட மாயக்காரர்களுடன் உள்ள வேறுபாட்டைக் காக்கிறது.
- source_word: νηστεύων
  choice: நோன்பிருக்கும்போது
  rationale: நிகழ்காலப் பங்கேற்புவினையைச் சூழலுக்கு ஏற்ற காலவினைத் தொடராக இயல்பாக வழங்குகிறது.
- source_word: ἄλειψαί
  choice: எண்ணெய் பூசி
  rationale: ἀλείφω இங்கு வழக்கமான உடல் பராமரிப்பின் ஒரு பகுதியாகத் தலையில் எண்ணெய் தடவுவதைக் குறிக்கிறது; நவீனத் தமிழில் இது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: τὴν κεφαλήν
  choice: உன் தலையில்
  rationale: κεφαλή என்பதன் நேரடிப் பொருளான ‘தலை’ என்பதைக் காத்து, தமிழில் எண்ணெய் பூசுதல் என்ற வினையுடன் இயல்பான வேற்றுமையைப் பயன்படுத்துகிறது.
- source_word: καὶ
  choice: (காற்புள்ளியால் இணைப்பு)
  rationale: இரண்டு கட்டளைகளையும் தமிழில் இயல்பாக ஒரே தொடரில் இணைக்கிறது; தனியாக ‘மற்றும்’ சேர்ப்பது இங்கு செயற்கையாக இருக்கும்.
- source_word: τὸ πρόσωπόν σου
  choice: உன் முகத்தை
  rationale: πρόσωπον குறிக்கும் காணக்கூடிய முகத்தைத் தெளிவான நவீனத் தமிழில் வழங்குகிறது.
- source_word: νίψαι
  choice: கழுவு
  rationale: உடலின் ஓர் உறுப்பைக் கழுவுதல் என்ற νίπτω வினையின் பொருளை இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: நோன்பின்போது வெளித்தோற்றம் குறித்த கட்டளையின் தன்மை
  choice: நோன்பை மற்றவர்களுக்குக் காட்டிக்கொள்ளாமல் வழக்கமான உடல் பராமரிப்பையும் தோற்றத்தையும் பேணுமாறு இயேசு அறிவுறுத்துகிறார்.
  alternative: இது ஒரு சடங்கு முறையிலான அபிஷேகத்தைக் கட்டளையிடுகிறது; அல்லது பொதுவிடத்தில் நோன்பிருப்பதையே தடைசெய்கிறது.
  rationale: உடனடியான சூழல், மாயக்காரர்கள் தங்கள் முகத்தை வாடச் செய்வதற்கு மாறாக இயல்பான தோற்றத்தைப் பேணுவதை வலியுறுத்துகிறது. வசனம் நோன்பைத் தடைசெய்வதுமில்லை; எண்ணெய் பூசுவதைத் தனியான சடங்காக வரையறுப்பதுமில்லை.
translation_notes:
  register: நவீனத் தரமான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நேரடிக் கட்டளை நடை பயன்படுத்தப்பட்டுள்ளது. ‘நீயோ’ என்பது மூலத்தின் வலியுறுத்தலையும் மாறுபாட்டையும் சுருக்கமாகக் காக்கிறது.
