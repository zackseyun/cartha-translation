id: MAT.6.27
reference: Matthew 6:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τίς δὲ ἐξ ὑμῶν μεριμνῶν δύναται προσθεῖναι ἐπὶ τὴν ἡλικίαν αὐτοῦ πῆχυν ἕνα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/027.yaml
  text: And which of you[a], by being anxious, can add one cubit to his stature?
translation:
  language: ta
  text: உங்களில் யார் கவலைப்படுவதால் தன் ஆயுளில்[a] ஒரு முழத்தைக் கூட்ட முடியும்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் உயரத்தில் ஒரு முழத்தைக் கூட்ட முடியும்?” இங்குள்ள கிரேக்கச் சொல் “ஆயுள்/வயது” அல்லது “உயரம்” என இரு பொருள்களையும் தரக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: τίς δὲ ἐξ ὑμῶν
  choice: உங்களில் யார்
  rationale: τίς ἐξ ὑμῶν என்பது ‘உங்களில் யார்’ என்ற இயல்பான வினா. δέ இங்கு மென்மையான தொடரிணைப்பாக இருப்பதால், தமிழில் தனியே மொழிபெயர்க்காமல் வாக்கியத் தொடரில் உணர்த்தப்பட்டுள்ளது.
- source_word: μεριμνῶν
  choice: கவலைப்படுவதால்
  rationale: μεριμνάω கவலை அல்லது மனக்கலக்கத்தைக் குறிக்கிறது; காரணம் அல்லது வழிமுறையைக் காட்டும் பங்கேற்பு வடிவத்தை ‘-வதால்’ இயல்பாக எடுத்துரைக்கிறது.
- source_word: δύναται προσθεῖναι
  choice: கூட்ட முடியும்
  rationale: δύναται திறனைச் சுட்டுகிறது; προσθεῖναι சேர்த்தல் அல்லது அதிகரித்தலைக் குறிக்கிறது. ‘கூட்ட முடியும்’ இரண்டையும் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐπὶ τὴν ἡλικίαν αὐτοῦ
  choice: தன் ஆயுளில்
  rationale: ἡλικία என்பதற்கு ஆயுள்/வயது அல்லது உடல் உயரம் என்ற இரு பொருள்கள் உண்டு. கவலையாலும் வாழ்வைப் பற்றிய சூழலாலும் ‘ஆயுள்’ முதன்மை வாசிப்பாகத் தேர்ந்தெடுக்கப்பட்டுள்ளது; αὐτοῦ என்பதன் திரும்புச் சுட்டும் பொருளை தமிழின் ‘தன்’ இயல்பாகத் தருகிறது.
- source_word: πῆχυν ἕνα
  choice: ஒரு முழம்
  rationale: πῆχυς என்பது முழங்கை முதல் விரல் நுனிவரையிலான பழமையான நீள அளவு. தமிழின் மரபான அளவுச் சொல்லான ‘முழம்’ மூலத்தின் கண்கூடிய உருவகத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ἡλικία என்பதன் பொருள்
  choice: ஆயுள்
  alternative: உயரம்
  rationale: வாழ்வு குறித்த கவலையும் கடவுளின் பராமரிப்பும் பேசப்படும் சூழலில் ‘ஆயுள்’ பொருத்தமாக உள்ளது. இருப்பினும் ‘ஒரு முழம்’ என்ற நீள அளவுடன் ‘உயரம்’ என்பதும் உண்மையான சொற்பொருள் வாய்ப்பாக இருப்பதால் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் எளிமையும் கொண்ட வினாவாக வடிவமைக்கப்பட்டுள்ளது. ‘ஒரு முழம்’ என்ற பழமையான அளவுச் சொல் தமிழில் நன்கு அறியப்பட்டதால் அப்படியே வைக்கப்பட்டுள்ளது; மூலத்தில் உள்ள ஆயுள்/உயரம் ambiguity அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
