  naturalness: «உங்களில் யார் கவலைப்படுவதால் தன் ஆயுளில் ஒரு முழத்தைக் கூட்ட முடியும்?» என்பது நவீன பொதுத்தமிழில் இயல்பான, தெளிவான வினாவாக உள்ளது. «முழம்» மூலத்தின் பழைய அளவுச்சொல்லின் உருவகத் தன்மையைச் சரியாகத் தக்கவைக்கிறது.
  terminology: «கவலைப்படுவதால்», «ஆயுள்», «உயரம்», «முழம்» ஆகிய சொற்கள் சூழலுக்கும் நவீன நிலையான தமிழுக்கும் ஏற்றவை. «தன்» என்பது பொதுவான ஒருமைச் சுட்டுதலை இயல்பாக வெளிப்படுத்துகிறது.
