  text: καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν, ἀλλὰ ῥῦσαι ἡμᾶς ἀπὸ τοῦ ⸀πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/013.yaml
  text: And do not lead us into temptation[b][a], but deliver us from evil.
translation:
  language: ta
  text: எங்களைச் சோதனைக்குள்[a] கொண்டுசெல்லாதிரும்; மாறாக, தீயவனிடமிருந்து[b] எங்களை விடுவித்தருளும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சோதனை’ என்பதற்கு இங்கு பாவம் செய்யத் தூண்டும் ‘தூண்டுதல்’ அல்லது ஒருவரைப் பரிசோதிக்கும் ‘கடும் சோதனை’ என்ற பொருளும் இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தீமையிலிருந்து.’ கிரேக்கச் சொற்றொடரைத் தனிப்பட்ட முறையில் ‘தீயவன்’ என்றும், தன்மையைக் குறிக்கும் முறையில் ‘தீமை’ என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ εἰσενέγκῃς
  choice: கொண்டுசெல்லாதிரும்
  rationale: μή உடன் வரும் இறந்தகாலத் துணைவினை வடிவம் இங்கு வேண்டுதல் கலந்த எதிர்மறைக் கோரிக்கையாக உள்ளது. கிரேக்கத்தின் நேரடியான ‘கொண்டுசெல்லாதீர்’ என்ற பொருளைப் பேணவும், ‘செல்ல அனுமதிக்காதீர்’ என்று விளக்கமாக மாற்றுவதைத் தவிர்க்கவும் இச்சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: πειρασμόν
  choice: சோதனை
  rationale: πειρασμός என்பது பாவத்துக்கான தூண்டுதலையும் ஒருவரைச் சோதிக்கும் கடின நிலையையும் குறிக்கக்கூடும். தமிழில் ‘சோதனை’ இவ்விரு பொருள் வட்டங்களையும் ஓரளவு தாங்குவதால் முதன்மை உரையில் பயன்படுத்தப்பட்டு, அதன் பரப்பு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ῥῦσαι
  choice: மீட்டருளும்
  rationale: ῥῦσαι செயலில் தலையிட்டு விடுவிக்கும்படியான வேண்டுதலைக் குறிக்கிறது. ‘மீட்டருளும்’ என்பது தேவனை நோக்கிய ஜெபத்திற்கு இயல்பான, கண்ணியமான தமிழாக இருந்து மீட்பின் வலிமையையும் வெளிப்படுத்துகிறது.
- source_word: τοῦ πονηροῦ
  choice: தீயவனிடமிருந்து
  rationale: உறுப்புடன் வரும் πονηροῦ ஆண்பால் தனிப்பட்ட குறிப்பாக ‘தீயவன்’ என்றும், நடுநிலைப் பொருளாக ‘தீமை’ என்றும் புரிந்துகொள்ளப்படலாம். தனிப்பட்ட எதிரியைக் குறிக்கும் வாசிப்பு முதன்மை உரையில் வைக்கப்பட்டு, உண்மையான இலக்கண இருபொருள்தன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: τοῦ πονηροῦ என்பதன் தனிப்பட்ட அல்லது தன்மைக் குறிப்பு
  choice: தீயவனிடமிருந்து
  alternative: தீமையிலிருந்து
  rationale: கிரேக்க வடிவம் ‘தீயவன்’ என்றும் ‘தீமை’ என்றும் இயல்பாகப் பொருள்படக்கூடியது. சோதனையுடன் உள்ள உடனடித் தொடர்பில் தனிப்பட்ட தீய எதிரியைக் குறிக்கும் வாசிப்பு வலுவாக இருப்பதால் அது முதன்மை உரையில் தரப்படுகிறது; எனினும் மற்ற வாசிப்பும் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், தேவனை நோக்கிய ஜெபத்துக்குரிய கண்ணியமான வேண்டுதல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘கொண்டுசெல்லாதிரும்’ என்பது மூலத்தின் நேரடியான கோரிக்கையைப் பேணுகிறது; ‘மீட்டருளும்’ வழிபாட்டு நயத்தைக் கொண்டிருந்தாலும் பொதுவாக எளிதில் புரியும் சொல். ‘மாறாக’ என்பது ἀλλά காட்டும் தெளிவான எதிர்மறை மாற்றத்தை வெளிப்படுத்துகிறது.
