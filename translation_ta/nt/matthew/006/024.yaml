id: MAT.6.24
reference: Matthew 6:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Οὐδεὶς δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/024.yaml
  text: No one is able to serve two masters[a], for either he will hate the one and love the other, or he will be devoted to one and despise the other. You are not able to serve God and mammon.
translation:
  language: ta
  text: “யாரும் இரண்டு எஜமானர்களுக்குப் பணிவிடை செய்ய முடியாது. ஏனெனில், ஒருவரை வெறுத்து மற்றவரிடம் அன்புகூருவார்; அல்லது ஒருவரைப் பற்றிக்கொண்டு மற்றவரை இகழ்வார். நீங்கள் கடவுளுக்கும் மாமோனுக்கும்[a] பணிவிடை செய்ய முடியாது.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “செல்வம்,” “பணம்.” கிரேக்க மூலத்தில் “மாமோன்” என்ற கடன்சொல் உள்ளது; இங்கு செல்வம் போட்டி எஜமானைப் போல ஆளுருவாக்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: யாராலும்
  rationale: முற்றிலும் விலக்கும் பொதுமையான மறுப்பை, தமிழில் இயல்பாக ‘யாராலும் ... முடியாது’ என்ற அமைப்பு வெளிப்படுத்துகிறது.
- source_word: δύναται / δύνασθε
  choice: முடியாது
  rationale: இரு இடங்களிலும் திறன் அல்லது சாத்தியமின்மையை நேரடியாகக் காட்டி, மூலத்தின் மீளுரையைப் பேணுகிறது.
- source_word: δυσὶ κυρίοις
  choice: இரண்டு எஜமானர்களுக்கு
  rationale: δουλεύειν என்பதோடு வரும் சமூக உறவு எஜமான்–பணியாள் உறவாக இருப்பதால், தெய்வீகப் பட்டமாகத் தவறாகப் புரிந்துகொள்ளக்கூடிய ‘ஆண்டவர்கள்’ என்பதற்குப் பதிலாக ‘எஜமானர்கள்’ பொருத்தமானது.
- source_word: δουλεύειν
  choice: பணிவிடை செய்ய
  rationale: அடிமை அல்லது பணியாள் தன் எஜமானுக்குச் செய்யும் சேவையைச் சுட்டும் வினையின் உறவுசார் வலிமையை, இயல்பான நவீன தமிழில் இது வெளிப்படுத்துகிறது.
- source_word: μισήσει
  choice: வெறுப்பார்
  rationale: அன்புகூருதல் என்பதற்கு எதிராக மூலத்தில் உள்ள வலுவான சொல்லை மென்மைப்படுத்தாமல் நேரடியாகப் பேணுகிறது.
- source_word: ἀγαπήσει
  choice: அன்புகூருவார்
  rationale: ἀγαπάω என்பதன் வழக்கமான பொருளையும் ‘வெறுப்பார்’ என்பதுடனான தெளிவான முரணையும் காக்கிறது.
- source_word: ἑνὸς ἀνθέξεται
  choice: ஒருவரைப் பற்றிக்கொள்வார்
  rationale: ஒருவரை உறுதியாகப் பற்றியிருத்தல், அவரோடு நிலைத்திருத்தல் என்ற வினையின் உருவகத்தையும் பற்றுறுதியையும் பேணுகிறது.
- source_word: καταφρονήσει
  choice: இகழ்வார்
  rationale: மற்றவரை மதிப்பற்றவராகக் கருதி அவமதிக்கும் வலுவான பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: θεῷ
  choice: கடவுளுக்கு
  rationale: இச்சூழலில் θεός என்பதற்கான தெளிவான, பொதுவாகப் புரியும் நவீனத் தமிழ் இணை.
- source_word: μαμωνᾷ
  choice: மாமோனுக்கு
  rationale: கிரேக்கத்தில் கடன்சொல்லாக உள்ள சொல்லை ஒலிபெயர்த்து, கடவுளுக்கு எதிரான போட்டி எஜமானாகச் செல்வம் உருவகப்படுத்தப்படுவதைப் பேணுகிறது; அதன் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: κύριος என்பதைக் தெய்வீகமல்லாத சமூகச் சூழலில் மொழிபெயர்த்தல்
  choice: எஜமானர்கள்
  alternative: ஆண்டவர்கள்
  rationale: பன்மையும் பணிவிடைச் சொல்லும் எஜமான்–பணியாள் உறவைத் தெளிவாக்குகின்றன. ‘எஜமானர்கள்’ என்பது இங்கு சமூகப் பொருளைப் பேணி, தெய்வீகப் பட்டத்தோடு குழப்பம் ஏற்படுவதைத் தவிர்க்கிறது.
- issue: μαμωνᾶς என்பதைக் மொழிபெயர்த்தல்
  choice: மாமோன்
  alternative: செல்வம் / பணம்
  rationale: கடவுளும் மாமோனும் போட்டி எஜமானர்களாக நிறுத்தப்படுகின்றனர். கடன்சொல்லைப் பேணுவது அந்த ஆளுருவாக்கத்தையும் இறையியல் பதற்றத்தையும் காக்கிறது; பொருள்சார் மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எஜமான்–பணியாள் உருவகம் தெளிவாக இருக்க ‘பணிவிடை செய்ய’ தேர்ந்தெடுக்கப்பட்டது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘மாமோன்’ என்பதற்குப் பின்னர் வைக்கப்பட்டுள்ளது.
