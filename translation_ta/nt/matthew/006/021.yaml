id: MAT.6.21
reference: Matthew 6:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅπου γάρ ἐστιν ὁ θησαυρός ⸀σου, ἐκεῖ ἔσται καὶ ἡ καρδία ⸁σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/021.yaml
  text: For where your treasure is[a], there your heart will be also.
translation:
  language: ta
  text: ஏனெனில், உன் பொக்கிஷம் எங்கே இருக்கிறதோ, அங்கே உன் இதயமும் இருக்கும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏனெனில், உன் பொக்கிஷம் எங்கே இருக்கிறதோ, அங்கே உன் இதயமும் இருக்கிறது.” சில மொழிபெயர்ப்புகள் இதைக் காலங்கடந்த பொதுக் கூற்றாக நிகழ்காலத்தில் மொழிபெயர்க்கின்றன; ஆனால் கிரேக்க வினை எதிர்காலத்தில் உள்ளது (“இருக்கும்”).
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπου
  choice: எங்கே இருக்கிறதோ
  rationale: இடத்தைச் சுட்டும் தொடர்புக் கூறை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ἐκεῖ என்பதுடன் வரும் ‘எங்கே... அங்கே’ இணை அமைப்பையும் காக்கிறது.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனங்களில் பொக்கிஷத்தைச் சேர்த்துவைப்பது குறித்து கூறிய போதனைக்கான விளக்கத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: θησαυρός
  choice: பொக்கிஷம்
  rationale: செல்வக் குவியல் என்ற நேரடிப் பொருளையும், ஒருவர் மிக மதிப்பதாகக் கருதுவது என்ற உருவகப் பொருளையும் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: σου
  choice: உன்
  rationale: கிரேக்க மூலத்தில் இரு இடங்களிலும் இரண்டாம் நபர் ஒருமை உடைமைப் பெயர் வருகிறது; அதைத் தமிழிலும் ஒருமையாகக் காக்கிறது.
- source_word: ἐκεῖ
  choice: அங்கே
  rationale: ὅπου என்பதுடன் இணைந்து வரும் ‘எங்கே... அங்கே’ என்ற சுருக்கமான இட இணைப்பைத் தக்கவைக்கிறது.
- source_word: ἔσται
  choice: இருக்கும்
  rationale: εἰμί வினையின் எதிர்கால வடிவத்தைத் தமிழில் வெளிப்படையாகக் காக்கிறது; இதை காலங்கடந்த பொதுமையாக நிகழ்காலத்திற்கு மாற்றவில்லை.
- source_word: καρδία
  choice: இதயம்
  rationale: விருப்பம், பற்றுறுதி, உள்ளார்ந்த நோக்கு ஆகியவற்றை உள்ளடக்கக்கூடிய மூலச் சொல்லின் பரந்த உருவகப் பொருளைத் தக்கவைக்கிறது.
- source_word: καὶ
  choice: -உம்
  rationale: ‘இதயமும்’ என்ற வடிவில் பொக்கிஷம் இருக்கும் இடத்தோடு இதயத்தையும் சேர்த்து இணைக்கும் பொருளை இயல்பான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: ஞானவாக்கைப் போன்ற இக்கூற்றில் ἔσται என்பதன் காலப் பொருள்
  choice: எதிர்காலத்தை வெளிப்படையாகக் காக்கும் ‘இருக்கும்’
  alternative: காலங்கடந்த பொதுக் கொள்கையாக நிகழ்காலத்தில் ‘இருக்கிறது’
  rationale: கிரேக்கத்தில் வினை எதிர்காலத்தில் உள்ளது. அதைத் தக்கவைப்பது பொக்கிஷமும் இதயமும் ஒன்றுக்கொன்று பொருந்துகின்றன என்பதை மட்டும் அல்லாமல், பொக்கிஷம் வைக்கப்படும் இடத்தை நோக்கி இதயம் அமையும் என்ற இயக்கத்தையும் திறந்த நிலையில் வைத்திருக்கிறது; இதற்கு மேல் எந்தக் கோட்பாட்டு முடிவையும் உரையில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையானதும் கண்ணியமானதும் ஆகிய நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இரண்டாம் நபர் ஒருமை ‘உன்’ எனக் காக்கப்பட்டு, ‘எங்கே... அங்கே’ என்ற இணை அமைப்பும் எதிர்கால வினையும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
