  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μὴ οὖν ὁμοιωθῆτε αὐτοῖς, οἶδεν γὰρ ⸀ὁ πατὴρ ὑμῶν ὧν χρείαν ἔχετε πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/008.yaml
  text: Therefore[a], do not become like them, for your Father knows what you need before you ask him.
translation:
  language: ta
  text: ஆகவே, அவர்களைப் போல ஆகாதீர்கள்[a]. ஏனெனில், நீங்கள் அவரிடம் கேட்பதற்கு முன்பே உங்களுக்கு என்ன தேவை என்பதை உங்கள் தந்தை அறிவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களைப் போல இருக்காதீர்கள்”; இன்னும் சொற்சொல்லாக, “அவர்களைப் போல் ஆக்கப்படாதீர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ οὖν
  choice: ஆகவே, ... ஆகாதீர்கள்
  rationale: οὖν முந்தைய எச்சரிக்கையிலிருந்து வரும் முடிவைக் காட்டுகிறது; μή உடன் வரும் தடை இயல்பான நவீனத் தமிழில் எதிர்மறை ஏவலாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ὁμοιωθῆτε
  choice: போல ஆகாதீர்கள்
  rationale: இறந்தகாலச் செயப்பாட்டு துணைவினை வடிவத்தின் தடையுணர்வை மரத்தன்மையின்றி வெளிப்படுத்துகிறது; ‘அவர்களைப் போல இருக்காதீர்கள்’ என்பதும் சாத்தியம்.
- source_word: αὐτοῖς
  choice: அவர்களை
  rationale: உடனடி சூழலில் முன்பு குறிப்பிடப்பட்டவர்களைக் குறிக்கும் பிரதிப்பெயரைத் தெளிவாகவும் இயல்பாகவும் வைத்திருக்கிறது.
- source_word: οἶδεν
  choice: அறிந்திருக்கிறார்
  rationale: οἶδα வடிவத்தில் நிறைவுக்காலமாக இருந்தாலும் நிகழ்காலப் பொருளில் ‘அறிவார்/அறிந்திருக்கிறார்’ எனச் செயல்படுகிறது; இங்கு முன்பே உள்ள அறிவை இயல்பாகச் சொல்கிறது.
- source_word: ὁ πατὴρ ὑμῶν
  choice: உங்கள் தந்தை
  rationale: கிரேக்கத்தில் உள்ள ‘உங்கள் தந்தை’ என்பதையே வழங்குகிறது; இல்லாத ‘பரலோகத்’ என்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: ὧν χρείαν ἔχετε
  choice: உங்களுக்கு என்ன தேவை என்பதை
  rationale: தேவையின் உள்ளடக்கத்தை நவீனத் தமிழில் சுருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν
  choice: நீங்கள் அவரிடம் கேட்பதற்கு முன்பே
  rationale: πρὸ τοῦ உடன் வரும் வினையெச்சத்தின் முன்னுரிமைக் காலத்தைக் ‘முன்பே’ தெளிவாகக் காட்டுகிறது; αὐτόν என்பதற்கு இயல்பான தமிழில் ‘அவரிடம்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: ஜெபத்துடன் தொடர்புடைய இறை முன்னறிவு
  choice: சீடர்கள் கேட்பதற்கு முன்பே அவர்களுடைய தேவைகளைத் தந்தை அறிந்திருக்கிறார் என்ற கூற்றை நேரடியாக வழங்குதல்
  alternative: ஜெபம் தகவல் அளிப்பதற்காக அல்ல, உறவுக்காக என்று விளக்கிச் சொல்லும் விரிவுரை; அல்லது முழுமையான முன்னறிவை வலியுறுத்தும் கோட்பாட்டுச் சொற்கள்
  rationale: வசனம் தந்தையின் முந்திய அறிவை மட்டும் உறுதிப்படுத்துகிறது; அப்படியிருக்க ஜெபம் ஏன் என்பதைக் குறித்து விளக்கம் சேர்க்காமல், உரையிலுள்ள இறையியல் பதற்றத்தை அப்படியே காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை. ‘தந்தை’ என்பது மூலத்தின் πατήρ சொல்லை நேரடியாகக் காக்கிறது; வாக்கிய ஓட்டத்திற்காக இயல்பான தமிழ் சொல்வரிசை பயன்படுத்தப்பட்டுள்ளது.
