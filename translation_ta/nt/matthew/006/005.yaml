id: MAT.6.5
reference: Matthew 6:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ὅταν ⸂προσεύχησθε, οὐκ ἔσεσθε ὡς⸃ οἱ ὑποκριταί· ὅτι φιλοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς γωνίαις τῶν πλατειῶν ἑστῶτες προσεύχεσθαι, ⸀ὅπως φανῶσιν τοῖς ἀνθρώποις· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσι τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/005.yaml
  text: And whenever you pray[a], you shall not be like the hypocrites, because they love to stand and pray in the synagogues and on the corners of the broad streets, so that they may be seen by people. Truly I say to you[c][b], they have received their reward.
translation:
  language: ta
  text: '“நீங்கள் ஜெபிக்கும்போதெல்லாம், வெளிவேடக்காரர்களைப் போல இருக்காதீர்கள். ஏனெனில், மக்கள் தங்களைப் பார்க்க வேண்டும் என்பதற்காக அவர்கள் ஜெபக்கூடங்களிலும் அகன்ற வீதிகளின் மூலைகளிலும் நின்று ஜெபிக்க விரும்புகிறார்கள். உண்மையாகவே உங்களுக்குச் சொல்கிறேன்: அவர்கள் தங்கள் பலனைப் பெற்றுவிட்டார்கள்.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தங்கள் பலனை முழுமையாகப் பெற்றுவிட்டார்கள்” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்க வினை, உரிய தொகையை முழுவதுமாகப் பெற்றுக்கொண்டதைக் குறிக்கும் வணிகப் பயன்பாட்டிலும் வந்தது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν προσεύχησθε
  choice: நீங்கள் ஜெபிக்கும்போதெல்லாம்
  rationale: ὅταν என்பதன் பொதுவான, மீண்டும் நிகழக்கூடிய காலப் பொருளை ‘போதெல்லாம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὐκ ἔσεσθε ὡς
  choice: போல இருக்காதீர்கள்
  rationale: எதிர்கால வினை வடிவத்தின் தடையாணைப் பொருளை நவீனத் தமிழில் இயல்பான நேரடி அறிவுறுத்தலாகத் தருகிறது.
- source_word: ὑποκριταί
  choice: வெளிவேடக்காரர்கள்
  rationale: பிறர் பார்ப்பதற்காகப் பக்தியை வெளிக்காட்டுவோர் என்ற சூழல்சார் பொருளைத் தெளிவாகவும் வழக்காகவும் தெரிவிக்கிறது.
- source_word: φιλοῦσιν
  choice: விரும்புகிறார்கள்
  rationale: பொதுமக்களின் பார்வைக்காக இவ்வாறு செய்வதில் அவர்களுக்குள்ள விருப்பத்தை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: ஜெபக்கூடங்களில்
  rationale: முதல் நூற்றாண்டு யூதச் சூழலில் συναγωγή குறிக்கும் வழிபாட்டுக் கூடத்தைப் புரிந்துகொள்ளத்தக்க தமிழில் தருகிறது.
- source_word: ἐν ταῖς γωνίαις τῶν πλατειῶν
  choice: அகன்ற வீதிகளின் முனைகளில்
  rationale: πλατεῖα என்பதன் அகன்ற பொது வீதி என்ற பொருளையும் γωνία என்பதன் முனை அல்லது மூலை என்ற பொருளையும் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: ἑστῶτες προσεύχεσθαι
  choice: நின்று ஜெபிக்க
  rationale: நிற்பதும் ஜெபிப்பதும் கிரேக்கத்தில் உள்ள வரிசைப்படியே தெளிவாகத் தரப்படுகின்றன.
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις
  choice: மக்கள் தங்களைப் பார்க்க வேண்டும் என்பதற்காக
  rationale: ὅπως காட்டும் நோக்கத்தையும் ἀνθρώποις என்பதன் பொதுவான மனிதக் குறிப்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: உண்மையாகவே உங்களுக்குச் சொல்கிறேன்
  rationale: இயேசுவின் வலியுறுத்தலான அறிமுகச் சூத்திரத்தை மதிப்புடனும் நவீனத் தமிழ் நடையிலும் பாதுகாக்கிறது.
- source_word: ἀπέχουσι τὸν μισθὸν αὐτῶν
  choice: அவர்கள் தங்களுக்குரிய பலனைப் பெற்றுவிட்டார்கள்
  rationale: வெகுமதி கிடைத்துவிட்டது என்ற சூழல்சார், நிறைவுற்ற பொருளைத் தருகிறது; ‘முழுமையாக’ என்பதை முதன்மை உரையில் சேர்க்காமல் வணிகப் பயன்பாட்டின் நுட்பத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
theological_decisions:
- issue: ἀνθρώποις என்பதன் பொதுப்பொருள்
  choice: மக்கள்
  alternative: மனிதர்கள் / ஆண்கள்
  rationale: இங்கு சொல் ஆண்களை மட்டும் குறிக்காமல் பொதுவாகப் பார்ப்பவர்களைக் குறிக்கிறது; ‘மக்கள்’ அந்த நோக்கத்தைத் தமிழில் இயல்பாகத் தருகிறது.
- issue: ἀπέχουσι என்பதில் பலன் கிடைத்ததன் நிறைவு
  choice: பலனைப் பெற்றுவிட்டார்கள்
  alternative: பலனை முழுமையாகப் பெற்றுவிட்டார்கள் / தங்கள் பலனை வைத்திருக்கிறார்கள்
  rationale: பொது அங்கீகாரமே அவர்களுக்குக் கிடைத்த பலன் என்ற எச்சரிக்கையைப் பாதுகாக்கிறது. அதேவேளை ‘முழுமையாக’ என்பது வினையின் சாத்தியமான வணிக நுட்பம் என்பதால் அதை உரைக்குள் கட்டாயமாக்காமல் அடிக்குறிப்பில் அளிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பானதாகவும், இயேசுவின் எச்சரிக்கைக்குரிய கண்ணியமும் வலிமையும் நிலைக்குமாறும் அமைக்கப்பட்டுள்ளது. ‘ஜெபக்கூடம்’, ‘வெளிவேடக்காரர்’, ‘பலன்’ ஆகியவை வரலாற்றுச் சூழலையும் வழக்குத் தமிழையும் சமநிலைப்படுத்துகின்றன.
