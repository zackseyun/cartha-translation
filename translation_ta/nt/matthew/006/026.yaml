  rationale: ‘ஆனாலும்’ நீக்கப்பட்டு, மூலத்தின் καί இணைப்பை எந்தக் கூடுதல் தருக்க உறவும் சுமத்தாமல் அடுத்த வாக்கியமாகத் தொடரும் அமைப்பு பயன்படுத்தப்பட்டுள்ளது. ἐμβλέψατε-க்கு ‘பாருங்கள்’ என மாற்றப்பட்டுள்ளது. பொருள், ஒப்பீட்டு வலிமை, மரியாதைநிலை, மற்றும் அடிக்குறிப்பு மாற்றுவடிவங்கள் பாதுகாக்கப்பட்டுள்ளன.
