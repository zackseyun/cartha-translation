id: MAT.6.26
reference: Matthew 6:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐμβλέψατε εἰς τὰ πετεινὰ τοῦ οὐρανοῦ ὅτι οὐ σπείρουσιν οὐδὲ θερίζουσιν οὐδὲ συνάγουσιν εἰς ἀποθήκας, καὶ ὁ πατὴρ ὑμῶν ὁ οὐράνιος τρέφει αὐτά· οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/026.yaml
  text: Look at the birds of the sky[a], that they do not sow or reap or gather into barns, and your heavenly Father feeds them[b]. Are you not of much more value than they are?
translation:
  language: ta
  text: வானத்துப் பறவைகளைப் பாருங்கள்; அவை விதைப்பதுமில்லை, அறுப்பதுமில்லை, களஞ்சியங்களில் சேர்த்து வைப்பதுமில்லை. உங்கள் பரலோகத் தந்தை அவற்றுக்கு உணவளிக்கிறார். அவற்றைவிட நீங்கள் அதிக மதிப்புள்ளவர்கள் அல்லவா?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: அல்லது, ‘அவற்றைவிட நீங்கள் மேலானவர்கள் அல்லவா?’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβλέψατε
  choice: உற்றுப் பாருங்கள்
  rationale: இறந்தகால ஏவல் வடிவம் கவனத்தை நேரடியாகச் செலுத்தும்படி அழைக்கிறது. ‘உற்றுப் பாருங்கள்’ என்பது வெறும் பார்வையைவிடக் கவனித்துப் பார்ப்பதைக் காட்டினாலும், ‘ஆராயுங்கள்’ என்று பொருளை மிகைப்படுத்துவதில்லை.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: வானத்துப் பறவைகள்
  rationale: πετεινά பறவைகளையோ பறக்கும் உயிரினங்களையோ குறிக்கிறது; τοῦ οὐρανοῦ இச்சூழலில் கண்ணுக்குத் தெரியும் வானத்தைக் குறிக்கிறது. இயல்பான தமிழில் இரண்டையும் ‘வானத்துப் பறவைகள்’ துல்லியமாகத் தருகிறது.
- source_word: ὅτι
  choice: முக்காற்புள்ளியைத் தொடர்ந்து ‘அவை…’
  rationale: இங்கு ὅτι பறவைகளிடம் கவனம் செலுத்த வேண்டிய அம்சத்தை அறிமுகப்படுத்துகிறது. தமிழில் ‘என்பதை’ அல்லது ‘ஏனெனில்’ என்று கட்டாயமாக விரித்துக் கூறாமல், முக்காற்புள்ளியுடன் தொடர்வது கிரேக்கத்தின் தொடர்பை இயல்பாகப் பாதுகாக்கிறது.
- source_word: σπείρουσιν ... θερίζουσιν ... συνάγουσιν
  choice: விதைப்பதும் இல்லை, அறுப்பதும் இல்லை, ... சேர்த்து வைப்பதும் இல்லை
  rationale: வேளாண்மைச் செயல்களின் மூன்று நிலைகளையும், கிரேக்கத்தில் உள்ள இணை அமைப்பையும் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: εἰς ἀποθήκας
  choice: களஞ்சியங்களில்
  rationale: ἀποθήκαι விளைபொருட்கள் சேமிக்கப்படும் இடங்களைக் குறிக்கிறது. ‘களஞ்சியங்கள்’ நவீன வாசகருக்குப் புரியக்கூடியதும் வேளாண்மைச் சூழலுக்கு ஏற்றதுமாகும்.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: உங்கள் பரலோகத் தந்தை
  rationale: உறவுச் சொல்லான ‘தந்தை’ என்பதையும் οὐράνιος என்பதன் பரலோகத் தன்மையையும் சுருக்கமாகவும் மரியாதையாகவும் தருகிறது.
- source_word: τρέφει
  choice: உணவளிக்கிறார்
  rationale: இச்சூழலில் τρέφω உணவு கொடுத்துப் பேணுவதைக் குறிக்கிறது. ‘உணவளிக்கிறார்’ நேரடியான, இயல்பான தமிழ் இணைச்சொல்.
- source_word: οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
  choice: அவற்றைவிட நீங்கள் எவ்வளவோ அதிக மதிப்புள்ளவர்கள் அல்லவா?
  rationale: கேள்வி உடன்பாடான பதிலை எதிர்பார்க்கிறது. διαφέρω இங்கு மதிப்பில் மேலோங்குவதையும் μᾶλλον ஒப்பீட்டு வலிமையையும் குறிக்கின்றன; ‘எவ்வளவோ அதிக மதிப்புள்ளவர்கள்’ அந்த வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இயேசுவின் வாதத்தில் மனிதர்களுக்கும் பறவைகளுக்கும் இடையிலான ஒப்பீட்டு மதிப்பு
  choice: இயேசுவின் கேட்போர் பறவைகளைவிட அதிக மதிப்புள்ளவர்கள் என்று வசனம் கூறுவதை மட்டும் மொழிபெயர்த்தல்
  alternative: அந்த அதிக மதிப்பைத் தேவனுடைய சாயல் அல்லது உடன்படிக்கை உறவு போன்ற ஒரு குறிப்பிட்ட கோட்பாட்டு அடிப்படையால் விளக்குதல்
  rationale: ஒப்பீட்டு மதிப்பை மூலவசனம் வெளிப்படையாக உறுதிப்படுத்துகிறது; ஆனால் அதற்கான கோட்பாட்டு அடிப்படையை இவ்வசனம் கூறவில்லை. எனவே மொழிபெயர்ப்பு காரணத்தைச் சேர்க்காமல் வாதத்தின் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
- issue: καί இணைப்பின் சூழல்சார் வலிமை
  choice: ‘ஆனாலும்’
  alternative: ‘மேலும்’ அல்லது ‘அப்போதும்’
  rationale: பறவைகள் வேளாண்மைச் செயல்களைச் செய்வதில்லை என்பதற்கும் தந்தை அவற்றுக்கு உணவளிப்பதற்கும் இடையிலுள்ள எதிர்மறைத் திருப்பத்தைத் தமிழில் தெளிவாகக் காட்டுகிறது; தேவனுடைய பராமரிப்பின் முறையை இதற்கு மேல் விளக்குவதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வாய்மொழி இயல்பும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘பரலோகத் தந்தை’ என்ற பரிச்சயமான சொற்றொடர் தக்கவைக்கப்பட்டு, தேவையற்ற பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன. மூன்று வேளாண்மை வினைகளின் இணைநடை மற்றும் இறுதி வினாவாக்கியத்தின் வலியுறுத்தல் பாதுகாக்கப்பட்டுள்ளன.
