- from: 'வானத்துப் பறவைகளை[a] உற்றுப் பாருங்கள்: அவை விதைப்பதும் இல்லை, அறுப்பதும் இல்லை, களஞ்சியங்களில் சேர்த்து வைப்பதும் இல்லை; ஆனாலும் உங்கள் பரலோகத் தந்தை அவற்றுக்கு உணவளிக்கிறார். அவற்றைவிட நீங்கள் எவ்வளவோ அதிக மதிப்புள்ளவர்கள் அல்லவா?[b]'
