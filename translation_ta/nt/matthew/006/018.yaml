source:
  edition: SBLGNT
  text: ὅπως μὴ φανῇς τοῖς ἀνθρώποις νηστεύων ἀλλὰ τῷ πατρί σου τῷ ἐν τῷ ⸀κρυφαίῳ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸁κρυφαίῳ ἀποδώσει σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/018.yaml
  text: so that you may not appear to men to be fasting[a], but to your Father who is in secret[b]; and your Father who sees in secret will reward you.
translation:
  language: ta
  text: மனிதர்களுக்கு நீ நோன்பிருப்பவனாகத் தெரியாமல், மறைவில் இருக்கும் உன் தந்தைக்குத் தெரியும்படி செய்; மறைவில் காண்கிற உன் தந்தை உனக்குப் பலன் அளிப்பார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπως
  choice: அதனால் … தெரியும்படியாக
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட செயலின் நோக்கத்தை அறிமுகப்படுத்தும் நோக்கப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: μὴ φανῇς τοῖς ἀνθρώποις νηστεύων
  choice: நீ நோன்பிருப்பது மனிதர்களுக்குத் தெரியாமல்
  rationale: φαίνω என்பதன் காணப்படுதல் அல்லது வெளிப்படுதல் என்ற பொருளைத் தமிழில் இயல்பாகத் தருகிறது. மனிதர்கள் என்பது ἀνθρώποις இன் பொதுவான, ஆண்-பெண் அனைவரையும் உள்ளடக்கும் பொருளைத் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: ἀλλὰ τῷ πατρί σου
  choice: உன் தந்தைக்குத் தெரியும்படியாக
  rationale: மனிதர்கள் மற்றும் தந்தை ஆகிய இரு பார்வையாளர்களுக்கிடையிலான ἀλλά எதிர்மறை இணைப்பைப் பாதுகாக்கிறது. தமிழில் தேவைப்படும் ‘தெரியும்படியாக’ என்பது முன் வினையின் பொருளை இயல்பாகத் தொடர்கிறது.
- source_word: τῷ ἐν τῷ κρυφαίῳ
  choice: மறைவில் இருக்கிற
  rationale: κρυφαίῳ என்பதை குறிப்பிட்ட ஓர் அறை அல்லது இடமாக மிகைப்படுத்தாமல், காணப்படாத மறைவான நிலையாகத் தருகிறது.
- source_word: ὁ βλέπων ἐν τῷ κρυφαίῳ
  choice: மறைவில் காண்கிற
  rationale: மூலத்தில் மீண்டும் வரும் ἐν τῷ κρυφαίῳ என்ற சொற்றொடரின் ஒத்திசைவைப் பாதுகாக்கிறது; ‘மறைவில் செய்யப்படுவதை’ என்று மூலத்தில் இல்லாத செயப்படுபொருளைச் சேர்க்கவில்லை.
- source_word: ἀποδώσει σοι
  choice: உனக்குப் பலன் அளிப்பார்
  rationale: இச்சூழலில் ἀποδίδωμι குறிக்கும் தெய்வீக பிரதிபலன் அல்லது வெகுமதியைத் தெளிவான, இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ἀνθρώποις என்பதன் பொதுப்பொருள்
  choice: மனிதர்கள்
  alternative: ஆட்கள்; மற்றவர்கள்
  rationale: இங்கு சொல் ஆண்களை மட்டும் அல்லாமல் மனிதப் பார்வையாளர்கள் அனைவரையும் குறிக்கிறது; ‘மனிதர்கள்’ அந்தப் பொதுப்பொருளை இயல்பாகப் பாதுகாக்கிறது.
- issue: κρυφαίῳ என்பதன் இருமுறை பயன்பாடு
  choice: இரு இடங்களிலும் ‘மறைவில்’
  alternative: மறைவான இடத்தில்; இரகசியத்தில்
  rationale: உண்மையான பக்தியின் மறைவான தன்மைக்கும் தந்தையின் காணுதலுக்கும் இடையிலான மொழிசார் தொடர்பைப் பாதுகாக்கிறது; குறிப்பிட்ட இடத்தை தேவையின்றி வரையறுக்கவில்லை.
- issue: மனிதர்களுக்குத் தெரியாமல், தந்தைக்குத் தெரியும்படியாக என்ற எதிர்மறை அமைப்பு
  choice: தந்தையின் அறிவுக்காகச் செய்யப்படுவதை வெளிப்படுத்தும் இயல்பான தமிழ் அமைப்பு
  alternative: மனிதர்களுக்கு நோன்பிருப்பவனாகத் தோன்றாமல், உன் தந்தைக்கோ தோன்றும்படியாக
  rationale: ‘தந்தைக்குத் தோன்றுதல்’ என்பது தமிழில் இயல்பற்றது. தேர்ந்த வடிவம் μὴ…ἀλλά என்ற எதிர்மறையைப் பாதுகாத்து, தந்தை மறைவில் காண்கிறவர் என்ற அடுத்த கூற்றோடும் பொருந்துகிறது; தந்தைக்கு தகவல் இல்லாதது போன்ற கருத்தை இது முன்வைப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; எளியதாயினும் கண்ணியமான நடை. ‘நோன்பிருப்பது’, ‘மறைவில்’, ‘பலன் அளிப்பார்’ ஆகியவை பொதுவாசகர்களுக்கு விளங்கும் சொற்களாகவும் மூலத்தின் மறுமொழி மற்றும் இறையியல் இறுக்கத்தைப் பாதுகாக்கும் வகையிலும் தேர்ந்தெடுக்கப்பட்டன.
