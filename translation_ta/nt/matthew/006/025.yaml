id: MAT.6.25
reference: Matthew 6:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Διὰ τοῦτο λέγω ὑμῖν· μὴ μεριμνᾶτε τῇ ψυχῇ ὑμῶν τί ⸀φάγητε, μηδὲ τῷ σώματι ὑμῶν τί ἐνδύσησθε· οὐχὶ ἡ ψυχὴ πλεῖόν ἐστι τῆς τροφῆς καὶ τὸ σῶμα τοῦ ἐνδύματος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/025.yaml
  text: Therefore I tell you[a], do not worry about your life, what you will eat, or about your body, what you will wear. Is not life more than food, and the body than clothing?
translation:
  language: ta
  text: 'ஆகையால் நான் உங்களுக்குச் சொல்கிறேன்: என்ன சாப்பிடுவீர்கள் என்று உங்கள் உயிரைப் பற்றியும், என்ன உடுத்துவீர்கள் என்று உங்கள் உடலைப் பற்றியும் கவலைப்படாதீர்கள். உணவைவிட உயிரும், உடையைவிட உடலும் மேலானவை அல்லவா?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உயிர்” என்பதற்கான கிரேக்கச் சொல் ψυχή; இதை “ஆத்துமா” என்றும் மொழிபெயர்க்கலாம். ஆனால் சாப்பிடுதல் மற்றும் உடை பற்றிய இச்சூழல் “உயிர்” என்ற பொருளை ஆதரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: ஆகையால்
  rationale: முந்தைய போதனையிலிருந்து வரும் முடிவை இயல்பாகவும் தெளிவாகவும் இணைக்கிறது.
- source_word: μεριμνᾶτε
  choice: கவலைப்படாதீர்கள்
  rationale: அளவுக்கு மீறிய மனக்கவலையைக் குறிக்கும் வினையின் பொருளை நவீனத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: ψυχῇ
  choice: உயிர்
  rationale: உணவு, உடல், உடை ஆகிய உடனடிச் சூழலில் ψυχή என்பது பிரித்துக் காட்டப்படும் ஆத்துமாவை மட்டும் அல்லாமல் ஒருவரின் உயிர் அல்லது வாழ்வைக் குறிக்கிறது.
- source_word: τί φάγητε
  choice: என்ன சாப்பிடுவோம்
  rationale: எதிர்காலத் தேவையைப் பற்றிய கவலையைத் தமிழில் இயல்பான மறைமுகக் கேள்வியாக வெளிப்படுத்துகிறது.
- source_word: σώματι
  choice: உடல்
  rationale: உடையுடன் ஒப்பிடப்படும் சரீர உடலை நேரடியாகக் குறிக்கிறது.
- source_word: τί ἐνδύσησθε
  choice: என்ன உடுத்துவோம்
  rationale: ஆடை அணிவதை இயல்பான, பொதுவான தமிழில் தெரிவிக்கிறது.
- source_word: οὐχὶ
  choice: அல்லவா?
  rationale: உடன்பாடான பதிலை எதிர்பார்க்கும் கிரேக்க வினாவைத் தமிழின் இயல்பான வினாவடிவில் காக்கிறது.
- source_word: πλεῖόν
  choice: மேலானவை
  rationale: வெறும் அளவை அல்லாமல் முக்கியத்துவத்திலும் மதிப்பிலும் உணவு மற்றும் உடையைவிட உயிரும் உடலும் மிகுந்தவை என்ற ஒப்பீட்டைத் தருகிறது.
- source_word: τροφῆς
  choice: உணவு
  rationale: உயிரைத் தாங்கும் உணவைக் குறிக்கும் நேரடியான நவீனத் தமிழ் சொல்.
- source_word: ἐνδύματος
  choice: உடை
  rationale: பொதுவாக அணியும் ஆடையைக் குறிக்கும் சுருக்கமான, இயல்பான சொல்.
theological_decisions:
- issue: ψυχή என்பதன் பொருள்
  choice: உயிர்
  alternative: ஆத்துமா
  rationale: இங்கு சாப்பிடுதல், உடல், உடை ஆகிய பொருட்சார் தேவைகளே சூழல். எனவே ψυχή ஒருவரின் உயிர் அல்லது வாழ்வைக் குறிக்கிறது; ‘ஆத்துமா’ என்று மொழிபெயர்ப்பது இவ்வசனம் தெளிவாகக் கூறாத உடல்–ஆத்துமா வேறுபாட்டை முன்னிறுத்தக்கூடும்.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையான பன்மை முன்னிலையுடன், கண்ணியமான வேதாகம நடையைப் பேணுகிறது. மூலத்தின் இரண்டு இணையான கவலைக் கூறுகளும் இறுதி சொல்லாட்சிக் கேள்வியும் பாதுகாக்கப்பட்டுள்ளன.
