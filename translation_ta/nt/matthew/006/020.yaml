id: MAT.6.20
reference: Matthew 6:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: θησαυρίζετε δὲ ὑμῖν θησαυροὺς ἐν οὐρανῷ, ὅπου οὔτε σὴς οὔτε βρῶσις ἀφανίζει, καὶ ὅπου κλέπται οὐ διορύσσουσιν οὐδὲ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/020.yaml
  text: But store up for yourselves treasures in heaven[a], where neither moth nor decay destroys[b], and where thieves do not break in and steal.
translation:
  language: ta
  text: ஆனால், பரலோகத்தில் உங்களுக்காகச் செல்வங்களைச் சேர்த்துவையுங்கள். அங்கே அந்துப்பூச்சியோ சிதைவோ[a] அழிப்பதில்லை; திருடர்கள் சுவரை உடைத்து உள்ளே நுழைவதுமில்லை, திருடுவதுமில்லை.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அரிப்பு’ அல்லது ‘துரு’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் பொருட்களை உட்கொண்டு அழிக்கும் சிதைவைப் பரந்த பொருளில் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, ‘தோண்டித் துளைக்கிறார்கள்.’ இது வீட்டின் சுவரைத் தோண்டித் துளைத்து நுழையும் திருடர்களைக் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: θησαυρίζετε
  choice: சேர்த்துவையுங்கள்
  rationale: நிகழ்காலக் கட்டளை தொடர்ந்து செய்ய வேண்டிய செயலைக் குறிக்கிறது. செல்வத்தைக் குவித்துப் பாதுகாப்பாக வைக்கும் உருவகத்தை இயல்பான நவீன தமிழில் இது தெரிவிக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தின் ‘சேர்த்துவைக்காதீர்கள்’ என்ற தடைக்கும் இவ்வசனத்தின் நேர்மறைக் கட்டளைக்கும் இடையிலான எதிர்மறைத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ὑμῖν
  choice: உங்களுக்காக
  rationale: பயன் பெறுபவரைக் குறிக்கும் வேற்றுமைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது; ‘உங்களுக்காகவே’ என்று தேவையற்ற வலியுறுத்தலைச் சேர்க்கவில்லை.
- source_word: θησαυροὺς
  choice: செல்வங்களை
  rationale: மூலத்தின் பன்மையைப் பாதுகாத்து, சேமித்து வைக்கப்படும் மதிப்புமிக்க பொருட்கள் என்ற உருவகத்தையும் தெளிவாகக் கொண்டுவருகிறது.
- source_word: ἐν οὐρανῷ
  choice: பரலோகத்தில்
  rationale: இடப்பொருளை நவீன வேதாகமத் தமிழில் இயல்பாகத் தருகிறது; உருவகத்தை விளக்கவுரையாக மாற்றவில்லை.
- source_word: σὴς
  choice: அந்துப்பூச்சி
  rationale: சேமித்து வைக்கப்பட்ட ஆடைகள் முதலியவற்றை அரிக்கும் பூச்சியைக் குறிக்கும் துல்லியமான, பொதுவாகப் புரியக்கூடிய சொல்.
- source_word: βρῶσις
  choice: சிதைவு
  rationale: ‘தின்னுதல்,’ ‘அரிப்பு,’ ‘துரு’ உள்ளிட்ட பரந்த அழிவுச் செயல்பாட்டைக் குறிக்கக்கூடிய சொல்லை உலோகத் துருவுக்கு மட்டும் சுருக்காமல் தருகிறது.
- source_word: ἀφανίζει
  choice: அழிப்பதில்லை
  rationale: ஒன்றை மறையச் செய்வது அல்லது முற்றிலும் கெடுப்பது என்ற பொருளை, அந்துப்பூச்சிக்கும் சிதைவுக்கும் பொருந்தும் வகையில் தெளிவாகத் தருகிறது.
- source_word: κλέπται
  choice: திருடர்கள்
  rationale: மூலத்தின் பன்மைப் பெயர்ச்சொல்லுக்கான நேரடியான, இயல்பான தமிழ் இணை.
- source_word: διορύσσουσιν
  choice: சுவரை உடைத்து உள்ளே நுழைந்து
  rationale: மண் அல்லது களிமண் சுவரைத் தோண்டித் துளைத்து நுழையும் பண்டைய திருட்டுமுறையை இன்றைய வாசகர் உடனடியாகப் புரிந்துகொள்ளும் வகையில் தருகிறது; மூலத்தின் நேரடிப் படிமம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: κλέπτουσιν
  choice: திருடுவதுமில்லை
  rationale: வினையின் எளிய பொருளைத் தருவதோடு, கிரேக்கத்தின் ‘οὐδὲ’ இணைப்பின் ‘அதுவும் இல்லை’ என்ற வலிமையையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘பரலோகத்தில் செல்வங்கள்’ என்பதன் இயல்பு
  choice: ‘பரலோகத்தில் ... செல்வங்கள்’ என்ற உருவகம் விளக்கமின்றிப் பாதுகாக்கப்பட்டது.
  alternative: ‘பரலோக வெகுமதிகள்’ அல்லது ‘ஆவிக்குரிய செல்வங்கள்’
  rationale: மூலம் அந்தச் செல்வங்கள் எவ்வகையானவை என்பதை இவ்வசனத்தில் விளக்கவில்லை. குறிப்பிட்ட வெகுமதி அல்லது புண்ணியக் கோட்பாட்டை மொழிபெயர்ப்புக்குள் கொண்டுவராமல் உண்மையான உருவகத் திறப்பைத் தக்கவைக்கிறது.
- issue: βρῶσις என்பதன் பொருள் வரம்பு
  choice: பரந்த பொருளுடைய ‘சிதைவு’
  alternative: ‘துரு’ அல்லது ‘அரிப்பு’ மட்டும்
  rationale: இயேசுவின் ஒப்பீட்டை உலோகத்தின் துருப்பிடிப்புக்கு மட்டும் வரையறுக்காமல், உலகச் செல்வத்தை உட்கொண்டு அழிக்கும் பலவகைச் சிதைவையும் உள்ளடக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘செல்வங்களைச் சேர்த்துவையுங்கள்’ என்பது மூல உருவகத்தைப் பாதுகாக்கிறது. இரண்டாம் வாக்கியத்தில் இணையான மறுப்பு அமைப்பு பேணப்பட்டுள்ளது; கலாசாரப் பின்னணி தேவைப்படும் διορύσσουσιν மட்டும் வாசிப்புக்கு இயல்பாக மொழிபெயர்க்கப்பட்டு அடிக்குறிப்பில் சொல்லர்த்தம் தரப்பட்டுள்ளது.
