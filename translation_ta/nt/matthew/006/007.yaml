id: MAT.6.7
reference: Matthew 6:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Προσευχόμενοι δὲ μὴ βατταλογήσητε ὥσπερ οἱ ἐθνικοί, δοκοῦσιν γὰρ ὅτι ἐν τῇ πολυλογίᾳ αὐτῶν εἰσακουσθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/007.yaml
  text: And when you pray[a], do not heap up empty words like the Gentiles[b], for they think that they will be heard because of their many words.
translation:
  language: ta
  text: நீங்கள் ஜெபிக்கும்போது, பிற இனத்தாரைப்[b] போலப் பொருளற்ற சொற்களை அடுக்காதீர்கள்[a]; ஏனெனில், அவர்கள் பல சொற்களைப் பேசுவதால் தங்கள் ஜெபம் கேட்கப்படும் என்று நினைக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பிதற்றாதீர்கள்’ அல்லது ‘பொருளற்ற சொற்களைத் திரும்பத் திரும்பச் சொல்லாதீர்கள்.’ இதற்கான கிரேக்க வினைச்சொல் அரிதானது; உண்மையான மனதுடன் மீண்டும் மீண்டும் செய்யப்படும் ஜெபத்தைக் காட்டிலும், பொருளற்ற, இயந்திரத்தனமான அல்லது அளவுக்கு மீறிய பேச்சையே இது குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘யூதரல்லாதவர்களைப்.’ கிரேக்கச் சொல் சொல்லர்த்தமாகப் பிற இனத்தாரை, அதாவது உடன்படிக்கை மக்களுக்கு வெளியே உள்ள தேசத்தாரைக் குறிக்கிறது. ‘புறமதத்தார்’ என்பது சூழலுக்கேற்ற மற்றொரு விளக்க மொழிபெயர்ப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσευχόμενοι
  choice: நீங்கள் ஜெபிக்கும்போது
  rationale: இந்தப் பங்கேற்புவினை கட்டளையின் நிகழும் சூழலைக் குறிக்கிறது. ‘ஜெபிக்கும்போது’ என்பது இயல்பான நவீனத் தமிழில் அந்த உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ அடுத்த போதனைக்குச் செல்லும் மென்மையான தொடர்ச்சியைக் குறிக்கிறது. தமிழில் வசனத்தை நேரடியாகத் தொடங்குவது அந்த ஓட்டத்தை இயல்பாகப் பாதுகாக்கிறது; ‘ஆனால்’ என மொழிபெயர்ப்பது தேவையற்ற முரண்பாட்டை ஏற்படுத்தும்.
- source_word: μὴ βατταλογήσητε
  choice: பொருளற்ற சொற்களை அடுக்கிக்கொண்டிருக்காதீர்கள்
  rationale: அரிதான βατταλογέω வெறும் திரும்பச் சொல்லுதலை மட்டும் அல்லாமல், பொருளற்ற, இயந்திரத்தனமான அல்லது அளவுக்கு மீறிய பேச்சைக் குறிப்பதாகத் தெரிகிறது. தேர்ந்தெடுக்கப்பட்ட சொற்றொடர் வெறுமையையும் சொற்பெருக்கத்தையும் வெளிப்படுத்துகிறது; உண்மையான மனதுடன் மீண்டும் ஜெபிப்பதெல்லாம் தடைசெய்யப்படுவதாகக் கூறவில்லை.
- source_word: ὥσπερ οἱ ἐθνικοί
  choice: பிற இனத்தாரைப் போல
  rationale: யூதச் சூழலில் ἐθνικοί என்பது உடன்படிக்கை மக்களுக்கு வெளியே இருந்த யூதரல்லாத மக்களைக் குறிக்கிறது. ‘பிற இனத்தார்’ இன/உடன்படிக்கைச் சூழலைப் பாதுகாக்கிறது; ‘புறமதத்தார்’ என்பது மத அடையாளத்தை அதிகமாக முன்னிறுத்தும் விளக்க மொழிபெயர்ப்பு.
- source_word: δοκοῦσιν
  choice: அவர்கள் நினைக்கிறார்கள்
  rationale: இது ஜெபம் எவ்வாறு கேட்கப்படும் என்பதைக் குறித்த அவர்களுடைய எண்ணம் அல்லது ஊகத்தை எளிய, இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐν τῇ πολυλογίᾳ αὐτῶν
  choice: தாங்கள் அதிகமாகப் பேசுவதால்
  rationale: πολυλογία மிகுதியான பேச்சையோ சொற்பெருக்கத்தையோ குறிக்கிறது. ἐν இங்கு அவர்கள் கேட்கப்படுவோம் என நம்பும் காரண அடிப்படையைச் சுட்டுவதால், காரணப்பொருளில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: εἰσακουσθήσονται
  choice: தங்கள் வேண்டுதல் கேட்கப்படும்
  rationale: வினைச்சொல் சாதகமாகக் கேட்கப்படுதல் அல்லது செவிகொடுக்கப்படுதல் என்ற பொருளைக் கொண்டது. தமிழில் வெறும் ‘அவர்கள் கேட்கப்படுவார்கள்’ என்பது இயல்பற்றதால் ‘தங்கள் வேண்டுதல் கேட்கப்படும்’ எனக் கூறப்பட்டுள்ளது; ‘பதில் கிடைக்கும்’ என்று வலுப்படுத்தப்படவில்லை.
theological_decisions:
- issue: இயேசு ஜெபத்தில் எல்லா விதமான திரும்பச் சொல்லுதலையும் தடைசெய்கிறாரா, அல்லது பொருளற்ற சொற்பெருக்கத்தையா தடைசெய்கிறார்?
  choice: ‘பொருளற்ற சொற்களை அடுக்கிக்கொண்டிருக்காதீர்கள்’ என்று மொழிபெயர்த்து, பொருளற்ற அல்லது இயந்திரத்தனமான சொற்பெருக்கமே கண்டிக்கப்படுகிறது என்பதைக் காட்டுதல்.
  alternative: ‘திரும்பத் திரும்பச் சொல்லாதீர்கள்’ அல்லது ‘பிதற்றாதீர்கள்.’
  rationale: அரிதான கிரேக்க வினைச்சொல்லின் பொருள் வரம்பைப் பாதுகாக்கும் அதே வேளையில், உண்மையான மனதுடன் செய்யப்படும் எல்லா தொடர் அல்லது மீளுரைப் ஜெபங்களும் தடைசெய்யப்படுகின்றன என்ற தேவையற்ற இறையியல் முடிவை இது தவிர்க்கிறது. அதிகமான சொற்களே தெய்வீகக் கவனத்தைப் பெற்றுத் தரும் என்ற எண்ணமே சூழலில் விமர்சிக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘ஜெபம்’ என்பது பரவலாக அறியப்பட்ட சமயச் சொல். ‘பொருளற்ற சொற்களை அடுக்கிக்கொண்டிருக்காதீர்கள்’ என்பது அரிதான கிரேக்க வினையின் வெறுமை, தொடர்ச்சி, சொற்பெருக்கு ஆகிய நுணுக்கங்களை இயல்பான தமிழில் தாங்குகிறது.
