id: MAT.6.2
reference: Matthew 6:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὅταν οὖν ποιῇς ἐλεημοσύνην, μὴ σαλπίσῃς ἔμπροσθέν σου, ὥσπερ οἱ ὑποκριταὶ ποιοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς ῥύμαις, ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων· ἀμὴν λέγω ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/002.yaml
  text: Therefore[a], whenever you give alms, do not sound a trumpet before you, as the hypocrites do in the synagogues and in the streets, so that they may be glorified by people. Truly I say to you[e][d][c][b], they have received their reward in full.
translation:
  language: ta
  text: 'ஆகவே, நீ[e] ஏழைகளுக்குக் கொடுக்கும்போதெல்லாம்[a], வெளிவேடக்காரர்கள் மக்களால் மகிமைப்படுத்தப்படுவதற்காக[c] ஜெபக்கூடங்களிலும் தெருக்களிலும் செய்வதைப்போல், உனக்கு முன்னால் எக்காளம் ஊதாதே[b]. உறுதியாக உங்களுக்குச் சொல்கிறேன்: அவர்கள் தங்களுக்குரிய பலனை முழுமையாகப் பெற்றுவிட்டார்கள்[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இரக்கச் செயல் செய்யும்போது’ அல்லது ‘தர்மம் செய்யும்போது’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க மரபுத்தொடர் தேவையிலிருப்போருக்குச் செய்யும் பொருளுதவியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அதை எக்காளம் ஊதி அறிவிக்காதே’ என்றும் பொருள் கொள்ளலாம். இது மிகைப்படுத்தலாகவோ உருவகமாகவோ இருக்கலாம்; ஆனால் கிரேக்க வாசகம் நேரடியாக ‘எக்காளம் ஊதாதே’ என்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘மக்களால் பாராட்டப்படுவதற்காக’ அல்லது ‘மதிக்கப்படுவதற்காக’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல்லின் நேரடியான பொருள் ‘மகிமைப்படுத்தப்படுதல்.’
    reason: lexical_alternative
  - marker: d
    text: '‘முழுமையாகப் பெற்றுவிட்டார்கள்’ என்பது வணிகத் துறையில் பயன்படுத்தப்பட்ட ஒரு மரபுத்தொடரின் பொருளைப் பிரதிபலிக்கிறது: அவர்களுக்குக் கிடைக்கவிருந்த பலன் முழுவதும் ஏற்கெனவே கிடைத்துவிட்டது.'
    reason: cultural_note
  - marker: e
    text: இந்தக் கட்டளையில் கிரேக்க மூலவாசகம் ஒருவரை நோக்கி ‘நீ’ என்கிறது; பின்னர் ‘உங்களுக்குச் சொல்கிறேன்’ என்பதில் கேட்போர் அனைவரையும் பன்மையில் நோக்குகிறது.
    reason: grammar_note
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: ஆகவே, ... போதெல்லாம்
  rationale: οὖν முந்தைய போதனையுடன் உள்ள முடிவுறு தொடர்பைக் காட்டுகிறது; ὅταν மற்றும் subjunctive இணைப்பு பொதுவாக அல்லது மீண்டும் நிகழும் சூழலைக் குறிப்பதால் ‘போதெல்லாம்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ποιῇς ἐλεημοσύνην
  choice: ஏழைகளுக்குக் கொடுக்கும்போதெல்லாம்
  rationale: இந்த கிரேக்க மரபுத்தொடர் இரக்கத்தின் அடிப்படையில் ஏழைகளுக்குச் செய்யும் பொருளுதவியைக் குறிக்கிறது. ‘தர்மம் செய்’ என்பதைவிட இச்சொற்றொடர் இன்றைய வாசகருக்கு செயலைத் தெளிவாகக் கூறுகிறது.
- source_word: μὴ σαλπίσῃς ἔμπροσθέν σου
  choice: உனக்கு முன்னால் எக்காளம் ஊதாதே
  rationale: மூலத்தின் உயிரோட்டமான, ஒருவேளை மிகைப்படுத்தப்பட்ட படிமம் விளக்கவுரையாக மாற்றப்படாமல் நேரடியாகத் தக்கவைக்கப்பட்டுள்ளது.
- source_word: ὑποκριταὶ
  choice: வெளிவேடக்காரர்கள்
  rationale: பிறர் பார்ப்பதற்காக பக்திச் செயலை நடிப்பவர்களைச் சூழலுக்கேற்றவாறு குறிக்கிறது; வெறும் மேடை நடிகர் என்ற வரலாற்றுப் பொருளைத் தேவையின்றி முன்னிறுத்தவில்லை.
- source_word: συναγωγαῖς καὶ ῥύμαις
  choice: ஜெபக்கூடங்களிலும் தெருக்களிலும்
  rationale: சமயக் கூடங்களையும் பொதுவெளியையும் இயல்பான நவீனத் தமிழில் வேறுபடுத்திக் காட்டுகிறது.
- source_word: ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων
  choice: மக்களால் மகிமைப்படுத்தப்படுவதற்காக
  rationale: ἀνθρώπων இங்கு ஆண் பாலாரை மட்டும் அல்லாமல் மனிதர்களைப் பொதுவாகக் குறிக்கிறது. δοξάζω என்பதன் வலிமையான ‘மகிமைப்படுத்து’ என்ற சொல்லாக்கம் மெலிதாக்கப்படாமல் தக்கவைக்கப்பட்டுள்ளது.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: உறுதியாக உங்களுக்குச் சொல்கிறேன்
  rationale: இயேசுவின் அதிகாரமிக்க உறுதிமொழிச் சூத்திரத்தின் வலிமையை இயல்பான தமிழில் வழங்குகிறது.
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: அவர்கள் தங்களுக்கான கைம்மாறை முழுமையாகப் பெற்றுவிட்டார்கள்
  rationale: ἀπέχω என்பதிலுள்ள வணிகப் பயன்பாடு, இனி எதுவும் நிலுவையில் இல்லாதபடி முழுத் தொகையையும் பெற்றுவிட்ட நிலையைச் சுட்டுகிறது.
theological_decisions:
- issue: δοξασθῶσιν என்பதன் வலிமை
  choice: மகிமைப்படுத்தப்படுவதற்காக
  alternative: பாராட்டப்படுவதற்காக / மதிக்கப்படுவதற்காக
  rationale: ‘மகிமைப்படுத்து’ என்பது மூல வினையின் வலிமையையும், சுற்றியுள்ள பகுதியில் மனித அங்கீகாரத்துக்கும் கடவுளிடமிருந்து வரும் கைம்மாறுக்கும் இடையிலான பதற்றத்தையும் தக்கவைக்கிறது.
- issue: இரண்டாம் நபர் எண்ணில் ஏற்படும் மாற்றம்
  choice: ‘நீ/உனக்கு’ என்ற ஒருமையையும் ‘உங்களுக்கு’ என்ற பன்மையையும் தக்கவைத்தல்
  alternative: எங்கும் மரியாதைப் பன்மையான ‘நீங்கள்/உங்களுக்கு’ பயன்படுத்துதல்
  rationale: ποιῇς மற்றும் σου தனிநபரை ஒருமையில் நோக்குகின்றன; ὑμῖν சீடர் கூட்டத்தைப் பன்மையில் நோக்குகிறது. தமிழில் சற்றுத் திடமானதாக இருந்தாலும், மூலத்தின் நோக்கமுள்ள எண்ணியல் மாற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் போதனையின் கண்ணியமான நேரடித் தொனியைத் தக்கவைத்தும் மொழிபெயர்க்கப்பட்டது. ‘வெளிவேடக்காரர்கள்,’ ‘மகிமைப்படுத்தப்படுதல்,’ ‘கைம்மாறு’ ஆகிய சொற்கள் உரையின் ஒழுக்க மற்றும் இறையியல் வலிமையைப் பாதுகாக்கின்றன. மூலத்தில் உள்ள ஒருமை–பன்மை மாற்றம் திட்டமிட்டு விடப்படவில்லை.
