  to: 'ஆகவே, நீ[e] ஏழைகளுக்குக் கொடுக்கும்போதெல்லாம்[a], வெளிவேடக்காரர்கள் மக்களால் மகிமைப்படுத்தப்படுவதற்காக[c] ஜெபக்கூடங்களிலும் தெருக்களிலும் செய்வதைப்போல், உனக்கு முன்னால் எக்காளம் ஊதாதே[b]. உறுதியாக உங்களுக்குச் சொல்கிறேன்: அவர்கள் தங்களுக்குரிய பலனை முழுமையாகப் பெற்றுவிட்டார்கள்[d].'
  rationale: The revision corrects the Tamil comparative construction so that the hypocrites’ corresponding action is naturally understood, and replaces the less direct ‘கைம்மாறு’ with ‘பலன்’ for the Greek μισθός. No theological or interpretive expansion has been introduced; the source’s vivid trumpet image, human acclaim, and singular-to-plural shift are retained.
