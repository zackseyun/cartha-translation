reference: Matthew 6:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὅταν δὲ νηστεύητε, μὴ γίνεσθε ⸀ὡς οἱ ὑποκριταὶ σκυθρωποί, ἀφανίζουσιν γὰρ τὰ πρόσωπα αὐτῶν ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/016.yaml
  text: And whenever you fast[a], do not become gloomy like the hypocrites, for they disfigure their faces so that they may appear to people to be fasting. Truly I say to you, they have received their reward in full.
translation:
  language: ta
  text: 'நீங்கள் நோன்பிருக்கும்போதெல்லாம், வெளிவேடக்காரரைப்போல் முகத்தை வாட்டிக்கொள்ளாதீர்கள். ஏனெனில், தாங்கள் நோன்பிருப்பது மக்களுக்குத் தெரியவேண்டும் என்பதற்காக அவர்கள் தங்கள் முகத்தைக் குலைத்துக்கொள்கிறார்கள். உண்மையாகவே உங்களுக்குச் சொல்கிறேன்: அவர்கள் தங்களுக்குரிய பலனை முழுமையாகப் பெற்றுவிட்டார்கள்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅταν δὲ νηστεύητε
  choice: நீங்கள் நோன்பிருக்கும்போதெல்லாம்
  rationale: ὅταν என்பதன் மீண்டும் நிகழக்கூடிய காலப்பொருளை ‘போதெல்லாம்’ இயல்பாக வெளிப்படுத்துகிறது; δέ தனியாக மொழிபெயர்க்கப்படாமல் முந்தைய இணையான போதனைகளுடனான தொடர்ச்சி தமிழ் நடைமுறையில் விடப்பட்டுள்ளது.
- source_word: μὴ γίνεσθε ... σκυθρωποί
  choice: முகத்தை வாட்டிக்கொள்ளாதீர்கள்
  rationale: γίνεσθε என்பதிலுள்ள ஒரு தோற்றத்தை ஏற்றுக்கொள்ளும் நுணுக்கத்தையும் σκυθρωποί குறிக்கும் வேண்டுமென்றே காட்டப்படும் சோகமான முகத்தையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: ὡς οἱ ὑποκριταί
  choice: வெளிவேடக்காரரைப்போல்
  rationale: ὑποκριτής இங்கு உள்ளார்ந்த பக்திக்கு மாறாக பிறர் காணும்படி பக்தியைக் காட்டுபவரைக் குறிக்கிறது; ‘வெளிவேடக்காரர்’ நவீன வாசகருக்குத் தெளிவான, மதிப்புமிக்க சொல்.
- source_word: ἀφανίζουσιν ... τὰ πρόσωπα αὐτῶν
  choice: அவர்கள் தங்கள் முகத்தைக் குலைத்துக்கொள்கிறார்கள்
  rationale: வினைச்சொல்லின் சூழல்சார் பொருள் முகத்தோற்றத்தை மாற்றுதல் அல்லது அலங்கோலப்படுத்துதல்; ‘குலைத்துக்கொள்கிறார்கள்’ திட்டமிட்ட தோற்றமாற்றத்தைத் தெரிவிக்கிறது, ஆனால் குறிப்பிட்ட முறையை ஊகிக்கவில்லை.
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες
  choice: தாங்கள் நோன்பிருப்பது மக்களுக்குத் தெரியவேண்டும் என்பதற்காக
  rationale: ὅπως நோக்கத்தையும் φανῶσιν என்பதன் ‘காணப்படுதல்/தெரிதல்’ பொருளையும் இயல்பான தமிழில் தருகிறது. ἄνθρωποι இங்கு மனிதர்களைப் பொதுவாகக் குறிப்பதால் ‘மக்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: உண்மையாகவே உங்களுக்குச் சொல்கிறேன்
  rationale: இயேசுவின் அதிகாரமிக்க உறுதிமொழிச் சூத்திரத்தின் வலிமையை இயல்பான, கண்ணியமான தமிழில் காக்கிறது.
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: அவர்கள் தங்களுக்குரிய பலனை முழுமையாகப் பெற்றுவிட்டார்கள்
  rationale: ἀπέχω என்பதன் வணிக வழக்கிலுள்ள ‘முழுத் தொகையையும் பெற்றுவிட்டார்; மேலும் கோர எதுவுமில்லை’ என்ற நிறைவு நுணுக்கத்தை ‘முழுமையாகப் பெற்றுவிட்டார்கள்’ வெளிப்படுத்துகிறது; μισθός இச்சூழலில் ‘பலன்’ எனப் பொருந்துகிறது.
theological_decisions:
- issue: τοῖς ἀνθρώποις என்பதன் பொதுப்பொருள்
  choice: மக்களுக்குத்
  alternative: மனிதர்களுக்குத் / ஆட்களுக்குத்
  rationale: கிரேக்கப் பன்மை இலக்கண வடிவில் ஆண்பாலாக இருந்தாலும் இங்கு மனிதர்களைப் பொதுவாகக் குறிக்கிறது. ‘மக்கள்’ பாலினத்தைத் தேவையின்றிக் குறுக்காமல் மூலத்தின் நோக்கத்தை இயல்பான தமிழில் தருகிறது.
- issue: ἀπέχουσιν τὸν μισθὸν αὐτῶν என்பதன் நிறைவு சார்ந்த உவமைவழக்கு
  choice: பலனை முழுமையாகப் பெற்றுவிட்டார்கள்
  alternative: அவர்களுக்குரிய பலன் அவர்களுக்குக் கிடைத்துவிட்டது
  rationale: இச்சொற்றொடர் பலன் கிடைத்ததை மட்டும் அல்ல, அது முழுவதும் ஏற்கெனவே கிடைத்துவிட்டதால் மேலான பலன் எஞ்சவில்லை என்ற சூழல்சார் எச்சரிக்கையையும் சுட்டுகிறது; இதை வெளிப்படையாகச் சொல்வது மூல உவமைவழக்கைத் துல்லியமாக எடுத்துரைக்கிறது.
- issue: நோன்பின் மதிப்பைப் பற்றிய வசனத்தின் நிலைப்பாடு
  choice: நோன்பை அல்ல, மனிதர் பாராட்டுவதற்கான வெளிவேடத்தை கண்டிக்கும் வகையில் மொழிபெயர்ப்பு
  alternative: நோன்பையே எதிர்மறையாகக் காட்டும் வாசிப்பு
  rationale: ‘நீங்கள் நோன்பிருக்கும்போதெல்லாம்’ என்பது நோன்பு நிகழ்வதை முன்னிட்டுப் பேசுகிறது; கண்டனம் நோன்பின் மீது அல்ல, பிறருக்குத் தெரியச் செய்யப்படும் தோற்றத்தின் மீது விழுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் போதனையின் தீவிரமும் காக்கப்பட்டுள்ளன. தேவையற்ற வடமொழிச் சுமையைத் தவிர்த்து, ‘நோன்பு’, ‘வெளிவேடக்காரர்’, ‘பலன்’ போன்ற பரவலாகப் புரியும் வேதாகமச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. இவ்வசனத்திற்கு தனி அடிக்குறிப்பு அவசியமில்லை; ஆகவே முதன்மை உரையில் அடிக்குறிப்பு குறியீடு சேர்க்கப்படவில்லை.
