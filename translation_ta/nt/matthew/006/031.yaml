  to: ஆகவே, ‘என்ன சாப்பிடுவோம்?’ அல்லது ‘என்ன குடிப்போம்?’ அல்லது ‘என்ன உடுத்திக்கொள்வோம்?’ என்று சொல்லிக் கவலைப்படாதீர்கள்.[a]
