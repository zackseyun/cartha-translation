id: MAT.6.31
reference: Matthew 6:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μὴ οὖν μεριμνήσητε λέγοντες· Τί φάγωμεν; ἤ· Τί πίωμεν; ἤ· Τί περιβαλώμεθα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/031.yaml
  text: Therefore do not worry[a], saying, ‘What will we eat?’ or ‘What will we drink?’ or ‘What will we wear?’
translation:
  language: ta
  text: ஆகவே, ‘என்ன சாப்பிடுவோம்?’ அல்லது ‘என்ன குடிப்போம்?’ அல்லது ‘என்ன உடுத்திக்கொள்வோம்?’ என்று சொல்லிக் கவலைப்படாதீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பதற்றப்படாதீர்கள்.’
    reason: μεριμνάω என்பதன் கவலை மற்றும் பதற்றம் சார்ந்த பொருள் நிழலைக் காட்டும் சொல் மாற்று.
lexical_decisions:
- source_word: μὴ οὖν μεριμνήσητε
  choice: ஆகவே ... கவலைப்படாதீர்கள்
  rationale: οὖν முந்தைய வாதத்திலிருந்து வரும் முடிவை ‘ஆகவே’ என்று காட்டுகிறது. μεριμνάω இச்சூழலில் அத்தியாவசியத் தேவைகளைக் குறித்த பதற்றமான கவலையைக் குறிக்கிறது; ‘கவலைப்படாதீர்கள்’ என்பது இயல்பான நவீனத் தமிழ், மேலும் μή உடன் வரும் தடை வலிமையையும் காக்கிறது.
- source_word: λέγοντες
  choice: என்று சொல்லிக்
  rationale: இந்தப் பங்கேற்புவினை, கவலை வெளிப்படும் முறையை அடுத்து வரும் கேள்விகளோடு இணைக்கிறது. ‘என்று சொல்லிக் கவலைப்படாதீர்கள்’ என்பது தமிழில் இயல்பாக அந்த உறவை வெளிப்படுத்துகிறது.
- source_word: Τί
  choice: எதை / எதைக்
  rationale: τί அத்தியாவசியப் பொருட்களைப் பற்றிய நேரடிக் கேள்விகளைத் தொடங்குகிறது. வினைகளுக்கேற்ற வேற்றுமை உருபுடன் ‘எதை/எதைக்’ என்பது இயல்பான தமிழ்.
- source_word: φάγωμεν
  choice: சாப்பிடுவோம்
  rationale: இது எதிர்கால உணவுத் தேவையைப் பற்றிய ஆலோசனைத் தன்மையுள்ள கேள்வி. ‘சாப்பிடுவோம்’ என்பது சாதாரண மக்களுக்குப் புரியும் இயல்பான நவீனத் தமிழ்.
- source_word: πίωμεν
  choice: குடிப்போம்
  rationale: φάγωμεν என்பதற்கு இணையான, எதிர்காலப் பானத் தேவையைப் பற்றிய கேள்வி; ‘குடிப்போம்’ அதன் இயல்பான தமிழ் வடிவம்.
- source_word: περιβαλώμεθα
  choice: உடுத்திக்கொள்வோம்
  rationale: περιβάλλω இங்கு ஆடையை அணிவதைக் குறிக்கிறது. ‘உடுத்திக்கொள்வோம்’ மூலத்தின் நடுநிலை/தற்சுட்டு வடிவின் சுவையைத் தக்கவைத்தபடியே நவீனத் தமிழில் இயல்பாக உள்ளது.
- source_word: ἤ ... ἤ ... ἤ
  choice: அல்லது ... அல்லது
  rationale: மூன்று கவலைக் கேள்விகளைப் பிரிக்கும் தொடர் மாற்றுகள் தமிழில் ‘அல்லது’ மூலம் தெளிவாகக் காக்கப்படுகின்றன; முதலாவது கேள்விக்கு முன் உள்ள கிரேக்க ἤ தமிழின் வாக்கிய அமைப்பில் தனியே மொழிபெயர்க்கத் தேவையில்லை.
theological_decisions:
- issue: பொருள் தேவைகளைப் பற்றிய இயேசுவின் தடையின் தன்மை
  choice: μεριμνήσητε என்பதைப் பதற்றமான கவலைக்கான தடையாக மொழிபெயர்த்தல்
  alternative: எந்தவித அக்கறையும் கொள்ளாதீர்கள்
  rationale: உடனடிச் சூழல் உணவு, பானம், உடை ஆகியவற்றின் ஏற்பாட்டைப் பற்றிய பதற்றத்தைச் சுட்டுகிறது; பொறுப்பான முன்திட்டமிடலை முழுமையாகத் தடைசெய்வதாக உரை சொல்லவில்லை. ‘கவலைப்படாதீர்கள்’ என்பது உரையின் வலிமையைக் காக்கிறது, அதேவேளை தேவையற்ற முழுமைப்படுத்தலைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், மரியாதையான நடை. நேரடிக் கேள்விகளின் மூவகை இணை அமைப்பு காக்கப்பட்டுள்ளது.
