revisions:
- from: ஆனால், நீங்கள் மனிதர்களை மன்னிக்காவிட்டால், உங்கள் தந்தையும் உங்கள் குற்றங்களை[a] மன்னிக்கமாட்டார்.
  to: ஆனால் நீங்கள் மனிதர்களை மன்னிக்காவிட்டால், உங்கள் தந்தையும் உங்கள் மீறுதல்களை[a] மன்னிக்கமாட்டார்.
  rationale: The revision retains the direct, unresolved conditional relationship and the lexical repetition of ‘forgive.’ It narrows neither the identity of ‘people’ nor the meaning of ‘your Father,’ while using a less criminally specific rendering for παραπτώματα and preserving viable alternatives in the anchored footnote.
