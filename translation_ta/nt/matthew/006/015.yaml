  terminology: ‘தந்தை’ faithfully reflects ὁ πατήρ without importing ‘heavenly.’ ‘மன்னி’ consistently renders both instances of ἀφίημι. Rendering παραπτώματα as ‘மீறுதல்கள்’ better preserves its moral-offense range; lexical alternatives are retained in the footnote.
  issues:
