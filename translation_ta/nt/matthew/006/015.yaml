base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/015.yaml
  text: But if you do not forgive people[a], neither will your Father forgive your trespasses.
translation:
  language: ta
  text: ஆனால் நீங்கள் மனிதர்களை மன்னிக்காவிட்டால், உங்கள் தந்தையும் உங்கள் மீறுதல்களை[a] மன்னிக்கமாட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘குற்றங்களை’ அல்லது ‘தவறான செயல்களை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ μὴ
  choice: ஆனால், ... மன்னிக்காவிட்டால்
  rationale: ἐάν நிபந்தனையையும், δέ முந்தைய வசனத்துடனான மாறுபாட்டையும், μή மறுப்பையும் குறிக்கின்றன. இயல்பான நவீனத் தமிழில் இவை ‘ஆனால் ... மன்னிக்காவிட்டால்’ என்று ஒருங்கிணைக்கப்பட்டுள்ளன.
- source_word: ἀφῆτε
  choice: மன்னிக்காவிட்டால்
  rationale: இந்தச் சூழலில் ἀφίημι என்பது பிறர் செய்த குற்றத்தை மன்னிப்பதைக் குறிக்கிறது. நிபந்தனையும் மறுப்பும் தமிழ் வினை வடிவிலேயே இயல்பாக வெளிப்படுத்தப்பட்டுள்ளன.
- source_word: τοῖς ἀνθρώποις
  choice: மனிதர்களை
  rationale: ἄνθρωποι என்பது ஆண்களை மட்டும் அல்லாமல் பொதுவாக மனிதர்களைக் குறிக்கிறது. ‘மனிதர்களை’ என்பது மூலத்தின் வெளிப்படையான பொதுப்பொருளைப் பேணுகிறது.
- source_word: οὐδὲ
  choice: உங்கள் தந்தையும் ... மன்னிக்கமாட்டார்
  rationale: எதிர்மறை நிபந்தனைக்கு இணையான எதிர்மறை விளைவை οὐδέ வலியுறுத்துகிறது. தமிழில் ‘-உம் ... மாட்டார்’ என்ற அமைப்பு ‘neither’ என்ற இணைப்புப் பொருளை இயல்பாகத் தருகிறது.
- source_word: ὁ πατὴρ ὑμῶν
  choice: உங்கள் தந்தை
  rationale: மூலத்தில் ‘உங்கள் தந்தை’ என்றே உள்ளது; ‘பரலோகத் தந்தை’ போன்ற கூடுதல் விளக்கம் சேர்க்கப்படவில்லை.
- source_word: ἀφήσει
  choice: மன்னிக்கமாட்டார்
  rationale: முதல் ἀφίημι போலவே இதுவும் ‘மன்னி’ என்று மொழிபெயர்க்கப்பட்டதால் வசனத்தின் சொல் மறுபயன்பாடும் ஒத்த அமைப்பும் பாதுகாக்கப்படுகின்றன.
- source_word: τὰ παραπτώματα ὑμῶν
  choice: உங்கள் குற்றங்களை
  rationale: παραπτώματα என்பது தவறான அடிகள், குற்றங்கள், மீறுதல்கள் ஆகிய பொருட்களை உடையது. ‘குற்றங்கள்’ நவீனத் தமிழில் தெளிவாகவும் அறநெறிசார் கனத்தைப் பேணுவதாகவும் உள்ளது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
theological_decisions:
- issue: மனிதர்கள் மன்னிப்பதற்கும் கடவுள் மன்னிப்பதற்கும் இடையிலான நிபந்தனைத் தொடர்பு
  choice: மூலத்தில் உள்ள நேரடியான நிபந்தனை வாக்கியம் மென்மைப்படுத்தப்படாமல் வைக்கப்பட்டுள்ளது.
  alternative: இதை மனித மன்னிப்பு வெறும் அடையாளம் என்பதாகவோ, கடவுளுடனான உறவின் நெருக்கத்தை மட்டும் இழப்பதாகவோ விளக்கி மொழிபெயர்த்தல்.
  rationale: கிரேக்க உரை நேரடியான நிபந்தனையையும் அதன் விளைவையும் கூறுகிறது. பரந்த இறையியல் விவாதத்தை மொழிபெயர்ப்பில் தீர்மானிக்காமல், ‘உங்கள் தந்தையும் ... மன்னிக்கமாட்டார்’ என்ற உரையின் பதற்றம் அப்படியே பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘தந்தை’ என்பது மூலத்தின் உறவுச் சொல்லைத் துல்லியமாகப் பேணுகிறது; வசனத்தில் இல்லாத ‘பரலோக’ என்ற சொல் சேர்க்கப்படவில்லை.
