reference: Matthew 6:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Οὕτως οὖν προσεύχεσθε ὑμεῖς· Πάτερ ἡμῶν ὁ ἐν τοῖς οὐρανοῖς· ἁγιασθήτω τὸ ὄνομά σου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/009.yaml
  text: 'Therefore[a], you should pray like this: Our Father in the heavens, may your name be treated as holy[b],'
translation:
  language: ta
  text: 'ஆகவே, நீங்கள் இவ்வாறு ஜெபியுங்கள்: “பரலோகங்களில் இருக்கிற எங்கள் தந்தையே, உமது பெயர் பரிசுத்தமானதாக மதிக்கப்படுவதாக,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὕτως οὖν
  choice: ஆகவே, ... இவ்வாறு
  rationale: οὖν முந்தைய போதனையிலிருந்து வரும் முடிவைச் சுட்டுகிறது; Οὕτως ஜெபிக்க வேண்டிய முறையையோ மாதிரியையோ குறிக்கிறது. இவ்விரண்டையும் இயல்பான நவீனத் தமிழில் தனித்தனியாகப் பாதுகாக்கிறது.
- source_word: προσεύχεσθε ὑμεῖς
  choice: நீங்கள் ... ஜெபியுங்கள்
  rationale: இது பன்மை ஏவல் வடிவம்; வெளிப்படையாக உள்ள ὑμεῖς என்பதன் வலியுறுத்தலை ‘நீங்கள்’ தக்கவைக்கிறது.
- source_word: Πάτερ ἡμῶν
  choice: எங்கள் தந்தையே
  rationale: நேரடி அழைப்பையும் குழுவை உள்ளடக்கும் ‘எங்கள்’ என்ற பன்மை உடைமையையும் இயல்பாகப் பாதுகாக்கிறது. ‘தந்தையே’ என்பது நவீனத் தமிழில் கண்ணியமான அழைப்பு வடிவம்.
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: பரலோகங்களில் இருக்கிற
  rationale: மூலத்தில் οὐρανοῖς பன்மையில் உள்ளது. ‘பரலோகங்களில்’ அதை வெளிப்படையாகத் தக்கவைக்கிறது; ὁ என்பதன் தொடர்புச் சொல்லின் தன்மை ‘இருக்கிற’ என்பதால் இயல்பாக வெளிப்படுகிறது.
- source_word: ἁγιασθήτω
  choice: பரிசுத்தமானதாகப் போற்றப்படுவதாக
  rationale: இறைவனுடைய பெயர் பரிசுத்தமானது என மதிக்கப்பட்டு மரியாதை செய்யப்பட வேண்டும் என்ற செயப்பாட்டு ஏவல்/வேண்டுதல் பொருளைத் தெளிவாகக் கூறுகிறது; வெறுமனே ‘பரிசுத்தமாக்கப்படுவதாக’ என்பது பெயர் முன்பு பரிசுத்தமற்றது போன்ற தவறான எண்ணத்தைத் தரக்கூடும்.
- source_word: τὸ ὄνομά σου
  choice: உமது பெயர்
  rationale: மூலத்தின் ‘உமது பெயர்’ என்ற சொற்களை நேரடியாகத் தக்கவைக்கிறது; ‘பெயர்’ என்பதிலுள்ள நற்பெயர், வெளிப்படுத்தப்பட்ட இயல்பு போன்ற விரிந்த வேதாகமப் பொருளை உரைக்குள்ளேயே விளக்கி வரையறுக்கவில்லை.
theological_decisions:
- issue: தெய்வீக அழைப்போடு வரும் இடவியல் சொற்றொடர்
  choice: பரலோகங்களில் இருக்கிற எங்கள் தந்தையே
  alternative: பரலோகத்தில் இருக்கிற எங்கள் தந்தையே / எங்கள் பரலோகத் தந்தையே
  rationale: τοῖς οὐρανοῖς என்ற கிரேக்கப் பன்மையைப் பாதுகாத்து, ‘தந்தை’ என்ற நெருக்கத்தையும் ‘பரலோகங்கள்’ என்ற மேன்மையையும் தக்கவைக்கிறது. ‘பரலோகத் தந்தை’ என்பது இடவியல் சொற்றொடரை பண்புப்பெயராக மாற்றிவிடும்.
- issue: ἁγιασθήτω என்பதன் பரிசுத்தத்தைக் குறிக்கும் வேண்டுதல்
  choice: உமது பெயர் பரிசுத்தமானதாகப் போற்றப்படுவதாக
  alternative: உமது பெயர் பரிசுத்தமாக்கப்படுவதாக / உமது பெயர் தூயதென மதிக்கப்படுவதாக
  rationale: பெயரை மனிதர்கள் பரிசுத்தமானதாகக் கருதி மதிக்க வேண்டும் என்ற வேண்டுதலை அணுகத்தக்க தமிழில் எடுத்துரைக்கிறது; பெயரின் உட்பிறந்த பரிசுத்தத்தை மறுப்பதாகவோ அதை மனிதர்கள் பரிசுத்தமாக மாற்றுவதாகவோ பொருள் கட்டாயப்படுத்தப்படுவதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான ஜெப மொழிநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஜெபியுங்கள்’, ‘உமது’ ஆகியவை பொதுவாகப் புரியும் வேதாகமப் பதிவைத் தக்கவைக்கின்றன; கிரேக்கப் பன்மையான ‘பரலோகங்களில்’ மொழிபெயர்ப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
