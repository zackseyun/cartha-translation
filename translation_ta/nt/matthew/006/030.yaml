id: MAT.6.30
reference: Matthew 6:30
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ δὲ τὸν χόρτον τοῦ ἀγροῦ σήμερον ὄντα καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ἀμφιέννυσιν, οὐ πολλῷ μᾶλλον ὑμᾶς, ὀλιγόπιστοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/030.yaml
  text: But if God so clothes the grass of the field[a], which is here today and tomorrow is thrown into an oven, will he not much more clothe you[b], you of little faith?
translation:
  language: ta
  text: ஆனால், இன்று இருக்கும், நாளை அடுப்பில்[a] எறியப்படும் வயலின் புல்லுக்குக் கடவுள் இவ்வாறு உடை அணிவிக்கிறார் என்றால், உங்களுக்கு அவர் இன்னும் எவ்வளவு அதிகமாக உடை அணிவிப்பார் அல்லவா, நம்பிக்கை குறைந்தவர்களே?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அடுப்பு” என்பது அப்பம் சுடும் அடுப்பைக் குறிக்கிறது; காய்ந்த புல்லும் வயல்வெளிச் செடிகளும் எரிபொருளாகப் பயன்படுத்தப்பட்டன.
    reason: cultural_note
lexical_decisions:
- source_word: χόρτον τοῦ ἀγροῦ
  choice: வயல்வெளிப் புல்
  rationale: χόρτος என்பது புல் அல்லது வயலில் வளரும் செடிவகைகளைக் குறிக்கலாம். நிலையற்ற இயற்கை வளர்ச்சியைச் சுட்டும் இச்சூழலில், மலர்களை மட்டும் குறிக்காமல் இயல்பாகப் பொருள்தரும் வகையில் ‘வயல்வெளிப் புல்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: σήμερον ὄντα
  choice: இன்று இருந்து
  rationale: ὄντα என்பதன் நேரடிப் பொருள் ‘இருக்கிறது’ என்பதாகும். புல்லின் இன்றைய இருப்பையும் அதன் குறுகிய ஆயுளையும் இயல்பான தமிழில் வெளிப்படுத்த ‘இன்று இருந்து’ பயன்படுத்தப்பட்டது.
- source_word: αὔριον εἰς κλίβανον βαλλόμενον
  choice: நாளை அடுப்பில் எறியப்படும்
  rationale: κλίβανος இங்கு உலோக உருக்கு உலை அல்ல, அப்பம் சுடும் அடுப்பைக் குறிக்கிறது; βαλλόμενον என்ற நிகழ்காலச் செயப்பாட்டு வினையெச்சத்தின் பொருள் தமிழில் இயல்பாகப் பாதுகாக்கப்பட்டது.
- source_word: οὕτως ἀμφιέννυσιν
  choice: இவ்வாறு உடை உடுத்துவிக்கிறார்
  rationale: ἀμφιέννυμι என்பதன் முதன்மைப் பொருள் ‘உடை உடுத்துதல்’. முந்தைய வசனத்தின் மலர் அலங்கார உருவகத்தையும் இவ்வசனத்தின் உடை வழங்கும் கருத்தையும் இணைக்க இத்தேர்வு உதவுகிறது.
- source_word: οὐ πολλῷ μᾶλλον
  choice: எவ்வளவு அதிகமாக ... உடை உடுத்துவிப்பார்!
  rationale: இது குறைவானதிலிருந்து அதிகமானதற்குச் செல்லும் வாதத்தைக் கொண்ட எதிர்பார்க்கப்பட்ட உறுதிப்பதில் உள்ள வினா. தமிழில் இயல்பான வியப்பு-வினா வலிமையுடன் வடிவமைக்கப்பட்டது.
- source_word: ὑμᾶς
  choice: உங்களுக்கு
  rationale: இது பன்மை இரண்டாம் நபரைக் குறிக்கும். தமிழின் காரணவேற்றுமை அமைப்புக்கேற்ப, உடை உடுத்துவித்தலின் பெறுநரை ‘உங்களுக்கு’ எனக் குறிப்பிடுகிறது.
- source_word: ὀλιγόπιστοι
  choice: சிறு நம்பிக்கையுள்ளவர்களே
  rationale: இது போதிய நம்பிக்கையின்மையைக் கண்டிக்கும் பன்மை விளிவேற்றுமை நேரடி அழைப்பு. ‘நம்பிக்கையற்றவர்கள்’ என முழுமையான அவநம்பிக்கையாக மிகைப்படுத்தாமல், கிரேக்கச் சொல்லின் அளவுக் கருத்தைப் பாதுகாக்கிறது.
- source_word: εἰ δὲ
  choice: ஆனால் ... என்றால்
  rationale: δέ குறிக்கும் மென்மையான எதிர்நிலையையும், εἰ குறிக்கும் நிபந்தனை அமைப்பையும் நவீனத் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: குறைவானதிலிருந்து அதிகமானதற்குச் செல்லும் இறைப் பராமரிப்பு வாதம்
  choice: நிலையற்ற புல்லுக்குக் கடவுள் உடை உடுத்துவித்தால், சீடர்களுக்கு இன்னும் அதிகமாக உடை உடுத்துவிப்பார் என்ற வலியுறுத்தும் வினாவாகப் பாதுகாக்கப்பட்டது.
  alternative: வினாவாக அல்லாமல் நேரடி உறுதிக்கூற்றாக மொழிபெயர்த்தல்.
  rationale: கிரேக்கத்தின் οὐ எதிர்பார்க்கும் உறுதிப்பதிலும் இறுதி நேரடி அழைப்பிலும் வினாவின் கண்டிப்பும் ஆறுதலும் ஒன்றாகத் தங்கியுள்ளன; கூடுதல் கோட்பாட்டுக் கருத்துகள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வசனத்தின் நிபந்தனை, குறைவிலிருந்து அதிகத்திற்குச் செல்லும் வாதம், நேரடி கண்டிப்பு ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
