id: MAT.6.33
reference: Matthew 6:33
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ζητεῖτε δὲ πρῶτον τὴν ⸀βασιλείαν καὶ τὴν δικαιοσύνην αὐτοῦ, καὶ ταῦτα πάντα προστεθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/033.yaml
  text: But seek first his kingdom and his righteousness[a], and all these things will be added to you.
translation:
  language: ta
  text: ஆனால், முதலில் அவருடைய அரசாட்சியையும் அவருடைய நீதியையும்[a] தேடுங்கள்; இவையெல்லாம் உங்களுக்குக் கூடுதலாக அளிக்கப்படும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய நியாயத்தையும்.” இங்குள்ள கிரேக்கச் சொல் நீதியையோ நியாயத்தையோ குறிக்கலாம்; இச்சூழலில் அது தேவனோடு சரியான உறவையும், அவருடைய சித்தத்துக்கு ஏற்ற நடத்தையையும் உள்ளடக்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητεῖτε
  choice: தேடுங்கள்
  rationale: நிகழ்காலக் கட்டளை தொடர்ச்சியான, செயற்பூர்வமான தேடுதலைக் குறிக்கிறது; தமிழில் ‘தேடுங்கள்’ இயல்பாக அந்தக் கட்டளையை வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனங்களில் உலகத் தேவைகளைப் பற்றிக் கவலைப்படுவதற்கு மாறான திருப்பத்தைச் சுட்டுகிறது.
- source_word: πρῶτον
  choice: முதலில்
  rationale: முன்னுரிமையையும் மூலச் சொல்லின் நேரடியான பொருளையும் காக்கிறது.
- source_word: βασιλείαν
  choice: அரசாட்சி
  rationale: இங்கு தேவனுடைய அரசருக்குரிய ஆட்சியையும் அதிகாரச் செயல்பாட்டையும் தெளிவாகக் குறிக்கிறது; ‘ராஜ்யம்’ என்பதைக் காட்டிலும் நவீனத் தமிழில் இயல்பானது.
- source_word: δικαιοσύνην
  choice: நீதி
  rationale: தமிழில் ‘நீதி’ என்பது நியாயத்தையும் தேவனுடைய சித்தத்துக்கு ஏற்ற நேர்மையான நிலை மற்றும் நடத்தையையும் உள்ளடக்கக்கூடிய விரிவான சொல்.
- source_word: αὐτοῦ
  choice: அவருடைய
  rationale: கிரேக்கப் பிரதிப்பெயரை அப்படியே காத்து, சூழலில் தேவனைச் சுட்டும் அதன் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: ταῦτα πάντα
  choice: இவை அனைத்தும்
  rationale: முந்தைய சூழலில் கூறப்பட்ட உணவு, பானம், உடை போன்ற தேவைகளைச் சுட்டும் சொற்றொடரை இயல்பாகக் காக்கிறது.
- source_word: προστεθήσεται
  choice: கூடக் கொடுக்கப்படும்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தையும், முதன்மையாகத் தேடப்படுவதோடு இந்தத் தேவைகளும் கூடுதலாக அளிக்கப்படும் என்ற பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: ὑμῖν
  choice: உங்களுக்கு
  rationale: பெறுபவர்களைக் குறிக்கும் பன்மை முன்னிலையைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: δικαιοσύνην என்பதன் பொருள்
  choice: நீதி
  alternative: நீதியான நிலையும் நடத்தையும் / நியாயம்
  rationale: சொல் தேவனுடைய சித்தத்துக்கு ஏற்ற நிலை மற்றும் நடத்தையையும் நியாயத்தையும் உள்ளடக்குகிறது. ‘நீதி’ இந்த அகலத்தைச் சுருக்காமல் காக்கிறது; அடிக்குறிப்பு பொருள் பரப்பைத் தெளிவுபடுத்துகிறது.
- issue: αὐτοῦ என்பதன் குறிப்பு
  choice: அவருடைய
  alternative: தேவனுடைய
  rationale: சூழலில் குறிப்பு தேவனை நோக்கியது தெளிவாக இருந்தாலும், மூலத்தின் பிரதிப்பெயர் வடிவத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘அரசாட்சி’ தேவனுடைய ஆளுகையை இயல்பாக வெளிப்படுத்துகிறது; ‘கூடக் கொடுக்கப்படும்’ என்பது கிரேக்க வினையின் கூடுதலாக அளிக்கப்படும் என்ற கருத்தைச் சரளமாகக் காக்கிறது.
