review_pass:
  verdict: revise
  source_fidelity: The draft accurately reflects the adversative δέ, the priority expressed by πρῶτον, God's kingdom/reign, and the future passive promise. However, “அப்போது” adds a temporal inference not expressed by the Greek, and “கூடக் கொடுக்கப்படும்” is less exact than a formulation retaining the explicit sense of addition in προστεθήσεται.
  naturalness: The Tamil is generally clear and dignified. “உங்களுக்குக் கூடுதலாக அளிக்கப்படும்” is natural modern standard Tamil and makes the ‘added in addition’ sense clearer. Omitting “அப்போது” produces a closer, smoother coordination.
  terminology: “அரசாட்சி” suitably conveys βασιλεία in its reign/rule sense. “நீதி” can carry the needed biblical breadth of righteousness, while the note should present “நியாயம்” as the alternative rather than implying that the main text means only judicial justice.
  issues:
  - severity: medium
    issue: Added temporal connector “அப்போது”
    rationale: The source has καί (“and”), not an explicit ‘then.’ Although inferentially plausible, the addition is unnecessary and slightly heightens the conditional sequence.
  - severity: medium
    issue: “கூடக் கொடுக்கப்படும்” weakens the lexical addition sense
    rationale: προστεθήσεται specifically means ‘will be added.’ “கூடுதலாக அளிக்கப்படும்” preserves both the future passive and the idea that these things come in addition.
  - severity: low
    issue: Footnote wording is potentially unclear about the alternative to “நீதி”
    rationale: The note should explicitly identify “அவருடைய நியாயத்தையும்” as the alternative and state that the Greek term can denote righteousness or justice, without narrowing either sense.
  revised_text: ஆனால், முதலில் அவருடைய அரசாட்சியையும் அவருடைய நீதியையும்[a] தேடுங்கள்; இவையெல்லாம் உங்களுக்குக் கூடுதலாக அளிக்கப்படும்.
