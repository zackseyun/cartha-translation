revisions:
- from: ஆனால், முதலில் அவருடைய அரசாட்சியையும் அவருடைய நீதியையும்[a] தேடுங்கள்; அப்போது இவை அனைத்தும் உங்களுக்குக் கூடக் கொடுக்கப்படும்.
  to: ஆனால், முதலில் அவருடைய அரசாட்சியையும் அவருடைய நீதியையும்[a] தேடுங்கள்; இவையெல்லாம் உங்களுக்குக் கூடுதலாக அளிக்கப்படும்.
  rationale: The revision removes an unexpressed temporal connector, renders the future passive with its explicit ‘addition’ force, and clarifies the lexical footnote. It retains the source’s pronoun, priority, kingdom/reign terminology, and the broad theological-semantic range of δικαιοσύνη without imposing a narrowed interpretation.
