id: MAT.6.12
reference: Matthew 6:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἄφες ἡμῖν τὰ ὀφειλήματα ἡμῶν, ὡς καὶ ἡμεῖς ⸀ἀφήκαμεν τοῖς ὀφειλέταις ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/012.yaml
  text: And forgive us our debts[b][a], as we also have forgiven our debtors.
translation:
  language: ta
  text: எங்களுக்குக் கடன்பட்டவர்களை நாங்களும் மன்னித்திருக்கிறதுபோல, எங்கள் கடன்களை எங்களுக்கு மன்னித்தருளும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄφες
  choice: மன்னித்தருளும்
  rationale: ἀφίημι என்பதன் அடிப்படைப் பொருள் ‘விடுதல்’ என்றாலும், ஒழுக்கக் கடன்கள் குறித்த இந்த வேண்டுதலில் ‘மன்னித்தருளும்’ என்பது இயல்பான, கண்ணியமான தமிழ் ஜெப மொழியாகும்.
- source_word: τὰ ὀφειλήματα ἡμῶν
  choice: எங்கள் கடன்களை
  rationale: ὀφειλήματα என்பதன் நேரடிப் பொருளான ‘கடன்கள்’ என்பதைக் காத்து, பின்னர் வரும் ‘கடன்பட்டவர்கள்’ என்பதுடனான சொல் தொடர்பையும் உருவகத்தையும் நிலைநிறுத்துகிறது.
- source_word: ὡς
  choice: அதுபோல
  rationale: இறைவனிடம் கேட்கப்படும் மன்னிப்புக்கும் மனிதர்கள் வழங்கிய மன்னிப்புக்கும் இடையிலான ஒப்பீட்டை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: καὶ ἡμεῖς
  choice: நாங்களும்
  rationale: இரண்டாம் καὶ மற்றும் வெளிப்படையான ἡμεῖς தரும் ‘நாங்களும்’ என்ற வலியுறுத்தலைக் காக்கிறது.
- source_word: ἀφήκαμεν
  choice: மன்னித்திருக்கிறோம்
  rationale: கிரேக்க இறந்தகால வினை வடிவம் நிறைவுற்ற செயலைக் குறிக்கிறது; அதன் தற்போதைய தொடர்பை இயல்பான தமிழில் ‘மன்னித்திருக்கிறோம்’ வெளிப்படுத்துகிறது.
- source_word: τοῖς ὀφειλέταις ἡμῶν
  choice: எங்களுக்குக் கடன்பட்டவர்களை
  rationale: ‘கடன்கள்’ என்பதுடன் உள்ள ஒரே சொல்வேர்த் தொடர்பையும் கடன் உருவகத்தையும் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: ὀφειλήματα என்ற ஒழுக்கக் கடன் உருவகம்
  choice: முதன்மை உரையில் ‘கடன்கள்’ என உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘குற்றங்கள்’ அல்லது ‘பாவங்கள்’
  rationale: கிரேக்க உரை பொதுவான ‘பாவங்கள்’ என்ற சொல்லுக்குப் பதிலாக, செலுத்த வேண்டிய கடனின் உருவகத்தைப் பயன்படுத்துகிறது. அதன் ஒழுக்கப் பொருளை அடிக்குறிப்பு விளக்குகிறது; முதன்மை உரை அதைத் தீர்மானித்து மாற்றவில்லை.
- issue: ἀφήκαμεν என்பதன் கால நுட்பம்
  choice: ‘மன்னித்திருக்கிறோம்’
  alternative: ‘மன்னித்தோம்’
  rationale: இரண்டும் கிரேக்க இறந்தகால வடிவத்தைச் சாத்தியமாக மொழிபெயர்க்கின்றன. ‘மன்னித்திருக்கிறோம்’ நிறைவுற்ற செயலின் தற்போதைய தொடர்பை இயல்பாகக் காட்டுகிறது; எளிய இறந்தகால வாசிப்பும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ὡς காட்டும் ஒப்பீட்டின் இறையியல் பதற்றம்
  choice: ‘அதுபோல’ என்ற நேரடி ஒப்பீட்டை வைத்திருத்தல்
  alternative: ஒப்பீட்டை காரணமாகவோ மன்னிப்பைப் பெறுவதற்கான நிபந்தனையாகவோ விளக்குதல்
  rationale: ὡς ஒப்பீட்டைத் தெளிவாகக் காட்டுகிறது; ஆனால் அந்த உறவின் முழு இறையியல் தன்மையை இவ்வசனம் மட்டும் விளக்கவில்லை. ஆகவே மொழிபெயர்ப்பு அதை காரணம் அல்லது சம்பாதித்த தகுதி என்று தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுமக்களுக்கு புரியும் கண்ணியமான ஜெப நடையைப் பயன்படுத்துகிறது. ‘மன்னித்தருளும்’ மரியாதையையும் வேண்டுதலின் இயல்பையும் தருகிறது. தமிழில் ஒப்பீடு தெளிவாக அமைய, கிரேக்க வரிசையைச் சற்றே மாற்றி ‘அதுபோல’ என்பதை இறுதி வேண்டுதலோடு இணைத்துள்ளது.
