source:
  edition: SBLGNT
  text: ἐλθέτω ἡ βασιλεία σου, γενηθήτω τὸ θέλημά σου, ὡς ἐν οὐρανῷ καὶ ⸀ἐπὶ γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/010.yaml
  text: May your kingdom come; may your will be done[a], as in heaven, so also on earth.
translation:
  language: ta
  text: உமது அரசு வருவதாக; உமது சித்தம் பரலோகத்தில் நிறைவேறுவதுபோல பூமியிலும் நிறைவேறுவதாக.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது அரசு வருவதாக; உமது சித்தம் நிறைவேறுவதாக; பரலோகத்தில் போலவே பூமியிலும்” என்று பொருள் கொள்ளலாம்; இவ்வாசிப்பில் “பரலோகத்தில் போலவே பூமியிலும்” என்பது இரண்டு வேண்டுதல்களுக்கும் பொருந்தலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλθέτω
  choice: வருவதாக
  rationale: ἔρχομαι என்பதன் மூன்றாம் நபர் ஒருமை இறந்தகாலக் கட்டளை வடிவம்; கடவுளை நோக்கிய வேண்டுதலின் வலிமையை இயல்பான தமிழ் செப நடையில் வெளிப்படுத்துகிறது.
- source_word: βασιλεία
  choice: அரசு
  rationale: இச்சொல் அரசாட்சி, ஆட்சி, அரசு ஆகிய பொருள்களைக் கொள்ளலாம். ‘உமது அரசு வருவதாக’ என்பது தேவனுடைய அரசாளுதலையும் அவர் நிறுவும் அரசையும் உள்ளடக்கக்கூடிய இயல்பான, சுருக்கமான தமிழ் வடிவம்.
- source_word: γενηθήτω
  choice: நிறைவேறுவதாக
  rationale: γίνομαι என்பதன் மூன்றாம் நபர் ஒருமை இறந்தகாலச் செயல்பாட்டு வடிவம்; θέλημα என்பதோடு வரும்போது விருப்பம் நிகழ்வதை அல்லது செயல்படுத்தப்படுவதைச் சுட்டுகிறது. ‘நிறைவேறுவதாக’ என்பது தமிழில் இயல்பாக இரு நுணுக்கங்களையும் தாங்குகிறது.
- source_word: θέλημα
  choice: விருப்பம்
  rationale: ஒருவர் விரும்புவது, சித்தங்கொள்வது, நோக்குவது என்பவற்றைக் குறிக்கிறது. ‘விருப்பம்’ நவீன வாசகருக்குத் தெளிவாகவும், ‘திட்டம்’ என்று பொருளை அளவுக்கு மீறிக் குறுக்காமலும் உள்ளது.
- source_word: ὡς
  choice: …போல
  rationale: ஒப்பீட்டை அறிமுகப்படுத்தும் ὡς என்பதற்கு இயல்பான தமிழ் இணை; கிரேக்கத்தின் ஒப்பீட்டுத் தன்மையைத் தக்கவைக்கிறது.
- source_word: ἐν οὐρανῷ
  choice: பரலோகத்தில்
  rationale: ἐν உடன் வரும் ஒருமை வேற்றுமை வடிவம்; கடவுளின் விண்ணுலகத் தளத்தைக் குறிக்கும் சூழலில் ‘பரலோகத்தில்’ இயல்பும் தெளிவும் உடையது.
- source_word: ἐπὶ γῆς
  choice: பூமியிலும்
  rationale: ἐπί உடன் வரும் இத்தொடர் ‘பூமியின் மேல்/பூமியில்’ என்ற பொருள் தருகிறது. பரலோகம்–பூமி எதிரிணையில் ‘பூமியிலும்’ இயல்பான தமிழாகவும் καί-யின் ‘மேலும்/அப்படியே’ நுணுக்கத்தைத் தாங்குவதாகவும் உள்ளது.
- source_word: καὶ
  choice: -இலும்
  rationale: ὡς…καὶ அமைப்பில் ஒப்பீட்டின் இரண்டாம் பகுதியை ‘…போல …இலும்’ என்று தமிழில் இயல்பாக நிறைவு செய்கிறது.
theological_decisions:
- issue: ὡς ἐν οὐρανῷ καὶ ἐπὶ γῆς என்ற ஒப்பீட்டுத் தொடரின் தொடர்பெல்லை
  choice: முதன்மை உரையில் இத்தொடர் அருகிலுள்ள இரண்டாம் வேண்டுதலான ‘உமது விருப்பம் … நிறைவேறுவதாக’ என்பதுடன் இணைக்கப்பட்டுள்ளது.
  alternative: ‘பரலோகத்தில் … பூமியிலும்’ என்பது ‘உமது அரசு வருவதாக’ மற்றும் ‘உமது விருப்பம் நிறைவேறுவதாக’ ஆகிய இரண்டு வேண்டுதல்களுக்கும் பொருந்துவதாகப் புரிந்துகொள்ளலாம்.
  rationale: கிரேக்கக் கையெழுத்துப் பிரதிகளின் மூல நிறுத்தற்குறிகள் இந்தத் தொடர்பெல்லையைத் தீர்மானிப்பதில்லை; அண்மைய இலக்கணத் தொடர்பு இரண்டாம் வேண்டுதலோடு உள்ளது. இரண்டுக்கும் பொருந்தும் சாத்தியத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான செப நடையைப் பயன்படுத்துகிறது. ‘உமது’ மரியாதையையும் வழிபாட்டு இயல்பையும் காக்கிறது; தேவையற்ற பழந்தமிழ் மற்றும் சமயப் பிரிவுக்கே உரிய சொற்கள் தவிர்க்கப்பட்டுள்ளன.
