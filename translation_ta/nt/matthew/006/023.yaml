  source_fidelity: The draft accurately preserves the conditional contrast, the repeated light/darkness metaphor, and the broad ambiguity of πονηρός. The final exclamation, however, renders the Greek elliptical present-force clause with an unnecessary future ('பெரிதாயிருக்கும்').
