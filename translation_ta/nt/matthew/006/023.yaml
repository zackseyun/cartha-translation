id: MAT.6.23
reference: Matthew 6:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐὰν δὲ ὁ ὀφθαλμός σου πονηρὸς ᾖ, ὅλον τὸ σῶμά σου σκοτεινὸν ἔσται. εἰ οὖν τὸ φῶς τὸ ἐν σοὶ σκότος ἐστίν, τὸ σκότος πόσον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/023.yaml
  text: But if your eye is bad[a], your whole body will be dark. If then the light in you is darkness, how great is the darkness!
translation:
  language: ta
  text: ஆனால் உன் கண் கெட்டதாயிருந்தால்[a], உன் உடல் முழுவதும் இருளாக இருக்கும். அப்படியானால், உன்னில் இருக்கும் ஒளி இருளாக இருந்தால், அந்த இருள் எவ்வளவு பெரிது!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “தீயதாக,” “ஆரோக்கியமற்றதாக”; கண் பற்றிய வழக்குச் சொல்லையும் சுற்றியுள்ள சூழலையும் கருத்தில் கொண்டால், “கஞ்சத்தனமானதாக” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηρὸς
  choice: கெட்டதாக
  rationale: ‘கெட்ட’ என்பது தீய, குறைபாடுள்ள, ஆரோக்கியமற்ற, அல்லது சூழலுக்கேற்ப கஞ்சத்தனமான பார்வை ஆகிய சாத்தியமான நுண்பொருள்களை ஒரே பொருளாகச் சுருக்காமல் பரந்த உருவகத்தைத் தக்கவைக்கிறது.
- source_word: σκοτεινὸν
  choice: இருளாக
  rationale: பெயரடைப் பயனையும் ஒளி–இருள் உருவகத்தையும் இயல்பான தமிழில் நேரடியாகத் தக்கவைக்கிறது.
- source_word: φῶς
  choice: ஒளி
  rationale: உள்ளார்ந்த அல்லது ஒழுக்க சார்ந்த தெளிவைக் குறிக்கும் உருவகமாக இருந்தாலும், மூலத்தின் உருவகத் தன்மையைப் பாதுகாக்க ‘ஒளி’ என்ற நேரடிச் சொல் பயன்படுத்தப்படுகிறது.
- source_word: σκότος
  choice: இருள்
  rationale: φῶς என்பதற்கு எதிரான உருவகத்தையும் இறுதிக் கூற்றின் வலிமையையும் தக்கவைக்கிறது.
- source_word: πόσον
  choice: எவ்வளவு பெரிதாயிருக்கும்
  rationale: அளவு அல்லது தீவிரத்தைச் சுட்டும் வியப்புக் கூற்றை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὀφθαλμός
  choice: கண்
  rationale: பார்வை, நோக்கம், ஒழுக்க நிலை ஆகியவற்றை உள்ளடக்கக்கூடிய உடல் சார்ந்த உருவகத்தை அப்படியே தக்கவைக்கிறது.
- source_word: ὅλον τὸ σῶμά σου
  choice: உன் உடல் முழுவதும்
  rationale: ὅλον என்பதன் முழுமை வலியுறுத்தலை இயல்பான தமிழ் சொற்றொடரில் பாதுகாக்கிறது.
- source_word: τὸ φῶς τὸ ἐν σοὶ
  choice: உன்னில் இருக்கும் ஒளி
  rationale: ‘உள் ஒளி’ என்று விளக்கத்தை அதிகரிக்காமல், கிரேக்கச் சொற்றொடரின் பொருளையும் உருவகத்தின் திறந்த தன்மையையும் காக்கிறது.
theological_decisions:
- issue: ‘கெட்ட கண்’ உருவகத்தின் பொருள்
  choice: முதன்மை உரையில் பரந்த பொருளுடைய ‘கெட்டதாக’ என்பதைப் பயன்படுத்தி உருவகத்தைத் திறந்த நிலையில் வைத்தல்.
  alternative: ‘தீய கண்’ என ஒழுக்கத் தீமையை வலியுறுத்துதல்; ‘ஆரோக்கியமற்ற கண்’ என பார்வைக் குறைபாட்டை வலியுறுத்துதல்; அல்லது ‘கஞ்சத்தனமான கண்’ என தாராளமின்மையைக் குறிப்பாக்குதல்.
  rationale: மத்தேயு 6:19–24 சூழல் ஒழுக்க இருள், சிதைந்த பார்வை, மேலும் செமித்திய வழக்கில் தாராளமற்ற மனநிலை ஆகிய ஒன்றோடொன்று தொடர்புடைய நுண்பொருள்களை அனுமதிக்கிறது. அவற்றில் ஒன்றை மட்டும் தீர்மானிக்காமல், முதன்மை உரை பரந்த உருவகத்தைத் தக்கவைத்து மாற்றுப் பொருள்களை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், வேதாகமக் கூற்றிற்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘கண்—உடல்—ஒளி—இருள்’ என்ற மூல உருவகத் தொடர் பாதுகாக்கப்பட்டுள்ளது; பொருள் அளவுக்கு மீறி விளக்கப்படவில்லை.
