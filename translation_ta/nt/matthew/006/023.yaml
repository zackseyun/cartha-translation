    rationale: τὸ σκότος πόσον is an elliptical exclamation expressing degree, best represented in Tamil as ‘அந்த இருள் எவ்வளவு பெரிது!’ rather than as a future prediction.
  - severity: low
    issue: ‘ஒளியே’ adds explicit emphatic focus.
    rationale: The Greek identifies ‘the light in you’ as the subject but does not require an emphatic particle. Plain ‘ஒளி’ preserves the metaphor without added discourse emphasis.
