id: MAT.6.14
reference: Matthew 6:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐὰν γὰρ ἀφῆτε τοῖς ἀνθρώποις τὰ παραπτώματα αὐτῶν, ἀφήσει καὶ ὑμῖν ὁ πατὴρ ὑμῶν ὁ οὐράνιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/014.yaml
  text: For if you forgive people their trespasses[b][a], your heavenly Father will also forgive you.
translation:
  language: ta
  text: ஏனெனில், மக்களின் குற்றங்களை[a] நீங்கள் மன்னித்தால், உங்கள் பரலோகத் தந்தையும் உங்களை மன்னிப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மீறுதல்கள்,’ ‘தவறுகள்’ அல்லது ‘தீய செயல்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ஒழுக்கத் தவறுகளையோ தவறான அடிகளையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: ஏனெனில் … மன்னித்தால்
  rationale: γάρ முந்தைய வசனத்தில் உள்ள ஜெபத்துடன் விளக்கத் தொடர்பை ஏற்படுத்துவதால் ‘ஏனெனில்’ என மொழிபெயர்க்கப்பட்டது; ἐάν உடன் வரும் இறந்தகாலத் துணைவினை நிபந்தனையை ‘-த்தால்’ வடிவில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀφῆτε … ἀφήσει
  choice: மன்னித்தால் … மன்னிப்பார்
  rationale: இந்த ஒழுக்க மற்றும் உறவுசார் சூழலில் ἀφίημι என்பது ‘மன்னித்தல்’ என்று பொருள்படுகிறது. மூலத்தில் ஒரே வினைச்சொல் இருமுறை வருவதால் தமிழிலும் அதே வேர்ச்சொல் இரு இடங்களிலும் வைக்கப்பட்டது.
- source_word: τοῖς ἀνθρώποις … αὐτῶν
  choice: மக்களின்
  rationale: ἄνθρωποι இங்கு ஆண்களை மட்டும் அல்லாமல் மக்களைப் பொதுவாகக் குறிக்கிறது; αὐτῶν அவர்களுக்குரிய குற்றங்களைக் குறிக்கிறது. ‘மக்களின்’ என்பது இரண்டையும் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: τὰ παραπτώματα
  choice: குற்றங்களை
  rationale: παράπτωμα என்பது ஒழுக்கத் தவறு, மீறுதல் அல்லது தவறான செயலைக் குறிக்கிறது. ‘குற்றங்கள்’ நவீன தமிழில் தெளிவாகவும் உறவுசார் ஒழுக்கப் பொருளுக்கு ஏற்றதாகவும் உள்ளது; சொல்லின் பொருள் பரப்பை அடிக்குறிப்பு காட்டுகிறது.
- source_word: καὶ ὑμῖν
  choice: உங்களையும்
  rationale: καί மனிதர்கள் மன்னிப்பதற்கும் தந்தை மன்னிப்பதற்கும் உள்ள ஒத்திசைவை ‘-உம்’ மூலம் காக்கிறது; ὑμῖν தமிழில் நேரடி செயப்படுபொருளாக இயல்பாக வருகிறது.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: உங்கள் பரலோகத் தந்தை
  rationale: சொற்றொடரின் பொருள் ‘உங்கள் தந்தை, பரலோகத்திற்குரியவர்’ என்பதாக இருந்தாலும், ‘உங்கள் பரலோகத் தந்தை’ என்பது நவீன தமிழில் இயல்பான, மரியாதைக்குரிய வடிவமாகும்.
theological_decisions:
- issue: மனிதர்கள் மன்னிப்பதற்கும் கடவுள் மன்னிப்பதற்கும் இடையிலான நிபந்தனை உறவு
  choice: ‘நீங்கள் மன்னித்தால் … தந்தையும் உங்களை மன்னிப்பார்’ என்று நேரடியான உண்மையான நிபந்தனையாக மொழிபெயர்க்கப்பட்டது.
  alternative: மனித மன்னிப்பு கடவுளின் மன்னிப்பைச் சம்பாதிக்கிறது என்ற வலுவான காரணவியல் விளக்கம்; அல்லது அது ஏற்கெனவே பெற்ற மன்னிப்பின் அடையாளம் மட்டுமே என்ற விளக்கம்.
  rationale: கிரேக்க உரை ஒரு தெளிவான நிபந்தனை வாக்கியத்தை முன்வைக்கிறது. அது எவ்வாறு பரந்த இரட்சிப்பியல் கோட்பாட்டுடன் தொடர்புடையது என்பதை மொழிபெயர்ப்பே தீர்மானிக்காமல், மூலத்தின் இறையியல் அழுத்தம் அப்படியே காக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையில் அமைக்கப்பட்டது. ‘ஏனெனில்’ முந்தைய ஜெபத்துடனான விளக்கத் தொடர்பைக் காக்கிறது; ‘பரலோகத் தந்தை’ மத்தேயுவின் மரியாதைக்குரிய தந்தைச் சொல்லாட்சியை இயல்பாக வெளிப்படுத்துகிறது.
