source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/029.yaml
  text: But I tell you that not even Solomon in all his glory was clothed like one of these[a].
translation:
  language: ta
  text: 'ஆனால், நான் உங்களுக்குச் சொல்கிறேன்: சாலொமோன்கூடத் தன் எல்லா மகிமையிலும் இவற்றில் ஒன்றைப் போல் உடையணிந்திருக்கவில்லை.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மாட்சி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: ஆனால் நான் உங்களுக்குச் சொல்கிறேன்
  rationale: δέ இங்கு முந்தைய கருத்துடன் மென்மையான முரண்பாட்டைச் சுட்டுகிறது; λέγω ... ὑμῖν என்பதன் நேரடியான, இயல்பான தமிழ் வடிவம் இது.
- source_word: οὐδὲ Σολομὼν
  choice: சாலொமோன்கூட
  rationale: οὐδέ தரும் ‘அவர்கூட இல்லை’ என்ற வலியுறுத்தலை ‘கூட’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: தன் மகிமை அனைத்திலும்
  rationale: δόξα இங்கு அரசருக்குரிய ஆடம்பரமும் மாட்சிமையும் குறிக்கிறது; ‘மகிமை’ மூலச்சொல்லின் பரந்த ஒலிப்பைத் தக்கவைக்கிறது.
- source_word: περιεβάλετο
  choice: உடுத்தியிருக்கவில்லை
  rationale: இச்சூழலில் நடுத்தர/செயப்பாட்டு வடிவம் உடை அணிந்திருத்தலைக் குறிக்கிறது; தமிழ் வழக்கில் இயல்பான வினை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ὡς ἓν τούτων
  choice: இவற்றில் ஒன்றைப் போல்
  rationale: ἓν என்பதன் ஒருமை வலியுறுத்தலையும், உடனடிச் சூழலிலுள்ள மலர்களைச் சுட்டும் τούτων என்பதையும் தக்கவைக்கிறது.
theological_decisions:
- issue: சாலொமோனைப் பற்றிய δόξα என்பதன் பொருள்
  choice: மகிமை
  alternative: மாட்சி / பேரழகு
  rationale: இங்கு தெய்வீக மகிமை அல்ல, சாலொமோனின் அரச மாட்சியும் ஆடம்பரமும் கருத்தாகும். ‘மகிமை’ மூலத்தின் சொற்பரப்பைத் தக்கவைக்கிறது; அடிக்குறிப்பு சூழல்சார் மாற்றுச் சொல்லை வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும், கண்ணியமான வேதாகம நடையுடன், மூலத்தின் ஒப்பீடும் வலியுறுத்தலும் காக்கப்பட்டுள்ளன.
