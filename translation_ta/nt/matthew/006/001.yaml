id: MAT.6.1
reference: Matthew 6:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Προσέχετε ⸀δὲ τὴν ⸀δικαιοσύνην ὑμῶν μὴ ποιεῖν ἔμπροσθεν τῶν ἀνθρώπων πρὸς τὸ θεαθῆναι αὐτοῖς· εἰ δὲ μή γε, μισθὸν οὐκ ἔχετε παρὰ τῷ πατρὶ ὑμῶν τῷ ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/001.yaml
  text: But be careful not to practice your righteousness before people in order to be seen by them[a]; otherwise[b], you have no reward from your Father in the heavens.
translation:
  language: ta
  text: ஆனால், மனிதர்கள் காணும்படியாக உங்கள் நீதியை நடைமுறைப்படுத்தாதீர்கள்; அப்படிச் செய்தால், வானங்களில் இருக்கிற உங்கள் தந்தையிடமிருந்து உங்களுக்கு வெகுமதி கிடைக்காது.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உங்கள் நீதியான செயல்களை.’ ஒரு பாடவேறுபாட்டில் ‘உங்கள் தர்மதானத்தை’ என்று உள்ளது.
    reason: δικαιοσύνην என்பதன் பரந்த பொருளையும், ἐλεημοσύνην (‘தர்மதானம்’) என்ற பாடவேறுபாட்டையும் தீர்மானிக்காமல் பாதுகாக்கிறது.
  - marker: b
    text: கிரேக்கத்தில் ‘வானங்களில்’ என்பது பன்மை வடிவம்; இதை ‘வானத்தில்’ அல்லது ‘பரலோகத்தில்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: மூலத்தின் பன்மை வடிவத்தையும் இயல்பான தமிழ் மாற்றுகளையும் வாசகருக்குத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: Προσέχετε
  choice: எச்சரிக்கையாக இருங்கள்
  rationale: தொடர்ந்து விழிப்புடன் இருக்கும்படி வலியுறுத்தும் நிகழ்காலக் கட்டளையின் எச்சரிக்கைத் தொனியை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய போதனையிலிருந்து எச்சரிக்கைக்குத் திரும்பும் மாறுபாட்டைச் சுட்டுகிறது.
- source_word: δικαιοσύνην
  choice: உங்கள் நீதியை
  rationale: SBLGNT உரையின் பரந்த பொருளைத் தக்கவைத்து, அதைத் தர்மம் செய்வதற்கு மட்டும் குறுக்காமல் விடுகிறது; நடைமுறைச் செயலைத் தமிழில் உணர்த்த ‘கடைப்பிடிக்க’ என்பதுடன் இணைக்கப்பட்டுள்ளது.
- source_word: μὴ ποιεῖν
  choice: கடைப்பிடிக்காதபடி
  rationale: இங்கு தவிர்க்க வேண்டிய மதநெறி நடைமுறையை இயல்பாகக் கூறுகிறது; வெறும் ‘செய்யாதபடி’ என்பதைவிட ‘நீதியை’ என்ற பெயர்ச்சொல்லுடன் தமிழில் தெளிவாக அமைகிறது.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: மனிதர்கள் முன்
  rationale: ஆண் பாலாரை மட்டும் அல்லாமல் மனிதப் பார்வையாளர்கள் அனைவரையும் குறிக்கும் பொதுப்பொருளைப் பேணுகிறது.
- source_word: πρὸς τὸ θεαθῆναι αὐτοῖς
  choice: மனிதர்கள் பார்க்க வேண்டும் என்பதற்காக
  rationale: அவர்களால் பார்க்கப்பட வேண்டும் என்ற நோக்கத்தையும் பொதுக் காட்சிக்கான உள்நோக்கத்தையும் தெளிவாகப் பேணுகிறது.
- source_word: εἰ δὲ μή γε
  choice: இல்லையென்றால்
  rationale: நிபந்தனை சார்ந்த எச்சரிக்கையின் விளைவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: μισθὸν
  choice: வெகுமதி
  rationale: இந்தச் சூழலில் தந்தையிடமிருந்து கிடைக்கும் கைம்மாறு அல்லது பலன் என்ற பொருளைத் தவறான கூலி நுணுக்கமின்றி தெரிவிக்கிறது.
- source_word: παρὰ τῷ πατρὶ ὑμῶν
  choice: உங்கள் தந்தையிடமிருந்து
  rationale: வெகுமதியின் மூலமாகத் தந்தையைக் காட்டும் παρά உடன் வரும் இயல்பான சூழற்பொருளை வெளிப்படுத்துகிறது.
- source_word: τῷ ἐν τοῖς οὐρανοῖς
  choice: வானங்களில் இருக்கிற
  rationale: மூல கிரேக்கத்தின் பன்மை வடிவத்தையும் மத்தேயுவின் சொல்லாட்சியையும் பேணுகிறது.
theological_decisions:
- issue: δικαιοσύνην என்பதன் பொருள் வரம்பு
  choice: முதன்மை உரையில் ‘நீதி’ என்று பரந்த பொருளில் வைத்தல்
  alternative: நீதியான செயல்கள்; தர்மம் செய்தல்
  rationale: SBLGNT வாசகம் δικαιοσύνην என்பதால் அதைத் தர்மம் செய்வதற்கு மட்டும் கட்டுப்படுத்துவது பொருளை முன்கூட்டியே தீர்மானித்துவிடும். அருகிலுள்ள சூழல் நடைமுறை நீதிச் செயல்களைக் குறிக்கலாம் என்பதும், ‘தர்மம் செய்தல்’ என்ற பாடவேறுபாடு இருப்பதும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἀνθρώπων என்பதன் பாலினப் பொதுமை
  choice: மனிதர்கள்
  alternative: ஆண்கள்
  rationale: இங்கு குறிப்பது ஆண்களை மட்டும் அல்ல, பொதுவாக மனிதப் பார்வையாளர்களையே.
- issue: τοῖς οὐρανοῖς என்ற பன்மை
  choice: வானங்களில்
  alternative: வானத்தில்; பரலோகத்தில்
  rationale: கிரேக்கப் பன்மையையும் மத்தேயுவின் தனிப்பட்ட சொல்லாட்சியையும் பேணுகிறது; இதன் மூலம் கூடுதல் அண்டவியல் கோட்பாடு எதுவும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் எச்சரிக்கைத் தொனியும் காக்கப்பட்டுள்ளன. ‘உங்கள் நீதியைக் கடைப்பிடிக்க’ என்பது பரந்த மூலச்சொல்லையும் நடைமுறைச் சூழலையும் இணைக்கிறது. ‘எந்த வெகுமதியும் கிடைக்காது’ என்பது கிரேக்கத்தின் ‘வெகுமதி உங்களுக்கு இல்லை’ என்ற வலுவான மறுப்பை இயல்பான தமிழில் தருகிறது.
