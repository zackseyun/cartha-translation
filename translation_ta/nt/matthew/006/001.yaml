review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the broad SBLGNT reading δικαιοσύνην rather than adopting the variant ‘almsgiving,’ preserves the purpose clause, the negative consequence, and the plural ‘heavens.’ However, ‘மனிதர்கள் பார்க்க வேண்டும் என்பதற்காக’ can mean ‘so that people ought to see,’ rather than the required passive sense ‘to be seen by them.’
  naturalness: '‘உங்கள் நீதியைக் கடைப்பிடிக்காதபடி எச்சரிக்கையாக இருங்கள்’ is grammatically understandable but stylistically strained: it can sound like a warning against adhering to righteousness itself. A direct prohibition with ‘மனிதர்கள் காணும்படியாக’ is clearer and natural in modern standard Tamil.'
  terminology: ‘நீதி’ appropriately preserves the breadth of δικαιοσύνη. ‘நடைமுறைப்படுத்துதல்’ makes clear that the warning concerns enacting it, not merely possessing it. ‘வெகுமதி,’ ‘தந்தை,’ and ‘வானங்கள்’ are suitable and source-sensitive. The textual-variant footnote should identify the variant as ‘தர்மதானம்’/almsgiving, not the broader and potentially misleading ‘தர்மம் செய்தல்.’
  issues:
  - severity: medium
    issue: Purpose clause has an avoidable ambiguity
    rationale: ‘மனிதர்கள் பார்க்க வேண்டும் என்பதற்காக’ may express that people should see, whereas πρὸς τὸ θεαθῆναι αὐτοῖς means ‘in order to be seen by them.’
  - severity: medium
    issue: The main verbal expression is awkward and may misdirect the prohibition
    rationale: ‘நீதியைக் கடைப்பிடிக்காதபடி’ can suggest not observing righteousness. The Greek prohibits performing righteous practice for public notice, not righteousness as such.
  - severity: low
    issue: Footnote a imprecisely labels the textual variant
    rationale: The known variant ἐλεημοσύνην specifically denotes almsgiving/charitable giving. ‘தர்மம் செய்தல்’ is broader and can blur the distinction that the note is intended to preserve.
  revised_text: ஆனால், மனிதர்கள் காணும்படியாக உங்கள் நீதியை நடைமுறைப்படுத்தாதீர்கள்; அப்படிச் செய்தால், வானங்களில் இருக்கிற உங்கள் தந்தையிடமிருந்து உங்களுக்கு வெகுமதி கிடைக்காது.[a][b]
  revised_footnotes:
