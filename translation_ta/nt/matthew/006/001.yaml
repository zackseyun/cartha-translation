revisions:
- from: ஆனால், மனிதர்கள் பார்க்க வேண்டும் என்பதற்காக அவர்கள்முன் உங்கள் நீதியைக்[a] கடைப்பிடிக்காதபடி எச்சரிக்கையாக இருங்கள். இல்லையென்றால், வானங்களில்[b] இருக்கிற உங்கள் தந்தையிடமிருந்து உங்களுக்கு எந்த வெகுமதியும் கிடைக்காது.
  to: ஆனால், மனிதர்கள் காணும்படியாக உங்கள் நீதியை நடைமுறைப்படுத்தாதீர்கள்; அப்படிச் செய்தால், வானங்களில் இருக்கிற உங்கள் தந்தையிடமிருந்து உங்களுக்கு வெகுமதி கிடைக்காது.[a][b]
  rationale: ‘மனிதர்கள் காணும்படியாக’ என்பது மூலத்தின் passive purpose construction-ஐத் துல்லியமாகக் காட்டுகிறது. ‘உங்கள் நீதியை நடைமுறைப்படுத்தாதீர்கள்’ என்பது δικαιοσύνην-ன் பரந்த பொருளைத் தக்கவைத்துக்கொண்டு, பொது அங்கீகாரத்திற்காக அதைச் செயல்படுத்துவதைத் தடைசெய்யும் வசனத்தின் கருத்தை நவீனத் தமிழில் தெளிவாக்குகிறது. அடிக்குறிப்பு a-வில் பாடவேறுபாட்டின் குறிப்பான பொருள் ‘தர்மதானம்’ எனச் சரிசெய்யப்பட்டுள்ளது.
