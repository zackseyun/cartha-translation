    reason: δικαιοσύνην என்பதன் பரந்த பொருளையும், ἐλεημοσύνην (‘தர்மதானம்’) என்ற பாடவேறுபாட்டையும் தீர்மானிக்காமல் பாதுகாக்கிறது.
