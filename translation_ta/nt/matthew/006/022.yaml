id: MAT.6.22
reference: Matthew 6:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὁ λύχνος τοῦ σώματός ἐστιν ὁ ὀφθαλμός. ἐὰν οὖν ⸂ᾖ ὁ ὀφθαλμός σου ἁπλοῦς⸃, ὅλον τὸ σῶμά σου φωτεινὸν ἔσται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/022.yaml
  text: The eye is the lamp of the body. Therefore[a], if your eye is healthy, your whole body will be full of light.
translation:
  language: ta
  text: உடலின் விளக்கு கண். ஆகவே, உன் கண் நலமாக[a] இருந்தால், உன் உடல் முழுவதும் ஒளி நிறைந்திருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “ஒருமுகமாக,” “தெளிவாக,” அல்லது “கலப்பற்றதாக.” கிரேக்கச் சொல் பிளவுபடாத தன்மையையும், சில சூழல்களில் தாராளத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: விளக்கு
  rationale: ஒளி என்ற கருத்தை மட்டும் அல்லாமல், ஒளி தரும் பொருளைக் குறிக்கும் மூலமொழியின் தெளிவான உருவகத்தைப் பாதுகாக்கிறது.
- source_word: σῶμα
  choice: உடல்
  rationale: உடல்சார்ந்த உருவகத்திற்கு இயல்பான, நேரடியான தமிழ் இணை.
- source_word: ὀφθαλμός
  choice: கண்
  rationale: உடலுறுப்பையும் அதனுடன் தொடர்புடைய அறநெறி உருவகத்தையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: ἐὰν οὖν
  choice: ஆகவே, ... இருந்தால்
  rationale: οὖν முன்னுள்ள கூற்றிலிருந்து வரும் முடிவுறுத்தலைக் குறிக்கிறது; நிபந்தனையுடன் சேர்த்து இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: ἁπλοῦς
  choice: நலமாக
  rationale: கண்ணும் உடலின் ஒளியும் பற்றிய உடனடிச் சூழலில், சரியாகச் செயல்படும் கண்ணைக் குறிக்கும் இயல்பான தமிழ்; சொல்லின் ‘ஒருமுகமான’, ‘தெளிவான’, ‘கலப்பற்ற’ அல்லது சில சூழல்களில் ‘தாராளமான’ என்ற சாத்தியங்களை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: ὅλον
  choice: முழுவதும்
  rationale: உடல் அனைத்தையும் உள்ளடக்கும் விரிவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: φωτεινὸν
  choice: ஒளி நிறைந்திருக்கும்
  rationale: முழு உடலுக்கும் பரவும் ஒளியின் உருவகத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἔσται
  choice: இருக்கும்
  rationale: மூலமொழியிலுள்ள எதிர்கால வினையைத் தக்கவைக்கிறது.
theological_decisions:
- issue: கண் குறித்த உருவகத்தில் ἁπλοῦς என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘நலமாக’
  alternative: ‘ஒருமுகமாக’, ‘தெளிவாக’, ‘கலப்பற்றதாக’ அல்லது சில சூழல்களில் ‘தாராளமாக’
  rationale: கண் உடலின் விளக்கு என்ற உடனடிச் சூழலும் அடுத்த வசனத்தில் வரும் கெட்ட கண்ணுடனான முரண்பாடும், நன்றாகச் செயல்படும் கண்ணைக் குறிக்கும் மொழிபெயர்ப்பை ஆதரிக்கின்றன. எனினும் சொல்லின் பரந்த பொருள்வாய்ப்பைத் தீர்மானமாக ஒடுக்காமல் அடிக்குறிப்பில் பதிவு செய்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையான, கண்ணியமான நடை. ‘உடலின் விளக்கு கண்’ என்ற சுருக்கமான அமைப்பு மூலத்தின் உருவக வலிமையைத் தக்கவைக்கிறது; அடிக்குறிப்பு குறியீடு உரையில் தெளிவாக இணைக்கப்பட்டுள்ளது.
