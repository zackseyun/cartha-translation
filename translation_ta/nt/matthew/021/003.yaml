id: MAT.21.3
reference: Matthew 21:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμῖν εἴπῃ τι, ἐρεῖτε ὅτι Ὁ κύριος αὐτῶν χρείαν ἔχει· ⸀εὐθὺς δὲ ⸀ἀποστελεῖ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/003.yaml
  text: And if anyone says anything to you[a], you shall say[b], ‘The Lord has need of them,’ and he will send them at once.
translation:
  language: ta
  text: யாராவது உங்களிடம் ஏதாவது சொன்னால், “ஆண்டவருக்கு[a] அவை தேவை” என்று சொல்லுங்கள்; உடனே அவற்றை அனுப்புவார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எஜமானுக்கு அவை தேவை.”
    reason: κύριος என்பதற்கு இச்சூழலில் ‘எஜமான்’ என்ற பொருளும் சாத்தியம்.
  - marker: b
    text: “உடனே அவர் அவற்றை அனுப்புவார்” என்றும் மொழிபெயர்க்கலாம். இங்கு எழுவாய் வெளிப்படையாகக் கூறப்படவில்லை; சீடர்களிடம் பேசுகிற நபரே விலங்குகளை அனுப்புவார் என்பதே மிகவும் இயல்பான பொருள்.
    reason: ἀποστελεῖ என்ற வினையின் மறைந்த எழுவாயையும் அதனால் நிலைக்கும் இலக்கணத் தெளிவின்மையையும் விளக்குகிறது.
lexical_decisions:
- source_word: ἐάν τις
  choice: யாராவது ... சொன்னால்
  rationale: திறந்த நிலை நிபந்தனையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ὑμῖν
  choice: உங்களிடம்
  rationale: சீடர்கள் பலரைக் குறிக்கும் பன்மையைத் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: εἴπῃ τι
  choice: ஏதாவது சொன்னால்
  rationale: எந்தவகையான வாய்மொழித் தடையையோ கேள்வியையோ உள்ளடக்கக்கூடிய λέγω + τι என்பதன் பரந்த பொருளைப் பாதுகாக்கிறது; ‘கேட்டால்’ என்று குறுக்கவில்லை.
- source_word: ἐρεῖτε
  choice: சொல்லுங்கள்
  rationale: எதிர்கால வினையின் அறிவுறுத்தல் வலிமையை இயல்பான தமிழ் கட்டளை வடிவில் தருகிறது.
- source_word: Ὁ κύριος
  choice: ஆண்டவர்
  rationale: κύριος என்பதன் அதிகாரமும் கிறிஸ்துவியல் நிறையும் பாதுகாக்கப்படுகின்றன; வெறும் மனித உரிமையாளரை மட்டும் குறிக்கும் வகையில் மொழிபெயர்க்கப்படவில்லை.
- source_word: αὐτῶν χρείαν ἔχει
  choice: அவை தேவை
  rationale: முன் வசனத்தில் உள்ள இரண்டு விலங்குகளையும் குறிக்கும் பன்மைப் பதிலிடுபெயரைத் தக்கவைத்து, தமிழ் வழக்கில் இயல்பாக idiom-ஐ வழங்குகிறது.
- source_word: εὐθὺς
  choice: உடனே
  rationale: தாமதமில்லாத செயலைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀποστελεῖ αὐτούς
  choice: அவற்றை அனுப்பிவிடுவார்
  rationale: ‘திருப்பி அனுப்புவார்’ அல்லது ‘அவிழ்த்துவிடுவார்’ என்ற மூலத்தில் வெளிப்படையாக இல்லாத பொருளைச் சேர்க்காமல், அனுப்பும் செயலைக் கூறுகிறது. தமிழில் மரியாதை ஒருமை வினை வடிவம் சூழலில் உள்ள மனிதச் செய்பவருக்கு ஏற்றது.
theological_decisions:
- issue: Ὁ κύριος என்பதன் குறிப்பு மற்றும் வலிமை
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: இச்சூழலில் இயேசு தம்மைக் குறித்து அதிகாரத்துடன் பேசுவதையும், κύριος என்பதிலுள்ள கிறிஸ்துவியல் நிறையையும் ‘ஆண்டவர்’ பாதுகாக்கிறது. அதேவேளையில் ‘எஜமான்’ என்ற உடனடிச் சூழல்சார் பொருள் சாத்தியமுள்ளதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἀποστελεῖ என்பதன் மறைந்த எழுவாய்
  choice: முதன்மை உரையில் எழுவாயை வெளிப்படையாகச் சேர்க்காமல் விடுதல்
  alternative: அவர்—அதாவது, அவர்களிடம் பேசுகிற நபர்—அவற்றை அனுப்புவார்
  rationale: கிரேக்க வினையில் எழுவாய் வெளிப்படையாகக் கூறப்படவில்லை. சூழலில் சீடர்களிடம் பேசுகிற நபரே விலங்குகளை அனுப்புவார் என்பது மிகவும் இயல்பான புரிதல்; ஆயினும் தமிழிலும் எழுவாயை மறைத்தே வைத்து மூலத்தின் இலக்கணத் தெளிவின்மையைப் பாதுகாக்கிறோம்.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயும் கண்ணியமானதாயும் உள்ளது. ‘அவை/அவற்றை’ என்பவை விலங்குகளைக் குறிக்க இயல்பாகப் பயன்படுத்தப்பட்டுள்ளன. மூலத்தில் வெளிப்படையாக இல்லாத இறுதி வினையின் எழுவாயை முதன்மை உரையில் சேர்க்காமல், அடிக்குறிப்பில் விளக்கியுள்ளோம்.
