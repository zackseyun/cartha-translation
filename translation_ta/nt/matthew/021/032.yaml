  terminology: ‘நீதி,’ ‘அவரை நம்புதல்,’ and ‘மனதை மாற்றிக்கொள்ளுதல்’ are suitable choices. ‘பாலியல் தொழிலாளிகள்’ is current and intelligible; while less stigmatizing than the Greek social label, it still identifies the occupational group and does not introduce a doctrinal interpretation. The note properly distinguishes μεταμέλομαι from μετανοέω without making the distinction absolute.
