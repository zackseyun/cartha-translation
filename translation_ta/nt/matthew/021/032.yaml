id: MAT.21.32
reference: Matthew 21:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἦλθεν γὰρ ⸂Ἰωάννης πρὸς ὑμᾶς⸃ ἐν ὁδῷ δικαιοσύνης, καὶ οὐκ ἐπιστεύσατε αὐτῷ· οἱ δὲ τελῶναι καὶ αἱ πόρναι ἐπίστευσαν αὐτῷ· ὑμεῖς δὲ ἰδόντες ⸀οὐδὲ μετεμελήθητε ὕστερον τοῦ πιστεῦσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/032.yaml
  text: For John came to you in the way of righteousness[a], and you did not believe him; but the tax collectors and the prostitutes believed him. But even after seeing this[c][b], you did not afterward change your minds so as to believe him.
translation:
  language: ta
  text: ஏனெனில், யோவான் உங்களிடம் நீதியின் வழியில்[a] வந்தார்; நீங்கள் அவரை நம்பவில்லை. ஆனால் வரி வசூலிப்பவர்களும் பாலியல் தொழிலாளிகளும் அவரை நம்பினார்கள். நீங்களோ இதைக் கண்ட பின்னும், அவரை நம்பும்படி உங்கள் மனதை மாற்றிக்கொள்ளவில்லை[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீதியான முறையில்” அல்லது “நீதியின் பாதையில்.” கிரேக்கச் சொற்றொடர் யோவானின் வாழ்க்கை மற்றும் ஊழிய முறைமையையோ, அவர் அறிவித்த நீதியான வழியையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அவரை நம்பும்படி” என்பதற்கு, “அவர்மீது நம்பிக்கை வைக்கும்படி” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “உங்கள் மனதை மாற்றிக்கொள்ளவில்லை” என்பதற்கு, “மனந்திரும்பவில்லை” அல்லது “வருந்தி மனம் மாறவில்லை” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்க வினைச்சொல் வழக்கமாக ‘மனந்திரும்புதல்’ என்று மொழிபெயர்க்கப்படும் μετανοέω அல்ல; மனமாற்றம் அல்லது வருத்தத்தை இன்னும் குறிப்பாக உணர்த்தும் μεταμέλομαι ஆகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν γὰρ
  choice: ஏனெனில் ... வந்தார்
  rationale: γὰρ முந்தைய கண்டிப்புக்கான காரணத்தை அறிமுகப்படுத்துகிறது; ἦλθεν என்பதற்கு இயல்பான இறந்தகால வடிவம் பயன்படுத்தப்பட்டது.
- source_word: πρὸς ὑμᾶς
  choice: உங்களிடம்
  rationale: πρός உடன் வரும் இயக்கத்தையும், யோவான் அவர்களிடம் வந்து ஊழியம் செய்ததையும் நேரடியாகத் தெரிவிக்கிறது.
- source_word: ἐν ὁδῷ δικαιοσύνης
  choice: நீதியின் வழியில்
  rationale: ὁδός என்பதன் ‘வழி’ உருவகத்தையும் δικαιοσύνη என்பதன் ஒழுக்க-இறைநெறிசார் பொருளையும் காக்கிறது; சொற்றொடரின் இயல்பு ambiguity அடிக்குறிப்பில் வைக்கப்பட்டது.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ / ἐπίστευσαν αὐτῷ
  choice: அவரை நம்பவில்லை / அவரை நம்பினார்கள்
  rationale: πιστεύω + dative இங்கு ஒருவரின் செய்தியை நம்புதல் அல்லது அவர்மீது நம்பிக்கை வைத்தல் எனப் பொருள்படலாம்; இரு இடங்களிலும் முரண்பாட்டைத் தெளிவாகக் காக்க ஒரே சொல் நடை பயன்படுத்தப்பட்டது.
- source_word: τελῶναι
  choice: வரி வசூலிப்பவர்கள்
  rationale: நவீனத் தமிழில் தெளிவான, நேரடியான சமூகப் பணிப்பெயர்.
- source_word: πόρναι
  choice: பாலியல் தொழிலாளிகள்
  rationale: πόρναι குறிக்கும் சமூகக் குழுவை நவீனத் தமிழில் புரிந்துகொள்ளத்தக்க வகையில் குறிப்பிடுகிறது; மூலத்தின் சமூக-ஒழுக்க அதிர்வை முற்றிலும் மறைக்காது.
- source_word: ἰδόντες
  choice: இதைக் கண்ட பின்னும்
  rationale: இறந்தகாலப் பங்கேற்புச் சொல்லை காலநிலை மற்றும் concessive வலியுறுத்தலுடன் இயல்பாக அளிக்கிறது; ‘இது’ என்பது வரி வசூலிப்பவர்களும் பாலியல் தொழிலாளிகளும் யோவானை நம்பியதைச் சுட்டுகிறது.
- source_word: οὐδὲ μετεμελήθητε ὕστερον
  choice: கண்ட பின்னும் ... உங்கள் மனதை மாற்றிக்கொள்ளவில்லை
  rationale: οὐδὲ மற்றும் ὕστερον தரும் ‘அதற்குப் பின்னும் இல்லை’ என்ற வலியுறுத்தலைக் காக்கிறது; μεταμέλομαι என்பதை வழக்கமான ‘மனந்திரும்புதல்’ என்ற தொழில்நுட்பச் சொல்லுடன் ஒன்றாக்காமல் அதன் மனமாற்றம்/வருத்தம் சார்ந்த நுணுக்கத்தை வெளிப்படுத்துகிறது.
- source_word: τοῦ πιστεῦσαι αὐτῷ
  choice: அவரை நம்பும்படி
  rationale: இறுதி நோக்கம் அல்லது விளைவைக் குறிக்கும் infinitival கட்டமைப்பை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: δικαιοσύνη என்பதன் பொருள்
  choice: நீதி
  alternative: நீதியான நடத்தை / நேர்மையான வழி
  rationale: மத்தேயுவில் வரும் இறைநெறி மற்றும் சரியான வாழ்வு சார்ந்த கருத்தை ‘நீதி’ காக்கிறது; யோவானின் வாழ்க்கைமுறையையா அவர் அறிவித்த வழியையா குறிக்கிறது என்ற திறந்த தன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: πιστεύω + αὐτῷ
  choice: அவரை நம்புதல்
  alternative: அவர்மீது நம்பிக்கை வைத்தல்
  rationale: யோவானின் செய்திக்கும் சாட்சிக்கும் அளித்த பதிலை நேரடியாகச் சொல்கிறது; ‘அவரில் விசுவாசித்தல்’ போன்ற பின்னாளைய கோட்பாட்டுச் சூத்திரத்தை மூலத்தில் இல்லாமல் சேர்ப்பதைத் தவிர்க்கிறது.
- issue: μεταμέλομαι என்பதன் மொழிபெயர்ப்பு
  choice: மனதை மாற்றிக்கொள்ளுதல்
  alternative: மனந்திரும்புதல் / வருந்துதல்
  rationale: μετανοέω என்பதுடன் தேவையின்றி ஒன்றாக்காமல், பின்னர் ஏற்பட்டிருக்க வேண்டிய மனமாற்றம் என்ற குறிப்பிட்ட நுணுக்கத்தைக் காக்கிறது. இருப்பினும் மனந்திரும்புதல் என்ற சூழல்சார் வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘நீதி,’ ‘நம்புதல்,’ ‘மனதை மாற்றிக்கொள்ளுதல்’ ஆகியவை மூலத்தின் கருத்து வேறுபாடுகளையும் இறையியல் இழுப்பையும் காக்கத் தேர்ந்தெடுக்கப்பட்டன. எதிர்மறை ஒப்பீட்டைத் தெளிவுபடுத்த ‘ஆனால்’ மற்றும் வலியுறுத்தப்பட்ட ὑμεῖς δὲ-க்கு ‘நீங்களோ’ பயன்படுத்தப்பட்டது.
