source:
  edition: SBLGNT
  text: ⸂Καὶ ὁ πεσὼν ἐπὶ τὸν λίθον τοῦτον συνθλασθήσεται· ἐφ’ ὃν δ’ ἂν πέσῃ λικμήσει αὐτόν.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/044.yaml
  text: And the one who falls on this stone will be broken to pieces[a]; but on whomever it falls[b], it will crush him.
translation:
  language: ta
  text: இந்தக் கல்லின்மேல் விழுபவன் நொறுங்கிப்போவான்; ஆனால் இது எவன்மேல் விழுமோ, அவனைப் பொடியாக்கிவிடும்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவனைத் தூளாக்கிவிடும்’ அல்லது ‘பதரைப்போல் சிதறடிக்கும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: மத்தேயுவின் சில கையெழுத்துப் பிரதிகளில் இந்த வசனம் இல்லை; இதற்கு இணையான வாசகம் லூக்கா 20:18-ல் உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: ὁ πεσὼν
  choice: விழுகிறவன்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் ஒருமை ஆண்பால் வினையெச்சத்தைப் பொதுவாக ஒருவரைக் குறிக்கும் இயல்பான தமிழில் தருகிறது.
- source_word: ἐπὶ τὸν λίθον τοῦτον
  choice: இந்தக் கல்லின்மேல்
  rationale: நேரடியான இடப்பொருளைத் தக்கவைத்து, சுற்றியுள்ள வசனங்களின் ‘கல்’ உருவகத்தோடு தொடர்பைப் பேணுகிறது.
- source_word: συνθλασθήσεται
  choice: நொறுங்கிப்போவான்
  rationale: கடும் முறிவைச் சுட்டும் எதிர்காலச் செயப்பாட்டு வடிவத்தின் பொருளை இயல்பாகத் தருகிறது; அடுத்த வினைச்சொல்லின் இன்னும் தீவிரமான பொடியாக்கும் படிமத்திலிருந்து வேறுபாட்டையும் பேணுகிறது.
- source_word: ἐφ’ ὃν δ’ ἂν πέσῃ
  choice: ஆனால் இது எவன்மேல் விழுமோ
  rationale: இரண்டாம் பகுதியில் தாக்கத்தின் திசை மாறி, கல்லே விழும் எழுவாயாக இருப்பதைத் தெளிவாக்குகிறது; ἄν உடனான வரையறையற்ற தொடர்பு அமைப்பை ‘எவன்மேல் … விழுமோ’ என இயல்பாகத் தருகிறது.
- source_word: λικμήσει
  choice: பொடியாக்கிவிடும்
  rationale: நசுக்குதல், பொடியாக்குதல் அல்லது பதரைப்போல் சிதறடித்தல் என்ற தீவிரப் படிமத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: αὐτόν
  choice: அவனை
  rationale: மூலத்தின் ஆண்பால் ஒருமைப் பிரதிப்பெயரையும், பொதுவான ஒருமை நபர் குறிப்பையும் தக்கவைக்கிறது.
theological_decisions:
- issue: கல் உருவகமும் தீர்ப்பின் படிமமும்
  choice: ‘கல்’ என்ற நேரடியான உருவகத்தையும் இரு வேறுபட்ட அழிவுச் செயல்களையும் விளக்கச் சேர்க்கையின்றித் தக்கவைத்தல்
  alternative: முதன்மை உரையிலேயே கல்லை இயேசு அல்லது மேசியா என்று வெளிப்படையாக அடையாளப்படுத்துதல்
  rationale: சுற்றியுள்ள சூழல் கல்லின் அடையாளத்தை விளக்கினாலும், இந்த வசனம் உருவகமான எச்சரிக்கையாகவே பேசுகிறது; மொழிபெயர்ப்பு அந்த இறையியல் பதற்றத்தை விளக்கவுரையால் தீர்த்துவிடவில்லை.
- issue: பொதுவான ஆண்பால் ஒருமை குறிப்பு
  choice: ‘எவன் … அவனை’ என்ற ஒருமை ஆண்பால் அமைப்பைப் பயன்படுத்துதல்
  alternative: பன்மை அல்லது பாலினமற்ற சொல்லாக்கம் பயன்படுத்துதல்
  rationale: கிரேக்க உரையின் ஆண்பால் ஒருமை அமைப்பையும் அதன் பிரதிநிதித்துவப் பொதுப்பொருளையும் தமிழில் துல்லியமாகப் பேணுகிறது.
- issue: வசனத்தின் உரைவேறுபாடு
  choice: வசனத்தை முதன்மை உரையில் வைத்துக் கையெழுத்துப் பிரதி வேறுபாட்டை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: சில பிரதிகளில் இல்லாததால் வசனத்தை முதன்மை உரையிலிருந்து நீக்குதல்
  rationale: SBLGNT இவ்வசனத்தை உரைவேறுபாட்டுக் குறிகளுக்குள் வழங்குகிறது; கிடைக்கும் சான்றின் நிலையைக் வாசகரிடமிருந்து மறைக்காமல் உரையையும் வேறுபாட்டையும் இரண்டையும் தருவது பொருத்தமானது.
