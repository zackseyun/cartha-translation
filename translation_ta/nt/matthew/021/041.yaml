id: MAT.21.41
reference: Matthew 21:41
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ· Κακοὺς κακῶς ἀπολέσει αὐτούς, καὶ τὸν ἀμπελῶνα ἐκδώσεται ἄλλοις γεωργοῖς, οἵτινες ἀποδώσουσιν αὐτῷ τοὺς καρποὺς ἐν τοῖς καιροῖς αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/041.yaml
  text: They said to him[a], “He will miserably destroy those wretches, and he will lease the vineyard to other farmers[c][b], who will give him the fruits in their seasons.”
translation:
  language: ta
  text: அவர்கள் அவரிடம், “அந்தத் தீயவர்களை அவர் கடுமையாக அழிப்பார்,[a] திராட்சைத்தோட்டத்தை வேறு உழவர்களுக்குக் குத்தகைக்கு விடுவார்.[b] அவர்கள் உரிய காலங்களில் அதன் கனிகளை அவருக்குக் கொடுப்பார்கள்.[c]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தத்திற்கு நெருக்கமாக, “அந்தத் தீயவர்களைத் தீய விதத்தில் அழிப்பார்.” கிரேக்கத்தில் ஒரே வேரைச் சேர்ந்த பெயரடையும் வினையடையும் பயன்படுத்தப்பட்டு தீர்ப்பின் கடுமை வலியுறுத்தப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: வேறு வகையில், “திராட்சைத்தோட்டத்தை வேறு குத்தகைக்காரர்களிடம் ஒப்படைப்பார்.”
    reason: lexical_alternative
  - marker: c
    text: வேறு வகையில், “உரிய காலங்களில் விளைச்சலை அவருக்குச் செலுத்துவார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: அவர்கள் அவரிடம் … என்றார்கள்
  rationale: கிரேக்க நிகழ்கால வினைச்சொல் இங்கு கதைநடையில் வரும் வரலாற்று நிகழ்காலம்; இயல்பான தமிழ் கதைநடைக்காக இறந்தகாலம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: Κακοὺς κακῶς
  choice: அந்தத் தீயவர்களை … மிகக் கொடுமையாக
  rationale: ஒரே வேரிலிருந்து வந்த பெயரடை–வினையடைச் சொல்விளையாட்டைத் தமிழில் இயல்பாக அப்படியே மீளுருவாக்க முடியாததால், ‘தீயவர்கள்’ என்ற அறநிலை மதிப்பீட்டையும் ‘மிகக் கொடுமையாக’ என்ற தீவிரத்தையும் சேர்த்துப் பாதுகாக்கிறது.
- source_word: ἀπολέσει
  choice: அழிப்பார்
  rationale: தீர்ப்பின் கடுமையைத் தெளிவாகக் காட்டுகிறது; ஆனால் அழிவின் துல்லியமான முறையை உரை கூறுவதைவிட அதிகமாகக் குறிப்பிடவில்லை.
- source_word: τὸν ἀμπελῶνα
  choice: திராட்சைத்தோட்டத்தை
  rationale: திராட்சைத் தோட்டம் என்ற வேளாண் உருவகத்தையும் அதன் வேதாகமப் பின்னொலியையும் காக்கும் வழக்கமான தமிழ் சொல்.
- source_word: ἐκδώσεται
  choice: குத்தகைக்கு விடுவார்
  rationale: இந்த வேளாண் சூழலில் சொத்தை மற்றவர்களிடம் வாடகை அல்லது குத்தகைக்கு ஒப்படைப்பதைக் குறிக்கிறது; ‘குத்தகைக்கு விடுதல்’ நவீன தமிழில் துல்லியமும் இயல்பும் உடையது.
- source_word: ἄλλοις γεωργοῖς
  choice: வேறு உழவர்களுக்கு
  rationale: γεωργοί என்பது நிலத்தைப் பயிரிடுபவர்களைக் குறிக்கிறது. குத்தகை உறவு முன் வினைச்சொல்லால் தெளிவாவதால் ‘உழவர்கள்’ போதுமானதும் இயல்பானதும் ஆகும்.
- source_word: οἵτινες
  choice: அவர்கள்
  rationale: எதிர்பார்க்கப்படும் செயலைச் செய்யும் புதிய உழவர்களை இயல்பான தமிழ் தொடர்பாக்கத்தில் குறிக்கிறது; கிரேக்கத்தின் பண்புசார் நுணுக்கத்தை தேவையற்ற விறைப்பின்றி சூழல் உணர்த்துகிறது.
- source_word: ἀποδώσουσιν αὐτῷ
  choice: அவருக்குக் கொடுப்பார்கள்
  rationale: குத்தகையின் பேரில் உரிமையாளருக்குச் சேர வேண்டியதைத் திருப்பிக் கொடுக்கும் பொருளைச் சூழல் தெளிவாக்குகிறது; ‘கொடுப்பார்கள்’ பொதுவான வாசகருக்கு இயல்பானது.
- source_word: τοὺς καρποὺς
  choice: அதன் கனிகளை
  rationale: வேளாண் காட்சியையும் ‘கனி’ என்பதன் உருவகப் பின்னொலியையும் காக்கிறது; ‘அதன்’ என்பது கனிகள் திராட்சைத்தோட்டத்துக்குரியவை என்பதைத் தெளிவாக்குகிறது.
- source_word: ἐν τοῖς καιροῖς αὐτῶν
  choice: உரிய காலங்களில்
  rationale: καιροί என்பதிலுள்ள நியமிக்கப்பட்ட அல்லது தகுந்த காலங்கள் என்ற பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: குத்தகைக்காரர்கள்மீது வரும் தீர்ப்பின் கடுமையும் தன்மையும்
  choice: அந்தத் தீயவர்களை அவர் மிகக் கொடுமையாக அழிப்பார்
  alternative: அந்தக் கொடியவர்களை அவர் கொடிய விதத்தில் அழிப்பார்
  rationale: கிரேக்கத்தில் தொழில்நுட்பமான இறையியல் சொல் அல்ல, தீவிரப்படுத்தும் சொல்விளையாட்டே உள்ளது. இத்தேர்வு தீர்ப்பின் கடுமையைப் பாதுகாக்கிறது; அதேவேளை தண்டனையின் துல்லியமான வடிவம் குறித்து மூல உரைக்கு அப்பாற்பட்ட கோட்பாட்டைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கச் சொல்விளையாட்டின் தீவிரம் முதன்மை உரையிலும் அதன் வடிவம் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது; குத்தகைச் சூழலும் ‘கனி’ உருவகமும் தெளிவாக வைக்கப்பட்டுள்ளன.
