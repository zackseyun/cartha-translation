id: MAT.21.1
reference: Matthew 21:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤγγισαν εἰς Ἱεροσόλυμα καὶ ἦλθον εἰς Βηθφαγὴ ⸀εἰς τὸ Ὄρος τῶν Ἐλαιῶν, τότε ⸀Ἰησοῦς ἀπέστειλεν δύο μαθητὰς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/001.yaml
  text: And when they came near to Jerusalem and came to Bethphage[a], to the Mount of Olives, then Jesus sent two disciples
translation:
  language: ta
  text: அவர்கள் எருசலேமை நெருங்கி, ஒலிவ மலையிலுள்ள பெத்பகேக்கு வந்தபோது[a], இயேசு சீடர்கள் இருவரை அனுப்பினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் எருசலேமை நெருங்கி, பெத்பகேக்கு, ஒலிவ மலைக்கு வந்தபோது.”
    reason: பெத்பகே மற்றும் ஒலிவ மலை ஆகியவற்றுக்கு முன் கிரேக்கத்தில் ஒரே திசைநிலை முன்னிடைச்சொல் பயன்படுத்தப்பட்டுள்ளது; அவற்றின் தொடர்பை நேரடியாகப் பிரதிபலிக்கும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: ἤγγισαν
  choice: நெருங்கி
  rationale: ἐγγίζω இங்கு ஓர் இடத்தை அணுகுவதைக் குறிக்கிறது; ‘நெருங்கி’ என்பது இயல்பான நவீனத் தமிழில் அந்த இயக்கத்தை நேரடியாகத் தெரிவிக்கிறது.
- source_word: Ἱεροσόλυμα
  choice: எருசலேம்
  rationale: தமிழில் பரவலாக நிலைபெற்றுள்ள இடப்பெயர் வடிவம்.
- source_word: ἦλθον
  choice: வந்தபோது
  rationale: ἔρχομαι என்பதன் சாதாரண இயக்கப் பொருளைத் தருகிறது; ὅτε உடன் இணைந்த வாக்கிய அமைப்பு தமிழில் இயல்பாக ‘வந்தபோது’ என்று வழங்கப்படுகிறது.
- source_word: Βηθφαγὴ
  choice: பெத்பகே
  rationale: தமிழில் வழக்கிலுள்ள இடப்பெயர் ஒலிபெயர்ப்பு.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: ஒலிவ மலையிலுள்ள
  rationale: இச்சொற்றொடர் பெத்பகேயை ஒலிவ மலையுடன் புவியியல் ரீதியாக இணைக்கிறது. தமிழில் ‘ஒலிவ மலையிலுள்ள பெத்பகே’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது; கிரேக்கத்தின் நேரடியான திசைநிலை வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: τότε
  choice: வந்தபோது … அனுப்பினார்
  rationale: கிரேக்கத்தில் τότε குறிக்கும் அடுத்தடுத்த நிகழ்வைத் தமிழின் காலத் துணைவாக்கிய அமைப்பு இயல்பாக வெளிப்படுத்துகிறது; தனியே ‘அப்போது’ சேர்ப்பது தேவையற்ற மீளுரைப்பாக இருக்கும்.
- source_word: ἀπέστειλεν
  choice: அனுப்பினார்
  rationale: ஒரு பணிக்காக அனுப்புதல் என்ற சாதாரண கதைநடைப் பொருளை நேரடியாக வழங்குகிறது.
- source_word: δύο μαθητὰς
  choice: சீடர்கள் இருவரை
  rationale: எண்ணிக்கையையும் μαθητής என்பதன் நற்செய்தி நூல் சார்ந்த பொருளையும் இயல்பான தமிழ் சொல்வரிசையில் வழங்குகிறது.
theological_decisions:
- issue: இயேசுவின் பெயர் வருவதற்கு முன் உள்ள பன்மை வினைகளின் மறைமுக எழுவாய்
  choice: ‘அவர்கள்’ என்று மட்டும் வழங்கி, கிரேக்கத்தில் இயேசுவின் பெயர் தோன்றும் இடத்திலேயே அவரைப் பெயரிடுதல்
  alternative: ‘இயேசுவும் அவருடைய சீடர்களும்’ என்று எழுவாயை விரிவுபடுத்துதல்
  rationale: கிரேக்கம் பயணித்த குழுவை பன்மை வினைகளால் மறைமுகமாகக் குறிப்பிடுகிறது; அந்தக் குழுவின் உறுப்பினர்களை இவ்வசனம் வெளிப்படையாகப் பெயரிடவில்லை. ஆகவே மூலத்தின் கதைநடைச் சுருக்கமும் தெளிவின்மையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அவர்கள்’ என்ற சுட்டுப்பெயர் மூலத்தில் உள்ள மறைமுகக் குழு எழுவாயைப் பாதுகாக்கிறது; தேவையற்ற விளக்கச் சேர்க்கை தவிர்க்கப்பட்டுள்ளது.
