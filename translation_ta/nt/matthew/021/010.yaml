id: MAT.21.10
reference: Matthew 21:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἰσελθόντος αὐτοῦ εἰς Ἱεροσόλυμα ἐσείσθη πᾶσα ἡ πόλις λέγουσα· Τίς ἐστιν οὗτος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/010.yaml
  text: And when he entered Jerusalem[a], the whole city was stirred up, saying, “Who is this?”
translation:
  language: ta
  text: அவர் எருசலேமுக்குள் நுழைந்தபோது, நகரம் முழுவதும் கலக்கமடைந்தது; “இவர் யார்?” என்று கேட்டது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσελθόντος αὐτοῦ
  choice: அவர் ... நுழைந்தபோது
  rationale: மரபுத்தொடர் வேற்றுமைத் தனிநிலை அமைப்பை இயல்பான தமிழில் காலத்தைக் குறிக்கும் துணைவாக்கியமாக மொழிபெயர்க்கிறது.
- source_word: Ἱεροσόλυμα
  choice: எருசலேம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள இடப்பெயர் வடிவம்.
- source_word: ἐσείσθη
  choice: பரபரப்படைந்து
  rationale: σείω என்பதன் அடிப்படைப் பொருள் ‘குலுக்கு’; இங்கு நகர மக்களின் கூட்டு மனக்கலக்கத்தையும் கிளர்ச்சியையும் குறிக்கும் உருவகப் பயன்பாட்டை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: πᾶσα ἡ πόλις
  choice: நகரம் முழுவதும்
  rationale: நகரிலுள்ள மக்களை நகரம் எனக் குறிப்பிடும் மூலத்தின் உருவகத்தையும் ‘முழுவதும்’ என்ற முழுமையையும் காக்கிறது.
- source_word: λέγουσα
  choice: என்று கேட்டது
  rationale: மூலத்தில் ‘சொல்லிக்கொண்டு’ என இருந்தாலும், தொடர்ந்து வரும் நேரடிக் கேள்வியின் பேச்சுச் செயலை இயல்பான தமிழில் ‘கேட்டது’ எனத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: Τίς ἐστιν οὗτος;
  choice: இவர் யார்?
  rationale: ‘மனிதன்’ போன்ற மூலத்தில் இல்லாத சொல்லைச் சேர்க்காமல், மரியாதையும் இயல்பும் கொண்ட நேரடியான தமிழ் கேள்வியாகத் தருகிறது.
theological_decisions:
- issue: நகரத்தின் எதிர்வினையில் ἐσείσθη என்பதன் நேரடிப் பொருளா, உருவகப் பொருளா
  choice: மக்களின் பொது மனக்கிளர்ச்சியைக் குறிக்கும் வகையில் ‘பரபரப்படைந்து’
  alternative: ‘குலுங்கியது’
  rationale: சூழல் நிலநடுக்கத்தை அல்ல, இயேசுவின் வருகையால் நகரமெங்கும் ஏற்பட்ட கிளர்ச்சியையும் கலக்கத்தையும் விவரிக்கிறது; அடிப்படை ‘குலுக்குதல்’ உருவகத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. ‘நகரம் ... கேட்டது’ என்பது நகர மக்களைக் ‘நகரம்’ என்று குறிப்பிடும் மூலத்தின் ஆகுபெயர் அமைப்பைப் பாதுகாக்கிறது.
