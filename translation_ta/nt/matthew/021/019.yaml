id: MAT.21.19
reference: Matthew 21:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἰδὼν συκῆν μίαν ἐπὶ τῆς ὁδοῦ ἦλθεν ἐπ’ αὐτήν, καὶ οὐδὲν εὗρεν ἐν αὐτῇ εἰ μὴ φύλλα μόνον, καὶ λέγει αὐτῇ· ⸀Μηκέτι ἐκ σοῦ καρπὸς γένηται εἰς τὸν αἰῶνα· καὶ ἐξηράνθη παραχρῆμα ἡ συκῆ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/019.yaml
  text: And seeing a fig tree by the road[a], he came up to it and found nothing on it except leaves alone. And he said to it, “May there no longer ever be fruit from you.” And the fig tree withered at once.
translation:
  language: ta
  text: சாலையோரத்தில் ஒரு அத்திமரத்தைக் கண்டு, அவர் அதனருகே சென்றார். இலைகளைத் தவிர அதில் வேறொன்றையும் காணவில்லை. அவர் அதை நோக்கி, “கனி இனி ஒருபோதும் உன்னிடமிருந்து உண்டாகாதிருக்கட்டும்” என்றார். உடனே அந்த அத்திமரம் உலர்ந்துபோனது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συκῆν μίαν
  choice: ஒரு அத்திமரத்தை
  rationale: μίαν இங்கு தனிப்பட்ட ஒரு மரத்தை அறிமுகப்படுத்துகிறது; ‘ஒரு’ என்பது இயல்பான தமிழிலும் அந்தக் குறிப்பையும் தக்கவைக்கிறது.
- source_word: ἐπὶ τῆς ὁδοῦ
  choice: சாலையோரத்தில்
  rationale: நிலையான இடத்தைக் குறிக்கும் இச்சொற்றொடருக்கு ‘சாலையோரத்தில்’ என்பது இயல்பான இடவியல் மொழிபெயர்ப்பு; மரம் சாலையின் மேற்பரப்பில் இருந்ததாகத் தவறாக உணர்த்தாது.
- source_word: ἦλθεν ἐπ’ αὐτήν
  choice: அதனருகே சென்றார்
  rationale: மரத்தை நோக்கி அணுகிச் சென்ற இயக்கத்தைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: οὐδὲν εὗρεν ἐν αὐτῇ εἰ μὴ φύλλα μόνον
  choice: இலைகளைத் தவிர அதில் வேறொன்றையும் காணவில்லை
  rationale: εἰ μὴ ... μόνον என்பதன் ‘இலைகள் மட்டுமே’ என்ற வலியுறுத்தலை இயல்பான தமிழ்ச் சொற்றொடரில் தக்கவைக்கிறது.
- source_word: λέγει αὐτῇ
  choice: அவர் அதை நோக்கி ... என்றார்
  rationale: வரலாற்று நிகழ்காலத்தைத் தமிழ் கதைநடைக்கு இயல்பான இறந்தகாலமாக்குகிறது; மரத்திடம் உரைத்ததையும் தெளிவாக்குகிறது.
- source_word: Μηκέτι ἐκ σοῦ καρπὸς γένηται εἰς τὸν αἰῶνα
  choice: இனி ஒருபோதும் உன்னிடமிருந்து கனி உண்டாகாதிருக்கட்டும்
  rationale: Μηκέτι மற்றும் εἰς τὸν αἰῶνα ஆகியவற்றின் நிரந்தர நிறுத்த வலிமையையும், ἐκ σοῦ καρπὸς γένηται என்பதன் ‘உன்னிடமிருந்து கனி உண்டாதல்’ என்ற மூல உருவகத்தையும் காக்கிறது.
- source_word: ἐξηράνθη παραχρῆμα
  choice: உடனே ... பட்டுப்போனது
  rationale: παραχρῆμα என்பதன் உடனடித் தன்மையையும், மரம் உலர்ந்து வாடியதைக் குறிக்கும் ἐξηράνθη என்பதையும் இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: அத்திமரத்திடம் இயேசு கூறிய வார்த்தையின் இலக்கண வலிமை
  choice: “இனி ஒருபோதும் உன்னிடமிருந்து கனி உண்டாகாதிருக்கட்டும்” என விருப்புறுத்தல்/தீர்ப்புரை வடிவில் மொழிபெயர்த்தல்
  alternative: “இனி உன்னிடம் ஒருபோதும் கனி உண்டாகாது” என முன்னறிவிப்புக் கூற்றாக மொழிபெயர்த்தல்
  rationale: Μηκέτι உடன் வரும் γένηται என்ற subjunctive வடிவம் தடை அல்லது தீர்ப்புரையின் வலிமையைக் கொண்டுள்ளது. அதை வெறும் எதிர்கால முன்னறிவிப்பாக மாற்றாமல், மூலத்தின் இறையியல் பதற்றத்தைத் தக்கவைக்கிறது.
- issue: அத்திமர நிகழ்வின் குறியீட்டுப் பொருள்
  choice: குறியீட்டு விளக்கத்தை வசனத்தின் முதன்மை உரையில் சேர்க்காமல் விடுதல்
  alternative: அத்திமரம் இஸ்ரவேலையோ கனியற்ற விசுவாசத்தையோ குறிக்கிறது என்று உரையிலேயே விளக்குதல்
  rationale: இந்த வசனம் நிகழ்வை மட்டுமே கூறுகிறது; குறியீட்டு அடையாளத்தை உரையில் சேர்ப்பது மொழிபெயர்ப்பைத் தாண்டிய விளக்கமாகிவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், அதே நேரத்தில் வேதாகமக் கதைநடைக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘அத்திமரம்’, ‘கனி’, ‘பட்டுப்போனது’ ஆகியவை பரவலாக அறியப்பட்ட தெளிவான சொற்கள்.
