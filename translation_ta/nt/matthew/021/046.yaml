revisions:
- from: அவரைப் பிடிக்க அவர்கள் முயன்றபோதிலும், மக்கள் கூட்டங்களுக்கு அஞ்சினார்கள்; ஏனெனில் மக்கள் அவரை ஓர் இறைவாக்கினர் என்று கருதினார்கள்.[a]
  to: அவரைப் பிடிக்க அவர்கள் முயன்றபோதிலும், கூடியிருந்த மக்களுக்கு அஞ்சினார்கள்; ஏனெனில் மக்கள் அவரை ஓர் இறைவாக்கினர் என்று கருதினார்கள்.[a]
  rationale: 'Only a minor idiomatic revision is made: “மக்கள் கூட்டங்களுக்கு” is replaced with “கூடியிருந்த மக்களுக்கு,” which communicates fear of the gathered populace more naturally in modern standard Tamil. The rest preserves the Greek syntax and sense, including the crowds’ limited narrative assessment of Jesus as a prophet.'
