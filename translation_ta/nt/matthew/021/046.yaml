id: MAT.21.46
reference: Matthew 21:46
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ζητοῦντες αὐτὸν κρατῆσαι ἐφοβήθησαν τοὺς ὄχλους, ⸂ἐπεὶ εἰς⸃ προφήτην αὐτὸν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/046.yaml
  text: And although they were seeking to arrest him[a], they feared the crowds, because they regarded him as a prophet.
translation:
  language: ta
  text: அவரைப் பிடிக்க அவர்கள் முயன்றபோதிலும், கூடியிருந்த மக்களுக்கு அஞ்சினார்கள்; ஏனெனில் மக்கள் அவரை ஓர் இறைவாக்கினர் என்று கருதினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மக்கள் அவரை ஓர் இறைவாக்கினராக மதித்தார்கள்’ அல்லது ‘ஓர் இறைவாக்கினர் என ஏற்றுக்கொண்டார்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητοῦντες
  choice: முயன்றபோதிலும்
  rationale: நிகழ்காலப் பங்கேற்புவினை தொடர்ந்த நோக்கத்தைச் சுட்டுகிறது; சூழலில் முதன்மை வினையுடன் உள்ள விட்டுக்கொடுப்பு உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: κρατῆσαι
  choice: பிடிக்க
  rationale: பகைமை நிறைந்த இச்சூழலில் ஒருவரைக் கைப்பற்றுதல் அல்லது கைது செய்தல் என்ற பொருள். ‘பிடிக்க’ என்பது செயலை இயல்பாகச் சொல்லி, அதிகாரப்பூர்வக் கைது என்ற விவரத்தைத் தேவையின்றி சேர்ப்பதில்லை.
- source_word: ἐφοβήθησαν
  choice: அஞ்சினார்கள்
  rationale: இறந்தகாலச் செயலை நேரடியாகவும் நவீனத் தமிழில் கண்ணியமாகவும் தருகிறது.
- source_word: τοὺς ὄχλους
  choice: மக்கள் கூட்டங்களுக்கு
  rationale: மூலத்தின் பன்மையைப் பாதுகாக்கிறது; அச்சத்தின் இலக்கைத் தமிழில் இயல்பான நான்காம் வேற்றுமையால் குறிக்கிறது.
- source_word: ἐπεὶ εἰς
  choice: ஏனெனில்
  rationale: அவர்கள் மக்கள் கூட்டங்களுக்கு அஞ்சியதற்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: εἰς προφήτην αὐτὸν εἶχον
  choice: மக்கள் அவரை ஓர் இறைவாக்கினர் என்று கருதினார்கள்
  rationale: ‘ஒருவரை இவ்வாறாகக் கொண்டிருத்தல்’ என்ற கிரேக்க மரபுத்தொடரின் ‘கருதுதல்’ பொருளை இயல்பான தமிழில் தருகிறது. எழுவாயான மக்கள் கூட்டங்களை ‘மக்கள்’ என்று மீண்டும் குறிப்பிடுவது தமிழில் தெளிவின்மையைத் தவிர்க்கிறது.
- source_word: προφήτην
  choice: ஓர் இறைவாக்கினர்
  rationale: ஒரு வகையைச் சேர்ந்தவர் என்ற வரையறையற்ற பொருளை ‘ஓர்’ காட்டுகிறது; ‘இறைவாக்கினர்’ என்பது dignified modern Tamil biblical term.
theological_decisions:
- issue: προφήτην என்ற மக்கள் மதிப்பீட்டை, இயேசுவின் முழு அடையாளத்தைச் சுருக்கவோ விரிவுபடுத்தவோாமல் வழங்குதல்
  choice: மக்கள் அவரை ஓர் இறைவாக்கினர் என்று கருதினார்கள்
  alternative: மக்கள் அவரை ஓர் இறைவாக்கினராக மதித்தார்கள்
  rationale: இது மக்களின் பார்வையை அறிக்கையிடுகிறது; இயேசு இறைவாக்கினர் மட்டுமே என்றோ, இங்கு சொல்லப்படுவதைவிட அதிகமான கிறிஸ்தவியல் விளக்கமொன்றையோ மொழிபெயர்ப்பு திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘மக்கள் கூட்டங்கள்’ மூலத்தின் பன்மையைப் பேணுகிறது; ‘மக்கள்’ என்ற மீள்குறிப்பு கிரேக்கப் பிரதிப்பெயரின் எழுவாயைத் தமிழில் தெளிவாக்குகிறது.
