id: MAT.21.27
reference: Matthew 21:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες τῷ Ἰησοῦ εἶπαν· Οὐκ οἴδαμεν. ἔφη αὐτοῖς καὶ αὐτός· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/027.yaml
  text: And answering Jesus, they said, “We do not know.” He also said to them, “Neither will I tell you by what authority I do these things.”
translation:
  language: ta
  text: அவர்கள் இயேசுவுக்குப் பதிலளித்து, “எங்களுக்குத் தெரியாது” என்றார்கள். அவரும் அவர்களிடம், “நானும் எந்த அதிகாரத்தால் இவற்றைச் செய்கிறேன் என்று உங்களுக்குச் சொல்லமாட்டேன்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: பதிலளித்து
  rationale: பதில் உரையை அறிமுகப்படுத்தும் இறந்தகாலப் பங்கேற்புவினையின் செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Οὐκ οἴδαμεν
  choice: எங்களுக்குத் தெரியாது
  rationale: அறியாமையை நேரடியாகவும் நவீனத் தமிழுக்கு இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἔφη
  choice: என்றார்
  rationale: நேர்க் கூற்றுக்குப் பின் வரும் பொதுவான, மரியாதைநிலை காக்கும் தமிழ்ச் சொல்.
- source_word: καὶ αὐτός
  choice: அவரும்
  rationale: அவர்களின் பதிலுக்கு இயேசு அதேபோல் மறுமொழி கூறும் பரஸ்பரத் தொடர்பைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: Οὐδὲ ἐγὼ
  choice: நானும் ... சொல்லமாட்டேன்
  rationale: அவர்கள் தெரிவிக்க மறுத்ததற்கு இணையாக இயேசுவும் தெரிவிக்க மறுப்பதை இயல்பான தமிழில் காட்டுகிறது.
- source_word: λέγω ὑμῖν
  choice: உங்களுக்குச் சொல்லமாட்டேன்
  rationale: இச்சூழலில் தகவலை வெளிப்படுத்த மறுப்பதைக் குறிக்கும் வகையில் λέγω என்பதைக் ‘சொல்’ என வழங்குகிறது.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: எந்த அதிகாரத்தால்
  rationale: செயலின் அங்கீகரிக்கப்பட்ட அடிப்படை அல்லது உரிமையை விசாரிக்கும் சொற்றொடரின் பொருளைக் காக்கிறது.
- source_word: ταῦτα
  choice: இவற்றை
  rationale: மூலத்தின் பன்மைச் சுட்டுப்பெயரைப் பாதுகாத்து, விவாதிக்கப்படும் இயேசுவின் செயல்களைக் குறிக்கிறது.
- source_word: ποιῶ
  choice: செய்கிறேன்
  rationale: உடனடிச் சூழலிலும் பொதுவாகவும் அவர் செய்து வரும் செயல்களைக் குறிக்கும் நிகழ்காலத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: இயேசுவின் பதிலில் ἐξουσία என்பதன் பொருள்
  choice: அதிகாரம்
  alternative: உரிமை; வல்லமை
  rationale: இங்கு தலைவர்கள் இயேசுவின் செயல்திறனை அல்ல, அவர் செயல்படுவதற்கான உரிமையையும் அதிகாரத்தின் மூலத்தையும் கேள்வி கேட்கிறார்கள். ‘அதிகாரம்’ இந்த சட்டபூர்வமான மற்றும் இறையியல் சார்ந்த வலிமையை தேவையின்றி குறுக்காமல் காக்கிறது.
- issue: Οὐδὲ ἐγὼ λέγω என்பதின் காலம் மற்றும் மறுப்பு வலிமை
  choice: நானும் ... சொல்லமாட்டேன்
  alternative: நானும் ... சொல்லவில்லை / சொல்வதில்லை
  rationale: λέγω இலக்கணரீதியாக நிகழ்காலமாக இருந்தாலும், உரையாடலில் இது தகவலைத் தெரிவிக்க மறுக்கும் பதிலாக உள்ளது. தமிழ் மொழிப்பயன்பாட்டில் ‘சொல்லமாட்டேன்’ அந்த மறுப்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- issue: καὶ αὐτός உடனான பதிலளிப்பு தொடர்பு
  choice: அப்படியானால், நானும்
  alternative: அவரும் மட்டும்
  rationale: கிரேக்கத்தில் வெளிப்படையாக ‘அப்படியானால்’ இல்லாவிட்டாலும், καὶ αὐτός மற்றும் Οὐδὲ ἐγώ உருவாக்கும் பதிலுக்கு ஏற்ற மறுமொழித் தொடர்பை இயல்பான தமிழில் தெளிவுபடுத்துகிறது; புதிய காரணத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் கண்ணியமும் கொண்ட உரையாடல் நடை. ‘அவர்/என்றார்’ இயேசுவுக்கான இயல்பான மரியாதை ஒருமையைப் பேணுகின்றன. வசனம் எளிதில் புரியுமாறு அமைக்கப்பட்டாலும், மூலத்தின் பன்மை ‘இவற்றை’ மற்றும் ‘அதிகாரம்’ என்ற கருத்து பாதுகாக்கப்பட்டுள்ளன.
