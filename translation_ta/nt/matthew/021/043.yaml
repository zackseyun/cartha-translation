revisions:
- from: 'ஆகவே, நான் உங்களுக்குச் சொல்கிறேன்: கடவுளுடைய அரசு உங்களிடமிருந்து எடுத்துக்கொள்ளப்பட்டு, அதற்குரிய கனிகளை விளைவிக்கும் ஒரு மக்களினத்துக்குக்[a] கொடுக்கப்படும்.'
  to: 'ஆகவே, நான் உங்களுக்குச் சொல்கிறேன்: கடவுளுடைய ராஜ்யம் உங்களிடமிருந்து எடுத்துக்கொள்ளப்பட்டு, அதன் கனிகளை விளைவிக்கும் ஒரு மக்களினத்துக்குக் கொடுக்கப்படும்.'
  rationale: The revision replaces a potentially secular-political term for God’s kingdom with standard, natural biblical Tamil and renders the possessive ‘its fruits’ more directly. It otherwise preserves the source’s passive future forms, corporate ambiguity concerning ἔθνει, and does not identify the recipient with any particular later theological group.
  reviewer_model: gpt-5.6-terra
