review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the inferential opening, direct address, future passive removal and gift, and the corporate but unspecified recipient denoted by ἔθνει. The relative participial phrase is correctly connected to the recipient, and its pronoun is appropriately understood as referring to ‘the kingdom.’ However, ‘கடவுளுடைய அரசு’ ordinarily evokes a civil government in current Tamil and does not suitably convey the established theological and semantic range of ἡ βασιλεία τοῦ θεοῦ.
  naturalness: The syntax is clear and dignified modern Tamil. Replacing ‘அரசு’ with ‘ராஜ்யம்’ avoids an unintended contemporary political sense. ‘அதன் கனிகளை’ is more direct and less interpretively colored than ‘அதற்குரிய கனிகளை.’
  terminology: Use ‘கடவுளுடைய ராஜ்யம்’ for βασιλεία τοῦ θεοῦ. This is established Tamil biblical terminology and preserves both reign and kingdom dimensions without reducing the phrase to secular ‘government’ or exclusively to abstract rule. ‘ஒரு மக்களினம்’ suitably retains the ambiguity of ἔθνος.
  issues:
  - severity: medium
    issue: ‘கடவுளுடைய அரசு’ for ἡ βασιλεία τοῦ θεοῦ
    rationale: In modern standard Tamil, ‘அரசு’ most readily means a government/state administration. It can therefore introduce a secular-political sense not intended by the Greek. ‘ராஜ்யம்’ is the natural established biblical equivalent and retains the term’s broader range.
  - severity: low
    issue: ‘அதற்குரிய கனிகளை’ for τοὺς καρποὺς αὐτῆς
    rationale: The wording can mean ‘fruits appropriate to it,’ which is slightly more interpretive than the possessive pronoun. ‘அதன் கனிகளை’ directly renders ‘its fruits’ while retaining the kingdom as antecedent.
  revised_text: 'ஆகவே, நான் உங்களுக்குச் சொல்கிறேன்: கடவுளுடைய ராஜ்யம் உங்களிடமிருந்து எடுத்துக்கொள்ளப்பட்டு, அதன் கனிகளை விளைவிக்கும் ஒரு மக்களினத்துக்குக் கொடுக்கப்படும்.'
  revised_footnotes:
