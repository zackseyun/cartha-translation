source:
  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν ὅτι ἀρθήσεται ἀφ’ ὑμῶν ἡ βασιλεία τοῦ θεοῦ καὶ δοθήσεται ἔθνει ποιοῦντι τοὺς καρποὺς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/043.yaml
  text: Therefore I tell you[a], the kingdom of God will be taken away from you and given to a nation producing its fruits.
translation:
  language: ta
  text: 'ஆகவே, நான் உங்களுக்குச் சொல்கிறேன்: கடவுளுடைய ராஜ்யம் உங்களிடமிருந்து எடுத்துக்கொள்ளப்பட்டு, அதன் கனிகளை விளைவிக்கும் ஒரு மக்களினத்துக்குக் கொடுக்கப்படும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ஆகவே
  rationale: முந்தைய உவமையிலிருந்தும் மேற்கோளிலிருந்தும் வரும் முடிவை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: λέγω ὑμῖν
  choice: நான் உங்களுக்குச் சொல்கிறேன்
  rationale: தனிப்பட்ட நேரடி உரைச்சூத்திரத்தை இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: ἀρθήσεται ἀφ’ ὑμῶν
  choice: உங்களிடமிருந்து எடுத்துக்கொள்ளப்பட்டு
  rationale: எதிர்காலச் செயலின் பொருளையும், தற்போதைய உடைமையாளர்களிடமிருந்து அது நீக்கப்படுவதையும் செயல்படுபவர் குறிப்பிடப்படாத வடிவில் தக்கவைக்கிறது.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: கடவுளுடைய அரசு
  rationale: βασιλεία என்பதிலுள்ள ஆட்சியும் ஆளுகைக்குட்பட்ட மண்டலமும் ஆகிய இரு பரிமாணங்களையும் ஒரே கருத்துக்குள் வைத்திருக்கிறது; ‘ஆட்சி’ என்று மட்டும் குறுக்கவில்லை.
- source_word: δοθήσεται
  choice: கொடுக்கப்படும்
  rationale: கிரேக்க எதிர்காலச் செயப்பாட்டு வடிவத்தை இயல்பான தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: ἔθνει
  choice: ஒரு மக்களினத்துக்கு
  rationale: ஒரு தனிநபரை அல்ல, கூட்டான மக்களைக் குறிக்கிறது; சபை, பிற இனத்தார், அல்லது புதுப்பிக்கப்பட்ட இறைமக்கள் என்று மொழிபெயர்ப்பிலேயே முடிவுசெய்யாமல் கிரேக்கச் சொல்லின் பரப்பைத் தக்கவைக்கிறது.
- source_word: ποιοῦντι τοὺς καρποὺς αὐτῆς
  choice: அதற்குரிய கனிகளை விளைவிக்கும்
  rationale: தொடர்ந்து கனிகளை உண்டாக்கும் செயலைக் காட்டுகிறது; αὐτῆς என்பதை இயல்பாக ‘அரசு’ என்பதோடு இணைத்துக் காட்ட ‘அதற்குரிய’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: ἔθνει என்பதன் குறிப்பு
  choice: சபை, பிற இனத்தார், அல்லது வேறு குறிப்பிட்ட குழு என்று அடையாளப்படுத்தாமல் ‘ஒரு மக்களினம்’ எனப் பொதுவாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஒரு நாடு,’ ‘பிற இனத்தார்,’ அல்லது ‘சபை’
  rationale: வசனம் கனிகொடுப்பதன் மூலம் அடையாளம் காணப்படும் ஒரு கூட்டான அமைப்பைக் கூறுகிறது; ஆனால் கிரேக்கச் சொல் மட்டும் அதன் பிற்கால இறையியல் அடையாளத்தைத் தீர்மானிக்கவில்லை.
- issue: ἡ βασιλεία τοῦ θεοῦ என்பதன் பொருள்
  choice: ‘கடவுளுடைய அரசு’ என அதன் முழுக் கருத்துப் பரப்புடன் தக்கவைக்கப்பட்டது.
  alternative: ‘கடவுளுடைய ஆட்சி’ அல்லது ‘கடவுளுடைய மக்களாக இருப்பதற்கான உரிமை’
  rationale: ஆட்சி அல்லது சிறப்புரிமை என்ற ஒரே அம்சமாகக் குறுக்கிப் பொருளுரைப்பதைத் தவிர்த்து, இயேசுவின் சொல்லிலுள்ள இறையியல் செறிவைத் தக்கவைக்கிறது.
- issue: அரசின் கனிகள் யாருடையவை என்பதைக் குறிக்கும் αὐτῆς
  choice: ‘அதற்குரிய கனிகள்’ என்று, இலக்கணப்படி கடவுளுடைய அரசைக் குறிப்பதாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘தங்கள் கனிகளை’ என்று மக்களினத்தைக் குறிப்பதாகப் பொருளுரைத்தல்
  rationale: பெண்பால் ஒருமை αὐτῆς என்பதற்கு அருகிலுள்ள பெண்பால் ஒருமை βασιλεία இயல்பான முன்னிடைச் சொல்; இதையே பிரதான உரை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘மக்களினம்’ என்பது கூட்டான அடையாளத்தைத் தெளிவாக்குவதோடு, குறிப்பிட்ட சமயக் குழுவை மொழிபெயர்ப்பிலேயே நிர்ணயிப்பதைத் தவிர்க்கிறது. பிரதான வாக்கியத்தின் தீர்ப்புத் தொனியையும் இரு எதிர்காலச் செயப்பாட்டு வினைகளையும் தக்கவைத்துள்ளது.
