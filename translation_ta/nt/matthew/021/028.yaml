source:
  edition: SBLGNT
  text: Τί δὲ ὑμῖν δοκεῖ; ἄνθρωπος εἶχεν τέκνα δύο. ⸀προσελθὼν τῷ πρώτῳ εἶπεν· Τέκνον, ὕπαγε σήμερον ἐργάζου ἐν τῷ ⸀ἀμπελῶνι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/028.yaml
  text: But what do you think? A man had two children. Going to the first[a], he said, ‘Child, go work today in the vineyard.’
translation:
  language: ta
  text: “ஆனால், நீங்கள் என்ன நினைக்கிறீர்கள்? ஒரு மனிதருக்கு இரண்டு பிள்ளைகள்[a] இருந்தார்கள். அவர் முதல் பிள்ளையிடம் சென்று, ‘பிள்ளையே, நீ இன்று போய் திராட்சைத்தோட்டத்தில் வேலை செய்’ என்றார்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரண்டு மகன்கள்.” பல ஆங்கில மொழிபெயர்ப்புகள் “மகன்கள்” என்று வழங்குகின்றன; ஆனால் இங்கே கிரேக்க மூலத்தில் “பிள்ளைகள்” (τέκνα) என்ற சொல் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί δὲ ὑμῖν δοκεῖ;
  choice: ஆனால், நீங்கள் என்ன நினைக்கிறீர்கள்?
  rationale: δὲ என்பதன் மென்மையான இணைப்பு/எதிர்மறைத் திருப்பத்தை ‘ஆனால்’ காட்டுகிறது; δοκεῖ இங்கு கேட்போரின் மதிப்பீட்டைக் கேட்பதால், நவீன தமிழில் இயல்பான ‘என்ன நினைக்கிறீர்கள்?’ பயன்படுத்தப்பட்டது.
- source_word: ἄνθρωπος
  choice: ஒரு மனிதர்
  rationale: கதையின் சூழலில் ஆண் வீட்டுத்தலைவரைக் குறிக்கிறது; தேவையில்லாமல் ‘ஒரு குறிப்பிட்ட மனிதர்’ என்று விரிவாக்காமல் இயல்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: τέκνα δύο
  choice: இரண்டு பிள்ளைகள்
  rationale: τέκνα என்பது பாலினத்தைக் குறிப்பாக வரையறுக்காத ‘பிள்ளைகள்’ என்பதே; பாரம்பரியமாக வரும் ‘மகன்கள்’ என்ற குறுகிய பொருளை மூலத்தில் இல்லாமல் சேர்க்கவில்லை.
- source_word: προσελθὼν τῷ πρώτῳ
  choice: முதல் பிள்ளையிடம் சென்று
  rationale: பங்கேற்பு வினையின் தொடர்ச்சிச் செயலை இயல்பான தமிழ் கதைநடையில் காட்டுகிறது; ‘முதல்’ யாரைக் குறிக்கிறது என்பது தெளிவாக இருக்க ‘பிள்ளை’ மீண்டும் சொல்லப்பட்டது.
- source_word: Τέκνον
  choice: பிள்ளையே
  rationale: τέκνον என்பதன் பொதுவான குடும்ப உறவுச் சொல்லைத் தக்கவைக்கிறது; மூலத்தில் இல்லாத ஆண்பால் வரையறையையோ ‘என்’ என்ற உடைமைச் சொல்லையோ சேர்க்கவில்லை.
- source_word: ὕπαγε σήμερον ἐργάζου
  choice: நீ இன்று போய் ... வேலை செய்
  rationale: இரண்டு கட்டளைகளான ‘போ’ மற்றும் ‘வேலை செய்’ என்பவற்றைத் தமிழில் இயல்பான தொடர் வினை அமைப்பில் தருகிறது; σήμερον ‘இன்று’ என நேரடியாக மொழிபெயர்க்கப்பட்டது.
- source_word: ἐν τῷ ἀμπελῶνι
  choice: திராட்சைத்தோட்டத்தில்
  rationale: ἐν என்பதன் இடப்பொருளையும் ἀμπελών என்பதன் வேளாண் உருவகத்தையும் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: τέκνα/τέκνον என்பவற்றை பாரம்பரிய மொழிபெயர்ப்பைப் பின்பற்றி ஆண்பாலாகக் குறுக்க வேண்டுமா
  choice: பிள்ளைகள் / பிள்ளையே
  alternative: மகன்கள் / மகனே
  rationale: இவ்வசனத்தில் கிரேக்கம் υἱοί/υἱέ என்பதற்குப் பதிலாகப் பொதுவான τέκνα/τέκνον என்பவற்றைப் பயன்படுத்துகிறது. ஆகவே பாலினத்தை மூலத்தைவிடக் குறுக்காமல் அதன் விரிவான குடும்பப் பொருள் தக்கவைக்கப்பட்டது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified கதைநடை பயன்படுத்தப்பட்டது. தந்தையின் நேரடி அழைப்பில் ‘பிள்ளையே’ என்பது இயல்பாகவும் மூலத்தின் பாலினப் பொதுமையைக் காக்கும் வகையிலும் உள்ளது. அடிக்குறிப்பு குறி அது விளக்கும் ‘பிள்ளைகள்’ என்பதற்குப் பின்பே வைக்கப்பட்டது.
