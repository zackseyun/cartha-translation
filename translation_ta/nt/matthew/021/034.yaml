- source_word: ὁ καιρὸς τῶν καρπῶν
  choice: கனிகள் விளையும் காலம்
  rationale: καιρός என்பது இங்கு வேளாண்மைக்குரிய ஏற்ற பருவத்தைக் குறிக்கிறது; τῶν καρπῶν உடனான தொடர்பை ‘கனிகள் விளையும் காலம்’ தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது, அறுவடை என்பதை மூலத்தில் இல்லாமல் சேர்ப்பதையும் தவிர்க்கிறது.
- source_word: ἀπέστειλεν
  choice: அனுப்பினார்
  rationale: பொதுவான கதைநடைப் பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: τοὺς δούλους αὐτοῦ
  choice: தம் பணியாளர்களை
  rationale: δοῦλος என்பதற்கு ‘அடிமை’ அல்லது ‘பணியாளர்’ என்ற பொருள் வரலாம். இங்கு நில உரிமையாளரின் பிரதிநிதிகளாக அனுப்பப்படுவதே முன்னிலைப்படுவதால் ‘பணியாளர்கள்’ தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: πρὸς τοὺς γεωργοὺς
  choice: குத்தகை விவசாயிகளிடம்
  rationale: γεωργός என்பது பயிரிடுபவரைக் குறிக்கிறது; உவமையின் சூழலில் அவர்கள் மற்றொருவருடைய திராட்சைத்தோட்டத்தைப் பயிரிடுபவர்கள் என்பதால் ‘குத்தகை விவசாயிகள்’ அவர்களுடைய பங்கை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: λαβεῖν
  choice: பெற்றுக்கொள்ள
  rationale: λαμβάνω என்பதன் ‘பெறுதல்/எடுத்துக்கொள்ளுதல்’ என்ற பரந்த பொருளை வைத்துக்கொண்டு, உரிமையாளர் தமக்குச் சேரும் விளைச்சலைப் பெறுவதை இயல்பாகச் சொல்கிறது.
- source_word: τοὺς καρποὺς αὐτοῦ
  choice: தமது கனிகளை
  rationale: καρπούς என்பதன் பன்மையையும் αὐτοῦ என்பதன் உடைமைத் தொடர்பையும் நேரடியாகப் பாதுகாக்கிறது.
