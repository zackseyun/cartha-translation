  yaml_path: translation/nt/matthew/021/034.yaml
  text: But when the season for the fruits had drawn near[b][a], he sent his servants to the tenant farmers to collect his fruits.
translation:
  language: ta
  text: கனிகள் விளையும் காலம் நெருங்கியபோது, அவர் தமது கனிகளைப் பெற்றுக்கொள்ள தம் பணியாளர்களை[a] குத்தகை விவசாயிகளிடம்[b] அனுப்பினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அடிமைகளை.’ கிரேக்கச் சொல் பணியாளர்களையோ அடிமைகளையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘விவசாயிகளிடம்,’ ‘பயிரிடுபவர்களிடம்.’ கிரேக்கச் சொல் பயிரிடுபவர்களைக் குறிக்கிறது; இங்கு அவர்கள் மற்றொருவருடைய திராட்சைத்தோட்டத்தைப் பயிரிடும் குத்தகையாளர்கள்.
    reason: lexical_alternative
lexical_decisions:
