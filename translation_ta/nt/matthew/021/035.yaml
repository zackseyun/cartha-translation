id: MAT.21.35
reference: Matthew 21:35
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ λαβόντες οἱ γεωργοὶ τοὺς δούλους αὐτοῦ ὃν μὲν ἔδειραν, ὃν δὲ ἀπέκτειναν, ὃν δὲ ἐλιθοβόλησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/035.yaml
  text: And the tenant farmers took his servants; one they beat[a], another they killed, and another they stoned.
translation:
  language: ta
  text: அந்தக் குத்தகை விவசாயிகள் அவனுடைய அடிமைகளை[a]ப் பிடித்து, ஒருவனை அடித்தார்கள்; இன்னொருவனைக் கொன்றார்கள்; மற்றொருவன் மீது கல்லெறிந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பணியாளர்கள்.’ கிரேக்கச் சொல் δοῦλοι; சூழலைப் பொறுத்து இது ‘அடிமைகள்’ அல்லது ‘பணியாளர்கள்’ எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: குத்தகை விவசாயிகள்
  rationale: உரிமையாளரின் நிலத்தைப் பயிரிட்டு அதன் பலனை ஒப்படைக்க வேண்டிய குத்தகை உறவையும், அவர்களுடைய வேளாண் பணியையும் இச்சொற்றொடர் தெளிவாகக் காட்டுகிறது.
- source_word: λαβόντες
  choice: பிடித்து
  rationale: இங்கு தொடர்ந்து வரும் வன்முறைச் செயல்களுக்கு முன்பாக அவர்கள் அடிமைகளைக் கைப்பற்றியதைக் குறிக்கிறது; தமிழில் ‘பிடித்து’ இயல்பாகவும் போதிய வலிமையுடனும் உள்ளது.
- source_word: δούλους
  choice: அடிமைகள்
  rationale: δοῦλος என்பதன் உரிமை மற்றும் கீழ்ப்படிதல் சார்ந்த சமூக நிலையை ‘அடிமைகள்’ நேரடியாகப் பிரதிபலிக்கிறது; இச்சூழலில் அவர்கள் உரிமையாளரின் அதிகாரத்தின்கீழ் அனுப்பப்பட்டவர்கள்.
- source_word: ἔδειραν
  choice: அடித்தார்கள்
  rationale: அடித்தல் அல்லது கடுமையாகத் தாக்குதல் என்ற பொருளைத் தருகிறது; எந்தக் கருவியையோ முறையையோ மூலச்சொல் கட்டாயப்படுத்தாததால் அதனை மிகுதியாக விவரிக்கவில்லை.
- source_word: ἀπέκτειναν
  choice: கொன்றார்கள்
  rationale: வினையின் நேரடியான பொருளைப் பாதுகாக்கிறது; ‘கொலை செய்தார்கள்’ என்பதில் தோன்றக்கூடிய கூடுதல் சட்டநெறிச் சாயலைச் சேர்க்கவில்லை.
- source_word: ἐλιθοβόλησαν
  choice: கல்லெறிந்தார்கள்
  rationale: கற்களை எறிந்து தாக்கிய செயலைத் துல்லியமாகக் காட்டுகிறது; அந்த நபரும் இறந்தார் என்று மூலவாக்கியம் வெளிப்படையாகச் சொல்லாததால் ‘கல்லெறிந்து கொன்றார்கள்’ என விரிவாக்கவில்லை.
- source_word: ὃν μὲν ... ὃν δὲ ... ὃν δὲ
  choice: ஒருவனை ... இன்னொருவனை ... மற்றொருவனை
  rationale: வெவ்வேறு அடிமைகளுக்கு வெவ்வேறு விதமாக நடந்ததைத் தமிழில் தெளிவாக வெளிப்படுத்தும் பகிர்வுக் கட்டமைப்பு.
theological_decisions:
- issue: உவமைக்குள் δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: அடிமைகள்
  alternative: பணியாளர்கள்
  rationale: ‘அடிமைகள்’ என்பது மூலச்சொல்லின் சமூக-சட்ட நிலையை மறைக்காமல் காட்டுகிறது. அதேவேளையில், இங்கு உரிமையாளரால் அனுப்பப்பட்ட பிரதிநிதிகள் என்ற பணிசார் அம்சம் இருப்பதால் ‘பணியாளர்கள்’ என்பது சூழல்சார் மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் தொடர் வன்முறைச் செயல்களும் ‘ஒருவனை—இன்னொருவனை—மற்றொருவனை’ என்ற அமைப்பும் பாதுகாக்கப்பட்டுள்ளன.
