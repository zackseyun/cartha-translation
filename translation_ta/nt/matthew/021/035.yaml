    text: அல்லது, ‘பணியாளர்கள்.’ கிரேக்கச் சொல் δοῦλοι; சூழலைப் பொறுத்து இது ‘அடிமைகள்’ அல்லது ‘பணியாளர்கள்’ எனப் பொருள்படலாம்.
    reason: lexical_alternative
  revision_rationale: The sole revision makes the final clause idiomatic modern Tamil. The threefold distributive pattern, the ownership/status implication of δοῦλοι, and the Greek wording’s lack of an explicit statement of death in the stoning clause are retained.
