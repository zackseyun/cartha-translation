id: MAT.21.17
reference: Matthew 21:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ καταλιπὼν αὐτοὺς ἐξῆλθεν ἔξω τῆς πόλεως εἰς Βηθανίαν, καὶ ηὐλίσθη ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/017.yaml
  text: And leaving them[a], he went out of the city to Bethany and stayed there overnight.
translation:
  language: ta
  text: அவர்களை விட்டுவிட்டு, அவர் நகரத்தைவிட்டு வெளியேறி பெத்தானியாவுக்குச் சென்று, அங்கே இரவு தங்கினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταλιπὼν
  choice: விட்டுவிட்டு
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் காட்டும் இறந்தகாலப் பெயரெச்சத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: αὐτοὺς
  choice: அவர்களை
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்டவர்களைச் சுட்டும் எளிய பிரதிப்பெயர்; கூடுதல் விளக்கத்தைப் புகுத்தவில்லை.
- source_word: ἐξῆλθεν ἔξω τῆς πόλεως
  choice: நகரத்தைவிட்டு வெளியேறி
  rationale: நகருக்கு வெளியே சென்ற இயக்கத்தைத் தெளிவாகவும் தமிழில் இயல்பாகவும் தெரிவிக்கிறது; கிரேக்கத்தின் வலியுறுத்தலை அளவுக்கு மீறிய மறுபதிப்பின்றி காக்கிறது.
- source_word: πόλεως
  choice: நகரம்
  rationale: இங்கு எருசலேமைக் குறிக்கும் πόλις என்பதற்கான வழக்கமான, சூழலுக்கேற்ற தமிழ் சொல்.
- source_word: εἰς Βηθανίαν
  choice: பெத்தானியாவுக்குச் சென்று
  rationale: இடத்தை நோக்கிய இயக்கத்தை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ηὐλίσθη
  choice: இரவு தங்கினார்
  rationale: αὐλίζομαι என்பதிலுள்ள இரவைக் கழித்தல் அல்லது இரவு தங்குதல் என்ற காலநுணுக்கத்தைத் தெளிவாகக் கூறுகிறது.
- source_word: ἐκεῖ
  choice: அங்கே
  rationale: பெத்தானியாவைக் குறிக்கும் இடவினையடை தமிழில் நேரடியாகத் தரப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு எளிதில் புரியும், மரியாதையான நடையில் அமைக்கப்பட்டது. கிரேக்க வாக்கியத்தின் நிகழ்வுவரிசையும் பொருளும் காக்கப்பட்டுள்ளன. ‘இரவு தங்கினார்’ என்பது ηὐλίσθη என்பதன் பொருளை நேரடியாகத் தருவதால் தனி அடிக்குறிப்பு தேவையில்லை.
