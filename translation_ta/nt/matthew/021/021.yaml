id: MAT.21.21
reference: Matthew 21:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐὰν ἔχητε πίστιν καὶ μὴ διακριθῆτε, οὐ μόνον τὸ τῆς συκῆς ποιήσετε, ἀλλὰ κἂν τῷ ὄρει τούτῳ εἴπητε· Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν, γενήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/021.yaml
  text: But Jesus answered them[a], “Truly I say to you, if you have faith and do not doubt, you will not only do what was done to the fig tree, but even if you say to this mountain, ‘Be taken up and thrown into the sea,’ it will happen.”
translation:
  language: ta
  text: 'அதற்கு இயேசு அவர்களிடம், “உண்மையாகவே நான் உங்களுக்குச் சொல்கிறேன்: உங்களுக்கு விசுவாசம் இருந்து, நீங்கள் சந்தேகப்படாமல்[a] இருந்தால், அத்திமரத்துக்கு நிகழ்ந்ததையும் நீங்கள் செய்வீர்கள்; அதுமட்டுமல்லாமல், இந்த மலையிடம், ‘எடுக்கப்பட்டுக் கடலில் எறியப்படு’ என்று சொன்னால்கூட, அது நடக்கும்” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தயங்காமல்”; அல்லது, “மனத்தில் பிளவுபடாமல்.”
    reason: διακριθῆτε என்பதன் பொருள் சந்தேகம், தடுமாற்றம் அல்லது உள்ளார்ந்த மனப்பிளவு ஆகிய நுணுக்கங்களை உடையதாக இருக்கலாம்.
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: அதற்கு இயேசு அவர்களிடம் ... என்றார்
  rationale: பதிலளிக்கும் தொடர்பையும் δέ குறிக்கும் மென்மையான உரைமாற்றத்தையும் இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: உண்மையாகவே நான் உங்களுக்குச் சொல்கிறேன்
  rationale: இயேசுவின் வலியுறுத்தலும் அதிகாரபூர்வமான அறிமுகச் சூத்திரமும் தெளிவாகத் தக்கவைக்கப்படுகின்றன.
- source_word: ἐὰν ἔχητε πίστιν
  choice: உங்களுக்கு விசுவாசம் இருந்து
  rationale: இச்சூழலில் πίστις என்பது குணப்பண்பான உண்மைத்தன்மையைவிட, கடவுள்மீது வைக்கும் நம்பிக்கையுள்ள சார்பைக் குறிக்கிறது; ‘விசுவாசம்’ வழக்கமான இறையியல் சொல்லாகவும் பொதுவாகப் புரிந்துகொள்ளத்தக்கதாகவும் உள்ளது.
- source_word: μὴ διακριθῆτε
  choice: நீங்கள் சந்தேகப்படாமல்
  rationale: இங்கு வினைச்சொல் உள்ளார்ந்த சந்தேகம் அல்லது தயக்கத்தைக் குறிக்கிறது. முதன்மை உரைக்கு ‘சந்தேகப்படாமல்’ தெளிவானது; பிற நுணுக்கங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: οὐ μόνον τὸ τῆς συκῆς ποιήσετε
  choice: அத்திமரத்திற்கு நடந்ததை நீங்கள் செய்வதோடு மட்டுமல்லாமல்
  rationale: τὸ τῆς συκῆς என்பது முன்சூழலில் அத்திமரத்துடன் நிகழ்ந்ததைக் குறிக்கும் சுருக்கமான சொற்றொடர். தமிழில் பொருள் தெளிவாக இருக்கத் தேவையான அளவு மட்டும் விரித்துரைக்கப்படுகிறது.
- source_word: κἂν τῷ ὄρει τούτῳ εἴπητε
  choice: இந்த மலையைப் பார்த்து ... என்று சொன்னாலும்
  rationale: κἄν தரும் ‘அப்படிச் சொன்னால்கூட’ என்ற உயர்த்திக் காட்டும் நிபந்தனை வலிமையையும், τούτῳ என்பதன் சுட்டுப்பொருளையும் தக்கவைக்கிறது.
- source_word: Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν
  choice: தூக்கப்பட்டுக் கடலில் எறியப்படு
  rationale: இரு கட்டளைகளின் செயப்பாட்டு வடிவத்தையும் உடல்சார்ந்த வலிமையான படிமத்தையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: γενήσεται
  choice: அது நடக்கும்
  rationale: கட்டளையிடப்பட்ட நிகழ்வு நிகழும் என்பதைக் குறிக்கும் எளிய, நேரடியான நவீன தமிழ்.
theological_decisions:
- issue: அற்புதச் செயலைக் குறித்த கூற்றில் πίστις என்பதன் பொருள்
  choice: விசுவாசம்
  alternative: நம்பிக்கை; உண்மைத்தன்மை
  rationale: இச்சூழல் கடவுள்மீது சார்ந்த நம்பிக்கையைக் குறிக்கிறது; ‘உண்மைத்தன்மை’ என்ற குணப்பண்பு இங்கு குறைவாகப் பொருந்துகிறது.
- issue: மலையை நகர்த்துவது பற்றிய கூற்றின் இயல்பு
  choice: மிகைப்படுத்தலான, வலிமையான படிம மொழியை விளக்கி ஒடுக்காமல் அப்படியே தக்கவைத்தல்
  alternative: இதை முற்றிலும் சொற்பொருளான அற்புத வாக்குறுதியாக மட்டுமே கொள்ளுதல்; அல்லது சிரமங்களை வெல்வதற்கான உருவகமாக மட்டுமே கொள்ளுதல்
  rationale: மூலவாக்கியம் தரும் இறையியல் மற்றும் இலக்கியத் திறந்தநிலையை மொழிபெயர்ப்பு முன்கூட்டியே ஒரே விளக்கத்திற்குள் அடைக்கக்கூடாது.
translation_notes:
  register: நவீன தரத் தமிழ்; பொதுவாசகர்களுக்குத் தெளிவானதும், இயேசுவின் கூற்றுக்குரிய கண்ணியமும் வலிமையும் கொண்டதுமான நடை. பாரம்பரிய இறையியல் சொல்லான ‘விசுவாசம்’ பயன்படுத்தப்பட்டாலும், வாக்கிய அமைப்பு இயல்பான தற்போதைய தமிழில் வைக்கப்பட்டுள்ளது.
