- from: 'அதற்கு இயேசு அவர்களிடம், “உண்மையாகவே நான் உங்களுக்குச் சொல்கிறேன்: உங்களுக்கு விசுவாசம் இருந்து, நீங்கள் சந்தேகப்படாமல்[a] இருந்தால், அத்திமரத்திற்கு நடந்ததை நீங்கள் செய்வதோடு மட்டுமல்லாமல், இந்த மலையைப் பார்த்து, ‘தூக்கப்பட்டுக் கடலில் எறியப்படு’ என்று சொன்னாலும், அது நடக்கும்” என்றார்.'
  to: 'அதற்கு இயேசு அவர்களிடம், “உண்மையாகவே நான் உங்களுக்குச் சொல்கிறேன்: உங்களுக்கு விசுவாசம் இருந்து, நீங்கள் சந்தேகப்படாமல்[a] இருந்தால், அத்திமரத்துக்கு நிகழ்ந்ததையும் நீங்கள் செய்வீர்கள்; அதுமட்டுமல்லாமல், இந்த மலையிடம், ‘எடுக்கப்பட்டுக் கடலில் எறியப்படு’ என்று சொன்னால்கூட, அது நடக்கும்” என்றார்.'
