id: MAT.21.7
reference: Matthew 21:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἤγαγον τὴν ὄνον καὶ τὸν πῶλον, καὶ ἐπέθηκαν ⸀ἐπ’ αὐτῶν τὰ ⸀ἱμάτια, καὶ ἐπεκάθισεν ἐπάνω αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/007.yaml
  text: They brought the donkey and the colt[a], and put their cloaks on them, and he sat on them.
translation:
  language: ta
  text: அவர்கள் கழுதையையும் குட்டியையும் கொண்டுவந்து, அவற்றின்மேல் தங்கள் மேலாடைகளைப் போட்டார்கள்; அவர் அவற்றின்மேல் அமர்ந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் குறிப்பாக, விலங்குகளின்மேல் போடப்பட்டிருந்த மேலாடைகளின்மேல் அவர் அமர்ந்தார் என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἤγαγον
  choice: கொண்டுவந்து
  rationale: ἄγω என்பதன் இறந்தகால வடிவம் ‘அழைத்துவருதல்’ அல்லது ‘கொண்டுவருதல்’ என்று பொருள்படலாம். சீடர்கள் விலங்குகளை இயேசுவிடம் கொண்டுவந்தார்கள் என்ற நிகழ்வுச் சூழலில் ‘கொண்டுவந்து’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: τὴν ὄνον
  choice: கழுதையை
  rationale: ὄνος இங்கு பெண்பால் சுட்டுடன் வந்தாலும், ‘பெண் கழுதை’ என்று வெளிப்படையாகச் சொல்வது தமிழில் தேவையற்ற விறைப்பை ஏற்படுத்தும். அடுத்ததாக அதன் குட்டி குறிப்பிடப்படுவதால் உறவும் தெளிவாகிறது.
- source_word: τὸν πῶλον
  choice: அதன் குட்டியை
  rationale: πῶλος என்பது இளம் விலங்கைக் குறிக்கிறது; இச்சூழலில் அது கழுதைக்குட்டி. ‘அதன் குட்டி’ என்பது தாய்க் கழுதையுடனான தொடர்பை இயல்பாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: ἐπέθηκαν ἐπ’ αὐτῶν τὰ ἱμάτια
  choice: அவற்றின்மேல் தங்கள் மேலாடைகளைப் போட்டார்கள்
  rationale: ἱμάτια என்பது வெளிப்புற ஆடைகள் அல்லது மேலாடைகளைக் குறிக்கும். ‘தங்கள்’ என்பது சீடர்களின் ஆடைகள் என்பதைச் சூழலிலிருந்து இயல்பாக வெளிப்படுத்துகிறது; பன்மை αὐτῶν ‘அவற்றின்மேல்’ என்று தக்கவைக்கப்பட்டுள்ளது.
- source_word: ἐπεκάθισεν ἐπάνω αὐτῶν
  choice: அவர் அவற்றின்மேல் அமர்ந்தார்
  rationale: மூலத்தில் உள்ள பன்மைப் பெயர்ப்பதிலியைத் தீர்மானித்து ஒருமையாக்காமல் மொழிபெயர்க்கிறது. ‘அவற்றின்மேல்’ என்பது விலங்குகளையோ அவற்றின்மேல் போடப்பட்ட மேலாடைகளையோ குறிக்கக்கூடிய மூலத்தின் உண்மையான தெளிவின்மையைத் தக்கவைக்கிறது.
theological_decisions:
- issue: καὶ ἐπεκάθισεν ἐπάνω αὐτῶν என்பதிலுள்ள இறுதிப் பன்மைப் பெயர்ப்பதிலியின் குறிப்பு
  choice: ‘அவர் அவற்றின்மேல் அமர்ந்தார்’ என்று பன்மையைத் தீர்க்காமல் தக்கவைத்தல்
  alternative: ‘அவர் மேலாடைகளின்மேல் அமர்ந்தார்’ அல்லது ‘அவர் ஒரு விலங்கின்மேல் அமர்ந்தார்’
  rationale: இது கோட்பாட்டுச் சர்ச்சையைவிட இலக்கண மற்றும் நிகழ்வுரை சார்ந்த தெளிவின்மை. மூலத்தின் பன்மையை முதன்மை உரையில் தக்கவைத்து, மேலாடைகளைக் குறிக்கும் பொதுவான புரிதலை அடிக்குறிப்பில் வழங்குவது தேவையற்ற விளக்கத் தீர்மானத்தைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. இயேசுவைக் குறிக்க மரியாதை ஒருமையான ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது. ‘அவற்றின்மேல்’ என்ற வடிவம் மூலத்தின் பன்மையையும் அதன் குறிப்பு சார்ந்த தெளிவின்மையையும் இயல்பாகத் தக்கவைக்கிறது.
