source:
  edition: SBLGNT
  text: Καὶ ἀκούσαντες οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι τὰς παραβολὰς αὐτοῦ ἔγνωσαν ὅτι περὶ αὐτῶν λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/045.yaml
  text: And when the chief priests and the Pharisees heard his parables[a], they knew that he was speaking about them.
translation:
  language: ta
  text: தலைமைக் குருக்களும் பரிசேயர்களும் அவருடைய உவமைகளைக் கேட்டபோது, அவர் தங்களைப் பற்றி பேசுகிறார் என்பதை அறிந்துகொண்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்களைக் குறித்து.” உவமைகள் தங்களை நோக்கியே சொல்லப்பட்டவை என்பதை அவர்கள் உணர்ந்தார்கள் என்பதே பொருள். சில மொழிபெயர்ப்புகள் விளக்கமாக, “தங்களுக்கு எதிராக” என்று தருகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: கேட்டபோது
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் குறிக்கும் இறந்தகாலப் பெயரெச்சத்தை, இயல்பான நவீனத் தமிழில் காலத் துணைவாக்கியமாக வழங்குகிறது.
- source_word: ἀρχιερεῖς
  choice: தலைமைக் குருக்கள்
  rationale: ஒரே காலத்தில் பல தலைமை ஆசாரியர்கள் இருந்தனர் என்ற பொருளைத் தவிர்த்து, மூத்த ஆலயக் குருத்துவத் தலைவர்களைக் குறிக்கும் பன்மையைத் தெளிவாகக் காட்டுகிறது.
- source_word: Φαρισαῖοι
  choice: பரிசேயர்கள்
  rationale: இந்த யூதக் குழுவின் பெயருக்கான வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: παραβολὰς
  choice: உவமைகள்
  rationale: இயேசுவின் உருவகக் கதைகள் மற்றும் கூற்றுகளுக்கான நிலைபெற்ற, இயல்பான தமிழ் வேதாகமச் சொல்.
- source_word: ἔγνωσαν
  choice: அறிந்துகொண்டார்கள்
  rationale: γινώσκω என்ற வினையின் இறந்தகால வடிவம் இங்கு ஏற்கெனவே அறிந்திருந்த நிலையைவிட உணர்ந்து அறிதல் அல்லது அடையாளங்காணுதலைக் குறிக்கிறது.
- source_word: περὶ αὐτῶν
  choice: தங்களைக் குறித்து
  rationale: περί உடன் வரும் உருபு இங்கு ‘பற்றி/குறித்து’ என்பதே நேரடியான பொருள்; சூழலில் கண்டனம் இருந்தாலும் ‘எதிராக’ என்று வலுப்படுத்தவில்லை. ‘தங்களை’ என்பது வாக்கிய எழுவாயான தலைவர்களையே திரும்பச் சுட்டுகிறது.
- source_word: λέγει
  choice: பேசுகிறார்
  rationale: கிரேக்க நிகழ்காலத்தை மறைமுகக் கூற்றுக்குள் நிகழ்காலமாகவே வைத்துப் பொருள் மற்றும் காலத் தன்மையைப் பாதுகாக்கிறது; இது தமிழில் இயல்பாகவும் உள்ளது.
theological_decisions:
- issue: இயேசுவின் உவமைகள் தலைவர்களைக் கண்டித்து அவர்களுக்கு எதிராகச் சொல்லப்பட்டவை என்பதை வெளிப்படையாக்க வேண்டுமா?
  choice: அவர் தங்களைக் குறித்துப் பேசுகிறார்
  alternative: அவர் தங்களுக்கு எதிராகப் பேசுகிறார்
  rationale: περὶ αὐτῶν என்பது நேரடியாக ‘அவர்களைப் பற்றி/அவர்களைக் குறித்து’ என்று பொருள்படும். சூழல் விமர்சனத்தை உணர்த்தினாலும், மூலத்தில் இல்லாத வலுவான எதிர்நிலைப் பொருளை மொழிபெயர்ப்பில் சேர்க்கக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் மதிப்புமிக்க நடையிலும் மொழிபெயர்க்கப்பட்டது. ‘தலைமைக் குருக்கள்’ என்பது மூத்த குருத்துவத் தலைமையைச் சுட்டுகிறது; ‘பரிசேயர்கள்’, ‘உவமைகள்’ ஆகிய நிலைபெற்ற சொற்கள் தக்கவைக்கப்பட்டுள்ளன. தேவையற்ற விளக்கமோ பிரிவுசார் சொல்லாக்கமோ சேர்க்கப்படவில்லை.
