id: MAT.21.26
reference: Matthew 21:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπωμεν· Ἐξ ἀνθρώπων, φοβούμεθα τὸν ὄχλον, πάντες γὰρ ⸂ὡς προφήτην ἔχουσιν τὸν Ἰωάννην⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/026.yaml
  text: But if we say[a], ‘From men,’ we fear the crowd, for they all regard John as a prophet.
translation:
  language: ta
  text: ஆனால், ‘மனிதர்களிடமிருந்து வந்தது’[a] என்று நாம் சொன்னால், மக்கள் கூட்டத்திற்குப் பயப்படுகிறோம்; ஏனெனில், எல்லாரும் யோவானை ஒரு தீர்க்கதரிசி என்று கருதுகிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனிதரால் உண்டானது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  choice: ஆனால், … என்று நாம் சொன்னால்
  rationale: ἐὰν உடன் வரும் இறந்தகாலத் துணைவினை வடிவம் ஒரு சாத்தியமான நிபந்தனையை முன்வைக்கிறது. தமிழில் இயல்பான நிபந்தனை அமைப்பான ‘சொன்னால்’ அந்த ஆலோசனைத் தன்மையைக் காக்கிறது.
- source_word: Ἐξ ἀνθρώπων
  choice: மனிதர்களிடமிருந்து வந்தது
  rationale: முந்தைய வசனத்தில் உள்ள ‘வானத்திலிருந்து’ என்ற எதிரிணைக்கு இணையாக, மனித மூலத்தைக் குறிக்கிறது. கிரேக்கத்தில் விடுபட்டுள்ள கருத்தைத் தமிழில் தெளிவாகவும் இயல்பாகவும் சொல்ல ‘வந்தது’ சேர்க்கப்பட்டுள்ளது; இது ஆண்களை மட்டும் குறிக்காது.
- source_word: φοβούμεθα τὸν ὄχλον
  choice: மக்கள் கூட்டத்திற்குப் பயப்படுகிறோம்
  rationale: φοβούμεθα இங்கு செய்பொருள் உணர்வில் ‘பயப்படுகிறோம்’ என்றும், ὄχλος கூடியிருந்த மக்களைக் குறிக்கும் வகையில் ‘மக்கள் கூட்டம்’ என்றும் நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: πάντες
  choice: எல்லாரும்
  rationale: மக்கள் கூட்டத்தில் இருந்த அனைவரையும் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: ὡς προφήτην ἔχουσιν τὸν Ἰωάννην
  choice: யோவானை ஒரு தீர்க்கதரிசி என்று கருதுகிறார்கள்
  rationale: ἔχω + பொருள் + ὡς என்ற சொற்றொடர் ஒருவரை ஒரு குறிப்பிட்ட நிலையில் எண்ணுதல் அல்லது கருதுதல் என்ற பொருளுடையது. ‘கருதுகிறார்கள்’ அந்த மதிப்பீட்டு உணர்வை இயல்பான தமிழில் தருகிறது.
- source_word: προφήτην
  choice: ஒரு தீர்க்கதரிசி
  rationale: உருபில்லாத பயனிலை இங்கு யோவானை கடவுளின் தீர்க்கதரிசிகளில் ஒருவராக மக்கள் கருதியதைக் குறிக்கிறது; ‘ஒரு’ என்பது தமிழில் இதைத் தெளிவாக்குகிறது.
- source_word: Ἰωάννην
  choice: யோவான்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: ‘வானத்திலிருந்து’ என்பதற்கு எதிராக ἀνθρώπων குறிக்கும் மனித மூலம்
  choice: மனிதர்களிடமிருந்து வந்தது
  alternative: மனிதரால் உண்டானது
  rationale: இது யோவானின் திருமுழுக்கு அல்லது அதிகாரத்தின் மூலம் தெய்வீகமா மனிதமா என்ற சூழல்சார் முரண்பாட்டைக் காக்கிறது. பாலினத்தைச் சுட்டாமல் மனித மூலத்தையே குறிக்கிறது.
- issue: யோவானைப் பற்றிய மக்கள் கூட்டத்தின் மதிப்பீடு
  choice: எல்லாரும் யோவானை ஒரு தீர்க்கதரிசி என்று கருதுகிறார்கள்
  alternative: எல்லாரும் யோவானைத் தீர்க்கதரிசியாக ஏற்றுக்கொள்கிறார்கள்
  rationale: வசனம் மக்கள் யோவானைப் பற்றிக் கொண்டிருந்த கருத்தை மட்டுமே தெரிவிக்கிறது. ‘கருதுகிறார்கள்’ என்பது அந்த அறிக்கையை உறுதிப்படுத்தவோ விரிவுபடுத்தவோ செய்யாமல் அதன் மதிப்பீட்டு இயல்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘மக்கள் கூட்டம்,’ ‘கருதுகிறார்கள்’ போன்ற இயல்பான சொற்கள் பயன்படுத்தப்பட்டுள்ளன; ‘தீர்க்கதரிசி’ என்பது பரவலாக அறியப்பட்ட வேதாகமச் சொல்லாகத் தக்கவைக்கப்பட்டுள்ளது.
