  source_fidelity: மூலத்தின் நிபந்தனைத் தொடரும் (ἐὰν δὲ εἴπωμεν), ‘வானத்திலிருந்து’ என்பதற்கு எதிரான மனித மூலக் கருத்தும் (Ἐξ ἀνθρώπων), மக்கள் கூட்டத்தைப் பற்றிய அச்சமும், யோவானைத் தீர்க்கதரிசியாக மக்கள் கருதிய மதிப்பீடும் துல்லியமாகக் காக்கப்பட்டுள்ளன. விடுபட்டுள்ள ‘அது’ என்பதற்கான குறிப்பு ‘வந்தது’ மூலம் தமிழில் இயல்பாக நிறைவு செய்யப்பட்டுள்ளது; பொருள் மாற்றம் இல்லை.
  naturalness: நவீன நிலையான தமிழில் வாசகம் இயல்பாகவும் தெளிவாகவும் உள்ளது. ‘மக்கள் கூட்டத்திற்குப் பயப்படுகிறோம்’ மற்றும் ‘ஒரு தீர்க்கதரிசி என்று கருதுகிறார்கள்’ ஆகியவை கண்ணியமான பொதுவாசகர் நடையில் பொருத்தமானவை.
  terminology: ‘யோவான்’ மற்றும் ‘தீர்க்கதரிசி’ ஆகிய நிலைபெற்ற வேதாகமச் சொற்கள் சரியாகப் பயன்படுத்தப்பட்டுள்ளன. ‘மனிதர்களிடமிருந்து’ என்பது இச்சூழலில் ஆண்-குறிப்பாக அல்லாமல் மனித மூலத்தைக் குறிக்கிறது. அடிக்குறிப்பின் ‘மனிதரால் உண்டானது’ என்பது ஏற்றுக்கொள்ளத்தக்க சொற்பொருள் மாற்றாக உள்ளது.
