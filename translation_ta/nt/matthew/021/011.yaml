id: MAT.21.11
reference: Matthew 21:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι ἔλεγον· Οὗτός ἐστιν ⸂ὁ προφήτης Ἰησοῦς⸃ ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/011.yaml
  text: And the crowds were saying[a], “This is the prophet Jesus, from Nazareth in Galilee.”
translation:
  language: ta
  text: கூடியிருந்த மக்கள், “இவர்தான் கலிலேயாவிலுள்ள நாசரேத்தைச் சேர்ந்த அந்த இறைவாக்கினர் இயேசு[a]” என்று சொல்லிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஓர் இறைவாக்கினரான இயேசு.” கிரேக்கத்தில் “அந்த இறைவாக்கினர்” என்று உள்ளது; கூட்டத்தினர் இயேசுவை அறியப்பட்ட ஓர் இறைவாக்கினராக அடையாளப்படுத்தியதை இது குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  choice: மக்கள் கூட்டத்தினரோ
  rationale: ὄχλοι என்பதன் பன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; δέ இங்குள்ள மென்மையான தொடர்/மாறுதல் பொருளை ‘-ஓ’ துகள் உணர்த்துகிறது.
- source_word: ἔλεγον
  choice: சொல்லிக்கொண்டிருந்தார்கள்
  rationale: இறந்தகால imperfect வடிவத்தின் தொடர்ச்சியான அல்லது மீண்டும் மீண்டும் நிகழ்ந்த பேச்சை இயல்பான தமிழில் காக்கிறது.
- source_word: Οὗτός ἐστιν
  choice: இவர்தான்
  rationale: அடையாளம் காட்டும் வாக்கியத்தை இயல்பாகவும் மரியாதையான மனிதச் சுட்டுப்பெயருடனும் தருகிறது; ‘தான்’ அடையாளப்படுத்தும் வலிமையை வெளிப்படுத்துகிறது.
- source_word: ὁ προφήτης
  choice: அந்த இறைவாக்கினர்
  rationale: கிரேக்கச் சொல்லிலுள்ள குறிப்புச் சுட்டை ‘அந்த’ என்பதால் காக்கிறது. ‘இறைவாக்கினர்’ என்பது προφήτης என்பதற்கான தெளிவான, நவீன, கண்ணியமான தமிழ்.
- source_word: Ἰησοῦς
  choice: இயேசு
  rationale: தமிழில் நிலைபெற்றுள்ள பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας
  choice: கலிலேயாவிலுள்ள நாசரேத்தைச் சேர்ந்த
  rationale: இயேசுவின் ஊரை அடையாளப்படுத்தும் தொடரை இயல்பான தமிழில் தருகிறது; நாசரேத் கலிலேயாவில் உள்ளது என்ற புவியியல் உறவையும் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ὁ προφήτης என்பதை குறிப்பிட்ட ஒருவராகவா அல்லது பொதுவாக ஓர் இறைவாக்கினராகவா மொழிபெயர்ப்பது
  choice: அந்த இறைவாக்கினர்
  alternative: ஓர் இறைவாக்கினர்
  rationale: மூல கிரேக்கத்தில் definite article உள்ளது; இது கூட்டத்தினர் இயேசுவை அறியப்பட்ட அல்லது எதிர்பார்க்கப்பட்ட இறைவாக்கினராக அடையாளப்படுத்தியிருக்கலாம். அதேவேளையில் பொதுவான பொருளும் சாத்தியம் என்பதால் அடிக்குறிப்பில் அது காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தொடர்ச்சியான பேச்சை ‘சொல்லிக்கொண்டிருந்தார்கள்’ காக்கிறது; மூலத்தின் குறிப்புத்தன்மையும் அதன் சாத்தியமான மாற்றுப் புரிதலும் அடிக்குறிப்பின் மூலம் பாதுகாக்கப்பட்டுள்ளன.
