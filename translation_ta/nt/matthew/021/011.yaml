revisions:
- from: மக்கள் கூட்டத்தினரோ, “இவர்தான் கலிலேயாவிலுள்ள நாசரேத்தைச் சேர்ந்த அந்த இறைவாக்கினர் இயேசு[a]” என்று சொல்லிக்கொண்டிருந்தார்கள்.
  to: கூடியிருந்த மக்கள், “இவர்தான் கலிலேயாவிலுள்ள நாசரேத்தைச் சேர்ந்த அந்த இறைவாக்கினர் இயேசு[a]” என்று சொல்லிக்கொண்டிருந்தார்கள்.
  rationale: The revision replaces the marked and less idiomatic ‘மக்கள் கூட்டத்தினரோ’ with the natural narrative expression ‘கூடியிருந்த மக்கள்.’ It retains the imperfect sense, the definite ‘the prophet,’ the established name form, and the geographic identification. The footnote is retained but made terminologically consistent with the main text.
