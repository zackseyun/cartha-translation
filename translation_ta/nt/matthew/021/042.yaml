  naturalness: முக்கிய உரை இயல்பாக உள்ளது; ஆனால் பேச்சாளர் அறிமுகத்தை ‘இயேசு அவர்களிடம் சொன்னார்:’ என முன்வைப்பது நவீனத் தமிழில் நேரடியானதும் வாசிப்பதற்கு மென்மையானதுமாகும். ‘கட்டடம் கட்டுபவர்கள்’ என்பது இங்கே உள்ள கட்டுபவர் உருவகத்தைத் தெளிவாக்கும்.
