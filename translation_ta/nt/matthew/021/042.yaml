id: MAT.21.42
reference: Matthew 21:42
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Λέγει αὐτοῖς ὁ Ἰησοῦς· Οὐδέποτε ἀνέγνωτε ἐν ταῖς γραφαῖς· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας· παρὰ κυρίου ἐγένετο αὕτη, καὶ ἔστιν θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/042.yaml
  text: 'Jesus said to them[a], “Have you never read in the Scriptures: ‘The stone that the builders rejected—this one has become the cornerstone. This came from the Lord[b], and it is marvelous in our eyes’?”'
translation:
  language: ta
  text: 'இயேசு அவர்களிடம் சொன்னார்: “நீங்கள் வேதநூல்களில் ஒருபோதும் வாசித்ததில்லையா?


    ‘கட்டடம் கட்டுபவர்கள் நிராகரித்த கல்லே

    மூலைக்கல்லாயிற்று.[a]

    இது ஆண்டவரிடமிருந்து வந்தது;[b]

    இது நம் பார்வையில் வியப்புக்குரியது.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மேல்தலைக்கல்’ என்றும் மொழிபெயர்க்கலாம்; சொல்லுக்குச் சொல், ‘மூலையின் தலைக்கல்.’
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் ‘ஆண்டவரிடமிருந்து.’ மேற்கோள் எடுக்கப்பட்ட எபிரெய மூலத்தில் ‘யாவேவிடமிருந்து’ (YHWH) என்று உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: Λέγει
  choice: சொன்னார்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டிருந்தாலும், தமிழ் கதைநடையில் இறந்தகாலமான ‘சொன்னார்’ இயல்பாக உள்ளது.
- source_word: Οὐδέποτε ἀνέγνωτε
  choice: ஒருபோதும் வாசித்ததில்லையா?
  rationale: வலியுறுத்தும் எதிர்மறை வினாவின் இயல்பான தமிழாக்கம்; வேதத்தை அவர்கள் வாசித்திருக்க வேண்டுமென்ற கேள்வியின் தாக்கத்தையும் காக்கிறது.
- source_word: ἐν ταῖς γραφαῖς
  choice: வேதவசனங்களில்
  rationale: இங்கு இஸ்ரவேலின் புனித எழுத்துகளைக் குறிக்கிறது; ‘வேதவசனங்கள்’ என்பது சாதாரண வாசகருக்குத் தெளிவான, மரியாதைமிக்க நடை.
- source_word: ἀπεδοκίμασαν
  choice: புறக்கணித்த
  rationale: தகுதியற்றதாக மதிப்பிட்டு ஏற்காமல் விட்டதைக் குறிக்கிறது; ‘புறக்கணித்த’ என்பது உருவகத்துடன் இயல்பாகப் பொருந்துகிறது.
- source_word: οἱ οἰκοδομοῦντες
  choice: கட்டுகிறவர்கள்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் பங்கேற்பு வினையை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας
  choice: கல்லே மூலைக்கல்லாயிற்று
  rationale: οὗτος என்பதன் வலியுறுத்தலை ‘கல்லே’ காக்கிறது; κεφαλὴ γωνίας என்ற கட்டட உருவகத்தை வாசிக்க எளிய ‘மூலைக்கல்’ தெரிவிக்கிறது, அதன் மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: παρὰ κυρίου
  choice: ஆண்டவரிடமிருந்து வந்தது
  rationale: παρά உடன் வரும் உருபு மூலத்தையோ தோற்றத்தையோ குறிக்கிறது; ‘ஆண்டவரிடமிருந்து’ அந்த உறவைத் தெளிவாகக் காக்கிறது.
- source_word: θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν
  choice: நம் பார்வையில் வியப்புக்குரியது
  rationale: ‘நம் கண்களில்’ என்ற சொற்சொல் நடையைவிட இயல்பாக இருந்து, அசல் உருவகத்தையும் வியப்பின் பொருளையும் காக்கிறது.
theological_decisions:
- issue: சங்கீத மேற்கோளில் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: யாவே / கர்த்தர்
  rationale: மத்தேயுவின் கிரேக்க உரையில் κυρίου உள்ளது; எனவே பிரதான உரையில் பொதுவான ‘ஆண்டவர்’ பயன்படுத்தப்படுகிறது. மேற்கோளின் எபிரெய மூலத்தில் இறைப் பெயர் YHWH இருப்பது அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்படுகிறது.
- issue: கல் உருவகத்தின் மேசியாவுக்குரிய பயன்பாடு
  choice: உருவகத்தை விளக்கச் சேர்க்கையின்றி அப்படியே வைத்தல்
  alternative: ‘கல்’ என்பது இயேசு அல்லது மேசியா என்று பிரதான உரையிலேயே வெளிப்படையாகக் கூறுதல்
  rationale: சூழலில் இயேசு இந்த மேற்கோளைத் தமக்குப் பொருத்துகிறார்; ஆனால் இவ்வசனத்தின் மேற்கோள் அதனை விளக்கவுரையாக வெளிப்படையாகக் கூறவில்லை. ஆகவே மொழிபெயர்ப்பு உருவகத்தை மட்டும் காக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், மரியாதைமிக்க ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. கவிதை மேற்கோளின் வரியமைப்பு காக்கப்பட்டுள்ளது; தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்களும் விளக்கச் சேர்க்கைகளும் தவிர்க்கப்பட்டுள்ளன.
