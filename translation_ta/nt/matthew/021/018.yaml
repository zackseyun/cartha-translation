  yaml_path: translation/nt/matthew/021/018.yaml
  text: Early in the morning, as he was returning to the city, he became hungry.
translation:
  language: ta
  text: காலையிலேயே அவர் நகரத்திற்குத் திரும்பிக்கொண்டிருந்தபோது, அவருக்குப் பசியெடுத்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρωῒ
  choice: காலையிலேயே
  rationale: நாளின் தொடக்கப் பகுதியைக் குறிக்கும் வினையடை. ‘காலையிலேயே’ என்பது நேரத்தின் முற்பகுதியை இயல்பான நவீனத் தமிழில் உணர்த்துகிறது; ‘அதிகாலையில்’ என்று மொழிபெயர்த்தால் விடியற்காலை என்ற அளவுக்கு மிகத் துல்லியமாக்கிவிடலாம்.
- source_word: δὲ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது வலுவான முரண்பாட்டைக் காட்டாமல் கதையின் அடுத்த நிகழ்வை மெதுவாக இணைக்கிறது. தமிழில் வாக்கியத் தொடக்கத்திலுள்ள காலக் குறிப்பு அந்த நகர்வை இயல்பாகச் சுமப்பதால் கூடுதல் இணைப்புச்சொல் சேர்க்கப்படவில்லை.
- source_word: ἐπανάγων
  choice: திரும்பிக்கொண்டிருந்தபோது
  rationale: நிகழ்காலச் செயப்பெயரெச்சம், முதன்மை வினையுடன் ஒரே நேரத்தில் நடைபெற்ற திரும்பிச் செல்லும் செயலைக் காட்டுகிறது. இந்தத் தொடர்ச்சி மற்றும் ஒரேநேரத் தொடர்பைத் தமிழ் வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἰς τὴν πόλιν
  choice: நகரத்திற்கு
  rationale: εἰς உடன் வரும் வேற்றுமை நகரத்தை நோக்கிய இயக்கத்தைக் குறிக்கிறது. ‘நகரத்திற்கு’ என்பது அவர் ஏற்கெனவே நகருக்குள் வந்துவிட்டார் என்று கட்டாயப்படுத்தாமல் இலக்கைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐπείνασεν
  choice: அவருக்குப் பசியெடுத்தது
  rationale: இறந்தகால வினையின் நிகழ்வுத்தன்மையை, அதாவது பசி ஏற்பட்டதை, இயல்பான தமிழில் காட்டுகிறது. ‘பசியாக இருந்தது’ என்பது நிலையை மட்டும் வலியுறுத்தும்.
theological_decisions:
- issue: இயேசுவின் பசியைப் பற்றிய கிறிஸ்தியல் உட்பொருள்
  choice: பசியை அவர் உண்மையாக அனுபவித்த நிகழ்வாக நேரடியாக மொழிபெயர்த்தல்
  alternative: பசியை உருவகமாக்குதல் அல்லது அதன் உடல்சார்ந்த தன்மையை மங்கச் செய்தல்
  rationale: வசனம் இயேசுவின் பசியை எளிய கதைநிகழ்வாக முன்வைக்கிறது. கூடுதல் கோட்பாட்டு விளக்கமின்றி அவரது உண்மையான மனித அனுபவத்தை மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையான, கண்ணியமான கதைநடை. தேவையற்ற தொடக்க இணைப்புச்சொல் சேர்க்கப்படவில்லை; மூலத்தின் காலத் தொடர்பும் நிகழ்வுத்தன்மையும் பாதுகாக்கப்பட்டுள்ளன.
