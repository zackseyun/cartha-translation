  text: 'This happened so that what was spoken through the prophet might be fulfilled[a], saying:'
translation:
  language: ta
  text: 'தீர்க்கதரிசி மூலம் சொல்லப்பட்டது நிறைவேறும்படி இது நடந்தது:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τοῦτο
  choice: இது
  rationale: முந்தைய நிகழ்வை முழுமையாகச் சுட்டும் ஒருமை நடுநிலைச் சுட்டுப்பெயரை இயல்பாகக் காட்டுகிறது.
- source_word: δὲ
  choice: தனி வார்த்தையாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ வலுவான எதிர்மறைப் பொருளைக் காட்டாமல், மெல்லிய தொடர்ச்சி அல்லது விளக்கத் தொடர்பை அளிக்கிறது; தமிழ்ச் சொற்றொடரின் இயல்பான அமைப்பிலேயே அந்தத் தொடர்பு வெளிப்படுகிறது.
- source_word: γέγονεν
  choice: நடந்தது
  rationale: நிறைவேற்றம் குறித்த சூத்திரத்தில் நிகழ்ந்த சம்பவத்தை நவீனத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἵνα πληρωθῇ
  choice: நிறைவேறும்படியாகவே
  rationale: ἵνα உடன் வரும் இறந்தகாலச் செயல்பாட்டு வினையின் நோக்கம்/விளைவு சார்ந்த நுட்பத்தைப் பாதுகாக்கிறது; ‘வே’ நிறைவேற்றத் தொடர்பை இயல்பாக வலியுறுத்துகிறது.
- source_word: τὸ ῥηθὲν
  choice: சொல்லப்பட்ட வார்த்தை
  rationale: பெயர்ச்சொல் தன்மையில் வரும் செயப்பாட்டு வினையெச்சத்தைத் தமிழில் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: διὰ τοῦ προφήτου
  choice: தீர்க்கதரிசியின் மூலம்
  rationale: διά + உரிமை வேற்றுமை காட்டும் இடைமுகம் அல்லது கருவித்தன்மையைப் பாதுகாத்து, செய்தி தீர்க்கதரிசி வழியாக வந்ததை வெளிப்படுத்துகிறது.
- source_word: λέγοντος
  choice: முக்குறியால் அறிமுகப்படுத்தப்பட்டது
  rationale: அடுத்த வசனத்தில் வரும் மேற்கோளை அறிமுகப்படுத்தும் பங்கேற்பு வடிவின் பணியைத் தமிழில் இயல்பான முக்குறி நிறைவேற்றுகிறது; தனியே ‘சொல்லி’ என்று சேர்ப்பது கடினமான நடையை உண்டாக்கும்.
theological_decisions:
- issue: நிறைவேற்றச் சூத்திரமும் தீர்க்கதரிசியின் இடைமுகமும்
  choice: ‘தீர்க்கதரிசியின் மூலம் சொல்லப்பட்ட வார்த்தை’
  alternative: ‘தீர்க்கதரிசியால் சொல்லப்பட்ட வார்த்தை’
  rationale: மூலமொழி தீர்க்கதரிசியை வெறும் சொற்பவர் என்று மட்டும் காட்டாமல், முந்தைய அறிவிப்பு அவர் வழியாக வழங்கப்பட்டதையும் அனுமதிக்கிறது. ‘மூலம்’ அந்த இடைமுக நுட்பத்தை தேவையற்ற விளக்கமின்றிப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. அடுத்ததாக வரும் தீர்க்கதரிசன மேற்கோளை இயல்பாக அறிமுகப்படுத்த முக்குறி வைக்கப்பட்டுள்ளது.
