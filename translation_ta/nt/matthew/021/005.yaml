id: MAT.21.5
reference: Matthew 21:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Εἴπατε τῇ θυγατρὶ Σιών· Ἰδοὺ ὁ βασιλεύς σου ἔρχεταί σοι πραῢς καὶ ἐπιβεβηκὼς ἐπὶ ὄνον καὶ ⸀ἐπὶ πῶλον υἱὸν ὑποζυγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/005.yaml
  text: Tell the daughter of Zion[a], ‘Look, your king is coming to you, gentle and mounted on a donkey, and on a colt[b], the foal of a beast of burden.’
translation:
  language: ta
  text: '“சீயோன் மகளுக்குச் சொல்லுங்கள்: ‘இதோ, உன் அரசர் மென்மையானவராய்[a], ஒரு கழுதையின்மேலும், ஒரு இளம் விலங்கின்மேலும்—சுமை சுமக்கும் விலங்கின் குட்டியின்மேலும்[b] ஏறியவராய் உன்னிடம் வருகிறார்.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தாழ்மையுள்ளவராய்” என்றும் மொழிபெயர்க்கலாம். கிரேக்க πραΰς என்ற சொல் “மென்மையான,” “சாந்தமான,” அல்லது “தாழ்மையான” என்று பொருள்படலாம்; இது சகரியா 9:9-ஐ எதிரொலிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: 'மத்தேயு தீர்க்கதரிசனத்தின் இணையான இரட்டைச் சொற்றொடரை அப்படியே காக்கிறார்: “ஒரு கழுதையின்மேலும், ஒரு இளம் விலங்கின்மேலும்—சுமை சுமக்கும் விலங்கின் குட்டியின்மேலும்.”'
    reason: cross_reference
lexical_decisions:
- source_word: Εἴπατε
  choice: சொல்லுங்கள்
  rationale: λέγω என்பதன் பன்மை ஏவல் வடிவத்தின் கட்டளைத் தன்மையை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: τῇ θυγατρὶ Σιών
  choice: சீயோன் மகளிடம்
  rationale: சீயோனை ஒரு மகளாக உருவகப்படுத்தும் தீர்க்கதரிசன மொழியை ‘சீயோன் மக்கள்’ என்று விளக்கி மாற்றாமல் காக்கிறது.
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் கிரேக்க இடைச்சொல்லை இயல்பாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
- source_word: ὁ βασιλεύς σου
  choice: உன் அரசர்
  rationale: இரண்டாம் நபர் ஒருமை உடைமைத் தொடர்பையும் அரசத்தன்மையையும் நேரடியாகக் காக்கிறது.
- source_word: ἔρχεταί σοι
  choice: உன்னிடம் வருகிறார்
  rationale: நிகழ்காலத்தின் உயிரோட்டத்தையும் வருகையின் இலக்காகிய ‘உன்னிடம்’ என்பதையும் காக்கிறது.
- source_word: πραῢς
  choice: சாந்தமுள்ளவராய்
  rationale: வலுக்கட்டாயமற்ற மென்மை மற்றும் பணிவைச் சுட்டும் சொல்லை இயல்பான தமிழில் தருகிறது; ‘தாழ்மையுள்ளவராய்’ என்ற சாத்தியத்தையும் அடிக்குறிப்பு காக்கிறது.
- source_word: ἐπιβεβηκὼς
  choice: ஏறி
  rationale: விலங்கின்மேல் ஏறியிருக்கும் நிலையைக் குறிக்கும் நிறைவு வினையெச்சத்தைத் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: ἐπὶ ὄνον
  choice: ஒரு கழுதையின்மேல்
  rationale: மூலத்தின் எளிய முன்னிடைத் தொடரை நேரடியாகத் தருகிறது.
- source_word: πῶλον
  choice: ஒரு கழுதைக்குட்டி
  rationale: πῶλος என்பது இளம் விலங்கைக் குறிக்கிறது; சூழலும் பின்வரும் விளக்கமும் இதை இளம் கழுதையாகத் தெளிவாக்குகின்றன.
- source_word: υἱὸν ὑποζυγίου
  choice: சுமை சுமக்கும் விலங்கின் குட்டி
  rationale: செமித்தியப் பாணியிலான ‘மகன்’ என்ற சொல்லைத் தமிழில் இயல்பான ‘குட்டி’ எனத் தந்து, ὑποζύγιον என்பதன் சுமை சுமக்கும் விலங்கு என்ற பரந்த படிமத்தைக் காக்கிறது.
theological_decisions:
- issue: சகரியா 9:9-ஐ எதிரொலிக்கும் மேற்கோளில் πραῢς என்பதன் பொருள்
  choice: சாந்தமுள்ளவராய்
  alternative: தாழ்மையுள்ளவராய்
  rationale: இந்தச் சொல் சாந்தம், மென்மை, பணிவு ஆகிய பொருள் நிழல்களைக் கொண்டது. முதன்மை உரை அரசரின் வலுக்கட்டாயமற்ற சாந்த இயல்பை இயல்பான தமிழில் தருகிறது; தீர்க்கதரிசனப் பின்னணியில் முக்கியமான ‘தாழ்மை’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: கழுதை மற்றும் கழுதைக்குட்டி குறித்த இரட்டைச் சொற்றொடரை ஒரே குறிப்பாகச் சுருக்கலாமா
  choice: மத்தேயுவின் கிரேக்கத்தில் உள்ள ‘ஒரு கழுதையின்மேலும் ... ஒரு கழுதைக்குட்டியின்மேலும்’ என்ற இணையான இரட்டை அமைப்பைக் காப்பது
  alternative: இரு சொற்றொடர்களையும் ஒரே கழுதைக்குட்டியைக் குறிக்கும் ஒரு தொடராகச் சுருக்குவது
  rationale: மூல உரையில் καὶ ... καὶ என்ற இணைப்பு இரு விலங்கு வெளிப்பாடுகளையும் தெளிவாக வைத்திருக்கிறது. அவற்றின் தொடர்பை விளக்கி முடிவு செய்யாமல், மத்தேயுவின் தீர்க்கதரிசனச் சொற்றொடரை அப்படியே காப்பது உரையின் உண்மையான விளக்கத் தளர்வை நிலைநிறுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான தீர்க்கதரிசன நடை பயன்படுத்தப்பட்டுள்ளது. ‘சீயோன் மகள்’ என்ற உருவகம் விளக்கமாக மாற்றப்படாமல் காக்கப்பட்டுள்ளது. அடிக்குறிப்பு [a] அது விளக்கும் πραῢς என்பதற்குப் பின்னர் வைக்கப்பட்டுள்ளது.
