  source_fidelity: மூலத்தின் தீர்க்கதரிசன உருவகமான «சீயோன் மகள்», நிகழ்கால வருகை, மற்றும் இரட்டை விலங்கு-சொற்றொடர் காக்கப்பட்டுள்ளன. ஆனால் πραΰς என்பதற்கு «சாந்தமுள்ளவர்» என்பது முதன்மையாக அமைதி/சமாதான உணர்வைத் தரக்கூடும்; இச்சூழலில் «மென்மையானவர்» அதிகத் துல்லியமானது. மேலும் πῶλον-ஐ நேரடியாக «கழுதைக்குட்டி» எனக் குறிப்பிட்டது, பின்வரும் «சுமை சுமக்கும் விலங்கின் குட்டி» என்ற பரந்த அடையாளத்தைக் குறுகச் செய்கிறது.
