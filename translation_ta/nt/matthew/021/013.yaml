id: MAT.21.13
reference: Matthew 21:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Γέγραπται· Ὁ οἶκός μου οἶκος προσευχῆς κληθήσεται, ὑμεῖς δὲ αὐτὸν ⸀ποιεῖτε σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/013.yaml
  text: And he says to them[a], “It is written[b], ‘My house will be called a house of prayer,’ but you are making it a den of robbers.”
translation:
  language: ta
  text: 'அவர் அவர்களிடம் கூறுகிறார்: “எழுதப்பட்டிருக்கிறது: ‘என் வீடு ஜெபத்தின் வீடு என்று அழைக்கப்படும்; ஆனால் நீங்கள் அதை கொள்ளையர்களின் குகையாக்குகிறீர்கள்.’[a]”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இயேசுவின் கூற்று ஏசாயா 56:7-ஐ எரேமியா 7:11-உடன் இணைக்கிறது.
    reason: cross_reference
  - marker: b
    text: அல்லது, “வன்முறைக் கொள்ளைக் கூட்டத்தினரின்.” கிரேக்கச் சொல் கொள்ளையர்களையோ வன்முறையுள்ள வழிப்பறிக் கூட்டத்தினரையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: கூறுகிறார்
  rationale: கிரேக்க மூலத்தின் வரலாற்று நிகழ்காலத்தைப் பாதுகாத்து, மத்தேயுவின் விவரிப்பிலுள்ள நேரடித்தன்மையை வெளிப்படுத்துகிறது.
- source_word: Γέγραπται
  choice: எழுதப்பட்டிருக்கிறது
  rationale: வேதமேற்கோளை அறிமுகப்படுத்தும் நிறைவு செயல்நிலை வடிவத்தையும், எழுதப்பட்டது தொடர்ந்து நிலைத்திருப்பதையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: οἶκός μου
  choice: என் வீடு
  rationale: ‘ஆலயம்’ என்று விளக்கமாகக் குறுக்காமல், ஏசாயா மேற்கோளின் ‘என் வீடு’ என்ற உருவகத்தையும் சொற்தொடரையும் காக்கிறது.
- source_word: οἶκος προσευχῆς
  choice: ஜெப வீடு
  rationale: தமிழ் கிறிஸ்தவப் பயன்பாட்டில் இயல்பாகவும் பொதுமக்களுக்கு புரியும்படியாகவும் இருந்து, மூலத்தின் பெயர்ச்சொல் அமைப்பைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: κληθήσεται
  choice: அழைக்கப்படும்
  rationale: எதிர்காலச் செயல்நிலை வடிவத்தை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ποιεῖτε
  choice: குகையாக்குகிறீர்கள்
  rationale: நடந்துகொண்டிருக்கும் செயலை நிகழ்காலத்தில் காட்டுகிறது; ‘அதை ... ஆக்குகிறீர்கள்’ என்ற மூலக் கருத்தை இயல்பான தமிழில் இணைக்கிறது.
- source_word: σπήλαιον
  choice: குகை
  rationale: மறைவிடமாகப் பயன்படும் குகை அல்லது பதுங்கிடம் என்ற உருவகத்தைப் பாதுகாத்து, எரேமியா 7:11-ன் எதிரொலியையும் தெளிவாக்குகிறது.
- source_word: λῃστῶν
  choice: கொள்ளைக்காரர்களின்
  rationale: திருடிக் கொள்ளையிடுவோர் என்ற பொதுவான பொருளை இயல்பான நவீன தமிழில் தருகிறது; வன்முறை கொள்ளைக் கூட்டத்தினரையும் குறிக்கக்கூடிய சொல் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: பழைய ஏற்பாட்டு மேற்கோளும் மறைமுக மேற்கோளும்
  choice: ஏசாயா 56:7-இன் ‘என் வீடு ஜெப வீடு என்று அழைக்கப்படும்’ என்பதையும் எரேமியா 7:11-இன் ‘கொள்ளைக்காரர்களின் குகை’ என்பதையும் அடையாளம் காணத்தக்கவாறு மொழிபெயர்த்தல்
  alternative: வேதப்பகுதிகளுக்கிடையிலான தொடர்பு மறையும் வகையில் சுதந்திரமான சமகாலச் சொற்றொடர்களைப் பயன்படுத்துதல்
  rationale: இயேசுவின் கூற்று இரண்டு தீர்க்கதரிசனப் பகுதிகளின் மொழியை இணைக்கிறது; அந்த வேதத் தொடர்பைத் தெளிவாகப் பாதுகாப்பது மூலத்தின் இறையியல் அழுத்தத்தை வாசகர் காண உதவுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வேதமேற்கோளின் அடையாளச் சொற்கள் காக்கப்பட்டுள்ளன; ‘கூறுகிறார்’ என்ற வரலாற்று நிகழ்காலம் கிரேக்க விவரிப்பின் உயிரோட்டத்தைப் பாதுகாக்கிறது.
