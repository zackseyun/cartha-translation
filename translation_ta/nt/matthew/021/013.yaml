review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the Greek historical present (λέγει), the scriptural formula Γέγραπται, the future passive ‘will be called,’ and the ongoing present action ‘you are making.’ It also preserves the two-scripture construction from Isaiah 56:7 and Jeremiah 7:11. ‘குகை’ is defensible for σπήλαιον, though the phrase is more recognizable and natural in Tamil as ‘கொள்ளையர்களின் குகை.’
  naturalness: The wording is generally clear, but ‘ஜெப வீடு’ is less idiomatic than ‘ஜெபத்தின் வீடு’ in a formal modern Tamil Scripture citation. Reordering the reporting clause to ‘அவர் அவர்களிடம் கூறுகிறார்’ is smoother. The cross-reference footnote marker should be attached to the cited scriptural wording rather than left after the whole quotation.
  terminology: ‘என் வீடு,’ ‘ஜெபத்தின் வீடு,’ and ‘கொள்ளையர்களின் குகை’ retain the scriptural phrasing without interpretively substituting ‘ஆலயம்’ or weakening the Jeremiah allusion. The lexical note appropriately retains the possible sense of violent bandits for λῃσταί.
  issues:
  - severity: low
    issue: ‘ஜெப வீடு’ is somewhat compressed in this formal citation.
    rationale: ‘ஜெபத்தின் வீடு’ is more natural modern standard Tamil while directly reflecting οἶκος προσευχῆς.
  - severity: low
    issue: The cross-reference footnote anchor is placed after the complete quotation.
    rationale: Placing it immediately after the combined cited wording more clearly identifies what the note documents.
  - severity: low
    issue: ‘கொள்ளைக்காரர்களின்’ is understandable but less idiomatic here than ‘கொள்ளையர்களின்.’
    rationale: ‘கொள்ளையர்களின் குகை’ is a natural Tamil rendering and preserves the established scriptural image of σπήλαιον λῃστῶν.
  revised_text: 'அவர் அவர்களிடம் கூறுகிறார்: “எழுதப்பட்டிருக்கிறது: ‘என் வீடு ஜெபத்தின் வீடு என்று அழைக்கப்படும்; ஆனால் நீங்கள் அதை கொள்ளையர்களின் குகையாக்குகிறீர்கள்.’[a]”[b]'
