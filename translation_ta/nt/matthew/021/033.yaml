source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν ἀκούσατε. ⸀Ἄνθρωπος ἦν οἰκοδεσπότης ὅστις ἐφύτευσεν ἀμπελῶνα καὶ φραγμὸν αὐτῷ περιέθηκεν καὶ ὤρυξεν ἐν αὐτῷ ληνὸν καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/033.yaml
  text: 'Listen to another parable: There was a landowner who planted a vineyard and put a fence around it and dug a winepress in it and built a tower[a], and leased it to tenant farmers[c][b], and went away.'
translation:
  language: ta
  text: '“வேறொரு உவமையைக் கேளுங்கள்: நில உரிமையாளர் ஒருவர் ஒரு திராட்சைத்தோட்டத்தை நட்டு, அதைச் சுற்றி வேலி[b] அமைத்து, அதில் திராட்சைப் பிழிகுழியைத் தோண்டி, ஒரு கோபுரத்தையும் கட்டினார்[a]. பின்பு அதை விவசாயிகளுக்குக் குத்தகைக்கு விட்டுவிட்டு[c], புறப்பட்டுச் சென்றார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: திராட்சைத்தோட்டத்தை நட்டு, அதைச் சுற்றி வேலி அமைத்து, திராட்சைப் பிழிகுழியைத் தோண்டி, கோபுரம் கட்டியதாக வரும் இப்பகுதி ஏசாயா 5:1–2-ஐ நினைவூட்டுகிறது.
    reason: cross_reference
  - marker: b
    text: அல்லது, “அதைச் சுற்றி உயிர்வேலி அமைத்து.” கிரேக்கச் சொல் வேலி, உயிர்வேலி போன்ற சுற்றுத் தடுப்பைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அதைப் பயிரிட விவசாயிகளுக்கு வாடகைக்கு விட்டுவிட்டு.” இத்தொடர் திராட்சைத்தோட்டத்தை உழுது பராமரிக்கும் விவசாயிகளுக்குக் குத்தகைக்கு விடுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἀκούσατε
  choice: வேறொரு உவமையைக் கேளுங்கள்
  rationale: ἀκούσατε என்பது பன்மை கட்டளை வடிவம்; ‘கேளுங்கள்’ அதன் நேரடியான அழைப்பை இயல்பான தமிழில் தருகிறது. παραβολή என்பதற்கு இயேசுவின் போதனைச் சூழலில் வழக்கமான ‘உவமை’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: Ἄνθρωπος ἦν οἰκοδεσπότης
  choice: நிலவுடைமையாளர் ஒருவர்
  rationale: οἰκοδεσπότης என்பது வீடு அல்லது சொத்தின் தலைவர்/உரிமையாளரைக் குறிக்கும். திராட்சைத்தோட்டத்தைக் குத்தகைக்கு விடும் இச்சூழலில் ‘நிலவுடைமையாளர்’ அவரது பங்கைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: ἐφύτευσεν ἀμπελῶνα
  choice: ஒரு திராட்சைத்தோட்டத்தை நட்டு
  rationale: φυτεύω என்பதன் நேரடியான பொருள் ‘நடு’; ἀμπελών என்பது ‘திராட்சைத்தோட்டம்’. ஏசாயா 5-ஐ நினைவூட்டும் உறுதியான விவசாயப் படிமம் அப்படியே வைக்கப்பட்டுள்ளது.
- source_word: φραγμὸν αὐτῷ περιέθηκεν
  choice: அதைச் சுற்றி வேலி அமைத்து
  rationale: φραγμός என்பது வேலி, உயிர்வேலி அல்லது சுற்றுத் தடுப்பைக் குறிக்கலாம். ‘வேலி’ என்பது பொருளைத் தேவையின்றிக் குறிப்பாக்காமல் இயல்பாகத் தருகிறது.
- source_word: ὤρυξεν ἐν αὐτῷ ληνὸν
  choice: அதில் திராட்சைச் சாறு பிழியும் தொட்டியைத் தோண்டி
  rationale: ληνός என்பது திராட்சைச் சாறு பிழியும் அமைப்பு; ὀρύσσω என்பது தோண்டுதல். ‘தொட்டி’ என்பது நவீன வாசகருக்கு விவசாயச் செயல்பாட்டை விளங்கச் செய்கிறது; ‘ஆலை’ என மொழிபெயர்த்து நவீன தொழிற்சாலையை நினைவூட்டுவது தவிர்க்கப்பட்டுள்ளது.
- source_word: ᾠκοδόμησεν πύργον
  choice: ஒரு கோபுரத்தையும் கட்டினார்
  rationale: πύργος என்பதற்கு ‘கோபுரம்’ நேரான இணை. அது காவலுக்கானதாக இருந்திருக்கலாம் என்றாலும், மூலத்தில் கூறப்படாத செயல்பாடு உரைக்குள் சேர்க்கப்படவில்லை.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: அதை விவசாயிகளுக்குக் குத்தகைக்கு விட்டுவிட்டு
  rationale: நடுநிலை வடிவிலுள்ள ἐκδίδωμι இங்கு குத்தகைக்கு விடுதல் என்று பொருள். γεωργοί பயிரிடும் விவசாயிகள்; குத்தகை உறவு வினைத்தொடரிலேயே தெளிவாக இருப்பதால் இயல்பான தமிழுக்காக ‘குத்தகை விவசாயிகள்’ என்று மீண்டும் கூறப்படவில்லை.
- source_word: ἀπεδήμησεν
  choice: அங்கிருந்து புறப்பட்டுச் சென்றார்
  rationale: ἀποδημέω என்பது தன் இருப்பிடத்திலிருந்து வெளியே செல்வதைக் குறிக்கிறது. மூலத்தில் இல்லாத நாடு அல்லது தொலைவு போன்ற விவரங்களைச் சேர்க்காமல் இந்த மொழிபெயர்ப்பு பிரிவைத் தெரிவிக்கிறது.
theological_decisions:
- issue: ஏசாயா 5 உடனான திராட்சைத்தோட்டப் படிமத் தொடர்பு
  choice: விவசாயப் படிமங்களை உரையில் உறுதியாகத் தக்கவைத்து, தொடர்பை அடிக்குறிப்பில் மட்டும் சுட்டிக்காட்டுதல்
  alternative: ஏசாயா 5-இன் எதிரொலியை வலுப்படுத்த பாரம்பரியமான அல்லது விளக்கமான சொற்களை உரைக்குள் சேர்த்தல்
  rationale: மத்தேயுவின் சொற்கள் ஏசாயா 5:1–2-ஐ வலுவாக நினைவூட்டினாலும், அந்த விளக்கத்தை முதன்மை உரையில் வெளிப்படையாக்குவது உவமையின் மறைமுகத் தன்மையைத் தீர்மானித்துவிடும். ஆகவே தொடர்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியத்தின் தொடர்ச்சி தமிழிலும் பாதுகாக்கப்பட்டாலும், செயல்களின் வரிசை இணைப்புச் சொற்கள் மூலம் தெளிவாக்கப்பட்டுள்ளது. ‘கோபுரம்’ எனப் பொதுவாக வைத்ததால் அதன் காவல் பயன்பாடு ஊகமாகச் சேர்க்கப்படவில்லை; ‘அங்கிருந்து புறப்பட்டுச் சென்றார்’ என்பதால் பயணத்தின் இலக்கும் தொலைவும் தீர்மானிக்கப்படவில்லை.
