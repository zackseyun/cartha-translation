    issue: ‘திராட்சைச் சாறு பிழியும் தொட்டி’ for ληνός
    rationale: Because the owner ‘dug’ (ὤρυξεν) the ληνός in the vineyard, the expression should indicate an excavated winepress/vat rather than a generic ‘container.’
  - severity: low
    issue: ‘நிலவுடைமையாளர்’ is less transparent than ‘நில உரிமையாளர்’
    rationale: Both can convey the sense in context, but the latter is more natural and readily understood in modern standard Tamil.
