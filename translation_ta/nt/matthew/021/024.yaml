translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கத்தின் பரஸ்பர அமைப்பைக் காட்ட ‘நானும்’ இருமுறை காக்கப்பட்டுள்ளது; ‘பதில் சொன்னால்’ என்பது உரையாடல் சூழலுக்கேற்ற இயல்பான நடை.
