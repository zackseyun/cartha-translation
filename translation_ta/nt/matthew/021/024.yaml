id: MAT.21.24
reference: Matthew 21:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἐρωτήσω ὑμᾶς κἀγὼ λόγον ἕνα, ὃν ἐὰν εἴπητέ μοι κἀγὼ ὑμῖν ἐρῶ ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/024.yaml
  text: But Jesus answered them[a], “I also will ask you one question, which if you tell me, I also will tell you by what authority I do these things.”
translation:
  language: ta
  text: 'ஆனால் இயேசு அவர்களுக்குப் பதிலளித்தார்: “நானும் உங்களிடம் ஒரு கேள்வி[a] கேட்பேன். அதற்கு நீங்கள் எனக்குப் பதில் சொன்னால், நானும் எந்த அதிகாரத்தால் இவற்றைச் செய்கிறேன் என்பதை உங்களுக்குச் சொல்வேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “ஒரு விஷயம்”; இன்னும் நேரடியாக, “ஒரு சொல்.” கிரேக்க மொழியில் λόγον ἕνα என்பது ஒரு கேள்வியையோ விவாதிக்கப்படும் ஒரு விஷயத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: ஆனால் இயேசு அவர்களுக்குப் பதிலளித்தார்
  rationale: ἀποκριθεὶς உடன் εἶπεν சேர்ந்துள்ள கிரேக்கக் கதையாடல் மரபைத் தமிழில் இயல்பாக ஒரே பதிலுரை வினையாக வழங்குகிறது; δέ இங்குள்ள மென்மையான எதிர்மறைத் திருப்பை ‘ஆனால்’ காட்டுகிறது.
- source_word: Ἐρωτήσω ὑμᾶς κἀγὼ
  choice: நானும் உங்களிடம் ... கேட்கிறேன்
  rationale: எதிர்கால வடிவம் இங்கு உடனடியாக முன்வைக்கப்படும் எதிர்க்கேள்வியைக் குறிக்கிறது; இயல்பான தமிழில் நிகழ்காலம் பொருத்தமானது. κἀγώ-வின் பரஸ்பர வலியுறுத்தலை ‘நானும்’ காக்கிறது.
- source_word: λόγον ἕνα
  choice: ஒரு கேள்வி
  rationale: λόγος என்பதற்கு அடிப்படையில் ‘சொல்’ அல்லது ‘விஷயம்’ என்று பொருள் வரலாம்; ஆனால் இக்கேள்வி-பதில் சூழலில் ‘ஒரு கேள்வி’ என்பதே நோக்கத்தைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது. மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: ὃν ἐὰν εἴπητέ μοι
  choice: அதற்கு நீங்கள் எனக்குப் பதில் சொன்னால்
  rationale: சொல்லுக்குச் சொல் ‘அதை நீங்கள் என்னிடம் சொன்னால்’ எனலாம்; ஆனால் சூழலில் கேள்விக்குப் பதில் அளிப்பதே பொருள். நிபந்தனை அமைப்பு காக்கப்பட்டுள்ளது.
- source_word: κἀγὼ ὑμῖν ἐρῶ
  choice: நானும் ... உங்களுக்குச் சொல்வேன்
  rationale: முந்தைய κἀγώ-வுடன் உள்ள பரஸ்பர அமைப்பை ‘நானும்’ மீண்டும் வெளிப்படுத்துகிறது.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: எந்த அதிகாரத்தால்
  rationale: ἐν இங்கு செயல் புரிவதற்கான அதிகார அடிப்படையையோ அதிகாரச் செயல்பாட்டையோ குறிக்கிறது; ‘எந்த அதிகாரத்தால்’ என்பது இயல்பான தமிழும் மூலத்தின் திறந்த தன்மையைக் காக்கும் மொழிபெயர்ப்பும் ஆகும்.
- source_word: ταῦτα ποιῶ
  choice: இவற்றைச் செய்கிறேன்
  rationale: ταῦτα என்பதன் பன்மையையும் விவாதத்திற்குள்ளான இயேசுவின் செயல்களைக் குறிக்கும் பரந்த சுட்டையும் காக்கிறது; நிகழ்காலம் தொடர்ந்த அல்லது பொதுவான செயல்பாட்டைக் காட்டுகிறது.
