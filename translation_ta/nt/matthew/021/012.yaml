  source_fidelity: 'மூலக் கிரேக்கத்தின் செயல்வரிசையும் பொருளும் துல்லியமாகப் பேணப்பட்டுள்ளன: இயேசு ஆலயத்தின் விரிவான வளாகத்திற்குள் சென்றார்; அங்கிருந்த விற்பவர்களையும் வாங்குபவர்களையும் அனைவரையும் வெளியேற்றினார்; பணம் மாற்றுவோரின் மேசைகளையும் புறா விற்போரின் இருக்கைகளையும் கவிழ்த்தார். πάντας என்பதன் முழுமையும், ἐξέβαλεν என்பதன் வலுவான வெளியேற்றமும், κατέστρεψεν என்பதன் கவிழ்த்த செயலும் நன்றாக வெளிப்படுகின்றன.'
  naturalness: நடை நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமான கதைநடையுடனும் உள்ளது. “ஆலய வளாகத்திற்குள்,” “வெளியே துரத்தினார்,” “கவிழ்த்துப்போட்டார்” ஆகியவை தெளிவாகவும் வாசிக்கச் சீராகவும் உள்ளன.
