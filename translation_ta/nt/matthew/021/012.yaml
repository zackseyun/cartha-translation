reference: Matthew 21:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ εἰσῆλθεν ⸀Ἰησοῦς εἰς τὸ ⸀ἱερόν, καὶ ἐξέβαλεν πάντας τοὺς πωλοῦντας καὶ ἀγοράζοντας ἐν τῷ ἱερῷ καὶ τὰς τραπέζας τῶν κολλυβιστῶν κατέστρεψεν καὶ τὰς καθέδρας τῶν πωλούντων τὰς περιστεράς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/012.yaml
  text: And Jesus entered the temple courts and drove out all those selling and buying in the temple courts[a], and he overturned the tables of the money changers and the seats of those selling doves.
translation:
  language: ta
  text: இயேசு ஆலய வளாகத்திற்குள் சென்று, அங்கே விற்பவர்கள், வாங்குபவர்கள் அனைவரையும் வெளியே துரத்தினார்[a]. பணம் மாற்றுவோரின் மேசைகளையும் புறாக்களை விற்பவர்களின் இருக்கைகளையும் கவிழ்த்துப்போட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘ஆலயத்தில்’ அல்லது ‘ஆலயப் பகுதியில்’; கிரேக்கச் சொல் உட்புறத் திருத்தலத்தை மட்டும் அல்லாமல் விரிவான ஆலய வளாகத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερόν
  choice: ஆலய வளாகம்
  rationale: இச்சொல் உட்புறப் பரிசுத்த இடத்தை மட்டும் அல்லாமல் விரிவான ஆலயப் பகுதி முழுவதையும் குறிக்கிறது. வணிக நடவடிக்கைகள் நடைபெற்ற வெளிப்புறப் பகுதிகளை இயல்பாகக் குறிக்க ‘ஆலய வளாகம்’ தெளிவான நவீனத் தமிழாக உள்ளது.
- source_word: ἐξέβαλεν
  choice: வெளியே துரத்தினார்
  rationale: வலுவாக வெளியேற்றிய செயலை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: πάντας
  choice: அனைவரையும்
  rationale: வணிகத்தில் ஈடுபட்டவர்களை முழுமையாக உள்ளடக்கும் கிரேக்கச் சொல்லின் பரப்பை வெளிப்படையாகப் பேணுகிறது.
- source_word: τοὺς πωλοῦντας καὶ ἀγοράζοντας
  choice: விற்பவர்கள், வாங்குபவர்கள்
  rationale: விற்பதிலும் வாங்குவதிலும் ஈடுபட்ட இரு தரப்பினரையும் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது; இரு செயல்களையும் ஒரே நபர்கள் செய்தார்கள் என்று தேவையின்றி உணர்த்துவதையும் தவிர்க்கிறது.
- source_word: τράπεζας
  choice: மேசைகள்
  rationale: சூழலுக்குப் பொருத்தமான இச்சொல்லின் நேரான, பொதுவான பொருளைப் பேணுகிறது.
- source_word: κολλυβιστῶν
  choice: பணம் மாற்றுவோர்
  rationale: நாணயங்களை மாற்றிக் கொடுத்தவர்களை சாதாரண வாசகர்களுக்குத் தெளிவான நவீனத் தமிழில் குறிக்கிறது.
- source_word: κατέστρεψεν
  choice: கவிழ்த்துப்போட்டார்
  rationale: மேசைகளையும் இருக்கைகளையும் தலைகீழாகக் கவிழ்த்த செயலை உயிரோட்டமாகத் தெரிவிக்கிறது; அவற்றை முற்றிலும் அழித்தார் என்று மிகைப்படுத்துவதில்லை.
- source_word: καθέδρας
  choice: இருக்கைகள்
  rationale: நாற்காலிகள் உட்பட உட்காரப் பயன்படும் பொருட்களைக் குறிக்கும் மூலச்சொல்லின் பரந்த பொருளைப் பேணுகிறது.
- source_word: περιστεράς
  choice: புறாக்கள்
  rationale: பலிக்காக விற்கப்பட்ட dove/pigeon வகைப் பறவைகளைத் தமிழில் வழக்கமாகவும் தெளிவாகவும் குறிக்கும் சொல்.
theological_decisions:
- issue: இயேசுவின் செயலுடன் தொடர்புடைய ἱερόν என்பதன் இடப்பரப்பு
  choice: இயேசு உட்புறத் திருத்தலத்திற்குள் அல்ல, விரிவான ஆலய வளாகத்திற்குள் நுழைந்தார்.
  alternative: குறிப்பிட்ட இடப்பரப்பை விளக்காமல் பொதுவாக ‘ஆலயம்’ என்று மொழிபெயர்த்தல்.
  rationale: ἱερόν என்பது பொதுவாக ஆலய வளாகத்தைக் குறிக்கிறது; உட்புறப் பரிசுத்த இடத்தைக் குறிப்பாகக் குறிக்கும் ναός என்பதிலிருந்து இது வேறுபடுகிறது. ‘ஆலய வளாகம்’ வரலாற்று மற்றும் இடவியல் குறிப்பைத் தெளிவாக்குகிறது; கூடுதல் கோட்பாட்டைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அங்கே’ என்பது ஒரே வாக்கியத்தில் ‘ஆலய வளாகம்’ மீண்டும் வருவதைத் தவிர்த்தாலும், விற்பதும் வாங்குவதும் அந்த வளாகத்திலேயே நடந்தன என்ற மூலத்தின் இடக்குறிப்பைத் தெளிவாகப் பேணுகிறது.
