base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/008.yaml
  text: Most of the crowd spread their garments on the road[b][a], and others were cutting branches from the trees and spreading them on the road.
translation:
  language: ta
  text: கூட்டத்தில் பெரும்பாலோர்[a] தங்கள் ஆடைகளை[b] பாதையில் விரித்தார்கள்; வேறு சிலரோ மரங்களிலிருந்து கிளைகளை வெட்டிக்கொண்டும், அவற்றைப் பாதையில் விரித்துக்கொண்டும் இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கூட்டத்தின் பெரும்பகுதியினர்.”
    reason: lexical_alternative
  - marker: b
    text: “ஆடைகள்” என்பதை “மேலாடைகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πλεῖστος ὄχλος
  choice: கூட்டத்தினரில் பெரும்பாலோர்
  rationale: πλεῖστος என்பது கூட்டத்தின் பெரும்பகுதியைக் குறிக்கிறது. ‘கூட்டத்தினரில் பெரும்பாலோர்’ என்பது இயல்பான நவீனத் தமிழில் அந்தப் பொருளைத் தெளிவாகத் தருகிறது; δέ-யின் மென்மையான தொடர்ச்சி அடுத்துள்ள அரைப்புள்ளி மற்றும் வாக்கிய ஓட்டத்தில் பிரதிபலிக்கிறது.
- source_word: ἔστρωσαν
  choice: விரித்தார்கள்
  rationale: στρώννυμι இங்கு ஆடைகளைச் சாலையின் மேற்பரப்பில் விரித்தல் அல்லது பரப்புதல் எனப் பொருள்படும். ‘விரித்தார்கள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: ἑαυτῶν τὰ ἱμάτια
  choice: தங்கள் ஆடைகளை
  rationale: ἑαυτῶν என்பதன் தற்சுட்டுப் பொருளை ‘தங்கள்’ வெளிப்படுத்துகிறது. ἱμάτια என்பதன் பரந்த பொருளை ‘ஆடைகள்’ தக்கவைக்கிறது; ‘மேலாடைகள்’ என்பது சாத்தியமான குறிப்பான மாற்று.
- source_word: ἐν τῇ ὁδῷ
  choice: வழியில்
  rationale: இங்கு ὁδός இயேசு சென்ற பாதை அல்லது சாலையைக் குறிக்கிறது. பொருட்களைப் பாதையில் விரித்த செயலை ‘வழியில்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἄλλοι δὲ
  choice: வேறு சிலரோ
  rationale: கூட்டத்திலிருந்த இன்னொரு பிரிவினரை இது குறிக்கிறது. ‘வேறு சிலரோ’ என்பது δέ-யின் மென்மையான வேறுபாட்டையும் தொடர்ச்சியையும் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: ἔκοπτον κλάδους ἀπὸ τῶν δένδρων
  choice: மரங்களிலிருந்து கிளைகளை வெட்டி
  rationale: κλάδοι என்பது கிளைகள்; ἀπὸ τῶν δένδρων அவை மரங்களிலிருந்து வெட்டப்பட்டதைத் தெளிவுபடுத்துகிறது. ἔκοπτον-இன் நிறைவுறாத இறந்தகாலச் செயல், தொடர்ந்து வரும் ‘விரித்துக்கொண்டிருந்தார்கள்’ என்பதுடன் இணைந்த செயற்பாட்டு ஓட்டத்தில் வெளிப்படுகிறது.
- source_word: καὶ ἐστρώννυον ἐν τῇ ὁδῷ
  choice: அவற்றை வழியில் விரித்துக்கொண்டிருந்தார்கள்
  rationale: ἐστρώννυον-இன் imperfect aspect நடந்துகொண்டிருந்த செயலைக் குறிக்கிறது; ‘விரித்துக்கொண்டிருந்தார்கள்’ அதைத் தக்கவைக்கிறது. தமிழில் தெளிவுக்காக ‘அவற்றை’ சேர்க்கப்பட்டுள்ளது; அது முன் குறிப்பிடப்பட்ட கிளைகளையே சுட்டுகிறது.
