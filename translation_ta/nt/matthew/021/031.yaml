source:
  edition: SBLGNT
  text: τίς ἐκ τῶν δύο ἐποίησεν τὸ θέλημα τοῦ πατρός; ⸀λέγουσιν· Ὁ ⸀πρῶτος. λέγει αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν λέγω ὑμῖν ὅτι οἱ τελῶναι καὶ αἱ πόρναι προάγουσιν ὑμᾶς εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/031.yaml
  text: Which of the two did the will of the father? They said[a], “The first.” Jesus said to them, “Truly I say to you, the tax collectors and the prostitutes are going ahead of you into the kingdom of God.”
translation:
  language: ta
  text: '“இந்த இருவரில் தந்தையின் விருப்பத்தை நிறைவேற்றியவன் யார்?” அவர்கள், “முதலாமவன்” என்றார்கள். இயேசு அவர்களிடம், “உண்மையாக நான் உங்களுக்குச் சொல்கிறேன்: வரி வசூலிப்பவர்களும் பாலியல் தொழிலில் ஈடுபடும் பெண்களும் உங்களுக்கு முன்னால் கடவுளின் அரசாட்சிக்குள் செல்கிறார்கள்[a]” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களுக்கு முன்பாகக் கடவுளின் அரசாட்சிக்குள் நுழைகிறார்கள்.” கிரேக்கத்தில், “உங்களுக்கு முன்னால் செல்கிறார்கள்” என்று உள்ளது. இது அவர்கள் உங்களை முந்திச் செல்வதை வலியுறுத்துகிறது; ஆனால் நீங்கள் இறுதியில் நுழையவே மாட்டீர்கள் என்று அவசியமாகக் கூறவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: τίς ἐκ τῶν δύο
  choice: இந்த இருவரில் ... யார்?
  rationale: ἐκ என்பதன் பகுதியைக் குறிக்கும் பொருளையும் இயல்பான நவீனத் தமிழ் வினா அமைப்பையும் காக்கிறது.
- source_word: ἐποίησεν τὸ θέλημα τοῦ πατρός
  choice: தந்தை விரும்பியபடி செய்தவன்
  rationale: ‘தந்தையின் சித்தத்தைச் செய்தான்’ என்ற இறுக்கமான சமய வழக்கைத் தவிர்த்து, ποιέω + θέλημα என்பதன் பொருளை இயல்பாகத் தருகிறது; இங்குள்ள தந்தை உவமையில் வரும் தந்தை என்பதையும் தெளிவாக வைத்திருக்கிறது.
- source_word: Ὁ πρῶτος
  choice: முதலாமவன்
  rationale: கிரேக்கத்தின் சுருக்கமான விடையைத் தமிழில் இயல்பாகவும் ஆண்பால் சுட்டுதலுடனும் தருகிறது.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: உண்மையாகவே நான் உங்களுக்குச் சொல்கிறேன்
  rationale: இயேசுவின் வலியுறுத்தலான அறிமுகச் சூத்திரத்தின் கம்பீரத்தையும் பொருளையும் சாதாரண வாசகருக்குத் தெளிவாகத் தருகிறது.
- source_word: τελῶναι
  choice: வரி வசூலிப்பவர்கள்
  rationale: நற்செய்திகளில் சமூக இகழ்ச்சிக்கு உள்ளான வருவாய் வசூலிப்பவர்களைக் குறிக்கும் சொல்லுக்கு நவீனமும் தெளிவுமான இணை.
- source_word: πόρναι
  choice: பாலியல் தொழிலாளிகள்
  rationale: பழமையான அல்லது வெறுப்பூட்டும் சொற்களைத் தவிர்த்து, இங்கு குறிக்கப்படும் தொழிலில் ஈடுபடும் நபர்களைத் துல்லியமாகவும் நவீனமாகவும் குறிக்கிறது; கிரேக்கத்தில் பெண்பால் என்பது சூழலால் புரிகிறது.
- source_word: προάγουσιν ὑμᾶς
  choice: உங்களுக்கு முன்னால் ... செல்கிறார்கள்
  rationale: நிகழ்காலச் செயற்பாட்டையும் முன்னே செல்வது/முந்திச் செல்வது என்ற படிமத்தையும் காக்கிறது; எதிரிலுள்ளவர்கள் முற்றிலும் விலக்கப்பட்டார்கள் என்று உரைக்கு அப்பால் முடிவுசெய்யவில்லை.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: கடவுளின் அரசாட்சிக்குள்
  rationale: εἰς என்பதன் உள்ளே செல்லும் திசையையும் βασιλεία என்பதன் அரசாட்சி சார்ந்த பொருளையும் தெளிவான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: προάγουσιν ὑμᾶς என்பது அரசாட்சிக்குள் நுழைவதுடன் கொண்டுள்ள தொடர்பு
  choice: உங்களுக்கு முன்னால் கடவுளின் அரசாட்சிக்குள் செல்கிறார்கள்
  alternative: உங்களுக்கு முன்பாகவே கடவுளின் அரசாட்சிக்குள் நுழைகிறார்கள்
  rationale: முதன்மை மொழிபெயர்ப்பு ‘முன்னே செல்கிறார்கள்’ என்ற கிரேக்கப் படிமத்தையும் முன்னுரிமையையும் காக்கிறது. மாற்று மொழிபெயர்ப்பு நுழைவை வெளிப்படையாக்குகிறது; ஆனால் தலைவர்களின் இறுதி விலக்கலை உரை சொல்வதைவிட வலுவாகக் கூறாதபடி இரு வடிவங்களும் கவனமாக அமைக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன, பொதுநிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. பாரம்பரியமாக இருந்தாலும் இன்றைய வாசகருக்கு இறுக்கமாகத் தோன்றக்கூடிய ‘சித்தம்’, ‘ஆயக்காரர்’, ‘விலைமாதர்’ போன்ற சொற்கள் தவிர்க்கப்பட்டுள்ளன. உரையாடலின் இயல்புக்காக கிரேக்கத்தில் உள்ள கேள்வியைத் தெளிவாக அறிமுகப்படுத்த ‘என்று அவர் கேட்டார்’ சேர்க்கப்பட்டுள்ளது.
