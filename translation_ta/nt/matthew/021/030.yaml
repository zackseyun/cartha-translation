id: MAT.21.30
reference: Matthew 21:30
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂προσελθὼν δὲ⸃ τῷ ⸀δευτέρῳ εἶπεν ὡσαύτως· ὁ δὲ ἀποκριθεὶς εἶπεν· ⸂Ἐγώ, κύριε· καὶ οὐκ⸃ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/030.yaml
  text: Then he came to the second and said the same[a]. And he answered, ‘I will[b], sir,’ but he did not go.
translation:
  language: ta
  text: பின்பு அவர் இரண்டாவது மகனிடம் சென்று அதேபோலச் சொன்னார். அவன் பதிலளித்து, “நான் போவேன்[a], ஐயா[b]” என்றான்; ஆனால் அவன் போகவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “நான்”; இது கட்டளைக்கான சுருக்கமான சம்மதப் பதில்; “நான் போவேன்” அல்லது “நான் செல்வேன்” என்பது பொருள்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கச் சொல்லை “ஆண்டவரே” அல்லது “எஜமானே” என்றும் மொழிபெயர்க்கலாம்; இங்கு மனிதத் தந்தையை மரியாதையுடன் அழைப்பதால் “ஐயா” என வழங்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: προσελθὼν δὲ
  choice: பின்பு அவர் ... சென்று
  rationale: இறந்தகாலப் பெயரெச்சமும் மென்மையான தொடரிணைப்பான δέ-யும் கதையின் அடுத்த நிகழ்வை இயல்பான தமிழில் காட்டுகின்றன.
- source_word: τῷ δευτέρῳ
  choice: இரண்டாவது மகனிடம்
  rationale: δευτέρῳ என்பது ‘இரண்டாவது’ என்று பொருள்படும்; ‘மகன்’ கிரேக்கத்தில் மீண்டும் கூறப்படாவிட்டாலும் உடனடிச் சூழலிலிருந்து தெளிவாக இருப்பதால் தமிழில் தெளிவுக்காகச் சேர்க்கப்பட்டுள்ளது.
- source_word: ὡσαύτως
  choice: அதேபோலவே
  rationale: முதல் மகனிடம் கூறிய அதே கட்டளையை இவனிடமும் கூறியதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀποκριθεὶς εἶπεν
  choice: பதிலளித்தான்
  rationale: ‘பதிலளித்து, சொன்னான்’ என்ற சொற்சொற் வடிவத்தின் தேவையற்ற இரட்டிப்பைத் தவிர்த்து, கிரேக்க மரபுத்தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: Ἐγώ
  choice: நான் போகிறேன்
  rationale: கிரேக்கத்தில் வலியுறுத்தப்பட்ட ‘நான்’ மட்டும் உள்ளது; தந்தையின் கட்டளைக்கு அளித்த சம்மதம் என்பதால் விடுபட்டுள்ள ‘போகிறேன்’ தமிழில் பொருள் தெளிவுக்காக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: κύριε
  choice: ஐயா
  rationale: இங்கு மகன் தனது மனிதத் தந்தையை மரியாதையுடன் அழைக்கிறான். ‘ஐயா’ மரியாதையைத் தக்கவைத்து, தேவனை அல்லது மேசியாவைக் குறிக்கும் பட்டத்தைத் தேவையின்றி புகுத்துவதில்லை.
- source_word: καὶ οὐκ ἀπῆλθεν
  choice: ஆனால் அவன் போகவில்லை
  rationale: சொன்னதற்கும் செய்ததற்கும் உள்ள முரண்பாட்டை இயல்பான தமிழில் வெளிப்படுத்த καί எதிர்மறைப் பொருளில் ‘ஆனால்’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: தந்தையை நோக்கி வரும் κύριε என்ற அழைப்பின் மொழிபெயர்ப்பு
  choice: ஐயா
  alternative: ஆண்டவரே / எஜமானே
  rationale: κύριε வேறு சூழல்களில் ‘ஆண்டவரே’ என வரலாம். ஆனால் இங்கு உவமையில் ஒரு மனிதத் தந்தைக்கான மரியாதை அழைப்பாக இருப்பதால், தெய்வீக அல்லது கிறிஸ்துவியல் பொருளைத் தேவையின்றி ஏற்படுத்தாத ‘ஐயா’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குத் தெளிவானதும் கண்ணியமானதுமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. தந்தைக்கு ‘அவர்’, மகனுக்கு ‘அவன்’ என மரியாதை வேறுபாடு இயல்பாகக் காட்டப்பட்டுள்ளது; கிரேக்கத்தின் சுருக்கமான பதில் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
