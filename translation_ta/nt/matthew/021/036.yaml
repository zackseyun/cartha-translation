id: MAT.21.36
reference: Matthew 21:36
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πάλιν ἀπέστειλεν ἄλλους δούλους πλείονας τῶν πρώτων, καὶ ἐποίησαν αὐτοῖς ὡσαύτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/036.yaml
  text: Again he sent other servants[a], more than the first ones, and they did the same to them.
translation:
  language: ta
  text: மறுபடியும் அவன், முதலில் அனுப்பப்பட்டவர்களைவிட அதிகமான வேறு பணியாளர்களை[a] அனுப்பினான்; அவர்களிடமும் அவர்கள் அதேபோலவே நடந்துகொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வேறு அடிமைகளை.’ கிரேக்கச் சொல் சூழலைப் பொறுத்து ‘பணியாளர்கள்’ அல்லது ‘அடிமைகள்’ என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: மறுபடியும்
  rationale: முன்பு செய்த செயல் மீண்டும் நிகழ்ந்ததை இயல்பான கதைநடையில் குறிக்கிறது.
- source_word: ἀπέστειλεν
  choice: அவன் அனுப்பினான்
  rationale: ἀποστέλλω என்பதன் எளிய இறந்தகாலக் கதைநடைப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: ἄλλους δούλους
  choice: வேறு பணியாளர்களை[a]
  rationale: இந்த உவமையில் எஜமானால் அனுப்பப்பட்டவர்களாகிய அவர்களின் பணியே முன்னிலையில் இருப்பதால், நவீன தமிழில் இயல்பான ‘பணியாளர்கள்’ தேர்ந்தெடுக்கப்பட்டது; δοῦλος என்பதிலுள்ள ‘அடிமைகள்’ என்ற சாத்தியமும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: πλείονας τῶν πρώτων
  choice: முந்தினவர்களைவிட அதிக எண்ணிக்கையில்
  rationale: பின்னர் அனுப்பப்பட்ட குழு முதல் குழுவைவிட எண்ணிக்கையில் பெரியது என்பதைக் குழப்பமின்றி வெளிப்படுத்துகிறது.
- source_word: ἐποίησαν αὐτοῖς ὡσαύτως
  choice: அவர்களுக்கும் அவர்கள் அதேபோலவே செய்தார்கள்
  rationale: முந்தைய வசனத்தில் பணியாளர்களுக்கு நேர்ந்த நடத்தையைச் சுட்டும் பின்னோக்குக் குறிப்பைப் பாதுகாக்கிறது; மூலத்தின் பொதுவான ‘செய்தார்கள்’ என்ற வினையையும் தேவையின்றி விளக்கிவிடாமல் வைத்திருக்கிறது.
theological_decisions:
- issue: உவமையில் δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: பணியாளர்கள்
  alternative: அடிமைகள்
  rationale: இங்கு சட்டரீதியான அடிமை நிலையைவிட, எஜமானால் அனுப்பப்பட்டு துன்புறுத்தப்பட்ட தூதர்களாகிய அவர்களின் பங்கு கதைநடையில் முன்னிலை பெறுகிறது. இருப்பினும், கிரேக்கச் சொல்லின் ‘அடிமைகள்’ என்ற பொருள் அடிக்குறிப்பில் வெளிப்படையாகக் கொடுக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அவர்களுக்கும் அவர்கள்’ என்பது தமிழில் சற்றே மீளுரைப்பாக இருந்தாலும், இரு வேறு குழுக்களைக் குறிக்கும் மூலத்தின் பிரதிப்பெயர்களையும் அதன் சுருக்கமான பின்னோக்குச் சுட்டுதலையும் பாதுகாக்கிறது.
