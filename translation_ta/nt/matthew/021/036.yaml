revisions:
- from: மறுபடியும், முந்தினவர்களைவிட அதிக எண்ணிக்கையில் வேறு பணியாளர்களை[a] அவன் அனுப்பினான்; அவர்களுக்கும் அவர்கள் அதேபோலவே செய்தார்கள்.
  to: மறுபடியும் அவன், முதலில் அனுப்பப்பட்டவர்களைவிட அதிகமான வேறு பணியாளர்களை[a] அனுப்பினான்; அவர்களிடமும் அவர்கள் அதேபோலவே நடந்துகொண்டார்கள்.
