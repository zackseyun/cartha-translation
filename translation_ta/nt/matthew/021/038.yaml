reference: Matthew 21:38
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἱ δὲ γεωργοὶ ἰδόντες τὸν υἱὸν εἶπον ἐν ἑαυτοῖς· Οὗτός ἐστιν ὁ κληρονόμος· δεῦτε ἀποκτείνωμεν αὐτὸν καὶ ⸀σχῶμεν τὴν κληρονομίαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/038.yaml
  text: But when the tenant farmers saw the son[a], they said among themselves, ‘This is the heir. Come, let us kill him and seize his inheritance.’
translation:
  language: ta
  text: ஆனால் குத்தகை விவசாயிகள் அந்த மகனைக் கண்டபோது, ‘இவன்தான் வாரிசு. வாருங்கள், இவனைக் கொன்று இவனுடைய பரம்பரைச் சொத்தைக் கைப்பற்றிக்கொள்வோம்[a]’ என்று தங்களுக்குள் சொல்லிக்கொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல் மொழிபெயர்ப்பு: ‘இவனுடைய பரம்பரைச் சொத்தைப் பெற்றுக்கொள்வோம்’; இங்கு அதைப் பலவந்தமாகத் தங்களுடையதாக்கிக்கொள்வதே சூழற்பொருள்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: குத்தகை விவசாயிகள்
  rationale: உவமையின் சூழலில் இவர்கள் வெறும் விவசாயத் தொழிலாளர்கள் அல்ல; உரிமையாளரிடமிருந்து திராட்சைத்தோட்டத்தைக் குத்தகைக்கு எடுத்து உழுபவர்கள். இந்தச் சமூகப் பங்கைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἰδόντες
  choice: கண்டபோது
  rationale: இறந்தகாலப் பங்கேற்பு வினையை இயல்பான தமிழில் காலத்தைக் குறிக்கும் துணைவாக்கியமாக வழங்கி, நிகழ்வுகளின் வரிசையைப் பாதுகாக்கிறது.
- source_word: τὸν υἱὸν
  choice: அந்த மகனை
  rationale: கிரேக்கத்தில் வெளிப்படையான உடைமைப் பெயர் இல்லாமல் குறிப்புச் சுட்டுடன் ‘மகன்’ வருகிறது. முன்பு குறிப்பிடப்பட்ட மகனைச் சுட்டும் இயல்பான தமிழாக ‘அந்த மகன்’ அமைகிறது; ‘உரிமையாளருடைய மகன்’ என்று விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: ἐν ἑαυτοῖς
  choice: தங்களுக்குள்
  rationale: குத்தகைக்காரர்கள் தங்கள் குழுவினருக்குள் பேசிக்கொண்டதைக் கூட்டுப் பொருளுடன் இயல்பாகத் தெரிவிக்கிறது.
- source_word: κληρονόμος
  choice: வாரிசு
  rationale: சட்டரீதியான மரபுரிமைப் பொருளைக் கொண்ட, இன்றைய தமிழில் பொதுவாகப் புரியும் நேரடியான இணைச்சொல்.
- source_word: δεῦτε
  choice: வாருங்கள்
  rationale: அடுத்த செயலைச் செய்யத் தூண்டும் பன்மை ஏவலைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: ἀποκτείνωμεν
  choice: கொன்றுவிட்டு
  rationale: ‘நாம் கொல்வோம்’ என்ற தூண்டல் பொருளைத் தொடர்ந்து வரும் கைப்பற்றும் செயலுடன் இயல்பாக இணைக்கிறது; ‘கொலை செய்வோம்’ என கிரேக்கத்தில் வெளிப்படையாக இல்லாத சட்ட அல்லது ஒழுக்க மதிப்பீட்டை முன்னிறுத்தவில்லை.
- source_word: σχῶμεν
  choice: கைப்பற்றிக்கொள்வோம்
  rationale: அடிப்படையில் ‘பெற்றிருப்போம்/கொண்டிருப்போம்’ என்றாலும், வாரிசைக் கொன்றபின் சொத்தைத் தங்களுக்காக எடுத்துக்கொள்ளும் பகைமையான சூழற்பொருளை ‘கைப்பற்றிக்கொள்வோம்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: κληρονομίαν αὐτοῦ
  choice: இவனுடைய பரம்பரைச் சொத்து
  rationale: κληρονομία என்பதன் மரபுரிமை சார்ந்த பொருளையும், αὐτοῦ என்ற உடைமையையும் வெளிப்படையாகப் பாதுகாத்து, ‘வாரிசு’ என்பதுடன் கருத்து இணைப்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: உவமையில் வரும் மகனின் அடையாளம்
  choice: υἱός என்பதை உவமையின் கதைநிலையில் ‘அந்த மகன்’ என்றே மொழிபெயர்த்தல்
  alternative: மகன் இயேசுவைக் குறிப்பதாக மொழிபெயர்ப்பிலேயே வெளிப்படையாகச் சுட்டுதல்
  rationale: மத்தேயுவின் விரிந்த கதைச்சூழலில் இந்த உவமை இயேசுவை நோக்கிச் சுட்டினாலும், இவ்வசனம் கதைநிலையில் மகனைப் பற்றியே பேசுகிறது. கிறிஸ்துவைப் பற்றிய அடையாளத்தை மொழிபெயர்ப்புக்குள் சேர்க்காமல் இருப்பது உவமையின் இறையியல் நெருக்கத்தையும் வாசகரின் விளக்கப் பொறுப்பையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் மரியாதையும் கதைநடையின் தீவிரமும் காக்கப்பட்டுள்ளன. நேரடி உரையில் பன்மைத் தூண்டலுக்கு ‘வாருங்கள்’ பயன்படுத்தப்பட்டுள்ளது. அடிக்குறி குறியீடு அது விளக்கும் ‘கைப்பற்றிக்கொள்வோம்’ என்பதற்குப் பின்னர் வைக்கப்பட்டுள்ளது.
