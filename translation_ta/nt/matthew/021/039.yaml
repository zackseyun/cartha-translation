  text: καὶ λαβόντες αὐτὸν ἐξέβαλον ἔξω τοῦ ἀμπελῶνος καὶ ἀπέκτειναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/039.yaml
  text: And they took him[a], threw him out of the vineyard, and killed him.
translation:
  language: ta
  text: அவர்கள் அவனைப் பிடித்து, திராட்சைத்தோட்டத்திலிருந்து வெளியே தள்ளி, கொன்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβόντες (λαμβάνω)
  choice: பிடித்து
  rationale: இறந்தகால வினையெச்சம் அடுத்த செயல்களுக்கு முன்பான செயலைக் குறிக்கிறது. இச்சூழலில் ‘பிடித்து’ என்பது இயல்பான தமிழாகவும், ‘கைப்பற்றி’ என்பதில் தோன்றக்கூடிய மிகுதியான வன்முறை நுணுக்கத்தைத் தவிர்ப்பதாகவும் உள்ளது.
- source_word: ἐξέβαλον (ἐκβάλλω)
  choice: வெளியே தள்ளி
  rationale: இங்கு திராட்சைத்தோட்டத்திலிருந்து உடல்ரீதியாக வெளியேற்றிய செயலைக் குறிக்கிறது. ‘வெளியே தள்ளி’ என்பது நவீன தமிழில் நேரடியும் இயல்பானதுமாக உள்ளது.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: திராட்சைத்தோட்டத்திற்கு வெளியே
  rationale: இச்சொற்றொடர் திராட்சைத்தோட்டத்தின் எல்லைக்கு வெளியே சென்ற இடத்தைத் தெளிவாகக் குறிக்கிறது; ἐξέβαλον உடன் இணைந்து இயக்கத்தின் முடிவிடத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀμπελῶνος (ἀμπελών)
  choice: திராட்சைத்தோட்டம்
  rationale: திராட்சைக் கொடிகள் பயிரிடப்படும் தோட்டத்தைக் குறிக்கும் துல்லியமான, வழக்கமான தமிழ் சொல்.
- source_word: ἀπέκτειναν (ἀποκτείνω)
  choice: கொன்றுபோட்டார்கள்
  rationale: ‘கொன்றுபோட்டார்கள்’ என்பது செயலை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது. ‘கொலை செய்தார்கள்’ என்பது சட்ட அல்லது அறநெறித் தீர்ப்பை அதிகமாக முன்னிறுத்தக்கூடும்.
theological_decisions:
- issue: இணை நற்செய்திக் குறிப்புகளுடன் தொடர்புடைய வெளியேற்றுதல்–கொல்லுதல் செயல்களின் வரிசை
  choice: முதலில் அவனைத் திராட்சைத்தோட்டத்திற்கு வெளியே தள்ளி, பின்னர் கொன்றார்கள் என்று மொழிபெயர்த்தல்.
  alternative: மாற்கு/லூக்கா குறிப்புகளுடன் ஒத்திசைக்க, முதலில் கொன்று பின்னர் வெளியே எறிந்ததாக மறைமுகமாகக் காட்டுதல்.
  rationale: 'மத்தேயுவின் கிரேக்க வாக்கியத்தில் செயல்களின் வரிசை வெளிப்படையாக உள்ளது: λαβόντες ... ἐξέβαλον ... καὶ ἀπέκτειναν. ஆகவே இணை நிகழ்ச்சிக் குறிப்புகளோடு செயற்கையாக ஒத்திசைக்காமல், மத்தேயுவின் சொந்த வரிசை பாதுகாக்கப்படுகிறது.'
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. கிரேக்க மூலத்தின் மூன்று தொடர்ச்சியான செயல்களும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன. இவ்வரைவில் அடிக்குறிப்பு தேவையில்லை.
