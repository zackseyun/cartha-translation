id: MAT.21.9
reference: Matthew 21:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι οἱ προάγοντες ⸀αὐτὸν καὶ οἱ ἀκολουθοῦντες ἔκραζον λέγοντες· Ὡσαννὰ τῷ υἱῷ Δαυίδ· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου· Ὡσαννὰ ἐν τοῖς ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/009.yaml
  text: And the crowds going ahead of him and those following were crying out[a], saying[c][b], “Hosanna to the Son of David! Blessed is the one who comes in the name of the Lord! Hosanna in the highest!”
translation:
  language: ta
  text: அவருக்கு முன்னால் சென்ற மக்கள்கூட்டங்களும் அவரைப் பின்தொடர்ந்தவர்களும் தொடர்ந்து உரக்கக் கூவி, “தாவீதின் மகனுக்கு ஓசன்னா![a] ஆண்டவரின் பெயரில் வருகிறவர் ஆசீர்வதிக்கப்பட்டவர்![b] உன்னதங்களில் ஓசன்னா!” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஓசன்னா” என்பது எபிரெய மொழியிலிருந்து வந்த ஆரவாரச் சொல். அதன் அடிப்படைப் பொருள் “தயவுசெய்து காப்பாற்றும்” அல்லது “இப்போதே காப்பாற்றும்” என்பதற்கு ஒத்தது; ஆனால் இங்கு அது புகழ்ச்சியின் ஆரவாரமாகவும் செயல்படுகிறது. “தாவீதின் மகன்” என்பது தாவீதின் வம்சத்திலிருந்து வரும் அரசரான மேசியாவைக் குறிக்கும் பட்டம்.
    reason: lexical_and_cultural_note
  - marker: b
    text: இந்தச் சொற்கள் சங்கீதம் 118:26-ஐ எதிரொலிக்கின்றன. அங்குள்ள எபிரெய உரையில் “ஆண்டவர்” என்ற இடத்தில் YHWH என்னும் இறைத் திருப்பெயர் உள்ளது.
    reason: cross_reference
lexical_decisions:
- source_word: ὄχλοι
  choice: மக்கள்கூட்டங்கள்
  rationale: பல திரள்களைக் குறிக்கும் பன்மையைத் தக்கவைத்து, நவீனத் தமிழில் இயல்பாகக் காட்சியை வெளிப்படுத்துகிறது.
- source_word: προάγοντες αὐτόν
  choice: அவருக்கு முன்னால் சென்ற
  rationale: இயேசுவுக்கு முன்னே ஊர்வலமாகச் சென்றதைக் காட்டுகிறது; அவர்கள் அவரை முறையாக வழிநடத்தினர் என்ற தேவையற்ற பொருளைத் தவிர்க்கிறது.
- source_word: ἀκολουθοῦντες
  choice: அவரைப் பின்தொடர்ந்தவர்கள்
  rationale: முன்னால் சென்றவர்களுடன் இயல்பான இணைப்பை உருவாக்கி, ஊர்வலக் காட்சியைத் தெளிவாக வைத்திருக்கிறது.
- source_word: ἔκραζον λέγοντες
  choice: தொடர்ந்து உரக்கக் கூவி … என்று சொன்னார்கள்
  rationale: ἔκραζον என்பதன் நிறைவுறாத, தொடர்ச்சியான செயலை ‘தொடர்ந்து’ என்பதாலும், λέγοντες என்பதைக் கூறுதலுக்குரிய தமிழ் அமைப்பாலும் வெளிப்படுத்துகிறது.
- source_word: Ὡσαννά
  choice: ஓசன்னா
  rationale: இங்கு இது வேண்டுதலின் மூலப்பொருளையும் தாண்டி வழிபாட்டு ஆரவாரமாகச் செயல்படுவதால் ஒலிபெயர்ப்பு தக்கவைக்கப்படுகிறது; பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τῷ υἱῷ Δαυίδ
  choice: தாவீதின் மகனுக்கு
  rationale: கிரேக்க வேற்றுமைப் பொருளையும் தாவீதிய அரச-மேசிய பட்டத்தையும் விளக்கவுரையாக மாற்றாமல் தக்கவைக்கிறது.
- source_word: Εὐλογημένος ὁ ἐρχόμενος
  choice: வருகிறவர் ஆசீர்வதிக்கப்பட்டவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்பு வடிவை இயல்பான, கண்ணியமான தமிழில் தக்கவைக்கிறது.
- source_word: ἐν ὀνόματι κυρίου
  choice: ஆண்டவரின் பெயரில்
  rationale: வேதாகம மேற்கோளின் சொற்களையும் தெய்வீக அதிகாரத்தின் உட்கருத்தையும் மிகைப்படுத்தாமல் பாதுகாக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: கிரேக்க κύριος என்பதற்கு நேரான தமிழ் இணை; சங்கீதத்தின் எபிரெயப் பின்னணி அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: ἐν τοῖς ὑψίστοις
  choice: உன்னதங்களில்
  rationale: பன்மை வடிவையும் உயர்ந்த பரலோகத் தளங்களைக் குறிக்கக்கூடிய தெளிவின்மையையும் காக்கிறது; ‘பரலோகத்தில்’ என்று அளவுக்கு மீறி குறிப்பாக்கவில்லை.
theological_decisions:
- issue: τῷ υἱῷ Δαυίδ என்பதிலுள்ள மேசிய அரச பட்டம்
  choice: ‘தாவீதின் மகன்’ என்ற பட்டத்தை அப்படியே தக்கவைத்தல்
  alternative: ‘மேசியா’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: மூல உரை தாவீதிய பட்டத்தையே பயன்படுத்துகிறது. அதைத் தக்கவைப்பது வரலாற்று மற்றும் இறையியல் அடர்த்தியைப் பாதுகாக்கிறது.
- issue: Ὡσαννά என்பதன் மொழிபெயர்ப்பு
  choice: முதன்மை உரையில் ‘ஓசன்னா’ என ஒலிபெயர்த்து, மூலப் பொருளை அடிக்குறிப்பில் விளக்குதல்
  alternative: ‘இப்போதே காப்பாற்றும்’ அல்லது ‘தயவுசெய்து காப்பாற்றும்’
  rationale: இச்சூழலில் இது மீட்புக்கான வேண்டுதலாக மட்டும் இல்லாமல் புகழ்ச்சி நிறைந்த வழிபாட்டு ஆரவாரமாகவும் செயல்படுகிறது.
- issue: சங்கீத மேற்கோளில் κυρίου என்பதன் குறிப்பு
  choice: ‘ஆண்டவர்’ என்று மொழிபெயர்த்து, எபிரெய மூலத்திலுள்ள YHWH பின்னணியை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: முதன்மை உரையில் ‘யாவே’ அல்லது சிறப்பு எழுத்தமைப்பில் ‘கர்த்தர்’ என்று இடுதல்
  rationale: புதிய ஏற்பாட்டின் கிரேக்க உரை κύριος என்று வாசிக்கிறது; அதையே மொழிபெயர்த்தபடி, சங்கீதத்தின் திருப்பெயர் பின்னணியை மறைக்காமல் அடிக்குறிப்பில் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைக் கையாளுகிறது. ‘தொடர்ந்து உரக்கக் கூவி’ என்பது கிரேக்க இறந்தகாலத் தொடர்ச்சியை வெளிப்படுத்துகிறது. ‘உன்னதங்களில்’ என்பது வழிபாட்டு உயர்நடையையும் மூலத்தின் பன்மையையும் தக்கவைக்கிறது. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
