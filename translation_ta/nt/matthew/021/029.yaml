source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· ⸂Οὐ θέλω· ὕστερον δὲ μεταμεληθεὶς⸃ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/029.yaml
  text: But he answered[b][a], ‘I do not want to.’ But later he changed his mind and went.
translation:
  language: ta
  text: அவன் பதிலளித்து, “எனக்கு விருப்பமில்லை” என்றான். ஆனால் பின்னர் மனம் மாறி[a] சென்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வருந்தி” அல்லது “மனத்தை மாற்றிக்கொண்டு.” கிரேக்கப் பங்கேற்புவினை, தன் போக்கை மாற்ற வழிநடத்தும் வருத்தத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: பதிலளித்தான்
  rationale: கதைநடையில் வரும் வழக்கமான பங்கேற்புவினை வடிவத்தை இயல்பான தமிழ் முற்றுவினையாக வழங்குகிறது.
- source_word: Οὐ θέλω
  choice: எனக்கு விருப்பமில்லை
  rationale: θέλω இங்கு விருப்பம் அல்லது மனவிருப்பத்தைக் குறிக்கிறது; மகனின் நேரடியான மறுப்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὕστερον
  choice: பிறகு
  rationale: பின்னர் நிகழ்ந்த செயலைக் குறிக்கும் கால வினையடை; சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: μεταμεληθεὶς
  choice: மனம் மாறி
  rationale: முந்தைய முடிவை மாற்றிக்கொண்டதையும் அதனால் செயலில் ஏற்பட்ட திருப்பத்தையும் தெரிவிக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத வலுவான சமயவியல் பொருளைத் திணிக்கவில்லை.
- source_word: ἀπῆλθεν
  choice: போனான்
  rationale: சூழலில் தந்தை கேட்ட செயலைச் செய்யச் சென்றதை இயல்பாகக் குறிக்கிறது.
theological_decisions:
- issue: உவமையின் சூழலில் μεταμεληθεὶς என்பதன் மொழிபெயர்ப்பு
  choice: மனம் மாறி
  alternative: வருந்தி / மனந்திரும்பி
  rationale: இவ்வசனம் மறுப்பிலிருந்து கீழ்ப்படிதலுக்கான மனநிலை மற்றும் செயல் மாற்றத்தை விவரிக்கிறது. “மனந்திரும்பி” என்பது தனித்த சமயவியல் கருத்தை மிகத் தெளிவாக முன்கூட்டியே சேர்க்கக்கூடும்; “மனம் மாறி” மூலத்தின் பொருள் விரிவையும் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. “எனக்கு விருப்பமில்லை” என்பது நேரடியான மறுப்பாகவும், “மனம் மாறி” என்பது தேவையற்ற சமயவியல் மிகைவின்றியும் வழங்கப்பட்டுள்ளது.
