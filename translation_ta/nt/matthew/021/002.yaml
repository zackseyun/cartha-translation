  text: λέγων αὐτοῖς· ⸀Πορεύεσθε εἰς τὴν κώμην τὴν ⸀κατέναντι ὑμῶν, καὶ ⸀εὐθέως εὑρήσετε ὄνον δεδεμένην καὶ πῶλον μετ’ αὐτῆς· λύσαντες ⸀ἀγάγετέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/002.yaml
  text: saying to them[a], “Go into the village opposite you, and immediately you will find a donkey tied, and a colt with her[c][b]. Untie them and bring them to me.”
translation:
  language: ta
  text: 'அவர்களிடம் அவர் கூறினார்: “உங்களுக்கு எதிரே இருக்கும்[a] கிராமத்துக்குப் போங்கள். அங்கே உடனே கட்டிவைக்கப்பட்டிருக்கும் ஒரு பெண் கழுதையையும், அதனுடன் ஒரு கழுதைக்குட்டியையும் காண்பீர்கள். அவற்றை அவிழ்த்து[b] என்னிடம் கொண்டுவாருங்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உங்களுக்கு முன்னால் உள்ள” அல்லது “உங்களுக்கு எதிர்ப்புறத்தில் உள்ள” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் சொல்லர்த்தமாக, “அவிழ்த்த பின்பு, என்னிடம் கொண்டுவாருங்கள்” என்ற பங்கேற்பு–கட்டளை அமைப்பு உள்ளது.
    reason: source_form
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: அவர்களிடம் அவர் கூறியது
  rationale: முந்தைய வசனத்தில் வரும் அனுப்புதல் வினையுடன் இணைந்துள்ள கிரேக்கப் பங்கேற்பு வடிவத்தைத் தமிழில் இயல்பான உரையறிமுகமாக வழங்குகிறது.
- source_word: Πορεύεσθε
  choice: போங்கள்
  rationale: கதைச் சூழலில் கொடுக்கப்படும் நேரடியான கட்டளைக்கு இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: κώμην
  choice: கிராமம்
  rationale: κώμη என்பது நகரத்தைவிடச் சிறிய குடியிருப்பை வழக்கமாகக் குறிக்கிறது.
- source_word: κατέναντι ὑμῶν
  choice: உங்களுக்கு எதிரே இருக்கும்
  rationale: சீடர்களின் இருப்பிடத்துக்கு எதிர்ப்புறத்தில் அல்லது முன்னால் உள்ள இடம் என்ற இடவியல் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: εὐθέως
  choice: உடனே
  rationale: தாமதமின்றி நிகழ்வதைக் குறிக்கும் εὐθέως என்பதற்கான இயல்பான, சுருக்கமான தமிழ் இணை.
- source_word: ὄνον δεδεμένην
  choice: கட்டிவைக்கப்பட்டிருக்கும் ஒரு பெண் கழுதை
  rationale: δεδεμένην கழுதை கட்டப்பட்ட நிலையில் இருப்பதைக் குறிக்கிறது; பெண்பால் ஒத்திசைவும் அடுத்துள்ள αὐτῆς என்பதும் இது பெண் கழுதை என்பதை வெளிப்படுத்துகின்றன.
- source_word: πῶλον μετ’ αὐτῆς
  choice: அதனுடன் ஒரு கழுதைக்குட்டி
  rationale: πῶλος பொதுவாக இளம் விலங்கைக் குறித்தாலும், இச்சூழலில் அது கழுதைக்குட்டி என்பது தெளிவு; μετ’ αὐτῆς உடனிருப்பதைக் குறிக்கிறது.
- source_word: λύσαντες ἀγάγετέ μοι
  choice: அவற்றை அவிழ்த்து என்னிடம் கொண்டுவாருங்கள்
  rationale: பங்கேற்பு வடிவமான λύσαντες முதலில் அவிழ்ப்பதையும், பன்மைக் கட்டளையான ἀγάγετε பின்னர் இரு விலங்குகளையும் கொண்டுவருவதையும் குறிக்கிறது; தமிழ் வினையெச்சத் தொடர் இந்த வரிசையை இயல்பாகப் பாதுகாக்கிறது.
