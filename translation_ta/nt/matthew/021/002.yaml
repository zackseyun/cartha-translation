translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. “பெண் கழுதை” என்பது கிரேக்கத்தின் பெண்பால் குறிப்பை வெளிப்படையாகக் காக்கிறது; “கழுதைக்குட்டி” என்பது சூழலால் உறுதியாகும் விலங்கு வகையைத் தெளிவாக்குகிறது.
