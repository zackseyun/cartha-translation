id: MAT.21.16
reference: Matthew 21:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἶπαν αὐτῷ· Ἀκούεις τί οὗτοι λέγουσιν; ὁ δὲ Ἰησοῦς λέγει αὐτοῖς· Ναί. οὐδέποτε ἀνέγνωτε ὅτι Ἐκ στόματος νηπίων καὶ θηλαζόντων κατηρτίσω αἶνον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/016.yaml
  text: And they said to him[a], “Do you hear what these are saying?” But Jesus says to them, “Yes. Have you never read, ‘Out of the mouth of infants and nursing babies you have prepared praise’?”
translation:
  language: ta
  text: அவர்கள் அவரிடம், “இவர்கள் சொல்வதைக் கேட்கிறீரா?” என்று கேட்டார்கள். ஆனால் இயேசு அவர்களிடம், “ஆம். ‘சிறு பிள்ளைகள் மற்றும் பால்குடிக்கும் குழந்தைகளின் வாயிலிருந்து புகழ்ச்சியை நீர் ஆயத்தப்படுத்தினீர்’[a] என்று நீங்கள் ஒருபோதும் வாசித்ததில்லையா?” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இயேசு சங்கீதம் 8:2-ஐ கிரேக்க வேதாகம மரபின்படி மேற்கோள் காட்டுகிறார். எபிரெய உரை பொதுவாக, “சிறு பிள்ளைகள் மற்றும் பால்குடிக்கும் குழந்தைகளின் வாயிலிருந்து வல்லமையை நிறுவினீர்” என்று மொழிபெயர்க்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀκούεις
  choice: கேட்கிறீரா
  rationale: நிகழ்கால நேரடிக் கேள்வியை இயல்பான மரியாதை ஒருமையில் தருகிறது; இயேசுவிடம் முன்வைக்கப்படும் சவாலையும் காக்கிறது.
- source_word: τί οὗτοι λέγουσιν
  choice: இவர்கள் சொல்வதை
  rationale: நிகழ்காலச் செயலை இயல்பாகக் காட்டுகிறது; οὗτοι என்பதற்கு கூடுதல் பெயர்ச்சொல் சேர்க்காமல் ‘இவர்கள்’ எனத் தருகிறது.
- source_word: λέγει
  choice: என்றார்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தைத் தமிழில் இயல்பான இறந்தகாலக் கதைநடையாக வழங்குகிறது; ‘பதிலளித்தார்’ என்ற விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: Ναί
  choice: ஆம்
  rationale: எளிய உறுதிப்படுத்தும் பதிலின் நேரடியான, கண்ணியமான தமிழ் வடிவம்.
- source_word: οὐδέποτε ἀνέγνωτε
  choice: நீங்கள் ஒருபோதும் வாசித்ததில்லையா
  rationale: வேதவசன அறிவைப் பற்றிய கண்டிக்கும் தொனியுடைய வினாவை இயல்பாகக் காக்கிறது.
- source_word: Ἐκ στόματος
  choice: வாயிலிருந்து
  rationale: ἐκ என்பதன் மூலத்திலிருந்து வெளிப்படும் கருத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: νηπίων
  choice: குழந்தைகள்
  rationale: மிக இளம் பிள்ளைகளைக் குறிக்கும் சொல்லைத் தமிழில் இயல்பாகத் தருகிறது; அடுத்துள்ள பால்குடிக்கும் பிள்ளைகளிலிருந்து ஓரளவு வேறுபாட்டைக் காக்கிறது.
- source_word: θηλαζόντων
  choice: பால்குடிக்கும் பிள்ளைகள்
  rationale: தாய்ப்பால் குடிக்கும் மிக இளம் பிள்ளைகள் என்ற உருவகத்தைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: κατηρτίσω
  choice: ஆயத்தப்படுத்தினீர்
  rationale: மத்தேயு மேற்கோளில் உள்ள ‘தயாரித்தல்/ஏற்படுத்துதல்’ பொருளைத் தருகிறது; எபிரெய வாசகத்திலுள்ள ‘வல்லமையை நிறுவினீர்’ என்பதோடு ஒத்திசைக்கவில்லை.
- source_word: αἶνον
  choice: புகழ்ச்சியை
  rationale: புகழ்தல் அல்லது புகழுரை என்ற பெயர்ச்சொல்லின் நேரடியான பொருளைத் தருகிறது.
theological_decisions:
- issue: சங்கீதம் 8:2 மேற்கோளின் வடிவம்
  choice: மத்தேயுவின் கிரேக்க வாசகத்தின்படி ‘புகழ்ச்சியை நீர் ஆயத்தப்படுத்தினீர்’ என்பதை முதன்மை உரையில் பயன்படுத்துதல்
  alternative: எபிரெய உரை அடிப்படையில் ‘வல்லமையை நிறுவினீர்’
  rationale: மத்தேயு மேற்கோளிடும் கிரேக்க வேதாகம மரபின் வாசகத்தையே அவர் முன்வைக்கும் வாதத்தின் வடிவமாக மொழிபெயர்க்க வேண்டும்; எபிரெய வாசகத்துடன் அமைதியாக ஒத்திசைக்கக் கூடாது. அறியப்பட்ட மாற்று வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. உரையாடலில் இயேசுவுக்கான மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் வரலாற்று நிகழ்காலம் தமிழின் இயல்பான கதைநடைக்காக இறந்தகாலமாக்கப்பட்டுள்ளது; மேற்கோளின் கிரேக்க-எபிரெய வேறுபாடு அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
