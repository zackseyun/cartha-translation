  source_fidelity: 'மூலக் கிரேக்கத்தின் கூறுகள் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன: οὖν என்பதற்கு ‘ஆகவே’, ὅταν ... ἔλθῃ என்பதற்கு எதிர்நோக்கிய நிகழ்வைக் குறிக்கும் ‘வரும்போது’, κύριος τοῦ ἀμπελῶνος என்பதற்கு சூழலுக்கேற்ற ‘திராட்சைத்தோட்டத்தின் உரிமையாளர்’, மற்றும் τοῖς γεωργοῖς ἐκείνοις என்பதற்கு ‘அந்த விவசாயிகளை’ ஆகியவை பொருத்தமானவை. தமிழில் வேற்றுமை உருபுடன் உள்ள ‘விவசாயிகளை’ என்பது இச்சூழலில் உரிமையாளர் அவர்கள்மீது எடுக்கும் நடவடிக்கையைக் கேட்கும் τί ποιήσει வினாவை நன்றாக வெளிப்படுத்துகிறது.'
