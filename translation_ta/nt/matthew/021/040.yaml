source:
  edition: SBLGNT
  text: ὅταν οὖν ἔλθῃ ὁ κύριος τοῦ ἀμπελῶνος, τί ποιήσει τοῖς γεωργοῖς ἐκείνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/040.yaml
  text: Therefore[a], when the owner of the vineyard comes[b], what will he do to those farmers?
translation:
  language: ta
  text: ஆகவே, திராட்சைத்தோட்டத்தின் உரிமையாளர்[a] வரும்போது, அந்த விவசாயிகளை[b] என்ன செய்வார்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘திராட்சைத்தோட்டத்தின் எஜமான்.’ கிரேக்கச் சொல் κύριος பல இடங்களில் ‘ஆண்டவர்’ என்று மொழிபெயர்க்கப்படுகிறது; ஆனால் இங்கு உவமையில் திராட்சைத்தோட்டத்தின் சொந்தக்காரரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘குத்தகை விவசாயிகளை.’ விரிவான உவமைச் சூழலில் இவர்கள் தோட்டத்தைக் குத்தகைக்கு எடுத்துப் பயிரிடுகிறவர்கள்; ஆனால் கிரேக்கச் சொல் பொதுவாக ‘விவசாயிகள்’ அல்லது ‘பயிரிடுகிறவர்கள்’ என்றே பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: வரும்போது
  rationale: ἔλθῃ என்பதுடன் சேர்ந்து, உவமையில் எதிர்பார்க்கப்படும் ஒரு நிகழ்வைச் சுட்டுகிறது; நவீன தமிழில் ‘வரும்போது’ இயல்பாக உள்ளது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய உவமை நிகழ்வுகளிலிருந்து இயேசுவின் கேள்விக்குச் செல்லும் முடிவுறுத்தும் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: κύριος
  choice: உரிமையாளர்
  rationale: இங்கு இது தெய்வீகப் பட்டமாக அல்லாமல், திராட்சைத்தோட்டத்தை உடையவரைக் குறிக்கிறது.
- source_word: ἀμπελῶνος
  choice: திராட்சைத்தோட்டத்தின்
  rationale: ἀμπελών என்பதற்கான இயல்பான, துல்லியமான தமிழ் இணை.
- source_word: τί ποιήσει
  choice: என்ன செய்வார்
  rationale: எதிர்காலத்தில் அந்த விவசாயிகள்மீது எடுக்கப்படும் நடவடிக்கையைப் பற்றிய நேரடியான கேள்வியாகத் தமிழில் இயல்பாக அமைகிறது.
- source_word: γεωργοῖς
  choice: விவசாயிகளை
  rationale: γεωργός என்பதன் பொதுவான பொருள் விவசாயி அல்லது பயிரிடுபவர்; குத்தகை உறவு இந்தச் சொல்லில் மட்டும் வெளிப்படாமல் உவமையின் விரிவான சூழலில் தெரிகிறது.
- source_word: ἐκείνοις
  choice: அந்த
  rationale: குறிப்பிட்ட விவசாயிகளைச் சுட்டும் கிரேக்கச் சுட்டுப்பெயரின் தனித்தன்மையையும் ஓரளவு விலகிய சுட்டுதலையும் காக்கிறது.
theological_decisions:
- issue: உவமைச் சூழலில் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: உரிமையாளர்
  alternative: எஜமான்; ஆண்டவர்
  rationale: இந்த வசனத்தின் கதை உலகில் κύριος என்பது திராட்சைத்தோட்டத்தின் சொந்தக்காரரைக் குறிக்கிறது. ‘ஆண்டவர்’ என்று மொழிபெயர்ப்பது இங்கு வெளிப்படையாக இல்லாத தெய்வீகப் பட்டப் பொருளை முன்னிறுத்தக்கூடும்; ‘உரிமையாளர்’ சூழலுக்கேற்ற நேரடிப் பொருளைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையில் மரியாதையும் இயல்பும் கொண்ட கேள்வி வடிவம் பயன்படுத்தப்பட்டுள்ளது. ‘அந்த’ என்பது ἐκείνοις தரும் குறிப்புத்தன்மையைப் பாதுகாக்கிறது.
