  terminology: ‘உரிமையாளர்’ என்பது இவ்வுவமைச் சூழலில் κύριος என்பதற்கான சரியான, இறையியல் பட்டப்பொருளைத் தேவையின்றி ஏற்றாத மொழிபெயர்ப்பு. ‘திராட்சைத்தோட்டம்’ மற்றும் ‘விவசாயிகள்’ ஆகியவை துல்லியமும் பொதுவாசகர் புரிதலும் கொண்டவை. அடிக்குறிப்புகள் முறையே உரிமையாளர் மற்றும் விவசாயிகள் என்ற சொற்களிலேயே சரியாக இணைக்கப்பட்டுள்ளன; குத்தகை என்பது சொல் மட்டுமல்ல, விரிவான உவமைச் சூழல் வழங்கும் விளக்கம் என்றும் அவை சரியாகக் குறிப்பிடுகின்றன.
