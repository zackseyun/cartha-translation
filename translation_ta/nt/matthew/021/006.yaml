  text: πορευθέντες δὲ οἱ μαθηταὶ καὶ ποιήσαντες καθὼς ⸀συνέταξεν αὐτοῖς ὁ Ἰησοῦς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/006.yaml
  text: So the disciples went and did just as Jesus had instructed them[a].
translation:
  language: ta
  text: அப்போது சீடர்கள் சென்று, இயேசு அவர்களுக்கு அறிவுறுத்தியபடியே செய்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுக்குக் கட்டளையிட்டபடியே.” இங்குள்ள கிரேக்க வினை கட்டளையிடுதல் அல்லது அறிவுறுத்துதல் என்ற பொருளைக் கொள்ளலாம்; இச்சூழலில் “அறிவுறுத்திய” என்பது பொருத்தமானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθέντες
  choice: போய்
  rationale: இறந்தகால வினையெச்சமாக வந்து முதன்மைச் செயலுக்கு முன் நிகழ்ந்த நகர்வைக் குறிக்கிறது; தமிழ்க் கதைநடையில் ‘போய்’ இயல்பானது.
- source_word: δὲ
  choice: ஆகவே
  rationale: முந்தைய வசனத்தில் இயேசு கொடுத்த அறிவுறுத்தலுக்கு சீடர்கள் அளித்த பதிலைத் தொடர்ச்சியாகக் காட்டுகிறது.
- source_word: οἱ μαθηταὶ
  choice: சீடர்கள்
  rationale: நற்செய்தி நூல்களின் சூழலில் இயேசுவைப் பின்பற்றுவோரைக் குறிக்கும் நிலையான, இயல்பான தமிழ் சொல்.
- source_word: ποιήσαντες
  choice: செய்தார்கள்
  rationale: καθὼς உடன் இணைந்து, தங்களுக்கு அளிக்கப்பட்ட அறிவுறுத்தலை அவர்கள் நிறைவேற்றியதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: καθὼς
  choice: படியே
  rationale: இயேசு கூறியதற்கு ஒத்தபடி துல்லியமாகச் செயல்பட்டார்கள் என்ற பொருத்த உணர்வைப் பாதுகாக்கிறது.
- source_word: συνέταξεν
  choice: கூறிய
  rationale: சூழலில் கொடுக்கப்பட்ட வழிமுறைகளை உள்ளடக்கும் இயல்பான சொல்லாக்கம்; கிரேக்க வினை கட்டளையிடுதல் என்ற வலுவான பொருளையும் கொள்ள முடியும் என்பதால் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: αὐτοῖς
  choice: தங்களுக்கு
  rationale: சீடர்களையே நோக்கி வழங்கப்பட்ட அறிவுறுத்தல் என்பதைத் தமிழில் இயல்பாகக் குறிக்கும் மறுபெயர்ச் சுட்டு.
- source_word: ὁ Ἰησοῦς
  choice: இயேசு
  rationale: கிரேக்க உரையின் எழுவாயான இயேசுவின் பெயரை வழக்கமான தமிழில் தருகிறது.
