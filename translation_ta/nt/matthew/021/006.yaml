    text: அல்லது, “அவர்களுக்குக் கட்டளையிட்டபடியே.” இங்குள்ள கிரேக்க வினை கட்டளையிடுதல் அல்லது அறிவுறுத்துதல் என்ற பொருளைக் கொள்ளலாம்; இச்சூழலில் “அறிவுறுத்திய” என்பது பொருத்தமானது.
