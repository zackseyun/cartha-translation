revisions:
- from: ஆலய வளாகத்தில்[a] பார்வையற்றவர்களும் நடக்க இயலாதவர்களும் அவரிடம் வந்தார்கள்; அவர் அவர்களைக் குணமாக்கினார்.
  to: ஆலய வளாகத்தில்[a] பார்வையற்றவர்களும் கால் ஊனமுற்றவர்களும் அவரிடம் வந்தார்கள்; அவர் அவர்களைக் குணமாக்கினார்.
  rationale: The revision narrows the rendering of χωλοί to leg/foot impairment while maintaining respectful modern Tamil. The footnote is adjusted to identify ἱερόν as the temple complex or courts, without implying an unspecified surrounding area beyond the precincts.
