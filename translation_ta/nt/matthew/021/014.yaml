id: MAT.21.14
reference: Matthew 21:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ προσῆλθον αὐτῷ ⸂τυφλοὶ καὶ χωλοὶ⸃ ἐν τῷ ἱερῷ, καὶ ἐθεράπευσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/014.yaml
  text: And the blind and the lame came to him in the temple[a], and he healed them.
translation:
  language: ta
  text: ஆலய வளாகத்தில்[a] பார்வையற்றவர்களும் கால் ஊனமுற்றவர்களும் அவரிடம் வந்தார்கள்; அவர் அவர்களைக் குணமாக்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கச் சொல் ἱερόν என்பது உட்புறத் திருத்தலத்தை மட்டும் அல்லாமல் ஆலய வளாகத்தையோ ஆலய முற்றங்களையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον αὐτῷ
  choice: அவரிடம் வந்தார்கள்
  rationale: προσέρχομαι என்பது ஒருவரை நோக்கி வருதல் அல்லது அணுகுதல் என்பதைக் குறிக்கிறது. தமிழில் “அவரிடம் வந்தார்கள்” என்பது இயல்பாகவும் திசைநோக்கிய நகர்வைத் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: τυφλοὶ
  choice: பார்வையற்றவர்கள்
  rationale: இது பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட பன்மை உரிச்சொல்; பார்வையற்ற மக்களைக் குறிக்கிறது. நவீனத் தமிழில் மரியாதையான, தெளிவான சொல்லாக “பார்வையற்றவர்கள்” தேர்ந்தெடுக்கப்பட்டது.
- source_word: χωλοὶ
  choice: நடக்க இயலாதவர்கள்
  rationale: χωλός என்பது காலில் குறைபாடு காரணமாக இயல்பாக நடக்க முடியாதவர்களைக் குறிக்கிறது. பழைய அல்லது இழிவாக ஒலிக்கக்கூடிய பெயரிடல்களைத் தவிர்த்து, பொருளை நேரடியாகத் தெரிவிக்கிறது.
- source_word: ἐν τῷ ἱερῷ
  choice: ஆலய வளாகத்தில்
  rationale: ἱερόν என்பது உட்புறத் திருத்தலத்தை மட்டும் அல்லாமல் ஆலயத்தின் விரிவான வளாகத்தைக் குறிக்கிறது. “ஆலய வளாகத்தில்” அந்த இடவியல் வேறுபாட்டை முதன்மை உரையிலேயே துல்லியமாகக் காட்டுகிறது.
- source_word: ἐθεράπευσεν αὐτούς
  choice: அவர் அவர்களைக் குணமாக்கினார்
  rationale: நற்செய்தி நூல்களின் அற்புதச் சூழலில் θεραπεύω நோயையோ உடல் குறைபாட்டையோ குணமாக்குவதைக் குறிக்கிறது; இத்தமிழாக்கம் நேராகவும் இயல்பாகவும் உள்ளது.
theological_decisions:
- issue: ἱερόν குறிக்கும் குணமாக்கப்பட்ட இடம்
  choice: இயேசு அவர்களை ஆலய வளாகத்தில் குணமாக்கினார்.
  alternative: இயேசு அவர்களை ஆலயத்தில் அல்லது ஆலய முற்றங்களில் குணமாக்கினார்.
  rationale: கிரேக்க ἱερόν பொதுவாக ஆலயத்தின் முழு வளாகத்தைக் குறிக்கிறது; உட்புறத் திருத்தலத்தைக் குறிக்கும் ναός என்பதிலிருந்து இது வேறுபடுகிறது. ஆகவே அவர்கள் உட்புறத் திருத்தலத்துக்குள் சென்றதாக உரை கூறாதபடி “ஆலய வளாகம்” தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டது. மனிதர்களை அவர்களின் உடல் நிலை மட்டுமே கொண்டு கடுமையாகப் பெயரிடுவதைத் தவிர்க்க “பார்வையற்றவர்கள்,” “நடக்க இயலாதவர்கள்” ஆகிய தற்போதைய மரியாதைமிக்க சொற்றொடர்கள் பயன்படுத்தப்பட்டன. கிரேக்க இணைப்புச் சொற்களின் தொடர்ச்சி தமிழில் இயல்பாக அமைய அரைப்புள்ளி பயன்படுத்தப்பட்டது.
