id: MAT.21.23
reference: Matthew 21:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ ἱερὸν προσῆλθον αὐτῷ διδάσκοντι οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ λέγοντες· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; καὶ τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/023.yaml
  text: And when he came into the temple[a], the chief priests and the elders of the people came up to him while he was teaching and said, “By what authority are you doing these things? And who gave you this authority?”
translation:
  language: ta
  text: அவர் ஆலயத்திற்கு[a] வந்து போதித்துக்கொண்டிருந்தபோது, தலைமை ஆசாரியர்களும் மக்களின் மூப்பர்களும் அவரிடம் வந்து, “நீர் எந்த அதிகாரத்தால் இவற்றைச் செய்கிறீர்? இந்த அதிகாரத்தை உமக்குக் கொடுத்தவர் யார்?” என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்குள்ள கிரேக்கச் சொல் ஆலயத்தின் உள் பரிசுத்த இடத்தை மட்டும் அல்ல, ஆலய வளாகத்தைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: அவர் ... வந்து ... கொண்டிருந்தபோது
  rationale: இந்த genitive absolute காலச் சூழலைக் குறிக்கிறது. தமிழில் அடுத்துள்ள நிகழ்வோடு இயல்பாக இணைக்க ‘வந்து போதித்துக்கொண்டிருந்தபோது’ என வழங்கப்பட்டது; வருகையும் தொடர்ந்து நடந்த போதனையும் தேவையின்றி மிகத் துல்லியமாகப் பிரிக்கவில்லை.
- source_word: ἱερὸν
  choice: ஆலயம்
  rationale: ἱερόν என்பது உள் பரிசுத்த அறையை மட்டும் அல்லாமல் ஆலய வளாகத்தைக் குறிக்கிறது. பொதுவாகப் புரியும் ‘ஆலயம்’ முதன்மை உரையில் வைக்கப்பட்டு, அதன் விரிவான பொருள் அடிக்குறிப்பில் தெளிவாக்கப்பட்டது.
- source_word: προσῆλθον αὐτῷ
  choice: அவரிடம் வந்து
  rationale: உடல்ரீதியாக அணுகிவந்த செயலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: διδάσκοντι
  choice: போதித்துக்கொண்டிருந்தபோது
  rationale: நிகழ்காலப் பங்கேற்புவினை, தலைவர்கள் அணுகிய சமயத்தில் போதனை நடந்துகொண்டிருந்ததைச் சுட்டுகிறது.
- source_word: οἱ ἀρχιερεῖς
  choice: முதன்மை ஆசாரியர்கள்
  rationale: இது ஒரே தலைமைக் குருவைக் குறிக்காமல், முன்னணி ஆசாரிய அதிகாரிகளைக் குறிக்கும் பன்மை. ‘முதன்மை ஆசாரியர்கள்’ அந்த வேறுபாட்டைக் காக்கிறது.
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: மக்களின் மூப்பர்கள்
  rationale: மக்களிடையே அங்கீகரிக்கப்பட்ட தலைவர்களை நேரடியாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: Ἐν ποίᾳ ἐξουσίᾳ
  choice: எந்த அதிகாரத்தால்
  rationale: இங்கு ἐξουσία என்பது செயலை மேற்கொள்ளும் சட்டப்பூர்வ அல்லது அங்கீகரிக்கப்பட்ட உரிமையைக் குறிக்கிறது. ‘எந்த அதிகாரத்தால்’ என்பது சவாலின் வலிமையை இயல்பாகக் காக்கிறது.
- source_word: ταῦτα ποιεῖς
  choice: இவற்றைச் செய்கிறீர்
  rationale: நேரடியாக எதிர்கொண்டு கேட்கப்படும் தற்போதைய செயல்களை மரியாதைப் பன்மையுடன் இயல்பாக வழங்குகிறது.
- source_word: τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην
  choice: இந்த அதிகாரத்தை உமக்குக் கொடுத்தவர் யார்?
  rationale: அதிகாரம் வழங்கப்பட்ட செயலைக் குறிக்கும் aorist-ஐ தமிழில் இயல்பான இறந்தகால வினையால் தருகிறது; கேள்வியின் கவனம் அதிகாரம் வழங்கிய நபர்மீது நீடிக்கிறது.
theological_decisions:
- issue: தலைவர்களின் சவாலில் ἐξουσία என்பதன் பொருள்
  choice: அதிகாரம்
  alternative: உரிமை; வல்லமை
  rationale: சூழல் வெறும் ஆற்றலைப் பற்றியதல்ல; இயேசு ஆலயத்தில் செய்தவற்றுக்கும் போதித்ததற்கும் யார் அங்கீகாரம் அளித்தார் என்பதே கேள்வி. ‘அதிகாரம்’ நிறுவனம் சார்ந்ததும் இறையியல் சார்ந்ததுமான அழுத்தத்தைத் தீர்மானித்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வேதாகம உரைக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவை நோக்கிய நேரடி உரையில் ‘நீர்/உமக்கு’ என்ற மரியாதை வடிவம் காக்கப்பட்டுள்ளது.
