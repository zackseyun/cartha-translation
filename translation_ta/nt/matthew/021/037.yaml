  source_fidelity: மூலக் கிரேக்கத்தின் காலத் தொடர்ச்சி (ὕστερον), மென்மையான திருப்பம் (δέ), அனுப்புதல், பெறுநர்கள், மற்றும் உரிமைச் சுட்டுகள் அனைத்தும் துல்லியமாகக் காக்கப்பட்டுள்ளன. Ἐντραπήσονται என்பதற்கு இச்சூழலில் பொருத்தமான ‘மதிப்பார்கள்’ வழங்கப்பட்டுள்ளது.
  naturalness: ‘ஆனால் பின்னர், … என்று சொல்லி, அவர் தம் மகனை அவர்களிடம் அனுப்பினார்’ என்பது நவீன தரத் தமிழில் தெளிவாகவும் கண்ணியமான கதைநடையுடனும் உள்ளது. மேற்கோளில் வெளிப்படையான எழுவாய் தேவையில்லை; வினைமுற்று அதை இயல்பாக உணர்த்துகிறது.
  terminology: ‘மகன்,’ ‘தம் மகன்,’ ‘என் மகன்,’ மற்றும் ‘மதிப்பார்கள்’ ஆகியவை மூலத்தின் கதைமுறை மற்றும் உறவுமொழியை தேவையற்ற இறையியல் அல்லது மரியாதை-அதிகப்படுத்தல் இன்றி காக்கின்றன. அடிக்குறிப்பு ‘மரியாதை காட்டுதல்’ மற்றும் வேறு சூழலிலுள்ள ‘வெட்கப்படுதல்’ என்ற சொற்பொருள் வாய்ப்பைச் சரியாகக் குறிப்பிடுகிறது.
