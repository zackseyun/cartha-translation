source:
  edition: SBLGNT
  text: ὕστερον δὲ ἀπέστειλεν πρὸς αὐτοὺς τὸν υἱὸν αὐτοῦ λέγων· Ἐντραπήσονται τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/037.yaml
  text: But later he sent his son to them[a], saying, ‘They will respect my son.’
translation:
  language: ta
  text: ஆனால் பின்னர், ‘என் மகனை மதிப்பார்கள்’ என்று சொல்லி, அவர் தம் மகனை அவர்களிடம் அனுப்பினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் மகனுக்கு மரியாதை காட்டுவார்கள்.” கிரேக்க வினைச்சொல் ஒருவரை மதித்தல் அல்லது அவருக்கு மரியாதை காட்டுதல் என்பதைக் குறிக்கலாம்; வேறு சூழல்களில் “வெட்கப்படுதல்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: பின்னர்
  rationale: கால வரிசையில் ‘பிறகு/பின்னர்’ என்பதைக் குறிக்கிறது. ‘இறுதியாக’ என்று மொழிபெயர்த்தால் மூலத்தில் இல்லாத வலுவான இறுதித்தன்மை சேரக்கூடும்.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய பணியாளர்களை அனுப்பிய நிகழ்விலிருந்து மகனை அனுப்பும் முக்கியமான திருப்பத்தைக் காட்டும் மென்மையான எதிர்மறைத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: ἀπέστειλεν
  choice: அனுப்பினார்
  rationale: தொழில்நுட்பமான அல்லது அப்போஸ்தலப் பொருளைச் சேர்க்காமல், அனுப்பும் செயலை இயல்பாகத் தெரிவிக்கிறது.
- source_word: πρὸς αὐτοὺς
  choice: அவர்களிடம்
  rationale: அனுப்புதல் வினையுடன் πρός மற்றும் வேற்றுமை உருபு, நபர்களை நோக்கிய திசையைக் குறிக்கிறது; தமிழில் ‘அவர்களிடம்’ இயல்பான இணை.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: தம் மகனை
  rationale: கதைமாந்தரின் சொந்த மகன் என்பதை இயல்பான தமிழில் காட்டுகிறது. ‘தம்’ என்பது எழுவாயாகிய உரிமையாளரையே சுட்டி, தேவையற்ற கூடுதல் வலியுறுத்தலைத் தவிர்க்கிறது.
- source_word: λέγων
  choice: என்று சொல்லி
  rationale: அனுப்பியவர் கூறிய கருத்தை அறிமுகப்படுத்தும் நிகழ்கால வினையெச்சத்தை இயல்பான தமிழ் தொடராக வழங்குகிறது.
- source_word: Ἐντραπήσονται
  choice: மதிப்பார்கள்
  rationale: இங்கு நேரடி செயப்படுபொருளான ‘என் மகனை’ உடன் வருவதால், மரியாதை அல்லது மதிப்பு காட்டுதல் என்பதே சூழலுக்கேற்ற பொருள். ‘வெட்கப்படுவார்கள்’ என்ற வேறு சாத்தியமான பொருளை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: τὸν υἱόν μου
  choice: என் மகனை
  rationale: பேசுபவருக்கும் மகனுக்கும் உள்ள தனிப்பட்ட உறவைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
theological_decisions:
- issue: உவமையிலுள்ள மகனை கிறிஸ்துவைக் குறிக்கும் விதத்தில் அளவுக்கு மீறி விளக்காமல் மொழிபெயர்த்தல்
  choice: தம் மகன் / என் மகன்
  alternative: தம் அன்பு மகன் / குமாரன்
  rationale: இந்த உவமை இயேசுவைச் சுட்டினாலும், இவ்வசனத்தில் ἀγαπητός (‘அன்புக்குரிய’) இல்லை; υἱός சாதாரணமாக ‘மகன்’ என வருகிறது. ஆகவே கிறிஸ்துவைப் பற்றிய உட்குறிப்பு சூழலிலிருந்து வெளிப்பட அனுமதித்து, மொழிபெயர்ப்பாளர் சேர்க்கையைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மதிப்பார்கள்’ என்பது இன்றைய இயல்பான சொல்; ‘மரியாதை காட்டுவார்கள்’ என்ற நெருக்கமான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு அது விளக்கும் கூற்றுக்குப் பின் வைக்கப்பட்டுள்ளது.
