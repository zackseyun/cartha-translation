  yaml_path: translation/nt/matthew/021/020.yaml
  text: And when the disciples saw it[a], they marveled, saying, “How did the fig tree wither immediately?”
translation:
  language: ta
  text: சீடர்கள் அதைக்[a] கண்டு வியந்து, “அத்திமரம் எப்படி உடனே காய்ந்துபோயிற்று?” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லை; சொல்லுக்கு நெருக்கமாக, “சீடர்கள் கண்டு” என்றும் மொழிபெயர்க்கலாம்.
    reason: source_ellipsis
lexical_decisions:
- source_word: ἰδόντες
  choice: அதைக் கண்டு
  rationale: இறந்தகால வினையெச்சம் தமிழில் இயல்பாக ‘கண்டு’ என மொழிபெயர்க்கப்படுகிறது. கிரேக்கத்தில் வெளிப்படையாக இல்லாத செயப்படுபொருள், முந்தைய சூழலில் கூறப்பட்ட அத்திமரத்தையோ அது பட்டுப்போன நிகழ்வையோ சுட்டும் வகையில் ‘அதை’ என நிரப்பப்பட்டுள்ளது.
- source_word: οἱ μαθηταὶ
  choice: சீடர்கள்
  rationale: μαθηταί என்பதற்கான இயல்பான, பரவலாகப் புரிந்துகொள்ளப்படும் தமிழ் வேதாகமச் சொல்.
- source_word: ἐθαύμασαν
  choice: வியந்து
  rationale: θαυμάζω இங்கு ஆச்சரியத்தையும் வியப்பையும் குறிக்கிறது; ‘வியந்து’ நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: λέγοντες
  choice: என்றார்கள்
  rationale: அவர்கள் கூறிய நேரடிக் கேள்வியைத் தொடர்ந்து வரும் தமிழின் இயல்பான மேற்கோள் அமைப்பு; கிரேக்க வினையெச்சத்தின் பேச்சுச் செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: Πῶς
  choice: எப்படி
  rationale: நிகழ்ந்த விதத்தைப் பற்றிய கேள்வியை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: παραχρῆμα
  choice: உடனே
  rationale: ‘உடனடியாக, அப்போதே’ என்ற காலப் பொருளை நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἐξηράνθη
  choice: பட்டுப்போயிற்று
  rationale: ஒரு மரம் உலர்ந்து உயிரற்றுப் போனதைத் தமிழில் இயல்பாகச் சுட்டுகிறது; கிரேக்கச் செயலப்பாட்டு வடிவத்தை செயற்கையாகப் பின்பற்றாமல் அதன் விளைவு நிலையைத் தருகிறது.
- source_word: ἡ συκῆ
  choice: அத்திமரம்
  rationale: συκῆ என்பது குறிப்பாக அத்திமரத்தைக் குறிக்கிறது; குறிப்புச் சுட்டி சூழலால் தமிழில் இயல்பாக வெளிப்படுகிறது.
