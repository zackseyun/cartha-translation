source:
  edition: SBLGNT
  text: τὸ βάπτισμα ⸀τὸ Ἰωάννου πόθεν ἦν; ἐξ οὐρανοῦ ἢ ἐξ ἀνθρώπων; οἱ δὲ διελογίζοντο ⸀ἐν ἑαυτοῖς λέγοντες· Ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ ἡμῖν· Διὰ τί οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/025.yaml
  text: The baptism of John—from where was it? From heaven or from men? And they were reasoning among themselves[a], saying, “If we say, ‘From heaven,’ he will say to us[b], ‘Why then did you not believe him?’”
translation:
  language: ta
  text: “யோவானின் திருமுழுக்கு எங்கிருந்து வந்தது? வானத்திலிருந்தா[a], மனிதர்களிடமிருந்தா[b]?” அவர்களோ தங்களுக்குள் ஆலோசித்துக்கொண்டு, “நாம், ‘வானத்திலிருந்து வந்தது’ என்று சொன்னால், அவர் நம்மிடம், ‘அப்படியானால் நீங்கள் ஏன் அவரை நம்பவில்லை?’ என்று சொல்வார்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளிடமிருந்து.” ‘வானத்திலிருந்து’ என்பது இறைமூலத்தைக் குறிக்கும் மரியாதைமிக்க சுற்றுவழக்கு.
    reason: lexical_alternative
  - marker: b
    text: ‘மனிதர்களிடமிருந்து’ என்பது ஆண்களை மட்டும் குறிக்காமல், மனிதர்களிடமிருந்து அல்லது வெறும் மனிதமூலத்திலிருந்து வந்தது என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: திருமுழுக்கு
  rationale: இச்சொல் இங்கு நடந்துகொண்டிருக்கும் செயலை மட்டும் அல்லாமல், யோவானோடு தொடர்புடைய திருமுழுக்குச் சடங்கு மற்றும் ஊழியத்தை மொத்தமாகக் குறிக்கிறது. ‘திருமுழுக்கு’ என்பது நவீனத் தமிழில் புரிந்துகொள்ளத்தக்க, மதிப்புமிக்க வழக்குச் சொல்.
- source_word: τὸ Ἰωάννου
  choice: யோவானின்
  rationale: மூலத்தின் உரிமை/தொடர்பு வேற்றுமையைச் சுருக்கமாகப் பாதுகாக்கிறது; யோவானோடு தொடர்புடைய திருமுழுக்கு என்பதைக் காட்டுகிறது.
- source_word: πόθεν ἦν
  choice: எங்கிருந்து வந்தது?
  rationale: πόθεν இடத்தை மட்டுமல்ல, தோற்றுவாயையும் அதிகாரத்தின் மூலத்தையும் கேட்கிறது. தமிழில் ‘எங்கிருந்து வந்தது?’ இயல்பாக அந்த மூலத்தைக் கேட்கிறது.
- source_word: ἐξ οὐρανοῦ
  choice: வானத்திலிருந்து
  rationale: ‘வானம்’ என்ற மூல உருவகத்தைத் தக்கவைத்து, அது இறைமூலத்தைக் குறிக்கும் மரியாதைமிக்க சுற்றுவழக்காகச் செயல்பட இடமளிக்கிறது.
- source_word: ἐξ ἀνθρώπων
  choice: மனிதர்களிடமிருந்து
  rationale: ἀνθρώπων என்பது ஆண்களை மட்டும் அல்லாமல் மனிதர்களைப் பொதுவாகக் குறிக்கிறது. இவ்வடிவம் வானத்திலிருந்து வந்த அதிகாரத்துக்கும் மனிதமூலத்துக்கும் உள்ள எதிர்மறையைத் தெளிவாகக் காட்டுகிறது.
- source_word: διελογίζοντο ἐν ἑαυτοῖς
  choice: தங்களுக்குள் ஆலோசித்துக்கொண்டு
  rationale: முற்றுப்பெறாத வினை தொடர்ந்த பரிசீலனையைக் காட்டுகிறது; ‘தங்களுக்குள்’ என்பது குழுவினரிடையேயான கலந்தாலோசனையை இயல்பான தமிழில் தருகிறது.
- source_word: Ἐὰν εἴπωμεν
  choice: நாம் … என்று சொன்னால்
  rationale: நிபந்தனை அமைப்பைத் தெளிவான, இயல்பான தமிழில் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἐρεῖ ἡμῖν
  choice: அவர் நம்மிடம் … என்று சொல்வார்
  rationale: மூலத்தில் உள்ள ‘சொல்வார்’ என்ற நேரடி பேச்சு அறிமுகத்தையும் எதிர்கால வினையையும் தக்கவைக்கிறது.
- source_word: Διὰ τί οὖν
  choice: அப்படியானால் … ஏன்
  rationale: οὖν காட்டும் முடிவுரீதியான, வாதரீதியான தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: நீங்கள் ஏன் அவரை நம்பவில்லை?
  rationale: πιστεύω + நான்காம் வேற்றுமை இங்கு யோவானையும் அவரது செய்தியையும் நம்பி ஏற்றுக்கொள்வதைக் குறிக்கிறது; ‘அவரை நம்பவில்லை’ அதனைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: ‘வானத்திலிருந்து’ என்பதன் இறையியல் பொருள்
  choice: முதன்மை உரையில் ‘வானத்திலிருந்து’ என்று வைத்தல்
  alternative: ‘கடவுளிடமிருந்து’
  rationale: இது இறைமூலத்தையும் இறைஅங்கீகாரத்தையும் குறிக்கும் மரியாதைமிக்க சுற்றுவழக்கு. ‘வானம்’ என்பதைப் பாதுகாப்பது மூலத்தின் உருவகத்தையும் கேள்வியின் கூர்மையான எதிர்மறையையும் தக்கவைக்கிறது; விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἀνθρώπων என்பதன் பாலினப் பரப்பு
  choice: ‘மனிதர்களிடமிருந்து’
  alternative: ‘மனிதரிடமிருந்து’ / ‘மக்களிடமிருந்து’
  rationale: இது ஆண்களை மட்டும் குறிக்கவில்லை; இறைமூலத்துக்கு மாறாக வெறும் மனிதமூலத்தைக் குறிக்கிறது. ஆகவே பாலினத் துல்லியமுள்ள பொதுப்பெயர் பயன்படுத்தப்பட்டது.
- issue: ‘யோவானின் திருமுழுக்கு’ என்ற தொடர்பின் பரப்பு
  choice: கிரேக்கத்தின் சுருக்கமான தொடர்பு வடிவத்தைத் தக்கவைத்தல்
  alternative: ‘யோவான் கொடுத்த திருமுழுக்கு’
  rationale: ‘யோவான் கொடுத்த’ என்பது சூழலில் சாத்தியமான விளக்கம் என்றாலும், மூலத்தில் genitive தொடர்பு மட்டும் உள்ளது. அதை விரிவாக்காமல் இருப்பது மூலத்தின் சுருக்கத்தையும் பரப்பையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. கேள்வியின் வாய்மொழித் தன்மைக்காக ‘வானத்திலிருந்தா, மனிதர்களிடமிருந்தா?’ என்ற இயல்பான இணை வடிவம் பயன்படுத்தப்பட்டுள்ளது. சூழலால் தேவைப்படும் பேச்சாளர் குறிப்பு (‘என்று கேட்டார்’) தமிழில் வாக்கியத்தை முழுமைப்படுத்துகிறது; அது முந்தைய வசனத்தில் பேசும் இயேசுவைக் குறிக்கிறது.
