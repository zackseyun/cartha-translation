id: MAT.21.15
reference: Matthew 21:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς τὰ θαυμάσια ἃ ἐποίησεν καὶ τοὺς παῖδας ⸀τοὺς κράζοντας ἐν τῷ ἱερῷ καὶ λέγοντας· Ὡσαννὰ τῷ υἱῷ Δαυίδ ἠγανάκτησαν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/015.yaml
  text: But when the chief priests and the scribes saw the wonderful things that he did[a], and the children crying out in the temple and saying[b], “Hosanna to the Son of David,” they were indignant.
translation:
  language: ta
  text: ஆனால் தலைமைக் குருக்களும் வேத அறிஞர்களும் அவர் செய்த வியத்தகு செயல்களையும், ஆலயத்தில்[a] “தாவீதின் மகனுக்கு ஓசன்னா![b]” என்று உரக்கக் கூவிக்கொண்டிருந்த குழந்தைகளையும் கண்டபோது, சினமடைந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘ஆலயம்’ என மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொல் (ἱερόν), உள் திருத்தலத்தை மட்டும் அல்லாமல் ஆலய வளாகம் முழுவதையும் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: ‘ஓசன்னா’ என்பது எபிரெய மொழியிலிருந்து வந்த முழக்கம். இதன் அடிப்படைப் பொருள் ‘காப்பாற்றும், தயவுசெய்து’ அல்லது ‘இப்போதே காப்பாற்றும்’ என்பதாகும்; ஆனால் இக்காலத்திற்குள் இது புகழ் முழக்கமாகவும் பயன்பட்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: கண்டபோது
  rationale: இறந்தகால வினையெச்சம் முதன்மை வினைக்கான காலச் சூழலைக் காட்டுகிறது; ‘கண்டபோது’ என்பது இதை இயல்பான தமிழில் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய நிகழ்வுக்கும் சமயத் தலைவர்களின் எதிர்வினைக்கும் இடையிலான மிதமான முரண்பாட்டைக் காட்டுகிறது.
- source_word: ἀρχιερεῖς
  choice: தலைமைக் குருக்கள்
  rationale: ஒரே பிரதான ஆசாரியரை அல்லாமல், அதிகாரம் பெற்ற முன்னணி குருக்களின் குழுவைக் குறிக்கும் பன்மைச் சொல்லாக இருப்பதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: γραμματεῖς
  choice: வேத அறிஞர்கள்
  rationale: திருவிவிலியச் சட்டத்தை நகலெடுத்து விளக்கிய நிபுணர்களைக் குறிக்கிறது; ‘வேத அறிஞர்கள்’ என்பது இன்றைய பொதுத் தமிழில் புரியக்கூடியதும் தேவையற்ற விரிவாக்கம் இல்லாததும் ஆகும்.
- source_word: τὰ θαυμάσια
  choice: வியத்தகு செயல்கள்
  rationale: குறிப்பிடத்தக்க, வியப்பூட்டும் செயல்களைப் பொதுவாகக் குறிக்கிறது; அவற்றை ‘அற்புதங்கள்’ என்று மட்டும் குறுக்கிவிடாமல் மூலத்தின் பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: ἐποίησεν
  choice: அவர் செய்த
  rationale: எளிய இறந்தகாலச் செயலை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: παῖδας
  choice: குழந்தைகள்
  rationale: இச்சூழலில் ‘ஊழியர்கள்’ என்பதைக் காட்டிலும் குழந்தைகளையே குறிக்கும் வாய்ப்பு மிகுதி; பாலினத்தைக் குறுக்காமல் மூலத்தின் பொதுவான பொருளைத் தக்கவைக்கிறது.
- source_word: κράζοντας
  choice: உரக்கக் கூவிக்கொண்டிருந்த
  rationale: பொதுவெளியில் எழுப்பப்பட்ட உரத்த வாழ்த்தொலியைத் தெரிவிக்கிறது; பகைமையைக் கட்டாயமாகச் சுட்டாது.
- source_word: ἐν τῷ ἱερῷ
  choice: ஆலயத்தில்
  rationale: தமிழில் இயல்பான சுருக்கமான மொழிபெயர்ப்பு; கிரேக்கச் சொல் உள் பரிசுத்த இடத்தை மட்டும் அல்லாமல் ஆலய வளாகத்தைக் குறிக்கக்கூடும் என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: λέγοντας
  choice: என்று
  rationale: குழந்தைகள் கூவிய சொற்களை தமிழில் இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: Ὡσαννὰ
  choice: ஓசன்னா
  rationale: இது இரட்சிப்புக்கான வேண்டுதலில் வேரூன்றியிருந்தாலும் இங்கு நிலைபெற்ற புகழ் முழக்கமாகவும் செயல்படுகிறது; ஒலிபெயர்ப்பு இரு நுணுக்கங்களையும் தக்கவைக்கிறது.
- source_word: τῷ υἱῷ Δαυίδ
  choice: தாவீதின் மகனுக்கு
  rationale: இடைவேற்றுமையை இயல்பான தமிழில் தருவதோடு, மத்தேயுவில் மேசியாவைக் குறிக்கும் பட்டத்தின் நேரடி வடிவத்தையும் பாதுகாக்கிறது.
- source_word: ἠγανάκτησαν
  choice: கடும் கோபமடைந்தார்கள்
  rationale: வெறும் வருத்தத்தைவிட வலுவான வெறுப்பும் சினமும் கலந்த எதிர்வினையை பொதுத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘தாவீதின் மகன்’ என்ற பட்டத்தின் மேசியா சார்ந்த முக்கியத்துவம்
  choice: தாவீதின் மகன்
  alternative: தாவீதின் வாரிசு
  rationale: மத்தேயுவில் அங்கீகரிக்கப்பட்ட மேசியாப் பட்டமாகச் செயல்படும் மூலச் சொற்றொடரை நேரடியாகத் தக்கவைக்கிறது; ‘வாரிசு’ என்று விளக்குவது அதன் குடும்பவழிப் படிமத்தைத் தேவையின்றி மாற்றும்.
- issue: Ὡσαννά என்பதன் வேண்டுதல் மற்றும் புகழ் முழக்கம் ஆகிய இரு பண்புகள்
  choice: முதன்மை உரையில் ‘ஓசன்னா’ என ஒலிபெயர்த்தல்
  alternative: காப்பாற்றும், வேண்டுகிறோம் / இப்போதே காப்பாற்றும்
  rationale: இந்தச் சொல் இரட்சிப்புக்கான வேண்டுதலில் தோன்றினாலும் இந்நிகழ்வில் புகழ் முழக்கமாகவும் உள்ளது. ஒலிபெயர்ப்பு இந்த இறையியல் மற்றும் வழிபாட்டு நெருக்கடியைத் தீர்த்துவிடாமல் பாதுகாக்கிறது; நேரடிப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆலயம்’, ‘ஓசன்னா’, ‘தாவீதின் மகன்’ ஆகிய மரபறிந்த சொற்கள் தக்கவைக்கப்பட்டுள்ளன; தேவையான பொருள் வேறுபாடுகள் அடிக்குறிப்புகளில் தெளிவுபடுத்தப்பட்டுள்ளன.
