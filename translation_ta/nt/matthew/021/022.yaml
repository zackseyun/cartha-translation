id: MAT.21.22
reference: Matthew 21:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ πάντα ὅσα ⸀ἂν αἰτήσητε ἐν τῇ προσευχῇ πιστεύοντες λήμψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/022.yaml
  text: And whatever you ask in prayer[a], believing[b], you will receive.
translation:
  language: ta
  text: மேலும், நீங்கள் ஜெபத்தில்[a] நம்பிக்கையோடு[b] கேட்பவை அனைத்தையும் பெற்றுக்கொள்வீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஜெபிக்கும்போது.’
    reason: இடத்தைக் குறிக்கும் சொற்றொடர் இங்கு ஜெபம் செய்யும் சூழலைக் குறிக்கிறது; வினை வடிவில் மொழிபெயர்ப்பதும் சாத்தியம்.
  - marker: b
    text: அல்லது, ‘நம்பியவாறு’; கிரேக்கப் பங்கேற்புவினை, கேட்கும்போதே நம்புவதைக் குறிக்கிறது.
    reason: மூலச் சொல்லின் பங்கேற்புவினைத் தன்மையையும், நம்பிக்கை ஜெபத்துடன் ஒரே நேரத்தில் இருப்பதையும் தெளிவுபடுத்துகிறது.
lexical_decisions:
- source_word: πάντα ὅσα
  choice: கேட்பவை அனைத்தையும்
  rationale: πᾶς உடன் ὅσος சேர்ந்துள்ள சொற்றொடர், கேட்கப்படும் அனைத்தையும் உள்ளடக்கும் விரிவான பொருளைத் தருகிறது. தமிழில் இயல்பாகவும் முழுமையான பரப்பைத் தெளிவாகவும் காட்ட இந்த வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἂν αἰτήσητε
  choice: நீங்கள் ... கேட்பவை
  rationale: ἄν உடன் வரும் இறந்தகாலத் துணைவினை வடிவம் வரையறுக்கப்படாத தொடர்புச் சொல்லமைப்பை உருவாக்குகிறது. தமிழில் ‘கேட்பவை’ என்பது தேவையற்ற ஐயப்பாட்டு நிழலைச் சேர்க்காமல் அந்தப் பொதுவான பொருளைத் தருகிறது.
- source_word: ἐν τῇ προσευχῇ
  choice: ஜெபத்தில்
  rationale: இது மூலத்தின் பெயர்ச்சொல் அமைப்பைத் தக்கவைத்துக்கொண்டு, தமிழில் வழக்கமான மற்றும் சுருக்கமான வெளிப்பாடாக உள்ளது.
- source_word: πιστεύοντες
  choice: நம்பிக்கையோடு
  rationale: நிகழ்காலப் பங்கேற்புவினை, கேட்பதோடு ஒரே நேரத்தில் உள்ள நம்பிக்கையைச் சுட்டுகிறது. ‘நம்பிக்கையோடு’ என்பது தமிழில் இயல்பாக இதை வெளிப்படுத்துகிறது; வெளிப்படையான நிபந்தனை வாக்கியமாக மாற்றுவதில்லை.
- source_word: λήμψεσθε
  choice: பெற்றுக்கொள்வீர்கள்
  rationale: எதிர்கால வினை வடிவத்தின் உறுதியான கூற்றை இயல்பான, கண்ணியமான தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ஜெபத்திற்கும் நம்பிக்கைக்கும் உள்ள தொடர்பு
  choice: ‘நம்பிக்கையோடு’ என்று பங்கேற்புவினையின் பொருளை வினையடைத் தன்மையில் வழங்குதல்
  alternative: ‘நீங்கள் நம்பினால்’ என்று வெளிப்படையான நிபந்தனையாக வழங்குதல்
  rationale: கிரேக்கத்தில் வெளிப்படையான நிபந்தனை வாக்கியம் இல்லை; பங்கேற்புவினையே உள்ளது. ஆகவே ஜெபத்தையும் நம்பிக்கையையும் இணைத்துக் காட்டி, பதிலளிக்கப்படும் ஜெபத்தின் விதிமுறை அல்லது எல்லை குறித்த இறையியல் விவாதத்தை மொழிபெயர்ப்பில் தீர்மானிக்காமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஜெபம்’ என்பது தமிழ் கிறிஸ்தவப் பயன்பாட்டில் பரவலாக அறியப்பட்ட சொல். வாக்கியத்தின் விரிவான வாக்குறுதியும் அதனுடன் இணைந்துள்ள நம்பிக்கையும் விளக்கத்தால் குறுக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
