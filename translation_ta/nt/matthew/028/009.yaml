  text: ⸀καὶ ⸀ἰδοὺ Ἰησοῦς ⸀ὑπήντησεν αὐταῖς λέγων· Χαίρετε· αἱ δὲ προσελθοῦσαι ἐκράτησαν αὐτοῦ τοὺς πόδας καὶ προσεκύνησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/009.yaml
  text: And behold[a], Jesus met them, saying, “Greetings!” And they came up, took hold of his feet[b], and worshiped him.
translation:
  language: ta
  text: இதோ, இயேசு அவர்களைச் சந்தித்து, “வாழ்த்துகள்![a]” என்றார். அவர்களோ அவரிடம் நெருங்கி வந்து, அவருடைய கால்களைப் பற்றிக்கொண்டு, அவரை வழிபட்டார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மகிழுங்கள்!” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் சொல்லுக்குச் சொல் பன்மை ஏவல் வடிவமாக இருந்தாலும், இங்கு அது ஒரு வாழ்த்துரையாகச் செயல்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: “அவர்முன் பணிந்து வணங்கினார்கள்” அல்லது “அவருக்கு மரியாதை செலுத்தினார்கள்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் பணிந்து வணங்குதல் அல்லது மரியாதை செலுத்துதல் என்பதைக் குறிக்கக்கூடும்; உயிர்த்தெழுதல் சூழலில் இங்கு ‘வழிபட்டார்கள்’ என்ற வலுவான பொருள் பொருத்தமாகத் தெரிகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து நிகழ்வை உயிரோட்டமாக அறிமுகப்படுத்தும் கிரேக்க உரையாடல் அடையாளத்தின் வலிமையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ὑπήντησεν
  choice: எதிர்கொண்டு
  rationale: வழியில் அவர்களை இயேசு சந்தித்தார் என்ற கருத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது; மூலத்தில் இல்லாத கூடுதல் திசைநுணுக்கத்தைச் சேர்ப்பதில்லை.
- source_word: Χαίρετε
  choice: வாழ்க!
  rationale: χαίρω என்பதன் பன்மை ஏவல் வடிவத்துக்கும், இச்சூழலில் அது வகிக்கும் வாழ்த்துரைக்கும் செயலுக்கும் இடையிலான தொடர்பைத் தக்கவைக்கும் சுருக்கமான, கண்ணியமான தமிழ் வாழ்த்து.
- source_word: προσελθοῦσαι
  choice: அவரிடம் நெருங்கி வந்து
  rationale: அடுத்த செயல்களுக்கு முன் பெண்கள் இயேசுவை நோக்கிச் சென்ற செயலையும் நிகழ்வுகளின் வரிசையையும் தெளிவாகக் காட்டுகிறது.
- source_word: ἐκράτησαν αὐτοῦ τοὺς πόδας
  choice: அவருடைய கால்களைப் பற்றிக்கொண்டு
  rationale: κρατέω குறிக்கும் உறுதியான உடல் தொடர்பை இயல்பான தமிழில் தெரிவிக்கிறது; ‘பிடித்துக்கொண்டார்கள்’ என்பதைக் காட்டிலும் இவ்வணக்கச் சூழலில் ‘பற்றிக்கொண்டு’ பொருத்தமாக உள்ளது.
- source_word: προσεκύνησαν αὐτῷ
  choice: அவரை வழிபட்டார்கள்
  rationale: உயிர்த்தெழுந்த இயேசுவை நோக்கிய இச்செயலின் சமயப் பொருள் வலிமையை வெளிப்படுத்துகிறது; அதேவேளையில் ‘பணிந்து வணங்கினார்கள்’ என்ற சொற்பொருள் வாய்ப்பை அடிக்குறிப்பில் தக்கவைக்கிறது.
theological_decisions:
- issue: உயிர்த்தெழுந்த இயேசுவை நோக்கிய προσκυνέω என்பதன் மொழிபெயர்ப்பு
  choice: அவரை வழிபட்டார்கள்
  alternative: அவர்முன் பணிந்து வணங்கினார்கள் / அவருக்கு மரியாதை செலுத்தினார்கள்
  rationale: உயிர்த்தெழுதல் சூழலும் மத்தேயுவின் கதையாடலில் இயேசுவுக்குக் கொடுக்கப்படும் இடமும் இச்செயலுக்கு வெறும் மரியாதையைவிட வலுவான சமயப் பொருள் இருப்பதை ஆதரிக்கின்றன. இருப்பினும், கிரேக்கச் சொல்லில் உடலால் பணிதல் அல்லது மரியாதை செலுத்துதல் என்ற பொருளும் இருக்கக்கூடும் என்பதால் அந்தத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ மூலத்தின் கவன ஈர்ப்பைத் தக்கவைக்கிறது. ‘வாழ்க’ சற்று உயர்ந்த நடையாயினும் இயல்பான வாழ்த்துரையாகவும் சொல்லின் நேர்ப்பொருளுடன் தொடர்புடையதாகவும் உள்ளது. மூலத்தில் உள்ள பெண்பால் பன்மை வடிவம் தமிழில் இயல்பாக ‘அவர்கள்’ என வருகிறது; முந்தைய வசனச் சூழல் குறிப்பிடும் பெண்களை இது குறிக்கிறது. அடிக்குறிப்பு குறிகள் விளக்கும் சொற்கள் அல்லது சொற்றொடர்களின் பின்னரே வைக்கப்பட்டுள்ளன.
