  rationale: ‘சந்தித்து’ என்பது ὑπήντησεν-க்கு நவீன தமிழில் துல்லியமான, நடுநிலையான மொழிபெயர்ப்பு. ‘வாழ்த்துகள்!’ என்பது χαίρετε-யின் சூழல்சார் வாழ்த்து செயல்பாட்டை இயல்பாக வெளிப்படுத்துகிறது; அதன் நேரடியான ‘மகிழுங்கள்’ வாய்ப்பு அடிக்குறிப்பில் உள்ளது. προσκυνέω-க்கு ‘வழிபட்டார்கள்’ முதன்மை வாசகமாகத் தக்கவைக்கப்பட்டு, பணிதல் அல்லது மரியாதை செலுத்துதல் என்ற மாற்று சொற்பொருள்களும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
