id: MAT.28.7
reference: Matthew 28:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ταχὺ πορευθεῖσαι εἴπατε τοῖς μαθηταῖς αὐτοῦ ὅτι Ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ ἰδοὺ προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν, ἐκεῖ αὐτὸν ὄψεσθε· ἰδοὺ εἶπον ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/007.yaml
  text: And go quickly and tell his disciples, ‘He has been raised from the dead, and look, he is going ahead of you into Galilee. There you will see him.’ Look, I have told you.
translation:
  language: ta
  text: விரைவாகப் போய் அவருடைய சீடர்களிடம், ‘அவர் இறந்தோரிலிருந்து எழுப்பப்பட்டார். இதோ, அவர் உங்களுக்கு முன்னே கலிலேயாவுக்குச் செல்கிறார்; அங்கே நீங்கள் அவரைக் காண்பீர்கள்’ என்று சொல்லுங்கள். இதோ, நான் உங்களுக்குச் சொல்லிவிட்டேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταχὺ πορευθεῖσαι εἴπατε
  choice: விரைவாகப் போய் … சொல்லுங்கள்
  rationale: பெண்பால் பன்மை வடிவம் சூழலில் பெண்களை நோக்கிக் கூறப்படுவதை உணர்த்தினாலும், தமிழில் பாலைக் குறிக்காமல் இயல்பான பன்மை ஏவலாக மொழிபெயர்க்கப்படுகிறது. போதலும் சொல்லுதலும் ஒன்றோடொன்று இணைந்த செயல்களாக வைக்கப்பட்டுள்ளன.
- source_word: Ἠγέρθη ἀπὸ τῶν νεκρῶν
  choice: அவர் இறந்தோரிலிருந்து எழுப்பப்பட்டார்
  rationale: கிரேக்க வினையின் இறந்தகாலச் செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது; அவரை எழுப்பியவர் யார் என்பதை மூலவாக்கியத்தைவிட வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் கிரேக்க உரையாடல் குறியீட்டை, அதன் இரு இடங்களிலும் ஒரே இயல்பான மற்றும் கண்ணியமான தமிழ்ச் சொல்லால் காட்டுகிறது.
- source_word: προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν
  choice: அவர் உங்களுக்கு முன்னே கலிலேயாவுக்குச் செல்கிறார்
  rationale: இயேசு சீடர்களுக்கு முன்பாகச் செல்வார் என்ற இடவியல் மற்றும் தொடர்பியல் பொருளைப் பாதுகாக்கிறது.
- source_word: ὄψεσθε
  choice: நீங்கள் அவரைக் காண்பீர்கள்
  rationale: எதிர்காலக் குறிப்பை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
theological_decisions:
- issue: உயிர்த்தெழுதலைச் செயப்பாட்டு வடிவில் கூறுதல்
  choice: எழுப்பப்பட்டார்
  alternative: உயிர்த்தெழுந்தார்
  rationale: Ἠγέρθη என்ற செயப்பாட்டு வடிவத்தின் மறைமுகச் செய்பவரையும் அதன் இறையியல் அழுத்தத்தையும் அழிக்காமல் காக்கிறது; அதே நேரத்தில் செய்பவர் ‘கடவுள்’ என்று மூலத்தில் இல்லாததை வெளிப்படையாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘இதோ’ என்ற சொல் இருமுறையும் வரும் மூலத்தின் வலியுறுத்தலைப் பாதுகாக்கிறது.
