id: MAT.28.11
reference: Matthew 28:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Πορευομένων δὲ αὐτῶν ἰδού τινες τῆς κουστωδίας ἐλθόντες εἰς τὴν πόλιν ἀπήγγειλαν τοῖς ἀρχιερεῦσιν ἅπαντα τὰ γενόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/011.yaml
  text: While they were going[a], behold[b], some of the guard came into the city and reported to the chief priests everything that had happened.
translation:
  language: ta
  text: அவர்கள் போய்க்கொண்டிருந்தபோது[a], இதோ[b], காவல் குழுவைச் சேர்ந்த சிலர் நகரத்திற்குள் வந்து, நடந்தவை அனைத்தையும் தலைமை ஆசாரியர்களிடம் தெரிவித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்கள் போய்க்கொண்டிருக்கையில்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் உள்ள வேற்றுமைத் தனிநிலைத் தொடர், அடுத்த நிகழ்வுக்கான காலப் பின்னணியை அமைக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “இதோ” என்பது கிரேக்க மொழியிலுள்ள ἰδού என்னும் கவன ஈர்ப்புச் சொல்லை மொழிபெயர்க்கிறது; கதையில் திடீரென அல்லது கவனிக்கத்தக்க விதத்தில் நிகழும் ஒரு திருப்பத்தை இது சுட்டிக்காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορευομένων δὲ αὐτῶν
  choice: அவர்கள் போய்க்கொண்டிருந்தபோது
  rationale: மரபுத்தொடர் வேற்றுமைத் தனிநிலை அமைப்பு அடுத்த நிகழ்வுக்கான காலப் பின்னணியைத் தருகிறது. அவர்கள் எங்கு போனார்கள் என்பதை மூலவாக்கியம் இங்கு குறிப்பிடாததால், இலக்கைச் சேர்க்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἰδού
  choice: இதோ
  rationale: கதையில் திடீரென அல்லது கவனிக்கத்தக்க விதத்தில் நிகழும் திருப்பத்தைக் காட்டும் கவன ஈர்ப்புச் சொல்லைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: τινες τῆς κουστωδίας
  choice: காவல் குழுவைச் சேர்ந்த சிலர்
  rationale: கல்லறையில் நிறுத்தப்பட்டிருந்த காவல் குழுவின் உறுப்பினர்களில் சிலரைக் குறிக்கிறது; அவர்களுடைய துல்லியமான நிர்வாக அல்லது இன அடையாளத்தைச் சேர்க்கவில்லை.
- source_word: ἐλθόντες εἰς τὴν πόλιν
  choice: நகரத்திற்குள் வந்து
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த துணைச் செயலை இயல்பான தமிழ் தொடர் வினையெச்சமாக வழங்குகிறது.
- source_word: ἀπήγγειλαν
  choice: தெரிவித்தார்கள்
  rationale: அதிகார நிலையில் இருந்தவர்களிடம் நிகழ்ந்தவற்றை அறிக்கையாகச் சொன்ன பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: தலைமைக் குருமார்களிடம்
  rationale: இரண்டாம் ஆலயக் கால யூத சமயத் தலைமையில் இருந்த ἀρχιερεῖς என்பவர்களுக்கான தெளிவான, வழக்கமான தமிழ் சொல்லாக்கம்.
- source_word: ἅπαντα τὰ γενόμενα
  choice: நடந்தவை அனைத்தையும்
  rationale: ἅπαντα காட்டும் முழுமையையும், நிகழ்ந்து முடிந்த சம்பவங்களைக் குறிக்கும் τὰ γενόμενα என்பதையும் சுருக்கமாகவும் இயல்பாகவும் பாதுகாக்கிறது.
