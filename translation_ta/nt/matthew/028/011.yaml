translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் காலப் பின்னணி, கவன ஈர்ப்பு, நிகழ்வுகளின் முழுமை ஆகியவை பாதுகாக்கப்பட்டுள்ளன; காவல் குழுவின் அடையாளம் அல்லது அவர்கள் சென்ற இடத்தின் இலக்கு குறித்து மூலத்தில் இல்லாத விவரம் சேர்க்கப்படவில்லை.
