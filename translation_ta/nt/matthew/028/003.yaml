base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/003.yaml
  text: His appearance was like lightning[a], and his clothing white as snow.
translation:
  language: ta
  text: அவருடைய தோற்றம் மின்னலைப் போல இருந்தது; அவருடைய உடை பனியைப் போல வெண்மையாக இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தோற்றம்’ என்பதற்கு மாற்றாக ‘வடிவம்’ அல்லது ‘புறத் தோற்றம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ ஒரு மென்மையான கதைத் தொடர்புச் சொல்; இயல்பான தமிழில் தனிச் சொல்லாகக் காட்டாமல் வாக்கியத் தொடரில் உணர்த்தலாம்.
- source_word: εἰδέα
  choice: தோற்றம்
  rationale: கண்ணுக்குப் புலப்படும் வெளிப்புறத் தோற்றத்தை இயல்பாகவும் துல்லியமாகவும் குறிக்கிறது; ‘வடிவம்’ என்பதும் சாத்தியம்.
- source_word: ὡς ἀστραπή
  choice: மின்னலைப் போல
  rationale: ὡς குறிக்கும் உவமையை இயல்பான நவீன தமிழில் பாதுகாக்கிறது.
- source_word: ἔνδυμα
  choice: உடை
  rationale: கிரேக்கம் குறிப்பிட்ட ஆடை வகையைக் கூறாததால், பொதுவானதும் இயல்பானதுமான சொல்லைத் தேர்ந்தெடுக்கிறது.
- source_word: λευκόν ὡς χιών
  choice: பனியைப் போல வெண்மையாக
  rationale: உடையின் வெண்மையைப் பனியுடன் ஒப்பிடும் உவமையை கூடுதல் தீவிரம் சேர்க்காமல் வழங்குகிறது.
theological_decisions:
- issue: αὐτοῦ என்பதன் குறிப்பு
  choice: ‘அவருடைய’ என்ற பிரதிப்பெயர் முந்தைய வசனத்தில் வரும் ஆண்டவருடைய தூதரைக் குறிக்கிறது; வசனத்தில் பெயர்ச்சொல்லைச் சேர்க்கவில்லை.
  alternative: உயிர்த்தெழுதல் பற்றிய விரிந்த சூழலால் இதை இயேசுவைக் குறிப்பதாக வாசகர் தவறாகப் புரிந்துகொள்ளக்கூடும்.
  rationale: உடனடி சூழலில் மிக அருகிலுள்ள முன்னிலைச் சொல் ஆண்டவருடைய தூதர் (28:2). இருப்பினும், கிரேக்கத்தைப் போலவே பிரதிப்பெயரை வைத்திருப்பது மூலத்தின் அமைப்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையான, கண்ணியமான நடை. இரு உவமைகளும் இணையான அமைப்பில் வைக்கப்பட்டுள்ளன. ‘அவருடைய’ என்பது மரியாதைப் பன்மை அல்ல; தூதரைக் குறிக்கும் இயல்பான உயர்திணை ஒருமை வடிவம்.
