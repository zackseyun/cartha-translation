id: MAT.28.20
reference: Matthew 28:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διδάσκοντες αὐτοὺς τηρεῖν πάντα ὅσα ἐνετειλάμην ὑμῖν· καὶ ἰδοὺ ἐγὼ μεθ’ ὑμῶν εἰμι πάσας τὰς ἡμέρας ἕως τῆς συντελείας τοῦ ⸀αἰῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/020.yaml
  text: teaching them to keep all that I commanded you. And behold[a], I am with you all the days, until the end of the age.
translation:
  language: ta
  text: நான் உங்களுக்குக் கட்டளையிட்ட அனைத்தையும் கடைப்பிடிக்க அவர்களுக்குக் கற்றுக்கொடுங்கள். இதோ, இக்காலம் நிறைவுபெறும் வரை[a], ஒவ்வொரு நாளும் நான் உங்களோடு இருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இக்காலம் முடியும் வரை.’ மரபுவழியாக, ‘உலகம் முடியும் வரை’ என்று மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கச் சொற்றொடர் பௌதிக உலகத்தைச் சிறப்பாகக் குறிப்பிடாமல், ஒரு காலத்தின் நிறைவைப் பற்றிப் பேசுகிறது.
    reason: ‘நிறைவு’ என்பதற்கான இயல்பான மாற்று மொழிபெயர்ப்பையும், ‘உலகம்’ என்ற மரபுவழி மொழிபெயர்ப்பு ஏற்படுத்தக்கூடிய தவறான புரிதலையும் விளக்குகிறது.
lexical_decisions:
- source_word: διδάσκοντες
  choice: கற்றுக்கொடுங்கள்
  rationale: முந்தைய வசனத்தின் சீடராக்கும் கட்டளையைத் தொடரும் கருத்தைத் தமிழில் இயல்பான கட்டளைத் தொடராக வெளிப்படுத்துகிறது.
- source_word: τηρεῖν
  choice: கடைப்பிடிக்க
  rationale: கட்டளைகளை வெறுமனே அறிந்திருப்பதல்லாமல், அவற்றைக் கவனமாகப் பின்பற்றி வாழும் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: πάντα ὅσα
  choice: அனைத்தையும்
  rationale: கிரேக்கத்தின் முழுமையான உள்ளடக்கத்தை இயல்பான, சுருக்கமான தமிழில் தெரிவிக்கிறது.
- source_word: ἐνετειλάμην
  choice: கட்டளையிட்ட
  rationale: இயேசுவின் அதிகாரமிக்க அறிவுறுத்தலை நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை வலியுறுத்தி ஈர்க்கும் உரையாடல் குறியீட்டையும் அதன் உயர்ந்த தொனியையும் இயல்பான தமிழில் தருகிறது.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: நான் உங்களோடு இருக்கிறேன்
  rationale: சீடர்களுடன் தொடரும் இயேசுவின் பிரசன்னத்தை நேரடியாகவும் தெளிவாகவும் கூறுகிறது.
- source_word: πάσας τὰς ἡμέρας
  choice: ஒவ்வொரு நாளும்
  rationale: சொல்லுக்கு சொல் ‘எல்லா நாட்களிலும்’ என்பதன் நாள்தோறும் தொடரும் உணர்வை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: συντελείας
  choice: நிறைவுபெறும்
  rationale: வெறும் திடீர் முடிவை மட்டுமல்லாமல், ஒரு காலம் அதன் நிர்ணயிக்கப்பட்ட நிறைவை அடைவதையும் உணர்த்துகிறது.
- source_word: αἰῶνος
  choice: இக்காலம்
  rationale: இங்கு குறிக்கப்படுவது பௌதிக உலகமல்ல, ஒரு காலப்பகுதி அல்லது யுகம் என்பதைக் காட்டுகிறது; ‘இக்காலம்’ பொதுவாசகருக்கு இயல்பாக உள்ளது.
theological_decisions:
- issue: ἕως τῆς συντελείας τοῦ αἰῶνος என்ற காலக்குறிப்பு
  choice: இக்காலம் நிறைவுபெறும் வரை
  alternative: இக்காலம் முடியும் வரை; உலகம் முடியும் வரை
  rationale: συντέλεια ஒரு நிறைவு அல்லது நிறைவடைதலைக் குறிக்கிறது; αἰών பௌதிக உலகத்தை அல்ல, காலத்தையோ யுகத்தையோ குறிக்கிறது. ஆகவே இறுதிக்கால நுட்பத்தைப் பாதுகாத்து, உலக அழிவைத் தேவையின்றி மொழிபெயர்ப்பில் புகுத்தாமல் உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகருக்குப் புரியும் வகையில் இயல்பாகவும், இயேசுவின் உறுதியான வாக்கின் கண்ணியமான தொனியைப் பாதுகாக்கும் வகையிலும் அமைக்கப்பட்டது. தனியாக வாசிக்கப்படும் வசனமாகத் தெளிவிருக்க, கிரேக்கப் பங்கேற்புவினை தமிழில் முந்தைய கட்டளையைத் தொடரும் கட்டளை வடிவில் வழங்கப்பட்டுள்ளது.
