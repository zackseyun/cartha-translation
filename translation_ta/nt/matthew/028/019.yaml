source:
  edition: SBLGNT
  text: πορευθέντες ⸀οὖν μαθητεύσατε πάντα τὰ ἔθνη, ⸀βαπτίζοντες αὐτοὺς εἰς τὸ ὄνομα τοῦ πατρὸς καὶ τοῦ υἱοῦ καὶ τοῦ ἁγίου πνεύματος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/019.yaml
  text: Therefore[a], go and make disciples of all the nations, baptizing them into the name of the Father and of the Son and of the Holy Spirit,
translation:
  language: ta
  text: ஆகவே, நீங்கள் போய் எல்லா மக்களினத்தாரையும் சீடர்களாக்குங்கள்; தந்தை, மகன், தூய ஆவியார் ஆகியோரின் பெயருக்குள்[a] அவர்களுக்குத் திருமுழுக்கு அளியுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பெயரில்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் ‘பெயருக்குள்’ என்று உள்ளது; இது ஓர் உறவுக்குள் அல்லது அடையாளத்திற்குள் வருவதை வலியுறுத்தக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: πορευθέντες
  choice: நீங்கள் போய்
  rationale: முதன்மைக் கட்டளைக்கு முன் வரும் இறந்தகாலப் பங்கேற்புவினை இச்சூழலில் கட்டளையுடன் இணைந்த செயலாக உள்ளது. ‘போன பின்பு’ என்ற இறுக்கமான வடிவத்தைவிட ‘நீங்கள் போய்’ என்பது தமிழில் இயல்பாகவும் அனுப்புதலின் வலிமையைப் பேணுவதாகவும் உள்ளது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வசனத்தில் இயேசு தமக்கு எல்லா அதிகாரமும் கொடுக்கப்பட்டிருப்பதாக அறிவித்ததிலிருந்து வரும் முடிவை இது தெளிவாகக் காட்டுகிறது.
- source_word: μαθητεύσατε
  choice: சீடர்களாக்குங்கள்
  rationale: ஒருவரைச் சீடராக ஆக்குதல் என்ற காரணவினைப் பொருளை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: πάντα τὰ ἔθνη
  choice: எல்லா மக்களினத்தாரையும்
  rationale: ἔθνη என்பதன் மக்கள்/இனக்குழுக்கள் சார்ந்த பரந்த பொருளை வெளிப்படுத்துகிறது; ‘யூதரல்லாதோர்’ என்று தேவையின்றிக் குறுக்கவில்லை.
- source_word: βαπτίζοντες
  choice: திருமுழுக்கு அளியுங்கள்
  rationale: நிறுவப்பட்ட கிறிஸ்தவச் சடங்கைக் குறிக்கும் தற்போதைய மரியாதையான சொல். செய்முறையைப் பற்றிய சமயப்பிரிவுச் சார்ந்த முடிவை மொழிபெயர்ப்பில் திணிக்காமல் இருக்க ‘அளியுங்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: εἰς τὸ ὄνομα
  choice: பெயருக்குள்
  rationale: εἰς என்பதன் ‘உள்ளே/உட்பட்டு’ என்ற திசை அல்லது நுழைவு நுணுக்கத்தைப் பேணி, உறவு அல்லது அடையாளத்திற்குள் வருவதைக் குறிக்கும் சாத்தியத்தைத் திறந்தவாறு வைக்கிறது.
- source_word: τοῦ πατρὸς
  choice: தந்தை
  rationale: இம்மும்மைச் சூத்திரத்தில் கடவுளைக் குறிக்கும் தனிப்பட்ட உறவுப்பெயராக இயல்பான நவீன தமிழில் வழங்கப்பட்டுள்ளது.
- source_word: τοῦ υἱοῦ
  choice: மகன்
  rationale: ‘தந்தை’ மற்றும் ‘தூய ஆவியார்’ என்பவற்றுடன் இணைந்த தெய்வீக உறவுப்பெயராக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: τοῦ ἁγίου πνεύματος
  choice: தூய ஆவியார்
  rationale: தெய்வீக ஆளைக் குறிக்கும் மரியாதையையும் தனிப்பட்ட குறிப்பையும் காக்கும் நவீனத் தமிழ் வடிவம்.
theological_decisions:
- issue: மும்மைத் திருமுழுக்குச் சூத்திரத்தில் εἰς என்பதன் மொழிபெயர்ப்பு
  choice: பெயருக்குள்
  alternative: பெயரில்
  rationale: கிரேக்க εἰς பொதுவாக உள்ளே செல்லும் இயக்கம் அல்லது உறவுக்குள் சேர்தலைக் குறிக்கக்கூடும். ‘பெயருக்குள்’ என்பது அந்த இறையியல் நுணுக்கத்தை ஒரு குறிப்பிட்ட திருமுழுக்குக் கோட்பாடாக விரிவாக்காமல் பேணுகிறது; இயல்பான பாரம்பரிய மாற்றாக ‘பெயரில்’ அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- issue: ஒருமை ‘பெயர்’ என்பதுடன் தந்தை, மகன், தூய ஆவியார் இணைக்கப்படுதல்
  choice: தந்தை, மகன், தூய ஆவியார் ஆகியோரின் பெயர்
  alternative: ஒவ்வொருவருக்கும் தனித்தனியாக ‘பெயர்கள்’ என்று வழங்குதல்
  rationale: மூன்று உறவுப்பெயர்கள் வரினும் மூலத்தில் ὄνομα ஒருமையில் உள்ளது. எனவே ஒருமை ‘பெயர்’ அப்படியே காக்கப்பட்டு, உரையின் மும்மைத் தெய்வீக அமைப்பு விரிவாக்கமின்றி வெளிப்படுத்தப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையைப் பயன்படுத்துகிறது. ‘பிதா/குமாரன்’ என்பவற்றுக்குப் பதிலாக இயல்பான ‘தந்தை/மகன்’ பயன்படுத்தப்பட்டுள்ளன. ‘தூய ஆவியார்’ தெய்வீக ஆளுக்குரிய மரியாதையைப் பேணுகிறது. மூலத்தின் பங்கேற்புவினைகளைத் தமிழில் இயல்பாக்குவதற்காக கட்டளைத் தொடர்களாக அமைத்தாலும், சீடர்களாக்குதல், சென்று சேருதல், திருமுழுக்கு அளித்தல் ஆகிய செயல்களின் தொடர்பு காக்கப்பட்டுள்ளது.
