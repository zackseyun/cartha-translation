translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘காதுக்கு எட்டுதல்’ என்பது செய்தி அதிகாரியின் கவனத்துக்கு வருவதை இயல்பாக வெளிப்படுத்துகிறது; இறுதிக் கூறு சூழலுக்கேற்ற வழக்குத் தமிழில் தரப்பட்டு, சொற்சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
