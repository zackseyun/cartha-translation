translation:
  language: ta
  text: இது ஆளுநரின் காதுக்கு எட்டினால்[a], நாங்கள் அவரை இணங்கச் செய்து, உங்களுக்கு எந்தச் சிக்கலும் ஏற்படாமல் பார்த்துக்கொள்வோம்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இது ஆளுநரின் கவனத்துக்கு வந்தால்.”
    reason: lexical_alternative
  - marker: b
    text: சொற்சொல்லாக, “உங்களைக் கவலையற்றவர்களாக ஆக்குவோம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκουσθῇ … ἐπὶ τοῦ ἡγεμόνος
  choice: ஆளுநரின் காதுக்கு எட்டினால்
  rationale: இந்தச் செய்தி ஆளுநருக்குத் தெரியவருவதைக் குறிக்கும் இயல்பான தமிழ் மரபுத்தொடர். கிரேக்கச் செயலப்பாட்டு வடிவத்தின் பொருளைத் தக்கவைத்தபடியே, தமிழில் தவறாகப் புரியக்கூடிய சொற்சொல் மொழிபெயர்ப்பைத் தவிர்க்கிறது.
- source_word: ἡγεμόνος
  choice: ஆளுநர்
  rationale: இச்சூழலில் ἡγεμών என்பது ரோம மாகாண ஆளுநரான பிலாத்துவைக் குறிக்கிறது; ‘ஆளுநர்’ துல்லியமும் இயல்பும் கொண்டது.
- source_word: πείσομεν αὐτόν
  choice: அவரை இணங்கச் செய்து
  rationale: πείθω என்பதன் அடிப்படைப் பொருளான ‘இணங்கச் செய்தல்/வற்புறுத்தி ஏற்கச் செய்தல்’ என்பதைக் காக்கிறது; அவரை எவ்வாறு இணங்கச் செய்வார்கள் என்பதை உரை கூறாததால் அதைக் கூடுதலாக விளக்கவில்லை.
- source_word: ὑμᾶς ἀμερίμνους ποιήσομεν
  choice: உங்களுக்கு எந்தச் சிக்கலும் ஏற்படாமல் பார்த்துக்கொள்வோம்
  rationale: சொற்சொல்லாக ‘உங்களைக் கவலையற்றவர்களாக்குவோம்’ என்றாலும், காவலர்கள் எதிர்கொள்ளக்கூடிய தண்டனை அல்லது அதிகாரப்பூர்வ நடவடிக்கை பற்றிய கவலையே சூழலில் உள்ளது. ஆகவே விளைவை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; நேரடியான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
