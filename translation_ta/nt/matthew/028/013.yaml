source:
  edition: SBLGNT
  text: λέγοντες· Εἴπατε ὅτι Οἱ μαθηταὶ αὐτοῦ νυκτὸς ἐλθόντες ἔκλεψαν αὐτὸν ἡμῶν κοιμωμένων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/013.yaml
  text: saying[a], “Say[b], ‘His disciples came by night and stole him while we were sleeping.’”
translation:
  language: ta
  text: “அவனுடைய சீடர்கள் இரவில்[a] வந்து, நாங்கள் தூங்கிக்கொண்டிருந்தபோது அவனை[b] திருடிக்கொண்டு போனார்கள் என்று சொல்லுங்கள்” என்று அவர்கள் கூறினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இரவு நேரத்தில்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் அவர்கள் வந்த நேரத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் ‘அவனை’ என்றே உள்ளது; ‘அவனுடைய உடலை’ என்று இல்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: என்று அவர்கள் கூறினார்கள்
  rationale: முந்தைய வாக்கியத்தின் செயலைத் தொடர்ந்து, அறிவுறுத்தலின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் நிகழ்காலப் பெயரெச்சம். தனி வசனமாகத் தமிழில் இயல்பாகப் படிக்க, இது வரையறை வினையாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: Εἴπατε
  choice: சொல்லுங்கள்
  rationale: இது இரண்டாம் நபர் பன்மை இறந்தகால ஏவல் வடிவம்; கட்டளையின் நேரடியான வலிமையைத் தெளிவாகக் காக்கிறது.
- source_word: ὅτι
  choice: என்று
  rationale: கூற வேண்டிய செய்தியை அறிமுகப்படுத்தும் இணைப்புச் சொல்; தமிழில் நேர்க் கூற்றின் முடிவில் வரும் ‘என்று’ இதன் பணியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Οἱ μαθηταὶ αὐτοῦ
  choice: அவனுடைய சீடர்கள்
  rationale: மூன்றாம் நபர் உரிமைத் தொடர்பை எளிய, இயல்பான தமிழில் வெளிப்படுத்துகிறது; மேற்கோளுக்குள் இயேசுவைப் பற்றிப் பேசும் குரலையும் காக்கிறது.
- source_word: νυκτὸς
  choice: இரவில்
  rationale: வருகையின் நேரத்தைக் குறிக்கும் வினையடைப் பயன்பாட்டிலுள்ள வேற்றுமை வடிவம்; ‘இரவில்’ என்பது சுருக்கமான இயல்பான தமிழ்.
- source_word: ἐλθόντες
  choice: வந்து
  rationale: முதன்மைச் செயலுக்கு முன்பான வருகையைக் குறிக்கும் இறந்தகாலப் பெயரெச்சம்; தமிழின் வினையெச்சத் தொடரில் வரிசை இயல்பாகக் காக்கப்படுகிறது.
- source_word: ἔκλεψαν
  choice: திருடிக்கொண்டு போனார்கள்
  rationale: மனிதரைத் ‘திருடினர்’ என்று மட்டும் சொல்வதைவிட, தமிழில் பொருளை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கும் சொற்றொடர்; திருட்டுச் செயலையே மையமாகக் காக்கிறது.
- source_word: αὐτὸν
  choice: அவனை
  rationale: கிரேக்கம் இயேசுவைக் குறிக்கும் ஆண்பால் ஒருமைச் சுட்டுப்பெயரையே பயன்படுத்துகிறது; ‘அவனுடைய உடலை’ என்ற விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: ἡμῶν κοιμωμένων
  choice: நாங்கள் தூங்கிக்கொண்டிருந்தபோது
  rationale: சூழ்நிலையைக் குறிக்கும் genitive absolute அமைப்பை, செயல் நிகழ்ந்த அதே நேரத்தைக் காட்டும் தெளிவான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: புனையப்பட்ட அறிக்கையில் αὐτόν என்பதன் குறிப்பு
  choice: ‘அவனை’ என்ற தனிநபர் சுட்டுப்பெயரைத் தக்கவைத்தல்
  alternative: ‘அவனுடைய உடலை’ என்று விளக்கி மொழிபெயர்த்தல்
  rationale: மூல உரை αὐτόν, ‘அவனை’ என்றே கூறுகிறது. ‘உடல்’ என்பதைச் சேர்ப்பது மூலத்தில் இல்லாத விளக்கமாகும்; யாரைக் குறிக்கிறது என்பதைச் சூழல் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியான கட்டளைத் தொனியுடனும் கண்ணியமான கதைநடை மொழியுடனும் வடிவமைக்கப்பட்டது. மேற்கோளுக்குள் வரும் ‘அவன்’ என்பது அறிக்கையைப் புனையச் சொல்பவர்களின் பேச்சுக் கோணத்தைப் பாதுகாக்கிறது.
