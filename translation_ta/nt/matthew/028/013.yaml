  source_fidelity: மூல கிரேக்கத்தின் கட்டளை வடிவம் (Εἴπατε), இரவிலான வருகை, ‘அவனை’ என்ற தனிப்பட்ட சுட்டுப்பெயர், மற்றும் ‘நாங்கள் தூங்கிக்கொண்டிருந்தபோது’ என்ற genitive absolute-இன் சூழ்நிலைப் பொருள் ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. ‘திருடிக்கொண்டு போனார்கள்’ என்பது κλέπτειν செயலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; புதிய விளக்கப் பொருளைச் சேர்ப்பதில்லை.
  naturalness: மேற்கோள் அமைப்பும் “என்று சொல்லுங்கள்” என்று அவர்கள் கூறினார்கள்” என்ற அறிமுகமும் நவீன நிலையான தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளன. ‘அவனுடைய சீடர்கள்’ என்பது மேற்கோளுக்குள் வரும் புனையப்பட்ட அறிக்கையின் பேச்சுக் கோணத்திற்கும் ஏற்றது.
  terminology: ‘சீடர்கள்,’ ‘இரவில்,’ ‘அவனை,’ மற்றும் ‘தூங்கிக்கொண்டிருந்தபோது’ ஆகிய தெரிவுகள் நிலையானவை. ‘அவனுடைய உடலை’ என விரிவுபடுத்தாமல் αὐτόν-இன் தனிப்பட்ட சுட்டுப்பெயர் காக்கப்பட்டுள்ளது; தொடர்புடைய அடிக்குறிப்பும் சரியானது.
