id: MAT.28.1
reference: Matthew 28:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὀψὲ δὲ σαββάτων, τῇ ἐπιφωσκούσῃ εἰς μίαν σαββάτων, ἦλθεν ⸀Μαριὰμ ἡ Μαγδαληνὴ καὶ ἡ ἄλλη Μαρία θεωρῆσαι τὸν τάφον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/001.yaml
  text: After the Sabbath[a], as it was dawning toward the first day of the week, Mary Magdalene and the other Mary came to look at the tomb.
translation:
  language: ta
  text: ஓய்வுநாளுக்குப் பிறகு[a], வாரத்தின் முதல் நாள் விடியத் தொடங்கியபோது, மகதலேனா மரியாளும் மற்ற மரியாளும் கல்லறையைப் பார்ப்பதற்காக வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஓய்வுநாளின் இறுதியில், வாரத்தின் முதல் நாள் விடியத் தொடங்கியபோது.” தொடக்கத்திலுள்ள கிரேக்கத் தொடரை “ஓய்வுநாளுக்குப் பிறகு” என்றோ “ஓய்வுநாளின் இறுதியில்” என்றோ புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὀψὲ δὲ σαββάτων
  choice: ஓய்வுநாளுக்குப் பிறகு
  rationale: ὀψέ + வேற்றுமை வடிவம் இங்கு ஓய்வுநாள் முடிந்த பிந்தைய நேரத்தைக் குறிக்கக்கூடும். σαββάτων இலக்கணத்தில் பன்மையாக இருந்தாலும், யூதக் கிரேக்க வழக்கில் ஒருமையான ஓய்வுநாளைக் குறிக்கிறது. δέ-யின் மெலிந்த இணைப்புப் பொருள் தமிழில் தனிச்சொல்லாக வெளிப்படுத்தப்படவில்லை.
- source_word: τῇ ἐπιφωσκούσῃ εἰς μίαν σαββάτων
  choice: வாரத்தின் முதல் நாள் விடியத் தொடங்கியபோது
  rationale: ἐπιφώσκω இச்சூழலில் வெளிச்சம் தோன்றி விடிவதைக் குறிக்கிறது; μίαν σαββάτων என்பது வாரத்தின் முதல் நாளைக் குறிக்கும் செமித்திய வழக்கு. இயல்பான தமிழில் காலநிலையும் நாள் குறிப்பும் ஒரே தொடராகத் தரப்பட்டுள்ளன.
- source_word: ἦλθεν
  choice: வந்தார்கள்
  rationale: ἔρχομαι என்பதன் இறந்தகாலச் செயலை ‘வந்தார்கள்’ இயல்பாகக் காட்டுகிறது. கிரேக்கத்தில் வினை ஒருமையாக இருந்தாலும், இணைக்கப்பட்ட இரு எழுவாய்களுக்கு நவீன தமிழில் பன்மை வினை இயல்பானது.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: மகதலேனா மரியாள்
  rationale: தமிழ் வேதாகமப் பெயர் மரபையும் தெளிவையும் பின்பற்றும் ஒலிபெயர்ப்பு.
- source_word: ἡ ἄλλη Μαρία
  choice: மற்ற மரியாள்
  rationale: ἄλλη என்பதன் வேறுபடுத்தும் பொருளை இயல்பாகவும் நேரடியாகவும் காட்டுகிறது.
- source_word: θεωρῆσαι
  choice: பார்ப்பதற்காக
  rationale: θεωρέω நோக்கத்துடன் பார்த்தல் அல்லது கவனித்தல் என்ற பொருளுடையது. ‘பார்ப்பதற்காக’ என்பது முறையான ஆய்வு செய்ததாக மிகைப்படுத்தாமல் அந்த நோக்கத்தைப் பாதுகாக்கிறது.
- source_word: τὸν τάφον
  choice: கல்லறையை
  rationale: τάφος இங்கு இயேசுவின் அடக்க இடத்தைக் குறிக்கிறது; ‘கல்லறை’ என்பது தெளிவான நவீனத் தமிழ் இணைச்சொல்.
theological_decisions:
- issue: உயிர்த்தெழுதல் நிகழ்வின் தொடக்கக் காலக் குறிப்பு
  choice: ஓய்வுநாள் முடிந்த பிறகு, வாரத்தின் முதல் நாள் விடியத் தொடங்கிய நேரம்
  alternative: ஓய்வுநாளின் இறுதியில், வாரத்தின் முதல் நாள் விடியத் தொடங்கிய நேரம்
  rationale: ὀψὲ σαββάτων என்ற கிரேக்கத் தொடர் ‘ஓய்வுநாளுக்குப் பிறகு’ என்றும் ‘ஓய்வுநாளின் இறுதியில்’ என்றும் புரிந்துகொள்ளப்படலாம். முதன்மை உரை அடுத்த காலக்குறிப்புடன் பொருந்தும் பொதுவான வாசிப்பை ஏற்கிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கத்தின் காலத் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
