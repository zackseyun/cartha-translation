id: MAT.28.15
reference: Matthew 28:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἱ δὲ λαβόντες ⸀τὰ ἀργύρια ἐποίησαν ὡς ἐδιδάχθησαν. Καὶ διεφημίσθη ὁ λόγος οὗτος παρὰ Ἰουδαίοις μέχρι τῆς σήμερον ⸀ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/015.yaml
  text: So they took the silver and did as they had been instructed[a]. And this story has been spread among the Jews to this day.
translation:
  language: ta
  text: அவர்கள் அந்த வெள்ளிப் பணத்தைப் பெற்றுக்கொண்டு, தங்களுக்கு அறிவுறுத்தப்பட்டபடியே செய்தார்கள். இந்தச் செய்தி[a] யூதர்களிடையே இன்றுவரை பரவியுள்ளது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தக் கூற்று” அல்லது “இந்த விவரம்.” λόγος என்ற கிரேக்கச் சொல் சூழலுக்கேற்ப “சொல்,” “செய்தி,” “விவரம்,” அல்லது “கதை” என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: பெற்றுக்கொண்டு
  rationale: முந்தைய வசனத்தில் பணம் அவர்களுக்குக் கொடுக்கப்பட்டதைத் தொடர்ந்து வரும் செயலை இயல்பாகக் காட்டுகிறது. ‘எடுத்துக்கொண்டு’ என்பதும் சாத்தியம்; ஆனால் இச்சூழலில் ‘பெற்றுக்கொண்டு’ தெளிவாக உள்ளது.
- source_word: τὰ ἀργύρια
  choice: அந்த வெள்ளிப் பணத்தை
  rationale: ἀργύρια என்பதன் வெள்ளி/பணம் என்ற பொருளைத் தக்கவைத்தபடி, ‘வெள்ளிக்காசுகள்’ என்று மூலத்தைவிடக் குறிப்பாக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: ἐποίησαν
  choice: செய்தார்கள்
  rationale: ποιέω என்பதன் பொதுவான ‘செய்’ என்ற பொருளையும், அடுத்து வரும் அறிவுறுத்தலோடு உள்ள நேரடித் தொடர்பையும் காக்கிறது.
- source_word: ὡς ἐδιδάχθησαν
  choice: தங்களுக்கு அறிவுறுத்தப்பட்டபடியே
  rationale: இங்கு என்ன சொல்ல வேண்டும் என்று வழிகாட்டப்பட்ட சூழல் இருப்பதால், ‘கற்பிக்கப்பட்டபடி’ என்பதைவிட ‘அறிவுறுத்தப்பட்டபடி’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: διεφημίσθη
  choice: பரவியுள்ளது
  rationale: ஒரு தகவல் பரவலாகச் சொல்லப்பட்டதையும், ‘இன்றுவரை’ என்ற தொடரும் விளைவையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὁ λόγος οὗτος
  choice: இந்தச் செய்தி
  rationale: λόγος இங்கு காவலர்கள் பரப்பிய தகவல் அல்லது விவரிப்பைக் குறிக்கிறது. ‘செய்தி’ என்பது நடுநிலையான, இயல்பான தேர்வு; மூலச்சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் சுட்டப்படுகிறது.
- source_word: παρὰ Ἰουδαίοις
  choice: யூதர்களிடையே
  rationale: παρά + dative இங்கு ஒரு சமூகத்தின் மத்தியில் பரவியதைக் குறிக்கிறது. வசனத்தின் கதைச்சூழலைத் தாண்டிய பொதுவான குற்றச்சாட்டை உருவாக்காமல் நேரடியாக மொழிபெயர்க்கிறது.
- source_word: μέχρι τῆς σήμερον ἡμέρας
  choice: இன்றுவரை
  rationale: எழுத்தாளரின் காலம்வரை நிலைத்திருந்ததைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கும் தமிழ் வழக்கு.
theological_decisions:
- issue: Ἰουδαίοις என்ற சொல்லை எதிர்மறையான பொதுமைப்படுத்தலாக ஒலிக்காமல் கதைச்சூழலில் மொழிபெயர்த்தல்
  choice: யூதர்களிடையே
  alternative: யூத மக்களிடையே; யூதேயர்களிடையே
  rationale: இவ்வசனம் அந்தச் செய்தி யூதச் சமூகத்தில் பரவியதைக் கூறுகிறது. ‘யூதர்களிடையே’ என்பது நேரடியான பொருளைத் தருகிறது; ‘யூதேயர்களிடையே’ என்பது இங்கு தேவையற்ற புவியியல் வரையறையைச் சேர்க்கலாம். மொழிபெயர்ப்பு மத்தேயுவின் கதைச்சூழலைத் தாண்டிய தீர்ப்பைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘வெள்ளிப் பணம்’ மூலத்தின் பொருளைத் தக்கவைத்து, நாணய வகையைத் தேவையின்றி குறிப்பாக்குவதைத் தவிர்க்கிறது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘செய்தி’ என்ற சொல்லுக்குப் பிறகு வைக்கப்பட்டுள்ளது.
