id: MAT.28.2
reference: Matthew 28:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ σεισμὸς ἐγένετο μέγας· ἄγγελος γὰρ κυρίου καταβὰς ἐξ οὐρανοῦ ⸀καὶ προσελθὼν ἀπεκύλισε τὸν ⸀λίθον καὶ ἐκάθητο ἐπάνω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/002.yaml
  text: And behold, there was a great earthquake, for an angel of the Lord had come down from heaven and came up and rolled away the stone and was sitting on it.
translation:
  language: ta
  text: இதோ, பெரும் நிலநடுக்கம் ஏற்பட்டது; ஏனெனில், ஆண்டவரின் தூதர் ஒருவர் வானத்திலிருந்து இறங்கி வந்து, கல்லின் அருகே சென்று அதை உருட்டி அகற்றி, அதன்மேல் உட்கார்ந்திருந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் மூலமொழியின் உரையாடல் குறியீட்டை இயல்பாகவும் நேரடியாகவும் தக்கவைக்கிறது.
- source_word: σεισμὸς ... μέγας
  choice: பெரும் நிலநடுக்கம்
  rationale: σεισμός என்பதன் சூழலுக்குரிய பொருளையும் μέγας தரும் வலிமையையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἄγγελος ... κυρίου
  choice: ஆண்டவரின் தூதர் ஒருவர்
  rationale: ἄγγελος என்பதற்கு ‘தூதர்’ என்றும், பெயர்ச்சொல்லுக்கு முன் உருபு இல்லாததை இயல்பான தமிழில் ‘ஒருவர்’ என்றும் வழங்குகிறது; κυρίου என்பதை பொதுவான மரியாதைமிக்க ‘ஆண்டவர்’ என மொழிபெயர்க்கிறது.
- source_word: προσελθὼν
  choice: கல்லின் அருகே சென்று
  rationale: ‘அணுகி/அருகே சென்று’ என்ற மூலப்பொருளைச் சூழலில் தெளிவாக்குகிறது; ‘மேலே வந்து’ என்ற ஆதாரமற்ற திசைப்பொருளைத் தவிர்க்கிறது.
- source_word: ἀπεκύλισε
  choice: உருட்டித் தள்ளி
  rationale: கல்லை உருட்டி அகற்றிய செயலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἐκάθητο
  choice: உட்கார்ந்திருந்தார்
  rationale: இறந்தகாலத்தில் தொடர்ந்த நிலையைக் குறிக்கும் imperfect வடிவத்தின் நுணுக்கத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: κυρίου என்பதன் குறிப்பு
  choice: ஆண்டவர்
  alternative: கர்த்தர்
  rationale: கிரேக்க உரை இங்கு தனிப்பட்ட பெயரைப் பயன்படுத்தாமல் κύριος எனக் கூறுவதால், அதைக் குறிப்பிட்ட தெய்வீகப் பெயராக மாற்றாமல் பொதுவான மரியாதைத் தலைப்பாக வழங்குகிறது.
- issue: தூதருக்கான மரியாதை வினைமுற்று
  choice: உட்கார்ந்திருந்தார்
  alternative: உட்கார்ந்திருந்தான்
  rationale: தமிழின் இயல்பான மரியாதை நடையைப் பின்பற்றுகிறது; தூதரின் இயல்பைப் பற்றிய கூடுதல் கோட்பாட்டைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. கிரேக்க வாக்கியத்தின் காரணத் தொடர்பு ‘ஏனெனில்’ மூலம் தக்கவைக்கப்பட்டுள்ளது; தொடர்ச்சியான பங்கேற்பு வினைகள் தமிழில் இயல்பான செயல்வரிசையாக வழங்கப்பட்டுள்ளன.
