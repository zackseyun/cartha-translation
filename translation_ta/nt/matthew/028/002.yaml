- from: இதோ, பெரும் நிலநடுக்கம் ஏற்பட்டது. ஏனெனில், ஆண்டவரின் தூதர் ஒருவர் வானத்திலிருந்து இறங்கி வந்து, கல்லின் அருகே சென்று அதை உருட்டித் தள்ளி, அதன்மேல் உட்கார்ந்திருந்தார்.
  to: இதோ, பெரும் நிலநடுக்கம் ஏற்பட்டது; ஏனெனில், ஆண்டவரின் தூதர் ஒருவர் வானத்திலிருந்து இறங்கி வந்து, கல்லின் அருகே சென்று அதை உருட்டி அகற்றி, அதன்மேல் உட்கார்ந்திருந்தார்.
  rationale: 'The revision makes only safe stylistic and lexical adjustments: it restores the explicit γάρ causal linkage within one Tamil sentence and renders the rolling-away action more directly. It retains the draft’s source-faithful treatment of the angel’s descent, approach, and ongoing seated posture.'
