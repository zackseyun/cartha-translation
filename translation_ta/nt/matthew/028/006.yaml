id: MAT.28.6
reference: Matthew 28:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐκ ἔστιν ὧδε, ἠγέρθη γὰρ καθὼς εἶπεν· δεῦτε ἴδετε τὸν τόπον ὅπου ⸀ἔκειτο·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/006.yaml
  text: He is not here[a], for he has been raised, just as he said. Come[b], see the place where he was lying.
translation:
  language: ta
  text: அவர் இங்கே இல்லை; ஏனெனில், அவர் சொன்னபடியே உயிர்த்தெழுப்பப்பட்டார்.[a] வாருங்கள், அவர் கிடந்த இடத்தைப் பாருங்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உயிர்த்தெழுந்தார்.” கிரேக்க வினைச்சொல் செயப்பாட்டு வடிவில், “உயிர்த்தெழுப்பப்பட்டார்” என்று உள்ளது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “அவர் வைக்கப்பட்டிருந்த இடத்தை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔστιν ὧδε
  choice: அவர் இங்கே இல்லை
  rationale: தெளிவாகக் குறிப்பிடப்படும் இயேசுவைத் தமிழில் இயல்பாகச் சுட்டுவதற்காக ‘அவர்’ சேர்க்கப்பட்டுள்ளது; ὧδε என்பதற்கு ‘இங்கே’ என்பது நேர்த்தியான இடச்சுட்டுச் சொல்.
- source_word: ἠγέρθη
  choice: உயிர்த்தெழுப்பப்பட்டார்
  rationale: ἐγείρω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவத்தைப் பாதுகாத்து, இயேசு மரணத்திலிருந்து எழுப்பப்பட்ட நிகழ்வை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முன் கூறிய ‘அவர் இங்கே இல்லை’ என்பதற்கான காரணத்தை γάρ அறிமுகப்படுத்துகிறது.
- source_word: καθὼς εἶπεν
  choice: அவர் சொன்னபடியே
  rationale: இயேசு முன்பு கூறியதற்கும் நிகழ்ந்ததற்கும் உள்ள துல்லியமான ஒத்திசைவை καθώς தெரிவிக்கிறது.
- source_word: δεῦτε
  choice: வாருங்கள்
  rationale: இது பலரிடம் சொல்லப்படும் அழைப்பு அல்லது கட்டளை; மரியாதையும் பன்மையும் கொண்ட ‘வாருங்கள்’ நவீனத் தமிழில் இயல்பாக உள்ளது.
- source_word: ἴδετε
  choice: பாருங்கள்
  rationale: அந்த இடத்தை நேரடியாக வந்து கவனிக்கும்படி கூறும் பன்மைக் கட்டளையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὸν τόπον
  choice: இடத்தை
  rationale: கல்லறைக்குள் உடல் இருந்த குறிப்பிட்ட இடத்தை τόπος குறிக்கிறது; ‘இடம்’ தெளிவான பொதுநடைத் தேர்வு.
- source_word: ὅπου ἔκειτο
  choice: அவர் கிடந்த
  rationale: κεῖμαι என்பதன் நிலைசார் பொருளையும், அந்த இடத்தில் உடல் கிடந்திருந்ததையும் தேவையற்ற செயற்பாட்டாளரைச் சேர்க்காமல் தெரிவிக்கிறது.
theological_decisions:
- issue: உயிர்த்தெழுதலில் வினைக்குரலும் செயற்பாட்டாளரும்
  choice: உயிர்த்தெழுப்பப்பட்டார்
  alternative: உயிர்த்தெழுந்தார்
  rationale: ἠγέρθη இலக்கண வடிவில் செயப்பாட்டுவினையாக இருப்பதால் அதை முதன்மை உரையில் பாதுகாக்கிறது. யார் எழுப்பினார் என்பதை இவ்வசனம் வெளிப்படையாகக் குறிப்பிடாததால், மொழிபெயர்ப்பிலும் செயற்பாட்டாளர் சேர்க்கப்படவில்லை.
- issue: கல்லறையில் இயேசுவின் உடல் இருந்த நிலை
  choice: அவர் கிடந்த இடம்
  alternative: அவர் வைக்கப்பட்டிருந்த இடம்
  rationale: ἔκειτο முதன்மையாக இருந்த அல்லது கிடந்த நிலையைக் குறிக்கிறது; ‘வைக்கப்பட்டிருந்த’ என்பது முன்பு நிகழ்ந்த வைக்கும் செயலை இன்னும் வெளிப்படையாக்கும் சாத்தியமான விளக்கம்.
translation_notes:
  register: நவீனத் தரமான, பொதுமக்களுக்கு எளிதில் புரியும் கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘வாருங்கள்’, ‘பாருங்கள்’ ஆகியவை மூலத்தின் பன்மைக் கட்டளைகளை இயல்பாகப் பாதுகாக்கின்றன; பாரம்பரியத்தில் வழக்கமான செயவினை வடிவுக்குப் பதிலாக கிரேக்கத்தின் செயப்பாட்டு வடிவு முதன்மை உரையில் தக்கவைக்கப்பட்டுள்ளது.
