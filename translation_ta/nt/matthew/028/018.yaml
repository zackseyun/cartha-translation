source:
  edition: SBLGNT
  text: καὶ προσελθὼν ὁ Ἰησοῦς ἐλάλησεν αὐτοῖς λέγων· Ἐδόθη μοι πᾶσα ἐξουσία ἐν οὐρανῷ καὶ ἐπὶ ⸀τῆς γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/018.yaml
  text: And Jesus came near and spoke to them[a], saying[b], “All authority in heaven and on earth has been given to me.”
translation:
  language: ta
  text: 'இயேசு அவர்களிடம் நெருங்கிவந்து இவ்வாறு பேசினார்: “வானத்திலும் பூமியிலும் உள்ள எல்லா அதிகாரமும்[b] எனக்குக் கொடுக்கப்பட்டிருக்கிறது[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்குக் கொடுக்கப்பட்டது.” கிரேக்க ஆரிஸ்ட் செயப்பாட்டு வினையை இவ்வாறு இன்னும் நேரடியாக மொழிபெயர்க்கலாம்; முதன்மைப் பாடம் முடிந்த செயலின் தற்போதைய விளைவைத் தெரிவிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எல்லா வல்லமையும்.” எனினும், கிரேக்கச் சொல் வெறும் ஆற்றலைவிட அதிகாரம், உரிமை அல்லது ஆளும் உரிமையைத் துல்லியமாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: நெருங்கிவந்து
  rationale: இயேசு சீடர்களை நோக்கி வந்து அருகில் சேர்ந்த இடமாற்றத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐλάλησεν αὐτοῖς λέγων
  choice: அவர்களிடம் இவ்வாறு பேசினார்
  rationale: ‘பேசினார்’ என்பது ἐλάλησεν என்பதையும், ‘இவ்வாறு’ என்பது நேரடிக் கூற்றை அறிமுகப்படுத்தும் λέγων என்பதையும் இயல்பான தமிழில் இணைத்துக் காட்டுகிறது.
- source_word: Ἐδόθη μοι
  choice: எனக்குக் கொடுக்கப்பட்டிருக்கிறது
  rationale: இறந்தகாலச் செயப்பாட்டு வினையான Ἐδόθη, நிறைவுபெற்ற கொடுக்கும் செயலையும் அதன் தற்போதைய விளைவாக இயேசுவிடம் அதிகாரம் இருப்பதையும் இவ்வடிவம் தெரிவிக்கிறது; செயப்பாட்டு அமைப்பும் பாதுகாக்கப்படுகிறது.
- source_word: πᾶσα ἐξουσία
  choice: எல்லா அதிகாரமும்
  rationale: ஒருமை கருத்துப்பெயருடன் வரும் πᾶσα முழுமையைக் குறிக்கிறது. ἐξουσία வெறும் வல்லமையைவிட உரிமையுள்ள ஆளுகை அல்லது அதிகாரத்தைக் குறிக்கிறது.
- source_word: ἐν οὐρανῷ καὶ ἐπὶ τῆς γῆς
  choice: வானத்திலும் பூமியிலும் உள்ள
  rationale: வானம் மற்றும் பூமி ஆகிய இரு முழு ஆட்சித்தளங்களிலும் பொருந்தும் அதிகாரம் என்பதை இயல்பான இணை அமைப்பில் தெரிவிக்கிறது.
theological_decisions:
- issue: இயேசுவின் அனைத்துலக அதிகாரம் அவருக்குக் கொடுக்கப்பட்டதாகக் கூறப்படுதல்
  choice: எல்லா அதிகாரமும் எனக்குக் கொடுக்கப்பட்டிருக்கிறது
  alternative: எல்லா அதிகாரமும் எனக்குக் கொடுக்கப்பட்டது
  rationale: மூலத்தின் செயப்பாட்டு வடிவத்தைப் பாதுகாத்து, அதிகாரம் இயேசுவுக்குக் கொடுக்கப்பட்டதைக் கூறுகிறது. ‘கொடுக்கப்பட்டிருக்கிறது’ என்பது முடிந்த செயலின் தற்போதைய நிலைத்த விளைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது; யார் கொடுத்தார் என்பதை மூலத்தைப் போலவே வெளிப்படையாகச் சேர்க்கவில்லை.
- issue: ἐξουσία என்பதன் பொருள்
  choice: அதிகாரம்
  alternative: வல்லமை
  rationale: இங்கு சொல் வெறும் ஆற்றலைவிட உரிமை, ஆளுகை, கட்டளையிடும் அதிகாரம் ஆகியவற்றை முதன்மையாகக் குறிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு தெளிவாகவும் மரியாதைமிக்க நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இவ்வாறு பேசினார்’ என்பது கிரேக்கத்தின் இரட்டை பேச்சு அறிமுகத்தை தமிழில் செயற்கையாகத் தோன்றாமல் பிரதிபலிக்கிறது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
