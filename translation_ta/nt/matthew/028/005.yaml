id: MAT.28.5
reference: Matthew 28:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ ἄγγελος εἶπεν ταῖς γυναιξίν· Μὴ φοβεῖσθε ὑμεῖς, οἶδα γὰρ ὅτι Ἰησοῦν τὸν ἐσταυρωμένον ζητεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/005.yaml
  text: But the angel answered and said to the women[a], “Do not be afraid[b]; for I know that you are seeking Jesus who has been crucified.”
translation:
  language: ta
  text: 'ஆனால் தேவதூதர் அந்தப் பெண்களிடம் பதிலளித்துக் கூறினார்: “நீங்களோ பயப்படாதீர்கள்[a]; ஏனெனில், நீங்கள் சிலுவையில் அறையப்பட்ட இயேசுவை[b] தேடுகிறீர்கள் என்று எனக்குத் தெரியும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் ‘நீங்கள்’ என்பது வெளிப்படையாகவும் வலியுறுத்தலுடனும் உள்ளது; ஆறுதல் பெண்களையே நோக்கி வலியுறுத்திச் சொல்லப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘சிலுவையில் அறையப்பட்டவராகிய இயேசு.’
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: ஆனால் ... கூறினார்
  rationale: கிரேக்கத்தின் ‘பதிலளித்து ... சொன்னார்’ என்ற கதைநடைச் சொற்றொடரைத் தமிழில் அப்படியே இரட்டிப்பது இயல்பற்றது. δέ குறிக்கும் மென்மையான திருப்பத்தை ‘ஆனால்’ தக்கவைக்கிறது; பேச்சின் தொடக்கத்தை ‘கூறினார்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὁ ἄγγελος
  choice: தேவதூதர்
  rationale: உயிர்த்தெழுதல் நிகழ்வின் சூழலில் இது மனிதத் தூதரை அல்ல, வானதூதரைக் குறிக்கிறது; நவீனத் தமிழில் ‘தேவதூதர்’ தெளிவானதும் மரியாதையானதும் ஆகும்.
- source_word: ταῖς γυναιξίν
  choice: அந்தப் பெண்களிடம்
  rationale: γυναιξίν இங்கு வயதுவந்த பெண்களைக் குறிக்கிறது. முன் சூழலில் அறிமுகமானவர்களாதலால் தமிழ் உரையில் ‘அந்தப் பெண்கள்’ இயல்பாக அமைகிறது.
- source_word: Μὴ φοβεῖσθε ὑμεῖς
  choice: நீங்களோ பயப்படாதீர்கள்
  rationale: வெளிப்படையாக உள்ள ὑμεῖς என்பதன் வலியுறுத்தலையும் சாத்தியமான ஒப்புமை/வேறுபாட்டையும் ‘நீங்களோ’ இயல்பான தமிழில் காக்கிறது; ‘பயப்படாதீர்கள்’ ஆறுதலளிக்கும் கட்டளையின் பொருளைத் தருகிறது.
- source_word: οἶδα γὰρ ὅτι
  choice: '... என்று எனக்குத் தெரியும்'
  rationale: γάρ தரும் காரணவிளக்கத்தைத் தமிழில் அடுத்த வாக்கியமாக இயல்பாகத் தருகிறது; ὅτι அறிமுகப்படுத்தும் செய்தி ‘என்று’ மூலம் வெளிப்படுகிறது.
- source_word: Ἰησοῦν τὸν ἐσταυρωμένον
  choice: சிலுவையில் அறையப்பட்ட இயேசுவை
  rationale: ἐσταυρωμένον என்ற perfect passive participle முடிந்த சிலுவையறைதலின் விளைவுநிலையை உணர்த்துகிறது. ‘சிலுவையில் அறையப்பட்ட’ என்பது செயப்படுபொருள் நிலையையும் இயேசுவை அடையாளப்படுத்தும் பண்பையும் சுருக்கமாகக் காக்கிறது.
- source_word: ζητεῖτε
  choice: நீங்கள் தேடுகிறீர்கள்
  rationale: நிகழ்கால வினையின் தொடரும் செயலை ‘தேடுகிறீர்கள்’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ὑμεῖς என்ற வலியுறுத்தப்பட்ட பதிலிடுபெயரின் பொருள்
  choice: ‘நீங்களோ’ என்று முதன்மை உரையிலேயே வலியுறுத்தலை வைத்தல்
  alternative: ‘பயப்படாதீர்கள்’ என்று மட்டும் மொழிபெயர்த்தல்
  rationale: கிரேக்கத்தில் தேவையின்றியும் வெளிப்படையாக இடம்பெறும் ὑμεῖς பெண்களையே குறிப்பாக ஆறுதல்படுத்துகிறது; யாருடன் வேறுபடுத்தப்படுகிறது என்பதை உரை முழுமையாகச் சொல்லாததால் அதை விளக்கிச் சேர்க்காமல் பதற்றத்தைப் பாதுகாக்கிறது.
- issue: ἐσταυρωμένον என்பதின் perfect participle நுணுக்கம்
  choice: ‘சிலுவையில் அறையப்பட்ட இயேசு’
  alternative: ‘சிலுவையில் அறையப்பட்டிருந்த இயேசு’ அல்லது ‘சிலுவையில் அறையப்பட்டவர்’
  rationale: சிலுவையறைதல் முடிந்த நிகழ்வு என்பதையும் அது இயேசுவை அடையாளப்படுத்தும் தொடர்ந்த பொருத்தத்தையும் இயல்பான தமிழில் காட்டுகிறது; தேவையற்ற காலவியல் அல்லது கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகமக் கண்ணியத்துடனும் அமைக்கப்பட்டது. கிரேக்கக் கதைநடையின் இயல்பற்ற வினை இரட்டிப்பு தமிழில் சுருக்கப்பட்டது; ஆனால் δέ-யின் திருப்பமும் ὑμεῖς-ன் வலியுறுத்தலும் பாதுகாக்கப்பட்டன. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
