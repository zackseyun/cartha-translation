reference: Matthew 28:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀπὸ δὲ τοῦ φόβου αὐτοῦ ἐσείσθησαν οἱ τηροῦντες καὶ ἐγενήθησαν ⸀ὡς νεκροί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/004.yaml
  text: And from fear of him the guards shook and became like dead men[a].
translation:
  language: ta
  text: அவனைப் பற்றிய பயத்தால் காவலர்கள் நடுங்கி, இறந்தவர்களைப்போல் ஆனார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுக்குப் பயந்து காவலர்கள் அதிர்ந்து, இறந்தவர்களைப்போல் ஆனார்கள்.”
    reason: ἀπό இங்கு காரணத்தைக் குறிக்கலாம்; ἐσείσθησαν என்பதற்கு “நடுங்கினார்கள்” அல்லது “அதிர்ந்தார்கள்” என்று மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: ἀπὸ δὲ τοῦ φόβου αὐτοῦ
  choice: அவனுக்கு அஞ்சியதால்
  rationale: ἀπό உடன் வரும் இத்தொடர் பயமே காவலர்களின் எதிர்வினைக்குக் காரணம் என்பதைக் காட்டுகிறது. தமிழில் இயல்பாகவும் தெளிவாகவும் காரணத்தை வெளிப்படுத்த வினை வடிவில் மொழிபெயர்க்கப்பட்டுள்ளது; δέ இங்கு மென்மையான கதைத் தொடர்ச்சியைக் குறிப்பதால் தனிச் சொல்லாக மொழிபெயர்க்கப்படவில்லை.
- source_word: ἐσείσθησαν
  choice: நடுங்கி
  rationale: σείω என்பதன் இப்பயன்பாடு பயத்தால் உடல் நடுங்கியதைச் சுட்டுகிறது. “நடுங்கி” என்பது இயல்பான, நேரடியான தமிழ்.
- source_word: οἱ τηροῦντες
  choice: காவலர்கள்
  rationale: சொல்லுக்கு நேராக “காவல் காத்துக்கொண்டிருந்தவர்கள்” என்று பொருள்; கல்லறையைக் காவல் காத்த படைவீரர்களைக் குறிக்கும் சூழலில் “காவலர்கள்” தெளிவாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: ἐγενήθησαν
  choice: ஆனார்கள்
  rationale: γίνομαι இங்கு நிலைமாற்றத்தைக் குறிக்கிறது; எனவே வெறுமனே “இருந்தார்கள்” என்பதற்குப் பதிலாக “ஆனார்கள்” பயன்படுத்தப்பட்டுள்ளது.
- source_word: ὡς νεκροί
  choice: இறந்தவர்களைப் போல
  rationale: ὡς ஒப்புமையைக் குறிக்கிறது; அவர்கள் உண்மையில் இறந்துவிட்டார்கள் என்று கூறாமல், இறந்தவர்களைப் போன்ற நிலைக்கு ஆனார்கள் என்ற பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: αὐτοῦ (“அவன்”) என்பதன் சுட்டுப்பொருள்
  choice: முந்தைய வசனத்தில் விவரிக்கப்பட்ட தூதனைச் சுட்டுகிறது
  alternative: ஒட்டுமொத்த வானுலக நிகழ்வை பொதுவாகச் சுட்டுகிறது
  rationale: இலக்கணத்திலும் உடனடி சூழலிலும் மிக அருகிலுள்ள ஆண்பால் ஒருமைச் சுட்டுப்பொருள் முந்தைய வசனத்தின் தூதனே. பெயரை மீண்டும் சேர்க்காமல் “அவன்” என்று வைத்திருப்பது மூலத்தின் இணைப்பையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. காரணத் தொடர்பும், காவலர்களின் உடல் எதிர்வினையும், அவர்கள் உண்மையில் இறக்கவில்லை என்ற ஒப்புமையும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
