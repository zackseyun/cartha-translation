- from: அவனுக்கு அஞ்சியதால், காவலர்கள் நடுங்கி, இறந்தவர்களைப் போல ஆனார்கள்.[a]
  to: அவனைப் பற்றிய பயத்தால் காவலர்கள் நடுங்கி, இறந்தவர்களைப்போல் ஆனார்கள்.[a]
  rationale: The revision preserves the Greek causal construction with an explicit noun for “fear,” maintains the narrative subject and the simile “like dead people,” and supplies a complete, clearly delimited lexical alternative in the footnote. The referent of “அவன்” remains the angelic figure in the immediately preceding context, without adding an interpretive identification.
