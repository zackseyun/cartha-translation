revisions:
- from: பதினொரு சீடர்களும் கலிலேயாவுக்கு, இயேசு தங்களுக்காகக் குறிப்பிட்டிருந்த[a] மலைக்குச் சென்றார்கள்.
  to: பதினொரு சீடர்கள் கலிலேயாவுக்கு, இயேசு அவர்களுக்குக் குறிப்பிட்டிருந்த மலைக்குச் சென்றார்கள்.
  rationale: 'The revision corrects the relationship expressed by αὐτοῖς in the main text: Jesus specified the mountain to the disciples. The alternative rendering remains available in the footnote, preserving the lexical range of ἐτάξατο without forcing a stronger command or institutional sense.'
