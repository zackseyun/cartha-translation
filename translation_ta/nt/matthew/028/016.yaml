source:
  edition: SBLGNT
  text: Οἱ δὲ ἕνδεκα μαθηταὶ ἐπορεύθησαν εἰς τὴν Γαλιλαίαν εἰς τὸ ὄρος οὗ ἐτάξατο αὐτοῖς ὁ Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/016.yaml
  text: The eleven disciples went to Galilee[a], to the mountain where Jesus had directed them,
translation:
  language: ta
  text: பதினொரு சீடர்கள் கலிலேயாவுக்கு, இயேசு அவர்களுக்குக் குறிப்பிட்டிருந்த மலைக்குச் சென்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: தனி இணைப்புச் சொல் இல்லாமல் வாக்கியத் தொடர்ச்சியில் வெளிப்படுத்தப்பட்டது
  rationale: இது மென்மையான கதைத் தொடர்ச்சி இணைப்பாக உள்ளது; தமிழில் ‘ஆனால்’ என்பது தேவையற்ற முரண்பாட்டையும், ‘அப்போது’ என்பது மூலத்தில் இல்லாத கால வலியுறுத்தலையும் தரக்கூடும்.
- source_word: ἕνδεκα μαθηταὶ
  choice: பதினொரு சீடர்களும்
  rationale: ἕνδεκα குழுவின் துல்லியமான எண்ணிக்கையைப் பாதுகாக்கிறது; μαθηταί என்பதற்கான இயல்பான, நிலைபெற்ற நற்செய்தி நூல் சொல் ‘சீடர்கள்’ ஆகும்.
- source_word: ἐπορεύθησαν
  choice: சென்றார்கள்
  rationale: இச்சூழலில் இடத்தை நோக்கிய நகர்வை இயல்பாகவும் போதுமான துல்லியத்துடனும் தெரிவிக்கிறது.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: கலிலேயாவுக்கு
  rationale: εἰς ஒரு பகுதியை நோக்கிய நகர்வைக் குறிக்கிறது; தமிழ் வழக்கில் ‘கலிலேயாவுக்கு’ இயல்பானது.
- source_word: εἰς τὸ ὄρος
  choice: மலைக்கு
  rationale: ὄρος என்பதன் முதன்மைப் பொருளான ‘மலை’ என்பதையும், குறிப்பிட்ட ஒரு இடத்தைக் குறிக்கும் சுட்டையும் பாதுகாக்கிறது.
- source_word: οὗ ἐτάξατο αὐτοῖς
  choice: தங்களுக்காகக் குறிப்பிட்டிருந்த
  rationale: இயேசு முன்னரே சந்திப்பு இடத்தைச் சுட்டிக்காட்டியிருந்தார் என்ற சூழல்பொருளை இயல்பாக வெளிப்படுத்துகிறது; வினைச்சொல்லின் ‘நியமித்தல்/ஏற்பாடு செய்தல்’ என்ற சாத்தியத்தைக் குறிப்பில் திறந்துவைக்கிறது.
- source_word: ὁ Ἰησοῦς
  choice: இயேசு
  rationale: தமிழில் நிலைபெற்ற பெயர் வடிவம்.
theological_decisions:
- issue: இயேசு சந்திப்பு இடத்தை முன்கூட்டியே நிர்ணயித்ததன் தன்மை
  choice: ‘தங்களுக்காகக் குறிப்பிட்டிருந்த’
  alternative: ‘தங்களுக்கு நியமித்திருந்த’ அல்லது ‘தங்களுக்கு உத்தரவிட்டிருந்த’
  rationale: இங்கு முதன்மையாக ஒரு இடம் முன்கூட்டியே குறிக்கப்பட்டிருப்பதையே உரை தெரிவிக்கிறது. அதிகார அமைப்பு அல்லது கடுமையான கட்டளை என்ற கருத்தை தேவையின்றி சேர்க்காமல், கிரேக்க வினையின் பரந்த பொருள் சாத்தியத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. மூலத்தின் இரட்டை இலக்கு அமைப்பை (‘கலிலேயாவுக்கு, ... மலைக்கு’) முடிந்தவரை காக்கிறது; δὲ-க்கு தேவையற்ற முரண்பாட்டு அல்லது காலச் சொல்லைச் சேர்க்கவில்லை.
