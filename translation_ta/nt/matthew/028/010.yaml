  terminology: ‘என் சகோதரர்கள்’ என்பது τοῖς ἀδελφοῖς μου என்ற ஆண்பால் பன்மை உறவுச்சொல்லைத் தக்கவைக்கிறது; அதை விளக்கமான ‘சீடர்கள்’ என முதன்மை உரையில் மாற்றவில்லை. அடிக்குறிப்பு உடனடி சூழலிலுள்ள குறிப்பைச் சரியாக விளக்குகிறது; அதன் குறியீடு சரியான இடத்தில் உள்ளது.
