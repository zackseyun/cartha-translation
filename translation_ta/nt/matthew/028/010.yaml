id: MAT.28.10
reference: Matthew 28:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τότε λέγει αὐταῖς ὁ Ἰησοῦς· Μὴ φοβεῖσθε· ὑπάγετε ἀπαγγείλατε τοῖς ἀδελφοῖς μου ἵνα ἀπέλθωσιν εἰς τὴν Γαλιλαίαν, κἀκεῖ με ὄψονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/010.yaml
  text: Then Jesus said to them[a], “Do not be afraid. Go, tell my brothers to go to Galilee[c][b], and there they will see me.”
translation:
  language: ta
  text: அப்போது இயேசு அவர்களிடம், “பயப்படாதீர்கள். போய், என் சகோதரர்களிடம்[a] கலிலேயாவுக்குச் செல்லச் சொல்லுங்கள்; அங்கே அவர்கள் என்னைக் காண்பார்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் சகோதரர்கள்” என்பது இங்கே இயேசுவின் சீடர்களைக் குறிக்கிறது. கிரேக்கச் சொல் ஆண்பால் பன்மையில் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: கதை நிகழ்வுகளின் தொடர்ச்சியைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: λέγει αὐταῖς
  choice: இயேசு அவர்களிடம் ... என்றார்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தைத் தமிழ் கதைநடைக்கு இயல்பான இறந்தகாலமாக மொழிபெயர்க்கிறது; பெண்பால் பன்மைச் சுட்டுப்பெயரின் குறிப்பு முந்தைய சூழலில் தெளிவாக இருப்பதால் ‘அவர்களிடம்’ போதுமானது.
- source_word: Μὴ φοβεῖσθε
  choice: பயப்படாதீர்கள்
  rationale: தடைக் கட்டளையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ὑπάγετε
  choice: போய்
  rationale: அடுத்து வரும் செய்தி அறிவிக்கும் கட்டளையுடன் இயல்பான தமிழ் வினையெச்சத் தொடராக அமைகிறது.
- source_word: ἀπαγγείλατε ... ἵνα ἀπέλθωσιν
  choice: செல்லச் சொல்லுங்கள்
  rationale: செய்தியைத் தெரிவிக்கும் வினையையும் மறைமுகக் கட்டளையையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: τοῖς ἀδελφοῖς μου
  choice: என் சகோதரர்களிடம்
  rationale: ஆண்பால் பன்மையான மூலச்சொல்லையும் இயேசுவின் குடும்ப உறவுச் சொல்லையும் தக்கவைக்கிறது; அதை முதன்மை உரையில் ‘சீடர்கள்’ என்று விளக்கி மாற்றவில்லை.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: கலிலேயாவுக்குச்
  rationale: இலக்கைச் சுட்டும் கிரேக்க முன்னிடைச்சொல்லுக்கு இயல்பான தமிழ் வேற்றுமை உருபைப் பயன்படுத்துகிறது.
- source_word: κἀκεῖ με ὄψονται
  choice: அங்கே அவர்கள் என்னைக் காண்பார்கள்
  rationale: ‘அங்கே’ என்ற இடச்சுட்டையும் ‘காண்பார்கள்’ என்ற எதிர்காலப் பொருளையும் நேரடியாகப் பாதுகாக்கிறது; ‘சந்திப்பார்கள்’ என்ற அதிக விளக்கமான பொருளைத் தவிர்க்கிறது.
theological_decisions:
- issue: ‘என் சகோதரர்கள்’ என்பதன் குறிப்பு
  choice: குடும்ப உறவுச் சொல்லான ‘என் சகோதரர்கள்’ என்பதையே முதன்மை உரையில் வைத்தல்
  alternative: ‘என் சீடர்கள்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: உடனடி சூழலில் இது இயேசுவின் சீடர்களைக் குறிக்கிறது; ஆனாலும் மூலத்தில் உள்ள உறவுச் சொல்லின் இறையியல் நெருக்கத்தை மாற்றாமல் வைத்து, சூழல் சார்ந்த குறிப்பை அடிக்குறிப்பில் விளக்குவது பொருத்தமானது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை. மறைமுகக் கட்டளை தமிழில் இயல்பாக ‘செல்லச் சொல்லுங்கள்’ என வழங்கப்பட்டுள்ளது; மூலத்தின் உறவுச் சொல் தக்கவைக்கப்பட்டுள்ளது.
