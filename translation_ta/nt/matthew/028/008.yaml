id: MAT.28.8
reference: Matthew 28:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ⸀ἀπελθοῦσαι ταχὺ ἀπὸ τοῦ μνημείου μετὰ φόβου καὶ χαρᾶς μεγάλης ἔδραμον ἀπαγγεῖλαι τοῖς μαθηταῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/008.yaml
  text: And leaving the tomb quickly[a], with fear and great joy, they ran to report to his disciples.
translation:
  language: ta
  text: அவர்கள் கல்லறையை விட்டு விரைவாகப் புறப்பட்டு, அச்சத்தோடும்[a] மிகுந்த மகிழ்ச்சியோடும், அவருடைய சீடர்களுக்கு அறிவிக்க ஓடினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பயபக்தியோடும் மிகுந்த மகிழ்ச்சியோடும்.” இச்சூழலில் “அச்சம்” என்று மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொல் பயபக்தியின் பொருளையும் தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελθοῦσαι
  choice: புறப்பட்டு
  rationale: பெண்களைச் சுட்டும் இறந்தகால வினையெச்சம். கல்லறையிலிருந்து அவர்கள் வெளியேறியதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ταχὺ
  choice: விரைவாக
  rationale: அவர்கள் அவசரமாகச் செயல்பட்டதை நேரடியாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: μνημείου
  choice: கல்லறை
  rationale: இச்சூழலில் இயேசுவின் உடல் வைக்கப்பட்டிருந்த அடக்க இடத்தைக் குறிக்கும் தெளிவான பொதுத் தமிழ் சொல்.
- source_word: μετὰ φόβου καὶ χαρᾶς μεγάλης
  choice: அச்சத்தோடும் மிகுந்த மகிழ்ச்சியோடும்
  rationale: φόβος மற்றும் χαρά ஆகிய இரு உணர்வுகளையும் ஒன்றாக வைத்துப் பேசும் கிரேக்கச் சொற்றொடரின் பதற்றத்தைத் தணிக்காமல் காக்கிறது.
- source_word: ἔδραμον
  choice: ஓடினார்கள்
  rationale: τρέχω என்பதன் தெளிவான உடல்சார் செயலைக் காக்கிறது; ‘விரைந்தார்கள்’ என்று மென்மைப்படுத்தவில்லை.
- source_word: ἀπαγγεῖλαι
  choice: அறிவிக்க
  rationale: நோக்கத்தைக் குறிக்கும் வினையெச்சத்தின் பொருளைத் தருகிறது. கிரேக்கத்தில் நேரடிச் செயப்படுபொருள் வெளிப்படையாக இல்லாததால் தமிழிலும் கூடுதல் பொருள் சேர்க்கப்படவில்லை.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: அவருடைய சீடர்களுக்கு
  rationale: μαθηταί என்பதற்கான நிலையான நற்செய்தி நூல் வழக்கைத் தக்கவைக்கிறது; αὐτοῦ இயேசுவைக் குறிக்கிறது.
theological_decisions:
- issue: பெண்களின் பதிலில் காணப்படும் அச்சமும் மகிழ்ச்சியும்
  choice: அச்சத்தோடும் மிகுந்த மகிழ்ச்சியோடும்
  alternative: பயபக்தி கலந்த வியப்போடும் மிகுந்த மகிழ்ச்சியோடும்
  rationale: உயிர்த்தெழுதல் செய்திக்கான அவர்களுடைய பதிலில் அச்சமும் மகிழ்ச்சியும் இணைந்திருப்பதை வசனம் நோக்கமுடன் காட்டுகிறது. φόβος என்பதை வெறும் எதிர்மறைப் பயமாகவோ பயபக்தியாகவோ மட்டும் தீர்மானிக்காமல் அதன் பொருள் விரிவை முதன்மை உரையும் அடிக்குறிப்பும் காக்கின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கத்தின் நிகழ்வு வரிசையும் அச்சம்–மகிழ்ச்சி இணைப்பும் காக்கப்பட்டுள்ளன; வெளிப்படையாக இல்லாத செயப்படுபொருள் சேர்க்கப்படவில்லை.
