  yaml_path: translation/nt/matthew/028/017.yaml
  text: And when they saw him[a], they worshiped him, but some doubted.
translation:
  language: ta
  text: அவர்கள் அவரைக் கண்டபோது, அவரை வழிபட்டார்கள்; ஆனால் சிலர் ஐயப்பட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தயங்கினார்கள்” அல்லது “மனம் தடுமாறினார்கள்.” கிரேக்கச் சொல் நிலைபெற்ற அவநம்பிக்கையைவிட உறுதியின்மை அல்லது தயக்கத்தைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: அவர்கள் அவரைக் கண்டபோது
  rationale: ὁράω என்பதன் இறந்தகாலப் பங்கேற்பு வடிவத்தை, முதன்மை வினைகளோடு உள்ள காலத் தொடர்பை இயல்பான தமிழில் காட்டும் வகையில் ‘கண்டபோது’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: προσεκύνησαν
  choice: வழிபட்டார்கள்
  rationale: προσκυνέω என்பது பணிந்து வணங்குதல், மரியாதை செலுத்துதல், வழிபடுதல் ஆகிய பொருள்களைக் கொள்ளலாம். உயிர்த்தெழுந்த இயேசுவை நோக்கிய மத்தேயுவின் இச்சூழலில் ‘வழிபட்டார்கள்’ என்பது செய்கையின் ஆழ்ந்த பயபக்தியைச் சரியாக வெளிப்படுத்துகிறது.
- source_word: οἱ δὲ
  choice: ஆனால் சிலர்
  rationale: கட்டுரையுடன் வரும் δέ, முன் குறிப்பிடப்பட்ட குழுவுக்குள் ஒரு பகுதியினரை வேறுபடுத்திக் காட்டுகிறது. அந்த உட்பிரிவு உணர்வை இயல்பான தமிழில் ‘ஆனால் சிலர்’ தெளிவாகத் தருகிறது.
- source_word: ἐδίστασαν
  choice: ஐயப்பட்டார்கள்
  rationale: διστάζω என்பது ஐயப்படுதல், தயங்குதல், மனம் தடுமாறுதல் ஆகிய நுண்பொருள்களைக் கொண்டது. ‘ஐயப்பட்டார்கள்’ தெளிவான நவீனத் தமிழ்; அது உறுதியான அவநம்பிக்கை என்று தேவையின்றி மிகைப்படுத்துவதில்லை. மாற்று நுண்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: உயிர்த்தெழுந்த இயேசுவை நோக்கிய προσκυνέω என்பதன் வலிமை
  choice: ‘வழிபட்டார்கள்’ என்று மொழிபெயர்த்தல்
  alternative: ‘பணிந்து வணங்கினார்கள்’ அல்லது ‘மரியாதை செலுத்தினார்கள்’
  rationale: உயிர்த்தெழுதலுக்குப் பிந்தைய மத்தேயுவின் கதைச்சூழலும், செயல் நேரடியாக இயேசுவை நோக்கியிருப்பதும் கருதி ‘வழிபட்டார்கள்’ என்பது கிரேக்கச் சொல்லின் எல்லைக்குள் இருந்தபடியே அதன் இறையியல் கனத்தை வெளிப்படுத்துகிறது.
- issue: διστάζω என்பதன் நுண்பொருள்
  choice: முதன்மை உரையில் ‘ஐயப்பட்டார்கள்’
  alternative: ‘தயங்கினார்கள்’ அல்லது ‘மனம் தடுமாறினார்கள்’
  rationale: இச்சொல் நிலைபெற்ற அவநம்பிக்கையைவிடத் தயக்கம் அல்லது தடுமாற்றத்தையும் குறிக்கலாம். முதன்மை உரை ஐயத்தைத் தெரிவிக்கிறது; அடிக்குறிப்பு மாற்று நுண்பொருளைப் பாதுகாத்து, உரையின் பதற்றத்தைத் தீர்த்துவிடாமல் வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. ‘வழிபட்டார்கள்’ சூழலின் பயபக்தியைத் தக்கவைக்கிறது; ‘ஐயப்பட்டார்கள்’ மற்றும் அடிக்குறிப்பு கிரேக்கத்தின் உண்மையான நுண்பொருள் வேறுபாட்டைப் பாதுகாக்கின்றன.
