id: MAT.28.12
reference: Matthew 28:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ συναχθέντες μετὰ τῶν πρεσβυτέρων συμβούλιόν τε λαβόντες ἀργύρια ἱκανὰ ἔδωκαν τοῖς στρατιώταις
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/012.yaml
  text: And after gathering with the elders and taking counsel[a], they gave a considerable sum of silver to the soldiers,
translation:
  language: ta
  text: அவர்கள் மூப்பர்களுடன் ஒன்றுகூடி ஆலோசனை செய்தபின், படைவீரர்களுக்குப் பெருந்தொகையான வெள்ளிப் பணத்தைக்[a] கொடுத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏராளமான வெள்ளி நாணயங்களைக்.” கிரேக்கத்தில் நேரடியாக “கணிசமான வெள்ளி” என்று உள்ளது.
    reason: ἀργύρια என்பது வெள்ளிப் பணத்தையோ வெள்ளி நாணயங்களையோ குறிக்கலாம்; மூலத்தின் சொற்பொருளையும் மாற்று வடிவத்தையும் பதிவு செய்கிறது.
lexical_decisions:
- source_word: συναχθέντες
  choice: ஒன்றுகூடி
  rationale: இறந்தகாலப் பங்கேற்புவினையின் தொடர்ச்சியை இயல்பான தமிழில் காட்டுகிறது; அவர்கள் ஒன்றாகக் கூடிவந்ததையும் உணர்த்துகிறது.
- source_word: μετὰ τῶν πρεσβυτέρων
  choice: மூப்பர்களுடன்
  rationale: μετά உடனிருப்பதையும் கூட்டுறவையும் குறிக்கிறது; இந்தத் தலைமைச் சூழலில் πρεσβύτεροι என்பதற்கான நிலையான, இயல்பான தமிழ் சொல் ‘மூப்பர்கள்’.
- source_word: συμβούλιόν τε λαβόντες
  choice: ஆலோசனை செய்தபின்
  rationale: இந்த மரபுத்தொடர் வெறுமனே அறிவுரை பெற்றதைக் குறிக்காமல், ஒன்றாகக் கலந்தாலோசித்ததைக் குறிக்கிறது. ‘செய்தபின்’ என்பது முதன்மை வினைக்கு முன் நிகழ்ந்த செயலை இயல்பாகத் தருகிறது.
- source_word: ἀργύρια
  choice: வெள்ளிப் பணம்
  rationale: பன்மை வடிவம் இங்கு வெள்ளியால் ஆன பணத்தை அல்லது வெள்ளி நாணயங்களைச் சுட்டலாம். ‘வெள்ளிப் பணம்’ பணம் என்ற பொருளையும் வெள்ளி என்ற மூலச்சொல் குறிப்பையும் தக்கவைக்கிறது.
- source_word: ἱκανὰ
  choice: பெருந்தொகையான
  rationale: இந்தச் சூழலில் போதுமானது என்பதைவிட கணிசமான அளவு அல்லது பெரிய தொகை என்பதே பொருத்தமான பொருள்; இயல்பான தமிழில் ‘பெருந்தொகையான’ என்று தரப்பட்டுள்ளது.
- source_word: ἔδωκαν
  choice: கொடுத்தார்கள்
  rationale: δίδωμι என்பதன் எளிய இறந்தகாலப் பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: τοῖς στρατιώταις
  choice: படைவீரர்களுக்கு
  rationale: அவர்கள் காவல் பணியில் இருந்தாலும், στρατιώτης என்பதன் நேரடியான சொற்பொருள் ‘படைவீரர்’ என்பதே.
theological_decisions:
- issue: மறைந்திருக்கும் எழுவாயின் அடையாளம்
  choice: ‘அவர்கள்’ என்பது முந்தைய வசனத்தில் குறிப்பிடப்பட்ட தலைமைக் குருக்களைத் தொடர்கிறது
  alternative: குறிப்பிடப்படாத ஒரு குழு
  rationale: பங்கேற்புவினைகளும் முதன்மை வினையும் ஆண்பால் பன்மையில் உள்ளன; மத்தேயு 28:11-இல் செயற்படும் தலைமைக் குருக்களே இதன் இயல்பான முன்னிலைச் சுட்டு. எனினும் கிரேக்கம் பெயரை மீண்டும் கூறாததால் தமிழிலும் ‘தலைமைக் குருக்கள்’ என்று வெளிப்படையாகச் சேர்க்காமல் ‘அவர்கள்’ என்று வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் dignified நடை பயன்படுத்தப்பட்டுள்ளது. பங்கேற்புவினைகளின் வரிசை ‘ஒன்றுகூடி ஆலோசனை செய்தபின்’ என்று இயல்பாக்கப்பட்டுள்ளது; வசனத்தின் தொடர்ச்சியைத் தக்கவைக்க முடிவில் முழுநிறுத்தம் பயன்படுத்தப்பட்டாலும், தேவையான பதிப்புச் சூழலில் காற்புள்ளியாக மாற்றலாம்.
