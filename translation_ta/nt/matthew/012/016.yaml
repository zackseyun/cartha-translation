  yaml_path: translation/nt/matthew/012/016.yaml
  text: And he warned them not to make him known,[a]
translation:
  language: ta
  text: தம்மை வெளிப்படையாக அறியப்படுத்த வேண்டாம் என்று அவர்களைக் கடுமையாக எச்சரித்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுக்குக் கண்டிப்பாகக் கட்டளையிட்டார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Implicit narrative continuation
  rationale: Tamil does not require a separate equivalent of καὶ here; beginning directly with the finite clause gives a natural continuation without adding temporal or causal nuance.
- source_word: ἐπετίμησεν
  choice: கண்டிப்புடன் எச்சரித்தார்
  rationale: The verb can denote rebuking, sternly warning, or charging. In this context the following prohibition makes a stern warning/directive most likely; this wording conveys its force without necessarily attributing wrongdoing to those addressed.
- source_word: αὐτοῖς
  choice: அவர்களை
  rationale: The dative plural identifies the people whom Jesus addressed; Tamil naturally marks them as the object of எச்சரித்தார்.
- source_word: ἵνα μὴ
  choice: வேண்டாம் என்று
  rationale: After a verb of warning or stern direction, this construction naturally expresses the prohibited action in modern Tamil.
- source_word: φανερὸν αὐτὸν ποιήσωσιν
  choice: தம்மைப் பற்றி வெளியே தெரியப்படுத்த
  rationale: The idiom means to make him known or public. The reflexive honorific தம்மை refers unambiguously to Jesus, while பற்றி வெளியே தெரியப்படுத்த naturally conveys public disclosure rather than merely personal acquaintance.
theological_decisions:
- issue: Nature of Jesus' directive concerning publicity
  choice: A stern warning not to make him publicly known
  alternative: A rebuke of those addressed, or an explicit formal order
  rationale: The Greek communicates a forceful directive but does not state its theological reason. The rendering retains the strength while avoiding an added explanation or an unnecessary implication that the recipients had committed a moral offense.
translation_notes:
  register: Modern standard Tamil with dignified, broadly accessible wording. The honorific reflexive தம்மை is used for Jesus. The connective καὶ is left implicit because an overt மேலும்/அப்போது could sound unnatural or add nuance not required by the Greek.
