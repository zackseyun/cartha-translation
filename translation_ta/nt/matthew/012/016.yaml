- from: தம்மைப் பற்றி வெளியே தெரியப்படுத்த வேண்டாம் என்று அவர்களைக் கண்டிப்புடன் எச்சரித்தார்.[a]
  to: தம்மை வெளிப்படையாக அறியப்படுத்த வேண்டாம் என்று அவர்களைக் கடுமையாக எச்சரித்தார்.[a]
