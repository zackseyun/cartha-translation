source:
  edition: SBLGNT
  text: κάλαμον συντετριμμένον οὐ κατεάξει καὶ λίνον τυφόμενον οὐ σβέσει, ἕως ἂν ἐκβάλῃ εἰς νῖκος τὴν κρίσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/020.yaml
  text: He will not break a bruised reed[a], and he will not extinguish a smoldering wick[b], until he brings justice to victory.
translation:
  language: ta
  text: அவர் நசுங்கிய நாணலை முறிக்கமாட்டார்; புகைந்துகொண்டிருக்கும் விளக்குத் திரியை[a] அணைக்கமாட்டார்; நீதியை வெற்றிக்குக் கொண்டுவரும்வரை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “புகைந்துகொண்டிருக்கும் ஆளிநாரை.” கிரேக்கச் சொல் விளக்குத் திரியாகப் பயன்படுத்தப்பட்ட ஆளிநாரைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κάλαμον συντετριμμένον
  choice: நசுங்கிய நாணல்
  rationale: κάλαμος என்பதற்கு ‘நாணல்’ இயல்பான தமிழ் இணை; συντετριμμένον சேதமடைந்திருந்தாலும் இன்னும் முற்றிலும் முறியாத நிலையைக் குறிக்க இங்கு ‘நசுங்கிய’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: οὐ κατεάξει
  choice: முறிக்கமாட்டார்
  rationale: κατάγνυμι என்பதன் முறித்தல் அல்லது ஒடித்தல் என்ற நேரடியான பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: λίνον τυφόμενον
  choice: புகைந்துகொண்டிருக்கும் விளக்குத் திரி
  rationale: λίνον சொற்பொருளில் ஆளிவிதை நாரைச் சுட்டினாலும், இச்சூழலில் அதனால் செய்யப்பட்ட விளக்குத் திரியைக் குறிக்கிறது; τυφόμενον அணையும்நிலையில் புகைதரும் தன்மையை வெளிப்படுத்துகிறது.
- source_word: οὐ σβέσει
  choice: அணைக்கமாட்டார்
  rationale: σβέννυμι என்பதன் ‘அணைத்தல்’ என்ற பொருளை விளக்குத் திரி உருவகத்துக்கு ஏற்ற தெளிவான தமிழில் தருகிறது.
- source_word: ἕως ἂν
  choice: செய்யும்வரை
  rationale: எதிர்கால இலக்கை எட்டும் வரையிலான கால எல்லையைத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: ἐκβάλῃ εἰς νῖκος
  choice: வெற்றிபெறச் செய்யும்
  rationale: ἐκβάλλω இங்கு ஒன்றைத் தீர்மானமான முடிவுக்குக் கொண்டுவருவதையும், εἰς νῖκος வெற்றிகரமான விளைவையும் குறிக்கின்றன.
- source_word: τὴν κρίσιν
  choice: நீதி
  rationale: ஏசாயாவின் ஊழியர் பின்னணியில் κρίσις வெறும் தீர்ப்புரையைவிட நியாயமான ஒழுங்கை நிலைநாட்டுவதை விரிவாகக் குறிக்கிறது; ‘தீர்ப்பு’ என்பதும் சாத்தியமான மாற்று.
theological_decisions:
- issue: ஏசாயாவின் ஊழியர் மேற்கோளில் κρίσις என்பதன் பொருள்
  choice: நீதி
  alternative: தீர்ப்பு
  rationale: இங்கு ஊழியர் தண்டனைத் தீர்ப்பு மட்டும் வழங்குவதாக அல்லாமல், கடவுளின் நியாயமான ஒழுங்கை வெற்றிகரமாக நிலைநாட்டுவதாகப் பின்னணி காட்டுகிறது. இருப்பினும் கிரேக்கச் சொல்லிலுள்ள ‘தீர்ப்பு’ என்ற சாத்தியத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: விளக்குத் திரி உருவகத்தின் மொழிபெயர்ப்பு
  choice: விளக்குத் திரி … அணைக்கமாட்டார்
  alternative: புகையும் ஆளிநாரை அணைக்கமாட்டார்
  rationale: கிரேக்கத்தில் ஆளிநார் என்று நேரடியாக இருந்தாலும், பயன்பாட்டில் அது விளக்குத் திரியைக் குறிக்கிறது. வாசகருக்கு உருவகம் தெளிவாக இருக்க முதன்மை உரையில் பொருள்சார் வடிவமும், மூலச்சொல்லின் வடிவம் அடிக்குறிப்பிலும் தரப்படுகிறது.
- issue: ἕως ἂν என்பதால் முன் வரும் மறுப்புகளுக்கு ஏற்படக்கூடிய தவறான புரிதல்
  choice: இப்படியே செய்வார் என்ற தொடர்பை வெளிப்படுத்தல்
  alternative: நீதியை வெற்றிக்குக் கொண்டுவரும்வரை
  rationale: ‘வரை’ என்பதைக் கேட்டவுடன் அதன் பின்னர் அவர் நாணலை முறித்து திரியை அணைப்பார் என்ற தவறான காலப் பொருள் தமிழில் எழலாம். கிரேக்கத்தின் இலக்கு நிறைவேறும் வரையிலான தொடர்ச்சியான செயலைத் தெளிவாக்க ‘இப்படியே செய்வார்’ சேர்க்கப்படுகிறது; அந்தத் தொடர்பு அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘நாணல்’, ‘விளக்குத் திரி’, ‘நீதி’ ஆகியவை தீர்க்கதரிசன உருவகத்தின் உயர்நடையைத் தக்கவைக்கின்றன. ‘இப்படியே செய்வார்’ என்பது தமிழில் ‘வரை’ உருவாக்கக்கூடிய தவறான பின்னர்-மாற்றப் பொருளைத் தவிர்க்கும் தெளிவாக்கம்; அது மூலத்தின் கருத்தை விரிவாக்காமல் அதன் தொடர்ச்சியை வெளிப்படுத்துகிறது.
