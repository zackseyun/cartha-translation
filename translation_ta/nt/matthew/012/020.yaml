  to: அவர் நசுங்கிய நாணலை முறிக்கமாட்டார்; புகைந்துகொண்டிருக்கும் விளக்குத் திரியை[a] அணைக்கமாட்டார்; நீதியை வெற்றிக்குக் கொண்டுவரும்வரை.
