id: MAT.12.29
reference: Matthew 12:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἢ πῶς δύναταί τις εἰσελθεῖν εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ καὶ τὰ σκεύη αὐτοῦ ⸀ἁρπάσαι, ἐὰν μὴ πρῶτον δήσῃ τὸν ἰσχυρόν; καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/029.yaml
  text: Or how can someone enter the strong man's house and seize his goods[b][a], unless he first binds the strong man? And then he will plunder his house.
translation:
  language: ta
  text: அல்லது, வலிமையானவனை முதலில் கட்டிப்போடாமல், ஒருவன் எப்படி அவனுடைய வீட்டுக்குள் நுழைந்து அவனுடைய உடைமைகளைப் பறித்துக்கொள்ள முடியும்? அவனைக் கட்டிப்போட்ட பிறகுதான் அவனுடைய வீட்டைக் கொள்ளையிடுவான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ
  choice: அல்லது
  rationale: முந்தைய வாதத்துடன் இணைந்த மாற்று விளக்க ஒப்புமையை இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: πῶς δύναταί τις
  choice: ஒருவன் எப்படி ... முடியும்?
  rationale: கிரேக்கத்தின் சொல்லாட்சிக் கேள்வியையும் பொதுவான, குறிப்பற்ற நபரைக் குறிக்கும் தன்மையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: τοῦ ἰσχυροῦ / τὸν ἰσχυρόν
  choice: வலிமையானவன் / வலிமையானவனை
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட கிரேக்கப் பெயரடையின் ஆண்பால் உருவத்தையும் ஒப்புமையின் தெளிவையும் காக்கிறது.
- source_word: τὰ σκεύη αὐτοῦ
  choice: அவனுடைய உடைமைகள்
  rationale: σκεύη என்பதன் நேரடிப் பொருள் பாத்திரங்கள் அல்லது கருவிகள் என்றாலும், வீட்டைக் கொள்ளையிடும் சூழலில் அது பொதுவாக வீட்டிலுள்ள உடைமைகளைக் குறிக்கிறது.
- source_word: ἁρπάσαι
  choice: பறித்துக்கொள்ள
  rationale: வலுக்கட்டாயமாக எடுத்துக்கொள்ளும் பொருளை வெளிப்படுத்துவதுடன், பின்னர் வரும் தீவிரமான διαρπάσει என்பதிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: ἐὰν μὴ πρῶτον δήσῃ
  choice: முதலில் கட்டிப்போடாமல்
  rationale: δήσῃ என்பதன் கட்டுதல் அல்லது கட்டுப்படுத்துதல் என்ற காட்சிப்பூர்வப் பொருளையும் πρῶτον குறிக்கும் வரிசையையும் இயல்பான தமிழில் தருகிறது.
- source_word: καὶ τότε
  choice: கட்டிப்போட்ட பிறகுதான்
  rationale: செயல்களின் வரிசையையும், முதல் செயல் நிறைவேறிய பின்னரே அடுத்தது சாத்தியம் என்ற சூழல்சார் வலியுறுத்தலையும் தெரிவிக்கிறது.
- source_word: διαρπάσει
  choice: கொள்ளையிடுவான்
  rationale: வீட்டிலுள்ளவற்றை விரிவாகப் பறித்துச் செல்லும் தீவிரமான செயலைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: τὴν οἰκίαν αὐτοῦ
  choice: அவனுடைய வீடு
  rationale: உருவகத்தின் நேரடியான வீட்டுக் காட்சியைப் பாதுகாத்து, அதை ஆட்சி எல்லை அல்லது குடும்பம் என்று விளக்கி மொழிபெயர்ப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: உருவகத்திலுள்ள ஆண்பால் குறிப்பு
  choice: வலிமையானவன் / ஒருவன்
  alternative: வலிமையுள்ளவர் / யாராவது
  rationale: கிரேக்கம் concrete ஆண்பால் உருவகத்தைப் பயன்படுத்துகிறது; தமிழிலும் அதை இயல்பாகக் காக்கிறது, ஆனால் குறிப்பிட்ட வரலாற்று நபராக மாற்றுவதில்லை.
- issue: ‘வீடு’ மற்றும் ‘உடைமைகள்’ என்பவற்றின் உருவக எல்லை
  choice: நேரடியான கொள்ளை உருவகத்தை அப்படியே வைத்தல்
  alternative: ஆட்சிப்பரப்பு / அவனுக்குச் சொந்தமானவர்கள் என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: சூழல் தீய ஆவிகள்மேல் இயேசுவின் அதிகாரத்தைச் சுட்டினாலும், வசனத்தின் சொற்களுக்குள் முழு உருவக விளக்கத்தைச் சேர்க்காமல் அதன் இறையியல் பதற்றத்தையும் வாசகர் விளக்க இடத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘கட்டிப்போடுதல்’, ‘பறித்துக்கொள்ளுதல்’, ‘கொள்ளையிடுதல்’ ஆகியவை செயற்பாட்டின் முன்னேற்றத்தையும் கிரேக்க வினைகளுக்கிடையிலான வேறுபாட்டையும் தெளிவாகக் காட்டுகின்றன.
