reference: Matthew 12:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Τίς ⸀ἔσται ἐξ ὑμῶν ἄνθρωπος ὃς ἕξει πρόβατον ἕν, καὶ ἐὰν ἐμπέσῃ τοῦτο τοῖς σάββασιν εἰς βόθυνον, οὐχὶ κρατήσει αὐτὸ καὶ ἐγερεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/011.yaml
  text: But he said to them[a], “Which man among you, if he has one sheep and it falls into a pit on the Sabbath[b], will not take hold of it and lift it out?”
translation:
  language: ta
  text: அவர் அவர்களிடம், “உங்களில் எந்த மனிதனிடம் ஒரே ஒரு ஆடு இருந்து, அது ஓய்வுநாளில்[a] ஒரு குழிக்குள் விழுந்தால், அவன் அதைப் பிடித்துத் தூக்கி எடுக்க மாட்டான்[b]?” என்று கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் சொற்படி, “ஓய்வுநாட்களில்”; இங்கு இது “ஓய்வுநாளில்” என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: 'அல்லது: “அதைப் பிடித்து எழுப்ப மாட்டான்?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς ἔσται ἐξ ὑμῶν ἄνθρωπος
  choice: உங்களில் எந்த மனிதனுக்கு
  rationale: எதிர்பார்க்கப்படும் உடன்பாட்டு விடையைக் கொண்ட கிரேக்க வினாவை இயல்பான தமிழில் தருகிறது; ἄνθρωπος என்பதன் ஆண்பால் ஒருமை எடுத்துக்காட்டு வடிவத்தையும் காக்கிறது.
- source_word: πρόβατον ἕν
  choice: ஒரே ஓர் ஆடு
  rationale: ἕν தரும் ஒருமை வலியுறுத்தலைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐὰν ἐμπέσῃ τοῦτο
  choice: அது ... விழுந்துவிட்டால்
  rationale: ஆட்டைக் குறிக்கும் τοῦτο என்பதை இயல்பாக ‘அது’ எனவும், நிபந்தனைச் செயலைத் தமிழுக்குரிய வடிவிலும் தருகிறது.
- source_word: τοῖς σάββασιν
  choice: ஓய்வுநாளில்
  rationale: கிரேக்கப் பன்மை இங்கு ஓய்வுநாளைக் குறிக்கும் மரபுத்தொடர்; தமிழில் ஒருமை இயல்பானது.
- source_word: εἰς βόθυνον
  choice: ஒரு குழிக்குள்
  rationale: βόθυνος என்பதன் பொதுவான ‘குழி’ என்ற பொருளைத் தேவையற்ற வகையில் குறிப்பாக்காமல் தருகிறது.
- source_word: κρατήσει αὐτὸ
  choice: அதைப் பிடித்து
  rationale: κρατέω இங்கு உறுதியாகப் பற்றிக்கொள்வதைக் குறிக்கிறது; ‘பிடித்து’ என்பது தெளிவான, இயல்பான தமிழ்.
- source_word: ἐγερεῖ
  choice: தூக்கிவிட
  rationale: குழியில் விழுந்த ஆட்டை உயர்த்தும் செயலைக் குறிக்கிறது. ‘வெளியே’ என்பது சூழலில் உட்கிடப்பதால் சேர்க்காமல், மூலத்தின் சுருக்கத்தைப் பேணுகிறது.
- source_word: οὐχὶ
  choice: மாட்டான்?
  rationale: நிச்சயமாகச் செய்வான் என்ற உடன்பாட்டு விடையை எதிர்பார்க்கும் வினாவைத் தமிழ் எதிர்மறை வினைமுற்று இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பிரதிநிதித்துவ ஆண்பால் மொழி
  choice: மனிதனுக்கு ... அவன்
  alternative: ஒருவருக்கு ... அவர்
  rationale: மூலத்தின் ஆண்பால் ஒருமை எடுத்துக்காட்டைத் தக்கவைக்கிறது; அதேவேளை இது பொதுவான மனித நிலையைச் சுட்டும் வினா என்ற தன்மையை மாற்றவில்லை.
- issue: σάββασιν என்பதன் பன்மை வடிவம்
  choice: ஓய்வுநாளில்
  alternative: ஓய்வுநாட்களில்
  rationale: இப்பன்மை வடிவம் ஓய்வுநாளைக் குறிக்கும் கிரேக்க மரபுத்தொடராகச் செயல்படுகிறது; தமிழ் ஒருமை விவாதத்தின் சட்டச் சூழலைத் தெளிவாகக் காட்டுகிறது.
- issue: ἐγερεῖ என்பதன் சூழல்சார் பொருள்
  choice: தூக்கிவிட
  alternative: தூக்கி வெளியே எடுக்க
  rationale: கிரேக்க வினை அடிப்படையில் ‘எழுப்புதல்/உயர்த்துதல்’ எனப் பொருள்படும். குழியிலிருந்து வெளியே எடுப்பது சூழலால் தெளிவாக இருந்தாலும், அதை உரையில் முழுமையாக விரிவாக்காமல் மூலத்தின் சொற்படிமத்தைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான உரையாடல் நடை. ‘ஒரே ஓர் ஆடு’ ஒருமையை வலியுறுத்துகிறது. உரையில் உள்ள ஒவ்வொரு அடிக்குறிப்புக் குறியீடும் தொடர்புடைய இடத்தில் இடம்பெற்றுள்ளது.
