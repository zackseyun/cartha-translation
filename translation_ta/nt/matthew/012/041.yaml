source:
  edition: SBLGNT
  text: ἄνδρες Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/041.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the preaching of Jonah, and behold[b], something greater than Jonah is here.
translation:
  language: ta
  text: நினிவேயின் ஆண்கள் நியாயத்தீர்ப்பில் இந்தத் தலைமுறையுடன் எழுந்து நின்று, அதைக் குற்றவாளி என்று தீர்ப்பார்கள்; ஏனெனில், அவர்கள் யோனாவின் அறிவிப்புக்குப் பதிலளித்து[a] மனந்திரும்பினர். இதோ, யோனாவைவிட மேலானது இங்கே இருக்கிறது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யோனாவின் பிரசங்கத்தினால்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “யோனாவைவிட மேலான ஒருவர் இங்கே இருக்கிறார்.” கிரேக்கத்தில் நடுநிலைச் சொற்றொடர் உள்ளது; சொல்லுக்குச் சொல், “யோனாவைவிட மேலானது.” இது வெறும் நபர்களின் ஒப்பீட்டை மட்டுமல்லாமல், இயேசுவில் இங்கே இருக்கும் மேலான யதார்த்தத்தையும் வலியுறுத்தக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: நினிவே நகரத்து ஆண்கள்
  rationale: ἄνδρες என்பதன் வெளிப்படையான ஆண்பால் பொருளைத் தக்கவைத்தும், தமிழில் இயல்பாகவும் நினிவேவுடன் உள்ள தொடர்பைத் தெளிவாக்கியும் மொழிபெயர்க்கிறது.
- source_word: ἀναστήσονται
  choice: எழுந்து நிற்பார்கள்
  rationale: நியாயத்தீர்ப்புச் சூழலில் எழுதல் மற்றும் முன்னின்று நிற்றல் ஆகிய உயிரோட்டமான கருத்துகளைத் தருகிறது; உயிர்த்தெழுதல் சார்ந்த சாத்தியமான நுண்பொருளையும் முற்றிலும் நீக்கவில்லை.
- source_word: ἐν τῇ κρίσει
  choice: நியாயத்தீர்ப்பின்போது
  rationale: இறுதி நீதிநிகழ்வைக் குறிக்கும் κρίσις என்பதைக் சாதாரண வாசகர்களுக்குத் தெளிவான, மரியாதையான தமிழில் அளிக்கிறது.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: இந்தத் தலைமுறையினரோடு
  rationale: μετά உடன் வரும் நேரடியான ‘உடன்’ பொருளைப் பாதுகாக்கிறது; எதிர்மறையான நீதித் தொடர்பு அடுத்த வினையால் வெளிப்படுகிறது.
- source_word: κατακρινοῦσιν αὐτήν
  choice: அதைக் குற்றவாளி என்று தீர்ப்பார்கள்
  rationale: κατακρίνω என்பதன் நீதிமன்றம் சார்ந்த ‘குற்றவாளி எனத் தீர்த்தல்’ பொருளைத் தெளிவாகக் காட்டுகிறது; ‘அது’ என்பது இந்தத் தலைமுறையைக் குறிக்கிறது.
- source_word: μετενόησαν
  choice: மனந்திரும்பினார்கள்
  rationale: தீர்க்கதரிசனச் செய்திக்குப் பதிலாக நிகழ்ந்த மனமாற்றத்தையும் திரும்புதலையும் குறிக்கும் நிலைபெற்ற, இயல்பான தமிழ் வேதாகமச் சொல்லாட்சி.
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: யோனாவின் பிரசங்கத்தைக் கேட்டு
  rationale: κήρυγμα என்பதன் அறிவிப்பு/பிரசங்கப் பொருளையும், εἰς இங்கு சுட்டும் அந்தச் செய்திக்கான பதில்வினையையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை வலியுறுத்தி ஈர்க்கும் ἰδού என்பதன் கம்பீரமான உரையாடல் வலிமையைப் பாதுகாக்கிறது.
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: யோனாவைவிட மேலான ஒன்று இங்கே இருக்கிறது
  rationale: πλεῖον என்ற நடுநிலை ஒருமை ஒப்பீட்டின் வடிவத்தை ‘ஒன்று’ எனப் பாதுகாத்து, வெறும் இரு நபர்களுக்கிடையிலான ஒப்பீடாக மட்டும் உரையைச் சுருக்காமல் விடுகிறது.
theological_decisions:
- issue: πλεῖον Ἰωνᾶ என்பது இயேசுவைக் குறிப்பதை எவ்வாறு மொழிபெயர்ப்பது
  choice: யோனாவைவிட மேலான ஒன்று இங்கே இருக்கிறது
  alternative: யோனாவைவிட மேலான ஒருவர் இங்கே இருக்கிறார்
  rationale: கிரேக்கத்தில் ஆண்பால் ‘ஒருவர்’ என்பதற்குப் பதிலாக நடுநிலை πλεῖον உள்ளது. ஆகவே இயேசுவிலும் அவரது ஊழியத்திலும் இங்கே இருக்கும் மேலான யதார்த்தத்தைச் சுட்டக்கூடிய மூலத்தின் விரிவைத் தீர்மானித்து விடாமல் ‘ஒன்று’ எனப் பாதுகாக்கிறது.
- issue: ἄνδρες என்பதிலுள்ள பாலினக் குறிப்பைத் தக்கவைத்தல்
  choice: ஆண்கள்
  alternative: மக்கள்
  rationale: மூலம் பொதுவான குடிமக்களைக் குறிக்கும் சொல்லைப் பயன்படுத்தாமல், வெளிப்படையாக ஆண்பால் பன்மையான ἄνδρες என்பதையே பயன்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கம்பீரமான நடையில் அமைக்கப்பட்டது. ‘நியாயத்தீர்ப்பு,’ ‘மனந்திரும்புதல்’ போன்ற நிலைபெற்ற இறையியல் சொற்கள் தெளிவுக்காக வைக்கப்பட்டுள்ளன. வழங்கப்பட்ட ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்புக் குறியீடுகளும் அவற்றின் உள்ளடக்கங்களும் பொருந்தாத இடங்களில் இருந்ததால், மூலச் சொற்றொடர்களோடு பொருந்துமாறு [a] பிரசங்கத்திற்குப் பின்னும் [b] ‘மேலான ஒன்று’ என்பதற்குப் பின்னும் இடப்பட்டுள்ளன.
