id: MAT.12.49
reference: Matthew 12:49
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα αὐτοῦ ἐπὶ τοὺς μαθητὰς αὐτοῦ εἶπεν· Ἰδοὺ ἡ μήτηρ μου καὶ οἱ ἀδελφοί μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/049.yaml
  text: And stretching out his hand toward his disciples[a], he said, “Behold[b], my mother and my brothers.”
translation:
  language: ta
  text: அவர் தம் சீடர்களை நோக்கிக் கையை நீட்டி, “இதோ, என் தாயும் என் சகோதரர்களும்!” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκτείνας
  choice: கையை நீட்டி
  rationale: முதன்மை வினைக்கு முன் நிகழும் உடன்செயலை இயல்பான தமிழில் காட்டுகிறது; இயேசுவின் உடல்சைகையையும் தெளிவாகப் பேணுகிறது.
- source_word: χεῖρα
  choice: கையை
  rationale: இச்சூழலில் வழக்கமான, நேரடியான பொருள் ‘கை’ என்பதே.
- source_word: ἐπὶ
  choice: நோக்கி
  rationale: வேற்றுமை அமைப்பும் சைகைச் சூழலும் சீடர்களை நோக்கிய திசையைக் குறிக்கின்றன.
- source_word: μαθητὰς
  choice: சீடர்களை
  rationale: ஆசிரியர்–சீடர் உறவைப் பேணும், நற்செய்தி நூல்களில் நிலைபெற்ற துல்லியமான சொல்.
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து, முன்னிலைப்படுத்தும் ἰδού என்பதன் வலிமையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: μήτηρ
  choice: தாய்
  rationale: குடும்ப உறவைக் குறிக்கும் நேரடியான சொல்.
- source_word: ἀδελφοί
  choice: சகோதரர்கள்
  rationale: கிரேக்கச் சொல் இலக்கணரீதியாக ஆண்பால் பன்மை; இங்கு ‘சகோதர சகோதரிகள்’ அல்லது ‘உடன்பிறந்தோர்’ என்று விரிவுபடுத்தாமல் மூலத்தின் வடிவம் பேணப்படுகிறது.
theological_decisions:
- issue: இயேசு உறவை மறுவரையறை செய்யும் கூற்றிலுள்ள குடும்பச் சொற்கள்
  choice: ‘தாய்’, ‘சகோதரர்கள்’ என்னும் குறிப்பான உறவுச் சொற்களைப் பேணுதல்
  alternative: ‘குடும்பத்தினர்’ அல்லது ‘உடன்பிறந்தோர்’ போன்ற உள்ளடக்க விரிவாக்கம்
  rationale: இயேசு தம் சீடர்களைத் தமது உண்மையான குடும்பமாகச் சுட்டிக்காட்டும் சொல்லாட்சியின் வலிமையை குறிப்பான உறவுச் சொற்கள் பேணுகின்றன; பொதுமைப்படுத்துவது மூலத்தில் வெளிப்படையாக இல்லாத விளக்கத்தைச் சேர்க்கும்.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘தம்’ என்பது எழுவாயாகிய இயேசுவையே திரும்பச் சுட்டுவதால் உறவைத் தெளிவாக்குகிறது; ‘இதோ’ என்பது உயர்நடைச் சுமையின்றி வலியுறுத்தலைப் பேணுகிறது.
