  source_fidelity: 'மூலக் கிரேக்கத்தின் அமைப்பும் பொருளும் துல்லியமாகப் பேணப்பட்டுள்ளன: ἐκτείνας என்பதன் உடன்செயல் ‘கையை நீட்டி’ எனவும், ἐπὶ τοὺς μαθητὰς என்பதன் திசை ‘சீடர்களை நோக்கி’ எனவும், ἰδού என்பதன் கவன ஈர்ப்பு ‘இதோ’ எனவும் இயல்பாக வெளிப்படுகின்றன. ‘என் தாயும் என் சகோதரர்களும்’ என்பது μήτηρ மற்றும் ஆண்பால் பன்மையான ἀδελφοί ஆகியவற்றை விரிவாக்கமின்றி நேரடியாகத் தருகிறது.'
