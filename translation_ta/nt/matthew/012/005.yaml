  source_fidelity: 'கருத்தும் முக்கியமான இலக்கண வேறுபாடுகளும் பாதுகாக்கப்பட்டுள்ளன: ‘ஓய்வுநாட்களில்’ என்ற பன்மை, ‘ஓய்வுநாளை’ என்ற ஒருமை, ஆசாரியர்களின் ஆலயப் பணி, βεβηλοῦσιν என்பதன் வலுவான பொருள், ἀναίτιοι என்பதன் குற்றமின்மை ஆகியவை தெளிவாக உள்ளன. ஆனால் மூலத்தில் இரண்டு நிகழ்கால வினைகள் ‘மற்றும்’ மூலம் இணைக்கப்பட்டுள்ளன; தமிழில் உள்ள ‘புனிதமற்றதாக்கினாலும்’ என்ற விட்டுக்கொடுப்பு வடிவம் அந்தச் சமநிலை இணைப்பை ஓரளவு மாற்றுகிறது.'
