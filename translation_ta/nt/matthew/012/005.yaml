source:
  edition: SBLGNT
  text: ἢ οὐκ ἀνέγνωτε ἐν τῷ νόμῳ ὅτι τοῖς σάββασιν οἱ ἱερεῖς ἐν τῷ ἱερῷ τὸ σάββατον βεβηλοῦσιν καὶ ἀναίτιοί εἰσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/005.yaml
  text: Or have you not read in the Law that on the Sabbaths the priests in the temple profane the Sabbath and are guiltless?[a][b][c]
translation:
  language: ta
  text: அல்லது, ஓய்வுநாட்களில்[b] ஆலயத்தில் ஆசாரியர்கள் ஓய்வுநாளைப் புனிதமற்றதாக்குகிறார்கள்[a]; ஆயினும் அவர்கள் குற்றமற்றவர்களாக இருக்கிறார்கள் என்று திருச்சட்டத்தில் நீங்கள் வாசிக்கவில்லையா?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஓய்வுநாளை மீறுகிறார்கள்’ அல்லது ‘ஓய்வுநாளின் புனிதத்தைக் குலைக்கிறார்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினை, புனிதமான ஒன்றைச் சாதாரணமானதாக அல்லது புனிதமற்றதாக நடத்துவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் ‘ஓய்வுநாட்களில்’ என்று பன்மையில் உள்ளது; இது ஒரே ஒரு நிகழ்வைவிட, தொடர்ந்து வரும் ஓய்வுநாள் நிகழ்வுகளைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: 'இங்குள்ள ‘திருச்சட்டம்’ மோசேயின் சட்டமாகிய வேதப்பகுதியைக் குறிக்கிறது; ஓய்வுநாளில் ஆசாரியர்கள் செய்யவேண்டிய பணிகளைப் பற்றிய விதிமுறைகளும் இதில் அடங்கும் (ஒப்பிடுக: எண்ணிக்கை 28:9–10).'
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: அல்லது
  rationale: இயேசுவின் மறுமொழியில் இன்னொரு வேத ஆதாரத்தை அறிமுகப்படுத்தும் இணைப்பை இயல்பாகத் தக்கவைக்கிறது.
- source_word: οὐκ ἀνέγνωτε
  choice: நீங்கள் வாசிக்கவில்லையா?
  rationale: மத்தேயுவில் காணப்படும் வினாவடிவ வேத மேற்கோள் சூத்திரத்தை இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: ἐν τῷ νόμῳ
  choice: திருச்சட்டத்தில்
  rationale: இது பொதுவான சட்டத்தையல்ல, மோசேயின் சட்டமாகிய வேதப்பகுதியைக் குறிப்பதை உணர்த்துகிறது.
- source_word: τοῖς σάββασιν
  choice: ஓய்வுநாட்களில்
  rationale: கிரேக்கப் பன்மையைத் தக்கவைத்து, மீண்டும் மீண்டும் வரும் ஓய்வுநாள் நிகழ்வுகளைக் குறிக்கிறது.
- source_word: οἱ ἱερεῖς
  choice: ஆசாரியர்கள்
  rationale: ஆலயப் பலிப் பணிகளைச் செய்த யூத ஆசாரியர்களைக் குறிக்கும் வழக்கமான, துல்லியமான சொல்.
- source_word: ἐν τῷ ἱερῷ
  choice: ஆலயத்தில் உள்ள
  rationale: ἱερόν ஆலய வளாகத்தைக் குறிக்கிறது; ‘ஆலயம்’ நவீன தமிழில் இயல்பாகவும் போதுமான துல்லியத்துடனும் உள்ளது.
- source_word: τὸ σάββατον
  choice: ஓய்வுநாளை
  rationale: வினைச்சொல்லின் நேரடிச் செயப்படுபொருளாக உள்ள ஒருமையைத் தக்கவைக்கிறது.
- source_word: βεβηλοῦσιν
  choice: புனிதமற்றதாக்கினாலும்
  rationale: புனிதமான ஒன்றைச் சாதாரணமானதாக அல்லது புனிதமற்றதாக நடத்துதல் என்ற வினையின் வலிமையைத் தக்கவைக்கிறது; ‘-ஆலும்’ வடிவம் அடுத்துவரும் குற்றமின்மையுடன் உள்ள முரண்பாட்டை இயல்பான தமிழில் இணைக்கிறது.
- source_word: ἀναίτιοί εἰσιν
  choice: குற்றமற்றவர்களாக இருக்கிறார்கள்
  rationale: சட்டரீதியான பழிப்புக்கு உட்படாத நிலையைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ஆசாரியர்கள் உண்மையில் ஓய்வுநாளை மீறினார்கள் என்ற எண்ணத்தைத் தவிர்க்க வினையின் வலிமையைக் குறைக்க வேண்டுமா?
  choice: ‘ஓய்வுநாளைப் புனிதமற்றதாக்கினாலும் ... குற்றமற்றவர்களாக இருக்கிறார்கள்’ என்ற வலுவான முரண்பாட்டைத் தக்கவைத்தல்
  alternative: ‘ஓய்வுநாள் விதியை மீறினாலும் குற்றமற்றவர்கள்’ அல்லது ஆலயப் பணி விதிவிலக்கு என்று வெளிப்படையாக விளக்குதல்
  rationale: கிரேக்க உரை வலுவான வினையையும் குற்றமின்மையையும் அருகருகே வைத்து நோக்கமுள்ள இறையியல் மற்றும் வாதரீதியான பதற்றத்தை உருவாக்குகிறது. மொழிபெயர்ப்பு அதை மென்மையாக்கவோ விளக்கத்தின் மூலம் தீர்த்துவிடவோ கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘ஆசாரியர்கள்,’ ‘ஆலயம்,’ ‘திருச்சட்டம்’ ஆகிய சொற்கள் யூத வேதச் சூழலைத் தெளிவாகக் காட்டுகின்றன. கிரேக்க உரையின் ஒருமை–பன்மை வேறுபாடும், ‘புனிதமற்றதாக்குதல்’ மற்றும் ‘குற்றமின்மை’ ஆகியவற்றுக்கிடையிலான நோக்கமுள்ள பதற்றமும் பாதுகாக்கப்பட்டுள்ளன.
