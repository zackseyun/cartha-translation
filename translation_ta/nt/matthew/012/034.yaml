id: MAT.12.34
reference: Matthew 12:34
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: γεννήματα ἐχιδνῶν, πῶς δύνασθε ἀγαθὰ λαλεῖν πονηροὶ ὄντες; ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας τὸ στόμα λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/034.yaml
  text: Offspring of vipers[b][a], how can you speak good things when you are evil? For out of the overflow of the heart the mouth speaks.
translation:
  language: ta
  text: விரியன் பாம்புகளின் சந்ததிகளே[a], தீயவர்களாக இருக்கிற நீங்கள் எப்படி நல்லவற்றைப் பேச முடியும்? ஏனெனில், இதயத்தில் நிறைந்திருப்பதிலிருந்தே[b] வாய் பேசுகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விரியன் பாம்புக் கூட்டமே.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இதயத்தின் மிகுதியிலிருந்து.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γεννήματα ἐχιδνῶν
  choice: விரியன் பாம்புகளின் சந்ததிகளே
  rationale: γεννήματα என்பது பிறப்பிக்கப்பட்டவை அல்லது சந்ததி என்பதையும், ἐχιδνῶν என்பது விரியன் பாம்புகளையும் குறிக்கிறது. இந்தச் சொற்றொடர் வம்சத்தையும் குணத்தையும் சுட்டும் கடுமையான உருவகத்தைக் காக்கிறது.
- source_word: πῶς δύνασθε
  choice: எப்படி ... முடியும்?
  rationale: இது இயலாமையை வலியுறுத்தும் வினாவாக உள்ளது; நவீனத் தமிழில் இயல்பாகவும் மூலத்தின் கண்டனத் தொனியுடனும் அமைகிறது.
- source_word: ἀγαθὰ λαλεῖν
  choice: நல்லவற்றைப் பேச
  rationale: ἀγαθά இங்கு பெயர்ச்சொல்லாகப் பயன்படும் பன்மை வடிவம்; ‘நல்லவற்றைப் பேச’ என்பது அதன் பொருளையும் பொதுமையையும் காக்கிறது.
- source_word: πονηροὶ ὄντες
  choice: தீயவர்களாக இருக்கிற நீங்கள்
  rationale: இந்தப் பங்கேற்பு அமைப்பு வினாவுக்குரிய சூழ்நிலையைத் தருகிறது. ‘தீயவர்கள்’ என்பது πονηροί என்பதன் அறநெறிசார் கடுமையை மென்மைப்படுத்தாமல் தெரிவிக்கிறது.
- source_word: ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας
  choice: ஏனெனில், இதயத்தின் பெருக்கிலிருந்தே
  rationale: περίσσευμα என்பது மிகுதி, நிறைவு அல்லது நிரம்பி வழிதலைக் குறிக்கலாம். ‘பெருக்கு’ உள்ளே மிகுந்திருப்பதிலிருந்து சொல் வெளிப்படும் உருவகத்தைச் சுருக்கமாகக் காக்கிறது; ἐκ என்பதற்கான தோற்றுவாய்ப் பொருளை ‘இலிருந்தே’ தெளிவாக்குகிறது.
- source_word: τὸ στόμα λαλεῖ
  choice: வாய் பேசுகிறது
  rationale: உள்ளார்ந்த நிலைக்கும் வெளிப்படும் பேச்சுக்கும் இடையிலான தொடர்பை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: καρδία என்பதன் உருவகப் பொருள்
  choice: இதயம்
  alternative: உள்ளம்; மனம்
  rationale: καρδία வெறும் உணர்ச்சியை மட்டும் அல்லாமல் எண்ணம், விருப்பம் உள்ளிட்ட அகமனிதரின் மையத்தைக் குறிக்கிறது. ‘இதயம்’ என்ற வேதாகம உருவகத்தை வைத்திருப்பது பொருளை ஒரு மனத்திறனுக்குள் சுருக்காமல் காக்கிறது.
- issue: πονηροὶ ὄντες என்பதிலுள்ள அறநெறிசார் மதிப்பீடு
  choice: தீயவர்களாக இருக்கிற
  alternative: கெட்டவர்களாக இருக்கிற; பொல்லாதவர்களாக இருக்கிற
  rationale: இங்கு தரம் குறைவாக இருப்பது அல்ல, அறநெறிசார் தீமை கண்டிக்கப்படுகிறது. ‘தீய’ அந்த வலிமையைத் தக்கவைத்து, ‘பொல்லாத’ என்பதைக் காட்டிலும் நவீன வாசகர்களுக்கு நேரடியாக உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் கண்டனத்தின் கடுமையும் உருவக மொழியும் குறையாத வகையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘சந்ததிகளே’ மற்றும் ‘இதயத்தின் பெருக்கு’ ஆகியவை சற்றே உயர்ந்த, ஆனால் இன்றும் தெளிவான கண்ணியமான நடையை வழங்குகின்றன.
