review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the rebuke, the rhetorical force of πῶς δύνασθε, the moral force of πονηροὶ, and the heart-to-speech imagery. However, ‘இதயத்தின் பெருக்கு’ can naturally suggest a surge or swelling rather than the Greek περισσεύματος, ‘that which is abundant/overflows.’
  naturalness: ‘இதயத்தில் நிறைந்திருப்பதிலிருந்து’ is clearer and more idiomatic in modern standard Tamil while retaining the metaphor of speech proceeding from inward fullness. The remaining wording is direct, dignified, and suitably forceful.
  terminology: ‘விரியன் பாம்புகளின் சந்ததிகளே’ preserves the metaphorical lineage language of γεννήματα ἐχιδνῶν. ‘தீயவர்கள்,’ ‘இதயம்,’ and ‘வாய் பேசுகிறது’ are suitable, accurate biblical-register terms without imposing an interpretation.
  issues:
