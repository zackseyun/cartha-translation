source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἰδόντες εἶπαν αὐτῷ· Ἰδοὺ οἱ μαθηταί σου ποιοῦσιν ὃ οὐκ ἔξεστιν ποιεῖν ἐν σαββάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/002.yaml
  text: But when the Pharisees saw it[a], they said to him, “Look, your disciples are doing what is not lawful to do on the Sabbath.”
translation:
  language: ta
  text: ஆனால், பரிசேயர்கள் அதைக் கண்டபோது, அவரிடம், “இதோ, உம்முடைய சீடர்கள் ஓய்வுநாளில் செய்ய அனுமதிக்கப்படாததைச் செய்கிறார்கள்” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: பரிசேயர்கள் அதைக் கண்டபோது
  rationale: தமிழில் இயல்பான நிகழ்வுத் தொடரில் மாறுபாடு சூழலால் வெளிப்படுவதால் தனியே ‘ஆனால்’ சேர்க்காமல் δὲ-ஐ மென்மையான தொடரிணைப்பாக வெளிப்படுத்துகிறது.
- source_word: ἰδόντες
  choice: அதைக் கண்டபோது
  rationale: இறந்தகாலப் பங்கேற்புச் சொல்லை இயல்பான காலத் துணைவாக்கியமாக மொழிபெயர்க்கிறது; ‘அதை’ என்பது முந்தைய வசனத்தில் சீடர்கள் செய்த செயலைக் குறிக்கிறது.
- source_word: εἶπαν αὐτῷ
  choice: அவரிடம் ... என்றார்கள்
  rationale: கிரேக்க மொழியின் நடுநிலையான பேச்சுச் சூத்திரத்தை இயல்பான தமிழ்ச் சொல் வரிசையில் தருகிறது.
- source_word: Ἰδοὺ
  choice: பாரும்
  rationale: குற்றச்சாட்டின்மீது கவனத்தை ஈர்க்கும் இடைச்சொல்லின் வலிமையை, இயேசுவை ஒருமையில் மரியாதையுடன் விளிக்கும் வடிவில் காக்கிறது.
- source_word: μαθηταί
  choice: சீடர்கள்
  rationale: ஆசிரியர்–சீடர் உறவைத் துல்லியமாகக் காட்டும், நற்செய்தி நூல்களில் நிலைபெற்ற தமிழ் சொல்.
- source_word: ποιοῦσιν ... ποιεῖν
  choice: செய்ய ... செய்கிறார்கள்
  rationale: ποιέω என்ற ஒரே வினையின் மறுபயன்பாட்டை முடிந்தவரை காத்து, தமிழில் இயல்பான அமைப்பை வழங்குகிறது.
- source_word: ὃ οὐκ ἔξεστιν
  choice: செய்ய அனுமதிக்கப்படாததை
  rationale: ἔξεστιν என்பதன் அனுமதி/உரிமை சார்ந்த பொருளைத் துல்லியமாகத் தருகிறது; எந்தச் சட்ட மூலத்தைக் குறிக்கிறது என்பதை மொழிபெயர்ப்பு தீர்மானிப்பதில்லை.
- source_word: ἐν σαββάτῳ
  choice: ஓய்வுநாளில்
  rationale: சபத்தை குறிக்கும் நிலைபெற்ற, பொதுவாகப் புரியும் தமிழ்ச் சொல்லையும் இயல்பான கால வேற்றுமையையும் பயன்படுத்துகிறது.
theological_decisions:
- issue: பரிசேயர்களின் குற்றச்சாட்டின் சட்ட அடிப்படை
  choice: ‘செய்ய அனுமதிக்கப்படாததை’ என்று சட்ட-அனுமதி சார்ந்த மொழியில் வழங்குதல்
  alternative: ‘சட்டத்திற்கு முரணானதை’ அல்லது ‘செய்வது முறையல்லாததை’
  rationale: வசனம் குற்றச்சாட்டை மட்டும் முன்வைக்கிறது; அது வேதாகமச் சட்டத்தையா பரிசேய மரபையா சார்ந்தது என்றும், குற்றச்சாட்டு சரியா என்றும் இங்கே தீர்ப்பளிக்கவில்லை. ‘அனுமதிக்கப்படாதது’ இந்தத் தெளிவின்மையையும் இறையியல் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதும் கண்ணியமானதும். இயேசுவை நோக்கிய ஒருமை மரியாதை வடிவமாக ‘உம்முடைய’ மற்றும் ‘பாரும்’ பயன்படுத்தப்பட்டுள்ளன. தேவையற்ற விளக்கவுரையோ சமயப்பிரிவு சார்ந்த சட்டத் தீர்மானமோ சேர்க்கப்படவில்லை.
