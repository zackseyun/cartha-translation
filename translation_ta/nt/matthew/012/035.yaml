id: MAT.12.35
reference: Matthew 12:35
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ ἀγαθὸς ἄνθρωπος ἐκ τοῦ ἀγαθοῦ θησαυροῦ ἐκβάλλει ἀγαθά, καὶ ὁ πονηρὸς ἄνθρωπος ἐκ τοῦ πονηροῦ θησαυροῦ ἐκβάλλει πονηρά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/035.yaml
  text: The good man brings out good things from his good treasure[b][a], and the evil man brings out evil things from his evil treasure.
translation:
  language: ta
  text: நல்ல மனிதன்[a] நல்ல கருவூலத்திலிருந்து நல்லவற்றை வெளிக்கொணர்கிறான்; தீய மனிதன் தீய கருவூலத்திலிருந்து தீயவற்றை வெளிக்கொணர்கிறான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மனிதன்” என்பதற்குப் பதிலாக “ஒருவர்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் ஆண்பால் ஒருமை இருந்தாலும், இங்கே அது பொதுவாக ஒரு மனிதரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: உடனடிச் சூழல் பேச்சைப் பற்றியது; ஆகவே “நல்லவை”, “தீயவை” என்பவை குறிப்பாக நல்ல சொற்களையும் தீய சொற்களையும் குறிக்கலாம்.
    reason: cross_reference
lexical_decisions:
- source_word: ἀγαθὸς / ἀγαθά
  choice: நல்ல / நல்லவற்றை
  rationale: ஒரே கிரேக்கச் சொல்லின் மீளுருவத்தையும், மனிதனுக்கும் அவன் வெளிக்கொணர்பவற்றுக்கும் இடையிலான தொடர்பையும் தமிழில் காக்கிறது.
- source_word: ἄνθρωπος
  choice: மனிதன்
  rationale: ஆண்பால் ஒருமையில் உள்ள கிரேக்கச் சொல்லை பழமொழி போன்ற இணையான வாக்கிய அமைப்பில் பிரதிநிதித்துவ ஒருமையாக வழங்குகிறது; இது ஆணை மட்டும் குறிக்கவில்லை என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: θησαυρός
  choice: கருவூலம்
  rationale: உள்ளே சேமித்து வைக்கப்பட்டிருக்கும் வளத்திலிருந்து ஒன்று வெளிவரும் உருவகத்தைப் பேணுகிறது; ‘பொக்கிஷம்’ என்பதைவிட இச்சூழலில் சேமிப்பிடம் என்ற நுண்பொருளையும் இயல்பாகத் தருகிறது.
- source_word: ἐκβάλλει
  choice: வெளிக்கொணர்கிறான்
  rationale: ἐκβάλλει என்பதிலுள்ள உள்ளிருந்து வெளியே கொண்டுவரும் இயக்கத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; ‘உற்பத்தி செய்கிறான்’ உருவகத்தைத் தளர்த்திவிடும்.
- source_word: πονηρὸς / πονηρά
  choice: தீய / தீயவற்றை
  rationale: ἀγαθός என்பதற்கெதிரான வலுவான அறநெறி முரண்பாட்டையும், மூலத்தின் இணையான சொல் மீளுருவத்தையும் காக்கிறது.
- source_word: ἐκ
  choice: -இலிருந்து
  rationale: கருவூலமே வெளிவருவதற்கான மூலமாக இருப்பதைத் தெளிவாகக் குறிக்கிறது; ‘வெளிக்கொணர்கிறான்’ என்பதுடன் சேர்ந்து மூலத்தின் இயக்கப் படிமத்தையும் பேணுகிறது.
theological_decisions:
- issue: ஒருவரின் உள்ளார்ந்த அறநிலைக்கும் அவர் வெளிப்படுத்துபவற்றுக்கும் இடையிலான தொடர்பு
  choice: ‘நல்லவற்றை’ மற்றும் ‘தீயவற்றை’ என்ற பரந்த சொல்லாக்கம்
  alternative: உடனடிச் சூழலின் அடிப்படையில் இதை ‘நல்ல சொற்கள்’ மற்றும் ‘தீய சொற்கள்’ என்று குறுக்குதல்
  rationale: முந்தையதும் பிந்தையதுமான சூழல் பேச்சைப் பற்றியது. இருப்பினும், கிரேக்கத்தில் வெளிப்படையான பெயர்ச்சொல் இல்லாமல் பெயர்ச்சொல்லாகப் பயன்படும் பன்மை உரிச்சொற்களே உள்ளன. ஆகவே மூலத்தின் பரந்த பொருளை முதன்மை உரை காக்கிறது; பேச்சைக் குறிக்கும் சாத்தியத்தை அடிக்குறிப்பு தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பழமொழி போன்ற சமச்சீர் அமைப்பும் ‘நல்ல/தீய’, ‘கருவூலம்’, ‘வெளிக்கொணர்கிறான்’ ஆகிய சொல் மீளுருவங்களும் திட்டமிட்டுப் பேணப்பட்டுள்ளன. நடை கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியத்தக்கதுமாக உள்ளது.
