source:
  edition: SBLGNT
  text: Ἢ ποιήσατε τὸ δένδρον καλὸν καὶ τὸν καρπὸν αὐτοῦ καλόν, ἢ ποιήσατε τὸ δένδρον σαπρὸν καὶ τὸν καρπὸν αὐτοῦ σαπρόν· ἐκ γὰρ τοῦ καρποῦ τὸ δένδρον γινώσκεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/033.yaml
  text: Either make the tree good and its fruit good[a], or make the tree rotten and its fruit rotten[b]; for the tree is known by its fruit.
translation:
  language: ta
  text: “மரத்தை நல்லதாகவும் அதன் கனியை நல்லதாகவும் ஆக்குங்கள்; அல்லது மரத்தை அழுகியதாகவும்[a] அதன் கனியை அழுகியதாகவும் ஆக்குங்கள்[b]. ஏனெனில், மரம் அதன் கனியால் அறியப்படுகிறது.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அழுகிய’ என்பதற்குப் பதிலாக ‘கெட்ட’ அல்லது ‘பயனற்ற’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் கெட்டுப்போன, சீர்குலைந்த, அல்லது மதிப்பற்ற ஒன்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: மீண்டும் வரும் ‘ஆக்குங்கள்’ என்பது சொல்லாட்சிசார் வகையில் ‘நல்லது/அழுகியது என்று கருதுங்கள்’ அல்லது ‘அவ்வாறு இருப்பதாகக் காட்டுங்கள்’ என்றும் பொருள்படலாம்; ஆனால் கிரேக்கத்தில் ஏவல் வடிவமே உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσατε
  choice: நல்லதாக்குங்கள் / கெட்டுப்போனதாக்குங்கள்
  rationale: இறந்தகால ஏவல் பன்மையின் நேரடியான கட்டளைத் தொனியையும் இரு கூறுகளின் இணை அமைப்பையும் காக்கிறது. சூழலில் ‘அவ்வாறு கருதுங்கள்’ என்ற சொல்லாட்சிசார் வலிமை இருக்கக்கூடும்; அதை உரையிலேயே தீர்மானித்து விடவில்லை.
- source_word: δένδρον
  choice: மரம்
  rationale: உருவகத்தின் மையப் படிமத்தை இயல்பாகவும் நேரடியாகவும் தரும் வழக்கமான தமிழ் சொல்.
- source_word: καλός
  choice: நல்ல
  rationale: தரம் மற்றும் ஒழுக்கப் பொருள் ஆகிய இரண்டின் எதிரொலியையும் காக்கிறது; ‘ஆரோக்கியமான’ என்பது பொருளை உடல்நிலைக்குள் குறுக்கிவிடும்.
- source_word: καρπός
  choice: கனி
  rationale: மரத்தின் விளைவையும் உருவகப் பொருளையும் இயல்பாக வெளிப்படுத்தும் இலக்கியமும் பொதுவழக்குமுமான தமிழ் சொல்.
- source_word: σαπρός
  choice: கெட்டுப்போன
  rationale: அழுகிய, சீர்கெட்ட, பயனற்ற என்ற பொருள் வளத்தைத் தாங்கி, மரத்திற்கும் கனிக்கும் பொருந்துகிறது. ‘கெட்ட’ என்பதைவிட மூலத்தின் தீவிரமான படிமத்தை நன்கு காக்கிறது.
- source_word: ἐκ γὰρ τοῦ καρποῦ
  choice: ஏனெனில் ... அதன் கனியால்
  rationale: γάρ தரும் விளக்க உறவை ‘ஏனெனில்’ காட்டுகிறது; ἐκ என்பதன் அடிப்படையிலான அறிதலைத் தமிழில் இயல்பாக ‘கனியால்’ எனத் தருகிறது.
- source_word: γινώσκεται
  choice: அறியப்படுகிறது
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவத்தை தெளிவாகவும் நேரடியாகவும் காக்கிறது.
theological_decisions:
- issue: இயேசுவின் உருவகத்தில் ஏவல்களின் வலிமை
  choice: ‘நல்லதாக்குங்கள் ... கெட்டுப்போனதாக்குங்கள்’ என்ற நேரடி ஏவல் வடிவம் காக்கப்பட்டது.
  alternative: ‘மரத்தை நல்லது என்று கருதுங்கள் ...’ அல்லது ‘மரத்தை நல்லதென்று காட்டுங்கள் ...’
  rationale: கிரேக்கத்தில் இருமுறை ஏவல் வடிவமே உள்ளது. அது சொல்லாட்சிசார் சவாலாக ‘கருதுங்கள்/வகைப்படுத்துங்கள்’ எனச் செயல்படக்கூடும்; எனினும் நேரடி வடிவத்தை வைத்திருப்பது அந்தத் திணறலையும் இயேசுவின் கூர்மையான வாதத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. இணை அமைப்பும் நேரடி ஏவல் தொனியும் பாதுகாக்கப்பட்டுள்ளன; ‘கெட்டுப்போன’ என்பது மரம் மற்றும் கனி இரண்டிற்கும் ஒரேபோல் இயங்கும்படி தேர்ந்தெடுக்கப்பட்டது.
