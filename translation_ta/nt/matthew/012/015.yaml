  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘விலகிச் சென்றார்’ என்பது மூலத்தின் சூழல்சார் நுட்பத்தையும், ‘பலர்’ என்பது πολλοί என்பதன் அளவான பொருளையும் பாதுகாக்கின்றன.
