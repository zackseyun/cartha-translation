id: MAT.12.15
reference: Matthew 12:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς γνοὺς ἀνεχώρησεν ἐκεῖθεν. καὶ ἠκολούθησαν ⸀αὐτῷ πολλοί, καὶ ἐθεράπευσεν αὐτοὺς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/015.yaml
  text: But Jesus[a], knowing this, withdrew from there. And many followed him, and he healed them all,
translation:
  language: ta
  text: ஆனால் இயேசு இதை[a] அறிந்து, அங்கிருந்து விலகிச் சென்றார். பலர் அவரைப் பின்தொடர்ந்தார்கள்; அவர் அவர்கள் எல்லாரையும் குணமாக்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அறிந்து, அங்கிருந்து விலகிச் சென்றார்.’ ‘அறிந்து’ என்பதன் செயப்படுபொருளைக் கிரேக்க மூலம் வெளிப்படையாகக் கூறவில்லை; முந்தைய வசனத்தின் சூழல் அதைத் தெரிவிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: இதை அறிந்து
  rationale: γινώσκω என்பதன் இறந்தகால வினையெச்சம், அடுத்த முக்கியச் செயலுக்கு முன்னதாக ஏற்பட்ட அறிதலைக் குறிக்கிறது. எதை அறிந்தார் என்பது கிரேக்கத்தில் வெளிப்படையாகச் சொல்லப்படவில்லை; முந்தைய வசனத்தில் பரிசேயர்கள் செய்த ஆலோசனையைச் சூழல் சுட்டுகிறது. ‘இதை அறிந்து’ என்பது அந்தத் தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: ἀνεχώρησεν
  choice: விலகிச் சென்றார்
  rationale: மத்தேயுவில் ἀναχωρέω எதிர்ப்பு அல்லது ஆபத்து ஏற்பட்ட சூழலில் ஓர் இடத்திலிருந்து நோக்கத்துடன் விலகிச் செல்வதைக் குறிக்கக்கூடும். ‘விலகிச் சென்றார்’ என்பது வெறுமனே ‘சென்றார்’ என்பதைவிட அந்த நுட்பத்தைத் தெளிவாகப் பாதுகாக்கிறது; பயந்து ஓடியதாகவும் கூறுவதில்லை.
- source_word: ἐκεῖθεν
  choice: அங்கிருந்து
  rationale: ஓர் இடத்திலிருந்து அகன்று செல்லுதலைக் குறிக்கும் இயல்பான, சுருக்கமான தமிழ் சொல்.
- source_word: ἠκολούθησαν αὐτῷ πολλοί
  choice: பலர் அவரைப் பின்தொடர்ந்தார்கள்
  rationale: πολλοί என்பதற்கு ‘பலர்’ என்பதே நேரான பொருள்; மூலத்தில் ‘திரளான மக்கள்’ என்பதற்கான தனிச் சொல் இல்லை. தமிழ் வாக்கிய அமைப்புக்கேற்ப இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: ἐθεράπευσεν
  choice: குணமாக்கினார்
  rationale: நற்செய்தி நூல்களின் நோய்நீக்கும் சூழலில் θεραπεύω என்பதற்கான தெளிவான, வழக்கமான தமிழ் இணைச்சொல்.
- source_word: αὐτοὺς πάντας
  choice: அவர்கள் எல்லாரையும்
  rationale: πάντας என்பதன் முழுமையான பரப்பைத் தெளிவாகப் பாதுகாக்கிறது; பின்தொடர்ந்த பலரையே சுட்டும் வகையில் இயல்பான தமிழில் அமைந்துள்ளது.
theological_decisions:
- issue: γνοὺς என்பதன் வெளிப்படையாகக் கூறப்படாத செயப்படுபொருள்
  choice: முந்தைய வசனத்தில் கூறப்பட்ட பகைமையான ஆலோசனையை இயேசு அறிந்தார் என்பதைக் ‘இதை அறிந்து’ எனச் சூழலுடன் இணைத்தல்
  alternative: ‘அறிந்து’ என்று மட்டும் மொழிபெயர்த்து, எதை அறிந்தார் என்பதை வெளிப்படையாகக் குறிப்பிடாமல் விடுதல்
  rationale: கிரேக்க வினையெச்சத்துக்கு இவ்வசனத்தில் செயப்படுபொருள் இல்லை. ‘இதை’ என்பது முந்தைய வசனத்துடனான இயல்பான தொடர்பை மட்டும் காட்டுகிறது; பகைவர்களின் திட்டத்தைப் பற்றிய மேலதிக விவரத்தையோ கோட்பாட்டையோ சேர்ப்பதில்லை.
- issue: இயேசு அங்கிருந்து சென்றதன் நுட்பம்
  choice: விலகிச் சென்றார்
  alternative: புறப்பட்டுச் சென்றார் / சென்றுவிட்டார்
  rationale: எதிர்ப்புக்குப் பதிலாக நோக்கத்துடன் இடத்தைவிட்டு அகன்றதைச் சொல்கிறது; அதே நேரத்தில் பயம் அல்லது கோழைத்தனம் என்ற கருத்தைத் திணிப்பதில்லை.
