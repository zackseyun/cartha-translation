  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ καὶ τοὺς ἄρτους τῆς προθέσεως ⸂ἔφαγον, ὃ⸃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν οὐδὲ τοῖς μετ’ αὐτοῦ, εἰ μὴ τοῖς ἱερεῦσιν μόνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/004.yaml
  text: how he entered into the house of God and ate the bread of the Presence[a], which it was not lawful for him to eat, nor for those with him[b], but only for the priests?
translation:
  language: ta
  text: அவன் எப்படித் தேவனுடைய இல்லத்திற்குள் நுழைந்து, தேவசமுகத்து அப்பங்களை அவனும் அவனுடன் இருந்தவர்களும் சாப்பிட்டார்கள்[a] என்பதையும், அவனுக்கும் அவனுடன் இருந்தவர்களுக்கும் அவற்றைச் சாப்பிடச் சட்டப்படி அனுமதிக்கப்படவில்லை என்பதையும், ஆசாரியர்களுக்கு மட்டுமே அனுமதிக்கப்பட்டிருந்தது என்பதையும் நீங்கள் வாசிக்கவில்லையா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “அவன் சாப்பிட்டான்” என்று ஒருமையில் உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: πῶς
  choice: எப்படி
  rationale: தாவீதைக் குறித்த நிகழ்வு எவ்வாறு நடந்தது என்பதை அறிமுகப்படுத்தும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: தேவனுடைய இல்லத்திற்குள் நுழைந்து
  rationale: கிரேக்கத்தின் ‘தேவனுடைய இல்லம்’ என்ற சொல்லாட்சியைப் பாதுகாக்கிறது; சூழலின் கூடாரத்தை விளக்கமாக உரைக்குள் சேர்க்கவில்லை.
- source_word: τοὺς ἄρτους τῆς προθέσεως
  choice: தேவசமுகத்து அப்பங்கள்
  rationale: தேவனுக்கு முன்பாக வைக்கப்பட்ட அர்ப்பணிக்கப்பட்ட அப்பங்கள் என்ற வழிபாட்டுச் சார்ந்த பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἔφαγον
  choice: அவர்களுடன் சேர்ந்து சாப்பிட்டான்
  rationale: SBLGNT இன் பன்மை வினைமுற்றின் பொருளையும், தொடரும் ‘அவனுடன் இருந்தவர்கள்’ என்ற குறிப்பையும் தமிழில் தெளிவாக வெளிப்படுத்துகிறது; வாக்கியத்தின் முதன்மை நபரான தாவீதுடனான தொடர்பும் காக்கப்படுகிறது.
- source_word: ὃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν
  choice: அவன் அவற்றைச் சாப்பிடுவது நியாயப்பிரமாணத்தின்படி அனுமதிக்கப்பட்டிருக்கவில்லை
  rationale: ἐξὸν என்பதன் சட்ட மற்றும் வழிபாட்டு வலிமையை வெறும் பொதுவான அனுமதியின்மையாக அல்லாமல் நியாயப்பிரமாணத்துடன் தொடர்புபடுத்தி வெளிப்படுத்துகிறது.
- source_word: οὐδὲ τοῖς μετ’ αὐτοῦ
  choice: அவனுடன் இருந்தவர்களோ
  rationale: தாவீதுடன் சென்றவர்களை மிகை விளக்கமின்றி இயல்பான தமிழில் குறிக்கிறது.
- source_word: εἰ μὴ τοῖς ἱερεῦσιν μόνοις
  choice: ஆசாரியர்கள் மட்டுமே
  rationale: விதிவிலக்கையும் μόνοις குறிக்கும் தனிப்பட்ட உரிமையையும் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: ἐξὸν என்பதன் வழிபாட்டு மற்றும் சட்ட வலிமை
  choice: நியாயப்பிரமாணத்தின்படி அனுமதிக்கப்பட்டிருக்கவில்லை
  alternative: அனுமதிக்கப்படவில்லை
  rationale: இது வெறும் சமூக வழக்கமல்ல, தோராவின் பரிசுத்த வழிபாட்டு ஒழுங்கைச் சார்ந்த கட்டுப்பாடு என்பதைத் தெரிவிக்கிறது; அதற்கு அப்பாற்பட்ட கோட்பாட்டைச் சேர்க்கவில்லை.
- issue: ἔφαγον என்பதன் உரைவேறுபாடும் எழுவாயும்
  choice: 'முதன்மை உரையில் பன்மைப் பொருள்: ‘அவர்களுடன் சேர்ந்து சாப்பிட்டான்’'
  alternative: 'ஒருமைப் பொருள்: ‘அவன் சாப்பிட்டான்’'
  rationale: கொடுக்கப்பட்ட SBLGNT உரையில் வினை பன்மையில் உள்ளது. தமிழில் தாவீதை மையப்படுத்தியபடியே அவனுடன் இருந்தவர்களும் சாப்பிட்டனர் என்ற பன்மைப் பொருள் வெளிப்படுத்தப்பட்டது; ஒருமை வாசிப்பு அடிக்குறிப்பில் பதிவு செய்யப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் வேதாகமச் சூழலுக்குரிய கண்ணியமும் கொண்ட நடை. ‘தேவசமுகத்து அப்பங்கள்’ என்பது பாரம்பரிய வழிபாட்டுச் சொல்லாட்சியை வாசிக்க எளிய வடிவில் காக்கிறது. வசனம் முந்தைய வசனத்தில் தொடங்கிய ‘நீங்கள் வாசிக்கவில்லையா?’ என்ற கேள்வியின் தொடர்ச்சியாக இயற்கையாக அமைக்கப்பட்டுள்ளது.
