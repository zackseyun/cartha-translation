id: MAT.12.27
reference: Matthew 12:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἰ ἐγὼ ἐν Βεελζεβοὺλ ἐκβάλλω τὰ δαιμόνια, οἱ υἱοὶ ὑμῶν ἐν τίνι ἐκβάλλουσιν; διὰ τοῦτο αὐτοὶ ⸂κριταὶ ἔσονται ὑμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/027.yaml
  text: And if I cast out demons by Beelzebul[a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: ta
  text: மேலும், நான் பெயல்செபூலால்[a] பேய்களைத் துரத்துகிறேன் என்றால், உங்கள் மகன்கள் யாரால் அவற்றைத் துரத்துகிறார்கள்? ஆகவே, அவர்களே உங்கள் நீதிபதிகளாக இருப்பார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'கிரேக்கத்தில்: “பெயல்செபூல்”; பாரம்பரியமாக “பெயல்செபூப்” என்றும் வழங்கப்படுகிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν Βεελζεβοὺλ
  choice: பெயெல்செபூலால்
  rationale: இங்கு ἐν என்பது கருவி அல்லது செயலாற்றும் வழியைச் சுட்டுகிறது. ஆகவே, இயல்பான தமிழில் பெயருடன் ‘-ஆல்’ வேற்றுமை உருபு பயன்படுத்தப்பட்டுள்ளது. SBLGNT-இல் உள்ள Βεελζεβούλ என்ற பெயர்வடிவம் ‘பெயெல்செபூல்’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: பேய்களைத் துரத்துகிறேன்
  rationale: பேயோட்டும் சூழலில் ἐκβάλλω என்பது வலுக்கட்டாயமாக வெளியேற்றுவதைக் குறிக்கிறது; ‘துரத்து’ என்பது இதை இயல்பாகத் தெரிவிக்கிறது. δαιμόνια என்பதற்கு ‘பேய்கள்’ என மொழிபெயர்ப்பது διάβολος என்பதிலிருந்து உள்ள சொல்வேறுபாட்டையும் காக்கிறது.
- source_word: οἱ υἱοὶ ὑμῶν
  choice: உங்கள் மகன்கள்
  rationale: கிரேக்கத்தின் நேரடியான உறவுமுறைச் சொல்லைத் தக்கவைக்கிறது. சூழலில் இது கேட்போரின் குழுவைச் சேர்ந்தவர்களையோ சீடர்களையோ குறிக்கக்கூடும்; ஆனால் அந்த விளக்கத்தை முதன்மை உரைக்குள் சேர்க்கவில்லை.
- source_word: ἐν τίνι
  choice: யாரால்
  rationale: முந்தைய ἐν போலவே இது செயலாற்றும் நபர் அல்லது ஆற்றலைக் கேட்கும் கருவிப்பொருளில் வருகிறது. ‘யாரால்’ என்பது சுருக்கமான, இயல்பான தமிழ்.
- source_word: διὰ τοῦτο
  choice: ஆகவே
  rationale: முந்தைய வினாவிலிருந்து வரும் முடிவைச் சுருக்கமாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: κριταὶ ἔσονται ὑμῶν
  choice: அவர்களே உங்கள் நீதிபதிகளாக இருப்பார்கள்
  rationale: எதிர்கால வினையையும் κριταί என்ற பெயர்ச்சொல் அமைப்பையும் காக்கிறது. αὐτοί என்பதன் வலியுறுத்தலை ‘அவர்களே’ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: Βεελζεβούλ என்ற பெயரின் அடையாளமும் எழுத்துவடிவமும்
  choice: பெயெல்செபூல்
  alternative: பெயெல்செபூப்
  rationale: வழங்கப்பட்ட கிரேக்க மூலத்தில் உள்ள Βεελζεβούλ வடிவமே ஒலிபெயர்க்கப்பட்டுள்ளது; மொழிபெயர்ப்பு மரபில் பரிச்சயமான மாற்றுவடிவத்தோடு ஒத்திசைக்கப்படவில்லை. மாற்றுவடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ‘உங்கள் மகன்கள்’ என்பவர்களின் அடையாளம்
  choice: உங்கள் மகன்கள் என்ற மூல உருவகத்தைத் தக்கவைத்தல்
  alternative: உங்கள் சீடர்கள் அல்லது உங்கள் மக்களில் சிலர்
  rationale: சூழல் இவர்களை கேட்போரின் வட்டத்தைச் சேர்ந்த பேயோட்டிகளாகக் குறிக்கலாம். இருப்பினும், கிரேக்கம் உறவுமுறைச் சொல்லைப் பயன்படுத்துவதால் அதன் சொல்லாட்சியையும் வாதத்தின் கூர்மையையும் மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் அமைக்கப்பட்டுள்ளது. ‘பேய்களைத் துரத்து’ என்பது இயல்பான பேயோட்டும் சொல்லாட்சி; ‘உங்கள் மகன்கள்’ மற்றும் ‘நீதிபதிகள்’ ஆகியவை மூலத்தின் வாத அமைப்பையும் திட்டமிட்ட தெளிவின்மையையும் தக்கவைக்கின்றன.
