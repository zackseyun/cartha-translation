id: MAT.12.31
reference: Matthew 12:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν, πᾶσα ἁμαρτία καὶ βλασφημία ἀφεθήσεται τοῖς ἀνθρώποις, ἡ δὲ τοῦ πνεύματος βλασφημία οὐκ ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/031.yaml
  text: Therefore I tell you[a], every sin and blasphemy will be forgiven people[b], but blasphemy against the Spirit will not be forgiven.
translation:
  language: ta
  text: 'ஆகையால் நான் உங்களுக்குச் சொல்கிறேன்: மனிதர்களுக்கு ஒவ்வொரு பாவமும் இறைநிந்தனையும் மன்னிக்கப்படும்; ஆனால் ஆவியானவருக்கு எதிரான இறைநிந்தனை[a] மன்னிக்கப்படாது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்த ஆவியானவருக்கு எதிரான இறைநிந்தனை.” இவ்வசனத்தின் கிரேக்க உரையில் “ஆவியானவர்” என்று மட்டுமே உள்ளது; சுற்றியுள்ள சூழல் பரிசுத்த ஆவியானவரைக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ஆகையால்
  rationale: முந்தைய சூழலிலிருந்து வரும் முடிவை இயல்பாகவும் தெளிவாகவும் இணைக்கிறது.
- source_word: λέγω ὑμῖν
  choice: நான் உங்களுக்குச் சொல்கிறேன்
  rationale: நேரடியான உரையாடலையும் வலியுறுத்தும் தன்மையையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: πᾶσα ἁμαρτία καὶ βλασφημία
  choice: ஒவ்வொரு பாவமும் இறைநிந்தனையும்
  rationale: πᾶσα என்பதன் பகிர்ந்தளிக்கும் பொருளை ‘ஒவ்வொரு’ தெரிவிக்கிறது; இச்சூழலில் βλασφημία தெய்வத்துக்கு எதிரான நிந்தனையைக் குறிப்பதால் ‘இறைநிந்தனை’ துல்லியமானது.
- source_word: ἀφεθήσεται τοῖς ἀνθρώποις
  choice: மனிதர்களுக்கு … மன்னிக்கப்படும்
  rationale: தெய்வீகச் செயலை வெளிப்படையாகச் செய்பவரைக் குறிப்பிடாத கிரேக்க எதிர்மறை வினையையும், மன்னிப்பைப் பெறுபவர்களைக் குறிக்கும் தத்துவேற்றுமையையும் காக்கிறது.
- source_word: ἡ δὲ τοῦ πνεύματος βλασφημία
  choice: ஆனால் ஆவியானவருக்கு எதிரான இறைநிந்தனை
  rationale: தொடர்புநிலை அமைப்பை, ஆவியானவர் நிந்தனையின் இலக்கு என்ற பொருளில் இயல்பான தமிழில் வெளிப்படுத்துகிறது; வசனத்தில் இல்லாத ‘பரிசுத்த’ என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: οὐκ ἀφεθήσεται
  choice: மன்னிக்கப்படாது
  rationale: எதிர்கால எதிர்மறைச் செயலற்ற வினையைச் சுருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: πνεύματος என்பதை ‘ஆவியானவர்’ என்றா ‘பரிசுத்த ஆவியானவர்’ என்றா மொழிபெயர்ப்பது
  choice: ஆவியானவர்
  alternative: பரிசுத்த ஆவியானவர்
  rationale: இவ்வசனத்தின் கிரேக்க உரையில் ἁγίου (‘பரிசுத்த’) இல்லை. உடனடிச் சூழல் பரிசுத்த ஆவியானவரையே குறிப்பதாகத் தெளிவுபடுத்தினாலும், முதன்மை உரை மூலத்தின் சுருக்கமான சொல்லாட்சியைப் பேணுகிறது; தெளிவான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிதில் புரியும், கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘மனிதர்களுக்கு … மன்னிக்கப்படும்’ என்ற அமைப்பு கிரேக்க வாக்கியத்தின் பெறுநர் உறவையும் இரு உட்பிரிவுகளின் இணை அமைப்பையும் காக்கிறது.
