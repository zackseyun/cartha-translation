  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/039.yaml
  text: But he answered and said to them[a], “An evil and adulterous generation seeks a sign[b], and no sign will be given to it except the sign of Jonah the prophet.”
translation:
  language: ta
  text: அவர் அவர்களுக்குப் பதிலளித்து, “தீயும் விபசாரமுள்ளதுமான தலைமுறை ஓர் அடையாளத்தைத் தேடுகிறது. ஆனால் யோனா தீர்க்கதரிசியின் அடையாளத்தைத்[b] தவிர, வேறு எந்த அடையாளமும் அதற்குக் கொடுக்கப்படாது” என்று சொன்னார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: அல்லது, “தீர்க்கதரிசியாகிய யோனாவின் அடையாளத்தை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: பதிலளித்து … சொன்னார்
  rationale: பங்கேற்புவினையும் முற்றுவினையும் கொண்ட கிரேக்கக் கதைநடைச் சொற்றொடரின் இரு கூறுகளையும், இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: Γενεὰ
  choice: தலைமுறை
  rationale: இங்கு ஒரே காலத்தைச் சேர்ந்த மக்களை ஒட்டுமொத்தமாகக் குறிக்கும் ஒருமைச் சொல்லின் சமூகத் தன்மையையும் ஒழுக்க மதிப்பீட்டையும் காக்கிறது.
- source_word: πονηρὰ
  choice: தீய
  rationale: சூழலில் உள்ள கடுமையான ஒழுக்கக் கண்டனத்தைத் தெளிவாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: μοιχαλὶς
  choice: விபசாரமுள்ள
  rationale: சொல்லின் நேரடியான விபசார உருவகத்தைக் காக்கிறது; அதை ‘உண்மையற்ற’ என்று விளக்கமாக மாற்றி உடன்படிக்கைத் துரோகத்தை மட்டும் பொருளாக நிர்ணயிப்பதைத் தவிர்க்கிறது.
- source_word: σημεῖον
  choice: அடையாளம்
  rationale: உறுதிப்படுத்தும் சான்று அல்லது அற்புத நிகழ்வு ஆகிய சாத்தியங்களைத் திறந்தே வைக்கும் பரந்த, நேரடியான இணைச்சொல்; ‘அற்புத அடையாளம்’ என்று மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: ἐπιζητεῖ
  choice: தேடுகிறது
  rationale: வினையின் அடிப்படைப் பொருளை இயல்பாகத் தருகிறது; ‘கோருகிறது’ என்று வலிமையை மிகைப்படுத்தவில்லை.
- source_word: δοθήσεται
  choice: கொடுக்கப்படாது
  rationale: எதிர்காலச் செயப்பாட்டு வினையையும் முந்திய மறுப்பையும் இயல்பான தமிழில் துல்லியமாகத் தருகிறது.
- source_word: αὐτῇ
  choice: அதற்கு
  rationale: ஒருமையில் உள்ள ‘தலைமுறை’ என்பதையே சுட்டுகிறது; பாலின இலக்கணத்தைத் தமிழில் செயற்கையாகக் கொண்டு வரவில்லை.
- source_word: εἰ μὴ
  choice: தவிர
  rationale: மறுப்புச் சொற்றொடரில் விதிவிலக்கைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου
  choice: யோனா தீர்க்கதரிசியின் அடையாளம்
  rationale: யோனாவுடன் தொடர்புடைய அடையாளம் என்ற மூலத்தின் உறவைத் தக்கவைத்து, அந்த அடையாளம் துல்லியமாக எதில் அடங்குகிறது என்பதை அடுத்த சூழலுக்கு விட்டுவைக்கிறது.
theological_decisions:
- issue: ‘விபசாரமுள்ள’ என்ற கண்டனத்தின் பொருள்
  choice: தீர்க்கதரிசன மரபை நினைவூட்டும் ‘விபசாரமுள்ள’ என்ற உருவகச் சொல்லை முதன்மை உரையில் தக்கவைத்தல்
  alternative: உண்மையற்ற / உடன்படிக்கைக்குத் துரோகம் செய்கிற
  rationale: இச்சொல் நேரடியான பாலியல் ஒழுக்கக்கேட்டையும் கடவுளுடனான உறவில் துரோகத்தையும் எதிரொலிக்கக்கூடும். ஒரே பொருளாகக் குறுக்காமல் அதன் இறையியல் அழுத்தத்தையும் இருபொருள் சாத்தியத்தையும் காக்கிறது.
- issue: ‘யோனாவின் அடையாளம்’ எதைக் குறிக்கிறது
  choice: அதன் தன்மையை இவ்வசனத்திலேயே விளக்காமல் உறவைக் குறிக்கும் சொற்றொடராக வைத்தல்
  alternative: யோனாவின் அனுபவத்தைப் போன்ற அடையாளம் / யோனாவே அடையாளம்
  rationale: இந்த வசனம் சொற்றொடரை அறிமுகப்படுத்துகிறது; அடுத்த சூழலே அதை விரிவுபடுத்துகிறது. மொழிபெயர்ப்பு முன்கூட்டியே ஓர் விளக்கத்தைத் தீர்மானிக்கக் கூடாது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மதிப்புடனும் அமைக்கப்பட்டுள்ளது. ‘பதிலளித்து … சொன்னார்’ என்பது கிரேக்கக் கதைநடை வடிவத்தைச் சுமையில்லாமல் காக்கிறது. ‘விபசாரமுள்ள’ என்ற கூர்மையான வேதாகம உருவகம் விளக்கவுரையாகத் தளர்த்தப்படவில்லை.
