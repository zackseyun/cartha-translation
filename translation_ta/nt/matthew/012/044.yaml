id: MAT.12.44
reference: Matthew 12:44
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τότε λέγει· ⸂Εἰς τὸν οἶκόν μου ἐπιστρέψω⸃ ὅθεν ἐξῆλθον· καὶ ἐλθὸν ⸀εὑρίσκει ⸀σχολάζοντα σεσαρωμένον καὶ κεκοσμημένον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/044.yaml
  text: Then it says[a], ‘I will return to my house from which I came out,’ and when it comes, it finds it unoccupied, swept[b], and put in order.
translation:
  language: ta
  text: அப்போது அது, “நான் வெளியே வந்த என் வீட்டுக்குத் திரும்புவேன்” என்று சொல்லுகிறது. அது வந்து, அந்த வீடு காலியாகவும்[a], கூட்டிப் பெருக்கப்பட்டும், ஒழுங்குபடுத்தப்பட்டும்[b] இருப்பதைக் காண்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “ஆளில்லாமல்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது “அலங்கரிக்கப்பட்டும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε λέγει
  choice: அப்போது அது ... என்று சொல்லுகிறது
  rationale: τότε என்பதன் காலத் தொடர்ச்சியையும், வரலாற்று நிகழ்காலமான λέγει என்பதன் உயிரோட்டத்தையும் காக்கிறது. முந்தைய சூழலில் பேசுவது அசுத்த ஆவி என்பதால், தமிழில் இயல்பாக ‘அது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: Εἰς τὸν οἶκόν μου ἐπιστρέψω
  choice: என் வீட்டுக்குத் திரும்புவேன்
  rationale: ἐπιστρέψω என்பதன் ‘திரும்புதல்’ என்ற பொருளையும், ஆவி அந்த வீட்டைத் தன்னுடையதாகக் கூறும் உரிமைக் கோரலையும் நேரடியாகக் காக்கிறது.
- source_word: ὅθεν ἐξῆλθον
  choice: நான் வெளியே வந்த
  rationale: வீட்டை முன்னிலையாகக் கொண்டு ‘எந்த வீட்டிலிருந்து வெளியே வந்தேனோ’ என்ற கருத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐλθὸν εὑρίσκει
  choice: அது வந்து ... காண்கிறது
  rationale: முதலில் வருதல், பின்னர் காணுதல் என்ற அசல் செயல்வரிசையையும், εὑρίσκει-இன் நிகழ்காலக் கதைநடையையும் காக்கிறது.
- source_word: σχολάζοντα
  choice: காலியாக
  rationale: இங்கு வீடு குடியிருப்பின்றி அல்லது பயன்படுத்தப்படாமல் கிடப்பதைக் குறிக்கிறது. ‘காலியாக’ என்பது இயல்பான நவீனத் தமிழ்; சொல் கொண்டுள்ள ‘ஆளில்லாமல்’ என்ற நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: σεσαρωμένον
  choice: பெருக்கப்பட்டும்
  rationale: σαρόω என்பதன் நேரடியான பொருளான தரையைப் பெருக்குதல் என்பதையும், நிறைவுற்ற நிலையில் வீடு இருப்பதையும் தெரிவிக்கிறது.
- source_word: κεκοσμημένον
  choice: ஒழுங்குபடுத்தப்பட்டும்
  rationale: κοσμέω இங்கு ‘ஒழுங்காக அமைத்தல்’ அல்லது ‘அலங்கரித்தல்’ எனப் பொருள்படலாம். சூழலுக்கு இயல்பான ‘ஒழுங்குபடுத்தப்பட்டும்’ முதன்மையாகத் தேர்ந்தெடுக்கப்பட்டு, மற்ற சாத்தியம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘வீடு’ என்பதன் உருவகப் பொருள்
  choice: மூலத்தில் உள்ள ‘வீடு’ என்ற படிமத்தை அப்படியே வைத்தல்
  alternative: ‘நான் விட்டுவந்த மனிதரிடம்/வாழ்க்கைக்குத் திரும்புவேன்’ என்று உருவகத்தை வெளிப்படையாக விளக்குதல்
  rationale: சூழலில் வீடு ஒரு மனிதரைச் சுட்டும் உருவகமாக இருந்தாலும், இந்த வசனம் உருவகத்தை விளக்காமல் ‘வீடு’ என்றே கூறுகிறது. அதை அப்படியே வைப்பது இயேசுவின் படிமத்தையும் அதன் விளக்கத் திறந்த நிலையையும் காக்கிறது.
- issue: σχολάζοντα குறிக்கும் காலித்தன்மை
  choice: ‘காலியாக’ என்று மொழிபெயர்த்து, யாரால் அல்லது எதனால் நிரப்பப்படவில்லை என்பதை விளக்காமல் விடுதல்
  alternative: ‘தேவனுடைய ஆவி இல்லாமல்’ அல்லது ‘குடியிருப்பவர் இல்லாமல்’ என்று குறிப்பாக்குதல்
  rationale: மூலச்சொல் வீட்டின் காலியான அல்லது ஆளில்லாத நிலையையே கூறுகிறது; அந்தக் காலித்தன்மைக்கு ஒரு குறிப்பிட்ட இறையியல் விளக்கத்தை வசனத்துக்குள் சேர்ப்பது மூலத்தை மீறும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. அசலின் நிகழ்கால உயிரோட்டம் ‘சொல்லுகிறது’, ‘காண்கிறது’ என்பவற்றால் காக்கப்பட்டுள்ளது. மூன்று நிலைச் சொற்களும் இணையான தொடரமைப்பில் அமைக்கப்பட்டுள்ளன.
