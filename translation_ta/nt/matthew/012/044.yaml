review_pass:
  verdict: revise
  source_fidelity: The draft faithfully retains the temporal progression, the impersonal reference to the unclean spirit, the possessive force of “my house,” the return-from-which-I-came image, and the threefold description of the house. The narrative-present forms are appropriately represented by சொல்லுகிறது and காண்கிறது. However, பெருக்கப்பட்டும் by itself can naturally be understood as “multiplied/increased” in modern Tamil, obscuring the specific sense of σαρόω (“swept”).
  naturalness: The overall register is clear, modern, and dignified. Replacing the isolated பெருக்கப்பட்டும் with கூட்டிப் பெருக்கப்பட்டும் gives an unambiguous, idiomatic reference to sweeping while preserving the compact parallel construction.
  terminology: 'வீடு, காலியாக, and ஒழுங்குபடுத்தப்பட்டும் are appropriate and do not overinterpret the metaphor or κοσμέω. The alternatives in the footnotes are suitable: ஆளில்லாமல் conveys “unoccupied,” and அலங்கரிக்கப்பட்டும் conveys the possible “adorned/decorated” sense.'
  issues:
  - severity: medium
    issue: பெருக்கப்பட்டும் is lexically ambiguous in isolation.
    rationale: In current Tamil, பெருக்குதல் commonly means “multiply/increase”; without கூட்டிப், the reader may not recognize the intended action of sweeping. σαρόω specifically denotes sweeping.
