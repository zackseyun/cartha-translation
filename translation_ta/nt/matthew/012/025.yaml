id: MAT.12.25
reference: Matthew 12:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰδὼς ⸀δὲ τὰς ἐνθυμήσεις αὐτῶν εἶπεν αὐτοῖς· Πᾶσα βασιλεία μερισθεῖσα καθ’ ἑαυτῆς ἐρημοῦται, καὶ πᾶσα πόλις ἢ οἰκία μερισθεῖσα καθ’ ἑαυτῆς οὐ σταθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/025.yaml
  text: But knowing their thoughts[a], he said to them, “Every kingdom divided against itself is laid waste[c][b], and every city or house divided against itself will not stand.”
translation:
  language: ta
  text: ஆனால் அவர்களுடைய எண்ணங்களை[a] அறிந்த அவர் அவர்களிடம், “தனக்குத்தானே எதிராகப் பிளவுபட்ட ஒவ்வோர் அரசும் பாழாகிறது[b]; தனக்குத்தானே எதிராகப் பிளவுபட்ட ஒவ்வொரு நகரமோ வீடோ[c] நிலைத்திருக்காது” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எண்ணங்கள்’ என்பதற்கு மாற்றாக ‘யோசனைகள்’ அல்லது ‘நோக்கங்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘பாழாகிறது’ என்பதற்கு மாற்றாக ‘பாழடைந்துபோகிறது’ அல்லது ‘அழிவுக்குள்ளாகிறது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: இங்கு ‘வீடு’ என்பது ‘குடும்பத்தார்’ அல்லது ‘வீட்டார்’ என்ற பொருளையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: அறிந்த
  rationale: இந்த இறந்தகால வினையெச்சம் மனத்தால் அறிதல் அல்லது உணர்தல் என்ற பொருளில் வருகிறது. இயேசு அதை எவ்வாறு அறிந்தார் என்பதைச் சேர்க்காமல், முதன்மை வினையுடன் உள்ள வினையெச்சத் தொடர்பை இது இயல்பாகக் காக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: δέ இங்கு மென்மையான மாறுதலையும் எதிர்நிலையையும் குறிக்கிறது; சூழலிலுள்ள வாதத் திருப்பத்தை ‘ஆனால்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐνθυμήσεις
  choice: எண்ணங்களை
  rationale: இச்சொல் எண்ணங்கள், உள்ளார்ந்த யோசனைகள், நோக்கங்கள் ஆகியவற்றைக் குறிக்கலாம். ‘எண்ணங்கள்’ என்பது தெளிவான பொதுவழக்கு; கிரேக்கச் சொல்லின் பரந்த பொருளையும் காக்கிறது.
- source_word: Πᾶσα βασιλεία
  choice: ஒவ்வோர் அரசும்
  rationale: ஒருமை பெயர்ச்சொல்லுடன் வரும் πᾶσα இங்கு எல்லாவற்றுக்கும் பொருந்தும் பழமொழிசார் உண்மையைத் தெரிவிக்கிறது. ‘ஒவ்வோர் அரசும்’ அந்தப் பொதுமையை இயல்பான தமிழில் தருகிறது.
- source_word: μερισθεῖσα καθ’ ἑαυτῆς
  choice: தனக்குத்தானே எதிராகப் பிளவுபட்ட
  rationale: இது வெறும் உட்பிரிவை மட்டுமல்லாமல், தன்னையே எதிர்க்கும் உட்பிளவைச் சுட்டுகிறது. ‘தனக்குத்தானே எதிராக’ என்பது κατά என்பதன் எதிர்நிலை வலிமையைப் பாதுகாக்கிறது.
- source_word: ἐρημοῦται
  choice: பாழாகிறது
  rationale: இச்சொல் பாழடைதல், அழிவுறுதல், வெறுமையாதல் ஆகிய விளைவுகளைக் குறிக்கிறது. நிகழ்கால வடிவிலுள்ள பொதுவான உண்மையை ‘பாழாகிறது’ இயல்பாகவும் வலிமையாகவும் வெளிப்படுத்துகிறது.
- source_word: πόλις ἢ οἰκία
  choice: நகரமோ வீடோ
  rationale: πόλις என்பது ‘நகரம்’; οἰκία என்பது கட்டடமான வீட்டையோ குடும்பத்தாரையோ குறிக்கலாம். ‘வீடு’ கிரேக்க வடிவின் நேரடிப் பொருளைக் காக்கிறது; குடும்பம் என்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: οὐ σταθήσεται
  choice: நிலைத்திருக்காது
  rationale: இந்த இடத்தில் ἵστημι தொடர்ந்து நிலைபெற்றிருத்தல் அல்லது நீடித்திருத்தல் என்ற மரபுத்தொடர் பொருளைக் கொண்டுள்ளது. ‘நிலைத்திருக்காது’ நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
theological_decisions:
- issue: அவர்களுடைய உள்ளார்ந்த எண்ணங்களை இயேசு அறிந்த விதம்
  choice: ‘அவர்களுடைய எண்ணங்களை அறிந்த’ என்று மட்டும் மொழிபெயர்த்து, அவர் அறிந்த விதத்தைக் குறிப்பிடாமல் விடுதல்
  alternative: இயேசு அற்புதமான அனைத்தறிவால் அவர்களுடைய எண்ணங்களை அறிந்தார்; அல்லது சூழலையும் பேச்சையும் கொண்டு அவற்றை உணர்ந்தார் என்று வெளிப்படையாகக் கூறுதல்
  rationale: இவ்வசனம் இயேசு அவர்களுடைய எண்ணங்களை அறிந்தார் என்ற உண்மையைச் சொல்கிறது; அந்த அறிவு எவ்வாறு கிடைத்தது என்பதை விளக்கவில்லை. ஆகவே மூலத்தில் இல்லாத கோட்பாட்டு முடிவை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘தனக்குத்தானே எதிராகப் பிளவுபட்ட’ என்ற மீளுரை கிரேக்கத்தின் இணை அமைப்பையும் வாதத்தின் அழுத்தத்தையும் காக்கிறது. அடிக்குறிப்பு குறிகள் உரையில் பொருத்தமான சொற்களுக்குப் பின்னர் வரிசையாக வைக்கப்பட்டுள்ளன.
