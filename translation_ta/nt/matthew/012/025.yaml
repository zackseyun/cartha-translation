  source_fidelity: 'மூல கிரேக்கத்தின் வினையெச்ச அமைப்பும் பொருளும் நன்றாகக் காக்கப்பட்டுள்ளன: இயேசு அவர்களுடைய எண்ணங்களை அறிந்தார் என்பதோடு, அந்த அறிவு எவ்வாறு வந்தது என்று விளக்கப்படவில்லை. «தனக்குத்தானே எதிராகப் பிளவுபட்ட» என்பது μερισθεῖσα καθ’ ἑαυτῆς என்பதன் உட்பிளவு/தன்னெதிர்ப்பு வலிமையைத் தக்கவைக்கிறது. ἐρημοῦται-க்கான «பாழாகிறது» மற்றும் οὐ σταθήσεται-க்கான «நிலைத்திருக்காது» ஆகியவை முறையே நிகழ்காலப் பொதுவிதியையும் எதிர்கால விளைவையும் சரியாகத் தருகின்றன.'
