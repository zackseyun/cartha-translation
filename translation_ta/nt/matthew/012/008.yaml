  text: κύριος γάρ ἐστιν τοῦ σαββάτου ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/008.yaml
  text: For the Son of Man is Lord of the Sabbath[a][b].
translation:
  language: ta
  text: ஏனெனில், மானிடமகன் ஓய்வுநாளின் ஆண்டவராய் இருக்கிறார்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மானிடமகன் ஓய்வுநாள்மேல் அதிகாரம் உடையவர்.”
    reason: lexical_alternative
  - marker: b
    text: “மானிடமகன்” என்பது நற்செய்தி நூல்களில் இயேசு தம்மைக் குறிக்கத் தனிச்சிறப்பாகப் பயன்படுத்தும் பட்டப்பெயர். இதை இன்னும் பொதுவாக “மனிதர்” எனப் புரிந்துகொள்ளலாம்; ஆனால் அப்படி மொழிபெயர்ப்பது இதன் பட்டப்பெயர் சார்ந்த சாத்தியமான எதிரொலியை மங்கச் செய்யும்.
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய வாதத்திற்கான விளக்கக் காரணத்தைத் தெளிவாக இணைக்கிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: அதிகாரத்தையும் கிறிஸ்துவியல் கனத்தையும் காக்கும் இயல்பான தமிழ் வேதாகமச் சொல்; ‘எஜமான்’ இங்கு உரிமையாளர் என்ற குறுகிய பொருளைத் தரக்கூடும்.
- source_word: τοῦ σαββάτου
  choice: ஓய்வுநாளின்
  rationale: κύριος என்பதுடன் வரும் கிரேக்க உரிமைவேற்றுமையை நேரடியாகவும் இயல்பாகவும் காட்டுகிறது; இது பொதுவான ஓய்வை அல்ல, யூதர்களின் புனித நாளைக் குறிக்கிறது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மானிடமகன்
  rationale: நற்செய்தி நூல்களில் இயேசுவின் சிறப்பான தற்குறிப்புப் பட்டமாகவும் தானியேல் 7-ஐ நினைவூட்டக்கூடிய சொல்லாகவும் உள்ளதைப் பாதுகாக்கிறது.
- source_word: ἐστιν
  choice: இருக்கிறார்
  rationale: எளிய நிகழ்கால இணைப்புவினையைத் தமிழில் மரியாதை ஒருமையுடன் இயல்பாகக் கொடுக்கிறது.
theological_decisions:
- issue: κύριος ... τοῦ σαββάτου என்பதன் கிறிஸ்துவியல் வலிமை
  choice: ‘மானிடமகன் ஓய்வுநாளின் ஆண்டவராய் இருக்கிறார்’ என்று வலுவான அதிகாரக் கூற்றாக மொழிபெயர்த்தல்
  alternative: ‘மானிடமகன் ஓய்வுநாள்மேல் அதிகாரம் உடையவர்’
  rationale: இயேசுவுக்கும் ஓய்வுநாளுக்கும் இடையிலான அதிகார உறவை மெலிதாக்காமல் காட்டுகிறது; அதேவேளையில் மூலவசனம் கூறுவதற்கு மேல் விளக்கம் சேர்ப்பதில்லை.
- issue: ὁ υἱὸς τοῦ ἀνθρώπου என்பதன் பட்டப்பெயர்த் தன்மை
  choice: ‘மானிடமகன்’ என்ற நிலைபெற்ற பட்டப்பெயரைப் பயன்படுத்துதல்
  alternative: ‘மனிதர்’ அல்லது ‘மனித மகன்’
  rationale: இது இயேசுவின் தனிச்சிறப்பான தற்குறிப்பாகவும் சாத்தியமான மறைநூல்/தானியேல் சார்ந்த எதிரொலியுடனும் இருப்பதைப் பாதுகாக்கிறது; பொதுவான மனிதக் குறிப்பாகத் தட்டையாக்குவதில்லை.
translation_notes:
  register: நவீன தரத் தமிழில் சுருக்கமான, கண்ணியமான நடை. ‘ஓய்வுநாள்’ பொதுவாசகருக்குப் புரியக்கூடிய நிலைபெற்ற சொல்; ‘மானிடமகன்’ பட்டப்பெயர் சார்ந்த வேதாகம எதிரொலியைப் பாதுகாக்கிறது. இரு அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
