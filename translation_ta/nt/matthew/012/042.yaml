revisions:
- from: தெற்குத் திசையின் அரசி[a] நியாயத்தீர்ப்பின்போது இந்தத் தலைமுறையினரோடு எழுந்து, அவர்களைக் கண்டனம் செய்வாள். ஏனெனில், சாலொமோனின் ஞானத்தைக் கேட்பதற்காக அவள் பூமியின் கடைக்கோடிகளிலிருந்து வந்தாள். இதோ, சாலொமோனைவிடப் பெரிய ஒன்று இங்கே இருக்கிறது.[b]
  to: தெற்கின் அரசி[a] நியாயத்தீர்ப்பில் இந்தத் தலைமுறையோடு எழுந்து, இந்தத் தலைமுறையைக் குற்றவாளி எனத் தீர்ப்பளிப்பாள். ஏனெனில், சாலொமோனின் ஞானத்தைக் கேட்பதற்காக அவள் பூமியின் கடைக்கோடிகளிலிருந்து வந்தாள். இதோ, சாலொமோனைவிடப் பெரிய ஒன்று இங்கே இருக்கிறது.[b]
  rationale: The revision strengthens the judicial force of κατακρινεῖ, keeps γενεά explicit as the condemned entity, and improves idiomatic Tamil for the geographical designation. It preserves μετά as ‘உடன்/ஓடு,’ retains the purposive sense of ἀκοῦσαι, and does not resolve the neuter πλεῖον into a masculine personal expression. Footnote content and anchors are retained, with the Sheba note revised to state an allusion rather than an explicit identification.
