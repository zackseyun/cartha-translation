id: MAT.12.42
reference: Matthew 12:42
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτήν· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/042.yaml
  text: The queen of the South will rise up in the judgment with this generation and will condemn it[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: ta
  text: தெற்கின் அரசி[a] நியாயத்தீர்ப்பில் இந்தத் தலைமுறையோடு எழுந்து, இந்தத் தலைமுறையைக் குற்றவாளி எனத் தீர்ப்பளிப்பாள். ஏனெனில், சாலொமோனின் ஞானத்தைக் கேட்பதற்காக அவள் பூமியின் கடைக்கோடிகளிலிருந்து வந்தாள். இதோ, சாலொமோனைவிடப் பெரிய ஒன்று இங்கே இருக்கிறது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தெற்கின் அரசி’ என்பது சேபாவின் அரசியைச் சுட்டும் குறிப்பு ஆகும் (1 இராஜாக்கள் 10:1–13; 2 நாளாகமம் 9:1–12); எனினும், கிரேக்க மூலவசனம் ‘சேபா’ என்று பெயரிட்டுக் கூறவில்லை.
    reason: cross_reference
  - marker: b
    text: ‘சாலொமோனைவிடப் பெரியவர் இங்கே இருக்கிறார்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் நடுநிலை வடிவம் (‘பெரிய ஒன்று’) பயன்படுத்தப்பட்டுள்ளது; இது இயேசுவிலும் அவருடைய ஊழியத்திலும் இங்கே வெளிப்படும் ஒப்பற்ற மேன்மையை வலியுறுத்தக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: βασίλισσα νότου
  choice: தெற்குத் திசையின் அரசி
  rationale: கிரேக்க மொழியின் ‘தெற்கின் அரசி’ என்ற புவியியல் குறிப்பைத் தெளிவாகப் பாதுகாக்கிறது. பழைய ஏற்பாட்டுப் பின்னணியில் இவர் சேபாவின் அரசி என்றாலும், அந்தப் பெயர் கிரேக்க மூலவசனத்தில் இல்லை.
- source_word: ἐγερθήσεται
  choice: எழுந்து
  rationale: நியாயத்தீர்ப்பில் எழுதல் என்ற உயிர்த்தெழுதல் மற்றும் நீதிமன்றச் சூழலின் நுணுக்கங்களை அளவுக்கு மீறி விளக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: ἐν τῇ κρίσει
  choice: நியாயத்தீர்ப்பின்போது
  rationale: குறிப்பிட்ட இறுதி நியாயத்தீர்ப்பைக் குறிக்கும் சொற்றொடரை நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: இந்தத் தலைமுறையினரோடு
  rationale: μετά என்பதன் அடிப்படைப் பொருளான ‘உடன்/ஓடு’ என்பதைப் பாதுகாக்கிறது; எதிரான நிலை தொடர்ந்து வரும் கண்டனத்தால் வெளிப்படுகிறது.
- source_word: κατακρινεῖ αὐτήν
  choice: அவர்களைக் கண்டனம் செய்வாள்
  rationale: γενεά குறிக்கும் சமகால மக்களைத் தமிழில் இயல்பாகப் பன்மைச் சுட்டுப்பெயரால் குறிப்பிட்டு, κατακρίνω என்பதன் கண்டனத் தீர்ப்பு என்ற வலிமையைத் தக்கவைக்கிறது.
- source_word: ἐκ τῶν περάτων τῆς γῆς
  choice: பூமியின் கடைக்கோடிகளிலிருந்து
  rationale: மிகத் தொலைவான இடத்தைக் குறிக்கும் மூலமொழி மரபுத்தொடரை, தமிழிலும் புரியக்கூடிய உருவகமாகப் பாதுகாக்கிறது.
- source_word: ἀκοῦσαι τὴν σοφίαν Σολομῶνος
  choice: சாலொமோனின் ஞானத்தைக் கேட்பதற்காக
  rationale: இறந்தகால வினையெச்சத்தின் நோக்கத்தையும் சாலொமோனுடைய ஞானத்தைக் கேட்க வந்தாள் என்ற நேரடிப் பொருளையும் வெளிப்படுத்துகிறது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை வலியுறுத்தி ஈர்க்கும் கிரேக்க உரையாடல் குறியீட்டுக்கு இயல்பான, கண்ணியமான தமிழ் இணை.
- source_word: πλεῖον Σολομῶνος
  choice: சாலொமோனைவிடப் பெரிய ஒன்று
  rationale: πλεῖον என்ற நடுநிலை வடிவத்தை ‘பெரியவர்’ என்று ஆண்பால் நபராக மட்டும் தீர்மானிக்காமல், ‘பெரிய ஒன்று’ என அதன் இலக்கண மற்றும் இறையியல் விரிவைத் தக்கவைக்கிறது.
- source_word: ὧδε
  choice: இங்கே இருக்கிறது
  rationale: ‘இங்கே’ என்ற இடப்பொருளைத் தமிழில் முழுமையான வாக்கியமாக இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: πλεῖον என்ற நடுநிலை ஒப்பீட்டு வடிவம் இயேசுவோடு எவ்வாறு தொடர்புபடுத்தப்பட வேண்டும்
  choice: சாலொமோனைவிடப் பெரிய ஒன்று இங்கே இருக்கிறது
  alternative: சாலொமோனைவிடப் பெரியவர் இங்கே இருக்கிறார்
  rationale: இயேசுவே சூழலில் தம்மைக் குறித்துப் பேசினாலும், கிரேக்கத்தில் ஆண்பால் ‘பெரியவர்’ என்பதற்குப் பதிலாக நடுநிலை πλεῖον உள்ளது. ‘பெரிய ஒன்று’ என்பது இயேசுவையும் அவரில் நிகழும் ஊழியம் மற்றும் இறையாட்சியின் மேன்மையையும் உள்ளடக்கக்கூடிய மூலவசனத்தின் திட்டமிட்ட விரிவையும் இறையியல் இழுவிசையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரமான தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘நியாயத்தீர்ப்பு’, ‘கண்டனம்’ போன்ற சொற்கள் வசனத்தின் நீதித்துறை மற்றும் இறுதிக்காலத் தொனியைப் பாதுகாக்கின்றன. மூலத்தின் ‘உடன்’ என்ற உறவும் πλεῖον என்பதன் நடுநிலைத் தெளிவின்மையும் விளக்கமாகத் தீர்த்துவிடப்படாமல் தக்கவைக்கப்பட்டுள்ளன.
