- from: அவர் இன்னும் மக்கள் கூட்டங்களிடம் பேசிக்கொண்டிருக்கையில், இதோ, அவருடைய தாயும் சகோதரர்களும்[a] அவரிடம் பேச விரும்பி வெளியே நின்றுகொண்டிருந்தார்கள்.
