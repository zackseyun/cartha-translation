  rationale: The revision replaces the desire-oriented “பேச விரும்பி” with the purposive “அவரிடம் பேசுவதற்காக,” more closely conveying ζητοῦντες αὐτῷ λαλῆσαι while retaining fluent modern Tamil. The footnote is retained with only punctuation and phrasing normalization; it continues to identify the lexical alternative without resolving theological questions about Jesus’ brothers.
