source:
  edition: SBLGNT
  text: Ἔτι ⸀δὲ αὐτοῦ λαλοῦντος τοῖς ὄχλοις ἰδοὺ ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ εἱστήκεισαν ἔξω ζητοῦντες αὐτῷ λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/046.yaml
  text: While he was still speaking to the crowds[a], behold, his mother and his brothers were standing outside, seeking to speak to him.
translation:
  language: ta
  text: அவர் இன்னும் மக்கள் கூட்டங்களிடம் பேசிக்கொண்டிருக்கையில், இதோ, அவருடைய தாயும் சகோதரர்களும்[a] அவரிடம் பேசுவதற்காக வெளியே நின்றுகொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ἀδελφοί என்ற சொல் விரிவான பொருளில் நெருங்கிய உறவினர்களைக் குறிப்பதாக எடுத்துக்கொள்ளப்பட்டால், “உடன்பிறந்தவர்கள்” அல்லது “நெருங்கிய உறவினர்கள்.” கிரேக்கச் சொல் இங்கு ஆண்பால் பன்மையில் இருப்பதால், முதன்மை உரையில் “சகோதரர்கள்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι δὲ αὐτοῦ λαλοῦντος
  choice: அவர் இன்னும் ... பேசிக்கொண்டிருக்கையில்
  rationale: Genitive absolute-இன் ஒரே நேரத்தில் நடைபெறும் செயலை இயல்பான தமிழில் காட்டுகிறது; ἔτι தொடர்ச்சியை ‘இன்னும்’ எனவும், δέ-யின் மென்மையான கதை நகர்வை தனியே வலியுறுத்தாமல் வாக்கிய ஓட்டத்திலும் வெளிப்படுத்துகிறது.
- source_word: τοῖς ὄχλοις
  choice: மக்கள் கூட்டங்களிடம்
  rationale: ὄχλοις பன்மை என்பதைக் ‘கூட்டங்கள்’ பிரதிபலிக்கிறது; ‘மக்கள்’ என்பது நவீன தமிழில் பொருளைத் தெளிவாக்குகிறது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: புதிய நிகழ்வின்மீது கவனத்தை ஈர்க்கும் ἰδού-வின் உயிரோட்டமான கதைச் சுட்டியை இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: அவருடைய தாயும் சகோதரர்களும்
  rationale: சூழலால் தாய்க்கும் αὐτοῦ உரியதாக இருப்பதைத் தமிழ் இயல்பாக வெளிப்படுத்துகிறது. ἀδελφοί ஆண்பால் பன்மை என்பதால் முதன்மை உரையில் ‘சகோதரர்கள்’ என்று தரப்படுகிறது.
- source_word: εἱστήκεισαν ἔξω
  choice: வெளியே நின்றுகொண்டிருந்தார்கள்
  rationale: ἵστημι-யின் நிலைத்த தொடர்நிலையை ‘நின்றுகொண்டிருந்தார்கள்’ காட்டுகிறது; ἔξω-க்கு உரையில் இல்லாத ‘வீட்டுக்கு’ போன்ற சொல்லைச் சேர்க்காமல் ‘வெளியே’ என மொழிபெயர்க்கிறது.
- source_word: ζητοῦντες αὐτῷ λαλῆσαι
  choice: அவரிடம் பேச விரும்பி
  rationale: இச்சூழலில் ζητέω நோக்கம் அல்லது விருப்பத்தைக் குறிக்கிறது. சொற்சொல்லான ‘தேடி’ என்பது தமிழில் அவர்கள் அவரைக் கண்டுபிடிக்க முயன்றார்கள் என்ற தவறான பொருளைத் தரக்கூடும்; ‘பேச விரும்பி’ நோக்கத்தை இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: இயேசுவின் குடும்பத்தாரைக் குறிக்கும் ἀδελφοί என்பதன் மொழிபெயர்ப்பு
  choice: அவருடைய சகோதரர்கள்
  alternative: அவருடைய உடன்பிறந்தவர்கள்; அவருடைய நெருங்கிய உறவினர்கள்
  rationale: கிரேக்கச் சொல் ஆண்பால் பன்மையாக இருப்பதால் அதன் வெளிப்படையான வடிவம் ‘சகோதரர்கள்’ எனப் பாதுகாக்கப்படுகிறது. அவர்கள் இயேசுவுடன் கொண்டிருந்த துல்லியமான உறவுமுறையைப் பற்றிய பிற்கால இறையியல் விவாதத்தை முதன்மை உரை தீர்மானிக்கவில்லை; விரிவான உறவினர் பொருளுக்கான சாத்தியம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், கண்ணியமான ஆனால் சாதாரண வாசகர்களுக்கு எளிதில் புரியும் கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ மூலம் மூலத்தின் கவன ஈர்ப்பு வலிமை பாதுகாக்கப்படுகிறது; தேவையற்ற சூழல் விளக்கங்கள் உரைக்குள் சேர்க்கப்படவில்லை.
