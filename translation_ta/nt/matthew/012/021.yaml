  yaml_path: translation/nt/matthew/012/021.yaml
  text: and in his name the nations will hope[a].
translation:
  language: ta
  text: மேலும், அவருடைய பெயரில் தேசங்கள் நம்பிக்கை வைக்கும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய பெயரில் பிற இனத்தார் நம்பிக்கை வைப்பார்கள்.”
    reason: ἔθνη என்பது சூழலுக்கு ஏற்ப ‘தேசங்கள்’ அல்லது இஸ்ரவேலரல்லாத ‘பிற இனத்தார்’ என்பதைக் குறிக்கலாம்.
lexical_decisions:
- source_word: καὶ
  choice: அவருடைய
  rationale: இவ்வசனம் முந்தைய மேற்கோளின் இறுதி இணை வாக்கியம். தமிழில் தனித்து வாசிக்கப்படும் வசனத்தின் இயல்புக்காக καί-ஐ வெளிப்படையான ‘மேலும்/மற்றும்’ என்பதாக மொழிபெயர்க்காமல் இயல்பான தொடராக அமைத்துள்ளோம்.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: அவருடைய பெயரில்
  rationale: ‘பெயர்’ என்பது வெறும் அழைப்புப் பெயரை மட்டுமல்லாமல், அந்த நபரையும் அவரது அதிகாரம் மற்றும் புகழையும் சுட்டக்கூடும். ‘அவருடைய பெயரில்’ என்பது மூலத்தின் தத்துவார்த்த ஒலியையும் தத்தத்தில் வரும் உறவையும் காக்கிறது.
- source_word: ἔθνη
  choice: பிற இனத்தார்
  rationale: ἔθνη என்பதற்கு ‘தேசங்கள்’ அல்லது யூதரல்லாத ‘பிற இனத்தார்’ என்ற இரு தொடர்புடைய பொருள்கள் உண்டு. இங்கு ஏசாயா மேற்கோளின் சூழலில் இஸ்ரவேலுக்கு அப்பாற்பட்ட மக்களைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்லாக்கமாக ‘பிற இனத்தார்’ தேர்ந்தெடுக்கப்பட்டது; ‘தேசங்கள்’ அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: ἐλπιοῦσιν
  choice: நம்பிக்கை வைப்பார்கள்
  rationale: இது எதிர்காலச் செயப்பாட்டு வினை. ‘நம்பிக்கை வைப்பார்கள்’ என்பது ἐλπίζω என்பதின் எதிர்பார்ப்பும் சார்ந்திருத்தலும் கலந்த பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: மேசியாவைப் பற்றிய மேற்கோளில் ἔθνη என்பதன் பரப்பு
  choice: பிற இனத்தார்
  alternative: தேசங்கள்
  rationale: இந்தச் சொல் இஸ்ரவேலுக்கு அப்பாற்பட்ட மக்களைக் குறிக்கக்கூடும்; அதேவேளை ஏசாயா மேற்கோளின் உலகளாவிய ‘தேசங்கள்’ என்ற பரப்பையும் கொண்டுள்ளது. முதன்மை உரை நவீனத் தமிழில் நபர்களைக் குறிக்கும் இயல்பான சொல்லைத் தேர்ந்தெடுக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுவதால் உள்ளார்ந்த பரப்பு குறுக்கப்படவில்லை.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ். ‘நம்பிக்கை வைப்பார்கள்’ என்பது சொற்சொல்லான ‘நம்புவார்கள்’ என்பதைவிட நம்பிக்கையை ஒருவர்மீது வைக்கும் கருத்தைத் தெளிவாகத் தருகிறது.
