  terminology: '''பேய் பிடித்திருந்த'' is a natural Tamil rendering that retains the source''s explicit demonic language without medicalizing it. ''பார்வையற்ற'' and ''பேச முடியாத'' are clear, respectful modern terms. The footnote correctly explains the contextual choice without eliminating the lexical ambiguity.'
