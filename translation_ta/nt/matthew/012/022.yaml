id: MAT.12.22
reference: Matthew 12:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τότε ⸂προσηνέχθη αὐτῷ δαιμονιζόμενος τυφλὸς καὶ κωφός⸃· καὶ ἐθεράπευσεν αὐτόν, ὥστε τὸν ⸀κωφὸν λαλεῖν καὶ βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/022.yaml
  text: Then a demon-possessed man[a], blind and mute, was brought to him; and he healed him, so that the mute man spoke and saw.
translation:
  language: ta
  text: அப்போது பேய் பிடித்திருந்த, பார்வையற்ற, பேச முடியாத[a] ஒரு மனிதன் அவரிடம் கொண்டுவரப்பட்டான். அவர் அவனைக் குணமாக்கினார்; அதனால் பேச முடியாதிருந்த அவன் பேசினான், பார்த்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கேட்க முடியாத.” கிரேக்கச் சொல் கேட்க முடியாதவரையோ பேச முடியாதவரையோ குறிக்கலாம். இங்கு குணமாக்கப்பட்ட பின் அவன் பேசினான் என்று கூறப்படுவதால், “பேச முடியாத” என்பது சூழலுக்கு மிகவும் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: அப்போது
  rationale: அடுத்த நிகழ்வை அறிமுகப்படுத்தும் காலச்சுட்டை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: προσηνέχθη αὐτῷ
  choice: அவரிடம் கொண்டுவரப்பட்டான்
  rationale: கிரேக்க மூலத்தின் செயப்பாட்டு வடிவத்தையும், கொண்டுவந்தவர் யார் என்று குறிப்பிடப்படாத நிலையையும் பாதுகாக்கிறது.
- source_word: δαιμονιζόμενος
  choice: பேய் பிடித்திருந்த
  rationale: பிசாசுசார் ஆளுகை அல்லது வாதையை மூல உரை வெளிப்படையாகக் குறிப்பிடுவதால், அதை மருத்துவ அல்லது பொதுவான வாதைச் சொல்லாக மாற்றாமல் இயல்பான தமிழில் தருகிறது.
- source_word: τυφλὸς
  choice: பார்வையற்ற
  rationale: நவீனத் தமிழில் கண்ணியமானதும் தெளிவானதுமான நேரடி இணைச்சொல்.
- source_word: κωφός
  choice: பேச முடியாத
  rationale: இச்சொல் கேளாமையையோ பேச இயலாமையையோ குறிக்கக்கூடும்; ஆனால் விளைவுக் கூறில் அவன் பேசினான் என்று இருப்பதால் இங்கு பேச இயலாமையே சூழலுக்கு மிகவும் பொருந்துகிறது.
- source_word: ἐθεράπευσεν αὐτόν
  choice: அவர் அவனைக் குணமாக்கினார்
  rationale: நற்செய்தி நூல்களின் குணமாக்கும் நிகழ்வுகளில் θεραπεύω என்பதன் இயல்பான தமிழ் வெளிப்பாடு.
- source_word: ὥστε
  choice: அதனால்
  rationale: குணமாக்கப்பட்டதன் விளைவை இயல்பான தமிழ் வாக்கியத் தொடர்பில் வெளிப்படுத்துகிறது.
- source_word: τὸν κωφὸν λαλεῖν καὶ βλέπειν
  choice: பேச முடியாதிருந்த அவன் பேசவும் பார்க்கவும் செய்தான்
  rationale: இரண்டு மீட்கப்பட்ட திறன்களையும் இணையாகக் காட்டி, κωφός என்பதற்கு முன்னர் எடுத்த சூழல்சார் பொருளையும் தொடர்ந்து பேணுகிறது.
theological_decisions:
- issue: பேய்சார் வாதையின் தன்மை
  choice: பேய் பிடித்திருந்த என்று வெளிப்படையாக மொழிபெயர்த்தல்
  alternative: வாதிக்கப்பட்டிருந்த அல்லது மனநலம் பாதிக்கப்பட்டிருந்த
  rationale: மூல உரை வாதையைப் பேயுடன் வெளிப்படையாகத் தொடர்புபடுத்துகிறது; அதை நவீன மருத்துவ வகையாகவோ தெளிவற்ற பொதுச் சொல்லாகவோ மாற்றுவது உரையின் கூற்றை மறைக்கும்.
- issue: κωφός என்பதன் சூழல்சார் பொருள்
  choice: பேச முடியாத
  alternative: கேட்க முடியாத
  rationale: சொல் இரு பொருள்களையும் கொள்ளக்கூடியதாயினும், குணமாக்கப்பட்ட பின் அவன் பேசினான் என்று விளைவுக் கூறு சொல்வதால் பேச இயலாமை இங்கு முன்னிலை பெறுகிறது; அடிப்படைச் சொற்பொருள் ஐயத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. மூலத்தின் செயப்பாட்டு அமைப்பும் பேய்சார் மொழியும் பாதுகாக்கப்பட்டுள்ளன; κωφός என்பதிலுள்ள உண்மையான சொற்பொருள் ஐயம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
