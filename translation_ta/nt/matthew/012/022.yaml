  source_fidelity: The draft accurately preserves the temporal sequence, unspecified passive agent ('was brought'), explicit demonic affliction, blindness, the contextual sense of κωφός as inability to speak, healing, and the resulting restoration of speech and sight. The footnote appropriately retains the lexical alternative 'deaf.'
