source:
  edition: SBLGNT
  text: οὐκ ἐρίσει οὐδὲ κραυγάσει, οὐδὲ ἀκούσει τις ἐν ταῖς πλατείαις τὴν φωνὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/019.yaml
  text: He will not quarrel or cry out[a], and no one will hear his voice in the streets.
translation:
  language: ta
  text: அவர் வாதிடவும் மாட்டார், கூக்குரலிடவும் மாட்டார்; தெருக்களில் அவரது குரலை யாரும் கேட்க மாட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் சச்சரவிடவும் மாட்டார், உரக்கக் கூவவும் மாட்டார்; பொது வெளிகளில் அவரது குரலை யாரும் கேட்க மாட்டார்கள்.”
    reason: ἐρίζω, κραυγάζω, πλατεῖαι ஆகியவற்றுக்கான சாத்தியமான சொற்பொருள் மாற்றுகளைக் காட்டுகிறது.
lexical_decisions:
- source_word: ἐρίσει
  choice: சண்டையிடவும் மாட்டார்
  rationale: ἐρίζω என்பது வாக்குவாதம் அல்லது சச்சரவில் ஈடுபடுவதைக் குறிக்கிறது. ‘சண்டையிட’ என்பது நவீன தமிழில் இயல்பாக இருந்து, ஊழியரின் முரண்பாடு தேடாத நடத்தையைத் தெரிவிக்கிறது.
- source_word: κραυγάσει
  choice: கூக்குரலிடவும் மாட்டார்
  rationale: κραυγάζω உரத்த குரலில் கூவுவதைக் குறிக்கிறது. ‘கூக்குரலிட’ என்பது பொது இடத்தில் உரக்கக் கத்தும் கருத்தைப் பாதுகாக்கிறது; சாதாரணமாகப் பேசுவதையே மறுப்பதாகத் தோன்றாது.
- source_word: ἀκούσει τις
  choice: யாரும் கேட்கவும் மாட்டார்கள்
  rationale: எதிர்மறை வாக்கியத்தில் τις என்பதன் பொருள் தமிழில் இயல்பாக ‘யாரும் ... மாட்டார்கள்’ என்று வெளிப்படுகிறது.
- source_word: ἐν ταῖς πλατείαις
  choice: தெருக்களில்
  rationale: πλατεῖαι என்பது அகன்ற தெருக்கள் அல்லது பொதுப் பாதைகளைக் குறிக்கலாம். ‘தெருக்களில்’ என்பது பொது வெளி என்ற கருத்தை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: φωνὴν αὐτοῦ
  choice: அவரது குரலை
  rationale: இச்சூழலில் φωνή என்பதற்கு ‘குரல்’ என்பதே நேரடியான, தெளிவான இணை.
- source_word: οὐκ…οὐδὲ…οὐδὲ
  choice: '...வும் மாட்டார், ...வும் மாட்டார்; ... யாரும் ... மாட்டார்கள்'
  rationale: மூன்று தொடர்ச்சியான மறுப்புகளின் ஒட்டுமொத்த வலிமையைத் தமிழின் இணையான எதிர்மறைக் கட்டமைப்பு பாதுகாக்கிறது.
theological_decisions:
- issue: ஏசாயாவின் ஊழியர் மேற்கோளும் மேசியாவின் நடத்தையும்
  choice: மேசியா சச்சரவு தேடாதவராகவும், பொது வெளியில் உரத்த ஆரவாரத்தால் தம்மை முன்னிறுத்தாதவராகவும் சித்தரிக்கப்படுகிறார்.
  alternative: ‘போராடவும் மாட்டார், உரக்கக் கூவவும் மாட்டார்’ என்று அதிக வடிவ ஒற்றுமையுடன் மொழிபெயர்க்கலாம்.
  rationale: கிரேக்க உரை இயேசுவின் மென்மையான, மோதலற்ற பொது நடத்தையை விவரிக்கிறது. இது அவர் ஒருபோதும் பொதுவில் பேசவில்லை அல்லது முற்றிலும் செயலற்றவர் என்ற விரிவான முடிவை உரைக்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும், கண்ணியமான நடை. கிரேக்கத்தின் மும்முறை மறுப்பும் பொது வெளி சார்ந்த படிமமும் பாதுகாக்கப்பட்டுள்ளன.
