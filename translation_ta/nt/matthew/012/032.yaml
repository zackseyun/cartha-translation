  source_fidelity: முதல் கூறில் ἀφεθήσεται αὐτῷ என்பதன் செயலற்ற எதிர்காலப் பொருளும், இரண்டாம் கூறில் மறுப்பும் சரியாகப் பிரதிபலிக்கப்படுகின்றன. ஆனால் வரைவில் ‘மன்னிக்கப்படாது’ இருமுறை வருகிறது; மூலத்தில் மறுப்பு ஒருமுறையே இருந்து இரு காலங்களுக்கும் பொருந்துகிறது. திருத்தம் அந்தத் தொடர்பையும் வலியுறுத்தலையும் இயல்பாகக் காக்கிறது.
