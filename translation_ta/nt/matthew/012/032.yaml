id: MAT.12.32
reference: Matthew 12:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὃς ἐὰν εἴπῃ λόγον κατὰ τοῦ υἱοῦ τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ· ὃς δ’ ἂν εἴπῃ κατὰ τοῦ πνεύματος τοῦ ἁγίου, οὐκ ἀφεθήσεται αὐτῷ οὔτε ἐν ⸂τούτῳ τῷ⸃ αἰῶνι οὔτε ἐν τῷ μέλλοντι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/032.yaml
  text: And whoever speaks a word against the Son of Man[a], it will be forgiven him; but whoever speaks against the Holy Spirit, it will not be forgiven him[c][b], neither in this age nor in the coming one.
translation:
  language: ta
  text: யார் மனிதகுமாரனுக்கு எதிராக ஒரு வார்த்தை பேசினாலும், அவருக்கு அது மன்னிக்கப்படும்; ஆனால் யார் தூய ஆவிக்கு எதிராகப் பேசினாலும், இந்தக் காலத்திலோ வரவிருக்கும் காலத்திலோ அவருக்கு அது மன்னிக்கப்படாது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃς ἐὰν / ὃς δ’ ἂν
  choice: யார் ... பேசினாலும் / ஆனால் யார் ... பேசினாலும்
  rationale: கிரேக்கத்தின் பொதுவான, வரையறுக்கப்படாத நிபந்தனையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἴπῃ λόγον
  choice: ஒரு வார்த்தை பேசினாலும்
  rationale: λόγον என்பதன் வெளிப்படையான ‘வார்த்தை’ பொருளைத் தக்கவைத்து, தமிழ் வழக்கில் இயல்பாக அமைகிறது.
- source_word: κατὰ
  choice: எதிராக
  rationale: இங்கு ஒருவரை நோக்கிய பகைமை அல்லது எதிர்ப்புடைய பேச்சைக் குறிக்கும் κατά என்பதற்கு நேரான தமிழ் இணை.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: இயேசுவின் பட்டப்பெயரின் சொல்வடிவத்தையும் அதன் மெசியா மற்றும் இறுதிக்காலத் தொடர்புகளையும் தக்கவைக்கிறது.
- source_word: ἀφεθήσεται αὐτῷ
  choice: அவருக்கு அது மன்னிக்கப்படும்
  rationale: குற்றம் மன்னிக்கப்படுவதைக் குறிக்கும் கிரேக்கச் செயப்பாட்டு அமைப்பையும் αὐτῷ என்பதையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: τοῦ πνεύματος τοῦ ἁγίου
  choice: தூய ஆவி
  rationale: பட்டப்பெயரை நவீன, தெளிவான தமிழில் வழங்குகிறது; பழமையான அல்லது சமயப் பிரிவுசார்ந்த சொல்வழக்கைத் தவிர்க்கிறது.
- source_word: οὐκ ἀφεθήσεται αὐτῷ
  choice: அவருக்கு அது மன்னிக்கப்படாது
  rationale: முதல் கூறின் செயப்பாட்டு அமைப்புடன் இணையான முரண்பாட்டைத் தக்கவைக்கிறது.
- source_word: οὔτε ἐν τούτῳ τῷ αἰῶνι οὔτε ἐν τῷ μέλλοντι
  choice: இந்தக் காலத்திலும் வரவிருக்கும் காலத்திலும் மன்னிக்கப்படாது
  rationale: αἰών என்பதை இடவியல் ‘உலகம்’ என்று அல்லாமல் காலகட்டத்தைக் குறிக்கும் ‘காலம்’ என்று வழங்குகிறது; இரண்டாம் கூறில் விடுபட்டுள்ள ‘காலம்’ என்பதைத் தமிழின் தெளிவுக்காக வெளிப்படையாகச் சொல்கிறது.
theological_decisions:
- issue: αἰών / μέλλων ஆகியவற்றின் காலச் சார்ந்த முரண்பாடு
  choice: இந்தக் காலத்திலும் வரவிருக்கும் காலத்திலும்
  alternative: இந்த உலகத்திலும் வரவிருக்கும் உலகத்திலும்
  rationale: மூலவசனம் தற்போதைய மற்றும் வரவிருக்கும் காலகட்டங்களை எதிரெதிராக வைக்கிறது; இடவியல் உலகங்களை அல்ல. இவ்வாறு மொழிபெயர்ப்பது குறிப்பிட்ட இறுதிக்காலக் கோட்பாட்டைச் சேர்க்காமல் மூலத்தின் அமைப்பைப் பாதுகாக்கிறது.
- issue: மன்னிக்கப்படாத குற்றத்தின் இயல்பு
  choice: தூய ஆவிக்கு எதிராகப் பேசுதல் என்ற வசனத்தின் எச்சரிக்கையை விளக்கச் சேர்க்காமல் தக்கவைத்தல்
  alternative: இதனை ஒரு குறிப்பிட்ட வரலாற்றுச் செயல் அல்லது இறுதிவரை மனந்திரும்பாமை என்று மொழிபெயர்ப்பிலேயே வரையறுத்தல்
  rationale: இந்த வசனம் குற்றத்தின் விளைவைச் சொல்கிறது; ஆனால் பிற்கால இறையியல் வரையறைகளின் துல்லியத்துடன் அதன் எல்லையை நிர்ணயிக்கவில்லை. ஆகவே உண்மையான விளக்கத் திறப்பும் பதற்றமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், எச்சரிக்கையின் கண்ணியமும் தீவிரமும் குறையாத வகையிலும் அமைக்கப்பட்டது. ‘யார் ... பேசினாலும்’ என்பது பொதுப் பொருளைத் தெளிவாக வழங்குகிறது; பாலினத்தைத் தேவையின்றி முன்னிறுத்தவில்லை.
