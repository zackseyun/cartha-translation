id: MAT.12.45
reference: Matthew 12:45
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τότε πορεύεται καὶ παραλαμβάνει μεθ’ ἑαυτοῦ ἑπτὰ ἕτερα πνεύματα πονηρότερα ἑαυτοῦ, καὶ εἰσελθόντα κατοικεῖ ἐκεῖ· καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων. οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/045.yaml
  text: Then it goes and brings with itself seven other spirits more evil than itself[a], and they enter and live there; and the last state of that man becomes worse than the first[b]. So it will be also with this evil generation.
translation:
  language: ta
  text: அப்போது அது போய், தன்னைவிடப் பொல்லாத வேறு ஏழு ஆவிகளைத் தன்னுடன் கூட்டிக்கொள்கிறது[a]. அவை உள்ளே நுழைந்ததும், அது அங்கே குடியிருக்கிறது[b]. அந்த மனிதனின் இறுதி நிலை அவனுடைய முந்தைய நிலையைவிட மோசமாகிறது[c]. இந்தப் பொல்லாத தலைமுறைக்கும் இப்படியே ஆகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன்னைவிட அதிகப் பொல்லாத, வேறுபட்ட ஏழு ஆவிகளை.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில், உள்ளே நுழைந்த ஆவிகள் பன்மையில் குறிப்பிடப்படுகின்றன; ஆனால் “குடியிருக்கிறது” என்ற வினை ஒருமையில் உள்ளது. இது முதலில் குறிப்பிடப்பட்ட ஆவியைக் குறிக்கலாம்; சூழலில் எல்லா ஆவிகளும் அங்கே குடியேறுவது உட்பொருளாகவும் இருக்கலாம்.
    reason: source_ambiguity
  - marker: c
    text: 'சொல்லுக்குச் சொல்: “அந்த மனிதனின் இறுதியானவை முதலானவற்றைவிட மோசமாகின்றன”; இது அவனுடைய இறுதி நிலை முந்தைய நிலையைவிட மோசமாவதைக் குறிக்கும் மரபுத்தொடர்.'
    reason: idiom
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: நிகழ்வின் அடுத்த கட்டத்தைக் குறிக்கும் இயல்பான காலச் சொல்.
- source_word: πορεύεται καὶ παραλαμβάνει μεθ’ ἑαυτοῦ
  choice: அது போய்… தன்னுடன் கூட்டிக்கொள்கிறது
  rationale: ஆவி சென்று மற்ற ஆவிகளைத் தன்னோடு சேர்த்துக்கொள்ளும் தொடர்ச்சியான செயலைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἑπτὰ ἕτερα πνεύματα
  choice: வேறு ஏழு ஆவிகள்
  rationale: ἕτερα என்பது இங்கு முதலாவது ஆவிக்கு மேலாக இன்னும் ஏழு ஆவிகள் என்பதைக் குறிக்கிறது; அவை வேறொரு வகையைச் சேர்ந்தவை என்று கட்டாயமாக வலியுறுத்தவில்லை.
- source_word: πονηρότερα ἑαυτοῦ
  choice: தன்னைவிடப் பொல்லாத
  rationale: ஒப்பீட்டு வடிவத்தையும் தீய இயல்பின் அதிகரிப்பையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: εἰσελθόντα κατοικεῖ ἐκεῖ
  choice: அவை உள்ளே நுழைந்ததும், அது அங்கே குடியிருக்கிறது
  rationale: பன்மை பங்கேற்புவினைக்கும் ஒருமை முதன்மை வினைக்கும் இடையிலான கிரேக்க எண்ணிக்கை மாற்றத்தைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
- source_word: τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου
  choice: அந்த மனிதனின் இறுதி நிலை
  rationale: சொல்லுக்குச் சொல் வடிவமான ‘இறுதியானவை’ என்பதை நவீன தமிழில் புரியும் வகையில் அதன் நிலைமையைக் குறிக்கும் மரபுத்தொடராக அளிக்கிறது.
- source_word: χείρονα τῶν πρώτων
  choice: அவனுடைய முந்தைய நிலையைவிட மோசமாகிறது
  rationale: இறுதி நிலைக்கும் முந்தைய நிலைக்கும் இடையிலான ஒப்பீட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ
  choice: இந்தப் பொல்லாத தலைமுறைக்கும் இப்படியே ஆகும்
  rationale: உவமையின் நிலையை அக்காலத் தலைமுறைக்குப் பொருத்தும் முடிவைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: πνεύματα என்பதன் பேய்சார் பொருள்
  choice: ஆவிகள்
  alternative: பேய்கள்
  rationale: கிரேக்க மூலத்தில் ‘ஆவிகள்’ என்றே உள்ளது; முந்தைய சூழல் அவை அசுத்த ஆவிகள் என்பதை ஏற்கெனவே விளக்குவதால், இங்கு அதிகக் குறிப்புடைய சொல்லைச் சேர்க்கவில்லை.
- issue: ἀνθρώπου என்பதன் பாலின வெளிப்பாடு
  choice: அந்த மனிதன்
  alternative: அந்த நபர்
  rationale: எடுத்துக்காட்டில் உள்ள பெயர்ச்சொல் ஒருமையிலும் ஆண்பால் தொடர்புடைய வடிவிலும் இருப்பதால், மூலத்தின் உருவத்தைப் பாதுகாக்க ‘மனிதன்’ பயன்படுத்தப்பட்டுள்ளது.
- issue: κατοικεῖ என்ற ஒருமை வினையின் குறிப்பு
  choice: அது அங்கே குடியிருக்கிறது
  alternative: அவை அங்கே குடியிருக்கின்றன
  rationale: அச்சிடப்பட்ட கிரேக்க உரை, உள்ளே நுழையும் ஆவிகளைப் பன்மையில் குறிப்பிட்டபின் ‘குடியிருக்கிறது’ என்பதை ஒருமையில் தருகிறது. இதை எல்லா ஆவிகளையும் குறிக்கும் பன்மையாக அமைதியாகச் சீராக்காமல், முதல் ஆவியைக் குறிக்கக்கூடிய ஒருமையை முதன்மை உரையில் பாதுகாத்துள்ளோம்.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘குடியிருக்கிறது’ என்பது தற்காலிக இருப்பை விட κατοικέω-வின் நிலையான வசிப்புப் பொருளைத் தருகிறது; கிரேக்க உரையின் ஒருமை–பன்மை பதற்றம் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
