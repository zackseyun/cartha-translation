source:
  edition: SBLGNT
  text: εἰ δὲ ἐν πνεύματι θεοῦ ἐγὼ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/028.yaml
  text: But if I cast out the demons by the Spirit of God[b][a], then the kingdom of God has come upon you.
translation:
  language: ta
  text: ஆனால் நான் கடவுளின் ஆவியால்[a] பேய்களை விரட்டுகிறேன் என்றால், கடவுளின் அரசாட்சி உங்கள்மேல் வந்துவிட்டது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடவுளின் ஆவியில்.’ கிரேக்கச் சொற்றொடர் வழிமுறை அல்லது செயலாற்றும் முகமை என்ற பொருளிலும், ‘கடவுளின் ஆவியில்’ என்றும் மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘உங்களை வந்தடைந்துவிட்டது’ அல்லது ‘உங்கள்மேல் வந்து சேர்ந்துவிட்டது’ என்றும் மொழிபெயர்க்கலாம். இயேசுவின் செயல்களில் கடவுளின் அரசாட்சி அவர்களை எட்டிவிட்டது என்பதை கிரேக்க வினை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: ஆனால் ... என்றால்
  rationale: δέ குறிக்கும் மிதமான எதிர்மறைத் திருப்பத்தையும் εἰ குறிக்கும் நிபந்தனையையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἐν πνεύματι θεοῦ
  choice: கடவுளின் ஆவியால்
  rationale: ἐν + வேற்றுமை இங்கு வழிமுறை அல்லது செயலாற்றும் முகமையைக் குறிக்கலாம்; ‘ஆவியால்’ என்பது இயேசு பேய்களை விரட்டுவது கடவுளின் ஆவியின் செயலால் என்பதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐγὼ
  choice: நான்
  rationale: கிரேக்கத்தில் வெளிப்படையாக வரும் சுட்டுப்பெயரின் வலியுறுத்தலைத் தமிழிலும் தக்கவைக்கிறது.
- source_word: ἐκβάλλω
  choice: விரட்டுகிறேன்
  rationale: பேய்களை வெளியேற்றும் செயலை சாதாரண வாசகருக்குத் தெளிவாகவும் வலிமையாகவும் கூறும் இயல்பான தமிழ் வினை.
- source_word: τὰ δαιμόνια
  choice: பேய்களை
  rationale: δαιμόνια குறிக்கும் தீய ஆவிக்குரிய உயிர்களை நவீனத் தமிழில் நேரடியாகவும் புரிந்துகொள்ளத்தக்க வகையிலும் குறிக்கிறது.
- source_word: ἄρα
  choice: (நிபந்தனைத் தொடரில்) ... வந்துவிட்டது
  rationale: ‘என்றால்’ அமைப்போடு வரும் முடிவுரை தமிழில் இயல்பாகவே தர்க்கத் தீர்மானத்தைக் காட்டுவதால் தனியாக ‘அப்படியானால்’ சேர்க்கப்படவில்லை.
- source_word: ἔφθασεν
  choice: வந்துவிட்டது
  rationale: φθάνω இங்கு வந்து சேர்ந்தது அல்லது எட்டியது என்ற பொருளைக் கொண்டது; நிறைவுற்ற வருகையின் தற்போதைய விளைவை ‘வந்துவிட்டது’ தெளிவாகக் காட்டுகிறது.
- source_word: ἐφ’ ὑμᾶς
  choice: உங்கள்மேல்
  rationale: ἐπίயின் ‘மேல்/மீது வந்து சேருதல்’ என்ற உயிரோட்டத்தையும், வருகையின் சவாலான நுண்சாயலையும் தக்கவைக்கிறது.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: கடவுளின் அரசு
  rationale: βασιλείαவின் அரசாட்சி மற்றும் அரசுக்குரிய வெளி ஆகிய இரு நுண்பொருள்களுக்கும் இடமளிக்கும் இயல்பான, சுருக்கமான தமிழ்.
theological_decisions:
- issue: இயேசுவின் பேய் விரட்டுதல்களுக்கும் கடவுளின் அரசுக்கும் உள்ள தொடர்பு
  choice: ஆவியால் நிகழும் பேய் விரட்டுதல், கடவுளின் அரசு கேட்போர்மேல் உண்மையாக ஏற்கெனவே வந்து சேர்ந்திருப்பதற்கான சான்றாகக் கூறப்படுகிறது.
  alternative: அரசு வெறுமனே அருகில் வந்துள்ளது அல்லது எதிர்காலத்தில் மட்டுமே வரும்.
  rationale: ἔφθασεν என்பது வந்து எட்டியதைக் குறிக்கிறது; இருப்பினும் வசனம் எதிர்கால நிறைவைப் பற்றி தீர்ப்பளிக்காததால், ஏற்கெனவே வந்திருப்பதும் இன்னும் நிறைவு பெற வேண்டியிருப்பதும் இடையிலான பதற்றம் அமைதியாகத் தக்கவைக்கப்படுகிறது.
- issue: ‘கடவுளின் ஆவி’ என்பதன் குறிப்பு
  choice: இயேசுவின் செயலின் தெய்வீக முகவராகக் கடவுளின் ஆவியைக் குறிக்கிறது.
  alternative: தனிப்பட்ட முகமை இல்லாத ஒரு பொதுவான தெய்வீக ஆற்றல்.
  rationale: πνεύματι θεοῦ என்ற சொற்றொடரும் சூழலும் ஆவியைச் செயலாற்றும் தெய்வீக முகவராகக் காட்டுகின்றன; மொழிபெயர்ப்பு இதற்கு அப்பாற்பட்ட விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பானதும் கண்ணியமானதும். ‘கடவுள்,’ ‘ஆவி,’ ‘அரசு,’ ‘பேய்’ ஆகிய பொதுவாகப் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் நிபந்தனை, ‘நான்’ என்ற வலியுறுத்தல், அரசின் வருகை ஆகியவை தக்கவைக்கப்பட்டுள்ளன.
