id: MAT.12.14
reference: Matthew 12:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂ἐξελθόντες δὲ οἱ Φαρισαῖοι συμβούλιον ἔλαβον κατ’ αὐτοῦ⸃ ὅπως αὐτὸν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/014.yaml
  text: But the Pharisees went out and conspired against him, how they might destroy him.
translation:
  language: ta
  text: ஆனால் பரிசேயர்கள் வெளியே போய், அவரை எப்படி அழித்துவிடலாம்[a] என்று அவருக்கு எதிராகத் திட்டம் தீட்டினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கொன்றுவிடலாம்” அல்லது “சாகடிக்கலாம்.” கிரேக்கச் சொல் “அழித்துவிடலாம்” என்று பொருள்படும்; இச்சூழலில் அது கொல்லும் நோக்கத்தையும் உள்ளடக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: வெளியே போய்
  rationale: இறந்தகாலப் பங்கேற்பு வினை தொடர்ச்சியாக நிகழ்ந்த செயல்களைக் காட்டுகிறது; இயல்பான தமிழில் முதலில் அவர்கள் வெளியே சென்றதைக் குறிப்பிடுகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: இயேசுவின் செயலுக்கும் பரிசேயர்களின் பகைமையான எதிர்வினைக்கும் இடையிலான மிதமான முரண்பாட்டைக் காட்டுகிறது.
- source_word: οἱ Φαρισαῖοι
  choice: பரிசேயர்கள்
  rationale: இந்த யூதக் குழுவின் பெயருக்கான நிலைபெற்ற தமிழ் ஒலிபெயர்ப்பு.
- source_word: συμβούλιον ἔλαβον
  choice: திட்டம் தீட்டினார்கள்
  rationale: சொல்லுக்கு சொல் ‘ஆலோசனை பெற்றார்கள்/நடத்தினார்கள்’ எனும் இந்த மரபுத்தொடர், இப்பகைமையான சூழலில் ஒருங்கிணைந்து திட்டமிட்டதைக் குறிக்கிறது; இயல்பான தமிழில் நோக்கத்தை மிகைப்படுத்தாமல் வெளிப்படுத்துகிறது.
- source_word: κατ’ αὐτοῦ
  choice: அவருக்கு எதிராக
  rationale: κατά என்பதன் எதிர்ப்புப் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: ὅπως
  choice: எப்படி ...லாம் என்று
  rationale: அவர்களுடைய திட்டத்தின் உள்ளடக்கத்தையும் ஆலோசனை சார்ந்த நுண்பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀπολέσωσιν
  choice: அழித்துவிடலாம்
  rationale: ἀπόλλυμι என்பதன் ‘அழித்தல்’ என்ற பரந்த பொருளைக் காக்கிறது; இச்சூழலில் உள்ள கொல்லும் நோக்கத்தை மறைக்காமலும், மூலத்தில் உள்ளதைவிடக் குறிப்பாகச் சொல்லாமலும் இருக்கிறது.
theological_decisions:
- issue: ἀπολέσωσιν என்பதன் பொருளை எவ்வளவு குறிப்பாக மொழிபெயர்ப்பது
  choice: அழித்துவிடலாம்
  alternative: கொன்றுவிடலாம் / சாகடிக்கலாம்
  rationale: சூழல் உயிரைப் பறிக்கும் பகைமையான நோக்கத்தை வலுவாகக் காட்டினாலும், கிரேக்க வினைச்சொல் வெளிப்படையாக ‘கொல்’ என்று மட்டும் கூறுவதைவிடப் பரந்தது. ஆகவே முதன்மைப் பாடம் அதன் பரந்த சொல்லாட்சியைக் காக்கிறது; சூழலுக்கேற்ற குறிப்பான மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘திட்டம் தீட்டினார்கள்’ என்பது கூட்டு ஆலோசனையையும் பகைமையான திட்டத்தையும் இயல்பாகத் தெரிவிக்கிறது.
