source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἀκούσαντες εἶπον· Οὗτος οὐκ ἐκβάλλει τὰ δαιμόνια εἰ μὴ ἐν τῷ Βεελζεβοὺλ ἄρχοντι τῶν δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/024.yaml
  text: But when the Pharisees heard it[a], they said, “This man does not cast out demons except by Beelzebul, the ruler of the demons.”
translation:
  language: ta
  text: ஆனால் பரிசேயர்கள் அதைக் கேட்டபோது, “இவன் பேய்களின் தலைவனான பெயெல்செபூல்[a] மூலமாக அல்லாமல் பேய்களை விரட்டுவதில்லை” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'பெயெல்செபூல்: பாரம்பரியமாக ‘பெயெல்செபூப்’ என்றும் வழங்கப்படுகிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் மக்களின் வியப்புக்கும் பரிசேயர்களின் எதிர்மறையான குற்றச்சாட்டுக்கும் இடையிலுள்ள முரண்பாட்டை இயல்பாகக் காட்டுகிறது.
- source_word: ἀκούσαντες
  choice: அதைக் கேட்டபோது
  rationale: இறந்தகாலப் பங்கேற்புவினையின் காலத் தொடர்பை இயல்பான தமிழில் தருகிறது; கிரேக்கத்தில் வெளிப்படையாக இல்லாத செயப்படுபொருள் முந்தைய நிகழ்விலிருந்து தெளிவாக இருப்பதால் ‘அதை’ எனக் குறிப்பிடப்படுகிறது.
- source_word: Οὗτος
  choice: இவன்
  rationale: இயேசுவைக் குறித்த பரிசேயர்களின் இகழ்ச்சியான, விலகிய தொனியைத் தமிழில் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ἐκβάλλει τὰ δαιμόνια
  choice: பேய்களை விரட்டுகிறான்
  rationale: பேய்களை ஒருவரிடமிருந்து வெளியேற்றுவதைக் குறிக்கும் தெளிவான, வழக்கமான நவீனத் தமிழ் சொல்லாக்கம்.
- source_word: εἰ μὴ ἐν τῷ Βεελζεβοὺλ
  choice: பெயெல்செபூல் மூலமாகத்தான்
  rationale: εἰ μὴ கட்டமைப்பு குறிக்கும் ‘வேறு எந்த வழியிலும் அல்ல, இதன் மூலமாக மட்டுமே’ என்ற பிரத்தியேகப் பொருளையும், ἐν இங்கு குறிக்கும் கருவி அல்லது செயலாற்றும் முகவர் சார்ந்த பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: Βεελζεβοὺλ
  choice: பெயெல்செபூல்
  rationale: SBLGNT கிரேக்கப் பெயர் வடிவத்தைத் தமிழில் ஒலிபெயர்க்கிறது; பாரம்பரிய மாற்று வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἄρχοντι τῶν δαιμονίων
  choice: பேய்களின் தலைவனான
  rationale: ἄρχων குறிக்கும் ஆளுகை மற்றும் அதிகாரத்தை சாதாரண வாசகர்களுக்குத் தெளிவான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: Οὗτος என்பதிலுள்ள பகைமையான தொனி
  choice: இவன்
  alternative: இவர் / இந்த மனிதன்
  rationale: பரிசேயர்களின் இகழ்ச்சியான பேச்சுத் தொனியைப் பாதுகாக்கிறது; அதே நேரத்தில் கூடுதல் கோட்பாட்டு விளக்கம் எதையும் சேர்ப்பதில்லை.
- issue: Βεελζεβούλ என்ற பெயரின் வடிவம்
  choice: பெயெல்செபூல்
  alternative: பெயெல்செபூப்
  rationale: முதன்மை உரை கிரேக்க மூலத்தில் உள்ள பெயர் வடிவத்தையே பின்பற்றுகிறது; பரவலாக அறியப்பட்ட பாரம்பரிய வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἐν τῷ Βεελζεβοὺλ குறிக்கும் வழிமுறை அல்லது முகவர்
  choice: பெயெல்செபூல் மூலமாகத்தான்
  alternative: பெயெல்செபூலின் வல்லமையால்தான்
  rationale: சூழலில் உள்ள வழிமுறை அல்லது முகவர் பொருளைத் தெளிவாகத் தருவதோடு, கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘வல்லமை’ என்ற சொல்லை முதன்மை உரையில் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், ஆனால் கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘இவன்’ என்பது பரிசேயர்களின் பகைமையான தொனியைப் பாதுகாக்கிறது; அது மொழிபெயர்ப்பாளரின் சொந்த மதிப்பீடாக அல்ல, மேற்கோள் பேச்சின் ஒரு பகுதியாக வருகிறது. ‘மூலமாகத்தான்’ என்பது மூலத்தின் விலக்குப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
