id: MAT.12.18
reference: Matthew 12:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἰδοὺ ὁ παῖς μου ὃν ᾑρέτισα, ὁ ἀγαπητός μου ⸂εἰς ὃν⸃ εὐδόκησεν ἡ ψυχή μου· θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν, καὶ κρίσιν τοῖς ἔθνεσιν ἀπαγγελεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/018.yaml
  text: Behold[a], my servant whom I have chosen, my beloved in whom my soul has delighted. I will put my Spirit upon him[c][b], and he will proclaim justice to the nations.
translation:
  language: ta
  text: “இதோ, நான் தேர்ந்தெடுத்த என் ஊழியர், என் அன்புக்குரியவர்; இவரில் என் உள்ளம் மகிழ்ந்தது. என் ஆவியை இவர்மேல் வைப்பேன்; இவர் தேசங்களுக்கு நீதியை அறிவிப்பார்.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நீதியை” என்பதற்கு “நியாயத்தீர்ப்பை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: தீர்க்கதரிசன மேற்கோளின் கவனத்தை ஈர்க்கும் வலிமையை இயல்பான, சற்றே உயர்ந்த தமிழில் தக்கவைக்கிறது.
- source_word: παῖς
  choice: பணியாளர்
  rationale: ஏசாயாவின் ஊழியர் பின்னணியில் இது ‘குழந்தை’ அல்லது ‘மகன்’ என்பதைக் காட்டிலும் கடவுளால் நியமிக்கப்பட்ட பணியாளரைக் குறிக்கிறது.
- source_word: ᾑρέτισα
  choice: நான் தேர்ந்தெடுத்த
  rationale: கடவுளின் நிறைவேறிய தேர்வைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ὁ ἀγαπητός μου
  choice: நான் அன்புகூருகிறவர்
  rationale: அன்புக்குரியவர் என்ற பொருளை நவீன தமிழில் இயல்பாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
- source_word: εὐδόκησεν ἡ ψυχή μου
  choice: இவரில் என் உள்ளம் மகிழ்ந்தது
  rationale: ψυχή என்பதைக் ‘உள்ளம்’ என்று வழங்கி, வெளிப்பாட்டின் தனிப்பட்ட உணர்வையும் இறந்தகால வினையின் வடிவையும் தக்கவைக்கிறது.
- source_word: θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν
  choice: என் ஆவியை இவர்மேல் வைப்பேன்
  rationale: தீர்க்கதரிசன நியமிப்பின் மொழியை நெருக்கமாகப் பாதுகாக்கிறது; ‘ஆவி’ கடவுளுடைய ஆவியைக் குறிக்கிறது.
- source_word: κρίσιν
  choice: நீதி
  rationale: ஏசாயா மேற்கோளின் சூழலில் தேசங்களுக்கு கொண்டுவரப்படும் கடவுளின் நீதியான ஒழுங்கை ‘நீதி’ தெளிவாக வெளிப்படுத்துகிறது; ‘நியாயத்தீர்ப்பு’ என்ற சாத்தியமும் குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: τοῖς ἔθνεσιν
  choice: தேசங்களுக்கு
  rationale: ἔθνη என்பதன் பரந்த, உலகளாவிய நோக்கத்தைத் தக்கவைக்கிறது; இங்கு இனவாரியான ‘புறவினத்தார்’ என்பதைக் காட்டிலும் ஏற்றது.
- source_word: ἀπαγγελεῖ
  choice: அறிவிப்பார்
  rationale: பொதுவாகவும் அதிகாரபூர்வமாகவும் தெரிவிக்கும் வினையின் பொருளை இயல்பான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: παῖς என்பதில் மேசியப் பணியாளர் அடையாளம்
  choice: ‘பணியாளர்’ என்று மொழிபெயர்த்தல்
  alternative: ‘குழந்தை’ அல்லது ‘மகன்’
  rationale: இது ஏசாயாவின் பணியாளர் பாடலை மேற்கோள் காட்டுவதால், பழைய ஏற்பாட்டு இடைஉரைத் தொடர்பைப் பாதுகாக்கிறது; இந்தச் சொல்லில் வெளிப்படையாக இல்லாத மகன் என்ற பொருளைச் சேர்ப்பதில்லை.
- issue: தீர்க்கதரிசனப் பணியின் சூழலில் κρίσις
  choice: முதன்மை உரையில் ‘நீதி’
  alternative: ‘நியாயத்தீர்ப்பு’
  rationale: தேசங்களுக்கு அறிவிக்கப்படும் கடவுளின் நீதியான ஒழுங்கை ‘நீதி’ நன்றாக வெளிப்படுத்துகிறது. கிரேக்கச் சொல்லின் தீர்ப்பு சார்ந்த பொருள் அடிக்குறிப்பில் தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான தீர்க்கதரிசன மேற்கோள் நடை. மரியாதை ஒருமை வினை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; தேவையற்ற சமயக்குழுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
