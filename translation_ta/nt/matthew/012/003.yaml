id: MAT.12.3
reference: Matthew 12:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Οὐκ ἀνέγνωτε τί ἐποίησεν Δαυὶδ ὅτε ⸀ἐπείνασεν καὶ οἱ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/003.yaml
  text: But he said to them[a], “Have you not read what David did when he was hungry, and those with him were hungry?”
translation:
  language: ta
  text: அவர் அவர்களிடம், “தாவீதும் அவருடன் இருந்தவர்களும் பசியாயிருந்தபோது, அவர் என்ன செய்தார் என்பதை நீங்கள் வாசிக்கவில்லையா?[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் ‘பசியாயிருந்தார்’ என்ற வினை ஒருமையில் தாவீதைக் குறிப்பதாக உள்ளது. ஆயினும், ‘அவருடன் இருந்தவர்களும்’ என்பதையும் பசியாயிருந்தவர்களாகப் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: அவர்
  rationale: δέ முந்தைய குற்றச்சாட்டுக்கான பதிலை மென்மையாக இணைக்கிறது. தமிழில் இயல்பான உரையோட்டத்திற்காக தனியே ‘ஆனால்’ என்று மொழிபெயர்க்காமல் விடப்பட்டுள்ளது.
- source_word: εἶπεν αὐτοῖς
  choice: அவர் அவர்களிடம் ... என்றார்
  rationale: தமிழின் இயல்பான மேற்கோள் அமைப்பில் λέγω + dative என்பதற்கு ‘அவர்களிடம் ... என்றார்’ நேர்த்தியான இணை.
- source_word: Οὐκ ἀνέγνωτε
  choice: நீங்கள் வாசிக்கவில்லையா?
  rationale: வேதவசனத்தை அவர்கள் அறிந்திருக்க வேண்டும் என்பதை உணர்த்தும் எதிர்பார்ப்புள்ள வினாவாக கிரேக்க இறந்தகால வடிவத்தின் சொல்லாட்சிச் சக்தியைத் தருகிறது.
- source_word: τί ἐποίησεν
  choice: என்ன செய்தார்
  rationale: ποιέω இங்கு எளிய வரலாற்றுச் செயலைக் குறிக்கிறது; கூடுதல் விளக்கம் தேவையில்லை.
- source_word: Δαυὶδ
  choice: தாவீது
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவம்.
- source_word: ὅτε ἐπείνασεν
  choice: பசியாயிருந்தபோது
  rationale: πεινάω என்பதன் இயல்பான நவீனத் தமிழ் வெளிப்பாடு; சூழலில் தாவீதைக் குறிப்பதாகத் தெளிவாகிறது.
- source_word: καὶ οἱ μετ’ αὐτοῦ
  choice: அவருடன் இருந்தவர்களும்
  rationale: ‘அவரோடு இருந்தவர்கள்’ என்ற கிரேக்க அமைப்பை நெருக்கமாகவும் இயல்பாகவும் தருகிறது; καί-இன் இணைப்புப் பொருளை ‘-உம்’ காட்டுகிறது.
theological_decisions:
- issue: ὅτε ἐπείνασεν καὶ οἱ μετ’ αὐτοῦ என்பதில் பசி யாருக்குப் பொருந்துகிறது
  choice: முதன்மை உரையில் தாவீதுக்கும் அவருடன் இருந்தவர்களுக்கும் பசி பொருந்துமாறு மொழிபெயர்க்கப்பட்டது.
  alternative: ‘தாவீது பசியாயிருந்தபோது, அவருடன் இருந்தவர்களும்...’ என்று ஒருமை வினைச்சொல்லைத் தாவீதுக்கு மட்டும் வெளிப்படையாகப் பொருத்துதல்.
  rationale: ἐπείνασεν ஒருமையில் தாவீதைக் குறித்தாலும், καὶ οἱ μετ’ αὐτοῦ என்ற தொடரில் அதே கருத்து இணையாகப் புரிந்துகொள்ளப்படலாம். தமிழ் வாக்கியம் முழுமையாகவும் இயல்பாகவும் இருக்க முதன்மை உரையில் இரு தரப்பையும் இணைத்துள்ளது; இலக்கண நுட்பம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமும் பொதுமக்களுக்கு எளிதில் புரியும் தன்மையும் காக்கப்பட்டுள்ளன. இயல்பான தமிழ் மேற்கோள் வரிசை பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் உண்மையான இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
