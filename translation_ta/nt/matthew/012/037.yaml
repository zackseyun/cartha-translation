review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents γάρ, the repeated ἐκ τῶν λόγων σου as the evidentiary basis, and the future passive judicial contrast between δικαιωθήσῃ and καταδικασθήσῃ. However, the Tamil judicial predicates can be made more idiomatic and more exactly parallel.
  naturalness: “நீதிமானாகத் தீர்க்கப்படுவாய்” is understandable but can suggest becoming righteous rather than receiving a verdict. “கண்டனத் தீர்ப்புப் பெறுவாய்” is comparatively cumbersome and does not parallel the first clause as closely as the Greek does. Using “என்று தீர்க்கப்படுவாய்” in both clauses is natural, clear modern Tamil legal-style wording.
  terminology: “நீதிமான் என்று தீர்க்கப்படுவாய்” preserves the established biblical and forensic force of δικαιόω without adding a doctrinal explanation. “குற்றவாளி என்று தீர்க்கப்படுவாய்” gives the judicial antithesis intended by καταδικασθήσῃ. The footnote alternatives are revised for natural Tamil and retained as lexical alternatives.
  issues:
  - severity: medium
    issue: The two judicial outcomes are expressed with nonparallel Tamil constructions.
    rationale: The Greek uses two matching future passive verbs. Recasting both as verdict formulas preserves the deliberate courtroom parallelism and improves readability.
  - severity: low
    issue: The existing footnote’s phrase “நியாயமானவன் என்று மெய்ப்பிக்கப்படுவாய்” is not idiomatic modern Tamil.
    rationale: A direct judicial alternative such as “நீ சரியானவன் எனத் தீர்க்கப்படுவாய்” communicates vindication more naturally, while “குற்றமற்றவன் எனத் தீர்க்கப்படுவாய்” expresses acquittal.
  revised_text: ஏனெனில், உன் வார்த்தைகளின் அடிப்படையில் நீ நீதிமான் என்று தீர்க்கப்படுவாய்[a]; உன் வார்த்தைகளின் அடிப்படையில் நீ குற்றவாளி என்று தீர்க்கப்படுவாய்.
