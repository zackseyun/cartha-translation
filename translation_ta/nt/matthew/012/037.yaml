revisions:
- from: ஏனெனில், உன் வார்த்தைகளின் அடிப்படையில் நீ நீதிமானாகத் தீர்க்கப்படுவாய்[a]; உன் வார்த்தைகளின் அடிப்படையிலேயே நீ கண்டனத் தீர்ப்புப் பெறுவாய்.
  to: ஏனெனில், உன் வார்த்தைகளின் அடிப்படையில் நீ நீதிமான் என்று தீர்க்கப்படுவாய்[a]; உன் வார்த்தைகளின் அடிப்படையில் நீ குற்றவாளி என்று தீர்க்கப்படுவாய்.
