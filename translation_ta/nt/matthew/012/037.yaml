  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐκ γὰρ τῶν λόγων σου δικαιωθήσῃ, καὶ ἐκ τῶν λόγων σου καταδικασθήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/037.yaml
  text: For by your words you will be justified[a], and by your words you will be condemned.
translation:
  language: ta
  text: ஏனெனில், உன் வார்த்தைகளின் அடிப்படையில் நீ நீதிமான் என்று தீர்க்கப்படுவாய்[a]; உன் வார்த்தைகளின் அடிப்படையில் நீ குற்றவாளி என்று தீர்க்கப்படுவாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நீ சரியானவன் எனத் தீர்க்கப்படுவாய்’ அல்லது ‘குற்றமற்றவன் எனத் தீர்க்கப்படுவாய்.’ கிரேக்க வினைச்சொல், நீதிமன்றச் சூழலில் ஒருவர் சரியானவர் அல்லது குற்றமற்றவர் என்று தீர்ப்பளிக்கப்படுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: அடிப்படையில்
  rationale: இங்கு ἐκ என்பது ஒருவரின் வார்த்தைகள் தீர்ப்புக்கான அடிப்படை அல்லது சான்றாக இருப்பதைக் குறிக்கிறது. ‘அடிப்படையில்’ என்பது அந்த நீதித்துறை சார்ந்த உறவை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் சொல்லப்பட்ட பேச்சைப் பற்றிய எச்சரிக்கைக்கான காரணத்தை γάρ அறிமுகப்படுத்துகிறது; ‘ஏனெனில்’ அதன் இணைப்புப் பொருளைப் பாதுகாக்கிறது.
- source_word: λόγων σου
  choice: உன் வார்த்தைகள்
  rationale: λόγων என்பது இங்கு பேசப்பட்ட சொற்கள் அல்லது உரைகளைக் குறிக்கிறது. இரு கூறுகளிலும் வரும் இணை அமைப்பை ‘உன் வார்த்தைகள்’ நேரடியாகப் பாதுகாக்கிறது.
- source_word: δικαιωθήσῃ
  choice: நீதிமானாகத் தீர்க்கப்படுவாய்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவமான δικαιωθήσῃ, καταδικασθήσῃ என்பதற்கு எதிரிணையாக நீதிமன்றப் பொருளைக் கொண்டுள்ளது. ‘நீதிமானாகத் தீர்க்கப்படுவாய்’ என்பது ஒருவர் சரியானவர் என்று தீர்ப்பளிக்கப்படுவதைத் தெரிவிக்கிறது; தனிப்பட்ட கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: καταδικασθήσῃ
  choice: கண்டனத் தீர்ப்புப் பெறுவாய்
  rationale: இச்சொல் நீதித்துறைச் சூழலில் குற்றத்தீர்ப்பு அல்லது கண்டனத் தீர்ப்பைக் குறிக்கிறது. தேர்ந்தெடுக்கப்பட்ட தமிழ், முந்தைய கூறின் நீதிமன்ற எதிரிணையைத் தெளிவாக வைத்திருக்கிறது.
theological_decisions:
- issue: பேச்சும் தீர்ப்பும் தொடர்பான சூழலில் δικαιόω என்பதன் நீதித்துறைப் பொருள்
  choice: ‘நீதிமானாகத் தீர்க்கப்படுவாய்’ என்று நீதித்துறைப் பொருளில் மொழிபெயர்த்தல்
  alternative: ‘குற்றமற்றவன் என்று தீர்க்கப்படுவாய்’ அல்லது ‘நியாயமானவன் என்று மெய்ப்பிக்கப்படுவாய்’
  rationale: அடுத்ததாக வரும் ‘கண்டனத் தீர்ப்புப் பெறுவாய்’ என்ற எதிரிணை நீதிமன்றச் சூழலைத் தெளிவாக்குகிறது. தேர்ந்தெடுக்கப்பட்ட வாசகம் மூலச்சொல்லின் பரந்த வேதாகமத் தொடர்பைப் பாதுகாக்கிறது; அதேவேளையில் இந்த வசனம் கூறுவதற்கு அப்பாற்பட்ட நீதிமானாக்குதல் குறித்த கோட்பாட்டை உட்புகுத்துவதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான நீதித்துறை நடையைப் பயன்படுத்துகிறது. கிரேக்கத்தின் இரு இணையான கூறுகளும் ‘உன் வார்த்தைகளின் அடிப்படையில்’ என்ற மீளுரைப்பால் பாதுகாக்கப்பட்டுள்ளன; இரண்டாம் கூறிலுள்ள καί வலியுறுத்தும் இணைப்பாக ‘அடிப்படையிலேயே’ என்று இயல்பாக்கப்பட்டுள்ளது.
