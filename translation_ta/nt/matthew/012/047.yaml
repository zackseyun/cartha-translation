  source_fidelity: 'The verse is translated faithfully overall: the indefinite speaker, attention signal, mother and male siblings, their location outside, and their purpose in speaking are all retained. However, ‘பேச விரும்பி’ (‘wanting to speak’) slightly weakens ζητοῦντες, which expresses seeking/endeavoring to speak.'
