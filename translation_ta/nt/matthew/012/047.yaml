source:
  edition: SBLGNT
  text: ⸂εἶπεν δέ τις αὐτῷ· Ἰδοὺ ἡ μήτηρ σου καὶ οἱ ἀδελφοί σου ἔξω ἑστήκασιν, ζητοῦντές σοι λαλῆσαι.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/047.yaml
  text: Then someone said to him[a], “Look, your mother and your brothers are standing outside, seeking to speak to you.”
translation:
  language: ta
  text: அப்போது ஒருவர் அவரிடம்[a], “இதோ, உமது தாயும் உமது சகோதரர்களும் உம்மிடம் பேச நாடி வெளியே நிற்கிறார்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் இந்த வசனம் இல்லை.
    reason: textual_variant
lexical_decisions:
- source_word: εἶπεν δέ τις αὐτῷ
  choice: அப்போது ஒருவர் அவரிடம் … என்றார்
  rationale: δέ இங்கு மென்மையான கதைத் தொடர்ச்சியைக் குறிக்கிறது; ‘அப்போது’ இயல்பான நிகழ்வுப் போக்கைத் தருகிறது. τις என்பதன் வரையறையற்ற தன்மையை ‘ஒருவர்’ காக்கிறது.
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் சுட்டுச் சொல்லான ἰδού-வின் நேரடியான உணர்வை, நவீன தமிழிலும் இயல்பாகப் புரியும் ‘இதோ’ காக்கிறது.
- source_word: ἡ μήτηρ σου
  choice: உமது தாய்
  rationale: உறவையும் இரண்டாம் நபர் உடைமையையும் நேரடியாகக் காட்டுகிறது; இயேசுவை நோக்கிய மரியாதையான ஒருமை நடை பயன்படுத்தப்பட்டுள்ளது.
- source_word: οἱ ἀδελφοί σου
  choice: உமது சகோதரர்கள்
  rationale: இச்சூழலில் ἀδελφοί ஆண் குடும்ப உறுப்பினர்களைக் குறிக்கிறது; ‘சகோதரர்கள்’ மூலத்தின் பாலினக் குறிப்பைக் காக்கிறது.
- source_word: ἔξω ἑστήκασιν
  choice: வெளியே நிற்கிறார்கள்
  rationale: ἵστημι என்பதன் நிறைவுக்கால வடிவம் விளைவாகத் தொடரும் தற்போதைய நிலையைச் சுட்டுகிறது; ‘நிற்கிறார்கள்’ அதைக் காக்கிறது, ‘வெளியே’ ἔξω-வை வெளிப்படையாக மொழிபெயர்க்கிறது.
- source_word: ζητοῦντές σοι λαλῆσαι
  choice: உம்மிடம் பேச விரும்பி
  rationale: ζητέω இங்கு நோக்கம் அல்லது முயற்சியைச் சுட்டுகிறது. தமிழில் ‘பேசத் தேடி’ என்பது இயல்பற்றதாக இருப்பதால், ‘பேச விரும்பி’ பொருளை இயல்பாக அளிக்கிறது; σοι λαλῆσαι என்பதற்கு ‘உம்மிடம் பேச’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: மத்தேயு 12:47-ன் உரைவிமர்சன நிலை
  choice: வழங்கப்பட்ட SBLGNT உரையின்படி வசனத்தை முதன்மை உரையில் சேர்த்து, சில கையெழுத்துப் பிரதிகளில் அது விடுபட்டிருப்பதை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: சில சாட்சிகளில் இல்லாததால் வசனத்தை முதன்மை உரையிலிருந்து விடுதல்
  rationale: SBLGNT இல் இவ்வசனம் அடைப்புக் குறியீட்டுடன் வழங்கப்பட்டுள்ளது. கொடுக்கப்பட்ட மூல உரையை மொழிபெயர்த்து, குறிப்பிடத்தக்க உரை வேறுபாட்டை மறைக்காமல் அடிக்குறிப்பில் வெளிப்படையாகப் பதிவு செய்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாகப் புரியும் தமிழ். இயேசுவை நேரடியாகச் சுட்டும் உரையில் மரியாதையான ஒருமை வடிவங்களான ‘உமது/உம்மிடம்’ பயன்படுத்தப்பட்டுள்ளன; பேசுபவரைக் குறிக்க ‘என்றார்’ பயன்படுத்தப்பட்டுள்ளது.
