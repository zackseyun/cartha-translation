id: MAT.12.7
reference: Matthew 12:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ δὲ ἐγνώκειτε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν, οὐκ ἂν κατεδικάσατε τοὺς ἀναιτίους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/007.yaml
  text: But if you had known what this means[b][a], ‘I desire mercy and not sacrifice,’ you would not have condemned the guiltless.
translation:
  language: ta
  text: ஆனால், ‘நான் பலியை அல்ல, இரக்கத்தையே விரும்புகிறேன்’ என்பதன் பொருள் என்ன என்பதை நீங்கள் அறிந்திருந்தால்,[a] குற்றமற்றவர்களைக்[b] குற்றவாளிகள் என்று தீர்ப்பளித்திருக்கமாட்டீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இயேசு இங்கே ஓசியா 6:6-ஐ மேற்கோள் காட்டுகிறார்.
    reason: cross_reference
  - marker: b
    text: அல்லது, ‘அப்பாவிகளை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκειτε
  choice: அறிந்திருந்தால்
  rationale: இறந்தகால உண்மைக்கு மாறான நிபந்தனையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; முன்னரே புரிந்திருக்க வேண்டியதைப் பற்றிய இயேசுவின் கண்டனத்தையும் காக்கிறது.
- source_word: τί ἐστιν
  choice: என்பதன் பொருள் என்ன
  rationale: மேற்கோள் காட்டப்பட்ட வேதவாக்கின் கருத்தைப் புரிந்துகொள்வதைக் குறிக்கும் இயல்பான தமிழ் நடை.
- source_word: Ἔλεος
  choice: இரக்கம்
  rationale: ἔλεος என்பதன் கருணை சார்ந்த பொருளைச் சுருக்கமாகவும் சமயப்பிரிவு சாராத வகையிலும் தருகிறது.
- source_word: θέλω
  choice: விரும்புகிறேன்
  rationale: தீர்க்கதரிசன மேற்கோளுக்கு ஏற்ற கண்ணியமான நடையில் θέλω என்பதன் விருப்பத்தைக் காட்டுகிறது.
- source_word: θυσίαν
  choice: பலி
  rationale: θυσία என்பதற்கான இயல்பான வேதாகமத் தமிழ் சொல்; தீர்க்கதரிசன முரணை விரிவாக்கமின்றிக் காக்கிறது.
- source_word: κατεδικάσατε
  choice: தண்டனைக்குரியவர்கள் என்று தீர்த்திருக்கமாட்டீர்கள்
  rationale: καταδικάζω என்பதிலுள்ள குற்றத்தீர்ப்பின் நீதிமன்றச் சாயலைத் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது; உண்மைக்கு மாறான நிபந்தனையின் விளைவையும் காக்கிறது.
- source_word: ἀναιτίους
  choice: குற்றமற்றவர்களை
  rationale: நீதிமன்றச் சூழலுக்குரிய ‘குற்றமில்லாதவர்கள்’ என்ற பொருளை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: ஓசியா 6:6 மேற்கோள் பலியை முற்றிலும் நிராகரிப்பதாகத் தோன்றாமல், இரக்கத்திற்கு அளிக்கப்படும் தீர்க்கதரிசன முன்னுரிமையைப் பாதுகாத்தல்
  choice: நான் பலியை அல்ல, இரக்கத்தையே விரும்புகிறேன்
  alternative: நான் இரக்கத்தை விரும்புகிறேன், பலியை அல்ல
  rationale: கிரேக்கத்தின் கூர்மையான முரணைப் பாதுகாக்கிறது. ‘இரக்கத்தையே’ என்பது சூழலில் இரக்கத்தின் முன்னுரிமையை வலியுறுத்துகிறது; பலி என்ற நடைமுறையை எல்லாச் சூழலிலும் ஒழிப்பதாக விளக்கத்தைத் திணிக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. மேற்கோளின் சொல் வரிசை தமிழில் வலியுறுத்தலுடன் இயல்பாக அமைய மாற்றப்பட்டுள்ளது. அனைத்து அடிக்குறிப்பு குறிகளும் உரையில் இடம்பெற்றுள்ளன.
