source:
  edition: SBLGNT
  text: τότε λέγει τῷ ἀνθρώπῳ· Ἔκτεινόν ⸂σου τὴν χεῖρα⸃· καὶ ἐξέτεινεν, καὶ ἀπεκατεστάθη ὑγιὴς ὡς ἡ ἄλλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/013.yaml
  text: Then he says to the man[a], “Stretch out your hand.” And he stretched it out, and it was restored[b], healthy like the other one.
translation:
  language: ta
  text: அப்போது அவர் அந்த மனிதனிடம், “உன் கையை நீட்டு” என்று சொல்கிறார். அவன் அதை நீட்டினான்; அது மீண்டும் சீரடைந்தது[a], மற்ற கையைப் போலவே நலமாக இருந்தது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மீண்டும் சீரடைந்தது” என்பதற்கு “குணமடைந்தது” என்றும் மொழிபெயர்க்கலாம்; கிரேக்க வினைச்சொல் உரிய நிலைக்கு மீட்டுவரப்பட்டதை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “மற்றதைப் போல நலமாக இருந்தது”; “மற்றது” என்பது அந்த மனிதனின் மற்ற கையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: நிகழ்ச்சிகளின் தொடர்ச்சியைக் குறிக்கும் கால வினையடை; நவீனத் தமிழில் இயல்பாகக் கதை ஓட்டத்தைத் தொடர்கிறது.
- source_word: λέγει
  choice: சொல்கிறார்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தின் உயிரோட்டத்தை நிகழ்கால வடிவில் பாதுகாக்கிறது.
- source_word: τῷ ἀνθρώπῳ
  choice: அந்த மனிதனிடம்
  rationale: சூழலில் குறிப்பிடப்பட்ட குறிப்பிட்ட ஆணைக் குறிக்கிறது; ‘அந்த’ என்பது தமிழ் உரையில் குறிப்புத்தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Ἔκτεινόν
  choice: நீட்டு
  rationale: நேரடியான கட்டளையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: σου τὴν χεῖρα
  choice: உன் கையை
  rationale: χείρ இங்கு கையைக் குறிக்கிறது; உடனடிச் சூழலுக்கும் குணமாக்கப்பட்ட உடற்பகுதிக்கும் இது பொருந்துகிறது.
- source_word: ἐξέτεινεν
  choice: அவன் அதை நீட்டினான்
  rationale: கட்டளையிலுள்ள வினையை மீண்டும் பயன்படுத்துகிறது; தமிழில் தெளிவுக்காக ‘அதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἀπεκατεστάθη
  choice: அது மீண்டும் சீரடைந்து
  rationale: ἀποκαθίστημι குறிக்கும் உரிய நிலைக்குத் திரும்புதலைப் பாதுகாக்கிறது; தமிழில் தேவையற்ற செயப்பாட்டு அமைப்பைத் தவிர்த்து இயல்பாக வழங்குகிறது.
- source_word: ὑγιὴς
  choice: நலமானது
  rationale: உடல் நலமும் சீரான நிலையுமாக இருப்பதைக் குறிக்கும் ὑγιής என்பதன் பொருளை எளிய நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ὡς ἡ ἄλλη
  choice: மற்ற கைபோலவே
  rationale: பெண்பால் வடிவமான ἡ ἄλλη முன் குறிப்பிடப்பட்ட χείρ என்பதையே சுட்டுகிறது; தமிழில் மறைமுகமான பெயர்ச்சொல்லைத் தெளிவுபடுத்துவது இயல்பானது.
theological_decisions:
- issue: குணமாக்குதலின் தன்மையை விவரித்தல்
  choice: கை மீண்டும் சீரடைந்து மற்ற கைபோல நலமானதாக ஆனது என்று உரையின் சொற்களுக்கு நெருக்கமாக விவரித்தல்
  alternative: கை குணமடைந்தது அல்லது முழுமையாக்கப்பட்டது என்று மட்டும் கூறுதல்
  rationale: வசனம் அற்புதத்தை நேரடியாக விவரிக்கிறது. ‘மீண்டும் சீரடைந்து’ என்பது ἀπεκατεστάθη என்பதிலுள்ள பழைய உரிய நிலைக்குத் திரும்பும் நுட்பத்தைப் பாதுகாத்து, உரைக்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல் இருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வரலாற்று நிகழ்காலத்தைப் பாதுகாக்க ‘சொல்கிறார்’ என்றும், அதன் பின்வரும் நிறைவேற்றப்பட்ட செயலுக்கு இறந்தகாலம் என்றும் வழங்கப்பட்டுள்ளது.
