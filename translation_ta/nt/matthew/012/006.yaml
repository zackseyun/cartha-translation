id: MAT.12.6
reference: Matthew 12:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι τοῦ ἱεροῦ μεῖζόν ἐστιν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/006.yaml
  text: But I tell you that something greater than the temple is here[a][b].
translation:
  language: ta
  text: 'ஆனால் நான் உங்களுக்குச் சொல்கிறேன்: ஆலயத்தைவிடப் பெரியது இங்கே இருக்கிறது[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆலயத்தைவிடப் பெரிய ஒருவர் இங்கே இருக்கிறார்.” கிரேக்கத்தில் “பெரியது” என்பது நடுநிலை வடிவில் உள்ளது; அது குறிக்கும் நபர் அல்லது பொருள் வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “இந்த இடத்தில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: ஆனால் நான் உங்களுக்குச் சொல்கிறேன்
  rationale: δέ முந்தைய வாதத்துடன் மென்மையான முரண்பாட்டைச் சுட்டுகிறது; λέγω ὑμῖν என்பது நேரடி உரையாடல் சூத்திரம். இத்தமிழாக்கம் இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: ὅτι
  choice: ':'
  rationale: கிரேக்கத்தில் இது கூற்றின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது. தமிழில் நேரடி அறிவிப்புக்குப் பின் முக்காற்புள்ளி இடுவது இயல்பானது; தனியே ‘என்று’ சேர்ப்பது இவ்வாக்கிய அமைப்பில் தேவையில்லை.
- source_word: τοῦ ἱεροῦ
  choice: ஆலயத்தைவிட
  rationale: ἱερόν பொதுவாக உள் பரிசுத்த இடத்தை மட்டும் அல்ல, ஆலய வளாகத்தைக் குறிக்கிறது. ‘ஆலயம்’ தமிழில் இயல்பாகவும் சூழலுக்கு ஏற்றதாகவும் உள்ளது; ஒப்பீட்டை வேற்றுமை உருபு தெளிவாக்குகிறது.
- source_word: μεῖζόν
  choice: பெரியது
  rationale: இது நடுநிலை ஒருமை ஒப்பீட்டுச் சொல்; அதன் குறிப்பு வெளிப்படையாகச் சொல்லப்படவில்லை. ‘பெரியது’ அந்த இலக்கணத் தெளிவின்மையைப் பாதுகாக்கிறது; ‘பெரியவர்’ என்று ஆளைக் குறிப்பதாக மாற்றவில்லை.
- source_word: ἐστιν
  choice: இருக்கிறது
  rationale: எளிய நிகழ்கால இருப்பைக் குறிக்கிறது; தமிழில் இடத்தைக் குறிக்கும் ὧδε உடன் ‘இருக்கிறது’ இயல்பான வடிவம்.
- source_word: ὧδε
  choice: இங்கே
  rationale: ὧδε என்பதன் நேரடியான இடப்பொருள் ‘இங்கே’; சுருக்கமாகவும் இயல்பாகவும் உள்ளது. ‘இந்த இடத்தில்’ என்பது அடிக்குறிப்பில் மாற்றாகத் தரப்படுகிறது.
theological_decisions:
- issue: நடுநிலை ஒப்பீட்டுச் சொல்லான μεῖζόν குறிக்கும் மறைமுகப் பொருளின் அடையாளம்
  choice: முதன்மை உரையில் ‘பெரியது’ என ஆளைக் குறிப்பதில்லாத நடுநிலை வடிவம்
  alternative: ‘ஆலயத்தைவிடப் பெரிய ஒருவர் இங்கே இருக்கிறார்’
  rationale: கிரேக்கம் ஆண்பால் வடிவைப் பயன்படுத்தாமல் நடுநிலை ஒருமையைப் பயன்படுத்துகிறது. சூழல் இயேசுவையும் அவருடைய அதிகாரத்தையும் வலுவாகச் சுட்டினாலும், மொழிபெயர்ப்பு மறைமுகக் குறிப்பை வெளிப்படையாகத் தீர்மானிக்காமல், மூலத்தின் இறையியல் அழுத்தத்தையும் தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம உரைக்கேற்ற கண்ணியமும் காக்கப்பட்டுள்ளன. ‘ஆலயம்’ பொதுவாகப் புரியும் சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது. மூலத்தின் நடுநிலை வடிவைத் தக்கவைக்க ‘பெரியது ... இருக்கிறது’ பயன்படுத்தப்பட்டுள்ளது.
