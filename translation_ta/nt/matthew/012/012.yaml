- from: அப்படியானால், ஓர் ஆட்டைவிட மனிதன் எவ்வளவு மதிப்புமிக்கவன்! எனவே, ஓய்வுநாட்களில்[a] நன்மை செய்வது நியாயமானதே.
  to: அப்படியானால், ஓர் செம்மறியாட்டைவிட மனிதன் எவ்வளவு மதிப்புமிக்கவன்! எனவே, ஓய்வுநாட்களில்[a] நன்மை செய்வது சட்டப்படி அனுமதிக்கப்பட்டதே.
