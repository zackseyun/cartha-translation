id: MAT.12.12
reference: Matthew 12:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πόσῳ οὖν διαφέρει ἄνθρωπος προβάτου. ὥστε ἔξεστιν τοῖς σάββασιν καλῶς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/012.yaml
  text: How much more valuable[a], then, is a man than a sheep! So it is lawful to do good on the Sabbaths.
translation:
  language: ta
  text: அப்படியானால், ஓர் செம்மறியாட்டைவிட மனிதன் எவ்வளவு மதிப்புமிக்கவன்! எனவே, ஓய்வுநாட்களில்[a] நன்மை செய்வது சட்டப்படி அனுமதிக்கப்பட்டதே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இயல்பான மரபுத்தொடராக, ‘ஓய்வுநாளில்.’ கிரேக்கத்தில் ‘ஓய்வுநாட்களில்’ என்று பன்மை உள்ளது; இது ஓய்வுநாள் கடைப்பிடிப்பைக் குறிக்கும் பொதுவான மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πόσῳ οὖν
  choice: அப்படியானால் ... எவ்வளவு
  rationale: முந்தைய எடுத்துக்காட்டிலிருந்து வரும் முடிவையும், குறைந்ததிலிருந்து உயர்ந்ததற்குச் செல்லும் வாதத்தின் வலிமையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: διαφέρει
  choice: மதிப்புமிக்கவன்
  rationale: இங்கு வெறும் வேறுபாட்டை அல்ல, ஆட்டுடன் ஒப்பிடுகையில் மனிதனுக்குள்ள உயர்ந்த மதிப்பைக் குறிக்கிறது.
- source_word: ἄνθρωπος
  choice: மனிதன்
  rationale: தனிப்பட்ட ஓர் ஆணை மட்டும் அல்லாமல், மனிதரைப் பொதுவாகக் குறிக்கும் பிரதிநிதித்துவ ஒருமையைத் தமிழில் காக்கிறது.
- source_word: προβάτου
  choice: ஓர் ஆட்டைவிட
  rationale: ஒப்பீட்டைக் குறிக்கும் கிரேக்க வேற்றுமையைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὥστε
  choice: எனவே
  rationale: முந்தைய ஒப்பீட்டிலிருந்து பெறப்படும் முடிவைத் தெளிவாக இணைக்கிறது.
- source_word: ἔξεστιν
  choice: நியாயமானதே
  rationale: ஓய்வுநாள் விதியைப் பற்றிய விவாதச் சூழலில், வெறும் நடைமுறை அனுமதியை விட சட்ட-ஒழுக்க நியாயத்தைக் காட்டுகிறது.
- source_word: τοῖς σάββασιν
  choice: ஓய்வுநாட்களில்
  rationale: கிரேக்கத்தின் பன்மை வடிவத்தை முதன்மை உரையில் காக்கிறது; அது ஓய்வுநாள் கடைப்பிடிப்பைக் குறிக்கும் வழக்குச் சொல்லாகவும் அமையலாம்.
- source_word: καλῶς ποιεῖν
  choice: நன்மை செய்வது
  rationale: பிறருக்கு நன்மை பயக்கும் செயலைக் குறிக்கும் கிரேக்கச் சொற்றொடருக்கு இயல்பான, நேரடியான தமிழ்.
theological_decisions:
- issue: ἄνθρωπος என்பதன் பொதுமைப் பொருள்
  choice: மனிதன்
  alternative: ஒரு மனிதர்
  rationale: கிரேக்க ஒருமையைப் பேணியபடியே மனிதகுலத்தைப் பொதுவாகக் குறிக்கும் வாக்கியத்தின் நோக்கத்தை வெளிப்படுத்துகிறது; குறிப்பிட்ட பாலினத்திற்குள் பொருளைக் கட்டுப்படுத்தவில்லை.
- issue: ஓய்வுநாளைக் குறிக்கும் பன்மை மரபுத்தொடர்
  choice: ஓய்வுநாட்களில்
  alternative: ஓய்வுநாளில்
  rationale: மூலத்தின் பன்மையை முதன்மை உரையில் வெளிப்படையாக வைத்திருக்கிறது; தமிழில் அதிகம் வழக்கமான ஒருமை வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἔξεστιν என்பதிலுள்ள சட்ட-ஒழுக்க நுணுக்கம்
  choice: நியாயமானதே
  alternative: அனுமதிக்கப்பட்டதே
  rationale: இது ஓய்வுநாள் சட்டம் பற்றிய வாதம் என்பதால் நியாயம்/சட்டப்பூர்வம் சார்ந்த வலிமையைத் தருகிறது; வெறும் அதிகாரப்பூர்வ அனுமதி என்ற பொருளுக்குள் சுருக்கவில்லை.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் இயேசுவின் வாதத்தின் வலிமை ஒலிக்கும் வகையிலும் அமைக்கப்பட்டுள்ளது. வியப்புக்குறி கிரேக்க வாக்கியத்தின் சொல்லாட்சித் தீவிரத்தை இயல்பாக வெளிப்படுத்துகிறது.
