source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ⸀ἄνθρωπος χεῖρα ἔχων ξηράν. καὶ ἐπηρώτησαν αὐτὸν λέγοντες· Εἰ ἔξεστι τοῖς σάββασιν ⸀θεραπεύειν; ἵνα κατηγορήσωσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/010.yaml
  text: And behold[a], there was a man with a withered hand. And they asked him, saying, “Is it lawful to heal on the Sabbaths?” so that they might accuse him.
translation:
  language: ta
  text: இதோ, கை சூம்பிப்போன ஒரு மனிதன் அங்கே இருந்தான். அவர்மேல் குற்றஞ்சாட்டுவதற்காக அவர்கள் அவரிடம், “ஓய்வுநாட்களில்[a] குணமாக்குவது சட்டப்படி அனுமதிக்கப்பட்டதா?” என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இயல்பான தமிழ் வழக்கில், “ஓய்வுநாளில்.” கிரேக்கத்தில் “ஓய்வுநாட்களில்” என்று பன்மை உள்ளது; ஓய்வுநாட்களைப் பொதுவாகக் குறிப்பிட இத்தகைய பன்மை வழக்கமாகப் பயன்படுத்தப்பட்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: காட்சியிலுள்ள ஒருவரிடம் வாசகரின் கவனத்தைத் திருப்பும் உரையாடல்-குறியீட்டின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: ἄνθρωπος
  choice: ஒரு மனிதன்
  rationale: இங்கு குறிப்பிட்ட ஓர் ஆணைக் குறிக்கும் ஒருமை ஆண்பால் பெயர்ச்சொல்லைத் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: χεῖρα ἔχων ξηράν
  choice: கை சூம்பிப்போன
  rationale: ξηράν என்பதன் ‘உலர்ந்து சுருங்கிய அல்லது வலுவிழந்த’ நிலையைக் குறிக்கிறது; ‘செயலிழந்த’ என்று மருத்துவ நிலையை அளவுக்கு மீறித் திட்டவட்டமாக்காமல், தற்போதைய வாசகருக்கும் புரியும் இயல்பான சொல்லாக்கம்.
- source_word: ἐπηρώτησαν αὐτὸν λέγοντες
  choice: அவர்கள் அவரிடம் … என்று கேட்டார்கள்
  rationale: கிரேக்க முதன்மை வினையையும் உடனிகழ் எச்சத்தையும் தமிழின் இயல்பான நேர்கூற்று அமைப்பில் ஒருங்கிணைக்கிறது; பகைமை நோக்கம் அடுத்த சொற்றொடரில் தனியே வெளிப்படுகிறது.
- source_word: ἔξεστι
  choice: சட்டப்படி அனுமதிக்கப்பட்டதா
  rationale: இது வெறும் சமூக அனுமதியைப் பற்றியதல்ல, ஓய்வுநாள் சட்டத்தின் கீழ் எது அனுமதிக்கப்படுகிறது என்ற கேள்வி என்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: τοῖς σάββασιν
  choice: ஓய்வுநாட்களில்
  rationale: கிரேக்கத்தில் உள்ள பன்மையை முதன்மை உரையில் வெளிப்படையாகக் காக்கிறது; இயல்பான தமிழ் ஒருமை மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: θεραπεύειν
  choice: குணமாக்குவது
  rationale: இயேசுவின் குணமாக்கும் செயலுக்குப் பொருத்தமான, பொதுவாகப் புரியும் தமிழ் வினைச்சொல்.
- source_word: ἵνα κατηγορήσωσιν αὐτοῦ
  choice: அவர்மேல் குற்றஞ்சாட்டுவதற்காக
  rationale: ἵνα இங்கு குறிக்கும் நோக்கத்தையும் κατηγορέω என்பதன் குற்றச்சாட்டு சார்ந்த எதிர்மறை வலிமையையும் சுருக்கமாகக் காக்கிறது.
theological_decisions:
- issue: ஓய்வுநாள் சட்ட விவாதத்தில் τοῖς σάββασιν என்ற பன்மையை வழங்குதல்
  choice: ஓய்வுநாட்களில்
  alternative: ஓய்வுநாளில்
  rationale: மூல கிரேக்கத்தின் இலக்கணப் பன்மையை முதன்மை உரையில் காக்கிறது. பொதுவான ஓய்வுநாள் நடைமுறையைச் சுட்ட தமிழில் ஒருமையும் இயல்பானதால், அதை அடிக்குறிப்பில் மாற்றாகத் தருகிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகருக்குப் புரியும் விதமாகவும் நற்செய்தி உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இதோ’ காட்சியின் உயிரோட்டத்தையும், ‘சட்டப்படி அனுமதிக்கப்பட்டதா’ சட்ட-சமய விவாதத்தின் தன்மையையும் காக்கின்றன. அடிக்குறிப்பு குறி தொடர்புடைய ‘ஓய்வுநாட்களில்’ என்பதற்குப் பின்னரே வைக்கப்பட்டுள்ளது.
