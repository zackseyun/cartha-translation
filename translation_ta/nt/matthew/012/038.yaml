source:
  edition: SBLGNT
  text: Τότε ἀπεκρίθησαν ⸀αὐτῷ τινες τῶν γραμματέων καὶ Φαρισαίων λέγοντες· Διδάσκαλε, θέλομεν ἀπὸ σοῦ σημεῖον ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/038.yaml
  text: Then some of the scribes and Pharisees answered him[a], saying, “Teacher, we want to see a sign from you.”
translation:
  language: ta
  text: அப்போது வேத அறிஞர்களிலும் பரிசேயர்களிலும் சிலர் அவருக்குப் பதிலளித்து, “போதகரே, உம்மிடமிருந்து ஓர் அடையாளத்தை[a] காண விரும்புகிறோம்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஓர் அற்புத அடையாளத்தை.” கிரேக்கச் சொல் அற்புதமான முக்கியத்துவம் கொண்ட அடையாளத்தைக் குறிக்கக்கூடும்; ஆனால் முதன்மை உரை அதன் பரந்த பொருளான “அடையாளம்” என்பதையே வைத்திருக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: அப்போது
  rationale: அடுத்த நிகழ்வை அறிமுகப்படுத்தும் காலக் குறிப்பை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: அவரிடம் … பதிலளித்தார்கள்
  rationale: உடனடியாக ஒரு கேள்வி முன்வராவிட்டாலும், கிரேக்க வினைச்சொல்லின் ‘பதில் கூறுதல்/மறுமொழி அளித்தல்’ என்ற கதைநடைப் பயன்பாட்டைப் பாதுகாக்கிறது; αὐτῷ குறிக்கும் முகவரியையும் வெளிப்படுத்துகிறது.
- source_word: τινες τῶν γραμματέων καὶ Φαρισαίων
  choice: வேத அறிஞர்களிலும் பரிசேயர்களிலும் சிலர்
  rationale: τινες என்பது இரு குழுக்களையும் முழுமையாக அல்ல, அவற்றைச் சேர்ந்த சிலரை மட்டும் குறிக்கிறது. γραμματεῖς என்பதன் அக்கால மறைநூல் மற்றும் சட்டநூல் சார்ந்த அறிஞர் பங்கை, பழமையான தொழிற்பெயரை விட எளிதில் புரியும் வகையில் ‘வேத அறிஞர்கள்’ என வழங்குகிறது.
- source_word: λέγοντες
  choice: என்று
  rationale: நேர்கூற்றை அறிமுகப்படுத்தும் கிரேக்கப் பங்கேற்பு வினையை இயல்பான தமிழ் மேற்கோள் அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: Διδάσκαλε
  choice: போதகரே
  rationale: கற்பிப்பவரை நேரடியாக அழைக்கும் விளிப்பை, ‘எஜமானர்’ போன்ற கூடுதல் அதிகாரப் பொருள் இன்றி மரியாதையான தமிழில் தருகிறது.
- source_word: θέλομεν
  choice: விரும்புகிறோம்
  rationale: அவர்களுடைய விருப்பத்தை இயல்பாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: ἀπὸ σοῦ
  choice: உம்மிடமிருந்து
  rationale: அடையாளம் இயேசுவிடமிருந்து வரவேண்டும் என்ற மூலத்தைக் குறிக்கும் ἀπό என்பதன் பொருளைப் பாதுகாக்கிறது.
- source_word: σημεῖον
  choice: ஓர் அடையாளம்
  rationale: இச்சூழலில் அற்புதத் தன்மை உட்குறிப்பாக இருந்தாலும், கிரேக்கச் சொல்லின் பரந்த அடிப்படைப் பொருளைச் சுருக்காமல் தருகிறது.
- source_word: ἰδεῖν
  choice: காண
  rationale: ὁράω வினையின் நேரடியான பொருளைப் பாதுகாக்கிறது; ‘கண்டு சாட்சியாக இருக்க’ போன்ற விளக்கத்தைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: σημεῖον என்பதன் இயல்பு
  choice: முதன்மை உரையில் ‘அடையாளம்’
  alternative: ‘அற்புத அடையாளம்’
  rationale: சூழலில் அவர்கள் இயேசுவை உறுதிப்படுத்தும் அற்புதமான சான்றைக் கேட்கிறார்கள். ஆயினும் σημεῖον என்ற சொல் நேரடியாக ‘அடையாளம்’ என்றே பொருள்படுவதால், அதன் பரந்த பொருளும் உரையின் இறையியல் அழுத்தமும் திறந்தவையாக வைக்கப்படுகின்றன.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவை நோக்கிய உரையில் மரியாதைப் பன்மையான ‘உம்’ வடிவம் கையாளப்பட்டுள்ளது; ‘வேதபாரகர்’ போன்ற பழமையான சொல்லுக்குப் பதிலாக ‘வேத அறிஞர்கள்’ பயன்படுத்தப்பட்டுள்ளது.
