source:
  edition: SBLGNT
  text: Ἐν ἐκείνῳ τῷ καιρῷ ἐπορεύθη ὁ Ἰησοῦς τοῖς σάββασιν διὰ τῶν σπορίμων· οἱ δὲ μαθηταὶ αὐτοῦ ἐπείνασαν καὶ ἤρξαντο τίλλειν στάχυας καὶ ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/001.yaml
  text: At that time Jesus went through the grainfields on the Sabbath[a], and his disciples became hungry and began to pluck heads of grain and eat.
translation:
  language: ta
  text: அந்த நேரத்தில் இயேசு ஓய்வுநாளில்[a] தானிய வயல்களின் வழியாகச் சென்றார். அவருடைய சீடர்கள் பசியடைந்து, கதிர்களைப் பறித்துச் சாப்பிடத் தொடங்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் நேரடியாக ‘ஓய்வுநாட்களில்’ என்று பன்மை வடிவம் உள்ளது; இங்கு அது ‘ஓய்வுநாளில்’ என்று பொருள்படும் வழக்குச் சொல்லாட்சி.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: அந்த நேரத்தில்
  rationale: καιρός இங்கு ஒரு குறிப்பிட்ட நிகழ்வுக்காலத்தைக் குறிக்கிறது; இயல்பான தமிழ் நடையில் கதைத் தொடர்ச்சியைக் காக்கிறது.
- source_word: ἐπορεύθη
  choice: சென்றார்
  rationale: சூழலில் எளிய நகர்வைக் குறிக்கும் இயல்பான தமிழ் வினை; தேவையற்ற தொடர்நிலைப் பொருளைச் சேர்க்கவில்லை.
- source_word: τοῖς σάββασιν
  choice: ஓய்வுநாளில்
  rationale: கிரேக்கத்தில் பன்மை வடிவம் இருந்தாலும், இது ஓய்வுநாளைக் குறிக்கும் வழக்குச் சொல்லாட்சி; தமிழில் ஒருமை இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: διὰ τῶν σπορίμων
  choice: தானிய வயல்களின் வழியாக
  rationale: σπόριμος விதைக்கப்பட்ட, குறிப்பாகத் தானியம் விளையும் வயல்களைக் குறிக்கிறது; இந்தத் தெரிவு பயிரின் வகையைப் பொதுவாகவே வைத்திருக்கிறது.
- source_word: οἱ δὲ μαθηταὶ αὐτοῦ
  choice: அவருடைய சீடர்கள்
  rationale: δέ இங்கு வலுவான முரண்பாட்டைக் காட்டாமல் கதைத் தொடரை முன்னெடுக்கிறது; தமிழில் புதிய வாக்கியத் தொடக்கம் போதுமான இணைப்பை அளிக்கிறது.
- source_word: ἐπείνασαν
  choice: பசியடைந்து
  rationale: பசி ஏற்பட்டதை உணர்த்தும் அயோரிஸ்ட் வினையின் தொடக்கநிலை நுணுக்கத்தைச் சுருக்கமாகக் காக்கிறது.
- source_word: ἤρξαντο
  choice: தொடங்கினார்கள்
  rationale: அடுத்த இரு செயல்களின் தொடக்கத்தைத் தெளிவாகக் குறிக்கிறது.
- source_word: τίλλειν στάχυας
  choice: கதிர்களைப் பறித்து
  rationale: τίλλω கையால் பறிப்பதையும் στάχυς தானியக் கதிரையும் குறிக்கின்றன; தமிழ் வேளாண் வழக்கில் இயல்பான சொற்றொடர்.
- source_word: καὶ ἐσθίειν
  choice: தின்ன
  rationale: உணவை உட்கொள்ளுதல் என்ற நேரடியான பொருளை இயல்பான தமிழில் தருகிறது; ‘பறித்து’ என்பதுடன் ‘தொடங்கினார்கள்’ என்பதின் கீழ் இணைகிறது.
theological_decisions:
- issue: σάββασιν என்பதன் எண்ணிக்கை வடிவம்
  choice: ஓய்வுநாளில்
  alternative: ஓய்வுநாட்களில்
  rationale: கிரேக்கப் பன்மை இங்கு ஓய்வுநாளைக் குறிக்கும் வழக்குச் சொல்லாட்சி. பன்மையாக மொழிபெயர்த்தால் பல ஓய்வுநாட்களில் சம்பவம் நடந்ததாகத் தவறாகப் புரிந்துகொள்ள வாய்ப்புள்ளது; இது இலக்கண மற்றும் சூழல் சார்ந்த தீர்மானம்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தானிய வயல்கள்’ என்பது குறிப்பிட்ட தானிய வகையை உரையில் இல்லாமல் சேர்ப்பதைத் தவிர்க்கிறது.
