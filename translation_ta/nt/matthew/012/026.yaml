id: MAT.12.26
reference: Matthew 12:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ Σατανᾶς τὸν Σατανᾶν ἐκβάλλει, ἐφ’ ἑαυτὸν ἐμερίσθη· πῶς οὖν σταθήσεται ἡ βασιλεία αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/026.yaml
  text: And if Satan casts out Satan[a], he is divided against himself[c][b]. How then will his kingdom stand?
translation:
  language: ta
  text: சாத்தான் சாத்தானை வெளியேற்றினால்[a], அவன் தனக்கு எதிராகத் தானே பிளவுபட்டிருக்கிறான்[b]. அப்படியானால், அவனுடைய அரசு எப்படி நிலைத்திருக்கும்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “துரத்தினால்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தனக்கு எதிராகப் பிளவுபட்டான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἰ
  choice: …னால்
  rationale: முந்தைய வாதத்தின் தொடர்ச்சியைத் தமிழில் இயல்பான நிபந்தனை அமைப்பால் வெளிப்படுத்துகிறது; καί-யைத் தனியே ‘மேலும்’ என்று மொழிபெயர்ப்பது இங்கு செயற்கையாக இருக்கும்.
- source_word: ὁ Σατανᾶς / τὸν Σατανᾶν
  choice: சாத்தான்
  rationale: Σατανᾶς என்ற பெயர்/பட்டத்தின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: ἐκβάλλει
  choice: துரத்தினால்
  rationale: பிசாசை வெளியேற்றும் சூழலில் ἐκβάλλω குறிக்கும் வெளியே துரத்துதல் அல்லது விரட்டுதல் என்ற செயலை இயல்பாகத் தருகிறது.
- source_word: ἐφ’ ἑαυτὸν
  choice: தனக்கு எதிராகத் தானே
  rationale: உள்முரண்பாட்டையும் தன்னையே எதிர்ப்பதையும் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐμερίσθη
  choice: பிளவுபட்டிருக்கிறான்
  rationale: இறந்தகாலச் செயலில் விளைந்த தற்போதைய நிலையைத் தெரிவித்து, கிரேக்க இறந்தகாலச் செயலப்பாட்டு வடிவத்தின் விளைவு நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: πῶς οὖν
  choice: அப்படியானால் … எப்படி
  rationale: οὖν-இன் தர்க்கரீதியான முடிவையும் πῶς-இன் வினாவையும் நவீன தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: σταθήσεται
  choice: நிலைத்திருக்கும்
  rationale: ‘நிற்கும்’ என்ற உருவகத்தின் தொடர்தல், உறுதியாக இருத்தல் ஆகிய பொருளை இச்சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἡ βασιλεία αὐτοῦ
  choice: அவனுடைய அரசு
  rationale: βασιλεία இங்கு சாத்தானின் ஆட்சிக்குட்பட்ட ஒழுங்கு அல்லது ஆளுகைப் பரப்பைக் குறிக்கிறது; ‘அரசு’ பிளவுபட்ட ஆளுகை என்ற உருவகத்துக்குப் பொருந்துகிறது.
theological_decisions:
- issue: சாத்தான் தனக்கு எதிராகப் பிளவுபடுவதன் தர்க்கப் பொருள்
  choice: சாத்தான் சாத்தானைத் துரத்துகிறான் என்ற கருதுகோள் அவனுடைய ஆட்சியே உள்மையாகப் பிளவுபட்டு நிலைக்க முடியாததாகிவிடும் என்ற முரண்பாட்டை வெளிப்படுத்துகிறது.
  alternative: முந்தைய வசனத்தின் ‘பிளவுபட்ட அரசு’ உருவகத்தை விரிவாக மீண்டும் சேர்த்து விளக்குதல்.
  rationale: கிரேக்க உரை கூறும் சுருக்கமான மறுப்புவாதத்தையே வைத்திருந்து, உரையில் இல்லாத விளக்கத்தைச் சேர்க்காமல் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரமான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘தனக்கு எதிராகத் தானே’ என்பது வாதத்தின் உள்முரண்பாட்டைத் தெளிவாக்குகிறது; ‘நிலைத்திருக்கும்’ என்பது மூலத்தின் நிற்றல் உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
