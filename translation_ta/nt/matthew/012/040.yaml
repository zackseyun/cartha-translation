id: MAT.12.40
reference: Matthew 12:40
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἦν Ἰωνᾶς ἐν τῇ κοιλίᾳ τοῦ κήτους τρεῖς ἡμέρας καὶ τρεῖς νύκτας, οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ καρδίᾳ τῆς γῆς τρεῖς ἡμέρας καὶ τρεῖς νύκτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/040.yaml
  text: For just as Jonah was in the belly of the sea creature three days and three nights[c][b][a], so the Son of Man will be in the heart of the earth three days and three nights.
translation:
  language: ta
  text: ஏனெனில், யோனா கடல்வாழ் பெரும் உயிரினத்தின்[a] வயிற்றுக்குள் மூன்று நாட்களும் மூன்று இரவுகளும்[c] இருந்ததுபோலவே, மனிதகுமாரன் பூமியின் இதயத்தில்[b] மூன்று நாட்களும் மூன்று இரவுகளும் இருப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பெரும் மீனின்.’ கிரேக்கச் சொல் ஒரு பெரிய கடல் உயிரினத்தைக் குறிக்கிறது; அது குறிப்பிட்ட ஒரு விலங்கியல் இனத்தை மட்டும் சுட்டுவதில்லை.
    reason: lexical_alternative
  - marker: b
    text: ‘பூமியின் இதயம்’ என்பது அடக்கம், கல்லறை, பூமியின் ஆழம் அல்லது இறந்தோரின் உலகம் ஆகியவற்றைக் குறிக்கலாம்; முதன்மை உரை கிரேக்க உருவகத்தை அப்படியே வைத்துள்ளது.
    reason: alternative_reading
  - marker: c
    text: ‘மூன்று நாட்களும் மூன்று இரவுகளும்’ என்பது மூன்று நாட்களின் பகுதிகளையும் உள்ளடக்கும் வழக்குச் சொல்லாகச் சிலரால் புரிந்துகொள்ளப்படுகிறது; வேறு சிலர் அதை இன்னும் கண்டிப்பான கால அளவாக எடுத்துக்கொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: ஏனெனில், … இருந்ததுபோலவே
  rationale: γάρ என்பதன் விளக்கக் காரணத் தொடர்பை ‘ஏனெனில்’ என்றும், ὥσπερ என்பதன் ஒப்பீட்டு வலிமையை ‘போலவே’ என்றும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Ἰωνᾶς
  choice: யோனா
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் நிலைபெற்றுள்ள பெயர்வடிவம்.
- source_word: ἐν τῇ κοιλίᾳ
  choice: வயிற்றுக்குள்
  rationale: κοιλία குறிக்கும் ‘வயிறு’ என்ற பொருளை எளிமையாகவும் இயல்பாகவும் தருகிறது; ἐν என்பதன் உள்ளிருப்பையும் ‘-க்குள்’ தெளிவுபடுத்துகிறது.
- source_word: τοῦ κήτους
  choice: கடல்வாழ் பெரும் உயிரினத்தின்
  rationale: κῆτος என்பது ஒரு குறிப்பிட்ட விலங்கியல் இனத்தைக் காட்டிலும் பரந்த வகையில் பெரிய கடல் உயிரினத்தைக் குறிக்கலாம். ‘திமிங்கிலம்’ எனத் தேவையின்றிக் குறிப்பாக்காமல் பொருளைப் பாதுகாக்கிறது.
- source_word: τρεῖς ἡμέρας καὶ τρεῖς νύκτας
  choice: மூன்று நாட்களும் மூன்று இரவுகளும்
  rationale: மூலத்தின் காலக் குறிப்பை விளக்கமோ காலக்கணக்குத் தீர்மானமோ சேர்க்காமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: οὕτως
  choice: அதுபோலவே
  rationale: யோனாவுக்கும் மனிதகுமாரனுக்கும் இடையிலான ஒப்பீட்டின் இரண்டாம் பகுதியைத் தெளிவாக இணைக்கிறது; தமிழ்ச் சொற்றொடரில் இது ‘இருந்ததுபோலவே’ என்பதில் இயல்பாக ஒருங்கிணைக்கப்பட்டுள்ளது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: இயேசுவின் இந்தத் தன்னடையாளப் பட்டத்திற்கான நிலைபெற்ற தமிழ் வடிவம்; அதன் வேதாகம ஒலிப்பையும் பொருள் அடுக்குகளையும் பாதுகாக்கிறது.
- source_word: ἔσται
  choice: இருப்பார்
  rationale: εἰμί என்பதன் எதிர்கால வடிவத்தை நேரடியாகத் தருகிறது; ‘தங்கியிருப்பார்’ போன்ற நீடிப்பு நுணுக்கத்தை மேலதிகமாகச் சேர்க்கவில்லை.
- source_word: ἐν τῇ καρδίᾳ τῆς γῆς
  choice: பூமியின் இதயத்தில்
  rationale: καρδία என்பதன் ‘இதயம்’ என்ற உருவகத்தைத் தக்கவைத்து, ‘கல்லறை’ அல்லது ‘இறந்தோரின் உலகம்’ என விளக்கித் தீர்மானிப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: ‘பூமியின் இதயம்’ என்பதன் பொருள்
  choice: உருவகத்தை அப்படியே ‘பூமியின் இதயத்தில்’ என்று மொழிபெயர்த்தல்
  alternative: கல்லறையில்; பூமியின் ஆழத்தில்; இறந்தோரின் உலகத்தில்
  rationale: கிரேக்கச் சொற்றொடர் உருவகமாக உள்ளது; அடக்கம், கல்லறை அல்லது இறந்தோரின் உலகம் ஆகியவற்றில் ஒன்றை மட்டும் கட்டாயப்படுத்தவில்லை. ஆகவே அதன் விளக்கத் திறப்பை முதன்மை உரை பாதுகாக்கிறது.
- issue: ‘மூன்று நாட்களும் மூன்று இரவுகளும்’ என்பதன் கால அளவு
  choice: காலச் சொற்றொடரை உள்ளபடியே வைத்தல்
  alternative: மூன்று நாட்களின் பகுதிகளை உள்ளடக்கும் யூத வழக்குச் சொல்; கண்டிப்பான எழுபத்திரண்டு மணிநேரம்
  rationale: மூல உரை இந்தச் சொற்றொடரை வெளிப்படையாக இருமுறை கூறுகிறது. காலக்கணக்கைப் பற்றிய மாறுபட்ட புரிதல்களில் ஒன்றை மொழிபெயர்ப்பிலேயே தீர்மானிக்காமல், சொற்றொடர் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நிலைபெற்ற ‘மனிதகுமாரன்’ என்ற பட்டம் தக்கவைக்கப்பட்டுள்ளது; அரிதான விலங்கியல் சொல்லைத் தவிர்த்து ‘கடல்வாழ் பெரும் உயிரினம்’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் உருவகமும் காலக் குறிப்பைச் சார்ந்த விளக்கத் திறப்பும் தீர்க்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
