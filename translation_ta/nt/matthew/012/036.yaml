source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι πᾶν ῥῆμα ἀργὸν ὃ ⸀λαλήσουσιν οἱ ἄνθρωποι, ἀποδώσουσιν περὶ αὐτοῦ λόγον ἐν ἡμέρᾳ κρίσεως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/036.yaml
  text: But I tell you that for every careless word that people speak[b][a], they will give an account on the day of judgment.
translation:
  language: ta
  text: 'ஆனால், நான் உங்களுக்குச் சொல்கிறேன்: மனிதர்கள் பேசும் ஒவ்வொரு பொறுப்பற்ற வார்த்தையைக் குறித்தும்[a] நியாயத்தீர்ப்பு நாளில் அவர்கள் கணக்குக் கொடுப்பார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பொறுப்பற்ற வார்த்தை” என்பதற்கு “வீணான வார்த்தை,” “பயனற்ற வார்த்தை,” அல்லது “கவனக்குறைவான வார்த்தை” என்றும் மொழிபெயர்க்கலாம். கிரேக்கப் பெயரடை செயலற்ற, பயனற்ற, அல்லது கவனக்குறைவான என்ற பொருள்களைத் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: ஆனால், நான் உங்களுக்குச் சொல்கிறேன்
  rationale: δέ இங்கு முந்தைய சூழலிலிருந்து எச்சரிக்கையை வலுப்படுத்தும் மென்மையான எதிர்மறைத் தொடர்பைக் காட்டுகிறது; நிகழ்கால λέγω நேரடியான உரையாக இயல்பாகத் தரப்பட்டுள்ளது.
- source_word: πᾶν ῥῆμα
  choice: ஒவ்வொரு ... வார்த்தை
  rationale: πᾶν ஒருமை பெயர்ச்சொல்லுடன் பகிர்ந்தளிக்கும் பொருளில் ‘ஒவ்வொரு’ என வருகிறது; ῥῆμα இங்கு பேசப்பட்ட வார்த்தை அல்லது கூற்றைக் குறிக்கிறது.
- source_word: ἀργὸν
  choice: பொறுப்பற்ற
  rationale: ἀργός என்பதன் அடிப்படைப் பொருள் செயலற்ற, பயனற்ற அல்லது வீணான என்பதாகும். நியாயத்தீர்ப்பின் சூழலில், பேச்சில் காணப்படும் கவனமின்மையையும் ஒழுக்கப் பொறுப்பின்மையையும் ‘பொறுப்பற்ற’ என்பது இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: ὃ λαλήσουσιν οἱ ἄνθρωποι
  choice: மனிதர்கள் பேசும்
  rationale: οἱ ἄνθρωποι ஆண்களை மட்டும் அல்லாமல் மனிதர்களைப் பொதுவாகக் குறிக்கிறது. கிரேக்க எதிர்கால வினை தமிழில் பொதுவான எச்சரிக்கைச் சொல்லாக்கத்துக்கு ஏற்ற உறவெச்ச வடிவில் இயல்பாகத் தரப்பட்டுள்ளது.
- source_word: ἀποδώσουσιν περὶ αὐτοῦ λόγον
  choice: அதைக் குறித்து அவர்கள் கணக்குக் கொடுப்பார்கள்
  rationale: ἀποδίδωμι + λόγος என்பது ‘கணக்குக் கொடு’ என்ற பொறுப்புக்கூறும் மரபுத்தொடர்; περὶ αὐτοῦ ஒவ்வொரு வார்த்தையுமே அந்தக் கணக்கின் பொருள் என்பதைத் தெளிவாக்குகிறது.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: நியாயத்தீர்ப்பு நாளில்
  rationale: ἐν உடன் வரும் காலக் குறிப்பு தமிழில் ‘நாளில்’ என இயல்பாக அமைகிறது; κρίσις இங்கு நீதித்தீர்ப்பைக் குறிக்கிறது.
theological_decisions:
- issue: ἀργόν என்பதன் ஒழுக்க வலிமை
  choice: பொறுப்பற்ற
  alternative: வீணான; பயனற்ற; கவனக்குறைவான
  rationale: இந்த எச்சரிக்கை தெய்வீக நியாயத்தீர்ப்புக்கு முன் மனிதர் தமது பேச்சுக்குப் பதிலளிக்க வேண்டியதைப் பற்றியது. ‘பொறுப்பற்ற’ என்பது தீய நோக்கத்தைச் சேர்க்காமல் ஒழுக்கப் பொறுப்பை வெளிப்படுத்துகிறது; இருப்பினும் மூலச்சொல்லின் விரிந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: οἱ ἄνθρωποι என்பதன் பொதுவான குறிப்பு
  choice: மனிதர்கள்
  alternative: ஆண்கள்; மக்கள்
  rationale: கிரேக்கம் பாலினத்தைச் சிறப்பாகக் கட்டுப்படுத்தாமல் மனிதர்களைப் பொதுவாகக் குறிக்கிறது; ‘மனிதர்கள்’ அந்தப் பொதுமையைத் துல்லியமாகப் பாதுகாக்கிறது.
- issue: περὶ αὐτοῦ என்பதன் வெளிப்படையான தொடர்பு
  choice: ஒவ்வொரு வார்த்தையைக் குறித்தும்
  alternative: கணக்குக் கொடுப்பார்கள் என்று மட்டும் கூறுதல்
  rationale: கிரேக்கத்தில் கணக்கு எதைப் பற்றியது என்பது வெளிப்படையாக உள்ளது. தமிழில் அதை முன்பகுதியோடு இணைப்பது இயல்பானதுடன் ஒவ்வொரு வார்த்தையும் கணக்கில் எடுத்துக்கொள்ளப்படும் என்ற வலியுறுத்தலைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் நேரடியும் கண்ணியமுமான எச்சரிக்கை நடையைப் பயன்படுத்துகிறது. ‘கணக்குக் கொடுப்பார்கள்’ என்பது நீதித்தீர்ப்பில் பொறுப்புக்கூறுதலை இயல்பாக வெளிப்படுத்தும் வழக்குச் சொற்றொடர். மூலத்தின் பொருள் விரிவை அடிக்குறிப்பு பாதுகாக்கிறது.
