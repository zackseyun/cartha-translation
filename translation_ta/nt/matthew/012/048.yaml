id: MAT.12.48
reference: Matthew 12:48
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ ⸀λέγοντι αὐτῷ· Τίς ἐστιν ἡ μήτηρ μου, καὶ τίνες εἰσὶν οἱ ἀδελφοί μου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/048.yaml
  text: But he answered the one speaking to him[a], “Who is my mother, and who are my brothers?”
translation:
  language: ta
  text: ஆனால், தம்மிடம் பேசிக்கொண்டிருந்தவரிடம் அவர் பதிலளித்து, “என் தாய் யார்? என் சகோதரர்கள் யார்?” என்று கேட்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்கு நெருக்கமாக: “ஆனால், தம்மிடம் பேசிக்கொண்டிருந்தவரிடம் அவர் பதிலளித்துச் சொன்னார்: ‘என் தாய் யார்? என் சகோதரர்கள் யார்?’”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: ஆனால், ... அவர் மறுமொழியாக ... கேட்டார்
  rationale: δέ உரையாடலில் வரும் திருப்பத்தை ‘ஆனால்’ எனக் காட்டுகிறது. ἀποκριθεὶς εἶπεν என்பது ‘மறுமொழி கூறினார்’ என்ற பொருளுடைய வழக்குச் சொற்றொடர்; நேரடி உரை கேள்வியாக இருப்பதால், இயல்பான தமிழில் ‘மறுமொழியாக ... கேட்டார்’ என வழங்கப்பட்டது.
- source_word: τῷ λέγοντι αὐτῷ
  choice: தம்மிடம் பேசிக்கொண்டிருந்தவருக்கு
  rationale: நிகழ்காலப் பெயரெச்சமான λέγοντι, இயேசுவிடம் அப்போது பேசிக்கொண்டிருந்த நபரைக் குறிக்கிறது. ‘பேசிக்கொண்டிருந்தவர்’ தொடர்ந்துகொண்டிருந்த செயலைப் பாதுகாக்கிறது.
- source_word: Τίς ἐστιν ἡ μήτηρ μου
  choice: என் தாய் யார்?
  rationale: அடையாளத்தைக் கேட்கும் கேள்வியைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; μήτηρ என்பதற்கு ‘தாய்’ நேரடியான இணை.
- source_word: καὶ τίνες εἰσὶν οἱ ἀδελφοί μου
  choice: என் சகோதரர்கள் யார்?
  rationale: பன்மை வினாப்பெயரின் பொருளை தமிழில் இயல்பான ‘யார்’ கொண்டே தெரிவிக்கிறது. ἀδελφοί இங்குள்ள குடும்பச் சூழலில் ஆண்பால் பன்மையாக இருப்பதால் ‘சகோதரர்கள்’ என மொழிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: குடும்ப அடையாளத்தைப் பற்றிய இயேசுவின் சொல்லாட்சிக் கேள்வியை விளக்கி மென்மைப்படுத்தும் சாத்தியம்
  choice: விளக்க விரிவாக்கமின்றி நேரடியான கேள்விகளாகவே வைத்தல்
  alternative: ‘யாரை என் தாயாகவும் யாரை என் சகோதரர்களாகவும் கருதலாம்?’
  rationale: அடுத்தடுத்த வசனங்கள் உறவின் பொருளை விரிவுபடுத்தினாலும், அந்த விளக்கத்தை இவ்வசனத்துக்குள் முன்கூட்டியே சேர்க்காமல் அதன் சொல்லாட்சித் தீவிரத்தையும் இறையியல் இழுபறியையும் பாதுகாக்கிறது.
- issue: ἀδελφοί என்பதன் பாலினக் குறிப்பு
  choice: சகோதரர்கள்
  alternative: சகோதர சகோதரிகள் / உடன்பிறந்தவர்கள்
  rationale: உடனடி நிகழ்ச்சிச் சூழல் இயேசுவின் குடும்பத்தினரில் ஆண்பால் பன்மையாகச் சொல்லப்பட்ட சகோதரர்களைக் குறிக்கிறது; ஆகவே மூலத்தின் ஆண்பால் உறவுமுறைக் குறிப்பை விரிவுபடுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. இயேசுவைக் குறிக்க மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. ‘மறுமொழியாக ... கேட்டார்’ என்பது கிரேக்கத்தின் பதிலளித்துச் சொன்னார் என்ற இணைப்பை இயல்பான தமிழில் சுருக்குகிறது; சொல்லுக்கு நெருக்கமான வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
