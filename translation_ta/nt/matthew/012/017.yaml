  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀ἵνα πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/017.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[a], saying:'
translation:
  language: ta
  text: 'இறைவாக்கினரான ஏசாயா மூலம்[a] சொல்லப்பட்டது நிறைவேறும்படியாக—அவர் கூறியதாவது:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இறைவாக்கினரான ஏசாயாவால்.’ கிரேக்கத்தில் சொற்சார்பாக ‘மூலம்’ என்று உள்ளது; இது இறைவாக்கினர் வழியாகச் செய்தி வழங்கப்பட்டதை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: நிறைவேறும்படியாக
  rationale: நோக்கம் அல்லது விளைவு என்ற இரு சாத்தியங்களையும் தேவையின்றி குறுக்காமல், முந்தைய வசனத்துடன் இயல்பாக இணைக்கிறது.
- source_word: πληρωθῇ
  choice: நிறைவேறும்படியாக
  rationale: இறைநூல் மேற்கோள் நிறைவேறுதலைக் குறிக்கும் மத்தேயுவின் வழக்கமான சொல்லாட்சியைத் தக்கவைக்கிறது; கிரேக்கச் செயலப்பாட்டு வடிவத்தின் பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: τὸ ῥηθὲν
  choice: சொல்லப்பட்டது
  rationale: பெயர்ச்சொல் போல் செயல்படும் செயலப்பாட்டு எச்சத்தின் ‘சொல்லப்பட்ட ஒன்று’ என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: διὰ
  choice: மூலம்
  rationale: διά + உரிமை வேற்றுமை இங்கு இடைநிலைச் செயலாண்மையைக் குறிக்கிறது; செய்தியின் இறுதி மூலமாக ஏசாயாவைக் காட்டாமல், அவர் வழியாக அது சொல்லப்பட்டதைக் காக்கிறது.
- source_word: Ἠσαΐου
  choice: ஏசாயா
  rationale: தமிழ் வேதாகம மற்றும் பொதுப் பயன்பாட்டில் நன்கு அறியப்பட்ட பெயர் வடிவம்.
- source_word: τοῦ προφήτου
  choice: இறைவாக்கினரான
  rationale: ஏசாயாவை அடையாளப்படுத்தும் appositional சொல்லைத் தெளிவாகக் காக்கிறது; நவீன வாசகருக்குப் புரியும் மரியாதையான தமிழ்.
- source_word: λέγοντος
  choice: அவர் கூறியதாவது
  rationale: அடுத்த வசனத்தில் வரும் மேற்கோளை அறிமுகப்படுத்தும் எச்சத்தின் பணியைத் தெளிவாகத் தருகிறது; ‘அவர்’ என்பது ஏசாயாவைக் குறிக்கிறது.
theological_decisions:
- issue: தீர்க்கதரிசனச் செய்தியின் செயலாண்மை
  choice: இறைவாக்கினரான ஏசாயா மூலம்
  alternative: இறைவாக்கினரான ஏசாயாவால்
  rationale: கிரேக்க διά என்பதன் இடைநிலைச் செயலாண்மையை ‘மூலம்’ காக்கிறது; கடவுள் இறுதி உரையாளர், ஏசாயா மனித வழிமூலம் என்ற வேதாகமச் சொல்லாட்சியை இது இயல்பாக வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் மரியாதையான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. வசனம் முந்தைய கூற்றைச் சார்ந்த ἵνα உட்கிளவியாக இருப்பதால், அந்த தொடர்ச்சியைத் தக்கவைக்க முற்றுப்புள்ளி சேர்க்கப்படவில்லை; அடுத்த மேற்கோளைத் திறக்க நீண்ட கோடும் முக்காற்புள்ளியும் பயன்படுத்தப்பட்டுள்ளன.
