  text: Ὅταν δὲ τὸ ἀκάθαρτον πνεῦμα ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου, διέρχεται δι’ ἀνύδρων τόπων ζητοῦν ἀνάπαυσιν, καὶ οὐχ εὑρίσκει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/043.yaml
  text: When the unclean spirit goes out from the man[a], it passes through waterless places seeking rest, and does not find it.
translation:
  language: ta
  text: அசுத்த ஆவி ஒரு மனிதனைவிட்டு வெளியேறும்போது, அது இளைப்பாறுதலைத் தேடி நீரற்ற இடங்கள்[a] வழியாகச் செல்கிறது; ஆனால் அதைக் கண்டடைவதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வறண்ட இடங்கள்.” கிரேக்கத்தில் சொல்லுக்குச் சொல், “நீரற்ற இடங்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: வெளியேறும்போது
  rationale: ὅταν பொதுவான காலநிலையைச் சுட்டுகிறது; தமிழில் ‘-ும்போது’ இயல்பாக அதை வெளிப்படுத்துகிறது. δέ இங்கு மென்மையான உரைமாற்றுக் கூறு; தனிச்சொல்லாக மொழிபெயர்த்தால் தேவையற்ற வலியுறுத்தல் ஏற்படும் என்பதால் வாக்கிய ஓட்டத்தில் பிரதிபலிக்கப்படுகிறது.
- source_word: τὸ ἀκάθαρτον πνεῦμα
  choice: அசுத்த ஆவி
  rationale: நற்செய்தி நூல்களின் பேயோட்டும் சூழலில் உள்ள தூய்மை–அசுத்தம் சார்ந்த பின்னணியையும், πνεῦμα என்பதன் நேரடியான பொருளையும் காக்கிறது.
- source_word: ἀπὸ τοῦ ἀνθρώπου
  choice: ஒரு மனிதனைவிட்டு
  rationale: இது ஒரு பொதுவான எடுத்துக்காட்டு என்பதால், கிரேக்கத்தின் ஒருமையைப் பேணிக்கொண்டு தமிழில் இயல்பான பொதுப்பொருளை ‘ஒரு மனிதன்’ வெளிப்படுத்துகிறது.
- source_word: διέρχεται δι’ ἀνύδρων τόπων
  choice: நீரற்ற இடங்கள் வழியாகச் செல்கிறது
  rationale: διέρχεται இயக்கத்தையும், ἄνυδρος சொல்லின் நேரடியான ‘நீரில்லாத’ படிமத்தையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ζητοῦν ἀνάπαυσιν
  choice: இளைப்பாறுதலைத் தேடி
  rationale: தேடுதல் முதன்மை வினையுடன் ஒரே நேரத்தில் நிகழ்வதைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது; ἀνάπαυσις என்பதற்கான நேரடிப் பொருளையும் காக்கிறது.
- source_word: καὶ οὐχ εὑρίσκει
  choice: ஆனால் அதைக் கண்டடைவதில்லை
  rationale: தமிழில் எதிர்பார்ப்புக்கு மாறான முடிவை ‘ஆனால்’ இயல்பாகக் காட்டுகிறது; ‘அதை’ என்பது முன்னர் கூறப்பட்ட இளைப்பாறுதலைக் குறிக்கிறது.
theological_decisions:
- issue: பேயோட்டும் சூழலில் πνεῦμα என்பதன் மொழிபெயர்ப்பு
  choice: ஆவி
  alternative: பேய்
  rationale: சூழலில் தீய ஆவியே குறிக்கப்பட்டாலும், மூலத்தில் δαιμόνιον அல்ல, πνεῦμα உள்ளது. எனவே மூலச்சொல்லின் வடிவத்தையும் இறையியல் நுணுக்கத்தையும் ‘அசுத்த ஆவி’ காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் கண்ணியமான உரைநடையிலும் அமைக்கப்பட்டது. அடிக்குறி குறிக்கும் சொல்லோடு பொருந்துமாறு [a] ‘நீரற்ற இடங்கள்’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
