revisions:
- from: மக்கள் கூட்டத்தினர் அனைவரும் மலைத்துப்போய், “இவர்தான் தாவீதின் மகனோ?[b][a]” என்று கேட்டார்கள்.
  to: எல்லா மக்கள் கூட்டத்தாரும் வியப்படைந்து, “இவர்தான் தாவீதின் மகனோ?[b][a]” என்று சொன்னார்கள்.
  rationale: The revision more naturally renders the plural crowds, uses a direct equivalent for their astonishment, and keeps the reporting verb aligned with ἔλεγον. It retains the Tamil hesitant question and the existing footnote order and content, preserving both the messianic title and the negative-expectation nuance of Μήτι without over-interpreting either.
