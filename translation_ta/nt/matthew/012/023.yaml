source:
  edition: SBLGNT
  text: καὶ ἐξίσταντο πάντες οἱ ὄχλοι καὶ ἔλεγον· Μήτι οὗτός ἐστιν ὁ υἱὸς Δαυίδ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/023.yaml
  text: And all the crowds were astonished and said[b][a], “Can this be the Son of David?”
translation:
  language: ta
  text: எல்லா மக்கள் கூட்டத்தாரும் வியப்படைந்து, “இவர்தான் தாவீதின் மகனோ?[b][a]” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தாவீதின் மகன்” என்பது தாவீதின் வம்சத்தில் வருவதாக வாக்களிக்கப்பட்ட அரச விடுவிப்பவரைக் குறிக்கும் மேசியப் பட்டம்.
    reason: cross_reference
  - marker: b
    text: 'கேள்வியின் எதிர்மறை எதிர்பார்ப்பை இன்னும் சொற்சார்ந்து காட்டினால்: “இவர் தாவீதின் மகன் அல்லவே?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: மலைத்துப்போய்
  rationale: இயேசுவின் செயலால் மக்கள் அடைந்த வலுவான, தொடர்ந்த வியப்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; மனநிலை பிறழ்ந்தனர் என்ற தவறான பொருளைத் தவிர்க்கிறது.
- source_word: πάντες οἱ ὄχλοι
  choice: மக்கள் கூட்டத்தினர் அனைவரும்
  rationale: ὄχλοι என்பதன் பன்மையையும் πάντες என்பதன் முழுமையையும் தமிழில் இயல்பாகத் தக்கவைக்கிறது.
- source_word: ἔλεγον
  choice: என்று கேட்டார்கள்
  rationale: கிரேக்கத்தில் பொதுவான ‘சொன்னார்கள்’ என்ற வினை இருந்தாலும், இங்கு நேரடியாக வருவது கேள்வி என்பதால் தமிழில் ‘கேட்டார்கள்’ என்பது உரையாடலின் செயலை இயல்பாக வெளிப்படுத்துகிறது. தொடர்ச்சியைக் குறிக்கும் இறந்தகால வடிவத்தைத் தமிழில் கட்டாயமாக விரித்துரைக்கவில்லை.
- source_word: Μήτι
  choice: இவர்தான் ... மகனோ?
  rationale: எதிர்மறை விடையை எதிர்பார்க்கக்கூடிய அல்லது தயக்கத்தை வெளிப்படுத்தக்கூடிய கேள்வியின் நுணுக்கத்தை ‘-ஓ?’ என்ற ஐய வினா இயல்பாகப் பாதுகாக்கிறது; உறுதியான மறுப்பாக மாற்றவில்லை.
- source_word: ὁ υἱὸς Δαυίδ
  choice: தாவீதின் மகன்
  rationale: மேசியாவைக் குறிக்கும் வரலாற்றுச் சிறப்புடைய பட்டத்தை ‘மேசியா’ என்று விளக்கிப் பதிலிடாமல், மூலத்தின் வடிவத்தையும் பொருளையும் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘தாவீதின் மகன்’ என்பதன் மேசியாவுக்குரிய பொருள்
  choice: முதன்மை உரையில் ‘தாவீதின் மகன்’ என்ற பட்டத்தை அப்படியே வைத்தல்
  alternative: மேசியா / தாவீதின் வாக்குப்பண்ணப்பட்ட அரச வாரிசு
  rationale: கிரேக்க மூலம் பட்டத்தையே பயன்படுத்துகிறது. அதை விளக்கப் பெயராக மாற்றுவது உரையிலுள்ள வரலாற்று மற்றும் இறையியல் எதிரொலியைத் தேவையின்றித் தீர்மானித்துவிடும்; அதன் மேசியாவுக்குரிய பொருள் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: Μήτι கேள்வியின் எதிர்மறை எதிர்பார்ப்பு
  choice: ‘இவர்தான் ... மகனோ?’ என்ற தயக்கமும் வியப்பும் கலந்த கேள்வி
  alternative: ‘இவர் தாவீதின் மகன் அல்லவே?’
  rationale: Μήτι பொதுவாக எதிர்மறை விடையை எதிர்பார்க்கலாம்; ஆனால் இச்சூழலில் கூட்டத்தாரின் வியப்பும் சாத்தியத்தைப் பற்றிய தயக்கமும் உள்ளது. முதன்மை உரை அந்தத் திறந்த பதற்றத்தைப் பாதுகாக்கிறது; மேலும் சொற்சார்ந்த எதிர்மறை வலிமை அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; சாதாரண வாசகர்களுக்கு எளிதில் புரியும், அதேவேளையில் வேதாகமக் கண்ணியத்தைத் தக்கவைக்கும் நடை. ‘இவர்தான்’ வியப்பையும் அடையாளம் காணும் முயற்சியையும் இயல்பாக வெளிப்படுத்துகிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
