id: MAT.12.9
reference: Matthew 12:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ μεταβὰς ἐκεῖθεν ἦλθεν εἰς τὴν συναγωγὴν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/009.yaml
  text: And departing from there, he went into their synagogue.
translation:
  language: ta
  text: அவர் அங்கிருந்து புறப்பட்டு, அவர்களுடைய ஜெபக்கூடத்திற்குள் சென்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: -ட்டு
  rationale: தனி ‘மற்றும்’ என்பதற்குப் பதிலாக, முந்தைய நிகழ்வுடன் இயல்பாக இணைக்கும் தமிழ் வினையெச்சத் தொடரில் இணைப்புப் பொருள் வெளிப்படுகிறது.
- source_word: μεταβὰς
  choice: புறப்பட்டு
  rationale: μεταβαίνω என்ற வினையின் இடம்மாறிச் செல்லும் பொருளையும், இறந்தகால வினையெச்ச அமைப்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἐκεῖθεν
  choice: அங்கிருந்து
  rationale: முன்னர் குறிப்பிடப்பட்ட இடத்திலிருந்து நகர்வதை நேரடியாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: ἦλθεν
  choice: சென்றார்
  rationale: புதிய இடத்தை நோக்கிய கதைசார் நகர்வில் தமிழில் ‘சென்றார்’ இயல்பானது; கிரேக்க இயக்க வினையின் அடிப்படைப் பொருளைத் தக்கவைக்கிறது.
- source_word: εἰς τὴν συναγωγὴν
  choice: ஜெபக்கூடத்திற்குள்
  rationale: εἰς என்பதன் உள்ள்நோக்கிய இயக்கத்தை ‘-க்குள்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: συναγωγὴν
  choice: ஜெபக்கூடம்
  rationale: யூதர்கள் கூடிவந்து வழிபட்ட இடத்தைக் குறிக்கும் தமிழில் நிலைபெற்ற, பொதுவாகப் புரிந்துகொள்ளக்கூடிய வேதாகமச் சொல்.
- source_word: αὐτῶν
  choice: அவர்களுடைய
  rationale: பன்மை உடைமைப்பெயரின் பொருளைத் துல்லியமாகக் காக்கிறது; அது குறிக்கும் குழுவை மொழிபெயர்ப்பில் கூடுதலாக அடையாளப்படுத்தவில்லை.
theological_decisions:
- issue: ‘அவர்களுடைய ஜெபக்கூடம்’ என்பதில் ‘அவர்கள்’ யாரைக் குறிக்கிறது
  choice: அவர்களுடைய ஜெபக்கூடம்
  alternative: அந்த யூதர்களுடைய ஜெபக்கூடம்
  rationale: கிரேக்கம் αὐτῶν என்று மட்டுமே கூறுவதால், பகைமை அல்லது குறிப்பிட்ட பிரிவினரைக் குறிக்கும் விளக்கத்தைச் சேர்க்காமல் அதன் இயல்பான தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான உரைநடை. ‘புறப்பட்டு ... சென்றார்’ என்ற அமைப்பு கிரேக்க வினையெச்சத் தொடரைத் தமிழில் இயல்பாக அளிக்கிறது; ‘ஜெபக்கூடத்திற்குள்’ என்பது இடத்திற்குள் நுழைந்த இயக்கத்தைத் தெளிவுபடுத்துகிறது.
