  source_fidelity: 'The Tamil faithfully represents the Greek sequence: movement away from the prior place (μεταβὰς ἐκεῖθεν), followed by going into (ἦλθεν εἰς) the synagogue. “அவர்களுடைய” accurately preserves the plural possessive αὐτῶν without defining its referent.'
  naturalness: “அவர் அங்கிருந்து புறப்பட்டு, அவர்களுடைய ஜெபக்கூடத்திற்குள் சென்றார்” is clear, dignified modern standard Tamil. The participial sequence “புறப்பட்டு ... சென்றார்” is idiomatic and appropriately reflects the Greek narrative connection.
  terminology: “ஜெபக்கூடம்” is an established Tamil biblical term for a synagogue and is suitable here. It avoids an unnecessarily interpretive expansion while retaining the setting’s religious and communal sense.
