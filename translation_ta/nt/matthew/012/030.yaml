id: MAT.12.30
reference: Matthew 12:30
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/030.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: ta
  text: என்னோடு இல்லாதவர் எனக்கு எதிராக இருக்கிறார்; என்னோடு சேர்ந்து திரட்டாதவர் சிதறடிக்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னோடு இல்லாத எவரும் எனக்கு எதிராக இருக்கிறார்; என்னோடு சேர்ந்து திரட்டாத எவரும் சிதறடிக்கிறார்.”
    reason: ‘ὁ + வினையெச்சம்’ என்ற பொதுமையான ஒருமையை தமிழில் ‘அவர்’ அல்லது ‘எவரும்’ என இயல்பாக வெளிப்படுத்தலாம்.
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: இல்லாதவர்
  rationale: கட்டுரையுடன் வரும் வினையெச்சத் தொடர் பொதுவாக ஒருவரைக் குறிக்கிறது. தமிழில் மரியாதை ஒருமையான ‘அவர்’ பாலினத்தைக் குறிப்பதின்றி இயல்பாகவும் கண்ணியமாகவும் இந்தப் பொதுப்பொருளைத் தருகிறது.
- source_word: μετ’ ἐμοῦ
  choice: என்னோடு
  rationale: μετά + பிறப்புவேற்றுமை இணைவு அல்லது உடனிருப்பைக் குறிக்கிறது. ‘என்னோடு’ என்பது இதை நேரடியாகத் தெரிவித்து, இயேசுவுடன் கொண்ட சார்பையும் திறந்த நிலையில் வைக்கிறது.
- source_word: κατ’ ἐμοῦ
  choice: எனக்கு எதிராக
  rationale: κατά + பிறப்புவேற்றுமை இங்கு எதிர்ப்பைக் குறிக்கிறது. ‘எனக்கு எதிராக’ என்பது நவீனத் தமிழில் தெளிவான, நேரடியான இணை.
- source_word: συνάγων
  choice: சேர்த்துக்கொள்ளாதவர்
  rationale: συνάγω ஒன்றாகக் கூட்டுதல் அல்லது சேர்த்தல் என்ற பொருளுடையது. ‘சேர்த்துக்கொள்’ செயலைத் தெளிவாகக் கூறுகிறது; யாரை அல்லது எதைச் சேர்க்கிறார் என்பதை உரை குறிப்பிடாததால் மொழிபெயர்ப்பும் அதை நிரப்பவில்லை.
- source_word: σκορπίζει
  choice: சிதறடிக்கிறார்
  rationale: σκορπίζω சிதறச் செய்தல் அல்லது பரவடித்தலைக் குறிக்கிறது. ‘சிதறடிக்கிறார்’ முன் வரும் சேர்த்தல் செயலுடன் கூர்மையான எதிரிணையைப் பேணுகிறது.
- source_word: καὶ
  choice: ;
  rationale: கிரேக்க καὶ இரண்டு இணையான கூற்றுகளைச் சேர்க்கிறது. தமிழில் அரைப்புள்ளியால் அவற்றை இணைப்பது இயல்பான ஓட்டத்தையும் சமநிலை அமைப்பையும் தருகிறது; ‘மேலும்’ போன்ற தேவையற்ற சொல் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: இயேசுவோடு இருப்பது அல்லது அவருக்கு எதிராக இருப்பது என்ற முழுமையான எதிரிணை
  choice: ‘என்னோடு இல்லாதவர் எனக்கு எதிராக இருக்கிறார்’ என்று எந்தத் தணிப்புமின்றி நேரடியாக வழங்கப்பட்டது.
  alternative: நடுநிலை இருக்கக்கூடும் எனத் தோன்றும் வகையில் எதிரிணையை மென்மைப்படுத்துதல்.
  rationale: கிரேக்க உரை எந்தத் தணிப்பு மொழியும் இன்றி இரு கூர்மையான இணைக் கூற்றுகளை முன்வைக்கிறது. அதன் இறையியல் பதற்றத்தை மொழிபெயர்ப்பு பேணுகிறது; அதற்கு அப்பாற்பட்ட கோட்பாட்டு முடிவைச் சேர்ப்பதில்லை.
- issue: ‘சேர்த்தல்’ என்பதன் உருவகக் குறிப்பு
  choice: எதை அல்லது யாரைச் சேர்ப்பது என்பதை விளக்காமல் ‘சேர்த்துக்கொள்ளாதவர்’ எனத் திறந்த நிலையில் வைக்கப்பட்டது.
  alternative: அறுவடை, மந்தை, அல்லது மக்களைச் சேர்த்தல் என்று குறிப்பாக விளக்குதல்.
  rationale: சூழலில் பல உருவக ஒலிப்புகள் இருக்கக்கூடும்; ஆனால் இந்த வசனம் பொருளை வெளிப்படையாகக் குறிப்பிடவில்லை. எனவே உண்மையான தெளிவின்மை பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையானதும் கண்ணியமானதுமான நடை. இரு இணைக் கூறுகளின் கூர்மையான எதிரிணை பேணப்பட்டுள்ளது. ‘அவர்’ என்பது இங்கு பாலினம் சுட்டாத பொதுமையான மரியாதை ஒருமையாகப் பயன்படுத்தப்பட்டுள்ளது.
