source:
  edition: SBLGNT
  text: ὅστις γὰρ ἂν ποιήσῃ τὸ θέλημα τοῦ πατρός μου τοῦ ἐν οὐρανοῖς, αὐτός μου ἀδελφὸς καὶ ἀδελφὴ καὶ μήτηρ ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/050.yaml
  text: For whoever does the will of my Father in heaven[a], he is my brother and sister and mother.
translation:
  language: ta
  text: ஏனெனில், பரலோகத்தில் இருக்கிற என் தந்தையின் விருப்பத்தை நிறைவேற்றுகிற எவரும், அவரே எனக்குச் சகோதரரும் சகோதரியும் தாயுமாக இருக்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் ‘எவரும்’ மற்றும் ‘அவரே’ என்பவற்றுக்கு அடிப்படையான சொற்கள் இலக்கண ஆண்பால் ஒருமையில் உள்ளன; ஆனால் இங்கே அவை பொதுவாக யாரையும் குறிக்கின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις ... ἂν
  choice: நிறைவேற்றுகிறவர் எவரோ
  rationale: இது யாரையும் உள்ளடக்கும் பொதுவான நிபந்தனையைக் குறிக்கிறது; தமிழில் இயல்பான ஒருமை மரியாதை வடிவம் அதன் திறந்த, பொதுவான பொருளைக் காக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத் தொடர்பைத் தெளிவாகத் தக்கவைக்கிறது.
- source_word: ποιήσῃ
  choice: நிறைவேற்றுகிறவர்
  rationale: θέλημα என்பதுடன் வரும் ποιέω, விருப்பத்தின்படி செயல்படுவதைக் குறிக்கிறது. ‘கீழ்ப்படிகிறவர்’ என்பது பொருளைச் சற்றுக் குறுக்குவதால் தவிர்க்கப்பட்டது.
- source_word: τὸ θέλημα
  choice: விருப்பத்தை
  rationale: தந்தை விரும்புவதையும் நோக்குவதையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது; ‘சித்தம்’ என்பதைக் காட்டிலும் பொதுவாசகருக்கு உடனடியாகப் புரியும்.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: பரலோகத்தில் இருக்கும் என் தந்தையின்
  rationale: மூலத்தின் உறவுச் சொல்லையும் இடத்தைக் குறிக்கும் தொடரையும் நெருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: αὐτός
  choice: அவரே
  rationale: αὐτός தரும் வலியுறுத்தலை ‘-ஏ’ காக்கிறது; மரியாதை ஒருமை தமிழில் ஆண்-பெண் இருபாலரையும் இயல்பாக உள்ளடக்குகிறது.
- source_word: ἀδελφὸς καὶ ἀδελφὴ καὶ μήτηρ
  choice: சகோதரரும் சகோதரியும் தாயும்
  rationale: மூலத்தில் தனித்தனியாகப் பட்டியலிடப்பட்ட மூன்று குடும்ப உறவுகளையும் ஒருமையில் தக்கவைக்கிறது.
- source_word: ἐστίν
  choice: இருக்கிறார்
  rationale: நிகழ்கால இணைப்புவினையைத் தக்கவைத்து, மனிதரைக் குறிக்கும் தமிழின் மரியாதை ஒருமையோடு பொருந்துகிறது.
theological_decisions:
- issue: பொதுவான கூற்றில் இலக்கண ஆண்பால் ஒருமை
  choice: அவரே எனக்குச் சகோதரரும் சகோதரியும் தாயுமாக இருக்கிறார்
  alternative: அந்த நபரே எனக்குச் சகோதரரும் சகோதரியும் தாயுமாக இருக்கிறார்
  rationale: கிரேக்கத்தில் இலக்கண ஆண்பால் ஒருமை இருந்தாலும் அது பொதுவான பொருளில் வருகிறது. தமிழின் ‘அவர்’ மரியாதை ஒருமை பாலினத்தைத் தீர்மானிக்காமல் ஒருமையையும் வலியுறுத்தலையும் காக்கிறது; சகோதரி, தாய் என்ற சொற்கள் உள்ளடக்கமான நோக்கத்தை மேலும் வெளிப்படுத்துகின்றன.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தந்தை’ உறவுப் பொருளை நேரடியாகக் காக்கிறது; ‘விருப்பம்’ என்பது பழமையான அல்லது சமயத்துறை சார்ந்த ‘சித்தம்’ என்பதற்குப் பதிலாக இயல்பான சொல். ‘அவரே’ மூலத்தின் ஒருமையையும் வலியுறுத்தலையும் காக்கிறது.
