  to: ஏனெனில், பரலோகத்தில் இருக்கிற என் தந்தையின் விருப்பத்தை நிறைவேற்றுகிற எவரும், அவரே எனக்குச் சகோதரரும் சகோதரியும் தாயுமாக இருக்கிறார்.[a]
