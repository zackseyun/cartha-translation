- from: அப்போதுமுதல் இயேசு, “மனந்திரும்புங்கள்; ஏனெனில் பரலோக அரசு[b] நெருங்கி வந்துள்ளது[a]” என்று அறிவிக்கத் தொடங்கினார்.
  to: அப்போதிலிருந்து இயேசு, “மனந்திரும்புங்கள்; ஏனெனில் பரலோக அரசாட்சி[b] நெருங்கி வந்துள்ளது[a]” என்று அறிவிக்கத் தொடங்கினார்.
  rationale: 'The revision makes two limited stylistic and lexical improvements: it uses the more idiomatic temporal phrase “அப்போதிலிருந்து,” and replaces “அரசு” with “அரசாட்சி” to avoid the modern administrative sense of “government.” The proclamation construction, imperative, and perfect-result nuance remain unchanged. Footnote b is conformed to the revised key term.'
