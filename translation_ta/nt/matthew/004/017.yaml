  text: Ἀπὸ τότε ἤρξατο ὁ Ἰησοῦς κηρύσσειν καὶ λέγειν· Μετανοεῖτε, ἤγγικεν γὰρ ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/017.yaml
  text: From that time Jesus began to proclaim[a], saying, “Repent[c][b], for the kingdom of heaven has drawn near.”
translation:
  language: ta
  text: அப்போதிலிருந்து இயேசு, “மனந்திரும்புங்கள்; ஏனெனில் பரலோக அரசாட்சி[b] நெருங்கி வந்துள்ளது[a]” என்று அறிவிக்கத் தொடங்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நெருங்கியுள்ளது” அல்லது “அருகில் உள்ளது” என்றும் மொழிபெயர்க்கலாம். கிரேக்க நிறைவுக்கால வினை, அதன் நெருக்கம் வந்தடைந்து தொடர்ந்து நிலவுவதை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில், “பரலோகங்களின் அரசாட்சி.” மத்தேயு இந்தச் சொற்றொடரை வழக்கமாகப் பயன்படுத்துகிறார்; பிற இடங்களில் இதற்கு ஒத்ததாக “கடவுளின் அரசாட்சி” என்று கூறப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: அப்போதுமுதல்
  rationale: கதையில் ஒரு புதிய கட்டம் தொடங்குவதைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: ἤρξατο
  choice: தொடங்கினார்
  rationale: தொடர்ந்து வரும் அறிவிப்புச் செயலின் தொடக்கத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: κηρύσσειν καὶ λέγειν
  choice: “…” என்று அறிவிக்க
  rationale: பொதுவாகப் பிரகடனம் செய்வது என்ற κηρύσσειν என்பதன் வலிமையை ‘அறிவிக்க’ தக்கவைக்கிறது; λέγειν மேற்கோளின் உள்ளடக்கத்தை அறிமுகப்படுத்துவதாக இயல்பான தமிழில் வெளிப்படுகிறது.
- source_word: Μετανοεῖτε
  choice: மனந்திரும்புங்கள்
  rationale: வெறும் கருத்துமாற்றத்தை மட்டுமல்லாமல், மனப்பான்மையிலும் வாழ்விலும் கடவுளை நோக்கித் திரும்புவதையும் உள்ளடக்கும் கட்டளையாகும்.
- source_word: ἤγγικεν
  choice: நெருங்கி வந்துள்ளது
  rationale: அரசு நெருங்கிய நிலை ஏற்பட்டுவிட்டதையும் அந்த நிலை தொடர்வதையும் கிரேக்க நிறைவுக்கால வினை உணர்த்துவதால் இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: βασιλεία
  choice: அரசு
  rationale: சூழலுக்கு ஏற்ற இயல்பான தமிழில் அரசாட்சியையும் அரசுரிமையின் ஆளுகையையும் திறந்தவாறு வைத்திருக்கிறது.
- source_word: τῶν οὐρανῶν
  choice: பரலோக
  rationale: கிரேக்கத்தில் பன்மையாக இருந்தாலும், தமிழில் இயல்பாகவும் மத்தேயுவின் தனித்துவமான சொல்லாட்சியைத் தக்கவைத்தும் ‘பரலோக’ என வழங்கப்படுகிறது.
theological_decisions:
- issue: βασιλεία τῶν οὐρανῶν என்பதன் பொருள்
  choice: பரலோக அரசு
  alternative: பரலோக ஆட்சி; பரலோகங்களின் அரசு
  rationale: மத்தேயுவின் தனித்துவமான சொற்றொடரைத் தக்கவைத்து, அதை வெறும் இடத்தைக் குறிக்கும் சொல்லாகச் சுருக்காமல் கடவுளின் அரசாளுகையையும் உள்ளடக்க அனுமதிக்கிறது.
- issue: Μετανοεῖτε என்பதன் வலிமை
  choice: மனந்திரும்புங்கள்
  alternative: திரும்புங்கள்; உங்கள் மனதை மாற்றுங்கள்
  rationale: இது வெறும் அறிவுசார் கருத்துமாற்றத்தைவிட ஆழமான மன மற்றும் வாழ்க்கைத் திருப்பத்தைக் குறிக்கிறது; அதேவேளையில் குறிப்பிட்ட ஒரு திருச்சபை மரபின் விளக்கத்தைத் திணிக்கவில்லை.
- issue: ἤγγικεν என்பதன் காலநிலை
  choice: நெருங்கி வந்துள்ளது
  alternative: அருகில் உள்ளது; நெருங்கிவிட்டது
  rationale: நெருக்கம் வந்தடைந்து தற்போது தொடர்கிறது என்ற கிரேக்க நிறைவுக்காலத்தின் நுட்பத்தைப் பாதுகாக்கிறது; அது முழுமையாக நிறைவேறிவிட்டதா என்ற கேள்வியை மொழிபெயர்ப்பு தீர்மானித்துவிடவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘அறிவிக்க’ என்பது பொதுப் பிரகடனத்தின் வலிமையைத் தருகிறது; மேற்கோளை அறிமுகப்படுத்தும் ‘என்று’ மூலம் கிரேக்கத்தின் καὶ λέγειν இயல்பான தமிழில் வெளிப்படுத்தப்பட்டுள்ளது.
