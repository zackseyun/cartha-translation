id: MAT.4.3
reference: Matthew 4:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ⸂ὁ πειράζων εἶπεν αὐτῷ⸃· Εἰ υἱὸς εἶ τοῦ θεοῦ, εἰπὲ ἵνα οἱ λίθοι οὗτοι ἄρτοι γένωνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/003.yaml
  text: And the tempter came and said to him[a], “If you are the Son of God[b], tell these stones to become bread.”
translation:
  language: ta
  text: சோதிப்பவன் அவரை அணுகி, “நீர் கடவுளின் மகனாக இருந்தால்[a], இந்தக் கற்கள் அப்பங்களாகும்படி சொல்லுங்கள்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நீர் கடவுளின் மகனாக இருப்பதால்” என்றும் பொருள் கொள்ளலாம். கிரேக்க நிபந்தனை வெறும் சந்தேகத்தை அல்ல, ஒரு சவாலையும் வெளிப்படுத்தக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: கிரேக்கத்தில் “அப்பங்கள்” என்பது பன்மையில் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: அணுகி
  rationale: இயேசுவை நோக்கி அருகில் வந்த செயலை இயல்பான தமிழில் தெரிவிக்கிறது; முதன்மை வினைக்கு முந்திய வினையெச்சத்தின் தொடர்பையும் காக்கிறது.
- source_word: ὁ πειράζων
  choice: சோதிப்பவன்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புவினையைச் சுருக்கமாகக் காட்டுகிறது. சூழலில் தீய நோக்குடன் சோதித்தல் அடங்கினாலும், கிரேக்கச் சொல்லின் ‘சோதித்தல்/தூண்டுதல்’ பொருள் பரப்பை தேவையின்றிக் குறுக்கவில்லை.
- source_word: Εἰ
  choice: இருந்தால்
  rationale: நிபந்தனை வடிவத்தைத் தெளிவாகக் காத்து, இது சந்தேகமா அல்லது சவாலாக முன்வைக்கப்பட்ட ஏற்றுக்கொள்ளலா என்பதைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: கடவுளின் மகன்
  rationale: மத்தேயுவின் சூழலில் இயேசுவைக் குறிக்கும் அறியப்பட்ட தனித்துவமான பட்டத்தை இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: εἰπὲ
  choice: சொல்லுங்கள்
  rationale: λέγω என்பதன் அடிப்படைப் பொருளைக் காக்கிறது; மூலத்தில் நேரடியாக இல்லாத ‘கட்டளையிடுங்கள்’ என்ற வலுவான பொருளைச் சேர்க்கவில்லை.
- source_word: οἱ λίθοι οὗτοι
  choice: இந்தக் கற்கள்
  rationale: பன்மையையும் சுட்டுப்பெயரடையின் வலியுறுத்தலையும் நேரடியாகக் காக்கிறது.
- source_word: ἄρτοι
  choice: அப்பங்கள்
  rationale: கிரேக்க மூலத்தின் பன்மையைத் தமிழில் வெளிப்படையாகக் காக்கிறது; இங்கு தனித்தனி அப்பங்களைக் குறிக்கும் இயல்பான சொல்லாகும்.
- source_word: γένωνται
  choice: ஆகும்படி
  rationale: γίνομαι என்பதன் ‘ஆதல்’ பொருளையும், ἵνα உடன் கட்டளையின் நோக்கம் அல்லது உள்ளடக்கத்தை வெளிப்படுத்தும் அமைப்பையும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: Εἰ υἱὸς εἶ τοῦ θεοῦ என்ற நிபந்தனைத் தொடரின் வலிமை
  choice: “நீர் கடவுளின் மகனாக இருந்தால்” என்று நிபந்தனை வடிவில் மொழிபெயர்க்கப்பட்டது.
  alternative: “நீர் கடவுளின் மகனாக இருப்பதால்” அல்லது “நீர் உண்மையிலேயே கடவுளின் மகனானால்”
  rationale: கிரேக்க நிபந்தனை சந்தேகத்தை மட்டுமே குறிக்க வேண்டியதில்லை; அது ஒரு சவாலாகவும் இருக்கலாம். எளிய நிபந்தனை வடிவம் இந்தத் தெளிவின்மையையும் இறையியல் அழுத்தத்தையும் காக்கிறது.
- issue: υἱὸς τοῦ θεοῦ என்ற கிறிஸ்துவியல் பட்டம்
  choice: “கடவுளின் மகன்”
  alternative: “கடவுளின் ஒரு மகன்”
  rationale: உருபில்லாத υἱός இங்கு εἰμί உடன் வரும் பயனிலைப் பெயராக உள்ளது; மத்தேயுவின் கதைச்சூழலில் இது இயேசுவைத் தனித்துவமாக அடையாளப்படுத்தும் பட்டம். எனவே தமிழில் குறிப்பற்ற ‘ஒரு மகன்’ என்று மொழிபெயர்ப்பது தவறான எண்ணத்தை உருவாக்கும்.
translation_notes:
  register: நவீன, தெளிவான, மரியாதைமிக்க உரைநடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவை நோக்கிய ஒருமை மரியாதை வடிவமாக “நீர்/சொல்லுங்கள்” அமைப்பு வைக்கப்பட்டுள்ளது. “தேவன்/குமாரன்” போன்ற மரபுவழி திருச்சபைச் சொற்களுக்கு மாற்றாக பொதுவாகப் புரியும் “கடவுள்/மகன்” பயன்படுத்தப்பட்டுள்ளது.
