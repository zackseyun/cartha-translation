  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Περιπατῶν δὲ παρὰ τὴν θάλασσαν τῆς Γαλιλαίας εἶδεν δύο ἀδελφούς, Σίμωνα τὸν λεγόμενον Πέτρον καὶ Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ, βάλλοντας ἀμφίβληστρον εἰς τὴν θάλασσαν, ἦσαν γὰρ ἁλιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/018.yaml
  text: As he was walking beside the Sea of Galilee[a], he saw two brothers, Simon who is called Peter and Andrew his brother, casting a net into the sea, for they were fishermen.
translation:
  language: ta
  text: 'அவர் கலிலேயா கடலோரமாக நடந்துகொண்டிருந்தபோது, சகோதரர்களான இருவரைக் கண்டார்: பேதுரு என்று அழைக்கப்படும் சீமோனையும், சீமோனின் சகோதரரான அந்திரேயாவையும். அவர்கள் ஒரு வலையை[a] கடலில் வீசிக்கொண்டிருந்தனர்; ஏனெனில் அவர்கள் மீனவர்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கச் சொல் மீன்பிடிப்பதற்காக வீசப்படும் ஒரு வகை வலையைக் குறிக்கிறது; இதை “வீசுவலை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περιπατῶν
  choice: நடந்து சென்றபோது
  rationale: நிகழ்காலப் பெயரெச்சம் முதன்மை வினையான ‘கண்டார்’ என்பதோடு ஒரே நேரத்தில் தொடர்ந்த செயலைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாக இதை வெளிப்படுத்துகிறது.
- source_word: παρὰ τὴν θάλασσαν
  choice: கடலோரமாக
  rationale: παρά + வேற்றுமை உருபு இங்கு கடலின் அருகே, அதன் ஓரமாகச் செல்லுதலைக் குறிக்கிறது.
- source_word: θάλασσαν τῆς Γαλιλαίας
  choice: கலிலேயாக் கடல்
  rationale: இது வழக்கமான புவியியல் பெயர்; நீர்நிலை புவியியல்படி ஏரியாக இருந்தாலும், மூலத்தின் θάλασσα என்ற சொல்லையும் மரபான இடப்பெயரையும் பேணுகிறது.
- source_word: δύο ἀδελφούς
  choice: சகோதரர்கள் இருவர்
  rationale: பெயரிடப்பட்ட இருவரும் ஆண் உடன்பிறந்தவர்கள் என்பதால் மூலத்தின் பொருளைத் துல்லியமாகக் காட்டுகிறது.
- source_word: Σίμωνα τὸν λεγόμενον Πέτρον
  choice: பேதுரு என்று அழைக்கப்படும் சீமோன்
  rationale: λεγόμενον என்ற நிகழ்காலச் செயப்பாட்டு பெயரெச்சத்தின் பொருளையும் இரு பெயர்களுக்கும் இடையிலான உறவையும் தெளிவாகப் பேணுகிறது.
- source_word: Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ
  choice: அவனுடைய சகோதரன் அந்திரேயா
  rationale: அந்திரேயாவைச் சீமோனுடன் தொடர்புபடுத்தும் மூலத்தின் விளக்கச் சொற்றொடரை இயல்பான தமிழில் தருகிறது.
- source_word: βάλλοντας ἀμφίβληστρον
  choice: வலையை கடலில் வீசிக்கொண்டிருந்தார்கள்
  rationale: இருவரையும் கண்டபோது அவர்கள் செய்துகொண்டிருந்த தொடர்ச்சியான செயலைக் காட்டுகிறது; குறிப்பிட்ட வலைவகையின் தகவல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: ஏனெனில், அவர்கள் மீனவர்கள்
  rationale: γάρ தரும் விளக்க உறவை வெளிப்படையாகவும் இயல்பாகவும் காட்டுகிறது; ἁλιεῖς இங்கு ஆண் மீன்பிடிப்பவர்களைக் குறிக்கிறது.
