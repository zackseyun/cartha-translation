translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமான வேதாகம நடையிலும் வடிவமைக்கப்பட்டது. குறிப்பிட்ட வலைவகையை முதன்மை உரையில் பொதுவான ‘வலை’ எனக் கொடுத்து, அதன் நுணுக்கத்தை அடிக்குறிப்பில் பேணுகிறது.
