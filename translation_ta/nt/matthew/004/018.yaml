  terminology: '''பேதுரு,'' ''சீமோன்,'' ''அந்திரேயா,'' ''கலிலேயா கடல்,'' ''மீனவர்கள்,'' and ''வலை'' are appropriate. The footnote appropriately preserves the more specific sense of ἀμφίβληστρον as a cast net without over-specifying the main text.'
