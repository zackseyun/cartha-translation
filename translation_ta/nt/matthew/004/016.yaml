  yaml_path: translation/nt/matthew/004/016.yaml
  text: The people sitting in darkness saw a great light[a], and on those sitting in the region and shadow of death, a light dawned.
translation:
  language: ta
  text: இருளில்[a] அமர்ந்திருந்த மக்கள் பேரொளியைக் கண்டார்கள்; மரண நிழல் படர்ந்த பகுதியில் அமர்ந்திருந்தவர்கள்மேல் ஒளி உதித்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘காரிருளில்.’ கிரேக்கத்தில் ‘மரணம்’ என்பது வெளிப்படையாக இருப்பதாலும், பழக்கமான வேதாகமப் படிமத்தை எதிரொலிப்பதாலும், ‘மரண நிழல்’ என்பது முதன்மை உரையில் வைக்கப்பட்டுள்ளது.
