source:
  edition: SBLGNT
  text: Γῆ Ζαβουλὼν καὶ γῆ Νεφθαλίμ, ὁδὸν θαλάσσης, πέραν τοῦ Ἰορδάνου, Γαλιλαία τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/015.yaml
  text: Land of Zebulun and land of Naphtali[a], the way of the sea, beyond the Jordan, Galilee of the Gentiles—
translation:
  language: ta
  text: '“செபுலோன் நாடும் நப்தலி நாடும்,

    கடல் வழியும்,

    யோர்தானுக்கு அப்பாலும்,

    யூதரல்லாத மக்களின் கலிலேயாவும்[a]—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பிற மக்களின் கலிலேயா”; அல்லது, “நாடுகளின் கலிலேயா.”
    reason: τῶν ἐθνῶν என்பதற்கு இச்சூழலில் ‘யூதரல்லாத மக்கள்’ என்பது பொருத்தமானது; ‘பிற மக்கள்’ மற்றும் ‘நாடுகள்’ ஆகியவை சாத்தியமான சொற்சார் மாற்றுகள்.
lexical_decisions:
- source_word: Γῆ Ζαβουλὼν καὶ γῆ Νεφθαλίμ
  choice: செபுலோன் நாடே, நப்தலி நாடே
  rationale: Γῆ என்பதன் புவியியல் பொருளை ‘நாடு’ எனத் தந்து, கிரேக்கத்தின் இணை அமைப்பையும் விளித்தல் நயத்தையும் இயல்பான தமிழில் காக்கிறது; பெயர்கள் வழக்கமான தமிழ் வேதாகம வடிவில் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: ὁδὸν θαλάσσης
  choice: கடலுக்குச் செல்லும் வழியே
  rationale: சொற்றொடரின் நேரடியான ‘கடலின் வழி’ என்ற அமைப்பை விட இயல்பான தமிழில் வழங்குகிறது; அதேவேளையில் இது ஒரு குறிப்பிட்ட பாதையையோ கடலோடு தொடர்புடைய பகுதியையோ குறிக்கக்கூடிய தெளிவின்மையை அளவுக்கு மீறி விளக்கவில்லை.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: யோர்தானுக்கு அப்பாலுள்ள பகுதியே
  rationale: ‘அப்பால்’ என்பது பார்வைநிலையைத் தேவையின்றி துல்லியப்படுத்தாமல் மூலத்தின் புவியியல் மொழிநடையைப் பாதுகாக்கிறது; தொடரின் விளித்தல் அமைப்புக்காக ‘பகுதியே’ சேர்க்கப்பட்டுள்ளது.
- source_word: Γαλιλαία
  choice: கலிலேயா
  rationale: இப்பகுதிப் பெயருக்கான பரவலாக அறியப்பட்ட தமிழ் ஒலிபெயர்ப்பு.
- source_word: τῶν ἐθνῶν
  choice: யூதரல்லாத மக்களின்
  rationale: மத்தேயுவின் யூதச் சூழலில் ἔθνη குறிக்கும் யூதரல்லாத மக்களை சாதாரண நவீன தமிழ் வாசகருக்குத் தெளிவாகத் தெரிவிக்கிறது; ‘பிற இனத்தார்/நாடுகள்’ என்ற சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: ஏசாயா மேற்கோளில் τῶν ἐθνῶν என்பதன் பொருள்
  choice: யூதரல்லாத மக்களின்
  alternative: பிற இனத்தாரின் / நாடுகளின்
  rationale: இங்கு அந்தச் சொல் வெறும் அரசியல் நாடுகளைவிட யூதரல்லாத மக்களைக் குறிக்கும் இன-சமய வேறுபாட்டை முன்னிறுத்துகிறது. இருப்பினும் ‘நாடுகள்’ என்பது சாத்தியமான நேரடி பொருள் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: கவிதை/தீர்க்கதரிசன மேற்கோளின் வரிசை அமைப்பும் விளித்தல் தொனியும் காக்கப்பட்டுள்ளன. மொழிநடை நவீனமானதும் கண்ணியமானதும்; அடுத்த வசனத்தில் தொடரும் மேற்கோளைச் சுட்ட நீண்ட கோடு வைக்கப்பட்டுள்ளது.
