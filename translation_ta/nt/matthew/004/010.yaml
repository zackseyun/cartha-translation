review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the dismissal, the Scripture-introduction formula, the identification of the Lord as the reader's God, and the exclusive object of service. However, προσκυνήσεις and λατρεύσεις are coordinated future-form injunctions in the citation. Rendering the first as the conjunctive participle “வணங்கி” can imply ‘having worshiped, serve,’ rather than preserving the parallel commands.
  naturalness: The prose is clear, dignified, and natural in modern standard Tamil. “அப்பாலே போ, சாத்தானே!” is an effective forceful dismissal. Using parallel exhortative forms in the quotation improves both clarity and rhythm.
  terminology: “ஆண்டவர்,” “வணங்கு,” and “பணிசெய்” appropriately preserve the Lord/God designation and the distinction between προσκυνέω and λατρεύω. “அவர் ஒருவருக்கே” correctly expresses the exclusivity of αὐτῷ μόνῳ.
  issues:
  - severity: medium
    issue: The coordinated verbs in the Scripture citation are not grammatically parallel in Tamil.
    rationale: “வணங்கி” is a participial form, whereas “பணிசெய்வாயாக” is an injunction. The Greek has two coordinated future-form imperatival statements; changing the first to “வணங்குவாயாக” preserves that parallel force without adding a sequence between the actions.
  - severity: low
    issue: Footnote a’s alternative is not aligned with the revised command form.
    rationale: The alternative “தலைவணங்கி” is likewise participial. It should be an imperative/exhortative form and should retain the source object rather than introducing “முன்.”
  revised_text: அப்போது இயேசு அவனிடம், “அப்பாலே போ, சாத்தானே! ஏனெனில், ‘உன் கடவுளாகிய ஆண்டவரை வணங்குவாயாக[a]; அவர் ஒருவருக்கே பணிசெய்வாயாக[b]’ என்று எழுதப்பட்டிருக்கிறது” என்றார்.
