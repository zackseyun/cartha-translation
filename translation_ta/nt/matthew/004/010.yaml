  text: τότε λέγει αὐτῷ ὁ Ἰησοῦς· ⸀Ὕπαγε, Σατανᾶ· γέγραπται γάρ· Κύριον τὸν θεόν σου προσκυνήσεις καὶ αὐτῷ μόνῳ λατρεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/010.yaml
  text: 'Then Jesus says to him, “Go away, Satan! For it is written: ‘You shall worship the Lord your God, and serve him only.’”'
translation:
  language: ta
  text: அப்போது இயேசு அவனிடம், “அப்பாலே போ, சாத்தானே! ஏனெனில், ‘உன் கடவுளாகிய ஆண்டவரை வணங்குவாயாக[a]; அவர் ஒருவருக்கே பணிசெய்வாயாக[b]’ என்று எழுதப்பட்டிருக்கிறது” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் கடவுளாகிய ஆண்டவரைத் தலைவணங்குவாயாக.” கிரேக்க வினை, பயபக்தியுடன் தரையில் விழுந்து வணங்குவதையோ தலைவணங்குவதையோ இன்னும் நேரடியாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “பணிசெய்” என்று மொழிபெயர்க்கப்பட்டுள்ள வினை, கடவுளுக்குச் செலுத்தப்படும் புனிதமான அல்லது சமயச் சேவையைச் சிறப்பாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε λέγει
  choice: அப்போது ... என்றார்
  rationale: τότε நிகழ்வுகளின் தொடர்ச்சியைக் குறிக்கிறது. λέγει என்பது வரலாற்று நிகழ்காலம்; இயல்பான நவீனத் தமிழ் கதைநடைக்காக இறந்தகாலமான ‘என்றார்’ பயன்படுத்தப்பட்டது.
- source_word: Ὕπαγε
  choice: அப்பாலே போ
  rationale: விலகிச் செல்லுமாறு கட்டளையிடும் வலிமையை இயல்பாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: Σατανᾶ
  choice: சாத்தானே
  rationale: நேரடியாக அழைக்கும் விளிவேற்றுமையுடன் வழக்கமான பெயரெழுத்துப்பெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: γέγραπται
  choice: எழுதப்பட்டிருக்கிறது
  rationale: வேத மேற்கோளை அறிமுகப்படுத்தும் நிறைவு நிலைச் செயப்பாட்டு வடிவத்தின் தொடரும் செல்லுபடியை வெளிப்படுத்துகிறது.
- source_word: Κύριον τὸν θεόν σου
  choice: உன் கடவுளாகிய ஆண்டவரை
  rationale: ‘ஆண்டவர்’ மற்றும் ‘உன் கடவுள்’ ஆகிய இணைநிலை அடையாளங்களைத் தமிழில் தெளிவாகவும் இயல்பாகவும் இணைக்கிறது.
- source_word: προσκυνήσεις
  choice: வணங்கி
  rationale: இச்சூழலில் கடவுளுக்குரிய வழிபாட்டை இயல்பாகக் குறிக்கிறது; உடல் தாழ்த்துதலைக் குறிக்கும் நேரடியான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: αὐτῷ μόνῳ
  choice: அவர் ஒருவருக்கே
  rationale: μόνῳ குறிக்கும் தனிப்பட்ட உரிமையையும் விலக்குத்தன்மையையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: λατρεύσεις
  choice: பணிசெய்வாயாக
  rationale: προσκυνέω என்பதிலிருந்து வேறுபாட்டைப் பாதுகாக்கிறது; கடவுளுக்குச் செய்யப்படும் அர்ப்பணிப்பான அல்லது சமயப் பணியின் நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: προσκυνέω மற்றும் λατρεύω என்ற இரு வினைகளின் வேறுபாடு
  choice: ‘வணங்கி’ மற்றும் ‘பணிசெய்வாயாக’ என்று தனித்தனியாக மொழிபெயர்த்தல்
  alternative: இரண்டையும் ‘வழிபடு’ சார்ந்த சொற்களால் மொழிபெயர்த்தல்; அல்லது முதலாவதை ‘தலைவணங்கு’ என மொழிபெயர்த்தல்
  rationale: மூலத்தில் தொடர்புடையதாயினும் வேறுபட்ட இரு வினைகள் உள்ளன. அவற்றின் வேறுபாட்டைப் பாதுகாப்பது, வணக்கமும் அர்ப்பணிப்பான பணியும் கடவுள் ஒருவருக்கே உரியவை என்ற உரையின் அழுத்தத்தை மறைக்காமல் வைக்கிறது.
- issue: αὐτῷ μόνῳ என்பதிலுள்ள தனித்தன்மை
  choice: ‘அவர் ஒருவருக்கே’
  alternative: ‘அவருக்கே மட்டும்’
  rationale: தமிழில் இயல்பான முறையில், பணியின் ஒரே உரியவராகக் கடவுளை வலியுறுத்துகிறது; ‘மட்டும்’ எதை வரையறுக்கிறது என்ற தேவையற்ற குழப்பத்தையும் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், dignified வேதவாசக நடையும் பொதுவாசகர்களுக்கான தெளிவும் சமநிலைப்படுத்தப்பட்டுள்ளன. நேரடி உரையில் கட்டளையின் வலிமை காக்கப்பட்டுள்ளது; மேற்கோள் உயர்ந்ததாயினும் பழமையான மொழியாக இல்லாமல் அமைக்கப்பட்டுள்ளது.
