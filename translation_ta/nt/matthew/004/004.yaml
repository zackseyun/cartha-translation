reference: Matthew 4:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Γέγραπται· Οὐκ ἐπ’ ἄρτῳ μόνῳ ζήσεται ⸀ὁ ἄνθρωπος, ἀλλ’ ⸀ἐπὶ παντὶ ῥήματι ἐκπορευομένῳ διὰ στόματος θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/004.yaml
  text: 'But he answered[a], “It is written: ‘Man will not live by bread alone[b], but by every word proceeding through the mouth of God.’”'
translation:
  language: ta
  text: 'அவர் பதிலளித்தார்: “எழுதப்பட்டிருக்கிறது: ‘மனிதர்[a] அப்பத்தினால் மட்டுமே வாழமாட்டார்; மாறாக, கடவுளின் வாயின் வழியாகப் புறப்படும் ஒவ்வொரு வார்த்தையினாலும் வாழ்வார்[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மனிதர்” என்பது இங்கு ஒரு குறிப்பிட்ட ஆணை அல்ல, மனிதகுலத்தைப் பொதுவாகக் குறிக்கிறது. கிரேக்கத்தில் ஆண்பால் ஒருமை வடிவம் பிரதிநிதித்துவப் பொருளில் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “கடவுளின் வாயிலிருந்து” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் நேரடியாக “கடவுளின் வாயின் வழியாக” என்று உள்ளது; கடவுள் உரைக்கும் ஒவ்வொரு வார்த்தையும் வெளிப்படுவதை இந்த உருவகம் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: அதற்கு அவர் … என்றார்
  rationale: கிரேக்க மொழியின் ‘பதிலளித்து அவர் சொன்னார்’ என்ற இரட்டைச் சொல்லாக்கத்தை இயல்பான தமிழ் கதைநடையில் சுருக்கமாகவும் அதன் மறுமொழிப் பொருளைக் காக்கும் வகையிலும் தருகிறது.
- source_word: Γέγραπται
  choice: இவ்வாறு எழுதப்பட்டிருக்கிறது
  rationale: நிறைவேற்றப்பட்ட செயல் தொடர்ந்து நிலைத்திருப்பதைக் காட்டும் கிரேக்க இறந்தகால நிறைவு வடிவத்தையும், மறைநூல் மேற்கோளை அறிமுகப்படுத்தும் வழக்கமான சூத்திரத்தையும் காக்கிறது.
- source_word: ἄρτῳ μόνῳ
  choice: அப்பத்தினால் மட்டுமே
  rationale: ἄρτος என்பதன் நேரடியான ‘அப்பம்’ என்ற பொருளைத் தக்கவைத்து, ‘உணவு’ என விரிவுபடுத்துவதைத் தவிர்க்கிறது.
- source_word: ζήσεται
  choice: வாழமாட்டார் … வாழ்வார்
  rationale: எதிர்கால வினையைத் தெளிவாகத் தருகிறது; இரண்டாம் கூறில் கிரேக்கத்தில் மறைந்திருக்கும் வினை தமிழின் முழுமையான, இயல்பான வாக்கிய அமைப்பிற்காக வெளிப்படையாக மீண்டும் கூறப்படுகிறது.
- source_word: ὁ ἄνθρωπος
  choice: மனிதர்
  rationale: ஒரு குறிப்பிட்ட ஆணை அல்லாமல் மனிதகுலத்தைப் பொதுவாகக் குறிக்கும் பிரதிநிதித்துவ ஒருமையை, நவீன தமிழில் இயல்பாகவும் பாலினத்தைத் தேவையின்றி வரையறுக்காமலும் தருகிறது.
- source_word: παντὶ ῥήματι
  choice: ஒவ்வொரு வார்த்தையினாலும்
  rationale: கடவுள் உரைக்கும் ஒவ்வொன்றையும் குறிக்கும் ῥῆμα என்பதையும், வாழ்வதற்கான வழிமுறையைக் காட்டும் வேற்றுமைப் பொருளையும் தக்கவைக்கிறது.
- source_word: ἐκπορευομένῳ
  choice: புறப்படும்
  rationale: கடவுளின் வாய்மொழியாக வெளிவரும் இயக்க உருவகத்தை எளிய, தற்போதைய தமிழில் காக்கிறது.
- source_word: διὰ στόματος θεοῦ
  choice: கடவுளின் வாயின் வழியாக
  rationale: διά + பிறப்புவேற்றுமையின் அடிப்படை ‘வழியாக’ என்ற பொருளையும், கடவுளின் வாயிலிருந்து உச்சரிக்கப்படும் சொல் என்ற உருவகத்தையும் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: ὁ ἄνθρωπος என்ற பிரதிநிதித்துவ ஆண்பால் ஒருமை
  choice: மனிதர்
  alternative: மனிதன்
  rationale: இக்கூற்று மனித வாழ்க்கையைப் பற்றிய பொதுவான உண்மையை உரைக்கிறது. ‘மனிதர்’ என்பது தனிப்பட்ட ஆணைக் குறிப்பதாக வாசிக்கப்படுவதைத் தவிர்த்து, மூலத்தின் மனிதகுலம் முழுவதையும் உள்ளடக்கும் பொதுப் பொருளைத் தருகிறது.
- issue: Γέγραπται என்ற மறைநூல் மேற்கோள் சூத்திரம்
  choice: இவ்வாறு எழுதப்பட்டிருக்கிறது
  alternative: எழுதப்பட்டிருக்கிறது
  rationale: மேற்கோள் தொடர்வதை இயல்பாக அறிமுகப்படுத்துவதோடு, எழுதப்பட்ட உரையின் தொடர்ந்த நிலையை உணர்த்துகிறது; கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: διὰ στόματος θεοῦ என்பதிலுள்ள பேச்சு உருவகம்
  choice: கடவுளின் வாயின் வழியாக
  alternative: கடவுளின் வாயிலிருந்து
  rationale: ‘வழியாக’ என்பது மூலத்தில் உள்ள διά-வின் வடிவத்தைப் பாதுகாக்கிறது. ‘வாயிலிருந்து’ இயல்பான மாற்றாக இருந்தாலும், அது மூலத்தின் முன்னிடைச்சொல் நுணுக்கத்தை மாற்றக்கூடும்.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் மறைநூல் மேற்கோளுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அப்பம்’, ‘வார்த்தை’, ‘வாயின் வழியாக’ ஆகிய சொற்கள் மூல உருவகங்களைத் தக்கவைக்கின்றன; ‘மனிதர்’ உள்ளடக்கமான பொதுப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
