source:
  edition: SBLGNT
  text: τότε ἀφίησιν αὐτὸν ὁ διάβολος, καὶ ἰδοὺ ἄγγελοι προσῆλθον καὶ διηκόνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/011.yaml
  text: Then the devil left him[a], and behold, angels came and were ministering to him.
translation:
  language: ta
  text: அப்போது பிசாசு அவரை விட்டு விலகிச் சென்றான். இதோ, தேவதூதர்கள் வந்து அவருக்குப் பணிவிடை செய்துகொண்டிருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேவதூதர்கள் வந்து அவருக்குச் சேவை செய்தார்கள்.” கிரேக்க வினைச்சொல்லை “சேவை செய்தார்கள்” அல்லது “பணிவிடை செய்துகொண்டிருந்தார்கள்” என்று மொழிபெயர்க்கலாம்; அதன் நிறைவுறா இறந்தகால வடிவம் தொடர்ந்து நடந்த செயலை உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: நிகழ்வுகளின் வரிசையை இயல்பாகக் குறிக்கும் நவீனத் தமிழ் இணைப்புச்சொல்.
- source_word: ἀφίησιν
  choice: விலகிச் சென்றது
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தைத் தமிழ் கதைநடைக்கு இயல்பான இறந்தகாலத்தில் தருகிறது; இச்சூழலில் பிசாசு இயேசுவைவிட்டுப் போனதைக் குறிப்பாக வெளிப்படுத்துகிறது.
- source_word: ὁ διάβολος
  choice: பிசாசு
  rationale: சோதனை நிகழ்வில் சாத்தானைக் குறிக்கும் தனிப்பட்ட பட்டமாக இருப்பதால், தமிழில் நிலைபெற்றதும் தெளிவானதுமான சொல்.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: அடுத்த நிகழ்வின்மீது திடீரெனக் கவனத்தை ஈர்க்கும் மூலமொழியின் உரையாடல் குறிப்பைச் சுருக்கமாகவும் கண்ணியமாகவும் காக்கிறது.
- source_word: ἄγγελοι
  choice: தேவதூதர்கள்
  rationale: இச்சூழலில் மனிதத் தூதர்கள் அல்ல, வானுலகத் தூதர்களே குறிக்கப்படுவதால் தெளிவான தமிழ் சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: προσῆλθον
  choice: வந்து
  rationale: அவர்கள் இயேசுவிடம் வந்து சேர்ந்ததை இயல்பான தமிழ் கதைநடையில் தெரிவிக்கிறது.
- source_word: διηκόνουν
  choice: பணிவிடை செய்துகொண்டிருந்தார்கள்
  rationale: சேவை செய்தல் என்ற பொருளையும், கிரேக்க நிறைவுறா இறந்தகாலம் சுட்டும் தொடர்ச்சியான செயலையும் காக்கிறது.
- source_word: αὐτῷ
  choice: அவருக்கு
  rationale: சேவையைப் பெற்றவர் இயேசு என்பதை மரியாதையான தமிழ் ஒருமை வடிவில் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: διάβολος என்பதைக் சாத்தானைக் குறிக்கும் கதைச்சூழலில் மொழிபெயர்த்தல்
  choice: பிசாசு
  alternative: அவதூறு செய்பவன்
  rationale: சொல்லின் அடிப்படைப் பொருளை மட்டும் நேரடியாகத் தரும் மாற்று, இங்கு அது சாத்தானைக் குறிக்கும் பட்டம் என்பதை மறைக்கக்கூடும். ‘பிசாசு’ என்பது கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல் குறிப்பைத் தெளிவாகக் காக்கிறது.
- issue: தேவதூதர்களின் διηκόνουν செயலை வெளிப்படுத்தல்
  choice: பணிவிடை செய்துகொண்டிருந்தார்கள்
  alternative: சேவை செய்தார்கள்
  rationale: மூலவினையின் சேவைப் பொருளோடு அதன் நிறைவுறா இறந்தகால வடிவம் உணர்த்தும் தொடர்ச்சியையும் முதன்மை உரை காக்கிறது; சேவையின் தன்மை என்ன என்பதை உரை சொல்லாததால் அது விளக்கிச் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், கண்ணியமான தமிழ் கதைநடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவைக் குறிக்கும் சுட்டுப்பெயர்களில் மரியாதை ஒருமையும், தேவதூதர்களுக்கு மனிதப் பன்மை வினைமுற்றும் பயன்படுத்தப்பட்டுள்ளன. ‘இதோ’ என்பது மூலத்தின் கவன ஈர்ப்புத் தன்மையைத் தக்கவைக்கிறது.
