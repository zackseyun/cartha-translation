  text: Πάλιν παραλαμβάνει αὐτὸν ὁ διάβολος εἰς ὄρος ὑψηλὸν λίαν, καὶ δείκνυσιν αὐτῷ πάσας τὰς βασιλείας τοῦ κόσμου καὶ τὴν δόξαν αὐτῶν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/008.yaml
  text: Again[a], the devil takes him to a very high mountain and shows him all the kingdoms of the world and their glory.
translation:
  language: ta
  text: மறுபடியும் பிசாசு அவரை மிகவும் உயரமான ஒரு மலைக்குக் கூட்டிக்கொண்டு போய், உலகத்தின் எல்லா ராஜ்யங்களையும் அவற்றின் மகிமையையும்[a] அவருக்குக் காட்டுகிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவற்றின் மாட்சிமையையும்’ அல்லது ‘அவற்றின் செழுமையையும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: மறுபடியும்
  rationale: சோதனை நிகழ்வுகளின் தொடரில் மீண்டும் நிகழ்வதைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: παραλαμβάνει
  choice: கூட்டிக்கொண்டு போய்
  rationale: ஒருவரைத் தன்னுடன் அழைத்துச் செல்லும் இயக்கத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; கிரேக்கச் சொல்லுக்கு அப்பாற்பட்ட வற்புறுத்தலைச் சேர்க்கவில்லை.
- source_word: ὁ διάβολος
  choice: பிசாசு
  rationale: இச்சூழலில் சாத்தானைக் குறிக்கும் அங்கீகரிக்கப்பட்ட பட்டத்திற்கான தெளிவான, வழக்கமான தமிழ் மொழிபெயர்ப்பு.
- source_word: εἰς ὄρος ὑψηλὸν λίαν
  choice: மிகவும் உயரமான ஒரு மலைக்கு
  rationale: εἰς குறிக்கும் இலக்கை ‘மலைக்கு’ என்பதும், λίαν தரும் வலியுறுத்தலை ‘மிகவும்’ என்பதும் இயல்பாகப் பாதுகாக்கின்றன.
- source_word: δείκνυσιν
  choice: காட்டுகிறான்
  rationale: வரலாற்று நிகழ்காலத்தின் உயிரோட்டத்தைப் பாதுகாக்கும் நேரடியான தமிழ் வடிவம்.
- source_word: πάσας τὰς βασιλείας
  choice: எல்லா அரசுகளையும்
  rationale: βασιλεία இங்கு ஆட்சிக்குட்பட்ட அரசியல் அரசுகளைக் குறிக்கிறது; ‘அரசுகள்’ என்பது நவீன வாசகர்களுக்குத் தெளிவானது.
- source_word: τοῦ κόσμου
  choice: உலகத்தின்
  rationale: κόσμος என்பதன் இச்சூழலுக்குரிய பரந்த பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: τὴν δόξαν αὐτῶν
  choice: அவற்றின் மகிமையையும்
  rationale: δόξα என்பதுடனான முக்கிய சொற்பிணைப்பைப் பாதுகாக்கிறது; இங்கு வெளிப்படும் செழுமை அல்லது மாட்சிமை என்ற பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: சோதனை நிகழ்வில் மலையிலிருந்து உலகத்தின் எல்லா அரசுகளும் காட்டப்பட்ட விதம்
  choice: நிகழ்வு உரையில் சொல்லப்பட்டபடியே மொழிபெயர்க்கப்படுகிறது; காட்டுதல் எவ்வாறு நிகழ்ந்தது என்று குறிப்பிடப்படவில்லை.
  alternative: இது ஒரு மெய்யான புவியியல் பார்வை அல்லது தரிசனமான/இயற்கைக்கு அப்பாற்பட்ட வெளிப்பாடு என்று விளக்குதல்.
  rationale: கிரேக்க உரை பிசாசு இயேசுவை மிகவும் உயரமான மலைக்குக் கூட்டிச் சென்று அரசுகளைக் காட்டினான் என்று மட்டுமே கூறுகிறது. அதன் முறையைத் தீர்மானிக்காமல் உரையின் தெளிவின்மையும் இறையியல் பதற்றமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்க வரலாற்று நிகழ்காலத்தை ‘காட்டுகிறான்’ எனப் பாதுகாத்துள்ளோம்; அதற்கு முன் வரும் இயக்கச் செயலைத் தமிழின் இயல்பான தொடர்வினை அமைப்பில் ‘கூட்டிக்கொண்டு போய்’ என வழங்கியுள்ளோம்.
