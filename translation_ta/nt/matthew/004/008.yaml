  terminology: Replace “அரசுகள்” with “ராஜ்யங்கள்” to preserve the political-regal sense of βασιλείας without narrowing it to modern governmental bodies. “பிசாசு,” “உலகம்,” and “மகிமை” are suitable in this register. The footnote remains a valid lexical alternative for δόξα.
