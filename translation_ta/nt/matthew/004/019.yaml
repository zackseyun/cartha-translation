  text: καὶ λέγει αὐτοῖς· Δεῦτε ὀπίσω μου, καὶ ποιήσω ὑμᾶς ἁλιεῖς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/019.yaml
  text: And he says to them[a], “Come after me, and I will make you fishers of men.”
translation:
  language: ta
  text: அவர் அவர்களிடம் சொல்கிறார்:[a] “என் பின்னே வாருங்கள்; உங்களை மனிதர்களைப் பிடிக்கும் மீனவர்களாக ஆக்குவேன்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் “சொல்கிறார்” என்று நிகழ்காலம் உள்ளது; தமிழ்க் கதைநடையில் “சொன்னார்” என்றும் மொழிபெயர்க்கலாம்.
    reason: historical_present
lexical_decisions:
- source_word: λέγει
  choice: சொல்கிறார்
  rationale: கிரேக்க மூலத்திலுள்ள வரலாற்று நிகழ்காலத்தைத் தக்கவைக்க நிகழ்கால வினை பயன்படுத்தப்பட்டுள்ளது; தமிழிலும் இது உயிரோட்டமுள்ள கதைநடையாகப் புரிகிறது.
- source_word: Δεῦτε
  choice: வாருங்கள்
  rationale: இது நேரடியான அழைப்புக் கட்டளை. பன்மை மரியாதை வடிவம் இங்கு இயல்பான நவீனத் தமிழாகவும், இருவரை நோக்கிய பன்மையாகவும் அமைகிறது.
- source_word: ὀπίσω μου
  choice: என் பின்னே
  rationale: ‘எனக்குப் பின்னால்/என்னைப் பின்பற்றி’ என்ற சீடத்துவ உருவகத்தைத் தக்கவைக்கிறது; Δεῦτε என்பதன் தனிப்பட்ட அழைப்புப் பொருளையும் சுருக்காமல் விடுகிறது.
- source_word: ποιήσω ὑμᾶς
  choice: உங்களை … ஆக்குவேன்
  rationale: இயேசுவின் எதிர்கால மாற்றுச் செயலை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἁλιεῖς ἀνθρώπων
  choice: மனிதர்களைப் பிடிக்கும் மீனவர்கள்
  rationale: ἁλιεῖς என்பதிலுள்ள மீன்பிடிப்பவர் என்ற உருவகத்தையும், ἀνθρώπων என்பதிலுள்ள பொதுவான மனிதர்களைக் குறிக்கும் பொருளையும் தமிழில் தெளிவாகத் தக்கவைக்கிறது. ‘மனிதர்கள்’ பாலின வேறுபாடின்றி இங்கு எல்லா மனிதர்களையும் இயல்பாகக் குறிக்கிறது.
theological_decisions:
- issue: ἁλιεῖς ἀνθρώπων என்ற உருவகத்தின் பொருள்
  choice: மனிதர்களைப் பிடிக்கும் மீனவர்கள்
  alternative: மனிதர்களைச் சேர்ப்பவர்கள்
  rationale: மாற்று வாசகம் நோக்கத்தை விளக்கினாலும், மூலத்திலுள்ள மீன்பிடி உருவகத்தை நீக்கிவிடும். ஆகவே அதன் திறந்த உருவகத் தன்மை பாதுகாக்கப்பட்டுள்ளது.
- issue: ἀνθρώπων என்பதன் பாலினச் சார்பு
  choice: மனிதர்கள்
  alternative: ஆண்கள்
  rationale: இச்சூழலில் ἄνθρωπος மனிதர்களைப் பொதுவாகக் குறிக்கிறது. ‘ஆண்கள்’ என்று மொழிபெயர்ப்பது கிரேக்கத்தின் இச்சூழல் பொருளைத் தேவையின்றி குறுக்கிவிடும்; தமிழின் ‘மனிதர்கள்’ மூலத்தின் பொதுமனிதப் பொருளைத் துல்லியமாக வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மதிப்புடனும் அமைக்கப்பட்டுள்ளது. “என் பின்னே வாருங்கள்” என்பது மூலத்தின் இரு கூறுகளையும் காத்து, இயல்பான சீடத்துவ அழைப்பாக ஒலிக்கிறது.
