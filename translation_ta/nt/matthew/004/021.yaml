id: MAT.4.21
reference: Matthew 4:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ προβὰς ἐκεῖθεν εἶδεν ἄλλους δύο ἀδελφούς, Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, ἐν τῷ πλοίῳ μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν καταρτίζοντας τὰ δίκτυα αὐτῶν, καὶ ἐκάλεσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/021.yaml
  text: And going on from there, he saw two other brothers, James the son of Zebedee and John his brother, in the boat with Zebedee their father, mending their nets, and he called them.
translation:
  language: ta
  text: அவர் அங்கிருந்து மேலும் சென்று, வேறு இரண்டு சகோதரர்களான செபெதேயுவின் மகன் யாக்கோபையும், அவனுடைய சகோதரனான யோவானையும் கண்டார். அவர்கள் தங்கள் தந்தை செபெதேயுவோடு படகில் தங்கள் வலைகளைச் சீர்செய்துகொண்டிருந்தார்கள். அவர் அவர்களை அழைத்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προβὰς ἐκεῖθεν
  choice: அங்கிருந்து மேலும் சென்று
  rationale: இடத்தைவிட்டு அடுத்த இடத்திற்குச் சென்ற தொடர்ச்சியான நகர்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἶδεν
  choice: கண்டார்
  rationale: ὁράω என்பதன் எளிய கதைநடைப் பொருளை உயர்த்தாமலும் விளக்கமாக்காமலும் தருகிறது.
- source_word: ἄλλους δύο ἀδελφούς
  choice: வேறு இரண்டு சகோதரர்களை
  rationale: முன்பு குறிப்பிடப்பட்ட சகோதரர்களுக்கு அடுத்ததாக இன்னொரு சகோதரர் இணையைக் குறிக்கும் ἄλλους என்ற சொல்லின் கூடுதல்/வேறான பொருளைப் பாதுகாக்கிறது.
- source_word: Ἰάκωβον τὸν τοῦ Ζεβεδαίου
  choice: செபெதேயுவின் மகன் யாக்கோபை
  rationale: கிரேக்க மரபுத் தொடர்பைக் காட்டும் குறுக்கப்பட்ட சொற்றொடரைத் தமிழில் தெளிவாகப் பெற்றோர் உறவாக வெளிப்படுத்துகிறது.
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: அவனுடைய சகோதரன் யோவானை
  rationale: αὐτοῦ என்பது யாக்கோபைக் குறிப்பதைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐν τῷ πλοίῳ
  choice: படகில்
  rationale: மீன்பிடிச் சூழலில் πλοῖον பெரிய கப்பலைவிடப் படகைக் குறிக்கிறது.
- source_word: μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν
  choice: தங்கள் தந்தை செபெதேயுவோடு
  rationale: μετάவின் உடனிருப்பு பொருளையும் செபெதேயு இருவரின் தந்தை என்பதையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: καταρτίζοντας τὰ δίκτυα αὐτῶν
  choice: தங்கள் வலைகளைச் செப்பனிட்டுக்கொண்டிருந்தார்கள்
  rationale: மீன்பிடிச் சூழலில் வலைகளைப் பயன்பாட்டிற்கு ஏற்ற நிலைக்குக் கொண்டுவருதல் அல்லது பழுதுபார்த்தல் என்ற பொருளை 'செப்பனிடுதல்' உள்ளடக்குகிறது; தொடர்ச்சியான செயலை வினையெச்ச அமைப்பு வெளிப்படுத்துகிறது.
- source_word: ἐκάλεσεν αὐτούς
  choice: அவர் அவர்களை அழைத்தார்
  rationale: சீடத்துவ அழைப்பு சூழலில் உணரப்பட்டாலும், மூலத்தில் இல்லாத 'தம்மைப் பின்பற்றும்படி' என்பதைச் சேர்க்காமல் καλέωவின் எளிய சொல்லாக்கத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ἐκάλεσεν என்பதில் உள்ள சீடத்துவ அழைப்பின் உட்பொருள்
  choice: அவர் அவர்களை அழைத்தார்
  alternative: அவர் தம்மைப் பின்பற்றும்படி அவர்களை அழைத்தார்
  rationale: உடனடியான சூழல் இது சீடத்துவத்திற்கான அழைப்பு என்பதை உணர்த்துகிறது; ஆனால் இவ்வசனம் அழைத்தார் என்று மட்டுமே கூறுவதால், அந்த உட்பொருளை விளக்கச் சொற்களால் விரிவாக்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட கதைநடை. பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட வடிவங்களில் தரப்பட்டுள்ளன. நீண்ட கிரேக்க வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; கருத்து வரிசை பாதுகாக்கப்பட்டுள்ளது.
