source:
  edition: SBLGNT
  text: Τότε παραλαμβάνει αὐτὸν ὁ διάβολος εἰς τὴν ἁγίαν πόλιν, καὶ ⸀ἔστησεν αὐτὸν ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/005.yaml
  text: Then the devil takes him into the holy city and sets him on the pinnacle of the temple[b][a],
translation:
  language: ta
  text: பின்பு பிசாசு அவரைப் பரிசுத்த நகரத்துக்குக் கொண்டுபோய்[a], ஆலய வளாகத்தின் உச்சி முனையில்[b] அவரை நிறுத்தினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, எருசலேம்.
    reason: cross_reference
  - marker: b
    text: அல்லது, “ஆலய வளாகத்தின் நீட்டிய விளிம்பில்”; கிரேக்கச் சொல் ஆலய வளாகத்தின் வெளியே நீண்டிருந்த ஓர் ஓரத்தையோ அதன் மிக உயர்ந்த பகுதியையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: பின்பு
  rationale: அடுத்த நிகழ்வை அறிமுகப்படுத்தும் கால-தொடர்ச்சி சொல்லாக இயல்பான நவீனத் தமிழில் மொழிபெயர்க்கப்பட்டது.
- source_word: παραλαμβάνει
  choice: கொண்டுபோய்
  rationale: வரலாற்று நிகழ்காலம் தமிழ்க் கதைநடையில் இறந்தகாலத் தொடர்வினையாக இயல்பாக வழங்கப்படுகிறது; சூழலில் ஒருவரைத் தன்னுடன் அழைத்துச் செல்வதைக் குறிக்கிறது.
- source_word: ὁ διάβολος
  choice: பிசாசு
  rationale: இங்கு சாத்தானைக் குறிக்கும் தனிப்பட்ட பட்டப்பெயராக வரும் διάβολος என்பதற்கான நிலைபெற்ற தமிழ் மொழிபெயர்ப்பு.
- source_word: εἰς τὴν ἁγίαν πόλιν
  choice: பரிசுத்த நகரத்துக்கு
  rationale: மூலத்தின் மரியாதைப் பெயரைப் பேணி, எருசலேம் என்ற விளக்கத்தை அடிக்குறிப்பில் தருகிறது.
- source_word: ἔστησεν
  choice: நிறுத்தினான்
  rationale: ἵστημι இங்கு பிறவினைப் பொருளில், அவரை ஓர் இடத்தில் நிற்கச் செய்தான் என்பதைக் குறிக்கிறது.
- source_word: ἐπὶ τὸ πτερύγιον
  choice: உச்சி முனையில்
  rationale: πτερύγιον குறிக்கும் நீட்டிய விளிம்பு அல்லது உயர்ந்த முனை என்ற கட்டடவியல் பொருளை இயல்பாகக் காட்டுகிறது; துல்லியமான அமைப்பு உறுதியல்ல என்பதை அடிக்குறிப்பு பேணுகிறது.
- source_word: τοῦ ἱεροῦ
  choice: ஆலய வளாகத்தின்
  rationale: ἱερόν என்பது உள் பரிசுத்த இடத்தை மட்டும் அல்லாமல் முழு ஆலய வளாகத்தையும் குறிக்கக்கூடியதால், அந்த விரிவான பொருள் வெளிப்படையாகப் பேணப்பட்டது.
theological_decisions:
- issue: ‘பரிசுத்த நகரம்’ என்பதன் அடையாளம்
  choice: முதன்மை உரையில் ‘பரிசுத்த நகரம்’ என்று மூலத்தின் மரியாதைப் பெயரைப் பேணுதல்
  alternative: எருசலேம்
  rationale: மூலம் நகரத்தின் பெயரை நேரடியாகச் சொல்லாமல் மரியாதைப் பெயரைப் பயன்படுத்துகிறது; அடையாளம் அடிக்குறிப்பில் தெளிவாக்கப்படுகிறது.
- issue: πτερύγιον τοῦ ἱεροῦ என்பதன் கட்டடவியல் குறிப்பு
  choice: ‘ஆலய வளாகத்தின் உச்சி முனை’
  alternative: ‘ஆலய வளாகத்தின் நீட்டிய விளிம்பு’ அல்லது ‘ஆலய வளாகத்தின் மிக உயர்ந்த பகுதி’
  rationale: குறிப்பிட்ட கட்டடப் பகுதி உறுதியாகத் தெரியாததால், வாசிக்க இயல்பான மொழியைப் பயன்படுத்தி மாற்றுப் பொருளை அடிக்குறிப்பில் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வரலாற்று நிகழ்காலம் தமிழில் இயல்பான இறந்தகால வினைத் தொடராக வழங்கப்பட்டுள்ளது; ἱερόν மற்றும் πτερύγιον ஆகியவற்றின் பொருள் வேறுபாடுகள் மறைக்கப்படவில்லை.
