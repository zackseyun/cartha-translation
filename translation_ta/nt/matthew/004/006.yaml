id: MAT.4.6
reference: Matthew 4:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν κάτω· γέγραπται γὰρ ὅτι Τοῖς ἀγγέλοις αὐτοῦ ἐντελεῖται περὶ σοῦ καὶ ἐπὶ χειρῶν ἀροῦσίν σε, μήποτε προσκόψῃς πρὸς λίθον τὸν πόδα σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/006.yaml
  text: 'And he said to him[a], “If you are the Son of God, throw yourself down, for it is written: ‘He will command his angels concerning you,’ and ‘On their hands they will lift you up[b], lest you strike your foot against a stone.’”'
translation:
  language: ta
  text: அவன் அவரிடம், “நீர் தேவனுடைய மகன் என்றால், உம்மையே கீழே எறிந்துவிடும்[a]. ஏனெனில், ‘உம்மைக் குறித்து அவர் தமது தூதர்களுக்குக் கட்டளையிடுவார்’ என்றும், ‘உமது கால் ஒரு கல்லில் மோதாதபடி, அவர்கள் தங்கள் கைகளில் உம்மைத் தூக்கிச் சுமப்பார்கள்[b]’ என்றும் எழுதப்பட்டுள்ளது” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் மரபான நடையில், “உம்மையே கீழே தள்ளிவிடும்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்கள் தங்கள் கைகளில் உம்மைத் தாங்குவார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: அவன் அவரிடம் ... என்றான்
  rationale: கதைநடையில் வரும் கிரேக்க வரலாற்று நிகழ்காலத்தை இயல்பான தமிழ் இறந்தகாலமாக மொழிபெயர்க்கிறது; எழுவாய் முந்தைய சூழலிலிருந்து புரிந்துகொள்ளப்படுகிறது.
- source_word: Εἰ
  choice: என்றால்
  rationale: சோதனையின் நிபந்தனை மற்றும் சவால் தன்மையைப் பாதுகாக்கிறது; ‘நீர் ... என்பதால்’ என்று உண்மையை முன்கூட்டியே ஒப்புக்கொள்ளவில்லை.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: தேவனுடைய மகன்
  rationale: மத்தேயுவின் சூழலில் கிறிஸ்துவைக் குறிக்கும் பட்டப்பெயரின் வலிமையைத் தமிழில் இயல்பாகக் காக்கிறது.
- source_word: βάλε σεαυτὸν κάτω
  choice: கீழே குதித்துவிடும்
  rationale: உயரமான இடத்திலிருந்து தன்னைக் கீழே போடுமாறு கூறும் கட்டளையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; சொற்சார்ந்த மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: γέγραπται
  choice: எழுதப்பட்டுள்ளது
  rationale: வேதவாக்கு எழுதப்பட்டு நிலைத்திருப்பதைக் குறிக்கும் கிரேக்க நிறைவுக்காலத்தின் வழக்கமான வேதாகமத் தமிழ் இணை.
- source_word: ἐντελεῖται
  choice: கட்டளையிடுவார்
  rationale: அதிகாரபூர்வமான ஆணையின் பொருளை நேரடியாகப் பாதுகாக்கிறது.
- source_word: περὶ σοῦ
  choice: உம்மைக் குறித்து
  rationale: περί உடன் வரும் உருபின் ‘உம்மைப் பற்றி/குறித்து’ என்ற நேரடிப் பொருளைத் துல்லியமாகக் காட்டுகிறது.
- source_word: ἐπὶ χειρῶν
  choice: தங்கள் கைகளில்
  rationale: தேவதூதர்களின் கைகளால் பாதுகாப்பாகத் தாங்கப்படும் உருவகத்தை இயல்பான தமிழில் தருகிறது.
- source_word: ἀροῦσίν σε
  choice: உம்மைத் தாங்கிக்கொள்வார்கள்
  rationale: αἴρω என்பதன் இங்குள்ள தூக்கி அல்லது சுமந்து பாதுகாக்கும் பொருளை வெளிப்படுத்துகிறது; ‘தூக்கி ஏந்துவார்கள்’ என்ற மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: μήποτε προσκόψῃς
  choice: மோதாதபடி
  rationale: நிகழாமல் தடுப்பதைக் குறிக்கும் μήποτε-யையும், கால் கல்லில் இடிப்பதைக் குறிக்கும் προσκόπτω-வையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: πρὸς λίθον
  choice: ஒரு கல்லில்
  rationale: குறிப்பிட்ட கட்டுரை இல்லாத λίθον என்பதன் பொதுவான, வரையறுக்கப்படாத பொருளைத் தமிழில் ‘ஒரு’ எனத் தெளிவுபடுத்துகிறது.
- source_word: τὸν πόδα σου
  choice: உமது கால்
  rationale: மூலத்தின் ஒருமையைத் தொடர்ந்து காக்கிறது.
theological_decisions:
- issue: சோதிப்பவனின் சவாலில் ‘தேவனுடைய மகன்’ என்பதன் கிறிஸ்துவியல் வலிமை
  choice: ‘தேவனுடைய மகன்’ என்ற பட்டப்பெயராக மொழிபெயர்க்கப்பட்டது
  alternative: பொதுவகைப் பொருளில் ‘தேவனின் ஒரு மகன்’ என்று மொழிபெயர்த்தல்
  rationale: மத்தேயுவின் கதைச்சூழலில் இது பொதுவான வகைப்பாடு அல்ல; இயேசுவைக் குறிக்கும் அறியப்பட்ட பட்டப்பெயர். அதற்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
- issue: சாத்தான் சங்கீதம் 91-ஐ மேற்கோள் காட்டுவது
  choice: அவன் கூறிய வேதமேற்கோளை விளக்கமோ திருத்தமோ இன்றி அப்படியே மொழிபெயர்த்தல்
  alternative: மேற்கோளை எவ்வாறு புரிந்துகொள்ள வேண்டும் என்ற விளக்கத்தை முதன்மை உரையிலேயே சேர்த்தல்
  rationale: மூலவசனம் சோதிப்பவன் வேதத்தை மேற்கோள் காட்டுவதாகவே முன்வைக்கிறது; அதன் இறையியல் பதற்றத்தை மொழிபெயர்ப்பு தானாகத் தீர்க்கக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. இயேசுவை நோக்கிய உரையில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. வேதமேற்கோள் தனித்த மேற்கோள் குறிகளால் தெளிவுபடுத்தப்பட்டுள்ளது; மூலத்தின் இரண்டு இணைந்த மேற்கோள் கூறுகளும் ‘என்றும்’ மூலம் பாதுகாக்கப்பட்டுள்ளன.
