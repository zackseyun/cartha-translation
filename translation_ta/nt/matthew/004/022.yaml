id: MAT.4.22
reference: Matthew 4:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἱ δὲ εὐθέως ἀφέντες τὸ πλοῖον καὶ τὸν πατέρα αὐτῶν ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/022.yaml
  text: And they immediately left the boat and their father and followed him[a].
translation:
  language: ta
  text: அவர்கள் உடனே[a] படகையும் தங்கள் தந்தையையும் விட்டுவிட்டு, அவரைப் பின்பற்றினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அப்போதே.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: அவர்கள்
  rationale: δέ இங்கு வலுவான எதிர்மறையைக் காட்டாமல் கதையை முன்னெடுத்துச் செல்லும் மென்மையான இணைப்பாக உள்ளது. தமிழில் தனி இணைப்புச் சொல்லைச் சேர்க்காமல் எழுவாயுடன் தொடங்குவது இயல்பாகவும் பொருளுக்கு உண்மையாகவும் உள்ளது.
- source_word: εὐθέως
  choice: உடனே
  rationale: சீடர்களின் தாமதமற்ற பதிலைத் தெளிவாகவும் இயல்பான நவீனத் தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: ἀφέντες
  choice: விட்டுவிட்டு
  rationale: முதலில் படகையும் தந்தையையும் விட்டார்கள்; பின்னர் இயேசுவைப் பின்பற்றினார்கள் என்ற வினைத் தொடரை இயல்பான தமிழில் காக்கிறது. நிரந்தரமாகக் கைவிட்டார்கள் என்ற அளவுக்கு பொருளை வலுப்படுத்தவில்லை.
- source_word: τὸ πλοῖον
  choice: படகை
  rationale: மீன்பிடிச் சூழலில் πλοῖον என்பதற்கு ‘கப்பல்’ என்பதைவிட ‘படகு’ துல்லியமானதும் இயல்பானதும் ஆகும்.
- source_word: τὸν πατέρα αὐτῶν
  choice: தங்கள் தந்தையை
  rationale: இருவருக்கும் உரிய தந்தையைத் தெளிவாகக் குறிக்கிறது; ‘தங்கள்’ என்பது எழுவாயைத் திரும்பச் சுட்டும் இயல்பான தமிழ் வடிவம்.
- source_word: ἠκολούθησαν αὐτῷ
  choice: அவரைப் பின்பற்றினார்கள்
  rationale: இயேசுவுக்குப் பின்னால் சென்றது மற்றும் சீடர்களாக அவரைப் பின்பற்றியது ஆகிய இரு நுணுக்கங்களையும் ‘பின்பற்றினார்கள்’ காக்கிறது.
- source_word: οἱ
  choice: அவர்கள்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் கிரேக்கச் சுட்டு, முன் வசனத்தில் கூறப்பட்ட இரு சகோதரர்களைக் குறிக்கிறது; தமிழில் ‘அவர்கள்’ இயல்பான வடிவம்.
theological_decisions:
- issue: சீடத்துவப் பதிலும் குடும்பத்திடமிருந்து பிரிதலும்
  choice: படகையும் தந்தையையும் உடனே விட்டுவிட்டு இயேசுவைப் பின்பற்றிய தீர்மானமான செயல் என்று நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: அவர்கள் தங்கள் தந்தையை நிரந்தரமாகக் கைவிட்டார்கள்; அல்லது சிறிது நேரம் மட்டும் விலகிச் சென்றார்கள்.
  rationale: மூலம் அவர்களுடைய உடனடியான, தீர்மானமான பதிலை வலியுறுத்துகிறது. ஆனால் ἀφέντες என்ற சொல் பிரிவு நிரந்தரமானதா தற்காலிகமானதா என்பதைத் தனியாக நிர்ணயிக்கவில்லை; ஆகவே ‘கைவிட்டார்கள்’ போன்ற அதிகப் பொருள் ஏற்றப்பட்ட சொல்லைத் தவிர்த்து ‘விட்டுவிட்டு’ பயன்படுத்தப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிதாகப் புரியும், ஆனால் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடை. கிரேக்க வாக்கியத்தின் சுருக்கத்தையும் செயல்களின் வரிசையையும் காக்கிறது.
