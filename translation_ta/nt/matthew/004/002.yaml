lexical_decisions:
- source_word: νηστεύσας
  choice: நோன்பிருந்த பின்பு
  rationale: இறந்தகால வினையெச்சம் முதன்மை வினைக்கு முந்திய செயலைக் குறிக்கிறது; இத்தமிழாக்கம் அந்தக் காலத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἡμέρας τεσσεράκοντα καὶ νύκτας τεσσεράκοντα
  choice: நாற்பது நாட்களும் நாற்பது இரவுகளும்
  rationale: கால நீட்சியைக் குறிக்கும் வேற்றுமையைத் தமிழில் இயல்பான கால அளவுத் தொடராக வழங்குகிறது; மூலத்தின் இரட்டைக் கட்டமைப்பையும் காக்கிறது.
- source_word: ὕστερον
  choice: பின்பு
  rationale: நோன்புக்குப் பிறகு நிகழ்ந்ததைத் தெளிவாகக் குறிக்கிறது; νηστεύσας உடன் இணைந்து இயல்பான தமிழ்த் தொடரை உருவாக்குகிறது.
- source_word: ἐπείνασεν
  choice: அவருக்குப் பசியுண்டாயிற்று
  rationale: பசி ஏற்பட்டதையும் உண்மையான உடல் தேவையையும் இயல்பான, மரியாதையான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: καὶ
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: தமிழில் வசனத்தின் தொடக்கத்தில் ‘மேலும்’ அல்லது ‘அப்போது’ சேர்ப்பது தேவையற்றதாகவோ கூடுதல் கால நுணுக்கத்தைச் சேர்ப்பதாகவோ இருக்கும்; தொடர்ச்சியை வாக்கிய அமைப்பே இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: நோன்புக்குப் பின் இயேசுவின் உண்மையான மனிதப் பசி
  choice: அவருக்குப் பசியுண்டாயிற்று
  alternative: அவர் பசியாயிருந்தார்
  rationale: மூல வினை வெளிப்படுத்தும் பசி ஏற்பட்ட நிலையைத் தெளிவாகக் காக்கிறது; அதேவேளையில் வசனம் கூறுவதைக் கடந்து கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பும் கண்ணியமும் கொண்ட நடை. ‘நோன்பு’ மதச்சூழலுக்கேற்ற பொதுவான சொல்; ‘பசியுண்டாயிற்று’ மூலத்தின் நிகழ்வுநிலையைப் பாதுகாக்கிறது.
