  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கதையுரை நடை பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்கள் பரவலாக அறியப்பட்ட தமிழ் வடிவங்களில் தரப்பட்டுள்ளன; மூலத்தின் தொடர்ச்சியான புவியியல் பட்டியல் தமிழின் ‘-உம்’ அமைப்பால் தக்கவைக்கப்பட்டுள்ளது.
