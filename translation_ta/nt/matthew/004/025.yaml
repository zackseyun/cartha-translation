source:
  edition: SBLGNT
  text: καὶ ἠκολούθησαν αὐτῷ ὄχλοι πολλοὶ ἀπὸ τῆς Γαλιλαίας καὶ Δεκαπόλεως καὶ Ἱεροσολύμων καὶ Ἰουδαίας καὶ πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/025.yaml
  text: And large crowds followed him from Galilee and the Decapolis and Jerusalem and Judea and beyond the Jordan[a].
translation:
  language: ta
  text: கலிலேயாவிலிருந்தும், தெக்கப்போலியிலிருந்தும், எருசலேமிலிருந்தும், யூதேயாவிலிருந்தும், யோர்தானுக்கு அப்பாலிருந்தும்[a] பெருந்திரளான மக்கள் அவரைப் பின்தொடர்ந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யோர்தானுக்கு அக்கரையிலிருந்தும்.”
    reason: πέραν τοῦ Ἰορδάνου என்பதிலுள்ள ‘அப்பால்/அக்கரை’ என்ற இடவியல் பொருளுக்கான இயல்பான மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: ἠκολούθησαν
  choice: பின்தொடர்ந்தார்கள்
  rationale: ἀκολουθέω என்பதன் கதையோட்டத்திற்கேற்ற இயல்பான தமிழ் வடிவம். உடலளவில் பின்னால் சென்றதையும் சீடத்துவ ஆர்வம் தோன்றியிருக்கக்கூடிய நுண்சாயலையும் தக்கவைக்கிறது; முழுமையான சீடத்துவ அர்ப்பணிப்பை தேவையின்றி வலியுறுத்தவில்லை.
- source_word: ὄχλοι πολλοὶ
  choice: பெருந்திரளான மக்கள்
  rationale: பலரும் பெரிய எண்ணிக்கையிலும் கூடியிருந்ததை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; சொல்லுக்குச் சொல் அமைந்த இயல்பற்ற ‘பல கூட்டங்கள்’ என்பதைத் தவிர்க்கிறது.
- source_word: ἀπὸ
  choice: -இலிருந்தும்
  rationale: மக்கள் வந்த இடம் அல்லது தொடக்கப் பகுதியைக் குறிக்கும் ἀπό-வின் பொருளை ஒவ்வொரு இடப்பெயருடனும் தமிழுக்கேற்ற இணைப்புவிகுதியால் வெளிப்படுத்துகிறது.
- source_word: Γαλιλαίας
  choice: கலிலேயா
  rationale: இப்பகுதிப் பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: Δεκαπόλεως
  choice: தெக்கப்போலி
  rationale: ‘பத்து நகரங்கள்’ அடங்கியதாக அறியப்பட்ட பகுதியின் பெயருக்கான தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு; மொழிபெயர்த்து விளக்குவதற்குப் பதிலாக இடப்பெயராகவே வைக்கப்பட்டுள்ளது.
- source_word: Ἱεροσολύμων
  choice: எருசலேம்
  rationale: நகரப் பெயரின் தமிழில் பரவலாகப் பயன்படும் வடிவம்; கிரேக்க இலக்கண வடிவின் பன்மைத் தோற்றத்தை தமிழில் செயற்கையாகப் பிரதிபலிக்கவில்லை.
- source_word: Ἰουδαίας
  choice: யூதேயா
  rationale: இப்பகுதிப் பெயருக்கான தெளிவான, பரவலாக அறியப்படும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: யோர்தானுக்கு அப்பாலிருந்தும்
  rationale: யோர்தான் ஆற்றுக்கு அப்பால் அல்லது மறுபுறம் உள்ள பகுதியைக் குறிக்கும் இடவியல் பொருளைத் தக்கவைக்கிறது. முன் வரும் ἀπό முழுப் பட்டியலையும் ஆளுவதால், தமிழில் வரும் இடத்தைக் குறிக்கும் ‘இருந்தும்’ சேர்க்கப்பட்டுள்ளது.
- source_word: καὶ ... καὶ ... καὶ
  choice: -உம் ... -உம் ... -உம்
  rationale: தொடர்ச்சியாக வரும் καί இணைப்புகளைத் தமிழின் கூட்டிணைப்பு விகுதியால் பிரதிபலித்து, பல பகுதிகளிலிருந்தும் மக்கள் திரண்ட பரப்பை உணர்த்துகிறது.
