id: MAT.4.9
reference: Matthew 4:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ⸀εἶπεν αὐτῷ· Ταῦτά ⸂σοι πάντα⸃ δώσω, ἐὰν πεσὼν προσκυνήσῃς μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/009.yaml
  text: And he said to him[a], “I will give you all these things, if you fall down and worship me.”
translation:
  language: ta
  text: அவன் அவரிடம், “நீர் விழுந்து என்னை வணங்கினால்[a], இவை அனைத்தையும் உமக்குத் தருவேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “எனக்குத் தலைவணங்கினால்,” அல்லது “எனக்குப் பணிந்து மரியாதை செலுத்தினால்.” கிரேக்க வினை தரையில் விழுந்து வணங்குவதையோ ஒருவருக்கு மரியாதை செலுத்துவதையோ குறிக்கலாம்; ஆனால் இங்கு சூழல் “வணங்குதல்” என்ற பொருளை ஆதரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῷ
  choice: அவன் அவரிடம் … என்றான்
  rationale: கிரேக்கத்தில் பெயர்கள் சேர்க்கப்படாமல் சுட்டுப்பெயர்கள் மட்டுமே உள்ளன. தமிழின் இயல்பான உரையாடல் அமைப்புக்கேற்ப ‘என்றான்’ வாக்கியத்தின் முடிவில் வைக்கப்பட்டுள்ளது; καί இங்கு தொடர்ச்சியைச் சுட்டுவதால் தனியாக ‘மேலும்’ என்று மொழிபெயர்க்க வேண்டியதில்லை.
- source_word: Ταῦτά σοι πάντα δώσω
  choice: இவை அனைத்தையும் உமக்குத் தருவேன்
  rationale: Ταῦτα என்பதன் பன்மையையும் πάντα என்பதன் முழுமையான பொருளையும் காக்கிறது; எதிர்கால வாக்குறுதி அல்லது முன்வைப்பை δώσω என்பதற்கேற்ப நேரடியாகத் தெரிவிக்கிறது.
- source_word: ἐὰν πεσὼν
  choice: நீர் விழுந்து … வணங்கினால்
  rationale: ἐάν நிபந்தனையைத் தெரிவிக்கிறது. πεσών உடலால் விழுந்து அல்லது தாழ்ந்து செய்யும் செயலைக் குறிக்கும்; ‘விழுந்து’ என்ற சொல் அந்தத் தெளிவான உடல் இயக்கத்தை மேலதிக விளக்கமின்றிக் காக்கிறது.
- source_word: προσκυνήσῃς μοι
  choice: என்னை வணங்கினால்
  rationale: அடுத்த வசனத்தில் தேவனுக்கு மட்டுமே உரிய வழிபாடு வலியுறுத்தப்படுவதால், இச்சூழலில் ‘வணங்கு’ என்பது கோரிக்கையின் சமய மற்றும் இறையியல் தீவிரத்தை இயல்பாகத் தருகிறது. சொல்லின் பிற சாத்தியமான பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: சாத்தான் இயேசுவிடம் கோரும் προσκυνέω செயலை எவ்வாறு மொழிபெயர்ப்பது
  choice: என்னை வணங்கினால்
  alternative: எனக்குத் தலைவணங்கினால்; எனக்குப் பணிந்து மரியாதை செலுத்தினால்
  rationale: உடனடி சோதனைச் சூழலும் அடுத்த வசனத்தில் தேவனையே வணங்க வேண்டும் என்ற பதிலும் இங்கு வெறும் அரசியல் மரியாதையைவிட வழிபாட்டைக் குறிக்கின்றன. அதேவேளை, கிரேக்க வினையின் விரிந்த பொருள் வரம்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் மூலத்தில் இல்லாததால் சேர்க்கப்படவில்லை. இயேசுவை நோக்கிய ஒருமைச் சுட்டுகள் தமிழின் மரியாதை நடைக்கேற்ப ‘நீர்/உமக்கு’ என்றும், உரையாடலுக்கு வெளியே ‘அவர்’ என்றும் வழங்கப்பட்டுள்ளன.
