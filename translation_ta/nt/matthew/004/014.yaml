id: MAT.4.14
reference: Matthew 4:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἵνα πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/014.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled, saying:'
translation:
  language: ta
  text: 'தீர்க்கதரிசியான ஏசாயா மூலம் சொல்லப்பட்டவை நிறைவேறும்படி, அவர் கூறியதாவது:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: நிறைவேறும்படி
  rationale: நோக்கம் அல்லது விளைவைச் சுட்டும் ἵνα என்பதன் வலிமையை இயல்பான தமிழில் காக்கிறது; வாக்கியத் தொடர்ச்சிக்காக ‘இது நடந்தது’ என்பது சூழலிலிருந்து நிரப்பப்பட்டுள்ளது.
- source_word: πληρωθῇ
  choice: நிறைவேறும்படி
  rationale: πληρόω என்பதன் இறந்தகாலச் செயல்பாட்டு வடிவமும் ἵνα சார்ந்த subjunctive நுணுக்கமும் தமிழில் இந்த அமைப்பால் இயல்பாக வெளிப்படுகின்றன; வேதவாக்கு நிறைவேறுதல் என்ற மத்தேயுவின் கருப்பொருளையும் காக்கிறது.
- source_word: τὸ ῥηθὲν
  choice: சொல்லப்பட்டது
  rationale: பெயர்ச்சொல் போல் செயல்படும் இறந்தகாலச் செயப்பாட்டு வினையெச்சத்தைச் சுருக்கமாகவும் இயல்பாகவும் அளிக்கிறது.
- source_word: διὰ
  choice: மூலம்
  rationale: ஏசாயா செய்தியைத் தரும் இடைநிலையாளராக இருப்பதைத் தெளிவாகக் காட்டுகிறது; வெறுமனே ‘ஏசாயாவால்’ என்பதைக் காட்டிலும் கிரேக்கத்தின் mediated agency நுணுக்கத்தை நன்றாகப் பேணுகிறது.
- source_word: Ἠσαΐου
  choice: ஏசாயா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள தீர்க்கதரிசியின் பெயர் வடிவம்.
- source_word: τοῦ προφήτου
  choice: இறைவாக்கினரான
  rationale: ஏசாயாவின் பங்கை அடையாளப்படுத்தும் appositional அமைப்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: λέγοντος
  choice: '[அடுத்த வசனத்தில் மேற்கோள் தொடர்கிறது]'
  rationale: நேரடி மேற்கோளை அறிமுகப்படுத்தும் participle. தனி வசனமாக வாசிக்கும்போது தமிழில் ‘என்று அவர் சொன்னதாவது’ என நீட்டிப்பது மூலத்தின் ‘மூலம் சொல்லப்பட்டது ... சொல்லுவது’ என்ற அமைப்பைச் சுமையாக மாற்றும்; ஆகவே மேற்கோள் தொடர்வதை நிறுத்தக்குறியும் அடிக்குறிப்பும் தெரிவிக்கின்றன.
theological_decisions:
- issue: மத்தேயுவின் நிறைவேறுதல் வாய்பாடு
  choice: ‘நிறைவேறும்படி’ என்று மொழிபெயர்த்து வேதவாக்கு நிறைவேறுதல் என்ற கருத்தைத் தெளிவாகப் பேணுதல்
  alternative: ‘உண்மையாயிற்று’ அல்லது ‘நடந்தேறியது’
  rationale: ‘நிறைவேறு’ என்பது πληρόω-வின் வேதவாக்கு சார்ந்த இடைஉரை மற்றும் இறையியல் வலிமையைப் பாதுகாக்கிறது; அதன் பொருளை விளக்கி விரிவாக்குவதில்லை.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ். ‘தீர்க்கதரிசி’ என்பதற்குப் பதில் பொதுவாசகருக்கு நேரடியாகப் புரியும் ‘இறைவாக்கினர்’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் துணை வாக்கியம் முந்தைய வசனத்தைச் சார்ந்திருப்பதால், தனியாகவும் இயல்பாக வாசிக்க ‘இது நடந்தது’ சூழலறிந்த நிரப்பலாகச் சேர்க்கப்பட்டுள்ளது.
