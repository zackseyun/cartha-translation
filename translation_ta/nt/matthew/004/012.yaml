review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the temporal aorist participle, the implicit subject as Jesus, the broad passive force of παρεδόθη, and Jesus’ withdrawal to Galilee. The footnote appropriately preserves the contextually narrower sense “was arrested.”
  naturalness: The sentence is understandable, but “ஒப்புக்கொடுக்கப்பட்டார்” is less idiomatic here and can suggest that John himself consented or surrendered. “ஒப்படைக்கப்பட்டார்” is the natural modern Tamil passive for “was handed over.” Recasting the participial opening with “கேள்விப்பட்டபோது” more clearly expresses the source’s temporal relationship.
  terminology: “யோவான்,” “இயேசு,” and “கலிலேயா” are suitable established Tamil biblical name forms. “ஒப்படைக்கப்பட்டார்” preserves the lexical breadth and Matthean resonance of παραδίδωμι without prematurely reducing it to arrest. “விலகிச் சென்றார்” fittingly conveys ἀνεχώρησεν.
  issues:
  - severity: medium
    issue: ஒப்புக்கொடுக்கப்பட்டார்
    rationale: In modern Tamil this wording is less natural for a person being delivered into others’ custody and may carry an unintended nuance of self-surrender. “ஒப்படைக்கப்பட்டார்” better conveys the Greek passive while retaining its breadth.
  - severity: low
    issue: கேள்விப்பட்ட இயேசு
    rationale: This is grammatical, but “இயேசு கேள்விப்பட்டபோது” explicitly and naturally represents the temporal participle Ἀκούσας.
  - severity: low
    issue: கைதுசெய்யப்பட்டார்
    rationale: 'Modern standard Tamil normally writes this as two words: “கைது செய்யப்பட்டார்.”'
  revised_text: யோவான் ஒப்படைக்கப்பட்டார்[a] என்று இயேசு கேள்விப்பட்டபோது, அவர் கலிலேயாவுக்கு விலகிச் சென்றார்.
  revised_footnotes:
