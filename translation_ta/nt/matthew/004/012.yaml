revisions:
- from: யோவான் ஒப்புக்கொடுக்கப்பட்டார்[a] என்று கேள்விப்பட்ட இயேசு, கலிலேயாவுக்கு விலகிச் சென்றார்.
  to: யோவான் ஒப்படைக்கப்பட்டார்[a] என்று இயேசு கேள்விப்பட்டபோது, அவர் கலிலேயாவுக்கு விலகிச் சென்றார்.
  rationale: The revision replaces a potentially misleading and less idiomatic passive with the standard Tamil expression “ஒப்படைக்கப்பட்டார்,” while maintaining the source text’s broader “handed over” sense. It also makes the temporal relation of the Greek aorist participle explicit in fluent modern Tamil and regularizes the alternative rendering’s spelling.
