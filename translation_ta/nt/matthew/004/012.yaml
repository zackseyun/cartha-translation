  text: Ἀκούσας ⸀δὲ ὅτι Ἰωάννης παρεδόθη ἀνεχώρησεν εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/012.yaml
  text: When he heard that John had been handed over[a], he withdrew into Galilee.
translation:
  language: ta
  text: யோவான் ஒப்படைக்கப்பட்டார்[a] என்று இயேசு கேள்விப்பட்டபோது, அவர் கலிலேயாவுக்கு விலகிச் சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இச்சூழலில் இன்னும் குறிப்பாக, “கைது செய்யப்பட்டார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας
  choice: கேள்விப்பட்ட
  rationale: இறந்தகால வினையெச்சத்தின் காலத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது; முதன்மை வினைக்கு முன் இயேசு செய்ததைக் குறிக்கிறது.
- source_word: δὲ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது வலுவான எதிர்மறை இணைப்பல்ல; மென்மையான கதைத் தொடர்ச்சியைக் குறிக்கிறது. தமிழில் தனிச் சொல்லைச் சேர்க்காமல் வாக்கியத் தொடரால் அந்தப் பணி இயல்பாக நிறைவேறுகிறது.
- source_word: Ἰωάννης
  choice: யோவான்
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் நிலைபெற்ற பெயர் வடிவம்.
- source_word: παρεδόθη
  choice: ஒப்புக்கொடுக்கப்பட்டார்
  rationale: παραδίδωμι என்பதன் விரிவான ‘ஒருவரின் அதிகாரத்தில் ஒப்படைக்கப்படுதல்’ என்ற பொருளைப் பாதுகாக்கிறது; சூழல் காட்டும் ‘கைதுசெய்யப்பட்டார்’ என்ற குறிப்பான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀνεχώρησεν
  choice: விலகிச் சென்றார்
  rationale: சூழ்நிலைக்குப் பதிலாக ஓர் இடத்திலிருந்து விலகிச் செல்லும் நுணுக்கத்தைத் தருகிறது; ‘தப்பியோடினார்’ போன்ற காரணத்தை மிகைப்படுத்துவதில்லை.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: கலிலேயாவுக்கு
  rationale: இலக்கை நோக்கிய இயக்கத்தைக் குறிக்கும் εἰς என்பதற்கு இயல்பான நவீனத் தமிழ் வடிவம்.
theological_decisions:
- issue: யோவானைப் பற்றிய παραδίδωμι என்பதன் மொழிபெயர்ப்பு
  choice: ஒப்புக்கொடுக்கப்பட்டார்
  alternative: கைதுசெய்யப்பட்டார்
  rationale: மூல வினைச்சொல் கைது என்ற குறிப்பான நிகழ்வைவிட விரிவானது; மத்தேயுவில் ‘ஒப்புக்கொடுக்கப்படுதல்’ என்ற மீளும் சொல்லாட்சியையும் இது பாதுகாக்கிறது. எனினும் இச்சூழலில் கைது என்பதே நிகழ்வின் குறிப்பான பொருளாக இருக்கலாம் என்பதால் அது அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. கிரேக்கத்தில் எழுவாய் சூழலிலிருந்து புரிந்துகொள்ளப்பட்டாலும், தமிழில் தெளிவுக்காக ‘இயேசு’ என்று வெளிப்படையாகக் குறிப்பிடப்பட்டுள்ளது. ‘விலகிச் சென்றார்’ என்பது இயக்கத்தையும் சூழ்நிலைக்கு எதிர்வினையாக விலகியதையும் இயல்பாக இணைக்கிறது.
