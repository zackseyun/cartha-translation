id: MAT.4.24
reference: Matthew 4:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἀπῆλθεν ἡ ἀκοὴ αὐτοῦ εἰς ὅλην τὴν Συρίαν· καὶ προσήνεγκαν αὐτῷ πάντας τοὺς κακῶς ἔχοντας ποικίλαις νόσοις καὶ βασάνοις ⸀συνεχομένους, δαιμονιζομένους καὶ σεληνιαζομένους καὶ παραλυτικούς, καὶ ἐθεράπευσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/024.yaml
  text: And the report about him went out into all Syria[a], and they brought to him all who were sick, afflicted with various diseases and torments, those oppressed by demons, those having seizures, and paralytics[c][b], and he healed them.
translation:
  language: ta
  text: அவரைப் பற்றிய செய்தி சீரியா முழுவதும் பரவியது. பலவகையான நோய்களாலும் வேதனைகளாலும் துன்புற்றவர்கள், பேய்களால் ஆட்கொள்ளப்பட்டவர்களையும்[a], வலிப்பு ஏற்பட்டவர்களையும்[b], முடங்கியவர்களையும் என எல்லா நோயாளிகளையும் அவரிடம் கொண்டுவந்தார்கள்; அவர் அவர்களைக் குணமாக்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பேய் பிடித்தவர்களையும்” அல்லது “பேய்களால் துன்புறுத்தப்பட்டவர்களையும்.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கச் சொல் சொற்படி சந்திரனால் பாதிக்கப்படுவதாகக் கருதப்பட்டவர்களைக் குறிக்கிறது; பாரம்பரியமாக இது “வலிப்புநோயாளிகள்” என்று மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκοὴ
  choice: செய்தி
  rationale: இங்கு கேட்டல் என்ற புலனை அல்ல, இயேசுவைப் பற்றிப் பரவிய செய்தியைக் குறிக்கிறது.
- source_word: ἀπῆλθεν
  choice: பரவியது
  rationale: கிரேக்கத்தின் இயக்க உருவகத்தை இயல்பான நவீன தமிழில் செய்தி பரவுதல் எனத் தெரிவிக்கிறது.
- source_word: Συρίαν
  choice: சீரியா
  rationale: பிரதேசப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: κακῶς ἔχοντας
  choice: நோயாளிகள்
  rationale: உடல்நலம் குன்றியவர்களைக் குறிக்கும் கிரேக்க மரபுத்தொடரைத் தெளிவாக வழங்குகிறது.
- source_word: ποικίλαις νόσοις καὶ βασάνοις συνεχομένους
  choice: பலவகையான நோய்களாலும் வேதனைகளாலும் வருந்திய
  rationale: நோய்களின் பல்வகைமையையும் கடுமையான துன்பத்தையும் தெரிவிக்கிறது; συνεχομένους என்பதன் அழுத்தத்தை இயல்பான தமிழில் வருந்திய எனக் கொடுக்கிறது.
- source_word: δαιμονιζομένους
  choice: பேய்களால் ஆட்கொள்ளப்பட்டவர்கள்
  rationale: அமானுஷ்யத் துன்புறுத்தலை மறுக்காமல், கிரேக்கம் கட்டாயப்படுத்தாத மிகக் குறுகிய தொழில்நுட்ப வகைப்பாட்டையும் திணிக்காமல் வழங்குகிறது.
- source_word: σεληνιαζομένους
  choice: வலிப்புநோய் ஏற்பட்டவர்கள்
  rationale: சந்திரனுடன் சொற்பிறப்பியல் தொடர்புடைய சொல்லின் சூழல்சார் நோய்க்குறிப்பை இன்றைய வாசகருக்குத் தெளிவாகக் கொடுக்கிறது; பழங்கால காரணவிளக்கத்தை மொழிபெயர்ப்பு உறுதிப்படுத்தவில்லை.
- source_word: παραλυτικούς
  choice: முடக்குவாதமுற்றவர்கள்
  rationale: உடல் உறுப்புகள் செயலிழந்து முடங்கியவர்களைக் குறிக்கும் சொல்லுக்கு இயல்பான தமிழ்.
- source_word: ἐθεράπευσεν
  choice: குணமாக்கினார்
  rationale: இச்சூழலில் θεραπεύω என்பதன் நேரடியான பொருளைத் தருகிறது.
theological_decisions:
- issue: δαιμονιζομένους என்பதன் வலிமை மற்றும் வரம்பு
  choice: பேய்களால் ஆட்கொள்ளப்பட்டவர்கள்
  alternative: பேய் பிடித்தவர்கள்; பேய்களால் துன்புறுத்தப்பட்டவர்கள்
  rationale: பேய்களின் உண்மையான செயல்பாட்டை மறைக்காமல் தெரிவிக்கிறது; அதேவேளை நவீன தொழில்நுட்பப் பிரிவைத் தேவையின்றித் திணிப்பதில்லை. மாற்று மொழியாக்கங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- issue: σεληνιαζομένους என்பதிலுள்ள சந்திரத் தொடர்பை எவ்வாறு கையாளுவது
  choice: வலிப்புநோய் ஏற்பட்டவர்கள்
  alternative: சந்திரனால் பாதிக்கப்பட்டவர்கள்; வலிப்பு ஏற்பட்டவர்கள்
  rationale: இன்றைய வாசகருக்குப் புரியும் நோய்நிலையை முதன்மைப்படுத்துகிறது; கிரேக்கச் சொல்லின் சொற்பிறப்பியல் தொடர்பை அடிக்குறிப்பில் வைத்துப் பழங்காலக் காரணக்கருத்தை வேதாகமத்தின் மருத்துவத் தீர்ப்பாக மாற்றாமல் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான வேதாகம நடையைப் பேணும் மொழியாக்கம். நீண்ட கிரேக்க வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாக அமைக்கப்பட்டுள்ளது. பட்டியலின் இலக்கணத் தொடர்பு இயல்பான இணைப்புகளால் பாதுகாக்கப்பட்டுள்ளது.
