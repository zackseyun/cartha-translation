source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Πάλιν γέγραπται· Οὐκ ἐκπειράσεις κύριον τὸν θεόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/007.yaml
  text: 'Jesus said to him[b][a], “Again it is written: ‘You shall not put the Lord your God to the test.’”'
translation:
  language: ta
  text: இயேசு அவனிடம், “மீண்டும், ‘உன் கடவுளாகிய ஆண்டவரைச் சோதித்துப் பார்க்காதே[a]’ என்று எழுதப்பட்டிருக்கிறது[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் கடவுளாகிய ஆண்டவரைச் சோதிக்காதே.” ἐκπειράζω என்ற கிரேக்க வினைச்சொல்லை “சோதித்துப் பார்” அல்லது எளிமையாக “சோதி” என்று மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இது உபாகமம் 6:16-ஐ மேற்கோள் காட்டுகிறது. இங்குள்ள “ஆண்டவர்” என்பது செப்துவஜிந்தில் இறைவனின் பெயருக்குப் பதிலாகப் பயன்படுத்தப்பட்ட சொல்லைப் பிரதிபலிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: இயேசு அவனிடம் … என்றார்
  rationale: தமிழ் உரையாடல் நடைக்கு இயல்பாக, பேச்சாளரை முதலில் குறிப்பிட்டு, பேச்சு அறிமுக வினையை மேற்கோளுக்குப் பின் அமைக்கிறது; கிரேக்கத்தின் எளிய பேச்சு அறிமுகப் பொருளைப் பாதுகாக்கிறது.
- source_word: Πάλιν
  choice: மேலும்
  rationale: இங்கு முந்தைய வேத மேற்கோளுக்குப் பதிலாக இன்னொரு வேத மேற்கோளை இயேசு முன்வைக்கிறார். ‘மேலும்’ என்பது இதை இயல்பாகத் தெரிவிக்கிறது; ‘மறுபடியும்’ என்பதால் அதே சொற்கள் மீண்டும் எழுதப்பட்டுள்ளன என்ற தவறான எண்ணம் ஏற்படலாம்.
- source_word: γέγραπται
  choice: என்று எழுதப்பட்டிருக்கிறது
  rationale: நிறைவேற்றப்பட்ட செயலும் அதன் தொடரும் நிலையும் அடங்கிய perfect passive வடிவத்தையும், வேத மேற்கோட்டுக்குரிய வழக்கமான சூத்திரத்தையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: Οὐκ ἐκπειράσεις
  choice: சோதித்துப் பார்க்காதே
  rationale: எதிர்கால வடிவில் அமைந்த தடைக் கட்டளையின் வலிமையையும், ἐκπειράζω என்பதிலுள்ள ஒருவரைச் சோதனைக்கு உட்படுத்திப் பார்க்கும் நுண்பொருளையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: κύριον τὸν θεόν σου
  choice: உன் கடவுளாகிய ஆண்டவரை
  rationale: κύριος என்பதற்கு ‘ஆண்டவர்’ என்றும் θεός என்பதற்கு ‘கடவுள்’ என்றும் வழங்கி, ‘உன் கடவுளாகிய’ என்ற தமிழ் இணைப்பால் இரண்டும் ஒரே நபரைக் குறிக்கும் appositional உறவைத் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: இஸ்ரவேலின் கடவுளைக் குறிக்கும் வேத மேற்கோளில் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: யெகோவா / கர்த்தர்
  rationale: உடனடி மூல உரை எபிரெய தெய்வீகப் பெயர் அல்ல, κύριος என்று வாசிக்கும் கிரேக்க உரையாகும். ஆகவே குறிப்பிட்ட உச்சரிப்பையோ மரபுசார் தனிப்பெயரையோ சேர்க்காமல் ‘ஆண்டவர்’ என்று மொழிபெயர்க்கப்படுகிறது; அதன் பழைய ஏற்பாட்டு பின்னணி அடிக்குறிப்பில் சுட்டப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேத மேற்கோளுக்குரிய செறிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘உன் கடவுளாகிய ஆண்டவர்’ என்பது இயல்பான தமிழ் இறையியல் சொற்றொடராகவும், மூலத்தின் இலக்கண உறவைத் தெளிவாகக் காட்டுவதாகவும் உள்ளது.
