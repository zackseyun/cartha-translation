id: MAT.4.1
reference: Matthew 4:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τότε ὁ Ἰησοῦς ἀνήχθη εἰς τὴν ἔρημον ὑπὸ τοῦ πνεύματος, πειρασθῆναι ὑπὸ τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/001.yaml
  text: Then Jesus was led up into the wilderness by the Spirit to be tempted by the devil[a].
translation:
  language: ta
  text: அப்போது இயேசு, பிசாசினால் சோதிக்கப்படுவதற்காக ஆவியானவரால் மேலே வனாந்தரத்துக்கு அழைத்துச் செல்லப்பட்டார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கே “சோதிக்கப்படுதல்” என்பதற்கான கிரேக்க வினைச்சொல், “தீமைக்குத் தூண்டப்படுதல்” அல்லது “பரிசோதிக்கப்படுதல்” என்றும் பொருள்படலாம்; ஆனால் இங்குள்ள உடனடிச் சூழல் “தீமைக்குத் தூண்டப்படுதல்” என்ற பொருளை முன்னிலைப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: அப்போது
  rationale: அடுத்த நிகழ்வை காலவரிசையில் அறிமுகப்படுத்தும் இயல்பான தமிழ் இணைப்புச் சொல்.
- source_word: ἀνήχθη
  choice: அழைத்துச் செல்லப்பட்டார்
  rationale: இறைவாக்கியத்தின் செயப்பாட்டு வடிவத்தையும் வழிநடத்திச் செல்லப்பட்டார் என்ற பொருளையும் இயல்பான தமிழில் காக்கிறது. கிரேக்கச் சொல்லிலுள்ள மேல்நோக்கிய இயக்க நுணுக்கத்தை ‘மேலே’ என்று வெளிப்படையாகச் சேர்ப்பது தமிழில் இடத்தை அளவுக்கு மீறிக் குறிப்பதாக அமையும்.
- source_word: εἰς τὴν ἔρημον
  choice: வனாந்தரத்துக்கு
  rationale: மக்கள் குடியிராத வறண்ட அல்லது பாழான பகுதியைக் குறிக்கும் பரந்த, மரியாதையான, வாசகர்களுக்கு அறிமுகமான சொல்; நிலவகையைத் தேவையின்றி மிகத் துல்லியமாக்குவதில்லை.
- source_word: ὑπὸ τοῦ πνεύματος
  choice: ஆவியானவரால்
  rationale: முந்தைய திருமுழுக்கு நிகழ்வில் குறிப்பிடப்பட்ட கடவுளுடைய ஆவியே இங்கு செயற்படும் நபர் என்பதைச் சூழல் காட்டுகிறது. ‘பரிசுத்த’ என்பதை மூலத்தில் இல்லாமல் சேர்க்காமல், தனிப்பட்ட தெய்வீக முகவரைக் குறிக்கிறது.
- source_word: πειρασθῆναι
  choice: சோதிக்கப்படுவதற்காக
  rationale: தமிழில் ‘சோதித்தல்’ என்பது தீமைக்குத் தூண்டும் சோதனை மற்றும் ஒருவரை நிரூபிக்கும் பரிசோதனை ஆகிய இரு நுணுக்கங்களையும் தாங்க முடியும். பிசாசு செய்பவனாக இருப்பதால் உடனடிச் சூழலில் தீமைக்குத் தூண்டும் பொருள் முன்னிலையாகிறது; விரிந்த பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: பிசாசினால்
  rationale: இச்சூழலில் தனிப்பட்ட எதிரியைக் குறிக்கும் διάβολος என்பதற்கான தெளிவான, வழக்கமான தமிழ் பெயர்.
theological_decisions:
- issue: τοῦ πνεύματος என்பவரின் அடையாளம்
  choice: கடவுளுடைய ஆவியைக் குறிக்கும் ‘ஆவியானவர்’
  alternative: ஒரு ஆவி அல்லது இயேசுவின் மனித ஆவி
  rationale: இதற்கு முந்தைய திருமுழுக்கு நிகழ்வில் இயேசுவின்மேல் இறங்கிய ஆவியோடு உள்ள உடனடி இலக்கியத் தொடர்பு, கடவுளுடைய ஆவியையே குறிக்கிறது. எனினும் மூலத்தில் இல்லாத ‘பரிசுத்த’ என்ற சொல்லை வசனத்தில் சேர்க்கவில்லை.
- issue: πειρασθῆναι என்பதின் பொருள்
  choice: சோதிக்கப்படுவதற்காக
  alternative: பரிசோதிக்கப்படுவதற்காக
  rationale: பிசாசும் தொடர்ந்து வரும் தீமைக்கான தூண்டுதல்களும் ‘tempt’ என்ற பொருளை முன்னிலைப்படுத்துகின்றன. அதேவேளை கிரேக்க வினைச்சொல்லின் ‘test’ என்ற நுணுக்கத்தை அழிக்காமல் அடிக்குறிப்பில் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வனாந்தரம்’ மற்றும் ‘ஆவியானவர்’ ஆகியவை பொதுவாசகர்களுக்குப் புரியக்கூடிய வேதாகமச் சூழல் சொற்களாக வைக்கப்பட்டுள்ளன; வாக்கிய அமைப்பு தேவையற்ற தொன்மையின்றி மூலத்தின் செயப்பாட்டு உறவுகளைப் பாதுகாக்கிறது.
