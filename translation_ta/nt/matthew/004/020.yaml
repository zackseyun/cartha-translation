id: MAT.4.20
reference: Matthew 4:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἱ δὲ εὐθέως ἀφέντες τὰ δίκτυα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/020.yaml
  text: And they immediately left the nets and followed him.
translation:
  language: ta
  text: அவர்கள் உடனே வலைகளை விட்டுவிட்டு அவரைப் பின்பற்றினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: அவர்கள்
  rationale: δέ இங்கு கதையை முன்னெடுத்துச் செல்லும் மென்மையான இணைப்புச்சொல். தமிழில் தனியாக ‘அப்போது’ அல்லது ‘மேலும்’ சேர்ப்பதைவிட, எழுவாயுடன் நேரடியாகத் தொடங்குவது இயல்பாகவும் அதன் தொடர்ச்சிப் பண்பைச் சூழலில் தக்கவைத்தும் உள்ளது.
- source_word: εὐθέως
  choice: உடனே
  rationale: அவர்களின் பதிலில் இருந்த தாமதமின்மையையும் விரைவையும் இயல்பான நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἀφέντες
  choice: விட்டுவிட்டு
  rationale: இறந்தகால வினையெச்சம் பிரதான வினைக்கு முந்திய செயலைக் குறிக்கிறது. ‘விட்டுவிட்டு’ என்பது அவர்கள் முதலில் வலைகளை விட்டதையும் பின்னர் பின்பற்றியதையும் இயல்பாகக் காட்டுகிறது; ‘கைவிட்டு’ என்பது தேவையற்ற அளவு வலுவான நிரந்தரத் துறப்பை உணர்த்தக்கூடும்.
- source_word: τὰ δίκτυα
  choice: வலைகளை
  rationale: சூழலில் இவை மீன்பிடி வலைகள் என்பது தெளிவு. கிரேக்க உரையில் இல்லாத உடைமைச் சொல்லைச் சேர்க்காமல் பொருளைத் துல்லியமாக வழங்குகிறது.
- source_word: ἠκολούθησαν αὐτῷ
  choice: அவரைப் பின்பற்றினார்கள்
  rationale: இது உடல்ரீதியாக அவருக்குப் பின்னால் சென்றதையும் சீடர்களாக இணைந்ததையும் உள்ளடக்கக்கூடிய இயல்பான தமிழாக்கம்; இரு நுணுக்கங்களையும் வெளிப்படையாக ஒன்றாக மட்டும் கட்டுப்படுத்தவில்லை.
theological_decisions:
- issue: ἠκολούθησαν αὐτῷ என்பதில் உள்ள சீடத்துவ நுணுக்கம்
  choice: அவரைப் பின்பற்றினார்கள்
  alternative: அவருக்குப் பின்னால் சென்றார்கள்
  rationale: ‘பின்பற்றினார்கள்’ என்பது நேரடியான நகர்வையும் நற்செய்தி நூலின் சூழலில் சீடத்துவ இணைப்பையும் தக்கவைக்கிறது. ‘சீடர்களானார்கள்’ என்று மொழிபெயர்ப்பது மூலத்தில் வெளிப்படையாகச் சொல்லப்படாததைச் சேர்த்து அதன் பொருள் பரப்பைக் குறைக்கும்.
translation_notes:
  register: இயல்பான, கண்ணியமான நவீனத் தமிழ். சுருக்கமான கிரேக்க வாக்கியத்தின் வேகமும் உடனடியான பதிலும் காக்கப்பட்டுள்ளன; விளக்க அடிக்குறிப்பு தேவையில்லை.
