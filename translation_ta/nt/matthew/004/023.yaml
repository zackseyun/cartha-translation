id: MAT.4.23
reference: Matthew 4:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ⸂ἐν ὅλῃ τῇ Γαλιλαίᾳ⸃, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν μαλακίαν ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/023.yaml
  text: And he went throughout all Galilee[a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness among the people.
translation:
  language: ta
  text: அவர் கலிலேயா முழுவதும் சுற்றிச் சென்று, அவர்களுடைய தொழுகைக்கூடங்களில் கற்பித்தார்; அரசாட்சியின் நற்செய்தியை[a] அறிவித்தார்; மக்களிடையே ஒவ்வொரு நோயையும் ஒவ்வொரு உடல்நலக் குறைவையும் குணமாக்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நற்செய்தி’ என்பதற்கு மரபாக ‘சுவிசேஷம்’ என்றும் மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιῆγεν
  choice: சுற்றிச் சென்று
  rationale: நிறைவுறா இறந்தகால வினை, அப்பகுதி முழுவதும் தொடர்ந்து இடம்விட்டு இடம் சென்றதைச் சுட்டுகிறது; ‘சுற்றிச் சென்று’ என்பது இயக்கத்தையும் தொடர்ச்சியான பயணத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν ὅλῃ τῇ Γαλιλαίᾳ
  choice: கலிலேயா முழுவதும்
  rationale: இயக்க வினையுடன் வரும் இச்சொற்றொடர், கலிலேயா பகுதி முழுவதிலும் நிகழ்ந்த பயணத்தின் பரப்பைச் சுட்டுகிறது.
- source_word: διδάσκων
  choice: கற்பித்தார்
  rationale: முதன்மை வினையுடன் ஒரே காலத்தில் நடைபெற்ற செயலைத் தமிழில் இயல்பான இணை வினையாக வழங்குகிறது.
- source_word: συναγωγαῖς αὐτῶν
  choice: அவர்களுடைய தொழுகைக்கூடங்களில்
  rationale: சυναγωγή என்பது இங்கு யூதர்கள் கூடிவந்து வழிபட்டு வேதம் கற்ற இடத்தைக் குறிக்கிறது; ‘தொழுகைக்கூடம்’ என்பது ‘ஆலயம்’ என்ற வேறு கருத்துடன் குழப்பாமல், αὐτῶν என்ற உடைமைச் சொல்லையும் காக்கிறது.
- source_word: κηρύσσων
  choice: அறிவித்தார்
  rationale: அதிகாரபூர்வமாகவும் பொதுவெளியிலும் செய்தியைப் பிரகடனப்படுத்தும் கருத்தை எளிய நவீன தமிழில் தெரிவிக்கிறது.
- source_word: τὸ εὐαγγέλιον
  choice: நற்செய்தி
  rationale: சொல்லின் அடிப்படைப் பொருளை நேரடியாகவும் பொதுவாசகர்களுக்குத் தெளிவாகவும் தருகிறது; மரபுச் சொல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: τῆς βασιλείας
  choice: அரசாட்சியின்
  rationale: மூலத்தின் உரிமை/தொடர்பு வேற்றுமையைத் தக்கவைத்து, நற்செய்தி அரசாட்சியால் வகைப்படுத்தப்படுவதையோ அதைப் பற்றியதாக இருப்பதையோ கட்டாயமாக ஒன்றாகத் தீர்மானிக்கவில்லை.
- source_word: θεραπεύων
  choice: குணமாக்கினார்
  rationale: இச்சூழலில் θεραπεύω உண்மையான குணப்படுத்துதலைக் குறிக்கிறது; தமிழில் செயப்படுபொருளுடன் இயல்பாக அமைகிறது.
- source_word: πᾶσαν νόσον
  choice: ஒவ்வொரு நோயையும்
  rationale: πᾶσαν என்பதன் முழுமையான பரப்பைத் தக்கவைத்து, அடுத்த பெயர்ச்சொல்லிலிருந்து வேறுபடுத்துகிறது.
- source_word: πᾶσαν μαλακίαν
  choice: ஒவ்வொரு உடல்நலக் குறைவையும்
  rationale: μαλακία என்பதிலுள்ள பலவீனம், பிணி, உடல் நலக்குறைவு ஆகிய பரந்த பொருள் வரம்பை இயல்பாகக் காட்டி, νόσος என்பதுடன் முழுமையாக ஒன்றாக்காமல் காக்கிறது.
- source_word: ἐν τῷ λαῷ
  choice: மக்களிடையே இருந்த
  rationale: குணமாக்குதல் மக்களிடையே நிகழ்ந்தது என்பதை இயல்பான தமிழில் செயப்படுபொருட்களுடன் இணைத்துக் காட்டுகிறது.
theological_decisions:
- issue: εὐαγγέλιον என்பதன் மொழிபெயர்ப்பு
  choice: நற்செய்தி
  alternative: சுவிசேஷம்
  rationale: ‘நற்செய்தி’ மூலச்சொல்லின் பொருளைத் தெளிவாகக் கொடுக்கிறது; திருச்சபை மரபில் நிலைபெற்ற மாற்றுச் சொல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: τῆς βασιλείας என்ற தொடர்பின் பொருள்
  choice: அரசாட்சியின் நற்செய்தி
  alternative: அரசாட்சியைப் பற்றிய நற்செய்தி
  rationale: மூலத்தின் இறுக்கமான தொடர்பைத் தக்கவைத்து, இது அரசாட்சியைப் பற்றிய செய்தி மட்டுமே என்று விளக்கி விடாமல் அதன் உண்மையான பொருள் நெகிழ்வை பாதுகாக்கிறது; ‘கடவுளுடைய’ என்று மூலத்தில் இல்லாத சொல்லும் சேர்க்கப்படவில்லை.
- issue: πᾶσαν νόσον καὶ πᾶσαν μαλακίαν என்பதன் பரப்பு
  choice: ஒவ்வொரு நோயையும் ஒவ்வொரு உடல்நலக் குறைவையும்
  alternative: எல்லா நோய்களையும் பிணிகளையும்
  rationale: இருமுறை வரும் πᾶσαν என்பதன் வலியுறுத்தலையும், νόσος மற்றும் μαλακία ஆகிய இரு சொற்களின் வேறுபாட்டையும் இயன்றவரை தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் தொடர்ச்சியான மூன்று பணிகள்—கற்பித்தல், அறிவித்தல், குணமாக்குதல்—தெளிவான இணை வாக்கியங்களாக வழங்கப்பட்டுள்ளன.
