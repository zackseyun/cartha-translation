translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரை. கிரேக்க வினையெச்சங்களின் நிகழ்வுவரிசை ‘விட்டுப் புறப்பட்டு ... வந்து ... குடியேறினார்’ எனப் பாதுகாக்கப்பட்டுள்ளது. ‘கடல்’ என்பது கலிலேயக் கடலைச் சுட்டும் மூலத்தின் பொதுப்பெயரையே பிரதிபலிக்கிறது; விளக்கப்பெயர் உரைக்குள் சேர்க்கப்படவில்லை.
