  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ καταλιπὼν τὴν Ναζαρὰ ἐλθὼν κατῴκησεν εἰς Καφαρναοὺμ τὴν παραθαλασσίαν ἐν ὁρίοις Ζαβουλὼν καὶ Νεφθαλίμ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/013.yaml
  text: And leaving Nazara[a], he came and settled in Capernaum by the sea, in the region of Zebulun and Naphtali.
translation:
  language: ta
  text: அவர் நாசராவை[a] விட்டு, கடலோரத்தில், செபுலோன் மற்றும் நப்தலியின் பகுதிகளில் அமைந்திருந்த கப்பர்நகூமுக்கு வந்து குடியேறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்க மூலத்தில் ‘நாசரா’; பல மொழிபெயர்ப்புகளில் ‘நாசரேத்’ என்று உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: καταλιπὼν
  choice: விட்டுப் புறப்பட்டு
  rationale: இறந்தகால வினையெச்சம் முதன்மை வினைக்கு முந்திய புறப்படுதலைக் குறிக்கிறது; இத்தமிழாக்கம் வெறுமனே விட்டுவிடுதல் அல்ல, ஓர் இடத்தைவிட்டுச் செல்லுதல் என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: Ναζαρὰ
  choice: நாசரா
  rationale: இவ்வசனத்தின் கிரேக்க வடிவமான Ναζαρά-வை நேரடியாகப் பிரதிபலிக்கிறது; பரிச்சயமான ‘நாசரேத்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐλθὼν
  choice: வந்து
  rationale: இறந்தகால வினையெச்சத்தைத் தமிழில் இயல்பான தொடர் வினையாகக் காட்டி, குடியேறுவதற்கு முன் வந்தடைந்த நிகழ்வைத் தெளிவுபடுத்துகிறது.
- source_word: κατῴκησεν
  choice: அங்கே குடியேறினார்
  rationale: κατοικέω இங்கு தங்குமிடத்தை ஏற்படுத்திக்கொண்டு வாழத் தொடங்கியதைக் குறிக்கிறது; ‘குடியேறினார்’ அந்த இயக்கப் பொருளைத் துல்லியமாகத் தருகிறது, ‘அங்கே’ என்பது தமிழில் இலக்கைத் தெளிவாக்குகிறது.
- source_word: Καφαρναοὺμ
  choice: கப்பர்நகூம்
  rationale: தமிழ் வேதாகம வழக்கில் அறியப்பட்ட, கிரேக்கப் பெயருடன் ஒத்த நிலையான பெயர்ப்பு.
- source_word: τὴν παραθαλασσίαν
  choice: கடலோரத்தில் ... இருந்த
  rationale: கப்பர்நகூமை விவரிக்கும் ‘கடலருகிலுள்ள’ என்ற பெயரடைத் தொடரை இயல்பான தமிழில் இடவியல் விளக்கமாக வழங்குகிறது.
- source_word: ἐν ὁρίοις
  choice: பகுதிகளில்
  rationale: ὅρια என்பது எல்லைகள், நிலப்பரப்புகள் அல்லது வட்டாரங்கள் எனப் பொருள்படலாம்; இங்கு செபுலோன், நப்தலியோடு தொடர்புடைய பரந்த நிலப்பகுதிகளைக் குறிக்கப் பன்மை வடிவம் பாதுகாக்கப்படுகிறது.
- source_word: Ζαβουλὼν
  choice: செபுலோன்
  rationale: தமிழ் வேதாகமப் பெயர்வழக்கில் பரிச்சயமான கோத்திர மற்றும் நிலப்பகுதிப் பெயர்.
- source_word: Νεφθαλίμ
  choice: நப்தலி
  rationale: தமிழ் வேதாகமப் பெயர்வழக்கில் பரிச்சயமான கோத்திர மற்றும் நிலப்பகுதிப் பெயர்.
