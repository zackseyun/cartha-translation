id: MAT.2.18
reference: Matthew 2:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Φωνὴ ἐν Ῥαμὰ ⸀ἠκούσθη, κλαυθμὸς καὶ ὀδυρμὸς πολύς· Ῥαχὴλ κλαίουσα τὰ τέκνα αὐτῆς, καὶ οὐκ ἤθελεν παρακληθῆναι ὅτι οὐκ εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/018.yaml
  text: 'A voice was heard in Ramah[a], weeping and great mourning: Rachel weeping for her children, and she was not willing to be comforted[c][b], because they are no more.'
translation:
  language: ta
  text: '“ராமாவில் ஒரு குரல் கேட்கப்பட்டது: அழுகையும் பெரும் புலம்பலும்; ராகேல் தன் பிள்ளைகளுக்காக அழுதுகொண்டிருந்தாள்; அவர்கள் இல்லாததால், ஆறுதல் பெற அவள் விரும்பவில்லை.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φωνὴ
  choice: ஒரு குரல்
  rationale: φωνή என்பதன் இயல்பான பொருளான ‘குரல்’ என்பதைத் தக்கவைத்து, தீர்க்கதரிசன மேற்கோளின் ஆளுருவாக்கப்பட்ட தொனியையும் பாதுகாக்கிறது.
- source_word: ἐν Ῥαμὰ
  choice: ராமாவில்
  rationale: ἐν என்னும் இடத்தைக் குறிக்கும் முன்னிடைச்சொல்லையும் ராமா என்னும் இடப்பெயரையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἠκούσθη
  choice: கேட்கப்பட்டது
  rationale: ἀκούω வினையின் இறந்தகாலச் செயப்பாட்டு வடிவத்தை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: κλαυθμὸς καὶ ὀδυρμὸς πολύς
  choice: அழுகையும் பெரும் புலம்பலும்
  rationale: κλαυθμός குறிக்கும் கேட்கக்கூடிய அழுகையையும், πολύς வலுப்படுத்தும் ὀδυρμός குறிக்கும் ஆழ்ந்த புலம்பலையும் வேறுபடுத்திக் காட்டுகிறது.
- source_word: Ῥαχὴλ κλαίουσα
  choice: ராகேல் ... அழுதுகொண்டிருக்கிறாள்
  rationale: பெயரை வழக்கமான தமிழில் ஒலிபெயர்த்து, நிகழ்காலப் பங்கேற்புவினை காட்டும் தொடர்ச்சியான செயலை ‘அழுதுகொண்டிருக்கிறாள்’ என்று வெளிப்படுத்துகிறது.
- source_word: τὰ τέκνα αὐτῆς
  choice: தன் பிள்ளைகளுக்காக
  rationale: τέκνα பாலினம் குறிப்பிடாத ‘பிள்ளைகள்’ எனத் துல்லியமாகத் தரப்பட்டுள்ளது; κλαίουσα என்பதோடு தமிழில் இயல்பாக அமைய உறவுப்பொருள் ‘-க்காக’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: οὐκ ἤθελεν παρακληθῆναι
  choice: ஆறுதலடைய அவள் விரும்பவில்லை
  rationale: θέλω என்பதன் ‘விரும்பு/மனமாயிரு’ என்ற பொருளை, ‘மறுத்தாள்’ என்று வலுப்படுத்தாமல் காக்கிறது; παρακληθῆναι குறிக்கும் ஆறுதல் பெறுதலை இயல்பான தமிழில் தருகிறது.
- source_word: ὅτι οὐκ εἰσίν
  choice: அவர்கள் இல்லாததால்
  rationale: ‘அவர்கள் இல்லை’ என்ற கிரேக்கத்தின் கடுமையான சுருக்கத்தைப் பாதுகாத்து, ‘இறந்துவிட்டார்கள்’ என்று வெளிப்படையாக விளக்கிச் சேர்ப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: மேற்கோளில் ராகேலின் தன்மை
  choice: ராகேலை எரேமியாவின் தீர்க்கதரிசன மேற்கோளிலுள்ள தாய்மைப் பாத்திரமாகவே விளக்கமின்றி வைத்தல்
  alternative: ராகேல் இஸ்ரவேலின் தாய்மார்களைக் குறிக்கும் அடையாளம் என்று முதன்மை உரையிலேயே வெளிப்படுத்துதல்
  rationale: மத்தேயு மேற்கோளை எவ்வாறு நிறைவேற்றப் பொருத்துகிறார் என்ற அடையாளத் தொடர்பை மொழிபெயர்ப்பு தீர்மானித்து விடாமல், கிரேக்க உரையின் ஆளுருவாக்கத்தையும் இறையியல் இழுவையையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பானதாயும், தீர்க்கதரிசன மேற்கோளுக்கேற்ற கண்ணியமான துயர்த் தொனியுடனும் அமைக்கப்பட்டுள்ளது. மூலத்தில் உண்மையான உரைவேறுபாடு இல்லாததால் அடிக்குறிப்புகள் சேர்க்கப்படவில்லை; வழங்கப்பட்ட ஆங்கில அடிக்குறிகளின் வரிசையும் உள்ளடக்கமும் மூலத்துடன் பொருந்தாத இடங்களில் அவை பின்பற்றப்படவில்லை.
