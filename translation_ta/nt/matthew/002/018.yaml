  verdict: revise
  source_fidelity: முக்கிய வினை ‘கேட்கப்பட்டது’ கிரேக்க அயோரிஸ்ட் செயப்பாட்டு வடிவத்தைத் துல்லியமாகக் காட்டுகிறது. ‘அழுகை’, ‘பெரும் புலம்பல்’, ‘தன் பிள்ளைகளுக்காக’, ‘அவர்கள் இல்லாததால்’ ஆகியவை மூலத்தின் பொருளையும், இறப்பை வெளிப்படையாகச் சேர்க்காத அதன் சுருக்கத்தையும் காக்கின்றன. ஆனால் கடந்தகால மேற்கோளின் அமைப்பில் κλαίουσα-வை ‘அழுதுகொண்டிருக்கிறாள்’ என நிகழ்காலத்தில் தருவது கால ஒத்திசைவைச் சிதைக்கிறது.
  naturalness: வரைவு பொதுவாக நவீனத் தரத் தமிழில் இயல்பாக உள்ளது. ஆயினும் ‘அழுதுகொண்டிருந்தாள்’ மற்றும் ‘ஆறுதல் பெற’ என்பவை இந்தத் துயரமிக்க மேற்கோளில் காலத்திற்கும் நடைக்கும் மிக இயல்பாக அமையும். மூலத்தில் வியப்புக்குறி இல்லை; முற்றுப்புள்ளி/முக்காற்புள்ளி சார்ந்த அமைப்பே மேற்கோளின் புலம்பல் தொனியைத் தேவையற்ற வலியுறுத்தலின்றிக் காக்கும்.
