base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/006.yaml
  text: And you[a], Bethlehem, land of Judah, are by no means least among the rulers of Judah[b]; for from you will come a ruler who will shepherd my people Israel.
translation:
  language: ta
  text: “யூதா நாட்டிலுள்ள பெத்லகேமே, நீ யூதாவின் ஆட்சியாளர்களிடையே எவ்விதத்திலும் மிகச் சிறியவள் அல்ல; ஏனெனில், உன்னிடமிருந்து ஓர் ஆட்சியாளர் வெளிப்படுவார்[a]; அவர் என் மக்களாகிய இஸ்ரவேலை மேய்ப்பார்[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெளியே வருவார்”; இன்னும் நேர்ச்சொல்லாக, “வெளியே செல்வார்.”
    reason: lexical_alternative
  - marker: b
    text: “மேய்ப்பார்” என்பது மேய்ப்பரின் பராமரிப்புடன் அரசரின் ஆளுகையையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆ
  choice: நாடு
  rationale: பெத்லகேமை யூதாவுடன் புவியியல் அடிப்படையில் இணைக்கும் சொல்லாக இங்கு வருகிறது. ‘நாடு’ என்பது மண் அல்லது பூமி என்ற பொருளைத் தவிர்த்து, இயல்பான நவீனத் தமிழில் பிரதேசப் பொருளைத் தருகிறது.
- source_word: οὐδαμῶς
  choice: எவ்விதத்திலும் ... அல்ல
  rationale: அடுத்து வரும் கூற்றை வலிமையாக மறுக்கும் கிரேக்கச் சொல்லின் அழுத்தத்தை, வெறும் ‘அல்ல’ என்பதைக் காட்டிலும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἐλαχίστη
  choice: மிகச் சிறியவள்
  rationale: பெத்லகேம் நேரடியாக விளிக்கப்படுவதால் தமிழில் பெண்பால் ஒருமை பயன்படுத்தப்பட்டுள்ளது. இச்சொல் அளவிலும் முக்கியத்துவத்திலும் தாழ்ந்த நிலையைச் சுட்டக்கூடிய மூலத்தின் நெகிழ்வைத் தக்கவைக்கிறது.
- source_word: ἡγεμόσιν
  choice: ஆட்சியாளர்களிடையே
  rationale: யூதாவிலுள்ள ஆளும் நபர்களையோ தலைமை அலகுகளையோ குறிக்கக்கூடிய சொல்லின் ஆட்சிப் பொருளை, குறிப்பிட்ட ஓர் அரசுப் பதவியாகக் குறுக்காமல் பாதுகாக்கிறது.
- source_word: ἐξελεύσεται
  choice: புறப்பட்டு வருவார்
  rationale: பெத்லகேமிலிருந்து ஒருவர் தோன்றுவதைத் தமிழில் இயல்பாகச் சொல்கிறது; கிரேக்க வினையின் ‘வெளியே செல்லுதல்/வருதல்’ என்ற அடிப்படை இயக்கப் பொருளையும் தக்கவைக்கிறது.
- source_word: ἡγούμενος
  choice: ஓர் ஆட்சியாளர்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் பங்கேற்பு வினைச்சொல் வரவிருப்பவரின் ஆளும் பணியைச் சுட்டுகிறது. ‘ஆட்சியாளர்’ அரசத் தலைமைப் பரிமாணத்தைத் தெளிவாக வைத்திருக்கிறது.
- source_word: ποιμανεῖ
  choice: மேய்ப்பார்
  rationale: நேரடியாக மேய்ப்பரின் செயலைக் குறிக்கும் சொல்லை அரசியல் மொழியாக மட்டும் மாற்றாமல், அதன் மேய்ப்பர் உருவகத்தையும் ஆளுகைப் பொருளையும் பாதுகாக்கிறது.
- source_word: λαόν μου τὸν Ἰσραήλ
  choice: என் மக்களாகிய இஸ்ரவேல்
  rationale: உடன்படிக்கைச் சார்ந்த ‘என் மக்கள்’ என்ற தொடரையும், அதற்கு விளக்கப்பெயராக வரும் ‘இஸ்ரவேல்’ என்பதையும் இயல்பான தமிழில் தெளிவாக இணைக்கிறது.
theological_decisions:
- issue: வரவிருக்கும் நபரின் அரசத் தலைமை மற்றும் மேய்ப்பர் பணி
  choice: ἡγούμενος என்பதற்கு ‘ஓர் ஆட்சியாளர்’ என்றும் ποιμανεῖ என்பதற்கு ‘மேய்ப்பார்’ என்றும் மொழிபெயர்த்து இரு பரிமாணங்களையும் தக்கவைத்தல்
  alternative: இரண்டையும் அரசியல் மொழியில் (‘தலைவர்’ / ‘ஆள்வார்’) அல்லது இரண்டையும் மேய்ப்பர் மொழியில் வழங்குதல்
  rationale: மேற்கோள் ஆளுகையையும் மேய்ப்பையும் ஒன்றாக இணைக்கிறது. இரு வேறுபட்ட படிமங்களையும் வைத்திருப்பது அரசாட்சியையோ பராமரிப்பையோ மட்டும் முன்னிறுத்தி மூலத்தின் இறையியல் நிறைவைச் சுருக்குவதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பெத்லகேம் நேரடியாக விளிக்கப்படுவதால் ‘பெத்லகேமே’ என்றும், இலக்கண ஒத்திசைவுக்காக ‘சிறியவள்’ என்றும் வழங்கப்பட்டுள்ளது. வாக்கியத்தின் தீர்க்கதரிசன மேற்கோள் தன்மையைத் தக்கவைக்க முறையான, ஆனால் மிகப் பழமையானதல்லாத சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன.
