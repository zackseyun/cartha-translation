source:
  edition: SBLGNT
  text: καὶ χρηματισθέντες κατ’ ὄναρ μὴ ἀνακάμψαι πρὸς Ἡρῴδην δι’ ἄλλης ὁδοῦ ἀνεχώρησαν εἰς τὴν χώραν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/012.yaml
  text: And having been warned in a dream not to return to Herod[b][a], they departed for their own country by another route.
translation:
  language: ta
  text: ஏரோதுவிடம் திரும்பிச் செல்ல வேண்டாம் என்று கனவில் எச்சரிக்கை பெற்று[a], அவர்கள் வேறொரு வழியாக[b] தங்கள் நாட்டிற்குப் புறப்பட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தெய்வீகமாக எச்சரிக்கப்பட்டு.” கிரேக்க செயப்பாட்டு வடிவம் எச்சரிப்பு கடவுளிடமிருந்து வந்ததைக் குறிக்கிறது; ஆனால் இவ்வசனத்தில் கடவுள் வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வேறொரு பாதையில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματισθέντες
  choice: எச்சரிக்கப்பட்டதால்
  rationale: இறைவனிடமிருந்து எச்சரிக்கை அல்லது அறிவுறுத்தல் பெறுவதைக் குறிக்கும் இறைவினை வடிவம். தமிழில் இயல்பான காரணத் தொடர்பைக் காட்டுவதோடு, எச்சரிப்பை வழங்கியவர் யார் என்பதை மூலத்தைவிட வெளிப்படையாக்கவில்லை.
- source_word: κατ’ ὄναρ
  choice: கனவில்
  rationale: கனவின் வழியாக அறிவிப்பு பெறப்பட்டதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: μὴ ἀνακάμψαι
  choice: திரும்பிச் செல்ல வேண்டாம் என்று
  rationale: μή உடனான வினையெச்சத்தின் எதிர்மறை அறிவுறுத்தலைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: πρὸς Ἡρῴδην
  choice: ஏரோதிடம்
  rationale: ஒரு நபரிடம் திரும்பிச் செல்வதைக் குறிக்கும் πρός என்பதன் திசை மற்றும் இலக்கு உணர்வைச் சுருக்கமாகத் தருகிறது.
- source_word: δι’ ἄλλης ὁδοῦ
  choice: வேறொரு வழியாக
  rationale: பயணச் சூழலில் ὁδός என்பதன் வழி அல்லது பாதை என்ற பொருளை இயல்பாகத் தருகிறது; 'வேறொரு பாதையில்' என்பதும் சாத்தியம்.
- source_word: ἀνεχώρησαν
  choice: புறப்பட்டுச் சென்றார்கள்
  rationale: இச்சூழலில் விலகிச் செல்லுதல் அல்லது புறப்படுதல் என்ற பொருளை மரியாதையான, இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἰς τὴν χώραν αὐτῶν
  choice: தங்கள் நாட்டிற்கு
  rationale: அவர்கள் தங்களுடைய சொந்த நாட்டிற்குத் திரும்பிச் சென்ற இலக்கை χώρα இயல்பாகக் குறிக்கிறது.
theological_decisions:
- issue: எச்சரிப்பின் மறைமுகமான இறை ஆதாரம்
  choice: முதன்மை உரையில் எச்சரிப்பை வழங்கியவராகக் கடவுளை வெளிப்படையாகச் சேர்க்காமல், 'எச்சரிக்கப்பட்டதால்' என்ற இறைவினை வடிவம் பயன்படுத்தப்பட்டது.
  alternative: கடவுளால் எச்சரிக்கப்பட்டதால் / இறைவனிடமிருந்து எச்சரிக்கை பெற்றதால்
  rationale: χρηματισθέντες என்பது இச்சூழலில் இறை அறிவிப்பை வலுவாக உணர்த்தினாலும், இவ்வசனத்தில் கடவுள் வெளிப்படையாகப் பெயரிடப்படவில்லை. எனவே அந்த மறைமுகத் தன்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. கிரேக்க உரையின் மறைமுக இறைச் செயற்பாடு வெளிப்படையாக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளது. அனைத்து அடிக்குறிப்புக் குறிகளும் உரையில் இடம்பெற்றுள்ளன.
