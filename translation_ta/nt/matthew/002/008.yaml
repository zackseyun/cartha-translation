id: MAT.2.8
reference: Matthew 2:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ πέμψας αὐτοὺς εἰς Βηθλέεμ εἶπεν· Πορευθέντες ⸂ἐξετάσατε ἀκριβῶς⸃ περὶ τοῦ παιδίου· ἐπὰν δὲ εὕρητε, ἀπαγγείλατέ μοι, ὅπως κἀγὼ ἐλθὼν προσκυνήσω αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/008.yaml
  text: And after sending them to Bethlehem[a], he said, “Go and search carefully for the child, and when you find him, report to me, so that I too may come and worship him.”
translation:
  language: ta
  text: அவர்களைப் பெத்லகேமுக்கு அனுப்பிவிட்டு, “நீங்கள் போய் அந்தக் குழந்தையைக் கவனமாகத் தேடுங்கள். கண்டுபிடித்ததும், நானும் வந்து அவரை வணங்குவதற்காக எனக்குத் தெரிவியுங்கள்[a]” என்று சொன்னான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்முன் பணிந்து மரியாதை செலுத்துவேன்.” கிரேக்க வினைச்சொல் வழிபடுவதையோ, ஓர் அரசர்முன் பணிந்து மரியாதை செலுத்துவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέμψας
  choice: அனுப்பிவிட்டு
  rationale: இறந்தகாலப் பங்கேற்பு வினைச்சொல், முதன்மை வினைக்கு முந்திய செயலைக் குறிக்கிறது; தமிழில் இயல்பாக அந்த வரிசையை இது காட்டுகிறது.
- source_word: Πορευθέντες
  choice: நீங்கள் போய்
  rationale: ἐξετάσατε என்பதுடன் சேர்ந்து கட்டளையாகச் செயல்படுவதால், இயல்பான தமிழ் கட்டளைத் தொடராக மொழிபெயர்க்கப்பட்டது.
- source_word: ἐξετάσατε ἀκριβῶς
  choice: கவனமாகத் தேடுங்கள்
  rationale: குழந்தை இருக்கும் இடத்தைக் கண்டறியச் செய்யப்படும் துல்லியமான, அக்கறையான விசாரணை அல்லது தேடலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: περὶ τοῦ παιδίου
  choice: அந்தக் குழந்தையை
  rationale: தேடுதல் என்ற சூழலில் περί இயல்பாகத் தேடப்படும் நபரைக் குறிக்கிறது; தமிழில் நேரடி செயப்படுபொருளாக அமைப்பது தெளிவானது.
- source_word: παιδίου
  choice: குழந்தை
  rationale: παιδίον என்பதன் வயதைத் தேவைக்கு மீறித் துல்லியப்படுத்தாமல் அதன் பொதுவான பொருளைப் பாதுகாக்கிறது.
- source_word: ἐπὰν δὲ εὕρητε
  choice: கண்டுபிடித்ததும்
  rationale: எதிர்பார்க்கப்படும் ஆனால் இன்னும் நிகழாத நிபந்தனைக்குரிய காலத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது; கண்டுபிடிப்பது உறுதி என்று தனியாக வலியுறுத்தவில்லை.
- source_word: ἀπαγγείλατέ μοι
  choice: எனக்குத் தெரிவியுங்கள்
  rationale: கண்டறிந்த செய்தியைத் திரும்ப வந்து அறிவிக்கும் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὅπως
  choice: அப்போது
  rationale: முந்தைய அறிவிப்பைத் தொடர்ந்து ஏரோது கூறும் நோக்கத்தை தமிழில் இயல்பாக இணைக்கிறது; அடுத்த செயல் அந்தத் தகவலைச் சார்ந்திருப்பதையும் உணர்த்துகிறது.
- source_word: κἀγὼ
  choice: நானும்
  rationale: ஞானிகளுடன் தானும் அதே செயலைச் செய்ய விரும்புவதாக ஏரோது கூறும் இணைப்பு வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: ἐλθὼν προσκυνήσω αὐτῷ
  choice: வந்து அவரை வணங்குவேன்
  rationale: பங்கேற்பு வினையையும் முதன்மை வினையையும் இயல்பான தொடர் செயல்களாக அளிக்கிறது; προσκυνέω என்பதின் வழிபாடு அல்லது அரசர்முன் பணிதல் ஆகிய பொருள் வீச்சை ‘வணங்கு’ ஓரளவு பாதுகாக்கிறது.
theological_decisions:
- issue: குழந்தை இயேசுவைக் குறித்த προσκυνήσω αὐτῷ என்பதன் பொருள்
  choice: அவரை வணங்குவேன்
  alternative: அவர்முன் பணிந்து மரியாதை செலுத்துவேன்
  rationale: προσκυνέω என்பது வழிபடுவதையோ, அரசருக்குரிய மரியாதையுடன் பணிவதையோ குறிக்கலாம். மத்தேயுவில் இயேசுவை நோக்கிப் பயன்படுத்தப்படும்போது உயர்ந்த இறையியல் நுணுக்கம் இருக்கக்கூடும்; ஆனால் இங்கு ஏரோதின் சொந்த நோக்கம் வஞ்சகமானது. ‘வணங்குவேன்’ இரு சாத்தியங்களுக்கும் இடமளிக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. உரையாடல் நேரடியாகவும் சுருக்கமாகவும் வைக்கப்பட்டுள்ளது; ‘அவரை’ என்பது இயேசுவைக் குறிக்கும் மரியாதை ஒருமை வடிவம்.
