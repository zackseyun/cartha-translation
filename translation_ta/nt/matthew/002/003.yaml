  text: ἀκούσας δὲ ⸂ὁ βασιλεὺς Ἡρῴδης⸃ ἐταράχθη καὶ πᾶσα Ἱεροσόλυμα μετ’ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/003.yaml
  text: When King Herod heard this[a], he was troubled[b], and all Jerusalem with him.
translation:
  language: ta
  text: இதைக் கேட்டதும், ஏரோது அரசன் கலக்கமடைந்தான்[a]; அவனோடு எருசலேம் முழுவதும்[b] கலக்கமடைந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அமைதி குலைந்தான்.’
    reason: lexical_alternative
  - marker: b
    text: ‘எருசலேம் முழுவதும்’ என்பது நகரத்தின் பெயரால் அதன் குடியிருப்போரைக் கூட்டாகக் குறிக்கும் சொல்லாட்சி; நகரெங்கும் நிலவிய கலக்கத்தைப் பொதுவாகவோ மிகைப்படுத்தியோ இது விவரித்திருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: இதைக் கேட்டதும்
  rationale: இறந்தகாலப் பங்கேற்புவினை இங்கு காலத் தொடர்பைக் காட்டுகிறது. முந்தைய வசனத்தில் ஞானிகள் கூறிய செய்தியைச் சுட்டும் மறைபொருளைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘இதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: δὲ
  choice: தனிச் சொல்லாக மொழிபெயர்க்காமல் காலத் தொடரில் உட்படுத்தப்பட்டது
  rationale: δέ இங்கு மென்மையான கதைத் தொடர்ச்சியை அளிக்கிறது; ‘கேட்டதும்’ என்ற அமைப்பு அந்தத் தொடர்ச்சியையும் காலத் தொடர்பையும் தமிழில் இயல்பாகத் தருகிறது.
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: ஏரோது அரசன்
  rationale: தமிழின் இயல்பான பெயர்–பட்டம் வரிசையைப் பின்பற்றி, பெயரையும் அரசப் பட்டத்தையும் முழுமையாகப் பாதுகாக்கிறது.
- source_word: ἐταράχθη
  choice: கலக்கமடைந்தான்
  rationale: ταράσσω குறிக்கும் உள்ளக் குழப்பம், அச்சம் அல்லது அமைதியின்மையை அளவுக்கு மீறி விளக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: πᾶσα Ἱεροσόλυμα
  choice: எருசலேம் முழுவதும்
  rationale: நகரத்தின் பெயர் அதன் குடியிருப்போரைக் கூட்டாகக் குறிக்கும் கிரேக்க அணியைக் காத்து, ‘மக்கள்’ என்று முதன்மை உரையில் விளக்கமாகச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: μετ’ αὐτοῦ
  choice: அவனோடு
  rationale: ஏரோதுவின் கலக்கத்துடன் எருசலேமின் கலக்கத்தையும் நேரடியாக இணைக்கும் μετά + மரபுவேற்றுமையின் பொருளைச் சுருக்கமாகத் தருகிறது.
theological_decisions:
- issue: πᾶσα Ἱεροσόλυμα என்பதன் வரம்பு
  choice: நகரத்தையும் அதன் குடியிருப்போரையும் கூட்டாகக் குறிக்கும் சொல்லாட்சியை ‘எருசலேம் முழுவதும்’ என்று பாதுகாத்தல்
  alternative: எருசலேமில் பலர் அல்லது குறிப்பாக அதன் தலைவர்கள் கலக்கமடைந்தார்கள் என்று வரம்பைச் சுருக்குதல்
  rationale: கிரேக்க உரை நகரத்தையே முழுமையாகக் குறிப்பிடுகிறது. இது பொதுமைப்படுத்தலாகவோ மிகைப்படுத்தலாகவோ இருக்கக்கூடிய வாய்ப்பைத் திறந்தே வைத்து, உரை கூறாத ஒரு குறிப்பிட்ட சமூகக் குழுவை மொழிபெயர்ப்பு நிர்ணயிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், ஆனால் வேதாகமக் கதைநடைக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் இரண்டாம் பகுதியில் விடுபட்டிருக்கும் வினை தமிழில் தெளிவுக்காக ‘கலக்கமடைந்தது’ என்று நிரப்பப்பட்டுள்ளது; நகரம் கூட்டாகச் சுட்டப்படுவதால் அஃறிணை ஒருமை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
