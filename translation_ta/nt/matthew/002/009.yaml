id: MAT.2.9
reference: Matthew 2:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες τοῦ βασιλέως ἐπορεύθησαν, καὶ ἰδοὺ ὁ ἀστὴρ ὃν εἶδον ἐν τῇ ἀνατολῇ προῆγεν αὐτούς, ἕως ἐλθὼν ⸀ἐστάθη ἐπάνω οὗ ἦν τὸ παιδίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/009.yaml
  text: After hearing the king[a], they went on their way, and behold, the star that they had seen in the east went before them until it came and stood over where the child was.
translation:
  language: ta
  text: அவர்கள் அரசன் பேசியதைக் கேட்ட பின்பு புறப்பட்டுச் சென்றார்கள். இதோ, அவர்கள் கிழக்கில்[a] கண்டிருந்த நட்சத்திரம், குழந்தை இருந்த இடத்திற்கு மேலே வந்து நிற்கும்வரை அவர்களுக்கு முன்னே சென்றது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கிழக்கில்” என்பதற்கு “அது உதித்தபோது” என்றும் மொழிபெயர்க்கலாம்; கிரேக்கத் தொடர் கிழக்குத் திசையையோ ஒரு நட்சத்திரத்தின் உதயத்தையோ குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσαντες τοῦ βασιλέως
  choice: அரசன் பேசியதைக் கேட்ட பின்பு
  rationale: ἀκούω உடன் வரும் மரபுவேற்றுமைச் சொல், கேட்கப்பட்ட நபரைக் குறிக்கிறது. தமிழில் ‘அரசனைக் கேட்ட பின்பு’ என்பது அவரிடம் கேள்வி கேட்டதாகப் பொருள்படக்கூடும் என்பதால், இயல்பாகவும் தெளிவாகவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது; ‘ஏரோது’ என்ற பெயர் வசனத்தில் இல்லாததால் சேர்க்கப்படவில்லை.
- source_word: ἐπορεύθησαν
  choice: புறப்பட்டுச் சென்றார்கள்
  rationale: அரசனைச் சந்தித்த பின் அவர்கள் பயணத்தைத் தொடர்ந்த நிகழ்வை இயல்பான தமிழ் நடையில் தெரிவிக்கிறது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: வாசகரின் கவனத்தைத் திடீரென அடுத்த நிகழ்வின்மீது திருப்பும் கிரேக்க உரையாடல் குறியீட்டின் உயிரோட்டத்தைப் பாதுகாக்கிறது.
- source_word: ὁ ἀστὴρ ὃν εἶδον
  choice: அவர்கள் ... கண்டிருந்த நட்சத்திரம்
  rationale: இந்நிகழ்வுக்கு முன்பே அவர்கள் அந்த நட்சத்திரத்தைக் கண்டிருந்தார்கள் என்ற காலவரிசையை ‘கண்டிருந்த’ தெளிவாகக் காட்டுகிறது.
- source_word: ἐν τῇ ἀνατολῇ
  choice: கிழக்கில்
  rationale: இத்தொடரின் பொதுவான புவியியல் பொருளை இயல்பாகத் தருகிறது; நட்சத்திரம் உதித்த நேரத்தைக் குறிக்கும் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: προῆγεν αὐτούς
  choice: அவர்களுக்கு முன்னே சென்றது
  rationale: நட்சத்திரம் அவர்களுக்கு முன்பாகச் சென்றது என்ற கிரேக்கப் படிமத்தை, அது எவ்வாறு வழிநடத்தியது என்பதை மிகைப்படுத்தாமல் காக்கிறது.
- source_word: ἕως ἐλθὼν ἐστάθη
  choice: வந்து நிற்கும்வரை
  rationale: வந்து சேர்ந்ததையும் பின்னர் நின்றதையும் இயல்பான தமிழ் வினைத்தொடராக வழங்குகிறது.
- source_word: ἐπάνω οὗ ἦν τὸ παιδίον
  choice: குழந்தை இருந்த இடத்திற்கு மேலே
  rationale: நட்சத்திரம் குழந்தை இருந்த இடத்தின் மேலே நின்றதாகக் கூறும் இடத்தொடர்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: τὸ παιδίον
  choice: குழந்தை
  rationale: παιδίον என்பதன் நேரடியான பொருள்; கிரேக்கத்தில் இல்லாத கூடுதல் வயது வலியுறுத்தல் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: நட்சத்திர வருணனையில் ἐν τῇ ἀνατολῇ என்பதன் பொருள்
  choice: கிழக்கில்
  alternative: அது உதித்தபோது
  rationale: கிரேக்கத் தொடர் கிழக்கு என்ற திசை அல்லது பகுதியையும், ஒரு நட்சத்திரத்தின் உதயத்தையும் குறிக்கக்கூடும். வசனம் இந்த இரு சாத்தியங்களுக்கிடையே முடிவுகட்டாததால், முதன்மை உரையில் பரவலாக அறியப்பட்ட பொருள் வைக்கப்பட்டு மற்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன செந்தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்பது மூலத்தின் கவன ஈர்ப்பைத் தக்கவைக்கிறது; தேவையற்ற பழமையான சொற்களும் விளக்கச் சேர்க்கைகளும் தவிர்க்கப்பட்டுள்ளன.
