id: MAT.2.11
reference: Matthew 2:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐλθόντες εἰς τὴν οἰκίαν εἶδον τὸ παιδίον μετὰ Μαρίας τῆς μητρὸς αὐτοῦ, καὶ πεσόντες προσεκύνησαν αὐτῷ, καὶ ἀνοίξαντες τοὺς θησαυροὺς αὐτῶν προσήνεγκαν αὐτῷ δῶρα, χρυσὸν καὶ λίβανον καὶ σμύρναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/011.yaml
  text: 'And when they came into the house[a], they saw the child with Mary his mother, and falling down they paid homage to him, and opening their treasures they offered him gifts: gold and frankincense and myrrh.'
translation:
  language: ta
  text: அவர்கள் வீட்டிற்குள் வந்து, குழந்தையை அதன் தாயான மரியாளுடன் கண்டார்கள். அவர் முன் விழுந்து அவரை வணங்கினார்கள்[a]. பின்பு தங்கள் பொக்கிஷங்களைத் திறந்து, பொன், குங்கிலியம், வெள்ளைப்போளம் ஆகியவற்றைப் பரிசுகளாக அவருக்கு அளித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரை வழிபட்டார்கள்.” கிரேக்க வினைச்சொல் சூழலைப் பொறுத்து வழிபாட்டையோ ஆழ்ந்த மரியாதையுடன் பணிவதையோ குறிக்கலாம்.
    reason: மூல வினைச்சொல் வழிபாடு அல்லது மரியாதையுடன் பணிதல் ஆகிய இரு பொருள்களையும் சூழலுக்கு ஏற்ப தரக்கூடும்.
lexical_decisions:
- source_word: οἰκίαν
  choice: வீடு
  rationale: ஒரு குடியிருப்பைக் குறிக்கும் நேரடியான, இயல்பான சொல்; தொழுவம் போன்ற வேறு இடத்தை உரையில் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: παιδίον
  choice: குழந்தை
  rationale: வயதையோ பாலினத்தையோ மூலச்சொல் கூறுவதற்கு மேல் குறிப்பாக்காமல் இயல்பாகத் தருகிறது.
- source_word: πεσόντες
  choice: அவர் முன் விழுந்து
  rationale: முதன்மைச் செயலுக்கு முன் நிகழ்ந்த உடல் நிலையைத் தெளிவாகக் காட்டுகிறது; ‘சாஷ்டாங்கமாக’ போன்ற கூடுதல் விவரத்தைச் சேர்க்கவில்லை.
- source_word: προσεκύνησαν
  choice: வணங்கினார்கள்
  rationale: தமிழில் இச்சொல் ஆழ்ந்த மரியாதையுடன் பணிதல் மற்றும் வழிபடுதல் ஆகிய இரு நிழற்பொருள்களையும் தாங்கக்கூடியதால் கிரேக்கச் சொல்லின் சூழல்சார் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: θησαυρούς
  choice: பொக்கிஷங்கள்
  rationale: ‘பெட்டிகள்’ என்று மூலத்தில் இல்லாத பொருளைச் சேர்க்காமல் கிரேக்கப் பன்மையை நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: δῶρα
  choice: பரிசுகள்
  rationale: சடங்குசார் ‘காணிக்கைகள்’ என்று பொருளைச் சுருக்காமல் பொதுவான அன்பளிப்புகளைக் குறிக்கிறது.
- source_word: λίβανον
  choice: குங்கிலியம்
  rationale: Frankincense எனப்படும் நறுமணப் பிசினுக்கான துல்லியமான தமிழ்ப் பெயர்; பொதுவான ‘தூபம்’ என்பதைக் காட்டிலும் குறிப்பானது.
- source_word: σμύρναν
  choice: வெள்ளைப்போளம்
  rationale: Myrrh எனப்படும் நறுமணப் பிசினுக்கான மரபாக அறியப்பட்ட துல்லியமான தமிழ்ச் சொல்.
theological_decisions:
- issue: குழந்தை இயேசுவைப் பற்றிய προσκυνέω வினைச்சொல்லின் பொருள்
  choice: வணங்கினார்கள்
  alternative: வழிபட்டார்கள்; பணிந்து மரியாதை செலுத்தினார்கள்
  rationale: உடனடிச் சூழலில் இது அரசருக்குச் செலுத்தப்படும் ஆழ்ந்த மரியாதையாகவும், விரிந்த இறையியல் வாசிப்பில் வழிபாடாகவும் புரிந்துகொள்ளப்படலாம். ‘வணங்கினார்கள்’ இரு சாத்தியங்களையும் சுமக்கிறது; வலுவான ‘வழிபட்டார்கள்’ என்ற வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. குழந்தையைக் குறிக்க மரியாதை ஒருமையான ‘அவர்/அவரை/அவருக்கு’ பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் தொடர்ச்சியான καί அமைப்பு தமிழில் இயல்பாக வாசிக்க வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
