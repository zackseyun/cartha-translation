id: MAT.2.23
reference: Matthew 2:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν κατῴκησεν εἰς πόλιν λεγομένην Ναζαρέτ, ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τῶν προφητῶν ὅτι Ναζωραῖος κληθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/023.yaml
  text: 'And he came and lived in a city called Nazareth[a], so that what was spoken through the prophets might be fulfilled: “He will be called a Nazarene.”'
translation:
  language: ta
  text: 'இறைவாக்கினர்கள் மூலம் சொல்லப்பட்டது நிறைவேறும்படி, அவர் வந்து நாசரேத் என்னும் நகரத்தில் குடியிருந்தார்: “அவர் நசரேயர்[a] என்று அழைக்கப்படுவார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, கிரேக்க ஒலிவடிவுக்கு மேலும் நெருக்கமாக, “நசோரேயர்.” “அவர் நசரேயர் என்று அழைக்கப்படுவார்” என்பதன் துல்லியமான இறைவாக்குப் பின்னணி குறித்து கருத்து வேறுபாடு உள்ளது. மத்தேயு ஒரே குறிப்பிட்ட வசனத்தை மேற்கோள் காட்டாமல், இறைவாக்கினர்களிடமுள்ள பல கருப்பொருள்களைச் சுருக்கிக் கூறியிருக்கலாம்.
    reason: சொல் வடிவத்தின் மாற்றையும் மேற்கோளின் உறுதியற்ற இறைவாக்குப் பின்னணியையும் வெளிப்படையாகப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: ἐλθὼν
  choice: அவர் வந்து
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் குறிக்கும் இறந்தகாலப் பங்கேற்பு வடிவத்தை, தமிழில் இயல்பாகத் தொடர்வினை வடிவில் தருகிறது.
- source_word: κατῴκησεν
  choice: குடியிருந்தார்
  rationale: ஒரு இடத்தில் வசிக்கத் தொடங்கி வாழ்ந்ததைக் குறிக்கிறது; வெறும் தற்காலிகத் தங்குதலைவிட κατοικέω என்பதன் பொருளுக்கு நெருக்கமானது.
- source_word: εἰς πόλιν λεγομένην Ναζαρέτ
  choice: நாசரேத் என்னும் நகரத்தில்
  rationale: κατοικέω உடன் வரும் εἰς என்பதை இயல்பான தமிழ் இடவேற்றுமையில் தருகிறது; πόλις என்பதற்கு ‘நகரம்’ என நேரடியாக மொழிபெயர்க்கிறது.
- source_word: ὅπως πληρωθῇ
  choice: இவ்வாறு … நிறைவேறியது
  rationale: மத்தேயுவின் நிறைவேறுதல் சூத்திரத்திலுள்ள நோக்கம்–விளைவு தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; நிகழ்வுக்கும் முன்சொல்லுக்கும் உள்ள தொடர்பைத் தெளிவாக வைத்திருக்கிறது.
- source_word: τὸ ῥηθὲν
  choice: சொல்லப்பட்டது
  rationale: கிரேக்கச் செயப்பாட்டு வடிவத்தைச் சுருக்கமான, இயல்பான தமிழ் செயப்பாட்டு வடிவில் பாதுகாக்கிறது.
- source_word: διὰ τῶν προφητῶν
  choice: இறைவாக்கினர்கள் மூலம்
  rationale: διά உடன் வரும் பன்மை வடிவின் கருவி அல்லது இடைமுகப் பொருளைப் பாதுகாக்கிறது; ஒரே இறைவாக்கினரைக் குறிப்பதாக மாற்றவில்லை.
- source_word: Ναζωραῖος
  choice: நசரேயர்
  rationale: நாசரேத்துடன் தொடர்புடைய அடையாளப் பெயராக வாசிக்கக்கூடிய, தமிழில் அறியப்பட்ட வடிவம்; ‘நசரேய விரதத்தார்’ என்ற வேறு கருத்தை இறக்குமதி செய்வதைத் தவிர்க்கிறது.
- source_word: κληθήσεται
  choice: அழைக்கப்படுவார்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தையும் மேற்கோளின் இறைவாக்கு நடையையும் பாதுகாக்கிறது.
theological_decisions:
- issue: ஒரே பழைய ஏற்பாட்டு வசனத்துடன் சொற்சொல்லாகப் பொருந்தாத நிறைவேறுதல் மேற்கோளின் தன்மை
  choice: ‘இறைவாக்கினர்கள்’ என்ற பன்மையை அப்படியே வைத்து, குறிப்பிட்ட ஒரு மூல வசனத்தை முதன்மை உரையில் அடையாளப்படுத்தாமல் மொழிபெயர்த்தல்
  alternative: ஏசாயா 11:1-இன் ‘தளிர்’ சொல்லுடன் நேரடியாக இணைத்தல், அல்லது மேசியாவின் தாழ்வையும் இகழப்பட்ட நிலையையும் பற்றிய இறைவாக்குகளின் கருப்பொருள் சுருக்கமாக விளக்குதல்
  rationale: கிரேக்கம் வெளிப்படையாகப் பன்மையில் ‘இறைவாக்கினர்கள் மூலம்’ என்கிறது. ஆகவே, உறுதியாகத் தெரியாத ஓர் ஒற்றை மூலத்தையோ விளக்கத்தையோ உரைக்குள் சேர்க்காமல் மத்தேயுவின் சொற்களைப் பாதுகாக்கிறது.
- issue: Ναζωραῖος என்பதன் அடையாளப் பொருள்
  choice: நாசரேத்துடன் தொடர்புடைய ‘நசரேயர்’ என்ற பெயரடை/அடையாளப் பெயர்
  alternative: நசரேய விரதத்தார்; அல்லது கிரேக்க ஒலிவடிவுக்கு மேலும் நெருக்கமான ‘நசோரேயர்’
  rationale: இச்சூழலில் இந்தச் சொல் நாசரேத் ஊருடனான தொடர்பைக் குறிக்கிறது. நசரேய விரதத்தைக் குறிக்கும் வேறு சொல்லையும் கருத்தையும் இங்கு சேர்க்க ஆதாரம் இல்லை; ஒலிபெயர்ப்பு மாற்றம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தீர்க்கதரிசிகள்’ என்பதற்குப் பதில் பொதுவாசகருக்கு உடனடியாகப் புரியும் ‘இறைவாக்கினர்கள்’ பயன்படுத்தப்பட்டுள்ளது. மரியாதைப் பன்மை வினைமுற்றுகள் கதைநடையிலும் மேற்கோளிலும் ஒரே சீராக வைக்கப்பட்டுள்ளன.
