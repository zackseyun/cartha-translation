translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட கதையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் வினையெச்சத் தொடரை இயல்பான தமிழ் தொடர் வினை அமைப்பாக மாற்றியுள்ளோம்; கருத்து சார்ந்த கூடுதல் விளக்கங்கள் சேர்க்கப்படவில்லை.
