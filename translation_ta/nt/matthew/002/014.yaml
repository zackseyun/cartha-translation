id: MAT.2.14
reference: Matthew 2:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ νυκτὸς καὶ ἀνεχώρησεν εἰς Αἴγυπτον,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/014.yaml
  text: So he got up[a], took the child and his mother during the night, and departed for Egypt.
translation:
  language: ta
  text: எனவே அவர் எழுந்து, இரவில் குழந்தையையும் அதன் தாயையும் அழைத்துக்கொண்டு எகிப்துக்குப் புறப்பட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: எனவே
  rationale: முந்தைய வசனத்தில் கொடுக்கப்பட்ட கட்டளையைத் தொடர்ந்து நிகழும் செயலைக் காட்டும் மென்மையான இணைப்பாக இங்கு வருகிறது; ‘எனவே’ இயல்பான கதையோட்டத்தையும் விளைவுத் தொடர்பையும் தருகிறது.
- source_word: ἐγερθεὶς
  choice: எழுந்து
  rationale: இறந்தகால வினையெச்சம் யோசேப்பு உடனே மேற்கொண்ட முதல் செயலைக் குறிக்கிறது; ‘எழுந்து’ என்பது இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: παρέλαβε
  choice: அழைத்துக்கொண்டு
  rationale: இந்தச் சூழலில் ஒருவரைத் தன்னுடன் கூட்டிக்கொண்டு செல்வதைக் குறிக்கிறது; வெறும் ‘எடுத்துக்கொண்டு’ என்பதைவிட மனிதர்களைக் குறிக்கத் தமிழில் இது இயல்பாக உள்ளது.
- source_word: τὸ παιδίον
  choice: குழந்தையை
  rationale: παιδίον என்பதன் எளிய பொருளை வயது பற்றிய கூடுதல் வலியுறுத்தல் இன்றி தருகிறது.
- source_word: τὴν μητέρα αὐτοῦ
  choice: அதன் தாயை
  rationale: αὐτοῦ என்பது யோசேப்பை அல்ல, குழந்தையைக் குறிப்பதைத் தமிழில் தெளிவாகக் காட்டுகிறது; ‘அதன்’ என்பது குழந்தையைச் சுட்டும் இலக்கணரீதியான இயல்பான வடிவம்.
- source_word: νυκτὸς
  choice: இரவில்
  rationale: இரவு நேரத்தில் செயல் நடந்ததைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது; மூலத்தில் இல்லாத ‘அதே இரவு’ என்ற கூடுதல் வலியுறுத்தலைத் தவிர்க்கிறது.
- source_word: ἀνεχώρησεν
  choice: புறப்பட்டார்
  rationale: ஆபத்திலிருந்து விலகிச் செல்லும் பின்னணி இருந்தாலும், வினைச்சொல்லின் அடிப்படைப் பொருளான ஓர் இடத்தை நோக்கிப் புறப்படுதலை இயல்பாகத் தருகிறது.
- source_word: εἰς Αἴγυπτον
  choice: எகிப்துக்கு
  rationale: εἰς குறிக்கும் இலக்கைத் தமிழில் இயல்பான திசை வேற்றுமையால் வெளிப்படுத்துகிறது.
