  yaml_path: translation/nt/matthew/002/010.yaml
  text: And when they saw the star[a], they rejoiced with exceedingly great joy.
translation:
  language: ta
  text: அந்த நட்சத்திரத்தை அவர்கள் கண்டபோது, அளவுகடந்த பெருமகிழ்ச்சி அடைந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கில், ‘அவர்கள் மிகுந்த பெரிய மகிழ்ச்சியால் மகிழ்ந்தார்கள்’ என்று வினையும் ‘மகிழ்ச்சி’ என்ற பெயர்ச்சொல்லும் ஒரே வேரிலிருந்து வந்து வலியுறுத்துகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: கண்டபோது
  rationale: ὁράω என்பதன் இறந்தகால வினையெச்சம் முதன்மை வினைக்கு முன்னான அல்லது அதனுடன் தொடர்புடைய நிகழ்வைச் சுட்டுகிறது. ‘கண்டபோது’ என்பது அந்தக் காலத் தொடர்பை இயல்பான தமிழில் தருகிறது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ வலுவான முரண்பாட்டைக் காட்டாமல் கதைநடையை மெதுவாக முன்னெடுக்கிறது. தமிழில் ‘கண்டபோது’ என்ற அமைப்பே தொடர்ச்சியை இயல்பாக உணர்த்துவதால் கூடுதல் இணைப்புச்சொல் தேவையில்லை.
- source_word: τὸν ἀστέρα
  choice: அந்த நட்சத்திரத்தை
  rationale: ἀστήρ என்பது ‘நட்சத்திரம்’; குறிப்பிட்ட சுட்டு உருபு, முன்னரே குறிப்பிடப்பட்ட அந்த நட்சத்திரத்தைக் குறிக்க ‘அந்த’ என்று வழங்கப்பட்டுள்ளது.
- source_word: ἐχάρησαν
  choice: மகிழ்ச்சி அடைந்தார்கள்
  rationale: χαίρω என்பதன் இவ்வடிவம் பொருளில் செயப்பாட்டுத் தன்மையுடன் ‘மகிழ்ந்தார்கள்’ என வருகிறது. ‘மகிழ்ச்சி அடைந்தார்கள்’ என்பது தொடர்ந்து வரும் வலியுறுத்தும் பெயர்ச்சொல் அமைப்பை இயல்பான தமிழில் தாங்குகிறது.
- source_word: χαρὰν μεγάλην σφόδρα
  choice: அளவுகடந்த பெருமகிழ்ச்சி
  rationale: χαρά என்ற ஒரே வேரைச் சேர்ந்த பெயர்ச்சொல் வினையை வலுப்படுத்துகிறது; μεγάλην மற்றும் σφόδρα இரண்டும் அந்த மகிழ்ச்சியின் மிகுதியைத் தீவிரமாக எடுத்துரைக்கின்றன. ‘அளவுகடந்த பெருமகிழ்ச்சி’ இந்தக் கூட்டு வலியுறுத்தலைச் சுருக்காமல் இயல்பாகப் பாதுகாக்கிறது.
