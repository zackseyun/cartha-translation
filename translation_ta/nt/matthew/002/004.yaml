id: MAT.2.4
reference: Matthew 2:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ συναγαγὼν πάντας τοὺς ἀρχιερεῖς καὶ γραμματεῖς τοῦ λαοῦ ἐπυνθάνετο παρ’ αὐτῶν ποῦ ὁ χριστὸς γεννᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/004.yaml
  text: And gathering together all the chief priests and scribes of the people[a], he was inquiring of them where the Messiah was to be born.
translation:
  language: ta
  text: மக்களின் தலைமைக் குருக்கள், மறைநூல் அறிஞர்கள் ஆகிய அனைவரையும் அவன் ஒன்றுகூட்டி, மெசியா[a] எங்கே பிறப்பார் என்று அவர்களிடம் விசாரித்துக்கொண்டிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்து.” இங்குள்ள கிரேக்கப் பட்டமான Χριστός, யூத மெசியா எதிர்பார்ப்பின் சூழலைப் பாதுகாக்க “மெசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: συναγαγὼν
  choice: ஒன்றுகூட்டி
  rationale: இறந்தகால வினையெச்சம் முதன்மைச் செயலுக்கு முன்னதாக நடந்த கூட்டிச் சேர்த்தலைக் காட்டுகிறது; தமிழில் ‘ஒன்றுகூட்டி’ இயல்பாக அந்த வரிசையைத் தருகிறது.
- source_word: πάντας
  choice: அனைவரையும்
  rationale: தலைமைக் குருக்கள், மறைநூல் அறிஞர்கள் ஆகிய இரு குழுக்களையும் முழுமையாகக் குறிக்கும் கிரேக்கச் சொல்லின் வலிமையைப் பாதுகாக்கிறது.
- source_word: ἀρχιερεῖς
  choice: தலைமைக் குருக்கள்
  rationale: ஒரே தலைமைக் குருவின் பதவியைக் குறிக்காமல், மூத்த குருத்துவத் தலைமையினரைக் குறிக்கும் பன்மையைத் தெளிவாக வழங்குகிறது.
- source_word: γραμματεῖς
  choice: மறைநூல் அறிஞர்கள்
  rationale: நகலெழுதுவோர் என்ற குறுகிய பொருளை விட, யூத மறைநூல்களிலும் திருச்சட்டத்திலும் தேர்ச்சி பெற்ற இந்தக் குழுவின் பங்கை நவீன வாசகருக்குத் தெளிவாக்குகிறது.
- source_word: τοῦ λαοῦ
  choice: மக்களின்
  rationale: கிரேக்க உரையின் பொதுவான ‘மக்கள்’ என்ற உடைமைத் தொடர்பைப் பாதுகாத்து, பிரதான உரையில் இனவிளக்கத்தைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: ἐπυνθάνετο παρ’ αὐτῶν
  choice: அவர்களிடம் விசாரித்துக்கொண்டிருந்தான்
  rationale: நடந்துகொண்டிருந்த விசாரணையைச் சுட்டும் imperfect வடிவத்தைத் தமிழில் தொடர்நிலை வினையாக வெளிப்படுத்துகிறது.
- source_word: ποῦ
  choice: எங்கே
  rationale: நேரடியான இடவினாவை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ὁ χριστὸς
  choice: மெசியா
  rationale: இங்கு எதிர்பார்க்கப்பட்ட அபிஷேகம் பெற்ற அரசரைக் குறிக்கும் பட்டமாக இருப்பதால், யூத மெசியா எதிர்பார்ப்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: γεννᾶται
  choice: பிறப்பார்
  rationale: இறைவாக்கின்படி எதிர்பார்க்கப்பட்ட பிறப்பைப் பற்றிய மறைமுக வினாவில் உள்ள நிகழ்காலச் செயலற்ற வடிவத்தை, தமிழில் இயல்பான எதிர்கால மரியாதை வடிவில் வழங்குகிறது.
theological_decisions:
- issue: Χριστός என்ற பட்டத்தின் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: ஏரோது யூத இறைவாக்கின்படி எதிர்பார்க்கப்பட்ட அபிஷேகம் பெற்ற ஆட்சியாளரின் பிறப்பிடத்தை விசாரிக்கும் சூழலில், இது பெயராக அல்லாமல் பட்டமாகச் செயல்படுகிறது. ‘மெசியா’ என்பது அந்த யூதச் சூழலைப் பாதுகாக்கிறது; மாற்று வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘வேதபாரகர்’ போன்ற பழைய வழக்குக்குப் பதிலாக ‘மறைநூல் அறிஞர்கள்’ பயன்படுத்தப்பட்டது; கிரேக்க imperfect-இன் தொடர்நிலை ‘விசாரித்துக்கொண்டிருந்தான்’ என்பதில் பாதுகாக்கப்பட்டது.
