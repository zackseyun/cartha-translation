reference: Matthew 2:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν αὐτῷ· Ἐν Βηθλέεμ τῆς Ἰουδαίας· οὕτως γὰρ γέγραπται διὰ τοῦ προφήτου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/005.yaml
  text: And they said to him[a], “In Bethlehem of Judea[b], for thus it has been written through the prophet:”
translation:
  language: ta
  text: அவர்கள் அவனிடம், “யூதேயாவிலுள்ள பெத்லகேமில்; ஏனெனில் இறைவாக்கினர் வாயிலாக இவ்வாறு எழுதப்பட்டுள்ளது:[a]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எழுதப்பட்டிருக்கிறது” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் இது வேதவசனத்தை மேற்கோள் காட்டப் பொதுவாகப் பயன்படுத்தப்படும் நிறைவு காலச் செயப்பாட்டு வினை வடிவம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: அதற்கு அவர்கள்
  rationale: முந்தைய வசனத்திலுள்ள தலைமைக் குருக்களையும் மறைநூல் அறிஞர்களையும் சுட்டுகிறது; δέ இங்கு வலுவான எதிர்மறையல்ல, உரையாடலைத் தொடரும் மென்மையான இணைப்பு.
- source_word: εἶπαν αὐτῷ
  choice: அவனிடம் ... என்றார்கள்
  rationale: எளிய உரையாடல் அறிக்கை; தமிழ் மேற்கோள் அமைப்புக்கேற்ப வினைச்சொல் மேற்கோளுக்குப் பின் வைக்கப்பட்டது.
- source_word: Ἐν Βηθλέεμ τῆς Ἰουδαίας
  choice: யூதேயாவிலுள்ள பெத்லகேமில்
  rationale: τῆς Ἰουδαίας எந்தப் பெத்லகேம் என்பதை அடையாளப்படுத்துகிறது; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் இடத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: οὕτως γὰρ
  choice: ஏனெனில் ... இவ்வாறு
  rationale: γάρ முந்தைய பதிலுக்கான காரணத்தை அறிமுகப்படுத்துகிறது; οὕτως அடுத்த வசனத்தில் வரும் மேற்கோளை முன்னோக்கிச் சுட்டுகிறது.
- source_word: γέγραπται
  choice: எழுதப்பட்டுள்ளது
  rationale: இது நிறைவு செயல்பாட்டு வினையின் செயப்பாட்டு வடிவமும் வேதமேற்கோட்டுக்கான வழக்கமான சொற்றொடரும் ஆகும்; கடந்த காலத்தில் எழுதப்பட்டு தற்போதும் நிலைத்திருப்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: διὰ τοῦ προφήτου
  choice: இறைவாக்கினர் வாயிலாக
  rationale: διά + மரபுவேற்றுமை இடைமுகத்தைக் குறிக்கிறது; இறைவாக்கினர் செய்தியை வழங்கும் மனித வழிமூலம் என்ற நுணுக்கத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: இறைவாக்கின் இடைமுகச் சூத்திரம்
  choice: இறைவாக்கினர் வாயிலாக
  alternative: இறைவாக்கினரால்
  rationale: மூலத்தின் διά + மரபுவேற்றுமை அமைப்பில் உள்ள இடைமுகப் பொருளைத் தக்கவைத்து, செய்தியின் இறுதி மூலத்தைப் பற்றி மொழிபெயர்ப்பே கூடுதல் தீர்மானம் செய்யாமல் விடுகிறது.
- issue: γέγραπται என்பதன் கால-பண்பு
  choice: எழுதப்பட்டுள்ளது
  alternative: எழுதப்பட்டிருக்கிறது
  rationale: வேதமேற்கோட்டு சூத்திரத்தையும் எழுதப்பட்டதன் தொடர்ந்த நிலைப்பாட்டையும் தக்கவைக்கும் கண்ணியமான நவீன தமிழ் வடிவம்.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான மேற்கோள் அமைப்பு பயன்படுத்தப்பட்டுள்ளது. ‘இறைவாக்கினர்’ என்பது προφήτης என்பதற்கான தெளிவான, கண்ணியமான சொல். அரைப்புள்ளி நேரடியான பதிலையும் அதை ஆதரிக்கும் வேதமேற்கோட்டு அறிமுகத்தையும் வேறுபடுத்துகிறது.
