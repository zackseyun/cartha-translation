  text: Τότε Ἡρῴδης λάθρᾳ καλέσας τοὺς μάγους ἠκρίβωσεν παρ’ αὐτῶν τὸν χρόνον τοῦ φαινομένου ἀστέρος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/007.yaml
  text: Then Herod secretly summoned the magi and determined from them the time when the star had appeared,[a]
translation:
  language: ta
  text: அப்போது ஏரோது, மாகிகளை இரகசியமாக அழைத்து, நட்சத்திரம் தோன்றிய காலத்தை அவர்களிடமிருந்து துல்லியமாகத் தெரிந்துகொண்டான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மாகிகள் என்பவர்கள் கிழக்கத்திய ஜோதிட அறிவும் கல்வியும் பெற்ற ஞானிகள்; இதை “ஞானிகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: அப்போது
  rationale: அடுத்த நிகழ்வை அறிமுகப்படுத்தும் காலக் குறிப்பு; இயல்பான தமிழ் கதைநடையைப் பேணுகிறது.
- source_word: Ἡρῴδης
  choice: ஏரோது
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயரெழுத்தாக்கம்.
- source_word: λάθρᾳ
  choice: இரகசியமாக
  rationale: செயல் மறைவாக நடைபெற்றதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: καλέσας
  choice: அழைத்து
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைத் தமிழ் வினையெச்ச வடிவில் இயல்பாக வெளிப்படுத்துகிறது; சூழலில் திட்டமிட்ட அழைப்பையும் தாங்குகிறது.
- source_word: τοὺς μάγους
  choice: மாகிகளை
  rationale: μάγοι என்பதன் தனித்த வரலாற்று-பண்பாட்டு அடையாளத்தைப் பேணும் நேரடி ஒலிபெயர்ப்பு; பிற்கால மரபுச் சித்திரங்களைச் சேர்ப்பதில்லை.
- source_word: ἠκρίβωσεν
  choice: துல்லியமாகத் தெரிந்துகொண்டான்
  rationale: விசாரித்து சரியான தகவலை உறுதிப்படுத்திக்கொண்டான் என்ற வினையின் துல்லியப் பொருளை நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: παρ’ αὐτῶν
  choice: அவர்களிடமிருந்து
  rationale: παρά + genitive குறிக்கும் தகவலின் மூலத்தை நேரடியாகப் பேணுகிறது.
- source_word: τὸν χρόνον
  choice: காலத்தை
  rationale: நட்சத்திரம் தோன்றிய நேரம் அல்லது காலப்புள்ளியைக் குறிக்கும் இயல்பான தமிழ் சொல்.
- source_word: τοῦ φαινομένου ἀστέρος
  choice: நட்சத்திரம் தோன்றிய
  rationale: கிரேக்கப் பெயரெச்சத் தொடரை இயல்பான தமிழ் சார்பு வாக்கியமாக மாற்றுகிறது; தோற்ற நிகழ்வைச் சுட்டுகிறது.
