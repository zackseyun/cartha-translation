id: MAT.2.20
reference: Matthew 2:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ πορεύου εἰς γῆν Ἰσραήλ, τεθνήκασιν γὰρ οἱ ζητοῦντες τὴν ψυχὴν τοῦ παιδίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/020.yaml
  text: saying[a], “Get up, take the child and his mother, and go to the land of Israel, for those seeking the child’s life are dead.”
translation:
  language: ta
  text: என்று சொல்லி, “எழுந்து, குழந்தையையும் அதன் தாயையும் கூட்டிக்கொண்டு இஸ்ரவேல் நாட்டிற்குச் செல். ஏனெனில் குழந்தையின் உயிரைப் பறிக்கத் தேடியவர்கள் இறந்துவிட்டார்கள்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “குழந்தையின் உயிரைத் தேடியவர்கள் இறந்திருக்கிறார்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: τεθνήκασιν என்ற கிரேக்க நிறைவுக்கால வினை, இறந்த நிகழ்வின் தற்போதைய விளைவுநிலையையும் சுட்டுகிறது; மேலும் மூலத்தின் ‘உயிரைத் தேடுதல்’ என்ற சொற்தொடருக்கான நெருக்கமான மாற்றை வழங்குகிறது.
lexical_decisions:
- source_word: λέγων
  choice: என்று சொல்லி
  rationale: முந்தைய வசனத்துடன் தொடர்புடைய நிகழ்கால வினையெச்சத்தைத் தமிழில் இயல்பாகவும் தொடர்ச்சியைப் பேணியும் காட்டுகிறது.
- source_word: Ἐγερθείς
  choice: எழுந்து
  rationale: கட்டளைக்கு முன் வரும் கிரேக்க இறந்தகால வினையெச்சத்தின் இடியோமாட்டிக் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: παράλαβε
  choice: அழைத்துக்கொண்டு
  rationale: ஒருவரைத் தன்னுடன் கூட்டிச் செல்லுதல் என்ற இச்சூழலின் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τὸ παιδίον
  choice: குழந்தை
  rationale: παιδίον என்பதன் பொதுவான பொருளை வயது குறித்த தேவையற்ற கூடுதல் குறிப்பின்றி தருகிறது.
- source_word: τὴν μητέρα αὐτοῦ
  choice: அதன் தாய்
  rationale: கிரேக்க உரையின் உடைமைத் தொடர்பைப் பேணுகிறது; குழந்தையைச் சுட்டும் தமிழின் இயல்பான அஃறிணைப் பயன்பாடு.
- source_word: πορεύου
  choice: போ
  rationale: எளிய கட்டளையாக உள்ள கிரேக்கச் சொல்லுக்கு நேரான, இயல்பான தமிழ் இணை.
- source_word: εἰς γῆν Ἰσραήλ
  choice: இஸ்ரவேல் நாட்டுக்கு
  rationale: γῆ என்பதன் நிலப்பரப்பு/நாடு என்ற புவியியல் பொருளைப் பேணுகிறது.
- source_word: τεθνήκασιν
  choice: இறந்துவிட்டார்கள்
  rationale: மரணம் நிகழ்ந்து அதன் விளைவு தொடர்கிறது என்பதை கிரேக்க நிறைவுக்காலத்திற்கு ஏற்ற இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: οἱ ζητοῦντες τὴν ψυχὴν τοῦ παιδίου
  choice: குழந்தையைக் கொல்லத் தேடியவர்கள்
  rationale: ‘ஒருவரின் உயிரைத் தேடுதல்’ என்ற கிரேக்க மரபுத்தொடர் இச்சூழலில் அவரைக் கொல்ல முயல்வதைக் குறிக்கிறது; சொற்சொல்லான தமிழ் தவறாகப் புரிந்துகொள்ளப்படக்கூடும் என்பதால் அதன் பொருள் தெளிவாகத் தரப்படுகிறது.
theological_decisions:
- issue: மரண அச்சுறுத்தல் சூழலில் ψυχή என்பதன் பொருள்
  choice: குழந்தையைக் கொல்ல
  alternative: குழந்தையின் உயிரைத் தேட
  rationale: இங்கு ψυχή என்பது உடலிலிருந்து வேறுபட்ட ‘ஆத்துமா’வைக் குறிக்காமல், குழந்தையின் உயிரைக் குறிக்கிறது. முழு மரபுத்தொடரும் குழந்தையைக் கொல்ல முயல்வதைக் குறிக்கும்; ஆகவே சூழலின் பொருள் தெளிவாக வழங்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட உரை. நேரடி பேச்சின் கட்டளைத் தொனியும் முந்தைய வசனத்துடனான வினையெச்சத் தொடர்பும் பேணப்பட்டுள்ளன.
