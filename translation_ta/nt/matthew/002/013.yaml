  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἀναχωρησάντων δὲ αὐτῶν ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ φεῦγε εἰς Αἴγυπτον, καὶ ἴσθι ἐκεῖ ἕως ἂν εἴπω σοι· μέλλει γὰρ Ἡρῴδης ζητεῖν τὸ παιδίον τοῦ ἀπολέσαι αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/013.yaml
  text: After they had departed[a], behold, an angel of the Lord appeared to Joseph in a dream, saying, “Get up, take the child and his mother, and flee to Egypt, and stay there until I tell you[c][b]; for Herod is about to seek the child in order to destroy him.”
translation:
  language: ta
  text: அவர்கள் புறப்பட்டுச் சென்றபின், இதோ, ஆண்டவருடைய தூதர் ஒருவர் யோசேப்புக்குக் கனவில் தோன்றி, “எழுந்து, குழந்தையையும் அவனுடைய தாயையும் அழைத்துக்கொண்டு எகிப்துக்குத் தப்பி ஓடு. நான் உனக்குச் சொல்லும்வரை அங்கேயே இரு. ஏனெனில், ஏரோது அந்தக் குழந்தையை அழித்துவிடுவதற்காக[c] தேடப்போகிறான்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: கிரேக்கத்தில் “தேட இருக்கிறான்”; விரைவில் செயல்படுத்தப்படவுள்ள நோக்கத்தை இது குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: “அதைக் கொன்றுவிடுவதற்காக” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் “அழித்துவிட” என்று உள்ளது; இங்கு குழந்தையின் உயிரைப் பறிப்பதே பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναχωρησάντων δὲ αὐτῶν
  choice: அவர்கள் புறப்பட்டுச் சென்றபின்
  rationale: முந்தைய நிகழ்வுக்குப் பிந்தைய செயலைக் குறிக்கும் genitive absolute அமைப்பை இயல்பான தமிழில் காலவரிசையுடன் தருகிறது; ‘அவர்கள்’ என்பது முந்தைய சூழலில் வந்த ஞானிகளைக் குறிக்கிறது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: திடீரென நிகழும் தெய்வீகத் தலையீட்டை வலியுறுத்தும் மத்தேயுவின் உயிரோட்டமான கதைச் சுட்டியைத் தக்கவைக்கிறது.
- source_word: ἄγγελος κυρίου
  choice: ஆண்டவருடைய தூதர் ஒருவர்
  rationale: கிரேக்கத்தில் குறிப்புச் சுட்டு இல்லாததால் இயல்பாகத் தெளிவற்ற ஒருவரைக் குறிக்கும் வடிவம் பயன்படுத்தப்பட்டது; κύριος என்பதற்கு மரபும் சூழலும் ஏற்ற ‘ஆண்டவர்’ தரப்பட்டது.
- source_word: φαίνεται κατ’ ὄναρ τῷ Ἰωσὴφ
  choice: யோசேப்புக்குக் கனவில் தோன்றி
  rationale: கிரேக்க நிகழ்காலத்தைத் தமிழ்க் கதைநடைக்கு ஏற்ற இறந்தகாலத் தொடர்பெச்சமாக வழங்கி, κατ’ ὄναρ என்ற மரபுத்தொடரின் பொருளை ‘கனவில்’ எனத் தெளிவாகக் காட்டுகிறது.
- source_word: Ἐγερθεὶς παράλαβε
  choice: எழுந்திரு; … அழைத்துக்கொண்டு
  rationale: கட்டளைத் தொடரில் பங்கேற்புச் சொல் கட்டளை வலிமை பெறுவதைக் ‘எழுந்திரு’ எனவும், παράλαβε-யின் உடன் கூட்டிச் செல்லும் பொருளை ‘அழைத்துக்கொண்டு’ எனவும் இயல்பாகத் தருகிறது.
- source_word: τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ
  choice: குழந்தையையும் அதன் தாயையும்
  rationale: αὐτοῦ குழந்தையைக் குறிக்கிறது என்பதைத் தெளிவுபடுத்துகிறது; இயேசுவின் பாலினம் வாசகச் சூழலில் தெரிந்தாலும், மூலத்தின் பெயர்ச்சொல் அமைப்பை நெருக்கமாகப் பின்பற்ற ‘அதன்’ பயன்படுத்தப்பட்டது.
- source_word: φεῦγε εἰς Αἴγυπτον
  choice: எகிப்துக்குத் தப்பி ஓடு
  rationale: φεῦγε சொல்லில் உள்ள ஆபத்து மற்றும் அவசர உணர்வை நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἴσθι ἐκεῖ ἕως ἂν εἴπω σοι
  choice: நான் உனக்குச் சொல்லும்வரை அங்கேயே இரு
  rationale: சொற்பொருளான ‘அங்கே இரு’ என்பதின் தொடர்ந்திருக்கும் கட்டளை வலிமையையும், நிர்ணயிக்கப்படாத எதிர்கால எல்லையையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: μέλλει … ζητεῖν
  choice: தேடப்போகிறான்
  rationale: ஏரோதின் நோக்கம் விரைவில் செயலாகும் என்ற μέλλει-யின் அண்மை எதிர்கால வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: τοῦ ἀπολέσαι αὐτό
  choice: அதை அழித்துவிடுவதற்காக
  rationale: ἀπόλλυμι என்பதன் அடிப்படை ‘அழித்தல்’ பொருளைத் தக்கவைக்கிறது; இச்சூழலில் அது குழந்தையைக் கொல்வதைக் குறிக்கிறது.
theological_decisions:
- issue: ἄγγελος κυρίου என்பதில் κύριος-ஐ மொழிபெயர்த்தல்
  choice: ஆண்டவருடைய தூதர் ஒருவர்
  alternative: கர்த்தருடைய தூதர் ஒருவர்
  rationale: ‘ஆண்டவர்’ என்பது நவீன நிலையான தமிழில் κύριος என்ற தெய்வீகப் பட்டத்தை இயல்பாகவும் மரியாதையுடனும் தருகிறது; குறிப்பிட்ட ஒரு தூதர்தான் என்று உரை கூறுவதைவிட அதிகமாகத் தீர்மானிக்காமல் ‘ஒருவர்’ சேர்க்கப்பட்டது.
- issue: ἀπολέσαι என்பதன் மரணம் சார்ந்த பொருள்
  choice: அழித்துவிடுவதற்காக
  alternative: கொன்றுவிடுவதற்காக
  rationale: மூலச்சொல்லின் பரந்த ‘அழித்தல்’ பொருளை முதன்மை உரையில் காத்து, இச்சூழலில் உயிரைக் கொல்வதே நோக்கம் என்பதை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified கதைநடை பயன்படுத்தப்பட்டது. ‘இதோ’ மூலம் மூலத்தின் திடீர் கவன ஈர்ப்பு தக்கவைக்கப்பட்டது; கட்டளைகள் நேரடியாகவும் அவசர உணர்வுடனும் அமைக்கப்பட்டன. ‘கர்த்தர்’ என்பதற்குப் பதில் பரவலாகப் புரியும் ‘ஆண்டவர்’ தேர்ந்தெடுக்கப்பட்டது.
