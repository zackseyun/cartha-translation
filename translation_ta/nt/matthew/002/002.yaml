id: MAT.2.2
reference: Matthew 2:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγοντες· Ποῦ ἐστιν ὁ τεχθεὶς βασιλεὺς τῶν Ἰουδαίων; εἴδομεν γὰρ αὐτοῦ τὸν ἀστέρα ἐν τῇ ἀνατολῇ καὶ ἤλθομεν προσκυνῆσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/002.yaml
  text: saying[b][a], “Where is the one who has been born king of the Jews? For we saw his star in the east and have come to pay him homage.”
translation:
  language: ta
  text: அவர்கள், “யூதர்களின் அரசராகப் பிறந்தவர் எங்கே இருக்கிறார்? ஏனெனில், அவருடைய நட்சத்திரத்தைக் கிழக்கில்[a] கண்டோம்; அவரை வணங்குவதற்காக[b] வந்திருக்கிறோம்” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அது உதித்தபோது.” ἐν τῇ ἀνατολῇ என்ற கிரேக்கத் தொடர் “கிழக்கில்” என்றும், நட்சத்திரம் “உதித்தபோது” என்றும் பொருள்படலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “அவர்முன் பணிந்து மரியாதை செலுத்துவதற்காக.” இங்குள்ள கிரேக்க வினைச்சொல் சூழலுக்கேற்ப அரசருக்குச் செலுத்தும் மரியாதையையோ வழிபாட்டையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: என்று கேட்டார்கள்
  rationale: இது அவர்களுடைய நேரடிக் கூற்றை அறிமுகப்படுத்தும் நிகழ்கால வினையெச்சம். அவர்கள் கூறுவது ஒரு கேள்வியாக இருப்பதால், தமிழில் இயல்பான கதைநடைக்கேற்ப ‘என்று கேட்டார்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: Ποῦ ἐστιν
  choice: எங்கே?
  rationale: இடத்தைப் பற்றிய நேரடியான கேள்வியை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ὁ τεχθεὶς
  choice: பிறந்தவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் இறந்தகாலச் செயப்பாட்டு வினையெச்சத்தின் பொருளைத் தருகிறது; ‘பச்சிளங்குழந்தை’ போன்ற மூலத்தில் இல்லாத வயதுக் குறிப்பைச் சேர்க்கவில்லை.
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: யூதர்களின் அரசர்
  rationale: அரசியல் மற்றும் மெசியா சார்ந்த அரச பட்டத்தின் இயல்பான தமிழ் வடிவம்.
- source_word: εἴδομεν γὰρ
  choice: கண்டோம்
  rationale: γάρ தரும் காரணத் தொடர்பு தமிழில் அடுத்த கூற்றின் சூழலால் தெளிவாக இருப்பதால் தனியாக ‘ஏனெனில்’ சேர்க்காமல் இயல்பாகத் தரப்பட்டுள்ளது; εἴδομεν இறந்தகாலமாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: αὐτοῦ τὸν ἀστέρα
  choice: அவருடைய நட்சத்திரத்தை
  rationale: உடைமைப் பொருளை நேரடியாகத் தருகிறது; அந்த வானியல் அடையாளத்தின் இயல்பைப் பற்றி கூடுதல் விளக்கம் சேர்க்கவில்லை.
- source_word: ἐν τῇ ἀνατολῇ
  choice: கிழக்கில்
  rationale: இந்தக் கிரேக்கத் தொடர் திசையையோ நட்சத்திரத்தின் உதயத்தையோ குறிக்கக்கூடும். முதன்மை உரையில் மரபானதும் சூழலுக்குப் பொருத்தமானதுமான ‘கிழக்கில்’ வைக்கப்பட்டு, மற்ற பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: ἤλθομεν
  choice: வந்திருக்கிறோம்
  rationale: அவர்கள் வந்து தற்போது அங்கே இருப்பதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: προσκυνῆσαι αὐτῷ
  choice: அவரை வணங்குவதற்காக
  rationale: ‘வணங்கு’ என்பது அரசருக்குச் செலுத்தும் பணிவான மரியாதையையும் வழிபாட்டையும் சூழலுக்கேற்ப குறிக்கக்கூடியது; ஆகவே கிரேக்கச் சொல்லின் பொருள் வரம்பையும் இவ்வசனத்தின் இறையியல் அழுத்தத்தையும் முன்கூட்டியே தீர்க்காமல் காக்கிறது.
theological_decisions:
- issue: குழந்தை இயேசுவைக் குறித்த προσκυνῆσαι என்பதன் பொருள்
  choice: அவரை வணங்குவதற்காக
  alternative: அவர்முன் பணிந்து மரியாதை செலுத்துவதற்காக / அவரை வழிபடுவதற்காக
  rationale: இச்சொல் அரசருக்குரிய பணிவான மரியாதையையோ கடவுளுக்குரிய வழிபாட்டையோ குறிக்கலாம். இங்கு ‘யூதர்களின் அரசர்’ என்பதே உடனடி சூழல்; அதேவேளை மத்தேயுவின் விரிவான கிறிஸ்துவியல் அர்த்தத்தை மறுக்கவும் கூடாது. தமிழ் ‘வணங்கு’ இரு சாத்தியங்களையும் இயல்பாகத் திறந்துவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அரசர்’ என்பது பட்டத்திற்கும், ‘வந்திருக்கிறோம்’ என்பது பேசும் நேரத்தில் தொடரும் வருகையின் விளைவிற்கும் இயல்பாக அமைகின்றன. ‘வணங்கு’ என்ற சொல் மூலத்தின் திட்டமிட்ட பொருள் விரிவைத் தமிழிலும் காக்கிறது.
