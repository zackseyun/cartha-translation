id: MAT.2.1
reference: Matthew 2:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τοῦ δὲ Ἰησοῦ γεννηθέντος ἐν Βηθλέεμ τῆς Ἰουδαίας ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως, ἰδοὺ μάγοι ἀπὸ ἀνατολῶν παρεγένοντο εἰς Ἱεροσόλυμα
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/001.yaml
  text: After Jesus was born in Bethlehem of Judea in the days of Herod the king[a], behold, wise men from the east arrived in Jerusalem,
translation:
  language: ta
  text: இயேசு யூதேயாவிலுள்ள பெத்லகேமில் ஏரோது அரசனின் காலத்தில் பிறந்த பின்பு, இதோ, கிழக்கிலிருந்து ஞானிகள்[a] எருசலேமுக்கு வந்து சேர்ந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மாகிகள்.” இந்தக் கிரேக்கச் சொல் கிழக்கத்திய கல்வியறிவாளர்களைக் குறிக்கிறது; அவர்கள் சோதிடம் அல்லது அரசவை ஞானத்துடன் தொடர்புடையவர்களாக இருந்திருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γεννηθέντος
  choice: இயேசு ... பிறந்த பின்பு
  rationale: முதன்மை நிகழ்வுக்கு முன் நடந்த பின்னணிச் சூழலைக் குறிக்கும் genitive absolute அமைப்பை இயல்பான தமிழில் காலத் தொடர்புடன் வெளிப்படுத்துகிறது. δέ இங்கு மென்மையான கதைத் தொடர்ச்சிக் குறியீடாக இருப்பதால் தனிச் சொல்லாக மொழிபெயர்க்கப்படவில்லை.
- source_word: Βηθλέεμ τῆς Ἰουδαίας
  choice: யூதேயாவிலுள்ள பெத்லகேம்
  rationale: அந்த ஊரை வேறு பெத்லகேம்களிலிருந்து வேறுபடுத்தும் புவியியல் தொடர்பை நவீன தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως
  choice: ஏரோது அரசனின் காலத்தில்
  rationale: கிரேக்க வரலாற்றுக் காலக் குறிப்பின் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; ‘நாட்களில்’ என்ற சொற்சொல் வடிவத்தைவிட தற்போதைய தமிழில் ‘காலத்தில்’ எளிதாகப் புரிகிறது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: அடுத்து வரும் நிகழ்வின் மீது வாசகரின் கவனத்தைத் திருப்பும் குறியீட்டின் வலிமையைத் தக்கவைக்கிறது.
- source_word: μάγοι
  choice: ஞானிகள்
  rationale: கிழக்கிலிருந்து வந்த கல்வியறிவுடைய வல்லுநர்களைச் சாதாரண வாசகர்கள் புரிந்துகொள்ளும் வகையில் குறிக்கிறது. கிரேக்கச் சொல்லின் தொழில்நுட்பப் பின்னணி அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀπὸ ἀνατολῶν
  choice: கிழக்கிலிருந்து
  rationale: பன்மை வடிவிலுள்ள கிரேக்கத் திசைச்சொல்லின் கூட்டுப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: παρεγένοντο εἰς Ἱεροσόλυμα
  choice: எருசலேமுக்கு வந்து சேர்ந்தார்கள்
  rationale: இலக்கை நோக்கிய இயக்கத்தையும் அங்கு வந்தடைந்ததையும் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: μάγοι என்பதைப் பிற்கால மரபுகளைப் புகுத்தாமல் மொழிபெயர்த்தல்
  choice: ஞானிகள்
  alternative: மாகிகள்; சோதிடர்கள்
  rationale: மூலச்சொல் கிழக்கத்திய கல்வியறிவாளர்கள், சோதிடம் அல்லது அரசவை ஞானத்துடன் தொடர்புடைய வல்லுநர்கள் என்பதைக் குறிக்கலாம். ‘ஞானிகள்’ அவர்களை அரசர்கள் என்றோ குறிப்பிட்ட எண்ணிக்கையினர் என்றோ கூறாமல் வாசிக்கத்தக்க வடிவைத் தருகிறது; சாத்தியமான தொழில்நுட்பப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான மொழி பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்ற கவன ஈர்ப்புச் சொல் மூலத்தின் கதைநடை வலிமையைத் தக்கவைக்கிறது; பிற்கால மரபுகளில் காணப்படும் எண்ணிக்கை அல்லது அரச அந்தஸ்து சேர்க்கப்படவில்லை.
