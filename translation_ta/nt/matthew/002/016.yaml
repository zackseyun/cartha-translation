revisions:
- from: அப்போது ஏரோது, சாஸ்திரிகள்[a] தன்னை ஏமாற்றிவிட்டதை அறிந்து, கடுங்கோபமடைந்தான். அவர்களை அனுப்பி, சாஸ்திரிகளிடமிருந்து தான் துல்லியமாகத் தெரிந்துகொண்ட காலத்தின்படி, பெத்லகேமிலும் அதைச் சுற்றியுள்ள எல்லாப் பகுதிகளிலும் இருந்த இரண்டு வயதும் அதற்குக் கீழும் உள்ள ஆண் குழந்தைகள் அனைவரையும் கொன்றான்.[b]
  to: அப்போது ஏரோது, மாகிகள்[a] தன்னை ஏமாற்றிவிட்டதை[b] அறிந்து, மிகவும் கோபமடைந்தான். அவன் ஆட்களை அனுப்பி, பெத்லகேமிலும் அதைச் சுற்றியுள்ள எல்லாப் பகுதிகளிலும் இருந்த இரண்டு வயதுடையவர்களும் அதற்குக் குறைந்த வயதுடையவர்களுமான எல்லா ஆண் குழந்தைகளையும், மாகிகளிடமிருந்து அவன் துல்லியமாக அறிந்துகொண்ட காலத்தின்படி கொன்றான்.
  rationale: மூலத்தின் பொருளை மாற்றாமல், அனுப்பப்பட்டவர்கள் யார் என்பதில் ஏற்பட்ட தமிழ்ச் சுட்டுப்பெயர் தெளிவின்மையை நீக்கினேன். μάγοι-க்கு வரலாற்று அடையாளத்தைப் பாதுகாக்கும் ‘மாகிகள்’ பயன்படுத்தப்பட்டு, வாசகர் புரிதலுக்கான விளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது. வயது வரம்பு, எல்லாப் பகுதிகள், மாகிகளிடமிருந்து துல்லியமாக அறிந்த காலம் ஆகிய அனைத்தும் காக்கப்பட்டுள்ளன; அடிக்குறிப்பு குறியும் அது விளக்கும் சொல்லோடு இணைக்கப்பட்டுள்ளது.
