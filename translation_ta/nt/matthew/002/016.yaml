id: MAT.2.16
reference: Matthew 2:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τότε Ἡρῴδης ἰδὼν ὅτι ἐνεπαίχθη ὑπὸ τῶν μάγων ἐθυμώθη λίαν, καὶ ἀποστείλας ἀνεῖλεν πάντας τοὺς παῖδας τοὺς ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς ἀπὸ διετοῦς καὶ κατωτέρω, κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/016.yaml
  text: Then Herod[a], seeing that he had been tricked by the magi, became very angry, and sending men, he killed all the boys in Bethlehem and in all its surrounding districts, from two years old and under[b], according to the time that he had determined from the magi.
translation:
  language: ta
  text: அப்போது ஏரோது, மாகிகள்[a] தன்னை ஏமாற்றிவிட்டதை[b] அறிந்து, மிகவும் கோபமடைந்தான். அவன் ஆட்களை அனுப்பி, பெத்லகேமிலும் அதைச் சுற்றியுள்ள எல்லாப் பகுதிகளிலும் இருந்த இரண்டு வயதுடையவர்களும் அதற்குக் குறைந்த வயதுடையவர்களுமான எல்லா ஆண் குழந்தைகளையும், மாகிகளிடமிருந்து அவன் துல்லியமாக அறிந்துகொண்ட காலத்தின்படி கொன்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கச் சொல் ‘மாகிகள்’ கிழக்கத்திய ஞானிகளையும் வானியல் அல்லது சோதிட அறிவுடையவர்களையும் குறிக்கிறது. பாரம்பரியமாக ‘ஞானிகள்’ என்றும் மொழிபெயர்க்கப்படுகிறது.
    reason: cultural_note
  - marker: b
    text: ‘ஏமாற்றிவிட்டதை’ என்பதற்கான கிரேக்க வினைச்சொல்லை இன்னும் நேரடியாக ‘தன்னை ஏளனம் செய்ததை’ அல்லது ‘தன்னை முட்டாளாக்கியதை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: அப்போது
  rationale: அடுத்த நிகழ்வை அறிமுகப்படுத்தும் இயல்பான கால இணைப்பாக உள்ளது.
- source_word: ἰδὼν ὅτι
  choice: அறிந்து
  rationale: ஏரோது ஒரு உண்மையை உணர்ந்ததையும், அது அவனுடைய கோபத்திற்குக் காரணமானதையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐνεπαίχθη
  choice: ஏமாற்றிவிட்டதை
  rationale: சாஸ்திரிகள் திரும்பிவராததால் ஏரோது தன்னை அவர்கள் ஏமாற்றியதாக அல்லது முட்டாளாக்கியதாக உணர்ந்த சூழல்சார் பொருளைத் தெளிவாகத் தருகிறது; சொற்பொருளான ‘ஏளனம் செய்ததை’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: μάγων
  choice: சாஸ்திரிகள்
  rationale: தமிழ் வேதாகம வழக்கில் அறிமுகமான சொல்; இங்கு கிழக்கத்திய வானியல்/சோதிட அறிவுடைய ஞானிகளைக் குறிக்கிறது என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: ἐθυμώθη λίαν
  choice: கடுங்கோபமடைந்தான்
  rationale: கோபமடைதலை λίαν தீவிரப்படுத்துவதைக் கண்ணியமான, சுருக்கமான தமிழில் தருகிறது.
- source_word: ἀποστείλας
  choice: அவர்களை அனுப்பி
  rationale: கொலையை நிறைவேற்ற ஏரோது ஆட்களை அனுப்பியதைத் தமிழில் தெளிவாக்குகிறது; ‘அவர்களை’ என்பது சூழலால் உணரப்படும் ஆட்களைக் குறிக்கிறது.
- source_word: ἀνεῖλεν
  choice: கொன்றான்
  rationale: இச்சூழலில் ‘கொன்றான்/கொலைசெய்தான்’ என்ற நேரடியான பொருளைத் தருகிறது.
- source_word: πάντας τοὺς παῖδας
  choice: ஆண் குழந்தைகள் அனைவரையும்
  rationale: நிகழ்வின் சூழலில் παῖδας ஆண் குழந்தைகளைக் குறிக்கிறது என்பதைத் தெளிவாகக் கூறுகிறது.
- source_word: ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς
  choice: பெத்லகேமிலும் அதைச் சுற்றியுள்ள எல்லாப் பகுதிகளிலும்
  rationale: ὅρια என்பதன் எல்லை/சுற்றுப்புறப் பிரதேசம் என்ற பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἀπὸ διετοῦς καὶ κατωτέρω
  choice: இரண்டு வயதும் அதற்குக் கீழும் உள்ள
  rationale: இரண்டு வயதை உள்ளடக்கிய உயர்வயது வரம்பைத் துல்லியமாகத் தருகிறது.
- source_word: κατὰ τὸν χρόνον ὃν ἠκρίβωσεν
  choice: தான் துல்லியமாகத் தெரிந்துகொண்ட காலத்தின்படி
  rationale: κατά-வின் ‘அதற்கேற்ப’ என்ற பொருளையும் ἀκριβόω-வின் துல்லியமாக விசாரித்து அறிதல் என்ற கூறையும் காக்கிறது.
theological_decisions:
- issue: μάγοι என்பதன் மொழிபெயர்ப்பு
  choice: சாஸ்திரிகள்
  alternative: ஞானிகள் / மாகிகள்
  rationale: ‘சாஸ்திரிகள்’ தமிழ் வாசகர்களுக்கு அறிமுகமான வேதாகமச் சொல்லாக இருந்தாலும், அவர்கள் வேதபாரகர்கள் என்ற தவறான எண்ணம் வராமல் அவர்களின் கிழக்கத்திய ஞானி-வானியல்/சோதிடர் பின்னணி அடிக்குறிப்பில் தெளிவாக்கப்படுகிறது.
- issue: ἐνεπαίχθη என்பதன் பொருள்
  choice: ஏமாற்றிவிட்டதை
  alternative: ஏளனம் செய்ததை / முட்டாளாக்கியதை
  rationale: சூழலில் அவர்கள் ஏரோதிடம் திரும்பிச் செல்லாததால் அவன் ஏமாற்றப்பட்டதாக உணர்ந்தது முன்னிலையாகிறது; வினையின் நேரடியான ‘ஏளனம் செய்’ என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: παῖδας என்பதன் பாலினக் குறிப்பு
  choice: ஆண் குழந்தைகள்
  alternative: குழந்தைகள்
  rationale: இலக்கண வடிவமும் ஆண் குழந்தையைத் தேடும் கதைக்களச் சூழலும் ஆண் குழந்தைகளைச் சுட்டுகின்றன; பாலினத்தை மறைக்கும் பொதுச் சொல் தவிர்க்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. நீண்ட கிரேக்க வாக்கியத்தின் கருத்து ஒழுங்கு தமிழில் தெளிவாக இருக்கச் செயப்பாட்டு வரிசை சற்றே மாற்றப்பட்டுள்ளது; தகவல்கள் எதுவும் நீக்கப்படவில்லை. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
