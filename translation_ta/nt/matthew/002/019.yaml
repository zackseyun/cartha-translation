source:
  edition: SBLGNT
  text: Τελευτήσαντος δὲ τοῦ Ἡρῴδου ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ ἐν Αἰγύπτῳ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/019.yaml
  text: But after Herod died[a], behold, an angel of the Lord appears in a dream to Joseph in Egypt.
translation:
  language: ta
  text: ஆனால் ஏரோது இறந்த பிறகு, இதோ, ஆண்டவருடைய தூதர் ஒருவர்[a] எகிப்தில் இருந்த யோசேப்புக்குக் கனவில் தோன்றுகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த ஆண்டவருடைய தூதர்.” கிரேக்கத்தில் “தூதர்” என்பதற்கு முன் திட்டவட்டச் சுட்டுருப்பு இல்லை.
    reason: கிரேக்க வடிவம் குறிப்பிட்ட தூதரை கட்டாயப்படுத்தாதபோதும், தமிழில் திட்டவட்டமான மாற்று வடிவமும் சாத்தியமானது; அதன் பாரம்பரிய மற்றும் இடைநூல் தொடர்புகளைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: Τελευτήσαντος δὲ τοῦ Ἡρῴδου
  choice: ஆனால் ஏரோது இறந்த பிறகு
  rationale: இறந்த பிறகு என்பது இறந்துவிட்ட ஏரோதைக் குறிக்கும் இறந்தகால வினையெச்சத்தின் காலத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; δέ குறிக்கும் மென்மையான கதைத் திருப்பை ஆனால் காட்டுகிறது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: வாசகரின் கவனத்தை ஈர்க்கும் மத்தேயுவின் உயிரோட்டமான கதைச் சுட்டியை மரியாதையான, இயல்பான தமிழில் காக்கிறது.
- source_word: ἄγγελος κυρίου
  choice: ஆண்டவருடைய தூதர் ஒருவர்
  rationale: ἄγγελος என்பதற்கு முன் கிரேக்கச் சுட்டுருப்பு இல்லாததை ஒருவர் மூலம் இயல்பான தமிழில் வெளிப்படுத்துகிறது; κυρίου என்பதை ஆண்டவருடைய என்று மொழிபெயர்க்கிறது.
- source_word: φαίνεται
  choice: தோன்றுகிறார்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தின் உயிரோட்டத்தைக் காக்க நிகழ்கால வடிவம் பயன்படுத்தப்படுகிறது.
- source_word: κατ’ ὄναρ
  choice: கனவில்
  rationale: சொப்பனத்தில் வெளிப்பாடு கிடைப்பதைக் குறிக்கும் கிரேக்க மரபுத்தொடருக்கு இயல்பான தமிழ் இணை.
- source_word: τῷ Ἰωσὴφ ἐν Αἰγύπτῳ
  choice: எகிப்தில் இருந்த யோசேப்புக்கு
  rationale: ἐν Αἰγύπτῳ இலக்கணப்படி தோன்றும் நிகழ்வின் இடத்தைக் குறித்தாலும், பொருளில் யோசேப்பு எகிப்தில் இருந்தார் என்பதைக் குழப்பமின்றி இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ἄγγελος κυρίου என்பதில் ἄγγελος-க்கு சுட்டுருப்பு இல்லாமை
  choice: ஆண்டவருடைய தூதர் ஒருவர்
  alternative: ஆண்டவருடைய தூதர்
  rationale: கிரேக்கத்தில் ἄγγελος என்பதற்கு முன் சுட்டுருப்பு இல்லை. எனவே குறிப்பிட்ட ஒரே தனித்த அடையாளமுள்ள தூதர் என்று கட்டாயமாக்காமல் ஒருவர் என முதன்மை உரை தருகிறது; பாரம்பரிய மாற்று வாசிப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: கர்த்தர்
  rationale: ஆண்டவர் என்பது κύριος என்ற பட்டத்திற்கான தெளிவான, நவீன, மரியாதையான பொதுத்தமிழ் வடிவம்; தனிப்பட்ட சமய மரபின் சொல்லாட்சியைத் திணிக்காது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடியதாயும் இலக்கிய மரியாதை உடையதாயும் வடிவமைக்கப்பட்டது. இதோ மற்றும் தோன்றுகிறார் ஆகியவை மூலத்தின் கதை உயிரோட்டத்தைப் பேணுகின்றன.
