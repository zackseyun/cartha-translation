source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὅτι Ἀρχέλαος ⸀βασιλεύει τῆς Ἰουδαίας ἀντὶ ⸂τοῦ πατρὸς αὐτοῦ Ἡρῴδου⸃ ἐφοβήθη ἐκεῖ ἀπελθεῖν· χρηματισθεὶς δὲ κατ’ ὄναρ ἀνεχώρησεν εἰς τὰ μέρη τῆς Γαλιλαίας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/022.yaml
  text: But when he heard that Archelaus was reigning over Judea in place of his father Herod[a], he was afraid to go there. And after being warned in a dream, he withdrew to the regions of Galilee,
translation:
  language: ta
  text: ஆனால், அர்க்கெலாயு தன் தந்தை ஏரோதுக்குப் பதிலாக யூதேயாவை அரசாளுகிறான் என்று அவர் கேள்விப்பட்டபோது, அங்கே போகப் பயந்தார். பின்பு, கனவில் எச்சரிக்கப்பட்டு[a], கலிலேயாவின் பகுதிகளுக்கு விலகிச் சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அறிவுறுத்தப்பட்டு’ என்றும் மொழிபெயர்க்கலாம்; இச்சொல் பொதுவாக இறைவனிடமிருந்து வரும் எச்சரிக்கையையோ அறிவுறுத்தலையோ உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: கேள்விப்பட்டபோது
  rationale: முதன்மைச் செயலுக்கு முந்திய சூழ்நிலையை உணர்த்தும் இறந்தகால வினையெச்சத்தை இயல்பான நவீனத் தமிழில் காலத் தொடர்புடன் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய நோக்கத்துக்கு எதிராக எழுந்த புதிய தடையைச் சுட்டும் கதைத் திருப்பத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: βασιλεύει τῆς Ἰουδαίας
  choice: யூதேயாவை அரசாளுகிறான்
  rationale: βασιλεύω என்பதன் அரச அதிகார நுணுக்கத்தையும், ஆளப்படும் பகுதியைக் குறிக்கும் மரபான தமிழ் வாக்கிய அமைப்பையும் காக்கிறது.
- source_word: ἀντὶ τοῦ πατρὸς αὐτοῦ Ἡρῴδου
  choice: தன் தந்தை ஏரோதுக்குப் பதிலாக
  rationale: ἀντί இங்கு ஒருவரின் இடத்தை மற்றொருவர் ஏற்று ஆள்வதைக் குறிக்கிறது; மூலத்தில் இல்லாத ‘வாரிசாக’ என்ற விளக்கத்தைச் சேர்க்காமல் இதை வெளிப்படுத்துகிறது.
- source_word: ἐφοβήθη ἐκεῖ ἀπελθεῖν
  choice: அங்கே போகப் பயந்தார்
  rationale: அச்சத்தின் காரணமான செயலைத் தமிழில் இயல்பாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: χρηματισθεὶς
  choice: எச்சரிக்கப்பட்டு
  rationale: செயப்படுபொருள் வடிவத்தையும் எச்சரிக்கை என்ற சூழல்சார் பொருளையும் காக்கிறது; எச்சரித்தவர் யார் என்பதை மூலத்தைவிட வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: κατ’ ὄναρ
  choice: கனவில்
  rationale: தூக்கத்தில் பெற்ற வெளிப்பாட்டைக் குறிக்கும் மத்தேயுவின் வழக்கமான சொற்றொடருக்கு இயல்பான தமிழ் இணை.
- source_word: ἀνεχώρησεν
  choice: விலகிச் சென்றார்
  rationale: ஆபத்து அல்லது சூழ்நிலைக்குப் பதிலளித்து நோக்கத்துடன் வேறிடத்திற்குச் செல்வது என்ற ἀναχωρέω வின் நுணுக்கத்தை வெளிப்படுத்துகிறது.
- source_word: εἰς τὰ μέρη τῆς Γαλιλαίας
  choice: கலிலேயாவின் பகுதிகளுக்கு
  rationale: μέρη என்பதன் பன்மையைப் பாதுகாத்து, ஒரு குறிப்பிட்ட இடத்தைக் காட்டிலும் ஒரு பரந்த வட்டாரத்தைச் சுட்டுகிறது.
theological_decisions:
- issue: χρηματισθείς என்ற சொல்லில் எச்சரித்த இறைமூலத்தை வெளிப்படையாகக் குறிப்பிடுவதா
  choice: ‘எச்சரிக்கப்பட்டு’ என்று செயப்படுபொருள் வடிவத்தில் வைத்து, ‘கடவுளால்’ என்பதைச் சேர்க்கவில்லை.
  alternative: ‘கடவுளால் எச்சரிக்கப்பட்டு’ அல்லது ‘இறை அறிவுறுத்தல் பெற்று’
  rationale: மத்தேயுவில் இவ்வினைச்சொல் பொதுவாக இறை எச்சரிக்கை அல்லது அறிவுறுத்தலை உணர்த்தினாலும், இவ்வசனத்தின் கிரேக்க உரை செய்பவரை வெளிப்படையாகக் குறிப்பிடவில்லை. அந்தத் திட்டமிட்ட மறைநிலையை மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையில் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. நபர் மற்றும் இடப்பெயர்களுக்கு பரவலாக அறியப்பட்ட தமிழ் வேதாகம வடிவங்களான ‘அர்க்கெலாயு’, ‘ஏரோது’, ‘யூதேயா’, ‘கலிலேயா’ பயன்படுத்தப்பட்டுள்ளன.
