id: MAT.2.17
reference: Matthew 2:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τότε ἐπληρώθη τὸ ῥηθὲν ⸀διὰ Ἰερεμίου τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/017.yaml
  text: 'Then what was spoken through Jeremiah the prophet was fulfilled[a], saying:'
translation:
  language: ta
  text: 'அப்போது, இறைவாக்கினரான எரேமியா மூலம் உரைக்கப்பட்ட வாக்கு நிறைவேறியது:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: கதையின் நிகழ்வுத் தொடரைக் குறிக்கும் கால வினையடை; நவீன தமிழில் இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: ἐπληρώθη
  choice: நிறைவேறியது
  rationale: πληρόω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவத்தையும் மத்தேயுவின் நிறைவேறுதல் சூத்திரத்தையும் நேரடியாகக் காக்கிறது.
- source_word: τὸ ῥηθὲν
  choice: சொல்லப்பட்டது
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் கிரேக்கப் பங்கேற்புவினையின் ‘சொல்லப்பட்டவை/சொல்லப்பட்டது’ என்ற பொருளை இயல்பான தமிழில் தருகிறது; இங்கு ஒருமை நடுநிலைச் சுட்டை ‘சொல்லப்பட்டது’ எனக் காக்கிறது.
- source_word: διὰ Ἰερεμίου
  choice: எரேமியா மூலம்
  rationale: διά + பிறப்புவேற்றுமை காட்டும் இடைமுகம் அல்லது கருவித்தன்மையை ‘மூலம்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τοῦ προφήτου
  choice: இறைவாக்கினரான
  rationale: எரேமியாவின் தீர்க்கதரிசிப் பணியை அடையாளப்படுத்தும் இயல்பான, கண்ணியமான தமிழ் வடிவம்.
- source_word: λέγοντος
  choice: 'அவர் சொன்னது:'
  rationale: பங்கேற்புவினை எரேமியாவையே இலக்கணரீதியாகச் சார்வதால், அடுத்த வசன மேற்கோளை அறிமுகப்படுத்தும் வகையில் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்தப்படுகிறது.
theological_decisions:
- issue: மத்தேயுவின் நிறைவேறுதல் சூத்திரம்
  choice: ‘நிறைவேறியது’ என்ற வெளிப்படையான மொழியைத் தக்கவைத்தல்
  alternative: ‘நிறைவேறும்படி நடந்தது’ அல்லது ‘வார்த்தைகளை நிறைவேற்றியது’
  rationale: நிகழ்வை இறைவாக்கின் நிறைவேறுதலாக மத்தேயு முன்வைக்கும் இலக்கிய-இறையியல் கூற்றை, கிரேக்கத்தைவிட விரிவாக்காமலும் மென்மையாக்காமலும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. கிரேக்கத்தின் நீண்ட மேற்கோள் அறிமுக அமைப்பு தமிழில் இயல்பாக அமைய அரைப்புள்ளி பயன்படுத்தப்பட்டு, λέγοντος என்பதன் கர்த்தா எரேமியா என்பது ‘அவர் சொன்னது’ எனத் தெளிவாக்கப்பட்டுள்ளது.
