revisions:
- from: அவர் எழுந்து, குழந்தையையும் அதன் தாயையும் அழைத்துக்கொண்டு, இஸ்ரவேல் நாட்டிற்குள் நுழைந்தார்.
  to: அவர் எழுந்து, குழந்தையையும் அந்தக் குழந்தையின் தாயையும் தம்முடன் கூட்டிக்கொண்டு, இஸ்ரவேல் நாட்டிற்குள் நுழைந்தார்.
