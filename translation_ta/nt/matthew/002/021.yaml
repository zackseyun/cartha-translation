source:
  edition: SBLGNT
  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ ⸀εἰσῆλθεν εἰς γῆν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/021.yaml
  text: So he rose, took the child and his mother, and entered the land of Israel.
translation:
  language: ta
  text: அவர் எழுந்து, குழந்தையையும் அந்தக் குழந்தையின் தாயையும் தம்முடன் கூட்டிக்கொண்டு, இஸ்ரவேல் நாட்டிற்குள் நுழைந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: (தனியாக மொழிபெயர்க்கப்படவில்லை)
  rationale: இங்கு δέ வலுவான முரண்பாட்டைக் காட்டாமல் கதைத் தொடர்ச்சியைச் சுட்டுகிறது. தமிழில் வாக்கிய ஓட்டமே அந்தத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துவதால் தனி இணைப்புச்சொல் தேவையில்லை.
- source_word: ἐγερθεὶς
  choice: எழுந்து
  rationale: இச்சூழலில் செயல்பாட்டுப் பொருளுடைய இறந்தகாலப் பெயரெச்சம்; அடுத்த செயலுக்கு முன் நிகழ்ந்ததை இயல்பான தமிழ் வினையெச்சமாகக் காட்டுகிறது.
- source_word: παρέλαβε
  choice: அழைத்துக்கொண்டு
  rationale: παραλαμβάνω இங்கு தன்னுடன் கூட்டிச் செல்வதைக் குறிக்கிறது. வெறும் ‘எடுத்துக்கொண்டு’ என்பதைக் காட்டிலும் மனிதர்களைப் பற்றிய நவீன தமிழில் ‘அழைத்துக்கொண்டு’ இயல்பாக உள்ளது.
- source_word: τὸ παιδίον
  choice: குழந்தையை
  rationale: παιδίον என்பதன் பொதுவான பொருளை, வயது குறித்த தேவையற்ற கூடுதல் விவரமின்றி நேரடியாக வழங்குகிறது.
- source_word: τὴν μητέρα αὐτοῦ
  choice: அதன் தாயை
  rationale: αὐτοῦ என்பது குழந்தையைக் குறிக்கிறது. தமிழில் குழந்தையைச் சுட்டும் ‘அதன்’ இலக்கணரீதியாக இயல்பானது; இவ்வாக்கியத்தில் குறிப்புத் தெளிவையும் காக்கிறது.
- source_word: εἰσῆλθεν
  choice: நுழைந்தார்
  rationale: εἰσέρχομαι என்பதன் ‘உள்ளே செல்லுதல்’ என்ற திசைசார் பொருளை தெளிவாகக் காக்கிறது.
- source_word: εἰς γῆν Ἰσραήλ
  choice: இஸ்ரவேல் நாட்டிற்குள்
  rationale: γῆ Ἰσραήλ என்ற புவியியல்-தேசிய சொற்றொடரை இயல்பான தமிழில் வழங்குகிறது; εἰς என்பதன் உள்நோக்கிய இயக்கத்தையும் ‘நாட்டிற்குள்’ காக்கிறது.
