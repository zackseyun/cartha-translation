reference: Matthew 2:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἦν ἐκεῖ ἕως τῆς τελευτῆς Ἡρῴδου· ἵνα πληρωθῇ τὸ ῥηθὲν ⸀ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος· Ἐξ Αἰγύπτου ἐκάλεσα τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/015.yaml
  text: and was there until the death of Herod[a], so that what was spoken by the Lord through the prophet might be fulfilled, saying[c][b], “Out of Egypt I called my son.”
translation:
  language: ta
  text: “எகிப்திலிருந்து என் மகனை அழைத்தேன்” என்று ஆண்டவர் இறைவாக்கினர் வழியாகச் சொன்னது நிறைவேறும்படி, அவர் ஏரோது இறக்கும்வரை அங்கே இருந்தார்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சொல்லப்பட்டிருந்தது” என்றும் மொழிபெயர்க்கலாம்.
    reason: τὸ ῥηθὲν என்ற இறந்தகாலப் பங்கேற்பு வடிவத்தின் கால உறவைத் தமிழில் வெளிப்படுத்தும் மாற்று.
  - marker: b
    text: மத்தேயு இங்கே ஓசியா 11:1-ஐ மேற்கோள் காட்டுகிறார். அங்கே ‘மகன்’ என்பது முதலில் இஸ்ரவேலைக் குறிக்கிறது; இங்கே அந்த வேதவாக்கு இயேசுவில் நிறைவேறுவதாக அவர் எடுத்துரைக்கிறார்.
    reason: மேற்கோளின் மூலச் சூழலையும் மத்தேயுவின் பயன்பாட்டையும் காட்டும் குறுக்கு மேற்கோள் குறிப்பு.
lexical_decisions:
- source_word: ἦν ἐκεῖ
  choice: அவர் அங்கே இருந்தார்
  rationale: இறந்தகாலத் தொடர்நிலையை இயல்பாகக் காட்டுகிறது; கிரேக்கத்தில் இல்லாத ‘தங்கியிருந்தார்’ என்ற கூடுதல் நுணுக்கத்தைத் தவிர்க்கிறது.
- source_word: ἕως τῆς τελευτῆς Ἡρῴδου
  choice: ஏரோது இறக்கும்வரை
  rationale: τελευτή இங்கு வாழ்வின் முடிவாகிய மரணத்தைக் குறிக்கிறது. பெயர்ச்சொல் அமைப்பைச் சொற்சொல்லாகப் பின்பற்றுவதைவிட இது நவீனத் தமிழில் இயல்பாக உள்ளது.
- source_word: ἵνα πληρωθῇ
  choice: நிறைவேறும்படி இது நடந்தது
  rationale: ἵνα மற்றும் இறைச்செயப்பாட்டு πληρωθῇ ஆகியவற்றின் நோக்கம்/விளைவு சார்ந்த பொருளையும், வேதவாக்கு நிறைவேறுதல் என்ற மத்தேயுவின் சொல்லாட்சியையும் காக்கிறது.
- source_word: τὸ ῥηθὲν ὑπὸ κυρίου διὰ τοῦ προφήτου
  choice: ஆண்டவர் இறைவாக்கினர் வழியாகச் சொன்னது
  rationale: ஆண்டவரை வார்த்தையின் மூலமாகவும் இறைவாக்கினரை இடைமுகமாகவும் வேறுபடுத்துகிறது; தமிழில் தேவையற்ற இரட்டைச் செயப்பாட்டு அமைப்பைத் தவிர்க்கிறது.
- source_word: Ἐξ Αἰγύπτου
  choice: எகிப்திலிருந்து
  rationale: ἐξ என்பதன் பிரிவிடம்/புறப்படும் இடம் என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἐκάλεσα
  choice: அழைத்தேன்
  rationale: καλέω என்பதன் பரந்த ‘அழைத்தல்’ பொருளைக் காக்கிறது; ‘வரவழைத்தேன்’ என்று இயக்கத்தின் பொருளை மிகத் தெளிவாகச் சேர்ப்பதில்லை.
- source_word: τὸν υἱόν μου
  choice: என் மகனை
  rationale: υἱός என்பதன் ஆண்பால் மகனுறவைத் தெளிவாகக் காக்கிறது; ஓசியா மேற்கோளுக்கும் மத்தேயுவின் பயன்பாட்டுக்கும் முக்கியமான ஒருமை வடிவத்தைப் பேணுகிறது.
theological_decisions:
- issue: ஓசியா 11:1 மேற்கோளின் நிறைவேற்றம்
  choice: ‘நிறைவேறும்படி’ என்ற மத்தேயுவின் கூற்றை அப்படியே காத்தல்
  alternative: இதை நேரடியான முன்னறிவிப்பு அல்லது இஸ்ரவேலை மறுபடியும் வாழ்ந்து காட்டும் மாதிரிநிறைவேற்றம் என்று மொழிபெயர்ப்பிலேயே விளக்குதல்
  rationale: மத்தேயு நிறைவேற்றத்தைத் தெளிவாகக் கூறினாலும், அது எவ்வகையில் நிறைவேறுகிறது என்பதை இவ்வசனம் தனியாக வரையறுப்பதில்லை. எனவே அந்த இறையியல் பதற்றம் முதன்மை உரையில் தீர்க்கப்படவில்லை.
- issue: κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: கர்த்தர் / யெகோவா
  rationale: கிரேக்க κύριος என்பதைக் கூடுதல் தெய்வப்பெயர் விளக்கமின்றி மரியாதைக்குரிய, பொதுவாகப் புரியும் தமிழில் வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, மரியாதைமிக்க நடையைப் பயன்படுத்துகிறது. ‘இறைவாக்கினர்’ என்பது சாதாரண வாசகருக்குப் புரியக்கூடிய வகையில் தீர்க்கதரிசியின் பங்கை வெளிப்படுத்துகிறது. கிரேக்க வாக்கியத்தின் நீளத்தை தமிழின் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரித்தாலும் காரண–நிறைவேற்றத் தொடர்பு காக்கப்பட்டுள்ளது.
