id: MAT.17.5
reference: Matthew 17:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἔτι αὐτοῦ λαλοῦντος ἰδοὺ νεφέλη φωτεινὴ ἐπεσκίασεν αὐτούς, καὶ ἰδοὺ φωνὴ ἐκ τῆς νεφέλης λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα· ⸂ἀκούετε αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/005.yaml
  text: While he was still speaking[a], behold, a bright cloud overshadowed them, and behold, a voice from the cloud said, “This is my beloved Son, with whom I am well pleased[c][b]; listen to him.”
translation:
  language: ta
  text: அவர் இன்னும் பேசிக்கொண்டிருக்கையில், இதோ,[a] பிரகாசமான ஒரு மேகம் அவர்கள்மேல் நிழலிட்டது.[b] இதோ, அந்த மேகத்திலிருந்து ஒரு குரல், “இவரே என் அன்புக்குரிய மகன்; இவரில் நான் மகிழ்ந்தேன். அவருக்குச் செவிகொடுங்கள்”[c] என்றது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இதோ’ என்பதற்கான கிரேக்கச் சொல் இந்த வசனத்தில் இருமுறை வருகிறது; அது கவனத்தைத் திருப்பி காட்சியின் நாடகத் தன்மையை வலுப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘நிழலிட்டது’ என்ற சொல், கடவுளின் வெளிப்பட்ட பிரசன்னத்துடன் தொடர்புடைய வேதாகம இறைக்காட்சி மொழியை நினைவூட்டக்கூடும்.
    reason: cross_reference
  - marker: c
    text: அல்லது, ‘இவர் சொல்வதைக் கேளுங்கள்.’ கிரேக்கக் கட்டளை கேட்பதோடு, கவனித்து ஏற்றுக்கொள்வதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: அவர் இன்னும் பேசிக்கொண்டிருக்கையில்
  rationale: உடனிகழும் செயலைக் குறிக்கும் genitive absolute அமைப்பையும், அவர் பேசுவது முடிவதற்குள் நிகழ்வு குறுக்கிட்டதைக் காட்டும் ἔτι என்பதன் பொருளையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: காட்சியின் மீது கவனத்தைத் திருப்பி அதன் திடீர் நாடகத் தன்மையை உயர்த்தும் சொல்லாகிய ἰδού இருமுறையும் வந்திருப்பதைத் தமிழிலும் இருமுறையும் காக்கிறது.
- source_word: νεφέλη φωτεινὴ
  choice: ஒளிமிக்க ஒரு மேகம்
  rationale: φωτεινή என்பதன் ஒளிரும் அல்லது பிரகாசமான தன்மையை விளக்கவுரை சேர்க்காமல் நேரடியாகத் தருகிறது.
- source_word: ἐπεσκίασεν αὐτούς
  choice: அவர்கள்மேல் நிழலிட்டது
  rationale: ἐπισκιάζω என்பதன் நிழலிடுதல் அல்லது சூழ்ந்துகொள்ளுதல் சார்ந்த படிமத்தையும், இறைப்பிரசன்னக் காட்சிகளை நினைவூட்டக்கூடிய மொழிநடையையும் மிகைப்படுத்தாமல் காக்கிறது.
- source_word: φωνὴ ἐκ τῆς νεφέλης λέγουσα
  choice: அந்த மேகத்திலிருந்து ஒரு குரல் … என்றது
  rationale: கிரேக்கப் பங்கேற்புவினையைத் தமிழில் இயல்பான முடிவுற்ற வினையாக மாற்றியும், குரல் மேகத்திலிருந்து வந்தது என்ற மூலத் தகவலை முழுமையாகக் காக்கிறது.
- source_word: Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός
  choice: இவரே என் அன்புக்குரிய மகன்
  rationale: நேரடியான அடையாளப்படுத்துதலை ‘இவரே’ எனவும், ἀγαπητός என்பதிலுள்ள அன்பும் தனிச்சிறப்பும் ‘அன்புக்குரிய’ எனவும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν ᾧ εὐδόκησα
  choice: இவரில் நான் மகிழ்ச்சியடைகிறேன்
  rationale: ἐν ᾧ என்பதன் உறவுசார் வடிவத்தை ‘இவரில்’ எனக் காத்து, தெய்வீக அறிவிப்பில் εὐδόκησα வெளிப்படுத்தும் மனநிறைவு அல்லது மகிழ்ச்சியை இயல்பான நிகழ்காலத் தமிழில் தருகிறது.
- source_word: ἀκούετε αὐτοῦ
  choice: இவர் சொல்வதைக் கேளுங்கள்
  rationale: தமிழில் வெறும் ஒலியைக் கேட்பதாக அல்லாமல், ஒருவரது சொல்லைக் கவனித்து ஏற்றுக்கொள்வதாக இயல்பாகப் புரியும்படி வினையின் கட்டளை வலிமையைத் தருகிறது; ‘கீழ்ப்படியுங்கள்’ என்று விளக்கத்தை மூலத்திற்குள் சேர்க்கவில்லை.
theological_decisions:
- issue: இயேசுவைப் பற்றிய தெய்வீக அடையாள அறிவிப்பு
  choice: இவரே என் அன்புக்குரிய மகன்; இவரில் நான் மகிழ்ச்சியடைகிறேன்
  alternative: இவர் என் மகன், அன்புக்குரியவர்; இவரில் நான் மகிழ்ந்தேன்
  rationale: மகன் என்ற நேரடி அடையாளத்தையும், ἀγαπητός மற்றும் εὐδόκησα ஆகியவற்றின் அன்பு மற்றும் மனநிறைவு மொழியையும் காக்கிறது; வசனத்தில் இல்லாத பிற்கால கோட்பாட்டுச் சொற்களைச் சேர்க்கவில்லை.
- issue: ἀκούετε αὐτοῦ என்பதன் வலிமை
  choice: இவர் சொல்வதைக் கேளுங்கள்
  alternative: இவருக்குச் செவிகொடுங்கள்
  rationale: கட்டளை வெறும் செவிப்புலனைக் காட்டாமல் கவனித்து ஏற்றுக்கொள்வதையும் சுட்டலாம். தேர்ந்த மொழிபெயர்ப்பு அந்த விரிவை இயல்பாகத் திறந்துவைக்கிறது; ‘கீழ்ப்படியுங்கள்’ என்று ஒரே பொருளில் முடிவுசெய்யவில்லை.
- issue: εὐδόκησα என்பதன் காலமும் அறிவிப்பு வழக்கும்
  choice: நான் மகிழ்ச்சியடைகிறேன்
  alternative: நான் மகிழ்ந்தேன்
  rationale: கிரேக்கத்தில் aorist வடிவம் இருந்தாலும், இத்தகைய தெய்வீக அறிவிப்பில் தொடரும் மனநிறைவை நவீனத் தமிழின் நிகழ்காலம் இயல்பாக வெளிப்படுத்துகிறது. மாற்று வடிவம் இலக்கணக் காலத்தை மேலும் வெளிப்படையாகக் காட்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்ற சற்றே உயர்ந்த கவன ஈர்ப்புச் சொல் மூலத்தின் இரட்டிப்பு மற்றும் காட்சித் தீவிரத்தைக் காக்கத் தக்கவைக்கப்பட்டுள்ளது. ‘அவர்கள்மேல் நிழலிட்டது’ என்ற சொற்றொடர் இயல்புத்தன்மைக்கும் இறைக்காட்சி ஒலிப்புக்கும் இடையில் சமநிலை பேணுகிறது.
