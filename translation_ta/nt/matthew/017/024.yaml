source:
  edition: SBLGNT
  text: Ἐλθόντων δὲ αὐτῶν εἰς Καφαρναοὺμ προσῆλθον οἱ τὰ δίδραχμα λαμβάνοντες τῷ Πέτρῳ καὶ εἶπαν· Ὁ διδάσκαλος ὑμῶν οὐ τελεῖ τὰ δίδραχμα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/024.yaml
  text: When they came to Capernaum[a], those who collected the two-drachma tax came to Peter and said[b], “Does your teacher not pay the two-drachma tax?”
translation:
  language: ta
  text: அவர்கள் கப்பர்நகூமுக்கு வந்தபோது, இரண்டு திராக்மா வரியை வசூலிப்பவர்கள்[a] பேதுருவிடம் வந்து, “உங்கள் ஆசிரியர் இரண்டு திராக்மா வரியைச் செலுத்துவதில்லையா?” என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லாட்சிப்படி, “இரண்டு திராக்மாக்களைப் பெறுகிறவர்கள்.” இது ஆலயத்திற்காக வசூலிக்கப்பட்ட இரண்டு திராக்மா வரியைக் குறிக்கிறது.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: Ἐλθόντων δὲ αὐτῶν
  choice: அவர்கள் ... வந்தபோது
  rationale: வேற்றுமைத் தொகை அமைப்பு காலச் சூழலைக் குறிக்கிறது. ‘வந்தபோது’ என்பது அதன் காலப் பொருளை இயல்பான நவீன தமிழில் தருகிறது; δέ இங்கு தனியாக மொழிபெயர்க்கப்படாமல் வாக்கிய நகர்வில் உணர்த்தப்படுகிறது.
- source_word: Καφαρναοὺμ
  choice: கப்பர்நகூம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட இடப்பெயர் வடிவம்.
- source_word: οἱ τὰ δίδραχμα λαμβάνοντες
  choice: இரண்டு திராக்மா வரியை வசூலிப்பவர்கள்
  rationale: சொல்லாட்சிப்படி ‘இரண்டு திராக்மாக்களைப் பெறுகிறவர்கள்’ என்றாலும், சூழலில் வரி வசூலிப்பவர்களே குறிக்கப்படுகின்றனர். செயற்பாட்டைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்க இவ்வாறு தரப்பட்டுள்ளது.
- source_word: δίδραχμα
  choice: இரண்டு திராக்மா வரி
  rationale: δίδραχμον என்பது இரண்டு திராக்மா மதிப்புள்ள தொகை. இங்கு நாணயங்களைப் பொதுவாகக் குறிப்பிடாமல் கட்டாயப் பணத்தொகையைப் பற்றிப் பேசுவதால் ‘வரி’ என்று சூழற்பொருள் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: τῷ Πέτρῳ
  choice: பேதுருவிடம்
  rationale: அவர்கள் அணுகிச் சென்ற நபரைத் தமிழில் இயல்பாகக் குறிக்கும் வடிவம்.
- source_word: Ὁ διδάσκαλος ὑμῶν
  choice: உங்கள் போதகர்
  rationale: διδάσκαλος என்பதன் போதிக்கும் பணியையும் நற்செய்தி நூல்களில் இயேசுவுக்குப் பயன்படுத்தப்படும் அழைப்பையும் ‘போதகர்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: οὐ τελεῖ
  choice: செலுத்துவதில்லையா?
  rationale: τελέω இச்சூழலில் கடன்பட்ட தொகையைச் செலுத்துவதைக் குறிக்கிறது. கிரேக்கத்தின் எதிர்மறைக் கேள்வி வடிவத்தையும், ‘செலுத்துகிறார்’ என்ற சாதகமான பதிலை எதிர்பார்க்கும் நுணுக்கத்தையும் இவ்வடிவம் பாதுகாக்கிறது.
theological_decisions:
- issue: δίδραχμα என்பது நாணயங்களையா, வரியையா குறிக்கிறது?
  choice: முதன்மை உரையில் ‘இரண்டு திராக்மா வரி’
  alternative: ‘இரண்டு திராக்மாக்கள்’ அல்லது ‘திதிராக்மா’
  rationale: உடனடிச் சூழல் இயேசு செலுத்த வேண்டிய தொகையைப் பற்றியது; வெறும் நாணயங்களைக் கையாளுவதைப் பற்றியது அல்ல. ‘வரி’ என்பது சூழற்பொருளைத் தெளிவாக்குகிறது. ஆலய வரி என்ற வரலாற்று அடையாளம் மூல வாக்கியத்தில் வெளிப்படையாக இல்லாததால் அது அடிக்குறிப்பில் மட்டும் விளக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்க எதிர்மறைக் கேள்வியின் திறந்த வடிவம் தக்கவைக்கப்பட்டுள்ளது; அது சாதகமான பதிலை எதிர்பார்க்கிறது என்பதை உரைக்குள் கட்டாயமாக விளக்கவில்லை.
