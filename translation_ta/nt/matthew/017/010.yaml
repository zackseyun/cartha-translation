source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησαν αὐτὸν οἱ ⸀μαθηταὶ λέγοντες· Τί οὖν οἱ γραμματεῖς λέγουσιν ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/010.yaml
  text: And the disciples asked him, saying, “Why then do the scribes say that Elijah must come first?”
translation:
  language: ta
  text: சீடர்கள் அவரிடம், “அப்படியானால், எலியா முதலில் வர வேண்டும் என்று மறைநூல் அறிஞர்கள் ஏன் சொல்கிறார்கள்?” என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησαν
  choice: கேட்டார்கள்
  rationale: இங்கு நேரடியான கேள்வியை அறிமுகப்படுத்தும் இறந்தகால வினை; இயல்பான நவீனத் தமிழில் ‘கேட்டார்கள்’ பொருளைத் தெளிவாகக் கொடுக்கிறது.
- source_word: οἱ μαθηταὶ
  choice: சீடர்கள்
  rationale: குறிப்பிட்ட, முன்பே அறியப்பட்ட குழுவைக் குறிக்கிறது. மூலத்தில் αὐτοῦ இல்லாததால் ‘அவருடைய சீடர்கள்’ என்று சேர்க்கப்படவில்லை.
- source_word: λέγοντες
  choice: … என்று
  rationale: கேள்வியின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் பங்கேற்புவினையின் செயல்பாட்டைத் தமிழின் இயல்பான மேற்கோள் அமைப்பான ‘என்று’ வெளிப்படுத்துகிறது.
- source_word: Τί οὖν
  choice: அப்படியானால் … ஏன்
  rationale: λέγουσιν ὅτι என்பதுடன் τί காரணத்தைக் கேட்கிறது; οὖν முந்தைய சூழலிலிருந்து எழும் முடிவுறுத்தும் தொடர்பைச் சுட்டுகிறது.
- source_word: οἱ γραμματεῖς
  choice: வேத அறிஞர்கள்
  rationale: நற்செய்தி நூல்களின் சூழலில் வேதநூல்களையும் திருச்சட்டத்தையும் ஆராய்ந்து கற்பித்தவர்களைக் குறிக்கும் γραμματεῖς என்பதைக் சாதாரண வாசகர் புரிந்துகொள்ளும் வகையில் வழங்குகிறது; ‘எழுத்தர்கள்’ என்பது நவீன தமிழில் தொழில்சார் எழுத்துப் பணியாளர்களைத் தவறாக நினைவூட்டலாம்.
- source_word: λέγουσιν ὅτι
  choice: … என்று … சொல்கிறார்கள்
  rationale: நிகழ்காலத்தையும் கருத்தின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் ὅτι-யையும் இயல்பான தமிழில் காக்கிறது.
- source_word: Ἠλίαν
  choice: எலியா
  rationale: தமிழ் வேதாகம மரபில் நிலைபெற்ற தீர்க்கதரிசியின் பெயர்வடிவம்.
- source_word: δεῖ ἐλθεῖν
  choice: வர வேண்டும்
  rationale: δεῖ குறிக்கும் அவசியத்தைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: πρῶτον
  choice: முதலில்
  rationale: வருகைகளின் அல்லது நிகழ்வுகளின் வரிசையில் ‘முன்னதாக’ என்பதைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்.
theological_decisions:
- issue: எலியாவின் வருகையைப் பற்றிய சீடர்களின் கேள்வியின் நோக்கம்
  choice: வேத அறிஞர்களின் போதனையை சீடர்கள் ஏற்கிறார்களா, சந்தேகிக்கிறார்களா, அல்லது விளக்கம் மட்டும் கேட்கிறார்களா என்பதைத் தீர்மானிக்காமல் கேள்வியாகவே வழங்குதல்
  alternative: கேள்வியில் சந்தேகத் தொனியைச் சேர்த்தல் அல்லது மல்கியா தீர்க்கதரிசனப் பின்னணியை வசனத்துக்குள் விளக்கமாகச் சேர்த்தல்
  rationale: இவ்வசனம் கேள்வியை மட்டுமே பதிவு செய்கிறது; அதன் மதிப்பீடும் விளக்கமும் அடுத்த வசனங்களில் வருகின்றன. ஆகவே இறையியல் இழுபறியை மொழிபெயர்ப்பு முன்கூட்டியே தீர்க்கக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையான, வாசிக்க எளிய நடை. கிரேக்கச் சொல்வரிசையை வற்புறுத்தாமல், மேற்கோளை முதலில் வைத்து முடிவில் ‘என்று கேட்டார்கள்’ எனும் இயல்பான தமிழ் அமைப்பு பயன்படுத்தப்பட்டது. ‘அப்போது’ என்பது καί-யின் கதைத் தொடர்ச்சிச் செயல்பாட்டை வெளிப்படுத்துகிறது.
