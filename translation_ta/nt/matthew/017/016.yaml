reference: Matthew 17:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ προσήνεγκα αὐτὸν τοῖς μαθηταῖς σου, καὶ οὐκ ἠδυνήθησαν αὐτὸν θεραπεῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/016.yaml
  text: And I brought him to your disciples[a], and they were not able to heal him.
translation:
  language: ta
  text: நான் அவனை உங்கள் சீடர்களிடம் கொண்டுவந்தேன்; அவர்களால் அவனைக் குணமாக்க முடியவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσήνεγκα
  choice: கொண்டுவந்தேன்
  rationale: இங்கு προσφέρω என்பதன் இறந்தகால வடிவம் ஒருவரை மற்றொருவரிடம் கொண்டுவருவதைக் குறிக்கிறது. ‘கொண்டுவந்தேன்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: μαθηταῖς σου
  choice: உங்கள் சீடர்களிடம்
  rationale: μαθητής என்பது இச்சுவிசேஷச் சூழலில் ஒரு போதகரைப் பின்பற்றிக் கற்கும் சீடரைக் குறிக்கிறது; ‘உங்கள்’ என்பது மரியாதையுடனான இயல்பான நேரடி விளிப்பு.
- source_word: οὐκ ἠδυνήθησαν
  choice: அவர்களால் ... முடியவில்லை
  rationale: δύναμαι திறன் அல்லது இயலுமையைக் குறிக்கிறது. இந்தத் தமிழ்க் கட்டமைப்பு அவர்கள் அதைச் செய்ய இயலாதிருந்ததைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: θεραπεῦσαι
  choice: குணமாக்க
  rationale: θεραπεύω இங்கு துன்புறும் சிறுவனைச் சுகப்படுத்துவதைக் குறிக்கிறது. ‘குணமாக்க’ என்பது இச்சூழலில் தெளிவான, பொதுவாகப் புரியும் சொல்.
- source_word: καὶ ... καὶ
  choice: முதல் இணைப்பைத் தனியாக மொழிபெயர்க்காமல், இரு கூற்றுகளையும் அரைப்புள்ளியால் இணைத்தல்
  rationale: தமிழில் வசனத் தொடக்கத்திலுள்ள καί-ஐ கட்டாயமாக ‘மேலும்’ அல்லது ‘அப்பொழுது’ என்று மொழிபெயர்ப்பது செயற்கையாக இருக்கும். இரண்டாவது καί-க்கு ‘ஆனால்’ என்று வெளிப்படையான முரண்பாட்டுப் பொருளைச் சேர்க்காமல், அரைப்புள்ளி கிரேக்கத்தின் எளிய தொடரிணைப்பை இயல்பாகத் தருகிறது.
- source_word: αὐτόν
  choice: அவனை
  rationale: இப்பெயர்ப்பதிலி உடனடி சூழலில் குறிப்பிடப்பட்ட மகனை அல்லது சிறுவனைக் குறிக்கிறது.
theological_decisions:
- issue: சீடர்களின் தோல்விக்கான காரணம்
  choice: அவர்களால் அவனைக் குணமாக்க முடியவில்லை என்று மட்டும் மொழிபெயர்த்தல்
  alternative: அவர்களால் பேயைத் துரத்த முடியவில்லை என்றோ, அவர்களுடைய விசுவாசக் குறைவால் தோற்றார்கள் என்றோ வெளிப்படையாகக் கூறுதல்
  rationale: இந்த வசனம் அவர்கள் குணமாக்க இயலவில்லை என்று மட்டுமே கூறுகிறது. காரணம், விசுவாசம், அதிகாரம் அல்லது பேயோட்டும் முறை பற்றிய விளக்கத்தைச் சுற்றியுள்ள வசனங்களிலிருந்து இங்கு சேர்க்கக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவை நோக்கிய உரையில் ‘உங்கள்’ மரியாதைப் பன்மையாக இயல்பாகச் செயல்படுகிறது; பழமையான ‘உம்முடைய’ தவிர்க்கப்பட்டுள்ளது.
