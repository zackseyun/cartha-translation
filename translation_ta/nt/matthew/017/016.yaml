  source_fidelity: 'கிரேக்க மூலத்தின் எல்லா முக்கிய கூறுகளும் துல்லியமாகத் தரப்பட்டுள்ளன: προσήνεγκα என்பதற்கு «கொண்டுவந்தேன்», μαθηταῖς σου என்பதற்கு «உங்கள் சீடர்களிடம்», οὐκ ἠδυνήθησαν என்பதற்கு «அவர்களால் ... முடியவில்லை», θεραπεῦσαι என்பதற்கு «குணமாக்க» என்பவை பொருத்தமானவை. αὐτόν இரு இடங்களிலும் சரியாக «அவனை/அவனைக்» எனக் குறிக்கப்படுகிறது. சீடர்களின் இயலாமைக்கு வசனம் கூறாத காரணம் எதுவும் சேர்க்கப்படவில்லை.'
  naturalness: «நான் அவனை உங்கள் சீடர்களிடம் கொண்டுவந்தேன்; அவர்களால் அவனைக் குணமாக்க முடியவில்லை» என்பது நவீன நிலையான தமிழில் தெளிவானதும் இயல்பானதும் ஆகும். அரைப்புள்ளி இரண்டு எளிய தொடர்புடைய கூற்றுகளைச் செயற்கையில்லாமல் இணைக்கிறது; கிரேக்கத்தின் இரண்டாம் καί-க்கு தேவையற்ற எதிர்மறை இணைப்புச் சொல்லைச் சேர்ப்பதில்லை.
