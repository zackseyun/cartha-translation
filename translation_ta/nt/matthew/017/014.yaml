    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: (தனி இணைப்புச்சொல்லாக வெளிப்படுத்தப்படவில்லை)
  rationale: தமிழில் காலநிலைத் துணைவாக்கியத்துடன் தொடங்குவது இயல்பான தொடர்ச்சியைத் தருகிறது; ‘மேலும்’ என்று சேர்ப்பது தேவையற்ற செயற்கைத்தன்மையை உண்டாக்கும்.
- source_word: ἐλθόντων
  choice: அவர்கள் ... வந்தபோது
  rationale: பன்மை எழுவாய் சூழலிலிருந்து பெறப்படுகிறது; இறந்தகால வினையெச்சத்தின் காலத் தொடர்பை ‘வந்தபோது’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πρὸς τὸν ὄχλον
  choice: மக்கள் கூட்டத்திடம்
  rationale: ὄχλος என்பது இங்கு திரண்டிருந்த மக்கள் கூட்டத்தைக் குறிக்கிறது; நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: προσῆλθεν αὐτῷ
  choice: அவரை அணுகி
  rationale: அந்த மனிதன் இயேசுவிடம் நெருங்கி வந்ததைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἄνθρωπος
  choice: ஒரு மனிதன்
  rationale: இச்சூழலில் ஒரு குறிப்பிட்ட ஆண் நபரைச் சுட்டுவதால் பாலினத் துல்லியத்துடன் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: γονυπετῶν αὐτὸν
  choice: அவர்முன் மண்டியிட்டு
  rationale: இயேசுவை நோக்கி முழங்கால்படியிட்ட உடல் செயலையும் மரியாதைமிக்க நிலையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἄνθρωπος என்ற சொல்லின் தனிநபர் குறிப்பு
  choice: ஒரு மனிதன்
  alternative: ஒருவர்
  rationale: சொல்லும் சூழலும் குறிப்பிட்ட ஆண் நபரைக் குறிக்கின்றன; பொதுவான மனிதகுலம் பற்றிய கருத்தை இங்கு புகுத்தவில்லை.
- issue: γονυπετῶν என்பதிலுள்ள செயலும் மரியாதைத் தொனியும்
  choice: அவர்முன் மண்டியிட்டு
  alternative: அவருக்கு முன்பாக முழங்காலில் விழுந்து
  rationale: செயலை வழிபாடு என்று வெளிப்படையாகத் தீர்மானிக்காமல், மூலத்தில் காணப்படும் உடல் நிலையையும் மரியாதைத் தொனியையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. வசனம் அடுத்த வசனத்தில் தொடரும் வாக்கியமாக இருப்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
