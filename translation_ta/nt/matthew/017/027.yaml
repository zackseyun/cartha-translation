  source_fidelity: மூலத்தின் கட்டளைத் தொடர், ‘கடல்,’ முதல் மேலே வரும் மீன், ஸ்தாத்தேர், இருவருக்காகச் செலுத்துதல் ஆகியவை வரைவில் நன்றாகத் தக்கவைக்கப்பட்டுள்ளன. ஆனால் σκανδαλίσωμεν என்பதற்கு முதன்மை உரையில் ‘இடறல் ஏற்படுத்தாதபடி’ என்பது இச்சூழலில் தமிழில் இயல்பாக இல்லாமலும், பிறரைப் பாவத்தில் விழச்செய்தல் என்ற வலுவான பொருளைத் தூண்டக்கூடியதாகவும் உள்ளது. இங்கு தேவையற்ற மனவருத்தம்/புண்பாடு உண்டாக்குதல் என்ற நடைமுறைப் பொருள் முதன்மை உரையில் தெளிவாக வேண்டும்.
  naturalness: ‘தூண்டிலை வீசு’ என்பதில் ‘தூண்டில்’ மீன்பிடிக் கருவி முழுவதையோ கம்பியையோ குறிக்கவும் முடியும்; ἄγκιστρον குறிப்பாக மீன்பிடிக் கொக்கி. ‘மீன்பிடிக் கொக்கியை வீசு’ தெளிவானது. ‘அதன் வாயைத் திற; அதில் ... காண்பாய்’ என்பதற்குப் பதில் ‘அதன் வாயைத் திறந்தால், அதில் ... காண்பாய்’ என்பது நவீன தமிழில் கட்டளைத் தொடரையும் விளைவு வாக்கியத்தையும் இயல்பாக இணைக்கிறது. ‘அவர்களிடம் கொடு’ என்பதற்குப் பதில் ‘அவர்களுக்குக் கொடு’ நேரடியான பெறுநரைக் குறிக்கிறது.
  terminology: ‘ஸ்தாத்தேர்’ என்ற வரலாற்று நாணயப் பெயரைத் தக்கவைத்தல் சரியானது. அடிக்குறிப்பில் அது ‘நான்கு திராக்மாக்களுக்குச் சமமான’ நாணயம் எனச் சொல்வது ‘நான்கு திராக்மா மதிப்புள்ள’ என்பதைக் காட்டிலும் துல்லியமானது. ஆலய வரி இருவருக்குப் போதுமானது என்ற விளக்கம் பொருத்தமானது.
