  to: ஆனால், நாம் அவர்களுக்கு மனவருத்தம் உண்டாக்காதபடி[a], கடலுக்குப் போய் மீன்பிடிக் கொக்கியை வீசு. முதலில் மேலே வரும் மீனை எடு. அதன் வாயைத் திறந்தால், அதில் ஒரு ஸ்தாத்தேர் நாணயத்தைக் காண்பாய்[b]. அதை எடுத்து, எனக்காகவும் உனக்காகவும் அவர்களுக்குக் கொடு.
  rationale: திருத்தம் மூலத்தின் பொருளை மாற்றாமல், σκανδαλίζω-வின் இச்சூழல் நடைமுறைப் பொருளை முதன்மை உரையில் இயல்பாகக் கொடுக்கிறது; அதன் சொற்படியான/மாற்றுப் பொருள் அடிக்குறிப்பில் விடப்பட்டுள்ளது. மீன்பிடிக் கொக்கி, வாயைத் திறந்தால், மற்றும் பெறுநர் குறியீடு ஆகிய சிறு மாற்றங்கள் மூலத் துல்லியத்தையும் நவீன தமிழ் இயல்பையும் மேம்படுத்துகின்றன.
