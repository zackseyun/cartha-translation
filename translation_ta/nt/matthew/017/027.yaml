id: MAT.17.27
reference: Matthew 17:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἵνα δὲ μὴ σκανδαλίσωμεν αὐτούς, πορευθεὶς ⸀εἰς θάλασσαν βάλε ἄγκιστρον καὶ τὸν ⸀ἀναβάντα πρῶτον ἰχθὺν ἆρον, καὶ ἀνοίξας τὸ στόμα αὐτοῦ εὑρήσεις στατῆρα· ἐκεῖνον λαβὼν δὸς αὐτοῖς ἀντὶ ἐμοῦ καὶ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/027.yaml
  text: But so that we may not offend them[a], go to the sea, cast in a hook, and take the first fish that comes up. And when you open its mouth, you will find a stater[b]. Take that and give it to them for me and for yourself.
translation:
  language: ta
  text: ஆனால், நாம் அவர்களுக்கு மனவருத்தம் உண்டாக்காதபடி[a], கடலுக்குப் போய் மீன்பிடிக் கொக்கியை வீசு. முதலில் மேலே வரும் மீனை எடு. அதன் வாயைத் திறந்தால், அதில் ஒரு ஸ்தாத்தேர் நாணயத்தைக் காண்பாய்[b]. அதை எடுத்து, எனக்காகவும் உனக்காகவும் அவர்களுக்குக் கொடு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுக்கு இடறல் உண்டாக்காதபடி” / “அவர்களைப் புண்படுத்தாதபடி.”
    reason: lexical_alternative
  - marker: b
    text: ஸ்தாத்தேர் என்பது ஏறத்தாழ நான்கு திராக்மாக்களுக்குச் சமமான நாணயம்; இரண்டு பேரின் ஆலய வரியைச் செலுத்த அது போதுமானது.
    reason: cultural_note
lexical_decisions:
- source_word: σκανδαλίσωμεν
  choice: அவர்களுக்கு இடறல் ஏற்படுத்தாதபடி
  rationale: இச்சூழலில் இது அவர்களைப் பாவத்தில் விழச் செய்வதைக் காட்டிலும், தேவையற்ற எதிர்ப்பையோ மனத்தடையையோ ஏற்படுத்துவதைக் குறிக்கிறது. ‘இடறல் ஏற்படுத்துதல்’ மூலச்சொல்லின் உருவகத்தையும் அதன் பரந்த பொருள் வாய்ப்பையும் தக்கவைக்கிறது; அடிக்குறிப்பு சூழலுக்குரிய மாற்றுப் பொருளைத் தருகிறது.
- source_word: θάλασσαν
  choice: கடலுக்கு
  rationale: கிரேக்க மூலத்தில் ‘கடல்’ என்றே உள்ளது. புவியியல் ரீதியில் இது கலிலேயக் கடல் எனப்படும் ஏரியாக இருந்தாலும், மூலச்சொல் தக்கவைக்கப்படுகிறது.
- source_word: ἄγκιστρον
  choice: தூண்டில்
  rationale: மீன்பிடிக்கப் பயன்படுத்தும் கொக்கியை இயல்பான நவீனத் தமிழில் ‘தூண்டில்’ தெளிவாகக் குறிக்கிறது.
- source_word: ἀναβάντα πρῶτον ἰχθὺν
  choice: முதலில் மேலே வரும் மீன்
  rationale: நீரிலிருந்து முதலில் மேலே கொண்டுவரப்படும் மீனை இச்சொற்றொடர் குறிக்கிறது; தமிழ் வாக்கியத்தில் செயல்வரிசை இயல்பாக உள்ளது.
- source_word: ἆρον
  choice: எடுத்து
  rationale: பிடிக்கப்பட்ட மீனை மேலெடுத்துக் கொள்வதைச் சூழலுக்கேற்ற சுருக்கமான தமிழில் தெரிவிக்கிறது.
- source_word: στατῆρα
  choice: ஒரு ஸ்தாத்தேர் நாணயம்
  rationale: கிரேக்கத்தில் குறிப்பிடப்பட்டுள்ள குறிப்பிட்ட நாணயத்தின் பெயரை ஒலிபெயர்த்துத் தக்கவைக்கிறது; அதன் மதிப்பு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ἀντὶ ἐμοῦ καὶ σοῦ
  choice: எனக்காகவும் உனக்காகவும்
  rationale: இங்கு ἀντί இருவரின் சார்பாக வரியைச் செலுத்துவதைக் குறிக்கிறது. தமிழில் இது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: πορευθεὶς
  choice: போய்
  rationale: முதன்மைக் கட்டளைகளுக்கு முன் நிகழும் துணைச்செயலை இயல்பான தமிழ் வினையெச்சமாக வழங்குகிறது.
- source_word: δὸς αὐτοῖς
  choice: அவர்களிடம் கொடு
  rationale: முன்னர் குறிப்பிடப்பட்ட நாணயத்தைக் கொடுப்பது தெளிவாக இருப்பதால், சுருக்கமான கட்டளை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: ஆலய வரியைச் செலுத்துவது தொடர்பாக σκανδαλίζω என்பதன் பொருள்
  choice: வரி வசூலிப்பவர்களுக்கு தேவையற்ற இடறலையோ எதிர்ப்பையோ ஏற்படுத்தாமல் இருப்பதற்காக இயேசு பணம் கொடுக்கச் சொல்கிறார்; முந்தைய வசனத்தில் கூறப்பட்ட மகன்களின் விடுதலையை இது மறுப்பதாக மொழிபெயர்க்கப்படவில்லை.
  alternative: இயேசு முழுமையான வரிக் கடமையை ஒப்புக்கொள்வதால் பணம் செலுத்துகிறார்; அல்லது இந்தச் செலுத்துதல் அறநெறிப் பொருள் இல்லாத அற்புதக் காட்சி மட்டுமே.
  rationale: மத்தேயு 17:24–26 மகன்கள் விடுதலையானவர்கள் என்ற கருத்தை முன்வைக்கிறது; இவ்வசனம் ‘இடறல் ஏற்படுத்தாதபடி’ என்ற நடைமுறை விட்டுக்கொடுப்பைச் சேர்க்கிறது. மொழிபெயர்ப்பு இந்த இறையியல் இழுபறியைத் தீர்த்துவிடாமல் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கட்டளைகளின் தொடர்ச்சி சுருக்கமாகவும் இயல்பாகவும் வைக்கப்பட்டுள்ளது; நாணயத்தின் வரலாற்றுப் பெயர் தக்கவைக்கப்பட்டு அதன் மதிப்பு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
