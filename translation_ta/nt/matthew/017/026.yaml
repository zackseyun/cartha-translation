id: MAT.17.26
reference: Matthew 17:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂εἰπόντος δέ⸃· Ἀπὸ τῶν ἀλλοτρίων, ἔφη αὐτῷ ὁ Ἰησοῦς· Ἄρα γε ἐλεύθεροί εἰσιν οἱ υἱοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/026.yaml
  text: When he said[a], “From strangers,” Jesus said to him[c][b], “Then the sons are free.”
translation:
  language: ta
  text: “அந்நியர்களிடமிருந்து[a],” என்று அவர் சொன்னபோது, இயேசு அவரிடம், “அப்படியானால், மகன்கள்[b] சுதந்திரமானவர்கள்[c],” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மற்றவர்களிடமிருந்து” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் அரசரின் சொந்தக் குடும்பத்தைச் சேராதவர்களை அவரது மகன்களோடு வேறுபடுத்திக் காட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: “பிள்ளைகள்” என்றும் மொழிபெயர்க்கலாம்; எனினும் கிரேக்கத்தில் குறிப்பாக “மகன்கள்” என்று உள்ளது.
    reason: lexical_alternative
  - marker: c
    text: அதாவது, “வரி செலுத்துவதிலிருந்து விலக்கப்பட்டவர்கள்.” கிரேக்கத்தில் நேரடியாக “சுதந்திரமானவர்கள்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰπόντος δέ
  choice: என்று அவர் சொன்னபோது
  rationale: இந்த genitive absolute அமைப்பின் காலப் பொருளை இயல்பான தமிழில் தருகிறது; δέ குறிக்கும் மென்மையான உரையாடல் மாற்றத்தைத் தனியே மிகைப்படுத்தவில்லை.
- source_word: ἀπὸ τῶν ἀλλοτρίων
  choice: அந்நியர்களிடமிருந்து
  rationale: அரசரின் சொந்த மகன்களுக்கு மாறாக, அவரது குடும்பத்தைச் சேராதவர்களைக் குறிக்கும் உறவுசார் வேறுபாட்டைப் பாதுகாக்கிறது; தேசிய இனத்தை மட்டும் குறிப்பதாகக் குறுக்கவில்லை.
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: இயேசு அவரிடம் ... என்றார்
  rationale: φημί என்பதன் வழக்கமான கதைநடைப் பயன்பாட்டை மரியாதையான, இயல்பான தமிழில் தருகிறது.
- source_word: Ἄρα γε
  choice: அப்படியானால்
  rationale: முந்தைய பதிலிலிருந்து இயேசு எடுக்கும் முடிவைத் தெளிவாகக் காட்டும் இயல்பான தமிழ்ச் சொல்.
- source_word: ἐλεύθεροί
  choice: சுதந்திரமானவர்கள்
  rationale: வரி செலுத்தும் கடமையிலிருந்து விலக்கு என்பதே உடனடிச் சூழலின் பொருளாக இருந்தாலும், கிரேக்கச் சொல்லின் விரிவான ‘சுதந்திரம்’ என்ற வலிமையைச் சுருக்காமல் பாதுகாக்கிறது.
- source_word: οἱ υἱοί
  choice: மகன்கள்
  rationale: கிரேக்கம் குறிப்பாக ‘மகன்கள்’ என்கிறது; அரசரின் மகன்களுக்கும் அவரது குடும்பத்தைச் சேராதவர்களுக்கும் இடையிலான குடும்ப மற்றும் சட்டநிலை வேறுபாட்டை இது பாதுகாக்கிறது.
theological_decisions:
- issue: οἱ υἱοί என்பது அரசருக்குச் சொந்தமானவர்களைப் பிரதிநிதித்துவப்படுத்தும் கூற்றில் எவ்வாறு மொழிபெயர்க்கப்பட வேண்டும்
  choice: மகன்கள்
  alternative: பிள்ளைகள்
  rationale: உடனடியாகக் கூறப்படும் ஒப்புமை அரசரின் மகன்களையும் வரிவிதிப்பையும் பற்றியது; ஆகவே மூலத்தின் ஆண்பால் பன்மையையும் மகனாகிய நிலையின் இறையியல் எதிரொலியையும் விரிவுபடுத்தாமல் பாதுகாக்கிறது.
- issue: ἐλεύθεροί என்பதன் வரி சார்ந்த பொருளுக்கும் அதன் விரிவான சுதந்திரப் பொருளுக்கும் இடையிலான பதற்றம்
  choice: சுதந்திரமானவர்கள்
  alternative: வரி செலுத்துவதிலிருந்து விலக்கப்பட்டவர்கள்
  rationale: சூழலில் வரிவிலக்கு உட்பொருளாக உள்ளது; இருப்பினும் இயேசுவின் கூற்றை அந்த நடைமுறைப் பொருளுக்கு மட்டும் குறுக்காமல், மூலத்தின் விரிவான சொல்லாட்சியைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் மரியாதையான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அந்நியர்கள்—மகன்கள்’ என்ற குடும்ப உறவு வேறுபாடும், ‘சுதந்திரம்—வரிவிலக்கு’ என்ற பொருள் பதற்றமும் முதன்மை உரையிலும் அடிக்குறிப்புகளிலும் பாதுகாக்கப்பட்டுள்ளன.
