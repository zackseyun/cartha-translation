  source_fidelity: 'மூலக் கிரேக்கத்தின் உரையாடல் அமைப்பும் தருக்கத் தொடர்ச்சியும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன: εἰπόντος δέ என்பதன் காலநிலை, ἀπὸ τῶν ἀλλοτρίων என்பதன் குடும்பத்திற்கு வெளியேயுள்ளோர் என்ற எதிர்மறை, Ἄρα γε என்பதன் முடிவுரைப் பொருள், மற்றும் οἱ υἱοί என்பதன் ஆண்பால் பன்மை ஆகியவை அனைத்தும் சரியாகத் தரப்பட்டுள்ளன. ‘சுதந்திரமானவர்கள்’ என்பது ἐλεύθεροί என்பதன் நேரடிப் பொருளைத் தக்கவைத்து, வரிவிலக்கு உட்பொருளை அடிக்குறிப்பில் விளக்குகிறது.'
