reference: Matthew 17:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ⸂προσῆλθεν ὁ Ἰησοῦς καὶ ἁψάμενος αὐτῶν⸃ εἶπεν· Ἐγέρθητε καὶ μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/007.yaml
  text: And Jesus came near and touched them and said[a], “Get up[c][b], and do not be afraid.”
translation:
  language: ta
  text: இயேசு அவர்களிடம் வந்து, அவர்களைத் தொட்டு, “எழுந்திருங்கள்; பயப்படாதீர்கள்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσῆλθεν
  choice: அவர்களிடம் வந்து
  rationale: προσέρχομαι என்பது ஒருவரை நோக்கி வருவதையோ அணுகுவதையோ குறிக்கிறது. சூழலில் இயேசு சீடர்களிடம் வந்தார் என்பதை இச்சொற்றொடர் இயல்பான தமிழில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: ἁψάμενος αὐτῶν
  choice: அவர்களைத் தொட்டு
  rationale: ἅπτω என்பதன் இவ்வடிவம் ‘தொடுதல்’ என்று பொருள்படும். கிரேக்கத்தில் கூறப்படாத ‘கையை வைத்தார்’ போன்ற கூடுதல் விவரத்தைச் சேர்க்காமல் செயலை நேரடியாக வழங்குகிறது.
- source_word: εἶπεν
  choice: என்றார்
  rationale: நேர்க்கூற்றைத் தொடர்ந்து வரும் இயல்பான தமிழ் உரையாடல் வடிவம்; கிரேக்க λέγω வினையின் எளிய பொருளைத் தக்கவைக்கிறது.
- source_word: Ἐγέρθητε
  choice: எழுந்திருங்கள்
  rationale: தரையில் விழுந்து கிடந்த சீடர்கள் எழ வேண்டும் என்ற கட்டளையை இயல்பாகத் தெரிவிக்கிறது; அவர்கள் இறுதியாக நிற்க வேண்டிய உடல்நிலையைத் தேவையின்றி குறிப்பாக்கவில்லை.
- source_word: μὴ φοβεῖσθε
  choice: பயப்படாதீர்கள்
  rationale: φοβέομαι என்பதன் ‘பயப்படுதல்’ என்ற பொருளைத் தெளிவாகவும் ஆறுதலளிக்கும் கட்டளையின் தொனியை மிகைப்படுத்தாமலும் வழங்குகிறது.
theological_decisions:
- issue: இயேசுவின் ஆறுதலளிக்கும் கட்டளையின் பொருள்
  choice: “எழுந்திருங்கள்; பயப்படாதீர்கள்”
  alternative: “எழுங்கள்; அஞ்சாதீர்கள்”
  rationale: உடல்நிலையிலிருந்து எழுவதையும் பயம் கொள்ளாமல் இருப்பதையும் எளிய நேரடிக் கட்டளைகளாக வைத்திருக்கிறது. ‘இனி பயப்பட வேண்டாம்’ என ongoing-action நுணுக்கத்தை வலியுறுத்தவோ, கூடுதல் மேய்ப்புப்பணி சார்ந்த கருத்தைச் சேர்க்கவோ இல்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் இயல்பான கதைநடையும் காக்கப்பட்டுள்ளன. ‘அஞ்சாதீர்கள்’ என்பதைக் காட்டிலும் பொதுவாக உடனே புரியும் ‘பயப்படாதீர்கள்’ தேர்ந்தெடுக்கப்பட்டது; இயேசுவைக் குறிக்கும் வினைகளில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
