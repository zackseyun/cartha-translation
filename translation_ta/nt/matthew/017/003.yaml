  text: καὶ ἰδοὺ ⸀ὤφθη αὐτοῖς Μωϋσῆς καὶ Ἠλίας ⸂συλλαλοῦντες μετ’ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/003.yaml
  text: And behold[a], Moses and Elijah appeared to them, talking with him.
translation:
  language: ta
  text: இதோ, மோசேயும் எலியாவும் அவர்களுக்குத் தோன்றி, அவருடன் பேசிக்கொண்டிருந்தனர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்களால் காணப்பட்டனர்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் வடிவத்தில் செயப்பாட்டுவினையாக உள்ளது; தமிழில் ‘அவர்களுக்குத் தோன்றி’ என்பது இயல்பான நடை.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து நிகழ்வின் திடீர்மையையும் உயிரோட்டத்தையும் காட்டும் இயல்பான நவீனத் தமிழ் சொல்லாகும்.
- source_word: ὤφθη
  choice: தோன்றி
  rationale: ὁράω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவம் இங்கு காட்சியளித்தல் என்ற பொருளில் இயல்பாகப் பயன்படுகிறது; சொற்சொல்லாக ‘காணப்பட்டார்கள்’ என்றும் மொழிபெயர்க்கலாம்.
- source_word: αὐτοῖς
  choice: அவர்களுக்கு
  rationale: அந்தத் தோற்றத்தைக் கண்ட சாட்சிகளைக் குறிக்கும் வேற்றுமைப் பொருளை நேரடியாகத் தருகிறது.
- source_word: Μωϋσῆς
  choice: மோசே
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவம்.
- source_word: Ἠλίας
  choice: எலியா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவம்.
- source_word: συλλαλοῦντες
  choice: பேசிக்கொண்டிருந்தார்கள்
  rationale: ஒருவருடன் ஒருவர் உரையாடிக்கொண்டிருந்த தொடர்ச்சியான செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: μετ’ αὐτοῦ
  choice: அவருடன்
  rationale: உடனிருப்பு மற்றும் உரையாடல் தொடர்பை நேரடியாகக் காட்டுகிறது; சூழலில் ‘அவர்’ இயேசுவைக் குறிக்கிறது.
theological_decisions:
- issue: αὐτοῦ என்பதன் சுட்டுப்பொருள்
  choice: ‘அவர்’ என்பது இயேசுவைக் குறிக்கிறது; பெயரைச் சேர்க்காமல் பிரதிப்பெயர் தக்கவைக்கப்பட்டது.
  alternative: ‘இயேசுவுடன்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: மறுரூப நிகழ்வின் உடனடிச் சூழல் சுட்டுப்பொருளைத் தெளிவாக்குகிறது; கிரேக்கத்தின் பிரதிப்பெயர் வடிவத்தையும் மொழிபெயர்ப்பு காக்கிறது.
- issue: மோசே, எலியா தோன்றிய நிகழ்வின் தன்மை
  choice: அவர்கள் காணக்கூடிய வகையில் தோன்றினார்கள் என்று மட்டும் உரை கூறுகிறது.
  alternative: ‘அவர்கள் காணப்பட்டார்கள்’ என்று செயப்பாட்டு வடிவில் மொழிபெயர்த்தல்.
  rationale: அவர்களுடைய இருப்பின் முறை குறித்து மேலதிகக் கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல், உரையின் காட்சி நிகழ்வை மட்டும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், எளிதில் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இதோ’ என்பது கவன ஈர்ப்புச் சொல்லாகவும், ‘பேசிக்கொண்டிருந்தார்கள்’ என்பது பரஸ்பர உரையாடலின் தொடர்ச்சியை வெளிப்படுத்தவும் பயன்படுத்தப்பட்டுள்ளது.
