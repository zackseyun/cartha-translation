source:
  edition: SBLGNT
  text: καὶ λέγων· Κύριε, ἐλέησόν μου τὸν υἱόν, ὅτι σεληνιάζεται καὶ κακῶς ⸀πάσχει, πολλάκις γὰρ πίπτει εἰς τὸ πῦρ καὶ πολλάκις εἰς τὸ ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/015.yaml
  text: and saying[a], “Lord, have mercy on my son, because he is epileptic and suffers terribly; for he often falls into the fire and often into the water.”
translation:
  language: ta
  text: அவர், “ஆண்டவரே, என் மகன்மேல் இரக்கம் காட்டும். அவனுக்கு வலிப்பு ஏற்படுகிறது[a]; அவன் மிகவும் துன்பப்படுகிறான். அவன் அடிக்கடி நெருப்புக்குள்ளும் அடிக்கடி தண்ணீருக்குள்ளும் விழுகிறான்” என்று கூறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுக்கு காக்கைவலிப்பு இருக்கிறது.” சொற்படி, “அவன் நிலாவால் தாக்கப்படுகிறான்.” கிரேக்கச் சொல் வலிப்பைப் போன்ற ஒரு நிலைக்கான பழங்காலச் சொல்லாட்சியைப் பிரதிபலிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: இயேசுவை நோக்கிய மரியாதையான விளிப்பாகவும், κύριος என்பதன் வழக்கமான இறையியல் நிறையைத் தக்கவைக்கும் சொல்லாகவும் உள்ளது.
- source_word: ἐλέησόν μου τὸν υἱόν
  choice: என் மகன்மேல் இரக்கம் காட்டும்
  rationale: υἱός என்பதைத் துல்லியமாக ‘மகன்’ என்றும், ἐλέησόν என்பதை உதவியை நாடும் ஆழ்ந்த இரக்க வேண்டுகோளாகவும் இயல்பான தமிழில் தருகிறது.
- source_word: σεληνιάζεται
  choice: அவனுக்கு வலிப்பு ஏற்பட்டு
  rationale: நவீன மருத்துவ நோயறிதலைத் திணிக்காமல், தந்தை விவரிக்கும் வலிப்பைப் போன்ற வெளிப்படையான நிலையைத் தெளிவாகச் சொல்கிறது; சொற்பொருளிலுள்ள நிலா சார்ந்த பழமையான சொல்லாட்சி அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: κακῶς πάσχει
  choice: அவன் மிகவும் துன்பப்படுகிறான்
  rationale: κακῶς தரும் தீவிரத்தையும் πάσχει குறிக்கும் துன்பத்தையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: πολλάκις
  choice: அடிக்கடி
  rationale: மீண்டும் மீண்டும் நிகழ்வதைக் குறிக்கும் இயல்பான, சுருக்கமான தமிழ் இணைச்சொல்.
- source_word: πίπτει εἰς τὸ πῦρ ... εἰς τὸ ὕδωρ
  choice: நெருப்புக்குள்ளும் ... தண்ணீருக்குள்ளும் விழுகிறான்
  rationale: εἰς என்பதன் உள்ளே செல்லும் திசையைத் தமிழில் ‘-க்குள்’ மூலம் தெளிவாகக் காட்டி, இரு கூறுகளின் இணை அமைப்பையும் காக்கிறது.
- source_word: καὶ λέγων
  choice: என்று கூறினார்
  rationale: முந்தைய வசனத்தில் தொடங்கிய மனிதனின் செயலை இயல்பான தமிழ் கதைநடையில் தொடர்கிறது; கிரேக்கப் பங்கேற்புவினையின் தொடர்பு காலமுற்ற வினையாக வெளிப்படுத்தப்படுகிறது.
theological_decisions:
- issue: σεληνιάζεται என்பதன் மொழிபெயர்ப்பு
  choice: அவனுக்கு வலிப்பு ஏற்பட்டு
  alternative: அவன் காக்கைவலிப்பு நோயாளியாக இருக்கிறான் / அவன் நிலாவால் பாதிக்கப்பட்டிருக்கிறான்
  rationale: இந்த வசனம் நவீன மருத்துவ வகைப்பாட்டை அளிப்பதில்லை; அதேபோல் நிலாவே காரணம் என்றும் உறுதிப்படுத்துவதில்லை. ஆகவே காணக்கூடிய வலிப்பு நிலையைச் சொல்லி, பழமையான சொல்வடிவத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. வேண்டுகோளின் தீவிரமும் தந்தையின் துயரமும் காக்கப்பட்டுள்ளன; மருத்துவ அல்லது நிலா சார்ந்த காரணவிளக்கம் உரைக்குள் திணிக்கப்படவில்லை.
