reference: Matthew 17:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς, καὶ ἐξῆλθεν ἀπ’ αὐτοῦ τὸ δαιμόνιον· καὶ ἐθεραπεύθη ὁ παῖς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/018.yaml
  text: And Jesus rebuked it[a], and the demon came out of him; and the boy was healed from that hour.
translation:
  language: ta
  text: இயேசு அதைக் கண்டித்தார்; பிசாசு அவனைவிட்டு வெளியேறியது. அந்த நேரத்திலிருந்தே[a] சிறுவன் குணமடைந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அந்தக் கணத்திலிருந்தே.’
    reason: ἀπὸ τῆς ὥρας ἐκείνης என்ற கால வெளிப்பாட்டுக்கு, ‘நேரம்’ என்பதற்குப் பதிலாக உடனடித் தன்மையை அதிகமாக உணர்த்தும் மாற்று.
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: கடிந்துகொண்டார்
  rationale: ἐπιτιμάω என்பதன் கடுமையான, அதிகாரமுள்ள கண்டிப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; வெறுமனே ‘கட்டளையிட்டார்’ என்று பொருளைக் குறுக்கவில்லை.
- source_word: αὐτῷ
  choice: அதை
  rationale: இலக்கண வடிவம் ஆண்பால் அல்லது அஃறிணையைக் குறிக்கக்கூடியது. அடுத்த சொற்றொடரில் பிசாசு வெளியேறியதாக வருவதால், கண்டிப்பு பிசாசை நோக்கியது என்பதே சூழலுக்கு மிகவும் பொருந்துகிறது. தமிழில் ‘பிசாசு’ என்பதைக் குறிக்க ‘அதை’ இயல்பானது.
- source_word: τὸ δαιμόνιον
  choice: பிசாசு
  rationale: δαιμόνιον என்பதற்கான நேரடியான, பொதுவாகப் புரியும் தமிழ் சொல். மூலத்தில் இல்லாத ‘அசுத்த ஆவி’ என்ற சொல்லாட்சியைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: ἐξῆλθεν ἀπ’ αὐτοῦ
  choice: அவனைவிட்டு வெளியேறியது
  rationale: பிசாசு சிறுவனிடமிருந்து நீங்கிய செயலைத் தெளிவாகவும், கிரேக்க வெளிப்பாட்டுக்கு நெருக்கமாகவும் கூறுகிறது.
- source_word: ἐθεραπεύθη
  choice: குணமடைந்தான்
  rationale: செயப்பாட்டு வடிவின் விளைவான குணப்படுதலை இயல்பான தமிழில் தெரிவிக்கிறது; மருத்துவச் சிகிச்சை என்ற குறுகிய பொருளுக்குள் அடைக்கவில்லை.
- source_word: ὁ παῖς
  choice: சிறுவன்
  rationale: παῖς என்பது குழந்தை அல்லது பணியாளர் எனப் பொருள்படலாம்; தந்தையின் மகனைப் பற்றிய இச்சூழலில் ‘சிறுவன்’ துல்லியமானது.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: அந்த நேரத்திலிருந்தே
  rationale: ἀπό என்பதன் தொடக்கப்புள்ளியையும் ὥρα என்பதன் நேரக் குறிப்பையும் காக்கும் இயல்பான நவீனத் தமிழ். உடனடி விளைவையும் உணர்த்துகிறது.
theological_decisions:
- issue: இயேசுவின் கண்டிப்பைப் பெற்ற αὐτῷ என்பதன் சுட்டுப்பொருள்
  choice: பிசாசு—‘அதை’
  alternative: சிறுவன்—‘அவனை’
  rationale: அடுத்த உடனடி வாக்கியம் பிசாசு அவனைவிட்டு வெளியேறியதாகக் கூறுவதால், இயேசுவின் கண்டிப்பு பிசாசை நோக்கியது என்பதே சூழலில் வலுவாக ஆதரிக்கப்படுகிறது. ஆயினும், மூலப் பிரதிப்பெயரின் இலக்கண வடிவம் மட்டும் இதைத் தனியாகத் தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம உரைக்கேற்ற கண்ணியமும் காக்கப்பட்டுள்ளன. ‘கடிந்துகொண்டார்’ அதிகாரமுள்ள கண்டிப்பைக் காட்டுகிறது; ‘அந்த நேரத்திலிருந்தே’ என்பது சொல்லுக்குச் சொல்லான இறுக்கத்தைத் தவிர்த்து மூலத்தின் காலத் தொடர்பை இயல்பாகப் பாதுகாக்கிறது.
