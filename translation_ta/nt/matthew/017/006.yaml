  text: And when the disciples heard it[c][b][a], they fell on their faces and were greatly afraid.
translation:
  language: ta
  text: சீடர்கள் அதைக் கேட்டபோது[a], முகங்குப்புற விழுந்து[b], மிகவும் பயந்தார்கள்[c].
  philosophy: optimal-equivalence
