  - marker: a
    text: ‘கேட்டபோது’ என்பதற்கு ‘கேட்டு’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் ஆரிஸ்ட் வினையெச்சம் உள்ளது. ‘அதை’ என்பது முந்தைய வசனத்தில் கேட்ட குரலைச் சூழலிலிருந்து குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: நேர்சொல் முறையில், ‘தங்கள் முகத்தின்மேல் விழுந்தார்கள்’; ‘முகங்குப்புற விழுந்து’ என்பது அந்த உடல் நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அதாவது, அவர்கள் கடுமையாகப் பயந்தார்கள்; ‘மிகவும்’ என்பது σφόδρα என்ற வினையடையின் தீவிரத்தைத் தெரிவிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: அதைக் கேட்டபோது
  rationale: இறந்தகால வினையெச்சத்தை இயல்பான தமிழ் காலவாக்கியமாக மொழிபெயர்க்கிறது. ‘அதை’ என்பது முந்தைய வசனத்தில் அவர்கள் கேட்ட வானத்திலிருந்து வந்த குரலைச் சூழலிலிருந்து சுட்டுகிறது.
- source_word: οἱ μαθηταὶ
  choice: சீடர்கள்
  rationale: நற்செய்தி நூல்களில் இயேசுவைப் பின்பற்றிய μαθηταί என்போருக்கான தெளிவான, வழக்கமான தமிழ் சொல்.
- source_word: ἔπεσαν
  choice: விழுந்து
  rationale: πίπτω என்ற வினையின் நேரடியான நிகழ்வுணர்வைப் பேணுகிறது; மூலத்தில் இல்லாத கூடுதல் தீவிரத்தையோ தாங்களாகவே தரையில் வீழ்ந்தார்கள் என்ற விளக்கத்தையோ சேர்க்கவில்லை.
- source_word: ἐπὶ πρόσωπον αὐτῶν
  choice: முகங்குப்புற
  rationale: முகம் தரையை நோக்கி விழும் உடல் நிலையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது. கிரேக்கத்தில் ‘முகம்’ ஒருமையில் இருந்தாலும், பன்மை எழுவாயுடன் தமிழில் இவ்வடிவம் இயல்பாக உள்ளது.
- source_word: ἐφοβήθησαν
  choice: பயந்தார்கள்
  rationale: φοβέομαι என்பதன் உணர்ச்சிசார் பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது; அது பக்தியுணர்வா அல்லது திகிலா என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- source_word: σφόδρα
  choice: மிகவும்
  rationale: அவர்களுடைய பயத்தின் மிகுதியைச் சுட்டும் வினையடையின் வலிமையைத் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தெய்வீகக் குரலுக்கு சீடர்கள் காட்டிய எதிர்வினையின் தன்மை
  choice: முகங்குப்புற விழுந்த உடல் நிலையும் மிகுந்த பயமும் மட்டும் உரையில் கூறப்படுகின்றன.
  alternative: இதை முதன்மையாக வழிபாட்டுக்குரிய பயபக்தி என்றோ, தெய்வீக வெளிப்பாட்டின்முன் ஏற்பட்ட திகில் என்றோ வெளிப்படையாக விளக்கலாம்.
  rationale: கிரேக்க உரை அவர்களுடைய உடல் நிலையையும் பயத்தையும் கூறுகிறது; அந்த எதிர்வினைக்கு ஒரு குறிப்பிட்ட இறையியல் பொருளை அளிக்கவில்லை. ஆகவே இரு சாத்தியங்களுக்கிடையேயான பதற்றம் பேணப்படுகிறது.
