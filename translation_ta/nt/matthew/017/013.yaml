reference: Matthew 17:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τότε συνῆκαν οἱ μαθηταὶ ὅτι περὶ Ἰωάννου τοῦ βαπτιστοῦ εἶπεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/013.yaml
  text: Then the disciples understood that he had spoken to them about John the Baptist[a].
translation:
  language: ta
  text: அப்போது, அவர் திருமுழுக்கு கொடுக்கும் யோவானைப் பற்றி அவர்களிடம் பேசியிருந்தார் என்பதைச் சீடர்கள் புரிந்துகொண்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திருமுழுக்கு யோவான்.”
    reason: βαπτιστής என்பதற்கான மரபான தமிழ் பட்டப்பெயரை மாற்றாகக் காட்டுகிறது.
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: சீடர்கள் உணர்ந்த தருணத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ் கதை இணைப்பு.
- source_word: συνῆκαν
  choice: புரிந்துகொண்டார்கள்
  rationale: சொல்லப்பட்டதன் பொருளை அவர்கள் அந்தத் தருணத்தில் உணர்ந்ததை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οἱ μαθηταὶ
  choice: சீடர்கள்
  rationale: நற்செய்தி நூல்களில் இயேசுவைப் பின்பற்றுவோரைக் குறிக்கும் நிலையான தமிழ் சொல்.
- source_word: ὅτι
  choice: என்பதை
  rationale: அவர்கள் புரிந்துகொண்ட செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; காரணத்தைக் குறிக்கவில்லை.
- source_word: περὶ
  choice: பற்றி
  rationale: இயேசுவின் பேச்சின் பொருளைச் சுட்டும் இயல்பான தமிழ் இணைப்பு.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: திருமுழுக்கு கொடுக்கும் யோவான்
  rationale: βαπτιστής என்பதன் செயற்பாட்டு அர்த்தமான ‘முழுக்கிடுபவர்’ என்பதைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; மரபான பட்டப்பெயர் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: εἶπεν αὐτοῖς
  choice: தம்மிடம் அவர் ... பேசினார்
  rationale: கிரேக்கத்தின் எளிய இறந்தகால வினையைத் தமிழில் இயல்பாகத் தருகிறது; αὐτοῖς என்பதையும் வெளிப்படையாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: உடனடியான சூழலில் எலியாவைக் குறித்த பேச்சின் அடையாளம்
  choice: இயேசு திருமுழுக்கு கொடுக்கும் யோவானைப் பற்றிப் பேசியதாகச் சீடர்கள் புரிந்துகொண்டார்கள் என்று நேரடியாகக் கூறுதல்
  alternative: இந்த அடையாளத்தை விளக்கவுரையாக விரிவுபடுத்துதல் அல்லது வேறு வகையில் ஒத்திசைத்தல்
  rationale: இது மொழிபெயர்ப்பாளரின் இறையியல் ஊகம் அல்ல; வசனமே சீடர்களின் புரிதலை வெளிப்படையாகப் பதிவு செய்கிறது. ஆகவே உரையைத் தாண்டி விரிவுபடுத்தாமல் அதைப் plainly வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தம்மிடம்’ என்பது சீடர்களைக் குறிக்கிறது; ‘அவர்’ என்பது இயேசுவைக் குறிக்கிறது. பிரதான உரையில் செயற்பாட்டு பட்டப்பெயர் பயன்படுத்தப்பட்டு, மரபான வடிவம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
