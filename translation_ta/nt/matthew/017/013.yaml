revisions:
- from: அப்போது, தம்மிடம் அவர் திருமுழுக்கு கொடுக்கும் யோவானைப் பற்றிப் பேசினார் என்பதைச் சீடர்கள் புரிந்துகொண்டார்கள்.[a]
  to: அப்போது, அவர் திருமுழுக்கு கொடுக்கும் யோவானைப் பற்றி அவர்களிடம் பேசியிருந்தார் என்பதைச் சீடர்கள் புரிந்துகொண்டார்கள்.[a]
