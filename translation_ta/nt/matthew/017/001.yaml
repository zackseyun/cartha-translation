id: MAT.17.1
reference: Matthew 17:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ μεθ’ ἡμέρας ἓξ παραλαμβάνει ὁ Ἰησοῦς τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, καὶ ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν κατ’ ἰδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/001.yaml
  text: And after six days Jesus takes Peter[a], James, and John his brother[c][b], and leads them up onto a high mountain by themselves.
translation:
  language: ta
  text: ஆறு நாட்களுக்குப் பிறகு[a], இயேசு பேதுருவையும் யாக்கோபையும் அவனுடைய சகோதரனான யோவானையும் தம்முடன் அழைத்துக்கொண்டு[b], அவர்களை மற்றவர்களிடமிருந்து தனியே[c] ஓர் உயரமான மலைமேல் அழைத்துச் செல்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆறு நாட்கள் கழித்து.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தம்மோடு கூட்டிக்கொண்டு.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “தனியாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μεθ’ ἡμέρας ἓξ
  choice: ஆறு நாட்களுக்குப் பிறகு
  rationale: μετά + accusative காலத் தொடர்ச்சியைக் குறிக்கிறது. இந்தத் தமிழ் சொற்றொடர் கிரேக்க அமைப்புக்கு நெருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: παραλαμβάνει
  choice: தம்முடன் அழைத்துக்கொண்டு
  rationale: παραλαμβάνω இங்கு ஒருவரைத் தன்னுடன் கூட்டிச் செல்வதைக் குறிக்கிறது. வெறும் ‘அழைத்துக்கொண்டு’ என்பதைக் காட்டிலும் ‘தம்முடன்’ என்பது அந்த உடன்செல்லும் பொருளைத் தெளிவாக்குகிறது.
- source_word: Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην
  choice: பேதுருவையும் யாக்கோபையும் ... யோவானையும்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; καὶ-இன் பட்டியல் இணைப்பு தமிழில் இயல்பான ‘-உம்/-ஐயும்’ அமைப்பால் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: அவனுடைய சகோதரனான
  rationale: இச்சொற்றொடர் யோவானை யாக்கோபின் சகோதரனாக அடையாளப்படுத்துகிறது. கிரேக்கத்தின் ‘அவனுடைய’ என்ற சுட்டுப்பெயர் அமைப்பை முடிந்தவரை காத்து, தமிழில் இயல்பான பெயரடைத் தொடராக வழங்கப்பட்டுள்ளது.
- source_word: ἀναφέρει
  choice: மலைமேல் அழைத்துச் செல்கிறார்
  rationale: ἀναφέρω இங்கு மேல்நோக்கிய இயக்கத்துடன் ஒருவரை அழைத்துச் செல்வதைக் குறிக்கிறது. ‘மலைமேல்’ என்பதுடன் சேர்ந்த இந்த வடிவம் ஏற்றத்தையும் இலக்கையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: εἰς ὄρος ὑψηλὸν
  choice: ஓர் உயரமான மலைமேல்
  rationale: εἰς இயக்கத்தின் இலக்கைக் குறிக்கிறது. தமிழில் ‘மலைமேல்’ என்பது மலையை நோக்கிச் சென்று அதன்மேல் ஏறுவதைக் கூறும் இயல்பான இலக்கு மொழியாகும்.
- source_word: κατ’ ἰδίαν
  choice: தனியாக
  rationale: இந்தச் சூழலில் மற்றவர்களிடமிருந்து பிரிந்து தனிப்பட்ட முறையில் சென்றதைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
theological_decisions:
- issue: நற்செய்தி நூலின் வரலாற்று நிகழ்கால வினைகள்
  choice: ‘அழைத்துக்கொண்டு ... அழைத்துச் செல்கிறார்’ என நிகழ்காலத்தைத் தக்கவைத்தல்
  alternative: ‘அழைத்துக்கொண்டு ... அழைத்துச் சென்றார்’ என இறந்தகாலத்திற்கு மாற்றுதல்
  rationale: παραλαμβάνει, ἀναφέρει ஆகியவை கிரேக்கத்தில் வரலாற்று நிகழ்காலமாக வந்து கதையாடலுக்கு உயிரோட்டம் தருகின்றன. தமிழிலும் இங்கு நிகழ்காலக் கதையாடல் புரிந்துகொள்ளத்தக்கதாக இருப்பதால் அது தக்கவைக்கப்பட்டுள்ளது.
- issue: τὸν ἀδελφὸν αὐτοῦ என்பதில் சகோதர உறவின் தொடர்பு
  choice: யோவானை யாக்கோபின் சகோதரனாக வாசித்தல்
  alternative: சுட்டுப்பெயரின் தொடர்பை வெளிப்படையாகத் தீர்மானிக்காமல் ‘அவனுடைய சகோதரனாகிய யோவான்’ என்று விடுதல்
  rationale: தொடரின் இயல்பான இலக்கண மற்றும் சூழல் தொடர்பு யாக்கோபையே முன்னோடியாகக் காட்டுகிறது. இருப்பினும் ‘அவனுடைய’ என்ற கிரேக்கச் சுட்டுப்பெயர் வடிவம் தமிழில் ஓரளவு காக்கப்பட்டுள்ளது; பெயரைப் புதிதாகச் சேர்த்து விளக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘தம்முடன்’ என்பது இயேசுவைக் குறிக்கும் மரியாதைப் பிரதிபெயர். பெயர்கள் தமிழ் வேதாகம மரபில் பரவலாக அறியப்பட்ட வடிவங்களில் தரப்பட்டுள்ளன.
