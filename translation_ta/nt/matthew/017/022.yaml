source:
  edition: SBLGNT
  text: ⸀Συστρεφομένων δὲ αὐτῶν ἐν τῇ Γαλιλαίᾳ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μέλλει ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοσθαι εἰς χεῖρας ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/022.yaml
  text: While they were gathering together in Galilee[a], Jesus said to them[c][b], “The Son of Man is about to be delivered into the hands of men,”
translation:
  language: ta
  text: அவர்கள் கலிலேயாவில் ஒன்றுகூடியிருந்தபோது[a], இயேசு அவர்களிடம், “மனிதகுமாரன் மனிதர்களின் கைகளில்[c] ஒப்படைக்கப்படவிருக்கிறார்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கூடிவந்தபோது.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கையளிக்கப்படவிருக்கிறார்.”
    reason: lexical_alternative
  - marker: c
    text: 'நேரடி மொழிபெயர்ப்பு: “மனிதர்களின் கைகளில்.” இங்கு மனிதர்களின் அதிகாரத்திற்கு உட்படுவதைக் குறிக்கும் உருவகம்.'
    reason: idiom_clarification
lexical_decisions:
- source_word: Συστρεφομένων
  choice: ஒன்றுகூடியிருந்தபோது
  rationale: குழுவினர் ஒன்றாகக் கூடிவந்ததையோ ஒன்றாக இருந்ததையோ குறிக்கும் பங்கேற்புவினையின் கூட்டு உணர்வைப் பாதுகாக்கிறது; இயக்கத்தைத் தேவையின்றி மிகத் துல்லியமாக வரையறுக்கவில்லை.
- source_word: δὲ
  choice: -போது
  rationale: இணைப்புச் சொல்லையும் தனிநிலை உடைமை வேற்றுமைப் பங்கேற்புவினை அமைப்பையும் இயல்பான தமிழ் காலத் தொடர்பாக ஒருங்கிணைக்கிறது.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: கலிலேயாவில்
  rationale: இடத்தைக் குறிக்கும் கிரேக்கச் சொற்றொடரின் நேரான, இயல்பான மொழிபெயர்ப்பு.
- source_word: εἶπεν αὐτοῖς
  choice: இயேசு அவர்களிடம் … என்றார்
  rationale: கிரேக்க வாக்கியத்தின் கூறும் வினையையும் மறைமுகச் செயப்படுபொருளையும் இயல்பான தமிழ் மேற்கோள் அமைப்பில் தருகிறது.
- source_word: Μέλλει
  choice: -விருக்கிறார்
  rationale: நிகழவிருக்கும் செயலைக் குறிக்கும் μέλλω என்பதன் முன்னோக்கிய, அண்மித்த எதிர்கால உணர்வைப் பாதுகாக்கிறது; விதிக்கப்பட்ட நிலை என்ற வலுவான கருத்தைச் சேர்க்கவில்லை.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: இயேசுவின் சுயக்குறிப்பாக மரபாக நிலைபெற்றுள்ள நேரான மொழிபெயர்ப்பு; அதன் வேதாகம இடைஉரை மற்றும் இறையியல் எதிரொலியைப் பாதுகாக்கிறது.
- source_word: παραδίδοσθαι
  choice: ஒப்படைக்கப்பட
  rationale: செயப்பாட்டு வடிவைப் பாதுகாத்து, துரோகம், கைது அல்லது நீதிமுறை மாற்றம் ஆகியவற்றில் ஒன்றாக மட்டும் பொருளைச் சுருக்காமல் விடுகிறது.
- source_word: εἰς χεῖρας
  choice: கைகளில்
  rationale: கிரேக்க உருவகத்தைத் தமிழிலும் புரியக்கூடிய வகையில் பாதுகாக்கிறது; ‘அதிகாரத்துக்குள்’ என்று விளக்கவுரையாக்கவில்லை.
- source_word: ἀνθρώπων
  choice: மனிதர்களின்
  rationale: பன்மை ἀνθρώπων என்பதைக் பாலினத்தைத் தேவையின்றி வரையறுக்காமல் துல்லியமாகத் தருகிறது; ‘மனிதகுமாரன்’ என்பதுடனான சொல்லியல் எதிரொலியையும் காக்கிறது.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου என்பதன் மொழிபெயர்ப்பு
  choice: மனிதகுமாரன்
  alternative: மனிதர்
  rationale: மரபாக நிலைபெற்றுள்ள நேரான வடிவம் நற்செய்தி நூல்களில் இச்சொற்றொடருக்குள்ள வேதாகம மற்றும் இறையியல் எதிரொலியைப் பாதுகாக்கிறது; மாற்று வடிவம் அதைக் குறைக்கக்கூடும்.
- issue: வேதனை முன்னறிவிப்பில் παραδίδοσθαι என்பதன் நுட்பம்
  choice: ஒப்படைக்கப்பட
  alternative: கையளிக்கப்பட; காட்டிக்கொடுக்கப்பட
  rationale: செயப்பாட்டு நிலையையும் செயலைச் செய்பவர் வெளிப்படையாகக் குறிப்பிடப்படாத தன்மையையும் காக்கிறது. ‘காட்டிக்கொடுக்கப்பட’ என்பது யூதாசின் துரோகத்தை மட்டும் முன்கூட்டியே முன்னிலைப்படுத்தி பொருளைச் சுருக்கக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. மேற்கோள் தமிழ் வாக்கிய ஒழுங்குக்கேற்ப வினைமுடிவுடன் தரப்பட்டுள்ளது; கிரேக்கத்தின் உருவகமும் செயப்பாட்டு வடிவமும் பாதுகாக்கப்பட்டுள்ளன.
