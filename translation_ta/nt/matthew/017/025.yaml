source:
  edition: SBLGNT
  text: λέγει· Ναί. καὶ ⸀ἐλθόντα εἰς τὴν οἰκίαν προέφθασεν αὐτὸν ὁ Ἰησοῦς λέγων· Τί σοι δοκεῖ, Σίμων; οἱ βασιλεῖς τῆς γῆς ἀπὸ τίνων λαμβάνουσιν τέλη ἢ κῆνσον; ἀπὸ τῶν υἱῶν αὐτῶν ἢ ἀπὸ τῶν ἀλλοτρίων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/025.yaml
  text: He said[a], “Yes.” And when he came into the house, Jesus spoke to him first, saying, “What do you think[b], Simon? From whom do the kings of the earth collect duties or poll tax—from their own sons or from others?”
translation:
  language: ta
  text: அவன், “ஆம்” என்றான். அவன் வீட்டிற்குள் வந்தபோது, அவன் பேசுவதற்கு முன்பே இயேசு அவனிடம், “சீமோனே, உனக்கு என்ன தோன்றுகிறது? பூமியின் அரசர்கள் சுங்க வரிகளையோ தலைவரியையோ[a] யாரிடமிருந்து வசூலிக்கிறார்கள்—தங்கள் சொந்த மகன்களிடமிருந்தா, மற்றவர்களிடமிருந்தா[b]?” என்று கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சுங்கங்களையோ கப்ப வரியையோ.” கிரேக்கத்தில் τέλη என்பது சுங்கம் அல்லது மறைமுக வரியையும், κῆνσος என்பது தலைவரி அல்லது கப்ப வரியையும் குறிக்கும் வேறுபட்ட சொற்கள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அந்நியர்களிடமிருந்தா?” கிரேக்கச் சொல் தங்கள் சொந்தக் குடும்பத்தைச் சேர்ந்திராத வெளியாரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ναί
  choice: ஆம்
  rationale: எளிய உறுதியான பதிலை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἐλθόντα εἰς τὴν οἰκίαν
  choice: அவன் வீட்டிற்குள் வந்தபோது
  rationale: குற்றுவினைப் பங்கேற்பின் காலத் தொடர்பையும், அதன் மறைமுக எழுவாய் பேதுரு என்பதையும் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: προέφθασεν αὐτὸν
  choice: அவன் பேசுவதற்கு முன்பே இயேசு அவனிடம்
  rationale: பேதுரு பேசுமுன் இயேசு உரையாடலைத் தொடங்கினார் என்ற சூழல்சார் பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: Τί σοι δοκεῖ
  choice: உனக்கு என்ன தோன்றுகிறது?
  rationale: சீமோனின் கருத்தைக் கேட்கும் கிரேக்க வழக்குத்தொடருக்கு இயல்பான தமிழ் இணை.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: பூமியின் அரசர்கள்
  rationale: γῆ என்பதன் பரந்த பொருளை ஒரு குறிப்பிட்ட நாட்டுக்குள் சுருக்காமல் காக்கிறது.
- source_word: τέλη
  choice: சுங்க வரிகள்
  rationale: மறைமுக வரிகள், சுங்கங்கள் அல்லது தீர்வைகளைக் குறிக்கும் சொல்லை அடுத்துள்ள தலைவரியிலிருந்து வேறுபடுத்துகிறது.
- source_word: κῆνσον
  choice: தலைவரி
  rationale: ஒரு நபர்மீது விதிக்கப்படும் வரி அல்லது கப்ப வரி என்ற குறிப்பான பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: υἱῶν αὐτῶν
  choice: தங்கள் சொந்த மகன்கள்
  rationale: υἱοί என்பதன் ஆண்பால் குடும்ப மொழியையும் அரசரின் குடும்பத்தாருக்கும் பிறருக்கும் உள்ள வேறுபாட்டையும் காக்கிறது.
- source_word: ἀλλοτρίων
  choice: மற்றவர்கள்
  rationale: தங்களுக்குச் சொந்தமானவர்கள் அல்லாத குடும்பத்திற்கு வெளியேயுள்ளவர்களைக் குறிக்கிறது; ‘அந்நியர்’ என மொழிபெயர்த்து வெளிநாட்டவர் என்ற தேவையற்ற குறுகிய பொருளைத் தவிர்க்கிறது.
theological_decisions:
- issue: இயேசுவின் உவமையில் ‘மகன்கள்’ என்பதால் எழக்கூடிய கிறிஸ்துவியல் உட்குறிப்பு
  choice: ‘தங்கள் சொந்த மகன்கள்’ என்ற குடும்ப மொழியை விரிவான விளக்கமின்றி அப்படியே வைத்தல்
  alternative: ‘தங்கள் பிள்ளைகள்’ அல்லது ‘தங்கள் குடிமக்கள்’
  rationale: உடனடி ஒப்புமை அரசரின் சொந்த குடும்பத்தினர் வரியிலிருந்து விடுபடுவதைப் பற்றியது; அடுத்த வசனத்தில் வெளிப்படும் இறையியல் உட்குறிப்பை முன்கூட்டியே தீர்த்துவிடாமல் ‘மகன்கள்’ என்பது கதையின் பதற்றத்தைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வரி வகைகளுக்கிடையிலான வேறுபாடும் ‘மகன்கள்—மற்றவர்கள்’ என்ற குடும்ப எதிர்மறையும் பாதுகாக்கப்பட்டுள்ளன.
