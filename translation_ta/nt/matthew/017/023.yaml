  text: and they will kill him[a], and on the third day he will be raised. And they were deeply grieved.
translation:
  language: ta
  text: அவர்கள் அவரைக் கொலை செய்வார்கள்; மூன்றாம் நாளில் அவர் உயிர்த்தெழுப்பப்படுவார்.[a] அவர்கள் மிகவும் துயரமடைந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “அவர் உயிர்த்தெழுவார்.” கிரேக்க வினைச்சொல் செயப்பாட்டு வடிவில் உள்ளது: “அவர் உயிர்த்தெழுப்பப்படுவார்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκτενοῦσιν αὐτόν
  choice: அவர்கள் அவரைக் கொலைசெய்வார்கள்
  rationale: எதிர்காலச் செயப்பாட்டு வினையை நேரடியாகவும் இயல்பாகவும் தருகிறது. ‘கொன்றுபோடுவார்கள்’ என்பதைக் காட்டிலும் இது நவீன தரத்தமிழில் கண்ணியமானது; ‘படுகொலை செய்வார்கள்’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத கூடுதல் நுணுக்கத்தைச் சேர்க்கலாம்.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: மூன்றாம் நாளில்
  rationale: காலத்தைக் குறிக்கும் கிரேக்க வேற்றுமையின் வழக்கமான, துல்லியமான தமிழ் வடிவம்; தேவையற்ற விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: ἐγερθήσεται
  choice: அவர் உயிர்த்தெழுப்பப்படுவார்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது. சூழலில் ἐγείρω மரணத்திலிருந்து உயிர்ப்பிக்கப்படுவதைக் குறிக்கிறது; ‘எழுப்பப்படுவார்’ மட்டும் தமிழில் போதிய தெளிவில்லாமல் இருக்கலாம்.
- source_word: ἐλυπήθησαν σφόδρα
  choice: சீடர்கள் மிகவும் துயரமடைந்தார்கள்
  rationale: σφόδρα தரும் தீவிரத்தையும் λυπέω குறிக்கும் ஆழ்ந்த துயரத்தையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது. கிரேக்கத்தில் மறைந்துள்ள பன்மை எழுவாயை முந்தைய சூழலின்படி ‘சீடர்கள்’ என்று தெளிவாக்குகிறது.
- source_word: καὶ ... καὶ ... καὶ
  choice: ; ... . இதனால் ...
  rationale: கிரேக்கத்தின் தொடர்ச்சியை தமிழில் இயல்பான வாக்கிய ஓட்டமாக அளிக்கிறது. இறுதி καί சூழல்சார் விளைவுத் தொடர்பைக் கொண்டிருப்பதால் ‘இதனால்’ என்று வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: உயிர்த்தெழுதல் முன்னறிவிப்பைச் செயப்பாட்டு அல்லது தன்வினை வடிவில் தருதல்
  choice: அவர் உயிர்த்தெழுப்பப்படுவார்
  alternative: அவர் உயிர்த்தெழுவார்
  rationale: ἐγερθήσεται இலக்கணரீதியாக எதிர்காலச் செயப்பாட்டு வடிவம். அதைத் தமிழிலும் பாதுகாப்பது கடவுளின் செயலை மறைமுகமாக உணர்த்தும் மூலத்தின் சொல்லமைப்பை நிலைநிறுத்துகிறது; மாற்று தன்வினை வடிவமும் பொருளளவில் சாத்தியமானது என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத்தமிழில் இயல்பான, கண்ணியமான நடை. முன்னைய வசனத்தின் எழுவாயைத் தெளிவுபடுத்த ‘சீடர்கள்’ சேர்க்கப்பட்டுள்ளது. செயப்பாட்டு உயிர்த்தெழுதல் மொழி பிரதான உரையில் பாதுகாக்கப்பட்டு, இயல்பான தன்வினை மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
