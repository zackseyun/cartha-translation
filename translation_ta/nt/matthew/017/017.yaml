  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ὦ γενεὰ ἄπιστος καὶ διεστραμμένη, ἕως πότε ⸂μεθ’ ὑμῶν ἔσομαι⸃; ἕως πότε ἀνέξομαι ὑμῶν; φέρετέ μοι αὐτὸν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/017.yaml
  text: But Jesus answered[a], “O unbelieving and perverse generation[c][b], how long will I be with you? How long will I bear with you? Bring him here to me.”
translation:
  language: ta
  text: இயேசு பதிலளித்து, “நம்பிக்கையற்றதும் நெறிபிறழ்ந்ததுமான தலைமுறையே![a] இன்னும் எவ்வளவு காலம் நான் உங்களோடு இருப்பேன்? இன்னும் எவ்வளவு காலம் உங்களைச் சகித்துக்கொள்வேன்? அவனை இங்கே என்னிடம் கொண்டுவாருங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நம்பிக்கையற்றதும் நெறிபிறழ்ந்ததுமான தலைமுறை” என்பதை “விசுவாசமற்றதும் சீர்கெட்டதுமான தலைமுறை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: அதற்கு இயேசு ... என்றார்
  rationale: ἀποκριθείς ... εἶπεν என்பது ‘பதிலாகச் சொன்னார்’ என்ற பொருளுடைய வழக்குச் சொற்றொடர். முந்தைய உரைக்கு இயேசு பதிலளிப்பதை இயல்பான தமிழில் ‘அதற்கு’ உணர்த்துகிறது; δέ-யின் மெல்லிய மாற்றத்தையும் காக்கிறது.
- source_word: Ὦ γενεὰ
  choice: தலைமுறையே!
  rationale: Ὦ என்னும் உணர்ச்சிமிக்க விளிப்பைத் தமிழின் விளிவேற்றுமையும் வியப்புக்குறியும் இயல்பாக வெளிப்படுத்துகின்றன. γενεά என்பதன் தலைமுறை சார்ந்த தீர்க்கதரிசனத் தொனி காக்கப்படுகிறது.
- source_word: ἄπιστος
  choice: நம்பிக்கையற்ற
  rationale: இச்சூழலில் விசுவாசம் அல்லது நம்பிக்கை இல்லாமையை நேரடியாகக் குறிக்கிறது; உடன்படிக்கைத் துரோகம் என்ற கூடுதல் பொருளைத் திணிக்கவில்லை.
- source_word: διεστραμμένη
  choice: நெறிபிறழ்ந்த
  rationale: διαστρέφω என்பதன் சிதைந்த, நேர்மையிலிருந்து விலகிய நிலையை dignified modern Tamil-ல் இயல்பாகச் சொல்கிறது; பாலியல் சார்ந்த நவீன துணைப்பொருளைத் தவிர்க்கிறது.
- source_word: ἕως πότε μεθ’ ὑμῶν ἔσομαι
  choice: இன்னும் எவ்வளவு காலம் நான் உங்களோடு இருப்பேன்?
  rationale: ἕως πότε என்ற காலவினாவையும் எதிர்கால வினை வடிவையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἕως πότε ἀνέξομαι ὑμῶν
  choice: இன்னும் எவ்வளவு காலம் உங்களைச் சகித்துக்கொள்வேன்?
  rationale: ἀνέχομαι என்பதிலுள்ள பொறுத்தல் அல்லது தாங்குதல் என்ற கருத்தையும் இயேசுவின் வருத்தமிக்க கண்டனத் தொனியையும் காக்கிறது.
- source_word: φέρετέ μοι αὐτὸν ὧδε
  choice: அவனை இங்கே என்னிடம் கொண்டுவாருங்கள்
  rationale: பாதிக்கப்பட்ட சிறுவனை இயேசுவிடம் கொண்டு வருமாறு கூறும் பன்மை ஏவலைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἄπιστος என்பதன் பொருள்
  choice: நம்பிக்கையற்ற
  alternative: விசுவாசமற்ற / உண்மையற்ற
  rationale: உடனடிச் சூழல் போதாத நம்பிக்கையை மையப்படுத்துகிறது. ‘நம்பிக்கையற்ற’ என்பது நம்பாமை மற்றும் நம்பிக்கை இன்மை ஆகியவற்றுக்கிடையிலான கிரேக்கச் சொல்லின் பரப்பை ஓரளவு திறந்தவாறே வைக்கிறது; ‘உண்மையற்ற’ ஏற்படுத்தக்கூடிய உடன்படிக்கைத் துரோகப் பொருளைச் சேர்க்கவில்லை.
- issue: இயேசுவின் இரண்டு வினாக்களின் இலக்கு
  choice: ‘உங்களோடு / உங்களை’ என்ற பன்மையை மாற்றமின்றிக் காத்தல்
  alternative: சீடர்களை மட்டும் அல்லது கூட்டத்தை மட்டும் வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: ὑμῶν என்பது பன்மை என்றாலும், அது சீடர்களையா, அங்கு இருந்த மக்களையா, அந்தத் தலைமுறையையா குறிக்கிறது என்பதை வசனம் தனியாகத் தீர்மானிக்கவில்லை. மொழிபெயர்ப்பு அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் கலந்த பொதுநடை பயன்படுத்தப்பட்டுள்ளது. கண்டனமும் வருத்தமும் நிறைந்த உயர்தொனி காக்கப்படுகிறது; வழக்கொழிந்த ‘ஓ’ தவிர்க்கப்பட்டு, தமிழ் விளிப்புமுறை பயன்படுத்தப்பட்டுள்ளது.
