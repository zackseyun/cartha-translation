id: MAT.17.12
reference: Matthew 17:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι Ἠλίας ἤδη ἦλθεν, καὶ οὐκ ἐπέγνωσαν αὐτὸν ἀλλὰ ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν· οὕτως καὶ ὁ υἱὸς τοῦ ἀνθρώπου μέλλει πάσχειν ὑπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/012.yaml
  text: But I tell you that Elijah has already come[a], and they did not recognize him, but did to him whatever they wanted[c][b]. So also the Son of Man is about to suffer at their hands.
translation:
  language: ta
  text: 'ஆனால் நான் உங்களுக்குச் சொல்கிறேன்: எலியா ஏற்கெனவே வந்துவிட்டார். அவர்களோ அவரை அடையாளம் கண்டுகொள்ளாமல்[a], அவரைத் தாங்கள் விரும்பியபடியெல்லாம் நடத்தினார்கள்.[b] அவ்வாறே மனிதகுமாரனும் அவர்களால் பாடுபடவிருக்கிறார்.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவரை அறிந்துகொள்ளவில்லை’ அல்லது ‘அவரை ஏற்றுக்கொள்ளவில்லை.’ கிரேக்கச் சொல், அவர் யார் அல்லது அவரது பங்கு என்ன என்பதைச் சரியாக உணரத் தவறியதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவருக்கு எதிராகத் தாங்கள் விரும்பியதையெல்லாம் செய்தார்கள்’ அல்லது ‘அவரிடம் தாங்கள் விரும்பியபடி நடந்துகொண்டார்கள்.’ கிரேக்க மரபுத்தொடர், அவர்மீது தங்கள் விருப்பப்படி கட்டுப்பாடின்றிச் செயல்பட்டதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘பாடுபடப் போகிறார்.’ கிரேக்கச் சொற்றொடர், மனிதகுமாரனின் துன்பம் வரவிருக்கிறது என்பதை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: ஆனால் நான் உங்களுக்குச் சொல்கிறேன்
  rationale: δέ முந்தைய எதிர்பார்ப்புடன் உள்ள முரண்பாட்டைக் குறிக்கிறது; λέγω ... ὑμῖν என்பதை இயல்பான நவீனத் தமிழில் நேரடி உரை அறிமுகமாக மொழிபெயர்க்கிறது.
- source_word: Ἠλίας ἤδη ἦλθεν
  choice: எலியா ஏற்கெனவே வந்துவிட்டார்
  rationale: ἤδη உடன் வரும் இறந்தகால வினை, வந்து முடிந்த நிகழ்வின் தற்போதைய பொருத்தத்தைத் தெரிவிக்கிறது; ‘வந்துவிட்டார்’ இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὐκ ἐπέγνωσαν αὐτόν
  choice: அவரை அடையாளம் கண்டுகொள்ளாமல்
  rationale: இங்கு ἐπιγινώσκω என்பது ஒருவரின் பங்கு அல்லது அடையாளத்தைச் சரியாக உணரத் தவறுவதைக் குறிக்கிறது; வெறும் அறிமுகமின்மையை அல்ல.
- source_word: ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν
  choice: தாங்கள் விரும்பியதையெல்லாம் அவருக்குச் செய்தார்கள்
  rationale: ποιέω ἐν என்ற கிரேக்க மரபுத்தொடரைச் சொற்சொல்லாக அல்லாமல், அவர்மீது தங்கள் விருப்பப்படி கட்டுப்பாடின்றிச் செயல்பட்டனர் என்ற பொருள் தெளிவாகும் வகையில் தருகிறது.
- source_word: οὕτως καὶ
  choice: அவ்வாறே
  rationale: எலியாவுக்கு நிகழ்ந்ததற்கும் மனிதகுமாரனுக்கு நிகழவிருப்பதற்கும் இடையிலான ஒப்புமையைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: இந்தப் பட்டப்பெயரின் வேதாகமப் பயன்பாட்டையும் அதன் மறைபொருள் ஒலிப்பையும் காக்கும் நிலைபெற்ற தமிழ் வடிவம்.
- source_word: μέλλει πάσχειν
  choice: பாடுபடவிருக்கிறார்
  rationale: μέλλω + வினையெச்சம் விரைவில் நிகழவிருக்கும் துன்பத்தைச் சுட்டுகிறது; கிரேக்கத்தில் வெளிப்படையாக இல்லாத கட்டாயம் அல்லது விதிநியமத்தைச் சேர்க்கவில்லை.
- source_word: ὑπ’ αὐτῶν
  choice: அவர்களால்
  rationale: ὑπό + பிறப்புவேற்றுமை செயற்பாட்டாளர்களைக் குறிக்கிறது; துன்பத்தை ஏற்படுத்துபவர்கள் அவர்களே என்பதை நேரடியாகக் காட்டுகிறது.
theological_decisions:
- issue: எலியாவின் வருகை யாரைக் குறிக்கிறது
  choice: வசனத்தில் இருப்பதுபோல ‘எலியா’ என்றே வைத்து, யோவான் ஸ்நானகருடனான அடையாளப்படுத்தலைச் சூழலே விளக்க அனுமதித்தல்
  alternative: முதன்மை உரையிலேயே ‘யோவான் ஸ்நானகர்’ என்று விளக்கிச் சேர்த்தல்
  rationale: அடுத்தடுத்த சூழல் யாரைக் குறிக்கிறது என்பதை விளக்கினாலும், இந்த வசனம் தானாகவே எலியா என்ற பெயரையே பயன்படுத்துகிறது; ஆகவே விளக்கத்தை உரைக்குள் இறக்குமதி செய்யவில்லை.
- issue: μέλλει என்பதன் இறையியல் வலிமை
  choice: வரவிருக்கும் துன்பமாக ‘பாடுபடவிருக்கிறார்’ என்று மொழிபெயர்த்தல்
  alternative: ‘பாடுபட விதிக்கப்பட்டிருக்கிறார்’ அல்லது ‘பாடுபட வேண்டியிருக்கிறது’
  rationale: இந்தக் கூறு வரவிருக்கும் நிகழ்வைத் தெரிவிக்கிறது; ஆனால் தனியாகப் பார்க்கையில் தெய்வீகக் கட்டாயத்தை வெளிப்படையாகச் சொல்லவில்லை. எனவே வலுவான நிர்ணயக் கருத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அவர்களோ’ என்பது அடையாளம் கண்டுகொள்ளாதவர்கள்மீது கவனத்தைத் தெளிவாகத் திருப்புகிறது; ‘மனிதகுமாரன்’ என்ற நிலைபெற்ற வேதாகமப் பட்டப்பெயர் பாதுகாக்கப்பட்டுள்ளது.
