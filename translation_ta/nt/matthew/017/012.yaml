  to: 'ஆனால் நான் உங்களுக்குச் சொல்கிறேன்: எலியா ஏற்கெனவே வந்துவிட்டார். அவர்களோ அவரை அடையாளம் கண்டுகொள்ளாமல்[a], அவரைத் தாங்கள் விரும்பியபடியெல்லாம் நடத்தினார்கள்.[b] அவ்வாறே மனிதகுமாரனும் அவர்களால் பாடுபடவிருக்கிறார்.[c]'
