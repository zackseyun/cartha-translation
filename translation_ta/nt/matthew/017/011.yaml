  text: ὁ ⸀δὲ ἀποκριθεὶς ⸀εἶπεν· Ἠλίας μὲν ⸀ἔρχεται καὶ ἀποκαταστήσει πάντα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/011.yaml
  text: He answered[a], “Elijah indeed is coming and will restore all things.”
translation:
  language: ta
  text: 'அவர் பதிலளித்தார்: “எலியா நிச்சயமாக வருகிறார்[a]; அவர் எல்லாவற்றையும் மீட்டெடுப்பார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வருவார்.” கிரேக்கத்தில் “வருகிறார்” என்பதற்கான நிகழ்கால வினை இங்கு எதிர்கால நோக்கில் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: அவர் பதிலளித்தார்
  rationale: வினையெச்சமும் முற்றுவினையும் சேர்ந்த இந்த கிரேக்க மரபுத்தொடர் பதிலுரைக்கும் செயலை வலியுறுத்துகிறது. தமிழில் தேவையற்ற இரட்டிப்பைத் தவிர்த்து அதன் இயல்பான பொருளைத் தருகிறது.
- source_word: Ἠλίας
  choice: எலியா
  rationale: தமிழ் வேதாகம வழக்கில் நிலைபெற்றுள்ள பெயர் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: μέν
  choice: நிச்சயமாக
  rationale: அடுத்த வசனத்தில் வரும் மாறுபாட்டை முன்னறிவிக்கும் வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἔρχεται
  choice: வருகிறார்
  rationale: கிரேக்கத்தில் நிகழ்கால வடிவில் இருந்தாலும் சூழலில் எதிர்கால நோக்கம் உள்ளது. ‘வருகிறார்’ என்பது அந்த நிகழ்கால வடிவின் உயிரோட்டத்தையும் வரவிருக்கும் நிகழ்வின் பொருளையும் காக்கிறது.
- source_word: ἀποκαταστήσει
  choice: மீண்டும் சீரமைப்பார்
  rationale: எதிர்காலச் செயலைத் தெளிவாகக் காட்டி, பழைய அல்லது உரிய நிலைக்கு மீட்டமைக்கும் பொருளை இயல்பான தமிழில் தருகிறது; மீட்டமைப்பின் தன்மையை அளவுக்கு மீறி விளக்கவில்லை.
- source_word: πάντα
  choice: எல்லாவற்றையும்
  rationale: கிரேக்க நடுநிலைப் பன்மையின் விரிவான, முழுமையான பரப்பைத் தக்கவைக்கிறது; உரையில் குறிப்பிடப்படாத பொருட்களைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: எலியாவின் மீட்டமைக்கும் பணியின் இயல்பும் பரப்பும்
  choice: ‘எல்லாவற்றையும் மீண்டும் சீரமைப்பார்’ என்று விரிவாகவே மொழிபெயர்த்தல்
  alternative: ‘எல்லாவற்றையும் சரியான நிலைக்குக் கொண்டுவருவார்’ அல்லது குறிப்பிட்ட ஆன்மிக/இறுதிக்காலப் பொருளாகக் குறுக்குதல்
  rationale: இவ்வசனம் மீட்டமைப்பை முழுமையாகக் கூறினாலும் அதன் துல்லியமான பரப்பை வரையறுக்கவில்லை. ஆகவே குறிப்பிட்ட இறையியல் விளக்கத்தைப் புகுத்தாமல் மூலத்தின் விரிவையும் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘பதிலளித்தார்’ இயல்பான பதிலுரை வடிவமாகவும், ‘மீண்டும் சீரமைப்பார்’ ἀποκαταστήσει என்பதன் பரந்த பொருளைத் திறந்தவாறும் வைத்துள்ளது.
