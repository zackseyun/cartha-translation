reference: Matthew 17:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν τῷ Ἰησοῦ· Κύριε, καλόν ἐστιν ἡμᾶς ὧδε εἶναι· εἰ θέλεις, ⸀ποιήσω ὧδε τρεῖς σκηνάς, σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ ⸂Ἠλίᾳ μίαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/004.yaml
  text: 'Then Peter answered and said to Jesus[a], “Lord, it is good for us to be here. If you wish, I will make three shelters here: one for you, one for Moses, and one for Elijah.”'
translation:
  language: ta
  text: 'அப்போது பேதுரு இயேசுவிடம், “ஆண்டவரே, நாம் இங்கே இருப்பது நல்லது. உமக்கு விருப்பமானால், நான் இங்கே மூன்று கூடாரங்களை[a] அமைப்பேன்: உமக்கு ஒன்று, மோசேக்கு ஒன்று, எலியாவுக்கு ஒன்று” என்று மறுமொழியாகக் கூறினார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “குடில்கள்” அல்லது “தற்காலிகத் தங்குமிடங்கள்.” கிரேக்கச் சொல் கூடாரங்களையும் தற்காலிக உறைவிடங்களையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: அப்போது ... மறுமொழியாக ... என்றார்
  rationale: கிரேக்கத்தின் உரையாடல் அறிமுகச் சொற்றொடரான ‘மறுமொழியாகக் கூறினார்’ என்ற கருத்தையும், δέ குறிக்கும் கதை நகர்வையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: இயேசுவை நேரடியாக அழைக்கும் மரியாதையையும் κύριος என்பதன் சாத்தியமான இறையியல் நிறையையும் தக்கவைக்கும் வழக்கமான தமிழ் மொழிபெயர்ப்பு.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: நாம் இங்கே இருப்பது நல்லது
  rationale: கிரேக்க இறந்தநிலை வினைக் கட்டமைப்பின் பொருளைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: εἰ θέλεις
  choice: உமக்கு விருப்பமானால்
  rationale: θέλω குறிக்கும் விருப்பம் அல்லது சித்தத்தை மரியாதையான நேரடி உரையாடல் நடையில் தருகிறது.
- source_word: ποιήσω
  choice: அமைப்பேன்
  rationale: தற்காலிகமான கூடாரங்களைக் கட்டுதல் அல்லது நிறுவுதல் என்ற சூழலில் ‘அமைப்பேன்’ இயல்பானது; மூலவினையின் பரந்த பொருளையும் மீறுவதில்லை.
- source_word: σκηνάς
  choice: கூடாரங்களை
  rationale: σκηνή குறிக்கும் கூடாரம் அல்லது தற்காலிக உறைவிடத்தைப் பொதுவாகப் புரியக்கூடிய தமிழில் தருகிறது; பண்டிகைத் தொடர்பை உறுதிப்படுத்தாமலும் அதன் சாத்தியத்தை முற்றிலும் மறைக்காமலும் உள்ளது.
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  choice: உமக்கு ஒன்று, மோசேக்கு ஒன்று, எலியாவுக்கு ஒன்று
  rationale: μίαν என்ற சொல்லின் மும்முறைப் பகிர்ந்தளிக்கும் வலியுறுத்தலை ‘ஒன்று’ என்பதைத் திரும்பச் சொல்லுவதன் மூலம் தக்கவைக்கிறது.
- source_word: ὧδε
  choice: இங்கே
  rationale: மூலத்தில் இருமுறை வரும் இடச்சுட்டை தமிழிலும் இருமுறை தக்கவைக்கிறது.
theological_decisions:
- issue: இயேசுவை நோக்கி வரும் κύριος என்ற அழைப்பு
  choice: ஆண்டவரே
  alternative: போதகரே / தலைவரே
  rationale: ‘ஆண்டவர்’ என்பது மரியாதையான அழைப்பையும் சாத்தியமான இறையியல் அர்த்தத்தையும் ஒருங்கே தக்கவைக்கிறது; வெறும் மனித மரியாதைப் பட்டமாகக் குறுக்கிவிடவில்லை.
- issue: மறுரூப நிகழ்வில் σκηνάς என்பதன் பொருள்
  choice: கூடாரங்கள்
  alternative: குடில்கள் / தற்காலிகத் தங்குமிடங்கள்
  rationale: வசனம் இவற்றை நேரடியாகக் கூடாரப் பண்டிகையுடன் அடையாளப்படுத்தவில்லை. ‘கூடாரங்கள்’ என்பது நடுநிலையாகவும் பரந்த பொருளுடையதாகவும் இருந்து, சாத்தியமான வேதாகமப் பின்னொலியையும் அழித்துவிடாது; பிற பொருள் வாய்ப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, மரியாதைமிக்க நேரடி உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவை நோக்கிய ஒருமை மரியாதையை ‘உமக்கு’ என்றும் அழைப்பை ‘ஆண்டவரே’ என்றும் வழங்கியுள்ளது. தேவையற்ற சமயப்பிரிவு சார்ந்த விளக்கங்கள் சேர்க்கப்படவில்லை.
