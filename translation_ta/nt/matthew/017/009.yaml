  text: Καὶ καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους ἐνετείλατο αὐτοῖς ὁ Ἰησοῦς λέγων· Μηδενὶ εἴπητε τὸ ὅραμα ἕως οὗ ὁ υἱὸς τοῦ ἀνθρώπου ἐκ νεκρῶν ⸀ἐγερθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/009.yaml
  text: And as they were coming down from the mountain[a], Jesus commanded them, saying[b], “Tell the vision to no one until the Son of Man is raised from the dead.”
translation:
  language: ta
  text: 'அவர்கள் மலையிலிருந்து இறங்கி வந்துகொண்டிருந்தபோது, இயேசு அவர்களுக்குக் கட்டளையிட்டார்: “மனிதகுமாரன் இறந்தோரிலிருந்து[a] உயிர்த்தெழுப்பப்படும் வரை, அந்தத் தரிசனத்தை[b] யாரிடமும் சொல்லாதீர்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொல்லுக்குச் சொல், “இறந்தோரின் நடுவிலிருந்து.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நீங்கள் கண்டதை.” கிரேக்கத்தில் “தரிசனம்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους
  choice: அவர்கள் மலையிலிருந்து இறங்கி வந்துகொண்டிருந்தபோது
  rationale: மரபுத்தொடரின் ஒரே நேரத்தில் தொடர்ந்துகொண்டிருந்த செயலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; குறிப்பிட்ட மலையையும் தக்கவைக்கிறது.
- source_word: ἐνετείλατο αὐτοῖς
  choice: அவர்களுக்குக் கட்டளையிட்டு
  rationale: இது வெறும் அறிவுறுத்தல் அல்ல, அதிகாரத்தோடு கொடுக்கப்பட்ட கட்டளை என்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: Μηδενὶ εἴπητε
  choice: யாரிடமும் சொல்லாதீர்கள்
  rationale: எவருக்கும் தெரிவிக்கக் கூடாது என்ற கிரேக்கத் தடையை இயல்பாகவும் நேரடியாகவும் தருகிறது.
- source_word: τὸ ὅραμα
  choice: இந்தத் தரிசனம்
  rationale: ὅραμα என்பதன் காட்சி மற்றும் வெளிப்பாட்டு நுண்ணுணர்வை ‘தரிசனம்’ தக்கவைக்கிறது; தமிழ் தொடர்ச்சிக்காக முன்னர் நிகழ்ந்த காட்சியைக் குறிக்கும் ‘இந்த’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: இயேசுவின் தனிச்சிறப்பான சுயக்குறிப்பையும் அதன் வேதாகமத் தொடர்புகளையும் சுருக்கமாகத் தக்கவைக்கும் நிலைபெற்ற தமிழ் வடிவம்.
- source_word: ἐκ νεκρῶν
  choice: இறந்தோரிலிருந்து
  rationale: இறந்தோரின் நிலையிலிருந்து அல்லது அவர்கள் நடுவிலிருந்து எழுப்பப்படுதல் என்ற பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: ἐγερθῇ
  choice: உயிர்த்தெழுப்பப்படும்
  rationale: கிரேக்க இறந்தகாலச் செயப்பாட்டு வினையின் செயப்பாட்டு குரலைத் தக்கவைத்து, உயிர்த்தெழுதலைத் தெளிவாக்குகிறது; செயலைச் செய்பவர் யார் என்பதை உரை வெளிப்படையாகச் சேர்ப்பதில்லை.
theological_decisions:
- issue: உயிர்த்தெழுதல் வினையின் குரலும் செய்பவரும்
  choice: உயிர்த்தெழுப்பப்படும்
  alternative: உயிர்த்தெழும்
  rationale: ἐγερθῇ செயப்பாட்டு வடிவில் உள்ளது. ஆகவே ‘உயிர்த்தெழுப்பப்படும்’ என்பது அந்த இலக்கணக் குரலைப் பாதுகாத்து, செய்பவரை வசனம் கூறுவதைவிட வெளிப்படையாக அடையாளப்படுத்தாமல் விடுகிறது.
- issue: ὅραμα என்பதன் தன்மை
  choice: தரிசனம்
  alternative: நீங்கள் கண்டது
  rationale: ‘தரிசனம்’ என்பது நிகழ்வின் வெளிப்பாட்டு நுண்ணுணர்வைப் பாதுகாக்கிறது; ‘நீங்கள் கண்டது’ இயல்பானதாயினும் மூலச் சொல்லின் தனித்துவத்தை ஓரளவு பொதுமைப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘மனிதகுமாரன்’ போன்ற வேதாகம அடையாளச் சொல் தக்கவைக்கப்பட்டுள்ளதுடன், கிரேக்கச் செயப்பாட்டு வடிவின் இறையியல் திறந்தநிலையும் பாதுகாக்கப்பட்டுள்ளது.
