  - severity: low
    issue: The existing footnote marker interrupts “தரிசனத்தைப் பற்றி.”
    rationale: The marker follows the accusative form before the postposition, making the anchor visually and syntactically awkward. The revised wording removes the unnecessary postposition and places the marker after the complete noun phrase.
  - severity: low
    issue: “கட்டளையிட்டு ... என்றார்” is slightly cumbersome in this context.
