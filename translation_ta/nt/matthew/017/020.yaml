id: MAT.17.20
reference: Matthew 17:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀λέγει αὐτοῖς· Διὰ τὴν ⸀ὀλιγοπιστίαν ὑμῶν· ἀμὴν γὰρ λέγω ὑμῖν, ἐὰν ἔχητε πίστιν ὡς κόκκον σινάπεως, ἐρεῖτε τῷ ὄρει τούτῳ· ⸂Μετάβα ἔνθεν⸃ ἐκεῖ, καὶ μεταβήσεται, καὶ οὐδὲν ἀδυνατήσει ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/020.yaml
  text: But he says to them[a], “Because of your little faith. For truly I say to you, if you have faith like a mustard seed, you will say to this mountain, ‘Move from here to there,’ and it will move[c][b], and nothing will be impossible for you.”
translation:
  language: ta
  text: 'அவர் அவர்களிடம், “உங்கள் சிறிய விசுவாசத்தினால்தான்.[a] ஏனெனில், உண்மையாகவே உங்களுக்குச் சொல்கிறேன்: கடுகு விதையளவு விசுவாசம் உங்களுக்கு இருந்தால்,[b] இந்த மலையைப் பார்த்து, ‘இங்கிருந்து அங்கே போ’ என்று சொல்வீர்கள்; அது போகும். உங்களால் முடியாதது ஒன்றும் இருக்காது” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் விசுவாசக் குறைவினால்தான்.” கிரேக்கச் சொல் முற்றிலும் விசுவாசம் இல்லாததைக் காட்டிலும், குறைவான அல்லது போதாத விசுவாசத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “கடுகு விதையைப்போன்ற விசுவாசம்.” ஒப்பீடு மிகச் சிறிய ஒன்றைச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: என்றார்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டாலும், தொடர்ச்சியான தமிழ் கதைநடையில் இறந்தகாலமான ‘என்றார்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: Διὰ τὴν ὀλιγοπιστίαν ὑμῶν
  choice: உங்கள் சிறிய விசுவாசத்தினால்தான்
  rationale: ὀλιγοπιστία என்பது முற்றிலும் விசுவாசமின்மையைவிட குறைவான அல்லது போதாத விசுவாசத்தைக் குறிக்கிறது; ‘சிறிய விசுவாசம்’ அந்தச் சொல் வலியுறுத்தும் அளவுக் குறைவைப் பாதுகாக்கிறது.
- source_word: ἀμὴν
  choice: உண்மையாகவே
  rationale: இயேசுவின் உறுதியான அறிவிப்பை அறிமுகப்படுத்தும் வலியுறுத்தலை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: πίστιν
  choice: விசுவாசம்
  rationale: இச்சூழலில் தேவனுடைய வல்லமையை நம்பும் மனநிலையைக் குறிக்கிறது; தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் பரவலாகப் புரிந்துகொள்ளப்படும் சொல்லாகவும் உள்ளது.
- source_word: ὡς κόκκον σινάπεως
  choice: கடுகு விதையளவு
  rationale: ஒப்பீட்டின் நோக்கமான மிகச் சிறிய அளவை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது; கிரேக்கத்தின் நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: Μετάβα ἔνθεν ἐκεῖ
  choice: இங்கிருந்து அங்கே போ
  rationale: மலையை நோக்கிக் கூறப்படும் இடமாற்றக் கட்டளையை எளிய, நேரடியான தமிழில் வெளிப்படுத்துகிறது.
- source_word: μεταβήσεται
  choice: அது போகும்
  rationale: கிரேக்க வினை இங்கு செயப்பாட்டு வடிவமல்ல; மலை தானே இடம்பெயர்வதாகச் சொல்வதால் ‘அது போகும்’ பொருத்தமானது.
- source_word: οὐδὲν ἀδυνατήσει ὑμῖν
  choice: உங்களால் முடியாதது ஒன்றும் இருக்காது
  rationale: ‘உங்களுக்கு எதுவும் இயலாததாக இருக்காது’ என்ற கிரேக்கப் பொருளை இயல்பாகவும் வலிமையாகவும் தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: அற்புதச் சூழலில் πίστις என்பதன் பொருள்
  choice: விசுவாசம்
  alternative: நம்பிக்கை / நம்புதல்
  rationale: இங்கு சீடர்கள் தேவனுடைய வல்லமையைச் சார்ந்து செயல்படுவதிலுள்ள குறைவே சுட்டப்படுகிறது. இரட்சிக்கும் விசுவாசத்தைப் பற்றிய முழுமையான கோட்பாடாகவோ, மனிதரின் வரம்பற்ற தனிப்பட்ட ஆற்றலுக்கான வாக்குறுதியாகவோ வசனத்தை விரிவாக்காமல், மூலத்தின் பதற்றம் அப்படியே வைக்கப்படுகிறது.
- issue: ‘உங்களால் முடியாதது ஒன்றும் இருக்காது’ என்பதன் பரப்பு
  choice: மூலத்தின் விரிவான மொழியை அப்படியே வைத்தல்
  alternative: அற்புதங்களைச் செய்வதில் எதுவும் முடியாததாக இருக்காது
  rationale: சூழல் பிசாசைத் துரத்த முடியாத சீடர்களின் தோல்வியைப் பற்றியது என்றாலும், கிரேக்கம் வெளிப்படையாக வரம்புச் சொற்றொடர் ஒன்றைச் சேர்க்கவில்லை. ஆகவே விளக்கத்தை முதன்மை உரைக்குள் இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் எளிய ஆனால் மரியாதைமிக்க நடை. இயேசுவின் உரையில் நேரடியான பேச்சு வடிவம் பயன்படுத்தப்பட்டுள்ளது. தொடக்க δέ தமிழில் தனியாக மொழிபெயர்க்கப்படவில்லை; முந்தைய கேள்விக்கான நேரடி பதிலில் அது மெலிந்த உரையாடல் இணைப்பாக செயல்படுகிறது.
