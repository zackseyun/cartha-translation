  source_fidelity: மூலக் கிரேக்கத்தின் வரலாற்று நிகழ்காலமான λέγει-ஐ தமிழ் கதைநடைக்கேற்ப ‘என்றார்’ என மாற்றியிருப்பது ஏற்றுக்கொள்ளத்தக்கது. ὀλιγοπιστία ‘சிறிய விசுவாசம்’ எனத் துல்லியமாகத் தரப்பட்டுள்ளது; முழு அவிசுவாசம் என்ற பொருள் ஏற்றப்படவில்லை. கடுகு விதை ஒப்புமை, மலை இடம்பெயரச் சொல்லுதல், மற்றும் ‘எதுவும் முடியாததாக இருக்காது’ என்ற விரிவான கூற்று ஆகியவை மூலத்தின் பொருளையும் பரப்பையும் காக்கின்றன.
  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாகவும் மரியாதைமிக்கதாகவும் உள்ளது. ‘இந்த மலையைப் பார்த்து’ என்பது மூலத்தில் வெளிப்படையாக இல்லாவிட்டாலும், மலையிடம் கூறப்படும் கட்டளையைத் தமிழில் இயல்பாக்கும் சிறிய உரையாடல்-வழக்குச் சேர்க்கை; பொருளை மாற்றவில்லை. ‘அது போகும்’ என்பதும் மலையே தானாக இடம்பெயரும் எதிர்கால வினையின் பொருளைத் தருகிறது.
