  text: ἐπάραντες δὲ τοὺς ὀφθαλμοὺς αὐτῶν οὐδένα εἶδον εἰ μὴ ⸀αὐτὸν Ἰησοῦν μόνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/008.yaml
  text: And lifting up their eyes[a], they saw no one except Jesus alone.
translation:
  language: ta
  text: அவர்கள் தங்கள் கண்களை உயர்த்தியபோது, இயேசு ஒருவரைத் தவிர வேறு யாரையும் காணவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் இயேசுவின் பெயருடன் வலியுறுத்தும் சுட்டுப்பெயரும் ‘மட்டும்’ என்ற சொல்லும் சேர்ந்து வருகின்றன; இயேசு ஒருவரே காணப்பட்டார் என்பதை இது வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπάραντες
  choice: உயர்த்திப் பார்த்தபோது
  rationale: இறந்தகால வினையெச்சம் பிரதான வினைக்கு முந்திய செயலைக் குறிக்கிறது. ‘உயர்த்திப் பார்த்தபோது’ என்பது தமிழில் இயல்பாக அந்த நிகழ்வுத் தொடரை வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ மென்மையான கதைத் தொடர்ச்சியைக் குறிக்கிறது; தமிழில் வாக்கியத் தொடரே அதை இயல்பாக வெளிப்படுத்துவதால் ‘ஆனால்’ போன்ற வலுவான எதிர்மறை இணைப்பு தவிர்க்கப்பட்டது.
- source_word: τοὺς ὀφθαλμοὺς αὐτῶν
  choice: தங்கள் கண்களை
  rationale: கிரேக்கத்தின் உடல் உறுப்பைக் குறிக்கும் நேரடியான சொல்லாட்சியைத் தக்கவைத்து, எழுவாயோடு தொடர்புடைய உடைமையை ‘தங்கள்’ தெளிவுபடுத்துகிறது.
- source_word: οὐδένα
  choice: வேறு யாரையும் … காணவில்லை
  rationale: எதிர்மறை வாக்கியத்தில் ‘யாரையும் காணவில்லை’ என்பது இயல்பான தமிழ்; ‘வேறு’ என்பது விதிவிலக்காக இயேசு மட்டும் காணப்பட்டதைத் தெளிவாக்குகிறது.
- source_word: εἶδον
  choice: காணவில்லை
  rationale: ὁράω என்பதன் எளிய காட்சிப் பொருளை தற்போதைய கண்ணியமான தமிழ் நடையில் தருகிறது.
- source_word: εἰ μὴ
  choice: தவிர
  rationale: மறுப்புக்குப் பின் வரும் εἰ μή இங்கு விதிவிலக்கைக் குறிக்கிறது; ‘தவிர’ அதற்கான இயல்பான தமிழ் இணை.
- source_word: αὐτὸν Ἰησοῦν μόνον
  choice: இயேசு ஒருவரை
  rationale: ‘இயேசு ஒருவர்’ என்ற அமைப்பு இயேசு மட்டுமே எஞ்சிக் காணப்பட்டார் என்ற வலியுறுத்தலை இயல்பான தமிழில் தருகிறது; கிரேக்கத்தின் குவிந்த வலியுறுத்தல் அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்படுகிறது.
theological_decisions:
- issue: தரிசனத்திற்குப் பின் இயேசு மட்டுமே காணப்பட்டார் என்ற வலியுறுத்தல்
  choice: இயேசு ஒருவரைத் தவிர வேறு யாரையும் காணவில்லை
  alternative: இயேசுவைத் தவிர வேறு யாரையும் காணவில்லை
  rationale: ‘ஒருவரை’ என்பது இயேசுவின் தனித்திருப்பை வலியுறுத்துகிறது; அதேவேளை மோசேயும் எலியாவும் இனி காணப்படவில்லை என்ற காட்சியைத் தாண்டி கூடுதல் கோட்பாட்டு முடிவை உரையில் புகுத்தவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ். ‘கண்களை உயர்த்திப் பார்த்தபோது’ என்பது மூலத்தின் உடல் சார்ந்த சொல்லாட்சியையும் நிகழ்வுகளின் வரிசையையும் இயல்பாகக் காக்கிறது; ‘இயேசு ஒருவரைத் தவிர’ என்பது மிகைச் செயற்கை இல்லாமல் தனித்த வலியுறுத்தலைத் தருகிறது.
