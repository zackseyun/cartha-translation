id: MAT.17.2
reference: Matthew 17:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ μετεμορφώθη ἔμπροσθεν αὐτῶν, καὶ ἔλαμψεν τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος, τὰ δὲ ἱμάτια αὐτοῦ ⸀ἐγένετο λευκὰ ὡς τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/002.yaml
  text: And he was transfigured before them[a], and his face shone like the sun, and his clothes became white as the light.
translation:
  language: ta
  text: அவர்கள் முன்பாக அவர் உருமாறினார்[a]. அவருடைய முகம் சூரியனைப் போல ஒளிவீசியது; அவருடைய உடைகளோ ஒளியைப் போல வெண்மையாயின.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மாற்றமடைந்தார்.”
    reason: μετεμορφώθη என்பதற்கான பரந்த பொருளுள்ள மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: μετεμορφώθη
  choice: உருமாறினார்
  rationale: μεταμορφόω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவம். மகிமையுடன் வெளிப்படையாக நிகழ்ந்த தோற்றமாற்றத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; செயப்பாட்டு வடிவத்தைச் சொற்சொல்லாகப் பின்பற்றுவதால் உண்டாகும் செயற்கைத்தன்மையைத் தவிர்க்கிறது.
- source_word: ἔμπροσθεν αὐτῶν
  choice: அவர்கள் முன்பாக
  rationale: இந்த நிகழ்வு சீடர்களின் கண்முன்னே நடந்தது என்ற இடம் மற்றும் முன்னிலை சார்ந்த பொருளை நேரடியாகக் கொடுக்கிறது.
- source_word: ἔλαμψεν
  choice: ஒளிவீசியது
  rationale: λάμπω குறிக்கும் ஒளிர்தல் அல்லது ஒளி கொடுத்தலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τὸ πρόσωπον αὐτοῦ
  choice: அவருடைய முகம்
  rationale: இங்கு πρόσωπον என்பது இயேசுவின் உடல் முகத்தைக் குறிக்கிறது; உயர்நடைச் சொல் தேவையில்லை.
- source_word: ὡς ὁ ἥλιος
  choice: சூரியனைப் போல
  rationale: ὡς அறிமுகப்படுத்தும் உவமையை இயல்பான தமிழில் அப்படியே பாதுகாக்கிறது.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: அவருடைய உடைகள்
  rationale: ἱμάτια பொதுவாக அணியும் உடைகளைக் குறிக்கிறது; இத்தேர்வு சாதாரண வாசகருக்குத் தெளிவானது.
- source_word: ἐγένετο λευκὰ
  choice: வெண்மையாயின
  rationale: உடைகள் வெண்மையான நிலையை அடைந்த மாற்றத்தைச் சுருக்கமாகவும் நேரடியாகவும் தருகிறது; மூலத்தில் இல்லாத தீவிரத்தைச் சேர்க்கவில்லை.
- source_word: ὡς τὸ φῶς
  choice: ஒளியைப் போல
  rationale: φῶς உடனான உவமையை ‘பிரகாசமான’ என்ற பெயரடையாகத் தட்டையாக்காமல் பாதுகாக்கிறது.
theological_decisions:
- issue: உருமாற்ற நிகழ்வை மொழிபெயர்த்தல்
  choice: உருமாறினார்
  alternative: மாற்றமடைந்தார்
  rationale: சூழலில் காணக்கூடிய மகிமையான தோற்றமாற்றத்தை ‘உருமாறினார்’ துல்லியமாகக் காட்டுகிறது. மாற்றத்தின் இயல்பையோ காரணத்தையோ பற்றி மூலவசனத்தை மீறிய கோட்பாட்டுக் கூற்றைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் dignified நடையில் அமைக்கப்பட்டுள்ளது. ‘உருமாறினார்’ என்பது திருச்சபைச் சிறப்புச்சொல்லான கடினமான வடிவங்களைத் தவிர்த்து நிகழ்வின் கண்கூடான மாற்றத்தைத் தக்கவைக்கிறது; ‘உடைகளோ’ இரண்டாவது காட்சிவிவரத்தை இயல்பாக இணைக்கிறது.
