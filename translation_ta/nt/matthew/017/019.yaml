id: MAT.17.19
reference: Matthew 17:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τότε προσελθόντες οἱ μαθηταὶ τῷ Ἰησοῦ κατ’ ἰδίαν εἶπον· Διὰ τί ἡμεῖς οὐκ ἠδυνήθημεν ἐκβαλεῖν αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/019.yaml
  text: Then the disciples came to Jesus privately and said[a], “Why were we not able to cast it out?”
translation:
  language: ta
  text: அப்போது சீடர்கள் இயேசுவிடம் தனிப்பட வந்து, “எங்களால் அதை[a] ஏன் வெளியேற்ற முடியவில்லை?” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இந்தச் சுட்டுப்பெயர் பேயை அல்லாமல் சிறுவனைக் குறிப்பதாகக் கொண்டால், “அவனை.”
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: அப்போது
  rationale: அடுத்த நிகழ்வை அறிமுகப்படுத்தும் காலத் தொடர்புச் சொல்; நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: προσελθόντες οἱ μαθηταὶ τῷ Ἰησοῦ
  choice: சீடர்கள் இயேசுவிடம் ... வந்து
  rationale: பங்கேற்புவினையைத் தமிழில் முதன்மை வினையுடன் இயல்பாக இணைக்கிறது; τῷ Ἰησοῦ என்பதன் அணுகுதலுக்குரிய இலக்கை ‘இயேசுவிடம்’ எனத் தருகிறது.
- source_word: κατ’ ἰδίαν
  choice: தனியாக
  rationale: மற்றவர்களிடமிருந்து விலகித் தனிப்பட்ட முறையில் பேசிய சூழலைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: εἶπον
  choice: என்று கேட்டார்கள்
  rationale: கிரேக்க வினை பொதுவாக ‘சொன்னார்கள்’ என்றாலும், தொடர்ந்து வரும் நேரடிக் கேள்வியை நவீன தமிழில் இயல்பாக அறிமுகப்படுத்த ‘கேட்டார்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: Διὰ τί ἡμεῖς οὐκ ἠδυνήθημεν
  choice: எங்களால் ... ஏன் ... முடியவில்லை?
  rationale: வெளிப்படையாக உள்ள ἡμεῖς என்பதையும் இயலாமையைக் குறிக்கும் ἠδυνήθημεν என்பதையும் தமிழின் இயல்பான காரணவினா அமைப்பில் பாதுகாக்கிறது.
- source_word: ἐκβαλεῖν
  choice: துரத்திவிட
  rationale: பேயை வெளியேற்றும் நற்செய்தி நூல் சூழலில், வலுக்கட்டாயமாக அகற்றுதல் என்ற வினையின் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: αὐτό
  choice: அதை
  rationale: அருகிலுள்ள நிகழ்வில் வெளியேற்றப்பட வேண்டிய பேயைக் குறிக்கும் சாத்தியமே அதிகம்; கிரேக்க நடுநிலை ஒருமைப் பெயர்ப்பதிலிக்கும் ஏற்ற தமிழ் வடிவம்.
theological_decisions:
- issue: αὐτό என்ற பெயர்ப்பதிலியின் குறிப்பு
  choice: பேயைக் குறிப்பதாகக் கொண்டு ‘அதை’ என மொழிபெயர்த்தல்
  alternative: துன்புற்ற சிறுவனைக் குறிப்பதாகக் கொண்டு ‘அவனை’ என மொழிபெயர்த்தல்
  rationale: உடனடி சூழலில் சீடர்களின் தோல்வி பேயைத் துரத்துவது பற்றியது; ஆனாலும் பெயர்ப்பதிலி சிறுவனைக் குறிக்கும் இலக்கணச் சாத்தியத்தையும் முற்றிலும் நீக்க முடியாததால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. நேரடிக் கேள்வியின் இயல்பான தமிழ் சொல் வரிசை பயன்படுத்தப்பட்டுள்ளது.
