base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/021.yaml
  text: But[a] this kind does not come out except by prayer and fasting.
translation:
  language: ta
  text: ஆனால்[a] இந்த வகை, ஜெபத்தினாலும் உபவாசத்தினாலும் மட்டுமே வெளியேறும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த வசனம் மிகப் பழமையான கிரேக்கக் கையெழுத்துப் பிரதிகளில் (நான்காம் நூற்றாண்டைச் சேர்ந்த சினாய்ட்டிக்கஸ், வாட்டிக்கானஸ் உட்பட) மற்றும் தொடக்ககால சிரிய, காப்டிக் மொழிபெயர்ப்புகளில் இல்லை. ஆனால் பைசாந்தியப் பெரும்பான்மை உரைமரபிலும், லத்தீன் மரபிலும், பெரும்பாலான சிரியச் சாட்சிகளிலும் உள்ளது. மாற்கு 9:29-உடன் ஒத்துப்போகும்படி பிற்கால எழுத்தர்கள் இதைச் சேர்த்திருக்கலாம்.
    reason: textual_critical
lexical_decisions:
- source_word: γένος
  choice: வகை
  rationale: இச்சூழலில் ஒரு வகை அல்லது பிரிவைச் சேர்ந்த பேயைக் குறிக்கிறது; ‘வகை’ என்பது இயல்பான, தெளிவான தமிழ்ச் சொல்.
- source_word: ἐκπορεύεται
  choice: வெளியேறும்
  rationale: பாதிக்கப்பட்ட நபரிடமிருந்து பேய் வெளியேறுவதைக் குறிக்கும் கிரேக்க வினையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: εἰ μὴ
  choice: மட்டுமே
  rationale: ஜெபமும் உபவாசமும் தவிர வேறு வழியில் இது வெளியேறாது என்ற விலக்குப் பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: προσευχῇ
  choice: ஜெபத்தினாலும்
  rationale: கிறிஸ்தவத் தமிழில் பரவலாகப் புரிந்துகொள்ளப்படும் சொல்லாகவும், கருவி அல்லது வழிமுறையைக் காட்டும் ἐν என்பதன் சூழல்சார் பொருளையும் கொண்டதாகவும் உள்ளது.
- source_word: νηστείᾳ
  choice: உபவாசத்தினாலும்
  rationale: உணவைத் தவிர்த்து மேற்கொள்ளும் சமய நோன்பைக் குறிக்கும் வழக்கமான கிறிஸ்தவத் தமிழ்ச் சொல்; ஜெபத்துடன் இணைந்த வழிமுறையாக வருகிறது.
theological_decisions:
- issue: ‘இந்த வகை’ எதைக் குறிக்கிறது?
  choice: மூலத்தில் இருப்பதுபோல ‘இந்த வகை’ என்றே வைத்து, அதன் குறிப்பு பேய்களின் ஒரு வகையா அல்லது இத்தகைய பேயா என்பதை உரையில் விரிவுபடுத்தவில்லை.
  alternative: ‘இந்த வகையான பேய்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: γένος என்ற சொல் சூழலில் பேயைக் குறித்தாலும், கிரேக்க உரையின் சுருக்கத்தையும் குறிப்பளவிலான மறைமுகத்தன்மையையும் பாதுகாக்கிறது.
- issue: ஜெபமும் உபவாசமும் பேயை வெளியேற்றும் கட்டாயமான முறைகளாகக் கூறப்படுகிறதா?
  choice: ‘ஜெபத்தினாலும் உபவாசத்தினாலும் மட்டுமே’ என்று மூலத்தின் விலக்குக் கட்டமைப்பை நேரடியாகப் பாதுகாத்தல்.
  alternative: ‘ஜெபித்து உபவாசமிருந்தால்தான்’ என்று செயற்பாட்டை சீடர்களுக்கு வெளிப்படையாகப் பொருத்துதல்.
  rationale: மூல உரை செய்பவரை வெளிப்படையாகக் குறிப்பிடாததால், அதற்கு மேலான இறையியல் விளக்கத்தை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘ஜெபம்’, ‘உபவாசம்’ ஆகியவை தமிழ்க் கிறிஸ்தவச் சூழலில் பரவலாக அறியப்பட்ட சொற்கள். அடிக்குறிப்புக் குறியீடு வசனத்தின் தொடக்க இணைப்புச்சொல்லுக்குப் பின் வைக்கப்பட்டுள்ளது.
