revisions:
- from: அப்போது, தாமே மெசியா[a] என்று யாரிடமும் சொல்லக் கூடாது எனச் சீடர்களிடம் அவர் கண்டிப்பாகக் கட்டளையிட்டார்.
  to: அப்போது, அவரே மெசியா[a] என்பதை யாரிடமும் சொல்ல வேண்டாம் என்று அவர் சீடர்களுக்குக் கண்டிப்பாகக் கட்டளையிட்டார்.
  rationale: The revision retains the draft’s faithful rendering while replacing the potentially less clear reflexive expression with an explicit, natural Tamil pronoun construction that reflects αὐτός. It also uses the more natural recipient expression “சீடர்களுக்கு.”
