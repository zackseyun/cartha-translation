id: MAT.16.20
reference: Matthew 16:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τότε ⸀διεστείλατο τοῖς ⸀μαθηταῖς ἵνα μηδενὶ εἴπωσιν ὅτι αὐτός ⸀ἐστιν ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/020.yaml
  text: Then he strictly instructed the disciples to tell no one that he is the Messiah[a].
translation:
  language: ta
  text: அப்போது, அவரே மெசியா[a] என்பதை யாரிடமும் சொல்ல வேண்டாம் என்று அவர் சீடர்களுக்குக் கண்டிப்பாகக் கட்டளையிட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்து.” கிரேக்கச் சொல்லான Χριστός இங்கு ஒரு பட்டமாகப் பயன்படுத்தப்பட்டுள்ளதால், “மெசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: கதை நிகழ்வுகளின் தொடர்ச்சியைக் குறிக்கும் இயல்பான, சுருக்கமான தமிழ்ச் சொல்.
- source_word: διεστείλατο
  choice: கண்டிப்பாகக் கட்டளையிட்டார்
  rationale: வலுவான அறிவுறுத்தல் அல்லது தடையுத்தரவைக் குறிக்கும் நடுவினை வடிவத்தின் ஆற்றலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τοῖς μαθηταῖς
  choice: சீடர்களிடம்
  rationale: இயேசுவைப் பின்பற்றிய ஏற்கெனவே அறியப்பட்ட குழுவைக் குறிக்கும்; மூலத்தில் இல்லாத ‘தமது’ என்பதைச் சேர்க்கவில்லை.
- source_word: ἵνα μηδενὶ εἴπωσιν
  choice: யாரிடமும் சொல்லக் கூடாது என
  rationale: கட்டளையின் உள்ளடக்கமாகிய முழுமையான தடையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ὅτι αὐτός ἐστιν
  choice: தாமே ... என்று
  rationale: வெளிப்படையாக உள்ள αὐτός என்பதன் சாத்தியமான வலியுறுத்தலை ‘தாமே’ காக்கிறது; மரியாதை ஒருமையும் பேணப்படுகிறது.
- source_word: ὁ χριστός
  choice: மெசியா
  rationale: Χριστός இங்கு பெயராக அல்ல, அபிஷேகம் செய்யப்பட்ட எதிர்பார்க்கப்பட்ட அரசர்/விடுவிப்பவர் என்ற பட்டமாக வருகிறது; ‘மெசியா’ தமிழ் வாசகர்களுக்கு இயல்பாக அறியப்பட்ட பட்ட வடிவம்.
theological_decisions:
- issue: Χριστός என்ற பட்டத்தின் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இச்சூழலில் Χριστός தனிப்பெயர் போல அல்லாமல் குறிப்பிட்ட பட்டமாகச் செயல்படுகிறது. ‘மெசியா’ அதன் யூத எதிர்பார்ப்பு சார்ந்த பட்டப் பொருளைத் தெளிவாகக் காக்கிறது; வழக்கமான ‘கிறிஸ்து’ மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘கண்டிப்பாகக் கட்டளையிட்டார்’ என்பது மூலத்தின் வலுவான தடையுத்தரவை வெளிப்படுத்துகிறது.
