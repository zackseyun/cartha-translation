id: MAT.16.28
reference: Matthew 16:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι εἰσίν τινες ⸂τῶν ὧδε ἑστώτων⸃ οἵτινες οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν τῇ βασιλείᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/028.yaml
  text: Truly I tell you[c][b][a], there are some standing here who will certainly not taste death until they see the Son of Man coming in his kingdom.
translation:
  language: ta
  text: '“உண்மையாகவே உங்களுக்குச் சொல்கிறேன்: இங்கே நிற்கிறவர்களில் சிலர், மனிதகுமாரன் தமது அரசாட்சியில் வருவதைக் காணும்வரை நிச்சயமாக மரணத்தைச் சுவைக்க மாட்டார்கள்.[a][b][c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஒருபோதும் மரணத்தைச் சுவைக்க மாட்டார்கள்” என்றும் மொழிபெயர்க்கலாம்; கிரேக்கத்தில் மறுப்பு வலியுறுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “மனிதகுமாரன் தமது அரசாட்சியில் வருவது” மறுரூபமாதல், உயிர்த்தெழுதல் மற்றும் மகிமைப்படுத்தப்படுதல், எருசலேமின்மீதான தீர்ப்பு, அல்லது இறுதி வருகை ஆகியவற்றில் எதைக் குறிக்கிறது என்பது குறித்து பல விளக்கங்கள் உள்ளன; இவ்வசனம் தானே எந்த நிகழ்வென்று குறிப்பிடவில்லை.
    reason: alternative_reading
  - marker: c
    text: “தமது ராஜ்யத்தில்” அல்லது “தமது அரசாளுகையில்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: உண்மையாகவே உங்களுக்குச் சொல்கிறேன்
  rationale: அதிகாரப்பூர்வமான உறுதியுரையை இயல்பான, கண்ணியமான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἰσίν τινες τῶν ὧδε ἑστώτων
  choice: இங்கே நிற்கிறவர்களில் சிலர்
  rationale: சூழ்ந்திருப்போரில் ஒரு பகுதியினரைச் சுட்டும் கிரேக்கப் பகுதிப்பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: οὐ μὴ γεύσωνται θανάτου
  choice: நிச்சயமாக மரணத்தைச் சுவைக்க மாட்டார்கள்
  rationale: οὐ μή என்பதன் வலியுறுத்தப்பட்ட மறுப்பையும், ‘மரணத்தைச் சுவைத்தல்’ என்ற மூல உருவகத்தையும் காக்கிறது.
- source_word: ἕως ἂν ἴδωσιν
  choice: காணும்வரை
  rationale: எதிர்கால நிகழ்வை நோக்கிய கால எல்லையைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: இயேசுவின் நிலைபெற்ற சுயக் குறிப்பு/பட்டத்தை விளக்கவுரை இன்றி காக்கிறது.
- source_word: ἐρχόμενον
  choice: வருவதை
  rationale: மூலத்தில் உள்ள எளிய வருகைப் பொருளை மட்டும் தருகிறது; இணை வசனங்களிலிருந்து ‘வல்லமையுடன்’ போன்ற கூறுகளைச் சேர்க்கவில்லை.
- source_word: ἐν τῇ βασιλείᾳ αὐτοῦ
  choice: தமது அரசாட்சியில்
  rationale: βασιλεία என்பதன் ஆட்சி/அரசுரிமை நுண்ணுணர்வை இயல்பான தமிழில் தருகிறது; அது அரசாட்சி அல்லது அரசாளுகை எனப் புரியக்கூடிய அகலத்தையும் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘மனிதகுமாரன் தமது அரசாட்சியில் வருவது’ எந்த நிகழ்வைக் குறிக்கிறது?
  choice: எந்த நிகழ்வென்று மொழிபெயர்ப்பில் தீர்மானிக்காமல் நேரடியாக வழங்குதல்
  alternative: மறுரூபமாதல், உயிர்த்தெழுதல்/மகிமைப்படுத்தப்படுதல், பெந்தெகொஸ்தே, எருசலேமின்மீதான தீர்ப்பு, அல்லது இறுதி வருகை என்று குறிப்பாக்குதல்
  rationale: கிரேக்க உரை நிகழ்வைத் துல்லியமாக அடையாளப்படுத்தவில்லை; ஆகவே உண்மையான விளக்கத் தெளிவின்மையையும் இறையியல் இழுவிசையையும் காக்க வேண்டும்.
- issue: βασιλεία என்பதன் பொருள்
  choice: அரசாட்சி
  alternative: ராஜ்யம்; அரசாளுகை; அரச அதிகாரம்
  rationale: சொல் ஆளுகையையோ ஆட்சித்துறையையோ குறிக்கலாம். ‘அரசாட்சி’ தமிழில் இயல்பாக இருந்து, ஒரே விளக்கத்துக்குள் பொருளைச் சுருக்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘மரணத்தைச் சுவைத்தல்’ என்ற வேதாகம உருவகம் காக்கப்பட்டது. மரியாதை ஒருமையைக் காட்ட ‘தமது’ பயன்படுத்தப்பட்டது; குறிப்பிட்ட இறையியல் நிறைவேற்றத்தை உரையில் திணிக்கவில்லை.
