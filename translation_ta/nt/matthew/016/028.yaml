  source_fidelity: 'மூலக் கிரேக்கத்தின் முக்கிய கூறுகள் அனைத்தும் துல்லியமாகக் காக்கப்பட்டுள்ளன: ἀμὴν λέγω ὑμῖν என்பதன் உறுதிப்பாடு, இங்கே நிற்பவர்களில் சிலர் என்ற பகுதிப்பொருள், οὐ μὴ என்பதன் வலுவான மறுப்பு, ‘மரணத்தைச் சுவைத்தல்’ உருவகம், எதிர்காலக் காலவரம்பு, மற்றும் ‘மனிதகுமாரன் ... வருவது’ ஆகியவை நன்றாக வெளிப்பட்டுள்ளன. ‘தமது அரசாட்சியில்’ என்பது βασιλείᾳ-யின் ‘kingdom/reign’ அகலத்தை முழுமையாக ஒற்றைச் சொல்லில் தீர்மானிக்காமல், இணைக்குறிப்புடன் போதுமான வகையில் தருகிறது.'
