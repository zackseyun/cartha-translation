source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· ⸂Ὀψίας γενομένης λέγετε· Εὐδία, πυρράζει γὰρ ὁ οὐρανός·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/002.yaml
  text: But he answered and said to them[a], “When evening comes, you say, ‘Fair weather, for the sky is red.’
translation:
  language: ta
  text: 'அதற்கு அவர் பதிலளித்து அவர்களிடம் கூறினார்: “மாலை நேரம் வரும்போது, ‘வானம்[a] சிவப்பாக இருக்கிறது; வானிலை நன்றாக இருக்கும்’ என்று சொல்கிறீர்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு “வானம்” என்று மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொல் “விண்ணுலகம்” என்றும் பொருள்படலாம்; ஆனால் வானிலையைப் பற்றிய இக்கூற்றில் அது கண்ணுக்குத் தெரியும் வானத்தையே குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: பதிலளித்தார்
  rationale: ‘பதிலளித்து சொன்னார்’ என்ற கிரேக்கக் கூட்டு மொழிநடையை, அதன் உரையாடல் செயல்பாட்டைக் காத்து இயல்பான நவீனத் தமிழில் ஒரே வினையாக வழங்குகிறது.
- source_word: Ὀψίας γενομένης
  choice: மாலை நேரம் வரும்போது
  rationale: காலத்தைக் குறிக்கும் genitive absolute அமைப்பை இயல்பான தமிழ்க் காலத் தொடராகத் தருகிறது.
- source_word: λέγετε
  choice: சொல்கிறீர்கள்
  rationale: வழக்கமாக அல்லது மீண்டும் மீண்டும் சொல்லப்படுவதை உணர்த்தும் நிகழ்காலத்தைப் பாதுகாக்கிறது.
- source_word: Εὐδία
  choice: வானிலை நன்றாக இருக்கும்
  rationale: சாதகமான, தெளிவான வானிலையைக் குறிக்கும் சொல்லை சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான தமிழில் தருகிறது.
- source_word: πυρράζει
  choice: சிவப்பாக இருப்பதால்
  rationale: வானத்தின் சிவந்த தோற்றத்தையும் γάρ தரும் காரணத் தொடர்பையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: οὐρανός
  choice: வானம்
  rationale: இங்கு வானிலைக் குறிப்பே சூழலாக இருப்பதால் கண்ணுக்குத் தெரியும் வானத்தைக் குறிக்கும் இயல்பான தமிழ்ச் சொல் தேர்ந்தெடுக்கப்பட்டது; இச்சொல் மூலத்தின் பரந்த பொருள் வாய்ப்பையும் ஓரளவு தக்கவைக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. கிரேக்கத்தின் ‘பதிலளித்து சொன்னார்’ என்ற இரட்டைச் சொற்றொடர் தமிழில் இயல்பான ‘பதிலளித்தார்’ எனச் சீராக்கப்பட்டது; பழமொழி போன்ற வானிலைக் கூற்றின் நிகழ்காலத் தன்மை காக்கப்பட்டது.
