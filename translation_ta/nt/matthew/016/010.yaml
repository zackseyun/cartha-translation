  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐδὲ τοὺς ἑπτὰ ἄρτους τῶν τετρακισχιλίων καὶ πόσας σπυρίδας ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/010.yaml
  text: Or the seven loaves for the four thousand[a], and how many large baskets you picked up?
translation:
  language: ta
  text: நாலாயிரம் பேருக்கான ஏழு அப்பங்களையும், நீங்கள் எத்தனை பெரிய கூடைகளை எடுத்தீர்கள் என்பதையும் நினைவுகூரவில்லையா?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ
  choice: என்பதையும் ... நினைவுகூரவில்லையா?
  rationale: முந்தைய வசனத்தின் வினாத்தொடரின் விடுபட்ட வினைச்சொல்லைத் தமிழில் இயல்பாக நிறைவுசெய்கிறது; οὐδὲ-யின் தொடர்ச்சியான எதிர்மறை வினா வலிமையையும் காக்கிறது.
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: ஏழு அப்பங்களை
  rationale: உணவளிப்பு நிகழ்வில் ἄρτους என்பது தனித்தனி அப்பங்களைக் குறிக்கிறது; நவீன வேதாகமத் தமிழில் ‘அப்பங்கள்’ தெளிவான, இயல்பான சொல்.
- source_word: τῶν τετρακισχιλίων
  choice: நாலாயிரம் பேருக்காக இருந்த
  rationale: மரபுத்தொடர்பைக் குறிக்கும் கிரேக்க வேற்றுமையை, நாலாயிரம் பேருக்கு உணவளித்த நிகழ்வுடனான தொடர்பாகத் தமிழில் தெளிவாக்குகிறது.
- source_word: πόσας
  choice: எத்தனை
  rationale: σπυρίδας என்பதைக் குறிக்கும் நேரடியான எண்ணிக்கை வினாப்பெயரடை.
- source_word: σπυρίδας
  choice: பெரிய கூடைகளை
  rationale: σπυρίς என்பது மற்ற உணவளிப்பு நிகழ்வில் வரும் κόφινος என்பதிலிருந்து வேறுபடும் பெரிய வகைக் கூடை; ‘பெரிய’ என்பது அந்த சொற்பொருள் வேறுபாட்டைக் காக்கிறது.
- source_word: ἐλάβετε
  choice: எடுத்தீர்கள்
  rationale: மீதியான துண்டுகள் நிறைந்த கூடைகளை எடுத்துக்கொண்ட செயலை எளிய, இயல்பான தமிழில் தெரிவிக்கிறது; சூழலில் சேகரித்தல் என்ற பொருள் தெளிவாக உள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் பேச்சின் நேரடியான வினாத்தொனியும் காக்கப்பட்டுள்ளன. தனி வசனமாக வாசிக்கத் தெளிவாக இருக்க, முந்தைய வசனத்திலிருந்து புரிந்துகொள்ளப்படும் ‘நினைவுகூரவில்லையா?’ சேர்க்கப்பட்டுள்ளது.
