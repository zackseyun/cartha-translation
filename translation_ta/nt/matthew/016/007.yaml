source:
  edition: SBLGNT
  text: οἱ δὲ διελογίζοντο ἐν ἑαυτοῖς λέγοντες ὅτι Ἄρτους οὐκ ἐλάβομεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/007.yaml
  text: And they were discussing among themselves[a], saying, “We did not bring bread.”
translation:
  language: ta
  text: அவர்களோ, “நாம் அப்பம் கொண்டுவரவில்லை[a]” என்று தங்களுக்குள் பேசிக்கொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாம் அப்பத்தை உடன் எடுத்துச் செல்லவில்லை.”
    reason: λαμβάνω என்ற வினைச்சொல் அடிப்படையில் ‘எடுத்துக்கொள்’ என்றும், இச்சூழலில் ‘உடன் எடுத்துச் செல்’ என்றும் பொருள்படலாம்.
lexical_decisions:
- source_word: οἱ δὲ
  choice: அவர்களோ
  rationale: δέ இங்கு மென்மையான தொடர்ச்சி அல்லது வேறுபாட்டைக் காட்டுகிறது; ‘அவர்களோ’ என்பது கதையோட்டத்தில் இயல்பாக உள்ளது.
- source_word: διελογίζοντο
  choice: பேசிக்கொண்டார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வடிவம் தொடர்ந்து நடந்த பரஸ்பர ஆலோசனையைச் சுட்டுகிறது; தங்களுக்குள் என்ற தொடருடன் ‘பேசிக்கொண்டார்கள்’ இயல்பாக அந்தப் பொருளைத் தருகிறது.
- source_word: ἐν ἑαυτοῖς
  choice: தங்களுக்குள்
  rationale: சீடர்கள் தங்கள் குழுவுக்குள்ளேயே இதைப் பற்றிப் பேசினர் என்பதைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொற்றொடர்.
- source_word: λέγοντες ὅτι
  choice: “…” என்று
  rationale: ὅτι இங்கு அவர்கள் பேசியவற்றின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் நேர்கூற்றுடன் ‘என்று’ என வழங்குவது தெளிவும் இயல்பும் உடையது.
- source_word: Ἄρτους
  choice: அப்பம்
  rationale: கிரேக்கத்தில் பன்மை இருந்தாலும், இச்சூழலில் பயண உணவாகிய அப்பத்தைப் பொதுவாகக் குறிக்கிறது; தமிழில் ஒருமை வடிவமான ‘அப்பம்’ இயல்பான பொதுப்பெயராகச் செயல்படுகிறது.
- source_word: οὐκ ἐλάβομεν
  choice: கொண்டுவரவில்லை
  rationale: λαμβάνω என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்’ என்றாலும், பயணப் பொருட்கள் குறித்த இச்சூழலில் ‘உடன் எடுத்துவருதல்’ என்பதே நோக்கம்; ‘கொண்டுவரவில்லை’ அதை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ὅτι என்பதை காரணவாக்கியமாகவா அல்லது பேச்சின் உள்ளடக்கத்தை அறிமுகப்படுத்துவதாகவா மொழிபெயர்ப்பது
  choice: பேச்சின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் ‘என்று’
  alternative: ‘அவர் அப்படிச் சொன்னது, நாம் அப்பம் கொண்டுவராததால்தான்’
  rationale: கிரேக்க வாக்கியம் ‘அது இதனால்தான்’ என்ற விடுபட்ட கருத்தை வெளிப்படையாகச் சேர்க்கவில்லை. சூழலில் அந்தக் காரண அனுமானம் இருக்கக்கூடியதாயினும், உரையின் சுருக்கத்தையும் தெளிவின்மையையும் பாதுகாக்க நேர்கூற்றாக மொழிபெயர்க்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. மூலத்தின் தொடர்ச்சியான பரஸ்பர உரையாடலை ‘தங்களுக்குள் பேசிக்கொண்டார்கள்’ எனக் காட்டுகிறது; தேவையற்ற காரண விளக்கம் சேர்க்கப்படவில்லை.
