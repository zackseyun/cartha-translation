id: MAT.16.18
reference: Matthew 16:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: κἀγὼ δέ σοι λέγω ὅτι σὺ εἶ Πέτρος, καὶ ἐπὶ ταύτῃ τῇ πέτρᾳ οἰκοδομήσω μου τὴν ἐκκλησίαν, καὶ πύλαι ᾅδου οὐ κατισχύσουσιν αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/018.yaml
  text: And I also say to you that you are Peter[a], and on this rock I will build my church[b], and the gates of Hades will not prevail against it.
translation:
  language: ta
  text: 'நானும் உனக்குச் சொல்கிறேன்: நீ பேதுரு; இந்தப் பாறையின்மேல்[a] என் சபையைக் கட்டியெழுப்புவேன்; பாதாளத்தின்[b] வாயில்கள் அதன்மேல் வெற்றிபெறாது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் “பேதுரு” (Petros) என்பதற்கும் “பாறை” (petra) என்பதற்கும் இடையே சொல்விளையாட்டு உள்ளது. “இந்தப் பாறை” என்பது பேதுருவையோ, அவர் செய்த அறிக்கையையோ, அல்லது அந்த அறிக்கையைச் செய்த பிரதிநிதித் திருத்தூதராகிய பேதுருவையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: கிரேக்கத்தில் “ஹாதேஸ்”; அதாவது, இறந்தோரின் உலகம். மரபுவழியாக “நரகம்” என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ δέ
  choice: மேலும், நான்
  rationale: κἀγώ தரும் ‘நானும்/நானோ’ என்ற வலியுறுத்தலையும், δέ தரும் தொடர்ச்சி அல்லது மென்மையான மாறுபாட்டையும் தமிழில் இயல்பாகக் காட்டுகிறது; அளவுக்கு மீறிய எதிர்மறை வேறுபாட்டை உருவாக்கவில்லை.
- source_word: σοι λέγω
  choice: உனக்குச் சொல்கிறேன்
  rationale: நேரடிப் பேச்சின் தனிப்பட்ட முகவரியையும் λέγω என்பதன் அடிப்படைப் பொருளையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: Πέτρος
  choice: பேதுரு
  rationale: தமிழ் வேதாகம மரபில் பரவலாக அறியப்பட்ட பெயர்வடிவம்; கிரேக்கத்தில் உள்ள Πέτρος–πέτρα சொல்விளையாட்டை அடிக்குறிப்பு விளக்குகிறது.
- source_word: ἐπὶ ταύτῃ τῇ πέτρᾳ
  choice: இந்தப் பாறையின்மேல்
  rationale: ἐπί என்பதன் இடத்தொடர்பையும் ταύτῃ என்பதன் சுட்டுப்பொருளையும் நேரடியாகக் காக்கிறது; ‘பாறை’ யாரையோ எதையோ குறிக்கிறது என்பதை மொழிபெயர்ப்பிலேயே தீர்மானிக்கவில்லை.
- source_word: οἰκοδομήσω
  choice: கட்டியெழுப்புவேன்
  rationale: கட்டுமான உருவகத்தைத் தக்கவைத்தபடி, ஒரு மக்கள்கூட்டத்தை உருவாக்கி வளர்த்தல் என்ற பொருளில் இயல்பான நவீனத் தமிழை வழங்குகிறது.
- source_word: μου τὴν ἐκκλησίαν
  choice: என் சபையை
  rationale: ἐκκλησία என்பது கூடுகை அல்லது சமூகத்தைக் குறிக்கிறது; ‘சபை’ என்பது இயேசுவுக்குரிய மக்கள்சமூகத்தைச் சுருக்கமாகக் காட்டி, உடல் கட்டடம் மட்டும் என்ற எண்ணத்தைத் தவிர்க்கிறது.
- source_word: πύλαι ᾅδου
  choice: பாதாளத்தின் வாயில்கள்
  rationale: ᾅδης என்பதைக் கடைசித் தண்டனைக்கான இடமாகத் தீர்மானிக்காமல், இறந்தோரின் உலகம் என்ற பொருளில் ‘பாதாளம்’ எனக் கொடுக்கிறது; வாயில்கள் என்ற மூல உருவகத்தையும் காக்கிறது.
- source_word: οὐ κατισχύσουσιν αὐτῆς
  choice: அதை வெற்றிகொள்ளமாட்டா
  rationale: κατισχύω என்பதன் ‘மேலோங்குதல்/வெற்றிகொள்ளுதல்’ என்ற எதிர்ப்புச் சார்ந்த பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; ‘அதை’ என்பது சபையைக் குறிக்கிறது.
theological_decisions:
- issue: ‘இந்தப் பாறை’ (πέτρα) எதைக் குறிக்கிறது?
  choice: மொழிபெயர்ப்பில் ‘இந்தப் பாறை’ என்றே வைத்து அதன் குறிப்பு யாரென்று தீர்மானிக்காமல் விடப்பட்டது.
  alternative: அது பேதுருவையே, பேதுருவின் அறிக்கையையே, அல்லது அறிக்கையிடும் பிரதிநிதித் திருத்தூதராகிய பேதுருவையே குறிக்கிறது என்று வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: கிரேக்கம் Πέτρος மற்றும் πέτρα இடையிலான சொல்விளையாட்டைத் தெளிவாகக் கொண்டிருந்தாலும், குறிப்பின் முழு விளக்கத்தைத் தீர்மானிப்பதில்லை. ஆகவே வேறுபட்ட கிறிஸ்தவ மரபுகளுக்கிடையிலான உண்மையான விளக்கத் தளர்வை உரையிலேயே பாதுகாக்கிறது.
- issue: ᾅδης என்பதன் பொருள்
  choice: பாதாளம்
  alternative: நரகம்; இறந்தோரின் உலகம்
  rationale: ‘நரகம்’ என்பது இறுதித் தண்டனையைப் பற்றிய பின்னைய கருத்துகளை இங்கு தேவையின்றி கொண்டுவரக்கூடும். ‘பாதாளம்’ என்பதுடன் அடிக்குறிப்பு சேர்ப்பது இறந்தோரின் உலகம் என்ற கிரேக்கச் சொல்லின் பொருளைத் துல்லியமாகக் காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘கட்டியெழுப்புவேன்’ கட்டுமான உருவகத்தையும் இயல்பான தமிழ் வழக்கையும் இணைக்கிறது. ‘சபை’ என்பது கட்டடத்தைவிட மக்கள்சமூகத்தைக் குறிக்க உதவுகிறது; ‘இந்தப் பாறை’ பற்றிய சமயப்பிரிவு சார்ந்த முடிவு உரைக்குள் சேர்க்கப்படவில்லை.
