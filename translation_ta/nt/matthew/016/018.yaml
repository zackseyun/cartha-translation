revisions:
- from: 'மேலும், நான் உனக்குச் சொல்கிறேன்: நீ பேதுரு; இந்தப் பாறையின்மேல்[a] என் சபையைக் கட்டியெழுப்புவேன்; பாதாளத்தின்[b] வாயில்கள் அதை வெற்றிகொள்ளமாட்டா.'
  to: 'நானும் உனக்குச் சொல்கிறேன்: நீ பேதுரு; இந்தப் பாறையின்மேல்[a] என் சபையைக் கட்டியெழுப்புவேன்; பாதாளத்தின்[b] வாயில்கள் அதன்மேல் வெற்றிபெறாது.'
  rationale: The revision replaces ‘மேலும், நான்’ with ‘நானும்’ to preserve κἀγὼ’s additive emphasis while retaining δέ’s simple discourse continuation. It also revises the final verb phrase to a more idiomatic Tamil expression for ‘will not prevail against it.’ No interpretive decision is made about the referent of ‘this rock,’ and the Hades footnote remains appropriately precise.
