id: MAT.16.3
reference: Matthew 16:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ πρωΐ· Σήμερον χειμών, πυρράζει γὰρ στυγνάζων ὁ οὐρανός. ⸀τὸ μὲν πρόσωπον τοῦ οὐρανοῦ γινώσκετε διακρίνειν, τὰ δὲ σημεῖα τῶν καιρῶν οὐ δύνασθε.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/003.yaml
  text: And in the morning[a], ‘Today, stormy weather, for the sky is red and overcast.’ You know how to discern the appearance of the sky[b], but you are not able to discern the signs of the times.
translation:
  language: ta
  text: காலையில், ‘வானம் சிவந்து இருண்டிருக்கிறதே; இன்று மோசமான வானிலை இருக்கும்’ என்று சொல்கிறீர்கள். வானத்தின் தோற்றத்தைப் பகுத்தறிய உங்களுக்குத் தெரியும்; ஆனால் காலங்களின் அடையாளங்களைப் பகுத்தறிய உங்களால் முடியவில்லை.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில முக்கியமான பழமையான கையெழுத்துப் பிரதிகளில் 16:2-ன் பிற்பகுதியும் 16:3-ம் வசனமும் இல்லை.
    reason: textual_variant
  - marker: b
    text: ‘காலங்களின் அடையாளங்கள்’ என்பது அந்த நிகழ்காலத்தின் ஆன்மிக முக்கியத்துவத்தை, இயேசுவின் மேசியாவுக்குரிய செயல்கள் உட்பட, குறிப்பதாக இருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: πρωΐ
  choice: காலையில்
  rationale: காலத்தைக் குறிக்கும் வினையடைப் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: χειμών
  choice: புயல் வரும்
  rationale: இங்கு பருவமான ‘குளிர்காலம்’ அல்ல, மோசமான அல்லது புயலான வானிலையே குறிக்கப்படுகிறது; வானிலை முன்னறிவிப்பாக இயல்பாகச் சொல்லப்பட்டுள்ளது.
- source_word: πυρράζει
  choice: வானம் சிவந்து
  rationale: வானம் செந்நிறமாகத் தோன்றுவதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: στυγνάζων
  choice: இருண்டிருக்கிறதே
  rationale: வானம் மப்பாக, இருண்டு, அச்சுறுத்தும் தோற்றத்துடன் இருப்பதைக் குறிக்கும் பங்கேற்புவினையின் வானிலைச் சூழலைப் பாதுகாக்கிறது.
- source_word: πρόσωπον τοῦ οὐρανοῦ
  choice: வானத்தின் தோற்றம்
  rationale: சொல்லுக்குச் சொல் ‘வானத்தின் முகம்’ என்றாலும், இச்சொற்றொடரில் காணக்கூடிய வெளித்தோற்றமே பொருள்; ‘தோற்றம்’ நவீனத் தமிழில் தெளிவாக உள்ளது.
- source_word: γινώσκετε διακρίνειν
  choice: பகுத்தறிய உங்களுக்குத் தெரியும்
  rationale: அறிந்திருப்பதையும் மதிப்பிட்டு வேறுபடுத்தும் திறனையும் இணைத்துக் காட்டுகிறது.
- source_word: σημεῖα
  choice: அடையாளங்கள்
  rationale: சான்று, வெளிப்பாடு, முக்கியத்துவம் ஆகிய நுணுக்கங்களைத் தாங்கக்கூடிய வழக்கமான தமிழ் இணைச்சொல்.
- source_word: καιρῶν
  choice: காலங்களின்
  rationale: வானிலைப் பருவங்களை மட்டும் அல்லாமல் முக்கியத்துவம் வாய்ந்த தருணங்கள் அல்லது காலக்கட்டங்களையும் குறிக்கக்கூடிய கிரேக்கச் சொல்லின் பரப்பை நிலைநிறுத்துகிறது.
- source_word: οὐ δύνασθε
  choice: உங்களால் முடியவில்லை
  rationale: கிரேக்கத்தில் வெளிப்படையாகக் கூறப்பட்ட இயலாமையை நேரடியாகத் தெரிவிக்கிறது; முந்தைய ‘பகுத்தறிய’ என்பதும் பொருளுக்கேற்ப மீண்டும் வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘காலங்களின் அடையாளங்கள்’ என்பதன் பொருள்
  choice: அதன் பரந்த வடிவத்தை மொழிபெயர்ப்பில் அப்படியே வைத்தல்
  alternative: இயேசுவின் மேசியாவுக்குரிய செயல்களை அல்லது இறுதிக்கால அடையாளங்களை மட்டும் வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: இந்தச் சொற்றொடர் அந்நிகழ்காலத்தின் ஆன்மிக முக்கியத்துவத்தையும் இயேசுவின் செயல்களையும் உள்ளடக்கக்கூடும்; ஆனால் கிரேக்கம் அதன் பொருளை ஓர் அம்சத்திற்கு மட்டும் சுருக்கவில்லை. ஆகவே அதன் மேசியா சார்ந்த மற்றும் காலநிறைவு சார்ந்த இறுக்கம் தீர்க்கப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
- issue: வசனத்தின் உரைச்சான்று
  choice: வசனத்தை முதன்மை உரையில் வைத்து, கையெழுத்துப் பிரதிகளின் வேறுபாட்டை அடிக்குறிப்பில் தெரிவித்தல்
  alternative: வசனத்தை முதன்மை உரையிலிருந்து நீக்குதல் அல்லது அடைப்புக்குறிக்குள் இடுதல்
  rationale: SBLGNT இப்பகுதியில் உரைச்சான்று வேறுபாட்டைக் குறிக்கிறது. வாசிப்பை மறைக்காமல் உரையில் வழங்குவதுடன், சில முக்கியப் பழமையான சாட்சிகளில் இது இல்லாததை வெளிப்படையாகக் குறிப்பிடுவது பொருத்தமானது.
translation_notes:
  register: நவீன நிலையான தமிழில், பேச்சின் வானிலை முன்னறிவிப்பு இயல்பாக ஒலிக்குமாறும் கண்டனத்தின் தீவிரம் நிலைக்குமாறும் வடிவமைக்கப்பட்டது. ‘வானத்தின் முகம்’ என்ற சொல்லுக்குச் சொல் வடிவத்திற்கு பதிலாக தெளிவான ‘வானத்தின் தோற்றம்’ பயன்படுத்தப்பட்டது; ‘காலங்களின் அடையாளங்கள்’ என்ற சொற்றொடரின் இறையியல் பரப்பு குறுக்கப்படவில்லை.
