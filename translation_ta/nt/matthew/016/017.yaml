source:
  edition: SBLGNT
  text: ⸂ἀποκριθεὶς δὲ⸃ ὁ Ἰησοῦς εἶπεν αὐτῷ· Μακάριος εἶ, Σίμων Βαριωνᾶ, ὅτι σὰρξ καὶ αἷμα οὐκ ἀπεκάλυψέν σοι ἀλλ’ ὁ πατήρ μου ὁ ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/017.yaml
  text: And Jesus answered him[a], “Blessed are you, Simon Bar-Jonah, because flesh and blood did not reveal this to you[c][b], but my Father who is in heaven did.”
translation:
  language: ta
  text: 'இயேசு அவனுக்குப் பதிலளித்துச் சொன்னார்: “சீமோனே, பர்-யோனா,[a] நீ பேறுபெற்றவன்; ஏனெனில் இதை உனக்கு மாம்சமும் இரத்தமும் வெளிப்படுத்தவில்லை;[b] பரலோகத்தில் இருக்கிற என் தந்தையே வெளிப்படுத்தினார்.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பர்-யோனா” என்பது “யோனாவின் மகன்” என்று பொருள்படும் அரமேயத் தந்தைவழிப் பெயர் வடிவம்.
    reason: lexical_alternative
  - marker: b
    text: சொற்படி, “மாம்சமும் இரத்தமும்”; இது மனிதர்களையோ வெறும் மனித மூலத்தையோ குறிக்கும் மரபுத்தொடர்.
    reason: cultural_note
  - marker: c
    text: கிரேக்கத்தில் சொற்படி, “வானங்களில் இருக்கிறவர்.” இயல்பான தமிழில் ஒருமையாக மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν αὐτῷ
  choice: அதற்கு இயேசு அவனிடம் ... என்றார்
  rationale: வினையெச்சமும் முற்றுவினையும் சேர்ந்த கிரேக்க அமைப்பு ‘பதிலளித்துச் சொன்னார்’ என்ற பொருளைத் தருகிறது. தேவையற்ற இரட்டிப்பைத் தவிர்த்து இயல்பான தமிழ் நடையில் சூழலுக்குப் பதிலளிப்பதை ‘அதற்கு’ உணர்த்துகிறது.
- source_word: Μακάριος
  choice: பேறுபெற்றவன்
  rationale: வெறும் மனமகிழ்ச்சியைக் குறிக்கும் ‘மகிழ்ச்சியானவன்’ என்பதைவிட, கடவுளிடமிருந்து கிடைக்கும் நற்பேற்றைக் குறிக்கும் சொல்லாக இது இயேசுவின் அறிவிப்பின் இறையியல் நிறையைப் பேணுகிறது.
- source_word: Σίμων Βαριωνᾶ
  choice: பர்-யோனா என்ற சீமோனே
  rationale: கிரேக்கத்தில் பாதுகாக்கப்பட்டுள்ள அரமேயத் தந்தைவழிப் பெயர் வடிவத்தை ஒலிபெயர்த்து, நேரடி அழைப்பைத் தமிழில் இயல்பாகக் காட்டுகிறது. அதன் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: சீமோன் பேறுபெற்றவன் என்று அறிவிக்கப்பட்டதற்கான காரணத்தை இச்சொல் அறிமுகப்படுத்துகிறது.
- source_word: σὰρξ καὶ αἷμα
  choice: மாம்சமும் இரத்தமும்
  rationale: மனிதர்களையோ மனித மூலத்தையோ குறிக்கும் உருவக மரபுத்தொடரை நேரடியாகப் பேணி, அதன் பொருளை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: ἀπεκάλυψέν σοι
  choice: இதை உனக்கு வெளிப்படுத்தியது
  rationale: ἀποκαλύπτω என்பதன் வெளிப்படுத்துதல் என்ற பொருளையும் தெய்வீக வெளிப்பாட்டின் ஒலிநயத்தையும் பேணுகிறது. கிரேக்கத்தில் வெளிப்படையாக இல்லாத செயப்படுபொருள் முந்தைய அறிக்கையைக் குறிக்கும் ‘இதை’ என இயல்பான தமிழுக்காகச் சேர்க்கப்பட்டுள்ளது.
- source_word: ἀλλ’ ὁ πατήρ μου
  choice: அல்ல; ... என் தந்தையே
  rationale: மனித மூலத்திற்கும் தந்தையின் வெளிப்பாட்டிற்கும் இடையிலான வலுவான முரண்பாட்டை ‘அல்ல’ மற்றும் வலியுறுத்தும் ‘-ஏ’ காட்டுகின்றன.
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: பரலோகத்தில் இருக்கிற
  rationale: கிரேக்கத்தின் பன்மை வடிவத்தைச் சொற்படி பின்பற்றாமல், அதன் பொருளை நவீனத் தமிழில் இயல்பாகவும் மரியாதையுடனும் தருகிறது; மூல வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
theological_decisions:
- issue: பேதுருவின் அறிக்கைக்கான அறிவின் மூலம்
  choice: ‘மாம்சமும் இரத்தமும்’ என்ற மனித மூலத்திற்கும் தந்தையிடமிருந்து வந்த தெய்வீக வெளிப்பாட்டிற்கும் இடையிலான முரண்பாட்டை மொழிபெயர்ப்பு பேணுகிறது.
  alternative: இது சீமோனின் இயல்பான பகுத்தறிவை மட்டும் குறிக்கிறது என்றோ, ஏதோ ஒரு மனித ஆசிரியரை மட்டும் குறிக்கிறது என்றோ சுருக்கிப் புரிந்துகொள்ளலாம்.
  rationale: மரபுத்தொடர் மனித மூலத்தைப் பொதுவாக விலக்குகிறது; ஆனால் குறிப்பாக எந்த மனித வழியைச் சுட்டுகிறது என்பதை வசனம் வரையறுக்கவில்லை. எனவே உடனடி வெளிப்பாட்டைத் தாண்டிய விரிவான அகத்தூண்டுதல் கோட்பாடு மொழிபெயர்ப்பில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பர்-யோனா’ என்ற மூலத்தின் அரமேய வடிவம் பாதுகாக்கப்பட்டு விளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது. ‘மாம்சமும் இரத்தமும்’ என்ற உருவகம் தட்டையாக்கப்படாமல் வைக்கப்பட்டுள்ளது.
