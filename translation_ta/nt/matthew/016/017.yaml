revisions:
- from: அதற்கு இயேசு அவனிடம், “பர்-யோனா என்ற சீமோனே,[a] நீ பேறுபெற்றவன். ஏனெனில் இதை உனக்கு வெளிப்படுத்தியது மாம்சமும் இரத்தமும் அல்ல;[b] பரலோகத்தில் இருக்கிற என் தந்தையே.[c]” என்றார்.
  to: 'இயேசு அவனுக்குப் பதிலளித்துச் சொன்னார்: “சீமோனே, பர்-யோனா,[a] நீ பேறுபெற்றவன்; ஏனெனில் இதை உனக்கு மாம்சமும் இரத்தமும் வெளிப்படுத்தவில்லை;[b] பரலோகத்தில் இருக்கிற என் தந்தையே வெளிப்படுத்தினார்.[c]”'
