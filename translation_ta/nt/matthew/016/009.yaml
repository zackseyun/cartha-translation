id: MAT.16.9
reference: Matthew 16:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὔπω νοεῖτε, οὐδὲ μνημονεύετε τοὺς πέντε ἄρτους τῶν πεντακισχιλίων καὶ πόσους κοφίνους ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/009.yaml
  text: Do you still not understand[a], nor do you remember the five loaves for the five thousand[b], and how many baskets you gathered?
translation:
  language: ta
  text: இன்னும் நீங்கள் புரிந்துகொள்ளவில்லையா? ஐயாயிரம் பேருக்குக் கொடுக்கப்பட்ட ஐந்து அப்பங்களையும், எத்தனை கூடைகளை எடுத்தீர்கள் என்பதையும் நினைவுகூரவில்லையா?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὔπω
  choice: இன்னும் ... புரிந்துகொள்ளவில்லையா
  rationale: காலம் கடந்தும் புரிதல் ஏற்படாததைச் சுட்டும் οὔπω என்பதன் காலநிலை வலிமையையும் இயேசுவின் கடிந்துகொள்ளும் வினாவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: νοεῖτε
  choice: புரிந்துகொள்ளவில்லையா
  rationale: முந்தைய நிகழ்வுகளின் பொருளை மனத்தால் உணர்வதைக் குறிக்கிறது; வெறும் பார்வை அல்லது உணர்தலை அல்ல.
- source_word: οὐδὲ
  choice: '... என்பதையும் நினைவுகூரவில்லையா'
  rationale: இரு எதிர்மறை வினாக்களையும் தமிழில் இயல்பாக இணைக்கிறது; கிரேக்கத்தின் ஒருங்கிணைந்த எதிர்மறை அமைப்பைப் பேணுகிறது.
- source_word: μνημονεύετε
  choice: நினைவுகூரவில்லையா
  rationale: முந்தைய அற்புத நிகழ்வை நினைவில் கொண்டுவருவதைக் குறிக்கும் நேரடியான, கண்ணியமான சொல்.
- source_word: τοὺς πέντε ἄρτους
  choice: ஐந்து அப்பங்கள்
  rationale: உணவளிப்பு நிகழ்வில் ἄρτοι என்பது அப்பங்களைக் குறிக்கிறது; தமிழ் வேதாகமப் பயன்பாட்டிலும் பொதுப் புரிதலிலும் இயல்பான தேர்வு.
- source_word: τῶν πεντακισχιλίων
  choice: ஐயாயிரம் பேருக்குக் கொடுக்கப்பட்ட
  rationale: மரபுத்தொடரான பிறப்புவேற்றுமை உறவை, ஐந்து அப்பங்களுக்கும் ஐயாயிரம் பேருக்கு உணவளித்த நிகழ்வுக்கும் உள்ள தொடர்பாகத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: πόσους κοφίνους
  choice: எத்தனை கூடைகளை
  rationale: கூடைகளின் எண்ணிக்கையைப் பற்றிய நேரடியான வினாவையும் concrete image-ஐயும் பேணுகிறது.
- source_word: ἐλάβετε
  choice: எடுத்தீர்கள்
  rationale: λαμβάνω என்பதன் அடிப்படை ‘எடுத்தல்’ பொருளைத் தக்கவைத்து, மீதித் துண்டுகள் அடங்கிய கூடைகளை எடுத்த நிகழ்வுக்கு இயல்பாகப் பொருந்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கத்தின் இரு எதிர்மறை வினாக்கள் தமிழில் தனித்தனி வினாக்களாக அமைக்கப்பட்டு கண்டிக்கும் தொனியும் நினைவுகூர வேண்டிய விவரங்களும் பேணப்பட்டுள்ளன.
