id: MAT.16.15
reference: Matthew 16:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς· Ὑμεῖς δὲ τίνα με λέγετε εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/015.yaml
  text: He says to them[a], “But who do you say that I am?”
translation:
  language: ta
  text: அவர் அவர்களிடம், “ஆனால் நீங்கள், நான் யார் என்று சொல்கிறீர்கள்?” என்று கேட்கிறார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: கேட்கிறார்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தின் நிகழ்கால வடிவத்தைப் பேணுகிறது; கேள்வி உரையை அறிமுகப்படுத்தும் இடத்தில் தமிழில் ‘கேட்கிறார்’ என்பது இயல்பாக உள்ளது.
- source_word: αὐτοῖς
  choice: அவர்களிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்படுகிறது என்பதை இயல்பான தமிழில் குறிக்கிறது.
- source_word: Ὑμεῖς
  choice: நீங்கள்
  rationale: வெளிப்படையாக இடப்பட்ட இரண்டாம் நபர் பன்மைப் பெயர்ச்சொல்லின் வலியுறுத்தலைப் பேணுகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட பிறருடைய கருத்துகளுக்கும் சீடர்களுடைய பதிலுக்கும் இடையிலான வேறுபாட்டைக் காட்டுகிறது.
- source_word: τίνα
  choice: யார்
  rationale: தமிழின் ‘யார் என்று’ அமைப்பில் இயல்பாகச் செயல்பட்டு, இயேசுவின் அடையாளத்தைப் பற்றிய கேள்வியைத் தெளிவாகக் கூறுகிறது.
- source_word: με
  choice: நான்
  rationale: கிரேக்கத்தில் infinitive-இன் accusative subject ஆக இருந்தாலும், தமிழ் மறைமுகக் கூற்றில் இயல்பாக ‘நான் ... என்று’ என மாற்றப்படுகிறது.
- source_word: λέγετε
  choice: சொல்கிறீர்கள்
  rationale: இரண்டாம் நபர் பன்மை நிகழ்காலத்தை இயல்பாகவும் நேரடியாகவும் வெளிப்படுத்துகிறது.
- source_word: εἶναι
  choice: என்று
  rationale: கிரேக்க accusative-and-infinitive அமைப்பைத் தமிழின் இயல்பான மறைமுகக் கூற்று அமைப்பான ‘நான் யார் என்று’ என்பதாக வழங்குகிறது.
theological_decisions:
- issue: சீடர்களின் சொந்த மதிப்பீட்டுக்கு அளிக்கப்படும் வலியுறுத்தல்
  choice: “ஆனால் நீங்கள், நான் யார் என்று சொல்கிறீர்கள்?”
  alternative: “நீங்களோ, நான் யார் என்று சொல்கிறீர்கள்?”
  rationale: பொதுமக்களின் கருத்திலிருந்து சீடர்களின் கருத்துக்கு மாறும் எதிர்மறைத் தொடர்பையும், வெளிப்படையான Ὑμεῖς என்பதன் வலியுறுத்தலையும் பேணுகிறது; அடுத்த வசனத்தின் அறிக்கையை இவ்வசனத்திற்குள் முன்கூட்டியே சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; மரியாதைமிக்க, எளிதில் புரியும் நடை. மூலத்தின் வரலாற்று நிகழ்காலம் பேணப்பட்டுள்ளது. கிரேக்கச் சொற்படியான accusative-and-infinitive வடிவம் தமிழில் இயல்பில்லாததால், அதன் பொருள் ‘நான் யார் என்று’ என்ற இயல்பான அமைப்பில் தரப்பட்டுள்ளது.
