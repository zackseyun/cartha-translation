source:
  edition: SBLGNT
  text: καὶ προσλαβόμενος αὐτὸν ὁ Πέτρος ἤρξατο ἐπιτιμᾶν αὐτῷ λέγων· Ἵλεώς σοι, κύριε· οὐ μὴ ἔσται σοι τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/022.yaml
  text: And Peter took him aside and began to rebuke him[a], saying, “Far be it from you, Lord; this will certainly not happen to you.”
translation:
  language: ta
  text: பேதுரு அவரைத் தனியே அழைத்துக்கொண்டு, “ஆண்டவரே, உமக்கு அருள் உண்டாகட்டும்![a] இது உமக்கு நிச்சயமாக நேராது” என்று சொல்லி, அவரைக் கண்டிக்கத் தொடங்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் இது சொற்கள் விடுபட்டுள்ள ஓர் இடியோமாட்டிக் வெளிப்பாடு. இதை “ஆண்டவரே, இது உமக்கு நேரவே கூடாது!” அல்லது “ஆண்டவரே, கடவுள் இதைத் தடுக்கட்டும்!” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσλαβόμενος
  choice: அவரைத் தனியே அழைத்துச் சென்று
  rationale: இடைநிலை வினையெச்சம் இச்சூழலில் பேதுரு இயேசுவைத் தனிப்பட்ட முறையில் ஒதுக்கமாக அழைத்துச் சென்றதைக் குறிக்கிறது; வெறுமனே ‘அவரைப் பிடித்து’ என்பதைக் காட்டிலும் இது இயல்பாகவும் சூழலுக்கேற்றவாறும் உள்ளது.
- source_word: ἤρξατο ἐπιτιμᾶν
  choice: கண்டிக்கத் தொடங்கினார்
  rationale: ἤρξατο உடன் வரும் வினையெச்சத்தின் தொடக்கப் பொருளையும், ἐπιτιμάω என்பதன் வலுவான கண்டனப் பொருளையும் நேரடியாகத் தருகிறது.
- source_word: Ἵλεώς σοι
  choice: இது உமக்கு நேரவே கூடாது
  rationale: இது சொற்கள் விடுபட்டுள்ள ஓர் இடியோமாட்டிக் கிரேக்க வெளிப்பாடு. இங்கு பேதுருவின் மறுப்பையும் தடுக்கும் விருப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘கடவுள்’ என்ற சொல்லை முதன்மை உரையில் சேர்ப்பதில்லை.
- source_word: κύριε
  choice: ஆண்டவரே
  rationale: மரியாதைமிக்க நேரடி அழைப்பையும் மத்தேயு நற்செய்தியின் கிறிஸ்துவியல் ஒலிப்பையும் தக்கவைக்கிறது.
- source_word: οὐ μὴ ἔσται σοι τοῦτο
  choice: இது உமக்கு நிச்சயமாக நேராது
  rationale: οὐ μὴ உடன் எதிர்கால வினை தரும் வலியுறுத்தப்பட்ட மறுப்பை ‘நிச்சயமாக ... நேராது’ என்று தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: பேதுருவின் எதிர்ப்பில் மூலத்தில் வெளிப்படையாக இல்லாத இறைக் குறிப்பைச் சேர்க்காமல் Ἵλεώς σοι என்ற இடியோமைக் கொடுத்தல்
  choice: ஆண்டவரே, இது உமக்கு நேரவே கூடாது!
  alternative: ஆண்டவரே, கடவுள் இதைத் தடுக்கட்டும்! / ஆண்டவரே, உமக்கு இரக்கம் உண்டாவதாக!
  rationale: Ἵλεώς σοι என்பது சுருக்கப்பட்டும் பலவாறு புரிந்துகொள்ளப்பட்டும் வரும் மொழிவழக்கு. தேர்ந்தெடுத்த வாசகம் பேதுருவின் கடுமையான எதிர்ப்பைச் சூழலுக்கேற்ற தமிழில் தருகிறது; ‘கடவுள்’ என்பதை மொழிபெயர்ப்பாளர் சார்பாக முதன்மை உரையில் வெளிப்படையாக்குவதில்லை. மாற்று வாய்ப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன தரத் தமிழில், மரியாதைமிக்க வேதாகம நடையைத் தக்கவைத்து எழுதப்பட்டது. இயேசுவை நோக்கிய உரையில் ‘உமக்கு’ பயன்படுத்தப்பட்டுள்ளது; பேதுருவின் துணிச்சலான கண்டனத்தின் வலிமையும் இரு தொடர்ச்சியான மறுப்பு வாக்கியங்களின் பதற்றமும் பாதுகாக்கப்பட்டுள்ளன.
