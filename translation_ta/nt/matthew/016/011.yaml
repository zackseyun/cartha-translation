source:
  edition: SBLGNT
  text: πῶς οὐ νοεῖτε ὅτι οὐ περὶ ⸀ἄρτων εἶπον ὑμῖν; ⸂προσέχετε δὲ⸃ ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/011.yaml
  text: How do you not understand that I did not speak to you about bread? But beware of the leaven of the Pharisees and Sadducees[a][b].
translation:
  language: ta
  text: “நான் உங்களிடம் அப்பங்களைப் பற்றிப் பேசவில்லை என்பதை நீங்கள் எப்படி புரிந்துகொள்ளவில்லை? ஆனால், பரிசேயர், சதுசேயர் ஆகியோரின் புளிப்புமாவைக் குறித்து எச்சரிக்கையாக இருங்கள்[a][b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசேயர், சதுசேயர் ஆகியோரின் புளிப்புமாவைக் குறித்து விழிப்பாயிருங்கள்.”
    reason: lexical_alternative
  - marker: b
    text: இங்கே “புளிப்புமா” என்பது ஓர் உருவகம்; அடுத்த வசனத்தில் அது பரிசேயர்களும் சதுசேயர்களும் போதித்ததைக் குறிப்பதாக விளக்கப்படுகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: πῶς οὐ νοεῖτε
  choice: நீங்கள் எப்படி இன்னும் புரிந்துகொள்ளாமல் இருக்கிறீர்கள்?
  rationale: πῶς உடன் வரும் மறுப்பு, சீடர்கள் கருத்தைப் புரிந்துகொள்ளத் தவறியதைச் சுட்டும் கண்டிப்பான வினாவாக உள்ளது. தமிழில் இயல்பான வினாவாக்கத்திற்காக ‘இன்னும்’ சேர்க்கப்பட்டுள்ளது; இது சூழலில் தொடரும் புரியாமையை வெளிப்படுத்துகிறது, காரணத்தை ‘ஏன்’ என்று மாற்றுவதில்லை.
- source_word: ὅτι οὐ περὶ ἄρτων εἶπον ὑμῖν
  choice: நான் உங்களிடம் அப்பங்களைப் பற்றிப் பேசவில்லை என்பதை
  rationale: ἄρτων என்பதன் பன்மையை ‘அப்பங்களை’ என்று தக்கவைத்து, முந்தைய வசனங்களிலுள்ள குறிப்பிட்ட அப்பங்களை நினைவூட்டுகிறது. εἶπον ὑμῖν என்பதற்கு இயல்பான ‘உங்களிடம் ... பேசவில்லை’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: προσέχετε
  choice: எச்சரிக்கையாக இருங்கள்
  rationale: இங்கு இது வெறும் கவனம் செலுத்தும் கட்டளை அல்ல; ἀπό உடன் ஆபத்திலிருந்து காத்துக்கொள்ளுமாறு எச்சரிக்கும் வலிமை கொண்டது.
- source_word: δὲ
  choice: ஆனால்
  rationale: நேரடியான அப்பங்களைப் பற்றிய தவறான புரிதலிலிருந்து உண்மையான எச்சரிக்கைக்குச் செல்லும் மிதமான முரண்பாட்டைத் தெரிவிக்கிறது.
- source_word: ἀπὸ τῆς ζύμης
  choice: புளிப்புமாவைக் குறித்து
  rationale: ζύμη என்பது மாவைப் புளிக்கச் செய்யும் புளித்த மாவைக் குறிக்கும்; ‘புளிப்புமா’ உருவகத்தைத் தக்கவைக்கும் புரிந்துகொள்ளத்தக்க தமிழ் சொல். προσέχετε ἀπό என்ற இணைப்பின் எச்சரிக்கைப் பொருள் தமிழில் ‘குறித்து எச்சரிக்கையாக இருங்கள்’ என இயல்பாக வெளிப்படுகிறது.
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: பரிசேயர்களுடையதும் சதுசேயர்களுடையதும்
  rationale: இவ்விரு யூதக் குழுக்களுக்கான நிலைபெற்ற தமிழ் பெயர்கள் பயன்படுத்தப்பட்டுள்ளன; மரபுத்தொடர் அந்தப் புளிப்புமா அவர்களுக்குரியது அல்லது அவர்களின் தன்மையுடையது என்பதைத் திறந்தவாறே வைக்கிறது.
theological_decisions:
- issue: ‘புளிப்புமா’ என்ற உருவகத்தின் பொருள்
  choice: மூலத்தில் உள்ள ‘புளிப்புமா’ உருவகத்தை முதன்மை உரையில் விளக்காமல் தக்கவைத்தல்
  alternative: ‘பரிசேயர்களும் சதுசேயர்களும் போதிப்பதைக் குறித்து எச்சரிக்கையாக இருங்கள்’
  rationale: அடுத்த வசனம் இதைப் ‘போதனை’ என்று விளக்கினாலும், இவ்வசனம் ζύμη என்ற உருவகத்தையே பயன்படுத்துகிறது. இங்கேயே விளக்கத்தைப் புகுத்துவது வசனத்தின் இலக்கிய நகர்வை முன்கூட்டியே தீர்த்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. மூலத்தின் கண்டிப்பு, எதிர்மாற்றம், உருவகம் ஆகியவை தக்கவைக்கப்பட்டுள்ளன; அடிக்குறிப்பு குறிகள் அனைத்தும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
