source:
  edition: SBLGNT
  text: τότε συνῆκαν ὅτι οὐκ εἶπεν προσέχειν ἀπὸ τῆς ζύμης ⸂τῶν ἄρτων⸃ ἀλλὰ ἀπὸ τῆς διδαχῆς τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/012.yaml
  text: Then they understood that he had not said to beware of the leaven of bread[a], but of the teaching of the Pharisees and Sadducees.
translation:
  language: ta
  text: அப்போது, அப்பங்களின்[a] புளிப்புமாவிலிருந்து எச்சரிக்கையாக இருக்கும்படி அவர் சொல்லவில்லை; பரிசேயர்கள் மற்றும் சதுசேயர்களின் போதனையிலிருந்து எச்சரிக்கையாக இருக்கும்படியே சொன்னார் என்பதை அவர்கள் புரிந்துகொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் ‘அப்பங்கள்’ என்பது பன்மையில் உள்ளது.
    reason: மூலமொழியில் τῶν ἄρτων என்பது பன்மை வடிவம் என்பதைச் சுட்டிக்காட்டுகிறது.
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: சீடர்கள் இயேசுவின் பொருளைப் புரிந்துகொண்ட தருணத்தைக் குறிக்கும் இயல்பான காலச் சொல்.
- source_word: συνῆκαν
  choice: அவர்கள் புரிந்துகொண்டார்கள்
  rationale: συνίημι என்பதன் அறிவுணர்வு சார்ந்த பொருளையும், அந்த நேரத்தில் அவர்கள் புரிதலை அடைந்ததையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: οὐκ εἶπεν προσέχειν
  choice: அவர் எச்சரிக்கையாக இருக்கச் சொன்னது … அல்ல
  rationale: எச்சரித்து விழிப்புடன் இருக்க வேண்டும் என்ற προσέχειν என்பதன் சூழல்சார் வலிமையை நவீனத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: ἀπὸ τῆς ζύμης
  choice: புளிப்புமாவைக் குறித்து
  rationale: ζύμη என்பதன் நேரடிப் பொருளையும் உருவகத் தொடர்பையும் காக்கிறது; προσέχειν ἀπό என்ற தொடரைத் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: τῶν ἄρτων
  choice: அப்பங்களின்
  rationale: கிரேக்க மூலத்தில் உள்ள பன்மையைத் தக்கவைத்து, உடனிருக்கும் அப்பச் சூழலுடன் தொடர்புபடுத்துகிறது.
- source_word: ἀλλὰ
  choice: அல்ல … குறித்தே
  rationale: நேரடிப் பொருளுக்கும் இயேசு நோக்கிய உருவகப் பொருளுக்கும் இடையிலான வலுவான முரண்பாட்டைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: διδαχῆς
  choice: போதனையைக்
  rationale: διδαχή என்பதன் கருத்தை தேவையற்ற சமயக் கலைச்சொல் இன்றி, dignified modern Tamil usage-ல் தெளிவாக வழங்குகிறது.
- source_word: Φαρισαίων καὶ Σαδδουκαίων
  choice: பரிசேயர்கள் மற்றும் சதுசேயர்களின்
  rationale: இரு யூதக் குழுக்களின் வழக்கமான தமிழ் பெயர்ப்பெயர்களைப் பயன்படுத்துகிறது.
theological_decisions:
- issue: ‘புளிப்புமா’ என்பதன் உருவகப் பொருள்
  choice: வசனம் விளக்குகிற அளவிலேயே அதை ‘போதனை’ என்று அடையாளப்படுத்துதல்
  alternative: ‘மாய்மாலம்’, ‘தீய போதனை’ அல்லது ‘சீர்கெட்ட போதனை’ என்று விரிவாக விளக்குதல்
  rationale: இவ்வசனம் உருவகத்தைப் பரிசேயர்கள் மற்றும் சதுசேயர்களின் ‘போதனை’ என்று விளக்குகிறது; ஆனால் அதன் ஒழுக்கத் தன்மையை இங்கே மேலும் வரையறுக்கவில்லை. ஆகவே மூலத்தின் விளக்க வரம்பும் இறையியல் அழுத்தமும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அப்பங்களின் புளிப்புமா’ என்ற உருவகம் விளக்கி விரிவாக்கப்படாமல் காக்கப்பட்டுள்ளது.
