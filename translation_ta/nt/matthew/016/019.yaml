source:
  edition: SBLGNT
  text: ⸀δώσω σοι τὰς ⸀κλεῖδας τῆς βασιλείας τῶν οὐρανῶν, καὶ ὃ ⸀ἐὰν δήσῃς ἐπὶ τῆς γῆς ἔσται δεδεμένον ἐν τοῖς οὐρανοῖς, καὶ ὃ ⸁ἐὰν λύσῃς ἐπὶ τῆς γῆς ἔσται λελυμένον ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/019.yaml
  text: I will give you the keys of the kingdom of heaven[a], and whatever you bind on earth will have been bound in heaven[c][b], and whatever you loose on earth will have been loosed in heaven.
translation:
  language: ta
  text: பரலோக ராஜ்யத்தின்[a] திறவுகோல்களை நான் உனக்குக் கொடுப்பேன். நீ பூமியில் எதைக் கட்டுவாயோ, அது பரலோகத்தில் கட்டப்பட்டிருக்கும்;[c][b] நீ பூமியில் எதை அவிழ்ப்பாயோ, அது பரலோகத்தில் அவிழ்க்கப்பட்டிருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “வானங்களின் ராஜ்யம்.” மத்தேயு இந்தச் சொற்றொடரை அடிக்கடி பயன்படுத்துகிறார்.
    reason: lexical_alternative
  - marker: b
    text: “கட்டப்பட்டிருக்கும்” என்பதற்கு மாற்றாக, “கட்டப்படும்” என்றும்; அதற்கிணையாக “அவிழ்க்கப்பட்டிருக்கும்” என்பதற்கு “அவிழ்க்கப்படும்” என்றும் மொழிபெயர்ப்பது மரபான வழக்கம். கிரேக்க வினையமைப்பு நிறைவுற்ற செயலின் விளைவுநிலையையும் குறிக்கக்கூடும்.
    reason: alternative_reading
  - marker: c
    text: “கட்டு,” “அவிழ்” ஆகியவை தடைசெய்தல், அனுமதித்தல் அல்லது கடமைகளை விதித்தல், நீக்குதல் என்ற பொருள்களையும் தரக்கூடும்; முதன்மை உரை கிரேக்க உருவகத்தை அப்படியே பாதுகாக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: δώσω σοι
  choice: நான் உனக்குக் கொடுப்பேன்
  rationale: எதிர்காலச் செயலைக் குறிக்கும் நேரடியான வாக்குறுதியையும், σοι என்ற மறைமுகச் செயப்படுபொருளையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὰς κλεῖδας
  choice: திறவுகோல்களை
  rationale: மூலத்தில் உள்ள பன்மையையும் திறவுகோல் என்ற உருவகத்தையும் விளக்கமாக விரிக்காமல் அப்படியே பாதுகாக்கிறது.
- source_word: τῆς βασιλείας τῶν οὐρανῶν
  choice: பரலோக அரசின்
  rationale: βασιλεία என்பது ஆட்சி அல்லது அரசு என்ற பொருள் பரப்பைக் கொண்டது; இங்கு ‘அரசு’ என்பது திறவுகோல்கள் என்ற உருவகத்தோடு இயல்பாக இணைகிறது. τῶν οὐρανῶν என்ற பன்மைத் தொடரை தமிழில் வழக்கமான ஒருமையான ‘பரலோக’ என்று வழங்குகிறது; சொற்சொல்லான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ὃ ἐὰν δήσῃς
  choice: நீ ... எதைக் கட்டுவாயோ
  rationale: நிபந்தனை சார்ந்த காலவரையற்ற உறவுத்தொடரையும் எதிர்கால நோக்கையும் இயல்பாகக் காட்டுகிறது; ‘கட்டு’ என்ற மூல உருவகம் விளக்கமாக மாற்றப்படவில்லை.
- source_word: ἐπὶ τῆς γῆς
  choice: பூமியில்
  rationale: பரலோகத்துடனான இட வேறுபாட்டைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: ἔσται δεδεμένον
  choice: கட்டப்பட்டிருக்கும்
  rationale: εἰμί என்பதன் எதிர்கால வடிவமும் நிறைவுற்ற செயப்பாட்டு வினையெச்சமும் சேர்ந்த அமைப்பை, நிறைவுற்ற செயலின் விளைவுநிலையைக் குறிக்கும் தமிழ்ச் சொல்லாக்கத்தில் தருகிறது; வெறும் ‘கட்டப்படும்’ என்பதைவிட மூலத்தின் நிறைவு அம்சத்தை நன்றாகப் பாதுகாக்கிறது.
- source_word: ὃ ἐὰν λύσῃς
  choice: நீ ... எதை அவிழ்ப்பாயோ
  rationale: ‘கட்டு’ என்பதற்கு இணையான எதிர்ச் சொல்லாக ‘அவிழ்’ பயன்படுத்தப்பட்டு, மூலத்தின் உருவகச் சமச்சீர் பாதுகாக்கப்படுகிறது.
- source_word: ἔσται λελυμένον
  choice: அவிழ்க்கப்பட்டிருக்கும்
  rationale: முந்தைய கூற்றுக்கு இணையாக, எதிர்காலத்தில் நிலவும் நிறைவுற்ற செயப்பாட்டு நிலையைக் காட்டுகிறது.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: பரலோகத்தில்
  rationale: கிரேக்கப் பன்மையை நவீனத் தமிழில் இயல்பான ஒருமை வடிவில் வழங்குகிறது; சொற்சொல்லான பன்மை அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
theological_decisions:
- issue: கட்டுதல்–அவிழ்த்தல் கூற்றின் கால அம்சமும் அதன் இறையியல் உட்பொருளும்
  choice: ‘கட்டப்பட்டிருக்கும் / அவிழ்க்கப்பட்டிருக்கும்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘கட்டப்படும் / அவிழ்க்கப்படும்’
  rationale: ἔσται + நிறைவுற்ற செயப்பாட்டு வினையெச்சம், எதிர்காலத்தில் ஏற்கெனவே நிறைவேறிய செயலின் விளைவுநிலையைச் சுட்டக்கூடும். தமிழின் ‘-ப்பட்டிருக்கும்’ வடிவம் அந்த அம்சத்தைப் பாதுகாக்கிறது; பூமியிலான செயல் பரலோகத் தீர்மானத்தை ஏற்படுத்துகிறதா அல்லது அதற்கேற்ப அமைகிறதா என்பதை மொழிபெயர்ப்பு கோட்பாட்டுரீதியாகத் தீர்மானிக்கவில்லை.
- issue: பரலோக அரசின் திறவுகோல்கள் என்பதன் பொருள்
  choice: ‘திறவுகோல்கள்’ என்ற உருவகம் அப்படியே வைக்கப்பட்டது.
  alternative: உள்ளே அனுமதிக்கும் அல்லது விலக்கும் அதிகாரம் / பொறுப்பாட்சி அதிகாரம்
  rationale: உருவகம் அதிகாரத்தைக் குறிக்கலாம்; ஆனால் வசனம் அதை விளக்கமாக விரிக்கவில்லை. குறிப்பிட்ட திருச்சபை அதிகாரக் கோட்பாட்டை உரைக்குள் இறக்காமல் இருப்பதற்காக மூல உருவகம் பாதுகாக்கப்பட்டது.
- issue: ‘கட்டு’ மற்றும் ‘அவிழ்’ என்பவற்றின் சட்ட அல்லது அதிகாரப் பயன்பாடு
  choice: மூல உருவகங்கள் முதன்மை உரையில் பாதுகாக்கப்பட்டன.
  alternative: தடைசெய் / அனுமதி அளி; கடமையை விதி / நீக்கு
  rationale: இச்சொற்களுக்கு தடைசெய்தல்–அனுமதித்தல் அல்லது கடமையை விதித்தல்–நீக்குதல் போன்ற பொருள் இருக்கலாம்; எந்த ஓர் விளக்கத்தையும் மட்டும் முதன்மை உரையில் நிலைநிறுத்தாமல், அந்தச் சாத்தியம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. இயேசு பேதுருவிடம் ஒருமையில் பேசுவதால் ‘உனக்கு/நீ’ வடிவங்கள் வைக்கப்பட்டுள்ளன. ‘கட்டு–அவிழ்’ என்ற இணை உருவகம் பாதுகாக்கப்பட்டு, விளக்கப் பொருள்கள் அடிக்குறிப்புகளுக்கு ஒதுக்கப்பட்டுள்ளன.
