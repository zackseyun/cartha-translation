- from: பரலோக அரசின் திறவுகோல்களை நான் உனக்குக் கொடுப்பேன்.[a] நீ பூமியில் எதைக் கட்டுவாயோ, அது பரலோகத்தில் கட்டப்பட்டிருக்கும்;[b][c] நீ பூமியில் எதை அவிழ்ப்பாயோ, அது பரலோகத்தில் அவிழ்க்கப்பட்டிருக்கும்.
  to: பரலோக ராஜ்யத்தின்[a] திறவுகோல்களை நான் உனக்குக் கொடுப்பேன். நீ பூமியில் எதைக் கட்டுவாயோ, அது பரலோகத்தில் கட்டப்பட்டிருக்கும்;[c][b] நீ பூமியில் எதை அவிழ்ப்பாயோ, அது பரலோகத்தில் அவிழ்க்கப்பட்டிருக்கும்.
