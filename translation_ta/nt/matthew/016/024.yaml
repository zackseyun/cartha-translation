id: MAT.16.24
reference: Matthew 16:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τότε ὁ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Εἴ τις θέλει ὀπίσω μου ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/024.yaml
  text: Then Jesus said to his disciples[a], “If anyone wants to come after me, let him deny himself and take up his cross and follow me.”
translation:
  language: ta
  text: அப்போது இயேசு தம் சீடர்களிடம், “யாராவது என் பின்னே வர விரும்பினால், அவர் தம்மையே மறுத்து, தம் சிலுவையை எடுத்துக்கொண்டு, என்னைப் பின்பற்றட்டும்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: அப்போது
  rationale: அடுத்த நிகழ்வை வரிசையாக அறிமுகப்படுத்தும் காலக் குறிப்பு; நவீன தமிழில் இயல்பானது.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: தம் சீடர்களிடம்
  rationale: μαθηταί என்பதன் ஆசிரியர்–சீடர் உறவைத் துல்லியமாகப் பேணுகிறது; எழுவாய் இயேசு என்பதால் ‘தம்’ இயல்பான தற்சுட்டுப் பயன்பாடு.
- source_word: Εἴ τις θέλει
  choice: யாராவது … விரும்பினால்
  rationale: τις என்பதன் பொதுவான, அனைவரையும் உள்ளடக்கும் வரம்பையும் θέλω என்பதன் விருப்பத்தையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ὀπίσω μου ἐλθεῖν
  choice: என் பின்னே வர
  rationale: சீடத்துவத்தைக் குறிக்கும் பின்னால் வரும் உருவகத்தைப் பேணுகிறது; பின்னர் வரும் ἀκολουθείτω என்பதோடு ஒன்றாக்கவில்லை.
- source_word: ἀπαρνησάσθω ἑαυτὸν
  choice: அவர் தம்மையே மறுத்து
  rationale: தன்னையே மறுக்கும் தீர்மானமான செயலை நேரடியாகத் தெரிவிக்கிறது; ஒருமைத் தொடர்பு தமிழில் இயல்பாகப் பேணப்படுகிறது.
- source_word: ἀράτω τὸν σταυρὸν αὐτοῦ
  choice: தம் சிலுவையை எடுத்துக்கொண்டு
  rationale: சிலுவையைத் தூக்கிச் செல்லும்படி எடுத்துக்கொள்ளும் உருவகத்தையும் தனிப்பட்ட செலவையும் பேணுகிறது.
- source_word: ἀκολουθείτω μοι
  choice: என்னைப் பின்பற்றட்டும்
  rationale: மூன்றாம் நபர் கட்டளையின் வலிமையை ‘பின்பற்றட்டும்’ இயல்பாக வெளிப்படுத்துகிறது; நிகழ்காலக் கட்டளையின் தொடர்ச்சியான சீடத்துவப் பொருள் சூழலில் தெளிவாக உள்ளது.
theological_decisions:
- issue: பொதுப்பொருளில் வரும் ஆண்பால் ஒருமை இலக்கண வடிவங்கள்
  choice: ‘யாராவது … அவர் … தம்மையே … தம்’ என்று ஒருமையைப் பேணுதல்
  alternative: ‘ஒருவன் … அவன் … தன்னையே … தன்’ என்று வெளிப்படையான ஆண்பால் வடிவத்தைப் பயன்படுத்துதல்
  rationale: கிரேக்கத்தில் உள்ள ஆண்பால் ஒருமை வடிவங்கள் இங்கு பிரதிநிதித்துவப் பொதுப்பொருளில் வருகின்றன. தமிழின் ‘யாராவது … அவர்’ அமைப்பு அந்தப் பொதுவான வரம்பையும் ஒருமையையும் இயல்பாகப் பேணுகிறது; தேவையில்லாமல் ஆண்களுக்கு மட்டும் உரியதாகத் தோன்றுவதைத் தவிர்க்கிறது.
- issue: சுயமறுப்பின் பொருள்
  choice: ‘தம்மையே மறுத்து’
  alternative: ‘தம்மையே துறந்து’
  rationale: ‘துறந்து’ என்பது சொத்து அல்லது வாழ்க்கை நிலையை விட்டொழித்தல் என்ற கூடுதல் விளக்கத்தைத் தரக்கூடும். ‘மறுத்து’ என்பது ἀπαρνέομαι என்பதன் ‘மறுத்தல்/உரிமைகோராமை’ சார்ந்த பதற்றத்தைத் திறந்தவாறே வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; மரியாதையும் எளிமையும் கொண்ட உரைநடை. ‘என் பின்னே வர’ மற்றும் ‘என்னைப் பின்பற்ற’ என்ற இரு தனித்த கிரேக்கச் சொற்றொடர்களும் வேறுபடுத்திப் பேணப்பட்டுள்ளன. தமிழிலேயே பாலினப் பொதுமையும் ஒருமையும் இயல்பாக வெளிப்படுவதால் அடிக்குறிப்பு தேவையில்லை.
