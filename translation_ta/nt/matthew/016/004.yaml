id: MAT.16.4
reference: Matthew 16:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον ⸀Ἰωνᾶ. καὶ καταλιπὼν αὐτοὺς ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/004.yaml
  text: An evil and adulterous generation seeks a sign[a], and no sign will be given to it except the sign of Jonah. And leaving them[b], he went away.
translation:
  language: ta
  text: “தீயும் விபசாரமுமான[a] தலைமுறை ஓர் அடையாளத்தை நாடுகிறது; யோனாவின் அடையாளத்தைத்[b] தவிர வேறு எந்த அடையாளமும் அதற்குக் கொடுக்கப்படாது.” பின்பு அவர் அவர்களை விட்டுப் புறப்பட்டுச் சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீயும் உண்மையற்றதுமான தலைமுறை.” கிரேக்கத்தில் நேரடியாக “விபசாரமான” என்று உள்ளது; இது உடன்படிக்கைக்கு உண்மையற்றதைக் குறிக்கும் தீர்க்கதரிசன மொழியை எதிரொலிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: '“யோனாவின் அடையாளம்” குறித்து மத்தேயு 12:39–40 விளக்குகிறது: யோனா மூன்று பகலும் மூன்று இரவும் கடல் அரக்கனின் வயிற்றில் இருந்ததுபோல், மனிதகுமாரனுக்கும் அதனுடன் தொடர்புடைய ஒரு முன்மாதிரியை அங்கு கூறுகிறது.'
    reason: cross_reference
lexical_decisions:
- source_word: Γενεὰ
  choice: தலைமுறை
  rationale: இச்சொல் இங்கு இயேசுவின் காலத்தில் வாழ்ந்த நம்பிக்கையற்ற மக்கள் கூட்டத்தைக் குறிக்கிறது; ‘தலைமுறை’ என்பது கிரேக்கச் சொல்லின் வழக்கமான பொருளையும் மத்தேயுவின் பயன்பாட்டையும் காக்கிறது.
- source_word: πονηρὰ
  choice: தீய
  rationale: தார்மிகச் சீர்கேட்டை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கும் நவீனத் தமிழ்ச் சொல்.
- source_word: μοιχαλὶς
  choice: விபசாரமுள்ள
  rationale: கிரேக்கத்தில் உள்ள விபசார உருவகத்தின் கூர்மையைக் காக்கிறது; அதே நேரத்தில் தீர்க்கதரிசன மரபில் உள்ள இறைநம்பிக்கையின்மை அல்லது உடன்படிக்கைத் துரோகத்தின் எதிரொலியையும் திறந்துவைக்கிறது.
- source_word: σημεῖον
  choice: அடையாளம்
  rationale: கோரப்படும் அற்புதச் சான்றைச் சூழல் உணர்த்தினாலும், கிரேக்கம் வெளிப்படையாகச் சொல்லாத ‘அற்புதம்’ என்ற விளக்கத்தை முதன்மை உரையில் சேர்க்காமல் பொதுவான பொருளைக் காக்கிறது.
- source_word: ἐπιζητεῖ
  choice: நாடுகிறது
  rationale: தீவிரமாகத் தேடுதல் அல்லது கோருதல் என்ற பொருள் வரம்பை உடைய வினை; ‘நாடுகிறது’ என்பது சூழலின் எதிர்மறைத் தொனியை வற்புறுத்திச் சேர்க்காமல் பொருளை இயல்பாக வழங்குகிறது.
- source_word: δοθήσεται
  choice: கொடுக்கப்படாது
  rationale: δίδωμι என்பதன் எதிர்காலச் செயப்பாட்டு வடிவத்தை நேரடியாகத் தமிழில் தருகிறது.
- source_word: εἰ μὴ
  choice: தவிர
  rationale: ஒரே விதிவிலக்கை அறிமுகப்படுத்தும் இக்கட்டமைப்பைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: τὸ σημεῖον Ἰωνᾶ
  choice: யோனாவின் அடையாளம்
  rationale: உடைமை வேற்றுமையின் சுருக்கத்தையும் அதன் விளக்கத் திறப்பையும் காக்கிறது; உயிர்த்தெழுதலை முதன்மை உரையிலேயே விளக்கமாகச் சேர்க்கவில்லை.
- source_word: καταλιπὼν αὐτοὺς ἀπῆλθεν
  choice: அவர் அவர்களை விட்டுவிட்டுச் சென்றார்
  rationale: முன்னிகழ்ந்த வினையெச்சத்தையும் தொடர்ந்து நடந்த புறப்படுதலையும் இயல்பான தமிழ்ச் சொற்றொடரில் தருகிறது.
theological_decisions:
- issue: ‘விபசாரமுள்ள தலைமுறை’ என்பதன் பொருள்
  choice: விபசார உருவகத்தை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘உண்மையற்ற தலைமுறை’ அல்லது ‘இறைவனுக்கு உண்மையற்ற தலைமுறை’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: இந்தச் சொல் உடன்படிக்கைக்கு உண்மையின்மையைக் குறிக்கும் தீர்க்கதரிசன மொழியை எதிரொலிக்கக்கூடும். ஆனால் கிரேக்க உரை விபசார உருவகத்தையே பயன்படுத்துவதால், அதன் அறச்சார்ந்த மற்றும் இறையுறவுசார்ந்த இரு சாத்தியங்களையும் மொழிபெயர்ப்பு திறந்துவைக்கிறது.
- issue: ‘யோனாவின் அடையாளம்’ என்பதன் பொருள்
  choice: சொற்றொடரை விளக்கமின்றி முதன்மை உரையில் தக்கவைத்தல்
  alternative: இயேசுவின் மரணம் மற்றும் உயிர்த்தெழுதலை நேரடியாகக் குறிப்பிடுதல்
  rationale: மத்தேயு 12:39–40 இச்சொற்றொடருக்கு விரிவான பின்னணியை வழங்குகிறது; ஆயினும் இவ்வசனம் அதைச் சுருக்கமாகவே வைத்திருப்பதால், முழு விளக்கத்தை முதன்மை உரைக்குள் இறக்கவில்லை.
translation_notes:
  register: நவீனச் செந்தமிழ் நடையில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான மொழி பயன்படுத்தப்பட்டுள்ளது. ‘விபசாரமுள்ள’ என்ற கூர்மையான உருவகமும் ‘யோனாவின் அடையாளம்’ என்ற விளக்கத் திறப்புள்ள சொற்றொடரும் மூலத்தின் இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் பாதுகாக்கப்பட்டுள்ளன.
