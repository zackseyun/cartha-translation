  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἀπὸ τότε ἤρξατο ⸂ὁ Ἰησοῦς⸃ δεικνύειν τοῖς μαθηταῖς αὐτοῦ ὅτι δεῖ αὐτὸν ⸂εἰς Ἱεροσόλυμα ἀπελθεῖν⸃ καὶ πολλὰ παθεῖν ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων καὶ ἀποκτανθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ἐγερθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/021.yaml
  text: From that time Jesus began to show his disciples that he must go to Jerusalem and suffer many things from the elders and chief priests and scribes[a], and be killed[c][b], and on the third day be raised.
translation:
  language: ta
  text: அந்தக் காலத்திலிருந்து, தாம் எருசலேமுக்குச் சென்று, மூப்பர்கள், தலைமைக் குருக்கள், மறைநூல் அறிஞர்கள் ஆகியோரிடமிருந்து பல பாடுகளை அனுபவித்து[a], கொல்லப்பட்டு, மூன்றாம் நாளில் உயிர்த்தெழுப்பப்பட வேண்டும்[c] என்பதை இயேசு தமது சீடர்களுக்குக் காட்டத் தொடங்கினார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மிகவும் துன்பப்பட்டு.” கிரேக்கத்தில் சொற்சொல்லாக “பலவற்றைப் பாடுபட்டு” என்ற பன்மை அமைப்பு உள்ளது; அது பலவகையான பாடுகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “மூப்பர்கள், தலைமைக் குருக்கள், மறைநூல் அறிஞர்கள் ஆகியோரிடமிருந்து” என்பதை “மூப்பர்கள், தலைமைக் குருக்கள், மறைநூல் அறிஞர்கள் ஆகியோரின் கைகளால்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: c
    text: அல்லது, “உயிர்த்தெழ வேண்டும்.” கிரேக்கச் சொல் இங்கு செயப்பாட்டு வடிவில் இருப்பதால் முதன்மை உரை “உயிர்த்தெழுப்பப்பட” என்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: அந்தக் காலமுதல்
  rationale: கதையில் தொடங்கும் புதிய கட்டத்தைக் குறிக்கும் காலத் தொடரை இயல்பான தமிழில் காக்கிறது.
- source_word: ἤρξατο δεικνύειν
  choice: காட்டத் தொடங்கினார்
  rationale: ‘தொடங்கினார்’ புதிய போதனைக் கட்டத்தின் ஆரம்பத்தையும், ‘காட்ட’ என்பது எடுத்துக்காட்டி அறிவித்தல் அல்லது தெளிவுபடுத்துதல் என்ற பரப்பையும் காக்கின்றன.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: தமது சீடர்களுக்கு
  rationale: இயேசுவையே திரும்பச் சுட்டும் மரியாதையான தற்படர்க்கைப் பெயரடை மூலம் உறவு தெளிவாகிறது.
- source_word: δεῖ αὐτὸν
  choice: தாம் … வேண்டும்
  rationale: தேவையின் மூலத்தை விளக்கிச் சேர்க்காமல், கிரேக்கச் சொல்லின் கட்டாயத் தன்மையை ‘வேண்டும்’ காக்கிறது.
- source_word: εἰς Ἱεροσόλυμα ἀπελθεῖν
  choice: எருசலேமுக்குப் போய்
  rationale: இலக்கை நோக்கிய நகர்வை நவீனத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: πολλὰ παθεῖν
  choice: பல பாடுகளை அனுபவித்து
  rationale: πολλά என்பதன் பன்மையையும், παθεῖν என்பதன் துன்புறுதல் சார்ந்த பொருளையும் ஒருங்கே காக்கிறது.
- source_word: πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων
  choice: மூப்பர்கள், முதன்மைக் குருக்கள், மறைநூல் அறிஞர்கள்
  rationale: அக்கால யூதத் தலைமைக்குழுக்களைச் சுட்டும் வேறுபாடுகளைத் தெளிவாகவும் பொதுவாசகருக்குப் புரியும் வகையிலும் தருகிறது.
- source_word: ἀποκτανθῆναι
  choice: கொல்லப்பட்டு
  rationale: செயப்பாட்டு வடிவத்தையும் நேரடியான பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: τῇ τρίτῃ ἡμέρᾳ ἐγερθῆναι
  choice: மூன்றாம் நாளில் உயிர்த்தெழுப்பப்பட
  rationale: காலக் குறிப்பையும் கிரேக்கத்தின் செயப்பாட்டு வடிவத்தையும் காக்கிறது; சூழலில் மரணத்திலிருந்து எழுப்பப்படுதலை ‘உயிர்த்தெழுப்பப்பட’ தெளிவாக்குகிறது.
theological_decisions:
- issue: δεῖ குறிக்கும் அவசியத்தின் மூலம்
  choice: ‘வேண்டும்’ என்று மட்டும் மொழிபெயர்த்து, அவசியத்தின் மூலத்தை முதன்மை உரையில் குறிப்பிடவில்லை.
  alternative: ‘இறைத்திட்டத்தின்படி வேண்டும்’ அல்லது ‘நிறைவேறுவதற்காக வேண்டும்’
  rationale: இவ்வாக்கியத்தில் அவசியம் தெளிவாக இருந்தாலும் அது இறைத் தீர்மானமா, மறைநூல் நிறைவேற்றமா, வேறு வகை அவசியமா என்பதைச் சொற்றொடர் வெளிப்படையாக விளக்கவில்லை.
- issue: ἐγερθῆναι என்பதன் செயப்பாட்டு வடிவம்
  choice: ‘உயிர்த்தெழுப்பப்பட’
  alternative: ‘உயிர்த்தெழ’
  rationale: கிரேக்க வடிவத்தின் செயப்பாட்டை நிலைநிறுத்தி, எழுப்புகிறவர் யார் என்பதை முதன்மை உரையில் சேர்த்து விளக்காமல் விடுகிறது.
- issue: ἀπό சொற்றொடரின் தொடர்பு
  choice: தலைமைக்குழுக்களை பாடுகளுக்கும் கொலைக்கும் செயற்பாட்டுக் காரணிகளாகப் புரிந்துகொள்ள ஏதுவாக ‘ஆகியோரால்’ என அமைக்கப்பட்டது.
  alternative: ‘ஆகியோரிடமிருந்து பல பாடுகளை அனுபவித்து, கொல்லப்பட்டு’
  rationale: ἀπό நேரடியாக ‘பல பாடுகளை அனுபவிக்க’ என்பதுடன் இணைந்தாலும், ஒருங்கிணைக்கப்பட்ட தொடரில் கொல்லப்படுதலுக்கும் அதே மனிதச் செயலாண்மை இயல்பாக விரிகிறது; அடிக்குறிப்பு நெருக்கமான மாற்றைத் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘மறைநூல் அறிஞர்கள்’ என்பது γραμματεῖς குழுவின் வேதநூல் சார்ந்த பணியைத் தெளிவாக்குகிறது; ‘வேதபாரகர்’ போன்ற பழைய வழக்குச் சொல் தவிர்க்கப்பட்டது. ‘தாம்/தமது’ இயேசுவைத் தெளிவாகத் திரும்பச் சுட்டி மரியாதைநிலையைக் காக்கிறது.
