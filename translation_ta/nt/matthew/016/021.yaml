revisions:
- from: அந்தக் காலமுதல், தாம் எருசலேமுக்குப் போய், மூப்பர்கள், முதன்மைக் குருக்கள், மறைநூல் அறிஞர்கள் ஆகியோரால் பல பாடுகளை அனுபவித்து[a], கொல்லப்பட்டு[b], மூன்றாம் நாளில் உயிர்த்தெழுப்பப்பட வேண்டும்[c] என்பதை இயேசு தமது சீடர்களுக்குக் காட்டத் தொடங்கினார்.
