source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἐὰν θέλῃ τὴν ψυχὴν αὐτοῦ σῶσαι ἀπολέσει αὐτήν· ὃς δ’ ἂν ἀπολέσῃ τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/025.yaml
  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will find it.
translation:
  language: ta
  text: ஏனெனில், தன் உயிரை[a] காப்பாற்ற விரும்புகிறவர் அதை இழந்துவிடுவார்; ஆனால் எனக்காகத் தன் உயிரை இழக்கிறவர் அதைக் கண்டடைவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த வசனம் முழுவதிலும் ‘ஆத்துமா’ என்றும் மொழிபெயர்க்கலாம்; ψυχή (ப்ஸூகே) என்ற கிரேக்கச் சொல் சூழலுக்கேற்ப ‘உயிர்,’ ‘ஒருவரின் சுயம்,’ அல்லது ‘ஆத்துமா’ என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἐὰν / ὃς δ’ ἂν
  choice: ஏனெனில், ... விரும்புகிறவர் ...; ஆனால் ... இழக்கிறவர்
  rationale: ἐὰν/ἂν உடன் வரும் தொடர்புப்பெயர் அமைப்பு பொதுவான நிபந்தனையைத் தெரிவிக்கிறது. தமிழில் ‘...கிறவர்’ என்பது அதை இயல்பாகத் தருகிறது. γάρ முந்தைய கூற்றுடன் உள்ள காரணத் தொடர்பைக் காட்ட ‘ஏனெனில்’ என்றும், δέ இரு பகுதிகளின் முரண்பாட்டைக் காட்ட ‘ஆனால்’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: θέλῃ
  choice: விரும்புகிறவர்
  rationale: θέλω இங்கு மனவிருப்பத்தையோ நோக்கத்தையோ குறிக்கிறது; ‘விரும்பு’ என்பது நவீனத் தமிழில் இயல்பானதும் தெளிவானதும் ஆகும்.
- source_word: ψυχὴν
  choice: உயிரை
  rationale: சீடத்துவத்தையும் உயிரிழப்பையும் பற்றிய இச்சூழலில் ψυχή ஒருவருடைய உயிரைக் குறிக்கிறது. காப்பாற்றுதல், இழத்தல், கண்டடைதல் ஆகிய வினைகளுடன் ‘உயிர்’ இயல்பாகப் பொருந்துகிறது; ‘ஆத்துமா’ என்ற மரபுவழி மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: σῶσαι
  choice: காப்பாற்ற
  rationale: σῴζω என்பதன் ‘காப்பாற்று/பாதுகாத்துக்கொள்’ என்ற பொருளை ‘காப்பாற்ற’ நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: இழந்துவிடுவார் / இழக்கிறவர்
  rationale: இங்கு ἀπόλλυμι அழித்தொழித்தலைவிட உயிரை இழப்பதைக் குறிக்கிறது. முதல் இடத்தின் எதிர்கால வடிவம் ‘இழந்துவிடுவார்’ என்றும், ἄν உடன் வரும் இரண்டாம் நிபந்தனை வடிவம் தமிழில் இயல்பாக ‘இழக்கிறவர்’ என்றும் தரப்பட்டுள்ளது.
- source_word: ἕνεκεν ἐμοῦ
  choice: எனக்காக
  rationale: ἕνεκεν ἐμοῦ இயேசுவின் காரணமாகவும் அவரை முன்னிட்டும் நிகழ்வதைக் குறிக்கிறது; ‘எனக்காக’ தனிப்பட்ட பற்றுறுதியைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: εὑρήσει
  choice: கண்டடைவார்
  rationale: εὑρίσκω என்பதன் அடிப்படைப் பொருளான ‘கண்டடை’ பயன்படுத்தப்பட்டதால் கூற்றின் முரண்நயம் விளக்கவுரையின்றிப் பாதுகாக்கப்படுகிறது.
- source_word: αὐτοῦ / αὐτήν
  choice: தன் / அதை
  rationale: தமிழின் தற்சுட்டுப் பெயரான ‘தன்’ ஒரே நபரின் உயிரைக் குறிக்கிறது; ‘அதை’ முன்பு கூறப்பட்ட உயிரைத் தெளிவாகச் சுட்டுகிறது.
theological_decisions:
- issue: சீடத்துவ முரணுரையில் ψυχή என்பதன் பொருள்
  choice: உயிர்
  alternative: ஆத்துமா; தன்னையே
  rationale: இயேசுவைப் பின்பற்றுவதும் மரணத்தை எதிர்கொள்வதும் குறித்த சூழலில் காப்பாற்றப்படும், இழக்கப்படும், கண்டடையப்படும் ψυχή என்பது ஒருவரின் உயிரைக் குறிக்கிறது. ‘உயிர்’ இந்த முரணுரையைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது; அதேவேளையில் சொல்லின் விரிந்த பொருளையும் மரபுவழி ‘ஆத்துமா’ வாசிப்பையும் அடிக்குறிப்பு வெளிப்படையாக வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘எவர்/அவர்’ அமைப்பு கிரேக்கத்தின் பொதுப்பொருள் கொண்ட ஒருமையைப் பாலினம் குறிக்காமல் தெரிவிக்கிறது. இரு பகுதிகளின் இணையான அமைப்பும் காப்பாற்றுதல்–இழத்தல்–கண்டடைதல் என்ற முரண்நயமும் பாதுகாக்கப்பட்டுள்ளன.
