source:
  edition: SBLGNT
  text: μέλλει γὰρ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεσθαι ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων αὐτοῦ, καὶ τότε ἀποδώσει ἑκάστῳ κατὰ τὴν πρᾶξιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/027.yaml
  text: For the Son of Man is about to come in the glory of his Father with his angels[b][a], and then he will repay each one according to his deed.
translation:
  language: ta
  text: ஏனெனில், மனிதகுமாரன் தம் தந்தையின் மகிமையில் தம் தூதர்களுடன் வரவிருக்கிறார்[a]. அப்போது அவர் ஒவ்வொருவருக்கும் அவரவர் செயலின்படி கைம்மாறு அளிப்பார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வருவார்’ அல்லது ‘வரப்போகிறார்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடர் ‘வரவிருக்கிறார்’ என்று கூறி, வருகை நெருங்கியிருக்கும் உணர்வைத் தக்கவைக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அவர் செய்தவற்றுக்கு ஏற்ப’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் ‘செயல்’ என்பது ஒருமையில் இருந்து, ஒவ்வொருவருடைய நடத்தை அல்லது செயல்பாட்டை மொத்தமாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλει … ἔρχεσθαι
  choice: வரவிருக்கிறார்
  rationale: μέλλω + வினையெச்சம் வருகை எதிர்நோக்கி நெருங்கியிருப்பதைக் குறிக்கிறது. எளிய எதிர்காலமான ‘வருவார்’ என்பதைவிட ‘வரவிருக்கிறார்’ அந்த நெருக்க உணர்வை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: இயேசுவின் இச்சுயகுறிப்பின் நிலைபெற்ற பொருளையும் தானியேல் நூலோடு உள்ள தொடர்பொலியையும் காக்கிறது.
- source_word: ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ
  choice: தம் தந்தையின் மகிமையில்
  rationale: ἐν என்பதன் ‘மகிமையில்’ என்ற சூழல்/வெளிப்பாட்டு பொருளையும், தந்தையுடனான உரிமைத் தொடர்பையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: μετὰ τῶν ἀγγέλων αὐτοῦ
  choice: தம் தூதர்களுடன்
  rationale: μετά உடனிருப்பதைக் குறிக்கிறது; ‘தூதர்கள்’ என்பது ἄγγελοι என்பதற்கான இயல்பான வேதாகமச் சொல்.
- source_word: καὶ τότε
  choice: அப்போது
  rationale: முதலில் வருகை, பின்னர் கைம்மாறு என்ற கால வரிசையை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: ἀποδώσει
  choice: கைம்மாறு அளிப்பார்
  rationale: நியாயத்தீர்ப்புச் சூழலில் ஒருவருக்கு உரியதைத் திருப்பி அளிக்கும் பொருளைக் காட்டுகிறது; நேர்மறையான வெகுமதியை மட்டும் குறிக்கும் சொல்லைத் தவிர்க்கிறது.
- source_word: ἑκάστῳ κατὰ τὴν πρᾶξιν αὐτοῦ
  choice: ஒவ்வொருவருக்கும் அவரவர் செயலின்படி
  rationale: ἑκάστῳ என்பதன் தனிநபர் பகிர்வையும் πρᾶξις என்ற ஒருமையின் செயல்/நடத்தைப் பொருளையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: மனிதகுமாரனின் வருகையில் μέλλει என்பதன் கால நெருக்க உணர்வு
  choice: ‘வரவிருக்கிறார்’ என்று கால நெருக்கத்தைத் தக்கவைத்தல்
  alternative: ‘வருவார்’ அல்லது ‘வரப்போகிறார்’
  rationale: மூலமொழி எளிய எதிர்காலத்தை மட்டும் பயன்படுத்தாமல் μέλλω + வினையெச்சத்தைப் பயன்படுத்துகிறது. வருகையின் காலத்தைப் பற்றிய விவாதத்தை மொழிபெயர்ப்பிலேயே தீர்க்காமல், அதன் எதிர்நோக்கும் நெருக்க உணர்வைப் பாதுகாக்கிறது.
- issue: செயலின்படி வழங்கப்படும் நியாயத்தீர்ப்புக் கைம்மாறு
  choice: ‘ஒவ்வொருவருக்கும் அவரவர் செயலின்படி கைம்மாறு அளிப்பார்’
  alternative: ‘ஒவ்வொருவரும் செய்ததற்கேற்ப பலன் அளிப்பார்’
  rationale: வசனம் தனிநபரின் செயலுக்கு ஏற்ப உரியது அளிக்கப்படுவதைச் சொல்கிறது. ‘கைம்மாறு’ என்பது நன்மைக்கான வெகுமதியாக மட்டும் பொருளைக் குறுக்காமல், நீதிசார் பதிலளிப்பின் இருபக்க வாய்ப்பையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வழிபாட்டு வாசிப்புக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘மனிதகுமாரன்’ என்ற நிலைபெற்ற கிறிஸ்தவச் சொல் காக்கப்பட்டது; இயேசுவைக் குறிக்கும் வினைகளில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டது. ‘கைம்மாறு’ நீதிசார் பொருளைக் காக்கிறது; ‘வரவிருக்கிறார்’ மூலத்தின் கால நெருக்கத் தளராத பதற்றத்தைப் பாதுகாக்கிறது.
