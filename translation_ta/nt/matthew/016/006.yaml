review_pass:
  verdict: revise
  source_fidelity: The draft preserves the mild transitional force of δέ, the direct address, the paired warning imperatives, and the metaphorical expression ζύμη without prematurely substituting its later explanation. However, “புளித்த மாவு” denotes dough that has already been fermented, whereas ζύμη denotes leaven/a fermenting agent. “குறித்து” also weakens ἀπό, which calls for warning/guarding against or away from something.
  naturalness: The proposed revision uses clear modern standard Tamil and retains the emphatic double warning in an idiomatic form.
  terminology: “புளிப்பு” is the established concise Tamil biblical rendering for ‘leaven’ in this figurative context. The group names “பரிசேயர்கள்” and “சதுசேயர்கள்” are appropriate standard forms.
  issues:
  - severity: medium
    issue: “புளித்த மாவு” is not an exact equivalent of ζύμη.
    rationale: It normally means fermented dough, while the Greek refers to leaven, the fermenting substance or agent. This distinction matters to the lexical metaphor even though both are related in baking.
  - severity: medium
    issue: “... குறித்து எச்சரிக்கையாயிருங்கள்” does not fully convey προσέχετε ἀπό.
    rationale: “குறித்து” means ‘concerning/regarding’; the Greek warning includes the sense of guarding oneself against the leaven. The revision supplies that directional force while preserving the metaphor.
  revised_text: ஆனால் இயேசு அவர்களிடம், “எச்சரிக்கையாயிருங்கள்; பரிசேயர்கள் மற்றும் சதுசேயர்களின் புளிப்புக்கு எதிராகக் கவனமாக இருங்கள்” என்றார்.
  revised_footnotes:
  - marker: a
    text: அல்லது, “புளிப்பூட்டும் பொருள்.” கிரேக்கச் சொல் மாவைப் புளிக்கச் செய்யும் பொருளைக் குறிக்கிறது; இயேசு பின்னர் இதை பரிசேயர்கள் மற்றும் சதுசேயர்களின் போதனையோடு தொடர்புபடுத்தி விளக்குகிறார்.
    reason: lexical_alternative
  revision_rationale: The revision replaces “புளித்த மாவு” with “புளிப்பு” to represent ζύμη as leaven rather than already-fermented dough. It also replaces the merely topical “குறித்து” construction with “எதிராகக் கவனமாக இருங்கள்,” which conveys the protective force of προσέχετε ἀπό. The two warning imperatives and the unexplained metaphor remain intact.
