revisions:
- from: ஆனால் இயேசு அவர்களிடம், “விழிப்பாயிருங்கள்; பரிசேயர்கள் மற்றும் சதுசேயர்களின் புளித்த மாவைக்[a] குறித்து எச்சரிக்கையாயிருங்கள்” என்றார்.
  to: ஆனால் இயேசு அவர்களிடம், “எச்சரிக்கையாயிருங்கள்; பரிசேயர்கள் மற்றும் சதுசேயர்களின் புளிப்புக்கு எதிராகக் கவனமாக இருங்கள்” என்றார்.
  rationale: The revision replaces “புளித்த மாவு” with “புளிப்பு” to represent ζύμη as leaven rather than already-fermented dough. It also replaces the merely topical “குறித்து” construction with “எதிராகக் கவனமாக இருங்கள்,” which conveys the protective force of προσέχετε ἀπό. The two warning imperatives and the unexplained metaphor remain intact.
