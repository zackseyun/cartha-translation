id: MAT.16.6
reference: Matthew 16:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ὁρᾶτε καὶ προσέχετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/006.yaml
  text: But Jesus said to them[a], “Watch out and beware of the leaven of the Pharisees and Sadducees.”
translation:
  language: ta
  text: ஆனால் இயேசு அவர்களிடம், “எச்சரிக்கையாயிருங்கள்; பரிசேயர்கள் மற்றும் சதுசேயர்களின் புளிப்புக்கு எதிராகக் கவனமாக இருங்கள்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய நிகழ்வுடன் உள்ள மென்மையான முரண்பாட்டை இயல்பான தமிழில் காட்டுகிறது.
- source_word: εἶπεν αὐτοῖς
  choice: அவர்களிடம் … என்றார்
  rationale: தமிழின் இயல்பான நேர்கூற்று அமைப்பில், ‘அவர்களிடம் சொன்னார்’ என்பதைக் காட்டிலும் இது செம்மையாகவும் மூலத்தின் பொருளுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: Ὁρᾶτε
  choice: விழிப்பாயிருங்கள்
  rationale: இங்கு ὁράω என்பதன் கட்டளை வடிவம் நேரடியாகப் ‘பாருங்கள்’ என்று பொருள்படாமல், ஆபத்தை உணர்ந்து விழிப்புடன் இருக்குமாறு எச்சரிக்கிறது.
- source_word: προσέχετε ἀπὸ
  choice: … குறித்து எச்சரிக்கையாயிருங்கள்
  rationale: எச்சரித்து விலகியிருக்க வேண்டுமென்ற வலிமையை இயல்பான தமிழில் தெரிவிக்கிறது; முந்தைய கட்டளையுடன் சேர்ந்து மூலத்திலுள்ள இரட்டை எச்சரிப்பையும் காக்கிறது.
- source_word: ζύμης
  choice: புளித்த மாவு
  rationale: புளிக்கச் செய்யும் மாவைக் குறிக்கும் உருவகத்தை முன்கூட்டியே விளக்காமல் காக்கிறது; ‘ஈஸ்ட்’ என்ற நவீன கடன்சொல்லைவிட அக்கால உணவு நடைமுறைக்கும் உருவகத்திற்கும் நெருக்கமானது.
- source_word: Φαρισαίων
  choice: பரிசேயர்கள்
  rationale: இக்குழுவின் பெயருக்கான நிலைபெற்ற தமிழ் ஒலிபெயர்ப்பு.
- source_word: Σαδδουκαίων
  choice: சதுசேயர்கள்
  rationale: இக்குழுவின் பெயருக்கான நிலைபெற்ற தமிழ் ஒலிபெயர்ப்பு.
theological_decisions:
- issue: ‘புளித்த மாவு’ என்பதன் உருவகப் பொருள்
  choice: உருவகத்தை முதன்மை உரையில் விளக்காமல் அப்படியே வைத்தல்
  alternative: ‘போதனை’ அல்லது ‘செல்வாக்கு’ என்று நேரடியாக விளக்குதல்
  rationale: பின்னர் வரும் சூழலில் இயேசுவின் பொருள் விளக்கப்பட்டாலும், இந்த வசனம் ζύμη என்ற உருவகத்தையே பயன்படுத்துகிறது. அதை இங்கேயே விளக்குவது கதையின் முன்னேற்றத்தையும் மூலத்தின் திட்டமிட்ட தெளிவின்மையையும் முன்கூட்டியே தீர்த்துவிடும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. ‘விழிப்பாயிருங்கள்; … எச்சரிக்கையாயிருங்கள்’ என்பது மூலத்திலுள்ள இரண்டு எச்சரிப்புக் கட்டளைகளையும் தேவையற்ற சொல்லடுக்கின்றி காக்கிறது.
