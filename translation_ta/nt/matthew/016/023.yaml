id: MAT.16.23
reference: Matthew 16:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ στραφεὶς εἶπεν τῷ Πέτρῳ· Ὕπαγε ὀπίσω μου, Σατανᾶ· σκάνδαλον ⸂εἶ ἐμοῦ⸃, ὅτι οὐ φρονεῖς τὰ τοῦ θεοῦ ἀλλὰ τὰ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/023.yaml
  text: But he turned and said to Peter[a], “Go behind me, Satan! You are a stumbling block to me, because you are not setting your mind on the things of God[b], but on the things of men.”
translation:
  language: ta
  text: ஆனால் அவர் திரும்பி பேதுருவிடம், “என் பின்னால் போ, சாத்தானே! நீ எனக்கு இடறலாக இருக்கிறாய்; ஏனெனில் நீ கடவுளுக்குரியவற்றை மனதில் கொள்ளாமல், மனிதருக்குரியவற்றையே மனதில் கொள்கிறாய்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στραφεὶς
  choice: திரும்பி
  rationale: இறந்தகாலப் பங்கேற்புவினையின் இயல்பான தமிழாக்கம்; பேசுவதற்கு முன் இயேசு திரும்பிய செயலைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: Ὕπαγε ὀπίσω μου
  choice: என் பின்னால் போ
  rationale: Ὕπαγε என்பதன் ‘போ’ என்ற கட்டளையையும் ὀπίσω μου என்பதன் இடம்சார்ந்த ‘என் பின்னால்’ என்ற பொருளையும் காக்கிறது; சீடன் முன்னின்று வழிமறிக்காமல் பின்னால் செல்ல வேண்டும் என்ற சூழல்சார் எதிரொலியையும் தீர்மானித்துவிடாமல் விடுகிறது.
- source_word: Σατανᾶ
  choice: சாத்தானே
  rationale: விளிவேற்றுமையின் நேரடியான, கூர்மையான அழைப்பைக் காக்கிறது; ‘எதிரியே’ என்று பொதுப்பொருளாக்காமல், பேதுரு சாத்தானாகவே அடையாளப்படுத்தப்படுகிறாரா அல்லது சாத்தானின் கருவியாகச் செயல்படுகிறாரா என்ற தெளிவின்மையைத் திறந்துவைக்கிறது.
- source_word: σκάνδαλον
  choice: இடறல்
  rationale: ஒருவரைத் தடுமாறச் செய்யும் தடைக்கல் என்ற உருவகத்தை இயல்பான தமிழில் காக்கிறது; ‘குற்றம்’ அல்லது ‘மனவருத்தம்’ போன்ற நவீனச் சுருக்கப் பொருள்களைத் தவிர்க்கிறது.
- source_word: ἐμοῦ
  choice: எனக்கு
  rationale: σκάνδαλον உடன் வரும் தொடர்பை இயல்பான தமிழில், இயேசுவுக்கு இடையூறாக இருப்பது எனத் தெரிவிக்கிறது.
- source_word: φρονεῖς
  choice: எண்ணுகிறாய்
  rationale: இங்கு வெறும் தற்காலிக சிந்தனையைவிட மனப்பாங்கு மற்றும் நோக்குநிலையைச் சுட்டுகிறது; மீண்டும் வரும் எதிர்மறை இணைப்பில் தமிழ் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: τὰ τοῦ θεοῦ
  choice: கடவுளுக்குரியவற்றை
  rationale: ‘கடவுளின் காரியங்கள்’ என்ற சாத்தியமான வடிவத்தைவிட, கடவுளின் நோக்கங்கள் மற்றும் அக்கறைகள் உட்பட மூலத்தின் விரிவான பொருளை இயல்பாகக் காக்கிறது.
- source_word: τὰ τῶν ἀνθρώπων
  choice: மனிதருக்குரியவற்றையே
  rationale: ἄνθρωπος இங்கு பாலினத்தை விட மனிதகுலத்தைப் பொதுவாகக் குறிக்கிறது. ‘மனிதர்’ என்பது நவீனத் தமிழில் அந்த உள்ளடக்கப் பொருளைத் துல்லியமாகத் தருகிறது; δέ மூலம் வரும் முரண்பாட்டை ‘-ஏ’ வலுப்படுத்துகிறது.
theological_decisions:
- issue: பேதுருவை நோக்கிய ‘சாத்தானே’ என்ற அழைப்பின் பொருள்
  choice: ‘சாத்தானே’ என்பதை நேரடியாகக் காத்து, அதன் விளக்கத்தைத் திறந்துவைத்தல்
  alternative: ‘எதிரியே’ என்று பொதுப்பொருளில் மொழிபெயர்த்தல்; அல்லது ‘உன் மூலம் செயல்படும் சாத்தானே’ என்று விளக்கிச் சேர்த்தல்
  rationale: கிரேக்கம் கடுமையான அழைப்பைத் தருகிறது; ஆனால் பேதுருவைச் சாத்தானுடன் முழுமையாக அடையாளப்படுத்துகிறதா அல்லது அவன் சாத்தானுக்குரிய எதிர்ப்பை வெளிப்படுத்துகிறானா என்பதை இலக்கணமே தீர்மானிக்கவில்லை.
- issue: τὰ τοῦ θεοῦ / τὰ τῶν ἀνθρώπων என்ற எதிர்மறை இணை
  choice: ‘கடவுளுக்குரியவை’ மற்றும் ‘மனிதருக்குரியவை’ என்று இணையான வடிவில் மொழிபெயர்த்தல்
  alternative: ‘கடவுளின் திட்டம்’ மற்றும் ‘மனித ஆசைகள்’ என்று குறிப்பாக்குதல்
  rationale: மூலத்தின் பரந்த, சமச்சீரான சொற்றொடரையும் அதன் இறையியல் பதற்றத்தையும் காக்கிறது; ‘திட்டம்’ அல்லது ‘ஆசைகள்’ என்று பொருளைச் சுருக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், இயேசுவின் கடுமையான கண்டிப்பை மங்கச் செய்யாமல் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. இவ்வசனத்திற்கு அவசியமான உரை அல்லது மொழிபெயர்ப்பு அடிக்குறிப்பு இல்லை; ஆகவே முதன்மை உரையில் அடிக்குறிப்பு குறியீடுகள் சேர்க்கப்படவில்லை.
