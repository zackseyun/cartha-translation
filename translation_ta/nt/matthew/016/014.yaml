source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Οἱ μὲν Ἰωάννην τὸν βαπτιστήν, ἄλλοι δὲ Ἠλίαν, ἕτεροι δὲ Ἰερεμίαν ἢ ἕνα τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/014.yaml
  text: And they said[a], “Some say John the Baptist, others Elijah, and others Jeremiah or one of the prophets.”
translation:
  language: ta
  text: 'அவர்கள் சொன்னார்கள்[a]: “சிலர் திருமுழுக்கு அளிப்பவரான யோவான் என்றும், வேறு சிலர் எலியா என்றும், இன்னும் சிலர் எரேமியா அல்லது இறைவாக்கினர்களில் ஒருவர் என்றும் சொல்கிறார்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் வெளிப்படையாக: “சிலர் நீர் திருமுழுக்கு அளிப்பவரான யோவான் என்றும், வேறு சிலர் எலியா என்றும், இன்னும் சிலர் எரேமியா அல்லது இறைவாக்கினர்களில் ஒருவர் என்றும் சொல்கிறார்கள்.”'
    reason: கிரேக்கத்தில் ‘நீர் ...’ என்பது சொல்லப்படாமல், முந்தைய கேள்வியிலிருந்து புரிந்துகொள்ளப்படுகிறது.
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: அவர்கள் சொன்னார்கள்
  rationale: δέ இங்கு வலுவான முரண்பாட்டைக் குறிக்காமல் உரையாடலைத் தொடர்கிறது; தமிழில் தனி இணைப்புச்சொல் இல்லாமலேயே இயல்பான கதைநடை அமைகிறது. εἶπαν என்பதற்கு நேரான பொருள் ‘சொன்னார்கள்’.
- source_word: Οἱ μὲν
  choice: சிலர் ... என்றும் ... சொல்கிறார்கள்
  rationale: μέν தொடங்கும் பகிர்வுப் பட்டியலைத் தமிழில் ‘சிலர்’ என்றும் பின்னர் ‘வேறு சிலர்/இன்னும் சிலர்’ என்றும் இயல்பாக வெளிப்படுத்துகிறது. இயேசுவைப் பற்றிய அடையாளப்படுத்தல் முந்தைய கேள்வியிலிருந்து புரிந்துகொள்ளப்படுகிறது.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: திருமுழுக்கு கொடுத்துவந்த யோவான்
  rationale: βαπτιστής என்பது திருமுழுக்கு அளிப்பவரைக் குறிக்கிறது. ‘கொடுத்துவந்த’ என்பது அவருடைய தொடர்ச்சியான பணியை இயல்பான தமிழில் காட்டுகிறது; குறிப்பிட்ட திருச்சபை மரபுக்கே உரிய பெயரிடலைத் தவிர்க்கிறது.
- source_word: ἄλλοι δὲ
  choice: வேறு சிலர்
  rationale: பட்டியலில் இரண்டாவது குழுவைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது; δέ-ஐ வலுவான ‘ஆனால்’ என்று மொழிபெயர்க்கத் தேவையில்லை.
- source_word: Ἠλίαν
  choice: எலியா
  rationale: இந்தத் தீர்க்கதரிசியின் பெயருக்கான வழக்கமான நவீனத் தமிழ் வடிவம்.
- source_word: ἕτεροι δὲ
  choice: இன்னும் சிலர்
  rationale: பட்டியலில் மேலும் ஒரு தனிக் குழுவை ἕτεροι குறிக்கிறது; ‘இன்னும் சிலர்’ அந்த முன்னேற்றத்தை இயல்பாகத் தருகிறது.
- source_word: Ἰερεμίαν
  choice: எரேமியா
  rationale: இந்தத் தீர்க்கதரிசியின் பெயருக்கான பரவலாக அறியப்பட்ட தமிழ் வடிவம்.
- source_word: ἢ ἕνα τῶν προφητῶν
  choice: அல்லது இறைவாக்கினர்களில் ஒருவர்
  rationale: ἤ குறிக்கும் மாற்றுத் தெரிவை ‘அல்லது’ நேராக வெளிப்படுத்துகிறது. மூலத்தில் இல்லாத ‘வேறு’ என்பதைக் கூட்டவில்லை. προφήτης என்பதற்கு தெளிவான, நவீனத் தமிழ் சொல்லாக ‘இறைவாக்கினர்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: அடையாளப்படுத்தலின் மறைந்திருக்கும் பொருள்
  choice: முதன்மை உரையில் ‘நீர் ... என்று’ என்பதைச் சேர்க்காமல், கிரேக்கத்தில் உள்ள சுருக்கப்பட்ட பட்டியல் அமைப்பைப் பேணுதல்.
  alternative: “சிலர் நீர் திருமுழுக்கு கொடுத்துவந்த யோவான் என்றும்...” என்று வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: இந்த வசனத்தின் கிரேக்க உரை அடையாளப்படுத்தப்படும் நபரை வெளிப்படையாக மீண்டும் குறிப்பிடவில்லை; முந்தைய வசனத்தில் இயேசு கேட்ட கேள்வியிலிருந்து அது தெளிவாகிறது. தமிழிலும் ‘என்றும்’ அமைப்பு சூழலில் புரிந்துகொள்ளக்கூடியதால் அந்தச் சுருக்கத்தைப் பேணலாம்; வெளிப்படையான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன, மரியாதைமிக்க, பொதுவாகப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. பட்டியலின் கிரேக்கச் சுருக்கம் தமிழிலும் காக்கப்பட்டு, தேவையான வெளிப்படையான வடிவம் அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
