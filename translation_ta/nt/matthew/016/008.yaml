source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς ⸀εἶπεν· Τί διαλογίζεσθε ἐν ἑαυτοῖς, ὀλιγόπιστοι, ὅτι ἄρτους οὐκ ⸀ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/008.yaml
  text: But Jesus[a], knowing this, said, “Why are you discussing among yourselves, you of little faith, that you have no bread?”
translation:
  language: ta
  text: இதை அறிந்த இயேசு, “நம்பிக்கை குறைந்தவர்களே, நீங்கள் அப்பம் எடுத்துவரவில்லை[a] என்று உங்களுக்குள் ஏன் பேசிக்கொள்கிறீர்கள்?” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, சொற்சார்ந்து, “அப்பங்களை எடுத்துக்கொள்ளவில்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: இதை அறிந்த
  rationale: இறந்தகால வினையெச்சம், இயேசு பேசுவதற்கு முன் சீடர்களின் உரையாடலை அறிந்ததைச் சுட்டுகிறது. கிரேக்கத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லாவிட்டாலும், சூழலிலிருந்து ‘இதை’ இயல்பாகச் சேர்க்கப்படுகிறது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல் இன்றி
  rationale: இங்கு δὲ மென்மையான கதைநடை மாற்றத்தைக் குறிக்கிறது. தமிழில் ‘இதை அறிந்த இயேசு’ என்ற தொடர் அந்த மாற்றத்தை இயல்பாகவே வெளிப்படுத்துவதால் ‘ஆனால்’ என்று சேர்ப்பது தேவையற்ற வலுவான முரண்பாட்டை உண்டாக்கலாம்.
- source_word: Τί διαλογίζεσθε
  choice: ஏன் பேசிக்கொள்கிறீர்கள்?
  rationale: τί இங்கு காரணத்தைக் கேட்கும் ‘ஏன்’ என்ற பொருளில் வருகிறது; διαλογίζεσθε சீடர்கள் தங்களிடையே சிந்தித்துப் பேசியதைக் குறிக்கிறது.
- source_word: ἐν ἑαυτοῖς
  choice: உங்களுக்குள்
  rationale: இந்தத் தமிழ் சொற்றொடர் ‘உங்களிடையே’ என்ற சூழல்சார் பொருளை இயல்பாகத் தருவதோடு, ‘உங்களுக்குள்ளே’ என்ற கிரேக்கச் சொல்லாக்கத்தின் சாத்திய நுண்ணியத்தையும் முற்றிலும் நீக்கவில்லை.
- source_word: ὀλιγόπιστοι
  choice: நம்பிக்கை குறைந்தவர்களே
  rationale: சீடர்களின் போதாத நம்பிக்கையை நேரடியாகக் கண்டிக்கும் அழைப்புமுறை. நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ὅτι
  choice: என்று
  rationale: அவர்கள் பேசிக்கொண்டிருந்த கருத்தின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் இணைப்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἄρτους
  choice: அப்பம்
  rationale: கிரேக்கத்தில் பன்மை இருந்தாலும், தமிழில் உணவுப்பொருளைக் குறிக்க ‘அப்பம்’ என்ற ஒருமை வடிவம் இங்கு இயல்பான பொதுப்பெயராகச் செயல்படுகிறது.
- source_word: οὐκ ἐλάβετε
  choice: எடுத்துவரவில்லை
  rationale: λαμβάνω அடிப்படையில் ‘எடுக்க/பெற’ என்றாலும், பயணத்திற்காக அப்பத்தை உடன் எடுத்துவராததே சூழல்சார் பொருள். ‘எடுத்துவரவில்லை’ அந்தப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; சொற்சார்ந்த மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: ὀλιγόπιστοι என்ற இயேசுவின் கண்டிப்பின் வலிமை
  choice: ‘நம்பிக்கை குறைந்தவர்களே’ என்று, சீடர்களின் போதாத நம்பிக்கையை நேரடியாகக் கண்டிக்கும் வகையில் மொழிபெயர்த்தல்
  alternative: ‘சரியாகப் புரிந்துகொள்ளாதவர்களே’ என்று வெறும் புரிதல் குறையாக மென்மைப்படுத்துதல்
  rationale: மூலச்சொல் அவர்களின் புரிதலை மட்டும் அல்ல, நம்பிக்கையின் குறைவையும் விமர்சிக்கிறது. அதற்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல் அந்த இறையியல் அழுத்தம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘விசுவாசம்’ என்பதற்குப் பதிலாக இயல்பான ‘நம்பிக்கை’ தேர்ந்தெடுக்கப்பட்டாலும், கண்டிப்பின் இறையியல் வலிமை குறைக்கப்படவில்லை.
