  yaml_path: translation/nt/matthew/016/005.yaml
  text: And when the disciples came to the other side[a], they had forgotten to take bread.
translation:
  language: ta
  text: சீடர்கள் அக்கரைக்கு வந்தபோது, அப்பங்களைக் கொண்டுவர மறந்துவிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθόντες
  choice: வந்தபோது
  rationale: இறந்தகாலப் பங்கேற்புவினையின் காலத் தொடர்பை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: οἱ μαθηταὶ
  choice: சீடர்கள்
  rationale: நற்செய்தி நூல்களில் இயேசுவைப் பின்பற்றியவர்களைக் குறிக்கும் வழக்கமான, சூழலுக்கேற்ற சொல்.
- source_word: εἰς τὸ πέραν
  choice: அக்கரைக்கு
  rationale: நீர்நிலையின் மறுகரையைக் குறிக்கும் சுருக்கமான, இயல்பான தமிழ் வழக்கு.
- source_word: ἐπελάθοντο
  choice: மறந்துவிட்டார்கள்
  rationale: முதன்மை நிகழ்வுக்கு முன்பே எடுத்துவராமல் விட்டதைத் தமிழில் இயல்பாக உணர்த்துகிறது.
- source_word: ἄρτους
  choice: அப்பங்களை
  rationale: கிரேக்க மூலத்தின் பன்மையைப் பாதுகாக்கிறது; எண்ணத்தக்க அப்பங்களைக் குறிக்கும் சூழலுக்கும் பொருந்துகிறது.
- source_word: λαβεῖν
  choice: கொண்டுவர
  rationale: பயணத்தில் தங்களுடன் எடுத்துவருதல் என்ற சூழ்நிலைப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
