id: MAT.16.16
reference: Matthew 16:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ Σίμων Πέτρος εἶπεν· Σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ τοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/016.yaml
  text: Simon Peter answered[a], “You are the Messiah, the Son of the living God.”
translation:
  language: ta
  text: 'சீமோன் பேதுரு பதிலளித்தார்: “நீரே மேசியா[a], வாழும் கடவுளின் மகன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்து.” கிரேக்கப் பட்டமான Χριστός என்பதைக் “கிறிஸ்து” என்றும் மொழிபெயர்க்கலாம்; இங்கு அதன் பட்டத்தன்மையையும் யூத மேசியா எதிர்பார்ப்பின் பின்னணியையும் காக்க “மேசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: பதிலளித்தார்
  rationale: இரு கிரேக்கச் சொற்களும் சேர்ந்து உரையாடலில் பதில் கூறுவதை அறிமுகப்படுத்துகின்றன. தமிழில் தேவையற்ற இரட்டிப்பைத் தவிர்த்து இயல்பாக ஒரே வினைச்சொல்லால் தரப்பட்டுள்ளது.
- source_word: δὲ
  choice: —
  rationale: இது மென்மையான உரைத் தொடர்ச்சி அல்லது மாற்றத்தைக் குறிக்கிறது; இவ்விடத்தில் தமிழில் தனியே மொழிபெயர்க்காமல் விடுவது இயல்பானது.
- source_word: Σίμων Πέτρος
  choice: சீமோன் பேதுரு
  rationale: தனிப்பெயர்கள் தமிழில் நிலைபெற்ற வேதாகம ஒலிபெயர்ப்பு மரபுப்படி தரப்பட்டுள்ளன.
- source_word: Σὺ εἶ
  choice: நீரே
  rationale: வெளிப்படையாக வந்துள்ள Σὺ வலியுறுத்தலைக் கொண்டது. மரியாதையும் வலியுறுத்தலும் வெளிப்பட ‘நீரே’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ὁ χριστὸς
  choice: மேசியா
  rationale: இங்கு Χριστός தனிப்பெயராக அல்ல, அபிஷேகம் செய்யப்பட்டவர் என்ற யூத எதிர்பார்ப்புடன் தொடர்புடைய பட்டமாகச் செயல்படுகிறது. ஆகவே பட்டத்தின் பொருளைத் தெளிவாக வைத்திருக்க ‘மேசியா’ எனத் தரப்பட்டுள்ளது.
- source_word: ὁ υἱὸς
  choice: மகன்
  rationale: குறிப்பிட்ட உறவையும் பட்டத்தன்மையையும் சூழலும் தமிழ் தொடரமைப்பும் வெளிப்படுத்துவதால் ‘மகன்’ எனத் தரப்பட்டுள்ளது.
- source_word: τοῦ θεοῦ τοῦ ζῶντος
  choice: வாழும் கடவுளின்
  rationale: ζῶντος என்பது கடவுளை விவரிக்கும் நிகழ்காலப் பெயரெச்சம். ‘வாழும் கடவுள்’ என்பது அதன் செயற்பாட்டுத் தன்மையையும் மறைநூல் எதிரொலியையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: Χριστός என்பதைப் பட்டமாகவா, பெயர்போன்ற வடிவமாகவா மொழிபெயர்ப்பது
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: பேதுருவின் அறிக்கையில் இது தெளிவாக ஒரு பட்டம். ‘மேசியா’ அந்தப் பட்டத்தின் யூதச் சூழலை வெளிப்படுத்துகிறது; மரபான ‘கிறிஸ்து’ அடிக்குறிப்பில் மாற்றாகப் பாதுகாக்கப்படுகிறது.
- issue: ‘கடவுளின் மகன்’ என்பதன் இறையியல் பரப்பு
  choice: வாழும் கடவுளின் மகன்
  alternative: —
  rationale: கிரேக்க உரையின் அறிக்கை மற்றும் பட்டத்தன்மை விரிவாக்கமின்றி அப்படியே காக்கப்படுகின்றன; பிற்கால இறையியல் விளக்கங்கள் வசனத்துக்குள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இயேசுவை நோக்கிய மரியாதையை ‘நீர்’ என்பதும், கிரேக்கத்தின் வலியுறுத்தலை ‘நீரே’ என்பதும் வெளிப்படுத்துகின்றன.
