source:
  edition: SBLGNT
  text: Ἐλθὼν δὲ ὁ Ἰησοῦς εἰς τὰ μέρη Καισαρείας τῆς Φιλίππου ἠρώτα τοὺς μαθητὰς αὐτοῦ λέγων· ⸀Τίνα λέγουσιν οἱ ἄνθρωποι εἶναι τὸν υἱὸν τοῦ ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/013.yaml
  text: When Jesus came into the region of Caesarea Philippi[a], he was asking his disciples, saying[b], “Who do people say the Son of Man is?”
translation:
  language: ta
  text: இயேசு பிலிப்பு செசரியாவின் பகுதிகளுக்கு வந்தபோது, தம் சீடர்களிடம், “மனிதமகன் யார் என்று மக்கள் சொல்கிறார்கள்?[a]” எனக் கேட்டுக்கொண்டிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் நேரடியாக: “மனிதமகன் யாராக இருக்கிறார் என்று மக்கள் சொல்கிறார்கள்?”'
    reason: கிரேக்கத்தில் εἶναι (‘இருக்க’) என்ற முடிவிலா வினை வடிவத்துடன் அமைந்த மறைமுகக் கேள்வியின் நெருக்கமான வடிவத்தைச் சுட்டுகிறது.
lexical_decisions:
- source_word: Ἐλθὼν δὲ ὁ Ἰησοῦς
  choice: இயேசு ... வந்தபோது
  rationale: இறந்தகாலப் பங்கேற்புவினையான Ἐλθὼν புதிய காட்சிக்கான காலச்சூழலைத் தருகிறது; δέ-யின் மென்மையான மாற்றத்தை தமிழில் தேவையற்ற இணைப்புச்சொல் சேர்க்காமல் இயல்பான வாக்கிய ஓட்டத்தில் வெளிப்படுத்துகிறது.
- source_word: εἰς τὰ μέρη Καισαρείας τῆς Φιλίππου
  choice: பிலிப்புச் செசரியாவின் சுற்றுப்பகுதிக்கு
  rationale: μέρη என்பது இங்கு நகரத்தைச் சுற்றியுள்ள வட்டாரம் அல்லது பிரதேசத்தைக் குறிக்கிறது. இடப்பெயரின் வேறுபடுத்தும் கூறான Φιλίππου-வைத் தமிழில் இயல்பாக ‘பிலிப்புச் செசரியா’ என்று வழங்குகிறது.
- source_word: ἠρώτα
  choice: கேட்டுக்கொண்டிருந்தார்
  rationale: நிறைவுறா இறந்தகால வடிவம் தொடர்ச்சியான அல்லது நடைபெற்று வந்த கேள்விச் செயலைக் குறிக்கிறது; ‘கேட்டுக்கொண்டிருந்தார்’ அந்த வினையியற் கூறைப் பாதுகாக்கிறது.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: தம் சீடர்களிடம்
  rationale: μαθηταί என்பதற்கான நிலைபெற்ற நற்செய்தி நூல் வழக்கு ‘சீடர்கள்’; αὐτοῦ இயேசுவையே சுட்டுவதால் மரியாதைத் தற்சுட்டுப் பெயரான ‘தம்’ இயல்பானது.
- source_word: λέγων
  choice: என
  rationale: கேள்வியை அறிமுகப்படுத்தும் λέγων-ஐ தமிழில் தனியே ‘சொல்லி’ என்று மீளுரைப்பதைவிட மேற்கோளுக்குப் பின் ‘எனக் கேட்டார்’ என்பது இயல்பாகவும் துல்லியமாகவும் அமைகிறது.
- source_word: Τίνα λέγουσιν οἱ ἄνθρωποι εἶναι
  choice: யார் என்று மக்கள் சொல்கிறார்கள்
  rationale: ἄνθρωποι இங்கு பாலினம் சாராத பொதுப்பொருளில் வருவதால் ‘மக்கள்’ பொருத்தமானது. கிரேக்க மறைமுகக் கூற்றை தமிழில் ‘யார் என்று ... சொல்கிறார்கள்’ என இயல்பாக வழங்குகிறது.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: மனிதமகன்
  rationale: இது நற்செய்தி நூல்களில் இயேசுவின் சிறப்பான தற்சுட்டுப் பெயர். ‘மனிதமகன்’ அதன் சொல்வடிவம், தானியேல் 7 உடனான எதிரொலி, மற்றும் தலைப்புப் போன்ற இறையியல் நிறை ஆகியவற்றைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου என்பதன் மொழிபெயர்ப்பு
  choice: மனிதமகன்
  alternative: மனிதரானவர்
  rationale: ‘மனிதமகன்’ என்பது பாரம்பரியமாக அறியப்படும் சொல்வடிவத்தைப் பாதுகாப்பதோடு, இயேசுவின் தற்சுட்டுப் பயன்பாட்டையும் தானியேல் 7 சார்ந்திருக்கக்கூடிய எதிரொலியையும் முன்கூட்டியே ஒரே விளக்கத்துக்குள் அடைத்துவிடாமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘கேட்டுக்கொண்டிருந்தார்’ மூலம் மூலத்தின் நிறைவுறா இறந்தகால அம்சம் காக்கப்பட்டுள்ளது; λέγων தமிழில் இயல்பான மேற்கோள் அமைப்புக்குள் இணைக்கப்பட்டுள்ளது. முதன்மை உரையில் உள்ள [a] குறியீடு அடிக்குறிப்புடன் நேரடியாகப் பொருந்துகிறது.
