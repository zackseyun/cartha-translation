id: MAT.16.26
reference: Matthew 16:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τί γὰρ ⸀ὠφεληθήσεται ἄνθρωπος ἐὰν τὸν κόσμον ὅλον κερδήσῃ τὴν δὲ ψυχὴν αὐτοῦ ζημιωθῇ; ἢ τί δώσει ἄνθρωπος ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/026.yaml
  text: For what will it profit a man if he gains the whole world but forfeits his life? Or what will a man give in exchange for his life?[a]
translation:
  language: ta
  text: ஒரு மனிதன் உலகம் முழுவதையும் ஆதாயமாகப் பெற்றாலும் தன் உயிரை இழந்துவிட்டால், அவனுக்கு என்ன பயன்? அல்லது தன் உயிருக்கு ஈடாக ஒரு மனிதன் எதைக் கொடுப்பான்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இவ்வசனத்தில் ‘உயிர்’ என்று வரும் இரண்டு இடங்களிலும் ‘ஆன்மா’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ψυχή சூழலுக்கேற்ப ‘உயிர்,’ ‘தன் முழு ஆளுமை,’ அல்லது ‘ஆன்மா’ என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: அவனுக்கு என்ன பயன்?
  rationale: τί என்ற வினாவையும், முந்தைய போதனையை விளக்கும் γάρ என்பதன் தொடர்பையும் தமிழின் இயல்பான சொல்லமைப்பில் வெளிப்படுத்துகிறது; வசனம் தனியாக வாசிக்கப்படும்போதும் கேள்வியின் வலிமை தெளிவாக உள்ளது.
- source_word: ὠφεληθήσεται
  choice: அவனுக்கு என்ன பயன்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தின் ‘என்ன நன்மை கிடைக்கும்?’ என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἄνθρωπος
  choice: ஒரு மனிதன்
  rationale: கிரேக்க ஒருமைச் சொல்லின் பிரதிநிதித்துவமான பொதுப்பொருளைப் பாதுகாக்கிறது.
- source_word: τὸν κόσμον ὅλον
  choice: உலகம் முழுவதையும்
  rationale: κόσμος மற்றும் அதை முழுமைப்படுத்தும் ὅλον ஆகிய இரண்டின் பொருளையும் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: κερδήσῃ
  choice: ஆதாயமாகப் பெற்றாலும்
  rationale: உலகத்தைப் பெறுதல் மற்றும் உயிரை இழத்தல் ஆகியவற்றுக்கு இடையிலான வணிக உருவகத்தையும் நிபந்தனைத் தொடர்பையும் காக்கிறது.
- source_word: τὴν ... ψυχὴν αὐτοῦ ζημιωθῇ
  choice: தன் உயிரை இழந்துவிட்டால்
  rationale: ζημιόω என்பதன் இழப்பு அல்லது பறிகொடுத்தல் என்ற பொருளைத் தெளிவாகத் தருகிறது; ψυχή இங்கு ஒருவரின் உயிர் அல்லது முழுத் தன்னைக் குறிக்கக்கூடியதால் ‘உயிர்’ முதன்மை மொழிபெயர்ப்பாகத் தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἢ τί δώσει ἄνθρωπος
  choice: அல்லது ... ஒரு மனிதன் எதைக் கொடுப்பான்?
  rationale: இரண்டாவது இணையான வினாவையும் எதிர்கால வினை வடிவத்தையும் நேரடியாகக் காக்கிறது.
- source_word: ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ
  choice: தன் உயிருக்கு ஈடாக
  rationale: ἀντάλλαγμα என்பதிலுள்ள பரிமாற்ற உருவகத்தை ‘ஈடாக’ இயல்பாக வெளிப்படுத்துகிறது; மீட்புவிலை போன்ற குறுகிய கருத்தை உரைக்குள் சேர்ப்பதில்லை.
theological_decisions:
- issue: ψυχή என்பதை இறுதி இழப்பைப் பற்றிய இக்கூற்றில் மொழிபெயர்த்தல்
  choice: உயிர்
  alternative: ஆன்மா; தன்னையே
  rationale: இச்சூழலில் ψυχή என்பது உடலிலிருந்து தனியான பகுதியை மட்டும் தொழில்நுட்பமாகக் குறிக்க வேண்டியதில்லை; ஒருவரின் உயிரையும் முழுத் தன்னையும் குறிக்க முடியும். ‘உயிர்’ அந்த விரிந்த பொருளை இயல்பாகக் காக்கிறது. ‘ஆன்மா’ என்பது உண்மையான மாற்று என்பதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குத் தெளிவான அதே நேரத்தில் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘ஆதாயம்—இழப்பு—ஈடு’ என்ற மூலத்தின் பொருளாதார உருவகத் தொடர் முடிந்தவரை பாதுகாக்கப்பட்டது.
