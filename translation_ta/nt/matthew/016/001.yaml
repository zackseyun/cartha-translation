source:
  edition: SBLGNT
  text: Καὶ προσελθόντες οἱ Φαρισαῖοι καὶ Σαδδουκαῖοι πειράζοντες ἐπηρώτησαν αὐτὸν σημεῖον ἐκ τοῦ οὐρανοῦ ἐπιδεῖξαι αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/001.yaml
  text: And the Pharisees and Sadducees came and[a], testing him, asked him to show them a sign from heaven.
translation:
  language: ta
  text: பரிசேயர்களும் சதுசேயர்களும் அவரிடம் வந்து, அவரைச் சோதித்து[a], வானத்திலிருந்து ஓர் அடையாளத்தைத் தங்களுக்குக் காட்டும்படி கேட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவரைத் தவறிழைக்கத் தூண்டி’ அல்லது ‘அவரைச் சிக்கவைக்க முயன்று.’
    reason: πειράζοντες என்பதற்கு ‘சோதித்தல்,’ ‘தவறிழைக்கத் தூண்டுதல்,’ அல்லது சூழலின்படி ‘சிக்கவைக்க முயலுதல்’ என்ற பொருள் நிழல்கள் இருக்கலாம்.
lexical_decisions:
- source_word: προσελθόντες
  choice: அவரிடம் வந்து
  rationale: இது முதன்மை வினைக்கு முன் நிகழும் அணுகுதலைக் குறிக்கும் இறந்தகால வினையெச்சம்; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: Φαρισαῖοι
  choice: பரிசேயர்கள்
  rationale: இக்குழுவின் பெயருக்கான நிலைபெற்ற தமிழ் ஒலிபெயர்ப்பு.
- source_word: Σαδδουκαῖοι
  choice: சதுசேயர்கள்
  rationale: இக்குழுவின் பெயருக்கான நிலைபெற்ற தமிழ் ஒலிபெயர்ப்பு.
- source_word: πειράζοντες
  choice: அவரைச் சோதித்துப் பார்க்கும் நோக்கத்தில்
  rationale: சூழலில் உள்ள எதிர்மறையான நோக்கத்தை உணர்த்தினாலும், ‘சிக்கவைக்க’ என்று மிகுதியாக விளக்காமல் πειράζω என்பதன் சோதித்தல் என்ற அடிப்படைப் பொருளைப் பாதுகாக்கிறது.
- source_word: ἐπηρώτησαν
  choice: கேட்டார்கள்
  rationale: கேட்பது அல்லது வேண்டுவது என்ற முதன்மை வினையின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: σημεῖον
  choice: ஓர் அடையாளம்
  rationale: சூழல் அற்புதமான உறுதிப்படுத்தும் அடையாளத்தைக் குறிக்கலாம்; எனினும் மூலத்தில் ‘அடையாளம்’ என்றே இருப்பதால் கூடுதல் விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: வானத்திலிருந்து
  rationale: அடையாளத்தின் தோற்றுவாயைக் குறிக்கும் கிரேக்கச் சொற்றொடரின் நேர்த்தியான தமிழ் வடிவம்.
- source_word: ἐπιδεῖξαι
  choice: காட்டும்படி
  rationale: அவர்கள் கேட்ட செயலைக் குறிக்கும் infinitive-ஐ இயல்பான தமிழ் துணைவினை அமைப்பில் வழங்குகிறது.
theological_decisions:
- issue: பரிசேயர்களும் சதுசேயர்களும் கேட்டதிலுள்ள பகைமை நோக்கம்
  choice: ‘அவரைச் சோதித்துப் பார்க்கும் நோக்கத்தில்’ என்று மொழிபெயர்த்தல்
  alternative: ‘அவரைச் சிக்கவைக்க முயன்று’ அல்லது ‘அவரைத் தவறிழைக்கத் தூண்டி’
  rationale: வேண்டுகோள் நடுநிலையானது அல்ல என்பதைத் தெரிவிக்கிறது; அதேவேளையில், அவர்களது நோக்கத்தை மூலத்தைவிடத் திட்டவட்டமாக வரையறுக்காமல் அதன் பொருள் நெருக்கடியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘அற்புத அடையாளம்’ என்று விளக்கிச் சேர்க்காமல் மூலத்தின் சுருக்கமும் பொருள் திறப்பும் பாதுகாக்கப்பட்டுள்ளன.
