revisions:
- from: பரலோக அரசாட்சி, ஒரு வயலில் மறைத்து வைக்கப்பட்டிருந்த புதையலைப் போன்றது.[a] அதைக் கண்ட ஒரு மனிதன், அதை மீண்டும் மறைத்துவைத்தான்; மகிழ்ச்சியினால் அவன் போய், தனக்குள்ள எல்லாவற்றையும் விற்று, அந்த வயலை வாங்குகிறான்.[b]
  to: பரலோக அரசாட்சி, ஒரு வயலில் மறைத்து வைக்கப்பட்டிருந்த புதையலைப் போன்றது.[a] அதைக் கண்ட ஒரு மனிதன் அதை மறைத்தான்; அவன் மகிழ்ச்சியின் காரணமாக[b] போய், தனக்குள்ள எல்லாவற்றையும் விற்கிறான்; அந்த வயலை வாங்குகிறான்.
