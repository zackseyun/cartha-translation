source:
  edition: SBLGNT
  text: ⸀Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν θησαυρῷ κεκρυμμένῳ ἐν τῷ ἀγρῷ, ὃν εὑρὼν ἄνθρωπος ἔκρυψεν, καὶ ἀπὸ τῆς χαρᾶς αὐτοῦ ὑπάγει καὶ ⸂πωλεῖ πάντα ὅσα ἔχει⸃ καὶ ἀγοράζει τὸν ἀγρὸν ἐκεῖνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/044.yaml
  text: The kingdom of heaven is like a treasure hidden in a field[a], which a man found and hid[b]; and in his joy he goes and sells all that he has and buys that field.
translation:
  language: ta
  text: பரலோக அரசாட்சி, ஒரு வயலில் மறைத்து வைக்கப்பட்டிருந்த புதையலைப் போன்றது.[a] அதைக் கண்ட ஒரு மனிதன் அதை மறைத்தான்; அவன் மகிழ்ச்சியின் காரணமாக[b] போய், தனக்குள்ள எல்லாவற்றையும் விற்கிறான்; அந்த வயலை வாங்குகிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரலோக அரசாட்சி, வயலில் மறைத்து வைக்கப்பட்டிருந்த புதையலைப் போன்றது.”
    reason: கிரேக்கத்தில் வயலைக் குறிக்கும் பெயர்ச்சொல்லுடன் வரையறைச் சுட்டி இருந்தாலும், இச்சூழலில் அது தமிழில் ‘ஒரு வயல்’ அல்லது ‘வயல்’ என இயல்பாக அமையலாம்.
  - marker: b
    text: அல்லது, “அவன் மகிழ்ச்சியால்.”
    reason: ἀπὸ τῆς χαρᾶς αὐτοῦ அடுத்த செயல்களுக்கு உந்துதலான காரணத்தைத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: Ὁμοία ἐστὶν
  choice: போன்றது
  rationale: உவமைக்கான இயல்பான நவீனத் தமிழ் வடிவம்; இயேசுவின் உவமைத் தொடக்கச் சூத்திரத்தைத் தெளிவாகப் பேணுகிறது.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: பரலோக அரசாட்சி
  rationale: βασιλεία என்பதன் ஆட்சி/அரசுரிமை சார்ந்த இயக்கமுள்ள பொருளை வெளிப்படுத்துகிறது; மத்தேயுவின் ‘பரலோகம்’ என்ற மரியாதைமிகு சொல்லாட்சியையும் பேணுகிறது.
- source_word: θησαυρῷ
  choice: ஒரு புதையலை
  rationale: வயலில் மறைந்திருந்து கண்டெடுக்கப்படும் மதிப்புமிக்க பொருளை ‘புதையல்’ இயல்பாகக் குறிக்கிறது; பெயர்ச்சொல்லின் வரையறையற்ற தன்மையை ‘ஒரு’ வெளிப்படுத்துகிறது.
- source_word: κεκρυμμένῳ ἐν τῷ ἀγρῷ
  choice: ஒரு வயலில் மறைத்து வைக்கப்பட்டிருந்த
  rationale: நிறைவுற்ற இறந்தகாலச் செயப்பாட்டு வினையெச்சம், ஏற்கெனவே மறைக்கப்பட்டு அந்த நிலையில் இருந்ததைச் சுட்டுகிறது; ‘ஒரு வயலில்’ உவமையின் வரையறையற்ற சூழலை இயல்பாக வழங்குகிறது.
- source_word: ὃν εὑρὼν ἄνθρωπος
  choice: அதைக் கண்ட ஒரு மனிதன்
  rationale: புதையலையே சார்புப்பெயர் சுட்டுவதைத் தெளிவுபடுத்தி, ἄνθρωπος என்பதைக் கதையின் ஆண் நபராகத் துல்லியமாக வழங்குகிறது.
- source_word: ἔκρυψεν
  choice: அதை மீண்டும் மறைத்துவைத்தான்
  rationale: சூழலில் புதையல் ஏற்கெனவே மறைந்திருந்ததால், கண்டபின் அவன் அதை மறுபடியும் மறைத்த செயலைத் தமிழில் தெளிவாக்குகிறது; ‘வைத்தான்’ மறைந்த நிலை தொடர்வதையும் உணர்த்துகிறது.
- source_word: ἀπὸ τῆς χαρᾶς αὐτοῦ
  choice: மகிழ்ச்சியினால்
  rationale: அவனுடைய மகிழ்ச்சியே அடுத்த செயற்பாடுகளுக்குக் காரணம் என்ற இயல்பான காரணப் பொருளைப் பேணுகிறது.
- source_word: ὑπάγει
  choice: அவன் போய்
  rationale: விற்பதற்கு அவன் செல்கிறான் என்ற நிகழ்வுத் தொடரை இயல்பான தமிழில் காட்டுகிறது.
- source_word: πωλεῖ πάντα ὅσα ἔχει
  choice: தனக்குள்ள எல்லாவற்றையும் விற்று
  rationale: அவனிடமுள்ள அனைத்தையும் விற்பதன் முழுமையைப் பேணும் இயல்பான தமிழ்.
- source_word: ἀγοράζει τὸν ἀγρὸν ἐκεῖνον
  choice: அந்த வயலை வாங்குகிறான்
  rationale: ἐκεῖνον என்பதன் சுட்டுப் பொருளை ‘அந்த’ எனப் பேணி, மூலத்தின் உயிரோட்டமுள்ள நிகழ்காலக் கதையாடலை ‘வாங்குகிறான்’ என வழங்குகிறது.
theological_decisions:
- issue: βασιλεία என்பதன் பொருள்
  choice: அரசாட்சி
  alternative: ராஜ்யம்
  rationale: இங்கு சொல் இடத்தையோ எல்லையையோ மட்டும் குறிக்காமல் கடவுளின் ஆட்சிச் செயல்பாட்டையும் உள்ளடக்க முடியும். ‘அரசாட்சி’ அந்த இயக்கமுள்ள பொருளைத் திறந்துவைக்கிறது; உவமையின் சரியான அடையாளப்படுத்தலைத் தீர்மானிக்கவில்லை.
- issue: ἄνθρωπος என்பதன் பாலின வெளிப்பாடு
  choice: ஒரு மனிதன்
  alternative: ஒருவர்
  rationale: கிரேக்க உரையின் ஆண்பால் ஒருமை கதாபாத்திரத்தைப் பேணுகிறது; அதேவேளை இயல்பான நவீனத் தமிழாக உள்ளது.
- issue: புதையலை மீண்டும் மறைத்த செயல்
  choice: அதை மீண்டும் மறைத்துவைத்தான்
  alternative: அதை மறைத்தான்
  rationale: மூலத்தில் ‘மீண்டும்’ என்பதற்கான தனிச்சொல் இல்லாவிட்டாலும், ஏற்கெனவே மறைந்திருந்த புதையலைக் கண்டபின் அவன் ἔκρυψεν செய்தான் என்ற நிகழ்வுத் தொடரில் மறுபடியும் மறைத்தல் உட்பொருளாக உள்ளது. இதன் அறநெறி அல்லது சட்டநிலையை மொழிபெயர்ப்பு தீர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில், உவமையின் சுருக்கமும் நிகழ்கால உயிரோட்டமும் பேணப்பட்டுள்ளன. ‘பரலோக அரசாட்சி’ என்பது மரபுச் சொல்லாட்சிக்கும் மூலத்தின் ஆட்சி சார்ந்த பொருளுக்கும் இடையிலான சமநிலையை நோக்குகிறது.
