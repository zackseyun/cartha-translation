source:
  edition: SBLGNT
  text: Τότε ἀφεὶς τοὺς ὄχλους ἦλθεν εἰς τὴν ⸀οἰκίαν. καὶ προσῆλθον αὐτῷ οἱ μαθηταὶ αὐτοῦ λέγοντες· ⸀Διασάφησον ἡμῖν τὴν παραβολὴν τῶν ζιζανίων τοῦ ἀγροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/036.yaml
  text: Then[a], after leaving the crowds, he went into the house. And his disciples came to him, saying, “Explain to us the parable of the weeds of the field.”
translation:
  language: ta
  text: பின்பு அவர் மக்கள் கூட்டங்களை விட்டுவிட்டு வீட்டுக்குள் சென்றார். அவருடைய சீடர்கள் அவரிடம் வந்து, “வயலின் களைகளைப் பற்றிய உவமையை[a] எங்களுக்கு விளக்கிச் சொல்லுங்கள்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வயலின் களைக்கோதுமையைப் பற்றிய உவமை” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல், கோதுமையைப் போலத் தோற்றமளிக்கும் ‘டார்னல்’ என்னும் ஒரு குறிப்பிட்ட களையைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: பின்பு
  rationale: அடுத்த நிகழ்வை அறிமுகப்படுத்தும் காலத்தொடர்பு சொல்லாக இயல்பான நவீனத் தமிழ்.
- source_word: ἀφεὶς τοὺς ὄχλους
  choice: மக்கள் கூட்டங்களை விட்டுவிட்டு
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைத் தெளிவாகக் காட்டுகிறது; ὄχλους என்பதன் பன்மையையும் காக்கிறது.
- source_word: ἦλθεν εἰς τὴν οἰκίαν
  choice: வீட்டுக்குள் சென்றார்
  rationale: வெளியிலிருந்த இடத்திலிருந்து வீட்டின் உள்ளே நகர்ந்ததை இயல்பாக வெளிப்படுத்துகிறது; குறிப்பிட்ட வீடு என்பது சூழலில் தெளிவாக இருப்பதால் தமிழில் கட்டாயமில்லாத சுட்டுச் சொல்லைச் சேர்க்கவில்லை.
- source_word: προσῆλθον αὐτῷ οἱ μαθηταὶ αὐτοῦ
  choice: அவருடைய சீடர்கள் அவரிடம் வந்து
  rationale: அவரை அணுகிய செயலும் சீடர்களின் உறவும் தெளிவாகவும் இயல்பாகவும் வெளிப்படுகின்றன.
- source_word: Διασάφησον ἡμῖν
  choice: எங்களுக்கு விளக்கிச் சொல்லுங்கள்
  rationale: தெளிவாக்கிக் கூறுமாறு கேட்கும் கட்டளையின் பொருளை மரியாதைமிக்க தமிழ் வேண்டுகோள் வடிவில் தருகிறது.
- source_word: τὴν παραβολὴν
  choice: உவமையை
  rationale: நற்செய்தி நூல்களின் சூழலில் παραβολή என்பதற்கான வழக்கமான, புரிந்துகொள்ளக்கூடிய தமிழ் இணை.
- source_word: τῶν ζιζανίων τοῦ ἀγροῦ
  choice: வயலில் உள்ள களைகளைப் பற்றிய
  rationale: கிரேக்க மரபுத்தொடரின் பொருளை இயல்பான தமிழில் தருகிறது; ζιζάνια என்பதின் தாவரவியல் துல்லியத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
