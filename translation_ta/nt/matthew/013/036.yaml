    issue: The footnote describes the weeds as ‘கதிர்போன்ற’ (ear-like).
    rationale: The Greek ζιζάνια does not mean ‘ear-like’; the relevant observation is that darnel may resemble wheat. The note should avoid introducing that inaccurate feature.
  - severity: low
    issue: Footnote anchor is attached to the request verb rather than to ‘களைகள்’.
    rationale: The note is a lexical alternative for ζιζάνια, so attaching it to the translated noun phrase improves anchor precision.
