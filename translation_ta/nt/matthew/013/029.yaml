source:
  edition: SBLGNT
  text: ὁ δέ ⸀φησιν· Οὔ, μήποτε συλλέγοντες τὰ ζιζάνια ἐκριζώσητε ἅμα αὐτοῖς τὸν σῖτον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/029.yaml
  text: But he said[a], ‘No, lest while gathering the weeds you uproot the wheat along with them.’
translation:
  language: ta
  text: ஆனால் அவர், “வேண்டாம்; களைகளைப் பிடுங்கும்போது அவற்றோடு சேர்த்துக் கோதுமையையும் வேரோடு பிடுங்கிவிடக்கூடும்.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “களைகள்” என்பது குறிப்பாக, தொடக்க வளர்ச்சிப் பருவத்தில் கோதுமையைப் போலத் தோன்றக்கூடிய “டார்னெல்” எனப்படும் களையைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: φησιν
  choice: அவர் கூறினார்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தைத் தமிழ் கதைநடைக்கு இயல்பான இறந்தகாலத்தில் வழங்குகிறது.
- source_word: Οὔ
  choice: வேண்டாம்
  rationale: வேலையாட்கள் முன்வைத்த செயலை மறுக்கும் நேரடியான பதிலாக, சூழலில் ‘இல்லை’ என்பதைவிட ‘வேண்டாம்’ இயல்பாக உள்ளது.
- source_word: μήποτε
  choice: பிடுங்கிவிடக்கூடும்
  rationale: விரும்பத்தகாத விளைவு நேரும் சாத்தியத்தை எச்சரிக்கும் கிரேக்கச் சொல்லின் வலிமையை இயல்பான தமிழில் காட்டுகிறது; அது நிச்சயம் நிகழும் என்று தீர்மானிக்கவில்லை.
- source_word: συλλέγοντες
  choice: பிடுங்கும்போது
  rationale: முக்கியச் செயலுடன் ஒரே நேரத்தில் நிகழும் செயலைக் குறிக்கிறது; களைகளைச் சேகரிப்பது இச்சூழலில் அவற்றைப் பிடுங்குவதைக் குறிக்கிறது.
- source_word: ζιζάνια
  choice: களைகள்
  rationale: பொதுவாசகர்களுக்குத் தெளிவான நவீனச் சொல். கோதுமையைப் போன்ற தோற்றமுள்ள குறிப்பிட்ட களையாக இருக்கக்கூடிய விவரம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐκριζώσητε
  choice: வேரோடு பிடுங்கிவிடக்கூடும்
  rationale: வேருடன் அகற்றுதல் என்ற வினையின் துல்லியமான பொருளைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἅμα αὐτοῖς
  choice: அவற்றோடு சேர்த்து
  rationale: களைகளுடன் கோதுமையும் அகற்றப்படும் இணைந்த விளைவைத் தெளிவாகக் காட்டுகிறது.
- source_word: τὸν σῖτον
  choice: கோதுமையையும்
  rationale: இவ்விவசாய உவமையில் பொதுவான ‘தானியம்’ என்பதைக் காட்டிலும் ‘கோதுமை’ என்பதே சூழலுக்குப் பொருத்தமானது.
theological_decisions:
- issue: ζιζάνια என்ற சொல்லின் மொழிபெயர்ப்பு
  choice: களைகள்
  alternative: கோதுமைப் போலி / டார்னெல் களை
  rationale: வசனத்தின் உவமைத் தாக்கத்தைத் தெளிவாக வைத்திருக்க பொதுவான நவீனச் சொல் முதன்மை உரையில் பயன்படுத்தப்படுகிறது; தாவரவியல் சார்ந்த சாத்தியமான குறிப்புத்தன்மை அடிக்குறிப்பில் தரப்படுகிறது.
- issue: μήποτε குறிக்கும் விளைவின் தன்மை
  choice: நேரக்கூடிய அபாயமாக மொழிபெயர்த்தல்
  alternative: உறுதியாக நிகழும் விளைவாக மொழிபெயர்த்தல்
  rationale: கிரேக்கச் சொல் விரும்பத்தகாத சாத்திய விளைவைப் பற்றிய எச்சரிக்கையைத் தருகிறது; அதை உறுதியான நிகழ்வாக மாற்றாமல் ambiguity பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; நேரடியும் கண்ணியமுமான கதைநடை. உரையாடலில் ‘வேண்டாம்’ என்பது சூழலுக்கேற்ற இயல்பான மறுப்பு. கிரேக்க வாக்கியத்தின் எச்சரிக்கைச் சாத்தியம் தமிழில் பாதுகாக்கப்பட்டுள்ளது.
