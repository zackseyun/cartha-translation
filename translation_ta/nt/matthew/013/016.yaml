source:
  edition: SBLGNT
  text: ὑμῶν δὲ μακάριοι οἱ ὀφθαλμοὶ ὅτι βλέπουσιν, καὶ τὰ ὦτα ὑμῶν ὅτι ⸀ἀκούουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/016.yaml
  text: But blessed are your eyes[a], because they see, and your ears, because they hear.
translation:
  language: ta
  text: ஆனால், உங்கள் கண்கள் பேறுபெற்றவை; ஏனெனில் அவை பார்க்கின்றன; உங்கள் காதுகளும் பேறுபெற்றவை; ஏனெனில் அவை கேட்கின்றன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் கண்கள் பார்ப்பதாலும், உங்கள் காதுகள் கேட்பதாலும் பேறுபெற்றவை.” கிரேக்க ὅτι இங்கு காரணத்தைக் குறிக்கிறது; அதை ‘ஏனெனில்’ அல்லது ‘ஏனென்றால்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: கிரேக்க ὅτι-யின் காரணப் பொருளைத் தமிழில் இணை காரணத் தொடராக அமைக்கும் மாற்று வடிவம்.
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனங்களில் பார்க்காமலும் கேட்காமலும் இருப்பவர்களுடன் சீடர்களை வேறுபடுத்திக் காட்டும் எதிர்மறைத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μακάριοι
  choice: பேறுபெற்றவை
  rationale: வெறும் மனநிலை சார்ந்த ‘மகிழ்ச்சி’ என்பதைக் காட்டிலும், கிடைத்துள்ள சிறப்பான பேற்றை வெளிப்படுத்துகிறது; கண்களுக்கும் காதுகளுக்கும் பொருந்தும் இயல்பான தமிழ் வடிவம்.
- source_word: οἱ ὀφθαλμοὶ ὑμῶν
  choice: உங்கள் கண்கள்
  rationale: கிரேக்க உரையின் உடைமைத் தொடர்பை நவீனத் தமிழில் இயல்பாகக் கூறுகிறது.
- source_word: ὅτι βλέπουσιν
  choice: பார்க்கிற
  rationale: 'ὅτι கூறும் காரணத்தைத் தமிழில் இயல்பான பெயரெச்சத் தொடராக வெளிப்படுத்துகிறது: கண்கள் பார்க்கிற காரணத்தால் அவை பேறுபெற்றவை.'
- source_word: τὰ ὦτα ὑμῶν
  choice: உங்கள் காதுகள்
  rationale: கிரேக்க உடைமைத் தொடரின் தெளிவான, இயல்பான தமிழ் வடிவம்.
- source_word: ὅτι ἀκούουσιν
  choice: கேட்கிற
  rationale: காரணத் தொடர்பை இணையான பெயரெச்சத் தொடரில் தருவதோடு, ‘பார்க்கிற’ என்பதுடனான அமைப்புச் சமநிலையையும் காக்கிறது.
- source_word: βλέπουσιν / ἀκούουσιν
  choice: பார்க்கிற / கேட்கிற
  rationale: உரையில் உள்ள எளிய புலனுணர்வு வினைகளை அப்படியே காத்து, அவற்றின் ஆழமான ஆன்மிகப் பொருளைச் சூழல் உணர்த்த அனுமதிக்கிறது.
theological_decisions:
- issue: பார்த்தல், கேட்டல் ஆகியவற்றை வெளிப்படையாக ஆன்மிக உணர்தல் அல்லது புரிந்துகொள்ளுதல் என்று மொழிபெயர்க்க வேண்டுமா?
  choice: ‘பார்க்கிற’, ‘கேட்கிற’ என்ற நேரடியான புலனுணர்வு மொழியைத் தக்கவைத்தல்.
  alternative: ‘உணர்கிற’, ‘புரிந்துகொள்கிற’ என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: சூழல் ஆன்மிகப் புரிதலைச் சுட்டினாலும், இவ்வசனம் கண்கள் பார்ப்பதையும் காதுகள் கேட்பதையுமே கூறுகிறது. நேரடி மொழி இறையியல் பதற்றத்தையும் சூழல் அளிக்கும் விரிவான பொருளையும் காக்கிறது.
- issue: ὅτι என்பதன் காரணப் பொருளை எவ்வாறு வெளிப்படுத்துவது?
  choice: ‘பார்க்கிற ... கண்கள்’, ‘கேட்கிற ... காதுகள்’ என்ற தமிழ் பெயரெச்ச அமைப்பில் காரணத்தை இயல்பாக உட்பொதித்தல்.
  alternative: ‘ஏனெனில் அவை பார்க்கின்றன ... ஏனெனில் அவை கேட்கின்றன’ என்று தனித்த காரணவாக்கியங்களாக அமைத்தல்.
  rationale: இரு வடிவங்களும் காரணப் பொருளைத் தருகின்றன. தேர்ந்தெடுக்கப்பட்ட வடிவம் நவீனத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் இருந்து, இணை அமைப்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையில் இயல்பான, கண்ணியமான நடை. கண்கள்–காதுகள் மற்றும் பார்க்குதல்–கேட்டல் ஆகிய இணை அமைப்பு காக்கப்பட்டுள்ளது.
