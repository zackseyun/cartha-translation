source:
  edition: SBLGNT
  text: οὐχ οὗτός ἐστιν ὁ τοῦ τέκτονος υἱός; ⸀οὐχ ἡ μήτηρ αὐτοῦ λέγεται Μαριὰμ καὶ οἱ ἀδελφοὶ αὐτοῦ Ἰάκωβος καὶ ⸀Ἰωσὴφ καὶ Σίμων καὶ Ἰούδας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/055.yaml
  text: Is this not the carpenter’s son? Is not his mother called Mary[b][a], and his brothers James and Joseph and Simon and Judas?
translation:
  language: ta
  text: “இவர் தச்சரின் மகன் அல்லவா? இவருடைய தாய் மரியாள் என்று அழைக்கப்படுகிறாளும், இவருடைய சகோதரர்கள்[a] யாக்கோபு, யோசேப்பு[b], சீமோன், யூதா ஆகியோரும் அல்லவா?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சகோதரர்கள்’ என்பதற்குப் பதிலாக ‘உறவினர்கள்’ அல்லது ‘நெருங்கிய உறவினர்கள்’ என்றும் பொருள் கொள்ளலாம். கிரேக்கச் சொல் பொதுவாகச் ‘சகோதரர்கள்’ என்றே பொருள்படும்; ஆனால் இச்சூழலில் சிலர் அதை விரிவான குடும்ப உறவைக் குறிப்பதாகப் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
  - marker: b
    text: சில கையெழுத்துப் பிரதிகளில் ‘யோசேப்பு’ என்பதற்குப் பதிலாக ‘யோசே’ என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: τέκτονος
  choice: தச்சரின்
  rationale: τέκτων என்பது மரம் அல்லது கட்டுமானப் பணியில் ஈடுபடும் கைவினைஞரைக் குறிக்கலாம். இச்சூழலில் மரபாகவும் இயல்பாகவும் புரியும் ‘தச்சர்’ பயன்படுத்தப்பட்டது; ‘கட்டுமானக் கைவினைஞர்’ என்பது சாத்தியமான விரிவான பொருள்.
- source_word: υἱός
  choice: மகன்
  rationale: உடனடி குடும்பச் சூழலில் நேரடியான மகன் உறவையே குறிக்கிறது.
- source_word: λέγεται
  choice: என்று அழைக்கப்படுகிறாள்
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவத்தின் ‘is called/is named’ என்ற பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Μαριὰμ
  choice: மரியாள்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவம்.
- source_word: ἀδελφοὶ
  choice: சகோதரர்கள்
  rationale: இச்சொல்லின் வழக்கமான, மேற்பரப்பான பொருள் ‘சகோதரர்கள்’. உறவின் துல்லிய இயல்பைப் பற்றிய பிற்கால இறையியல் விவாதத்தை முதன்மை உரை தீர்மானிக்கவில்லை; விரிவான உறவினர் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: Ἰάκωβος
  choice: யாக்கோபு
  rationale: Ἰάκωβος என்ற பெயருக்கான நிலைபெற்ற தமிழ் புதிய ஏற்பாட்டு வடிவம்.
- source_word: Ἰωσὴφ
  choice: யோசேப்பு
  rationale: SBLGNT முதன்மை வாசகமான Ἰωσήφ என்பதற்கான நிலைபெற்ற தமிழ் வடிவம்; மாற்றுப் பாடம் அடிக்குறிப்பில் பதிவு செய்யப்படுகிறது.
- source_word: Σίμων
  choice: சீமோன்
  rationale: பெயருக்கான நிலைபெற்ற தமிழ் புதிய ஏற்பாட்டு வடிவம்.
- source_word: Ἰούδας
  choice: யூதா
  rationale: Ἰούδας என்ற பெயருக்கான நிலைபெற்ற தமிழ் வடிவம்; இங்கு வேறு நபரைத் தனிப்படுத்தும் நோக்கில் பொருளை மாற்றவில்லை.
- source_word: οὐχ ... ;
  choice: அல்லவா?
  rationale: உறுதிப்படுத்தும் பதிலை எதிர்பார்க்கும் கிரேக்க எதிர்மறை வினாவின் இயல்பையும் சொல்லோட்டத்தையும் தமிழில் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: ἀδελφοὶ αὐτοῦ என்பதன் குடும்ப உறவுப் பொருள்
  choice: முதன்மை உரையில் ‘இவருடைய சகோதரர்கள்’
  alternative: ‘இவருடைய உறவினர்கள்’ அல்லது ‘இவருடைய நெருங்கிய உறவினர்’
  rationale: ἀδελφοί என்பதன் சாதாரண பொருள் ‘சகோதரர்கள்’. இவர்கள் இயேசுவுடன் கொண்டிருந்த உயிரியல் அல்லது விரிவான குடும்ப உறவை மொழிபெயர்ப்பு தானாகத் தீர்மானிக்கக் கூடாது. ஆகவே நேரடிப் பொருள் முதன்மை உரையில் வைக்கப்பட்டு, விரிவான சாத்தியம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகப் புரியும் மரியாதையான நடையில் அமைக்கப்பட்டது. கிரேக்கத்தில் இரு எதிர்மறை வினாக்கள் இருந்தாலும், இரண்டாவது வினாவின் நீண்ட குடும்பப் பட்டியல் தமிழில் தெளிவாக இருக்க மூன்று இணையான வினாக்களாகப் பிரிக்கப்பட்டுள்ளது. ‘இவர்’ என்பது இயல்பான மரியாதைச் சுட்டுப்பெயராகப் பயன்படுத்தப்பட்டது; மூலத்தின் வினாவுரு மற்றும் உறுதிப்படுத்தும் தொனி காக்கப்பட்டுள்ளன.
