id: MAT.13.42
reference: Matthew 13:42
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/042.yaml
  text: and they will throw them into the furnace of fire[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: ta
  text: அவர்களை நெருப்புச் சூளையில் வீசுவார்கள். அங்கே அழுகையும் பற்கடிப்பும் இருக்கும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαλοῦσιν
  choice: வீசுவார்கள்
  rationale: வலுக்கட்டாயமாக எறிதல் அல்லது வீசுதல் என்ற செயற்பாட்டை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; எழுவாய் கிரேக்கத்தைப் போலவே வினைமுற்றில் மறைமுகமாக உள்ளது.
- source_word: αὐτοὺς
  choice: அவர்களை
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட மனிதர்களைக் குறிக்கும் பன்மைச் சுட்டுப்பெயரைத் தெளிவாகத் தொடர்கிறது.
- source_word: κάμινον τοῦ πυρός
  choice: நெருப்புச் சூளை
  rationale: ‘நெருப்பின் சூளை’ என்ற கிரேக்க இனவெச்சக் கட்டமைப்பைச் சொற்சொல்லாகக் கடினப்படுத்தாமல், அதன் தெளிவான நெருப்பு உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: ἐκεῖ
  choice: அங்கே
  rationale: முன்னர் குறிப்பிடப்பட்ட சூளையையே சுட்டும் இடப்பொருளைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: κλαυθμὸς
  choice: அழுகை
  rationale: துயரத்தால் அழுவதைக் குறிக்கும் பெயர்ச்சொல்லின் பொருளை, தேவையற்ற தீவிரப்படுத்தல் இன்றி தெரிவிக்கிறது.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: பற்கடிப்பு
  rationale: மத்தேயுவில் மீண்டும் வரும் நிலையான சொற்றொடரைச் செறிவாகக் காக்கிறது; அது துயரமா, சினமா என்பதை மொழிபெயர்ப்பு தனியாகத் தீர்மானிக்கவில்லை.
- source_word: καὶ
  choice: -உம் … -உம்
  rationale: ‘அழுகையும் பற்கடிப்பும்’ என்ற இணைப்புக் கட்டமைப்பு, கிரேக்க καὶ-ஐ இயல்பான தமிழில் சமமாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘நெருப்புச் சூளை’ என்ற நியாயத்தீர்ப்பு உருவகத்தின் தன்மை
  choice: உருவகத்தை அப்படியே காத்தல்
  alternative: ‘நரகம்’ போன்ற பிற்காலக் கோட்பாட்டுச் சொல்லால் விளக்கிப் பெயர்த்தல்
  rationale: மூலவசனம் தரும் எரியும் சூளை உருவகத்தை மெலிதாக்காமலும் அதன் தன்மையை அளவுக்கு மீறி வரையறுக்காமலும் வைத்திருக்கிறது.
- issue: ‘அழுகையும் பற்கடிப்பும்’ என்பதன் உணர்வுப் பரப்பு
  choice: நிலையான இரட்டைப் பதத்தை விளக்கமின்றிக் காத்தல்
  alternative: பற்கடிப்பை சினம் மட்டுமாகவோ துக்கம் மட்டுமாகவோ வெளிப்படையாகப் பொருள்கொள்ளுதல்
  rationale: இச்சொற்றொடர் கடும் வேதனையையும் நியாயத்தீர்ப்பையும் சுட்டுகிறது; அதன் உணர்வை ஒரே வகையாகச் சுருக்காமல் மூலத்தின் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையில் சுருக்கமாகவும் கண்ணியமாகவும் மொழிபெயர்க்கப்பட்டது. மத்தேயுவின் தீர்ப்புச் சொற்றொடருக்குரிய வலிமை காக்கப்பட்டுள்ளது.
