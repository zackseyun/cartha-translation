    text: அல்லது, “வேலையாட்கள்.” கிரேக்கச் சொல் எஜமானருக்குக் கீழ்ப்பட்ட அடிமைகளையோ பணியாளர்களையோ குறிக்கலாம்.
    reason: lexical_alternative
