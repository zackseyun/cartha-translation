id: MAT.13.28
reference: Matthew 13:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ ἔφη αὐτοῖς· Ἐχθρὸς ἄνθρωπος τοῦτο ἐποίησεν. οἱ δὲ ⸂δοῦλοι αὐτῷ λέγουσιν⸃· Θέλεις οὖν ἀπελθόντες ⸀συλλέξωμεν αὐτά;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/028.yaml
  text: He said to them[a], “An enemy did this.” Then the slaves said to him, “Do you want us to go and gather them up?”
translation:
  language: ta
  text: அவர் அவர்களிடம், “ஒரு பகைவன் இதைச் செய்தான்” என்றார். அதற்கு அடிமைகள்[a] அவரிடம், “அப்படியானால், நாங்கள் போய் அவற்றைச் சேகரிக்க வேண்டுமென்று விரும்புகிறீர்களா?” என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வேலையாட்கள்.” கிரேக்கச் சொல் எஜமானருக்குக் கீழ்ப்பட்ட அடிமைகளையோ பணியாளர்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη
  choice: என்றார்
  rationale: கதை உரையாடலில் இயல்பான, நேரடியான பேச்சுவினை வடிவம்.
- source_word: Ἐχθρὸς ἄνθρωπος
  choice: பகைவன் ஒருவன்
  rationale: ἄνθρωπος எதிரியைத் தனிநபராகச் சுட்டுவதைக் காக்கும் அதேவேளையில், நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: τοῦτο ἐποίησεν
  choice: இதைச் செய்திருக்கிறான்
  rationale: முன்னர் நிகழ்ந்து தற்போது விளைவைக் காட்டும் செயலை உரையாடல் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; கிரேக்க இறந்தகாலச் செயலை மாற்றுவதில்லை.
- source_word: δοῦλοι
  choice: அடிமைகள்
  rationale: எஜமானரின் அதிகாரத்திற்குக் கீழிருந்த இவர்களின் சமூக நிலையையும் சார்பையும் தெளிவாகக் காக்கிறது.
- source_word: Θέλεις
  choice: வேண்டுமா
  rationale: எஜமானரின் விருப்பம் அல்லது அனுமதியைத் தமிழில் இயல்பாகக் கேட்கும் வடிவம்.
- source_word: οὖν
  choice: அப்படியானால்
  rationale: முந்தைய கூற்றிலிருந்து வரும் அடுத்த நடவடிக்கைக்கான முடிவுறுத்தலைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἀπελθόντες
  choice: நாங்கள் போய்
  rationale: சென்று அடுத்த செயலைச் செய்யும் வரிசையை இயல்பான தமிழ் வினையெச்சத் தொடரால் தருகிறது.
- source_word: συλλέξωμεν
  choice: பிடுங்கிச் சேர்க்க
  rationale: களைகளை ஒன்றாகச் சேகரிக்கும் பொருளைக் காக்கிறது; உடனடி சூழலில் அவற்றை அகற்றும் செயலை இயல்பாக உணர்த்துகிறது.
- source_word: αὐτά
  choice: அவற்றை
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட களைகளைக் குறிக்கும் நடுநிலைப் பன்மைப் பதிலிடுபெயரைத் துல்லியமாகத் தொடர்கிறது.
theological_decisions:
- issue: உவமைச் சூழலில் δοῦλοι என்பதன் மொழிபெயர்ப்பு
  choice: அடிமைகள்
  alternative: வேலையாட்கள்
  rationale: சொல் குறிக்கும் கட்டுப்பட்ட, எஜமானருக்குக் கீழ்ப்பட்ட சமூக நிலையை முதன்மை உரையில் காக்கிறது. தமிழில் உவமைச் சூழலுக்குப் பழக்கமான மென்மையான மாற்றாக ‘வேலையாட்கள்’ அடிக்குறிப்பில் தரப்படுகிறது; உவமையின் இறையியல் பொருளை எந்த ஓர் மரபுக்கும் ஏற்ப மாற்றவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட கதைநடை. உரையாடல் இயல்பாக இருக்க ‘அதற்கு’ மற்றும் கேள்வி வடிவம் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் காரணவியல் தொடர்பும் சமூகப் படிநிலையும் காக்கப்பட்டுள்ளன.
