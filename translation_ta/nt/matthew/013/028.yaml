  to: அவர் அவர்களிடம், “ஒரு பகைவன் இதைச் செய்தான்” என்றார். அதற்கு அடிமைகள்[a] அவரிடம், “அப்படியானால், நாங்கள் போய் அவற்றைச் சேகரிக்க வேண்டுமென்று விரும்புகிறீர்களா?” என்று கேட்டார்கள்.
