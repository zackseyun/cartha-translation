id: MAT.13.52
reference: Matthew 13:52
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Διὰ τοῦτο πᾶς γραμματεὺς μαθητευθεὶς ⸂τῇ βασιλείᾳ⸃ τῶν οὐρανῶν ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐκβάλλει ἐκ τοῦ θησαυροῦ αὐτοῦ καινὰ καὶ παλαιά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/052.yaml
  text: Then he said to them[c][b][a], “Therefore every scribe who has been trained for the kingdom of heaven is like a master of a house who brings out of his treasure new things and old.”
translation:
  language: ta
  text: அவர் அவர்களிடம், “இதனால், பரலோக அரசுக்கெனப் பயிற்றுவிக்கப்பட்ட ஒவ்வொரு மறைநூல் அறிஞரும்[a], தன் கருவூலத்திலிருந்து[b] புதியவற்றையும் பழையவற்றையும் வெளியே கொண்டுவரும் வீட்டுத் தலைவரைப்[c] போன்றவர்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பரலோக அரசின் சீடராக்கப்பட்ட ஒவ்வொரு மறைநூல் அறிஞரும்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் செயப்பாட்டு வினையெச்சம் பயிற்றுவிக்கப்படுதல் அல்லது சீடராக்கப்படுதல் ஆகிய இரு பொருள்களையும் தரக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: “கருவூலம்” என்பது மதிப்புமிக்க பொருள்களையோ, அவை வைக்கப்பட்டிருக்கும் சேமிப்பிடத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “வீட்டு எஜமான்” அல்லது “குடும்பத் தலைவர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: ஆகவே
  rationale: முந்தைய உரையாடலிலிருந்து வரும் முடிவை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: πᾶς γραμματεὺς
  choice: ஒவ்வொரு வேத அறிஞரும்
  rationale: γραμματεύς என்பதன் வேத எழுத்துகளிலும் திருச்சட்டத்திலும் தேர்ச்சி பெற்றவர் என்ற சூழல்சார் பொருளை, இன்றைய வாசகருக்குப் புரியும் வகையில் தருகிறது; வெறும் நகலெழுத்தர் என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: μαθητευθεὶς τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: பரலோக அரசுக்காகப் பயிற்றுவிக்கப்பட்ட
  rationale: செயப்பாட்டு வினையெச்சத்தின் உருவாக்கும்/பயிற்றுவிக்கும் தன்மையையும், அசாதாரணமான வேற்றுமைத் தொடர்பின் ‘அரசை நோக்கிய’ பொருளையும் பாதுகாக்கிறது; சீடராக்கப்பட்டவர் என்ற சாத்தியத்தை அடிக்குறிப்பில் தருகிறது.
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: வீட்டுத் தலைவர்
  rationale: வீட்டையும் குடும்ப நிர்வாகத்தையும் வழிநடத்தும் நபரை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: ἐκβάλλει
  choice: வெளியே கொண்டுவரும்
  rationale: இங்கு வலுக்கட்டாயமாக எறிதல் அல்ல, சேமிப்பிலிருந்து எடுத்து வெளிக்கொணர்தல் என்பதே சூழலுக்குப் பொருத்தம்.
- source_word: ἐκ τοῦ θησαυροῦ αὐτοῦ
  choice: தன் கருவூலத்திலிருந்து
  rationale: θησαυρός என்பதில் உள்ள மதிப்புமிக்க சேமிப்பு மற்றும் சேமிப்பிடம் ஆகிய இரு நிழற்பொருள்களையும் ‘கருவூலம்’ தக்கவைக்கிறது.
- source_word: καινὰ καὶ παλαιά
  choice: புதியவற்றையும் பழையவற்றையும்
  rationale: கிரேக்கத்தின் வரிசையையும், பெயர்ச்சொல் வெளிப்படையாக இல்லாத நடுநிலைப் பன்மை வடிவத்தையும் தமிழில் இயல்பாகப் பிரதிபலிக்கிறது.
theological_decisions:
- issue: μαθητευθεὶς என்பதன் பொருள் மற்றும் பரலோக அரசுடனான தொடர்பு
  choice: பரலோக அரசுக்காகப் பயிற்றுவிக்கப்பட்ட வேத அறிஞர்
  alternative: பரலோக அரசின் சீடராக்கப்பட்ட வேத அறிஞர்
  rationale: பயிற்சி மற்றும் சீடத்துவம் ஆகிய இரண்டிற்கும் இடமளிக்கும் கிரேக்கச் சொல்லை, மதமாற்றம் அல்லது முறையான சட்டக்கல்வி என்ற ஒரே பொருளுக்குள் சுருக்காமல் வழங்குகிறது.
- issue: οἰκοδεσπότης உருவகத்தின் சமூகப் பங்கு
  choice: வீட்டுத் தலைவர்
  alternative: வீட்டு எஜமான் / குடும்பத் தலைவர்
  rationale: வீட்டின்மேல் பொறுப்பும் அதிகாரமும் உள்ள நபர் என்ற உருவகத்தைத் தக்கவைத்து, தேவையற்ற கோட்பாட்டு அல்லது சமூக முடிவுகளைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன, தெளிவான, மரியாதைமிக்க பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘வேத அறிஞர்’ என்பது γραμματεύς என்பதன் சூழல்சார் பணியை வெளிப்படுத்துகிறது; ‘பரலோக அரசு’ மத்தேயுவின் βασιλεία τῶν οὐρανῶν என்ற வழக்கை ஆட்சியைக் குறிக்கும் உயிருள்ள சொல்லாக்கமாக வழங்குகிறது.
