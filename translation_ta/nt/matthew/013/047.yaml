  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν σαγήνῃ βληθείσῃ εἰς τὴν θάλασσαν καὶ ἐκ παντὸς γένους συναγαγούσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/047.yaml
  text: Again[b][a], the kingdom of heaven is like a dragnet cast into the sea and gathering from every kind.
translation:
  language: ta
  text: மீண்டும், பரலோக அரசாட்சி கடலில் வீசப்பட்டு, எல்லா வகையிலிருந்தும் மீன்களைத் திரட்டுகிற இழுவலைக்கு ஒப்பானது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இழுவலை’ என்பது நீரில் விரித்து அல்லது இழுத்துச் செல்லப்படும் பெரிய வலை. கிரேக்கத்தில் ‘மீன்கள்’ என்பது வெளிப்படையாக இல்லை; மீன்பிடி உருவகத்திலிருந்து அது புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: மேலும்
  rationale: தொடர்ந்து சொல்லப்படும் இன்னொரு உவமையை அறிமுகப்படுத்துகிறது; நவீன தமிழில் இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: ὁμοία ἐστὶν
  choice: ஒப்பாயிருக்கிறது
  rationale: ஒப்புமையைத் தெளிவாகத் தக்கவைத்து, தமிழில் கண்ணியமான இயல்பான வடிவை அளிக்கிறது.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: பரலோக அரசாட்சி
  rationale: மத்தேயுவின் தனித்துவமான ‘வானங்களின் அரசாட்சி’ என்ற சொல்லாட்சியை, இடத்தைக் காட்டுவதாக மட்டும் தவறாகப் புரிந்துகொள்ளாமல், ஆட்சி என்ற இயக்கமுள்ள பொருளுடன் இயல்பான தமிழில் தருகிறது.
- source_word: σαγήνῃ
  choice: இழுவலை
  rationale: பொதுவான ‘வலை’ என்பதைக் காட்டிலும், நீரில் இழுத்துச் செல்லப்படும் பெரிய வலையைக் குறிப்பாகச் சுட்டுகிறது.
- source_word: βληθείσῃ εἰς τὴν θάλασσαν
  choice: கடலில் வீசப்பட்டு
  rationale: செயப்பாட்டு இறந்தகாலப் பங்கேற்பையும் ‘கடல்’ என்ற மூலச்சொல்லையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ἐκ παντὸς γένους συναγαγούσῃ
  choice: எல்லா வகையிலிருந்தும் மீன்களைத் திரட்டிய
  rationale: ἐκ என்பதின் ‘ஒவ்வொரு வகையிலிருந்தும்’ என்ற நுணுக்கத்தைப் பாதுகாக்கிறது; மீன்பிடி உருவகத்தில் மறைமுகமாக உள்ள ‘மீன்கள்’ என்பதைக் தமிழ் தெளிவுக்காக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἡ βασιλεία τῶν οὐρανῶν என்பதன் பொருள்
  choice: பரலோக அரசாட்சி
  alternative: பரலோக ராஜ்யம் / கடவுளின் அரசாட்சி
  rationale: மத்தேயுவின் ‘பரலோகம்’ என்ற தனிச்சொல்லாட்சியை மாற்றாமல் வைத்துக்கொண்டு, βασιλεία என்பதன் ஆட்சி சார்ந்த பொருளை வெளிப்படுத்துகிறது; இதை ‘கடவுளின் அரசாட்சி’ என்று அமைதியாக மாற்றவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடை. ‘ராஜ்யம்’ என்பதற்குப் பதிலாக ‘அரசாட்சி’ பயன்படுத்தப்பட்டு ஆட்சியின் பொருள் தெளிவாக்கப்பட்டுள்ளது; தொழில்நுட்பமான σαγήνη என்பதற்கு ‘இழுவலை’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
