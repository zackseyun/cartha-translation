source:
  edition: SBLGNT
  text: παντὸς ἀκούοντος τὸν λόγον τῆς βασιλείας καὶ μὴ συνιέντος, ἔρχεται ὁ πονηρὸς καὶ ἁρπάζει τὸ ἐσπαρμένον ἐν τῇ καρδίᾳ αὐτοῦ· οὗτός ἐστιν ὁ παρὰ τὴν ὁδὸν σπαρείς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/019.yaml
  text: When anyone hears the word of the kingdom and does not understand it[a], the evil one comes and snatches away what has been sown in his heart[b]. This is the one sown beside the road.
translation:
  language: ta
  text: ஒருவர் அரசாட்சியின் செய்தியைக் கேட்டு, அதைப் புரிந்துகொள்ளாதபோது, தீயவன் வந்து அவரது இதயத்தில் விதைக்கப்பட்டதைப் பறித்துக்கொள்கிறான். இவரே வழியோரத்தில் விதைக்கப்பட்டவர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: ‘பாதையருகே விதைக்கப்பட்டவர்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: παντὸς ἀκούοντος
  choice: ஒருவர் ... கேட்டும்
  rationale: கிரேக்கத்தின் பொதுப்படையான, பகிர்ந்தளிக்கும் பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; அடுத்து வரும் μὴ συνιέντος உடன் இணைவதால் ‘கேட்டும்’ பொருத்தமாகும்.
- source_word: λόγον τῆς βασιλείας
  choice: அரசாட்சியைப் பற்றிய செய்தி
  rationale: λόγος இங்கு அறிவிக்கப்படும் செய்தியைக் குறிக்கிறது. ‘அரசாட்சியின் வார்த்தை’ என்பது தமிழில் தெளிவற்றதாக இருக்கக்கூடும்; உறவுநிலைச் சொற்றொடரின் பொருளை ‘பற்றிய’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μὴ συνιέντος
  choice: அதைப் புரிந்துகொள்ளாதபோது
  rationale: συνίημι என்பதன் புரிந்துகொள்வது என்ற பொருளை நேரடியாகக் கொடுக்கிறது; ‘அதை’ என்பது முந்தைய செய்தியைக் குறிக்கிறது.
- source_word: ὁ πονηρὸς
  choice: தீயவன்
  rationale: கட்டுரையுடன் வரும் பெயரடை இச்சூழலில் தனிப்பட்ட தீய முகவரைக் குறிக்கிறது; ‘தீயவன்’ அவனை மேலும் அடையாளப்படுத்தாமல் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ἁρπάζει
  choice: பறித்துக்கொள்கிறான்
  rationale: திடீரெனவும் வலுக்கட்டாயமாகவும் அகற்றும் செயலைத் தமிழில் உயிரோட்டமாக வெளிப்படுத்துகிறது.
- source_word: τὸ ἐσπαρμένον
  choice: விதைக்கப்பட்டதை
  rationale: நிறைவு நிலையிலுள்ள இறந்தகாலச் செயப்பாட்டு எச்சத்தின் பெயர்ச்சொல் பயன்பாட்டைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: அவரது இதயத்தில்
  rationale: ‘இதயம்’ என்ற வேதாகம மனிதவியல் உருவகத்தை விளக்கவுரை இன்றி காக்கிறது. தொடக்கத்தில் வரும் பொதுப்படையான ‘ஒருவர்’ என்பதோடு தமிழில் மரியாதையான ஒருமை இயல்பாக ஒத்திசைகிறது.
- source_word: ὁ παρὰ τὴν ὁδὸν σπαρείς
  choice: வழியோரத்தில் விதைக்கப்பட்டவர்
  rationale: விதை, நிலம், கேட்பவர் ஆகியவற்றை இயேசு உருவகமாக ஒன்றுடன் ஒன்று அடையாளப்படுத்தும் கிரேக்க வாக்கியத்தின் பதற்றத்தைத் தீர்க்காமல் காக்கிறது; παρά + accusative இங்கு ‘வழியோரத்தில்’ என இயல்பாக வருகிறது.
theological_decisions:
- issue: ὁ πονηρὸς என்பவரின் அடையாளம்
  choice: தனிப்பட்ட தீய முகவர் (‘தீயவன்’)
  alternative: அருவமான ‘தீமை’
  rationale: வந்து, விதைக்கப்பட்டதைப் பறிக்கும் செயல்களின் எழுவாய் தனிப்பட்ட முகவராகச் சித்தரிக்கப்படுகிறது. ‘சாத்தான்’ என்று உரையில் இல்லாத அடையாளத்தைச் சேர்க்காமல் இதை பாதுகாக்கிறது.
- issue: விதைக்கப்பட்டது விதையா அல்லது மனிதரா என்ற உருவக அடையாளம்
  choice: ‘வழியோரத்தில் விதைக்கப்பட்டவர்’ என்று மனிதரைக் குறிக்கும் கிரேக்க வடிவத்தைப் பாதுகாத்தல்
  alternative: ‘வழியோரத்தில் விதைக்கப்பட்ட விதை இவரைக் குறிக்கிறது’ என்று விளக்கமாக்குதல்
  rationale: οὗτός மற்றும் ஆண்பால் சுட்டுச் சொல் வடிவமான σπαρείς கேட்பவரை விதைக்கப்பட்டவராக அடையாளப்படுத்துகின்றன. உருவகத்தின் இயல்பான பதற்றத்தை மொழிபெயர்ப்பு தீர்த்துவிடக் கூடாது.
- issue: αὐτοῦ இன் பாலினமும் எண்ணும்
  choice: ‘அவரது இதயத்தில்’ என்ற ஒருமை மனிதக் குறிப்பு
  alternative: ‘அவர்களுடைய இதயத்தில்’ அல்லது ‘அந்த இதயத்தில்’
  rationale: கிரேக்க ஒருமையைத் தக்கவைத்து, நவீன தமிழில் பொதுப்படையான மனிதரைக் குறிப்பிடும் மரியாதை ஒருமையைப் பயன்படுத்துகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. ‘அரசாட்சி’ என்பது βασιλεία-வின் ஆட்சி/அதிகார மையப் பொருளைக் காக்கிறது. ‘வழியோரத்தில்’ என்பது கிராமிய விதைப்பு உருவகத்தில் இயல்பானது. அடிக்குறிப்பு குறியீடு அது சார்ந்த இறுதி சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
