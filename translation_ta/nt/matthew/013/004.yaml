source:
  edition: SBLGNT
  text: καὶ ἐν τῷ σπείρειν αὐτὸν ἃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ ⸂ἐλθόντα τὰ πετεινὰ⸃ κατέφαγεν αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/004.yaml
  text: And as he was sowing[a], some seeds fell beside the path, and the birds came and devoured them.
translation:
  language: ta
  text: அவன் விதைத்துக்கொண்டிருந்தபோது, சில விதைகள் பாதையின் ஓரத்தில் விழுந்தன[a]; பறவைகள் வந்து அவற்றைத் தின்றுவிட்டன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்க மூலத்தில் சொற்சொல்லாக, ‘சில பொருட்கள் பாதையின் ஓரத்தில் விழுந்தன’ என்று உள்ளது; விதைப்பவனைப் பற்றிய சூழலிலிருந்து ‘விதைகள்’ என்பது சேர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ σπείρειν αὐτὸν
  choice: அவன் விதைத்துக்கொண்டிருந்தபோது
  rationale: ἐν உடன் வரும் articular infinitive ஒரே நேரத்தில் நிகழும் செயலைக் குறிக்கிறது; இத்தமிழாக்கம் அந்தக் காலத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἃ μὲν
  choice: சில விதைகள்
  rationale: மூலத்தில் நடுநிலைப் பன்மையாக ‘சில பொருட்கள்’ என்று இருந்தாலும், விதைப்பவனின் சூழலில் குறிக்கப்பட்ட பெயர்ச்சொல் ‘விதைகள்’ என்பதால் தெளிவுக்காக வழங்கப்பட்டுள்ளது.
- source_word: ἔπεσεν
  choice: விழுந்தன
  rationale: Aorist narrative நிகழ்வை எளிய இறந்தகாலமாகத் தருகிறது; ‘விதைகள்’ என்பதற்கேற்ப தமிழில் பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: παρὰ τὴν ὁδόν
  choice: பாதையின் ஓரத்தில்
  rationale: παρά + accusative இங்கு பாதைக்கு அருகிலுள்ள இடத்தைக் குறிக்கிறது; வேளாண்மைச் சூழலில் ‘பாதை’ இயல்பானது, ‘ஓரத்தில்’ அருகாமை மற்றும் எல்லைப் பகுதியைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐλθόντα τὰ πετεινὰ
  choice: பறவைகள் வந்து
  rationale: Aorist participle தொடர்ச்சியாக நிகழ்ந்த செயலைத் தமிழில் இயல்பான வினையெச்சமாகக் காட்டுகிறது; மூலத்தில் இல்லாத ‘வானத்துப்’ போன்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: κατέφαγεν
  choice: விழுங்கிவிட்டன
  rationale: κατεσθίω முழுமையாக உண்டுவிடுதல் அல்லது அழித்துவிடும் அளவுக்கு உண்ணுதல் என்ற வலிமையைக் கொண்டது; ‘விழுங்கிவிட்டன’ அந்த நிறைவுத்தன்மையை இயல்பான தமிழில் தருகிறது.
- source_word: αὐτά
  choice: அவற்றை
  rationale: இது விழுந்த விதைகளைச் சுட்டுகிறது; தமிழில் ‘அவற்றை’ தெளிவாகவும் மீளுரையைத் தவிர்ப்பதாகவும் உள்ளது.
