id: MAT.13.57
reference: Matthew 13:57
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐσκανδαλίζοντο ἐν αὐτῷ. ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐκ ἔστιν προφήτης ἄτιμος εἰ μὴ ἐν τῇ ⸀πατρίδι καὶ ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/057.yaml
  text: And they took offense at him[a]. But Jesus said to them[c][b], “A prophet is not without honor except in his hometown and in his own household.”
translation:
  language: ta
  text: அவரைக் கண்டு அவர்கள் இடறலடைந்தார்கள்[a]. ஆனால் இயேசு அவர்களிடம், “தன் சொந்த ஊரிலும்[b] தன் வீட்டாரிடையிலும்[c] தவிர, ஒரு தீர்க்கதரிசி மதிப்பு பெறாதவராக இருப்பதில்லை” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரால் மனம் புண்பட்டார்கள்”; சொல்லுக்குச் சொல், “அவரில் இடறினார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பிறந்த இடம்” அல்லது “தாய்நாடு.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “தன் வீட்டில்.” கிரேக்கச் சொல் வீட்டைக் கட்டிடமாகவோ, வீட்டார் அல்லது குடும்ப வட்டமாகவோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: அவர்கள் அவரைக் குறித்து மனத்தடை அடைந்தார்கள்
  rationale: இங்கு சொல் நேரடியாகக் கால் இடறுவதைக் குறிக்காமல், இயேசுவை ஏற்றுக்கொள்வதற்கு அவரே தடையாகத் தோன்றியதால் உண்டான எதிர்மறையான மனப்பதிலைச் சுட்டுகிறது. ‘மனத்தடை அடைந்தார்கள்’ என்பது அந்த உருவகத்தின் தடைக் கருத்தையும் சூழலின் உறவு சார்ந்த பொருளையும் காக்கிறது.
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: ஆனால் இயேசு அவர்களிடம் ... என்றார்
  rationale: δέ அவர்களுடைய எதிர்மறையான பதிலிலிருந்து இயேசுவின் மறுமொழிக்குச் செல்லும் மெல்லிய முரண்பாட்டைக் குறிக்கிறது; எனவே ‘ஆனால்’ பொருத்தமானது.
- source_word: προφήτης
  choice: தீர்க்கதரிசி
  rationale: தமிழ் வேதாகம வழக்கிலும் பொதுக் கிறிஸ்தவப் பயன்பாட்டிலும் அறியப்பட்ட, நேரடியான இணைச்சொல்.
- source_word: ἄτιμος
  choice: மதிப்பில்லாதவர்
  rationale: இச்சொல் அவமதிக்கப்படுதல் மட்டுமல்லாமல் மதிப்பு அல்லது கனம் பெறாமையையும் குறிக்கிறது. பழமொழியின் மதிப்பு–மதிப்பின்மை எதிர்வினையை இச்சொல் காக்கிறது.
- source_word: εἰ μὴ
  choice: தவிர
  rationale: இந்த விதிவிலக்குக் கட்டமைப்பை இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: πατρίδι
  choice: தன் சொந்த ஊர்
  rationale: கதைச்சூழலில் இது பரந்த தாய்நாட்டைக் காட்டிலும் ஒருவர் வளர்ந்த அல்லது பிறந்த சொந்த இடத்தைக் குறிக்கிறது.
- source_word: οἰκίᾳ αὐτοῦ
  choice: தன் வீட்டார்
  rationale: οἰκία என்பது வீடு என்ற கட்டிடத்தையோ வீட்டார் அல்லது குடும்ப வட்டத்தையோ குறிக்கலாம். இப்பழமொழியின் சமூகச் சூழலில் ‘வீட்டார்’ இயல்பாக இருந்தாலும், மூலத்தின் இருபொருள் வாய்ப்பைக் குறிப்பில் பதிவு செய்கிறது.
theological_decisions:
- issue: இயேசுவின் பழமொழியில் நிராகரிப்பின் பரப்பு
  choice: ஒரு தீர்க்கதரிசி தன் சொந்தச் சூழலில் மதிப்புப் பெறாததைப் பற்றிய பொதுப் பழமொழியாகவே மொழிபெயர்க்கப்பட்டது.
  alternative: இயேசுவின் குடும்பத்தாருடைய அவநம்பிக்கையை மட்டும் வெளிப்படையாக வலியுறுத்தும் விளக்க மொழிபெயர்ப்பு.
  rationale: கிரேக்க உரை இயேசு அந்நிகழ்வுக்குப் பொருத்திய ஒரு பழமொழியைத் தருகிறது. அது கூறுவதைத் தாண்டி குறிப்பிட்ட கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல், உள்ளூர் நிராகரிப்பையும் மதிப்பு சார்ந்த பதற்றத்தையும் மொழிபெயர்ப்பு காக்க வேண்டும்.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் பழமொழிக்குரிய செறிவும் காக்கப்பட்டுள்ளன. கிரேக்கத்தின் மறுப்பு–விதிவிலக்குக் கட்டமைப்பு இயல்பான தமிழில் ‘தவிர, வேறெங்கும் ... இருப்பதில்லை’ எனத் தக்கவைக்கப்பட்டுள்ளது; அர்த்தத்தை எளிமைப்படுத்தி ‘மட்டுமே மதிக்கப்படுவதில்லை’ என்று மாற்றவில்லை.
