source:
  edition: SBLGNT
  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/050.yaml
  text: and they will throw them into the furnace of fire[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: ta
  text: அவர்களை நெருப்பு உலைக்குள்[a] எறிவார்கள். அங்கே அழுகையும் பற்களைக் கடித்தலும் இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: ‘நெருப்பின் உலை.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: βαλοῦσιν
  choice: எறிவார்கள்
  rationale: βάλλω என்பதன் எதிர்காலச் செயப்பாட்டு வடிவம் வலுக்கட்டாயமாக எறிதல் அல்லது வீசுதல் என்ற பொருளைத் தருகிறது; ‘எறிவார்கள்’ என்பது இயல்பான நவீனத் தமிழில் அந்த வலிமையைப் பாதுகாக்கிறது.
- source_word: αὐτοὺς
  choice: அவர்களை
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட தீயவர்களைக் குறிக்கும் ஆண்பால் பன்மை வேற்றுமைச் சுட்டுப்பெயர்; தமிழில் மனிதர்களைக் குறிக்கும் இயல்பான வடிவம் ‘அவர்களை’.
- source_word: κάμινον τοῦ πυρός
  choice: நெருப்பு உலை
  rationale: சொல்லுக்கு சொல் அமைப்பு ‘நெருப்பின் உலை’ என்றாலும், ‘நெருப்பு உலை’ என்பது கிரேக்கச் சொல்லாட்சியின் தெளிவான தீ-உலை உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: ἐκεῖ
  choice: அங்கே
  rationale: இடத்தை வலியுறுத்தும் வினையடை; ‘அங்கே’ என்பது சுருக்கமாகவும் இயல்பாகவும் அந்த இடச்சுட்டைத் தக்கவைக்கிறது.
- source_word: ἔσται
  choice: இருக்கும்
  rationale: εἰμί என்பதன் எதிர்கால வடிவத்தையும் அதைத் தொடர்ந்து வரும் நிகழ்வுகளின் இருப்பையும் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: ὁ κλαυθμὸς
  choice: அழுகை
  rationale: துயரத்தால் அழுதல் என்ற பொருளை நேரடியாகத் தருகிறது; ‘புலம்பல்’ என மிகைப்படுத்தாமல் மூலத்தின் பரப்பைத் தக்கவைக்கிறது.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: பற்கடிப்பு
  rationale: பற்களை நறநறவென்று கடித்தல் அல்லது அரைத்தல் என்ற மத்தேயுவின் நிலையான நியாயத்தீர்ப்பு சொல்லாட்சியைச் சுருக்கமான, புரிந்துகொள்ளத்தக்க தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இறுதிக்கால நியாயத்தீர்ப்பின் உருவகங்களை மொழிபெயர்த்தல்
  choice: ‘நெருப்பு உலை’, ‘அழுகை’, ‘பற்கடிப்பு’ ஆகிய நேரடியான உருவகங்களை மென்மைப்படுத்தாமல் தக்கவைத்தல்
  alternative: ‘தீப்பற்றி எரியும் உலை’ என்று விளக்கமாக்குதல் அல்லது ‘அவர்கள் வேதனையில் அழுது பற்களை அரைப்பார்கள்’ என்று பொருள்விரித்தல்
  rationale: வசனம் கடுமையான நியாயத்தீர்ப்பு உருவகங்களை முன்வைக்கிறது. அவற்றின் இறையியல் விளைவுகளை மொழிபெயர்ப்பிலேயே தீர்மானிக்காமலும் தீவிரத்தைத் தணிக்காமலும், மூலத்தின் திட்டவட்டமான படிமங்களைப் பாதுகாப்பது பொருத்தமானது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான மற்றும் செறிவான நடை பயன்படுத்தப்பட்டுள்ளது. மத்தேயுவில் மீண்டும் வரும் நியாயத்தீர்ப்பு சொல்லாட்சியின் ஒத்திசைவு பாதுகாக்கப்பட்டுள்ளது.
