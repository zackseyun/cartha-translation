  terminology: ‘விதைகள்,’ ‘நல்ல மண்,’ ‘விளைச்சல்,’ மற்றும் ‘மடங்காகவும்’ ஆகிய சொற்கள் பொருத்தமானவை. இவ்வசனத்தில் தனித்துவமான இறையியல் சொல்லாட்சி அல்லது பிரிவுசார்ந்த விளக்கத் தேர்வு எதுவும் இல்லை.
