  source_fidelity: மூலத்தின் எதிர்மறை இணைப்பு (δὲ), விதை விழுதல் (ἔπεσεν), வேளாண்மைச் சூழலிலான ‘நல்ல மண்,’ விளைச்சல் தருதல், மற்றும் நூறு/அறுபது/முப்பது என்ற பகிர்வான விளைச்சல் அளவுகள் அனைத்தும் நம்பகமாகத் தரப்பட்டுள்ளன. ‘மற்ற விதைகள்’ மற்றும் பன்மை வினைகள் தமிழில் இயல்பானவை; கிரேக்கத்தின் நடுநிலைப் பன்மைச் சுட்டலின் சூழல்பொருளையும் பாதுகாக்கின்றன.
