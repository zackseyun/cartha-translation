id: MAT.13.8
reference: Matthew 13:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὴν γῆν τὴν καλὴν καὶ ἐδίδου καρπόν, ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/008.yaml
  text: But other seed fell on the good soil and was producing fruit—one a hundredfold, another sixty, and another thirty.
translation:
  language: ta
  text: ஆனால் மற்ற விதைகள் நல்ல மண்ணில் விழுந்து விளைச்சல் கொடுத்தன—சில நூறு மடங்காகவும், சில அறுபது மடங்காகவும், சில முப்பது மடங்காகவும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλα
  choice: மற்ற விதைகள்
  rationale: நடுநிலைப் பன்மை பெயரடையான ἄλλα, உவமையின் சூழலில் முன்பு குறிப்பிடப்பட்ட விதைகளைச் சுட்டுகிறது; தமிழில் பொருள் தெளிவாக இருக்க ‘விதைகள்’ சேர்க்கப்படுகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய நிலங்களில் ஏற்பட்ட பயனற்ற முடிவுகளுக்கு மாறான விளைவை இது அறிமுகப்படுத்துவதால், எதிர்மறைத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἔπεσεν
  choice: விழுந்து
  rationale: கிரேக்க வினையின் நேரடிப் பொருளான ‘விழுதல்’ என்பதையும் விதைப்பு உருவகத்தையும் பாதுகாக்கிறது.
- source_word: ἐπὶ τὴν γῆν τὴν καλὴν
  choice: நல்ல மண்ணில்
  rationale: வேளாண்மைச் சூழலில் γῆ என்பதற்கு ‘மண்’ இயல்பானது; καλὴν இங்கு வளமான, பயிருக்கு ஏற்ற தன்மையைக் குறிக்கிறது.
- source_word: ἐδίδου καρπόν
  choice: விளைச்சல் கொடுத்தன
  rationale: வேளாண்மைச் சூழலில் καρπός என்பதன் விளைவை இயல்பான தமிழில் ‘விளைச்சல்’ எனத் தருகிறது. கிரேக்க இறந்தகாலத் தொடர்நிலை வடிவத்தின் நீடித்த அல்லது நிகழ்ந்துவரும் தன்மை, வாக்கியச் சூழலில் விளைச்சல் உருவான செயலாக வெளிப்படுகிறது.
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: சில நூறு மடங்காகவும், சில அறுபது மடங்காகவும், சில முப்பது மடங்காகவும்
  rationale: பகிர்ந்துரைக்கும் கிரேக்க அமைப்பை இயல்பான தமிழில் ‘சில... சில... சில...’ எனக் காட்டுகிறது; எண்ணிக்கைகள் விதையின் பெருக்கமான விளைச்சலைக் குறிப்பதால் ‘மடங்காக’ ஒவ்வொன்றுடனும் தெளிவுபடுத்தப்படுகிறது.
