  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀Συνήκατε ταῦτα πάντα; λέγουσιν αὐτῷ· ⸀Ναί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/051.yaml
  text: Have you understood all these things? They said to him[a], “Yes.”
translation:
  language: ta
  text: “இவை அனைத்தையும் புரிந்துகொண்டீர்களா?”[a] அவர்கள் அவரிடம், “ஆம்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவை அனைத்தும் உங்களுக்குப் புரிகிறதா?”
    reason: Συνήκατε என்பதன் இறந்தகால வடிவம் நிறைவுற்ற புரிதலை முன்னிறுத்தினாலும், சூழலில் நிகழ்காலப் பொருளில் இயல்பாகப் புரிந்துகொள்ளவும் முடியும்.
lexical_decisions:
- source_word: Συνήκατε
  choice: புரிந்துகொண்டீர்களா
  rationale: 'இறந்தகால வினை வடிவத்தின் நிறைவுற்ற நோக்கை இயல்பான தமிழில் காட்டுகிறது: இதுவரை கூறப்பட்டவற்றை அவர்கள் புரிந்துகொண்டார்களா என்பதே கேள்வி. நிகழ்காலப் பொருளும் சாத்தியம் என்பதால் அது அடிக்குறிப்பில் தரப்படுகிறது.'
- source_word: ταῦτα πάντα
  choice: இவை அனைத்தையும்
  rationale: நடுநிலைப் பன்மை சுட்டுப்பெயரும் ‘அனைத்தும்’ என்ற முழுமைக் கருத்தும் வெளிப்படையாகப் பாதுகாக்கப்படுகின்றன; இது முன்பு கூறப்பட்ட உவமைகளையும் போதனைகளையும் குறிக்கிறது.
- source_word: λέγουσιν αὐτῷ
  choice: அவர்கள் அவரிடம் … என்றார்கள்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டாலும், தமிழ் கதைநடையில் இறந்தகாலம் இயல்பாக உள்ளது. αὐτῷ என்பதன் பொருள் ‘அவரிடம்’ என்று தக்கவைக்கப்படுகிறது.
- source_word: Ναί
  choice: ஆம்
  rationale: மூலத்தில் உள்ள எளிய உறுதிப்படுத்தும் பதிலை மட்டும் வழங்குகிறது; மூலத்தில் இல்லாத மரியாதைப் பட்டம் எதுவும் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: சீடர்களின் பதிலுடன் மரியாதைப் பட்டத்தைச் சேர்ப்பதா
  choice: “ஆம்” என்ற எளிய பதிலை மட்டும் வைத்தல்
  alternative: “ஆம், ஆண்டவரே”
  rationale: கிரேக்க மூலத்தில் ναί என்ற உறுதிப்படுத்தும் சொல் மட்டுமே உள்ளது. ஆகவே, மொழிபெயர்ப்பு மரபிலிருந்து வந்திருக்கக்கூடிய பக்திசார் அல்லது இறையியல் விரிவாக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நேரடியான நடை பயன்படுத்தப்பட்டுள்ளது. கேள்வியின் பன்மை முகவரி ‘புரிந்துகொண்டீர்களா’ என்பதில் தெளிவாக உள்ளது; பதிலில் மூலத்தில் இல்லாத ‘ஆண்டவரே’ சேர்க்கப்படவில்லை.
