source:
  edition: SBLGNT
  text: Ταῦτα πάντα ἐλάλησεν ὁ Ἰησοῦς ἐν παραβολαῖς τοῖς ὄχλοις, καὶ χωρὶς παραβολῆς ⸀οὐδὲν ἐλάλει αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/034.yaml
  text: Jesus spoke all these things to the crowds in parables[a], and apart from a parable he said nothing to them.
translation:
  language: ta
  text: இயேசு இவையனைத்தையும் மக்கள் கூட்டங்களிடம் உவமைகள் மூலம் பேசினார்; உவமை இல்லாமல் அவர்களிடம் அவர் எதையும் பேசவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உவமை இல்லாமல் அவர்களிடம் அவர் எதையும் பேசுவது வழக்கமல்ல.” கிரேக்க வினை வடிவம் வழக்கமான கடந்தகாலச் செயலாகவும் அல்லது எளிய இறந்தகாலமாகவும் மொழிபெயர்க்கப்படலாம்.
    reason: இரண்டாம் வாக்கியத்திலுள்ள கிரேக்க imperfect வினையின் வழக்கமான/தொடர்ச்சியான நுணுக்கத்தை, முதன்மைத் தமிழ்ப் பாடத்தில் தேவையற்ற நிகழ்காலப் பொதுக்கூற்றாக்கம் இல்லாமல் தெரிவிக்கிறது.
lexical_decisions:
- source_word: Ταῦτα πάντα
  choice: இவை அனைத்தையும்
  rationale: சுட்டுப்பெயரின் குறிப்புத்தன்மையையும் πάντα என்பதன் முழுமையையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: ἐλάλησεν
  choice: பேசினார்
  rationale: இறந்தகால நிகழ்வைச் சுருக்கமாகக் கூறும் aorist வினையை இயல்பாக வெளிப்படுத்துகிறது; இயேசுவைக் குறிக்கும் மரியாதை வினைமுற்றும் தமிழில் பொருத்தமானது.
- source_word: ἐν παραβολαῖς
  choice: உவமைகளாக
  rationale: ἐν என்பதன் முறை அல்லது ஊடகப் பொருளையும் παραβολαῖς என்பதன் பன்மையையும் சுருக்கமான இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τοῖς ὄχλοις
  choice: மக்கள் கூட்டத்தாரிடம்
  rationale: மூலத்திலுள்ள பன்மையான கூட்டங்களைக் கூட்டுப் பொருளில் இயல்பாகக் குறிக்கிறது; ‘-த்தாரிடம்’ என்பது பேசப்பட்டவர்களைத் தெளிவுபடுத்துகிறது.
- source_word: χωρὶς παραβολῆς
  choice: உவமை இல்லாமல்
  rationale: χωρίς என்பதன் ‘இல்லாமல்’ என்ற பொருளையும் παραβολῆς என்பதன் ஒருமையையும் காக்கிறது.
- source_word: οὐδὲν ἐλάλει
  choice: எதையும் பேசுவதில்லை
  rationale: மறுப்பையும் ἐλάλει என்ற imperfect வினையின் வழக்கமான அல்லது தொடர்ச்சியான செயல்பாட்டையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: αὐτοῖς
  choice: அவர்களிடம்
  rationale: முன்னர் குறிப்பிடப்பட்ட மக்கள் கூட்டத்தாரையே நேரடியாகச் சுட்டுகிறது; தேவையற்ற மறுபடியுரைத்தலைத் தவிர்க்கிறது.
theological_decisions:
- issue: இரண்டாம் வாக்கியத்திலுள்ள imperfect வினையின் கதைநடை அழுத்தம்
  choice: அந்தச் சூழலில் இயேசு மக்கள் கூட்டத்தாரிடம் வழக்கமாக உவமைகள் மூலமே பேசியதாக ‘பேசுவதில்லை’ என வழங்கப்பட்டது.
  alternative: ‘உவமை இல்லாமல் அவர் அவர்களிடம் எதையும் பேசவில்லை’ என்று எளிய இறந்தகாலமாக வழங்கலாம்.
  rationale: ἐλάλει வழக்கமான அல்லது தொடர்ச்சியான செயலைக் குறிக்கக்கூடும். அதன் அழுத்தத்தை முற்றிலும் அகற்றாமலும், இதை எல்லாக் காலங்களுக்கும் பொருந்தும் முழுமையான கோட்பாட்டுக் கூற்றாக விரிவுபடுத்தாமலும் சூழலுக்குள் வைத்துக் காட்டப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘மக்கள் கூட்டத்தார்’ என்பது மூலத்தின் பன்மையை இயல்பாகத் தாங்குகிறது; ‘பேசுவதில்லை’ என்பது இரண்டாம் வினையின் வழக்கச் செயல்பாட்டை முன்னிறுத்துகிறது.
