    text: அல்லது, இன்னும் சொற்சொல்லாக, “பாறைகள் நிறைந்த இடங்களில் விதைக்கப்பட்டவன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς
  choice: பாறை நிலத்தில் விதைக்கப்பட்டவனோ
  rationale: δέ என்பதன் மென்மையான மாற்றத்தையும், விதை–நிலம் உருவகத்தையும் இயல்பான தமிழில் காக்கிறது. ‘விதைக்கப்பட்டவன்’ என்ற சுருக்கமான உருவகம், விதைக்கப்பட்டது விதையா அல்லது அது சுட்டும் மனிதனா என்ற மூலவாக்கியத்தின் திட்டமிட்ட இறுக்கத்தைத் தீர்த்துவிடாமல் வைத்திருக்கிறது.
- source_word: πετρώδη
  choice: பாறை நிலம்
  rationale: பாறைகள் நிறைந்த, ஆழமற்ற நிலத்தைக் குறிக்கும் வேளாண்மைச் சூழலை நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: σπαρείς
  choice: விதைக்கப்பட்டவன்
  rationale: σπείρω என்பதன் இறந்தகாலச் செயப்பாட்டு வினையெச்சப் பொருளையும் விதைப்பு உருவகத்தையும் காக்கிறது.
- source_word: οὗτός ἐστιν
  choice: அவனே
  rationale: கிரேக்கத்தின் அடையாளப்படுத்தும் அமைப்பைச் சுருக்கமான, இயல்பான தமிழில் தருகிறது; ‘குறிக்கிறான்’ என்று விளக்கி உருவகத்தைத் தளர்த்தவில்லை.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: வார்த்தையைக் கேட்டு
  rationale: λόγος என்பதற்கு ‘வார்த்தை’ என்று மொழிபெயர்த்து, மத்தேயுவில் அதன் கருத்தியல் ஒலிப்பைத் தக்கவைக்கிறது; தமிழில் தொடர்வினை அமைப்பு இயல்பாக உள்ளது.
- source_word: εὐθὺς
  choice: உடனே
  rationale: பதிலளிப்பின் உடனடித் தன்மையைத் தெளிவாகவும் பொதுவான நவீனத் தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: μετὰ χαρᾶς
  choice: மகிழ்ச்சியுடன்
  rationale: χαρά என்ற பெயர்ச்சொல்லின் பொருளை நேரடியாகவும் இயல்பாகவும் காக்கிறது.
- source_word: λαμβάνων αὐτόν
  choice: அதை … ஏற்றுக்கொள்கிறவன்
  rationale: இச்சூழலில் λαμβάνω தரும் ‘பெற்றுக்கொள்/ஏற்றுக்கொள்’ பொருளில், செய்தியை மனப்பூர்வமாக ஏற்றுக்கொள்வதைத் தெளிவாகக் காட்டுகிறது; ‘அதை’ என்பது ‘வார்த்தை’யைச் சுட்டுகிறது.
theological_decisions:
- issue: உவமை விளக்கத்தில் விதைக்கப்பட்டவனின் சுட்டுப்பொருள்
  choice: ‘பாறை நிலத்தில் விதைக்கப்பட்டவனோ’ என்ற சுருக்கமான உருவகத்தை அப்படியே காத்து, அடுத்த பகுதி அவனை வார்த்தையைக் கேட்பவனாக அடையாளப்படுத்துகிறது.
  alternative: ‘பாறை நிலத்தில் விதைக்கப்பட்ட விதை, வார்த்தையைக் கேட்கிற மனிதனைக் குறிக்கிறது’ என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: கிரேக்கம் ‘விதைக்கப்பட்டவன்’ என்றும் பின்னர் ‘கேட்பவன்’ என்றும் கூறி விதை–மனிதன் உருவகங்களை நெருக்கமாக இணைக்கிறது. விளக்க மொழிபெயர்ப்பு இந்த உண்மையான உருவக இறுக்கத்தைத் தீர்த்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. ‘அவனே … ஏற்றுக்கொள்கிறவன்’ என்ற அமைப்பு கிரேக்கத்தின் அடையாளப்படுத்தும் வாக்கியத்தைத் தமிழில் தெளிவாகக் காக்கிறது. அடிக்குறிப்பு குறியீடு பிரதான உரையில் சேர்க்கப்பட்டுள்ளது.
