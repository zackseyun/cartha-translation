  language: ta
  text: பாறை நிலத்தில் விதைக்கப்பட்டவனோ[a], அவனே வார்த்தையைக் கேட்டு, உடனே அதை மகிழ்ச்சியுடன் ஏற்றுக்கொள்கிறவன்.
  philosophy: optimal-equivalence
