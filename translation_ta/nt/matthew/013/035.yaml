id: MAT.13.35
reference: Matthew 13:35
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τοῦ προφήτου λέγοντος· Ἀνοίξω ἐν παραβολαῖς τὸ στόμα μου, ἐρεύξομαι κεκρυμμένα ἀπὸ ⸀καταβολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/035.yaml
  text: 'so that what was spoken through the prophet might be fulfilled[a], saying: “I will open my mouth in parables; I will utter things hidden from the foundation of the world.”'
translation:
  language: ta
  text: 'இறைவாக்கினர் மூலம் கூறப்பட்டது நிறைவேறும்படி, அவர் கூறியது:


    “உவமைகளால் என் வாயைத் திறப்பேன்;


    அடித்தளம் இடப்பட்டதுமுதல் மறைந்திருந்தவற்றை உரைத்திடுவேன்.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “உலகத்தின் அடித்தளம் இடப்பட்டதுமுதல்” என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: ὅπως πληρωθῇ
  choice: நிறைவேறும்படி இவ்வாறு நடந்தது
  rationale: நோக்கம்/விளைவு சார்ந்த தொடர்பையும் மத்தேயுவின் நிறைவேற்றச் சூத்திரத்தையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὸ ῥηθὲν διὰ τοῦ προφήτου
  choice: இறைவாக்கினர் மூலம் சொல்லப்பட்டது
  rationale: διά + genitive காட்டும் இடைமுகச் செயற்பாட்டைப் பேணுகிறது; προφήτης என்பதற்கு சமயச் சூழலில் தெளிவான ‘இறைவாக்கினர்’ பயன்படுத்தப்படுகிறது.
- source_word: ἐν παραβολαῖς
  choice: உவமைகளால்
  rationale: பேச்சின் வடிவம்/கருவியைக் குறிக்கும் இயல்பான தமிழ்; மத்தேயுவின் உவமைச் சொல்லாட்சியைத் தக்கவைக்கிறது.
- source_word: Ἀνοίξω ... τὸ στόμα μου
  choice: என் வாயைத் திறப்பேன்
  rationale: மேற்கோளின் கவிதைநடையையும் எதிர்கால வினையையும் நேரடியாகப் பேணுகிறது.
- source_word: ἐρεύξομαι
  choice: வெளிப்படுத்துவேன்
  rationale: மூல வினையின் ‘வெளியே பொழிதல்/உரைத்தல்’ கருத்தை, மறைந்திருந்தவற்றோடு பொருந்தும் தெளிவான நவீன தமிழில் தருகிறது; வெறும் ‘கூறுவேன்’ என்பதைவிட வலிமையைப் பேணுகிறது.
- source_word: κεκρυμμένα
  choice: மறைந்திருந்தவற்றை
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிறைவு நிலைப் பங்கேற்புச் சொல்லின் கடந்தகாலத்திலிருந்து நீடிக்கும் மறைவு நிலையைக் காட்டுகிறது.
- source_word: ἀπὸ καταβολῆς
  choice: உலகம் தோற்றுவிக்கப்பட்டதுமுதல்
  rationale: καταβολή என்பதன் சூழல்சார் படைப்புத் தொடக்கப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; ‘உலகம்’ என்பது சில சாட்சிகளில் வெளிப்படையாகவும், குறுகிய வாசகத்தில் உட்கிடையாகவும் உள்ளது.
theological_decisions:
- issue: மேற்கோளை வழங்கிய இறைவாக்கினரின் அடையாளம்
  choice: இறைவாக்கினர் மூலம்
  alternative: ஆசாப் என்னும் இறைவாக்கினர் மூலம்
  rationale: SBLGNT வாசகம் பெயரைச் சேர்க்காமல் τοῦ προφήτου என்று மட்டுமே கூறுவதால், அடையாளத்தை விரிவுபடுத்தாமல் மூலத்தைப் பின்பற்றுகிறது.
- issue: ἀπὸ καταβολῆς என்ற காலத் தொடரின் அளவு
  choice: உலகம் தோற்றுவிக்கப்பட்டதுமுதல்
  alternative: தோற்றுவிக்கப்பட்டதுமுதல்
  rationale: மூல முதன்மை வாசகத்தில் κόσμου இல்லாவிட்டாலும், இத்தொடரின் வழக்குப் பொருள் உலகப் படைப்பின் தொடக்கத்தைக் குறிக்கிறது. தமிழில் முழுமையுடனும் இயல்பாகவும் இருக்க ‘உலகம்’ பிரதான உரையில் தரப்படுகிறது; குறுகிய வாசகம் அடிக்குறிப்பில் சுட்டப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; வேதாகம மேற்கோளுக்கேற்ற கண்ணியமான, ஓரளவு கவிதைநடை கொண்ட மொழி. ‘இறைவாக்கினர்’, ‘உவமைகள்’ போன்ற பொதுவாகப் புரியும் சமயச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
