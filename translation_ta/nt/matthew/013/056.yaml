source:
  edition: SBLGNT
  text: καὶ αἱ ἀδελφαὶ αὐτοῦ οὐχὶ πᾶσαι πρὸς ἡμᾶς εἰσιν; πόθεν οὖν τούτῳ ταῦτα πάντα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/056.yaml
  text: And are not all his sisters with us? Where then did this man get all these things?[a]
translation:
  language: ta
  text: அவருடைய சகோதரிகள்[a] எல்லாரும் நம்முடன் இருக்கிறார்கள் அல்லவா? அப்படியானால், இவனுக்கு இவையெல்லாம் எங்கிருந்து கிடைத்தன?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெண் உறவினர்கள்.” இங்குள்ள கிரேக்கச் சொல் பொதுவாக “சகோதரிகள்” என்றே பொருள்படும்; ஆனால் பிற்கால இறையியல் விவாதங்களைக் கருத்தில் கொண்டு சிலர் இதை விரிவான பொருளில் விளக்குகின்றனர்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφαὶ
  choice: சகோதரிகள்
  rationale: இச்சூழலில் இயேசுவின் குடும்பத்தினரைப் பற்றி ஊரார் பேசுவதால், சொல்லின் இயல்பான நேரடிப் பொருளான ‘சகோதரிகள்’ பொருத்தமாக உள்ளது.
- source_word: οὐχὶ πᾶσαι
  choice: எல்லாரும் ... இருக்கிறார்கள் அல்லவா?
  rationale: உறுதியான பதிலை எதிர்பார்க்கும் வினாவின் தன்மையையும், சகோதரிகள் அனைவரையும் குறிக்கும் வலியுறுத்தலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: πρὸς ἡμᾶς
  choice: நம்முடன் இருக்கிறார்கள்
  rationale: அவர்கள் அந்தச் சமூகத்திலேயே உடனிருந்து வாழ்வதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: πόθεν
  choice: எங்கிருந்து கிடைத்தன
  rationale: இயேசுவிடம் காணப்பட்ட இவற்றின் மூலம் அல்லது தோற்றம் என்ன என்ற கேள்வியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: அப்படியானால்
  rationale: ஊரார் முன் கூறிய குடும்பச் சூழலிலிருந்து எடுக்கும் முடிவைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: τούτῳ
  choice: இவருக்கு
  rationale: இயேசுவைச் சுட்டும் தத்திவைக் காக்கிறது; கிரேக்கத்தின் சுட்டும் தன்மையை உணர்த்தினாலும், தமிழில் தேவையற்ற அளவு இழிவான தொனியைச் சேர்க்கவில்லை.
- source_word: ταῦτα πάντα
  choice: இவையெல்லாம்
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட ஞானத்தையும் வல்ல செயல்களையும் உள்ளடக்கும் பன்மைச் சுட்டைச் சுருக்கமாகவும் நேரடியாகவும் தருகிறது.
theological_decisions:
- issue: இயேசுவின் சகோதரிகள் என்ற குறிப்பின் இயல்பு
  choice: ἀδελφαὶ என்பதைக் அதன் வழக்கமான பொருளில் ‘சகோதரிகள்’ என்று மொழிபெயர்த்தல்
  alternative: ‘பெண் உறவினர்கள்’ அல்லது ‘உறவுக்காரப் பெண்கள்’ என்று விரிவாகப் பொருள் கொள்ளுதல்
  rationale: கிரேக்கச் சொல்லின் இயல்பான குடும்பப் பொருள் இச்சூழலுக்குப் பொருந்துகிறது. பிற்கால இறையியல் விவாதங்களின் அடிப்படையில் உறவுமுறையை மொழிபெயர்ப்பிலேயே மாற்றித் தீர்மானிக்காமல், மாற்றுக் கருத்தை அடிக்குறிப்பில் மட்டும் தெரிவிக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ஊராரின் ஐயமும் வாத ஓட்டமும் ‘அல்லவா?’ மற்றும் ‘அப்படியானால்’ என்பவற்றால் காக்கப்பட்டுள்ளன.
