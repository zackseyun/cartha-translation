  source_fidelity: 'மொழிபெயர்ப்பு பெரும்பாலும் கிரேக்க மூலத்துக்கு நேர்மையானது: ἀδελφαὶ, οὐχὶ πᾶσαι, πρὸς ἡμᾶς, πόθεν, οὖν, மற்றும் ταῦτα πάντα ஆகியவை துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. ஆனால் τούτῳ என்பதன் சுட்டிக்காட்டும், ஓரளவு தள்ளிப்பேசும் தொனிக்கு ‘இவருக்கு’ என்ற மரியாதை வடிவம் பொருந்தாது.'
  naturalness: ‘அவருடைய சகோதரிகள் எல்லாரும் நம்முடன் இருக்கிறார்கள் அல்லவா?’ மற்றும் ‘அப்படியானால் ... எங்கிருந்து கிடைத்தன?’ ஆகியவை நவீன தரத் தமிழில் இயல்பாக உள்ளன. ‘இவனுக்கு’ என்பது இச்சூழலின் ஊரார் பேசும் நேரடி, கேள்விக்குரிய தொனியை இயல்பாகக் காக்கிறது.
