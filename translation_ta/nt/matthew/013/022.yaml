id: MAT.13.22
reference: Matthew 13:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων, καὶ ἡ μέριμνα τοῦ αἰῶνος ⸀τούτου καὶ ἡ ἀπάτη τοῦ πλούτου συμπνίγει τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/022.yaml
  text: And the one sown among the thorns—this is the one who hears the word[a], but the चिंता of this age and the deceitfulness of wealth choke the word[b], and he becomes unfruitful.
translation:
  language: ta
  text: முட்செடிகளுக்குள் விதைக்கப்பட்டவர் என்பவர் வார்த்தையைக் கேட்கிறவர்; இந்தக் காலத்தின் கவலையும் செல்வத்தின் ஏமாற்றும் தன்மையும் வார்த்தையை நெரித்துவிடுகின்றன; அதனால் அவர் கனியற்றவராகிறார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς
  choice: முட்செடிகளுக்குள் விதைக்கப்பட்டவர்
  rationale: ஆண்பால் ஒருமை வினையெச்சம் உவமையின் விளக்கத்தில் விதையால் குறிக்கப்படும் நபரைச் சுட்டுகிறது. ‘முட்செடிகளுக்குள்’ என்பது εἰς என்பதையும் விதைப்பு உருவகத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: வார்த்தையைக் கேட்கிறவர்
  rationale: நிகழ்கால வினையெச்சத்தை இயல்பான தமிழ் தொடர்புத் தொடராக வழங்குகிறது; λόγος இங்கு அறிவிக்கப்படும் செய்தியைக் குறிக்கும் ‘வார்த்தை’ எனத் தக்கவைக்கப்படுகிறது.
- source_word: ἡ μέριμνα τοῦ αἰῶνος τούτου
  choice: இந்தக் காலத்தின் கவலை
  rationale: μέριμνα என்பதின் பதற்றமுள்ள அக்கறை அல்லது கவலை என்ற எதிர்மறை வலிமையையும், αἰών என்பதின் காலகட்டப் பொருளையும் காக்கிறது.
- source_word: ἡ ἀπάτη τοῦ πλούτου
  choice: செல்வத்தின் ஏமாற்றும் தன்மை
  rationale: செல்வமே நம்பிக்கையைத் தவறாகத் தூண்டும் வஞ்சக இயல்புடையது என்ற உருபுத்தொடரின் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: συμπνίγει
  choice: நெருக்கி மூச்சடைக்கச் செய்கின்றன
  rationale: முட்செடிகள் பயிரைச் சூழ்ந்து நெருக்கி வளர்ச்சியைத் தடுக்கும் வேளாண் உருவகத்தின் தீவிரத்தை வெளிப்படுத்துகிறது. கூட்டு எழுவாய்க்கேற்ப பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἄκαρπος γίνεται
  choice: அவர் கனிகொடாதவராக ஆகிறார்
  rationale: வசனத்தின் விளக்கம் ‘கேட்கிறவர்’ என நபரை அடையாளப்படுத்துவதால் இறுதி கூறும் நபரையே குறிக்கிறது; வார்த்தையே பயனற்றதாகிறது என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
theological_decisions:
- issue: αἰών என்பதன் மொழிபெயர்ப்பு
  choice: இந்தக் காலம்
  alternative: இந்த உலகம்
  rationale: αἰών முதன்மையாக ஓர் யுகம் அல்லது காலகட்டத்தைக் குறிக்கிறது. ‘இந்தக் காலம்’ புதிய ஏற்பாட்டில் காணப்படும் கால மற்றும் ஒழுக்க முரண்பாட்டைத் தக்கவைக்கிறது; பொருளுலகைக் குறிக்கும் எண்ணத்தைத் தேவையின்றி சேர்ப்பதில்லை.
- issue: உவமை விளக்கத்தின் இறுதி எழுவாய்
  choice: அவர் கனிகொடாதவராக ஆகிறார்
  alternative: அது கனிகொடாததாக ஆகிறது
  rationale: உருவகம் விதைக்கப்பட்டதைப் பற்றித் தொடங்கினாலும், விளக்கம் அதை ‘வார்த்தையைக் கேட்கிறவர்’ என்று நபருடன் அடையாளப்படுத்துகிறது. எனவே ஆண்பால் ஒருமையை நபராகவே வழங்குவது மூலத்தின் நகர்வைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் எளிய புரிதலும் இணைந்த நடை. வேளாண் உருவகம் தெளிவாக இருக்க ‘நெருக்கி மூச்சடைக்கச் செய்கின்றன’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் உள்ள ‘இந்தக் காலம்’ என்ற கருத்து ‘இந்த உலகம்’ என்று ஒற்றைப்படுத்தப்படவில்லை.
