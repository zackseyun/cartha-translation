  text: οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ αἰῶνος· ἐξελεύσονται οἱ ἄγγελοι καὶ ἀφοριοῦσιν τοὺς πονηροὺς ἐκ μέσου τῶν δικαίων
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/049.yaml
  text: 'So it will be at the end of the age: the angels will go out and separate the wicked from among the righteous,[a]'
translation:
  language: ta
  text: 'அப்படியே இந்த யுகத்தின் முடிவில் நடக்கும்: தேவதூதர்கள் புறப்பட்டு, நீதிமான்களின் நடுவிலிருந்து பொல்லாதவர்களைப் பிரிப்பார்கள்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த யுகம் நிறைவடையும் வேளையில்.” மரபுவழி மொழிபெயர்ப்புகள் சிலவற்றில் “உலகத்தின் முடிவில்” என்று உள்ளது; ஆனால் கிரேக்கத்தில் “உலகம்” என்பதற்குப் பதிலாக “யுகம்” (αἰών) என்ற சொல் வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως ἔσται
  choice: அப்படியே … நடக்கும்
  rationale: உவமையின் விளக்கம் அல்லது முடிவை இயல்பான நவீனத் தமிழில் அறிமுகப்படுத்துகிறது; கிரேக்கத்தின் எதிர்காலப் பொருளையும் தக்கவைக்கிறது.
- source_word: ἐν τῇ συντελείᾳ τοῦ αἰῶνος
  choice: இக்காலத்தின் முடிவில்
  rationale: συντέλεια என்பது நிறைவு அல்லது முடிவையும், αἰών என்பது இச்சூழலில் உலகம் என்ற பௌதிகப் பொருளைவிட தற்போதைய கால ஒழுங்கையும் குறிக்கிறது. ‘இக்காலத்தின் முடிவில்’ என்பது தெளிவான, இயல்பான தமிழ்.
- source_word: ἐξελεύσονται
  choice: புறப்பட்டுச் சென்று
  rationale: ἐξέρχομαι என்பதன் வெளியே செல்வது அல்லது புறப்படுவது என்ற இயக்கப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οἱ ἄγγελοι
  choice: தேவதூதர்கள்
  rationale: இறுதித் தீர்ப்பைப் பற்றிய இச்சூழலில் இது மனிதத் தூதர்களை அல்ல, விண்ணுலகத் தூதர்களைக் குறிக்கிறது.
- source_word: ἀφοριοῦσιν
  choice: பிரிப்பார்கள்
  rationale: ஒரு கலந்த கூட்டத்திலிருந்து ஒரு பிரிவினரை வேறுபடுத்திப் பிரிக்கும் செயலை நேரடியாகத் தெரிவிக்கிறது.
- source_word: τοὺς πονηροὺς
  choice: பொல்லாதவர்களை
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் பன்மை அடைமொழி, தீய மனிதர்களைக் குறிக்கிறது; ‘பொல்லாதவர்கள்’ நவீனத் தமிழில் தெளிவாகவும் தீர்ப்புச் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: ἐκ μέσου τῶν δικαίων
  choice: நீதிமான்களின் நடுவிலிருந்து
  rationale: ஒரே கலந்த கூட்டத்தினுள் இருந்தவர்களை அங்கிருந்து பிரித்தெடுக்கும் பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ἐν τῇ συντελείᾳ τοῦ αἰῶνος என்பதிலுள்ள αἰών என்பதன் பொருள்
  choice: இக்காலம்
  alternative: உலகம்
  rationale: αἰών இங்கு பௌதிக உலகத்தைக் குறிக்கும் κόσμος அல்ல; தற்போதைய காலத்தையோ கால ஒழுங்கையோ குறிக்கிறது. எனவே, மூலமொழி கூறாத உலக அழிவு என்ற கருத்தை மொழிபெயர்ப்பு சேர்க்கவில்லை.
- issue: οἱ ἄγγελοι என்பவர்களின் அடையாளம்
  choice: விண்ணுலகத் தேவதூதர்கள்
  alternative: மனிதத் தூதர்கள்
  rationale: இறுதித் தீர்ப்பை விளக்கும் உவமைச் சூழல், இவர்கள் விண்ணுலகத் தேவதூதர்கள் என்பதைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இக்காலம்’ என்பது ‘யுகம்’ என்ற சமயச் சிறப்புச்சொல்லைவிட உடனடியாகப் புரியும்; ‘தேவதூதர்கள்’ என்பது சூழலுக்கேற்ற நிலையான வேதாகமச் சொல்.
