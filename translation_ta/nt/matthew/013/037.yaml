source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς ⸀εἶπεν· Ὁ σπείρων τὸ καλὸν σπέρμα ἐστὶν ὁ υἱὸς τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/037.yaml
  text: He answered[a], “The one who sows the good seed is the Son of Man.”
translation:
  language: ta
  text: அவர், “நல்ல விதையை விதைக்கிறவர் மானிடமகன்[a] ஆவார்” என்று பதிலளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனிதரானவர்.” “மானிடமகன்” என்ற கிரேக்கப் பட்டப்பெயர் தானியேல் 7-ஐ எதிரொலிக்கிறது; நற்செய்தி நூல்களில் நிலைபெற்றுள்ள அதன் இறையியல் சிறப்பைத் தக்கவைக்க இங்கு அது பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: என்று பதிலளித்தார்
  rationale: கிரேக்கத்தில் வினையெச்சமும் முதன்மை வினையும் சேர்ந்து பதிலை அறிமுகப்படுத்துகின்றன. தமிழில் சொற்சொல்லாக இரட்டிப்பதைத் தவிர்த்து, இரண்டின் உரையாடல் செயலையும் இயல்பாக ஒருங்கிணைக்கிறது.
- source_word: Ὁ σπείρων
  choice: விதைக்கிறவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்கால வினையெச்சம், ஒருவரை அவரது செயலால் அடையாளப்படுத்துகிறது; இத்தமிழாக்கம் அந்த பொதுவான/தொடர்ச்சியான நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: τὸ καλὸν σπέρμα
  choice: நல்ல விதை
  rationale: καλός இங்கு அழகை மட்டும் அல்லாமல் நல்லது, தகுந்தது என்ற பொருளைக் கொண்டுள்ளது. σπέρμα போலவே ‘விதை’ என்பதும் ஒருமைத் தொகுப்புப் பொருளில் இயல்பாக வருகிறது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மானிடமகன்
  rationale: இது நற்செய்தி நூல்களில் இயேசு தம்மைக் குறிக்கப் பயன்படுத்தும் தனிப்பட்ட பட்டப்பெயர். ‘மானிடமகன்’ என்பது நவீனத் தமிழில் கண்ணியமாகவும் சுருக்கமாகவும் இருந்து, தானியேல் 7-ன் எதிரொலியையும் பட்டப்பெயரின் இறையியல் கனத்தையும் தக்கவைக்கிறது.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου என்ற கிறிஸ்துவியல் பட்டப்பெயரின் மொழிபெயர்ப்பு
  choice: மானிடமகன்
  alternative: மனிதரானவர்
  rationale: இச்சொற்றொடர் ஒரு சாதாரண மனிதரைக் குறிப்பது மட்டுமல்ல; தானியேல் 7-ஐ எதிரொலிக்கும் இயேசுவின் நிலைபெற்ற சுயகுறிப்பாகவும் உள்ளது. எனவே விளக்கவுரையாகச் சமப்படுத்தாமல் பட்டப்பெயரின் வேதாகமத் தொடர்பும் இறையியல் பதற்றமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு நெருக்கமான, எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பதிலளித்தார்’ என்பது கிரேக்கச் சொற்றொடரின் இயல்பான தமிழ் ஒருங்கிணைப்பு; ‘மானிடமகன்’ பட்டப்பெயராகத் தக்கவைக்கப்பட்டுள்ளது.
