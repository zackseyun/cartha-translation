id: MAT.13.24
reference: Matthew 13:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ ⸀σπείραντι καλὸν σπέρμα ἐν τῷ ἀγρῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/024.yaml
  text: He set another parable before them[a], saying, “The kingdom of heaven is like a man who sowed good seed in his field.”
translation:
  language: ta
  text: 'அவர் வேறொரு உவமையை அவர்களுக்கு முன்வைத்துக் கூறினார்: “பரலோக ராஜ்யம், தன் வயலில் நல்ல விதையை விதைத்த ஒரு மனிதனைப் போன்றது.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு நெருக்கமாக, “ஒரு மனிதனுக்கு ஒப்பிடப்பட்டது.” மத்தேயுவின் உவமை அறிமுக முறையில் இந்தக் கிரேக்க வினைச்சொல்லை இயல்பாக “போன்றது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν
  choice: வேறொரு உவமையை
  rationale: ἄλλην என்பது தொடரில் மேலும் ஓர் உவமையை அறிமுகப்படுத்துகிறது; ‘வேறொரு உவமை’ இயல்பான நவீனத் தமிழ்.
- source_word: παρέθηκεν αὐτοῖς
  choice: அவர்களுக்கு முன்வைத்தார்
  rationale: παρατίθημι என்பதிலுள்ள ‘முன் வைத்தல்/எடுத்துவைத்தல்’ என்ற உருவகத்தையும், போதனையை வழங்குதல் என்ற பொருளையும் ‘முன்வைத்தார்’ தக்கவைக்கிறது.
- source_word: λέγων
  choice: கூறினார்
  rationale: கிரேக்கப் பங்கேற்பு வினைச்சொல்லைத் தமிழ் வாக்கிய ஓட்டத்துக்கு இயல்பாக முந்தைய வினையுடன் ‘முன்வைத்துக் கூறினார்’ என்று இணைக்கிறது.
- source_word: Ὡμοιώθη
  choice: போன்றது
  rationale: சொல்லுக்கு நெருக்கமான ‘ஒப்பிடப்பட்டது’ என்பது தமிழில் இங்கு இறுக்கமாகவும், கடந்தகால ஒப்பீடாகத் தவறாகப் புரியக்கூடியதாகவும் இருக்கும். மத்தேயுவின் உவமை அறிமுகச் சூத்திரத்தில் ‘போன்றது’ ஒப்பீட்டின் வலிமையை இயல்பாகத் தருகிறது; வடிவியல் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: பரலோக ராஜ்யம்
  rationale: மத்தேயுவுக்கே சிறப்பான இந்தச் சொற்றொடருக்கு தமிழில் பரவலாக அறியப்பட்ட, அரசாட்சியையும் அரசின் ஆளுகைக்குட்பட்ட நிலையையும் முற்றிலும் குறுக்கிவிடாத மரபான இணைச்சொல்.
- source_word: ἀνθρώπῳ
  choice: ஒரு மனிதனை
  rationale: உவமையில் குறிப்பிட்ட ஆண் நில உரிமையாளரைக் குறிக்கும் ஆண்பால் ஒருமையைத் தக்கவைக்கிறது.
- source_word: σπείραντι
  choice: விதைத்த
  rationale: இறந்தகாலச் செயப்பாட்டு எச்சத்தை, மனிதனை விளக்கும் இயல்பான தமிழ்ப் பெயரெச்சமாக வழங்குகிறது.
- source_word: καλὸν σπέρμα
  choice: நல்ல விதையை
  rationale: καλός இங்கு தரமான, நல்ல விதையைக் குறிக்கிறது; அடுத்த வசனங்களில் வரும் களைகளுடனான முரண்பாட்டையும் முன்னறிவிக்கிறது.
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: தன் வயலில்
  rationale: αὐτοῦ அந்த மனிதனையே சுட்டுவதைக் குழப்பமின்றிக் காட்ட ‘தன்’ பயன்படுத்தப்படுகிறது; ἀγρός என்பதற்கு ‘வயல்’ நேரடியான இயல்பான சொல்.
theological_decisions:
- issue: மத்தேயுவின் ἡ βασιλεία τῶν οὐρανῶν என்ற சொற்றொடர்
  choice: பரலோக ராஜ்யம்
  alternative: பரலோக அரசாட்சி / பரலோகங்களின் ராஜ்யம்
  rationale: ‘பரலோக ராஜ்யம்’ மத்தேயுவின் மரியாதைமிக்க இறையாட்சி மொழியை அடையாளம் காணக்கூடிய வகையில் தக்கவைக்கிறது. ‘பரலோகங்களின்’ என்ற சொற்சொல் மொழிபெயர்ப்பு தமிழில் தேவையற்ற இடவியல் பன்மையை உணர்த்தலாம்; ‘அரசாட்சி’ என்பது ஆளுகை என்ற ஓர் அம்சத்தை மட்டும் அதிகமாக முன்னிறுத்தலாம்.
- issue: Ὡμοιώθη என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவம்
  choice: போன்றது
  alternative: ஒப்பிடப்பட்டது / ஒப்பாயிற்று
  rationale: இது ராஜ்யத்தின் இயல்பில் ஏற்பட்ட காலமாற்றத்தைப் போதிப்பதல்ல; உவமையை அறிமுகப்படுத்தும் ஒப்பீட்டுச் சூத்திரம். ஆகவே இயல்பான நிகழ்கால ஒப்பீடு தேர்ந்தெடுக்கப்படுகிறது; கிரேக்க வடிவத்தின் நெருக்கமான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்குரிய கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘முன்வைத்தார்’ மூலத்தின் உருவகத்தைத் தக்கவைக்கிறது; ‘போன்றது’ உவமைச் சூத்திரத்தை இயல்பாக்குகிறது.
