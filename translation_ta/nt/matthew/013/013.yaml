source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν παραβολαῖς αὐτοῖς λαλῶ, ὅτι βλέποντες οὐ βλέπουσιν καὶ ἀκούοντες οὐκ ἀκούουσιν οὐδὲ συνίουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/013.yaml
  text: For this reason I speak to them in parables[a], because seeing they do not see, and hearing they do not hear, nor do they understand.
translation:
  language: ta
  text: இதனால்தான் நான் அவர்களிடம் உவமைகளைக் கொண்டு பேசுகிறேன்; ஏனெனில், அவர்கள் பார்த்தாலும் பார்ப்பதில்லை; கேட்டாலும் கேட்பதில்லை; புரிந்துகொள்வதுமில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'மேலும் சொற்சொல்லான மொழிபெயர்ப்பு: “பார்த்தும் அவர்கள் பார்ப்பதில்லை; கேட்டும் அவர்கள் கேட்பதில்லை.”'
    reason: βλέποντες மற்றும் ἀκούοντες ஆகிய பங்கேற்பு வினைகளின் வடிவத்தைத் தமிழில் இன்னும் நெருக்கமாகக் காட்டும் மாற்று.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: இதனால்தான்
  rationale: முன்னுள்ள சூழ்நிலையை இயேசு இவ்வாறு பேசுவதற்கான காரணமாகக் காட்டும் சொற்றொடர். காரணத் தொடர்பை இயல்பான நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: ἐν παραβολαῖς
  choice: உவமைகளைக் கொண்டு
  rationale: ἐν + வேற்றுமை இங்கு பேசும் முறையைக் குறிக்கிறது. ‘உவமைகளைக் கொண்டு’ என்பது பொருளை மாற்றாமல் இயல்பான தமிழில் அந்த முறையை வெளிப்படுத்துகிறது.
- source_word: αὐτοῖς λαλῶ
  choice: நான் அவர்களிடம் … பேசுகிறேன்
  rationale: இலக்கு மக்களைக் குறிக்கும் αὐτοῖς என்பதையும் நிகழ்கால λαλῶ என்பதையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: பின்வரும் கூற்று காரணத்தைத் தருவதால் காரணப்பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: βλέποντες οὐ βλέπουσιν
  choice: அவர்கள் பார்த்துக்கொண்டிருந்தும் பார்ப்பதில்லை
  rationale: பார்க்கும் செயலும் உண்மையில் காணாத நிலையும் இடையிலுள்ள முரண்பாட்டைத் தக்கவைக்கிறது; ‘புரிந்துகொள்ள முடியவில்லை’ என்று விளக்கி உரையின் இறுக்கத்தை நீக்கவில்லை.
- source_word: ἀκούοντες οὐκ ἀκούουσιν
  choice: கேட்டுக்கொண்டிருந்தும் கேட்பதில்லை
  rationale: முந்தைய இணை அமைப்பைப் பாதுகாத்து, கேட்கும் செயலும் உணர்ந்து கேளாத நிலையும் இடையிலுள்ள முரண்பாட்டை வெளிப்படுத்துகிறது.
- source_word: οὐδὲ συνίουσιν
  choice: புரிந்துகொள்வதும் இல்லை
  rationale: οὐδὲ தொடரும் மறுப்பைச் சேர்க்கிறது; συνίημι இங்கு பொருளை உணர்ந்து கொள்வதைக் குறிக்கிறது.
theological_decisions:
- issue: βλέποντες மற்றும் ἀκούοντες ஆகிய பங்கேற்பு வினைகளின் நுணுக்கம்
  choice: ‘பார்த்துக்கொண்டிருந்தும்’, ‘கேட்டுக்கொண்டிருந்தும்’ என முரண்பாட்டுப் பொருளுடன் வழங்கப்பட்டது
  alternative: ‘பார்த்தும்’, ‘கேட்டும்’ என மேலும் வடிவொத்த முறையில் வழங்குதல்
  rationale: கிரேக்க வடிவம் தனியாக ‘இருந்தும்’ என்பதை வெளிப்படையாகச் சொல்லாவிட்டாலும், தொடரின் முரண்பாடு தமிழில் இவ்வாறு இயல்பாக வெளிப்படுகிறது. உடலளவிலான பார்த்தல்/கேட்டலுக்கும் புரிந்துகொள்ளாமைக்கும் இடையிலுள்ள இறையியல் இறுக்கம் விளக்கவுரையால் தீர்க்கப்படாமல் பாதுகாக்கப்படுகிறது.
- issue: συνίουσιν என்பதன் சூழல்சார் பொருள்
  choice: ‘புரிந்துகொள்கிறார்கள்’ என்பதன் மறுப்பு
  alternative: ‘உணர்கிறார்கள்’ அல்லது ‘கிரகிக்கிறார்கள்’ என்பதன் மறுப்பு
  rationale: காண்பதும் கேட்பதும் இருந்தும் பொருளைப் பற்றிக்கொள்ளாத நிலையை ‘புரிந்துகொள்வது’ தெளிவாகத் தருகிறது; குற்றப்பொறுப்பு அல்லது இயலாமை குறித்த மேலதிக கோட்பாட்டைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் எளிமையுடன் கண்ணியமான வேதாகம நடையைப் பேணுகிறது. இணையான கிரேக்க சொற்றொடர்களுக்குத் தமிழிலும் இணையான அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
