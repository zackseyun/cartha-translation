id: MAT.13.32
reference: Matthew 13:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὃ μικρότερον μέν ἐστιν πάντων τῶν σπερμάτων, ὅταν δὲ αὐξηθῇ μεῖζον τῶν λαχάνων ἐστὶν καὶ γίνεται δένδρον, ὥστε ἐλθεῖν τὰ πετεινὰ τοῦ οὐρανοῦ καὶ κατασκηνοῦν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/032.yaml
  text: It is indeed smaller than all the seeds[a], but when it has grown, it is larger than the garden plants and becomes a tree[b], so that the birds of the sky come and nest in its branches.
translation:
  language: ta
  text: அது எல்லா விதைகளையும்விடச் சிறியதாயிருந்தாலும், வளர்ந்த பிறகு தோட்டச் செடிகளையும்விடப் பெரியதாகி ஒரு மரமாகிறது; அதன் விளைவாக வானத்துப் பறவைகள்[a] வந்து அதன் கிளைகளில் தங்குகின்றன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘காற்றில் பறக்கும் பறவைகள்.’ τὰ πετεινὰ τοῦ οὐρανοῦ என்ற கிரேக்கச் சொற்றொடருக்கு இது மரபுவழி மொழிபெயர்ப்பு.
    reason: lexical_alternative
  - marker: b
    text: கிளைகளில் பறவைகள் தங்கும் இந்தக் காட்சி, ஒரு பெரிய அரசை மரமாகச் சித்தரிக்கும் பழைய ஏற்பாட்டுக் காட்சிகளை எதிரொலிக்கக்கூடும் (எடுத்துக்காட்டாக, எசேக்கியேல் 17:23; தானியேல் 4:12). ஆனால் இந்த வசனம் அதன் அடையாளப் பொருளை வெளிப்படையாகக் கூறவில்லை.
    reason: cross_reference
lexical_decisions:
- source_word: μικρότερον ... πάντων τῶν σπερμάτων
  choice: எல்லா விதைகளையும்விடச் சிறியது
  rationale: μικρότερον என்பது ஒப்பீட்டுப் படிவம். தமிழில் ‘எல்லா ... விடச் சிறியது’ என்பது அந்த ஒப்பீட்டைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; ‘மிகச் சிறியது’ என்று உயர்படியாக மாற்றவில்லை.
- source_word: μέν ... δέ
  choice: '... . ஆனால் ...'
  rationale: விதையின் சிறிய தொடக்கத்துக்கும் அதன் பெரிய வளர்ச்சிக்கும் இடையிலான முரண்பாட்டை நவீன தமிழில் இயல்பாகக் காட்டுகிறது. μέν-ஐ தனிச் சொல்லாக மொழிபெயர்க்காமல் வாக்கிய அமைப்பின் வழியாக வலியுறுத்தல் தெரிவிக்கப்படுகிறது.
- source_word: ὅταν ... αὐξηθῇ
  choice: அது வளர்ந்த பிறகு
  rationale: வளர்ச்சி நிறைவடைந்த நிலையில் அடுத்த விளைவு ஏற்படுவதைக் காட்டும் aorist subjunctive அமைப்பை இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: μεῖζον τῶν λαχάνων
  choice: தோட்டச் செடிகளையும்விடப் பெரியதாகி
  rationale: λάχανα என்பது பயிரிடப்படும் தோட்டச் செடிகள், கீரைகள் அல்லது காய்கறிச் செடிகளைக் குறிக்கக்கூடியது. ‘தோட்டச் செடிகள்’ அதன் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: γίνεται δένδρον
  choice: ஒரு மரமாகிறது
  rationale: கிரேக்க உரையின் நேரடியான, உயிரோட்டமுள்ள உருவகத்தை மென்மைப்படுத்தாமல் அப்படியே தக்கவைக்கிறது.
- source_word: ὥστε ἐλθεῖν
  choice: அதனால் ... வந்து
  rationale: ὥστε + infinitive குறிக்கும் விளைவை ‘அதனால்’ என்ற இயல்பான விளைவுத் தொடர்பின் மூலம் தெரிவிக்கிறது.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: வானத்துப் பறவைகள்
  rationale: οὐρανός இச்சூழலில் வானத்தைக் குறிக்கிறது. இது கிரேக்கச் சொற்றொடருக்கு நெருக்கமானதும் தமிழில் இயல்பானதும் ஆகும்.
- source_word: κατασκηνοῦν
  choice: தங்குகின்றன
  rationale: இச்சொல் கிளைகளில் உறைவது அல்லது தங்குவது என்ற கருத்தைக் கொண்டது. ‘தங்குகின்றன’ என்பது கூடுகட்டுதல் என்ற ஒரே குறிப்பிட்ட பொருளுக்குள் சுருக்காமல், மூலத்தின் பரந்த பொருளையும் பழைய ஏற்பாட்டு எதிரொலிக்கான வாய்ப்பையும் காக்கிறது.
- source_word: ἐν τοῖς κλάδοις αὐτοῦ
  choice: அதன் கிளைகளில்
  rationale: மரத்தைச் சுட்டும் இயல்பான இடவியல் மொழிபெயர்ப்பு.
theological_decisions:
- issue: பெரிய மரத்தின் கிளைகளில் பறவைகள் தங்கும் பழைய ஏற்பாட்டு உருவகத்திற்கான சாத்தியமான எதிரொலி
  choice: உருவகத்தை முதன்மை உரையில் விளக்கமின்றி நேரடியாகத் தக்கவைத்தல்
  alternative: பறவைகள் தேசங்களையோ மக்களையோ குறிக்கின்றன என்று முதன்மை உரையிலேயே விளக்குதல்
  rationale: எசேக்கியேல் 17:23 மற்றும் தானியேல் 4:12 போன்ற அரசமர உருவகங்கள் இங்கு எதிரொலிக்கக்கூடும். எனினும் இந்த வசனம் அந்த அடையாளப் பொருளை வெளிப்படையாகக் கூறாததால், மொழிபெயர்ப்பு ஒரு குறிப்பிட்ட இறையியல் விளக்கத்தைத் திணிக்காமல் அதன் பொருள் வளத்தையும் தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடிய அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘விதைகளையும்விடச் சிறியது / செடிகளையும்விடப் பெரியது’ என்ற இணையான ஒப்பீட்டு அமைப்பு மூலத்தின் முரண்பாட்டைக் காக்கிறது. ‘தங்குகின்றன’ என்பது இயல்பான தமிழையும் மூலவினையின் பொருள் பரப்பையும் சமநிலைப்படுத்துகிறது.
