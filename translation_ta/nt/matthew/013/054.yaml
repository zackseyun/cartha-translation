source:
  edition: SBLGNT
  text: καὶ ἐλθὼν εἰς τὴν πατρίδα αὐτοῦ ἐδίδασκεν αὐτοὺς ἐν τῇ συναγωγῇ αὐτῶν, ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν· Πόθεν τούτῳ ἡ σοφία αὕτη καὶ αἱ δυνάμεις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/054.yaml
  text: And coming to his hometown[a], he was teaching them in their synagogue, so that they were astonished and said, “Where did this man get this wisdom and these powers?”
translation:
  language: ta
  text: அவர் தமது சொந்த ஊருக்கு வந்து, அவர்களுடைய ஜெப ஆலயத்தில் அவர்களுக்குக் கற்பித்துக்கொண்டிருந்தார். அதனால் அவர்கள் வியப்படைந்து, “இந்த மனிதருக்கு இந்த ஞானமும் இந்த வல்லமைகளும்[a] எங்கிருந்து கிடைத்தன?” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வல்ல செயல்கள்”; அதாவது, வல்லமையை வெளிப்படுத்தும் செயல்கள்; பொதுவாக அற்புதங்கள் எனப் புரிந்துகொள்ளப்படுபவை.
    reason: lexical_alternative
lexical_decisions:
- source_word: πατρίδα
  choice: சொந்த ஊர்
  rationale: இச்சூழலில் இது ஒரு நாடு அல்லது பரந்த தாயகத்தைக் குறிக்காமல், இயேசு வளர்ந்து உள்ளூரில் அறியப்பட்ட ஊரைக் குறிக்கிறது. ‘சொந்த ஊர்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: ἐδίδασκεν
  choice: கற்பித்துக்கொண்டிருந்தார்
  rationale: முற்றுப்பெறாமல் நடந்துகொண்டிருந்த இறந்தகாலச் செயலைக் காட்டும் கிரேக்க imperfect வடிவத்தைத் தமிழில் இவ்வாறு வெளிப்படுத்துகிறது.
- source_word: συναγωγῇ
  choice: தொழுகைக்கூடம்
  rationale: இங்கு யூதர்கள் கூடி வழிபட்ட இடத்தைக் குறிக்கிறது; ‘தொழுகைக்கூடம்’ என்பது புரிந்துகொள்ள எளிதானதும் சூழலுக்குப் பொருத்தமானதும் ஆகும்.
- source_word: ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν
  choice: அதனால் அவர்கள் வியப்படைந்து … என்றார்கள்
  rationale: ὥστε குறிப்பிடும் விளைவை இயல்பான தமிழில் தெரிவிக்கிறது; ἐκπλήσσομαι என்பதின் வலுவான வியப்புணர்வும் தக்கவைக்கப்படுகிறது.
- source_word: Πόθεν
  choice: எங்கிருந்து கிடைத்தன?
  rationale: அவருடைய ஞானமும் வல்ல செயல்களும் எந்த மூலத்திலிருந்து வந்தன என்று கேட்கும் பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: τούτῳ
  choice: இந்த மனிதருக்கு
  rationale: பேசுகிறவர்கள் இயேசுவைச் சற்றே விலக்கிப் பேசும் demonstrative தொனியை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: σοφία
  choice: ஞானம்
  rationale: இது கிரேக்கச் சொல்லின் நேரான, வழக்கமான பொருளைத் தருகிறது.
- source_word: δυνάμεις
  choice: வல்ல செயல்கள்
  rationale: சொல்லின் அடிப்படையான ‘வல்லமை’ என்ற கருத்தையும், இச்சூழலில் அது வல்லமையை வெளிப்படுத்தும் செயல்களைக் குறிக்கும் metonymic பயன்பாட்டையும் தக்கவைக்கிறது; ‘அற்புதங்கள்’ என்று முழுமையாக விளக்கிவிடுவதைத் தவிர்க்கிறது.
theological_decisions:
- issue: இயேசுவின் அசாதாரண செயல்களைக் குறிக்கும் δυνάμεις என்பதன் மொழிபெயர்ப்பு
  choice: வல்ல செயல்கள்
  alternative: அற்புதங்கள்; வல்லமைகள்
  rationale: மக்கள் இயேசுவின் ஞானத்தையும் அசாதாரணமான வல்லமை வெளிப்படும் செயல்களையும் கண்டு வியப்பதை வசனம் கூறுகிறது. ‘வல்ல செயல்கள்’ என்பது மூலச்சொல்லின் வல்லமை சார்ந்த பொருளைப் பாதுகாத்து, அதை ‘அற்புதங்கள்’ என்ற இறையியல் வகைப்பாட்டால் மட்டும் முன்கூட்டியே வரையறுக்காமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘கற்பித்துக்கொண்டிருந்தார்’ தொடர்ச்சியான செயலைக் காட்டுகிறது; ‘இந்த மனிதருக்கு’ என்பது கூட்டத்தாரின் சற்றே விலகிய பேச்சுத் தொனியைத் தக்கவைக்கிறது.
