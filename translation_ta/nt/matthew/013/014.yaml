id: MAT.13.14
reference: Matthew 13:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἀναπληροῦται αὐτοῖς ἡ προφητεία Ἠσαΐου ἡ λέγουσα· Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε, καὶ βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/014.yaml
  text: 'And in them the prophecy of Isaiah is fulfilled[a], which says: ‘You will indeed hear, but never understand, and seeing you will see, but never perceive.’'
translation:
  language: ta
  text: 'அவர்களிடத்தில் ஏசாயாவின் தீர்க்கதரிசனம் நிறைவேறுகிறது[a]. அது இவ்வாறு கூறுகிறது:


    “நீங்கள் கேட்டுக்கொண்டே இருப்பீர்கள்; ஆனால் ஒருபோதும் புரிந்துகொள்ளமாட்டீர்கள்.


    பார்த்துக்கொண்டே இருப்பீர்கள்; ஆனால் ஒருபோதும் உணரமாட்டீர்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “கேட்டுக் கேட்பீர்கள் ... பார்த்துக்கொண்டு பார்ப்பீர்கள்.” இது கிரேக்கத்தின் வழியாக மேற்கோள் காட்டப்பட்டுள்ள எபிரேயப் பாணி வலியுறுத்தல்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναπληροῦται
  choice: நிறைவேறுகிறது
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது. ‘முழுமையாக நிறைவேறுகிறது’ என்று கூறி மூலத்தில் சாத்தியமானதைவிட வலுவான நிறைவுப் பொருளைத் திணிக்கவில்லை.
- source_word: αὐτοῖς
  choice: அவர்களிடம்
  rationale: தீர்க்கதரிசனம் இம்மக்களின் நிலை மற்றும் எதிர்வினையில் நிறைவேறுகிறது என்ற தொடர்பை இயல்பான தமிழில் காட்டுகிறது; ‘அவர்களுக்காக’ என்ற பயனுறு பொருளைத் தவிர்க்கிறது.
- source_word: προφητεία Ἠσαΐου
  choice: ஏசாயாவின் தீர்க்கதரிசனம்
  rationale: கிரேக்க மரபுத்தொடரின் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἡ λέγουσα
  choice: அது கூறுவது
  rationale: மேற்கோளை அறிமுகப்படுத்தும் பெயரெச்சத்தின் பணியைத் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: Ἀκοῇ ἀκούσετε
  choice: நீங்கள் கேட்டுக்கொண்டே இருப்பீர்கள்
  rationale: கேட்டல் வினையின் மீளுருவாக்கத்தால் வரும் எபிரேயப் பாணி வலியுறுத்தலை இயல்பான தமிழில் தொடர்ச்சியும் வலியுறுத்தலும் கொண்ட வடிவில் தருகிறது.
- source_word: οὐ μὴ συνῆτε
  choice: ஆனால் ஒருபோதும் புரிந்துகொள்ளமாட்டீர்கள்
  rationale: οὐ μή என்னும் வலுவான மறுப்பை ‘ஒருபோதும் ... மாட்டீர்கள்’ எனக் காட்டுகிறது; முரண்பாட்டைத் தமிழில் தெளிவாக்க ‘ஆனால்’ பயன்படுத்தப்படுகிறது.
- source_word: βλέποντες βλέψετε
  choice: பார்த்துக்கொண்டே இருப்பீர்கள்
  rationale: முந்தைய வரியுடன் இணையான வலியுறுத்தல் அமைப்பை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: οὐ μὴ ἴδητε
  choice: ஆனால் ஒருபோதும் உணரமாட்டீர்கள்
  rationale: முந்தைய βλέπω-வை ‘பார்த்தல்’ எனக் கொடுத்தபின், ἴδητε இங்கு குறிக்கும் உண்மையான அறிதல் அல்லது புலப்படுதலை ‘உணர்தல்’ என வேறுபடுத்துகிறது; வலுவான மறுப்பையும் காக்கிறது.
theological_decisions:
- issue: தீர்க்கதரிசனம் நிறைவேறும் தன்மை
  choice: ஏசாயாவின் தீர்க்கதரிசனம் இவர்களிடம் நிறைவேறுகிறது என்று உரை கூறும் அளவிலேயே மொழிபெயர்க்கப்பட்டது.
  alternative: இது அவர்களிடம் வெறுமனே எடுத்துக்காட்டப்படுகிறது அல்லது இவர்களால் முற்றிலும் இறுதியாக நிறைவடைகிறது என்று விளக்குவது.
  rationale: கடினப்படுத்துதல், முன்நியமனம், அல்லது வெறும் ஒப்புமை குறித்து ஒரு குறிப்பிட்ட கோட்பாட்டைச் சேர்க்காமல், மூலத்தின் நிறைவேற்ற மொழியையும் அதன் இறையியல் அழுத்தத்தையும் அப்படியே விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், வேதாகம மேற்கோளுக்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. இணையான இரு வரிகளின் ஓசையும் வலியுறுத்தலும் பாதுகாக்கப்பட்டுள்ளன.
