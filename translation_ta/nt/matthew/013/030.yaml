id: MAT.13.30
reference: Matthew 13:30
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἄφετε συναυξάνεσθαι ἀμφότερα ⸀μέχρι τοῦ θερισμοῦ· καὶ ἐν καιρῷ τοῦ θερισμοῦ ἐρῶ τοῖς θερισταῖς· Συλλέξατε πρῶτον τὰ ζιζάνια καὶ δήσατε αὐτὰ εἰς δέσμας πρὸς τὸ κατακαῦσαι αὐτά, τὸν δὲ σῖτον ⸀συναγάγετε εἰς τὴν ἀποθήκην μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/030.yaml
  text: Let both grow together until the harvest[a], and at the time of harvest I will tell the reapers, ‘First collect the weeds and tie them into bundles to burn them, but gather the wheat into my storehouse.’
translation:
  language: ta
  text: அறுவடை வரை இரண்டும் ஒன்றாக வளரட்டும். அறுவடைக் காலத்தில் நான் அறுவடை செய்பவர்களிடம், ‘முதலில் களைகளை[a]ச் சேகரித்து, அவற்றை எரிப்பதற்காகக் கட்டுகளாகக் கட்டுங்கள்; ஆனால் கோதுமையை என் களஞ்சியத்தில் சேர்த்து வையுங்கள்’ என்று சொல்வேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “களைகள்” என்பது கோதுமையைப் போல் தோன்றும் ஒருவகைக் களையைக் குறிக்கலாம்; பாரம்பரியமாக இது “தாரைகள்” என அழைக்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφετε συναυξάνεσθαι ἀμφότερα
  choice: இரண்டும் ஒன்றாக வளரட்டும்
  rationale: 'Permissive imperative and the compound verb are conveyed naturally: both kinds are to be allowed to grow together.'
- source_word: μέχρι τοῦ θερισμοῦ
  choice: அறுவடைவரை
  rationale: Preserves the definite endpoint of the growing period in concise, natural Tamil.
- source_word: ἐν καιρῷ τοῦ θερισμοῦ
  choice: அறுவடைக் காலத்தில்
  rationale: Conveys the time or season appointed for harvesting without awkward literalism.
- source_word: τοῖς θερισταῖς
  choice: அறுவடை செய்கிறவர்களிடம்
  rationale: A clear modern Tamil expression for the workers who reap the crop.
- source_word: τὰ ζιζάνια
  choice: களைகளை
  rationale: Accessible generic term for the harmful weeds in the parable; the likely specific plant is noted without overdetermining the main text.
- source_word: εἰς δέσμας
  choice: கட்டுகளாக
  rationale: Expresses forming the weeds into tied bundles.
- source_word: πρὸς τὸ κατακαῦσαι αὐτά
  choice: அவற்றை எரிப்பதற்காக
  rationale: Preserves the explicit purpose construction and agricultural imagery.
- source_word: τὸν δὲ σῖτον
  choice: கோதுமையையோ
  rationale: The contrastive particle δέ is represented by the Tamil contrastive suffix -ஓ.
- source_word: συναγάγετε εἰς τὴν ἀποθήκην μου
  choice: என் களஞ்சியத்தில் சேர்த்துவையுங்கள்
  rationale: Naturally conveys gathering the wheat into the speaker's storage place.
theological_decisions:
- issue: உவமையில் இடம்பெறும் இறுதிப் பிரித்தலின் உருவகம்
  choice: வேளாண்மை உருவகத்தையே மொழிபெயர்த்து, அதன் இறுதிக்கால விளக்கத்தை வசனத்துக்குள் சேர்க்கவில்லை.
  alternative: களைகளை ‘அழிவுக்காக’ சேர்ப்பதாக வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: இந்த உவமையின் விளக்கம் அதிகாரத்தின் பின்னர் வருகிறது; இங்கே இயேசு சொன்ன உருவகத்தின் தெளிவும் பதற்றமும் அப்படியே பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் வேளாண்மைச் சூழலுக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. குறிப்புக்குறி [a] வசனத்தின் முடிவில் இடப்பட்டுள்ளது.
