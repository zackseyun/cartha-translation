source:
  edition: SBLGNT
  text: ἐν δὲ τῷ καθεύδειν τοὺς ἀνθρώπους ἦλθεν αὐτοῦ ὁ ἐχθρὸς καὶ ⸀ἐπέσπειρεν ζιζάνια ἀνὰ μέσον τοῦ σίτου καὶ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/025.yaml
  text: But while the men were sleeping, his enemy came and sowed weeds among the wheat and went away.
translation:
  language: ta
  text: ஆனால் மனிதர்கள் தூங்கிக்கொண்டிருந்தபோது, அவனுடைய பகைவன் வந்து, கோதுமையின் நடுவே களைகளை விதைத்து, போய்விட்டான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς ἀνθρώπους
  choice: அந்த மனிதர்கள்
  rationale: இங்கு ἄνθρωποι என்பது வயலில் இருந்த மனிதர்களைக் குறிக்கிறது. முந்தைய சூழலில் குறிப்பிடப்படும் ஊழியர்களுடன் இயல்பாக இணையும் வகையிலும், ஆண்பால் பன்மையை மிகையாக வலியுறுத்தாமலும் மொழிபெயர்க்கப்பட்டது.
- source_word: καθεύδειν
  choice: தூங்கிக்கொண்டிருந்தபோது
  rationale: கிரேக்க நிகழ்கால வினையெச்சத்தின் தொடர்நிலைச் செயற்பாட்டையும், ἐν δὲ τῷ அமைப்பின் காலப் பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὁ ἐχθρός
  choice: பகைவன்
  rationale: தனிப்பட்ட எதிரியைச் சுட்டும் ஒருமைச் சொல்லையும், உவமையின் தீங்கிழைக்கும் எதிர்மறைத் தன்மையையும் பாதுகாக்கிறது.
- source_word: ἐπέσπειρεν
  choice: விதைத்துவிட்டு
  rationale: விதைப்புச் செயலை நேரடியாகக் காட்டுகிறது; ἐπί- முன்னொட்டிற்கு தனியான மிகைப்படுத்தப்பட்ட பொருளைச் சேர்க்காமல், கோதுமையின் நடுவே விதைத்தது என்பதை அடுத்த சொற்றொடர் தெளிவாக்குகிறது.
- source_word: ζιζάνια
  choice: களைகள்
  rationale: ζιζάνια என்பது கோதுமையைப் போன்ற தோற்றமுள்ள தீங்கான களையைக் குறிக்கலாம். அதன் தாவரவியல் இனத்தை உறுதியாக நிர்ணயிக்காமல், சாதாரண வாசகருக்குப் புரியும் பொதுப்பெயர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἀνὰ μέσον τοῦ σίτου
  choice: கோதுமையின் நடுவே
  rationale: களைகள் கோதுமைப் பயிருக்குள் கலந்தபடி விதைக்கப்பட்ட இடவியல் பொருளைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: ἀπῆλθεν
  choice: போய்விட்டான்
  rationale: பகைவன் விதைத்த பின் அங்கிருந்து சென்றுவிட்டான் என்ற நிறைவுற்ற செயலை இயல்பான தமிழில் காட்டுகிறது.
