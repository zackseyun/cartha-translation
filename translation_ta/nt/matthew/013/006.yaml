  source_fidelity: மூலத்தின் காலச் சூழல் (ἡλίου ... ἀνατείλαντος), வெப்பத்தால் கருகுதல் (ἐκαυματίσθη), வேர் இல்லாமையால் ஏற்படும் காரணத் தொடர்பு (διὰ τὸ μὴ ἔχειν ῥίζαν), மற்றும் உலர்ந்துபோதல் (ἐξηράνθη) அனைத்தும் துல்லியமாக வெளிப்படுத்தப்பட்டுள்ளன. ‘அது’ என்ற ஒருமைச் சுட்டுப்பெயர் விதை/முளைத்த செடியைச் சூழலுக்கு ஏற்ப குறிக்கிறது.
  naturalness: ‘ஆனால் சூரியன் உதித்தபோது அது வெப்பத்தால் கருகியது; வேர் இல்லாததால் உலர்ந்துபோனது’ என்பது நவீன நிலையான தமிழில் இயல்பாகவும் சுருக்கமாகவும் உள்ளது. வேளாண்மைச் சித்திரத்திற்கு ‘கருகியது’, ‘உலர்ந்துபோனது’ பொருத்தமான சொற்கள்.
  terminology: ‘சூரியன்,’ ‘வெப்பம்,’ ‘வேர்,’ ‘கருகுதல்,’ ‘உலர்ந்துபோதல்’ ஆகியவை பொதுவாகப் புரியக்கூடிய, பொருத்தமான நவீனத் தமிழ் சொற்கள். எந்த இறையியல் சொல் அல்லது விளக்கவுரையையும் கூடுதலாகச் சேர்க்கவில்லை.
