  text: ἡλίου δὲ ἀνατείλαντος ἐκαυματίσθη καὶ διὰ τὸ μὴ ἔχειν ῥίζαν ἐξηράνθη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/006.yaml
  text: But when the sun rose[a], it was scorched, and because it had no root, it withered away.
translation:
  language: ta
  text: ஆனால் சூரியன் உதித்தபோது அது வெப்பத்தால் கருகியது; வேர் இல்லாததால் உலர்ந்துபோனது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡλίου δὲ ἀνατείλαντος
  choice: ஆனால் சூரியன் உதித்தபோது
  rationale: இந்தப் பிறப்புநிலைத் தொடர் காலச் சூழலைக் குறிக்கிறது. δέ கூறும் மென்மையான முரண்பாட்டை இயல்பான தமிழில் ‘ஆனால்’ வெளிப்படுத்துகிறது.
- source_word: ἐκαυματίσθη
  choice: வெப்பத்தால் கருகியது
  rationale: சூரிய வெப்பத்தால் செடி பொசுங்கிக் கருகுவதைச் சுட்டும் செயப்பாட்டு வடிவம். ‘வெப்பத்தால்’ என்பது காரணத்தைத் தமிழில் தெளிவாக்குகிறது; ‘கருகியது’ தாவரச் சூழலுக்கு இயல்பானது.
- source_word: διὰ τὸ μὴ ἔχειν
  choice: இல்லாததால்
  rationale: διά + பெயருருபேற்ற வினையெச்சம் வெளிப்படையான காரணத்தைத் தெரிவிக்கிறது; தமிழில் காரண விகுதி இயல்பாக அதைப் பாதுகாக்கிறது.
- source_word: ῥίζαν
  choice: வேர்
  rationale: கிரேக்க மூலத்தின் ஒருமையைப் பாதுகாக்கிறது; தமிழிலும் பொதுப்பொருளில் ஒருமை இயல்பானது.
- source_word: ἐξηράνθη
  choice: உலர்ந்துபோனது
  rationale: தாவரம் முற்றிலும் வாடி உலர்வதைக் குறிக்கும் ξηραίνω என்பதன் சூழல்சார் பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
