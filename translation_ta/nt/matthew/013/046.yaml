id: MAT.13.46
reference: Matthew 13:46
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂εὑρὼν δὲ⸃ ἕνα πολύτιμον μαργαρίτην ἀπελθὼν πέπρακεν πάντα ὅσα εἶχεν καὶ ἠγόρασεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/046.yaml
  text: and having found one pearl of great value[a], he went away, sold all that he had, and bought it.
translation:
  language: ta
  text: மிகுந்த மதிப்புள்ள ஒரு முத்தைக் கண்டபின், அவன் போய்த் தனக்கு இருந்த அனைத்தையும் விற்று, அதை வாங்கினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விலைமதிப்புள்ள ஒரு முத்தை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρὼν δὲ
  choice: கண்டதும்
  rationale: இறந்தகால வினையெச்சம் முதன்மை வினைகளுக்கு முந்திய செயலைக் குறிக்கிறது; δέ இங்கு மென்மையான தொடரிணைப்பு என்பதால், தமிழில் தனியே இணைப்புச்சொல் சேர்க்காமல் இயல்பான நிகழ்வுத் தொடராக வழங்கப்பட்டுள்ளது.
- source_word: ἕνα
  choice: ஒரே ஒரு
  rationale: கிரேக்க மூலத்தில் எண் வெளிப்படையாக உள்ளது; தனித்துவமான அந்த ஒரு முத்தை வலியுறுத்த இயல்பான தமிழில் ‘ஒரே ஒரு’ என வழங்கப்பட்டுள்ளது.
- source_word: πολύτιμον
  choice: மிகுந்த மதிப்புள்ள
  rationale: பொருளின் அபாரமான மதிப்பை நவீன, தெளிவான தமிழில் தெரிவிக்கிறது; ‘விலைமதிப்புள்ள’ என்பதும் சாத்தியம்.
- source_word: μαργαρίτην
  choice: முத்தை
  rationale: இச்சொல்லின் வழக்கமான, சூழலுக்குப் பொருத்தமான தமிழ்ச் சமமான சொல்.
- source_word: ἀπελθὼν
  choice: போய்
  rationale: செயல்களின் வரிசையை இயல்பான தமிழில் வினையெச்சமாகப் பாதுகாக்கிறது.
- source_word: πέπρακεν
  choice: விற்று
  rationale: முற்றுப்பெற்ற விற்பனைச் செயலை நிகழ்வுத் தொடரில் இயல்பான தமிழ் வினையெச்சமாகக் காட்டுகிறது.
- source_word: πάντα ὅσα εἶχεν
  choice: தனக்கு இருந்த அனைத்தையும்
  rationale: πάντα என்பதன் முழுமையையும் ὅσα εἶχεν என்பதன் உடைமைப் பொருளையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἠγόρασεν
  choice: வாங்கினான்
  rationale: எளிய இறந்தகால முதன்மை வினையாக இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: αὐτόν
  choice: அதை
  rationale: இலக்கணப் பால் ஆண்பாலாக இருந்தாலும், அது உயிரற்ற ‘முத்தை’ச் சுட்டுவதால் தமிழில் ‘அதை’ என்பதே இயல்பு.
