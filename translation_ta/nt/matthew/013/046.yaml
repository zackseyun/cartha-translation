  register: நவீன பொதுத்தமிழில், கண்ணியமானதும் எளிதில் புரியக்கூடியதுமான நடை. மூலத்தின் செயல்முறை வரிசையும் ἕνα என்பதன் வலியுறுத்தலும் பாதுகாக்கப்பட்டுள்ளன.
