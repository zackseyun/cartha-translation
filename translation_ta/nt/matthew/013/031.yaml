id: MAT.13.31
reference: Matthew 13:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔσπειρεν ἐν τῷ ἀγρῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/031.yaml
  text: He set another parable before them, saying, “The kingdom of heaven is like a mustard seed, which a man took and sowed in his field.”
translation:
  language: ta
  text: அவர் வேறொரு உவமையை அவர்கள்முன் வைத்து, “பரலோக அரசு ஒரு கடுகு விதையைப் போன்றது. ஒருவன் அதை எடுத்துத் தன் வயலில் விதைத்தான்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέθηκεν
  choice: அவர்கள்முன் வைத்து
  rationale: παρατίθημι என்பதன் ‘முன்வைத்தல்/எடுத்துரைத்தல்’ என்ற உவமையான பொருளைத் தக்கவைத்து, தமிழில் இயல்பாக அமைகிறது.
- source_word: παραβολὴν
  choice: உவமையை
  rationale: சினாப்டிக் போதனைச் சூழலில் παραβολή குறிக்கும் கதைவடிவ ஒப்புமைக்கு ‘உவமை’ என்பது நிலைபெற்ற, புரிந்துகொள்ள எளிய தமிழ்ச் சொல்.
- source_word: Ὁμοία ἐστὶν
  choice: போன்றது
  rationale: ஒப்புமையை அறிமுகப்படுத்தும் கிரேக்கச் சொற்றொடரின் இயல்பான தமிழ் இணை.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: பரலோக அரசு
  rationale: βασιλεία என்பதில் உள்ள ஆட்சியும் ஆளுகைக்குட்பட்ட அரசும் ஆகிய பொருள் விரிவை ‘அரசு’ தக்கவைக்கிறது; ‘பரலோக’ என்பது மத்தேயுவின் வழக்கமான τῶν οὐρανῶν சொல்லாட்சியைப் பிரதிபலிக்கிறது.
- source_word: κόκκῳ σινάπεως
  choice: ஒரு கடுகு விதையை
  rationale: κόκκος என்பது விதை அல்லது தானியைக் குறிக்கலாம்; இச்சூழலில் ‘கடுகு விதை’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: ஒருவன் அதை எடுத்து
  rationale: ἄνθρωπος இங்கு உவமையின் தனிப்பட்ட ஆண் செயற்பாட்டாளரைக் குறிக்கிறது; λαβών என்ற முன்னிகழ்வுச் செயலை இயல்பான தமிழ் வினையெச்சத்தால் தருகிறது.
- source_word: ἔσπειρεν
  choice: விதைத்தான்
  rationale: σπείρω என்பதன் விதையை விதைக்கும் குறிப்பான வேளாண் செயலைத் துல்லியமாகத் தருகிறது.
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: தன் வயலில்
  rationale: ἀγρός என்பதற்கு இவ்வேளாண் சூழலில் ‘வயல்’ இயல்பானது; αὐτοῦ எழுவாயையே சுட்டுவதால் தமிழ் தற்சுட்டுப் பெயரான ‘தன்’ பொருத்தமானது.
theological_decisions:
- issue: மத்தேயுவின் βασιλεία τῶν οὐρανῶν என்ற சொல்லாட்சியை மொழிபெயர்த்தல்
  choice: பரலோக அரசு
  alternative: பரலோக ஆட்சி; வானங்களின் அரசு
  rationale: ‘அரசு’ என்பது ஆட்சி என்ற இயக்கத்தையும் அரசின் பரப்பையும் முன்கூட்டியே ஒன்றாக மட்டும் குறுக்காமல் இடமளிக்கிறது. ‘பரலோக’ என்பது மத்தேயுவுக்குரிய சொல்லாட்சியை அறியத்தக்க வகையில் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சுருக்கமானதும் கண்ணியமானதும் வாய்மொழியாக வாசிக்க இயல்பானதுமான நடை. கிரேக்க வாக்கியத்தின் ஒப்புமை மற்றும் வேளாண் உருவகம் பாதுகாக்கப்பட்டுள்ளன.
