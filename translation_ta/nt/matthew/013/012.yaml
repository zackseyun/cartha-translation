id: MAT.13.12
reference: Matthew 13:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅστις γὰρ ἔχει, δοθήσεται αὐτῷ καὶ περισσευθήσεται· ὅστις δὲ οὐκ ἔχει, καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/012.yaml
  text: For whoever has[a], more will be given to him, and he will have an abundance; but whoever does not have[b], even what he has will be taken from him.
translation:
  language: ta
  text: ஏனெனில், யார் வைத்திருக்கிறாரோ அவருக்குக் கொடுக்கப்படும்[a], அவரிடம் ஏராளமாக இருக்கும்; ஆனால் யார் வைத்திருக்கவில்லையோ, அவரிடம் இருப்பதும்கூட அவரிடமிருந்து எடுத்துக்கொள்ளப்படும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மேலும்’ என்பது கிரேக்கத்தில் வெளிப்படையாக இல்லை; சொல்லுக்கு நெருக்கமாக, ‘அவருக்குக் கொடுக்கப்படும்; அவரிடம் ஏராளமாக இருக்கும்.’
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் ‘அவருக்கு ... அவரிடமிருந்து’ என்பவை பொதுப்பொருளில் பயன்படுத்தப்பட்ட ஆண்பால் ஒருமை வடிவங்கள்.
    reason: cultural_note
lexical_decisions:
- source_word: ὅστις
  choice: யார் ... அவருக்கு / அவரிடம்
  rationale: குறிப்பிடப்படாத எவரையும் உள்ளடக்கும் பொதுவான நிபந்தனைப் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையைப் பாதுகாக்கிறது.
- source_word: ἔχει / οὐκ ἔχει
  choice: வைத்திருக்கிறார் / வைத்திருக்கவில்லை
  rationale: கிரேக்கத்தில் பொருள் வெளிப்படையாகக் கூறப்படாததுபோலவே தமிழிலும் எதை வைத்திருக்கிறார் என்பதைச் சேர்க்காமல் விடுகிறது.
- source_word: δοθήσεται αὐτῷ
  choice: அவருக்குக் கொடுக்கப்படும்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தையும் பெறுபவரையும் நேரடியாகத் தருகிறது; கிரேக்கத்தில் இல்லாத ‘மேலும்’ என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: περισσευθήσεται
  choice: அவர் மிகுதியாகப் பெறுவார்
  rationale: மிகுதியாகும் விளைவை இயல்பான தமிழில் தெரிவிக்கிறது; ‘அவர் பெருகுவார்’ என்ற தெளிவில்லாத சொற்றொடரைத் தவிர்க்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: இரு நிலைகளுக்கிடையிலான தெளிவான முரண்பாட்டைக் காட்டுகிறது.
- source_word: καὶ ὃ ἔχει
  choice: அவரிடம் இருப்பதும்கூட
  rationale: καί என்பதன் வலியுறுத்தும் ‘கூட’ பொருளையும் முரண்மிகு கருத்தையும் பாதுகாக்கிறது.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: அவரிடமிருந்து எடுத்துக்கொள்ளப்படும்
  rationale: நீக்கப்படுதல் அல்லது பறிக்கப்படுதல் என்ற செயப்பாட்டு எண்ணத்தைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: ‘வைத்திருக்கிறார்’ என்பதன் மறைந்துள்ள பொருள்
  choice: எதை வைத்திருக்கிறார் என்பதைக் குறிப்பிடாமல் விட்டது
  alternative: புரிந்துகொள்ளுதல், ஏற்றுக்கொள்ளும் மனம், அல்லது அரசின் இரகசியங்களை வைத்திருப்பதாக வெளிப்படையாக விளக்குதல்
  rationale: சூழல் இயேசுவின் போதனையை ஏற்றுக்கொள்வதோடு தொடர்புடையதாயினும், கிரேக்க உரை பொருளை வெளிப்படையாகக் குறிப்பிடவில்லை; எனவே கூற்றின் பரந்த பொருளும் இறையியல் அழுத்தமும் பாதுகாக்கப்படுகின்றன.
- issue: பொதுப்பொருளில் வரும் ஆண்பால் ஒருமை வடிவங்கள்
  choice: பாலினத்தைக் குறிப்பாகச் சுட்டாத மரியாதை ஒருமையான ‘யார் ... அவர்’ வடிவம்
  alternative: ஆண்பாலை வெளிப்படையாகக் காட்டும் ‘எவன் ... அவன்’ வடிவம்
  rationale: கிரேக்க ஆண்பால் ஒருமை இங்கு பிரதிநிதித்துவமான பொதுப்பொருளில் வருகிறது. நவீனத் தமிழில் ‘யார் ... அவர்’ அதே ஒருமை மற்றும் பொதுப்பொருளை இயல்பாகத் தருகிறது; அடிக்குறிப்பு மூல இலக்கண வடிவத்தைத் தெரிவிக்கிறது.
- issue: δοθήσεται உடன் மறைந்துள்ள கொடுப்புப் பொருள்
  choice: ‘அவருக்குக் கொடுக்கப்படும்’ என்று மட்டும் மொழிபெயர்த்தது
  alternative: ‘அவருக்கு மேலும் கொடுக்கப்படும்’
  rationale: கிரேக்கத்தில் கொடுக்கப்படுவது எது அல்லது ‘மேலும்’ என்பது வெளிப்படையாக இல்லை. அடுத்த வினை மிகுதியைக் காட்டினாலும், முதன்மை உரையில் அந்தச் சொல்லைச் சேர்க்காமல் மூலத்தின் சுருக்கத்தையும் மறைபொருளையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் பொதுவாசகத் தெளிவும் கொண்ட நடையைப் பயன்படுத்துகிறது. கிரேக்கத்தின் ஒருமை அமைப்பை ‘யார் ... அவர்’ மூலம் காக்கிறது; எதை வைத்திருப்பது என்ற மறைபொருளை விளக்கிச் சுருக்காமல் அப்படியே விடுகிறது.
