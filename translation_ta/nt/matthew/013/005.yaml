source:
  edition: SBLGNT
  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὰ πετρώδη ὅπου οὐκ εἶχεν γῆν πολλήν, καὶ εὐθέως ἐξανέτειλεν διὰ τὸ μὴ ἔχειν βάθος γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/005.yaml
  text: Other seed fell on rocky ground[a], where it did not have much soil, and it sprang up at once because it had no depth of soil,
translation:
  language: ta
  text: வேறு சில விதைகளோ பாறையான இடங்களில்[a] விழுந்தன. அங்கே அதிக மண் இல்லை; மண் ஆழமாக இல்லாததால் அவை உடனே முளைத்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், ‘பாறையான இடங்களில்’; கீழே பாறையும் அதன்மேல் ஆழமற்ற மண்ணும் இருந்த இடங்களை இச்சொற்றொடர் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα δὲ
  choice: வேறு சில விதைகளோ
  rationale: ἄλλα என்பது முன்வசனத்திலுள்ள விதைகளை மறைமுகமாகக் குறிக்கும் நடுநிலைப் பன்மைச் சொல். தமிழில் பொருள் தெளிவாக இருக்க ‘விதைகள்’ சேர்க்கப்பட்டு, δέ காட்டும் வேறுபாடு ‘-ஓ’ மூலம் இயல்பாக வெளிப்படுத்தப்படுகிறது.
- source_word: ἔπεσεν
  choice: விழுந்தன
  rationale: மூலவினை நேரடியாக ‘விழுதல்’ என்பதைக் குறிக்கிறது; ‘விதைக்கப்பட்டன’ என்று மொழிபெயர்ப்பது மூலத்தில் இல்லாத செயப்பாட்டு விளக்கத்தைச் சேர்க்கும்.
- source_word: ἐπὶ τὰ πετρώδη
  choice: பாறையான இடங்களில்[a]
  rationale: πετρώδη என்பது கற்கள் சிதறிய நிலத்தை மட்டும் அல்லாமல், கீழே பாறையும் மேலே ஆழமற்ற மண்ணும் உள்ள இடங்களைக் குறிக்க முடியும். ‘பாறையான இடங்கள்’ மூலத்தின் பன்மையையும் படிமத்தையும் காக்கிறது; அதன் சூழல்சார் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ὅπου οὐκ εἶχεν γῆν πολλήν
  choice: அங்கே அதிக மண் இல்லை
  rationale: வேளாண்மைச் சூழலில் γῆ என்பதற்கு ‘மண்’ இயல்பான தேர்வு. கிரேக்கத் தொடரின் கருத்தைத் தெளிவான நவீனத் தமிழில் நேரடியாக வழங்குகிறது.
- source_word: καὶ εὐθέως ἐξανέτειλεν
  choice: அவை உடனே முளைத்தன
  rationale: ἐξανέτειλεν இங்கு விதை முளைத்து மேலெழுவதைக் குறிக்கிறது; εὐθέως என்பதன் உடனடித் தன்மையை ‘உடனே’ காக்கிறது. தமிழில் ‘விதைகள்’ என்பதற்கேற்ப பன்மை வினை பயன்படுத்தப்படுகிறது.
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: மண் ஆழமாக இல்லாததால்
  rationale: διά உடன் வரும் பெயராக்கப்பட்ட வினைத்தொடர் காரணத்தைக் காட்டுகிறது. ‘மண் ஆழமாக இல்லாததால்’ என்பது βάθος γῆς என்ற ஆழமற்ற மண் படிமத்தை இயல்பாகவும் தெளிவாகவும் தருகிறது.
