  source_fidelity: கிரேக்க மூலத்தின் காலத் தொடர்பான καὶ ἐγένετο ὅτε மரபுத்தொடர் இயல்பாக ‘…போது’ என வழங்கப்பட்டுள்ளது. ἐτέλεσεν என்பதன் நிறைவுப் பொருளும், παραβολὰς ταύτας என்பதன் ‘இந்த உவமைகள்’ குறியீடும், μετῆρεν ἐκεῖθεν என்பதன் இடத்தைவிட்டு நீங்கும் பொருளும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. ‘சொல்லி முடித்த’ என்பது உவமைகளைப் போதித்த சூழலில் இயல்பானதும் பொருளுக்கு ஏற்றதுமாகும்.
