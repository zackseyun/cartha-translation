  text: καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς τὰς παραβολὰς ταύτας, μετῆρεν ἐκεῖθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/053.yaml
  text: And when Jesus had finished these parables[a], he departed from there.
translation:
  language: ta
  text: இயேசு இந்த உவமைகளைச் சொல்லி முடித்தபோது, அங்கிருந்து புறப்பட்டுச் சென்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἐγένετο ὅτε
  choice: …போது
  rationale: இச்சொற்றொடர் கதையின் அடுத்த நிகழ்வை அறிமுகப்படுத்தும் காலத் தொடர்புடைய மரபுத்தொடர். ‘அப்போது நிகழ்ந்ததாவது’ என்று சொற்சொல்லாக மொழிபெயர்ப்பதைவிட, இயல்பான நவீன தமிழில் ‘…போது’ என்பது காலத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐτέλεσεν
  choice: சொல்லி முடித்த
  rationale: τελέω என்பதன் அடிப்படைப் பொருள் முடிவுக்குக் கொண்டுவருதல். இங்கு உவமைகள் இயேசுவால் பேசப்பட்ட போதனைகள் என்பதால், தமிழில் இயல்பாக ‘சொல்லி முடித்த’ என்று வழங்கப்பட்டுள்ளது.
- source_word: παραβολὰς ταύτας
  choice: இந்த உவமைகளை
  rationale: παραβολή என்பதற்கான நிலைபெற்ற தமிழ் வேதாகமச் சொல் ‘உவமை’; ταύτας என்பது உடனே முன்பு கூறப்பட்ட உவமைகளைச் சுட்டுவதால் ‘இந்த’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: μετῆρεν
  choice: புறப்பட்டுச் சென்றார்
  rationale: μεταίρω இங்கு ஓர் இடத்திலிருந்து நீங்கிச் செல்வதைக் குறிக்கிறது. ‘புறப்பட்டுச் சென்றார்’ என்பது அந்த இயக்கப் பொருளை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐκεῖθεν
  choice: அங்கிருந்து
  rationale: இடத்திலிருந்து நீங்குவதைச் சுட்டும் ἐκεῖθεν என்பதற்கு ‘அங்கிருந்து’ நேரான, இயல்பான இணைச்சொல்.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தரத் தமிழ்; எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. கிரேக்கக் கதையாடல் மரபுத்தொடர் தமிழில் கடினமாக ஒலிக்காதபடி இயல்பான காலவாக்கியமாக வழங்கப்பட்டுள்ளது.
