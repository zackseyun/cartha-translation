source:
  edition: SBLGNT
  text: Τότε οἱ δίκαιοι ἐκλάμψουσιν ὡς ὁ ἥλιος ἐν τῇ βασιλείᾳ τοῦ πατρὸς αὐτῶν. ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/043.yaml
  text: Then the righteous will shine like the sun in the kingdom of their Father. The one who has ears, let him hear.
translation:
  language: ta
  text: அப்போது நீதிமான்கள் தங்கள் தந்தையின் அரசில் சூரியனைப்போல் ஒளிவீசுவார்கள்.[a] காதுகள் உள்ளவன் கேட்கட்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பிரகாசிப்பார்கள்.’
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில், ‘காதுகள் உள்ளவன் கேட்கட்டும்’—செவிகொடுத்து ஏற்றுக்கொள்ளுமாறு ஒவ்வொருவரையும் நோக்கி விடுக்கப்படும் பிரதிநிதித்துவ ஒருமை அழைப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: அப்போது
  rationale: முந்தைய விளக்கத்தில் கூறப்பட்ட இறுதிக்கால நிகழ்வைத் தொடர்ந்து வருவதைக் குறிக்கும் இயல்பான காலச் சொல்.
- source_word: οἱ δίκαιοι
  choice: நீதிமான்கள்
  rationale: ஒழுக்க மற்றும் இறைஉறவு சார்ந்த இரு பரிமாணங்களையும் தேவையின்றி குறுக்காமல் தக்கவைக்கும் வழக்கமான தமிழ் இணைச்சொல்.
- source_word: ἐκλάμψουσιν
  choice: ஒளிவீசுவார்கள்
  rationale: ἐκλάμπω என்பதன் ‘வெளிப்படையாக ஒளிர்தல்’ என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது; சூரிய உவமை அதன் பிரகாசத்தைத் தெளிவாக்குகிறது.
- source_word: ὡς ὁ ἥλιος
  choice: சூரியனைப்போல்
  rationale: ὡς குறிக்கும் ஒப்புமையையும் மூலப்படிமத்தையும் நேரடியாகத் தக்கவைக்கிறது.
- source_word: ἐν τῇ βασιλείᾳ
  choice: அரசில்
  rationale: இங்கு ἐν உடன் வரும் βασιλεία, தந்தைக்குரிய ஆட்சிக்குட்பட்ட உலகம் அல்லது அரசு என்ற இடச்சார்ந்த கருத்தைக் கொண்டுள்ளது; ‘அரசில்’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: τοῦ πατρὸς αὐτῶν
  choice: தங்கள் தந்தையின்
  rationale: αὐτῶν என்பதன் பன்மைச் சுட்டை ‘தங்கள்’ தெளிவாக இணைக்கிறது; மூலத்தில் இல்லாத ‘பரலோக’ போன்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: ὁ ἔχων ὦτα
  choice: கேட்பதற்குக் காதுள்ளவன்
  rationale: கிரேக்கத்தின் ஒருமை பிரதிநிதித்துவ அழைப்பைத் தக்கவைத்து, தமிழில் இந்த மரபுத்தொடரின் நோக்கம் உடலுறுப்பு இருப்பதல்ல, செவிகொடுத்துக் கேட்பதே என்பதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀκουέτω
  choice: கேட்கட்டும்
  rationale: மூன்றாம் நபர் ஒருமை கட்டளையின் வலிமையைத் தக்கவைக்கிறது; வெறும் ஒலி கேட்டலை மட்டுமல்லாது கவனித்து ஏற்றுக்கொள்ளுதலையும் சூழல் உணர்த்த அனுமதிக்கிறது.
theological_decisions:
- issue: முடிவுரையின் பிரதிநிதித்துவ ஒருமை
  choice: ‘காதுள்ளவன் கேட்கட்டும்’ என்று ஒருமையைத் தக்கவைத்தல்
  alternative: ‘காதுள்ளவர்கள் கேட்கட்டும்’
  rationale: கிரேக்கம் ஆண்பால் வடிவிலான பிரதிநிதித்துவ ஒருமையையும் ஒருமைக் கட்டளையையும் பயன்படுத்துகிறது. தமிழில் ‘உள்ளவன்’ இந்த வடிவத்தையும் பொதுவான அழைப்பின் தன்மையையும் தக்கவைக்கிறது.
- issue: βασιλεία என்பதன் பொருள்
  choice: ‘அரசு’
  alternative: ‘ஆட்சி’
  rationale: ‘தங்கள் தந்தையின் அரசில்’ என்ற இடவுருபுத் தொடர் இங்கு எதிர்கால அரசுலகப் பரிமாணத்திற்கு இயல்பாகப் பொருந்துகிறது; அதேவேளை அரசாளுதலின் கருத்தையும் விலக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிதான நடையைப் பயன்படுத்துகிறது. ‘நீதிமான்கள்’, ‘அரசு’, ‘கேட்கட்டும்’ ஆகியவை வேதாகமச் செறிவைத் தக்கவைத்தாலும் பழமையான அல்லது கடினமான சொல்லாட்சியைத் தவிர்க்கின்றன.
