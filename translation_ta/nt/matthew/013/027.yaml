id: MAT.13.27
reference: Matthew 13:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: προσελθόντες δὲ οἱ δοῦλοι τοῦ οἰκοδεσπότου εἶπον αὐτῷ· Κύριε, οὐχὶ καλὸν σπέρμα ⸀ἔσπειρας ἐν τῷ σῷ ἀγρῷ; πόθεν οὖν ἔχει ζιζάνια;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/027.yaml
  text: So the slaves of the master of the house came to him and said[a], ‘Lord, did you not sow good seed in your field? Where then do the weeds come from?’
translation:
  language: ta
  text: வீட்டின் எஜமானுடைய அடிமைகள் அவனிடம் வந்து, “எஜமானே, நீர் உமது வயலில் நல்ல விதையைத்தானே விதைத்தீர்? அப்படியானால் களைகள்[a] எங்கிருந்து வந்தன?” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மாற்றாக, ‘டேர்ஸ்’ (tares) என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல், வளர்ச்சியின் தொடக்கத்தில் கோதுமையைப் போலத் தோன்றும் ‘டார்னல்’ எனப்படும் நச்சுக் களையைக் குறிக்கலாம்.
    reason: ζιζάνια என்பதற்கான பாரம்பரிய மாற்றையும் சாத்தியமான குறிப்பிட்ட தாவரவகையையும் விளக்குகிறது.
lexical_decisions:
- source_word: προσελθόντες
  choice: அவனிடம் வந்து
  rationale: வீட்டுத் தலைவனை நோக்கி அணுகியதை இயல்பான தமிழில் காட்டுகிறது; இது εἶπον என்பதற்கு முன் நிகழ்ந்த துணைச் செயல்.
- source_word: δοῦλοι
  choice: அடிமைகள்
  rationale: எஜமானின் அதிகாரத்தின்கீழ் கட்டுப்பட்டிருந்த இவர்களின் சமூக நிலையை ‘வேலைக்காரர்கள்’ என்று மென்மைப்படுத்தாமல் வெளிப்படுத்துகிறது.
- source_word: οἰκοδεσπότου
  choice: வீட்டுத் தலைவனுடைய
  rationale: வீட்டையும் அதன் ஆட்களையும் நிர்வகிக்கும் தலைவனைக் குறிக்கும் சொல்லின் குடும்பம் சார்ந்த அதிகாரப் பொருளைப் பாதுகாக்கிறது.
- source_word: Κύριε
  choice: எஜமானே
  rationale: இந்த உவமை உரையாடலில் இது வீட்டுத் தலைவனை மரியாதையுடன் அழைக்கும் விளிப்புச் சொல்; இங்கு நேரடியான கிறிஸ்தியல் பட்டமாகத் தவறாகப் புரிந்துகொள்ள வாய்ப்புள்ள ‘ஆண்டவரே’ என்பதைக் காட்டிலும் சூழலுக்கு இயல்பானது.
- source_word: οὐχὶ καλὸν σπέρμα ἔσπειρας
  choice: நீர் உமது வயலில் நல்ல விதையைத்தானே விதைத்தீர்?
  rationale: οὐχὶ எதிர்பார்க்கும் உறுதியான ‘ஆம்’ பதிலை ‘-த்தானே’ என்ற தமிழ்க் கேள்வி வடிவம் இயல்பாகத் தெரிவிக்கிறது; σπείρω என்பதற்கு துல்லியமான ‘விதைத்தீர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: πόθεν οὖν
  choice: அப்படியானால் … எங்கிருந்து
  rationale: πόθεν குறிக்கும் தோற்றுவாயையும் οὖν குறிக்கும் முடிவுரைக்கும் தொடர்பையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: ζιζάνια
  choice: களைகள்
  rationale: பயிரிடப்படாத தீங்கு தரும் செடிகளைப் பொதுவாகவும் தெளிவாகவும் குறிக்கிறது; குறிப்பிட்ட களைவகை அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: உவமையின் வீட்டுச் சூழலில் δοῦλοι என்பதன் மொழிபெயர்ப்பு
  choice: அடிமைகள்
  alternative: வேலைக்காரர்கள் / பணியாளர்கள்
  rationale: வசனம் அடிமைத்தனத்தை ஆதரிக்கும் கோட்பாட்டுக் கூற்றல்ல; எனினும் மூலச்சொல் சுட்டும் கட்டுப்பட்ட சமூக உறவை மென்மைப்படுத்தாமல் பாதுகாக்கிறது.
- issue: வீட்டுத் தலைவனை நோக்கிய κύριε என்ற விளிப்பு
  choice: எஜமானே
  alternative: ஆண்டவரே / ஐயா
  rationale: இங்கு சொல் உவமையிலுள்ள வீட்டுத் தலைவனை நோக்கிய மரியாதை விளிப்பாகச் செயல்படுகிறது. ‘எஜமானே’ என்பது அவனுக்கும் அடிமைகளுக்கும் உள்ள உறவைத் தெளிவாக்கி, இல்லாத நேரடி கிறிஸ்தியல் வலியுறுத்தலைச் சேர்ப்பதைத் தவிர்க்கிறது.
- issue: ἔχει ζιζάνια என்ற சொல்லமைப்பின் இயல்பான வெளிப்பாடு
  choice: இந்தக் களைகள் எங்கிருந்து வந்தன?
  alternative: அதில் களைகள் எப்படி இருக்கின்றன?
  rationale: கிரேக்கத்தில் வயல் ‘களைகளைக் கொண்டுள்ளது’ என்ற அமைப்பு இருந்தாலும், πόθεν கேட்பது அவற்றின் தோற்றுவாயை. தேர்ந்த வடிவம் அதைப் பொருள் மாறாமல் இயல்பான தமிழில் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதை ஒருமைக்காக ‘நீர்/விதைத்தீர்’ பயன்படுத்தப்பட்டுள்ளது. உரை கண்ணியமாகவும் சாதாரண வாசகருக்கு எளிதாகவும் வைக்கப்பட்டுள்ளது; ‘அடிமைகள்’ மட்டும் மூலத்தின் சமூக நிலையைத் திட்டமிட்டு வெளிப்படையாகப் பாதுகாக்கிறது.
