  text: ὁ δὲ ἀγρός ἐστιν ὁ κόσμος· τὸ δὲ καλὸν σπέρμα, οὗτοί εἰσιν οἱ υἱοὶ τῆς βασιλείας· τὰ δὲ ζιζάνιά εἰσιν οἱ υἱοὶ τοῦ πονηροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/038.yaml
  text: The field is the world[a], and the good seed—these are the sons of the kingdom. And the weeds are the sons of the evil one[c][b],
translation:
  language: ta
  text: வயல் என்பது உலகம்; நல்ல விதை—அவர்கள் அரசாட்சியின் மகன்கள்[b]. களைகளோ[a] தீயவனின் மகன்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘களைகள்’ என்பதற்கான கிரேக்கச் சொல், கோதுமையைப் போலத் தோன்றும் ‘களைக்கோதுமை’ என்ற களையை இன்னும் குறிப்பாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அரசாட்சியின் மகன்கள்’ என்பது அந்த அரசாட்சிக்குச் சொந்தமானவர்களைக் குறிக்கும் உறவுசார் மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: ἀγρός
  choice: வயல்
  rationale: வேளாண்மை உவமையின் காட்சியை இயல்பான நவீனத் தமிழில் நேரடியாகத் தக்கவைக்கிறது.
- source_word: κόσμος
  choice: உலகம்
  rationale: விதைப்பு நடைபெறும் பரந்த களமாகிய உலகைக் குறிக்கும் இச்சூழலுக்கான தெளிவான, வழக்கமான மொழிபெயர்ப்பு.
- source_word: καλὸν σπέρμα
  choice: நல்ல விதை
  rationale: வேளாண்மை உருவகத்தையும் களைகளுடனான எதிர்மறை ஒப்பீட்டையும் பாதுகாக்கிறது.
- source_word: οὗτοί εἰσιν
  choice: அவர்கள்
  rationale: ஒருமைத் தொகுப்புப்பெயரான ‘விதை’ குறிக்கும் மனிதர்கள் கிரேக்கத்தில் ஆண்பால் பன்மைச் சுட்டுப்பெயரால் அடையாளப்படுத்தப்படுகிறார்கள்; தமிழில் ‘அவர்கள்’ அந்த மனிதக் குறிப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: υἱοὶ τῆς βασιλείας
  choice: அரசாட்சியின் மகன்கள்
  rationale: υἱοί என்பதன் ஆண்பால் பன்மை வடிவத்தையும், βασιλεία என்பதன் ஆட்சி/அரசாட்சி கருத்தையும் தக்கவைக்கிறது; உறவுசார் மரபுத்தொடரின் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ζιζάνια
  choice: களைகள்
  rationale: பொதுவாசகர்களுக்கு உடனடியாகப் புரியும் சொல்; கோதுமையை ஒத்திருக்கும் குறிப்பிட்ட களையாக இருக்கக்கூடிய நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τοῦ πονηροῦ
  choice: தீயவனின்
  rationale: கட்டுரையுடன் வரும் ஆண்பால் ஒருமை வடிவம் தனிப்பட்ட தீய முகவரைக் குறிப்பதை இயல்பாகப் பிரதிபலிக்கிறது; ‘தீமை’ என்ற அருவப் பொருளாக மாற்றவில்லை.
theological_decisions:
- issue: τοῦ πονηροῦ என்பது அருவமான ‘தீமை’யையா, தனிப்பட்ட ‘தீயவனை’யா குறிக்கிறது?
  choice: தீயவன்
  alternative: தீமை
  rationale: கட்டுரையுடன் வரும் ஆண்பால் ஒருமை உருபும், எதிரெதிர் குழுக்களை விளக்கும் சூழலும் தனிப்பட்ட குறிப்பை வலுவாக ஆதரிக்கின்றன; அவன் யார் என்பதை மொழிபெயர்ப்பு கூடுதலாக அடையாளப்படுத்தவில்லை.
- issue: υἱοὶ என்பதை ‘மகன்கள்’ என்றா, உள்ளடக்கமான ‘பிள்ளைகள்’ என்றா மொழிபெயர்ப்பது?
  choice: மகன்கள்
  alternative: பிள்ளைகள்
  rationale: கிரேக்கத்தின் வெளிப்படையான ஆண்பால் பன்மையை முதன்மை உரையில் தக்கவைத்துள்ளது; இது குழுவைச் சேர்ந்தவர்களைக் குறிக்கும் உறவுசார் மரபுத்தொடர் என்பதையும் பெண்களை அவசியம் விலக்குவதில்லை என்பதையும் அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. கிரேக்கத்தின் மூன்று இணையான அடையாள விளக்கங்கள் அரைப்புள்ளி, நீள்கோடு, தனி வாக்கியம் ஆகியவற்றால் வாசிக்க எளிதாக அமைக்கப்பட்டுள்ளன. ‘இறையாட்சி’ என்று மூலத்தில் வெளிப்படையாக இல்லாத ‘இறை’ கூறு சேர்க்கப்படாமல் ‘அரசாட்சி’ பயன்படுத்தப்பட்டுள்ளது.
