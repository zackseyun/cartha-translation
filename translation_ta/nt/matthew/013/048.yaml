id: MAT.13.48
reference: Matthew 13:48
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἣν ὅτε ἐπληρώθη ἀναβιβάσαντες ἐπὶ τὸν αἰγιαλὸν καὶ καθίσαντες συνέλεξαν τὰ καλὰ εἰς ⸀ἄγγη, τὰ δὲ σαπρὰ ἔξω ἔβαλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/048.yaml
  text: When it was filled[a], they pulled it up onto the shore, sat down, and gathered the good fish into containers[b], but threw the rotten ones out.
translation:
  language: ta
  text: அது நிறைந்தபோது, அதை கரைக்கு இழுத்து வந்து, உட்கார்ந்து, நல்ல மீன்களைப் பாத்திரங்களில்[a] சேர்த்தார்கள்; கெட்டுப்போனவற்றையோ[b] வெளியே எறிந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கலன்களில்.’ கிரேக்கச் சொல் பொதுவாகப் பொருட்களை வைக்கும் கலன்களைக் குறிக்கிறது; அது கூடைகளையே குறிப்பதாக அவசியமில்லை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘கெட்டவற்றையோ.’ கிரேக்கச் சொல் ‘அழுகியவை,’ ‘கெட்டுப்போனவை,’ அல்லது பொதுவாக ‘பயனற்றவை’ என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν ὅτε ἐπληρώθη
  choice: அது நிறைந்தபோது
  rationale: ἣν என்பது முந்தைய வசனத்திலுள்ள வலையைக் குறிக்கிறது. தமிழ் இயல்புக்கேற்ப அதனை ‘அது’ எனத் தொடங்கி, ἐπληρώθη என்பதன் இறந்தகாலச் செயப்பாட்டு பொருளை ‘நிறைந்தபோது’ என வழங்குகிறது.
- source_word: ἀναβιβάσαντες ἐπὶ τὸν αἰγιαλόν
  choice: அதை கரைக்கு இழுத்து வந்து
  rationale: வலையை நீரிலிருந்து மேலே இழுத்துக் கரைக்குக் கொண்டுவரும் செயலை இயல்பான தமிழில் தெரிவிக்கிறது; αἰγιαλός என்பதை மணற்கரை என்று தேவையின்றிக் குறிப்பாக்காமல் ‘கரை’ என்கிறது.
- source_word: καθίσαντες
  choice: உட்கார்ந்து
  rationale: தொடர்ந்து நிகழும் அடுத்த செயலை எளிய, தற்போதைய தமிழில் வெளிப்படுத்துகிறது.
- source_word: συνέλεξαν τὰ καλὰ
  choice: நல்ல மீன்களைப் ... சேர்த்தார்கள்
  rationale: τὰ καλὰ என்பதில் ‘மீன்கள்’ வெளிப்படையாக இல்லாவிட்டாலும், மீன்பிடி வலையின் சூழலில் அதுவே குறிக்கப்படுவதால் தமிழில் தெளிவுக்காகச் சேர்க்கப்பட்டுள்ளது.
- source_word: εἰς ἄγγη
  choice: பாத்திரங்களில்
  rationale: ἄγγη என்பது கூடை என்று கட்டுப்படுத்தாத, பொருட்களை வைக்கும் பொதுவான கலன்களைக் குறிக்கிறது. ‘பாத்திரங்கள்’ நவீன தமிழில் இயல்பான பொதுச்சொல்; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τὰ δὲ σαπρά
  choice: கெட்டுப்போனவற்றையோ
  rationale: σαπρός என்பதன் அழுகிய, கெட்டுப்போன, பயனற்ற என்ற பொருள் பரப்பில், மீன்களைக் குறிக்கும் concrete imagery-ஐ ‘கெட்டுப்போனவை’ காக்கிறது; பொதுவான ‘கெட்டவை’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பு தரப்படுகிறது.
- source_word: ἔξω ἔβαλον
  choice: வெளியே எறிந்தார்கள்
  rationale: நிராகரித்து வெளியே வீசும் செயலை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: உவமையிலுள்ள பிரித்தெடுக்கும் காட்சியின் விளக்கம்
  choice: இந்த வசனத்தை மீன்பிடி மற்றும் மீன்களைத் தரம் பிரிக்கும் காட்சியாகவே மொழிபெயர்த்தல்
  alternative: பின்னர் வரும் இறுதித் தீர்ப்பின் விளக்கத்தை முன்கூட்டியே உணர்த்தும் சொற்களைப் பயன்படுத்துதல்
  rationale: இவ்வசனம் உவமையின் காட்சியை மட்டுமே விவரிக்கிறது; அதன் இறையியல் விளக்கம் அடுத்த வசனங்களில் வருகிறது. ஆகவே அந்த விளக்கத்தை இங்கே மொழிபெயர்ப்புக்குள் புகுத்தாமல் காட்சியின் நிலையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குத் தெளிவான, இயல்பான, கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. தொடர்ச்சியான கிரேக்கப் பங்கேற்பு வினைகள் தமிழின் இயல்பான தொடர் வினையெச்சங்களாக வழங்கப்பட்டுள்ளன. ‘மீன்கள்’ சூழலிலிருந்து தெளிவுக்காக வெளிப்படுத்தப்பட்டுள்ளது; வலை என்ற பெயர் மீண்டும் தேவையின்றிச் சேர்க்கப்படவில்லை.
