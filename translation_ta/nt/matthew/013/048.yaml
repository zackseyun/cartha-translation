  source_fidelity: 'வரைவு கிரேக்க வாக்கியத்தின் தொடரையும் பொருளையும் துல்லியமாகக் காக்கிறது: வலை நிறைதல், கரைக்கு இழுத்துவருதல், உட்காருதல், நல்ல மீன்களைச் சேர்த்தல், கெட்டுப்போனவற்றை வெளியே எறிதல் ஆகியவை அனைத்தும் இடம்பெற்றுள்ளன. τὰ καλὰ என்பதற்குச் சூழல் தெளிவுக்காக ‘மீன்கள்’ சேர்க்கப்பட்டுள்ளது; இது பொருளை மாற்றவில்லை. ‘கெட்டுப்போனவை’ σαπρά என்பதன் அழுகிய/கெட்ட/பயனற்ற பொருள் எல்லைக்குள் இயல்பாக உள்ளது.'
  naturalness: நவீன நிலையான தமிழில் தொடர் வினையெச்ச அமைப்பு இயல்பாகவும் தெளிவாகவும் உள்ளது. ‘அதை கரைக்கு இழுத்து வந்து, உட்கார்ந்து’ என்பது நிகழ்வுகளின் வரிசையைச் சீராக வெளிப்படுத்துகிறது. ‘பாத்திரங்களில் சேர்த்தார்கள்’ வாசிக்கத்தக்கது; அடிக்குறிப்பு பொதுவான ‘கலன்கள்’ என்ற மாற்றையும் உரியவாறு தருகிறது.
  terminology: ‘கரை’ αἰγιαλός என்பதைக் குறிப்பாக்காமல் சரியாக வழங்குகிறது. ‘பாத்திரங்கள்’ ἄγγη-க்கான ஏற்கத்தக்க பொதுப் பயன்பாட்டுச் சொல்; அடிக்குறிப்பு அது கூடைகள் மட்டுமே அல்ல என்பதைத் தெளிவுபடுத்துகிறது. ‘கெட்டுப்போனவை’ உவமைக்காட்சியின் கான்கிரீட் தன்மையையும் நிராகரிப்பு வலிமையையும் காக்கிறது. அடிக்குறிப்பு அடையாளங்கள் உரையில் சரியான இடங்களில் உள்ளன.
