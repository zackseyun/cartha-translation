id: MAT.13.41
reference: Matthew 13:41
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀποστελεῖ ὁ υἱὸς τοῦ ἀνθρώπου τοὺς ἀγγέλους αὐτοῦ, καὶ συλλέξουσιν ἐκ τῆς βασιλείας αὐτοῦ πάντα τὰ σκάνδαλα καὶ τοὺς ποιοῦντας τὴν ἀνομίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/041.yaml
  text: The Son of Man will send out his angels[a], and they will gather out of his kingdom all causes of stumbling and those who practice lawlessness[b],
translation:
  language: ta
  text: மனிதகுமாரன் தம்முடைய தேவதூதர்களை அனுப்புவார். அவர்கள் அவருடைய அரசாட்சியிலிருந்து இடறலுக்குக் காரணமான அனைத்தையும்[a], நெறிமீறிச் செயல்படுகிறவர்களையும்[b] திரட்டுவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எல்லா இடறுகற்களையும்.” σκάνδαλα என்ற கிரேக்கச் சொல், மனிதர்களைப் பாவத்தில் விழவோ விசுவாசத்திலிருந்து விலகவோ செய்யும் மனிதர்கள், பொருள்கள் அல்லது தாக்கங்களைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “நெறிமீறலைச் செய்துவருகிறவர்களை.” இச்சொற்றொடர், நெறிமீறல் அவர்களுடைய தொடர்ச்சியான, பண்பாகிவிட்ட நடத்தை என்பதை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: அனுப்புவார்
  rationale: எதிர்கால வினை வடிவை இயல்பான தமிழில் தருகிறது; அதிகாரத்தோடு பணிக்கு அனுப்பும் கருத்தும் சூழலால் தெளிவாகிறது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: மத்தேயுவில் இயேசு பயன்படுத்தும் பட்டப்பெயரையும் தானியேல் நூலுடனான தொடர்பையும் காக்கும் நிலைபெற்ற தமிழ் வடிவம்.
- source_word: τοὺς ἀγγέλους αὐτοῦ
  choice: தம்முடைய தேவதூதர்களை
  rationale: இறுதித் தீர்ப்புச் சூழலில் ἄγγελοι மனிதத் தூதர்களை அல்ல, விண்ணுலகத் தூதர்களையே குறிக்கிறது. எழுவாயான மனிதகுமாரனைச் சுட்டுவதால் ‘தம்முடைய’ இயல்பான தமிழ்.
- source_word: συλλέξουσιν
  choice: ஒன்றுசேர்ப்பார்கள்
  rationale: சுற்றியுள்ள அறுவடை மற்றும் தீர்ப்பு உருவகத்துக்கு ஏற்றவாறு ‘திரட்டுதல்’ என்ற பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐκ τῆς βασιλείας αὐτοῦ
  choice: அவருடைய அரசிலிருந்து
  rationale: ἐκ குறிக்கும், அரசின் உள்ளிருந்து வெளியே அகற்றும் திசையை ‘-இலிருந்து’ காக்கிறது.
- source_word: πάντα τὰ σκάνδαλα
  choice: இடறலுக்குக் காரணமான அனைத்தையும்
  rationale: σκάνδαλα என்பது பிறரைப் பாவத்தில் விழவோ விலகவோ செய்யும் மனிதர்கள், பொருள்கள் அல்லது தாக்கங்கள் ஆகியவற்றை உள்ளடக்கக்கூடும்; இந்த விரிந்த பொருளைச் சுருக்காமல் காக்கிறது.
- source_word: τοὺς ποιοῦντας τὴν ἀνομίαν
  choice: நெறிமீறிச் செயல்படுகிறவர்களையும்
  rationale: நிகழ்காலப் பங்கேற்பு வினை தொடர்ச்சியான அல்லது பண்பாகிவிட்ட நடத்தையைச் சுட்டுகிறது. ἀνομία-வின் சட்டம் அல்லது இறைநெறியைப் பொருட்படுத்தாத கருத்தை ‘நெறிமீறி’ இயல்பாகத் தருகிறது.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου என்ற பட்டப்பெயரின் மொழிபெயர்ப்பு
  choice: மனிதகுமாரன்
  alternative: மானிட மகன்
  rationale: நிலைபெற்ற பட்டப்பெயரையும் அதன் மறைநூல் மற்றும் தானியேல் 7 பின்னணியையும் விளக்கவுரையால் மாற்றாமல் காக்கிறது.
- issue: σκάνδαλα என்பதன் தீர்ப்புச் சூழலிலான வீச்சு
  choice: இடறலுக்குக் காரணமான அனைத்தையும்
  alternative: எல்லா இடறுகற்களையும்
  rationale: மனிதர்கள், தாக்கங்கள், அல்லது பாவத்தில் விழச் செய்யும் பிற காரணங்கள் ஆகியவற்றில் ஒன்றாக மட்டும் பொருளைக் குறுக்காமல் மூலத்தின் உண்மையான பரப்பை வைத்திருக்கிறது.
- issue: ἀνομία என்பதன் ஒழுக்க-இறையியல் கருத்து
  choice: நெறிமீறிச் செயல்படுகிறவர்கள்
  alternative: அக்கிரமம் செய்கிறவர்கள்
  rationale: இது பொதுவான தீமையை மட்டும் அல்லாமல், உரிய நெறி அல்லது சட்டத்தைப் பொருட்படுத்தாமல் தொடர்ந்து நடப்பதைக் குறிக்கிறது; எந்தக் குறிப்பிட்ட சமயச் சட்ட அமைப்பையும் உரையில் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மனிதகுமாரன்’ மற்றும் ‘தேவதூதர்கள்’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; அரிதான சொல்லுக்குச் சொல் வடிவங்களுக்கு மாறாக இயல்பான வாக்கிய அமைப்பு தேர்ந்தெடுக்கப்பட்டுள்ளது.
