source:
  edition: SBLGNT
  text: οὐκ ἔχει δὲ ῥίζαν ἐν ἑαυτῷ ἀλλὰ πρόσκαιρός ἐστιν, γενομένης δὲ θλίψεως ἢ διωγμοῦ διὰ τὸν λόγον εὐθὺς σκανδαλίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/021.yaml
  text: Yet he has no root in himself[a], but is temporary. When affliction or persecution arises because of the word[b], he immediately falls away.
translation:
  language: ta
  text: ஆனால் அவனுக்குள் வேர் இல்லை; அவன் சிறிது காலமே நிலைத்திருக்கிறான். அந்தச் செய்தியின் காரணமாகத் துன்பமோ துன்புறுத்தலோ ஏற்படும்போது, உடனே இடறி விழுகிறான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தடுமாறுகிறான்” அல்லது “மனம் புண்படுகிறான்.” கிரேக்க வினைச்சொல் ஒருவரை இடறச் செய்வதையோ, அவர் மனம் புண்படுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζαν ἐν ἑαυτῷ
  choice: அவனுக்குள் வேர்
  rationale: உவமையின் வேளாண்மைச் சித்திரத்தைத் தக்கவைத்து, உள்ளார்ந்த வேரின்மையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πρόσκαιρός
  choice: சிறிது காலமே நிலைத்திருக்கிறான்
  rationale: ஒரு காலப்பகுதிக்கு மட்டும் நீடிப்பவன் என்ற பொருளை இயல்பாகத் தெரிவிக்கிறது; வெறும் பொருள்களைப் பற்றிப் பொதுவாகப் பயன்படுத்தப்படும் ‘தற்காலிகமானவன்’ என்பதைவிட மனிதரைப் பற்றிய சூழலில் தெளிவாக உள்ளது.
- source_word: γενομένης ... θλίψεως ἢ διωγμοῦ
  choice: துன்பமோ துன்புறுத்தலோ ஏற்படும்போது
  rationale: மூலத்தின் காலநிலை சார்ந்த genitive absolute அமைப்பையும், θλῖψις குறிக்கும் நெருக்கடி/துன்பத்தையும், διωγμός குறிக்கும் எதிர்ப்பினால் வரும் துன்புறுத்தலையும் தெளிவாகக் காட்டுகிறது.
- source_word: διὰ τὸν λόγον
  choice: அந்தச் செய்தியின் காரணமாக
  rationale: λόγος இங்கு உவமையில் அறிவிக்கப்பட்ட செய்தியைக் குறிக்கிறது. ‘அந்த’ என்பது முந்தைய சூழலில் குறிப்பிடப்பட்ட செய்தியோடு உள்ள தொடர்பைத் தெளிவாக்குகிறது.
- source_word: εὐθὺς
  choice: உடனே
  rationale: எதிர்ப்பு வந்தவுடன் நிகழும் உடனடியான வீழ்ச்சியைச் சுருக்கமாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: σκανδαλίζεται
  choice: இடறி விழுகிறான்
  rationale: σκανδαλίζω என்பதிலுள்ள இடறுதல் என்ற உருவகத்தையும், இச்சூழலில் செய்தியைத் தொடர்ந்து பற்றிக்கொள்ளாமல் வீழ்வதன் விளைவையும் ஒருங்கே வெளிப்படுத்துகிறது.
- source_word: δὲ ... ἀλλὰ ... δὲ
  choice: ஆனால் ...; ... ஏற்படும்போது
  rationale: மூலத்தின் மாறுபாட்டையும் நிகழ்வுகளின் தொடர்பையும் தமிழில் இயல்பாகக் காட்டுகிறது; எல்லா δέ துகள்களையும் தனித்தனியாக இயந்திரத்தனமாக மொழிபெயர்க்கவில்லை.
theological_decisions:
- issue: σκανδαλίζεται என்பதன் சீடத்துவச் சூழலிலான பொருள்
  choice: இடறி விழுகிறான்
  alternative: விசுவாசத்தை விட்டுவிடுகிறான்; மனம் புண்படுகிறான்
  rationale: ‘விசுவாசத்தை விட்டுவிடுகிறான்’ என்பது விளைவை மிகத் திட்டவட்டமாகத் தீர்மானிக்கக்கூடும்; ‘மனம் புண்படுகிறான்’ என்பது உணர்ச்சிசார் எதிர்வினையாகச் சுருக்கக்கூடும். தேர்ந்தெடுத்த மொழிபெயர்ப்பு மூல உருவகத்தையும் தொடர இயலாத வீழ்ச்சியையும் காத்து, இறையியல் பதற்றத்தைத் தீர்க்காமல் விடுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், உவமையின் உருவகத்தைத் தக்கவைக்கும் கண்ணியமான நடை. ‘துன்புறுத்தல்’ மற்றும் ‘செய்தி’ ஆகியவை சாதாரண வாசகருக்குத் தெளிவானவையாகத் தேர்ந்தெடுக்கப்பட்டன; தேவையற்ற சமயக் கலைச்சொற்கள் தவிர்க்கப்பட்டன.
