id: MAT.13.33
reference: Matthew 13:33
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ζύμῃ, ἣν λαβοῦσα γυνὴ ⸀ἐνέκρυψεν εἰς ἀλεύρου σάτα τρία ἕως οὗ ἐζυμώθη ὅλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/033.yaml
  text: 'He told them another parable: “The kingdom of heaven is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.”'
translation:
  language: ta
  text: 'அவர் அவர்களுக்கு வேறொரு உவமையைச் சொன்னார்: “பரலோக அரசாட்சி புளிப்புப் பொருளைப் போன்றது[a]. ஒரு பெண் அதை எடுத்து, மூன்று சாத்து அளவு மாவுக்குள்[b] மறைத்தாள்[c]; இறுதியில் மாவு முழுவதும் புளித்தது.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஈஸ்ட்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் மாவைப் புளிக்கச் செய்யும் புளிப்புப் பொருளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கில், ‘மூன்று சாத்து மாவு’; இது மிகப் பெரிய அளவு மாவைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: ‘அதற்குள் கலந்தாள்’ அல்லது ‘அதனுடன் பிசைந்தாள்’ என்றும் பொருள் கொள்ளலாம்; கிரேக்கில் நேரடியாக, ‘அதற்குள் மறைத்தாள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς
  choice: அவர் அவர்களுக்கு வேறொரு உவமையைச் சொன்னார்
  rationale: ἄλλην என்பதன் கூடுதல் பொருளை ‘வேறொரு’ காக்கிறது; உவமையை அறிமுகப்படுத்தும் சூழலில் ἐλάλησεν என்பதற்கு இயல்பான தமிழாக ‘சொன்னார்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: பரலோக அரசாட்சி
  rationale: மத்தேயுவுக்குரிய இச்சொற்றொடரின் ஆட்சியையும் ஆளுகையையும் ‘அரசாட்சி’ வெளிப்படுத்துகிறது; οὐρανῶν என்ற பன்மையைத் தமிழில் செயற்கையாகப் பிரதிபலிக்காமல் வழக்கான ‘பரலோக’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ζύμῃ
  choice: புளிப்பூட்டும் மாவு
  rationale: ζύμη என்பது மாவைப் புளிக்கச் செய்யும் புளிப்புப் பொருளைக் குறிக்கிறது. ‘புளிப்பூட்டும் மாவு’ என்பது இன்றைய வாசகருக்கு அதன் செயலையும் பொருளையும் தெளிவாகக் காட்டி, உவமையின் மதிப்பீட்டை முன்கூட்டியே தீர்மானிக்காது.
- source_word: ἐνέκρυψεν εἰς
  choice: மாவுக்குள் மறைத்துவைத்தாள்
  rationale: ἐγκρύπτω என்பதன் நேரடியான ‘உள்ளே மறைத்தல்’ என்ற படிமம் பாதுகாக்கப்படுகிறது; ‘கலந்தாள்’ என்பது இயல்பான சமையல் விளக்கமாயினும் சற்று விளக்கவுரையாகும்.
- source_word: ἀλεύρου σάτα τρία
  choice: மூன்று சாத்து அளவு மாவு
  rationale: σάτον என்ற பழங்கால அளவுப் பெயர் ‘சாத்து’ என ஒலிபெயர்க்கப்பட்டு, அது அளவைச் சுட்டுகிறது என்பதை ‘அளவு’ தெளிவாக்குகிறது. அதன் பெருமளவு தன்மை அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ἕως οὗ ἐζυμώθη ὅλον
  choice: மாவு முழுவதும் புளிக்கும்வரை
  rationale: ἐζυμώθη என்ற இறந்தகாலச் செயப்பாட்டு வடிவத்தையும் ὅλον என்ற முழுமையையும் இயல்பான தமிழில் காக்கிறது; ‘மாவு’ என்பதை மீண்டும் குறிப்பிடுவது தமிழ் வாசகருக்கு சுட்டுப்பெயர் குழப்பத்தைத் தவிர்க்கிறது.
theological_decisions:
- issue: அரசாட்சி உவமையில் ζύμη என்பதன் நேர்மறை அல்லது எதிர்மறை உட்பொருள்
  choice: மதிப்பீடு சேர்க்காமல் ‘புளிப்பூட்டும் மாவு’ என்று நடுநிலையாக மொழிபெயர்த்தல்
  alternative: வேறு வேதாகமப் பகுதிகளிலுள்ள எதிர்மறைப் பயன்பாட்டின் அடிப்படையில் இதைத் தீமையின் குறியீடாக மொழிபெயர்ப்பில் வெளிப்படுத்துதல்
  rationale: இவ்வசனமே புளிப்பூட்டும் மாவை நேர்மறை அல்லது எதிர்மறை என்று வெளிப்படையாக மதிப்பிடவில்லை. மறைந்திருந்து முழுவதையும் ஊடுருவும் படிமத்தை மட்டும் மொழிபெயர்ப்பு காக்க வேண்டும்; அதன் இறையியல் மதிப்பீட்டை வாசகருக்காகத் தீர்மானிக்கக்கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் உவமையின் செறிவைக் காக்கும் கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘ராஜ்யம்’ என்பதற்குப் பதிலாக இயல்பான ‘அரசாட்சி’ பயன்படுத்தப்பட்டுள்ளது; பழங்கால அளவுப் பெயர் முதன்மை உரையில் காக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
