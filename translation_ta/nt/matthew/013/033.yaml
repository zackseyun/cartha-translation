  naturalness: ‘புளிப்பூட்டும் மாவு’ என்பது சாதாரண மாவுடன் குழப்பம் தரக்கூடும்; ‘புளிப்புப் பொருள்’ தெளிவானது. திருத்தப்பட்ட உரை நவீனத் தரத் தமிழில் இயல்பாகவும், வினைத் தொடரின் முடிவைத் தெளிவாகவும் கூறுகிறது.
