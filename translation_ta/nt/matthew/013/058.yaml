  text: καὶ οὐκ ἐποίησεν ἐκεῖ δυνάμεις πολλὰς διὰ τὴν ἀπιστίαν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/058.yaml
  text: And he did not do many mighty works there because of their unbelief[a].
translation:
  language: ta
  text: அவர்களுடைய விசுவாசமின்மையின் காரணமாக, அவர் அங்கே பல வல்லமையான செயல்களைச் செய்யவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பல அற்புதங்கள்’ அல்லது ‘வல்லமையின் பல செயல்கள்.’ கிரேக்கச் சொல் வல்லமையை வெளிப்படுத்தும் செயல்களைக் குறிக்கிறது; இச்சூழலில் அது அற்புதச் செயல்களைச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὐκ ἐποίησεν
  choice: அவர் ... செய்யவில்லை
  rationale: καί தொடரும் கதை இணைப்பாக உள்ளது; தமிழில் தனி வசனமாக இயல்பாக ஒலிக்க அதை வெளிப்படையாக மொழிபெயர்க்காமல் விடலாம். οὐκ ἐποίησεν என்பது இயலாமையைக் குறிக்காமல், அவர் செய்யவில்லை என்ற செயலின்மையை மட்டுமே கூறுகிறது.
- source_word: ἐκεῖ
  choice: அங்கே
  rationale: அவருடைய சொந்த ஊராகிய முன்சூழலில் குறிப்பிடப்பட்ட இடத்தைக் காட்டும் நேரடியான இடவினையடை.
- source_word: δυνάμεις πολλὰς
  choice: பல வல்ல செயல்களை
  rationale: δύναμις இச்சூழலில் வல்லமையை வெளிப்படுத்தும் அற்புதச் செயல்களைக் குறிக்கிறது. ‘வல்ல செயல்கள்’ என்பது ‘அற்புதங்கள்’ என்ற விளக்கமான சொல்லாக மட்டும் சுருக்காமல், வல்லமை என்ற சொற்பொருள் தொடர்பையும் காக்கிறது; πολλάς என்பது ‘பல’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: அவர்களுடைய அவநம்பிக்கையின் காரணமாக
  rationale: διά + வேற்றுமை உருபு காரணத்தைக் குறிக்கிறது. ἀπιστία என்பது நம்பாமை அல்லது விசுவாசமின்மையைக் குறிக்கிறது; ‘அவநம்பிக்கை’ அவர்களுடைய நிராகரிப்பை இயல்பாகவும் வலுவாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: அவநம்பிக்கையால் அவர் செய்ய இயலவில்லை என்று வசனம் கூறுகிறதா, அல்லது அவர் செய்யவில்லை என்று மட்டும் கூறுகிறதா?
  choice: ‘அவர் ... செய்யவில்லை’
  alternative: ‘அவர் ... செய்ய முடியவில்லை’
  rationale: மூல கிரேக்கம் οὐκ ἐποίησεν என்று, ‘செய்யவில்லை’ எனக் கூறுகிறது; இயலாமையைக் குறிக்கும் வினைச்சொல் இல்லை. ஆகவே மத்தேயு கூறுவதைவிட வலுவான இறையியல் முடிவைச் சேர்க்காமல், செயலின்மையாகவே மொழிபெயர்க்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழ்; எளிதில் புரியும், அதே நேரத்தில் கண்ணியமான நடை. ‘வல்ல செயல்கள்’ மூலத்தின் வல்லமை சார்ந்த சொற்பொருளையும் அற்புதச் சூழலையும் சமநிலைப்படுத்துகிறது.
