id: MAT.13.11
reference: Matthew 13:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν ⸀αὐτοῖς· Ὅτι ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τῶν οὐρανῶν, ἐκείνοις δὲ οὐ δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/011.yaml
  text: He answered them[a], “To you it has been given to know the mysteries of the kingdom of heaven[b], but to them it has not been given.”
translation:
  language: ta
  text: 'அவர் அவர்களுக்குப் பதிலளித்தார்: “பரலோக அரசின் மறைபொருள்களை அறிந்துகொள்ள உங்களுக்குக் கொடுக்கப்பட்டுள்ளது[a]; ஆனால் அவர்களுக்கோ கொடுக்கப்படவில்லை.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கொடுக்கப்பட்டுள்ளது” என்ற செயப்பாட்டு வடிவம் கொடுத்தவர் யார் என்பதை வெளிப்படையாகக் கூறவில்லை; கடவுளே இவ்வறிவை அருளுகிறார் என்ற பொருள் பொதுவாக உணரப்படுகிறது.
    reason: theological_clarification
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: அவர் அவர்களுக்குப் பதிலளித்தார்
  rationale: பங்கேற்புவினை + முற்றுவினை என்ற கிரேக்க மரபுத்தொடரை இயல்பான தமிழில் ஒரே ‘பதிலளித்தார்’ என வழங்குகிறது; αὐτοῖς என்பதையும் ‘அவர்களுக்கு’ எனத் தக்கவைக்கிறது.
- source_word: Ὅτι
  choice: நேரடி உரையின் தொடக்கமாக விடப்பட்டது
  rationale: இச்சூழலில் ὅτι இயேசுவின் பதிலின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் தனியே ‘ஏனெனில்’ அல்லது ‘என்று’ சேர்க்காமல் மேற்கோளை நேரடியாகத் தொடங்குவது இயல்பு.
- source_word: ὑμῖν δέδοται γνῶναι
  choice: அறிந்துகொள்ளும் வாய்ப்பு உங்களுக்குக் கொடுக்கப்பட்டுள்ளது
  rationale: γνῶναι என்பதன் ‘அறிதல்’ கருத்தையும், δέδοται என்பதன் நிறைவுற்ற செயப்பாட்டு வடிவத்தையும் காக்கிறது. தமிழில் முழுக் கட்டமைப்பையும் இயல்பாகச் சொல்ல ‘வாய்ப்பு’ துணைச்சொல் பயன்படுத்தப்பட்டுள்ளது; இது வெறும் மனித வாய்ப்பை அல்ல, வழங்கப்பட்ட அனுமதி/சலுகையைச் சுட்டுகிறது.
- source_word: τὰ μυστήρια
  choice: மறைபொருள்கள்
  rationale: முன்பு மறைக்கப்பட்டிருந்து வெளிப்படுத்தப்படும் தெய்வீக உண்மைகள் என்ற கருத்தை இயல்பான நவீன தமிழில் தருகிறது; ‘இரகசியங்கள்’ என்பது சாதாரண ரகசியத் தகவல் என்ற குறுகிய எண்ணத்தைத் தரக்கூடும்.
- source_word: τῆς βασιλείας τῶν οὐρανῶν
  choice: பரலோக அரசின்
  rationale: மத்தேயுவுக்குரிய சொற்றொடரைத் தெளிவாகவும் வழக்கமான வேதாகமத் தமிழிலும் வழங்குகிறது. βασιλεία ஆட்சியையும் அரசையும் குறிக்கக்கூடியது; இங்கு ‘அரசு’ இயல்பான பெயர்ச்சொல் இணைப்பைத் தருகிறது.
- source_word: ἐκείνοις δὲ οὐ δέδοται
  choice: ஆனால் அவர்களுக்கோ கொடுக்கப்படவில்லை
  rationale: உங்களுக்கும் அவர்களுக்கும் இடையிலான வலுவான எதிர்மறை ஒப்பீட்டை ‘அவர்களுக்கோ’ வெளிப்படுத்துகிறது; இரண்டாம் δέδοται-யின் செயப்பாட்டு வடிவத்தையும் காக்கிறது.
theological_decisions:
- issue: δέδοται என்ற செயப்பாட்டு வினையின் மறைமுகச் செய்பவர்
  choice: கொடுப்பவர் யார் என்று பெயரிடாமல் ‘கொடுக்கப்பட்டுள்ளது’ என வைத்தல்
  alternative: ‘கடவுள் உங்களுக்குக் கொடுத்துள்ளார்’
  rationale: கிரேக்கம் கொடுப்பவரை வெளிப்படையாகக் குறிப்பிடவில்லை. கடவுளே கொடுப்பவர் என்பது சூழலில் உணரப்பட்டாலும், அதை உரைக்குள் சேர்ப்பது மூலத்தின் தெய்வீகச் செயப்பாட்டு அமைப்பை விளக்கிவிடும்.
- issue: μυστήρια என்பதன் பொருள்
  choice: மறைபொருள்கள்
  alternative: இரகசியங்கள் / மறைக்கப்பட்ட உண்மைகள்
  rationale: இச்சொல் வெறும் புதிர்களையோ தனிப்பட்ட இரகசியங்களையோ அல்ல, வெளிப்படுத்தப்படும் தேவஅரசின் மறைந்த உண்மைகளைக் குறிக்கிறது. ‘மறைபொருள்கள்’ அந்த வேதாகமத் தளத்தைத் தக்கவைக்கிறது.
- issue: βασιλεία என்பதன் பரப்பு
  choice: அரசு
  alternative: ஆட்சி
  rationale: ‘அரசு’ இயல்பான தமிழில் தேவனுடைய அரசாட்சித் தளத்தைக் குறிக்கிறது; ‘ஆட்சி’ என்ற மாற்றும் சாத்தியம் என்பதால் ஒரே இறையியல் விளக்கமாகக் குறுக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத்தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘அவர்களுக்கோ’ என்பது கிரேக்கத்தின் உங்களுக்கும் அவர்களுக்கும் இடையிலான எதிர்மறை ஒப்பீட்டை இயல்பாக வலியுறுத்துகிறது. உரையில் உள்ள ஒரே அடிக்குறிப்பு குறியீடு [a] முதன்மை உரையிலும் முறையாக இடம்பெற்றுள்ளது.
