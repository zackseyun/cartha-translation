  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὰς ἀκάνθας, καὶ ἀνέβησαν αἱ ἄκανθαι καὶ ⸀ἔπνιξαν αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/007.yaml
  text: Other seeds fell among the thorns[a], and the thorns came up and choked them.
translation:
  language: ta
  text: வேறு சில விதைகள் முட்செடிகளுக்கிடையே விழுந்தன[a]; முட்செடிகள் வளர்ந்து வந்து அவற்றை நெரித்துவிட்டன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் நேரடியாக, ‘முட்செடிகள்மேல் விழுந்தன’; வேளாண் சூழலில் இயல்பாக இருப்பதால் ‘முட்செடிகளுக்கிடையே’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: வேறு சில விதைகள்
  rationale: இது பன்மை நடுநிலைப் பெயரடையாகப் பெயர்ச்சொல் பொருளில் வந்து, முந்தைய வசனங்களில் உள்ள விதைகளைக் குறிக்கிறது. தமிழில் குறிப்புப் பொருள் தெளிவாகவும் இயல்பாகவும் இருக்க ‘விதைகள்’ சேர்க்கப்படுகிறது.
- source_word: δὲ
  choice: ;
  rationale: இங்கு δέ வலுவான முரண்பாட்டைக் காட்டாமல் உவமையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது. தமிழில் அரைப்புள்ளி அந்தத் தொடர்ச்சியை இயல்பாகக் காட்டுகிறது.
- source_word: ἔπεσεν
  choice: விழுந்தன
  rationale: πίπτω என்பதன் நேரடியான பொருளான ‘விழு’ பாதுகாக்கப்படுகிறது; ‘விதைக்கப்பட்டன’ என்று விளக்கமாக மாற்றப்படவில்லை. கிரேக்கத்தில் வினை ஒருமையாக இருந்தாலும், தமிழில் வெளிப்படையாகக் கொடுக்கப்பட்ட ‘விதைகள்’ என்பதோடு இயைந்து பன்மை பயன்படுத்தப்படுகிறது.
- source_word: ἐπὶ τὰς ἀκάνθας
  choice: முட்செடிகளுக்கிடையே
  rationale: ἐπί உடன் வரும் சொற்றொடரின் நேரடிப் பொருள் ‘முட்கள்மேல்’ என்றாலும், விதைகள் முட்செடிகள் வளர்ந்திருந்த அல்லது வளரப்போகும் பகுதியில் விழுந்த வேளாண் சூழலைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘முட்செடிகளுக்கிடையே’ தேர்ந்தெடுக்கப்படுகிறது.
- source_word: ἀκάνθας / ἄκανθαι
  choice: முட்செடிகள்
  rationale: ἄκανθα இங்கு வெறும் முட்களைவிட, வளர்ந்து விதைப்பயிரை நெருக்கும் முள்ளுள்ள களைகளையோ செடிகளையோ குறிக்கிறது. ‘முட்செடிகள்’ இரண்டு இடங்களிலும் இயல்பாகவும் ஒரேமாதிரியாகவும் உள்ளது.
- source_word: ἀνέβησαν
  choice: வளர்ந்து வந்து
  rationale: ἀναβαίνω-வின் மேலெழும் வளர்ச்சி உருவகத்தைத் தமிழில் இயல்பாகக் காட்டுகிறது; செடிகள் முளைத்து உயர்வதையும் உணர்த்துகிறது.
- source_word: ἔπνιξαν
  choice: நெருக்கி அடைத்துவிட்டன
  rationale: πνίγω-வின் ‘மூச்சுத்திணறச் செய்/நெரித்து அடை’ என்ற வலுவான உருவகத்தைப் பாதுகாத்து, பயிரின் வளர்ச்சியை முட்செடிகள் ஒடுக்கிய வேளாண் பொருளையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: αὐτά
  choice: அவற்றை
  rationale: பன்மை நடுநிலைச் சுட்டுப்பெயர், மறைமுகமாக விதைகளிலிருந்து வளர்ந்தவற்றைக் குறிக்கிறது. ‘அவற்றை’ என்பது கிரேக்கத்தின் குறிப்பு அளவை விரிவாக்காமல் பாதுகாக்கிறது.
