revisions:
- from: ஏனெனில், இந்த மக்களின் இதயம் உணர்வற்றுப் போயிற்று[a]; அவர்கள் காதுகளால் கேட்பதே கடினமாகிவிட்டது; தங்கள் கண்களால் காணாமலும், காதுகளால் கேட்காமலும், இதயத்தால் புரிந்துகொள்ளாமலும், என்னிடம் திரும்பாமலும்[b] இருக்கும்படியாகத் தங்கள் கண்களை மூடிக்கொண்டார்கள். இல்லையெனில், நான் அவர்களைக் குணமாக்குவேன்.”[c]
  to: ஏனெனில், இந்த மக்களின் இதயம் மந்தமடைந்துவிட்டது[a]; அவர்கள் காதுகளால் மந்தமாகக் கேட்டார்கள்; தங்கள் கண்களை மூடிக்கொண்டார்கள்; ஒருவேளை அவர்கள் தங்கள் கண்களால் கண்டு, காதுகளால் கேட்டு, இதயத்தால் புரிந்துகொண்டு, திரும்பி[b], நான் அவர்களைக் குணமாக்கிவிடாதபடி[c].”
  rationale: மூலத்தில் இல்லாத “என்னிடம்” நீக்கப்பட்டுள்ளது. μήποτε-இன் எல்லைக்குள் இறுதி ‘நான் அவர்களைக் குணமாக்குவேன்’ கருத்தை வைத்ததால், அந்தக் கடினமான நீதித்தீர்ப்பு/மனிதப் பொறுப்பு பதற்றம் விளக்கமின்றி பாதுகாக்கப்படுகிறது. “மந்தமாகக் கேட்டார்கள்” என்பது βαρέως ἤκουσαν என்பதன் கருத்தை, தேவையற்ற காலமாற்றம் இன்றி அளிக்கிறது.
