id: MAT.13.15
reference: Matthew 13:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/015.yaml
  text: For this people's heart has grown dull[a], and with their ears they hear heavily, and they have closed their eyes, lest they should see with their eyes and hear with their ears and understand with their heart and turn back[c][b], and I will heal them.
translation:
  language: ta
  text: ஏனெனில், இந்த மக்களின் இதயம் மந்தமடைந்துவிட்டது[a]; அவர்கள் காதுகளால் மந்தமாகக் கேட்டார்கள்; தங்கள் கண்களை மூடிக்கொண்டார்கள்; ஒருவேளை அவர்கள் தங்கள் கண்களால் கண்டு, காதுகளால் கேட்டு, இதயத்தால் புரிந்துகொண்டு, திரும்பி[b], நான் அவர்களைக் குணமாக்கிவிடாதபடி[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “இந்த மக்களின் இதயம் தடித்துப்போயிற்று”; இங்கு அது மந்தமான அல்லது உணர்வற்ற நிலையைச் சுட்டுகிறது.'
    reason: lexical_alternative
  - marker: b
    text: 'வேறு மொழிபெயர்ப்பு: “திரும்பவும்” அல்லது “மீண்டும் திரும்பவும்.”'
    reason: lexical_alternative
  - marker: c
    text: ஏசாயா 6:9–10-லிருந்து மேற்கோள். “ஒருவேளை ... குணமாக்கிவிடாதபடி” என்பது கிரேக்க μήποτε-இன் நோக்கம்/விளைவு சார்ந்த பதற்றமான அமைப்பைத் தக்கவைக்கிறது.
    reason: cross_reference_and_translation_alternative
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: உணர்வற்றுப் போயிற்று
  rationale: சொற்பொருளில் ‘தடித்தது/கொழுத்தது’ என்றாலும், இதயத்தைப் பற்றிய இச்சொற்றொடரில் உணராமை அல்லது மந்தநிலையைக் குறிக்கிறது. இயல்பான தமிழில் கருத்தைத் தெளிவாகத் தருகிறது.
- source_word: καρδία
  choice: இதயம்
  rationale: புரிதல் மற்றும் உள்ளார்ந்த மனப்பாங்கின் மையத்தைக் குறிக்கும் வழக்கமான வேதாகமச் சொல்; வசனத்திலுள்ள உடல் உறுப்புகளின் உருவகத் தொடரையும் காக்கிறது.
- source_word: λαοῦ τούτου
  choice: இந்த மக்களின்
  rationale: τούτου என்பதன் சுட்டுவலிமையையும் உடைமைத் தொடர்பையும் நேரடியாகக் காக்கிறது.
- source_word: βαρέως ἤκουσαν
  choice: அவர்கள் காதுகளால் கேட்பதே கடினமாகிவிட்டது
  rationale: ‘கனமாகக் கேட்டார்கள்’ என்ற சொல் வடிவின் சூழல்சார் பொருள், கேட்பதில் கடினம் அல்லது மந்தம் என்பதாகும்; தமிழ் வாசகருக்கு இயல்பாக அமைகிறது.
- source_word: ἐκάμμυσαν
  choice: தங்கள் கண்களை மூடிக்கொண்டார்கள்
  rationale: மக்களே செய்த செயலைக் குறிக்கும் வினைமுகத்தையும், அதன் விளைவின் தொடர்ச்சியையும் காக்கிறது.
- source_word: μήποτε
  choice: இருக்கும்படியாக ... இல்லையெனில்
  rationale: கிரேக்கத்தில் உள்ள எதிர்மறை நோக்கம்/விளைவு சார்ந்த பதற்றத்தைத் தமிழில் தொடர்ச்சியான வாக்கியமாகத் தருகிறது; மாற்றுச் சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: συνῶσιν
  choice: புரிந்துகொள்ளாமலும்
  rationale: இதயத்தால் உள்ளுணர்ந்து அறிதல் என்ற சூழல்சார் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐπιστρέψωσιν
  choice: என்னிடம் திரும்பாமலும்
  rationale: திரும்புதல் என்ற திசைசார் கருத்தைக் காக்கிறது; ‘மதம் மாறுதல்’ போன்ற பிற்கால சமயத் தொழில்நுட்பச் சொல்லைத் தவிர்க்கிறது. ‘என்னிடம்’ என்பது ஏசாயா மேற்கோளின் பொருளில் மறைமுகமாக உள்ள இலக்கைத் தமிழில் தெளிவாக்குகிறது.
- source_word: ἰάσομαι
  choice: நான் அவர்களைக் குணமாக்குவேன்
  rationale: எதிர்கால வினை வடிவை நேரடியாகக் காக்கிறது; ஆவிக்குரியதாக மட்டும் சுருக்காமல் ‘குணமாக்குதல்’ என்ற உருவகத்தைப் பேணுகிறது.
theological_decisions:
- issue: μήποτε தொடர் வெளிப்படுத்தும் தெய்வீக நியாயத்தீர்ப்புக்கும் மனிதப் பொறுப்புக்கும் இடையிலான பதற்றம்
  choice: இருக்கும்படியாக ... இல்லையெனில், நான் அவர்களைக் குணமாக்குவேன்
  alternative: ஒருவேளை அவர்கள் ... திரும்பி, நான் அவர்களைக் குணமாக்கிவிடாதபடி
  rationale: மக்கள் தங்கள் கண்களைத் தாங்களே மூடியதாகச் சொல்லும் செயற்பாட்டைத் தக்கவைத்ததோடு, μήποτε என்பதன் நோக்கம்/விளைவு பற்றிய கடினமான பதற்றத்தையும் முற்றிலும் மென்மையாக்காமல் விடுகிறது. தமிழின் இயல்புக்காக ‘இல்லையெனில்’ பயன்படுத்தப்பட்டாலும், மேலும் வடிவநெருக்கமான வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை. ‘இதயம்’, ‘குணமாக்குவேன்’ ஆகியவை மூலத்தின் உருவகத் தொடரைத் தக்கவைக்கின்றன. நீண்ட கிரேக்க வாக்கியத்தின் உறுப்புகள் தமிழில் இணையான எதிர்மறை வினையெச்சத் தொடராக அமைக்கப்பட்டுள்ளன.
