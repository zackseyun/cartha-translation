  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ ἐχθρὸς ὁ σπείρας αὐτά ἐστιν ὁ διάβολος· ὁ δὲ θερισμὸς συντέλεια ⸀αἰῶνός ἐστιν, οἱ δὲ θερισταὶ ἄγγελοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/039.yaml
  text: And the enemy who sowed them is the devil; the harvest is the end of the age[a], and the harvesters are angels.
translation:
  language: ta
  text: அவற்றை விதைத்த பகைவன் பிசாசு; அறுவடை யுகத்தின் முடிவு[a]; அறுவடை செய்பவர்கள் தேவதூதர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யுகத்தின் நிறைவு”; பாரம்பரியமாக, “உலகத்தின் முடிவு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχθρὸς
  choice: பகைவன்
  rationale: உவமையில் தனிப்பட்ட முறையில் எதிர்த்து செயல்படுகிறவனைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: ὁ σπείρας
  choice: விதைத்த
  rationale: முடிந்த செயலைக் குறிக்கும் இறந்தகாலப் பெயரெச்சமாகவும், உவமையின் விதைப்பு உருவகத்தைத் தொடர்வதாகவும் உள்ளது.
- source_word: αὐτά
  choice: அவற்றை
  rationale: முன்னர் கூறப்பட்ட களைகளைச் சுட்டும் பன்மை இடப்பெயரைத் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: διάβολος
  choice: பிசாசு
  rationale: இச்சூழலில் சாத்தானைக் குறிக்கும் அறியப்பட்ட தனிப்பட்ட பெயராகப் பயன்படுகிறது; சொற்பிறப்பை மட்டும் காட்டும் ‘அவதூறு செய்பவன்’ என்பது குறிப்பை மறைத்துவிடும்.
- source_word: θερισμὸς
  choice: அறுவடை
  rationale: வேளாண்மை உருவகத்தை இயல்பாகவும் தெளிவாகவும் காக்கும் வழக்கமான பெயர்ச்சொல்.
- source_word: συντέλεια αἰῶνός
  choice: இந்தக் காலத்தின் நிறைவு
  rationale: αἰών என்பதன் காலப்பொருளை ‘காலம்’ எனக் காத்து, συντέλεια குறிக்கும் முடிவுறுதல் அல்லது நிறைவடைதலையும் வெளிப்படுத்துகிறது. சூழலில் குறிப்பிட்ட காலத்தைச் சுட்டுவதால் ‘இந்தக் காலம்’ இயல்பானது.
- source_word: θερισταὶ
  choice: அறுவடை செய்கிறவர்கள்
  rationale: ‘அறுப்பவர்கள்’ என்பதைவிட முழு அறுவடைப் பணியையும் குறிக்கும் வகையில் நவீன வாசகர்களுக்கு உடனடியாகத் தெளிவாக உள்ளது.
- source_word: ἄγγελοί
  choice: தேவதூதர்கள்
  rationale: ἄγγελος பொதுவாகத் தூதர் எனப் பொருள்படலாம்; ஆனால் இவ்விறுதிக்காலச் சூழலில் வானுலகத் தூதர்களையே குறிக்கிறது.
- source_word: δὲ
  choice: அரைக்காற்புள்ளி வழியான தொடர்ச்சி
  rationale: மீண்டும் வரும் δέ விளக்கத்தின் அடுத்தடுத்த கூறுகளை முன்னெடுக்கிறது; தமிழில் ஒவ்வொரு முறையும் இணைப்புச்சொல் சேர்ப்பதைவிட நிறுத்தக்குறி இயல்பாக அந்தச் செயல்பாட்டைக் காட்டுகிறது.
theological_decisions:
- issue: συντέλεια αἰῶνός என்ற இறுதிக்காலச் சொற்றொடரின் மொழிபெயர்ப்பு
  choice: இந்தக் காலத்தின் நிறைவு
  alternative: இந்தக் காலத்தின் முடிவு; உலகத்தின் முடிவு
  rationale: αἰών என்பது இங்கு பொருளுலகைக் காட்டிலும் காலப்பகுதியைக் குறிக்கிறது. ‘நிறைவு’ என்பது συντέλεια-வின் நிறைவுறுதல் என்ற நுட்பத்தைப் பாதுகாக்கிறது; ‘உலகத்தின் முடிவு’ படைப்புலகின் அழிவைத் தேவையின்றி உணர்த்தக்கூடும். மாற்று வழக்கை அடிக்குறிப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. மூலத்தின் மூன்று விளக்கக் கூறுகளும் அரைக்காற்புள்ளிகளால் இணைக்கப்பட்டு, வேளாண்மை உருவகம் தொடர்ந்து காக்கப்பட்டுள்ளது.
