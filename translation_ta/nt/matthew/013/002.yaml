translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் விளைவு தொடர்பு பாதுகாக்கப்பட்டாலும், தமிழின் இயல்பான ஓட்டத்திற்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. அடிக்குறிப்புக் குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
