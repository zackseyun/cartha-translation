source:
  edition: SBLGNT
  text: καὶ συνήχθησαν πρὸς αὐτὸν ὄχλοι πολλοί, ὥστε αὐτὸν ⸀εἰς πλοῖον ἐμβάντα καθῆσθαι, καὶ πᾶς ὁ ὄχλος ἐπὶ τὸν αἰγιαλὸν εἱστήκει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/002.yaml
  text: And large crowds gathered to him[a], so that he got into a boat and sat down[b], and the whole crowd stood on the shore.
translation:
  language: ta
  text: மக்கள் பெருந்திரளாக அவரிடம் கூடிவந்தார்கள். அதனால் அவர் ஒரு படகில் ஏறி அமர்ந்தார்[a]; மக்கள் கூட்டம் முழுவதும் கரையில் நின்றுகொண்டிருந்தது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரு படகுக்குள் சென்று அமர்ந்தார்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மணற்கரையில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν πρὸς αὐτὸν ὄχλοι πολλοί
  choice: மக்கள் பெருந்திரளாக அவரிடம் கூடிவந்தார்கள்
  rationale: செயப்பாட்டு வடிவம் இங்கு மக்கள் தாமாக வந்து கூடுவதைக் குறிக்கும் இயல்பான பொருளில் உள்ளது. ὄχλοι πολλοί என்பதன் பன்மையைச் சொற்சொல்லாக மொழிபெயர்க்காமல், நவீன தமிழில் இயல்பாக எண்ணிக்கையும் பெருமளவும் வெளிப்படும் வகையில் ‘மக்கள் பெருந்திரளாக’ என வழங்கப்பட்டுள்ளது.
- source_word: ὥστε
  choice: அதனால்
  rationale: இச்சொல் விளைவை அறிமுகப்படுத்துகிறது. கூட்டம் மிகுந்ததன் விளைவாக இயேசு படகில் ஏறி அமர்ந்தார் என்ற தொடர்பை ‘அதனால்’ தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: εἰς πλοῖον ἐμβάντα καθῆσθαι
  choice: ஒரு படகில் ஏறி அமர்ந்தார்
  rationale: படகுக்குள் சென்று அமர்ந்த செயலை எளிய, இயல்பான தமிழில் கூறுகிறது; ‘படகில் ஏறுதல்’ என்பது தமிழில் வழக்கமான பயன்பாடு.
- source_word: πᾶς ὁ ὄχλος
  choice: மக்கள் கூட்டம் முழுவதும்
  rationale: முன்னர் பன்மையில் குறிப்பிடப்பட்ட மக்களை இங்கு ஒரே கூட்டமாகக் குறிக்கும் மூலத்தின் தொகுதிப் பொருளைத் தக்கவைக்கிறது.
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: கரையில்
  rationale: αἰγιαλός நீர்நிலையின் கரை அல்லது கரையோரத்தைப் பொதுவாகக் குறிக்கிறது. சூழல் கடலை மட்டுமே குறிப்பதாக வரையறுக்காமல் இருக்க ‘கரையில்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: εἱστήκει
  choice: நின்றுகொண்டிருந்தது
  rationale: கூட்டம் அப்போது தொடர்ந்து நின்ற நிலையில் இருந்ததை கிரேக்க வினையின் நிலைத்தொடர்ச்சி அம்சத்துடன் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
