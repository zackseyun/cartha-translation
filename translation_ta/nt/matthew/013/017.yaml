id: MAT.13.17
reference: Matthew 13:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν ὅτι πολλοὶ προφῆται καὶ δίκαιοι ἐπεθύμησαν ἰδεῖν ἃ βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/017.yaml
  text: For truly I say to you that many prophets and righteous people longed to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: ta
  text: 'ஏனெனில், உண்மையாகவே நான் உங்களுக்குச் சொல்கிறேன்: பல தீர்க்கதரிசிகளும் நீதிமான்களும் நீங்கள் காண்பவற்றைக் காணவும், நீங்கள் கேட்பவற்றைக் கேட்கவும் ஏங்கினார்கள்; அவர்கள் அவற்றைக் காணவுமில்லை, கேட்கவுமில்லை.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν
  choice: உண்மையாகவே
  rationale: இயேசுவின் உறுதியான அறிவிப்பைக் குறிக்கும் இந்தச் சொல்லின் வலிமையை, வெறும் ஒலிபெயர்ப்பை விட இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்க ஆதாரத்தை அறிமுகப்படுத்தும் இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: λέγω ὑμῖν
  choice: நான் உங்களுக்குச் சொல்கிறேன்
  rationale: கிரேக்க மொழியின் நேரடியான உரையாடல் வடிவையும் சூத்திரத் தன்மையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: προφῆται
  choice: தீர்க்கதரிசிகள்
  rationale: இஸ்ரவேலின் இறைவாக்கு அறிவித்தவர்களைக் குறிக்கும் தமிழில் நிலைபெற்ற, தெளிவான சொல்.
- source_word: δίκαιοι
  choice: நீதிமான்கள்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட பன்மை அடைமொழியை, நீதியுள்ள நபர்களைக் குறிக்கும் இயல்பான தமிழ் பெயர்ச்சொல்லாக வழங்குகிறது.
- source_word: ἐπεθύμησαν
  choice: ஏங்கினார்கள்
  rationale: வலுவான விருப்பத்தையும் நிறைவேறாத ஆவலையும் இயல்பாக வெளிப்படுத்துகிறது; இச்சூழலில் பொருந்தாத தீய ஆசை என்ற நிழற்பொருளைத் தவிர்க்கிறது.
- source_word: ἃ βλέπετε / ἃ ἀκούετε
  choice: நீங்கள் காண்பவை / நீங்கள் கேட்பவை
  rationale: கிரேக்கத்தில் பொருள் வெளிப்படையாக விவரிக்கப்படாமல் உறவுப்பெயர் வாக்கியங்களாக இருப்பதைத் தமிழிலும் காக்கிறது.
- source_word: οὐκ εἶδαν / οὐκ ἤκουσαν
  choice: காணவுமில்லை, கேட்கவுமில்லை
  rationale: அவர்கள் விரும்பியது அவர்களுக்குக் கிடைக்கவில்லை என்ற இணையான மறுப்பு அமைப்பைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: δίκαιοι என்பதன் வரம்பு
  choice: தீர்க்கதரிசிகளுடன் சேர்த்துப் பரந்த மற்றொரு வகுப்பாக ‘நீதிமான்கள்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘நீதியுள்ள மக்கள்’ என்று விரிவாக மொழிபெயர்த்தல்.
  rationale: கிரேக்க அடைமொழி இங்கு பெயர்ச்சொல்லாகச் செயல்படுகிறது. ‘நீதிமான்கள்’ என்பது அந்தத் தனித்த வகுப்பைத் தெளிவாகக் காட்டுவதோடு, தீர்க்கதரிசிகளோடு அவர்களை ஒன்றாக்குவதில்லை.
- issue: காணப்பட்டதும் கேட்கப்பட்டதும் எது
  choice: ‘நீங்கள் காண்பவை’, ‘நீங்கள் கேட்பவை’ என்று பொருளை மறைமுகமாகவே வைத்திருக்கிறது.
  alternative: ‘மேசியா’ அல்லது ‘இறையாட்சியின் மறைபொருள்கள்’ என்று வெளிப்படையாக விரித்துரைத்தல்.
  rationale: சூழல் இயேசுவின் ஊழியத்தையும் இறையாட்சி வெளிப்பாட்டையும் சுட்டினாலும், இவ்வசனம் பொருளை நேரடியாகப் பெயரிடவில்லை. ஆகவே மூலத்தின் அர்த்தத் திறப்பும் இறையியல் அழுத்தமும் தீர்க்கப்படாமல் காக்கப்பட்டுள்ளன.
- issue: காணுதல் மற்றும் கேட்டலின் இணை அமைப்பு
  choice: ஒரே ‘ஏங்கினார்கள்’ என்ற வினையின் கீழ் காணவும் கேட்கவும் என்ற இரு நிறைவிலிகளும் இணைக்கப்பட்டுள்ளன.
  alternative: ஒவ்வொரு பிரிவிலும் ‘ஏங்கினார்கள்’ என்பதைத் திரும்பச் சொல்லுதல்.
  rationale: இது கிரேக்க வாக்கியத்தின் இலக்கண உறவைப் பாதுகாப்பதோடு தமிழில் தேவையற்ற மறுபடியுரைத்தலைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘உண்மையாகவே’ என்பது உறுதியுரையின் வலிமையைக் காக்கிறது; ‘நீதிமான்கள்’ மற்றும் ‘தீர்க்கதரிசிகள்’ ஆகியவை பரவலாகப் புரியக்கூடிய நிலைபெற்ற சொற்கள். இறுதியில் உள்ள இணை மறுப்பு, தமிழ் இயல்புக்காகச் சுருக்கப்பட்டாலும் காணுதல்–கேட்டல் என்ற மூல இணைப்பைத் தெளிவாக வைத்திருக்கிறது.
