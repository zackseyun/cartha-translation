  text: ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/009.yaml
  text: The one who has ears[a], let him hear.
translation:
  language: ta
  text: காதுகள் உள்ளவர் கேட்கட்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων
  choice: உள்ளவர்
  rationale: கட்டுரையுடன் வரும் நிகழ்காலப் பங்கேற்புவினை இங்கு பெயர்ச்சொல் போல் செயல்பட்டு, இப்படிப்பட்ட எந்த நபரையும் பொதுவாகக் குறிக்கிறது. தமிழில் ‘உள்ளவர்’ என்பது ஒருமை வடிவத்தையும் பொதுப்பொருளையும் இயல்பாகப் பேணுகிறது.
- source_word: ὦτα
  choice: காதுகள்
  rationale: கிரேக்க மூலத்தில் பன்மை உள்ளது; ஆகவே ‘காதுகள்’ என்பது எண்ணையும் சொல்லின் நேரடிப் பொருளையும் பேணுகிறது.
- source_word: ἀκουέτω
  choice: கேட்கட்டும்
  rationale: மூன்றாம் நபர் ஒருமை நிகழ்காலக் கட்டளை வடிவத்தின் அறிவுறுத்தல் வலிமையை ‘கேட்கட்டும்’ இயல்பாக வெளிப்படுத்துகிறது. சூழலில் இது வெறுமனே ஒலியைக் கேட்பதை அல்ல, கவனித்து ஏற்றுக்கொள்வதையும் உணர்த்துகிறது; இருப்பினும் மூலச்சொல்லின் தொடர்பைப் பேண ‘கேட்கட்டும்’ என மொழிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: ஆண்பால் ஒருமை வடிவத்தின் பொதுப்பொருள்
  choice: காதுகள் உள்ளவர் கேட்கட்டும்.
  alternative: காதுகள் உள்ள எவரும் கேட்கட்டும்.
  rationale: கிரேக்கத்தில் இலக்கணப்படி ஆண்பால் ஒருமை இருந்தாலும், அது எந்த நபரையும் பொதுவாகக் குறிக்கிறது. பாலினத்தைக் குறிப்பாக முன்வைக்காத தமிழின் மரியாதை ஒருமை ‘உள்ளவர்’ மூலத்தின் ஒருமை மற்றும் பிரதிநிதித்துவ வலிமையைப் பேணுகிறது; ‘எவரும்’ என்பதும் சாத்தியம், ஆனால் அது தொடரின் அமைப்பைச் சற்று அதிகமாகப் பொதுமைப்படுத்துகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் சுருக்கமான, கண்ணியமான, வாய்மொழியில் இயல்பாக ஒலிக்கும் கட்டளைத் தொடர். மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்காமல், செவிகொடுத்து ஏற்றுக்கொள்ள வேண்டிய அழைப்பின் வலிமை பேணப்பட்டுள்ளது.
