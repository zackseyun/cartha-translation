source:
  edition: SBLGNT
  text: ⸀Ἐν τῇ ἡμέρᾳ ἐκείνῃ ἐξελθὼν ὁ Ἰησοῦς ⸀τῆς οἰκίας ἐκάθητο παρὰ τὴν θάλασσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/001.yaml
  text: On that day Jesus went out of the house and sat beside the sea[a][b].
translation:
  language: ta
  text: அந்த நாளில் இயேசு வீட்டைவிட்டு வெளியே சென்று, கடலருகே அமர்ந்திருந்தார்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: முந்தைய நிகழ்வுகளுடனான தொடர்ச்சியை இச்சொற்றொடர் வலியுறுத்துவதாக எடுத்துக்கொண்டால், “அதே நாளில்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: b
    text: “கடலுக்குப் பக்கத்தில்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடர் கடலுக்கு அருகிலுள்ள இடத்தைக் குறிக்கிறது; கரையிலிருந்து எவ்வளவு தொலைவு என்பதைத் துல்லியமாகக் குறிப்பிடவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: அந்த நாளில்
  rationale: இது இயல்பான தமிழ் காலக் குறிப்பாகவும், கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘அதே’ என்ற வலியுறுத்தலைச் சேர்க்காமலும் உள்ளது.
- source_word: ἐξελθὼν ... τῆς οἰκίας
  choice: வீட்டைவிட்டு வெளியே சென்று
  rationale: இடத்தைவிட்டு வெளியேறும் பொருளைத் தமிழில் இயல்பாக ஒருங்கிணைக்கிறது; முன்னதாக நிகழ்ந்த துணைவினைச் செயலைப் பாதுகாக்கிறது.
- source_word: ὁ Ἰησοῦς
  choice: இயேசு
  rationale: தமிழில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: ἐκάθητο
  choice: அமர்ந்திருந்தார்
  rationale: இறந்தகாலத் தொடர்நிலைச் சூழலை உணர்த்தும் imperfect வடிவத்தின் காட்சியமைக்கும் தன்மையை இயல்பான தமிழில் பிரதிபலிக்கிறது.
- source_word: παρὰ τὴν θάλασσαν
  choice: கடலருகே
  rationale: கடலுக்கு அருகிலுள்ள நிலையைத் தெரிவிக்கிறது; கரையோரத்திலேயே இருந்தார் என கிரேக்கத்தைவிடக் குறிப்பாக்கவில்லை.
theological_decisions: []
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. மரியாதைப் பன்மை வினைமுற்று தமிழ் வேதாகம நடைக்கும் பொதுவான வாசகர் எதிர்பார்ப்புக்கும் ஏற்ப பயன்படுத்தப்பட்டுள்ளது; மூலத்தில் இல்லாத கருத்து சேர்க்கப்படவில்லை.
