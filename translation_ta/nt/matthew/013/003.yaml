translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. நேரடி உரையின் கவன ஈர்ப்பை ஆச்சரியக்குறி வெளிப்படுத்துகிறது.
