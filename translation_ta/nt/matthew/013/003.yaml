  text: καὶ ἐλάλησεν αὐτοῖς πολλὰ ἐν παραβολαῖς λέγων· Ἰδοὺ ἐξῆλθεν ὁ σπείρων τοῦ σπείρειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/003.yaml
  text: 'And he spoke many things to them in parables, saying: “Look, the sower went out to sow.”'
translation:
  language: ta
  text: 'அவர் அவர்களிடம் உவமைகள் மூலம் பலவற்றைப் பேசினார்: “இதோ, விதைப்பவன் விதைக்கப் புறப்பட்டான்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν παραβολαῖς
  choice: உவமைகள் மூலம்
  rationale: பல உவமைகளைப் பயன்படுத்தி அவர் பேசியதைக் குறிக்கும் இயல்பான நவீனத் தமிழ்; கிரேக்கப் பன்மையையும் தக்கவைக்கிறது.
- source_word: Ἰδοὺ
  choice: பாருங்கள்!
  rationale: கேட்போரின் கவனத்தை ஈர்க்கும் உரையாடல் கட்டளையாகத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ὁ σπείρων
  choice: விதைக்கிறவர்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட நிகழ்காலப் பங்கேற்புச் சொல்லை இயல்பாக மொழிபெயர்த்து, நபரின் அடையாளத்தை அவரது செயலின் வழியாகக் காட்டுகிறது.
- source_word: ἐξῆλθεν ... τοῦ σπείρειν
  choice: விதைக்கப் புறப்பட்டார்
  rationale: நோக்கத்தைக் குறிக்கும் τοῦ σπείρειν என்பதையும் வெளியே சென்றார் என்ற ἐξῆλθεν என்பதையும் சுருக்கமான இயல்பான தமிழில் இணைக்கிறது.
