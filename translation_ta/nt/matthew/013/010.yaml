- from: பின்பு சீடர்கள் அவரிடம் வந்து[a], “நீர் ஏன் அவர்களிடம் உவமைகளாகப் பேசுகிறீர்?” என்று கேட்டார்கள்.
  to: பின்பு சீடர்கள் அவரிடம் வந்து[a], “நீர் ஏன் அவர்களிடம் உவமைகளால் பேசுகிறீர்?” என்று சொன்னார்கள்.
  rationale: The revision aligns the reporting verb more closely with εἶπαν and renders ἐν παραβολαῖς with a more direct and idiomatic Tamil expression for the manner or medium of speech. The footnote remains correctly anchored and preserves the lexical alternative for προσελθόντες.
