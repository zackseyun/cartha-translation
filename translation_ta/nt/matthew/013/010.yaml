reference: Matthew 13:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ προσελθόντες οἱ μαθηταὶ εἶπαν αὐτῷ· Διὰ τί ἐν παραβολαῖς λαλεῖς αὐτοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/010.yaml
  text: Then the disciples came up and said to him[a], “Why do you speak to them in parables?”
translation:
  language: ta
  text: பின்பு சீடர்கள் அவரிடம் வந்து[a], “நீர் ஏன் அவர்களிடம் உவமைகளால் பேசுகிறீர்?” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவரை அணுகி’; சீடர்கள் பேசுவதற்கு முன் இயேசுவின் அருகில் வந்ததை கிரேக்க வினையெச்சம் வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: பின்பு
  rationale: καί இங்கு நிகழ்வின் அடுத்த கட்டத்தை முன்னெடுக்கிறது; இயல்பான தமிழ் கதைநடையில் ‘பின்பு’ பொருத்தமானது.
- source_word: προσελθόντες
  choice: அவரிடம் வந்து
  rationale: προσέρχομαι இயேசுவை நோக்கி அருகில் வந்த செயலைக் குறிக்கிறது; வினையெச்ச வடிவம் பேசுவதற்கு முன் நிகழ்ந்த அணுகுதலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οἱ μαθηταὶ
  choice: சீடர்கள்
  rationale: குறிப்பிட்ட, ஏற்கெனவே அறியப்பட்ட சீடர் குழுவைக் குறிக்கிறது; கிரேக்கத்தில் இல்லாத ‘அவருடைய’ என்பதைச் சேர்க்கவில்லை.
- source_word: εἶπαν αὐτῷ
  choice: அவரிடம் … என்று கேட்டார்கள்
  rationale: λέγω என்பதன் அடிப்படை பொருள் ‘சொல்’ என்றாலும், நேரடிக் கேள்வியை அறிமுகப்படுத்தும் இச்சூழலில் ‘கேட்டார்கள்’ என்பது நவீன தமிழில் இயல்பானது; αὐτῷ ‘அவரிடம்’ என வெளிப்படுகிறது.
- source_word: Διὰ τί
  choice: ஏன்
  rationale: காரணத்தை விசாரிக்கும் நேரடியான வினாவுக்கு சுருக்கமான, இயல்பான தமிழ் இணை.
- source_word: ἐν παραβολαῖς
  choice: உவமைகளாக
  rationale: ἐν இங்கு பேச்சின் முறை அல்லது ஊடகத்தைக் குறிக்கிறது; தமிழில் ‘உவமைகளாகப் பேசுதல்’ இயல்பாகவும் பொருளுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: λαλεῖς
  choice: பேசுகிறீர்
  rationale: நிகழ்கால இரண்டாம் நபர் ஒருமையைப் பாதுகாக்கிறது; இயேசுவை நோக்கிய மரியாதையான நவீன தமிழ் வடிவம்.
- source_word: αὐτοῖς
  choice: அவர்களிடம்
  rationale: இயேசு உரையாற்றிய கேட்போரைக் குறிக்கும் வேற்றுமைப் பொருளை இயல்பான தமிழில் தருகிறது.
