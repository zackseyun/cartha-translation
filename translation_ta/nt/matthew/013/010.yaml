  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இயேசுவை நோக்கிய ஒருமை மரியாதை வடிவமான ‘நீர்/பேசுகிறீர்’ பயன்படுத்தப்பட்டுள்ளது.
