  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ⸀ἀνθρώπῳ ἐμπόρῳ ζητοῦντι καλοὺς μαργαρίτας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/045.yaml
  text: Again[a], the kingdom of heaven is like a merchant seeking fine pearls.
translation:
  language: ta
  text: மீண்டும்[a], பரலோக அரசாட்சி சிறந்த முத்துக்களைத் தேடிக்கொண்டிருக்கும் ஒரு வணிகனைப் போன்றது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் சொல்லுக்குச் சொல் நெருக்கமாக: “மீண்டும், பரலோக அரசாட்சி சிறந்த முத்துக்களைத் தேடிக்கொண்டிருக்கும் ஒரு மனிதனாகிய வணிகனைப் போன்றது.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: மீண்டும்
  rationale: அரசாட்சியை விளக்கும் உவமைகளின் தொடரில் இன்னொரு ஒப்பீட்டை அறிமுகப்படுத்துகிறது; கிரேக்கச் சொலின் தொடர்ச்சியுணர்வையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: ὁμοία ἐστὶν
  choice: போன்றது
  rationale: உவமை ஒப்பீட்டைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: பரலோக அரசாட்சி
  rationale: மத்தேயுவுக்குரிய இச்சொற்றொடரில் βασιλεία குறிக்கும் ஆட்சி அல்லது அரசுரிமை என்ற இயக்கமுள்ள கருத்தை நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: ἀνθρώπῳ ἐμπόρῳ
  choice: ஒரு வணிகனை
  rationale: ἔμπορος அந்த நபரை வணிகர் என்று ஏற்கெனவே அடையாளப்படுத்துவதால், ἄνθρωπος என்பதைத் தனியாக மீண்டும் கூறாமல் இயல்பான தமிழில் மொழிபெயர்க்கிறது.
- source_word: ζητοῦντι
  choice: தேடிக்கொண்டிருந்த
  rationale: நிகழ்ந்துகொண்டிருக்கும் தேடல் நடவடிக்கையை நிகழ்காலப் பங்கேற்பெயரின் தொடர்ச்சியுணர்வுடன் வெளிப்படுத்துகிறது.
- source_word: καλοὺς μαργαρίτας
  choice: சிறந்த முத்துக்களை
  rationale: καλός இங்கு வெறும் தோற்ற அழகை மட்டுமல்லாமல் உயர்ந்த தரத்தையும் குறிக்கிறது; ‘சிறந்த’ என்பது வணிகச் சூழலில் அந்தப் பொருளை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: உவமைச் சூத்திரத்தில் ஒப்பீட்டின் எல்லை
  choice: அரசாட்சி உடனடியாக வணிகனுக்கு ஒப்பிடப்படுகிறது.
  alternative: வணிகனும் அவன் தேடலும் அடங்கிய முழுச் சூழ்நிலைக்கு அரசாட்சி ஒப்பிடப்படுகிறது.
  rationale: ὁμοία ἐστὶν ... ἀνθρώπῳ ἐμπόρῳ என்ற கிரேக்க அமைப்பு வணிகனை உடனடி ஒப்பீட்டுப் புள்ளியாக முன்வைக்கிறது. அதேவேளையில், உவமையின் விரிவான பொருளை இவ்வசனத்திலேயே வரையறுத்துவிடாமல் அதன் இயல்பான பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமானதும் எளிதில் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ராஜ்யம்’ போன்ற வடமொழிச் சொற்குப் பதிலாக ‘அரசாட்சி’ தேர்ந்தெடுக்கப்பட்டு, இடம் அல்லது எல்லைப்பகுதியைவிட ஆட்சி என்ற கருத்து தெளிவாக்கப்பட்டுள்ளது.
