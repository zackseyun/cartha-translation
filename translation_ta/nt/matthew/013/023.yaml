source:
  edition: SBLGNT
  text: ὁ δὲ ἐπὶ τὴν ⸂καλὴν γῆν⸃ σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ ⸀συνιείς, ὃς δὴ καρποφορεῖ καὶ ποιεῖ ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/023.yaml
  text: But the one sown on the good soil—this is the one who hears the word and understands it[a], who indeed bears fruit and produces, in one case a hundred, in another sixty[b], and in another thirty.
translation:
  language: ta
  text: ஆனால் நல்ல நிலத்தில் விதைக்கப்பட்டவர், வார்த்தையைக் கேட்டு அதைப் புரிந்துகொள்பவர் இவரே. அவரே உண்மையில் கனி கொடுத்து விளைச்சல் தருகிறார்; ஒருவர் நூறு, ஒருவர் அறுபது, ஒருவர் முப்பது என்று.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “ஒன்று நூறு, ஒன்று அறுபது, ஒன்று முப்பது”; அதாவது, வெவ்வேறு அளவிலான விளைச்சல்கள்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τὴν καλὴν γῆν
  choice: நல்ல நிலத்தில்
  rationale: வேளாண்மைச் சூழலில் γῆ என்பது விதையை ஏற்கும் மண் அல்லது நிலத்தைக் குறிக்கிறது. தமிழில் ‘நல்ல நிலம்’ இயல்பாகவும் வளமான, ஏற்ற நிலம் என்ற பொருளிலும் வருகிறது; அறநெறிசார் ‘நல்லது’ என மிகைப்படுத்தவில்லை.
- source_word: σπαρείς
  choice: விதைக்கப்பட்டவர்
  rationale: இறந்தகாலச் செயப்பாட்டு எச்சத்தின் பொருளையும், விதையால் குறிக்கப்படும் நபரையும் வெளிப்படையாகக் காட்டுகிறது; உவமையின் உருவகத்தைத் தக்கவைக்கிறது.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: வார்த்தையைக் கேட்டு
  rationale: τὸν λόγον என்பதன் நற்செய்தி நூல்களுக்குரிய சொற்பயன்பாட்டை ‘வார்த்தை’ தக்கவைக்கிறது. தொடர்ச்சியான பண்பை இயல்பான தமிழ் வினையெச்சத் தொடரில் அளிக்கிறது.
- source_word: συνιείς
  choice: அதைப் புரிந்துகொள்கிறவர்
  rationale: கேட்ட வார்த்தையின் பொருளை உணர்வதைக் குறிக்கிறது; ‘அதை’ என்பது கிரேக்கத்தில் வெளிப்படையாக இல்லாவிட்டாலும் தமிழில் தெளிவுக்காக முன்னுள்ள ‘வார்த்தை’யைச் சுட்டுகிறது.
- source_word: δὴ
  choice: உண்மையாகவே
  rationale: δή தரும் வலியுறுத்தலை இயல்பான நவீன தமிழில் மென்மையாகக் குறிக்கிறது.
- source_word: καρποφορεῖ
  choice: கனி கொடுத்து
  rationale: உவமையின் வேளாண்மை உருவகத்தையும் சீடத்துவச் சூழலின் பரிச்சயமான சொல்லாட்சியையும் காக்கிறது.
- source_word: ποιεῖ
  choice: விளைச்சல் தருகிறார்
  rationale: இங்கு ποιέω உற்பத்தி செய்யும் விளைவைச் சுட்டுகிறது. καρποφορεῖ என்பதிலிருந்து தனியான இரண்டாவது வினைச்செயலைத் தக்கவைத்து, தமிழில் இயல்பாகச் சொல்கிறது.
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: ஒன்று நூறு மடங்காகவும், மற்றொன்று அறுபது மடங்காகவும், இன்னொன்று முப்பது மடங்காகவும்
  rationale: பல்வேறு விளைச்சல் அளவுகளைக் காட்டும் பகிர்வு அமைப்பைத் தக்கவைக்கிறது. ‘மடங்கு’ கிரேக்கத்தில் வெளிப்படையாக இல்லாவிட்டாலும் வேளாண்மைச் சூழலில் தமிழில் எண் அளவுகளின் பொருளைத் தெளிவாக்குகிறது; இதை அடிக்குறிப்பு விளக்குகிறது.
theological_decisions:
- issue: வார்த்தைக்கான பதிலின் இயல்பு
  choice: நல்ல நிலத்தால் குறிக்கப்படுபவர் வார்த்தையைக் கேட்டு, புரிந்துகொண்டு, பல்வேறு அளவில் கனி கொடுப்பவராக விளக்கப்படுகிறார்.
  alternative: நிலைத்திருத்தல், உண்மையான மனமாற்றம் அல்லது மறுபிறப்பின் சான்று போன்ற பிற்கால இறையியல் வகைகளை மொழிபெயர்ப்பிலேயே வெளிப்படையாகச் சேர்த்தல்.
  rationale: கிரேக்க உரை கேட்பது, புரிந்துகொள்வது, கனி கொடுப்பது ஆகியவற்றையே கூறுகிறது. குறிப்பிட்ட சமயப்பிரிவின் இரட்சிப்பியல் முடிவுகளைச் சேர்க்காமல் உரையின் சொந்த இறையியல் அழுத்தமும் பதற்றமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். வேளாண்மை உருவகம் முழுவதும் பாதுகாக்கப்பட்டுள்ளது. ‘வார்த்தை’ நற்செய்தி நூல்களின் பரிச்சயமான சொற்பயன்பாட்டைத் தக்கவைக்கிறது; சமயப்பிரிவுச் சார்ந்த விளக்கங்கள் தவிர்க்கப்பட்டுள்ளன.
