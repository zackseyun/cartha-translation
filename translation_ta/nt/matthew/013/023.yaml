revisions:
- from: ஆனால் நல்ல நிலத்தில் விதைக்கப்பட்டவர், வார்த்தையைக் கேட்டு அதைப் புரிந்துகொள்கிறவர் இவரே. இவர் உண்மையாகவே கனி கொடுத்து விளைச்சல் தருகிறார்—ஒன்று நூறு மடங்காகவும், மற்றொன்று அறுபது மடங்காகவும், இன்னொன்று முப்பது மடங்காகவும்.[a]
