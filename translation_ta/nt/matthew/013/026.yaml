  text: ὅτε δὲ ἐβλάστησεν ὁ χόρτος καὶ καρπὸν ἐποίησεν, τότε ἐφάνη καὶ τὰ ζιζάνια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/026.yaml
  text: But when the plants had sprouted and produced grain[a], then the weeds also appeared.
translation:
  language: ta
  text: ஆனால், பயிர் முளைத்துக் கதிர்விட்டபோது, களைகளும் அப்போது தென்பட்டன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘டேர்ஸ்’; கோதுமையைப் போன்ற டார்னல் என்னும் ஒரு வகைக் களையாக இருக்கலாம்.
    reason: ζιζάνια என்பதற்கான மரபுவழி மாற்றையும், உறுதியற்ற சாத்தியமான குறிப்பிட்ட தாவரவியல் அடையாளத்தையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: ὅτε δὲ
  choice: ஆனால் … போது
  rationale: ὅτε காலத்தைக் குறிக்கிறது; δέ முந்தைய நிகழ்விலிருந்து இந்நிகழ்வுக்கான மெல்லிய மாறுதலையும் வேறுபாட்டையும் காட்டுவதால் ‘ஆனால்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: ἐβλάστησεν ὁ χόρτος
  choice: பயிர் முளைத்து
  rationale: χόρτος இவ்வயல் சூழலில் பொதுவான ‘புல்’ என்பதைக் காட்டிலும் வளர்ந்து வரும் பயிரைக் குறிக்கிறது; ἐβλάστησεν அதன் முளைத்து வளரத் தொடங்குதலைக் குறிக்கிறது.
- source_word: καρπὸν ἐποίησεν
  choice: கதிர்விட்டபோது
  rationale: சொல்லுக்கு சொல் ‘பலன் உண்டாக்கியது’ என்றாலும், கோதுமைப் பயிர் தானியக் கதிரை உருவாக்கியதை இயல்பான நவீன தமிழில் இது தெரிவிக்கிறது.
- source_word: τότε ἐφάνη
  choice: தென்பட்டன
  rationale: τότε குறிக்கும் ‘அப்போது/பின்னர்’ என்ற காலத் தொடர்பு ‘…போது’ அமைப்பிலும் வாக்கிய வரிசையிலும் வெளிப்படுகிறது; ἐφάνη இங்கு காணக்கூடியதாக அல்லது தெளிவாக ஆனது என்பதைக் குறிக்கிறது.
- source_word: καὶ τὰ ζιζάνια
  choice: களைகளும்[a]
  rationale: καί-யின் சேர்க்கைப் பொருளை ‘-உம்’ காட்டுகிறது. ζιζάνια என்பது பயிரிடையே வளரும் களைகளைக் குறிக்கிறது; துல்லியமான தாவர அடையாளம் உறுதியல்லாததால் பொதுவாக ‘களைகள்’ என வழங்கப்பட்டது.
theological_decisions:
- issue: ζιζάνια என்பதன் குறிப்பிட்ட தாவர அடையாளம்
  choice: முதன்மை உரையில் பொதுவாக ‘களைகள்’
  alternative: ‘களைக்கோதுமை’ அல்லது டார்னல் எனப்படும் குறிப்பிட்ட களை
  rationale: மூலச்சொல் களையைக் குறித்தாலும் அதன் துல்லியமான தாவரவியல் அடையாளத்தை வசனம் உறுதிப்படுத்தவில்லை. எனவே பொதுவான சொல் முதன்மை உரையிலும், சாத்தியமான குறிப்பிட்ட அடையாளம் அடிக்குறிப்பிலும் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்கு எளிதாகவும் மதிப்புமிக்க நடையிலும் அமைக்கப்பட்டது. ‘முளைத்துக் கதிர்விட்டபோது’ என்பது வேளாண்மைச் சூழலை இயல்பாக எடுத்துரைக்கிறது; மூலத்தின் நிகழ்வு வரிசையும் களைகள் பின்னர் தெளிவாகத் தெரிய வந்ததுமாகிய கருத்தும் பாதுகாக்கப்பட்டுள்ளன.
