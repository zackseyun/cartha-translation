review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the inferential comparison (ὥσπερ οὖν … οὕτως), the gathering and burning of the weeds, and the future reference to the culmination of the age. ‘யுகத்தின் நிறைவில்’ appropriately preserves τοῦ αἰῶνος as temporal rather than spatial.
  naturalness: The sentence is generally clear in modern standard Tamil. Removing ‘ஒன்றாக’ avoids an unnecessary explicit addition, and ‘நெருப்பில் எரிக்கப்படுவது’ is more idiomatic in this agricultural/judgment image while retaining the explicit fire reference.
  terminology: ‘களைகள்’ is a suitable accessible rendering of ζιζάνια. ‘யுகம்’ and ‘நிறைவு’ suitably render αἰών and συντέλεια without imposing a specific eschatological scheme. The lexical footnote is improved by identifying darnel as wheat-like rather than using the vague ‘பயிரைப் போன்ற.’
  issues:
  - severity: low
    issue: ‘ஒன்றாகச் சேர்க்கப்பட்டு’ adds an explicit ‘together’ nuance not required by συλλέγεται.
    rationale: The Greek simply states that the weeds are gathered. ‘திரட்டப்பட்டு’ conveys this naturally and precisely in Tamil.
  - severity: low
    issue: The wording of footnote a is slightly awkward and imprecise in describing darnel.
    rationale: Darnel is characteristically wheat-like; ‘கோதுமையைப் போன்ற டார்னல் எனப்படும் களை’ is clearer modern Tamil and better supports the lexical note.
