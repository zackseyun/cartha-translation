id: MAT.13.40
reference: Matthew 13:40
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὥσπερ οὖν συλλέγεται τὰ ζιζάνια καὶ πυρὶ ⸀καίεται, οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ ⸀αἰῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/040.yaml
  text: Therefore[a], just as the weeds are gathered and burned with fire[b], so it will be at the end of the age.
translation:
  language: ta
  text: ஆகவே, களைகள்[a] திரட்டப்பட்டு நெருப்பில் எரிக்கப்படுவது போல, யுகத்தின் நிறைவில்[b] அப்படியே நடக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கச் சொல் தீங்கு விளைவிக்கும் களைகளைக் குறிக்கிறது; அநேகமாகக் கோதுமையைப் போன்ற டார்னல் எனப்படும் களை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உலகத்தின் முடிவில்”; கிரேக்கத்தில், “யுகத்தின் நிறைவில்.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ οὖν
  choice: ஆகவே, … போலவே
  rationale: οὖν காட்டும் முடிவுறுத்தும் தொடர்பை ‘ஆகவே’ என்றும், ὥσπερ காட்டும் ஒப்புமையை ‘போலவே’ என்றும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: συλλέγεται
  choice: ஒன்றாகச் சேர்க்கப்பட்டு
  rationale: செயப்பாட்டு வினையின் பொருளைப் பாதுகாக்கிறது; களைகளை எரிப்பதற்காகத் திரட்டும் வேளாண் காட்சிக்கும் பொருந்துகிறது.
- source_word: τὰ ζιζάνια
  choice: களைகள்
  rationale: ζιζάνια என்பது தீங்கு விளைவிக்கும் களைகளை, அநேகமாக டார்னல் களையை, குறிக்கிறது. பொதுவாசகருக்குத் தெளிவான ‘களைகள்’ முதன்மை உரையில் பயன்படுத்தப்பட்டு, கூடுதல் தாவரவியல் விவரம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: πυρὶ καίεται
  choice: நெருப்பால் எரிக்கப்படுவது
  rationale: πυρί என்பதன் கருவிப்பொருளையும் καίεται என்பதன் எளிய செயப்பாட்டு அர்த்தத்தையும் மிகைப்படுத்தாமல் காக்கிறது.
- source_word: οὕτως ἔσται
  choice: அப்படியே நடக்கும்
  rationale: முன்னுள்ள ஒப்புமை எதிர்காலத்தில் அதேபோல் நிறைவேறும் என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐν τῇ συντελείᾳ
  choice: நிறைவிலும்
  rationale: συντέλεια என்பது வெறும் நிறுத்தத்தை மட்டுமல்லாமல் ஒரு காலத்தின் நிறைவு அல்லது உச்சக்கட்ட முடிவையும் குறிக்கிறது. ‘நிறைவு’ அந்த நுணுக்கத்தை அணுகத்தக்க தமிழில் காக்கிறது.
- source_word: τοῦ αἰῶνος
  choice: யுகத்தின்
  rationale: αἰών இங்கு உலகம் என்ற இடப்பொருளைவிட ஒரு காலஒழுங்கு அல்லது யுகத்தைக் குறிக்கிறது. கிரேக்கத்தில் இல்லாத ‘இந்த’ என்ற சுட்டைச் சேர்க்காமல் விடப்பட்டுள்ளது.
theological_decisions:
- issue: ἐν τῇ συντελείᾳ τοῦ αἰῶνος என்ற இறுதிக்காலச் சொற்றொடர்
  choice: யுகத்தின் நிறைவில்
  alternative: உலகத்தின் முடிவில்
  rationale: ‘யுகம்’ என்பது αἰών என்பதன் காலம்சார் பொருளைப் பாதுகாக்கிறது; ‘நிறைவு’ என்பது συντέλεια குறிக்கும் நிறைவுறுதலை வெளிப்படுத்துகிறது. இதனால் படைக்கப்பட்ட உலகம் அழிவதைத் திட்டவட்டமாக உரையில் சேர்க்காமலும், குறிப்பிட்ட ஓர் இறுதிக்காலக் கோட்பாட்டைத் திணிக்காமலும் மூலத்தின் இறையியல் அழுத்தம் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ஒப்புமையின் அமைப்பும் எதிர்கால நோக்கும் தெளிவாக வைக்கப்பட்டுள்ளன; ‘இந்த யுகம்’ என்று மூலத்தில் இல்லாத சுட்டு சேர்க்கப்படவில்லை.
