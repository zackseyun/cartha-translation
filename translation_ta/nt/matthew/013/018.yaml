id: MAT.13.18
reference: Matthew 13:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὑμεῖς οὖν ἀκούσατε τὴν παραβολὴν τοῦ ⸀σπείραντος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/018.yaml
  text: You[a], then, hear the parable of the one who sowed.
translation:
  language: ta
  text: ஆகையால், விதைத்தவனின் உவமையை நீங்கள் கேளுங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, பொருளை வெளிப்படையாக்கி: “விதைத்தவனைப் பற்றிய உவமையை.”'
    reason: τοῦ σπείραντος என்ற ஆறாம் வேற்றுமைத் தொடரைத் தமிழில் ‘விதைத்தவனின்’ என்று வடிவத்துக்கு நெருக்கமாகவும், ‘விதைத்தவனைப் பற்றிய’ என்று தொடர்பை வெளிப்படையாக்கியும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: Ὑμεῖς
  choice: நீங்கள்
  rationale: கிரேக்கத்தில் வெளிப்படையாகவும் வலியுறுத்தப்பட்டும் உள்ள பன்மை முன்னிலைப்பெயரைத் தமிழிலும் வெளிப்படையாகக் கொடுத்து, வாக்கியத்தில் இயல்பான வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: οὖν
  choice: ஆகையால்
  rationale: முந்தைய வசனங்களோடு உள்ள முடிவுறுத்தும் அல்லது தொடர்ச்சியான தொடர்பைத் தெளிவாகக் காட்டுகிறது; ‘எனவே’ என்பதும் சாத்தியம்.
- source_word: ἀκούσατε
  choice: கேளுங்கள்
  rationale: இது இரண்டாம் நபர் பன்மை இறந்தகாலத் தோற்றமுடைய கட்டளை வினை. ‘கேளுங்கள்’ கட்டளையின் வலிமையையும் ἀκούω என்பதன் அடிப்படைப் பொருளையும் காக்கிறது; ‘புரிந்துகொள்ளுங்கள்’ என்பது தேவையற்ற விளக்கம்.
- source_word: παραβολὴν
  choice: உவமையை
  rationale: நற்செய்தி நூல்களின் போதனைச் சூழலில் παραβολή என்பதற்கான வழக்கமான, துல்லியமான தமிழ் சொல் ‘உவமை’.
- source_word: τοῦ σπείραντος
  choice: விதைத்தவனின்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட இறந்தகாலப் பங்கேற்பு வடிவத்தை ‘விதைத்தவன்’ என்று நேரடியாகக் காட்டி, அதை ஒரு நிலையான பட்டப்பெயராக மாற்றுவதைத் தவிர்க்கிறது. ஆறாம் வேற்றுமைத் தொடர்பும் சுருக்கமாகப் பாதுகாக்கப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான கட்டளை நடை பயன்படுத்தப்பட்டுள்ளது. ‘நீங்கள்’ என்பதைக் கூறி மூலத்தின் வலியுறுத்தல் காக்கப்பட்டுள்ளது; ‘விதைத்தவனின்’ என்பது கிரேக்கத் தொடரின் சுருக்கத்தையும் ஓரளவு தெளிவின்மையையும் பாதுகாக்கிறது.
