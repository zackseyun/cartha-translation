id: MAT.24.39
reference: Matthew 24:39
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔγνωσαν ἕως ἦλθεν ὁ κατακλυσμὸς καὶ ἦρεν ἅπαντας, οὕτως ἔσται ⸀καὶ ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/039.yaml
  text: And they did not know until the flood came and swept them all away; so also will be the coming of the Son of Man.
translation:
  language: ta
  text: வெள்ளம் வந்து அனைவரையும் அடித்துக்கொண்டு போகும்வரை அவர்கள் அறியாதிருந்தார்கள்; அவ்வாறே மனிதகுமாரனின் வருகையும் இருக்கும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: அவர்கள் அறியாதிருந்தார்கள்
  rationale: ‘அறியவில்லை’ என்ற அடிப்படைப் பொருளை இயல்பான தமிழில் தருகிறது; அவர்கள் கவனிக்கவில்லை அல்லது புரிந்துகொள்ளவில்லை என்று பொருளைத் தேவையின்றி குறுக்கவில்லை.
- source_word: κατακλυσμός
  choice: வெள்ளம்
  rationale: நோவாவின் காலப் பெருவெள்ளத்தைச் சூழல் தெளிவுபடுத்துவதால், பொதுவாகவும் இயல்பாகவும் புரியும் சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἦρεν ἅπαντας
  choice: அனைவரையும் அடித்துக்கொண்டு போக
  rationale: αἴρω என்பதன் ‘எடுத்துச் செல்லுதல்/அகற்றுதல்’ பொருளையும் வெள்ளத்தின் வலிமையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; வெறும் ‘அழித்தது’ என விளக்கமாக மாற்றவில்லை.
- source_word: οὕτως ἔσται καὶ
  choice: அவ்வாறே … வருகையும் இருக்கும்
  rationale: οὕτως மற்றும் καί இணைந்து தரும் ஒப்புமை வலியுறுத்தலை ‘அவ்வாறே’ மற்றும் ‘-உம்’ மூலம் பாதுகாக்கிறது.
- source_word: ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: மனிதகுமாரனின் வருகை
  rationale: παρουσία என்பதற்கு இச்சூழலில் நிலைபெற்ற ‘வருகை’ என்பதையும், பட்டப்பெயரான ‘மனிதகுமாரன்’ என்பதையும் பயன்படுத்துகிறது.
theological_decisions:
- issue: வெள்ளத்தால் ‘அனைவரும் எடுத்துக்கொள்ளப்பட்டனர்’ என்பதன் தன்மை
  choice: அடித்துக்கொண்டு போக
  alternative: அனைவரையும் அழித்துப்போட்டது / எடுத்துக்கொண்டு போனது
  rationale: வெள்ளத்தால் நிகழ்ந்த அகற்றுதலைத் தெளிவாகக் காட்டுகிறது; அதேவேளை பின்னைய இறுதிக்காலக் கோட்பாட்டு அமைப்பை வசனத்திற்குள் இறக்குமதி செய்யவில்லை.
- issue: மனிதகுமாரனின் παρουσία
  choice: வருகை
  alternative: பிரசன்னம்
  rationale: இச்சூழலில் எதிர்கால வருகையே முதன்மை; ‘வருகை’ என்பது நவீனத் தமிழில் தெளிவாகவும் மதப்பிரிவுச் சார்பின்றியும் உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமும் பொதுவாசகத் தெளிவும் கொண்ட நடை. மூலத்தின் ஒப்புமை, காலத் தொடர்ச்சி, மற்றும் தீர்ப்பின் திடீர் தன்மை பாதுகாக்கப்பட்டுள்ளன.
