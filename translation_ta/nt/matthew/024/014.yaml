  text: καὶ κηρυχθήσεται τοῦτο τὸ εὐαγγέλιον τῆς βασιλείας ἐν ὅλῃ τῇ οἰκουμένῃ εἰς μαρτύριον πᾶσιν τοῖς ἔθνεσιν, καὶ τότε ἥξει τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/014.yaml
  text: And this good news of the kingdom will be proclaimed throughout the whole world as a testimony to all the nations[c][b][a], and then the end will come.
translation:
  language: ta
  text: அரசாட்சியைப் பற்றிய இந்த நற்செய்தி உலகம் முழுவதும் எல்லா மக்களினங்களுக்கும் சாட்சியாக அறிவிக்கப்படும்[a][b]; அதன் பிறகு முடிவு வரும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மனிதர்கள் வாழும் உலகம் முழுவதிலும்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘எல்லா நாடுகளுக்கும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρυχθήσεται
  choice: அறிவிக்கப்படும்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவம் பொதுவெளியில் அதிகாரப்பூர்வமாக அறிவிக்கப்படுவதைக் குறிக்கிறது. ‘அறிவிக்கப்படும்’ என்பது திருச்சபைச் சொல்வழக்கிற்கு மட்டும் கட்டுப்படாமல் இயல்பான நவீன தமிழில் அந்தப் பொருளைத் தருகிறது.
- source_word: τοῦτο τὸ εὐαγγέλιον τῆς βασιλείας
  choice: இந்த அரசாட்சியைப் பற்றிய நற்செய்தி
  rationale: εὐαγγέλιον என்பதற்கு வெளிப்படையான ‘நற்செய்தி’ என்பதையும், τῆς βασιλείας என்ற மரபுத்தொடர் கடவுளின் ஆட்சியைச் சார்ந்த செய்தி என்பதையும் இயல்பான தமிழில் தெரிவிக்கிறது. ‘பற்றிய’ என்பது தமிழில் தெளிவுக்காகப் பயன்படுத்தப்பட்டாலும், கிரேக்க மரபுத்தொடரின் தொடர்பை அளவுக்கு மீறி வரையறுக்கவில்லை.
- source_word: ἐν ὅλῃ τῇ οἰκουμένῃ
  choice: உலகம் முழுவதும்
  rationale: οἰκουμένη என்பது மனிதர்கள் வாழும் உலகைக் குறிக்கிறது. ‘உலகம் முழுவதும்’ இயல்பாகவும் விரிந்த அளவையும் தெளிவாகவும் தெரிவிக்கிறது; அதன் துல்லியமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: εἰς μαρτύριον
  choice: சாட்சியாக
  rationale: இந்த அறிவிப்பு சாட்சியாக அமையும் நோக்கம் அல்லது விளைவைத் தெரிவிக்கிறது. அது கேட்போருக்கு ஆதரவானதா எதிரானதா என்பதை மொழிபெயர்ப்பு தீர்மானிக்காமல் விடுகிறது.
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: எல்லா மக்களினங்களுக்கும்
  rationale: ἔθνη இங்கு உலகின் பல்வேறு நாடுகள் அல்லது மக்கள் குழுக்களை விரிவாகக் குறிக்கலாம். ‘மக்களினங்கள்’ என்பது நவீன தமிழில் மனிதக் குழுக்களைத் தெளிவாகக் காட்டுகிறது; ‘நாடுகள்’ என்ற முறையான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: καὶ τότε ἥξει τὸ τέλος
  choice: அதன் பிறகு முடிவு வரும்
  rationale: τότε அறிவிப்பின் பின்னான தொடரைச் சுட்டுகிறது; ἥξει மற்றும் τὸ τέλος ஆகியவற்றை எளிமையாக ‘முடிவு வரும்’ என்று வழங்குவது காலக்கணிப்பு அல்லது குறிப்பிட்ட இறுதிக்கால அமைப்பைச் சேர்க்காமல் மூலத்தின் வலிமையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: οἰκουμένη மற்றும் ἔθνη ஆகியவற்றின் பரப்பளவு
  choice: ‘உலகம் முழுவதும்’ மற்றும் ‘எல்லா மக்களினங்களுக்கும்’ என்று விரிந்த உலகளாவிய மொழியைப் பயன்படுத்துதல்
  alternative: ‘மனிதர்கள் வாழும் உலகம் முழுவதிலும்’ மற்றும் ‘எல்லா நாடுகளுக்கும்’
  rationale: வசனம் அறிவிப்பின் பரந்த அளவை வலியுறுத்துகிறது. இதை ரோமப் பேரரசுக்கு மட்டும் சுருக்காமலும், குறிப்பிட்ட பிற்கால மறைப்பணி அல்லது இறுதிக்காலக் கோட்பாட்டோடு இணைக்காமலும் மொழிபெயர்ப்பு அதன் வரலாற்று மற்றும் இறையியல் திறந்தநிலையைப் பாதுகாக்கிறது.
- issue: εἰς μαρτύριον என்பதில் சாட்சியின் தன்மை
  choice: ‘சாட்சியாக’ என்று நடுநிலையாக வழங்குதல்
  alternative: ‘அவர்களுக்கு எதிரான சாட்சியாக’
  rationale: கிரேக்க உரை சாட்சி ஆதரவானதா எதிரானதா என்பதை வெளிப்படையாகக் குறிப்பிடவில்லை. எனவே அந்த இறையியல் பதற்றத்தைத் தீர்க்காமல் பாதுகாக்கிறது.
- issue: τὸ τέλος என்பதன் குறிப்பு
  choice: ‘முடிவு’
  alternative: ‘நிறைவு’ அல்லது ‘இறுதிக்காலம்’
  rationale: மூல உரை எதன் முடிவு என்பதைக் குறிப்பாக விளக்கவில்லை. ‘முடிவு’ அந்தச் சுருக்கத்தையும் இறுதிக்கால ஒலியையும் காக்கிறது; ஒரு குறிப்பிட்ட காலவரிசைக் கோட்பாட்டைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் அமைக்கப்பட்டுள்ளது. ‘நற்செய்தி’ என்ற பரவலாக அறியப்பட்ட வேதாகமச் சொல் காக்கப்பட்டுள்ளது; ‘பிரசங்கிக்கப்படும்’ என்பதற்குப் பதில் பரந்த பொதுஅறிவிப்பு உணர்வைத் தரும் ‘அறிவிக்கப்படும்’ பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அனைத்தும் முதன்மை உரையில் இடம்பெறுகின்றன.
