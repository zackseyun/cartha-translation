  text: καὶ διὰ τὸ πληθυνθῆναι τὴν ἀνομίαν ψυγήσεται ἡ ἀγάπη τῶν πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/012.yaml
  text: And because lawlessness will be multiplied[b][a], the love of many will grow cold.
translation:
  language: ta
  text: அக்கிரமம் பெருகுவதால்[a], பலருடைய அன்பு[b] குளிர்ந்துபோகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அக்கிரமம் பெருக்கப்படுவதால்” அல்லது “அக்கிரமத்தின் பெருக்கத்தால்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அந்தப் பலருடைய அன்பு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ πληθυνθῆναι
  choice: பெருகுவதால்
  rationale: διά உடன் வரும் பெயர்ச்சுட்டிய வினையெச்சத் தொடர் காரணத்தைக் குறிக்கிறது. எதிர்காலச் சூழலில் இயல்பான தமிழில் காரணத்தையும் πληθυνθῆναι என்பதன் வினைத் தன்மையையும் ‘பெருகுவதால்’ தெளிவாகத் தருகிறது.
- source_word: ἀνομίαν
  choice: அக்கிரமம்
  rationale: கடவுளுடைய சட்டத்தை மீறுதல் அல்லது சட்டத்தைப் பொருட்படுத்தாமை என்ற கருத்தைத் துல்லியமாகவும் பொதுவாசகர்களுக்கு இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ψυγήσεται
  choice: குளிர்ந்துபோகும்
  rationale: உணர்வு அல்லது உறவுசார் அன்பு தணிவதைச் சித்தரிக்கும் மூலமொழியின் ‘குளிர்தல்’ உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: ἀγάπη
  choice: அன்பு
  rationale: ἀγάπη என்பதற்கான நேரடியான, வழக்கமான தமிழ் இணைச்சொல்; இங்கு அதன் உறவுசார் பொருளைத் திறந்தவாறே வைக்கிறது.
- source_word: τῶν πολλῶν
  choice: பலருடைய
  rationale: குறிப்பிட்ட குழுவை ஊகித்துச் சேர்க்காமல், மூலத்தின் பரந்த ஆனால் வரையறுக்கப்படாத பன்மைப் பொருளைக் காக்கிறது.
theological_decisions:
- issue: ‘பலருடைய அன்பு’ என்பது யாரைக் குறிக்கிறது?
  choice: குறிப்பிட்ட குழுவை அடையாளப்படுத்தாமல் ‘பலருடைய அன்பு’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: விசுவாசிகளின் அன்பு அல்லது பொதுவாக மனிதர்களின் அன்பு என்று வெளிப்படையாகக் குறிப்பிடுதல்.
  rationale: τῶν πολλῶν என்பது அந்த நபர்கள் யார் என்பதை வெளிப்படையாகச் சொல்லவில்லை. ஆகவே சீடர்கள், பெயரளவிலான விசுவாசிகள் அல்லது பொதுச் சமூகம் என எந்த ஒரு விளக்கத்தையும் மொழிபெயர்ப்புக்குள் சேர்க்காமல் மூலத்தின் இறையியல் திறந்தநிலையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘குளிர்ந்துபோகும்’ என்பது மூல உருவகத்தை இயல்பாகக் காக்கிறது; ‘பலருடைய’ என்பது எந்தக் குழுவையும் விளக்கமாகச் சேர்க்கவில்லை.
