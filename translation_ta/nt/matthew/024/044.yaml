id: MAT.24.44
reference: Matthew 24:44
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διὰ τοῦτο καὶ ὑμεῖς γίνεσθε ἕτοιμοι, ὅτι ᾗ ⸂οὐ δοκεῖτε ὥρᾳ⸃ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/044.yaml
  text: For this reason[a], you also must be ready, because the Son of Man is coming at an hour you do not expect.
translation:
  language: ta
  text: ஆகவே, நீங்களும் ஆயத்தமாக இருங்கள். ஏனெனில், நீங்கள் எதிர்பாராத நேரத்தில்[a] மனிதகுமாரன் வருகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் நினைக்காத நேரத்தில்.” இங்குள்ள கிரேக்க வினைச்சொல் “நினைத்தல்,” “கருதுதல்” என்றும், இந்தச் சூழலில் அதன் உட்பொருளாக “எதிர்பார்த்தல்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ஆகவே
  rationale: முந்தைய எச்சரிக்கையை அடிப்படையாகக் கொண்டு வரும் முடிவைச் சுருக்கமாகவும் இயல்பாகவும் இணைக்கிறது.
- source_word: καὶ ὑμεῖς
  choice: நீங்களும்
  rationale: καί என்பதன் சேர்த்துக் கூறும் வலியுறுத்தலையும் வெளிப்படையான ὑμεῖς என்பதன் அழுத்தத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: γίνεσθε ἕτοιμοι
  choice: ஆயத்தமாக இருங்கள்
  rationale: தொடர்ந்து நிலைத்திருக்க வேண்டிய ஆயத்த நிலையைக் குறிக்கும் நிகழ்காலக் கட்டளையின் வலிமையை, 'ஆகுங்கள்' என்ற செயற்கையான சொல்லாக்கமின்றி வெளிப்படுத்துகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: ஆயத்தமாக இருக்க வேண்டும் என்ற கட்டளைக்கான காரணத்தை அறிமுகப்படுத்தும் causal பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: ᾗ οὐ δοκεῖτε ὥρᾳ
  choice: நீங்கள் எதிர்பாராத நேரத்தில்
  rationale: கிரேக்கத் தொடரின் காலப்பொருளையும் வருகையின் எதிர்பாராத தன்மையையும் இயல்பான தமிழில் தருகிறது; δοκεῖτε என்பதன் நேரடியான 'நினைக்கிறீர்கள்' என்ற சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: நற்செய்தி நூல்களில் நிலைபெற்றுள்ள கிறிஸ்துவியல் பட்டத்தையும் அதன் செமித்திய மற்றும் தானியேல் நூல் பின்னொலிகளையும் விளக்கிப் பரப்பாமல் காக்கிறது.
- source_word: ἔρχεται
  choice: வருகிறார்
  rationale: எதிர்காலத்தைக் குறிக்கும் கிரேக்க நிகழ்காலத்தின் உயிரோட்டத்தையும் நிச்சயத்தன்மையையும் தமிழிலும் நிகழ்கால வடிவில் காக்கிறது.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου என்ற கிறிஸ்துவியல் பட்டத்தின் மொழிபெயர்ப்பு
  choice: மனிதகுமாரன்
  alternative: மனிதப் புதல்வர்
  rationale: பாரம்பரியமாக நிலைபெற்றுள்ள நேரடி வடிவம் பட்டத்தின் வேதாகமப் பின்னொலியையும் இறையியல் ஆழத்தையும் காக்கிறது; மாற்று வடிவம் தேவையற்ற விளக்கப் பொருளை உண்டாக்கக்கூடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘ஆயத்தமாக’ மற்றும் ‘மனிதகுமாரன்’ ஆகியவை வேதாகமப் பயன்பாட்டில் பரிச்சயமானவையாக இருந்தாலும் சாதாரண வாசகருக்குப் புரியும் சொற்கள். இரண்டு வாக்கியங்களாகப் பிரித்தல் கட்டளையையும் அதற்கான காரணத்தையும் தெளிவாக்குகிறது.
