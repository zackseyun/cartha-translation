id: MAT.24.6
reference: Matthew 24:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μελλήσετε δὲ ἀκούειν πολέμους καὶ ἀκοὰς πολέμων· ὁρᾶτε, μὴ θροεῖσθε· δεῖ ⸀γὰρ γενέσθαι, ἀλλ’ οὔπω ἐστὶν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/006.yaml
  text: And you are going to hear of wars and reports of wars. See that you are not alarmed[a], for it must happen, but the end is not yet.
translation:
  language: ta
  text: போர்களையும், போர்களைப் பற்றிய செய்திகளையும்[a] நீங்கள் கேள்விப்படப் போகிறீர்கள். பதற்றமடையாதபடி பார்த்துக்கொள்ளுங்கள்; ஏனெனில் இவை நிகழ வேண்டும். ஆனால் முடிவு இன்னும் வரவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘போர்களைப் பற்றிய வதந்திகள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடர் செய்திகள், அறிக்கைகள் அல்லது வதந்திகளைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μελλήσετε ἀκούειν
  choice: கேள்விப்படப் போகிறீர்கள்
  rationale: μέλλω உடன் வரும் வினையெச்சம் எதிர்பார்க்கப்படும் வருங்காலத்தைச் சுட்டுகிறது. தமிழில் இந்த எதிர்நோக்குச் சாயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πολέμους
  choice: போர்களை
  rationale: πόλεμος பொதுவாக ஒரு தனிப் போராட்டத்தை அல்ல, போரை அல்லது போர்களைக் குறிக்கிறது.
- source_word: ἀκοὰς πολέμων
  choice: போர்களைப் பற்றிய செய்திகளை
  rationale: ἀκοή இங்கு கேள்வி, செய்தி, அறிக்கை, அல்லது வதந்தி என்ற பொருள் கொள்ளலாம். ‘செய்திகள்’ என்பது அவை பொய்யானவை என்று முன்கூட்டியே கருதாமல் பரந்த பொருளைக் காக்கிறது.
- source_word: ὁρᾶτε, μὴ θροεῖσθε
  choice: பதற்றமடையாதபடி பார்த்துக்கொள்ளுங்கள்
  rationale: ὁρᾶτε இங்கு எச்சரிக்கைத் தொனியுடைய கட்டளை; θροεῖσθε என்பது கலக்கம் அல்லது பதற்றம் அடைவதைக் குறிக்கிறது. இந்தத் தமிழ் சொற்றொடர் இரண்டையும் இயல்பாக இணைக்கிறது.
- source_word: δεῖ γὰρ γενέσθαι
  choice: ஏனெனில் இவை நிகழ வேண்டும்
  rationale: δεῖ அவசியத்தை வெளிப்படுத்துகிறது; γενέσθαι என்பது ‘நிகழ்வது’ என்று பொருள். சூழலில் முன் குறிப்பிடப்பட்ட நிகழ்வுகளைச் சுட்டுவதற்காக ‘இவை’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἀλλ’ οὔπω ἐστὶν τὸ τέλος
  choice: ஆனால் முடிவு இன்னும் வரவில்லை
  rationale: τὸ τέλος என்பதன் பரந்த இறுதிக்காலப் பொருளை ‘முடிவு’ காக்கிறது; இயல்பான தமிழுக்காக ‘வரவில்லை’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: τὸ τέλος என்பதன் இறுதிக்காலப் பொருள்
  choice: முடிவு
  alternative: இறுதி நிறைவு
  rationale: கிரேக்கச் சொற்றொடர் எந்தக் குறிப்பிட்ட இறுதிக்காலத் திட்டத்தையும் வரையறுக்கவில்லை. ‘முடிவு’ அதன் பரந்த பொருளையும் இறையியல் அழுத்தத்தையும் காக்கிறது.
- issue: δεῖ என்பதில் வெளிப்படும் அவசியம்
  choice: நிகழ வேண்டும்
  alternative: நிகழ்வது அவசியம்
  rationale: நிகழ்வுகள் அவசியமாக நடைபெறும் என்ற மூலத்தின் கருத்தைத் தெளிவாகக் கூறுகிறது; அந்த அவசியத்தின் இறையியல் காரணத்தை உரை விளக்காததால் மொழிபெயர்ப்பும் அதை விரிவுபடுத்தவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், வாசிக்க எளிதானதாயும் கண்ணியமானதாயும் அமைக்கப்பட்டுள்ளது. ‘கேள்விப்படப் போகிறீர்கள்’ எதிர்பார்க்கப்படும் வருங்காலச் சாயலைக் காக்கிறது; ‘பதற்றமடையாதபடி பார்த்துக்கொள்ளுங்கள்’ எச்சரிக்கையையும் தடைச்சொல்லையும் இயல்பாக இணைக்கிறது. அடிக்குறிப்பு குறி அது விளக்கும் ‘செய்திகள்’ என்பதற்குப் பின்னர் வைக்கப்பட்டுள்ளது.
