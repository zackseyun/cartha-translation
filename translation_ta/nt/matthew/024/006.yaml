  source_fidelity: மூலத்தின் எதிர்நோக்குடைய எதிர்காலம் (μελλήσετε ἀκούειν), ‘போர்கள்’ மற்றும் ‘போர்களைப் பற்றிய செய்திகள்’ (πολέμους καὶ ἀκοὰς πολέμων), எச்சரிக்கைக் கட்டளை, நிகழ்வுகளின் அவசியம், மற்றும் இன்னும் வராத ‘முடிவு’ ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. ‘இவை’ என்பது δεῖ γενέσθαι என்பதன் சூழலால் உணர்த்தப்படும் பொருளை இயல்பாகத் தெளிவுபடுத்துகிறது; புதிய இறையியல் பொருளைச் சேர்ப்பதில்லை.
