  text: Καὶ ἐξελθὼν ὁ Ἰησοῦς ⸂ἀπὸ τοῦ ἱεροῦ ἐπορεύετο⸃, καὶ προσῆλθον οἱ μαθηταὶ αὐτοῦ ἐπιδεῖξαι αὐτῷ τὰς οἰκοδομὰς τοῦ ἱεροῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/001.yaml
  text: And Jesus went out from the temple and was going away[a], and his disciples came to show him the buildings of the temple.
translation:
  language: ta
  text: இயேசு ஆலயத்திலிருந்து[a] வெளியேறிப் போய்க்கொண்டிருந்தார்; அப்போது அவருடைய சீடர்கள் ஆலயக் கட்டடங்களை அவருக்குக் காட்டுவதற்காக அவரிடம் வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘ஆலயம்’ என மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொல், ஆலயத்தின் உள் புனிதப் பகுதியை மட்டும் அல்லாமல் ஆலய வளாகம் முழுவதையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: வெளியே வந்து
  rationale: இறந்தகால வினையெச்சம், முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் காட்டுகிறது; திசை சார்ந்த பொருளையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: ἱεροῦ
  choice: ஆலயத்திலிருந்து / ஆலயக்
  rationale: ἱερόν என்பது உள் பரிசுத்த இடத்தை மட்டும் அல்லாமல் ஆலய வளாகம் முழுவதையும் குறிக்கலாம். வாசிப்புக்கு இயல்பான ‘ஆலயம்’ முதன்மை உரையில் வைக்கப்பட்டு, அதன் பரந்த பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: ἐπορεύετο
  choice: அங்கிருந்து போய்க்கொண்டிருந்தார்
  rationale: முற்றுப்பெறாத இறந்தகால வடிவத்தின் தொடர்ச்சியான நகர்வை ‘போய்க்கொண்டிருந்தார்’ வெளிப்படுத்துகிறது; ‘அங்கிருந்து’ என்பது சூழலில் உள்ள விலகிச் செல்லும் பொருளை இயல்பாகத் தருகிறது.
- source_word: προσῆλθον
  choice: அவரிடம் வந்தார்கள்
  rationale: சீடர்கள் இயேசுவை அணுகியதை நவீனத் தமிழில் இயல்பாகக் கூறுகிறது.
- source_word: ἐπιδεῖξαι
  choice: காட்டுவதற்காக
  rationale: இறுதிநிலை வினை வடிவம் நோக்கத்தைக் குறிப்பதால், ‘காட்டுவதற்காக’ என மொழிபெயர்க்கப்பட்டது.
- source_word: οἰκοδομὰς
  choice: கட்டடங்களை
  rationale: ஆலய வளாகத்திலுள்ள கட்டப்பட்ட அமைப்புகளை நேரடியாகவும் தெளிவாகவும் குறிக்கிறது.
theological_decisions:
- issue: ἱερόν மற்றும் ναός ஆகியவற்றுக்கிடையிலான பொருள் வேறுபாடு
  choice: ஆலயம்
  alternative: ஆலய வளாகம்
  rationale: இங்கு வரும் ἱερόν ஆலய வளாகம் முழுவதையும் குறிக்கக்கூடியது; எனினும் இயல்பான வேதாகமத் தமிழுக்காக ‘ஆலயம்’ முதன்மை உரையில் வைக்கப்பட்டு, உள் திருத்தலத்தை மட்டும் குறிக்கவில்லை என்ற நுட்பம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடியதாயும் கண்ணியமானதாயும் அமைக்கப்பட்டது. கிரேக்க வாக்கியத்தின் நிகழ்வுக் காலவரிசையும் ἐπορεύετο என்பதன் தொடர்ச்சியான செயற்பாங்கும் பாதுகாக்கப்பட்டுள்ளன.
