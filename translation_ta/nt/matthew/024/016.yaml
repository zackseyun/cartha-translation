lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: இயேசுவின் உரையில் நிகழ்வுகளின் தொடர்ச்சியைக் குறிக்கும் கால வினையடை; நவீன தமிழில் இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: யூதேயாவில் இருப்பவர்கள்
  rationale: முன்னிடைச்சொல் தொடருடன் வரும் பெயர்ச்சுட்டு மக்கள் குழுவைக் குறிக்கிறது; அவர்களின் இருப்பிடத்தை மட்டும் கூறி, கூடுதல் அடையாளத்தைச் சேர்க்கவில்லை.
- source_word: Ἰουδαίᾳ
  choice: யூதேயா
  rationale: அந்தப் புவியியல் பகுதியின் தமிழில் வழக்கமான பெயர்வடிவம்.
- source_word: φευγέτωσαν
  choice: தப்பியோட வேண்டும்
  rationale: மூன்றாம் நபர் பன்மை நிகழ்காலக் கட்டளை வடிவத்தின் அவசரமான கட்டளைத் தன்மையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐπὶ τὰ ὄρη
  choice: மலைகளுக்கு
  rationale: இயக்கத்தைச் சுட்டும் வினையுடன் ἐπί மற்றும் வேற்றுமை வடிவம் செல்ல வேண்டிய இலக்கைச் சுட்டுகிறது; ὄρη என்பதன் பன்மையையும் காக்கிறது.
theological_decisions:
- issue: இறுதிக்கால எச்சரிக்கையில் கட்டளையின் வலிமை
  choice: “தப்பியோட வேண்டும்” என்ற நேரடியான, அவசரக் கட்டளையாக மொழிபெயர்த்தல்
  alternative: “மலைகளுக்குத் தப்பியோடட்டும்” என்ற வடிவநெருக்கமான மொழிபெயர்ப்பு
  rationale: இது கோட்பாட்டை விளக்குவதற்குப் பதிலாக நடைமுறை அறிவுறுத்தலை வழங்குகிறது. தேர்ந்த வடிவம் எந்தக் கூடுதல் இறுதிக்கால விளக்கத்தையும் புகுத்தாமல் மூலத்தின் அவசரத்தை இயல்பான தமிழில் காக்கிறது.
translation_notes:
  register: நவீன, தரமான, கண்ணியமான தமிழ். “தப்பியோட” என்பது வெறும் இடமாற்றத்தை அல்லாமல் ஆபத்திலிருந்து தப்பிச் செல்லும் φεύγω என்பதன் பொருளைத் தெளிவாகக் காட்டுகிறது; “வேண்டும்” கட்டளையின் அவசர வலிமையை இயல்பாகத் தருகிறது.
