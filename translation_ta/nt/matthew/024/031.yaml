base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/031.yaml
  text: And he will send out his angels with a loud trumpet[a], and they will gather his chosen ones from the four winds[d][c][b], from one end of the heavens to the other.
translation:
  language: ta
  text: அவர் தமது தூதர்களைப் பெரும் எக்காளத்துடன்[a] அனுப்புவார். அவர்கள், அவர் தேர்ந்தெடுத்தவர்களை[b] நான்கு காற்றுகளிலிருந்தும்[c]—வானங்களின் ஒரு முனையிலிருந்து அவற்றின் மறுமுனைவரை[d]—ஒன்றுகூட்டுவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உரத்த எக்காளத்துடன்” அல்லது “எக்காள முழக்கத்துடன்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவருடைய தெரிந்துகொள்ளப்பட்டவர்களை.”
    reason: lexical_alternative
  - marker: c
    text: “நான்கு காற்றுகள்” என்பது எல்லாத் திசைகளிலும் உள்ள மிகத் தொலைவான இடங்களைக் குறிக்கும் மரபுத்தொடர்.
    reason: cultural_note
  - marker: d
    text: கிரேக்கத்தில், “வானங்களின் எல்லைகளிலிருந்து அவற்றின் எல்லைகள்வரை”; இது ஒரு முனையிலிருந்து மறுமுனைவரையிலான முழுப் பரப்பைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: அனுப்புவார்
  rationale: எதிர்காலச் செயலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது. சூழலில் தூதர்கள் ஒரு பணிக்காக அனுப்பப்படுவது தெளிவாக இருப்பதால், கூடுதல் விளக்கச் சொல்லின்றியே கிரேக்க வினையின் பொருள் காக்கப்படுகிறது.
- source_word: ἀγγέλους
  choice: தூதர்கள்
  rationale: இறுதிக்காலச் சூழலில் மனிதச் செய்தியாளர்கள் அல்ல, வானதூதர்களே குறிக்கப்படுகின்றனர். ‘தமது’ என்பது αὐτοῦ என்பதைக் காட்டுகிறது.
- source_word: μετὰ σάλπιγγος μεγάλης
  choice: பெரும் எக்காள முழக்கத்துடன்
  rationale: σάλπιγξ என்பதன் எக்காளப் படிமத்தையும் μεγάλη என்பதன் ‘பெரும்’ வலிமையையும் காக்கிறது. தமிழில் எக்காளம் ஒலிப்பதைக் குறிக்க ‘முழக்கம்’ சேர்ப்பது இயல்பானது; மாற்று நேரடி வாசிப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: ἐπισυνάξουσιν
  choice: ஒன்றுகூட்டுவார்கள்
  rationale: தூதர்களே பன்மை எழுவாய் என்பதைத் தெளிவாக வைத்துக் கொண்டு, பல இடங்களிலிருந்து ஒரே இடத்துக்குச் சேர்த்தல் என்ற கூட்டு வினையின் நுணுக்கத்தை வெளிப்படுத்துகிறது.
- source_word: ἐκλεκτούς
  choice: அவர் தேர்ந்தெடுத்தவர்கள்
  rationale: தேர்ந்தெடுக்கப்பட்டவர்கள் என்ற அடிப்படைப் பொருளைத் தெளிவான பொதுத் தமிழில் தருகிறது; பிற்காலக் கோட்பாட்டுச் சொல்லாட்சியை முதன்மை உரையில் திணிக்கவில்லை.
- source_word: ἐκ τῶν τεσσάρων ἀνέμων
  choice: நான்கு காற்றுத்திசைகளிலிருந்தும்
  rationale: ‘நான்கு காற்றுகள்’ என்ற மூலப் படிமத்தையும், எல்லாத் திசைகளையும் குறிக்கும் மரபுத்தொடரின் பொருளையும் தமிழில் இணைத்துக் காக்கிறது.
- source_word: ἀπ’ ἄκρων οὐρανῶν ἕως τῶν ἄκρων αὐτῶν
  choice: வானங்களின் ஒரு கோடியிலிருந்து மறு கோடிவரை
  rationale: οὐρανῶν என்ற பன்மையை ‘வானங்கள்’ எனக் காத்து, ஒரு எல்லையிலிருந்து எதிர் எல்லைவரையிலான முழு விரிவை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: இறுதிக்காலச் சூழலில் ἐκλεκτούς என்பதன் மொழிபெயர்ப்பு
  choice: அவர் தேர்ந்தெடுத்தவர்கள்
  alternative: தெரிந்துகொள்ளப்பட்டவர்கள்
  rationale: இவர்கள் யார் என்பதை வசனம் முறையான இறையியல் அமைப்பாக விளக்கவில்லை. ஆகவே சொற்பொருளைக் காத்து, எந்தச் சமயப்பிரிவின் தனிப்பட்ட விளக்கத்தையும் முதன்மை உரையில் சேர்க்கவில்லை.
- issue: ஒன்றுகூட்டப்படுவோரின் பரப்பைக் குறிக்கும் படிமம்
  choice: நான்கு காற்றுத்திசைகளிலிருந்தும்—வானங்களின் ஒரு கோடியிலிருந்து மறு கோடிவரை
  alternative: எல்லாத் திசைகளிலிருந்தும்
  rationale: கிரேக்கத்தின் பிரபஞ்ச அளவிலான விரிந்த படிமத்தை ஒரு குறுகிய புவியியல் விளக்கமாக மாற்றாமல் காக்கிறது; மரபுத்தொடரின் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘எக்காளம்,’ ‘நான்கு காற்றுத்திசைகள்,’ ‘வானங்கள்’ ஆகிய வேதாகமப் படிமங்கள் காக்கப்பட்டுள்ளன; கடினமான மரபுத்தொடர்கள் அடிக்குறிப்புகளில் சுருக்கமாக விளக்கப்பட்டுள்ளன.
