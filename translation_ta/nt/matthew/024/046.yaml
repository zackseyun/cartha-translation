language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μακάριος ὁ δοῦλος ἐκεῖνος ὃν ἐλθὼν ὁ κύριος αὐτοῦ εὑρήσει ⸂οὕτως ποιοῦντα⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/046.yaml
  text: Blessed is that servant whom his lord, when he comes, will find doing so.
translation:
  language: ta
  text: தன் ஆண்டவர் வரும்போது இவ்வாறு செய்துகொண்டிருப்பதைக் காணும் அந்த அடிமை பேறுபெற்றவன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος
  choice: பேறுபெற்றவர்
  rationale: இறைவனுடைய அங்கீகாரத்தையும் நல்வாழ்வு நிலையையும் குறிக்கும் வாழ்த்துச் சொல்லின் பொருளை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: δοῦλος
  choice: பணியாளர்
  rationale: இச்சூழலில் எஜமானரிடம் பொறுப்பு ஒப்படைக்கப்பட்ட வீட்டுப் பணியாளரைக் குறிக்கிறது; நவீன வாசிப்பில் தேவையற்ற கடுமையைத் தவிர்த்தபடியே கீழ்ப்பட்ட சேவை உறவை வெளிப்படுத்துகிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: அதிகாரமும் உடைமையாளர் உறவும் கொண்ட κύριος என்பதைக் காட்டுகிறது; உவமையின் மனித ஆண்டவரையும் இயேசுவைக் குறிக்கும் சாத்தியமான ஆழ்பொருளையும் திறந்துவைக்கிறது.
- source_word: οὕτως ποιοῦντα
  choice: இவ்வாறு செய்துகொண்டிருப்பதாக
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட கடமையைத் தொடர்ந்து நிறைவேற்றிக்கொண்டிருக்கும் செயலை οὕτως மற்றும் நிகழ்கால வினையெச்சம் இயல்பாகச் சுட்டுகின்றன.
theological_decisions:
- issue: κύριος என்பதன் உவமை மற்றும் கிறிஸ்துவியல் எதிரொலி
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: உவமையில் பணியாளரின் அதிகாரியைக் குறிக்கும் நேரடிப் பொருளைத் தக்கவைத்து, திரும்பிவரும் ஆண்டவராக இயேசுவை வாசிக்கும் சூழல்சார் எதிரொலியையும் முன்கூட்டியே ஒடுக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் சுருக்கமான, கண்ணியமான வாக்கியம். கிரேக்க வாக்கியத்தின் வலியுறுத்தலை இயல்பாக்க ‘அந்தப் பணியாளர்’ என்பது இறுதியில் வைக்கப்பட்டுள்ளது; தொடர்ச்சியான செயலை ‘செய்துகொண்டிருப்பதாக’ வெளிப்படுத்துகிறது.
