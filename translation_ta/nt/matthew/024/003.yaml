id: MAT.24.3
reference: Matthew 24:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ Ὄρους τῶν Ἐλαιῶν προσῆλθον αὐτῷ οἱ μαθηταὶ κατ’ ἰδίαν λέγοντες· Εἰπὸν ἡμῖν πότε ταῦτα ἔσται, καὶ τί τὸ σημεῖον τῆς σῆς παρουσίας ⸀καὶ συντελείας τοῦ αἰῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/003.yaml
  text: As he was sitting on the Mount of Olives[a], the disciples came to him privately, saying, “Tell us, when will these things be[b], and what will be the sign of your coming and of the end of the age?”
translation:
  language: ta
  text: 'அவர் ஒலிவ மலையில் அமர்ந்திருந்தபோது, சீடர்கள் தனியாக அவரிடம் வந்து, “எங்களுக்குச் சொல்லுங்கள்: இவை எப்போது நிகழும்? உமது வருகைக்கும்[a] இந்த யுகத்தின் முடிவுக்கும்[b] அடையாளம் என்ன?” என்று கேட்டார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வருகை” என்பதற்கு “இருப்பு” அல்லது “வந்துசேருதல்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “யுகத்தின் முடிவு” என்பதை “யுகத்தின் நிறைவு” என்றும் மொழிபெயர்க்கலாம்; மரபாக, “உலகத்தின் முடிவு” என்றும் வழங்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: Καθημένου δὲ αὐτοῦ
  choice: அவர் அமர்ந்திருந்தபோது
  rationale: இது காலச்சூழலைக் காட்டும் genitive absolute அமைப்பு. தொடர்ந்துகொண்டிருந்த அமர்ந்திருக்கும் செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐπὶ τοῦ Ὄρους τῶν Ἐλαιῶν
  choice: ஒலிவமலையில்
  rationale: அறியப்பட்ட இடப்பெயரை இயல்பான தமிழில் தருகிறது; ἐπί இச்சூழலில் இருப்பிடத்தைக் குறிக்கிறது.
- source_word: προσῆλθον αὐτῷ
  choice: அவரிடம் வந்து
  rationale: இயேசுவை நோக்கிச் சீடர்கள் அணுகியதை எளிய, இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: κατ’ ἰδίαν
  choice: தனியாக
  rationale: மற்றவர்களிடமிருந்து விலகித் தனிப்பட்ட முறையில் பேச வந்ததைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: Εἰπὸν ἡμῖν
  choice: எங்களுக்குச் சொல்லும்
  rationale: கட்டளை வடிவிலுள்ள வேண்டுகோளை மரியாதையுடனும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: πότε ταῦτα ἔσται
  choice: இவை எப்போது நிகழும்?
  rationale: ἔσται என்பதன் எதிர்காலப் பொருளை தமிழில் இயல்பாகத் தருகிறது; ταῦτα என்பதன் சுட்டுப்பொருளையும் காக்கிறது.
- source_word: σημεῖον
  choice: அடையாளம்
  rationale: வரவிருக்கும் நிகழ்வைச் சுட்டிக்காட்டும் குறி என்ற பொருளைத் தெளிவாகத் தரும் வழக்கமான தமிழ் சொல்.
- source_word: παρουσίας
  choice: வருகை
  rationale: இச்சூழலில் எதிர்கால வருகையை இயல்பாகக் குறிக்கிறது; ‘இருப்பு’, ‘வந்துசேருதல்’ என்ற சொற்பொருள் வாய்ப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: συντελείας τοῦ αἰῶνος
  choice: இந்த யுகத்தின் முடிவு
  rationale: αἰών என்பது பௌதிக உலகைக் காட்டிலும் ஒரு யுகத்தைக் குறிக்கிறது. συντέλεια அதன் முடிவு அல்லது நிறைவைச் சுட்டுகிறது.
- source_word: τὸ σημεῖον τῆς σῆς παρουσίας καὶ συντελείας
  choice: உமது வருகையையும் இந்த யுகத்தின் முடிவையும் குறிக்கும் அடையாளம்
  rationale: கிரேக்கத்தில் ஒருமையில் உள்ள ‘அடையாளம்’ வருகை மற்றும் யுக முடிவு இரண்டுடனும் இலக்கண ரீதியாக இணைக்கப்பட்டிருப்பதைத் தமிழில் காக்கிறது.
theological_decisions:
- issue: முடிவுக்காலச் சூழலில் παρουσία என்பதன் மொழிபெயர்ப்பு
  choice: வருகை
  alternative: இருப்பு; வந்துசேருதல்
  rationale: சொல் ‘இருப்பு’ அல்லது ‘வந்துசேருதல்’ எனவும் பொருள்படலாம். ஆனால் சீடர்களின் எதிர்கால நோக்குள்ள கேள்வியில் ‘வருகை’ தெளிவாகவும் இயல்பாகவும் உள்ளது; காலக்கணிப்பையோ நிகழ்வுகளின் வரிசையையோ இது நிர்ணயிப்பதில்லை.
- issue: συντελείας τοῦ αἰῶνος என்பதன் மொழிபெயர்ப்பு
  choice: இந்த யுகத்தின் முடிவு
  alternative: இந்த யுகத்தின் நிறைவு; உலகத்தின் முடிவு
  rationale: மூலச்சொற்கள் பௌதிக உலகத்தின் அழிவை நேரடியாகக் கூறாமல், ஒரு யுகத்தின் நிறைவு அல்லது முடிவைக் கூறுகின்றன. எனவே ‘யுகத்தின் முடிவு’ மூலத்தின் வரம்பையும் இறையியல் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘யுகம்’ என்பது αἰών என்பதன் காலப்பிரிவு சார்ந்த பொருளைக் காக்கிறது; ‘உலகம்’ என்ற மொழிபெயர்ப்பால் உருவாகக்கூடிய பௌதிக உலகழிவு என்ற கூடுதல் கருத்து முதன்மை உரையில் தவிர்க்கப்பட்டது. வழங்கப்பட்ட ஆங்கில ஆலோசனை உரையில் ஒலிவமலைக்குப் பின் இருந்த [a] குறி அதன் அடிக்குறிப்போடு பொருந்தாததால், பொருத்தமான ‘வருகை’ என்ற சொல்லுக்குப் பின் வைக்கப்பட்டது.
