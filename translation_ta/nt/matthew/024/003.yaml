  source_fidelity: மூலத்தின் காலச்சூழல், தனிப்பட்ட அணுகல், இரண்டு கேள்விகள், மற்றும் ஒருமை ‘அடையாளம்’ ஆகியவை பெரும்பாலும் சரியாகக் கொடுக்கப்பட்டுள்ளன. ஆனால் Εἰπὸν ἡμῖν என்பதற்கான நேரடி வேண்டுகோள் மேற்கோளின் இறுதியில் ‘எங்களுக்குச் சொல்லும்’ என இருப்பது நவீனத் தரத் தமிழில் இலக்கணமாகவும் உரையாடல் இயல்பாகவும் இல்லை. அதைச் சரியான பன்மை மரியாதை வேண்டுகோளாகவும், மூலத்தின் வரிசைக்கு நெருக்கமாகவும் திருத்த வேண்டும்.
  naturalness: ‘எங்களுக்குச் சொல்லும்’ என்பதற்குப் பதிலாக ‘எங்களுக்குச் சொல்லுங்கள்’ தேவை. மேலும் ‘உமது வருகையையும் ... முடிவையும் குறிக்கும் அடையாளம்’ என்பதற்குப் பதிலாக வேற்றுமை உருபுகளுடன் ‘வருகைக்கும் ... முடிவுக்கும் அடையாளம்’ என்பது τὸ σημεῖον இரண்டையும் சார்வதைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்தும்.
  terminology: ‘ஒலிவ மலை’, ‘சீடர்கள்’, ‘வருகை’, ‘யுகத்தின் முடிவு’, ‘அடையாளம்’ ஆகியவை நவீனத் தரத் தமிழுக்கும் மூலத்தின் பொருளுக்கும் ஏற்றவை. παρουσία-க்கான மாற்றுச் சொற்களையும் συντέλεια τοῦ αἰῶνος-க்கான மரபுவழி மாற்றையும் அடிக்குறிப்புகள் தகுந்தவாறு காக்கின்றன.
