lexical_decisions:
- source_word: ὁ ἐπὶ τοῦ δώματος
  choice: வீட்டின் மொட்டைமாடியில் இருப்பவர்
  rationale: கிரேக்கச் சொற்றொடர் பெயர்ச்சொல்லாகச் செயல்பட்டு, வீட்டின் மேற்பகுதியில் இருப்பவரைக் குறிக்கிறது. பண்டைய வீடுகளின் பயன்படுத்தக்கூடிய தட்டையான கூரையைத் தமிழில் இயல்பாகக் குறிக்க ‘மொட்டைமாடி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: μὴ καταβάτω
  choice: கீழே இறங்க வேண்டாம்
  rationale: அவசரமான தடைக் கட்டளையை நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; மேற்பகுதியிலிருந்து கீழ்நோக்கிய இயக்கத்தையும் காக்கிறது.
- source_word: ἆραι
  choice: எடுப்பதற்காக
  rationale: இறங்குவதன் நோக்கத்தை வெளிப்படுத்தும் கிரேக்க இறந்தகால வினையெச்சத்தின் செயல்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: τὰ ἐκ τῆς οἰκίας αὐτοῦ
  choice: தன் வீட்டிலுள்ள பொருட்களை
  rationale: வீட்டிலிருந்து எடுக்கப்படக்கூடிய உடைமைகள் அல்லது பொருட்கள் என்பதே சூழல்சார் பொருள். ‘தன்’ என்பது ஒரே நபரைக் குறிக்கும் αὐτοῦ என்பதன் இயல்பான தமிழ் பிரதிபெயர்ப்பு.
- source_word: οἰκίας
  choice: வீடு
  rationale: கூரையிலிருந்து இறங்கி உள்ளேயுள்ள பொருட்களை எடுக்கும் உடற்கூறு சூழலில், உணர்வுசார் ‘இல்லம்’ என்பதைவிட கட்டடத்தைக் குறிக்கும் ‘வீடு’ துல்லியமானது.
theological_decisions:
- issue: பிரதிநிதித்துவ ஒருமை ஆண்பால் குறிப்பு
  choice: பாலினத்தைக் குறிப்பாக வெளிப்படுத்தாமல் ‘இருப்பவர்’ மற்றும் ‘தன்’ என்ற ஒருமை வடிவங்களைப் பயன்படுத்துதல்
  alternative: ‘அவன்’ அல்லது ‘அவருடைய’ என்று வெளிப்படையான ஆண்பால் வடிவம் பயன்படுத்துதல்
  rationale: கிரேக்க வடிவம் இலக்கண ரீதியாக ஆண்பால் ஒருமையாக இருந்தாலும், யாராயினும் பொருந்தும் பிரதிநிதித்துவக் கட்டளையாகச் செயல்படுகிறது. தமிழில் ‘இருப்பவர்/தன்’ ஒருமையையும் பொதுவான பயன்பாட்டையும் இயல்பாகக் காக்கின்றன; எந்தத் தத்துவக் கருத்தையும் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பானதும் கண்ணியமானதும். ‘மொட்டைமாடி’ பண்டைய மத்தியதரைக் கடல் பகுதி வீடுகளின் தட்டையான, பயன்படுத்தக்கூடிய கூரையைத் தெளிவுபடுத்துகிறது.
