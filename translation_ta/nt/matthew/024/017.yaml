translation:
  language: ta
  text: வீட்டு மொட்டைமாடியில் இருப்பவர், தன் வீட்டிலிருந்து பொருட்களை எடுத்துக்கொள்வதற்காகக் கீழே இறங்க வேண்டாம்.[a]
