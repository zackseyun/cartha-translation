  text: πάντα δὲ ταῦτα ἀρχὴ ὠδίνων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/008.yaml
  text: But all these things are the beginning of birth pains[a].
translation:
  language: ta
  text: ஆனால், இவை அனைத்தும் பிரசவ வேதனைகளின் தொடக்கமே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பேறுகால வேதனைகள்’ அல்லது ‘பிரசவ வலிகள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல், வரவிருக்கும் துன்பத்தின் ஆரம்பக்கட்டத்தைக் குறிக்கும் உருவகமாகக் குழந்தைப்பேற்றின் வேதனைகளை நினைவூட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα … ταῦτα
  choice: இவை அனைத்தும்
  rationale: முன்னர் குறிப்பிடப்பட்ட நிகழ்வுகள் அனைத்தையும் சுட்டுகிறது; நவீனத் தமிழில் இயல்பாகவும் மூலத்தின் முழுமைப் பொருளைத் தெளிவாகவும் தருகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய நிகழ்வுகளின் பட்டியலிலிருந்து இயேசுவின் மதிப்பீட்டுக்குச் செல்லும் மென்மையான மாறுபாட்டை வெளிப்படுத்துகிறது.
- source_word: ἀρχὴ
  choice: தொடக்கமே
  rationale: இவை முடிவு அல்ல, வரவிருக்கும் துன்பத்தின் ஆரம்பக்கட்டம் என்பதைக் காட்டுகிறது; ‘-ஏ’ வலியுறுத்தல் இங்குள்ள மதிப்பீட்டுத் திருப்பத்தை இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: ὠδίνων
  choice: பிரசவ வேதனைகளின்
  rationale: குழந்தைப்பேற்றின் வேதனைகளைச் சுட்டும் கிரேக்க உருவகத்தைத் தட்டையாக்காமல் காக்கிறது; ‘பிரசவ வேதனை’ நவீனத் தமிழில் தெளிவானதும் கண்ணியமானதும் ஆகும்.
theological_decisions:
- issue: ὠδίνων என்பதன் பிரசவ உருவகம்
  choice: ‘பிரசவ வேதனைகள்’ என்று உருவகத்தை அப்படியே தக்கவைத்தல்
  alternative: ‘துன்பங்கள்’ அல்லது ‘துயரங்கள்’ என்று பொதுப்படுத்துதல்
  rationale: முந்தைய கலக்கங்கள் முடிவே அல்லாமல், பெரிதாகிவரும் ஒரு நிகழ்வின் ஆரம்பக்கட்டம் என்ற இறுதிக்காலத் திணறலை உருவகம் தக்கவைக்கிறது; வசனம் கூறாத குறிப்பிட்ட கோட்பாட்டுத் திட்டத்தை இதில் சேர்க்கவில்லை.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு ஏற்ற, சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘பிரசவ வேதனைகள்’ என்ற உருவகம் தெளிவாகத் தக்கவைக்கப்பட்டுள்ளது.
