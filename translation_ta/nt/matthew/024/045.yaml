id: MAT.24.45
reference: Matthew 24:45
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τίς ἄρα ἐστὶν ὁ πιστὸς δοῦλος καὶ φρόνιμος ὃν κατέστησεν ὁ ⸀κύριος ἐπὶ τῆς ⸀οἰκετείας αὐτοῦ τοῦ ⸀δοῦναι αὐτοῖς τὴν τροφὴν ἐν καιρῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/045.yaml
  text: Who then is the faithful and wise servant[b][a], whom the master has appointed over his household to give them their food at the proper time?
translation:
  language: ta
  text: “அப்படியானால், தன் வீட்டுப் பணியாளர்களுக்கு உரிய வேளையில் உணவு கொடுப்பதற்காக எஜமான்[a] அவர்கள்மேல் நியமித்த நம்பிக்கைக்குரிய, விவேகமுள்ள அடிமை[b] யார்?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்டவர்.” இந்த வீட்டு உவமைச் சூழலில் கிரேக்கச் சொல் “எஜமான்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பணியாளர்.” கிரேக்கச் சொல் சூழலுக்கேற்ப “அடிமை” அல்லது “பணியாளர்” என்று பொருள்படலாம்; இங்கு எஜமானின் அதிகாரத்திற்குக் கீழ்ப்பட்ட வலுவான நிலையை “அடிமை” தக்கவைக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς ἄρα
  choice: அப்படியானால் ... யார்?
  rationale: τίς என்பதன் வினாவையும், ἄρα முந்தைய போதனையிலிருந்து முடிவை நோக்கி நகர்த்தும் உரையாடல் வலிமையையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: πιστὸς
  choice: உண்மையுள்ள
  rationale: ஒப்படைக்கப்பட்ட பொறுப்பை நம்பகமாக நிறைவேற்றும் பண்பைச் சுட்டுகிறது; தமிழில் நெறிசார் ஒலிப்பையும் நம்பகத்தன்மையையும் தக்கவைக்கிறது.
- source_word: δοῦλος
  choice: அடிமை
  rationale: எஜமானின் அதிகாரத்திற்குக் கீழ்ப்பட்ட நிலையைக் கிரேக்கச் சொல் இங்கு வலுவாகக் குறிக்கிறது. மென்மையான மாற்றாக ‘பணியாளர்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: φρόνιμος
  choice: விவேகமுள்ள
  rationale: வெறும் அறிவைக் காட்டிலும் நடைமுறை ஞானத்தையும் சூழ்நிலைக்கேற்ற புத்திசாலித்தனத்தையும் குறிக்கும் φρόνιμος என்பதற்கு இது பொருத்தமான இயல்பான தமிழ்.
- source_word: κατέστησεν
  choice: நியமித்த
  rationale: ஒரு பொறுப்புள்ள நிலைக்கு அதிகாரபூர்வமாக அமர்த்துதல் என்ற சூழல்சார் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: κύριος
  choice: எஜமான்
  rationale: வீட்டு நிர்வாக உவமையில் அடிமைகள் அல்லது பணியாளர்கள்மேல் அதிகாரமுள்ள வீட்டுத் தலைவரைக் குறிக்கும் சமூக உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οἰκετείας
  choice: வீட்டார்
  rationale: ஒரு வீட்டைச் சேர்ந்த குழுவினரை, குறிப்பாக அதன் பணியாளர்களை, சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது; ‘அவர்கள்மேல்’ மற்றும் அவர்களுக்கு உணவு கொடுப்பது என்ற தொடர்ச்சி குழுவினரைத் தெளிவாக்குகிறது.
- source_word: τοῦ δοῦναι
  choice: உணவு கொடுப்பதற்காக
  rationale: நியமனத்தின் நோக்கத்தை வெளிப்படுத்தும் கிரேக்க articular infinitive-ஐத் தமிழில் வெளிப்படையாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: τροφὴν
  choice: உணவு
  rationale: உணவு அல்லது போஷாக்கு என்ற அடிப்படைப் பொருளைத் தக்கவைத்து, ‘பங்கு’ அல்லது ‘ரேஷன்’ போன்ற சூழலில் சாத்தியமான ஆனால் மிகக் குறிப்பான பொருளைத் திணிக்கவில்லை.
- source_word: ἐν καιρῷ
  choice: உரிய வேளையில்
  rationale: வெறும் காலப்புள்ளியைக் காட்டாமல், பொருத்தமான அல்லது நிர்ணயிக்கப்பட்ட நேரம் என்ற καιρός என்பதன் நுட்பத்தை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: வீட்டு உவமைச் சூழலில் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: எஜமான்
  alternative: ஆண்டவர்
  rationale: வசனத்தின் மேற்பரப்பில் காணப்படும் எஜமான்–அடிமை வீட்டு உறவை ‘எஜமான்’ நேரடியாகக் காட்டுகிறது. விரிந்த உரையாடலில் ஆண்டவரைக் குறிக்கும் ஒப்புமை இருக்கக்கூடும்; ஆனால் அதை வசனத்தின் உடனடிச் சொற்பொருளில் வெளிப்படையாகத் திணிக்காமல், ‘ஆண்டவர்’ என்பதை அடிக்குறிப்பில் பாதுகாக்கிறது.
- issue: δοῦλος குறிக்கும் சமூக நிலை
  choice: அடிமை
  alternative: பணியாளர்
  rationale: அதிகாரத்திற்குக் கீழ்ப்பட்ட கட்டுப்பட்ட நிலை உவமையின் ஓர் அங்கமாக இருப்பதால் வலுவான பொருள் தக்கவைக்கப்படுகிறது. பொதுவான தமிழ் வேதாகம நடையில் காணப்படும் மென்மையான மாற்று அடிக்குறிப்பில் வழங்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உண்மையுள்ள, விவேகமுள்ள’ என்ற இணைப்பு இரு பண்புகளையும் தனித்தனியாகத் தக்கவைக்கிறது. கேள்வி வடிவமும் உவமையின் சமூகச் சூழலும் மூலத்தின் இறையியல் பதற்றத்தை முன்கூட்டியே தீர்க்காமல் பாதுகாக்கப்பட்டுள்ளன.
