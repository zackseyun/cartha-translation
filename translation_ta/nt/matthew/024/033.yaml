source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ἴδητε ⸂πάντα ταῦτα⸃, γινώσκετε ὅτι ἐγγύς ἐστιν ἐπὶ θύραις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/033.yaml
  text: So also you[a], when you see all these things, know that it is near, at the doors.
translation:
  language: ta
  text: அவ்வாறே நீங்களும், இவை அனைத்தையும் காணும்போது, அருகில், வாசல்களிலேயே இருக்கிறது என்று அறிந்துகொள்ளுங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் அருகில், வாசல்களிலேயே இருக்கிறார்.” கிரேக்கத்தில் எழுவாய் வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: அவ்வாறே நீங்களும்
  rationale: முந்தைய அத்திமர உவமையோடு உள்ள ஒப்புமையையும், சீடர்களை வலியுறுத்தும் καὶ ὑμεῖς என்பதையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ὅταν ἴδητε
  choice: காணும்போது
  rationale: எதிர்காலத்தில் நிகழும் சூழலைக் குறிக்கும் ὅταν + aorist subjunctive அமைப்பை, மீண்டும் மீண்டும் நிகழ்வதாகத் தேவையின்றி காட்டாமல் இயல்பாகத் தருகிறது.
- source_word: πάντα ταῦτα
  choice: இவை அனைத்தையும்
  rationale: மூலத்தின் நடுநிலைப் பன்மையை வெளிப்படையாகக் காக்கிறது; ‘இந்த நிகழ்வுகள்’ என்று விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: γινώσκετε
  choice: அறிந்துகொள்ளுங்கள்
  rationale: பன்மை ஏவல் வினையின் கட்டளைத் தன்மையைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐγγύς
  choice: அருகில்
  rationale: இடம் அல்லது காலத்தின் நெருக்கத்தைக் குறிக்கக்கூடிய பொதுவான சொல்லாக இருந்து, மூலத்தின் விரிவைத் தக்கவைக்கிறது.
- source_word: ἐπὶ θύραις
  choice: வாசல்களருகே
  rationale: θύραις என்பதன் பன்மையைப் பாதுகாத்து, மிகுந்த நெருக்கத்தைக் காட்டும் உருவகத்தை இயல்பான தமிழில் வழங்குகிறது.
- source_word: ἐγγύς ἐστιν
  choice: அது அருகில் இருக்கிறது
  rationale: தமிழ் வாக்கியத்துக்கு இயல்பான நடுநிலைச் சுட்டுப்பெயரைப் பயன்படுத்துகிறது; ஆயினும் கிரேக்கத்தில் எழுவாய் வெளிப்படையாக இல்லை என்பதையும் மாற்று வாசிப்பையும் அடிக்குறிப்பு தெரிவிக்கிறது.
theological_decisions:
- issue: ἐγγύς ἐστιν என்பதன் மறைமுக எழுவாய்
  choice: ‘அது அருகில் இருக்கிறது’ என்று நடுநிலையாக மொழிபெயர்த்தல்
  alternative: ‘அவர் அருகில் இருக்கிறார்’
  rationale: கிரேக்கத்தில் எழுவாய் கூறப்படவில்லை. அது வரவிருக்கும் நிகழ்வு அல்லது நிறைவேற்றத்தைக் குறிக்கிறதா, மனிதகுமாரனைக் குறிக்கிறதா என்பது திறந்த நிலையில் இருப்பதால், முதன்மை உரை நடுநிலை வாசிப்பைப் பயன்படுத்தி மாற்று வாசிப்பை அடிக்குறிப்பில் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ். ‘வாசல்கள்’ என்ற பன்மை மூலத்தைப் பின்பற்றுகிறது; இடைக்கோடுகள் ἐγγύς மற்றும் ἐπὶ θύραις ஆகிய நெருக்கத்தை வலியுறுத்தும் இணையான கூறுகளை வாசிக்க எளிதாக்குகின்றன.
