  to: அந்த நாட்கள் குறைக்கப்படாமல் இருந்திருந்தால்[a], ஒருவரும்[b] காப்பாற்றப்பட்டிருக்க மாட்டார்; ஆனால், தேர்ந்தெடுக்கப்பட்டவர்களுக்காக அந்த நாட்கள் குறைக்கப்படும்.
