source:
  edition: SBLGNT
  text: καὶ εἰ μὴ ἐκολοβώθησαν αἱ ἡμέραι ἐκεῖναι, οὐκ ἂν ἐσώθη πᾶσα σάρξ· διὰ δὲ τοὺς ἐκλεκτοὺς κολοβωθήσονται αἱ ἡμέραι ἐκεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/022.yaml
  text: And if those days had not been cut short[a], no flesh would have been saved; but for the sake of the elect[b], those days will be cut short.
translation:
  language: ta
  text: அந்த நாட்கள் குறைக்கப்படாமல் இருந்திருந்தால்[a], ஒருவரும்[b] காப்பாற்றப்பட்டிருக்க மாட்டார்; ஆனால், தேர்ந்தெடுக்கப்பட்டவர்களுக்காக அந்த நாட்கள் குறைக்கப்படும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘குறைக்கப்படாமல் இருந்திருந்தால் … குறைக்கப்படும்’ என்பதற்குப் பதிலாக, ‘வெட்டிக் குறைக்கப்படாமல் இருந்திருந்தால் … வெட்டிக் குறைக்கப்படும்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் நாட்களின் கால அளவைக் குறைத்தல் அல்லது வெட்டிக் குறைத்தல் என்ற பொருளைத் தரலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் சொல்லுக்குச் சொல் ‘எல்லா மாம்சமும்’ என்று உள்ளது. இது மனிதகுலத்தைக் குறிக்கும் வேதாகம வழக்கு; இங்கு ‘ஒருவரும் இல்லை’ என்ற பொருளில் வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκολοβώθησαν / κολοβωθήσονται
  choice: குறைக்கப்படாதிருந்தால் / குறைக்கப்படும்
  rationale: கொλοβόω என்பது வெட்டிக் குறைத்தல் அல்லது கால அளவைக் குறைத்தல் என்பதைக் குறிக்கலாம். நாட்களைப் பற்றிய இச்சூழலில் ‘குறைக்கப்படுதல்’ இயல்பான நவீனத் தமிழாகவும், அவற்றின் கால அளவு சுருக்கப்படுவதையும் தெளிவாக உணர்த்துகிறது.
- source_word: οὐκ ἂν ἐσώθη
  choice: காப்பாற்றப்பட்டிருக்க மாட்டார்
  rationale: இந்த இறந்தகால எதிர்நிலை நிபந்தனை அமைப்பு நிகழ்ந்திருக்கக்கூடிய விளைவை மறுக்கிறது. σῴζω இச்சூழலில் உயிர் பாதுகாக்கப்படுவதைக் குறிப்பிட்டாலும், ‘காப்பாற்றப்படுதல்’ அதன் விரிவான பொருள் வாய்ப்பைச் சுருக்காமல் வைத்திருக்கிறது.
- source_word: πᾶσα σάρξ
  choice: மனிதர் எவரும்
  rationale: சொல்லுக்குச் சொல் ‘எல்லா மாம்சமும்’ என்ற எபிரேய-கிரேக்க வேதாகம வழக்கு இங்கு மனிதகுலத்தைக் குறிக்கிறது. மறுப்பு வாக்கியத்தில் ‘மனிதர் எவரும்’ என்பது அந்தப் பொருளை இயல்பான தமிழில் தருகிறது; இதனை ‘பாவ இயல்பு’ என்று உருவகமாகப் புரிந்துகொள்ளவில்லை.
- source_word: διὰ δὲ τοὺς ἐκλεκτούς
  choice: ஆனால் தெரிந்துகொள்ளப்பட்டவர்களுக்காக
  rationale: διά + வேற்றுமை உருபு இங்கு காரணம் அல்லது நன்மைக்கான நோக்கத்தைத் தெரிவிக்கிறது; ‘அவர்களுக்காக’ என்பது இதனை இயல்பாகக் காட்டுகிறது. ἐκλεκτοί என்பதற்கு விளக்கச் சேர்க்கையின்றி ‘தெரிந்துகொள்ளப்பட்டவர்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: αἱ ἡμέραι ἐκεῖναι
  choice: அந்த நாட்கள்
  rationale: சுட்டுப்பொருளை நேரடியாகவும் இயல்பாகவும் தக்கவைக்கும் மொழிபெயர்ப்பு.
- source_word: καὶ εἰ μὴ
  choice: …குறைக்கப்படாதிருந்தால்
  rationale: கிரேக்கத்தின் வெளிப்படையான நிபந்தனை அமைப்பைத் தமிழின் இயல்பான எதிர்மறை நிபந்தனை வடிவில் தக்கவைக்கிறது.
theological_decisions:
- issue: இறுதிக்கால உரையில் ἐκλεκτοί என்பவர்களின் அடையாளம்
  choice: தெரிந்துகொள்ளப்பட்டவர்கள் என்ற சொல்லை விளக்க விரிவாக்கமின்றித் தக்கவைத்தல்
  alternative: இறைவனால் தெரிந்துகொள்ளப்பட்ட மக்கள் / விசுவாசிகள் / உண்மையுள்ள மீதியானோர்
  rationale: இந்த வசனம் அந்தக் குழுவின் முழுத் தெய்வவியல் அடையாளத்தை வரையறுக்கவில்லை. ஆகவே இஸ்ரவேல், திருச்சபை அல்லது மீதியானோர் என்ற விவாதங்களில் ஒன்றை மொழிபெயர்ப்புக்குள் கொண்டு வராமல் மூலத்தின் திறந்த தன்மை காக்கப்படுகிறது.
- issue: இச்சூழலில் σῴζω என்பதன் பொருள்
  choice: காப்பாற்றப்பட்டிருக்க மாட்டார்
  alternative: உயிர் தப்பியிருக்க மாட்டார் / உயிரோடு வைக்கப்பட்டிருக்க மாட்டார்
  rationale: உடனடிச் சூழல் உடல் உயிர் பாதுகாக்கப்படுவதைக் காட்டினாலும், ‘உயிர் தப்புதல்’ என்று மட்டும் மொழிபெயர்ப்பது கிரேக்கச் சொல்லின் பொருளை அளவுக்கு மீறிச் சுருக்கும். ‘காப்பாற்றப்படுதல்’ உடனடிச் சூழலையும் சொல்லின் விரிவான ஒலிப்பையும் வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மனிதர் எவரும்’ என்பது சொல்லுக்குச் சொல்லான ‘எல்லா மாம்சமும்’ என்ற இயல்பற்ற தமிழைத் தவிர்த்து அதன் பொருளைக் காக்கிறது. ‘தெரிந்துகொள்ளப்பட்டவர்கள்’ என்பது குறிப்பிட்ட சமயப்பிரிவு விளக்கத்தைச் சேர்க்காமல் மூலச் சொல்லின் தெய்வவியல் திறந்த தன்மையைப் பாதுகாக்கிறது.
