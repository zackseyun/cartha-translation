  verdict: approve
  source_fidelity: ‘வயலில் இருப்பவர்’ substantival singular phrase accurately preserves the representative, gender-inclusive sense of ὁ ἐν τῷ ἀγρῷ. ‘தமது மேலங்கியை எடுத்துக்கொள்ளத் திரும்பிப் போக வேண்டாம்’ faithfully conveys the prohibition μὴ ἐπιστρεψάτω, the backward-return sense of ὀπίσω, and the purpose infinitive ἆραι. ‘மேலங்கி’ is an appropriate contextual rendering of ἱμάτιον.
  naturalness: The wording is clear, idiomatic modern standard Tamil and retains the urgent prohibitive force. The honorific-neutral participial form ‘இருப்பவர்’ and reflexive ‘தமது’ read naturally in this generic instruction.
  terminology: ‘மேலங்கி’ suitably communicates an outer garment/cloak in this context. The footnote responsibly supplies the broader alternatives ‘ஆடை’ and ‘வெளிப்புற ஆடை’ without overstating lexical precision.
