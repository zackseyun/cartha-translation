  text: καὶ ὁ ἐν τῷ ἀγρῷ μὴ ἐπιστρεψάτω ὀπίσω ἆραι ⸂τὸ ἱμάτιον⸃ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/018.yaml
  text: And let the one in the field not turn back to take his cloak[a].
translation:
  language: ta
  text: வயலில் இருப்பவர் தமது மேலங்கியை[a] எடுத்துக்கொள்ளத் திரும்பிப் போக வேண்டாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆடையை’ அல்லது ‘வெளிப்புற ஆடையை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐν τῷ ἀγρῷ
  choice: வயலில் இருப்பவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் இத்தொடர் வயலில் இருக்கும் ஒருவரைக் குறிக்கிறது. தமிழில் இயல்பாகவும் பாலினத்தைத் தேவையின்றிக் குறுக்காமலும் ஒருமை பிரதிநிதித்துவத் தன்மையைப் பேணுகிறது.
- source_word: μὴ ἐπιστρεψάτω ὀπίσω
  choice: திரும்பிப் போக வேண்டாம்
  rationale: μή உடன் வரும் இறந்தகாலக் கட்டளை வடிவம் தடையைத் தெரிவிக்கிறது; ὀπίσω உடன் சேர்ந்த ἐπιστρέφω, பின்புறம் என்ற நிலையான இடத்தைக் காட்டாமல் மீண்டும் திரும்பிச் செல்வதைக் குறிக்கிறது.
- source_word: ἆραι
  choice: எடுத்துக்கொள்ள
  rationale: இங்கு αἴρω என்பதன் வினையெச்சம் திரும்பிச் செல்வதன் நோக்கத்தைச் சுட்டுகிறது. ‘எடுத்துக்கொள்ள’ என்பது பொருளை மீட்டெடுக்கச் செல்வதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: τὸ ἱμάτιον αὐτοῦ
  choice: தமது மேலங்கியை
  rationale: ἱμάτιον பொதுவாக உடலின் மேல் அணியும் வெளிப்புற ஆடையைக் குறிக்கிறது. ‘மேலங்கி’ அந்தச் சூழலுக்கு ஏற்ற குறிப்பான சொல்லாகும்; αὐτοῦ-வின் உடைமைப் பொருளை ‘தமது’ தெளிவாக இணைக்கிறது.
theological_decisions:
- issue: பெயர்ச்சொல்லாக வரும் ஆண்பால் ஒருமையின் பாலினப் பிரதிநிதித்துவம்
  choice: வயலில் இருப்பவர்
  alternative: வயலில் இருக்கும் ஆண்
  rationale: கிரேக்க ஆண்பால் வடிவம் இச்சூழலில் பொதுவான பிரதிநிதித்துவப் பயன்பாடு உடையது. ஆகவே எச்சரிக்கையை ஆண்களுக்கு மட்டும் வரையறுக்காமல், ஒருமைத் தன்மையைப் பேணும் தமிழ்ச் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன தரத் தமிழில், அவசரமான தடை உணர்வைத் தெளிவாக வெளிப்படுத்தும் மரியாதை ஒருமை நடை பயன்படுத்தப்பட்டுள்ளது. ‘தமது’ என்பதால் பாலினத்தைச் சுட்டாமல் கர்த்தா–உடைமை உறவு இயல்பாக உள்ளது.
