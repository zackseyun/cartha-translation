revisions:
- from: அப்போது அவர்கள் உங்களை உபத்திரவத்திற்கு ஒப்புக்கொடுத்து, உங்களைக் கொன்றுபோடுவார்கள்; என் பெயரின் காரணமாக எல்லா தேசத்தாராலும் நீங்கள் வெறுக்கப்படுவீர்கள்.[a][b]
  to: அப்போது அவர்கள் உங்களை உபத்திரவத்திற்கு ஒப்புக்கொடுத்து, உங்களைக் கொல்வார்கள்; என் பெயரின் காரணமாக[b] எல்லா நாடுகளாலும் நீங்கள் வெறுக்கப்படுவீர்கள்.[a]
