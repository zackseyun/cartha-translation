id: MAT.24.9
reference: Matthew 24:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τότε παραδώσουσιν ὑμᾶς εἰς θλῖψιν καὶ ἀποκτενοῦσιν ὑμᾶς, καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων τῶν ἐθνῶν διὰ τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/009.yaml
  text: Then they will hand you over to affliction and kill you[c][b][a], and you will be hated by all the nations because of my name.
translation:
  language: ta
  text: அப்போது அவர்கள் உங்களை உபத்திரவத்திற்கு ஒப்புக்கொடுத்து, உங்களைக் கொல்வார்கள்; என் பெயரின் காரணமாக[b] எல்லா நாடுகளாலும் நீங்கள் வெறுக்கப்படுவீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உபத்திரவம்” என்பதற்கு “துன்பம்,” “ஒடுக்குதல்,” அல்லது “துன்புறுத்தல்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் நெருக்கடி, ஒடுக்குதல், கடும் துன்பம் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “என் பெயரின் காரணமாக” என்பது இயேசுவிடம் கொண்ட பற்றுறுதியினாலும் அவருடைய பெயர் பிரதிநிதித்துவப்படுத்துகிறவற்றினாலும் என்று பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: அப்போது
  rationale: இயேசுவின் உரையில் நிகழ்வுகளின் தொடர்ச்சியைக் குறிக்கும் இயல்பான காலச் சொல்.
- source_word: παραδώσουσιν ὑμᾶς
  choice: அவர்கள் உங்களை ... ஒப்புக்கொடுத்து
  rationale: மற்றொருவரின் அதிகாரத்திற்கோ பிடிக்கோ ஒப்படைப்பதைச் சுட்டுகிறது; ‘காட்டிக்கொடுப்பார்கள்’ என்பது துரோகத்தை அளவுக்கு மீறிக் குறிப்பாக்கும்.
- source_word: εἰς θλῖψιν
  choice: உபத்திரவத்திற்கு
  rationale: θλῖψις குறிக்கும் துன்பம், ஒடுக்குதல், நெருக்கடி ஆகிய பரப்பையும் இவ்விறுதிக்கால உரையின் கனத்தையும் தக்கவைக்கும் பரவலாகப் புரியக்கூடிய வேதாகமத் தமிழ் சொல்.
- source_word: ἀποκτενοῦσιν ὑμᾶς
  choice: உங்களைக் கொன்றுபோடுவார்கள்
  rationale: எதிர்காலச் செயலை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது; ‘கொலைசெய்வார்கள்’ என்பதில் உள்ள கூடுதல் சட்ட/அற நுணுக்கத்தைத் தவிர்க்கிறது.
- source_word: ἔσεσθε μισούμενοι
  choice: நீங்கள் வெறுக்கப்படுவீர்கள்
  rationale: எதிர்கால மறைசெய்வினை உணர்வை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ὑπὸ πάντων τῶν ἐθνῶν
  choice: எல்லா தேசத்தாராலும்
  rationale: உலகளாவிய எதிர்ப்பை வெளிப்படுத்துகிறது; இங்கு அவசியமில்லாத யூதர்–புறவினர் வேறுபாட்டைத் திணிக்கவில்லை.
- source_word: διὰ τὸ ὄνομά μου
  choice: என் பெயரின் காரணமாக
  rationale: διά + accusative காட்டும் காரணத்தைத் தெளிவாக வெளிப்படுத்தி, ‘பெயர்’ என்பதன் பிரதிநிதித்துவ நிறையைப் பராப்ரேஸ் செய்யாமல் காக்கிறது.
theological_decisions:
- issue: இறுதிக்கால உரையில் θλῖψις என்பதன் பொருள்
  choice: உபத்திரவம்
  alternative: துன்பம்; ஒடுக்குதல்; துன்புறுத்தல்
  rationale: சாதாரண துன்புறுத்தல்/நெருக்கடி மற்றும் இறுதிக்காலக் கனத்தன்மை ஆகிய இரண்டிற்கும் இடமளிக்கிறது; குறிப்பிட்ட இறுதிக்காலக் கோட்பாட்டைத் திணிக்கவில்லை.
- issue: ἔθνη என்பதன் பொருள்
  choice: தேசத்தார்
  alternative: புறவினத்தார்
  rationale: πάντων உடன் இங்கு உலகளாவிய பகைமையே இயல்பான பொருள்; இன அல்லது சமயப் பிரிவைத் தேவையின்றி குறுக்கவில்லை.
- issue: ‘என் பெயரின் காரணமாக’ என்ற சொற்றொடர்
  choice: உருவகத்தை மூலத்தின்படி தக்கவைத்தல்
  alternative: என்னைப் பின்பற்றுவதால்
  rationale: இயேசுவிடம் கொண்ட பற்றுறுதியை உணர்த்தினாலும், மூலத்தின் ‘பெயர்’ மொழியையும் அதன் வேதாகமத் தத்துவ நிறையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் கண்ணியமான, பொதுமக்கள் புரிந்துகொள்ளக்கூடிய நடை. ‘உபத்திரவம்’ என்ற வேதாகமப் பயன்பாடு சூழலின் கனத்தையும் பொருள் பரப்பையும் காக்கிறது; அதன் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளன. ‘தேசத்தார்’ என்பது ‘தேசங்கள்’ என்பதைக் காட்டிலும் செய்பவர்களைக் குறிக்கும் தமிழ் வாக்கியத்தில் இயல்பாக அமைகிறது.
