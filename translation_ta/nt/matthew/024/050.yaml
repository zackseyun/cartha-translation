  text: ἥξει ὁ κύριος τοῦ δούλου ἐκείνου ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ καὶ ἐν ὥρᾳ ᾗ οὐ γινώσκει,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/050.yaml
  text: the master of that servant will come on a day he does not expect and at an hour he does not know[b][a],
translation:
  language: ta
  text: அந்த அடிமையின்[a] எஜமான்[b], அவன் எதிர்பாராத ஒரு நாளில், அவன் அறியாத ஒரு நேரத்தில் வருவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பணியாள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் கட்டுப்பட்ட பணியுறவில் இருந்த ஒருவரைக் குறிக்கிறது; இங்கு எஜமான்–அடிமை உறவு தெளிவாக இருப்பதால் ‘அடிமை’ என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘தலைவர்’ என்றும் பொருள்படலாம். இங்கு கிரேக்கச் சொல் உவமையிலுள்ள மனித எஜமானைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥξει
  choice: வருவார்
  rationale: ἥκω என்பதன் எதிர்கால வடிவம் வருதல் அல்லது வந்துசேர்தலைக் குறிக்கிறது. இங்கு எஜமானின் எதிர்பாராத வருகையை இயல்பாகக் கூற ‘வருவார்’ பொருத்தமானது.
- source_word: κύριος
  choice: எஜமான்
  rationale: உவமையின் வீட்டுச் சூழலில் இது அடிமையின் மனிதத் தலைவரைக் குறிக்கிறது. ‘எஜமான்’ அந்த உறவைத் தெளிவாகக் காட்டுகிறது; ‘ஆண்டவர்’ என மொழிபெயர்த்தால் நேரடியான இறைப்பட்டமாகத் தவறாகப் புரிந்துகொள்ளப்படலாம்.
- source_word: δούλου
  choice: அடிமை
  rationale: δοῦλος கட்டுப்பட்ட பணியுறவில் இருப்பவரைக் குறிக்கிறது. எஜமான்–அடிமை உறவு இச்சூழலில் வெளிப்படையாக இருப்பதால் ‘அடிமை’ மூலத்தின் சமூக வலிமையைப் பாதுகாக்கிறது.
- source_word: ἐκείνου
  choice: அந்த
  rationale: முன்னர் குறிப்பிடப்பட்ட குறிப்பிட்ட அடிமையைச் சுட்டுகிறது; தமிழில் ‘அந்த’ இயல்பாகவும் போதுமான தெளிவுடனும் உள்ளது.
- source_word: ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ
  choice: அவன் எதிர்பாராத ஒரு நாளிலும்
  rationale: குறிப்பிடப்படாத நாளையும் அடிமையின் எதிர்பார்ப்பின்மையையும் காக்கிறது. ‘ஒரு நாள்’ என்பது கிரேக்கத்தின் காலவரையறையற்ற தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν ὥρᾳ ᾗ οὐ γινώσκει
  choice: அவன் அறியாத ஒரு நேரத்திலும்
  rationale: ‘நாள்—நேரம்’ என்ற இணை அமைப்பையும், அந்த நேரத்தை அடிமை அறியாதிருப்பதையும் தெளிவாகப் பாதுகாக்கிறது. ὥρα என்பதற்கு இங்கு கடிகார மணியை விட பொதுவான ‘நேரம்’ இயல்பானது.
theological_decisions:
- issue: உவமையின் வீட்டுச் சூழலில் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: எஜமான்
  alternative: ஆண்டவன் / தலைவர்
  rationale: உடனடிச் சூழலில் இது அடிமையின் மனித எஜமானைக் குறிக்கிறது. உவமைக்கு விரிவான இறுதிக்காலப் பொருள் இருந்தாலும், இச்சொல்லை நேரடியாகத் தெய்வீகப் பட்டமாக மாற்றாமல் கதைச் சூழலின் சமூக உறவைப் பாதுகாக்க வேண்டும்.
- issue: δοῦλος என்பதன் சமூக நிலை
  choice: அடிமை
  alternative: பணியாள் / ஊழியன்
  rationale: இங்கு எஜமானின் அதிகாரத்துக்குக் கட்டுப்பட்ட அடிமை நிலை சூழலுக்கு முக்கியமானது. ‘பணியாள்’ அல்லது ‘ஊழியன்’ அந்தக் கட்டுப்பட்ட நிலையை மென்மையாக்கக்கூடும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘நாள்—நேரம்’ என்ற மூல இணை அமைப்பு பாதுகாக்கப்பட்டுள்ளது. மனித எஜமானுக்கான மரியாதை ஒருமையை இயல்பாக வெளிப்படுத்த ‘வருவார்’ பயன்படுத்தப்பட்டுள்ளது.
