base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/004.yaml
  text: And Jesus answered them[a], “See that no one leads you astray.”
translation:
  language: ta
  text: 'இயேசு அவர்களுக்குப் பதிலளித்தார்: “யாரும் உங்களை வழிதவறச் செய்யாதபடி பார்த்துக்கொள்ளுங்கள்[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “யாரும் உங்களை ஏமாற்றாதபடி பார்த்துக்கொள்ளுங்கள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν αὐτοῖς
  choice: அவர்களுக்குப் பதிலளித்தார்
  rationale: இது பதிலாகப் பேசுவதைக் குறிக்கும் வழக்கமான கிரேக்கச் சொற்றொடர். ‘பதிலளித்து அவர்களிடம் கூறினார்’ என்ற சொற்திருப்பைத் தவிர்த்து, அதன் பதிலுரைக்கும் தன்மையையும் பேச்சுச் செயலையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: Βλέπετε
  choice: பார்த்துக்கொள்ளுங்கள்
  rationale: இங்குள்ள நிகழ்காலக் கட்டளை விழிப்புடன் கவனமாக இருப்பதையும், அடுத்து வரும் நிகழ்வு ஏற்படாதபடி எச்சரிக்கையுடன் செயல்படுவதையும் குறிக்கிறது. ‘பார்த்துக்கொள்ளுங்கள்’ என்பது மூலத்தின் பார்வை உருவகத்தைத் தக்கவைத்து, μή-வாக்கியத்துடன் இயல்பாக இணைகிறது.
- source_word: μή τις
  choice: யாரும் ... செய்யாதபடி
  rationale: கட்டளைக்குப் பின் μή மற்றும் துணைவினை வடிவம் ஒரு நிகழ்வைத் தடுக்கும் பொருளைத் தருகிறது. இந்தத் தமிழாக்கம் ‘எவரும் அப்படிச் செய்யாதவாறு கவனியுங்கள்’ என்ற வலியுறுத்தலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: πλανήσῃ
  choice: வழிதவறச் செய்யாதபடி
  rationale: πλανάω என்பது ஏமாற்றுதல், தவறாக வழிநடத்துதல், சரியான பாதையிலிருந்து விலகச் செய்தல் ஆகிய பொருட்களைக் கொண்டது. ‘வழிதவறச் செய்தல்’ அதன் ஏமாற்றும் அம்சத்தையும் சரியான வழியிலிருந்து விலக்கும் அம்சத்தையும் ஒருங்கே தக்கவைக்கிறது.
theological_decisions:
- issue: πλανήσῃ குறிக்கும் எச்சரிக்கையின் இயல்பு
  choice: பொதுவாக ஏமாற்றப்பட்டு வழிதவறுவதற்கு எதிரான எச்சரிக்கையாக ‘வழிதவறச் செய்யாதபடி’ என்று மொழிபெயர்த்தல்
  alternative: அறிவுசார் ஏமாற்றத்தை மட்டும் முன்னிறுத்தி ‘ஏமாற்றாதபடி’ என்று மொழிபெயர்த்தல்
  rationale: இறுதிக்காலக் கூற்றுகளின் சூழலில், தவறான நம்பிக்கையை ஏற்றுக்கொள்வது மட்டுமல்லாமல் தவறான வழியில் இழுக்கப்படுவதையும் இந்த எச்சரிக்கை உள்ளடக்கலாம். தேர்ந்த சொற்றொடர் இந்த விரிவையும் இறையியல் பதற்றத்தையும் குறுக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பானதும் மதிப்புமிக்கதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பார்த்துக்கொள்ளுங்கள்’ என்பது உரையாடல் வழக்கில் இருந்தாலும் இங்கு எச்சரிக்கை கட்டளையாகத் தெளிவும் கண்ணியமும் கொண்டுள்ளது.
