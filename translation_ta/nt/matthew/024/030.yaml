  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ τότε φανήσεται τὸ σημεῖον τοῦ υἱοῦ τοῦ ἀνθρώπου ἐν ⸀τῷ οὐρανῷ, καὶ τότε κόψονται πᾶσαι αἱ φυλαὶ τῆς γῆς καὶ ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ μετὰ δυνάμεως καὶ δόξης πολλῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/030.yaml
  text: And then the sign of the Son of Man will appear in heaven[a], and then all the tribes of the earth will mourn[c][b], and they will see the Son of Man coming on the clouds of heaven with power and great glory.
translation:
  language: ta
  text: அப்போது மனிதகுமாரனுடைய அடையாளம் வானத்தில்[a] தோன்றும். அப்போது பூமியிலுள்ள எல்லாக் கோத்திரத்தாரும் புலம்புவார்கள்[b]; மனிதகுமாரன் வல்லமையோடும் மிகுந்த மகிமையோடும் வானத்தின் மேகங்கள்மேல் வருவதை அவர்கள் காண்பார்கள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விண்ணுலகில்.” கிரேக்கச் சொல் சூழலுக்கேற்ப வானத்தையோ விண்ணுலகையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நாட்டிலுள்ள எல்லாக் கோத்திரத்தாரும்.” கிரேக்கச் சொல் பூமியையோ ஒரு நாட்டையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: c
    text: “வானத்தின் மேகங்கள்மேல் வருவது” என்பது தானியேல் 7:13-ஐ எதிரொலிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: φανήσεται
  choice: தோன்றும்
  rationale: இங்கு வினைச்சொல் செயலற்ற வடிவில் இருந்தாலும், தானாகக் காட்சியளித்தல் என்ற பொருளில் வருகிறது; நவீன தமிழில் ‘தோன்றும்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: τὸ σημεῖον τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: மனிதகுமாரனுடைய அடையாளம்
  rationale: ‘அடையாளம்’ என்பது σημεῖον என்பதற்கான நேரடியான, வெளிப்படையான சொல். உடைமைத் தொடர்பைக் காட்டும் இந்தத் தமிழ் அமைப்பு, அது மனிதகுமாரனுடன் தொடர்புடைய அடையாளமா அல்லது அவரே அடையாளமா என்ற கிரேக்கத் தொடரின் சாத்தியமான பொருள் மயக்கத்தைத் தீர்த்துவிடாமல் விடுகிறது.
- source_word: ἐν τῷ οὐρανῷ
  choice: வானத்தில்
  rationale: οὐρανός என்பது சூழலுக்கேற்ப ‘வானம்’ அல்லது ‘விண்ணுலகம்’ எனப் பொருள்படலாம். இங்கு ‘வானம்’ காட்சிக்குரிய இடத்தையும் பேரண்டச் சூழலையும் இயல்பாகக் காட்டுகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: κόψονται
  choice: புலம்புவார்கள்
  rationale: இந்த இடைநிலைப் பயன்பாட்டில் κόπτω துக்கத்தால் புலம்புவதைக் குறிக்கிறது. ‘புலம்புவார்கள்’ என்பது குறிப்பிட்ட உடல் அசைவைச் சேர்க்காமல் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: பூமியிலுள்ள எல்லாக் கோத்திரத்தாரும்
  rationale: φυλή என்பதன் நேரடியான பொருளை ‘கோத்திரம்’ காக்கிறது; γῆ இங்குள்ள பேரண்ட மற்றும் முடிவுக்காலச் சூழலில் ‘பூமி’ என வழங்கப்பட்டுள்ளது. ‘நாடு’ என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ὄψονται
  choice: அவர்கள் காண்பார்கள்
  rationale: ὁράω என்பதன் எளிய எதிர்கால வடிவை நவீன தமிழில் இயல்பாக வழங்குகிறது.
- source_word: ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: வானத்தின் மேகங்கள்மேல் வருவதை
  rationale: ‘மேகங்கள்மேல் வருதல்’ கிரேக்கத்தின் இடவியல் உருவகத்தையும் தானியேல் 7:13-இன் எதிரொலியையும் காக்கிறது.
- source_word: μετὰ δυνάμεως καὶ δόξης πολλῆς
  choice: வல்லமையோடும் மிகுந்த மகிமையோடும்
  rationale: πολλῆς என்பது நேரடியாக ‘மகிமை’ என்பதைக் குறிப்பதால், ‘மிகுந்த மகிமை’ என்று அமைத்து கிரேக்கச் சொல்லமைப்பின் வலியுறுத்தலைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘மனிதகுமாரனுடைய அடையாளம்’ என்பதன் பொருள்
  choice: உடைமைத் தொடர்பைத் தீர்மானிக்காமல் ‘மனிதகுமாரனுடைய அடையாளம்’ என்று வழங்கப்பட்டது.
  alternative: ‘மனிதகுமாரனுக்குரிய அடையாளம்’ அல்லது ‘அடையாளமாகிய மனிதகுமாரன்’
  rationale: கிரேக்க உரை, அது அவருடன் தொடர்புடைய அடையாளமா அல்லது அவரே அந்த அடையாளமா என்பதைத் திட்டவட்டமாக நிர்ணயிக்கவில்லை. ஆகவே முடிவுக்கால விளக்க வேறுபாட்டை மொழிபெயர்ப்பு தீர்த்துவிடவில்லை.
- issue: γῆ என்பதன் பரப்பு
  choice: முதன்மை உரையில் ‘பூமி’
  alternative: ‘நாடு’ அல்லது ‘தேசம்’
  rationale: உடனடி பேரண்ட மற்றும் முடிவுக்காலச் சூழல் உலகளாவிய பொருளுக்கு ஆதரவளிக்கிறது; இருப்பினும் இஸ்ரவேல் நாட்டை மையப்படுத்தும் தீர்க்கதரிசன எதிரொலி சாத்தியமாதலால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified வேதாகம நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘மனிதகுமாரன்,’ ‘கோத்திரம்,’ ‘வல்லமை,’ ‘மகிமை’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டன; தேவையற்ற பழந்தமிழ் மற்றும் குறிப்பிட்ட சமயப்பிரிவு சார்ந்த விளக்கங்கள் தவிர்க்கப்பட்டன.
