  text: οὐαὶ δὲ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/019.yaml
  text: But woe to those who are pregnant and to those who are nursing infants in those days[a].
translation:
  language: ta
  text: ஆனால், அந்த நாட்களில் கர்ப்பிணிப் பெண்களுக்கும் குழந்தைகளுக்குப் பாலூட்டும் பெண்களுக்கும் ஐயோ![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அந்த நாட்களில் கர்ப்பமாக இருப்பவர்களுக்கும் குழந்தைகளுக்குப் பாலூட்டுகிறவர்களுக்கும் ஐயோ!’
    reason: பெண்பால் குறிப்பை வெளிப்படையான பெயர்ச்சொல்லின்றி வழங்கும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: οὐαί
  choice: ஐயோ!
  rationale: வரவிருக்கும் கடும் துயரைக் குறிக்கும் தீர்க்கதரிசன எச்சரிக்கை மற்றும் புலம்பல் தொனியைத் தமிழில் இயல்பாகவும் வலிமையாகவும் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய எச்சரிக்கையிலிருந்து இக்குறிப்புக்கு மெல்லிய மாறுதலைக் காட்டுகிறது; மிகையான எதிர்மறை முரண்பாட்டை உருவாக்காமல் உரையோட்டத்துக்கு ஏற்றதாக உள்ளது.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: கர்ப்பமாக இருப்பவர்களுக்கும்
  rationale: ἐν γαστρὶ ἔχω என்ற கிரேக்க மரபுத்தொடரின் பொருள் ‘கர்ப்பமாக இருத்தல்’; சொற்சொல்லாக ‘வயிற்றில் கொண்டிருத்தல்’ என்று மொழிபெயர்ப்பதைவிட இது தெளிவான நவீனத் தமிழ்.
- source_word: ταῖς θηλαζούσαις
  choice: குழந்தைகளுக்குப் பாலூட்டுகிறவர்களுக்கும்
  rationale: θηλάζω என்பது குழந்தைக்குப் பால் கொடுத்தல் அல்லது பாலூட்டுதலைக் குறிக்கிறது. கிரேக்கத்தில் மறைமுகமாக உள்ள செயப்படுபொருளைத் தமிழில் ‘குழந்தைகளுக்கு’ என வெளிப்படுத்துவது கருத்தை இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: அந்த நாட்களில்
  rationale: காலத்தைக் குறிக்கும் கிரேக்கத் தொடரை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
theological_decisions:
- issue: பெண்பால் வேற்றுமை வடிவங்களும் வினையெச்சங்களும் குறிக்கும் நபர்கள்
  choice: ‘கர்ப்பமாக இருப்பவர்கள்’, ‘குழந்தைகளுக்குப் பாலூட்டுகிறவர்கள்’ என்று பெயர்ச்சொல்லைச் சேர்க்காமல் மொழிபெயர்த்தல்
  alternative: ‘கர்ப்பிணிப் பெண்கள்’, ‘குழந்தைகளுக்குப் பாலூட்டும் பெண்கள்’
  rationale: கிரேக்கப் பெண்பால் வடிவங்கள் பெண்களையே தெளிவாகக் குறிக்கின்றன. இருப்பினும், மூலத்தில் இல்லாத ‘பெண்கள்’ என்ற பெயர்ச்சொல்லை முதன்மை உரையில் சேர்க்காமல் தமிழில் இயல்பாகச் சொல்ல முடிகிறது. இவ்வாறு செய்வது துன்பக் காலத்தில் அவர்களுடைய பாதிப்புக்குரிய நிலையையே முன்னிறுத்துகிறது; பாலினக் குறிப்பும் பொருளில் தெளிவாகவே உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘ஐயோ!’ என்பது சாதாரண வியப்பாக அல்லாமல், வரவிருக்கும் துயரைக் குறிக்கும் எச்சரிக்கைப் புலம்பலாகப் பயன்படுத்தப்பட்டுள்ளது.
