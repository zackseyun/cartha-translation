base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/040.yaml
  text: Then two men will be in the field; one is taken and one is left.
translation:
  language: ta
  text: அப்போது இரண்டு ஆண்கள் வயலில் இருப்பார்கள்; ஒருவர் எடுத்துக்கொள்ளப்படுவார்[a], மற்றவர் விடப்படுவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அழைத்துச் செல்லப்படுவார்.’ இந்த வினைச்சொல் மட்டும், இவ்வாறு எடுத்துக்கொள்ளப்படுவது மீட்புக்காகவா தீர்ப்புக்காகவா என்பதைத் தெளிவுபடுத்தவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: முந்தைய இறுதிக்காலச் சூழலுடன் இவ்வாக்கியத்தை இணைக்கும் காலக் குறிப்பை இயல்பான தமிழில் தருகிறது.
- source_word: δύο ἔσονται
  choice: இரண்டு ஆண்கள் ... இருப்பார்கள்
  rationale: δύο என்பது ‘இரண்டு’ என மட்டுமே இருந்தாலும், தொடர்ந்து வரும் εἷς ... εἷς ஆகியவை ஆண்பால் வடிவங்கள்; அடுத்த வசனத்தின் பெண்கள் பற்றிய இணைக் காட்சியையும் கருத்தில் கொண்டு, இங்கு ஆண்கள் எனத் தெளிவுபடுத்தப்பட்டது.
- source_word: ἐν τῷ ἀγρῷ
  choice: வயலில்
  rationale: இடத்தைக் குறிக்கும் சொற்றொடரின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: εἷς ... εἷς
  choice: ஒருவர் ... மற்றவர்
  rationale: கிரேக்கத்தில் உள்ள சுருக்கமான இருவருக்கிடையேயான வேறுபாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: παραλαμβάνεται
  choice: எடுத்துக்கொள்ளப்படுவார்
  rationale: எதிர்காலச் சூழலில் வரும் நிகழ்காலச் செயப்பாட்டு வடிவம். மீட்புக்காகவா தீர்ப்புக்காகவா எடுத்துக்கொள்ளப்படுகிறார் என்பதைத் தீர்மானிக்காமல் வினையின் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: ἀφίεται
  choice: விட்டுவிடப்படுவார்
  rationale: இச்சூழலில் ‘விடப்படுகிறார்’ என்ற கருத்தை அளிக்கிறது; ‘கைவிடப்படுவார்’ என்பது தேவைக்கு அதிகமான எதிர்மறைப் பொருளைச் சேர்க்கும்.
theological_decisions:
- issue: παραλαμβάνεται என்பது மீட்பையா தீர்ப்பையா குறிக்கிறது
  choice: முதன்மை உரையில் நடுநிலையான ‘எடுத்துக்கொள்ளப்படுவார்’ பயன்படுத்தப்பட்டது.
  alternative: ‘தீர்ப்புக்காகக் கொண்டுபோகப்படுவார்’ அல்லது ‘பாதுகாப்பாக அழைத்துக்கொள்ளப்படுவார்’
  rationale: நோவாவின் நாட்களைப் பற்றிய முந்தைய ஒப்பீட்டின் வெளிச்சத்திலும் இருவகை விளக்கங்களுக்கு இடமுள்ளது. எந்த ஓர் இறுதிக்காலக் கோட்பாட்டையும் மொழிபெயர்ப்பில் திணிக்காமல் மூலத்தின் இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
- issue: குறிப்பிடப்படுபவர்கள் ஆண்கள் என்பதை வெளிப்படையாக்க வேண்டுமா
  choice: ‘இரண்டு ஆண்கள்’ என வழங்கப்பட்டது.
  alternative: பாலினத்தைக் குறிப்பிடாமல் ‘இருவர்’
  rationale: εἷς ... εἷς ஆகிய ஆண்பால் வடிவங்களும், அடுத்த வசனத்தில் பெண்களைப் பற்றிய இணைக் காட்சியும் இங்கு ஆண்களை வெளிப்படையாகக் குறிப்பிடுவதை ஆதரிக்கின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘எடுத்துக்கொள்ளப்படுவார்’ மற்றும் ‘விட்டுவிடப்படுவார்’ என்ற இணையான செயப்பாட்டு வடிவங்கள் மூலத்தின் எதிரெதிர் அமைப்பைப் பாதுகாக்கின்றன.
