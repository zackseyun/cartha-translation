revisions:
- from: அப்போது இரண்டு ஆண்கள் வயலில் இருப்பார்கள்; ஒருவர் எடுத்துக்கொள்ளப்படுவார்[a], மற்றவர் விட்டுவிடப்படுவார்.
  to: அப்போது இரண்டு ஆண்கள் வயலில் இருப்பார்கள்; ஒருவர் எடுத்துக்கொள்ளப்படுவார்[a], மற்றவர் விடப்படுவார்.
