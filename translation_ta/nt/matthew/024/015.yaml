  text: Ὅταν οὖν ἴδητε τὸ βδέλυγμα τῆς ἐρημώσεως τὸ ῥηθὲν διὰ Δανιὴλ τοῦ προφήτου ⸀ἑστὸς ἐν τόπῳ ἁγίῳ, ὁ ἀναγινώσκων νοείτω,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/015.yaml
  text: So when you see the abomination of desolation spoken of through Daniel the prophet standing in a holy place—let the reader understand—[a][b]
translation:
  language: ta
  text: ஆகவே, இறைவாக்கினரான தானியேல் மூலமாகச் சொல்லப்பட்ட “பாழாக்குதலின் அருவருப்பு” புனிதமான ஓர் இடத்தில் நிற்பதை நீங்கள் காணும்போது—வாசிப்பவர் புரிந்துகொள்ளட்டும்—[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, மரபாக, “புனித இடத்தில்.” இது குறிப்பிட்ட ஆலயப் புனித இடத்தைக் குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “பாழாக்கும் அருவருப்பு” அல்லது “பாழாக்குதலை உண்டாக்கும் அருவருப்பு”; இது தானியேல் நூலின் சொற்றொடரை எதிரொலிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: ஆகவே ... காணும்போது
  rationale: οὖν முந்தைய உரையுடன் உள்ள முடிவு/தொடர்பைக் காட்டுவதால் “ஆகவே” என்றும், ὅταν எதிர்கால நிகழ்வைச் சுட்டும் காலவாக்கியத்தை அறிமுகப்படுத்துவதால் “காணும்போது” என்றும் மொழிபெயர்க்கப்பட்டது.
- source_word: ἴδητε
  choice: நீங்கள் காணும்போது
  rationale: ὁράω என்பதன் நேரடியான பொருளான “காணுதல்” என்பதையும், இரண்டாம் நபர் பன்மையையும் தெளிவாகக் காக்கிறது.
- source_word: τὸ βδέλυγμα τῆς ἐρημώσεως
  choice: பாழாக்குதலின் அருவருப்பு
  rationale: தானியேல் நூலுடனான சொல்லிணைப்பையும் கிரேக்க மரபுத்தொடரின் உருபுத்தொடர் அமைப்பையும் காக்கிறது; அது பாழாக்கும் அருவருப்பா அல்லது பாழாக்குதலுடன் தொடர்புடைய அருவருப்பா என்பதை முதன்மை உரை தீர்மானிக்கவில்லை.
- source_word: τὸ ῥηθὲν
  choice: சொல்லப்பட்ட
  rationale: இறைவாக்கில் முன்பே உரைக்கப்பட்டதை இயல்பான தமிழில் சுருக்கமாகக் குறிக்கிறது.
- source_word: διὰ Δανιὴλ τοῦ προφήτου
  choice: இறைவாக்கினரான தானியேல் மூலமாக
  rationale: διά + உருபின் வழியாகச் சொல்லப்பட்ட கருவி/முகவர் நுணுக்கத்தை “மூலமாக” காக்கிறது; προφήτης என்பதற்கு நவீன, கண்ணியமான “இறைவாக்கினர்” பயன்படுத்தப்பட்டது.
- source_word: ἑστὸς
  choice: நிற்பதை
  rationale: ἵστημι என்பதன் நிற்றல் பொருளை நேரடியாகத் தருகிறது; அது எவ்வாறு அங்கு நிறுவப்படுகிறது என்பதை ஊகித்துச் சேர்க்கவில்லை.
- source_word: ἐν τόπῳ ἁγίῳ
  choice: புனிதமான ஓர் இடத்தில்
  rationale: கிரேக்கத்தில் குறிப்புச் சுட்டு இல்லாததை “ஓர் இடத்தில்” பிரதிபலிக்கிறது; ஆலயத்தை மட்டும் கட்டாயமாகக் குறிப்பதாக உரையைச் சுருக்கவில்லை.
- source_word: ὁ ἀναγινώσκων νοείτω
  choice: வாசிப்பவர் புரிந்துகொள்ளட்டும்
  rationale: மூலத்தின் இடைச்செருகலான அறிவுறுத்தலையும் கட்டளை வலிமையையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: τόπῳ ἁγίῳ என்பது குறிப்பிட்ட ஆலயப் புனித இடத்தையா அல்லது பொதுவாக ஒரு புனித இடத்தையா குறிக்கிறது
  choice: புனிதமான ஓர் இடத்தில்
  alternative: புனித இடத்தில்
  rationale: இது ஆலயத்தை நினைவூட்டக்கூடும்; எனினும் கிரேக்கச் சொற்றொடரில் குறிப்புச் சுட்டு இல்லாததால் முதன்மை உரை அதைத் திட்டவட்டமாக ஆலயத்தின் குறிப்பிட்ட பகுதி என்று முடிவுசெய்யவில்லை. மரபான, குறிப்பிட்ட இடத்தைக் குறிக்கக்கூடிய வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: βδέλυγμα τῆς ἐρημώσεως என்ற தானியேல் நூல் சார்ந்த சொற்றொடரின் உறவு
  choice: பாழாக்குதலின் அருவருப்பு
  alternative: பாழாக்கும் அருவருப்பு / பாழாக்குதலை உண்டாக்கும் அருவருப்பு
  rationale: முதன்மை வடிவம் கிரேக்க உருபுத்தொடரின் உண்மையான பொருள் இடைவெளியையும் தானியேல் நூலுடனான எதிரொலியையும் காக்கிறது; காரணப் பொருளைத் தெளிவாக்கும் வாசிப்புகள் அடிக்குறிப்பில் வழங்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. “பரிசுத்த ஸ்தலம்” போன்ற பழைய வழக்கிற்குப் பதிலாக “புனிதமான ஓர் இடம்” பயன்படுத்தப்பட்டாலும், மூலத்தின் தெளிவின்மை அடிக்குறிப்புகளுடன் காக்கப்பட்டுள்ளது.
