  to: ஏனெனில் அப்போது உலகத்தின் தொடக்கமுதல் இன்றுவரை ஏற்பட்டிராததும், இனி ஒருபோதும் ஏற்படாததுமான பெரும் உபத்திரவம்[a] உண்டாகும்.
