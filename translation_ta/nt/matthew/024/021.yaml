id: MAT.24.21
reference: Matthew 24:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἔσται γὰρ τότε θλῖψις μεγάλη οἵα οὐ γέγονεν ἀπ’ ἀρχῆς κόσμου ἕως τοῦ νῦν οὐδ’ οὐ μὴ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/021.yaml
  text: For then there will be great tribulation[a], such as has not happened from the beginning of the world until now, and never will happen again.
translation:
  language: ta
  text: ஏனெனில் அப்போது உலகத்தின் தொடக்கமுதல் இன்றுவரை ஏற்பட்டிராததும், இனி ஒருபோதும் ஏற்படாததுமான பெரும் உபத்திரவம்[a] உண்டாகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெரும் நெருக்கடி” அல்லது “பெரும் துன்பம்.” கிரேக்கச் சொல் கடுமையான துயரம், அழுத்தம் அல்லது ஒடுக்குதலைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ τότε
  choice: ஏனெனில், அப்போது
  rationale: γάρ-இன் விளக்கத் தொடர்பையும் τότε-இன் காலக் குறிப்பையும் இயல்பான நவீனத் தமிழில் பாதுகாக்கிறது.
- source_word: θλῖψις μεγάλη
  choice: பெரும் உபத்திரவம்
  rationale: θλῖψις குறிக்கும் கடுமையான நெருக்கடி, துன்பம், ஒடுக்குதல் ஆகிய பொருள் பரப்பையும் இச்சூழலின் கனத்தையும் ‘உபத்திரவம்’ தக்கவைக்கிறது; μεγάλη-வை ‘பெரும்’ நேரடியாக எடுத்துரைக்கிறது.
- source_word: οἵα
  choice: …அத்தகையது என்பதைக் காட்டும் ‘-துமான’ அமைப்பு
  rationale: முன்னெப்போதும் இல்லாத அளவிலான தன்மையை ஒப்பிடும் கிரேக்கச் சொல்லின் வலிமையைத் தமிழில் இயல்பான தொடர்பெயரெச்ச அமைப்பால் வெளிப்படுத்துகிறது.
- source_word: οὐ γέγονεν
  choice: ஏற்பட்டிராததும்
  rationale: γίνομαι வினையின் நிகழ்வு சார்ந்த பொருளையும், இறந்த காலத்திலிருந்து இன்றுவரையிலான perfect வலிமையையும் வெளிப்படுத்துகிறது.
- source_word: ἀπ’ ἀρχῆς κόσμου
  choice: உலகம் தோன்றியதுமுதல்
  rationale: κόσμος என்பதைக் ‘உலகம்’ என வைத்துக்கொண்டு, காலத் தொடக்கத்தைக் குறிக்கும் சொற்றொடரை இயல்பான தமிழில் தருகிறது; கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘படைப்பு’ என்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: ἕως τοῦ νῦν
  choice: இன்றுவரை
  rationale: இப்போதைய காலப்புள்ளிவரை என்பதைக் குறுகிய, இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: οὐδ’ οὐ μὴ γένηται
  choice: இனி ஒருபோதும் ஏற்படாததுமான
  rationale: οὐ μή தரும் வலியுறுத்தப்பட்ட எதிர்கால மறுப்பை ‘இனி ஒருபோதும்’ தெளிவாகக் காட்டுகிறது; முன்னர் விவரிக்கப்பட்ட நிகழ்வுடன் ஒப்பிடும் தொடர்ச்சியையும் காக்கிறது.
- source_word: ἔσται
  choice: உண்டாகும்
  rationale: θλῖψις நிகழவிருப்பதைத் தமிழில் இயல்பான இருப்பு/நிகழ்வு வினையால் தெரிவிக்கிறது.
theological_decisions:
- issue: முடிவுக்காலச் சூழலில் θλῖψις என்பதன் மொழிபெயர்ப்பு
  choice: உபத்திரவம்
  alternative: பெரும் நெருக்கடி / பெரும் துன்பம்
  rationale: ‘உபத்திரவம்’ இச்சொல்லின் கடுமையையும் வேதாகமப் பயன்பாட்டில் உள்ள கனத்தையும் தக்கவைக்கிறது; அதேவேளையில் குறிப்பிட்ட ஒரு முடிவுக்காலக் கோட்பாட்டை மொழிபெயர்ப்புக்குள் சேர்ப்பதில்லை. பொதுவான பொருள் மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்குப் புரியும் வகையில் அமைக்கப்பட்டுள்ளது. ‘உபத்திரவம்’ என்ற கனமான வேதாகமச் சொல் தக்கவைக்கப்பட்டாலும், அதன் இயல்பான மாற்றுப் பொருள்கள் அடிக்குறிப்பில் விளக்கப்படுகின்றன.
