id: MAT.24.5
reference: Matthew 24:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου λέγοντες· Ἐγώ εἰμι ὁ χριστός, καὶ πολλοὺς πλανήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/005.yaml
  text: For many will come in my name[a], saying, ‘I am the Messiah,’ and they will lead many astray.
translation:
  language: ta
  text: ஏனெனில், பலர் என் பெயரில் வந்து, ‘நானே மேசியா[a]’ என்று சொல்லி, பலரை வழிதவறச் செய்வார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நானே கிறிஸ்து.’ கிரேக்க மொழியில் உள்ள பட்டம் ὁ χριστός.
    reason: Χριστός என்ற பட்டத்திற்கான மரபான மாற்று மொழிபெயர்ப்பைத் தருகிறது.
lexical_decisions:
- source_word: πολλοὶ
  choice: பலர்
  rationale: எண்ணிக்கையைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்; மனிதர்களைக் குறிக்கும் கிரேக்கப் பன்மையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய எச்சரிக்கைக்கான விளக்கத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் காரணவிளக்கத் தன்மையைப் பாதுகாக்கிறது.
- source_word: ἐλεύσονται
  choice: வந்து
  rationale: எதிர்கால வினையான ‘வருவார்கள்’ என்பது வாக்கியத்தின் இறுதியில் உள்ள ‘செய்வார்கள்’ என்பதோடு தமிழில் இயல்பாக ஒருங்கிணைந்து ‘வந்து’ என அமைகிறது; எதிர்காலப் பொருள் முழு வாக்கியத்தால் தெளிவாகிறது.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: என் பெயரில்
  rationale: இயேசுவின் பெயரையோ அடையாளத்தையோ உரிமையுடன் முன்வைத்து வருவதைத் தெரிவிக்கும் இயல்பான தமிழ் மரபுத்தொடர்; சொற்றொடரின் சாத்தியமான அதிகாரம்/அடையாளம் சார்ந்த பரப்பை அளவுக்கு மீறி வரையறுக்கவில்லை.
- source_word: λέγοντες
  choice: என்று சொல்லி
  rationale: அவர்களுடைய கூற்றின் உள்ளடக்கத்தை நேரடியாக அறிமுகப்படுத்துகிறது; ‘உரிமைகோரி’ போன்ற விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: Ἐγώ εἰμι ὁ χριστός
  choice: நானே மேசியா
  rationale: Ἐγώ என்பதின் வலியுறுத்தலை ‘நானே’ வெளிப்படுத்துகிறது. ὁ χριστός இங்கு தனிப்பெயராக அல்ல, எதிர்பார்க்கப்பட்ட அபிஷேகம் பெற்றவரைக் குறிக்கும் பட்டமாக இருப்பதால் ‘மேசியா’ பயன்படுத்தப்படுகிறது.
- source_word: πλανήσουσιν
  choice: வழிதவறச் செய்வார்கள்
  rationale: ஏமாற்றுதல் மட்டுமன்றி சரியான வழியிலிருந்து விலக்குதல் என்ற πλανάω வினையின் உருவகப் பரப்பையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: πολλοὺς
  choice: பலரை
  rationale: வினையின் நேரடிச் செயப்படுபொருளாக உள்ள மனிதப் பன்மையைச் சுருக்கமாகவும் தெளிவாகவும் காட்டுகிறது.
theological_decisions:
- issue: பொய்யான மேசிய உரிமைகோரலில் Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: கூற்றாளர்கள் இயேசுவின் பெயரை ஒரு தனிப்பெயராகப் பயன்படுத்துவதாக அல்லாமல், தாங்களே எதிர்பார்க்கப்பட்ட அபிஷேகம் பெற்றவர் என்று கூறுவதே சூழல். ஆகவே பட்டப்பொருளைத் தெளிவாக்க ‘மேசியா’ முதன்மை உரையில் வைக்கப்பட்டு, மரபான ‘கிறிஸ்து’ அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை. கிரேக்க வாக்கியத்தின் விளக்கத் தொடர்பு, வலியுறுத்தல், எதிர்காலப் பொருள் மற்றும் வழிதவறச் செய்தல் என்ற உருவகம் பாதுகாக்கப்பட்டுள்ளன.
