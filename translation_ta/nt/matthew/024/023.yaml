id: MAT.24.23
reference: Matthew 24:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τότε ἐάν τις ὑμῖν εἴπῃ· Ἰδοὺ ὧδε ὁ χριστός, ἤ· Ὧδε, μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/023.yaml
  text: Then if anyone says to you[a], ‘Look, here is the Messiah!’ or[b], ‘There he is!’ do not believe it.
translation:
  language: ta
  text: அப்போது யாராவது உங்களிடம், “இதோ, மேசியா[a] இங்கே இருக்கிறார்!” என்றோ, “அவர் இங்கே இருக்கிறார்!” என்றோ சொன்னால், அதை நம்பாதீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “கிறிஸ்து.”
    reason: Χριστός என்பதற்கான பாரம்பரிய மொழிபெயர்ப்பை வழங்குகிறது.
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: முந்தைய இறுதிக்கால உரையுடன் இந்த எச்சரிக்கையை இணைக்கும் காலச்சுட்டை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: யாராவது உங்களிடம் ... சொன்னால்
  rationale: நிபந்தனையையும் குறிப்பிடப்படாத நபரையும் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து அருகிலுள்ள ஒன்றைச் சுட்டும் கிரேக்கச் சொல்லின் வலிமையை இயல்பாகப் பாதுகாக்கிறது.
- source_word: ὧδε
  choice: இங்கே
  rationale: இரு இடங்களிலும் வரும் ஒரே இடவினையுரிச்சொல்லை ஒரேவிதமாக மொழிபெயர்த்து, மூலத்தின் ‘இங்கே’ என்ற சுட்டுதலைப் பாதுகாக்கிறது.
- source_word: ὁ χριστός
  choice: மேசியா
  rationale: கட்டுரையுடன் வரும் இச்சொல் இங்கு தனிப்பெயராக அல்லாமல் எதிர்பார்க்கப்பட்ட அபிஷேகம் பெற்றவரைக் குறிக்கும் பட்டமாகச் செயல்படுகிறது.
- source_word: ἤ· Ὧδε
  choice: என்றோ, “அவர் இங்கே இருக்கிறார்!” என்றோ
  rationale: கிரேக்கத்தில் விடுபட்டுள்ள எழுவாயையும் வினையையும் தமிழின் தெளிவுக்காக நிரப்புகிறது; அதேவேளையில் ὧδε என்பதன் ‘இங்கே’ என்ற பொருளை மாற்றாமல் வைக்கிறது.
- source_word: μὴ πιστεύσητε
  choice: அதை நம்பாதீர்கள்
  rationale: தடைநிலையை இயல்பான தமிழில் தருகிறது; ‘அதை’ என்பது நபரை அல்ல, முன் கூறப்பட்ட கூற்றைக் குறிக்கிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு இயேசுவின் பெயர்போன்ற பயன்பாடு அல்லாமல், எதிர்பார்க்கப்பட்ட அபிஷேகம் பெற்ற மீட்பரைக் குறிக்கும் பட்டமே கருத்தாக உள்ளது. பாரம்பரிய வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், உரையாடலின் உடனடித் தன்மையையும் எச்சரிக்கையின் நேரடியான வலிமையையும் காக்கும் கண்ணியமான நடை. மூலத்தில் இருமுறையும் ὧδε (‘இங்கே’) வருவதால், ஆங்கில ஆலோசனை உரையின் ‘There he is’ என்பதைப் பின்பற்றாமல் மூலச்சான்று முன்னிலைப்படுத்தப்பட்டது.
