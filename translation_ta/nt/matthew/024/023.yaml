  verdict: approve
  source_fidelity: மூலக் கிரேக்கத்தின் காலச்சுட்டு (τότε), நிபந்தனை, கவனஈர்ப்பு (Ἰδοὺ), இருமுறை வரும் இடச்சுட்டு (ὧδε), பட்டப்பெயரான ὁ χριστός, மற்றும் தடைநிலை (μὴ πιστεύσητε) ஆகியவை துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. இரண்டாம் மேற்கோளில் கிரேக்கத்தில் விடுபட்டுள்ள எழுவாய்/வினை தமிழில் தெளிவுக்காகச் சேர்க்கப்பட்டுள்ளது; பொருள் மாற்றமில்லை.
  naturalness: “அப்போது யாராவது உங்களிடம் … சொன்னால், அதை நம்பாதீர்கள்” என்பது நவீன பொதுத்தமிழில் இயல்பானதும் எச்சரிக்கைத் தொனிக்கு ஏற்றதுமாக உள்ளது. “இதோ” மற்றும் “இங்கே இருக்கிறார்” நேரடி உரையின் உடனடித்தன்மையை நன்றாகத் தருகின்றன.
  terminology: ὁ χριστός என்பதற்குப் பட்டப்பெயர் பொருளில் “மேசியா” பயன்படுத்தப்பட்டிருப்பது ஏற்றது. பாரம்பரியமான “கிறிஸ்து” அடிக்குறிப்பில் மாற்று வடிவாகக் கொடுக்கப்பட்டுள்ளது. “அதை” என்பது நபரைக் காட்டாமல் முன்வைக்கப்பட்ட கூற்றைக் குறிப்பதால் மூலத்தின் திறந்த தன்மையைப் பாதுகாக்கிறது.
