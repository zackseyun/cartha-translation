  text: καὶ ἄρξηται τύπτειν τοὺς συνδούλους ⸂αὐτοῦ, ἐσθίῃ δὲ καὶ πίνῃ⸃ μετὰ τῶν μεθυόντων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/049.yaml
  text: and begins to beat his fellow servants[a], and eats and drinks with drunkards[b],
translation:
  language: ta
  text: தன் சக அடிமைகளை[a] அடிக்கத் தொடங்கி, குடித்துப் போதையேறுகிறவர்களோடு[b] உண்ணவும் குடிக்கவும் செய்தால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சக பணியாளர்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் சொல்லர்த்தமாக ‘சக அடிமைகள்’ எனப் பொருள்பட்டு, அவர்கள் அனைவரும் ஒரே எஜமானின் கீழ் இருப்பதை வலியுறுத்துகிறது.
    reason: alternative_reading
  - marker: b
    text: ‘குடிகாரர்களோடு’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கப் பங்கேற்புச் சொல் குடித்துப் போதையேறுகிறவர்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρξηται τύπτειν
  choice: அடிக்கத் தொடங்கி
  rationale: ἄρξηται என்பதன் செயல் தொடங்கும் பொருளையும், τύπτειν என்பதன் வன்முறையான, தொடர்ந்து அடிக்கும் செயற்பொருளையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τοὺς συνδούλους αὐτοῦ
  choice: தன் சக அடிமைகளை
  rationale: σύνδουλος என்பது ஒரே எஜமானின் கீழுள்ள ‘சக அடிமை’யைக் குறிக்கிறது. வீட்டெஜமானின் அதிகார அமைப்பு இங்கு முக்கியமானதால், ‘பணியாளர்கள்’ என்பதைவிட ‘அடிமைகள்’ மூலமொழியின் சமூக நிலையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἐσθίῃ δὲ καὶ πίνῃ
  choice: உண்டு குடித்தால்
  rationale: இரு வினைகளையும் எளிய, இயல்பான தமிழில் இணைத்து, கிரேக்க வினையெச்சங்களின் நிபந்தனைத் தொடரை முந்தைய வசனத்தோடு பொருந்துமாறு தருகிறது.
- source_word: μετὰ τῶν μεθυόντων
  choice: குடித்துப் போதையில் திளைப்பவர்களோடு
  rationale: μεθυόντων என்பது குடிபோதையில் ஈடுபடுகிறவர்களைச் சுட்டுகிறது. ‘குடிகாரர்கள்’ என்ற நிலையான அடையாளச் சொல்லை மட்டும் பயன்படுத்தாமல், பங்கேற்பு வடிவத்தின் செயற்பொருளை இத்தொடர் காக்கிறது.
theological_decisions:
- issue: σύνδουλος என்ற அடிமைத்தனச் சொல்லின் மொழிபெயர்ப்பு
  choice: சக அடிமைகள்
  alternative: சக பணியாளர்கள்
  rationale: உவமையின் வீட்டமைப்பில் அனைவரும் ஒரே எஜமானின் அதிகாரத்துக்குக் கீழ்ப்பட்டவர்கள் என்பது கருத்தின் ஒரு பகுதியாக உள்ளது. ஆகவே சமூக நிஜத்தையும் பகிரப்பட்ட கீழ்நிலையையும் மறைக்காமல் ‘சக அடிமைகள்’ என மொழிபெயர்க்கப்பட்டது.
- issue: μεθυόντων குறிக்கும் நபர்களின் தன்மை
  choice: குடித்துப் போதையில் திளைப்பவர்கள்
  alternative: குடிகாரர்கள்
  rationale: மூலத்தின் நிகழ்காலப் பங்கேற்பு வடிவம் குடிபோதையில் ஈடுபடும் செயலை முன்னிறுத்துகிறது; ஒருவரை நிரந்தர அடையாளத்தால் வகைப்படுத்துவது மட்டுமே அதன் நோக்கம் எனத் தீர்மானிக்காமல் அந்த நுட்பம் காக்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. வசனம் முந்தைய நிபந்தனை வாக்கியத்தின் தொடராக இருப்பதால் ‘குடித்தால்’ என முடிக்கப்பட்டுள்ளது; நிறைவு குறியீடாக காற்புள்ளி வைக்கப்பட்டுள்ளது. ‘சக அடிமைகள்’ என்பது சற்றுக் கடினமாகக் கேட்டாலும் மூலத்தின் சமூக மற்றும் உவமைச் சார்ந்த வலிமையைப் பாதுகாக்கிறது.
