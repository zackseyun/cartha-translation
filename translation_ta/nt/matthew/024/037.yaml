  text: ὥσπερ ⸀γὰρ αἱ ἡμέραι τοῦ Νῶε, οὕτως ⸀ἔσται ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/037.yaml
  text: For just as the days of Noah were[a], so the coming of the Son of Man will be.
translation:
  language: ta
  text: ஏனெனில், நோவாவின் நாட்கள் எப்படியிருந்தனவோ, மனிதகுமாரனின் வருகையும் அப்படியே இருக்கும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥσπερ … οὕτως
  choice: எப்படியிருந்தனவோ, அப்படியே
  rationale: கிரேக்கத்தின் இணைநிலை ஒப்பீட்டு அமைப்பை இயல்பான நவீனத் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய உரையுடன் இவ்வசனத்தை இணைக்கும் விளக்கக் காரணத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: αἱ ἡμέραι τοῦ Νῶε
  choice: நோவாவின் நாட்கள்
  rationale: வேதாகமப் பெயரையும் ‘நாட்கள்’ என்ற காலக் குறிப்பையும் நேரடியாகப் பாதுகாக்கிறது; கிரேக்கத்தில் மறைந்துள்ள வினை தமிழ் ஒப்பீட்டு தொடரில் ‘இருந்தனவோ’ என இயல்பாக நிறைவு செய்யப்படுகிறது.
- source_word: ἔσται
  choice: இருக்கும்
  rationale: εἰμί என்பதன் எதிர்கால வடிவை மிகை விளக்கமின்றி நேராகத் தருகிறது.
- source_word: παρουσία
  choice: வருகை
  rationale: இந்த இறுதிக்காலச் சூழலில் எதிர்காலத்தில் நிகழும் வருதலைத் தெளிவாகக் குறிக்கிறது; சொல்லின் ‘உடனிருப்பு’ என்ற பொருள் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: இயேசுவின் நிலைபெற்ற வேதாகமப் பட்டத்தையும் தானியேல் நூலுடனான தொடர்பையும் பாதுகாக்கிறது.
theological_decisions:
- issue: இறுதிக்காலக் கூற்றில் παρουσία என்பதன் மொழிபெயர்ப்பு
  choice: வருகை
  alternative: உடனிருப்பு
  rationale: இச்சூழல் மனிதகுமாரனின் எதிர்கால வருதலைச் சுட்டுவதால் ‘வருகை’ நிகழ்வுத் தன்மையை இயல்பாக வெளிப்படுத்துகிறது. இருப்பினும் கிரேக்கச் சொல்லின் விரிந்த பொருள் வரம்பை மறைக்காமல் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘எப்படியிருந்தனவோ, அப்படியே’ என்ற அமைப்பு மூலத்தின் ஒப்பீட்டையும் முதல் கூறிலுள்ள மறை வினையையும் இயல்பாக வெளிப்படுத்துகிறது.
