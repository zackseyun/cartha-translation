  source_fidelity: மூல கிரேக்கத்தின் ஒப்புமை அமைப்பு, எதிர்கால வினை, கிழக்கு–மேற்கு விரிவு, மற்றும் παρουσία என்பதன் நிகழ்வுசார் பொருள் ஆகியவை வரைவில் பெரும்பாலும் துல்லியமாகக் காக்கப்பட்டுள்ளன. ஆனால் முடிவுப் பகுதியான “வருகையும் இருக்கும்” இயல்பான தமிழில் சற்றே முழுமையற்றதாக ஒலிக்கிறது; “அவ்வாறே ... இருக்கும்” என்பது οὕτως ἔσται என்பதன் ஒப்புமைத் தொடர்பைத் தெளிவாக்குகிறது.
  naturalness: “ஏனெனில், மின்னல் ... போலவே” என்பது இயல்பானது. “மேற்கு வரை” எனப் பிரித்து எழுதுவதும், ஒப்புமையின் இரண்டாம் பகுதியை “அவ்வாறே” எனத் தொடங்குவதும் நவீன பொதுத்தமிழில் வாசிப்பைச் சீராக்கும்.
