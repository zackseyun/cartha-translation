id: MAT.24.27
reference: Matthew 24:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ ἀστραπὴ ἐξέρχεται ἀπὸ ἀνατολῶν καὶ φαίνεται ἕως δυσμῶν, οὕτως ⸀ἔσται ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/027.yaml
  text: For just as the lightning comes from the east and is seen as far as the west[a], so will the coming of the Son of Man be.
translation:
  language: ta
  text: ஏனெனில், மின்னல் கிழக்கிலிருந்து வெளிப்பட்டு மேற்கு வரை காணப்படுவது போலவே, அவ்வாறே மனிதமகனின் வருகையும் இருக்கும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: ஏனெனில், ... போலவே
  rationale: γάρ என்பதன் விளக்கத் தொடர்பை ‘ஏனெனில்’ என்றும், ὥσπερ என்பதன் ஒப்புமையையும் வலியுறுத்தலையும் ‘போலவே’ என்றும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἀστραπή
  choice: மின்னல்
  rationale: இச்சொல் இங்கு ஒளியைப் பொதுவாக அல்ல, மின்னல் என்னும் இயற்கை நிகழ்வையே குறிக்கிறது.
- source_word: ἐξέρχεται
  choice: வெளிப்பட்டு
  rationale: ‘வெளியே வருகிறது’ என்ற அடிப்படைப் பொருளை மின்னலைக் குறிக்கும் இயல்பான தமிழில் தெரிவிக்கிறது; அடுத்துள்ள φαίνεται என்பதுடன் தேவையின்றி ஒன்றாக்கவில்லை.
- source_word: ἀπὸ ἀνατολῶν
  choice: கிழக்கிலிருந்து
  rationale: திசைகளைக் குறிக்கும் இச்சூழலில் ἀνατολαί என்பதன் இயல்பான பொருள் ‘கிழக்கு’; δυσμαί என்பதுடன் உள்ள எதிரிணையையும் தெளிவாகக் காக்கிறது.
- source_word: φαίνεται
  choice: காணப்படுவது
  rationale: வினையின் நடுநிலை/செயப்பாட்டு வடிவத்தையும், மின்னல் வெளிப்படையாகப் புலப்படும் தன்மையையும் காக்கிறது; ‘ஒளிவீசுகிறது’ என்று சொற்பொருளுக்கு மேலாகக் கூறுவதைத் தவிர்க்கிறது.
- source_word: ἕως δυσμῶν
  choice: மேற்குவரை
  rationale: ἕως குறிக்கும் எல்லையையும், கிழக்கிலிருந்து மேற்கு வரையிலான முழுப் பரப்பையும் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: οὕτως ἔσται
  choice: போலவே ... இருக்கும்
  rationale: ஒப்புமையின் முடிவுப் பகுதியையும் எதிர்கால வினையையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: παρουσία
  choice: வருகை
  rationale: மனிதமகனைப் பற்றிய இவ்வருங்காலச் சூழலில் நிகழ்வைக் குறிக்கும் பொருளை ‘வருகை’ தெளிவாகத் தெரிவிக்கிறது; ‘உடனிருப்பு’ என்ற உண்மையான சொற்பொருள் மாற்று அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: மனிதமகன்
  rationale: இயேசு பயன்படுத்தும் பட்டப்பெயரின் வடிவத்தையும் தானியேல் 7 உடனான இடைநூல் தொடர்பையும் காக்கும், அதேவேளையில் பழைய நடையிலான ‘மனுஷகுமாரன்’ என்பதைக் காட்டிலும் இன்றைய வாசகருக்கு எளிதான வடிவம்.
theological_decisions:
- issue: முடிவுக்காலக் கூற்றில் παρουσία என்பதன் மொழிபெயர்ப்பு
  choice: வருகை
  alternative: உடனிருப்பு; வந்தடைதல்
  rationale: மின்னலின் வெளிப்படையான தோற்றத்தோடு மனிதமகனின் παρουσία ஒப்பிடப்படுவதால், இங்கு எதிர்கால வருகை என்னும் நிகழ்வுப் பொருள் சூழலுக்கு மிகவும் பொருந்துகிறது. எனினும், எந்தக் குறிப்பிட்ட முடிவுக்காலக் கோட்பாட்டையும் திணிக்காமல் ‘உடனிருப்பு’ என்ற சொற்பொருள் வாய்ப்பை அடிக்குறிப்பில் வைத்திருக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், இயல்பும் கண்ணியமும் உடைய நடை பயன்படுத்தப்பட்டுள்ளது. ‘மனிதமகன்’ என்பது பட்டப்பெயரின் மூல வடிவத்தையும் வேதாகம இடைநூல் ஒலியையும் காக்கிறது; ‘மனுஷகுமாரன்’ போன்ற பழைய நடை தவிர்க்கப்பட்டுள்ளது.
