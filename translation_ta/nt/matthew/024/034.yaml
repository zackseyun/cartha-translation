source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη ἕως ἂν πάντα ταῦτα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/034.yaml
  text: Truly I tell you that this generation will certainly not pass away until all these things happen[a].
translation:
  language: ta
  text: '“உண்மையாகவே நான் உங்களுக்குச் சொல்கிறேன்: இவையெல்லாம் நிகழும்வரை இந்தத் தலைமுறை நிச்சயமாக ஒழிந்துபோகாது.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இந்த மக்கள்’ அல்லது ‘இந்த இனத்தார்.’ கிரேக்கச் சொல்லை இன்னும் விரிவான பொருளிலும் புரிந்துகொள்ள முடியும்; ஆனால் இங்கு ‘தலைமுறை’ என்பதே மிக நேரடியான மொழிபெயர்ப்பு.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: உண்மையாகவே
  rationale: இயேசுவின் உறுதியான அறிவிப்பு முறையை நவீன தமிழில் இயல்பாகவும் வலியுறுத்தலுடனும் தெரிவிக்கிறது; ஒலிபெயர்ப்பான ‘ஆமென்’ என்பதைவிட பொதுவாசகருக்கு உடனடியாகப் புரியும்.
- source_word: λέγω ὑμῖν
  choice: நான் உங்களுக்குச் சொல்கிறேன்
  rationale: நேரடி உரையையும் பன்மை முன்னிலையையும் இயல்பான தமிழில் துல்லியமாகக் காக்கிறது.
- source_word: οὐ μὴ παρέλθῃ
  choice: நிச்சயமாக ஒழிந்துபோகாது
  rationale: οὐ μή என்ற வலுவான மறுப்பை ‘நிச்சயமாக … இல்லை’ என்ற வடிவில் காக்கிறது; ஒரு தலைமுறை இல்லாமற்போவதைக் குறிக்கும் παρέρχομαι என்பதற்கு ‘ஒழிந்துபோகாது’ இயல்பாக அமைகிறது.
- source_word: ἡ γενεὰ αὕτη
  choice: இந்தத் தலைமுறை
  rationale: γενεά என்பதன் இச்சூழலுக்குரிய மிக நேரடியான பொருளை வழங்கி, காலமுடிவியல் விளக்கச் சர்ச்சையை மொழிபெயர்ப்பிலேயே தீர்மானிக்காமல் விடுகிறது.
- source_word: ἕως ἂν
  choice: நிகழும்வரை
  rationale: எதிர்கால எல்லையைச் சுட்டும் ‘வரை’ அமைப்பு ἕως ἄν என்பதன் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: πάντα ταῦτα
  choice: இவையெல்லாம்
  rationale: சுட்டுப்பெயருடனான நடுநிலைப் பன்மையின் தொகுப்புப் பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: γένηται
  choice: நிகழும்
  rationale: சம்பவங்கள் நடைபெறுவதைக் குறிக்கும் γίνομαι என்பதற்கு நவீனத் தமிழில் தெளிவான, இயல்பான சொல்.
theological_decisions:
- issue: காலமுடிவியல் உரையில் ‘இந்தத் தலைமுறை’ (ἡ γενεὰ αὕτη) என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘இந்தத் தலைமுறை’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘இந்த மக்கள்’ அல்லது ‘இந்த இனத்தார்’
  rationale: இது கிரேக்கச் சொல்லின் மிக நேரடியான பொருளைத் தக்கவைத்து, இயேசுவின் சமகாலத்தாரையா, ஒரு மக்களையா, இனத்தையா குறிக்கிறது என்ற விவாதத்தை மொழிபெயர்ப்பு மூலம் மறைமுகமாகத் தீர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகருக்குப் புரியும் இயல்பான சொற்றொடர், அதேவேளையில் இயேசுவின் கூற்றுக்குரிய கண்ணியமும் வலியுறுத்தலும் காக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் இணைக்கப்பட்டுள்ளது.
