    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: பல
  rationale: எண்ணிக்கையைக் குறிக்கும் இயல்பான நேரடி இணை; கிரேக்கச் சொல்லின் பொருளை மிகைப்படுத்தாமல் தருகிறது.
- source_word: ψευδοπροφῆται
  choice: பொய்த் தீர்க்கதரிசிகள்
  rationale: பொய்யான அல்லது ஏமாற்றுகிற தீர்க்கதரிசிகளைக் குறிக்கும் கூட்டுச்சொல்லைத் துல்லியமாகவும் தமிழில் நிலைபெற்ற வேதாகமச் சொல்லாட்சியுடனும் தருகிறது.
- source_word: ἐγερθήσονται
  choice: எழும்பி
  rationale: இச்சூழலில் நபர்கள் தோன்றி முன்வருவதைக் குறிக்கும் இயல்பான தமிழ் வடிவம்; உயிர்த்தெழுதலைத் தேவையின்றி உணர்த்துவதில்லை. கிரேக்கத்தின் செயப்பாட்டு வடிவத்திற்கான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: πλανήσουσιν
  choice: வழிதவறச் செய்வார்கள்
  rationale: ஒருவரை வழியிலிருந்து விலகச் செய்தல் என்ற உருவகத்தையும், பொதுவாகத் தவறாக வழிநடத்துதல் என்ற பரந்த பொருளையும் பாதுகாக்கிறது.
- source_word: πολλούς
  choice: பலரை
  rationale: வினையின் நேரடிச் செயப்படுபொருளாக உள்ள ‘பலர்’ என்பதை இயல்பான தமிழ் வேற்றுமை வடிவில் தருகிறது.
- source_word: καὶ ... καὶ
  choice: … எழும்பி, … செய்வார்கள்
  rationale: தமிழில் இயல்பான தொடர் வினை அமைப்பு மூலம் இரண்டு எதிர்காலச் செயல்களையும் இணைக்கிறது; கிரேக்கத்தின் தொடர்ச்சியான எச்சரிக்கை வலிமை நிலைக்கிறது.
theological_decisions:
- issue: πλανήσουσιν குறிப்பிடும் வழிதவறச் செய்தலின் தன்மை
  choice: பொய்த் தீர்க்கதரிசிகள் பலரைப் பொதுவான பொருளில் தவறாக வழிநடத்துவார்கள் என்ற பரந்த எச்சரிக்கையாக மொழிபெயர்க்கப்பட்டது.
  alternative: இது குறிப்பாகக் கோட்பாட்டு ஏமாற்றம் அல்லது ஒழுக்க/இறுதிக்காலத் தவறுதல் என்று வரையறுத்தல்.
  rationale: πλανάω என்ற வினை கோட்பாட்டு, ஒழுக்க, ஆன்மிகத் தவறான வழிநடத்தலை உள்ளடக்கக்கூடும்; வசனம் அவற்றில் ஒன்றை மட்டும் குறிப்பிடாததால் அந்தத் திறந்த பொருள் பாதுகாக்கப்படுகிறது.
- issue: ἐγερθήσονται என்பதிலுள்ள செயப்பாட்டு வடிவம்
  choice: முதன்மை உரையில் சூழலுக்கேற்ற ‘எழும்பி’ பயன்படுத்தப்பட்டது.
  alternative: ‘எழுப்பப்படுவார்கள்’ என்று செயப்பாட்டை வெளிப்படையாகக் காட்டுதல்.
  rationale: செயப்பாட்டு வடிவம் ‘எழுப்பப்படுதல்’ எனப் புரிய வாய்ப்பிருந்தாலும், இச்சூழலில் ‘எழும்புதல்/தோன்றுதல்’ என்பது இயல்பான பொருள். யார் எழுப்புகிறார் என்ற இறையியல் முடிவை உரை திணிக்காதபடி மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடை. ‘பொய்த் தீர்க்கதரிசிகள்’ என்ற நிலைபெற்ற சொற்றொடர் வைக்கப்பட்டுள்ளது; ‘வழிதவறச் செய்வார்கள்’ மூலம் மூலத்தின் அலைந்து விலகும் உருவகமும் பொருளின் பரப்பும் பாதுகாக்கப்பட்டுள்ளன.
