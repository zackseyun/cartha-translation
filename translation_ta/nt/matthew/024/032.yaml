reference: Matthew 24:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἀπὸ δὲ τῆς συκῆς μάθετε τὴν παραβολήν· ὅταν ἤδη ὁ κλάδος αὐτῆς γένηται ἁπαλὸς καὶ τὰ φύλλα ἐκφύῃ, γινώσκετε ὅτι ἐγγὺς τὸ θέρος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/032.yaml
  text: 'Learn the parable from the fig tree: as soon as its branch becomes tender and puts out leaves[c][b][a], you know that summer is near.'
translation:
  language: ta
  text: 'அத்தி மரத்திலிருந்து உவமையைக்[a] கற்றுக்கொள்ளுங்கள்: அதன் கிளை மென்மையாகி, இலைகளைத் துளிர்விடும்போது[b], கோடைக்காலம்[c] நெருக்கத்தில் இருக்கிறது என்று நீங்கள் அறிந்துகொள்கிறீர்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உவமை’ என்பதற்கு ‘பாடம்’ அல்லது ‘விளக்க எடுத்துக்காட்டு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘இலைகள் துளிர்க்கும்போது.’
    reason: lexical_alternative
  - marker: c
    text: θέρος என்பது ‘கோடைக்காலம்’ என்றும் சில சூழல்களில் அறுவடைக் காலம் என்றும் குறிக்கலாம்; இங்கு அத்தி மரத்தின் பருவகாலக் காட்சி காரணமாக ‘கோடைக்காலம்’ என்பதே சிறப்பாகப் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς συκῆς
  choice: அத்தி மரத்திலிருந்து
  rationale: ἀπό + உரிமை வேற்றுமை கற்றுக்கொள்வதற்கான மூலத்தைச் சுட்டுகிறது. δέ-யின் மென்மையான இணைப்புப் பொருளைச் சூழல் ஏந்துவதால், மூலத்தில் இல்லாத காலக் குறிப்பான ‘இப்போது’ சேர்க்கப்படவில்லை.
- source_word: μάθετε
  choice: கற்றுக்கொள்ளுங்கள்
  rationale: μανθάνω என்பதன் இறந்தகால ஏவல் வடிவம் நேரடியான கட்டளையைக் குறிக்கிறது; முடிவான புரிதலை மட்டும் குறிக்கும் ‘புரிந்துகொள்ளுங்கள்’ என்பதைக் காட்டிலும் இது துல்லியமானது.
- source_word: τὴν παραβολήν
  choice: இந்த உவமையை
  rationale: παραβολή என்பது ஒப்புமை வழியாகக் கற்பிக்கும் உவமையைக் குறிக்கிறது. தமிழில் குறிப்பிட்ட உவமையை இயல்பாகச் சுட்ட ‘இந்த’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ὅταν ἤδη
  choice: துளிர்க்கும்போது
  rationale: ὅταν ஒரு பொதுவான காலச் சூழலை அறிமுகப்படுத்துகிறது; ἤδη வளர்ச்சியின் தென்படத் தொடங்கிய நிலையைக் காட்டுகிறது. தமிழில் தொடரின் முழுச் சூழலும் இந்த ஆரம்பநிலையை வெளிப்படுத்துகிறது.
- source_word: ὁ κλάδος αὐτῆς γένηται ἁπαλὸς
  choice: அதன் கிளை மென்மையாகி
  rationale: γένηται நிலைமாற்றத்தையும் ἁπαλός புதிய வளர்ச்சியால் ஏற்படும் மென்மையையும் குறிக்கின்றன.
- source_word: καὶ τὰ φύλλα ἐκφύῃ
  choice: இலைகள் துளிர்க்கும்போது
  rationale: ἐκφύω முளைத்தல் அல்லது வெளிவளர்தலைக் குறிக்கிறது; இலைகளைப் பற்றிய தாவரவியல் சூழலில் ‘துளிர்க்கும்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: γινώσκετε
  choice: நீங்கள் அறிந்துகொள்கிறீர்கள்
  rationale: இது நிகழ்கால இரண்டாம் நபர் பன்மை வினைமுற்று; ஏவலாக மாற்றாமல், பொதுவாக நிகழும் அறிதலைக் குறிக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἐγγὺς τὸ θέρος
  choice: கோடைக்காலம் நெருங்கிவிட்டது
  rationale: θέρος இங்குள்ள அத்தி மரத்தின் பருவகால அறிகுறியில் முதன்மையாக ‘கோடைக்காலம்’ என்பதைக் குறிக்கிறது; ἐγγύς அதன் அண்மையைச் சுட்டுகிறது.
theological_decisions:
- issue: அத்தி மர உருவகத்தின் பொருள்
  choice: அறிகுறிகளைக் கண்டு ஒரு காலம் நெருங்கியிருப்பதை அறியும் பருவகால உவமையாக மட்டும் மொழிபெயர்க்கப்பட்டது.
  alternative: அத்தி மரம் இஸ்ரவேலைக் குறிக்கும் அடையாளம் என்று மொழிபெயர்ப்பிலேயே விளக்குவது.
  rationale: இந்த வசனத்தின் கிரேக்க உரை அத்தி மரத்தின் அடையாளப் பொருளை வெளிப்படையாகத் தீர்மானிக்கவில்லை. ஆகவே விரிந்த இறுதிக்கால விளக்கங்களில் ஒன்றை மொழிபெயர்ப்புக்குள் புகுத்தாமல் உருவகத்தின் திறந்த தன்மை காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதைமிக்க பன்மை ஏவல் வடிவத்துடன் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘உவமை’ என்ற நற்செய்தி நூல்களின் வழக்குச் சொல் தக்கவைக்கப்பட்டுள்ளது; தேவையற்ற சமயக்குழுச் சார்ந்த விளக்கம் சேர்க்கப்படவில்லை.
