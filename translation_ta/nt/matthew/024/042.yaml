id: MAT.24.42
reference: Matthew 24:42
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: γρηγορεῖτε οὖν, ὅτι οὐκ οἴδατε ποίᾳ ⸀ἡμέρᾳ ὁ κύριος ὑμῶν ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/042.yaml
  text: Therefore stay awake[c][b][a], because you do not know on what day your Lord is coming.
translation:
  language: ta
  text: ஆகையால் விழித்திருங்கள்[a]; ஏனெனில், உங்கள் ஆண்டவர் எந்த நாளில்[b] வருகிறார்[c] என்று உங்களுக்குத் தெரியாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘காவலாயிருங்கள்’ அல்லது ‘விழிப்புடன் இருங்கள்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘எந்த நாள்.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது ‘வருவார்.’ கிரேக்கத்தில் இங்கு நிகழ்கால வினை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: விழித்திருங்கள்
  rationale: நிகழ்காலக் கட்டளைப் பன்மை தொடர்ந்து விழிப்புடன் இருப்பதற்கான அழைப்பைத் தருகிறது. ‘விழித்திருங்கள்’ என்பது விழித்திருக்கும் உருவகத்தை நேரடியாகவும் இயல்பாகவும் காக்கிறது.
- source_word: οὖν
  choice: ஆகையால்
  rationale: முந்தைய போதனையிலிருந்து வரும் முடிவைத் தெளிவாகக் குறிக்கிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: கட்டளைக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: οὐκ οἴδατε
  choice: உங்களுக்குத் தெரியாது
  rationale: அறியாமையை எந்த விளக்கச் சேர்க்கையும் இன்றி இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ποίᾳ ἡμέρᾳ
  choice: எந்த நாளில்
  rationale: காலத்தைக் குறிக்கும் வேற்றுமை வடிவத்தை இயல்பான தமிழில் வழங்கி, அறியப்படாத குறிப்பிட்ட நாளைச் சுட்டுகிறது.
- source_word: ὁ κύριος ὑμῶν
  choice: உங்கள் ஆண்டவர்
  rationale: κύριος என்பதன் அதிகாரத்தையும் புதிய ஏற்பாட்டில் அதன் பட்டப்பெயர் சார்ந்த பயன்பாட்டையும் காக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: ἔρχεται
  choice: வருகிறார்
  rationale: கிரேக்க நிகழ்கால வடிவத்தைத் தமிழிலும் நிகழ்காலமாகக் காத்து, வருகையின் உயிரோட்டமான எதிர்பார்ப்பை வெளிப்படுத்துகிறது; அதேவேளையில் அதன் காலத்தை அளவுக்கு மீறி வரையறுப்பதில்லை.
theological_decisions:
- issue: ἔρχεται என்ற நிகழ்கால வடிவத்தின் இறுதிக்காலப் பொருள்
  choice: வருகிறார்
  alternative: வருவார்
  rationale: இறுதிக்காலச் சூழலில் கிரேக்கம் நிகழ்கால வடிவத்தைப் பயன்படுத்துகிறது. ‘வருகிறார்’ அதன் உயிரோட்டத்தையும் அவசர உணர்வையும் காக்கிறது; ‘வருவார்’ என்ற எதிர்கால மொழிபெயர்ப்பும் சூழல்சார்ந்து சாத்தியம் என்பதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டுள்ளது. ‘விழித்திருங்கள்’ என்பது உருவகத்தைத் தக்கவைக்கிறது; ‘ஆண்டவர்’ என்பது வழக்கமான புதிய ஏற்பாட்டு இறையியல் சொல்லாட்சியைச் சார்புநிலையின்றிக் காக்கிறது.
