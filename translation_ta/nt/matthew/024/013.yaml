id: MAT.24.13
reference: Matthew 24:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/013.yaml
  text: But the one who endures to the end will be saved[a][b].
translation:
  language: ta
  text: ஆனால் முடிவுவரை நிலைத்திருப்பவரே காப்பாற்றப்படுவார்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘முடிவு வரும்வரை.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘இரட்சிக்கப்படுவார்’ அல்லது ‘விடுவிக்கப்படுவார்.’ கிரேக்கச் சொல் மீட்பையோ இரட்சிப்பையோ குறிக்கலாம்; சூழல் அதன் பொருளை ஒன்றாகச் சுருக்க வேண்டியதில்லை என்பதால், இங்கே பரந்த பொருளுள்ள சொல் பயன்படுத்தப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ... ὑπομείνας
  choice: நிலைத்திருப்பவர்
  rationale: பெயர்ச்சொல் போலச் செயல்படும் உறுப்புவினை வடிவம், சோதனைகளின் மத்தியில் தொடர்ந்து நிலைத்திருக்கும் ஒருவரைக் குறிக்கிறது. தமிழில் பாலினம் சுட்டாத ஒருமை வடிவம் இயல்பாக உள்ளது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனங்களில் கூறப்படும் வழுவிப்போதல் மற்றும் வெறுப்பு ஆகியவற்றோடு உள்ள மென்மையான முரண்பாட்டைக் காட்டுகிறது.
- source_word: ὑπομείνας
  choice: நிலைத்திருப்பவர்
  rationale: ὑπομένω என்பது அழுத்தம் அல்லது சோதனையின் கீழ் தாங்கி, உறுதியாகத் தொடர்வதைக் குறிக்கிறது. ‘நிலைத்திருப்பவர்’ என்பது நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் இந்தத் தொடர்ச்சியை வெளிப்படுத்துகிறது.
- source_word: εἰς τέλος
  choice: முடிவுவரை
  rationale: ஒரு இறுதிப்புள்ளி வரை தொடர்வதைக் குறிக்கிறது. ‘முடிவுவரை’ இயல்பான சுருக்கமான தமிழ்; ‘முடிவுபரியந்தம்’ நவீன நடையில் தேவையற்ற பழமையான வடிவம்.
- source_word: οὗτος
  choice: -வரே
  rationale: கிரேக்கச் சுட்டுப்பெயரின் வலியுறுத்தலைத் தனியாக ‘இவரே’ என்று மீண்டும் கூறாமல், தமிழின் தேற்ற ஏகாரத்தின் மூலம் இயல்பாகப் பாதுகாக்கிறது.
- source_word: σωθήσεται
  choice: காப்பாற்றப்படுவார்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவமான σῴζω மீட்பு அல்லது இரட்சிப்பு என்ற பரந்த பொருளைக் கொள்ளலாம். ‘காப்பாற்றப்படுவார்’ அந்தப் பொருள் அகலத்தை வைத்திருக்கிறது; சூழல் அனுமதிப்பதைவிட அதைத் தற்கால விடுவிப்பாகவோ இறுதி இரட்சிப்பாகவோ சுருக்கவில்லை.
theological_decisions:
- issue: முடிவுவரை நிலைத்திருப்பதன் சூழலில் σωθήσεται என்பதன் பொருள்
  choice: ‘காப்பாற்றப்படுவார்’ என்ற பரந்த பொருளுள்ள சொல்லைப் பயன்படுத்தி, அது இறுதிக்கால இரட்சிப்பையா, உபத்திரவத்திலிருந்து விடுவிப்பையா, அல்லது இரண்டையுமா குறிக்கிறது என்பதை நிர்ணயிக்காமல் விடுதல்.
  alternative: ‘இரட்சிக்கப்படுவார்’ அல்லது ‘விடுவிக்கப்படுவார்’ என்று பொருளை முறையே இறுதி இரட்சிப்பு அல்லது சூழ்நிலை சார்ந்த மீட்பு நோக்கிச் சுருக்குதல்.
  rationale: வசனம் இங்கே காப்பாற்றுதலின் சரியான பரப்பைத் தெளிவாகத் தீர்மானிக்கவில்லை. எனவே நிலைத்திருத்தல் மற்றும் இரட்சிப்பு பற்றிய ஒரு குறிப்பிட்ட கோட்பாட்டு முடிவை மொழிபெயர்ப்பில் புகுத்தாமல் மூலத்தின் இறையியல் அழுத்தம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘நிலைத்திருப்பவர்’ என்பது சோதனையில் தொடர்வதை இயல்பாக வெளிப்படுத்துகிறது. οὗτος என்பதன் வலியுறுத்தல் ‘-வரே’ மூலம் தமிழுக்கேற்ற வகையில் தெரிவிக்கப்பட்டுள்ளது.
