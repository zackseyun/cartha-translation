  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσεται, οἱ δὲ λόγοι μου οὐ μὴ παρέλθωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/035.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: ta
  text: வானமும் பூமியும் ஒழிந்துபோகும்; ஆனால் என் வார்த்தைகள் ஒருபோதும் ஒழிந்துபோகாது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிச்சயமாக ஒழிந்துபோகாது.” கிரேக்க மொழியில் வலியுறுத்தப்பட்ட மறுப்பு (οὐ μή) பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ οὐρανὸς
  choice: வானம்
  rationale: γῆ என்பதுடன் இணைந்துள்ள இச்சூழலில், காணக்கூடிய வானத்தை மட்டும் அல்லாமல் படைக்கப்பட்ட வானத்தைக் குறிக்கிறது; ‘வானமும் பூமியும்’ என்பது இயல்பான தமிழ்ச் சொற்றொடர்.
- source_word: ἡ γῆ
  choice: பூமி
  rationale: ‘வானமும் பூமியும்’ என்ற அண்டளாவிய இணைப்பில், இது ஒரு குறிப்பிட்ட நாட்டையோ நிலப்பகுதியையோ அல்ல, பூமியைக் குறிக்கிறது.
- source_word: παρελεύσεται
  choice: ஒழிந்துபோகும்
  rationale: தற்போதைய படைப்பொழுங்கு நிலைத்திருக்காது என்பதைக் காட்டுகிறது. அது எப்படி முடிவுறும் என்று தேவையின்றி விளக்காமல், παρέρχομαι என்பதன் மறைந்துபோதல் அல்லது முடிவுறுதல் சார்ந்த பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: வானமும் பூமியும் ஒழிந்துபோவதற்கும் இயேசுவின் வார்த்தைகள் நிலைத்திருப்பதற்கும் இடையிலான வலுவான முரண்பாட்டைக் காட்டுகிறது.
- source_word: οἱ λόγοι μου
  choice: என் வார்த்தைகள்
  rationale: இயேசு கூறிய அறிவிப்புகளையும் போதனைகளையும் பரந்த முறையில் உள்ளடக்கும் நேரடியான, இயல்பான மொழிபெயர்ப்பு.
- source_word: οὐ μὴ παρέλθωσιν
  choice: ஒருபோதும் ஒழிந்துபோகாது
  rationale: οὐ μή உடன் வரும் வலியுறுத்தப்பட்ட மறுப்பைத் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இயேசுவின் வார்த்தைகள் நிலைத்திருப்பது குறித்த கூற்றின் வலிமை
  choice: படைப்பொழுங்கு ஒழிந்துபோவதற்கும் இயேசுவின் வார்த்தைகள் ஒருபோதும் ஒழிந்துபோகாததற்கும் இடையிலான வலியுறுத்தப்பட்ட முரண்பாட்டை நேரடியாக மொழிபெயர்த்தல்
  alternative: இயேசுவின் தெய்வீக அதிகாரம் குறித்த கோட்பாட்டு விளக்கத்தை மொழிபெயர்ப்பிலேயே வெளிப்படையாகச் சேர்த்தல்
  rationale: மூலவசனம் இயேசுவின் வார்த்தைகளின் நிலைத்தன்மையை வலிமையாகக் கூறுகிறது; ஆனால் அதன் கோட்பாட்டு விளைவுகளைத் தனியாக விரித்துரைக்கவில்லை. எனவே அந்த வலிமையைப் பாதுகாத்து, கூடுதல் கோட்பாட்டுக் கருத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதவாக்கியத்திற்கேற்ற கண்ணியமான தொனியிலும் வடிவமைக்கப்பட்டுள்ளது. அஃறிணைப் பன்மையான ‘வார்த்தைகள்’ என்பதுடன் ஒருமை வினைமுற்றான ‘ஒழிந்துபோகாது’ வருவது இயல்பான தமிழ் இலக்கணப் பயன்பாடு.
