source:
  edition: SBLGNT
  text: καὶ διχοτομήσει αὐτὸν καὶ τὸ μέρος αὐτοῦ μετὰ τῶν ὑποκριτῶν θήσει· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/051.yaml
  text: and will cut him in two and assign his place with the hypocrites[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: ta
  text: அவர் அவனை இரண்டாக வெட்டி[a], வெளிவேடக்காரர்களோடு அவனுக்குரிய பங்கை ஒதுக்குவார்[b]. அங்கே அழுகையும் பற்கடிப்பும் இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, கருத்தை விளக்கி, ‘அவனைக் கடுமையாகத் தண்டிப்பார்.’ கிரேக்க வினைச்சொல்லின் நேரடிப் பொருள் ‘இரண்டாக வெட்டுவார்.’
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘வெளிவேடக்காரர்களோடு அவனுடைய பங்கு.’ இங்கு ‘பங்கு’ என்பது அவனுக்கு ஒதுக்கப்படும் நிலை அல்லது முடிவைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: διχοτομήσει
  choice: இரண்டாக வெட்டி
  rationale: வினைச்சொல்லின் நேரடியான, வலிமையான பொருள் ‘இரண்டாக வெட்டுதல்.’ கடுமையாகத் தண்டித்தல் என்ற உருவகப் புரிதலை முதன்மை உரையில் திணிக்காமல், மூலத்தின் கடுமையான படிமம் பாதுகாக்கப்படுகிறது.
- source_word: μέρος
  choice: பங்கு
  rationale: μέρος என்பதன் அடிப்படைப் பொருளான ‘பங்கு/ஒதுக்கப்பட்ட பகுதி’ பாதுகாக்கப்படுகிறது. இது இடம், முடிவு அல்லது விதி என்று தேவையின்றி மிகத் துல்லியப்படுத்தாமல் நீதித்தீர்ப்பில் ஒருவருக்குக் கிடைக்கும் பங்கை உணர்த்துகிறது.
- source_word: ὑποκριτῶν
  choice: மாயவேடக்காரர்கள்
  rationale: வெளிப்புறத்தில் ஒன்றாகத் தோன்றி உண்மையில் வேறாக இருப்பவர்களைச் சுட்டும் மத்தேயுவின் கருத்தை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: ἐκεῖ
  choice: அங்கே
  rationale: முன்னர் கூறப்பட்ட தீர்ப்பின் நிலையைச் சுட்டும் இடவினையடை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கப்படுகிறது.
- source_word: κλαυθμὸς
  choice: அழுகை
  rationale: மத்தேயுவில் மீண்டும் வரும் தீர்ப்புச் சொற்றொடருக்கு ஏற்ற தெளிவான, வழக்கமான தமிழ் பெயர்ச்சொல்.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: பற்கடிப்பு
  rationale: பற்களைக் கடிக்கும் தீவிரமான படிமத்தைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
theological_decisions:
- issue: διχοτομήσει என்பதை உருவகமான தண்டனைச் சொல்லாக மென்மைப்படுத்த வேண்டுமா
  choice: ‘இரண்டாக வெட்டி’ என்ற நேரடியான படிமத்தை முதன்மை உரையில் வைத்தல்
  alternative: ‘கடுமையாகத் தண்டித்து’ என்று பொதுப்பொருளாக மொழிபெயர்த்தல்
  rationale: கிரேக்க வினைச்சொல்லின் வெளிப்படையான பொருளையும் எச்சரிக்கையின் கடுமையையும் இது காக்கிறது; இறுதித் தண்டனையின் தன்மையைப் பற்றிய குறிப்பிட்ட கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: τὸ μέρος αὐτοῦ ... θήσει குறிக்கும் முடிவை எவ்வாறு வெளிப்படுத்துவது
  choice: ‘மாயவேடக்காரர்களோடு அவனுடைய பங்கை வைப்பார்’
  alternative: ‘மாயவேடக்காரர்களோடு அவனுக்கு இடம் ஒதுக்குவார்’
  rationale: ‘பங்கு’ என்ற மூலப் பொருளையும் ஒதுக்கப்பட்ட முடிவு என்ற கருத்தையும் காக்கிறது; அது இடமா, விதியா, உரிமைப்பங்கா என்பதை உரை சொல்வதைவிட அதிகமாகத் தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான, வலிமையான தீர்ப்புமொழி பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் அசைநிலை ‘பங்கு’ என்பதில் பாதுகாக்கப்பட்டுள்ளது; ‘இரண்டாக வெட்டி’ என்ற அதிர்வூட்டும் படிமம் மென்மைப்படுத்தப்படவில்லை.
