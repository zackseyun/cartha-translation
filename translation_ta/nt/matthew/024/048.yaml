  text: ἐὰν δὲ εἴπῃ ὁ κακὸς δοῦλος ἐκεῖνος ἐν τῇ καρδίᾳ αὐτοῦ· Χρονίζει ⸂μου ὁ κύριος⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/048.yaml
  text: But if that wicked servant says in his heart[b][a], ‘My master is delaying,’
translation:
  language: ta
  text: ஆனால், அந்தத் தீய பணியாளன்[a] தன் உள்ளத்தில், ‘என் எஜமான்[b] வரத் தாமதிக்கிறார்’ என்று சொன்னால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அந்தத் தீய அடிமை.’ δοῦλος என்ற கிரேக்கச் சொல் சூழலுக்கேற்ப ‘பணியாளன்’ அல்லது ‘அடிமை’ என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என் ஆண்டவர்.’ இங்குள்ள κύριος என்ற கிரேக்கச் சொல்லுக்கு வீட்டுச் சூழலின்படி ‘எஜமான்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: ஆனால் ... சொன்னால்
  rationale: δέ தரும் மென்மையான மாறுபாட்டை ‘ஆனால்’ என்றும், ἐὰν உடன் வரும் நிபந்தனைப் பொருளை ‘சொன்னால்’ என்றும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὁ κακὸς δοῦλος ἐκεῖνος
  choice: அந்தத் தீய பணியாளன்
  rationale: κακός என்பதன் ஒழுக்கத் தீமையை ‘தீய’ காட்டுகிறது; ἐκεῖνος என்பதன் சுட்டுப்பொருளை ‘அந்த’ காக்கிறது. வீட்டுப் பொறுப்பு ஒப்படைக்கப்பட்டவரை மையப்படுத்தும் உவமைச் சூழலில் δοῦλος என்பதற்கு ‘பணியாளன்’ இயல்பான தேர்வு; ‘அடிமை’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: தன் உள்ளத்தில்
  rationale: உள்ளார்ந்த சிந்தனை அல்லது தனக்குள் பேசுதலைக் குறிக்கும் மூலமொழி உருவகத்தை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: Χρονίζει
  choice: தாமதிக்கிறார்
  rationale: நிகழ்கால வினையின் தொடரும் தாமதப் பொருளை நேரடியாக வெளிப்படுத்துகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘வருவதற்கு’ போன்ற நிறைவைச் சேர்க்கவில்லை.
- source_word: μου ὁ κύριος
  choice: என் எஜமான்
  rationale: μου என்பதைக் ‘என்’ எனவும், வீட்டுச் சூழலில் பணியாளனுக்கு அதிகாரியான κύριος என்பதைக் ‘எஜமான்’ எனவும் தருகிறது.
theological_decisions:
- issue: உவமையின் வீட்டுச் சூழலில் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: எஜமான்
  alternative: ஆண்டவர்
  rationale: உடனடி கதைச் சூழலில் இது பணியாளனின் வீட்டுத் தலைவரைக் குறிக்கிறது. எனவே ‘எஜமான்’ கதைமட்ட உறவைத் தெளிவாகக் காட்டுகிறது; பரந்த உரையில் உள்ள கிறிஸ்துவியல் தொடர்பை மொழிபெயர்ப்பில் வலுக்கட்டாயமாகத் தீர்மானிப்பதில்லை.
- issue: δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: பணியாளன்
  alternative: அடிமை
  rationale: இங்கு பிணைக்கப்பட்ட சமூக நிலையைவிட ஒப்படைக்கப்பட்ட வீட்டுப் பொறுப்பும் நடத்தையும் முன்னிலைப்படுவதால் ‘பணியாளன்’ தேர்ந்தெடுக்கப்படுகிறது. ‘அடிமை’ என்ற நேரடியான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘தன் உள்ளத்தில்’ என்பது மூல உருவகத்தைப் பேணுகிறது; ‘எஜமான்’ வீட்டுச் சூழலைத் தெளிவுபடுத்துகிறது. பாலினத்தைக் காட்டும் ஆண்பால் வடிவங்கள் மூல உரையிலும் உவமையின் பாத்திரத்திலும் உள்ள இலக்கணச் சுட்டுகளைப் பின்பற்றுகின்றன.
