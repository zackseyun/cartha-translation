  text: Two women will be grinding at the mill[c][b][a]; one is taken and one is left.
translation:
  language: ta
  text: இரண்டு பெண்கள் திரிகையில் அரைத்துக்கொண்டிருப்பார்கள்[a][b]; ஒருத்தி எடுத்துக்கொள்ளப்படுவாள், மற்றொருத்தி அங்கேயே விடப்படுவாள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘திரிகையில் அரைத்துக்கொண்டிருக்கும் இரண்டு பெண்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் செயப்பெயரெச்சம் பெண்பால் பன்மையில் இருப்பதால், இங்கு குறிப்பிடப்படுகிறவர்கள் பெண்களே.
    reason: lexical_alternative
  - marker: b
    text: ‘கைத்திரிகையில்’ அல்லது ‘அரைக்கல்லைக் கொண்டு’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் அரைக்கும் கருவியையோ அரைக்கல்லையோ இன்னும் குறிப்பாகக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: கிரேக்கத்தில் ‘ஒருத்தி எடுத்துக்கொள்ளப்படுகிறாள், ஒருத்தி விடப்படுகிறாள்’ என்று மட்டுமே உள்ளது; எடுத்துக்கொள்ளப்படுவது இரட்சிப்புக்கா தீர்ப்புக்கா என்பதை இந்த வசனம் குறிப்பிடவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: δύο
  choice: இரண்டு
  rationale: இணையாக உள்ள இருவரைக் குறிக்கும் எண்ணுப்பெயர்; அவர்களைப் பெண்கள் என்று வெளிப்படுத்துவது பெண்பால் பன்மையில் உள்ள ἀλήθουσαι என்பதன் அடிப்படையில் செய்யப்படுகிறது.
- source_word: ἀλήθουσαι
  choice: பெண்கள் ... அரைத்துக்கொண்டிருப்பார்கள்
  rationale: பெண்பால் பன்மை நிகழ்காலச் செயப்பெயரெச்சம். தமிழில் இயல்பாகவும், சுற்றியுள்ள இறுதிக்காலச் சூழலோடும் பொருந்தவும் ‘பெண்கள்’ என்ற மறைந்த எழுவாயை வெளிப்படுத்தி, தொடர்ச்சியாக நடைபெறும் செயலை ‘அரைத்துக்கொண்டிருப்பார்கள்’ என்று மொழிபெயர்க்கிறது.
- source_word: ἐν τῷ μύλῳ
  choice: திரிகையில்
  rationale: μύλος என்பது அரைக்கும் கருவியையோ அரைக்கல்லையோ குறிக்கலாம். ‘திரிகை’ வீட்டு அரைப்புச் சூழலை இயல்பாகத் தருகிறது; கருவியின் துல்லிய வடிவத்தை அளவுக்கு மீறி நிர்ணயிப்பதில்லை.
- source_word: μία ... μία
  choice: ஒருத்தி ... மற்றொருத்தி
  rationale: இரு பெண்களுக்கிடையிலான பகிர்ந்தெடுக்கும் முரண்பாட்டைத் தெளிவாகவும் இயல்பான தமிழிலும் காட்டுகிறது.
- source_word: παραλαμβάνεται
  choice: எடுத்துக்கொள்ளப்படுவாள்
  rationale: செயப்பாட்டு வடிவத்தைப் பேணி, அவள் எதற்காக அல்லது எங்கே எடுத்துக்கொள்ளப்படுகிறாள் என்பதைச் சேர்க்காமல் விடுகிறது.
- source_word: καὶ
  choice: ','
  rationale: தமிழில் இணையான இரு முரண்பட்ட உறுப்புகளை காற்புள்ளியால் இணைப்பது இயல்பாக உள்ளது; கிரேக்கத்தில் இல்லாத வலுவான எதிர்மறைப் பொருளைச் சேர்க்கவில்லை.
- source_word: ἀφίεται
  choice: விடப்படுவாள்
  rationale: ‘கைவிடப்படுவாள்’ அல்லது ‘பின்னால் விட்டுச்செல்லப்படுவாள்’ போன்ற கூடுதல் உணர்வுகளைச் சேர்க்காமல், கிரேக்கச் செயப்பாட்டு வினையின் நேரடியான பொருளைப் பேணுகிறது.
theological_decisions:
- issue: பெண்பால் செயப்பெயரெச்சத்தில் மறைந்துள்ள எழுவாயை வெளிப்படையாகக் கூறுதல்
  choice: ‘பெண்கள்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  alternative: ‘இருவர் திரிகையில் அரைத்துக்கொண்டிருப்பார்கள்’
  rationale: ἀλήθουσαι என்பது பெண்பால் பன்மை; எனவே பொதுப்பாலாக மாற்றாமல் பெண்களையே குறிக்கிறது என்பதைத் தமிழில் வெளிப்படுத்துவது மூலத்துக்கு உண்மையானது.
- issue: ‘எடுத்துக்கொள்ளப்படுதல்’ மற்றும் ‘விடப்படுதல்’ இரட்சிப்பையா தீர்ப்பையா குறிக்கின்றன என்பது
  choice: அவற்றின் இறையியல் விளைவைத் தீர்மானிக்காமல் நடுநிலையான சொற்களைப் பயன்படுத்துதல்
  alternative: ஒருத்தி இரட்சிப்புக்காக எடுத்துக்கொள்ளப்படுவாள் / ஒருத்தி தீர்ப்புக்காக எடுத்துக்கொள்ளப்படுவாள்
  rationale: இந்த வசனம் பிரிவினையைச் சொல்கிறது; ஆனால் எந்தச் செயல் இரட்சிப்பை அல்லது தீர்ப்பைச் சுட்டுகிறது என்பதை இதிலேயே வெளிப்படையாக வரையறுக்கவில்லை. ஆகவே அந்த உண்மையான விளக்கத் திறப்பை மொழிபெயர்ப்பு பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. பெண்பால் குறிப்பு ‘பெண்கள்’, ‘ஒருத்தி’, ‘மற்றொருத்தி’ என்பவற்றால் தெளிவாகப் பேணப்பட்டுள்ளது; இறுதிக்காலப் பொருள் தேவையின்றி விளக்கப்படவில்லை.
