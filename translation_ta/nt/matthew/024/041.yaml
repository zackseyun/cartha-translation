revisions:
- from: இரண்டு பெண்கள் திரிகையில் அரைத்துக்கொண்டிருப்பார்கள்[a][b]; ஒருத்தி எடுத்துக்கொள்ளப்படுவாள், மற்றொருத்தி விடப்படுவாள்[c].
  to: இரண்டு பெண்கள் திரிகையில் அரைத்துக்கொண்டிருப்பார்கள்[a][b]; ஒருத்தி எடுத்துக்கொள்ளப்படுவாள், மற்றொருத்தி அங்கேயே விடப்படுவாள்[c].
  rationale: ‘அங்கேயே’ என்பது மற்றொருத்தி எடுத்துக்கொள்ளப்படாமல் மீதமாக இருக்கிறாள் என்ற கிரேக்க எதிரிணையின் இயல்பான தமிழாக்கத்திற்காக மட்டும் சேர்க்கப்பட்டுள்ளது. இது ‘விடப்படுவாள்’ என்பதன் விடுதலை/அனுமதி என்ற சாத்தியமான தவறான வாசிப்பைத் தவிர்க்கிறது; எடுத்துக்கொள்ளப்படுதலின் இறையியல் மதிப்பீட்டைத் தீர்மானிக்கவில்லை. மற்ற உரையும் அடிக்குறிப்புகளும் மூலப்பொருளையும் உரைநடையையும் போதுமான அளவில் பேணுகின்றன.
