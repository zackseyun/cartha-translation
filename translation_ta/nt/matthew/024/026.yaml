  naturalness: நடை நவீன பொதுத்தமிழில் தெளிவாகவும் மரியாதையான வேதாகமப் பதிவுக்கு ஏற்றதாகவும் உள்ளது. இரண்டாவது அறிவிப்பில் ‘என்று சொன்னால்’ மீண்டும் வருவது கிரேக்கத்தில் வெளிப்படையாக மறுமுறை இல்லாவிட்டாலும், தமிழில் இணையான நிபந்தனை அமைப்பைத் தெளிவுபடுத்தும் இயல்பான விரிவாக்கம்; பொருளை மாற்றவில்லை.
