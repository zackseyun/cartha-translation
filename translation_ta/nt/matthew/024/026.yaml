id: MAT.24.26
reference: Matthew 24:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐὰν οὖν εἴπωσιν ὑμῖν· Ἰδοὺ ἐν τῇ ἐρήμῳ ἐστίν, μὴ ἐξέλθητε· Ἰδοὺ ἐν τοῖς ταμείοις, μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/026.yaml
  text: Therefore[a], if they say to you, ‘Look, he is in the wilderness,’ do not go out; ‘Look[c][b], he is in the inner rooms,’ do not believe it.
translation:
  language: ta
  text: ஆகவே, அவர்கள் உங்களிடம், “இதோ, அவர் வனாந்தரத்தில்[a] இருக்கிறார்” என்று சொன்னால், வெளியே போகாதீர்கள்; “இதோ, அவர் உள்ளறைகளில்[b] இருக்கிறார்” என்று சொன்னால், நம்பாதீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாலைநிலத்தில்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “சேமிப்பு அறைகளில்” அல்லது “தனி அறைகளில்.” கிரேக்கச் சொல் வீட்டின் உட்புற அல்லது தனிப்பட்ட அறைகளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: ஆகவே, ... சொன்னால்
  rationale: οὖν முந்தைய எச்சரிக்கையிலிருந்து வரும் முடிவுத் தொடர்பைக் காட்டுகிறது; ἐὰν நிபந்தனையை அறிமுகப்படுத்துகிறது. தமிழில் ‘ஆகவே’ மற்றும் ‘சொன்னால்’ இரண்டையும் கொண்டு இவ்விரு கூறுகளும் இயல்பாகப் பாதுகாக்கப்படுகின்றன.
- source_word: εἴπωσιν ὑμῖν
  choice: அவர்கள் உங்களிடம் ... சொன்னால்
  rationale: மூன்றாம் நபர் பன்மை இங்கு குறிப்பிட்ட குழுவைக் குறிப்பிடாமல் பொதுவாகப் பேசுபவர்களைக் குறிக்கிறது. ‘உங்களிடம் சொன்னால்’ என்பது தத்தம் பொருளை நேரடியாக வழங்குகிறது.
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: ἰδού கவனத்தை உடனடியாக ஈர்க்கும் சொல். ‘இதோ’ நவீனத் தமிழிலும் இயல்பான, சுருக்கமான கவன ஈர்ப்புச் சொல்லாகும்.
- source_word: ἐν τῇ ἐρήμῳ
  choice: வனாந்தரத்தில்
  rationale: ἔρημος மக்கள் குடியிருப்பில்லாத வனாந்தரத்தையோ பாலைநிலத்தையோ குறிக்கலாம். ‘வனாந்தரம்’ சொல்லின் பரந்த பொருளை வைத்திருக்கிறது; ‘பாலைநிலம்’ என்ற மாற்றும் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐστίν
  choice: அவர் ... இருக்கிறார்
  rationale: கிரேக்கத்தில் எழுவாய் வெளிப்படையாக இல்லாவிட்டாலும், சூழலில் கூறப்படுகிற நபரே குறிப்பு. தமிழில் இயல்புக்காக மரியாதை ஒருமையான ‘அவர்’ சேர்க்கப்படுகிறது; ‘மேசியா’ அல்லது ‘இயேசு’ என்ற பட்டப்பெயர் சேர்க்கப்படவில்லை.
- source_word: μὴ ἐξέλθητε
  choice: வெளியே போகாதீர்கள்
  rationale: μή உடன் வரும் இறந்தகாலத் துணைவினை வடிவம் தடையைத் தெரிவிக்கிறது. ἐξέρχομαι குறிக்கும் வெளியே செல்லும் இயக்கத்தை இச்சொற்றொடர் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἐν τοῖς ταμείοις
  choice: உள்ளறைகளில்
  rationale: ταμεῖον வீட்டின் உட்புற அல்லது தனிப்பட்ட அறையையும் சேமிப்பு அறையையும் குறிக்கலாம். ‘உள்ளறைகள்’ மறைவுத்தன்மையை மிகைப்படுத்தாமல் உட்புற இடத்தைச் சொல்கிறது.
- source_word: μὴ πιστεύσητε
  choice: நம்பாதீர்கள்
  rationale: πιστεύω இங்கு கூறப்பட்ட செய்தியை நம்ப வேண்டாம் என்ற தடையைத் தருகிறது. கிரேக்கத்தில் வெளிப்படையான செயப்படுபொருள் இல்லாததால், தமிழிலும் அதைச் சேர்க்காமல் இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: ἐστίν என்பதன் மறைந்துள்ள எழுவாய்
  choice: ‘அவர் இருக்கிறார்’ என்று மட்டும் வழங்கப்பட்டது.
  alternative: ‘மேசியா அங்கே இருக்கிறார்’ அல்லது ‘இயேசு அங்கே இருக்கிறார்’
  rationale: உடனடிச் சூழல் கூறப்படுகிற கிறிஸ்துவின் இருப்பிடத்தைப் பற்றியது. தமிழில் எழுவாய் தேவைப்படுவதால் ‘அவர்’ சேர்க்கப்படுகிறது; ஆனால் கிரேக்கம் இவ்வாக்கியத்தில் வெளிப்படையாகச் சொல்லாத பட்டப்பெயரையோ பெயரையோ சேர்த்து இறையியல் குறிப்பைத் தீர்மானிக்கவில்லை.
- issue: இரண்டு இடங்களைப் பற்றிய கூற்றுகளின் தொடர்பு
  choice: இணைப்புச் சொல் சேர்க்காமல், அரைப்புள்ளியால் இணைக்கப்பட்ட இணையான இரு எச்சரிக்கைகளாக வழங்கப்பட்டது.
  alternative: இரண்டாவது கூற்றுக்கு முன் ‘அல்லது’ சேர்த்தல்
  rationale: கிரேக்க உரை இரண்டு இணையான கூற்றுகளை முன்வைக்கிறது; ஆனால் வெளிப்படையான பிரிநிலை இணைப்புச் சொல் இல்லை. ஆகவே ‘அல்லது’ சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகமச் செம்மையும் காக்கும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘அவர்’ என்பது சூழலால் அறியப்படும் நபரைக் குறிக்கும் மரியாதை ஒருமை; வெளிப்படையாக இல்லாத கிறிஸ்தவப் பட்டப்பெயர் சேர்க்கப்படவில்லை. இரண்டாவது நிபந்தனை வினைச்சொல் தமிழின் தெளிவுக்காக மீண்டும் கூறப்பட்டுள்ளது.
