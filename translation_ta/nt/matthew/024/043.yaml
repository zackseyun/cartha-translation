id: MAT.24.43
reference: Matthew 24:43
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐκεῖνο δὲ γινώσκετε ὅτι εἰ ᾔδει ὁ οἰκοδεσπότης ποίᾳ φυλακῇ ὁ κλέπτης ἔρχεται, ἐγρηγόρησεν ἂν καὶ οὐκ ἂν εἴασεν διορυχθῆναι τὴν οἰκίαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/043.yaml
  text: 'But know this: if the master of the house had known in what watch the thief was coming[b][a], he would have stayed awake and would not have let his house be broken into.'
translation:
  language: ta
  text: 'ஆனால், இதை அறிந்துகொள்ளுங்கள்: திருடன் இரவின் எந்தக் காவல் வேளையில் வரப்போகிறான் என்று வீட்டுத் தலைவர் அறிந்திருந்தால், அவர் விழித்திருந்து, திருடன் தன் வீட்டை உடைத்துக்கொண்டு நுழைய அனுமதித்திருக்க மாட்டார்.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: சொல்லுக்குச் சொல், “அவரது வீடு தோண்டித் துளைக்கப்பட.” பண்டைய வீடுகளில் சுவர் அல்லது கூரைப் பகுதியைத் தோண்டித் துளைத்து உள்ளே நுழைய முடிந்ததை இது பிரதிபலிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνο δὲ γινώσκετε
  choice: ஆனால் இதை அறிந்துகொள்ளுங்கள்
  rationale: δέ குறிக்கும் உரையாடல் திருப்பையும், γινώσκετε என்பதன் நேரடி அறிவுறுத்தல் வலிமையையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: οἰκοδεσπότης
  choice: வீட்டுத் தலைவர்
  rationale: வீட்டார் அல்லது குடும்பத்தின் பொறுப்புள்ள தலைவரைக் குறிக்கும் மூலச்சொல்லின் சமூகப் பொருளைப் பாதுகாக்கிறது; நவீன சொத்துரிமைக் கருத்தைத் தேவையின்றி புகுத்துவதில்லை.
- source_word: ποίᾳ φυλακῇ
  choice: இரவின் எந்தக் காவல் வேளையில்
  rationale: φυλακή இங்கு இரவு பிரிக்கப்பட்டிருந்த காவல் வேளைகளில் ஒன்றைக் குறிக்கிறது. தமிழில் பொருள் தெளிவாக இருக்க ‘இரவின்’ என்பது வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: ὁ κλέπτης ἔρχεται
  choice: திருடன் ... வருவான்
  rationale: நிகழ்கால வடிவமான ἔρχεται, இந்தக் கருதுகோள் நிபந்தனையில் எதிர்பார்க்கப்படும் வருகையைக் குறிக்கிறது; தமிழில் ‘வருவான்’ இயல்பாக அந்த உறவை வெளிப்படுத்துகிறது.
- source_word: ἐγρηγόρησεν ἂν
  choice: அவர் விழித்திருந்து
  rationale: γρηγορέω என்பதன் ‘விழித்திரு/காவலாயிரு’ என்ற பொருளை இரவுத் திருடன் பற்றிய உருவகத்திற்கேற்ற எளிய தமிழில் தருகிறது.
- source_word: οὐκ ἂν εἴασεν
  choice: விட்டிருக்க மாட்டார்
  rationale: நிகழாமல் தடுத்திருப்பார் என்ற எதிர்நிலை நிபந்தனையின் வலிமையை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: διορυχθῆναι τὴν οἰκίαν αὐτοῦ
  choice: தன் வீட்டை உடைத்து நுழைய
  rationale: διορύσσω என்பதன் சூழல்சார் பொருளான திருட்டுக்காக வீட்டைத் துளைத்து அல்லது உடைத்து நுழைவதை வாசகருக்குத் தெளிவாகச் சொல்கிறது; சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: வீட்டுத் தலைவரைக் குறிக்கும் உருவகம்
  choice: வீட்டுத் தலைவர்
  alternative: வீட்டின் எஜமான்; வீட்டுக்காரர்
  rationale: இது ஓர் எடுத்துக்காட்டு உருவகம்; இறையியல் பட்டமாகக் கருதாமல், οἰκοδεσπότης என்பதன் குடும்பத் தலைமைப் பொருளை மட்டும் பாதுகாக்கிறது.
- issue: பண்டைய வீட்டை உடைத்து நுழையும் காட்சி
  choice: தன் வீட்டை உடைத்து நுழைய
  alternative: தன் வீடு துளையிடப்பட
  rationale: முதன்மை உரையில் செயலைத் தெளிவாகவும் இயல்பாகவும் கூறி, மண் அல்லது பலவீனமான கட்டுமானப் பகுதிகளைத் தோண்டித் துளைக்கும் பண்டைய நடைமுறையை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் நேர்த்தியும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘வீட்டுத் தலைவர்’ சமூகப் பங்கைத் தெளிவாக்குகிறது; ‘காவல் வேளை’ பண்டைய காலப் பிரிவைத் தக்கவைக்கிறது. நிபந்தனை வாக்கியத்தின் நிகழாத கடந்தகால விளைவு ‘அறிந்திருந்தால் ... விட்டிருக்க மாட்டார்’ என இயல்பாக அமைக்கப்பட்டுள்ளது.
