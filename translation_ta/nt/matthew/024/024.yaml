  terminology: «பொய்யான மேசியாக்கள்» Χριστός இங்கு பட்டமாக இருப்பதைத் தக்கவைக்கிறது; மாற்று வாசகமான «பொய்யான கிறிஸ்துக்கள்» குறிப்பு முறையாக வழங்கப்பட்டுள்ளது. «பொய்த்தீர்க்கதரிசிகள்», «அடையாளங்கள்», «அற்புதங்கள்», «தேர்ந்தெடுக்கப்பட்டவர்கள்» ஆகியவை துல்லியமும் புரிந்துகொள்ளத்தக்கதுமான சொற்கள். அடிக்குறிப்பு அடையாளங்கள் உரிய சொற்களிலும் தொடர்களிலும் பொருத்தப்பட்டுள்ளன.
