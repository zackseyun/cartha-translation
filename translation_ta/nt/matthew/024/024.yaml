  source_fidelity: மூல கிரேக்கத்தின் எதிர்கால எச்சரிக்கை, ψευδόχριστοι/ψευδοπροφῆται என்ற இரட்டைப் பெயர்கள், «பெரிய அடையாளங்களும் அற்புதங்களும்», மற்றும் ὥστε πλανῆσαι εἰ δυνατὸν καὶ τοὺς ἐκλεκτούς என்ற நோக்கு/விளைவு தொடரின் திறந்த தன்மை அனைத்தும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. «முடிந்தால்» என்பது εἰ δυνατὸν என்பதற்குச் சரியான, இறையியல் முடிவைச் சேர்க்காத மொழிபெயர்ப்பு.
