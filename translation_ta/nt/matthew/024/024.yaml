id: MAT.24.24
reference: Matthew 24:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐγερθήσονται γὰρ ψευδόχριστοι καὶ ψευδοπροφῆται, καὶ δώσουσιν σημεῖα μεγάλα καὶ τέρατα ὥστε ⸀πλανῆσαι εἰ δυνατὸν καὶ τοὺς ἐκλεκτούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/024.yaml
  text: For false messiahs and false prophets will arise[a], and they will perform great signs and wonders so as to lead astray, if possible[c][b], even the elect.
translation:
  language: ta
  text: ஏனெனில் பொய்யான மேசியாக்களும்[a] பொய்த்தீர்க்கதரிசிகளும் எழும்புவார்கள்; முடிந்தால்[c], தேர்ந்தெடுக்கப்பட்டவர்களைக்கூட வழிதவறச் செய்யும்படி[b] பெரிய அடையாளங்களையும் அற்புதங்களையும் செய்வார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பொய்யான கிறிஸ்துக்கள்.’ கிரேக்கத்தில் Christos என்ற பட்டம் உள்ளது; இங்கு அது தனிப்பெயர்போல் அல்லாமல் பட்டமாகப் பயன்படுவதால் ‘மேசியாக்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘ஏமாற்றும்படி.’ இந்த வினை ஒருவரை அலைந்து திரியச் செய்வது அல்லது சரியான வழியிலிருந்து விலகச் செய்வது என்றும் பொருள்படலாம்; அதனால் ‘வழிதவறச் செய்யும்படி’ என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘முடியுமென்றிருந்தால்.’ கிரேக்கம் ‘முடிந்தால்’ என்று மட்டும் கூறி, அதன் இறையியல் உட்குறிப்பைத் தீர்மானிக்காமல் விடுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγερθήσονται
  choice: எழும்புவார்கள்
  rationale: இங்கு எதிர்காலச் செயல்பாட்டு பொருளில், ஆட்கள் தோன்றி முன்வருவதைச் சுட்டும் கிரேக்க வழக்கை இது இயல்பாக வெளிப்படுத்துகிறது; உயிர்த்தெழுதலைக் குறிக்கும் தவறான எண்ணத்தையும் ஏற்படுத்தாது.
- source_word: ψευδόχριστοι
  choice: பொய்யான மேசியாக்கள்
  rationale: Χριστός இங்கு தனிப்பெயர்போல் அல்லாமல் பட்டமாகப் பயன்படுவதால், ‘மேசியாக்கள்’ என மொழிபெயர்ப்பது யூத மேசியா எதிர்பார்ப்பின் பின்னணியையும் ψευδο- என்பதன் ‘பொய்யான’ பொருளையும் காக்கிறது.
- source_word: ψευδοπροφῆται
  choice: பொய்த்தீர்க்கதரிசிகள்
  rationale: கூட்டுப்பெயரின் இரு கூறுகளையும் நேரடியாகவும் தமிழ் வேதாகம நடையில் புரிந்துகொள்ளத்தக்க விதத்திலும் தருகிறது.
- source_word: δώσουσιν
  choice: செய்வார்கள்
  rationale: δίδωμι என்பதன் அடிப்படைப் பொருள் ‘கொடுப்பார்கள்’ என்றாலும், அடையாளங்களும் அற்புதங்களும் என்பவற்றுடன் வரும் இவ்வழக்கில் ‘செய்வார்கள்’ என்பதே இயல்பான தமிழ்.
- source_word: σημεῖα μεγάλα
  choice: பெரிய அடையாளங்கள்
  rationale: σημεῖα என்பதைக் ‘அற்புதங்கள்’ என்று ஒன்றாக்காமல், சான்றாகவோ குறிப்பாகவோ அமையும் அதன் தனிப்பொருளை ‘அடையாளங்கள்’ காக்கிறது; μεγάλα என்பது ‘பெரிய’ என நேரடியாக வழங்கப்படுகிறது.
- source_word: τέρατα
  choice: அற்புதங்கள்
  rationale: வியப்பூட்டும் நிகழ்வுகள் என்ற பொருளை இயல்பான தமிழ் வேதாகமச் சொல்லாட்சியில் தருகிறது; ‘அடையாளங்களும் அற்புதங்களும்’ என்ற இணையும் தெளிவாக உள்ளது.
- source_word: ὥστε πλανῆσαι
  choice: வழிதவறச் செய்யும்படி
  rationale: ὥστε + வினையெச்சத்தின் நோக்கம் அல்லது விளைவு என்ற இரு சாத்தியங்களையும் கடுமையாகப் பிரிக்காமல், கிரேக்கத்தின் திறந்த தன்மையைத் தமிழ் வடிவம் காக்கிறது.
- source_word: πλανῆσαι
  choice: வழிதவறச் செய்ய
  rationale: வெறும் பொய் கூறி ஏமாற்றுவது மட்டுமல்லாமல் ஒருவரைச் சரியான வழியிலிருந்து விலகச் செய்வது என்ற πλανάω வின் திசைசார் நுணுக்கத்தை வெளிப்படுத்துகிறது.
- source_word: εἰ δυνατὸν
  choice: முடிந்தால்
  rationale: கிரேக்கத்தின் சுருக்கமான நிபந்தனைத் தொடரை நேரடியாகக் காக்கிறது; ‘முடியுமென்றிருந்தால்’ போன்ற எதிர்நிகழ்வு நுணுக்கத்தைச் சேர்க்கவில்லை.
- source_word: καὶ τοὺς ἐκλεκτούς
  choice: தேர்ந்தெடுக்கப்பட்டவர்களைக்கூட
  rationale: καί இங்கு வலியுறுத்தும் ‘கூட’ என்ற பொருளில் தரப்படுகிறது; ἐκλεκτούς என்பது பொதுவான வாசகருக்குத் தெளிவாக ‘தேர்ந்தெடுக்கப்பட்டவர்கள்’ என மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: ψευδόχριστοι என்பதில் Χριστός பட்டத்தின் மொழிபெயர்ப்பு
  choice: பொய்யான மேசியாக்கள்
  alternative: பொய்யான கிறிஸ்துக்கள்
  rationale: இங்கு Χριστός ஒரு பட்டமாகச் செயல்படுவதால் ‘மேசியா’ என்பது மூலத்தின் யூதப் பின்னணியையும் பட்டத்தன்மையையும் தெளிவாகக் காக்கிறது.
- issue: தேர்ந்தெடுக்கப்பட்டவர்கள் குறித்த εἰ δυνατὸν என்பதன் வலிமை
  choice: முடிந்தால்
  alternative: முடியுமென்றிருந்தால்
  rationale: தேர்ந்தெடுக்கப்பட்டவர்கள் இறுதியில் ஏமாற்றப்பட முடியுமா என்ற இறையியல் விவாதத்தை வசனம் தானாகத் தீர்க்கவில்லை. ஆகவே கிரேக்கத்தின் நிபந்தனை வடிவம் கூர்மைப்படுத்தப்படாமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவான வாசகருக்குப் புரியும் கண்ணியமான வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. ‘மேசியாக்கள்’ பட்டத்தன்மையை காக்கிறது; ‘தேர்ந்தெடுக்கப்பட்டவர்கள்’ என்பது ‘தெரிந்துகொள்ளப்பட்டவர்கள்’ அல்லது கடினமான சமயவழக்குச் சொல்லைவிட இயல்பாக உள்ளது. அரைப்புள்ளி இரண்டு எதிர்கால வினைகளின் தொடர்பைத் தெளிவாக்குகிறது.
