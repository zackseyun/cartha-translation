source:
  edition: SBLGNT
  text: προσεύχεσθε δὲ ἵνα μὴ γένηται ἡ φυγὴ ὑμῶν χειμῶνος μηδὲ σαββάτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/020.yaml
  text: But pray that your flight may not happen in winter or on a Sabbath[a].
translation:
  language: ta
  text: ஆனால், நீங்கள் தப்பிச் செல்வது குளிர்காலத்திலோ ஓய்வுநாளிலோ[a] நிகழாதபடி ஜெபியுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த ஓய்வுநாளிலோ.”
    reason: σαββάτῳ என்பதில் சுட்டிடைச்சொல் இல்லை. இருப்பினும், சூழலில் அறியப்பட்ட ஓய்வுநாளைக் குறிக்கும் வரையறுத்த மொழிபெயர்ப்பு சாத்தியமானது; அதைப் பிரதான உரையில் திணிக்காமல் மாற்றாகக் குறிக்கிறது.
lexical_decisions:
- source_word: προσεύχεσθε
  choice: வேண்டிக்கொள்ளுங்கள்
  rationale: இது இரண்டாம் நபர் பன்மை நிகழ்காலக் கட்டளை. இச்சூழலில் ‘வேண்டிக்கொள்ளுங்கள்’ என்பது ஜெபத்தில் ஒரு குறிப்பிட்ட காரியத்தை வேண்டுவதைக் இயல்பாகத் தெரிவிக்கிறது; நிகழ்காலத்தின் தொடர்ச்சியான நுணுக்கத்தைத் தமிழ் வாக்கியத்தில் தேவையின்றி வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய எச்சரிக்கையிலிருந்து மென்மையான மாறுபாட்டையும் உரையாடல் திருப்பத்தையும் குறிக்கிறது.
- source_word: ἵνα μὴ γένηται
  choice: நிகழாதபடி
  rationale: வேண்டுதலின் உள்ளடக்கத்தைத் தெரிவிக்கும் ἵνα மற்றும் இறந்தகால வினைமுற்றுச் சாத்திய வடிவத்தின் நிகழ்வு சார்ந்த பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἡ φυγὴ ὑμῶν
  choice: நீங்கள் தப்பி ஓடுவது
  rationale: φυγή என்பது ஆபத்திலிருந்து ஓடுதலைக் குறிக்கிறது. ‘தப்பி ஓடுவது’ என்பது வெற்றிகரமாகத் தப்பித்துவிட்டதாக மிகையாக உணர்த்தாமல், நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: χειμῶνος
  choice: குளிர்காலத்தில்
  rationale: காலத்தைக் குறிக்கும் பிறப்புவேற்றுமையைத் தமிழில் இயல்பான காலவிடை வடிவில் வழங்குகிறது.
- source_word: μηδὲ σαββάτῳ
  choice: ஒரு ஓய்வுநாளில்
  rationale: μηδέ இரண்டாவது எதிர்மறைச் சூழலை இணைக்கிறது. σαββάτῳ என்பது ஓய்வுநாளைக் குறிக்கிறது; கிரேக்கத்தில் சுட்டிடைச்சொல் இல்லாத வடிவத்தை ‘ஒரு’ என்று பிரதான உரையில் பிரதிபலிக்கிறது.
theological_decisions:
- issue: σαββάτῳ என்பதை வரையறுத்த வடிவிலா அல்லது வரையறுக்காத வடிவிலா மொழிபெயர்ப்பது
  choice: ஒரு ஓய்வுநாளில்
  alternative: ஓய்வுநாளில்
  rationale: கிரேக்கச் சொல்லுக்கு சுட்டிடைச்சொல் இல்லாததால் ‘ஒரு ஓய்வுநாளில்’ என்பது அதன் வடிவத்தை நெருக்கமாகப் பிரதிபலிக்கிறது. ஆயினும், தமிழில் ‘ஓய்வுநாளில்’ என்பதும் பொதுவான அல்லது அறியப்பட்ட ஓய்வுநாளை இயல்பாகக் குறிக்கக்கூடியதால் அது அடிக்குறிப்பில் தரப்படுகிறது; எந்தக் குறிப்பிட்ட சபத்-கடைப்பிடிப்பு கோட்பாட்டையும் வசனத்தில் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தப்பியோட்டம்’ போன்ற இறுக்கமான பெயர்ச்சொல் வடிவத்துக்குப் பதிலாக ‘நீங்கள் தப்பி ஓடுவது’ என்ற இயல்பான வினைச்சொல் அமைப்பு தேர்ந்தெடுக்கப்பட்டது. அடிக்குறிப்பு குறியீடு பிரதான உரையில் இடம்பெற்றுள்ளது.
