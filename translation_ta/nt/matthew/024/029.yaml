source:
  edition: SBLGNT
  text: Εὐθέως δὲ μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων ὁ ἥλιος σκοτισθήσεται, καὶ ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς, καὶ οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ, καὶ αἱ δυνάμεις τῶν οὐρανῶν σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/029.yaml
  text: But immediately after the tribulation of those days[a], the sun will be darkened, and the moon will not give its light, and the stars will fall from heaven[b], and the powers of the heavens will be shaken.
translation:
  language: ta
  text: ஆனால் அந்த நாட்களின் துன்பத்திற்குப் பிறகு உடனே, சூரியன் இருண்டுபோகும்; சந்திரன் தன் ஒளியைக் கொடுக்காது; விண்மீன்கள் வானத்திலிருந்து[a] விழும்; வானங்களின் வல்லமைகள்[b] அசைக்கப்படும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கே ‘வானம்’ என்று மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொல் ‘பரலோகம்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘வானங்களின் வல்லமைகள்’ என்பது அண்டவெளி ஆற்றல்கள், விண்பொருட்கள் அல்லது வானுலக வல்லமைகளைக் குறிக்கலாம்; கிரேக்கச் சொற்றொடர் இவற்றில் ஒன்றை மட்டும் தெளிவாகக் குறிப்பிடவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐθέως δὲ
  choice: ஆனால் ... உடனே
  rationale: δὲ குறிக்கும் மென்மையான மாறுபாட்டை ‘ஆனால்’ வெளிப்படுத்துகிறது; Εὐθέως என்பதின் வலுவான காலப் பொருளை ‘உடனே’ இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων
  choice: அந்த நாட்களின் துன்பத்திற்குப் பிறகு
  rationale: θλῖψις என்பதன் துன்பம், நெருக்கம், உபத்திரவம் ஆகிய பொருள் பரப்பில் ‘துன்பம்’ பொதுவாசகருக்குத் தெளிவானதும் இயல்பானதும் ஆகும்; கிரேக்க உரையின் ‘அந்த நாட்களின்’ என்ற தொடர்பும் காக்கப்படுகிறது.
- source_word: ὁ ἥλιος σκοτισθήσεται
  choice: சூரியன் இருண்டுபோகும்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தின் பொருளை இயல்பான தமிழில் தருகிறது; ‘இருளாக்கப்படும்’ என்பதைவிட இது தமிழில் சரளமாக இருந்தாலும், நிகழ்வின் தீர்க்கதரிசனத் தொனி காக்கப்படுகிறது.
- source_word: ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς
  choice: சந்திரன் தன் ஒளியைக் கொடுக்காது
  rationale: மூலத்தின் ‘தன் ஒளியைக் கொடுக்காது’ என்ற உருவகத்தை நேரடியாகவும் தெளிவாகவும் காக்கிறது.
- source_word: οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ
  choice: விண்மீன்கள் வானத்திலிருந்து விழும்
  rationale: எளிய எதிர்கால வடிவத்தையும் வானியல் உருவகத்தையும் காக்கிறது. οὐρανός என்பதிலுள்ள வானம்/பரலோகம் பொருள் வாய்ப்பு அடிக்குறிப்பில் சுட்டப்படுகிறது.
- source_word: αἱ δυνάμεις τῶν οὐρανῶν
  choice: வானங்களின் வல்லமைகள்
  rationale: δύναμεις என்பதைக் குறிப்பிட்ட வானுலக உயிர்கள், இயற்கை ஆற்றல்கள் அல்லது விண்பொருட்கள் என்று முடிவுசெய்யாமல், மூலத்தின் பரந்த பொருளையும் ‘வானங்கள்’ என்ற பன்மையையும் காக்கிறது.
- source_word: σαλευθήσονται
  choice: அசைக்கப்படும்
  rationale: கிரேக்க எதிர்காலச் செயப்பாட்டு வடிவத்தையும் அதிர்ச்சி அல்லது நிலைகுலைவு என்ற பரந்த பொருளையும் காக்கிறது.
theological_decisions:
- issue: வெளிப்படுத்தல் இலக்கியப் பாணியிலுள்ள அண்டவெளி அடையாளங்களின் இயல்பு
  choice: உருவகங்களை நேரடியாகக் காத்து, அவை சொல்லர்த்தமான வானியல் நிகழ்வுகளா, தீர்க்கதரிசனக் குறியீடுகளா, அல்லது இரண்டுமா என்பதைத் தீர்மானிக்காமல் விடுதல்
  alternative: இவற்றை முற்றிலும் சொல்லர்த்தமான அண்டவெளிக் கலக்கங்களாகவோ, முற்றிலும் அரசியல் அல்லது நியாயத்தீர்ப்பைக் குறிக்கும் அடையாளங்களாகவோ வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: மூலவசனம் தீர்க்கதரிசன மற்றும் வெளிப்படுத்தல் இலக்கிய உருவகங்களைப் பயன்படுத்தினாலும் அவற்றின் துல்லியமான இயல்பை இங்கே விளக்கவில்லை; ஆகவே மொழிபெயர்ப்பு எந்த ஓர் இறுதிக்காலக் கோட்பாட்டையும் உரைக்குள் புகுத்தவில்லை.
- issue: ‘வானங்களின் வல்லமைகள்’ என்பதன் அடையாளம்
  choice: வானுலக ஆற்றல்கள், விண்பொருட்கள் அல்லது வானுலக வல்லமைகள் என்ற சாத்தியங்களைத் திறந்தவையாக வைத்தல்
  alternative: தேவதூதர்கள் அல்லது விண்பொருட்கள் என்று மட்டும் குறிப்பாக்குதல்
  rationale: கிரேக்கச் சொற்றொடர் பரந்ததும் சூழல்படி பலவாறு புரிந்துகொள்ளக்கூடியதும் ஆகும்; அந்தத் தெளிவின்மையை மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவாகப் புரியும், அதேவேளை தீர்க்கதரிசன உரைக்கு ஏற்ற கண்ணியமான தொனி பயன்படுத்தப்பட்டுள்ளது. ‘உபத்திரவம்’ போன்ற சமயக் குழு சார்ந்த அல்லது பழமையான சொற்பயன்பாட்டுக்கு மாற்றாக ‘துன்பம்’ தேர்ந்தெடுக்கப்பட்டுள்ளது. மூலத்தில் இல்லாத ‘பெரும்’ என்ற தீவிரப்படுத்தல் சேர்க்கப்படவில்லை. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறியீடுகள் இடமாறியிருந்ததால், அவை விளக்கும் சொற்றொடர்களுக்குப் பின் [a], [b] எனச் சரியாக வைக்கப்பட்டுள்ளன.
