  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ὅτι ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ καταστήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/047.yaml
  text: Truly I say to you that he will appoint him over all his possessions[a].
translation:
  language: ta
  text: 'உண்மையாக நான் உங்களுக்குச் சொல்கிறேன்: அவன் தன் உடைமைகள் அனைத்தின்மேலும் அவனைப் பொறுப்பாளனாக நியமிப்பான் என்று.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν
  choice: உண்மையாகவே
  rationale: இயேசுவின் அதிகாரப்பூர்வமான, உறுதியான அறிவிப்பை அறிமுகப்படுத்துகிறது; ஒற்றை ἀμὴν என்பதால் இரட்டிப்பு தேவையில்லை.
- source_word: λέγω ὑμῖν
  choice: நான் உங்களுக்குச் சொல்கிறேன்
  rationale: கிரேக்கச் சொற்றொடரின் நேரடித் தன்மையையும் இயேசுவின் வழக்கமான solemn formula-வின் கண்ணியத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ὅτι
  choice: ':'
  rationale: தமிழில் மேற்கோள் உள்ளடக்கத்தை இயல்பாக அறிமுகப்படுத்த முற்றுப்புள்ளி இரட்டைக் குறி பயன்படுத்தப்பட்டது; தனியாக ‘என்று’ சேர்ப்பது இவ்வாக்கிய அமைப்பில் தேவையில்லை.
- source_word: ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: தன்னுடைய உடைமைகள் அனைத்தின்மேலும்
  rationale: ἐπί உடன் வரும் பொறுப்பு வட்டத்தையும், τοῖς ὑπάρχουσιν குறிக்கும் அவருக்குச் சொந்தமான அனைத்தையும் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: καταστήσει
  choice: பொறுப்பாளனாக நியமிப்பான்
  rationale: இங்கு உடல் ரீதியாக ‘வைப்பான்’ என்பதல்ல, மேற்பார்வைப் பொறுப்புக்கு நியமிப்பதே பொருள்; ‘பொறுப்பாளனாக’ என்பது தமிழில் அந்த நிர்வாகப் பொருளைத் தெளிவாக்குகிறது.
- source_word: αὐτόν
  choice: இவனை
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட உண்மையும் விவேகமுமுள்ள பணியாளனைச் சுட்டுகிறது; கிரேக்கத்தின் ஆண்பால் ஒருமைச் சுட்டுதலைக் காக்கிறது.
theological_decisions:
- issue: எஜமானன் அளிக்கும் வெகுமதி அல்லது ஒப்படைக்கப்படும் பொறுப்பின் இயல்பு
  choice: உவமையின் நேரடிப் பொருளின்படி, எஜமானனுடைய உடைமைகள் அனைத்தின்மேலும் விரிவான பொறுப்புக்கு நியமித்தல்
  alternative: திருச்சபை அதிகாரத்தையோ இறுதிக்கால விண்ணக வெகுமதியையோ நேரடியாகக் குறிக்கும் உருவகமாக மொழிபெயர்த்தல்
  rationale: வசனம் உவமையின் உள்ளமைப்பில் பணியாளனுக்குக் கூடுதல் பொறுப்பு வழங்கப்படுவதை மட்டுமே நேரடியாகக் கூறுகிறது; அதற்கு அப்பாற்பட்ட திருச்சபை அல்லது இறுதிக்கால விளக்கங்களை மொழிபெயர்ப்பில் புகுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. ‘உடைமைகள்’ என்பதுடன் ‘பொறுப்பாளனாக நியமிப்பான்’ சேர்ந்து, உரையின் நிர்வாகப் பொறுப்பு சார்ந்த பொருளை அளவுக்கு மீறிய இறையியல் விளக்கமின்றி தெரிவிக்கிறது.
