id: MAT.24.36
reference: Matthew 24:36
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Περὶ δὲ τῆς ἡμέρας ἐκείνης καὶ ὥρας οὐδεὶς οἶδεν, οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν ⸂οὐδὲ ὁ υἱός⸃, εἰ μὴ ὁ ⸀πατὴρ μόνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/036.yaml
  text: But concerning that day and hour[a], no one knows—not even the angels of heaven, nor the Son—except the Father alone.
translation:
  language: ta
  text: ஆனால், அந்த நாளையும் வேளையையும் குறித்து யாருக்கும் தெரியாது—பரலோகத் தூதர்களுக்குக்கூடத் தெரியாது; மகனுக்குக்கூடத் தெரியாது[a]. தந்தை மட்டுமே அறிவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் ‘மகனுக்குக்கூடத் தெரியாது’ என்ற சொற்கள் இல்லை. முதன்மை உரை SBLGNT வாசகத்தைப் பின்பற்றுகிறது.
    reason: textual_variant
lexical_decisions:
- source_word: Περὶ δὲ
  choice: ஆனால், ... பற்றி
  rationale: περί உடன் வரும் தலைப்புமாற்றத்தை ‘பற்றி’ தெரிவிக்கிறது; δέ-யின் மென்மையான மாறுபாட்டு அல்லது இடைமாற்றச் சாயலை ‘ஆனால்’ காக்கிறது.
- source_word: τῆς ἡμέρας ἐκείνης καὶ ὥρας
  choice: அந்த நாளையும் நேரத்தையும்
  rationale: ஒரே சுட்டுப்பெயர் இணைக்கப்பட்ட ‘நாள், நேரம்’ இரண்டையும் ஒரு குறிப்பிட்ட காலக்குறிப்பாகச் சுட்டுகிறது; தமிழில் இயல்பாக இரண்டாம் வேற்றுமையுடன் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: οὐδεὶς οἶδεν
  choice: யாருக்கும் தெரியாது
  rationale: οὐδείς-ன் முழுமையான மறுப்பையும், நிகழ்காலப் பொருளில் உள்ள οἶδα-வின் ‘அறிதல்’ பொருளையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν
  choice: பரலோகத் தூதர்களுக்குக்கூடத் தெரியாது
  rationale: οὐδέ-யின் வலியுறுத்தலை ‘கூட’ காக்கிறது; τῶν οὐρανῶν என்பதைச் சொற்சொல்லாக அசட்டையாகத் தராமல், இயல்பான தமிழ் வழக்கில் ‘பரலோகத்’ எனக் கொடுக்கிறது.
- source_word: οὐδὲ ὁ υἱός
  choice: மகனுக்கும் தெரியாது
  rationale: முந்தைய மறுப்புடன் இணையும் οὐδέ-யை ‘-க்கும்’ காட்டுகிறது. ὁ υἱός சூழலில் அறியப்பட்ட பட்டமாக இருப்பதால் ‘மகன்’ என்று தனியாக வைக்கப்பட்டுள்ளது; அதன் கூற்றை மென்மைப்படுத்தவில்லை.
- source_word: εἰ μὴ ὁ πατὴρ μόνος
  choice: தந்தை ஒருவருக்கு மட்டுமே தெரியும்
  rationale: மறுப்புக்குப் பின் εἰ μή விலக்கைக் குறிக்கிறது; μόνος அறிவு தந்தைக்கு மட்டுமே உரியது என்பதை வலியுறுத்துகிறது. தமிழில் இயல்பாக இருக்க ‘தெரியும்’ மீண்டும் சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘மகனுக்கும் தெரியாது’ என்பதன் கிறிஸ்தியல் உட்பொருள்
  choice: ‘மகனுக்கும் தெரியாது’ என்ற முழுச் சொற்றொடரை முதன்மை உரையில் எந்த மென்மைப்படுத்தலும் விளக்க விரிவாக்கமும் இன்றி வைத்தல்.
  alternative: சில கையெழுத்துப் பிரதிகளின் வாசகத்தைப் பின்பற்றி இச்சொற்றொடரை விடுதல், அல்லது இறைமகனின் தெய்வீகத்துடனான பதற்றத்தைக் குறைக்கும் வகையில் பொருளுரைத்தல்.
  rationale: SBLGNT உரையில் οὐδὲ ὁ υἱός இடம்பெறுகிறது. மொழிபெயர்ப்பு உரையிலுள்ள இறையியல் பதற்றத்தைத் தீர்க்காமல் அப்படியே காக்க வேண்டும்; கோட்பாட்டு ஒருங்கிணைப்பு மொழிபெயர்ப்பின் பணியல்ல.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் dignified நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பரலோகத் தூதர்கள்’, ‘மகன்’, ‘தந்தை’ ஆகியவை வேதாகமச் சூழலுக்கு ஏற்ற, ஆனால் மிகப் பழமையானதல்லாத சொற்களாகத் தேர்ந்தெடுக்கப்பட்டுள்ளன. நீண்ட எதிர்மறைத் தொடரின் படிநிலைகளைத் தெளிவாக்க நீள்கோடும் அரைப்புள்ளியும் பயன்படுத்தப்பட்டுள்ளன.
