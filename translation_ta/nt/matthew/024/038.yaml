source:
  edition: SBLGNT
  text: ⸀ὡς γὰρ ἦσαν ἐν ταῖς ⸀ἡμέραις ταῖς πρὸ τοῦ κατακλυσμοῦ τρώγοντες καὶ πίνοντες, γαμοῦντες καὶ ⸀γαμίζοντες, ἄχρι ἧς ἡμέρας εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/038.yaml
  text: For as in the days before the flood they were eating and drinking[a], marrying and giving in marriage, until the day Noah entered the ark,
translation:
  language: ta
  text: ஏனெனில், பெருவெள்ளத்திற்கு முந்தைய நாட்களில், நோவா பேழைக்குள் நுழைந்த நாள்வரை, அவர்கள் சாப்பிட்டுக்கொண்டும் குடித்துக்கொண்டும், திருமணம் செய்துகொண்டும் திருமணம் செய்து கொடுத்துக்கொண்டும்[a] இருந்ததுபோல,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திருமணம் செய்துகொண்டும் திருமணம் செய்து கொடுக்கப்பட்டுக்கொண்டும்.” கிரேக்கத்தில் γαμοῦντες, γαμίζοντες என்ற இரு வேறு சொற்கள் உள்ளன; இரண்டாவது சொல் ஒருவரைத் திருமணம் செய்து கொடுப்பதையோ, ஒருவர் திருமணம் செய்து கொடுக்கப்படுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς γὰρ
  choice: ஏனெனில் … இருந்ததுபோல
  rationale: γάρ என்பதன் விளக்கத் தொடர்பையும் ὡς என்பதன் ஒப்பீட்டுப் பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; அடுத்த வசனத்தில் நிறைவடையும் ஒப்பீட்டையும் திறந்த நிலையில் வைக்கிறது.
- source_word: ἐν ταῖς ἡμέραις ταῖς πρὸ τοῦ κατακλυσμοῦ
  choice: பெருவெள்ளத்திற்கு முந்தைய நாட்களில்
  rationale: காலத்தைக் குறிக்கும் தொடரைத் தெளிவாக மொழிபெயர்க்கிறது; நோவாவின் நிகழ்வுடன் தொடர்புடைய κατακλυσμός என்பதற்கு ‘பெருவெள்ளம்’ இயல்பான, பரவலாகப் புரியக்கூடிய சொல்.
- source_word: τρώγοντες καὶ πίνοντες
  choice: சாப்பிட்டுக்கொண்டும் குடித்துக்கொண்டும்
  rationale: தொடர்ந்து நடந்துவந்த இயல்பான செயல்களைப் புலப்படுத்துகிறது; மூலத்தில் இல்லாத ஒழுக்கக்கேடு அல்லது அளவுமீறல் என்ற கருத்தைச் சேர்க்கவில்லை.
- source_word: γαμοῦντες
  choice: திருமணம் செய்துகொண்டும்
  rationale: γαμέω என்பதன் ‘திருமணம் செய்தல்’ என்ற பொதுவான பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: γαμίζοντες
  choice: திருமணம் செய்து கொடுத்துக்கொண்டும்
  rationale: முந்தைய γαμοῦντες என்பதிலிருந்து உள்ள சொற்பொருள் வேறுபாட்டைக் காத்து, ஒருவரைத் திருமணம் செய்து கொடுக்கும் செயலைக் குறிக்கிறது.
- source_word: ἄχρι ἧς ἡμέρας
  choice: நாள்வரை
  rationale: தொடர்ந்த செயல்கள் முடிவுறும் கால எல்லையைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν
  choice: நோவா பேழைக்குள் நுழைந்த
  rationale: εἰσῆλθεν குறிக்கும் தீர்மானமான நுழைவைத் துல்லியமாகக் காட்டுகிறது; நோவா வரலாற்றில் κιβωτός என்பதற்கான மரபான தமிழ் இணையாக ‘பேழை’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: பட்டியலிடப்பட்ட செயல்கள் பாவமான அளவுமீறல்களா, அல்லது நியாயத்தீர்ப்பை அறியாமல் தொடர்ந்த இயல்பு வாழ்க்கையா?
  choice: இயல்பான மனிதச் செயல்களாக நடுநிலையாக மொழிபெயர்க்கப்பட்டது.
  alternative: இன்பத்தில் மூழ்குதல் அல்லது ஒழுக்கக் கவனக்குறைவு என்ற தொனியைச் சேர்த்தல்.
  rationale: கிரேக்கப் பங்கேற்பு வினைச்சொற்கள் உண்பது, குடிப்பது, திருமணம் செய்வது போன்ற பொதுவான செயல்களையே குறிப்பிடுகின்றன; அவற்றைத் தாமாகவே பாவம் என்று குறிக்கும் அடைமொழி இல்லை. சூழலில் வலியுறுத்தப்படுவது திடீர் நியாயத்தீர்ப்புக்கு முன் இயல்பு வாழ்க்கை தொடர்ந்து நடந்ததே.
- issue: γαμίζοντες என்பது ‘திருமணம் செய்து கொடுத்தல்’ அல்லது ‘திருமணம் செய்து கொடுக்கப்படுதல்’ என எதைக் குறிக்கிறது?
  choice: முதன்மை உரையில் ‘திருமணம் செய்து கொடுத்தல்’ என வைக்கப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டது.
  alternative: ‘திருமணம் செய்து கொடுக்கப்பட்டுக்கொண்டும்’ என்று முதன்மை உரையில் மொழிபெயர்த்தல்.
  rationale: செயப்படுபொருள் குன்றா செயப்பாட்டு உணர்வுள்ள வடிவத்துக்கு ‘திருமணம் செய்து கொடுத்தல்’ நேரடியான இணை; இருந்தாலும் சூழலில் காணப்படும் மாற்றுப் புரிதலை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க தொனியிலும் அமைக்கப்பட்டது. வசனம் அடுத்த வசனத்தில் தொடரும் ஒப்பீட்டின் முதல் பகுதியாக இருப்பதால், ‘இருந்ததுபோல,’ என்று திறந்த நிறுத்தத்துடன் முடிகிறது.
