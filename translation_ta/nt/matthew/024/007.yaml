id: MAT.24.7
reference: Matthew 24:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐγερθήσεται γὰρ ἔθνος ἐπὶ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν, καὶ ἔσονται ⸀λιμοὶ καὶ σεισμοὶ κατὰ τόπους·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/007.yaml
  text: For nation will rise against nation[a], and kingdom against kingdom[b], and there will be famines and earthquakes in various places.
translation:
  language: ta
  text: ஏனெனில், தேசம் தேசத்திற்கு எதிராகவும், ராஜ்யம் ராஜ்யத்திற்கு எதிராகவும் எழும்பும்[a]; பல்வேறு இடங்களில்[b] பஞ்சங்களும் நிலநடுக்கங்களும் உண்டாகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேசம் தேசத்திற்கு எதிராகக் கிளர்ந்தெழும்.” கிரேக்கச் சொற்றொடர் மக்களிடையே பகைமை வெடிப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வெவ்வேறு இடங்களில்” அல்லது “இடத்திற்கு இடம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσεται
  choice: எழும்பும்
  rationale: எதிர்ப்புடன் செயல்படத் தொடங்குதல் அல்லது பகைமை வெடித்தெழுதல் என்ற இந்தச் சொற்றொடரின் பொருளை இயல்பாகத் தருகிறது; வெளிப்படையாகக் கூறப்படாத தெய்வீகச் செயற்பாட்டைச் சேர்ப்பதில்லை.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத் தொடர்பைத் தெளிவாகக் காக்கிறது.
- source_word: ἔθνος
  choice: தேசம்
  rationale: அரசியல் அல்லது இன அடையாளமுள்ள பெரிய மக்கள் குழுவைக் குறிக்கிறது; இணையாக வரும் ‘அரசாட்சி’ என்பதுடன் பொருந்துகிறது.
- source_word: ἐπὶ ἔθνος
  choice: தேசத்திற்கு எதிராகத் தேசம்
  rationale: ἐπί + வேற்றுமை உருபு இங்குப் பகைமை அல்லது மோதலைக் குறிக்கும்; ‘எதிராக’ என்பது தமிழில் தெளிவான இணை.
- source_word: βασιλεία
  choice: அரசாட்சி
  rationale: இங்கு அரசரின் ஆட்சிக்குட்பட்ட அரசியல் அமைப்பு அல்லது ஆட்சிப்பரப்பைக் குறிக்கிறது. ‘அரசாட்சி’ என்பது ‘தேசம்’ என்பதிலிருந்து வேறுபாட்டையும் அரசியல் பொருளையும் காக்கிறது.
- source_word: ἔσονται
  choice: உண்டாகும்
  rationale: நிகழ்வுகள் ஏற்படும் என்ற இருப்பியல் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: λιμοὶ
  choice: பஞ்சங்கள்
  rationale: கடுமையான உணவுப் பற்றாக்குறைகளைக் குறிக்கும் பன்மையைப் பாதுகாக்கிறது.
- source_word: σεισμοὶ
  choice: நிலநடுக்கங்கள்
  rationale: இச்சூழலில் σεισμός என்பதன் நேரடியான, தெளிவான பொருள்.
- source_word: κατὰ τόπους
  choice: பல்வேறு இடங்களில்
  rationale: ஒரே இடத்தை அல்லாமல் பல இடங்களில் பகிர்ந்து நிகழ்வதைச் சுட்டும் சொற்றொடரின் பொருளை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: இறுதிக்கால மோதல் கூற்றில் ἔθνος என்பதன் வரம்பு
  choice: தேசம்
  alternative: மக்கள் இனம்
  rationale: ‘அரசாட்சிக்கு எதிராக அரசாட்சி’ என்ற இணை அமைப்பு பெரிய அளவிலான சமூக-அரசியல் மோதலைச் சுட்டுகிறது. ‘தேசம்’ என்பது குறிப்பாகப் புறவினத்தார் என்ற பொருளையோ குறுகிய இனப் பொருளையோ திணிக்காமல் இந்த வரம்பைக் காக்கிறது.
- issue: ἐγερθήσεται என்ற எதிர்காலச் செயப்பாட்டு/இடைநிலை வடிவத்தின் வலிமை
  choice: எதிராக எழும்பும்
  alternative: எதிராக எழுப்பப்படும்
  rationale: இச்சொற்றொடர் மோதல் வெடிப்பதை விவரிக்கிறது. செய்பவர் தேவன் என்று மூலவசனம் வெளிப்படையாகக் கூறாததால், ‘எழுப்பப்படும்’ என்று மொழிபெயர்த்து தெய்வீகச் செயற்பாட்டைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. மூலத்தின் இணை அமைப்பைப் பாதுகாக்க ‘தேசம்’ மற்றும் ‘அரசாட்சி’ தனித்தனியாக வைக்கப்பட்டுள்ளன. [b] குறிப்பு பொருளுக்கேற்ப ‘பல்வேறு இடங்களில்’ என்பதற்குப் பின் இடப்பட்டுள்ளது.
