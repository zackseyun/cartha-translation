- from: 'அதற்கு அவர் அவர்களிடம், “இவை அனைத்தையும் நீங்கள் பார்க்கவில்லையா? உண்மையாகவே உங்களுக்குச் சொல்கிறேன்: இங்கே ஒரு கல்லின்மேல் மற்றொரு கல் விடப்படவே மாட்டாது; ஒவ்வொன்றும் இடித்துத் தள்ளப்படும்.[a]” என்றார்.'
