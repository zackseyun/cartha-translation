source:
  edition: SBLGNT
  text: ὁ δὲ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Οὐ βλέπετε ⸂ταῦτα πάντα⸃; ἀμὴν λέγω ὑμῖν, οὐ μὴ ἀφεθῇ ὧδε λίθος ἐπὶ λίθον ὃς οὐ καταλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/002.yaml
  text: But he answered and said to them[a], “Do you not see all these things? Truly I tell you, not one stone here will be left upon another that will not be thrown down.”
translation:
  language: ta
  text: 'அவர் அவர்களுக்குப் பதிலளித்து, “இவை அனைத்தையும் நீங்கள் பார்க்கவில்லையா? உண்மையாகவே உங்களுக்குச் சொல்கிறேன்: இங்கே ஒரு கல்லின் மேல் இன்னொரு கல் கூட விடப்படாது; அனைத்தும் இடித்துத் தள்ளப்படும்.[a]” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அழிக்கப்படும்.” கிரேக்க வினைச்சொல் ஒரு கட்டமைப்பைப் பிரித்தகற்றுவதையோ இடித்தழிப்பதையோ குறிக்கலாம்; “இடித்துத் தள்ளப்படும்” என்பது கற்கள் தங்கள் இடத்திலிருந்து வீழ்த்தப்படும் படிமத்தைக் காக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: அதற்கு அவர் அவர்களிடம் ... என்றார்
  rationale: பங்கேற்புவினையும் முற்றுவினையும் கொண்ட இந்த கிரேக்க மரபுத்தொடரைச் சொற்சொல்லாக இரட்டிப்பாக்காமல், ‘அதற்கு’ என்பதன் மூலம் மறுமொழியின் இயல்பையும் ‘என்றார்’ என்பதன் மூலம் பேச்சுச் செயலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: Οὐ βλέπετε
  choice: நீங்கள் பார்க்கவில்லையா?
  rationale: ஒப்புதலை எதிர்பார்க்கும் எதிர்மறை வினாவையும், இச்சூழலில் உள்ள நேரடியான பார்வை என்ற பொருளையும் காக்கிறது.
- source_word: ταῦτα πάντα
  choice: இவை அனைத்தையும்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட ஆலயக் கட்டடங்கள் அனைத்தையும் சுட்டும் பன்மை அமைப்பை வெளிப்படையாகக் காக்கிறது.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: உண்மையாகவே உங்களுக்குச் சொல்கிறேன்
  rationale: இயேசுவின் உறுதியான, ஆணித்தரமான அறிமுகச் சூத்திரத்தை நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: οὐ μὴ ἀφεθῇ
  choice: விடப்படவே மாட்டாது
  rationale: οὐ μή அமைப்பின் வலியுறுத்தப்பட்ட மறுப்பை ‘-வே மாட்டாது’ என்ற இயல்பான தமிழ் வடிவில் தெரிவிக்கிறது.
- source_word: ὧδε
  choice: இங்கே
  rationale: உடனிருக்கும் ஆலயப் பகுதியைக் குறிக்கும் இடவினையுரிச்சொல்லை நேரடியாக வழங்குகிறது.
- source_word: λίθος ἐπὶ λίθον
  choice: ஒரு கல்லின்மேல் மற்றொரு கல்
  rationale: முழுமையான தகர்ப்பை உணர்த்தும் கிரேக்கச் சொல்லோவியத்தை இயல்பான தமிழில் தெளிவுபடுத்துகிறது.
- source_word: καταλυθήσεται
  choice: இடித்துத் தள்ளப்படும்
  rationale: கட்டடம் அகற்றப்படுதல் அல்லது தகர்க்கப்படுதல் என்ற பொருளையும், கற்கள் தங்கள் இடத்திலிருந்து வீழ்த்தப்படும் உயிரோட்டமான படிமத்தையும் காக்கிறது.
theological_decisions:
- issue: ஆலயத்தைப் பற்றிய இயேசுவின் முன்னறிவிப்பின் எல்லையும் வலிமையும்
  choice: ஆலயக் கட்டமைப்பு முழுமையாக இடிக்கப்படும் என்ற நேரடியான முன்னறிவிப்பாக மொழிபெயர்க்கப்பட்டது.
  alternative: இதனை முதன்மையாக நியாயத்தீர்ப்பின் அடையாளச் சொல்லாகவோ, குறிப்பிட்ட ஒரு பிற்கால இறுதிக்காலக் கோட்பாட்டோடு இணைத்தோ மொழிபெயர்த்தல்.
  rationale: கற்கள் ஒன்றின்மேல் ஒன்று விடப்படாமலும் இடித்துத் தள்ளப்படுவதுமாகிய மொழி நேரடியான கட்டடப் படிமத்தைக் கொண்டுள்ளது. வசனம் கூறாத இறுதிக்காலக் கோட்பாட்டு விளக்கத்தை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கொண்டுள்ளது. ‘உண்மையாகவே’ மற்றும் ‘விடப்படவே மாட்டாது’ ஆகியவை மூலத்தின் ஆணித்தரமான தொனியை மிகைப்படுத்தாமல் காக்கின்றன.
