review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the rhetorical question, solemn assurance, emphatic prediction, and architectural demolition. However, its opening reduces ἀποκριθεὶς εἶπεν ('answered and said') to merely 'said,' and the final 'ஒவ்வொன்றும்' is less precise than the Greek relative clause, which states that no stone will remain in place without being demolished.
  naturalness: The Tamil is generally clear and modern. Recasting the final clause as a direct statement that no stone will remain and that all will be thrown down is more idiomatic and avoids an unclear antecedent for 'ஒவ்வொன்றும்.'
  terminology: ‘உண்மையாகவே உங்களுக்குச் சொல்கிறேன்,’ ‘ஒரு கல்லின் மேல் இன்னொரு கல்,’ and ‘இடித்துத் தள்ளப்படும்’ are suitable modern-standard Tamil renderings. ‘பதிலளித்து’ restores the reply sense without undue literalism.
  issues:
  - severity: medium
    issue: The reply formula is incompletely represented.
    rationale: ἀποκριθεὶς εἶπεν explicitly presents Jesus as replying. ‘அதற்கு ... என்றார்’ suggests connection to preceding speech but does not clearly express that he answered them.
  - severity: medium
    issue: ‘ஒவ்வொன்றும் இடித்துத் தள்ளப்படும்’ has an unclear referent and does not closely reflect the relative construction.
    rationale: The Greek means that no stone will remain upon another stone without being demolished. A formulation with ‘ஒன்றுகூட ... விடப்படாது; அனைத்தும் ...’ clearly retains both totality and demolition.
