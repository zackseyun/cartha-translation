source:
  edition: SBLGNT
  text: καὶ τότε σκανδαλισθήσονται πολλοὶ καὶ ἀλλήλους παραδώσουσιν καὶ μισήσουσιν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/010.yaml
  text: And then many will fall away[b][a], and they will betray one another and hate one another.
translation:
  language: ta
  text: அப்போது பலர் விலகிப்போவார்கள்[a]; ஒருவரையொருவர் காட்டிக்கொடுப்பார்கள்[b], ஒருவரையொருவர் வெறுப்பார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இடறச் செய்யப்படுவார்கள்” அல்லது “மனம் புண்படுவார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஒருவரையொருவர் ஒப்படைப்பார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: இயேசுவின் உரையில் நிகழ்வுகளின் தொடர்ச்சியைக் குறிக்கும் கால வினையடை; நவீன தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: σκανδαλισθήσονται
  choice: நிலைதடுமாறி விலகிப்போவார்கள்
  rationale: துன்புறுத்தலின் அழுத்தத்தால் பலர் உள்ளார்ந்த நிலைத்தன்மையை இழந்து பின்வாங்குவதை இச்சூழலில் குறிக்கிறது. கிரேக்கச் சொல்லின் ‘இடறுதல்’ உருவகத்தையும் தீவிரமான விலகலையும் இந்தச் சொற்றொடர் இயல்பான தமிழில் வெளிப்படுத்துகிறது; விலகலின் பொருளை வெளிப்படையாகச் சேர்த்து மிகை விளக்கம் அளிக்கவில்லை.
- source_word: πολλοὶ
  choice: பலர்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட அளவுச் சொல்லை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: ἀλλήλους
  choice: ஒருவரையொருவர்
  rationale: செயல் பரஸ்பரம் நிகழ்வதைத் தெளிவாகக் காட்டுகிறது; இரண்டு இடங்களிலும் மீளவரும் கிரேக்கச் சொல்லின் ஒத்திசைவையும் காக்கிறது.
- source_word: παραδώσουσιν
  choice: காட்டிக்கொடுப்பார்கள்
  rationale: அடக்குமுறைக்கு மற்றவர்களைத் துரோகமாக ஒப்படைக்கும் சூழல்சார் பொருளை நவீன தமிழில் இயல்பாகக் காட்டுகிறது; ‘ஒப்புக்கொடுப்பார்கள்’ என்ற நேரடியான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: μισήσουσιν
  choice: வெறுப்பார்கள்
  rationale: செயல்மிக்க பகைமையைக் குறிக்கும் வினையை நேரடியாக வழங்குகிறது.
- source_word: καὶ τότε ... καὶ ... καὶ ...
  choice: அப்போது ...; ...,...
  rationale: தமிழின் இயல்பான வாக்கிய ஓட்டத்திற்கேற்ப இணைப்புகளைச் சுருக்கினாலும், மூன்று நிகழ்வுகளின் தொடர்ச்சியான தீவிர முன்னேற்றத்தை அரைப்புள்ளி மற்றும் காற்புள்ளி மூலம் காக்கிறது.
theological_decisions:
- issue: இறுதிக்காலத் துன்புறுத்தல் சூழலில் σκανδαλισθήσονται என்பதன் பொருள்
  choice: நிலைதடுமாறி விலகிப்போவார்கள்
  alternative: இடறச் செய்யப்படுவார்கள்; மனத்தடை அடைவார்கள்
  rationale: வசனம் நிலைகுலைதல், துரோகம், வெறுப்பு என்ற தீவிரமடையும் தொடரை விவரிக்கிறது. தேர்ந்த மொழிபெயர்ப்பு வெறும் மனவருத்தத்தைவிட ஆழமான விலகலைக் காட்டுகிறது; அதேவேளையில் ஒரு குறிப்பிட்ட விசுவாசத் துறப்பு கோட்பாட்டை உரைக்குள் திணிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நிலைதடுமாறி விலகிப்போவார்கள்’ என்பது உருவகமும் சூழல்சார் தீவிரமும் இடையே சமநிலை பேணுகிறது; ‘காட்டிக்கொடுப்பார்கள்’ என்பது துரோகத்துடன் அதிகாரிகளிடம் ஒப்படைப்பதைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்.
