id: MAT.24.28
reference: Matthew 24:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀ὅπου ἐὰν ᾖ τὸ πτῶμα, ἐκεῖ συναχθήσονται οἱ ἀετοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/028.yaml
  text: Wherever the corpse is[a], there the vultures will gather.
translation:
  language: ta
  text: பிணம் எங்கே இருக்கிறதோ, அங்கே பிணந்தின்னிக் கழுகுகள்[a] கூடிவரும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கழுகுகள்.’ கிரேக்கச் சொல் கழுகுகளைக் குறிக்கலாம்; ஆனால் பிணத்தைச் சுற்றிப் பறவைகள் கூடும் இக்காட்சிக்கு ‘பிணந்தின்னிக் கழுகுகள்’ என்பது நன்றாகப் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν ᾖ
  choice: எங்கே இருக்கிறதோ
  rationale: ὅπου + ἐάν + subjunctive ஆகியவை தரும் இடம் குறித்த வரையறையற்ற பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: πτῶμα
  choice: பிணம்
  rationale: விழுந்து கிடக்கும் இறந்த உடலைக் குறிக்கும் கிரேக்கச் சொல்லுக்கு ‘பிணம்’ துல்லியமானதும் சுருக்கமானதும் இயல்பானதுமான தமிழ் இணை.
- source_word: συναχθήσονται
  choice: கூடிவரும்
  rationale: எதிர்காலச் செயலையும் பறவைகள் ஓரிடத்தில் திரள்வதையும் இயல்பாகக் காட்டுகிறது; கிரேக்கத்தின் passive வடிவத்தைத் தமிழில் செயற்கையாகப் பிரதிபலிக்காமல் அதன் பொருளைப் பாதுகாக்கிறது.
- source_word: ἀετοί
  choice: பிணந்தின்னிக் கழுகுகள்
  rationale: ἀετός பொதுவாகக் கழுகைக் குறிக்கலாம்; ஆனால் பிணத்தைச் சுற்றிக் கூடும் பறவைகள் என்ற இச்சூழலில் carrion-eating vultures என்பதே உருவகத்திற்கு மிகப் பொருத்தம். ‘பிணந்தின்னிக் கழுகுகள்’ என்பது சாதாரண வாசகருக்குத் தெளிவாக உள்ளது.
theological_decisions:
- issue: பழமொழி போன்ற உருவகத்தின் இறுதிக்காலப் பொருள்
  choice: பிணமும் அதைச் சுற்றிக் கூடும் பறவைகளும் ஆகிய உருவகத்தை நேரடியாக மொழிபெயர்த்து, அவை எதைக் குறிக்கின்றன என்பதைத் தீர்மானிக்காமல் விடுதல்
  alternative: தவிர்க்க முடியாத நியாயத்தீர்ப்பு, மனுஷகுமாரனின் வருகையின் வெளிப்படைத் தன்மை, எருசலேமின் அழிவு, அல்லது ரோமப் படைக் கொடிகள் ஆகியவற்றில் ஒன்றாக விளக்குதல்
  rationale: கிரேக்க வசனம் பிணமும் பறவைகளும் குறிப்பாக எதைக் குறிக்கின்றன என்று சொல்லவில்லை. ஆகவே எந்த ஒரு இறுதிக்கால விளக்கத்தையும் மொழிபெயர்ப்புக்குள் சேர்க்காமல் அதன் திட்டமிட்ட திறந்த தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘எங்கே இருக்கிறதோ, அங்கே’ என்ற இணைப்பு மூலத்தின் பழமொழித் தன்மையையும் வரையறையற்ற இடப்பொருளையும் காக்கிறது. அடிக்குறிப்பு குறியீடு மாற்றுச் சொல்லுக்குப் பின்பே இடப்பட்டுள்ளது.
