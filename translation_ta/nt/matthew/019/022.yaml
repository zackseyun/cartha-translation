    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: கேட்டபோது
  rationale: இறந்தகாலப் பங்கேற்புவினையை இயல்பான தமிழில் காலத்தைக் காட்டும் வினையெச்சத் தொடராக அளித்து, கேட்டதைத் தொடர்ந்து அவன் சென்ற நிகழ்வுவரிசையைப் பாதுகாக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய இயேசுவின் கூற்றுக்கும் இளைஞனின் எதிர்மறையான எதிர்வினைக்கும் இடையிலான மென்மையான முரண்பாட்டைக் காட்டுகிறது.
- source_word: νεανίσκος
  choice: இளைஞன்
  rationale: இச்சொல் இளைஞனை மட்டுமே குறிக்கிறது; இணை நற்செய்திக் குறிப்பிலிருந்து “தலைவன்” என்பதைச் சேர்க்கவில்லை.
- source_word: τὸν λόγον
  choice: இந்தச் சொல்
  rationale: இங்கு λόγος என்பது இயேசு இதற்கு முன் கூறிய கூற்றைக் குறிக்கிறது. “இந்தக் கூற்று” என்பதும் சாத்தியமான இயல்பான மாற்று.
- source_word: ἀπῆλθεν
  choice: சென்றுவிட்டான்
  rationale: அவன் அங்கிருந்து அகன்று சென்றதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: λυπούμενος
  choice: துக்கத்துடன்
  rationale: அவன் செல்லும்போது தொடர்ந்திருந்த துக்கநிலையை உடனிகழ்ச்சியாகத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἦν γὰρ ἔχων
  choice: ஏனெனில் அவனுக்கு ... இருந்தன
  rationale: தொடர்ந்து நிலவிய உடைமைநிலையைத் தமிழின் இயல்பான உடைமைத் தொடரால் அளிக்கிறது.
- source_word: κτήματα πολλά
  choice: ஏராளமான உடைமைகள்
  rationale: κτήματα என்பதன் உடைமைகள்/சொத்துகள் என்ற பொருளையும் πολλά வலியுறுத்தும் எண்ணிக்கை மிகுதியையும் பாதுகாக்கிறது.
theological_decisions:
- issue: இணை நற்செய்திக் குறிப்பிலிருந்து “தலைவன்” என்ற அடையாளத்தைச் சேர்ப்பதா
  choice: νεανίσκος என்பதை “இளைஞன்” என்று மட்டும் மொழிபெயர்த்தல்
  alternative: இளம் தலைவன்
  rationale: மத்தேயுவின் இவ்வசனக் கிரேக்கம் அவனை இளைஞன் என்று மட்டுமே குறிப்பிடுகிறது. “தலைவன்” என்று சேர்ப்பது லூக்காவின் விவரத்தை மத்தேயுவுக்குள் கொண்டுவருவதாகிவிடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டது. “இளைஞன்,” “துக்கத்துடன்,” “உடைமைகள்” ஆகியவை இயல்பான சொற்களாகத் தேர்ந்தெடுக்கப்பட்டுள்ளன; மூலத்தில் இல்லாத “தலைவன்” போன்ற விவரம் சேர்க்கப்படவில்லை.
