  text: But when the young man heard this word[a], he went away grieving[c][b], for he had many possessions.
translation:
  language: ta
  text: 'ஆனால் அந்த இளைஞன் இந்தச் சொல்லைக்[a] கேட்டபோது, துக்கத்துடன்[b] சென்றுவிட்டான்; ஏனெனில் அவனுக்கு பல உடைமைகள்[c] இருந்தன.


    [a] “இந்தக் கூற்றை” என்றும் மொழிபெயர்க்கலாம். இங்கு “சொல்” என்பது இயேசு இதற்கு முன் கூறியதைக் குறிக்கிறது.


    [b] “துக்கமடைந்தவனாய்” என்றும் மொழிபெயர்க்கலாம். அவன் சென்றபோது இருந்த துக்கநிலையை கிரேக்கப் பங்கேற்புவினை குறிப்பிடுகிறது.


    [c] பாரம்பரியமாக, “மிகுந்த உடைமைகள்” என்றும் மொழிபெயர்க்கப்படுகிறது. கிரேக்கத்தில் நேரடியாக, “பல உடைமைகள்” என உள்ளது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இந்தக் கூற்றை” என்றும் மொழிபெயர்க்கலாம். இங்கு “சொல்” என்பது இயேசு இதற்கு முன் கூறியதைக் குறிக்கிறது.
