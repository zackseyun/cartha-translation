source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ⸀ὅτι ὃς ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ μὴ ἐπὶ πορνείᾳ καὶ γαμήσῃ ἄλλην μοιχᾶται ⸂καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/009.yaml
  text: But I tell you that whoever divorces his wife[a], except for sexual immorality, and marries another, commits adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: ta
  text: 'ஆனால் நான் உங்களுக்குச் சொல்கிறேன்: பாலியல் ஒழுக்கக்கேடு காரணமாக அல்லாமல்[a] தன் மனைவியை விவாகரத்து செய்துவிட்டு வேறொரு பெண்ணை மணந்துகொள்கிற எவனும் விபசாரம் செய்கிறான்; விவாகரத்து செய்யப்பட்ட பெண்ணை மணந்துகொள்கிறவனும் விபசாரம் செய்கிறான்.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்தக் கிரேக்கச் சொற்றொடரை, ‘பாலியல் ஒழுக்கக்கேட்டை அடிப்படையாகக் கொண்டிருந்தாலன்றி’ என்றும் மொழிபெயர்க்கலாம். πορνεία என்பதற்கு இன்னும் குறுகலாக ‘முறைகேடான பாலுறவு’ என்றும், சிலர் ‘பாலியல் நம்பிக்கைத் துரோகம்’ என்றும் பொருள் கொள்கிறார்கள்.
    reason: lexical_alternative
  - marker: b
    text: ‘விவாகரத்து செய்யப்பட்ட பெண்ணை மணந்துகொள்கிறவனும் விபசாரம் செய்கிறான்’ என்ற இறுதிப் பகுதி சில கையெழுத்துப் பிரதிகளில் இல்லை.
    reason: textual_variant
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: ஆனால் நான் உங்களுக்குச் சொல்கிறேன்
  rationale: δέ இங்கு முந்தைய உரையாடலுடன் மென்மையான முரண்பாட்டைச் சுட்டுகிறது; λέγω ... ὑμῖν என்பதன் நேரடியான, இயல்பான தமிழ் வடிவம் இது.
- source_word: ὃς ἂν
  choice: எவனும்
  rationale: ἄν உடன் வரும் தொடர்புப்பெயர் பொதுவான, நிபந்தனை சார்ந்த பொருளைக் கொண்டுள்ளது; ‘எவனும்’ அந்தப் பொதுமையைச் சுருக்கமாகத் தருகிறது.
- source_word: ἀπολύσῃ τὴν γυναῖκα αὐτοῦ
  choice: தன் மனைவியை விவாகரத்து செய்துவிட்டு
  rationale: திருமணச் சூழலில் ἀπολύω என்பது வெறுமனே அனுப்பிவிடுவதை அல்ல, விவாகரத்தை குறிக்கிறது; γυνή இங்கு ‘மனைவி’ எனப் பொருள்படுகிறது.
- source_word: μὴ ἐπὶ πορνείᾳ
  choice: பாலியல் ஒழுக்கக்கேட்டின் காரணமாக இருந்தாலன்றி
  rationale: ἐπί உடன் வரும் சொற்றொடர் காரணம் அல்லது அடிப்படையைக் குறிக்கிறது. πορνεία-வை ‘விபசாரம்’ என்று மட்டும் குறுக்காமல், அதன் விரிந்த பொருள் எல்லையை ‘பாலியல் ஒழுக்கக்கேடு’ காக்கிறது.
- source_word: καὶ γαμήσῃ ἄλλην
  choice: வேறொரு பெண்ணை மணந்துகொள்கிற
  rationale: ἄλλην என்பது பெண்பால் வடிவம்; தமிழில் பொருள் தெளிவாக இருக்க ‘பெண்ணை’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: μοιχᾶται
  choice: விபசாரம் செய்கிறான்
  rationale: μοιχάομαι திருமண நம்பிக்கையை மீறும் விபசாரத்தைத் தெளிவாகக் குறிக்கிறது; நவீனத் தமிழில் நிலைபெற்ற, புரிந்துகொள்ளத்தக்க மொழிபெயர்ப்பு இது.
- source_word: καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται
  choice: விவாகரத்து செய்யப்பட்ட பெண்ணை மணந்துகொள்கிறவனும் விபசாரம் செய்கிறான்
  rationale: பெயர்ச்சொல் போலச் செயல்படும் கிரேக்கப் பங்கேற்பு அமைப்பு பொதுவான ஒருவரைக் குறிக்கிறது; ἀπολελυμένην என்பது விவாகரத்து செய்யப்பட்ட பெண்ணைக் குறிக்கும் நிறைவேற்றப்பட்ட செயப்பாட்டு வடிவம்.
theological_decisions:
- issue: விதிவிலக்குச் சொற்றொடரில் πορνεία என்பதன் பொருள்
  choice: பாலியல் ஒழுக்கக்கேடு என்று விரிவாக மொழிபெயர்த்தல்
  alternative: விபசாரம்; முறைகேடான பாலுறவு; பாலியல் நம்பிக்கைத் துரோகம்
  rationale: πορνεία என்பது μοιχεία என்ற ‘விபசாரம்’ என்பதைக் காட்டிலும் விரிந்த பொருள் எல்லையைக் கொண்டிருக்கலாம். விரிவான மொழிபெயர்ப்பு எந்த ஒரு குறிப்பிட்ட சமயவியல் விளக்கத்தையும் உரைக்குள் திணிக்காமல், மூலத்தின் பொருள் அகலத்தைப் பாதுகாக்கிறது.
- issue: καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται என்ற இறுதிப் பகுதியைச் சேர்த்தல்
  choice: முதன்மை உரையில் சேர்த்து, பாடவேறுபாட்டை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: சில கையெழுத்துப் பிரதிகளின் அடிப்படையில் விடுதல்
  rationale: வழங்கப்பட்ட SBLGNT உரையில் இப்பகுதி பாடவேறுபாட்டைக் குறிக்கும் அடையாளத்துடன் இடம்பெறுவதால், அது மொழிபெயர்க்கப்பட்டு, கையெழுத்துப் பிரதிகளின் சான்று அடிக்குறிப்பில் வெளிப்படையாகத் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் இயேசுவின் கூற்றுக்குரிய கண்ணியமும் நேரடித்தன்மையும் நிலைக்கும் வகையிலும் மொழிநடை அமைக்கப்பட்டுள்ளது. ‘விவாகரத்து’, ‘பாலியல் ஒழுக்கக்கேடு’, ‘விபசாரம்’ ஆகிய சொற்கள் சட்ட-உறவு மற்றும் அறநெறிப் பொருள்களைத் தெளிவாக வேறுபடுத்துகின்றன.
