id: MAT.19.2
reference: Matthew 19:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἠκολούθησαν αὐτῷ ὄχλοι πολλοί, καὶ ἐθεράπευσεν αὐτοὺς ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/002.yaml
  text: And large crowds followed him, and he healed them there.
translation:
  language: ta
  text: திரளான மக்கள் அவரைப் பின்தொடர்ந்தார்கள்; அவர் அங்கே அவர்களைக் குணமாக்கினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠκολούθησαν αὐτῷ
  choice: அவரைப் பின்தொடர்ந்தார்கள்
  rationale: ἀκολουθέω இங்கு நேரடியான கதைச்சூழலில் ஒருவரைப் பின்தொடர்வதைக் குறிக்கிறது. கிரேக்கத்தில் நபர் வேற்றுமை உருபில் வந்தாலும், இயல்பான தமிழில் செயப்படுபொருள் வடிவம் தேவைப்படுகிறது. தேவையற்ற சீடத்துவப் பொருளைச் சேர்க்காமல் அடிப்படை அர்த்தத்தைத் தருகிறது.
- source_word: ὄχλοι πολλοί
  choice: திரளான மக்கள்
  rationale: சொல்லுக்குச் சொல் வடிவமான ‘பல கூட்டங்கள்’ என்பதைவிட, ஏராளமான மக்கள் கூட்டமாக வந்தனர் என்ற பொருளை நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: ἐθεράπευσεν
  choice: குணமாக்கினார்
  rationale: θεραπεύω இச்சூழலில் நோயிலிருந்து குணப்படுத்துவதைக் குறிக்கிறது. ‘குணமாக்கினார்’ என்பது நற்செய்தி கதைநடைக்கு ஏற்ற, தெளிவான நவீனத் தமிழ் வழக்கு.
- source_word: αὐτοὺς
  choice: அவர்களை
  rationale: பன்மைச் சுட்டுப்பெயர் முன்பு குறிப்பிடப்பட்ட மக்களைக் குறிக்கிறது; தமிழில் மரியாதையுடனான மனிதப் பன்மையாக ‘அவர்களை’ இயல்பாக அமைகிறது.
- source_word: ἐκεῖ
  choice: அங்கே
  rationale: இடத்தைக் குறிக்கும் எளிய வினையடை; கூடுதல் விளக்கம் சேர்க்காமல் கிரேக்கத்தின் இடப்பொருளைப் பாதுகாக்கிறது.
- source_word: καὶ ... καὶ
  choice: …; அவர்…
  rationale: முதல் καί முந்தைய வசனத்துடன் நிகழ்வை இணைக்கிறது; தனிவசனத் தமிழில் அதை வெளிப்படையாக ‘மேலும்’ எனத் தொடங்குவது இயல்பற்றதாக இருக்கலாம். இரண்டாவது καί இணைக்கும் இரு நிகழ்வுகளும் அரைப்புள்ளியால் தெளிவாக இணைக்கப்பட்டுள்ளன; கால அல்லது காரண உறவு சேர்க்கப்படவில்லை.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘திரளான மக்கள்’ என்பது ‘பல மக்கள் கூட்டங்கள்’ என்ற கடினமான சொல்லமைப்பைத் தவிர்த்து ὄχλοι πολλοί என்பதன் எண்ணிக்கை/அளவுப் பொருளை இயல்பாகத் தருகிறது.
