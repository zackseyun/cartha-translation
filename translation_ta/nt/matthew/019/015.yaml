  source_fidelity: 'The Tamil accurately represents the Greek sequence: Jesus laid his hands on them and then went away from that place. “தம் கைகளை” appropriately supplies the possessive implicit in the Greek idiom, and “அவர்கள்மேல்” correctly renders the dative object in the idiomatic construction.'
