id: MAT.19.15
reference: Matthew 19:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐπιθεὶς ⸂τὰς χεῖρας αὐτοῖς⸃ ἐπορεύθη ἐκεῖθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/015.yaml
  text: And after laying his hands on them[a], he went on from there.
translation:
  language: ta
  text: அவர் அவர்கள்மேல் தம் கைகளை வைத்த பின்பு, அங்கிருந்து புறப்பட்டுச் சென்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: பின்பு
  rationale: இணைப்புச் சொல்லான καὶ இங்கு முந்தைய நிகழ்வைத் தொடர்ந்து அடுத்த செயலை அறிமுகப்படுத்துகிறது; தமிழில் வினையெச்சத் தொடருடன் ‘பின்பு’ இயல்பாக அந்த வரிசையை வெளிப்படுத்துகிறது.
- source_word: ἐπιθεὶς
  choice: வைத்த பின்பு
  rationale: ἐπιτίθημι என்பதன் இறந்தகால வினையெச்சம் பிரதான வினைக்கு முன் நிறைவுற்ற செயலைக் குறிக்கிறது. ‘வைத்த பின்பு’ காலவரிசையைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: τὰς χεῖρας αὐτοῖς
  choice: அவர்கள்மேல் தம் கைகளை
  rationale: கைகளை ஒருவர்மேல் வைப்பது என்ற கிரேக்க மரபுத்தொடரை நேரடியாகக் காக்கிறது. எழுவாய் இயேசு என்பதால் தமிழில் இயல்பான தற்சுட்டுப் பெயரடையான ‘தம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐπορεύθη
  choice: புறப்பட்டுச் சென்றார்
  rationale: πορεύομαι இங்கு ஒரு இடத்திலிருந்து செல்வதைக் குறிக்கிறது. ‘புறப்பட்டுச் சென்றார்’ என்பது நவீனத் தமிழில் இயல்பாக இருந்து, அங்கிருந்து நீங்கிச் சென்ற இயக்கத்தை வெளிப்படுத்துகிறது.
- source_word: ἐκεῖθεν
  choice: அங்கிருந்து
  rationale: இடத்தைக் குறிக்கும் ἐκεῖθεν என்பதற்கான தெளிவான, இயல்பான தமிழாக்கம்.
theological_decisions:
- issue: இயேசு கைகளை வைத்த செயலின் தன்மை
  choice: ‘அவர்கள்மேல் தம் கைகளை வைத்தார்’ என்ற உடல்செயல் நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: முதன்மை உரையில் ‘அவர்களை ஆசீர்வதித்தார்’ என்று பொருள் விளக்கமாக மொழிபெயர்த்தல்.
  rationale: சூழல் ஆசீர்வாதத்தைக் குறிப்பிட்டாலும், கிரேக்க உரை கைகளை வைத்த செயலைத் தெளிவாகச் சொல்கிறது. ஆகவே சடங்கு, திருநிலைப்பாடு அல்லது நியமனம் போன்ற கூடுதல் இறையியல் கருத்துகளைச் சேர்க்காமல் மூலத்தின் நேரடி செயல் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய அதேவேளை கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. மரியாதைப் பன்மை வினைமுற்று இயேசுவைக் குறிக்கும் தமிழ் வேதாகம நடைக்கு ஏற்றவாறு பயன்படுத்தப்பட்டுள்ளது.
