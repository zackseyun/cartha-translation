id: MAT.19.29
reference: Matthew 19:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ πᾶς ⸀ὅστις ἀφῆκεν ⸂οἰκίας ἢ⸃ ἀδελφοὺς ἢ ἀδελφὰς ἢ πατέρα ἢ μητέρα ἢ ⸂γυναῖκα ἢ⸃ τέκνα ἢ ⸀ἀγροὺς ἕνεκεν τοῦ ⸂ὀνόματός μου⸃, ⸀ἑκατονταπλασίονα λήμψεται καὶ ζωὴν αἰώνιον κληρονομήσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/029.yaml
  text: And everyone who has left houses or brothers or sisters or father or mother or wife or children or fields for the sake of my name will receive a hundredfold and will inherit eternal life[a].
translation:
  language: ta
  text: என் பெயருக்காக வீடுகளையோ சகோதரர்களையோ சகோதரிகளையோ தந்தையையோ தாயையையோ மனைவியையோ பிள்ளைகளையோ வயல்களையோ விட்டுவந்த ஒவ்வொருவரும் நூறு மடங்கு பெற்றுக்கொள்வார்கள்; நிலைவாழ்வையும் உரிமையாகப் பெறுவார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὅστις
  choice: ஒவ்வொருவரும்
  rationale: நிபந்தனைக்கு உட்படும் ஒவ்வொரு நபரையும் தனித்தனியாக உள்ளடக்கும் பகிர்ந்தளிக்கும் பொதுப்பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἀφῆκεν
  choice: விட்டுவந்த
  rationale: சீடத்துவத்தின் காரணமாக உறவுகளையோ உடைமைகளையோ விட்டு வந்த நிறைவேறிய செயலையும் அதன் தொடரும் பொருத்தத்தையும் காட்டுகிறது; ‘கைவிட்ட’ என்பதிலுள்ள தேவையற்ற எதிர்மறைச் சாயலைத் தவிர்க்கிறது.
- source_word: οἰκίας
  choice: வீடுகள்
  rationale: உறவினர்களோடு வயல்களும் பட்டியலிடப்படுவதால், குடியிருப்பு மற்றும் சொத்து ஆகிய இரு சாயல்களுக்கும் இடமளிக்கும் நேரடியான சொல்.
- source_word: ἀδελφοὺς / ἀδελφὰς
  choice: சகோதரர்கள் / சகோதரிகள்
  rationale: கிரேக்கத்தில் இரண்டும் தனித்தனியாக வருவதால் அந்த வேறுபாடு பாதுகாக்கப்படுகிறது.
- source_word: πατέρα / μητέρα
  choice: தந்தை / தாய்
  rationale: குடும்ப உறவுகளைக் குறிக்கும் ஒருமை வடிவங்கள் நேரடியாகவும் கண்ணியமாகவும் மொழிபெயர்க்கப்படுகின்றன.
- source_word: γυναῖκα
  choice: மனைவி
  rationale: குடும்ப உறவுகளின் பட்டியலில் γυνή என்பது பொதுவாக ‘பெண்’ என்பதைவிட ‘மனைவி’ என்ற உறவுப் பொருளையே தருகிறது.
- source_word: τέκνα
  choice: பிள்ளைகள்
  rationale: குடும்பப் பட்டியலில் இயல்பாகப் புரியும் நவீனத் தமிழ்ச் சொல்.
- source_word: ἀγρούς
  choice: வயல்கள்
  rationale: விவசாய நிலம் மற்றும் பொருளாதார உடைமை என்ற திடமான பொருளை அளிக்கிறது; ‘பண்ணைகள்’ என மிகையாகக் குறிப்பாக்கவில்லை.
- source_word: ἕνεκεν τοῦ ὀνόματός μου
  choice: என் பெயருக்காக
  rationale: இயேசுவின் நபர், அதிகாரம், அடையாளம் ஆகியவற்றுக்கான பற்றுறுதியைக் குறிக்கும் ‘பெயர்’ என்ற மூல உருவகத்தைப் பாதுகாக்கிறது.
- source_word: ἑκατονταπλασίονα
  choice: நூறு மடங்கு
  rationale: அளவின் வலிமையைச் சுருக்காமல், தமிழில் இயல்பாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: ζωὴν αἰώνιον κληρονομήσει
  choice: நிலைவாழ்வையும் உரிமையாகப் பெறுவார்கள்
  rationale: κληρονομέω-வின் சுதந்தரிப்பு அல்லது உரிமைப் பெறுதல் என்ற கருத்தைப் பாதுகாத்து, αἰώνιος என்பதைக் காலநீட்சி மட்டுமாகக் குறுக்காமல் ‘நிலைவாழ்வு’ என வழங்குகிறது.
theological_decisions:
- issue: γυνή என்பதன் குடும்பச் சூழல் பொருள்
  choice: மனைவி
  alternative: பெண்
  rationale: உடனடி சூழலில் குடும்ப உறவுகள் பட்டியலிடப்படுகின்றன; ஆகவே திருமண உறவைக் குறிக்கும் பொருள் இயல்பானது. பொதுவாகப் பெண்களை விட்டு விலகுதல் என்ற தவறான கருத்தையும் இது தவிர்க்கிறது.
- issue: ἕνεκεν τοῦ ὀνόματός μου என்பதிலுள்ள ‘பெயர்’ உருவகம்
  choice: என் பெயருக்காக
  alternative: எனக்காக / என்னால்
  rationale: மூலத்தின் இறையியல் எடையுள்ள ‘என் பெயர்’ என்ற சொல்லாட்சியைத் தக்கவைத்து, இயேசுவுக்கான பற்றுறுதியை தேவையின்றிப் பொழிப்புரையாக்காமல் தருகிறது.
- issue: ἑκατονταπλασίονα என்ற வாக்குறுதியின் வடிவம்
  choice: நூறு மடங்கு
  alternative: நூறு பங்கு / நூறு மடங்கானதை
  rationale: வாக்குறுதியின் அளவுசார் வலிமையைப் பாதுகாக்கிறது; அது எவ்வாறு அல்லது எப்போது நிறைவேறும் என்பதை மொழிபெயர்ப்பு கூடுதலாகத் தீர்மானிக்கவில்லை.
- issue: ζωὴν αἰώνιον என்பதன் மொழிபெயர்ப்பு
  choice: நிலைவாழ்வு
  alternative: நித்திய ஜீவன் / முடிவில்லா வாழ்க்கை
  rationale: மூலச் சொல்லின் காலநீட்சியையும் தரச்சார்ந்த இறையியல் பரப்பையும் திறந்தவாறு வைத்துக்கொண்டு, நவீன பொதுத் தமிழில் இயல்பாக ஒலிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, வாசிக்க எளிய நடை. தொடர்ச்சியான ‘-ஐயோ’ பட்டியல் கிரேக்கத்தின் மாற்றுத் தொகுப்பைத் தெளிவாகக் காட்டுகிறது. வசனத்தின் இரண்டு வாக்குறுதிகளும் அரைப்புள்ளியால் பிரிக்கப்பட்டுள்ளன; எந்தப் பிரிவுசார் விளக்கமும் சேர்க்கப்படவில்லை.
