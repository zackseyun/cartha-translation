source:
  edition: SBLGNT
  text: Τότε ⸀προσηνέχθησαν αὐτῷ παιδία ἵνα τὰς χεῖρας ἐπιθῇ αὐτοῖς καὶ προσεύξηται· οἱ δὲ μαθηταὶ ἐπετίμησαν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/013.yaml
  text: Then children were brought to him so that he might lay his hands on them and pray[a]; but the disciples rebuked them.
translation:
  language: ta
  text: அப்போது, அவர் அவர்கள் மீது தம் கைகளை வைத்து ஜெபிப்பதற்காகப் பிள்ளைகள் அவரிடம் கொண்டுவரப்பட்டார்கள். ஆனால் சீடர்கள் அவர்களைக்[a] கண்டித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இறுதியில் வரும் ‘அவர்களைக்’ என்பது பிள்ளைகளையோ, அவர்களைக் கொண்டுவந்தவர்களையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: அப்போது
  rationale: கதை நிகழ்வுகளின் காலத் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: προσηνέχθησαν αὐτῷ παιδία
  choice: பிள்ளைகள் அவரிடம் கொண்டுவரப்பட்டார்கள்
  rationale: προσφέρω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவத்தைத் தெளிவாகப் பாதுகாக்கிறது; παιδία என்பதற்கு வயதைத் தேவையின்றிக் குறுக்காமல் இயல்பான ‘பிள்ளைகள்’ பயன்படுத்தப்படுகிறது.
- source_word: ἵνα τὰς χεῖρας ἐπιθῇ αὐτοῖς
  choice: அவர் அவர்கள்மேல் தம் கைகளை வைத்து … வேண்டும் என்பதற்காக
  rationale: ἵνα குறிக்கும் நோக்கத்தையும், பன்மையான τὰς χεῖρας என்பதையும், கைகளை ஒருவர்மேல் வைக்கும் கிரேக்கச் சொல்லாட்சியையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: καὶ προσεύξηται
  choice: ஜெபிக்க
  rationale: வினைச்சொல்லில் வெளிப்படையாக இல்லாத ‘அவர்களுக்காக’ என்ற செயப்படுபொருளைச் சேர்க்காமல் கிரேக்கத்தின் சுருக்கத்தைப் பாதுகாக்கிறது.
- source_word: οἱ δὲ μαθηταὶ
  choice: ஆனால் சீடர்கள்
  rationale: δέ இங்கு காட்டும் மிதமான எதிர்மறைத் திருப்பத்தை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐπετίμησαν αὐτοῖς
  choice: அவர்களைக் கண்டித்தார்கள்
  rationale: ἐπιτιμάω என்பதன் கடிந்துகொள்ளும் வலிமையை ‘கண்டித்தார்கள்’ தருகிறது; αὐτοῖς என்பதன் சுட்டுப்பொருளைத் தீர்மானிக்காமல் ‘அவர்களை’ எனப் பாதுகாக்கிறது.
theological_decisions:
- issue: இறுதியில் வரும் αὐτοῖς யாரைக் குறிக்கிறது?
  choice: அவர்களை
  alternative: பிள்ளைகளை; அல்லது பிள்ளைகளைக் கொண்டுவந்தவர்களை
  rationale: கிரேக்கப் பன்மைப் பதிலிப்பெயர் இரு குழுக்களில் எதைக் குறிக்கிறது என்பது தெளிவாக இல்லை. மொழிபெயர்ப்பு எந்த ஒரு பொருளையும் கட்டாயப்படுத்தாமல் அந்த உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. கிரேக்கத்தின் நீண்ட நோக்கத் தொடரை வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரித்தாலும், அதன் தொடர்பும் பொருளும் முழுமையாகப் பாதுகாக்கப்பட்டுள்ளன.
