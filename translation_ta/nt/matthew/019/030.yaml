  yaml_path: translation/nt/matthew/019/030.yaml
  text: But many who are first will be last[a], and the last first.
translation:
  language: ta
  text: ஆனால், முதலில் இருப்பவர்களில் பலர் கடைசியில் இருப்பார்கள்; கடைசியில் இருப்பவர்கள் முதலில் இருப்பார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல் நெருக்கமாக: “ஆனால், பல முதல்வர்கள் கடைசியாக இருப்பார்கள்; கடைசியாக இருப்பவர்கள் முதல்வர்களாக இருப்பார்கள்.” கிரேக்கத்தில் இக்கூற்று மிகவும் சுருக்கமான பழமொழி வடிவில் உள்ளது; இரண்டாம் பகுதியில் வினைச்சொல் விடுபட்டுள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: பலர்
  rationale: பெயர்ச்சொல் போலப் பயன்படும் இந்தப் பன்மை பெயரடை, யார் என்று குறிப்பாகச் சொல்லாமல் பல மனிதர்களைக் குறிக்கிறது; தமிழில் ‘பலர்’ இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய உரையாடலுடன் உள்ள மென்மையான எதிர்மறைத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἔσονται
  choice: இருப்பார்கள்
  rationale: εἰμί என்பதன் எதிர்கால வடிவத்தை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: πρῶτοι
  choice: முதலானவர்கள்
  rationale: கால வரிசையை மட்டும் அல்லாமல் இடம் அல்லது தகுநிலையையும் குறிக்கக்கூடிய ‘முதல்’ என்ற பரந்த பொருளைப் பேணுகிறது.
- source_word: ἔσχατοι
  choice: கடைசியானவர்கள்
  rationale: πρῶτοι என்பதற்கு நேரான எதிரிணையாக இருந்து, வரிசை அல்லது தகுநிலையில் கடைசி என்ற பொருளைப் பேணுகிறது.
- source_word: πρῶτοι ἔσχατοι
  choice: முதலானவர்களில் பலர் கடைசியானவர்களாக
  rationale: கிரேக்கத்தின் சுருக்கமான பெயரடை அமைப்பைத் தமிழில் தெளிவான இயல்பான கூற்றாகத் தருகிறது; ‘பலர்’ என்பது முதலானவர்களோடு தொடர்புடையது என்பதையும் வெளிப்படுத்துகிறது.
- source_word: καὶ ἔσχατοι πρῶτοι
  choice: கடைசியானவர்கள் முதலானவர்களாகவும்
  rationale: இரண்டாம் பகுதியில் விடுபட்டுள்ள வினைச்சொல் முதல் பகுதியிலிருந்து புரிந்துகொள்ளப்படும்படி, பழமொழித்தன்மையுள்ள இணை அமைப்பைப் பேணுகிறது.
theological_decisions:
- issue: தலைகீழ் மாற்றக் கூற்றின் இயல்பு
  choice: தகுநிலை அல்லது வரிசையின் தலைகீழ் மாற்றத்தைப் பற்றிய பொதுவான கூற்றாகவே வைக்கப்பட்டது.
  alternative: இது குறிப்பாக இறையரசில் நுழைதல், சீடர்களுக்கான வெகுமதி, அல்லது சமூகத் தகுநிலை ஆகியவற்றில் ஏதாவது ஒன்றை மட்டுமே குறிக்கிறது என்று மொழிபெயர்த்தல்.
  rationale: இந்த வசனம் மாற்றத்தின் துல்லியமான வரம்பை வரையறுக்கவில்லை. ஆகவே மீட்பு, வெகுமதி, சமூக நிலை, அல்லது இறுதிக்காலத் தகுநிலை என்ற எந்த ஒரு விளக்கத்தையும் மொழிபெயர்ப்பில் கட்டாயப்படுத்தாமல் அதன் இறையியல் பதற்றமும் பழமொழித்தன்மையும் பேணப்பட்டுள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘முதல்/கடைசி’ என்ற நேரான எதிரிணை காக்கப்பட்டது; வசனம் குறிப்பிடாத இறையியல் வரம்பு சேர்க்கப்படவில்லை.
