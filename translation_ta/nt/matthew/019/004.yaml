  text: He answered, “Have you not read that from the beginning the one who created them made them male and female?”
translation:
  language: ta
  text: 'அவர் பதிலளித்துச் சொன்னார்: “தொடக்கத்தில் படைத்தவர் அவர்களை ஆணும் பெண்ணுமாக உண்டாக்கினார் என்று நீங்கள் வாசித்ததில்லையா?[a]”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் வாசிக்கவில்லையா?”
    reason: lexical_alternative
  - marker: b
    text: 'கிரேக்கம்: “படைத்தவர் ஒருவரே”; மாற்றாக, “படைப்பாளர்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: அதற்கு அவர் … என்றார்
  rationale: பங்கேற்புவினையும் முற்றுவினையும் இணைக்கும் கிரேக்க மரபுத்தொடரைத் தமிழில் இயல்பான பதிலுரைக் கட்டமைப்பாகச் சுருக்குகிறது; பொருள் இழப்பில்லை.
- source_word: Οὐκ ἀνέγνωτε
  choice: நீங்கள் வாசித்ததில்லையா?
  rationale: வேதவாக்கை அவர்கள் அறிந்திருக்க வேண்டுமென்ற சவாலை, கடந்த வாசிப்பின் தற்போதைய தொடர்புடன் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ὁ κτίσας
  choice: படைத்தவர்
  rationale: பெயரெச்சத் தன்மையுள்ள கிரேக்கப் பங்கேற்புவினையைத் தலைப்புப் பெயராக மாற்றாமல் சுருக்கமாகவும் நேரடியாகவும் வழங்குகிறது.
- source_word: ἀπ’ ἀρχῆς
  choice: தொடக்கத்திலேயே
  rationale: படைப்பின் தொடக்கத்தை வலியுறுத்துவதோடு ஆதியாகமப் படைப்பு மொழியின் எதிரொலியையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἄρσεν καὶ θῆλυ
  choice: ஆணாகவும் பெண்ணாகவும்
  rationale: கிரேக்கத்தில் உள்ள படைப்புசார் இரட்டையிணையைப் பொழிப்புரை செய்யாமல் காக்கிறது.
- source_word: ἐποίησεν αὐτούς
  choice: அவர்களை … உருவாக்கினார்
  rationale: முந்தைய κτίσας என்பதற்குப் ‘படைத்தவர்’ எனத் தேர்ந்ததால், வேறுபட்ட கிரேக்க வினையை ‘உருவாக்கினார்’ என்று வழங்கி தேவையற்ற சொல் மறுபயன்பாட்டைத் தவிர்க்கிறது.
