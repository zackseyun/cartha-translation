  alternative: ‘ஆணும் பெண்ணுமாக’ அல்லது ‘ஆணாகவும் பெண்ணாகவும் அவர்களைப் படைத்தார்’
  rationale: இயேசுவின் படைப்புக் கணக்கு மேற்கோளை அதன் உயிரியல் மற்றும் படைப்புசார் சொல்லமைப்புடன் காக்கிறது; வசனம் கூறுவதைத் தாண்டிய கோட்பாட்டு முடிவைச் சேர்ப்பதில்லை.
