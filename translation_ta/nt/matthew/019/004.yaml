  register: நவீன நிலையான தமிழ்; மரியாதையும் எளிய வாசிப்புத்தன்மையும் கொண்ட நேரடி உரை. ‘தொடக்கத்திலேயே’ என்பது காலச் சொற்றொடரைப் படைப்புச் செயலோடு இயல்பாக இணைக்கிறது; ‘படைத்தவர்’ என்பதை தனிப்பட்ட இறைத் தலைப்பாக மிகைவிளக்கம் செய்யவில்லை.
