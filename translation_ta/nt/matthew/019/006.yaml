id: MAT.19.6
reference: Matthew 19:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὥστε οὐκέτι εἰσὶν δύο ἀλλὰ σὰρξ μία. ὃ οὖν ὁ θεὸς συνέζευξεν ἄνθρωπος μὴ χωριζέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/006.yaml
  text: So they are no longer two[a], but one flesh. Therefore, what God has joined together, man must not separate.
translation:
  language: ta
  text: அதனால், அவர்கள் இனி இருவர் அல்ல; ஒரே மாம்சமாக இருக்கிறார்கள். ஆகவே, கடவுள் இணைத்ததை எந்த மனிதரும் பிரிக்கக் கூடாது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: அதனால்
  rationale: முந்தைய கூற்றின் விளைவை அறிமுகப்படுத்துகிறது; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: οὐκέτι εἰσὶν δύο
  choice: அவர்கள் இனி இருவர் அல்ல
  rationale: மாறிய நிலையைச் சுட்டும் οὐκέτι என்பதையும், ‘இரண்டு’ என்பதற்கு மனிதர்களைக் குறிக்கும் இயல்பான தமிழ் வடிவமான ‘இருவர்’ என்பதையும் காக்கிறது.
- source_word: σὰρξ μία
  choice: ஒரே மாம்சம்
  rationale: ஆதியாகமத்தின் திருமண மொழியுடனான தொடர்பைத் தக்கவைக்கிறது; ‘ஒரே உடல்’ என்பதைவிட மூலத்தின் முக்கிய உருவகத்தையும் வேதாகம இடைநூல் தொடர்பையும் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: ὃ οὖν
  choice: ஆகவே, ... இணைத்ததை
  rationale: οὖν என்பதன் முடிவுரைக் கருத்தை ‘ஆகவே’ தெரிவிக்கிறது; நடுநிலை உறவுப்பெயரான ὃ, தமிழில் இயல்பாக ‘இணைத்ததை’ என்ற வடிவில் வெளிப்படுகிறது.
- source_word: ὁ θεὸς
  choice: கடவுள்
  rationale: மூலத்தின் பொருளை நேரடியாகவும் பொதுவாகப் புரியும் நவீன தமிழிலும் தருகிறது.
- source_word: συνέζευξεν
  choice: இணைத்ததை
  rationale: ஒன்றாக இணைத்தல் அல்லது நுகத்தடியில் சேர்த்தல் என்ற கருத்தை, திருமணச் சூழலில் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἄνθρωπος
  choice: எந்த மனிதரும்
  rationale: இங்கு சொல் பொதுப்பொருளில் எந்த மனிதரையும் குறிக்கிறது. ‘எந்த மனிதரும்’ என்பது பாலின வரம்பைச் சேர்க்காமல், தடையின் உலகளாவிய தன்மையை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: μὴ χωριζέτω
  choice: பிரிக்கக் கூடாது
  rationale: μή உடன் வரும் நிகழ்கால கட்டளையின் தடை வலிமையை நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: திருமணத்தைப் பற்றிய தடையில் ἄνθρωπος என்பதன் பொதுப்பொருள்
  choice: ‘எந்த மனிதரும்’ என்று மொழிபெயர்க்கப்பட்டது
  alternative: ‘மனிதன்’
  rationale: கிரேக்க ஒருமைச் சொல் இங்கு ஆண்களை மட்டும் அல்லாமல் எந்த மனிதரையும் பொதுவாகக் குறிக்கிறது. தமிழ் மொழிபெயர்ப்பு அந்தப் பொதுப்பொருளை வெளிப்படையாகக் காக்கிறது.
- issue: σὰρξ μία என்பதில் ஆதியாகமத் திருமண மொழியின் எதிரொலி
  choice: ‘ஒரே மாம்சம்’ என்று காக்கப்பட்டது
  alternative: ‘ஒரே உடல்’
  rationale: இயேசுவின் ஆதியாகம மேற்கோளுடனான சொல் மற்றும் கருத்துத் தொடர்பைத் தக்கவைக்கிறது; கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் அமைக்கப்பட்டது. ‘ஒரே மாம்சம்’ என்ற வேதாகமச் சொற்றொடர் இடைநூல் தொடர்பிற்காகத் தக்கவைக்கப்பட்டுள்ளது; மற்ற வாக்கிய அமைப்பு இயல்பான தமிழாக்கமாக உள்ளது.
