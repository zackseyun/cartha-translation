  source_fidelity: மூல கிரேக்கத்தின் இரு முடிவுரைக் இணைப்புகளும் (‘ὥστε’, ‘οὖν’) முறையே ‘அதனால்’, ‘ஆகவே’ என்று காக்கப்பட்டுள்ளன. ‘இனி இருவர் அல்ல’ என்பது οὐκέτι εἰσὶν δύο என்பதையும், ‘ஒரே மாம்சமாக இருக்கிறார்கள்’ என்பது σὰρξ μία என்ற ஆதியாகம எதிரொலியையும் பொருளோடு தருகிறது. ‘கடவுள் இணைத்ததை எந்த மனிதரும் பிரிக்கக் கூடாது’ என்பது நடுநிலை உறவுப்பெயரான ὃ, συνέζευξεν-இன் இணைப்பு கருத்து, மற்றும் பொதுப்பொருளுடைய ἄνθρωπος உடனான தடை வினையைத் துல்லியமாக வெளிப்படுத்துகிறது.
