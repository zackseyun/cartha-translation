source:
  edition: SBLGNT
  text: Λέγουσιν αὐτῷ οἱ ⸀μαθηταί· Εἰ οὕτως ἐστὶν ἡ αἰτία τοῦ ἀνθρώπου μετὰ τῆς γυναικός, οὐ συμφέρει γαμῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/010.yaml
  text: His disciples said to him[a], “If that is the case of a man with his wife, it is not beneficial to marry.”
translation:
  language: ta
  text: அவருடைய சீடர்கள் அவரிடம், “ஒரு மனிதனுக்கும் அவன் மனைவிக்கும் உள்ள நிலை[a] இப்படியானது என்றால், திருமணம் செய்துகொள்வது பயன்தராது” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஒரு மனிதன் தன் மனைவியுடன் கொண்டிருக்கும் விவகாரம் இப்படியானது என்றால்’ அல்லது ‘அவர்களுடைய சூழ்நிலை இப்படியானது என்றால்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத் தொடர் சுருக்கமானது; இங்குள்ள சொல் ‘நிலை,’ ‘விவகாரம்,’ அல்லது ‘சூழ்நிலை’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγουσιν αὐτῷ
  choice: அவரிடம் … என்றார்கள்
  rationale: கிரேக்க நிகழ்காலம் கதைசொல்லலில் வரலாற்று நிகழ்காலமாகப் பயன்படுத்தப்பட்டுள்ளது; தமிழில் இறந்தகால வினை இயல்பான கதைநடை வடிவம்.
- source_word: μαθηταί
  choice: சீடர்கள்
  rationale: இயேசுவைப் பின்பற்றிக் கற்றவர்களைக் குறிக்கும் நற்செய்தி நூல்களின் வழக்கமான, பொருத்தமான சொல்.
- source_word: Εἰ οὕτως ἐστίν
  choice: இப்படியானது என்றால்
  rationale: முந்தைய போதனையைச் சுட்டும் நிபந்தனைத் தன்மையை இயல்பான தமிழில் காக்கிறது.
- source_word: ἡ αἰτία
  choice: நிலை
  rationale: இங்கு கடுமையான காரணத்தைக் காட்டிலும் நிலை, காரியம், அல்லது சூழ்நிலை என்ற பொருள் பொருந்துகிறது; கிரேக்கச் சொல்லின் சுருக்கத்தையும் நெகிழ்வையும் ‘நிலை’ காக்கிறது.
- source_word: τοῦ ἀνθρώπου μετὰ τῆς γυναικός
  choice: ஒரு மனிதனுக்கும் அவன் மனைவிக்கும் இடையிலான
  rationale: சூழல் திருமண உறவைப் பற்றியது என்பதால் γυνή என்பதற்கு ‘மனைவி’ எனவும், மூலத்தின் ஆண்பால் ஒருமையை ‘ஒரு மனிதன்’ எனவும் மொழிபெயர்க்கிறது.
- source_word: οὐ συμφέρει
  choice: பயன்தராது
  rationale: நன்மை அல்லது அனுகூலம் அளிக்காது என்ற நடைமுறைப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; ‘செய்யாமல் இருப்பதே நல்லது’ என்ற ஒப்பீட்டை தேவையின்றி சேர்க்கவில்லை.
- source_word: γαμῆσαι
  choice: திருமணம் செய்துகொள்வது
  rationale: திருமணம் புரிதல் என்ற வினைச்செயலை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἀνθρώπου … γυναικός என்பவற்றிலுள்ள பாலினக் குறிப்பு
  choice: ஒரு மனிதனுக்கும் அவன் மனைவிக்கும் இடையிலான
  alternative: ஒருவருக்கும் அவரது வாழ்க்கைத்துணைக்கும் இடையிலான
  rationale: உடனடி சூழலும் கிரேக்கச் சொற்களும் ஆண்–மனைவி திருமண உறவைக் குறிப்பதால், பாலினத்தை நடுநிலைப்படுத்தாமல் மூலத்தின் வடிவம் காக்கப்படுகிறது.
- issue: οὐ συμφέρει என்பதன் நடைமுறைத் தீர்ப்பு
  choice: பயன்தராது
  alternative: திருமணம் செய்துகொள்ளாமல் இருப்பதே நல்லது
  rationale: மூலம் பயன் அல்லது அனுகூலம் இல்லை என்று கூறுகிறது; மாற்று மொழியாக்கம் ஒப்பீட்டு முடிவை வெளிப்படையாகச் சேர்ப்பதால் அது தவிர்க்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பயன்தராது’ என்பது சாதாரண வாசகருக்குத் தெளிவாக இருப்பதோடு συμφέρει என்பதன் பயன்/அனுகூலப் பொருளையும் காக்கிறது.
