- from: மேலும், “இதன் காரணமாக ஓர் ஆண் தன் தந்தையையும் தாயையும் விட்டுத் தன் மனைவியுடன் நெருக்கமாக இணைந்திருப்பான்[a]; இருவரும் ஒரே உடலாவார்கள்” என்று அவர் சொன்னார் அல்லவா?
  to: “இதன் காரணமாக ஓர் ஆண் தன் தந்தையையும் தாயையும் விட்டுத் தன் மனைவியுடன் இணைந்திருப்பான்[a]; இருவரும் ஒரே மாம்சமாக ஆவார்கள்” என்று அவர் சொன்னாரே?
  rationale: The revision retains the source’s causal formulation, masculine singular marriage reference, future force, explicit “two,” and final interrogative force. It replaces “உடல்” with “மாம்சம்” to preserve the Genesis-derived “one flesh” idiom and removes small interpretive additions not demanded by the Greek.
