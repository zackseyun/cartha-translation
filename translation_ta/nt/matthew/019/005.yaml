source:
  edition: SBLGNT
  text: καὶ εἶπεν· ⸀Ἕνεκα τούτου καταλείψει ἄνθρωπος τὸν πατέρα καὶ τὴν μητέρα καὶ ⸀κολληθήσεται τῇ γυναικὶ αὐτοῦ, καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/005.yaml
  text: and said[a], ‘For this reason a man will leave his father and mother and be joined to his wife, and the two will become one flesh.’
translation:
  language: ta
  text: “இதன் காரணமாக ஓர் ஆண் தன் தந்தையையும் தாயையும் விட்டுத் தன் மனைவியுடன் இணைந்திருப்பான்[a]; இருவரும் ஒரே மாம்சமாக ஆவார்கள்” என்று அவர் சொன்னாரே?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தன் மனைவியுடன் ஒன்றிணைவான்” அல்லது “தன் மனைவியைப் பற்றிக்கொண்டிருப்பான்” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினை நெருக்கமான பற்றுறவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕνεκα τούτου
  choice: இதன் காரணமாக
  rationale: காரணத்தையும் அதிலிருந்து வரும் முடிவையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: καταλείψει
  choice: விட்டு
  rationale: வருங்கால வினையுடன் சேர்ந்து, தந்தையையும் தாயையும் விட்டுச் செல்லும் செயலைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἄνθρωπος
  choice: ஓர் ஆண்
  rationale: இங்கு பொதுவாக ஒரு மனிதரைக் குறிக்காமல், ‘தன் மனைவி’ என்பதற்கு இணையான ஆண் திருமணத் துணையைக் குறிப்பதால் பாலினக் குறிப்பைத் தக்கவைக்கிறது.
- source_word: κολληθήσεται
  choice: நெருக்கமாக இணைந்திருப்பான்
  rationale: வெறுமனே சேர்வதைவிட நெருங்கிய, நிலையான பற்றுறவை உணர்த்தும் கிரேக்க வினையின் வலிமையைத் தெரிவிக்கிறது; செயப்பாட்டு வடிவத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: γυναικὶ αὐτοῦ
  choice: தன் மனைவியுடன்
  rationale: திருமணச் சூழலில் γυνή என்பது ‘பெண்’ என்பதைவிட ‘மனைவி’ என்ற பொருளையே தருகிறது; தமிழ் இணைவு வழக்கிற்கு ஏற்ப உடனிகழ்ச்சி வேற்றுமை பயன்படுத்தப்பட்டுள்ளது.
- source_word: οἱ δύο
  choice: இருவரும்
  rationale: கிரேக்கத்தில் வெளிப்படையாக உள்ள இருவரையும் தமிழில் இயல்பாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: εἰς σάρκα μίαν
  choice: ஒரே உடலாவார்கள்
  rationale: திருமண இணைவைக் குறிக்கும் மூலமொழி உருவகத்தை நவீன வாசகர்களுக்குப் புரியும் தமிழில் தக்கவைக்கிறது; ‘ஆவார்கள்’ என்பது εἰς குறிக்கும் விளைவு அல்லது புதிய நிலையை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: திருமண மேற்கோளிலுள்ள பாலினக் குறிப்பு
  choice: ஓர் ஆண் ... தன் மனைவி
  alternative: ஒருவர் ... தன் வாழ்க்கைத் துணை
  rationale: ஆதியாகம மேற்கோளின் ஆண்–பெண் வடிவத்தை மாற்றாமல் காக்கிறது; பொதுவான மனிதகுலத்தைப் பற்றிய பாலினமற்ற கூற்றாக இதை மாற்றவில்லை.
- issue: திருமண ஒன்றிப்பின் உருவகம்
  choice: இருவரும் ஒரே உடலாவார்கள்
  alternative: இருவரும் ஒரே மாம்சமாவார்கள்
  rationale: σάρξ என்பதன் உடல்சார்ந்த, உறவுசார்ந்த உருவகத்தைத் தக்கவைத்தபடியே, சாதாரண நவீனத் தமிழில் தெளிவாக வழங்குகிறது; இதை வெறும் உணர்ச்சி அல்லது சட்ட ஒன்றிப்பாக மட்டும் குறுக்கவில்லை.
- issue: εἶπεν என்பதன் எழுவாய்
  choice: அவர் சொன்னார்
  alternative: படைப்பாளர் சொன்னார்
  rationale: கிரேக்க வசனத்தில் எழுவாய் இங்கு மீண்டும் பெயரிட்டு சொல்லப்படவில்லை. முந்தைய வசனத்தின் சூழல் அதை விளக்கினாலும், மொழிபெயர்ப்பில் பெயரைச் சேர்த்து இலக்கணத் தெளிவின்மையைத் தீர்மானமாக அகற்றாமல் ‘அவர்’ என்று வைத்துள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், வேதாகம மேற்கோளுக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் வடிவமைக்கப்பட்டது. முந்தைய வசனத்திலிருந்து தொடரும் வினாவை வெளிப்படுத்த இறுதியில் ‘அல்லவா?’ சேர்க்கப்பட்டது; εἶπεν என்பதன் மறைமுக எழுவாய் ‘அவர்’ என்று வைக்கப்பட்டு மூலத்தின் சாத்தியமான தெளிவின்மை பாதுகாக்கப்பட்டது.
