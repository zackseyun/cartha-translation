review_pass:
  verdict: revise
  source_fidelity: The draft preserves the male–female wording, the explicit two persons, and the interrogative force of the Greek. However, “ஒரே உடலாவார்கள்” renders σάρξ as “body,” which can obscure the deliberate Genesis-marriage idiom of “one flesh.” “மேலும்” also adds a mild discourse sense (“furthermore”) not required by καὶ.
  naturalness: The Tamil is generally clear and modern. “...என்று அவர் சொன்னார் அல்லவா?” is understandable, but “...என்று அவர் சொன்னாரே?” is a more natural way to retain the question in this context. “தன் மனைவியுடன் இணைந்திருப்பான்” is natural without adding the adverb “நெருக்கமாக.”
  terminology: Use “ஒரே மாம்சமாக ஆவார்கள்” for σάρξ in this established marital-union expression. This retains the source imagery more precisely than “உடல்,” while remaining intelligible in a dignified modern Tamil register.
  issues:
  - severity: medium
    issue: σάρξ is translated as “உடல்” rather than retaining the “flesh” idiom.
    rationale: In this Genesis citation, σάρξ is the significant expression “one flesh.” Tamil “உடல்” can suggest a single physical body and does not as directly preserve the biblical relational idiom. “மாம்சம்” is the more source-faithful term here.
  - severity: low
    issue: “மேலும்” over-specifies the force of καὶ.
    rationale: The Greek conjunction simply continues the sentence. “அவர் ... சொன்னாரே?” is sufficient and avoids introducing an unnecessary ‘furthermore’ relation.
  - severity: low
    issue: “நெருக்கமாக” is an unnecessary lexical amplification of κολληθήσεται.
    rationale: The verb itself conveys close attachment. “இணைந்திருப்பான்” communicates this naturally; the lexical nuance can remain in the footnote.
  revised_text: “இதன் காரணமாக ஓர் ஆண் தன் தந்தையையும் தாயையும் விட்டுத் தன் மனைவியுடன் இணைந்திருப்பான்[a]; இருவரும் ஒரே மாம்சமாக ஆவார்கள்” என்று அவர் சொன்னாரே?
