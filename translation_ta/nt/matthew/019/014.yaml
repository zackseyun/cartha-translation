source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἄφετε τὰ παιδία καὶ μὴ κωλύετε αὐτὰ ἐλθεῖν πρός με, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/014.yaml
  text: But Jesus said[a], “Let the children come, and do not hinder them from coming to me[b], for the kingdom of heaven belongs to such as these.”
translation:
  language: ta
  text: இயேசுவோ, “பிள்ளைகளை என்னிடம் வரவிடுங்கள்; என்னிடம் வரவிடாமல் அவர்களைத் தடுக்காதீர்கள். ஏனெனில், இப்படிப்பட்டவர்களுக்கு[a] பரலோக அரசாட்சி உரியது[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இப்படிப்பட்டவர்கள்” என்பது அங்கிருந்த பிள்ளைகளை மட்டுமல்லாமல், அவர்களைப் போன்ற வகையினரையும் குறிக்கக்கூடும்; ஆனால் எந்தப் பண்பு குறிப்பிடப்படுகிறது என்பதை இவ்வசனம் விளக்கவில்லை.
    reason: alternative_reading
  - marker: b
    text: இதனைச் சொல்லுக்கு இன்னும் நெருக்கமாக, “இப்படிப்பட்டவர்களுடையதே பரலோக அரசாட்சி” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄφετε
  choice: வரவிடுங்கள்
  rationale: ἀφίημι இங்கு ‘விட்டுவிடுங்கள்’ என்ற பொருளில் அல்லாமல், வருவதற்கு அனுமதியுங்கள் என்ற கட்டளைப் பொருளில் வருகிறது. ‘வரவிடுங்கள்’ என்பது தமிழில் இயல்பானதும் சுருக்கமானதும் ஆகும்.
- source_word: τὰ παιδία
  choice: பிள்ளைகளை
  rationale: παιδία பொதுவாக இளம் பிள்ளைகளைக் குறிக்கலாம்; ஆனால் இவ்வசனத்தில் வயதைத் தேவையின்றிக் குறுக்காமல் ‘பிள்ளைகள்’ என்று மொழிபெயர்ப்பது பொருத்தமானது.
- source_word: μὴ κωλύετε
  choice: தடுக்காதீர்கள்
  rationale: κωλύω என்பதன் தடுத்தல் அல்லது வரவிடாமல் செய்தல் என்ற பொதுவான வலிமையை இது இயல்பாகக் காக்கிறது.
- source_word: αὐτὰ ἐλθεῖν πρός με
  choice: அவர்களை ... என்னிடம் வர
  rationale: κωλύω உடன் வரும் வினையெச்சக் கட்டமைப்பைத் தமிழில் இயல்பாக ‘அவர்களைத் தடுக்காதீர்கள்’ என்றும், முன்னைய கட்டளையில் ‘என்னிடம் வரவிடுங்கள்’ என்றும் வெளிப்படுத்துகிறது.
- source_word: τῶν γὰρ τοιούτων
  choice: ஏனெனில், இப்படிப்பட்டவர்களுக்கே
  rationale: τοιούτων என்பது அங்கிருந்த குறிப்பிட்ட பிள்ளைகளை மட்டும் அல்லாமல், அவர்களைப் போன்ற வகையினரையும் சுட்டக்கூடும். ‘இப்படிப்பட்டவர்கள்’ அந்தப் பிரதிநிதித்துவ வலிமையைத் தக்கவைக்கிறது; ‘-க்கே’ உரிமை அல்லது சார்பு வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: பரலோக அரசாட்சி
  rationale: மத்தேயுவின் தனிச்சிறப்பான சொற்றொடரான இதை, இடப்பரப்பை மட்டும் குறிக்கும் அரசாக அல்லாமல் கடவுளின் ஆட்சியையும் உள்ளடக்கும் வகையில், நவீனத் தமிழில் ‘பரலோக அரசாட்சி’ என வழங்குகிறது.
- source_word: ἐστὶν
  choice: உரியது
  rationale: கிரேக்கத்தில் ‘இருக்கிறது’ என்ற வினைச்சொல்லுடன் உடைமை வேற்றுமை அமைப்பு வருகிறது. தமிழில் ‘உரியது’ என்பது அதன் சார்பு அல்லது உரிமைப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: இயேசு குறிப்பிட்ட பிள்ளைகளை மட்டும் சொல்கிறாரா, அல்லது அவர்களைப் போன்றவர்களையும் சொல்கிறாரா?
  choice: ‘இப்படிப்பட்டவர்களுக்கே’ என்று மொழிபெயர்த்து, உடனடியாகப் பிள்ளைகளைக் குறிப்பதையும் அவர்களைப் போன்ற வகையினரை விரிவாகக் குறிக்கக்கூடியதையும் திறந்தவாறே வைத்தல்.
  alternative: ‘இந்தப் பிள்ளைகளுக்கே’ அல்லது விளக்கமாக ‘பிள்ளைகளைப் போன்றவர்களுக்கே’ என்று மொழிபெயர்த்தல்.
  rationale: τοιούτων குறிப்பிட்ட பிள்ளைகளிலிருந்து அவர்களைப் போன்ற ஒரு வகையினருக்கு விரியும் சொல்; ஆனால் எந்தப் பண்பு கருத்தில் கொள்ளப்படுகிறது என்பதை வசனம் வெளிப்படையாக வரையறுக்கவில்லை. ஆகவே மொழிபெயர்ப்பு அந்த இறையியல் பதற்றத்தையும் பொருள் விரிவையும் தீர்மானித்து விடாமல் காக்கிறது.
- issue: τῶν ... ἐστὶν என்ற அமைப்பு உரிமையையா அல்லது அடையாளத்தையா வலியுறுத்துகிறது?
  choice: ‘பரலோக அரசாட்சி உரியது’ என்று இயல்பான தமிழில் உடைமை அல்லது சார்புப் பொருளை வெளிப்படுத்தல்.
  alternative: சொல்லுக்கு நெருக்கமாக, ‘பரலோக அரசாட்சி இப்படிப்பட்டவர்களுடையது’ என்று வழங்கல்.
  rationale: இரு வடிவங்களும் கிரேக்க உடைமை வேற்றுமை அமைப்பைப் பிரதிபலிக்கின்றன. முதன்மை உரை நவீனத் தமிழில் இயல்பாக இருக்கிறது; அடிக்குறிப்பு மேலும் சொல்லுக்கு நெருக்கமான வடிவத்தைத் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியும் கண்ணியமுமான உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘வரவிடுங்கள்’ மற்றும் ‘தடுக்காதீர்கள்’ ஆகியவை சாதாரண வாசகர்களுக்கு உடனடியாகப் புரியும் இயல்பான கட்டளைகள். ‘பரலோக அரசாட்சி’ என்பது βασιλεία என்பதின் ஆட்சி சார்ந்த பரப்பைத் தக்கவைக்கிறது; எந்தச் சபை மரபிற்கும் உரிய தனிப்பட்ட சொல்லாட்சியையோ விளக்கத்தையோ சேர்க்கவில்லை.
