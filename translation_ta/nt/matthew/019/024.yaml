source:
  edition: SBLGNT
  text: πάλιν δὲ λέγω ὑμῖν, εὐκοπώτερόν ἐστιν κάμηλον διὰ ⸀τρυπήματος ῥαφίδος ⸀εἰσελθεῖν ἢ πλούσιον ⸂εἰς τὴν βασιλείαν τοῦ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/024.yaml
  text: Again I tell you[b][a], it is easier for a camel to go through the eye of a needle than for a rich man to enter into the kingdom of God.
translation:
  language: ta
  text: 'மீண்டும் நான் உங்களுக்குச் சொல்கிறேன்: ஒரு செல்வந்தர் கடவுளுடைய அரசாட்சிக்குள் நுழைவதைவிட, ஓர் ஒட்டகம் ஊசியின் காதின் வழியாக நுழைவது எளிது.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சிலர் ‘ஒட்டகம்’ என்பதற்குப் பதிலாக ‘கயிறு’ என்று முன்மொழிந்துள்ளனர்; ஆனால் இங்குள்ள கிரேக்க மூலவாசகம் ‘ஒட்டகம்’ என்றே கூறுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: πάλιν δὲ λέγω ὑμῖν
  choice: மீண்டும் நான் உங்களுக்குச் சொல்கிறேன்
  rationale: πάλιν என்பதன் மீண்டும் என்ற பொருளையும் நேரடி உரையாடல் சூத்திரத்தின் வலிமையையும் இயல்பான நவீன தமிழில் தருகிறது; δέ இங்கு மென்மையான இணைப்பாக இருப்பதால் தனியாக மொழிபெயர்க்கப்படவில்லை.
- source_word: εὐκοπώτερόν ἐστιν
  choice: எளிது
  rationale: இரு இறந்தகால வினையெச்சக் கருத்துகளை ஒப்பிடும் கிரேக்க ஒப்பீட்டு வடிவத்தை தமிழில் இயல்பான ‘...விட ... எளிது’ அமைப்பில் வழங்குகிறது.
- source_word: κάμηλον
  choice: ஓர் ஒட்டகம்
  rationale: SBLGNT வாசகம் κάμηλον என்பதால் நேரடியாக ‘ஒட்டகம்’ என்று மொழிபெயர்க்கப்படுகிறது; ‘கயிறு’ என்ற ஊகத்தை மூலவாசகத்திற்குப் பதிலாக ஏற்கவில்லை.
- source_word: διὰ τρυπήματος ῥαφίδος
  choice: ஊசியின் கண்ணின் வழியாக
  rationale: தையல் ஊசியின் துளையைச் சுட்டும் சொற்றொடரைத் தெளிவாகவும் தமிழின் வழக்கமான உருவக மொழியிலும் தருகிறது.
- source_word: εἰσελθεῖν
  choice: நுழைவது
  rationale: துளையின் வழியாகச் செல்லுதல் மற்றும் அரசாட்சிக்குள் செல்லுதல் ஆகிய இரு ஒப்பீட்டுக் கூறுகளிலும் ஒரே கிரேக்க வினை வருவதால், தமிழிலும் ‘நுழைவது’ என ஒருமைப்பாடு காக்கப்படுகிறது.
- source_word: ἢ πλούσιον
  choice: ஒரு செல்வந்தர் ... என்பதைவிட
  rationale: πλούσιον ஒரு செல்வமுள்ள நபரைச் சுட்டுகிறது. நவீன மரியாதை ஒருமை நடையில் ‘செல்வந்தர்’ என்பது இயல்பாகவும் பாலினத்தைத் தேவையின்றி முன்னிறுத்தாமலும் உள்ளது.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: கடவுளுடைய அரசாட்சிக்குள்
  rationale: βασιλεία என்பதில் இடத்தை மட்டும் அல்ல, கடவுளின் ஆட்சியையும் குறிக்கும் கருத்து இருப்பதால் ‘அரசாட்சி’ தேர்ந்தெடுக்கப்பட்டது; εἰς என்பதன் இயக்கத் தன்மையை ‘-க்குள்’ காக்கிறது.
theological_decisions:
- issue: ஒட்டகம்–ஊசிக்கண் உருவகத்தின் விளக்கம்
  choice: மூலத்தில் உள்ள தீவிரமான மிகைப்படுத்தல் உருவகத்தை அப்படியே வைத்தல்
  alternative: இதை எருசலேமிலிருந்ததாகக் கூறப்படும் ஒரு சிறிய ‘ஊசி வாசல்’ என விளக்குதல் அல்லது ‘ஒட்டகம்’ என்பதற்குப் பதில் ‘கயிறு’ என வாசித்தல்
  rationale: கிரேக்க வாசகம் நேரடியாக ஒட்டகத்தையும் தையல் ஊசியின் துளையையும் குறிப்பிடுகிறது. உருவகத்தின் கடுமையை மென்மையாக்க மூலத்தில் ஆதாரம் இல்லை; அடுத்த வசனத்தின் சூழலில் உள்ள மனித இயலாமை குறித்த பதற்றமும் இவ்வாறு பாதுகாக்கப்படுகிறது.
- issue: βασιλεία τοῦ θεοῦ என்பதன் மொழிபெயர்ப்பு
  choice: கடவுளுடைய அரசாட்சி
  alternative: தேவனுடைய ராஜ்யம்
  rationale: ‘அரசாட்சி’ என்பது ஆளுகை மற்றும் அரசுரிமை ஆகிய கருத்துகளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; இங்கு அதை வெறும் நிலப்பரப்பாகக் குறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயினும் கண்ணியமான நேரடி உரை. ‘செல்வந்தர்’ மரியாதை ஒருமையாகப் பயன்படுத்தப்பட்டுள்ளது. ‘ஊசியின் கண்’ என்ற புரிந்துகொள்ளத்தக்க தமிழ் உருவகம் காக்கப்பட்டுள்ளது.
