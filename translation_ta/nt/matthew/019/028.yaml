source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι ὑμεῖς οἱ ἀκολουθήσαντές μοι ἐν τῇ παλιγγενεσίᾳ, ὅταν καθίσῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ θρόνου δόξης αὐτοῦ, ⸀καθήσεσθε καὶ ⸀ὑμεῖς ἐπὶ δώδεκα θρόνους κρίνοντες τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/028.yaml
  text: And Jesus said to them[a], “Truly I say to you, you who have followed me will also sit on twelve thrones in the renewal, when the Son of Man sits on the throne of his glory[b], judging the twelve tribes of Israel.”
translation:
  language: ta
  text: 'இயேசு அவர்களிடம், “உறுதியாக உங்களுக்குச் சொல்கிறேன்: புதுப்படைப்பில்[a], மானிடமகன் தமது மகிமையின் அரியணையில் அமரும்போது, என்னைப் பின்பற்றிய நீங்களும் பன்னிரண்டு அரியணைகளில் அமர்ந்து, இஸ்ரவேலின் பன்னிரண்டு கோத்திரங்களுக்கும் தீர்ப்பளிப்பீர்கள்[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘புதுப்படைப்பு’ என்பதற்கு ‘மறுஉருவாக்கம்,’ ‘புதிய உலகம்,’ அல்லது ‘மறுபிறப்பு’ என்றும் மொழிபெயர்க்கலாம். இங்கு இது பெரும்பாலும் தனிநபரின் மறுபிறப்பை அல்ல, மானிடமகனின் ஆட்சியோடு தொடர்புடைய எதிர்காலப் புதுப்பித்தலைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘தீர்ப்பளிப்பீர்கள்’ என்பது ஆட்சி செய்வது அல்லது நிர்வகிப்பது என்ற பொருளையும் உள்ளடக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: உறுதியாக
  rationale: இது அதிகாரபூர்வமான, வலியுறுத்தப்பட்ட கூற்றை அறிமுகப்படுத்துகிறது; ‘உறுதியாக’ என்பது நவீன தமிழில் இயல்பாக அதன் வலிமையைத் தருகிறது.
- source_word: ἀκολουθήσαντές μοι
  choice: என்னைப் பின்பற்றிய நீங்கள்
  rationale: இயேசுவைப் பின்பற்றிய செயலை அடிப்படையாகக் கொண்டு உரையாடப்படுவோரை அடையாளப்படுத்துகிறது; ‘என்னை’ என்ற நேரடிப் பொருளையும் வெளிப்படையாக வைத்திருக்கிறது.
- source_word: παλιγγενεσίᾳ
  choice: புதுப்படைப்பில்
  rationale: இச்சூழலில் தனிநபரின் மறுபிறப்பைக் காட்டிலும், மானிடமகனின் அரியணையேற்றத்தோடு தொடர்புடைய எதிர்கால உலகப் புதுப்பிப்பைக் குறிக்கிறது. ‘புதுப்படைப்பு’ அதன் மறுஉருவாக்கம்/புதுப்பித்தல் சார்ந்த பரப்பைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ὅταν καθίσῃ
  choice: அமரும்போது
  rationale: எதிர்கால நிகழ்வைக் குறிக்கும் காலத் துணைவாக்கியத்தை இயல்பான தமிழில் வழங்குகிறது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மானிடமகன்
  rationale: இயேசுவின் பட்டப்பெயருக்கான மரபான, உயர்நடையுடைய தமிழாக்கம்; அதன் தானியேல் நூல் மற்றும் மெசியா தொடர்புகளைக் காக்கிறது.
- source_word: ἐπὶ θρόνου δόξης αὐτοῦ
  choice: தமது மகிமையின் அரியணையில்
  rationale: கிரேக்க மொழியின் உரிமைத் தொடர்பை நெருக்கமாகக் காத்து, உயர்ந்த தொனியையும் தெளிவையும் வழங்குகிறது.
- source_word: καθήσεσθε καὶ ὑμεῖς
  choice: நீங்களும் ... அமர்ந்து
  rationale: மானிடமகன் அமர்வதுடன் சீடர்களும் அமர்வார்கள் என்ற καί-யின் இணை வலியுறுத்தலை ‘நீங்களும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐπὶ δώδεκα θρόνους
  choice: பன்னிரண்டு அரியணைகளில்
  rationale: எண்ணிக்கையையும் அரியணை சார்ந்த அதிகாரப் படிமத்தையும் நேரடியாகக் காக்கிறது.
- source_word: κρίνοντες
  choice: தீர்ப்பளிப்பீர்கள்
  rationale: வினையின் முதன்மையான நீதித்துறைப் பொருளைக் காக்கிறது; ஆட்சி செய்வது என்ற விரிவான நுணுக்கத்தை அடிக்குறிப்பில் குறிப்பிடுகிறது.
- source_word: φυλὰς τοῦ Ἰσραήλ
  choice: இஸ்ரவேலின் பன்னிரண்டு கோத்திரங்கள்
  rationale: இஸ்ரவேலின் பழங்குடிப் பிரிவுகளைக் குறிக்கும் வழக்கமான, துல்லியமான வேதாகமச் சொற்றொடர்.
theological_decisions:
- issue: இச்சூழலில் παλιγγενεσία என்பதன் பொருள்
  choice: மானிடமகனின் அரியணையேற்றத்துடன் தொடர்புடைய எதிர்காலப் புதுப்படைப்பு
  alternative: தனிநபரின் மறுபிறப்பு; புதிய காலம்; புதிய உலகம்
  rationale: உடனடிச் சூழல் தனிப்பட்ட மனமாற்றத்தைப் பற்றியதல்ல; எதிர்கால அரியணையேற்றத்தையும் தீர்ப்பையும் பற்றியது. எந்தக் குறிப்பிட்ட ஆயிரமாண்டுக் கோட்பாட்டையும் சேர்க்காமல் காலமுடிவு சார்ந்த புதுப்பித்தலை மொழிபெயர்ப்பு காட்டுகிறது.
- issue: κρίνοντες என்பதன் பரப்பு
  choice: தீர்ப்பளித்தல்
  alternative: ஆட்சி செய்தல்; நிர்வகித்தல்
  rationale: இச்சொல் நீதித்துறை அதிகாரத்தோடு ஆட்சியையும் உள்ளடக்கக்கூடும்; எனினும் அதன் நேரடிப் பொருளான ‘தீர்ப்பளித்தல்’ முதன்மை உரையில் வைக்கப்பட்டு, விரிவான நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
