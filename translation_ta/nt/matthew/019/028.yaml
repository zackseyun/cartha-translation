  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. ‘மானிடமகன்,’ ‘அரியணை,’ ‘கோத்திரம்’ போன்ற நிலைபெற்ற சொற்கள் தெய்வவியல் மற்றும் இலக்கியத் தொடர்புகளைப் பாதுகாக்கின்றன; வாக்கிய அமைப்பு தமிழில் இயல்பாக இருக்குமாறு வடிவமைக்கப்பட்டுள்ளது.
