id: MAT.19.27
reference: Matthew 19:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τότε ἀποκριθεὶς ὁ Πέτρος εἶπεν αὐτῷ· Ἰδοὺ ἡμεῖς ἀφήκαμεν πάντα καὶ ἠκολουθήσαμέν σοι· τί ἄρα ἔσται ἡμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/027.yaml
  text: Then Peter answered him, “Look, we have left everything and followed you. What then will there be for us?”
translation:
  language: ta
  text: 'அப்போது பேதுரு அவருக்குப் பதிலளித்துச் சொன்னார்: “இதோ, நாங்கள் எல்லாவற்றையும் விட்டுவிட்டு உம்மைப் பின்பற்றினோம். அப்படியானால் எங்களுக்கு என்ன இருக்கும்?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் மூலச்சொல்லின் வலிமையை இயல்பான, கண்ணியமான தமிழில் தக்கவைக்கிறது.
- source_word: ἀφήκαμεν πάντα
  choice: எல்லாவற்றையும் விட்டுவிட்டு
  rationale: சீடர்கள் அனைத்தையும் கைவிட்டதை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἠκολουθήσαμέν σοι
  choice: உம்மைப் பின்பற்றினோம்
  rationale: சீடத்துவத்தைச் சுட்டும் வழக்கமான தமிழ் வேதாகமச் சொல்லாக்கத்தைப் பயன்படுத்துகிறது.
- source_word: τί ἄρα ἔσται ἡμῖν
  choice: அப்படியானால் எங்களுக்கு என்ன கிடைக்கும்?
  rationale: ἄρα காட்டும் முடிவுறுத்தும் தொடர்பையும், ἔσται ἡμῖν என்பதன் ‘எங்களுக்கு என்ன உண்டாகும்/கிடைக்கும்’ என்ற பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பேதுருவின் கேள்வி எதிர்பார்க்கும் பலனின் தன்மை
  choice: எங்களுக்கு என்ன கிடைக்கும்?
  alternative: எங்களுக்கு என்ன இருக்கும்?
  rationale: கேள்வி எந்த வகையான பலனைச் சுட்டுகிறது என்பதை விளக்கிச் சொல்லாமல், சூழலில் இயல்பாகப் புரியும் வகையில் திறந்த நிலையிலேயே வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; இயேசுவை நோக்கிய உரையில் கண்ணியமான ‘உம்மை’ பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தில் ‘பதில் கூறி சொன்னார்’ என்ற வடிவம் தமிழில் இயல்பாக ‘என்று கேட்டார்’ என வழங்கப்பட்டுள்ளது.
