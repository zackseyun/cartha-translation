lexical_decisions:
- source_word: Τίμα
  choice: உரிய மதிப்பளி
  rationale: τιμάω என்பது உள்ளார்ந்த மரியாதையை மட்டும் அல்லாமல், பெற்றோருக்குச் செலுத்த வேண்டிய மதிப்பைச் செயலில் காட்டுவதையும் குறிக்கிறது. «உரிய மதிப்பளி» என்பது கட்டளையின் நெறிசார் வலிமையை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: உன் தந்தைக்கும் தாய்க்கும்
  rationale: கிரேக்கத்தில் உடைமைப்பெயர் வெளிப்படையாக இல்லாவிட்டாலும், பத்துக் கட்டளையின் நேரடி அழைப்பு சூழலில் தமிழில் «உன்» என்பதைச் சேர்ப்பது பொருளைத் துல்லியமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: Ἀγαπήσεις
  choice: அன்புகூர்
  rationale: இது வடிவத்தில் எதிர்கால வினைமுற்றாக இருந்தாலும், தோரா மேற்கோளில் கட்டளையின் வலிமையைக் கொண்டுள்ளது. பட்டியலில் உள்ள நேரடிக் கட்டளையாக நவீனத் தமிழில் «அன்புகூர்» இயல்பாக அமைகிறது; வடிவத்துக்கு நெருக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τὸν πλησίον σου
  choice: உனக்கு அடுத்திருப்பவரிடம்
  rationale: πλησίον என்பது இங்கு வெறும் இடரீதியான அருகாமையை மட்டும் குறிக்காமல், ஒருவர் தொடர்புகொள்ளும் சக மனிதரைக் குறிக்கிறது. «உனக்கு அடுத்திருப்பவர்» அந்த உறவுசார் பரப்பைத் திறந்த நிலையில் வைத்தபடி சாதாரண வாசகருக்குப் புரியும் வகையில் உள்ளது.
- source_word: ὡς σεαυτόν
  choice: உன்னைப்போல்
  rationale: ஒப்பீட்டின் சுருக்கத்தைக் காக்கிறது; «நீ உன்னிடம் அன்புகூருவதுபோல்» என்ற விளக்கத்தை மூலத்தில் இல்லாமல் சேர்ப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: கட்டளைகளை மேற்கோள் காட்டும்போது வரும் வினை வடிவங்களின் வேறுபாடு
  choice: 'முதன்மை உரையில் இரண்டையும் நேரடிக் கட்டளைகளாக மொழிபெயர்த்தல்: «மதிப்பளி ... அன்புகூர்.»'
  alternative: «உன் தந்தைக்கும் தாய்க்கும் உரிய மதிப்பளி; உன்னைப்போல் உனக்கு அடுத்திருப்பவரிடமும் அன்புகூருவாய்.»
  rationale: கிரேக்கம் Τίμα என்ற கட்டளை வினையையும் Ἀγαπήσεις என்ற எதிர்கால வினைமுற்றையும் இணைக்கிறது; பின்னையது தோராவின் கட்டளை மொழியை மேற்கோள் காட்டுகிறது. தமிழில் இரண்டையும் நேரடிக் கட்டளைகளாகத் தருவது பட்டியலின் ஒருமையையும் கட்டளையின் வலிமையையும் இயல்பாகக் காக்கிறது. அதேவேளை, மூல வடிவ வேறுபாட்டை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் அதேவேளை கண்ணியமான கட்டளை நடையைப் பயன்படுத்துகிறது. பழமையான «கனம் பண்ணு» என்பதற்குப் பதிலாக «உரிய மதிப்பளி» என்றும், வழக்கில் தெளிவிழக்கக்கூடிய «பிறன்» என்பதற்குப் பதிலாக «உனக்கு அடுத்திருப்பவர்» என்றும் தேர்ந்தெடுக்கப்பட்டுள்ளது.
