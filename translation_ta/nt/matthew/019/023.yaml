id: MAT.19.23
reference: Matthew 19:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Ἀμὴν λέγω ὑμῖν ὅτι ⸂πλούσιος δυσκόλως⸃ εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/023.yaml
  text: Then Jesus said to his disciples[a], “Truly I say to you[b], a rich man will enter the kingdom of heaven with difficulty.”
translation:
  language: ta
  text: 'அப்போது இயேசு தம் சீடர்களிடம், “உண்மையாகவே[a] உங்களுக்குச் சொல்கிறேன்: ஒரு செல்வந்தன் பரலோக அரசுக்குள் நுழைவது கடினம்[b]” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “ஆமென், உங்களுக்குச் சொல்கிறேன்.”'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஒரு செல்வந்தன் பரலோக அரசுக்குள் சிரமத்துடனே நுழைவான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: அப்போது
  rationale: கதைநிகழ்வின் அடுத்த கட்டத்துக்கு மாறுவதை இயல்பான தமிழில் குறிக்கிறது.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: தம் சீடர்களிடம்
  rationale: αὐτοῦ என்பதன் உடைமைப் பொருளைத் தக்கவைத்து, இயேசுவைக் குறிக்கும் மரியாதை ஒருமைக்கு ஏற்ற ‘தம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: உண்மையாகவே உங்களுக்குச் சொல்கிறேன்
  rationale: இயேசுவின் உறுதியும் அதிகாரமும் நிறைந்த தொடக்கச் சூத்திரத்தைத் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது; ‘ஆமென்’ என்ற நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: πλούσιος
  choice: ஒரு செல்வந்தன்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் ஆண்பால் ஒருமை அடைமொழியைத் துல்லியமாகக் காட்டுகிறது.
- source_word: δυσκόλως
  choice: நுழைவது கடினம்
  rationale: ‘சிரமத்துடன்’ என்ற முறையைக் குறிக்கும் பொருளை இயல்பான தமிழ் வாக்கிய அமைப்பில் தருகிறது; முற்றிலும் இயலாது என்று மிகைப்படுத்தவில்லை.
- source_word: εἰσελεύσεται
  choice: நுழைவது
  rationale: எதிர்கால வினையின் பொதுவான கூற்றுப் பொருளை, ‘கடினம்’ என்பதுடன் இயல்பாக இணையும் தமிழ் வினைப்பெயர் அமைப்பில் தெரிவிக்கிறது.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: பரலோக அரசு
  rationale: மத்தேயுவுக்குரிய சொற்றொடரை அறிமுகமான தமிழில் தருகிறது; ‘அரசு’ என்பது ஆட்சி மற்றும் அரசுலகம் ஆகிய பொருள் பரப்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: πλούσιος என்ற ஆண்பால் ஒருமை வடிவம்
  choice: ஒரு செல்வந்தன்
  alternative: ஒரு செல்வந்தர் / செல்வமுள்ள ஒருவர்
  rationale: கிரேக்கத்தின் ஆண்பால் ஒருமை வடிவத்தை பாலினப் பொதுமைப்படுத்தல் இன்றி தக்கவைக்கிறது; அதேவேளை இது பிரதிநிதித்துவத் தன்மையுள்ள பொதுக்கூற்று என்பதையும் சூழல் காட்டுகிறது.
- issue: Ἀμὴν என்ற இயேசுவின் தொடக்கச் சூத்திரம்
  choice: உண்மையாகவே
  alternative: ஆமென்
  rationale: கூற்றின் உறுதியையும் சிறப்பான அதிகாரத் தொனியையும் சாதாரண வாசகருக்குத் தெளிவாகக் கொடுக்கிறது; மூலச் சொல்லின் ஒலிபெயர்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: δυσκόλως என்பதன் வலிமை
  choice: கடினம்
  alternative: நுழைவது அரிது
  rationale: இவ்வசனத்திலேயே ஏறக்குறைய இயலாமை என்ற கருத்தைத் திணிக்காமல், ‘சிரமத்துடன்’ என்ற மூல அடை வினையின் பொருளைத் தக்கவைக்கிறது; அடுத்த வசனத்தின் தீவிரப்படுத்தலையும் முன்கூட்டியே உட்கொள்வதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘தம்’ மரியாதை ஒருமையைப் பேணுகிறது. ‘பரலோக அரசு’ பரவலாகப் புரியக்கூடியதாகவும், குறிப்பிட்ட சமயப் பிரிவின் தனிச்சொல்லாட்சியைத் தவிர்ப்பதாகவும் உள்ளது.
