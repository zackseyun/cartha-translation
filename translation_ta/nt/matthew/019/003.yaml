source:
  edition: SBLGNT
  text: Καὶ προσῆλθον ⸀αὐτῷ Φαρισαῖοι πειράζοντες αὐτὸν καὶ ⸀λέγοντες· Εἰ ἔξεστιν ⸀ἀνθρώπῳ ἀπολῦσαι τὴν γυναῖκα αὐτοῦ κατὰ πᾶσαν αἰτίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/003.yaml
  text: And Pharisees came up to him[a], testing him and saying, “Is it lawful for a man to divorce his wife for any cause?”
translation:
  language: ta
  text: பரிசேயர்கள் அவரிடம் வந்து, அவரைச் சோதித்தபடி, “ஒருவன் தன் மனைவியை எந்தக் காரணத்திற்காகவும்[a] விவாகரத்து செய்வது சட்டப்படி அனுமதிக்கப்பட்டதா?” என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எந்த அடிப்படையிலாவது” அல்லது “ஒவ்வொரு காரணத்திற்காகவும்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடர், விவாகரத்தை அனுமதிக்கும் காரணங்கள் குறித்த ஒரு பரந்த சட்டக் கேள்வியைப் பிரதிபலிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον
  choice: அவரிடம் வந்து
  rationale: προσέρχομαι என்பது ஒருவரை நோக்கி வருதல் அல்லது அணுகுதல் என்பதைக் குறிக்கிறது. “அவரிடம் வந்து” என்பது அதன் திசைநோக்கை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: πειράζοντες
  choice: அவரைச் சோதித்தபடி
  rationale: πειράζω என்பதற்கு சோதித்தல், முயன்று பார்த்தல், தூண்டுதல் போன்ற பொருள்கள் உண்டு. இங்கு எதிர்மறையான உள்நோக்கம் சூழலால் புலப்பட்டாலும், “சோதித்தபடி” என்பது அதை விளக்கமாகக் கூட்டிச் சொல்லாமல் மூலச்சொல்லின் பொருள் வீச்சைப் பாதுகாக்கிறது.
- source_word: ἔξεστιν
  choice: சட்டப்படி அனுமதிக்கப்பட்டதா
  rationale: சட்டம் அல்லது சமயச் சட்டம் சார்ந்த விவாதத்தில் ἔξεστιν என்பது அனுமதி உண்டா, சட்டபூர்வமானதா என்ற கேள்வியைக் குறிக்கிறது. இந்தத் தமிழ் வடிவம் சட்ட விவாதத்தின் தன்மையைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἀνθρώπῳ
  choice: ஒருவன்
  rationale: இச்சொல் பொதுவாக மனிதர் என்பதைக் குறிக்கக்கூடியது; ஆனால் “தன் மனைவி” என்ற உடனடிச் சூழலில் கணவனாகிய ஆணே குறிப்பாகக் கருதப்படுகிறார். “ஒருவன்” இதைச் சுருக்கமாகவும் துல்லியமாகவும் தருகிறது.
- source_word: ἀπολῦσαι
  choice: மணவிலக்கு செய்வது
  rationale: ἀπολύω என்பதன் அடிப்படைப் பொருள் அனுப்பிவிடுதல் அல்லது விடுவித்தல். திருமணச் சூழலில் இது சட்டபூர்வமான மணவிலக்கைக் குறிக்கும் மரபுச் சொல் என்பதால், நவீன தமிழில் நேரடியாக “மணவிலக்கு செய்வது” என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: தன் மனைவியை
  rationale: γυνή என்பது பெண் அல்லது மனைவி எனப் பொருள்படும். உடைமைச் சுட்டும் மணவிலக்குச் சூழலும் இருப்பதால் இங்கு “மனைவி” என்பதே தேவை; தமிழ் இயல்புக்கேற்ப αὐτοῦ “தன்” என வழங்கப்பட்டுள்ளது.
- source_word: κατὰ πᾶσαν αἰτίαν
  choice: எந்தக் காரணத்திற்காகவும்
  rationale: இந்தச் சொற்றொடர் மணவிலக்கிற்கு ஏதாவது ஒரு காரணம் போதுமா என்ற பரந்த சட்டக் கேள்வியை முன்வைக்கிறது. “எந்தக் காரணத்திற்காகவும்” அதன் விரிவையும் உண்மையான பொருள் நெகிழ்வையும் பாதுகாக்கிறது.
theological_decisions:
- issue: மணவிலக்கிற்கான காரணங்கள் குறித்த முதல் நூற்றாண்டுச் சட்ட விவாதத்தைப் பிற்காலச் சபைப் பிரிவுகளின் நிலைப்பாடுகளால் குறுக்காமல் வழங்குதல்
  choice: ஒருவன் எந்தக் காரணத்திற்காகவும் தன் மனைவியை மணவிலக்கு செய்வது சட்டப்படி அனுமதிக்கப்பட்டதா?
  alternative: ஒரு கணவன் எந்த அடிப்படையிலாவது தன் மனைவியை மணவிலக்கு செய்யலாமா?
  rationale: இவ்வசனம் இயேசுவிடம் முன்வைக்கப்பட்ட சட்டக் கேள்வியை மட்டுமே பதிவு செய்கிறது; அதற்கான இறையியல் தீர்வை இன்னும் கூறவில்லை. தேர்ந்தெடுக்கப்பட்ட வடிவம் கேள்வியின் பரந்த தன்மையையும் சட்டப் பின்னணியையும் காத்து, குறிப்பிட்ட மணவிலக்குக் கொள்கையை முன்கூட்டியே புகுத்துவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. “மணவிலக்கு” சட்டச் சூழலைத் தெளிவாகக் காட்டுகிறது; கேள்வியின் பகைமைமிக்க பின்னணி “சோதித்தபடி” என்பதிலும் கதையின் சூழலிலும் வெளிப்படுமாறு வைக்கப்பட்டுள்ளது.
