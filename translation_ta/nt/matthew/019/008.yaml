source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὅτι Μωϋσῆς πρὸς τὴν σκληροκαρδίαν ὑμῶν ἐπέτρεψεν ὑμῖν ἀπολῦσαι τὰς γυναῖκας ὑμῶν, ἀπ’ ἀρχῆς δὲ οὐ γέγονεν οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/008.yaml
  text: He said to them[a], “Because of your hardness of heart Moses permitted you to divorce your wives[c][b], but from the beginning it has not been so.”
translation:
  language: ta
  text: அவர் அவர்களிடம், “உங்கள் இதயக் கடினத்தினால் மோசே உங்கள் மனைவிகளை விவாகரத்து செய்ய உங்களை அனுமதித்தார்[a]. ஆனால் தொடக்கத்திலிருந்து அப்படி இருந்ததில்லை” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “விவாகரத்து செய்ய” என்பதன் நேரடிப் பொருள் “அனுப்பிவிட” என்பதாகும்; இச்சூழலில் அது மணவிலக்கைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: அவர் அவர்களிடம் … என்றார்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டாலும், நவீனத் தமிழ் கதைநடையில் இறந்தகாலமான ‘என்றார்’ இயல்பாக உள்ளது.
- source_word: πρὸς τὴν σκληροκαρδίαν ὑμῶν
  choice: உங்கள் இதயக் கடினத்தினால்
  rationale: πρός இங்கு காரணம் அல்லது அடிப்படையைக் குறிக்கிறது. ‘இதயக் கடினம்’ என்ற வேதாகம உருவகத்தைத் தக்கவைத்து, காரணத் தொடர்பை ‘-னால்’ தெளிவாக்குகிறது.
- source_word: ἐπέτρεψεν
  choice: அனுமதித்தார்
  rationale: இச்சொல் கட்டளையிடுதலை அல்ல, அனுமதி அளித்தலைக் குறிக்கிறது; மோசேயின் ஏற்பாடு ஒரு சலுகை என்பதைச் சரியாக வெளிப்படுத்துகிறது.
- source_word: ἀπολῦσαι
  choice: விவாகரத்து செய்ய
  rationale: பொதுவாக ‘அனுப்பிவிடுதல்’ என்று பொருள்படக்கூடிய இச்சொல், இங்குள்ள திருமணச் சூழலில் சட்டரீதியான மணவிலக்கைக் குறிக்கிறது.
- source_word: τὰς γυναῖκας ὑμῶν
  choice: உங்கள் மனைவியரை
  rationale: γυνή என்பதற்கு ‘பெண்’ அல்லது ‘மனைவி’ என்று பொருள் வரலாம்; திருமணம் மற்றும் மணவிலக்கைப் பற்றிய இச்சூழலில் ‘மனைவி’ என்பதே பொருத்தமானது.
- source_word: ἀπ’ ἀρχῆς
  choice: தொடக்கத்திலிருந்து
  rationale: படைப்பின் தொடக்கத்தைச் சுட்டும் உடனடிச் சூழலை விரிவாக்காமல், மூலத்தின் சுருக்கமான குறிப்பைத் தக்கவைக்கிறது.
- source_word: οὐ γέγονεν οὕτως
  choice: அப்படி இருக்கவில்லை
  rationale: γέγονεν என்ற நிறைவுக்கால வடிவம் நிலவிய நிலைமையைச் சுட்டுகிறது. ‘அப்படி இருக்கவில்லை’ என்பது இயல்பான தமிழில் அந்த நிலைப்பொருளைத் தருகிறது; ‘அப்படி நிகழவில்லை’ என்று சம்பவமாக மட்டும் குறுக்காது.
theological_decisions:
- issue: மோசேயின் செயலைக் கட்டளையாகவா, அனுமதியாகவா சித்தரிப்பது
  choice: மோசே … அனுமதித்தார்
  alternative: மோசே … கட்டளையிட்டார்
  rationale: ἐπέτρεψεν என்பது அனுமதியையே குறிக்கிறது, நேர்மறையான கட்டளையை அல்ல. மனித இதயக் கடினத்தைக் கருத்தில் கொண்ட சலுகைக்கும் படைப்பின் தொடக்க நிலைக்கும் இடையிலான இயேசுவின் வேறுபாட்டை இது பாதுகாக்கிறது.
- issue: தொடக்கத்தைப் பற்றிய இயேசுவின் குறிப்பை விளக்கி விரிவாக்குவதா
  choice: ஆனால் தொடக்கத்திலிருந்து அப்படி இருக்கவில்லை
  alternative: ஆனால் தொடக்கத்தில் இது கடவுளுடைய திட்டமாக இருக்கவில்லை
  rationale: மூலத்தில் வெளிப்படையாக இல்லாத ‘கடவுளுடைய திட்டம்’ போன்ற விளக்கத்தை முதன்மை உரைக்குள் சேர்க்காமல், படைப்பை நோக்கிய குறிப்பின் பொருளைச் சூழலே தெரிவிக்க விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘விவாகரத்து’ என்பது இன்றைய தமிழில் தெளிவான சட்ட-சமூகச் சொல்; மூல உருவகமான ‘இதயக் கடினம்’ தக்கவைக்கப்பட்டுள்ளது.
