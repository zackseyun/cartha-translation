source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ· Τί με ⸂ἐρωτᾷς περὶ τοῦ ἀγαθοῦ; εἷς ἐστιν ὁ ἀγαθός⸃· εἰ δὲ θέλεις ⸂εἰς τὴν ζωὴν εἰσελθεῖν⸃, ⸀τήρησον τὰς ἐντολάς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/017.yaml
  text: And he said to him[a], “Why do you ask me about what is good? One is good. But if you want to enter into life[b], keep the commandments.”
translation:
  language: ta
  text: அவர் அவனிடம்[a], “நல்லது எது என்று என்னிடம் ஏன் கேட்கிறாய்? நல்லவர் ஒருவரே. ஆனால் நீ வாழ்வுக்குள் நுழைய விரும்பினால், கட்டளைகளைக் கடைப்பிடி” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளிலும் இணை நிகழ்வுகளிலும், “என்னை ஏன் நல்லவர் என்று அழைக்கிறாய்? ஒருவரைத் தவிர நல்லவர் எவருமில்லை—அவர் தேவன்” என்று உள்ளது. ஆனால் SBLGNT மத்தேயு உரை, “நல்லது எது என்று என்னிடம் ஏன் கேட்கிறாய்? நல்லவர் ஒருவரே” என்று வாசிக்கிறது.
    reason: textual_variant
lexical_decisions:
- source_word: Τί με ἐρωτᾷς περὶ τοῦ ἀγαθοῦ
  choice: நல்லது எது என்று என்னிடம் ஏன் கேட்கிறாய்?
  rationale: τοῦ ἀγαθοῦ என்பதை ஒருவரைக் குறிக்கும் ஆண்பால் சொல்லாக அல்லாமல், ‘நல்லது’ என்பதைக் குறிக்கும் நடுநிலைப் பெயரடைப் பயன்பாடாக எடுத்துக்கொள்கிறது. இதனால் மத்தேயுவின் உடனடி கிரேக்கச் சொற்றொடர் இணை நிகழ்வுகளோடு ஒத்திசைக்கப்படாமல் பாதுகாக்கப்படுகிறது.
- source_word: εἷς ἐστιν ὁ ἀγαθός
  choice: நல்லவர் ஒருவரே
  rationale: கிரேக்கத்தின் தனித்துவமான வலியுறுத்தலை இயல்பான நவீன தமிழில் தருகிறது. ‘ஒருவரே நல்லவர்’ என்பதும் சாத்தியம்; ஆனால் இத்தேர்வு ὁ ἀγαθός என்பதன் ஆளைக் குறிக்கும் பயன்பாட்டைத் தெளிவாகக் காட்டுகிறது, அந்த ஒருவர் யார் என்பதை மொழிபெயர்ப்பிலேயே சேர்ப்பதில்லை.
- source_word: εἰ δὲ θέλεις
  choice: ஆனால் நீ ... விரும்பினால்
  rationale: θέλω என்பதன் விருப்பம் அல்லது நோக்கம் என்ற பொருளை இயல்பாகத் தருகிறது; δέ இங்குள்ள மென்மையான எதிர்மறைத் திருப்பாக ‘ஆனால்’ என்று மொழிபெயர்க்கப்படுகிறது.
- source_word: εἰς τὴν ζωὴν εἰσελθεῖν
  choice: வாழ்வுக்குள் நுழைய
  rationale: εἰς என்ற திசைநோக்குப் பொருளைப் பாதுகாத்து, இங்கு சொல்லப்படாத ‘நித்திய’ என்ற விளக்கத்தைச் சேர்க்காமல் நிறைவான அல்லது இறுதிக்கால வாழ்வைக் குறிக்கும் திறந்த பொருளை வைத்திருக்கிறது.
- source_word: τήρησον τὰς ἐντολάς
  choice: கட்டளைகளைக் கடைப்பிடி
  rationale: கட்டளைகள் தொடர்பில் τηρέω என்பதற்கு நவீன தமிழில் இயல்பான ‘கடைப்பிடி’ பயன்படுத்தப்படுகிறது; ἐντολάς என்பதன் தெய்வீகக் கட்டளைகள் சார்ந்த நிறையும் தக்கவைக்கப்படுகிறது.
theological_decisions:
- issue: இயேசுவின் கூற்றுக்கும் தெய்வீக நன்மைக்கும் கிறிஸ்துவியலுக்கும் உள்ள தொடர்பு
  choice: மத்தேயுவின் வாசகத்தின்படி கேள்வியை ‘நல்லது எது’ என்றும் பதிலை ‘நல்லவர் ஒருவரே’ என்றும் மொழிபெயர்த்து, இயேசுவின் நன்மையை மறுக்கும் கருத்தையோ இணை நற்செய்தி வடிவத்தையோ முதன்மை உரையில் புகுத்தவில்லை.
  alternative: மாற்கு/லூக்கா இணை நிகழ்வுகளின்படி, ‘என்னை ஏன் நல்லவர் என்று அழைக்கிறாய்? தேவன் ஒருவரைத் தவிர நல்லவர் எவருமில்லை’ என்று மொழிபெயர்த்தல்.
  rationale: SBLGNT மத்தேயு உரை மாற்கு/லூக்காவின் வடிவத்திலிருந்து வேறுபடுகிறது. ஆகவே மத்தேயுவின் சொற்களைப் பாதுகாத்து, கிறிஸ்துவின் தெய்வீகத்தை மறுப்பதாகவும் நிரூபிப்பதாகவும் மொழிபெயர்ப்பு மட்டத்தில் மிகைப்படுத்தாமல் இறையியல் பதற்றத்தைத் திறந்தவாறு வைக்கிறது.
translation_notes:
  register: இயல்பான, மரியாதைக்குரிய நவீனத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘வாழ்வுக்குள் நுழைய’ என்பது கிரேக்க உருவகத்தைப் பாதுகாக்கிறது; ‘கட்டளைகளைக் கடைப்பிடி’ என்பது பொதுவாகப் புரியும் சமயச் சொல்லாட்சி. வழங்கப்பட்ட ஆங்கில அடுக்கில் [b] குறிப்பு தவறான இடத்திலோ பொருந்தாத உள்ளடக்கத்தோடோ உள்ளது; ‘There is one who is good’ என்பது ‘One is good’ என்பதற்கான மாற்று, ‘enter into life’ என்பதற்கானது அல்ல. எனவே ஆதாரமற்ற [b] குறிப்பு சேர்க்கப்படவில்லை.
