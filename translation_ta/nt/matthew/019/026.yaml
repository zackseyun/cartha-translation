id: MAT.19.26
reference: Matthew 19:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐμβλέψας δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Παρὰ ἀνθρώποις τοῦτο ἀδύνατόν ἐστιν, παρὰ δὲ θεῷ πάντα δυνατά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/026.yaml
  text: But Jesus looked at them and said to them[a], “With men this is impossible, but with God all things are possible.”
translation:
  language: ta
  text: ஆனால் இயேசு அவர்களை உற்றுப் பார்த்து, “மனிதர்களால் இது இயலாதது; ஆனால் கடவுளால் எல்லாம் இயலும்” என்று அவர்களிடம் சொன்னார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  choice: உற்றுப் பார்த்து
  rationale: ஒருவரை நோக்கிப் பார்வையைச் செலுத்துதல் என்ற வினையின் கூறை இயல்பான தமிழில் வெளிப்படுத்துகிறது; தேவையற்ற தீவிரத்தையும் சேர்க்கவில்லை.
- source_word: δὲ
  choice: ஆனால்
  rationale: சீடர்களின் முந்தைய எதிர்வினைக்குப் பதிலாக வரும் மென்மையான முரண்பாட்டையும், கூற்றுக்குள் மனிதர்களுக்கும் கடவுளுக்கும் இடையே வரும் வேறுபாட்டையும் பொருத்தமாகக் காட்டுகிறது.
- source_word: εἶπεν αὐτοῖς
  choice: என்று அவர்களிடம் சொன்னார்
  rationale: αὐτοῖς என்பதில் வெளிப்படையாக உள்ள பெறுநர்களைத் தமிழிலும் தக்கவைக்கிறது.
- source_word: παρὰ ἀνθρώποις
  choice: மனிதர்களால்
  rationale: παρά + இடவேற்றுமை இங்கு மனிதர்களின் தரப்பில் அல்லது அவர்களுடைய ஆற்றலுக்குள் என்ற பொருளைத் தருகிறது. சூழலில் செயல் இயலுமா என்பதே மையமாக இருப்பதால், ‘மனிதர்களால்’ என்பது இயல்பான, பாலினப் பொதுமையான தமிழ்.
- source_word: τοῦτο
  choice: இது
  rationale: முன்பு பேசப்பட்ட காரியத்தைச் சுட்டும் எளிய, நேரடியான தமிழ் வடிவம்.
- source_word: ἀδύνατόν ἐστιν
  choice: இயலாதது
  rationale: சாத்தியமின்மையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: παρὰ δὲ θεῷ
  choice: ஆனால் கடவுளால்
  rationale: முந்தைய ‘மனிதர்களால்’ என்பதோடு சொல்லாட்சிச் சமநிலையைப் பேணி, கடவுளுடைய ஆற்றலால் என்பது சூழலில் தெளிவாக வெளிப்படுகிறது.
- source_word: πάντα δυνατά
  choice: எல்லாம் இயலும்
  rationale: πάντα என்பதன் முழுமையையும் δυνατά என்பதன் சாத்தியத்தன்மையையும் செறிவான, நினைவில் நிற்கும் தமிழில் தக்கவைக்கிறது.
theological_decisions:
- issue: ἀνθρώποις என்ற பொதுப்பொருள் பன்மையை மொழிபெயர்த்தல்
  choice: மனிதர்களால்
  alternative: மனிதரிடம் / மனிதர்களுக்கு
  rationale: கிரேக்கச் சொல் மனிதகுலத்தைப் பொதுவாகக் குறிக்கிறது; ஆண்களை மட்டும் அல்ல. ‘மனிதர்களால்’ என்பது பாலினப் பொதுமையைத் தெளிவாகவும், இரட்சிப்பு மனித ஆற்றலால் இயலாது என்ற உடனடிச் சூழலையும் இயல்பாகவும் காட்டுகிறது.
- issue: παρά + இடவேற்றுமையின் பொருள்
  choice: ஆற்றல் அல்லது செயற்பாட்டுத் தரப்பை உணர்த்தும் ‘-ஆல்’
  alternative: ‘மனிதர்களிடம் ... கடவுளிடம்’ என்ற சொற்சார்ந்த அமைப்பு
  rationale: இரு இடங்களிலும் ஒரே கிரேக்க அமைப்பின் இணைநிலையைப் பேணியபடி, தமிழில் ‘யாரால் இயலும்’ என்ற இயல்பான கருத்தமைப்பை வழங்குகிறது. இதை வெறும் கண்ணோட்டம் என்றோ எல்லையற்ற தத்துவக் கூற்று என்றோ மிகைப்படுத்தவில்லை.
- issue: πάντα δυνατά என்ற கூற்றின் வரம்பு
  choice: எல்லாம் இயலும்
  alternative: எல்லாவற்றையும் செய்ய முடியும்
  rationale: மூலத்தின் சுருக்கத்தையும் திறந்த வடிவத்தையும் தக்கவைக்கிறது. உடனடிச் சூழல் இதை விவாதிக்கப்படும் காரியத்துடன் இணைக்கிறது; மொழிபெயர்ப்பு கூடுதல் கோட்பாட்டு வரம்பையோ விளக்கத்தையோ புகுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘உற்றுப் பார்த்து’ என்பது கதைநடையின் பார்வைச் செயலைத் தக்கவைக்கிறது; ‘மனிதர்களால் ... கடவுளால்’ என்ற இணை அமைப்பு மூலத்தின் சொல்லாட்சிச் சமநிலையை இயல்பான தமிழில் மீட்டுருவாக்குகிறது. அடிக்குறிப்பு தேவையில்லை; எனவே முதன்மை உரையில் அடிக்குறிப்புக் குறியீடும் இல்லை.
