  verdict: revise
  source_fidelity: The draft accurately retains the attention marker, the unspecified identity of εἷς, the approach-before-speech sequence, and the action-oriented question. However, “போதகரே” commonly denotes a preacher/pastor in current Tamil and is narrower than Διδάσκαλε (“teacher”). “ஆசிரியரே” is the direct, modern-standard equivalent. “என்ன நன்மை செய்ய வேண்டும்” is understandable but less idiomatic and leaves the object of ‘do’ awkwardly expressed; “என்ன நல்லதைச் செய்ய வேண்டும்” preserves the Greek’s open neuter expression naturally.
  naturalness: The revised wording is fluent modern standard Tamil. “அவரிடம் வந்து” naturally expresses the prior aorist participle, and “நித்திய வாழ்வைப் பெற” gives the purpose clause in idiomatic Tamil without adding a doctrinal conclusion.
  terminology: Use “ஆசிரியரே” for Διδάσκαλε. Retain “நித்திய வாழ்வு” as the established and understandable equivalent for ζωὴ αἰώνιος. The footnote is retained and its anchor moved to the revised expression.
