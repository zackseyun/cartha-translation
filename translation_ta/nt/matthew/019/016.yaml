source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ εἷς προσελθὼν ⸂αὐτῷ εἶπεν⸃· ⸀Διδάσκαλε, τί ἀγαθὸν ποιήσω ἵνα ⸀σχῶ ζωὴν αἰώνιον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/016.yaml
  text: And behold[a], one who had come up to him said, “Teacher, what good thing must I do so that I may have eternal life?”
translation:
  language: ta
  text: இதோ, ஒருவர் அவரிடம் வந்து, “ஆசிரியரே, நித்திய வாழ்வைப் பெற நான் என்ன நல்லதை[a]ச் செய்ய வேண்டும்?” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எந்த நற்செயலைச் செய்ய வேண்டும்?” கிரேக்கத்தில் உள்ள சொற்றொடர், ‘செய்’ என்ற வினையுடன் இணைந்து, பொதுவான ‘நல்லது’ அல்லது குறிப்பான ‘நற்செயல்’ எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: இதோ
  rationale: ἰδού என்பதன் கவனத்தை ஈர்க்கும், நிகழ்வை உயிரோட்டமாக முன்வைக்கும் தன்மையைத் தக்கவைக்கிறது. καί இங்கு கதைநடைத் தொடர்ச்சியைச் சுட்டுவதால், தமிழில் இயல்பற்ற ‘மேலும்’ என்பதைச் சேர்க்காமல் தொடர்ச்சியால் உணர்த்தப்படுகிறது.
- source_word: εἷς
  choice: ஒருவர்
  rationale: மூலத்தில் இவ்வசனத்திலேயே பாலினமோ செல்வநிலையோ குறிப்பிடப்படவில்லை. ‘ஒருவர்’ என்பது அந்தத் தகவல் வரம்பைப் பாதுகாக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: προσελθὼν
  choice: அவரை அணுகி
  rationale: பேசுவதற்கு முன் அவர் இயேசுவிடம் நெருங்கிவந்ததை அசைநிலை வினை வடிவில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: αὐτῷ εἶπεν
  choice: என்றார்
  rationale: மேற்கோள் கேள்விக்குப் பின் வரும் இயல்பான தமிழ் பேச்சு வினை. ‘அவரை அணுகி’ என்பதில் αὐτῷ குறிக்கும் தொடர்பு ஏற்கெனவே தெளிவாகிறது.
- source_word: Διδάσκαλε
  choice: போதகரே
  rationale: கற்பிப்பவரை மரியாதையுடன் அழைக்கும் தமிழ்ச் சொல்; ‘ஆசிரியரே’ என்பதைவிட இச்சூழலில் ஒருவரின் போதனைப் பங்கைத் தெளிவாகக் காட்டுகிறது.
- source_word: τί ἀγαθὸν
  choice: என்ன நன்மை
  rationale: ‘என்ன நல்ல காரியம்’ அல்லது ‘எந்த நற்செயல்’ என்று மட்டும் வரையறுக்காமல், மூலத்தின் திறந்த சொல்லாட்சியை இயன்றவரைத் தக்கவைக்கிறது.
- source_word: ποιήσω
  choice: செய்ய வேண்டும்
  rationale: ஆலோசனைத் தன்மையுள்ள கேள்வியின் நடைமுறை வலிமையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; செயலுக்கும் இரட்சிப்புக்கும் இடையிலான உறவை மொழிபெயர்ப்பே தீர்மானிப்பதில்லை.
- source_word: ἵνα σχῶ
  choice: பெறுவதற்கு
  rationale: நோக்கத்தைக் குறிக்கும் ἵνα என்பதையும், வாழ்வு தனக்கு உரியதாக வேண்டும் என்ற σχῶ என்பதையும் சுருக்கமான இயல்பான தமிழில் தருகிறது. சொற்சொல்லான ‘கொண்டிருக்கும்படி’ இங்கு செயற்கையாக ஒலிக்கும்.
- source_word: ζωὴν αἰώνιον
  choice: நித்திய வாழ்வு
  rationale: காலவரம்பற்ற வாழ்வைக் குறிக்கும் நிலைபெற்ற, பொதுவாகப் புரிந்துகொள்ளப்படும் தமிழ் சொற்றொடர்.
theological_decisions:
- issue: பேச வந்தவரை இவ்வசனத்திலேயே ஆண் அல்லது செல்வந்த இளைஞன் என்று அடையாளப்படுத்தலாமா
  choice: ஒருவர்
  alternative: ஒரு மனிதர்; ஒரு செல்வந்த இளைஞர்
  rationale: εἷς என்பது இங்கு ‘ஒருவர்’ என்று மட்டுமே கூறுகிறது. பின்னர் வரும் சூழல் அல்லது இணைநற்செய்திகளின் தகவலை இவ்வசனத்துக்குள் முன்கூட்டியே கொண்டுவரவில்லை.
- issue: செயல் செய்வதற்கும் நித்திய வாழ்வுக்கும் இடையிலான கேள்வியின் இறையியல் வலிமை
  choice: நித்திய வாழ்வைப் பெறுவதற்கு நான் என்ன நன்மை செய்ய வேண்டும்?
  alternative: நித்திய வாழ்வைச் சம்பாதிக்க நான் எந்த நற்செயலைச் செய்ய வேண்டும்?
  rationale: கேள்வியின் செயல் மையமான தன்மையைப் பாதுகாக்கிறது; ஆனால் ‘சம்பாதிக்க’ போன்ற சொல்லால் தகுதி, புண்ணியம் அல்லது கிரியையால் இரட்சிப்பு என்ற முடிவை மூலத்தைவிட அதிகமாகச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ மூலத்தின் கவன ஈர்ப்பைத் தக்கவைக்கிறது; ‘போதகரே’ மரியாதைமிக்க அழைப்பாக உள்ளது. இறையியல் முடிவை முன்கூட்டியே விதிக்கக்கூடிய ‘சம்பாதிக்க’ போன்ற சொற்கள் தவிர்க்கப்பட்டுள்ளன.
