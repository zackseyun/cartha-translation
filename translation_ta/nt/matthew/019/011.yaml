id: MAT.19.11
reference: Matthew 19:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Οὐ πάντες χωροῦσι τὸν λόγον ⸀τοῦτον ἀλλ’ οἷς δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/011.yaml
  text: But he said to them[a], “Not everyone can accept this word[b], but only those to whom it has been given.”
translation:
  language: ta
  text: அவர் அவர்களிடம், “எல்லாராலும் இந்தக் கூற்றை[a] ஏற்றுக்கொள்ள முடியாது; யாருக்கு அளிக்கப்பட்டிருக்கிறதோ[b] அவர்களால் மட்டுமே இந்தக் கூற்றை ஏற்றுக்கொள்ள முடியும்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “இந்தச் சொல்லை,” “இந்தப் போதனையை.”
    reason: lexical_alternative
  - marker: b
    text: “அளிக்கப்பட்டிருக்கிறது” என்ற செயப்பாட்டு வடிவம், அளிப்பவர் கடவுள் என்பதை மறைமுகமாகக் குறிக்கலாம்; ஆனால் கிரேக்க மூலவாக்கியம் அளிப்பவர் யார் என்பதை வெளிப்படையாகக் கூறவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: என்றார்
  rationale: λέγω என்பதன் இறந்தகாலக் கதைநடை வடிவத்தை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: Οὐ πάντες
  choice: எல்லாராலும் ... முடியாது
  rationale: எல்லாருக்கும் இது சாத்தியமல்ல என்ற மறுக்கப்பட்ட பொதுமையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: χωροῦσι
  choice: ஏற்றுக்கொள்ள முடியாது
  rationale: χωρέω என்பதன் அடிப்படைப் பொருள் ‘இடமளித்தல்’; λόγος உடன் இங்கு ஒரு கூற்றை உள்ளத்தில் ஏற்கும் திறனை அல்லது ஏற்பைச் சுட்டுகிறது. ‘ஏற்றுக்கொள்ள முடியும்’ என்பது அந்தப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: τὸν λόγον τοῦτον
  choice: இந்தக் கூற்றை
  rationale: λόγος இங்கு முந்தைய வசனத்தில் கூறப்பட்ட கருத்தைக் குறிக்கிறது. ‘கூற்று’ என்பது ‘வார்த்தை’ என்பதைவிட இச்சூழலில் இயல்பாகவும் துல்லியமாகவும் உள்ளது; ‘போதனை’ என்ற விளக்கத்தைத் தேவையின்றி சேர்ப்பதில்லை.
- source_word: ἀλλ’ οἷς
  choice: யாருக்கு ... அவர்களால் மட்டுமே
  rationale: ἀλλά மற்றும் தொடர்புப்பெயர் அமைப்பின் கட்டுப்படுத்தும் எதிர்மறை வேறுபாட்டை இயல்பான தமிழில் தெளிவுபடுத்துகிறது.
- source_word: δέδοται
  choice: அளிக்கப்பட்டிருக்கிறதோ
  rationale: δίδωμι என்பதன் நிறைவுற்ற செயப்பாட்டு வடிவத்தைப் பாதுகாத்து, முன்பு அளிக்கப்பட்டதன் தற்போதைய விளைவை உணர்த்துகிறது; அளித்தவர் யார் என்பதைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: δέδοται என்ற செயப்பாட்டு வடிவத்தில் மறைமுகமாக உள்ள அளிப்பவர் யார்?
  choice: அளிப்பவரைக் குறிப்பிடாமல், ‘அளிக்கப்பட்டிருக்கிறது’ என்ற செயப்பாட்டு வடிவத்தைத் தக்கவைத்தல்
  alternative: ‘கடவுள் யாருக்கு இதை அளித்திருக்கிறாரோ’ என்று கடவுளை வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: சூழலில் கடவுளே அளிப்பவர் என்று புரிந்துகொள்ள வாய்ப்பிருந்தாலும், கிரேக்க மூலவாக்கியம் எழுவாயை வெளிப்படையாகக் குறிப்பிடவில்லை. ஆகவே மூலத்தின் இறையியல் நுட்பத்தையும் தெளிவின்மையையும் அப்படியே பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘கூற்று’ சூழலுக்குப் பொருத்தமான இயல்பான சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது; இரண்டாம் கூறில் ‘முடியும்’ என்பது தமிழில் வாக்கியத்தை இயல்பாக நிறைவு செய்ய மீண்டும் பயன்படுத்தப்பட்டது.
