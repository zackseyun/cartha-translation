revisions:
- from: அவர் அவர்களிடம், “எல்லாராலும் இந்தக் கூற்றை[a] ஏற்றுக்கொள்ள முடியாது; அது யாருக்கு அளிக்கப்பட்டிருக்கிறதோ[b] அவர்களால் மட்டுமே முடியும்” என்றார்.
  to: அவர் அவர்களிடம், “எல்லாராலும் இந்தக் கூற்றை[a] ஏற்றுக்கொள்ள முடியாது; யாருக்கு அளிக்கப்பட்டிருக்கிறதோ[b] அவர்களால் மட்டுமே இந்தக் கூற்றை ஏற்றுக்கொள்ள முடியும்” என்றார்.
  rationale: The revision removes the explicit demonstrative subject before “அளிக்கப்பட்டிருக்கிறதோ,” retaining the Greek’s elliptical passive construction rather than making the saying itself the apparent object of the giving. It also repeats the action in the final clause for fluent Tamil while retaining the source’s restrictive contrast and passive ambiguity.
