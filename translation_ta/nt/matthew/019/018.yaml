id: MAT.19.18
reference: Matthew 19:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγει αὐτῷ· Ποίας; ὁ δὲ Ἰησοῦς ⸀εἶπεν· Τὸ Οὐ φονεύσεις, Οὐ μοιχεύσεις, Οὐ κλέψεις, Οὐ ψευδομαρτυρήσεις,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/018.yaml
  text: 'He says to him, “Which ones?” And Jesus said, “The: You shall not murder, you shall not commit adultery, you shall not steal, you shall not bear false witness,”'
translation:
  language: ta
  text: அவன் அவரிடம், “எந்தக் கட்டளைகள்?” என்று கேட்டான். அதற்கு இயேசு, “கொலை செய்யாதே; திருமணத் துரோகம் செய்யாதே; திருடாதே; பொய்ச் சாட்சி சொல்லாதே;” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ποίας
  choice: எந்தக் கட்டளைகள்?
  rationale: பெண்பால் பன்மையான வினாச்சொல், முந்தைய வசனத்தில் உள்ள ‘கட்டளைகள்’ என்பதைக் குறிக்கிறது; தமிழில் பொருளைத் தெளிவாக்க அந்தச் சொல்லை வெளிப்படையாகச் சேர்த்துள்ளது.
- source_word: Οὐ φονεύσεις
  choice: கொலை செய்யாதே
  rationale: φονεύω சட்டவிரோதமான மனிதக் கொலையைச் சுட்டுகிறது; பொதுவான ‘கொல்லாதே’ என்பதைவிட ‘கொலை செய்யாதே’ துல்லியமானது.
- source_word: Οὐ μοιχεύσεις
  choice: மணமுறிவில் ஈடுபடாதே
  rationale: μοιχεύω என்பது திருமண உறுதியை மீறும் பாலுறவைக் குறிக்கிறது; இயல்பான, மரியாதையான நவீனத் தமிழில் அதன் பொருளைத் தருகிறது.
- source_word: Οὐ κλέψεις
  choice: திருடாதே
  rationale: κλέπτω என்பதற்கான நேரடியான, இயல்பான தமிழ் இணை.
- source_word: Οὐ ψευδομαρτυρήσεις
  choice: பொய்ச் சாட்சி சொல்லாதே
  rationale: ψευδομαρτυρέω என்பதன் சாட்சி/வாக்குமூலப் பொருளை வழக்கமான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: Τὸ என்பதன் மொழிபெயர்ப்பு
  choice: தமிழில் தனியாக மொழிபெயர்க்காமல் கட்டளைகளின் பட்டியலை நேரடியாகத் தொடங்குதல்
  alternative: ‘அவை:’ அல்லது ‘இதுதான்:’ என்று வழங்குதல்
  rationale: Τὸ இங்கு மேற்கோள் அல்லது பட்டியலை அறிமுகப்படுத்தும் குறியீட்டுப் பயன்பாடாகப் புரிந்துகொள்ளப்படுகிறது. ‘அந்த:’ போன்ற சொற்சொல் வடிவம் தமிழில் இயல்பற்றது; தனியான கருத்தைச் சேர்க்காமல் நேரடிப் பட்டியல் மூலத்தின் செயல்பாட்டைப் பாதுகாக்கிறது.
- issue: μοιχεύσεις என்பதன் வரம்பு
  choice: மணமுறிவில் ஈடுபடாதே
  alternative: விபசாரம் செய்யாதே
  rationale: ‘விபசாரம்’ நவீனப் பயன்பாட்டில் சிலவேளை பாலியல் ஒழுக்கக்கேட்டை விரிவாகவோ பாலியல் தொழிலைச் சுட்டவோ பயன்படலாம்; மூலச்சொல்லின் திருமணத் துரோகப் பொருளைச் சுருக்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; நேரடியான உரையாடலும் கட்டளைத் தொடரும் மரியாதையான, பொதுமக்களுக்கு எளிதில் புரியும் நடையில் வழங்கப்பட்டுள்ளன. வசனம் அடுத்த வசனத்தில் தொடர்வதால் இறுதியில் முடிவுக் குறியீடு இடப்படவில்லை.
