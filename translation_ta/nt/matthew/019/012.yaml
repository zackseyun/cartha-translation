source:
  edition: SBLGNT
  text: εἰσὶν γὰρ εὐνοῦχοι οἵτινες ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνούχισαν ἑαυτοὺς διὰ τὴν βασιλείαν τῶν οὐρανῶν. ὁ δυνάμενος χωρεῖν χωρείτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/012.yaml
  text: For there are eunuchs who were born that way from their mother’s womb[a], and there are eunuchs who were made eunuchs by men, and there are eunuchs who made themselves eunuchs for the sake of the kingdom of heaven[b]. The one able to accept this should accept it.
translation:
  language: ta
  text: ஏனெனில், தாயின் கருவிலிருந்தே அண்ணகர்களாகப் பிறந்தவர்கள் உண்டு; மனிதர்களால் அண்ணகர்களாக்கப்பட்டவர்கள் உண்டு; பரலோக அரசுக்காகத் தங்களை அண்ணகர்களாக்கிக்கொண்டவர்களும் உண்டு.[a] இதை ஏற்றுக்கொள்ள இயன்றவர் ஏற்றுக்கொள்ளட்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்களை ஆண்மை நீக்கம் செய்துகொண்டவர்கள்.” பல விளக்கவுரையாளர்கள் இதை, பரலோக அரசுக்காகத் திருமணம் செய்யாமல் வாழத் தீர்மானிப்பதைக் குறிக்கும் உருவகமாகப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “இதை உள்வாங்க இயன்றவர் உள்வாங்கட்டும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐνοῦχοι
  choice: அண்ணகர்கள்
  rationale: கிரேக்கச் சொல் குறிக்கும் ‘eunuchs’ என்ற வகையைத் தமிழில் நேரடியாகக் குறிக்கும் மரியாதையான சொல் இது. மூன்று வகைகளிலும் இதையே பயன்படுத்துவது மூலத்தின் சொல் மீளுரைப்பைப் பாதுகாக்கிறது; ‘திருமணம் செய்யாதவர்கள்’ போன்ற விளக்கத்தைப் பெயர்ச்சொல்லுக்குள் புகுத்துவதையும் தவிர்க்கிறது.
- source_word: ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως
  choice: தாயின் கருவிலிருந்தே அண்ணகர்களாகப் பிறந்தவர்கள்
  rationale: ‘தாயின் கருவிலிருந்து’ என்ற மூல மொழியின் உயிரோட்டமான பிறப்பிடச் சொல்லாட்சியை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது; οὕτως குறிக்கும் நிலையை ‘அண்ணகர்களாக’ என்று தெளிவாக இணைக்கிறது.
- source_word: εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων
  choice: மனிதர்களால் அண்ணகர்களாக்கப்பட்டவர்கள்
  rationale: εὐνοῦχοι என்ற பெயர்ச்சொல்லுக்கும் εὐνουχίζω என்ற வினைக்கும் உள்ள தொடர்பைத் தமிழிலும் காக்கிறது. ἀνθρώπων என்பதற்கு பாலினத்தைத் தேவையின்றிக் குறுக்காமல் ‘மனிதர்கள்’ என மொழிபெயர்க்கிறது.
- source_word: εὐνούχισαν ἑαυτοὺς
  choice: தங்களை அண்ணகர்களாக்கிக்கொண்டவர்கள்
  rationale: மூலத்தின் திட்டமிட்டுக் கடுமையாக ஒலிக்கும் நேரடிச் சொல்லாட்சியைப் பாதுகாக்கிறது. இது உடல்ரீதியான செயலா, மிகைப்படுத்திய உருவகமா, திருமணத் துறவைக் குறிக்கிறதா என்பதை முதன்மை உரை தீர்மானித்துவிடவில்லை.
- source_word: διὰ τὴν βασιλείαν τῶν οὐρανῶν
  choice: பரலோக அரசுக்காக
  rationale: διά + வேற்றுமை வடிவம் இங்கு நோக்கம் அல்லது காரணத் தூண்டுதலைக் குறிக்கிறது. ‘பரலோக அரசு’ மத்தேயுவின் βασιλεία τῶν οὐρανῶν என்ற சொல்லாட்சியை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ὁ δυνάμενος χωρεῖν χωρείτω
  choice: இதை ஏற்றுக்கொள்ள இயன்றவர் ஏற்றுக்கொள்ளட்டும்
  rationale: χωρέω இங்கு கடினமான போதனைக்கு மனத்தில் இடமளித்து அதை ஏற்றுக்கொள்வதைக் குறிக்கும் மரபுத்தொடர். ‘ஏற்றுக்கொள்ள’ என்பது அதன் கட்டளை வலிமையைத் தக்கவைத்தபடி இன்றைய வாசகருக்குத் தெளிவாக உள்ளது.
theological_decisions:
- issue: εὐνούχισαν ἑαυτοὺς என்பது நேர்ப்பொருளா அல்லது உருவகமா?
  choice: ‘தங்களை அண்ணகர்களாக்கிக்கொண்டவர்கள்’ என்ற நேரடியான சொல் வடிவத்தை முதன்மை உரையில் வைத்தல்
  alternative: ‘தங்களை ஆண்மை நீக்கம் செய்துகொண்டவர்கள்’ அல்லது ‘திருமணம் செய்யாமல் வாழத் தீர்மானித்தவர்கள்’
  rationale: மூன்றாவது வகை உடல்ரீதியான தன்னைத்தானே ஆண்மை நீக்கம் செய்வதையா, மிகைப்படுத்திய சொல்லாட்சியையா, இறையாட்சிக்காக மேற்கொள்ளும் திருமணத் துறவையா குறிக்கிறது என்பதை வசனம் வெளிப்படையாக விளக்கவில்லை. ஆகவே விளக்கத் தெரிவை முதன்மை உரையில் திணிக்காமல், உண்மையான பொருள் இழுபறியைப் பாதுகாத்து மாற்று விளக்கத்தை அடிக்குறிப்பில் தருகிறது.
- issue: ὁ δυνάμενος χωρεῖν χωρείτω என்ற இறுதி அறிவுரையின் பொருள்
  choice: ‘இதை ஏற்றுக்கொள்ள இயன்றவர் ஏற்றுக்கொள்ளட்டும்’
  alternative: ‘இதை உள்வாங்க இயன்றவர் உள்வாங்கட்டும்’
  rationale: χωρέω என்பதன் அடிப்படை இடமளித்தல்/உள்வாங்குதல் உணர்விலிருந்து இச்சூழலில் ‘ஏற்றுக்கொள்ளுதல்’ என்ற மரபுப்பொருள் உருவாகிறது. தேர்ந்தெடுத்த மொழிபெயர்ப்பு கடினமான போதனையை ஏற்கும் அழைப்பை இயல்பான தமிழில் தெரிவிக்கிறது; மாற்று வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டுள்ளது. ‘அண்ணகர்’ என்பது அரிதாகத் தோன்றக்கூடியதாக இருந்தாலும், மூலத்தின் முக்கியச் சொல்லை நேரடியாகவும் மரியாதையாகவும் குறிக்கிறது; அதை மூன்று இடங்களிலும் மீண்டும் பயன்படுத்துவது கிரேக்க உரையின் கட்டமைப்பைப் பாதுகாக்கிறது. அடிக்குறி [a] மூன்றாவது வகைக்குப் பின்னும் [b] இறுதி அறிவுரைக்குப் பின்னும் பொருளுக்கேற்ற இடங்களில் வைக்கப்பட்டுள்ளன.
