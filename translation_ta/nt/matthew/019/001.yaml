  source_fidelity: 'மூலக் கிரேக்கத்தின் நிகழ்வுவரிசை நன்றாகப் பேணப்பட்டுள்ளது: இயேசு முந்தைய உரையை முடித்த பின்னர் கலிலேயாவை விட்டு யூதேயாவின் பகுதிகளுக்கு வந்தார். «யோர்தான் ஆற்றுக்கு அப்பாலுள்ள» என்பது πέραν τοῦ Ἰορδάνου என்பதன் இடவியல் உறவைத் துல்லியமாகத் தருகிறது. Καὶ ἐγένετο என்ற கதைத் தொடர்ச்சி வடிவம் தனிச்சொல்லாக மொழிபெயர்க்கப்படவில்லை; ஆனால் தமிழின் காலத் துணைவாக்கியத்தில் அதன் தொடர்ச்சிப் பணி போதுமான அளவு வெளிப்படுகிறது.'
