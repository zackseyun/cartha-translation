source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, μετῆρεν ἀπὸ τῆς Γαλιλαίας καὶ ἦλθεν εἰς τὰ ὅρια τῆς Ἰουδαίας πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/001.yaml
  text: And it happened that when Jesus had finished these words[a], he departed from Galilee and came into the region of Judea beyond the Jordan.
translation:
  language: ta
  text: இயேசு இந்த வார்த்தைகளைச் சொல்லி முடித்தபோது, அவர் கலிலேயாவிலிருந்து புறப்பட்டு, யோர்தான் ஆற்றுக்கு அப்பாலுள்ள[a] யூதேயாவின் பகுதிகளுக்கு வந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யோர்தான் ஆற்றின் மறுகரையிலுள்ள.”
    reason: πέραν என்பதற்கு ‘அப்பால்’ என்றும் ‘மறுகரையில்’ என்றும் பொருள் கொள்ளலாம்; இரண்டும் ஒரே அடிப்படை இடவியல் கருத்தை வெவ்வேறு இயல்பான தமிழ்ச் சொற்றொடர்களில் தெரிவிக்கின்றன.
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: …முடித்தபோது
  rationale: இது மத்தேயுவில் காணப்படும் கதைத் தொடர்ச்சி அமைப்பு. கிரேக்க மொழியின் சொல்லுக்குச் சொல் வடிவத்தை இயல்பற்ற தமிழில் திணிக்காமல், அடுத்த நிகழ்வுக்கு மாறும் அதன் பணியை காலத் துணைவாக்கியத்தின் மூலம் வெளிப்படுத்துகிறது.
- source_word: ὅτε ἐτέλεσεν
  choice: சொல்லி முடித்தபோது
  rationale: முந்தைய உரை முழுமையாக முடிந்த பின்னரே அடுத்த செயல் நிகழ்ந்தது என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τοὺς λόγους τούτους
  choice: இந்த வார்த்தைகளை
  rationale: இது உடனடியாக முந்திய இயேசுவின் உரையைக் குறிக்கிறது; ‘வார்த்தைகள்’ என்பது பொருளை விளக்கிச் சேர்க்காமல் நேரடியாகக் காக்கிறது.
- source_word: μετῆρεν ἀπὸ τῆς Γαλιλαίας
  choice: கலிலேயாவிலிருந்து புறப்பட்டு
  rationale: ஒரு இடத்தைவிட்டு நீங்கிச் சென்ற இயக்கத்தைத் தெளிவாகவும் கண்ணியமான நடையிலும் தெரிவிக்கிறது.
- source_word: ἦλθεν εἰς
  choice: …வந்தார்
  rationale: ἦλθεν என்பதன் ‘வந்தார்’ என்ற கண்ணோட்டத்தைப் பேணுகிறது; இலக்கிடத்தைத் தமிழின் வேற்றுமை உருபு இயல்பாகக் காட்டுகிறது.
- source_word: τὰ ὅρια τῆς Ἰουδαίας
  choice: யூதேயாவின் பகுதிகளுக்கு
  rationale: ὅρια என்பதன் பன்மையையும், இச்சூழலில் எல்லைக் கோடு மட்டும் அல்லாமல் நிலப்பகுதிகளைக் குறிக்கும் பரந்த புவியியல் பொருளையும் காக்கிறது.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: யோர்தான் ஆற்றுக்கு அப்பாலுள்ள
  rationale: πέραν குறிக்கும் ‘மறுபக்கம்/அப்பால்’ என்ற இடவியல் உறவை இயல்பான தமிழில் தருகிறது; யோர்தான் ஓர் ஆறு என்பதை வாசகருக்குத் தெளிவுபடுத்துகிறது.
