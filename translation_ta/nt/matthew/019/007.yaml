source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ· Τί οὖν Μωϋσῆς ἐνετείλατο δοῦναι βιβλίον ἀποστασίου καὶ ἀπολῦσαι ⸀αὐτήν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/007.yaml
  text: They said to him[a], “Why then did Moses command to give a certificate of divorce and to send her away?”
translation:
  language: ta
  text: அவர்கள் அவரிடம், “அப்படியானால், மணவிலக்குப் பத்திரத்தைக் கொடுக்கவும் அவளை அனுப்பிவிடவும்[a] மோசே ஏன் கட்டளையிட்டார்?” என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவளை மணவிலக்கு செய்யவும்.’ கிரேக்க வினைச்சொல் ‘அனுப்பிவிடுதல்’ என்றும் பொருள்படும்; இந்தச் சூழலில் அது மணவிலக்கைக் குறிக்கும் சொல்லாகச் செயல்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: அவர்கள் அவரிடம் … என்று கேட்டார்கள்
  rationale: கிரேக்கக் கதையாடலில் வரும் வரலாற்று நிகழ்காலத்தை இயல்பான தமிழ் கதையோட்டத்திற்காக இறந்தகாலத்தில் மொழிபெயர்த்துள்ளது. நேரடி உரை கேள்வியாக இருப்பதால் ‘சொன்னார்கள்’ என்பதற்குப் பதிலாக ‘கேட்டார்கள்’ என்பது தமிழில் இயல்பாக உள்ளது.
- source_word: Τί οὖν
  choice: அப்படியானால் … ஏன்
  rationale: இது இயேசுவின் முந்தைய கூற்றுக்கு எதிராக முன்வைக்கப்படும் கேள்வி என்பதால், தொடர்ச்சியையும் வாதத்தின் வலிமையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐνετείλατο
  choice: கட்டளையிட்டார்
  rationale: வினைச்சொல்லின் கட்டளைத் தன்மையைப் பாதுகாக்கிறது; அடுத்த வசனத்தில் இயேசு கூறும் திருத்தத்தை இவ்வசனத்திற்குள் முன்கூட்டியே கொண்டுவரவில்லை.
- source_word: δοῦναι
  choice: கொடுத்து
  rationale: கட்டளையின் முதலாவது செயலைத் தெளிவாகவும் இயல்பாகவும் இணைக்கிறது.
- source_word: βιβλίον ἀποστασίου
  choice: மணவிலக்குப் பத்திரம்
  rationale: உபாகமம் 24:1 பின்னணியில் மணவிலக்கை உறுதிப்படுத்தும் எழுத்துப்பூர்வமான சட்ட ஆவணத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொற்றொடர்.
- source_word: καὶ ἀπολῦσαι αὐτήν
  choice: அவளை அனுப்பிவிடும்படி
  rationale: ἀπολύω என்பதன் அடிப்படையான ‘அனுப்பிவிடுதல்’ என்ற உருவகத்தைப் பாதுகாக்கிறது; இச்சூழலில் அது மணவிலக்கைக் குறிக்கிறது என்பதைப் பத்திரம் என்ற முன்சொற்றொடரும் அடிக்குறிப்பும் தெளிவாக்குகின்றன.
theological_decisions:
- issue: பரிசேயர்களின் சொற்களை அடுத்த வசனத்தில் இயேசு செய்யும் திருத்தத்தோடு முன்கூட்டியே ஒத்திசைப்பதா
  choice: ‘கட்டளையிட்டார்’ என்பதை முதன்மைப் பாடத்தில் வைத்தல்
  alternative: ‘அனுமதித்தார்’ அல்லது ‘இடமளித்தார்’
  rationale: இவ்வசனத்தின் கிரேக்கம் வெளிப்படையாக ‘கட்டளையிட்டார்’ என்கிறது. அடுத்த வசனம் மோசேயின் ஏற்பாட்டை அனுமதியாக விளக்கினாலும், இங்கே கேள்வியாளர்களின் சொந்தக் கட்டமைப்பையே பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் சட்டச் சூழலின் தெளிவும் காக்கப்பட்டுள்ளன. கிரேக்கத்தில் இல்லாத ‘எங்களுக்கு’ போன்ற சொல்லைச் சேர்க்கவில்லை. ‘மணவிலக்குப் பத்திரம்’ என்பது சாதாரண வாசகருக்குப் புரியும் வகையில் ஆவணத்தின் சட்டத் தன்மையை வெளிப்படுத்துகிறது.
