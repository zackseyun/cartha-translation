id: MAT.19.21
reference: Matthew 19:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Εἰ θέλεις τέλειος εἶναι, ὕπαγε πώλησόν σου τὰ ὑπάρχοντα καὶ ⸀δὸς πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν ⸀οὐρανοῖς, καὶ δεῦρο ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/021.yaml
  text: Jesus said to him[a], “If you want to be perfect, go, sell your possessions and give to the poor, and you will have treasure in heaven; then come, follow me.”
translation:
  language: ta
  text: இயேசு அவனிடம், “நீ முழுமையானவனாக இருக்க விரும்பினால்[a], போய், உனக்குச் சொந்தமானவற்றை விற்று ஏழைகளுக்குக் கொடு; அப்போது பரலோகத்தில் உனக்குப் புதையல் இருக்கும். பின்பு வந்து என்னைப் பின்பற்று” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பூரணமானவனாக.” கிரேக்கச் சொல் “பூரணமான,” “முழுமையான,” அல்லது “முதிர்ச்சியடைந்த” என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: இயேசு அவனிடம் ... என்றார்
  rationale: தமிழின் இயல்பான மேற்கோள் அமைப்பைப் பின்பற்றி, பொதுவான உரையாடல் வினையான ἔφη என்பதைக் ‘என்றார்’ என மொழிபெயர்க்கிறது.
- source_word: τέλειος
  choice: நிறைவுள்ளவன்
  rationale: இச்சூழலில் முழுமை, குறைவின்மை, முழுமனதான சீடத்துவம் ஆகிய பொருள்களைத் தாங்குகிறது; பாவமே இல்லாத நிலை என்ற கருத்தைத் தேவையின்றி புகுத்தாமல் மூலத்தின் பொருள் விரிவைப் பாதுகாக்கிறது.
- source_word: ὕπαγε
  choice: போய்
  rationale: அடுத்தடுத்த கட்டளைகளுடன் இயல்பாக இணையும் எளிய தமிழ் வடிவம்.
- source_word: πώλησόν σου τὰ ὑπάρχοντα
  choice: உனக்குச் சொந்தமானவற்றை விற்று
  rationale: τὰ ὑπάρχοντα ஒருவருடைய உடைமைகள் அல்லது சொத்துகளைக் குறிக்கிறது; இந்த வடிவம் பரந்த பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δὸς πτωχοῖς
  choice: ஏழைகளுக்குக் கொடு
  rationale: πτωχοῖς என்பது ஏழை மக்களைக் கூட்டாகக் குறிக்கும் பெயரடைப் பயன்பாடு; நேரடியான கட்டளையைப் பாதுகாக்கிறது.
- source_word: ἕξεις θησαυρὸν ἐν οὐρανοῖς
  choice: பரலோகத்தில் உனக்குப் புதையல் இருக்கும்
  rationale: கிரேக்கத்தின் பன்மை οὐρανοῖς தமிழில் வழக்கமான ஒருமை ‘பரலோகம்’ என இயல்பாக வருகிறது; ἕξεις என்பதன் உடைமைப் பொருள் ‘உனக்கு ... இருக்கும்’ எனத் தெளிவாகிறது.
- source_word: δεῦρο ἀκολούθει μοι
  choice: பின்பு வந்து என்னைப் பின்பற்று
  rationale: δεῦρο-வின் அழைப்பையும் முன் கட்டளைகளுக்குப் பிந்தைய வரிசையையும் ‘பின்பு வந்து’ காட்டுகிறது; ἀκολούθει μοι என்பதன் சீடத்துவ மொழியை நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: τέλειος என்பதன் சீடத்துவப் பொருள்
  choice: நிறைவுள்ளவன்
  alternative: பூரணமானவன்; முதிர்ச்சியடைந்தவன்
  rationale: இளைஞனிடம் இன்னும் குறைவாக இருப்பதை அடுத்த சூழல் சுட்டுவதால், இங்கு முழுமையான அர்ப்பணிப்பு அல்லது குறைவின்மை முக்கியமாகிறது. ‘நிறைவுள்ளவன்’ மூலத்தின் தீவிரமான கோரிக்கையைப் பாதுகாப்பதோடு, குறிப்பிட்ட ஒரு பூரணத்துவக் கோட்பாட்டைத் திணிப்பதையும் தவிர்க்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; மரியாதையும் எளிமையும் கொண்ட நேரடி உரை. ‘நிறைவுள்ளவன்’ என்பது பொதுவாசகருக்குப் புரியும்படியும் மூலத்தின் பொருள் நுட்பத்தைப் பாதுகாக்கும்படியும் தேர்ந்தெடுக்கப்பட்டது.
