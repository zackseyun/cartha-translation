translation:
  language: ta
  text: சீடர்கள் இதைக் கேட்டபோது மிகவும் திகைத்தார்கள்; “அப்படியானால் யார் இரட்சிக்கப்பட முடியும்?” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: இதைக் கேட்டபோது
  rationale: இறந்தகாலப் பங்கேற்புவினை, முதன்மை வினைக்கு முந்திய சூழலைக் குறிக்கிறது. தமிழில் காலத்தைக் குறிக்கும் துணைவாக்கியம் இயல்பாக உள்ளது; ‘இதை’ என்பது இயேசுவின் முந்தைய கூற்றைச் சூழலிலிருந்து தெளிவுபடுத்துகிறது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக வெளிப்படுத்தப்படவில்லை
  rationale: δέ தொடர்ச்சியையோ மென்மையான முரண்பாட்டையோ குறிக்கிறது; ‘கேட்டபோது’ என்ற அமைப்பே தமிழில் மாற்றத்தை இயல்பாக எடுத்துரைப்பதால் தனி இணைப்புச்சொல் தேவையில்லை.
- source_word: μαθηταὶ
  choice: சீடர்கள்
  rationale: நற்செய்தி நூல்களில் இயேசுவின் μαθηταί என்பதற்கான நிலையான, இயல்பான தமிழ் சொல்.
- source_word: ἐξεπλήσσοντο
  choice: திகைத்து
  rationale: இச்சொல் கடும் அதிர்ச்சியும் வியப்பும் கலந்த எதிர்வினையைக் குறிக்கிறது. தமிழில் ‘திகைத்து’ அந்த வலிமையை இயல்பாகக் காக்கிறது.
- source_word: σφόδρα
  choice: மிகவும்
  rationale: வியப்பு அல்லது திகைப்பின் தீவிரத்தை வெளிப்படுத்தும் வலியுறுத்தலை நேரடியாகக் காக்கிறது.
- source_word: λέγοντες
  choice: என்று கேட்டார்கள்
  rationale: பேச்சை அறிமுகப்படுத்தும் பங்கேற்புவினை தமிழ்க் கதையாடலில் வரையறுக்கப்பட்ட வினையாக இயல்பாக மொழிபெயர்க்கப்படுகிறது; மேற்கோள் ஒரு கேள்வியாக இருப்பதால் ‘கேட்டார்கள்’ பொருத்தமானது.
- source_word: Τίς
  choice: யார்
  rationale: ஒரு நபரைப் பற்றிய நேரடி வினாப்பெயர்.
- source_word: ἄρα
  choice: அப்படியானால்
  rationale: இயேசுவின் முந்தைய கூற்றிலிருந்து சீடர்கள் எடுத்த முடிவையும் அவர்களது அதிர்ச்சியையும் காட்டும் ஊகத் தொடர்பைத் தெளிவாகக் காக்கிறது.
- source_word: δύναται
  choice: முடியும்
  rationale: திறன் அல்லது சாத்தியத்தைக் குறிக்கும் எளிய, நவீன தமிழ் வடிவம்.
- source_word: σωθῆναι
  choice: மீட்கப்பட
  rationale: செயப்பாட்டு இறந்திலா வினையின் வடிவத்தைக் காத்து, இச்சூழலில் தேவனால் அளிக்கப்படும் இரட்சிப்பு என்ற முழு பொருளையும் சமயப் பிரிவுக்குரிய கூடுதல் விளக்கமின்றி வெளிப்படுத்துகிறது.
theological_decisions:
- issue: σωθῆναι என்பதன் சூழல்சார் பொருள்
  choice: மீட்கப்பட
  alternative: இரட்சிக்கப்பட; காப்பாற்றப்பட
  rationale: அரசில் நுழைவதும் செல்வந்தருக்குள்ள கடினமும் பற்றிய உடனடிச் சூழலில் கேள்வி முழுமையான இரட்சிப்பைக் குறிக்கிறது. ‘மீட்கப்பட’ என்பது செயப்பாட்டு வடிவத்தையும் இறையியல் கனத்தையும் காக்கிறது; மீட்பின் முறை குறித்து எந்தச் சமயப் பிரிவின் விளக்கத்தையும் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியக்கூடியதாயும் கண்ணியமானதாயும் உள்ள நற்செய்திக் கதையாடல் நடை. மூலத்தின் வியப்பும் ஊகத் தொடர்பும் பாதுகாக்கப்பட்டுள்ளன.
