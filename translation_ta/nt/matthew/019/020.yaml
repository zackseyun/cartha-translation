id: MAT.19.20
reference: Matthew 19:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ νεανίσκος· ⸂Πάντα ταῦτα⸃ ⸀ἐφύλαξα· τί ἔτι ὑστερῶ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/020.yaml
  text: The young man says to him[a], “All these I have kept[b]. What do I still lack?”
translation:
  language: ta
  text: அந்த இளைஞன் அவரிடம், “இவை அனைத்தையும் நான் கடைப்பிடித்திருக்கிறேன்.[a] இன்னும் என்னிடம் என்ன குறை இருக்கிறது?[b]” என்று சொன்னான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவை அனைத்தையும் நான் கைக்கொண்டிருக்கிறேன்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இன்னும் எதில் நான் குறைவுபடுகிறேன்?”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: சொன்னான்
  rationale: கிரேக்கத்தில் இது வரலாற்று நிகழ்காலமாக இருந்தாலும், கடந்தகாலக் கதையாடலில் இயல்பான நவீனத் தமிழுக்காக இறந்தகால வினை பயன்படுத்தப்பட்டது.
- source_word: αὐτῷ
  choice: அவரிடம்
  rationale: ‘அவனிடம்’ என்ற பொருளைத் தரும் வேற்றுமை வடிவம்; இயேசுவைக் குறிக்கும் தமிழின் மரியாதை வழக்குக்கு ஏற்ப ‘அவரிடம்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ὁ νεανίσκος
  choice: அந்த இளைஞன்
  rationale: νεανίσκος என்பது ‘இளைஞன்’ என்று பொருள்படும். இந்த வசனத்தில் இல்லாத ‘தலைவன்’ என்ற தகவல் சேர்க்கப்படவில்லை.
- source_word: Πάντα ταῦτα
  choice: இவை அனைத்தையும்
  rationale: முன்பு குறிப்பிடப்பட்ட கட்டளைகள் அனைத்தையும் தெளிவாகச் சுட்டும் இயல்பான தமிழ் சொற்றொடர்.
- source_word: ἐφύλαξα
  choice: நான் கடைப்பிடித்திருக்கிறேன்
  rationale: கட்டளைகளைப் பின்பற்றி நடந்ததாகக் கூறும் பொருளை ‘கடைப்பிடி’ இயல்பாகத் தருகிறது; கடந்த நடத்தை இப்போதும் பொருத்தமுடையது என்பதால் நிறைவு நிலை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: τί ἔτι ὑστερῶ
  choice: இன்னும் என்னிடம் என்ன குறை இருக்கிறது?
  rationale: ὑστερέω என்பதிலுள்ள ‘குறைவாயிருத்தல், போதாமை இருத்தல்’ என்ற பொருளைத் திறந்த நிலையில் வைத்து, இளைஞன் இன்னும் எதில் குறைவுள்ளவன் என்று கேட்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கட்டளைகளுக்குக் கீழ்ப்படிந்ததாக இளைஞன் தன்னை மதிப்பிடுதல்
  choice: அவன் கூறுவதை மொழிபெயர்ப்பு நேரடியாகப் பதிவு செய்கிறது; அதை ஏற்றுக்கொள்வதாகவோ கேலியாகக் காட்டுவதாகவோ சைகை செய்யவில்லை.
  alternative: அவன் கூறியது நேர்மையானது ஆனால் தவறானது; அல்லது மிகைப்படுத்திக் கூறப்பட்டது என்று மொழிபெயர்ப்பிலேயே உணர்த்துதல்.
  rationale: கிரேக்க உரை இளைஞனின் கூற்றை நேரடியாக முன்வைக்கிறது. அதன் உண்மைத் தன்மையைப் பற்றிய இறையியல் மதிப்பீட்டைச் சுற்றியுள்ள நிகழ்வுரைக்கே விட்டுவிடுவது உரையிலுள்ள பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதையாடல் நடை பயன்படுத்தப்பட்டது. கிரேக்க வரலாற்று நிகழ்காலம் தமிழில் இயல்பான இறந்தகாலமாக்கப்பட்டது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின் வைக்கப்பட்டுள்ளன.
