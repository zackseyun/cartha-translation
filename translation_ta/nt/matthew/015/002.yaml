source:
  edition: SBLGNT
  text: Διὰ τί οἱ μαθηταί σου παραβαίνουσιν τὴν παράδοσιν τῶν πρεσβυτέρων; οὐ γὰρ νίπτονται τὰς χεῖρας ⸀αὐτῶν ὅταν ἄρτον ἐσθίωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/002.yaml
  text: Why do your disciples break the tradition of the elders? For they do not wash their hands when they eat bread[a][b].
translation:
  language: ta
  text: “உம்முடைய சீடர்கள் ஏன் முன்னோர்களின் பாரம்பரியத்தை மீறுகிறார்கள்? ஏனெனில், அவர்கள் அப்பம் சாப்பிடும்போது தங்கள் கைகளைக் கழுவுவதில்லை[a][b].” என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இது சாதாரணமாகக் கைகளைச் சுத்தம் செய்வதை மட்டும் குறிக்காமல், முன்னோர்களின் பாரம்பரியம் கோரிய கைகழுவும் நடைமுறையைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, “உணவு உண்ணும்போது.” கிரேக்கத்தில் “அப்பம்” என்பது சில நேரங்களில் பொதுவாக உணவையோ ஒரு வேளை உணவையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τί
  choice: ஏன்
  rationale: காரணத்தை வினவும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: οἱ μαθηταί σου
  choice: உம்முடைய சீடர்கள்
  rationale: σου என்பதன் ஒருமை இரண்டாம் நபரையும் μαθηταί என்பதன் சீடர் பொருளையும் தெளிவாகக் காட்டுகிறது; நேரடி உரைக்கு ஏற்ற கண்ணியமான நடை.
- source_word: παραβαίνουσιν
  choice: மீறுகிறார்கள்
  rationale: அதிகாரமுடைய விதி அல்லது மரபின் எல்லையை மீறுதல் என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: τὴν παράδοσιν τῶν πρεσβυτέρων
  choice: மூப்பர்களின் பாரம்பரியத்தை
  rationale: παράδοσις என்பது வழிவழியாக ஒப்படைக்கப்பட்ட அதிகாரமுடைய மரபு; πρεσβύτεροι இங்கு வெறும் வயதானவர்களையல்ல, அங்கீகரிக்கப்பட்ட முன்னோர் ஆசிரியர்களைக் குறிக்கிறது.
- source_word: οὐ γὰρ νίπτονται τὰς χεῖρας αὐτῶν
  choice: அவர்கள் தங்கள் கைகளைக் கழுவுவதில்லையே
  rationale: γάρ இங்கு முந்தைய கேள்விக்கான ஆதாரத்தைச் சுட்டுகிறது; தமிழில் ‘-இல்லையே’ கேள்வியின் குற்றச்சாட்டு நயத்தையும் காரணத் தொடர்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὅταν ἄρτον ἐσθίωσιν
  choice: அவர்கள் அப்பம் சாப்பிடும்போது
  rationale: ἄρτον என்பதன் நேரடிப் பொருளான ‘அப்பம்’ தக்கவைக்கப்படுகிறது; ὅταν உடன் வரும் நிகழ்வழக்குப் பொருள் ‘சாப்பிடும்போது’ என்பதில் இயல்பாக வெளிப்படுகிறது.
theological_decisions:
- issue: கைகழுவுதல் குறித்த விவாதத்தின் தன்மை
  choice: மூப்பர்களின் பாரம்பரியத்தைப் பற்றிய விவாதமாகவே முதன்மை உரையில் வைக்கப்பட்டது.
  alternative: ‘சடங்குமுறைப்படி கைகளைக் கழுவுதல்’ என்று முதன்மை உரையிலேயே விளக்குதல் அல்லது இதைச் சாதாரண சுகாதாரமாகப் புரிந்துகொள்ளுதல்.
  rationale: வசனம் பிரச்சினையை ‘மூப்பர்களின் பாரம்பரியம்’ என்ற சட்டகத்திலேயே முன்வைக்கிறது. அதன் சடங்கு அல்லது சமூகப் பின்னணியை முதன்மை உரை அளிப்பதைவிட அதிகமாகத் தீர்மானிக்காமல், பண்பாட்டு விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகம நேரடி உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘உம்முடைய’ என்பது மரியாதைமிக்க ஒருமையைத் தக்கவைக்கிறது. கிரேக்கத்தில் தனியாக உரையாற்றுபவர் குறிச்சொல் இல்லாவிட்டாலும், தமிழ் வெளியீட்டு வசனமாக முழுமையுற ‘என்று கேட்டார்கள்’ சேர்க்கப்பட்டது; இது முந்தைய வசனத்தின் பன்மை எழுவாயைச் சார்ந்த சூழல்சார் நிறைவு.
