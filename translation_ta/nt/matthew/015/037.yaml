  text: And they all ate and were satisfied[a], and they picked up seven full baskets of the leftover pieces.
translation:
  language: ta
  text: அவர்கள் அனைவரும் சாப்பிட்டு திருப்தியடைந்தார்கள்; மீதியாக இருந்த துண்டுகளை ஏழு கூடைகள் நிறைய அவர்கள் சேகரித்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கே ‘கூடை’ என்று மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொல் (ஸ்புரிஸ்), வேறு சில பெருந்திரளுக்கு உணவளித்த நிகழ்வுகளில் குறிப்பிடப்படும் கூடைகளைவிடப் பெரிய வகைக் கூடையைக் குறிக்கலாம். எனவே, ‘ஏழு பெரிய கூடைகள் நிறைய’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: சாப்பிட்டார்கள்
  rationale: ἐσθίω என்பதன் இறந்தகால வடிவம் இங்கு நேரடியாக ‘சாப்பிட்டார்கள்’ எனப் பொருள்படுகிறது; கிரேக்கத்தில் உணவு என்ற செயப்படுபொருள் வெளிப்படையாக இல்லை.
- source_word: πάντες
  choice: அவர்கள் எல்லாரும்
  rationale: கூட்டத்திலிருந்த அனைவரையும் உள்ளடக்கும் பொருளை இயல்பான நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐχορτάσθησαν
  choice: திருப்தியடைந்தார்கள்
  rationale: போதுமான அளவு உண்டு நிறைவடைந்தார்கள் என்ற பொருளை, உணவுசார் சூழலில் இயல்பாகக் காட்டுகிறது.
- source_word: τὸ περισσεῦον τῶν κλασμάτων
  choice: மீதியாக இருந்த துண்டுகள்
  rationale: மீதமிருந்த உடைக்கப்பட்ட உணவுத் துண்டுகள் என்ற கூட்டு எண்ணத்தை எளிய, இயல்பான தமிழில் தருகிறது.
- source_word: ἦραν
  choice: சேகரித்தபோது
  rationale: αἴρω என்பதற்கு அடிப்படையில் ‘எடுத்தார்கள்’ என்று பொருள் இருந்தாலும், மீதித் துண்டுகளை எடுக்கும் இச்சூழலில் ‘சேகரித்தார்கள்’ என்பது நோக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἑπτὰ σπυρίδας πλήρεις
  choice: ஏழு கூடைகள் நிறைந்தன
  rationale: கூடைகளின் எண்ணிக்கையையும் அவை முழுவதும் நிரம்பியதையும் தெளிவாகக் கூறுகிறது; σπυρίς குறிக்கக்கூடிய பெரிய அளவு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
