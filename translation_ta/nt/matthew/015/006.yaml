- from: அவன் தன் தகப்பனை மதிக்க வேண்டியதே இல்லை[a]. இவ்வாறு உங்கள் பாரம்பரியத்தினால் கடவுளுடைய வார்த்தையைச் செல்லாததாக்கிவிட்டீர்கள்.[b]
  to: அவன் தன் தந்தையை மதிக்கவே தேவையில்லை[a]. நீங்கள் உங்கள் பாரம்பரியத்தின் காரணமாகக் கடவுளுடைய வார்த்தையை[b] செல்லாததாக்கிவிட்டீர்கள்.
  rationale: The revision removes the unrepresented inferential connective, uses idiomatic modern Tamil, makes the causal relation explicit, and moves the textual-variant anchor to the phrase it annotates. It preserves the singular ‘father,’ the main-text reading ‘word of God,’ and the contextual but non-expanded translation of τιμάω as ‘honor.’
