  text: ⸀οὐ μὴ ⸀τιμήσει τὸν πατέρα ⸀αὐτοῦ· καὶ ἠκυρώσατε ⸂τὸν λόγον⸃ τοῦ θεοῦ διὰ τὴν παράδοσιν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/006.yaml
  text: he certainly need not honor his father[b][a]. And you have nullified the word of God for the sake of your tradition.
translation:
  language: ta
  text: அவன் தன் தந்தையை மதிக்கவே தேவையில்லை[a]. நீங்கள் உங்கள் பாரம்பரியத்தின் காரணமாகக் கடவுளுடைய வார்த்தையை[b] செல்லாததாக்கிவிட்டீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கே ‘மதிப்பது’ என்பது வெறுமனே மரியாதை காட்டுவதை மட்டுமல்லாமல், பெற்றோரின் தேவைகளை நிறைவேற்றுவதையும் உள்ளடக்கியிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சில கையெழுத்துப் பிரதிகளில் ‘கடவுளுடைய வார்த்தை’ என்பதற்குப் பதிலாக ‘கடவுளுடைய கட்டளை’ என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: οὐ μὴ τιμήσει
  choice: மதிக்க வேண்டியதே இல்லை
  rationale: οὐ μή என்பதன் வலியுறுத்தப்பட்ட மறுப்பையும், இச்சூழலில் பெற்றோருக்கு உரிய கடமையிலிருந்து விலக்கு அளிக்கும் பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது. τιμάω என்பதன் அடிப்படைப் பொருளான ‘மதி/கனம் செய்’ என்பதையும் காக்கிறது.
- source_word: τὸν πατέρα αὐτοῦ
  choice: தன் தகப்பனை
  rationale: கிரேக்க மூலத்தில் உள்ள ஒருமை ‘அவனுடைய தகப்பன்’ என்பதை விரிவாக்காமல் அப்படியே பின்பற்றுகிறது; இயல்பான தமிழுக்காகத் தற்சுட்டுப் பெயரடை பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἠκυρώσατε
  choice: செல்லாததாக்கிவிட்டீர்கள்
  rationale: ἀκυρόω என்பதன் ‘செல்லுபடியாகாததாக்கு, பயனற்றதாக்கு’ என்ற வலுவான பொருளைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: கடவுளுடைய வார்த்தையை
  rationale: SBLGNT-இன் λόγον என்ற வாசகத்தை நேரடியாகப் பின்பற்றுகிறது; ἐντολήν என்ற மாற்று வாசகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: உங்கள் பாரம்பரியத்தினால்
  rationale: διά + accusative இங்கே காரணத்தையோ வழிமுறையையோ சுட்டலாம். ‘பாரம்பரியத்தினால்’ அந்தச் சிறிய பொருள் நெகிழ்வைத் தக்கவைத்து இயல்பாக உள்ளது.
theological_decisions:
- issue: ‘மதித்தல்’ என்பது பெற்றோருக்குப் பொருளாதார உதவி செய்வதையும் உள்ளடக்குகிறதா?
  choice: முதன்மை உரையில் ‘மதிக்க’ என்று வைத்து, நடைமுறைப் பராமரிப்பு சார்ந்த உட்பொருளை அடிக்குறிப்பில் விளக்குதல்.
  alternative: ‘ஆதரிக்க’ அல்லது ‘பராமரிக்க’ என்று மொழிபெயர்த்தல்.
  rationale: சூழல் பெற்றோருக்கான பொருளாதாரக் கடமையை உள்ளடக்கியிருந்தாலும், τιμάω என்ற சொல் அதைவிட விரிவான ‘மதித்தல்’ என்ற பொருளுடையது; கட்டளையுடனான சொல் தொடர்பைத் தக்கவைப்பது சிறந்தது.
- issue: மூல வாசகத்தைச் சூழலோ இணை வசனங்களோடு ஒத்திசைத்தல்
  choice: SBLGNT-இல் உள்ள ஒருமை ‘தகப்பன்’ மற்றும் ‘கடவுளுடைய வார்த்தை’ ஆகியவற்றையே மொழிபெயர்த்தல்.
  alternative: ‘தகப்பன் அல்லது தாய்’ என்று விரிவாக்குதல்; அல்லது ‘கடவுளுடைய கட்டளை’ என்ற மாற்று வாசகத்தை முதன்மை உரையில் ஏற்றல்.
  rationale: கொடுக்கப்பட்ட கிரேக்க மூலத்துக்கு முன்னுரிமை அளிக்கப்படுகிறது; குறிப்பிடத்தக்க மாற்று வாசகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘தகப்பன்’ என்பது வேதாகமக் கட்டளையுடனான சொல் தொடர்பைத் தக்கவைக்கிறது. எல்லா அடிக்குறிப்பு குறிகளும் அவை சார்ந்த சொற்றொடர்களுக்குப் பின்பே அமைக்கப்பட்டுள்ளன.
