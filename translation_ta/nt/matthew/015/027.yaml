  text: ἡ δὲ εἶπεν· Ναί, κύριε, καὶ γὰρ τὰ κυνάρια ἐσθίει ἀπὸ τῶν ψιχίων τῶν πιπτόντων ἀπὸ τῆς τραπέζης τῶν κυρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/027.yaml
  text: She said[a], “Yes, Lord[b], for even the little dogs eat from the crumbs that fall from their masters’ table.”
translation:
  language: ta
  text: அதற்கு அவள், “ஆம், ஆண்டவரே[b]; ஏனெனில் சிறிய நாய்கள்கூட[a] தங்கள் எஜமானர்களின் மேசையிலிருந்து விழும் உணவுத் துணுக்குகளைத் தின்கின்றன” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நாய்கள்,’ ‘வீட்டு நாய்கள்,’ அல்லது ‘நாய்க்குட்டிகள்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கத்தில் சிறுமைப் பொருளுள்ள வடிவம் பயன்படுத்தப்பட்டிருப்பதால், சிறிய அல்லது வீட்டில் வளர்க்கப்படும் நாய்கள் குறிக்கப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘ஆண்டவரே’ என்பதை மரியாதையான ‘ஐயா’ என்றும் புரிந்துகொள்ளலாம்; எனினும் κύριος என்பதன் வழக்கமான நற்செய்தி நூல் மொழிபெயர்ப்பு இங்கே தக்கவைக்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: Ναί
  choice: ஆம்
  rationale: இது பெண்ணின் நேரடியான உடன்பாட்டை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: κύριε
  choice: ஆண்டவரே
  rationale: இயேசுவை நேரடியாக அழைக்கும் மரியாதையையும், ‘ஆண்டவர்’ என்ற ஆழமான பொருளுக்கான வாய்ப்பையும் தக்கவைக்கிறது.
- source_word: καὶ γὰρ
  choice: ஏனெனில் ... கூட
  rationale: γὰρ என்பதன் விளக்கக் காரணத்தையும் καί என்பதன் ‘கூட’ என்ற வலியுறுத்தலையும் இணைத்துக் காட்டுகிறது.
- source_word: κυνάρια
  choice: சிறிய நாய்கள்
  rationale: மூலத்திலுள்ள சிறுமைப் பொருளைத் தக்கவைக்கிறது; வயதைக் குறிப்பாகச் சுட்டும் ‘நாய்க்குட்டிகள்’ என்ற பொருளைத் தேவையின்றி விதிக்கவில்லை.
- source_word: ἐσθίει
  choice: தின்கின்றன
  rationale: விலங்குகள் உண்பதைக் குறிக்கும் இயல்பான தமிழ் வினை; கிரேக்கத்தில் நடுநிலைப் பன்மை எழுவாயுடன் ஒருமை வினை வந்தாலும் தமிழில் பன்மை இயைபு பயன்படுத்தப்பட்டுள்ளது.
- source_word: ψιχίων
  choice: உணவுத் துணுக்குகள்
  rationale: மேசையிலிருந்து விழும் சிறு உணவுத் துகள்கள் என்ற சூழல்சார் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: τῶν πιπτόντων
  choice: விழும்
  rationale: பெயரெச்சத் தொடரின் பொதுவான அல்லது தொடர்ச்சியான செயற்பொருளைச் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: τραπέζης
  choice: மேசை
  rationale: வீட்டு உணவுச் சூழலை நேரடியாகக் குறிக்கும் வழக்கமான இணைச்சொல்.
- source_word: τῶν κυρίων αὐτῶν
  choice: தங்கள் எஜமானர்களின்
  rationale: உருவகத்தில் நாய்களுக்கும் அவற்றை வைத்திருப்பவர்களுக்கும் இடையிலான உறவையும் அதிகார நுணுக்கத்தையும் இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: இயேசுவை நோக்கிய κύριε என்ற அழைப்பை மொழிபெயர்த்தல்
  choice: ஆண்டவரே
  alternative: ஐயா
  rationale: இது மரியாதையான அழைப்பாகவும் இயேசுவின் அதிகாரத்தை உணர்த்தும் சொல்லாகவும் இருக்கக்கூடிய இருபொருள் வாய்ப்பைத் தக்கவைக்கிறது; வெறும் மரியாதைச் சொல்லாக மட்டும் குறுக்கவில்லை.
- issue: κυνάρια என்பதிலுள்ள சிறுமைப் பொருள்
  choice: சிறிய நாய்கள்
  alternative: நாய்கள்; வீட்டு நாய்கள்; நாய்க்குட்டிகள்
  rationale: கடுமையான உருவகத்தை மூலத்தைவிடக் கடுமையாக்காமலும், ‘நாய்க்குட்டிகள்’ என்று வயதைத் திட்டவட்டமாக்காமலும் கிரேக்கச் சொல்லின் சிறுமைப் பொருளைத் தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘எஜமானர்’ உருவகத்தின் மனிதர்–விலங்கு உறவைத் தெளிவாக வைத்திருக்கிறது; ‘தின்கின்றன’ விலங்குகளுக்குப் பொருத்தமான இயல்பான வினையாகும். எல்லா அடிக்குறிப்புக் குறிகளும் தொடர்புடைய சொற்களுக்குப் பின் முதன்மை உரையில் இடம்பெற்றுள்ளன.
