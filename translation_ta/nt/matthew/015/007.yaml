id: MAT.15.7
reference: Matthew 15:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὑποκριταί, καλῶς ἐπροφήτευσεν περὶ ὑμῶν Ἠσαΐας λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/007.yaml
  text: 'Hypocrites[a], Isaiah rightly prophesied about you, saying:'
translation:
  language: ta
  text: 'வெளிவேடக்காரர்களே! ஏசாயா உங்களைக் குறித்து சரியாகவே[a] இறைவாக்குரைத்தார்; அவர் இவ்வாறு கூறினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நன்றாகவே.”
    reason: கலῶς என்பதற்கு ‘சரியாக’ என்றும் ‘நன்றாக’ என்றும் பொருள் கொள்ளக்கூடிய சொற்பொருள் மாற்று உள்ளது.
lexical_decisions:
- source_word: ὑποκριταί
  choice: வெளிவேடக்காரர்களே
  rationale: பன்மை விளிவேற்றுமையில் நேரடியாகக் கண்டிக்கும் சொல்லாக இருப்பதைப் பாதுகாக்கிறது. நவீனத் தமிழில் வெளிப்புறத்தில் ஒன்றாகக் காட்டிக்கொண்டு உள்ளத்தில் வேறாக இருப்பவர்களைக் குறிக்கும் வலிமையான, எளிதில் புரியும் சொல்.
- source_word: καλῶς
  choice: சரியாகவே
  rationale: ஏசாயாவின் இறைவாக்கு இங்கு குறிப்பிடப்படுகிறவர்களுக்குத் துல்லியமாகவும் பொருத்தமாகவும் அமைந்தது என்ற வலியுறுத்தலை இயல்பான தமிழில் தெரிவிக்கிறது; மூலத்தின் வினையடைச் செயலையும் காக்கிறது.
- source_word: ἐπροφήτευσεν
  choice: இறைவாக்குரைத்தார்
  rationale: தீர்க்கதரிசியாகப் பேசும் செயலைச் சுருக்கமாகவும் மரியாதையான வேதாகம நடையிலும் தெரிவிக்கிறது.
- source_word: περὶ ὑμῶν
  choice: உங்களைக் குறித்து
  rationale: περί உடன் வரும் மரபுவழிப் பொருளான ‘உங்களைப் பற்றி/குறித்து’ என்பதை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: Ἠσαΐας
  choice: ஏசாயா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள தீர்க்கதரிசியின் பெயர் வடிவம்.
- source_word: λέγων
  choice: 'அவர் சொன்னது:'
  rationale: அடுத்து வரும் மேற்கோளை அறிமுகப்படுத்தும் நிகழ்காலப் பெயரெச்சத்தின் பணியை இயல்பான தமிழில் வெளிப்படையாக நிறைவேற்றுகிறது.
theological_decisions:
- issue: இயேசுவின் நேரடிக் கண்டனத்தின் வலிமை
  choice: வெளிவேடக்காரர்களே
  alternative: நடிப்பவர்களே / மாயக்காரர்களே
  rationale: ὑποκριταί என்பது சூழலில் வலுவான ஒழுக்க மற்றும் சமயக் கண்டனம். அதை மென்மையாக்காமல், பாசாங்கான வெளித்தோற்றத்தைத் தெளிவாக உணர்த்தும் நவீனத் தமிழ்ச் சொல் தேர்ந்தெடுக்கப்பட்டது.
- issue: ஏசாயாவின் இறைவாக்கு இவர்களுக்குப் பொருந்தும் விதம்
  choice: சரியாகவே
  alternative: நன்றாக
  rationale: καλῶς என்பதில் ‘நன்றாக’ என்ற முறையியல் பொருளும் ‘சரியாக/பொருத்தமாக’ என்ற மதிப்பீட்டுப் பொருளும் சாத்தியம். சூழலில் இறைவாக்கு இவர்களுக்கு உண்மையாகப் பொருந்துகிறது என்பதைக் ‘சரியாகவே’ தெளிவாக்குகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியான கண்டனத்தின் கூர்மையையும் தீர்க்கதரிசனச் சொல்லாட்சியின் கண்ணியத்தையும் இணைக்கும் நடை. அடுத்த வசனத்தில் வரும் மேற்கோளுக்காக இறுதியில் முக்காற்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
