translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமான வேதாகமக் கதைநடையிலும் வடிவமைக்கப்பட்டது. மரியாதைப் பன்மை வினைமுற்றுகள் இயேசுவைக் குறிப்பிடப் பயன்படுத்தப்பட்டுள்ளன. மூலத்தில் உள்ள தொடர்ச்சியான அமர்ந்த நிலையும், கடலோர இயக்கம்/அருகாமை குறித்த உண்மையான பொருள் வாய்ப்பும் பாதுகாக்கப்பட்டுள்ளன.
