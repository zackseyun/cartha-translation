  text: Καὶ μεταβὰς ἐκεῖθεν ὁ Ἰησοῦς ἦλθεν παρὰ τὴν θάλασσαν τῆς Γαλιλαίας, καὶ ἀναβὰς εἰς τὸ ὄρος ἐκάθητο ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/029.yaml
  text: And departing from there[a], Jesus came along the Sea of Galilee, and after going up on the mountain[b], he sat there.
translation:
  language: ta
  text: அங்கிருந்து புறப்பட்ட பின்பு, இயேசு கலிலேயா கடலோரமாக[a] வந்தார்; மலையின்மேல் ஏறி, அங்கே அமர்ந்திருந்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கலிலேயா கடலருகே.’ கிரேக்க முன்னிடைச்சொல் கரையோரமாகச் செல்லுதலையோ கரைக்கு அருகிலுள்ள இடத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அங்கே அமர்ந்தார்.’ கிரேக்க வினைவடிவம் தொடர்ந்து அமர்ந்திருந்த நிலையைக் காட்டுவதால், முதன்மை உரையில் ‘அமர்ந்திருந்தார்’ என்று தரப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταβὰς ἐκεῖθεν
  choice: அங்கிருந்து புறப்பட்ட பின்பு
  rationale: இறந்தகால வினையெச்சமான μεταβὰς, முதன்மை வினைக்கு முன்னதாக நடந்த செயலைக் குறிக்கிறது; ἐκεῖθεν என்பது ‘அங்கிருந்து’ என்ற இடநீக்கப் பொருளைத் தருகிறது.
- source_word: ἦλθεν
  choice: வந்தார்
  rationale: ἔρχομαι என்பதன் எளிய இறந்தகாலக் கதைநடை வடிவம்; நற்செய்தி நிகழ்வுரையில் இயல்பாக ‘வந்தார்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: παρὰ τὴν θάλασσαν τῆς Γαλιλαίας
  choice: கலிலேயக் கடலோரமாக
  rationale: இயக்க வினையுடன் வரும் παρά + வேற்றுமை வடிவம், கரையோரமாகச் செல்வதையோ கரைக்கு அருகில் வருவதையோ குறிக்கலாம். ‘கடலோரமாக’ இயக்கத்தின் நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: ἀναβὰς εἰς τὸ ὄρος
  choice: மலையில் ஏறி
  rationale: மேலே சென்று மலையை அடைந்த செயலை இயல்பான தமிழில் தெரிவிக்கிறது; குறிப்பிட்ட பெயருள்ள மலை என்று தேவையின்றி உறுதிப்படுத்தவில்லை.
- source_word: ἐκάθητο
  choice: அமர்ந்திருந்தார்
  rationale: κάθημαι என்பதன் நிறைவுறாத இறந்தகால வடிவம் தொடர்ந்த நிலையைச் சுட்டுகிறது; ‘அமர்ந்திருந்தார்’ அந்த நீடித்த தன்மையைத் தக்கவைக்கிறது.
- source_word: ἐκεῖ
  choice: அங்கே
  rationale: எளிய இடக்குறிப்பு வினையடை; தமிழில் நேரடியான இணைச்சொல்.
- source_word: ὁ Ἰησοῦς
  choice: இயேசு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயரெழுத்தாக்கம்.
