  text: இவையே மனிதனைத் தீட்டுப்படுத்துபவை[a][b]; ஆனால் கழுவாத கைகளால் சாப்பிடுவது மனிதனைத் தீட்டுப்படுத்தாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மனிதனை அசுத்தமாக்குபவை’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் ஒருவரைச் சடங்குரீதியாக அசுத்தமாக்குவதைக் குறிக்கலாம்; இங்கே ‘தீட்டுப்படுத்து’ என்பது தூய்மை பற்றிய சூழலையும், இயேசுவின் போதனையிலுள்ள விரிவான களங்கத்தின் கருத்தையும் காக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘மனிதனை’ என்பது ஒருமையில் இருந்தாலும், எந்த மனிதருக்கும் பொருந்தும் பொதுவான உண்மையைச் சொல்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: κοινοῦντα / κοινοῖ
  choice: தீட்டுப்படுத்துபவை / தீட்டுப்படுத்தாது
  rationale: தூய்மை–தீட்டு விவாதச் சூழலில் κοινόω என்பது ஒருவரைச் சடங்குரீதியாகத் தீட்டுள்ளவராக்குவதைக் குறிக்கிறது; அதேவேளையில் இயேசுவின் போதனையிலுள்ள ஆழமான ஒழுக்கச் சீர்கேட்டின் கருத்தையும் தாங்குகிறது. ‘தீட்டுப்படுத்து’ இரு பரிமாணங்களையும் இயல்பாகக் காக்கிறது.
- source_word: ἄνθρωπον
  choice: மனிதனை
  rationale: கிரேக்க மொழியில் ஒருமையாகவும் பொதுப்படையான பிரதிநிதிப் பொருளிலும் உள்ளது. ‘மனிதனை’ என்பது ஒருமையைப் பேணியபடி எந்த மனிதருக்கும் பொருந்தும் பொதுவான உண்மையைத் தெரிவிக்கிறது.
- source_word: ἀνίπτοις χερσὶν
  choice: கழுவாத கைகளால்
  rationale: இது கிரேக்க வேற்றுமைத் தொடரை இயல்பான நவீனத் தமிழில் தருவதோடு, சூழலில் பேசப்படும் மரபுமுறை சார்ந்த கை கழுவுதலையும் தெளிவாகச் சுட்டுகிறது.
- source_word: φαγεῖν
  choice: சாப்பிடுவது
  rationale: பெயர்ச்சொல் தன்மையுடைய கிரேக்க வினையெச்சக் கட்டமைப்பை இயல்பான தமிழில் ‘சாப்பிடுவது’ என்று வழங்குகிறது.
- source_word: ταῦτά ἐστιν τὰ
  choice: இவையே ... பவை
  rationale: சுட்டுப்பெயரின் வலியுறுத்தலை ‘இவையே’ காக்கிறது; தொடரை நவீனத் தமிழில் இயல்பான தொடர்பெயர் அமைப்பாக வழங்குகிறது.
- source_word: δέ
  choice: ஆனால்
  rationale: உண்மையில் தீட்டுப்படுத்துபவற்றுக்கும் கழுவாத கைகளால் சாப்பிடுவதற்கும் இடையிலான முரண்பாட்டைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: தூய்மை விவாதத்தில் κοινόω என்பதன் பொருள்
  choice: ‘தீட்டுப்படுத்து’ என்று மொழிபெயர்த்து, சடங்குத் தீட்டு மற்றும் விரிவான ஒழுக்கக் களங்கம் ஆகிய இரண்டையும் தக்கவைத்தல்
  alternative: அசுத்தமாக்கு
  rationale: உடனடிச் சூழல் சடங்குத் தூய்மையைப் பற்றியது; ஆனால் இயேசுவின் கருத்து ஒரு மனிதனை உண்மையில் களங்கப்படுத்துவது எது என்பதையும் உள்ளடக்குகிறது. ‘தீட்டுப்படுத்து’ இந்த இறையியல் அழுத்தத்தைத் தேவையின்றி குறுக்காமல் காக்கிறது.
- issue: பொதுப்படையான ஒருமை ἄνθρωπον
  choice: ‘மனிதனை’ என்று ஒருமையில் வழங்குதல்
  alternative: ஒருவரை / மனிதர்களை
  rationale: மூலத்தின் பிரதிநிதித்துவ ஒருமையைப் பேணுகிறது; அதேசமயம் இது ஆண் ஒருவரை மட்டும் குறிக்காமல் எல்லா மனிதருக்கும் பொருந்தும் பொதுவான கூற்று என்பதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
