id: MAT.15.4
reference: Matthew 15:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ γὰρ θεὸς ⸀εἶπεν· Τίμα τὸν πατέρα καὶ τὴν μητέρα, καί· Ὁ κακολογῶν πατέρα ἢ μητέρα θανάτῳ τελευτάτω·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/004.yaml
  text: For God said[a], ‘Honor your father and your mother,’ and, ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: ta
  text: ஏனெனில், கடவுள், “உன் தந்தையையும் உன் தாயையும் மதித்து நட” என்றும், “தந்தையையோ தாயையையோ இழிவாகப் பேசுகிறவன் மரணத்துக்கு ஆளாக வேண்டும்[a]” என்றும் கூறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தந்தையையோ தாயையையோ சபிக்கிறவன் மரண தண்டனை பெற வேண்டும்.”
    reason: κακολογέω என்பதற்கு ‘சபித்தல்’ என்பது சாத்தியமான குறுகிய பொருள்; θανάτῳ τελευτάτω என்பது மரணத் தண்டனையைக் குறிக்கும் சட்டச் சூத்திரமாகவும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: ὁ γὰρ θεὸς
  choice: ஏனெனில் கடவுள்
  rationale: γάρ இயேசுவின் வாதத்திற்கான காரணவிளக்கத்தை அறிமுகப்படுத்துகிறது; ‘ஏனெனில்’ அதன் காரணத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἶπεν
  choice: கூறினார்
  rationale: λέγω இங்கு வேதமேற்கோள்களை அறிமுகப்படுத்துகிறது. ‘கூறினார்’ என்பது ‘கட்டளையிட்டார்’ என்ற வலுவான விளக்கத்தைச் சேர்க்காமல் அடிப்படைப் பொருளைக் காக்கிறது.
- source_word: Τίμα
  choice: கனம் பண்ணு
  rationale: τιμάω உரிய மதிப்பையும் மரியாதையையும் அளிப்பதைக் குறிக்கிறது. ‘கனம் பண்ணு’ பத்துக் கட்டளையின் அறநெறி வலிமையைத் தக்கவைத்துக்கொண்டு பொதுவான வேதாகமத் தமிழிலும் புரியத்தக்கதாக உள்ளது.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: உன் தந்தையையும் உன் தாயையும்
  rationale: மூலக் கட்டளையில் உள்ள இரண்டாம் நபர் உடைமைப் பொருள் மேற்கோளில் இயல்பாக உட்பொதிந்துள்ளது; தமிழில் ‘உன்’ என்பதை வெளிப்படுத்துவது கட்டளையைத் தெளிவாக்குகிறது.
- source_word: Ὁ κακολογῶν
  choice: சபிக்கிறவன்
  rationale: κακολογέω தீயவிதமாகப் பேசுதல், பழித்தல், சபித்தல் ஆகிய பொருட்களைக் கொண்டது. இங்கு பெற்றோரைப் பற்றிய சட்ட மேற்கோளில் ‘சபிக்கிறவன்’ அதன் தீவிரத்தையும் மூலச் சட்டப் பயன்பாட்டையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: πατέρα ἢ μητέρα
  choice: தந்தையையோ தாயையையோ
  rationale: ἢ காட்டும் மாற்றுத் தொடர்பைத் தமிழ் ‘-யோ…-யோ’ அமைப்பு இயல்பாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: θανάτῳ τελευτάτω
  choice: மரணதண்டனை பெறவேண்டும்
  rationale: இது மரணத்தை விதிக்கும் வலுவான சட்டச் சூத்திரம். செயற்படுத்துபவரை கிரேக்கம் வெளிப்படையாகக் குறிப்பிடாததால், ‘கொல்லப்படவேண்டும்’ என்பதற்குப் பதிலாக ‘மரணதண்டனை பெறவேண்டும்’ என்று கூறுவது சட்டப் பொருளையும் செய்பவர் குறித்த மறைமுகத்தன்மையையும் காக்கிறது.
theological_decisions:
- issue: மேற்கோளில் உள்ள சட்டரீதியான மரணத் தண்டனைச் சூத்திரத்தின் மொழிபெயர்ப்பு
  choice: மரணதண்டனை பெறவேண்டும்
  alternative: நிச்சயமாகச் சாகவேண்டும்
  rationale: θανάτῳ τελευτάτω என்பது சட்டத் தண்டனையைக் குறிக்கும் தீவிரமான சூத்திரம். தேர்ந்தெடுத்த வடிவம் அதன் சட்டச் சூழலைத் தெளிவாக்குகிறது; அதேவேளை தண்டனையை நிறைவேற்றும் மனித முகவரை மூலத்தைவிட வெளிப்படையாகச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘தந்தை’, ‘தாய்’, ‘கனம் பண்ணு’ ஆகியவை கட்டளையின் செறிவையும் வேதமேற்கோளின் தொனியையும் காக்கின்றன. அடிக்குறிப்பு குறி சம்பந்தப்பட்ட மரணத் தண்டனைச் சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
