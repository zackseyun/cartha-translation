- from: ஏனெனில் கடவுள், “உன் தந்தையையும் உன் தாயையும் கனம் பண்ணு” என்றும், “தந்தையையோ தாயையையோ சபிக்கிறவன் மரணதண்டனை பெறவேண்டும்[a]” என்றும் கூறினார்.
