    text: 'வேறு மொழிபெயர்ப்பு: “இயேசுவை அணுகி.”'
    reason: lexical_alternative
  revision_rationale: The revision retains the draft’s sound renderings for the temporal marker, origin, group names, and approach to Jesus. It adds «கூறினார்கள்» to represent λέγοντες and to introduce the direct speech that follows in verse 2. Past-tense narrative is retained as an idiomatic Tamil handling of the Greek historical present.
