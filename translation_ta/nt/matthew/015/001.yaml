id: MAT.15.1
reference: Matthew 15:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τότε προσέρχονται τῷ ⸀Ἰησοῦ ἀπὸ Ἱεροσολύμων ⸂Φαρισαῖοι καὶ γραμματεῖς⸃ λέγοντες
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/001.yaml
  text: Then Pharisees and scribes from Jerusalem come to Jesus[a], saying[b],
translation:
  language: ta
  text: 'அப்போது, எருசலேமிலிருந்து பரிசேயர்களும் வேத அறிஞர்களும் இயேசுவிடம் வந்து[a], கூறினார்கள்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: “இயேசுவை அணுகி.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: அப்போது
  rationale: அடுத்த நிகழ்வை அறிமுகப்படுத்தும் காலக் குறிப்பு; இயல்பான தமிழ் கதைநடையைப் பேணுகிறது.
- source_word: προσέρχονται
  choice: வந்து
  rationale: இயேசுவை அணுகும் இயக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது. கிரேக்கத்தின் வரலாற்று நிகழ்காலத்தைத் தமிழில் அப்படியே வைத்தால் செயற்கையாக ஒலிக்கும் என்பதால், தமிழ் கதைநடைக்கு ஏற்ற வடிவம் பயன்படுத்தப்பட்டது.
- source_word: τῷ Ἰησοῦ
  choice: இயேசுவிடம்
  rationale: அணுகப்படும் நபரைச் சுட்டும் தத்திவை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἀπὸ Ἱεροσολύμων
  choice: எருசலேமிலிருந்து
  rationale: தோற்ற இடத்தைத் துல்லியமாகக் காட்டுகிறது; அதற்கு அப்பாற்பட்ட அதிகாரப்பூர்வப் பொருளைச் சேர்க்கவில்லை.
- source_word: Φαρισαῖοι
  choice: பரிசேயர்கள்
  rationale: இந்த வரலாற்று-மதக் குழுவுக்கான தமிழில் நிலைபெற்ற பெயர்.
- source_word: γραμματεῖς
  choice: வேத அறிஞர்கள்
  rationale: இச்சூழலில் வேதச்சட்டம் சார்ந்த எழுத்தறிவும் நிபுணத்துவமும் கொண்டவர்களைக் குறிக்கும்; சாதாரண எழுத்தர்களாகத் தவறாகப் புரிந்துகொள்ளப்படுவதைத் தவிர்க்கும் இயல்பான நவீனத் தமிழ்.
- source_word: καὶ
  choice: -உம் … -உம்
  rationale: இரு குழுக்களையும் இணைக்கும் கிரேக்கச் சொல்லை இயல்பான தமிழ் இணைப்பு அமைப்பால் வழங்குகிறது.
- source_word: λέγοντες
  choice: வந்து
  rationale: அடுத்த வசனத்தின் நேரடிக் கூற்றை அறிமுகப்படுத்தும் பங்கேற்புவினை. தமிழில் ‘வந்து’ என்பதற்குப் பின் மேற்கோள் இயல்பாகத் தொடரும்; தனியே ‘சொல்லி’ எனச் சேர்ப்பது இங்கு அவசியமில்லை.
theological_decisions:
- issue: வரலாற்று நிகழ்காலம்
  choice: தமிழ் கதைநடைக்கு ஏற்ற இறந்தகாலத் தொடர்புவினை ‘வந்து’
  alternative: ‘வருகிறார்கள்’ என்று கிரேக்க நிகழ்காலத்தை வெளிப்படையாகத் தக்கவைத்தல்
  rationale: கிரேக்க வரலாற்று நிகழ்காலம் நிகழ்வுக்கு உயிரோட்டம் தருகிறது; ஆனால் தமிழில் தனித்த ஒரு வசனத்தில் நிகழ்காலம் செயற்கையாகவும் காலமாற்றம் போலவும் ஒலிக்கலாம். இயல்பான கதைநடையை முன்னிறுத்தி அதன் உரையாடல்-அறிமுகச் செயல்பாடு பேணப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானாலும் கண்ணியமான வேதாகமக் கதைநடை. வசனம் அடுத்த வசனத்தின் நேரடிக் கேள்வியோடு தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
