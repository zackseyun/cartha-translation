id: MAT.15.12
reference: Matthew 15:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τότε προσελθόντες οἱ ⸀μαθηταὶ ⸀λέγουσιν αὐτῷ· Οἶδας ὅτι οἱ Φαρισαῖοι ἀκούσαντες τὸν λόγον ἐσκανδαλίσθησαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/012.yaml
  text: Then the disciples came and said to him[b][a], “Do you know that the Pharisees were offended when they heard this word?”
translation:
  language: ta
  text: அப்போது சீடர்கள் அவரிடம் வந்து, “இந்த வார்த்தையைக்[b] கேட்ட பரிசேயர்கள் மனம் புண்பட்டார்கள்[a] என்பது உமக்குத் தெரியுமா?” என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதைத் தங்களுக்கு அவமதிப்பாக எடுத்துக்கொண்டார்கள்”; இன்னும் சொற்சார்ந்து, “இடறச் செய்யப்பட்டார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: “இந்த வார்த்தை” என்பது இயேசு இதற்கு முன் கூறிய கூற்றைக் குறிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: Τότε
  choice: அப்போது
  rationale: அடுத்த நிகழ்வை அறிமுகப்படுத்தும் இயல்பான தமிழ் கால இணைப்புச் சொல்.
- source_word: προσελθόντες
  choice: அவரிடம் வந்து
  rationale: வினையெச்சத் தொடரை இயல்பான தமிழில் வழங்குகிறது; சீடர்கள் இயேசுவை அணுகியதையும் காக்கிறது.
- source_word: οἱ μαθηταὶ
  choice: சீடர்கள்
  rationale: கிரேக்கத்தில் உடைமைச் சொல் இல்லாததால் ‘அவருடைய’ என்பதைச் சேர்க்காமல், சூழலால் குறிக்கப்படும் சீடர்களைத் தெளிவாகக் காட்டுகிறது.
- source_word: λέγουσιν αὐτῷ
  choice: என்று கேட்டார்கள்
  rationale: வரலாற்று நிகழ்காலத்தைத் தமிழ் கதைநடைக்கு இயல்பான இறந்தகாலமாக்குகிறது; கேள்வி வடிவிலான நேரடிக் கூற்றுக்கு ‘கேட்டார்கள்’ இயல்பானது.
- source_word: Οἶδας
  choice: உமக்குத் தெரியுமா
  rationale: நேரடியான கேள்வியைப் பாதுகாத்து, இயேசுவிடம் பேசுவதற்கேற்ற கண்ணியமான ஒருமை நடையைப் பயன்படுத்துகிறது.
- source_word: οἱ Φαρισαῖοι
  choice: பரிசேயர்கள்
  rationale: இக்குழுவின் பெயருக்கான வழக்கமான தமிழ் வடிவம்.
- source_word: ἀκούσαντες τὸν λόγον
  choice: இந்த வார்த்தையைக் கேட்ட
  rationale: λόγος என்பதற்கு முறையாக நெருக்கமான ‘வார்த்தை’ பயன்படுத்தப்பட்டு, சூழலில் அது இயேசுவின் முந்தைய கூற்றைக் குறிப்பது ‘இந்த’ என்பதால் இயல்பாக வெளிப்படுகிறது.
- source_word: ἐσκανδαλίσθησαν
  choice: மனம் புண்பட்டார்கள்
  rationale: இயேசுவின் கூற்றுக்கு பரிசேயர்கள் எதிர்மறையாகப் பிரதிசெயல்பட்டதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; ‘இடறச் செய்யப்பட்டார்கள்’ என்ற சொற்சார்ந்த உருவகத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
theological_decisions:
- issue: σκανδαλίζω என்ற சொல்லை இச்சூழலில் வழங்குதல்
  choice: மனம் புண்பட்டார்கள்
  alternative: அதைத் தங்களுக்கு அவமதிப்பாக எடுத்துக்கொண்டார்கள்; சொற்சார்ந்து, இடறச் செய்யப்பட்டார்கள்
  rationale: இங்கு பரிசேயர்கள் இயேசுவின் போதனையால் புண்பட்டதையே உடனடிச் சூழல் காட்டுகிறது. இரட்சிப்பு இழப்பு அல்லது ஒழுக்க வீழ்ச்சி போன்ற முடிவுகளை உரைக்குள் சேர்க்காமல், கிரேக்கச் சொல்லின் உருவகப் பரப்பை அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவை நோக்கிய உரையில் மரியாதையுள்ள ஒருமை வடிவமான ‘உமக்கு’ வைக்கப்பட்டுள்ளது; தேவையற்ற விளக்கச் சேர்க்கைகள் தவிர்க்கப்பட்டுள்ளன.
