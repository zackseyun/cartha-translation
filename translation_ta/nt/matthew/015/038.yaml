  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἱ δὲ ἐσθίοντες ἦσαν τετρακισχίλιοι ἄνδρες χωρὶς γυναικῶν καὶ παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/038.yaml
  text: Those who had eaten were four thousand men[a], besides women and children.
translation:
  language: ta
  text: உணவு உண்டவர்களில் ஆண்கள் நாலாயிரம் பேர் இருந்தார்கள்; பெண்களும் பிள்ளைகளும் அந்த எண்ணிக்கையில் சேர்க்கப்படவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெண்களையும் பிள்ளைகளையும் தவிர.”
    reason: χωρὶς என்பதன் இச்சூழலுக்குரிய மாற்று, சுருக்கமான மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: οἱ δὲ ἐσθίοντες
  choice: சாப்பிட்டவர்களில்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் பங்கேற்புவினையை இயல்பான தமிழில் வழங்குகிறது. உணவு உண்டு முடிந்த சூழலைக் கருத்தில் கொண்டு நிறைவுற்ற செயலைக் காட்டும் ‘சாப்பிட்ட’ பயன்படுத்தப்பட்டது. δέ-யின் மெலிந்த இணைப்புப் பொருளைத் தமிழில் தேவையற்ற எதிர்மறை வேறுபாடாக வெளிப்படுத்தவில்லை.
- source_word: ἦσαν τετρακισχίλιοι
  choice: நாலாயிரம் பேர் இருந்தார்கள்
  rationale: எண்ணிக்கையை அறிமுகப்படுத்தும் எளிய வாக்கிய அமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: ἄνδρες
  choice: ஆண்கள்
  rationale: இச்சொல் பொதுவாக மக்களை அல்ல, ஆண்களைத் தனிப்படக் குறிக்கிறது; பெண்களும் பிள்ளைகளும் பின்னர் தனியே குறிப்பிடப்படுவதால் அந்த வேறுபாடு பாதுகாக்கப்படுகிறது.
- source_word: χωρὶς
  choice: தவிர
  rationale: கூறப்பட்ட நாலாயிரம் என்ற எண்ணிக்கையில் பெண்களும் பிள்ளைகளும் சேர்க்கப்படவில்லை என்பதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: γυναικῶν καὶ παιδίων
  choice: பெண்களையும் பிள்ளைகளையும்
  rationale: திருமணமான பெண்கள் என்ற குறுகிய பொருளைத் திணிக்காமல் γυναικῶν என்பதை ‘பெண்கள்’ என்றும், வயது வரம்பை மிகக் குறுக்காமல் παιδίων என்பதை ‘பிள்ளைகள்’ என்றும் வழங்குகிறது.
theological_decisions:
- issue: பாலினத்தைக் குறிப்பாகக் காட்டும் எண்ணிக்கைச் சொற்றொடர்
  choice: முதன்மை உரையில் ‘ஆண்கள்’ என்பதை வைத்துக் கொண்டு, பெண்களும் பிள்ளைகளும் அந்த எண்ணிக்கைக்கு அப்பாற்பட்டவர்கள் எனத் தனியே குறிப்பிடுதல்
  alternative: ‘மக்கள்’ என்று பொதுப்படையாக மொழிபெயர்த்தல்
  rationale: கிரேக்க ἄνδρες ஆண்களைத் தனிப்படக் குறிக்கிறது; பெண்களும் பிள்ளைகளும் அடுத்து தனியே சொல்லப்படுகின்றனர். ‘மக்கள்’ என்பது மூலத்தின் முக்கியமான வேறுபாட்டை அழித்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடை. ‘சாப்பிட்டவர்களில்’ என்ற அமைப்பு உணவில் பங்கேற்ற முழுக் குழுவைக் காட்டுகிறது; ‘ஆண்கள்’ மூலத்தின் பாலினத் துல்லியத்தைப் பாதுகாக்கிறது.
