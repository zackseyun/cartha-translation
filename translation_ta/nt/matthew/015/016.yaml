id: MAT.15.16
reference: Matthew 15:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ εἶπεν· Ἀκμὴν καὶ ὑμεῖς ἀσύνετοί ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/016.yaml
  text: But he said[a], “Are you also still without understanding?”
translation:
  language: ta
  text: அதற்கு அவர், “நீங்களுமா இன்னும் புரிந்துகொள்ளாமல் இருக்கிறீர்கள்?” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: அதற்கு
  rationale: சீடரின் முந்தைய கேள்விக்கான இயேசுவின் பதிலை இயல்பான தமிழில் இணைக்கிறது; இங்குள்ள மென்மையான மாறுபாடு அல்லது உரையாடல் திருப்பையும் உணர்த்துகிறது.
- source_word: ὁ … εἶπεν
  choice: அவர் … என்றார்
  rationale: ὁ இங்கு இயேசுவைக் குறிக்கும் பதிலிடைப் பயன்பாட்டில் உள்ளது; εἶπεν என்பதற்கான இயல்பான தமிழ் கதைநடை வடிவம் ‘என்றார்’.
- source_word: Ἀκμὴν
  choice: இன்னும்
  rationale: ‘இப்போதும், இதுவரையிலும்’ என்ற தொடர்நிலையைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: καὶ ὑμεῖς
  choice: நீங்களுமா
  rationale: வலியுறுத்தப்பட்ட ὑμεῖς மற்றும் ‘கூட/உம்’ என்ற καὶ-யின் சேர்க்கைப் பொருளை கேள்வியின் கண்டிக்கும் தொனியுடன் இயல்பாகக் காக்கிறது.
- source_word: ἀσύνετοί ἐστε
  choice: புரிந்துகொள்ளாமல் இருக்கிறீர்கள்
  rationale: அறிவோ விவேகமோ இல்லாதவர்கள் என்ற கடுமையான முத்திரையைச் சேர்க்காமல், இச்சூழலில் உள்ள புரிதலின்மையைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: சீடர்களை இயேசு கண்டிக்கும் தொனி
  choice: தொடர்ந்து புரிந்துகொள்ளாதிருப்பதைச் சுட்டும் கூர்மையான கேள்வியாக மொழிபெயர்த்தல்
  alternative: “நீங்களும்கூட இன்னும் அறிவில்லாதவர்களாக இருக்கிறீர்களா?”
  rationale: மூலத்தில் கண்டிப்பு உள்ளது; ஆனால் அதை ஒழுக்கரீதியான கடுமையான தீர்ப்பாக உயர்த்தாமல், சீடர்களின் நீடித்த புரிதலின்மையை மையப்படுத்துகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, மரியாதையான கதைநடை. ‘நீங்களுமா’ என்பது καὶ ὑμεῖς-இன் வலியுறுத்தலைச் சுருக்கமாகத் தருகிறது; ‘இன்னும்’ என்பது Ἀκμήν குறிக்கும் தொடர்நிலையைப் பாதுகாக்கிறது.
