  source_fidelity: ‘அதற்கு அவர்’ appropriately renders the responsive δέ, and ‘என்றார்’ accurately represents εἶπεν with the contextual referent Jesus. ‘நீங்களுமா’ preserves the emphatic/inclusive force of καὶ ὑμεῖς. ‘இன்னும்’ conveys ἀκμήν (‘still/even now’), while ‘புரிந்துகொள்ளாமல் இருக்கிறீர்கள்’ communicates ἀσύνετοί ἐστε as a continued lack of understanding without importing a stronger moral accusation.
