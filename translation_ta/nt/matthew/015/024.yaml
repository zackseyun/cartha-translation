source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Οὐκ ἀπεστάλην εἰ μὴ εἰς τὰ πρόβατα τὰ ἀπολωλότα οἴκου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/024.yaml
  text: But he answered[a], “I was sent only to the lost sheep of the house of Israel.”
translation:
  language: ta
  text: ஆனால் அவர், “இஸ்ரவேல் வீட்டாராகிய காணாமற்போன ஆடுகளிடமே நான் அனுப்பப்பட்டேன்[a]” என்று பதிலளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்கு நெருக்கமாக, “இஸ்ரவேல் வீட்டாராகிய காணாமற்போன ஆடுகளிடமன்றி நான் அனுப்பப்படவில்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: என்று பதிலளித்தார்
  rationale: வினையெச்சத்தையும் முற்றுவினையையும் இயல்பான தமிழில் ஒரே பதிலளிப்பு வினையாகத் தருகிறது; இயேசுவின் மறுமொழி என்ற பொருள் முழுமையாகப் பாதுகாக்கப்படுகிறது.
- source_word: Οὐκ ἀπεστάλην
  choice: நான் அனுப்பப்பட்டேன்
  rationale: இறைப் பணிக்காக அனுப்பப்பட்டதைக் குறிக்கும் இறந்தகாலச் செயப்பாட்டு வடிவத்தைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: εἰ μὴ
  choice: மட்டுமே
  rationale: விதிவிலக்கின் மூலம் வரம்பிடும் கிரேக்கக் கட்டமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; சொல்லுக்கு நெருக்கமான எதிர்மறை வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: πρόβατα
  choice: ஆடுகள்
  rationale: மக்களைக் குறிக்கும் உருவகத்தை விளக்கவுரையாக மாற்றாமல் அப்படியே பாதுகாக்கிறது.
- source_word: ἀπολωλότα
  choice: காணாமற்போன
  rationale: வழிதவறித் தொலைந்த ஆடுகளின் உருவகத்திற்கு இயல்பான தமிழ்ச் சொல்; இறுதியான அழிவைத் தேவையின்றி உணர்த்துவதில்லை.
- source_word: οἴκου Ἰσραήλ
  choice: இஸ்ரவேல் வீட்டாரின்
  rationale: தேசியமும் உடன்படிக்கைச் சமூகமும் சார்ந்த வேதாகம மரபுத்தொடரின் நயத்தைப் பாதுகாக்கிறது; ‘வீடு’ என்பதை கட்டடமாகத் தவறாகப் புரிந்துகொள்ளாத வகையில் ‘வீட்டார்’ பயன்படுத்தப்படுகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வேண்டுகோளுக்குப் பதிலாக வரும் மென்மையான எதிர்மறைத் திருப்பத்தை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இந்தக் கூற்றில் இயேசுவின் பணியின் வரம்பு
  choice: இந்தச் சூழலில் அவரது பணி இஸ்ரவேலுக்கே வரம்பிடப்பட்டதாகக் கூற்றை நேரடியாக மொழிபெயர்த்தல்
  alternative: இஸ்ரவேலுக்கு முன்னுரிமை மட்டுமே அளிக்கப்பட்டதாக மென்மைப்படுத்துதல் அல்லது பிற இனத்தாருக்கான பிற்காலப் பணியை இங்கே சேர்த்துரைத்தல்
  rationale: Οὐκ ... εἰ μὴ என்பது வெளிப்படையான விதிவிலக்கு மற்றும் வரம்பைக் குறிக்கிறது. கதையிலுள்ள இறையியல் பதற்றத்தை மொழிபெயர்ப்பு தீர்த்துவைக்காமல் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை. ‘வீட்டார்’ என்ற வேதாகம மரபுச் சொல்லையும் ஆடுகளின் உருவகத்தையும் பாதுகாத்து, பிரதான உரையில் இயல்பான ‘மட்டுமே’ கட்டமைப்பு பயன்படுத்தப்பட்டுள்ளது.
