revisions:
- from: ஆனால் அவர், “இஸ்ரவேல் வீட்டாரின் காணாமற்போன ஆடுகளிடம் மட்டுமே நான் அனுப்பப்பட்டேன்[a]” என்று பதிலளித்தார்.
  to: ஆனால் அவர், “இஸ்ரவேல் வீட்டாராகிய காணாமற்போன ஆடுகளிடமே நான் அனுப்பப்பட்டேன்[a]” என்று பதிலளித்தார்.
  rationale: The revision retains the explicit limitation of Jesus’ stated mission and the sheep metaphor, while clarifying in natural Tamil that the “lost sheep” are the people described as the house of Israel. The footnote preserves the Greek negative-except construction (Οὐκ ... εἰ μὴ).
  reviewer_model: gpt-5.6-terra
