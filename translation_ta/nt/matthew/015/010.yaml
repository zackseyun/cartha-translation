  yaml_path: translation/nt/matthew/015/010.yaml
  text: And calling the crowd to him[a], he said to them, “Listen and understand.”
translation:
  language: ta
  text: மேலும் அவர் மக்கள் கூட்டத்தைத் தம்மிடம் அழைத்து அவர்களிடம், “கேளுங்கள், புரிந்துகொள்ளுங்கள்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: பின்பு
  rationale: கதைநிகழ்வைத் தொடர்ந்து முன்னெடுக்கும் இணைப்பாக இங்கு இயல்பாக அமைகிறது; கிரேக்க இணைப்புச் சொல்லில் இல்லாத காரணவியல் தொடர்பைச் சேர்ப்பதில்லை.
- source_word: προσκαλεσάμενος
  choice: தம்மிடம் அழைத்து
  rationale: இறந்தகால வினையெச்சம் முதன்மை வினைக்கு முன்னதாகவோ அதனுடன் நெருக்கமாகவோ நிகழ்ந்த செயலைக் குறிக்கிறது. இடை வினையின் திசை உணர்வை ‘தம்மிடம்’ வெளிப்படுத்துகிறது.
- source_word: τὸν ὄχλον
  choice: மக்கள் கூட்டத்தை
  rationale: குறிப்பிட்டுத் திரண்டிருந்த மக்களைக் குறிக்கும் ὄχλος என்பதற்கு நவீனத் தமிழில் தெளிவான, இயல்பான இணை.
- source_word: εἶπεν αὐτοῖς
  choice: அவர்களிடம் … என்றார்
  rationale: λέγω மற்றும் மறைமுகப் பொருள் αὐτοῖς ஆகியவற்றை மரியாதை நடையில் இயல்பான தமிழ்ச் சொற்றொடராக வழங்குகிறது.
- source_word: Ἀκούετε
  choice: கேளுங்கள்
  rationale: பன்மை ஏவலை நேரடியாகப் பாதுகாக்கிறது; சூழலில் வெறுமனே ஒலி கேட்பதல்ல, கவனித்துக் கேட்பதையும் இயல்பாக உணர்த்துகிறது.
- source_word: συνίετε
  choice: புரிந்துகொள்ளுங்கள்
  rationale: கேட்டதன் பொருளை அறிவால் உணர வேண்டும் என்ற ஏவலைத் தெளிவாகக் காட்டுகிறது; ‘கேளுங்கள்’ என்பதிலிருந்து உள்ள வேறுபாட்டையும் பாதுகாக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு எளிதில் புரியும், அதேவேளை வேதாகம உரைக்கு ஏற்ற கண்ணியமான மரியாதை நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் இரு பன்மை ஏவல்களும் தனித்தனியாகப் பாதுகாக்கப்பட்டுள்ளன.
