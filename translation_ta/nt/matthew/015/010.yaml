revisions:
- from: பின்பு அவர் மக்கள் கூட்டத்தைத் தம்மிடம் அழைத்து, அவர்களிடம், “கேளுங்கள், புரிந்துகொள்ளுங்கள்” என்றார்.
  to: மேலும் அவர் மக்கள் கூட்டத்தைத் தம்மிடம் அழைத்து அவர்களிடம், “கேளுங்கள், புரிந்துகொள்ளுங்கள்” என்றார்.
