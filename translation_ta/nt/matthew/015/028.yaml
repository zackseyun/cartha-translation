id: MAT.15.28
reference: Matthew 15:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τότε ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτῇ· Ὦ γύναι, μεγάλη σου ἡ πίστις· γενηθήτω σοι ὡς θέλεις. καὶ ἰάθη ἡ θυγάτηρ αὐτῆς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/028.yaml
  text: Then Jesus answered her[a], “O woman, great is your faith[b]; let it be done for you as you desire.” And her daughter was healed from that hour.
translation:
  language: ta
  text: அப்போது இயேசு அவளுக்குப் பதிலளித்து, “பெண்ணே, உன் விசுவாசம் பெரிது[a]. நீ விரும்புகிறபடியே உனக்கு ஆகட்டும்” என்றார். அந்த நேரத்திலிருந்தே அவளுடைய மகள் குணமடைந்தாள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் நம்பிக்கை பெரிது.” கிரேக்கச் சொல் πίστις, நம்பிக்கை அல்லது உண்மைத்தன்மை என்ற பொருள்களையும் கொண்டிருக்கலாம்; இங்கு “விசுவாசம்” என்பதே முதன்மையான மொழிபெயர்ப்பு.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “அந்த மணி நேரத்திலிருந்து”; “அந்தக் கணத்திலிருந்து” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: முந்தைய உரையாடலை இயேசுவின் பதிலோடு இணைக்கும் இயல்பான காலச் சுட்டியாக உள்ளது.
- source_word: ἀποκριθεὶς ... εἶπεν αὐτῇ
  choice: அவளுக்குப் பதிலளித்து ... என்றார்
  rationale: கிரேக்கக் கதைநடையில் இணைந்து வரும் வினை வடிவங்களைத் தமிழில் இயல்பாகக் காட்டுவதோடு, αὐτῇ என்பதையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: Ὦ γύναι
  choice: பெண்ணே
  rationale: நேரடி அழைப்பையும் வலியுறுத்தலையும் பாதுகாக்கிறது; இச்சூழலில் இது கடுமையானதல்ல, மரியாதையுள்ள நேரடி அழைப்பு.
- source_word: μεγάλη σου ἡ πίστις
  choice: உன் விசுவாசம் பெரிது
  rationale: πίστις என்பதற்கு வழக்கமான வேதாகமத் தமிழான ‘விசுவாசம்’ என்பதைக் கொண்டு, விசுவாசத்தின் பெருமையை வலியுறுத்தும் மூல அமைப்பைப் பாதுகாக்கிறது.
- source_word: γενηθήτω σοι
  choice: உனக்கு ஆகட்டும்
  rationale: γίνομαι என்பதன் கட்டளைத் தன்மையையும், இயேசுவின் செயலாற்றும் அறிவிப்பின் வலிமையையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ὡς θέλεις
  choice: நீ விரும்புகிறபடியே
  rationale: θέλω என்பதிலுள்ள விருப்பம் அல்லது ஆசை என்ற பொருளை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: ἰάθη
  choice: குணமடைந்தாள்
  rationale: பெண் பாலைக் குறிக்கும் மகளோடு இயல்பாக இசைந்து, நோயிலிருந்து நலம்பெற்றதைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: அந்த நேரத்திலிருந்தே
  rationale: கிரேக்கத் தொடரின் உடனடித் தன்மையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; சொற்பொருளிலுள்ள ‘மணி நேரம்’ அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: இயேசு பாராட்டும் πίστις என்பதன் பொருள்
  choice: விசுவாசம்
  alternative: நம்பிக்கை / நம்புதல்
  rationale: இச்சூழலில் அந்தப் பெண் இயேசுவைச் சார்ந்து வேண்டியதைச் சுட்டுவதால் ‘விசுவாசம்’ முதன்மைப் பொருளாகப் பொருந்துகிறது; ‘நம்புதல்’ என்ற நுண்பொருள் சாத்தியமாதலால் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் கண்ணியமான வேதாகம நடையைப் பேணுகிறது. ‘பெண்ணே’ என்பது கிரேக்க நேரடி அழைப்பை மென்மையாக்காமலும் கடுமையாக்காமலும் தருகிறது. உரையாடல் இயல்பாக இருக்க, ἀποκριθεὶς மற்றும் εἶπεν இணைந்த பேச்சு அறிமுகமாக மொழிபெயர்க்கப்பட்டுள்ளன.
