id: MAT.15.3
reference: Matthew 15:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Διὰ τί καὶ ὑμεῖς παραβαίνετε τὴν ἐντολὴν τοῦ θεοῦ διὰ τὴν παράδοσιν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/003.yaml
  text: But he answered and said to them[a], “Why do you also transgress the commandment of God for the sake of your tradition?”
translation:
  language: ta
  text: அதற்கு அவர் அவர்களிடம், “நீங்களும் ஏன் உங்கள் பாரம்பரியத்தின் பொருட்டு[a] கடவுளுடைய கட்டளையை மீறுகிறீர்கள்?” என்று பதில் சொன்னார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உங்கள் பாரம்பரியத்தின் காரணமாக” என்றும் மொழிபெயர்க்கலாம்.
    reason: διά + accusative அமைப்பு இங்கு ‘பொருட்டு’ அல்லது ‘காரணமாக’ என்ற நெருங்கிய நுணுக்கங்களில் புரிந்துகொள்ளப்படலாம்.
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: அதற்கு அவர் அவர்களிடம் … என்று பதில் சொன்னார்
  rationale: கிரேக்கத்தின் ‘பதிலளித்து சொன்னார்’ என்ற இரட்டை வினை வடிவம் செமித்தியத் தாக்கமுள்ள வழக்குச் சொற்றொடர். அதன் மறுமொழித் தன்மையையும் சொன்னார் என்ற கூறையும் இயல்பான நவீனத் தமிழில் இவ்வாறு தக்கவைக்கிறது.
- source_word: Διὰ τί
  choice: ஏன்
  rationale: காரணத்தை வினவும் கிரேக்கச் சொற்றொடருக்கு இயல்பான, தெளிவான தமிழ் இணை.
- source_word: καὶ ὑμεῖς
  choice: நீங்களும்
  rationale: முன்பு சீடர்கள்மீது சுமத்தப்பட்ட குற்றச்சாட்டை எதிராளிகளிடமே திருப்பும் ஒப்புமை மற்றும் வலியுறுத்தலைத் தக்கவைக்கிறது.
- source_word: παραβαίνετε
  choice: மீறுகிறீர்கள்
  rationale: கட்டளையின் எல்லையைக் கடந்து அதை மீறுதல் என்ற பொருளைத் தெளிவாகவும் கண்ணியமான நடையிலும் தருகிறது.
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: கடவுளுடைய கட்டளையை
  rationale: தெய்வீக அதிகாரத்தைக் குறிக்கும் ἐντολή என்பதற்கு ‘கட்டளை’ நேரடியானதும் பொதுமக்களுக்கு எளிதில் புரிவதுமான இணை.
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: உங்கள் பாரம்பரியத்தின் பொருட்டு
  rationale: διά + accusative அமைப்பில் உள்ள காரணம் அல்லது பொருட்டு என்ற நுணுக்கத்தைப் பாதுகாக்கிறது; παράδοσις என்பதை மனிதர்களால் வழிவழியாகக் கையளிக்கப்பட்ட ‘பாரம்பரியம்’ என நேரடியாகக் காட்டுகிறது.
theological_decisions:
- issue: கடவுளுடைய கட்டளைக்கும் மனிதப் பாரம்பரியத்திற்கும் இடையிலான முரண்பாடு
  choice: ‘கடவுளுடைய கட்டளை’ மற்றும் ‘உங்கள் பாரம்பரியம்’ என்ற நேரடி எதிர்மறை இணைப்பைப் பேணுதல்
  alternative: ‘போதனை’ அல்லது ‘வழக்கம்’ என்று பொதுப்படுத்துதல்
  rationale: இங்கு இயேசு எல்லாப் பாரம்பரியத்தையும் பொதுவாகக் கண்டிப்பதாக உரை கூறவில்லை; எதிராளிகளுக்குரிய குறிப்பிட்ட பாரம்பரியம் கடவுளுடைய கட்டளையை மீறுவதற்கு வழிவகுப்பதையே சுட்டுகிறார்.
- issue: διά என்பதன் காரண அல்லது நோக்க நுணுக்கம்
  choice: முதன்மை உரையில் ‘பொருட்டு’
  alternative: ‘காரணமாக’
  rationale: ‘பொருட்டு’ என்பது பாரம்பரியத்தை முன்னிட்டு அல்லது அதற்காகக் கட்டளையை மீறுகிறார்கள் என்ற கூர்மையான குற்றச்சாட்டைப் பேணுகிறது; காரணவியல் வாசிப்பை அடிக்குறிப்பு வெளிப்படையாகத் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘பாரம்பரியம்’ மற்றும் ‘கட்டளை’ என்ற சொற்கள் மூலத்தின் அதிகார முரண்பாட்டைத் தெளிவாகப் பேணுகின்றன; எந்தச் சமயப்பிரிவுக்குரிய தனிப்பட்ட விளக்கமும் சேர்க்கப்படவில்லை.
