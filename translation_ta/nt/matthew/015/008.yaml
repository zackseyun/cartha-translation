  text: ⸂Ὁ λαὸς οὗτος⸃ τοῖς χείλεσίν με τιμᾷ, ἡ δὲ καρδία αὐτῶν πόρρω ἀπέχει ἀπ’ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/008.yaml
  text: This people honors me with their lips[a], but their heart is far from me.
translation:
  language: ta
  text: “இந்த மக்கள் தங்கள் உதடுகளால் என்னை மதிக்கிறார்கள்; ஆனால் அவர்களுடைய இதயம்[a] என்னிடமிருந்து வெகு தொலைவில் இருக்கிறது.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய இதயங்கள்.” கிரேக்கத்தில் “இதயம்” ஒருமையில் உள்ளது; அது மக்களை ஒட்டுமொத்தமாகக் குறிக்கும் கூட்டுப்பொருளில் பயன்படுத்தப்பட்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ λαὸς οὗτος
  choice: இந்த மக்கள்
  rationale: λαός ஒரு மக்கள்கூட்டத்தைக் குறிக்கிறது; οὗτος என்பதன் சுட்டுப்பொருளை ‘இந்த’ நேரடியாகத் தக்கவைக்கிறது.
- source_word: τοῖς χείλεσίν
  choice: தங்கள் உதடுகளால்
  rationale: வேற்றுமை உருபின் கருவிப்பொருளையும் உதடுகள் என்ற உடல் சார்ந்த உருவகத்தையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: με
  choice: என்னை
  rationale: τιμᾷ என்பதன் நேரடிச் செயப்படுபொருளாக உள்ள முதல் நபர் ஒருமையை நேரடியாக மொழிபெயர்க்கிறது.
- source_word: τιμᾷ
  choice: மதிக்கிறார்கள்
  rationale: τιμάω இங்கு ஒருவருக்கு மதிப்பும் மரியாதையும் செலுத்துவதைக் குறிக்கிறது. ‘மதிக்கிறார்கள்’ என்பது நவீனத் தமிழில் இயல்பாகவும் மிகைப்படுத்தாமலும் உள்ளது; ‘மக்கள்’ என்பதுடன் தமிழ் வழக்குப்படி பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: ஆனால் அவர்களுடைய இருதயம்
  rationale: δέ என்பதன் எதிர்மறை மாறுபாட்டை ‘ஆனால்’ காட்டுகிறது. கிரேக்கத்தில் உள்ள ஒருமை καρδία, மக்களின் கூட்டு உள்ளார்ந்த நிலையைச் சுட்டுவதாக அப்படியே தக்கவைக்கப்பட்டுள்ளது.
- source_word: πόρρω
  choice: வெகுதொலைவில்
  rationale: πόρρω குறிக்கும் கணிசமான தூரத்தைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἀπέχει ἀπ’ ἐμοῦ
  choice: என்னிடமிருந்து ... இருக்கிறது
  rationale: ἀπέχω மற்றும் ἀπό இணைந்து காட்டும் தூரப்பட்டிருக்கும் நிலையைத் தமிழில் இயல்பாகக் கூறுகிறது; சூழலில் உள்ள உறவுரீதியான பிரிவையும் தக்கவைக்கிறது.
theological_decisions:
- issue: கூட்டுப்பொருளில் வரும் ஒருமை ‘இருதயம்’ அல்லது பகிர்ந்தளிக்கும் பன்மை
  choice: ‘அவர்களுடைய இருதயம்’ என்று ஒருமையைத் தக்கவைத்தல்
  alternative: ‘அவர்களுடைய இருதயங்கள்’
  rationale: கிரேக்கத்தின் ஒருமை καρδία மக்களை ஒரே உள்ளார்ந்த மனப்பாங்குடைய கூட்டமாக முன்வைக்கலாம். ஒருமையைத் தக்கவைப்பது தீர்க்கதரிசன மேற்கோளின் சொல்லாட்சியையும் அதன் கூட்டு வலிமையையும் பாதுகாக்கிறது; இருப்பினும் தமிழில் பன்மையும் இயல்பான மாற்றாக இருப்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கனம்பண்ணுகிறார்கள்’ போன்ற பழைய வழக்கைத் தவிர்த்து ‘மதிக்கிறார்கள்’ தேர்ந்தெடுக்கப்பட்டுள்ளது. உதடுகள்–இருதயம் என்ற மூல உருவக எதிர்மறை மாறுபாடு பாதுகாக்கப்பட்டுள்ளது.
