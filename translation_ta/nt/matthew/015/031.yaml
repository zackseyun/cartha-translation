  text: ὥστε ⸂τὸν ὄχλον⸃ θαυμάσαι βλέποντας κωφοὺς λαλοῦντας ⸂κυλλοὺς ὑγιεῖς⸃ ⸀καὶ χωλοὺς περιπατοῦντας καὶ τυφλοὺς βλέποντας· καὶ ἐδόξασαν τὸν θεὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/031.yaml
  text: so that the crowd marveled as they saw the mute speaking, the crippled made well, the lame walking, and the blind seeing; and they glorified the God of Israel.
translation:
  language: ta
  text: பேச முடியாதவர்கள் பேசுவதையும்[a], உடல் உறுப்புகள் ஊனமுற்றவர்கள் நலமடைந்ததையும்[b], நடக்க முடியாதவர்கள் நடப்பதையும், பார்வையற்றவர்கள் பார்ப்பதையும் கண்டு மக்கள் கூட்டம் வியப்படைந்தது; அவர்கள் இஸ்ரவேலின் கடவுளை மகிமைப்படுத்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கேளாதவர்கள் பேசுவதையும்.” கிரேக்கச் சொல் கேளாதவர்களையோ பேச முடியாதவர்களையோ குறிக்கலாம்; இங்கு அவர்கள் பேசுவதாகக் கூறப்படுவதால், “பேச முடியாதவர்கள்” என்பது முதன்மை உரையில் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உடல் உறுப்புகள் சிதைந்தவர்கள் முழுமையடைந்ததையும்.” கிரேக்கச் சொற்றொடர் ஊனமுற்ற அல்லது சிதைந்த உடல் உறுப்புகளைக் கொண்டவர்கள் நலமான நிலைக்கு வந்ததைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: …கண்டு மக்கள் கூட்டம் வியப்படைந்தது
  rationale: முந்தைய குணமாக்குதல்களின் விளைவாக மக்கள் வியப்படைந்ததைத் தமிழில் இயல்பான விளைவு அமைப்பில் தெரிவிக்கிறது.
- source_word: ὄχλον
  choice: மக்கள் கூட்டம்
  rationale: கதை நிகழும் சூழலில் கூடியிருந்த திரளான மக்களைத் தெளிவான நவீன தமிழில் குறிக்கிறது.
- source_word: θαυμάσαι
  choice: வியப்படைந்தது
  rationale: அவர்கள் கண்டவற்றால் ஏற்பட்ட ஆச்சரியமும் வியப்பும் நிறைந்த எதிர்வினையை வெளிப்படுத்துகிறது.
- source_word: κωφοὺς λαλοῦντας
  choice: பேச முடியாதவர்கள் பேசுவதையும்
  rationale: κωφός என்பது கேளாதவர்களையோ பேச முடியாதவர்களையோ குறிக்கலாம்; இங்கு ‘பேசுகிறார்கள்’ என்ற உடனடிச் சூழல் பேச்சுத்திறன் மீண்டதை முன்னிறுத்துகிறது.
- source_word: κυλλοὺς ὑγιεῖς
  choice: கை கால்கள் ஊனமுற்றவர்கள் நலமடைந்ததையும்
  rationale: κυλλός கை அல்லது கால் செயலிழந்த அல்லது சிதைந்த நிலையைக் குறிக்கிறது; ὑγιής அவர்கள் நலமான நிலைக்கு வந்ததைத் தெரிவிக்கிறது.
- source_word: χωλοὺς περιπατοῦντας
  choice: நடக்க முடியாதவர்கள் நடப்பதையும்
  rationale: நடப்பதில் ஊனமிருந்தவர்கள் இப்போது நடப்பதாகிய நேரடியான முரண்பாட்டை இயல்பான தமிழில் காட்டுகிறது.
- source_word: τυφλοὺς βλέποντας
  choice: பார்வையற்றவர்கள் பார்ப்பதையும்
  rationale: பார்வையற்றவர்களுக்குப் பார்வை கிடைத்ததை கிரேக்கத்தின் சுருக்கமான இணை அமைப்புக்கு நெருக்கமாகத் தருகிறது.
- source_word: ἐδόξασαν
  choice: மகிமைப்படுத்தினார்கள்
  rationale: கடவுளுடைய மகிமையை ஏற்றுப் போற்றிய எதிர்வினையை வலுவாகப் பாதுகாக்கிறது.
- source_word: τὸν θεὸν Ἰσραήλ
  choice: இஸ்ரவேலின் கடவுளை
  rationale: கிரேக்க உரையின் உறவு அமைப்பை நேரடியாகவும் தெளிவாகவும் வழங்குகிறது.
theological_decisions:
- issue: κωφούς என்பதன் பொருள்
  choice: பேச முடியாதவர்கள்
  alternative: கேளாதவர்கள்
  rationale: κωφός இரு பொருள்களையும் கொண்டிருக்கலாம். ஆனால் λαλοῦντας (‘பேசுகிறவர்கள்’) என்பதால் இங்கு பேச்சுத்திறன் மீட்கப்பட்டிருப்பதே முதன்மையாகத் தெரிகிறது; மற்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: கடவுளைச் சார்ந்த δοξάζω என்பதன் மொழிபெயர்ப்பு
  choice: மகிமைப்படுத்தினார்கள்
  alternative: போற்றினார்கள்
  rationale: அற்புதச் செயல்களைக் கண்ட மக்கள் கடவுளுக்கு மகிமை செலுத்தியதைத் தெரிவிக்கும் வலுவான இறையியல் நுண்பொருளைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. ஒரே மாதிரியான கிரேக்கப் பட்டியல் அமைப்பைத் தமிழில் இயல்பாகப் பாதுகாத்து, உடல் குறைபாடுள்ளவர்களை இழிவுபடுத்தாத விளக்கச் சொற்றொடர்கள் பயன்படுத்தப்பட்டுள்ளன.
