id: MAT.15.11
reference: Matthew 15:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐ τὸ εἰσερχόμενον εἰς τὸ στόμα κοινοῖ τὸν ἄνθρωπον, ἀλλὰ τὸ ἐκπορευόμενον ἐκ τοῦ στόματος τοῦτο κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/011.yaml
  text: It is not what enters into the mouth that defiles the man[b][a], but what comes out of the mouth—this defiles the man.
translation:
  language: ta
  text: வாய்க்குள் செல்வது மனிதனைத் தீட்டுப்படுத்துவதில்லை[a]; வாயிலிருந்து வெளியே வருவதுதான் மனிதனைத் தீட்டுப்படுத்துகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அசுத்தமாக்குவதில்லை.” கிரேக்க வினைச்சொல், தூய்மை–தீட்டு பொருளில் ஒருவரை அசுத்தமானவராக்குவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: κοινοῖ
  choice: தீட்டுப்படுத்துகிறது
  rationale: தூய்மை–தீட்டு சார்ந்த சூழலில், ஒருவரைத் தீட்டானவராக்குதல் என்ற சடங்கு மற்றும் ஒழுக்கப் பொருள் இரண்டின் எதிரொலியையும் தமிழில் இயல்பாகப் பேணுகிறது.
- source_word: τὸ εἰσερχόμενον εἰς τὸ στόμα
  choice: வாய்க்குள் செல்வது
  rationale: பெயர்ச்சொல் தன்மையுடன் வரும் பங்கேற்புவினையை நவீன தமிழில் இயல்பாக மொழிபெயர்த்து, εἰς குறிக்கும் உள்ள்நோக்கிய இயக்கத்தையும் வெளிப்படுத்துகிறது.
- source_word: τὸ ἐκπορευόμενον ἐκ τοῦ στόματος
  choice: வாயிலிருந்து வெளியே வருவது
  rationale: ἐκπορευόμενον மற்றும் ἐκ குறிக்கும் வெளியே வரும் இயக்கத்தைத் தெளிவாகவும் இயல்பாகவும் அளிக்கிறது.
- source_word: ἄνθρωπον
  choice: மனிதனை
  rationale: ἄνθρωπος இங்கு ஒரு மனிதரைப் பொதுவாகச் சுட்டுகிறது; தமிழ் ‘மனிதன்’ அந்த ஒருமை பிரதிநிதித்துவப் பயன்பாட்டைப் பேணுவதோடு சூழலில் எல்லா மனிதர்களையும் உள்ளடக்குகிறது.
- source_word: τοῦτο
  choice: வருவதுதான்
  rationale: ‘-தான்’ என்ற வலியுறுத்தல், இரண்டாம் கூறில் τοῦτο தரும் எதிர்மறை ஒப்பீட்டு மையத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὐ ... ἀλλὰ
  choice: … இல்லை; … தான்
  rationale: கிரேக்கத்தின் ‘அல்ல … மாறாக …’ என்ற தெளிவான முரண்பாட்டை வாசிக்க எளிய தமிழ் அமைப்பில் பேணுகிறது.
theological_decisions:
- issue: κοινόω என்பதிலுள்ள தூய்மை–தீட்டு மொழி
  choice: தீட்டுப்படுத்துகிறது
  alternative: அசுத்தமாக்குகிறது
  rationale: ‘தீட்டுப்படுத்துகிறது’ என்பது இச்சூழலின் தூய்மை சார்ந்த பின்னணியையும் ஒழுக்க மாசின் வலிமையையும் பேணுகிறது; இதை வெறும் உடல் அழுக்காகவோ சடங்கு நிலையாக மட்டுமோ குறுக்குவதில்லை.
- issue: ἄνθρωπον என்பதன் பொதுப் பிரதிநிதித்துவப் பயன்பாடு
  choice: மனிதனை
  alternative: ஒருவரை
  rationale: மூலத்தின் ஒருமை வடிவத்தைப் பேணுகிறது; தமிழில் ‘மனிதன்’ இங்கு ஆண் ஒருவரை மட்டும் அல்லாமல் மனிதரைப் பொதுவாகக் குறிக்க இயலும்.
translation_notes:
  register: நவீன தரத் தமிழ்; எளிமையானாலும் கண்ணியமான நடை. ‘வாய்க்குள்’ மற்றும் ‘வாயிலிருந்து வெளியே’ என்ற இணை அமைப்பு மூலத்தின் உருவகத்தையும் முரண்பாட்டையும் தெளிவாகப் பேணுகிறது. ‘வருவதுதான்’ என்பதில் τοῦτοவின் வலியுறுத்தல் இணைக்கப்பட்டுள்ளது.
