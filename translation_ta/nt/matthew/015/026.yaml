source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Οὐκ ἔστιν καλὸν λαβεῖν τὸν ἄρτον τῶν τέκνων καὶ βαλεῖν τοῖς κυναρίοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/026.yaml
  text: But he answered[a], “It is not right to take the children's bread and throw it to the little dogs.”
translation:
  language: ta
  text: அதற்கு அவர், “பிள்ளைகளின் அப்பத்தை எடுத்து சிறு நாய்களுக்கு[a] எறிவது சரியல்ல” என்று பதிலளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வீட்டு நாய்கள்’ அல்லது ‘நாய்க்குட்டிகள்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் சிறுமை வடிவத்தில் உள்ளது; அது தெருநாய்களைவிடச் சிறிய அல்லது வீட்டில் வளர்க்கப்படும் நாய்களைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: பதிலளித்தார்
  rationale: வினையெச்சத்தையும் முடிவுற்ற வினையையும் இணைக்கும் கிரேக்கச் சொற்றொடரை, அதன் பதிலுரைக்கும் தன்மையைத் தக்கவைத்து இயல்பான நவீனத் தமிழில் ஒரே வினையாக வழங்குகிறது.
- source_word: καλὸν
  choice: சரியல்ல
  rationale: இங்கு καλόν பொதுவான நன்மையை மட்டும் அல்லாமல் தகுதி அல்லது பொருத்தத்தையும் குறிக்கிறது; மறுப்புடன் வரும் ‘சரியல்ல’ இந்தச் சூழலில் இயல்பாக அதைப் புலப்படுத்துகிறது.
- source_word: λαβεῖν
  choice: எடுத்து
  rationale: எதையாவது கையில் எடுக்கும் அல்லது அங்கிருந்து எடுத்துக்கொள்ளும் அடிப்படைப் பொருளை நேரடியாகத் தருகிறது.
- source_word: ἄρτον
  choice: அப்பத்தை
  rationale: உருவகத்தின் உணவுப் படிமத்தை விளக்கவுரையின்றி நேரடியாகத் தக்கவைக்கிறது.
- source_word: τέκνων
  choice: பிள்ளைகளின்
  rationale: τέκνα பாலினம் சுட்டாத ‘பிள்ளைகள்’ என்பதைக் குறிக்கிறது; உரிமைத் தொடர்பும் தமிழில் இயல்பாகப் பாதுகாக்கப்படுகிறது.
- source_word: βαλεῖν
  choice: எறிவது
  rationale: ‘கொடுத்து விடுவது’ என்று மென்மையாக்காமல், βάλλω என்பதன் தெளிவான எறிதல் படிமத்தைத் தக்கவைக்கிறது.
- source_word: κυναρίοις
  choice: சிறு நாய்களுக்கு
  rationale: கிரேக்கச் சொல்லிலுள்ள சிறுமை நுணுக்கத்தைத் தக்கவைக்கிறது; அதேவேளையில் அவை கட்டாயம் நாய்க்குட்டிகளே அல்லது வீட்டு நாய்களே என்று முதன்மை உரையில் தீர்மானிக்கவில்லை.
theological_decisions:
- issue: பிள்ளைகள் மற்றும் நாய்கள் பற்றிய உருவகத்தின் குறிப்பு யாரைக் குறிக்கிறது என்பதையும் அதன் தொனியையும் மொழிபெயர்ப்பிலேயே விளக்க வேண்டுமா என்பது.
  choice: ‘பிள்ளைகளின் அப்பம்’ மற்றும் ‘சிறு நாய்கள்’ என்ற உருவகத்தை விளக்க விரிவாக்கமின்றி நேரடியாகத் தக்கவைத்தல்.
  alternative: உருவகத்தின் இன அல்லது சமயக் குறிப்புகளை முதன்மை உரையிலேயே வெளிப்படையாகச் சேர்த்தல்.
  rationale: இந்த வசனம் உருவகத்தின் குறிப்பிட்ட சார்புகளைத் தானாக விளக்கவில்லை. எனவே சுற்றியுள்ள நிகழ்வுரை உருவாக்கும் பதற்றத்தையும் உண்மையான விளக்கத் திறப்பையும் மொழிபெயர்ப்பு முன்கூட்டியே தீர்க்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அப்பம்’ உருவகப் படிமத்தைத் தக்கவைக்கிறது; ‘சிறு நாய்கள்’ மூலச்சொல்லின் நுணுக்கத்தை அதிகமாகத் தீர்மானிக்காமல் வழங்குகிறது.
