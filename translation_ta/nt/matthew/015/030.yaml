translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. உடல் குறைபாடுகளை இழிவுபடுத்தக்கூடிய மரபுச் சொற்களுக்குப் பதிலாக நபர்-மையமான விளக்கச் சொற்றொடர்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன. கிரேக்க மூலத்தின் சொற்பொருள் தெளிவின்மை அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
