  text: καὶ προσῆλθον αὐτῷ ὄχλοι πολλοὶ ἔχοντες μεθ’ ἑαυτῶν ⸂κωφούς, τυφλούς, χωλούς, κυλλούς⸃, καὶ ἑτέρους πολλούς, καὶ ἔρριψαν αὐτοὺς παρὰ τοὺς πόδας ⸀αὐτοῦ, καὶ ἐθεράπευσεν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/030.yaml
  text: And large crowds came to him[a], bringing with them the mute, the blind, the lame, the crippled, and many others, and they laid them at his feet[b], and he healed them.
translation:
  language: ta
  text: பெரிய மக்கள் கூட்டங்கள் அவரிடம் வந்தார்கள். அவர்கள் பேச முடியாதவர்கள்[a], பார்வையற்றவர்கள், நடக்க முடியாதவர்கள், கை அல்லது காலில் குறைபாடுள்ளவர்கள்[b], மற்றும் வேறு பலரைத் தங்களுடன் அழைத்துக்கொண்டு வந்து, அவருடைய காலடியில் வைத்தார்கள். அவர் அவர்களைக் குணமாக்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கேட்க முடியாதவர்கள்.” κωφός என்ற கிரேக்கச் சொல் சூழலைப் பொறுத்து கேட்க முடியாதவர்களையோ, பேச முடியாதவர்களையோ, இரண்டும் இயலாதவர்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கை கால் சிதைவுற்றவர்கள்.” κυλλός என்ற கிரேக்கச் சொல் கை அல்லது காலில் குறைபாடு, உருக்குலைவு, அல்லது செயலிழப்பு உள்ளவர்களைப் பரந்த வகையில் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον αὐτῷ
  choice: அவரிடம் வந்தார்கள்
  rationale: இது இயேசுவை அணுகி வந்ததைக் குறிக்கும் இயல்பான நவீனத் தமிழ் நடை.
- source_word: ὄχλοι πολλοί
  choice: பெருந்திரளான மக்கள்
  rationale: பல பெரிய மக்கள் கூட்டங்கள் வந்தன என்ற பொருளைத் தமிழில் இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: ἔχοντες μεθ’ ἑαυτῶν
  choice: தங்களுடன் கொண்டுவந்து
  rationale: சொல்லுக்குச் சொல் ‘தங்களுடன் வைத்துக்கொண்டு’ என்பதைக் காட்டிலும், சூழலில் நோயுற்றவர்களை அழைத்து அல்லது சுமந்து வந்த செயலைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: κωφούς
  choice: பேச முடியாதவர்கள்
  rationale: κωφός என்பது சூழலைப் பொறுத்து கேட்க முடியாதவர்களையோ பேச முடியாதவர்களையோ இரண்டும் இயலாதவர்களையோ குறிக்கலாம். முதன்மை உரையில் பேச்சுத் திறனின்மையைத் தேர்ந்தெடுத்து, உண்மையான சொற்பொருள் தெளிவின்மையை அடிக்குறிப்பில் காக்கிறது.
- source_word: τυφλούς
  choice: பார்வையற்றவர்கள்
  rationale: τυφλός என்பதற்கான தெளிவான, மரியாதையான நவீனத் தமிழ் சொல்.
- source_word: χωλούς
  choice: நடக்க முடியாதவர்கள்
  rationale: நடப்பதில் கடுமையான குறைபாடுள்ளவர்களைக் குறிக்கும் χωλός என்பதன் பொருளை சாதாரண வாசகர்களுக்குத் தெளிவாகக் கூறுகிறது.
- source_word: κυλλούς
  choice: கை அல்லது கால் ஊனமுற்றவர்கள்
  rationale: κυλλός என்பது கை அல்லது காலில் குறைபாடு, உருக்குலைவு, அல்லது செயலிழப்பு உள்ளவர்களைப் பரந்த வகையில் குறிக்கிறது. இத்தேர்வு இழிவாக ஒலிக்கக்கூடிய பெயர்ச்சொல் அடையாளத்தைத் தவிர்த்து பொருளைத் தெளிவுபடுத்துகிறது.
- source_word: ἑτέρους πολλούς
  choice: இன்னும் பலரையும்
  rationale: பட்டியலிடப்பட்டவர்களுக்கு அப்பால் வேறு பலரும் இருந்தனர் என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: ἔρριψαν αὐτούς
  choice: அவர்களைக் கிடத்தினார்கள்
  rationale: ῥίπτω அடிப்படையில் ‘எறிதல்/போடுதல்’ எனப் பொருள்படலாம்; இச்சூழலில் உதவி தேவைப்பட்டவர்களை இயேசுவின் காலடியில் கொண்டுவந்து வைத்ததைக் குறிக்க ‘கிடத்தினார்கள்’ இயல்பாகவும் தவறான கடுமையைத் தவிர்ப்பதாகவும் உள்ளது.
- source_word: παρὰ τοὺς πόδας αὐτοῦ
  choice: அவருடைய காலடியில்
  rationale: இயேசுவுக்கு மிக அருகில் அவர்களை வைத்த காட்சியைப் பாதுகாக்கும் இயல்பான தமிழ் மரபுத்தொடர்.
- source_word: ἐθεράπευσεν αὐτούς
  choice: அவர் அவர்களைக் குணமாக்கினார்
  rationale: நற்செய்தி நூல்களின் குணப்படுத்தும் நிகழ்வுகளில் θεραπεύω என்பதற்கான நேரடியான, இயல்பான மொழிபெயர்ப்பு.
