- from: பெருந்திரளான மக்கள் அவரிடம் வந்தார்கள். பேச முடியாதவர்கள்[a], பார்வையற்றவர்கள், நடக்க முடியாதவர்கள், கை அல்லது கால் ஊனமுற்றவர்கள்[b] என இன்னும் பலரையும் தங்களுடன் கொண்டுவந்து, அவருடைய காலடியில் கிடத்தினார்கள். அவர் அவர்களைக் குணமாக்கினார்.
  to: பெரிய மக்கள் கூட்டங்கள் அவரிடம் வந்தார்கள். அவர்கள் பேச முடியாதவர்கள்[a], பார்வையற்றவர்கள், நடக்க முடியாதவர்கள், கை அல்லது காலில் குறைபாடுள்ளவர்கள்[b], மற்றும் வேறு பலரைத் தங்களுடன் அழைத்துக்கொண்டு வந்து, அவருடைய காலடியில் வைத்தார்கள். அவர் அவர்களைக் குணமாக்கினார்.
  rationale: The revision resolves the awkward list syntax, explicitly represents “many others” as an additional group, and uses a less specific contextual equivalent for placing the people at Jesus’s feet. It retains the chosen contextual rendering of κωφούς and preserves its lexical ambiguity in footnote a. For κυλλούς, person-centered main-text language is retained and an explicit alternative is supplied in footnote b.
