  yaml_path: translation/nt/matthew/015/018.yaml
  text: But the things that come out of the mouth come from the heart[a], and those defile the man.
translation:
  language: ta
  text: ஆனால் வாயிலிருந்து வெளிவருபவை இதயத்திலிருந்து வெளிவருகின்றன; அவையே மனிதனைத் தீட்டாக்குகின்றன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனிதனை அசுத்தமாக்குகின்றன.” இங்கு “மனிதன்” என்பது ஆண் ஒருவரை மட்டும் அல்ல, பொதுவாக ஒரு மனிதரைக் குறிக்கும் பிரதிநிதித்துவ ஒருமை.
    reason: κοινοῖ என்பதற்கான சொற்பொருள் மாற்றையும் ἄνθρωπον என்பதன் பொதுவான பிரதிநிதித்துவப் பொருளையும் தெளிவுபடுத்துகிறது.
lexical_decisions:
- source_word: τὰ ... ἐκπορευόμενα
  choice: வெளிவருபவை
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நடுநிலைப் பன்மைப் பெயரெச்சத்தை இயல்பான தமிழில் பொதுவாகக் குறிக்கிறது; வாயிலிருந்து வெளிப்படும் சொற்களையும் பிற வெளிப்பாடுகளையும் உரை குறிப்பிடும் அளவில் திறந்தே வைக்கிறது.
- source_word: στόματος
  choice: வாய்
  rationale: பேச்சின் சூழலுக்கும் இயேசு பயன்படுத்தும் உடல் உறுப்புச் சித்திரத்துக்கும் நேரான, இயல்பான இணைச்சொல்.
- source_word: καρδίας
  choice: இதயம்
  rationale: மூலத்தின் உடல் உறுப்புச் சித்திரத்தைப் பாதுகாப்பதோடு, சிந்தனை, நோக்கம், ஒழுக்க உள்ளார்ந்த நிலை ஆகியவற்றை உள்ளடக்கும் வேதாகமப் பொருளையும் தாங்குகிறது.
- source_word: ἐξέρχεται
  choice: வருகின்றன
  rationale: கிரேக்கத்தில் நடுநிலைப் பன்மை எழுவாயுடன் ஒருமை வினை வந்தாலும் பொருள் கூட்டாக உள்ளது; தமிழில் பன்மை இயைபுடன் கூறுவது இயல்பானது. ‘இதயத்திலிருந்து வருகின்றன’ என்பது மூலத்தைக் குறிக்கிறது.
- source_word: κἀκεῖνα
  choice: அவையே
  rationale: ‘அவைகளே/அந்தக் காரியங்களே’ என்ற பின்னோக்குச் சுட்டையும் வலியுறுத்தலையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: κοινοῖ
  choice: தீட்டுப்படுத்துகின்றன
  rationale: சுத்தம்–தீட்டு பற்றிய உடனடிச் சூழலில், ஒருவரைத் தீட்டானவராக்கும் பொருளைத் தெளிவாகவும் சூழலுக்கேற்ற வகையிலும் தெரிவிக்கிறது.
- source_word: ἄνθρωπον
  choice: மனிதனை
  rationale: கிரேக்கத்தின் பிரதிநிதித்துவ ஒருமையைப் பாதுகாக்கிறது; இங்கு இது ஆண் ஒருவரை மட்டும் அல்ல, பொதுவாக மனிதரைக் குறிக்கிறது.
theological_decisions:
- issue: ஒழுக்கத் தீட்டின் உள்ளார்ந்த மூலம்
  choice: தீட்டு இதயத்திலிருந்து எழுந்து வாயின் வழியாக வெளிப்படுவதாக மொழிபெயர்க்கப்பட்டது.
  alternative: இதைப் பேச்சினால் ஏற்படும் சடங்குசார் அசுத்தத்துக்கு மட்டும் வரையறுப்பது.
  rationale: உடனடிச் சூழல் வெளிப்புறமாக உட்கொள்ளப்படும் உணவையும் உள்ளிருந்து வெளிவருவதையும் வேறுபடுத்துகிறது. ‘இதயம்’ மற்றும் ‘தீட்டுப்படுத்துகின்றன’ என்பவை இந்த இறையியல் அழுத்தத்தை விரிவாக்காமலும் குறுக்காமலும் பாதுகாக்கின்றன.
- issue: ἄνθρωπον என்பதன் பிரதிநிதித்துவ ஒருமை
  choice: முதன்மை உரையில் ‘மனிதனை’ என்று ஒருமையில் வைக்கப்பட்டது.
  alternative: ‘ஒருவரை’ அல்லது பன்மையில் ‘மனிதர்களை’ என்று மொழிபெயர்ப்பது.
  rationale: ஒருமை வடிவத்தைப் பாதுகாத்தபடியே, தமிழில் ‘மனிதன்’ பொதுவாக மனிதரைச் சுட்ட முடியும்; அதன் பொதுப்பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
