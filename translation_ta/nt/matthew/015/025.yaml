  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἡ δὲ ἐλθοῦσα ⸀προσεκύνει αὐτῷ λέγουσα· Κύριε, βοήθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/025.yaml
  text: But she came and knelt before him[a], saying, “Lord, help me.”
translation:
  language: ta
  text: ஆனால் அவள் வந்து, அவருக்கு முன்பாக மண்டியிட்டு[a], “ஆண்டவரே, எனக்கு உதவி செய்யுங்கள்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரை வழிபட்டாள்.” கிரேக்க வினைச்சொல் சூழலுக்கேற்ப மரியாதையுடன் பணிதல், வணக்கம் செலுத்துதல் அல்லது வழிபடுதல் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய உரையாடலைத் தொடர்ந்து, அந்தப் பெண் விடாமுயற்சியுடன் அணுகியதைச் சுட்டும் மென்மையான முரண்பாட்டை வெளிப்படுத்துகிறது.
- source_word: ἐλθοῦσα
  choice: அவள் வந்து
  rationale: இறந்தகால வினையெச்சத்தை இயல்பான தமிழில் வழங்கி, அவள் இயேசுவை அணுகிய நகர்வைப் பாதுகாக்கிறது.
- source_word: προσεκύνει αὐτῷ
  choice: அவர்முன் முழங்கால்படியிட்டு
  rationale: வினைச்சொல் உடலைத் தாழ்த்தி மரியாதை செலுத்துதல் முதல் வழிபடுதல் வரை பொருள்படலாம். முதன்மை உரை உடல்சார்ந்த மரியாதைச் செயலைக் காட்டுகிறது; வழிபாடு என்ற சாத்தியத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: λέγουσα
  choice: என்றாள்
  rationale: நேரடிக் கூற்றை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: இயேசுவை நோக்கிய மரியாதையும் கனமும் நிறைந்த அழைப்பாக κύριε என்பதை வழங்குகிறது.
- source_word: βοήθει μοι
  choice: எனக்கு உதவிசெய்யும்
  rationale: அவளுடைய சுருக்கமான, அவசரமான வேண்டுதலை dignified modern Tamil-இல் நேரடியாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இயேசுவை நோக்கிப் பயன்படுத்தப்பட்ட προσκυνέω என்பதன் பொருள்
  choice: அவர்முன் முழங்கால்படியிட்டு
  alternative: அவரை வழிபட்டு; அவர்முன் பணிந்து
  rationale: இச்சொல் சூழலுக்கேற்ப மரியாதையுடன் பணிதல், வணக்கம் செலுத்துதல் அல்லது வழிபடுதல் ஆகியவற்றைக் குறிக்கலாம். பெண்ணின் செயலை முதன்மை உரை தெளிவாகக் காட்டுகிறது; அவளுடைய தெய்வவியல் புரிதலை அளவுக்கு மீறி முடிவுசெய்யாமல், ‘வழிபட்டாள்’ என்ற உண்மையான மாற்றுப் பொருளை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘ஆண்டவரே’ என்பது κύριε என்பதன் கனத்தைப் பாதுகாக்கிறது. வேண்டுதலின் சுருக்கத்தையும் அவசரத்தையும் தக்கவைக்க ‘எனக்கு உதவிசெய்யும்’ பயன்படுத்தப்பட்டுள்ளது.
