id: MAT.15.34
reference: Matthew 15:34
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς ὁ Ἰησοῦς· Πόσους ἄρτους ἔχετε; οἱ δὲ εἶπαν· Ἑπτά, καὶ ὀλίγα ἰχθύδια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/034.yaml
  text: And Jesus said to them[a], “How many loaves do you have?” And they said, “Seven, and a few small fish.”
translation:
  language: ta
  text: இயேசு அவர்களிடம், “உங்களிடம் எத்தனை அப்பங்கள் இருக்கின்றன?” என்று கேட்டார். அதற்கு அவர்கள், “ஏழு அப்பங்களும், ஒருசில சிறிய மீன்களும்” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: கேட்டார்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலமான ‘சொல்கிறார்’ உள்ளது; ஆனால் இது கேள்வியை அறிமுகப்படுத்துவதால், நவீனத் தமிழ் கதைநடையில் ‘கேட்டார்’ என்பது இயல்பாகவும் உரையாடலின் செயல்பாட்டைத் துல்லியமாகவும் தருகிறது.
- source_word: Πόσους ἄρτους
  choice: எத்தனை அப்பங்கள்
  rationale: ἄρτους எண்ணக்கூடிய ரொட்டித் துண்டுகள் அல்லது முழு அப்பங்களைக் குறிக்கிறது; வேதாகமத் தமிழ் வழக்கிலும் பொதுப் புரிதலிலும் ‘அப்பங்கள்’ பொருத்தமானது.
- source_word: ἔχετε
  choice: உங்களிடம் ... இருக்கின்றன
  rationale: உடைமை குறித்த நிகழ்காலக் கேள்வியை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: οἱ δὲ εἶπαν
  choice: அதற்கு அவர்கள் ... என்றார்கள்
  rationale: δέ இங்கு வலுவான எதிர்மறையை அல்ல, உரையாடலின் அடுத்த பதிலைச் சுட்டுகிறது; ‘அதற்கு’ தமிழ் கதைநடையில் அந்தத் தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: Ἑπτά
  choice: ஏழு அப்பங்கள்
  rationale: கிரேக்கத்தில் பெயர்ச்சொல் விடுபட்டிருந்தாலும், தமிழில் பதில் தெளிவாகவும் இயல்பாகவும் இருக்க ‘அப்பங்கள்’ மீண்டும் சேர்க்கப்படுகிறது.
- source_word: ὀλίγα
  choice: சில
  rationale: குறைந்த எண்ணிக்கையைக் குறிக்கும் இயல்பான தமிழ் இணைச்சொல்.
- source_word: ἰχθύδια
  choice: சிறிய மீன்கள்
  rationale: ἰχθύδια என்பது குறுமைப் பொருள் தரும் வடிவம்; ஆகவே மீன்கள் சிறியவை என்ற நுணுக்கம் நேரடியாகப் பாதுகாக்கப்படுகிறது.
