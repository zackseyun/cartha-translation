  source_fidelity: 'மூலக் கிரேக்கத்தின் கூறுகள் அனைத்தும் துல்லியமாகக் காக்கப்பட்டுள்ளன: ἀποκριθεὶς εἶπεν என்பதன் இரட்டை கதைநடை வினைச்சொல், Πᾶσα-வின் பகிர்வுப் பொருள், φυτεία-வின் வேளாண் உருவகம், எதிர்காலச் செயப்பாட்டு ἐκριζωθήσεται, மற்றும் ‘என் பரலோகத் தந்தை’ என்ற உறவுநிலை ஆகியவை முறையாக வெளிப்படுகின்றன. உருவகத்தின் குறிப்பு விளக்கப்பட்டு வரையறுக்கப்படவில்லை.'
  naturalness: ‘அவர் பதிலளித்துச் சொன்னார்’ மற்றும் ‘வேரோடு பிடுங்கப்படும்’ ஆகியவை நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமான வேதாகமக் கதைநடைக்கு ஏற்றதாகவும் உள்ளன. ‘என் பரலோகத் தந்தை’ தெளிவான, பொதுவாகப் புரிந்துகொள்ளக்கூடிய சொற்றொடர்.
  terminology: ‘செடி’, ‘நடாத’, ‘வேரோடு பிடுங்கப்படும்’ ஆகியவை மூலத்தின் ஒரே வேளாண் உருவகத்தைத் தொடர்ச்சியாகப் பாதுகாக்கின்றன. φυτεία என்பதற்கு ‘நடவு/நடுதல்’ என்ற மாற்றுவாய்ப்பை அடிக்குறிப்பு பொருத்தமாகக் குறிக்கிறது; அது பிரதான உரையின் உருவகத்தை மாற்றவில்லை.
