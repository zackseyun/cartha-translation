id: MAT.15.13
reference: Matthew 15:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Πᾶσα φυτεία ἣν οὐκ ἐφύτευσεν ὁ πατήρ μου ὁ οὐράνιος ἐκριζωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/013.yaml
  text: But he answered and said[a], “Every plant that my heavenly Father did not plant will be uprooted.”
translation:
  language: ta
  text: 'அவர் பதிலளித்துச் சொன்னார்: “என் பரலோகத் தந்தை நடாத ஒவ்வொரு செடியும்[a] வேரோடு பிடுங்கப்படும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒவ்வொரு நடவும்.”
    reason: φυτεία என்பது ஒரு செடியை மட்டுமல்ல, ‘நடுதல்’ அல்லது ‘நடவு’ என்பதையும் குறிக்கலாம்.
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: பதிலளித்துச் சொன்னார்
  rationale: கிரேக்கத்தில் உள்ள இரண்டு வினைச்சொற்களையும் இயல்பான நவீனத் தமிழில் தக்கவைத்து, இது ஒரு பொதுவான கதைநடைச் சொற்றொடர் என்பதை வெளிப்படுத்துகிறது.
- source_word: Πᾶσα
  choice: ஒவ்வொரு
  rationale: ஒருமை பெயர்ச்சொல்லோடு வரும் பகிர்வுப் பொருளைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: φυτεία
  choice: செடி
  rationale: இந்தச் சொல் ‘நடப்பட்டது’ அல்லது ‘நடுதல்’ என இருவகையில் புரிந்துகொள்ளப்படலாம். பின்னர் வரும் ‘வேரோடு பிடுங்கப்படும்’ என்ற உருவகத்துடன் ‘செடி’ இயல்பாகப் பொருந்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐφύτευσεν
  choice: நடாத
  rationale: மூலத்திலுள்ள வேளாண்மை உருவகத்தை நேரடியாகத் தக்கவைக்கிறது.
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: என் பரலோகத் தந்தை
  rationale: ‘என்’ என்ற உறவையும் οὐράνιος என்ற பரலோகத் தன்மையையும் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐκριζωθήσεται
  choice: வேரோடு பிடுங்கப்படும்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தையும், வேரிலிருந்து அகற்றப்படும் தீவிரமான வேளாண்மை/நியாயத்தீர்ப்பு உருவகத்தையும் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘ஒவ்வொரு செடியும்’ என்ற உருவகத்தின் குறிப்பு
  choice: உருவகத்தை விளக்கித் தீர்மானிக்காமல் ‘ஒவ்வொரு செடியும்’ என்று தக்கவைத்தல்
  alternative: ஒவ்வொரு போதனையும் / ஒவ்வொரு பாரம்பரியமும் / தந்தையால் நடப்படாத ஒவ்வொருவரும்
  rationale: கிரேக்க உரை இந்த உருவகம் போதனைகளையா, பாரம்பரியங்களையா, மனிதர்களையா குறிக்கிறது என்பதை வெளிப்படையாகத் தீர்மானிக்கவில்லை. ஆகவே மொழிபெயர்ப்பு அந்தத் தெளிவின்மையையும் இறையியல் இழுப்பையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பான, கண்ணியமான நடை. ‘வேரோடு பிடுங்கப்படும்’ என்பது மூல உருவகத்தைத் தெளிவாகக் காக்கிறது.
