id: MAT.15.9
reference: Matthew 15:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μάτην δὲ σέβονταί με, διδάσκοντες διδασκαλίας ἐντάλματα ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/009.yaml
  text: But they worship me in vain[b][a], teaching as doctrines the commandments of men.
translation:
  language: ta
  text: ஆனால் அவர்கள் மனிதர்களின் கட்டளைகளைப் போதனைகளாகக் கற்பித்து, என்னை வீணாக வழிபடுகிறார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “மனிதக் கட்டளைகளைப் போதனைகளாகக் கற்பித்து.”'
    reason: கிரேக்கத் தொடர் சுருக்கமாக உள்ளது. ‘மனிதர்களின் கட்டளைகள்’ என்பதற்குப் பதிலாக ‘மனிதக் கட்டளைகள்’ என்ற இயல்பான பெயரடைத் தொடரைப் பயன்படுத்தி, அவை போதனைகளாகக் கற்பிக்கப்படுகின்றன என்ற தொடர்பைத் தெளிவாகக் காக்கிறது.
lexical_decisions:
- source_word: μάτην
  choice: வீணாக
  rationale: எந்தப் பயனும் விளைவும் இல்லாத வழிபாட்டைக் குறிக்கும் கிரேக்க வினையடையின் இயல்பான, தீர்ப்புத் தொனியைப் பாதுகாக்கும் தமிழ்ச் சொல்.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய கருத்துடன் தொடர்ச்சியையும் மெல்லிய முரண்பாட்டையும் குறிக்கும் δέ-யின் கண்டனத் தொனியைச் சூழலுக்கு ஏற்றபடி வெளிப்படுத்துகிறது.
- source_word: σέβονταί με
  choice: என்னை வழிபடுகிறார்கள்
  rationale: தேவனை நோக்கிய வணக்கத்தையும் பக்தியையும் குறிக்கும் σέβομαι என்பதற்கு நவீனத் தமிழில் தெளிவான சமயச் சொற்றொடர்.
- source_word: διδάσκοντες
  choice: கற்பித்து
  rationale: அவர்களுடைய வழிபாடு எவ்வாறு வீணாகிறது என்பதை விளக்கும் நிகழ்காலப் பங்கேற்புவினையின் முறையியல் தொடர்பை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: διδασκαλίας
  choice: போதனைகளாக
  rationale: மனிதக் கட்டளைகளுக்குப் போதனை அல்லது கோட்பாட்டு அதிகாரம் வழங்கப்படுவதைத் தெளிவாக்குகிறது; ‘கோட்பாடுகள்’ என்பதைவிட பொதுவாசகருக்கு இயல்பானது.
- source_word: ἐντάλματα ἀνθρώπων
  choice: மனிதர்களின் கட்டளைகளை
  rationale: கட்டளைகளின் மனிதத் தோற்றத்தையும் தெய்வீக அதிகாரத்துடனான மறைமுக எதிர்மறையையும் பாதுகாக்கிறது. ἀνθρώπων இங்கு ஆண்களை மட்டும் அல்ல, மனிதர்களைப் பொதுவாகக் குறிக்கிறது.
theological_decisions:
- issue: διδασκαλίας ἐντάλματα ἀνθρώπων என்ற சுருக்கமான தொடரின் தொடர்பு
  choice: மனிதர்களின் கட்டளைகளைப் போதனைகளாகக் கற்பித்து
  alternative: மனிதர்களின் கட்டளைகளாகிய போதனைகளைக் கற்பித்து
  rationale: மனிதக் கட்டளைகள் அதிகாரப்பூர்வப் போதனைகளாகக் கற்பிக்கப்படுகின்றன என்ற பொருளை முதன்மை உரை இயல்பான தமிழில் வெளிப்படுத்துகிறது; கிரேக்கத்தின் சுருக்கமான இணைப்பை வேறுவிதமாகப் புரிந்துகொள்ளும் வாய்ப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: ἀνθρώπων என்பதன் பொதுமனிதப் பொருள்
  choice: மனிதர்களின்
  alternative: மனிதருடைய
  rationale: இது பாலினத்தால் ஆண்களை மட்டும் குறிக்காமல், தெய்வீகமானதற்கு மாறாக மனிதத் தோற்றத்தைக் குறிக்கிறது; ‘மனிதர்களின்’ என்பது நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிதில் புரியக்கூடிய, ஆனால் வேதாகம மேற்கோளுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வழிபடுகிறார்கள்’, ‘கட்டளைகள்’, ‘போதனைகள்’ ஆகிய சொற்கள் சமயச் சூழலின் தீவிரத்தைக் காக்கின்றன; தேவையற்ற பழந்தமிழ் அல்லது சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
