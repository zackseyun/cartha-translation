  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அப்பங்கள்’ என்பது வேதாகமச் சூழலில் பழக்கமானதும் மூலத்தின் பன்மையைப் பாதுகாப்பதும் ஆகும். எல்லா அடிக்குறிப்பு சுட்டிகளும் தொடர்புடைய சொற்றொடர்களுக்குப் பின் பிரதான உரையில் சேர்க்கப்பட்டுள்ளன.
