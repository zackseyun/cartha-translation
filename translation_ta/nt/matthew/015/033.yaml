source:
  edition: SBLGNT
  text: καὶ λέγουσιν αὐτῷ οἱ ⸀μαθηταί· Πόθεν ἡμῖν ἐν ἐρημίᾳ ἄρτοι τοσοῦτοι ὥστε χορτάσαι ὄχλον τοσοῦτον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/033.yaml
  text: And the disciples said to him[c][b][a], “Where could we get enough bread in this desolate place to satisfy so large a crowd?”
translation:
  language: ta
  text: சீடர்கள் அவரிடம், “இந்த வெறிச்சோடிய இடத்தில்[a] நமக்கு, இவ்வளவு பெரிய மக்கள் கூட்டம் வயிறார உண்ணும் அளவுக்கு[b] இத்தனை அப்பங்கள் எங்கிருந்து கிடைக்கும்?” என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வெறிச்சோடிய இடத்தில்” என்பதை “வனாந்தரத்தில்” அல்லது “மக்கள் நடமாட்டமில்லாத இடத்தில்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “வயிறார உண்ணும் அளவுக்கு” என்பதை “திருப்தியாக உணவளிக்கும் அளவுக்கு” என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் நிறைவாக உண்ணச் செய்வதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν
  choice: என்று கேட்டார்கள்
  rationale: இது வடிவில் நிகழ்காலமாக இருந்தாலும், கிரேக்கக் கதைநடையில் வரும் வரலாற்று நிகழ்காலம். தமிழில் இயல்பான இறந்தகாலக் கதைநடையாக மொழிபெயர்க்கப்பட்டது; வாக்கியம் கேள்வியாக இருப்பதால் ‘சொன்னார்கள்’ என்பதற்குப் பதில் ‘கேட்டார்கள்’ இயல்பாக உள்ளது.
- source_word: οἱ μαθηταί
  choice: சீடர்கள்
  rationale: குறிப்பிட்ட, ஏற்கெனவே அறிமுகமான சீடர் குழுவைக் குறிக்கிறது. மூலத்தில் இல்லாத ‘அவருடைய’ என்பதைச் சேர்க்கவில்லை.
- source_word: Πόθεν ἡμῖν
  choice: நமக்கு ... எங்கிருந்து கிடைக்கும்
  rationale: மூலத்தின் ‘எங்கிருந்து நமக்கு’ என்ற பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; சாத்தியமின்மையை உணர்த்தும் கேள்வித் தொனியும் நிலைக்கிறது.
- source_word: ἐν ἐρημίᾳ
  choice: இந்தப் பாழான இடத்தில்
  rationale: மக்கள் குடியிராத அல்லது வெறிச்சோடிய பகுதியைக் குறிக்கும் சொல்லைச் சூழலுக்கேற்ற இயல்பான தமிழில் வழங்குகிறது. ‘இந்த’ என்பது உடனுள்ள இடச்சூழலிலிருந்து இயல்பாகப் பெறப்படுகிறது.
- source_word: ἄρτοι τοσοῦτοι
  choice: இத்தனை அப்பங்கள்
  rationale: ἄρτοι என்பதன் பன்மையையும் τοσοῦτοι என்பதன் அளவு வலியுறுத்தலையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ὥστε χορτάσαι
  choice: வயிறாரச் சாப்பிட வைக்கும் அளவுக்கு
  rationale: χορτάσαι என்பது வெறுமனே உணவளிப்பதல்ல, நிறைவாக உண்ணச் செய்வதைக் குறிக்கிறது; ὥστε கட்டமைப்பின் விளைவு/அளவு உணர்வும் தமிழில் வெளிப்படுகிறது.
- source_word: ὄχλον τοσοῦτον
  choice: இவ்வளவு பெரிய மக்கள் கூட்டத்தை
  rationale: ὄχλος என்பதைக் ‘மக்கள் கூட்டம்’ என்றும் τοσοῦτον தரும் பெருமளவு வலியுறுத்தலை ‘இவ்வளவு பெரிய’ என்றும் இயல்பாக வழங்குகிறது.
