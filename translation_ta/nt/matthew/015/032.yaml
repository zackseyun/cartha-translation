id: MAT.15.32
reference: Matthew 15:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς προσκαλεσάμενος τοὺς μαθητὰς αὐτοῦ εἶπεν· Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον, ὅτι ἤδη ἡμέραι τρεῖς προσμένουσίν μοι καὶ οὐκ ἔχουσιν τί φάγωσιν· καὶ ἀπολῦσαι αὐτοὺς νήστεις οὐ θέλω, μήποτε ἐκλυθῶσιν ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/032.yaml
  text: Then Jesus called his disciples to him and said[a], “I have compassion on the crowd, because they have already remained with me for three days and have nothing to eat. And I do not want to send them away hungry[d][c][b], lest they collapse on the way.”
translation:
  language: ta
  text: பின்பு இயேசு தம் சீடர்களைத் தம்மிடம் அழைத்து, “இந்த மக்கள் கூட்டத்தின்மேல் நான் பரிவுகொள்கிறேன்; இவர்கள் ஏற்கெனவே மூன்று நாட்களாக என்னோடு தங்கியிருக்கிறார்கள், இவர்களுக்கு உண்பதற்கு ஒன்றுமில்லை. வழியில் அவர்கள் தளர்ந்துவிடக்கூடும் என்பதற்காக, இவர்களைப் பசியோடு அனுப்பிவிட எனக்கு விருப்பமில்லை” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: தம்மிடம் அழைத்து
  rationale: மத்திய வினை வடிவத்தின் ‘தன்னிடம் அழைத்தல்’ என்ற திசைநுட்பத்தை இயல்பான தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: Σπλαγχνίζομαι
  choice: பரிவுகொள்கிறேன்
  rationale: ஆழ்ந்த இரக்கத்தையும் உள்ளார்ந்த கருணையையும் குறிக்கும் வினைக்கு நவீன, கண்ணியமான தமிழ் இணை.
- source_word: ὄχλον
  choice: மக்கள் கூட்டம்
  rationale: கதைச் சூழலில் ὄχλος என்பதற்கான இயல்பான பொதுத்தமிழ் வடிவம்.
- source_word: ἤδη ἡμέραι τρεῖς προσμένουσίν μοι
  choice: ஏற்கெனவே மூன்று நாட்களாக என்னோடு தங்கியிருக்கிறார்கள்
  rationale: இயேசுவோடு தொடர்ந்து இருந்ததையும் மூன்று நாள் காலநீளத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τί φάγωσιν
  choice: உண்பதற்கு ஒன்றுமில்லை
  rationale: உணவு இல்லாத நிலையை கிரேக்க மரபுத்தொடரின் பொருளுக்கேற்ப தெளிவாகக் கூறுகிறது.
- source_word: ἀπολῦσαι
  choice: அனுப்பிவிட
  rationale: கூடியிருந்த மக்களைப் பிரித்து அனுப்புவதைக் குறிக்கும் சூழலுக்குப் பொருத்தமான இயல்பான சொல்.
- source_word: νήστεις
  choice: பசியோடு
  rationale: இங்கு சமய நோன்பைக் காட்டாமல் உணவின்றி இருக்கும் நிலையைக் குறிக்கிறது; ‘பசியோடு’ சூழற்பொருளை தெளிவாகத் தருகிறது.
- source_word: μήποτε
  choice: வழியில் அவர்கள் சோர்ந்துவிடக்கூடும்
  rationale: அஞ்சப்படும் விளைவைத் தமிழில் இயல்பாகக் கூற ‘கூடும்’ வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐκλυθῶσιν
  choice: சோர்ந்துவிட
  rationale: பயணத்தில் வலுவிழந்து தளர்ந்துபோவதைச் சுட்டுகிறது; ‘மயங்கிவிழுதல்’ என்ற அளவுக்கு பொருளை மிகையாகக் குறுக்கவில்லை.
- source_word: ἐν τῇ ὁδῷ
  choice: வழியில்
  rationale: வீடு திரும்பும் பயணத்தைக் குறிக்கும் சுருக்கமான, இயல்பான தமிழ் வடிவம்.
