translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘பரிவுகொள்கிறேன்’ ஆழ்ந்த இரக்கத்தை வெளிப்படுத்துகிறது; ‘பசியோடு’ என்பது சமய நோன்பு என்ற தவறான புரிதலைத் தவிர்க்கிறது. கிரேக்க μήποτε-யின் அஞ்சப்படும் சாத்திய விளைவு ‘சோர்ந்துவிடக்கூடும்’ என்று இயல்பாகப் பாதுகாக்கப்பட்டுள்ளது.
