  to: பின்பு இயேசு தம் சீடர்களைத் தம்மிடம் அழைத்து, “இந்த மக்கள் கூட்டத்தின்மேல் நான் பரிவுகொள்கிறேன்; இவர்கள் ஏற்கெனவே மூன்று நாட்களாக என்னோடு தங்கியிருக்கிறார்கள், இவர்களுக்கு உண்பதற்கு ஒன்றுமில்லை. வழியில் அவர்கள் தளர்ந்துவிடக்கூடும் என்பதற்காக, இவர்களைப் பசியோடு அனுப்பிவிட எனக்கு விருப்பமில்லை” என்றார்.
