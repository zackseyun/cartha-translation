id: MAT.15.19
reference: Matthew 15:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐκ γὰρ τῆς καρδίας ἐξέρχονται διαλογισμοὶ πονηροί, φόνοι, μοιχεῖαι, πορνεῖαι, κλοπαί, ψευδομαρτυρίαι, βλασφημίαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/019.yaml
  text: For out of the heart come evil thoughts[a], murders, adulteries, sexual immoralities, thefts, false testimonies, and blasphemies.
translation:
  language: ta
  text: ஏனெனில், இதயத்திலிருந்து தீய சிந்தனைகள், கொலைகள், விபசாரங்கள், பாலியல் ஒழுக்கக்கேடுகள், திருட்டுகள், பொய்ச் சாட்சியங்கள், பழித்துரைகள்[a] ஆகியவை வெளியே வருகின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேவதூஷணங்கள்.” கிரேக்கச் சொல், சூழலைப் பொறுத்து மனிதர்களுக்கு எதிரான பழித்துரைகளையோ தேவனுக்கு எதிரான தூஷணப் பேச்சையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ γὰρ
  choice: ஏனெனில், ... இதயத்திலிருந்து
  rationale: γάρ என்பதன் விளக்கத் தொடர்பை ‘ஏனெனில்’ என்பதும், ἐκ என்பதன் தோற்றுவாயைக் ‘-இலிருந்து’ என்பதும் இயல்பான தமிழில் வெளிப்படுத்துகின்றன.
- source_word: τῆς καρδίας
  choice: இதயத்திலிருந்து
  rationale: இங்கு καρδία மனிதனின் எண்ணங்களும் ஒழுக்கச் செயல்களும் தோன்றும் அகநிலையைக் குறிக்கிறது. ‘இதயம்’ என்ற வேதாகம உருவகம் குறுகலாக்கப்படாமல் பாதுகாக்கப்படுகிறது.
- source_word: ἐξέρχονται
  choice: புறப்படுகின்றன
  rationale: ஒரு உள்ளார்ந்த மூலத்திலிருந்து வெளியே வருதல் என்ற வினையின் பொருளைத் தெளிவாகவும் பட்டியலின் பன்மைக்கு ஏற்றவாறும் தருகிறது.
- source_word: διαλογισμοὶ πονηροί
  choice: தீய சிந்தனைகள்
  rationale: தீய எண்ணங்கள், ஆலோசனைகள் அல்லது மனத்திட்டங்கள் என்ற பரப்பை அளவுக்கு மீறிக் குறிப்பாக்காமல் இயல்பாகக் காட்டுகிறது.
- source_word: φόνοι
  choice: கொலைகள்
  rationale: சட்டவிரோதமான அல்லது குற்றமுள்ள உயிர்க்கொலைகளைக் குறிக்கும் பன்மை வடிவை நேரடியாகப் பாதுகாக்கிறது.
- source_word: μοιχεῖαι
  choice: விபசாரங்கள்
  rationale: திருமண உறுதியை மீறும் பாலுறவுச் செயல்களைக் குறிக்கும் வழக்கமான, புரிந்துகொள்ளத்தக்க சொல்லாகவும் கிரேக்கப் பன்மைக்கு ஏற்பவும் உள்ளது.
- source_word: πορνεῖαι
  choice: பாலியல் ஒழுக்கக்கேடுகள்
  rationale: πορνεία குறிக்கும் பரந்த வகையான முறைகேடான பாலியல் நடத்தைகளை ஒரு குறுகிய குறிப்பிட்ட செயலாகச் சுருக்காமல் தருகிறது.
- source_word: κλοπαί
  choice: திருட்டுகள்
  rationale: திருடும் செயல்களைக் குறிக்கும் சுருக்கமான, இயல்பான பன்மைச் சொல்.
- source_word: ψευδομαρτυρίαι
  choice: பொய்ச் சாட்சியங்கள்
  rationale: பொய்யான சாட்சி அளித்தல் அல்லது பொய்ச் சான்றுரைகள் என்ற சாட்சியச் சூழலைப் பன்மையில் பாதுகாக்கிறது.
- source_word: βλασφημίαι
  choice: பழித்துரைகள்
  rationale: இந்தப் பொதுவான தீமைகளின் பட்டியலில் மனிதருக்கு எதிரான அவதூறு அல்லது இழிவான பேச்சைக் குறிக்கக்கூடிய சொல்லின் பரந்த பொருளை இயல்பாகத் தருகிறது; தேவனை எதிர்த்த தூஷணம் என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: βλασφημίαι என்பதன் இலக்கு மனிதர்களா அல்லது தேவனா என்பது
  choice: பழித்துரைகள்
  alternative: தேவதூஷணங்கள்
  rationale: உடனடிச் சூழல் தேவனை மட்டுமே இலக்காகக் கொண்ட குற்றத்தைத் தெளிவுபடுத்தாமல், இதயத்திலிருந்து வரும் பொதுவான தீமைகளைப் பட்டியலிடுகிறது. ஆகவே மனிதருக்கு எதிரான அவதூறையும் உள்ளடக்கும் பரந்த வாசிப்பு முதன்மை உரையில் தரப்பட்டு, தேவனை எதிர்த்த தூஷணம் என்ற உண்மையான சொற்பொருள் சாத்தியம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘இதயம்’ என்ற வேதாகம உருவகம் தக்கவைக்கப்பட்டுள்ளது; ஒரே வாக்கியத்தில் தொடரும் பன்மைப் பட்டியலைத் தெளிவாக்க ‘ஆகியவை’ சேர்க்கப்பட்டுள்ளது.
