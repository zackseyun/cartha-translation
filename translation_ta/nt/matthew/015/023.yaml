source:
  edition: SBLGNT
  text: ὁ δὲ οὐκ ἀπεκρίθη αὐτῇ λόγον. καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ⸀ἠρώτουν αὐτὸν λέγοντες· Ἀπόλυσον αὐτήν, ὅτι κράζει ὄπισθεν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/023.yaml
  text: But he did not answer her a word[a]. And his disciples came and kept asking him, saying, “Send her away[b], because she is crying out behind us.”
translation:
  language: ta
  text: ஆனால் அவர் அவளுக்கு ஒரு வார்த்தைகூடப் பதிலளிக்கவில்லை. அவருடைய சீடர்கள் அவரிடம் வந்து, “இவளை அனுப்பிவிடுங்கள்[a]; ஏனென்றால் இவள் நமக்குப் பின்னால்[b] கூக்குரலிட்டுக்கொண்டிருக்கிறாள்” என்று தொடர்ந்து கேட்டுக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சீடர்கள், ‘இவளுடைய வேண்டுகோளை நிறைவேற்றி அனுப்பிவிடுங்கள்’ என்று கேட்டார்களா, அல்லது வெறுமனே ‘இவளை இங்கிருந்து அனுப்பிவிடுங்கள்’ என்று கேட்டார்களா என்பது கிரேக்கத்தில் வெளிப்படையாக இல்லை.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘எங்களைப் பின்தொடர்ந்து.’ கிரேக்கச் சொல் ‘நமக்குப் பின்னால்’ என்ற இடத்தையோ, ‘எங்களைப் பின்தொடர்ந்து’ என்ற செயலையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῇ λόγον
  choice: அவளுக்கு ஒரு வார்த்தைகூடப் பதிலளிக்கவில்லை
  rationale: எந்தப் பதிலும் அளிக்கவில்லை என்ற வலியுறுத்தலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: προσελθόντες
  choice: அவரிடம் வந்து
  rationale: சீடர்கள் இயேசுவை அணுகிய இயக்கத்தைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: ἠρώτουν
  choice: தொடர்ந்து கேட்டுக்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வினையின் தொடர்ச்சியான அல்லது மீண்டும் மீண்டும் கேட்ட செயலைப் பாதுகாக்கிறது; ‘கெஞ்சினார்கள்’ என்று வலிமையை மிகைப்படுத்தவில்லை.
- source_word: Ἀπόλυσον αὐτήν
  choice: இவளை அனுப்பிவிடுங்கள்
  rationale: அவளுடைய வேண்டுகோளை நிறைவேற்றி அனுப்புவதா அல்லது வெறுமனே அங்கிருந்து அகற்றுவதா என்பதைத் தீர்மானிக்காமல், கிரேக்கத்தின் பொருள் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: κράζει
  choice: கூக்குரலிட்டுக்கொண்டிருக்கிறாள்
  rationale: உரத்துத் தொடர்ந்து அழைக்கும் செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὄπισθεν ἡμῶν
  choice: நமக்குப் பின்னால்
  rationale: இடத்தைக் குறிக்கும் நேரடிப் பொருளை வழங்குகிறது; ‘எங்களைப் பின்தொடர்ந்து’ என்ற சாத்தியப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: Ἀπόλυσον αὐτήν என்பதில் சீடர்களின் நோக்கம்
  choice: ‘இவளை அனுப்பிவிடுங்கள்’ என்று நடுநிலையாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘இவளுடைய வேண்டுகோளை நிறைவேற்றி அனுப்பிவிடுங்கள்’ அல்லது ‘இவளை இங்கிருந்து விரட்டிவிடுங்கள்’
  rationale: அவளுடைய கோரிக்கையை இயேசு நிறைவேற்ற வேண்டும் என்று சீடர்கள் கேட்டார்களா, அல்லது அவள் தங்களைத் தொந்தரவு செய்ததால் அவளை வெறுமனே அகற்ற விரும்பினார்களா என்பதை கிரேக்கக் கட்டளை வெளிப்படையாகத் தீர்மானிக்கவில்லை. ஆகவே கதையின் இறையியல் மற்றும் கதைநடைத் தீர்மானமின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவைக் குறிக்க மரியாதை ஒருமை ‘அவர்’ மற்றும் அதற்கேற்ற கட்டளை வடிவம் பயன்படுத்தப்பட்டுள்ளன. கிரேக்கத்தின் தொடர்ச்சிச் செயலும் சீடர்களின் நோக்கத்தில் உள்ள உண்மையான தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
