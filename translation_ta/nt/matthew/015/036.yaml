  to: அவர் ஏழு அப்பங்களையும் மீன்களையும் எடுத்து, நன்றி செலுத்திய பின்பு[a] அப்பங்களைப் பிட்டு, அவற்றைத் தொடர்ந்து சீடர்களுக்குக் கொடுத்தார்; சீடர்களோ அவற்றை மக்கள் கூட்டங்களுக்குக் கொடுத்தார்கள்.
  rationale: ‘எடுத்து’ மூலத்தின் எளிய நிகழ்வுரையோட்டத்தைப் பின்பற்றுகிறது. அப்பங்களை வெளிப்படையாகக் குறிப்பிட்டதால் பிட்டது மீன்களா அப்பங்களா என்ற தேவையற்ற குழப்பம் நீங்குகிறது. ‘அவற்றைத் தொடர்ந்து’ என்பது இயேசு சீடர்களுக்குக் கொடுத்த உணவைத் தெளிவுபடுத்துவதோடு ἐδίδου-வின் தொடர்ச்சித் தன்மையையும் காக்கிறது. அடிக்குறிப்பு மாற்று வாசிப்பைத் தக்கவைத்துக் கொண்டு கிரேக்க இலக்கண விளக்கத்தைத் துல்லியப்படுத்துகிறது.
