  verdict: revise
  source_fidelity: கருத்து மொத்தத்தில் மூலத்திற்கு உண்மையாக உள்ளது; குறிப்பாக நன்றி செலுத்துதல், அப்பத்தைப் பிட்டல், சீடர்கள் வழியாகக் கூட்டங்களுக்கு வழங்குதல், மற்றும் ἐδίδου-வின் தொடர்ச்சியான பொருள் ஆகியவை காக்கப்பட்டுள்ளன. ஆனால் “அவற்றைப் பிட்டு” என்பது அருகிலுள்ள ‘அப்பங்களையும் மீன்களையும்’ இரண்டையும் பிட்டதாகப் புரிய வாய்ப்புள்ளது; κλάω இச்சூழலில் அப்பங்களைப் பிட்டதைக் குறிக்கிறது. “எடுத்துக்கொண்டு” என்பதற்குப் பதில் எளிய இறந்தகாலமான “எடுத்து” ἔλαβεν-க்கு நெருக்கமானது.
  naturalness: “மக்கள் கூட்டங்கள்” புரிந்துகொள்ளத்தக்கது; ஆயினும் “மக்கள் கூட்டங்களுக்கு” என்றே வைத்தால் இயல்பாக உள்ளது. முதல் வழங்கல் வாக்கியத்தில் “அவற்றைத்” சேர்ப்பது தமிழில் செயப்படுபொருளைத் தெளிவாக்குகிறது. “தொடர்ந்து கொடுத்தார்” முற்றுப்பெறாத இறந்தகாலத்தின் பகிர்ந்துகொண்டிருந்த தன்மையை நன்றாகக் காட்டுகிறது.
  terminology: “அப்பங்கள்,” “மீன்கள்,” “சீடர்கள்,” “மக்கள் கூட்டங்கள்” ஆகியவை நவீன தரமான தமிழ் வேதாகம நடைக்கு ஏற்றவை. அடிக்குறிப்பில் “இறந்தகால வினையெச்சம்” என்பது கிரேக்க aorist participle-ஐத் துல்லியமாக விளக்காது; முன்னதாக நிகழ்ந்த செயலைக் குறிக்கும் வினையெச்சம் என்று குறிப்பிடுதல் நல்லது.
