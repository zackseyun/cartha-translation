id: MAT.15.36
reference: Matthew 15:36
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀ἔλαβεν τοὺς ἑπτὰ ἄρτους καὶ τοὺς ἰχθύας ⸀καὶ εὐχαριστήσας ἔκλασεν καὶ ⸀ἐδίδου τοῖς ⸀μαθηταῖς οἱ δὲ μαθηταὶ ⸂τοῖς ὄχλοις⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/036.yaml
  text: He took the seven loaves and the fish[a], and after giving thanks he broke them and kept giving them to the disciples, and the disciples to the crowds.
translation:
  language: ta
  text: அவர் ஏழு அப்பங்களையும் மீன்களையும் எடுத்து, நன்றி செலுத்திய பின்பு[a] அப்பங்களைப் பிட்டு, அவற்றைத் தொடர்ந்து சீடர்களுக்குக் கொடுத்தார்; சீடர்களோ அவற்றை மக்கள் கூட்டங்களுக்குக் கொடுத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நன்றி செலுத்தி.”
    reason: முன்னதாக நிகழ்ந்த செயலைக் குறிக்கும் கிரேக்க வினையெச்சத்தைத் தமிழில் சுருக்கமான வினையெச்சமாகவும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: ἔλαβεν
  choice: எடுத்துக்கொண்டு
  rationale: உணவைப் பகிர்வதற்கு முன் இயேசு அதைத் தம் கையில் எடுத்த செயலை இயல்பான தமிழ் நிகழ்வோட்டத்தில் காட்டுகிறது.
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: அந்த ஏழு அப்பங்கள்
  rationale: ἄρτος இங்கு எண்ணக்கூடிய ரொட்டித் துண்டுகள் அல்லது முழு அப்பங்களைக் குறிக்கிறது; தமிழ் வேதாகம நடையிலும் பொதுவழக்கிலும் ‘அப்பங்கள்’ தெளிவாக உள்ளது.
- source_word: τοὺς ἰχθύας
  choice: மீன்கள்
  rationale: கிரேக்கப் பன்மையை இயல்பான தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: εὐχαριστήσας
  choice: நன்றி செலுத்திய பின்பு
  rationale: இறந்தகால வினையெச்சத்தின் முன்னிகழ்வுத் தொடர்பைத் தெளிவாக வெளிப்படுத்துகிறது; கிரேக்கத்தில் சொல்லப்படாத பெறுநராக ‘கடவுளுக்கு’ என்பதைச் சேர்க்கவில்லை.
- source_word: ἔκλασεν
  choice: அவற்றைப் பிட்டு
  rationale: κλάω என்பதன் உணவைப் பகிர்வதற்காகப் பிட்ட செயலைக் காட்டுகிறது. தமிழில் தேவையான செயப்படுபொருள் சூழலிலிருந்து சேர்க்கப்பட்டுள்ளது.
- source_word: ἐδίδου
  choice: தொடர்ந்து கொடுத்தார்
  rationale: முற்றுப்பெறாத இறந்தகால வடிவம் காட்டும் தொடர்ச்சியான அல்லது மீண்டும் மீண்டும் நடைபெற்ற பகிர்வை வெளிப்படுத்துகிறது.
- source_word: τοῖς μαθηταῖς
  choice: சீடர்களுக்கு
  rationale: பெறுநரைக் குறிக்கும் வேற்றுமையை நேரடியாகக் காட்டுகிறது; மூலத்தில் இல்லாத ‘தமது’ சேர்க்கப்படவில்லை.
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: சீடர்களோ அவற்றை மக்கள் கூட்டங்களுக்குக் கொடுத்தார்கள்
  rationale: கிரேக்கத்தில் விடப்பட்டுள்ள கொடுத்தல் வினையை இயல்பான தமிழுக்காக நிறைவு செய்கிறது; δέ-யின் தலைப்புமாற்றத்தை ‘சீடர்களோ’ என்பதும், ὄχλοι என்ற பன்மையை ‘மக்கள் கூட்டங்கள்’ என்பதும் காக்கின்றன.
theological_decisions:
- issue: εὐχαριστήσας என்பதில் இருக்கக்கூடிய திருவிருந்து சார்ந்த எதிரொலி
  choice: சாதாரண உணவுக்கு முன் நன்றி செலுத்திய நிகழ்வாக மொழிபெயர்த்தல்
  alternative: திருவிருந்து சார்ந்த பொருளை முன்னிறுத்தும் வழிபாட்டு மொழியைப் பயன்படுத்துதல்
  rationale: இந்தச் சொற்றொடர் திருவிருந்தை நினைவூட்டக்கூடும்; ஆனால் இவ்வசனம் நேரடியாக உணவின்மேல் நன்றி செலுத்தியதை மட்டுமே கூறுகிறது. ஆகவே மூலத்தில் இல்லாத சடங்கு அல்லது கோட்பாட்டுப் பொருள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன தரமான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நிகழ்வுரை நடை பயன்படுத்தப்பட்டுள்ளது. ‘தொடர்ந்து கொடுத்தார்’ என்பது கிரேக்க முற்றுப்பெறாத இறந்தகாலத்தின் தொடர்ச்சியை இயல்பாகக் காட்டுகிறது; ‘சீடர்களோ’ என்பது வாக்கியத்தின் தலைப்புமாற்றத்தைப் பாதுகாக்கிறது.
