  text: καὶ ἀπολύσας τοὺς ὄχλους ἐνέβη εἰς τὸ πλοῖον, καὶ ἦλθεν εἰς τὰ ὅρια ⸀Μαγαδάν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/039.yaml
  text: And after dismissing the crowds[a], he got into the boat and came to the region of Magadan.
translation:
  language: ta
  text: அவர் மக்கள் கூட்டங்களை அனுப்பிவிட்டு, படகில் ஏறி, மகதான்[a] பகுதிக்கு வந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் ‘மகதான்’ என்பதற்குப் பதிலாக ‘மகதலா’ என்று வாசிக்கப்படுகிறது.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπολύσας
  choice: அனுப்பிவிட்டு
  rationale: முதன்மைச் செயலுக்கு முன் முடிந்த செயலைக் குறிக்கும் இறந்தகாலப் பங்கேற்பை இயல்பான தமிழில் காட்டுகிறது; கூட்டத்தினரை அங்கிருந்து அனுப்பிய சூழலையும் துல்லியமாகத் தருகிறது.
- source_word: τοὺς ὄχλους
  choice: மக்கள் கூட்டங்களை
  rationale: பன்மையைப் பேணுவதோடு, நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: ἐνέβη εἰς τὸ πλοῖον
  choice: படகில் ஏறி
  rationale: படகுக்குள் சென்று பயணம் தொடங்குவதைக் குறிக்கும் கிரேக்க மரபுத்தொடருக்கான இயல்பான தமிழ் வடிவம்.
- source_word: ἦλθεν
  choice: வந்தார்
  rationale: ἔρχομαι என்பதன் அடிப்படை இயக்கப் பொருளை நேரடியாகப் பேணுகிறது; பயணத்தின் இலக்கை அடைந்ததையும் சூழல் தெளிவாக்குகிறது.
- source_word: τὰ ὅρια
  choice: பகுதிக்கு
  rationale: சொல்லுக்கு நேரடியாக ‘எல்லைகள்’ என்ற பொருள் இருந்தாலும், இங்கு ஒரு நிலப்பரப்பு அல்லது வட்டாரத்தைக் குறிக்கும் மரபுவழக்கை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Μαγαδάν
  choice: மகதான்
  rationale: SBLGNT முதன்மை உரையிலுள்ள இடப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது; மாற்று வாசகம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: வசன முடிவிலுள்ள இடப்பெயரின் உரை வடிவம்
  choice: மகதான்
  alternative: மகதலா
  rationale: இது கோட்பாட்டு விவகாரம் அல்ல, மூலப்பிரதி வாசக வேறுபாடு. வழங்கப்பட்ட SBLGNT உரை Μαγαδάν என்று வாசிப்பதால் முதன்மை உரை அதைப் பின்பற்றுகிறது; பரவலாக அறியப்பட்ட மாற்று வாசகம் வெளிப்படைத்தன்மைக்காக அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் நிகழ்வுவரிசை இயல்பான தமிழ் வினையெச்சங்களால் பேணப்பட்டுள்ளது; அடிக்குறிப்பு குறியீடு அது சார்ந்த இடப்பெயருக்குப் பின் வைக்கப்பட்டுள்ளது.
