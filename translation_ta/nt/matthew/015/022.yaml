source:
  edition: SBLGNT
  text: καὶ ἰδοὺ γυνὴ Χαναναία ἀπὸ τῶν ὁρίων ἐκείνων ἐξελθοῦσα ⸀ἔκραζεν λέγουσα· Ἐλέησόν με, κύριε ⸀υἱὸς Δαυίδ· ἡ θυγάτηρ μου κακῶς δαιμονίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/022.yaml
  text: And behold[a], a Canaanite woman from those regions came out and was crying out, saying, “Have mercy on me, Lord, Son of David; my daughter is badly demon-possessed.”
translation:
  language: ta
  text: இதோ, அந்தப் பகுதிகளிலிருந்து வெளியே வந்த ஒரு கானானியப் பெண், “ஆண்டவரே, தாவீதின் மகனே, என்மேல் இரக்கம் காட்டுங்கள்! என் மகள் பேயால் கடுமையாகப் பீடிக்கப்பட்டிருக்கிறாள்[a]” என்று தொடர்ந்து கூக்குரலிட்டாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பேய் பிடித்து மிகவும் வேதனைப்படுகிறாள்” / “பேயால் கடுமையாக வேதனைப்படுத்தப்படுகிறாள்.”
    reason: δαιμονίζεται என்பதன் பொருள் பேயின் ஆளுகை, பீடிப்பு அல்லது வேதனைப்படுத்துதல் ஆகிய நெருக்கமான விதங்களில் தமிழில் வெளிப்படுத்தப்படலாம்; கிரேக்கச் சொல் நிகழ்வின் துல்லிய இயல்பை முழுமையாக வரையறுக்கவில்லை.
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கதையில் கவனத்தை ஈர்க்கும் இடைச்சொல்லின் உயிரோட்டத்தைத் தமிழிலும் வெளிப்படையாகப் பேணுகிறது.
- source_word: Χαναναία
  choice: கானானியப் பெண்
  rationale: மத்தேயு பயன்படுத்தும் வரலாற்றுச் சிறப்புள்ள இன அடையாளத்தை அப்படியே பேணுகிறது; மாற்குவின் இணைப் பகுதியில் வரும் வேறு அடையாளத்தை இங்கு கொண்டுவரவில்லை.
- source_word: ἀπὸ τῶν ὁρίων ἐκείνων ἐξελθοῦσα
  choice: அந்தப் பகுதிகளிலிருந்து வெளியே வந்த
  rationale: ὅρια என்பதன் பிராந்தியம் அல்லது எல்லைப்பகுதி என்ற பொருளையும், ἐξελθοῦσα என்பதன் வெளியே வந்த செயற்பாட்டையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἔκραζεν
  choice: தொடர்ந்து கூக்குரலிட்டாள்
  rationale: முற்றுப்பெறாத இறந்தகால வடிவம் காட்டும் நீடித்த அல்லது மீண்டும் மீண்டும் நிகழ்ந்த கூக்குரலைத் தெளிவாக்குகிறது.
- source_word: Ἐλέησόν με
  choice: என்மேல் இரக்கம் காட்டுங்கள்
  rationale: வேண்டுகோளின் அவசரத்தையும் இரக்கம் குறித்த முக்கிய சொற்பொருளையும் மரியாதையான நவீன தமிழில் பேணுகிறது.
- source_word: κύριε
  choice: ஆண்டவரே
  rationale: ‘தாவீதின் மகனே’ என்ற மேசியா சார்ந்த அழைப்புடன் வருவதால், வெறும் ‘ஐயா’ என்பதைவிட வணக்கமும் உயர்வும் கொண்ட இந்தத் தேர்வு பொருத்தமானது.
- source_word: υἱὸς Δαυίδ
  choice: தாவீதின் மகனே
  rationale: தாவீதின் அரச மரபையும் மேசியா எதிர்பார்ப்பையும் சுமக்கும் பட்டத்தை நேரடியாகப் பேணுகிறது.
- source_word: κακῶς
  choice: கடுமையாக
  rationale: மகளின் நிலையின் தீவிரத்தை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: δαιμονίζεται
  choice: பேயால் பீடிக்கப்பட்டிருக்கிறாள்
  rationale: பேயின் ஆளுகை அல்லது தாக்கத்திற்கு உட்பட்ட நிலையைத் தெரிவிக்கிறது; ‘பேய் பிடித்திருக்கிறது’ என்பதைவிட கிரேக்கச் சொல் குறிப்பிடாத நிகழ்வியல் நுணுக்கத்தை மிகையாக நிர்ணயிப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: மேசியா சார்ந்த அழைப்பில் κύριε என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவரே
  alternative: ஐயா / எஜமானே
  rationale: ‘தாவீதின் மகனே’ என்பதுடன் இணைந்திருப்பதால், இந்த அழைப்பு வெறும் மரியாதையைவிட அதிகமான வணக்க அல்லது மேசியா சார்ந்த வலிமையைக் கொண்டிருக்கலாம். அதேவேளையில், பெண்ணின் கிறிஸ்துவியல் புரிதலை உரை கூறுவதைக் கடந்த அளவில் வரையறுக்கவில்லை.
- issue: δαιμονίζεται என்பதன் பொருள் வரம்பு
  choice: பேயால் பீடிக்கப்பட்டிருக்கிறாள்
  alternative: பேய் பிடித்திருக்கிறாள் / பேயால் வேதனைப்படுத்தப்படுகிறாள்
  rationale: உரை பேய்ச் செயல்பாட்டைத் தெளிவாகக் கூறுகிறது; ஆனால் அதன் சரியான தன்மையை நவீன ‘பிடித்தல்’ என்ற ஒரே வகைக்குள் கட்டுப்படுத்த வேண்டியதில்லை. முதன்மை மொழிபெயர்ப்பு அகன்ற பொருள் வரம்பைப் பேணுகிறது; மரபான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் விதமாகவும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘இதோ’ கதையின் கவன ஈர்ப்பைத் தக்கவைக்கிறது; ‘தொடர்ந்து’ என்பது இறந்தகால வினையின் நீடித்த தன்மையை வெளிப்படுத்துகிறது. அழைப்பில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டாலும், கிரேக்கத்தின் ஒருமை முகவரி பொருளில் மாற்றப்படவில்லை.
