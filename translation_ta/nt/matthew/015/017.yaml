source:
  edition: SBLGNT
  text: ⸀οὐ νοεῖτε ὅτι πᾶν τὸ εἰσπορευόμενον εἰς τὸ στόμα εἰς τὴν κοιλίαν χωρεῖ καὶ εἰς ἀφεδρῶνα ἐκβάλλεται;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/017.yaml
  text: Do you not understand that everything entering into the mouth goes into the stomach and is expelled into the latrine?[a]
translation:
  language: ta
  text: வாய்க்குள் நுழையும் அனைத்தும் வயிற்றுக்குள் சென்று, பின்னர் கழிப்பிடத்திற்குள் வெளியேற்றப்படுகிறது[a] என்பது உங்களுக்குப் புரியவில்லையா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வாய்க்குள் நுழையும் எதுவும் … மலக்கூடத்திற்குள் வெளியேற்றப்படுகிறது.”
    reason: ἀφεδρών என்பதற்கான மேலும் நேரடியான ‘மலக்கூடம்’ என்ற மாற்றுச் சொல்லையும், பொதுப்பொருளுடைய πᾶν τὸ εἰσπορευόμενον என்பதற்கான ‘எதுவும்’ என்ற இயல்பான மாற்று வடிவத்தையும் பதிவு செய்கிறது.
lexical_decisions:
- source_word: νοεῖτε
  choice: புரியவில்லையா
  rationale: இங்கு νοέω என்பது வெறும் புலனுணர்வை அல்ல, இயேசுவின் கருத்தை மனத்தால் புரிந்துகொள்வதைக் குறிக்கிறது; கண்டிக்கும் வினாவின் இயல்பையும் தமிழ் வடிவம் காக்கிறது.
- source_word: πᾶν τὸ εἰσπορευόμενον
  choice: செல்கிற அனைத்தும்
  rationale: பொதுப்பொருளுடைய நடுநிலை ஒருமை வினையெச்ச அமைப்பு, வாய்க்குள் செல்லும் எதையும் உள்ளடக்குகிறது; இத்தேர்வு அதன் முழுமையான பொதுப்பரப்பைக் காக்கிறது.
- source_word: εἰς τὸ στόμα
  choice: வாய்க்குள்
  rationale: εἰς குறிக்கும் உள்நோக்கிய இயக்கத்தை இயல்பான நவீன தமிழில் நேரடியாகத் தருகிறது.
- source_word: κοιλίαν
  choice: வயிற்றுக்குள்
  rationale: இச்சூழலில் κοιλία செரிமான உறுப்பைக் குறிக்கிறது; ‘வயிறு’ என்பது தெளிவான, பொதுவாகப் புரியும் தமிழ்ச் சொல்.
- source_word: χωρεῖ
  choice: சென்று
  rationale: செரிமானச் சூழலில் உணவு வயிற்றை அடைவதைக் குறிக்கிறது; ‘சென்று’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἀφεδρῶνα
  choice: கழிப்பிடத்தில்
  rationale: ἀφεδρών என்பது மலம் வெளியேற்றப்படும் இடமான கழிப்பிடம் அல்லது மலக்கூடத்தைக் குறிக்கிறது; ‘கழிப்பிடம்’ நவீன, கண்ணியமான, பரவலாகப் புரியும் சொல்.
- source_word: ἐκβάλλεται
  choice: வெளியேற்றப்படுகிறது
  rationale: செயப்பாட்டு வடிவத்தையும் உடலிலிருந்து அகற்றப்படும் செயல்முறையையும் தெளிவாகக் காக்கிறது; தேவையற்ற கொச்சைத்தன்மையைத் தவிர்க்கிறது.
theological_decisions:
- issue: சடங்குத் தூய்மை விதிகளுடன் இயேசுவின் கூற்றுக்குள்ள தொடர்பு
  choice: உடலியல் செயல்முறையை வசனத்தில் உள்ளபடியே மொழிபெயர்த்து, எல்லா உணவுகளும் தூயவை என அறிவிக்கும் விளக்கத்தைச் சேர்க்கவில்லை.
  alternative: எல்லா உணவுகளும் இதனால் தூயவை என அறிவிக்கப்பட்டதாக விளக்க விரிவாக்கம் சேர்த்தல்.
  rationale: இந்த வசனம் செரிமானச் செயல்முறையை எடுத்துரைத்து, மனிதனை உண்மையில் தீட்டுப்படுத்துவது எது என்ற இயேசுவின் வாதத்தை ஆதரிக்கிறது. ஆனால் மாற்கு 7:19-ல் காணப்படும் விளக்கக் குறிப்பை இங்கு வெளிப்படையாகக் கூறவில்லை; ஆகவே கிரேக்க உரையில் இல்லாத இறையியல் முடிவைச் சேர்க்காமல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. கண்டிக்கும் வினா வடிவம் காக்கப்பட்டுள்ளது; உடலியல் கருத்து தெளிவாகச் சொல்லப்பட்டாலும் கொச்சையான மொழி தவிர்க்கப்பட்டுள்ளது.
