  text: Καὶ ἐξελθὼν ἐκεῖθεν ὁ Ἰησοῦς ἀνεχώρησεν εἰς τὰ μέρη Τύρου καὶ Σιδῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/021.yaml
  text: And Jesus went out from there and withdrew to the region of Tyre and Sidon[a].
translation:
  language: ta
  text: இயேசு அங்கிருந்து புறப்பட்டு, தீரு, சீதோன் பகுதிகளுக்கு விலகிச் சென்றார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தீரு, சீதோன் பகுதிகளுக்குப் புறப்பட்டுச் சென்றார்.’ கிரேக்க வினைச்சொல்லை இன்னும் நடுநிலையாக மொழிபெயர்க்கலாம்; ஆனால் ‘விலகிச் சென்றார்’ என்பது மத்தேயு இவ்வினைச்சொல்லைத் திரும்பத் திரும்பப் பயன்படுத்தும் விதத்தின் நுணுக்கத்தைப் பிரதிபலிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: (தனி இணைப்புச் சொல்லாக மொழிபெயர்க்கப்படவில்லை)
  rationale: தமிழில் முந்தைய நிகழ்வுடன் இயல்பாகத் தொடரும் வாக்கியத்தில் ‘மேலும்’ அல்லது ‘அப்போது’ என்று சேர்ப்பது தேவையற்ற வலியுறுத்தலை உண்டாக்கலாம்; வாக்கியத் தொடர்ச்சியே கிரேக்க இணைப்பின் பணியைச் செய்கிறது.
- source_word: ἐξελθὼν
  choice: புறப்பட்டு
  rationale: முதன்மை வினைக்கு முன்னதாக நிகழும் வெளியேறுதலை இயல்பான தமிழ் வினையெச்சமாகக் காட்டுகிறது; நோக்கத்தை ஊகித்துச் சேர்ப்பதில்லை.
- source_word: ἐκεῖθεν
  choice: அங்கிருந்து
  rationale: முந்தைய இடத்திலிருந்து நடந்த புறப்பாட்டைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: ὁ Ἰησοῦς
  choice: இயேசு
  rationale: எழுவாயைத் தெளிவாகக் காட்டும் வழக்கமான தமிழ் பெயர்வடிவம்.
- source_word: ἀνεχώρησεν
  choice: விலகிச் சென்றார்
  rationale: மத்தேயுவில் இவ்வினை தரக்கூடிய வெறும் புறப்பாட்டைக் கடந்த ‘விலகிச் செல்லுதல்’ என்ற நுணுக்கத்தைப் பாதுகாக்கிறது; ‘பின்வாங்கினார்’ என்பதுபோல் தோல்வி அல்லது அச்சத்தைத் தேவையின்றி உணர்த்துவதில்லை.
- source_word: εἰς τὰ μέρη
  choice: பகுதிகளுக்கு
  rationale: குறிப்பிட்ட நகரங்களுக்குள் சென்றார் என்று கட்டுப்படுத்தாமல், அவற்றைச் சார்ந்த பொதுவான நிலப்பகுதிகளை நோக்கிய இயக்கத்தைக் காட்டுகிறது.
- source_word: Τύρου καὶ Σιδῶνος
  choice: தீரு, சீதோன்
  rationale: இரு நகரங்களையும் சார்ந்த பகுதிகள் என்ற கிரேக்கத் தொடர்பைத் தமிழில் இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: புறஜாதியாருடன் தொடர்புடைய பகுதிகளை நோக்கி இயேசு சென்றதன் கதைநடை நுணுக்கம்
  choice: ἀνεχώρησεν என்பதை ‘விலகிச் சென்றார்’ என்று மொழிபெயர்த்து, அவர் சென்றதற்கான காரணத்தை வெளிப்படையாகச் சேர்க்கவில்லை.
  alternative: ‘சென்றார்’ அல்லது ‘புறப்பட்டுச் சென்றார்’ என்று நடுநிலையாக மொழிபெயர்க்கலாம்; ‘பின்வாங்கினார்’ என்று இன்னும் வலுவாகவும் மொழிபெயர்க்கலாம்.
  rationale: மத்தேயுவின் சொல் தேர்வு திட்டமிட்ட விலகலை உணர்த்தக்கூடும்; ஆனால் அதற்கான நோக்கத்தை இவ்வசனம் கூறவில்லை. எனவே நுணுக்கம் பாதுகாக்கப்படுகிறது, உளவியல் அல்லது இறையியல் காரணம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘விலகிச் சென்றார்’ என்பது இயல்பான தமிழில் மூலத்தின் சாத்தியமான திட்டமிட்ட விலகல் நுணுக்கத்தைப் பாதுகாக்கிறது; காரணத்தை ஊகிப்பதில்லை. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
