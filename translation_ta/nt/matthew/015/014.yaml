id: MAT.15.14
reference: Matthew 15:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἄφετε αὐτούς· ⸂τυφλοί εἰσιν ὁδηγοὶ τυφλῶν⸃· τυφλὸς δὲ τυφλὸν ἐὰν ὁδηγῇ, ἀμφότεροι εἰς βόθυνον πεσοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/014.yaml
  text: Leave them alone[a]; they are blind guides of the blind. But if a blind man guides a blind man[c][b], both will fall into a pit.
translation:
  language: ta
  text: அவர்களை விட்டுவிடுங்கள். அவர்கள் பார்வையற்றோருக்கு வழிகாட்டும் பார்வையற்றவர்கள். பார்வையற்ற ஒருவர் பார்வையற்ற இன்னொருவருக்கு வழிகாட்டினால், இருவரும் ஒரு குழியில்[a] விழுவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பள்ளத்தில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφετε αὐτούς
  choice: அவர்களை விட்டுவிடுங்கள்
  rationale: இங்கு ἀφίημι என்பது ‘மன்னியுங்கள்’ என்றல்ல, அவர்களை அப்படியே விட்டுவிடுங்கள் அல்லது பொருட்படுத்தாமல் விலகியிருங்கள் என்ற கட்டளையைக் குறிக்கிறது.
- source_word: τυφλοί
  choice: பார்வையற்றவர்கள்
  rationale: ஆவிக்குரிய உணர்வின்மையைக் குறிக்கும் உருவகத்தை விளக்கிச் சொல்லாமல், மூலத்தின் ‘குருடு/பார்வையற்ற’ உருவகத்தைத் தக்கவைக்கிறது; நவீன மரியாதையான தமிழில் ‘பார்வையற்ற’ இயல்பாக உள்ளது.
- source_word: ὁδηγοὶ τυφλῶν
  choice: பார்வையற்றோருக்கு வழிகாட்டும் பார்வையற்றவர்கள்
  rationale: ‘வழிகாட்டிகள்’ என்ற பெயர்ச்சொல்லின் கருத்தைத் தக்கவைத்தபடியே, தமிழில் இயல்பாகவும் அடுத்த வாக்கியத்துடன் சொற்பொருள் தொடர்பு தெளிவாகவும் அமைகிறது.
- source_word: τυφλὸς ... τυφλὸν
  choice: பார்வையற்ற ஒருவர் ... பார்வையற்ற இன்னொருவர்
  rationale: மூலத்தின் ஒருமை பழமொழி அமைப்பைத் தக்கவைத்து, ஒருவர் மற்றொருவரை வழிநடத்தும் இரு வேறு நபர்கள் என்பதைத் தமிழில் தெளிவாக்குகிறது.
- source_word: ἐὰν ὁδηγῇ
  choice: வழிகாட்டினால்
  rationale: ἐάν உடன் வரும் நிகழ்கால உடன்பாட்டு வினை பொதுவான நிபந்தனையைத் தருகிறது; தமிழின் ‘-னால்’ வடிவம் இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀμφότεροι
  choice: இருவரும்
  rationale: இரண்டு நபர்களையும் உள்ளடக்கும் மூலச்சொல்லைச் சுருக்கமாகவும் துல்லியமாகவும் தருகிறது.
- source_word: εἰς βόθυνον
  choice: ஒரு குழியில்
  rationale: βόθυνος என்பது குழி, பள்ளம் அல்லது அகழியைக் குறிக்கலாம். ‘குழி’ பரந்த பொருளுடையதும் உருவகக் காட்சியைத் தெளிவாகத் தருவதுமாகும்.
- source_word: πεσοῦνται
  choice: விழுவார்கள்
  rationale: நிபந்தனையின் உறுதியான எதிர்கால விளைவை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘பார்வையற்ற’ என்பதன் உருவகப் பொருள்
  choice: உருவகத்தை முதன்மை உரையில் விளக்காமல் அப்படியே தக்கவைத்தல்
  alternative: ‘ஆவிக்குரிய பார்வையற்றவர்கள்’ அல்லது ‘அறிவில்லாத வழிகாட்டிகள்’ என்று விரித்துரைத்தல்
  rationale: மூல உரை உருவகத்தின் பொருளை வெளிப்படையாக வரையறுக்கவில்லை. அதை விரித்துரைப்பது உரையின் கூர்மையையும் உண்மையான விளக்கவியல் திறப்பையும் குறைக்கும்.
- issue: பழமொழியின் ஒருமை வடிவமும் பாலினக் குறிப்பும்
  choice: ‘பார்வையற்ற ஒருவர் ... பார்வையற்ற இன்னொருவர்’
  alternative: ‘பார்வையற்ற ஆண் ... பார்வையற்ற ஆண்’ அல்லது பன்மையில் ‘பார்வையற்றவர்கள்’
  rationale: கிரேக்க ஆண்பால் ஒருமை இங்கு பொதுவாக மனிதரைக் குறிக்கும் பழமொழி வடிவம். தமிழ் ‘ஒருவர்’ மூலத்தின் ஒருமையையும் பொதுப் பயன்பாட்டையும் இயல்பாகத் தக்கவைக்கிறது; தேவையற்ற ஆண்-பாலினக் கட்டுப்பாட்டைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவான, மரியாதையான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘குருடர்’ என்பதற்குப் பதிலாக ‘பார்வையற்றவர்’ பயன்படுத்தப்பட்டாலும், மூல உருவகம் முழுமையாகத் தக்கவைக்கப்பட்டுள்ளது. பழமொழியின் சுருக்கமும் எச்சரிக்கைத் தொனியும் பாதுகாக்கப்பட்டுள்ளன.
