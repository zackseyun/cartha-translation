  text: Ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ· Φράσον ἡμῖν τὴν παραβολὴν ⸀ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/015.yaml
  text: But Peter answered and said to him[a], “Explain this parable to us.”
translation:
  language: ta
  text: அதற்குப் பேதுரு அவரிடம், “இந்த உவமையை எங்களுக்கு விளக்கிச் சொல்லுங்கள்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இந்த உவமையை எங்களுக்குச் சொல்லுங்கள்” அல்லது “இந்த உவமையை எங்களுக்குத் தெளிவுபடுத்துங்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: φράζω என்ற வினை ‘சொல்லுதல்’, ‘விளக்குதல்’, ‘தெளிவுபடுத்துதல்’ ஆகிய பொருள் நுணுக்கங்களைக் கொண்டிருக்கலாம்.
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ
  choice: அதற்குப்
  rationale: பேதுருவின் சொல் முந்தைய உரைக்கான பதில் அல்லது தொடர்ச்சி என்பதை இயல்பான தமிழ் நடையில் காட்டுகிறது; δέ-யின் மென்மையான உரையாடல் நகர்வையும் அளவுக்கு மீறிய முரண்பாடாக மாற்றாமல் தக்கவைக்கிறது.
- source_word: ὁ Πέτρος
  choice: பேதுரு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: εἶπεν αὐτῷ
  choice: அவரிடம் … என்றார்
  rationale: பேச்சின் மறைமுக இலக்கைத் தெளிவாகக் காட்டுவதோடு, இயேசுவைக் குறிக்கும் இடத்தில் இயல்பான மரியாதைத் தமிழ் நடையைப் பயன்படுத்துகிறது.
- source_word: Φράσον
  choice: விளக்கிச் சொல்லும்
  rationale: φράζω இங்கு ஒரு உருவகக் கூற்றின் பொருளைத் தெளிவுபடுத்திக் கூறும்படி கேட்பதைக் குறிக்கிறது. ‘விளக்கிச் சொல்லும்’ என்பது விளக்குதல் மற்றும் எடுத்துரைத்தல் ஆகிய இரு நுணுக்கங்களையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἡμῖν
  choice: எங்களுக்கு
  rationale: கோரிக்கையின் பயனாளிகளாகிய சீடர்களைக் குறிக்கும் இயல்பான வேற்றுமை வடிவம்.
- source_word: τὴν παραβολὴν ταύτην
  choice: இந்த உவமையை
  rationale: παραβολή என்பதற்கான நிலைபெற்ற தமிழ் சொல் ‘உவமை’; ταύτην உடனடியாக முந்திய கூற்றைச் சுட்டுவதால் ‘இந்த’ என மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. கிரேக்கத்தின் ‘பதில் கூறி … சொன்னார்’ என்ற இரட்டைச் சொல்லமைப்பு தமிழில் செயற்கையாகத் தோன்றாதபடி ‘அதற்குப் … என்றார்’ என வழங்கப்பட்டுள்ளது. ‘விளக்கிச் சொல்லும்’ என்பது மரியாதையுடனான வேண்டுகோள் வடிவம்.
