id: MAT.15.5
reference: Matthew 15:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ λέγετε· Ὃς ἂν εἴπῃ τῷ πατρὶ ἢ τῇ μητρί· Δῶρον ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/005.yaml
  text: But you say[a], ‘Whoever says to his father or his mother, “Whatever you would have benefited from me is a gift,”’
translation:
  language: ta
  text: ஆனால் நீங்கள், ‘ஒருவன் தன் தந்தையிடமோ தாயிடமோ, “என்னிடமிருந்து உங்களுக்கு உதவியாக இருந்திருக்கும் எதுவும் பரிசு[a]” என்று சொன்னால்,’ என்கிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “காணிக்கை.” பெற்றோருக்கு உதவப் பயன்படுத்தக்கூடியதை கடவுளுக்கென்று ஒதுக்கப்பட்டதாக அறிவிப்பதே இங்கு கருத்து. “கொர்பான்” என்ற சொல்லைப் பயன்படுத்தும் மாற்கு 7:11-ஐ ஒப்பிடுக.
    reason: δῶρον என்பதன் மாற்று மொழிபெயர்ப்பையும், இச்சூழலில் அது கடவுளுக்கு ஒதுக்கப்பட்ட காணிக்கையைக் குறிப்பதையும் விளக்குகிறது.
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: ஆனால் நீங்கள் … என்கிறீர்கள்
  rationale: δὲ முன் கூறப்பட்ட இறைக் கட்டளையுடன் முரண்பாட்டைக் குறிக்கிறது; λέγετε பொதுவான நிகழ்காலக் கூற்றாக இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: Ὃς ἂν εἴπῃ
  choice: ஒருவன் … சொன்னால்
  rationale: உறவுப்பெயர், ἄν, இறந்தகாலத் துணைவினை வடிவம் ஆகியவை சேர்ந்து வரையறையற்ற பொதுநிபந்தனையைத் தெரிவிக்கின்றன. தமிழில் ‘ஒருவன் … சொன்னால்’ என்பது அதன் நிபந்தனைத் தன்மையை இயல்பாகக் காக்கிறது.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: தன் தந்தையிடமோ தாயிடமோ
  rationale: வேற்றுமை வடிவம் சொல்லப்படுபவர்களைக் குறிக்கிறது. ‘தன்’ என்பது அந்த நபருடைய பெற்றோர் என்பதைக் தமிழில் தெளிவாக்குகிறது; ἢ-யின் மாற்றுத் தொடர்பு ‘-ஓ … -ஓ’ அமைப்பால் காக்கப்படுகிறது.
- source_word: Δῶρον
  choice: காணிக்கை
  rationale: δῶρον என்பதற்கு ‘பரிசு’ அல்லது ‘காணிக்கை’ என்று பொருள் கொள்ளலாம். இச்சூழலில் கடவுளுக்கு ஒதுக்கப்பட்ட பொருளைக் குறிப்பதால் ‘காணிக்கை’ இயல்பாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது; ஆனால் மாற்கு பயன்படுத்தும் ‘கொர்பான்’ என்ற சொல்லை மத்தேயுவின் உரைக்குள் சேர்க்கவில்லை.
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: என்னிடமிருந்து உங்களுக்கு எந்த உதவி கிடைக்குமோ
  rationale: ἐξ ἐμοῦ என்பது ‘என்னிடமிருந்து’ என்று நேரடியாகக் காக்கப்பட்டுள்ளது. ὠφεληθῇς-ன் பயன்/உதவி பெறுதல் என்ற பொருளையும், ὃ ἐὰν தரும் வரையறையற்ற சாத்தியத்தையும் ‘எந்த உதவி கிடைக்குமோ’ இயல்பாக வெளிப்படுத்துகிறது; நிகழாத பயன் என்ற விளக்கத்தை உரைக்குள் கட்டாயப்படுத்தவில்லை.
theological_decisions:
- issue: மத்தேயுவின் உரையில் இல்லாத ‘கொர்பான்’ என்ற தொழில்நுட்பச் சொல்லைச் சேர்ப்பதா
  choice: மத்தேயு பயன்படுத்தும் δῶρον என்பதைக் ‘காணிக்கை’ என்று மொழிபெயர்த்தல்
  alternative: ‘கொர்பான்’ அல்லது ‘கடவுளுக்கு அர்ப்பணிக்கப்பட்ட காணிக்கை’ என்று முதன்மை உரையிலேயே விரிவுபடுத்துதல்
  rationale: மத்தேயு δῶρον என்ற சொல்லையே பயன்படுத்துகிறார்; மாற்கு 7:11-ல் காணப்படும் κορβᾶν இங்கு இல்லை. ஆகவே கடவுளுக்கு ஒதுக்கப்பட்டதன் சூழலார்ந்த பொருள் அடிக்குறிப்பில் விளக்கப்பட்டு, முதன்மை உரை மத்தேயுவின் சொல்வடிவத்தையே பின்பற்றுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதைமிக்க ஆனால் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பெற்றோரிடம் பேசும் நேரடி கூற்றில் ‘உங்களுக்கு’ என்ற மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் தொடரும் நிபந்தனை வாக்கியத்தின் ஒரு பகுதி என்பதால் முடிவில் தொடர்ச்சியைக் காட்டும் காற்புள்ளி வைக்கப்பட்டுள்ளது.
