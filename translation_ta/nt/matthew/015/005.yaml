revisions:
- from: ஆனால் நீங்கள், ‘ஒருவன் தன் தந்தையிடமோ தாயிடமோ, “என்னிடமிருந்து உங்களுக்கு எந்த உதவி கிடைக்குமோ, அது காணிக்கை[a]” என்று சொன்னால்,’ என்கிறீர்கள்.
  to: ஆனால் நீங்கள், ‘ஒருவன் தன் தந்தையிடமோ தாயிடமோ, “என்னிடமிருந்து உங்களுக்கு உதவியாக இருந்திருக்கும் எதுவும் பரிசு[a]” என்று சொன்னால்,’ என்கிறீர்கள்.
  rationale: The revision keeps the verse’s contrastive and incomplete conditional structure while giving δῶρον its direct lexical equivalent, “பரிசு.” The footnote preserves the contextual sense of a dedicated offering and the Mark 7:11 comparison, without importing “கொர்பான்” into Matthew’s main text. The benefit clause is recast for natural modern Tamil and to retain the contingent, unrealized-benefit nuance without overinterpreting it.
  reviewer_model: gpt-5.6-terra
