    text: அல்லது, “காணிக்கை.” பெற்றோருக்கு உதவப் பயன்படுத்தக்கூடியதை கடவுளுக்கென்று ஒதுக்கப்பட்டதாக அறிவிப்பதே இங்கு கருத்து. “கொர்பான்” என்ற சொல்லைப் பயன்படுத்தும் மாற்கு 7:11-ஐ ஒப்பிடுக.
    reason: δῶρον என்பதன் மாற்று மொழிபெயர்ப்பையும், இச்சூழலில் அது கடவுளுக்கு ஒதுக்கப்பட்ட காணிக்கையைக் குறிப்பதையும் விளக்குகிறது.
  revision_rationale: The revision keeps the verse’s contrastive and incomplete conditional structure while giving δῶρον its direct lexical equivalent, “பரிசு.” The footnote preserves the contextual sense of a dedicated offering and the Mark 7:11 comparison, without importing “கொர்பான்” into Matthew’s main text. The benefit clause is recast for natural modern Tamil and to retain the contingent, unrealized-benefit nuance without overinterpreting it.
