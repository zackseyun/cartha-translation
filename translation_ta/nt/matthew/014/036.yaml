  text: καὶ παρεκάλουν αὐτὸν ἵνα μόνον ἅψωνται τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ· καὶ ὅσοι ἥψαντο διεσώθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/036.yaml
  text: And they begged him that they might only touch the fringe of his garment[b][a], and as many as touched it were healed.
translation:
  language: ta
  text: அவருடைய ஆடையின் விளிம்பை[a] மட்டுமாவது தொட்டுக்கொள்ள அனுமதிக்கும்படி அவரை மன்றாடினார்கள்; அதைத் தொட்ட அனைவரும் குணமடைந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஓரம்’ அல்லது ‘குஞ்சம்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் ஆடையின் ஓரம் அல்லது விளிம்பையும், ஒருவேளை அதிலுள்ள குஞ்சத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘நலமடைந்தார்கள்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்க வினைச்சொல் குணமடைதல், மீட்கப்படுதல் அல்லது காப்பாற்றப்படுதல் என்ற பொருள்களைக் கொண்டிருக்கலாம். இங்கு சூழல் உடல் குணமடைதலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλουν
  choice: மன்றாடினார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வினை தொடர்ச்சியான அல்லது மீண்டும் மீண்டும் செய்யப்பட்ட வேண்டுதலைக் காட்டுகிறது; ‘மன்றாடினார்கள்’ அதன் தீவிரத்தையும் இயல்பான தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: ἵνα μόνον ἅψωνται
  choice: மட்டுமாவது தொட அனுமதிக்கும்படி
  rationale: ἵνα உடன் வரும் வினை அவர்களுடைய வேண்டுகோளின் உள்ளடக்கத்தைத் தெரிவிக்கிறது. μόνον என்பது தொடுதல் ஒன்றே போதும் என்ற வலியுறுத்தலைக் கொண்டதால், ‘மட்டுமாவது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: τοῦ κρασπέδου
  choice: விளிம்பை
  rationale: κράσπεδον என்பது ஆடையின் ஓரம், விளிம்பு அல்லது அதிலுள்ள குஞ்சத்தைக் குறிக்கலாம். ‘விளிம்பு’ குறிப்பிட்ட ஓர் உடை வடிவத்தைத் திணிக்காமல் அடிப்படைப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: அவருடைய ஆடையின்
  rationale: ἱμάτιον பொதுவாக ஓர் ஆடையை, பல வேளைகளில் மேலாடையை, குறிக்கிறது. ‘ஆடை’ மூலத்தின் பொதுத்தன்மையைப் பாதுகாக்கிறது.
- source_word: ὅσοι
  choice: அனைவரும்
  rationale: ὅσοι என்பது ‘எத்தனை பேர் ... செய்தார்களோ, அவர்கள் அனைவரும்’ என்ற அளவு சார்ந்த உறவுப் பொருளைக் கொண்டது. தமிழில் ‘தொட்ட அனைவரும்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: ἥψαντο
  choice: தொட்ட
  rationale: இங்கு ἅπτω என்பதன் இடைநிலை வடிவம் நேரடியாகத் ‘தொடுதல்’ என்பதைக் குறிக்கிறது; அதன் பொருள் முந்தைய தொடரிலிருந்து புரிவதால் ‘அதை’ எனச் சுட்டப்பட்டுள்ளது.
- source_word: διεσώθησαν
  choice: குணமடைந்தார்கள்
  rationale: διασῴζω காப்பாற்றுதல், மீட்டல் அல்லது நலம்பெறச் செய்தல் என்ற விரிந்த பொருளைக் கொண்டிருந்தாலும், இச்சூழல் உடல் நோயிலிருந்து குணமடைதலைக் குறிக்கிறது. ‘குணமடைந்தார்கள்’ அதைப் பொதுவான நவீன தமிழில் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: அற்புதச் சுகமளிப்பு சூழலில் διεσώθησαν என்பதன் பொருள்
  choice: உடல் நோயிலிருந்து ‘குணமடைந்தார்கள்’
  alternative: ‘காப்பாற்றப்பட்டார்கள்’ அல்லது ‘நலமடைந்தார்கள்’
  rationale: வினைச்சொல் விரிந்த மீட்பு அல்லது காப்பாற்றுதலைக் குறிக்கக்கூடும்; ஆனால் உடனடிச் சூழல் நோயாளிகளின் உடல் நலம்பெறுதலைப் பற்றியது. முதன்மை உரை ‘குணமடைந்தார்கள்’ என்று சூழலைத் தெளிவாக்குகிறது; அதேவேளையில் சொல்லின் விரிந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘விளிம்பு’ மற்றும் ‘குணமடைந்தார்கள்’ தெளிவான முதன்மைத் தேர்வுகளாக வைக்கப்பட்டு, மூலமொழியிலுள்ள சொற்பொருள் விரிவு அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
