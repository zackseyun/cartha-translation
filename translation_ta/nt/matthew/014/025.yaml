id: MAT.14.25
reference: Matthew 14:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τετάρτῃ δὲ φυλακῇ τῆς νυκτὸς ⸀ἦλθεν πρὸς ⸀αὐτοὺς περιπατῶν ἐπὶ ⸂τὴν θάλασσαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/025.yaml
  text: And in the fourth watch of the night he came to them[b][a], walking on the sea.
translation:
  language: ta
  text: இரவின் நான்காம் காவல் வேளையில்[b], அவர் கடலின்மேல் நடந்து அவர்களிடம் வந்தார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு வகையில்: ‘கடலின் மீது நடந்து.’ இதை ‘கடலோரமாக நடந்து’ என்று சிலர் புரிந்துகொண்டாலும், சூழல் அவர் நீரின்மேல் நடந்ததையே வலுவாகச் சுட்டுகிறது.'
    reason: alternative_reading
  - marker: b
    text: ‘இரவின் நான்காம் காவல் வேளை’ என்பது இரவின் கடைசிக் காவல் பகுதியைக் குறிக்கிறது; ரோம முறைப்படி இது ஏறத்தாழ அதிகாலை 3 மணி முதல் 6 மணி வரை.
    reason: cultural_note
lexical_decisions:
- source_word: τετάρτῃ ... φυλακῇ τῆς νυκτός
  choice: இரவின் நான்காம் காவல் வேளையில்
  rationale: காலத்தைக் குறிக்கும் வேற்றுமை அமைப்பையும் பழங்கால இரவுக் காவல் பிரிவையும் பாதுகாக்கிறது; நவீன நேரமாக மட்டும் மாற்றாமல் வரலாற்றுச் சொல்லாக்கத்தைத் தக்கவைக்கிறது.
- source_word: δὲ
  choice: தனி இணைப்புச் சொல் இன்றி வாக்கியத் தொடர்ச்சி
  rationale: இங்கு δέ மென்மையான கதைத் தொடர்ச்சி இணைப்பாக உள்ளது. தமிழில் வசனம் இயல்பாகத் தொடர்வதால் கட்டாயமாக ‘அப்போது’ அல்லது ‘ஆனால்’ சேர்ப்பது தேவையற்ற வலியுறுத்தலை உண்டாக்கும்.
- source_word: ἦλθεν πρὸς αὐτούς
  choice: அவர்களிடம் வந்தார்
  rationale: πρός உடன் வரும் இயக்கம் சீடர்களை நோக்கிச் சென்று அவர்களிடம் வருவதை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: περιπατῶν
  choice: நடந்து
  rationale: முதன்மை வினையுடன் ஒரே நேரத்தில் நடைபெறும் செயலைத் தமிழ் வினையெச்சம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐπὶ τὴν θάλασσαν
  choice: கடலின்மேல்
  rationale: θάλασσα என்பதன் சொற்பொருளான ‘கடல்’ என்பதையும், சூழலில் நீர்ப்பரப்பின் மேல் நடந்த இயக்கத்தையும் பாதுகாக்கிறது.
theological_decisions:
- issue: இயேசு நீரின்மேல் நடந்ததாகக் கூறும் அற்புத விளக்கம்
  choice: கடலின்மேல் நடந்து
  alternative: கடலோரமாக நடந்து
  rationale: περιπατῶν ἐπὶ τὴν θάλασσαν என்ற அமைப்பும் உடனடியான சூழலும் நீரின் மேற்பரப்பில் நடந்ததையே வலுவாகக் குறிக்கின்றன. மொழிபெயர்ப்பு அற்புதத் தன்மையைத் தணிக்காமலும் மூலத்தை மீறி விரிவாக்காமலும் அதன் இயல்பான பொருளைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘காவல் வேளை’ என்ற வரலாற்றுச் சொல் வாசிப்புக்கு உதவும் வகையில் அடிக்குறிப்பால் விளக்கப்பட்டுள்ளது; ‘கடல்’ என்பது மூலத்தின் θάλασσα சொல்லை நேரடியாகப் பாதுகாக்கிறது.
