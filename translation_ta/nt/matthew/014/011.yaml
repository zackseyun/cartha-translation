source:
  edition: SBLGNT
  text: καὶ ἠνέχθη ἡ κεφαλὴ αὐτοῦ ἐπὶ πίνακι καὶ ἐδόθη τῷ κορασίῳ, καὶ ἤνεγκεν τῇ μητρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/011.yaml
  text: And his head was brought on a platter and given to the girl[a], and she brought it to her mother.
translation:
  language: ta
  text: அவருடைய தலை ஒரு தட்டில்[a] கொண்டுவரப்பட்டு அந்தச் சிறுமியிடம் கொடுக்கப்பட்டது; அவள் அதைத் தன் தாயிடம் கொண்டுபோனாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பரிமாறும் தட்டில்” அல்லது “தாம்பாளத்தில்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் உணவு பரிமாறப் பயன்படும் தட்டு அல்லது தாம்பாளத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνέχθη
  choice: கொண்டுவரப்பட்டு
  rationale: φέρω என்பதன் இறந்தகாலச் செயலப்பாட்டு வடிவம். இது செயலப்பாட்டுப் பொருளைத் தக்கவைத்து, தமிழ் கதைநடையில் இயல்பாக அடுத்த வினையுடன் இணைகிறது.
- source_word: ἡ κεφαλὴ αὐτοῦ
  choice: அவருடைய தலை
  rationale: கிரேக்கப் பெயர்ச்சொற்றொடரை மறைமுகமாகவோ மென்மைப்படுத்தியோ கூறாமல் நேரடியாக மொழிபெயர்க்கிறது.
- source_word: ἐπὶ πίνακι
  choice: ஒரு தட்டில்
  rationale: πίναξ என்பது உணவு பரிமாறப் பயன்படும் தட்டு அல்லது தாம்பாளத்தைக் குறிக்கிறது. “தட்டு” என்பது நவீனத் தமிழில் தெளிவான, இயல்பான பொதுச் சொல்; குறிப்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐδόθη
  choice: கொடுக்கப்பட்டது
  rationale: δίδωμι என்பதன் இறந்தகாலச் செயலப்பாட்டு வடிவத்தை நேரடியாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
- source_word: τῷ κορασίῳ
  choice: அந்தப் பெண்ணிடம்
  rationale: κοράσιον இளம் பெண்ணைக் குறிக்கிறது. சூழலில் ஏற்கெனவே குறிப்பிடப்பட்ட நபர் என்பதால் “அந்தப் பெண்” இயல்பானது; வயதை தேவையின்றி மிகத் துல்லியமாக நிர்ணயிப்பதைத் தவிர்க்கிறது.
- source_word: ἤνεγκεν
  choice: அவள் அதைத் தன் தாயிடம் கொண்டுபோனாள்
  rationale: செயப்படுபொருள் கிரேக்கத்தில் சூழலால் புரிந்துகொள்ளப்பட்டாலும், தமிழில் தெளிவுக்காக “அதை” சேர்க்கப்பட்டுள்ளது. இலக்கை நோக்கிய இயக்கத்துக்கு “கொண்டுபோனாள்” இயல்பாக அமைகிறது.
- source_word: τῇ μητρὶ αὐτῆς
  choice: தன் தாயிடம்
  rationale: αὐτῆς அந்தப் பெண்ணின் தாயைக் குறிக்கிறது. எழுவாய் அதே பெண் என்பதால் தமிழின் இயல்பான தற்சுட்டு வடிவமான “தன்” உறவைத் தெளிவுபடுத்துகிறது.
