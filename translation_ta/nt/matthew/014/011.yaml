translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இரண்டு செயலப்பாட்டு வினைகளும் பாதுகாக்கப்பட்டுள்ளன; இறுதி வினையில் தமிழுக்கு இயல்பான செயப்பாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறி அது விளக்கும் “தட்டில்” என்ற சொல்லுக்குப் பின் வைக்கப்பட்டுள்ளது.
