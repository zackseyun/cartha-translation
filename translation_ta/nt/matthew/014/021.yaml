base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/021.yaml
  text: Those who ate were about five thousand men[a], besides women and children.
translation:
  language: ta
  text: சாப்பிட்டவர்கள், பெண்களையும் பிள்ளைகளையும் சேர்க்காமல்[a], ஏறக்குறைய ஐயாயிரம் ஆண்கள் இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெண்களையும் பிள்ளைகளையும் தவிர்த்து.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἐσθίοντες
  choice: சாப்பிட்டவர்கள்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்கால வினையெச்சம் உணவில் பங்குகொண்டவர்களைக் குறிக்கிறது. தமிழில் ‘சாப்பிட்டவர்கள்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது; δέ-யின் மென்மையான உரையாடல் இணைப்பைத் தனிச்சொல்லால் மிகைப்படுத்தவில்லை.
- source_word: ἦσαν
  choice: (தமிழ் எண்ணிக்கை வாக்கிய அமைப்பில் மறைமுகமாக வெளிப்படுத்தப்பட்டது)
  rationale: கிரேக்கத்தில் இது இணைப்புவினை. தமிழில் ‘... ஐயாயிரம் ஆண்கள் இருந்தார்கள்’ என்பதைக் காட்டிலும், எண்ணிக்கையை நேரடியாகக் கூறும் பெயர்ச்சொல் வாக்கியம் இயல்பானது.
- source_word: ἄνδρες
  choice: ஆண்கள்
  rationale: ἀνήρ இங்கு பொதுவாக மனிதர்களை அல்ல, பெண்களும் பிள்ளைகளும் தனியே குறிப்பிடப்படுவதால் ஆண் நபர்களையே குறிக்கிறது.
- source_word: ὡσεὶ
  choice: ஏறக்குறைய
  rationale: எண்ணிக்கை தோராயமானது என்பதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: πεντακισχίλιοι
  choice: ஐயாயிரம்
  rationale: மூலத்தின் எண்ணிக்கையை நேரடியாகக் கொடுக்கிறது.
- source_word: χωρὶς
  choice: சேர்க்காமல்
  rationale: பெண்களும் பிள்ளைகளும் கூறப்பட்ட ஐயாயிரம் என்ற எண்ணிக்கையில் கணக்கிடப்படவில்லை என்பதைத் தெளிவாக வெளிப்படுத்துகிறது; ‘தவிர’ என்பதும் சாத்தியம்.
- source_word: γυναικῶν
  choice: பெண்கள்
  rationale: இங்கு திருமண உறவு குறிக்கப்படாததால் γυνή என்பதற்கு ‘மனைவிகள்’ அல்ல, ‘பெண்கள்’ என்பதே பொருத்தமானது.
- source_word: παιδίων
  choice: பிள்ளைகள்
  rationale: παιδίον என்பதன் பன்மையை இயல்பான, கண்ணியமான தமிழில் வழங்குகிறது; வயதைத் தேவையின்றி மேலும் குறுக்கவில்லை.
theological_decisions:
- issue: கலந்திருந்த கூட்டத்தில் பாலினத்தைக் குறிப்பிட்டு எண்ணுதல்
  choice: ἄνδρες என்பதை ‘ஆண்கள்’ என்று மொழிபெயர்த்து, பெண்களும் பிள்ளைகளும் அந்த எண்ணிக்கையில் சேர்க்கப்படவில்லை என்பதைத் தெளிவாக வைத்தல்.
  alternative: ‘மக்கள்’ அல்லது ‘நபர்கள்’
  rationale: கிரேக்கம் ஆண் நபர்களைத் தனிப்படக் கணக்கிட்டு, பெண்களையும் பிள்ளைகளையும் தனியே குறிப்பிடுகிறது. ‘மக்கள்’ என்பது இந்த மூலமொழி வேறுபாட்டை அழித்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை. கிரேக்கச் சொல் வரிசையை இயந்திரமாகப் பின்பற்றாமல், எண்ணிக்கையைச் சொல்லும் இயல்பான தமிழ் அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
