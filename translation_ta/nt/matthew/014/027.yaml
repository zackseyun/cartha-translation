source:
  edition: SBLGNT
  text: ⸀εὐθὺς δὲ ἐλάλησεν ⸂αὐτοῖς ὁ Ἰησοῦς⸃ λέγων· Θαρσεῖτε, ἐγώ εἰμι· μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/027.yaml
  text: But immediately Jesus spoke to them[a], saying, “Take courage; it is I. Do not be afraid.”
translation:
  language: ta
  text: ஆனால் உடனே இயேசு அவர்களிடம், “தைரியமாயிருங்கள்; நான்தான்[a]; பயப்படாதீர்கள்” என்று சொன்னார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சார்ந்து, “நான் இருக்கிறேன்.” இங்கே கிரேக்கச் சொற்றொடர் வெறுமனே தம்மை அடையாளம் காட்டுவதற்குப் பயன்படலாம்; எனினும், சில வாசகர்கள் இதில் தெய்வீக சுய-அடையாளக் கூற்றின் சாத்தியமான எதிரொலியைக் கேட்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθὺς
  choice: உடனே
  rationale: காலத்தைக் குறிக்கும் சொல்லின் வலிமையை இயல்பான நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் சீடர்கள் அடைந்த அச்சத்துக்கும் இயேசுவின் உடனடியான பதிலுக்கும் இடையிலான மென்மையான மாறுபாட்டைக் காட்டுகிறது.
- source_word: ἐλάλησεν αὐτοῖς ὁ Ἰησοῦς λέγων
  choice: 'இயேசு அவர்களிடம் பேசினார்: … என்றார்'
  rationale: யார் பேசினார், யாரிடம் பேசினார் என்பவற்றைத் தெளிவாக வைத்து, கிரேக்க மொழியின் ‘பேசி, சொல்லி’ என்ற மீளுருவை இயல்பான தமிழ் நேர்கூற்றாக அமைக்கிறது.
- source_word: Θαρσεῖτε
  choice: தைரியமாயிருங்கள்
  rationale: பன்மை ஏவலைப் பாதுகாத்து, அஞ்சிய சீடர்கள் துணிவுகொள்ளும்படி அழைக்கும் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: ἐγώ εἰμι
  choice: நான்தான்
  rationale: இச்சூழலில் இயேசு தம்மை அடையாளம் காட்டும் இயல்பான தமிழ்ச் சொல்லாக்கம்; ‘தான்’ அச்சத்தை நீக்கும் அடையாள உறுதியை வெளிப்படுத்துகிறது.
- source_word: μὴ φοβεῖσθε
  choice: பயப்படாதீர்கள்
  rationale: பன்மைத் தடை ஏவலை மரியாதையும் இயல்பும் கொண்ட நவீனத் தமிழில் தருகிறது; ‘பயப்படுவதை நிறுத்துங்கள்’ என்று வினையம்சத்தை மிகையாகக் குறிப்பதில்லை.
theological_decisions:
- issue: ἐγώ εἰμι என்பது எளிய சுய அடையாளப்படுத்தலா அல்லது தெய்வீக ‘நான் இருக்கிறேன்’ என்ற சுயவெளிப்பாட்டின் எதிரொலியா
  choice: முதன்மை உரையில் சூழலுக்கேற்ற ‘நான்தான்’
  alternative: ‘நான் இருக்கிறேன்’ என்ற சொற்சார்ந்த மொழிபெயர்ப்பு
  rationale: உடனடிச் சூழலில் இயேசு அஞ்சிய சீடர்களிடம் தம்மை அடையாளம் காட்டுகிறார். அதேவேளையில், கிரேக்கச் சொற்றொடரின் சொற்சார்ந்த வடிவத்தில் சில வாசகர்கள் கேட்கக்கூடிய தெய்வீக சுயவெளிப்பாட்டின் எதிரொலியை அடிக்குறிப்பு பாதுகாக்கிறது; இதனால் வேதவியல் சாத்தியம் தீர்மானமாகத் திணிக்கப்படுவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயினும் கண்ணியமான விவிலிய நடையைப் பயன்படுத்துகிறது. பன்மை ஏவல்கள் ‘தைரியமாயிருங்கள்’, ‘பயப்படாதீர்கள்’ என்று தெளிவாக வைக்கப்பட்டுள்ளன. கிரேக்கத்தின் உரைநடை மீளுரு தமிழில் இயல்பாகச் சீரமைக்கப்பட்டுள்ளது.
