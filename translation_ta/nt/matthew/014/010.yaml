translation:
  language: ta
  text: அவன் ஆளனுப்பி, சிறையில் யோவானின் தலையை வெட்டினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்குச் சொல் வடிவில்: “ஆளனுப்பி, அவன் சிறையில் யோவானின் தலையை வெட்டினான்.” கிரேக்கத்தில் இறந்தகால வினையெச்சத்தைத் தொடர்ந்து பிரதான வினை வருகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: பின்பு
  rationale: கதைத் தொடரில் வரும் இணைப்பை இயல்பான தமிழில் முன்னேற்றுகிறது; இங்கு நிகழ்வுகளின் தொடர்ச்சியைச் சூழல் தெளிவுபடுத்துகிறது.
- source_word: πέμψας
  choice: ஆளனுப்பி
  rationale: இறந்தகால வினையெச்சம் பிரதான செயலுக்கு முன் ஒருவரை அனுப்பியதைச் சுட்டுகிறது. ‘ஆளனுப்பி’ என்பது ஏரோது தானே சிறைக்குச் சென்றதாகத் தோன்றாமல், செயல் முகவர் வழியாக நடந்ததை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀπεκεφάλισεν
  choice: தலையை வெட்டினான்
  rationale: ἀποκεφαλίζω என்பதன் குறிப்பான பொருள் தலையை வெட்டிக் கொல்வது. கிரேக்கம் செயலை எழுவாய்க்கே இலக்கணரீதியாகக் கூறுவதால், ‘வெட்டும்படி கட்டளையிட்டான்’ என விளக்கமாக மாற்றப்படவில்லை.
- source_word: τὸν Ἰωάννην
  choice: யோவானின்
  rationale: பெயர் மட்டும் மூலத்தில் உள்ளது; உடனடிச் சூழல் இவரை அடையாளப்படுத்துவதால் ‘திருமுழுக்கு யோவான்’ என்று விரிவாக்கப்படவில்லை. தமிழ் சொற்றொடரில் ‘யோவானின் தலையை’ என்பது இயல்பான அமைப்பு.
- source_word: ἐν τῇ φυλακῇ
  choice: சிறையில்
  rationale: φυλακή இங்கு அடைத்து வைக்கும் இடத்தைக் குறிக்கிறது. ‘சிறையில்’ என்பது குறிப்பிட்ட நிகழ்விடத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ஏரோதின் செயல் நேரடியாக நடந்ததா, அனுப்பப்பட்டவர் வழியாக நடந்ததா
  choice: ‘அவன் ஆளனுப்பி ... வெட்டினான்’ என்று கிரேக்க இலக்கண அமைப்பின் பதற்றத்தைத் தக்கவைத்தல்
  alternative: ‘யோவானின் தலையை வெட்டும்படி கட்டளையிட்டான்’
  rationale: வினையெச்சம் முகவர் அனுப்பப்பட்டதை உணர்த்தினாலும், பிரதான வினை செயலை எழுவாய்க்கே உரியதாகக் கூறுகிறது. ஆகவே கட்டளை என்ற விளக்கத்தை மூலவசனத்திற்குள் சேர்க்காமல் இரு அம்சங்களும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் கதைநடைத் தெளிவும் கொண்ட மொழி. ‘சிரச்சேதம் செய்தான்’ போன்ற அரிதான வடமொழிச் சொல்லுக்குப் பதிலாக ordinary readers புரிந்துகொள்ளும் ‘தலையை வெட்டினான்’ பயன்படுத்தப்பட்டது.
