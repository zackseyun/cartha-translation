reference: Matthew 14:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ἦραν τὸ ⸀πτῶμα καὶ ἔθαψαν ⸀αὐτόν, καὶ ἐλθόντες ἀπήγγειλαν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/012.yaml
  text: And his disciples came[a], took the body, and buried him; then they went and reported it to Jesus.
translation:
  language: ta
  text: அவருடைய சீடர்கள் வந்து, உடலை[a] எடுத்து அவரை அடக்கம் செய்தார்கள்; பின்பு இயேசுவிடம் சென்று அவருக்குத் தெரிவித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சடலத்தை.” கிரேக்கச் சொல் இறந்த உடலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: வந்து
  rationale: சீடர்கள் அணுகிவந்து மேற்கொண்ட அடுத்த செயலை இயல்பான தமிழ் நடையில் தெரிவிக்கிறது.
- source_word: μαθηταὶ αὐτοῦ
  choice: அவருடைய சீடர்கள்
  rationale: μαθηταί என்பதன் கற்றல் மற்றும் உறவு சார்ந்த பொருளைப் பேணுகிறது; சூழலில் ‘அவருடைய’ என்பது யோவானைக் குறிக்கிறது.
- source_word: ἦραν
  choice: எடுத்து
  rationale: αἴρω என்பதன் ‘தூக்குதல்/எடுத்தல்’ என்ற அடிப்படைப் பொருளை, கூடுதல் விவரங்களைச் சேர்க்காமல் தருகிறது.
- source_word: πτῶμα
  choice: உடலை
  rationale: இயல்பான, கண்ணியமான தமிழ் கதைநடைக்கு ஏற்றது; இச்சொல் இறந்த உடலைக் குறிக்கிறது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: ἔθαψαν αὐτόν
  choice: அவரை அடக்கம் செய்தார்கள்
  rationale: θάπτω என்பதன் பொருளை நேரடியாகத் தருகிறது; கல்லறையில் வைத்தார்கள் போன்ற மூலத்தில் இல்லாத விவரத்தைச் சேர்க்கவில்லை.
- source_word: ἐλθόντες
  choice: பின்பு ... சென்று
  rationale: அடுத்தடுத்த செயல்களின் வரிசையையும் இயேசுவை நோக்கிய நகர்வையும் இயல்பான தமிழ் வினை அமைப்பில் காட்டுகிறது.
- source_word: ἀπήγγειλαν
  choice: தெரிவித்தார்கள்
  rationale: செய்தியை அறிவித்தல் அல்லது அறிக்கை செய்தல் என்ற பொருளைத் தருகிறது; தெரிவிக்கப்பட்ட செய்தி சூழலிலிருந்து புரிவதால் தனியாகச் செயப்படுபொருள் சேர்க்கப்படவில்லை.
- source_word: τῷ Ἰησοῦ
  choice: இயேசுவிடம் ... அவருக்கு
  rationale: பெயருக்கான நிலையான தமிழ் வடிவத்தைப் பயன்படுத்தி, செய்தி இயேசுவுக்குத் தெரிவிக்கப்பட்டதை இயல்பாகக் கூறுகிறது.
theological_decisions:
- issue: ‘அவருடைய சீடர்கள்’ என்பதில் ‘அவர்’ யாரைக் குறிக்கிறது?
  choice: சூழலில் திருமுழுக்கு யோவானின் சீடர்கள் குறிக்கப்படுகின்றனர்; மொழிபெயர்ப்பில் ‘அவருடைய சீடர்கள்’ என்றே வைக்கப்பட்டுள்ளது.
  alternative: இயேசுவின் சீடர்கள்
  rationale: உடனடி சூழல் திருமுழுக்கு யோவானின் மரணத்தைப் பற்றியது; எனவே αὐτοῦ இயல்பாக யோவானைக் குறிக்கிறது. அதேவேளையில், கிரேக்கத்தின் பிரதிப்பெயர் அமைப்பை மொழிபெயர்ப்பு வெளிப்படையாக மாற்றவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘சடலம்’ என்பதன் வெளிப்படைத்தன்மையை அடிக்குறிப்பில் வைத்துக் கொண்டு, முதன்மை உரையில் இயல்பான ‘உடல்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
