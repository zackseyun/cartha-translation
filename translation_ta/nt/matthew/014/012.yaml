  source_fidelity: 'கிரேக்க மூலத்தின் செயல்வரிசை துல்லியமாகப் பேணப்பட்டுள்ளது: யோவானின் சீடர்கள் வந்தனர், உடலை எடுத்தனர், அவரை அடக்கம் செய்தனர், பின்னர் இயேசுவிடம் சென்று செய்தியைத் தெரிவித்தனர். πτῶμα என்பதற்கான ‘உடல்’ பொருத்தமானது; அடிக்குறிப்பு அதன் ‘சடலம்’ என்ற வெளிப்படையான மாற்றைச் சரியாகக் குறிக்கிறது. ἐλθόντες என்பதிலுள்ள இயேசுவை நோக்கிய நகர்வும் ‘இயேசுவிடம் சென்று’ என்பதில் உள்ளது.'
