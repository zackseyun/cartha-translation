  register: நவீன தரத் தமிழில் எளிமையான, கண்ணியமான உரை. இயேசுவைக் குறிக்கும் மரியாதை ஒருமையும், சீடர்களை நோக்கிய பன்மை/மரியாதை ஏவல் வடிவமும் பயன்படுத்தப்பட்டுள்ளன.
