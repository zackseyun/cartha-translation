base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/018.yaml
  text: But he said[a], “Bring them here to me.”
translation:
  language: ta
  text: ஆனால் அவர், “அவற்றை இங்கே என்னிடம் கொண்டுவாருங்கள்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, முந்தைய வசனத்தில் குறிப்பிடப்பட்ட அப்பங்களையும் மீன்களையும்.
    reason: cross_reference
lexical_decisions:
- source_word: δὲ
  choice: அதற்கு
  rationale: சீடர்கள் முன்வைத்த குறைபாட்டுக்குப் பதிலாக இயேசு பேசுவதை இயல்பான தமிழில் காட்டுகிறது; கிரேக்கத்தின் மென்மையான இணைப்பையும் சூழலிலுள்ள எதிர்நிலையையும் அளவுக்கு மீறாமல் வெளிப்படுத்துகிறது.
- source_word: εἶπεν
  choice: என்றார்
  rationale: λέγω என்பதன் இறந்தகால வடிவை நேரடியாகவும் மரியாதையான தமிழ் நடையிலும் தருகிறது; வினைச்சொல்லில் இல்லாத கட்டளையிடும் நுணுக்கத்தைச் சேர்ப்பதில்லை.
- source_word: Φέρετέ
  choice: கொண்டுவாருங்கள்
  rationale: இரண்டாம் நபர் பன்மை ஏவலை மரியாதை/பன்மை வடிவில் இயல்பாக வெளிப்படுத்துகிறது; பொருட்களைப் பேசுபவரிடம் கொண்டு வருமாறு கூறும் φέρω என்பதன் பொருளைப் பாதுகாக்கிறது.
- source_word: μοι
  choice: என்னிடம்
  rationale: செயலின் திசை இயேசுவை நோக்கியது என்பதை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: ὧδε
  choice: இங்கே
  rationale: இடத்தைக் குறிக்கும் கிரேக்க வினையடையின் நேரடியான, இயல்பான தமிழ் இணை.
- source_word: αὐτούς
  choice: அவற்றை
  rationale: ஆண்பால் பன்மையான கிரேக்கப் பிரதிப்பெயர் முந்தைய வசனத்தில் கூறப்பட்ட அப்பங்களையும் மீன்களையும் சூழல்படி குறிக்கிறது; உயிரற்ற பொருட்களுக்கான இயல்பான தமிழ் பிரதிப்பெயர் பயன்படுத்தப்பட்டுள்ளது.
