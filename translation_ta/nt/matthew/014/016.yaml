language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐ χρείαν ἔχουσιν ἀπελθεῖν· δότε αὐτοῖς ὑμεῖς φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/016.yaml
  text: But Jesus said to them[a], “They have no need to go away; you yourselves give them something to eat.”
translation:
  language: ta
  text: ஆனால் இயேசு அவர்களிடம், “அவர்கள் போக வேண்டியதில்லை; நீங்களே அவர்களுக்கு உணவு கொடுங்கள்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: சீடர்கள் கூறிய தீர்வுக்கு இயேசுவின் பதில் மென்மையான முரண்பாட்டைக் காட்டுவதால் ‘ஆனால்’ இயல்பாகப் பொருந்துகிறது.
- source_word: εἶπεν αὐτοῖς
  choice: அவர்களிடம் ... என்றார்
  rationale: தமிழ் நேர்கூற்று நடைக்கு இயல்பான சொல் வரிசையில், பேசப்பட்டவர்களையும் தெளிவாகக் காட்டுகிறது.
- source_word: Οὐ χρείαν ἔχουσιν ἀπελθεῖν
  choice: அவர்கள் போக வேண்டியதில்லை
  rationale: ‘அவர்களுக்கு போக வேண்டிய தேவை இல்லை’ என்ற கிரேக்க கருத்தை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: δότε αὐτοῖς
  choice: அவர்களுக்கு ... கொடுங்கள்
  rationale: இரண்டாம் நபர் பன்மை கட்டளையை மரியாதை/பன்மை வடிவில் தெளிவாகத் தருகிறது.
- source_word: ὑμεῖς
  choice: நீங்களே
  rationale: கிரேக்கத்தில் வெளிப்படையாக வரும் வலியுறுத்தப்பட்ட சுட்டுப்பெயரின் அழுத்தத்தைப் பாதுகாக்கிறது.
- source_word: φαγεῖν
  choice: உணவு
  rationale: δίδωμι உடன் வரும் ‘சாப்பிட’ என்ற இறந்தகாலமற்ற வினைச்சொல்லின் கருத்தை தமிழில் இயல்பாக ‘உணவு கொடுங்கள்’ என வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இயேசுவின் கட்டளையில் சீடர்களின் பங்குக்கு அளிக்கப்படும் வலியுறுத்தல்
  choice: ὑμεῖς என்பதை ‘நீங்களே’ என்று வலியுறுத்தித் தருதல்
  alternative: ‘நீங்கள்’ என்று மட்டும் தருதல்
  rationale: சீடர்களையே செயற்பட வேண்டியவர்களாக இயேசு நேரடியாகச் சுட்டும் கிரேக்க வலியுறுத்தலைப் பாதுகாக்கிறது; அதற்கு மேல் இறையியல் விளக்கம் எதையும் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகப் புரியும் dignified நேர்கூற்று நடை. ‘உணவு கொடுங்கள்’ என்பது ‘சாப்பிட ஏதாவது கொடுங்கள்’ என்பதைக் காட்டிலும் சுருக்கமாகவும் இயல்பாகவும் உள்ளது; மூலத்தின் பொருள் மாற்றப்படவில்லை.
