id: MAT.14.14
reference: Matthew 14:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ⸀ἐξελθὼν εἶδεν πολὺν ὄχλον, καὶ ἐσπλαγχνίσθη ἐπ’ αὐτοῖς καὶ ἐθεράπευσεν τοὺς ἀρρώστους αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/014.yaml
  text: And when he went ashore[a], he saw a large crowd[b], and he had compassion on them and healed their sick.
translation:
  language: ta
  text: அவர் கரைக்கு வந்தபோது[a], திரளான மக்கள் கூட்டத்தைக் கண்டார்; அவர்கள்மேல் மனமிரங்கி[b], அவர்களிடையே நோயுற்றிருந்தவர்களைக் குணமாக்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்பொருளாக, ‘வெளியே வந்தபோது.’ இச்சூழலில் இது படகிலிருந்து இறங்கிக் கரைக்கு வந்ததைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர்களுக்காக ஆழ்ந்த இரக்கம் கொண்டு.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: கரைக்கு வந்தபோது
  rationale: இந்த இறந்தகாலப் பங்கேற்புவினை வடிவம் சொற்பொருளில் ‘வெளியே வந்து’ எனப் பொருள்படும். இயேசு படகில் வந்ததாகக் கூறும் உடனடிச் சூழலில், அவர் கரைக்கு வந்ததைக் குறிக்கும் இயல்பான தமிழாக்கம் இது; சொற்பொருள் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: εἶδεν
  choice: கண்டார்
  rationale: ὁράω என்பதன் எளிய இறந்தகாலப் பொருளை இயல்பாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: πολὺν ὄχλον
  choice: திரளான மக்கள் கூட்டம்
  rationale: πολύς என்பதன் அளவுப் பொருளையும் ὄχλος என்பதன் ‘கூட்டம்’ என்ற பொருளையும் நவீனத் தமிழில் தெளிவாகக் காக்கிறது.
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτοῖς
  choice: அவர்கள்மேல் மனமிரங்கி
  rationale: σπλαγχνίζομαι குறிக்கும் ஆழ்ந்த இரக்கத்தை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது; வெறும் பரிதாபம் என்ற பலவீனமான பொருளைத் தவிர்க்கிறது.
- source_word: ἐθεράπευσεν
  choice: குணமாக்கினார்
  rationale: இந்தச் சூழலில் θεραπεύω உடல்நலக் குறைவிலிருந்து குணப்படுத்துவதைக் குறிக்கிறது.
- source_word: τοὺς ἀρρώστους αὐτῶν
  choice: அவர்களிடையே நோயுற்றிருந்தவர்கள்
  rationale: சொல்லுருபாகப் பயன்படுத்தப்பட்ட ἄρρωστος என்பதையும் αὐτῶν என்பதன் கூட்டத்துடனான உறவையும் தெளிவான தமிழில் தெரிவிக்கிறது; ‘அவர்களுடைய நோயாளிகள்’ என்ற இயல்பற்ற அல்லது உடைமைப் பொருள் தரக்கூடிய நடையைத் தவிர்க்கிறது.
theological_decisions:
- issue: இயேசுவின் உணர்வுப்பூர்வமான பதிலை மொழிபெயர்த்தல்
  choice: அவர்கள்மேல் மனமிரங்கி
  alternative: அவர்களுக்காக ஆழ்ந்த இரக்கம் கொண்டு
  rationale: இயேசுவின் ஆழ்ந்த இரக்கத்தையும் அதனைத் தொடர்ந்து வரும் குணமாக்கும் செயலுடனான தொடர்பையும் காக்கிறது; மூலத்தில் இல்லாத இறையியல் விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சியான கிரேக்க இணைப்புகள் தமிழின் இயல்புக்கேற்ப அரைப்புள்ளி மற்றும் வினையெச்சத் தொடரால் அமைக்கப்பட்டுள்ளன.
