  terminology: ‘சீடர்கள்,’ ‘கடலின்மேல்,’ ‘பேய்,’ and ‘கூக்குரலிட்டார்கள்’ are appropriate choices. ‘பேய்’ clearly conveys the disciples’ frightened perception rather than making a doctrinal assertion, while the footnote responsibly preserves ‘apparition/phantom’ alternatives. The note anchor is correctly attached to the term it explains.
