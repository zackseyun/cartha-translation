  source_fidelity: 'The translation accurately represents the Greek sequence and sense: the disciples see him walking on the sea, become greatly frightened, identify what they see as a φάντασμα, and cry out because of fear. ‘கடலின்மேல்’ appropriately conveys ἐπὶ τῆς θαλάσσης, and ‘பயத்தினால்’ preserves the causal force of ἀπὸ τοῦ φόβου.'
