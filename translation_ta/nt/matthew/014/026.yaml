id: MAT.14.26
reference: Matthew 14:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂οἱ δὲ μαθηταὶ ἰδόντες αὐτὸν⸃ ἐπὶ ⸂τῆς θαλάσσης⸃ περιπατοῦντα ἐταράχθησαν λέγοντες ὅτι Φάντασμά ἐστιν, καὶ ἀπὸ τοῦ φόβου ἔκραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/026.yaml
  text: But when the disciples saw him walking on the sea[a], they were terrified, saying, “It is a ghost!” And they cried out from fear.
translation:
  language: ta
  text: ஆனால் சீடர்கள் அவர் கடலின்மேல் நடப்பதைக் கண்டபோது மிகவும் அச்சமடைந்து, “அது ஒரு பேய்![a]” என்றார்கள். பயத்தினால் அவர்கள் கூக்குரலிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “ஆவி உருவம்,” அல்லது “மாயத் தோற்றம்.”
    reason: φάντασμα என்பதற்கு பேய் மட்டுமல்லாமல் கண்முன் தோன்றும் ஆவி உருவம் அல்லது மாயத் தோற்றம் என்ற பொருள்களும் இருக்கலாம்.
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய நிகழ்விலிருந்து சீடர்களின் திடீர் அச்சமான எதிர்வினைக்குச் செல்லும் மென்மையான முரண்பாட்டை இயல்பாகக் காட்டுகிறது.
- source_word: μαθηταὶ
  choice: சீடர்கள்
  rationale: கிரேக்க வரையறைச் சுட்டு, சூழலில் ஏற்கெனவே அறியப்பட்ட இயேசுவின் சீடர்களைக் குறிக்கிறது; தமிழில் தனியாக ‘சீடர்கள்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἰδόντες αὐτὸν
  choice: அவர் ... நடப்பதைக் கண்டபோது
  rationale: இறந்தகாலப் பங்கேற்பு வடிவத்தின் காலத் தொடர்பை இயல்பான தமிழ் காலத் துணைவாக்கியமாக வெளிப்படுத்துகிறது.
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: கடலின்மேல் நடப்பதை
  rationale: ἐπί உடன் வரும் இத்தொடர் கடலின் மேற்பரப்பின்மீது நடந்ததைக் குறிக்கிறது; ‘கடலின்மேல்’ மூலச் சொல்லான θάλασσα-வையும் நிகழ்வையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἐταράχθησαν
  choice: மிகவும் அச்சமடைந்து
  rationale: ταράσσω என்பது கலக்கம் அல்லது மனஅதிர்ச்சியைக் குறிக்கும்; அச்சத்தால் கூக்குரலிட்ட சூழலில் அதன் தீவிரத்தை ‘மிகவும் அச்சமடைந்து’ தெளிவாக எடுத்துரைக்கிறது.
- source_word: λέγοντες
  choice: என்றார்கள்
  rationale: சீடர்களின் கூற்றை இயல்பான நவீன தமிழில் நேரடி உரையாக அறிமுகப்படுத்துகிறது.
- source_word: Φάντασμά ἐστιν
  choice: அது ஒரு பேய்!
  rationale: φάντασμα என்பது தோற்றமளிக்கும் ஆவி உருவம் அல்லது பேய்த்தோற்றத்தைக் குறிக்கலாம்; ‘பேய்’ என்பது சீடர்களின் அச்சமான தவறான முடிவை சாதாரண வாசகருக்குத் தெளிவாகக் கூறுகிறது.
- source_word: ἀπὸ τοῦ φόβου
  choice: பயத்தினால்
  rationale: ἀπό இங்கு காரணத்தை அல்லது மூலத்தைத் தெரிவிக்கிறது; ‘பயத்தினால்’ தமிழில் தெளிவான காரணத் தொடர்பைத் தருகிறது.
- source_word: ἔκραξαν
  choice: கூக்குரலிட்டார்கள்
  rationale: κράζω உரத்த குரலில் கத்துவதைக் குறிக்கிறது; ‘கூக்குரலிட்டார்கள்’ அச்சத்தால் எழுந்த உரத்த குரலைத் தொனியை மிகையாகக் குறிப்பாக்காமல் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: φάντασμα என்பதன் இயல்பும் சீடர்களின் கூற்றும்
  choice: முதன்மை உரையில் ‘பேய்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஆவி உருவம்’ அல்லது ‘மாயத் தோற்றம்’
  rationale: இது சீடர்கள் அச்சத்தில் கொண்ட எண்ணத்தைப் பதிவு செய்கிறது; ஆவிகளின் இயல்பு குறித்த வசனத்தின் சொந்தக் கூற்றல்ல. ‘பேய்’ அவர்களின் முடிவை எளிதில் புரியவைக்கிறது; அடிக்குறிப்பு மூலச்சொல்லின் பரந்த பொருள் வாய்ப்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. தமிழில் இயல்பான வாக்கிய ஓட்டத்திற்காக பங்கேற்பு வடிவங்கள் கால மற்றும் இணை வாக்கியங்களாக மாற்றப்பட்டுள்ளன. அடிக்குறிப்பு குறி அது விளக்கும் ‘பேய்’ என்பதற்குப் பின்னரே வைக்கப்பட்டுள்ளது.
