  yaml_path: translation/nt/matthew/014/005.yaml
  text: And wanting to kill him[a], he feared the crowd[b], because they regarded him as a prophet.
translation:
  language: ta
  text: அவனைக் கொல்ல விரும்பியபோதிலும்[a], மக்கள் கூட்டத்துக்குப் பயந்தான்; ஏனெனில் அவர்கள் அவனை ஒரு தீர்க்கதரிசியாகக் கருதினார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் நேரடியாக: “அவனைக் கொல்ல விரும்பி, மக்கள் கூட்டத்துக்குப் பயந்தான்.” சூழலின் அடிப்படையில் இங்குள்ள பங்கேற்புவினை விட்டுக்கொடுப்புப் பொருளில் வழங்கப்பட்டுள்ளது: “கொல்ல விரும்பியபோதிலும்.”'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவனை ஒரு தீர்க்கதரிசி என்று எண்ணினார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλων
  choice: விரும்பியிருந்தும்
  rationale: இச்சொல் நேரடியாக ‘விரும்பி’ எனப் பொருள்படும் பங்கேற்புவினை. ஆனால், அவனுடைய விருப்பத்துக்கும் மக்கள் கூட்டத்தைக் குறித்த பயத்துக்கும் இடையிலுள்ள எதிர்மறை உறவை இயல்பான தமிழில் வெளிப்படுத்த ‘விரும்பியிருந்தும்’ என மொழிபெயர்க்கப்பட்டது; நேரடியான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀποκτεῖναι
  choice: கொல்ல
  rationale: மூலச்சொல்லின் நேரடியான பொருள் ‘கொல்லுதல்’ அல்லது ‘சாகடித்தல்.’ ‘கொலைசெய்ய’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத சட்ட அல்லது அறநெறித் தீர்ப்பைச் சேர்க்கக்கூடும்.
- source_word: ἐφοβήθη
  choice: பயந்தான்
  rationale: φοβέομαι என்பதன் இறந்தகால வடிவம்; இங்கு மக்கள் கூட்டத்தைக் குறித்து அவன் கொண்ட பயத்தை இயல்பான நவீன தமிழில் நேரடியாகக் குறிக்கிறது.
- source_word: τὸν ὄχλον
  choice: மக்கள் கூட்டத்துக்கு
  rationale: ὄχλος என்பது இச்சூழலில் கூடியிருந்த பெருந்திரளான மக்களைக் குறிக்கிறது. ‘மக்கள் கூட்டம்’ தெளிவான, பொதுவாகப் புரியும் தமிழ் வழக்கு.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: அவன் மக்கள் கூட்டத்துக்குப் பயந்ததற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: ὡς προφήτην
  choice: ஓர் இறைவாக்கினராக
  rationale: மக்கள் அவனை எவ்வாறு மதிப்பிட்டார்கள் என்பதை ὡς உடன் வரும் பெயர்ச்சொல் தெரிவிக்கிறது. ‘இறைவாக்கினர்’ என்பது προφήτης என்பதன் பணியைத் தெளிவாகவும் நவீன தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: αὐτὸν εἶχον
  choice: அவனைக் ... கருதினார்கள்
  rationale: ἔχω உடன் வரும் இவ்வமைப்பு ‘ஒருவரை ஒரு நிலையில் இருப்பவராகக் கருதுதல்’ என்ற மரபுத்தொடர்ப் பொருளைக் கொண்டது. ‘கருதினார்கள்’ என்பது அதற்கான இயல்பான தமிழ் இணை.
theological_decisions:
- issue: கிரேக்க உரையில் சூழலால் அறியப்படும் எழுவாயும் செயப்படுபொருளும் பெயர்களால் குறிப்பிடப்படாமல் இருப்பது
  choice: வசனத்தில் பெயர்களைச் சேர்க்காமல் ‘அவன்,’ ‘அவனை,’ ‘அவர்கள்’ என்ற பதிலிடுபெயர்களையே வைத்திருத்தல்
  alternative: ‘ஏரோது யோவானைக் கொல்ல விரும்பியிருந்தும்...’ என்று பெயர்களை வெளிப்படையாகச் சேர்த்தல்
  rationale: உடனடி சூழல் ஏரோதையும் யோவானையும் அடையாளப்படுத்துகிறது; ஆனால் இவ்வசனத்தின் கிரேக்க உரை பதிலிடுபெயர்களையே பயன்படுத்துகிறது. அவற்றைத் தக்கவைப்பது மூலத்தின் வடிவத்தையும் சூழல் சார்பையும் பாதுகாக்கிறது.
- issue: θέλων என்ற பங்கேற்புவினையின் தர்க்க உறவு
  choice: சூழலுக்கேற்ற எதிர்மறை உறவாக ‘விரும்பியிருந்தும்’ என வழங்குதல்
  alternative: வடிவத்துக்கு மிக நெருக்கமாக ‘கொல்ல விரும்பி’ அல்லது ‘கொல்ல விரும்பியவனாய்’ என வழங்குதல்
  rationale: பங்கேற்புவினை தனியாக எதிர்மறை இணைப்பை வெளிப்படையாகக் குறிக்காவிட்டாலும், கொல்லும் விருப்பம் மக்கள் கூட்டத்தைக் குறித்த பயத்தால் நிறைவேறவில்லை என்பதே சூழலின் கருத்தோட்டம். அதேவேளையில், மூலத்தின் சாத்தியமான நேரடி அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம வர்ணனைக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘தீர்க்கதரிசி’ என்பதற்குப் பதிலாக மூலச் சொல்லின் அறிவிப்புப் பணியைத் தெளிவாக்கும் ‘இறைவாக்கினர்’ பயன்படுத்தப்பட்டது. கிரேக்க உரையின் பதிலிடுபெயர்கள் பெயர்களால் விரிவாக்கப்படவில்லை.
