- from: அவனைக் கொல்ல விரும்பியிருந்தும்[a], மக்கள் கூட்டத்துக்குப் பயந்தான்; ஏனெனில் அவர்கள் அவனை ஓர் இறைவாக்கினராகக் கருதினார்கள்[b].
