id: MAT.14.24
reference: Matthew 14:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τὸ δὲ πλοῖον ἤδη ⸂σταδίους πολλοὺς ἀπὸ τῆς γῆς ἀπεῖχεν⸃, βασανιζόμενον ὑπὸ τῶν κυμάτων, ἦν γὰρ ἐναντίος ὁ ἄνεμος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/024.yaml
  text: But the boat was already many stadia from the land[a], being battered by the waves[c][b], for the wind was against it.
translation:
  language: ta
  text: ஆனால் படகு ஏற்கெனவே நிலத்திலிருந்து[a] பல ஸ்தாதியங்கள்[b] தொலைவில் இருந்தது. காற்று எதிராக வீசியதால், அலைகள் அதைத் தாக்கி அலைக்கழித்துக்கொண்டிருந்தன[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கரையிலிருந்து.” கிரேக்க மூலத்தில் “நிலத்திலிருந்து” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ஸ்தாதியோன் என்பது பண்டைய தொலைவு அலகு; ஒரு ஸ்தாதியோன் சுமார் 185 மீட்டர்.
    reason: cultural_note
  - marker: c
    text: அல்லது, “அலைகளால் கடுமையாக மோதப்பட்டுக்கொண்டிருந்தது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλοῖον
  choice: படகு
  rationale: கலிலேயக் கடலைக் கடக்கும் இச்சூழலில், கப்பல் என்பதைவிட படகு என்பது அளவையும் நிகழ்விடத்தையும் இயல்பாகக் காட்டுகிறது.
- source_word: ἤδη
  choice: ஏற்கெனவே
  rationale: கதை இந்தக் கட்டத்தை எட்டுவதற்குள் நிலைமை உருவாகியிருந்ததை நேரடியாகக் குறிக்கிறது.
- source_word: σταδίους πολλούς
  choice: பல ஸ்தாதியங்கள்
  rationale: மூலத்தில் உள்ள பண்டைய தொலைவு அலகை பொதுவான தொலைவு என மாற்றாமல் வெளிப்படையாகத் தக்கவைக்கிறது; அதன் அளவு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ἀπὸ τῆς γῆς
  choice: நிலத்திலிருந்து
  rationale: γῆ என்பதன் அடிப்படைப் பொருளான நிலம் என்பதையும், இங்கு நீருக்கு எதிரான நிலப்பகுதியைக் குறிப்பதையும் காக்கிறது; இயல்பான சூழற்பொருளான கரையிலிருந்து என்பது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀπεῖχεν
  choice: தொலைவில் இருந்தது
  rationale: இடைவெளியைக் குறிக்கும் கிரேக்க வினையைத் தமிழில் இயல்பான இடவியல் தொடராக வழங்குகிறது.
- source_word: βασανιζόμενον ὑπὸ τῶν κυμάτων
  choice: அலைகள் அதைத் தாக்கி அலைக்கழித்துக்கொண்டிருந்தன
  rationale: βασανίζω இங்கு படகு அலைகளால் கடுமையாகத் தாக்கப்படும் இயற்பியல் நிலையைச் சுட்டுகிறது. தமிழ் நடையில் செயப்பாட்டு அமைப்பை விட இவ்வமைப்பு உயிரோட்டமாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἐναντίος
  choice: எதிராக
  rationale: காற்று படகின் முன்னேற்றத்துக்கு எதிராக இருந்ததைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: இயேசு நிலத்தில் இருப்பதிலிருந்து படகின் கடின நிலைக்குச் செல்லும் மிதமான கதை மாற்றத்தையும் முரணையும் குறிக்கிறது.
- source_word: γάρ
  choice: வீசியதால்
  rationale: γάρ தரும் காரண விளக்கத்தைத் தமிழில் இயல்பான காரண வினையெச்சத் தொடரால் வெளிப்படுத்துகிறது.
