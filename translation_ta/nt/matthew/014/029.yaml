id: MAT.14.29
reference: Matthew 14:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ἐλθέ. καὶ καταβὰς ἀπὸ τοῦ ⸀πλοίου Πέτρος περιεπάτησεν ἐπὶ τὰ ὕδατα ⸂καὶ ἦλθεν⸃ πρὸς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/029.yaml
  text: And he said[a], “Come.” So Peter got down from the boat, walked on the water, and came toward Jesus.
translation:
  language: ta
  text: அவர், “வா” என்றார். அப்போது பேதுரு படகிலிருந்து இறங்கி, தண்ணீரின்மேல் நடந்து இயேசுவை நோக்கிச் சென்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλθέ
  choice: வா
  rationale: ἔρχομαι என்பதன் நேரடியான ஒருமை ஏவல் வடிவம். கூடுதல் சொற்களைச் சேர்க்காமல் அழைப்பின் சுருக்கத்தையும் வலிமையையும் இயல்பான தமிழில் தருகிறது.
- source_word: καταβὰς ἀπὸ τοῦ πλοίου
  choice: படகிலிருந்து இறங்கி
  rationale: καταβὰς கீழிறங்கிய செயலைக் குறிக்கிறது; தொடரும் வினைகளுடன் செயல் வரிசையை இயல்பாக வெளிப்படுத்த தமிழில் வினையெச்ச வடிவம் பொருத்தமானது.
- source_word: πλοίου
  choice: படகு
  rationale: கலிலேயக் கடல் நிகழ்வின் சூழலில் πλοῖον என்பதற்கான இயல்பான நவீனத் தமிழ் சொல்.
- source_word: περιεπάτησεν
  choice: நடந்து
  rationale: இச்சூழலில் περιπατέω நேரடியாக நடப்பதைக் குறிக்கிறது; ‘நடக்கத் தொடங்கி’ போன்ற மூலத்தில் வெளிப்படையாக இல்லாத நுணுக்கத்தைச் சேர்க்கவில்லை.
- source_word: ἐπὶ τὰ ὕδατα
  choice: தண்ணீரின்மேல்
  rationale: ἐπί உடன் வரும் இத்தொடர் தண்ணீரின் மேற்பரப்பில் நடந்த இயக்கத்தைச் சுட்டுகிறது. ‘தண்ணீர்’ என்பது பொதுவாசகருக்கு இயல்பான ஒருமைத் திரள்பெயர்.
- source_word: καὶ ἦλθεν πρὸς τὸν Ἰησοῦν
  choice: இயேசுவை நோக்கிச் சென்றார்
  rationale: πρός இயேசுவின் திசையை நோக்கிய இயக்கத்தைத் தெரிவிக்கிறது; அவர் இயேசுவிடம் சென்று சேர்ந்துவிட்டார் என்று தேவையின்றி உறுதிப்படுத்தாமல் திசை நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: δὲ
  choice: அப்போது
  rationale: δέ இங்கு மென்மையான கதைத் தொடர்ச்சியை அமைக்கிறது; தமிழில் ‘அப்போது’ நிகழ்வின் அடுத்த கட்டத்தை இயல்பாக இணைக்கிறது, எதிர்மறை முரண்பாட்டை மிகைப்படுத்தாது.
theological_decisions:
- issue: பேதுரு இயேசுவை நோக்கி நகர்ந்ததன் முடிவுநிலை
  choice: இயேசுவை நோக்கிச் சென்றார்
  alternative: இயேசுவிடம் சென்றார்
  rationale: πρός திசையைத் தெளிவாகக் குறிக்கிறது; இவ்வாக்கியத்திலேயே சென்று சேர்ந்தார் என முடிவுசெய்யாமல் கதையின் பதற்றத்தையும் மூலத்தின் நுணுக்கத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையான, கண்ணியமான கதைநடை. ‘தண்ணீரின்மேல்’ பொதுவாசகருக்கு இயல்பாகவும் அதிசயச் செயலின் பொருளைத் தெளிவாகவும் தருகிறது.
