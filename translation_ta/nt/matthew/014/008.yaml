source:
  edition: SBLGNT
  text: ἡ δὲ προβιβασθεῖσα ὑπὸ τῆς μητρὸς αὐτῆς· Δός μοι, φησίν, ὧδε ἐπὶ πίνακι τὴν κεφαλὴν Ἰωάννου τοῦ βαπτιστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/008.yaml
  text: And she, having been prompted by her mother, says, “Give me here on a platter the head of John the Baptizer.”
translation:
  language: ta
  text: அவளோ, தன் தாயால் தூண்டப்பட்டு, “திருமுழுக்கு அளிப்பவரான யோவானின்[a] தலையை இங்கே ஒரு தட்டில் எனக்குக் கொடுங்கள்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பாரம்பரியமாக, “திருமுழுக்கு யோவான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προβιβασθεῖσα
  choice: தூண்டப்பட்டு
  rationale: தாய் முன்கூட்டியே அவள்மீது செலுத்திய தாக்கத்தையும் கிரேக்கச் சொல்லின் செயப்பாட்டு வடிவத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; முறையான அறிவுறுத்தல் என்று அளவுக்கு மீறிக் குறிப்பிடவில்லை.
- source_word: ὑπὸ τῆς μητρὸς αὐτῆς
  choice: தன் தாயால்
  rationale: செயப்பாட்டு வினையுடன் வரும் ὑπό + பிறப்புவேற்றுமை செயலைத் தூண்டிய நபரைக் குறிக்கிறது; ‘தன்’ என்பது அந்தப் பெண்ணின் தாயையே தெளிவாகச் சுட்டுகிறது.
- source_word: Δός μοι
  choice: எனக்குக் கொடுங்கள்
  rationale: நேரடியான கட்டளையை இயல்பான மரியாதைப் பன்மைத் தமிழில் தருகிறது; அரசனிடம் கூறப்படும் வேண்டுகோளின் சமூகச் சூழலுக்கும் பொருந்துகிறது.
- source_word: φησίν
  choice: என்றாள்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தைத் தமிழ்க் கதைநடையில் இயல்பான இறந்தகாலமாக வழங்குகிறது; பேசியவர் பெண் என்பதையும் தெளிவாக்குகிறது.
- source_word: ὧδε
  choice: இங்கே
  rationale: இடத்தையும் உடனடி கோரிக்கையின் தீவிரத்தையும் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: ἐπὶ πίνακι
  choice: ஒரு தட்டில் வைத்து
  rationale: விருந்துச் சூழலில் πίναξ உணவு பரிமாறும் தட்டைக் குறிக்கிறது. ‘வைத்து’ என்பது தமிழில் கோரிக்கையின் பொருளை இயல்பாக வெளிப்படுத்துகிறது; மூலத்தின் ἐπί குறிக்கும் ‘தட்டின்மேல்’ என்ற உறவு காக்கப்படுகிறது.
- source_word: τὴν κεφαλὴν
  choice: தலையை
  rationale: மூலத்தின் கொடூரமான நேரடித்தன்மையை மென்மைப்படுத்தாமல் அப்படியே தருகிறது.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: திருமுழுக்குக் கொடுக்கும் யோவான்
  rationale: βαπτιστής என்பது யோவானின் செயலை விவரிக்கும் பட்டப்பெயர். ‘திருமுழுக்குக் கொடுக்கும்’ என்பது அதன் செயற்பொருளைத் தெளிவாகக் காட்டுகிறது; பழக்கமான பாரம்பரிய வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: βαπτιστής என்ற யோவானின் பட்டப்பெயரை மொழிபெயர்த்தல்
  choice: திருமுழுக்குக் கொடுக்கும் யோவான்
  alternative: திருமுழுக்கு யோவான்
  rationale: கிரேக்க முகவர் பெயர்ச்சொல்லின் செயற்பொருளை முதன்மை உரை வெளிப்படையாகப் பாதுகாக்கிறது. தமிழில் பழக்கமான, பெயர்போல் நிலைபெற்ற பாரம்பரிய வடிவம் வாசகர் அறிமுகத்திற்காக அடிக்குறிப்பில் வைக்கப்படுகிறது; எந்தச் சபைப்பிரிவு சார்ந்த திருமுழுக்குக் கோட்பாடும் இதில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. அரசனிடம் பேசுவதால் ‘கொடுங்கள்’ என்ற மரியாதைப் பன்மை இயல்பாகத் தேர்ந்தெடுக்கப்பட்டது. வாக்கியத்தின் அதிர்ச்சியூட்டும் நேரடித்தன்மை மென்மைப்படுத்தப்படவில்லை.
