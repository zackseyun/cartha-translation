id: MAT.14.33
reference: Matthew 14:33
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἱ δὲ ἐν τῷ ⸀πλοίῳ προσεκύνησαν αὐτῷ λέγοντες· Ἀληθῶς θεοῦ υἱὸς εἶ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/033.yaml
  text: Then those in the boat worshiped him[a], saying[b], “Truly you are the Son of God.”
translation:
  language: ta
  text: அப்போது படகில் இருந்தவர்கள் அவரை வழிபட்டு, “நீர் உண்மையாகவே தேவனுடைய மகன்” என்று கூறினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: அப்போது ... இருந்தவர்கள்
  rationale: δέ இங்கு வலுவான எதிர்மறையை அல்ல, கதைத் தொடர்ச்சியைச் சுட்டும் மென்மையான இணைப்புச்சொல்; தமிழில் இயல்பான நிகழ்வுத் தொடர்ச்சிக்காக ‘அப்போது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐν τῷ πλοίῳ
  choice: படகில்
  rationale: πλοῖον என்பதன் இயல்பான நவீனத் தமிழ் இணை ‘படகு’; ἐν இடத்தைக் குறிப்பதால் ‘படகில்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: προσεκύνησαν αὐτῷ
  choice: அவரை வழிபட்டு
  rationale: προσκυνέω பணிந்து வணங்குதல், மரியாதை செலுத்துதல், வழிபடுதல் ஆகிய பொருள்களைக் கொள்ளலாம். கடலின்மேல் இயேசு வெளிப்படுத்திய அதிகாரத்திற்குப் பின்வரும் இந்தச் சூழலும் அடுத்துள்ள அறிக்கையும் ‘வழிபட்டு’ என்பதற்கு ஆதரவளிக்கின்றன; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: λέγοντες
  choice: என்றார்கள்
  rationale: கிரேக்கப் பங்கேற்புவினையைத் தமிழில் இயல்பான நேரடி உரை முடிவாக மாற்றுவது கருத்தையும் நிகழ்வையும் தெளிவாகக் காக்கிறது.
- source_word: Ἀληθῶς
  choice: உண்மையாகவே
  rationale: இது உறுதியான, வலியுறுத்தப்பட்ட ஒப்புதலைக் குறிக்கிறது; ‘உண்மையாகவே’ நவீனத் தமிழில் அந்த வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: θεοῦ υἱὸς
  choice: தேவனுடைய மகன்
  rationale: கிரேக்கத்தில் θεοῦ-க்கு உருபு இல்லாவிட்டாலும், இச்சூழலில் சொற்றொடர் வெறும் ‘ஒரு தெய்வத்தின் மகன்’ என்று அல்லாமல் அடையாளப்படுத்தும் பட்டப்பெயர்போலச் செயல்படுகிறது. தமிழில் உடைமைத் தொடர் இயல்பாகவே வரையறுக்கப்பட்ட பொருளைக் கொடுக்கிறது.
- source_word: εἶ
  choice: நீர் ... மகன்
  rationale: தமிழில் நிகழ்கால இணைப்புவினை பொதுவாக வெளிப்படையாகச் சொல்லப்படாது. மரியாதையுடனான ஒருமை இரண்டாம் நபராக ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: இயேசுவை நோக்கிய προσκυνέω என்பதன் வலிமை
  choice: ‘அவரை வழிபட்டு’
  alternative: ‘அவர்முன் பணிந்து’ / ‘அவருக்கு வணக்கம் செலுத்தி’
  rationale: சொல் உடல் தாழ்த்திப் பணிவதையும் மரியாதை செலுத்துவதையும் குறிக்கக்கூடும். ஆனால் இங்கு இயேசுவின் கடல்மீதான அதிகாரமும் தொடர்ந்து வரும் ‘தேவனுடைய மகன்’ என்ற அறிக்கையும் ‘வழிபட்டு’ என்பதை முதன்மை மொழிபெயர்ப்பாக ஆதரிக்கின்றன; சொல்லின் உண்மையான பொருள் விரிவை அடிக்குறிப்பு மறைக்கவில்லை.
- issue: θεοῦ υἱὸς என்பதன் வரையறுத்த தன்மை
  choice: ‘தேவனுடைய மகன்’
  alternative: ‘ஒரு தேவமகன்’ / ‘தேவனின் மகன்’
  rationale: கிரேக்கத்தில் உருபின்மை மட்டும் இந்தச் சொற்றொடரை வரையறையற்றதாக ஆக்குவதில்லை. மத்தேயுவின் இவ்வறிக்கைச் சூழலில் இது ஓர் அடையாளப் பட்டமாகச் செயல்படுகிறது; எனவே ‘தேவனுடைய மகன்’ என்பது பொருத்தமானது. ‘தேவனின் மகன்’ என்பதும் தமிழில் சாத்தியமான சமமான வடிவம்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இயேசுவை நோக்கிய நேரடி உரையில் மரியாதை ஒருமையான ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது. ‘தேவன்’ என்பது பரவலாக அறியப்பட்ட வேதாகமப் பயன்பாடு; மிகத் தொன்மையான வாக்கிய அமைப்புகள் தவிர்க்கப்பட்டுள்ளன.
