review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately renders εὐθέως, the hand-stretching action, the act of taking hold, the direct address Ὀλιγόπιστε, and the causal question εἰς τί ἐδίστασας. The footnote appropriately preserves the verb’s possible nuance of wavering or hesitation. A small syntactic revision is advisable: பிடித்துக்கொண்டு can make the taking hold sound merely simultaneous with the speech, whereas the Greek presents it as a completed narrative action followed by Jesus’ speech.'
  naturalness: The register is clear, modern, and suitably dignified. ‘நம்பிக்கை குறைந்தவனே’ is natural modern Tamil and avoids overstating the rebuke. Separating the two finite actions improves narrative clarity and avoids an unnecessary converb implication.
  terminology: ‘நம்பிக்கை’ suitably renders πίστις here. ‘ஐயப்பட்டாய்’ is an acceptable primary rendering of ἐδίστασας, while the note responsibly retains ‘தயங்கினாய்’ and mental wavering as lexical possibilities. Names and honorific usage are appropriate.
  issues:
  - severity: low
    issue: The phrase ‘அவனைப் பிடித்துக்கொண்டு, … கூறினார்’ can imply that Jesus spoke while holding him rather than narrating two successive actions.
    rationale: ἐπελάβετο and λέγει are coordinated verbal actions. Tamil finite verbs more clearly preserve the sequence without introducing a simultaneous-action nuance.
  revised_text: உடனே இயேசு தமது கையை நீட்டி, அவனைப் பிடித்தார்; அவனிடம், “நம்பிக்கை குறைந்தவனே, நீ ஏன் ஐயப்பட்டாய்[a]?” என்று கூறினார்.
