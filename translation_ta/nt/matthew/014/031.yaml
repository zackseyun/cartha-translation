revisions:
- from: உடனே இயேசு தமது கையை நீட்டி அவனைப் பிடித்துக்கொண்டு, “நம்பிக்கை குறைந்தவனே, நீ ஏன் ஐயப்பட்டாய்[a]?” என்று அவனிடம் கூறினார்.
  to: உடனே இயேசு தமது கையை நீட்டி, அவனைப் பிடித்தார்; அவனிடம், “நம்பிக்கை குறைந்தவனே, நீ ஏன் ஐயப்பட்டாய்[a]?” என்று கூறினார்.
  rationale: The revision changes the converb construction to finite coordinated actions, making the Greek narrative sequence explicit in idiomatic modern Tamil. The footnote is retained with minor grammatical and stylistic smoothing only.
