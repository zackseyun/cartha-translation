id: MAT.14.31
reference: Matthew 14:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εὐθέως δὲ ὁ Ἰησοῦς ἐκτείνας τὴν χεῖρα ἐπελάβετο αὐτοῦ καὶ λέγει αὐτῷ· Ὀλιγόπιστε, εἰς τί ἐδίστασας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/031.yaml
  text: Immediately Jesus stretched out his hand[a], took hold of him, and said to him, “You of little faith, why did you doubt?”
translation:
  language: ta
  text: உடனே இயேசு தமது கையை நீட்டி, அவனைப் பிடித்தார்; அவனிடம், “நம்பிக்கை குறைந்தவனே, நீ ஏன் ஐயப்பட்டாய்[a]?” என்று கூறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தயங்கினாய்?” கிரேக்க வினைச்சொல் ஐயப்படுவதையும், தயங்குவதையும், மனம் தடுமாறுவதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: உடனே
  rationale: செயல் தாமதமின்றி நிகழ்ந்ததை இயல்பான நவீனத் தமிழில் தெரிவித்து, நிகழ்வின் அவசரத்தையும் காக்கிறது.
- source_word: δὲ
  choice: தனி மொழிபெயர்ப்பு இல்லை
  rationale: இங்கு இது மெலிதான தொடர்ச்சி அல்லது எதிர்நிலையைக் குறிக்கிறது; தமிழில் தனியாகச் சேர்த்தால் நடை செயற்கையாகும். வாக்கியத் தொடரே அதன் பணியை நிறைவேற்றுகிறது.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: தமது கையை நீட்டி
  rationale: மூலத்தின் தெளிவான உடற்செயலையும், பிடிப்பதற்கு முன் கை நீட்டப்பட்ட செயல்முறையையும் காக்கிறது.
- source_word: ἐπελάβετο αὐτοῦ
  choice: அவனைப் பிடித்துக்கொண்டு
  rationale: அவரை உறுதியாகப் பற்றிக்கொண்டார் என்ற வினையின் பொருளை, தேவையற்ற விளக்கம் சேர்க்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: λέγει αὐτῷ
  choice: என்று அவனிடம் கூறினார்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் இருந்தாலும், தொடர்ச்சியான இறந்தகாலத் தமிழ் விவரிப்பில் ‘கூறினார்’ இயல்பாகவும் தெளிவாகவும் அமைகிறது.
- source_word: Ὀλιγόπιστε
  choice: நம்பிக்கை குறைந்தவனே
  rationale: பேதுருவிடம் சிறிதளவு நம்பிக்கை இருந்தும் அது போதாமல் இருந்ததைக் குறிக்கிறது; ‘நம்பிக்கையற்றவனே’ என்று முழு அவநம்பிக்கையாக மிகைப்படுத்துவதில்லை.
- source_word: εἰς τί
  choice: ஏன்
  rationale: இச்சூழலில் கேள்வியின் காரணப்பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐδίστασας
  choice: ஐயப்பட்டாய்
  rationale: முதன்மைப் பொருளான சந்தேகத்தைத் தெளிவாகத் தருகிறது; தயக்கம் அல்லது மனத்தடுமாற்றம் என்ற நுண்பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: Ὀλιγόπιστε என்பதில் πίστις சார்ந்த கண்டிப்பு
  choice: நம்பிக்கை குறைந்தவனே
  alternative: நம்பிக்கையற்றவனே
  rationale: இயேசுவின் கண்டிப்பு நம்பிக்கையின் குறைவைச் சுட்டுகிறது; நம்பிக்கை முற்றிலும் இல்லை என்று கூறுவதில்லை. இதனால் மூலத்தின் இறையியல் அழுத்தமும் அளவும் காக்கப்படுகின்றன.
- issue: ἐδίστασας என்பதிலுள்ள சந்தேகம்–தயக்கம் நுண்பொருள்
  choice: ஐயப்பட்டாய்
  alternative: தயங்கினாய் / மனந்தடுமாறினாய்
  rationale: ‘ஐயப்பட்டாய்’ என்பது கேள்வியின் நம்பிக்கை சார்ந்த தொடர்பை வெளிப்படுத்துகிறது; அதேவேளை, வினை நிலையான அவநம்பிக்கையைக் காட்டாமல் தற்காலிகத் தயக்கம் அல்லது தடுமாற்றத்தையும் குறிக்கக்கூடும் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் வேதாகம உரைக்கேற்ற கண்ணியமும் காக்கப்பட்டுள்ளன. இயேசுவைக் குறிக்க ‘தமது’ பயன்படுத்தப்பட்டுள்ளது; பேதுருவுக்கான நேரடி அழைப்பு இயல்பான ஒருமை வடிவில் வைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘ஐயப்பட்டாய்’ என்பதற்குப் பின் இடப்பட்டுள்ளது.
