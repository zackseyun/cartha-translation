id: MAT.14.3
reference: Matthew 14:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὁ γὰρ Ἡρῴδης κρατήσας τὸν Ἰωάννην ἔδησεν ⸀αὐτὸν καὶ ⸂ἐν φυλακῇ ἀπέθετο⸃ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/003.yaml
  text: For Herod had arrested John[a], bound him, and put him in prison because of Herodias, the wife of Philip his brother,
translation:
  language: ta
  text: ஏனெனில், ஏரோது யோவானைக் கைதுசெய்து, அவரைக் கட்டி, தன் சகோதரனான பிலிப்புவின் மனைவி ஏரோதியாளின் காரணமாகச் சிறையில் அடைத்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் கூறப்பட்டதற்கான பின்னணிக் காரணத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பைத் தக்கவைக்கிறது.
- source_word: κρατήσας
  choice: கைதுசெய்து
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘பிடித்தல்’ என்றாலும், தொடர்ந்து கட்டிச் சிறையில் அடைக்கும் இந்தச் சூழலில் அதிகாரபூர்வமாகப் பிடித்துக் காவலில் வைத்ததைக் குறிக்கும் இயல்பான தமிழ் சொல் இது.
- source_word: ἔδησεν
  choice: கட்டி
  rationale: எதனால் கட்டினார் என்று மூலவாக்கியம் குறிப்பிடாததால், ‘சங்கிலியால் பிணைத்து’ என மிகைப்படுத்தாமல் செயலை நேரடியாகத் தெரிவிக்கிறது.
- source_word: ἐν φυλακῇ ἀπέθετο
  choice: சிறையில் அடைத்திருந்தான்
  rationale: இச்சொற்றொடரின் சிறைப்படுத்தும் பொருளை இயல்பான தமிழில் தருகிறது; கிரேக்க நிகழ்வுகளின் முன்னுரிமையைத் தமிழில் நிறைவுற்ற பின்னணி வினையாக வெளிப்படுத்துகிறது.
- source_word: διὰ Ἡρῳδιάδα
  choice: ஏரோதியாளின் காரணமாக
  rationale: διά + accusative இங்கு காரணத்தைக் குறிக்கிறது; அந்தக் காரணத்தின் விவரம் அடுத்த வசனத்தில் வருவதால் இதை மட்டும் தெரிவிக்கிறது.
- source_word: γυναῖκα
  choice: மனைவி
  rationale: பிலிப்புவுடனான உறவைக் குறிக்கும் இக்கட்டமைப்பில் γυνή என்பதற்கான சூழல்பொருத்தமான பொருள் ‘மனைவி’.
- source_word: Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ
  choice: தன் சகோதரனான பிலிப்புவின்
  rationale: αὐτοῦ என்பது ஏரோதைக் குறிப்பதையும், பிலிப்பு அவனுடைய சகோதரன் என்பதையும் தமிழில் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
theological_decisions:
- issue: பிலிப்புவுக்கும் ஏரோதியாளுக்கும் இடையிலான உறவின் வரலாற்று-அறநெறி வர்ணனை
  choice: ‘தன் சகோதரனான பிலிப்புவின் மனைவி ஏரோதியாள்’ என்று நடுநிலையாக அடையாளப்படுத்துதல்
  alternative: ‘தன் சகோதரன் பிலிப்புவின் மனைவியை எடுத்துக்கொண்ட ஏரோது’ என்று உறவின் சட்டவிரோதத் தன்மையை இவ்வசனத்திலேயே வெளிப்படுத்துதல்
  rationale: இவ்வசனம் ஏரோதியாளை பிலிப்புவின் மனைவியாக மட்டுமே அடையாளப்படுத்துகிறது. உறவுக்கான அறநெறித் தீர்ப்பு அடுத்த வசனத்தில் வெளிப்படுவதால் அதை இங்கே முன்கூட்டியே சேர்க்கவில்லை.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, கண்ணியமான மற்றும் பொதுவாசகர்களுக்குப் புரியும் நடை. நீண்ட கிரேக்க வாக்கியத்தை இரண்டு தமிழ் வாக்கியங்களாகப் பிரித்து வாசிப்புத் தெளிவு அளிக்கப்பட்டுள்ளது; ‘இப்படிச் செய்தான்’ என்பது கைதுசெய்தல், கட்டுதல், சிறையிலடைத்தல் ஆகியவற்றைத் திரும்பச் சுட்டுகிறது.
