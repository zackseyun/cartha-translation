  text: ὅθεν μετὰ ὅρκου ὡμολόγησεν αὐτῇ δοῦναι ὃ ⸀ἐὰν αἰτήσηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/007.yaml
  text: Therefore he promised with an oath to give her whatever she might ask[a].
translation:
  language: ta
  text: அதனால், அவன் அவள் எதைக் கேட்டாலும் அதைக் கொடுப்பதாக அவளுக்குச் சத்தியம் செய்து வாக்களித்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவள் எதைக் கேட்டாலும் அதை.’ கிரேக்கச் சொற்றொடர், அவள் எதிர்காலத்தில் கேட்கக்கூடிய எந்தக் கோரிக்கையையும் உள்ளடக்கும் திறந்தநிலையை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: அதனால்
  rationale: முந்தைய நிகழ்வின் விளைவாக இந்த வாக்குறுதி அளிக்கப்பட்டதை இயல்பான தமிழில் காட்டுகிறது.
- source_word: μετὰ ὅρκου
  choice: சத்தியம் செய்து
  rationale: வாக்குறுதி ஆணையால் உறுதிப்படுத்தப்பட்டதைக் காட்டும் இயல்பான, தெளிவான தமிழ் நடை.
- source_word: ὡμολόγησεν
  choice: வாக்களித்தான்
  rationale: இச்சூழலில் இந்த வினைச்சொல் ஒப்புக்கொள்ளுதல் அல்லது அறிக்கையிடுதல் என்பதைக் காட்டிலும் உறுதியான வாக்குறுதி அளித்தலைக் குறிக்கிறது.
- source_word: αὐτῇ
  choice: அவள்
  rationale: வாக்குறுதியைப் பெறுபவளையும் அடுத்த வினையின் எழுவாயையும் தமிழில் இயல்பாக ஒரே குறிப்பால் வெளிப்படுத்துகிறது.
- source_word: δοῦναι
  choice: கொடுப்பதாக
  rationale: வாக்களித்ததன் உள்ளடக்கத்தைத் தமிழில் இயல்பான மேற்கோள் சார்ந்த வினையெச்ச அமைப்பில் தருகிறது.
- source_word: ὃ ἐὰν αἰτήσηται
  choice: எதைக் கேட்டாலும்
  rationale: ἐάν உடன் வரும் subjunctive கொண்ட வரையறுக்கப்படாத தொடர்புச் சொற்றொடரின் திறந்தநிலை எதிர்காலக் கோரிக்கையைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘சத்தியம் செய்து வாக்களித்தான்’ என்பது ஆணையையும் வாக்குறுதியையும் தனித்தனியாகத் தெளிவாகப் பேணுகிறது.
