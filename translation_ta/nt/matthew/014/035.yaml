  text: And when the men of that place recognized him[a], they sent into that whole surrounding region and brought to him all who were sick[b],
translation:
  language: ta
  text: அந்த இடத்தைச் சேர்ந்த ஆண்கள் அவரை அடையாளம் கண்டதும், அந்தச் சுற்றுப்புறம் முழுவதும் அனுப்பி[a], நோயுற்றிருந்த அனைவரையும் அவரிடம் கொண்டுவந்தார்கள்[b].
  philosophy: optimal-equivalence
