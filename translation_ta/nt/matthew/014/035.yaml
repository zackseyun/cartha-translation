    text: மூலமொழியில், என்ன அல்லது யாரை அனுப்பினார்கள் என்பது கூறப்படவில்லை; ‘தகவல் அனுப்பி’ அல்லது ‘ஆட்களை அனுப்பி’ என்று பொருள் கொள்ளலாம்.
