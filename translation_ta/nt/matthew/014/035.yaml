lexical_decisions:
- source_word: ἐπιγνόντες
  choice: அடையாளம் கண்டதும்
  rationale: இங்கு இயேசுவைப் பார்த்து அவர் யார் என்பதை அறிந்துகொண்டதைக் குறிக்கிறது. இறந்தகால வினையெச்சத்தின் காலத் தொடர்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οἱ ἄνδρες τοῦ τόπου ἐκείνου
  choice: அந்த இடத்தைச் சேர்ந்த ஆண்கள்
  rationale: ἀνήρ என்பது பொதுவாக மக்களைக் குறிக்கும் சொல்லல்ல; குறிப்பாக ஆண்களைக் குறிக்கிறது. τόπος இங்கு அவர்கள் இருந்த உள்ளூரைக் குறிக்கிறது.
- source_word: ἀπέστειλαν εἰς ὅλην τὴν περίχωρον ἐκείνην
  choice: அந்தச் சுற்றுப்புறம் முழுவதும் தகவல் அனுப்பி
  rationale: கிரேக்கத்தில் அனுப்பப்பட்ட பொருள் வெளிப்படையாகக் கூறப்படவில்லை. தமிழில் வாக்கியம் இயல்பாகவும் தெளிவாகவும் இருக்க, சூழலில் உட்பொருளாக உள்ள தகவல் பரப்புதலை வெளிப்படுத்துகிறது; மூலத்தின் சுருக்கத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: προσήνεγκαν αὐτῷ
  choice: அவரிடம் கொண்டுவந்தார்கள்
  rationale: இச்சூழலில் προσφέρω என்பது பலியிடுதல் அல்ல, மனிதர்களை இயேசுவிடம் அழைத்தோ சுமந்தோ கொண்டுவருதலைக் குறிக்கிறது.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: நோயுற்றிருந்த அனைவரையும்
  rationale: κακῶς ἔχειν என்பது உடல்நலம் குன்றியிருத்தல் அல்லது நோயுற்றிருத்தல் என்னும் மரபுத்தொடர். நவீன தமிழில் ‘நோயுற்றிருந்த’ என்பது சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
