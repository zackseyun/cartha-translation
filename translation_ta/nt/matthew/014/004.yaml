  yaml_path: translation/nt/matthew/014/004.yaml
  text: For John had been saying to him[a], “It is not lawful for you to have her.”
translation:
  language: ta
  text: ஏனெனில் யோவான் அவனிடம், “அவளை வைத்திருக்க உனக்குச் சட்டப்படி அனுமதியில்லை[a]” என்று சொல்லிவந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவளை வைத்திருப்பது உனக்குச் சட்டப்படி முறையல்ல.”
    reason: ἔξεστιν என்பதன் அனுமதி/சட்டப்பூர்வம் என்னும் பொருள் நிழலை வேறொரு இயல்பான தமிழ்ச் சொல்லாட்சியில் வழங்குகிறது.
lexical_decisions:
- source_word: ἔλεγεν
  choice: சொல்லிவந்தார்
  rationale: இறந்தகாலத் தொடர்ச்சியைக் காட்டும் imperfect வடிவம், ஒருமுறை கூறியதைவிட தொடர்ந்து அல்லது மீண்டும் கூறிவந்த செயலைக் குறிக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய சூழலுக்கான காரணவிளக்கத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையைத் தெளிவாகக் காட்டுகிறது.
- source_word: αὐτῷ
  choice: அவனிடம்
  rationale: λέγω உடன் வரும் மறைமுகச் செயப்படுபொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὁ Ἰωάννης
  choice: யோவான்
  rationale: மூலத்தில் உள்ள பெயரை மட்டும் தருகிறது; உடனடியான சூழல் அவரை அடையாளப்படுத்துவதால் ‘திருமுழுக்கு யோவான்’ என்று விரிவாக்கவில்லை.
- source_word: Οὐκ ἔξεστίν
  choice: சட்டப்படி அனுமதிக்கப்பட்டதல்ல
  rationale: ἔξεστιν என்பதிலுள்ள அனுமதி மற்றும் சட்ட-ஒழுக்க நியாயத்தின் வலிமை இரண்டையும் தமிழில் இயல்பாகப் பேணுகிறது.
- source_word: σοι
  choice: உனக்கு
  rationale: ஆளைக் குறிக்கும் dative வடிவத்தைத் தமிழ் அனுமதிக் கட்டமைப்புக்கு ஏற்றவாறு வழங்குகிறது.
- source_word: ἔχειν
  choice: வைத்திருப்பது
  rationale: இந்தச் சூழலில் ஒரு பெண்ணை மனைவி அல்லது துணைவியாக வைத்திருப்பதைக் குறிப்பதாக இருந்தாலும், மூலத்தின் நேரடியான சொல்லாட்சியைப் பேணுகிறது.
- source_word: αὐτήν
  choice: அவளை
  rationale: ஏரோதியாளைக் குறிக்கும் பெண்பால் சுட்டுப்பெயரை விளக்க விரிவாக்கமின்றி நேரடியாக மொழிபெயர்க்கிறது.
theological_decisions:
- issue: யோவானின் கண்டனத்தின் இயல்பு
  choice: “அவளை வைத்திருப்பது உனக்குச் சட்டப்படி அனுமதிக்கப்பட்டதல்ல” என்ற சட்ட-ஒழுக்கத் தடையாக மொழிபெயர்த்தல்
  alternative: “அவளை வைத்திருப்பது உனக்குச் சரியல்ல” என்ற பொதுவான ஒழுக்கக் கூற்று
  rationale: ἔξεστιν வெறும் சரி-தவறை மட்டுமல்லாமல் அனுமதிக்கப்படுதல் அல்லது சட்டத்துக்கு உட்பட்டிருத்தலைக் குறிக்கிறது. ஆகவே கண்டனத்தின் கூர்மையைப் பேணுகிறது; அதேவேளை எந்தச் சட்டம் என்பதை வசனத்திற்குள் சேர்த்து விளக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், கண்ணியமான நடை. தொடர்ச்சியான கடந்தகாலச் செயலை ‘சொல்லிவந்தார்’ எனவும், சட்ட-ஒழுக்க அனுமதியின் வலிமையை ‘சட்டப்படி அனுமதிக்கப்பட்டதல்ல’ எனவும் வெளிப்படுத்துகிறது. மூலத்தில் இல்லாத ‘மனைவியாக’ என்ற விளக்கத்தை முதன்மை உரையில் சேர்க்கவில்லை.
