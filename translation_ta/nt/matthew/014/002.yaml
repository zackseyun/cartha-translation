source:
  edition: SBLGNT
  text: καὶ εἶπεν τοῖς παισὶν αὐτοῦ· Οὗτός ἐστιν Ἰωάννης ὁ βαπτιστής· αὐτὸς ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ διὰ τοῦτο αἱ δυνάμεις ἐνεργοῦσιν ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/002.yaml
  text: And he said to his servants[a], “This is John the Baptist. He has been raised from the dead, and for this reason these powers are at work in him.”
translation:
  language: ta
  text: அவன் தன் பணியாளர்களிடம், “இவர் திருமுழுக்கு யோவான். இவர் இறந்தோரிடமிருந்து எழுப்பப்பட்டிருக்கிறார்; அதனால்தான் இந்த வல்லமைகள் இவரில் செயல்படுகின்றன[a]” என்று சொன்னான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த அற்புத வல்லமைகள் இவரில் செயல்படுகின்றன.” கிரேக்கத்தில் “வல்லமைகள்” என்று உள்ளது; இது வல்ல செயல்களில் வெளிப்படும் இயற்கைக்கு அப்பாற்பட்ட ஆற்றலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: παισὶν
  choice: பணியாளர்களிடம்
  rationale: παῖς என்பது சூழலுக்கேற்ப குழந்தை அல்லது பணியாளர் எனப் பொருள்படும். இங்கு ஏரோதின் வீட்டார் அல்லது அரசவைச் சேவகர்களைக் குறிப்பதால், வயதைத் தவறாக உணர்த்தாமல் சமூக உறவை இயல்பாக வெளிப்படுத்தும் சொல் இது.
- source_word: ὁ βαπτιστής
  choice: திருமுழுக்கு யோவான்
  rationale: யோவானின் அடையாளப் பெயரை நவீனத் தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய வகையில் தருகிறது; அவர் திருமுழுக்கு கொடுப்பவர் என்ற கிரேக்கச் சொல்லின் பொருளையும் காக்கிறது.
- source_word: ἠγέρθη
  choice: உயிருடன் எழுப்பப்பட்டிருக்கிறார்
  rationale: ἐγείρω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது. ‘உயிர்த்தெழுந்தார்’ என்பதைக் காட்டிலும், அவர் எழுப்பப்பட்டார் என்ற இலக்கண நுட்பத்தை இது தெளிவாகத் தருகிறது.
- source_word: ἀπὸ τῶν νεκρῶν
  choice: இறந்தோரிடமிருந்து
  rationale: ‘இறந்தவர்களின் நடுவிலிருந்து’ என்ற அடிப்படைப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: διὰ τοῦτο
  choice: அதனால்தான்
  rationale: முந்தைய கூற்றுக்கும் அடுத்த விளைவுக்கும் இடையிலான காரணத் தொடர்பை இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: αἱ δυνάμεις
  choice: இந்த வல்ல செயல்கள்
  rationale: δύναμις இச்சூழலில் அற்புத வல்லமை வெளிப்படும் வல்ல செயல்களைக் குறிக்கிறது. வெறும் ‘வல்லமைகள்’ என்பதைவிடத் தமிழில் இயல்பானது; ஆனால் ‘அற்புதங்கள்’ என்று பொருளை முழுவதுமாக விளக்கிவிடாமல் மூலத்தின் நுட்பத்தைத் தக்கவைக்கிறது.
- source_word: ἐνεργοῦσιν
  choice: செயல்படுகின்றன
  rationale: வல்ல செயல்கள் தொடர்ந்து ஆற்றலுடன் நிகழ்கின்றன என்ற ἐνεργέω வினையின் நிகழ்காலச் செயற்பாட்டை வெளிப்படுத்துகிறது.
- source_word: ἐν αὐτῷ
  choice: இவரில்
  rationale: ἐν என்பதன் நேரடியான ‘இல்’ பொருளைப் பாதுகாக்கிறது; ‘இவர் மூலமாக’ என்ற விளக்கவுரையைத் தேவையின்றி புகுத்தவில்லை.
theological_decisions:
- issue: யோவான் இறந்தோரிடமிருந்து திரும்பிய விதம்
  choice: உயிருடன் எழுப்பப்பட்டிருக்கிறார்
  alternative: உயிர்த்தெழுந்திருக்கிறார்
  rationale: கிரேக்கத்தில் செயப்பாட்டு வடிவம் இருப்பதால், யோவான் தாமாக எழுந்தார் என்று ஒலிக்காமல் அவர் எழுப்பப்பட்டார் என்ற இலக்கணத்தைப் பாதுகாக்கிறது. ஏரோதின் கூற்றுக்கு அப்பாற்பட்ட இறையியல் முடிவையும் சேர்க்கவில்லை.
- issue: δυνάμεις என்பதன் சூழல்சார் பொருள்
  choice: இந்த வல்ல செயல்கள்
  alternative: இந்த அற்புத வல்லமைகள் / அற்புதங்கள்
  rationale: இச்சொல் அற்புத ஆற்றல் வெளிப்படும் செயல்களைக் குறித்தாலும், அதை வெறும் ‘அற்புதங்கள்’ என்று குறுக்காமல் ‘வல்ல செயல்கள்’ எனத் தருவது மூலத்தின் பொருள் அகலத்தையும் சூழலின் அற்புதத் தன்மையையும் சமநிலைப்படுத்துகிறது.
translation_notes:
  register: நவீன, பொதுத் தரத் தமிழில் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘அவன்’ என்பது கதைசொல்லியின் முன்சூழல் சார்ந்த மூன்றாம் நபர் குறிப்பு; மேற்கோளில் யோவானைக் குறிக்க மரியாதை ஒருமையான ‘இவர்’ பயன்படுத்தப்பட்டுள்ளது. செயப்பாட்டு இலக்கணமும் மூலத்தின் காரணத் தொடர்பும் பாதுகாக்கப்பட்டுள்ளன.
