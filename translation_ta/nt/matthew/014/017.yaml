  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἱ δὲ λέγουσιν αὐτῷ· Οὐκ ἔχομεν ὧδε εἰ μὴ πέντε ἄρτους καὶ δύο ἰχθύας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/017.yaml
  text: But they said to him[a], “We have nothing here except five loaves and two fish.”
translation:
  language: ta
  text: அதற்கு அவர்கள் அவரிடம், “ஐந்து அப்பங்களும் இரண்டு மீன்களும் தவிர இங்கே எங்களிடம் வேறு எதுவும் இல்லை” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: அதற்கு அவர்கள்
  rationale: οἱ என்பது முந்தைய சூழலில் உள்ள சீடர்களைக் குறிக்கிறது; δέ இயேசுவின் முந்தைய கட்டளைக்கான மிதமான மாறுபாட்டைத் தமிழில் இயல்பாகக் காட்ட ‘அதற்கு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: λέγουσιν αὐτῷ
  choice: அவர்கள் அவரிடம் ... என்றார்கள்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் இருந்தாலும், தமிழ் கதைநடையில் இறந்தகாலமான ‘என்றார்கள்’ இயல்பானது; αὐτῷ என்பதற்கு ‘அவரிடம்’ பயன்படுத்தப்பட்டது.
- source_word: Οὐκ ἔχομεν
  choice: எங்களிடம் வேறு எதுவும் இல்லை
  rationale: உடைமையை மறுக்கும் கிரேக்கக் கூற்றைத் தமிழில் இயல்பாகத் தெரிவிக்க ‘எங்களிடம் ... எதுவும் இல்லை’ பயன்படுத்தப்பட்டது; விதிவிலக்காகச் சொல்லப்படும் பொருட்களைத் தெளிவுபடுத்த ‘வேறு’ சேர்க்கப்பட்டது.
- source_word: ὧδε
  choice: இங்கே
  rationale: இடத்தைக் குறிக்கும் ὧδε என்பதன் நேரான, இயல்பான தமிழ் இணைச்சொல் ‘இங்கே’.
- source_word: εἰ μὴ
  choice: தவிர
  rationale: மறுப்புக் கூற்றுக்குப் பின் வரும் εἰ μή இங்கே நிபந்தனையை அல்ல, விதிவிலக்கைக் குறிக்கிறது.
- source_word: πέντε ἄρτους
  choice: ஐந்து அப்பங்கள்
  rationale: ἄρτος இச்சூழலில் தனித்தனி அப்பங்களைக் குறிக்கிறது; வேதாகமச் சூழலிலும் நவீனத் தமிழிலும் புரியக்கூடிய ‘அப்பங்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: δύο ἰχθύας
  choice: இரண்டு மீன்கள்
  rationale: ἰχθύας என்பதன் இயல்பான தமிழ் பன்மைப் பொருள் ‘மீன்கள்’.
