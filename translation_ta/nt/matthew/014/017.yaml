translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை. கிரேக்கச் சொல்வரிசையை இயந்திரமாகப் பின்பற்றாமல், அதன் மறுப்பு–விதிவிலக்கு அமைப்பை இயல்பான தமிழில் பாதுகாக்கிறது.
