  source_fidelity: 'The Tamil accurately conveys the Greek negated-possession clause, the locative ‘here,’ and the exception: they have nothing other than five loaves and two fish. ‘அதற்கு அவர்கள்’ suitably represents the discourse connection of οἱ δὲ without overstating it.'
