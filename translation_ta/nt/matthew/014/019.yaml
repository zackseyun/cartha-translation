id: MAT.14.19
reference: Matthew 14:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ κελεύσας τοὺς ὄχλους ἀνακλιθῆναι ἐπὶ ⸂τοῦ χόρτου⸃, λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας, ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κλάσας ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους οἱ δὲ μαθηταὶ τοῖς ὄχλοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/019.yaml
  text: And after ordering the crowds to recline on the grass[a], he took the five loaves and the two fish, looked up to heaven, blessed, and after breaking the loaves he gave them to the disciples, and the disciples to the crowds.
translation:
  language: ta
  text: அவர் மக்கள் கூட்டங்களைப் புல்லின்மேல் சாய்ந்து அமருமாறு கட்டளையிட்டார். பின்பு ஐந்து அப்பங்களையும் இரண்டு மீன்களையும் எடுத்து, வானத்தை அண்ணாந்து பார்த்து, ஆசீர்வதித்தார்[a]. அப்பங்களைப் பிட்டு சீடர்களுக்குக் கொடுத்தார்; சீடர்கள் அவற்றை மக்கள் கூட்டங்களுக்குக் கொடுத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தேவனை வாழ்த்தினார்’ / ‘ஆசீர்வாதம் கூறினார்.’ கிரேக்க மூலத்தில் ‘ஆசீர்வதித்தார்’ என்று மட்டுமே உள்ளது; யாரை அல்லது எதை ஆசீர்வதித்தார் என்பது வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: κελεύσας
  choice: கட்டளையிட்டார்
  rationale: இது வெறும் வேண்டுகோள் அல்ல, அதிகாரத்துடன் கொடுக்கப்பட்ட அறிவுரை என்பதைக் காட்டுகிறது; கிரேக்க இறந்தகால வினையெச்சத்தின் தொடர்ச்சியை இயல்பான தமிழ் வாக்கியங்களால் வெளிப்படுத்துகிறது.
- source_word: τοὺς ὄχλους
  choice: மக்கள் கூட்டங்கள்
  rationale: பன்மையையும் அங்கே திரண்டிருந்த பெருந்திரளையும் தெளிவாகக் காட்டும் இயல்பான நவீனத் தமிழ்.
- source_word: ἀνακλιθῆναι
  choice: சாய்ந்து அமருமாறு
  rationale: உணவுக்காகச் சாய்ந்த நிலையில் அமர்வதைக் குறிக்கும் மூலச்சொல்லின் நுணுக்கத்தைப் பாதுகாக்கிறது; வெறும் ‘உட்காருமாறு’ என்பதைவிடத் துல்லியமானது.
- source_word: ἐπὶ τοῦ χόρτου
  choice: புல்லின்மேல்
  rationale: மத்தேயு குறிப்பிடும் இடத்தை மட்டும் மொழிபெயர்க்கிறது; ‘பசும்புல்’ போன்ற கூடுதல் விவரத்தைச் சேர்க்கவில்லை.
- source_word: τοὺς πέντε ἄρτους
  choice: ஐந்து அப்பங்கள்
  rationale: உணவுக்கான தனித்தனி ரொட்டிகளைக் குறிக்கும் ἄρτοι என்பதற்கு தமிழ் வேதாகம நடையிலும் பொதுப் பயன்பாட்டிலும் புரியக்கூடிய சொல்.
- source_word: τοὺς δύο ἰχθύας
  choice: இரண்டு மீன்கள்
  rationale: மூலத்தின் எண்ணிக்கையையும் பொருளையும் நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: வானத்தை அண்ணாந்து பார்த்து
  rationale: மேல்நோக்கிப் பார்த்த செயலை இயல்பான தமிழில் வெளிப்படுத்தி, οὐρανός என்பதைக் ‘வானம்’ என்று நேரடியாக வழங்குகிறது.
- source_word: εὐλόγησεν
  choice: ஆசீர்வதித்தார்
  rationale: கிரேக்கத்தில் செயப்படுபொருள் வெளிப்படையாகக் கூறப்படாததைத் தமிழிலும் சேர்க்காமல் பாதுகாக்கிறது.
- source_word: κλάσας
  choice: அப்பங்களைப் பிட்டு
  rationale: கொடுப்பதற்கு முன் அப்பங்களைத் துண்டுகளாகப் பிட்ட செயலைத் தெளிவாகக் காட்டுகிறது; செயப்படுபொருள் முந்தைய சூழலிலிருந்து எடுத்துக்கொள்ளப்படுகிறது.
- source_word: ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους
  choice: அப்பங்களைப் பிட்டு சீடர்களிடம் கொடுத்தார்
  rationale: கிரேக்கத்தில் வெளிப்படையாக உள்ள ‘அப்பங்களை’ தமிழிலும் தெளிவாக வைத்திருக்கிறது.
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: சீடர்கள் அவற்றை மக்கள் கூட்டங்களிடம் கொடுத்தார்கள்
  rationale: கிரேக்கத்தில் விடுபட்டுள்ள வினையைத் தமிழின் தெளிவுக்காக நிரப்புகிறது; ‘அவற்றை’ என்பது அப்பங்களைக் குறிக்கிறது.
theological_decisions:
- issue: εὐλόγησεν என்பதன் வெளிப்படையாகக் குறிப்பிடப்படாத செயப்படுபொருள்
  choice: செயப்படுபொருளைச் சேர்க்காமல் ‘ஆசீர்வதித்தார்’ என்று மொழிபெயர்த்தல்
  alternative: ‘தேவனை வாழ்த்தினார்’ அல்லது ‘ஆசீர்வாதம் கூறினார்’; அப்பங்களையும் மீன்களையும் ஆசீர்வதித்தார் என்றும் புரிந்துகொள்ளலாம்
  rationale: கிரேக்க உரை யாரை அல்லது எதை ஆசீர்வதித்தார் என்று வெளிப்படையாகக் கூறவில்லை. செயப்படுபொருளைத் தமிழில் சேர்க்காமல் இருப்பது, உணவின்மேல் ஆசீர்வாதம் கூறுதல் அல்லது தேவனை வாழ்த்துதல் ஆகிய சாத்தியங்களைத் திறந்தவையாக வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியம் தமிழில் இயல்பாக வாசிக்கச் சிறு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. ‘சாய்ந்து அமருமாறு’ என்பது பழங்கால உணவுப் பந்தி நிலையைக் காட்டினாலும் அரிதான மரபுச்சொல்லைத் தவிர்க்கிறது. இறுதி உட்கருத்தில் விடுபட்ட வினை தமிழில் தெளிவுக்காக நிரப்பப்பட்டுள்ளது.
