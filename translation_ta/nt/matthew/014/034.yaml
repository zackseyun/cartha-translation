  text: Καὶ διαπεράσαντες ἦλθον ⸂ἐπὶ τὴν γῆν εἰς⸃ Γεννησαρέτ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/034.yaml
  text: And after crossing over[a], they came to the land of Gennesaret.
translation:
  language: ta
  text: அவர்கள் கடந்து சென்றபின், கெனேசரேத்தின் நிலப்பகுதிக்கு வந்து சேர்ந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கெனேசரேத்தில் கரையை அடைந்தார்கள்.’ கிரேக்கத்தில் ‘நிலத்தின்மேல்’ என்பதும் ‘கெனேசரேத்துக்குள்’ என்பதும் இணைந்து வந்து, கெனேசரேத்து பகுதியின் நிலத்தை அல்லது கரையை அவர்கள் அடைந்ததைக் குறிக்கின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπεράσαντες
  choice: கடலைக் கடந்து சென்றபின்
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் குறிக்கும் இறந்தகால வினையெச்சம். சூழலில் படகுப் பயணம் தெளிவாக இருப்பதால், தமிழில் இயல்பாகப் புரிய ‘கடலை’ சேர்க்கப்பட்டுள்ளது; கிரேக்கச் சொல் தானாகக் கடலைக் குறிப்பிடவில்லை.
- source_word: ἦλθον
  choice: வந்து சேர்ந்தார்கள்
  rationale: ἔρχομαι என்பதன் இறந்தகால வடிவம். இலக்கை அடைந்ததைக் குறிக்கும் இடச்சொற்றொடருடன் தமிழில் ‘வந்து சேர்ந்தார்கள்’ இயல்பாக உள்ளது.
- source_word: ἐπὶ τὴν γῆν εἰς
  choice: நிலப்பகுதிக்கு
  rationale: ‘நிலத்தின்மேல்’ மற்றும் ‘உள்ளே/நோக்கி’ என்னும் இரு இலக்குக் கூறுகளையும் இயல்பான தமிழில் ஒன்றிணைத்து, நீரிலிருந்து அப்பகுதியின் நிலத்தை அடைந்த பொருளைத் தருகிறது.
- source_word: Γεννησαρέτ
  choice: கெனேசரேத்து
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது; ‘நிலப்பகுதி’ என்பதுடன் இயல்பாக இணைவதற்காகச் சாரியைப் பெற்ற வடிவம் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘நிலப்பகுதி’ மூலத்தின் γῆ என்பதற்கு நெருக்கமாக உள்ளது; ‘கரையேறினார்கள்’ என்ற சூழல்சார்ந்த இயல்பான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
