revisions:
- from: அவர்கள் கடலைக் கடந்து சென்றபின், கெனேசரேத்து நிலப்பகுதிக்கு வந்து சேர்ந்தார்கள்.[a]
  to: அவர்கள் கடந்து சென்றபின், கெனேசரேத்தின் நிலப்பகுதிக்கு வந்து சேர்ந்தார்கள்.[a]
  rationale: The revision removes the unwarranted explicit reference to ‘the sea’ while retaining the antecedent crossing action. It also uses a more natural Tamil genitive construction for the destination. The footnote continues to identify the contextual shore/landing alternative and explains the combined force of the two Greek destination expressions.
