translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, எளிதில் புரியும் கதைநடை. கிரேக்கத்தின் வலுவான ἠνάγκασεν மெலிதாக்கப்படாமல் ‘கட்டாயப்படுத்தினார்’ என மொழிபெயர்க்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையின் அடிக்குறிப்பு ‘to the other side’ என்பதுடன் தவறாக இணைக்கப்பட்டிருந்தாலும் அதன் உரை ἀπολύσῃ-க்கான சொல் மாற்றையே தருகிறது; தமிழில் ‘அனுப்பிவிட’ நேரடியாகவும் இயல்பாகவும் இருப்பதால் அடிக்குறிப்பு தேவையில்லை.
