language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ εὐθέως ⸀ἠνάγκασεν τοὺς μαθητὰς ἐμβῆναι ⸀εἰς πλοῖον καὶ προάγειν αὐτὸν εἰς τὸ πέραν, ἕως οὗ ἀπολύσῃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/022.yaml
  text: And immediately he compelled the disciples to get into the boat and go on ahead of him to the other side[a], until he should dismiss the crowds.
translation:
  language: ta
  text: உடனே அவர் சீடர்கள் படகில் ஏறி, தமக்கு முன்னதாக அக்கரைக்குச் செல்லும்படி கட்டாயப்படுத்தினார்; அவர் மக்கள் கூட்டங்களை அனுப்பிவிடும் வரை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθέως
  choice: உடனே
  rationale: நிகழ்வின் உடனடியான தொடர்ச்சியையும் மத்தேயுவின் வேகமான கதைநடையையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἠνάγκασεν
  choice: கட்டாயப்படுத்தினார்
  rationale: வெறும் வேண்டுகோள் அல்லது அறிவுறுத்தலைவிட வலுவான வற்புறுத்தலைக் குறிக்கும் ἀναγκάζω என்பதன் பொருளைத் தக்கவைக்கிறது; உடல் வன்முறையைத் தேவையின்றி புகுத்துவதில்லை.
- source_word: τοὺς μαθητάς
  choice: சீடர்களை
  rationale: கிரேக்க வரையறைச் சுட்டு சூழலில் ஏற்கெனவே அறியப்பட்ட சீடர் குழுவைக் குறிக்கிறது; தமிழில் தனியே வரையறைச் சொல் தேவைப்படாது.
- source_word: ἐμβῆναι εἰς πλοῖον
  choice: படகில் ஏறி
  rationale: படகுக்குள் சென்று அதில் பயணம் தொடங்குவதை இயல்பான தமிழில் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: πλοῖον
  choice: படகு
  rationale: கிரேக்கத்தில் வரையறைச் சுட்டு இல்லாவிட்டாலும் சூழலில் குறிப்பிட்ட படகு மனதில் உள்ளது; தமிழில் ‘படகில்’ என்பது இயல்பாகவும் போதுமானதாகவும் உள்ளது.
- source_word: προάγειν αὐτόν
  choice: தமக்கு முன்னதாக ... செல்லும்படி
  rationale: சீடர்கள் இயேசுவுக்கு முன்னதாகப் புறப்பட்டுச் செல்ல வேண்டும் என்ற பொருளைத் தெளிவாகத் தருகிறது; மரியாதை ஒருமைக்கேற்ப ‘தமக்கு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: εἰς τὸ πέραν
  choice: அக்கரைக்கு
  rationale: நீர்நிலையின் எதிர்க்கரையைக் குறிக்கும் நிலையான, இயல்பான தமிழ் வழக்கு.
- source_word: ἕως οὗ ἀπολύσῃ
  choice: அதற்குள் ... அனுப்பிவிடவிருந்தார்
  rationale: முதன்மைச் செயலுக்கு ஒப்பில் எதிர்நோக்கப்பட்ட அடுத்த செயலைத் தமிழில் இயல்பாகக் காட்டுகிறது. ‘அதற்குள்’ என்பது சீடர்கள் முன்னே செல்லும் காலத்தில் அவர் கூட்டங்களை அனுப்புவார் என்ற உறவை வெளிப்படுத்துகிறது.
- source_word: ἀπολύσῃ τοὺς ὄχλους
  choice: மக்கள் கூட்டங்களை அனுப்பிவிட
  rationale: இச்சூழலில் ἀπολύω என்பது விடுதலை செய்வதைவிடக் கூடிவந்தவர்களை அனுப்பிவைப்பதைக் குறிக்கிறது; கிரேக்கப் பன்மையான ὄχλους என்பதும் காக்கப்பட்டுள்ளது.
