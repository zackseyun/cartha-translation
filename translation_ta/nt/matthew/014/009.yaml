  yaml_path: translation/nt/matthew/014/009.yaml
  text: And the king[a], though grieved, because of his oaths and those dining with him[b], commanded it to be given.
translation:
  language: ta
  text: அரசன் துயரமடைந்தபோதிலும், தான் செய்த சத்தியங்களின் காரணமாகவும் தன்னுடன் உணவருந்தியவர்களினாலும்[a], அதைக் கொடுக்கும்படி ஆணையிட்டான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தன்னுடன் பந்தியில் சாய்ந்திருந்து உணவருந்தியவர்களினாலும்.’ அக்காலத்தில் விருந்தின்போது மேசையருகே சாய்ந்திருப்பது வழக்கமான உணவருந்தும் நிலையாக இருந்தது.
    reason: cultural_note
  - marker: b
    text: எது கொடுக்கப்பட வேண்டும் என்பதை கிரேக்க மூலவாக்கியம் வெளிப்படையாகக் கூறவில்லை; அது முந்தைய சூழலில் கூறப்பட்ட வேண்டுகோளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπηθεὶς
  choice: துயரமடைந்தபோதிலும்
  rationale: இறந்தகாலச் செயப்பாட்டு வினையெச்சத்தின் துயருறுதல் என்ற பொருளையும், துயரப்பட்டும் பின்னர் கட்டளையிட்டார் என்ற விட்டுக்கொடுப்பு முரணையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὁ βασιλεὺς
  choice: அரசன்
  rationale: βασιλεύς என்பதன் நேரடியான, சூழலுக்கு ஏற்ற நவீனத் தமிழ்ச் சொல்.
- source_word: διὰ τοὺς ὅρκους
  choice: தான் செய்த சத்தியங்களின் காரணமாகவும்
  rationale: διά + வேற்றுமை வடிவம் காரணத்தைச் சுட்டுகிறது; சத்தியங்கள் அரசன் செய்தவை என்பது முந்தைய சூழலிலிருந்து தெளிவாவதால் ‘தான் செய்த’ என்று இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: τοὺς συνανακειμένους
  choice: தன்னுடன் விருந்துண்டவர்கள்
  rationale: அக்கால வழக்கப்படி தன்னுடன் மேசையில் சாய்ந்து உணவருந்தியவர்களைக் குறிக்கிறது; பழங்கால உடல் நிலையைக் கட்டாயமாக முதன்மை உரையில் ஏற்றாமல் சமூகச் சூழலை இயல்பாகத் தருகிறது.
- source_word: ἐκέλευσεν
  choice: கட்டளையிட்டான்
  rationale: கட்டளையிடுதல் அல்லது ஆணையிடுதல் என்ற வலிமையான பொருளைச் சுருக்கமாகவும் கதைநடைக்கு ஏற்றவாறும் தருகிறது.
- source_word: δοθῆναι
  choice: அதைக் கொடுக்கும்படி
  rationale: செயப்பாட்டு வினையெச்சத்தின் ‘கொடுக்கப்படுதல்’ என்ற கருத்தை இயல்பான தமிழ் கட்டளையமைப்பில் தருகிறது; ‘அது’ முந்தைய வசனத்தில் கேட்கப்பட்டதைக் குறிக்கிறது, ஆனால் அதை இங்கே விளக்கமாக விரித்துரைக்கவில்லை.
