lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: அந்தக் காலத்தில்
  rationale: இது காலத்தைக் குறிக்கும் இயல்பான சொற்றொடர்; கிரேக்கத்தின் பொருளைத் தெளிவாகவும் நவீனத் தமிழில் இயல்பாகவும் தருகிறது.
- source_word: ἤκουσεν
  choice: கேள்விப்பட்டான்
  rationale: இங்கு வெறும் ஒலியைக் கேட்டதல்ல, இயேசுவைப் பற்றிய செய்தி ஏரோதுக்குத் தெரியவந்தது என்பதே சூழற்பொருள்; ‘கேள்விப்பட்டான்’ என்பது ἀκούω-வின் எளிய பொருளையும் தமிழின் இயல்பையும் காக்கிறது.
- source_word: Ἡρῴδης
  choice: ஏரோது
  rationale: தமிழ் வேதாகம மரபில் பரவலாக அறியப்படும் பெயர் வடிவம்.
- source_word: ὁ τετραάρχης
  choice: குறுநில மன்னன்
  rationale: குறிப்பிட்ட ஒரு பகுதியை ஆட்சி செய்த அரசியல் பதவியைச் சாதாரண வாசகருக்குப் புரியும் வகையில் தருகிறது; ‘நாலில் ஒரு பகுதியின் ஆட்சியாளர்’ என்ற சொற்பிறப்பைத் தேவையின்றி முன்னிறுத்தவில்லை.
- source_word: τὴν ἀκοὴν
  choice: செய்தி
  rationale: இங்கு ἀκοή என்பது கேட்கும் திறனை அல்ல, கேள்வியாக வந்த தகவல் அல்லது செய்தியைக் குறிக்கிறது.
- source_word: Ἰησοῦ
  choice: இயேசுவைப் பற்றிய
  rationale: ἀκοή என்பதன் உள்ளடக்கம் இயேசுவைக் குறித்தது என்பதைத் தமிழ் வழக்கில் இயல்பாக வெளிப்படுத்துகிறது.
