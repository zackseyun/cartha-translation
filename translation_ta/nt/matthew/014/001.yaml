revisions:
- from: அந்தக் காலத்தில், குறுநில மன்னன் ஏரோது இயேசுவைப் பற்றிய செய்தியைக் கேள்விப்பட்டான்.[a]
  to: அந்தக் காலத்தில், குறுநில ஆட்சியாளரான ஏரோது இயேசுவைப் பற்றிய செய்தியைக் கேள்விப்பட்டான்.[a]
  rationale: τετραάρχης-க்கு ‘மன்னன்’ என்பதற்குப் பதிலாக ‘ஆட்சியாளர்’ பயன்படுத்தப்பட்டுள்ளது. இதனால் கிரேக்கத்தின் அரசியல் பதவிக் குறிப்பு தக்கவைக்கப்பட்டு, மூலத்தில் இல்லாத அரசப் பட்டம் சேர்க்கப்படவில்லை. மற்ற சொற்களும் அடிக்குறிப்பும் மூலத்திற்கும் ஆங்கில audit trail-க்கும் பொருந்துகின்றன.
