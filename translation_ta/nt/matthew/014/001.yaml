  text: At that time Herod the tetrarch heard the report about Jesus,[a]
translation:
  language: ta
  text: அந்தக் காலத்தில், குறுநில ஆட்சியாளரான ஏரோது இயேசுவைப் பற்றிய செய்தியைக் கேள்விப்பட்டான்.[a]
