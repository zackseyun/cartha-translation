id: MAT.14.13
reference: Matthew 14:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂Ἀκούσας δὲ⸃ ὁ Ἰησοῦς ἀνεχώρησεν ἐκεῖθεν ἐν πλοίῳ εἰς ἔρημον τόπον κατ’ ἰδίαν· καὶ ἀκούσαντες οἱ ὄχλοι ἠκολούθησαν αὐτῷ πεζῇ ἀπὸ τῶν πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/013.yaml
  text: When Jesus heard this[a], he withdrew from there by boat to a desolate place by himself. But when the crowds heard[b], they followed him on foot from the towns.
translation:
  language: ta
  text: இயேசு இதைக் கேட்டபோது, அங்கிருந்து படகில் ஆளரவமற்ற ஓர் இடத்துக்கு[a] தனியாக விலகிச் சென்றார். மக்கள் கூட்டங்கள் இதைக் கேள்விப்பட்டபோது, பட்டணங்களிலிருந்து[b] கால்நடையாக அவரைப் பின்தொடர்ந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பாழான இடம்,” “மக்கள் வசிக்காத இடம்,” அல்லது “தனிமையான இடம்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் தனிமைப்படுத்தப்பட்ட அல்லது குடியிருப்பில்லாத பகுதியைக் குறிக்கிறது; அது மணற்பாலைவனமாகத்தான் இருக்க வேண்டும் என்பதில்லை.
    reason: lexical_alternative
  - marker: b
    text: “நகரங்களிலிருந்து” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் சூழலின்படி பட்டணங்களையோ நகரங்களையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας δὲ
  choice: இயேசு இதைக் கேட்டபோது
  rationale: இறந்தகால வினையெச்சம் காலத்தொடர்பைக் காட்டுகிறது; δέ இங்கு வலுவான எதிர்மறையைவிட கதை நகர்வைக் குறிக்கிறது. முந்தைய நிகழ்வை இயல்பாகச் சுட்டுவதற்காகத் தமிழில் “இதை” சேர்க்கப்பட்டுள்ளது.
- source_word: ἀνεχώρησεν
  choice: விலகிச் சென்றார்
  rationale: சூழ்நிலைக்குப் பதிலளித்து அங்கிருந்து அகன்றுசெல்லும் நுணுக்கத்தைத் தருகிறது; காரணத்தை மொழிபெயர்ப்பே தீர்மானிப்பதில்லை.
- source_word: ἐν πλοίῳ
  choice: படகில்
  rationale: பயண வழிமுறையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: εἰς ἔρημον τόπον
  choice: ஆளரவமற்ற ஓர் இடத்துக்கு
  rationale: ἔρημος என்பது இங்கு மணற்பாலைவனத்தை அவசியம் குறிக்காமல், மக்கள் வசிக்காத அல்லது தனிமையான பகுதியைக் குறிக்கிறது.
- source_word: κατ’ ἰδίαν
  choice: தனியாக
  rationale: பிறரிடமிருந்து விலகித் தனிப்பட்ட விதத்தில் இருப்பதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: οἱ ὄχλοι
  choice: மக்கள் கூட்டங்கள்
  rationale: மூலத்தின் பன்மையைத் தக்கவைத்து, நவீன தமிழில் புரியத்தக்க வகையில் வழங்குகிறது.
- source_word: πεζῇ
  choice: கால்நடையாக
  rationale: நீர்வழிப் பயணத்துக்கு மாறாக நடந்து சென்றதைத் துல்லியமாகக் குறிக்கிறது.
- source_word: ἀπὸ τῶν πόλεων
  choice: பட்டணங்களிலிருந்து
  rationale: πόλις சூழலின்படி நகரத்தையோ பட்டணத்தையோ குறிக்கலாம்; கலிலேயச் சூழலுக்கு “பட்டணங்கள்” பொருத்தமான பொதுவழக்கு.
theological_decisions:
- issue: இயேசு விலகிச் சென்றதற்கான நோக்கம்
  choice: “விலகிச் சென்றார்” என்று நோக்கத்தைத் தீர்மானிக்காமல் மொழிபெயர்த்தல்
  alternative: பாதுகாப்புக்காகப் பின்வாங்கினார்; துக்கப்படவோ ஜெபிக்கவோ தனியே சென்றார்; வெறுமனே வேறிடத்துக்குப் புறப்பட்டார்
  rationale: அவர் செய்தியைக் கேட்டபின் தனியான இடத்திற்குச் சென்றதை வசனம் கூறுகிறது; ஆனால் அதற்கான நோக்கத்தை வெளிப்படையாகக் கூறவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. மூலத்தில் உள்ள “தனிமையான இடம் / தனியாக” என்ற கருத்து ஒட்டுமொத்தமாகத் தக்கவைக்கப்பட்டுள்ளது; இயேசுவின் நோக்கம் விளக்கிச் சேர்க்கப்படவில்லை. கொடுக்கப்பட்ட ஆங்கில உரையில் அடிக்குறிப்புக் குறியீடுகள் பொருந்தாத இடங்களில் இருந்ததால், [a] ἔρημος என்பதற்குப் பின்னரும் [b] πόλεων என்பதற்குப் பின்னரும் பொருள் சார்ந்த இடங்களில் வைக்கப்பட்டுள்ளன.
