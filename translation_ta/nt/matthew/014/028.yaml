source:
  edition: SBLGNT
  text: Ἀποκριθεὶς δὲ ⸂αὐτῷ ὁ Πέτρος εἶπεν⸃· Κύριε, εἰ σὺ εἶ, κέλευσόν με ⸂ἐλθεῖν πρὸς σὲ⸃ ἐπὶ τὰ ὕδατα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/028.yaml
  text: And Peter answered him[a], “Lord, if it is you, command me to come to you on the waters.”
translation:
  language: ta
  text: 'அதற்கு பேதுரு அவருக்குப் பதிலளித்தார்: “ஆண்டவரே, நீர்தான் என்றால், தண்ணீரின்மேல்[a] உம்மிடம் வர எனக்குக் கட்டளையிடுங்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மூல கிரேக்கத்தில், “தண்ணீர்களின்மேல்” என்று பன்மையில் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ αὐτῷ ὁ Πέτρος εἶπεν
  choice: அதற்குப் பேதுரு அவரிடம் ... என்றார்
  rationale: இது கிரேக்க மொழியில் வழக்கமான கதைத் தொடர்ச்சி அமைப்பு. ‘அதற்கு’ என்பது δέ-யின் தொடர்பையும் பதிலுரைத்ததையும் இயல்பாகக் காட்டுகிறது; αὐτῷ ‘அவரிடம்’ என வெளிப்படையாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: இயேசுவை நேரடியாக அழைக்கும் மரியாதையையும், இச்சொல்லில் இருக்கக்கூடிய கிறிஸ்துவியல் முக்கியத்துவத்தையும் குறைக்காமல் காக்கிறது.
- source_word: εἰ σὺ εἶ
  choice: அது நீர்தான் என்றால்
  rationale: காணப்படும் நபர் உண்மையிலேயே இயேசுவா என்ற அடையாளக் கேள்வியை இயல்பான தமிழில் தெரிவிக்கிறது; நிபந்தனையின் உண்மைத்தன்மையை முன்கூட்டியே தீர்மானிக்கவில்லை.
- source_word: κέλευσόν με
  choice: எனக்குக் கட்டளையிடும்
  rationale: κελεύω குறிக்கும் அதிகாரப்பூர்வமான ஆணையின் வலிமையை ‘கட்டளையிடும்’ காக்கிறது.
- source_word: ἐλθεῖν πρὸς σὲ
  choice: உம்மிடம் வர
  rationale: இயேசுவை நோக்கிய இயக்கத்தை πρός தெளிவாகக் குறிக்கிறது; தமிழில் ‘உம்மிடம் வர’ இயல்பானதும் மரியாதையானதும் ஆகும்.
- source_word: ἐπὶ τὰ ὕδατα
  choice: தண்ணீரின்மேல்
  rationale: தமிழில் இயல்பாகப் புரியும் ஒருமைத் தொகுப்புப்பெயர் பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இலக்கணப் பன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: இயேசுவை நோக்கி κύριε என்று அழைப்பதன் வலிமை
  choice: ஆண்டவரே
  alternative: ஐயா / போதகரே
  rationale: வெறும் மரியாதை அழைப்பாகச் சுருக்காமல், மத்தேயுவில் இச்சொல்லுக்கு இருக்கக்கூடிய ஆழ்ந்த பொருளைத் திறந்தவாறே வைக்கிறது; அதே நேரத்தில் இவ்வசனம் மட்டும் கொண்டு அந்தப் பொருளை மிகையாக வரையறுக்கவில்லை.
- issue: εἰ σὺ εἶ என்ற நிபந்தனையின் தன்மை
  choice: அது நீர்தான் என்றால்
  alternative: நீரே அவர் என்றால்
  rationale: பேதுரு எதிரிலிருப்பவரின் அடையாளத்தை உறுதிப்படுத்தக் கேட்கிறார். ‘அவர்’ போன்ற விளக்கச் சேர்க்கையைத் தவிர்த்து, மூலத்தின் சுருக்கத்தையும் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும் வாக்கிய அமைப்பு பயன்படுத்தப்பட்டுள்ளது. இயேசுவை நோக்கிய நேரடி உரையில் ‘நீர்/உம்’ என்ற கண்ணியமான ஒருமை வடிவம் காக்கப்பட்டுள்ளது. ‘தண்ணீர்களின்மேல்’ என்பது தமிழில் இயல்பற்றதாக ஒலிப்பதால் முதன்மை உரையில் ‘தண்ணீரின்மேல்’ என்றும், மூலத்தின் பன்மை அடிக்குறிப்பிலும் தரப்பட்டுள்ளது.
