id: MAT.14.20
reference: Matthew 14:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἔφαγον πάντες καὶ ἐχορτάσθησαν, καὶ ἦραν τὸ περισσεῦον τῶν κλασμάτων δώδεκα κοφίνους πλήρεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/020.yaml
  text: And they all ate and were satisfied[a], and they picked up twelve full baskets of the leftover pieces.
translation:
  language: ta
  text: எல்லாரும் சாப்பிட்டு நிறைவடைந்தார்கள். மீதமிருந்த துண்டுகள் நிறைந்த பன்னிரண்டு கூடைகளை அவர்கள் எடுத்துச் சேர்த்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφαγον
  choice: சாப்பிட்டார்கள்
  rationale: இறந்தகாலக் கதைநடையில் வரும் வினையை இயல்பான நவீனத் தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: πάντες
  choice: எல்லாரும்
  rationale: கூட்டத்திலிருந்த அனைவரையும் உள்ளடக்கும் கிரேக்கச் சொல்லின் முழுமையான பரப்பைத் தக்கவைக்கிறது.
- source_word: ἐχορτάσθησαν
  choice: திருப்தியடைந்தார்கள்
  rationale: வயிறார உண்டு நிறைவடைந்த பொருளை இயல்பாகத் தருகிறது; வெறும் உணர்ச்சித் திருப்தி அல்ல என்பதைச் சூழல் தெளிவாக்குகிறது.
- source_word: ἦραν
  choice: எடுத்துச் சேர்த்தபோது
  rationale: மீதியானவற்றை எடுத்து ஒன்றாகச் சேகரித்த செயலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὸ περισσεῦον τῶν κλασμάτων
  choice: மீதியான துண்டுகளை
  rationale: முறிக்கப்பட்ட உணவுத் துண்டுகளில் எஞ்சியவற்றைக் குறிக்கும் கிரேக்கத் தொடரைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: δώδεκα κοφίνους πλήρεις
  choice: பன்னிரண்டு கூடைகள் நிறைந்தன
  rationale: பன்னிரண்டு கூடைகள் முழுமையாக நிரம்பியிருந்த முடிவை இயல்பான தமிழ் வாக்கிய அமைப்பில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: அற்புத உணவளிப்பின் விளைவாக அனைவரும் நிறைவடைந்தது
  choice: திருப்தியடைந்தார்கள்
  alternative: வயிறார உண்டார்கள்
  rationale: கிரேக்கச் சொல் தெரிவிக்கும் முழுமையான உணவுநிறைவைப் பாதுகாக்கிறது; அதற்கு மேலான இறையியல் விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் கண்ணியமான வேதாகமக் கதைநடையிலும் மொழிபெயர்க்கப்பட்டது. மூலத்தின் இரண்டு இணை வாக்கியங்கள் தெளிவுக்காக இரு வாக்கியங்களாக வழங்கப்பட்டுள்ளன.
