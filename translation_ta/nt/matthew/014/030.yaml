  edition: SBLGNT
  text: βλέπων δὲ τὸν ἄνεμον ⸀ἰσχυρὸν ἐφοβήθη, καὶ ἀρξάμενος καταποντίζεσθαι ἔκραξεν λέγων· Κύριε, σῶσόν με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/030.yaml
  text: But seeing the strong wind[a], he became afraid, and beginning to sink, he cried out, saying, “Lord[b], save me.”
translation:
  language: ta
  text: ஆனால் பலத்த காற்றைக் கண்டபோது[a], அவன் பயந்துபோனான். மூழ்கத் தொடங்கியதும், “ஆண்டவரே, என்னைக் காப்பாற்றுங்கள்[b]!” என்று கூக்குரலிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடுமையான காற்றைக் கண்டபோது.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என்னை மீட்டருளுங்கள்.” இங்குள்ள கிரேக்க வினைச்சொல் உடனடி ஆபத்திலிருந்து காப்பாற்றுவதையும், விரிந்த பொருளில் மீட்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπων
  choice: கண்டபோது
  rationale: நிகழ்காலப் பங்கேற்புவினை, காற்றை உணர்ந்ததற்கும் பயம் ஏற்பட்டதற்கும் இடையிலான உடன்நிகழ்வைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: பேதுரு அதுவரை தண்ணீரின்மேல் நடந்ததிலிருந்து இப்போது பயத்துக்கு மாறும் கதைத் திருப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: τὸν ἄνεμον ἰσχυρόν
  choice: பலத்த காற்றை
  rationale: ἰσχυρός என்பதன் வலிமையைக் காக்கும் அதேவேளையில், நவீனத் தமிழில் இயல்பான சொற்றொடராக உள்ளது.
- source_word: ἐφοβήθη
  choice: பயந்துபோனான்
  rationale: பயம் அப்போது ஏற்பட்டது என்ற தொடக்கநிலையை இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: ἀρξάμενος καταποντίζεσθαι
  choice: மூழ்கத் தொடங்கியதும்
  rationale: அவன் முழுவதுமாக மூழ்கிவிட்டான் என்று மிகைப்படுத்தாமல், மூழ்கும் செயல் தொடங்கியதைத் துல்லியமாகக் காட்டுகிறது.
- source_word: ἔκραξεν λέγων
  choice: என்று கூக்குரலிட்டான்
  rationale: அவசரமும் உரத்த அழைப்பும் வெளிப்படும்படி கிரேக்கக் கூறின் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: இயேசுவை நேரடியாக அழைக்கும் κύριος என்பதன் மரியாதையையும் கிறிஸ்துவியல் நிறையையும் அளவுக்கு மீறாமல் காக்கிறது.
- source_word: σῶσόν με
  choice: என்னைக் காப்பாற்றும்
  rationale: உடனடி உயிராபத்திலிருந்து விடுவிக்கும்படி கேட்கும் அவசரக் கட்டளையைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; σῴζω என்பதன் விரிந்த மீட்புப் பொருளையும் முற்றிலும் இழக்கவில்லை.
theological_decisions:
- issue: இயேசுவை நோக்கிய κύριος என்ற அழைப்பு
  choice: ஆண்டவரே
  alternative: எஜமானே
  rationale: ‘ஆண்டவரே’ என்பது κύριος என்பதற்கான வழக்கமான, மரியாதைமிக்க மொழிபெயர்ப்பு; உரையில் உள்ள கிறிஸ்துவியல் சாத்தியத்தைப் பாதுகாக்கிறது, ஆனால் அதற்கு அப்பாற்பட்ட விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: உடனடி ஆபத்தின் சூழலில் σῴζω என்பதன் மொழிபெயர்ப்பு
  choice: என்னைக் காப்பாற்றும்
  alternative: என்னை மீட்டருளும்
  rationale: இங்கு உடல் சார்ந்த உடனடி ஆபத்தே முன்னிலையில் இருப்பதால் ‘காப்பாற்றும்’ என்பது நேரடியும் இயல்பும் ஆகும்; மாற்று மொழிபெயர்ப்பு வினையின் விரிந்த மீட்புப் பொருளைச் சுட்டலாம்.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ரட்சியும்’ போன்ற சமயக்குழு சார்ந்த அல்லது இன்றைய வழக்கில் குறைவான சொல்லுக்கு மாறாக ‘காப்பாற்றும்’ பயன்படுத்தப்பட்டுள்ளது.
