reference: Matthew 14:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ⸀ἀναβάντων αὐτῶν εἰς τὸ πλοῖον ἐκόπασεν ὁ ἄνεμος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/032.yaml
  text: And when they got into the boat[a], the wind ceased.
translation:
  language: ta
  text: அவர்கள் படகில் ஏறியதும்[a], காற்று அடங்கியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொல்லுக்குச் சொல்லாக, “அவர்கள் படகிற்குள் ஏறிய பின்பு.”
    reason: ἀναβάντων αὐτῶν என்ற கிரேக்க அமைப்பின் சொற்சார்ந்த மாற்று மொழிபெயர்ப்பை வழங்குகிறது.
lexical_decisions:
- source_word: ἀναβάντων αὐτῶν
  choice: அவர்கள் ... ஏறியதும்
  rationale: இறந்தகாலப் பெயரெச்சத்தின் சார்புநிலை அமைப்பை இயல்பான தமிழில் காலத்தைக் குறிக்கும் வாக்கியத் தொடராக மொழிபெயர்க்கிறது. ἀναβαίνω என்பதன் ‘மேலே ஏறு’ என்ற அடிப்படைப் பொருளையும் படகில் செல்வதற்குரிய இயல்பான தமிழ் வழக்கையும் ‘படகில் ஏறு’ காக்கிறது.
- source_word: εἰς τὸ πλοῖον
  choice: படகில்
  rationale: கலிலேயக் கடலில் பயன்படுத்தப்பட்ட மீன்பிடிப் படகைக் குறிக்கும் சூழலில், நவீன தமிழில் ‘படகு’ இயல்பானதும் துல்லியமானதும் ஆகும்; ‘கப்பல்’ அளவில் பெரிதான கலத்தை உணர்த்தக்கூடும்.
- source_word: ἐκόπασεν
  choice: அடங்கியது
  rationale: காற்று அல்லது புயல் தணிவதைச் சொல்லும் κοπάζω என்பதற்கு ‘அடங்கியது’ இயல்பான தமிழ் இணை. இது படிப்படியான செயல்முறையைத் தேவையின்றி சேர்க்காமல் நிகழ்வை நேரடியாகச் சொல்கிறது.
- source_word: ὁ ἄνεμος
  choice: காற்று
  rationale: கிரேக்க மூலத்தின் எழுவாயை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: καὶ
  choice: —
  rationale: தமிழில் முந்தைய நிகழ்வைத் தொடர்ந்து வரும் இவ்வசனத்தின் தொடர்பு வினையெச்சக் கால அமைப்பிலேயே இயல்பாக வெளிப்படுகிறது; தொடக்கத்தில் ‘மேலும்’ அல்லது ‘அப்போது’ சேர்ப்பது தேவையற்றதாகவோ சற்றே விளக்கவுரையாகவோ இருக்கும்.
theological_decisions:
- issue: இயற்கையின்மேல் இயேசுவின் அதிகாரத்தை நிகழ்வு மறைமுகமாக உணர்த்துதல்
  choice: அவர்கள் படகில் ஏறியதும் காற்று அடங்கியதாக நிகழ்வை மட்டும் நேரடியாகக் கூறுதல்
  alternative: இது இயேசுவின் அற்புத அதிகாரத்தால் நிகழ்ந்தது என்று மொழிபெயர்ப்பிலேயே வெளிப்படையாகச் சேர்த்தல்
  rationale: மூலவசனம் நிகழ்வுகளின் காலத் தொடர்பைத் தெரிவிக்கிறது; காரணத்தை வெளிப்படையாக விளக்கவில்லை. அதன் இறையியல் பொருள் சூழலில் விளங்கினாலும், மொழிபெயர்ப்பு மூலத்தில் இல்லாத காரண விளக்கத்தைச் சேர்க்கக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘படகில் ஏறியதும்’ என்பது இயல்பான தமிழ்; அடிக்குறிப்பு கிரேக்கத்தின் காலத்தைக் குறிக்கும் அமைப்பையும் ‘ஏறுதல்’ என்ற சொற்சார்ந்த நுணுக்கத்தையும் காட்டுகிறது.
