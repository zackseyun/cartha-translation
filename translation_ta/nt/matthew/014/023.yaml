source:
  edition: SBLGNT
  text: καὶ ἀπολύσας τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος κατ’ ἰδίαν προσεύξασθαι. ὀψίας δὲ γενομένης μόνος ἦν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/023.yaml
  text: And after dismissing the crowds[a], he went up on the mountain by himself to pray. When evening came, he was there alone.
translation:
  language: ta
  text: மக்களை அனுப்பிவிட்ட பின்பு, அவர் தனியாக[a] ஜெபிப்பதற்காக மலையின்மேல் ஏறினார். மாலை நேரமானபோது, அவர் அங்கே தனியாக இருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தனிப்பட்ட முறையில்” (κατ’ ἰδίαν).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύσας
  choice: அனுப்பிவிட்ட பின்பு
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் குறிக்கும் இறந்தகாலப் பெயரெச்சத்தின் காலத் தொடர்பை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: τοὺς ὄχλους
  choice: மக்களை
  rationale: சூழலில் கூடியிருந்த மக்கள் கூட்டங்களைக் குறிக்கிறது; தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: மலையின்மேல் ஏறினார்
  rationale: மலைப்பகுதியை நோக்கிய மேல்நோக்கிச் செல்லுதலைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: κατ’ ἰδίαν
  choice: தனியாக
  rationale: பிறரிடமிருந்து விலகித் தனியே இருப்பதையும் தனிப்பட்ட முறையில் செயற்படுவதையும் இச்சூழலில் இயல்பாகத் தருகிறது.
- source_word: προσεύξασθαι
  choice: ஜெபிப்பதற்காக
  rationale: இறைவேண்டல் செய்வதற்கான நோக்கத்தைக் குறிக்கும் infinitive-ஐத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ὀψίας δὲ γενομένης
  choice: மாலை நேரமானபோது
  rationale: காலச் சூழலைக் குறிக்கும் genitive absolute அமைப்பை நவீனத் தமிழில் இயல்பான காலவாக்கியமாகத் தருகிறது.
- source_word: μόνος ἦν ἐκεῖ
  choice: அவர் அங்கே தனியாக இருந்தார்
  rationale: μόνος வலியுறுத்தும் தனிமையையும் ἐκεῖ குறிக்கும் இடத்தையும் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் மரியாதைமிக்க வேதாகம நடையில் மொழிபெயர்க்கப்பட்டது. ‘தனியாக’ என்பது κατ’ ἰδίαν என்பதின் இடச்சார்ந்த தனிமையை இயல்பாகத் தருகிறது; அதன் ‘தனிப்பட்ட முறையில்’ என்ற நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
