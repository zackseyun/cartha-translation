- from: ஆனால் ஏரோதின் பிறந்தநாள் கொண்டாட்டம் வந்தபோது[a], ஏரோதியாளின் மகள் கூடியிருந்தவர்களின் நடுவில் நடனமாடி, ஏரோதுக்குப் பிடித்தவளானாள்[b].
  to: ஆனால் ஏரோதின் பிறந்தநாள் கொண்டாட்டம் நடந்தபோது[a], ஏரோதியாவின் மகள் நடுவில்[b] நடனமாடி, ஏரோதுக்கு மகிழ்ச்சியளித்தாள்.
