source:
  edition: SBLGNT
  text: ⸂γενεσίοις δὲ γενομένοις⸃ τοῦ Ἡρῴδου ὠρχήσατο ἡ θυγάτηρ τῆς Ἡρῳδιάδος ἐν τῷ μέσῳ καὶ ἤρεσεν τῷ Ἡρῴδῃ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/006.yaml
  text: But when Herod’s birthday came[a], the daughter of Herodias danced in the midst and pleased Herod[b],
translation:
  language: ta
  text: ஆனால் ஏரோதின் பிறந்தநாள் கொண்டாட்டம் நடந்தபோது[a], ஏரோதியாவின் மகள் நடுவில்[b] நடனமாடி, ஏரோதுக்கு மகிழ்ச்சியளித்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏரோதின் பிறந்தநாள் வந்தபோது” அல்லது “ஏரோதின் பிறந்தநாள் விருந்தின்போது.” கிரேக்கச் சொற்றொடர் ஏரோதின் பிறந்தநாள் கொண்டாடப்பட்ட நிகழ்வைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மத்தியில்.” இந்தச் சொற்றொடர் அவள் கூடியிருந்தவர்களின் மத்தியில் நடனமாடினாள் என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενεσίοις ... γενομένοις
  choice: ஏரோதின் பிறந்தநாள் கொண்டாட்டம் வந்தபோது
  rationale: γενέσια என்பது பிறந்தநாள் கடைப்பிடிப்பு அல்லது கொண்டாட்ட நிகழ்வைக் குறிக்கிறது; γενομένοις உடன் சேர்ந்த காலப் பயன்பாட்டை ‘வந்தபோது’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய நிகழ்விலிருந்து மெல்லிய மாறுபாட்டுடன் கதையை முன்னெடுக்கும் δέ-யின் நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: ἡ θυγάτηρ τῆς Ἡρῳδιάδος
  choice: ஏரோதியாளின் மகள்
  rationale: பெயரிடப்படாத மகள் என்ற மூலத்தின் தகவலை மட்டும் தருகிறது; சலோமி என்ற பாரம்பரிய அடையாளத்தை உரைக்குள் சேர்க்கவில்லை.
- source_word: ἐν τῷ μέσῳ
  choice: கூடியிருந்தவர்களின் நடுவில்
  rationale: சொற்பொருளான ‘நடுவில்’ என்பதைப் பேணியபடி, விருந்துக் கூட்டத்தின் மத்தியில் என்பதைக் தமிழில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ὠρχήσατο
  choice: நடனமாடி
  rationale: ὀρχέομαι என்பதன் நேரடியான பொருள்; நிகழ்ச்சியின் தன்மையைத் தேவையின்றி விரிவுபடுத்தவில்லை.
- source_word: ἤρεσεν τῷ Ἡρῴδῃ
  choice: ஏரோதுக்குப் பிடித்தவளானாள்
  rationale: ἀρέσκω உடன் வரும் தத்திவின் ‘ஒருவருக்குப் பிடித்திருத்தல்/மகிழ்ச்சியளித்தல்’ என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: Ἡρῴδου / Ἡρῴδῃ
  choice: ஏரோது
  rationale: தனிப்பெயரின் நிலையான தமிழ் ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
