translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான கதைநடை பயன்படுத்தப்பட்டுள்ளது. தேவையற்ற விளக்கச் சேர்க்கைகள் தவிர்க்கப்பட்டு, கிரேக்க மூலத்தின் காலக் குறிப்பு, இடத்தின் தன்மை, நேரம் கடந்துவிட்டது என்ற உருவகம் ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
