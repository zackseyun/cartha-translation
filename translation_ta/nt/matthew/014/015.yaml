id: MAT.14.15
reference: Matthew 14:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὀψίας δὲ γενομένης προσῆλθον αὐτῷ οἱ ⸀μαθηταὶ λέγοντες· Ἔρημός ἐστιν ὁ τόπος καὶ ἡ ὥρα ἤδη παρῆλθεν· ἀπόλυσον τοὺς ὄχλους, ἵνα ἀπελθόντες εἰς τὰς κώμας ἀγοράσωσιν ἑαυτοῖς βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/015.yaml
  text: When evening came[a], the disciples came to him and said, “The place is deserted, and the hour is already late. Send the crowds away[b], so that they may go into the villages and buy food for themselves.”
translation:
  language: ta
  text: மாலை நேரமானபோது, சீடர்கள் அவரிடம் வந்து, “இந்த இடம் ஒதுக்குப்புறமானது; நேரமும் ஏற்கெனவே கடந்துவிட்டது. மக்கள் கூட்டங்களை அனுப்பிவிடுங்கள்; அவர்கள் கிராமங்களுக்குப் போய் தங்களுக்காக உணவு வாங்கிக்கொள்ளும்படி” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀψίας δὲ γενομένης
  choice: மாலை நேரமானபோது
  rationale: காலத்தைக் குறிக்கும் genitive absolute அமைப்பை இயல்பான நவீனத் தமிழில் தருகிறது. δέ இங்குக் கதை நகர்வைக் குறிக்கிறது; தனியாக ‘இப்போது’ என்று சேர்க்க வேண்டியதில்லை.
- source_word: προσῆλθον αὐτῷ
  choice: அவரிடம் வந்து
  rationale: προσέρχομαι என்பதன் ‘அணுகுதல்/ஒருவரிடம் வருதல்’ என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: οἱ μαθηταὶ
  choice: சீடர்கள்
  rationale: சூழலில் ஏற்கெனவே அறியப்பட்ட சீடர் குழுவைக் குறிக்கிறது; மூலத்தில் இல்லாத ‘அவருடைய’ என்பதைச் சேர்க்கவில்லை.
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: இந்த இடம் மக்கள் வசிக்காத இடம்
  rationale: ἔρημος இங்கு அருகில் குடியிருப்பு இல்லாத அல்லது மக்கள் வசிக்காத இடத்தைக் குறிக்கிறது; புவியியல் பாலைவனம் என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: ἡ ὥρα ἤδη παρῆλθεν
  choice: நேரமும் ஏற்கெனவே கடந்துவிட்டது
  rationale: ‘நேரம் கடந்துவிட்டது’ என்ற மூல உருவகத்தைப் பாதுகாக்கிறது; சூழலில் நாள் மிகவும் ஆகிவிட்டது என்பதே கருத்து.
- source_word: ἀπόλυσον τοὺς ὄχλους
  choice: மக்கள் கூட்டங்களை அனுப்பிவிடுங்கள்
  rationale: ἀπολύω இங்கு கூட்டத்தைக் கலைத்து அனுப்புதல் என்ற நடைமுறைப் பொருளில் வருகிறது. இயேசுவை நோக்கிய ஒருமை கட்டளையை நவீனத் தமிழின் மரியாதை வடிவில் தருகிறது.
- source_word: ἵνα ἀπελθόντες εἰς τὰς κώμας
  choice: அவர்கள் கிராமங்களுக்குப் போய்
  rationale: நோக்கத்தைக் குறிக்கும் ἵνα வாக்கியத்தையும் அதனுள் உள்ள பங்கேற்பு வினையையும் இயல்பான தமிழ் தொடராக அமைக்கிறது; மூலத்தில் இல்லாத ‘அருகிலுள்ள’ என்பதைச் சேர்க்கவில்லை.
- source_word: ἀγοράσωσιν ἑαυτοῖς βρώματα
  choice: தங்களுக்காக உணவு வாங்கிக்கொள்ளட்டும்
  rationale: βρώματα என்பதற்கு பொதுவான ‘உணவு’ என்றும், ἑαυτοῖς என்ற தற்சுட்டுப் பொருளுக்கு ‘தங்களுக்காக’ என்றும் தெளிவாகத் தருகிறது.
