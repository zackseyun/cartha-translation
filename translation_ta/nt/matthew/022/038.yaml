  text: This is the great and first commandment[a].
translation:
  language: ta
  text: இதுவே மகத்தானதும் முதலாவதுமான கட்டளை[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “இதுவே முதன்மையான கட்டளை.” கிரேக்க மூலத்தில் இரண்டு தனித்த விளக்கச் சொற்கள் உள்ளன: “மகத்தானதும் முதலாவதுமான கட்டளை.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: இதுவே
  rationale: முந்தைய வசனத்தில் மேற்கோள் காட்டப்பட்ட கட்டளையைச் சுட்டுகிறது. ‘-வே’ என்பது அந்தக் கட்டளையையே வலியுறுத்தும் இயல்பான தமிழ்ச் சொல்லாக்கம்.
- source_word: ἐστὶν
  choice: ஆகும் (தமிழில் வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை)
  rationale: இது எளிய இணைப்பு வினைச்சொல். இயல்பான தமிழ்ப் பெயர்வாக்கியத்தில் இதற்கான தனிச் சொல் தேவையில்லை; ‘இதுவே … கட்டளை’ என்ற அமைப்பே அதன் பொருளைத் தருகிறது.
- source_word: μεγάλη
  choice: மகத்தான
  rationale: இங்கு அளவை அல்ல, முக்கியத்துவத்தையும் உயர்ந்த நிலையையும் குறிக்கிறது. ‘மிகப் பெரிய’ என்பது மூலத்திலுள்ள நேர்நிலைப் பெயரடையை உயர்நிலைப் பொருளாக மாற்றக்கூடும்.
- source_word: πρώτη
  choice: முதலாவதுமான
  rationale: கட்டளைகளின் வரிசை அல்லது தரத்தில் ‘முதல்’ என்பதைக் குறிக்கும் சொல்லை நேரடியாகப் பாதுகாக்கிறது; μεγάλη என்பதன் பொருளோடு இதை ஒன்றிணைத்துவிடவில்லை.
- source_word: ἐντολή
  choice: கட்டளை
  rationale: வேதச்சட்டச் சூழலில் அதிகாரபூர்வமாகக் கொடுக்கப்பட்ட கட்டளையை இயல்பான, தெளிவான நவீன தமிழில் குறிக்கிறது.
theological_decisions:
- issue: μεγάλη மற்றும் πρώτη ஆகிய இரு பெயரடைகளுக்கும் இடையிலான உறவு
  choice: ‘மகத்தானதும் முதலாவதுமான கட்டளை’ என்று இரண்டையும் இணையான தனித்தனி விளக்கங்களாக மொழிபெயர்த்தல்
  alternative: ‘முதன்மையான கட்டளை’ என்று இரண்டையும் ஒரே கருத்தாகச் சுருக்குதல்
  rationale: கிரேக்கத்தில் μεγάλη, πρώτη என்ற இரண்டு நேர்நிலைப் பெயரடைகளும் ἐντολή என்பதைக் தனித்தனியாக விவரிக்கின்றன. இரண்டையும் வெளிப்படையாக வைத்திருப்பது மகத்துவம் மற்றும் முதன்மை ஆகியவற்றுக்கிடையிலான உரையின் நுட்பமான வேறுபாட்டைப் பாதுகாக்கிறது; ‘மிகச் சிறந்தது’ போன்ற உயர்நிலைப் பொருளைத் தேவையின்றி புகுத்துவதையும் தவிர்க்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘மகத்தான’ என்பது முக்கியத்துவத்தைக் குறிக்கிறது; ‘முதலாவதுமான’ என்பது மூலத்தில் உள்ள இரண்டாவது தனித்த விளக்கத்தைப் பாதுகாக்கிறது.
