id: MAT.22.18
reference: Matthew 22:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς τὴν πονηρίαν αὐτῶν εἶπεν· Τί με πειράζετε, ὑποκριταί;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/018.yaml
  text: But Jesus[a], knowing their evil intent, said, “Why are you testing me[b], hypocrites?”
translation:
  language: ta
  text: ஆனால் இயேசு அவர்களுடைய தீய நோக்கத்தை அறிந்து, “வெளிவேடக்காரர்களே, ஏன் என்னைச் சோதிக்கிறீர்கள்?[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏன் என்னைச் சிக்கவைக்க முயல்கிறீர்கள்?” கிரேக்க வினைச்சொல் சூழலுக்கேற்ப “சோதித்தல்,” “முயன்று பார்த்தல்,” அல்லது “தீமைக்குத் தூண்டுதல்” என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: அறிந்து
  rationale: γινώσκω என்பதன் இறந்தகால வினையெச்சமாக, இயேசு அவர்களின் நோக்கத்தை உணர்ந்திருந்ததை இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: அவர்களின் வஞ்சகமான அணுகுமுறைக்கும் இயேசுவின் பதிலுக்கும் இடையிலான மென்மையான முரண்பாட்டைக் காட்டுகிறது.
- source_word: πονηρίαν
  choice: தீய நோக்கத்தை
  rationale: இச்சூழலில் பொதுவான தீமையைவிட, கேள்விக்குப் பின்னிருந்த பகைமையான உள்நோக்கமே முன்னிலைப்படுவதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: εἶπεν
  choice: என்றார்
  rationale: λέγω என்பதன் இறந்தகால வடிவத்திற்கான இயல்பான தமிழ் கதைநடைச் சொல்.
- source_word: Τί
  choice: ஏன்
  rationale: வினையுடன் வரும் τί இங்கு காரணத்தைக் கேட்கும் வழக்கில் இருப்பதால், தமிழில் இயல்பாக ‘ஏன்’ என வழங்கப்படுகிறது.
- source_word: πειράζετε
  choice: சோதிக்கிறீர்கள்
  rationale: πειράζω என்பது சோதித்தல் அல்லது தூண்டிச் சிக்கவைத்தல் ஆகிய பொருள்களைக் கொள்ளலாம். இங்கு இயேசுவை வலையில் சிக்கவைக்க முயல்வதை ‘சோதிக்கிறீர்கள்’ தெளிவாகவும் பொருள் அகலத்தை ஓரளவு காத்தும் தெரிவிக்கிறது.
- source_word: ὑποκριταί
  choice: வெளிவேடக்காரர்களே
  rationale: உள்ளே பகைமையை மறைத்துக்கொண்டு வெளியே நேர்மையானவர்களைப்போல் நடிப்பவர்களைக் குறிக்கும் பொருளை, நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இயேசு எதிரிகளின் உள்ளார்ந்த நோக்கத்தை அறிந்தது
  choice: அவர்களுடைய தீய நோக்கத்தை அறிந்து
  alternative: அவர்களுடைய தீமையை உணர்ந்து / அவர்களுடைய வஞ்சகத்தை அறிந்து
  rationale: மூலவசனம் அவர்களின் அணுகுமுறையின் ஒழுக்கரீதியான தீமையை இயேசு துல்லியமாக அறிந்ததாகக் கூறுகிறது; இதை அதற்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கமாக விரிவுபடுத்தாமல் மொழிபெயர்ப்பு காக்கிறது.
- issue: πειράζετε என்பதன் பொருள்
  choice: சோதிக்கிறீர்கள்
  alternative: சிக்கவைக்க முயல்கிறீர்கள் / சோதனைக்கு உட்படுத்துகிறீர்கள்
  rationale: அவர்கள் இயேசுவை ஒரு கேள்வியின் மூலம் வலையில் சிக்கவைக்க முயன்ற சூழலைக் காக்கும் அதேவேளையில், வினைச்சொல்லின் ‘சோதித்தல்’ என்ற அடிப்படைப் பொருளையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வெளிவேடக்காரர்களே’ என்பது பழக்கமான ‘மாயக்காரர்களே’ என்பதைக் காட்டிலும் ὑποκριταί என்பதிலுள்ள போலியான வெளித்தோற்றத்தைத் தெளிவாக எடுத்துரைக்கிறது.
