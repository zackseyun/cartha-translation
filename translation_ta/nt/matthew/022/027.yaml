translation:
  language: ta
  text: அவர்களெல்லாருக்கும் பிறகு[a] அந்தப் பெண்ணும் இறந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடைசியாக அந்தப் பெண்ணும் இறந்தாள்.” கிரேக்கத்தில், “அனைவருக்கும் பின்னர் அந்தப் பெண்ணும் இறந்தாள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον ... πάντων
  choice: எல்லாருக்கும் பிறகு
  rationale: ὕστερον என்பதும் πάντων என்பதும் இணைந்து நிகழ்வுகளின் வரிசையில் ‘அனைவருக்கும் பின்பு/கடைசியாக’ என்ற பொருளைத் தருகின்றன. முன்னர் கூறப்பட்ட சகோதரர்கள் அனைவருக்குப் பிறகு அவள் இறந்தாள் என்பதை இயல்பான தமிழில் இது தெரிவிக்கிறது.
- source_word: δὲ
  choice: தனி இணைப்புச் சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: δέ இங்கு மென்மையான தொடரிணைப்பு. தமிழில் ‘எல்லாருக்கும் பிறகு’ என்ற தொடரே அதன் தொடர்ச்சிப் பங்கை இயல்பாக ஏற்றுக்கொள்கிறது.
- source_word: ἀπέθανεν
  choice: இறந்தாள்
  rationale: இறப்பை நேரடியாகக் குறிப்பிடும் எளிய வினை; தேவையற்ற இடக்கரடக்கலைத் தவிர்க்கிறது. பெண்பால் எழுவாய்க்கேற்ப ‘இறந்தாள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἡ γυνή
  choice: அந்தப் பெண்
  rationale: γυνή என்பதற்கு ‘பெண்’ அல்லது ‘மனைவி’ என்று பொருள் வரலாம். பல கணவர்களை உள்ளடக்கிய இந்தச் சூழலில், ஒரே ஆணின் பார்வையைச் சுட்டாத ‘அந்தப் பெண்’ என்பது கிரேக்கச் சொல்லின் குறிப்பைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அந்தப் பெண்ணும்’ என்பதில் உள்ள ‘-உம்’, முன்பு இறந்த சகோதரர்களைத் தொடர்ந்து அவளும் இறந்தாள் என்ற இயல்பான தமிழ்த் தொடர்ச்சியை வெளிப்படுத்துகிறது.
