- from: எங்களிடையே ஏழு சகோதரர்கள் இருந்தார்கள். முதலாமவன் திருமணம் செய்து இறந்தான். அவனுக்குச் சந்ததி இல்லாததால்[a], தன் மனைவியைத் தன் சகோதரனுக்கு விட்டுச்சென்றான்[b].
