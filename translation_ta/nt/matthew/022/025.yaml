source:
  edition: SBLGNT
  text: ἦσαν δὲ παρ’ ἡμῖν ἑπτὰ ἀδελφοί· καὶ ὁ πρῶτος ⸀γήμας ἐτελεύτησεν, καὶ μὴ ἔχων σπέρμα ἀφῆκεν τὴν γυναῖκα αὐτοῦ τῷ ἀδελφῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/025.yaml
  text: There were seven brothers among us[a]. The first married and died, and having no offspring[b], he left his wife to his brother.
translation:
  language: ta
  text: எங்களிடையே ஏழு சகோதரர்கள் இருந்தார்கள். முதலாமவன் திருமணம் செய்து இறந்தான். அவனுக்குச் சந்ததி இல்லாமல்[a], தன் மனைவியைத் தன் சகோதரனுக்கு விட்டுச்சென்றான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'நேர்ப்பொருள்: ‘விதை இல்லாமல்.’ இங்கு ‘விதை’ என்பது சந்ததி அல்லது வழித்தோன்றல்களைக் குறிக்கிறது.'
    reason: lexical_alternative
  - marker: b
    text: இது, இறந்த ஒருவனுக்குச் சந்ததி உண்டாக்கும் பொருட்டு அவனுடைய சகோதரன் அந்த விதவையை மணந்துகொள்ள வேண்டும் என்ற மைத்துனத் திருமண வழக்கைக் குறிக்கிறது; உபாகமம் 25:5-ஐப் பார்க்கவும்.
    reason: cultural_note
lexical_decisions:
- source_word: παρ’ ἡμῖν
  choice: எங்களிடையே
  rationale: παρά + dative இங்கு குழுவினரிடையே இருப்பதைக் குறிக்கிறது; ‘எங்களிடையே’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: ἑπτὰ ἀδελφοί
  choice: ஏழு சகோதரர்கள்
  rationale: லேவிரேட் திருமணச் சூழலில் ἀδελφοί ஆண் உடன்பிறந்தவர்களைக் குறிக்கிறது.
- source_word: ὁ πρῶτος
  choice: முதலாமவன்
  rationale: πρῶτος வயதில் மூத்தவன் என்பதை அவசியமாகக் குறிக்காமல், வரிசையில் முதலானவனைக் குறிக்கிறது.
- source_word: γήμας
  choice: திருமணம் செய்து
  rationale: இறப்பதற்கு முன் திருமணம் நிகழ்ந்தது என்ற aorist participle-இன் காலவரிசையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐτελεύτησεν
  choice: இறந்தான்
  rationale: சொல்லின் நேரடியான பொருளைத் தெளிவாகவும் தேவையற்ற மங்கலவழக்கின்றியும் தருகிறது.
- source_word: μὴ ἔχων σπέρμα
  choice: அவனுக்குச் சந்ததி இல்லாததால்
  rationale: σπέρμα என்பதன் நேர்ப்பொருள் ‘விதை’; இக்குடும்ப மற்றும் சட்டச் சூழலில் அது பிள்ளைகள் அல்லது வழித்தோன்றல்களைக் குறிக்கிறது. ‘சந்ததி’ அந்த மரபுவழிப் பொருளைத் தக்கவைக்கிறது.
- source_word: ἀφῆκεν τὴν γυναῖκα αὐτοῦ
  choice: தன் மனைவியை ... விட்டுச்சென்றான்
  rationale: ἀφίημι இங்கு இறப்பின்போது விட்டுச்செல்வதைக் குறிக்கிறது; விவாகரத்து செய்தான் அல்லது கைவிட்டான் என்று பொருளல்ல.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: தன் சகோதரனுக்கு
  rationale: தொடர்புடைய dative-ஐ நேரடியாகக் காட்டுகிறது; திருமணம் செய்யும்படி என்ற விளக்கத்தை மூலத்தில் இல்லாதவாறு முதன்மை உரையில் சேர்க்கவில்லை.
theological_decisions:
- issue: இறந்தவனின் சகோதரன் விதவையை மணக்கும் வழக்கத்தை முதன்மை உரையில் வெளிப்படையாகச் சொல்வதா
  choice: கிரேக்கத்தில் உள்ள மறைமுகமான சொற்றொடரை மட்டும் முதன்மை உரையில் வைத்தல்
  alternative: ‘தன் சகோதரன் மணந்துகொள்ளும்படி மனைவியை விட்டுச்சென்றான்’ என்று விரித்துரைத்தல்
  rationale: உபாகமம் 25:5 சார்ந்த பண்பாட்டு மற்றும் சட்டப் பின்னணி இங்கு கருதப்பட்டாலும், ‘மணந்துகொள்ளும்படி’ என்று கிரேக்க உரை வெளிப்படையாகக் கூறவில்லை. எனவே அந்தப் பின்னணி அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, நேரடியான, கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘முதலாமவன்’ வரிசையை மட்டும் காட்டுகிறது; ‘மூத்தவன்’ என்ற ஆதாரமற்ற வயது விளக்கம் தவிர்க்கப்பட்டது. கிரேக்கத்தின் மறைமுகமான சட்டப் பின்னணி முதன்மை உரையில் விரித்துரைக்கப்படாமல் அடிக்குறிப்பில் விளக்கப்பட்டது.
