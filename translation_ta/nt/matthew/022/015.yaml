source:
  edition: SBLGNT
  text: Τότε πορευθέντες οἱ Φαρισαῖοι συμβούλιον ἔλαβον ὅπως αὐτὸν παγιδεύσωσιν ἐν λόγῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/015.yaml
  text: Then the Pharisees went and took counsel how they might trap him in his words[a].
translation:
  language: ta
  text: அப்போது பரிசேயர்கள் சென்று, அவருடைய பேச்சிலே அவரைச் சிக்கவைக்க எப்படியென்று ஆலோசனை செய்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் சொல்வதைக் கொண்டு அவரைச் சிக்கவைக்கத் திட்டமிட்டார்கள்.”
    reason: ἐν λόγῳ என்பதற்கு ‘அவருடைய பேச்சிலே’ அல்லது ‘அவர் சொல்வதைக் கொண்டு’ என மொழிபெயர்க்கலாம்; συμβούλιον ἔλαβον என்பதையும் சூழலுக்கேற்ப ‘திட்டமிட்டார்கள்’ எனத் தரலாம்.
lexical_decisions:
- source_word: Τότε
  choice: அப்போது
  rationale: கதை நிகழ்வுகளின் தொடர்ச்சியைக் குறிக்கும் இயல்பான, சுருக்கமான கால அடைமொழி.
- source_word: πορευθέντες
  choice: போய்
  rationale: முதன்மை வினைக்கு முன் நிகழும் இயக்கத்தைத் தமிழில் இயல்பான வினையெச்ச வடிவில் தருகிறது.
- source_word: οἱ Φαρισαῖοι
  choice: பரிசேயர்கள்
  rationale: இக்குழுவின் பெயருக்கான தமிழில் நிலைபெற்ற வடிவம்.
- source_word: συμβούλιον ἔλαβον
  choice: ஆலோசனை செய்தார்கள்
  rationale: ‘ஆலோசனை மேற்கொண்டார்கள்/திட்டம் வகுத்தார்கள்’ என்ற கிரேக்க மரபுத்தொடரின் விவாதித்து முடிவெடுக்கும் பொருளை இயல்பான தமிழில் தருகிறது; பகைமை நோக்கம் அடுத்த நோக்கக் கூறில் வெளிப்படுகிறது.
- source_word: ὅπως
  choice: எப்படி என்று
  rationale: அவர்களின் ஆலோசனையின் உள்ளடக்கத்தையும் நோக்கத்தையும் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: αὐτὸν
  choice: அவரை
  rationale: சூழலில் இயேசுவைக் குறிக்கும் நேரடிச் செயப்படுபொருள்; மரியாதை ஒருமை தமிழில் பொருத்தமானது.
- source_word: παγιδεύσωσιν
  choice: சிக்கவைக்க
  rationale: வலையில் அகப்படுத்துதல் என்ற உருவகத்தையும் தீய நோக்கத்தையும் நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ἐν λόγῳ
  choice: அவர் சொல்லும் வார்த்தையிலேயே
  rationale: λόγος இங்கு அவர் கூறவிருக்கும் பேச்சு அல்லது கூற்றைக் குறிக்கிறது. ‘-இலேயே’ என்பது அவர் சொல்லும் ஒன்றிலேயே அவரைப் பிடிக்க முயன்ற கருத்தை இயல்பாக வெளிப்படுத்துகிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: συμβούλιον ἔλαβον என்பதில் பகைமை எவ்வளவு வெளிப்படையாக மொழிபெயர்க்கப்பட வேண்டும்
  choice: ‘ஆலோசனை செய்தார்கள்’ என்று ஒப்பீட்டளவில் நடுநிலையாக மொழிபெயர்த்து, தீய நோக்கத்தை ‘சிக்கவைக்க’ என்ற நோக்கக் கூறு வெளிப்படுத்துமாறு செய்தல்
  alternative: ‘சதித்திட்டம் தீட்டினார்கள்’ என்று மொழிபெயர்த்தல்
  rationale: வசனத்தில் பகைமை தெளிவாக இருந்தாலும், அது முதன்மையாக παγιδεύσωσιν என்ற சொல்லில் வெளிப்படுகிறது. ஆகவே ஆலோசனை குறித்த மரபுத்தொடருக்கு தேவையற்ற கூடுதல் தீவிரம் சேர்க்காமல் மூலத்தின் அமைப்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் மரியாதையான நடையில் வடிவமைக்கப்பட்டது. கிரேக்க வாக்கியத்தின் நிகழ்வுத் தொடர், ஆலோசனை, நோக்கம் ஆகியவை தமிழின் இயல்பான சொல் வரிசையில் பாதுகாக்கப்பட்டுள்ளன.
