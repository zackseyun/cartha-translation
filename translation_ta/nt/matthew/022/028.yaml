id: MAT.22.28
reference: Matthew 22:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐν τῇ ⸂ἀναστάσει οὖν⸃ τίνος τῶν ἑπτὰ ἔσται γυνή; πάντες γὰρ ἔσχον αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/028.yaml
  text: In the resurrection[a], then, whose wife of the seven will she be? For they all had her.
translation:
  language: ta
  text: உயிர்த்தெழுதலின்போது, அப்படியானால், அந்த ஏழுபேரில் அவள் யாருடைய மனைவியாக இருப்பாள்? ஏனெனில், அவர்கள் எல்லாரும் அவளை மனைவியாகக் கொண்டிருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கில் சொல்லுக்குச் சொல், “அவர்கள் எல்லாரும் அவளைக் கொண்டிருந்தார்கள்.” இதன் பொருள், ஏழுபேரும் ஒவ்வொருவராக அவளை மணந்தார்கள் என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάσει
  choice: உயிர்த்தெழுதலின்போது
  rationale: ἐν உடன் வரும் இச்சொல் இங்கு எதிர்கால உயிர்த்தெழுதல் நிகழும் காலத்தையும் நிலையையும் குறிக்கிறது. ‘உயிர்த்தெழுதலின்போது’ என்பது நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: οὖν
  choice: அப்படியானால்
  rationale: முன்வைக்கப்பட்ட நிகழ்விலிருந்து தொடரும் முடிவுக்கேள்வியை இது குறிக்கிறது; தமிழில் ‘அப்படியானால்’ அந்தத் தர்க்கத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τίνος τῶν ἑπτὰ
  choice: அந்த ஏழுபேரில் ... யாருடைய
  rationale: ஏழுபேர் கொண்ட குழுவிலிருந்து ஒருவரை அடையாளம் கேட்கும் உறவுநிலைப் பொருளைத் தெளிவாகவும் இயல்பான தமிழ் சொல் வரிசையிலும் தருகிறது.
- source_word: γυνή
  choice: மனைவி
  rationale: γυνή என்பதற்கு ‘பெண்’ என்றும் பொருள் உண்டு; ஆனால் இங்குள்ள திருமணச் சூழல் ‘மனைவி’ என்ற பொருளையே கோருகிறது.
- source_word: πάντες
  choice: அவர்கள் எல்லாரும்
  rationale: இது ஏழு சகோதரர்களையும் ஒட்டுமொத்தமாகக் குறிக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: கேள்விக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பைத் தெளிவாகக் காக்கிறது.
- source_word: ἔσχον αὐτήν
  choice: அவளை மனைவியாகக் கொண்டிருந்தார்கள்
  rationale: கிரேக்கின் ‘அவளைக் கொண்டிருந்தார்கள்’ என்ற சுருக்கமான திருமண மரபுத்தொடரின் பொருளைத் தமிழில் தவறாகப் புரிந்துகொள்ள முடியாதவாறு வெளிப்படுத்துகிறது; சொல்லுக்குச் சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: சதுசேயர்களின் கேள்வியில் ἀνάστασις என்பதன் பொருள்
  choice: இறந்தோர் எதிர்காலத்தில் உயிர்த்தெழும் நிகழ்வு
  alternative: பொதுவான மரணத்திற்குப் பிந்தைய வாழ்க்கை
  rationale: சூழலில் சதுசேயர்கள் குறிப்பாக உயிர்த்தெழுதலை மறுத்து வாதிடுகின்றனர்; தொடர்ந்து இயேசுவும் அதே பொருளுக்குப் பதிலளிக்கிறார். எனவே பொதுவான மறுமை வாழ்வாக விரிவுபடுத்தாமல் ‘உயிர்த்தெழுதல்’ என்ற குறிப்பான கருத்து காக்கப்படுகிறது.
translation_notes:
  register: நவீன தரமான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கேள்வியின் தர்க்கத் தொடரை ‘அப்படியானால்’ காக்கிறது; ‘அந்த ஏழுபேரில் ... யாருடைய’ என்ற சொல் வரிசை இயல்பான தமிழுக்காகப் பயன்படுத்தப்பட்டுள்ளது.
