source:
  edition: SBLGNT
  text: λέγοντες· Διδάσκαλε, Μωϋσῆς εἶπεν· Ἐάν τις ἀποθάνῃ μὴ ἔχων τέκνα, ἐπιγαμβρεύσει ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα αὐτοῦ καὶ ἀναστήσει σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/024.yaml
  text: saying[a], “Teacher, Moses said, ‘If a man dies without having children, his brother shall marry his wife and raise up offspring for his brother.’”
translation:
  language: ta
  text: அவர்கள், “போதகரே, ‘ஒருவன் பிள்ளைகள் இல்லாமல் இறந்துபோனால், இறந்தவனுடைய சகோதரன் அவனுடைய மனைவியை மணந்து,[a] தன் சகோதரனுக்காகச் சந்ததியை ஏற்படுத்த வேண்டும்’ என்று மோசே கூறியிருக்கிறார்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் முறைப்படியாக, “இறந்தவனுடைய சகோதரன் அவனுடைய விதவையை மணப்பதற்குரிய கடமையை நிறைவேற்ற வேண்டும்” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் கணவனின் சகோதரன் விதவையை மணக்கும் மைத்துனத் திருமண முறையைக் குறிப்பாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διδάσκαλε
  choice: போதகரே
  rationale: இயேசுவை கற்பிப்பவராக நேரடியாக அழைக்கும் மரியாதைமிக்க, இயல்பான நவீனத் தமிழ் சொல்.
- source_word: Ἐάν τις ἀποθάνῃ
  choice: ஒருவன் ... இறந்துபோனால்
  rationale: விவாதிக்கப்படும் மோசேயின் சட்டச் சூழல் ஆண் ஒருவரையும் அவருடைய சகோதரனையும் குறிப்பதால், மூலத்தின் பாலினக் குறிப்பைத் தக்கவைக்கிறது.
- source_word: μὴ ἔχων τέκνα
  choice: பிள்ளைகள் இல்லாமல்
  rationale: τέκνα என்பது மகன்களை மட்டும் அல்லாமல் பிள்ளைகளைப் பொதுவாகக் குறிக்கிறது; தமிழில் சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἐπιγαμβρεύσει
  choice: அவனுடைய மனைவியை மணந்து
  rationale: இறந்த சகோதரனின் விதவையை மணக்கும் மைத்துனக் கடமையின் மையப் பொருளை இயல்பான தமிழில் தருகிறது; அதன் சிறப்புச் சட்டப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: அவனுடைய மனைவியை
  rationale: மூலத்தின் நேரடியான உறவுச் சொல்லைத் தக்கவைக்கிறது; சூழலில் அவர் இறந்தவரின் விதவை என்பது தெளிவு.
- source_word: ἀναστήσει σπέρμα
  choice: வழித்தோன்றலை உருவாக்க வேண்டும்
  rationale: சந்ததியை இறந்த சகோதரனின் பெயரிலும் குடும்ப வரிசையிலும் நிலைநிறுத்துவதைச் சுட்டும் எபிரேயச் சட்ட மரபின் கருத்தை இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: தன் சகோதரனுக்காக
  rationale: அந்த வழித்தோன்றல் இறந்த சகோதரனுக்குரியதாகக் கணிக்கப்படுவதைக் காட்டும் பயன்/தொடர்பு வேற்றுமைப் பொருளை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: மோசேயின் சட்ட எடுத்துக்காட்டிலுள்ள பாலினக் குறிப்புகள்
  choice: “ஒருவன்,” “அவனுடைய சகோதரன்” என்று ஆண்பால் உறவுகளை வெளிப்படையாகத் தக்கவைத்தல்
  alternative: “ஒருவர்,” “அவருடைய உடன்பிறந்தவர்” என்று பாலினப் பொதுமையாக்குதல்
  rationale: லேவிரேட்டு திருமணச் சட்டம் இறந்த ஆண், அவனுடைய சகோதரன், அவனுடைய விதவை ஆகிய குறிப்பிட்ட குடும்பப் பங்குகளைப் பற்றியது; ஆகவே மூலத்தின் நோக்கத்துக்கேற்ற ஆண்பால் அமைப்பு பாதுகாக்கப்படுகிறது.
- issue: σπέρμα என்பதன் உருவக மற்றும் சட்டப் பொருள்
  choice: “வழித்தோன்றல்”
  alternative: “வித்து” அல்லது “சந்ததி”
  rationale: சொல்லுக்கு சொல் “வித்து” என்ற உருவகத்தை விட, இங்கு இறந்த சகோதரனுக்காகத் தொடரும் குடும்ப வழியைச் சுட்டும் சட்டப் பொருள் முக்கியம். “வழித்தோன்றல்” அந்தத் தொடர்பைத் தெளிவாக்குகிறது; எண்ணிக்கை அல்லது பாலினத்தை தேவையின்றி நிர்ணயிப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்கு புரியும் மரியாதைமிக்க சட்ட மேற்கோள் நடை பயன்படுத்தப்பட்டுள்ளது. “போதகரே” என்பது தெளிவான நேரடி அழைப்பு. மேற்கோளுக்குள் மேற்கோள் இருப்பது தமிழ் நிறுத்தக்குறிகளால் தெளிவுபடுத்தப்பட்டுள்ளது; [a] குறி அது விளக்கும் “மணந்து” என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
