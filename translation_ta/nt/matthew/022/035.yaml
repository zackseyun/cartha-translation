  text: And one of them, a lawyer, asked him a question, testing him.
translation:
  language: ta
  text: அவர்களில் ஒருவனான திருச்சட்ட அறிஞன்[a], அவரைச் சோதிப்பதற்காக அவரிடம் ஒரு கேள்வி கேட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திருச்சட்ட வல்லுநன்.” கிரேக்கச் சொல் யூதத் திருச்சட்டத்தில் தேர்ச்சி பெற்ற ஒருவரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: (தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை)
  rationale: தமிழில் முந்தைய வாக்கியத்துடன் இயல்பான தொடர்ச்சி அமைவதால், καὶ என்பதைக் கட்டாயமாக ‘மேலும்’ அல்லது ‘அப்போது’ என்று சேர்க்காமல் விடுவது இயல்பான நடை; ‘அப்போது’ என்ற காலநுணுக்கத்தையும் தேவையின்றி சேர்க்கவில்லை.
- source_word: ἐπηρώτησεν
  choice: அவரிடம் ஒரு கேள்வி கேட்டான்
  rationale: வினைச்சொல்லின் ‘கேட்டான்/வினவினான்’ என்ற பொருளை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது. ‘விசாரித்தான்’ என்பது இச்சூழலைவிட கடுமையான விசாரணைத் தொனியைத் தரக்கூடும்.
- source_word: εἷς ἐξ αὐτῶν
  choice: அவர்களில் ஒருவனான
  rationale: பேசியவன் முன்பு குறிப்பிடப்பட்ட குழுவைச் சேர்ந்தவன் என்ற பகுதிப்பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: νομικὸς
  choice: திருச்சட்ட அறிஞன்
  rationale: இச்சொல் பொதுவான நீதிமன்ற வழக்கறிஞரை அல்ல, யூதத் திருச்சட்டத்தில் தேர்ச்சி பெற்ற நிபுணரைக் குறிக்கிறது. தேர்ந்த சொல் இன்றைய வாசகருக்கு அந்தச் சூழலைத் தெளிவாக்குகிறது.
- source_word: πειράζων
  choice: அவரைச் சோதிப்பதற்காக
  rationale: இங்கு இயேசுவைத் தீய செயலுக்கு ஈர்ப்பதைவிட, அவரைச் சவாலான முறையில் பரிசோதிக்கும் நோக்கமே முன்னிலையில் உள்ளது. நோக்கத்தைக் குறிக்கும் பெயரெச்சத்தின் வலிமையைத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: αὐτόν
  choice: அவரை
  rationale: சூழலில் இயேசுவைக் குறிக்கும் நேரடி சுட்டுப்பெயரைப் பேணுகிறது; மூலத்தில் இல்லாத இயேசுவின் பெயரை வசனத்திற்குள் சேர்க்கவில்லை.
theological_decisions:
- issue: πειράζων என்பதன் ‘சோதித்தல்’ அல்லது ‘தீமைக்கு தூண்டுதல்’ என்ற நுணுக்கம்
  choice: அவரைச் சோதிப்பதற்காக
  alternative: அவரைத் தூண்டிச் சிக்கவைக்க முயன்று
  rationale: கிரேக்கச் சொல் சோதித்தல், முயன்று பார்த்தல், சோதனைக்கு உட்படுத்துதல் ஆகிய பொருள்களைக் கொள்ளலாம். இக்கதைச் சூழலில் எதிர்ப்புணர்வுள்ள பரிசோதனையைத் தெரிவிக்கிறது; ‘தீமைக்கு தூண்டுதல்’ என்ற குறுகிய இறையியல் பொருளைத் தேவையின்றி ஏற்றவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட உரை. ‘வழக்கறிஞன்’ என்ற சொல் இன்றைய நீதிமன்றத் தொழிலை நினைவூட்டக்கூடும் என்பதால் தவிர்க்கப்பட்டது. அடிக்குறிப்பு குறியீடு [a] முதன்மை உரையில் இணைக்கப்பட்டுள்ளது.
