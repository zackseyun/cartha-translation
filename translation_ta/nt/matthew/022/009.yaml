  text: πορεύεσθε οὖν ἐπὶ τὰς διεξόδους τῶν ὁδῶν, καὶ ὅσους ⸀ἐὰν εὕρητε καλέσατε εἰς τοὺς γάμους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/009.yaml
  text: Therefore go to the street intersections[b][a], and invite to the wedding feast as many as you find.
translation:
  language: ta
  text: ஆகையால், சாலைகள் சந்திக்கும் இடங்களுக்குச் சென்று[a], நீங்கள் காண்கிற அனைவரையும் திருமண விருந்துக்கு அழையுங்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சாலைகள் பிரியும் இடங்களுக்கு’ அல்லது ‘சாலைகளின் வெளியேறும் இடங்களுக்கு.’ கிரேக்கச் சொல் சாலைகள் சந்திக்கும், பிரியும், அல்லது வெளியேறும் இடங்களைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் ‘திருமணக் கொண்டாட்டங்களுக்கு’; இது திருமணக் கொண்டாட்டத்தை அல்லது திருமண விருந்தைக் குறிக்கும் மரபுவழக்கு.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορεύεσθε
  choice: போய்
  rationale: கிரேக்க நிகழ்காலக் கட்டளை இங்கு நேரடியான உத்தரவாக வருகிறது. அடுத்த கட்டளையுடன் இயல்பாக இணைவதற்குத் தமிழில் ‘போய்’ பொருத்தமானது.
- source_word: οὖν
  choice: ஆகையால்
  rationale: முந்தைய கூற்றிலிருந்து வரும் முடிவு அல்லது விளைவைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐπὶ τὰς διεξόδους τῶν ὁδῶν
  choice: சாலைகள் சந்திக்கும் இடங்களுக்கு
  rationale: διέξοδοι என்பது சாலைகள் பிரியும், வெளியேறும், அல்லது சந்திக்கும் பொதுவிடங்களைக் குறிக்கலாம். வாசகருக்குப் புரியும் இயல்பான தமிழாக இத்தேர்வு அமைந்தாலும், மூலத்தின் சொல்லியல் பரப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: ὅσους ἐὰν εὕρητε
  choice: நீங்கள் காண்கிற அனைவரையும்
  rationale: இந்த அமைப்பு எண்ணிக்கையில் வரம்பில்லாத விரிவைக் காட்டுகிறது; ‘அனைவரையும்’ என்பது கிடைக்கும் நபர்கள் அனைவரையும் அழைக்க வேண்டும் என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: καλέσατε
  choice: அழையுங்கள்
  rationale: விருந்து சார்ந்த சூழலில் καλέω என்பது வெறுமனே கூப்பிடுதல் அல்ல, விருந்துக்கு அழைத்தல் என்று பொருள்படும்.
- source_word: εἰς τοὺς γάμους
  choice: திருமண விருந்துக்கு
  rationale: இங்குள்ள பன்மை γάμοι பல திருமணங்களைக் குறிக்காமல் திருமணக் கொண்டாட்டம் அல்லது விருந்தைக் குறிக்கும் மரபுவழக்காக உள்ளது.
