source:
  edition: SBLGNT
  text: ⸀Εἶπεν κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ⸀ὑποκάτω τῶν ποδῶν σου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/044.yaml
  text: The Lord said to my Lord[a], ‘Sit at my right hand until I put your enemies under your feet’?”
translation:
  language: ta
  text: ‘ஆண்டவர் என் ஆண்டவரிடம்[a], “நான் உன் பகைவர்களை உன் கால்களுக்குக் கீழே வைக்கும்வரை, என் வலப்பக்கத்தில் அமர்ந்திரு” என்று சொன்னார்’ அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, சங்கீதம் 110:1-ன் எபிரெய மரபுத்தொடரைப் பின்பற்றி, “உன் பகைவர்களை உன் கால்களுக்கு கால்மணையாக ஆக்கும்வரை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν
  choice: சொன்னார்
  rationale: λέγω என்பதன் இறந்தகால வடிவத்தை இயல்பான நவீனத் தமிழில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: இரு இடங்களிலும் ஒரே கிரேக்கப் பட்டப்பெயர் வருவதால், அதன் ஒற்றுமையைப் பாதுகாக்க ‘ஆண்டவர்’ பயன்படுத்தப்படுகிறது.
- source_word: τῷ κυρίῳ μου
  choice: என் ஆண்டவரிடம்
  rationale: வேற்றுமை உருபு உரையின் பெறுநரைக் குறிக்கிறது; ‘என் ஆண்டவர்’ என்ற உறவுநிலையையும் மேசியாவைப் பற்றிய வாதத்தின் வலிமையையும் இது காக்கிறது.
- source_word: Κάθου
  choice: அமர்ந்திரு
  rationale: அரியணை ஏறி அதிகார இடத்தில் இருப்பதைக் குறிக்கும் கட்டளையை இயல்பாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: ἐκ δεξιῶν μου
  choice: என் வலதுபுறத்தில்
  rationale: மரியாதை மற்றும் அதிகாரத்தின் இடத்தைக் குறிக்கும் கிரேக்க மரபுத்தொடருக்கான தெளிவான நவீனத் தமிழ் வடிவம்.
- source_word: ἕως ἂν θῶ
  choice: நான் … வைக்கும்வரை
  rationale: ἕως ἂν மற்றும் இறந்தகாலத் துணைவினை வடிவம் குறிக்கும் எதிர்கால எல்லையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τοὺς ἐχθρούς σου
  choice: உன் பகைவர்களை
  rationale: ἐχθρός என்பதற்கான தெளிவான, பொதுவாகப் புரியும் தமிழ் இணை.
- source_word: ὑποκάτω τῶν ποδῶν σου
  choice: உன் கால்களுக்குக் கீழே
  rationale: மத்தேயுவின் கிரேக்க உரையில் உள்ள இடவியல் உருவகத்தை விளக்கச் சேர்க்கையின்றி நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: சங்கீதம் 110:1 மேற்கோளில் வரும் κύριος என்ற இரு பயன்பாடுகள்
  choice: ஆண்டவர் என் ஆண்டவரிடம்
  alternative: கர்த்தர் என் ஆண்டவரிடம் / ஆண்டவர் என் எஜமானிடம்
  rationale: கிரேக்க உரை இரு குறிப்பிடப்படுபவர்களுக்கும் κύριος என்ற ஒரே பட்டப்பெயரையே பயன்படுத்துகிறது. ஒரே தமிழ்ச் சொல்லை இருமுறையும் பயன்படுத்துவது அந்த உரை ஒற்றுமையையும், ‘என்’ என்பதன் மூலம் உறவுநிலை வேறுபாட்டையும் காக்கிறது; முதல் சொல்லில் எபிரெயத் தெய்வீகப் பெயரை வெளிப்படையாகச் சேர்ப்பது கிரேக்கத்தில் இல்லாத வேறுபாட்டை முன்னிறுத்தும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமானதாயும் சாதாரண வாசகர்களுக்கு எளிதில் புரியத்தக்கதாயும் அமைந்துள்ளது. கேள்வியை நிறைவு செய்யும் ‘அல்லவா?’ என்பது வசனத்தின் மேற்கோள் சார்ந்த வினாவைக் காட்டுகிறது. மூல கிரேக்கத்தில் ‘கால்களுக்குக் கீழே’ என்பதே இருப்பதால் ‘கால்மணையாக’ என்ற எபிரெய உருவகத்தை அடிக்குறிப்பாகச் சேர்க்கவில்லை.
