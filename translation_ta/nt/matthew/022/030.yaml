reference: Matthew 22:30
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐν γὰρ τῇ ἀναστάσει οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται, ἀλλ’ ὡς ἄγγελοι ⸀θεοῦ ἐν ⸀τῷ οὐρανῷ εἰσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/030.yaml
  text: For in the resurrection they neither marry nor are given in marriage[a], but are like the angels of God in heaven.
translation:
  language: ta
  text: ஏனெனில், உயிர்த்தெழுதலில்[a] அவர்கள் திருமணம் செய்துகொள்வதும் இல்லை, திருமணம் செய்து கொடுக்கப்படுவதும் இல்லை; மாறாக, பரலோகத்தில் இருக்கும் கடவுளின் தூதர்களைப் போல இருக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உயிர்த்தெழும்போது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ... τῇ ἀναστάσει
  choice: உயிர்த்தெழுதலில்
  rationale: ἐν என்ற முன்னிடைச்சொல்லையும், உயிர்த்தெழுந்த வாழ்வின் நிலை அல்லது காலம் என்ற இயல்பான பொருளையும் சுருக்கமாகக் காக்கிறது. காலத்தைக் குறிப்பதாகப் புரிந்துகொள்ளும் மாற்றும் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: γαμοῦσιν
  choice: திருமணம் செய்துகொள்வதும்
  rationale: திருமண உறவுக்குள் நுழைவதைக் குறிக்கும் பொதுவான வினைச்சொல்லை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: γαμίζονται
  choice: திருமணம் செய்துகொடுக்கப்படுவதும்
  rationale: செயப்பாட்டு வடிவத்தையும், γαμοῦσιν என்பதிலிருந்து இதற்குள்ள வேறுபாட்டையும் பாதுகாக்கிறது.
- source_word: ὡς
  choice: போல
  rationale: இது ஒப்புமையைக் குறிக்கிறது; உயிர்த்தெழுந்தவர்கள் தூதர்களாக மாறுவார்கள் என்ற அடையாள ஒன்றிப்பை உணர்த்தாது.
- source_word: ἄγγελοι θεοῦ
  choice: கடவுளின் தூதர்கள்
  rationale: θεοῦ என்ற உடைமைத் தொடர்பை வெளிப்படையாகக் காக்கிறது.
- source_word: ἐν τῷ οὐρανῷ
  choice: பரலோகத்திலுள்ள
  rationale: இங்கு οὐρανός வான்வெளியையல்ல, கடவுளின் தூதர்கள் இருக்கும் பரலோகத்தைக் குறிக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரண விளக்கத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: தூதர்களோடு செய்யப்படும் ஒப்புமையின் இயல்பு
  choice: உயிர்த்தெழுந்தவர்கள் திருமணம் செய்யாத அம்சத்தில் கடவுளின் தூதர்களைப் போல இருப்பார்கள்.
  alternative: அவர்கள் தூதர்களாக மாறுவார்கள் அல்லது எல்லா அம்சங்களிலும் தூதர்களைப் போன்ற இருப்பைப் பெறுவார்கள்.
  rationale: ὡς என்பது ஒப்புமையைக் குறிக்கிறது; உடனடிச் சூழல் அந்த ஒப்புமையைத் திருமணம் இல்லாத நிலையோடு இணைக்கிறது. ஆகவே ‘போல’ என்பது ஒற்றுமையைப் பாதுகாத்து, அடையாள மாற்றத்தைத் திணிக்காமல் விடுகிறது.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், பொதுவாசகர்களுக்கு புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இரண்டு கிரேக்கத் திருமண வினைகளுக்கிடையிலான செய்பாட்டு–செயப்பாட்டு வேறுபாடு தமிழிலும் பாதுகாக்கப்பட்டுள்ளது; ‘பரலோகம்’ என்பது இங்கு உடல் வானத்தைத் தவிர்க்கிறது.
