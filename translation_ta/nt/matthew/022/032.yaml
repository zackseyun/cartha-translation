  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ; οὐκ ἔστιν ⸂ὁ θεὸς⸃ νεκρῶν ἀλλὰ ζώντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/032.yaml
  text: I am the God of Abraham and the God of Isaac and the God of Jacob. He is not the God of the dead[a], but of the living.
translation:
  language: ta
  text: “நான் ஆபிரகாமின் கடவுள், ஈசாக்கின் கடவுள், யாக்கோபின் கடவுள் என்று இருக்கிறேன். கடவுள்[a] இறந்தவர்களின் கடவுள் அல்ல; உயிரோடு இருப்பவர்களின் கடவுள்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் இரண்டாவது வாக்கியத்தில் “கடவுள்” என்ற சொல் இல்லை. அப்பாடத்தில், “அவர் இறந்தவர்களின் கடவுள் அல்ல; உயிரோடு இருப்பவர்களின் கடவுள்” என்று வாசிக்கப்படுகிறது.
    reason: textual_variant
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: நான் ... இருக்கிறேன்
  rationale: நிகழ்காலத் தன்அடையாளக் கூற்றை நேரடியாகக் காக்கிறது; மேற்கோளின் நிகழ்கால வடிவம் இயேசுவின் வாதத்திற்கு முக்கியமானது.
- source_word: ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ
  choice: ஆபிரகாமின் கடவுளாகவும் ஈசாக்கின் கடவுளாகவும் யாக்கோபின் கடவுளாகவும்
  rationale: கிரேக்கத்தில் ஒவ்வொரு முறையும் வரும் ‘கடவுள்’ என்ற சொல்லைச் சுருக்காமல் மீண்டும் கூறி, அதன் வலியுறுத்தலை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: οὐκ ἔστιν ὁ θεὸς
  choice: கடவுள் ... கடவுள் அல்ல
  rationale: விமர்சன மூலப்பாடத்தில் மீண்டும் வெளிப்படையாக வரும் θεός என்பதைத் தமிழிலும் வைத்திருக்கிறது; சில சுவடிகளின் மாற்றுப் பாடம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: νεκρῶν
  choice: இறந்தவர்களின்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் பன்மை அடைமொழியை, சாதாரண நவீன தமிழில் மனிதர்களைக் குறிக்கும் வகையில் தெளிவாக மொழிபெயர்க்கிறது.
- source_word: ζώντων
  choice: உயிரோடு இருப்பவர்களின்
  rationale: பெயர்ச்சொல் தன்மையில் வரும் நிகழ்காலப் பங்கேற்பு வடிவத்தையும் ‘இறந்தவர்கள்’ என்பதற்கான சுருக்கமான எதிர்மறை இணைப்பையும் காக்கிறது.
theological_decisions:
- issue: உயிர்த்தெழுதல் குறித்த இயேசுவின் வாதத்தில் முற்பிதாக்கள் கடவுளுக்கு முன் உயிரோடு இருப்பதன் உட்பொருள்
  choice: மூலத்தின் ‘இறந்தவர்கள்—உயிரோடு இருப்பவர்கள்’ என்ற எதிரிணையை மட்டும் நேரடியாக வழங்குதல்
  alternative: ‘அவருக்கு முன் இன்னும் உயிரோடு இருப்பவர்கள்’ அல்லது இடைநிலையை விளக்கும் விரிவான உரை
  rationale: வசனத்தின் வாத வலிமையைத் தக்கவைத்தபடியே, உயிர்த்தெழுதல் அல்லது இடைநிலை பற்றிய விளக்கக் கோட்பாட்டை மொழிபெயர்ப்பிற்குள் சேர்க்காமல் அதன் இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பெயர்களோடு ‘கடவுள்’ மீண்டும் வருவது மூலத்தின் சொற்பொழிவு வலிமைக்காகத் தக்கவைக்கப்பட்டுள்ளது; அரைப்புள்ளி எதிரிணையைத் தெளிவாக்குகிறது.
