revisions:
- from: “நான் ஆபிரகாமின் கடவுளாகவும் ஈசாக்கின் கடவுளாகவும் யாக்கோபின் கடவுளாகவும் இருக்கிறேன்.” கடவுள்[a] இறந்தவர்களின் கடவுள் அல்ல; உயிரோடு இருப்பவர்களின் கடவுள்.
  to: “நான் ஆபிரகாமின் கடவுள், ஈசாக்கின் கடவுள், யாக்கோபின் கடவுள் என்று இருக்கிறேன். கடவுள்[a] இறந்தவர்களின் கடவுள் அல்ல; உயிரோடு இருப்பவர்களின் கடவுள்.”
  rationale: The revision keeps the SBLGNT's explicit «ὁ θεὸς» in the main text, preserves the concise dead/living antithesis without theological expansion, and retains the threefold patriarchal formula in idiomatic Tamil. It also places the full saying within one set of quotation marks and clarifies the footnote's textual anchor.
