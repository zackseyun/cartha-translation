source:
  edition: SBLGNT
  text: οἱ δὲ ἀμελήσαντες ἀπῆλθον, ⸀ὃς μὲν εἰς τὸν ἴδιον ἀγρόν, ⸁ὃς δὲ ⸀ἐπὶ τὴν ἐμπορίαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/005.yaml
  text: But they paid no attention and went away[a], one to his own field, another to his business.
translation:
  language: ta
  text: ஆனால், அவர்கள் அதைப் பொருட்படுத்தாமல் போய்விட்டார்கள்[a]; ஒருவன் தன் சொந்த வயலுக்குப் போனான், மற்றொருவன் தன் வியாபாரத்திற்குப் போனான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதை அலட்சியம் செய்து” அல்லது “அதைப் புறக்கணித்து.” சூழலில் இது அரசனின் அழைப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμελήσαντες
  choice: அதைப் பொருட்படுத்தாமல்
  rationale: ἀμελέω இங்கு அக்கறை காட்டாமை அல்லது அலட்சியம் செய்தல் என்பதைக் குறிக்கிறது. கிரேக்கத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லை; சூழலில் அரசனின் அழைப்பே குறிக்கப்படுகிறது. ‘அதைப் பொருட்படுத்தாமல்’ என்பது இந்த மறுப்புணர்வை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἀπῆλθον
  choice: போய்விட்டார்கள்
  rationale: அழைப்பை விட்டுவிட்டு அவர்கள் சென்றுவிட்ட நிகழ்வை இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: ὃς μὲν ... ὃς δὲ
  choice: ஒருவன் ... மற்றொருவன்
  rationale: μέν ... δέ கொண்ட பகிர்வுக் கட்டமைப்பையும் இருவர் வெவ்வேறு இடங்களுக்குச் சென்ற வேறுபாட்டையும் இயல்பான தமிழில் காக்கிறது.
- source_word: εἰς τὸν ἴδιον ἀγρόν
  choice: தன் சொந்த வயலுக்கு
  rationale: ἀγρός என்பதன் நேரடியான பொருளான ‘வயல்’ என்பதையும் ἴδιον வலியுறுத்தும் தனக்குரிய தன்மையையும் காக்கிறது.
- source_word: ἐπὶ τὴν ἐμπορίαν αὐτοῦ
  choice: தன் வியாபாரத்துக்கு
  rationale: ἐμπορία குறிக்கும் வணிகம் அல்லது வியாபாரச் செயலை நவீன வாசகர்களுக்குத் தெளிவாகத் தருகிறது; இது பொருட்களை அல்ல, வணிக நடவடிக்கையைச் சுட்டுகிறது.
theological_decisions:
- issue: ἀμελήσαντες என்பதன் மறைமுகச் செயப்படுபொருள்
  choice: ‘அதைப் பொருட்படுத்தாமல்’ என்று மொழிபெயர்த்து, ‘அது’ எதைக் குறிக்கிறது என்பதைச் சூழலுக்கு விட்டுவைத்தல்
  alternative: ‘அழைப்பைப் பொருட்படுத்தாமல்’ என்று வெளிப்படையாகக் கூறுதல்
  rationale: கிரேக்க மூலத்தில் செயப்படுபொருள் சொல்லப்படவில்லை; உடனடிச் சூழல் அரசனின் அழைப்பைக் காட்டுகிறது. ‘அதை’ என்பது தமிழில் இயல்பான தெளிவைத் தருவதோடு, மூலத்தில் இல்லாத பெயர்ச்சொல்லை முதன்மை உரையில் சேர்ப்பதையும் தவிர்க்கிறது.
translation_notes:
  register: நவீன தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘வயல்,’ ‘வியாபாரம்’ ஆகிய சொற்கள் மூலத்தின் வேளாண்மை–வணிகம் என்ற வேறுபாட்டைக் காக்கின்றன.
