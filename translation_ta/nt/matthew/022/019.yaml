  yaml_path: translation/nt/matthew/022/019.yaml
  text: Show me the coin for the tax[a]. And they brought him a denarius.
translation:
  language: ta
  text: “வரிக்கான[a] நாணயத்தை எனக்குக் காட்டுங்கள்.” அவர்கள் அவரிடம் ஒரு தினாரியத்தைக் கொண்டுவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “தலைவரிக்கான” அல்லது “மக்கள் கணக்கெடுப்பு வரிக்கான.” κῆνσος என்பது ரோமப் பேரரசின் ஒரு வரியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιδείξατέ
  choice: எனக்குக் காட்டுங்கள்
  rationale: இது ἐπιδείκνυμι என்பதன் கட்டளை வடிவம். நாணயத்தைப் பார்வைக்குக் காட்டும்படி கூறும் பொருளை இயல்பான நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: νόμισμα
  choice: நாணயம்
  rationale: புழக்கத்திலுள்ள ஒரு குறிப்பிட்ட காசு அல்லது நாணயத்தை இச்சொல் குறிக்கிறது; அடுத்த வாக்கியத்தில் அது தினாரியம் எனத் தெளிவுபடுத்தப்படுகிறது.
- source_word: τοῦ κήνσου
  choice: வரிக்கான
  rationale: κῆνσος என்பது இச்சூழலில் ரோமப் பேரரசுக்குச் செலுத்தப்பட்ட வரியைக் குறிக்கும் இலத்தீன் வழிச் சொல். மூலத்தில் உள்ள சுருக்கத்தையும் பொதுமையையும் முதன்மை உரை காக்கிறது; குறிப்பான மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: προσήνεγκαν
  choice: கொண்டுவந்தார்கள்
  rationale: προσφέρω என்பதன் இறந்தகால வடிவமான இச்சொல், ஒருவரிடம் ஒரு பொருளைக் கொண்டுவருவதை இக்கதைச் சூழலில் இயல்பாகக் குறிக்கிறது.
- source_word: δηνάριον
  choice: ஒரு தினாரியம்
  rationale: ஒரு குறிப்பிட்ட ரோம நாணயத்தின் வரலாற்றுப் பெயரைப் பொதுவான பணமதிப்பாக மாற்றாமல் ஒலிபெயர்த்துக் காக்கிறது.
