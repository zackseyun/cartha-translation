id: MAT.22.22
reference: Matthew 22:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἀκούσαντες ἐθαύμασαν, καὶ ἀφέντες αὐτὸν ἀπῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/022.yaml
  text: And hearing this[a], they were amazed, and leaving him, they went away.
translation:
  language: ta
  text: அவர்கள் இதைக் கேட்டு[a] வியந்தார்கள்; அவரை விட்டுவிட்டுச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இதைக் கேட்டதும்.”
    reason: ἀκούσαντες என்ற செயவெச்சத்தின் காலத் தொடர்பைத் தமிழில் வேறொரு இயல்பான முறையில் வெளிப்படுத்தும் மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: ἀκούσαντες
  choice: இதைக் கேட்டு
  rationale: இறந்தகாலச் செயவெச்சம் முதன்மை வினைக்கு முன்னர் நிகழ்ந்த செயலைக் குறிக்கிறது. சூழலில் மறைந்துள்ள செயப்படுபொருளை இயல்பான தமிழுக்காக ‘இதை’ என்று வெளிப்படுத்துகிறது.
- source_word: ἐθαύμασαν
  choice: வியந்தார்கள்
  rationale: θαυμάζω குறிக்கும் வியப்பு அல்லது ஆச்சரியத்தை நவீனத் தமிழில் இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: ἀφέντες αὐτὸν
  choice: அவரை விட்டுவிட்டு
  rationale: இங்கு ἀφίημι என்பது ஒருவரை விட்டுப் பிரிவதைக் குறிக்கிறது; மூலத்தில் இல்லாத ‘தனியாக’ என்ற கருத்தைச் சேர்க்கவில்லை.
- source_word: ἀπῆλθαν
  choice: சென்றார்கள்
  rationale: ἀπέρχομαι குறிக்கும் அங்கிருந்து சென்றுவிடும் நிகழ்வைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது; முந்தைய ‘விட்டுவிட்டு’ என்பதுடன் சேர்ந்து ‘சென்றார்கள்’ என்பது புறப்பட்டுச் சென்ற பொருளைத் தெளிவாக்குகிறது.
- source_word: καὶ ... καὶ
  choice: செயவெச்சத் தொடர் மற்றும் அரைப்புள்ளி
  rationale: தமிழில் இயல்பான தொடர்ச்சிக்காக கிரேக்க இணைப்புகள் செயவெச்ச அமைப்பாலும் அரைப்புள்ளியாலும் வெளிப்படுத்தப்பட்டுள்ளன; நிகழ்வுகளின் வரிசை பாதுகாக்கப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையானதும் கண்ணியமானதும் ஆன கதைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் சுருக்கமான நிகழ்வு வரிசையும் மறைமுகச் செயப்படுபொருளும் இயல்பாகப் பாதுகாக்கப்பட்டுள்ளன.
