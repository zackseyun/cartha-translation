source:
  edition: SBLGNT
  text: τότε λέγει τοῖς δούλοις αὐτοῦ· Ὁ μὲν γάμος ἕτοιμός ἐστιν, οἱ δὲ κεκλημένοι οὐκ ἦσαν ἄξιοι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/008.yaml
  text: Then he says to his servants[a], ‘The wedding feast is ready, but those who were invited were not worthy.’
translation:
  language: ta
  text: பின்பு அவர் தம் பணியாளர்களிடம், “திருமண விருந்து ஆயத்தமாக இருக்கிறது; ஆனால் அழைக்கப்பட்டவர்கள்[a] தகுதியற்றவர்களாக இருந்தார்கள்” என்று சொல்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அழைப்பு பெற்றவர்கள்.” கிரேக்க வினையெச்சத்தைச் சொற்பொருளில் இவ்வாறு மொழிபெயர்க்கலாம்; இந்த விருந்து சூழலில் அது திருமண விருந்துக்கு அழைக்கப்பட்டவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: பின்பு
  rationale: நிகழ்வுகளின் தொடர்ச்சியில் அடுத்த கட்டத்தை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: λέγει
  choice: சொல்கிறார்
  rationale: கிரேக்க மூலத்தின் வரலாற்று நிகழ்காலத்தைப் பாதுகாத்து, கதைசொல்லலின் உயிரோட்டத்தைத் தக்கவைக்கிறது.
- source_word: δούλοις
  choice: பணியாளர்களிடம்
  rationale: அரசவையைச் சார்ந்த உவமைக் சூழலில் எஜமானரின் கட்டளையை நிறைவேற்றுவோரைக் குறிக்க இயல்பான சொல்; இந்த வசனத்தில் அடிமை என்ற சட்டநிலை முன்னிலைப்படுத்தப்படவில்லை.
- source_word: Ὁ μὲν γάμος
  choice: திருமண விருந்து
  rationale: இங்கு γάμος திருமண நிகழ்வை மட்டும் அல்லாமல் ஆயத்தமாகியுள்ள திருமண விருந்தைக் குறிக்கிறது; μὲν-δέ எதிர்மறை அமைப்பு ‘ஆனால்’ என்பதில் வெளிப்படுகிறது.
- source_word: ἕτοιμός ἐστιν
  choice: ஆயத்தமாக இருக்கிறது
  rationale: பெயரடை மற்றும் வினையின் நேரடியான பொருளை இயல்பாக வழங்குகிறது.
- source_word: οἱ δὲ κεκλημένοι
  choice: அழைக்கப்பட்டவர்கள்
  rationale: καλέω என்பதன் நிறைவுற்ற செயப்பாட்டு வினையெச்சம் இவ்விருந்து சூழலில் அழைப்பு பெற்ற விருந்தினர்களைக் குறிக்கிறது; தமிழில் ‘அழைக்கப்பட்டவர்கள்’ என்பது விருந்து அழைப்பையும் ‘அழைக்கப்பட்டோர்’ என்ற சாத்தியமான இறையியல் ஒலியையும் முற்றிலும் அழிக்காமல் தக்கவைக்கிறது.
- source_word: οὐκ ἦσαν ἄξιοι
  choice: தகுதியுள்ளவர்களாக இருக்கவில்லை
  rationale: ἄξιοι என்பதிலுள்ள மதிப்பீட்டுத் தன்மையைப் பாதுகாக்கிறது; அவர்கள் ஏன் தகுதியற்றவர்கள் என்பதைக் கூடுதலாக விளக்கவில்லை.
theological_decisions:
- issue: κεκλημένοι (‘அழைக்கப்பட்டவர்கள்’) என்பதன் விருந்து சார்ந்த பொருளும் இறையியல் ‘அழைப்பு’ ஒலியும்
  choice: முதன்மை உரையில் ‘அழைக்கப்பட்டவர்கள்’
  alternative: ‘அழைக்கப்பட்டோர்’ அல்லது ‘அழைப்பு பெற்றவர்கள்’
  rationale: உடனடிச் சூழலில் முன்னர் திருமண விருந்துக்கு அழைக்கப்பட்டவர்களே குறிக்கப்படுகின்றனர். அதேவேளை, மூலச் சொல்லின் ‘அழைக்கப்படுதல்’ வடிவம் மொழிபெயர்ப்பில் தக்கவைக்கப்படுவதால் தேவையற்ற இறையியல் தீர்மானம் திணிக்கப்படவில்லை.
- issue: ἄξιοι என்பதின் மதிப்பீட்டு வலிமை
  choice: ‘தகுதியுள்ளவர்களாக இருக்கவில்லை’
  alternative: ‘பொருத்தமானவர்களாக இருக்கவில்லை’ அல்லது ‘அதற்குத் தகுதியற்றவர்களாக இருந்தார்கள்’
  rationale: மூலத்தின் ‘worthy/fit’ என்ற மதிப்பீட்டை நேரடியாகப் பாதுகாக்கிறது; தகுதியின்மையின் காரணத்தையோ அதன் இறையியல் விளக்கத்தையோ வசனத்தில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வரலாற்று நிகழ்காலத்திற்காக ‘சொல்கிறார்’ தக்கவைக்கப்பட்டுள்ளது. ‘தம்’ என்பது எழுவாயுடன் இயல்பாகத் தொடர்புபடுத்துகிறது; ‘பணியாளர்கள்’ அரண்மனை/வீட்டு சேவைச் சூழலை அளவுக்கு மீறிய சட்டவியல் விளக்கமின்றி காட்டுகிறது.
