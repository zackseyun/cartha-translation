source:
  edition: SBLGNT
  text: Διδάσκαλε, ποία ἐντολὴ μεγάλη ἐν τῷ νόμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/036.yaml
  text: Teacher[a], which commandment is greatest in the Law?
translation:
  language: ta
  text: “ஆசிரியரே, திருச்சட்டத்தில் எந்தக் கட்டளை பெரியது[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மிகப் பெரியது” அல்லது “முதன்மையானது”. கிரேக்கத்தில் “பெரிய” என்ற நேர்மறை வடிவமே உள்ளது; எனினும், கட்டளைகளில் எது முதன்மையானது என்ற பொருளும் சூழலில் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διδάσκαλε
  choice: போதகரே
  rationale: இயேசுவை நேரடியாக விளிக்கும் அழைப்புமுறை. διδάσκαλος என்பதன் இயல்பான பொருளான ‘போதகர்/ஆசிரியர்’ என்பதைத் தருகிறது; ‘எஜமானர்’ என்ற வேறுபொருளைத் தவிர்க்கிறது.
- source_word: ποία
  choice: எது
  rationale: திருச்சட்டத்திலுள்ள கட்டளைகளில் ஒன்றை அடையாளம் காணக் கேட்கும் வினாச்சொல்; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἐντολὴ
  choice: கட்டளை
  rationale: யூதத் திருச்சட்டத்தின் ஆணையைக் குறிக்கும் ἐντολή என்பதற்கு எளிதில் புரியும் நேரடியான தமிழ் இணை.
- source_word: μεγάλη
  choice: மிகப் பெரிய
  rationale: கிரேக்கத்தில் பெயரெச்சம் நேரடியாக உயர்நிலை வடிவில் இல்லாவிட்டாலும், பல கட்டளைகளில் முதன்மை எது என்று கேட்கும் சூழலில் தமிழில் ‘மிகப் பெரிய’ என்பது இயல்பான ஒப்பீட்டு அர்த்தத்தை வெளிப்படுத்துகிறது. வடிவிற்கு நெருக்கமான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἐν τῷ νόμῳ
  choice: திருச்சட்டத்தில்
  rationale: இங்கு νόμος பொதுவான சட்டத்தை அல்ல, யூதர்களின் வேதச் சட்டமான தோராவைக் குறிக்கிறது. ‘திருச்சட்டம்’ அந்தச் சிறப்புப் பொருளை நவீன வாசகருக்குத் தெளிவாக்குகிறது.
theological_decisions:
- issue: μεγάλη என்பதை இயல்பான உயர்நிலைப் பொருளில் மொழிபெயர்ப்பதா
  choice: மிகப் பெரிய
  alternative: பெரிய
  rationale: சொல்வடிவம் நேரடியாக உயர்நிலை அல்ல என்றாலும், கட்டளைகளிடையே முதன்மையைக் கேட்கும் சூழல் உயர்நிலை அர்த்தத்தைத் தருகிறது. இயல்பான தமிழுக்காக அந்த அர்த்தம் முதன்மை உரையில் வைக்கப்பட்டு, கிரேக்க வடிவிற்கு நெருக்கமான வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன, மரியாதையான, பொதுவாசகருக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. கேள்வியின் இயல்பான தமிழ்நடை காக்கப்பட்டதுடன், μεγάλη என்பதிலுள்ள வடிவ–சூழல் இழுபறி அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
