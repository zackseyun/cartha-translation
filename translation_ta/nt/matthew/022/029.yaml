source:
  edition: SBLGNT
  text: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Πλανᾶσθε μὴ εἰδότες τὰς γραφὰς μηδὲ τὴν δύναμιν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/029.yaml
  text: But Jesus answered them[a], “You are mistaken, because you know neither the Scriptures nor the power of God.”
translation:
  language: ta
  text: ஆனால் இயேசு அவர்களிடம், “நீங்கள் வேதநூல்களையும் கடவுளின் வல்லமையையும் அறியாததால், தவறுகிறீர்கள்[a]” என்று பதிலளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “தவறில் இருக்கிறீர்கள்,” “வழிதவறுகிறீர்கள்,” அல்லது “ஏமாற்றப்படுகிறீர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: ஆனால் இயேசு அவர்களிடம் ... என்று பதிலளித்தார்
  rationale: பதிலுரையைச் சுட்டும் கிரேக்கப் பங்கேற்புவினையும் εἶπεν என்பதையும் தமிழில் இயல்பான ஒரே பதிலுரைச் சொற்றொடராக வழங்குகிறது; δέ-யின் மென்மையான எதிர்மறை/மாற்றத் தொடர்பை ‘ஆனால்’ காக்கிறது.
- source_word: Πλανᾶσθε
  choice: தவறாக எண்ணுகிறீர்கள்
  rationale: இச்சூழலில் ‘தவறில் இருக்கிறீர்கள்/வழிதவறுகிறீர்கள்’ என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது; வெளிப்புறமாக யாரோ ஏமாற்றினர் என்று மட்டும் பொருள் கட்டுப்படுத்தப்படவில்லை.
- source_word: μὴ εἰδότες
  choice: அறியாததால்
  rationale: அவர்களுடைய தவறுக்குக் காரணம் என்ன என்பதைப் பங்கேற்புவினை உணர்த்துவதால், தமிழில் காரணத் தொடர்பை வெளிப்படையாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: τὰς γραφὰς
  choice: வேதநூல்கள்
  rationale: யூத மறைநூல்களைக் குறிக்கும் பன்மையான γραφαί என்பதற்கு, சாதாரண வாசகருக்கும் புரியும் வகையில் புனித எழுத்துத் தொகுப்புகள் என்ற பொருளைத் தருகிறது.
- source_word: τὴν δύναμιν τοῦ θεοῦ
  choice: கடவுளின் வல்லமை
  rationale: δύναμις என்பதன் ‘வல்லமை’ என்ற பொருளையும் τοῦ θεοῦ என்ற உடைமைத் தொடர்பையும் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: சதுசேயர்களின் தவறுக்கான காரணம்
  choice: வேதநூல்களையும் கடவுளின் வல்லமையையும் அவர்கள் அறியாததே அவர்களுடைய தவறுக்குக் காரணம் என்று இயேசு கூறுகிறார்.
  alternative: காரணத்தை வலியுறுத்தாமல், அவர்கள் பொதுவாகத் தவறில் இருப்பதாக மட்டும் இயேசு கூறுகிறார்.
  rationale: μὴ εἰδότες என்ற பங்கேற்புவினை, தொடர்ந்து வரும் இரண்டு பொருட்களோடு சேர்ந்து, Πλανᾶσθε என்பதற்கான காரணத்தை இயல்பாக விளக்குகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகருக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘வேதநூல்கள்’ என்பது பன்மையைப் பாதுகாக்கிறது; ‘கடவுள்’ பொதுவான நவீனத் தமிழைச் சார்ந்தது.
