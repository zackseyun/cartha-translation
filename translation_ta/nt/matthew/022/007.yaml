id: MAT.22.7
reference: Matthew 22:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ βασιλεὺς⸃ ὠργίσθη, καὶ πέμψας τὰ στρατεύματα αὐτοῦ ἀπώλεσεν τοὺς φονεῖς ἐκείνους καὶ τὴν πόλιν αὐτῶν ἐνέπρησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/007.yaml
  text: But the king became angry, and he sent his troops, destroyed those murderers, and burned their city.
translation:
  language: ta
  text: ஆனால் அரசன் கோபமடைந்து, தன் படைகளை அனுப்பி, அந்தக் கொலைகாரர்களை அழித்து, அவர்களுடைய நகரத்தைத் தீக்கிரையாக்கினான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὠργίσθη
  choice: கோபமடைந்து
  rationale: இறந்தகாலச் செயலை இயல்பான தமிழ் வினையெச்சத் தொடரில் வழங்குகிறது; அரசனின் கோபத்தைத் தெளிவாகக் காக்கிறது.
- source_word: τὰ στρατεύματα αὐτοῦ
  choice: தன் படைகளை
  rationale: பன்மை வடிவத்தைப் பேணுவதோடு, αὐτοῦ அரசனையே சுட்டுவதைக் இயல்பான தமிழில் ‘தன்’ எனத் தெரிவிக்கிறது.
- source_word: ἀπώλεσεν
  choice: அழித்து
  rationale: கொலைகாரர்கள்மீது நிகழ்த்தப்பட்ட முழுமையான அழிவைத் தரும் நேரடியான பொருத்தம்.
- source_word: τοὺς φονεῖς ἐκείνους
  choice: அந்தக் கொலைகாரர்களை
  rationale: ἐκείνους என்பதன் சுட்டுப் பொருளையும் φονεῖς என்பதன் வலுவான குற்றவியல் அர்த்தத்தையும் காக்கிறது.
- source_word: ἐνέπρησεν
  choice: தீக்கிரையாக்கினான்
  rationale: நகரத்தை நெருப்பிட்டு எரித்த செயலைச் சுருக்கமாகவும் dignified modern Tamil-இலும் தெரிவிக்கிறது.
theological_decisions:
- issue: உவமையிலுள்ள அரசனின் கோபமும் தீர்ப்பும்
  choice: மூலத்தில் உள்ள வன்மையான தீர்ப்புச் சித்திரத்தை மாற்றாமல் வழங்குதல்
  alternative: மென்மைப்படுத்தி ‘தண்டித்தான்’ என்று பொதுமைப்படுத்துதல்
  rationale: வசனம் கொலைகாரர்களை அழித்ததையும் நகரத்தை எரித்ததையும் வெளிப்படையாகச் சொல்கிறது; அதன் உவமைத் தன்மையையோ இறையியல் பொருளையோ மொழிபெயர்ப்புக்குள் கூடுதலாக விளக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க நடையிலும் அமைந்துள்ளது. கிரேக்கத்தின் தொடர்ச்சியான செயல்கள் தமிழ் வினையெச்சத் தொடரால் இயல்பாகக் கொடுக்கப்பட்டுள்ளன; இறுதி வினை ஒருமை ஆண்பாலில் அரசனைச் சுட்டுகிறது.
