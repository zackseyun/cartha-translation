source:
  edition: SBLGNT
  text: περὶ δὲ τῆς ἀναστάσεως τῶν νεκρῶν οὐκ ἀνέγνωτε τὸ ῥηθὲν ὑμῖν ὑπὸ τοῦ θεοῦ λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/031.yaml
  text: Concerning the resurrection of the dead[a], have you not read what was spoken to you by God, saying,
translation:
  language: ta
  text: 'இறந்தோரின் உயிர்த்தெழுதலைக் குறித்து,[a] கடவுள் உங்களுக்குச் சொல்லியதை நீங்கள் வாசித்ததில்லையா? அவர் இவ்வாறு கூறுகிறார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இறந்தோரின் உயிர்த்தெழுதலைக் குறித்து, கடவுளால் உங்களுக்குச் சொல்லப்பட்டதை நீங்கள் வாசித்ததில்லையா? அவர் இவ்வாறு கூறுகிறார்:”
    reason: கிரேக்கத்தில் ‘சொல்லப்பட்டது’ என்பது செயப்பாட்டு வடிவில் உள்ளது; தமிழில் இயல்பான செயப்பாட்டு அமைப்புக்கு மாற்றாக அதனை நேரடியாகக் காட்டும் மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: περὶ δὲ
  choice: …குறித்து
  rationale: περί தலைப்பை அறிமுகப்படுத்துகிறது; δέ இங்கு வலுவான எதிர்மறையைக் காட்டாமல் உரையாடலை அடுத்த கருத்துக்கு மாற்றுகிறது. தமிழில் இயல்பான தலைப்பு அமைப்பே அந்த மாற்றத்தை வெளிப்படுத்துகிறது.
- source_word: τῆς ἀναστάσεως τῶν νεκρῶν
  choice: இறந்தோரின் உயிர்த்தெழுதல்
  rationale: ἀνάστασις இச்சூழலில் இறந்தவர்கள் மீண்டும் உயிருடன் எழுப்பப்படுவதைக் குறிக்கிறது; τῶν νεκρῶν என்பது உயிர்த்தெழுபவர்களாகிய இறந்தோரைச் சுட்டுகிறது.
- source_word: οὐκ ἀνέγνωτε
  choice: நீங்கள் வாசித்ததில்லையா?
  rationale: இது கேட்போரின் வேதவாசிப்பு அறிவைச் சவாலிடும் எதிர்மறை வினா. தமிழ் வழக்கில் நிறைநிலை வடிவம் அந்த சொல்லாட்சியின் நோக்கத்தை இயல்பாகத் தருகிறது.
- source_word: τὸ ῥηθὲν ὑμῖν ὑπὸ τοῦ θεοῦ
  choice: கடவுள் உங்களிடம் கூறியதை
  rationale: சொல்லப்பட்ட உள்ளடக்கம், அதைச் சொன்ன கடவுள், அது நோக்கி உரைக்கப்பட்ட கேட்போர் ஆகிய மூன்றையும் இயல்பான செயப்பாட்டு வாக்கியத்தில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: λέγοντος
  choice: 'அவர் கூறியது:'
  rationale: அடுத்த வசனத்தில் வரும் நேரடி மேற்கோளை அறிமுகப்படுத்துகிறது. தமிழில் தொடரும் மேற்கோளுக்கு முன் இவ்வமைப்பும் இருபுள்ளியும் இயல்பானவை.
theological_decisions:
- issue: வேதவாக்கில் கடவுளின் உரையும் அதன் தற்போதைய முகவரியும்
  choice: கடவுள் உங்களிடம் கூறியதை
  alternative: கடவுளால் உங்களுக்குச் சொல்லப்பட்டதை
  rationale: கிரேக்க உரை வேதப்பகுதியை கடவுள் சொன்னதாகவும் இயேசுவின் கேட்போரிடமே அது உரைக்கப்பட்டதாகவும் முன்வைக்கிறது. இயல்பான தமிழ் செயப்பாட்டு அமைப்பு இந்த இரு அம்சங்களையும் காக்கிறது; குறிப்பிட்ட ஓர் உந்துதல் கோட்பாட்டை கூடுதலாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இறந்தோர்’ மற்றும் ‘உயிர்த்தெழுதல்’ ஆகியவை சூழலுக்கேற்ற தெளிவான சொற்கள்; வாக்கியம் அடுத்த வசனத்தின் மேற்கோளோடு தொடர்வதை இருபுள்ளி காட்டுகிறது.
