  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு தெளிவாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. அடுத்த வசனத்தில் வரும் நேரடி கேள்வியை அறிமுகப்படுத்துவதால் வாக்கிய இறுதியில் முக்காற்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
