  text: While the Pharisees were gathered together, Jesus asked them,
translation:
  language: ta
  text: 'பரிசேயர்கள் ஒன்றுகூடியிருந்தபோது, இயேசு அவர்களிடம் கேட்டார்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνηγμένων
  choice: ஒன்றுகூடியிருந்தபோது
  rationale: συνάγω என்பதன் இறந்தகாலப் பங்கேற்பு வடிவம் genitive absolute அமைப்பில் சூழ்நிலையைக் குறிக்கிறது. ‘ஒன்றுகூடியிருந்தபோது’ என்பது அவர்கள் கூடியிருந்த பின்னணியையும் ஒருங்கிணைந்த குழுவாக இருந்ததையும் இயல்பான தமிழில் தருகிறது.
- source_word: δὲ
  choice: தனி சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ வலுவான எதிர்மறையைக் காட்டாமல் மென்மையான உரைமாற்றத்தை மட்டுமே குறிக்கிறது. தமிழ் துணைவாக்கிய அமைப்பே அந்த முன்னேற்றத்தை இயல்பாக வெளிப்படுத்துவதால் ‘ஆனால்’ அல்லது ‘இப்போது’ சேர்க்கப்படவில்லை.
- source_word: τῶν Φαρισαίων
  choice: பரிசேயர்கள்
  rationale: Φαρισαῖοι என்ற குழுப் பெயருக்கான நிலையான நவீனத் தமிழ் வடிவம். கிரேக்க வேற்றுமைத் தொடர்பு தமிழ் துணைவாக்கியத்தில் எழுவாயாக இயல்பாக மாற்றப்பட்டுள்ளது.
- source_word: ἐπηρώτησεν
  choice: கேட்டார்
  rationale: ἐπερωτάω இங்கு இயேசு ஒரு கேள்வியை முன்வைப்பதைக் குறிக்கிறது. ‘கேட்டார்’ இயல்பானதும் தேவையற்ற மோதல் நிழலைச் சேர்க்காததும் ஆகும்.
- source_word: αὐτοὺς
  choice: அவர்களிடம்
  rationale: இந்தச் சுட்டுப்பெயர் முன்பு குறிப்பிடப்பட்ட பரிசேயர்களைக் குறிக்கிறது. தமிழில் கேள்வி கேட்கப்படும் நபர்களை ‘அவர்களிடம்’ என்று அமைப்பது இயல்பான பயன்பாடு.
- source_word: ὁ Ἰησοῦς
  choice: இயேசு
  rationale: தனிப்பெயர் எழுவாயாக மொழிபெயர்க்கப்பட்டது; கிரேக்க வரையறைச் சுட்டுக்கு தமிழில் தனி இணை தேவையில்லை.
