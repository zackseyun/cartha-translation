  text: And he said to them[a], “Whose image is this, and whose inscription?”
translation:
  language: ta
  text: அவர் அவர்களிடம், “இந்த உருவமும் பொறிப்பும் யாருடையவை?” என்று கூறினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்க வினாப்பெயர் உடைமையையோ தொடர்பையையோ கேட்கிறது; எனவே, “இது யாருடைய உருவமும் பொறிப்பும்?” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: கேட்டார்
  rationale: கிரேக்கத்தில் நிகழ்கால வரலாற்று நடை இருந்தாலும், நவீன தமிழ் கதைநடையில் இறந்தகாலம் இயல்பானது. நேரடி உரை கேள்வியாக இருப்பதால் ‘சொன்னார்’ என்பதைவிட ‘கேட்டார்’ சூழலுக்குப் பொருத்தமானது.
- source_word: αὐτοῖς
  choice: அவர்களிடம்
  rationale: பேச்சின் மறைமுகப் பொருளைக் குறிக்கும் பன்மைத் தத்துவேற்றுமையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: Τίνος
  choice: யாருடையவை
  rationale: உடைமை அல்லது தொடர்பைக் கேட்கும் கிரேக்கப் பிறப்புவேற்றுமை வினாப்பெயரைத் தெளிவாகக் காட்டுகிறது; உருவம், பொறிப்பு ஆகிய இரண்டையும் சேர்த்துக் கேட்பதால் பன்மை வினைமுடிவு பயன்படுத்தப்பட்டுள்ளது.
- source_word: εἰκών
  choice: உருவம்
  rationale: நாணயத்தில் காணப்படும் ஒருவரின் வடிவத்தைக் குறிக்க இயல்பான, பொதுவாகப் புரியும் சொல்; தேவையின்றி ‘படம்’ அல்லது ‘முகச்சாயல்’ என்று பொருளைச் சுருக்கவில்லை.
- source_word: αὕτη
  choice: இந்த
  rationale: கையில் அல்லது முன்னிலையில் உள்ள நாணயத்தின் உருவத்தைச் சுட்டும் அண்மைச் சுட்டுப்பெயரடை.
- source_word: ἐπιγραφή
  choice: பொறிப்பு
  rationale: நாணயத்தில் பொறிக்கப்பட்ட எழுத்தைக் குறிப்பாகவும் சுருக்கமாகவும் குறிக்கிறது; பொதுவான ‘எழுத்து’ என்பதைவிட மூலச்சொல்லின் பொருளுக்கு நெருக்கமானது.
- source_word: καὶ
  choice: -உம் … -உம்
  rationale: உருவம் மற்றும் பொறிப்பு ஆகிய இரண்டையும் இணைக்கும் கிரேக்கச் சேர்க்கையை இயல்பான தமிழ் இணைப்புமுறையில் வெளிப்படுத்துகிறது.
