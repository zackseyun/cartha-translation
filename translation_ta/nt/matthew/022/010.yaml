id: MAT.22.10
reference: Matthew 22:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐξελθόντες οἱ δοῦλοι ἐκεῖνοι εἰς τὰς ὁδοὺς συνήγαγον πάντας ⸀οὓς εὗρον, πονηρούς τε καὶ ἀγαθούς· καὶ ἐπλήσθη ὁ ⸀γάμος ἀνακειμένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/010.yaml
  text: And those servants went out into the roads and gathered everyone they found[a], both evil and good[c][b]; and the wedding hall was filled with guests reclining at the table.
translation:
  language: ta
  text: அந்த அடிமைகள் சாலைகளுக்குப் புறப்பட்டுச் சென்று, தாங்கள் கண்ட எல்லாரையும்—தீயவர்களையும் நல்லவர்களையும்[a]—கூட்டிவந்தார்கள். திருமண விருந்துக்கூடம்[b] பந்தியில் சாய்ந்து அமர்ந்திருந்த விருந்தினர்களால்[c] நிறைந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கெட்டவர்களையும் நல்லவர்களையும்.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில், “திருமணம்.” இங்கு விருந்தினர்களால் அது நிறைந்ததாகக் கூறப்படுவதால், திருமண விருந்து அல்லது அது நடைபெற்ற கூடம் குறிக்கப்படுகிறது.
    reason: lexical_alternative
  - marker: c
    text: அக்காலத்தில் முறையான விருந்தின்போது மேசையருகே சாய்ந்து அமர்ந்து உண்பது வழக்கம்.
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλοι
  choice: அடிமைகள்
  rationale: இந்தச் சொல் அரசனின் அதிகாரத்திற்குக் கட்டுப்பட்ட குடும்ப அடிமைகளைக் குறிக்கிறது; சமூக நிலையை மென்மைப்படுத்தாமல் தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: ὁδοὺς
  choice: சாலைகள்
  rationale: பொதுப் போக்குவரத்து வழிகளைப் பரவலாகக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: συνήγαγον
  choice: கூட்டிவந்தார்கள்
  rationale: அவர்கள் கண்டவர்களை ஒன்றுசேர்த்து விருந்திடம் அழைத்து வந்தார்கள் என்ற சூழல்சார்ந்த இயக்கத்தையும் συνάγω என்பதன் ‘கூட்டுதல்’ பொருளையும் வெளிப்படுத்துகிறது.
- source_word: πάντας οὓς εὗρον
  choice: தாங்கள் கண்ட எல்லாரையும்
  rationale: πάντας என்பதன் முழுமையான உள்ளடக்கத்தையும் தொடர்புச் சொற்றொடரையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: πονηρούς τε καὶ ἀγαθούς
  choice: தீயவர்களையும் நல்லவர்களையும்
  rationale: இரு குழுக்களுக்கிடையிலான கூர்மையான ஒழுக்க வேறுபாட்டைப் பாதுகாக்கிறது; அழைப்பின் வேறுபாடற்ற விரிவைத் தெரிவிக்கிறது.
- source_word: γάμος
  choice: திருமண விருந்துக்கூடம்
  rationale: γάμος அடிப்படையில் திருமணம் அல்லது திருமண விருந்தைக் குறிக்கலாம்; அது விருந்தினர்களால் ‘நிறைந்தது’ என்பதால், இங்கு விருந்து நடைபெற்ற இடத்தை இயல்பான தமிழில் வெளிப்படையாகக் காட்டுகிறது.
- source_word: ἐπλήσθη
  choice: நிறைந்தது
  rationale: இடம் விருந்தினர்களால் நிரம்பியதை இயல்பாகவும் நேரடியாகவும் கூறுகிறது.
- source_word: ἀνακειμένων
  choice: பந்தியில் சாய்ந்து அமர்ந்திருந்த விருந்தினர்களால்
  rationale: பண்டைய விருந்துகளில் உணவருந்துவோர் மேசையருகே சாய்ந்திருக்கும் வழக்கத்தைக் குறிக்கும் வினையெச்சத்தின் பொருளைத் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: கூட்டிவரப்பட்டவர்களின் ஒழுக்கப் பண்புக் குறிப்பு
  choice: தீயவர்களையும் நல்லவர்களையும்
  alternative: கெட்டவர்களையும் நல்லவர்களையும்
  rationale: ‘தீயவர்கள்’ என்பது πονηρούς என்பதிலுள்ள ஒழுக்கக் கூர்மையைப் பாதுகாக்கிறது. அனைவரும் கூட்டிவரப்பட்டார்கள் என்பதை மட்டும் இவ்வசனம் கூறுகிறது; விருந்தில் இருப்பதற்கும் சரியான பதிலளிப்பிற்கும் இடையிலான உவமையின் பிந்தைய பதற்றத்தை இது முன்கூட்டியே தீர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அடிமைகள்’ என்பது மூலத்தின் சமூக உண்மையை மென்மைப்படுத்தாமல் தருகிறது; ‘பந்தியில் சாய்ந்து அமர்ந்திருந்த’ என்பது பண்டைய விருந்து முறையைச் சுருக்கமாக விளக்குகிறது.
