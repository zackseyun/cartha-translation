  source_fidelity: 'மூல கிரேக்கத்தின் முக்கிய கூறுகள் அனைத்தும் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன: οἱ δοῦλοι = “அடிமைகள்,” εἰς τὰς ὁδούς = “சாலைகளுக்குப்,” πάντας οὓς εὗρον = “தாங்கள் கண்ட எல்லாரையும்,” πονηρούς τε καὶ ἀγαθούς = “தீயவர்களையும் நல்லவர்களையும்.” γάμος இச்சூழலில் விருந்தினர்களால் நிறைவது என்பதால் “திருமண விருந்துக்கூடம்” என்பது பாதுகாப்பான சூழல்சார் விளக்கமாகும். ἀνακειμένων என்பதன் விருந்து-சாய்வுநிலை “பந்தியில் சாய்ந்து அமர்ந்திருந்த விருந்தினர்கள்” எனத் தக்கவாறு தரப்பட்டுள்ளது.'
