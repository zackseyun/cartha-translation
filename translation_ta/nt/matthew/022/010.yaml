  terminology: “அடிமைகள்” δοῦλοι என்பதன் சமூக உண்மையை மென்மைப்படுத்தாமல் காக்கிறது. “தீயவர்கள்/நல்லவர்கள்” மூலத்தின் ஒழுக்க எதிர்நிலையைத் துல்லியமாக வைத்திருக்கிறது. “திருமண விருந்துக்கூடம்” மற்றும் அதனுடன் இணைந்த குறிப்பு γάμος என்பதன் சொற்பொருள் நெகிழ்வைத் தெளிவாகக் காக்கின்றன. அடிக்குறிப்பு குறியீடுகள் உரையில் சரியாக இணைக்கப்பட்டுள்ளன.
