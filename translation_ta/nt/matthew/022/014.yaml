  source_fidelity: 'மூலக் கிரேக்கத்தின் சுருக்கமான எதிரிணை நம்பகமாகப் பாதுகாக்கப்பட்டுள்ளது: πολλοί/ὀλίγοι என்பவை ‘பலர்/சிலரே’ என்றும், κλητοί/ἐκλεκτοί என்பவை ‘அழைக்கப்பட்டவர்கள்/தேர்ந்தெடுக்கப்பட்டவர்கள்’ என்றும் துல்லியமாகத் தரப்பட்டுள்ளன. γάρ-இன் விளக்கத் தொடர்பு ‘ஏனெனில்’ என்பதாலும் δέ-இன் மாறுபாடு ‘ஆனால்’ என்பதாலும் இயல்பாக வெளிப்படுகிறது. தமிழில் வெளிப்படையான இணைப்புவினை தேவையில்லாததால் εἰσιν பெயர்ப் பயனிலை அமைப்பில் விடப்பட்டிருப்பது பொருத்தமானது.'
  naturalness: நடை நவீனத் தரத் தமிழில் தெளிவாகவும் சுருக்கமாகவும் உள்ளது. ‘பலர்; ஆனால் … சிலரே’ என்ற அமைப்பு மூலத்தின் பழமொழித் தன்மையையும் வலியுறுத்தலையும் நன்றாகக் காக்கிறது. தொடக்கத்தில் உள்ள காற்புள்ளி அவசியமில்லை என்றாலும், அது பொருளையோ வாசிப்பின் இயல்பையோ பாதிப்பதில்லை.
  terminology: ‘அழைக்கப்பட்டவர்கள்’ κλητοί என்பதன் பரந்த சொல்லுணர்வைப் பாதுகாக்கிறது; உடனடி விருந்து-உவமைச் சூழலுக்கான ‘விருந்துக்கு அழைக்கப்பட்டவர்கள்’ என்ற நுணுக்கம் அடிக்குறிப்பில் உரிய முறையில் விளக்கப்பட்டுள்ளது. ‘தேர்ந்தெடுக்கப்பட்டவர்கள்’ ἐκλεκτοί என்பதற்கு வெளிப்படையான, பிரிவுசார் கோட்பாட்டைத் திணிக்காத சமகாலத் தமிழ் இணையாகும். மாற்றுச் சொல்லாக ‘தெரிந்துகொள்ளப்பட்டவர்கள்’ தரப்பட்டுள்ளது.
