  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πολλοὶ γάρ εἰσιν κλητοὶ ὀλίγοι δὲ ἐκλεκτοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/014.yaml
  text: For many are called[b][a], but few are chosen.
translation:
  language: ta
  text: ஏனெனில், அழைக்கப்பட்டவர்கள்[a] பலர்; ஆனால் தேர்ந்தெடுக்கப்பட்டவர்கள்[b] சிலரே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அழைப்புப் பெற்றவர்கள்”; இச்சூழலில் விருந்துக்கு அழைக்கப்பட்டவர்கள் என்ற நுணுக்கம் இச்சொல்லுக்கு இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தெரிந்துகொள்ளப்பட்டவர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: பலர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் பன்மை உரிச்சொல்லின் இயல்பான தமிழாக்கம்; ὀλίγοι என்பதுடனான முரண்பாட்டையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய உவமைக் கூற்றுக்கு விளக்கக் காரணத்தைத் தரும் இணைப்புச் சொல்லின் வலிமையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἰσιν
  choice: —வர்கள்
  rationale: கிரேக்கத்தின் நிகழ்கால ‘இருக்கிறார்கள்’ என்ற பொருள், தமிழில் ‘அழைக்கப்பட்டவர்கள் பலர்’ மற்றும் ‘தேர்ந்தெடுக்கப்பட்டவர்கள் சிலரே’ என்ற இயல்பான பெயர்ப் பயனிலை அமைப்பில் உள்ளடங்கியுள்ளது.
- source_word: κλητοὶ
  choice: அழைக்கப்பட்டவர்கள்
  rationale: ‘அழைக்கப்பட்டவர்கள்’ என்பது சொல்லின் பரந்த பொருளையும் ἐκλεκτοί என்பதுடனான இறையியல் நிறைந்த முரண்பாட்டையும் பாதுகாக்கிறது; விருந்து உவமையில் சாத்தியமான ‘அழைப்புப் பெற்றவர்கள்’ என்ற நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ὀλίγοι
  choice: சிலரே
  rationale: πολλοί என்பதற்கான நேர்முரணை வெளிப்படுத்துகிறது; ‘-ஏ’ விகுதி மிகக் குறைந்தோர் என்ற முரண்பாட்டை இயல்பாக வலியுறுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: இரு பகுதிகளுக்கிடையேயுள்ள தெளிவான எதிர்மறை வேறுபாட்டை வெளிப்படுத்துகிறது.
- source_word: ἐκλεκτοί
  choice: தேர்ந்தெடுக்கப்பட்டவர்கள்
  rationale: ‘தேர்ந்தெடுக்கப்பட்டவர்கள்’ என்பது வெளிப்படையான சொற்பொருளைத் தருகிறது; பிற்கால கோட்பாட்டுச் சொற்களை முதன்மை உரையில் திணிக்காமல் கிரேக்கத்தின் இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: தேர்ந்தெடுப்பு மற்றும் அழைப்பு குறித்த விவாதங்களில் பயன்படும் ἐκλεκτοί என்பதன் மொழிபெயர்ப்பு
  choice: தேர்ந்தெடுக்கப்பட்டவர்கள்
  alternative: தெரிந்துகொள்ளப்பட்டவர்கள்
  rationale: முதன்மை உரை கிரேக்கச் சொல்லின் தெளிவான செயப்பாட்டு அர்த்தத்தை வழங்குகிறது. பாரம்பரியத் தமிழில் காணப்படும் ‘தெரிந்துகொள்ளப்பட்டவர்கள்’ என்ற மாற்று, ‘அறிந்தவர்கள்’ எனத் தவறாகப் புரிய வாய்ப்புள்ளதால் அடிக்குறிப்பில் மட்டும் தரப்படுகிறது; எந்தக் குறிப்பிட்ட கோட்பாட்டு அமைப்பையும் மொழிபெயர்ப்பு தீர்மானிப்பதில்லை.
- issue: விருந்தின் உவமைச் சூழலில் κλητοί என்பதன் மொழிபெயர்ப்பு
  choice: அழைக்கப்பட்டவர்கள்
  alternative: அழைப்புப் பெற்றவர்கள்
  rationale: உடனடிச் சூழலில் விருந்துக்கு அழைக்கப்பட்டவர்கள் என்ற பொருள் பொருத்தமானது. இருப்பினும் ‘அழைக்கப்பட்டவர்கள்’ என்பது சொல்லின் பரந்த ஒலிப்பையும் ἐκλεκτοί உடனான சுருக்கமான எதிரிணையையும் பாதுகாக்கிறது; விருந்து சார்ந்த மாற்று அடிக்குறிப்பில் உள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான, பழமொழித் தன்மை கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கச் சொல்வரிசையின் ‘பலர்—சிலர்’ எதிரிணை பாதுகாக்கப்பட்டுள்ளது; தமிழின் இயல்புக்காக εἰσιν தனிச் சொல்லாக மொழிபெயர்க்கப்படாமல் பெயர்ப் பயனிலை அமைப்பில் உள்ளடக்கப்பட்டுள்ளது.
