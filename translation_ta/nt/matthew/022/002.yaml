  text: Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ, ὅστις ἐποίησεν γάμους τῷ υἱῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/002.yaml
  text: The kingdom of heaven was compared to a king who gave a wedding feast for his son[a][b].
translation:
  language: ta
  text: பரலோக அரசாட்சி, தன் மகனுக்காகத் திருமண விருந்து நடத்திய ஒரு அரசனைப் போல் இருந்தது[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு அரசனுக்கு ஒப்பிடப்பட்டது.” கிரேக்க வினைச்சொல் சொல்லுக்குச் சொல் “ஒப்பிடப்பட்டது” அல்லது “ஒத்ததாக்கப்பட்டது” என்று பொருள்படும்; உவமை அறிமுக வழக்கில் “ஒப்பிடலாம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் “திருமணங்கள்” என்று பன்மையில் உள்ளது; இது திருமண விழாக்களையோ திருமண விருந்தையோ குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡμοιώθη
  choice: ஒப்பிடப்பட்டது
  rationale: இது ὁμοιόω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவம். கிரேக்கத்தின் குறிப்பிட்ட செயப்பாட்டு வடிவத்தைப் பேணுகிறது; இயல்பான உவமை அறிமுகமாகிய ‘ஒப்பிடலாம்’ என்பதும் சாத்தியம்.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: பரலோக அரசாட்சி
  rationale: மத்தேயுவுக்கே உரிய ‘வானங்களின் அரசு/ஆட்சி’ என்ற சொல்லாட்சியை, இடத்தையும் ஆட்சிச் செயலையும் உள்ளடக்கக்கூடிய இயல்பான நவீனத் தமிழில் தருகிறது; ‘தேவனுடைய அரசாட்சி’ என்று ஒத்திசைக்கவில்லை.
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: ஓர் அரசனுக்கு
  rationale: ἄνθρωπος + βασιλεύς இங்கு ஒரே நபரை விளக்கும் இயல்பான கிரேக்க அமைப்பு. தமிழில் ‘ஒரு மனிதனாகிய அரசன்’ என்பது தேவையற்ற கனத்த நடையாக இருப்பதால், பொருளை இயல்பாக ‘ஓர் அரசன்’ என வழங்குகிறது.
- source_word: ὅστις
  choice: தன் ... நடத்திய
  rationale: தொடர்புப் பெயர்ச்சொல்லின் செயலைத் தமிழில் இயல்பான பெயரெச்சத் தொடராக மாற்றுகிறது.
- source_word: ἐποίησεν γάμους
  choice: திருமண விருந்து நடத்திய
  rationale: ποιέω + பன்மை γάμοι என்பது திருமண விழா அல்லது விருந்தை நடத்துவதைக் குறிக்கும் மரபுத்தொடர்; சொல்லுக்குச் சொல் ‘திருமணங்களைச் செய்தான்’ என்பது தமிழில் தவறாகப் புரியலாம்.
- source_word: τῷ υἱῷ αὐτοῦ
  choice: தன் மகனுக்கு
  rationale: மகனுக்காக நடத்தப்பட்ட நிகழ்வு என்ற பயன்நோக்குத் தொடர்பை நெருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
theological_decisions:
- issue: ἡ βασιλεία τῶν οὐρανῶν என்பதன் இயல்பு
  choice: பரலோக அரசாட்சி
  alternative: தேவனுடைய அரசாட்சி / பரலோக ராஜ்யம்
  rationale: மத்தேயுவின் தனித்துவமான ‘பரலோக’ சொல்லாட்சியை மாற்றாமல் வைத்துக்கொண்டு, βασιλεία-வின் ஆட்சி மற்றும் ஆளுகை நுணுக்கத்தைத் திறந்த நிலையில் பேணுகிறது.
- issue: உவமை அறிமுகத்தின் காலமும் செயப்பாட்டு வடிவமும்
  choice: ஒப்பிடப்பட்டது
  alternative: ஒப்பிடலாம் / போன்றது
  rationale: இறந்தகாலச் செயப்பாட்டு சுட்டுமுறையை நேரடியாகப் பேணுகிறது; வழக்கமான உவமை அறிமுகத்திற்காக சாத்தியமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பும் வேதாகம உரைக்கேற்ற கண்ணியமும் பேணப்பட்டுள்ளன. ‘ராஜ்யம்’ என்பதற்குப் பதில் தற்போதைய தமிழில் தெளிவான ‘அரசாட்சி’ பயன்படுத்தப்பட்டுள்ளது; செயப்பாட்டு வடிவத்தின் சிறு கனத்தை மூலத்தின் உண்மையான வடிவத்திற்காகத் தக்கவைத்துள்ளது.
