  text: εἰσελθὼν δὲ ὁ βασιλεὺς θεάσασθαι τοὺς ἀνακειμένους εἶδεν ἐκεῖ ἄνθρωπον οὐκ ἐνδεδυμένον ἔνδυμα γάμου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/011.yaml
  text: But when the king came in to look at the guests reclining at the table[b][a], he saw there a man not dressed in wedding clothes.
translation:
  language: ta
  text: ஆனால், பந்தியில் சாய்ந்திருந்த விருந்தினர்களைப் பார்க்க அரசர் உள்ளே வந்தபோது, திருமணத்திற்குரிய ஆடை அணியாத ஒரு மனிதனை அங்கே கண்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திருமண ஆடை அணியாத ஒரு மனிதனை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: உள்ளே வந்தபோது
  rationale: முதன்மை வினைக்கு முன் நிகழும் அரசரின் உள்ளே வரும் செயலை இயல்பான தமிழில் காலத் தொடர்புடன் காட்டுகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: கதையில் இப்போது உருவாகும் மிதமான எதிர்மறைத் திருப்பத்தையும் பதற்றத்தையும் வெளிப்படுத்துகிறது.
- source_word: ὁ βασιλεὺς
  choice: அரசர்
  rationale: அரசரை மரியாதையாகக் குறிப்பிடும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: θεάσασθαι
  choice: பார்க்க
  rationale: நோக்கத்தைக் குறிக்கும் வினையெச்சத்தின் பொருளைத் தக்கவைத்து, முறையான ஆய்வு என்ற கருத்தைத் தேவையின்றி மிகைப்படுத்தாமல் வழங்குகிறது.
- source_word: τοὺς ἀνακειμένους
  choice: விருந்தில் பந்தியில் சாய்ந்திருந்தவர்களை
  rationale: பண்டைய முறையான விருந்துகளில் மேசைப் பந்தியில் சாய்ந்து உண்பதைக் குறிக்கும் சொல்லின் பண்பாட்டுச் சிறப்பையும் விருந்து சூழலையும் தெளிவாகக் காக்கிறது.
- source_word: εἶδεν
  choice: கண்டார்
  rationale: ὁράω என்ற வினையின் எளிய கதைநடைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἐκεῖ
  choice: அங்கே
  rationale: இடத்தைக் குறிக்கும் கிரேக்க வினையடையின் நேரடியான, இயல்பான தமிழ் இணை.
- source_word: ἄνθρωπον
  choice: ஒரு மனிதனை
  rationale: உவமையில் வரும் தனிப்பட்ட ஆண் நபரைத் தெளிவாகக் குறிக்கிறது; பொதுவான மனிதகுலக் குறிப்பு அல்ல.
- source_word: οὐκ ἐνδεδυμένον
  choice: அணியாத
  rationale: அந்த நபர் தேவையான உடையை அணிந்திராத நிலையைக் குறிக்கும் நிறைவுநிலைப் பங்கேற்புச் சொல்லை சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἔνδυμα γάμου
  choice: திருமண விருந்து உடை
  rationale: திருமண விருந்துக்குப் பொருத்தமான உடையைச் சுட்டுகிறது. γάμος சூழலில் திருமண விருந்தையும் குறிக்கக்கூடும்; தமிழில் வெறும் ‘திருமண உடை’ என்பது மணமகனின் அல்லது மணமகளின் உடை எனத் தவறாகப் புரிய வாய்ப்புள்ளதால் ‘விருந்து’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: விருந்தினர்கள் சாய்ந்திருக்கும் உவமைப் படிமம்
  choice: விருந்து சூழலைத் தெளிவுபடுத்தி, பந்தியில் சாய்ந்திருந்தனர் என்ற பண்பாட்டு விவரத்தையும் தக்கவைத்தல்
  alternative: ‘விருந்தினர்கள்’ என்று மட்டும் மொழிபெயர்த்தல் அல்லது ‘சாய்ந்திருந்தவர்கள்’ என்று சொற்பொருளோடு மட்டும் வழங்குதல்
  rationale: இது பண்டைய விருந்தின் உடல் நிலையை வரலாற்றுத் துல்லியத்துடன் காக்கிறது; அதேவேளை அவர்கள் ஏன் சாய்ந்திருந்தார்கள் என்பதையும் சாதாரண வாசகர் புரிந்துகொள்ள உதவுகிறது.
- issue: ἄνθρωπον என்பதன் பாலினக் குறிப்பு
  choice: ஒரு மனிதனை
  alternative: ஒருவரை
  rationale: இங்கு சொல் மனிதகுலத்தைக் பொதுவாகக் குறிக்காமல், கதையிலுள்ள ஒரே ஆண் நபரைக் குறிக்கிறது; ஆகவே மூலத்தின் தனிநபர் மற்றும் பாலினச் சுட்டலைத் தக்கவைக்கிறது.
- issue: ἔνδυμα γάμου என்பதன் எண்ணும் பொருள் பரப்பும்
  choice: திருமண விருந்து உடை
  alternative: திருமண விருந்துக்குரிய ஆடை அல்லது திருமண உடைகள்
  rationale: கிரேக்கத்தில் ἔνδυμα ஒருமையில் உள்ளது. அதை ஒருமையாகக் காத்து, இது திருமண நிகழ்வுக்கான பொருத்தமான விருந்து ஆடை என்பதைத் தெளிவுபடுத்துகிறது; உடையின் குறிப்பிட்ட வடிவம் அல்லது அதன் அடையாளப் பொருளை மொழிபெயர்ப்பிலேயே தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பந்தியில் சாய்ந்திருந்தவர்கள்’ என்பது பண்டைய விருந்துப் பழக்கத்தைத் தெளிவாகக் காக்கிறது. ‘திருமண விருந்து உடை’ என்பது சாதாரண திருமண உடை அல்லது மணமக்களின் உடை என்ற தவறான புரிதலைத் தவிர்க்கிறது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
