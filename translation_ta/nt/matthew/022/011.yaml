- from: ஆனால், விருந்தில் பந்தியில் சாய்ந்திருந்தவர்களைப் பார்க்க அரசர் உள்ளே வந்தபோது, திருமண விருந்து உடை அணியாத ஒரு மனிதனை அங்கே கண்டார்.[a]
  to: ஆனால், பந்தியில் சாய்ந்திருந்த விருந்தினர்களைப் பார்க்க அரசர் உள்ளே வந்தபோது, திருமணத்திற்குரிய ஆடை அணியாத ஒரு மனிதனை அங்கே கண்டார்.[a]
