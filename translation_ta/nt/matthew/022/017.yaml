translation:
  language: ta
  text: ஆகவே, “நீர் என்ன நினைக்கிறீர் என்பதை எங்களுக்குச் சொல்லுங்கள். சீசருக்குத் தலைவரி[a] கொடுப்பது முறையா, இல்லையா?” என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'தலைவரி: ரோம அரசால் கணக்கெடுப்பின் அடிப்படையில் விதிக்கப்பட்ட வரி.'
    reason: κῆνσος என்பதன் வரலாற்று-நிர்வாகக் குறிப்புத்தன்மையை விளக்குகிறது.
lexical_decisions:
- source_word: τί σοι δοκεῖ
  choice: நீர் என்ன நினைக்கிறீர்
  rationale: கருத்தைக் கேட்கும் கிரேக்கத் தொடரை இயல்பான, மரியாதையான நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: ἔξεστιν
  choice: முறையா
  rationale: ஒரு செயல் அனுமதிக்கப்பட்டதா அல்லது நியாய ஒழுங்கின்படி செய்யத்தக்கதா என்ற பொருளை இச்சூழலில் இயல்பாக வெளிப்படுத்துகிறது; ‘சட்டப்படி’ என்று குறுக்கி விடவில்லை.
- source_word: δοῦναι
  choice: கொடுப்பது
  rationale: மூலத்தில் உள்ள ‘கொடு’ என்ற வினையைப் பாதுகாக்கிறது; தமிழில் வரியுடன் இயல்பாக இணைகிறது.
- source_word: κῆνσον
  choice: வரி
  rationale: ரோம அரசின் தலைவரி அல்லது கணக்கெடுப்பு வரியைச் சுட்டுகிறது; வசனத்தின் முதன்மை உரையில் பொதுவாசகர்களுக்குப் புரியும் சுருக்கமான சொல்லாக ‘வரி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: Καίσαρι
  choice: சீசருக்கு
  rationale: ரோமப் பேரரசரைச் சுட்டும் பட்டப்பெயரை வழக்கமான தமிழ் வடிவில் தருகிறது.
theological_decisions:
- issue: ἔξεστιν என்பதன் அனுமதி/சட்டப்பூர்வத் தன்மை
  choice: முறையா
  alternative: சட்டப்படி அனுமதிக்கப்பட்டதா
  rationale: கேள்வி வெறும் ரோமச் சட்டத்தைப் பற்றியது மட்டுமல்லாமல் மத-நெறிசார் அனுமதியையும் உள்ளடக்கக்கூடும். ‘முறையா’ அந்தத் திறந்த பொருளைத் தக்கவைக்கிறது.
translation_notes:
  register: மரியாதைப் பன்மையான ‘நீர்/நினைக்கிறீர்’ பயன்படுத்தப்பட்டுள்ளது. நேரடியான பேச்சு இயல்பான நவீனத் தமிழில் அமைக்கப்பட்டுள்ளது; ‘ஆகவே’ என்பது οὖν என்பதன் தொடர்ச்சிப் பொருளைப் பாதுகாக்கிறது.
