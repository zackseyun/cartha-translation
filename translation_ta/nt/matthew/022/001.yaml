source:
  edition: SBLGNT
  text: Καὶ ἀποκριθεὶς ὁ Ἰησοῦς πάλιν εἶπεν ⸂ἐν παραβολαῖς αὐτοῖς⸃ λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/001.yaml
  text: 'And Jesus answered and again spoke to them in parables[a], saying:'
translation:
  language: ta
  text: 'இயேசு பதிலளித்து, மீண்டும் அவர்களிடம் உவமைகள் மூலம் பேசினார்[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இயேசு பதிலளித்து, மீண்டும் அவர்களிடம் உவமைகளில் பேசினார்.” உடனடியாக ஒரு கேள்வி குறிப்பிடப்படாவிட்டாலும், கிரேக்கக் கதைநடையில் ‘பதிலளித்தார்’ என்பது வழக்கமாகப் பயன்படுத்தப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: (தனி இணைப்புச்சொல்லாக வெளிப்படுத்தப்படவில்லை)
  rationale: தமிழில் முந்தைய நிகழ்வுடன் தொடர்ச்சியை இயல்பான வாக்கிய ஓட்டமே காட்டுகிறது; ‘மேலும்’ எனச் சேர்த்தால் தேவையற்ற வலியுறுத்தல் தோன்றலாம்.
- source_word: ἀποκριθεὶς
  choice: பதிலளித்து
  rationale: நேரடியான கேள்வி உடனே முன்வராதபோதும், கிரேக்கக் கதைநடை மரபில் இது வழக்கமான சொல்லாட்சி; அதன் வடிவத்தைத் தமிழிலும் காக்கிறது.
- source_word: ὁ Ἰησοῦς
  choice: இயேசு
  rationale: தமிழில் இயல்பான பெயர் வடிவம்; கிரேக்க மொழியின் சுட்டுருபைத் தனியே மொழிபெயர்க்கத் தேவையில்லை.
- source_word: πάλιν
  choice: மறுபடியும்
  rationale: பேச்சுச் செயல் மீண்டும் நிகழ்வதை நேரடியாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: εἶπεν
  choice: பேசினார்
  rationale: பின்வரும் λέγων என்பதுடன் ‘சொன்னார்—சொல்லி’ போன்ற தேவையற்ற மறுபதிப்பைத் தவிர்த்து, வாய்மொழி உரையின் பொருளைக் காக்கிறது.
- source_word: ἐν παραβολαῖς
  choice: உவமைகளாக
  rationale: ἐν இங்கு முறை அல்லது ஊடகத்தைக் குறிக்கிறது; இயேசு உவமைகளின் வடிவில் பேசியதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: αὐτοῖς
  choice: அவர்களுக்கு
  rationale: பேச்சின் கேட்போரைக் குறிக்கும் வேற்றுமைப் பொருளை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: λέγων
  choice: (அடுத்துவரும் உரையை அறிமுகப்படுத்தும் முக்காற்புள்ளியில் வெளிப்படுத்தப்பட்டது)
  rationale: ‘சொல்லி’ எனத் தனியே சேர்ப்பது தமிழில் செயற்கையாக அமையலாம்; அடுத்த வசனத்தின் நேரடி உரையை முக்காற்புள்ளி இயல்பாக அறிமுகப்படுத்துகிறது.
theological_decisions:
- issue: உடனடியாக வெளிப்படையான கேள்வி இல்லாத இடத்தில் ἀποκριθεὶς என்பதன் கதைநடைப் பயன்பாடு
  choice: ‘பதிலளித்து’ என்று தக்கவைத்தல்
  alternative: ‘பேசத் தொடங்கி’ அல்லது ‘அவர்களிடம்’ என்று மென்மைப்படுத்துதல்
  rationale: இது தனிப்பட்ட இறையியல் கருத்தைத் தீர்மானிப்பதல்ல; முந்தைய உரையாடலுக்கான தொடர்பையும் கிரேக்கச் சொல்லாட்சியின் உண்மையான சிறு பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், மரியாதையும் எளிமையும் கொண்ட கதைநடை. ‘உவமை’ என்ற பரவலாக அறியப்பட்ட வேதாகமச் சொல்லைத் தக்கவைத்து, கிரேக்க வாக்கிய அமைப்பைத் தமிழில் இயல்பாக மாற்றியுள்ளது.
