revisions:
- from: இதைக் கேட்டபோது[a], மக்கள் கூட்டத்தினர் அவருடைய போதனையைக் குறித்து வியப்படைந்தார்கள்.
  to: இதைக் கேட்டபோது[a], கூட்டத்தினர் அவருடைய போதனையைக் கண்டு வியப்படைந்தார்கள்.
  rationale: திருத்தம் பொருளை மாற்றாமல், நவீன நிலையான தமிழில் இயல்பான சொல்லாக்கத்தை அளிக்கிறது. ‘கூட்டத்தினர்’ கிரேக்கப் பன்மையைக் காக்கிறது; ‘போதனையைக் கண்டு’ அவருடைய போதனையே வியப்பின் காரணம் அல்லது நிகழ்வாக இருந்ததைத் தெளிவாகத் தருகிறது. அடிக்குறிப்பு குறியீடும் அதன் விளக்கமும் பாதுகாக்கப்பட்டுள்ளன.
