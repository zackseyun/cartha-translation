- source_word: ἐξεπλήσσοντο
  choice: வியப்படைந்தார்கள்
  rationale: அவர்களுடைய வலுவான ஆச்சரியத்தை மரியாதையான, இன்றைய பொதுத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: அவருடைய போதனையைக் குறித்து
  rationale: ἐπί உடன் வரும் இத்தொடர் வியப்புக்கான அடிப்படை அல்லது நிகழ்வைச் சுட்டுகிறது. ‘போதனை’ என்பது διδαχή-யை தேவையற்ற தொழில்நுட்பத் தொனியின்றி தருகிறது.
- source_word: καὶ
  choice: தனி இணைப்புச் சொல் சேர்க்கப்படவில்லை
  rationale: தமிழில் முந்தைய நிகழ்வைத் தொடர்ந்து வரும் ‘இதைக் கேட்டபோது’ என்ற தொடக்கமே καί தரும் கதைத் தொடர்ச்சியை இயல்பாக உணர்த்துகிறது; ‘மேலும்’ என்று சேர்ப்பது இங்கு செயற்கையாக ஒலிக்கும்.
