    reason: ἀκούσαντες என்ற வினையெச்சத்தைத் தமிழில் வேறு விதமாகவும் தர முடியும்; ‘இதை’ என்பது சூழலிலிருந்து நிரப்பப்பட்ட பொருள்.
lexical_decisions:
- source_word: ἀκούσαντες
  choice: இதைக் கேட்டபோது
  rationale: இறந்தகால வினையெச்சத்தின் காலத் தொடர்பை இயல்பான நவீனத் தமிழில் காட்டுகிறது. ‘இதை’ என்பது முந்தைய வசனத்தில் இயேசு கூறிய பதிலைச் சூழலிலிருந்து உணர்த்துகிறது.
- source_word: οἱ ὄχλοι
