source:
  edition: SBLGNT
  text: Δευτέρα ⸀δὲ ὁμοία ⸀αὐτῇ· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/039.yaml
  text: 'And a second is like it: You shall love your neighbor as yourself[a].'
translation:
  language: ta
  text: 'இரண்டாவது கட்டளையும் அதைப் போன்றது[a]: ‘உன் அயலவரை உன்னைப் போல அன்புகூர வேண்டும்.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இரண்டாவதும் அதைப் போன்றது.’
    reason: Δευτέρα பெயர்ச்சொல்லாகப் பயன்படுகிறது; ‘கட்டளை’ என்பது முன்சூழலிலிருந்து புரிந்துகொள்ளப்படும் சொல்லாகும்.
lexical_decisions:
- source_word: Δευτέρα
  choice: இரண்டாவது கட்டளை
  rationale: பெயர்ச்சொல் இல்லாமல் பெயர்ச்சொல்லாகச் செயல்படும் பெண்பால் வரிசைமுறைப் பெயரடை இது. முந்தைய வசனத்தின் சூழலில் ‘கட்டளை’ என்பது இயல்பாகப் புரிந்துகொள்ளப்படுவதால், தமிழில் அதை வெளிப்படையாகச் சேர்ப்பது பொருளைத் தெளிவாக்குகிறது.
- source_word: δὲ
  choice: -உம்
  rationale: இங்கு δέ வலுவான முரண்பாட்டைக் காட்டாமல், முந்தைய கூற்றுடன் அடுத்ததை இணைக்கிறது. ‘கட்டளையும்’ என்பதிலுள்ள ‘-உம்’ இந்த மென்மையான இணைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: ὁμοία αὐτῇ
  choice: அதைப் போன்றது
  rationale: αὐτῇ முந்தைய முதலாவது கட்டளையைச் சுட்டுகிறது; ὁμοία ஒற்றுமை அல்லது ஒப்புமையைக் குறிக்கிறது. ‘அதைப் போன்றது’ என்பது இந்த உறவைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: Ἀγαπήσεις
  choice: அன்புகூர வேண்டும்
  rationale: மேற்கோளிடப்பட்ட கட்டளையில் எதிர்கால வினை கட்டளை வலிமையுடன் வருகிறது. நவீன தமிழில் ‘அன்புகூர வேண்டும்’ அந்தக் கடமையுணர்வை மரியாதையான வேதாகம நடையில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὸν πλησίον σου
  choice: உனக்கு அடுத்திருப்பவர்
  rationale: πλησίον என்பது வெறும் இட அண்மையை மட்டுமல்லாமல் ஒருவருடன் தொடர்பில் உள்ள ‘அயலார்/அடுத்தவர்’ என்ற பொருளைக் கொண்டது. ‘உனக்கு அடுத்திருப்பவர்’ பாலினத்தை வரையறுக்காமல், சாதாரண வாசகருக்குப் புரியும் வகையில் உறவுசார் அண்மையை வெளிப்படுத்துகிறது.
- source_word: ὡς
  choice: போல
  rationale: அன்பின் அளவுகோலை ஒப்பீட்டின் மூலம் அறிமுகப்படுத்துகிறது; தமிழில் ‘போல’ நேரான, இயல்பான இணை.
- source_word: σεαυτόν
  choice: உன்மீது நீ
  rationale: தன்னையே சுட்டும் பிரதிபெயரின் பொருளை தமிழில் இயல்பான ஒப்பீட்டு அமைப்பாகத் தருகிறது. ‘உன்னை’ என்பதும் சாத்தியம்; ஆனால் ‘உன்மீது நீ அன்புகூருவது போல’ என்பது அடுத்த இணையான சொற்றொடருடன் தெளிவாக ஒத்திசைகிறது.
theological_decisions:
- issue: இரண்டாவது கட்டளைக்கும் முதலாவது கட்டளைக்கும் உள்ள உறவு
  choice: இரண்டாவது கட்டளையும் அதைப் போன்றது
  alternative: அதற்கு ஒப்பான இரண்டாவது கட்டளை
  rationale: மூலமொழி இரு கட்டளைகளையும் ஒன்றாகக் கலக்காமல், இரண்டாவது கட்டளை முதலாவது கட்டளையைப் போன்றது எனக் கூறுகிறது. தமிழாக்கம் அந்த ஒப்புமையை மட்டும் காத்து, அவற்றின் தரநிலை அல்லது தத்துவ உறவை மேலதிகமாக விளக்கவில்லை.
- issue: அன்பின் ஒப்பீட்டு அளவுகோல்
  choice: உன்மீது நீ அன்புகூருவது போல
  alternative: உன்னைப் போல
  rationale: ὡς σεαυτόν என்ற சுருக்கமான கிரேக்கத் தொடரை, ஒருவர் தம்மீது காட்டும் அன்பை ஒப்பீட்டு அளவுகோலாகக் குறிப்பிடும் வகையில் தமிழில் வெளிப்படுத்துகிறது; இது தன்னன்பைக் குறித்து புதிய தனிக் கட்டளையைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையைப் பயன்படுத்துகிறது. ‘அன்புகூர’ என்பது வேதாகம மேற்கோளுக்கேற்ற கண்ணியமான சொல்; ‘வேண்டும்’ கட்டளையின் வலிமையை நவீன தமிழில் தெளிவாகத் தருகிறது. பாலினச் சார்பைத் தவிர்க்க ‘அடுத்திருப்பவர்’ பயன்படுத்தப்பட்டுள்ளது.
