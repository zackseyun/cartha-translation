  text: εἰ οὖν Δαυὶδ καλεῖ αὐτὸν κύριον, πῶς υἱὸς αὐτοῦ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/045.yaml
  text: If[a], then, David calls him Lord, how is he his son?
translation:
  language: ta
  text: ஆகவே, தாவீது அவரை ‘ஆண்டவர்’ என்று அழைக்கிறார் என்றால்[a], அவர் எப்படி தாவீதின் மகனாக இருக்கிறார்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, சூழலை இன்னும் வெளிப்படையாகக் காட்டி: ‘ஆகவே, தாவீது மேசியாவை “ஆண்டவர்” என்று அழைக்கிறார் என்றால், அவர் எப்படி தாவீதின் மகனாக இருக்கிறார்?’'
    reason: முந்தைய வசனங்களிலிருந்து ‘அவரை’ என்பது மேசியாவைக் குறிக்கிறது என்பதை வெளிப்படுத்தும் மாற்று வாசகம்.
lexical_decisions:
- source_word: εἰ οὖν
  choice: ஆகவே ... என்றால்
  rationale: εἰ என்பதன் நிபந்தனைத் தன்மையையும் οὖν என்பதன் முடிவுக்குக் கொண்டுவரும் வாதத் தொடர்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: Δαυὶδ
  choice: தாவீது
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: καλεῖ
  choice: அழைக்கிறார்
  rationale: ஒருவரை ஒரு பட்டப்பெயரால் அழைப்பதைக் குறிக்கும் καλέω என்பதன் பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: αὐτὸν
  choice: அவரை
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்டவரைச் சுட்டும் ஆண்பால் ஒருமைச் சுட்டுப்பெயரை மரியாதையான இயல்பான தமிழில் தருகிறது.
- source_word: κύριον
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான வழக்கமான தமிழாக்கம்; சங்கீதம் 110:1-ன் எதிரொலியையும் மரியாதை மற்றும் அதிகாரப் பொருளையும் காக்கிறது.
- source_word: πῶς
  choice: எப்படி
  rationale: இரண்டு கூற்றுகளுக்கிடையிலான தொடர்பைக் கேள்வியாக முன்வைக்கும் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: υἱὸς αὐτοῦ
  choice: தாவீதின் மகன்
  rationale: ‘மகன்’ என்ற குடும்ப மற்றும் அரச வம்சச் சொல்லாட்சியைத் தக்கவைக்கிறது. தமிழில் சுட்டுப்பெயர் குழப்பத்தைத் தவிர்க்க αὐτοῦ குறிக்கும் தாவீதின் பெயர் மீண்டும் தரப்படுகிறது.
- source_word: ἐστιν
  choice: இருக்கிறார்
  rationale: மூலத்தின் நிகழ்கால இணைப்புச் சொல்லை, மனிதரைக் குறிக்கும் மரியாதையான தமிழ் வினைவடிவில் தருகிறது.
theological_decisions:
- issue: தாவீது மேசியாவை ‘ஆண்டவர்’ என்று அழைப்பதற்கும் அவர் தாவீதின் மகனாக இருப்பதற்கும் இடையிலான மேசிய மற்றும் கிறிஸ்துவியல் பதற்றம்
  choice: முதன்மை உரையில் ‘ஆண்டவர்’ மற்றும் ‘தாவீதின் மகன்’ என்ற இரு கூறுகளையும் விளக்கித் தீர்க்காமல் அப்படியே வைத்தல்
  alternative: ‘தாவீது மேசியாவை ஆண்டவர் என்று அழைத்தால், மேசியா எப்படி தாவீதின் மகனாக இருக்க முடியும்?’ என்று வெளிப்படையாகக் கூறுதல்
  rationale: αὐτόν என்பதன் குறிப்பு முந்தைய சூழலிலிருந்து வருகிறது; இந்த வசனத்தின் கிரேக்க உரையில் ‘மேசியா’ என்பது வெளிப்படையாக இல்லை. ஆகவே அதை முதன்மை உரையில் சேர்க்காமல், இயேசுவின் வாதத்திலுள்ள தாவீதிய மகத்துவமும் மேலான ஆண்டவர் நிலையும் சேர்ந்த உண்மையான பதற்றம் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் கேள்வியின் கண்ணியமான வாதத் தொனியைத் தக்கவைக்கும் வகையிலும் அமைக்கப்பட்டது. ‘அவருடைய மகன்’ என்று எழுதினால் தமிழில் சுட்டுப்பெயர் குழப்பம் ஏற்படக்கூடும் என்பதால் ‘தாவீதின் மகன்’ எனப் பெயர் மீண்டும் கூறப்பட்டுள்ளது.
