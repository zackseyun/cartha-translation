  text: Οἱ δὲ Φαρισαῖοι ἀκούσαντες ὅτι ἐφίμωσεν τοὺς Σαδδουκαίους συνήχθησαν ἐπὶ τὸ αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/034.yaml
  text: But when the Pharisees heard that he had silenced the Sadducees[a], they gathered together.
translation:
  language: ta
  text: ஆனால் இயேசு சதுசேயர்களை வாயடைக்கச் செய்தார்[a] என்று பரிசேயர்கள் கேள்விப்பட்டபோது, அவர்கள் ஒன்றுகூடினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சார்பாக, “சதுசேயர்களுக்கு வாய்ப்பூட்டினார்.” கிரேக்க வினைச்சொல் ஒரு விலங்கின் வாயைக் கட்டுவதைக் குறிக்கலாம்; இங்கே விவாதத்தில் அவர்களைப் பேச முடியாதபடி செய்தார் என்ற உருவகப் பொருளில் வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய நிகழ்வுடன் உள்ள மென்மையான எதிர்மறைத் தொடர்பையும் கதை நகர்வையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: Φαρισαῖοι
  choice: பரிசேயர்கள்
  rationale: இந்த யூத சமயக் குழுவுக்குத் தமிழில் வழக்கிலுள்ள ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
- source_word: ἀκούσαντες
  choice: கேள்விப்பட்டபோது
  rationale: இறந்தகாலப் பெயரெச்சத்தின் காலச்சார்ந்த பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐφίμωσεν
  choice: வாயடைக்கச் செய்தார்
  rationale: வினைச்சொல்லின் அடிப்படை உருவகமான ‘வாயைக் கட்டுதல்’ என்பதையும், விவாதத்தில் பேச முடியாதபடி செய்தார் என்ற சூழல் பொருளையும் தமிழில் தெளிவாகத் தக்கவைக்கிறது.
- source_word: Σαδδουκαίους
  choice: சதுசேயர்களை
  rationale: இந்த யூத சமயக் குழுவுக்குத் தமிழில் வழக்கிலுள்ள ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
- source_word: συνήχθησαν
  choice: ஒன்றுகூடினார்கள்
  rationale: செயப்பாட்டு வடிவம் இங்கு தாமாகக் கூடிவந்தனர் என்ற இடைநிலைப் பொருளில் இருப்பதை இயல்பான தமிழில் தருகிறது.
- source_word: ἐπὶ τὸ αὐτό
  choice: ஒன்றுகூடினார்கள் என்பதில் ‘ஒன்று’
  rationale: ‘ஒரே இடத்தில்/ஒன்றாக’ என்ற சொற்றொடரின் பொருளை வினையோடு இணைத்து இயல்பாகத் தருகிறது; இடத்தையோ நோக்கத்தையோ தேவையின்றி குறிப்பாக்கவில்லை.
