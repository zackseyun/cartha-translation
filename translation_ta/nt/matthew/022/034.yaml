translation_notes:
  register: நவீன, பொதுவாகப் புரியும், கண்ணியமான தமிழ் நடை. கிரேக்கத்தின் வாயைக் கட்டும் உருவகம் தமிழில் இயல்பாகத் தக்கவைக்கப்பட்டு, அதன் சொற்சார்ந்த பின்னணி அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. கிரேக்கத்தில் வெளிப்படையாக இல்லாவிட்டாலும், முந்தைய சூழலில் தெளிவாக உள்ள கர்த்தாவைத் தமிழில் குழப்பமின்றி அடையாளப்படுத்த ‘இயேசு’ சேர்க்கப்பட்டுள்ளது.
