  text: ἐν ταύταις ταῖς δυσὶν ἐντολαῖς ὅλος ὁ νόμος ⸂κρέμαται καὶ οἱ προφῆται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/040.yaml
  text: On these two commandments hang the whole Law and the Prophets[a][b].
translation:
  language: ta
  text: இந்த இரண்டு கட்டளைகளில்தான் திருச்சட்டம் முழுவதும், தீர்க்கதரிசிகளும் தொங்குகின்றன.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இந்த இரண்டு கட்டளைகளில்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ἐν என்பதன் நேரடிப் பொருள் ‘இல்’; இங்கு ‘தொங்குகின்றன’ என்ற உருவகத்துடன் சேர்ந்து, இக்கட்டளைகளைச் சார்ந்திருப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘திருச்சட்டமும் தீர்க்கதரிசிகளும்’ என்பது மறைநூல் சாட்சியை மொத்தமாகக் குறிக்கும் நிலையான சொல்லாட்சி; அதன் போதனை இந்த இரண்டு கட்டளைகளில் சுருக்கமாக அடங்கியுள்ளது.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν ταύταις ταῖς δυσὶν ἐντολαῖς
  choice: இந்த இரண்டு கட்டளைகளில்தான்
  rationale: ἐν என்பதன் அடிப்படைப் பொருளான ‘இல்’ என்பதையும், κρέμαται உடன் அது தெரிவிக்கும் சார்பையும் தமிழில் இயல்பாக இணைக்கிறது. ‘தான்’ முழுச் சார்பையும் வலியுறுத்துகிறது.
- source_word: ὅλος ὁ νόμος
  choice: திருச்சட்டம் முழுவதும்
  rationale: ὅλος தெரிவிக்கும் முழுமையைப் பாதுகாக்கிறது. இங்கு νόμος பொதுவான சட்டத்தை அல்ல, யூத மறைநூல்களின் ‘திருச்சட்டத்தை’ குறிக்கிறது.
- source_word: κρέμαται
  choice: தொங்குகின்றன
  rationale: ‘சார்ந்திருக்கின்றன’ என்று பொருளை மட்டும் விளக்காமல், கிரேக்க மூலத்திலுள்ள உயிரோட்டமான தொங்குதல் உருவகத்தைத் தக்கவைக்கிறது. கூட்டு எழுவாய்க்கேற்ப தமிழில் பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: καὶ οἱ προφῆται
  choice: தீர்க்கதரிசிகளின் நூல்களும்
  rationale: இது தீர்க்கதரிசிகளாகிய நபர்களை மட்டும் அல்லாமல், ‘திருச்சட்டமும் தீர்க்கதரிசிகளும்’ என்ற மறைநூல் தொகுப்புச் சொல்லாட்சியைச் சுட்டுவதால், தமிழில் நோக்கம் தெளிவாக இருக்க ‘நூல்கள்’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘திருச்சட்டமும் தீர்க்கதரிசிகளும்’ என்ற சொல்லாட்சியின் பொருள்
  choice: இரண்டு அன்புக் கட்டளைகளைச் சார்ந்திருக்கும் மறைநூல் சாட்சியை முழுமையாகக் குறிக்கும் தொகுப்புச் சொல்லாட்சி
  alternative: சட்ட மற்றும் தீர்க்கதரிசன ஒழுக்கப் போதனைகளை மட்டும் குறிக்கும் குறுகிய வாசிப்பு
  rationale: மத்தேயுவில் இது அதிகாரமுள்ள மறைநூல் சாட்சிக்கான நிலையான சொல்லாட்சியாக வருகிறது. வசனத்தில் அதை ‘மறைநூல் முழுவதும்’ என்று மாற்றிப் பொழிப்புரை செய்யாமல், அதன் மரபார்ந்த இருபகுதி வடிவம் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘திருச்சட்டம்’ யூதத் தோராவைக் குறிக்கிறது; ‘தீர்க்கதரிசிகளின் நூல்கள்’ என்பது நபர்களைக் காட்டிலும் மறைநூல் பிரிவைத் தெளிவுபடுத்துகிறது. மூலத்தின் ‘தொங்குதல்’ உருவகம் பாதுகாக்கப்பட்டுள்ளது.
