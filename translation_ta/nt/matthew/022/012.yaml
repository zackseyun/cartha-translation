source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ἑταῖρε, πῶς εἰσῆλθες ὧδε μὴ ἔχων ἔνδυμα γάμου; ὁ δὲ ἐφιμώθη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/012.yaml
  text: And he says to him[a], ‘Friend, how did you come in here without a wedding garment?’ But he was speechless.
translation:
  language: ta
  text: அவர் அவனிடம், “நண்பனே, திருமணத்துக்குரிய ஆடை இல்லாமல் இங்கே எப்படி வந்தாய்?” என்று கேட்டார். அவனோ பதில் சொல்ல முடியாமல் மௌனமானான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொல்லுக்குச் சொல்லாக, “மௌனமாக்கப்பட்டான்.” கிரேக்க வினைச்சொல் “வாய்மூடி போடப்பட்டது” என்றும் பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑταῖρε
  choice: நண்பனே
  rationale: அழைப்புமுறையின் வெளிப்படையான மரியாதையையும், சூழலில் உள்ள மறைமுகக் கண்டிப்பையும் மிகைப்படுத்தாமல் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: πῶς
  choice: எப்படி
  rationale: கிரேக்கச் சொல் நோக்கத்தைக் காட்டும் ‘ஏன்’ என்பதைக் காட்டிலும், வந்த விதம் அல்லது சாத்தியத்தை விசாரிக்கும் ‘எப்படி’ என்ற பொருளை முதன்மையாகக் கொண்டுள்ளது.
- source_word: εἰσῆλθες ὧδε
  choice: இங்கே உள்ளே வந்தாய்
  rationale: உள்ளே நுழைந்த முடிவுற்ற செயலை இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: μὴ ἔχων
  choice: இல்லாமல்
  rationale: தேவையான ஆடை அவனிடம் இல்லாத உடன்நிலையைத் தமிழில் இயல்பாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: ἔνδυμα γάμου
  choice: திருமண ஆடை
  rationale: திருமணத்தோடு தொடர்புடைய ஓர் ஆடையைக் குறிக்கும் ஒருமையைப் பேணுகிறது; அது மேலங்கி அல்லது குறிப்பிட்ட வகை உடை என்று தேவையின்றி வரையறுக்கவில்லை.
- source_word: ἐφιμώθη
  choice: வாயடைத்துப்போனான்
  rationale: பதில் கூற முடியாத நிலையை நவீனத் தமிழில் இயல்பாகத் தருகிறது; வினைச்சொல்லின் வலுவான ‘வாயை அடக்குதல்/கட்டுதல்’ என்ற பின்னணியையும் ஓரளவு பேணுகிறது.
theological_decisions:
- issue: தகுந்த ஆடை இல்லாத விருந்தினரை விருந்தளிப்பவர் அழைக்கும் தொனி
  choice: மரியாதை தோன்றினாலும் மறைமுகக் கண்டிப்புள்ள ‘நண்பனே’
  alternative: ‘தோழனே’ அல்லது கடுமையான தொனியுள்ள ஓர் அழைப்பு
  rationale: Ἑταῖρε என்பதில் சூழலால் உருவாகும் இடைவெளியையும் கண்டிப்பையும் பேணுகிறது; அதே நேரத்தில் அன்பையோ பகையையோ மூலத்தைவிட அதிகமாகச் சேர்க்கவில்லை.
- issue: ἐφιμώθη என்பதன் செயப்பாட்டு வடிவமும் உருவக வலிமையும்
  choice: முடிவுநிலையை மையப்படுத்தும் ‘வாயடைத்துப்போனான்’
  alternative: சொல்லுக்குச் சொல்லாக ‘மௌனமாக்கப்பட்டான்’
  rationale: இயல்பான தமிழில் அவன் பதிலளிக்காத நிலையைத் தெளிவுபடுத்துகிறது. செயப்பாட்டு வடிவமும் ‘வாய்கட்டுதல்’ என்ற சொல்லுருவமும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன, பொதுநிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. அரசனைச் சுட்டும் எழுவாய் தமிழின் இயல்புக்கும் சூழலுக்கும் ஏற்ப மரியாதைப் பன்மையில் தரப்பட்டுள்ளது; கேள்வியின் நேரடியான கண்டிப்பும் இறுதி வாக்கியத்தின் திடீர் மௌனமும் பேணப்பட்டுள்ளன.
