id: MAT.22.16
reference: Matthew 22:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἀποστέλλουσιν αὐτῷ τοὺς μαθητὰς αὐτῶν μετὰ τῶν Ἡρῳδιανῶν ⸀λέγοντες· Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ τὴν ὁδὸν τοῦ θεοῦ ἐν ἀληθείᾳ διδάσκεις, καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/016.yaml
  text: And they send to him their disciples along with the Herodians[a], saying, “Teacher, we know that you are true and teach the way of God in truth, and you do not care about anyone[b], for you do not look at the face of men.”
translation:
  language: ta
  text: அவர்கள் தங்கள் சீடர்களை ஏரோதியர்களுடன்[a] அவரிடம் அனுப்பினார்கள். அவர்கள், “ஆசிரியரே, நீர் உண்மையானவர் என்றும், கடவுளின் வழியை உண்மையுடன் போதிக்கிறீர் என்றும் எங்களுக்குத் தெரியும். நீர் யாருடைய கருத்தையும் பொருட்படுத்துவதில்லை[b]; ஏனெனில், ஆள்பார்த்து நடப்பதில்லை[c]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஏரோதியர்கள்” என்பது ஏரோது அரசகுடும்பத்தையும் அதன் ஆட்சியையும் ஆதரித்தவர்களைக் குறிக்கும் பெயர்.
    reason: historical_context
  - marker: b
    text: அதாவது, யாருடைய கருத்தோ சமூக அந்தஸ்தோ உம்மைச் சாய்ப்பதில்லை; இது மக்கள்மீது அக்கறையின்மையைக் குறிக்கவில்லை.
    reason: idiom_clarification
  - marker: c
    text: 'சொல்லுக்குச் சொல்: “மனிதர்களின் முகத்தைப் பார்ப்பதில்லை.” இதற்கு “மக்களிடம் பாரபட்சம் காட்டுவதில்லை” அல்லது “வெளித்தோற்றத்தை வைத்து மதிப்பிடுவதில்லை” என்றும் பொருள் கொள்ளலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστέλλουσιν
  choice: அனுப்பி
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் இருந்தாலும், தமிழ் கதைநடையில் இயல்பாக அமையும் இறந்தகாலத் தொடர்வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: μαθητὰς
  choice: சீடர்களை
  rationale: நற்செய்தி நூல்களின் சூழலில் கற்றுக்கொண்டு பின்பற்றுவோரைக் குறிக்கும் வழக்கமான, தெளிவான தமிழ் சொல்.
- source_word: μετὰ τῶν Ἡρῳδιανῶν
  choice: ஏரோதியர்களுடன்
  rationale: μετά என்பதன் உடனிணைவு பொருளையும், இரு குழுக்களும் சேர்ந்து வந்ததையும் நேரடியாகக் காட்டுகிறது.
- source_word: Διδάσκαλε
  choice: போதகரே
  rationale: இங்கு இயேசுவைக் கற்பிப்பவர் என மரியாதையுடன் அழைப்பதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἀληθὴς
  choice: உண்மையானவர்
  rationale: இயேசுவின் நேர்மையான, மெய்யான தன்மையைச் சுருக்கமாகத் தெரிவிக்கிறது; ‘உண்மை பேசுகிறவர்’ எனப் பொருளைச் சுருக்கவில்லை.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: கடவுளின் வழியை
  rationale: கிரேக்க உருவகத்தைத் தக்கவைத்து, கடவுள் காட்டும் வாழ்க்கைநெறி அல்லது வழி என்ற பரந்த பொருளுக்கு இடமளிக்கிறது.
- source_word: ἐν ἀληθείᾳ
  choice: உண்மையுடன்
  rationale: போதனையின் உண்மைத்தன்மையையும் நேர்மையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὐ μέλει σοι περὶ οὐδενός
  choice: நீர் யாரையும் பொருட்படுத்துவதில்லை
  rationale: சொற்றொடரின் மேற்பரப்பு வடிவத்தை நெருக்கமாகப் பேணுகிறது; அக்கறையின்மை எனத் தவறாகப் புரியாதபடி சூழல்சார் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων
  choice: ஆள்பார்த்து நடப்பதில்லை
  rationale: மனிதர்களின் முகத்தைப் பார்ப்பதில்லை என்ற கிரேக்க மரபுத்தொடரின் கருத்தான பாரபட்சமின்மையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: οὐ μέλει σοι περὶ οὐδενός என்பதன் சாத்தியமான அக்கறையின்மைத் தோற்றம்
  choice: முதன்மை உரையில் ‘யாரையும் பொருட்படுத்துவதில்லை’ என நெருக்கமாக மொழிபெயர்த்து, சூழல்சார் பொருளை அடிக்குறிப்பில் விளக்குதல்
  alternative: யாருடைய கருத்தாலோ அந்தஸ்தாலோ நீர் பாதிக்கப்படுவதில்லை
  rationale: பேசுவோர் இயேசுவை இரக்கமற்றவர் எனக் கூறவில்லை; எந்த மனிதரின் கருத்தும் சமூக நிலையுமே அவரைச் சாய்க்காது என்று புகழ்வதுபோல் பேசுகிறார்கள். அதேவேளை, விளக்கத்தை முழுமையாக முதன்மை உரைக்குள் சேர்த்து மூலத்தின் பதற்றத்தை நீக்காமல் வைத்திருக்கிறது.
- issue: πρόσωπον ἀνθρώπων என்ற மரபுத்தொடர்
  choice: ஆள்பார்த்து நடப்பதில்லை
  alternative: மனிதர்களின் முகத்தைப் பார்ப்பதில்லை; பாரபட்சம் காட்டுவதில்லை; வெளித்தோற்றத்தை வைத்து மதிப்பிடுவதில்லை
  rationale: சொல்லுக்குச் சொல் மொழிபெயர்ப்பு தமிழில் தவறான காட்சிப் பொருளைத் தரக்கூடும். தேர்ந்தெடுத்த வடிவம் அந்தஸ்து அல்லது தோற்றத்தின் அடிப்படையில் வேறுபாடு காட்டாமையைத் தெளிவாகத் தெரிவிக்கிறது; மற்ற சாத்தியமான நுணுக்கங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையான ‘நீர்’ வடிவத்துடனும் நற்செய்தி நூலுக்கேற்ற கண்ணியமான கதைநடையுடனும் அமைக்கப்பட்டுள்ளது. புரியாத சொல்லுக்குச் சொல் மரபுத்தொடரைத் தவிர்த்து அதன் இயல்பான தமிழ்ப் பொருள் முதன்மை உரையில் தரப்பட்டுள்ளது; மூல வடிவமும் மாற்றுப் பொருள்களும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
