  to: அவர்கள் தங்கள் சீடர்களை ஏரோதியர்களுடன்[a] அவரிடம் அனுப்பினார்கள். அவர்கள், “ஆசிரியரே, நீர் உண்மையானவர் என்றும், கடவுளின் வழியை உண்மையுடன் போதிக்கிறீர் என்றும் எங்களுக்குத் தெரியும். நீர் யாருடைய கருத்தையும் பொருட்படுத்துவதில்லை[b]; ஏனெனில், ஆள்பார்த்து நடப்பதில்லை[c]” என்றார்கள்.
  rationale: அனுப்பியவர்களையும் பேசும் தூதுக்குழுவையும் தனித்த வாக்கியங்களால் வேறுபடுத்தி, καὶ ἀποστέλλουσιν ... λέγοντες என்ற தொடரின் உறவைத் தெளிவாகப் பாதுகாத்துள்ளேன். Διδάσκαλε-க்கு நடுநிலையான ‘ஆசிரியரே’ பயன்படுத்தப்பட்டுள்ளது. οὐ μέλει σοι περὶ οὐδενός என்பதன் அடுத்துவரும் பாரபட்சமின்மைக் காரணத்துடன் இணையும் பொருள் முதன்மை உரையிலும் அடிக்குறிப்பிலும் காக்கப்பட்டுள்ளது. மற்ற அடிக்குறிப்பு குறியீடுகளும் அவற்றின் உரைகளும் பொருத்தமாக உள்ளன.
