id: MAT.22.42
reference: Matthew 22:42
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγων· Τί ὑμῖν δοκεῖ περὶ τοῦ χριστοῦ; τίνος υἱός ἐστιν; λέγουσιν αὐτῷ· Τοῦ Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/042.yaml
  text: saying[a], “What do you think about the Messiah? Whose son is he?” They said to him, “David’s.”
translation:
  language: ta
  text: “மேசியாவைப்[a] பற்றி நீங்கள் என்ன நினைக்கிறீர்கள்? அவர் யாருடைய மகன்?” என்று கேட்டார். அவர்கள் அவரிடம், “தாவீதின் மகன்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்துவைப்.” Χριστός (கிறிஸ்தோஸ்) என்ற கிரேக்கப் பட்டம் இங்கு மேசியாவைக் குறிக்கும் பொருளில் பயன்படுத்தப்பட்டுள்ளது.
    reason: Χριστός என்பதற்கான வழக்கமான மாற்று மொழிபெயர்ப்பையும் அதன் பட்டப்பொருளையும் காட்டுகிறது.
lexical_decisions:
- source_word: λέγων
  choice: என்று கேட்டார்
  rationale: இந்நிகழ்வில் இயேசு கேள்விகளை முன்வைப்பதால், சொல்லர்த்தமான ‘என்று சொல்லி’ என்பதைக் காட்டிலும் இயல்பான தமிழில் பேச்சை அறிமுகப்படுத்தும் ‘என்று கேட்டார்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: Τί ὑμῖν δοκεῖ
  choice: நீங்கள் என்ன நினைக்கிறீர்கள்?
  rationale: δοκέω என்பதுடன் வரும் இந்த அமைப்பு ஒருவரின் கருத்தையோ மதிப்பீட்டையோ கேட்கிறது; இத்தமிழ் வடிவம் அந்தப் பொருளை இயல்பாகத் தருகிறது.
- source_word: περὶ τοῦ χριστοῦ
  choice: மேசியாவைப் பற்றி
  rationale: Χριστός இங்கு தனிப்பெயரைப் போல அல்லாமல், யூத மேசியா எதிர்பார்ப்பில் ஒரு பட்டமாகப் பயன்படுத்தப்பட்டுள்ளது; ஆகவே ‘மேசியா’ என வழங்கப்பட்டது.
- source_word: τίνος υἱός ἐστιν
  choice: அவர் யாருடைய மகன்?
  rationale: இது வம்சவழி உறவைப் பற்றிய நேரடியான கேள்வி. ‘அவர்’ என்பது முன்கூறப்பட்ட மேசியாவைக் குறிக்கிறது; மரியாதை ஒருமை நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: λέγουσιν αὐτῷ
  choice: அவர்கள் அவரிடம் … என்றார்கள்
  rationale: கிரேக்க வரலாற்று நிகழ்காலம் தமிழ்க் கதைநடையில் இயல்பான இறந்தகாலமாக வழங்கப்பட்டது; αὐτῷ என்பதும் ‘அவரிடம்’ என்று காக்கப்பட்டது.
- source_word: Τοῦ Δαυίδ
  choice: தாவீதின் மகன்
  rationale: கிரேக்கத்தில் கேள்வியிலுள்ள ‘மகன்’ என்ற சொல் பதிலில் விடுபட்டுள்ளது. தமிழில் வெறும் ‘தாவீதின்’ என்பது முழுமையற்றதாக இருப்பதால், சூழலில் தெளிவாக உள்ள சொல்லை நிரப்பி இயல்பாக வழங்கப்பட்டது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு Χριστός என்பது இயேசுவின் பெயர்போன்ற அடையாளமாக அல்ல, எதிர்பார்க்கப்பட்ட அபிஷேகம் பெற்ற அரசரைச் சுட்டும் பட்டமாக உள்ளது. ‘மேசியா’ அந்தப் பட்டப்பொருளைத் தெளிவாகக் காக்கிறது; மாற்று வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டது. ‘அவர்’ என்ற மரியாதை ஒருமை மேசியாவையும் இயேசுவையும் சூழலின்படி குறிக்கிறது. கிரேக்கப் பதிலின் விடுபட்ட ‘மகன்’ தமிழில் தெளிவுக்காக நிரப்பப்பட்டுள்ளது.
