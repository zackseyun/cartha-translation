id: MAT.22.6
reference: Matthew 22:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἱ δὲ λοιποὶ κρατήσαντες τοὺς δούλους αὐτοῦ ὕβρισαν καὶ ἀπέκτειναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/006.yaml
  text: But the rest[a], seizing his servants, mistreated them and killed them.
translation:
  language: ta
  text: ஆனால் மற்றவர்களோ, அவனுடைய அடிமைகளைப்[a] பிடித்து, அவர்களைக் கொடுமைப்படுத்தி, கொன்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பணியாளர்களை’.
    reason: δοῦλος என்பது சூழலுக்கேற்ப ‘அடிமை’ அல்லது ‘பணியாளர்’ என மொழிபெயர்க்கப்படலாம்.
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: ஆனால் மற்றவர்களோ
  rationale: முந்தைய வசனத்தில் அழைப்பைப் பொருட்படுத்தாமல் சென்றவர்களுக்கு மாறாக, மீதமிருந்த அழைக்கப்பட்டவர்களை λοιποί குறிக்கிறது; δέ-யின் மென்மையான எதிர்மறைத் திருப்பை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: κρατήσαντες
  choice: பிடித்து
  rationale: κρατέω இங்கு வலுக்கட்டாயமாகப் பற்றிப் பிடித்தலைக் குறிக்கிறது. முற்செயலைக் காட்டும் இறந்தகாலப் பங்கேற்புச் சொல்லின் தொடர்பைத் தமிழின் வினையெச்ச வடிவம் இயல்பாகப் பாதுகாக்கிறது.
- source_word: τοὺς δούλους αὐτοῦ
  choice: அவனுடைய அடிமைகளை
  rationale: δοῦλος என்பதில் எஜமானுக்குக் கட்டுப்பட்ட அடிமை நிலை உள்ளது. அரசனுக்குச் சொந்தமான தூதுவர்களைப் பற்றிய உவமைச் சூழலில் ‘அடிமைகள்’ அந்தச் சமூக நிலையை வெளிப்படையாகக் காக்கிறது; ‘பணியாளர்கள்’ என்பது சாத்தியமான மென்மையான மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ὕβρισαν
  choice: அவர்களைக் கொடுமைப்படுத்தி
  rationale: ὑβρίζω வெறும் வாய்மொழி அவமதிப்பை மட்டுமல்லாமல் இழிவான, வன்முறையான தவறான நடத்தையையும் உள்ளடக்குகிறது; ‘கொடுமைப்படுத்தி’ இந்த விரிந்த பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἀπέκτειναν
  choice: கொன்றார்கள்
  rationale: ἀποκτείνω என்பதன் நேரடியான பொருளைத் தருகிறது; ‘கொலை செய்தார்கள்’ என்று சொன்னால் மூல வினையில் வெளிப்படையாக இல்லாத சட்ட அல்லது அறநெறி நுணுக்கம் வலுப்பெறலாம்.
theological_decisions:
- issue: உவமைச் சூழலில் δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: அடிமைகள்
  alternative: பணியாளர்கள்
  rationale: இந்த உவமையில் அவர்கள் அரசனுக்குக் கட்டுப்பட்டவர்களும் அவனால் அனுப்பப்பட்டவர்களுமாக இருப்பதால், ‘அடிமைகள்’ மூலச்சொல்லின் சமூக உண்மையை மறைக்காமல் காக்கிறது. அதே நேரத்தில், பணிசெய்பவர்கள் என்ற சூழல்பொருளை முன்னிறுத்தும் ‘பணியாளர்கள்’ என்பதும் சாத்தியமான வாசிப்பாக அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘பிடித்து … கொடுமைப்படுத்தி, கொன்றார்கள்’ என்ற தொடர் கிரேக்க வினையெச்சத்தையும் அதைத் தொடர்ந்து வரும் இரண்டு முதன்மைச் செயல்களையும் தெளிவாக வெளிப்படுத்துகிறது.
