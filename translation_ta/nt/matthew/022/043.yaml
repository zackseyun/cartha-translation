base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/043.yaml
  text: He said to them[a], “How then does David, in the Spirit, call him Lord[b], saying,”
translation:
  language: ta
  text: அவர் அவர்களிடம், “அப்படியானால், தாவீது ஆவியினால்[a] அவரை ஆண்டவர்[b] என்று எப்படி அழைக்கிறார்? இவ்வாறு கூறுகிறார்:” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆவிக்குள்.” கிரேக்கச் சொற்றொடர் சூழலையோ செயலாற்றும் முகவரையோ குறிக்கலாம்; “ஆவியினால்” என்பது தமிழில் இயல்பான கருவிப்பொருள் வடிவம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எஜமான்.” κύριος என்ற கிரேக்கச் சொல் பொதுவாக “ஆண்டவர்” என்று மொழிபெயர்க்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: அவர் அவர்களிடம் … என்றார்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தை இயல்பான தமிழ் கதைநடையில் இறந்தகாலமாக வழங்குகிறது; λέγων என்பதுடன் சேர்ந்து அமைந்த நேரடி உரையையும் தெளிவாகச் சுற்றிவளைக்கிறது.
- source_word: Πῶς οὖν
  choice: அப்படியானால் … எப்படி
  rationale: πῶς என்பதன் வினாப்பொருளையும் οὖν என்பதன் முடிவுக்குக் கொண்டுவரும் தொடர்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: Δαυὶδ
  choice: தாவீது
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: ἐν πνεύματι
  choice: ஆவியானவருக்குள் இருந்து
  rationale: ἐν என்பதன் ‘உள்ளில்/சூழலில்’ என்ற நுட்பத்தைத் தக்கவைத்து, இச்சூழலில் πνεῦμα பரிசுத்த ஆவியானவரைக் குறிக்கும் வாய்ப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; கருவிப்பொருளான ‘ஆவியானவரால்’ என்பதும் சாத்தியம்.
- source_word: καλεῖ αὐτὸν κύριον
  choice: அவரை ‘ஆண்டவர்’ என்று … அழைக்கிறார்
  rationale: κύριος என்பதன் பட்டப்பெயர் சார்ந்த வலிமையையும் சங்கீத மேற்கோளுடனான தொடர்பையும் ‘ஆண்டவர்’ காக்கிறது; ‘எஜமான்’ என்பது சாத்தியமான மாற்று.
- source_word: λέγων
  choice: அவர் கூறுவது
  rationale: அடுத்து வரும் மேற்கோளுடன் இணைக்கும் நிகழ்காலப் பங்கேற்புவினையின் பணியை இயல்பான தமிழ் அறிமுகத் தொடராக வழங்குகிறது.
theological_decisions:
- issue: ἐν πνεύματι என்பதில் πνεῦμα எதைக் குறிக்கிறது
  choice: பரிசுத்த ஆவியானவர்
  alternative: தாவீதின் சொந்த ஆவி அல்லது ஆவிக்குரிய நிலை
  rationale: வேதவாக்கை ஆதாரமாகக் கொண்ட இவ்வாதச் சூழலில் தாவீது பரிசுத்த ஆவியானவரின் தாக்கத்தில் பேசுவதை இச்சொற்றொடர் பெரும்பாலும் குறிக்கிறது; ஆயினும் கிரேக்கத்தின் இடம்/கருவி சார்ந்த இரு நுட்பங்களும் அடிக்குறிப்பில் காக்கப்படுகின்றன.
- issue: κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: மேசியாவையும் சங்கீதம் 110-ஐயும் சார்ந்த இச்சூழலில் ‘ஆண்டவர்’ என்பது பட்டத்தின் வேதவாக்கிய மற்றும் இறையியல் முக்கியத்துவத்தைத் தக்கவைக்கிறது; அடிப்படை அதிகார உறவைக் காட்டும் ‘எஜமான்’ மாற்றாக இருக்கலாம்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. கேள்வியின் வாதத் தன்மையும் அடுத்து வரும் மேற்கோளுக்கான திறந்த முடிவும் காக்கப்பட்டுள்ளன.
