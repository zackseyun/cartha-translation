source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἔφη αὐτῷ· Ἀγαπήσεις κύριον τὸν θεόν σου ἐν ὅλῃ ⸀τῇ καρδίᾳ σου καὶ ἐν ὅλῃ ⸁τῇ ψυχῇ σου καὶ ἐν ὅλῃ τῇ διανοίᾳ σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/037.yaml
  text: And he said to him[c][b][a], “You shall love the Lord your God with all your heart and with all your soul and with all your mind.”
translation:
  language: ta
  text: அவர் அவனிடம், “உன் கடவுளாகிய ஆண்டவரை உன் முழு இதயத்தோடும், உன் முழு உயிரோடும்[a], உன் முழு மனதோடும்[b] அன்புகூர வேண்டும்” என்று கூறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உயிர்” என்பதற்கான கிரேக்கச் சொல், சூழலைப் பொறுத்து, “வாழ்வு” அல்லது “தான்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “மனம்” என்பதை “புரிந்துணர்வு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: (தனியாக மொழிபெயர்க்கப்படவில்லை)
  rationale: இங்கு δέ உரையாடலை மெதுவாகத் தொடரும் இணைப்புச்சொல். தமிழில் ‘அவர் ... கூறினார்’ என்ற இயல்பான தொடரிலேயே அதன் பணி வெளிப்படுவதால், ‘மேலும்’ அல்லது ‘ஆனால்’ என்று சேர்ப்பது தேவையற்ற வலியுறுத்தலை உண்டாக்கும்.
- source_word: ἔφη αὐτῷ
  choice: அவர் அவனிடம் ... என்று கூறினார்
  rationale: φημί நேரடியான கூற்றை அறிமுகப்படுத்துகிறது. ‘பதிலளித்தார்’ என்று மொழிபெயர்த்தால் மூல வினையில் வெளிப்படையாக இல்லாத நுணுக்கம் சேரும்.
- source_word: Ἀγαπήσεις
  choice: அன்புகூர வேண்டும்
  rationale: எதிர்காலச் சுட்டுவினை இங்கு உபாகம மேற்கோளில் கட்டளையின் வலிமையுடன் வருகிறது. நவீன தமிழில் ‘வேண்டும்’ என்பது அந்தக் கட்டாயத்தைக் கண்ணியமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: κύριον τὸν θεόν σου
  choice: உன் கடவுளாகிய ஆண்டவர்
  rationale: κύριος என்பதற்கு ‘ஆண்டவர்’ என்றும் θεός என்பதற்கு ‘கடவுள்’ என்றும் வழங்கி, இரண்டும் ஒரே நபரைக் குறிக்கும் கிரேக்க அமைப்பை ‘கடவுளாகிய ஆண்டவர்’ எனத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἐν ὅλῃ τῇ καρδίᾳ σου
  choice: உன் முழு இதயத்தோடும்
  rationale: ἐν என்பதன் அடிப்படைப் பொருள் ‘இல்’ என்றாலும், இந்த அர்ப்பணிப்பு மொழிநடையில் தமிழ் உடனிகழ்ச்சி வேற்றுமையான ‘-ஓடும்’ இயல்பாகச் சாதனம் மற்றும் முழுமையான ஈடுபாட்டை வெளிப்படுத்துகிறது.
- source_word: ψυχῇ
  choice: உயிர்
  rationale: ψυχή இங்கு முழு உயிருள்ள தன்மையையோ தன்னையோ குறிக்கலாம். ‘உயிர்’ என்பது நவீன தமிழில் இயல்பானதும், தனியே பிரிந்த ஒரு கூறு என்ற பிற்காலக் கருத்தை கட்டாயப்படுத்தாததும் ஆகும்; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: διανοίᾳ
  choice: மனம்
  rationale: διάνοια சிந்திக்கும் அல்லது புரிந்துகொள்ளும் ஆற்றலைக் குறிக்கிறது. ‘மனம்’ இயல்பான சுருக்கமான தமிழ்; ‘புரிந்துணர்வு’ என்ற மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: உபாகம மேற்கோளில் உள்ள இதயம்—உயிர்—மனம் என்ற மும்மை
  choice: மூன்று சொற்களையும் தனித்தனியாகப் பாதுகாத்தல்
  alternative: அவற்றை ‘உன் முழு உள்ளத்தோடு’ என்ற ஒரே பொதுப்பதமாகச் சுருக்குதல்
  rationale: கிரேக்க உரை καρδία, ψυχή, διάνοια ஆகியவற்றைத் தனித்தனியாகக் குறிப்பிடுகிறது. அவை மனித இயல்பின் முற்றிலும் பிரிக்கப்பட்ட மூன்று தத்துவக் கூறுகள் என்று விளக்காமலும், வேறுபாடுகளை அழிக்காமலும் மொழிபெயர்க்கப்படுகிறது.
- issue: Ἀγαπήσεις என்பதிலுள்ள கட்டளை வலிமை
  choice: ‘அன்புகூர வேண்டும்’
  alternative: எளிய எதிர்காலமாக ‘அன்புகூருவாய்’
  rationale: இது வடிவில் எதிர்கால வினையாக இருந்தாலும், மேற்கோளில் கட்டளையாகச் செயல்படுகிறது. ‘வேண்டும்’ அந்த வலிமையைத் தெளிவாக்குகிறது; மனிதரால் அன்பைப் பெறும் விதம் குறித்த கூடுதல் இறையியல் விளக்கம் சேர்க்கப்படவில்லை.
- issue: ἐν என்ற முன்னிடைச்சொல்லின் மொழிபெயர்ப்பு
  choice: தமிழின் ‘-ஓடும்’ அமைப்பு
  alternative: ‘உன் முழு இதயத்தில் ... உயிரில் ... மனதில்’
  rationale: ‘-ஓடும்’ என்பது தமிழில் முழு ஆற்றலுடனும் ஈடுபாட்டுடனும் அன்புகூரும் கருத்தை இயல்பாகத் தருகிறது. ‘-இல்’ என்பது இடப்பொருளாகத் தவறாகப் புரியக்கூடும்; இருப்பினும் மூலத்தின் அடிப்படை வடிவம் குறித்த தனி அடிக்குறிப்பு அவசியமில்லை, ஏனெனில் தமிழ் வேற்றுமை அமைப்பு இங்கு நேரடியான சொல்-சொல் ஒப்புமையை அனுமதிப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையைக் கையாளுகிறது. ‘அன்புகூர்’, ‘ஆண்டவர்’ ஆகியவை வேதாகம மேற்கோளுக்கேற்ற உயர்ந்த ஆனால் வழக்கிலிருந்து விலகாத சொற்கள். மூலத்தில் இல்லாத விளக்கங்களைச் சேர்க்காமல், தமிழ் வாக்கிய ஓட்டத்திற்காக நேரடி உரையைச் சுற்றி ‘என்று கூறினார்’ அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
