id: MAT.22.4
reference: Matthew 22:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πάλιν ἀπέστειλεν ἄλλους δούλους λέγων· Εἴπατε τοῖς κεκλημένοις· Ἰδοὺ τὸ ἄριστόν μου ⸀ἡτοίμακα, οἱ ταῦροί μου καὶ τὰ σιτιστὰ τεθυμένα, καὶ πάντα ἕτοιμα· δεῦτε εἰς τοὺς γάμους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/004.yaml
  text: Again he sent other servants[a], saying, ‘Tell those who have been invited, “Look, I have prepared my dinner; my oxen and my fattened cattle have been slaughtered, and everything is ready[c][b]. Come to the wedding feast.”’
translation:
  language: ta
  text: அவர் மறுபடியும் வேறு அடிமைகளை[a] அனுப்பி, அவர்களிடம், ‘ஏற்கெனவே அழைக்கப்பட்டவர்களிடம், “இதோ, என் விருந்தை ஆயத்தப்படுத்திவிட்டேன்; என் காளைகளும் கொழுத்த கால்நடைகளும் வெட்டப்பட்டுவிட்டன; எல்லாம் ஆயத்தமாக இருக்கிறது. திருமண விருந்துக்கு வாருங்கள்[b]” என்று சொல்லுங்கள்’ என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வேறு வேலைக்காரர்களை.” கிரேக்கச் சொல் சூழலுக்கு ஏற்ப “அடிமைகள்” அல்லது “வேலைக்காரர்கள்” என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “திருமணத்துக்கு வாருங்கள்.” கிரேக்கப் பன்மை திருமணக் கொண்டாட்டங்கள் முழுவதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: மறுபடியும்
  rationale: முன்பு நடந்த அனுப்புதலைத் தொடர்ந்து அதே செயல் மீண்டும் நிகழ்வதை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: ἀπέστειλεν
  choice: அனுப்பி
  rationale: λέγων உடன் இணைந்த கிரேக்க வாக்கிய அமைப்பை தமிழில் இயல்பாக ‘அனுப்பி ... என்றார்’ என வழங்குகிறது.
- source_word: ἄλλους δούλους
  choice: வேறு அடிமைகளை
  rationale: அரசரின் வீட்டுச் சூழலில் δοῦλος என்பதன் கட்டுப்பட்ட சமூக நிலையைக் ‘அடிமைகள்’ நேரடியாகக் காட்டுகிறது; ‘வேலைக்காரர்கள்’ என்ற மாற்றும் சாத்தியம் என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: Εἴπατε τοῖς κεκλημένοις
  choice: அழைக்கப்பட்டவர்களிடம் ... சொல்லுங்கள்
  rationale: κεκλημένοις என்னும் perfect passive வடிவம் ஏற்கெனவே அழைப்பு பெற்றவர்களைக் குறிக்கிறது; தமிழ் இறந்தகாலப் பெயரெச்சம் அதைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் உரையாடல் குறியீட்டை dignified, வழக்கமான தமிழில் வழங்குகிறது.
- source_word: τὸ ἄριστόν μου
  choice: என் விருந்தை
  rationale: திருமணச் சூழலில் ஆயத்தமான சிறப்பு உணவை ‘விருந்து’ இயல்பாகக் குறிக்கிறது; குறிப்பிட்ட நாள்நேர உணவு என்று தேவையின்றி வரையறுக்கவில்லை.
- source_word: ἡτοίμακα
  choice: ஆயத்தப்படுத்திவிட்டேன்
  rationale: ஆயத்தம் நிறைவடைந்து அதன் விளைவு இப்போது நிலவுகிறது என்ற perfect காலத்தின் நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: οἱ ταῦροί μου
  choice: என் எருதுகள்
  rationale: ταῦροι என்பதற்கு சூழலுக்கு ஏற்ற நேரடியான கால்நடைச் சொல்.
- source_word: τὰ σιτιστὰ
  choice: கொழுத்த கால்நடைகள்
  rationale: சிறப்பாகத் தீனியிட்டு கொழுக்கவைக்கப்பட்ட விலங்குகளைக் குறிக்கிறது; மூலத்தில் இல்லாத ‘கன்றுகள்’ என்ற வயது வகையைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: τεθυμένα
  choice: வெட்டப்பட்டுவிட்டன
  rationale: விருந்துக்காக விலங்குகள் கொல்லப்பட்டதைக் குறிக்கிறது; வழிபாட்டுப் பலி என்ற தேவையற்ற பொருளைத் தவிர்க்கிறது.
- source_word: καὶ πάντα ἕτοιμα
  choice: எல்லாம் ஆயத்தமாக இருக்கிறது
  rationale: ஆயத்தம் முழுமையாக நிறைவடைந்துள்ளது என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: δεῦτε εἰς τοὺς γάμους
  choice: திருமண விருந்துக்கு வாருங்கள்
  rationale: γάμοι என்ற பன்மை திருமணக் கொண்டாட்டங்களை மொத்தமாகக் குறிக்கக்கூடும்; இச்சூழலில் உணவுக்கு வருமாறு அழைப்பதால் ‘திருமண விருந்து’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
theological_decisions:
- issue: அரச வீட்டுச் சூழலில் δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: அடிமைகள்
  alternative: வேலைக்காரர்கள் / பணியாளர்கள்
  rationale: இவர்கள் வெறும் கூலிப் பணியாளர்கள் என்பதைக் காட்டிலும் அரசரின் அதிகாரத்திற்குட்பட்ட வீட்டாராகச் சித்தரிக்கப்படுகின்றனர். ‘அடிமைகள்’ அக்கால சமூக நிலையைக் காத்தாலும், சூழல்சார் மாற்றுப் பொருள் அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
- issue: γάμοι என்ற பன்மையின் பரப்பு
  choice: திருமண விருந்து
  alternative: திருமணம் / திருமணக் கொண்டாட்டங்கள்
  rationale: விலங்குகள் வெட்டப்பட்டு உணவு ஆயத்தமாக இருப்பது உடனடி சூழல் என்பதால் விருந்து முன்னிலைப்படுத்தப்படுகிறது; எனினும் கிரேக்கப் பன்மை முழுத் திருமணக் கொண்டாட்டத்தையும் குறிக்கலாம் என்பதைக் அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் கண்ணியமான உவமைக் கதை நடையைப் பயன்படுத்துகிறது. ‘ஆயத்தம்’ திருமணச் சூழலில் இயல்பாக இருப்பதால் தக்கவைக்கப்பட்டுள்ளது; மிகப் பழமையான வாக்கிய அமைப்புகள் தவிர்க்கப்பட்டுள்ளன.
