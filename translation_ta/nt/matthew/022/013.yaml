id: MAT.22.13
reference: Matthew 22:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τότε ⸂ὁ βασιλεὺς εἶπεν⸃ τοῖς διακόνοις· Δήσαντες αὐτοῦ πόδας καὶ χεῖρας ⸂ἐκβάλετε αὐτὸν⸃ εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/013.yaml
  text: Then the king said to the attendants[a], ‘Bind his feet and hands and throw him out into the outer darkness. In that place there will be weeping and gnashing of teeth.’
translation:
  language: ta
  text: அப்போது அரசன் பணிவிடையாளர்களிடம்[a], “அவனுடைய கால்களையும் கைகளையும் கட்டி, அவனை வெளிய்ப்புற இருளுக்குள் எறிந்துவிடுங்கள். அங்கே அழுகையும் பற்கடிப்பும் இருக்கும்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பணியாளர்களிடம்.”
    reason: διάκονος என்பதற்கு இச்சூழலில் ‘பணிவிடையாளர்’ அல்லது ‘பணியாளர்’ என்ற இரு இயல்பான மொழிபெயர்ப்புகளும் சாத்தியம்.
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: கதையின் அடுத்த நிகழ்வை இயல்பாக அறிமுகப்படுத்தும் கால அடைமொழி.
- source_word: ὁ βασιλεὺς
  choice: அரசன்
  rationale: உவமையின் அரசாட்சிப் படிமத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: τοῖς διακόνοις
  choice: பணிவிடையாளர்களிடம்
  rationale: விருந்து நிகழ்வில் அரசனுக்குப் பணிபுரிபவர்களைக் குறிக்கிறது; திருச்சபைப் பதவியைக் குறிக்கும் பொருளைத் தேவையின்றி புகுத்துவதில்லை.
- source_word: Δήσαντες
  choice: கட்டி
  rationale: முதன்மைக் கட்டளைக்கு முன் நிகழும் செயலைத் தமிழில் இயல்பான வினையெச்சமாகக் கொடுக்கிறது; கட்டுப்படுத்தி பிணைக்கும் வலிமையையும் தக்கவைக்கிறது.
- source_word: αὐτοῦ πόδας καὶ χεῖρας
  choice: இவனுடைய கால்களையும் கைகளையும்
  rationale: கிரேக்க மூலத்தின் ‘கால்கள், கைகள்’ என்ற வரிசையைப் பாதுகாக்கிறது; நேரில் சுட்டப்படும் நபருக்கு ‘இவன்’ இயல்பாக உள்ளது.
- source_word: ἐκβάλετε αὐτὸν
  choice: இவனை … எறிந்துவிடுங்கள்
  rationale: வலுக்கட்டாயமாக வெளியேற்றும் செயலைத் தெளிவாகவும் வலிமையாகவும் தெரிவிக்கிறது.
- source_word: εἰς τὸ σκότος τὸ ἐξώτερον
  choice: வெளியே உள்ள இருளுக்குள்
  rationale: விருந்திடத்திற்கு வெளியே இருப்பதையும் இருளையும் தெளிவாகப் பாதுகாக்கும் இயல்பான நவீனத் தமிழ்; உருவகத்தை விளக்கமாக மாற்றுவதில்லை.
- source_word: ἐκεῖ ἔσται
  choice: அங்கே … இருக்கும்
  rationale: இடத்தையும் எதிர்கால நிகழ்வையும் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ὁ κλαυθμὸς
  choice: அழுகை
  rationale: துயரத்துடன் அழுதலை மிகைப்படுத்தாமல் நேரடியாகக் குறிக்கிறது.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: பற்கடிப்பு
  rationale: பற்களைக் கடிக்கும் வேதனை அல்லது சீற்றப் படிமத்தை அதன் தெளிவின்மையோடு தக்கவைக்கும் செறிவான தமிழ் சொல்.
theological_decisions:
- issue: உவமையில் இடம்பெறும் வெளியேற்றத்தின் இயல்பு
  choice: ‘வெளியே உள்ள இருள்’ என்ற தெளிவான உருவக மொழியை அப்படியே தக்கவைத்தல்
  alternative: இதை நேரடியாக நரகம் அல்லது இறுதித் தீர்ப்பு என்று விளக்குதல்; அல்லது விருந்திலிருந்து விலக்கப்படுதல் என்று மட்டும் மென்மைப்படுத்துதல்
  rationale: கிரேக்க வசனம் தீர்ப்பைக் குறிக்கும் வலுவான படிமத்தைப் பயன்படுத்துகிறது; ஆனால் அதன் கோட்பாட்டு பொருளை இவ்வசனத்திலேயே குறுக்கி வரையறுப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் உவமையின் கண்ணியமான, கடுமையான தொனியைத் தக்கவைக்கும் வகையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் ‘கால்கள், கைகள்’ என்ற சொல்வரிசை பாதுகாக்கப்பட்டுள்ளது.
