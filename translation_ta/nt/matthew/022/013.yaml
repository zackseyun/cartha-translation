  revision_rationale: The revision removes an unwarranted proximal nuance from the pronouns and uses a closer Tamil equivalent for ‘outer darkness.’ It otherwise retains the draft’s accurate Greek word order, forceful imperative, restrained judgment imagery, and natural modern register. The footnote wording is adjusted only for idiomatic Tamil punctuation and phrasing.
