source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν τοὺς δούλους αὐτοῦ καλέσαι τοὺς κεκλημένους εἰς τοὺς γάμους, καὶ οὐκ ἤθελον ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/003.yaml
  text: And he sent his servants to call those who had been invited to the wedding feast[c][b][a], and they were unwilling to come.
translation:
  language: ta
  text: திருமண விருந்துக்கு[c] ஏற்கெனவே அழைக்கப்பட்டிருந்தவர்களை[b] வருமாறு அழைப்பதற்காகத் தன் பணியாளர்களை[a] அவன் அனுப்பினான். ஆனால் அவர்கள் வர விரும்பவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அடிமைகளை.” கிரேக்கச் சொல் பணியாளர்களையோ அடிமைகளையோ குறிக்கலாம்; இங்கு அரசனின் சார்பில் செயல்படும் அவர்களுடைய பங்கு முன்னிலைப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “அழைக்கப்பட்டிருந்தவர்களை.” ‘அழைப்பதற்காக’ என்பதிலும் ‘அழைக்கப்பட்டிருந்தவர்கள்’ என்பதிலும் கிரேக்க மூலம் ஒரே வினைச்சொல் குடும்பத்தைப் பயன்படுத்துகிறது; இங்கு அவர்கள் முன்பே அழைக்கப்பட்டவர்கள் என்பது பொருள்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “திருமணக் கொண்டாட்டத்துக்கு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: அனுப்பினான்
  rationale: இறந்தகாலச் செயலை இயல்பாகவும் நேரடியாகவும் தெரிவிக்கிறது; கூடுதல் நுண்பொருளைச் சேர்க்கவில்லை.
- source_word: δούλους
  choice: பணியாளர்களை
  rationale: δοῦλος என்பதற்கு ‘அடிமை’ அல்லது ‘பணியாளர்’ என்று பொருள் வரலாம். இங்கு அவர்களுடைய கட்டுண்ட சமூக நிலையைவிட அரசனின் சார்பில் செயல்படும் பங்கே முன்னிலைப்படுவதால் ‘பணியாளர்கள்’ இயல்பானது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: καλέσαι
  choice: வருமாறு அழைப்பதற்காக
  rationale: அனுப்பியதன் நோக்கத்தைத் தெளிவாகக் காட்டுவதோடு, καλέω வினையின் ‘அழை’ என்ற அடிப்படைப் பொருளையும் காக்கிறது.
- source_word: κεκλημένους
  choice: ஏற்கெனவே அழைக்கப்பட்டிருந்தவர்களை
  rationale: நிறைவுற்ற செயப்பாட்டு வினையெச்சம், இவர்களுக்கு முன்பே அழைப்பு விடுக்கப்பட்டிருந்ததைச் சுட்டுகிறது. ‘ஏற்கெனவே’ என்பது அந்த முன்னைய அழைப்பை நவீன தமிழில் தெளிவாக்குகிறது.
- source_word: εἰς τοὺς γάμους
  choice: திருமண விருந்துக்கு
  rationale: இப்பன்மை வடிவம் இச்சூழலில் திருமணச் சடங்கை மட்டும் அல்லாமல் அதனுடன் தொடர்புடைய கொண்டாட்ட விருந்தைக் குறிக்கிறது.
- source_word: οὐκ ἤθελον ἐλθεῖν
  choice: அவர்கள் வர விரும்பவில்லை
  rationale: ἤθελον என்பது மனவிருப்பத்தைச் சுட்டுகிறது. ‘வர மறுத்தார்கள்’ என்பதைவிட இது மூலத்தின் வலிமையை மிகைப்படுத்தாமல் காக்கிறது.
theological_decisions:
- issue: உவமையில் δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: பணியாளர்கள்
  alternative: அடிமைகள்
  rationale: இங்கு செய்தியைக் கொண்டு செல்பவர்களாகிய அவர்களின் பணி முன்னிலைப்படுகிறது; அவர்களுடைய சட்ட அல்லது சமூக அடிமைநிலை அல்ல. எனினும் கிரேக்கச் சொல்லின் உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘அழை’ என்ற சொல் குடும்பத்தின் மறுபயன்பாடு மூலத்திலுள்ள lexical repetition-ஐ இயன்றவரை காக்கிறது. ‘வர விரும்பவில்லை’ என்பது அவர்களின் மனவிருப்பமின்மையைத் துல்லியமாகக் காட்டுகிறது.
