  terminology: “பணியாளர்கள்” is a suitable contextual rendering of δούλους in this parable, with “அடிமைகள்” responsibly retained as a lexical alternative. “ஏற்கெனவே அழைக்கப்பட்டிருந்தவர்கள்” clearly communicates the perfect passive participle, and “திருமண விருந்து” accurately conveys the celebratory sense of γάμοι.
