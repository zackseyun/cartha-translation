  source_fidelity: 'The Tamil accurately represents the Greek sequence and sense: he sent his servants for the purpose of calling people already invited to the wedding celebration, yet they were not willing to come. “வர விரும்பவில்லை” appropriately conveys οὐκ ἤθελον ἐλθεῖν without strengthening it to a refusal.'
