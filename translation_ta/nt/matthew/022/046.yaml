id: MAT.22.46
reference: Matthew 22:46
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς ἐδύνατο ⸂ἀποκριθῆναι αὐτῷ⸃ λόγον, οὐδὲ ἐτόλμησέν τις ἀπ’ ἐκείνης τῆς ἡμέρας ἐπερωτῆσαι αὐτὸν οὐκέτι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/046.yaml
  text: And no one was able to answer him a word[a], nor did anyone dare from that day on to question him any longer.
translation:
  language: ta
  text: ஒருவராலும் அவருக்கு ஒரு வார்த்தைகூடப் பதில் சொல்ல முடியவில்லை; அந்த நாள் முதல் அவரிடம் மேலும் கேள்வி கேட்க யாரும் துணியவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδεὶς ἐδύνατο
  choice: ஒருவராலும் ... முடியவில்லை
  rationale: முழுமையான மறுப்பையும் கடந்தகால இயலாமையையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἀποκριθῆναι αὐτῷ λόγον
  choice: அவருக்கு ஒரு வார்த்தைகூடப் பதில் சொல்ல
  rationale: λόγον என்பதைக் கைவிடாமல், கிரேக்க மரபுத்தொடரின் ‘ஒரு பதிலும் சொல்ல முடியவில்லை’ என்ற வலியுறுத்தலைத் தமிழில் ‘ஒரு வார்த்தைகூட’ என இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὐδὲ ἐτόλμησέν τις
  choice: யாரும் துணியவில்லை
  rationale: இரண்டாவது மறுப்புக் கூற்றையும் τολμάω-வின் ‘துணிதல்’ என்ற பொருளையும் தெளிவாகப் பேணுகிறது.
- source_word: ἀπ’ ἐκείνης τῆς ἡμέρας
  choice: அந்த நாள் முதல்
  rationale: அந்நாளைத் தொடக்கப் புள்ளியாகக் குறிக்கும் சொற்றொடரைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐπερωτῆσαι αὐτὸν
  choice: அவரிடம் ... கேள்வி கேட்க
  rationale: சூழலில் இயேசுவிடம் விவாத அல்லது சோதனை நோக்குடன் கேள்விகளை முன்வைப்பதைக் குறிக்கிறது; ‘விசாரிக்க’ என்பது தேவையற்ற கடுமையைச் சேர்க்கக்கூடும்.
- source_word: οὐκέτι
  choice: மேலும்
  rationale: அந்த நேரத்துக்குப் பிறகு கேள்வி கேட்பது தொடரவில்லை என்ற cessation பொருளை இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: இயேசுவின் பதிலுக்குப் பின் எதிர்த்தவர்களின் மௌனத்தின் கதைசார் வலிமை
  choice: அவர்களால் பதில் சொல்ல முடியாததையும் தொடர்ந்து கேள்வி கேட்க அவர்கள் துணியாததையும் மட்டும் வரலாற்றுக் கூற்றாக மொழிபெயர்த்தல்
  alternative: இயேசுவின் மேலான ஞானம் அல்லது அதிகாரத்தை மொழிபெயர்ப்பிலேயே வெளிப்படையாகச் சேர்த்தல்
  rationale: சூழல் இயேசுவின் விவாத வெற்றியை உணர்த்தினாலும், இந்த வசனம் நேரடியாகக் கூறுவது அவர்களின் இயலாமையும் துணிவின்மையும் மட்டுமே; ஆகவே கூடுதல் இறையியல் விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. ‘ஒரு வார்த்தைகூடப் பதில் சொல்ல’ என்பது மூலத்தின் வெளிப்படையான λόγον கூறையும் அதன் வலியுறுத்தலையும் தமிழ் மரபுக்கு ஏற்றவாறு பேணுகிறது.
