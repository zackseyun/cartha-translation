translation:
  language: ta
  text: அவ்வாறே இரண்டாமவனுக்கும் மூன்றாமவனுக்கும் நடந்தது; ஏழுபேருக்கும் அதுவே நடந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, நெருக்கமாக: “அவ்வாறே இரண்டாமவனுக்கும் மூன்றாமவனுக்கும், ஏழுபேர்வரையும்.”'
    reason: மூலத்தில் வினைச்சொல் விடுபட்டுள்ள சுருக்கமான அமைப்பையும், ἕως τῶν ἑπτά என்பதன் “ஏழுபேர்வரை/ஏழுபேர்வரையும்” என்ற தொடர்ச்சிப் பொருளையும் காட்டுகிறது.
lexical_decisions:
- source_word: ὁμοίως
  choice: அவ்வாறே / இப்படியே
  rationale: முந்தைய சகோதரனுக்கு நிகழ்ந்ததே அடுத்தவர்களுக்கும் நிகழ்ந்தது என்ற தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ὁ δεύτερος καὶ ὁ τρίτος
  choice: இரண்டாமவனுக்கும் மூன்றாமவனுக்கும்
  rationale: கிரேக்கத்தில் வரிசை எண்கள் பெயர்ச்சொற்களாகப் பயன்படுத்தப்பட்டுள்ளன. முந்தைய வசனத்திலிருந்து ‘சகோதரன்’ என்பது புரிவதால் அதை மூலவாக்கியத்தைவிட வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: ἕως τῶν ἑπτά
  choice: ஏழுபேருக்கும்
  rationale: இந்த நிகழ்வு ஏழு சகோதரர்கள் அனைவருக்கும் தொடர்ந்தது என்பதே சொற்றொடரின் பொருள். ‘ஏழுபேர்வரை’ என்ற நெருக்கமான வடிவத்தைவிட இத்தொடர்பு தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
