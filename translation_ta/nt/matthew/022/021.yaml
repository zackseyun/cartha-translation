id: MAT.22.21
reference: Matthew 22:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγουσιν ⸀αὐτῷ· Καίσαρος. τότε λέγει αὐτοῖς· Ἀπόδοτε οὖν τὰ Καίσαρος Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/021.yaml
  text: They said to him[a], “Caesar’s.” Then he said to them, “Therefore render to Caesar the things that are Caesar’s, and to God the things that are God’s.”
translation:
  language: ta
  text: அவர்கள் அவரிடம், “சீசருடையது” என்றார்கள். அப்போது அவர் அவர்களிடம், “ஆகவே, சீசருக்குரியவற்றைச் சீசருக்குக் கொடுங்கள்; கடவுளுக்குரியவற்றைக் கடவுளுக்குக் கொடுங்கள்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγουσιν / λέγει
  choice: என்றார்கள் / என்றார்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டிருந்தாலும், இயல்பான தமிழ் கதைநடைக்காக இறந்தகாலத்தில் மொழிபெயர்க்கப்பட்டது.
- source_word: Καίσαρος
  choice: சீசருடையது
  rationale: நாணயத்திலுள்ள உருவமும் எழுத்தும் யாருடையவை என்ற மறைமுகக் கேள்விக்கு விடையாக வரும் உடைமைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τότε
  choice: அப்போது
  rationale: உரையாடலில் அடுத்த நிகழ்வைச் சுட்டும் இயல்பான தமிழ் இணைப்பு.
- source_word: Ἀπόδοτε
  choice: செலுத்துங்கள்
  rationale: ஒருவருக்குரியதை அல்லது கொடுக்க வேண்டியதை அவருக்குக் கொடுத்தல் என்ற கருத்தைத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் தெரிவிக்கிறது; ‘திருப்பிக் கொடுங்கள்’ மற்றும் ‘கொடுங்கள்’ என்ற பொருள் வாய்ப்புகளையும் அடிக்குறிப்பு பதிவு செய்கிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: அவர்களுடைய முந்தைய பதிலிலிருந்து இயேசு கூறும் முடிவைத் தெளிவாகக் குறிக்கிறது.
- source_word: τὰ Καίσαρος / τὰ τοῦ θεοῦ
  choice: சீசருக்குரியவற்றை / கடவுளுக்குரியவற்றை
  rationale: இரு கூறுகளின் இணையான அமைப்பையும், எது யாருக்கு உரியது என்ற உடைமைப் பொருளையும் பாதுகாக்கிறது.
- source_word: θεοῦ / τῷ θεῷ
  choice: கடவுள் / கடவுளுக்கு
  rationale: யூத ஒரேகடவுள் சூழலில் θεός என்பதற்கான இயல்பான நவீனத் தமிழ் சொல்.
theological_decisions:
- issue: அரசாட்சி மற்றும் கடவுளுக்கான கடமைகள் குறித்த கட்டளையின் வரம்பு
  choice: சீசருக்குரியவற்றையும் கடவுளுக்குரியவற்றையும் செலுத்த வேண்டும் என்ற இணையான கட்டளையும் அதன் பதற்றமும் அப்படியே வைக்கப்பட்டுள்ளன.
  alternative: இதை வரி செலுத்துவதைப் பற்றிய கட்டளையாக மட்டும் குறுக்குவது, அல்லது அரசுக்கு எல்லையற்ற அதிகாரம் உண்டு என்ற விரிவான கொள்கையாக விளக்குவது.
  rationale: கிரேக்க உரை குடிமைக் கடமையின் எல்லையையோ கடவுளின் உரிமையின் முழு விளைவையோ விரிவாக வரையறுக்கவில்லை. ஆகவே பிற்கால அரசியல் அல்லது சமயக் கோட்பாட்டைச் சேர்க்காமல் உண்மையான திறந்த தன்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘சீசர்’ என்பது பதவிப் பெயராகத் தக்கவைக்கப்பட்டுள்ளது. இரு கூறுகளின் சொல்லமைப்பு இயன்றவரை இணையாக வைக்கப்பட்டு, எந்தக் கடமைக்கு எவ்வளவு எல்லை என்பதைக் மொழிபெயர்ப்பு தானாகத் தீர்மானிக்கவில்லை.
