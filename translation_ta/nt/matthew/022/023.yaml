id: MAT.22.23
reference: Matthew 22:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῃ τῇ ἡμέρᾳ προσῆλθον αὐτῷ Σαδδουκαῖοι, ⸀λέγοντες μὴ εἶναι ἀνάστασιν, καὶ ἐπηρώτησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/023.yaml
  text: On that day Sadducees came to him[a], saying there is no resurrection, and they questioned him.
translation:
  language: ta
  text: அந்த நாளில் சதுசேயர்கள் அவரிடம் வந்தார்கள்[a]. உயிர்த்தெழுதல் இல்லை என்று சொல்லும் அவர்கள், அவரிடம் கேள்வி கேட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் வெளிப்படையாக, “உயிர்த்தெழுதல் இல்லை என்று சொல்லும் சதுசேயர்கள் அவரிடம் வந்தார்கள்.”
    reason: λέγοντες என்ற பங்கேற்புவினை, அவர்கள் வந்தபோது சொன்னதை மட்டுமல்லாமல் சதுசேயர்களின் வழக்கமான நிலைப்பாட்டையும் அடையாளப்படுத்தக்கூடும்.
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: அந்த நாளில்
  rationale: இது இயல்பான நவீனத் தமிழ் காலக் குறிப்பு; கிரேக்கத்தின் சுட்டுப் பொருளை ‘அதே’ என்று வலுப்படுத்தாமல் காக்கிறது.
- source_word: προσῆλθον αὐτῷ
  choice: அவரிடம் வந்தார்கள்
  rationale: ‘அணுகினார்கள்’ என்பதும் சாத்தியம்; ஆனால் கதைநடையில் ‘அவரிடம் வந்தார்கள்’ இயல்பாகவும் மூலத்தின் பொருளுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: Σαδδουκαῖοι
  choice: சதுசேயர்கள்
  rationale: இந்த யூதக் குழுவின் பெயருக்கான தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: λέγοντες μὴ εἶναι ἀνάστασιν
  choice: உயிர்த்தெழுதல் இல்லை என்று சொல்லும் அவர்கள்
  rationale: நிகழ்காலப் பங்கேற்புவினை சதுசேயர்களின் நிலைப்பாட்டை விளக்குவதாக எடுத்துரைக்கப்படுகிறது; அந்தக் கூற்றை உரையாசிரியரின் ஒப்புதலாக மாற்றாமல் காக்கிறது.
- source_word: ἀνάστασιν
  choice: உயிர்த்தெழுதல்
  rationale: இச்சூழலில் ἀνάστασις குறிக்கும் மரித்தோரின் உயிர்த்தெழுதலைத் தெரிவிக்கும் நிலைபெற்ற, தெளிவான தமிழ்ச் சொல்.
- source_word: ἐπηρώτησαν αὐτόν
  choice: அவரிடம் கேள்வி கேட்டார்கள்
  rationale: வினைச்சொல்லின் ‘கேட்பது/வினவுவது’ என்ற பொருளை இயல்பான தமிழில் தருகிறது; மூலத்தில் இல்லாத பகைமை அல்லது விசாரணைத் தொனியைச் சேர்க்கவில்லை.
theological_decisions:
- issue: சதுசேயர்களின் உயிர்த்தெழுதல் மறுப்பை எடுத்துரைத்தல்
  choice: உயிர்த்தெழுதல் இல்லை என்று சொல்லும் அவர்கள்
  alternative: ‘உயிர்த்தெழுதல் இல்லை’ என்று சொல்லி
  rationale: இது அவர்களுக்குரிய நிலைப்பாட்டை அடையாளப்படுத்தும் வகையில் பங்கேற்புவினையை வாசிக்கிறது; உயிர்த்தெழுதலின் இயல்பு குறித்த பிற்கால விளக்கங்களைச் சேர்க்காமல், மூலத்தின் கூற்றை மட்டும் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அவர்’ என்ற மரியாதைப் பிரதிப்பெயர் சூழலில் இயேசுவைக் குறிக்கிறது; மூலத்தில் பெயர் மீண்டும் குறிப்பிடப்படாததால் தமிழிலும் சேர்க்கப்படவில்லை.
