  text: καὶ ὑμνήσαντες ἐξῆλθον εἰς τὸ Ὄρος τῶν Ἐλαιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/030.yaml
  text: And after singing a hymn[a], they went out to the Mount of Olives.
translation:
  language: ta
  text: அவர்கள் துதிப்பாடலைப் பாடிய பின்பு[a], ஒலிவ மலைக்குப் புறப்பட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “துதி பாடிய பின்பு.” கிரேக்க வினைச்சொல் பொதுவாகத் துதி பாடுவதைக் குறிக்கலாம்; எனினும், உடனடியான உணவுச் சூழலுக்கும் வழக்கமான பயன்பாட்டுக்கும் “துதிப்பாடலைப் பாடிய பின்பு” என்பது பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμνήσαντες
  choice: துதிப்பாடலைப் பாடிய பின்பு
  rationale: ὑμνέω என்பதன் இறந்தகாலச் செயவெச்சம்; பிரதான வினைக்கு முன் நிகழ்ந்த துதிப் பாடுதலைக் குறிக்கிறது. உணவுச் சூழலில் ‘துதிப்பாடலைப் பாடுதல்’ இயல்பாக இருந்தாலும், பொதுவாகத் துதி பாடுவதையும் குறிக்கலாம் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐξῆλθον
  choice: புறப்பட்டுச் சென்றார்கள்
  rationale: ἐξέρχομαι என்பது ‘வெளியே செல்லுதல்’ அல்லது ‘புறப்படுதல்’ என்று பொருள்படும். இச்சூழலில் ஓர் இடத்தை நோக்கிச் சென்றதை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: ஒலிவ மலையை நோக்கி
  rationale: நிறுவப்பட்ட புவியியல் இடப்பெயரைத் தமிழில் அடையாளம் காணத்தக்கவாறு வழங்குகிறது; εἰς குறிக்கும் இயக்கத்தின் இலக்கை ‘நோக்கி’ வெளிப்படுத்துகிறது.
- source_word: καὶ
  choice: வாக்கியங்களின் தொடர்ச்சியால் வெளிப்படுத்தப்பட்டது
  rationale: καὶ முந்தைய நிகழ்வுடன் எளிய தொடர்பை ஏற்படுத்துகிறது. தமிழில் ‘பின்பு’ மற்றும் வாக்கியத் தொடர்ச்சியே அந்த இணைப்பை இயல்பாகத் தெரிவிப்பதால் தனியாக ‘மேலும்’ சேர்க்கப்படவில்லை.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டது. கிரேக்கச் செயவெச்சத்தின் முன்னிகழ்வுத் தொடர்பு ‘பாடிய பின்பு’ என்று தெளிவாக்கப்பட்டுள்ளது; அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
