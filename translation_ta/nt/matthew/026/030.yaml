revisions:
- from: அவர்கள் துதிப்பாடலைப் பாடிய பின்பு[a], ஒலிவ மலையை நோக்கிப் புறப்பட்டுச் சென்றார்கள்.
  to: அவர்கள் துதிப்பாடலைப் பாடிய பின்பு[a], ஒலிவ மலைக்குப் புறப்பட்டார்கள்.
  rationale: The revision changes the directional expression to a destination construction matching εἰς and removes a minor verbal redundancy. The footnote is retained, with only a small stylistic adjustment («அல்லது») for natural Tamil. No theological or interpretive change is made.
