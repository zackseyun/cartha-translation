source:
  edition: SBLGNT
  text: καὶ ἀφεὶς αὐτοὺς ⸂πάλιν ἀπελθὼν⸃ προσηύξατο ἐκ τρίτου τὸν αὐτὸν λόγον εἰπὼν ⸀πάλιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/044.yaml
  text: And leaving them again[a], he went away and prayed a third time, saying the same thing again.
translation:
  language: ta
  text: அவர் அவர்களை விட்டுவிட்டு மீண்டும் விலகிச் சென்று, மூன்றாவது முறையாக அதே வார்த்தைகளை[a] மீண்டும் சொல்லி ஜெபித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதே காரியத்தை.” கிரேக்க மொழியில், “அதே வார்த்தையை/கூற்றை.”
    reason: λόγον என்பது ஒருமையில் இருந்து ‘வார்த்தை,’ ‘கூற்று,’ அல்லது சொல்லப்பட்ட காரியம் என்ற பொருளைக் கொள்ளக்கூடியதால், தமிழில் இயல்பாகத் தரப்பட்ட பன்மை மொழிபெயர்ப்புடன் மூலத்தின் வடிவமும் மாற்றுப் பொருளும் குறிப்பிடப்படுகின்றன.
lexical_decisions:
- source_word: ἀφεὶς αὐτοὺς
  choice: அவர் அவர்களை விட்டுவிட்டு
  rationale: சீடர்களை அங்கே விட்டுவிட்டு அவர்களிடமிருந்து புறப்பட்டார் என்ற பொருளை, வினையெச்சத் தொடரையும் நிகழ்வுகளின் வரிசையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: πάλιν ἀπελθὼν
  choice: மீண்டும் விலகிச் சென்று
  rationale: πάλιν குறிக்கும் மீள்நிகழ்வையும், ἀπέρχομαι குறிக்கும் அவர்களிடமிருந்து அகன்று செல்வதையும் தெளிவாகத் தருகிறது.
- source_word: προσηύξατο
  choice: ஜெபித்தார்
  rationale: மதிப்புடனும் பொதுவாகவும் புரியும் நவீனத் தமிழ் வழக்கில் ‘prayed’ என்பதற்கான நேரடியான சொல்.
- source_word: ἐκ τρίτου
  choice: மூன்றாவது முறையாக
  rationale: மூன்றாம் சந்தர்ப்பத்தில் நிகழ்ந்த செயலை இயல்பாகவும் துல்லியமாகவும் குறிக்கிறது.
- source_word: τὸν αὐτὸν λόγον
  choice: அதே வார்த்தைகளை
  rationale: λόγον இலக்கணத்தில் ஒருமையாக இருந்தாலும், இங்கு முன்பு சொல்லப்பட்ட ஜெபத்தின் உள்ளடக்கத்தை மீண்டும் கூறுவதைக் குறிக்கிறது; தமிழில் ‘அதே வார்த்தைகளை’ என்பது இயல்பாக உள்ளது. மூலத்தின் ஒருமைத் தன்மையை அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: εἰπὼν πάλιν
  choice: மீண்டும் சொல்லி
  rationale: மூலத்தில் உள்ள இரண்டாவது πάλιν-ஐ விடாமல், அதே ஜெப உள்ளடக்கம் மறுபடியும் கூறப்பட்டதைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ஜெபம் மீண்டும் செய்யப்பட்டது
  choice: மூன்றாவது முறையாக ஜெபித்ததையும் அதே வார்த்தைகளை மீண்டும் சொன்னதையும் இரண்டையும் வெளிப்படையாக மொழிபெயர்த்தல்
  alternative: நடையின் சுருக்கத்திற்காக இறுதியிலுள்ள ‘மீண்டும்’ என்பதை விடுதல்
  rationale: கிரேக்க உரையில் மீள்நிகழ்வைச் சுட்டும் πάλιν இருமுறை வருகிறது; அதன் மறுபடியும் கூறும் வலியுறுத்தலை மொழிபெயர்ப்பு காக்கிறது, அதற்கு மேலான கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதை ஒருமையுடன், எளிமையான ஆனால் கண்ணியமான வேதாகம நடையில் வடிவமைக்கப்பட்டது. ‘மீண்டும்’ இருமுறை வருவது தமிழில் ஓரளவு திரும்பச்சொல்லலாகத் தோன்றினாலும், மூல உரையின் வலியுறுத்தலைக் காக்க வேண்டுமென்றே வைத்துள்ளது.
