source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐσιώπα. ⸀καὶ ὁ ἀρχιερεὺς εἶπεν αὐτῷ· Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος ἵνα ἡμῖν εἴπῃς εἰ σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/063.yaml
  text: 'But Jesus kept silent[a]. And the high priest said to him, “I put you under oath by the living God: tell us if you are the Messiah[b], the Son of God.”'
translation:
  language: ta
  text: 'ஆனால் இயேசு தொடர்ந்து மௌனமாக இருந்தார். அப்போது தலைமைக் குரு அவரிடம், “உயிருள்ள கடவுளின் பேரில் உனக்கு ஆணையிடுகிறேன்[b]: நீ மெசியாவும்[a] கடவுளின் மகனுமா என்று எங்களுக்குச் சொல்” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்து.” கிரேக்கத்தில் Christos; இங்கு அது ஒரு பெயராக அல்ல, பட்டமாகப் பயன்படுத்தப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “உயிருள்ள கடவுளின் பேரில் உன்னைச் சத்தியத்திற்கு உட்படுத்துகிறேன்.” கிரேக்கச் சொற்றொடர் பதில் சொல்லும்படி வைக்கும் தீவிரமான ஆணைச் சூத்திரம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσιώπα
  choice: தொடர்ந்து மௌனமாக இருந்தார்
  rationale: இறந்தகாலத் தொடர்நிலை வடிவம் இயேசுவின் மௌனம் நீடித்ததைச் சுட்டுகிறது; அதனை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀρχιερεὺς
  choice: தலைமைக் குரு
  rationale: யூதர்களின் முதன்மை குருத்துவப் பதவியைக் குறிக்கும் தெளிவான, வழக்கிலுள்ள தமிழ் சொற்றொடர்.
- source_word: Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος
  choice: உயிருள்ள கடவுளின் பேரில் உன்னை ஆணையிட்டுக் கேட்கிறேன்
  rationale: இது பேயோட்டுதல் குறித்த சொல் அல்ல; கடவுளைச் சாட்சியாகக் கொண்டு பதில் கோரும் தீவிரமான ஆணைச் சூத்திரம். தமிழ் நீதிமன்ற/சத்தியச் சூழலில் புரியக்கூடிய வகையில் அதன் வலிமையைப் பாதுகாக்கிறது.
- source_word: ἵνα ἡμῖν εἴπῃς
  choice: எங்களுக்குச் சொல்
  rationale: ஆணையிட்டுக் கேட்பதன் உள்ளடக்கமாக வரும் கோரிக்கையைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὁ χριστός
  choice: மெசியா
  rationale: இங்கு இது பெயராக அல்ல, எதிர்பார்க்கப்பட்ட அபிஷேகம் பெற்றவரைக் குறிக்கும் பட்டமாக வருகிறது; எனவே பட்டத்தின் யூதப் பின்னணியைத் தெளிவாகக் காட்டும் ‘மெசியா’ பயன்படுத்தப்படுகிறது.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: கடவுளின் மகன்
  rationale: மூலத்தின் கிறிஸ்தியல் பட்டத்தை விரிவாக்காமலும் வலுவிழக்கச் செய்யாமலும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ὁ δὲ Ἰησοῦς
  choice: ஆனால் இயேசு
  rationale: முந்தைய குற்றச்சாட்டுகளுக்கும் இயேசுவின் மௌனத்திற்கும் இடையிலான மென்மையான முரண்பாட்டை δέ குறிக்கிறது.
theological_decisions:
- issue: நேரடியான கிறிஸ்தியல் விசாரணையில் Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: ὁ χριστός இங்கு பெயர் போல அல்லாமல் பட்டமாகச் செயல்படுகிறது. ‘மெசியா’ எதிர்பார்க்கப்பட்ட அபிஷேகம் பெற்றவரைக் குறிக்கும் சூழலைப் பாதுகாக்கிறது; பரவலான மாற்று வடிவமான ‘கிறிஸ்து’ அடிக்குறிப்பில் தரப்படுகிறது.
- issue: Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος என்ற சூத்திரத்தின் வலிமை
  choice: கடவுளைச் சாட்சியாகக் கொண்டு பதில் கோரும் தீவிரமான ஆணை
  alternative: சாதாரண கட்டளை
  rationale: இச்சொற்றொடர் உயிருள்ள கடவுளை முறையாக முன்னிறுத்துவதால் விசாரணைச் சூழலில் சத்தியப்பிரமாணத்துக்கு ஒத்த தீவிர வலிமை கொண்டது; அதனைச் சாதாரண கேள்வியாகச் சுருக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘தொடர்ந்து’ என்பது வினையின் நீடித்த தன்மையையும், ‘ஆணையிட்டுக் கேட்கிறேன்’ என்பது விசாரணையின் தீவிரத்தையும் வெளிப்படுத்துகிறது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களோடு நேரடியாக இணைக்கப்பட்டுள்ளன.
