id: MAT.26.31
reference: Matthew 26:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τότε λέγει αὐτοῖς ὁ Ἰησοῦς· Πάντες ὑμεῖς σκανδαλισθήσεσθε ἐν ἐμοὶ ἐν τῇ νυκτὶ ταύτῃ, γέγραπται γάρ· Πατάξω τὸν ποιμένα, καὶ ⸀διασκορπισθήσονται τὰ πρόβατα τῆς ποίμνης·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/031.yaml
  text: 'Then Jesus says to them[a], “You will all fall away because of me this night, for it is written: ‘I will strike the shepherd[c][b], and the sheep of the flock will be scattered.’”'
translation:
  language: ta
  text: 'அப்போது இயேசு அவர்களிடம் சொல்கிறார்: “இன்றிரவே[b] நீங்கள் எல்லாரும் என் காரணமாக என்னைவிட்டு விலகிப்போவீர்கள்[a]. ஏனெனில், ‘நான் மேய்ப்பனை அடிப்பேன்; மந்தையின் ஆடுகள் சிதறடிக்கப்படும்’ என்று எழுதப்பட்டிருக்கிறது[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இடறுவீர்கள்,” “இடறச் செய்யப்படுவீர்கள்,” அல்லது “மனவருத்தம் அடைவீர்கள்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் இத்தகைய பொருள் பரப்பைக் கொண்டது; இங்கு சீடர்கள் இயேசுவைக் கைவிட்டுச் செல்வதைச் சூழல் முன்னிலைப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: “இந்த இரவில்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: சகரியா 13:7-இலிருந்து மேற்கோள்.
    reason: cross_reference
lexical_decisions:
- source_word: Τότε
  choice: அப்போது
  rationale: கதை நிகழ்வுகளின் தொடர்ச்சியில் அடுத்த நிகழ்வை அறிமுகப்படுத்தும் இயல்பான நவீனத் தமிழ் காலச்சொல்.
- source_word: λέγει
  choice: சொல்கிறார்
  rationale: கிரேக்க மூலத்தின் வரலாற்று நிகழ்காலத்தைப் பாதுகாத்து, காட்சியின் உடனடித் தன்மையைத் தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: Πάντες ὑμεῖς
  choice: நீங்கள் எல்லாரும்
  rationale: ὑμεῖς மற்றும் Πάντες இணைப்பின் வலியுறுத்தலை வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: σκανδαλισθήσεσθε ἐν ἐμοὶ
  choice: என் காரணமாக என்னைவிட்டு விலகிப்போவீர்கள்
  rationale: சொல்லுக்கு இடறுதல், இடறச் செய்யப்படுதல், மனத்தடங்கல் அடைதல் போன்ற பொருள் பரப்பு உண்டு. ஆனால் உடனடிச் சூழலில் சீடர்கள் இயேசுவைக் கைவிட்டுச் செல்வதே குறிக்கப்படுவதால், உறவு சார்ந்த பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; இறுதியான விசுவாசத் துறப்பைத் தீர்மானமாகக் கூறவில்லை.
- source_word: ἐν τῇ νυκτὶ ταύτῃ
  choice: இன்றிரவே
  rationale: ‘இந்த இரவில்’ என்ற நேரடிப் பொருளை இயல்பான பேச்சு மற்றும் எழுத்துத் தமிழில் தருகிறது; ‘-வே’ அந்த இரவே நிகழும் என்ற வலியுறுத்தலைத் தக்கவைக்கிறது.
- source_word: γέγραπται γάρ
  choice: ஏனெனில் … என்று எழுதப்பட்டிருக்கிறது
  rationale: வேதமேற்கோளை அறிமுகப்படுத்தும் நிறைவு நிலையைக் குறிக்கும் கிரேக்க வினை வடிவத்தையும் காரண இணைப்பையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: Πατάξω τὸν ποιμένα
  choice: நான் மேய்ப்பனை அடிப்பேன்
  rationale: எழுவாயான முதல் நபரையும் எதிர்காலத்தையும் மேய்ப்பன் உருவகத்தையும் நேரடியாகப் பாதுகாக்கிறது; ‘கொன்றுவிடுவேன்’ போன்ற விளைவைச் சேர்க்கவில்லை.
- source_word: διασκορπισθήσονται τὰ πρόβατα τῆς ποίμνης
  choice: மந்தையின் ஆடுகள் சிதறடிக்கப்படும்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தையும் ‘ஆடுகள்’ மற்றும் ‘மந்தை’ ஆகிய இரு மூலச் சொற்களையும் பாதுகாக்கிறது.
theological_decisions:
- issue: σκανδαλισθήσεσθε என்பதன் இயேசுவுடனான உறவுசார் பொருள்
  choice: அந்த இரவில் நிகழப்போகிறவற்றால் சீடர்கள் இயேசுவைக் கைவிட்டு விலகிச் செல்வார்கள்
  alternative: அவர்கள் இயேசுவால் வெறுமனே மனவருத்தம் அடைவார்கள் அல்லது பொதுவான ஒழுக்கத் தடுமாற்றத்திற்கு உள்ளாவார்கள்
  rationale: தொடர்ந்து வரும் மேய்ப்பன்–ஆடுகள் மேற்கோளும் சீடர்களின் சிதறிப்போதலும், இங்கு கைவிட்டுச் செல்வதையே முன்னிலைப்படுத்துகின்றன. அதேவேளை இதை மீளமுடியாத இறுதி விசுவாசத் துறப்பாக மொழிபெயர்த்து இறையியல் முடிவைத் திணிக்கவில்லை.
- issue: λέγει என்ற வரலாற்று நிகழ்காலம்
  choice: சொல்கிறார்
  alternative: சொன்னார்
  rationale: இது கோட்பாட்டுத் தீர்மானம் அல்ல; கிரேக்கக் கதையாடலின் நிகழ்கால வடிவத்தையும் உயிரோட்டத்தையும் இயன்றவரைத் தக்கவைக்கும் மொழிபெயர்ப்புத் தீர்மானம்.
- issue: மேய்ப்பனை அடிப்பவர் யார் என்பதன் வெளிப்படைத்தன்மை
  choice: மூலத்தில் உள்ள முதல் நபர் ‘நான்’ அப்படியே வைக்கப்பட்டுள்ளது
  alternative: கடவுள் மேய்ப்பனை அடிப்பார் என்று விளக்கிப் பெயரிடுதல்
  rationale: மேற்கோளில் பேசுபவர் குறித்த அடையாளத்தை மொழிபெயர்ப்புக்குள் விளக்கமாகச் சேர்க்காமல், மூலத்தின் வடிவத்தையும் அதன் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதமேற்கோளுக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘சொல்கிறார்’ என்பது மூலத்தின் வரலாற்று நிகழ்காலத்தைத் தக்கவைக்கிறது. ‘என்னைவிட்டு விலகிப்போவீர்கள்’ சூழலுக்கேற்ற இயல்பான தமிழ்; சொல்லின் பரந்த சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
