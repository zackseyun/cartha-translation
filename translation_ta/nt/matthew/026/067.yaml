  text: τότε ἐνέπτυσαν εἰς τὸ πρόσωπον αὐτοῦ καὶ ἐκολάφισαν αὐτόν, οἱ δὲ ἐράπισαν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/067.yaml
  text: Then they spat in his face and struck him with their fists[c][b][a], and others slapped him.
translation:
  language: ta
  text: அப்போது அவர்கள் அவருடைய முகத்தில் துப்பினார்கள்; அவரை முஷ்டிகளால் அடித்தார்கள்; மற்றவர்களோ அவரை அறைந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: அடுத்த நிகழ்வைச் சுட்டும் கால வினையடை; கதை ஓட்டத்தை இயல்பாகப் பேணுகிறது.
- source_word: ἐνέπτυσαν εἰς τὸ πρόσωπον αὐτοῦ
  choice: அவருடைய முகத்தில் துப்பி
  rationale: εἰς τὸ πρόσωπον என்பது முகத்தை நோக்கி நேரடியாகத் துப்பிய அவமதிப்புச் செயலைக் குறிக்கும் மரபுத்தொடர்; நவீனத் தமிழில் ‘முகத்தில் துப்பி’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἐκολάφισαν αὐτόν
  choice: அவரைக் கைகளால் குத்தினார்கள்
  rationale: κολαφίζω பொதுவாக முஷ்டியால் அடிப்பதைக் குறிக்கிறது. ‘கைகளால் குத்தினார்கள்’ என்பது அடியின் தன்மையைத் தெளிவாக வெளிப்படுத்துகிறது; பொதுவான ‘அடித்தார்கள்’ என்பதைக் காட்டிலும் மூலச்சொல்லுக்கு நெருக்கமானது.
- source_word: οἱ δὲ ἐράπισαν
  choice: மற்றவர்களோ அவரை அறைந்தார்கள்
  rationale: οἱ என்பது இங்கு பெயர்ச்சொல் போல ‘மற்றவர்கள்’ என்று பொருள்படுகிறது; ῥαπίζω திறந்த கையால் அறைவதை வழக்கமாகக் குறிக்கிறது. சூழலிலிருந்து மறைந்திருக்கும் செயப்படுபொருளான ‘அவரை’ தமிழில் வெளிப்படையாகச் சேர்ப்பது இயல்பானது.
- source_word: δέ
  choice: மற்றவர்களோ
  rationale: δέ இங்கு வலுவான எதிர்மறையை அல்ல, வேறு சிலரின் செயலை வேறுபடுத்திக் காட்டுகிறது; ‘-ஓ’ அந்த மெல்லிய வேறுபாட்டை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: ஆலோசனைச் சங்கத்தின் முன் இயேசுவுக்கு இழைக்கப்பட்ட அவமதிப்பும் உடல் வன்முறையும்
  choice: துப்புதல், கைகளால் குத்துதல், அறைதல் ஆகிய செயல்களைத் தெளிவாகவும் நேரடியாகவும் மொழிபெயர்த்தல்
  alternative: ‘துன்புறுத்தினார்கள்’ அல்லது ‘அடித்தார்கள்’ போன்ற பொதுவான சொற்களால் கூறுதல்
  rationale: மூலவசனம் அவமதிப்பையும் வன்முறையையும் தனித்தனியான செயல்களாகக் குறிப்பதால் அவற்றை மென்மைப்படுத்தாமல் வெளிப்படுத்துவது கதைசார் வலிமையைப் பேணுகிறது; கூடுதல் இறையியல் விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையான, கண்ணியமான கதைநடை. ‘அறைந்தார்கள்’ என்பது திறந்த கையால் அடித்தலை இயல்பாகக் குறிக்கிறது. இந்த வரைவில் அடிக்குறிப்புகள் தேவையில்லை; மூலத்தின் முக்கிய சொற்பொருள் வேறுபாடுகள் உரையிலேயே தெளிவாக உள்ளன.
