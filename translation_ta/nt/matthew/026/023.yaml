id: MAT.26.23
reference: Matthew 26:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ὁ ἐμβάψας μετ’ ἐμοῦ ⸂τὴν χεῖρα ἐν τῷ τρυβλίῳ⸃ οὗτός με παραδώσει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/023.yaml
  text: He answered[b][a], “The one who dipped his hand with me in the bowl—this one will betray me.”
translation:
  language: ta
  text: 'அவர் பதிலளித்தார்: “என்னோடு சேர்ந்து கிண்ணத்தில்[a] கையைத் தோய்த்தவன்—அவன்தான் என்னைக் காட்டிக்கொடுப்பான்[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாத்திரத்தில்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஒப்படைப்பான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: அவர் பதிலளித்தார்
  rationale: பங்கேற்புவினையும் முதன்மை வினையும் இணையும் இந்தக் கிரேக்க மரபுத்தொடர் இயல்பாக ‘பதிலளித்தார்’ என்ற ஒரே வினையால் தமிழில் தெரிவிக்கப்படுகிறது.
- source_word: ἐμβάψας
  choice: தோய்த்தவன்
  rationale: உணவுப் பாத்திரத்தில் கையை வைத்துத் தோய்த்ததாகிய முடிவுற்ற அடையாளச் செயலை இறந்தகாலப் பெயரெச்ச வடிவில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: μετ’ ἐμοῦ
  choice: என்னோடு சேர்ந்து
  rationale: உடனிணைவைத் தெளிவாகவும் இயல்பான நவீன தமிழிலும் காட்டுகிறது.
- source_word: τὴν χεῖρα
  choice: கையை
  rationale: உடல் உறுப்புக்கு உரியவர் சூழலால் தெளிவாக இருப்பதால் தமிழில் தனியே உடைமைச் சுட்டுப்பெயர் சேர்க்கத் தேவையில்லை.
- source_word: ἐν τῷ τρυβλίῳ
  choice: கிண்ணத்தில்
  rationale: τρύβλιον என்பது உணவுக்குப் பயன்படுத்தப்படும் கிண்ணம் அல்லது பாத்திரம்; ‘கிண்ணம்’ தெளிவான நவீனத் தமிழ் சொல். ‘பாத்திரம்’ என்ற மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: οὗτός
  choice: அவன்தான்
  rationale: கிரேக்கச் சுட்டுப்பெயரின் வலியுறுத்தலைத் தமிழின் ‘தான்’ விகுதி இயல்பாகப் பாதுகாக்கிறது.
- source_word: παραδώσει
  choice: காட்டிக்கொடுப்பான்
  rationale: இச்சூழலில் துரோகமாக ஒப்படைப்பதைத் தெரிவிக்கும் இயல்பான தமிழ் சொல்; அடிப்படையான ‘ஒப்படைப்பான்’ என்ற பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: யூதாஸ் தொடர்பான சூழலில் παραδίδωμι என்பதன் மொழிபெயர்ப்பு
  choice: காட்டிக்கொடுப்பான்
  alternative: ஒப்படைப்பான்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘ஒப்படைத்தல்’ என்றாலும், இங்கு உறவுத் துரோகத்துடன் இயேசுவை எதிரிகளிடம் ஒப்படைக்கும் செயல் குறிக்கப்படுகிறது. ‘காட்டிக்கொடுப்பான்’ அந்தச் சூழற்பொருளை வெளிப்படுத்துகிறது; பொதுவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நேரடி உரை. ‘அவன்தான்’ என்பதால் மூலத்தின் வலியுறுத்தல் காக்கப்படுகிறது; நீண்ட கோடு அடையாளச் செயலும் முடிவும் இடையிலான அழுத்தத்தை இயல்பாக வெளிப்படுத்துகிறது.
