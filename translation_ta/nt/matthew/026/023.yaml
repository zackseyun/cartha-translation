  source_fidelity: மூலத்தின் ἀποκριθεὶς εἶπεν என்பதற்கு ‘அவர் பதிலளித்தார்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது. ἐμβάψας, μετ’ ἐμοῦ, τὴν χεῖρα ἐν τῷ τρυβλίῳ, மற்றும் வலியுறுத்தலான οὗτός ஆகியவை ‘என்னோடு சேர்ந்து கிண்ணத்தில் கையைத் தோய்த்தவன்—அவன்தான்’ என்பதில் பொருளோடும் அழுத்தத்தோடும் காக்கப்பட்டுள்ளன. παραδώσει-க்கு ‘காட்டிக்கொடுப்பான்’ என்பது இச்சூழலின் துரோகத் தன்மையைச் சரியாகத் தெரிவிக்கிறது; அடிப்படைச் சொற்பொருளான ‘ஒப்படைப்பான்’ அடிக்குறிப்பில் உள்ளது.
  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘கையைத் தோய்த்தவன்’ உணவுப் பாத்திரத்தில் சேர்ந்து உண்பதைக் குறிக்கும் சூழலுக்கு இயல்பானது. நீண்ட கோடு, அடையாளப்படுத்தும் செயலிலிருந்து அதன் விளைவுக்கான வலியுறுத்தலை வாசிப்பில் நன்றாகக் காட்டுகிறது.
  terminology: ‘கிண்ணம்’ τρυβλίον-க்கு ஏற்ற தெளிவான பொதுச்சொல்; ‘பாத்திரம்’ மாற்றுச் சொல் என அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது. ‘காட்டிக்கொடுப்பான்’ Judas-சூழலில் ‘betray’ என்பதற்கான பொருத்தமான தமிழ் வெளிப்பாடு; எந்தக் குறிப்பிட்ட கோட்பாட்டு விளக்கத்தையும் சேர்ப்பதில்லை.
