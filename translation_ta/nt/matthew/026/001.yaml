  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς πάντας τοὺς λόγους τούτους, εἶπεν τοῖς μαθηταῖς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/001.yaml
  text: And when Jesus had finished all these words[a], he said to his disciples,
translation:
  language: ta
  text: 'இயேசு இந்த வார்த்தைகள் அனைத்தையும் பேசி முடித்தபோது[a], தம் சீடர்களிடம் கூறினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'மேலும் சொற்சொல்லாக: “இயேசு இந்த வார்த்தைகள் அனைத்தையும் முடித்தபோது நிகழ்ந்தது என்னவென்றால், அவர் தம் சீடர்களிடம் கூறினார்.”'
    reason: மூலத்திலுள்ள Καὶ ἐγένετο என்ற செமித்தியக் கதைத் தொடரின் முறையான வடிவத்தைச் சுட்டுகிறது; பிரதான உரை இயல்பான தமிழுக்காக அதைச் சுருக்குகிறது.
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: …முடித்தபோது
  rationale: செமித்தியச் சாயலுள்ள மத்தேயுவின் கதைத் தொடரை நவீனத் தமிழில் இயல்பான காலத் துணைவாக்கியமாக வழங்குகிறது. ‘அப்போது நிகழ்ந்தது’ என்று சொற்சொல்லாக மொழிபெயர்ப்பது தமிழில் செயற்கையாக இருக்கும்.
- source_word: ἐτέλεσεν
  choice: பேசி முடித்த
  rationale: முந்தைய உரை நிறைவடைந்ததைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது; λόγους என்பதுடன் சேர்ந்து தமிழில் ‘பேசி முடித்த’ என்பது பொருத்தமான சொற்றொடர்.
- source_word: πάντας τοὺς λόγους τούτους
  choice: இந்த வார்த்தைகள் அனைத்தையும்
  rationale: πάντας என்பதன் முழுமையையும் λόγους என்பதன் நேரடியான பொருளையும் காக்கிறது; இது முந்தைய உரை முழுவதையும் சுட்டுகிறது.
- source_word: εἶπεν
  choice: கூறினார்
  rationale: கதைநடையில் இயல்பானதும் கண்ணியமானதும் ஆன மொழிபெயர்ப்பு; மூலத்தில் இல்லாத கூடுதல் நுணுக்கத்தைச் சேர்க்கவில்லை.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: தம் சீடர்களிடம்
  rationale: αὐτοῦ என்ற உடைமைச் சுட்டை ‘தம்’ தெளிவாகக் காக்கிறது; μαθηταί என்பதற்கு வழக்கமான ‘சீடர்கள்’ பயன்படுத்தப்பட்டுள்ளது.
