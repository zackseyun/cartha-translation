id: MAT.26.12
reference: Matthew 26:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: βαλοῦσα γὰρ αὕτη τὸ μύρον τοῦτο ἐπὶ τοῦ σώματός μου πρὸς τὸ ἐνταφιάσαι με ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/012.yaml
  text: For when she poured this perfume on my body[b][a], she did it to prepare me for burial.
translation:
  language: ta
  text: ஏனெனில், இந்தப் பெண் இந்த நறுமணத் தைலத்தை என் உடல்மேல் ஊற்றியபோது, என்னை அடக்கத்துக்கு ஆயத்தப்படுத்துவதற்காகவே அதைச் செய்தாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் அடக்கத்துக்காக” என்றும் மொழிபெயர்க்கலாம்; இங்குள்ள கிரேக்க வினைச்சொல், உடலை அடக்கத்துக்கு ஆயத்தப்படுத்தும் கருத்தையும் உள்ளடக்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: βαλοῦσα
  choice: ஊற்றியது
  rationale: βάλλω என்பதன் நேரடிப் பொருள் ‘எறிதல்’ என்றாலும், இங்கு நறுமணத் தைலத்தை உடல்மேல் இடுதல் அல்லது ஊற்றுதல் என்பதே சூழலுக்குப் பொருத்தமான பொருள். தமிழில் ‘ஊற்றியது’ இயல்பாக உள்ளது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: γάρ முந்தைய கூற்றுக்கான விளக்கத்தை அறிமுகப்படுத்துகிறது; ‘ஏனெனில்’ அதன் விளக்கக் காரணத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: αὕτη
  choice: இவள்
  rationale: சுட்டுப்பெயரின் அண்மை மற்றும் சுட்டும் வலிமையை ‘இவள்’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: μύρον
  choice: நறுமணத் தைலம்
  rationale: μύρον என்பது பூசுவதற்குப் பயன்படுத்தப்பட்ட மணமுள்ள எண்ணெய் அல்லது தைலத்தைக் குறிக்கிறது. ‘நறுமணத் தைலம்’ அதன் மணத்தையும் பயன்பாட்டையும் தெளிவாகக் காட்டுகிறது.
- source_word: ἐπὶ τοῦ σώματός μου
  choice: என் உடல்மேல்
  rationale: ἐπί உடலின் மேற்பரப்பில் தைலம் இடப்பட்டதைக் குறிக்கிறது; ‘என் உடல்மேல்’ இயல்பான நேரடி மொழிபெயர்ப்பு.
- source_word: πρὸς τὸ ἐνταφιάσαι με
  choice: என்னை அடக்கத்துக்கு ஆயத்தப்படுத்துவதற்காக
  rationale: πρός உடன் வரும் articular infinitive நோக்கத்தைக் காட்டுகிறது. ἐνταφιάζω வெறுமனே புதைப்பதை மட்டுமல்ல, உடலை அடக்கத்துக்கு ஆயத்தப்படுத்துவதையும் குறிக்கலாம்.
- source_word: ἐποίησεν
  choice: செய்தாள் என்பதன் கருத்து ‘...வதற்காகத்தான்’ என்ற அமைப்பில் வெளிப்படுத்தப்பட்டுள்ளது
  rationale: தமிழில் ‘ஊற்றியது ... ஆயத்தப்படுத்துவதற்காகத்தான்’ என்ற அமைப்பு ποιέω-வின் செயற்பொருளை தேவையற்ற மறுபடியுரையின்றி இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: இயேசுவின் மரணத்துடன் தொடர்புடைய ἐνταφιάζω என்பதன் பொருள்
  choice: அந்தப் பெண்ணின் செயல் இயேசுவை அடக்கத்துக்கு ஆயத்தப்படுத்தும் செயலாக விளக்கப்படுகிறது.
  alternative: அந்தச் செயல் பொதுவாக ‘என் அடக்கத்துக்காக’ செய்யப்பட்டது.
  rationale: ἐνταφιάζω அடக்கத்திற்கான உடல் ஆயத்தத்தை உள்ளடக்கக்கூடும். இம்மொழிபெயர்ப்பு இயேசு தமது வரவிருக்கும் அடக்கத்தை முன்னறிவிக்கும் கருத்தைப் பாதுகாக்கிறது; அதற்கு அப்பாற்பட்ட கோட்பாட்டுக் கருத்துகளைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘இவள்’ என்பது αὕτη-யின் சுட்டும் தன்மையைப் பாதுகாக்கிறது; ‘நறுமணத் தைலம்’ μύρον என்பதன் மணமுள்ள பூசும் எண்ணெய் என்ற கருத்தை சாதாரண வாசகருக்குத் தெளிவாக்குகிறது.
