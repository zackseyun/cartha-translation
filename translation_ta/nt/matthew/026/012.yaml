revisions:
- from: ஏனெனில், இவள் இந்த நறுமணத் தைலத்தை என் உடல்மேல் ஊற்றியது, என்னை அடக்கத்துக்கு ஆயத்தப்படுத்துவதற்காகத்தான்.[a]
  to: ஏனெனில், இந்தப் பெண் இந்த நறுமணத் தைலத்தை என் உடல்மேல் ஊற்றியபோது, என்னை அடக்கத்துக்கு ஆயத்தப்படுத்துவதற்காகவே அதைச் செய்தாள்.[a]
  rationale: The revision makes the Greek main verb explicit, renders the aorist participle naturally with a temporal clause, and preserves the purpose relation and burial-preparation nuance. The footnote remains accurately anchored and retains the legitimate more compact alternative.
