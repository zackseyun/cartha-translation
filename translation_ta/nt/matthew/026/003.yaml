  text: Τότε συνήχθησαν οἱ ⸀ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ εἰς τὴν αὐλὴν τοῦ ἀρχιερέως τοῦ λεγομένου Καϊάφα,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/003.yaml
  text: Then the chief priests and the elders of the people were gathered in the courtyard of the high priest[a], who was called Caiaphas[b],
translation:
  language: ta
  text: அப்போது தலைமைக் குருமார்களும் மக்களின் மூப்பர்களும் காய்பா என்று அழைக்கப்பட்ட தலைமைக் குருவின் முற்றத்தில்[b] ஒன்றுகூடினர்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கூடி வந்தனர்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் வடிவத்தில் செயப்பாட்டில் உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘முற்றம்’ என்பதற்கான கிரேக்கச் சொல் ஒரு பெரிய இல்லத்தின் முற்றப் பகுதியையும் குறிக்கக்கூடும்; எனவே ‘மாளிகை முற்றம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: அப்போது
  rationale: அடுத்த நிகழ்வை அறிமுகப்படுத்தும் காலச் சுட்டியாக இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: συνήχθησαν
  choice: ஒன்றுகூட்டப்பட்டனர்
  rationale: கிரேக்க வினைச்சொல்லின் இறந்தகாலச் செயலையும் செயல்பாட்டு வடிவத்திலுள்ள passive நுணுக்கத்தையும் முடிந்தவரை காக்கிறது; தமிழில் மரியாதைப் பன்மையுடனும் பொருந்துகிறது.
- source_word: ἀρχιερεῖς
  choice: தலைமைக் குருமார்கள்
  rationale: இங்கு ஒரே தலைமைக் குருவைப் பற்றாமல், முன்னணி குருத்துவ அதிகாரிகளைக் குறிக்கும் பன்மைச் சொல்லாக இருப்பதைத் தெளிவாக்குகிறது.
- source_word: πρεσβύτεροι τοῦ λαοῦ
  choice: மக்களின் மூப்பர்கள்
  rationale: கிரேக்க வேற்றுமைத் தொடர்பை நேரடியாகக் காத்து, மக்களிடையே அங்கீகரிக்கப்பட்ட மூத்த தலைவர்களைக் குறிக்கிறது.
- source_word: εἰς τὴν αὐλὴν
  choice: முற்றத்தில்
  rationale: கூடிவந்ததன் இறுதி இருப்பிடத்தை இயல்பான தமிழில் தெரிவிக்கிறது; αὐλή என்பதற்கான தெளிவான, ஊகமற்ற முதன்மைத் தேர்வு ‘முற்றம்’ ஆகும்.
- source_word: τοῦ ἀρχιερέως
  choice: தலைமைக் குருவின்
  rationale: சூழலில் ஒரே பதவி வகிப்பவரைக் குறிக்கும் ஒருமையைத் துல்லியமாகக் காட்டுகிறது.
- source_word: τοῦ λεγομένου Καϊάφα
  choice: காய்பா என்று அழைக்கப்பட்ட
  rationale: பெயரால் அடையாளப்படுத்தும் கிரேக்கப் பங்கேற்புச் சொற்றொடரை இயல்பான தமிழில் நெருக்கமாகக் காட்டுகிறது.
