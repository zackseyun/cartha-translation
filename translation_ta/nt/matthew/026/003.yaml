translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘தலைமைக் குருமார்கள்’ மற்றும் ‘தலைமைக் குரு’ என்ற சொற்கள் பன்மையான குருத்துவத் தலைவர்களுக்கும் ஒருமையான பதவி வகிப்பவருக்கும் இடையிலான வேறுபாட்டைக் காக்கின்றன. இயல்பான தமிழ் சொல் வரிசைக்காக இடக் கூறு வினைக்கு முன் வைக்கப்பட்டது.
