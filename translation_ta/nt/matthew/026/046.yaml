    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγείρεσθε
  choice: எழுந்திருங்கள்
  rationale: பல சீடர்களை நோக்கிய பன்மை ஏவலை இயல்பான நவீனத் தமிழில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: ἄγωμεν
  choice: போகலாம்
  rationale: முதலாம் நபர் பன்மை ஊக்குவிப்பு வினைமுறையின் ‘நாம் போவோம்’ என்ற அழைப்பை இயல்பான பேச்சுத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἰδού
  choice: இதோ
  rationale: உடனடியாக நிகழப்போகும் சம்பவத்திற்குக் கவனத்தை ஈர்க்கும் துகளின் உயிரோட்டமான வலிமையைப் பாதுகாக்கிறது.
- source_word: ἤγγικεν
  choice: நெருங்கிவிட்டான்
  rationale: நெருங்குதல் நிகழ்ந்து அதன் விளைவு இப்போது நிலவுகிறது என்ற நிறைவுக்காலத் தன்மையைத் தெரிவிக்கிறது; ஆண்பால் ஒருமை எழுவாயோடும் இயல்பாகப் பொருந்துகிறது.
- source_word: ὁ παραδιδούς με
  choice: என்னைக் காட்டிக்கொடுப்பவன்
  rationale: இயேசுவைப் பகைவர்களிடம் ஒப்படைக்கும் செயலை, அதன் துரோகத் தன்மையோடு இயல்பான தமிழில் தெரிவிக்கிறது; வினையின் நேரடியான ‘ஒப்படைத்தல்’ பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: பாடுகளின் சூழலில் παραδιδούς என்பதன் மொழிபெயர்ப்பு
  choice: என்னைக் காட்டிக்கொடுப்பவன்
  alternative: என்னை ஒப்படைக்கிறவன்
  rationale: பங்கேற்புவினை நேரடியாக இயேசுவை ஒப்படைக்கும் நபரைக் குறிக்கிறது; இச்சூழலில் அந்தச் செயல் துரோகமாக இருப்பதால் ‘காட்டிக்கொடுப்பவன்’ இயல்பாகவும் பொருத்தமாகவும் உள்ளது. அதேவேளை, மூலச்சொல்லின் concrete action அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; அவசரமான நேரடிப் பேச்சின் தொனியைப் பேணும் வகையில் சுருக்கமாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டுள்ளது.
