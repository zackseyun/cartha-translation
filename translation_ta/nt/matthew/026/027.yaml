base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/027.yaml
  text: And having taken a cup and given thanks[a], he gave it to them, saying, “Drink from it[c][b], all of you,”
translation:
  language: ta
  text: அவர் ஒரு கிண்ணத்தை[a] எடுத்து, நன்றி செலுத்தி, அதை அவர்களுக்குக் கொடுத்து, “இதிலிருந்து நீங்கள் அனைவரும் குடியுங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்தக் கிண்ணத்தை.” கிரேக்கத்தில் ‘கிண்ணம்’ என்பதற்கு முன் குறிப்புருபு இல்லை; எனினும், உணவுச் சூழலில் அது குறிப்பிட்ட கிண்ணத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: எடுத்து
  rationale: முதன்மை வினைக்கு முன் நிகழும் செயலைக் குறிக்கும் இறந்தகால வினையெச்சத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ποτήριον
  choice: ஒரு கிண்ணத்தை
  rationale: கிரேக்கத்தில் பெயர்ச்சொல் சுட்டுருபின்றி வருவதால் ‘ஒரு கிண்ணத்தை’ என்பது அதன் வடிவத்தை நேரடியாகப் பிரதிபலிக்கிறது; உணவுச் சூழல் குறிப்பிட்ட கிண்ணத்தைக் குறிக்கக்கூடும் என்பதால் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: εὐχαριστήσας
  choice: நன்றி செலுத்தி
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த நன்றிசெலுத்துதலை இயல்பாகக் கூறுகிறது; பிற்கால சடங்கியல் சொற்களை உரைக்குள் கொண்டுவரவில்லை.
- source_word: ἔδωκεν αὐτοῖς
  choice: அதை அவர்களிடம் கொடுத்து
  rationale: கிரேக்கத்தில் சூழலால் விளங்கும் கிண்ணத்தை ‘அதை’ எனத் தமிழில் வெளிப்படையாகச் சுட்டுவது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: λέγων
  choice: என்றார்
  rationale: நேர்கூற்றை அறிமுகப்படுத்தும் கிரேக்கப் பங்கேற்பு வினையை, தமிழ் நேர்கூற்று அமைப்புக்கு ஏற்றவாறு முதன்மை வினையாக வழங்குகிறது.
- source_word: Πίετε ἐξ αὐτοῦ
  choice: இதிலிருந்து குடியுங்கள்
  rationale: ἐξ என்பதன் மூலத்தைக் குறிக்கும் பொருளை ‘இதிலிருந்து’ துல்லியமாக வெளிப்படுத்துகிறது; குடிக்கப்படும் அளவைப் பற்றிய தவறான புரிதலைத் தவிர்க்கிறது.
- source_word: πάντες
  choice: நீங்கள் எல்லாரும்
  rationale: இந்தக் கட்டளை அங்கிருந்த முழுக் குழுவினரையும் நோக்கிச் சொல்லப்படுவதைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: εὐχαριστήσας என்பதன் திருவிருந்து சார்ந்த ஒலிநயம்
  choice: நன்றி செலுத்தி
  alternative: ஆசீர்வதித்து; நன்றியுரை கூறி
  rationale: εὐχαριστέω என்பதன் நேரடிப் பொருள் நன்றி செலுத்துதல். இந்தத் தேர்வு பின்னாளைய சடங்கியல் விளக்கத்தைத் திணிக்காமல் மூலத்தின் பொருளைப் பாதுகாக்கிறது.
- issue: πάντες என்பதன் தொடர்பு
  choice: கட்டளையின் முகவரிகளான ‘நீங்கள்’ அனைவரையும் குறிக்கிறது
  alternative: பானம் முழுவதையும் குடிக்க வேண்டும் என்பதைக் குறிக்கிறது
  rationale: கிரேக்க இலக்கணத்தில் πάντες என்பது பன்மை கட்டளையின் மறைமுக எழுவாயை இயல்பாகச் சுட்டுகிறது; அது குடிக்கப்படும் அளவைக் குறிப்பிடுவதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘நீங்கள் எல்லாரும்’ என்பது குழுவிலுள்ள ஒவ்வொருவரையும் தெளிவாகக் குறிக்கிறது; ‘இதிலிருந்து’ என்பது மூலத்தைக் குறிக்கும் கிரேக்க முன்னிடைச்சொல்லின் பொருளைப் பாதுகாக்கிறது.
