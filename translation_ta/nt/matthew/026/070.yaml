id: MAT.26.70
reference: Matthew 26:70
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ ἠρνήσατο ⸀ἔμπροσθεν πάντων λέγων· Οὐκ οἶδα τί λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/070.yaml
  text: But he denied it before them all[a], saying, “I do not know what you are saying.”
translation:
  language: ta
  text: ஆனால் அவன், “நீ என்ன சொல்கிறாய் என்று எனக்குத் தெரியாது” என்று சொல்லி, எல்லாருக்கும் முன்பாக அதை மறுத்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρνήσατο
  choice: அதை மறுத்தான்
  rationale: முந்தைய குற்றச்சாட்டே மறுக்கப்பட்டதாகச் சூழல் காட்டுவதால், தமிழில் இயல்பாக இருக்க மறைமுகச் செயப்படுபொருளான ‘அதை’ சேர்க்கப்படுகிறது; இது இயேசுவையே நேரடியாக மறுதலித்தான் என்ற கூடுதல் விளக்கத்தைப் புகுத்தாது.
- source_word: ἔμπροσθεν πάντων
  choice: எல்லாருக்கும் முன்பாக
  rationale: அங்கிருந்த அனைவரின் முன்னிலையிலும் வெளிப்படையாக மறுத்தான் என்ற பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: λέγων
  choice: என்று சொல்லி
  rationale: கிரேக்கப் பங்கேற்புவினையின் தொடர்ச்சியைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Οὐκ οἶδα
  choice: எனக்குத் தெரியாது
  rationale: அறியாமையைக் கூறும் நேரடியான மறுப்பு; நவீனத் தமிழில் இயல்பான வடிவம்.
- source_word: τί λέγεις
  choice: நீ என்ன சொல்கிறாய் என்று
  rationale: கிரேக்கச் சொற்றொடரின் நேரடிப் பொருளைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது; ‘நீ எதைப் பற்றிப் பேசுகிறாய்’ என்ற விரிவாக்கம் தேவையில்லை.
theological_decisions:
- issue: பேதுருவின் மறுப்பின் தன்மை
  choice: உடனடிச் சூழலில் முன்வைக்கப்பட்ட கூற்றை அவன் அனைவருக்கும் முன்பாக மறுத்தான் என மொழிபெயர்க்கப்பட்டது.
  alternative: அவன் இயேசுவை நேரடியாக மறுதலித்தான்; அல்லது பணிப்பெண்ணைத் தெரியாது என்றான்.
  rationale: கிரேக்கத்தில் ἠρνήσατο என்பதற்குச் செயப்படுபொருள் வெளிப்படையாக இல்லை. ஆகவே சூழலில் உள்ள குற்றச்சாட்டைக் குறிக்கும் ‘அதை’ மட்டும் சேர்த்து, உரை கூறாத குறிப்பான விளக்கத்தைத் தவிர்க்கிறது.
translation_notes:
  register: மரியாதையும் கதைநடைத் தெளிவும் கொண்ட நவீன நிலையான தமிழ். மூலத்தின் சுருக்கத்தையும் மறைமுகச் செயப்படுபொருளின் தெளிவின்மையையும் இயன்றவரை காக்கிறது.
