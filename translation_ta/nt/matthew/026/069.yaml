  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. கதைப்பகுதியில் பேதுருவைக் குறிக்கும் வினை மரியாதைப் பன்மையில் அமைந்தாலும், பணிப்பெண்ணின் நேரடி உரையில் மூலத்தின் ஒருமை இரண்டாம் நபர் வலியுறுத்தலைப் பாதுகாக்க ‘நீயும் ... இருந்தாய்’ என வழங்கப்பட்டுள்ளது.
