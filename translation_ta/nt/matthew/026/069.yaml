source:
  edition: SBLGNT
  text: Ὁ δὲ Πέτρος ⸂ἐκάθητο ἔξω⸃ ἐν τῇ αὐλῇ· καὶ προσῆλθεν αὐτῷ μία παιδίσκη λέγουσα· Καὶ σὺ ἦσθα μετὰ Ἰησοῦ τοῦ Γαλιλαίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/069.yaml
  text: Peter was sitting outside in the courtyard[a], and one servant girl came up to him, saying, “You also were with Jesus the Galilean.”
translation:
  language: ta
  text: பேதுரு வெளியே, முற்றத்தில் உட்கார்ந்திருந்தார். ஒரு பணிப்பெண்[a] அவரிடம் வந்து, “நீயும் கலிலேயனாகிய இயேசுவோடு இருந்தாய்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வேலைக்காரப் பெண்” அல்லது “அடிமைப் பெண்.” கிரேக்கச் சொல் இளம் பெண் பணியாளையோ, சில வேளைகளில் அடிமை நிலையிலுள்ள பெண்ணையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது கதைநடையின் மென்மையான மாற்றத்தைக் குறிக்கிறது. ‘ஆனால்’ என்று மொழிபெயர்த்தால் தேவையற்ற முரண்பாடும், ‘அப்போது’ என்று மொழிபெயர்த்தால் மூலத்தில் இல்லாத வெளிப்படையான காலக்குறிப்பும் உருவாகும்; தமிழ் வாக்கியத் தொடரே மாற்றத்தை இயல்பாக உணர்த்துகிறது.
- source_word: ἐκάθητο ἔξω
  choice: வெளியே ... உட்கார்ந்திருந்தார்
  rationale: இறந்தகாலத்தில் தொடர்ந்திருந்த நிலையைக் குறிக்கும் imperfect வினைவடிவத்தை ‘உட்கார்ந்திருந்தார்’ வெளிப்படுத்துகிறது; ἔξω என்பதற்கு ‘வெளியே’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐν τῇ αὐλῇ
  choice: முற்றத்தில்
  rationale: இது தலைமைக் குருவின் இல்லத்திலுள்ள திறந்த முற்றப்பகுதியைக் குறிக்கிறது. ‘முற்றம்’ நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: προσῆλθεν αὐτῷ
  choice: அவரிடம் வந்து
  rationale: பணிப்பெண் பேதுருவை அணுகி வந்ததைக் குறிக்கும் இயல்பான தமிழ் நடை.
- source_word: μία παιδίσκη
  choice: ஒரு பணிப்பெண்[a]
  rationale: μία ஒரு குறிப்பிட்ட நபரை முதன்முறையாக அறிமுகப்படுத்துவதால் ‘ஒரு’ எனத் தரப்பட்டுள்ளது. παιδίσκη இங்கு இளம் பெண் பணியாளையோ அடிமைப் பெண்ணையோ குறிக்கக்கூடும்; சூழலில் சமூகப் பங்கைத் தெளிவாகச் சொல்லும் ‘பணிப்பெண்’ முதன்மை மொழிபெயர்ப்பாகத் தேர்ந்தெடுக்கப்பட்டது.
- source_word: λέγουσα
  choice: வந்து, ... என்றாள்
  rationale: கிரேக்கப் பங்கேற்பு வினைச்சொல்லின் பொருள் தமிழின் இயல்பான தொடர் வினை அமைப்பில் வழங்கப்பட்டுள்ளது.
- source_word: Καὶ σὺ
  choice: நீயும்
  rationale: καί என்பதன் சேர்க்கைப் பொருளையும் σὺ என்பதன் வலியுறுத்தலையும் ‘நீயும்’ சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ἦσθα μετὰ
  choice: உடன் இருந்தாய்
  rationale: உடனிருப்பதைக் குறிக்கும் நேரடியான பொருள்; ‘சீடராக இருந்தாய்’ போன்ற விளக்க விரிவாக்கம் தவிர்க்கப்பட்டுள்ளது.
- source_word: Ἰησοῦ τοῦ Γαλιλαίου
  choice: கலிலேயனாகிய இயேசு
  rationale: Γαλιλαίου இயேசுவை அவரது பகுதியைச் சார்ந்தவராக அடையாளப்படுத்தும் அடைமொழி; ‘கலிலேயனாகிய’ என்பது அந்த வடிவத்தையும் பொருளையும் பாதுகாக்கிறது.
