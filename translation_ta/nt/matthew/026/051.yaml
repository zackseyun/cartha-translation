id: MAT.26.51
reference: Matthew 26:51
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ εἷς τῶν μετὰ Ἰησοῦ ἐκτείνας τὴν χεῖρα ἀπέσπασεν τὴν μάχαιραν αὐτοῦ καὶ πατάξας τὸν δοῦλον τοῦ ἀρχιερέως ἀφεῖλεν αὐτοῦ τὸ ὠτίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/051.yaml
  text: And behold[a], one of those with Jesus stretched out his hand, drew his sword, and struck the high priest’s servant, and cut off his ear.
translation:
  language: ta
  text: இதோ, இயேசுவோடு இருந்தவர்களில் ஒருவர் கையை நீட்டி, தன் வாளை உருவி, தலைமைக் குருவின் அடிமையைத் தாக்கி, அவனுடைய காதைத் துண்டித்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கதையில் திடீரென நிகழும் செயலை வாசகரின் கவனத்துக்குக் கொண்டுவரும் உரையாடல் குறியீட்டின் உயிரோட்டத்தைத் தக்கவைக்கிறது.
- source_word: εἷς τῶν μετὰ Ἰησοῦ
  choice: இயேசுவோடு இருந்தவர்களில் ஒருவர்
  rationale: பகுதிப்பொருள் அமைப்பை இயல்பான நவீனத் தமிழில் வழங்குகிறது; அந்த நபர் யார் என்பதை மூலத்தைவிடக் குறிப்பாக்கவில்லை.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: கையை நீட்டி
  rationale: முதன்மைச் செயலுக்கு முன் நிகழ்ந்த உடல் அசைவைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἀπέσπασεν τὴν μάχαιραν αὐτοῦ
  choice: தமது வாளை உருவி
  rationale: வாளை உறையிலிருந்து இழுத்தெடுக்கும் செயலைத் தமிழில் இயல்பாகக் குறிக்கிறது; αὐτοῦ என்பது இங்கு செய்பவரையே சுட்டுவதால் மரியாதை ஒருமைத் தற்சுட்டான ‘தமது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: μάχαιραν
  choice: வாள்
  rationale: இச்சொல் குறுவாள் அல்லது பெரிய கத்தியைக் குறிக்கக்கூடியதாயினும், இச்சூழலில் ‘வாள்’ என்பது துல்லியத்தை மீறிக் குறிப்பாக்காத பொதுவான இயல்பான சொல்.
- source_word: πατάξας
  choice: வெட்டி
  rationale: வாளால் தாக்கிய செயலை நவீனத் தமிழில் இயல்பாகக் கூறுகிறது; அடுத்துவரும் காது துண்டிக்கப்பட்ட விளைவோடும் தெளிவாக இணைகிறது.
- source_word: δοῦλον
  choice: அடிமை
  rationale: தலைமைக் குருவுக்குக் கீழ்ப்பட்டவரின் சமூக நிலையைக் மென்மைப்படுத்தாமல் δοῦλος என்பதன் அடிப்படைப் பொருளை வெளிப்படுத்துகிறது.
- source_word: ἀρχιερέως
  choice: தலைமைக் குருவின்
  rationale: யூத வழிபாட்டு அமைப்பிலுள்ள ἀρχιερεύς பதவிக்கான தெளிவான, நிலையான தமிழாக்கம்.
- source_word: ἀφεῖλεν αὐτοῦ τὸ ὠτίον
  choice: அவனுடைய காதைத் துண்டித்தார்
  rationale: ‘அவனுடைய காதை அகற்றினார்’ என்ற சொற்பொருளை, வாள்வெட்டின் விளைவைத் தெளிவாகக் காட்டும் இயல்பான தமிழில் வழங்குகிறது; கிரேக்கத்தின் இறுதி வினைச்சொல்லைத் தனி முற்றுவினையாகத் தக்கவைக்கிறது.
- source_word: ὠτίον
  choice: காது
  rationale: வடிவில் சிறுமைப்பொருள் இருந்தாலும், இங்கு வழக்கமான உடற்பகுதியைக் குறிக்கும் இயல்பான தமிழ் இணைச்சொல் ‘காது’; ‘காதுமடல்’ என்பது தேவையற்ற குறிப்பாக்கமாகும்.
theological_decisions:
- issue: சமூக உறவைக் குறிக்கும் δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: அடிமை
  alternative: வேலைக்காரன் / பணியாளர்
  rationale: இக்கைது நிகழ்வில் தலைமைக் குருவுக்குச் சொந்தமான அல்லது அவருக்குக் கட்டுப்பட்ட ஒருவரின் பிணைக்கப்பட்ட சமூக நிலையே குறிக்கப்படுகிறது. ஆகவே அந்த வரலாற்று நிதர்சனத்தை மென்மைப்படுத்தாமல் ‘அடிமை’ என வழங்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பும் கண்ணியமும் பேணப்பட்டுள்ளன. செய்பவர் அடையாளம் காணப்படாததால் மரியாதை ஒருமை வினைமுற்று பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சியான கிரேக்கச் செயல்கள் தெளிவான தமிழ் வினைத்தொடராக அமைக்கப்பட்டுள்ளன.
