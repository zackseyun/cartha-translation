id: MAT.26.55
reference: Matthew 26:55
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ὥρᾳ εἶπεν ὁ Ἰησοῦς τοῖς ὄχλοις· Ὡς ἐπὶ λῃστὴν ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων συλλαβεῖν με; καθ’ ⸀ἡμέραν ⸂ἐν τῷ ἱερῷ ἐκαθεζόμην διδάσκων⸃ καὶ οὐκ ἐκρατήσατέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/055.yaml
  text: At that hour Jesus said to the crowds[a], “Have you come out with swords and clubs to arrest me, as against a robber? Day after day I was sitting in the temple teaching[b], and you did not seize me.”
translation:
  language: ta
  text: அந்த வேளையில் இயேசு மக்கள் கூட்டங்களிடம், “ஒரு கொள்ளைக்காரனைப்[a] பிடிக்க வருவதுபோல், என்னைக் கைது செய்ய வாள்களோடும் தடிகளோடும் வந்திருக்கிறீர்களா? நாள்தோறும் நான் ஆலய வளாகத்தில் அமர்ந்து கற்பித்துக்கொண்டிருந்தேன்; ஆனால் நீங்கள் என்னைப் பிடிக்கவில்லை” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வழிப்பறிக் கொள்ளையன்” அல்லது சில சூழல்களில் “கிளர்ச்சியாளர்” என்றும் பொருள்படலாம். கிரேக்கச் சொல் சாதாரணத் திருடனைவிட வன்முறைக் கொள்ளையனைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: அந்த வேளையில்
  rationale: கிரேக்கத் தொடரின் உடனடியான காலக் குறிப்பை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: τοῖς ὄχλοις
  choice: மக்கள் கூட்டங்களிடம்
  rationale: ὄχλοις என்பதன் பன்மை வடிவைப் பாதுகாக்கிறது; சூழலில் இயேசுவைச் சூழ்ந்திருந்த பல்வேறு குழுக்களையும் குறிக்க ஏற்றது.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: ஒரு கொள்ளைக்காரனைப் பிடிக்க வருவதுபோல்
  rationale: ‘ஒரு கொள்ளைக்காரனுக்கு எதிராக வருவதுபோல்’ என்ற சொற்சொல் அமைப்பை விட தமிழில் இயல்பாகவும், அவரை ஆபத்தான குற்றவாளிபோல் நடத்துகிறார்கள் என்ற வினாவின் கருத்தைத் தெளிவாகவும் தருகிறது.
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: வாள்களோடும் தடிகளோடும்
  rationale: μάχαιραι ஆயுதங்களான வாள்களையும், ξύλα இச்சூழலில் தாக்குவதற்குப் பயன்படும் மரத் தடிகளையும் குறிக்கின்றன.
- source_word: συλλαβεῖν με
  choice: என்னைக் கைது செய்ய
  rationale: அதிகாரபூர்வமாகப் பிடித்துச் செல்ல வந்த சூழலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: καθ’ ἡμέραν
  choice: நாள்தோறும்
  rationale: ஒவ்வொரு நாளும் தொடர்ந்து நிகழ்ந்ததைக் குறிக்கும் பகிர்வு வலிமையைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ἐν τῷ ἱερῷ
  choice: ஆலய வளாகத்தில்
  rationale: ἱερόν என்பது உள் பரிசுத்த இடத்தை மட்டும் அல்லாமல் எருசலேம் ஆலயத்தின் விரிந்த வளாகத்தைக் குறிக்க முடிவதால் இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἐκαθεζόμην διδάσκων
  choice: அமர்ந்து கற்பித்துக்கொண்டிருந்தேன்
  rationale: இரண்டு செயல்களும் ஒரே நேரத்தில் தொடர்ந்து நடந்ததை கிரேக்க இறந்தகாலத் தொடர்ச்சியும் நிகழ்காலப் பங்கேற்பு வடிவமும் காட்டுவதால் அதைத் தமிழிலும் பாதுகாக்கிறது.
- source_word: οὐκ ἐκρατήσατέ με
  choice: நீங்கள் என்னைப் பிடிக்கவில்லை
  rationale: κρατέω என்பதன் ‘பற்றிப் பிடித்தல்/கைப்பற்றுதல்’ என்ற கருத்தைத் தருவதோடு, முன் வரும் ‘கைது செய்ய’ என்பதிலிருந்து சொல் வேறுபாட்டையும் ஓரளவு காக்கிறது.
theological_decisions:
- issue: λῃστής என்ற சொல்லின் பொருள் நுணுக்கம்
  choice: கொள்ளைக்காரன்
  alternative: வழிப்பறிக் கொள்ளையன்; ஆயுதக் கிளர்ச்சியாளர்
  rationale: இச்சொல் சாதாரணத் திருடனைவிட வன்முறையில் ஈடுபடும் கொள்ளையனையோ சில சூழல்களில் கிளர்ச்சியாளனையோ குறிக்கலாம். ஆனால் இவ்வசனம் அரசியல் பொருளைத் தெளிவாக நிர்ணயிக்காததால் பொதுவான பொருள் முதன்மை உரையில் வைக்கப்பட்டு, விரிந்த சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. ‘ஆலய வளாகம்’ என்பது ἱερόν மற்றும் உள் திருத்தலமான ναός ஆகியவற்றுக்கிடையிலான வேறுபாட்டைத் தெளிவாக்குகிறது. இயேசுவின் கேள்விக்குரிய கண்டனத் தொனியும், வெளிப்படையாகக் கற்பித்தபோது அவரைக் கைது செய்யாதவர்களின் முரண்பாடும் பாதுகாக்கப்பட்டுள்ளன.
