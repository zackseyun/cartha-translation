source:
  edition: SBLGNT
  text: τοῦτο δὲ ὅλον γέγονεν ἵνα πληρωθῶσιν αἱ γραφαὶ τῶν προφητῶν. τότε οἱ μαθηταὶ πάντες ἀφέντες αὐτὸν ἔφυγον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/056.yaml
  text: But all this has happened so that the Scriptures of the prophets might be fulfilled[a]. Then all the disciples left him and fled.
translation:
  language: ta
  text: ஆனால் இவை அனைத்தும் தீர்க்கதரிசிகளின் வேதவாக்கியங்கள் நிறைவேறும்படி நடந்திருக்கிறது. அப்போது சீடர்கள் அனைவரும் அவரை விட்டுவிட்டு[a] ஓடிப்போனார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவரைக் கைவிட்டு’; ἀφέντες என்ற சொல் இச்சூழலில் கைவிட்டுச் செல்லுதல் என்ற வலுவான பொருளையும் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: ஆனால் இவையெல்லாம்
  rationale: முன்பு விவரிக்கப்பட்ட முழு நிகழ்வையும் இயல்பான தமிழில் குறிக்கிறது; δέ என்பதன் மெல்லிய எதிர்மறைத் தொடர்பை ‘ஆனால்’ காக்கிறது.
- source_word: γέγονεν
  choice: நடந்திருக்கின்றன
  rationale: நிறைவுற்ற நிகழ்வின் தற்போதைய பொருத்தத்தைக் காட்டும் கிரேக்க நிறைவுக் காலத்தின் வலிமையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἵνα πληρωθῶσιν
  choice: நிறைவேறும்படி
  rationale: நோக்கம் அல்லது விளைவு என்ற இரு நுணுக்கங்களையும் தேவையின்றித் தீர்மானிக்காமல் சுருக்கமாகக் காக்கிறது.
- source_word: αἱ γραφαὶ τῶν προφητῶν
  choice: தீர்க்கதரிசிகளின் வேதவாக்குகள்
  rationale: இங்கு γραφαί புனித வேத எழுத்துகளைக் குறிக்கிறது; τῶν προφητῶν என்பதையும் ‘தீர்க்கதரிசிகளின்’ என்று விரிவாக்கமின்றிக் காக்கிறது.
- source_word: τότε
  choice: அப்போது
  rationale: அடுத்த நிகழ்வை வரிசையாக அறிமுகப்படுத்தும் இயல்பான தமிழ்ச் சொல்.
- source_word: οἱ μαθηταὶ πάντες
  choice: சீடர்கள் அனைவரும்
  rationale: πάντες வலியுறுத்தும் முழுமையைத் தெளிவாகக் காட்டுகிறது; மூலத்தில் இல்லாத ‘அவருடைய’ என்பதைச் சேர்க்கவில்லை.
- source_word: ἀφέντες αὐτὸν
  choice: அவரை விட்டுவிட்டு
  rationale: சூழலில் ஒருவரை விட்டுச் செல்லுதல் என்ற பொருளை இயல்பாகத் தருகிறது; கைவிடுதல் என்ற வலுவான நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἔφυγον
  choice: தப்பியோடினார்கள்
  rationale: ἔφυγον என்பதன் வெறுமனே சென்றுவிடுதல் அல்லாத, அச்சத்தால் ஓடித் தப்புதல் என்ற வலிமையை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தீர்க்கதரிசிகளின் வேதவாக்குகள் நிறைவேறுதல்
  choice: ‘தீர்க்கதரிசிகளின் வேதவாக்குகள் நிறைவேறும்படி’ என்ற வெளிப்படையான நிறைவேற்ற மொழியைத் தக்கவைத்தல்
  alternative: ‘தீர்க்கதரிசிகள் எழுதியது மெய்யாகும்படி’
  rationale: மத்தேயுவின் நிறைவேற்றக் கருத்து மூலத்தில் வெளிப்படையாகவும் இறையியல் முக்கியத்துவத்துடனும் உள்ளது. அதைத் தளர்வான விளக்கவுரையாக மாற்றாமல், வேதத்திற்கும் தீர்க்கதரிசிகளுக்கும் உள்ள தொடர்பைக் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேத உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘தீர்க்கதரிசிகள்’, ‘வேதவாக்குகள்’ போன்ற பரவலாக அறியப்பட்ட சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
