  source_fidelity: 'முதன்மை உரை கிரேக்க மூலத்துக்கு உண்மையாக உள்ளது: ἐν ταύτῃ τῇ νυκτί என்பதன் சுட்டுவலியுறுத்தலை ‘இந்த இரவிலேயே’ காக்கிறது; πρὶν ἀλέκτορα φωνῆσαι, τρὶς, ἀπαρνήσῃ με ஆகியவை முறையே ‘ஒரு சேவல் கூவுவதற்கு முன்,’ ‘மூன்று முறை,’ ‘என்னை ... மறுதலிப்பாய்’ எனத் துல்லியமாகத் தரப்பட்டுள்ளன. பாதுகாப்பான சிறு திருத்தம் அடிக்குறிப்பு b-இன் இலக்கண விளக்கத்துக்கு மட்டுமே தேவைப்படுகிறது.'
