source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Ἀμὴν λέγω σοι ὅτι ἐν ταύτῃ τῇ νυκτὶ πρὶν ἀλέκτορα φωνῆσαι τρὶς ἀπαρνήσῃ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/034.yaml
  text: Jesus said to him, “Truly I tell you, in this very night, before a rooster crows, you will deny me three times.”
translation:
  language: ta
  text: இயேசு அவனிடம், “உண்மையாகவே உனக்குச் சொல்கிறேன், இந்த இரவிலேயே, ஒரு சேவல் கூவுவதற்கு முன், நீ என்னை மூன்று முறை மறுதலிப்பாய்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: இயேசு அவனிடம் … என்றார்
  rationale: கிரேக்கத்தின் எளிய உரையாடல் அறிமுகத்தை இயல்பான தமிழ் நேர்கூற்று அமைப்பில் வழங்குகிறது; αὐτῷ என்பதையும் ‘அவனிடம்’ என்று வெளிப்படையாக வைத்திருக்கிறது.
- source_word: Ἀμὴν λέγω σοι
  choice: உண்மையாகவே உனக்குச் சொல்கிறேன்
  rationale: இயேசுவின் கூற்றை அறிமுகப்படுத்தும் ஆணித்தரமான உறுதிப்பாட்டை இயல்பான நவீன தமிழில் காக்கிறது; எபிரேய வடிவத்தை மொழிபெயர்க்காமல் விடுவதையும், ‘நான் உனக்கு உறுதியளிக்கிறேன்’ என்று பொருளை விரிவுபடுத்துவதையும் தவிர்க்கிறது.
- source_word: ἐν ταύτῃ τῇ νυκτί
  choice: இந்த இரவிலேயே
  rationale: ‘இந்த இரவில்’ என்ற அடிப்படைப் பொருளையும் ταύτῃ தரும் குறிப்பான வலியுறுத்தலையும் ‘-ஏ’ மூலம் காக்கிறது.
- source_word: πρὶν ἀλέκτορα φωνῆσαι
  choice: ஒரு சேவல் கூவுவதற்கு முன்
  rationale: கிரேக்க இறந்தகாலமற்ற வினையெச்சக் கட்டமைப்பை இயல்பான தமிழ் காலத் துணைவாக்கியமாக்குகிறது. சுட்டுருபில்லாத ἀλέκτορα என்பதற்கு ‘ஒரு சேவல்’ என்பது நேரடியான சாத்தியமான வாசிப்பு; குறிப்பிட்ட ‘அந்தச் சேவல்’ என்று தேவையின்றி தீர்மானிக்கவில்லை.
- source_word: τρὶς
  choice: மூன்று முறை
  rationale: தெளிவான, வழக்கிலுள்ள நவீன தமிழ் எண்ணிக்கைச் சொற்றொடர்.
- source_word: ἀπαρνήσῃ με
  choice: நீ என்னை … மறுதலிப்பாய்
  rationale: பேதுருவின் வரவிருக்கும் மறுப்புச் செயலைக் குறிக்கும் வினையின் பொருளைத் தக்கவைக்கிறது. ‘கைவிடுவாய்’ அல்லது ‘உறவைத் துண்டிப்பாய்’ என்பவை சூழலை அதிகமாக விளக்கிவிடும்.
theological_decisions:
- issue: Ἀμὴν λέγω σοι என்ற இயேசுவின் ஆணித்தரமான அறிமுகச் சூத்திரம்
  choice: உண்மையாகவே உனக்குச் சொல்கிறேன்
  alternative: ஆமென், உனக்குச் சொல்கிறேன்; நான் உனக்கு உறுதியாகச் சொல்கிறேன்
  rationale: இயேசுவின் அதிகாரமுள்ள ஆணித்தரமான கூற்றைத் தக்கவைத்தபடியே, பிற்கால வழிபாட்டு பயன்பாட்டை முதன்மை உரைக்குள் கொண்டுவராமல் இயல்பான தமிழில் வழங்குகிறது.
- issue: ἀπαρνήσῃ என்பதன் உறவுசார் வலிமை
  choice: மறுதலிப்பாய்
  alternative: என்னைத் தெரியாது என்று சொல்வாய்; என்னைக் கைவிடுவாய்
  rationale: மூல வினையின் மறுப்பு/மறுதலிப்பு பொருளை வைத்துக்கொண்டு, பேதுரு சொல்லப்போகும் சொற்களை முன்கூட்டியே விரிவாகச் சேர்க்கவோ நிரந்தர உறவுத்துண்டிப்பாக விளக்கவோ இல்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியக்கூடியதுமான நடை. நேர்கூற்றில் இயல்பான தமிழ் சொல் வரிசை பயன்படுத்தப்பட்டுள்ளது. ‘இந்த இரவிலேயே’ என்பது மூலத்தின் சுட்டுவலியுறுத்தலைக் காக்கிறது; ‘மறுதலிப்பாய்’ என்பது வேதாகமச் சூழலில் அறிமுகமானதாயிருந்தாலும் இன்றும் புரியக்கூடிய முறையான சொல்.
