  source_fidelity: 'வரைவின் அடிப்படைப் பொருள் கிரேக்க மூலத்துடன் ஒத்துள்ளது: பெயரிடப்படாத பெண், மிகுந்த மதிப்புள்ள μύρον, தலையின்மேல் ஊற்றுதல், மற்றும் உணவின்போது சாய்ந்திருக்கும் நிலை ஆகியவை காக்கப்பட்டுள்ளன. ஆனால் ‘வெள்ளைக்கல்’ என்பது ἀλάβαστρον என்பதற்கு அளவுக்கு மீறிய குறிப்பாக்கமாகும்; ‘அலபாஸ்டர்’ என்பதே பாதுகாப்பானது. குறிப்பு, குடுவையின் பொருளும் வடிவமும் சூழலுக்கு ஏற்ப மாறும் எனக் கூறுவது இவ்வசனத்திற்குத் தேவையற்றதும் அலபாஸ்டர் குறித்த முதன்மை மொழிபெயர்ப்புடன் முரணுறுவதுமாகும்.'
  naturalness: ‘உணவருந்தச் சாய்ந்திருந்தபோது’ என்பதைவிட ‘உணவு மேசையருகே சாய்ந்திருந்தபோது’ என்பது நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது; அது ἀνακειμένου குறிக்கும் உணவுநேரச் சாய்வுநிலையையும் வெளிப்படுத்துகிறது. மற்ற வாக்கிய அமைப்பு இயல்பாக உள்ளது.
  terminology: μύρον-க்கு ‘நறுமணத் தைலம்’ பொருத்தமான முதன்மைத் தெரிவாகும்; ‘நறுமணக் களிம்பு’ மாற்றுவழியாகக் குறிப்பில் தரப்படலாம். ἀλάβαστρον-க்கு ‘அலபாஸ்டர் குடுவை’ என்று தருவது சொல்லின் வரலாற்று/பொருள் குறிப்பைத் தவறாகச் சுருக்காமல் காக்கிறது. கலாச்சார விளக்கத்திற்கான தனி குறிப்பு ஆங்கில audit trail-இன் குறிப்பு b-யை முறையாகப் பிரதிபலிக்கிறது.
