source:
  edition: SBLGNT
  text: προσῆλθεν αὐτῷ γυνὴ ⸂ἔχουσα ἀλάβαστρον μύρου⸃ βαρυτίμου καὶ κατέχεεν ἐπὶ ⸂τῆς κεφαλῆς⸃ αὐτοῦ ἀνακειμένου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/007.yaml
  text: a woman came to him holding an alabaster jar of very costly perfume[b][a], and she poured it on his head as he was reclining at the table.
translation:
  language: ta
  text: அவர் உணவு மேசையருகே சாய்ந்திருந்தபோது[b], ஒரு பெண் மிகவும் விலையுயர்ந்த நறுமணத் தைலம் கொண்ட அலபாஸ்டர் குடுவையை[a] எடுத்துக்கொண்டு அவரிடம் வந்து, அதை அவருடைய தலையின்மேல் ஊற்றினாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மிகவும் விலையுயர்ந்த நறுமணக் களிம்பு கொண்ட அலபாஸ்டர் குப்பி.” கிரேக்கச் சொல் μύρον மணமுள்ள எண்ணெயையோ களிம்பையோ குறிக்கலாம்; நவீன திரவ வாசனைப்பொருளை மட்டும் குறிக்காது.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, அக்கால உணவு வழக்கத்தில் மேசையருகே சாய்ந்திருக்கும் நிலையில் இருந்தார்.
    reason: cultural_note
lexical_decisions:
- source_word: προσῆλθεν αὐτῷ
  choice: அவரிடம் வந்து
  rationale: ஒருவரை நோக்கி வருதல் என்ற திசை உணர்வை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: γυνὴ
  choice: ஒரு பெண்
  rationale: கிரேக்க மூலத்தில் இங்கு அந்தப் பெண்ணை அடையாளப்படுத்தும் குறிப்பு இல்லாததால் indefinite வடிவம் காக்கப்படுகிறது.
- source_word: ἔχουσα
  choice: எடுத்துக்கொண்டு
  rationale: அந்தப் பெண் குடுவையைத் தன்னுடன் கொண்டுவந்த உடனடி காட்சியை இயல்பாக வெளிப்படுத்துகிறது; வெறும் ‘உடையவளாய்’ என்பதைவிட தமிழில் தெளிவானது.
- source_word: ἀλάβαστρον
  choice: வெள்ளைக்கல் குடுவை
  rationale: நறுமணத் தைலம் வைக்கப் பயன்பட்ட அலபாஸ்டர் கல்லாலான சிறு கலனைச் சாதாரண வாசகருக்குப் புரியும் வகையில் குறிக்கிறது.
- source_word: μύρου βαρυτίμου
  choice: மிகவும் விலையுயர்ந்த நறுமணத் தைலம்
  rationale: μύρον என்பது மணமுள்ள எண்ணெய் அல்லது களிம்பைக் குறிக்கலாம்; ‘நறுமணத் தைலம்’ அதன் பண்டைய வடிவை நவீன திரவ வாசனைப் பொருளாக மட்டும் சுருக்காமல் காக்கிறது. βαρυτίμου என்பதன் வலிமை ‘மிகவும் விலையுயர்ந்த’ எனத் தரப்படுகிறது.
- source_word: κατέχεεν
  choice: ஊற்றினாள்
  rationale: மேலிருந்து ஒன்றின்மேல் ஊற்றுதல் என்ற செயலைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: அவருடைய தலையின்மேல்
  rationale: தைலம் அவரது தலையின்மேல் ஊற்றப்பட்ட இடத்தையும் திசையையும் நேரடியாகக் காக்கிறது.
- source_word: ἀνακειμένου
  choice: அவர் உணவருந்தச் சாய்ந்திருந்தபோது
  rationale: பண்டைய விருந்துகளில் மேசையருகே சாய்ந்து உணவருந்திய வழக்கத்தைச் சூழலோடு தெளிவாக்குகிறது; ‘படுத்திருந்தார்’ என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
