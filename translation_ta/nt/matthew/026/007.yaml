translation_notes:
  register: நவீனத் தரத் தமிழ்; இயல்பானதாயும் கண்ணியமானதாயும் அமைக்கப்பட்டுள்ளது. உணவு நேரத்தில் சாய்ந்திருக்கும் பண்டைய வழக்கம் பிரதான உரையிலேயே சுருக்கமாகத் தெளிவாக்கப்பட்டுள்ளது. ‘நறுமணத் தைலம்’ என்பது μύρον என்பதைக் காலத்திற்கேற்ற வாசனைத் திரவமாக மட்டும் பொருள்கொள்ளாமல் அதன் பரந்த பொருளைத் தக்கவைக்கிறது.
