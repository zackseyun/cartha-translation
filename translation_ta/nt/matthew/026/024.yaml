id: MAT.26.24
reference: Matthew 26:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· καλὸν ἦν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/024.yaml
  text: The Son of Man indeed goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been better for him if that man had not been born.
translation:
  language: ta
  text: மனிதகுமாரன் தம்மைக் குறித்து எழுதப்பட்டிருக்கிறபடியே செல்கிறார். ஆனால், மனிதகுமாரனை எந்த மனிதன் காட்டிக்கொடுக்கிறானோ[a], அந்த மனிதனுக்கு ஐயோ! அந்த மனிதன் பிறக்காமலிருந்திருந்தால், அது அவனுக்கு நல்லதாயிருந்திருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒப்புக்கொடுக்கிறானோ.’ கிரேக்க வினைச்சொல் ‘காட்டிக்கொடு’ அல்லது, இன்னும் நேரடியாக, ‘ஒப்புக்கொடு’ என்று பொருள்படலாம்; இங்கு யூதாசின் துரோகம் பார்வையில் இருப்பதால் ‘காட்டிக்கொடுக்கிறான்’ என்பது தேர்ந்தெடுக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὲν υἱὸς τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: இயேசுவின் நிலைபெற்ற பட்டப்பெயரைத் தக்கவைக்கிறது. μὲν-இன் எதிர்மறை இணைப்பு, அடுத்த வாக்கியத்தின் δὲ-ஐ ‘ஆனால்’ என்று மொழிபெயர்ப்பதன் மூலம் இயல்பாக வெளிப்படுகிறது.
- source_word: ὑπάγει
  choice: செல்கிறார்
  rationale: ‘புறப்படுகிறார்’ அல்லது ‘இறக்கச் செல்கிறார்’ என்று பொருளை மிகையாகக் குறிப்பாக்காமல், கிரேக்க வினையின் எளிய இயக்கப் பொருளையும் சூழலிலுள்ள மறைபொருளையும் தக்கவைக்கிறது.
- source_word: καθὼς γέγραπται περὶ αὐτοῦ
  choice: தம்மைக் குறித்து எழுதப்பட்டிருக்கிறபடியே
  rationale: γέγραπται என்ற நிறைவுற்ற செயப்பாட்டு வடிவத்தின், எழுதப்பட்டு நிலைத்திருக்கும் தன்மையை ‘எழுதப்பட்டிருக்கிறது’ என்ற இயல்பான தமிழால் காட்டுகிறது.
- source_word: οὐαὶ δὲ
  choice: ஆனால் ... ஐயோ!
  rationale: δὲ குறிக்கும் முரண்பாட்டை ‘ஆனால்’ வெளிப்படுத்துகிறது; οὐαί-இன் தீர்ப்பும் புலம்பலும் கலந்த வலிமையை ‘ஐயோ!’ தக்கவைக்கிறது.
- source_word: δι’ οὗ
  choice: எந்த மனிதன் மூலமாக
  rationale: διά + genitive குறிக்கும் செயலாண்மை அல்லது வழிமுறையை நேரடியாகக் காட்டுகிறது; அதேவேளை அந்த மனிதனின் பொறுப்பை மறைக்கவில்லை.
- source_word: παραδίδοται
  choice: காட்டிக்கொடுக்கப்படுகிறார்
  rationale: யூதாசின் துரோகச் செயலை நவீன தமிழில் இயல்பாக எடுத்துரைக்கிறது. ‘ஒப்புக்கொடுக்கப்படுகிறார்’ என்ற விரிவான, நேரடிப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: καλὸν ἦν αὐτῷ
  choice: அது அவனுக்கு நல்லதாயிருந்திருக்கும்
  rationale: பின்வரும் நிகழாத நிபந்தனையோடு சேர்ந்து வரும் எதிர்நிலைப் பொருளை இயல்பான தமிழில் தருகிறது; ‘மேலானது’ என்று ஒப்பீட்டை உரையில் சேர்க்கவில்லை.
- source_word: εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος
  choice: அந்த மனிதன் பிறக்காமல் இருந்திருந்தால்
  rationale: நிகழாத கடந்தகால நிபந்தனையைத் தெளிவாகக் காட்டுவதோடு, ἐκεῖνος தரும் சுட்டிக்காட்டும் வலிமையையும் மீண்டும் வரும் ‘அந்த மனிதன்’ என்ற தொடரையும் தக்கவைக்கிறது.
theological_decisions:
- issue: எழுதப்பட்ட திட்டத்திற்கும் மனிதப் பொறுப்பிற்கும் இடையிலான உறவு
  choice: மனிதகுமாரன் எழுதப்பட்டபடியே செல்கிறார் என்பதையும், அவரைக் காட்டிக்கொடுக்கும் மனிதன்மேல் ‘ஐயோ’ எனத் தீர்ப்பு கூறப்படுவதையும் இணையாகத் தக்கவைத்தல்
  alternative: முன்குறிக்கப்பட்ட நிகழ்வு மனிதப் பொறுப்பைக் குறைக்கிறது என்றோ, மனிதச் செயல் வேதாகம நிறைவேற்றத்தின் வலிமையைக் குறைக்கிறது என்றோ விளக்குதல்
  rationale: கிரேக்க உரை இரண்டையும் அருகருகே கூறுகிறது; மொழிபெயர்ப்பு அந்த இறையியல் அழுத்தத்தைத் தீர்த்துவைக்காமல் பாதுகாக்கிறது.
- issue: பிறக்காமல் இருந்திருப்பது பற்றிய இறுதி கூற்றின் வலிமை
  choice: கடுமையான தீர்ப்புக் கூற்றாக அப்படியே வழங்குதல்
  alternative: இதை வெறும் மிகைப்படுத்தல் என்றோ, குறிப்பிட்ட ஓர் இறுதி நிலை குறித்த முழுமையான கோட்பாட்டுச் சான்று என்றோ விரிவுபடுத்துதல்
  rationale: உரை கூறும் கடுமையைத் தணிக்காமலும், அது வெளிப்படையாகக் கூறாத கோட்பாட்டு முடிவைச் சேர்க்காமலும் மொழிபெயர்க்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘மனிதகுமாரன்’ என்ற நிலைபெற்ற பட்டப்பெயரும் இயேசுவைக் குறிக்கும் மரியாதைப் பன்மையும் தக்கவைக்கப்பட்டுள்ளன; யூதாசைக் குறிக்கும் ஒருமை வடிவங்கள் மூலத்தின் வேறுபாட்டைப் பாதுகாக்கின்றன.
