  text: τί ὑμῖν δοκεῖ; οἱ δὲ ἀποκριθέντες εἶπαν· Ἔνοχος θανάτου ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/066.yaml
  text: What do you think? They answered[a], “He is deserving of death.”
translation:
  language: ta
  text: “நீங்கள் என்ன நினைக்கிறீர்கள்?” அதற்கு அவர்கள், “அவர் மரண தண்டனைக்குரியவர்[a]” என்று பதிலளித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் மரணத்திற்குப் பொறுப்பானவர்” அல்லது “அவர் மரண தண்டனைக்கு உட்பட்டவர்.” கிரேக்கச் சொற்றொடர் ஒரு சட்டத் தீர்ப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: நீங்கள் என்ன நினைக்கிறீர்கள்?
  rationale: δοκέω என்பதுடன் ὑμῖν வருவது கருத்தையோ தீர்ப்பையோ கேட்கும் மரபுத்தொடர். சூழலில் நீதித்தீர்ப்பு சார்ந்த நிழற்பொருள் இருந்தாலும், நேரடியான கேள்வியை இயல்பான நவீனத் தமிழில் இது தெளிவாகத் தருகிறது.
- source_word: οἱ δὲ ἀποκριθέντες εἶπαν
  choice: அதற்கு அவர்கள் … என்று பதிலளித்தார்கள்
  rationale: ἀποκριθέντες εἶπαν என்பது ‘பதிலளித்துச் சொன்னார்கள்’ என்ற பொருளுடைய வழக்கமான கதைநடை அமைப்பு. தமிழில் தேவையற்ற இரட்டிப்பைத் தவிர்த்து ‘பதிலளித்தார்கள்’ என்று இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது; δέ இங்கு மென்மையான தொடர்ச்சியைத் தருவதால் ‘அதற்கு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: Ἔνοχος θανάτου
  choice: மரண தண்டனைக்குரியவர்
  rationale: ἔνοχος + θανάτου என்பது மரணத்துக்கு உட்பட்டவர், மரண தண்டனை பெறத் தகுந்தவர் என்ற சட்டத் தீர்ப்பைக் குறிக்கிறது. ‘மரண தண்டனைக்குரியவர்’ என்பது அந்த நீதிமன்றச் சார்பை நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ἐστίν
  choice: அவர் … உரியவர்
  rationale: கிரேக்க வாக்கியத்தின் இணைப்புவினை தமிழில் பெயர்ப் பயனிலை அமைப்பால் இயல்பாக வெளிப்படுகிறது. சூழலில் இயேசுவைக் குறிக்கும் மறைமுக எழுவாய் மரியாதைப் பெயரால் வெளிப்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: ஆலோசனைச் சங்கத்தின் தீர்ப்பில் உள்ள சட்டவியல் வலிமை
  choice: அவர் மரண தண்டனைக்குரியவர்
  alternative: அவர் மரணத்துக்குக் குற்றவாளி / அவர் மரணத்துக்கு உட்பட்டவர்
  rationale: இது ஆலோசனைச் சங்கம் இயேசுவைப் பற்றி வழங்கிய சட்டத் தீர்ப்பைச் சொல்கிறது. கடவுளுக்கு முன்பாக அவர் உண்மையில் குற்றவாளி என்ற இறையியல் முடிவை மொழிபெயர்ப்பு சேர்க்கவில்லை; பேச்சாளர்களின் தீர்ப்பாகவே பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் இயல்பான, கண்ணியமான நடை. இயேசுவைக் குறிக்க மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; சட்டவியல் பொருள் தெளிவாக வைக்கப்பட்டுள்ளது.
