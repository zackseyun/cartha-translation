revisions:
- from: அப்போது, அவரைக் காட்டிக்கொடுக்கவிருந்த யூதாஸ், “ரபீ, அது நானல்லவே?” என்று கேட்டான். அதற்கு அவர், “நீயே சொல்லிவிட்டாய்” என்றார்.
  to: அப்போது, அவரைக் காட்டிக்கொடுப்பவன் யூதாஸ் பதிலளித்து, “ரபீ, நானல்லவே?” என்றான். அதற்கு அவர், “நீயே சொல்லிவிட்டாய்” என்றார்.
  rationale: The revision restores Judas’s explicit response, retains the source’s identifying participle in a natural Tamil form, and makes his negative question more directly reflect the Greek while preserving its expectation of a negative answer. Jesus’ reply remains intentionally indirect rather than being expanded into an unambiguous ‘yes.’
