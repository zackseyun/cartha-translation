id: MAT.26.25
reference: Matthew 26:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ Ἰούδας ὁ παραδιδοὺς αὐτὸν εἶπεν· Μήτι ἐγώ εἰμι, ῥαββί; λέγει αὐτῷ· Σὺ εἶπας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/025.yaml
  text: Then Judas, the one betraying him, answered and said, “Surely I am not the one, Rabbi?” He said to him, “You have said so.”
translation:
  language: ta
  text: அப்போது, அவரைக் காட்டிக்கொடுப்பவன் யூதாஸ் பதிலளித்து, “ரபீ, நானல்லவே?” என்றான். அதற்கு அவர், “நீயே சொல்லிவிட்டாய்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: அவரைக் காட்டிக்கொடுக்கவிருந்த
  rationale: παραδίδω என்பதன் இச்சூழலுக்குரிய துரோக ஒப்படைப்பு பொருளை இயல்பான தமிழில் தருகிறது; நிகழ்காலப் பங்கேற்புச் சொல்லை, உடனடியாக நடைபெறவிருக்கும் செயலைச் சுட்டும் வகையில் மொழிபெயர்க்கிறது.
- source_word: Μήτι ἐγώ εἰμι
  choice: அது நானல்லவே?
  rationale: μήτι எதிர்மறையான பதிலை எதிர்பார்க்கும் கேள்வி; யூதாஸ் தன்னை மறுத்துப் பேசும் தொனியை இயல்பான தமிழில் காக்கிறது.
- source_word: ῥαββί
  choice: ரபீ
  rationale: யூத ஆசிரியருக்கான மூலமொழிப் பட்டத்தை மொழிபெயர்க்காமல் ஒலிபெயர்த்து, மத்தேயு 26:22இல் மற்ற சீடர்கள் பயன்படுத்தும் அழைப்பிலிருந்து உள்ள வேறுபாட்டைக் காக்கிறது.
- source_word: Σὺ εἶπας
  choice: நீயே சொல்லிவிட்டாய்
  rationale: மூலத்தின் சுருக்கமான, மறைமுக உறுதிப்படுத்தலைக் காக்கிறது; அதை நேரடியான ‘ஆம்’ என்று மிகத் தெளிவாக்கவில்லை.
theological_decisions:
- issue: இயேசுவின் பதிலான Σὺ εἶπας என்பதன் வலிமை
  choice: நீயே சொல்லிவிட்டாய்
  alternative: ஆம், நீதான்
  rationale: மூலவாக்கு மறைமுகமாக உறுதிப்படுத்தும் சொற்றொடர். நேரடியான ‘ஆம்’ என்பது அதன் உரையாடல் நுட்பத்தையும் உண்மையான மறைமுகத்தன்மையையும் நீக்கிவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; உரையாடல் இயல்பாகவும் மரியாதையுடனும் உள்ளது. ‘ரபீ’ என்ற வரலாற்றுப் பட்டமும், இயேசுவின் மறைமுகமான பதிலும் பாதுகாக்கப்பட்டுள்ளன.
