id: MAT.26.38
reference: Matthew 26:38
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τότε λέγει ⸀αὐτοῖς· Περίλυπός ἐστιν ἡ ψυχή μου ἕως θανάτου· μείνατε ὧδε καὶ γρηγορεῖτε μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/038.yaml
  text: Then he says to them[a], “My soul is deeply grieved, even to death[c][b]. Remain here and keep watch with me.”
translation:
  language: ta
  text: 'அப்போது அவர் அவர்களிடம் கூறினார்: “என் உள்ளம் மரணம் வருமளவுக்கு ஆழ்ந்த துயரத்தில் இருக்கிறது.[a][b] நீங்கள் இங்கே தங்கி, என்னோடு விழிப்புடன் இருங்கள்.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மிகவும் துயருற்றிருக்கிறது” அல்லது “துயரத்தால் சூழப்பட்டிருக்கிறது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “மரணத்தின் விளிம்புவரை” அல்லது “சாகுமளவுக்கு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “என்னோடு விழித்திருங்கள்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் தூங்காமல் இருப்பதையும் விழிப்பான கவனத்துடன் இருப்பதையும் குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: அடுத்த நிகழ்வை அறிமுகப்படுத்தும் காலத் தொடர்பை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: λέγει
  choice: கூறினார்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டாலும், தமிழ் கதைநடையில் இறந்தகால வடிவம் இயல்பாகவும் தெளிவாகவும் அமைகிறது.
- source_word: Περίλυπός
  choice: ஆழ்ந்த துயரத்தில்
  rationale: மிகக் கடுமையான துக்கத்தையும் மனவேதனையையும் இயல்பான, கண்ணியமான தமிழில் தெரிவிக்கிறது.
- source_word: ἡ ψυχή μου
  choice: என் உள்ளம்
  rationale: ψυχή என்ற வெளிப்படையான பெயர்ச்சொல்லை வெறும் ‘நான்’ என்று சுருக்காமல், இயேசுவின் ஆழ்ந்த அகத்துயரைக் காட்டுகிறது; ‘ஆத்துமா’ என்ற பழமையான அல்லது தொழில்நுட்பத் தொனியையும் தவிர்க்கிறது.
- source_word: ἕως θανάτου
  choice: மரணம் வருமளவுக்கு
  rationale: துயரத்தின் உச்சத் தீவிரத்தைத் தக்கவைத்து, தமிழில் இயல்பாக ஒலிக்கிறது; ‘மரணம் வரை’ என்ற காலப்பொருளுக்கு மட்டும் இதைச் சுருக்கவில்லை.
- source_word: μείνατε ὧδε
  choice: நீங்கள் இங்கே தங்கி
  rationale: அந்த இடத்திலேயே இருக்கும்படி கொடுக்கப்பட்ட கட்டளையை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: γρηγορεῖτε
  choice: விழிப்புடன் இருங்கள்
  rationale: விழித்திருப்பது, கவனமாகக் கண்காணிப்பது ஆகிய இரு நிழற்பொருள்களையும் உள்ளடக்குகிறது.
- source_word: μετ’ ἐμοῦ
  choice: என்னோடு
  rationale: உடனிருப்பதையும் பங்குகொள்வதையும் நேரடியாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: இயேசுவின் கூற்றில் ψυχή என்பதன் மொழிபெயர்ப்பு
  choice: என் உள்ளம்
  alternative: நான்; என் ஆத்துமா
  rationale: மூலத்தில் உள்ள பெயர்ச்சொல்லைத் தக்கவைத்து இயேசுவின் உண்மையான மனித அகத்துயரை வெளிப்படுத்துகிறது; அதேவேளையில் மனித இயல்பைப் பற்றிய ஒரு குறிப்பிட்ட கோட்பாட்டை மொழிபெயர்ப்புக்குள் திணிக்கவில்லை.
- issue: γρηγορεῖτε என்பதன் சூழல்சார் வலிமை
  choice: விழிப்புடன் இருங்கள்
  alternative: விழித்திருங்கள்
  rationale: இச்சொல் உடலளவில் தூங்காமல் இருப்பதையும் விழிப்பான கவனத்தையும் குறிக்கலாம். முதன்மை உரை பரந்த பொருளைத் தக்கவைக்கிறது; நேரடியான மாற்று அடிக்குறிப்பில் வழங்கப்படுகிறது.
- issue: ἕως θανάτου என்பதன் பொருள்
  choice: மரணம் வருமளவுக்கு
  alternative: மரணத்தின் விளிம்புவரை; மரணம் வரை
  rationale: இது துயரம் மரணத்தின் அளவை எட்டும் தீவிரத்தைச் சுட்டலாம்; வெறும் காலவரம்பாக மட்டும் தீர்மானிக்காமல் அந்தத் தீவிரத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகருக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆத்துமா’ என்பதற்குப் பதில் இயல்பான ‘உள்ளம்’ தேர்ந்தெடுக்கப்பட்டுள்ளது. கிரேக்க வரலாற்று நிகழ்காலம் தமிழ் கதைநடைக்கு இயல்பான இறந்தகாலமாக வழங்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறியீடுகளும் உரிய சொற்றொடர்களுக்குப் பின்னர் முதன்மை உரையில் இடம்பெற்றுள்ளன.
