source:
  edition: SBLGNT
  text: λέγω δὲ ⸀ὑμῖν, οὐ μὴ πίω ἀπ’ ἄρτι ἐκ τούτου τοῦ γενήματος τῆς ἀμπέλου ἕως τῆς ἡμέρας ἐκείνης ὅταν αὐτὸ πίνω μεθ’ ὑμῶν καινὸν ἐν τῇ βασιλείᾳ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/029.yaml
  text: But I tell you[a], from now on I will certainly not drink from this fruit of the vine until that day when I drink it new with you in the kingdom of my Father.
translation:
  language: ta
  text: 'ஆனால் நான் உங்களுக்குச் சொல்கிறேன்: இப்போதுமுதல், திராட்சைக்கொடியின் இந்தக் கனியிலிருந்து நான் நிச்சயமாகக் குடிக்கமாட்டேன்; என் தந்தையின் அரசாட்சியில் உங்களோடு இதைப் புதியதாகக்[a] குடிக்கும் அந்த நாள்வரை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மறுபடியும்.” கிரேக்கப் பெயரடை வகையிலோ பண்பிலோ உள்ள புதுமையைக் குறிக்கலாம்; வரவிருக்கும் அரசாட்சியில் இதை ஒரு புதிய முறையில் குடிப்பதையும் இச்சொற்றொடர் சுட்டக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: ஆனால் நான் உங்களுக்குச் சொல்கிறேன்
  rationale: δέ இங்கு மென்மையான மாறுபாட்டையோ உரையாடலின் திருப்பத்தையோ குறிக்கிறது; ‘ஆனால்’ அந்த மாற்றத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὐ μὴ πίω
  choice: நான் நிச்சயமாகக் குடிக்கமாட்டேன்
  rationale: οὐ μή உடன் வரும் இறந்தகாலத் துணைவினை எதிர்காலத்தைப் பற்றிய வலியுறுத்தப்பட்ட மறுப்பைக் காட்டுகிறது; ‘நிச்சயமாகக் ... மாட்டேன்’ அதன் வலிமையை மிகைப்படுத்தாமல் காக்கிறது.
- source_word: ἀπ’ ἄρτι
  choice: இப்போதுமுதல்
  rationale: பேசப்படும் இத்தருணத்திலிருந்து தொடங்கும் காலத்தைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: ἐκ τούτου τοῦ γενήματος τῆς ἀμπέλου
  choice: திராட்சைக்கொடியின் இந்தக் கனியிலிருந்து
  rationale: γένημα என்பது விளைபொருள் அல்லது கனி; கிரேக்கத்தில் ‘திராட்சரசம்’ என்று நேரடியாக இல்லாததால், மூலத்தின் உருவகச் சொல்லாட்சியை இது காக்கிறது.
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: அந்த நாள் வரும்வரை
  rationale: ἐκείνης குறிப்பிட்ட எதிர்கால நாளைச் சுட்டுகிறது; தமிழில் இயல்பான தொடருக்காக ‘வரும்’ என்ற பொருள் வெளிப்படையாக வழங்கப்பட்டுள்ளது.
- source_word: ὅταν αὐτὸ πίνω
  choice: இதைக் ... குடிக்கும்
  rationale: எதிர்காலத்தில் நிகழும் நேரத்தை ὅταν குறிக்கிறது; αὐτό முன்பு குறிப்பிடப்பட்ட திராட்சைக்கொடியின் கனியிலிருந்து வரும் பானத்தைக் குறிக்கிறது.
- source_word: καινὸν
  choice: புதியதாக
  rationale: καινός வகை அல்லது பண்பில் உள்ள புதுமையைக் குறிக்கலாம். ‘புதியதாக’ என்பது அந்தத் திறந்த பொருளைத் தக்கவைக்கிறது; ‘மறுபடியும்’ என்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: μεθ’ ὑμῶν
  choice: உங்களோடு
  rationale: உடனிருப்பையும் கூட்டுறவையும் எளிமையாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐν τῇ βασιλείᾳ τοῦ πατρός μου
  choice: என் தந்தையின் அரசாட்சியில்
  rationale: βασιλεία என்பதன் ஆட்சி மற்றும் ஆளுகைப் பரப்பு சார்ந்த பொருளை ‘அரசாட்சி’ வெளிப்படுத்துகிறது; ‘என் தந்தை’ என்ற உறவுச் சொல்லும் தெளிவாகப் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: கிண்ணத்தின் உள்ளடக்கத்தை நேரடியாக ‘திராட்சரசம்’ என்று மொழிபெயர்ப்பதா, மூல மொழியின் சொற்றொடரைத் தக்கவைப்பதா
  choice: ‘திராட்சைக்கொடியின் இந்தக் கனி’ என்ற சொற்றொடர் தக்கவைக்கப்பட்டது
  alternative: திராட்சரசம்
  rationale: கிரேக்க மூலம் οἶνος என்று சொல்லாமல் ‘திராட்சைக்கொடியின் கனி/விளைபொருள்’ என்கிறது. அதையே தக்கவைப்பது மூலமொழிக்கு முன்னுரிமை அளித்து, உரை கூறுவதைவிட அதிகமான சடங்கு அல்லது அடையாள விளக்கத்தைப் புகுத்துவதைத் தவிர்க்கிறது.
- issue: வரவிருக்கும் அரசாட்சியின் விருந்தில் καινὸν என்பதன் துல்லியமான நுட்பம்
  choice: முதன்மை உரையில் ‘புதியதாக’ என்று வைக்கப்பட்டது
  alternative: மறுபடியும்; ஒரு புதிய முறையில்
  rationale: இச்சொல் புதிதாகத் தயாரிக்கப்பட்டது, பண்பில் புதியது, அல்லது புதுப்பிக்கப்பட்ட முறையில் பங்கேற்பது ஆகிய நுட்பங்களைச் சுட்டக்கூடும்; வசனம் அவற்றில் ஒன்றைத் தெளிவாகத் தீர்மானிக்காததால் அந்தத் தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வலியுறுத்தப்பட்ட மறுப்பு, எதிர்கால ‘அந்த நாள்,’ மற்றும் ‘திராட்சைக்கொடியின் கனி’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளன.
