- from: அப்போது தலைமைக் குரு தன் ஆடைகளைக் கிழித்து[a], “இவன் தெய்வநிந்தனை செய்துவிட்டான்[b]! இனி நமக்குச் சாட்சிகள் எதற்கு? இதோ, இப்போது அந்தத் தெய்வநிந்தனையை நீங்களே கேட்டீர்கள்” என்றார்.
  to: அப்போது தலைமை ஆசாரியர் தம் ஆடைகளைக் கிழித்து[a], “இவன் தெய்வநிந்தனை செய்துவிட்டான்[b]! இனி நமக்குச் சாட்சிகள் எதற்கு? இதோ, இப்போது நீங்கள் அந்தத் தெய்வநிந்தனையைக் கேட்டீர்கள்” என்றார்.
