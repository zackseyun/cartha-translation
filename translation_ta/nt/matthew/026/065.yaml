id: MAT.26.65
reference: Matthew 26:65
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τότε ὁ ἀρχιερεὺς διέρρηξεν τὰ ἱμάτια αὐτοῦ ⸀λέγων· Ἐβλασφήμησεν· τί ἔτι χρείαν ἔχομεν μαρτύρων; ἴδε νῦν ἠκούσατε τὴν ⸀βλασφημίαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/065.yaml
  text: Then the high priest tore his garments[a], saying, “He has blasphemed! What further need do we have of witnesses? See[b], now you have heard the blasphemy.”
translation:
  language: ta
  text: அப்போது தலைமை ஆசாரியர் தம் ஆடைகளைக் கிழித்து[a], “இவன் தெய்வநிந்தனை செய்துவிட்டான்[b]! இனி நமக்குச் சாட்சிகள் எதற்கு? இதோ, இப்போது நீங்கள் அந்தத் தெய்வநிந்தனையைக் கேட்டீர்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஆடைகளைக் கிழிப்பது அதிர்ச்சி, துக்கம் அல்லது கடும் சினத்தைப் பொதுவில் வெளிப்படுத்தும் அடையாளமாக இருந்தது.
    reason: cultural_note
  - marker: b
    text: ‘தெய்வநிந்தனை’ என்பது இறைவனை இழிவுபடுத்தி அல்லது அவமதித்துப் பேசுவதைக் குறிக்கிறது.
    reason: lexical_clarification
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: கதை நிகழ்வின் அடுத்த கட்டத்தை இயல்பாக அறிமுகப்படுத்தும் கால இணைப்பாகத் தேர்ந்தெடுக்கப்பட்டது.
- source_word: ὁ ἀρχιερεὺς
  choice: தலைமைக் குரு
  rationale: யூத மதத் தலைமையின் ஒரே பதவியாளரைக் குறிக்கும் வழக்கமான, தெளிவான தமிழ்ச் சொல்.
- source_word: διέρρηξεν τὰ ἱμάτια αὐτοῦ
  choice: தன் ஆடைகளைக் கிழித்து
  rationale: வினையின் வலிமையையும் ஆடைகள் என்ற பன்மையையும் காக்கிறது; குறிப்பிட்ட சடங்கு உடை என்று மூலத்தில் இல்லாத விவரத்தைச் சேர்க்கவில்லை.
- source_word: Ἐβλασφήμησεν
  choice: இவன் தெய்வநிந்தனை செய்துவிட்டான்
  rationale: உடனடியாக முன்வைக்கப்படும் மத-சட்ட குற்றச்சாட்டின் வலிமையைத் தக்கவைக்கிறது. தமிழில் எழுவாய் வெளிப்படையாகத் தேவைப்படுவதால் ‘இவன்’ சேர்க்கப்பட்டது.
- source_word: τί ἔτι χρείαν ἔχομεν μαρτύρων;
  choice: இனி நமக்குச் சாட்சிகள் எதற்கு?
  rationale: ἔτι என்பதன் ‘இனி/மேலும்’ பொருளையும், χρείαν ἔχειν என்ற சொற்றொடரின் கேள்வி வலிமையையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἴδε νῦν
  choice: இதோ, இப்போது
  rationale: கவனத்தை ஈர்க்கும் ἴδε என்பதையும் உடனடித் தன்மையை வலியுறுத்தும் νῦν என்பதையும் தனித்தனியாகத் தக்கவைக்கிறது.
- source_word: ἠκούσατε τὴν βλασφημίαν
  choice: அந்தத் தெய்வநிந்தனையை நீங்களே கேட்டீர்கள்
  rationale: கேட்டவர்களை வலியுறுத்த ‘நீங்களே’ பயன்படுத்தப்பட்டு, திட்டவட்டமான τὴν βλασφημίαν மத-சட்டக் குற்றச்சாட்டாகவே வைக்கப்படுகிறது.
theological_decisions:
- issue: βλασφημέω / βλασφημία என்ற குற்றச்சாட்டை மொழிபெயர்த்தல்
  choice: ‘தெய்வநிந்தனை செய்துவிட்டான்’ / ‘அந்தத் தெய்வநிந்தனை’
  alternative: ‘இறைவனைப் பழித்துப் பேசிவிட்டான்’ / ‘இறைவனைப் பழித்துப் பேசியது’
  rationale: இது தலைமைக் குருவின் குற்றச்சாட்டு என்பதை நேரடி உரை தெளிவுபடுத்துகிறது; உரையாளர் அந்தத் தீர்ப்பை ஏற்றுக்கொள்கிறார் என்று காட்டாமல், அதன் வரலாற்று மத-சட்ட வலிமையை ‘தெய்வநிந்தனை’ தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. ‘தெய்வநிந்தனை’ என்ற மத-சட்டச் சொல் மூலத்தின் குற்றச்சாட்டு வலிமைக்காக வைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது; எந்தச் சமயப் பிரிவின் தனிப்பட்ட விளக்கமும் சேர்க்கப்படவில்லை.
