  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. முதல் நூற்றாண்டு உணவுமுறையைக் காட்ட ‘பந்தியில் சாய்ந்து அமர்ந்தார்’ என மொழிபெயர்க்கப்பட்டுள்ளது; வழக்கமான ‘உட்கார்ந்தார்’ என்பது மூலத்தின் உடல் நிலையை மறைத்துவிடும். அடிக்குறிப்புக் குறி அது சார்ந்த வாசக வேறுபாட்டின் இடத்திலேயே வைக்கப்பட்டுள்ளது.
