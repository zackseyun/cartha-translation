translation:
  language: ta
  text: மாலை வந்தபோது, அவர் பன்னிரண்டு சீடர்களுடன்[a] உணவு மேசையில் சாய்ந்திருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் ‘பன்னிரண்டு சீடர்களுடன்’ என்பதற்குப் பதிலாக ‘பன்னிருவருடன்’ என்று மட்டும் உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: மாலையானபோது
  rationale: இந்தப் பிறப்புவேற்றுமைத் தனிநிலைத் தொடர் நிகழ்வின் காலச் சூழலைக் குறிக்கிறது. ‘மாலையானபோது’ என்பது அதன் காலப் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἀνέκειτο
  choice: பந்தியில் சாய்ந்து அமர்ந்தார்
  rationale: இச்சொல் உணவின்போது சாய்ந்த நிலையில் அமர்ந்திருப்பதைக் குறிக்கிறது; வெறுமனே உட்கார்ந்தார் அல்லது படுத்திருந்தார் என்ற பொருள் அல்ல. ‘பந்தியில்’ என்பது கிரேக்கத்தில் தனிச்சொல்லாக இல்லாவிட்டாலும், வினைச்சொல்லின் விருந்து உணவு சார்ந்த இடியோமப் பொருளைத் தமிழில் தெளிவாக்குகிறது.
- source_word: μετὰ
  choice: உடன்
  rationale: பிறப்புவேற்றுமையுடன் வரும் μετά என்பதன் நேரடியான பொருள் ‘உடன்’; தமிழில் இணைந்த ‘சீடர்களுடன்’ இயல்பாக உள்ளது.
- source_word: τῶν δώδεκα μαθητῶν
  choice: பன்னிரண்டு சீடர்கள்
  rationale: SBLGNT முதன்மைப் பாடத்தில் μαθητῶν உள்ளது; ஆகவே அதை விடாமல் மொழிபெயர்க்கப்படுகிறது. μαθητής என்பதற்கு நற்செய்தி நூல்களின் சூழலில் நிலைபெற்ற, துல்லியமான சொல் ‘சீடர்’.
theological_decisions: []
