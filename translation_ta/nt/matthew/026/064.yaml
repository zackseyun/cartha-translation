  source_fidelity: 'The verse''s structure and major referents are preserved: Jesus addresses the high priest in the singular, then the wider group in the plural; the future seeing governs both enthronement and coming; and the Danielic/Psalmic allusions are retained. However, “வல்லமையானவர்” means “the powerful one,” whereas τῆς δυνάμεως is literally and reverentially “the Power.” “வல்லமையுடையவர்” is a closer Tamil reverential circumlocution for the personal referent without explicitly substituting “God.”'
