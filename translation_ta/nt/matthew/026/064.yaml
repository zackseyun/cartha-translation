source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Σὺ εἶπας· πλὴν λέγω ὑμῖν, ἀπ’ ἄρτι ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου καθήμενον ἐκ δεξιῶν τῆς δυνάμεως καὶ ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/064.yaml
  text: Jesus said to him[a], “You have said so. But I tell you[c][b], from now on you will see the Son of Man seated at the right hand of Power and coming on the clouds of heaven.”
translation:
  language: ta
  text: இயேசு அவரிடம், “நீர் சொன்னதுதான்.[a] ஆனாலும் நான் உங்களுக்குச் சொல்கிறேன்:[c] இனிமேல் மானிடமகன் வல்லமையுடையவரின்[b] வலப்பக்கத்தில் அமர்ந்திருப்பதையும் வானத்தின் மேகங்களின் மேல் வருவதையும் நீங்கள் காண்பீர்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதை நீரே சொன்னீர்.” கிரேக்கச் சொற்றொடர் உறுதிப்படுத்தும் பொருளுடைய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: “வல்லமையுடையவர்” என்பது கடவுளை மரியாதையுடன் மறைமுகமாகக் குறிப்பிடும் முறை.
    reason: cultural_note
  - marker: c
    text: இது தானியேல் 7:13 மற்றும் சங்கீதம் 110:1 ஆகியவற்றை நினைவூட்டுகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: Σὺ εἶπας
  choice: நீரே அப்படிச் சொன்னீர்
  rationale: இது உறுதிப்படுத்தும் இடியத்தைத் தமிழில் இயல்பாகத் தருகிறது; வெறும் ‘ஆம்’ என்று மூலத்தின் தனித்துவமான சொற்றொடரை அழித்துவிடாமலும், தவிர்க்கும் பதிலாக மாற்றாமலும் உள்ளது.
- source_word: πλὴν
  choice: ஆனாலும்
  rationale: உடனடியான பதிலிலிருந்து தொடர்ந்து வரும் ஆணித்தரமான அறிவிப்புக்கான வலுவான மாறுதலை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: ἀπ’ ἄρτι
  choice: இனிமேல்
  rationale: இப்புள்ளியிலிருந்து தொடங்கும் காலநிலையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது; உடனடி ஒரே தருணத்திற்குள் பொருளைக் குறுக்கவில்லை.
- source_word: ὄψεσθε
  choice: நீங்கள் காண்பீர்கள்
  rationale: ὁράω வினையின் எதிர்கால வடிவத்தை நேரடியாகவும் இயல்பாகவும் தருகிறது; பன்மை ‘நீங்கள்’ உயர்நீதிமன்றச் சூழலில் இயேசு பலரிடம் உரைப்பதைப் பாதுகாக்கிறது.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: மானிடமகன்
  rationale: தானியேல் நூலுடனான ஒலிப்பையும் இயேசுவின் நிலைபெற்ற சுயக்குறிப்பையும் பாதுகாக்கும் கண்ணியமான தமிழ் வேதாகமச் சொல்.
- source_word: καθήμενον
  choice: அமர்ந்திருப்பதை
  rationale: தொடர்ச்சியான நிலையை வெளிப்படுத்துவதோடு, சங்கீதம் 110:1-இன் அரியணை மற்றும் உயர்வு சார்ந்த பின்னணியையும் ஏற்கும் இயல்பான வடிவம்.
- source_word: ἐκ δεξιῶν
  choice: வலப்பக்கத்தில்
  rationale: மரியாதை, அதிகாரம், அண்மை ஆகியவற்றைக் குறிக்கும் மூல இடியத்தைத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: τῆς δυνάμεως
  choice: வல்லமையானவரின்
  rationale: கிரேக்கத்தில் கடவுளைக் குறிக்கும் மரியாதைமிகு மறைமுகக் குறிப்பை நேரடியாக ‘கடவுள்’ என்று விரிவாக்காமல், தமிழில் நபரைக் குறிக்கும் இயல்பான வடிவில் பாதுகாக்கிறது.
- source_word: ἐρχόμενον
  choice: வருவதை
  rationale: தானியேல் 7-இன் வருகை சார்ந்த ஒலிப்பைப் பாதுகாக்கும் நேரடியான மொழிபெயர்ப்பு.
- source_word: ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: வானத்தின் மேகங்கள்மேல்
  rationale: ἐπί என்பதன் இடவியல் படிமத்தையும் தானியேல் 7:13-இன் மொழிசார் ஒலிப்பையும் பாதுகாக்கிறது.
theological_decisions:
- issue: தலைமை ஆசாரியனுக்கான Σὺ εἶπας என்ற பதிலின் வலிமை
  choice: ‘நீரே அப்படிச் சொன்னீர்’ என்ற உறுதிப்படுத்தும், ஆனால் மூலச் சொற்றொடரைப் பாதுகாக்கும் பதில்
  alternative: ‘ஆம்’ என்ற வெளிப்படையான பதில்; அல்லது உறுதிப்படுத்தாத தவிர்க்கும் பதில்
  rationale: சொற்றொடர் சூழலில் உறுதிப்படுத்துகிறது. இருப்பினும் அதை வெறும் ‘ஆம்’ என்று மாற்றுவது இயேசு பயன்படுத்திய சொல் வடிவத்தை இழக்கச் செய்யும்; தவிர்க்கும் பதிலாக வாசிப்பது சூழலையும் பின்னர் ஏற்பட்ட எதிர்வினையையும் குறைத்து மதிப்பிடும்.
- issue: τῆς δυνάμεως என்பதன் குறிப்பு
  choice: கடவுளைக் குறிக்கும் மரியாதைமிகு மறைமுகச் சொல்லாக ‘வல்லமையானவர்’
  alternative: ‘கடவுள்’; அல்லது உருவகமற்ற ‘வல்லமை’
  rationale: மூலம் கடவுளை நேரடியாகப் பெயரிடாமல் மரியாதையுடன் குறிக்கிறது. ‘கடவுள்’ என்பது குறிப்பை விளக்கிவிடும்; தமிழில் ‘வல்லமையின் வலப்பக்கம்’ இயல்பற்றதும் நபர்சார் குறிப்பை மறைப்பதுமாக இருப்பதால் ‘வல்லமையானவர்’ தேர்ந்தெடுக்கப்பட்டது.
- issue: ‘நீங்கள் காண்பீர்கள்’ என்பதில் உயர்த்தப்படுதலும் மேகங்கள்மேல் வருதலும் கொண்ட காலவியல் தொடர்பு
  choice: அமர்ந்திருத்தலும் வருதலும் ஒரே அறிவிப்பில் இணைந்திருப்பதைப் பாதுகாத்தல்
  alternative: முழுவதையும் உடனடி நிறைவேற்றமாக்குதல்; அல்லது முழுவதையும் இறுதிக்கால இரண்டாம் வருகைக்கு மட்டும் கட்டுப்படுத்துதல்
  rationale: கிரேக்கம் இரு பங்கேற்பு வினைகளையும் ‘காண்பீர்கள்’ என்பதன் ஒருங்கிணைந்த பொருளாக வைக்கிறது. விவாதத்திற்குரிய காலவரிசையை மொழிபெயர்ப்பு தீர்மானிக்காமல், உயர்வு மற்றும் எதிர்கால வெளிப்பாடு சார்ந்த பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான நிலையான தமிழ் பயன்படுத்தப்பட்டுள்ளது. தலைமை ஆசாரியனிடம் பேசும் ஒருமை மரியாதைக்கு ‘நீர்’ வடிவமும், பின்னர் மன்றத்தாரை உள்ளடக்கும் பன்மைக்கு ‘நீங்கள்’ வடிவமும் வேறுபடுத்தப்பட்டுள்ளன. ‘மானிடமகன்’ என்ற நிலைபெற்ற தலைப்பு மற்றும் தானியேல்–சங்கீத ஒலிப்புகள் காக்கப்பட்டுள்ளன; சர்ச்சைக்குரிய காலவியல் பொருள் தீர்த்துவைக்கப்படவில்லை.
