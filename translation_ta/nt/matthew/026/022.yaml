id: MAT.26.22
reference: Matthew 26:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ λυπούμενοι σφόδρα ἤρξαντο λέγειν αὐτῷ ⸂εἷς ἕκαστος⸃· Μήτι ἐγώ εἰμι, κύριε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/022.yaml
  text: And being deeply grieved[a], they began to say to him one by one, “Surely not I[b], Lord?”
translation:
  language: ta
  text: அவர்கள் மிகவும் துயரமடைந்து, அவரிடம் ஒருவர் பின் ஒருவராக[a], “ஆண்டவரே, நிச்சயமாக அது நான் அல்லவே[b]?” என்று சொல்லத் தொடங்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு விதமாக: “ஒவ்வொருவராக” அல்லது “ஒருவருக்குப் பின் ஒருவராக.”'
    reason: lexical_alternative
  - marker: b
    text: 'கிரேக்கத்தில் இக்கேள்வி ‘இல்லை’ என்ற பதிலை எதிர்பார்க்கும் வகையில் அமைந்துள்ளது: “நிச்சயமாக அது நான் அல்லவே?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπούμενοι σφόδρα
  choice: மிகவும் துயரமடைந்து
  rationale: நிகழ்ந்துகொண்டிருந்த ஆழ்ந்த துயரத்தையும் σφόδρα தரும் தீவிரத்தையும் இயல்பான நவீனத் தமிழில் ஒருங்கிணைக்கிறது.
- source_word: ἤρξαντο λέγειν
  choice: சொல்லத் தொடங்கினார்கள்
  rationale: செயல் தொடங்கியதைக் குறிக்கும் கிரேக்கக் கட்டமைப்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: αὐτῷ
  choice: அவரிடம்
  rationale: இயேசுவை நோக்கிச் சொன்னதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: εἷς ἕκαστος
  choice: ஒருவர் பின் ஒருவராக
  rationale: ஒவ்வொருவரும் தனித்தனியாகப் பதிலளித்த விநியோகப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Μήτι ἐγώ εἰμι
  choice: நிச்சயமாக அது நான் அல்லவே?
  rationale: μήτι எதிர்மறையான பதிலை எதிர்பார்க்கும் கேள்வி என்பதையும் ἐγώ என்பதிலுள்ள சுயவலியுறுத்தலையும் தமிழில் வெளிப்படுத்துகிறது.
- source_word: κύριε
  choice: ஆண்டவரே
  rationale: இயேசுவை நோக்கிய அழைப்பில் κύριε என்பதன் தலைப்புச் சிறப்பையும் கதையியல்-இறையியல் நிறையையும் காக்கிறது.
theological_decisions:
- issue: இயேசுவை நோக்கிய κύριε என்ற அழைப்பின் மொழிபெயர்ப்பு
  choice: ஆண்டவரே
  alternative: ஐயா / தலைவரே
  rationale: இந்தச் சூழலில் வெறும் மரியாதை அழைப்பாகச் சுருக்காமல், மத்தேயு நூலில் இயேசுவுக்கான இச்சொல்லின் கதையியல் மற்றும் இறையியல் நிறையைப் பாதுகாக்கிறது.
- issue: μήτι கேள்வியின் எதிர்பார்ப்பு
  choice: நிச்சயமாக அது நான் அல்லவே?
  alternative: அது நானா?
  rationale: நடுநிலைக் கேள்வியாக மாற்றாமல், ‘இல்லை’ என்ற பதிலை எதிர்பார்க்கும் மூலமொழியின் நுணுக்கத்தைப் பாதுகாக்கிறது; அதேவேளை சீடர்களின் கலக்கத்தையும் மறைக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் வகையிலும் துயரமும் பதற்றமும் நிறைந்த நிகழ்ச்சியின் கண்ணியத்தைப் பேணும் வகையிலும் அமைக்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் [a] குறி ‘grieved’ என்பதற்குப் பின் இருந்தாலும், அதன் அடிக்குறிப்பு εἷς ἕκαστος என்பதைக் குறிப்பதால் தமிழில் உரிய சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
