revisions:
- from: அப்போது பன்னிருவரில் ஒருவனும் இஸ்கரியோத் யூதாஸ் என்று அழைக்கப்பட்டவனுமான அவன், முதன்மைக் குருமார்களிடம் சென்றான்.
  to: அப்போது, இஸ்கரியோத் யூதாஸ் என்று அழைக்கப்பட்ட பன்னிருவரில் ஒருவன் தலைமை ஆசாரியர்களிடம் சென்றான்.
  rationale: 'The revision retains every source element while placing the identifying expression naturally before the partitive subject. It removes the added redundant pronoun and uses a clearer term for the chief priests. No footnote is needed: the Tamil wording retains the same non-capitalization-related ambiguity as the Greek concerning “the twelve.”'
  reviewer_model: gpt-5.6-terra
