  text: Τότε πορευθεὶς εἷς τῶν δώδεκα, ὁ λεγόμενος Ἰούδας Ἰσκαριώτης, πρὸς τοὺς ἀρχιερεῖς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/014.yaml
  text: Then one of the twelve[a], the one called Judas Iscariot, went to the chief priests,
translation:
  language: ta
  text: அப்போது, இஸ்கரியோத் யூதாஸ் என்று அழைக்கப்பட்ட பன்னிருவரில் ஒருவன் தலைமை ஆசாரியர்களிடம் சென்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: அப்போது
  rationale: அடுத்த நிகழ்வை அறிமுகப்படுத்தும் காலச் சுட்டியாகவும் கதை ஓட்டத்தை இயல்பாகத் தொடர்வதாகவும் உள்ளது.
- source_word: πορευθεὶς
  choice: சென்றான்
  rationale: இறந்தகாலப் பெயரெச்ச வடிவத்தின் இயக்கப் பொருளைத் தமிழில் இயல்பான முற்றுவினையாக வழங்குகிறது.
- source_word: εἷς τῶν δώδεκα
  choice: பன்னிருவரில் ஒருவன்
  rationale: பகுதிப்பொருள் அமைப்பைத் துல்லியமாகக் காட்டுகிறது; எண்ணைக் குழுப் பெயராகத் தனியே சிறப்பிக்காமல் கிரேக்கத்தின் இயல்பான தெளிவின்மையைப் பேணுகிறது.
- source_word: ὁ λεγόμενος
  choice: என்று அழைக்கப்பட்டவன்
  rationale: யூதாசை அடையாளப்படுத்தும் பெயரெச்சத் தொடரின் பொருளையும் வலியுறுத்தலையும் காக்கிறது.
- source_word: Ἰούδας Ἰσκαριώτης
  choice: இஸ்கரியோத் யூதாஸ்
  rationale: தமிழ் வேதாகமப் பெயர் மரபுக்கும் இயல்பான தமிழ் பெயரமைப்புக்கும் ஏற்ற ஒலிபெயர்ப்பு.
- source_word: πρὸς τοὺς ἀρχιερεῖς
  choice: முதன்மைக் குருமார்களிடம்
  rationale: πρός உடன் வரும் நோக்கிச் செல்லும் இயக்கத்தையும், ἀρχιερεῖς குறிக்கும் மூத்த ஆசாரிய அதிகாரிகளையும் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: τῶν δώδεκα என்பதைக் குழுப் பெயராக வழங்குவதா
  choice: பன்னிருவரில் ஒருவன்
  alternative: ‘பன்னிருவர்’ குழுவில் ஒருவன்
  rationale: கிரேக்கத்தில் பெரிய/சிறிய எழுத்து வேறுபாட்டால் குழுப் பெயர் குறிக்கப்படவில்லை. தமிழில் இயல்பாகவும் விளக்கச் சேர்க்கையின்றியும் அடையாளம் தெளிவாகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடையில் அமைக்கப்பட்டது. மூலத்தின் appositional அமைப்பைப் பேணும் பொருட்டு வாக்கியம் சற்றே முறையானதாக உள்ளது.
