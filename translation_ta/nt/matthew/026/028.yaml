revisions:
- from: ஏனெனில், இது என் இரத்தம்—உடன்படிக்கையின் இரத்தம்[a]; இது பாவங்கள் மன்னிக்கப்படுவதற்காகப் பலருக்காக[b] சிந்தப்படுகிறது.
  to: ஏனெனில், இது உடன்படிக்கைக்குரிய என் இரத்தம்[a]; இது பாவங்கள் மன்னிக்கப்படுவதற்காகப் பலருக்காக[b] சிந்தப்படுகிறது.
  rationale: The revision replaces an awkward, repetitive apposition with a natural Tamil genitive-equivalent construction, while preserving the base text’s omission of ‘new,’ the sacrificial/covenantal imagery, the unrestricted wording ‘many,’ and the present passive sense of ‘being poured out.’ Footnote anchors remain attached to the relevant expressions.
