id: MAT.26.28
reference: Matthew 26:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τοῦτο γάρ ἐστιν τὸ αἷμά ⸀μου ⸀τῆς διαθήκης τὸ περὶ πολλῶν ἐκχυννόμενον εἰς ἄφεσιν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/028.yaml
  text: For this is my blood of the covenant[b][a], which is poured out for many for the forgiveness of sins.
translation:
  language: ta
  text: ஏனெனில், இது உடன்படிக்கைக்குரிய என் இரத்தம்[a]; இது பாவங்கள் மன்னிக்கப்படுவதற்காகப் பலருக்காக[b] சிந்தப்படுகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், ‘என் புதிய உடன்படிக்கையின் இரத்தம்’ என்று உள்ளது.
    reason: textual_variant
  - marker: b
    text: அல்லது, ‘பலரின் சார்பாக.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: இது
  rationale: கிரேக்கத்தில் ‘இது’ என்ற சுட்டுப்பெயர் மட்டுமே உள்ளது; ‘இந்தக் கிண்ணம்’ என்று சூழலிலிருந்து சொல்லைச் சேர்க்கவில்லை.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய குடிக்கும் கட்டளைக்கான விளக்கத்தை அறிமுகப்படுத்தும் γάρ என்பதன் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὸ αἷμά μου τῆς διαθήκης
  choice: என் இரத்தம்—உடன்படிக்கையின் இரத்தம்
  rationale: ‘இரத்தம்’ மற்றும் ‘உடன்படிக்கை’ ஆகிய இரண்டின் பலியையும் உடன்படிக்கையையும் சார்ந்த ஒலிப்புகளைப் பாதுகாக்கிறது. ‘என் உடன்படிக்கையின் இரத்தம்’ என்பது உடன்படிக்கையே இயேசுவுக்குரியது என்ற தேவையற்ற பொருள் மயக்கத்தைத் தரக்கூடும் என்பதால் விளக்கமான இணைநிலை அமைப்பு பயன்படுத்தப்பட்டது.
- source_word: περὶ πολλῶν
  choice: பலருக்காக
  rationale: இந்தப் பலிசார் சூழலில் பிறருக்கான நன்மை அல்லது அவர்களுக்குப் பதிலான செயல் என்ற பொருளை இயல்பாகத் தருகிறது; πολλῶν என்பதை ‘அனைவருக்காக’ என விரிவுபடுத்தவில்லை.
- source_word: ἐκχυννόμενον
  choice: சிந்தப்படுகிறது
  rationale: இரத்தத்தைச் சுட்டும் நிகழ்காலச் செயப்பாட்டு வினையெச்சத்தின் பொருளைப் பாதுகாத்து, தமிழில் இயல்பான வாக்கியமாக அளிக்கிறது.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: பாவங்கள் மன்னிக்கப்படுவதற்காக
  rationale: பாவ மன்னிப்பை நோக்கம் அல்லது விளைவாகத் தெளிவாகக் காட்டும், சாதாரண வாசகர்களுக்குப் புரியும் நவீன தமிழ்.
theological_decisions:
- issue: ‘உடன்படிக்கை’ என்பதுடன் ‘புதிய’ என்பதைச் சேர்ப்பதா
  choice: உடன்படிக்கையின் இரத்தம்
  alternative: புதிய உடன்படிக்கையின் இரத்தம்
  rationale: வழங்கப்பட்ட SBLGNT மூலவாசகத்தில் καινῆς (‘புதிய’) இல்லை. ஆகவே அது முதன்மை உரையில் சேர்க்கப்படாமல், கையெழுத்துப் பிரதிகளின் வேறுபாடாக அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ‘பலருக்காக’ என்ற பாவநிவாரண மொழியின் எல்லை
  choice: பலருக்காக
  alternative: அனைவருக்காக
  rationale: மூலத்தில் πολλῶν (‘பலர்’) என்பதே உள்ளது. பாவநிவாரணத்தின் எல்லையைப் பற்றிய விரிவான இறையியல் விவாதத்தை இந்த வசனத்துக்குள் தீர்மானிக்காமல், மூலச்சொல் அப்படியே பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உடன்படிக்கையின் என் இரத்தம்’ என்ற இயல்பற்ற நேரடி சொல்லடுக்கை தவிர்க்க, பொருள் உறவைத் தெளிவாக்கும் இணைநிலை அமைப்பு பயன்படுத்தப்பட்டது; மூலத்தின் பலி மற்றும் உடன்படிக்கைச் சுமை பாதுகாக்கப்பட்டுள்ளது.
