id: MAT.26.18
reference: Matthew 26:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὑπάγετε εἰς τὴν πόλιν πρὸς τὸν δεῖνα καὶ εἴπατε αὐτῷ· Ὁ διδάσκαλος λέγει· Ὁ καιρός μου ἐγγύς ἐστιν· πρὸς σὲ ποιῶ τὸ πάσχα μετὰ τῶν μαθητῶν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/018.yaml
  text: He said[a], “Go into the city to a certain man and tell him, ‘The Teacher says, “My time is near[c][b]. I am keeping the Passover with you with my disciples.”’”
translation:
  language: ta
  text: 'அவர், “நகரத்துக்குள் போய், குறிப்பிட்ட ஒருவரிடம்[a], ‘ஆசிரியர் கூறுவது இதுதான்: “என் காலம் அருகில் உள்ளது. உன்னிடம்[b] என் சீடர்களோடு பஸ்காவைக் கடைப்பிடிக்கிறேன்[c]” என்று சொல்லுங்கள்’” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இன்னாரிடம்.” கிரேக்கச் சொல் பெயர் குறிப்பிடப்படாத, ஆனால் குறிப்பிட்ட ஒரு நபரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “உன்னிடம்” என்பது இச்சூழலில் “உன் இடத்தில்” அல்லது “உன் வீட்டில்” என்ற பொருளைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “பஸ்காவைக் கொண்டாடுகிறேன்” அல்லது “பஸ்காவை அனுசரிக்கிறேன்.” கிரேக்க மரபுத்தொடரின் நேரடிப் பொருள் “பஸ்காவைச் செய்கிறேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑπάγετε
  choice: போய்
  rationale: இயக்கத்தைக் குறிக்கும் பன்மை ஏவல்; தமிழில் அடுத்த ஏவலுடன் இயல்பாக இணைகிறது.
- source_word: πρὸς τὸν δεῖνα
  choice: குறிப்பிட்ட ஒருவரிடம்
  rationale: பெயர் சொல்லப்படாதபோதிலும் ஒரு குறிப்பிட்ட நபரையே δεῖνα சுட்டுகிறது; மிகப் பேச்சுவழக்கான ‘இன்னாரிடம்’ என்பதைக் காட்டிலும் இவ்வடிவம் தெளிவாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: Ὁ διδάσκαλος
  choice: போதகர்
  rationale: διδάσκαλος என்பதன் கற்பிப்பவர் என்ற பொருளையும் இங்கு இயேசு தம்மைக் குறித்துப் பயன்படுத்தும் அடைமொழித் தன்மையையும் தருகிறது.
- source_word: Ὁ καιρός μου ἐγγύς ἐστιν
  choice: எனக்குரிய காலம் நெருங்கிவிட்டது
  rationale: καιρός குறிக்கும் முக்கியமான அல்லது உரிய காலத்தைத் தருகிறது; அது மரணத்தையா, உணவையா, பணியின் நிறைவையா குறிக்கிறது என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- source_word: πρὸς σὲ
  choice: உன்னிடம்
  rationale: மூலத்தின் ‘உன்னிடம்/உன்னோடு’ என்ற சொல்லமைப்பைத் தக்கவைத்து, வெளிப்படையாக இல்லாத ‘உன் வீட்டில்’ என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: ποιῶ τὸ πάσχα
  choice: பஸ்காவைக் கடைப்பிடிக்கிறேன்
  rationale: ποιέω + πάσχα என்ற மரபுத்தொடர் பஸ்காவை அனுசரித்தல் அல்லது கொண்டாடுதல் என்று பொருள்படும்; ‘கடைப்பிடிக்கிறேன்’ என்பது மத அனுசரிப்பை இயல்பாகக் காட்டுகிறது.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: என் சீடர்களோடு
  rationale: μαθηταί என்பதற்கான நிலையான நற்செய்தி நூல் சொல் ‘சீடர்கள்’; உறவையும் பின்பற்றுதலையும் காக்கிறது.
theological_decisions:
- issue: இயேசுவின் καιρός எதைக் குறிக்கிறது
  choice: எனக்குரிய காலம் நெருங்கிவிட்டது
  alternative: எனக்கு நியமிக்கப்பட்ட காலம் நெருங்கிவிட்டது; என் வேளை நெருங்கிவிட்டது
  rationale: இவ்வசனம் காலத்தின் நெருக்கத்தைச் சொல்கிறது; ஆனால் அது இயேசுவின் மரணம், பஸ்கா உணவு, அல்லது அவரது பணியின் விரிவான நிறைவு ஆகியவற்றில் எதை மட்டும் குறிக்கிறது என்று வரையறுக்கவில்லை. அந்தத் திறந்த பொருளை மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. மேற்கோள்களின் அடுக்கைத் தெளிவாக வைத்துள்ளோம்; மூலத்தில் இல்லாத ‘வீடு’ என்பதை முதன்மை உரையில் வெளிப்படையாக்காமல் அடிக்குறிப்பில் விளக்கியுள்ளோம்.
