  source_fidelity: மூலக் கிரேக்கத்தின் விளக்கத் தொடர்பு (γάρ), ஏழைகளின் தொடர்ச்சியான உடனிருப்பு, மற்றும் இயேசுவின் வரையறுக்கப்பட்ட கால உடனிருப்பு ஆகியவை துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. இரண்டாம் கூறில் கிரேக்கத்தின் நேரடிச் செயப்படுபொருளான ‘என்னை’ தமிழின் இயல்பான ‘நான் ... இருப்பதில்லை’ அமைப்பாக மாற்றியிருப்பது பொருளை மாற்றுவதில்லை.
  naturalness: ‘ஏனெனில் ...; ஆனால் ...’ என்ற இணைப்பு, ‘உங்களுடன் இருக்கிறார்கள்,’ ‘உங்களுடன் இருப்பதில்லை’ ஆகிய சொற்றொடர்கள் நவீன தரத் தமிழில் தெளிவாகவும் கண்ணியமான வேதாகம நடையிலும் உள்ளன. இரு ‘எப்போதும்’ பயன்பாடுகளும் மூலத்தின் வலியுறுத்தலையும் மாறுபாட்டையும் காக்கின்றன.
  terminology: ‘ஏழைகள்’ என்பது τοὺς πτωχούς என்பதற்கான இயல்பான, பொதுக்குழுவைக் குறிக்கும் தமிழ் வடிவம். அடிக்குறிப்பில் உள்ள ‘ஏழை மக்கள்’ ஏற்றுக்கொள்ளத்தக்க சொற்பொருள் மாற்றாகும். எந்தப் பிரிவுசார் இறையியல் விளக்கமும் உரையில் சேர்க்கப்படவில்லை.
