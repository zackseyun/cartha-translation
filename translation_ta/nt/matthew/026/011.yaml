id: MAT.26.11
reference: Matthew 26:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πάντοτε γὰρ τοὺς πτωχοὺς ἔχετε μεθ’ ἑαυτῶν, ἐμὲ δὲ οὐ πάντοτε ἔχετε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/011.yaml
  text: For you always have the poor with you[a], but you do not always have me.
translation:
  language: ta
  text: ஏனெனில், ஏழைகள்[a] எப்போதும் உங்களுடன் இருக்கிறார்கள்; ஆனால் நான் எப்போதும் உங்களுடன் இருப்பதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏழை மக்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: எப்போதும்
  rationale: தொடர்ந்து கிடைக்கும் இருப்பைக் குறிக்கும் இந்த வினையடை இரு இடங்களிலும் மீண்டும் வருவதால், அதன் மீளுருவாக்கத்தையும் கால வேறுபாட்டையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: τοὺς πτωχοὺς
  choice: ஏழைகள்
  rationale: ஏழ்மை நிலையில் உள்ள மக்களை ஒரு பொதுக் குழுவாகக் குறிக்கும் பன்மைப் பெயரடைப் பயன்பாட்டைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἔχετε
  choice: இருக்கிறார்கள் / இருப்பதில்லை
  rationale: இங்கு உடைமை அல்ல, உடனிருப்பு அல்லது அணுகக்கூடிய நிலையே பொருள். ஆகவே தமிழில் இயல்பாக ‘உங்களுடன் இருக்கிறார்கள்’ என்றும், இரண்டாம் கூறில் ‘உங்களுடன் இருப்பதில்லை’ என்றும் வழங்கப்பட்டுள்ளது.
- source_word: μεθ’ ἑαυτῶν
  choice: உங்களுடன்
  rationale: சீடர்களோடு இருக்கும் உடனிருப்பைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐμὲ
  choice: நான்
  rationale: கிரேக்கத்தில் இது நேரடிச் செயப்படுபொருள் வடிவமானாலும், ‘இரு’ வினையைக் கொண்டு அமைக்கப்பட்ட இயல்பான தமிழ்ச் சொற்றொடரில் எழுவாய் வடிவம் தேவைப்படுகிறது; குறிப்பு இயேசுவையே சுட்டுகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: ஏழைகளின் தொடர்ந்த இருப்புக்கும் இயேசுவின் வரையறுக்கப்பட்ட உடனிருப்புக்கும் இடையிலான மாறுபாட்டைக் காட்டுகிறது.
- source_word: οὐ πάντοτε
  choice: எப்போதும் ... இருப்பதில்லை
  rationale: முதல் ‘எப்போதும்’ என்பதோடு உள்ள வெளிப்படையான எதிர்மறை ஒப்புமையைப் பாதுகாத்து, இயல்பான தமிழ் மறுப்பு அமைப்பில் தருகிறது.
theological_decisions:
- issue: இயேசுவின் இருப்பைப் பற்றிய உட்குறிப்பு
  choice: ஏழைகள் தொடர்ந்து அவர்களுடன் இருப்பதையும், இயேசு அவர்களோடு உடல்ரீதியாக இருக்கும் காலம் வரையறுக்கப்பட்டிருப்பதையும் கால அடிப்படையில் மாறுபடுத்திக் காட்டுதல்.
  alternative: இவ்வசனம் ஏழைகளைக் கவனிப்பதன் முக்கியத்துவத்தைக் குறைப்பதாகப் புரிந்துகொள்ளுதல்.
  rationale: கிரேக்க உரை முதன்மையாக ஒரு கால மாறுபாட்டை முன்வைக்கிறது; ஏழைகளுக்கான இரக்கத்தையோ உதவியையோ மதிப்பிழக்கச் செய்யும் கூற்றைச் சேர்ப்பதில்லை. மொழிபெயர்ப்பு இந்த இறையியல் பதற்றத்தை விளக்கிச் சீர்செய்யாமல் அப்படியே பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கத்தில் இரண்டாம் கூறில் வெளிப்படையாக மீண்டும் வராத ‘உங்களுடன்’ என்பது தமிழின் இயல்புக்கும் இரண்டு கூறுகளின் இணை அமைப்புக்கும் ஏற்ப நிரப்பப்பட்டுள்ளது.
