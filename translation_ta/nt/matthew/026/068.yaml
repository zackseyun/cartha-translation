  edition: SBLGNT
  text: λέγοντες· Προφήτευσον ἡμῖν, χριστέ, τίς ἐστιν ὁ παίσας σε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/068.yaml
  text: 'saying[a], “Prophesy to us, Messiah: who is it that struck you?”'
translation:
  language: ta
  text: “மேசியாவே[a], உன்னை அடித்தவன் யார் என்று எங்களுக்குத் தீர்க்கதரிசனம் சொல்” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்துவே.” கிரேக்கச் சொல் Χριστός இங்கு பெயரைப்போல அல்லாமல் ஒரு பட்டமாகப் பயன்படுத்தப்பட்டுள்ளதால், “மேசியாவே” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγοντες
  choice: என்று சொன்னார்கள்
  rationale: இது கேலி பேசுவோரின் நேரடி உரையை அறிமுகப்படுத்தும் நிகழ்காலப் பங்கேற்புவினை. முந்தைய வசனத்துடன் தொடரும் கிரேக்க அமைப்பை, தனி வசனமாகவும் இயல்பாகப் படிக்கும்படி தமிழில் வினைமுற்றாக வழங்குகிறது.
- source_word: Προφήτευσον
  choice: தீர்க்கதரிசனம் சொல்
  rationale: προφητεύω என்பதன் கட்டளை வடிவத்தையும், தாக்கியவர் யார் என்பதைத் தீர்க்கதரிசன அறிவால் கூறுமாறு கேலி செய்யும் தொனியையும் காக்கிறது.
- source_word: ἡμῖν
  choice: எங்களுக்கு
  rationale: கோரப்படும் தீர்க்கதரிசனத்தைப் பெறுபவர்களைக் குறிக்கும் வேற்றுமைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: χριστέ
  choice: மேசியாவே
  rationale: Χριστός இங்கு பெயரைப்போல் அல்லாமல் நேரடி அழைப்பில் வரும் பட்டமாகவும் கேலிக்குரிய மெசியத் தகுதியைக் குறிக்கும் சொல்லாகவும் உள்ளது.
- source_word: τίς ἐστιν ὁ παίσας σε
  choice: உன்னை அடித்தவன் யார்
  rationale: ‘உன்னை அடித்தவர் யார்?’ என்ற அடையாள வினாவைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; παίω என்பதன் உறுதியான உடல் தாக்குதல் பொருளுக்கு ‘அடித்தவன்’ பொருந்துகிறது.
theological_decisions:
- issue: Χριστός என்ற பட்டத்தின் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இச்சூழலில் இது இயேசுவின் நிலையான பெயர்போன்ற வடிவமாக அல்லாமல் அழைப்புவேற்றுமையில் வரும் பட்டமாகப் பயன்படுத்தப்படுகிறது. ‘மேசியா’ என்பது கேலி உரையின் மெசியத் தாக்கத்தைத் தெளிவாகக் காக்கிறது; ‘கிறிஸ்து’ என்பதும் மரபான மாற்று வடிவம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், நேரடியான தமிழ் பயன்படுத்தப்பட்டுள்ளது. கேலி செய்யும் சூழலுக்கும் ஒருமை கட்டளைக்கும் ஏற்றவாறு ‘சொல்’, ‘உன்னை’ என்ற வடிவங்கள் வைக்கப்பட்டுள்ளன; தேவையற்ற மரியாதை வடிவம் சேர்க்கப்படவில்லை.
