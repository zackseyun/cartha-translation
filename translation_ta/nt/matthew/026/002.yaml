id: MAT.26.2
reference: Matthew 26:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Οἴδατε ὅτι μετὰ δύο ἡμέρας τὸ πάσχα γίνεται, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς τὸ σταυρωθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/002.yaml
  text: You know that after two days the Passover is coming[a], and the Son of Man is being handed over to be crucified.
translation:
  language: ta
  text: “இரண்டு நாட்களுக்குப் பிறகு பாஸ்கா வருகிறது என்பது உங்களுக்குத் தெரியும்; மானிடமகன் சிலுவையில் அறையப்படுவதற்கு ஒப்படைக்கப்படுகிறார்[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “காட்டிக்கொடுக்கப்படுகிறார்.” கிரேக்க வினைச்சொல் துரோகமாகக் காட்டிக்கொடுப்பதைக் குறிக்கலாம்; ஆனால் பரந்த பொருளில் ஒருவரை மற்றவர்களின் கையில் ஒப்படைப்பதையும் குறிக்கும்.
    reason: alternative_reading
lexical_decisions:
- source_word: Οἴδατε
  choice: உங்களுக்குத் தெரியும்
  rationale: οἶδα என்பதன் இரண்டாம் நபர் பன்மை வடிவம் நிகழ்காலப் பொருளில் வருகிறது; சீடர்களை நோக்கிய இயல்பான தமிழாக அமைக்கப்பட்டது.
- source_word: μετὰ δύο ἡμέρας
  choice: இன்னும் இரண்டு நாட்களுக்குப் பிறகு
  rationale: μετά + வேற்றுமை உருபு காலப்பொருளில் ‘இரண்டு நாட்களுக்குப் பிறகு’ எனும் அர்த்தம் தருகிறது; ‘இன்னும்’ என்பது தமிழில் எதிர்வரும் கால இடைவெளியை இயல்பாகத் தெளிவாக்குகிறது.
- source_word: τὸ πάσχα
  choice: பாஸ்கா
  rationale: யூதரின் பாஸ்கா நிகழ்வைக் குறிக்கும் நிலைபெற்ற வேதாகமப் பெயர்; மூலத்தில் இல்லாத ‘பண்டிகை’ என்பதைச் சேர்க்கவில்லை.
- source_word: γίνεται
  choice: வருகிறது
  rationale: இங்கு γίνομαι பாஸ்கா நெருங்கி வருவதைக் குறிக்கிறது; ‘நடைபெறுகிறது’ என்பதைவிட சூழலுக்கு இயல்பானது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மானிடமகன்
  rationale: இயேசுவின் தன்னைக் குறிக்கும் பட்டத்தைச் சுருக்கமாகவும் அதன் வேதாகமத் தொடர்பைத் தக்கவைத்தும் வழங்குகிறது.
- source_word: παραδίδοται
  choice: காட்டிக்கொடுக்கப்படுகிறார்
  rationale: παραδίδωμι என்பதன் செயப்பாட்டு நிகழ்கால வடிவம்; தமிழில் துரோகம் மற்றும் அதிகாரிகளிடம் ஒப்படைத்தல் ஆகிய இரு நிழற்பொருள்களையும் ஏந்தக்கூடிய சொல்லாட்சி.
- source_word: εἰς τὸ σταυρωθῆναι
  choice: சிலுவையில் அறையப்படுவதற்காக
  rationale: εἰς உடன் வரும் பெயராக்கப்பட்ட வினையெச்சம் நோக்கம் அல்லது விளைவைக் காட்டுகிறது; தமிழில் நோக்கத்தை நேரடியாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பாடுகளின் முன்னறிவிப்பில் παραδίδοται என்பதன் பொருள்
  choice: காட்டிக்கொடுக்கப்படுகிறார்
  alternative: ஒப்படைக்கப்படுகிறார்
  rationale: சூழலில் யூதாசின் துரோகம் இடம்பெற்றாலும், கிரேக்க வினை அதைவிடப் பரந்த ‘ஒப்படைத்தல்’ பொருளையும் கொண்டுள்ளது. முதன்மைத் தமிழ்ச் சொல் துரோகத்தின் நிழற்பொருளை வெளிப்படுத்துகிறது; அடிக்குறிப்பு பரந்த பொருளைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், அதேவேளையில் கண்ணியமான வேதாகம நடையைக் கொண்டது. ‘பாஸ்கா’ மற்றும் ‘மானிடமகன்’ ஆகியவை நிலைபெற்ற வேதாகமச் சொற்களாகப் பயன்படுத்தப்பட்டுள்ளன.
