id: MAT.26.10
reference: Matthew 26:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Τί κόπους παρέχετε τῇ γυναικί; ἔργον γὰρ καλὸν ἠργάσατο εἰς ἐμέ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/010.yaml
  text: But Jesus[a], knowing this, said to them[b], “Why are you causing trouble for the woman? For she has done a beautiful work to me.
translation:
  language: ta
  text: ஆனால் இயேசு இதை அறிந்து அவர்களிடம், “இந்தப் பெண்ணை ஏன் தொந்தரவு செய்கிறீர்கள்? இவர் எனக்கு ஓர் அழகிய செயலைச் செய்திருக்கிறார்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவர் எனக்காக ஒரு நல்ல செயலைச் செய்திருக்கிறார்.”
    reason: καλὸν என்பதற்கு ‘அழகிய’ அல்லது ‘நல்ல’ என்றும், εἰς ἐμέ என்பதற்கு ‘எனக்கு’ அல்லது ‘எனக்காக’ என்றும் இச்சூழலில் பொருள் கொள்ள முடியும்.
lexical_decisions:
- source_word: γνοὺς
  choice: இதை அறிந்து
  rationale: இறந்தகால வினையெச்சம் சூழ்நிலைப் பொருளுடன் முதன்மை வினைக்கு முன் வருகிறது; முந்தைய வசனத்தில் சீடர்கள் கூறியதைச் சுட்டும் மறைமுகப் பொருளை ‘இதை’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: சீடர்களின் குறைகூறலிலிருந்து இயேசுவின் திருத்தும் பதிலுக்கு வரும் மென்மையான எதிர்மாற்றத்தை வெளிப்படுத்துகிறது.
- source_word: Τί κόπους παρέχετε τῇ γυναικί
  choice: இந்தப் பெண்ணை ஏன் தொந்தரவு செய்கிறீர்கள்?
  rationale: κόπους παρέχετε என்ற மரபுத்தொடர் ஒருவருக்குத் தொல்லை அல்லது மனவருத்தம் உண்டாக்குவதைக் குறிக்கிறது; இத்தமிழாக்கம் கண்டிக்கும் வலிமையையும் இயல்பான நவீன நடையையும் காக்கிறது.
- source_word: ἔργον καλὸν
  choice: ஓர் அழகிய செயல்
  rationale: καλός என்பது வெறும் ஒழுக்க நன்மையை மட்டும் அல்லாமல் நேர்த்தி, தகுதி, மேன்மை ஆகிய நுண்ணுணர்வுகளையும் கொண்டிருக்கலாம்; அபிஷேகச் செயலுக்கான இயேசுவின் பாராட்டை ‘அழகிய செயல்’ காக்கிறது.
- source_word: ἠργάσατο
  choice: செய்திருக்கிறார்
  rationale: நிறைவுற்ற செயலின் தற்போதைய முக்கியத்துவத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; பெண்ணைப் பற்றிய மரியாதையான குறிப்பையும் காக்கிறது.
- source_word: εἰς ἐμέ
  choice: எனக்கு
  rationale: இயேசுவை நோக்கிய அல்லது அவருடன் தொடர்புடைய செயல் என்ற உறவைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; ‘எனக்காக’ என்ற பயன் சார்ந்த வாசிப்பை மட்டும் கட்டாயப்படுத்தவில்லை.
theological_decisions:
- issue: பெண்ணின் செயலுக்கான மதிப்பீடு
  choice: ஓர் அழகிய செயல்
  alternative: ஒரு நல்ல செயல்
  rationale: இயேசுவின் நேர்மறையான மதிப்பீட்டையும் καλός என்பதிலுள்ள அழகு-நன்மை நுண்ணுணர்வையும் காக்கிறது; சடங்கு, புண்ணியம் அல்லது வேறு கோட்பாட்டு பொருளை உரைக்குள் சேர்ப்பதில்லை.
- issue: εἰς ἐμέ குறிக்கும் உறவு
  choice: எனக்கு
  alternative: எனக்காக
  rationale: மூலமொழியில் திசை அல்லது உறவு மற்றும் பயன் சார்ந்த பொருள் இரண்டும் சாத்தியம்; முதன்மை உரை நடுநிலையான ‘எனக்கு’ என்பதைப் பயன்படுத்தி, பயன் சார்ந்த வாசிப்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. ‘இந்தப் பெண்’ என்பது குறிப்பிட்ட நபரைத் தெளிவாகச் சுட்டுகிறது; அடுத்த வாக்கியத்தில் ‘இவர்’ என்பது அவரைப் பற்றிய மரியாதையான இயல்பான குறிப்பாக உள்ளது. நேரடியான கேள்வியின் கண்டிக்கும் தொனி பாதுகாக்கப்பட்டுள்ளது.
