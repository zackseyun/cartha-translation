  text: καὶ πάλιν ἠρνήσατο μετὰ ὅρκου ὅτι Οὐκ οἶδα τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/072.yaml
  text: 'And again he denied it with an oath: “I do not know the man.”[a]'
translation:
  language: ta
  text: 'அவன் மீண்டும் சத்தியம் செய்து மறுத்தான்: “அந்த மனிதனை எனக்குத் தெரியாது.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ πάλιν
  choice: மீண்டும்
  rationale: καὶ என்ற எளிய இணைப்பைத் தமிழில் தனியாக மொழிபெயர்ப்பது இங்கு செயற்கையாக இருக்கும்; πάλιν குறிக்கும் மறுப்பின் மறுநிகழ்வை ‘மீண்டும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἠρνήσατο
  choice: அவன் … மறுத்தான்
  rationale: வினைச்சொல்லுக்குப் பின் மறுப்பின் உள்ளடக்கம் நேரடிக் கூற்றாக வருகிறது. தமிழில் தேவையற்ற ‘அதை’ என்ற செயப்படுபொருளைச் சேர்க்காமல் ‘மறுத்தான்’ என்பது பொருளைத் துல்லியமாக வழங்குகிறது.
- source_word: μετὰ ὅρκου
  choice: ஆணையிட்டு
  rationale: ஒரு முறையான நீதிமன்றச் சத்தியப்பிரமாணத்தைச் சுட்டாதபடி, ஆணை கூறி மறுத்த செயலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὅτι
  choice: ':'
  rationale: ὅτι மறுப்பின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் நேரடிக் கூற்றுக்கு முன் முக்காற்புள்ளி இடுவது இயல்பானது.
- source_word: Οὐκ οἶδα
  choice: எனக்குத் தெரியாது
  rationale: அறியாமையை மறுக்கும் கிரேக்கக் கூற்றிற்கான நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: τὸν ἄνθρωπον
  choice: அந்த மனிதரை
  rationale: குறிப்பிட்ட ஆண் நபரைக் குறிக்கும் சொற்றொடரை ‘அவரை’ அல்லது ‘இயேசுவை’ என்று விளக்கிவிடாமல் காக்கிறது; ‘அந்த’ என்பது தமிழில் குறிப்பிட்ட நபரை இயல்பாகச் சுட்டுகிறது.
theological_decisions:
- issue: ‘τὸν ἄνθρωπον’ யாரைக் குறிக்கிறது என்பதை மொழிபெயர்ப்பில் வெளிப்படையாகப் பெயரிடுதல்
  choice: ‘அந்த மனிதரை’ என்று மூலத்தின் வெளிப்பாட்டைத் தக்கவைத்தல்
  alternative: ‘அவரை’ அல்லது ‘இயேசுவை’
  rationale: கிரேக்கம் ‘மனிதன்’ என்ற சொல்லையே பயன்படுத்துகிறது. இது பேதுருவின் விலகி நிற்கும் மறுப்பு மொழியின் வலிமையைத் தக்கவைக்கிறது; ‘இயேசு’ என்று பெயரிடுவது மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்கும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு எளிதாகவும், வேதவாக்கியத்திற்கேற்ற கண்ணியத்துடனும் அமைந்த நடை. ‘அந்த மனிதரை’ என்பதில் மரியாதைப் பன்மை விகுதியைப் பயன்படுத்தி, மூலத்தின் தூரப்படுத்தும் சொற்றொடரை அவமதிப்பாக மாற்றாமல் காக்கப்பட்டுள்ளது.
