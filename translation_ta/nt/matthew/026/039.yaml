id: MAT.26.39
reference: Matthew 26:39
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ⸀προελθὼν μικρὸν ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ προσευχόμενος καὶ λέγων· Πάτερ μου, εἰ δυνατόν ἐστιν, παρελθάτω ἀπ’ ἐμοῦ τὸ ποτήριον τοῦτο· πλὴν οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/039.yaml
  text: And going a little farther[a], he fell on his face, praying and saying, “My Father, if it is possible, let this cup pass from me; yet not as I will[b], but as you will.”
translation:
  language: ta
  text: 'அவர் சற்றுத் தூரம் முன்னே சென்று, முகங்குப்புற விழுந்து[a], இவ்வாறு வேண்டிக்கொண்டார்: “என் தந்தையே, முடியுமானால், இந்தக் கிண்ணம்[b] என்னைவிட்டு நீங்கட்டும். ஆனாலும், நான் விரும்புகிறபடி அல்ல, நீர் விரும்புகிறபடியே ஆகட்டும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, முகம் தரையில் படும்படி விழுந்தார்.
    reason: உடல்நிலையையும் பணிவின் சைகையையும் தெளிவுபடுத்தும் lexical_alternative.
  - marker: b
    text: ‘கிண்ணம்’ என்பது ஒருவருக்கு நியமிக்கப்பட்ட பங்கைக் குறிக்கும் வேதாகம உருவகம்; இங்கு அது குறிப்பாகத் துன்பத்தைக் குறிக்கிறது. மத்தேயு 20:22; 26:42 ஆகியவற்றை ஒப்பிடுக.
    reason: உருவகத்தின் வேதாகமப் பின்னணியையும் தொடர்புடைய வசனங்களையும் காட்டும் cross_reference.
lexical_decisions:
- source_word: προελθὼν μικρὸν
  choice: சற்றுத் தூரம் முன்னே சென்று
  rationale: முன்னோக்கிச் சிறிது தூரம் சென்றதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; μικρόν என்பதையும் முன்னே செல்லும் கருத்தையும் காக்கிறது.
- source_word: ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ
  choice: முகங்குப்புற விழுந்து
  rationale: முகம் தரையில் படும்படியான பணிவான உடல்நிலையைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: προσευχόμενος καὶ λέγων
  choice: இவ்வாறு வேண்டிக்கொண்டார்
  rationale: வேண்டுதல் மற்றும் அதைச் சொற்களால் வெளிப்படுத்துதல் ஆகிய இரண்டையும் தமிழ் உரைநடையில் சுருக்கமாகக் கொண்டுவருகிறது; அதைத் தொடர்ந்து நேரடி கூற்று வருவதால் ‘சொன்னார்’ என்ற கருத்தும் வெளிப்படுகிறது.
- source_word: Πάτερ μου
  choice: என் தந்தையே
  rationale: μου என்பதன் தனிப்பட்ட உறவையும், அழைப்புமுறையின் நெருக்கத்தையும் மரியாதையையும் கூடுதல் உணர்ச்சிச் சாயல் இன்றி காக்கிறது.
- source_word: εἰ δυνατόν ἐστιν
  choice: முடியுமானால்
  rationale: கிரேக்கத்தின் நிபந்தனைப் பொருளை இயல்பான தமிழில் தருகிறது; மூலத்தில் இல்லாத குறிப்பிட்ட எழுவாயைச் சேர்ப்பதில்லை.
- source_word: παρελθάτω ἀπ’ ἐμοῦ
  choice: என்னைவிட்டு நீங்கட்டும்
  rationale: வேண்டுகோளாக உள்ள மூன்றாம் நபர் கட்டளையைத் தமிழின் ‘-ட்டும்’ வடிவில் காத்து, தம்மிடமிருந்து அது அகல வேண்டும் என்ற பொருளைத் தெளிவுபடுத்துகிறது.
- source_word: τὸ ποτήριον τοῦτο
  choice: இந்தக் கிண்ணம்
  rationale: வேதப்பின்னணியுள்ள உருவகத்தை விளக்கவுரையாக மாற்றாமல், மூலத்தின் பொருள்படிமத்தையே காக்கிறது.
- source_word: πλὴν
  choice: ஆனாலும்
  rationale: முந்தைய வேண்டுகோளைத் தொடர்ந்து வரும் வலுவான மாறுபாட்டையும் உடன்பாட்டையும் இயல்பான, கண்ணியமான தமிழில் காட்டுகிறது.
- source_word: οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ
  choice: நான் விரும்புகிறபடி அல்ல, நீர் விரும்புகிறபடியே ஆகட்டும்
  rationale: இயேசுவின் உண்மையான விருப்பத்தையும் தந்தையின் விருப்பத்திற்கான கீழ்ப்படிதலையும் காக்கிறது. கிரேக்கத்தில் இரண்டாம் பகுதியில் விடுபட்டுள்ள வினையைத் தமிழில் தெளிவுக்காக நிரப்புகிறது.
theological_decisions:
- issue: இயேசுவின் வேண்டுதலில் வரும் ‘கிண்ணம்’ என்ற உருவகம்
  choice: முதன்மை உரையில் ‘இந்தக் கிண்ணம்’ என்ற நேரடி உருவகம் காக்கப்பட்டது.
  alternative: இந்தத் துன்பம்; எனக்கு நியமிக்கப்பட்ட துன்பம்
  rationale: ποτήριον என்பது நேரடியாகக் கிண்ணத்தைக் குறித்தாலும், இங்கு நியமிக்கப்பட்ட பங்கு—குறிப்பாகத் துன்பம்—என்ற வேதாகம உருவகப் பின்னணியைக் கொண்டுள்ளது. அதை விளக்கிச் சமனாக்காமல் உரையிலேயே காப்பது அதன் இடையுரைப் பொருளையும் இறையியல் அழுத்தத்தையும் நிலைநிறுத்துகிறது.
- issue: இயேசுவின் விருப்பமும் தந்தையின் விருப்பமும்
  choice: ‘நான் விரும்புகிறபடி அல்ல, நீர் விரும்புகிறபடியே’ என்று இரு விருப்பங்களின் மாறுபாடு காக்கப்பட்டது.
  alternative: எனக்கு வேண்டியபடி அல்ல, உமக்கு வேண்டியபடி
  rationale: θέλω வெளிப்படுத்தும் உண்மையான விருப்பத்தை மறைக்காமலும், அதை வெறும் மேலோட்டமான ஆசையாகக் குறைக்காமலும், தந்தையின் விருப்பத்திற்கான ஒப்புதலைத் தெளிவாக வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘ஜெபித்தார்’ போன்ற சமயக் குழு சார்ந்த கடன்சொல்லுக்குப் பதிலாக ‘வேண்டிக்கொண்டார்’ பயன்படுத்தப்பட்டது. தந்தையை நோக்கிய மரியாதைக்காக ‘நீர்’ வடிவம் காக்கப்பட்டது; பழமையான அல்லது மிகைச் செம்மொழி வடிவங்கள் தவிர்க்கப்பட்டன.
