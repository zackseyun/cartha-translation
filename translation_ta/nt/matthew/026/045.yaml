id: MAT.26.45
reference: Matthew 26:45
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τότε ἔρχεται πρὸς τοὺς ⸀μαθητὰς καὶ λέγει αὐτοῖς· Καθεύδετε ⸀τὸ λοιπὸν καὶ ἀναπαύεσθε· ἰδοὺ ἤγγικεν ἡ ὥρα καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς χεῖρας ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/045.yaml
  text: Then he comes to the disciples and says to them[a], “Sleep on now and take your rest. Look, the hour has drawn near[c][b], and the Son of Man is being handed over into the hands of sinners.”
translation:
  language: ta
  text: பின்பு அவர் சீடர்களிடம் வந்து, அவர்களிடம், “இனிமேல் தூங்குங்கள், ஓய்வெடுங்கள்.[a] இதோ, வேளை நெருங்கிவிட்டது; மானிடமகன் பாவிகளின் கைகளில் ஒப்படைக்கப்படுகிறார்.[b][c]” என்று சொல்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இன்னும் தூங்கி ஓய்வெடுத்துக்கொண்டிருக்கிறீர்களா?” கிரேக்கச் சொற்றொடரை வினாவாகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: “ஒப்படைக்கப்படுகிறார்” என்பதற்கு “காட்டிக்கொடுக்கப்படுகிறார்” என்றும் மொழிபெயர்க்கலாம்; ஆனால் கிரேக்கச் சொல் பொதுவாக ஒருவரை பிறரிடம் ஒப்படைத்தல் என்ற பரந்த பொருளுடையது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “வேளை வந்துவிட்டது” அல்லது “வேளை அருகில் உள்ளது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: பின்பு
  rationale: நிகழ்வுகளின் தொடர்ச்சியில் அடுத்த கட்டத்தை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: ἔρχεται ... καὶ λέγει
  choice: வந்து ... சொல்கிறார்
  rationale: நற்செய்தி நடையின் வரலாற்று நிகழ்காலத்தைத் தமிழிலும் உயிரோட்டத்துடன் தக்கவைக்கிறது.
- source_word: Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: இப்போது தொடர்ந்து தூங்குங்கள், ஓய்வெடுங்கள்
  rationale: வடிவில் உள்ள கட்டளைத் தொனியையும் சூழலில் இருக்கக்கூடிய நையாண்டி அல்லது விட்டுக்கொடுக்கும் தொனியையும் வெளிப்படையாகத் தீர்மானிக்காமல் தக்கவைக்கிறது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் கிரேக்கச் சொல்லின் கண்ணியமான, வழக்கமான தமிழ் இணை.
- source_word: ἤγγικεν ἡ ὥρα
  choice: வேளை நெருங்கிவிட்டது
  rationale: ἐγγίζω என்பதன் நெருங்குதல் என்ற அடிப்படைப் பொருளையும் நிறைவுநிலையைக் காட்டும் perfect வடிவின் வலிமையையும் தக்கவைக்கிறது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மானிடமகன்
  rationale: இயேசுவின் முக்கியமான சுயக் குறிப்பைச் சுருக்கமான, நிலைபெற்ற தமிழ் வேதாகமச் சொல்லாக்கத்தில் வழங்குகிறது.
- source_word: παραδίδοται
  choice: ஒப்படைக்கப்படுகிறார்
  rationale: ‘காட்டிக்கொடுக்கப்படுகிறார்’ என்று யூதாசின் துரோகத்திற்கு மட்டும் பொருளைக் குறுக்காமல், பிடிப்பு மற்றும் பாடுகளுக்காக பிறரிடம் ஒப்படைக்கப்படுதல் என்ற பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: εἰς χεῖρας ἁμαρτωλῶν
  choice: பாவிகளின் கைகளில்
  rationale: கிரேக்கத்தின் தெளிவான உருவகத்தை இயல்பான தமிழில் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: Καθεύδετε ... καὶ ἀναπαύεσθε என்பதன் வாக்கிய வலிமை
  choice: “இப்போது தொடர்ந்து தூங்குங்கள், ஓய்வெடுங்கள்” என்ற மேற்பரப்பு கட்டளை வடிவம்
  alternative: “இன்னும் தூங்கி ஓய்வெடுத்துக்கொண்டிருக்கிறீர்களா?” என்ற வினா வடிவம்
  rationale: உடனே வரும் வேளை நெருங்கியதெனும் அறிவிப்பால் நையாண்டி அல்லது சொல்லாட்சிசார் வினா சாத்தியமானாலும், கிரேக்கத்தில் வெளிப்படையான வினாக்குறி சார்ந்த வடிவம் இல்லை. ஆகவே முதன்மை உரை பதற்றத்தைத் தீர்க்காமல் வைத்திருக்கிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: பாடுகளின் சூழலில் παραδίδοται என்பதன் பொருள்
  choice: ஒப்படைக்கப்படுகிறார்
  alternative: காட்டிக்கொடுக்கப்படுகிறார்
  rationale: இந்தச் சொல் யூதாசின் துரோகத்தையும் உள்ளடக்கலாம்; எனினும் அதன் பொருள் அதைவிடப் பரந்தது. ‘ஒப்படைக்கப்படுகிறார்’ என்பது மனிதச் செயலையும், நிகழ்வின் பரந்த பாடுகள் சார்ந்த பரிமாணத்தையும் குறுக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வரலாற்று நிகழ்காலம் தக்கவைக்கப்பட்டுள்ளது. ‘தூங்குங்கள்’ என்ற சொல்லின் நையாண்டி/வினா சாத்தியம் முதன்மை உரையில் தீர்க்கப்படாமல் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
