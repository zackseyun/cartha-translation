  yaml_path: translation/nt/matthew/026/006.yaml
  text: While Jesus was in Bethany[a], in the house of Simon the leper[b],
translation:
  language: ta
  text: இயேசு பெத்தானியாவில்[a], தொழுநோயாளி எனப்பட்ட சீமோனின்[b] வீட்டில் இருந்தபோது,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இயேசு பெத்தானியாவில் இருந்த சமயத்தில்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் உள்ள ஒரு தனித்த இலக்கண அமைப்பு நிகழ்வின் காலச் சூழலை அமைக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘தொழுநோயாளி’ என்பது சீமோனை அடையாளப்படுத்த மூல கிரேக்கத்தில் பயன்படுத்தப்பட்ட அடைமொழி. அவர் அப்போது அந்த நோயால் பாதிக்கப்பட்டிருந்தாரா அல்லது முன்பு அதனால் பாதிக்கப்பட்டிருந்தாரா என்பதை இது மட்டும் தீர்மானிக்காது.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γενομένου
  choice: இயேசு … இருந்தபோது
  rationale: முற்றுவினைச் சார்பற்ற கிரேக்க உருபுத் தொடர் இங்கு நிகழ்வின் காலச் சூழலை அமைக்கிறது. γίνομαι என்பதைச் சொற்சொல்லாக மொழிபெயர்க்காமல், இயல்பான தமிழில் ‘இருந்தபோது’ எனத் தரப்பட்டுள்ளது. δέ மென்மையான கதைத் தொடர்ச்சியைக் குறிக்கிறது; தமிழில் தனிச் சொல்லைச் சேர்க்காமல் வாக்கியத் தொடரால் அது வெளிப்படுகிறது.
- source_word: ἐν Βηθανίᾳ
  choice: பெத்தானியாவில்
  rationale: ἐν என்பதன் இடப்பொருளையும் Βηθανία என்ற இடப்பெயரையும் நேரடியாகத் தருகிறது.
- source_word: ἐν οἰκίᾳ Σίμωνος
  choice: சீமோனின் வீட்டில்
  rationale: οἰκία இங்கு நிகழ்வு நடந்த கட்டிடமான வீட்டைக் குறிக்கிறது; Σίμωνος உடைமைப் பொருளில் உள்ளது.
- source_word: τοῦ λεπροῦ
  choice: தொழுநோயாளி எனப்பட்ட
  rationale: λεπρός சீமோனை அடையாளப்படுத்தும் அடைமொழி. ‘எனப்பட்ட’ என்பது மூலத்தின் அடையாளச் செயல்பாட்டைக் காத்து, அவர் அப்போது அந்த நோயுடன் இருந்தார் என்று தேவையின்றி உறுதிப்படுத்துவதைத் தவிர்க்கிறது.
theological_decisions:
- issue: ‘தொழுநோயாளி’ என்ற அடைமொழி சீமோனின் அப்போதைய உடல்நிலையை எவ்வாறு குறிக்கிறது
  choice: அவரை அடையாளப்படுத்தும் அடைமொழியாக மட்டும் ‘தொழுநோயாளி எனப்பட்ட சீமோன்’ என்று தருதல்
  alternative: ‘முன்பு தொழுநோயாளியாக இருந்த சீமோன்’ அல்லது ‘தோல் நோயுள்ள சீமோன்’
  rationale: கிரேக்க உரை அவர் அப்போது நோயுற்றிருந்தாரா, முன்பு குணமடைந்தவரா என்பதைச் சொல்லவில்லை; நவீன மருத்துவ நோயறிதலையும் குறிப்பிடவில்லை. எனவே உரை கூறாத குணமடைதல் அல்லது மருத்துவத் துல்லியம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் தரப்பட்டுள்ளது. அடுத்த வசனத்தில் தொடரும் வாக்கிய அமைப்பைக் காட்ட இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. ‘எனப்பட்ட’ என்பது பழைய அடையாள அடைமொழியை இயல்பாகக் காத்து, தேவையற்ற மருத்துவ அல்லது வரலாற்று முடிவைத் தவிர்க்கிறது.
