  source_fidelity: மூலக் கிரேக்கத்தின் எளிய இறந்தகால அறிக்கை (εἶπαν), குற்றஞ்சாட்டும் சுட்டுப்பெயர் (Οὗτος), மேற்கோளிடப்பட்ட திறன்கூற்று (Δύναμαι), ஆலயத்தை அழித்தல் மற்றும் மூன்று நாட்களில் கட்டுதல் ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. ‘அதைக் கட்ட’ என்பதில் கிரேக்கத்தில் உட்கிடையாக உள்ள ஆலயப் பொருள் தமிழில் இயல்பாகத் தெளிவாக்கப்பட்டுள்ளது.
