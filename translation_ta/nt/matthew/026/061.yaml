id: MAT.26.61
reference: Matthew 26:61
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶπαν· Οὗτος ἔφη· Δύναμαι καταλῦσαι τὸν ναὸν τοῦ θεοῦ καὶ διὰ τριῶν ἡμερῶν ⸀οἰκοδομῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/061.yaml
  text: They said[a], “This man said[b], ‘I am able to destroy the temple of God and to build it in three days.’”
translation:
  language: ta
  text: அவர்கள், “இவன், ‘தேவனுடைய ஆலயத்தை இடித்துவிட்டு, மூன்று நாட்களில்[a] அதைக் கட்ட என்னால் முடியும்’ என்று சொன்னான்[b]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மூன்று நாட்களுக்குள்.” கிரேக்கத் தொடர் அந்தக் காலப்பரப்புக்குள் செயல் நிறைவேறுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ஆலயத்தைப் பற்றிய இயேசுவின் கூற்று அவருடைய உடலைக் குறித்தது என்று யோவான் 2:19–21 விளக்குகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: εἶπαν
  choice: என்றார்கள்
  rationale: இறந்தகால நிகழ்வை எளிய கதைநடை வடிவில் அறிமுகப்படுத்தும் aorist வினைக்கு இயல்பான தமிழ் வடிவம்.
- source_word: Οὗτος
  choice: இவன்
  rationale: குற்றஞ்சாட்டும் நேரடிப் பேச்சில் உள்ள சுட்டும், சற்றே இகழ்வான தொனியையும் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἔφη
  choice: என்று சொன்னான்
  rationale: φημί இங்கு கூறப்பட்ட பேச்சை மட்டும் அறிக்கையிடுகிறது; ‘அறிவித்தான்’ அல்லது ‘உரிமைகோரினான்’ போன்ற கூடுதல் வலிமையைச் சேர்க்கவில்லை.
- source_word: Δύναμαι
  choice: என்னால் முடியும்
  rationale: திறன் அல்லது ஆற்றலைக் குறிக்கும் கிரேக்கச் சொல்லை இயல்பான நவீன தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: καταλῦσαι
  choice: இடித்துவிட்டு
  rationale: ஒரு கட்டடமாகிய ஆலயத்தைத் தகர்ப்பதைக் குறிக்கும் சூழலில் இயல்பான தேர்வு; அடுத்து கட்டுவதை இணைக்கும் தமிழ் வாக்கிய அமைப்பிற்காக ‘-விட்டு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: τὸν ναὸν τοῦ θεοῦ
  choice: தேவனுடைய ஆலயத்தை
  rationale: ναός என்பதன் ஆலயம்/திருக்கோவில் சார்ந்த பொருளையும் τοῦ θεοῦ என்ற உடைமைத் தொடர்பையும் தெளிவாகக் காக்கிறது.
- source_word: διὰ τριῶν ἡμερῶν
  choice: மூன்று நாட்களில்
  rationale: மூன்று நாட்கள் என்ற காலப்பரப்பில் செயல் நிறைவேறுவதைக் குறிக்கும் கிரேக்கத் தொடரை இயல்பாக வெளிப்படுத்துகிறது; ‘மூன்று நாட்களுக்குள்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: οἰκοδομῆσαι
  choice: அதைக் கட்ட
  rationale: கிரேக்கத்தில் முன்னுள்ள ‘ஆலயம்’ என்பதே மறைமுகச் செயப்படுபொருள்; தமிழில் தெளிவுக்காக ‘அதை’ சேர்க்கப்பட்டுள்ளது. ‘மறுபடியும் கட்ட’ என்பது சூழலுக்கு ஏற்றதாக இருந்தாலும் மூலத்தில் இல்லாத கூறை வெளிப்படையாக்கும்.
theological_decisions:
- issue: குற்றச்சாட்டில் வரும் ‘தேவனுடைய ஆலயம்’ எதைக் குறிக்கிறது
  choice: முதன்மை உரையில் குற்றஞ்சாட்டுவோர் கூறியபடியே ஆலயத்தைக் குறிக்கும் சொற்களால் மொழிபெயர்த்தல்
  alternative: யோவான் 2:19–21 அடிப்படையில் இயேசுவின் உடல் மற்றும் உயிர்த்தெழுதலை நேரடியாக முதன்மை உரையில் வெளிப்படுத்துதல்
  rationale: மத்தேயு 26:61 விசாரணையில் சாட்சிகள் முன்வைத்த குற்றச்சாட்டை அறிக்கையிடுகிறது. யோவானின் விளக்கத்தை இங்கே முதன்மை உரைக்குள் புகுத்தாமல், தொடர்புடைய வேதப்பகுதியாக அடிக்குறிப்பில் சுட்டுவது மூலத்தின் கதைநிலையையும் இறையியல் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், நீதிமன்றக் குற்றச்சாட்டின் நேரடித் தொனியை காக்கும் கண்ணியமான நடை. உள்ளடுக்கப்பட்ட மேற்கோள்கள் தெளிவாக வேறுபடுத்தப்பட்டுள்ளன; இறையியல் விளக்கம் முதன்மை உரைக்குள் சேர்க்கப்படவில்லை.
