source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὅπου ἐὰν κηρυχθῇ τὸ εὐαγγέλιον τοῦτο ἐν ὅλῳ τῷ κόσμῳ, λαληθήσεται καὶ ὃ ἐποίησεν αὕτη εἰς μνημόσυνον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/013.yaml
  text: Truly I tell you, wherever this good news is proclaimed in the whole world, what this woman has done will also be spoken of in memory of her.
translation:
  language: ta
  text: '“உறுதியாக உங்களுக்குச் சொல்கிறேன்: உலகம் முழுவதிலும் இந்த நற்செய்தி[a] எங்கெல்லாம் அறிவிக்கப்படுமோ, அங்கெல்லாம் இந்தப் பெண் செய்ததும் அவளை நினைவுகூரும் வகையில் சொல்லப்படும்[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தச் சுவிசேஷம்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இந்தப் பெண் செய்ததும் அவளுடைய நினைவாக எடுத்துரைக்கப்படும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: உறுதியாக
  rationale: இயேசுவின் கூற்றை அறிமுகப்படுத்தும் ஆணித்தரமான உறுதிப்பாட்டை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; ‘ஆமென்’ என்ற ஒலிபெயர்ப்பைவிட உடனடியாகப் புரிகிறது.
- source_word: λέγω ὑμῖν
  choice: உங்களுக்குச் சொல்கிறேன்
  rationale: நேரடி உரையாடல் முறையையும் பன்மை முன்னிலையையும் தெளிவாகப் பேணுகிறது.
- source_word: ὅπου ἐὰν
  choice: எங்கெல்லாம் … அங்கெல்லாம்
  rationale: இடத்தை வரையறுக்காமல் பொதுவாகக் குறிக்கும் கிரேக்க அமைப்பை இயல்பான தமிழ் தொடர்பிணைப்பால் வெளிப்படுத்துகிறது.
- source_word: κηρυχθῇ
  choice: அறிவிக்கப்படுகிறதோ
  rationale: κηρύσσω என்பதிலுள்ள பொதுவெளியில் அறிவிக்கும் பொருளைப் பேணுகிறது; ‘பிரசங்கிக்கப்படுகிறதோ’ என்பதைவிட பயன்பாட்டு வரம்பு குறையாத சொல்.
- source_word: τὸ εὐαγγέλιον τοῦτο
  choice: இந்த நற்செய்தி
  rationale: εὐαγγέλιον என்பதன் அடிப்படைப் பொருளைத் தெளிவான, மதிப்புமிக்க நவீனத் தமிழில் தருகிறது.
- source_word: ἐν ὅλῳ τῷ κόσμῳ
  choice: உலகம் முழுவதிலும்
  rationale: முழு உலகையும் குறிக்கும் விரிவான பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: λαληθήσεται
  choice: சொல்லப்படும்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவைப் பேணுகிறது; இங்கு அந்தப் பெண்ணின் செயல் எடுத்துரைக்கப்படும் என்பதைக் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: ὃ ἐποίησεν αὕτη
  choice: இந்தப் பெண் செய்ததும்
  rationale: ὃ என்பது அவள் செய்த செயலைக் குறிக்கிறது; சூழலில் αὕτη குறிக்கும் பெண்ணைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: εἰς μνημόσυνον αὐτῆς
  choice: அவளை நினைவுகூரும் வகையில்
  rationale: அவளை நினைவுகூருதல் அல்லது அவளுக்கான நினைவுச்சின்னமாக அமைதல் என்ற நினைவூட்டும் நோக்கத்தை இயல்பான தமிழில் தருகிறது; மாற்று வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: εὐαγγέλιον என்பதன் மொழிபெயர்ப்பு
  choice: நற்செய்தி
  alternative: சுவிசேஷம்
  rationale: ‘நற்செய்தி’ என்பது கிரேக்கச் சொல்லின் நேரடிப் பொருளை நவீன வாசகர்களுக்குத் தெளிவாகத் தருகிறது; மரபுவழி திருச்சபைப் பயன்பாட்டிலுள்ள ‘சுவிசேஷம்’ என்பதும் செல்லத்தக்க மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- issue: εἰς μνημόσυνον αὐτῆς என்பதிலுள்ள நினைவுகூரும் தொடர்பு
  choice: அவளை நினைவுகூரும் வகையில்
  alternative: அவளுக்கு நினைவுச்சின்னமாக
  rationale: முதன்மை வாசகம் commemorative நோக்கத்தை இயல்பாக வெளிப்படுத்துகிறது; கிரேக்க அமைப்பு ‘அவளுக்கான நினைவுச்சின்னமாக’ என்ற சற்றே முறையான வாசிப்பையும் அனுமதிப்பதால் அதை அடிக்குறிப்பில் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் இயேசுவின் ஆணித்தரமான உரைக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘எங்கெல்லாம் … அங்கெல்லாம்’ என்ற இயல்பான தமிழ் அமைப்பு கிரேக்கத்தின் வரையறுக்கப்படாத இடப்பொருளைப் பேணுகிறது. அனைத்து அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
