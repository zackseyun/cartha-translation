source:
  edition: SBLGNT
  text: Καὶ ἔτι αὐτοῦ λαλοῦντος ἰδοὺ Ἰούδας εἷς τῶν δώδεκα ἦλθεν καὶ μετ’ αὐτοῦ ὄχλος πολὺς μετὰ μαχαιρῶν καὶ ξύλων ἀπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/047.yaml
  text: And while he was still speaking[a], behold, Judas, one of the twelve, came, and with him a large crowd with swords and clubs[b], from the chief priests and elders of the people.
translation:
  language: ta
  text: அவர் இன்னும் பேசிக்கொண்டிருக்கும்போதே, இதோ, பன்னிருவரில் ஒருவனான யூதாஸ் வந்தான். அவனோடு, முதன்மைக் குருக்களிடமிருந்தும் மக்களின் மூப்பர்களிடமிருந்தும் வந்த, வாள்களையும் தடிகளையும்[a] ஏந்திய ஒரு பெரிய கூட்டம் இருந்தது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கம்புகளையும்.’ இங்கு பயன்படுத்தப்பட்டுள்ள கிரேக்கச் சொல் சொல்லாட்சிப்படி மரத்துண்டுகளைக் குறிக்கும்; இச்சூழலில் அவை தடிகளாகப் பயன்படுத்தப்பட்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘முதன்மைக் குருக்களாலும் மக்களின் மூப்பர்களாலும் அனுப்பப்பட்ட ஒரு பெரிய கூட்டம்.’ கிரேக்க மூலத்தில் சொல்லாட்சிப்படி ‘முதன்மைக் குருக்களிடமிருந்தும் மக்களின் மூப்பர்களிடமிருந்தும்’ என்றே உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: அவர் இன்னும் பேசிக்கொண்டிருக்கும்போதே
  rationale: இந்த genitive absolute அமைப்பு அதே நேரத்தில் நிகழும் செயலைக் குறிக்கிறது. ‘இன்னும்’ என்பது ἔτι என்பதையும், ‘பேசிக்கொண்டிருக்கும்போதே’ என்பது தொடர்ச்சியையும் உடனடியான நிகழ்வையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கதை நிகழ்வின் திடீர் கவன ஈர்ப்பையும் உயிரோட்டத்தையும் காக்கும் இயல்பான தமிழ் உரையாடல் குறியீடு; ‘திடீரென்று’ என்று மொழிபெயர்ப்பது மூலத்தில் இல்லாத காலவிளக்கத்தைச் சேர்க்கும்.
- source_word: Ἰούδας
  choice: யூதாஸ்
  rationale: தமிழில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: εἷς τῶν δώδεκα
  choice: பன்னிருவரில் ஒருவன்
  rationale: பகுதிப்பொருள் கொண்ட கிரேக்கத் தொடரை நேரடியாகவும் இயல்பாகவும் தருகிறது; யூதாஸ் ஆண் என்பதால் ‘ஒருவன்’ பொருத்தமானது.
- source_word: ἦλθεν
  choice: வந்தான்
  rationale: ἔρχομαι என்பதன் எளிய இறந்தகாலக் கதை வடிவத்தைத் துல்லியமாக வழங்குகிறது.
- source_word: ὄχλος πολὺς
  choice: ஒரு பெரிய கூட்டம்
  rationale: πολύς என்பதன் அளவுப் பொருளைக் காக்கிறது. ‘கும்பல்’ என்று சொல்வது பெயர்ச்சொல்லிலேயே பகைமைத் தன்மையை அதிகமாகச் சேர்த்துவிடும்.
- source_word: μετὰ μαχαιρῶν
  choice: வாள்களை ஏந்திய
  rationale: μάχαιρα வாள் அல்லது குறுவாள் வகை ஆயுதத்தைக் குறிக்கலாம்; இச்சூழலில் ‘வாள்’ போதிய அகலத்துடன் நிலைபெற்ற தமிழ் இணைச்சொல். ‘ஏந்திய’ என்பது ஆயுதங்களோடு வந்தனர் என்ற பொருளை இயல்பாக்குகிறது.
- source_word: καὶ ξύλων
  choice: தடிகளையும்
  rationale: ξύλον அடிப்படையில் மரம் அல்லது மரத்துண்டு எனப் பொருள்பட்டாலும், இங்கு ஆயுதங்களின் பட்டியலில் பன்மையாக வருவதால் ‘தடிகள்’ சூழலுக்கேற்ற பொருளைத் தெளிவாகத் தருகிறது.
- source_word: ἀπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων τοῦ λαοῦ
  choice: முதன்மைக் குருக்களிடமிருந்தும் மக்களின் மூப்பர்களிடமிருந்தும் வந்திருந்தார்கள்
  rationale: ἀπό குறிக்கும் மூலம் அல்லது தொடர்பை ‘இடமிருந்து’ என்ற வடிவில் காக்கிறது. கூட்டம் அவர்களால் அனுப்பப்பட்டது என்பது சூழலில் சாத்தியமானாலும், மூலத்தில் ‘அனுப்பு’ என்ற வினை இல்லாததால் அதை முதன்மை உரையில் சேர்க்கவில்லை.
theological_decisions:
- issue: கூட்டம் யூதத் தலைவர்களால் அதிகாரபூர்வமாக அனுப்பப்பட்டது என்பதை வெளிப்படையாகச் சொல்ல வேண்டுமா?
  choice: அவர்கள் முதன்மைக் குருக்களிடமிருந்தும் மக்களின் மூப்பர்களிடமிருந்தும் வந்திருந்தார்கள்
  alternative: அவர்கள் முதன்மைக் குருக்களாலும் மக்களின் மூப்பர்களாலும் அனுப்பப்பட்டிருந்தார்கள்
  rationale: ἀπό கூட்டத்தின் மூலத்தையோ அது சார்ந்த இடத்தையோ குறிக்கிறது. சூழல் அதிகாரபூர்வ அனுப்புதலை உணர்த்தக்கூடும்; ஆனால் ‘அனுப்பப்பட்டார்கள்’ என்று முதன்மை உரையில் கூறுவது கிரேக்கத்தில் வெளிப்படையாக இல்லாத வினையைச் சேர்க்கும். எனவே மூலத்தின் நுட்பமான திறந்த தன்மை காக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்ற கவன ஈர்ப்புச் சொல் மூலத்தின் உயிரோட்டத்தைக் காக்கிறது. நீண்ட கிரேக்க வாக்கியம் தமிழில் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; கருத்துச் சார்பு மாற்றப்படவில்லை. ‘முதன்மைக் குருக்கள்’, ‘மூப்பர்கள்’ ஆகியவை சமயச் சூழலைத் தெளிவாகக் காட்டும், ஆனால் தேவையற்ற பழமையாக்கம் இல்லாத சொற்களாகத் தேர்ந்தெடுக்கப்பட்டன.
