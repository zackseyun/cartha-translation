  naturalness: நடை பொதுவாக நவீன நிலையான தமிழில் இயல்பாக உள்ளது. இருப்பினும் ‘அவர்கள் ... வந்திருந்தார்கள்’ என்பது முன்னரே ‘கூட்டமும் வந்தது’ எனக் கூறிய பின் தேவையற்ற மறுகூறலாகவும், ‘அவர்கள்’ என்ற தெளிவற்ற குறிப்பாகவும் அமைகிறது. திருத்தப்பட்ட வடிவம் ஒரே ஓட்டத்தில் இயல்பாக அமைகிறது.
