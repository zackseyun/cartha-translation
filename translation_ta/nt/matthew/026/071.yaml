  text: ἐξελθόντα ⸀δὲ εἰς τὸν πυλῶνα εἶδεν αὐτὸν ἄλλη καὶ λέγει ⸀τοῖς ἐκεῖ· ⸀Οὗτος ἦν μετὰ Ἰησοῦ τοῦ Ναζωραίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/071.yaml
  text: But when he had gone out to the gateway, another woman saw him and says to those there, “This man was with Jesus the Nazarene.”
translation:
  language: ta
  text: அவர் வெளியே வாசல் மண்டபத்திற்குச் சென்றபோது, வேறொரு பெண் அவரைக் கண்டு, அங்கிருந்தவர்களிடம், “இவன் நாசரேத்தினராகிய இயேசுவோடு இருந்தான்” என்று சொல்கிறாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πυλών
  choice: வாசல் மண்டபம்
  rationale: வீட்டு வளாகத்தின் வெளிவாயிலோடு சேர்ந்த நுழைவிடத்தைச் சுட்டுகிறது; வெறும் ‘வாசல்’ என்பதைவிட மூலச்சொல்லின் இடவியல் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: ἄλλη
  choice: வேறொரு பெண்
  rationale: பெண்பால் வடிவம் முன் குறிப்பிடப்பட்ட பணிப்பெண்ணிலிருந்து வேறொரு பெண்ணைக் குறிக்கிறது; தமிழில் பாலினத்தை வெளிப்படையாகச் சொல்லுதல் இயல்பும் தெளிவும் தருகிறது.
- source_word: λέγει
  choice: சொல்கிறாள்
  rationale: கதைநடையில் வரும் வரலாற்று நிகழ்காலத்தைப் பாதுகாக்க நிகழ்கால வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: Ἰησοῦ τοῦ Ναζωραίου
  choice: நாசரேத்தினராகிய இயேசு
  rationale: Ναζωραῖος இயேசுவை நாசரேத்துடன் அடையாளப்படுத்தும் பட்டப்பெயர்; இயல்பான தமிழில் அதைப் பிரதிபலிக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் கதைநடை. மூலத்தின் வரலாற்று நிகழ்காலமான ‘சொல்கிறாள்’ பாதுகாக்கப்பட்டுள்ளது; ‘இவனும்’ என்பதில் சூழலில் முன்பே எழுந்த அதே குற்றச்சாட்டோடு இணைப்பு இயல்பாக வெளிப்படுகிறது.
