lexical_decisions:
- source_word: ἐδύνατο
  choice: கொடுத்திருக்கலாமே
  rationale: இறந்தகாலத்தில் நிகழ்ந்திருக்கக்கூடிய, ஆனால் நிகழாத சாத்தியத்தைத் தமிழில் இயல்பாகக் காட்டுகிறது; இது ஒருங்கிணைந்த இரண்டு வினையெச்சங்களையும் ஆள்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய குறைகூறலுக்கான விளக்கக் காரணத்தை வெளிப்படுத்துகிறது.
- source_word: τοῦτο
  choice: இதை
  rationale: முன்னர் குறிப்பிடப்பட்ட பொருளைச் சுட்டும் நடுநிலை ஒருமைச் சுட்டுப்பெயரின் பொதுவான தன்மையைப் பாதுகாக்கிறது; ‘தைலம்’ போன்ற பெயர்ச்சொல்லை இங்கு சேர்க்கவில்லை.
- source_word: πραθῆναι
  choice: விற்று
  rationale: ‘விற்கப்படுதல்’ என்ற பொருளைத் தமிழ் செயப்பாட்டு ஒருங்கிணைப்பில் இயல்பாக வழங்குகிறது; பொருள் தானாக விற்கவில்லை, விற்கப்பட்டிருக்கும் என்பதைக் கட்டமைப்பு உணர்த்துகிறது.
- source_word: πολλοῦ
  choice: அதிக விலைக்கு
  rationale: விலையைக் குறிக்கும் கிரேக்க வேற்றுமை அமைப்பைத் தெளிவான நவீன தமிழில் தெரிவிக்கிறது; தொகையை அளவுக்கு மீறித் துல்லியப்படுத்தவில்லை.
- source_word: δοθῆναι
  choice: கொடுத்திருக்கலாமே
  rationale: ‘கொடுக்கப்படுதல்’ என்ற இறந்தகால நிகழாத சாத்தியத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; பெறுபவர் ‘ஏழைகளுக்கு’ என்று தெளிவாக இருப்பதால் தமிழ் வழக்கில் செயப்பாட்டு வடிவம் அவசியமில்லை.
- source_word: πτωχοῖς
  choice: ஏழைகளுக்கு
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட பன்மை உரிச்சொல்லின் கூட்டுப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
