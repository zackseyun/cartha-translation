id: MAT.26.62
reference: Matthew 26:62
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ὁ ἀρχιερεὺς εἶπεν αὐτῷ· Οὐδὲν ἀποκρίνῃ; τί οὗτοί σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/062.yaml
  text: And the high priest stood up and said to him[b][a], “Do you give no answer? What is it that these men are testifying against you?”
translation:
  language: ta
  text: தலைமைக் குரு எழுந்து அவரிடம், “நீ பதில் ஒன்றும் சொல்லவில்லையா? இவர்கள் உனக்கு எதிராக என்ன சாட்சி சொல்கிறார்கள்?” என்று கேட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς
  choice: எழுந்து
  rationale: இது தலைமைக் குரு பேசுவதற்கு முன் செய்த உடல் அசைவைக் குறிக்கிறது; தமிழில் இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: ὁ ἀρχιερεὺς
  choice: தலைமைக் குரு
  rationale: யூதர்களின் பிரதான குருத்துவப் பதவியைக் குறிக்கும் வழக்கமான, தெளிவான தமிழ் சொல்.
- source_word: εἶπεν αὐτῷ
  choice: அவரிடம் ... என்று கேட்டார்
  rationale: கிரேக்கத்தில் ‘அவரிடம் சொன்னார்’ என்றிருந்தாலும், தொடர்ந்து இரண்டு நேரடிக் கேள்விகள் வருவதால் தமிழில் ‘கேட்டார்’ என்பது உரையாடல் செயல்பாட்டை இயல்பாக வெளிப்படுத்துகிறது; ‘அவரிடம்’ என்பது மூலத்தின் சுட்டுப்பெயரைப் பேணுகிறது.
- source_word: Οὐδὲν ἀποκρίνῃ;
  choice: நீ பதில் ஒன்றும் சொல்லவில்லையா?
  rationale: ‘நீ ஒன்றும் பதிலளிக்கிறதில்லையா?’ என்ற நேரடி வடிவத்தின் பொருளை, இயல்பான நவீன தமிழ்க் கேள்வியாகத் தருகிறது; இயேசுவின் மௌனத்தைச் சுட்டும் கண்டிப்புத் தொனியும் தக்கவைக்கப்படுகிறது.
- source_word: οὗτοί
  choice: இவர்கள்
  rationale: அங்கு இருந்த ஆண்பால் பன்மைச் சாட்சிகளைக் குறிக்கும் சுட்டுப்பெயரை, தேவையற்ற விளக்கச் சொல் சேர்க்காமல் இயல்பாகத் தருகிறது.
- source_word: σου καταμαρτυροῦσιν
  choice: உனக்கு எதிராக ... சாட்சி சொல்கிறார்கள்
  rationale: καταμαρτυρέω என்பதன் நீதிமன்றச் சூழலிலான எதிர்மறைச் சாட்சியப் பொருளையும் நிகழ்கால வடிவையும் வெளிப்படுத்துகிறது.
- source_word: τί
  choice: என்ன
  rationale: எளிய வினாப்பெயரை நேரடியாகப் பேணி, சாட்சியின் உள்ளடக்கம் என்ன என்று கேட்கிறது.
