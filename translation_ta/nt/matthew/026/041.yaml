source:
  edition: SBLGNT
  text: γρηγορεῖτε καὶ προσεύχεσθε, ἵνα μὴ εἰσέλθητε εἰς πειρασμόν· τὸ μὲν πνεῦμα πρόθυμον ἡ δὲ σὰρξ ἀσθενής.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/041.yaml
  text: Stay awake and pray[a], so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.
translation:
  language: ta
  text: விழித்திருந்து ஜெபியுங்கள்; சோதனைக்குள்[a] நுழையாதபடி. ஆவி விருப்பமுள்ளதாய் இருக்கிறது; ஆனால் மாம்சம் பலவீனமாயிருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சோதனை” என்பதற்கான கிரேக்கச் சொல், பாவம் செய்யத் தூண்டும் தூண்டுதலையோ பரீட்சை அல்லது கடினமான சோதனையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: விழித்திருந்து
  rationale: சீடர்கள் தூங்கிய உடனடிச் சூழலில் உடலளவில் விழித்திருப்பதையும், அதனுடன் தொடர்புடைய விழிப்புணர்வையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: προσεύχεσθε
  choice: ஜெபியுங்கள்
  rationale: நிகழ்காலப் பன்மை ஏவலை நவீனத் தமிழில் தெளிவாகவும் வழக்கமாகவும் தருகிறது.
- source_word: ἵνα μὴ εἰσέλθητε
  choice: அப்போதுதான் நீங்கள் … நுழையாமல் இருப்பீர்கள்
  rationale: தடுக்கும் நோக்கத்தைக் காட்டும் ἵνα μή அமைப்பையும், ‘உள்ளே நுழைதல்’ என்ற கிரேக்க உருவகத்தையும் காக்கிறது.
- source_word: πειρασμόν
  choice: சோதனை
  rationale: இச்சூழலில் பாவத்திற்கு இழுக்கும் சோதனையைச் சுட்டக்கூடும்; அதேவேளை கிரேக்கச் சொல்லிலுள்ள பரீட்சை அல்லது கடினச் சோதனை என்ற விரிந்த பொருளை முற்றிலும் நீக்காத தமிழ்ச் சொல் இது.
- source_word: τὸ μὲν πνεῦμα
  choice: ஆவி
  rationale: மனிதனின் உள்ளார்ந்த விருப்பம் அல்லது மனப்பாங்கையே உடனடிச் சூழல் சுட்டுகிறது; இருப்பினும் πνεῦμα என்ற சொல்லை விளக்கிப் பதிலிடாமல் நேரடியாகக் காக்கிறது.
- source_word: πρόθυμον
  choice: ஆயத்தமாக இருக்கிறது
  rationale: விருப்பமும் தயார்நிலையும் கொண்ட πρόθυμος என்பதன் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἡ δὲ σὰρξ
  choice: ஆனால் மாம்சம்
  rationale: மனித பலவீனத்தை உடலாக மட்டும் குறுக்காமலும் ‘பாவ இயல்பு’ என்று மிகையாக விளக்காமலும், σάρξ என்பதன் வேதாகம உருவகத்தையும் ஆவி–மாம்சம் எதிர்மறையையும் காக்கிறது.
- source_word: ἀσθενής
  choice: பலவீனமாக இருக்கிறது
  rationale: ஆயத்தமான ஆவியுடன் மாறுபடும் மனித இயலாமையைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: πνεῦμα என்பதன் குறிப்பு
  choice: மனித ஆவி அல்லது உள்ளார்ந்த மனப்பாங்கு
  alternative: பரிசுத்த ஆவி
  rationale: மாம்சத்துடனான எதிர்மறையும், சீடர்களின் உண்மையான விருப்பத்திற்கும் அவர்களுடைய தோல்விக்கும் இடையிலான சூழலும் மனித ஆவியையே முதன்மையாகச் சுட்டுகின்றன. ‘ஆவி’ என்ற மொழிபெயர்ப்பு மூலச்சொல்லைத் தக்கவைத்து தேவையற்ற கோட்பாட்டு விளக்கத்தைத் தவிர்க்கிறது.
- issue: σάρξ என்பதன் பொருள்
  choice: மாம்சம்
  alternative: உடல்; பாவ இயல்பு
  rationale: இங்கு மனிதரின் பலவீனமே கருத்து; வளர்ச்சியடைந்த ஒரு தனிப்பட்ட ‘பாவ இயல்பு’ கோட்பாட்டை வசனத்தில் புகுத்தக்கூடாது. ‘உடல்’ என்பது பொருளை உடலளவுக்கு மட்டும் குறுக்கக்கூடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் மரியாதையான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆவி’, ‘மாம்சம்’ ஆகிய மூல உருவகங்கள் விளக்கிப் பதிலிடப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
