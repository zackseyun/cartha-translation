lexical_decisions:
- source_word: ἰδόντες
  choice: அதைக் கண்டபோது
  rationale: இறந்தகாலப் பங்கேற்புவினை இயல்பான தமிழில் கால உறவாக மொழிபெயர்க்கப்படுகிறது. கிரேக்கத்தில் விடப்பட்டுள்ள செயப்படுபொருள், முந்தைய வசனத்தில் கூறப்பட்ட அபிஷேகச் செயலைக் குறிக்கும் வகையில் ‘அதை’ என்று சூழலிலிருந்து நிரப்பப்பட்டுள்ளது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய செயலுக்கும் சீடர்களின் எதிர்மறையான எதிர்வினைக்கும் இடையிலான மென்மையான மாறுபாட்டைச் சுட்டுகிறது.
- source_word: οἱ μαθηταὶ
  choice: சீடர்கள்
  rationale: நற்செய்தி நூல் நடையில் μαθηταί என்பதற்கான இயல்பான, நிலையான தமிழ் சொல். மூலத்தில் வெளிப்படையாக இல்லாத ‘அவருடைய’ சேர்க்கப்படவில்லை.
- source_word: ἠγανάκτησαν
  choice: கோபமடைந்து
  rationale: இந்த வினை வலுவான அதிருப்தியையும் சீற்றத்தையும் குறிக்கிறது; சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான தமிழில் ‘கோபமடைந்து’ அதன் வலிமையைத் தக்கவைக்கிறது.
- source_word: λέγοντες
  choice: என்று கேட்டார்கள்
  rationale: நேரடிக் கூற்றாக இருந்தாலும் அதன் வடிவம் கேள்வி என்பதால், தமிழில் இயல்பாக ‘என்று கேட்டார்கள்’ என வழங்கப்படுகிறது.
- source_word: Εἰς τί
  choice: எதற்காக
  rationale: ‘எந்த நோக்கத்திற்காக?’ என்ற பொருளுடைய கேள்வியைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; நோக்கத்தையும் காரணத்தையும் தீர்மானிக்காமல் வைத்திருக்கிறது.
- source_word: ἡ ἀπώλεια αὕτη
  choice: இந்த வீணாக்கம்
  rationale: ἀπώλεια அழிவு, இழப்பு அல்லது வீணாக்கம் எனப் பொருள்படலாம். விலையுயர்ந்த நறுமணத் தைலம் ஊற்றப்பட்ட சூழலில் ‘வீணாக்கம்’ சீடர்களின் மதிப்பீட்டைத் தெளிவாகக் காட்டுகிறது.
