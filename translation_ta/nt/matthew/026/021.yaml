source:
  edition: SBLGNT
  text: καὶ ἐσθιόντων αὐτῶν εἶπεν· Ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/021.yaml
  text: And while they were eating[a], he said, “Truly I tell you, one of you will betray me.”
translation:
  language: ta
  text: 'அவர்கள் சாப்பிட்டுக்கொண்டிருந்தபோது, அவர், “உண்மையாகவே உங்களுக்குச் சொல்கிறேன்: உங்களில் ஒருவன் என்னைக் காட்டிக்கொடுப்பான்[a]” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் நேரடியாக, “என்னை ஒப்படைப்பான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσθιόντων αὐτῶν
  choice: அவர்கள் சாப்பிட்டுக்கொண்டிருந்தபோது
  rationale: இந்த genitive absolute அமைப்பு, அவர்கள் சாப்பிடுவதும் இயேசு பேசுவதும் ஒரே நேரத்தில் நிகழ்ந்ததைத் தெரிவிக்கிறது. இத்தமிழாக்கம் அந்தக் காலத் தொடர்பை இயல்பாகக் காக்கிறது.
- source_word: Ἀμὴν
  choice: உண்மையாகவே
  rationale: இயேசுவின் கூற்றை அறிமுகப்படுத்தும் உறுதியான, அதிகாரமிக்க வலியுறுத்தலை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: λέγω ὑμῖν
  choice: உங்களுக்குச் சொல்கிறேன்
  rationale: நேரடி பன்மை விளிப்பையும் நிகழ்காலச் சொல்லாட்சியையும் தெளிவாகக் காக்கிறது.
- source_word: εἷς ἐξ ὑμῶν
  choice: உங்களில் ஒருவன்
  rationale: பகுதிப் பொருளைக் குறிக்கும் கிரேக்கத் தொடரின் நேரடியான, இயல்பான தமிழாக்கம்.
- source_word: παραδώσει
  choice: காட்டிக்கொடுப்பான்
  rationale: வினையின் அடிப்படைப் பொருள் ‘ஒப்படைத்தல்’ என்றாலும், இச்சூழலில் நெருங்கிய ஒருவன் துரோகமாக இயேசுவை எதிரிகளிடம் ஒப்படைப்பது முன்னிலைப்படுகிறது. ‘காட்டிக்கொடுப்பான்’ என்பது அந்தச் சூழற்பொருளை இயல்பான தமிழில் தருகிறது; விரிவான சொற்பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: με
  choice: என்னை
  rationale: இயேசுவைக் குறிக்கும் நேரடி செயப்படுபொருள் ஒருமைப் பிரதிப்பெயர்.
theological_decisions:
- issue: பாடுகளின் சூழலில் παραδώσει என்பதன் மொழிபெயர்ப்பு
  choice: என்னைக் காட்டிக்கொடுப்பான்
  alternative: என்னை ஒப்படைப்பான்
  rationale: கிரேக்க வினை தனியாகப் பார்க்கும்போது ‘ஒப்படைப்பான்’ என்ற விரிவான பொருளைக் கொண்டது. ஆனால் இங்கு சீடர்களில் ஒருவன் துரோகமாக இயேசுவை எதிரிகளிடம் ஒப்படைப்பதைச் சூழல் காட்டுகிறது. முதன்மை உரை அந்த உறவுத் துரோகத்தை வெளிப்படுத்துகிறது; அடிக்குறிப்பு வினையின் பரந்த, அதிக நேரடியான பொருளைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் இயேசுவின் கூற்றுக்குரிய கண்ணியமும் தீவிரமும் நிலைக்குமாறும் மொழிபெயர்க்கப்பட்டது. நிறுத்தக்குறிகள் தமிழில் இயல்பான வாசிப்புக்கும் கூற்றின் வலியுறுத்தலுக்கும் ஏற்ப அமைக்கப்பட்டுள்ளன.
