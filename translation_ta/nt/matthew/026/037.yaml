  source_fidelity: கிரேக்க மூலத்தை நம்பகமாகப் பின்பற்றுகிறது. παραλαβών என்பதன் உடன்கொண்டு செல்லும் பொருள் “தம்முடன் அழைத்துக்கொண்டு” என்பதில் வெளிப்படுகிறது; பேதுருவும் செபெதேயுவின் இரு மகன்களும் மூலத்தில் உள்ளபடியே குறிப்பிடப்படுகின்றனர். ἤρξατο மற்றும் இணையான λυπεῖσθαι, ἀδημονεῖν ஆகியவை “துயரப்படவும் கடும் மனக்கலக்கம் அடையவும் தொடங்கினார்” எனத் தனித்தனியான தீவிரத்துடன் சரியாக மொழிபெயர்க்கப்பட்டுள்ளன.
  naturalness: நடை நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது. “தம்முடன் அழைத்துக்கொண்டு” மற்றும் “கடும் மனக்கலக்கம் அடைய” ஆகியவை இச்சூழலுக்கு தெளிவான, பொருத்தமான சொற்றொடர்கள்.
