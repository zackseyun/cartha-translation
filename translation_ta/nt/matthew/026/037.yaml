id: MAT.26.37
reference: Matthew 26:37
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ παραλαβὼν τὸν Πέτρον καὶ τοὺς δύο υἱοὺς Ζεβεδαίου ἤρξατο λυπεῖσθαι καὶ ἀδημονεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/037.yaml
  text: And taking Peter and the two sons of Zebedee with him[a], he began to be sorrowful and deeply distressed.
translation:
  language: ta
  text: பேதுருவையும் செபெதேயுவின் இரண்டு மகன்களையும் தம்முடன் அழைத்துக்கொண்டு, அவர் துயரப்படவும் கடும் மனக்கலக்கம் அடையவும் தொடங்கினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் வருந்தவும் மிகவும் கலங்கவும் தொடங்கினார்.”
    reason: λυπεῖσθαι மற்றும் ἀδημονεῖν ஆகியவற்றின் பொருள் வரம்பை இயல்பான மற்றொரு தமிழாக்கத்தில் காட்டும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: παραλαβὼν
  choice: தம்முடன் அழைத்துக்கொண்டு
  rationale: தேர்ந்தெடுக்கப்பட்ட சீடர்களை இயேசு தம்மோடு கூட்டிச் சென்றார் என்ற சூழல்சார் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τοὺς δύο υἱοὺς Ζεβεδαίου
  choice: செபெதேயுவின் இரண்டு மகன்கள்
  rationale: கிரேக்க மூலத்தில் உள்ள அடையாளப்படுத்தலை அப்படியே காக்கிறது; இவ்வசனத்தில் இல்லாத யாக்கோபு, யோவான் என்ற பெயர்களைச் சேர்க்கவில்லை.
- source_word: ἤρξατο
  choice: தொடங்கினார்
  rationale: இரண்டு தொடர்வினைகளின் ஆரம்பத்தைக் குறிக்கும் கிரேக்க வினையின் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: λυπεῖσθαι
  choice: துயரப்பட
  rationale: சாதாரண சோகத்தைவிட ஆழ்ந்த துயரத்தைச் சுட்டும் சொல்லாகவும், இக்காட்சிக்கேற்ற கண்ணியமான நவீனத் தமிழாகவும் உள்ளது.
- source_word: ἀδημονεῖν
  choice: கடும் மனக்கலக்கம் அடைய
  rationale: தீவிரமான உள்ளார்ந்த கலக்கம் மற்றும் நெருக்கடியை வெளிப்படுத்துகிறது; நம்பிக்கையற்ற விரக்தி என்ற பொருளை ஆதாரமின்றி சேர்ப்பதில்லை.
- source_word: καὶ ... καὶ
  choice: …வும் …வும்
  rationale: இணையாக நிற்கும் இரு உணர்ச்சி வினைகளையும் தமிழில் இயல்பாகவும் மூலத்தின் திரட்சியைப் பேணியும் இணைக்கிறது.
theological_decisions:
- issue: கிறிஸ்துவின் உணர்ச்சி நிலையை நேரடியாக விவரித்தல்
  choice: இயேசுவின் உண்மையான மனிதத் துயரத்தையும் கடும் மனக்கலக்கத்தையும் இரு தனித்த வெளிப்பாடுகளாக மொழிபெயர்த்தல்
  alternative: அவருடைய உணர்ச்சி வேதனையை மென்மைப்படுத்துதல் அல்லது அதை ‘பயங்கரம்’, ‘விரக்தி’ என மூலத்தைவிட மிகைப்படுத்துதல்
  rationale: இரு கிரேக்க வினைகளும் உண்மையான, தீவிரமான உணர்ச்சி வேதனையைத் தெரிவிக்கின்றன. அவற்றை மென்மைப்படுத்தாமலும் நம்பிக்கையற்ற விரக்தியாக மிகைப்படுத்தாமலும் மொழிபெயர்ப்பது மூலத்தின் இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கெத்செமனே நிகழ்வின் கண்ணியத்தையும் தீவிரத்தையும் காக்கும் நடை. மரியாதை ஒருமையான ‘அவர்/தம்முடன்’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
