id: MAT.26.33
reference: Matthew 26:33
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ· Εἰ πάντες σκανδαλισθήσονται ἐν σοί, ⸀ἐγὼ οὐδέποτε σκανδαλισθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/033.yaml
  text: But Peter answered him[a], “Even if all fall away because of you, I will never fall away.”
translation:
  language: ta
  text: ஆனால் பேதுரு பதிலளித்து அவரிடம், “உங்கள் காரணமாக எல்லாரும் விலகிப்போனாலும்[a], நான் ஒருபோதும் விலகிப்போக மாட்டேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இடறிப்போனாலும்,” “மனத்தடுமாற்றம் அடைந்தாலும்,” அல்லது “இடறச் செய்யப்பட்டாலும்” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் இடறுதல், ஒருவரால் மனத்தடுமாற்றம் அடைதல், அல்லது அவரைவிட்டு விலகிப்போதல் ஆகிய பொருள்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ
  choice: ஆனால் பேதுரு அவரிடம் … என்றார்
  rationale: ἀποκριθεὶς … εἶπεν என்ற கிரேக்கக் கதைநடைச் சேர்க்கையை இயல்பான தமிழில் ஒரே பேச்சு அறிமுகமாக வழங்குகிறது; δέ குறிக்கும் மிதமான எதிர்மறைத் திருப்பை ‘ஆனால்’ காட்டுகிறது; αὐτῷ ‘அவரிடம்’ எனத் தக்கவைக்கப்படுகிறது.
- source_word: Εἰ πάντες
  choice: எல்லாரும் … ஆனாலும்
  rationale: εἰ என்பதன் அடிப்படை நிபந்தனைப் பொருளையும், இச்சூழலில் உள்ள விட்டுக்கொடுக்கும் வலியுறுத்தலையும் தமிழின் ‘ஆனாலும்’ அமைப்பு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: σκανδαλισθήσονται / σκανδαλισθήσομαι
  choice: விலகிப்போனாலும் / விலகிப்போக மாட்டேன்
  rationale: சீடர்கள் இயேசுவுடனான பற்றுறுதியிலிருந்து அழுத்தத்தின் கீழ் பின்வாங்குவதே சூழல். ‘விலகிப்போ’ என்பது வெறும் உடல் இடறலைவிட அந்த உறவுசார் பொருளைத் தெளிவாகக் காட்டுகிறது; இறுதியான விசுவாசத்துரோகம் குறித்த கோட்பாட்டைத் தீர்மானிப்பதில்லை.
- source_word: ἐν σοί
  choice: உங்கள் காரணமாக
  rationale: இங்கு ἐν σοί என்பது ஒருவருடன் தொடர்புடைய காரணத்தால் இடறுதல் அல்லது விலகுதல் என்ற பொருளில் வருகிறது; ‘உங்கள் காரணமாக’ அந்த உறவை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐγὼ οὐδέποτε
  choice: நான் ஒருபோதும்
  rationale: வெளிப்படையாக வந்த ἐγώ பேதுருவை ‘எல்லாரும்’ என்பதிலிருந்து வேறுபடுத்தி வலியுறுத்துகிறது; οὐδέποτε-இன் காலமுற்ற மறுப்பை ‘ஒருபோதும் … மாட்டேன்’ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சீடத்துவத் தோல்வியின் சூழலில் σκανδαλίζω என்பதன் மொழிபெயர்ப்பு
  choice: விலகிப்போ
  alternative: இடறிப்போ; மனத்தடுமாற்றம் அடை; விழுந்துபோ
  rationale: இச்சூழலில் சீடர்கள் இயேசுவைப் பற்றிய தங்கள் நிலைப்பாட்டிலிருந்து பின்வாங்குவதை ‘விலகிப்போ’ இயல்பாகக் குறிக்கிறது. அதேவேளை, இது நிரந்தரமான விசுவாசத்துரோகமா என்ற இறையியல் கேள்வியை மொழிபெயர்ப்பு தானாகத் தீர்ப்பதில்லை; சொல்லின் விரிந்த உருவகப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பான ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பேதுருவின் தன்னம்பிக்கையும் ‘எல்லாரும்—நான்’ என்ற எதிர்மறை ஒப்பீடும் தெளிவாக வைக்கப்பட்டுள்ளன.
