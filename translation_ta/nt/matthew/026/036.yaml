id: MAT.26.36
reference: Matthew 26:36
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τότε ἔρχεται μετ’ αὐτῶν ὁ Ἰησοῦς εἰς χωρίον λεγόμενον Γεθσημανί, καὶ λέγει τοῖς μαθηταῖς· Καθίσατε αὐτοῦ ἕως οὗ ἀπελθὼν ⸂ἐκεῖ προσεύξωμαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/036.yaml
  text: Then Jesus comes with them to a place called Gethsemane[a], and he says to the disciples, “Sit here while I go over there and pray.”
translation:
  language: ta
  text: பின்பு இயேசு அவர்களுடன் கெத்செமனே என்னும் ஓர் இடத்திற்கு வந்து, சீடர்களிடம், “நான் அங்கே போய்ச் செபிக்கும்வரை நீங்கள் இங்கே உட்கார்ந்திருங்கள்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: பின்பு
  rationale: அடுத்த நிகழ்வை அறிமுகப்படுத்தும் காலத் தொடர்பை இயல்பான தமிழ் கதைநடையில் காட்டுகிறது.
- source_word: ἔρχεται
  choice: வந்து
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தைத் தமிழ் கதைநடைக்கு இயல்பான இறந்தகாலத் தொடர்வினையாக வழங்குகிறது; இயேசு அந்த இடத்தை அடைந்த செயலைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: μετ’ αὐτῶν
  choice: அவர்களுடன்
  rationale: உடன்செல்லுதலை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: χωρίον
  choice: ஓர் இடம்
  rationale: இந்தச் சொல் இடம், நிலப்பகுதி அல்லது உடைமைப்பகுதி எனப் பரந்த பொருள் தரலாம். மத்தேயு கூறாத ‘தோட்டம்’ என்ற விவரத்தைச் சேர்க்காமல் ‘இடம்’ எனப் பொதுவாக வழங்கப்படுகிறது.
- source_word: λεγόμενον Γεθσημανί
  choice: கெத்செமனே என்னும்
  rationale: இடப்பெயரை ஒலிபெயர்த்து, அதற்கு வழங்கப்பட்ட பெயர் என்பதைக் காட்டும் இயல்பான தமிழ்ச் சொற்றொடர்.
- source_word: λέγει τοῖς μαθηταῖς
  choice: சீடர்களிடம் … என்றார்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தை இயல்பான தமிழ் இறந்தகாலக் கதைநடையில் வழங்கி, சொல்லின் பெறுநர்களையும் தெளிவாகக் காட்டுகிறது.
- source_word: Καθίσατε αὐτοῦ
  choice: நீங்கள் இங்கே உட்கார்ந்திருங்கள்
  rationale: கட்டளையையும், இயேசு திரும்பும்வரை அங்கேயே இருக்க வேண்டிய சூழல்சார்ந்த கருத்தையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἕως οὗ
  choice: வரை
  rationale: கிரேக்கத்தின் கால எல்லையைத் தமிழில் நேரடியாகவும் இயல்பாகவும் காட்டுகிறது; ஆங்கிலத்தில் தேவைப்பட்ட ‘while/until’ விளக்கக்குறிப்பு தமிழில் தேவையில்லை.
- source_word: ἀπελθὼν ἐκεῖ
  choice: நான் அங்கே போய்
  rationale: முதலில் அங்கே சென்று, பின்னர் செபிக்கும் செயல்களின் வரிசையை இயல்பான தமிழ் வினையெச்ச அமைப்பில் பாதுகாக்கிறது; ‘இங்கே’ என்பதற்கு எதிரான இடச்சுட்டும் நிலைக்கிறது.
- source_word: προσεύξωμαι
  choice: செபிக்க
  rationale: இறைவனை நோக்கிச் செய்யும் வேண்டுதலைக் குறிக்கும், பரவலாகப் புரிந்துகொள்ளப்படும் மதிப்புடைய நவீன தமிழ்ச் சொல்.
theological_decisions:
- issue: கெத்செமனேயின் தன்மை
  choice: χωρίον என்பதற்கு ‘இடம்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘தோட்டம்’
  rationale: மத்தேயுவின் சொல் ஒரு இடம் அல்லது நிலப்பகுதியை மட்டுமே குறிப்பிடுகிறது. ‘தோட்டம்’ என்பது யோவான் 18:1-இலிருந்து வரும் விவரத்தை மத்தேயுவின் உரைக்குள் கொண்டுவரும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் மதிப்புமிக்க கதைநடையிலும் அமைக்கப்பட்டது. கிரேக்க வரலாற்று நிகழ்காலங்கள் தமிழில் இயல்பான இறந்தகாலக் கதைநடையாக வழங்கப்பட்டுள்ளன. ஆங்கில அடிக்குறிப்பு ஆங்கிலத்தின் ‘while/until’ நடைச்சிக்கலை மட்டும் விளக்குவதால், ‘வரை’ இயல்பாகவும் துல்லியமாகவும் இருக்கும் தமிழில் அது சேர்க்கப்படவில்லை.
