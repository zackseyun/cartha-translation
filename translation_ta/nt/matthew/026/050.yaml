revisions:
- from: ஆனால் இயேசு அவனிடம், “நண்பனே, நீ எதற்காக வந்தாயோ அதைச் செய்[a]” என்றார். பின்பு அவர்கள் அருகில் வந்து, இயேசுவின்மேல் கைகளைப் போட்டு அவரைப் பிடித்துக்கொண்டார்கள்.
  to: ஆனால் இயேசு அவனிடம், “நண்பனே, நீ எதற்காக வந்தாயோ அதைச் செய்[a]” என்றார். பின்பு அவர்கள் அருகில் வந்து, இயேசுவின்மேல் கைகளை வைத்து, அவரைப் பிடித்தார்கள்.
