id: MAT.26.50
reference: Matthew 26:50
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Ἑταῖρε, ἐφ’ ⸀ὃ πάρει. τότε προσελθόντες ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν καὶ ἐκράτησαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/050.yaml
  text: But Jesus said to him[a], “Friend, do what you came for.” Then they came up, laid hands on Jesus, and seized him.
translation:
  language: ta
  text: ஆனால் இயேசு அவனிடம், “நண்பனே, நீ எதற்காக வந்தாயோ அதைச் செய்[a]” என்றார். பின்பு அவர்கள் அருகில் வந்து, இயேசுவின்மேல் கைகளை வைத்து, அவரைப் பிடித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நண்பனே, நீ எதற்காக வந்தாய்?” கிரேக்கத் தொடர் மிகவும் சுருக்கமாக உள்ளது; அதை ஒரு கேள்வியாகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑταῖρε
  choice: நண்பனே
  rationale: யூதாசை நேரடியாக அழைக்கும் விளிப்புச் சொல். நவீன தமிழில் இயல்பாக இருக்கும்படியும், மிக நெருக்கமான பாசத்தையோ கடுமையான கண்டனத்தையோ தேவையின்றி சேர்க்காமலும் இந்தச் சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἐφ’ ὃ πάρει
  choice: நீ எதற்காக வந்தாயோ அதைச் செய்
  rationale: சுருக்கமான கிரேக்கத் தொடர், யூதாஸ் வந்த நோக்கத்தைச் செயல்படுத்தும்படி அனுமதிப்பதாகவோ வெளிப்படுத்துவதாகவோ புரிந்துகொள்ளப்படலாம். முதன்மை உரை அந்தச் சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது; கேள்வியாகப் புரிந்துகொள்ளும் வாய்ப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: προσελθόντες
  choice: அருகில் வந்து
  rationale: இயேசுவை நோக்கி நெருங்கிவந்த இயக்கத்தையும் அதைத் தொடர்ந்து நிகழ்ந்த செயலையும் தெளிவாகக் காட்டுகிறது.
- source_word: ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν
  choice: இயேசுவின்மேல் கைகளைப் போட்டு
  rationale: கைது செய்யும் நோக்கில் ஒருவரைப் பிடிக்க முற்படும் உடல்சார் செயலை, மூலத்தின் உருவக அமைப்பைத் தக்கவைத்தபடி இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐκράτησαν αὐτόν
  choice: அவரைப் பிடித்துக்கொண்டார்கள்
  rationale: வலுக்கட்டாயமாகப் பற்றிப் பிடித்ததைக் காட்டுகிறது; மூலத்தில் வெளிப்படையாக இல்லாத சட்டநுட்பத்தை ‘கைது செய்தார்கள்’ எனச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: யூதாசின் முந்தைய செயலுக்கும் இயேசுவின் பதிலுக்கும் இடையிலான மெல்லிய மாறுபாட்டை இயல்பாகக் குறிக்கிறது.
theological_decisions:
- issue: யூதாசிடம் இயேசு கூறிய சுருக்கமான பதிலின் பொருள்
  choice: “நண்பனே, நீ எதற்காக வந்தாயோ அதைச் செய்.”
  alternative: “நண்பனே, நீ எதற்காக வந்தாய்?”
  rationale: கிரேக்கத் தொடர் மிகவும் சுருக்கமாக இருப்பதால் கட்டளை அல்லது அனுமதி போன்ற கூற்றாகவும் கேள்வியாகவும் புரிந்துகொள்ளப்பட்டுள்ளது. முதன்மை உரை சூழலில் பரவலாக ஏற்கப்படும் பொருளைத் தருகிறது; உண்மையான தெளிவின்மையை மறைக்காமல் மாற்றுப் புரிதலை அடிக்குறிப்பில் வழங்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இயேசுவின் அழைப்பில் உள்ள கட்டுப்படுத்தப்பட்ட தொனியும், அவரது பதிலில் உள்ள பொருள் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
