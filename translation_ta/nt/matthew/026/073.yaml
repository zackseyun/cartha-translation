translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதாயும் பொதுவாசகர்களுக்கு எளிதில் புரியத்தக்கதாயும் அமைக்கப்பட்டுள்ளது. λαλιά என்பதன் பொருளை ‘உச்சரிப்பு’ என்று மட்டும் சுருக்காமல், மூலத்திலுள்ள சொற்பொருள் பரப்பை ‘பேச்சு’ என்பதன் மூலம் பாதுகாத்து அடிக்குறிப்பில் மாற்றுகளைத் தருகிறது.
