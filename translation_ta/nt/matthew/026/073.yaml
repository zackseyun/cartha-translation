source:
  edition: SBLGNT
  text: μετὰ μικρὸν δὲ προσελθόντες οἱ ἑστῶτες εἶπον τῷ Πέτρῳ· Ἀληθῶς καὶ σὺ ἐξ αὐτῶν εἶ, καὶ γὰρ ἡ λαλιά σου δῆλόν σε ποιεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/073.yaml
  text: After a little while[a], those standing there came up and said to Peter, “Surely you also are one of them, for even your accent makes you evident.”
translation:
  language: ta
  text: சிறிது நேரத்திற்குப் பிறகு, அங்கே நின்றுகொண்டிருந்தவர்கள் பேதுருவிடம் வந்து, “நிச்சயமாக நீயும் அவர்களில் ஒருவன்தான்; உன் பேச்சே[a] உன்னை அடையாளம் காட்டுகிறது” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீ பேசும் விதமே” அல்லது “உன் உச்சரிப்பே.” கிரேக்கச் சொல் பேச்சு, பேசும் விதம், அல்லது உச்சரிப்பு ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ μικρὸν
  choice: சிறிது நேரத்திற்குப் பிறகு
  rationale: சிறிய கால இடைவெளிக்குப் பிந்தைய நிகழ்வைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொற்றொடர்.
- source_word: δὲ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது கதையைத் தொடர்ந்து நகர்த்தும் மென்மையான இணைப்புச் சொல்; தமிழில் வாக்கியத் தொடர்ச்சியே அதன் பணியை இயல்பாக நிறைவேற்றுகிறது.
- source_word: προσελθόντες
  choice: வந்து
  rationale: பேதுருவை நோக்கி அணுகியதைக் குறிக்கிறது; சூழலில் ‘வந்து’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: οἱ ἑστῶτες
  choice: அங்கே நின்றுகொண்டிருந்தவர்கள்
  rationale: ‘நின்றுகொண்டிருந்தவர்கள்’ என்ற பங்கேற்பு வடிவத்தின் பொருளைப் பாதுகாத்து, காட்சியில் அவர்கள் அருகில் இருந்ததையும் தெளிவாக்குகிறது.
- source_word: εἶπον τῷ Πέτρῳ
  choice: பேதுருவிடம் ... என்றார்கள்
  rationale: கிரேக்கச் சொல்லமைப்பின் நேரடியான, இயல்பான தமிழ் இணை.
- source_word: Ἀληθῶς
  choice: நிச்சயமாக
  rationale: பேசுகிறவர்கள் தங்கள் கூற்றை உறுதியாக வலியுறுத்துவதை இயல்பான உரையாடல் தமிழில் வெளிப்படுத்துகிறது.
- source_word: καὶ σὺ
  choice: நீயும்
  rationale: பேதுருவும் அந்தக் குழுவைச் சேர்ந்தவன் என்ற உள்ளடக்கும் வலியுறுத்தலைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ἐξ αὐτῶν
  choice: அவர்களில் ஒருவன்
  rationale: ஒரு குழுவைச் சேர்ந்திருப்பதைக் குறிக்கும் கிரேக்க மரபுத்தொடரின் இயல்பான தமிழ் வடிவம்.
- source_word: καὶ γὰρ
  choice: ; ... -ஏ
  rationale: γάρ தரும் காரணத் தொடர்பை அரைப்புள்ளி வழியாகவும், καί தரும் வலியுறுத்தலை ‘பேச்சே’ என்ற ஏகாரத்தின் வழியாகவும் வெளிப்படுத்துகிறது.
- source_word: ἡ λαλιά σου
  choice: உன் பேச்சே
  rationale: λαλιά என்பது பேச்சு, பேசும் விதம், அல்லது உச்சரிப்பு ஆகியவற்றைக் குறிக்கக்கூடும். ‘பேச்சு’ மூலத்தின் பரந்த பொருளையும் சூழலின் இயல்பையும் பாதுகாக்கிறது.
- source_word: δῆλόν σε ποιεῖ
  choice: உன்னை அடையாளம் காட்டுகிறது
  rationale: ‘உன்னைத் தெளிவாகத் தெரியச் செய்கிறது’ என்ற நேரடிப் பொருளை இயல்பான தமிழில் தருகிறது; பேதுருவின் பேச்சு அவர் யார் என்பதை வெளிப்படுத்துவதாகக் குறிக்கிறது.
