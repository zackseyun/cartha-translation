  yaml_path: translation/nt/matthew/026/005.yaml
  text: But they were saying[a], “Not during the feast[b], lest there be an uproar among the people.”
translation:
  language: ta
  text: ஆனால் அவர்கள், “பண்டிகையின்போது[a] வேண்டாம்; மக்களிடையே கலகம் ஏற்பட்டுவிடக் கூடாது[b]” என்று சொல்லிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “விழாவின்போது.” இங்கே கிரேக்க ἑορτή என்பதற்கு “பண்டிகை” அல்லது “விழா” என்று பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “மக்களிடையே குழப்பம் ஏற்பட்டுவிடக் கூடாது” அல்லது “மக்களிடையே கலவரம் மூண்டுவிடக் கூடாது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: சொல்லிக்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வினை, ஆலோசனையின்போது தொடர்ந்து அல்லது திரும்பத் திரும்பப் பேசிக்கொண்டிருந்ததைக் காட்டுகிறது.
- source_word: δέ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட திட்டத்துக்கும் இங்கே வெளிப்படும் எச்சரிக்கைக்கும் இடையிலான மென்மையான முரண்பாட்டைக் காட்டுகிறது.
- source_word: Μὴ
  choice: வேண்டாம்
  rationale: கிரேக்கத்தில் வினை வெளிப்படையாக இல்லாத சுருக்கமான மறுப்பை, இயல்பான தமிழ் ஆலோசனை வடிவில் தருகிறது.
- source_word: ἐν τῇ ἑορτῇ
  choice: பண்டிகையின்போது
  rationale: ἐν என்பதன் காலப்பொருளை ‘போது’ தெளிவாக்குகிறது; ἑορτή இச்சூழலில் பஸ்கா பண்டிகையைக் குறிக்கிறது.
- source_word: ἵνα μὴ
  choice: ஏற்பட்டுவிடக் கூடாது
  rationale: தவிர்க்க விரும்பிய விளைவைக் குறிக்கும் நோக்கத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: θόρυβος
  choice: கலகம்
  rationale: பொதுமக்களிடையே ஏற்படக்கூடிய குழப்பத்தையும் கொந்தளிப்பையும் குறிக்கிறது; முழு அளவிலான கலவரம் என்று மிகைப்படுத்தவில்லை.
- source_word: γένηται
  choice: ஏற்பட்டுவிட
  rationale: ஒரு நிகழ்வு தோன்றுதல் அல்லது நிகழ்தல் என்ற பொருளைத் தருவதோடு, அஞ்சப்பட்ட விளைவு என்ற நுணுக்கத்தையும் இயல்பாகக் காட்டுகிறது.
- source_word: ἐν τῷ λαῷ
  choice: மக்களிடையே
  rationale: கூடியிருந்த பொதுமக்களின் நடுவில் என்பதைக் காலத்திற்கேற்ற இயல்பான தமிழில் தெரிவிக்கிறது.
