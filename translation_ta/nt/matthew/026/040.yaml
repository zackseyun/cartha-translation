  source_fidelity: மூலத்தின் வரலாற்று நிகழ்காலம் (‘வருகிறார்/காண்கிறார்/சொல்கிறார்’), சீடர்களிடம் வருதல், அவர்கள் தூங்கிக்கொண்டிருப்பதைக் காணுதல், பேதுருவிடம் உரைத்தல், மற்றும் கேள்வியின் இரண்டாம் நபர் பன்மை ஆகியவை துல்லியமாகப் பேணப்பட்டுள்ளன. பேதுருவைத் தனியாகச் சுட்டியபோதும் ‘உங்களால்’ எனப் பன்மையில் கேட்கும் மூலத்தின் எண்ணிக்கை மாற்றம் சரியாகத் தீர்க்கப்படாமல் வைக்கப்பட்டுள்ளது.
  naturalness: ‘அவர் சீடர்களிடம் வந்து, அவர்கள் தூங்கிக்கொண்டிருப்பதைக் காண்கிறார்’ மற்றும் ‘என்ன, ஒரு மணிநேரம்கூட என்னோடு விழித்திருக்க உங்களால் முடியவில்லையா?’ ஆகியவை நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளன. ‘என்ன’ என்பது Οὕτως-இன் வியப்பு/மென்மையான கடிந்துகொள்ளுதல் சார்ந்த பயன்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
