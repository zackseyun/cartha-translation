reference: Matthew 26:40
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἔρχεται πρὸς τοὺς μαθητὰς καὶ εὑρίσκει αὐτοὺς καθεύδοντας, καὶ λέγει τῷ Πέτρῳ· Οὕτως οὐκ ἰσχύσατε μίαν ὥραν γρηγορῆσαι μετ’ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/040.yaml
  text: And he comes to the disciples and finds them sleeping[a], and he says to Peter, “So[b], were you not able to stay awake with me for one hour?”
translation:
  language: ta
  text: அவர் சீடர்களிடம் வந்து, அவர்கள் தூங்கிக்கொண்டிருப்பதைக் காண்கிறார். பின்பு பேதுருவிடம், “என்ன, ஒரு மணிநேரம்கூட என்னோடு விழித்திருக்க[b] உங்களால் முடியவில்லையா?[a]” என்று சொல்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு மணிநேரம் என்னோடு விழித்திருக்க உங்களால் இயலவில்லையா?”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என்னோடு விழிப்புடன் காத்திருக்க.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: வந்து … காண்கிறார்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தின் காட்சித் தெளிவைப் பேணுவதற்காக முதன்மை வினை நிகழ்காலத்தில் தரப்பட்டுள்ளது; ‘வந்து’ என்பது தமிழில் இயல்பான இணை வினையெச்சம்.
- source_word: εὑρίσκει αὐτοὺς καθεύδοντας
  choice: அவர்கள் தூங்கிக்கொண்டிருப்பதைக் காண்கிறார்
  rationale: καθεύδοντας என்பதன் தொடர்நிலைச் செயலை ‘தூங்கிக்கொண்டிருப்பது’ தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: λέγει τῷ Πέτρῳ
  choice: பேதுருவிடம் … சொல்கிறார்
  rationale: தனி நபரான பேதுருவே நேரடி உரையின் பெறுநர் என்பதையும், கிரேக்க வரலாற்று நிகழ்காலத்தையும் பேணுகிறது.
- source_word: Οὕτως
  choice: என்ன
  rationale: இவ்விடத்தில் வரும் வியப்பும் மென்மையான கடிந்துகொள்ளுதலும் நவீன தமிழில் இயல்பாக ஒலிக்க இச்சொல் பயன்படுத்தப்பட்டுள்ளது; முற்றிலும் தர்க்கரீதியான ‘ஆகவே’ என்ற பொருள் திணிக்கப்படவில்லை.
- source_word: οὐκ ἰσχύσατε
  choice: உங்களால் முடியவில்லையா
  rationale: ἰσχύω இங்கு திறன் அல்லது ஆற்றலைக் குறிக்கிறது. ‘உங்களால்’ என்பது கிரேக்கத்தின் இரண்டாம் நபர் பன்மையைத் தெளிவாகப் பேணுகிறது.
- source_word: μίαν ὥραν
  choice: ஒரு மணிநேரம்கூட
  rationale: காலநீட்சியைக் குறிக்கும் accusative-ஐ இயல்பான தமிழில் தருகிறது; ‘கூட’ எதிர்மறை வினாவிலுள்ள கடிந்துகொள்ளும் வலியுறுத்தலை வெளிப்படுத்துகிறது.
- source_word: γρηγορῆσαι
  choice: விழித்திருக்க
  rationale: தூங்கிக்கொண்டிருந்த சீடர்களுடனான உடனடிச் சூழலில் விழிப்புடன் இருப்பதன் நேரடிப் பொருளை இது தெளிவாக்குகிறது; காவல் அல்லது விழிப்புணர்வு சார்ந்த நுணுக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: μετ’ ἐμοῦ
  choice: என்னோடு
  rationale: உடனிருப்பைக் குறிக்கும் இயல்பான, நேரடியான தமிழ் வடிவம்.
theological_decisions:
- issue: பேதுருவிடம் பேசினாலும் ἰσχύσατε என்ற வினை பன்மையில் இருப்பது
  choice: ‘பேதுருவிடம்’ என்ற தனி பெறுநரையும் ‘உங்களால்’ என்ற பன்மைக் கடிந்துகொள்ளுதலையும் அப்படியே வைத்தல்
  alternative: கேள்வியைப் பேதுருவுக்கு மட்டும் உரிய ஒருமையாக மாற்றுதல் அல்லது அவர் குழுவின் பிரதிநிதி என்று வெளிப்படையாகச் சேர்த்தல்
  rationale: இயேசு பேதுருவிடம் சொல்கிறார் என்று கிரேக்கம் கூறினாலும், கேள்வியில் இரண்டாம் நபர் பன்மையைப் பயன்படுத்துகிறது. இந்த எண்ணிக்கை மாற்றத்தை விளக்கவுரையால் சரிசெய்யாமல் மூலத்தின் பதற்றத்தோடு பேணப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டுள்ளது. வரலாற்று நிகழ்காலம் காட்சித் தெளிவுக்காகப் பேணப்பட்டுள்ளது. நேரடி உரையில் ‘உங்களால்’ என்ற பன்மை திட்டமிட்டு வைக்கப்பட்டுள்ளது; இது பேதுருவை நோக்கிப் பேசினாலும் மற்ற சீடர்களையும் உள்ளடக்கும் கிரேக்க வடிவத்தைத் தீர்த்துவிடாமல் பிரதிபலிக்கிறது.
