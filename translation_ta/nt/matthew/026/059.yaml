  text: οἱ δὲ ἀρχιερεῖς ⸀καὶ τὸ συνέδριον ὅλον ἐζήτουν ψευδομαρτυρίαν κατὰ τοῦ Ἰησοῦ ὅπως ⸂αὐτὸν θανατώσωσιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/059.yaml
  text: The chief priests and the whole council were seeking false testimony against Jesus so that they might put him to death[b][a],
translation:
  language: ta
  text: இயேசுவைக் கொல்லும் நோக்கத்துடன், தலைமை ஆசாரியர்களும் மன்றம் முழுவதும்[a] இயேசுவுக்கு எதிராகப் பொய்ச் சாட்சியத்தை[b]த் தேடிக்கொண்டிருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சனெத்ரின் முழுவதும்.’ இச்சொல் யூதர்களின் ஆட்சிமன்றத்தைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘பொய்யான சாட்சியுரை’ அல்லது ‘பொய்ச் சாட்சி அளிப்பவர்.’ கிரேக்கச் சொல் சட்டச் சூழலில் பொய்யான சாட்சியத்தையோ பொய்ச் சாட்சி அளிப்பவரையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: தனி இணைப்புச்சொல் இன்றி வாக்கியம் தொடங்கப்படுகிறது
  rationale: δὲ இங்கு மென்மையான கதைத் தொடர்ச்சியைக் குறிக்கிறது; தமிழில் ‘ஆனால்’ என்று மொழிபெயர்த்தால் இல்லாத வலுவான முரண்பாடு தோன்றும், ‘அப்போது’ என்றால் வெளிப்படையாக இல்லாத காலப்பொருள் சேரும்.
- source_word: ἀρχιερεῖς
  choice: தலைமை ஆசாரியர்கள்
  rationale: இது அக்காலத்தின் மூத்த ஆசாரியத் தலைமையைக் குறிக்கிறது; பலர் ஒரே நேரத்தில் பிரதான ஆசாரியர் பதவியில் இருந்ததாகப் பொருள்படாமல் தமிழில் தெளிவாக உள்ளது.
- source_word: συνέδριον ὅλον
  choice: மன்றம் முழுவதும்
  rationale: ὅλον என்பதன் முழுமையையும், συνέδριον என்பதன் ஆட்சிமன்றப் பொருளையும் இயல்பான தமிழில் காக்கிறது; வரலாற்றுச் சிறப்புப் பெயர் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ἐζήτουν
  choice: தேடிக்கொண்டிருந்தனர்
  rationale: முற்றுப்பெறாத இறந்தகால வினையின் தொடர்ச்சியான முயற்சியைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ψευδομαρτυρίαν
  choice: பொய்ச் சாட்சியம்
  rationale: சட்ட விசாரணைச் சூழலில் பொய்யான சாட்சியுரையையோ சான்றையையோ குறிக்க ஏற்ற, பொதுவாகப் புரியும் சொல்; ‘பொய்ச் சாட்சி’ என்ற மாற்றும் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: இயேசுவுக்கு எதிராக
  rationale: κατά + genitive இங்கு நீதிசார் எதிர்ப்பைத் தெளிவாகக் குறிக்கிறது.
- source_word: ὅπως αὐτὸν θανατώσωσιν
  choice: அவரைக் கொன்றுவிடுவதற்காகவே அப்படிச் செய்தனர்
  rationale: நோக்கத்தைக் குறிக்கும் ὅπως கூறை இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது; ‘மரண தண்டனை விதிக்க’ என்று மொழிபெயர்த்து கிரேக்கத்தில் வெளிப்படையாக இல்லாத தீர்ப்பளிக்கும் நுணுக்கத்தைச் சேர்ப்பது தவிர்க்கப்படுகிறது.
theological_decisions:
- issue: தலைவர்களின் நீதிசார் நோக்கம்
  choice: பொய்ச் சாட்சியத்தைத் தொடர்ந்து தேடியதும், இயேசுவைக் கொல்வதே அதன் நோக்கம் என்பதும் வெளிப்படையாக வைக்கப்படுகிறது.
  alternative: ‘இயேசுவைக் கொல்லப் பொய்ச் சாட்சி தேடினர்’ என்று சுருக்கமாக மொழிபெயர்க்கலாம்.
  rationale: ἐζήτουν என்ற தொடர்நிலை வினையும் ὅπως...θανατώσωσιν என்ற நோக்கக் கூறும் திட்டமிட்ட, நீடித்த முயற்சியைச் சித்தரிக்கின்றன. மொழிபெயர்ப்பு இதைக் காக்கிறது; கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் நீதிசார் சூழலின் தீவிரமும் காக்கப்பட்டுள்ளன. மிகப் பழமையான நடை மற்றும் தேவையற்ற வடமொழிச் செறிவு தவிர்க்கப்பட்டுள்ளன; ‘ஆசாரியர்கள்’ என்பது வாசகர்களுக்குப் பழக்கமான வேதாகமச் சூழல் சொல்லாகத் தக்கவைக்கப்பட்டுள்ளது.
