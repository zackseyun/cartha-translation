revisions:
- from: தலைமை ஆசாரியர்களும் மன்றம் முழுவதும்[a] இயேசுவுக்கு எதிராகப் பொய்ச் சாட்சியத்தை[b] தேடிக்கொண்டிருந்தனர்; அவரைக் கொன்றுவிடுவதற்காகவே அப்படிச் செய்தனர்.
  to: இயேசுவைக் கொல்லும் நோக்கத்துடன், தலைமை ஆசாரியர்களும் மன்றம் முழுவதும்[a] இயேசுவுக்கு எதிராகப் பொய்ச் சாட்சியத்தை[b]த் தேடிக்கொண்டிருந்தனர்.
