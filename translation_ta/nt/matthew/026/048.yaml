  edition: SBLGNT
  text: ὁ δὲ παραδιδοὺς αὐτὸν ἔδωκεν αὐτοῖς σημεῖον λέγων· Ὃν ἂν φιλήσω αὐτός ἐστιν· κρατήσατε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/048.yaml
  text: The one betraying him had given them a sign[a], saying, “The one I kiss is he[b]; seize him.”
translation:
  language: ta
  text: அவரைக் காட்டிக்கொடுப்பவன்[a] அவர்களுக்கு முன்பே ஓர் அடையாளத்தை[b] கொடுத்து, “நான் யாரை முத்தமிடுகிறேனோ, அவர்தான்; அவரைப் பிடித்துக்கொள்ளுங்கள்” என்று சொல்லியிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “அவரை ஒப்படைப்பவன்.” கிரேக்க வினை “ஒப்படைத்தல்” என்றும் பொருள்படலாம்; இச்சூழலில் அது யூதாஸ் செய்த துரோகத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “சமிக்ஞை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδιδοὺς
  choice: காட்டிக்கொடுப்பவன்
  rationale: இச்சொல் அடிப்படையில் ஒருவரை மற்றவர்களிடம் ஒப்படைப்பதைக் குறிக்கலாம்; ஆனால் இங்கு யூதாஸ் இயேசுவுக்கு நம்பிக்கைத் துரோகம் செய்து எதிரிகளிடம் காட்டிக்கொடுப்பதைக் கதைச்சூழல் தெளிவுபடுத்துகிறது.
- source_word: σημεῖον
  choice: அடையாளம்
  rationale: இங்கு கைது செய்ய வந்தவர்கள் இயேசுவை அடையாளம் காண உதவும் முன்கூட்டியே ஏற்பாடு செய்யப்பட்ட குறியீட்டை இச்சொல் குறிக்கிறது.
- source_word: Ὃν ἂν φιλήσω
  choice: நான் யாரை முத்தமிடுகிறேனோ
  rationale: ἄν உடன் வரும் தொடர்புச் சொற்றொடரின் வரையறுக்கப்படாத தன்மையையும், முத்தமிடப்படும் நபரை அடையாளம் காட்டும் செயல்பாட்டையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: φιλήσω
  choice: முத்தமிடுகிறேனோ
  rationale: அடையாளம் காட்டும் செயலாகிய முத்தத்தையே நேரடியாகக் கூறுகிறது; ‘முத்தமிட்டு வாழ்த்துதல்’ என்று மூலத்தில் இல்லாத விவரத்தைச் சேர்க்கவில்லை.
- source_word: αὐτός ἐστιν
  choice: அவர்தான் அவர்
  rationale: αὐτός தரும் வலியுறுத்தலையும், குறிப்பிட்ட நபர் அவரே என்ற அடையாளப்படுத்துதலையும் தக்கவைக்கிறது.
- source_word: κρατήσατε
  choice: பிடித்துக்கொள்ளுங்கள்
  rationale: கிரேக்க வினை உறுதியாகப் பற்றிப் பிடித்தல் அல்லது கைப்பற்றுதல் என்பதைக் குறிக்கிறது; கைது நிகழும் சூழலைத் தக்கவைத்தபடியே மூலத்தில் வெளிப்படையாக இல்லாத சட்ட நடைமுறைச் சொல்லைத் தவிர்க்கிறது.
theological_decisions:
- issue: யூதாஸைக் குறிக்கும் παραδιδοὺς என்பதன் அறநெறிசார் வலிமை
  choice: காட்டிக்கொடுப்பவன்
  alternative: ஒப்படைப்பவன்
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘ஒப்படைத்தல்’ என்றாலும், பாடுபாட்டு நிகழ்வின் உடனடிச் சூழலில் இது யூதாஸின் துரோகச் செயலைக் குறிக்கிறது. ‘காட்டிக்கொடுப்பவன்’ என்பது அந்தச் சூழல்சார் வலிமையைப் பேணுகிறது; அதேவேளை தனிப்பட்ட கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ἔδωκεν என்பதன் இச்சூழலிலான முன்னிகழ்வுத் தன்மையை ‘முன்னதாகக் கொடுத்து … சொல்லியிருந்தான்’ என்று வெளிப்படுத்தப்பட்டுள்ளது; δέ-க்கு மூலத்தில் இல்லாத ‘இப்போது’ போன்ற காலச் சொல்லைச் சேர்க்கவில்லை.
