id: MAT.26.43
reference: Matthew 26:43
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ⸂πάλιν εὗρεν αὐτοὺς⸃ καθεύδοντας, ἦσαν γὰρ αὐτῶν οἱ ὀφθαλμοὶ βεβαρημένοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/043.yaml
  text: And coming again[a], he found them sleeping, for their eyes were weighed down.
translation:
  language: ta
  text: அவர் மீண்டும் வந்து, அவர்கள் தூங்கிக்கொண்டிருப்பதைக் கண்டார்; ஏனெனில் அவர்களுடைய கண்கள் கனத்திருந்தன.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν
  choice: வந்து
  rationale: இறந்தகால வினையெச்சம் முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் காட்டுகிறது; ‘வந்து’ என்பது இயல்பான தமிழில் அதன் தொடரோட்டத்தைப் பேணுகிறது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: செயல் மறுபடியும் நிகழ்ந்ததைத் தெளிவாகவும் சுருக்கமாகவும் குறிக்கிறது.
- source_word: εὗρεν
  choice: கண்டார்
  rationale: கதைநடையில் εὑρίσκω என்பதன் இயல்பான பொருள் ‘கண்டார்’; எழுவாய் சூழலிலிருந்து இயேசுவைக் குறிக்கிறது.
- source_word: καθεύδοντας
  choice: தூங்கிக்கொண்டிருப்பதை
  rationale: அவர் வந்தபோது தொடர்ந்துகொண்டிருந்த அவர்களின் செயலை நிகழ்நிலைப் பங்கேற்புவினை காட்டுவதால், தொடர்நிலையை இத்தமிழ் வடிவம் வெளிப்படுத்துகிறது.
- source_word: ἦσαν γὰρ
  choice: ஏனெனில் ... இருந்தன
  rationale: γάρ அவர்கள் தூங்கியதற்கான விளக்கத்தை அளிக்கிறது; ‘ஏனெனில்’ அந்தக் காரணத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: αὐτῶν οἱ ὀφθαλμοὶ
  choice: அவர்களுடைய கண்கள்
  rationale: கிரேக்க உடைமை அமைப்பின் இயல்பான தமிழ் வடிவம்.
- source_word: βεβαρημένοι
  choice: கனத்திருந்தன
  rationale: βαρέω என்பதன் நிறைவுற்ற செயலால் ஏற்பட்ட தொடரும் நிலையைத் தெரிவிக்கிறது; தமிழில் கண்கள் தூக்கத்தால் கனத்திருந்த நிலையை இயல்பாகவும் மூலத்திற்கு நெருக்கமாகவும் கூறுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான கதைநடை. ‘கண்கள் கனத்திருந்தன’ என்பது கிரேக்கத்தின் உருவகத்தை இயல்பாகப் பேணுவதால் அடிக்குறிப்பு தேவையில்லை.
