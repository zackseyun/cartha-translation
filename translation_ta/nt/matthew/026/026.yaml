source:
  edition: SBLGNT
  text: Ἐσθιόντων δὲ αὐτῶν λαβὼν ὁ Ἰησοῦς ⸀ἄρτον καὶ ⸀εὐλογήσας ἔκλασεν καὶ ⸂δοὺς τοῖς μαθηταῖς⸃ εἶπεν· Λάβετε φάγετε, τοῦτό ἐστιν τὸ σῶμά μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/026.yaml
  text: While they were eating[a], Jesus took bread, and after blessing it, he broke it and gave it to the disciples and said, “Take, eat[d][c][b]; this is my body.”
translation:
  language: ta
  text: அவர்கள் சாப்பிட்டுக்கொண்டிருந்தபோது[a], இயேசு அப்பத்தை எடுத்து, ஆசீர்வதித்து[b], அப்பத்தைப் பிட்டு, சீடர்களுக்குக் கொடுத்து, “எடுத்துக்கொள்ளுங்கள், சாப்பிடுங்கள்[c]; இது என் உடல்[d]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் சாப்பிட்டுக்கொண்டிருக்கையில்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஆசீர்வாதம் கூறி.” சிலர் இதை அப்பத்தின்மேல் நன்றி செலுத்திய செயல் என்று புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “எடுத்துக்கொண்டு சாப்பிடுங்கள்.” கிரேக்கத்தில் இணைப்புச்சொல் இல்லாமல் இரண்டு கட்டளைகள் அடுத்தடுத்து வருகின்றன.
    reason: lexical_alternative
  - marker: d
    text: கிரேக்கத்தில் சொற்சொல்லாக, “இது என் உடல்” என்றே உள்ளது. சிலர் இதை “இது என் உடலைக் குறிக்கிறது” என்று விளக்குகிறார்கள்; இம்மொழிபெயர்ப்பு மூலத்தின் சொற்களைத் தக்கவைக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐσθιόντων δὲ αὐτῶν
  choice: அவர்கள் சாப்பிட்டுக்கொண்டிருந்தபோது
  rationale: முற்றுப்பெறாமல் தொடர்ந்துகொண்டிருந்த செயலைக் காலப் பின்னணியாகக் காட்டும் genitive absolute அமைப்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது. δέ இங்கு வலுவான முரண்பாட்டைக் குறிக்காததால் தனியாக மொழிபெயர்க்கப்படவில்லை.
- source_word: λαβὼν
  choice: எடுத்து
  rationale: முதன்மைச் செயலுக்கு முன் நிகழ்ந்த செயலைத் தமிழில் இயல்பான வினையெச்சத் தொடராக வழங்குகிறது.
- source_word: ἄρτον
  choice: அப்பத்தை
  rationale: ἄρτος என்பதன் வழக்கமான பொருள் ‘அப்பம்’; உணவுச் சூழலில் இது ஓர் அப்பத்தையோ அப்பத் துண்டையோ குறிக்கலாம். தேவையற்ற துல்லியத்தைச் சேர்க்காமல் மூலத்தின் பொதுவான சொல்லைத் தக்கவைக்கிறது.
- source_word: εὐλογήσας
  choice: ஆசீர்வதித்து
  rationale: அப்பம் அல்லது உணவின்மேல் ஆசீர்வாதம் கூறிய செயலைக் குறிக்கும் இயல்பான நேரடி மொழிபெயர்ப்பு. இதை εὐχαριστέω என்பதுபோல் ‘நன்றி செலுத்தி’ என்று மட்டும் குறுக்கிவிடவில்லை.
- source_word: ἔκλασεν
  choice: அதைப் பிட்டு
  rationale: ἔκλασεν என்பதன் ‘உடைத்தார்/பிட்டார்’ என்ற பொருளை அப்பத்துக்கு இயல்பான தமிழில் தெரிவிக்கிறது; ‘அதை’ என்பது அப்பத்தைச் சுட்டுகிறது.
- source_word: δοὺς τοῖς μαθηταῖς
  choice: சீடர்களுக்குக் கொடுத்து
  rationale: கிரேக்கப் பெயரெச்சத் தொடரை இயல்பான தமிழ் வினையெச்சத் தொடராக வழங்குகிறது. மூலத்தில் வெளிப்படையாக இல்லாத ‘தமது’ என்பதைக் கூட்டவில்லை.
- source_word: Λάβετε φάγετε
  choice: எடுத்துக்கொள்ளுங்கள், சாப்பிடுங்கள்
  rationale: இணைப்புச்சொல் இல்லாமல் அடுத்தடுத்து வரும் இரண்டு கட்டளைகளையும் தனித்தனியாகத் தக்கவைக்கிறது; அதேவேளை சாதாரண நவீனத் தமிழில் தெளிவாக உள்ளது.
- source_word: τοῦτό ἐστιν
  choice: இது
  rationale: தமிழின் இயல்பான பெயர்ப்பயனிலை வாக்கியத்தில் நிகழ்கால ‘இருக்கிறது’ வெளிப்படையாகத் தேவையில்லை. ‘இது என் உடல்’ என்பது ἐστιν-ஐ ‘குறிக்கிறது’ என்று விளக்காமல் அதன் நேரடியான வலிமையைத் தக்கவைக்கிறது.
- source_word: τὸ σῶμά μου
  choice: என் உடல்
  rationale: σῶμα மற்றும் μου ஆகியவற்றை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
theological_decisions:
- issue: இயேசுவின் இறுதி இரவுணவு உரையில் ‘இது என் உடல்’ என்ற சொற்றொடர்
  choice: τοῦτό ἐστιν τὸ σῶμά μου என்பதை ‘இது என் உடல்’ என்று விளக்க விரிவாக்கமின்றி வழங்குதல்
  alternative: ‘இது என் உடலைக் குறிக்கிறது’ அல்லது ‘இது என் உடலுக்கு அடையாளம்’
  rationale: கிரேக்கத்தில் எளிய இணைப்புவினையான ἐστιν உள்ளது. ஒரு குறிப்பிட்ட திருவிருந்து அல்லது நற்கருணைக் கோட்பாட்டை மொழிபெயர்ப்பில் புகுத்தாமல், மூலத்தின் இறையியல் அழுத்தத்தையும் விளக்கத் திறந்த நிலையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் மரியாதையான நடையிலும் அமைக்கப்பட்டுள்ளது. ‘சாப்பிடுங்கள்’ என்பது இன்றைய இயல்பான பயன்பாடு; ‘எடுத்துக்கொள்ளுங்கள், சாப்பிடுங்கள்’ என்பது மூலத்திலுள்ள இரு தனிக் கட்டளைகளையும் பாதுகாக்கிறது. வசனத்தின் இறையியல் பலபொருள் வாய்ப்பு விளக்கத்தால் தீர்க்கப்படாமல் தக்கவைக்கப்பட்டுள்ளது.
