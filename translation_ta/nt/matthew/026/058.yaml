source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος ἠκολούθει αὐτῷ ἀπὸ μακρόθεν ἕως τῆς αὐλῆς τοῦ ἀρχιερέως, καὶ εἰσελθὼν ἔσω ἐκάθητο μετὰ τῶν ὑπηρετῶν ἰδεῖν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/058.yaml
  text: But Peter was following him from a distance[a], as far as the courtyard of the high priest. And after going inside[b], he sat with the officers to see the outcome.
translation:
  language: ta
  text: ஆனால் பேதுரு தொலைவிலிருந்து அவரைப் பின்தொடர்ந்துகொண்டே தலைமைக் குருவின் முற்றம்வரை சென்றார். உள்ளே நுழைந்து, பேதுரு முடிவை[b]ப் பார்ப்பதற்காக அலுவலர்களோடு[a] உட்கார்ந்திருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அலுவலர்கள்’ என்பதற்கு ‘பணியாளர்கள்,’ ‘உதவியாளர்கள்,’ அல்லது ‘காவலர்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ὑπηρέται கீழ்நிலை அலுவலர்களையோ உதவியாளர்களையோ குறிக்கலாம்; இங்கு அவர்களின் துல்லியமான பங்கு தெளிவாகக் கூறப்படவில்லை.
    reason: lexical_alternative
  - marker: b
    text: ‘முடிவு’ என்பது நேரடியாக ‘இறுதி’ என்றும் பொருள்படலாம்; இச்சூழலில் இயேசுவுக்கு என்ன நேரும் என்பதன் விளைவைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: பின்தொடர்ந்து … வந்தார்
  rationale: முற்றம்வரை நீடித்துச் சென்ற செயலை இயல்பான தமிழில் காட்டுகிறது; இறந்தகால imperfect-இன் தொடர்ச்சியான பின்னணி உணர்வும் காக்கப்படுகிறது.
- source_word: ἀπὸ μακρόθεν
  choice: தொலைவிலிருந்து
  rationale: உடல் சார்ந்த இடைவெளியைத் தெளிவாகவும் இயல்பான நவீன தமிழிலும் தெரிவிக்கிறது.
- source_word: ἕως τῆς αὐλῆς
  choice: முற்றம்வரை
  rationale: ἕως குறிக்கும் எல்லையையும், αὐλή குறிக்கும் சூழப்பட்ட திறந்த முற்றத்தையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ἀρχιερέως
  choice: தலைமைக் குரு
  rationale: நற்செய்தி நூல்களின் இச்சூழலில் ἀρχιερεύς என்பதற்கான தெளிவான, வழக்கமான தமிழ் பதம்.
- source_word: εἰσελθὼν ἔσω
  choice: உள்ளே நுழைந்து
  rationale: பிரதான வினைக்கு முன் நிகழ்ந்த நுழைதலை இயல்பான தமிழ் வினையெச்சத்தால் காட்டுகிறது.
- source_word: ἐκάθητο
  choice: உட்கார்ந்திருந்தார்
  rationale: imperfect வடிவம் காட்டும் நீடித்த நிலையை ‘உட்கார்ந்திருந்தார்’ துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: μετὰ τῶν ὑπηρετῶν
  choice: பணியாளர்களோடு
  rationale: ὑπηρέται என்பதன் கீழ்நிலைப் பணியாளர்கள் அல்லது உதவியாளர்கள் என்ற பரந்த பொருளைக் காக்கிறது; அவர்களை வீட்டு வேலைக்காரர்கள் அல்லது ஆயுதக் காவலர்கள் என்று தேவையின்றிக் குறுக்கவில்லை.
- source_word: ἰδεῖν
  choice: பார்ப்பதற்காக
  rationale: இறுதிநிலை வினைச்சொல்லின் நோக்கப் பொருளை நேரடியாகக் காட்டுகிறது.
- source_word: τὸ τέλος
  choice: முடிவை
  rationale: ‘முடிவு’ என்பது சொற்றொடரின் நேரடியான பொருளையும், நிகழப்போகிறவற்றின் விளைவு என்ற சூழல் பொருளையும் திறந்த நிலையில் வைத்திருக்கிறது.
