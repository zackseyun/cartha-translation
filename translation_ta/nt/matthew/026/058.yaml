  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. கிரேக்க imperfect வினைகளின் தொடர்ச்சியான உணர்வு இயல்பான தமிழ் வடிவங்களில் வெளிப்படுத்தப்பட்டுள்ளது. மூலத்தில் இல்லாத நீதிமன்ற அல்லது காவல் சார்ந்த குறிப்பிட்ட பொருள் முதன்மை உரையில் சேர்க்கப்படவில்லை.
