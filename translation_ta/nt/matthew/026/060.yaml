  text: and they did not find any[a], though many false witnesses had come forward. But later two came forward
translation:
  language: ta
  text: பொய்ச் சாட்சிகள் பலர் முன்வந்தபோதிலும், அவர்கள் எதையும் கண்டுபிடிக்கவில்லை[a]. ஆனால் பின்னர் இருவர் முன்வந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் ஒன்றையும் கண்டுபிடிக்கவில்லை.” தேடப்பட்ட சாட்சியையோ குற்றச்சாட்டையோ இது குறிக்கிறது; ஆனால் கிரேக்கத்தில் செயப்படுபொருள் வெளிப்படையாகக் கூறப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ εὗρον
  choice: அவர்களுக்கு எதுவும் கிடைக்கவில்லை
  rationale: கிரேக்கத்தில் εὗρον என்பதன் செயப்படுபொருள் வெளிப்படையாகக் கூறப்படவில்லை; முந்தைய வசனத்தின் சூழலில் தேடப்பட்ட சாட்சி அல்லது குற்றச்சாட்டையே இது குறிக்கிறது. தமிழில் இயல்பாகவும் அந்த மறைபொருளைத் திட்டவட்டமாக நிரப்பாமலும் இருக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: πολλῶν προσελθόντων ψευδομαρτύρων
  choice: பொய்ச் சாட்சிகள் பலர் முன்வந்தபோதிலும்
  rationale: நீதிவிசாரணைச் சூழலில் ψευδομάρτυρες என்பது ‘பொய்ச் சாட்சிகள்’ என்று துல்லியமாக அமைகிறது. Genitive absolute இங்கு விட்டுக்கொடுப்பு உறவைக் காட்டுவதால் ‘முன்வந்தபோதிலும்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ὕστερον δὲ
  choice: ஆனால் பின்னர்
  rationale: ὕστερον காலத்தில் பிந்திய கட்டத்தைக் குறிக்கிறது; δέ நிகழ்வின் திருப்பத்தை மென்மையாகக் காட்டுவதால் ‘ஆனால் பின்னர்’ இயல்பான தேர்வாகும்.
- source_word: προσελθόντες δύο
  choice: இருவர் முன்வந்தனர்
  rationale: சட்ட விசாரணைச் சூழலில் προσέρχομαι என்பதற்கு இடம்சார்ந்த ‘அணுகினர்’ என்பதைவிட சாட்சி சொல்ல ‘முன்வந்தனர்’ என்பது இயல்பானதும் பொருத்தமானதும் ஆகும்.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில், நீதிவிசாரணைச் சூழலுக்கேற்ற கண்ணியமான நடையில் அமைக்கப்பட்டது. விட்டுக்கொடுப்பு உறவை இயல்பாக வெளிப்படுத்த துணைவாக்கியம் முதலில் வைக்கப்பட்டது; கிரேக்கத்தில் மறைந்துள்ள செயப்படுபொருள் அடிக்குறிப்பில் விளக்கப்பட்டு, மூலத்தின் ambiguity முதன்மை உரையில் பாதுகாக்கப்பட்டது.
