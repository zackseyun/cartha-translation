  text: Οἱ δὲ κρατήσαντες τὸν Ἰησοῦν ἀπήγαγον πρὸς Καϊάφαν τὸν ἀρχιερέα, ὅπου οἱ γραμματεῖς καὶ οἱ πρεσβύτεροι συνήχθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/057.yaml
  text: Those who had seized Jesus led him away to Caiaphas the high priest[a], where the scribes and the elders had gathered.
translation:
  language: ta
  text: இயேசுவைப் பிடித்தவர்கள் அவரைத் தலைமை ஆசாரியரான காய்பாவிடம் அழைத்துச் சென்றார்கள். அங்கே மறைநூல் அறிஞர்களும் மூப்பர்களும் கூடியிருந்தனர்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒன்றுகூட்டப்பட்டிருந்தனர்.’ இங்குள்ள கிரேக்க வினைச்சொல், அவர்கள் தாமாகக் கூடியிருந்தனர் என்றும், ஒன்றுகூட்டப்பட்டிருந்தனர் என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ κρατήσαντες
  choice: இயேசுவைப் பிடித்தவர்கள்
  rationale: δέ என்பது கதையை முன்னெடுத்துச் செல்லும் மென்மையான இணைப்புச்சொல்; தமிழில் தனியாகச் சேர்க்காமல் இயல்பான தொடராக வழங்கப்பட்டுள்ளது. பெயர்ச்சொல் தன்மையுள்ள பங்கேற்புவினைத் தொடர் ‘பிடித்தவர்கள்’ எனவும், முதன்மை வினைக்கு முந்திய செயல் சூழலால் தெளிவாகவும் உள்ளது.
- source_word: ἀπήγαγον
  choice: அழைத்துச் சென்றார்கள்
  rationale: காவலில் ஒருவரை ஒரு இடத்துக்கு நடத்திச் செல்வதைக் குறிக்கும் இயல்பான தமிழ்; ‘கைதுசெய்து’ போன்ற கூடுதல் சட்டப் பொருளைச் சேர்க்கவில்லை.
- source_word: πρὸς Καϊάφαν τὸν ἀρχιερέα
  choice: தலைமைக் குருவான காய்பாவிடம்
  rationale: πρός குறிக்கும் நபரை நோக்கிய நகர்வை ‘-ிடம்’ இயல்பாக வெளிப்படுத்துகிறது; ἀρχιερεύς என்பதன் பதவிப்பெயர் ‘தலைமைக் குரு’ என வழங்கப்பட்டுள்ளது.
- source_word: οἱ γραμματεῖς
  choice: மறைநூல் அறிஞர்கள்
  rationale: இச்சூழலில் யூத மறைநூல்களிலும் திருச்சட்டத்திலும் தேர்ச்சி பெற்ற அதிகாரப்பூர்வ அறிஞர்களைக் குறிக்கிறது; வெறும் எழுதுபவர்கள் என்ற தவறான எண்ணத்தைத் தவிர்க்கும் தெளிவான நவீனத் தமிழ்.
- source_word: οἱ πρεσβύτεροι
  choice: மூப்பர்கள்
  rationale: அங்கீகரிக்கப்பட்ட யூத சமூகத் தலைவர்களைக் குறிக்கும் மரபான, சுருக்கமான சொல்.
- source_word: συνήχθησαν
  choice: கூடியிருந்தார்கள்
  rationale: இயேசு அங்கு கொண்டுவரப்படுவதற்கு முன்பே அவர்கள் ஒன்றுகூடியிருந்ததைத் தமிழில் இயல்பாகக் காட்டுகிறது; கிரேக்கச் சொல்லின் செயல்பாட்டுப் பொருள் முதன்மை உரையில் வைக்கப்பட்டுள்ளது.
