  text: And from then on he was seeking an opportunity to hand him over[a].
translation:
  language: ta
  text: அதுமுதல், அவன் அவரை ஒப்படைப்பதற்கு ஏற்ற வாய்ப்பைத் தேடிக்கொண்டிருந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரைக் காட்டிக்கொடுக்க.” கிரேக்க வினைச்சொல்லின் நேரடியான பொருள் “ஒப்படைத்தல்” அல்லது “ஒப்புக்கொடுத்தல்” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τότε
  choice: அதுமுதல்
  rationale: ἀπό + τότε குறிக்கும் தொடக்கப்புள்ளியையும் அதற்குப் பின்பு தொடரும் காலநிலையையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἐζήτει
  choice: தேடிக்கொண்டிருந்தான்
  rationale: முற்றுப்பெறாத இறந்தகால வடிவம் காட்டும் தொடர்ச்சியான அல்லது மீண்டும் மீண்டும் நிகழ்ந்த தேடுதலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: εὐκαιρίαν
  choice: தக்க வாய்ப்பை
  rationale: செயலுக்கு ஏற்ற அல்லது சாதகமான சந்தர்ப்பம் என்ற சொல்லின் நுண்பொருளை இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἵνα
  choice: ஒப்படைப்பதற்கான
  rationale: ἵνα இங்கு நோக்கத்தைக் குறிப்பதால், தமிழில் நோக்கத்தைக் காட்டும் ‘-பதற்கான’ அமைப்பு இயல்பாக அமைகிறது.
- source_word: αὐτὸν
  choice: அவரை
  rationale: சூழலில் இயேசுவைக் குறிக்கும் சுட்டுப்பெயர்; தமிழின் மரியாதை வழக்குக்கு ஏற்ப ஒருமை மரியாதை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: παραδῷ (παραδίδωμι)
  choice: ஒப்படைப்பதற்கான
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருளான ‘ஒருவரை மற்றொருவரிடம் ஒப்படைத்தல்’ என்பதைக் காக்கிறது; யூதாசின் செயல் துரோகம் என்பதை நேரடியாகப் பொருளில் சேர்க்காமல் விடுகிறது.
theological_decisions:
- issue: யூதாசின் சூழலில் παραδῷ என்பதன் மொழிபெயர்ப்பு
  choice: அவரை ஒப்படைப்பதற்கான
  alternative: அவரைக் காட்டிக்கொடுப்பதற்கான
  rationale: சூழலில் இது துரோகத்தைக் குறித்தாலும், கிரேக்க வினைச்சொல் பரந்த ‘ஒப்படை’ பொருளைக் கொண்டது. ஆகவே முதன்மை உரை அந்தப் பொருளைப் பாதுகாக்கிறது; சூழலுக்கேற்ற ‘காட்டிக்கொடு’ என்ற மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிதாகப் புரியும், ஆனால் வேதாகம உரைக்கேற்ற கண்ணியமான நடை. இயேசுவுக்கு ‘அவர்’ என்றும் யூதாசுக்கு ‘அவன்’ என்றும் பயன்படுத்தி, குறிப்புப் பொருள் தெளிவாக்கப்பட்டுள்ளது.
