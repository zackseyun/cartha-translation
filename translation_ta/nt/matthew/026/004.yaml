lexical_decisions:
- source_word: συνεβουλεύσαντο
  choice: ஒன்றுகூடி ஆலோசித்தார்கள்
  rationale: கூட்டாக ஆலோசித்து ஒரு திட்டத்தை வகுத்தார்கள் என்ற நடுத்தர வினையின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δόλῳ
  choice: சூழ்ச்சியால்
  rationale: வஞ்சகமான மறைமுகத் திட்டம் அல்லது தந்திரம் என்ற பொருளைத் தருகிறது; வெறும் இரகசியத்தைக் குறிப்பதாக மட்டுப்படுத்தவில்லை.
- source_word: κρατήσωσιν
  choice: பிடித்து
  rationale: ஒருவரை அதிகாரத்துடன் கைப்பற்றுதல் அல்லது கைது செய்தல் என்ற சூழல்சார் பொருளை எளிய தமிழில் தருகிறது.
- source_word: ἀποκτείνωσιν
  choice: கொலைசெய்ய
  rationale: திட்டமிட்டு உயிரைப் பறிப்பதைக் தெளிவாகக் குறிக்கிறது.
