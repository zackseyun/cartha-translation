id: MAT.26.52
reference: Matthew 26:52
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τότε λέγει αὐτῷ ὁ Ἰησοῦς· Ἀπόστρεψον ⸂τὴν μάχαιράν σου⸃ εἰς τὸν τόπον αὐτῆς, πάντες γὰρ οἱ λαβόντες μάχαιραν ἐν μαχαίρῃ ⸀ἀπολοῦνται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/052.yaml
  text: Then Jesus said to him[a], “Put your sword back in its place, for all who take up the sword will perish by the sword.”
translation:
  language: ta
  text: அப்போது இயேசு அவனிடம், “உன் வாளை மீண்டும் அதன் இடத்தில் வை. ஏனெனில், வாளை எடுப்பவர்கள்[a] அனைவரும் வாளால் அழிந்துபோவார்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வாளைக் கையில் எடுப்பவர்கள்.” இந்தத் தொடர் ஓர் ஆயுதத்தைப் பிடிப்பதை மட்டும் அல்லாமல், வன்முறையை நாடுவதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: கதை நிகழ்வுகளின் தொடர்ச்சியில் அடுத்த நிகழ்வை இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: λέγει αὐτῷ
  choice: இயேசு அவனிடம் ... என்றார்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் இருந்தாலும், நவீனத் தமிழ் கதைநடையில் இறந்தகாலம் இயல்பானது.
- source_word: Ἀπόστρεψον
  choice: திருப்பி வை
  rationale: உடனடியாக முன்செயலை மாற்றும்படி இடப்படும் கட்டளையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τὴν μάχαιράν σου
  choice: உன் வாளை
  rationale: μάχαιρα கத்தி அல்லது குறுவாளைக் குறிக்கக்கூடியதாயினும், இக்கைது நிகழ்ச்சியிலும் தொடர்ந்து வரும் பழமொழி வடிவ வாக்கியத்திலும் ‘வாள்’ தெளிவான வழக்கமான சொல்.
- source_word: εἰς τὸν τόπον αὐτῆς
  choice: அதன் இடத்திற்கே
  rationale: வாளை அது இருக்கவேண்டிய இடத்திற்குத் திருப்பும் பொருளைப் பாதுகாக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘உறை’ என்பதைச் சேர்க்கவில்லை.
- source_word: πάντες γὰρ οἱ λαβόντες μάχαιραν
  choice: ஏனெனில், வாளை எடுப்பவர்கள் அனைவரும்
  rationale: பெயர்ச்சொல் தன்மை கொண்ட பங்கேற்புவினை பொதுவான நியதியைச் சுட்டுகிறது. ‘வாளை எடுப்பவர்கள்’ என்பது ஆயுதத்தை எடுத்தல் மற்றும் வன்முறை பலத்தை நாடுதல் ஆகிய பொருள் சாத்தியங்களைத் தக்கவைக்கிறது.
- source_word: ἐν μαχαίρῃ
  choice: வாளால்
  rationale: கருவிப் பொருளைக் காட்டும் வேற்றுமையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவித்து, வாக்கியத்தின் இணை அமைப்பைப் பாதுகாக்கிறது.
- source_word: ἀπολοῦνται
  choice: அழிந்துபோவார்கள்
  rationale: வரவிருக்கும் அழிவு அல்லது மரணத்தின் தீவிரத்தைத் தெரிவிக்கிறது; ‘கொல்லப்படுவார்கள்’ என்று செயப்பாட்டையும் முகவரையும் தேவையின்றி மிகத் துல்லியப்படுத்தவில்லை.
theological_decisions:
- issue: வாளைப் பற்றிய இயேசுவின் கூற்றின் வரம்பு
  choice: ‘வாளை எடுப்பவர்கள் அனைவரும்’ என்ற பொதுவான நியதியாக மொழிபெயர்க்கப்பட்டது.
  alternative: எல்லா வகையான பலப்பயன்பாட்டுக்கும் முழுமையான தடை என்று குறிப்பாக்குதல், அல்லது பேதுருவின் அப்போதைய சூழலுக்கு மட்டும் உரிய முன்னறிவிப்பு என்று வரம்பிடுதல்.
  rationale: கிரேக்கத்தின் பொதுமைப்படுத்தும் அமைப்பு கூற்றுக்கு விரிந்த பயன்பாட்டைத் தருகிறது. எந்த ஒரு குறிப்பிட்ட சமயப்பிரிவின் வன்முறை அல்லது அமைதிவாதக் கோட்பாட்டையும் மொழிபெயர்ப்பில் சேர்க்காமல் அந்த விரிவைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உறைக்குள் வை’ என்பது சூழலில் சாத்தியமானதாயினும் மூலத்தில் ‘அதன் இடத்திற்கு’ என்றே இருப்பதால், அந்தத் திறந்த தன்மை பாதுகாக்கப்பட்டுள்ளது.
