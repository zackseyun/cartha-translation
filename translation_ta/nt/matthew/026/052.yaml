review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the narrative sequence, Jesus' address, the imperative to return the sword, the gnomic scope of πάντες οἱ λαβόντες μάχαιραν, the instrumental sense of ἐν μαχαίρῃ, and the future sense of ἀπολοῦνται. “அழிந்துபோவார்கள்” appropriately preserves ‘will perish’ without specifying an agent or manner of death.
  naturalness: The wording is generally clear and dignified modern Tamil. However, “அதன் இடத்திற்கே திருப்பி வை” is slightly less idiomatic for returning an object. “மீண்டும் அதன் இடத்தில் வை” is smoother while retaining the source’s nonspecific ‘place’ rather than adding ‘sheath.’ The footnote’s “வன்முறை பலத்தை நாடுவதையும்” is unnatural Tamil.
  terminology: “வாள்” is a conventional and contextually suitable rendering of μάχαιρα. “வாளால் அழிந்துபோவார்கள்” maintains the source’s parallelism and proverbial gravity. No doctrinal narrowing is introduced.
  issues:
  - severity: low
    issue: The command wording is mildly stiff.
    rationale: Tamil more naturally says to put an object back in its place rather than ‘turn it to its place.’
  - severity: low
    issue: The explanatory footnote contains an unnatural expression.
    rationale: “வன்முறை பலத்தை நாடுதல்” is better expressed as “வன்முறையை நாடுதல்,” without changing the cautiously stated possible sense.
  revised_text: அப்போது இயேசு அவனிடம், “உன் வாளை மீண்டும் அதன் இடத்தில் வை. ஏனெனில், வாளை எடுப்பவர்கள்[a] அனைவரும் வாளால் அழிந்துபோவார்கள்” என்றார்.
