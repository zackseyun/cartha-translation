revisions:
- from: அப்போது இயேசு அவனிடம், “உன் வாளை அதன் இடத்திற்கே திருப்பி வை. ஏனெனில், வாளை எடுப்பவர்கள்[a] அனைவரும் வாளால் அழிந்துபோவார்கள்” என்றார்.
  to: அப்போது இயேசு அவனிடம், “உன் வாளை மீண்டும் அதன் இடத்தில் வை. ஏனெனில், வாளை எடுப்பவர்கள்[a] அனைவரும் வாளால் அழிந்துபோவார்கள்” என்றார்.
  rationale: The revision makes the imperative and footnote idiomatic in modern standard Tamil. It retains the source text’s open reference to the sword’s ‘place,’ its generalizing construction, and its noncommittal description of perishing.
