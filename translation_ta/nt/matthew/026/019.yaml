  text: καὶ ἐποίησαν οἱ μαθηταὶ ὡς συνέταξεν αὐτοῖς ὁ Ἰησοῦς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/019.yaml
  text: And the disciples did as Jesus had directed them[a], and they prepared the Passover.
translation:
  language: ta
  text: சீடர்கள், இயேசு அவர்களுக்குக் கட்டளையிட்டபடியே செய்தார்கள்; பஸ்காவையும் ஆயத்தம் செய்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பஸ்கா விருந்தை.” πάσχα என்ற சொல் பஸ்கா அனுசரிப்பை விரிவாகவும், அதற்காக ஆயத்தம் செய்யப்பட்ட விருந்தையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν
  choice: செய்து
  rationale: ὡς συνέταξεν என்பதுடன் இணைந்து, கொடுக்கப்பட்ட கட்டளையின்படி செயல்பட்டார்கள் என்ற இயல்பான பொருளைத் தருகிறது.
- source_word: οἱ μαθηταὶ
  choice: சீடர்கள்
  rationale: நற்செய்தி நூல்களில் μαθηταί என்பதற்கான வழக்கமான, தெளிவான தமிழ் சொல்; இயேசுவைப் பின்பற்றிக் கற்றவர்களைக் குறிக்கிறது.
- source_word: ὡς
  choice: படியே
  rationale: இயேசு கூறிய விதத்திற்கேற்ப அவர்கள் செய்தார்கள் என்ற ஒப்புமை மற்றும் இணக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: συνέταξεν
  choice: கட்டளையிட்ட
  rationale: συντάσσω இங்கு அதிகாரத்துடன் வழிமுறை கொடுத்தலைக் குறிக்கிறது. ‘கட்டளையிட்ட’ என்பது அந்த அதிகாரத்தைத் தக்கவைத்தாலும் சூழலில் இயல்பாக உள்ளது.
- source_word: ἡτοίμασαν
  choice: ஆயத்தம் செய்தார்கள்
  rationale: ἑτοιμάζω என்பதன் ‘தயார் செய்தல்’ என்ற பொருளை, சமய அனுசரிப்புக்கான ஏற்பாடுகள் என்ற இச்சூழலில் இயல்பாகத் தருகிறது.
- source_word: τὸ πάσχα
  choice: பஸ்கா
  rationale: πάσχα என்பது பண்டிகை, அனுசரிப்பு, விருந்து அல்லது அதனோடு தொடர்புடைய பலியைக் குறிக்கக்கூடும். ‘பஸ்கா’ என்ற வடிவம் மூலத்தின் பொருள் பரப்பைச் சுருக்காமல் காக்கிறது.
- source_word: ὁ Ἰησοῦς
  choice: இயேசு
  rationale: தமிழில் நிலைபெற்றுள்ள பெயர் வடிவம்.
theological_decisions:
- issue: τὸ πάσχα என்பதன் பொருள் வரம்பு
  choice: பஸ்கா
  alternative: பஸ்கா விருந்து; பஸ்கா ஆட்டுக்குட்டி
  rationale: இச்சூழல் உணவுக்கான ஆயத்தத்தை உள்ளடக்கியிருந்தாலும், கிரேக்கச் சொல் விருந்தை மட்டும் வெளிப்படையாகக் குறிப்பிடவில்லை. ஆகவே முதன்மை உரை அதன் பரந்த பொருளைத் தக்கவைத்து, சூழலுக்குரிய விருந்து என்ற சாத்தியத்தை அடிக்குறிப்பில் தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பஸ்கா’ என்ற நிலைபெற்ற வேதாகமச் சொல் தக்கவைக்கப்பட்டு, அதன் சூழல்சார் மாற்றுப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
