id: MAT.26.35
reference: Matthew 26:35
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Πέτρος· Κἂν δέῃ με σὺν σοὶ ἀποθανεῖν, οὐ μή σε ⸀ἀπαρνήσομαι. ⸀ὁμοίως καὶ πάντες οἱ μαθηταὶ εἶπαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/035.yaml
  text: Peter said to him[a], “Even if I must die with you, I will certainly not deny you.” Likewise all the disciples also said the same.
translation:
  language: ta
  text: பேதுரு அவரிடம், “நான் உம்மோடு இறக்க வேண்டியிருந்தாலும், உம்மை ஒருபோதும் மறுதலிக்க மாட்டேன்[a]” என்றார். சீடர்கள் எல்லாரும் அவ்வாறே சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உம்மை நிச்சயமாக மறுதலிக்க மாட்டேன்.” கிரேக்கத்தில் οὐ μή என்னும் வலியுறுத்தப்பட்ட மறுப்பு பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: என்றார்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் இருந்தாலும், தமிழ் கதைநடையில் இறந்தகாலமான ‘என்றார்’ இயல்பாகவும் அதன் உரையாடல் செயல்பாட்டைத் தெளிவாகவும் தருகிறது.
- source_word: Κἂν δέῃ με
  choice: நான் ... வேண்டியிருந்தாலும்
  rationale: κἄν அறிமுகப்படுத்தும் விட்டுக்கொடுக்கும் நிபந்தனையையும் δέῃ குறிக்கும் கட்டாயத்தையும் இயல்பான தமிழில் இணைத்துத் தருகிறது.
- source_word: σὺν σοὶ ἀποθανεῖν
  choice: உம்மோடு இறக்க
  rationale: உடனிருப்பைக் குறிக்கும் σὺν σοὶ என்பதையும் இறப்பைக் குறிக்கும் ἀποθανεῖν என்பதையும் நேரடியாகவும் மரியாதையான ஒருமை முன்னிலையுடனும் தருகிறது.
- source_word: οὐ μή
  choice: ஒருபோதும் ... மாட்டேன்
  rationale: இரட்டை வலியுறுத்தல் கொண்ட கிரேக்க மறுப்பின் உறுதியை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀπαρνήσομαι
  choice: மறுதலிக்க மாட்டேன்
  rationale: இயேசுவைத் தெரியாது என்று மறுப்பதைக் குறிக்கும் சூழலுக்குப் பொருந்தும், தமிழ் வேதாகம வழக்கிலும் பொதுவாகப் புரியக்கூடிய சொல்லாகும்.
- source_word: ὁμοίως
  choice: அவ்வாறே
  rationale: மற்ற சீடர்களும் பேதுரு கூறியதையே அதேபோல் கூறினர் என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: πάντες οἱ μαθηταὶ εἶπαν
  choice: சீடர்கள் எல்லாரும் ... சொன்னார்கள்
  rationale: πάντες என்பதன் முழுமையையும் μαθηταί என்பதன் வழக்கமான பொருளையும் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: பேதுருவின் மறுப்பு வாக்கியத்தின் வலிமை
  choice: ‘ஒருபோதும் ... மறுதலிக்க மாட்டேன்’ என்று வலியுறுத்தப்பட்ட மறுப்பாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘நிச்சயமாக ... மறுதலிக்க மாட்டேன்’
  rationale: οὐ μή மிக வலிமையான மறுப்பைக் குறிக்கிறது. ‘ஒருபோதும் ... மாட்டேன்’ என்பது பேதுருவின் உறுதியான தன்னம்பிக்கையைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது; அதன் பின்னுள்ள இறையியல் பதற்றத்தை விளக்கி முடிவு செய்யாமல் அப்படியே விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவை நோக்கிய ஒருமைச் சொற்களுக்கு மரியாதை வடிவமான ‘உம்மோடு/உம்மை’ பயன்படுத்தப்பட்டுள்ளது; மற்ற இடங்களில் தேவையற்ற உயர்நடை தவிர்க்கப்பட்டுள்ளது.
