  source_fidelity: மூல கிரேக்கத்தின் வரலாற்று நிகழ்காலமான λέγει தமிழ்க் கதைநடைக்கு இயல்பான இறந்தகாலமான “என்றார்” எனச் சரியாக மாற்றப்பட்டுள்ளது. Κἂν δέῃ με σὺν σοὶ ἀποθανεῖν என்பதன் concessive நிபந்தனை, கட்டாய உணர்வு, மற்றும் “உம்மோடு” என்ற உடனிருப்பு அனைத்தும் பாதுகாக்கப்பட்டுள்ளன. οὐ μή-யின் வலிமையான எதிர்மறை “ஒருபோதும் ... மாட்டேன்” எனவும், ὁμοίως καὶ πάντες οἱ μαθηταὶ εἶπαν என்பதன் பொருள் “சீடர்கள் எல்லாரும் அவ்வாறே சொன்னார்கள்” எனவும் துல்லியமாகத் தரப்பட்டுள்ளது.
  naturalness: நவீன நிலையான தமிழில் வாக்கியங்கள் இயல்பாகவும் கண்ணியமான வேதாகமக் கதைநடைக்கு ஏற்றவையாகவும் உள்ளன. “உம்மோடு/உம்மை” என்ற மரியாதை ஒருமை பயன்பாடு தொடர்ச்சியாகவும் பொருத்தமாகவும் உள்ளது.
  terminology: “பேதுரு,” “சீடர்கள்,” “மறுதலிக்க” ஆகியவை நிலையான, புரிந்துகொள்ளத்தக்க வேதாகமச் சொற்கள். “மறுதலிக்க” என்பது இச்சூழலில் ἀπαρνήσομαι குறிக்கும் இயேசுவை மறுப்பதற்குப் பொருத்தமானது. அடிக்குறிப்பு οὐ μή-யின் வலியுறுத்தப்பட்ட மறுப்பைச் சரியாக விளக்குகிறது; [a] குறியீடும் உரிய இடத்தில் உள்ளது.
