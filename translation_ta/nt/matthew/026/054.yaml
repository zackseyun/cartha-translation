  text: How then would the Scriptures be fulfilled[a], that it must happen this way?
translation:
  language: ta
  text: அப்படியானால், இவ்வாறு நடக்க வேண்டும் என்று கூறும் வேதவாக்கியங்கள் எப்படி நிறைவேறும்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அப்படியானால், ‘இவ்வாறு நடக்க வேண்டும்’ என்று கூறும் வேதவாக்கியங்கள் எப்படி நிறைவேற முடியும்?”
    reason: πῶς ... πληρωθῶσιν என்ற சொல்லாட்சிக் கேள்வியின் சாத்திய உணர்வை ‘எப்படி நிறைவேற முடியும்?’ என்றும், ὅτι-ஐ நேரடியான உள்ளடக்க இணைப்பாகவும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: πῶς
  choice: எப்படி
  rationale: வினாவடிவ வினையுரிச்சொல்லின் இயல்பான நவீனத் தமிழ் இணை; இங்கு உள்ள சொல்லாட்சிக் கேள்வியின் வலிமையையும் காக்கிறது.
- source_word: οὖν
  choice: அப்படியானால்
  rationale: முந்தைய கூற்றிலிருந்து வரும் தர்க்கரீதியான விளைவை இயல்பான தமிழில் இணைக்கிறது.
- source_word: πληρωθῶσιν
  choice: நிறைவேறும்
  rationale: πληρόω என்பதன் இறந்தகாலச் செயப்பாட்டு வினைமுற்று சார்ந்த சாத்திய/எதிர்நிலை உணர்வைத் தமிழில் சொல்லாட்சிக் கேள்வியின் எதிர்கால வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: αἱ γραφαὶ
  choice: வேதவாக்கியங்கள்
  rationale: பொதுவான எழுத்துகளை அல்லாமல் இஸ்ரவேலின் பரிசுத்த எழுத்துத் தொகுப்பைக் குறிக்கும் பன்மைச் சொல்லாகத் தமிழில் பரவலாகவும் தெளிவாகவும் புரியும் வடிவம்.
- source_word: ὅτι
  choice: என்று கூறும்
  rationale: வேதவாக்கியங்களின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் ὅτι-ஐ இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘கூறும்’ என்பது தமிழில் தேவையான தெளிவை அளிக்கும் குறைந்தபட்ச இணைப்பு.
- source_word: οὕτως
  choice: இவ்வாறுதான்
  rationale: இயேசுவின் கைது மற்றும் பாடுகள் நிகழும் முறையைச் சுட்டுகிறது; ‘தான்’ அந்தக் குறிப்பிட்ட முறையின் அழுத்தத்தை இயல்பாகத் தருகிறது.
- source_word: δεῖ
  choice: வேண்டும்
  rationale: தேவையான கட்டாயத்தைச் சுருக்கமாகக் காக்கிறது; அதன் இறையியல் மூலத்தை மொழிபெயர்ப்பில் கூடுதலாக விளக்கவில்லை.
- source_word: γενέσθαι
  choice: நடக்க
  rationale: சம்பவங்கள் நிகழ்வதைக் குறிக்கும் γίνομαι என்பதற்கான இயல்பான நவீனத் தமிழ் சொல்.
theological_decisions:
- issue: δεῖ வெளிப்படுத்தும் கட்டாயத்தின் தன்மை
  choice: ‘நடக்க வேண்டும்’ என்று மட்டும் மொழிபெயர்த்தல்
  alternative: ‘கடவுளின் திட்டத்தின்படி நடக்க வேண்டும்’
  rationale: வேதவாக்கிய நிறைவேற்றத்துடன் இணைந்திருப்பதால் இறைத் திட்டத்தின் கட்டாயம் உட்குறிப்பாக இருந்தாலும், கிரேக்க மூலத்தில் அது வெளிப்படையாக விரித்துரைக்கப்படவில்லை. ஆகவே இறையியல் விளக்கத்தைச் சேர்க்காமல் மூலத்தின் அழுத்தத்தையும் பதற்றத்தையும் காக்கிறது.
- issue: ὅτι என்பதன் தொடர்பு
  choice: வேதவாக்கியங்கள் கூறும் உள்ளடக்கமாக ‘இவ்வாறுதான் நடக்க வேண்டும்’ என்பதை இணைத்தல்
  alternative: விளக்கக் காரணமாக அல்லது தனியான மேற்கோள் போன்ற அமைப்பில் எடுத்தல்
  rationale: இங்கு ὅτι வேதவாக்கியங்களின் உள்ளடக்கத்தை அறிமுகப்படுத்துவதாக இயல்பாகப் புரிகிறது; இருப்பினும் அதன் சுருக்கமான கிரேக்க அமைப்பால் உருவாகும் மாற்று நுணுக்கம் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயினும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘வேதவாக்கியங்கள்’ என்பது திருவெழுத்துகளைக் குறிக்கும் பரிச்சயமான சொல்; தேவையற்ற சமயப்பிரிவு சார்ந்த விளக்கங்கள் சேர்க்கப்படவில்லை.
