review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the rhetorical question, the passive fulfillment of the Scriptures, and the content clause introduced by ὅτι. ‘நடக்க வேண்டும்’ appropriately retains δεῖ without supplying a doctrinal explanation. However, the emphatic ‘தான்’ in ‘இவ்வாறுதான்’ can suggest an exclusive ‘only in this way’ force that οὕτως does not explicitly require.
  naturalness: The sentence is clear, idiomatic modern standard Tamil, and maintains a suitably dignified biblical register. The relative-clause construction ‘...என்று கூறும் வேதவாக்கியங்கள்’ naturally expresses the content relation.
  terminology: ‘வேதவாக்கியங்கள்’ is an established, intelligible Tamil biblical term for αἱ γραφαί in this context. No denominationally loaded terminology is introduced.
