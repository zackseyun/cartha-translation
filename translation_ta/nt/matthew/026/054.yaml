    issue: ‘இவ்வாறுதான்’ adds emphasis beyond the explicit wording.
    rationale: οὕτως means ‘thus/in this way’; while context may make the manner specific, the enclitic ‘தான்’ can imply exclusivity. ‘இவ்வாறு’ preserves the source wording more neutrally.
