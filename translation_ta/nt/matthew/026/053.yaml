reference: Matthew 26:53
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἢ δοκεῖς ὅτι οὐ ⸀δύναμαι παρακαλέσαι τὸν πατέρα μου, καὶ παραστήσει μοι ⸂ἄρτι πλείω⸃ δώδεκα λεγιῶνας ἀγγέλων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/053.yaml
  text: Or do you think that I cannot appeal to my Father[c][b][a], and he will at once place at my disposal more than twelve legions of angels?
translation:
  language: ta
  text: அல்லது, நான் என் தந்தையிடம் வேண்டிக்கொள்ள முடியாது என்று நினைக்கிறாயா? அவர் உடனே தேவதூதர்களின் பன்னிரண்டுக்கும் மேற்பட்ட லெகியோன்களை[c] எனக்குத் துணையாக நிறுத்துவார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: நேரடியாக, ‘என் அருகில் நிறுத்துவார்’; அதாவது, எனக்கு உதவுவதற்காகக் கிடைக்கச் செய்வார்.
    reason: lexical_alternative
  - marker: c
    text: லெகியோன் என்பது ரோமப் படையின் ஒரு பெரிய படைப்பிரிவு. இச்சொல்லாட்சி மிகப்பெரிய விண்ணுலகப் படைவலிமையை வலியுறுத்துகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: ἢ
  choice: அல்லது
  rationale: இயேசுவின் கண்டிப்பில் மாற்று எண்ணத்தை முன்வைக்கும் வினாவை எளிமையாகவும் நேரடியாகவும் அறிமுகப்படுத்துகிறது.
- source_word: δοκεῖς
  choice: நினைக்கிறாயா
  rationale: நேரடியான சொல்லாட்சியுடனும் சொல்லின் வினாவியல் வலிமையுடனும் பொருந்தும் இயல்பான நவீனத் தமிழ்.
- source_word: οὐ δύναμαι
  choice: நான் ... முடியாது
  rationale: இது அனுமதியையோ விருப்பத்தையோ அல்ல, ஆற்றல் அல்லது இயலுமையைப் பற்றிய மறுப்பாக அமைந்துள்ளதைப் பாதுகாக்கிறது.
- source_word: παρακαλέσαι
  choice: வேண்டிக்கொள்ள
  rationale: தந்தையிடம் உதவிக்காக வலியுறுத்திக் கோரும் பொருளை இயல்பாகத் தருகிறது; வெறுமனே ‘கேட்க’ என்பதைக் காட்டிலும் மூலத்தின் வேண்டுதல் நுணுக்கத்தை நன்கு காக்கிறது.
- source_word: τὸν πατέρα μου
  choice: என் தந்தையிடம்
  rationale: தெய்வீகத் தந்தை–மகன் உறவை மேலதிக விளக்கமின்றி நேரடியாகக் காட்டுகிறது.
- source_word: παραστήσει μοι
  choice: எனக்குத் துணையாக நிறுத்துவார்
  rationale: ‘என் அருகில் நிறுத்துவார்’ என்ற அடிப்படைப் படிமத்தையும் உதவிக்குக் கிடைக்கச் செய்வார் என்ற சூழல்சார் பொருளையும் இணைக்கிறது; மூலத்தில் இல்லாத ‘அனுப்புவார்’ என்பதைத் தவிர்க்கிறது.
- source_word: ἄρτι
  choice: உடனே
  rationale: தெய்வீக உதவி இப்போதே உடனடியாகக் கிடைக்கும் என்ற கால நுணுக்கத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: πλείω δώδεκα
  choice: பன்னிரண்டுக்கும் மேற்பட்ட
  rationale: பன்னிரண்டு என்ற எண்ணிக்கையை மீறும் அளவைத் துல்லியமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: λεγιῶνας
  choice: லெகியோன்களை
  rationale: ரோமப் படைத்துறைப் படிமத்தைப் பாதுகாக்க ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது; அதன் பண்பாட்டுப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ἀγγέλων
  choice: தேவதூதர்களின்
  rationale: இச்சூழலில் மனிதத் தூதர்கள் அல்ல, விண்ணுலகத் தூதர்களே குறிக்கப்படுவதால் இந்தத் தெளிவான தமிழ் சொல் தேர்ந்தெடுக்கப்பட்டுள்ளது.
theological_decisions:
- issue: தெய்வீக உதவியை நாடுவதில் இயேசுவின் இயலுமையா, அனுமதியா, விருப்பமா பேசப்படுகிறது?
  choice: இயலுமையைச் சுட்டும் ‘நான் ... வேண்டிக்கொள்ள முடியாது’
  alternative: ‘நான் வேண்டிக்கொள்ள மாட்டேன்’ என்று விருப்பமின்மையாக மொழிபெயர்த்தல்
  rationale: δύναμαι ஆற்றல் அல்லது இயலுமையைக் குறிக்கிறது. கைது செய்யப்படுவது உதவியற்ற நிலையால் அல்ல என்ற உட்பொருளை வசனம் கொண்டிருந்தாலும், அதை விளக்கவுரையாக விரிவுபடுத்தாமல் மூலத்தின் இறையியல் இழுபறி காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகருக்குப் புரியும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் தொடர்ச்சியையும் வினாவியல் அழுத்தத்தையும் காக்க ஒரே வாக்கியமாக வைத்துள்ளோம்; ‘லெகியோன்’ என்ற வரலாற்றுப் படைத்துறைப் படிமம் அடிக்குறிப்புடன் தக்கவைக்கப்பட்டுள்ளது.
