source:
  edition: SBLGNT
  text: τότε ἤρξατο καταθεματίζειν καὶ ὀμνύειν ὅτι Οὐκ οἶδα τὸν ἄνθρωπον. καὶ ⸀εὐθέως ἀλέκτωρ ἐφώνησεν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/074.yaml
  text: Then he began to curse and to swear[a], “I do not know the man.” And immediately a rooster crowed.
translation:
  language: ta
  text: 'அப்போது அவன் சாபமிடவும்[a] சத்தியம் செய்யவும் தொடங்கினான்: “அந்த மனிதனை எனக்குத் தெரியாது.” உடனே ஒரு சேவல் கூவியது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் நேரடியாக, “சாபங்களை வரவழைக்கவும் சத்தியம் செய்யவும் தொடங்கினான்.” தன் மறுப்பை உறுதிப்படுத்துவதற்காகத் தன்மீதே சாபங்களை வரவழைத்திருக்கலாம் என்பதே இதன் சாத்தியமான பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: கதையில் அடுத்த நிகழ்வைக் குறிக்கும் இயல்பான காலத் தொடர்ச்சிச் சொல்.
- source_word: ἤρξατο
  choice: தொடங்கினான்
  rationale: பேதுருவின் மறுப்பு மேலும் தீவிரமாவதை உணர்த்தும் தொடக்கநிலையைப் பாதுகாக்கிறது.
- source_word: καταθεματίζειν
  choice: சாபமிடவும்
  rationale: சாதாரணமாகக் கடுஞ்சொல் பேசுவதைக் காட்டிலும் சாபத்தை வரவழைக்கும் பொருளைச் சுருக்கமாகத் தருகிறது; சாபம் யார்மீது என்பதைக் மூலவசனம் வெளிப்படையாகக் கூறாததால் முதன்மை உரையில் அதை நிர்ணயிக்கவில்லை.
- source_word: ὀμνύειν
  choice: ஆணையிட்டுச் சத்தியம் செய்யவும்
  rationale: இங்கு வெறும் வாக்குறுதி அல்ல, மறுப்பை உறுதிப்படுத்தும் முறையான ஆணையையும் சத்தியத்தையும் குறிக்கிறது.
- source_word: ὅτι
  choice: நேர்க் கூற்றை அறிமுகப்படுத்தும் முக்காற்புள்ளி
  rationale: ὅτι அறிமுகப்படுத்தும் கூற்றின் உள்ளடக்கத்தைத் தமிழில் தெளிவான நேர்க் கூற்றாக அளிக்கிறது.
- source_word: Οὐκ οἶδα
  choice: எனக்குத் தெரியாது
  rationale: ஒருவரை அறியவில்லை என்ற மறுப்பை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: τὸν ἄνθρωπον
  choice: அந்த மனிதனை
  rationale: இயேசுவைத் தள்ளி நிறுத்திப் பேசும் சூழலில், குறிப்பிட்ட நபரைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: καὶ εὐθέως
  choice: உடனே
  rationale: இயேசுவின் முன்னறிவிப்பு உடனடியாக நிறைவேறிய கதையோட்டத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἀλέκτωρ
  choice: ஒரு சேவல்
  rationale: மூலத்தில் பெயர்ச்சொல் குறிப்பிட்ட சுட்டியின்றி வருவதையும் தமிழ் வழக்கையும் பிரதிபலிக்கிறது.
- source_word: ἐφώνησεν
  choice: கூவியது
  rationale: சேவலின் குரலைக் குறிக்கும் இயல்பான தமிழ் வினைச்சொல்.
theological_decisions:
- issue: பேதுருவின் மறுப்பில் καταθεματίζειν என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘சாபமிடவும்’ என்று மொழிபெயர்த்து, சாபம் யார்மீது என்பதைத் திறந்தவாறே வைத்தல்
  alternative: தன் மீதே சாபங்களை வரவழைத்தான் என்று நேரடியாகக் கூறுதல்; அல்லது இயேசுவைச் சபித்தான் என்று கூறுதல்
  rationale: ὀμνύειν உடன் இணைந்திருப்பதால் இது மறுப்பை வலுப்படுத்தும் சாப ஆணையைக் குறிக்கலாம்; தன்மீதான சாபம் என்பது வலுவான சூழல் விளக்கமாக இருந்தாலும், எதிர்பெயர் மூலத்தில் வெளிப்படையாக இல்லை. இயேசுவைச் சபித்ததாகவும் உரை கூறவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘சாபமிடவும்’ என்பது மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது; அடிக்குறிப்பு சாத்தியமான தன்மீதான சாபப் பொருளை விளக்குகிறது.
