source:
  edition: SBLGNT
  text: Τῇ δὲ πρώτῃ τῶν ἀζύμων προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ ⸀λέγοντες· Ποῦ θέλεις ⸀ἑτοιμάσωμέν σοι φαγεῖν τὸ πάσχα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/017.yaml
  text: On the first day of Unleavened Bread[a], the disciples came to Jesus, saying[b], “Where do you want us to prepare for you to eat the Passover?”
translation:
  language: ta
  text: 'புளிப்பில்லாத அப்பப் பண்டிகையின் முதல் நாளில்[a], சீடர்கள் இயேசுவிடம் வந்து, “நீர் உண்பதற்காகப் பஸ்காவை[b] நாங்கள் எங்கே ஆயத்தம் செய்ய வேண்டுமென்று விரும்புகிறீர்?” என்றார்கள்.


    [a] கிரேக்க மூலத்தில் நேரடியாக, “புளிப்பில்லாத அப்பங்களின் முதல் நாளில்” என்று உள்ளது. பஸ்காவின் காலவரிசை குறித்த விவாதத்தை மொழிபெயர்ப்பினால் மட்டும் தீர்மானிக்கக் கூடாது.


    [b] இன்னும் வெளிப்படையாக, “பஸ்கா உணவை” என்றும் மொழிபெயர்க்கலாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்க மூலத்தில் நேரடியாக, “புளிப்பில்லாத அப்பங்களின் முதல் நாளில்” என்று உள்ளது. பஸ்காவின் காலவரிசை குறித்த விவாதத்தை மொழிபெயர்ப்பினால் மட்டும் தீர்மானிக்கக் கூடாது.
    reason: cultural_note
  - marker: b
    text: இன்னும் வெளிப்படையாக, “பஸ்கா உணவை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ πρώτῃ τῶν ἀζύμων
  choice: புளிப்பில்லாத அப்பப் பண்டிகையின் முதல் நாளில்
  rationale: காலத்தைக் குறிக்கும் தத்திவ வேற்றுமையை இயல்பான தமிழில் “முதல் நாளில்” எனத் தருகிறது. τῶν ἀζύμων என்பது புளிப்பில்லாத அப்பப் பண்டிகைக் காலத்தைக் குறிக்கும் பெயராக்கப்பட்ட சொற்றொடர்; வாசகருக்குத் தெளிவாக “பண்டிகை” சேர்க்கப்பட்டுள்ளது. δέ இங்குச் சிறிய தொடர்ச்சியைக் குறிப்பதால் தனியாக மொழிபெயர்க்கப்படவில்லை.
- source_word: προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ
  choice: சீடர்கள் இயேசுவிடம் வந்து
  rationale: προσῆλθον என்பதன் அணுகுதல் அல்லது ஒருவரிடம் வருதல் என்ற பொருளை இயல்பான தமிழில் தருகிறது; மூலத்தில் இல்லாத “அவருடைய” என்பதைக் “சீடர்கள்” என்பதற்கு முன் சேர்க்கவில்லை.
- source_word: λέγοντες
  choice: என்றார்கள்
  rationale: மேற்கோளுடன் இணையும் கிரேக்கப் பங்கேற்பு வினையை இயல்பான தமிழ் நேரடி உரை வடிவில் தருகிறது; கேள்வியாக இருந்தாலும் “கேட்டார்கள்” என்று பேச்சுச் செயலைக் கூடுதலாக விளக்கவில்லை.
- source_word: Ποῦ θέλεις ἑτοιμάσωμέν σοι
  choice: நாங்கள் எங்கே ஆயத்தம் செய்ய வேண்டுமென்று விரும்புகிறீர்?
  rationale: θέλεις என்பதன் விருப்பம் அல்லது எண்ணம் என்ற பொருளையும், முதல் நபர் பன்மை இறந்தகாலத் துணைவினையின் ஆலோசனைக் கேள்வித் தன்மையையும் மரியாதை ஒருமையுடன் தெளிவாகத் தருகிறது.
- source_word: φαγεῖν τὸ πάσχα
  choice: நீர் உண்பதற்காகப் பஸ்காவை
  rationale: φαγεῖν என்பதன் உண்பது என்ற நோக்கத்தையும், πάσχα என்ற சொல்லை விரிவாக்காமல் நேரடியாக “பஸ்கா” என்றும் தருகிறது. சூழலில் இது பஸ்கா உணவைக் குறிக்கிறது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: “புளிப்பில்லாத அப்பங்களின் முதல் நாள்” என்பதற்கும் பஸ்கா உணவின் நேரத்திற்கும் உள்ள காலவரிசைத் தொடர்பு
  choice: மூலத்தின் பண்டிகைக் காலக் குறிப்பை மாற்றாமல் வைத்தல்
  alternative: “புளிப்பில்லாத அப்பப் பண்டிகைக்கு முந்திய நாள்” அல்லது “பஸ்காவின் முதல் நாள்” என்று விளக்கமாக மாற்றுதல்
  rationale: கிரேக்க உரை “புளிப்பில்லாத அப்பங்களின் முதல் நாளில்” என்றே கூறுகிறது. நற்செய்தி நூல்களின் காலவரிசை குறித்த விவாதத்தை மொழிபெயர்ப்பிலேயே ஒத்திசைத்து முடிவுசெய்யாமல், உரையிலுள்ள பதற்றம் பாதுகாக்கப்படுகிறது.
- issue: τὸ πάσχα என்பது பண்டிகையையா உணவையா குறிக்கிறது
  choice: முதன்மை உரையில் “பஸ்கா” என்று வைத்து, உணவைக் குறிக்கும் சாத்தியத்தை அடிக்குறிப்பில் வெளிப்படுத்துதல்
  alternative: முதன்மை உரையிலேயே “பஸ்கா உணவு” என்று விரிவாக்குதல்
  rationale: உண்பதற்கான ஆயத்தம் என்ற சூழலில் பஸ்கா உணவே நோக்கப்பட்டாலும், πάσχα என்ற மூலச்சொல்லின் பரந்த குறிப்பு மொழிபெயர்ப்பில் தேவையின்றிச் சுருக்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், மரியாதையும் எளிமையும் கொண்ட நடையில் அமைக்கப்பட்டுள்ளது. இயேசுவை நோக்கிய ஒருமை மரியாதைக்கு “நீர்/விரும்புகிறீர்” பயன்படுத்தப்பட்டுள்ளது. பாரம்பரியமாக அறியப்படும் “பஸ்கா” தக்கவைக்கப்பட்டு, அதன் உணவுப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
