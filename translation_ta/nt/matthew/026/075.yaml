id: MAT.26.75
reference: Matthew 26:75
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐμνήσθη ὁ Πέτρος τοῦ ⸀ῥήματος Ἰησοῦ ⸀εἰρηκότος ὅτι Πρὶν ἀλέκτορα φωνῆσαι τρὶς ἀπαρνήσῃ με, καὶ ἐξελθὼν ἔξω ἔκλαυσεν πικρῶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/075.yaml
  text: 'And Peter remembered the word Jesus had spoken: “Before a rooster crows[a], you will deny me three times.” And he went outside and wept bitterly.'
translation:
  language: ta
  text: 'பேதுருவுக்கு, இயேசு சொல்லியிருந்த வார்த்தை நினைவுக்கு வந்தது: “சேவல் கூவுவதற்கு முன், நீ மூன்று முறை என்னை மறுதலிப்பாய்.” அவர் வெளியே போய்க் கசப்பாக அழுதார்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμνήσθη
  choice: நினைவுகூர்ந்தார்
  rationale: முன்பு சொல்லப்பட்டதை அந்த நேரத்தில் நினைவில் கொண்டுவந்தார் என்ற இறந்தகால நிகழ்வை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ῥήματος
  choice: வார்த்தையை
  rationale: இங்கு ῥῆμα என்பது பேசப்பட்ட கூற்றைக் குறிக்கிறது; தொடர்ந்து வரும் ‘சொல்லியிருந்த’ என்பதால் பொருள் தெளிவாகிறது.
- source_word: εἰρηκότος
  choice: சொல்லியிருந்த
  rationale: இயேசு முன்பே கூறியதும் அப்போது தொடர்ந்து பொருத்தமுடையதுமான உரையை நிறைவுற்ற முன்நிகழ்வாகக் காட்டுகிறது.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι
  choice: சேவல் கூவுவதற்கு முன்
  rationale: கிரேக்கத்தில் குறிப்புச் சுட்டு இல்லாவிட்டாலும், தமிழ் பொதுப்பெயரை இவ்வாறு இயல்பாகப் பயன்படுத்துகிறது; குறிப்பிட்ட ஒரு சேவலை வலியுறுத்துவதில்லை.
- source_word: τρὶς
  choice: மூன்று முறை
  rationale: நவீனத் தமிழில் தெளிவான, இயல்பான எண்ணிக்கை வெளிப்பாடு.
- source_word: ἀπαρνήσῃ
  choice: மறுதலிப்பாய்
  rationale: ஒருவருடனான தொடர்பையோ அவரை அறிந்திருப்பதையோ மறுப்பதன் தீவிரத்தைச் சுருக்கமாகவும் வழக்கமான வேதாகமத் தமிழிலும் தெரிவிக்கிறது.
- source_word: ἐξελθὼν ἔξω
  choice: வெளியே போய்
  rationale: கிரேக்கச் சொற்றொடரின் வெளியேறும் இயக்கத்தை, தேவையற்ற மறுகூறல் இல்லாமல் இயல்பான தமிழில் தருகிறது.
- source_word: ἔκλαυσεν πικρῶς
  choice: கசப்பாக அழுதார்
  rationale: ஆழ்ந்த துயரத்துடன் அழுததை மூலத்தின் வினையடை அமைப்புக்கு நெருக்கமாகவும் மிகைப்படுத்தாமலும் தெரிவிக்கிறது.
theological_decisions:
- issue: இயேசுவைக் குறிப்பிடும் முறை
  choice: இயேசு
  alternative: கர்த்தராகிய இயேசு
  rationale: மூலத்தில் Ἰησοῦ என்ற பெயர் மட்டுமே உள்ளது; இல்லாத கிறிஸ்துவியல் பட்டத்தைச் சேர்க்கவில்லை.
- issue: பேதுருவின் அழுகையின் பொருள்
  choice: கசப்பாக அழுதார்
  alternative: மனந்திரும்பிக் கசப்பாக அழுதார்
  rationale: மூலம் அழுகையின் தீவிரத்தை மட்டுமே நேரடியாகச் சொல்கிறது; அதன் உள்ளார்ந்த இறையியல் பொருளை மொழிபெயர்ப்பில் வெளிப்படையாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான, சாதாரண வாசகர்களுக்குப் புரியும் நடை. பாரம்பரியமாக அறியப்பட்ட ‘மறுதலிப்பாய்’ என்பதைக் காத்து, மற்ற சொற்றொடர்கள் இயல்பான நடையில் அமைக்கப்பட்டுள்ளன. ‘சேவல்’ என்பதில் தமிழில் கட்டாயமில்லாத வரையறை வேறுபாட்டுக்காக அடிக்குறிப்பு சேர்க்கப்படவில்லை.
