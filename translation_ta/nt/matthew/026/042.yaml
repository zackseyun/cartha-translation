- from: 'அவர் மீண்டும், இரண்டாவது முறையாக, அங்கிருந்து சென்று இவ்வாறு வேண்டினார்: “என் தந்தையே, நான் இதைக்[a] குடித்தாலன்றி இது கடந்துபோக முடியாதென்றால்[b], உமது சித்தம் நிறைவேறட்டும்.”'
  to: 'மீண்டும், இரண்டாவது முறையாக, அவர் விலகிச் சென்று இவ்வாறு ஜெபித்தார்: “என் தந்தையே, இது[a] கடந்துபோக, நான் இதைக் குடித்தாலன்றி முடியாதென்றால்[b], உமது சித்தம் நிறைவேறட்டும்.”'
  rationale: The revision removes the added locative sense in ‘அங்கிருந்து,’ uses an explicit and natural prayer verb, improves the conditional word order, and moves footnote a to the first occurrence of the demonstrative so that its explanation of both Greek pronouns is better anchored. No theological interpretation has been added.
