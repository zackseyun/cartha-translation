source:
  edition: SBLGNT
  text: πάλιν ἐκ δευτέρου ἀπελθὼν προσηύξατο λέγων· Πάτερ μου, εἰ οὐ δύναται ⸀τοῦτο ⸀παρελθεῖν ἐὰν μὴ αὐτὸ πίω, γενηθήτω τὸ θέλημά σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/042.yaml
  text: Again[a], a second time he went away and prayed, saying, “My Father, if this cannot pass unless I drink it[b], your will be done.”
translation:
  language: ta
  text: 'மீண்டும், இரண்டாவது முறையாக, அவர் விலகிச் சென்று இவ்வாறு ஜெபித்தார்: “என் தந்தையே, இது[a] கடந்துபோக, நான் இதைக் குடித்தாலன்றி முடியாதென்றால்[b], உமது சித்தம் நிறைவேறட்டும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இது முந்தைய வசனத்தில் குறிப்பிடப்பட்ட பாடுகளின் கிண்ணத்தைக் குறிக்கிறது; இங்கே கிரேக்கத்தில் ‘இது’ என்றும் ‘இதை’ என்றும் மட்டுமே உள்ளது.
    reason: cross_reference
  - marker: b
    text: அல்லது, “நான் இதைக் குடித்தாலன்றி இது கடந்துபோவது சாத்தியமில்லை என்றால்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν ἐκ δευτέρου
  choice: மீண்டும், இரண்டாவது முறையாக
  rationale: πάλιν என்பதன் மீண்டும் நிகழும் பொருளையும் ἐκ δευτέρου என்பதன் ‘இரண்டாவது முறை’ என்ற குறிப்பையும் ஒன்றாகச் சுருக்காமல் பாதுகாக்கிறது.
- source_word: ἀπελθὼν
  choice: அங்கிருந்து சென்று
  rationale: முதன்மை வினைக்கு முன் நிகழும் பங்கேற்பு வினையை இயல்பான தமிழ் கதைநடையில் காட்டுகிறது; சூழலில் அவர் இருந்த இடத்திலிருந்து விலகிச் சென்றதை உணர்த்துகிறது.
- source_word: προσηύξατο λέγων
  choice: இவ்வாறு வேண்டினார்
  rationale: ஜெபத்தின் உள்ளடக்கத்தைத் தொடர்ந்து அறிமுகப்படுத்தும் இயல்பான, மரியாதையான தமிழ் நடை.
- source_word: Πάτερ μου
  choice: என் தந்தையே
  rationale: உடைமைப் பெயருடனான நேரடி அழைப்பை நெருக்கமும் மரியாதையும் குன்றாமல் தருகிறது.
- source_word: εἰ οὐ δύναται τοῦτο παρελθεῖν
  choice: இது கடந்துபோக முடியாதென்றால்
  rationale: οὐ δύναται என்பதன் இயலாமையையும் παρελθεῖν என்பதன் ‘கடந்துபோதல்’ என்ற உருவகத்தையும் பாதுகாக்கிறது.
- source_word: τοῦτο / αὐτό
  choice: இது / இதை
  rationale: இவ்வசனத்தில் ‘கிண்ணம்’ என்ற பெயர்ச்சொல் மீண்டும் வராததால், கிரேக்கத்தின் சுட்டுப்பெயர்களையே முதன்மை உரையில் வைத்திருக்கிறது.
- source_word: ἐὰν μὴ αὐτὸ πίω
  choice: நான் இதைக் குடித்தாலன்றி
  rationale: ἐὰν μή என்பதன் ‘அன்றி’ என்ற நிபந்தனைப் பொருளையும் πίω என்பதன் குடித்தல் உருவகத்தையும் தெளிவாகத் தருகிறது.
- source_word: γενηθήτω τὸ θέλημά σου
  choice: உமது சித்தம் நிறைவேறட்டும்
  rationale: கட்டளை/வேண்டுதல் வலிமையைக் கொண்ட பிரார்த்தனை மொழியைப் பாதுகாப்பதோடு மத்தேயு 6:10-இன் ஒத்த சொல்லாட்சியுடனும் பொருந்துகிறது.
theological_decisions:
- issue: τοῦτο / αὐτό என்பவற்றை முதன்மை உரையில் ‘கிண்ணம்’ என்று வெளிப்படையாகக் குறிப்பிடலாமா?
  choice: ‘இது / இதை’ என்று சுட்டுப்பெயர்களாகவே வைத்தல்
  alternative: ‘இந்தக் கிண்ணம் / இதைக்’ என்று மொழிபெயர்த்தல்
  rationale: மத்தேயு 26:39-இன் சூழல் பாடுகளின் கிண்ணத்தைக் குறிக்கிறது என்பது தெளிவானாலும், 26:42-இல் ποτήριον இல்லை. ஆகவே சூழல் தொடர்பை அடிக்குறிப்பில் விளக்கி, முதன்மை உரையில் கிரேக்கத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
- issue: இயேசுவின் கீழ்ப்படிதல் நிறைந்த வேண்டுதலை எவ்வாறு மொழிபெயர்ப்பது?
  choice: உமது சித்தம் நிறைவேறட்டும்
  alternative: உமது சித்தப்படியே ஆகட்டும்
  rationale: γενηθήτω என்பதன் வேண்டுதல் சார்ந்த கட்டளை வலிமையையும் தேவனுடைய சித்தத்திற்கான ஒப்புக்கொடுத்தலையும் பாதுகாக்கிறது; தேவையற்ற கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான வேதாகம நடையைப் பயன்படுத்துகிறது. கிரேக்கத்தில் உள்ள மீளுரைப்பையும் சுட்டுப்பெயர்களின் தெளிவின்மையையும் இயன்றவரை பாதுகாக்கிறது.
