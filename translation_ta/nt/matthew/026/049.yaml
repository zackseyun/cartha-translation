source:
  edition: SBLGNT
  text: καὶ εὐθέως προσελθὼν τῷ Ἰησοῦ εἶπεν· Χαῖρε, ῥαββί· καὶ κατεφίλησεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/049.yaml
  text: And immediately he came up to Jesus and said[a], “Greetings[b], Rabbi,” and kissed him.
translation:
  language: ta
  text: உடனே அவன் இயேசுவிடம் வந்து, “வணக்கம்[a], ரபீ!” என்று கூறினான்; அவரை முத்தமிட்டான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வாழ்க.”
    reason: lexical_alternative
  - marker: b
    text: இந்த வினைச்சொல் தீவிரமாகவோ மீண்டும் மீண்டுமோ முத்தமிட்டதைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: உடனே
  rationale: செயல் தாமதமின்றி நடந்ததை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: προσελθὼν τῷ Ἰησοῦ
  choice: இயேசுவிடம் வந்து
  rationale: இயேசுவை அணுகி அருகில் வந்த உடல் இயக்கத்தைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: Χαῖρε
  choice: வணக்கம்
  rationale: இங்கு இது ‘மகிழ்ந்திரு’ என்ற சொற்பொருளில் அல்லாமல் வழக்கமான முகமனாகப் பயன்படுத்தப்பட்டுள்ளது; ‘வணக்கம்’ நவீன தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: ῥαββί
  choice: ரபீ
  rationale: கிரேக்க உரையே செமித்திய பட்டப்பெயரை ஒலிபெயர்த்துள்ளதால், அதன் தனித்தன்மையைத் தமிழிலும் ஒலிபெயர்ப்பால் காக்கிறது.
- source_word: κατεφίλησεν
  choice: முத்தமிட்டான்
  rationale: அடிப்படைச் செயலைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; வினைச்சொல்லில் இருக்கக்கூடிய தீவிரமான அல்லது மீண்டும் மீண்டும் முத்தமிடும் நுட்பம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: αὐτόν
  choice: அவரை
  rationale: இயேசுவைக் குறிக்கும் வேற்றுமை உருபுடைய பதிற்பெயரை, நவீனத் தமிழின் மரியாதை வழக்குக்கு ஏற்ப வழங்குகிறது.
theological_decisions:
- issue: யூதாஸ் பயன்படுத்திய Χαῖρε என்ற முகமனை மொழிபெயர்த்தல்
  choice: வணக்கம்
  alternative: வாழ்க
  rationale: இச்சூழலில் இது இறையியல் புகழுரையல்ல, வழக்கமான முகமன். துரோகத்தின் முரண்பாட்டை விளக்கமாகச் சேர்க்காமல் கதைச்சூழலே வெளிப்படுத்த விடுகிறது.
- issue: κατεφίλησεν என்பதன் தீவிரத் தன்மையை வெளிப்படுத்தல்
  choice: முத்தமிட்டான்
  alternative: அழுத்தமாக முத்தமிட்டான் / மீண்டும் மீண்டும் முத்தமிட்டான்
  rationale: வினை தீவிரமான அல்லது மீளச் செய்யப்படும் முத்தத்தைக் குறிக்கக்கூடும்; ஆனால் எந்த ஒரு நுட்பத்தையும் உறுதியாகத் தீர்மானிக்காமல், மூலத்தின் உண்மையான தெளிவின்மையை அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. யூதாஸுக்கு ‘அவன்’ என்றும் இயேசுவுக்கு மரியாதை வடிவான ‘அவரை’ என்றும் வழங்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறியீடுகளும் அவை விளக்கும் சொற்களின் பின்னரே அமைக்கப்பட்டுள்ளன.
