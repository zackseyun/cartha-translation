source:
  edition: SBLGNT
  text: εἶπεν· Τί θέλετέ μοι δοῦναι κἀγὼ ὑμῖν παραδώσω αὐτόν; οἱ δὲ ἔστησαν αὐτῷ τριάκοντα ἀργύρια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/015.yaml
  text: He said[a], “What are you willing to give me, and I will hand him over to you?” And they weighed out for him thirty pieces of silver.
translation:
  language: ta
  text: அவன், “நீங்கள் எனக்கு என்ன கொடுக்கத் தயாராக இருக்கிறீர்கள்? நானும் அவரை உங்களிடம் ஒப்படைப்பேன்[a]” என்று சொன்னான். அவர்கள் அவனுக்கு முப்பது வெள்ளித் துண்டுகளை எடைபோட்டுக் கொடுத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரை உங்களுக்குக் காட்டிக்கொடுப்பேன்.” கிரேக்க வினைச்சொல் “ஒப்படைத்தல்,” “கையளித்தல்” அல்லது இச்சூழலில் “காட்டிக்கொடுத்தல்” என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί θέλετέ μοι δοῦναι
  choice: நீங்கள் எனக்கு என்ன கொடுக்கத் தயாராக இருக்கிறீர்கள்?
  rationale: θέλω விருப்பத்தையும் மனமுள்ள நிலை அல்லது தயார்நிலையையும் குறிக்கலாம். பேரம் பேசும் இச்சூழலில், இயல்பான நவீனத் தமிழில் செயலில் இறங்கும் மனப்பாங்கை ‘கொடுக்கத் தயாராக இருக்கிறீர்கள்’ என்பது தெளிவாக வெளிப்படுத்துகிறது.
- source_word: κἀγὼ ὑμῖν παραδώσω αὐτόν
  choice: நானும் அவரை உங்களிடம் ஒப்படைப்பேன்
  rationale: παραδίδωμι என்பதற்கு ‘ஒப்படை, கையளி’ என்ற பரந்த பொருள் உண்டு. இங்கு யூதாஸ் இயேசுவை அதிகாரிகளிடம் ஒப்படைக்க முன்வருகிறான்; ‘ஒப்படைப்பேன்’ என்பது வினையின் பரந்த பொருளைப் பேணுகிறது. ‘காட்டிக்கொடுப்பேன்’ என்பது சூழலின் துரோகத் தன்மையை இன்னும் வெளிப்படையாகக் கூறுவதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: οἱ δὲ
  choice: அவர்கள்
  rationale: δέ இங்கு மென்மையான கதைத் தொடர்புச் சொல். தமிழில் தனியாக இணைப்புச் சொல்லைச் சேர்க்காமல் அடுத்த வாக்கியத்தை ‘அவர்கள்’ என்று தொடங்குவது இயல்பான ஓட்டத்தை அளிக்கிறது.
- source_word: ἔστησαν αὐτῷ
  choice: அவனுக்கு ... எடைபோட்டுக் கொடுத்தார்கள்
  rationale: இந்த வணிகச் சூழலில் ἵστημι தொகையை நிர்ணயித்தல் அல்லது வெள்ளியை எடைபோட்டுக் கொடுத்தல் என்ற கருத்தைக் கொண்டிருக்கலாம். ‘எடைபோட்டுக் கொடுத்தார்கள்’ என்பது மூலத்தின் தொட்டுணரத்தக்க பரிவர்த்தனைப் படிமத்தைப் பேணுகிறது.
- source_word: τριάκοντα ἀργύρια
  choice: முப்பது வெள்ளிக் காசுகள்
  rationale: ἀργύρια என்பது சொற்பொருளில் வெள்ளிப் பணத் துண்டுகளைக் குறிக்கிறது. குறிப்பிட்ட நாணயப் பெயரைச் சேர்க்காமல், பணமாகப் பயன்படுத்தப்பட்ட வெள்ளித் துண்டுகள் என்ற பொருளை ‘வெள்ளிக் காசுகள்’ இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: யூதாஸின் முன்மொழிவில் παραδώσω என்பதன் மொழிபெயர்ப்பு
  choice: ஒப்படைப்பேன்
  alternative: காட்டிக்கொடுப்பேன்
  rationale: ‘ஒப்படைப்பேன்’ என்பது கிரேக்க வினையின் பரந்த சொற்பொருளைப் பேணி, அதன் ஒழுக்க மதிப்பீட்டை மொழிபெயர்ப்பிலேயே முழுமையாகத் திணிப்பதைத் தவிர்க்கிறது. இச்செயல் துரோகம் என்பது சூழலில் தெளிவாக இருப்பதால், அந்தச் சூழல்சார் பொருள் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பேரம் பேசும் கேள்வியின் இயல்பும், ஒப்படைத்தல் என்ற வினையின் நோக்கமுள்ள ஆனால் சொற்பொருளில் பரந்த தன்மையும் பேணப்பட்டுள்ளன.
