  text: μετὰ δὲ τὸ ἐγερθῆναί με προάξω ὑμᾶς εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/032.yaml
  text: But after I am raised up[a], I will go ahead of you into Galilee.
translation:
  language: ta
  text: ஆனால், நான் உயிர்த்தெழுப்பப்பட்ட பின்பு[a], உங்களுக்கு முன்பாகக் கலிலேயாவுக்குச் செல்வேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “நான் உயிர்த்தெழுந்த பின்பு.” கிரேக்கத்தில் செயப்பாட்டு வடிவம் பயன்படுத்தப்பட்டுள்ளது: “நான் உயிர்த்தெழுப்பப்பட்ட பின்பு.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ
  choice: ஆனால் ... பின்பு
  rationale: μετά உடனான வினையெச்ச அமைப்பு கால வரிசையை, ‘பின்பு’ என்று குறிக்கிறது; δέ முந்தைய வசனத்துடன் உள்ள மென்மையான முரண்பாட்டை இங்கே ‘ஆனால்’ என வெளிப்படுத்துகிறது.
- source_word: τὸ ἐγερθῆναί με
  choice: நான் உயிர்த்தெழுப்பப்பட்ட பின்பு
  rationale: ἐγερθῆναι இறந்தகாலச் செயப்பாட்டு வினையெச்சம். உயிர்த்தெழுதல் சூழலில் அதன் செயப்பாட்டு வடிவைத் தெளிவாகவும் இயல்பாகவும் காட்ட ‘உயிர்த்தெழுப்பப்பட்ட’ என மொழிபெயர்க்கப்பட்டுள்ளது; செயலைச் செய்பவர் மூலத்தில் வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
- source_word: προάξω ὑμᾶς
  choice: உங்களுக்கு முன்னே ... செல்வேன்
  rationale: προάγω இச்சூழலில் ஒருவருக்கு முன்பாகச் செல்வதைக் குறிக்கிறது. ‘உங்களுக்கு முன்னே’ என்பது சீடர்களைக் குறிக்கும் ὑμᾶς என்ற பன்மையையும் திசை சார்ந்த பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: கலிலேயாவுக்குச்
  rationale: εἰς இயக்கத்தின் இலக்கைக் குறிக்கிறது. தமிழில் இடப்பெயருடன் ‘-க்கு’ உருபைப் பயன்படுத்துவது ‘கலிலேயாவை நோக்கி/அதற்குள் செல்வது’ என்ற பொருளை இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: ἐγερθῆναί என்பதிலுள்ள உயிர்த்தெழுதல் மொழிநடை
  choice: செயப்பாட்டு வினையாக ‘உயிர்த்தெழுப்பப்பட்ட பின்பு’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘உயிர்த்தெழுந்த பின்பு’
  rationale: கிரேக்க மூலத்தின் செயப்பாட்டு வடிவை மறைக்காமல் பாதுகாக்கிறது; அதே நேரத்தில் யார் எழுப்புகிறார் என்பதை உரையில் சேர்த்து இறையியல் விளக்கம் அளிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘உயிர்த்தெழுப்பப்பட்ட’ என்பது மூலத்தின் செயப்பாட்டு வடிவைப் பாதுகாக்கிறது; அடிக்குறிப்பு இயல்பான மாற்று மொழிபெயர்ப்பைக் காட்டுகிறது. ‘உங்களுக்கு’ என்பது பன்மை என்பது சூழலாலும் வடிவாலும் தெளிவாகிறது.
