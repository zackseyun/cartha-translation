id: MAT.5.22
reference: Matthew 5:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ ὀργιζόμενος τῷ ἀδελφῷ ⸀αὐτοῦ ἔνοχος ἔσται τῇ κρίσει· ὃς δ’ ἂν εἴπῃ τῷ ἀδελφῷ αὐτοῦ· Ῥακά, ἔνοχος ἔσται τῷ συνεδρίῳ· ὃς δ’ ἂν εἴπῃ· Μωρέ, ἔνοχος ἔσται εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/022.yaml
  text: But I say to you that everyone who is angry with his brother will be liable to the judgment[a]; and whoever says to his brother, ‘Raca,’ will be liable to the council; and whoever says[e][d][c][b], ‘Fool,’ will be liable to the Gehenna of fire.
translation:
  language: ta
  text: 'ஆனால் நான் உங்களுக்குச் சொல்கிறேன்: தன் சகோதரன்மீது[d] கோபப்படுகிற ஒவ்வொருவரும் நியாயத்தீர்ப்புக்கு ஆளாவார்[a]. தன் சகோதரனைப் பார்த்து, ‘ராக்கா’[b] என்று சொல்கிறவர் மன்றத்துக்குப் பதிலளிக்க வேண்டியவர் ஆவார்[c]. ‘மூடனே’ என்று சொல்கிறவர் நெருப்பின் கெஹென்னாவுக்கு ஆளாவார்[e].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகள், ‘தன் சகோதரன்மீது கோபப்படுகிற’ என்பதற்குப் பின் ‘காரணமின்றி’ என்று சேர்க்கின்றன. மிகப் பழமையானதும் வலுவாகச் சான்றுபெற்றதுமான வாசகத்தில் அது இல்லை.
    reason: textual_variant
  - marker: b
    text: ‘ராக்கா’ என்பது இகழ்ச்சியைக் குறிக்கும் ஓர் அரமேயச் சொல்; ஏறக்குறைய ‘வெற்றுத் தலையனே’ அல்லது ‘பயனற்றவனே’ என்று பொருள்படும்.
    reason: cultural_note
  - marker: c
    text: அல்லது, ‘சன்ஹெட்ரினுக்குப் பதிலளிக்க வேண்டியவர்’; சன்ஹெட்ரின் என்பது யூத ஆட்சிமன்றம்.
    reason: alternative_reading
  - marker: d
    text: ‘சகோதரன்’ என்று மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொல் ஆண்பால் ஒருமையில் இருந்தாலும், இங்கு அது பிரதிநிதித்துவப் பொருளில் பயன்படலாம்; இந்தக் கூற்று ஆண் உடன்பிறந்தவர்களுக்கு மட்டுமே உரியது அல்ல.
    reason: lexical_alternative
  - marker: e
    text: அல்லது, ‘நெருப்பு நரகத்துக்கு.’ ‘கெஹென்னா’ என்பது இயேசு பயன்படுத்திய குறிப்பிட்ட சொல்லைக் காக்கிறது; அது நியாயத்தீர்ப்போடு தொடர்புபடுத்தப்பட்ட இன்னோம் பள்ளத்தாக்கின் உருவகத்திலிருந்து வந்தது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: ஆனால் நான் உங்களுக்குச் சொல்கிறேன்
  rationale: ἐγώ என்பதன் வலியுறுத்தலையும் δέ காட்டும் முரண்பாட்டையும் இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: πᾶς ὁ ὀργιζόμενος
  choice: கோபப்படுகிற ஒவ்வொருவரும்
  rationale: நிகழ்காலப் பங்கேற்புவினையின் பொதுவான, எவருக்கும் பொருந்தும் தன்மையை தேவையற்ற கால நுணுக்கம் சேர்க்காமல் வெளிப்படுத்துகிறது.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: தன் சகோதரன்மீது / தன் சகோதரனைப் பார்த்து
  rationale: ἀδελφός என்பதன் ஆண்பால் ஒருமையை முதன்மை உரையில் காக்கிறது; இரு வேறுபட்ட வினைகளோடும் இயல்பான தமிழ்ச் சொல்லாட்சியைப் பயன்படுத்துகிறது.
- source_word: ἔνοχος ἔσται
  choice: ஆளாவார்
  rationale: சட்டரீதியான பொறுப்புக்கும் அதனால் வரும் தீர்ப்பு அல்லது தண்டனைக்கு உட்படுதலுக்கும் இடமளித்து, மூன்று எச்சரிக்கைகளின் இணை அமைப்பைக் காக்கிறது.
- source_word: τῇ κρίσει
  choice: நியாயத்தீர்ப்புக்கு
  rationale: இது ஒரு உள்ளூர் நீதிமன்றத்தையா அல்லது தீர்ப்புச் செயல்முறையையா குறிக்கிறது என்பதைத் தீர்மானித்துவிடாமல் நீதித்துறைப் பொருளைக் காக்கிறது.
- source_word: Ῥακά
  choice: ராக்கா
  rationale: கிரேக்கத்தில் ஒலிபெயர்க்கப்பட்டுள்ள அரமேய இகழ்ச்சிச் சொல்லைத் தமிழிலும் ஒலிபெயர்த்து, அதன் பொருளை அடிக்குறிப்பில் விளக்குகிறது.
- source_word: τῷ συνεδρίῳ
  choice: மன்றத்தின் தீர்ப்புக்கு
  rationale: சொல்லின் பொதுவான ‘மன்றம்/ஆலோசனைச் சபை’ பொருளை அளிக்கிறது; குறிப்பாக சன்ஹெட்ரினைக் குறிக்கலாம் என்ற வாய்ப்பை அடிக்குறிப்பில் வைக்கிறது.
- source_word: Μωρέ
  choice: மூடனே
  rationale: நேரடியாக அழைத்துச் சொல்லப்படும் இகழ்ச்சியையும் அதன் அறநெறி சார்ந்த வலிமையையும் இயல்பான தமிழில் தருகிறது.
- source_word: εἰς τὴν γέενναν τοῦ πυρός
  choice: நெருப்பின் கெஹென்னாவுக்கு
  rationale: γέεννα என்ற வரலாற்று-யூதப் பின்னணியுள்ள குறிப்பிட்ட சொல்லையும் τοῦ πυρός என்ற உடைமைத் தொடர்புடைய மூலப்படிமத்தையும் காக்கிறது.
theological_decisions:
- issue: γέεννα என்பதன் மொழிபெயர்ப்பு
  choice: கெஹென்னா
  alternative: எரிநரகம் / நரகம்
  rationale: பிற்காலத்தில் ‘நரகம்’ என்ற சொல்லோடு இணைந்த எல்லா கருத்துகளையும் உரைக்குள் முன்கூட்டியே கொண்டுவராமல், இயேசு பயன்படுத்திய இன்னோம் பள்ளத்தாக்குப் பின்னணியுள்ள குறிப்பிட்ட சொல்லைக் காக்கிறது.
- issue: ἀδελφός என்ற ஆண்பால் சொல்
  choice: சகோதரன்
  alternative: சகோதரன் அல்லது சகோதரி / சக விசுவாசி
  rationale: கிரேக்கத்தின் ஆண்பால் ஒருமையை முதன்மை உரையில் தக்கவைக்கிறது; போதனையின் பரந்த பிரதிநிதித்துவப் பயன்பாட்டை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
- issue: கோபத்திற்கான காரணம் குறித்த வாசக வேறுபாடு
  choice: ‘காரணமின்றி’ என்பதை முதன்மை உரையில் சேர்க்கவில்லை
  alternative: ‘காரணமின்றி கோபப்படுகிற’
  rationale: மிகப் பழமையானதும் வலுவாகச் சான்றுபெற்றதுமான வாசகம் அந்தச் சொற்றொடரை விடுகிறது; ஆகவே நிபந்தனையை முதன்மை உரைக்குள் சேர்க்காமல் வாசக வேறுபாட்டை அடிக்குறிப்பில் பதிவு செய்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதவாக்கியத்திற்கேற்ற கண்ணியமான தொனியிலும் வடிவமைக்கப்பட்டது. மூன்று எச்சரிக்கைகளின் நீதித்துறை சார்ந்த படிநிலை மற்றும் இணை அமைப்பு இயன்றவரை காக்கப்பட்டுள்ளது; அரமேயச் சொல் மற்றும் யூதப் பின்னணியுள்ள ‘கெஹென்னா’ ஒலிபெயர்க்கப்பட்டு அடிக்குறிப்புகளில் விளக்கப்பட்டுள்ளன.
