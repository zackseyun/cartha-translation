source:
  edition: SBLGNT
  text: ἐὰν γὰρ ἀγαπήσητε τοὺς ἀγαπῶντας ὑμᾶς, τίνα μισθὸν ἔχετε; οὐχὶ καὶ οἱ τελῶναι ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/046.yaml
  text: For if you love those who love you[a], what reward do you have? Do not even the tax collectors do the same?
translation:
  language: ta
  text: ஏனெனில், உங்களை நேசிப்பவர்களையே நீங்கள் நேசித்தால், உங்களுக்கு என்ன வெகுமதி உண்டு?[a] வரி வசூலிப்பவர்கள்கூட அதையே செய்கிறார்கள் அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களுக்கு என்ன கூலி உண்டு?” கிரேக்கச் சொல் “கூலி” அல்லது “வெகுமதி” எனப் பொருள்படலாம்; இங்கு இயேசுவின் போதனைச் சூழலில் கிடைக்கும் கைம்மாற்றைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: ஏனெனில், ... நேசித்தால்
  rationale: γάρ முந்தைய கூற்றுக்கான காரணத் தொடர்பைச் சுட்டுகிறது; ἐάν நிபந்தனையை அறிமுகப்படுத்துகிறது. இவ்விரண்டையும் இயல்பான தமிழில் இவ்வமைப்பு காக்கிறது.
- source_word: ἀγαπήσητε ... τοὺς ἀγαπῶντας ὑμᾶς
  choice: உங்களை நேசிப்பவர்களையே நீங்கள் நேசித்தால்
  rationale: இது பொதுவான நிபந்தனை. ஒரே ἀγαπάω வினையின் இரு வடிவங்களையும் ‘நேசி’ என்ற ஒரே சொல்லால் காட்டுவதோடு, எதிர்மறை ஒப்பீட்டின் வரம்பை ‘-ஏ’ தெளிவாக்குகிறது.
- source_word: τίνα μισθὸν ἔχετε
  choice: உங்களுக்கு என்ன வெகுமதி கிடைக்கும்?
  rationale: μισθός என்பதற்கு கூலி அல்லது வெகுமதி என்ற பொருள் இருக்கலாம். இங்கு இயேசுவின் அறநெறிப் போதனையின் சூழலில் ‘வெகுமதி’ இயல்பானது; ‘கிடைக்கும்’ என்பது தமிழில் எதிர்பார்க்கப்படும் பலனைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: οὐχὶ καὶ οἱ τελῶναι τὸ αὐτὸ ποιοῦσιν
  choice: வரி வசூலிப்பவர்கள்கூட அதையே செய்கிறார்கள் அல்லவா?
  rationale: οὐχί உறுதியான ஆம் பதிலை எதிர்பார்க்கும் வினாவை உருவாக்குகிறது; ‘அல்லவா?’ அந்த சொல்லாட்சியை இயல்பாகக் காக்கிறது. καί-யின் வலியுறுத்தலை ‘கூட’ தருகிறது; τελῶναι என்பதற்கு பொதுவாகப் புரியும் ‘வரி வசூலிப்பவர்கள்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: இயேசுவின் அறநெறிப் போதனையில் μισθός என்பதன் பொருள்
  choice: வெகுமதி
  alternative: கூலி / கைம்மாறு
  rationale: சூழல் பரஸ்பர அன்பைத் தாண்டிய நடத்தைக்கான பலனைப் பற்றியது. ‘வெகுமதி’ தெய்வீக அங்கீகாரத்தின் கருத்துக்கு இடமளிக்கிறது; அதேவேளை தகுதியால் சம்பாதிக்கும் பலன் என்ற குறிப்பிட்ட கோட்பாட்டைத் திணிப்பதில்லை. சொல்லின் ‘கூலி’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நேசிப்பவர்களையே’ என்பது பரஸ்பர அன்புக்கு மட்டுமே வரம்பிடும் கருத்தைத் தெளிவாக்குகிறது; ‘அல்லவா?’ மூலத்தின் சொல்லாட்சிமிக்க வினாவைப் பாதுகாக்கிறது.
