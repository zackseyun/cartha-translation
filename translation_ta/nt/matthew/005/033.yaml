id: MAT.5.33
reference: Matthew 5:33
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Πάλιν ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐκ ἐπιορκήσεις, ἀποδώσεις δὲ τῷ κυρίῳ τοὺς ὅρκους σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/033.yaml
  text: Again[a], you have heard that it was said to those of old, ‘You shall not swear falsely[b], but you shall fulfill your oaths to the Lord.’
translation:
  language: ta
  text: “மேலும், ‘பொய்ச் சத்தியம் செய்யாதே[a]; ஆண்டவருக்கு[b] உன் சத்தியங்களை நிறைவேற்று’ என்று பழங்காலத்தவர்களுக்குச் சொல்லப்பட்டதை நீங்கள் கேள்விப்பட்டிருக்கிறீர்கள்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “செய்த சத்தியத்தை மீறாதே”; இந்த வினைச்சொல் பொய்யாகச் சத்தியம் செய்வதையோ செய்த சத்தியத்தை மீறுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “யெகோவாவுக்கு”; பழைய ஏற்பாட்டுப் பின்னணியிலுள்ள கடவுளின் உடன்படிக்கைப் பெயரை இது பிரதிபலிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν
  choice: மேலும்
  rationale: முந்தைய போதனைகளுடன் இன்னொரு எடுத்துக்காட்டை இணைக்கும் தொடர்ச்சியை இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: ἠκούσατε
  choice: நீங்கள் கேள்விப்பட்டிருக்கிறீர்கள்
  rationale: சூத்திரப்பாங்கான இந்த இறந்தகால வினை, முன்பு கேட்டதும் இப்போதும் பொருந்துவதுமான கருத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐρρέθη τοῖς ἀρχαίοις
  choice: பழங்காலத்தவர்களுக்குச் சொல்லப்பட்டது
  rationale: சொன்னவர் யார் என்பதைச் சேர்க்காமல் கிரேக்கத்தின் செயப்பாட்டு வடிவத்தையும், முந்தைய தலைமுறையினரைக் குறிக்கும் திசைவேற்றுமையையும் காக்கிறது.
- source_word: Οὐκ ἐπιορκήσεις
  choice: பொய்யாக ஆணையிடாதே
  rationale: பொய்யாணை இடுதல் என்ற முதன்மைப் பொருளைத் தெளிவாகத் தருகிறது; ஆணையை மீறுதல் என்ற சாத்தியத்தையும் அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: ἀποδώσεις
  choice: நிறைவேற்று
  rationale: ஆணையால் ஏற்றுக்கொண்ட கடமையைச் செய்து முடித்தல் என்ற சூழல்சார் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τῷ κυρίῳ
  choice: ஆண்டவருக்கு
  rationale: κύριος என்பதையும் இங்கு கடவுளே குறிப்பிடப்படுவதையும் மரியாதையான வழக்குத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: τοὺς ὅρκους σου
  choice: நீ செய்த ஆணைகளை
  rationale: உடைமைத் தொடர்பைத் தமிழில் இயல்பாக விரித்து, ὅρκος என்பதன் ‘ஆணை’ என்ற குறிப்பான பொருளைக் காக்கிறது.
theological_decisions:
- issue: இஸ்ரவேலின் திருமறைப் பின்னணியுள்ள கூற்றில் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: யெகோவா
  rationale: கிரேக்க மூலத்தில் κύριος இருப்பதால் முதன்மை உரையில் ‘ஆண்டவர்’ என வழங்கப்படுகிறது; பழைய ஏற்பாட்டின் உடன்படிக்கைப் பெயரைப் பிரதிபலிக்கும் சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἐπιορκέω வினையின் பொருள் வரம்பு
  choice: பொய்யாக ஆணையிடுதல்
  alternative: ஆணையை மீறுதல்
  rationale: பொய்யாகச் சத்தியம் செய்வது என்ற நேரடிப் பொருளை முதன்மை உரை தருகிறது; செய்த ஆணையை மீறுதல் என்ற தொடர்புடைய பொருளை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. மேற்கோளின் சட்டப்பாங்கைத் தக்கவைத்தபடியே இயல்பான தமிழ் சொல்வரிசை பயன்படுத்தப்பட்டுள்ளது.
