  text: Ἠκούσατε ὅτι ἐρρέθη· Οὐ μοιχεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/027.yaml
  text: You have heard that it was said[a], ‘You shall not commit adultery.’
translation:
  language: ta
  text: “‘விபசாரம் செய்யாதே’ என்று சொல்லப்பட்டதை நீங்கள் கேள்விப்பட்டிருக்கிறீர்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் சொற்சொல்லாக: “சொல்லப்பட்டது என்று நீங்கள் கேட்டீர்கள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκούσατε
  choice: நீங்கள் கேள்விப்பட்டிருக்கிறீர்கள்
  rationale: இறந்தகால வினை வடிவம் இங்கு முன்பு கேட்டதும் தற்போது அறியப்பட்ட போதனையுமாகிய உரையாடல் வலிமையைக் கொண்டுள்ளது; நவீன தமிழில் நிறைவுநிலை வடிவம் அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὅτι
  choice: என்று
  rationale: கேட்ட செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் இணைப்புச்சொல்லாகத் தமிழில் இயல்பான நேரடிக்கூற்று அமைப்பைப் பெறுகிறது.
- source_word: ἐρρέθη
  choice: சொல்லப்பட்டது
  rationale: λέγω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவத்தை, கூறியவர் யார் என்பதைச் சேர்க்காமல், ஆளில்லா செயப்பாட்டு அமைப்பாகப் பாதுகாக்கிறது.
- source_word: Οὐ μοιχεύσεις
  choice: விபசாரம் செய்யாதே
  rationale: எதிர்காலக் குறிப்புவினை தடைக் கட்டளையாகச் செயல்பட்டு பத்துக் கட்டளையின் மொழியை எதிரொலிக்கிறது. ஒருமை முன்னிலைக் கட்டளை வடிவம் கிரேக்க இரண்டாம் நபர் ஒருமையையும் தமிழின் கட்டளை நடையையும் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: பத்துக் கட்டளையுடனான தொடர்பு
  choice: “விபசாரம் செய்யாதே” என்ற நேரடியான தடைக் கட்டளை வடிவம்
  alternative: “நீ விபசாரம் செய்யக்கூடாது”
  rationale: இயேசு பத்துக் கட்டளையின் மரபுச் சொல்லாட்சியை மேற்கோள் காட்டுகிறார். “செய்யாதே” என்பது எந்த விளக்கத்தையும் சேர்க்காமல் சட்டக் கட்டளையின் நேரடித் தன்மையை நவீன தமிழில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பானதும் கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டுள்ளது. “விபசாரம்” என்பது μοιχεύω குறிக்கும் திருமணத் துரோகத்தைத் துல்லியமாகக் குறிக்கும் நிலையான சொல். மேற்கோளின் எல்லைகள் தெளிவாக அமைக்கப்பட்டுள்ளன; [a] குறி முதன்மை உரையில் இடம்பெற்றுள்ளது.
