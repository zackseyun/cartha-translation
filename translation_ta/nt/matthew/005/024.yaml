id: MAT.5.24
reference: Matthew 5:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἄφες ἐκεῖ τὸ δῶρόν σου ἔμπροσθεν τοῦ θυσιαστηρίου καὶ ὕπαγε πρῶτον διαλλάγηθι τῷ ἀδελφῷ σου, καὶ τότε ἐλθὼν πρόσφερε τὸ δῶρόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/024.yaml
  text: leave your gift there before the altar[a], and go; first be reconciled to your brother[b], and then come and offer your gift.
translation:
  language: ta
  text: உன் காணிக்கையை அங்கே பலிபீடத்தின் முன் விட்டுவிட்டுப் போ. முதலில் உன் சகோதரனோடு[a] ஒப்புரவாகு; பின்பு வந்து உன் காணிக்கையைச் செலுத்து.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சகோதரன்’ என்பது கிரேக்கத்தில் உள்ள ஆண்பால் ஒருமைச் சொல்லை மொழிபெயர்க்கிறது; இச்சூழலில் ஒப்புரவு பற்றிய நெறி இன்னும் பரந்த உறவுகளுக்கும் பொருந்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφες
  choice: விட்டுவிட்டுப் போ
  rationale: இங்கு ἀφίημι என்பது காணிக்கையை அந்த இடத்திலேயே விட்டுச் செல்வதைக் குறிக்கிறது; ‘விட்டுவிட்டு’ என்பது கட்டளையின் தொடர்ச்சியையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐκεῖ
  choice: அங்கே
  rationale: காணிக்கை பலிபீடத்தின் முன் உள்ள இடத்திலேயே இருக்க வேண்டும் என்ற இடச்சுட்டைத் தக்கவைக்கிறது.
- source_word: τὸ δῶρόν σου
  choice: உன் காணிக்கையை
  rationale: δῶρον என்பதற்கு பொதுவாக ‘பரிசு’ என்ற பொருள் இருந்தாலும், பலிபீடச் சூழலில் கடவுளுக்குச் செலுத்தப்படும் காணிக்கை என்பதே தெளிவான இயல்பான தமிழ்.
- source_word: ἔμπροσθεν τοῦ θυσιαστηρίου
  choice: பலிபீடத்தின் முன்
  rationale: மூலத்தின் இடவுறவைச் சுருக்கமாகவும் மரபான தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: ὕπαγε
  choice: போ
  rationale: அடுத்த கட்டளைக்குச் செல்லும் நேரடியான இயக்கக் கட்டளை.
- source_word: πρῶτον
  choice: முதலில்
  rationale: காணிக்கையைச் செலுத்துவதற்கு முன் ஒப்புரவு பெற வேண்டிய முன்னுரிமையைத் தக்கவைக்கிறது.
- source_word: διαλλάγηθι
  choice: ஒப்புரவாகு
  rationale: உறவு மீண்டும் சீராவதைக் குறிக்கும் கட்டளை; கிரேக்கத்தின் செயல்பாட்டு/பண்பாட்டு வடிவத்தை மிகையாக ஒருதலைப்பட்சமாக்காமல் உறவுசார் பொருளை வெளிப்படுத்துகிறது.
- source_word: τῷ ἀδελφῷ σου
  choice: உன் சகோதரனோடு
  rationale: διαλλάγηθι உடன் வரும் வேற்றுமை உருபு தமிழில் இயல்பாக ‘-ஓடு’ எனத் தரப்படுகிறது; மூலத்தின் ஆண்பால் ஒருமையையும் தக்கவைக்கிறது.
- source_word: τότε
  choice: பின்பு
  rationale: ஒப்புரவுக்குப் பிறகே காணிக்கையைச் செலுத்த வேண்டும் என்ற காலவரிசையைத் தெளிவாக்குகிறது.
- source_word: ἐλθὼν πρόσφερε
  choice: வந்து … செலுத்து
  rationale: பங்கேற்புவினையையும் முதன்மைக் கட்டளையையும் தமிழில் இயல்பான தொடர்வினை அமைப்பில் தருகிறது; பலிபீடச் சூழலில் ‘செலுத்து’ என்பது காணிக்கையை முறையாக அர்ப்பணிப்பதைக் குறிக்கிறது.
theological_decisions:
- issue: ἀδελφός என்ற ஆண்பால் ஒருமைச் சொல்லின் உறவுசார் எல்லை
  choice: சகோதரன்
  alternative: சகோதரன் அல்லது சகோதரி; உடன் விசுவாசி
  rationale: மூலச்சொல் ஆண்பால் ஒருமையில் இருப்பதால் முதன்மை உரையில் அதைப் பாதுகாக்கிறது. அதே நேரத்தில், இங்குள்ள ஒப்புரவுக் கோட்பாடு ஆண் உடன்பிறந்தவருக்கு மட்டும் கட்டுப்பட்டது என்று உரை வெளிப்படையாகக் கூறாததால் அதன் விரிந்த பயன்பாட்டை அடிக்குறிப்பு சுட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘காணிக்கை’, ‘பலிபீடம்’, ‘ஒப்புரவு’ ஆகியவை வேதாகமச் சூழலைத் தக்கவைக்கும் பரவலாக அறியப்பட்ட சொற்கள்.
