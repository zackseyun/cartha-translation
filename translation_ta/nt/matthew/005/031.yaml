base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/031.yaml
  text: But it was said[a], ‘Whoever divorces his wife, let him give her a certificate of divorce.’
translation:
  language: ta
  text: 'மேலும் இவ்வாறு சொல்லப்பட்டது: “தன் மனைவியை விவாகரத்து செய்கிறவன், அவளுக்கு விவாகரத்துச் சான்றிதழைக் கொடுக்கட்டும்.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தன் மனைவியை அனுப்பிவிடுகிறவன் … விவாகரத்து ஆவணத்தைக் கொடுக்கட்டும்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் ‘அனுப்பிவிடு’ என்று பொருள்படலாம்; ஆனால் இங்குள்ள திருமணச் சட்டச் சூழலில் அது விவாகரத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρρέθη
  choice: சொல்லப்பட்டது
  rationale: செயப்பாட்டு இறந்தகால வடிவத்தையும், மத்தேயுவில் முந்தைய கூற்றை அறிமுகப்படுத்தும் வழக்கமான சூத்திரத்தையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: δέ
  choice: மேலும்
  rationale: இங்கு δέ முந்தைய போதனைப் பகுதியிலிருந்து தொடர்புடைய அடுத்த பொருளுக்கு நகர்த்துகிறது. தமிழில் ‘மேலும்’ இயல்பான இணைப்பாக உள்ளது; தேவையற்ற வலுவான எதிர்மறையை உருவாக்காது.
- source_word: Ὃς ἂν
  choice: …செய்கிறவன்
  rationale: குறிப்பிடப்படாத எவருக்கும் பொருந்தும் பொதுநிபந்தனையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀπολύσῃ
  choice: விவாகரத்து செய்கிறவன்
  rationale: ἀπολύω என்பதற்கு ‘அனுப்பிவிடு’ என்ற பரந்த பொருள் இருந்தாலும், மனைவி மற்றும் விவாகரத்து ஆவணம் குறித்த இந்தச் சட்டச் சூழலில் ‘விவாகரத்து செய்’ என்பதே தெளிவான பொருள்.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: தன் மனைவியை
  rationale: உடைமை மற்றும் திருமணச் சூழல் காரணமாக γυνή இங்கு ‘மனைவி’ எனப் பொருள்படும்; ‘தன்’ என்பது தமிழில் இயல்பாக உரிய ஆணைக் குறிக்கிறது.
- source_word: δότω
  choice: கொடுக்கட்டும்
  rationale: மூன்றாம் நபர் கட்டளை வடிவத்தை நேரடியாகவும் சட்டக் கூற்றின் வடிவத்தைப் பாதுகாக்குமாறும் தருகிறது.
- source_word: αὐτῇ
  choice: அவளுக்கு
  rationale: பெண்பால் மறைமுகச் செயப்படுபொருளைத் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: ἀποστάσιον
  choice: விவாகரத்துச் சான்றிதழ்
  rationale: விவாகரத்தை அதிகாரபூர்வமாக உறுதிப்படுத்தும் எழுத்துப்பூர்வ ஆவணம் என்ற சட்டப்பொருளை நவீன தமிழில் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: மோசேயின் விவாகரத்து விதியுடன் இயேசுவின் சொற்களுக்கு உள்ள தொடர்பு
  choice: இதை முந்தைய சட்டக் கூற்றின் மேற்கோளாக மட்டும் மொழிபெயர்த்து, இந்த வசனத்திலேயே ஒப்புதலையோ கண்டனத்தையோ சேர்க்கவில்லை.
  alternative: விவாகரத்து நடைமுறையை ஆதரிக்கும் நேரடிக் கட்டளையாக விளக்கமளித்தல் அல்லது அக்காலப் பொதுப் போதனையின் வெறும் விவரிப்பாக மாற்றுதல்.
  rationale: அடுத்த வசனத்தில் இயேசு பதிலளிக்கவுள்ள பாரம்பரியச் சட்டக் கூற்றை இவ்வசனம் அறிமுகப்படுத்துகிறது. ஆகவே விவாகரத்தின் அறநெறி குறித்த விரிந்த இறையியல் கேள்வியை இங்கே முன்கூட்டியே தீர்க்கக்கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமானதும் சாதாரண வாசகர்களுக்குத் தெளிவானதுமான நடை. மேற்கோளின் சட்டப்பாணி ‘கொடுக்கட்டும்’ என்பதால் பாதுகாக்கப்பட்டுள்ளது; அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
