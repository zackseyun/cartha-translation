  text: ἐγὼ δὲ λέγω ὑμῖν, ἀγαπᾶτε τοὺς ἐχθροὺς ⸀ὑμῶν καὶ προσεύχεσθε ὑπὲρ ⸀τῶν διωκόντων ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/044.yaml
  text: But I say to you[a], love your enemies and pray for those who persecute you.
translation:
  language: ta
  text: 'ஆனால் நான் உங்களுக்குச் சொல்கிறேன்: உங்கள் பகைவர்களிடம் அன்புகூருங்கள்; உங்களைத் துன்புறுத்துகிறவர்களுக்காக[a] ஜெபியுங்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உங்களைத் துன்புறுத்துகிறவர்களின் சார்பில் ஜெபியுங்கள்.’
    reason: ὑπὲρ என்பதற்கு ‘அவர்களுக்காக’ என்பதுடன் ‘அவர்களின் சார்பில்’ என்ற வெளிப்படையான மாற்றுப் பொருளும் உண்டு.
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: ஆனால் நான் உங்களுக்குச் சொல்கிறேன்
  rationale: δέ கொண்டுவரும் முரண்பாட்டையும் ἐγώ என்பதன் வலியுறுத்தலையும் காத்து, இயல்பான நவீனத் தமிழில் வழங்குகிறது.
- source_word: ἀγαπᾶτε
  choice: அன்புகூருங்கள்
  rationale: கட்டளையின் வலிமையை நேரடியாகக் காக்கும் மரியாதைமிக்க பன்மை வடிவம்; நிகழ்கால வினையின் தொடர்ச்சியைக் தேவையின்றி மிகைப்படுத்தவில்லை.
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: உங்கள் பகைவர்களிடம்
  rationale: ἐχθρός குறிக்கும் உறவுசார் பகைமையைத் தெளிவாகக் காக்கிறது; தமிழ் வழக்கில் அன்புகூருதல் என்பதோடு ‘-இடம்’ இயல்பாக இணைகிறது.
- source_word: προσεύχεσθε
  choice: வேண்டிக்கொள்ளுங்கள்
  rationale: ஜெபித்தல் என்ற பொருளை இயல்பான, பொதுவாகப் புரியும் தமிழில் தருகிறது; கட்டளைத் தன்மையையும் காக்கிறது.
- source_word: ὑπὲρ
  choice: -க்காக
  rationale: இங்கு பிறருடைய நன்மையை நோக்கி அவர்களுக்காக வேண்டுதல் என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: τῶν διωκόντων ὑμᾶς
  choice: உங்களைத் துன்புறுத்துகிறவர்கள்
  rationale: பெயர்ச்சொல்லாக்கப்பட்ட நிகழ்காலப் பங்கேற்பு வடிவத்தின் செயல்சார், தொடரும் தன்மையை இயல்பான தமிழில் காக்கிறது; διώκω என்பதன் சூழல்சார் துன்புறுத்தல் பொருளைத் தருகிறது.
theological_decisions:
- issue: பகைவர்களை நோக்கிய கட்டளையின் வரம்பு
  choice: அன்புகூரவும் துன்புறுத்துகிறவர்களுக்காக வேண்டிக்கொள்ளவும் கூறும் இரு கட்டளைகளையும் விளக்கச் சேர்க்கைகள் இன்றி நேரடியாக மொழிபெயர்த்தல்
  alternative: அன்பை நன்மை செய்யும் செயலாக மட்டும் வரையறுத்தல் அல்லது மனமாற்றம், ஆசீர்வாதம் போன்ற குறிப்பிட்ட வேண்டுதலைச் சேர்த்தல்
  rationale: கிரேக்க வசனம் அன்பையும் வேண்டுதலையும் கட்டளையிடுகிறது; ஆனால் அவற்றின் எல்லா நடைமுறை அல்லது கோட்பாட்டுச் சார்ந்த விளைவுகளையும் இவ்விடத்தில் வரையறுக்கவில்லை. எனவே அதன் நெறிசார் வலிமையும் திறந்துள்ள இறையியல் பதற்றமும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழ்; இயல்பானதும் கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியக்கூடியதுமான நடை. ‘பகைவர்கள்,’ ‘அன்புகூருங்கள்,’ ‘வேண்டிக்கொள்ளுங்கள்’ ஆகிய சொற்கள் வேதவாக்கியத்தின் செறிவைக் காத்தாலும் அளவுக்கு மீறிய பழமையாக்கத்தைத் தவிர்க்கின்றன.
