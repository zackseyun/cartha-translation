review_pass:
  verdict: revise
  source_fidelity: The two present imperatives, the direct object ‘your enemies,’ and ὑπέρ with the genitive are all represented. However, ‘வேண்டிக்கொள்ளுங்கள்’ can denote making a request generally and does not as clearly identify προσεύχεσθε as prayer as ‘ஜெபியுங்கள்’ does.
  naturalness: The sentence is fluent, dignified modern standard Tamil. ‘உங்கள் பகைவர்களிடம் அன்புகூருங்கள்’ is understandable and idiomatic enough with அன்புகூருதல்; the revision retains it. ‘ஜெபியுங்கள்’ is the clearer and more customary Tamil verb in this religious context.
  terminology: ‘பகைவர்கள்’ and ‘அன்புகூருங்கள்’ suitably preserve the register and ethical force without interpretive expansion. ‘ஜெபியுங்கள்’ gives the established, unambiguous equivalent for προσεύχεσθε. The footnote preserves the ‘on behalf of’ lexical alternative without specifying the content or purpose of the prayer.
  issues:
  - severity: low
    issue: The main-text verb ‘வேண்டிக்கொள்ளுங்கள்’ is broader than προσεύχεσθε.
    rationale: In modern Tamil it may mean simply ‘ask’ or ‘plead,’ whereas the Greek verb specifically denotes prayer. Replacing it with ‘ஜெபியுங்கள்’ improves source precision without altering meaning.
  - severity: low
    issue: The footnote wording ‘அவர்களின் சார்பாக’ is somewhat less natural for the prayer alternative.
    rationale: ‘அவர்களின் சார்பில்’ more directly expresses the alternative ‘on behalf of them’ in natural Tamil.
  revised_text: 'ஆனால் நான் உங்களுக்குச் சொல்கிறேன்: உங்கள் பகைவர்களிடம் அன்புகூருங்கள்; உங்களைத் துன்புறுத்துகிறவர்களுக்காக[a] ஜெபியுங்கள்.'
  revised_footnotes:
