id: MAT.5.20
reference: Matthew 5:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι ἐὰν μὴ περισσεύσῃ ⸂ὑμῶν ἡ δικαιοσύνη⸃ πλεῖον τῶν γραμματέων καὶ Φαρισαίων, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/020.yaml
  text: For I tell you that unless your righteousness exceeds that of the scribes and Pharisees[a], you will certainly not enter the kingdom of heaven.
translation:
  language: ta
  text: 'ஏனெனில், நான் உங்களுக்குச் சொல்கிறேன்: உங்கள் நீதி[a] வேத அறிஞர்கள் மற்றும் பரிசேயர்களுடைய நீதியை மிஞ்சாவிட்டால், நீங்கள் பரலோக அரசில் ஒருபோதும் நுழையமாட்டீர்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நியாயம்.” கிரேக்கச் சொல் நீதி அல்லது நியாயம் எனப் பொருள்படலாம்; இச்சூழலில் கடவுளுக்கு ஏற்ப சரியாக வாழ்வதையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: ஏனெனில், நான் உங்களுக்குச் சொல்கிறேன்
  rationale: γάρ தரும் விளக்கத் தொடர்பையும், λέγωவின் நேரடியான உரையையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: ἐὰν μὴ
  choice: மேலோங்காவிட்டால்
  rationale: எதிர்மறையான அவசிய நிபந்தனையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; இங்கு περισσεύσῃ என்பதுடன் இணைத்து மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: περισσεύσῃ ... πλεῖον
  choice: '...விட மேலோங்காவிட்டால்'
  rationale: ஒப்பிடப்படுவது சீடர்களின் நீதியும் மறைநூல் அறிஞர்கள் மற்றும் பரிசேயர்களின் நீதியும்தான் என்பதைத் தெளிவாக்கி, அளவு அல்லது தரத்தில் மிகுதியாக இருப்பதைக் குறிக்கிறது.
- source_word: ὑμῶν ἡ δικαιοσύνη
  choice: உங்கள் நீதி
  rationale: δικαιοσύνη என்பதன் சரியான வாழ்வு, நேர்மை, நியாயம் ஆகிய பரப்பைத் தமிழின் ‘நீதி’ இயல்பாகத் தாங்குகிறது; சூழலில் நடத்தை சார்ந்த பொருளும் காக்கப்படுகிறது.
- source_word: γραμματέων
  choice: வேத அறிஞர்கள்
  rationale: இவர்கள் வெறும் எழுத்தர்களல்ல, வேதச்சட்டத்தில் பயிற்சிபெற்ற அறிஞர்கள் என்பதை சாதாரண தமிழ் வாசகருக்குத் தெளிவாக்குகிறது.
- source_word: Φαρισαίων
  choice: பரிசேயர்கள்
  rationale: வரலாற்றுக் குழுவின் பெயருக்கான நிலையான தமிழ் ஒலிபெயர்ப்பு.
- source_word: οὐ μὴ εἰσέλθητε
  choice: நீங்கள் ... ஒருபோதும் நுழையமாட்டீர்கள்
  rationale: οὐ μή எனும் வலியுறுத்தப்பட்ட மறுப்பை நவீனத் தமிழில் உறுதியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: பரலோக அரசாட்சி
  rationale: βασιλεία என்பதன் ஆட்சி அல்லது அரசுரிமை சார்ந்த இயக்கப்பொருளை ‘அரசாட்சி’ வெளிப்படுத்துகிறது; மத்தேயுவின் τῶν οὐρανῶν சொல்லாட்சியும் காக்கப்படுகிறது.
theological_decisions:
- issue: δικαιοσύνη என்பதன் பொருள்
  choice: நீதி
  alternative: நீதியான வாழ்வு / நேர்மை
  rationale: இந்தச் சூழலில் கடவுளுக்கு ஏற்ப சரியாக வாழ்வதைக் குறித்தாலும், மூலச்சொல்லின் ‘நீதி’ மற்றும் ‘நேர்மை’ சார்ந்த பரப்பை ஒரே விளக்கப் பொருளாகச் சுருக்காமல் ‘நீதி’ காக்கிறது.
- issue: βασιλεία என்பதன் வடிவம்
  choice: அரசாட்சி
  alternative: ராஜ்யம்
  rationale: இடம் அல்லது நிலப்பரப்பு மட்டுமல்லாமல் கடவுளின் ஆட்சியையும் குறிக்கும் கிரேக்கச் சொல்லின் பொருளை ‘அரசாட்சி’ தெளிவாக வெளிப்படுத்துகிறது; பழக்கமான ‘ராஜ்யம்’ மாற்றாக இருக்கலாம்.
- issue: நீதி யாருடைய நீதியுடன் ஒப்பிடப்படுகிறது
  choice: வேத அறிஞர்கள் மற்றும் பரிசேயர்களுடைய நீதியைவிட
  alternative: வேத அறிஞர்களையும் பரிசேயர்களையும்விட
  rationale: கிரேக்கத்தில் ஒப்பீட்டு அமைப்பு சுருக்கமாக இருந்தாலும், சூழலில் மனிதர்களைவிட சீடர்களின் நீதி அவர்களுடைய நீதியுடன் ஒப்பிடப்படுவதே இயல்பான வாசிப்பு; தமிழில் இதைத் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வேத அறிஞர்கள்’ வரலாற்றுப் பணியை விளக்குகிறது; ‘பரலோக அரசாட்சி’ மத்தேயுவின் தனித்துவமான சொற்றொடரையும் ஆட்சிப் பொருளையும் காக்கிறது.
