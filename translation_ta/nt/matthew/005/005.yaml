id: MAT.5.5
reference: Matthew 5:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μακάριοι οἱ πραεῖς, ὅτι αὐτοὶ κληρονομήσουσι τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/005.yaml
  text: Blessed are the meek[b][a], because they will inherit the earth.
translation:
  language: ta
  text: சாந்தமானவர்கள்[a] பேறுபெற்றவர்கள்; ஏனெனில் அவர்களே பூமியை[b] சுதந்தரித்துக்கொள்வார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘மென்மையானவர்கள்’ அல்லது ‘தாழ்மையானவர்கள்’; இங்குள்ள ‘சாந்தம்’ பலவீனத்தை அல்ல, தாழ்மையோடு கூடிய மென்மையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘நாட்டை’ அல்லது ‘நிலத்தை’; இச்சொற்றொடர் சங்கீதம் 37:11-ஐ எதிரொலிப்பதாகத் தெரிகிறது. அங்கு இந்த வாக்குறுதியை உடன்படிக்கையின் நாடு/நிலம் என்ற பொருளிலும், பரந்த பொருளிலும் புரிந்துகொள்ள முடியும்.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: பேறுபெற்றவர்கள்
  rationale: இது வெறும் மனமகிழ்ச்சியைக் குறிக்காமல், கடவுளின் அருளுக்கும் நல்வாழ்வுக்கும் உரியவர்களாக இருப்பதைக் காட்டுகிறது; வாழ்த்துரைகளின் கண்ணியமான நடையையும் காக்கிறது.
- source_word: οἱ πραεῖς
  choice: சாந்தமானவர்கள்
  rationale: πραΰς குறிக்கும் தாழ்மையோடு கூடிய மென்மையையும் அடக்கமான வலிமையையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; இதை பலவீனம் என்று தவறாகப் புரிந்துகொள்ளாமல் இருக்க அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: வாழ்த்துரைக்கான காரணத்தைத் தெளிவாகவும் நேரடியாகவும் அறிமுகப்படுத்துகிறது.
- source_word: αὐτοὶ
  choice: அவர்களே
  rationale: கிரேக்க மொழியிலுள்ள வலியுறுத்தலைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: κληρονομήσουσι
  choice: சுதந்தரித்துக்கொள்வார்கள்
  rationale: κληρονομέω என்பதிலுள்ள சுதந்தரப் பெறுதல் என்ற பொருளையும் வாக்குறுதி சார்ந்த மொழியையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: τὴν γῆν
  choice: பூமியை
  rationale: γῆ என்பதன் பரந்த உலகளாவிய பொருளை முதன்மை உரையில் தருகிறது; ‘நாடு’ அல்லது ‘நிலம்’ என்ற உடன்படிக்கை சார்ந்த சாத்தியத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
theological_decisions:
- issue: τὴν γῆν என்பதன் பொருள் எல்லை
  choice: பூமியை
  alternative: நாட்டை அல்லது நிலத்தை
  rationale: γῆ என்பது ‘பூமி’ என்றும் ‘நாடு/நிலம்’ என்றும் பொருள்படலாம். இயேசுவின் வாக்குறுதியின் பரந்த நிறைவேற்றத்தை ‘பூமி’ இயல்பாகத் தெரிவிக்கிறது; அதேவேளையில் சங்கீதம் 37:11-ஐ எதிரொலிக்கும் உடன்படிக்கை-நிலப் பொருளை அடிக்குறிப்பு திறந்தவாறு வைத்திருக்கிறது.
- issue: πραεῖς என்பதில் சாந்தம் மற்றும் பலவீனம்
  choice: சாந்தமானவர்கள்
  alternative: மென்மையானவர்கள் அல்லது தாழ்மையானவர்கள்
  rationale: இச்சொல் கோழைத்தனத்தையோ செயலற்ற பலவீனத்தையோ அல்ல, தாழ்மையுடன் கட்டுப்படுத்தப்பட்ட மென்மையான வலிமையைக் குறிக்கிறது. முதன்மை உரை சுருக்கமாக வைக்கப்பட்டு, இந்நுணுக்கம் அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டுள்ளது. ‘பேறுபெற்றவர்கள்’ வாழ்த்துரையின் தெய்வீக அருள் சார்ந்த செறிவைக் காக்கிறது; ‘அவர்களே’ மூலத்தின் வலியுறுத்தலை வெளிப்படுத்துகிறது. இரு அடிக்குறிப்பு குறிகளும் உரையில் உரிய சொற்களுக்குப் பின் இடப்பட்டுள்ளன.
