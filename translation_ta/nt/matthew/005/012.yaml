id: MAT.5.12
reference: Matthew 5:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: χαίρετε καὶ ἀγαλλιᾶσθε, ὅτι ὁ μισθὸς ὑμῶν πολὺς ἐν τοῖς οὐρανοῖς· οὕτως γὰρ ἐδίωξαν τοὺς προφήτας τοὺς πρὸ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/012.yaml
  text: Rejoice and be very glad[a], because your reward is great in the heavens; for in this way they persecuted the prophets who were before you.
translation:
  language: ta
  text: மகிழுங்கள்; பேருவகை கொள்ளுங்கள்; ஏனெனில், வானுலகில்[a] உங்கள் வெகுமதி மிகப் பெரியது. உங்களுக்கு முன்பிருந்த தீர்க்கதரிசிகளையும் இப்படித்தான் துன்புறுத்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வானங்களில்.” மூலக் கிரேக்கத்தில் இச்சொல் பன்மை வடிவத்தில் உள்ளது; தமிழில் ‘வானுலகம்’ என்பது இயல்பான ஒருமை வடிவம்.
    reason: மூலமொழியின் பன்மை வடிவத்தையும் இயல்பான தமிழ் ஒருமை மாற்றையும் வாசகருக்குத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: χαίρετε
  choice: மகிழ்ந்து
  rationale: இரண்டாம் நபர் பன்மை நிகழ்காலக் கட்டளையின் மகிழ்ச்சிக்கான அழைப்பை இயல்பான தமிழில் தெரிவிக்கிறது; அடுத்த வினையுடன் இணைந்து ஒரே கட்டளைத் தொடராக அமைகிறது.
- source_word: ἀγαλλιᾶσθε
  choice: பேருவகை கொள்ளுங்கள்
  rationale: χαίρετε என்பதைக் காட்டிலும் தீவிரமான, பொங்கும் மகிழ்ச்சியைக் குறிக்கும் வேறுபாட்டைப் பேணுகிறது.
- source_word: μισθὸς
  choice: வெகுமதி
  rationale: இச்சூழலில் துன்புறுத்தலை எதிர்கொள்ளும் சீடர்களுக்கான இறை கைம்மாறைக் குறிக்கிறது; வணிகக் கூலி என்ற குறுகிய பொருளைத் தவிர்க்கிறது.
- source_word: πολὺς
  choice: மிகுதியாக
  rationale: வெகுமதியின் அளவு பெரிது என்பதைக் குறிக்கும் இயல்பான தமிழ் இணைப்பு.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: வானங்களில்
  rationale: கிரேக்க மூலத்தின் பன்மை வடிவத்தைத் தெளிவாகப் பேணுகிறது; தமிழிலும் புரிந்துகொள்ளக்கூடியதாக உள்ளது.
- source_word: οὕτως
  choice: இப்படித்தான்
  rationale: சீடர்களுக்கு நேரிடும் துன்புறுத்தலும் முந்தைய தீர்க்கதரிசிகளுக்கு நேரிட்டதும் ஒரே வகையானவை என்ற முறையியல் ஒப்புமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐδίωξαν
  choice: துன்புறுத்தினார்கள்
  rationale: இங்கு διώκω பகைமையுடன் நடத்தப்பட்ட துன்புறுத்தலைக் குறிக்கிறது; முந்தைய வசனங்களின் சூழலுக்கும் பொருந்துகிறது.
- source_word: προφήτας
  choice: தீர்க்கதரிசிகளை
  rationale: இஸ்ரவேலின் இறைத்தூதர்களைக் குறிக்கும் தமிழ் வேதாகம மரபில் பரவலாக அறியப்பட்ட சொல்.
- source_word: τοὺς πρὸ ὑμῶν
  choice: உங்களுக்கு முன்பிருந்த
  rationale: சீடர்களுக்கு வரலாற்றில் முன்னிருந்த தீர்க்கதரிசிகள் என்ற உறவைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: ἐν τοῖς οὐρανοῖς என்பதன் பன்மை வடிவம்
  choice: வானங்களில்
  alternative: வானுலகில்
  rationale: மத்தேயுவில் காணப்படும் மூலமொழிப் பன்மையை முதன்மை உரையில் பேணுகிறது; மாற்று ஒருமை வடிவம் தமிழில் இயல்பான கருத்துச் சமமாக அடிக்குறிப்பில் தரப்படுகிறது. இதனால் வெகுமதி பற்றிய குறிப்புக்கு தேவையற்ற கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
- issue: துன்புறுத்தியவர்களின் குறிப்பிடப்படாத எழுவாய்
  choice: தமிழில் எழுவாயைக் குறிப்பிடாமல் ‘துன்புறுத்தினார்கள்’ என்று மொழிபெயர்த்தல்
  alternative: அவர்கள் துன்புறுத்தினார்கள்
  rationale: கிரேக்கத்தில் உள்ள மூன்றாம் நபர் பன்மை எழுவாய் யாரைக் குறிக்கிறது என்பது இவ்வசனத்தில் வெளிப்படையாகச் சொல்லப்படவில்லை. தமிழில் எழுவாயை விடுவது அந்தத் தெளிவின்மையை இயல்பாகப் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டது. ‘பேருவகை’ இரண்டாவது மகிழ்ச்சி வினையின் தீவிரத்தைப் பேணுகிறது; ‘இப்படித்தான்’ ஒப்புமையை இயல்பாக்குகிறது.
