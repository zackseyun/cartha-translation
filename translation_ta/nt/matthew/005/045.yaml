source:
  edition: SBLGNT
  text: ὅπως γένησθε υἱοὶ τοῦ πατρὸς ὑμῶν τοῦ ⸀ἐν οὐρανοῖς, ὅτι τὸν ἥλιον αὐτοῦ ἀνατέλλει ἐπὶ πονηροὺς καὶ ἀγαθοὺς καὶ βρέχει ἐπὶ δικαίους καὶ ἀδίκους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/045.yaml
  text: so that you may become sons of your Father in heaven[a], because he makes his sun rise on evil and good[c][b], and sends rain on righteous and unrighteous.
translation:
  language: ta
  text: பரலோகத்தில் இருக்கிற[a] உங்கள் தந்தையின் மகன்களாக[b] நீங்கள் ஆகும்படி, அவர் தமது சூரியனைத் தீயோர் மீதும் நல்லோர் மீதும் உதிக்கச் செய்கிறார்; நீதிமான்கள் மீதும் அநீதிமான்கள் மீதும் மழை பொழியச் செய்கிறார்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் ‘பரலோகங்களில்’ என்று பன்மையில் உள்ளது; இந்த மத்தேயு சொற்றொடர் தமிழில் இயல்பாக ‘பரலோகத்தில்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உங்கள் தந்தையின் பிள்ளைகளாக.’ கிரேக்கத்தில் நேரடியாக ‘மகன்கள்’ என்று உள்ளது; மூலத்தின் மகன்-உறவு மொழியைப் பாதுகாக்க அது முதன்மை உரையில் வைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: நேரடியாக, ‘நீதிமான்கள் மீதும் அநீதிமான்கள் மீதும் மழை பெய்கிறது/பொழிகிறது.’ தேவனுடைய செயற்பாட்டை இயல்பான தமிழில் தெளிவுபடுத்த முதன்மை உரையில் ‘மழை பொழியச் செய்கிறார்’ என்று தரப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: ஆகும்படி
  rationale: முந்தைய கட்டளையோடு இணையும் நோக்கம் அல்லது விளைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது. வசனம் தனியாக வாசிக்கப்படும்போதும் அதன் தொடர்பு தெளிவாக இருக்க ‘இவ்வாறு செய்யுங்கள்’ என்பது மறைமுகமாக உள்ள முன்வசனச் செயலைச் சுட்டுகிறது.
- source_word: γένησθε
  choice: நீங்கள் ஆகும்படி
  rationale: γίνομαι என்பதன் ‘ஆகு/ஆகிவரு’ என்ற இயக்கமுள்ள பொருளைத் தக்கவைக்கிறது; நிலையான ‘இருக்கும்படி’ என்று தட்டையாக்கவில்லை.
- source_word: υἱοὶ
  choice: மகன்களாக
  rationale: கிரேக்கத்தில் வெளிப்படையாக உள்ள ஆண்பால் பன்மையான மகத்துவ/உறவு மொழியைப் பாதுகாக்கிறது. சூழலில் சீடர்கள் அனைவரையும் பிரதிநிதித்துவமாகக் குறிக்கலாம்; அதற்கான பொருள் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τοῦ πατρὸς ὑμῶν τοῦ ἐν οὐρανοῖς
  choice: பரலோகத்தில் இருக்கிற உங்கள் தந்தையின்
  rationale: ‘உங்கள் தந்தை’ என்ற உறவையும், அவர் பரலோகத்தில் இருப்பதைக் குறிக்கும் தனித்த தொடரையும் ஒன்றாகக் கலக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முன்னுள்ள நோக்கத்திற்கான விளக்கக் காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: τὸν ἥλιον αὐτοῦ ἀνατέλλει
  choice: அவர் தமது சூரியனை ... உதிக்கச் செய்கிறார்
  rationale: αὐτοῦ என்பதிலுள்ள உரிமையையும், சூரியன் உதிப்பதில் தேவனுடைய செயற்பாட்டையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: ἐπὶ πονηροὺς καὶ ἀγαθοὺς
  choice: தீயோர் மீதும் நல்லோர் மீதும்
  rationale: பெயர்ச்சொல் போலப் பயன்படும் எதிர்மறை-நேர்மறை பெயரடைகளை மனிதர்களைக் குறிக்கும் சுருக்கமான, சமநிலையான தமிழில் தருகிறது.
- source_word: βρέχει
  choice: மழை பெய்யச் செய்கிறார்
  rationale: வினையின் மழைபெய்தல் பொருளையும் தேவனுடைய செயற்பாட்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐπὶ δικαίους καὶ ἀδίκους
  choice: நீதிமான்கள் மீதும் அநீதிமான்கள் மீதும்
  rationale: δίκαιος/ἄδικος என்ற நிலையான அறநெறி எதிரிணையைத் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: பாலினம் குறிக்கப்பட்ட மகத்துவ உறவு மொழி
  choice: உங்கள் தந்தையின் மகன்களாக
  alternative: உங்கள் தந்தையின் பிள்ளைகளாக
  rationale: மூலத்தில் τέκνα அல்ல, υἱοί உள்ளது. ஆகவே ‘மகன்கள்’ என்ற மூலச் சொல்லை முதன்மை உரையில் தக்கவைத்து, சீடர்கள் அனைவரையும் உள்ளடக்கும் பொருள் சாத்தியத்தை அடிக்குறிப்பில் காட்டுகிறது.
- issue: γένησθε என்பதும் தேவனுடைய மகத்துவ உறவும்
  choice: மகன்களாக நீங்கள் ஆகும்படி
  alternative: மகன்களாக நீங்கள் இருக்கும்படி / மகன்கள் என்பதை வெளிப்படுத்தும்படி
  rationale: ‘ஆகுதல்’ என்ற கிரேக்க வினையின் வலிமையைப் பாதுகாக்கிறது. அதே நேரத்தில், மனிதச் செயல் எவ்வாறு தெய்வீக மகத்துவ நிலையை உருவாக்குகிறது என்பதைக் குறித்து மூலவசனம் சொல்லாத இரட்சிப்பியல் விளக்கத்தை மொழிபெயர்ப்பில் சேர்க்கவில்லை; தந்தையின் பாரபட்சமற்ற நன்மையைப் பின்பற்றும் ஒழுக்கச் சூழலின் பதற்றம் அப்படியே விடப்படுகிறது.
- issue: தேவனுடைய பொதுவான பரிபாலிப்பு
  choice: தீயோர்/நல்லோர் மற்றும் நீதிமான்கள்/அநீதிமான்கள் ஆகிய இருதரப்பின்மீதும் சூரியனையும் மழையையும் அளித்தல்
  alternative: நல்லோருக்கும் நீதிமான்களுக்கும் மட்டும் ஆசீர்வாதம் அளித்தல்
  rationale: மூலத்தின் இணை எதிரிணைகள் தேவனுடைய பாரபட்சமற்ற உலகப் பரிபாலிப்பைத் தெளிவாகக் கூறுகின்றன; அதைத் தணிக்கவோ குறிப்பிட்ட கோட்பாட்டு அமைப்புக்குள் சுருக்கவோ இல்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகருக்குப் புரியும் வகையில் எளிமையாகவும், வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘தீயோர்/நல்லோர்’ மற்றும் ‘நீதிமான்கள்/அநீதிமான்கள்’ என்ற மூலத்தின் சமச்சீர் எதிரிணைகள் பாதுகாக்கப்பட்டுள்ளன. வசனம் 44-ஆம் வசனத்தின் கட்டளையைத் தொடர்ந்து வரும் சார்பு நோக்க வாக்கியம் என்பதால், தமிழில் அதன் தொடர்பைத் தெளிவாக்க ‘இவ்வாறு செய்யுங்கள்’ சேர்க்கப்பட்டுள்ளது.
