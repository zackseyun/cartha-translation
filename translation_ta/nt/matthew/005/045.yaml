- from: பரலோகத்தில் இருக்கிற[a] உங்கள் தந்தையின் மகன்களாக[b] நீங்கள் ஆகும்படி இவ்வாறு செய்யுங்கள். ஏனெனில், அவர் தமது சூரியனைத் தீயோர் மீதும் நல்லோர் மீதும் உதிக்கச் செய்கிறார்; நீதிமான்கள் மீதும் அநீதிமான்கள் மீதும் மழை பெய்யச் செய்கிறார்.[c]
  to: பரலோகத்தில் இருக்கிற[a] உங்கள் தந்தையின் மகன்களாக[b] நீங்கள் ஆகும்படி, அவர் தமது சூரியனைத் தீயோர் மீதும் நல்லோர் மீதும் உதிக்கச் செய்கிறார்; நீதிமான்கள் மீதும் அநீதிமான்கள் மீதும் மழை பொழியச் செய்கிறார்.[c]
  rationale: 'The only substantive correction removes an unsupported imperative added from the wider context. The purpose clause is intentionally retained as a dependent clause, as in the Greek and English audit trail. The remaining revisions are stylistic: “மழை பொழியச் செய்கிறார்” is natural Tamil and faithfully communicates βρέχει in a context where God is the explicit subject.'
