  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μακάριοι οἱ ἐλεήμονες, ὅτι αὐτοὶ ἐλεηθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/007.yaml
  text: Blessed are the merciful[a], for they will be shown mercy.
translation:
  language: ta
  text: இரக்கமுள்ளவர்கள் பேறுபெற்றவர்கள்; ஏனெனில் அவர்களே இரக்கம் பெறுவார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριοι
  choice: பேறுபெற்றவர்கள்
  rationale: இது வெறும் மனநிறைவையோ மகிழ்ச்சியையோ அல்லாமல், கடவுளுடைய அருளால் உண்டாகும் நல்வாழ்வு நிலையைக் குறிக்கிறது. மலைப்பொழிவின் வாழ்த்துரைக்கேற்ற இறையியல் செறிவையும் சுருக்கத்தையும் இச்சொல் காக்கிறது.
- source_word: οἱ ἐλεήμονες
  choice: இரக்கமுள்ளவர்கள்
  rationale: கிரேக்கத்தில் பெயர்ச்சொல்லாகச் செயல்படும் உரிச்சொல்லை இயல்பான தமிழில் இவ்வாறு வழங்குகிறது. மேலும், இதே வேர்ச்சொல்லைக் கொண்ட ἐλεηθήσονται என்பதோடு உள்ள சொற்பொருள் எதிரொலியையும் காக்கிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முன்னுள்ள வாழ்த்துரைக்கான காரணம் அல்லது அடிப்படையைத் தெளிவாகக் குறிக்கிறது; நவீன செந்தமிழ் நடையில் இயல்பாகவும் உள்ளது.
- source_word: αὐτοὶ
  choice: அவர்களே
  rationale: கிரேக்க வலியுறுத்தலைக் காத்து, இரக்கமுள்ளவர்களுக்கும் இரக்கம் பெறுகிறவர்களுக்கும் இடையிலான நேரடியான ஒத்திசைவை வெளிப்படுத்துகிறது.
- source_word: ἐλεηθήσονται
  choice: இரக்கம் பெறுவார்கள்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தின் பொருளை இயல்பான தமிழில் தருகிறது; செய்பவரை வெளிப்படையாகச் சேர்க்காமல் விடுகிறது. ‘இரக்கமுள்ளவர்கள்—இரக்கம் பெறுவார்கள்’ என்ற மூலத்தின் சொல் எதிரொலியும் காக்கப்படுகிறது.
theological_decisions:
- issue: வாக்களிக்கப்பட்ட இரக்கத்தை அளிப்பவர் யார்?
  choice: செய்பவரைக் குறிப்பிடாமல் ‘இரக்கம் பெறுவார்கள்’ என்று மொழிபெயர்த்தல்
  alternative: ‘கடவுளால் இரக்கம் காட்டப்படுவார்கள்’ அல்லது ‘மற்றவர்களிடமிருந்து இரக்கம் பெறுவார்கள்’
  rationale: கிரேக்க வினை செயப்பாட்டு வடிவில் இருந்து, செய்பவரை வெளிப்படையாகக் குறிப்பிடவில்லை. சூழலில் கடவுளே செய்பவர் என்பது வலுவாகச் சுட்டப்பட்டாலும், மூலத்தில் இல்லாத தெளிவை மொழிபெயர்ப்பில் சேர்க்காமல் இறையியல் திறந்தநிலையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான வாழ்த்துரை நடையும் கண்ணியமான வேதாகம மொழிநடையும் பயன்படுத்தப்பட்டுள்ளன. ‘பாக்கியவான்கள்’ என்பதற்குப் பதிலாக பொதுவாசகருக்குப் புரியும், ஆனால் வெறும் உணர்ச்சிசார் ‘மகிழ்ச்சி’ எனக் குறுகாத ‘பேறுபெற்றவர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
