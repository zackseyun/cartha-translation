  text: καὶ ἐὰν ἀσπάσησθε τοὺς ⸀ἀδελφοὺς ὑμῶν μόνον, τί περισσὸν ποιεῖτε; οὐχὶ καὶ οἱ ⸀ἐθνικοὶ ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/047.yaml
  text: And if you greet only your brothers[c][b][a], what are you doing that is extraordinary? Do not even the Gentiles do the same?
translation:
  language: ta
  text: உங்கள் சகோதரர்களை[a] மட்டும் நீங்கள் வாழ்த்தினால், என்ன சிறப்பானதைச் செய்கிறீர்கள்?[b] பிற இனத்தாரும்[c] அதையே செய்வதில்லையா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சகோதர சகோதரிகளை”; கிரேக்கத்தில் “சகோதரர்கள்” என்று உள்ளது. இங்கு தம்மைச் சேர்ந்த குழுவினரையும் விரிவாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நீங்கள் கூடுதலாக என்ன செய்கிறீர்கள்?”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “யூதரல்லாதவர்கள்”; சில சூழல்களில் “வேற்று மதத்தார்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσησθε
  choice: வாழ்த்தினால்
  rationale: இச்சொல் ஒருவரைச் சந்திக்கும்போது வாழ்த்துதல் அல்லது வணக்கம் தெரிவித்தலைக் குறிக்கிறது. விருந்தோம்பல் என்ற கூடுதல் பொருளைச் சேர்க்காமல், சமூகச் செயலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἀδελφοὺς
  choice: சகோதரர்களை
  rationale: கிரேக்கச் சொல் ஆண்பால் பன்மையில் உள்ளது. அது நேரடியான சகோதரர்களையோ, விரிவாகத் தமது சொந்தக் குழுவினரையோ குறிக்கலாம்; பிரதான உரை வடிவத்தைப் பாதுகாக்கிறது, விரிவான வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: μόνον
  choice: மட்டும்
  rationale: செயல் ஒரு குறிப்பிட்ட குழுவினருக்கு மட்டுமே வரையறுக்கப்படுவதைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: τί περισσὸν ποιεῖτε
  choice: வழக்கத்திற்கு மேற்பட்டதாக என்ன செய்கிறீர்கள்?
  rationale: περισσόν என்பது சாதாரண அளவைத் தாண்டிய, கூடுதலான அல்லது தனிச்சிறப்பான ஒன்றைக் குறிக்கிறது. தமிழ் சொற்றொடர் அந்த ஒப்பீட்டு வலிமையைப் பாதுகாக்கிறது.
- source_word: ἐθνικοὶ
  choice: பிற இனத்தார்
  rationale: யூதச் சூழலில் இச்சொல் யூதரல்லாத மக்களைக் குறிக்கிறது. ‘பிற இனத்தார்’ இன-சமூக வேறுபாட்டைத் தெரிவிக்கிறது; ‘வேற்று மதத்தார்’ என்ற வலுவான மதத் தீர்ப்பை பிரதான உரையில் திணிக்கவில்லை.
- source_word: τὸ αὐτὸ
  choice: அதையே
  rationale: முன்பு கூறப்பட்ட வாழ்த்தும் செயலையே அவர்கள் செய்வதைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
theological_decisions:
- issue: அறநெறிப் போதனையில் ἀδελφοὺς என்பதன் வரம்பு
  choice: பிரதான உரையில் ‘சகோதரர்கள்’ என்று மொழிபெயர்த்து, சொந்தக் குழுவினரையும் உள்ளடக்கும் வாய்ப்பை அடிக்குறிப்பில் வைத்தல்.
  alternative: ‘சகோதர சகோதரிகள்’ அல்லது ‘தம்மைச் சேர்ந்தவர்கள்’
  rationale: கிரேக்கத்தின் ஆண்பால் பன்மை வடிவத்தை மறைக்காமல் பாதுகாக்கிறது; அதே நேரத்தில், இங்கு குடும்ப உறவுக்கு அப்பாற்பட்ட தமது சமூகத்தாரும் குறிக்கப்படலாம் என்ற உண்மையான பொருள் விரிவைத் தீர்மானித்துவிடாமல் தெரிவிக்கிறது.
- issue: ἐθνικοὶ என்பதன் பொருள்
  choice: ‘பிற இனத்தார்’
  alternative: ‘வேற்று மதத்தார்’ அல்லது ‘யூதரல்லாதவர்கள்’
  rationale: இச்சூழலில் முதன்மையாக யூதரல்லாதவர்களைக் குறிக்கும் இன-உடன்படிக்கைச் சார்ந்த எதிர்மறையைப் பாதுகாக்கிறது; ‘வேற்று மதத்தார்’ என்று மொழிபெயர்த்து மதரீதியான கண்டனத்தை மிகைப்படுத்துவதில்லை.
