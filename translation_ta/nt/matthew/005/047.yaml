  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளை கண்ணியமான போதனை நடையில் வடிவமைக்கப்பட்டுள்ளது. சொல்லுக்குச் சொல் கடினத்தன்மையைத் தவிர்த்து, கிரேக்க வினாவாக்கத்தின் அறநெறிச் சவாலும் ἐθνικοὶ என்பதிலுள்ள இன-சமூகப் பொருளும் பாதுகாக்கப்பட்டுள்ளன.
