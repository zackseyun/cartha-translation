  source_fidelity: The draft accurately represents the conditional greeting, the restriction ‘only,’ the referential ambiguity of ἀδελφούς, and the rhetorical question concerning ἐθνικοί doing the same. ‘பிற இனத்தார்’ is an acceptable non-polemical rendering of ἐθνικοί in this Jewish-context contrast, with ‘யூதரல்லாதவர்கள்’ appropriately retained as an alternative.
  naturalness: The phrase ‘வழக்கத்திற்கு மேற்பட்டதாக என்ன செய்கிறீர்கள்?’ is grammatically and idiomatically strained in modern standard Tamil. ‘என்ன சிறப்பானதைச் செய்கிறீர்கள்?’ naturally renders τί περισσὸν ποιεῖτε while retaining its sense of doing something exceptional or beyond the ordinary.
  terminology: ‘சகோதரர்களை’ preserves the masculine plural form without foreclosing the broader in-group sense, which is properly noted. ‘பிற இனத்தார்’ is preferable to an unnecessarily polemical religious label in the main text. The alternative note should use standalone noun forms rather than forms carrying the sentence conjunction -உம்.
