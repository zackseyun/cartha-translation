base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/010.yaml
  text: Blessed are those who have been persecuted because of righteousness[a], for theirs is the kingdom of heaven.
translation:
  language: ta
  text: நீதியின்[a] காரணமாகத் துன்புறுத்தப்பட்டவர்கள் பேறுபெற்றவர்கள்; ஏனெனில் விண்ணரசு அவர்களுக்கே உரியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நீதி” என்பதை “நியாயம்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ஒழுக்க நேர்மையையும் நியாயத்தையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: பேறுபெற்றவர்கள்
  rationale: வெறும் அகநிலை மகிழ்ச்சியைக் குறிக்கும் ‘மகிழ்ச்சியுள்ளவர்கள்’ என்பதைக் காட்டிலும், கடவுளால் அருளப்பட்ட நல்வாழ்வு மற்றும் அங்கீகாரத்தை அறிவிக்கும் வாழ்த்துரையின் பொருளை இது இயல்பாகக் காக்கிறது.
- source_word: οἱ δεδιωγμένοι
  choice: துன்புறுத்தப்பட்டவர்கள்
  rationale: பெயர்ச்சொல் நிலையில் வரும் நிறைவேற்றப்பட்ட செயப்பாட்டு வினையெச்சத்தின் பொருளைச் சுருக்கமாகத் தருகிறது; கடந்த துன்புறுத்தலின் விளைவாக அவர்கள் இப்போது உள்ள நிலையையும் சூழல் உணர்த்துகிறது.
- source_word: ἕνεκεν
  choice: நிமித்தம்
  rationale: துன்புறுத்தலுக்கான காரணத்தைத் தெளிவாகக் காட்டும், dignified modern Tamil usage.
- source_word: δικαιοσύνης
  choice: நீதியின்
  rationale: தமிழில் ‘நீதி’ என்பது நேர்மையான நடத்தை, கடவுளுடைய சித்தத்துக்கு ஏற்ப வாழ்தல், நியாயம் ஆகிய தொடர்புடைய பொருள்களைத் தாங்குவதால், கிரேக்கச் சொல்லின் ஒழுக்க மற்றும் நீதிநிலை பரப்பை அளவுக்கு மீறி குறுக்காமல் காக்கிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: இந்தப் பேறுபெற்ற நிலைக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: αὐτῶν ἐστιν
  choice: அவர்களுடையது
  rationale: உடைமை/உரிமை வலியுறுத்தலை இயல்பான தமிழில் சுருக்கமாகக் காக்கிறது.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: பரலோக அரசு
  rationale: மத்தேயுவுக்குரிய சொற்றொடரை இயல்பான தமிழில் தருகிறது; ‘அரசு’ என்பது நிலப்பரப்பை மட்டும் அல்லாமல் கடவுளின் ஆட்சியையும் குறிக்கக்கூடியது.
theological_decisions:
- issue: δικαιοσύνη என்பதன் பொருள்
  choice: நீதி
  alternative: நியாயம்; கடவுளுடைய சித்தத்துக்கு ஏற்ற நேர்மை
  rationale: இச்சூழலில் கடவுளுடைய சித்தத்துக்கு ஏற்ப வாழ்வதால் வரும் துன்புறுத்தலே முதன்மை; அதேவேளை சமூக நியாயம் என்ற உண்மையான பொருள் நிழலையும் அடிக்குறிப்பில் காக்கிறது.
- issue: ἡ βασιλεία τῶν οὐρανῶν என்பதன் தன்மை
  choice: பரலோக அரசு
  alternative: வானங்களின் அரசு; பரலோக ராஜ்யம்
  rationale: கடவுளுடைய ஆட்சியை ஒரு இடமாக மட்டும் சுருக்காமல், மத்தேயுவின் தனிப்பட்ட சொல்லாட்சியையும் வழக்கமான தமிழ் புரிதலையும் சமநிலைப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வாழ்த்துரை நடை பயன்படுத்தப்பட்டுள்ளது. ‘பேறுபெற்றவர்கள்’ என்பது அறிவிப்புத் தன்மையைக் காக்கிறது; ‘துன்புறுத்தப்பட்டவர்கள்’ கிரேக்க நிறைவேற்றப்பட்ட செயப்பாட்டு வடிவத்தை இயல்பாக பிரதிபலிக்கிறது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
