id: MAT.5.32
reference: Matthew 5:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι ⸂πᾶς ὁ ἀπολύων⸃ τὴν γυναῖκα αὐτοῦ παρεκτὸς λόγου πορνείας ποιεῖ αὐτὴν ⸀μοιχευθῆναι, καὶ ὃς ἐὰν ἀπολελυμένην γαμήσῃ μοιχᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/032.yaml
  text: But I say to you that everyone who divorces his wife[a], except on the ground of sexual immorality, makes her commit adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: ta
  text: 'ஆனால் நான் உங்களுக்குச் சொல்கிறேன்: பாலியல் ஒழுக்கக்கேடு[b] என்ற காரணத்தைத் தவிர, தன் மனைவியை விவாகரத்து செய்கிற எவனும் அவளை விபசாரம் செய்ய வைக்கிறான்[a]; விவாகரத்து செய்யப்பட்ட பெண்ணைத் திருமணம் செய்கிற எவனும் விபசாரம் செய்கிறான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “அவளை விபசாரியாக ஆக்குகிறான்” என்றும் மொழிபெயர்க்கலாம்; கிரேக்க முடிவிலா வினை செயப்பாட்டு வடிவில் உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “பாலியல் ஒழுக்கக்கேடு” என்பது கிரேக்கத்தின் porneia என்ற சொல்லை மொழிபெயர்க்கிறது. இது முறைகேடான பாலியல் நடத்தைகளைக் குறிக்கும் அகன்ற சொல்; சிலர் இதை “வேசித்தனம்” அல்லது “கற்புக்கேடு” என்று மொழிபெயர்க்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύων / ἀπολελυμένην
  choice: விவாகரத்து செய்கிற / விவாகரத்து செய்யப்பட்ட
  rationale: திருமணச் சூழலில் ἀπολύω என்பது பொதுவாக ‘அனுப்பிவிடுதல்’ என்பதைக் காட்டிலும் ‘விவாகரத்து செய்தல்’ என்ற சட்டபூர்வமான திருமணப் பொருளைக் கொண்டுள்ளது. நவீனத் தமிழில் இந்தப் பொருளைத் தெளிவாகக் கூற ‘விவாகரத்து’ பயன்படுத்தப்பட்டது.
- source_word: γυναῖκα
  choice: மனைவி
  rationale: γυνή என்பதற்கு ‘பெண்’ அல்லது ‘மனைவி’ என்று பொருள் வரலாம்; αὐτοῦ என்ற உடைமைச் சொல்லும் விவாகரத்துச் சூழலும் இங்கே ‘மனைவி’ என்பதைத் தேவைப்படுத்துகின்றன.
- source_word: παρεκτὸς λόγου πορνείας
  choice: பாலியல் ஒழுக்கக்கேடு என்ற காரணத்தைத் தவிர
  rationale: παρεκτός உண்மையான விதிவிலக்கை அறிமுகப்படுத்துகிறது; λόγος இங்கே காரணம் அல்லது விவகாரம் என்ற பொருளிலும், πορνεία பலவகையான முறைகேடான பாலியல் நடத்தைகளை உள்ளடக்கும் அகன்ற பொருளிலும் வருகிறது. அதனால் அதை ஒரு குறிப்பிட்ட பாலியல் செயலாகச் சுருக்காமல் மொழிபெயர்க்கப்பட்டது.
- source_word: ποιεῖ αὐτὴν μοιχευθῆναι
  choice: அவளை விபசாரம் செய்ய வைக்கிறான்
  rationale: ποιέω + வினையெச்சம் காரணப்படுத்தும் பொருளைக் கொடுக்கிறது. μοιχευθῆναι வடிவில் செயப்பாட்டுவினையாக இருந்தாலும், தமிழில் இயல்பாகப் புரியும்படி முதன்மை உரையில் காரணவினை அமைப்பு பயன்படுத்தப்பட்டு, வடிவுசார்ந்த மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: ὃς ἐὰν ... γαμήσῃ
  choice: திருமணம் செய்கிற எவனும்
  rationale: ἐάν உடன் வரும் தொடர்புச் சொற்றொடர் பொதுவான, வரையறுக்கப்படாத நிபந்தனையைத் தெரிவிக்கிறது; ‘எவனும்’ என்பது ஆண் சார்ந்த சமூகச் சூழலையும் பொதுவான வாக்கிய வலிமையையும் இயல்பாகத் தருகிறது.
- source_word: μοιχᾶται
  choice: விபசாரம் செய்கிறான்
  rationale: இந்நிகழ்கால வடிவம் தமிழில் இயல்பாக ‘விபசாரம் செய்கிறான்’ என்று வழங்கப்படுகிறது; கிரேக்க வினைக் குரலின் நுணுக்கத்தைத் தமிழில் கட்டாயமாக வெளிப்படுத்துவது இயல்பற்றதாக இருக்கும்.
- source_word: πᾶς ὁ ἀπολύων
  choice: விவாகரத்து செய்கிற எவனும்
  rationale: ஆண்பால் ஒருமைச் சொற்றொடர் இச்சூழலில் பொதுவான விதியைத் தெரிவிக்கிறது; ‘எவனும்’ என்பது அந்தப் பொதுவான வலிமையையும், ‘தன் மனைவி’ என்பது அக்கால ஆண் சார்ந்த சூழலையும் தெளிவாக்குகின்றன.
theological_decisions:
- issue: παρεκτὸς λόγου πορνείας என்ற விதிவிலக்குச் சொற்றொடரின் பொருள்
  choice: ‘பாலியல் ஒழுக்கக்கேடு என்ற காரணத்தைத் தவிர’ என்று உண்மையான விதிவிலக்காக மொழிபெயர்த்தல்
  alternative: ‘பாலியல் ஒழுக்கக்கேடு எனப்படும் விவகாரத்தைத் தவிர’ அல்லது ‘சட்டவிரோதத் திருமணத்தைத் தவிர’
  rationale: கிரேக்க உரை வெளிப்படையாக ஒரு விதிவிலக்கைக் காட்டுகிறது. ஆனால் πορνεία என்பதன் சரியான எல்லையை மொழிபெயர்ப்பிலேயே குறுக்கவோ தனிப்பட்ட கோட்பாட்டின்படி வரையறுக்கவோ கூடாது; ஆகவே அதன் அகன்ற தன்மையும் இறையியல் இழுபறியும் பாதுகாக்கப்பட்டன.
- issue: ποιεῖ என்பதற்குப் பின் வரும் μοιχευθῆναι என்பதன் வலிமை
  choice: முதன்மை உரையில் இயல்பான தமிழாக ‘அவளை விபசாரம் செய்ய வைக்கிறான்’ என்று வழங்கி, செயப்பாட்டு/விளைவுநிலை நுணுக்கத்தை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘அவளை விபசாரியாக ஆக்குகிறான்’ அல்லது ‘அவள் விபசாரத்துக்கு உள்ளாக்கப்படும்படி செய்கிறான்’
  rationale: μoιχευθῆναι வடிவில் செயப்பாட்டுவினையாக உள்ளது; அது செயல், விளைவு, அல்லது அவள்மீது நிகழும் நிலை ஆகியவற்றில் எதை முன்னிறுத்துகிறது என்பது விவாதத்துக்குரியது. வாசிப்புத் தெளிவுக்காக இயல்பான காரணவினை முதன்மை உரையில் வைக்கப்பட்டாலும், மாற்று நுணுக்கம் மறைக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் தெளிவுடனும் வேதவாக்கியத்துக்குரிய கண்ணியமான தொனியுடனும் மொழிபெயர்க்கப்பட்டது. ‘விவாகரத்து’ மற்றும் ‘பாலியல் ஒழுக்கக்கேடு’ ஆகியவை இன்றைய வாசகருக்கு நேரடியாகப் புரியும் சொற்கள். மூலத்தின் விதிவிலக்கும் செயப்பாட்டு வினையின் தெளிவின்மையும் அடிக்குறிப்புகள் மூலம் பாதுகாக்கப்பட்டுள்ளன.
