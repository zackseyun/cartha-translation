review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the legal setting, the intended taking of the χιτών, and the imperative to yield the ἱμάτιον as well. However, “உன்னோடு வழக்காடி” can suggest simply litigating with the hearer and is less explicit than the Greek context, in which legal action is brought against the hearer. “உன் மீது வழக்குத் தொடர்ந்து” conveys this relation more clearly without over-specifying the legal procedure.
  naturalness: The revised wording is natural, dignified modern standard Tamil. “உன் மீது வழக்குத் தொடர்ந்து” is a more idiomatic and precise legal collocation than “உன்னோடு வழக்காடி.”
  terminology: “உள் அங்கி” and “மேலங்கி” appropriately retain the historically important distinction between χιτών and ἱμάτιον. The cultural footnote adequately explains the distinction. No doctrinal terminology is involved.
  issues:
  - severity: medium
    issue: The phrase “உன்னோடு வழக்காடி” is potentially imprecise for σοι κριθῆναι.
    rationale: It can portray a reciprocal dispute rather than a person bringing legal proceedings against the hearer. The immediate purpose clause, taking the hearer’s inner garment, favors an explicitly adversarial legal expression.
  revised_text: உன் மீது வழக்குத் தொடர்ந்து உன் உள் அங்கியை எடுத்துக்கொள்ள விரும்புகிறவனுக்கு, உன் மேலங்கியையும் விட்டுக்கொடு.
  revised_footnotes:
  - marker: a
    text: அல்லது, “உன்னை நீதிமன்றத்துக்கு அழைத்துச் செல்ல.” கிரேக்கச் சொல் சொற்படியாகச் சட்டச் சூழலில் தீர்ப்புக்காக வருவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “உள் அங்கி” என்பது உடலுக்கு அண்மையில் அணிந்த ஆடை; “மேலங்கி” என்பது அதற்கு வெளியே அணிந்த ஆடை.
    reason: cultural_note
  revision_rationale: The revision clarifies that the other party initiates a legal claim against the hearer, matching the contextual force of σοι κριθῆναι, while retaining the direct imperative and the contrast between inner and outer garments. Footnote a is adjusted so that its alternative is a complete and idiomatic Tamil expression and continues to note the underlying legal sense.
