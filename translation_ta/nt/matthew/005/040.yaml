revisions:
- from: உன்னோடு வழக்காடி[a] உன் உள் அங்கியை[b] எடுத்துக்கொள்ள விரும்புகிறவனுக்கு, உன் மேலங்கியையும் விட்டுக்கொடு.
  to: உன் மீது வழக்குத் தொடர்ந்து உன் உள் அங்கியை எடுத்துக்கொள்ள விரும்புகிறவனுக்கு, உன் மேலங்கியையும் விட்டுக்கொடு.
  rationale: The revision clarifies that the other party initiates a legal claim against the hearer, matching the contextual force of σοι κριθῆναι, while retaining the direct imperative and the contrast between inner and outer garments. Footnote a is adjusted so that its alternative is a complete and idiomatic Tamil expression and continues to note the underlying legal sense.
  reviewer_model: gpt-5.6-terra
