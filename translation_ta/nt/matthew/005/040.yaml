id: MAT.5.40
reference: Matthew 5:40
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ τῷ θέλοντί σοι κριθῆναι καὶ τὸν χιτῶνά σου λαβεῖν, ἄφες αὐτῷ καὶ τὸ ἱμάτιον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/040.yaml
  text: And to the one who wants to sue you and take your tunic[b][a], let him have your cloak also.
translation:
  language: ta
  text: உன் மீது வழக்குத் தொடர்ந்து உன் உள் அங்கியை எடுத்துக்கொள்ள விரும்புகிறவனுக்கு, உன் மேலங்கியையும் விட்டுக்கொடு.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῷ θέλοντί
  choice: விரும்புகிறவனுக்கு
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புவினை, பொதுவாக அப்படிச் செய்ய விரும்பும் ஒருவனைக் குறிக்கிறது; இந்தத் தமிழ் வடிவம் அதன் விருப்பப் பொருளை இயல்பாகப் பாதுகாக்கிறது.
- source_word: σοι κριθῆναι
  choice: உன்னோடு வழக்காடி
  rationale: இச்சூழலில் இச்சொற்றொடர் நீதிமன்ற வழக்கில் ஒருவருக்கு எதிராக உரிமைகோருவதைக் குறிக்கிறது. ‘உன்னோடு வழக்காடி’ என்பது சட்டச் சூழலைத் தெளிவாகவும், மூலத்தின் ‘தீர்ப்பிடப்படுதல்’ சார்ந்த பரந்த சொல்லாட்சியை மிகையாகக் குறுக்காமலும் தருகிறது.
- source_word: χιτῶνά
  choice: உள் அங்கியை
  rationale: χιτών உடலுக்கு அண்மையில் அணியப்பட்ட உள்ளாடை வகையான அங்கியைக் குறிக்கிறது. ‘உள் அங்கி’ என்பது வரலாற்று உடை வேறுபாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: λαβεῖν
  choice: எடுத்துக்கொள்ள
  rationale: சட்ட நடவடிக்கையின் மூலம் உடைமையைப் பெற்றுக்கொள்வது இங்கு கருத்து; ‘எடுத்துக்கொள்ள’ இதை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἄφες
  choice: விட்டுக்கொடு
  rationale: ἀφίημι என்பதன் கட்டளை வடிவம் இங்கு எதிர்ப்பின்றி மற்றவரிடம் அதை ஒப்படைக்க அனுமதிப்பதைக் குறிக்கிறது. ‘விட்டுக்கொடு’ நேரடியான கட்டளையையும் உரிமையைத் துறக்கும் கூர்மையையும் பாதுகாக்கிறது.
- source_word: ἱμάτιον
  choice: மேலங்கி
  rationale: ἱμάτιον என்பது χιτών-இலிருந்து வேறுபட்ட வெளிப்புற ஆடை. ‘மேலங்கி’ இந்த எதிர்மறையைக் குறுகிய, புரிந்துகொள்ளக்கூடிய தமிழில் தருகிறது.
- source_word: καὶ ... καὶ
  choice: … மேலங்கியையும்
  rationale: இரண்டாவது καί கூடுதலாக இன்னொரு ஆடையையும் விட்டுக்கொடுப்பதை வலியுறுத்துகிறது; தமிழின் ‘-யும்’ அந்தச் சேர்க்கைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சட்டத் தகராறில் இயேசுவின் கட்டளையின் ஒழுக்கவியல் வலிமை
  choice: பழிவாங்காமல் அளவுகடந்து விட்டுக்கொடுப்பதற்கான நேரடிக் கட்டளையாக மொழிபெயர்க்கப்பட்டது.
  alternative: தன் உரிமைகளை விட்டுக்கொடுப்பது பற்றிய பொதுவான உருவகக் கொள்கையாகத் தளர்த்தி மொழிபெயர்த்தல்.
  rationale: ἄφες என்ற கட்டளையும் குறிப்பிட்ட இரு ஆடைகளின் உருவகமும் போதனையின் அதிர்ச்சியூட்டும் நேரடித்தன்மையை நிலைநிறுத்துகின்றன. எந்தக் குறிப்பிட்ட கோட்பாட்டு வரம்பையும் சேர்க்காமல் அந்த வலிமை பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘உள் அங்கி—மேலங்கி’ என்ற இணை, பண்டைய உடைகளின் வேறுபாட்டை வாசகருக்குத் தெளிவாக்குகிறது; நேரடியான ஒருமை முன்னிலை வடிவங்கள் மூலத்தின் தனிப்பட்ட அழைப்பைத் தக்கவைக்கின்றன.
