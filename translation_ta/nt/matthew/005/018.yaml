source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν, ἕως ἂν παρέλθῃ ὁ οὐρανὸς καὶ ἡ γῆ, ἰῶτα ἓν ἢ μία κεραία οὐ μὴ παρέλθῃ ἀπὸ τοῦ νόμου, ἕως ἂν πάντα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/018.yaml
  text: For truly I say to you[a], until heaven and earth pass away[c][b], not one iota or one stroke will ever pass away from the law until all things happen.
translation:
  language: ta
  text: 'ஏனெனில், உண்மையாகவே நான் உங்களுக்குச் சொல்கிறேன்: வானமும் பூமியும் மறைந்துபோகும்வரை, திருச்சட்டத்திலிருந்து ஒரு இயோட்டாவோ[a] ஒரு சிறு கோடோ[b] ஒருபோதும் மறைந்துபோகாது; அனைத்தும் நிகழும்வரை[c] அப்படியே இருக்கும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்க மொழியின் மிகச் சிறிய எழுத்தின் பெயர்; அல்லது, “ஓர் இம்மியளவு எழுத்து.”
    reason: lexical_alternative
  - marker: b
    text: எழுத்துகளை வேறுபடுத்தும் மிகச் சிறிய கோடு அல்லது குறி.
    reason: lexical_alternative
  - marker: c
    text: 'அல்லது: “அனைத்தும் நிறைவேறும்வரை” / “எல்லாம் நடந்து முடிவதுவரை.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: உண்மையாகவே
  rationale: இயேசுவின் அதிகாரபூர்வமான உறுதிமொழியின் வலிமையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கு விளக்க ஆதாரம் தரும் இணைப்புச் சொல்லின் பொருளைப் பாதுகாக்கிறது.
- source_word: λέγω ὑμῖν
  choice: நான் உங்களுக்குச் சொல்கிறேன்
  rationale: நேரடியான, கண்ணியமான வடிவில் இயேசுவின் அதிகாரத் தொனியைப் பேணுகிறது.
- source_word: ἕως ἂν παρέλθῃ ὁ οὐρανὸς καὶ ἡ γῆ
  choice: வானமும் பூமியும் மறைந்துபோகும்வரை
  rationale: παρέρχομαι என்பதன் முடிவுறுதல் அல்லது கடந்து மறைதல் என்ற கருத்தையும் உலகளாவிய சொற்றொடரையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἰῶτα ἓν
  choice: ஓர் இம்மியளவு எழுத்து
  rationale: கிரேக்க எழுத்துப் பெயரைத் தமிழில் வெறுமனே ஒலிபெயர்ப்பதைவிட, மிகச் சிறிய எழுத்து என்ற நோக்கத்தை சாதாரண வாசகருக்குத் தெளிவாக்குகிறது; குறிப்பில் சொற்பொருள் தரப்படுகிறது.
- source_word: μία κεραία
  choice: ஒரு சிறு எழுத்துக்குறி
  rationale: எழுத்துகளை வேறுபடுத்தும் மிகச் சிறிய கோடு அல்லது முனையைக் குறிக்கும் உருவகத்தை நவீன தமிழில் புரியும்படி தருகிறது.
- source_word: οὐ μὴ παρέλθῃ
  choice: ஒருபோதும் மறைந்துபோகாது
  rationale: οὐ μή அமைப்பின் வலியுறுத்தப்பட்ட மறுப்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἀπὸ τοῦ νόμου
  choice: திருச்சட்டத்திலிருந்து
  rationale: சூழலில் இது வேதாகமத் திருச்சட்டத்தைக் குறிப்பதால் பொதுவான சட்டம் என்று தவறாகப் புரிவதைத் தவிர்க்கிறது; அதே நேரத்தில் தோரா அல்லது முழுப் பழைய ஏற்பாடு என்று மிகையாக வரையறுக்கவில்லை.
- source_word: ἕως ἂν πάντα γένηται
  choice: அனைத்தும் நிகழ்ந்தேறும்வரை
  rationale: நிகழ்தல் மற்றும் நிறைவேறுதல் ஆகிய இரு நிழற்பொருள்களையும் முடிந்தவரை ஒன்றாக வைத்திருந்து கருத்தியல் பதற்றத்தைத் திறந்தே வைக்கிறது.
theological_decisions:
- issue: νόμος என்பதன் வரம்பு
  choice: திருச்சட்டம்
  alternative: தோரா மட்டும்; அல்லது விரிவாக முழுப் பழைய ஏற்பாடு
  rationale: மத்தேயு 5:17–19 சூழல் வேதாகமச் சட்டத்தைக் குறிக்கிறது. ஆனால் கிரேக்கச் சொல் அதன் துல்லியமான நூற்பரப்பை இங்கு தனியே வரையறுக்காததால் மொழிபெயர்ப்பும் அதைத் தீர்மானித்துவிடவில்லை.
- issue: πάντα γένηται என்பதன் பொருள்
  choice: அனைத்தும் நிகழ்ந்தேறும்வரை
  alternative: அனைத்தும் நிகழும்வரை; அனைத்தும் நிறைவேறும்வரை
  rationale: γίνομαι நிகழ்வதையும் சூழலில் நோக்கம் நிறைவேறுவதையும் சுட்டக்கூடும். ஒரு குறிப்பிட்ட இறையியல் காலவரிசையைத் திணிக்காமல் இரு சாத்தியங்களையும் பேணுகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு அணுக்கமான, கண்ணியமான வேதாகம நடையைக் கடைப்பிடிக்கிறது. “இம்மியளவு” என்ற பரிச்சயமான சொல் மிகச் சிறிய அளவை உணர்த்துகிறது; “எழுத்து” சேர்க்கப்பட்டதால் உருவகம் தெளிவாகிறது. வாக்கிய அமைப்பு கிரேக்கத்தின் இரு ἕως கூறுகளையும் வெளிப்படையாகப் பேணுகிறது.
