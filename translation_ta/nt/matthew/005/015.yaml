id: MAT.5.15
reference: Matthew 5:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐδὲ καίουσιν λύχνον καὶ τιθέασιν αὐτὸν ὑπὸ τὸν μόδιον ἀλλ’ ἐπὶ τὴν λυχνίαν, καὶ λάμπει πᾶσιν τοῖς ἐν τῇ οἰκίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/015.yaml
  text: Nor do people light a lamp and put it under a basket[a], but on a lampstand[b], and it gives light to everyone in the house.
translation:
  language: ta
  text: மேலும், மக்கள் விளக்கை ஏற்றி அதை அளவுக்கூடையின் கீழே வைப்பதில்லை; மாறாக, விளக்குத்தாங்கியின் மேல் வைக்கிறார்கள்; அது வீட்டிலுள்ள அனைவருக்கும் ஒளி தருகிறது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ
  choice: மேலும் ... வைப்பதில்லை
  rationale: முந்தைய கூற்றுடன் இணையும் கூடுதல் எதிர்மறை எடுத்துக்காட்டை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: καίουσιν λύχνον
  choice: விளக்கை ஏற்றி
  rationale: λύχνος என்பது இங்கு எண்ணெய் விளக்கு; καίω என்பதுடன் சேர்ந்தபோது தமிழில் ‘விளக்கை ஏற்று’ என்பது இயல்பான சொல்லாக்கம்.
- source_word: τιθέασιν αὐτὸν ὑπὸ τὸν μόδιον
  choice: அதை அளவுக்கூடையின் கீழே வைப்பதில்லை
  rationale: μόδιος என்பது உலர் பொருட்களை அளக்கும் அளவையும், அதன் கொள்கலனையும் குறிக்கிறது. ‘அளவுக்கூடை’ அதன் அளவிடும் பணியையும் பொருளின் வடிவத்தையும் தெளிவாகத் தக்கவைக்கிறது.
- source_word: ἀλλ’ ἐπὶ τὴν λυχνίαν
  choice: விளக்குத்தண்டின்மேல்தான் வைக்கிறார்கள்
  rationale: λυχνία என்பது விளக்கை வைக்கும் தண்டு அல்லது தாங்கி. ‘தான்’ எதிர்மறை–நேர்மறை வேறுபாட்டை இயல்பாக வலியுறுத்துகிறது.
- source_word: λάμπει
  choice: ஒளி தருகிறது
  rationale: விளக்கு வீட்டிலுள்ளோருக்குப் பயன்படும் விதத்தில் பிரகாசிப்பதை இயல்பான தமிழில் தெரிவிக்கிறது; ‘ஒளிர்கிறது’ என்பதும் சாத்தியம்.
- source_word: πᾶσιν τοῖς ἐν τῇ οἰκίᾳ
  choice: வீட்டிலுள்ள அனைவருக்கும்
  rationale: πᾶσιν என்பதன் முழுமையான பரப்பையும் οἰκίᾳ என்பதன் இடம்சார் பொருளையும் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: கிரேக்கத்தில் வெளிப்படையாகக் குறிப்பிடப்படாத பொதுவான மூன்றாம் நபர் பன்மை எழுவாய்
  choice: மக்கள் விளக்கை ஏற்றி
  alternative: ஒருவர் விளக்கை ஏற்றி
  rationale: கிரேக்கப் பன்மை வினைச்சொல் பொதுவாக மனிதர்கள் செய்வதைச் சுட்டுகிறது. ‘மக்கள்’ என்பது அந்தப் பொதுத்தன்மையைக் காக்கிறது; குறிப்பிட்ட சிலரைச் சுட்டும் ‘அவர்கள்’ என்ற தவறான எண்ணத்தையும் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும், அதேவேளை கண்ணியமான நடையில் அமைக்கப்பட்டது. மூலத்தின் பழமொழித் தன்மையும் எதிர்மறை–நேர்மறை இணை அமைப்பும் காக்கப்பட்டுள்ளன.
