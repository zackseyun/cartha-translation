revisions:
- from: மேலும், மக்கள் விளக்கை ஏற்றி, அதை அளவுக்கூடையின் கீழே வைப்பதில்லை; விளக்குத்தண்டின்மேல்தான் வைக்கிறார்கள். அப்போது அது வீட்டிலுள்ள அனைவருக்கும் ஒளி தருகிறது.
  to: மேலும், மக்கள் விளக்கை ஏற்றி அதை அளவுக்கூடையின் கீழே வைப்பதில்லை; மாறாக, விளக்குத்தாங்கியின் மேல் வைக்கிறார்கள்; அது வீட்டிலுள்ள அனைவருக்கும் ஒளி தருகிறது.
  rationale: The revision removes the unsupported temporal nuance, explicitly represents the Greek adversative ἀλλά, and uses natural contemporary Tamil for a lampstand. The meaning and proverbial generic plural are retained, and a lexical note clarifies the culturally specific measuring container.
