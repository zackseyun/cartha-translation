id: MAT.5.14
reference: Matthew 5:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὑμεῖς ἐστε τὸ φῶς τοῦ κόσμου. οὐ δύναται πόλις κρυβῆναι ἐπάνω ὄρους κειμένη·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/014.yaml
  text: You are the light of the world[a]. A city set on a hill cannot be hidden.
translation:
  language: ta
  text: நீங்களே உலகத்தின் ஒளி. மலையின்மேல் அமைந்துள்ள ஒரு நகரம் மறைந்திருக்க முடியாது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς
  choice: நீங்களே
  rationale: கிரேக்கத்தில் இரண்டாம் நபர் பன்மைப் பெயர்ச்சொல் வெளிப்படையாகவும் வலியுறுத்தலுடனும் உள்ளது; தமிழில் ‘நீங்களே’ அந்த நேரடி வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὸ φῶς
  choice: ஒளி
  rationale: உருவக அடையாளத்தை நேரடியாகத் தக்கவைக்கிறது. தமிழ் பயனிலையில் ‘உலகத்தின் ஒளி’ என்பதில் தனியான சுட்டுச் சொல் தேவையில்லை.
- source_word: τοῦ κόσμου
  choice: உலகத்தின்
  rationale: மூலத்தின் உரிமைவேற்றுமைத் தொடர்பை விளக்கச் சேர்க்காமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: οὐ δύναται
  choice: முடியாது
  rationale: இயலாமையைத் தெரிவிக்கும் இயற்கையான நவீனத் தமிழ் வடிவம்.
- source_word: πόλις
  choice: ஒரு நகரம்
  rationale: πόλις என்பதற்கான வழக்கமான பொருள் ‘நகரம்’; தமிழில் வரையறுக்கப்படாத பெயரைக் காட்ட ‘ஒரு’ இயல்பாகப் பயன்படுகிறது.
- source_word: κρυβῆναι
  choice: மறைந்திருக்க
  rationale: செயப்பாட்டு வடிவத்தின் பொருளை இயல்பான தமிழில் தருகிறது; நகரம் கண்ணுக்குப் புலப்படாமல் இருப்பதே இங்குள்ள கருத்து.
- source_word: ἐπάνω ὄρους
  choice: மலையின்மேல்
  rationale: ὄρος என்பதன் முதன்மைப் பொருளான ‘மலை’ என்பதையும் ἐπάνω குறிக்கும் மேலிருக்கும் இடத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: κειμένη
  choice: அமைந்துள்ள
  rationale: நகரம் ஓர் இடத்தில் நிலைகொண்டிருப்பதைக் குறிக்கும் கειμένη என்பதற்கு இயற்கையான தமிழாக்கம்; ‘கிடக்கிற’ என்ற மிகச் சொற்படியான ஆனால் இச்சூழலில் குறைவாக இயங்கும் வடிவத்தைத் தவிர்க்கிறது.
theological_decisions:
- issue: சீடர்கள் உலகத்தின் ஒளி என்ற உருவக அடையாளம்
  choice: ‘நீங்களே உலகத்தின் ஒளி’ என்ற நேரடி உருவகம் தக்கவைக்கப்பட்டது.
  alternative: ‘நீங்கள் உலகத்திற்கான ஒளி’
  rationale: மூலத்தில் உள்ள உரிமைவேற்றுமைத் தொடர்பையும் நேரடி அடையாள உருவகத்தையும் பாதுகாத்து, அதன் பணியை விளக்கமாக விரித்துரைப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. மூலத்தின் வலியுறுத்தலை ‘நீங்களே’ என்பதன் மூலம் வெளிப்படுத்தி, இரண்டாம் வாக்கியத்தின் இடவியல் படிமத்தை சொற்பொருளுக்கு நெருக்கமாக வைத்துள்ளது.
