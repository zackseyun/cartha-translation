source:
  edition: SBLGNT
  text: μακάριοί ἐστε ὅταν ὀνειδίσωσιν ὑμᾶς καὶ διώξωσιν καὶ εἴπωσιν πᾶν ⸀πονηρὸν καθ’ ὑμῶν ψευδόμενοι ἕνεκεν ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/011.yaml
  text: Blessed are you when they insult you and persecute you and falsely say every kind of evil against you because of me[a][b][c].
translation:
  language: ta
  text: “என் காரணமாக அவர்கள் உங்களை இகழ்ந்து, துன்புறுத்தி, உங்களுக்கு எதிராக எல்லாவிதமான தீயவற்றையும் பொய்யாகப் பேசும்போது, நீங்கள் பேறுபெற்றவர்கள்[a][b][c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இகழ்ந்து” என்பதற்கு மாற்றாக, “நிந்தித்து” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “எல்லாவிதமான தீயவற்றையும்” என்பதற்கு மாற்றாக, “எல்லாத் தீய சொற்களையும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “என் காரணமாக” என்பதற்கு மாற்றாக, “என் நிமித்தம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοί ἐστε
  choice: நீங்கள் பேறுபெற்றவர்கள்
  rationale: மலைப்பொழிவின் வாழ்த்துரை வடிவத்தையும் இறையியல் நிறையையும் காக்கிறது; அதேவேளையில் இன்றைய வாசகர்களுக்குத் தெளிவான, பாலினத்தை முன்னிறுத்தாத இயல்பான சொல்லாக்கமாக உள்ளது.
- source_word: ὅταν
  choice: சொல்லும்போது
  rationale: பின்வரும் மூன்று வினைகளையும் சார்ந்த பொதுவான நிகழ்வுநிலையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὀνειδίσωσιν
  choice: உங்களை இகழ்ந்து
  rationale: அவமதிக்கும் வாய்மொழித் தாக்குதலை எளிய நவீன தமிழில் தெரிவிக்கிறது; ‘நிந்தித்து’ என்பது சாத்தியமான, சற்றே மரபான மாற்று.
- source_word: διώξωσιν
  choice: துன்புறுத்தி
  rationale: இயேசுவின் காரணமாக எதிர்கொள்ளப்படும் பகைமையான ஒடுக்குதலின் பரந்த பொருளைக் காக்கிறது; அதை உடல் வன்முறையாக மட்டும் குறுக்கவில்லை.
- source_word: εἴπωσιν πᾶν πονηρὸν καθ’ ὑμῶν
  choice: உங்களுக்கு எதிராக எல்லாவிதமான தீமைகளையும் … சொல்லும்போது
  rationale: πᾶν πονηρόν என்பதன் விரிவான, தொகுப்புப்பொருளையும் κατά என்பதன் எதிர்நிலையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ψευδόμενοι
  choice: பொய்யாகச்
  rationale: தீமையான குற்றச்சாட்டுகள் உண்மையற்றவை என்பதை, ‘சொல்லுதல்’ என்னும் வினையை இயல்பாக விளக்கும் வினையடையாகக் காட்டுகிறது.
- source_word: ἕνεκεν ἐμοῦ
  choice: என் காரணமாக
  rationale: இயேசுவுடனான தொடர்பே இந்த எதிர்ப்புக்குக் காரணம் என்பதை நேரடியாகத் தெரிவிக்கிறது; ‘என் நிமித்தம்’ என்ற மரபான சொல்லாக்கமும் சாத்தியம்.
theological_decisions:
- issue: விவரிக்கப்படும் எதிர்ப்பின் இயல்பு
  choice: இயேசுவின் காரணமாக நேரிடும் இகழ்ச்சி, பரந்தவகைத் துன்புறுத்தல், பொய்யான தீய குற்றச்சாட்டு ஆகிய மூன்றையும் தனித்தும் ஒருங்கிணைந்தும் காக்கிறது.
  alternative: ‘துன்புறுத்துதல்’ என்பதை உடல் வன்முறையாக மட்டும் அல்லது முழு வசனத்தையும் அவதூறாக மட்டும் குறுக்கிப் புரிதல்.
  rationale: மூன்று இணைக்கப்பட்ட வினைகளும் எதிர்ப்பின் பல வடிவங்களைக் குறிக்கின்றன; மூல உரை அவற்றை ஒரு குறிப்பிட்ட சட்ட, சமூக, அல்லது உடல் வடிவத்திற்குள் வரையறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பேறுபெற்றவர்கள்’ என்பது வாழ்த்துரையின் இறையியல் நிறையைத் தக்கவைத்தபடி பாலினத்தை முன்னிறுத்தாத வடிவத்தை அளிக்கிறது. மூலத்தின் நீண்ட நிபந்தனைத் தொடரைத் தமிழின் இயல்புக்கேற்ப காரணத் தொடரால் தொடங்கி, பிரதான வாழ்த்துரையால் முடித்துள்ளது.
