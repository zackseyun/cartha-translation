id: MAT.5.28
reference: Matthew 5:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ βλέπων γυναῖκα πρὸς τὸ ἐπιθυμῆσαι αὐτὴν ἤδη ἐμοίχευσεν αὐτὴν ἐν τῇ καρδίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/028.yaml
  text: But I say to you that everyone who looks at a woman in order to desire her has already committed adultery with her in his heart[a][b][c].
translation:
  language: ta
  text: 'ஆனால் நான் உங்களுக்குச் சொல்கிறேன்: ஒரு பெண்ணை ஆசைப்படும் நோக்கத்துடன் பார்க்கிற ஒவ்வொருவரும், ஏற்கெனவே தன் இதயத்தில் அவளுடன் விபசாரம் செய்துவிட்டார்.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஒரு மனைவியை’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் சூழலுக்கு ஏற்ப ‘பெண்’ அல்லது ‘மனைவி’ என்று பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: ‘அவள்மீது காம இச்சை கொள்வதற்காக’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: ஆனால் நான் உங்களுக்குச் சொல்கிறேன்
  rationale: δέ தரும் எதிர்மறைத் தொடர்பையும் ἐγώ தரும் ‘நான்’ என்ற வலியுறுத்தலையும் இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: πᾶς ὁ βλέπων
  choice: பார்க்கிற ஒவ்வொருவரும்
  rationale: πᾶς என்பதன் பொதுவான, அனைவரையும் உள்ளடக்கும் வலிமையைத் தக்கவைக்கிறது; மூலத்தில் இல்லாத பாலினக் குறிப்பைச் சேர்ப்பதில்லை.
- source_word: γυναῖκα
  choice: ஒரு பெண்ணை
  rationale: γυνή சூழலுக்கு ஏற்ப ‘பெண்’ அல்லது ‘மனைவி’ எனப் பொருள்படலாம். இங்குள்ள பொதுவான அறநெறிக் கூற்றில் பரந்த பொருளான ‘பெண்’ பொருத்தமானது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: πρὸς τὸ ἐπιθυμῆσαι αὐτήν
  choice: அவளை ஆசைப்படும் நோக்கத்துடன்
  rationale: πρὸς τό + infinitive காட்டும் நோக்கம் அல்லது உள்நோக்கத்தை வெளிப்படையாகத் தெரிவிக்கிறது. ‘ஆசைப்படுதல்’ ἐπιθυμέω என்பதன் சொற்பொருள் அகலத்தைத் தக்கவைக்கிறது; பாலியல் மற்றும் தவறான தன்மையை விபசாரச் சூழல் தெளிவாக்குகிறது.
- source_word: ἤδη ἐμοίχευσεν αὐτήν
  choice: ஏற்கெனவே அவளுடன் விபசாரம் செய்துவிட்டார்
  rationale: ἤδη என்பதற்கு ‘ஏற்கெனவே’ என்றும், μοιχεύω என்பதற்கு இயல்பான தமிழில் ‘விபசாரம் செய்தல்’ என்றும் வழங்குகிறது; நிறைவேறிய செயலை ‘செய்துவிட்டார்’ தெரிவிக்கிறது.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: தன் இதயத்தில்
  rationale: καρδία குறிக்கும் எண்ணம், விருப்பம் உள்ளிட்ட அகமனிதனை வேதாகம மரபுக்கும் இயல்பான தமிழுக்கும் ஏற்ற ‘இதயம்’ மூலம் தக்கவைக்கிறது; reflexive தொடர்பை ‘தன்’ தெளிவாக்குகிறது.
theological_decisions:
- issue: γυνή என்பதை ‘பெண்’ எனவா ‘மனைவி’ எனவா மொழிபெயர்ப்பது
  choice: பெண்
  alternative: மனைவி
  rationale: கிரேக்கச் சொல் திருமண நிலையை இங்கு வெளிப்படையாகக் குறிப்பிடவில்லை. ஆகவே பிரதான உரையில் பொருளைச் சுருக்காமல் ‘பெண்’ என வழங்கி, உண்மையான சொற்பொருள் இரட்டைத்தன்மையை அடிக்குறிப்பில் பாதுகாக்கிறது.
- issue: ἐπιθυμέω என்பதை ‘ஆசைப்படுதல்’ எனவா ‘இச்சையுடன் நோக்குதல்’ போன்ற வலுவான பாலியல் சொல்லால் வழங்குவதா
  choice: ஆசைப்படுதல்
  alternative: காம இச்சை கொள்ளுதல்
  rationale: வினைச்சொல் தனியாகப் பாலியல் இச்சைக்கு மட்டுமே கட்டுப்பட்டதல்ல; ஆனால் இச்சூழலில் தவறான பாலியல் ஆசையைக் குறிக்கிறது. ‘ஆசைப்படுதல்’ மூலத்தின் சொற்பொருள் அகலத்தைத் தக்கவைக்க, விபசாரச் சூழல் அதன் அறநெறித் தீவிரத்தை வெளிப்படுத்துகிறது.
- issue: πρὸς τὸ ἐπιθυμῆσαι காட்டும் நோக்கத்தைக் கருத்தில் தெளிவாக வெளிப்படுத்துவதா
  choice: ஆசைப்படும் நோக்கத்துடன்
  alternative: ஆசைப்படுவதற்காக
  rationale: இது தற்செயலாகப் பார்ப்பதையோ விருப்பம் எழுவதையோ மட்டும் கூறாமல், ஆசைப்படுவதை நோக்கமாகக் கொண்ட பார்வை என்ற கிரேக்கக் கட்டமைப்பின் உள்நோக்க நுணுக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘விபசாரம்’ மற்றும் ‘இதயம்’ ஆகியவை பரவலாக அறியப்பட்ட வேதாகம-அறநெறிச் சொற்களாக இருப்பதால் தக்கவைக்கப்பட்டன. நோக்கத்தைக் குறிக்கும் கிரேக்க அமைப்பு இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்தப்பட்டது.
