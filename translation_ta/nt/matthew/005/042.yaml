id: MAT.5.42
reference: Matthew 5:42
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τῷ αἰτοῦντί σε ⸀δός, καὶ τὸν θέλοντα ἀπὸ σοῦ δανίσασθαι μὴ ἀποστραφῇς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/042.yaml
  text: Give to the one who asks you[a], and do not turn away from the one who wants to borrow from you.
translation:
  language: ta
  text: உன்னிடம் கேட்பவருக்குக் கொடு; உன்னிடமிருந்து கடன் வாங்க விரும்புகிறவரைத் திருப்பி அனுப்பாதே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன்னிடமிருந்து கடன் வாங்க விரும்புகிறவரை மறுக்காதே.”
    reason: ἀποστραφῇς என்பதன் உருவகமான ‘திரும்பிவிடுதல்/திருப்பிவிடுதல்’ பொருளுக்கு மாற்றாக, சூழலில் அதன் நடைமுறைப் பொருளான ‘மறுத்தல்’ என்பதைக் காட்டும் சொல்லியல் மாற்று.
lexical_decisions:
- source_word: αἰτοῦντί
  choice: கேட்பவருக்கு
  rationale: இடைச்சொல்லுடன் வரும் நிகழ்காலப் பங்கேற்புவினை பொதுவாகக் கேட்கும் ஒருவரைக் குறிக்கிறது. ‘கேட்பவர்’ என்பது இயல்பான நவீனத் தமிழில் அதன் பொதுவான பொருளைப் பாதுகாக்கிறது.
- source_word: δός
  choice: கொடு
  rationale: δίδωμι என்பதன் இறந்தகால ஏவல்வினை வடிவம். நேரடியான கட்டளையின் வலிமையை கூடுதல் பொருள் சேர்க்காமல் ‘கொடு’ வெளிப்படுத்துகிறது.
- source_word: θέλοντα
  choice: விரும்புகிறவரை
  rationale: இடைச்சொல்லுடன் பெயர்போல் செயல்படும் நிகழ்காலப் பங்கேற்புவினை. θέλω என்பதன் விருப்பப் பொருளை ‘விரும்புகிறவர்’ இயல்பாகத் தருகிறது.
- source_word: ἀπὸ σοῦ
  choice: உன்னிடமிருந்து
  rationale: கடன் பெறப்படும் மூலத்தைச் சுட்டும் முன்னிடைச்சொல் தொடர்; தமிழில் ‘உன்னிடமிருந்து’ நேரான இணையாகும்.
- source_word: δανίσασθαι
  choice: கடன் வாங்க
  rationale: இச்சூழலில் கடன் பெறுதல் அல்லது இரவல் வாங்குதல் என்று பொருள்படும். பொருள் பணம் என்று கிரேக்கம் குறிப்பிடாததால் ‘பணம்’ சேர்க்கப்படவில்லை.
- source_word: μὴ ἀποστραφῇς
  choice: திருப்பி அனுப்பாதே
  rationale: μή உடன் வரும் இவ்வடிவம் தடைக் கட்டளையாகிறது. ἀποστρέφω-வின் திரும்பச் செய்தல்/விலக்குதல் என்ற உருவகத்தையும், கோரிக்கையாளரை மறுக்காதிருத்தல் என்ற சூழற்பொருளையும் தமிழில் இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: இயேசுவின் அறக்கட்டளையின் வரம்பும் வலிமையும்
  choice: கட்டளையை மென்மைப்படுத்தாமலும், கிரேக்கத்தில் இல்லாத தகுதிவரம்புகளைச் சேர்க்காமலும் நேரடியான ஏவலாக மொழிபெயர்த்தல்.
  alternative: ‘தகுதியான’ விண்ணப்பதாரர்களுக்கு மட்டும் பொருந்துவதாகக் குறுக்குதல் அல்லது வெறும் ‘மறுக்காதே’ என்று உருவகத்தை முழுமையாக நீக்குதல்.
  rationale: மலைப்பொழிவில் இவ்வசனம் இரு பொதுவான, நேரடியான கட்டளைகளை முன்வைக்கிறது. மொழிபெயர்ப்பு அவற்றின் அறவியல் வலிமையையும் பொதுத்தன்மையையும் காக்க வேண்டும்; பின்னாளைய விளக்க வரம்புகளை உரைக்குள் சேர்க்கக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில் ஒருமை நேர்முக உரையாடல் வடிவம் பயன்படுத்தப்பட்டுள்ளது. மொழிநடை நேரடியும் கண்ணியமானதும் சாதாரண வாசகர்களுக்குப் புரியத்தக்கதுமாக உள்ளது; கிரேக்கத்தின் பொதுவான கட்டளை வலிமை பாதுகாக்கப்பட்டுள்ளது.
