lexical_decisions:
- source_word: Μακάριοι
  choice: பேறுபெற்றவர்கள்
  rationale: இச்சொல் வெறும் மனமகிழ்ச்சியை அல்லாமல், கடவுளுடைய அருளால் நன்மைக்குரிய நிலையில் இருப்பதைக் குறிக்கிறது. ‘மகிழ்ச்சியானவர்கள்’ என்பது உணர்ச்சிக்கு மட்டுமே சுருக்கிவிடலாம்; ‘பாக்கியவான்கள்’ என்பதைவிட ‘பேறுபெற்றவர்கள்’ இன்றைய பொதுத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: οἱ πτωχοὶ
  choice: ஏழைகளாய் இருப்பவர்கள்
  rationale: πτωχός வறுமை மற்றும் ஆதரவற்ற நிலையை வலுவாகக் குறிக்கிறது. பெயர்ச்சொல்லாகப் பயன்படும் கிரேக்கப் பன்மையைத் தமிழில் இயல்பாக வெளிப்படுத்த இந்தச் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: τῷ πνεύματι
  choice: ஆவியில்
  rationale: இந்த இடவேற்றுமை வடிவம் எதைத் துல்லியமாகக் குறிக்கிறது என்பதை விளக்கிச் சுருக்காமல், கிரேக்கத்தின் செறிவையும் திறந்த பொருளையும் காக்கிறது. ‘ஆவிக்குரிய ஏழைகள்’ அல்லது ‘தங்கள் ஆன்மீகத் தேவையை உணர்கிறவர்கள்’ என்பவை சாத்தியமான விளக்கங்கள் என்றாலும், மூலத்தின் பன்முகத் தன்மையைச் சுருக்கலாம்.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: இங்கு ὅτι முன் கூறப்பட்ட பேற்றுநிலைக்கான காரணத்தை அறிமுகப்படுத்துகிறது; ‘ஏனெனில்’ அதைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: αὐτῶν ἐστιν
  choice: அவர்களுடையது
  rationale: உடைமைப் பொருளையும் நிகழ்கால ἐστιν என்பதையும் இயல்பான தமிழில் காக்கிறது; இதை எதிர்கால வாக்குறுதியாக மாற்றவில்லை.
- source_word: ἡ βασιλεία
  choice: ராஜ்யம்
  rationale: βασιλεία அரசாட்சி மற்றும் அரசாட்சிக்குட்பட்ட தளம் ஆகிய இரு பரிமாணங்களையும் கொண்டிருக்கலாம். தமிழில் பரவலாகப் புரிந்துகொள்ளப்படும் ‘ராஜ்யம்’ அவற்றை ‘ஆட்சி’ அல்லது ‘அரசு’ என்பதைவிட விரிவாகக் காக்கிறது.
- source_word: τῶν οὐρανῶν
  choice: பரலோக
  rationale: கிரேக்கத்தில் ‘வானங்கள்’ என்று பன்மையில் இருந்தாலும், இது மத்தேயுவுக்குரிய நிலையான சொற்றொடர். தமிழில் இயல்பாகவும் மரபாகவும் ‘பரலோக ராஜ்யம்’ என்று ஒருமைத் தொகுப்புப் பொருளில் வழங்கப்படுகிறது.
theological_decisions:
- issue: ‘ஆவியில் ஏழைகள்’ என்பதன் பொருள்
  choice: விளக்க விரிவாக்கமின்றி ‘ஆவியில் ஏழைகளாய் இருப்பவர்கள்’ என்று வைத்திருத்தல்
  alternative: ‘ஆவிக்குரிய ஏழைகள்’, ‘தாழ்மையானவர்கள்’, அல்லது ‘தங்கள் ஆன்மீகத் தேவையை உணர்கிறவர்கள்’
  rationale: கிரேக்கச் சொற்றொடர் இறையியல் செறிவும் ஓரளவு திறந்த பொருளும் கொண்டது. பிரதான உரையில் ஒரு விளக்கத்தை மட்டும் தேர்ந்தெடுப்பது, மூலம் திறந்துவைத்துள்ள பொருளைத் தேவையின்றி முடிவுசெய்துவிடும்.
- issue: ராஜ்யம் அவர்களுக்குரியது என்பதன் காலம்
  choice: நிகழ்காலத்தில் ‘அவர்களுடையது’ என்று மொழிபெயர்த்தல்
  alternative: ‘அவர்களுடையதாகும்’ அல்லது ‘அவர்களுக்குக் கிடைக்கும்’
  rationale: ἐστιν நிகழ்காலத்தில் உள்ளது. ஆகவே இது எதிர்காலப் பலன் மட்டுமல்லாமல் தற்போதைய உடைமையையும் வெளிப்படுத்துகிறது; அந்த இறையியல் அழுத்தம் மாற்றப்படவில்லை.
