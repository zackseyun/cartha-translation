reference: Matthew 5:38
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἠκούσατε ὅτι ἐρρέθη· Ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ καὶ ὀδόντα ἀντὶ ὀδόντος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/038.yaml
  text: You have heard that it was said[a], ‘An eye for an eye and a tooth for a tooth.’
translation:
  language: ta
  text: ‘கண்ணுக்குக் கண், பல்லுக்குப் பல்’ என்று சொல்லப்பட்டதை நீங்கள் கேள்விப்பட்டிருக்கிறீர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠκούσατε
  choice: நீங்கள் கேள்விப்பட்டிருக்கிறீர்கள்
  rationale: மத்தேயுவில் வரும் இவ்வழக்கமான அறிமுகச் சூத்திரத்தில் இறந்தகால வினை, கேட்போர் ஏற்கெனவே கேட்டு அறிந்த போதனையைச் சுட்டுகிறது; நவீனத் தமிழில் நிறைவுற்ற நிகழ்கால வடிவம் இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὅτι
  choice: என்று
  rationale: கேள்விப்பட்ட செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் இயல்பான தமிழ்ச் சொல்லிணைப்பு.
- source_word: ἐρρέθη
  choice: சொல்லப்பட்டது
  rationale: λέγω என்பதன் செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது; யார் சொன்னார் என்பதை வசனம் வெளிப்படையாகக் குறிப்பிடாத தன்மையையும் நிலைநிறுத்துகிறது.
- source_word: Ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ
  choice: கண்ணுக்குக் கண்
  rationale: ἀντί குறிக்கும் பதிலீடு அல்லது இணையான ஈட்டைத் தமிழில் அறியப்பட்ட, சுருக்கமான சட்டச் சூத்திரமாகத் துல்லியமாகத் தருகிறது.
- source_word: καὶ
  choice: —
  rationale: இணைநிலைச் சட்டச் சொற்றொடர்களை நவீனத் தமிழில் இயல்பாக இணைக்க காற்புள்ளி போதுமானதால் தனி ‘மற்றும்’ சேர்க்கப்படவில்லை; கிரேக்கத்தின் இணைப்பு பொருளில் பாதுகாக்கப்படுகிறது.
- source_word: ὀδόντα ἀντὶ ὀδόντος
  choice: பல்லுக்குப் பல்
  rationale: முதல் கூறுக்கு இணையான அமைப்பைப் பாதுகாத்து, பதிலீடு அல்லது சமமான ஈடு என்ற சட்டச் சூத்திரத்தின் பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: இயேசு மேற்கோள் காட்டும் தாலியோன் சட்டச் சூத்திரத்தை மொழிபெயர்த்தல்
  choice: கண்ணுக்குக் கண், பல்லுக்குப் பல்
  alternative: ஒரு கண்ணுக்குப் பதிலாக ஒரு கண், ஒரு பல்லுக்குப் பதிலாக ஒரு பல்
  rationale: அறியப்பட்ட சட்டக் கோட்பாட்டைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது. இது நேரடியான பழிவாங்கலா அல்லது அளவுக்குட்பட்ட ஈடா என்ற கேள்வியை மொழிபெயர்ப்பிலேயே தீர்மானிக்காமல், மூலத்தின் இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் வகையில் இயல்பானதாயும், வேதாகம மேற்கோளுக்குரிய கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்காமல் செயப்பாட்டு வடிவமும் சட்டச் சூத்திரத்தின் சுருக்கமும் பாதுகாக்கப்பட்டுள்ளன.
