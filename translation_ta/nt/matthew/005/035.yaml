  text: μήτε ἐν τῇ γῇ, ὅτι ὑποπόδιόν ἐστιν τῶν ποδῶν αὐτοῦ· μήτε εἰς Ἱεροσόλυμα, ὅτι πόλις ἐστὶν τοῦ μεγάλου βασιλέως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/035.yaml
  text: nor by the earth[a], because it is the footstool of his feet; nor by Jerusalem, because it is the city of the great King[d][c][b];
translation:
  language: ta
  text: பூமியின்மேல் ஆணையிட வேண்டாம்; ஏனெனில், அது அவருடைய கால்களுக்குக் கால்மணையாக இருக்கிறது.[a] எருசலேமின்மேல் ஆணையிட வேண்டாம்;[b] ஏனெனில், அது மகா அரசரின் நகரம்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ஏசாயா 66:1-ஐ ஒப்பிடுக: “பூமி என் கால்மணை.”'
    reason: cross_reference
  - marker: b
    text: கிரேக்கில் இங்கு εἰς Ἱεροσόλυμα என்ற சொற்றொடர் உள்ளது; சொற்படியாக அது ‘எருசலேமை நோக்கி’ அல்லது ‘எருசலேமுக்குள்’ எனப் பொருள்படலாம். ஆனால் இச்சூழலில் ஆணைமொழி வழக்கின்படி ‘எருசலேமின்மேல்’ என்று பொருள்படுகிறது.
    reason: lexical_alternative
  - marker: c
    text: சங்கீதம் 48:2-இல் எருசலேம் “மகா அரசரின் நகரம்” என்று அழைக்கப்படுவதை ஒப்பிடுக.
    reason: cross_reference
lexical_decisions:
- source_word: μήτε
  choice: … மேலும் ஆணையிட வேண்டாம்
  rationale: முந்தைய வசனத்திலிருந்து தொடரும் இணையான தடையைத் தமிழில் இயல்பாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: ἐν τῇ γῇ
  choice: பூமியின் மேலும்
  rationale: சத்தியம் அல்லது ஆணை இடும் சூழலில் ἐν என்பது எதையாவது சாட்சியாகக் கொண்டு ஆணையிடுவதைக் குறிக்கிறது. ‘பூமியின் மேல்’ என்பது அந்த ஆணைமொழியை இயல்பான தமிழில் தருகிறது.
- source_word: γῇ
  choice: பூமி
  rationale: வானம் மற்றும் எருசலேம் ஆகியவற்றுடன் வரும் இச்சூழலில் குறிப்பிட்ட ஒரு நிலப்பகுதியை அல்ல, பூமியையே குறிக்கிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: தடைக்கான காரணத்தைத் தெளிவாகக் காட்டும் இயல்பான நவீனத் தமிழ் இணைப்புச்சொல்.
- source_word: ὑποπόδιον τῶν ποδῶν αὐτοῦ
  choice: அவருடைய கால்களுக்குக் கால்மணை
  rationale: ‘கால்மணை’ என்பது ὑποπόδιον என்பதன் தெளிவான, பொதுமக்கள் புரிந்துகொள்ளக்கூடிய தமிழ் இணை. ‘அவருடைய கால்களுக்கு’ என்பது கிரேக்கத் தொடரின் பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: εἰς Ἱεροσόλυμα
  choice: எருசலேமின் மேலும்
  rationale: இங்கு εἰς ஆணைமொழியில் ‘எருசலேமைக் கொண்டு/எருசலேமின் மேல் ஆணையிடுதல்’ என்ற வழக்குப் பொருளில் வருகிறது. திசைப் பொருளை முதன்மை உரையில் வற்புறுத்துவது தமிழில் பொருளை மறைக்கும்; அதன் வடிவ வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: πόλις
  choice: நகரம்
  rationale: நேரடியும் இயல்பானதுமான தமிழ் இணை.
- source_word: τοῦ μεγάλου βασιλέως
  choice: மகா அரசரின்
  rationale: மூலத்தின் உயர்ந்த வேதமொழி நடையையும் உடைமைப் பொருளையும் காக்கிறது; சங்கீதம் 48:2-இன் எதிரொலியையும் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘அவருடைய கால்கள்’ என்பதில் ‘அவர்’ யாரைக் குறிக்கிறது?
  choice: ‘அவருடைய’ என்று மட்டும் மொழிபெயர்த்து, உடனடி உரையில் பெயரைச் சேர்க்காமல் விடப்பட்டது.
  alternative: ‘கடவுளுடைய கால்கள்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: αὐτοῦ என்பது பெயரை வெளிப்படையாகச் சொல்லவில்லை. சூழலும் ஏசாயா 66:1-இன் எதிரொலியும் கடவுளைக் குறித்தாலும், மூலத்தில் மறைமுகமாக உள்ள குறிப்பை மொழிபெயர்ப்பு வெளிப்படையாக்கவில்லை.
- issue: ‘மகா அரசர்’ என்பவரின் அடையாளம்
  choice: மூலத்தில் உள்ள பட்டத்தை அப்படியே வைத்து, அடையாளத்தை உரைக்குள் விளக்கவில்லை.
  alternative: ‘மகா அரசராகிய கடவுள்’ என்று விரிவாக்குதல்.
  rationale: τοῦ μεγάλου βασιλέως என்பது ‘மகா அரசரின்’ என்று மட்டுமே கூறுகிறது. சங்கீத எதிரொலி கடவுளைக் காட்டினாலும், அந்த விளக்கத்தை முதன்மை உரையில் சேர்ப்பது மூலத்தைவிட வெளிப்படையானதாகிவிடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் மதிப்பும் வேதமொழி உயர்வும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆணையிட வேண்டாம்’, ‘கால்மணை’, ‘மகா அரசர்’ ஆகியவை தெளிவையும் மூலத்தின் உருவகங்களையும் சமநிலைப்படுத்துகின்றன.
