  source_fidelity: மூலக் கிரேக்கத்தின் சட்டச் சூழலும் செயல்வரிசையும் துல்லியமாகக் காக்கப்பட்டுள்ளன. ἴσθι εὐνοῶν என்பதன் திறந்த, சாதகமான மனப்பாங்குக் கருத்து ‘நல்லெண்ணம் காட்டு’ எனப் பொருத்தமாகத் தரப்பட்டுள்ளது; ‘சமரசம் செய்துகொள்’ என்ற சூழல்சார் மாற்று அடிக்குறிப்பில் மட்டுமே உள்ளது. ἀντίδικος, κριτής, ὑπηρέτης, φυλακή ஆகியவற்றின் நீதித்துறை வரிசையும், βληθήσῃ என்பதன் வலிமையும் ‘சிறையில் தள்ளப்பட’ என்பதில் பாதுகாக்கப்படுகின்றன. μήποτε-யின் எச்சரிக்கைத் தொனியை ‘இல்லையெனில் ... நேரிடலாம்’ இயல்பாக வெளிப்படுத்துகிறது.
  naturalness: நவீனத் தரத்தமிழில் நடை தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘நீ அவருடன் வழியில் இருக்கும்போதே அப்படிச் செய்’ என்பது மூலத்தின் ஒரே வாக்கிய அமைப்பை இரண்டு வாக்கியங்களாகப் பிரித்தாலும், பொருளையோ வலியுறுத்தலையோ மாற்றாமல் வாசிப்புக்கு உதவுகிறது. ‘நீதிமன்ற அலுவலர்’ சட்டச் சூழலில் பொதுவாசகருக்குப் புரியக்கூடிய இயல்பான தெரிவாகும்.
  terminology: ‘உனக்கு எதிராக வழக்காடுபவர்’ என்பது ἀντίδικος என்பதன் சட்டநிலையிலுள்ள எதிர்த்தரப்பு உணர்வைத் தக்கவைக்கிறது; அதை வெறும் ‘குற்றஞ்சாட்டுபவர்’ எனக் குறுக்கவில்லை. ‘நீதிபதி’, ‘ஒப்படைக்க’, ‘நீதிமன்ற அலுவலர்’, ‘சிறை’ ஆகியவை தொடர்ச்சியாகவும் பதிவுக்கேற்றவாறும் உள்ளன. அடிக்குறிப்பு பிரதான உரையில் திணிக்கப்படாத சட்டச் சமரசப் பொருளைச் சரியாகக் குறிக்கிறது; அதன் குறியீட்டு இணைப்பும் செல்லுபடியாகும்.
