id: MAT.5.25
reference: Matthew 5:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἴσθι εὐνοῶν τῷ ἀντιδίκῳ σου ταχὺ ἕως ὅτου εἶ ⸂μετ’ αὐτοῦ ἐν τῇ ὁδῷ⸃, μήποτέ σε παραδῷ ὁ ἀντίδικος τῷ κριτῇ, καὶ ὁ ⸀κριτὴς τῷ ὑπηρέτῃ, καὶ εἰς φυλακὴν βληθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/025.yaml
  text: Be well-disposed toward your accuser quickly[a], while you are with him on the way, lest your accuser hand you over to the judge, and the judge to the officer, and you be thrown into prison.
translation:
  language: ta
  text: உனக்கு எதிராக வழக்காடுபவரிடம் விரைவாக நல்லெண்ணம் காட்டு[a]; நீ அவருடன் வழியில் இருக்கும்போதே அப்படிச் செய். இல்லையெனில், அவர் உன்னை நீதிபதியிடம் ஒப்படைக்கவும், நீதிபதி உன்னை நீதிமன்ற அலுவலரிடம் ஒப்படைக்கவும், நீ சிறையில் தள்ளப்படவும் நேரிடலாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இந்தச் சட்டச் சூழலில் இயல்பான முறையில்: “உனக்கு எதிராக வழக்காடுபவருடன் விரைவாகச் சமரசம் செய்துகொள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴσθι εὐνοῶν
  choice: நல்லெண்ணம் காட்டு
  rationale: εὐνοέω என்பதன் அடிப்படைப் பொருளான சாதகமான மனப்பாங்கை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது. சட்டரீதியாகச் சமரசம் செய்துகொள்வது சூழலில் உட்பொருளாக இருந்தாலும், அதை முதன்மை உரையில் வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: ἀντιδίκῳ / ἀντίδικος
  choice: உனக்கு எதிராக வழக்காடுபவர்
  rationale: இந்தச் சொல் நீதிபதி, நீதிமன்ற அலுவலர், சிறை ஆகிய சட்டச் சூழலில் ஒரு வழக்கின் எதிர்த்தரப்பைக் குறிக்கிறது. ‘குற்றஞ்சாட்டுபவர்’ என்பதைக் காட்டிலும் இத்தேர்வு பரந்த சட்டப் பொருளைப் பாதுகாக்கிறது.
- source_word: ταχὺ
  choice: விரைவாக
  rationale: கட்டளையின் அவசரத்தன்மையை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἕως ὅτου εἶ μετ’ αὐτοῦ ἐν τῇ ὁδῷ
  choice: நீ அவருடன் வழியில் இருக்கும்போதே
  rationale: நீதிமன்றத்திற்குச் செல்லும் வழி என்பது சூழலால் உணரப்பட்டாலும், கிரேக்க உரையின் நேரடியான ‘வழியில்’ என்ற உருவகத்தை விளக்கவுரையாக்காமல் காக்கிறது.
- source_word: μήποτέ
  choice: இல்லையெனில் ... நேரிடலாம்
  rationale: μήποτε தரும் எச்சரிக்கை மற்றும் சாத்திய விளைவை இயல்பான தமிழில் தெரிவிக்கிறது; விளைவை மாற்றமற்ற உறுதியாகக் கூறுவதைத் தவிர்க்கிறது.
- source_word: παραδῷ
  choice: ஒப்படைக்க
  rationale: ஒருவரை அடுத்த நீதித்துறை அதிகாரத்தின் கட்டுப்பாட்டுக்குக் கொடுப்பதைத் தெளிவாகக் குறிக்கிறது.
- source_word: κριτῇ / κριτὴς
  choice: நீதிபதி
  rationale: சட்டச் சூழலில் κριτής என்பதற்கான தெளிவான வழக்கமான தமிழ்ச் சொல்.
- source_word: ὑπηρέτῃ
  choice: நீதிமன்ற அலுவலர்
  rationale: நீதிபதியின் ஆணையை நிறைவேற்றும் கீழ்நிலை அலுவலரைச் சூழலுக்கேற்றவாறு குறிக்கிறது; குறிப்பிட்ட நவீன பதவிப்பெயரைத் திணிப்பதில்லை.
- source_word: εἰς φυλακὴν βληθήσῃ
  choice: சிறையில் தள்ளப்படவும்
  rationale: φυλακή என்பதன் சிறைச்சாலைப் பொருளையும் βάλλω என்பதன் வலுவான, உயிரோட்டமுள்ள செயற்பொருளையும் காக்கிறது.
theological_decisions:
- issue: தொடக்கக் கட்டளையை மனப்பாங்காக மொழிபெயர்ப்பதா, சட்டச் சமரசமாக மொழிபெயர்ப்பதா
  choice: முதன்மை உரையில் ‘நல்லெண்ணம் காட்டு’ என்று εὐνοέω என்பதன் சொற்பொருளைத் தக்கவைத்தல்
  alternative: ‘விரைவாகச் சமரசம் செய்துகொள்’
  rationale: சட்டச் சூழல் சமரசத்தைக் குறிப்பதாக இருக்கலாம். எனினும், கிரேக்கச் சொல் நேரடியாகச் சாதகமான மனப்பாங்கைக் கூறுவதால், அந்தத் திறந்த பொருளை முதன்மை உரையில் காத்து, சட்டச் சூழலுக்கேற்ற மரபுத்தொடர் பொருளை அடிக்குறிப்பில் வழங்குவது பொருத்தமானது.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் சட்டச் சொற்களுடன் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘வழியில்’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது; எதிர்த்தரப்பைக் குறிக்க மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது.
