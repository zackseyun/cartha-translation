id: MAT.5.19
reference: Matthew 5:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὃς ἐὰν οὖν λύσῃ μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων καὶ διδάξῃ οὕτως τοὺς ἀνθρώπους, ἐλάχιστος κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν· ὃς δ’ ἂν ποιήσῃ καὶ διδάξῃ, οὗτος μέγας κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/019.yaml
  text: Therefore[a], whoever relaxes one of the least of these commandments and teaches others to do so will be called least in the kingdom of heaven; but whoever does them and teaches them[b], this one will be called great in the kingdom of heaven.
translation:
  language: ta
  text: ஆகவே, இந்த மிகச் சிறிய கட்டளைகளில் ஒன்றைத் தளர்த்தி[a], மற்றவர்களும் அவ்வாறே செய்யும்படி கற்பிக்கிறவர் பரலோக அரசில் மிகச் சிறியவர் என அழைக்கப்படுவார். ஆனால் அவற்றைக் கடைப்பிடித்து, அவற்றைக் கற்பிக்கிறவரே பரலோக அரசில் பெரியவர் என அழைக்கப்படுவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒதுக்கிவைத்து” அல்லது “மீறி.” கிரேக்க வினைச்சொல்லின் நேரடிப் பொருள் “அவிழ்த்து” என்பதாகும்; இங்கு ஒரு கட்டளையின் வலிமையைத் தளர்த்துவது அல்லது அது கட்டுப்படுத்தாததுபோல் நடத்துவது என்று பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வசனத்தில் கூறப்பட்டதிலிருந்து வரும் முடிவை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: λύσῃ
  choice: தளர்த்தி
  rationale: கட்டளையின் கட்டுப்படுத்தும் வலிமையைத் தளர்த்துதல் அல்லது அதைக் கட்டாயமற்றதாக நடத்துதல் என்ற சூழல்சார் பொருளைத் தக்கவைக்கிறது; ‘மீறுதல்’ என்று மட்டும் பொருளைக் குறுக்கவில்லை.
- source_word: μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων
  choice: இந்தக் கட்டளைகளில் மிகச் சிறியவற்றுள் ஒன்றை
  rationale: ἐλαχίστων குறிக்கும் கட்டளைகளுக்கிடையிலான ஒப்பீட்டு தரத்தைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: διδάξῃ οὕτως τοὺς ἀνθρώπους
  choice: மற்றவர்களும் அவ்வாறே செய்யும்படி கற்பிக்கிறவர்
  rationale: οὕτως முந்தைய செயலையே சுட்டுவதை ‘அவ்வாறே செய்யும்படி’ வெளிப்படுத்துகிறது; ἀνθρώπους இங்கு மனிதர்களைப் பொதுவாகக் குறிப்பதால் ‘மற்றவர்கள்’ இயல்பான தமிழாகும்.
- source_word: ἐλάχιστος κληθήσεται
  choice: மிகச் சிறியவர் என அழைக்கப்படுவார்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தையும், கட்டுரையில்லாத ஒப்பீட்டு நிலைமையையும் நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: பரலோக அரசில்
  rationale: மத்தேயுவின் வழக்கமான சொற்றொடரை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ‘அரசு’ என்பது ஆட்சி மற்றும் ஆட்சிக்குட்பட்ட தளம் ஆகிய இரு நுணுக்கங்களையும் தாங்குகிறது.
- source_word: ποιήσῃ καὶ διδάξῃ
  choice: அவற்றைக் கடைப்பிடித்துக் கற்பிக்கிறவர்
  rationale: கட்டளைகளைப் பொருளாகக் கொண்ட ποιέω என்பதன் ‘செயல்படுத்துதல்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: οὗτος
  choice: கற்பிக்கிறவர்
  rationale: தமிழில் எழுவாயை மீண்டும் குறிப்பிடுவது இரு நபர்களுக்கிடையிலான வலியுறுத்தப்பட்ட எதிர்மறை ஒப்புமையை இயல்பாகத் தக்கவைக்கிறது; தனியே ‘இவரே’ சேர்ப்பது தேவையற்ற கடினத்தன்மையை உண்டாக்கும்.
- source_word: μέγας
  choice: பெரியவர்
  rationale: ἐλάχιστος என்பதற்கு எதிரான μέγας என்பதன் நேரடியான ஒப்பீட்டுப் பொருளைத் தருகிறது.
theological_decisions:
- issue: பரலோக அரசில் ‘மிகச் சிறியவர்/பெரியவர்’ என்ற நிலை
  choice: இருவரும் பரலோக அரசில் எவ்வாறு அழைக்கப்படுவர் என்ற ஒப்பீட்டு நிலையாகவே மொழிபெயர்க்கப்பட்டது.
  alternative: ‘மிகச் சிறியவர்’ அரசுக்கு வெளியே இருப்பவர் என்று கூறுதல்; ‘பெரியவர்’ என்பது தொழில்நுட்பமான வெகுமதி நிலை என்று விளக்குதல்.
  rationale: மூலவசனம் அரசிலிருந்து விலக்கப்படுதல் அல்லது இரட்சிப்பின் தகுதி பற்றி வெளிப்படையாகக் கூறவில்லை; அந்த இறையியல் இழுபறியை மொழிபெயர்ப்பு தீர்த்துவிடக்கூடாது.
- issue: τοὺς ἀνθρώπους என்பதன் பொதுப்பொருள்
  choice: மற்றவர்கள்
  alternative: ஆண்கள்; மனிதர்கள்
  rationale: இங்கு கிரேக்கப் பன்மை பாலின வேறுபாடின்றி மக்களைப் பொதுவாகக் குறிக்கிறது. ‘மற்றவர்கள்’ தமிழில் இயல்பாக இருந்து, பிறருக்குக் கற்பிப்பது என்ற தொடர்பையும் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘பரலோக அரசு’ மத்தேயுவின் βασιλεία சொற்றொடரில் உள்ள ஆட்சிக் கருத்தைத் தக்கவைக்கிறது. மூலத்தில் உள்ள ஒருமை சார்ந்த பொதுப்படுத்தலைத் தமிழின் பாலினக் கட்டாயமில்லாத ‘கிறவர்’ வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
