  rationale: சிறு திருத்தங்கள் மட்டுமே செய்யப்பட்டுள்ளன. ‘அவரே’ οὗτος-இன் வலியுறுத்தப்பட்ட எதிரொப்புமையைத் தக்கவைக்கிறது. ‘அவற்றைக் கடைப்பிடித்து, அவற்றைக் கற்பிக்கிறவர்’ என்பது ποιήσῃ καὶ διδάξῃ என்ற இரு வினைகளுக்கும் கட்டளைகளே பொருளாக இருப்பதைத் தெளிவுபடுத்துகிறது. அடிக்குறிப்பின் உரை இலக்கண ரீதியாக முழுமையாக்கப்பட்டது; அதன் பொருள் மாற்றப்படவில்லை.
