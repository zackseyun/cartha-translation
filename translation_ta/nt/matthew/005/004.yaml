  text: μακάριοι οἱ πενθοῦντες, ὅτι αὐτοὶ παρακληθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/004.yaml
  text: Blessed are those who mourn[a], because they will be comforted.
translation:
  language: ta
  text: துயரப்படுகிறவர்கள் பேறுபெற்றவர்கள்[a]; ஏனெனில், அவர்களுக்கு ஆறுதல் அளிக்கப்படும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வருந்துகிறவர்கள்.’ கிரேக்கச் சொல் பரந்த பொருளுடையது; துயரத்துக்கான காரணத்தை அது குறிப்பிடவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: பேறுபெற்றவர்கள்
  rationale: இது வெறும் மனநிலையான ‘மகிழ்ச்சி’யைக் குறிக்காமல், கடவுளின் மதிப்பீட்டில் அவர்களுக்குரிய நல்வாழ்வையும் அருள்நிலையையும் தெரிவிக்கும் வாழ்த்துப்பேற்றுச் சூத்திரத்தின் வலிமையைத் தக்கவைக்கிறது.
- source_word: οἱ πενθοῦντες
  choice: துயரப்படுகிறவர்கள்
  rationale: பெந்தேஒ என்ற வினையின் நிகழ்காலப் பங்கேற்பு வடிவத்தை இயல்பான பன்மை பெயராக்கமாகத் தருகிறது. இழப்பு, துன்பம், பாவம் அல்லது வேறு காரணங்களால் ஏற்படும் துயரத்தை உள்ளடக்கக்கூடிய அதன் பரந்த பொருளைச் சுருக்கவில்லை.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முன்னுள்ள பேறுபெற்ற நிலைக்கான காரணத்தையோ அடிப்படையையோ இயல்பான நவீன தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: αὐτοὶ
  choice: அவர்களுக்கு
  rationale: கிரேக்கப் பிரதிப்பெயரின் சிறு வலியுறுத்தல் தமிழில் தனியாக ‘அவர்களே’ என்று மொழிபெயர்க்கப்பட்டால் தேவைக்கு மீறிய அழுத்தம் தோன்றலாம். இங்கு பயனாளியைக் குறிக்கும் ‘அவர்களுக்கு’ என்பதில் அதன் குறிப்பு இயல்பாகத் தங்குகிறது.
- source_word: παρακληθήσονται
  choice: ஆறுதல் அளிக்கப்படும்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தைப் பாதுகாத்து, அவர்கள் ஆறுதலைப் பெறுவார்கள் என்ற இயல்பான பொருளைத் தெளிவாகக் கூறுகிறது; ஆறுதல் அளிப்பவர் மூலத்தில் குறிப்பிடப்படாததையும் அப்படியே விடுகிறது.
theological_decisions:
- issue: இந்தப் பேறுபேற்றில் துயரத்தின் வரம்பு
  choice: துயரத்தின் காரணத்தைச் சுட்டாமல் ‘துயரப்படுகிறவர்கள்’ என்று பரந்த பொருளில் மொழிபெயர்த்தல்
  alternative: பாவத்துக்காகத் துயரப்படுகிறவர்கள்; பொதுவாக வருந்துகிறவர்கள்; இஸ்ரவேலின் நிலைக்காகப் புலம்புகிறவர்கள்
  rationale: கிரேக்க மூலவாக்கியம் துயரத்துக்கான காரணத்தையோ பொருளையோ வெளிப்படையாகக் குறிப்பிடவில்லை. ஆகவே தனிப்பட்ட இழப்பு, பாவம், ஒடுக்குமுறை அல்லது இறுதிக்கால ஏக்கம் என்ற ஏதேனும் ஓர் விளக்கத்துக்குள் வசனத்தைச் சுருக்காமல் அதன் இறையியல் மற்றும் மேய்ப்புப்பணி சார்ந்த திறந்த தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘பேறுபெற்றவர்கள்’ என்பது மலைப்பொழிவின் வாழ்த்துப்பேற்றுச் சூத்திரத்தைத் தக்கவைக்கிறது; ‘ஆறுதல் அளிக்கப்படும்’ என்பது மூலத்தின் செயப்பாட்டு வடிவத்தையும் செய்பவர் குறிப்பிடப்படாத நிலையையும் பாதுகாக்கிறது.
