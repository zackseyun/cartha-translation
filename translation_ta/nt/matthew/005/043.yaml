  text: Ἠκούσατε ὅτι ἐρρέθη· Ἀγαπήσεις τὸν πλησίον σου καὶ μισήσεις τὸν ἐχθρόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/043.yaml
  text: You have heard that it was said[a], ‘You shall love your neighbor and hate your enemy.’
translation:
  language: ta
  text: “‘உன் அயலவரை அன்பு செய்வாயாக; உன் பகைவரை வெறுப்பாயாக’ என்று சொல்லப்பட்டதை நீங்கள் கேள்விப்பட்டிருக்கிறீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: முதல் பகுதி லேவியராகமம் 19:18-ஐ எதிரொலிக்கிறது. இரண்டாம் பகுதியான “உன் பகைவரை வெறுப்பாயாக” என்பது பழைய ஏற்பாட்டிலிருந்து நேரடியாக மேற்கோள் காட்டப்பட்டதல்ல; இயேசு திருத்தும் வழிவழியாகப் பெற்ற போதனையை அது பிரதிபலிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: Ἠκούσατε
  choice: நீங்கள் கேள்விப்பட்டிருக்கிறீர்கள்
  rationale: இறந்தகால வினை வடிவம் இங்கு முன்பு பெற்ற போதனையைச் சுட்டும் வழக்குச் சூத்திரமாக உள்ளது; நவீன தமிழில் இயல்பாகவும் தொடர்ந்த பொருத்தத்துடனும் இதை இவ்வாறு தரலாம்.
- source_word: ἐρρέθη
  choice: சொல்லப்பட்டதை
  rationale: சொன்னவர் யார் என்பதைத் தேவையின்றி குறிப்பிடாமல், கிரேக்கத்தின் செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது.
- source_word: Ἀγαπήσεις
  choice: அன்புகூர்வாயாக
  rationale: எதிர்கால வினை இங்கு கட்டளையின் வலிமையுடன் வருகிறது; மேற்கோள் கட்டளை நடைக்கு ஏற்ற dignified Tamil வடிவம்.
- source_word: τὸν πλησίον σου
  choice: உனக்கு அடுத்திருப்பவர்
  rationale: πλησίον என்பதன் அடிப்படை ‘அருகில்/அடுத்திருப்பவர்’ என்ற உறவுப் பொருளைப் பாதுகாக்கிறது; ‘அயலான்’ என்பதைக் காட்டிலும் பாலினப் பொதுமையும் நவீனத் தெளிவும் கொண்டது.
- source_word: μισήσεις
  choice: வெறுப்பாயாக
  rationale: மேற்கோளுக்குள் உள்ள இணையான கட்டளை வலிமையை வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: τὸν ἐχθρόν σου
  choice: உன் பகைவரை
  rationale: ἐχθρός என்பதற்கான நேரடியான, இயல்பான தமிழ் இணை; தனிப்பட்ட எதிரியைச் சுட்டும் பொருளைத் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘உன் பகைவரை வெறுப்பாயாக’ என்ற பகுதியின் நிலை
  choice: இயேசுவின் கேட்போர் கேட்டிருந்ததாகக் கூறப்படும் ஒரே சொல்லின் பகுதியாக முதன்மை உரையில் வழங்கப்பட்டது; முழுவதையும் நேரடி வேதமேற்கோள் எனக் குறிக்கவில்லை.
  alternative: இரு பகுதிகளையும் பழைய ஏற்பாட்டின் நேரடி மேற்கோளாகக் காட்டுதல், அல்லது இரண்டாம் பகுதியை முதன்மை உரையிலேயே பாரம்பரிய விளக்கம் என்று பிரித்துக் காட்டுதல்.
  rationale: கிரேக்க உரை முழுச் சொல்லையும் ἐρρέθη என்பதன் கீழ் வைக்கிறது. ஆனால் இரண்டாம் பகுதி பழைய ஏற்பாட்டின் நேரடிக் கட்டளை அல்ல; இதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது, முதன்மை உரை அதன் இலக்கண ஒருமைப்பாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; இயல்பான, கண்ணியமான வேதாகமப் போதனை நடை. ஒருமை ‘உன்’ மேற்கோளின் தனிநபர் கட்டளையைப் பாதுகாக்கிறது; தொடக்கத்தில் பன்மை ‘நீங்கள்’ கேட்போர் கூட்டத்தைச் சுட்டுகிறது. அடிக்குறி [a] முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
