revisions:
- from: “‘உனக்கு அடுத்திருப்பவரிடம் அன்புகூர்வாயாக; உன் பகைவரை வெறுப்பாயாக’ என்று சொல்லப்பட்டதை நீங்கள் கேள்விப்பட்டிருக்கிறீர்கள்.[a]
  to: “‘உன் அயலவரை அன்பு செய்வாயாக; உன் பகைவரை வெறுப்பாயாக’ என்று சொல்லப்பட்டதை நீங்கள் கேள்விப்பட்டிருக்கிறீர்கள்.[a]
  rationale: A direct-object construction and the conventional inclusive Tamil term «அயலவர்» better reproduce the Greek wording and the Leviticus allusion. The sentence order, passive «சொல்லப்பட்டதை», plural «நீங்கள்», and quoted parallel commands remain intact. The footnote is retained with only a minor stylistic adjustment and preserves the source's distinction between Scripture and received teaching.
  reviewer_model: gpt-5.6-terra
