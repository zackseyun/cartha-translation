  text: μακάριοι οἱ εἰρηνοποιοί, ὅτι αὐτοὶ υἱοὶ θεοῦ κληθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/009.yaml
  text: Blessed are the peacemakers[a], because they will be called sons of God.
translation:
  language: ta
  text: சமாதானத்தை ஏற்படுத்துகிறவர்கள் பேறுபெற்றவர்கள்; ஏனெனில் அவர்களே கடவுளின் மகன்கள்[a] என்று அழைக்கப்படுவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடவுளின் பிள்ளைகள்.’ கிரேக்க மூலத்தில் ‘கடவுளின் மகன்கள்’ என்று உள்ளது; இங்கு மகன்களைக் குறிக்கும் ஆண்பால் பன்மை வடிவம் அனைவரையும் பிரதிநிதித்துவப்படுத்தும் வகையில் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: பேறுபெற்றவர்கள்
  rationale: வெறும் மனநிலையான ‘மகிழ்ச்சி’யைக் காட்டாமல், கடவுளின் அருளையும் மதிப்புக்குரிய நற்பேற்றையும் உணர்த்துகிறது; அதேவேளையில் நவீனத் தமிழில் இயல்பாக உள்ளது.
- source_word: εἰρηνοποιοί
  choice: சமாதானத்தை ஏற்படுத்துகிறவர்கள்
  rationale: சமாதானத்தை விரும்புகிறவர்கள் என்று மட்டும் அல்லாமல், அதைச் செயலில் உருவாக்குகிறவர்கள் என்ற கூட்டு பெயர்ச்சொல்லின் செயற்பாட்டு வலிமையைப் பாதுகாக்கிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முன்னுள்ள பேறுக்கான காரணத்தை அறிமுகப்படுத்தும் கிரேக்க இணைப்புச் சொல்லின் காரணப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: αὐτοὶ
  choice: அவர்களே
  rationale: கிரேக்கத்தில் வெளிப்படையாக உள்ள வலியுறுத்தலைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: υἱοὶ θεοῦ
  choice: கடவுளின் மகன்கள்
  rationale: கிரேக்கத்தின் ஆண்பால் பன்மை உறவுமொழியை நேரடியாகக் காக்கிறது; அது பிரதிநிதித்துவமான, உள்ளடக்கும் பொருளில் பயன்படுத்தப்பட்டிருப்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: κληθήσονται
  choice: என்று அழைக்கப்படுவார்கள்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தை நேரடியாகப் பாதுகாக்கிறது; இதை வெறும் மனிதர்களின் அங்கீகாரம் என்று குறுக்காமல் விடுகிறது.
theological_decisions:
- issue: υἱοὶ θεοῦ என்பதில் பாலினம் குறிக்கப்பட்ட பிள்ளைமை மொழி
  choice: கடவுளின் மகன்கள்
  alternative: கடவுளின் பிள்ளைகள்
  rationale: மூலத்தில் உள்ள ‘மகன்கள்’ என்ற ஆண்பால் பன்மையை முதன்மை உரையில் காக்கிறது; அதே சமயம் அதன் பிரதிநிதித்துவமான உள்ளடக்கும் பொருளை அடிக்குறிப்பில் தெரிவிக்கிறது. இதனால் பிள்ளைமை நிலை சார்ந்த இறையியல் நுணுக்கம் சமப்படுத்தப்படாமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘சமாதானத்தை ஏற்படுத்துகிறவர்கள்’ என்பது செயலில் சமாதானம் உருவாக்குவதைத் தெளிவாக்குகிறது; ‘பேறுபெற்றவர்கள்’ என்பது வெறும் ‘மகிழ்ச்சியானவர்கள்’ என்ற உளநிலைப் பொருளைத் தவிர்க்கிறது.
