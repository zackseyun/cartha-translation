source:
  edition: SBLGNT
  text: μήτε ἐν τῇ κεφαλῇ σου ὀμόσῃς, ὅτι οὐ δύνασαι μίαν τρίχα λευκὴν ⸂ποιῆσαι ἢ μέλαιναν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/036.yaml
  text: Nor shall you swear by your head[a], because you are not able to make one hair white or black.
translation:
  language: ta
  text: உன் தலையின்மேல் சத்தியம் செய்யாதே; ஏனெனில், ஒரே ஒரு முடியைக்கூட வெள்ளையாகவோ கறுப்பாகவோ ஆக்க உன்னால் முடியாது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μήτε
  choice: …மீதும் … இடாதே
  rationale: முந்தைய தடைகளுடன் இணையும் எதிர்மறைத் தொடரைத் தமிழில் இயல்பாகக் காட்ட, ‘-உம்’ இணைப்பும் எதிர்மறைக் கட்டளையும் பயன்படுத்தப்பட்டுள்ளன.
- source_word: ἐν τῇ κεφαλῇ σου
  choice: உன் தலையின்மீது
  rationale: ὀμόσῃς உடன் வரும் ἐν, ஆணையில் சாட்சியாக அல்லது உறுதிப்படுத்தும் பொருளாகத் தலையை முன்வைப்பதைக் குறிக்கிறது; தமிழில் ‘தலையின்மீது ஆணையிடுதல்’ தெளிவான வழக்கு.
- source_word: ὀμόσῃς
  choice: ஆணையிடாதே
  rationale: μήτε உடன் உள்ள இறந்தகாலத் துணைவினை வடிவம் தடையை வெளிப்படுத்துகிறது. ‘ஆணையிடு’ என்பது சத்தியம் செய்வதை இயல்பாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: தடைக்கான காரணத்தை அறிமுகப்படுத்தும் காரண இணைப்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: οὐ δύνασαι
  choice: உன்னால் முடியாது
  rationale: மனிதனின் இயலாமையைத் தெளிவாகவும் இயல்பான நவீனத் தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: μίαν τρίχα
  choice: ஒரு முடியைக்கூட
  rationale: μίαν என்பதன் ‘ஒன்றே ஒன்று’ என்ற வலியுறுத்தலைத் தமிழில் ‘-க்கூட’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: λευκὴν … ἢ μέλαιναν
  choice: வெள்ளையாகவோ கறுப்பாகவோ
  rationale: இரு அடிப்படை நிறச் சொற்களையும் அவற்றின் தெளிவான முரண்பாட்டையும் விளக்கச் சேர்க்காமல் பாதுகாக்கிறது.
- source_word: ποιῆσαι
  choice: ஆக்க
  rationale: ஒரு முடியை ஒரு குறிப்பிட்ட நிறமுடையதாகச் செய்யும் அல்லது மாற்றும் பொருளைச் சுருக்கமாகத் தருகிறது.
theological_decisions:
- issue: ஆணையிடுதலுக்கான தடையின் வரம்பு
  choice: ஒருவர் தன் தலையின்மீது ஆணையிடுவதை நேரடியாகத் தடைசெய்யும் கூற்றாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: இதை எல்லாச் சூழல்களிலும் எல்லா வகையான ஆணைகளையும் தடைசெய்யும் முழுமையான கோட்பாட்டுக் கூற்றாக விரிவுபடுத்துதல்; அல்லது ஏமாற்றும் ஆணைச் சூத்திரங்களை மட்டும் கண்டிப்பதாகக் குறுக்குதல்.
  rationale: இந்த வசனம் குறிப்பாகத் தலையின்மீது ஆணையிடுவதைச் சொல்லி, ஒரு முடியைக்கூட மாற்ற மனிதனால் முடியாது என்பதைக் காரணமாக அளிக்கிறது. பரந்த கோட்பாட்டு விவாதத்தை மொழிபெயர்ப்பு தீர்மானிக்காமல், வசனத்தின் வரம்பையும் இறையியல் இழுபறியையும் அப்படியே காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை முன்னிலையைப் பேணி, எளிதில் புரியும் ஆனால் கண்ணியமான கட்டளை நடையில் வடிவமைக்கப்பட்டுள்ளது. ‘ஒரு முடியைக்கூட’ என்பது கிரேக்கத்தில் உள்ள குறைந்தபட்ச அளவின் வலியுறுத்தலை இயல்பாக எடுத்துரைக்கிறது.
