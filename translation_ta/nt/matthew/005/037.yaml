id: MAT.5.37
reference: Matthew 5:37
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἔστω δὲ ὁ λόγος ὑμῶν ναὶ ναί, οὒ οὔ· τὸ δὲ περισσὸν τούτων ἐκ τοῦ πονηροῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/037.yaml
  text: But let your word be[a], ‘Yes, yes,’ or ‘No, no.’ Anything beyond these is from the evil one.
translation:
  language: ta
  text: ஆனால், உங்கள் சொல் ‘ஆம், ஆம்’ என்றோ, ‘இல்லை, இல்லை’ என்றோ இருக்கட்டும். இவற்றுக்கு மிஞ்சிய எதுவும் தீயவனிடமிருந்து[a] வருகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீமையிலிருந்து.” கிரேக்க மொழியிலுள்ள τοῦ πονηροῦ என்ற தொடர், தனிநபரைக் குறிக்கும் வகையில் “தீயவனிடமிருந்து” என்றும், பொதுப்பொருளில் “தீமையிலிருந்து” என்றும் புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστω
  choice: இருக்கட்டும்
  rationale: εἰμί என்பதன் மூன்றாம் நபர் நிகழ்காலக் கட்டளை வடிவத்தைத் தமிழில் இயல்பான அறிவுறுத்தலாகத் தருகிறது.
- source_word: ὁ λόγος ὑμῶν
  choice: உங்கள் சொல்
  rationale: அன்றாடப் பேச்சில் ஒருவர் கூறுவதைச் சுட்டுவதோடு, மூலத்தின் சுருக்கமான பழமொழித் தன்மையையும் காக்கிறது.
- source_word: ναὶ ναί, οὒ οὔ
  choice: ‘ஆம், ஆம்’ என்றோ, ‘இல்லை, இல்லை’ என்றோ
  rationale: கிரேக்க மூலத்திலுள்ள இரட்டிப்பையும் அதன் அழுத்தமான ஓசையையும் தக்கவைத்து, இரு மாற்றுகளையும் இயல்பான தமிழில் வேறுபடுத்துகிறது.
- source_word: τὸ δὲ περισσὸν τούτων
  choice: இவற்றுக்கு மிஞ்சிய எதுவும்
  rationale: முன்னர் கூறப்பட்ட எளிய ஆம் அல்லது இல்லை என்பதைக் கடந்து செல்லும் எதையும் குறிக்கும் ஒப்பீட்டுப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐκ
  choice: இடமிருந்து
  rationale: மூலம் அல்லது தோற்றுவாயைக் குறிக்கும் கிரேக்க முன்னிடைச்சொல்லின் பொருளைத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: τοῦ πονηροῦ
  choice: தீயவன்
  rationale: இலக்கணப்படி ‘தீமை’ அல்லது ‘தீயவன்’ என இருவகையில் புரிந்துகொள்ளலாம். மத்தேயுவில் காணப்படும் தனிநபரைக் குறிக்கும் பயன்பாட்டின் அடிப்படையில் முதன்மை உரையில் ‘தீயவன்’ தேர்ந்தெடுக்கப்படுகிறது; மற்ற வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: τοῦ πονηροῦ என்பது ‘தீமை’ என்ற பொதுப்பொருளா, ‘தீயவன்’ என்ற தனிநபரைக் குறிக்கும் பொருளா?
  choice: தீயவன்
  alternative: தீமை
  rationale: கிரேக்கத் தொடர் உண்மையாகவே இருபொருள் கொள்ளக்கூடியது. மத்தேயுவின் பயன்பாட்டில் தனிநபரைக் குறிக்கும் பொருள் சாத்தியமானதாக இருப்பதால் அது முதன்மை உரையில் தரப்படுகிறது; தெளிவின்மையை மறைக்காமல் மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமானதும் கண்ணியமானதுமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆம், ஆம் / இல்லை, இல்லை’ என்ற மூலத்தின் இரட்டிப்பு திட்டமிட்டு தக்கவைக்கப்பட்டுள்ளது.
