id: MAT.5.17
reference: Matthew 5:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Μὴ νομίσητε ὅτι ἦλθον καταλῦσαι τὸν νόμον ἢ τοὺς προφήτας· οὐκ ἦλθον καταλῦσαι ἀλλὰ πληρῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/017.yaml
  text: Do not think that I came to abolish the Law or the Prophets[b][a]; I did not come to abolish them but to fulfill them.
translation:
  language: ta
  text: “திருச்சட்டத்தையோ இறைவாக்கினர்களையோ ஒழித்துவிட நான் வந்தேன்[a] என்று நினைக்காதீர்கள். ஒழித்துவிட அல்ல, நிறைவேற்றவே வந்தேன்[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நான் வந்தேன்’ என்பதற்கு ‘நான் வந்திருக்கிறேன்’ என்றும் மொழிபெயர்க்கலாம்; வசனத்தில் இது வரும் இரு இடங்களுக்கும் பொருந்தும்.
    reason: lexical_alternative
  - marker: b
    text: ‘நிறைவேற்ற’ என்பதை ‘நிறைவுக்குக் கொண்டுவர’ அல்லது ‘முழுமையாக வெளிப்படுத்த’ என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: என்று நினைக்காதீர்கள்
  rationale: μή உடன் வரும் aorist subjunctive இங்கு தடையாகச் செயல்படுகிறது. ‘நினைக்காதீர்கள்’ என்பது நேரடியானதும் நவீன தமிழில் இயல்பானதும் ஆகும்.
- source_word: ἦλθον
  choice: நான் வந்தேன்
  rationale: எளிய aorist வடிவை இயல்பாகப் பிரதிபலிக்கிறது. சூழலைப் பொறுத்து ‘நான் வந்திருக்கிறேன்’ என்றும் மொழிபெயர்க்கலாம்; அந்த வாய்ப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: καταλῦσαι
  choice: ஒழித்துவிட
  rationale: திருச்சட்டத்தையும் இறைவாக்கினர்களையும் குறிக்கும் இச்சூழலில், உடலளவில் அழிப்பதைவிட அவற்றை நீக்கிவிடுதல் அல்லது செல்லாததாக்குதல் என்ற பொருளைத் தெளிவாகத் தருகிறது.
- source_word: τὸν νόμον
  choice: திருச்சட்டம்
  rationale: பொதுவான சட்டத்தை அல்ல, இஸ்ரவேலின் வேதநூல் மரபிலுள்ள தோரா/மோசேயின் சட்டத்தைக் குறிக்கும் அங்கீகரிக்கப்பட்ட நவீனத் தமிழ் வேதாகமச் சொல்லாக்கம்.
- source_word: τοὺς προφήτας
  choice: இறைவாக்கினர்கள்
  rationale: தனிப்பட்ட சில தீர்க்கதரிசிகளை மட்டும் அல்லாமல், ‘திருச்சட்டமும் இறைவாக்கினர்களும்’ என்ற வேதநூல் தொகுப்புச் சுட்டின் இரண்டாம் பகுதியைக் குறிக்கிறது.
- source_word: ἀλλὰ πληρῶσαι
  choice: நிறைவேற்றவே
  rationale: ‘நிறைவேற்று’ என்பது நோக்கத்தை நிறைவுக்குக் கொண்டுவருதல், முழு வெளிப்பாட்டுக்குக் கொண்டுவருதல் போன்ற பொருள் வாய்ப்புகளைத் திறந்தவையாக வைத்திருக்கிறது; ஒரு குறிப்பிட்ட கோட்பாட்டு விளக்கத்துக்குள் சொல்லைச் சுருக்கவில்லை.
theological_decisions:
- issue: πληρῶσαι என்பதில் இயேசுவுக்கும் ‘திருச்சட்டம் அல்லது இறைவாக்கினர்கள்’ என்பதற்கும் உள்ள உறவு
  choice: நிறைவேற்றவே
  alternative: நிறைவுக்குக் கொண்டுவரவே; முழுமையாக வெளிப்படுத்தவே; உறுதிப்படுத்தவே
  rationale: இச்சொல்லின் பொருள் குறித்து பல மரபுகளில் மாறுபட்ட விளக்கங்கள் உள்ளன. ‘நிறைவேற்று’ என்ற விரிவான சொல்லைத் தக்கவைத்து, வசனத்திலேயே ஒரே கோட்பாட்டு விளக்கத்தைத் திணிக்காமல் அதன் இறையியல் அழுத்தத்தையும் பொருள் விரிவையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘திருச்சட்டம்’ மற்றும் ‘இறைவாக்கினர்கள்’ என்ற இணைச்சொல் வேதநூல் தொகுப்புச் சுட்டாகப் பாதுகாக்கப்பட்டுள்ளது. அடிக்குறி [a] முதல் ‘வந்தேன்’ என்பதற்குப் பின்னும், அது இரு நிகழ்வுகளுக்கும் பொருந்தும் என அடிக்குறிப்பிலும் தெளிவுபடுத்தப்பட்டுள்ளது; [b] ‘நிறைவேற்றவே வந்தேன்’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
