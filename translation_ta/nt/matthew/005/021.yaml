  text: Ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐ φονεύσεις· ὃς δ’ ἂν φονεύσῃ, ἔνοχος ἔσται τῇ κρίσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/021.yaml
  text: You have heard that it was said to the ancients[a], ‘You shall not murder[c][b]; and whoever murders will be liable to judgment.’
translation:
  language: ta
  text: “முற்காலத்தவர்களிடம்[a], ‘கொலை செய்யாதே; கொலை செய்கிற எவனும் நீதித்தீர்ப்புக்கு ஆளாவான்’ என்று சொல்லப்பட்டதாக நீங்கள் கேள்விப்பட்டிருக்கிறீர்கள்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பண்டையோரிடம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκούσατε
  choice: நீங்கள் கேள்விப்பட்டிருக்கிறீர்கள்
  rationale: இறந்தகால வினை வடிவம் இங்கு மக்கள் முன்பே கேட்டு அறிந்த, தற்போதும் அவர்களிடம் நிலவும் போதனையைச் சுட்டுகிறது; இயல்பான நவீனத் தமிழில் இவ்வாறு வழங்கப்படுகிறது.
- source_word: ἐρρέθη
  choice: சொல்லப்பட்டதை
  rationale: செயப்பாட்டு வடிவத்தைப் பேணி, சொன்னவர் யார் என்பதை மூலத்தைவிடக் குறிப்பாகத் தீர்மானிக்காமல் விடுகிறது.
- source_word: τοῖς ἀρχαίοις
  choice: முற்காலத்தவர்களிடம்
  rationale: இது பழங்காலத்தைச் சேர்ந்த மனிதர்களைக் குறிக்கிறது; வேற்றுமை உருபின் பெறுநர் பொருளையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Οὐ φονεύσεις
  choice: கொலை செய்யாதே
  rationale: φονεύω பொதுவாக உயிரைக் கொல்வதையெல்லாம் அல்ல, குறிப்பாக மனிதக் கொலையைக் குறிக்கிறது.
- source_word: ὃς δ’ ἂν φονεύσῃ
  choice: கொலை செய்கிறவன் எவனும்
  rationale: ἄν உடன் வரும் தொடர்புச் சொற்றொடரின் பொதுவான நிபந்தனைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἔνοχος ἔσται τῇ κρίσει
  choice: நீதித்தீர்ப்புக்கு ஆளாவான்
  rationale: சட்டவியல் சூழலில் தீர்ப்பை எதிர்கொள்ள வேண்டிய பொறுப்புக்குள்ளாவதைத் தெரிவிக்கிறது; எந்த நீதிமன்றம் அல்லது இறுதிக் கண்டனம் என்று தேவையின்றிக் குறிப்பாக்கவில்லை.
theological_decisions:
- issue: ஆறாம் கட்டளையின் φονεύω என்ற வினைச்சொல்
  choice: கொலை செய்யாதே
  alternative: உயிரைக் கொல்லாதே
  rationale: கிரேக்கச் சொல் எல்லா வகையான உயிர்க்கொல்லுதலையும் குறிக்காமல், மனிதக் கொலை என்ற குறுகிய பொருளைக் கொண்டது; ஆகவே மூலத்தில் இல்லாத முழுமையான தடையை மொழிபெயர்ப்பு சேர்க்கவில்லை.
- issue: τῇ κρίσει என்பதன் குறிப்பிட்ட நிறுவனம்
  choice: நீதித்தீர்ப்புக்கு
  alternative: நீதிமன்றத்துக்கு
  rationale: κρίσις நீதிமன்றத்தையோ நீதித் தீர்ப்பையோ சூழலின்படி குறிக்கக்கூடும். இங்கு மூலத்தின் அளவிலான பொதுமையைப் பேணி, ஒரு குறிப்பிட்ட மன்றத்தைத் தீர்மானிக்காமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மேற்கோளுக்குள் கட்டளையும் அதன் நீதிவிளைவும் ஒரே போதனை அலகாக அரைப்புள்ளியால் இணைக்கப்பட்டுள்ளன. ‘ஆளாவான்’ என்பது சட்டப் பொறுப்பை இயல்பாகச் சொல்கிறது.
