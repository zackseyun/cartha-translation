  text: ἀμὴν λέγω σοι, οὐ μὴ ἐξέλθῃς ἐκεῖθεν ἕως ἂν ἀποδῷς τὸν ἔσχατον κοδράντην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/026.yaml
  text: Truly I tell you[b][a], you will certainly not get out of there until you have paid the last quadrans.
translation:
  language: ta
  text: 'உண்மையாகவே உனக்குச் சொல்கிறேன்: கடைசிக் குவாட்ரன்ஸைச் செலுத்தும்வரை, அங்கிருந்து நீ நிச்சயமாக வெளியே வரமாட்டாய்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν
  choice: உண்மையாகவே
  rationale: இயேசுவின் அதிகாரமிக்க உறுதிமொழியை நவீன தமிழில் இயல்பாகவும் வலியுறுத்தலுடனும் தெரிவிக்கிறது; மொழிபெயர்க்காமல் ‘ஆமென்’ என்று விடப்படவில்லை.
- source_word: λέγω σοι
  choice: உனக்குச் சொல்கிறேன்
  rationale: ஒருமை முன்னிலையிலுள்ள நேரடி உரையையும் கிரேக்கச் சொற்றொடரின் இயல்பான பொருளையும் காக்கிறது.
- source_word: οὐ μὴ ἐξέλθῃς
  choice: நீ நிச்சயமாக வெளியே வரமாட்டாய்
  rationale: οὐ μή உடன் வரும் வலிமையான மறுப்பை ‘நிச்சயமாக … மாட்டாய்’ எனத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐκεῖθεν
  choice: அங்கிருந்து
  rationale: அந்த இடத்தைவிட்டு நகர்வதைக் குறிக்கும் கிரேக்கச் சொல்லின் இயல்பான தமிழ் இணை.
- source_word: ἕως ἂν ἀποδῷς
  choice: நீ செலுத்தும்வரை
  rationale: எதிர்காலத்தில் தொகை முழுவதும் செலுத்தப்படுவது வரையிலான நிலையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τὸν ἔσχατον
  choice: கடைசிக் … ஐயும்
  rationale: செலுத்த வேண்டிய தொகையின் மிகச் சிறிய இறுதிப் பகுதியும் விடுபடாது என்ற கருத்தைத் தமிழின் ‘-உம்’ வலியுறுத்தலுடன் தருகிறது.
- source_word: κοδράντην
  choice: குவாட்ரன்ஸ்
  rationale: குறிப்பிட்ட ரோம நாணயத்தின் பெயரைப் பொதுவான ‘காசு’ என்று மாற்றாமல் ஒலிபெயர்த்து, வரலாற்றுத் துல்லியத்தைக் காக்கிறது.
theological_decisions:
- issue: இந்தச் சிறை மற்றும் கடன் உருவகத்தை இறுதித் தீர்ப்பு, தூய்மைப்படுத்தல் அல்லது வெறும் சட்டச் சூழல் என்று தீர்மானித்தல்
  choice: கடன் முழுவதும் செலுத்தப்படும் வரை வெளியே வர இயலாத நிலையை மட்டுமே மொழிபெயர்ப்பில் கூறுதல்
  alternative: இதைத் தெய்வீகத் தீர்ப்பு அல்லது மரணத்திற்குப் பிந்தைய தூய்மைப்படுத்தல் என்று வெளிப்படையாக விளக்குதல்
  rationale: கிரேக்க வசனம் குறிப்பிட்ட கோட்பாட்டு விளக்கத்தைத் தானாக நிர்ணயிக்கவில்லை. ஆகவே உடனடி சட்ட/சிறை உருவகம் காக்கப்பட்டு, அதன் விரிந்த இறையியல் பொருள் தீர்மானிக்கப்படாமல் விடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; நேரடியான, கண்ணியமான நடை. ஒருமை முன்னிலை ‘உனக்கு/நீ’ மூலத்தின் நேரடி தன்மையைப் பாதுகாக்கிறது. வலிமையான மறுப்பும் குறிப்பிட்ட ரோம நாணயப் பெயரும் வெளிப்படையாகக் காக்கப்பட்டுள்ளன.
