source:
  edition: SBLGNT
  text: οὕτως λαμψάτω τὸ φῶς ὑμῶν ἔμπροσθεν τῶν ἀνθρώπων, ὅπως ἴδωσιν ὑμῶν τὰ καλὰ ἔργα καὶ δοξάσωσιν τὸν πατέρα ὑμῶν τὸν ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/016.yaml
  text: In the same way[a], let your light shine before men[b], so that they may see your good works and glorify your Father who is in the heavens.
translation:
  language: ta
  text: அவ்வாறே, மனிதர்கள் உங்கள் நற்செயல்களைக் கண்டு, பரலோகங்களில்[a] இருக்கிற உங்கள் தந்தையை மகிமைப்படுத்தும்படி, உங்கள் ஒளி அவர்கள் முன்பாக ஒளிரட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரலோகத்தில்.” கிரேக்க மூலத்தில் “பரலோகங்கள்” என்பது பன்மையில் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: அவ்வாறே
  rationale: முந்தைய விளக்கு மற்றும் ஒளி உருவகத்தோடு இவ்வசனத்தை இணைத்து, ‘அதே விதத்தில்’ என்ற முறையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: λαμψάτω
  choice: ஒளிரட்டும்
  rationale: மூன்றாம் நபர் ஒருமை கட்டளை வடிவத்தின் வலிமையை இயல்பாகப் பேணுகிறது.
- source_word: τὸ φῶς ὑμῶν
  choice: உங்கள் ஒளி
  rationale: கிரேக்கத்தின் ஒருமையையும் சீடர்களைக் கூட்டாகக் குறிக்கும் உடைமைத் தொடர்பையும் பேணுகிறது.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: மனிதர்களுக்கு முன்பாக
  rationale: ἀνθρώπων இங்கு ஆண்களை மட்டும் அல்லாமல் மனிதர்களைப் பொதுவாகக் குறிக்கிறது; ‘மனிதர்கள்’ என்பது நவீன தமிழில் துல்லியமும் இயல்பும் உடையது.
- source_word: ὅπως
  choice: …ும்படி
  rationale: பின்வரும் செயல்களின் நோக்கம் அல்லது விளைவைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; அதிலுள்ள நோக்கத் தொனியை நீக்கவில்லை.
- source_word: ἴδωσιν
  choice: கண்டு
  rationale: ὅπως உடன் வரும் துணைநிலை வினையின் பொருளை நோக்க வாக்கிய அமைப்பில் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: τὰ καλὰ ἔργα
  choice: உங்கள் நற்செயல்கள்
  rationale: καλά என்பதிலுள்ள நல்ல, சிறந்த, பாராட்டத்தக்க என்ற கருத்துகளை வாசகருக்குப் புரியும் வழக்கமான தமிழில் தெரிவிக்கிறது.
- source_word: δοξάσωσιν
  choice: மகிமைப்படுத்தும்படி
  rationale: தேவனைச் சார்ந்த δοξάζω என்பதற்குரிய நிலையான இறையியல் எடையைப் பேணுகிறது.
- source_word: τὸν πατέρα ὑμῶν
  choice: உங்கள் தந்தை
  rationale: மத்தேயுவில் முக்கியமான உறவுமுறை மொழியை நவீன, பொதுவாகப் புரியும் தமிழில் தருகிறது.
- source_word: τὸν ἐν τοῖς οὐρανοῖς
  choice: பரலோகங்களில் இருக்கிற
  rationale: கிரேக்க மூலத்தின் பன்மை வடிவத்தைத் தெளிவாகப் பேணுகிறது; இது தேவனுடைய வாசஸ்தலத்தைக் குறிக்கிறது என்பதை ‘பரலோகம்’ இயல்பாக உணர்த்துகிறது.
theological_decisions:
- issue: ἀνθρώπων என்பதன் பொதுப்பொருள்
  choice: மனிதர்களுக்கு முன்பாக
  alternative: ஆட்களுக்கு முன்பாக / மற்றவர்களுக்கு முன்பாக
  rationale: இங்கு சொல் ஆண்களை மட்டும் குறிக்காமல் எல்லா மனிதர்களையும் பொதுவாகக் குறிக்கிறது. பாலின வரம்பைத் தவறாக உருவாக்காமல் மூலத்தின் பொதுப்பொருளைத் தருகிறது.
- issue: οὐρανοῖς என்பதன் பன்மை
  choice: பரலோகங்களில் இருக்கிற
  alternative: பரலோகத்தில் இருக்கிற
  rationale: மூலத்தில் உள்ள பன்மையை முதன்மை உரையில் பேணுகிறது; வழக்கமான தமிழ் ஒருமை மாற்றை அடிக்குறிப்பில் வழங்குகிறது.
- issue: ὅπως குறிக்கும் நோக்கம் அல்லது விளைவு
  choice: மகிமைப்படுத்தும்படி
  alternative: அதனால் … மகிமைப்படுத்துவார்கள்
  rationale: கிரேக்க அமைப்பு நோக்கத்தையும் எதிர்பார்க்கப்படும் விளைவையும் இடமளிக்கிறது. ‘…ும்படி’ நோக்கத் தொனியைப் பேணுகிறது; விளைவை மட்டும் உறுதியாக்கி ambiguity-ஐ நீக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதாகப் புரியும், அதேவேளை கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பிதா’ போன்ற சமயவழக்குச் சொல்லுக்குப் பதிலாக பொதுவாகப் புரியும் ‘தந்தை’ தேர்ந்தெடுக்கப்பட்டது. நோக்க வாக்கியம் நீளமாக இருந்தாலும் தெளிவைப் பேண நீண்ட கோடு பயன்படுத்தப்பட்டுள்ளது; எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
