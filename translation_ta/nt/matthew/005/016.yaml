review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the imperative, the collective singular “your light,” the public setting, the good deeds, glorifying the Father, and the Greek plural in οὐρανοῖς. However, the purpose clause is more clearly and idiomatically expressed in Tamil when it directly frames both “see” and “glorify” as the intended response to the shining light.
  naturalness: “மனிதர்களுக்கு முன்பாக” is understandable but less idiomatic than “மனிதர்கள் முன்பாக.” More importantly, placing the purpose clause after an em dash makes its syntactic connection somewhat loose in Tamil. Reordering the sentence makes the intended relation clear and preserves a dignified modern-standard register.
  terminology: “ஒளி,” “நற்செயல்கள்,” “மகிமைப்படுத்த,” and “தந்தை” are appropriate. “பரலோகங்களில்” deliberately retains the source plural; the supplied footnote appropriately gives the conventional singular alternative.
  issues:
  - severity: low
    issue: The purpose construction is syntactically loose after the em dash.
    rationale: The present wording can be understood, but Tamil reads more smoothly when “மனிதர்கள் … கண்டு … மகிமைப்படுத்தும்படி” precedes the main imperative, explicitly making both actions the purpose of the light’s shining.
  - severity: low
    issue: “மனிதர்களுக்கு முன்பாக” is slightly less natural than “மனிதர்கள் முன்பாக.”
    rationale: Both are semantically accurate for ἔμπροσθεν τῶν ἀνθρώπων, but the latter is the more idiomatic formal-modern Tamil expression.
  revised_text: அவ்வாறே, மனிதர்கள் உங்கள் நற்செயல்களைக் கண்டு, பரலோகங்களில்[a] இருக்கிற உங்கள் தந்தையை மகிமைப்படுத்தும்படி, உங்கள் ஒளி அவர்கள் முன்பாக ஒளிரட்டும்.
  revised_footnotes:
