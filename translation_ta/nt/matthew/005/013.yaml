id: MAT.5.13
reference: Matthew 5:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὑμεῖς ἐστε τὸ ἅλας τῆς γῆς· ἐὰν δὲ τὸ ἅλας μωρανθῇ, ἐν τίνι ἁλισθήσεται; εἰς οὐδὲν ἰσχύει ἔτι εἰ μὴ ⸂βληθὲν ἔξω⸃ καταπατεῖσθαι ὑπὸ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/013.yaml
  text: You are the salt of the earth. But if the salt becomes tasteless[a], with what will it be made salty? It is no longer good for anything except to be thrown out and trampled underfoot by men.
translation:
  language: ta
  text: நீங்களே பூமியின் உப்பு. ஆனால் உப்பு தன் உவர்ப்பை இழந்துவிட்டால், எதனால் அது மீண்டும் உப்பாக்கப்படும்? வெளியே எறியப்பட்டு மனிதர்களால் மிதிக்கப்படுவதைத் தவிர, வேறு எதற்கும் அது இனிப் பயன்படாது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς
  choice: நீங்களே
  rationale: வெளிப்படையாக இடம்பெறும் கிரேக்கப் பிரதிப்பெயரின் வலியுறுத்தலை இயல்பான தமிழில் ‘நீங்களே’ வெளிப்படுத்துகிறது.
- source_word: τὸ ἅλας τῆς γῆς
  choice: பூமியின் உப்பு
  rationale: γῆ என்பதற்கு பூமி, நிலம், தரை ஆகிய பொருள்கள் உண்டு; இங்கு உருவகத்தின் பரந்த நோக்குக்கு ‘பூமி’ இயல்பாகப் பொருந்துகிறது.
- source_word: μωρανθῇ
  choice: தன் உவர்ப்பை இழந்துவிட்டால்
  rationale: μωραίνω என்பதன் அடிப்படைத் தொடர்பு ‘மடமையாகுதல்’ என்பதுடன் இருந்தாலும், உப்பைக் குறிக்கும் இச்சூழலில் சுவையிழத்தல் அல்லது உவர்ப்பிழத்தல் என்பதே பொருள். தமிழ் வழக்கில் ‘உவர்ப்பை இழத்தல்’ உருவகத்தைத் தெளிவாகக் காக்கிறது.
- source_word: ἐν τίνι ἁλισθήσεται;
  choice: எதனால் அது மீண்டும் உப்பாக்கப்படும்?
  rationale: எதிர்காலச் செயப்பாட்டு வடிவம் எந்த வழிமுறையால் அது உப்பாக்கப்படும் என்று கேட்கிறது. ‘மீண்டும்’ என்பது சூழலில் உள்ள மீட்புக் கருத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἰς οὐδὲν ἰσχύει ἔτι
  choice: வேறு எதற்கும் அது இனிப் பயன்படாது
  rationale: இங்கு ἰσχύω வலிமையைவிட நடைமுறைப் பயன் அல்லது தகுதியைக் குறிக்கிறது; இந்தத் தமிழ் சொற்றொடர் அந்தப் பயனின்மையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: εἰ μὴ βληθὲν ἔξω
  choice: வெளியே எறியப்பட்டு ... தவிர
  rationale: ἔξω என்பதன் இடவியல் பொருளையும், βληθέν என்பதன் செயப்பாட்டு நிலைப்பாட்டையும் தமிழில் நேரடியாகக் காக்கிறது.
- source_word: καταπατεῖσθαι
  choice: மிதிக்கப்படுவதை
  rationale: காலடியில் மிதித்தல் அல்லது துவைத்தல் என்ற தெளிவான காட்சியை ‘மிதிக்கப்படுதல்’ இயல்பாக வழங்குகிறது.
- source_word: ὑπὸ τῶν ἀνθρώπων
  choice: மனிதர்களால்
  rationale: ἄνθρωποι இங்கு ஆண்களை மட்டும் அல்ல, பொதுவாக மனிதர்களைக் குறிக்கிறது. தமிழின் ‘மனிதர்கள்’ இந்தப் பொதுமனிதப் பொருளைத் துல்லியமாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: Ὑμεῖς என்பதிலுள்ள வலியுறுத்தல்
  choice: நீங்களே
  alternative: நீங்கள்
  rationale: சீடர்களை நேரடியாக அடையாளப்படுத்தும் கிரேக்க வலியுறுத்தலைக் காக்க ‘நீங்களே’ தேர்ந்தெடுக்கப்பட்டது; இது கூடுதல் கோட்பாட்டுப் பொருளைச் சேர்ப்பதில்லை.
- issue: μωρανθῇ என்பதன் சொல்விளையாட்டு மற்றும் உருவகப் பொருள்
  choice: தன் உவர்ப்பை இழந்துவிட்டால்
  alternative: சுவையற்றுப் போனால் / மடமையாகிவிட்டால்
  rationale: உப்பைப் பற்றிய உடனடி உருவகத்தில் உவர்ப்பிழத்தலே இயல்பான பொருள். ‘மடமையாகிவிட்டால்’ சொற்பிறப்புத் தொடர்பைக் காட்டினாலும் தமிழில் உருவகத்தைத் தவறாகத் திருப்பக்கூடும்.
- issue: ὑπὸ τῶν ἀνθρώπων என்பதன் பொதுமனிதக் குறிப்பு
  choice: மனிதர்களால்
  alternative: ஆண்களால்
  rationale: கிரேக்கப் பன்மை இங்கு ஆண் பாலினத்தவரை மட்டும் குறிக்காமல் மனிதர்களைப் பொதுவாகக் குறிக்கிறது; தமிழில் பாலினத் திணிப்பின்றி மூலத்தின் நோக்கத்தை ‘மனிதர்களால்’ துல்லியமாக வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. ‘உப்பாக்கப்படும்’ என்ற சற்று அசாதாரணமான அமைப்பு மூலத்தின் செயப்பாட்டு வினாவைத் தக்கவைக்கிறது; ‘மீண்டும்’ சூழலின் மீட்பு நோக்கைத் தெளிவாக்குகிறது.
