id: MAT.5.30
reference: Matthew 5:30
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἰ ἡ δεξιά σου χεὶρ σκανδαλίζει σε, ἔκκοψον αὐτὴν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου ⸂εἰς γέενναν ἀπέλθῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/030.yaml
  text: And if your right hand causes you to stumble[a], cut it off and throw it away[c][b]. For it is better for you that one of your members should perish than that your whole body should go into Gehenna.
translation:
  language: ta
  text: உன் வலது கை உன்னை இடறச் செய்தால்[a], அதை வெட்டித் தூர எறிந்துவிடு. ஏனெனில், உன் உடல் முழுவதும் கெஹென்னாவுக்குள்[b] போவதைவிட, உன் உடல் உறுப்புகளில் ஒன்று அழிந்துபோவது உனக்கு நல்லது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன்னைப் பாவம் செய்யச் செய்தால்.” கிரேக்க வினைச்சொல் சொல்லுக்குச் சொல் “இடறச் செய்தல்” என்று பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நரகத்துக்குள்.” “கெஹென்னா” என்ற கிரேக்கச் சொல் இன்னோம் பள்ளத்தாக்கிலிருந்து பெறப்பட்டது; அது இறுதிக்காலத் தீர்ப்பைக் குறிக்கப் பயன்படுத்தப்பட்டது.
    reason: alternative_reading
lexical_decisions:
- source_word: δεξιά ... χείρ
  choice: உன் வலது கை
  rationale: இயல்பான நவீனத் தமிழ் சொற்றொடர்; உடலுறுப்பின் குறிப்பையும் முந்தைய வசனத்துடனான இணை அமைப்பையும் காக்கிறது.
- source_word: σκανδαλίζει
  choice: உன்னை இடறச் செய்தால்
  rationale: பாவத்தில் விழச் செய்வதைக் குறிக்கும் இடறுதல் உருவகத்தைத் தீர்த்துவிடாமல் காக்கிறது; சூழலில் புரிந்துகொள்ளக்கூடிய தமிழாகவும் உள்ளது.
- source_word: ἔκκοψον
  choice: வெட்டி
  rationale: ஒரு கையைத் துண்டிக்கும் தீர்மானமான கட்டளையை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: βάλε ἀπὸ σοῦ
  choice: தூர எறிந்துவிடு
  rationale: தன்னிடமிருந்து அகற்றி முற்றிலும் நிராகரிக்கும் வலிமையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: συμφέρει γάρ σοι
  choice: உனக்கு நல்லது
  rationale: பொருளாதார இலாபம் அல்லாமல் ஒப்பீட்டு நன்மையைக் குறிக்கும் சூழல்சார் பொருளை இயல்பாகத் தருகிறது.
- source_word: ἵνα ἀπόληται
  choice: அழிந்துபோவது
  rationale: உடலுறுப்பு இழக்கப்படுதல் அல்லது அழிக்கப்படுதல் என்ற தீவிரத்தைப் பேணுகிறது.
- source_word: ἓν τῶν μελῶν σου
  choice: உன் உடல் உறுப்புகளில் ஒன்று
  rationale: μέλος என்பதன் பரந்த உடற்பகுதி பொருளைக் காக்கிறது; ‘கைகால்கள்’ என்று குறுக்கவில்லை.
- source_word: ὅλον τὸ σῶμά σου
  choice: உன் உடல் முழுவதும்
  rationale: ஒரே உறுப்புக்கும் முழு உடலுக்கும் இடையிலான எதிர்மறை ஒப்பீட்டைத் தெளிவாகக் காக்கிறது.
- source_word: εἰς γέενναν ἀπέλθῃ
  choice: கெஹென்னாவுக்குள் போவது
  rationale: ἀπέρχομαι என்ற செல்லுதல் கருத்தையும் εἰς என்ற உள்நோக்கிய திசையையும் காக்கிறது; γέεννα என்ற வரலாற்று-இறையியல் சொல்லை பொதுவான விளக்கச்சொல்லால் மாற்றவில்லை.
theological_decisions:
- issue: γέεννα என்பதன் மொழிபெயர்ப்பு
  choice: கெஹென்னா
  alternative: நரகம்
  rationale: மூலமொழியின் γέεννα என்பது இன்னோம் பள்ளத்தாக்கிலிருந்து பெறப்பட்ட இறுதித் தீர்ப்பு சார்ந்த சொல். அதை ஒலிபெயர்ப்பது அதன் வரலாற்று மற்றும் இறையியல் தனித்தன்மையைப் பேணுகிறது; ‘நரகம்’ என்பது புரிந்துகொள்ள உதவும் சூழல்சார் மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் எச்சரிக்கையின் கண்ணியமான தீவிரம் குன்றாத வகையிலும் வடிவமைக்கப்பட்டது. இடறுதல் உருவகமும் ‘கெஹென்னா’ என்ற மூலச்சொல்லும் முதன்மை உரையில் பேணப்பட்டு, விளக்கமான மாற்றுகள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
