    text: 'அல்லது, மேலும் சொற்சொல்லாக: “அவர் தம் வாயைத் திறந்து, அவர்களுக்குப் போதித்துக்கொண்டிருந்தார்; இவ்வாறு கூறி:”'
    reason: மூலத்தில் ‘போதித்தார்’ என்பது தொடர்ச்சித் தன்மையுடைய இறந்தகால வினை; ‘கூறி’ என்பது அப்போதனையின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது.
  revision_rationale: The revision preserves the explicit mouth-opening idiom, the unspecified referent ‘them,’ and the discourse-introducing function of λέγων. It avoids forcing ἐδίδασκεν into an inceptive sense while using idiomatic Tamil to connect the ongoing teaching with the words that follow. The footnote supplies a closer formal rendering and explains the imperfective nuance without claiming that the action necessarily began at that moment.
