id: MAT.5.2
reference: Matthew 5:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἀνοίξας τὸ στόμα αὐτοῦ ἐδίδασκεν αὐτοὺς λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/002.yaml
  text: 'And he opened his mouth and taught them[a], saying:'
translation:
  language: ta
  text: அவர் தம் வாயைத் திறந்து, அவர்களுக்குப் போதித்தபடி இவ்வாறு கூறினார்:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, மேலும் சொற்சொல்லாக: “அவர் தம் வாயைத் திறந்து, அவர்களுக்குப் போதித்துக்கொண்டிருந்தார்; இவ்வாறு கூறி:”'
    reason: மூலத்தில் ‘போதித்தார்’ என்பது தொடர்ச்சித் தன்மையுடைய இறந்தகால வினை; ‘கூறி’ என்பது அப்போதனையின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது.
lexical_decisions:
- source_word: καὶ
  choice: (தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை)
  rationale: தமிழில் முந்தைய நிகழ்வுடன் இயல்பாகத் தொடரும் வாக்கியத்தில் ‘மேலும்’ அல்லது ‘அப்போது’ என்று சேர்ப்பது தேவையற்ற வலியுறுத்தலை அல்லது காலநுணுக்கத்தை உருவாக்கும்; தொடர்ச்சி வாக்கிய அமைப்பிலேயே வெளிப்படுகிறது.
- source_word: ἀνοίξας
  choice: திறந்து
  rationale: இறந்தகாலப் பெயரெச்சத்தின் முன்னிகழ்வைத் தமிழின் இயல்பான வினையெச்ச வடிவம் தருகிறது; ‘பேசத் தொடங்கி’ என்று இடியத்தைச் சுருக்காமல், மூலத்தின் கம்பீரமான சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: τὸ στόμα αὐτοῦ
  choice: தம் வாயை
  rationale: இயேசுவைக் குறிக்கும் மரியாதைப் பன்மை வினைமுற்றுடன் பொருந்தும் தற்படர்க்கைப் பதிலிடுபெயர் பயன்படுத்தப்பட்டுள்ளது; ‘வாயைத் திறந்து’ என்ற மூல உருவகம் விடப்படவில்லை.
- source_word: ἐδίδασκεν
  choice: போதித்து
  rationale: கிரேக்க முற்றுப்பெறா இறந்தகால வினையின் தொடர்ச்சித் தன்மை, தமிழில் அடுத்து வரும் ‘சொன்னார்’ என்பதோடு இணைந்த வினையெச்சத்தால் இயல்பாக வெளிப்படுகிறது; ‘போதிக்கத் தொடங்கினார்’ என்று தொடக்கநிலையை மட்டும் தீர்மானிக்கவில்லை.
- source_word: αὐτοὺς
  choice: அவர்களுக்கு
  rationale: பதிலிடுபெயரின் குறிப்பை இவ்வசனத்திற்கு வெளியுள்ள சூழலே நிர்ணயிப்பதால், ‘சீடர்கள்’ அல்லது ‘மக்கள்’ என்று விளக்கமாகச் சேர்க்காமல் மூலத்தின் தெளிவின்மை பாதுகாக்கப்படுகிறது.
- source_word: λέγων
  choice: சொன்னார்
  rationale: அடுத்து வரும் போதனையின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் நிகழ்காலப் பெயரெச்சம், தமிழில் இயல்பான மேற்கோள் அறிமுக வினையாக வழங்கப்பட்டுள்ளது.
