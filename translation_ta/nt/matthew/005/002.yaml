  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘வாயைத் திறந்து’ என்ற மூலத்தின் முறையான பேச்சு அறிமுகச் சொல்லாட்சி பாதுகாக்கப்பட்டுள்ளது; ‘அவர்களுக்கு’ என்பதன் குறிப்பு திட்டமிட்டு விளக்கப்படவில்லை.
