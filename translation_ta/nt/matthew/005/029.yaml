id: MAT.5.29
reference: Matthew 5:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ δὲ ὁ ὀφθαλμός σου ὁ δεξιὸς σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου βληθῇ εἰς γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/029.yaml
  text: But if your right eye causes you to stumble[a], tear it out and throw it away from you[b]. For it is better for you that one of your members should perish than that your whole body should be thrown into Gehenna.
translation:
  language: ta
  text: ஆனால், உன் வலது கண் உன்னை இடறச் செய்தால்[a], அதைப் பிடுங்கி உன்னிடமிருந்து எறிந்துவிடு. ஏனெனில், உன் முழு உடலும் கெஹென்னாவுக்குள்[b] எறியப்படுவதைவிட, உன் உறுப்புகளில் ஒன்று அழிந்துபோவது உனக்கு மேல்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “உன்னைப் பாவம் செய்யச் செய்தால்.”'
    reason: lexical_alternative
  - marker: b
    text: “கெஹென்னா” என்பது இன்னோம் பள்ளத்தாக்குடன் தொடர்புடைய ஒரு பெயரின் கிரேக்க வடிவம்; இது மரபாக “நரகம்” என்று மொழிபெயர்க்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζει
  choice: இடறச் செய்தால்
  rationale: பாவத்தில் விழச் செய்யும் பொருளைக் கொண்ட மூல உருவகத்தைத் தமிழிலும் இயல்பாகப் பாதுகாக்கிறது; சூழலுக்கேற்ற தெளிவான விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἔξελε
  choice: பிடுங்கி
  rationale: கண்ணை வலுக்கட்டாயமாக அகற்றும் மூலத்தின் தீவிரமான, அதிர்ச்சியூட்டும் படிமத்தைப் பாதுகாக்கிறது.
- source_word: βάλε ἀπὸ σοῦ
  choice: உன்னிடமிருந்து எறிந்துவிடு
  rationale: βάλε என்பதன் வலிமையான கட்டளையையும் ἀπὸ σοῦ குறிக்கும் தன்னிடமிருந்து பிரித்தகற்றுதலையும் வெளிப்படுத்துகிறது.
- source_word: συμφέρει
  choice: உனக்கு நல்லது
  rationale: பயன் அல்லது மேலான நன்மையைத் தெரிவிக்கும் இச்சொல், ஒப்பீட்டு வாக்கியத்தில் இயல்பான நவீன தமிழாக வருகிறது.
- source_word: ἀπόληται
  choice: அழிந்துபோவது
  rationale: ஒரு உடல் உறுப்பு இழக்கப்படுவதன் கடுமையைப் பாதுகாக்கிறது; அதன் இயல்பை தேவையின்றி மேலும் குறிப்பாக்கவில்லை.
- source_word: μέλος
  choice: உறுப்பு
  rationale: கண் உள்ளிட்ட உடலின் எந்த உறுப்பையும் குறிக்கக்கூடிய துல்லியமான, இயல்பான தமிழ்ச் சொல்.
- source_word: βληθῇ
  choice: எறியப்படுவதை
  rationale: βάλλω என்பதன் செயப்பாட்டு வடிவத்தையும் அதன் வலிமையையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: γέενναν
  choice: கெஹென்னா
  rationale: பிற்காலப் பொதுவான இறையியல் சொல்லால் மாற்றாமல், கிரேக்கத்தில் உள்ள தனிப்பட்ட இடப்பெயர் சார்ந்த சொல்லைப் பாதுகாக்கிறது.
- source_word: ὁ δεξιὸς
  choice: வலது
  rationale: மூலத்தில் வெளிப்படையாக உள்ள வலப்பக்கக் குறிப்பை அப்படியே தக்கவைக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய கருத்தின் தொடர்ச்சியில் உள்ள மென்மையான முரண்பாட்டை இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: γέεννα என்பதன் மொழிபெயர்ப்பு
  choice: கெஹென்னா
  alternative: நரகம்
  rationale: மூலத்தின் தனித்த சொல்லையும் அதன் வரலாற்று சார்புகளையும் பாதுகாக்கிறது; பின்னாளைய விரிவான இறையியல் கருத்துகளை மூலத்திற்குள் முன்கூட்டியே புகுத்துவதைத் தவிர்க்கிறது.
- issue: σκανδαλίζω என்பதன் உருவக வலிமை
  choice: இடறச் செய்தால்
  alternative: பாவம் செய்யச் செய்தால்
  rationale: மூலத்தின் இடறுதல் உருவகத்தை முதன்மை உரையில் வைத்திருக்கிறது; சூழலில் அது பாவத்தில் விழுவதைக் குறிக்கலாம் என்பது அடிக்குறிப்பில் தெளிவாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. மூலத்தின் கடுமையான உருவகம் மென்மையாக்கப்படவில்லை. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
