id: MAT.5.8
reference: Matthew 5:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μακάριοι οἱ καθαροὶ τῇ καρδίᾳ, ὅτι αὐτοὶ τὸν θεὸν ὄψονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/008.yaml
  text: Blessed are the pure in heart[b][a], because they will see God.
translation:
  language: ta
  text: உள்ளத்தில் தூய்மையானவர்கள்[a] பேறுபெற்றவர்கள்; ஏனெனில் அவர்களே கடவுளைக் காண்பார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உள்ளத்தில் சுத்தமானவர்கள்.’
    reason: lexical_alternative
  - marker: b
    text: ‘கடவுளைக் காண்பார்கள்’ என்ற வாக்குறுதி, கடவுளின் பிரசன்னத்தை நேரடியாக அணுகுவதையும் அதன் எதிர்கால முழுநிறைவேற்றத்தையும் குறிக்கக்கூடும்; அதன் பொருளைக் குறுக்காமல் மூலத்தின் நேரடி சொற்றொடர் பாதுகாக்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: பேறுபெற்றவர்கள்
  rationale: இது வெறும் மகிழ்ச்சி உணர்வைக் குறிக்காமல், கடவுளின் அருளுக்குரிய நற்பேற்றையும் விரும்பத்தக்க நிலையையும் வெளிப்படுத்துகிறது; மலைப்பொழிவின் வாழ்த்துரைகளுக்கு ஏற்ற, dignified நவீனத் தமிழ் நடை.
- source_word: καθαροὶ
  choice: தூய்மையானவர்கள்
  rationale: இச்சூழலில் உள்ளார்ந்த ஒழுக்க மற்றும் ஆன்மிகத் தூய்மையை இயல்பாகக் குறிக்கிறது. ‘சுத்தமானவர்கள்’ என்பதும் சாத்தியம்; ஆனால் அது வெளிப்புற அல்லது சடங்குசார் சுத்தத்தை அதிகமாக நினைவூட்டலாம்.
- source_word: τῇ καρδίᾳ
  choice: உள்ளத்தில்
  rationale: καρδία இங்கு உணர்ச்சியை மட்டும் அல்லாமல் உள்ளார்ந்த மனிதரைச் சுட்டுகிறது. இடம் அல்லது தொடர்பைக் காட்டும் கிரேக்க வேற்றுமையை ‘உள்ளத்தில்’ என்பது இயல்பாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முன் கூறப்பட்ட பேற்றுக்கான காரணத்தையோ அடிப்படையையோ தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: αὐτοὶ
  choice: அவர்களே
  rationale: 'கிரேக்கச் சுட்டுப்பெயரின் வலியுறுத்தலைத் தமிழில் இயல்பாகப் பாதுகாக்க ‘-ஏ’ சேர்க்கப்பட்டுள்ளது: இப்படிப்பட்டவர்கள்தாம் அந்த வாக்குறுதியைப் பெறுவார்கள்.'
- source_word: τὸν θεὸν
  choice: கடவுளை
  rationale: ὄψονται என்பதன் நேரடிச் செயப்படுபொருளை எளிமையாகவும் நேரடியாகவும் மொழிபெயர்க்கிறது.
- source_word: ὄψονται
  choice: காண்பார்கள்
  rationale: ὁράω வினையின் எதிர்கால வடிவத்தை நேரடியான வாக்குறுதியாக வழங்குகிறது; அதன் இறுதிக்கால அல்லது கடவுளின் பிரசன்னத்தை அணுகும் சார்பை மொழிபெயர்ப்பிலேயே குறுக்காமல் விடுகிறது.
theological_decisions:
- issue: ‘கடவுளைக் காண்பார்கள்’ என்பதன் பொருள்
  choice: விளக்க விரிவாக்கமின்றி ‘கடவுளைக் காண்பார்கள்’ என்று அப்படியே வைக்கப்பட்டது.
  alternative: ‘கடவுளின் பிரசன்னத்தை அனுபவிப்பார்கள்’ அல்லது ‘இறுதிக்காலத்தில் கடவுளை நேரில் காண்பார்கள்.’
  rationale: கிரேக்க வாசகம் சுருக்கமாகவும் நேரடியாகவும் உள்ளது. அது கடவுளின் பிரசன்னத்தை நேரடியாக அணுகுவதையும் அதன் எதிர்கால நிறைவேற்றத்தையும் உள்ளடக்கக்கூடும்; ஆனால் அவற்றில் ஒன்றாக மட்டும் பொருளைக் குறுக்காமல், மூலத்தின் இறையியல் ஆழமும் பதற்றமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம வாழ்த்துரைக்குரிய கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘அவர்களே’ என்பது αὐτοὶ-யின் வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
