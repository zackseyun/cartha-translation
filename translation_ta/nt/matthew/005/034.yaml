id: MAT.5.34
reference: Matthew 5:34
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ὀμόσαι ὅλως· μήτε ἐν τῷ οὐρανῷ, ὅτι θρόνος ἐστὶν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/034.yaml
  text: 'But I say to you, do not swear at all: neither by heaven, because it is the throne of God;'
translation:
  language: ta
  text: 'ஆனால் நான் உங்களுக்குச் சொல்கிறேன்: எவ்விதத்திலும் சத்தியம் செய்யாதீர்கள்; வானத்தின் பேரில் சத்தியம் செய்யாதீர்கள், ஏனெனில் அது கடவுளின் அரியணை;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: ஆனால் நான் உங்களுக்குச் சொல்கிறேன்
  rationale: δὲ-யின் எதிர்மறைத் தொடர்பையும் ἐγώ-வின் வெளிப்படையான வலியுறுத்தலையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: μὴ ὀμόσαι ὅλως
  choice: எவ்விதத்திலும் சத்தியம் செய்யாதீர்கள்
  rationale: ὅλως என்பதன் முழுமையான மறுப்பைத் தெளிவாகக் காட்டுகிறது; ὀμόσαι என்பது உறுதிமொழியாகச் சத்தியம் செய்வதைக் குறிக்கிறது.
- source_word: μήτε ἐν τῷ οὐρανῷ
  choice: வானத்தின்மேல் சத்தியம் செய்யாதீர்கள்
  rationale: கிரேக்கத்தில் வினைச்சொல் மறுபடியும் கூறப்படாமல் இருப்பதைத் தமிழில் தெளிவுக்காக நிரப்புகிறது; ἐν இங்கு சத்தியத்தின் ஆதாரத்தை அல்லது சாட்சியைச் சுட்டுகிறது.
- source_word: ὅτι θρόνος ἐστὶν τοῦ θεοῦ
  choice: ஏனெனில் அது கடவுளின் அரியணை
  rationale: ὅτι-யின் காரணப் பொருளையும் θρόνος-இன் அரசருக்குரிய அரியணை உருவகத்தையும் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: μὴ ὀμόσαι ὅλως என்பதன் கட்டளையின் பரப்பு
  choice: எவ்விதத்திலும் சத்தியம் செய்யாதீர்கள்
  alternative: பொய்ச் சத்தியம் செய்யாதீர்கள்
  rationale: மூல உரை வெறும் பொய்ச் சத்தியத்தை மட்டும் குறிப்பிடாமல், ὅλως என்ற சொல்லால் பரந்த மறுப்பைக் கூறுகிறது. அதன் பயன்பாட்டு வரம்பை மொழிபெயர்ப்பிலேயே குறுக்கவில்லை.
- issue: வானத்தை முன்வைத்துச் சத்தியம் செய்வதற்கான காரணம்
  choice: ஏனெனில் அது கடவுளின் அரியணை
  alternative: அது கடவுளின் அரியணையாக இருப்பதால்
  rationale: இரண்டும் காரணத்தை வெளிப்படுத்தினாலும், தேர்ந்த வடிவம் மூலத்தின் தனித்த காரணவாக்கிய அமைப்பையும் வசனத்தின் உரைநடையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் dignified biblical register பயன்படுத்தப்பட்டுள்ளது. ‘சத்தியம் செய்யுதல்’ என்பது இங்கு உண்மையைச் சொல்வது என்ற பொதுப் பொருளில் அல்ல, ஒன்றை முன்வைத்து உறுதிமொழி செய்வது என்ற பொருளில் உள்ளது. வசனம் அடுத்த வசனத்துடன் தொடர்வதால் இறுதியில் அரைப்புள்ளி வைக்கப்பட்டுள்ளது.
