review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the emphatic contrast ('ஆனால் நான்'), the comprehensive prohibition in μὴ ὀμόσαι ὅλως, and the causal statement that heaven is God's throne. However, ἐν τῷ οὐρανῷ in this oath formula means ‘by heaven,’ not spatially ‘upon heaven.’
  naturalness: ‘வானத்தின்மேல் சத்தியம் செய்யாதீர்கள்’ is potentially spatial and less idiomatic for invoking heaven in an oath. ‘வானத்தின் பேரில் சத்தியம் செய்யாதீர்கள்’ is clear, natural modern standard Tamil for the intended oath formula. The retained semicolon appropriately signals continuation into the following examples.
  terminology: ‘சத்தியம் செய்யாதீர்கள்’ suitably renders the oath-taking sense here, and ‘கடவுளின் அரியணை’ accurately retains the throne image without interpretive expansion.
  issues:
  - severity: medium
    issue: The phrase ‘வானத்தின்மேல்’ is spatially ambiguous.
    rationale: The Greek preposition ἐν occurs in the conventional expression for swearing ‘by’ something. In Tamil, ‘வானத்தின் பேரில்’ idiomatically expresses the invoked basis of an oath, whereas ‘வானத்தின்மேல்’ can suggest physical location or direction.
  revised_text: 'ஆனால் நான் உங்களுக்குச் சொல்கிறேன்: எவ்விதத்திலும் சத்தியம் செய்யாதீர்கள்; வானத்தின் பேரில் சத்தியம் செய்யாதீர்கள், ஏனெனில் அது கடவுளின் அரியணை;'
  revised_footnotes: []
  revision_rationale: A single lexical correction changes the spatially ambiguous ‘வானத்தின்மேல்’ to the idiomatic oath expression ‘வானத்தின் பேரில்.’ The revision otherwise preserves the draft’s source-faithful scope, causal relation, register, and verse-continuing punctuation.
