revisions:
- from: 'ஆனால் நான் உங்களுக்குச் சொல்கிறேன்: எவ்விதத்திலும் சத்தியம் செய்யாதீர்கள்; வானத்தின்மேல் சத்தியம் செய்யாதீர்கள், ஏனெனில் அது கடவுளின் அரியணை;'
  to: 'ஆனால் நான் உங்களுக்குச் சொல்கிறேன்: எவ்விதத்திலும் சத்தியம் செய்யாதீர்கள்; வானத்தின் பேரில் சத்தியம் செய்யாதீர்கள், ஏனெனில் அது கடவுளின் அரியணை;'
