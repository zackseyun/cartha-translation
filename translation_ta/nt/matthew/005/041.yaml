  source_fidelity: மூலத்தின் பொதுநிலையைச் சுட்டும் ὅστις-ஐ «யாராவது» சரியாகத் தருகிறது. ἀγγαρεύσει-இன் அதிகாரப்பூர்வ வலுக்கட்டாய/கட்டாயச் சேவைப் பொருள் «செல்லக் கட்டாயப்படுத்தினால்» என்பதில் இயல்பாகவும் போதுமான துல்லியத்துடனும் உள்ளது. μίλιον ἕν-இன் ஒரு மைல் அளவும், μετ’ αὐτοῦ-இன் உடன்செல்லுதல் கருத்தும், ὕπαγε-இன் ஒருமை கட்டளையும் சரியாகப் பாதுகாக்கப்பட்டுள்ளன. கிரேக்கத்தில் இரண்டாவது இடத்தில் மறைந்திருக்கும் அளவுப்பெயரைத் தமிழின் இயல்புக்காக «இரண்டு மைல் தூரம்» என நிரப்புவது நியாயமானது.
  naturalness: «யாராவது உன்னை ஒரு மைல் தூரம் செல்லக் கட்டாயப்படுத்தினால், அவரோடு இரண்டு மைல் தூரம் செல்» என்பது நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமான வேதாகம உரைநடைக்கு ஏற்றதாகவும் உள்ளது. «மைல் தூரம்» இரு இடங்களிலும் வருவது சிறிது மீளுரைப்போல் தோன்றினாலும், அளவையும் பயணத்தையும் தெளிவுபடுத்துகிறது; திருத்தம் அவசியமில்லை.
  terminology: «கட்டாயப்படுத்துதல்» வலுக்கட்டாயக் கருத்தைச் சரியாகக் கொண்டுள்ளது. «அவரோடு» பொதுவான, பாலினத்தைத் திணிக்காத சுட்டாக இயங்குகிறது. அடிக்குறிப்பு a ரோமக் கட்டாயச் சேவையின் சாத்தியமான வரலாற்றுப் பின்னணியை மட்டும் குறிப்பிடுகிறது; மூலத்தில் இல்லாத படைவீரர் போன்ற குறிப்பை முதன்மை உரையில் சேர்ப்பதில்லை. அடிக்குறிப்பு b கிரேக்கத்தின் நீள்வட்டமான இரண்டாவது அளவைக் குறித்துத் துல்லியமாக விளக்குகிறது.
