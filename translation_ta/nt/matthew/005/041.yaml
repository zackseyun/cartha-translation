  edition: SBLGNT
  text: καὶ ὅστις σε ἀγγαρεύσει μίλιον ἕν, ὕπαγε μετ’ αὐτοῦ δύο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/041.yaml
  text: And whoever forces you to go one mile[c][b][a], go with him two miles.
translation:
  language: ta
  text: யாராவது உன்னை ஒரு மைல் தூரம் செல்லக் கட்டாயப்படுத்தினால்[a], அவரோடு இரண்டு மைல் தூரம் செல்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த வினை, அதிகாரத்தின் பேரில் ஒருவரைக் கட்டாயச் சேவைக்கு உட்படுத்துவதைக் குறிக்கலாம்; ரோம ஆட்சிக்காலத்தில் நிலவிய கட்டாயச் சேவையை இது நினைவூட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “ஒரு மைல் … இரண்டு”; இரண்டாவது இடத்தில் “மைல்” என்பது பொருளில் கொள்ளப்படுகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: யாராவது
  rationale: பொதுவான, வரையறுக்கப்படாத ஒருவரைக் குறிக்கும் உறவுப்பெயரின் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἀγγαρεύσει
  choice: செல்லக் கட்டாயப்படுத்தினால்
  rationale: அதிகாரத்தால் ஒருவரைக் கட்டாயச் சேவைக்கு உட்படுத்தும் வினையின் வலுக்கட்டாயப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது; செல்லும் கருத்து தொலைவு குறிக்கும் தொடரிலிருந்து இயல்பாக வருகிறது.
- source_word: μίλιον ἕν
  choice: ஒரு மைல் தூரம்
  rationale: ரோம மைலைக் குறிக்கும் மூலச்சொல்லையும் எண்ணிக்கையையும் நேரடியாகப் பாதுகாக்கிறது; ‘தூரம்’ என்பது தமிழில் தொடரை இயல்பாக்குகிறது.
- source_word: ὕπαγε
  choice: செல்
  rationale: ஒருமை முன்னிலை கட்டளையின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: μετ’ αὐτοῦ
  choice: அவரோடு
  rationale: உடன்செல்லுதலைக் குறிக்கும் μετά என்பதைக் காட்டுகிறது; பொதுவாகக் குறிப்பிடப்பட்ட நபரை நவீனத் தமிழில் இயல்பாகச் சுட்டுகிறது.
- source_word: δύο
  choice: இரண்டு மைல் தூரம்
  rationale: கிரேக்கத்தில் ‘இரண்டு’ என்று மட்டும் இருந்தாலும், முந்தைய தொடரிலிருந்து புரிந்துகொள்ளப்படும் ‘மைல்’ என்பதைத் தமிழின் இயல்பிற்காக வெளிப்படையாக வழங்குகிறது.
theological_decisions:
- issue: அதிகாரத்தின்கீழ் கட்டாயச் சேவையின் வரலாற்றுச் சமூகப் பின்னணி
  choice: வலுக்கட்டாயமான கோரிக்கையை முதன்மை உரையில் வெளிப்படுத்தி, ரோமப் படைவீரரை வெளிப்படையாகக் குறிப்பிடாமல் விடுதல்
  alternative: இதை ரோமப் படைவீரரின் கட்டாயச் சுமைசுமத்தலாக முதன்மை உரையிலேயே விளக்குதல்
  rationale: ἀγγαρεύω என்ற வினையும் ‘மைல்’ என்ற அளவும் ரோம ஆட்சிக்காலக் கட்டாயச் சேவையை நினைவூட்டுகின்றன; ஆனால் மூலவாக்கியம் படைவீரரை நேரடியாகக் குறிப்பிடவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையானதாயும் கண்ணியமானதாயும் அமைக்கப்பட்டது. ஒருமை கட்டளை ‘செல்’ பாதுகாக்கப்பட்டுள்ளது; பொதுவான நபரைக் குறிக்க பாலினத்தை வலியுறுத்தாத இயல்பான ‘அவரோடு’ பயன்படுத்தப்பட்டுள்ளது.
