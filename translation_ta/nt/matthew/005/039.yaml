id: MAT.5.39
reference: Matthew 5:39
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ἀντιστῆναι τῷ πονηρῷ· ἀλλ’ ὅστις σε ⸀ῥαπίζει ⸀εἰς τὴν δεξιὰν ⸀σιαγόνα, στρέψον αὐτῷ καὶ τὴν ἄλλην·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/039.yaml
  text: But I say to you[a], do not resist the evil person. Instead, if anyone slaps you on the right cheek[b], turn the other to him as well.
translation:
  language: ta
  text: 'ஆனால் நான் உங்களுக்குச் சொல்கிறேன்: தீய மனிதனை எதிர்த்து நிற்காதீர்கள்.[a] மாறாக, யாராவது உங்கள் வலது கன்னத்தில் அறைந்தால், மற்ற கன்னத்தையும் அவன் பக்கம் திருப்புங்கள்.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தீமையை எதிர்த்து நிற்காதீர்கள்’ என்றும், ‘தீயவனை எதிர்த்து நிற்காதீர்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: b
    text: வேறு சொல் வரிசையில், ‘மற்ற கன்னத்தையும் அவனுக்குத் திருப்புங்கள்.’
    reason: previous_rendering
lexical_decisions:
- source_word: μὴ ἀντιστῆναι
  choice: எதிர்த்து நிற்காதீர்கள்
  rationale: ἀνθίστημι என்பதன் ‘எதிர்த்து நிற்றல், எதிர்த்தல்’ என்ற நேரடியான பொருளைப் பாதுகாக்கிறது; இதைச் சட்டரீதியான எதிர்ப்பாகவோ பதிலடியாகவோ மட்டும் குறுக்கவில்லை.
- source_word: τῷ πονηρῷ
  choice: தீமை செய்பவனை
  rationale: கிரேக்கத் தொடர் தீமை, தீய மனிதர், அல்லது தீயவன் எனப் பொருள்படக்கூடியது. அடுத்து அறைகிற மனிதனைப் பற்றிய எடுத்துக்காட்டு வருவதால், பொதுவான மனிதக் குறிப்பாக இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது; பிற வாய்ப்புகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: ῥαπίζει
  choice: அறைந்தால்
  rationale: ῥαπίζω கையால், குறிப்பாகக் கன்னத்தில், அறைவதைக் குறிக்கிறது; ‘அடித்தால்’ என்பதைவிட அவமதிப்பின் நிழற்பொருளையும் சூழலையும் தெளிவாகக் காட்டுகிறது.
- source_word: εἰς τὴν δεξιὰν σιαγόνα
  choice: உன் வலது கன்னத்தில்
  rationale: σιαγών தாடை அல்லது கன்னம் எனப் பொருள்படலாம்; அறைவதைப் பற்றிய இச்சூழலில் ‘கன்னம்’ இயல்பான தமிழ்.
- source_word: στρέψον αὐτῷ καὶ τὴν ἄλλην
  choice: அவனுக்கு மற்ற கன்னத்தையும் திருப்பிக் காட்டு
  rationale: στρέφω என்பதன் ‘திருப்பு’ என்ற வினைப்பொருளைப் பாதுகாத்து, தமிழில் பொருள் தெளிவாக இருக்க ‘காட்டு’ சேர்க்கப்பட்டுள்ளது. ‘மற்றது’ என்பது மற்ற கன்னத்தைக் குறிக்கும் என்பது வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: ὅστις
  choice: எவனாவது
  rationale: நிபந்தனைப் போன்ற இவ்வமைப்பில் உள்ள வரையறுக்கப்படாத தனிப்பட்ட குறிப்பை இயல்பான தமிழில் தருகிறது.
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: ஆனால் நான் உங்களுக்குச் சொல்கிறேன்
  rationale: முந்தைய கூற்றுடன் உள்ள δέ-யின் எதிர்மறைத் தொடர்பையும், இயேசுவின் வலியுறுத்தப்பட்ட ‘நான்’ என்பதையும் பாதுகாக்கிறது.
theological_decisions:
- issue: τῷ πονηρῷ என்பதன் பொருள்
  choice: தீமை செய்பவன் என்ற பொதுவான மனிதக் குறிப்பு
  alternative: தீமை; அல்லது தீயவன்
  rationale: இலக்கண வடிவம் நடுநிலைப் பொருளாகிய ‘தீமை’யையும் ஆண்பால் குறிப்பாகிய ‘தீய மனிதன்/தீயவன்’ என்பதையும் அனுமதிக்கிறது. உடனடியாக வரும் அறைகிற மனிதனைப் பற்றிய எடுத்துக்காட்டு, முதன்மை உரையில் மனிதக் குறிப்பை ஆதரிக்கிறது; எனினும் உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன, தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. தொடக்கத்தில் பன்மை மரியாதை/கூட்டுக் குறிப்பான ‘உங்களுக்குச்… எதிர்த்து நிற்காதீர்கள்’ என்றும், எடுத்துக்காட்டில் கிரேக்கத்தின் ஒருமையைப் பின்பற்றி ‘உன்… காட்டு’ என்றும் வைக்கப்பட்டுள்ளது. ‘மாறாக’ என்பது ἀλλά-வின் வலுவான மாறுபாட்டை இயல்பாக வெளிப்படுத்துகிறது.
