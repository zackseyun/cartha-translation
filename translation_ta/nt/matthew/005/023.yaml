id: MAT.5.23
reference: Matthew 5:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐὰν οὖν προσφέρῃς τὸ δῶρόν σου ἐπὶ τὸ θυσιαστήριον κἀκεῖ μνησθῇς ὅτι ὁ ἀδελφός σου ἔχει τι κατὰ σοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/023.yaml
  text: Therefore, if you are offering your gift on the altar, and there remember that your brother has something against you,
translation:
  language: ta
  text: ஆகவே, நீ உன் காணிக்கையைப் பலிபீடத்தின்மேல் செலுத்தும்போது, உன் சகோதரனுக்கு உன்மேல் ஏதோ குறை இருப்பது அங்கே உன் நினைவுக்கு வந்தால்,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் சகோதரனுக்கோ சகோதரிக்கோ”; கிரேக்கத்தில் ஆண்பால் ஒருமைச் சொல்லான “சகோதரன்” உள்ளது; சூழலில் அது பிரதிநிதித்துவமாகப் பயன்படுத்தப்பட்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: ஆகவே, ... வந்தால்
  rationale: οὖν முந்தைய போதனையிலிருந்து வரும் முடிவை ‘ஆகவே’ எனக் காட்டுகிறது; ἐὰν தொடங்கும் நிபந்தனைத் தொடர் தமிழில் இயல்பாக இறுதியில் ‘வந்தால்’ என்பதால் வெளிப்படுகிறது.
- source_word: προσφέρῃς τὸ δῶρόν σου
  choice: நீ உன் காணிக்கையை ... செலுத்தும்போது
  rationale: προσφέρω இச்சூழலில் பலிபீடத்தில் காணிக்கையைச் செலுத்துவதைக் குறிக்கிறது. நிகழ்ந்துகொண்டிருக்கும் காட்சியை ‘செலுத்தும்போது’ இயல்பாகத் தருகிறது; δῶρον வழிபாட்டுச் சூழலில் ‘காணிக்கை’ எனத் தெளிவாக மொழிபெயர்க்கப்படுகிறது.
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: பலிபீடத்தின்மேல்
  rationale: ἐπί + accusative காணிக்கை பலிபீடத்தின்மேல் வைக்கப்படுவதைக் காட்டக்கூடும்; ‘பலிபீடத்தின்மேல்’ இடவியல் வலிமையைப் பாதுகாக்கிறது.
- source_word: κἀκεῖ μνησθῇς
  choice: அங்கே உன் நினைவுக்கு வந்தால்
  rationale: κἀκεῖயின் இடக் குறிப்பை ‘அங்கே’ காக்கிறது. μνησθῇς என்பதற்கு நவீன தமிழில் ‘உன் நினைவுக்கு வந்தால்’ இயல்பானது; நினைவு தானாக வந்ததா அல்லது தூண்டப்பட்டதா என்பதை இது தீர்மானிப்பதில்லை.
- source_word: ὁ ἀδελφός σου
  choice: உன் சகோதரன்
  rationale: கிரேக்கச் சொல் ஆண்பால் ஒருமையில் உள்ளது. மூல வடிவத்தை முதன்மை உரையில் காத்து, சூழலில் பிரதிநிதித்துவப் பயன்பாடு இருக்கக்கூடும் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: ἔχει τι κατὰ σοῦ
  choice: உன்மேல் ஏதோ குறை இருப்பது
  rationale: இந்த மரபுத்தொடர் ஒருவருக்கு எதிராகக் குறை அல்லது மனக்குறை இருப்பதைக் குறிக்கிறது. τι என்பதன் திட்டமிட்ட வரையறையின்மையை ‘ஏதோ’ காக்கிறது.
theological_decisions:
- issue: ἀδελφός என்ற பாலினம் குறிக்கப்பட்ட உறவுச்சொல்
  choice: உன் சகோதரன்
  alternative: உன் சகோதரனோ சகோதரியோ / சக விசுவாசி
  rationale: மூல கிரேக்கம் ஆண்பால் ஒருமையைப் பயன்படுத்துகிறது. நெறிப்பொருளின் விரிவான பயன்பாட்டை மறுக்காமல், முதன்மை உரையில் மூல வடிவத்தைப் பாதுகாத்து சாத்தியமான பிரதிநிதித்துவப் பயன்பாட்டை அடிக்குறிப்பில் குறிப்பிடுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடை. இந்த வசனம் அடுத்த வசனத்தில் தொடரும் நிபந்தனைத் துணைவாக்கியம் என்பதால் முடிவில் காற்புள்ளி வைக்கப்பட்டுள்ளது. ‘காணிக்கை’, ‘பலிபீடம்’ ஆகியவை வழிபாட்டுச் சூழலைத் தெளிவாகக் காக்கின்றன.
