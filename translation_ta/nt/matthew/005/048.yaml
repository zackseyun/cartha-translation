source:
  edition: SBLGNT
  text: Ἔσεσθε οὖν ὑμεῖς τέλειοι ⸀ὡς ὁ πατὴρ ὑμῶν ὁ ⸀οὐράνιος τέλειός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/048.yaml
  text: You[a], therefore, shall be perfect, as your heavenly Father is perfect.
translation:
  language: ta
  text: ஆகவே, உங்கள் பரலோகத் தந்தை முழுமையானவராக இருப்பதுபோல், நீங்களும் முழுமையானவர்களாக[a] இருப்பீர்களாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நிறைவானவர்களாக,’ ‘முதிர்ச்சியுள்ளவர்களாக,’ அல்லது ‘குறைவற்றவர்களாக’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் முழுமை அல்லது முதிர்ச்சி என்ற பொருளையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔσεσθε
  choice: இருப்பீர்களாக
  rationale: இது வடிவத்தில் எதிர்கால வினையாக இருந்தாலும், இச்சூழலில் கட்டளை அல்லது ஊக்கவுரை வலிமையுடன் வருகிறது. ‘இருப்பீர்களாக’ என்பது அதன் எதிர்கால வடிவத்தையும் மாண்பான அறிவுறுத்தல் தொனியையும் தமிழில் தக்கவைக்கிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வசனங்களில் பகைவர்களையும் நேசிக்க வேண்டும் என்று கூறப்பட்டதிலிருந்து இவ்வசனம் முடிவை எடுத்துரைப்பதை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ὑμεῖς
  choice: நீங்களும்
  rationale: வெளிப்படையாக இடம்பெறும் கிரேக்கப் பதிலிப்பெயரின் வலியுறுத்தலைத் தக்கவைக்கிறது; தந்தையுடன் செய்யப்படும் ஒப்பீட்டில் ‘-உம்’ இயல்பான தமிழ் இணைப்பை அளிக்கிறது.
- source_word: τέλειοι / τέλειός
  choice: நிறைவுள்ளவர்களாக / நிறைவுள்ளவராக
  rationale: τέλειος என்பதன் முழுமை, ஒருமைப்பாடு, முதிர்ச்சி ஆகிய பொருள் பரப்பை ‘நிறைவுள்ள’ இயல்பாகத் தாங்குகிறது. இரு இடங்களிலும் ஒரே சொல்லைப் பயன்படுத்துவது சீடர்களுக்கும் தந்தைக்கும் இடையிலான ஒப்பீட்டின் சொல்லாட்சித் தொடர்பைப் பாதுகாக்கிறது.
- source_word: ὡς
  choice: இருப்பதுபோல
  rationale: தந்தையின் நிறைவுக்கும் சீடர்களுக்கான அழைப்புக்கும் இடையிலான ஒப்பீட்டைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: πατὴρ ὑμῶν ὁ οὐράνιος
  choice: உங்கள் பரலோகத் தந்தை
  rationale: உடைமைத் தொடர்பையும் οὐράνιος என்ற பெயரடையையும் சுருக்கமான, வழக்கிலுள்ள நவீன தமிழில் நேரடியாகக் கொடுக்கிறது.
theological_decisions:
- issue: ஒழுக்க அறிவுறுத்தலில் τέλειος என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘நிறைவுள்ள’ என்று மொழிபெயர்த்து, அதன் பொருள் பரப்பை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: முழுமையான; முதிர்ச்சியுள்ள; குறைவற்ற
  rationale: உடனடிச் சூழலில் (மத் 5:43–47) பகைவர்களையும் உள்ளடக்கும் பிரிவுபடாத, முழுமையான அன்பே முன்னிலைப்படுகிறது. ‘நிறைவுள்ள’ என்பது வசனத்தின் தீவிரமான ஒழுக்க அழைப்பைத் தக்கவைத்தபடியே, இதை தேவனுடன் இயல்பில் சமமாதல் என்றோ ஒரு தனிப்பட்ட கோட்பாட்டின்படியோ கட்டுப்படுத்தாமல் விடுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மாண்பான நடையைப் பயன்படுத்துகிறது. ‘இருப்பீர்களாக’ என்ற வடிவம் சற்று உயர்ந்த நடையாயினும், கிரேக்க எதிர்கால வடிவத்தின் அறிவுறுத்தல் வலிமையை இயல்பாகப் பாதுகாக்கிறது.
