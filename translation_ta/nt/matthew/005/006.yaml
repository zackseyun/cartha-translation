review_pass:
  verdict: revise
  source_fidelity: The draft preserves the beatitude structure, the future passive sense of χορτασθήσονται, and the broad semantic range of δικαιοσύνη. A small adjustment makes the ongoing participial sense of πεινῶντες καὶ διψῶντες more explicit and makes the resulting fulfillment more idiomatic while retaining the hunger-and-thirst imagery.
  naturalness: ‘பசியும் தாகமும் கொண்டிருப்பவர்கள்’ is more natural and clearly durative than ‘பசியும் தாகமும் கொண்டவர்கள்’ in this context. ‘நிறைவுபெறுவார்கள்’ is idiomatic modern Tamil for being filled/satisfied without explicitly supplying God as agent.
  terminology: ‘பேறுபெற்றவர்கள்’ is an appropriate reverent beatitude term. ‘நீதி’ can carry the intended righteousness sense, while the footnote appropriately preserves ‘நியாயம்’ (justice) as an alternative contextual rendering. The footnote wording is lightly clarified to avoid implying that the alternatives are mutually exhaustive definitions.
  issues:
  - severity: low
    issue: The present participles are rendered somewhat statically.
    rationale: ‘பசியும் தாகமும் கொண்டவர்கள்’ can be understood as people who possess hunger and thirst; ‘கொண்டிருப்பவர்கள்’ more clearly conveys the ongoing yearning expressed by πεινῶντες καὶ διψῶντες.
  - severity: low
    issue: The future passive fulfillment can be expressed more idiomatically.
    rationale: ‘நிறைவடைவார்கள்’ is understandable, but ‘நிறைவுபெறுவார்கள்’ more naturally conveys being filled/satisfied in Tamil while retaining the source’s unspecified passive agent.
  revised_text: நீதிக்காகப் பசியும் தாகமும் கொண்டிருப்பவர்கள் பேறுபெற்றவர்கள்; ஏனெனில் அவர்கள் நிறைவுபெறுவார்கள்.
  revised_footnotes:
