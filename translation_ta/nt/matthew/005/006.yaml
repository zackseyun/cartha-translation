id: MAT.5.6
reference: Matthew 5:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μακάριοι οἱ πεινῶντες καὶ διψῶντες τὴν δικαιοσύνην, ὅτι αὐτοὶ χορτασθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/006.yaml
  text: Blessed are those who hunger and thirst for righteousness[a], because they will be filled.
translation:
  language: ta
  text: நீதிக்காகப் பசியும் தாகமும் கொண்டிருப்பவர்கள் பேறுபெற்றவர்கள்; ஏனெனில் அவர்கள் நிறைவுபெறுவார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριοι
  choice: பேறுபெற்றவர்கள்
  rationale: இது வெறும் மனநிலையான ‘மகிழ்ச்சி’யைக் குறிக்காமல், கடவுளிடமிருந்து கிடைக்கும் நற்பேற்றை அறிவிக்கும் வாழ்த்துரையின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: οἱ πεινῶντες καὶ διψῶντες
  choice: பசியும் தாகமும் கொண்டவர்கள்
  rationale: நீதியை ஆழமாகவும் தொடர்ந்து ஏங்கும் நிலையைப் பசி-தாக உருவகங்களுடன் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὴν δικαιοσύνην
  choice: நீதிக்காக
  rationale: δικαιοσύνη என்பதன் ஒழுக்க நேர்மை, நியாயம், கடவுளுக்கு முன் சரியான நிலை ஆகிய பரப்பை ‘நீதி’ சுருக்கமாகத் தாங்குகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முன்னுள்ள பேறுபெற்ற நிலைக்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: αὐτοὶ
  choice: அவர்கள்
  rationale: கிரேக்கத்தில் உள்ள வலியுறுத்தலைத் தமிழில் இயல்பான எழுவாயாகக் காக்கிறது; ‘அவர்களே’ என்பது இங்கு தேவையற்ற அளவு கனமாக இருக்கக்கூடும்.
- source_word: χορτασθήσονται
  choice: நிறைவடைவார்கள்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தையும் பசி-தாக உருவகத்தின் திருப்தி/நிறைவு கருத்தையும் காக்கிறது; செய்பவர் கடவுள் என்பதைக் கிரேக்கத்தைப் போல வெளிப்படையாகச் சேர்க்கவில்லை.
theological_decisions:
- issue: δικαιοσύνη என்பதன் பொருள்
  choice: நீதி
  alternative: நியாயம்; கடவுளுக்கு முன் சரியானது
  rationale: இச்சொல் தனிப்பட்ட ஒழுக்க நேர்மையை மட்டும் அல்லாமல், நியாயமும் கடவுளுடைய சித்தத்திற்கேற்ற சரியான ஒழுங்கும் ஆகியவற்றையும் குறிக்க முடியும். முதன்மை உரை பரந்த ‘நீதி’ என்பதைப் பயன்படுத்தி, உண்மையான பொருள் அகலத்தை அடிக்குறிப்பில் காக்கிறது.
- issue: χορτασθήσονται என்ற இறைச் செயப்பாட்டு
  choice: அவர்கள் நிறைவடைவார்கள்
  alternative: கடவுள் அவர்களை நிறைவாக்குவார்
  rationale: கிரேக்க உரை செய்பவரைப் பெயரிட்டு சொல்லவில்லை; அது கடவுளைக் குறிக்கும் செயப்பாடாகப் புரிந்துகொள்ளப்படலாம். மொழிபெயர்ப்பு அந்த மறைமுகத்தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், எளிதில் புரியும் அதேவேளை மரியாதையும் செய்யுள் நயமும் கொண்ட வாழ்த்துரை நடை. ‘பேறுபெற்றவர்கள்’ என்பது ‘மகிழ்ச்சியுள்ளவர்கள்’ என்பதைக் காட்டிலும் மூலத்தின் மதச்சார்ந்த அறிவிப்பு வலிமையைச் சிறப்பாகக் காக்கிறது.
