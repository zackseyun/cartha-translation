    text: அல்லது, “நியாயத்திற்காக.” கிரேக்கச் சொல் ஒழுக்க நேர்மை, நியாயம், அல்லது கடவுளுக்கு முன் சரியானது என்பதைக் குறிக்கலாம்.
    reason: alternative_reading
  revision_rationale: The revision retains the draft’s faithful theological and literary choices while improving the ongoing force of the Greek participles and the naturalness of the future passive result. The alternative sense ‘justice’ remains available through the footnote, without narrowing δικαιοσύνη to only personal morality or only social justice.
