revisions:
- from: நீதிக்காக[a] பசியும் தாகமும் கொண்டவர்கள் பேறுபெற்றவர்கள்; ஏனெனில் அவர்கள் நிறைவடைவார்கள்.
  to: நீதிக்காகப் பசியும் தாகமும் கொண்டிருப்பவர்கள் பேறுபெற்றவர்கள்; ஏனெனில் அவர்கள் நிறைவுபெறுவார்கள்.
  rationale: The revision retains the draft’s faithful theological and literary choices while improving the ongoing force of the Greek participles and the naturalness of the future passive result. The alternative sense ‘justice’ remains available through the footnote, without narrowing δικαιοσύνη to only personal morality or only social justice.
