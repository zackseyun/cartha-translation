  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος· καὶ καθίσαντος αὐτοῦ προσῆλθαν αὐτῷ οἱ μαθηταὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/001.yaml
  text: Seeing the crowds[a], he went up the mountain; and when he sat down[c][b], his disciples came to him.
translation:
  language: ta
  text: மக்கள் கூட்டங்களைக் கண்டு[a], அவர் மலைக்கு ஏறிச் சென்றார்[b]. அவர் அமர்ந்தபோது[c], அவருடைய சீடர்கள் அவரிடம் வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மக்கள் கூட்டங்களைக் கண்டபோது.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர் மலையின்மேல் ஏறிச் சென்றார்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அவர் அமர்ந்த பிறகு.” கிரேக்க மொழியில் இங்கு ஜெனிட்டிவ் அப்சல்யூட் எனப்படும் இலக்கண அமைப்பு உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν
  choice: கண்டு
  rationale: ὁράω என்பதன் இறந்தகால வினையெச்ச வடிவம்; முதன்மைச் செயலுக்கான சூழலைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது. கால உறவை அளவுக்கு மீறித் துல்லியப்படுத்தவில்லை.
- source_word: δὲ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது மென்மையான உரைத் தொடர்ச்சி இடைச்சொல். ‘ஆனால்’ அல்லது ‘இப்போது’ என்று மொழிபெயர்த்தால் மூலத்தில் இல்லாத அழுத்தம் ஏற்படும்.
- source_word: τοὺς ὄχλους
  choice: மக்கள் கூட்டங்களை
  rationale: ὄχλους பன்மை வடிவம் என்பதால் ‘கூட்டம்’ என்ற ஒருமைக்குப் பதிலாகப் பன்மை பாதுகாக்கப்படுகிறது; ‘மக்கள்’ என்பது பொருளைத் தெளிவாக்குகிறது.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: மலையின் மேல் ஏறிச் சென்றார்
  rationale: மேல்நோக்கிய நகர்வையும் மலைப்பகுதியை அடைவதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; மலையின் உச்சிவரை ஏறினார் என்று கட்டாயப்படுத்தவில்லை.
- source_word: τὸ ὄρος
  choice: மலை
  rationale: ὄρος என்பதற்கான நேரான பொருள் ‘மலை’; கிரேக்க வரையறைச் சுட்டைத் தமிழில் இயல்பாக ‘மலையின்’ என்ற வடிவம் பிரதிபலிக்கிறது.
- source_word: καὶ καθίσαντος αὐτοῦ
  choice: அவர் அமர்ந்தபோது
  rationale: Genitive absolute அமைப்பின் காலச்சூழலை இயல்பாகத் தருகிறது; கண்டிப்பான ‘அமர்ந்த பிறகு’ என்ற வரிசையைத் திணிக்கவில்லை.
- source_word: προσῆλθαν αὐτῷ
  choice: அவரிடம் வந்தார்கள்
  rationale: προσέρχομαι என்பதன் ‘ஒருவரிடம் வருதல்/நெருங்குதல்’ என்ற பொருளை எளிய நவீன தமிழில் தருகிறது.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: அவருடைய சீடர்கள்
  rationale: ஆசிரியரைப் பின்பற்றிக் கற்கும் μαθηταί என்பவர்களுக்கான நிலையான, துல்லியமான தமிழ்ச் சொல் ‘சீடர்கள்’.
theological_decisions:
- issue: τὸ ὄρος என்பதில் உள்ள வரையறைச் சுட்டு
  choice: மலையின் மேல்
  alternative: ஒரு மலையின் மேல் / மலைச்சரிவில்
  rationale: மூலத்தில் வரையறைச் சுட்டு இருப்பதால் அதை முற்றிலும் பொதுமைப்படுத்தாமல் பாதுகாக்கிறது; அதேவேளையில் இது பெயரிடப்பட்ட குறிப்பிட்ட மலை என்று விளக்கத்தைத் திணிக்கவில்லை.
- issue: καθίσαντος αὐτοῦ என்பதன் நிகழ்வுக் கால உறவு
  choice: அவர் அமர்ந்தபோது
  alternative: அவர் அமர்ந்த பிறகு
  rationale: அமர்தலும் சீடர்கள் வருதலும் இடையிலான காலச்சூழலைக் காட்டுகிறது; கடுமையான தொடர்வரிசையையோ அமர்ந்து போதிக்கும் முறை குறித்த கூடுதல் இறையியல் பொருளையோ சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘கூட்டங்கள்’ என்ற பன்மையும், அமர்ந்த நிகழ்வின் காலத் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
