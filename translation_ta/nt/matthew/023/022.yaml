reference: Matthew 23:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὁ ὀμόσας ἐν τῷ οὐρανῷ ὀμνύει ἐν τῷ θρόνῳ τοῦ θεοῦ καὶ ἐν τῷ καθημένῳ ἐπάνω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/022.yaml
  text: And whoever swears by heaven swears by the throne of God and by the one seated upon it[a].
translation:
  language: ta
  text: பரலோகத்தின் பேரில் சத்தியம் செய்கிறவர், கடவுளுடைய அரியணையின் பேரிலும் அதில் அமர்ந்திருப்பவரின் பேரிலும்[a] சத்தியம் செய்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதில் உட்கார்ந்திருப்பவரின் பேரிலும்.’
    reason: καθημένῳ என்பதற்கு ‘அமர்ந்திருப்பவர்’ என்பதற்குப் பதிலாகத் தரக்கூடிய இயல்பான சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: ஆணையிடுகிறவர்
  rationale: இறந்தகால வடிவமுடைய பெயரெச்சம் இங்கு பொதுவான நபரைக் குறிக்கிறது; ஆகவே தமிழில் பொதுநிலையை இயல்பாக வெளிப்படுத்தும் நிகழ்கால வடிவம் பயன்படுத்தப்பட்டது.
- source_word: ἐν
  choice: -ன்மேல்
  rationale: ஆணைச் சூத்திரத்தில் ἐν இடப்பொருளை அல்ல, எதன்மேல் ஆணையிடப்படுகிறது என்பதைக் குறிக்கிறது; தமிழில் ‘மேல் ஆணையிடுதல்’ இயல்பான சொல்லாட்சி.
- source_word: οὐρανῷ
  choice: பரலோகம்
  rationale: கடவுளுடைய அரியணையோடு உடனடியாக இணைக்கப்படுவதால், இங்கு வெறும் வானம் அல்ல, கடவுளின் வாசஸ்தலமாகக் கருதப்படும் பரலோகம் குறிக்கப்படுகிறது.
- source_word: ὀμνύει
  choice: ஆணையிடுகிறார்
  rationale: நிகழ்கால வினை பொதுவான உண்மையைத் தெரிவிக்கிறது; மரியாதை ஒருமை வடிவம் நவீனத் தமிழில் இயல்பாக உள்ளது.
- source_word: θρόνῳ τοῦ θεοῦ
  choice: கடவுளுடைய அரியணை
  rationale: மூலத்தின் உரிமைத் தொடர்பையும் கண்ணியமான நடையையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: τῷ καθημένῳ
  choice: அமர்ந்திருப்பவர்
  rationale: அரியணையில் அமர்ந்திருக்கும் நபரைக் குறிக்கும் நிகழ்காலப் பெயரெச்சத்தின் தொடர்ச்சியான நிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐπάνω αὐτοῦ
  choice: அதில்
  rationale: சுட்டுப்பெயர் அரியணையைத் திரும்பச் சுட்டுகிறது; அரியணையிலிருந்து தனியே மேலே இருப்பதாகத் தவறாகப் புரிந்துகொள்ளாமல், அதன்மேல் அமர்ந்திருப்பதைத் தமிழில் இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: ‘அதில் அமர்ந்திருப்பவர்’ என்பதன் குறிப்பு
  choice: பரலோக அரியணையில் வீற்றிருக்கும் கடவுளைக் குறிக்கும் மரியாதையான மறைமுகக் குறிப்பு
  alternative: அங்கு அமர்ந்திருக்கும் அடையாளம் வெளிப்படையாகக் கூறப்படாத ஒருவர்
  rationale: ‘கடவுளுடைய அரியணை’ என்ற உடனடியான சூழல் குறிப்பைத் தெளிவாக்குகிறது. ஆயினும் மூலத்தில் உள்ள மறைமுகச் சொல்லாட்சியை ‘கடவுள்’ என்று மாற்றாமல் மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பான, கண்ணியமான நடை. ‘ஆணையிடுதல்,’ ‘பரலோகம்,’ ‘அரியணை’ ஆகியவை சமயச் சூழலுக்கேற்ற பரவலான சொற்கள். மூலத்தின் இணை அமைப்பும் இறையியல் மறைமுகக் குறிப்பும் பாதுகாக்கப்பட்டுள்ளன.
