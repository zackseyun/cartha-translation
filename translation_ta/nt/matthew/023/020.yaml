source:
  edition: SBLGNT
  text: ὁ οὖν ὀμόσας ἐν τῷ θυσιαστηρίῳ ὀμνύει ἐν αὐτῷ καὶ ἐν πᾶσι τοῖς ἐπάνω αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/020.yaml
  text: Therefore[a], the one who swears by the altar swears by it and by everything on it.
translation:
  language: ta
  text: ஆகையால், பலிபீடத்தின் பேரில் சத்தியம் செய்கிறவர், அதன் பேரிலும் அதன் மேல் உள்ள எல்லாவற்றின் பேரிலும் சத்தியம் செய்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதன் மேல் உள்ள அனைத்தின் பேரிலும்.” கிரேக்கச் சொற்றொடர் ஒரு காணிக்கையை மட்டும் அல்லாமல், பலிபீடத்தின்மேல் வைக்கப்பட்டுள்ள எல்லாவற்றையும் குறிக்கலாம்.
    reason: மூலத்தின் பொதுவான குறிப்பைத் தெளிவுபடுத்தி, ஆங்கில ஆய்வுத் தடத்தின் சொற்பொருள் மாற்றுவாசிப்பைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: ὁ οὖν ὀμόσας
  choice: ஆகவே, ... ஆணையிடுகிறவர்
  rationale: οὖν முந்தைய வாதத்திலிருந்து வரும் முடிவைச் சுட்டுவதால் ‘ஆகவே’ என்று மொழிபெயர்க்கப்பட்டது. பெயர்ச்சொல்லாகச் செயல்படும் இறந்தகாலப் பங்கேற்புவினை பொதுவான ஒருவரைக் குறிப்பதால், இயல்பான தமிழ் பொதுநிகழ்காலத்தில் ‘ஆணையிடுகிறவர்’ என வழங்கப்பட்டது.
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: பலிபீடத்தின்மேல்
  rationale: ὀμνύω உடன் வரும் ἐν இங்கு இடப்பொருளைக் காட்டாமல், எதன்மேல் ஆணையிடப்படுகிறது என்பதைக் காட்டும் உறுதிமொழி வழக்காகும். θυσιαστήριον என்பதற்கு ‘பலிபீடம்’ பொருத்தமான நவீனத் தமிழ் சொல்.
- source_word: ὀμνύει
  choice: ஆணையிடுகிறார்
  rationale: வாக்கியம் பொதுவான கோட்பாட்டைக் கூறுவதால் தமிழ் நிகழ்காலம் பயன்படுத்தப்பட்டது. ‘ஆணையிடு’ என்பது சத்திய உறுதிமொழியின் பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἐν αὐτῷ
  choice: அதன்மேலும்
  rationale: αὐτῷ பலிபீடத்தையே மீண்டும் குறிக்கிறது. உறுதிமொழிச் சூழலில் ἐν என்பதற்கு ‘-ன்மேல்’ என்ற தமிழ் வடிவம் இயல்பானது.
- source_word: καὶ ἐν πᾶσι τοῖς ἐπάνω αὐτοῦ
  choice: அதன்மேல் உள்ள அனைத்தின்மேலும்
  rationale: πᾶσι τοῖς ἐπάνω αὐτοῦ என்பது பலிபீடத்தின்மேல் உள்ள அனைத்தையும் பொதுவாகக் குறிக்கிறது. மூலத்தில் இல்லாத ‘காணிக்கைகள்’ என்ற வரம்பைச் சேர்க்காமல் அதன் விரிவைத் தக்கவைக்கிறது.
theological_decisions:
- issue: பலிபீடத்தின்மேல் உள்ள அனைத்தின் குறிப்பு
  choice: பலிபீடத்தின்மேல் உள்ள அனைத்தையும் பொதுவாகக் குறித்தல்
  alternative: அதற்கு மேலே உள்ள அனைத்தும்; அதன்மேல் உள்ள எல்லாக் காணிக்கைகளும்
  rationale: உடனடிச் சூழலில் காணிக்கை குறிப்பிடப்பட்டாலும், இவ்வசனத்தின் கிரேக்கச் சொற்றொடர் அதைவிட விரிவானது. எனவே மொழிபெயர்ப்பு அதை ‘காணிக்கைகள்’ என்று குறுக்காமல், மூலத்தின் பொதுத்தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை. ‘பலிபீடம்’ மற்றும் ‘ஆணையிடு’ ஆகியவை வேதாகமச் சூழலுக்கேற்ற தெளிவான சொற்கள். தேவையற்ற அடிக்குறிப்பு சேர்க்கப்படவில்லை; ஆங்கில அடிக்குறிப்பு குறி உரையில் தவறாக இடப்பட்டதாகத் தெரிகிறது, மேலும் அதன் தகவல் தமிழின் ‘அனைத்தின்மேலும்’ என்பதிலேயே நேரடியாகப் பாதுகாக்கப்பட்டுள்ளது.
