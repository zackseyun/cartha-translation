  to: எருசலேமே, எருசலேமே, தீர்க்கதரிசிகளைக் கொல்கிறவளே, உன்னிடம் அனுப்பப்பட்டவர்களைக் கல்லெறிகிறவளே, ஒரு கோழி[b] தன் குஞ்சுகளைத் தன் சிறகுகளின் கீழ் கூட்டிச் சேர்ப்பதுபோல, உன் பிள்ளைகளை ஒன்றாகக் கூட்டிச் சேர்க்க நான் எத்தனை முறை விரும்பினேன்; ஆனால் நீங்களோ விரும்பவில்லை?
  rationale: கல்லெறிதலுடன் ‘கொலை’ என்ற விளைவை இணைத்திருந்த கூடுதலான பொருள் அகற்றப்பட்டுள்ளது. கிரேக்கத்தின் ஒரே கேள்வி-புலம்பல் அமைப்பைத் தமிழில் மீட்டமைத்துள்ளோம். ὄρνις என்பதற்கு சூழல்சார் ‘கோழி’யை வைத்துக்கொண்டு, அதன் விரிவான சொற்பொருள் சாத்தியத்தை அடிக்குறிப்பில் பாதுகாத்துள்ளோம்.
