id: MAT.23.37
reference: Matthew 23:37
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἰερουσαλὴμ Ἰερουσαλήμ, ἡ ⸀ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν— ποσάκις ἠθέλησα ἐπισυναγαγεῖν τὰ τέκνα σου, ὃν τρόπον ⸂ὄρνις ἐπισυνάγει⸃ τὰ νοσσία ⸀αὐτῆς ὑπὸ τὰς πτέρυγας, καὶ οὐκ ἠθελήσατε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/037.yaml
  text: Jerusalem[a], Jerusalem, the one who kills the prophets and stones those sent to her—how often I wanted to gather your children together, the way a hen gathers her chicks under her wings[b], and you were not willing!
translation:
  language: ta
  text: எருசலேமே, எருசலேமே, தீர்க்கதரிசிகளைக் கொல்கிறவளே, உன்னிடம் அனுப்பப்பட்டவர்களைக் கல்லெறிகிறவளே, ஒரு கோழி[b] தன் குஞ்சுகளைத் தன் சிறகுகளின் கீழ் கூட்டிச் சேர்ப்பதுபோல, உன் பிள்ளைகளை ஒன்றாகக் கூட்டிச் சேர்க்க நான் எத்தனை முறை விரும்பினேன்; ஆனால் நீங்களோ விரும்பவில்லை?
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘கோழி’ என்று மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொல் பொதுவாக ‘பறவை’ என்றும் பொருள்படலாம்; ஆனால் குஞ்சுகளைச் சிறகுகளின் கீழ் கூட்டிச் சேர்க்கும் சூழல் பெட்டைக்கோழியைக் குறிப்பதாகத் தோன்றுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰερουσαλὴμ Ἰερουσαλήμ
  choice: எருசலேமே, எருசலேமே
  rationale: விளிப்பையும் புலம்பலின் அழுத்தத்தையும் காட்டும் இருமுறை அழைப்பைத் தக்கவைக்கிறது.
- source_word: ἡ ἀποκτείνουσα τοὺς προφήτας
  choice: தீர்க்கதரிசிகளைக் கொன்று ... கொல்கிறவளே
  rationale: நகரம் பெண்பாலில் உருவகப்படுத்தப்படுவதையும், நிகழ்காலப் பங்கேற்புச் சொல்லின் வழக்கமான குணச்சித்திர வலிமையையும் இயல்பான தமிழில் தருகிறது.
- source_word: λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν
  choice: உன்னிடம் அனுப்பப்பட்டவர்களைக் கல்லெறிந்து கொல்கிறவளே
  rationale: λιθοβολέω என்பதன் தண்டனை/கொலைச் சூழலைத் தெளிவுபடுத்தி, அனுப்பப்பட்டவர்கள் என்ற இறந்தகாலச் செயப்பாட்டு வடிவத்தையும் காக்கிறது.
- source_word: ποσάκις ἠθέλησα
  choice: நான் எத்தனை முறை விரும்பினேன்
  rationale: அடிக்கடி ஏற்பட்ட உண்மையான விருப்பத்தை இயல்பாகக் காட்டுகிறது; அதற்கு மேலான கோட்பாட்டுப் பொருளைச் சேர்க்கவில்லை.
- source_word: ἐπισυναγαγεῖν τὰ τέκνα σου
  choice: உன் பிள்ளைகளை ஒன்றாகக் கூட்டிச் சேர்க்க
  rationale: கூட்டிச் சேர்த்தல் என்ற கூட்டு வினையின் வலிமையையும், நகரத்தின் ‘பிள்ளைகள்’ என்ற உருவகத்தையும் பாதுகாக்கிறது.
- source_word: ὄρνις ... τὰ νοσσία αὐτῆς
  choice: ஒரு கோழி தன் குஞ்சுகளை
  rationale: ὄρνις பொதுவாகப் பறவையைக் குறிக்கக்கூடியதாயினும், தன் குஞ்சுகளைச் சிறகுகளின்கீழ் சேர்க்கும் தாய்ப்பறவைச் சூழலில் ‘கோழி’ இயல்பான குறிப்பிட்ட பொருள்.
- source_word: καὶ οὐκ ἠθελήσατε
  choice: ஆனால் நீங்களோ விரும்பவில்லை
  rationale: பன்மை வினை வடிவத்தை ‘நீங்கள்’ என்று வெளிப்படுத்தி, இயேசுவின் விருப்பத்துக்கும் எருசலேமின் மக்களுடைய விருப்பமின்மைக்கும் உள்ள முரண்பாட்டைத் தக்கவைக்கிறது.
theological_decisions:
- issue: இயேசுவின் விருப்பமும் எருசலேமின் விருப்பமின்மையும்
  choice: இரு θέλω வடிவங்களையும் ‘விரும்பினேன் / விரும்பவில்லை’ என்று ஒரே விருப்ப மொழியில் தருதல்
  alternative: ‘தீர்மானித்தேன்’ போன்ற வலுவான நிர்ணய மொழியைப் பயன்படுத்துதல், அல்லது இதை வெறும் உணர்ச்சிப்பூர்வ ஏக்கமாகப் பொழிப்புரை செய்தல்
  rationale: மூலவசனம் முன்வைக்கும் விருப்பங்களின் உண்மையான முரண்பாட்டைத் தீர்க்காமல் பாதுகாக்கிறது.
- issue: ஒருமை நகர அழைப்பிலிருந்து பன்மை மறுப்பிற்கு மாறுதல்
  choice: ‘உன் பிள்ளைகள்’ என்றும் ‘நீங்களோ விரும்பவில்லை’ என்றும் இலக்கண மாற்றத்தை வெளிப்படையாக வைத்தல்
  alternative: இரண்டையும் ஒருமையாகச் சமப்படுத்தி ‘நீ விரும்பவில்லை’ என்று மொழிபெயர்த்தல்
  rationale: ἠθελήσατε பன்மை என்பதால், உருவகப்படுத்தப்பட்ட நகரத்தின் பின்னால் உள்ள மக்களை நோக்கிய மாறுதலைத் தமிழ் வாசகர் காண உதவுகிறது.
- issue: ‘உன் பிள்ளைகள்’ என்போரின் அடையாளம்
  choice: உன் பிள்ளைகள்
  alternative: உன் மக்கள் அல்லது உன் குடியிருப்போர்
  rationale: உருவகத்தைப் பாதுகாத்து, குறிப்பிட்ட ஒரு துணைக்குழுவாகச் சுருக்குவதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதைமிக்க புலம்பல் நடையைப் பயன்படுத்துகிறது. ‘எருசலேமே’ என்ற விளிப்பும், ‘கொல்கிறவளே’ என்ற பெண்பால் உருவகமும் நகரத்தை நேரடியாக அழைக்கும் கிரேக்க அமைப்பைப் பாதுகாக்கின்றன. பன்மையான ‘நீங்களோ’ என்பது மூலத்தின் இலக்கணத் திருப்பத்தைத் தெளிவாக்குகிறது.
