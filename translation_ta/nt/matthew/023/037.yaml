  source_fidelity: திருத்தம் தேவை. λιθοβολέω என்பதன் அடிப்படைப் பொருள் ‘கல்லெறிதல்’; ‘கல்லெறிந்து கொல்கிற’ என்பது மூலத்தில் வெளிப்படையாகச் சொல்லப்படாத கொலை விளைவைச் சேர்க்கிறது. மேலும், முழு வாக்கியமும் கிரேக்கத்தில் கேள்வி வடிவிலான புலம்பலாக உள்ளது; அது தமிழிலும் கேள்விக்குறியுடன் அமைய வேண்டும்.
  naturalness: ‘கொல்கிறவளே’ மற்றும் ‘கல்லெறிகிறவளே’ என்ற இணையான விளிப்புகள் நவீன பொதுத்தமிழில் தெளிவாகவும் புலம்பல் நடைக்கு ஏற்றதாகவும் உள்ளன. ஒருமை நகர-விளிப்பிலிருந்து இறுதியில் பன்மை ‘நீங்களோ’ என்பதற்கான மாற்றமும் இயல்பாகத் தெளிவாகிறது.
  terminology: ‘தீர்க்கதரிசிகள்,’ ‘அனுப்பப்பட்டவர்கள்,’ ‘பிள்ளைகள்,’ ‘கூட்டிச் சேர்க்க,’ மற்றும் ‘விரும்பினேன் / விரும்பவில்லை’ ஆகியவை மூலத்தின் பொருளையும் இறையியல் பதற்றத்தையும் காக்கின்றன. ὄρνις-ன் பொதுப்பறவைச் சாத்தியத்தைச் சுட்டும் குறிப்புடன் ‘கோழி’ சூழலுக்கு ஏற்றது.
  issues:
