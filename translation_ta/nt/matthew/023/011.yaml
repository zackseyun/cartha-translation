source:
  edition: SBLGNT
  text: ὁ δὲ μείζων ὑμῶν ἔσται ὑμῶν διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/011.yaml
  text: But the greatest among you will be your servant[a].
translation:
  language: ta
  text: ஆனால், உங்களில் மிகப் பெரியவர் உங்களுக்குச் சேவை செய்பவராக இருப்பார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல் நெருக்கமாக, ‘உங்களில் பெரியவராக இருப்பவர் உங்களுக்குச் சேவை செய்பவராக இருப்பார்.’ கிரேக்க மொழியின் ஒப்பீட்டுப் படிவம் இங்கு குழுவினருள் மிக உயர்ந்த நிலையில் இருப்பவரைக் குறிக்கும்படியும் பயன்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μείζων
  choice: மிகப் பெரியவர்
  rationale: μέγας என்பதன் ஒப்பீட்டுப் படிவமான μείζων இங்கு குழுவினருள் உயர்ந்தவரைக் குறிக்கும் உயர்படிப் பொருளில் இயல்பாகப் பயன்படுகிறது. ‘மிகப் பெரியவர்’ என்பது நவீன தமிழில் அந்த நிலைமையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ὑμῶν (முதல் இடம்)
  choice: உங்களில்
  rationale: முதல் ὑμῶν பகுதிப்பொருள் உடையது; உரையாடப்படுகிற குழுவினருள் ஒருவரைச் சுட்டுவதால் ‘உங்களில்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ἔσται
  choice: இருப்பார்
  rationale: εἰμί என்பதன் எதிர்கால வடிவத்தை இயல்பான நவீன தமிழில் ‘இருப்பார்’ என வழங்குகிறது.
- source_word: ὑμῶν (இரண்டாம் இடம்)
  choice: உங்களுக்கு
  rationale: διάκονος உடனான உறவைத் தமிழில் இயல்பாகக் காட்ட ‘உங்களுக்குப் பணிவிடை செய்பவர்’ என்ற அமைப்பு பயன்படுத்தப்பட்டது.
- source_word: διάκονος
  choice: பணிவிடை செய்பவர்
  rationale: இச்சூழலில் இது திருச்சபைப் பதவியைக் குறிக்காமல் பிறருக்குச் சேவை செய்பவரைக் குறிக்கிறது. ‘பணிவிடை செய்பவர்’ சேவையின் தாழ்மையான தன்மையைத் தெளிவாக்குகிறது; ‘திருத்தொண்டர்’ போன்ற சொற்கள் தேவையற்ற பதவிப் பொருளை ஏற்படுத்தலாம்.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனங்களில் கண்ட பதவி மற்றும் பெருமை நாடுதலுக்கு மாறான கருத்தை δέ அறிமுகப்படுத்துவதால் ‘ஆனால்’ பொருத்தமானது.
theological_decisions:
- issue: பெருமைக்கும் பணிவிடைக்கும் இடையிலான நிலைமாற்றம்
  choice: ‘உங்களில் மிகப் பெரியவர் உங்களுக்குப் பணிவிடை செய்பவராக இருப்பார்’ என்று வழங்குதல்
  alternative: ‘உங்களில் பெரியவர் உங்கள் ஊழியராக இருப்பார்’
  rationale: இயேசுவின் கூற்று உண்மையான பெருமையைப் பிறருக்குச் செய்யும் பணிவிடையோடு இணைக்கிறது. திருச்சபைப் பதவி சார்ந்த பொருளைச் சேர்க்காமல், சமூக நிலைமாற்றத்தின் கூர்மையையும் இறையியல் அழுத்தத்தையும் இம்மொழியாக்கம் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘ஊழியர்’ அல்லது ‘திருத்தொண்டர்’ எனப் பதவிசார் பொருள் தோன்றுவதைத் தவிர்த்து, பிறருக்குப் பணிவிடை செய்வது என்ற சூழல்சார் பொருள் முன்னிறுத்தப்பட்டது.
