  text: καὶ τοὺς ἀσπασμοὺς ἐν ταῖς ἀγοραῖς καὶ καλεῖσθαι ὑπὸ τῶν ἀνθρώπων· ⸀Ῥαββί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/007.yaml
  text: and greetings in the marketplaces, and to be called by men, ‘Rabbi.’
translation:
  language: ta
  text: சந்தைகளில் வாழ்த்துகளைப் பெறுவதையும், மக்களால் ‘ரபீ’ என்று அழைக்கப்படுவதையும் விரும்புகிறார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπασμούς
  choice: வணக்கம் செலுத்துவது
  rationale: பொது இடங்களில் மரியாதையுடன் வாழ்த்தப்படுவதைக் குறிக்கும் இயல்பான நவீனத் தமிழ் நடை.
- source_word: ἀγοραῖς
  choice: சந்தைகளில்
  rationale: அக்காலத்தின் பொதுக் கூடுகை மற்றும் வணிக இடங்களைக் குறிக்கும் நேரடியான மொழிபெயர்ப்பு.
- source_word: ὑπὸ τῶν ἀνθρώπων
  choice: மக்கள்
  rationale: ἄνθρωποι இங்கு மனிதர்களை பொதுவாகக் குறிக்கிறது; பாலினத்தைத் தேவையின்றி வரையறுக்காமல் ‘மக்கள்’ என வழங்கப்படுகிறது.
- source_word: Ῥαββί
  choice: ரபீ
  rationale: யூத மரியாதைப் பட்டத்தை ஒலிபெயர்த்து, அதன் வரலாற்று மற்றும் சமயச் சூழலைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘ரபீ’ என்ற பட்டத்தின் பொருள்
  choice: பட்டத்தை ‘ரபீ’ என்று ஒலிபெயர்த்தல்
  alternative: ‘போதகரே’ அல்லது ‘ஆசிரியரே’ என்று பொருளாக்குதல்
  rationale: மூலத்தின் குறிப்பிட்ட யூதப் பட்டத்தையும் அடுத்த வசனத்துடனான சொல் தொடர்பையும் பாதுகாக்கிறது.
translation_notes:
  register: மத்தேயு 23:6-இல் தொடங்கும் வாக்கியத்தின் தொடர்ச்சியாகவும், சாதாரண நவீன வாசகர்களுக்கு இயல்பாகவும் அமைக்கப்பட்டுள்ளது. ‘விரும்புகிறார்கள்’ என்பது முந்தைய வசனத்தில் உள்ள முக்கிய வினையின் தொடர்ச்சியைத் தெளிவாக்குகிறது.
