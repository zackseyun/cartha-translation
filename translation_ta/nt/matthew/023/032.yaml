  source_fidelity: முதன்மை உரை καὶ ὑμεῖς πληρώσατε τὸ μέτρον τῶν πατέρων ὑμῶν என்பதன் இணைப்பையும், வலியுறுத்தப்பட்ட பன்மை முன்னிலையையும், இரண்டாம் நபர் பன்மை கட்டளையான πληρώσατε-யையும், ‘அளவு’ உருவகத்தையும், ‘தந்தையர்’ என்ற நேரடிச் சொல்லையும் தக்கவைக்கிறது. ‘நிரப்புங்கள்’ கட்டளை வடிவமும் சூழலிலுள்ள கிண்டல்/தீர்ப்புத் தொனியை விளக்கிக் கரைக்காமல் விடுகிறது.
  naturalness: “நீங்களும் உங்கள் தந்தையரின் அளவை நிரப்புங்கள்” என்பது நவீன நிலையான தமிழில் சுருக்கமாகவும் கண்ணியமான கண்டனத் தொனியுடனும் இயங்குகிறது. ‘தந்தையரின் அளவை’ என்பது நோக்கமுள்ள உருவகச் சொல்லாட்சி; அதை விளக்கவுரையாக மாற்றாமல் வைத்திருப்பது ஏற்றது.
