  text: And you[a], fill up the measure of your fathers.
translation:
  language: ta
  text: நீங்களும் உங்கள் தந்தையரின் அளவை நிரப்புங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் தந்தையரின் பாவங்களின் முழு அளவையும் நிறைவாக்குங்கள்.” கிரேக்கத்தில் சொல்லுக்கு சொல், “உங்கள் தந்தையரின் அளவை நிரப்புங்கள்”; குற்றம் குவிந்து அதன் வரம்பை எட்டுவதை இது உருவகமாகக் கூறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: -உம்
  rationale: கிரேக்க இணைப்புச் சொல்லின் தொடர்ச்சியைத் தமிழில் இயல்பான இணைப்பு விகுதியால் காட்டுகிறது.
- source_word: ὑμεῖς
  choice: நீங்களும்
  rationale: வெளிப்படையாக வந்துள்ள பன்மை முன்னிலைப் பெயரின் வலியுறுத்தலைத் தக்கவைக்கிறது; முந்தைய வசனத்துடனான தொடர்பையும் காட்டுகிறது.
- source_word: πληρώσατε
  choice: நிரப்புங்கள்
  rationale: இரண்டாம் நபர் பன்மை இறந்தகாலத் தோற்ற கட்டளை வடிவின் கட்டளை வலிமையையும், ஓர் அளவு நிறைவடையும் உருவகத்தையும் பாதுகாக்கிறது.
- source_word: τὸ μέτρον
  choice: அளவை
  rationale: வரம்பை எட்டும்வரை சேரும் அளவு என்ற உருவகத்தை விளக்கிக் கரைத்துவிடாமல் நேரடியாகத் தருகிறது.
- source_word: τῶν πατέρων ὑμῶν
  choice: உங்கள் தந்தையரின்
  rationale: சொல்லின் நேரடிப் பொருளையும், முன்னோரின் செயல்களில் இவர்களும் பங்குகொள்கிறார்கள் என்ற சூழல்சார் சொல்லாட்சியையும் தக்கவைக்கிறது; இங்கு 'தந்தையர்' என்பது முன்னோர்களைக் குறிக்கிறது.
theological_decisions:
- issue: இயேசுவின் கூற்று கட்டளையா அல்லது முன்னறிவிப்பா
  choice: கிண்டல்/தீர்ப்புத் தொனியுடைய கட்டளையாக ‘நிரப்புங்கள்’
  alternative: ‘நிரப்புகிறீர்கள்’ அல்லது ‘நிரப்புவீர்கள்’ என்ற முன்னறிவிப்பு
  rationale: πληρώσατε என்பது இலக்கணப்படி இரண்டாம் நபர் பன்மை கட்டளை வடிவம். ஆகவே கட்டளை வடிவம் பாதுகாக்கப்படுகிறது; சூழலில் அது அவர்களுடைய தந்தையரின் குற்றப் போக்கை முழுமைப்படுத்தும்படி விடுக்கப்படும் கண்டனமிக்க, தீர்ப்புசார் அழைப்பாக ஒலிக்கும் பதற்றமும் தீர்க்கப்படாமல் விடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான, கண்ணியமான கட்டளை நடை. ‘தந்தையர்’ என்ற நேரடி சொல்லை முதன்மை உரையில் வைத்துக் கொண்டு, அது முன்னோர்களைக் குறிக்கும் சூழல்சார் பொருளை முடிவுரையாக உரையில் சேர்க்காமல் பாதுகாக்கப்பட்டுள்ளது.
