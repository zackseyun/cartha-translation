source:
  edition: SBLGNT
  text: ὑμεῖς δὲ μὴ κληθῆτε· Ῥαββί, εἷς γάρ ἐστιν ὑμῶν ὁ ⸀διδάσκαλος, πάντες δὲ ὑμεῖς ἀδελφοί ἐστε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/008.yaml
  text: But you are not to be called ‘Rabbi,’ for one is your teacher[b][a], and you are all brothers.
translation:
  language: ta
  text: நீங்களோ ‘ரபீ’[a] என்று அழைக்கப்பட வேண்டாம்; ஏனெனில் உங்கள் ஆசிரியர் ஒருவரே; மேலும் நீங்கள் அனைவரும் சகோதரர்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆசிரியர்.’ ‘ரபீ’ என்ற யூதப் பட்டப்பெயருக்கு ஆசிரியர் என்ற பொருள் உண்டு. ஆனால் அதை ஒலிபெயர்த்திருப்பது யூதச் சூழலைக் காப்பதுடன், வசனத்தின் பிற்பகுதியில் வரும் ‘ஆசிரியர்’ என்ற சொல்லோடு இரண்டையும் ஒன்றாக்கிவிடாமல் வேறுபடுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘சகோதரர்கள்’ என்பது ஆண்பால் பன்மையான ἀδελφοί என்பதன் மொழிபெயர்ப்பு. இச்சூழலில் அது சக சீடர்கள் அனைவரையும் ஒட்டுமொத்தமாகக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ κληθῆτε
  choice: அழைக்கப்பட வேண்டாம்
  rationale: μή உடன் வரும் இறந்தகாலச் செயப்பாட்டு வினைமுற்று இங்கு தடையைத் தெரிவிக்கிறது. ‘அழைக்கப்பட வேண்டாம்’ என்பது அதன் வலிமையை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: Ῥαββί
  choice: ரபீ
  rationale: கிரேக்க உரையே யூதப் பட்டப்பெயரை ஒலிபெயர்த்துக் கொடுக்கிறது. ‘ரபீ’ என்று வைத்திருப்பது வரலாற்று யூதச் சூழலைக் காக்கிறது; அதன் ‘ஆசிரியர்’ என்ற பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: εἷς
  choice: ஒருவரே
  rationale: இச்சொல் ஒருமையையும் வலியுறுத்தலையும் குறிக்கிறது. தமிழின் ‘ஒருவரே’ என்பது ‘ஒருவர்’ என்ற நேரடிப் பொருளுடன் சூழலில் உள்ள தனித்தன்மையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὁ διδάσκαλος
  choice: உங்கள் ஆசிரியர்
  rationale: ὑμῶν என்பதோடு சேர்ந்து, சீடர்களுடன் உறவுடைய ஆசிரியரைக் குறிக்கிறது. ‘உங்கள் ஆசிரியர்’ என்பது தெளிவான, இயல்பான தமிழ்.
- source_word: πάντες δὲ ὑμεῖς
  choice: நீங்களெல்லாரும்
  rationale: முழுக் குழுவையும் வலியுறுத்தும் கிரேக்கத் தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்கள்
  rationale: ஆண்பால் பன்மை வடிவையும் குடும்ப உறவு உருவகத்தையும் காக்கிறது. சூழலில் இது சக சீடர்களை ஒட்டுமொத்தமாகக் குறிக்கக்கூடும் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
theological_decisions:
- issue: எல்லா மனித மரியாதைப் பட்டங்களையும் இயேசு முற்றிலும் தடைசெய்கிறாரா, அல்லது சீடர் சமூகத்திலுள்ள அந்தஸ்து நாடுதலைக் கண்டிக்கிறாரா?
  choice: வசனத்தின் நேரடியான தடையை மொழிபெயர்த்து, அதன் பிற்காலப் பயன்பாட்டை உரைக்குள் விரிவுபடுத்தாமல் விடுதல்
  alternative: ‘ரபீ’ அல்லது அதற்கு ஒப்பான எந்தப் பட்டத்தையும் பயன்படுத்துவதற்கான முழுமையான தடை எனத் தெளிவுபடுத்துதல்; அல்லது மாய்மாலமான பெருமை நாடுதலை மட்டும் குறிக்கும் எனச் சுருக்குதல்
  rationale: கிரேக்க உரை நேரடியான தடையையும் அதற்கான காரணத்தையும் தருகிறது; ஆனால் அதன் எல்லா பிற்காலப் பயன்பாடுகளையும் வரையறுப்பதில்லை. ஆகவே உள்ள இறையியல் இழுபறியை மொழிபெயர்ப்பு தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியக்கூடிய, கண்ணியமான நடையில் நேரடித் தடையும் சீடர்களின் சமநிலையும் காக்கப்பட்டுள்ளன. ‘ரபீ’ வரலாற்றுச் சூழலுக்காக ஒலிபெயர்க்கப்பட்டுள்ளது.
