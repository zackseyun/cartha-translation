  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἰδοὺ ἐγὼ ἀποστέλλω πρὸς ὑμᾶς προφήτας καὶ σοφοὺς καὶ γραμματεῖς· ⸀ἐξ αὐτῶν ἀποκτενεῖτε καὶ σταυρώσετε, καὶ ἐξ αὐτῶν μαστιγώσετε ἐν ταῖς συναγωγαῖς ὑμῶν καὶ διώξετε ἀπὸ πόλεως εἰς πόλιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/034.yaml
  text: Therefore, look, I am sending to you prophets and wise men and scribes. Some of them you will kill and crucify, and some of them you will flog in your synagogues and persecute from city to city.
translation:
  language: ta
  text: ஆகவே, இதோ, நான் உங்களிடம் தீர்க்கதரிசிகளையும் ஞானிகளையும் மறைநூல் அறிஞர்களையும் அனுப்புகிறேன். அவர்களில் சிலரை நீங்கள் கொல்வீர்கள்; சிலுவையில் அறைந்து கொல்வீர்கள். வேறு சிலரை உங்கள் ஜெபக்கூடங்களில் சாட்டையால் அடிப்பீர்கள்; ஒரு நகரத்திலிருந்து இன்னொரு நகரத்துக்குத் துரத்துவீர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் கிரேக்கச் சொல்லின் நேரடியான வலிமையைக் காத்து, நவீனத் தமிழிலும் இயல்பாக ஒலிக்கிறது.
- source_word: γραμματεῖς
  choice: மறைநூல் அறிஞர்கள்
  rationale: வெறும் எழுத்தர்களைக் குறிக்காமல், வேதநூல்களில் தேர்ச்சி பெற்ற ஆசிரியர்களைக் குறிக்கும் இச்சூழல்சார் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: μαστιγώσετε
  choice: சாட்டையால் அடித்து
  rationale: உடல் தண்டனையாகச் சாட்டையடிப்பதைக் குறிப்பாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: συναγωγαῖς
  choice: ஜெபக்கூடங்கள்
  rationale: சினகோகுகளைக் குறிக்கும், தமிழில் அறியப்பட்டதும் இச்சூழலுக்கு ஏற்றதுமான பொதுப்பெயர்.
- source_word: διώξετε ἀπὸ πόλεως εἰς πόλιν
  choice: ஒரு நகரத்திலிருந்து இன்னொரு நகரத்துக்குத் துரத்துவீர்கள்
  rationale: தொடர்ந்து பின்தொடர்ந்து துன்புறுத்தும் இயக்கத்தையும் ‘நகரிலிருந்து நகருக்கு’ என்ற அமைப்பையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: அனுப்புகிறவர் யார் என்பதன் வலியுறுத்தல்
  choice: நான் ... அனுப்புகிறேன்
  alternative: நான் அனுப்புவேன்
  rationale: ἐγὼ மற்றும் நிகழ்கால ἀποστέλλω ஆகியவற்றின் நேரடி வலியுறுத்தலையும் நிகழ்கால வடிவையும் காக்கிறது; பேச்சாளரின் அடையாளம் பற்றிய மேலதிக விளக்கத்தைச் சேர்க்கவில்லை.
- issue: துன்புறுத்தப்படுவோரின் பிரிவுகள்
  choice: சிலரை ...; வேறு சிலரை ...
  alternative: அவர்களில் சிலரை ... அவர்களில் சிலரை ...
  rationale: ἐξ αὐτῶν என்ற மீளுரையை இயல்பான தமிழில் இரு குழுக்களாக வெளிப்படுத்துகிறது; ஒவ்வொரு செயலும் முற்றிலும் தனித்த நபர்களுக்கே என்று தேவையற்ற இறையியல் முடிவை வற்புறுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியத்தக்கதுமான நடை. மூலத்தின் எச்சரிக்கைத் தொனியும் எதிர்கால வினை வடிவங்களும் காக்கப்பட்டுள்ளன.
