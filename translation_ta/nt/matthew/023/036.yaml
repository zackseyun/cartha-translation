  text: ἀμὴν λέγω ὑμῖν, ⸀ἥξει ⸂ταῦτα πάντα⸃ ἐπὶ τὴν γενεὰν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/036.yaml
  text: Truly I say to you[b][a], all these things will come upon this generation.
translation:
  language: ta
  text: 'உண்மையாக உங்களுக்குச் சொல்கிறேன்: இவையெல்லாம்[a] இந்தத் தலைமுறையின் மேல்[b] வரும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் “இவையெல்லாம்” என்பது பன்மை வடிவில் உள்ளது; சில மொழிபெயர்ப்புகளில் இதைச் சுருக்கமாக “இவை அனைத்தும்” என வழங்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “இந்தத் தலைமுறை” என்பதைச் சிலர் “இந்த மக்கள்” என்றோ, நம்பாமையால் வகைப்படுத்தப்படும் ஒரு பரந்த தலைமுறை என்றோ புரிந்துகொள்கிறார்கள்; ஆனால் கிரேக்கத்தின் மிக நேரடியான வாசகம் “இந்தத் தலைமுறை” என்பதே.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: உண்மையாக
  rationale: இயேசுவின் அதிகாரமிக்க கூற்றை அறிமுகப்படுத்தும் உறுதியுரையாக இங்கு வருகிறது. நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அதன் வலிமையைத் தெரிவிக்கிறது.
- source_word: λέγω ὑμῖν
  choice: உங்களுக்குச் சொல்கிறேன்
  rationale: நிகழ்கால வினையையும் பன்மை இரண்டாம் நபர் சுட்டையும் நேரடியாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
- source_word: ἥξει
  choice: வரும்
  rationale: முன் கூறப்பட்ட விளைவுகள் இந்தத் தலைமுறையின்மேல் வந்து சேர்வதைத் தெரிவிக்கும் எதிர்கால வினை. 'நிகழும்' என்பதைக் காட்டிலும் மூலத்தின் இயக்கப் படிமத்தைப் பாதுகாக்கிறது.
- source_word: ταῦτα πάντα
  choice: இவையெல்லாம்
  rationale: நடுநிலைப் பன்மைச் சுட்டுப்பெயரையும் 'அனைத்தும்' என்ற முழுமையையும் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; முந்தைய சூழலில் கூறப்பட்ட அனைத்தையும் பின்னோக்கிச் சுட்டுகிறது.
- source_word: ἐπὶ
  choice: மேல்
  rationale: ஒருவர்மேல் விளைவுகள் வந்து சேரும் கருத்தைத் தமிழில் இயல்பாகத் தருகிறது; 'எதிராக' என்று மொழிபெயர்த்து பகைமைப் பொருளை தேவையின்றி வலுப்படுத்தவில்லை.
- source_word: γενεὰν ταύτην
  choice: இந்தத் தலைமுறை
  rationale: கிரேக்கத்தின் மிக நேரடியான பொருளைப் பாதுகாக்கிறது. 'இந்த மக்கள்' அல்லது 'இந்தக் காலம்' என்று விளக்கமாக மாற்றாமல் அதன் கால மற்றும் குறிப்புச் சார்ந்த தெளிவின்மையை நிலைநிறுத்துகிறது.
theological_decisions:
- issue: γενεὰν ταύτην என்பதன் குறிப்பு
  choice: '''இந்தத் தலைமுறை'' என்று நேரடியாக மொழிபெயர்க்கப்பட்டது.'
  alternative: '''இந்த மக்கள்,'' காலந்தோறும் நம்பாமையால் வகைப்படுத்தப்படும் ஒரு பரந்த மக்கள் வகை, அல்லது ''இந்தக் காலம்'' என்று புரிந்துகொள்ளுதல்.'
  rationale: இச்சொற்றொடரின் குறிப்பு குறித்து நிலவும் இறுதிக்கால விளக்க வேறுபாடுகளை மொழிபெயர்ப்பே தீர்மானிக்கக் கூடாது. கிரேக்கத்தின் நேரடியான காலவலிமையையும் இறையியல் பதற்றத்தையும் மொழிபெயர்ப்பு திறந்தவாறே வைக்கிறது.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. இயேசுவின் கூற்றுக்குரிய உறுதியான தொனி காக்கப்பட்டுள்ளது; அதேவேளை சொல்லமைப்பு இயல்பான தமிழாக உள்ளது.
