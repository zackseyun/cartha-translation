review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the passive prohibition, the title sense of καθηγηταί, the causal clause, and the emphasis that there is only one such guide. The identification of that one as ὁ χριστός is retained. Omitting an explicit Tamil equivalent of the connective μηδέ is acceptable in a standalone verse, since the prohibitive continuation is clear from context.
  naturalness: “வழிகாட்டிகள் என்று அழைக்கப்படாதீர்கள்” and “உங்களுக்கு வழிகாட்டி ஒருவரே” are natural, dignified modern Tamil. “அவர் மேசியா” supplies the appositional identification idiomatically after the dash.
  terminology: “வழிகாட்டி” appropriately preserves a distinction from the nearby διδάσκαλος (‘teacher’). “மேசியா” is the more standard Tamil transliteration for ‘Messiah’; the draft’s “மெசியா” should be normalized. The lexical-alternative note for “கிறிஸ்து” remains properly anchored to “மேசியா.”
  issues:
  - severity: low
    issue: Nonstandard/less natural transliteration “மெசியா”
    rationale: For modern standard Tamil, “மேசியா” is the customary transliteration of ‘Messiah’ and better reflects the established Tamil form. This is an orthographic/terminological normalization, not a change in meaning.
  revised_text: வழிகாட்டிகள் என்று அழைக்கப்படாதீர்கள்; ஏனெனில் உங்களுக்கு வழிகாட்டி ஒருவரே—அவர் மேசியா[a].
  revised_footnotes:
