    reason: lexical_alternative
  revision_rationale: The verse is retained except for normalizing the Tamil form of ‘Messiah’ from “மெசியா” to “மேசியா.” The revision preserves the source’s title distinction, singular emphasis, and explicit identification of the one guide as the Messiah.
