id: MAT.23.10
reference: Matthew 23:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μηδὲ κληθῆτε καθηγηταί, ⸂ὅτι καθηγητὴς ὑμῶν ἐστιν εἷς⸃ ὁ χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/010.yaml
  text: Do not be called instructors, for you have one instructor, the Messiah[a].
translation:
  language: ta
  text: வழிகாட்டிகள் என்று அழைக்கப்படாதீர்கள்; ஏனெனில் உங்களுக்கு வழிகாட்டி ஒருவரே—அவர் மேசியா[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கிறிஸ்து.’
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: அழைக்கப்படாதீர்கள்
  rationale: முந்தைய தடைகளுடன் தொடர்ச்சியை μηδὲ காட்டினாலும், தனி வசனமாக இயல்பான தமிழில் எதிர்மறைக் கட்டளைக்குள் அதன் பொருள் இணைக்கப்பட்டுள்ளது.
- source_word: κληθῆτε
  choice: அழைக்கப்படாதீர்கள்
  rationale: καλέω என்பதன் இறப்புவினை வடிவம் இங்கு ஒரு பட்டப்பெயரால் அழைக்கப்படுவதைக் குறிக்கிறது; தமிழ் இறப்புவினை அமைப்பு நேரடியாக அதைப் பாதுகாக்கிறது.
- source_word: καθηγηταί / καθηγητὴς
  choice: வழிகாட்டிகள் / வழிகாட்டி
  rationale: καθηγητής வழிநடத்தி அறிவுறுத்துபவரைக் குறிக்கிறது. அருகிலுள்ள διδάσκαλος என்பதுடன் இதை ஒன்றாக்காமல் இருக்க ‘ஆசிரியர்’ என்பதற்குப் பதிலாக ‘வழிகாட்டி’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: தடைக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ὑμῶν ἐστιν εἷς
  choice: உங்களுக்கு வழிகாட்டி ஒருவரே
  rationale: ஒரே ஒருவர்தான் வழிகாட்டி என்ற கிரேக்க வலியுறுத்தலை இயல்பான தமிழில் ‘ஒருவரே’ பாதுகாக்கிறது.
- source_word: ὁ χριστός
  choice: மெசியா
  rationale: கட்டுரைச் சொல்லுடன் வரும் Χριστός இங்கு பெயராக அல்ல, அபிஷேகம் பெற்றவர் என்ற பட்டமாகச் செயல்படுகிறது; ‘மெசியா’ யூத மேசிய எதிர்பார்ப்பின் பின்னணியையும் தக்கவைக்கிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு இச்சொல் தனிப்பெயர் போல் அல்லாமல் அடையாளப்படுத்தும் பட்டமாக வருகிறது. ‘மெசியா’ அந்தப் பட்டத்தின் பொருள்சார் மற்றும் யூதப் பின்னணியை வெளிப்படுத்துகிறது; பரவலான ‘கிறிஸ்து’ வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ஒரே வழிகாட்டி என்ற வலியுறுத்தல்
  choice: உங்களுக்கு வழிகாட்டி ஒருவரே
  alternative: உங்கள் வழிகாட்டி ஒருவர்
  rationale: εἷς தரும் தனித்துவ வலியுறுத்தலை ‘ஒருவரே’ தெளிவாகக் காக்கிறது; வசனத்தின் பயன்பாட்டு எல்லையை விளக்கவோ குறுக்கவோ செய்யாமல் மூலத்தின் இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. அருகிலுள்ள ‘ஆசிரியர்’ கருத்திலிருந்து καθηγητής-ஐ வேறுபடுத்த ‘வழிகாட்டி’ பயன்படுத்தப்பட்டுள்ளது; ‘ஒருவரே’ மூலத்தின் வலியுறுத்தலைக் காக்கிறது.
