id: MAT.23.35
reference: Matthew 23:35
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅπως ἔλθῃ ἐφ’ ὑμᾶς πᾶν αἷμα δίκαιον ἐκχυννόμενον ἐπὶ τῆς γῆς ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου, ὃν ἐφονεύσατε μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/035.yaml
  text: so that upon you may come all the righteous blood being poured out on the earth[a], from the blood of righteous Abel to the blood of Zechariah son of Berechiah[b], whom you murdered between the sanctuary and the altar.
translation:
  language: ta
  text: அதனால், நீதிமானாகிய ஆபேலின் இரத்தம் தொடங்கி, பரகியாவின் மகன் சகரியாவின் இரத்தம் வரைக்கும்—அவரை நீங்கள் பரிசுத்த இடத்துக்கும் பலிபீடத்துக்கும் நடுவே கொலைசெய்தீர்கள்—பூமியில்[a] சிந்தப்படும் எல்லா நீதிமான்களின் இரத்தமும் உங்கள்மேல் வரும்படியாக.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பூமியில்’ என்பதற்கு மாற்றாக, ‘நாட்டில்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் இரு பொருள்களையும் தரக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘பரகியாவின் மகன் சகரியா’ யார் என்பது விவாதத்திற்குரியது. சிலர் இவரைத் தீர்க்கதரிசி சகரியாவுடன் தொடர்புபடுத்துகிறார்கள்; வேறு சிலர் யோய்தாவின் மகன் சகரியாவுடன் (2 நாளாகமம் 24:20–22) தொடர்புபடுத்துகிறார்கள். இம்மொழிபெயர்ப்பு கிரேக்க உரையில் உள்ளபடியே பெயரை வைத்திருக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως
  choice: அதனால் ... வரும்படியாகும்
  rationale: முந்தைய கண்டனத்திலிருந்து தொடரும் நோக்கம் அல்லது விளைவைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; கிரேக்கத்தின் இருபொருள் நயத்தை மிகையாகத் தீர்மானிக்கவில்லை.
- source_word: ἔλθῃ ἐφ’ ὑμᾶς
  choice: உங்கள்மேல் வரும்படியாகும்
  rationale: ἐπί என்பதன் ‘மேல்’ உறவையும், இரத்தப்பழி அவர்கள்மேல் வரும் நீதித்தீர்ப்புச் சாயலையும் காக்கிறது.
- source_word: πᾶν αἷμα δίκαιον
  choice: நீதிமான்களின் இரத்தப்பழி அனைத்தும்
  rationale: கிரேக்கத்தில் ‘நீதியான இரத்தம்’ என்பது நீதிமான்களின் சிந்தப்பட்ட இரத்தத்தைக் குறிக்கும் ஆகுபெயர். தமிழில் ‘இரத்தப்பழி’ என்பது அது ஒருவர்மேல் ‘வரும்’ நீதித்தீர்ப்புச் சூழலைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐκχυννόμενον
  choice: சிந்தப்பட்டுவரும்
  rationale: நிகழ்காலச் செயல்பாட்டு நயமுள்ள passive participle-ஐக் காத்து, தமிழில் இரத்தம் கொட்டப்படுதலை இயல்பாகச் சொல்கிறது.
- source_word: ἐπὶ τῆς γῆς
  choice: பூமியில்
  rationale: ஆபேல் தொடங்கிய பரந்த கால-உலக அளவைக் கருத்தில் கொண்டு ‘பூமி’ முதன்மையாகத் தேர்ந்தெடுக்கப்பட்டது; ‘நாடு’ என்ற சாத்தியம் அடிக்குறிப்பில் வைக்கப்பட்டது.
- source_word: ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου
  choice: நீதிமானாகிய ஆபேலின் இரத்தம் தொடங்கி
  rationale: ἀπό...ἕως வரம்பமைப்பையும் δίκαιος என்ற அடைமொழியையும் நேரடியாகக் காக்கிறது.
- source_word: ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου
  choice: பரகியாவின் மகன் சகரியாவின் இரத்தம் வரைக்கும்
  rationale: கிரேக்கப் பெயர் மற்றும் தந்தைப்பெயரைத் திருத்தாமல் அப்படியே மொழிபெயர்த்து, வரம்பின் இறுதிப்புள்ளியை வெளிப்படுத்துகிறது.
- source_word: ὃν ἐφονεύσατε
  choice: அவரை நீங்கள் ... கொலைசெய்தீர்கள்
  rationale: φονεύω என்பதிலுள்ள ஒழுக்கக் குற்றச்சாட்டை பொதுவான ‘கொன்றீர்கள்’ என்பதைக் காட்டிலும் தெளிவாகக் காக்கிறது.
- source_word: μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου
  choice: பரிசுத்த இடத்துக்கும் பலிபீடத்துக்கும் நடுவே
  rationale: ναός முழு ஆலய வளாகத்தை அல்லாமல் அதன் உள்ளார்ந்த பரிசுத்தக் கட்டிடத்தைச் சுட்டுவதால் ‘பரிசுத்த இடம்’ எனத் தரப்பட்டது; θυσιαστήριον ‘பலிபீடம்’ என இயல்பாக மொழிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: பரகியாவின் மகன் சகரியா யார் என்பது
  choice: கிரேக்க உரையில் உள்ள தந்தைப்பெயரைத் திருத்தாமலும் வேறு சகரியாவுடன் அமைதியாக ஒத்திசைக்காமலும் வைத்தல்
  alternative: அவரை பரகியாவின் மகனான தீர்க்கதரிசி சகரியா என அடையாளப்படுத்துதல்; அல்லது 2 நாளாகமம் 24:20–22-இன் யோய்தாவின் மகன் சகரியா எனக் கொண்டு தந்தைப்பெயரை உரை/மரபுச் சிக்கலாகக் கருதுதல்
  rationale: வரலாற்று அடையாளம் விவாதத்திற்குரியது. மொழிபெயர்ப்பு SBLGNT உரையைப் பிரதிபலித்து, தீராத சிக்கலை அடிக்குறிப்பில் பாதுகாக்க வேண்டும்.
- issue: ὅπως என்பதன் நோக்கம்/விளைவு நயம்
  choice: ‘அதனால் ... வரும்படியாகும்’ என நோக்கமும் விளைவும் சந்திக்கும் வடிவம்
  alternative: ‘... வருவதற்காக’ என்று தூய நோக்கமாக அல்லது ‘எனவே ... வரும்’ என்று தூய விளைவாக மொழிபெயர்த்தல்
  rationale: சூழலில் நோக்கம் மற்றும் விளைவு இரண்டும் ஒலிக்கக்கூடும்; ஒரே விளக்கத்துக்குள் பதற்றத்தைச் சுருக்காமல் தமிழில் திறந்த நயத்தைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையில் வடிவமைக்கப்பட்டது. ‘பரிசுத்த இடம்’ மூலம் ναός மற்றும் முழு ஆலய வளாகம் ஆகியவற்றின் வேறுபாடு காக்கப்பட்டது. இரு அடிக்குறிப்பு குறிகளும் உரையில் [a], [b] என இடம்பெற்றுள்ளன.
