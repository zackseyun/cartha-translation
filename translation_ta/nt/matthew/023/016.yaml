id: MAT.23.16
reference: Matthew 23:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, ὁδηγοὶ τυφλοὶ οἱ λέγοντες· Ὃς ἂν ὀμόσῃ ἐν τῷ ναῷ, οὐδέν ἐστιν, ὃς δ’ ἂν ὀμόσῃ ἐν τῷ χρυσῷ τοῦ ναοῦ ὀφείλει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/016.yaml
  text: Woe to you[a], blind guides, who say, ‘Whoever swears by the temple, it is nothing[b]; but whoever swears by the gold of the temple is bound.’
translation:
  language: ta
  text: “உங்களுக்கு ஐயோ, குருட்டு வழிகாட்டிகளே! நீங்கள், ‘எவன் ஆலயத்தின்மேல் சத்தியம் செய்தாலும், அது ஒன்றுமில்லை; ஆனால் ஆலயத்தின் தங்கத்தின்மேல் சத்தியம் செய்கிறவன் கடமைப்பட்டவன்’ என்று சொல்கிறீர்கள்.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: உங்களுக்கு ஐயோ
  rationale: தீர்ப்பையும் கண்டனத்தையும் வெளிப்படுத்தும் தீர்க்கதரிசனப் பாணியை நெருக்கமாகவும் தமிழில் புரியத்தக்க வகையிலும் காக்கிறது.
- source_word: ὁδηγοὶ τυφλοὶ
  choice: குருட்டு வழிகாட்டிகளே
  rationale: பிறருக்கு வழிகாட்டுவதாகக் கூறிக்கொண்டே தாமே காண இயலாதவர்கள் என்ற உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: οἱ λέγοντες
  choice: நீங்கள் ... என்று சொல்கிறீர்கள்
  rationale: பெயரெச்சத் தொடரை இயல்பான தமிழ் சார்பு வாக்கியமாக வழங்குகிறது.
- source_word: Ὃς ἂν ὀμόσῃ
  choice: ஆணையிடுகிறவன்
  rationale: ἄν உடனான இறந்தகால வினையெச்ச நிலை பொதுவான, வரையறையற்ற நிபந்தனையைச் சுட்டுகிறது; தமிழ் வழக்கில் இத்தொடர் அதைக் கூறுகிறது.
- source_word: ἐν τῷ ναῷ
  choice: ஆலயத்தின்மேல்
  rationale: ἐν என்பதன் அடிப்படைப் பொருள் ‘உள்ளே’ என்றாலும், இங்கு சத்தியச் சூத்திரத்தில் ஆலயத்தை முன்வைத்து ஆணையிடுதல் குறிக்கப்படுகிறது; ‘மேல் ஆணையிடுதல்’ தமிழில் இயல்பான சத்திய மொழி.
- source_word: οὐδέν ἐστιν
  choice: கட்டுப்பட்டவன் அல்ல
  rationale: சொல்லுக்குச் சொல் ‘அது ஒன்றுமில்லை’ என்பது தமிழில் பொருள் மறைக்கக்கூடும்; சூழலில் அந்த ஆணை கட்டுப்படுத்தாது என்பதே விடுபட்டுள்ள கருத்து. அதனைத் தெளிவாக்கியும் கிரேக்கத்தின் சுருக்கமான எதிர்மறையையும் காக்கிறது.
- source_word: χρυσῷ τοῦ ναοῦ
  choice: ஆலயத்தின் தங்கத்தின்மேல்
  rationale: ஆலயத்துக்கும் அதற்குரிய தங்கத்துக்கும் இடையிலான திட்டமிட்ட முரண்பாட்டை நேரடியாகக் காக்கிறது.
- source_word: ὀφείλει
  choice: கட்டுப்பட்டவன்
  rationale: ‘கடன்பட்டிருக்கிறான்/கடமைப்பட்டிருக்கிறான்’ என்ற அடிப்படைப் பொருள் இங்கு ஆணையால் கட்டுப்பட்டிருப்பதைக் குறிக்கிறது. கிரேக்கத்தில் இல்லாத ‘தன் ஆணையால்’ என்னும் சொற்களைச் சேர்க்காமல் சூழற்பொருளை வழங்குகிறது.
theological_decisions:
- issue: சுருக்கமாக விடப்பட்ட ஆணை மொழியும் கடப்பாடும்
  choice: முதல் கூற்றை ‘கட்டுப்பட்டவன் அல்ல’ என்றும் இரண்டாவதை ‘கட்டுப்பட்டவன்’ என்றும் இணை வடிவில் மொழிபெயர்த்தல்
  alternative: ‘அது ஒன்றுமில்லை ... கடன்பட்டிருக்கிறான்’ என்று இன்னும் சொல்லோட்டமாக மொழிபெயர்த்தல்
  rationale: οὐδέν ἐστιν மற்றும் ὀφείλει ஆகிய இரண்டும் சூழலால் நிரப்பப்பட வேண்டிய சுருக்கமான சொற்றொடர்கள். இணை வடிவம் சத்தியங்களின் கட்டுப்படுத்தும் தன்மை பற்றிய இயேசுவின் விமர்சனத்தைத் தெளிவாக்குகிறது; அதேவேளை கூடுதல் கோட்பாட்டைச் சேர்ப்பதில்லை.
- issue: ἐν τῷ ναῷ என்பதன் பொருள்
  choice: சத்தியச் சூத்திரமாக ‘ஆலயத்தின்மேல்’
  alternative: இடப்பொருளாக ‘ஆலயத்தில்’
  rationale: அடுத்துள்ள ‘ஆலயத்தின் தங்கத்தின்மேல்’ என்ற இணையான தொடரும், முதல் நூற்றாண்டின் ஆணை மொழியும், ஆலயத்தைச் சாட்சியாக முன்வைப்பதே நோக்கம் என்பதை ஆதரிக்கின்றன.
translation_notes:
  register: நவீன தரமான தமிழ்; இயேசுவின் கடுமையான கண்டனத் தொனியைப் பேணும் கண்ணியமான, பொதுமக்களுக்கு எளிதில் புரியும் நடை. ‘ஆலயம்’, ‘ஆணையிடுதல்’, ‘கட்டுப்பட்டவன்’ ஆகியவை சூழலுக்கேற்ற தெளிவான சொற்கள்.
