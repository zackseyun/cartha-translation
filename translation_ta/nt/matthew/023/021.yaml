  text: καὶ ὁ ὀμόσας ἐν τῷ ναῷ ὀμνύει ἐν αὐτῷ καὶ ἐν τῷ ⸀κατοικοῦντι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/021.yaml
  text: And whoever swears by the temple swears by it and by the One dwelling in it[a].
translation:
  language: ta
  text: ஆலயத்தின் பேரில் ஆணையிடுகிறவர், அதன் பேரிலும் அதில் குடியிருப்பவரின் பேரிலும் ஆணையிடுகிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆலயத்தில் ஆணையிடுகிறவர், அதிலும் அதில் குடியிருப்பவரிலும் ஆணையிடுகிறார்.’ கிரேக்க முன்னிடைச்சொல்லின் நேரடிப் பொருள் ‘இல்’; ஆனால் இங்குள்ள ஆணைச் சூத்திரத்தில் அது ‘பேரில்’ என்ற பொருளைத் தருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: ஆணையிடுகிறவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் இறந்தகாலப் பங்கேற்புவினை பொதுவாக எந்த நபரையும் குறிக்கிறது. தமிழில் ஒருமை வடிவம் இந்தப் பொதுவான பொருளை இயல்பாகத் தருகிறது.
- source_word: ἐν τῷ ναῷ
  choice: ஆலயத்தின் மீது
  rationale: ἐν என்பதன் அடிப்படைப் பொருள் ‘இல்’ என்றாலும், இங்குள்ள ஆணைச் சூத்திரத்தில் எதன்மீது ஆணையிடப்படுகிறது என்பதைக் குறிக்கிறது. ‘மீது ஆணையிடு’ என்பது தமிழில் அதைப் பொருத்தமாக வெளிப்படுத்துகிறது.
- source_word: ναῷ
  choice: ஆலயம்
  rationale: ναός ஆலயத்தையோ அதன் பரிசுத்த இடத்தையோ குறிக்கலாம். எருசலேம் ஆலயத்தைப் பற்றிய இச்சூழலில் ‘ஆலயம்’ தெளிவான, இயல்பான சொல்.
- source_word: ὀμνύει
  choice: ஆணையிடுகிறார்
  rationale: நிகழ்கால வினை இங்கு ஒரு பொதுவான நியதியைத் தெரிவிக்கிறது. ‘ஆணையிடுகிறார்’ சுருக்கமாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: ἐν αὐτῷ
  choice: அதன் மீது
  rationale: முந்தைய ἐν போலவே, ஆணையிடும்போது முன்வைக்கப்படும் பொருளை இது குறிக்கிறது; αὐτῷ என்பது ஆலயத்தைச் சுட்டுகிறது.
- source_word: τῷ κατοικοῦντι αὐτόν
  choice: அதில் குடியிருப்பவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புவினை, ஆலயத்தில் குடியிருக்கும் கடவுளைக் குறிக்கிறது. மூலத்தில் பெயர் வெளிப்படையாக இல்லாததால் தமிழிலும் ‘குடியிருப்பவர்’ என்று மறைமுகமாகவே வைக்கப்படுகிறது.
theological_decisions:
- issue: ஆலயத்தில் குடியிருப்பவரின் அடையாளம்
  choice: ‘அதில் குடியிருப்பவர்’ என்பது சூழலில் கடவுளைக் குறிக்கிறது; ஆனால் பெயர் வெளிப்படையாகச் சேர்க்கப்படவில்லை.
  alternative: ‘அதில் குடியிருக்கும் கடவுள்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: இவர் கடவுள் என்பது சூழலில் தெளிவாக இருந்தாலும், கிரேக்க மூலம் பெயரைச் சொல்லாமல் பங்கேற்புவினையால் குறிப்பிடுகிறது. அந்த மறைமுகத் தன்மையைத் தமிழ் உரையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆலயம்’ எருசலேம் ஆலயத்தைக் குறிக்கிறது; ‘ஆணையிடு’ என்பது சத்திய ஆணையின் சூழலைத் தெளிவாகக் காட்டுகிறது.
