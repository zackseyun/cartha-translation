id: MAT.23.19
reference: Matthew 23:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀τυφλοί, τί γὰρ μεῖζον, τὸ δῶρον ἢ τὸ θυσιαστήριον τὸ ἁγιάζον τὸ δῶρον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/019.yaml
  text: Blind men[a], for which is greater[b], the gift or the altar that sanctifies the gift?
translation:
  language: ta
  text: குருடர்களே! காணிக்கையா[a], காணிக்கையைப் புனிதமாக்குகிற[b] பலிபீடமா—எது பெரியது?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கொடை.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தூயதாக்குகிற.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τυφλοί
  choice: குருடர்களே
  rationale: ஆண்பால் பன்மை விளிவடிவில் நேரடியாகக் கண்டிக்கும் சொல்லை இயல்பான தமிழில் தருகிறது; இங்கே இல்லாத ‘மூடர்கள்’ என்ற கூடுதல் பழிப்பைச் சேர்க்கவில்லை.
- source_word: τί γὰρ μεῖζον
  choice: ஏனென்றால் ... எது பெரியது?
  rationale: γάρ என்பதன் விளக்கத் தொடர்பை ‘ஏனென்றால்’ என்றும், τί ... μεῖζον என்பதன் ஒப்பீட்டு வினாவை ‘எது பெரியது?’ என்றும் காக்கிறது.
- source_word: τὸ δῶρον
  choice: காணிக்கை
  rationale: ஆலயச் சூழலில் கடவுளுக்குச் செலுத்தப்படும் δῶρον என்பதைக் ‘காணிக்கை’ இயல்பாகவும் தெளிவாகவும் குறிக்கிறது; பொதுவான ‘கொடை’ என்பதும் சாத்தியம்.
- source_word: θυσιαστήριον
  choice: பலிபீடம்
  rationale: வழிபாட்டு மற்றும் பலிசார் சூழலில் θυσιαστήριον என்பதற்கான நிலையான, தெளிவான தமிழ்ச் சொல்.
- source_word: τὸ ἁγιάζον
  choice: புனிதமாக்குகிற
  rationale: நிகழ்காலப் பெயரெச்சத்தின் செயற்பாட்டையும், பலிபீடம் காணிக்கைக்குப் புனிதத் தன்மையை அளிக்கிறது என்ற ஆலயப் பொருளையும் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: பலிபீடத்துக்கும் காணிக்கைக்கும் இடையே ἁγιάζω குறிக்கும் புனிதப்படுத்தும் உறவு
  choice: காணிக்கையைப் புனிதமாக்குகிற பலிபீடம்
  alternative: காணிக்கையைத் தூயதாக்குகிற பலிபீடம்
  rationale: இயேசுவின் வாதத்தில் பலிபீடம் காணிக்கைக்குப் புனிதத் தன்மையை அளிக்கிறது என்ற கருத்தை ‘புனிதமாக்குகிறது’ தெளிவாகப் பாதுகாக்கிறது; இதை வெறும் சடங்குமுறை அங்கீகாரமாகக் குறுக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் நேரடியான, கண்ணியமான கண்டிப்பு. ‘குருடர்களே’ என்ற அழைப்பும் ஆலயச் சொற்களான ‘காணிக்கை,’ ‘பலிபீடம்,’ ‘புனிதமாக்குதல்’ என்பவையும் பொதுவாசகர்களுக்குப் புரியும் வகையில் தக்கவைக்கப்பட்டுள்ளன.
