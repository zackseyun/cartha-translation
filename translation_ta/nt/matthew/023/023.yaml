id: MAT.23.23
reference: Matthew 23:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ ἄνηθον καὶ τὸ κύμινον, καὶ ἀφήκατε τὰ βαρύτερα τοῦ νόμου, τὴν κρίσιν καὶ ⸂τὸ ἔλεος⸃ καὶ τὴν πίστιν· ⸀ταῦτα ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/023.yaml
  text: 'Woe to you[a], scribes and Pharisees, hypocrites! For you tithe mint and dill and cumin, and have neglected the weightier matters of the law: justice and mercy and faith. These you ought to have done, without neglecting the others.'
translation:
  language: ta
  text: “வேத அறிஞர்களே, பரிசேயர்களே, வெளிவேடக்காரர்களே, உங்களுக்கு ஐயோ! ஏனெனில், புதினா, சதகுப்பை, சீரகம் ஆகியவற்றில்கூட பத்தில் ஒரு பங்கைச் செலுத்துகிறீர்கள்; ஆனால் திருச்சட்டத்தில் அதிக முக்கியத்துவம் வாய்ந்த நீதி, இரக்கம், விசுவாசம்[a] ஆகியவற்றைப் புறக்கணித்துவிட்டீர்கள். இவற்றை நீங்கள் செய்திருக்க வேண்டும்; அதே நேரத்தில் அவற்றிற்கான பத்தில் ஒரு பங்கைச் செலுத்துவதையும் புறக்கணித்திருக்கக் கூடாது.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விசுவாசத்தன்மை.” இங்குள்ள கிரேக்கச் சொல் விசுவாசம், நம்பிக்கை, அல்லது விசுவாசத்தன்மையைக் குறிக்கலாம்; இந்த நெறிசார் சூழலில் பலர் இதை விசுவாசத்தன்மை என்று புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐαὶ
  choice: உங்களுக்கு ஐயோ
  rationale: தீர்ப்பையும் கடும் கண்டனத்தையும் வெளிப்படுத்தும் தீர்க்கதரிசனப் பாணியை இயல்பான தமிழ் வடிவில் தக்கவைக்கிறது.
- source_word: γραμματεῖς
  choice: வேத அறிஞர்கள்
  rationale: நற்செய்தி நூல்களின் சூழலில் மறைநூல்களையும் திருச்சட்டத்தையும் ஆராய்ந்த அறிஞர்களைக் குறிக்கும்; நவீன வாசகருக்கும் தெளிவாக உள்ளது.
- source_word: ὑποκριταί
  choice: வெளிவேடக்காரர்கள்
  rationale: வெளிப்புறத் தோற்றத்துக்கும் உள்ளார்ந்த நடத்தைக்கும் இடையிலான முரண்பாட்டைக் குறிக்கும் நெறிசார் பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἀποδεκατοῦτε
  choice: பத்தில் ஒரு பங்கைச் செலுத்துகிறீர்கள்
  rationale: தசமபாகம் செலுத்துதல் என்ற குறிப்பான பொருளைச் சமயக் கலைச்சொல்லை மட்டும் சாராமல் தெளிவாகச் சொல்கிறது.
- source_word: ἡδύοσμον
  choice: புதினா
  rationale: குறிப்பிடப்பட்ட மூலிகைக்கான பொதுவான நவீனத் தமிழ்ப் பெயர்.
- source_word: ἄνηθον
  choice: சதகுப்பை
  rationale: dill எனப்படும் மூலிகைக்கான வழக்கமான தமிழ்ப் பெயர்.
- source_word: κύμινον
  choice: சீரகம்
  rationale: cumin எனப்படும் நறுமணப் பொருளுக்கான பொதுவான தமிழ்ப் பெயர்.
- source_word: ἀφήκατε
  choice: புறக்கணித்துவிட்டீர்கள்
  rationale: செய்ய வேண்டியவற்றை ஒதுக்கிவிட்டார்கள் என்ற கண்டனப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τὰ βαρύτερα τοῦ νόμου
  choice: திருச்சட்டத்தில் அதிக முக்கியத்துவம் வாய்ந்தவை
  rationale: ‘அதிக எடையுள்ளவை’ என்ற கிரேக்க உருவகத்தின் பொருளான ஒப்பீட்டு முக்கியத்துவத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: κρίσιν
  choice: நீதி
  rationale: இந்த நெறிசார் மூன்றிணையில் தீர்ப்பிடும் செயலைவிட நியாயமாக நடப்பதைக் குறிக்கிறது.
- source_word: ἔλεος
  choice: இரக்கம்
  rationale: கருணையோடு செயல்படுதல் என்ற உடன்படிக்கை சார்ந்த நெறிப் பொருளை இயல்பாகத் தருகிறது.
- source_word: πίστιν
  choice: விசுவாசம்
  rationale: πίστις என்பதன் நேரடியான, பரவலாக அறியப்பட்ட பொருளை முதன்மை உரையில் வைத்தபடி, இச்சூழலில் சாத்தியமான ‘உண்மைத்தன்மை’ என்ற பொருளைக் காலடிக்குறிப்பில் பாதுகாக்கிறது.
theological_decisions:
- issue: நெறிசார் மூன்றிணையில் πίστιν என்பதன் பொருள்
  choice: விசுவாசம்
  alternative: உண்மைத்தன்மை
  rationale: இந்தச் சொல் விசுவாசம், நம்பிக்கை, நம்பிக்கைக்குரிய உண்மைத்தன்மை ஆகிய பொருள்களைக் கொள்ளலாம். சூழல் உண்மைத்தன்மையை ஆதரிக்கக்கூடும்; இருப்பினும் மூலத்தின் உண்மையான பொருள் அகலத்தைச் சுருக்காமல் முதன்மை உரையில் ‘விசுவாசம்’ வைக்கப்பட்டு மாற்றுப் பொருள் குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான கண்டனத் தொனி பேணப்பட்டுள்ளது. மூலிகைப் பெயர்கள் சாதாரண வாசகருக்குத் தெரிந்த வடிவில் தரப்பட்டுள்ளன. இறுதி வாக்கியத்தில் ‘இவை’ என்பது நீதி, இரக்கம், விசுவாசத்தையும், ‘அவை’ என்பது பத்தில் ஒரு பங்கு செலுத்துவதையும் குறிக்கும் மூலத்தின் வேறுபாடு தக்கவைக்கப்பட்டுள்ளது.
