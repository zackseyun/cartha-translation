source:
  edition: SBLGNT
  text: πάντα οὖν ὅσα ⸀ἐὰν εἴπωσιν ὑμῖν ⸂ποιήσατε καὶ τηρεῖτε⸃, κατὰ δὲ τὰ ἔργα αὐτῶν μὴ ποιεῖτε, λέγουσιν γὰρ καὶ οὐ ποιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/003.yaml
  text: Therefore[a], do and keep everything they tell you, but do not do according to their works, for they say and do not do.
translation:
  language: ta
  text: ஆகவே, அவர்கள் உங்களுக்குச் சொல்வதையெல்லாம் செய்து கடைப்பிடியுங்கள். ஆனால் அவர்களுடைய செயல்களின்படி செய்யாதீர்கள்[a]. ஏனெனில் அவர்கள் சொல்கிறார்கள்; செய்வதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் செய்வதுபோல் செய்யாதீர்கள்.”
    reason: κατὰ τὰ ἔργα αὐτῶν என்பதற்கான இயல்பான, பொருள்சார் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: πάντα οὖν ὅσα ἐὰν
  choice: ஆகவே, … எல்லாவற்றையும் / … சொல்வதையெல்லாம்
  rationale: οὖν-இன் முடிவுரைக்கும் தன்மையை “ஆகவே” வெளிப்படுத்துகிறது. πάντα ὅσα ἐὰν என்பதன் முழுமையான பரப்பை இயல்பான தமிழில் “சொல்வதையெல்லாம்” காக்கிறது.
- source_word: εἴπωσιν ὑμῖν
  choice: அவர்கள் உங்களுக்குச் சொல்வது
  rationale: λέγω என்பதன் பொதுவான “சொல்” பொருளைக் காக்கிறது; கிரேக்கத்தில் இல்லாத “போதிக்கிறார்கள்” அல்லது “கட்டளையிடுகிறார்கள்” என்ற கூடுதல் கருத்தைச் சேர்க்கவில்லை.
- source_word: ποιήσατε καὶ τηρεῖτε
  choice: செய்து கடைப்பிடியுங்கள்
  rationale: ποιέω மற்றும் τηρέω ஆகிய இரு வேறுபட்ட வினைகளையும் முறையே “செய்,” “கடைப்பிடி” என்று வெளிப்படுத்துகிறது. இது செயலில் நிறைவேற்றுவதையும் தொடர்ந்து பேணுவதையும் உள்ளடக்குகிறது.
- source_word: κατὰ δὲ τὰ ἔργα αὐτῶν
  choice: ஆனால் அவர்களுடைய செயல்களின்படி
  rationale: κατά என்பதன் ஒத்துப்போகும் முறை அல்லது அளவுகோல் என்ற பொருளை “படி” காக்கிறது; ἔργα என்பதை இச்சூழலில் இயல்பான “செயல்கள்” என மொழிபெயர்க்கிறது.
- source_word: μὴ ποιεῖτε
  choice: செய்யாதீர்கள்
  rationale: தொடர்ந்து பின்பற்றப்படும் செயலுக்கு எதிரான தடையைத் தெளிவாகக் கூறுவதோடு, ποιέω மீண்டும் வருவதையும் “செய்” என்ற ஒரே வினையால் காக்கிறது.
- source_word: λέγουσιν γὰρ καὶ οὐ ποιοῦσιν
  choice: ஏனெனில், அவர்கள் சொல்கிறார்கள்; ஆனால் செய்வதில்லை
  rationale: γάρ-இன் காரண விளக்கத்தை “ஏனெனில்” காட்டுகிறது. கிரேக்கத்தின் சுருக்கமான சொல்–செயல் முரண்பாட்டையும் ποιέω-வின் மீளுரையையும் காக்க “சொல்கிறார்கள்; ஆனால் செய்வதில்லை” பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட மறைநூல் அறிஞர்களும் பரிசேயர்களும் பெற்றிருந்த போதனை அதிகாரத்தை இவ்வசனத்தில் வெளிப்படையாகச் சேர்ப்பதா
  choice: இவ்வசனம் கூறுவதுபோல “அவர்கள்” என்ற சுட்டை மட்டும் வைத்து, பொருளைச் சூழலுக்குள் மறைமுகமாகவே விடுதல்
  alternative: “அவர்கள் உங்களுக்குப் போதிப்பதையெல்லாம்” அல்லது “மோசேயின் இருக்கையிலிருந்து அவர்கள் சொல்வதையெல்லாம்” என்று விரித்துரைத்தல்
  rationale: முந்தைய சூழல் “அவர்கள்” யார் என்பதை அடையாளப்படுத்துகிறது; ஆனால் இவ்வசனம் அந்த விவரங்களை மீண்டும் கூறவில்லை. மொழிபெயர்ப்பில் விளக்கத்தைச் சேர்க்காமல் மூலத்தின் சுருக்கத்தையும் பரந்த கட்டளையையும் காக்கப்பட்டுள்ளது.
- issue: செய் என்ற வினையின் மீளுரையை மென்மைப்படுத்துவதா
  choice: “செய்து … செய்யாதீர்கள் … செய்வதில்லை” என்ற மீளுரையைப் பாதுகாத்தல்
  alternative: “நடைமுறைப்படுத்துங்கள் … பின்பற்றாதீர்கள் … அதன்படி வாழ்வதில்லை” போன்ற பல்வேறு வினைகளைப் பயன்படுத்துதல்
  rationale: ποιέω மூன்று இடங்களில் வருவது சொல்–செயல் முரண்பாட்டை வலியுறுத்தும் முக்கியமான சொல்லாட்சியாகும். இயல்பான தமிழ் வரம்புக்குள் அந்த எதிரொலி பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் மரியாதைமிக்க வேதாகம நடையிலும் வடிவமைக்கப்பட்டது. “கடைப்பிடியுங்கள்” என்பது “செய்யுங்கள்” என்பதிலிருந்து τηρεῖτε-இன் வேறுபாட்டைக் காக்கிறது. அரைப்புள்ளி இறுதிக் கூற்றிலுள்ள கூர்மையான சொல்–செயல் எதிர்மறையை வெளிப்படுத்துகிறது.
