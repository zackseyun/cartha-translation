review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the Byzantine Greek verse overall, including the woe, the address to scribes and Pharisees, the exploitation metaphor, extended prayer, and the resulting adverse judgment. However, “அதை மறைக்க” specifies that the prayers conceal the exploitation; πρόφασις more directly denotes a pretext or pretence and does not explicitly state that particular object. “மிகக் கடுமையான” also tends toward a superlative, whereas περισσότερον is comparative.
  naturalness: The register is clear and modern. “பாசாங்காக நீண்ட நேரம் ஜெபிக்கிறீர்கள்” is more natural and more semantically direct than “அதை மறைக்க நீண்ட நேரம் மன்றாடுகிறீர்கள்.”
  terminology: “வேத அறிஞர்கள்,” “பரிசேயர்கள்,” and “வெளிவேடக்காரர்கள்” are suitable modern-standard Tamil renderings. “அதிகக் கடுமையான தீர்ப்பு” preserves the comparative force of περισσότερον κρίμα without overdefining the punishment.
  issues:
  - severity: medium
    issue: “அதை மறைக்க” over-specifies πρόφασις.
    rationale: The Greek says that the long prayers are made as a pretext/pretence. Although concealment may be implied by hypocrisy, the text does not explicitly say that the prayers are to hide the devouring of widows’ houses.
  - severity: medium
    issue: “மிகக் கடுமையான” weakens the comparative sense of περισσότερον.
    rationale: The Greek means “greater/more severe,” in comparison with judgment otherwise due. “அதிகக் கடுமையான” retains that comparison more closely.
  revised_text: வேத அறிஞர்களே, பரிசேயர்களே, வெளிவேடக்காரர்களே, உங்களுக்கு ஐயோ![a] ஏனெனில், நீங்கள் கைம்பெண்களின் வீடுகளை விழுங்கி, பாசாங்காக நீண்ட நேரம் ஜெபிக்கிறீர்கள். ஆகவே, நீங்கள் அதிகக் கடுமையான தீர்ப்பைப் பெறுவீர்கள்.
