base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/014.yaml
  text: Woe[a] to you, scribes and Pharisees, hypocrites! For you devour widows' houses, and as a pretext make long prayers; therefore you will receive greater condemnation.
translation:
  language: ta
  text: வேத அறிஞர்களே, பரிசேயர்களே, வெளிவேடக்காரர்களே, உங்களுக்கு ஐயோ![a] ஏனெனில், நீங்கள் கைம்பெண்களின் வீடுகளை விழுங்கி, பாசாங்காக நீண்ட நேரம் ஜெபிக்கிறீர்கள். ஆகவே, நீங்கள் அதிகக் கடுமையான தீர்ப்பைப் பெறுவீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த வசனம் மிகப் பழமையான கிரேக்கக் கையெழுத்துப் பிரதிகளில்—நான்காம் நூற்றாண்டைச் சேர்ந்த சினாய்டிகஸ், வத்திக்கானஸ் பிரதிகள் உட்பட—மற்றும் தொடக்ககால காப்டிக் மொழிபெயர்ப்புகளில் இல்லை. ஆனால் பைசாந்தியப் பெரும்பான்மை மரபிலும், பழைய லத்தீன் மொழிபெயர்ப்பிலும், வுல்காத்தாவிலும், சிரிய மொழிபெயர்ப்புகளிலும் உள்ளது. மாற்கு 12:40 மற்றும் லூக்கா 20:47-இல் உள்ள ஒத்த கூற்றுகளுடன் மத்தேயுவை ஒத்திசைக்கப் பிற்கால நகலெழுத்தாளர்கள் இதைச் சேர்த்திருக்கலாம். இவ்வசனத்தை உள்ளடக்கும் பிரதிகளிலும் இது 13-ஆம் வசனத்துக்கு முன்பா பின்பா வருகிறது என்பதில் வேறுபாடு உள்ளது.
    reason: textual_critical
lexical_decisions:
- source_word: γραμματεῖς
  choice: வேத அறிஞர்கள்
  rationale: யூதத் திருமறையை நகலெடுத்து, கற்று, விளக்கியவர்களைக் குறிக்கும் சொல்லை நவீன வாசகர்களுக்குத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: ὑποκριταί
  choice: வெளிவேடக்காரர்கள்
  rationale: உள்ளார்ந்த உண்மை நிலைக்கு மாறாக வெளியில் பக்திமான்களைப் போல நடிப்பவர்களை இயல்பான தமிழில் குறிக்கிறது.
- source_word: κατεσθίετε
  choice: விழுங்கிவிட்டு
  rationale: கைம்பெண்களின் வாழ்வாதாரத்தையும் சொத்தையும் இரக்கமின்றிச் சுரண்டுவதைச் சித்தரிக்கும் மூலத்தின் வலுவான உருவகத்தைப் பேணுகிறது.
- source_word: τὰς οἰκίας τῶν χηρῶν
  choice: கைம்பெண்களின் வீடுகளை
  rationale: ‘வீடுகள்’ என்பது குடியிருப்புகளை மட்டும் அல்லாமல் அவர்களுடைய குடும்பச் சொத்து அல்லது வாழ்வாதாரத்தையும் குறிக்கக்கூடிய மூல உருவகமாக இருப்பதால் அதைத் திறந்த நிலையில் வைத்திருக்கிறது.
- source_word: προφάσει
  choice: அதை மறைக்க
  rationale: நீண்ட மன்றாட்டுகள் உண்மையான பக்தியல்ல, சுரண்டலை மறைக்கும் போலிக் காரணம் அல்லது போர்வை என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: μακρὰ προσευχόμενοι
  choice: நீண்ட நேரம் மன்றாடுகிறீர்கள்
  rationale: மன்றாட்டின் நீளத்தைக் குறிக்கும் கிரேக்கச் சொற்றொடரைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: περισσότερον κρίμα
  choice: மிகக் கடுமையான தண்டனைத் தீர்ப்பு
  rationale: ஒப்பீட்டுத் தீவிரத்தையும் எதிர்மறையான நீதித் தீர்ப்பையும் சேர்த்து வெளிப்படுத்துகிறது; வெறும் நடுநிலையான ‘தீர்ப்பு’ என்ற வாசிப்பைத் தவிர்க்கிறது.
theological_decisions:
- issue: περισσότερον κρίμα என்பதன் தண்டனைத் தீவிரம்
  choice: மிகக் கடுமையான தண்டனைத் தீர்ப்பு
  alternative: அதிகமான கண்டனம் / பெரிய தீர்ப்பு
  rationale: இந்தச் சூழலில் κρίμα குற்றத்துக்கான எதிர்மறைத் தீர்ப்பைக் குறிக்கிறது; περισσότερον அதன் தீவிரம் அதிகம் என்பதைத் தெரிவிக்கிறது. தண்டனையின் துல்லிய இயல்பை மேலதிகமாக வரையறுக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான வேதாகம நடையைப் பேணிய மொழிபெயர்ப்பு. ‘உங்களுக்கு ஐயோ’ என்ற தீர்க்கதரிசன எச்சரிக்கைச் சொற்றொடரும் ‘வீடுகளை விழுங்குதல்’ என்ற கடுமையான உருவகமும் பாதுகாக்கப்பட்டுள்ளன. ‘மன்றாடுதல்’ என்பது மதச்சூழலில் இயல்பாகப் புரியும் வகையில் பயன்படுத்தப்பட்டுள்ளது.
