id: MAT.23.13
reference: Matthew 23:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Οὐαὶ ⸀δὲ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι κλείετε τὴν βασιλείαν τῶν οὐρανῶν ἔμπροσθεν τῶν ἀνθρώπων· ὑμεῖς γὰρ οὐκ εἰσέρχεσθε, οὐδὲ τοὺς εἰσερχομένους ἀφίετε ⸀εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/013.yaml
  text: But woe to you[a], scribes and Pharisees, hypocrites! For you shut the kingdom of heaven before people; for you do not enter[c][b], nor do you allow those who are entering to enter.
translation:
  language: ta
  text: ஆனால் மறைநூல் அறிஞர்களே, பரிசேயர்களே, வெளிவேடக்காரர்களே, உங்களுக்கு ஐயோ! ஏனெனில், மக்களுக்கு முன்பாகப் பரலோக அரசை மூடிவிடுகிறீர்கள். நீங்கள் அதற்குள் நுழைவதில்லை; நுழைந்துகொண்டிருப்பவர்களையும் நுழைய விடுவதில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நுழைய முயல்பவர்களையும்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கப் பங்கேற்புச் சொல், நுழையும் செயல்முறையில் இருப்பவர்களையோ நுழைய முனைபவர்களையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ
  choice: உங்களுக்கு ஐயோ
  rationale: தீர்க்கதரிசனக் கண்டனத்தையும் வரவிருக்கும் கேடுகுறித்த எச்சரிப்பையும் வலுவாகத் தக்கவைக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: தொடர்ச்சியோடு கூடிய மென்மையான மாறுபாட்டைக் காட்டுகிறது.
- source_word: γραμματεῖς
  choice: மறைநூல் அறிஞர்கள்
  rationale: நற்செய்தி நூல்களின் சூழலில் வேதநூல்களை நகலெடுத்து விளக்கிய சமய அறிஞர்களைக் குறிக்கும் சொல்லாக, இன்றைய வாசகருக்குத் தெளிவாக உள்ளது.
- source_word: Φαρισαῖοι
  choice: பரிசேயர்கள்
  rationale: அக்குழுவின் வழக்கமான தமிழ்ப் பெயரைப் பயன்படுத்துகிறது.
- source_word: ὑποκριταί
  choice: வெளிவேடக்காரர்கள்
  rationale: சொல்லின் ஒழுக்க-சமயப் பாசாங்கு சார்ந்த கண்டனத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: κλείετε
  choice: மூடிவிடுகிறீர்கள்
  rationale: நுழைவைத் தடுக்கிற உருவகத்தைத் தக்கவைத்து, செயல் விளைவையும் தமிழில் தெளிவுபடுத்துகிறது.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: பரலோக அரசு
  rationale: மத்தேயுவுக்கே சிறப்பான இந்தச் சொற்றொடரை, தேவனுடைய ஆட்சியைக் குறிக்கும் இயல்பான மற்றும் சுருக்கமான தமிழில் வழங்குகிறது.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: மக்களுக்கு முன்பாக
  rationale: மற்றவர்களின் நுழைவுக்கு எதிராக வாயிலை மூடும் இடவியல் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: ἀνθρώπων
  choice: மக்கள்
  rationale: ஆண்களை மட்டும் அல்லாமல் மனிதர்களைப் பொதுவாகக் குறிக்கும் கிரேக்கச் சொல்லின் பாலினப் பொதுமையைச் சரியாகத் தருகிறது.
- source_word: εἰσέρχεσθε
  choice: நுழைவதில்லை
  rationale: அரசுக்குள் செல்வதைப் பற்றிய மூல உருவகத்தை நேரடியாகத் தக்கவைக்கிறது.
- source_word: τοὺς εἰσερχομένους
  choice: நுழைந்துகொண்டிருப்பவர்கள்
  rationale: நுழையும் செயல்முறையில் இருப்பவர்களைக் குறிக்கும் நிகழ்காலப் பங்கேற்புச் சொல்லின் நீடித்த அம்சத்தைப் பாதுகாக்கிறது.
- source_word: ἀφίετε εἰσελθεῖν
  choice: நுழைய விடுவதில்லை
  rationale: அனுமதிக்க மறுப்பதையும் இறுதிச் செயப்படிவமான ‘நுழைய’ என்பதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: βασιλεία τῶν οὐρανῶν என்பதன் பொருள்
  choice: பரலோக அரசு
  alternative: வானங்களின் அரசு
  rationale: மத்தேயுவின் வழக்குச் சொற்றொடரைத் தேவனுடைய அரசாட்சியிலிருந்து தனியான கோட்பாட்டுப் பிரிவாக மாற்றாமல், தமிழில் இயல்பாக வழங்குகிறது.
- issue: τοὺς εἰσερχομένους என்பதன் செயல்நிலை
  choice: நுழைந்துகொண்டிருப்பவர்கள்
  alternative: நுழைய முயல்பவர்கள்
  rationale: மூலத்தின் நிகழ்காலப் பங்கேற்பு நுழையும் செயல்முறையையோ அதற்கான முனைப்பையோ குறிக்கக்கூடும்; முதன்மை உரை செயல்முறைப் பொருளைத் தக்கவைக்கிறது, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἔμπροσθεν τῶν ἀνθρώπων என்ற உருவகம்
  choice: மக்களுக்கு முன்பாக
  alternative: மக்கள் நுழையாதபடி
  rationale: மூலத்தின் ‘முன்பாக’ என்ற உருவகத்தை விளக்கவுரையால் மாற்றாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, நேரடியான தீர்க்கதரிசனக் கண்டன நடையைக் கையாளுகிறது. ‘மறைநூல் அறிஞர்கள்’ என்பது வரலாற்றுப் பணியை இன்றைய வாசகருக்குத் தெளிவாக்குகிறது; ‘வெளிவேடக்காரர்கள்’ பாசாங்கு குறித்த கடுமையான கண்டனத்தைத் தக்கவைக்கிறது. தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
