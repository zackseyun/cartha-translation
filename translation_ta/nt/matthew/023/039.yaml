id: MAT.23.39
reference: Matthew 23:39
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν, οὐ μή με ἴδητε ἀπ’ ἄρτι ἕως ἂν εἴπητε· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/039.yaml
  text: For I tell you[a], from now on you will certainly not see me until you say[b], ‘Blessed is he who comes in the name of the Lord.’
translation:
  language: ta
  text: 'ஏனெனில், நான் உங்களுக்குச் சொல்கிறேன்: இனிமேல், ‘ஆண்டவரின் பெயரில் வருகிறவர் ஆசீர்வதிக்கப்பட்டவர்’[b] என்று நீங்கள் சொல்லும்வரை, நீங்கள் என்னைக் காணவே மாட்டீர்கள்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் οὐ μή என்னும் வலியுறுத்தப்பட்ட மறுப்பு பயன்படுத்தப்பட்டுள்ளது; இதை ‘நிச்சயமாகக் காண மாட்டீர்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இது சங்கீதம் 118:26-இன் மேற்கோள் அல்லது மறைமுகச் சுட்டு.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: ஏனெனில், நான் உங்களுக்குச் சொல்கிறேன்
  rationale: λέγω உடன் வரும் ὑμῖν நேரடியாகக் கேட்போரிடம் கூறுவதைக் குறிக்கிறது. γάρ முந்தைய புலம்பல் மற்றும் தீர்ப்புரையோடு உள்ள விளக்கத் தொடர்பைக் காட்டுவதால் ‘ஏனெனில்’ என்று வெளிப்படையாக மொழிபெயர்க்கப்பட்டது.
- source_word: οὐ μή
  choice: காணவே மாட்டீர்கள்
  rationale: οὐ μή என்பது வலியுறுத்தப்பட்ட மறுப்பு. தமிழில் வினையுடன் ‘-வே மாட்டீர்கள்’ என்பதன் மூலம் அதன் உறுதியான எதிர்மறை வலிமை இயல்பாகப் பாதுகாக்கப்படுகிறது.
- source_word: ἴδητε
  choice: காண
  rationale: ὁράω என்பதன் இவ்வடிவம் இங்கு நேரடியாக ‘காண’ என்று பொருள்படும்; மிகப் பழமையான அல்லது விளக்கமளிக்கும் சொல் தவிர்க்கப்பட்டது.
- source_word: ἀπ’ ἄρτι
  choice: இனிமேல்
  rationale: தற்போதைய தருணத்திலிருந்து தொடங்கும் காலத்தை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: ἕως ἂν εἴπητε
  choice: நீங்கள் சொல்லும்வரை
  rationale: ἕως ἄν உடன் வரும் இறந்தகாலத் துணைவினை வடிவம் எதிர்காலத்தில் நிகழக்கூடிய ஒரு வரம்பைச் சுட்டுகிறது; ‘சொல்லும்வரை’ அதைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: Εὐλογημένος
  choice: ஆசீர்வதிக்கப்பட்டவர்
  rationale: சங்கீத மேற்கோளின் வாழ்த்தும் வேதாகமத் தொனியையும், சொல்லின் செயப்பாட்டு நுணுக்கத்தையும் பாதுகாக்கிறது.
- source_word: ὁ ἐρχόμενος
  choice: வருகிறவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் கிரேக்கப் பங்கேற்பு வடிவத்தை இயல்பான தமிழில் தருகிறது; உரை தானாக வெளிப்படுத்தாத சிறப்புப் பட்டப்பெயர் நுணுக்கத்தைச் சேர்க்கவில்லை.
- source_word: ἐν ὀνόματι κυρίου
  choice: ஆண்டவரின் பெயரில்
  rationale: மூலத்தின் முன்னிடைச்சொல் அமைப்பையும் சங்கீத மேற்கோளின் ஒலிநயத்தையும் பாதுகாக்கிறது. κύριος என்பதற்கு பொதுவாகப் புரியும், மரியாதைக்குரிய ‘ஆண்டவர்’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: எதிர்காலத்தில் காண்பதும் மேற்கோளைச் சொல்வதும் குறிக்கும் நிகழ்வு
  choice: அவர்கள் மேற்கோளிலுள்ள வாழ்த்தைச் சொல்லும்வரை இயேசுவைக் காண மாட்டார்கள் என்ற உறுதியான அறிவிப்பாக மட்டும் மொழிபெயர்க்கப்பட்டது.
  alternative: இது வெற்றிப் பவனி, இரண்டாம் வருகை அல்லது இஸ்ரவேலின் எதிர்கால மனந்திரும்புதல் ஆகியவற்றில் குறிப்பாக ஒன்றைக் குறிக்கிறது என்று மொழிபெயர்ப்பிலேயே விளக்குவது.
  rationale: கிரேக்க உரை எதிர்காலக் காணுதலுக்கான வரம்பைத் தெரிவிக்கிறது; ஆனால் அந்த வரலாற்று அல்லது இறுதிக்கால நிகழ்வு எது என்பதை வெளிப்படையாக வரையறுக்கவில்லை. ஆகவே அந்த இறையியல் இழுபறி தீர்க்கப்படாமல் பாதுகாக்கப்பட்டது.
- issue: ὁ ἐρχόμενος என்பதன் சாத்தியமான பட்டப்பெயர் நுணுக்கம்
  choice: வருகிறவர்
  alternative: வரவிருக்கிறவர் அல்லது வருபவர் என்னும் சிறப்புப் பட்டப்பெயர் போன்று அமைத்தல்
  rationale: சங்கீத மேற்கோளில் உள்ள நேரடியான பொருளைப் பாதுகாத்து, மேசியாவைக் குறிக்கும் பட்டப்பெயர் என்ற விளக்கத்தை மொழிபெயர்ப்பில் கட்டாயப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம மேற்கோளுக்கேற்ற கண்ணியமான தொனியிலும் அமைக்கப்பட்டது. ‘காணவே மாட்டீர்கள்’ என்பது மூலத்தின் வலியுறுத்தப்பட்ட மறுப்பை இயல்பாக வெளிப்படுத்துகிறது; ‘ஆண்டவர்’ என்பது சமயப் பிரிவுச் சார்பற்ற மரியாதைச் சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது.
