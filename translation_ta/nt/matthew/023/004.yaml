  text: δεσμεύουσιν ⸀δὲ φορτία ⸀βαρέα καὶ ἐπιτιθέασιν ἐπὶ τοὺς ὤμους τῶν ἀνθρώπων, ⸂αὐτοὶ δὲ τῷ⸃ δακτύλῳ αὐτῶν οὐ θέλουσιν κινῆσαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/004.yaml
  text: They tie up heavy burdens and lay them on the shoulders of men[a], but they themselves are unwilling to move them with their finger.
translation:
  language: ta
  text: அவர்கள் கனமான சுமைகளைக் கட்டி, மக்களின்[a] தோள்கள்மேல் வைக்கிறார்கள்; ஆனால் அவர்களோ தங்கள் விரலால்கூட அவற்றை அசைக்க விரும்புவதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மனிதர்களின்’; கிரேக்கச் சொல் இங்கு பொதுவாக மனிதர்கள் அனைவரையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεσμεύουσιν
  choice: கட்டுகிறார்கள்
  rationale: சுமைகளை ஒன்றாகக் கட்டித் தயாரிக்கும் நேரடியான உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: φορτία βαρέα
  choice: கனமான சுமைகள்
  rationale: சொல்லின் நேரடியான எடை உணர்வையும், அழுத்தும் கடமைகள் என்ற உருவக வலிமையையும் காக்கிறது.
- source_word: ἐπιτιθέασιν ἐπὶ τοὺς ὤμους
  choice: தோள்கள்மேல் வைக்கிறார்கள்
  rationale: ஒருவர்மேல் சுமை ஏற்றும் உடல்சார்ந்த காட்சியைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: τῶν ἀνθρώπων
  choice: மக்களின்
  rationale: இங்கு ἄνθρωπος பொதுவாக மனிதர்களைக் குறிக்கிறது; நவீனத் தமிழில் ‘மக்கள்’ அந்தப் பிரதிநிதித்துவப் பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: αὐτοὶ δὲ
  choice: ஆனால் அவர்களோ
  rationale: மற்றவர்கள்மேல் சுமத்துவதற்கும் தாங்களே உதவ மறுப்பதற்கும் இடையிலான வலியுறுத்தப்பட்ட முரண்பாட்டைத் தமிழில் காட்டுகிறது.
- source_word: τῷ δακτύλῳ αὐτῶν
  choice: தங்கள் விரலால்கூட
  rationale: கிரேக்கத்தின் ஒருமை ‘விரல்’ என்பதையும், மிகச் சிறிய முயற்சியைக்கூட செய்யாதிருப்பது என்ற கருத்தையும் ‘கூட’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὐ θέλουσιν κινῆσαι αὐτά
  choice: அவற்றை அசைக்க விரும்புவதில்லை
  rationale: இயலாமையை அல்ல, மனமில்லாத திட்டவட்டமான மறுப்பைக் குறிக்கும் θέλω என்பதையும், ‘அசைத்தல்’ எனும் κινέω-வின் அடிப்படைப் பொருளையும் காக்கிறது.
theological_decisions:
- issue: சுமைகள் நேரடியானவையா அல்லது உருவகமானவையா
  choice: ‘கனமான சுமைகள்’ என்ற உறுதியான உருவகத்தை விளக்கமின்றித் தக்கவைத்தல்
  alternative: அவற்றைச் சட்டக் கோரிக்கைகள் அல்லது சமயக் கட்டுப்பாடுகள் என்று வெளிப்படையாக விளக்குதல்
  rationale: சூழலில் ஒடுக்குகிற கடமைகள் குறிக்கப்படினும், கிரேக்க வசனம் அவற்றைத் தனியாக வரையறுக்கவில்லை; ஆகவே உருவகத்தைத் திறந்த நிலையில் வைப்பது தேவையற்ற கோட்பாட்டு குறுக்கீட்டைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘அவர்களோ’ மற்றும் ‘விரலால்கூட’ என்பவை மூலத்தின் முரண்பாட்டையும் குறைந்தபட்ச உதவியைக்கூட மறுக்கும் வலியுறுத்தலையும் இயல்பாகக் காக்கின்றன.
