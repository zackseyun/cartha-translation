  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι οἰκοδομεῖτε τοὺς τάφους τῶν προφητῶν καὶ κοσμεῖτε τὰ μνημεῖα τῶν δικαίων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/029.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites, because you build the tombs of the prophets and decorate the monuments of the righteous[b],
translation:
  language: ta
  text: “மறைநூல் அறிஞர்களே, பரிசேயர்களே, வெளிவேடக்காரர்களே, உங்களுக்கு ஐயோ; ஏனெனில் நீங்கள் இறைவாக்கினர்களின் கல்லறைகளைக் கட்டி, நீதிமான்களின் நினைவுச் சின்னங்களை[a] அலங்கரிக்கிறீர்கள்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கல்லறை நினைவிடங்களை.” கிரேக்கச் சொல் நினைவுச் சின்னங்களையோ கல்லறைகளையோ குறிக்கலாம்; வசனத்தின் முற்பகுதியிலுள்ள “கல்லறைகள்” என்பதிலிருந்து வேறுபடுத்த இங்கே “நினைவுச் சின்னங்கள்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
