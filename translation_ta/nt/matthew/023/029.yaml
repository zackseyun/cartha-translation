lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: உங்களுக்கு ஐயோ!
  rationale: தீர்ப்பை அறிவிக்கும் தீர்க்கதரிசனப் பாணியின் கடுமையைப் பாதுகாக்கிறது; வெறும் இரக்க வெளிப்பாடாக மென்மைப்படுத்தவில்லை.
- source_word: γραμματεῖς
  choice: மறைநூல் அறிஞர்களே
  rationale: யூத மறைநூல்களிலும் சட்டத்திலும் தேர்ச்சி பெற்றவர்களைக் குறிக்கும் சொல்லை, இன்றைய வாசகருக்குப் புரியும் வகையில் தருகிறது; வெறும் எழுத்தர்களாகக் குறுக்கவில்லை.
- source_word: Φαρισαῖοι
  choice: பரிசேயர்களே
  rationale: குழுவின் வழக்கமான தமிழ் பெயரைப் பயன்படுத்துகிறது.
- source_word: ὑποκριταί
  choice: வெளிவேடக்காரர்களே
  rationale: மதநெறி சார்ந்த பாசாங்கையும் வெளித்தோற்ற நடிப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οἰκοδομεῖτε
  choice: கட்டுகிறீர்கள்
  rationale: நிகழ்கால வினையின் நேரடியான பொருளைப் பாதுகாக்கிறது; ‘மீண்டும் கட்டுகிறீர்கள்’ என்று மூலத்தில் இல்லாத கருத்தைச் சேர்க்கவில்லை.
- source_word: τάφους
  choice: கல்லறைகளை
  rationale: கட்டப்பட்ட அடக்க இடங்களைக் குறிக்கும் இயல்பான தமிழ் சொல்.
- source_word: προφητῶν
  choice: இறைவாக்கினர்களின்
  rationale: கடவுளின் செய்தியை அறிவிப்பவர்களைக் குறிக்கும் தெளிவான, வழக்கமான தமிழ் இறையியல் சொல்.
- source_word: κοσμεῖτε
  choice: அலங்கரிக்கிறீர்கள்
  rationale: அழகுபடுத்துதல் அல்லது அணிசெய்தல் என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: μνημεῖα
  choice: நினைவுச் சின்னங்களை
  rationale: இதே வசனத்திலுள்ள τάφους என்பதிலிருந்து சொல்லை வேறுபடுத்தி, நினைவுகூரும் கட்டமைப்பு என்ற நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: δικαίων
  choice: நீதிமான்களின்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் உரிச்சொல்லைச் சுருக்கமாகவும் நிலையான இறையியல் மொழியிலும் தருகிறது.
theological_decisions:
- issue: δικαίων என்பதன் பொருள்
  choice: நீதிமான்கள்
  alternative: நேர்மையானவர்கள்
  rationale: இஸ்ரவேலின் விசுவாசமுள்ள, நெறியுள்ள முன்னோர்களைக் குறிக்கும் ஒழுக்க-இறையியல் வகைப்பாட்டைப் பாதுகாக்கிறது; பிற்காலக் கோட்பாட்டைத் தேவையின்றி இறக்குமதி செய்யவில்லை.
- issue: Οὐαὶ என்பதன் தீர்ப்புத் தொனி
  choice: உங்களுக்கு ஐயோ!
  alternative: உங்களுக்கு அழிவு!
  rationale: மூலச்சொல்லில் உள்ள புலம்பல் மற்றும் கண்டனத் தீர்ப்பு ஆகிய இரு நுணுக்கங்களையும் திறந்தவையாக வைத்திருக்கிறது; ‘அழிவு’ என்று விளைவை மிகத் திட்டவட்டமாக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. அழைப்புச் சொற்களின் தொடரும் ‘உங்களுக்கு ஐயோ!’ என்ற தீர்க்கதரிசனக் கண்டனமும் மூலத்தின் சொற்பொழிவு வலிமையைப் பாதுகாக்கின்றன.
