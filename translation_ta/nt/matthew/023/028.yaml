revisions:
- from: அவ்வாறே, நீங்களும் வெளிப்புறத்தில் மக்களுக்கு நீதிமான்களாகத் தோன்றுகிறீர்கள்; ஆனால் உட்புறத்தில் வெளிவேடத்தாலும் சட்டமீறுதலாலும் நிறைந்திருக்கிறீர்கள்.
  to: அவ்வாறே, நீங்களும் வெளிப்புறத்தில் மக்களுக்கு நீதிமான்களாகத் தோன்றுகிறீர்கள்; ஆனால் உட்புறத்தில் வெளிவேடமும் சட்டமீறுதலும் நிறைந்தவர்களாக இருக்கிறீர்கள்.
  rationale: The revision retains every semantic element of the draft while correcting the grammatical relationship of ‘hypocrisy and lawlessness’ to ‘full.’ It preserves the balanced external/internal contrast and the sense of apparent, rather than actual, righteousness.
