  timestamp: '2026-07-16T04:12:24Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the comparative οὕτως, the outward/inward contrast, apparent righteousness before people, and the charge of ἀνομία. However, the Greek genitives ὑποκρίσεως καὶ ἀνομίας depend on μεστοί ('full of'), not on an instrumental sense.
  naturalness: The wording is generally clear in modern standard Tamil. Repeating 'நிறைந்திருக்கிறீர்கள்' with a direct coordinated complement is more natural and removes the misleading instrumental reading created by '-ஆல்.'
  terminology: ‘நீதிமான்களாக,’ ‘வெளிவேடம்,’ and ‘சட்டமீறுதல்’ are suitable in this context. ‘வெளிவேடம்’ adequately expresses hypocrisy/pretense without importing doctrine.
  issues:
  - severity: medium
    issue: ‘வெளிவேடத்தாலும் சட்டமீறுதலாலும் நிறைந்திருக்கிறீர்கள்’ gives the nouns an instrumental sense (‘filled by/through hypocrisy and lawlessness’).
    rationale: 'ὑποκρίσεως καὶ ἀνομίας are genitives governed by μεστοί and identify the contents: ‘full of hypocrisy and lawlessness.’ Tamil should use a direct complement such as ‘வெளிவேடமும் சட்டமீறுதலும் நிறைந்தவர்களாக இருக்கிறீர்கள்.’'
  revised_text: அவ்வாறே, நீங்களும் வெளிப்புறத்தில் மக்களுக்கு நீதிமான்களாகத் தோன்றுகிறீர்கள்; ஆனால் உட்புறத்தில் வெளிவேடமும் சட்டமீறுதலும் நிறைந்தவர்களாக இருக்கிறீர்கள்.
  revised_footnotes: []
