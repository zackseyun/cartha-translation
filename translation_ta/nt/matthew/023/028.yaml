id: MAT.23.28
reference: Matthew 23:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς ἔξωθεν μὲν φαίνεσθε τοῖς ἀνθρώποις δίκαιοι, ἔσωθεν δέ ⸂ἐστε μεστοὶ⸃ ὑποκρίσεως καὶ ἀνομίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/028.yaml
  text: In the same way[a], you also outwardly appear righteous to people, but inwardly you are full of hypocrisy and lawlessness.
translation:
  language: ta
  text: அவ்வாறே, நீங்களும் வெளிப்புறத்தில் மக்களுக்கு நீதிமான்களாகத் தோன்றுகிறீர்கள்; ஆனால் உட்புறத்தில் வெளிவேடமும் சட்டமீறுதலும் நிறைந்தவர்களாக இருக்கிறீர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: அவ்வாறே
  rationale: முந்தைய வசனத்தில் வரும் வெள்ளையடிக்கப்பட்ட கல்லறைகளின் ஒப்புமையோடு இந்த வசனத்தை இயல்பாக இணைக்கிறது.
- source_word: ἔξωθεν … ἔσωθεν
  choice: வெளிப்புறத்தில் … உட்புறத்தில்
  rationale: வெளித்தோற்றத்துக்கும் உள்ளார்ந்த உண்மைநிலைக்கும் இடையிலான நேரடியான எதிர்மறை இணைப்பைப் பாதுகாக்கிறது.
- source_word: φαίνεσθε
  choice: தோன்றுகிறீர்கள்
  rationale: அவர்கள் உண்மையிலேயே நீதிமான்கள் என்று கூறாமல், மக்களின் பார்வையில் அப்படித் தென்படுகிறார்கள் என்ற பொருளைத் தருகிறது.
- source_word: τοῖς ἀνθρώποις
  choice: மக்களுக்கு
  rationale: இங்கு ἄνθρωπος பொதுவாக மனிதர்களைக் குறிக்கிறது; நவீனத் தமிழில் ‘மக்களுக்கு’ இயல்பாகவும் பாலினப் பொதுமையுடனும் உள்ளது.
- source_word: δίκαιοι
  choice: நீதிமான்களாக
  rationale: ஒழுக்க மற்றும் இறைநெறிசார் நேர்மையின் தோற்றத்தைத் தக்கவைக்கிறது.
- source_word: μεστοὶ
  choice: நிறைந்திருக்கிறீர்கள்
  rationale: μεστός என்பதன் ‘நிறைந்த’ என்ற நிலைப்பொருளை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ὑποκρίσεως
  choice: வெளிவேடத்தால்
  rationale: உள்ளார்ந்த உண்மைநிலைக்கு மாறாக வெளியில் நல்லவர்களாக நடிப்பதைக் குறிக்கும் சூழல்சார் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: ἀνομίας
  choice: சட்டமீறுதலால்
  rationale: பொதுவான தீமையை மட்டும் அல்லாமல், சட்டத்திற்கும் குறிப்பாக இறைச்சட்டத்திற்கும் எதிரான நடத்தையைக் குறிக்கும் ἀνομία என்பதன் கூர்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: δίκαιοι என்பது உண்மையான நீதிநிலையா அல்லது மனிதர்களுக்குத் தோன்றும் நீதியா?
  choice: மக்களின் பார்வையில் தோன்றும் நீதி
  alternative: உண்மையான நீதிநிலை
  rationale: φαίνεσθε என்ற வினையும், ‘ஆனால் உட்புறத்தில்’ என்ற எதிர்மறைத் தொடரும், இயேசு உண்மையான நீதியை உறுதிப்படுத்தாமல் வெளித்தோற்றத்தை வெளிப்படுத்துகிறார் என்பதைக் காட்டுகின்றன.
- issue: ἀνομία என்பதன் பொருள்
  choice: சட்டமீறுதல்
  alternative: அக்கிரமம் / தீமை
  rationale: ‘சட்டமீறுதல்’ என்ற சொல் νόμος சார்ந்த மூலச்சொல் தொடர்பையும் இறைச்சட்டத்தைப் புறக்கணிக்கும் கருத்தையும் வெளிப்படையாக வைத்திருக்கிறது; அதை வெறும் பொதுவான தீமையாகக் குறுக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்டனத்தின் வலிமையையும் வெளிப்புறம்–உட்புறம் என்ற இணையான அமைப்பையும் காக்கும் கண்ணியமான நடை. தேவையற்ற ஆண்பால் மொழி தவிர்க்கப்பட்டுள்ளது.
