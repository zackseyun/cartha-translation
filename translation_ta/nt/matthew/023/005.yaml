id: MAT.23.5
reference: Matthew 23:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πάντα δὲ τὰ ἔργα αὐτῶν ποιοῦσιν πρὸς τὸ θεαθῆναι τοῖς ἀνθρώποις· πλατύνουσι ⸀γὰρ τὰ φυλακτήρια αὐτῶν καὶ μεγαλύνουσι τὰ ⸀κράσπεδα,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/005.yaml
  text: But they do all their works to be seen by people[b][a], for they widen their phylacteries and enlarge their tassels.
translation:
  language: ta
  text: ஆனால், அவர்கள் தங்கள் செயல்கள் அனைத்தையும் மக்கள் காணும்படியாகச் செய்கிறார்கள். ஏனெனில், அவர்கள் தங்கள் வேதவசனப் பெட்டிகளை[a] அகலப்படுத்தி, தங்கள் ஆடைத் தொங்கல்களை[b] பெரிதாக்குகிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இவை வேதப்பகுதிகள் எழுதப்பட்ட தோல் பட்டைகள் வைக்கப்பட்ட சிறிய தோல் உறைகள். உபாகமம் 6:8 போன்ற வசனங்களுக்குக் கீழ்ப்படிவதன் அடையாளமாகச் சில யூதர்கள் இவற்றை அணிந்தார்கள்.
    reason: cultural_note
  - marker: b
    text: ‘ஆடை விளிம்புத் தொங்கல்கள்’ என்றும் மொழிபெயர்க்கலாம். ஆடைகளில் அணியப்பட்ட இத்தொங்கல்களைப் பற்றி எண்ணாகமம் 15:38–39-ஐ ஒப்பிடுக.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα τὰ ἔργα
  choice: தங்கள் செயல்கள் அனைத்தையும்
  rationale: செயல்களின் முழுமையையும் குறிக்கும் πάντα என்பதையும், ἔργα என்பதன் இயல்பான பொருளையும் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய கருத்துடன் உள்ள முரண்பாட்டைச் சூழலில் இயல்பாகக் காட்டுகிறது.
- source_word: πρὸς τὸ θεαθῆναι τοῖς ἀνθρώποις
  choice: மக்கள் பார்ப்பதற்காகவே
  rationale: இது நோக்கத்தைக் குறிக்கும் கிரேக்கக் கட்டமைப்பு; ἄνθρωποι எல்லா மக்களையும் பொதுவாகக் குறிப்பதால் பாலினம் சாராத ‘மக்கள்’ பயன்படுத்தப்பட்டுள்ளது. ‘வே’ என்பது வெளிக்காட்டும் நோக்கத்தை இயல்பாக வலியுறுத்துகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய குற்றச்சாட்டை விளக்கும் காரணத் தொடர்பைத் தெளிவாகப் பேணுகிறது.
- source_word: φυλακτήρια
  choice: வேதவசனப் பெட்டிகள்
  rationale: வேதப்பகுதிகள் வைக்கப்பட்டு அணியப்பட்ட சிறிய உறைகளைக் குறிக்கும் பொருளை, ஒலிபெயர்ப்பைவிட சாதாரண வாசகர்களுக்குப் புரியும் வகையில் தருகிறது; பண்பாட்டு விவரம் அடிக்குறிப்பில் வழங்கப்படுகிறது.
- source_word: πλατύνουσι
  choice: அகலமாக்கி
  rationale: ‘அகலமாக அல்லது விசாலமாக ஆக்குதல்’ என்ற வினையின் நேரடியான உடல் சார்ந்த படிமத்தைப் பேணுகிறது.
- source_word: κράσπεδα
  choice: ஆடைத் தொங்கல்கள்
  rationale: எண்ணாகமம் 15:38–39 சார்ந்த ஆடைகளின் தொங்கல்கள் அல்லது குஞ்சங்களைத் தெளிவாகக் குறிக்கிறது; ‘விளிம்புகள்’ என்ற பொதுவான சொல்லைவிட குறிப்பானது.
- source_word: μεγαλύνουσι
  choice: பெரிதாக்குகிறார்கள்
  rationale: ‘பெரிதாக்குதல்’ என்ற அடிப்படைப் பொருளைப் பேணுகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘நீளமாக்குதல்’ என்பதைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: யூத சமய அடையாளப் பொருட்களை அவமதிக்கும் தொனியை இறக்குமதி செய்யாமல் மொழிபெயர்த்தல்
  choice: φυλακτήρια என்பதை ‘வேதவசனப் பெட்டிகள்’ என்றும் κράσπεδα என்பதை ‘ஆடைத் தொங்கல்கள்’ என்றும் குறிப்பாக மொழிபெயர்த்து, அவற்றின் பின்னணியை அடிக்குறிப்புகளில் விளக்குதல்.
  alternative: ‘ஃபிலாக்டரிகள்’ என்று ஒலிபெயர்த்தல்; அல்லது ‘ஜெபப் பெட்டிகள்’ மற்றும் ‘ஆடை விளிம்புகள்’ என்று மொழிபெயர்த்தல்.
  rationale: இயேசுவின் கண்டனம் இந்தப் பொருட்களையோ அவற்றுடன் தொடர்புடைய வேதக் கட்டளைகளையோ இலக்காக்காமல், பிறர் காணும்படி அவற்றை மிகைப்படுத்தும் வெளிக்காட்டும் நோக்கத்தையே இலக்காக்குகிறது. குறிப்பான, நடுநிலையான சொற்கள் அந்த வேறுபாட்டைப் பேணுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் மரியாதைமிக்க தொனியிலும் வடிவமைக்கப்பட்டது. கிரேக்கத்தின் காரணத் தொடர்பும் நோக்க வலியுறுத்தலும் பேணப்பட்டுள்ளன; அறிமுகமற்ற சமயச் சொல் ஒலிபெயர்க்கப்படாமல் விளக்கமான தமிழ்ச் சொல் பயன்படுத்தப்பட்டுள்ளது.
