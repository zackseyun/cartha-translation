id: MAT.23.30
reference: Matthew 23:30
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ λέγετε· Εἰ ⸀ἤμεθα ἐν ταῖς ἡμέραις τῶν πατέρων ἡμῶν, οὐκ ἂν ⸁ἤμεθα ⸂αὐτῶν κοινωνοὶ⸃ ἐν τῷ αἵματι τῶν προφητῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/030.yaml
  text: and you say[a], ‘If we had been living in the days of our fathers[b], we would not have been partners with them in the blood of the prophets.’
translation:
  language: ta
  text: மேலும் நீங்கள், “எங்கள் தந்தையரின்[a] நாட்களில் நாங்கள் இருந்திருந்தால், தீர்க்கதரிசிகளின் இரத்தத்தில் அவர்களோடு பங்காளிகளாக[b] இருந்திருக்க மாட்டோம்” என்று சொல்கிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எங்கள் முன்னோர்களின்” என்றும் மொழிபெயர்க்கலாம்; ஆனால் கிரேக்கத்தில் நேரடியாக “எங்கள் தந்தையரின்” என்ற ஆண்பால் சொல் உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “அவர்களோடு பங்குபெற்றவர்களாக” என்றும் மொழிபெயர்க்கலாம்; இச்சூழலில் தீர்க்கதரிசிகளின் இரத்தம் சிந்தப்பட்டதில் பங்கேற்பையும் அதனுடன் தொடர்புடைய இரத்தப்பழியையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγετε
  choice: சொல்கிறீர்கள்
  rationale: நிகழ்காலச் சுட்டுவினையின் இரண்டாம் நபர் பன்மையை இயல்பான நேரடி உரையாகத் தருகிறது.
- source_word: Εἰ ἤμεθα
  choice: நாங்கள் இருந்திருந்தால்
  rationale: கடந்த காலத்தில் நிகழாத ஒன்றைக் கற்பனையாக முன்வைக்கும் நிபந்தனையைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐν ταῖς ἡμέραις
  choice: நாட்களில்
  rationale: ‘காலத்தில்’ என்ற பொருளுடைய கிரேக்க காலக் குறிப்பின் உருவகத்தையும் வேதாகம நடையையும் காக்கிறது.
- source_word: τῶν πατέρων ἡμῶν
  choice: எங்கள் முன்னோர்களின்
  rationale: πατέρων என்பதன் இச்சூழல் பொருள் முந்தைய தலைமுறையினரைச் சுட்டுகிறது; ‘முன்னோர்கள்’ என்பது நவீனத் தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: οὐκ ἂν ἤμεθα
  choice: இருந்திருக்க மாட்டோம்
  rationale: நிகழ்ந்திருக்காத கடந்தகால விளைவைச் சுட்டும் எதிர்மறை நிபந்தனை வடிவத்தைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: αὐτῶν κοινωνοὶ
  choice: அவர்களோடு பங்காளிகளாக
  rationale: κοινωνοί குறிக்கும் உடன்பங்கேற்பைத் தருகிறது; ‘உடந்தையாளர்கள்’ என்று குற்றச்சாட்டின் தீவிரத்தை முன்கூட்டியே அதிகரிக்காமல், உடந்தை என்ற சூழற்பொருளையும் திறந்தே வைக்கிறது.
- source_word: ἐν τῷ αἵματι
  choice: இரத்தத்தில்
  rationale: கிரேக்கத்தின் செறிவான இரத்த உருவகத்தைப் பாதுகாக்கிறது; ‘இரத்தத்தைச் சிந்தியதில்’ என்று விளக்கிப் பொருளைச் சுருக்கவில்லை.
- source_word: τῶν προφητῶν
  choice: தீர்க்கதரிசிகளின்
  rationale: προφητῶν என்பதற்கான பரவலாக அறியப்படும், தெளிவான தமிழ் வேதாகமச் சொல்.
theological_decisions:
- issue: κοινωνοὶ ἐν τῷ αἵματι என்பதில் உள்ள உடந்தையின் அளவு
  choice: “தீர்க்கதரிசிகளின் இரத்தத்தில் அவர்களோடு பங்காளிகளாக” என்று உறவுசார் பங்கேற்பையும் இரத்த உருவகத்தையும் பாதுகாத்தல்
  alternative: “தீர்க்கதரிசிகளைக் கொன்றதில் அவர்களுடைய உடந்தையாளர்களாக”
  rationale: வாக்கியம் முன்னோர்களின் வன்முறையிலும் அதனால் ஏற்பட்ட இரத்தப்பழியிலும் தாங்கள் பங்கேற்றிருக்க மாட்டோம் என்ற கூற்றைத் தருகிறது. ஆனால் கிரேக்கம் நேரடியாக ‘கொலை’ அல்லது ‘இரத்தப்பழி’ என்று சொல்லாததால், பிரதான உரை அந்த விளக்கத்தைத் தீர்மானமாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கடந்தகால எதிர்நிகழ்வு நிபந்தனை தமிழின் இயல்பான ‘இருந்திருந்தால் … இருந்திருக்க மாட்டோம்’ அமைப்பில் தரப்பட்டுள்ளது; கிரேக்கத்தின் ‘இரத்தத்தில்’ என்ற உருவகம் விளக்கவுரையாக மாற்றப்படாமல் காக்கப்பட்டுள்ளது.
