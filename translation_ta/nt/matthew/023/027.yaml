  to: “உங்களுக்கு ஐயோ, மறைநூல் அறிஞர்களே, பரிசேயர்களே, பாசாங்குக்காரர்களே! ஏனெனில் நீங்கள் சுண்ணாம்பு பூசப்பட்ட கல்லறைகளைப்[a] போன்றவர்கள். அவை வெளிப்புறத்தில் அழகாகத் தோன்றுகின்றன; ஆனால் உட்புறத்தில் இறந்தவர்களின் எலும்புகளாலும் எல்லாவிதமான அசுத்தங்களாலும்[b] நிறைந்திருக்கின்றன.”
  rationale: The revision retains the draft's accurate tomb-and-lime image and its explicit contrast between external appearance and interior condition. It restores the Greek rhetorical order, uses clearer modern labels for scribes and hypocrites, and replaces the somewhat narrower “தீட்டு” with broad “அசுத்தம்.” Both footnote anchors remain correctly attached to their relevant expressions.
