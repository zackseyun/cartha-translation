review_pass:
  verdict: revise
  source_fidelity: The draft conveys the denunciatory address, the comparison with lime-coated tombs, the outside/inside contrast, dead persons' bones, and the broad sense of ἀκαθαρσία. The reordered opening is understandable, but restoring the source's initial “Woe to you” more closely retains its rhetorical force. “தீட்டு” can work, though it most readily suggests ritual defilement; “அசுத்தம்,” supported by a note, better preserves the source's intentionally broad reference.
  naturalness: The Tamil is generally fluent. “மறைநூல் அறிஞர்கள்” is clearer and less potentially sectarian than “திருமறை அறிஞர்கள்,” and “பாசாங்குக்காரர்கள்” is a more current, idiomatic designation for hypocrites than “வெளிவேடக்காரர்கள்.”
  terminology: “பரிசேயர்கள்” and “கல்லறைகள்” are suitable. “சுண்ணாம்பு பூசப்பட்ட” accurately represents κεκονιαμένοις. “அசுத்தம்” should remain unqualified in the text so that neither ritual impurity nor moral corruption is made exclusive.
  issues:
  - severity: low
    issue: The opening address places “உங்களுக்கு ஐயோ” after the groups addressed.
    rationale: This is not a meaning error, but beginning with the woe more closely follows Οὐαὶ ὑμῖν and preserves the abrupt prophetic denunciation.
  - severity: medium
    issue: “திருமறை அறிஞர்கள்” is a less precise rendering of γραμματεῖς.
    rationale: The Greek names scribes, a recognized scholarly/legal class. “மறைநூல் அறிஞர்கள்” is natural modern Tamil and avoids the potentially tradition-specific implication of “திருமறை.”
  - severity: low
    issue: “வெளிவேடக்காரர்கள்” is less idiomatic for ὑποκριταί in this moral-religious context.
    rationale: “பாசாங்குக்காரர்கள்” directly communicates hypocritical pretense in contemporary standard Tamil.
  - severity: medium
    issue: “தீட்டு” may foreground ritual defilement more strongly than the broad ἀκαθαρσία permits.
    rationale: The context can include ritual impurity and moral corruption. “அசுத்தம்,” with an explanatory note, better maintains the lexical and contextual breadth.
