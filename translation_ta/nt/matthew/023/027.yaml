reference: Matthew 23:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ⸀παρομοιάζετε τάφοις κεκονιαμένοις, οἵτινες ἔξωθεν μὲν φαίνονται ὡραῖοι ἔσωθεν δὲ γέμουσιν ὀστέων νεκρῶν καὶ πάσης ἀκαθαρσίας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/027.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you are like whitewashed tombs, which outwardly appear beautiful[b], but inwardly are full of dead people's bones and every kind of uncleanness.
translation:
  language: ta
  text: “உங்களுக்கு ஐயோ, மறைநூல் அறிஞர்களே, பரிசேயர்களே, பாசாங்குக்காரர்களே! ஏனெனில் நீங்கள் சுண்ணாம்பு பூசப்பட்ட கல்லறைகளைப்[a] போன்றவர்கள். அவை வெளிப்புறத்தில் அழகாகத் தோன்றுகின்றன; ஆனால் உட்புறத்தில் இறந்தவர்களின் எலும்புகளாலும் எல்லாவிதமான அசுத்தங்களாலும்[b] நிறைந்திருக்கின்றன.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெள்ளையடிக்கப்பட்ட கல்லறைகள்.”
    reason: lexical_alternative
  - marker: b
    text: இங்குள்ள “அசுத்தம்” என்பது சடங்குசார் அசுத்தத்தையும் ஒழுக்கச் சீர்கேட்டையும் உள்ளடக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: Οὐαὶ
  choice: உங்களுக்கு ஐயோ!
  rationale: தீர்ப்பையும் கண்டனத்தையும் வெளிப்படுத்தும் தீர்க்கதரிசனப் பாணியிலான வலிமையைப் பேணுகிறது; வெறும் இரக்க வெளிப்பாடாக மென்மையாக்கவில்லை.
- source_word: γραμματεῖς
  choice: திருமறை அறிஞர்களே
  rationale: யூத மறைநூல்களையும் சட்டத்தையும் நன்கு அறிந்திருந்த இந்த அறிஞர் வகுப்பை, இன்றைய வாசகர்களுக்குப் புரியும் இயல்பான தமிழில் குறிக்கிறது.
- source_word: Φαρισαῖοι
  choice: பரிசேயர்களே
  rationale: குழுவின் பெயருக்கான நிலைபெற்ற தமிழ் ஒலிபெயர்ப்பு.
- source_word: ὑποκριταί
  choice: வெளிவேடக்காரர்களே
  rationale: இச்சூழலில் குற்றஞ்சாட்டப்படும் சமய-ஒழுக்கப் பாசாங்கை இயல்பான, வலிமையான தமிழில் வெளிப்படுத்துகிறது.
- source_word: παρομοιάζετε
  choice: போன்றவர்கள்
  rationale: நேரடி விளிச்சூழலில் ஒப்புமையைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: τάφοις κεκονιαμένοις
  choice: சுண்ணாம்பு பூசப்பட்ட கல்லறைகள்
  rationale: கல்லறைகளுக்குச் சுண்ணாம்புப் பூச்சிடும் காட்சியைத் துல்லியமாகப் பேணுகிறது; உருவகத்தைப் பொதுவான ‘வெள்ளையடித்த’ என்ற மறைபொருளுக்குள் கரைத்துவிடவில்லை.
- source_word: ἔξωθεν μὲν ... ἔσωθεν δὲ
  choice: வெளிப்புறத்தில் ... ஆனால் உட்புறத்தில்
  rationale: வெளித்தோற்றத்துக்கும் உள்ளார்ந்த உண்மைக்கும் இடையிலான கூர்மையான முரண்பாட்டைப் பேணுகிறது.
- source_word: φαίνονται ὡραῖοι
  choice: அழகாகத் தோன்றுகின்றன
  rationale: உண்மையான அழகை அல்ல, பார்வைக்குத் தோன்றும் அழகை வலியுறுத்துகிறது.
- source_word: γέμουσιν
  choice: நிறைந்திருக்கின்றன
  rationale: மூலத்தின் நிகழ்காலத்தையும் ‘நிரம்பியிருத்தல்’ என்ற பொருளையும் இயல்பாகத் தருகிறது.
- source_word: ὀστέων νεκρῶν
  choice: இறந்தவர்களின் எலும்புகள்
  rationale: மரித்த மனிதர்களின் எலும்புகள் என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: πάσης ἀκαθαρσίας
  choice: எல்லாவிதத் தீட்டு
  rationale: சடங்குசார் அசுத்தத்தையும் ஒழுக்கக் கேடையும் உள்ளடக்கக்கூடிய பரந்த சொல்லைத் தேர்ந்தெடுத்து, மூலத்தின் பொருள் விரிவைப் பேணுகிறது.
theological_decisions:
- issue: ἀκαθαρσία என்ற சொல்லின் உருவகப் பொருள்
  choice: ‘தீட்டு’ என்று பரந்த பொருளில் மொழிபெயர்த்தல்
  alternative: ‘சடங்குசார் அசுத்தம்’ அல்லது ‘ஒழுக்கக் கேடு’ என்று ஒரே பொருளாகக் குறுக்குதல்
  rationale: கல்லறை என்ற உருவகம் யூதச் சூழலில் சடங்குசார் தீட்டைக் குறிப்பதாக இருந்தாலும், இயேசுவின் கண்டனம் உள்ளார்ந்த ஒழுக்கச் சீர்கேட்டையும் நோக்குகிறது. ‘தீட்டு’ இரு பரிமாணங்களுக்கும் இடமளிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் கண்டன உரையின் கண்ணியமான வலிமையைப் பேணும் வகையிலும் வடிவமைக்கப்பட்டது. ‘வெளிவேடக்காரர்கள்’ பாசாங்கை நேரடியாகக் குறிக்கிறது; ‘திருமறை அறிஞர்கள்’ பழமையான தொழிற்பெயரை விளக்கமின்றிப் பயன்படுத்துவதைத் தவிர்க்கிறது.
