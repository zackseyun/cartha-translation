  text: ὅστις δὲ ὑψώσει ἑαυτὸν ταπεινωθήσεται, καὶ ὅστις ταπεινώσει ἑαυτὸν ⸀ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/012.yaml
  text: But whoever exalts himself will be humbled[b][a], and whoever humbles himself will be exalted.
translation:
  language: ta
  text: ஆனால் தன்னை உயர்த்திக்கொள்கிற எவரும் தாழ்த்தப்படுவார்[a]; தன்னைத் தாழ்த்திக்கொள்கிற எவரும் உயர்த்தப்படுவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தாழ்ந்த நிலைக்குக் கொண்டுவரப்படுவார்; … உயர்ந்த நிலைக்குக் கொண்டுவரப்படுவார்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: எவரும்
  rationale: நிபந்தனைத் தன்மையுள்ள பொதுவான கூற்றை அறிமுகப்படுத்தும் indefinite relative pronoun; ‘எவரும்’ என்பது பாலினத்தைக் குறிப்பிடாமல் அதன் பழமொழி போன்ற பொதுப்பொருளை இயல்பாகத் தருகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய சூழலோடு உள்ள மென்மையான முரண்பாட்டைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ὑψώσει ἑαυτὸν
  choice: தன்னை உயர்த்திக்கொள்கிற
  rationale: தன்னையே உயர்ந்தவராகக் காட்டுதல் அல்லது உயர்ந்த நிலைக்குக் கொண்டுசெல்ல முயலுதல் என்ற reflexive பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; பொதுவிதிக் கூற்றில் தமிழ் நிகழ்கால உறவெச்சம் இயல்பாக இருந்தாலும் முதன்மை வினையின் எதிர்கால விளைவு காக்கப்படுகிறது.
- source_word: ταπεινωθήσεται
  choice: தாழ்த்தப்படுவார்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தைப் பாதுகாத்து, செய்பவரை வெளிப்படையாகக் குறிப்பிடாமல் விடுகிறது.
- source_word: ταπεινώσει ἑαυτὸν
  choice: தன்னைத் தாழ்த்திக்கொள்கிற
  rationale: தன்னார்வத்துடன் தன்னைத் தாழ்ந்த நிலையில் வைப்பது என்ற reflexive பொருளைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ὑψωθήσεται
  choice: உயர்த்தப்படுவார்
  rationale: முதல் கூறிலுள்ள ‘உயர்த்திக்கொள்கிற’ என்பதுடனான சொல் இணைப்பையும் எதிர்காலச் செயப்பாட்டு வடிவத்தையும் காக்கிறது.
theological_decisions:
- issue: செயப்பாட்டு வினைகளின் செய்பவர்
  choice: செயப்பாட்டு வடிவங்களை வைத்துக்கொண்டு செய்பவரைச் சொல்லாமல் விடுதல்
  alternative: ‘கடவுள் அவரைத் தாழ்த்துவார்/உயர்த்துவார்’ என்று கடவுளை வெளிப்படையான எழுவாயாகக் குறிப்பிடுதல்
  rationale: கிரேக்க மூலத்தில் செயப்பாட்டு வினைகள் உள்ளன; செய்பவர் வெளிப்படையாக அடையாளப்படுத்தப்படவில்லை. ஆகவே, மறைமுகமாக உணரப்படக்கூடிய இறைச் செயல்பாட்டை விளக்கமாகச் சேர்க்காமல் மூலத்தின் திறந்த தன்மை பாதுகாக்கப்படுகிறது.
- issue: ஆண்பால் ஒருமை வடிவத்தின் பொதுப்பொருள்
  choice: ‘எவரும்’ மற்றும் ‘தன்னை’ என்பவற்றைப் பயன்படுத்துதல்
  alternative: ஆண்பாலை வெளிப்படையாகக் குறிக்கும் ‘எவன்’/‘தன்னைத் தானே’ போன்ற வடிவங்களைப் பயன்படுத்துதல்
  rationale: கிரேக்கத்தில் இலக்கண வடிவம் ஆண்பால் ஒருமையாக இருந்தாலும் கூற்று எந்த நபருக்கும் பொருந்தும் பொதுவிதியாக உள்ளது. தமிழின் ‘எவரும்’ மற்றும் ‘தன்னை’ மூலத்தின் ஒருமை reflexive தொடர்பையும் பொதுப்பொருளையும் இயல்பாகத் தருகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை. இரு கூறுகளின் எதிர்மறை இணை அமைப்பும் ‘உயர்த்து/தாழ்த்து’ என்ற சொல் சமநிலையும் பாதுகாக்கப்பட்டுள்ளன.
