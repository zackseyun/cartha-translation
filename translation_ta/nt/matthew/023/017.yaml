  yaml_path: translation/nt/matthew/023/017.yaml
  text: 'You fools and blind men, for which is greater: the gold, or the temple that sanctified the gold?'
translation:
  language: ta
  text: “மூடர்களே, குருடர்களே! ஏனெனில், எது பெரியது—தங்கமா, அல்லது தங்கத்தைப் புனிதமாக்கிய[a] ஆலயமா[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்கத்தைப் பரிசுத்தமாக்கிய.”
    reason: lexical_alternative
  - marker: b
    text: இங்கு “ஆலயம்” என மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொல், இன்னும் குறிப்பாக ஆலயத்தின் உட்பகுதியான பரிசுத்த இடத்தைக் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: μωροὶ
  choice: மூடர்களே
  rationale: நேரடி அழைப்பாக வரும் பன்மைச் சொல்லின் கடுமையான கண்டனத் தொனியை, இன்றைய வாசகர்களுக்குப் புரியும் கண்ணியமான தமிழில் காக்கிறது.
- source_word: τυφλοί
  choice: குருடர்களே
  rationale: நேரடி அழைப்பையும் உருவகக் கண்டனத்தின் வலிமையையும் வெளிப்படையாகக் காக்கிறது.
- source_word: τίς γὰρ μείζων ἐστίν
  choice: ஏனெனில், எது பெரியது
  rationale: τίς குறிப்பிடப்பட்ட இரண்டு பொருட்களுக்கு இடையிலான கேள்வியாக இருப்பதால் ‘எது’ என மொழிபெயர்க்கப்பட்டது; γάρ-இன் விளக்கத் தொடர்பை ‘ஏனெனில்’ காக்கிறது.
- source_word: ὁ χρυσὸς
  choice: தங்கம்
  rationale: சூழலில் ஏற்கெனவே விவாதிக்கப்படும் குறிப்பிட்ட தங்கத்தைக் குறிக்கிறது; தமிழில் இயல்பாகத் தனி வரையறைச் சொல் தேவையில்லை.
- source_word: ὁ ναὸς
  choice: ஆலயம்
  rationale: எருசலேம் ஆலயத்தைக் குறிக்கும் இயல்பான, கண்ணியமான தமிழ்ச் சொல்; ναός இன்னும் குறிப்பாக ஆலயப் பரிசுத்த இடத்தைக் குறிக்கக்கூடியது என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: ὁ ἁγιάσας
  choice: புனிதமாக்கிய
  rationale: இறந்தகாலச் செயப்பெயரெச்ச வடிவை நேரடியாகக் காத்து, ஆலயம் தங்கத்துக்குப் புனித நிலையை அளித்தது என்ற வழிபாட்டுச் சார்ந்த பொருளை வெளிப்படுத்துகிறது.
- source_word: τὸν χρυσόν
  choice: தங்கத்தை
  rationale: கிரேக்கத்தில் மீண்டும் வெளிப்படையாக வரும் பொருளைத் தமிழிலும் மீளக் கூறி வாதத்தின் இணை அமைப்பைக் காக்கிறது.
