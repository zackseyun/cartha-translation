  register: நவீனத் தரத் தமிழில், நேரடியான கண்டனத்தையும் வாதக் கேள்வியின் வலிமையையும் காக்கும் கண்ணியமான நடை. ‘மூடர்களே, குருடர்களே’ என்ற இணை அழைப்பு கிரேக்கத்தின் சொல்லமைப்பை இயல்பான தமிழில் பிரதிபலிக்கிறது.
