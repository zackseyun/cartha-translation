  naturalness: The sentence is understandable and suitably formal. A small word-order adjustment removes the added emphatic force of ‘நீங்கள்தான்’ and makes the Tamil flow more naturally while retaining the accusatory, self-incriminating sense.
  terminology: ‘இறைவாக்கினர்கள்,’ ‘கொலை செய்தவர்கள்,’ ‘மகன்கள்,’ and ‘சாட்சி கூறுகிறீர்கள்’ are accurate, consistent, and appropriate for the passage’s register. The footnote preserves the more literal dative alternative without obscuring the contextual sense in the main text.
