source:
  edition: SBLGNT
  text: ὥστε μαρτυρεῖτε ἑαυτοῖς ὅτι υἱοί ἐστε τῶν φονευσάντων τοὺς προφήτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/031.yaml
  text: So you testify against yourselves that you are sons of those who murdered the prophets[a].
translation:
  language: ta
  text: ஆகவே, நீங்கள் இறைவாக்கினர்களைக் கொலை செய்தவர்களின் மகன்கள் என்று உங்களுக்கே எதிராகச் சாட்சி கூறுகிறீர்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் உங்களுக்கே சாட்சி கூறுகிறீர்கள்.” கிரேக்கச் சொற்றொடரை இன்னும் நேரடியாக இவ்வாறு மொழிபெயர்க்கலாம்; ஆனால் சூழலில் அவர்களுடைய சாட்சி அவர்களையே குற்றப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: ஆகவே
  rationale: முந்தைய கூற்றிலிருந்து வரும் முடிவை அல்லது தீர்மானத்தை இயல்பாகக் காட்டுகிறது.
- source_word: μαρτυρεῖτε
  choice: சாட்சி கூறுகிறீர்கள்
  rationale: சட்டரீதியான சாட்சியமளித்தல் என்ற நுண்ணுணர்வையும், இச்சூழலில் தம்மையே குற்றத்திற்குள் கொண்டுவரும் வலிமையையும் தக்கவைக்கிறது.
- source_word: ἑαυτοῖς
  choice: உங்களுக்கு எதிராக நீங்களே
  rationale: சொல்லுக்கு நெருக்கமான பொருள் ‘உங்களுக்கே’ என்றாலும், சூழலில் அவர்களுடைய சாட்சி அவர்களையே குற்றப்படுத்துவதால் இயல்பான தமிழில் ‘உங்களுக்கு எதிராக’ எனத் தெளிவாக்கப்பட்டுள்ளது.
- source_word: ὅτι
  choice: என்று
  rationale: சாட்சியின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் இணைப்பாக உள்ளது.
- source_word: υἱοί
  choice: மகன்கள்
  rationale: ஆண்பால் பன்மையையும் குடும்ப வழித்தொடர்பு மற்றும் ஒழுக்கரீதியான ஒற்றுமை ஆகிய இரு நுண்ணுணர்வுகளையும் பாதுகாக்கிறது.
- source_word: τῶν φονευσάντων
  choice: கொலை செய்தவர்களின்
  rationale: தவறான, குற்றமுள்ள கொலைச் செயலைக் குறிக்கும் வலிமையைப் பாதுகாக்கிறது.
- source_word: τοὺς προφήτας
  choice: இறைவாக்கினர்களை
  rationale: இஸ்ரவேலின் வரலாற்றில் கடவுளுடைய செய்தியை அறிவித்த அங்கீகரிக்கப்பட்ட தூதர்களைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
theological_decisions:
- issue: υἱοί என்பதை நேரடியாக ‘மகன்கள்’ என்று மொழிபெயர்ப்பதா, அல்லது ‘பிள்ளைகள்/வழித்தோன்றல்கள்’ என்று விரிவாக்குவதா
  choice: மகன்கள்
  alternative: பிள்ளைகள்; வழித்தோன்றல்கள்
  rationale: மூலத்தின் ஆண்பால் குடும்ப மொழியையும் இயேசுவின் குற்றச்சாட்டின் கூர்மையையும் தக்கவைக்கிறது; அதேவேளையில் முன்னோர்களின் பகைமைப் போக்கில் பங்குகொள்ளும் ஒழுக்கரீதியான ஒற்றுமையையும் சூழல் உணர்த்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘தீர்க்கதரிசிகள்’ என்பதற்குப் பதிலாக இயல்பான தமிழான ‘இறைவாக்கினர்கள்’ பயன்படுத்தப்பட்டுள்ளது; சுயக்குற்றச்சாட்டின் சூழல்சார் பொருள் முதன்மை உரையில் வெளிப்படுத்தப்பட்டு, நேரடியான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
