  text: saying[a], “The scribes and the Pharisees sit in Moses’ seat.”
translation:
  language: ta
  text: 'அவர் கூறினார்: “மோசேயின் ஆசனத்தில் மறைநூல் அறிஞர்களும் பரிசேயர்களும் அமர்ந்துள்ளனர்.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மோசேயின் ஆசனத்தில் அமர்கிறார்கள்” அல்லது “மோசேயின் ஆசனத்தில் அமர்ந்தனர்.” கிரேக்க வினைச்சொல் அவர்கள் அந்த இடத்தை வகிப்பதை நடுநிலையாகக் குறிக்கலாம்; அதிகாரத்துடன் தொடர்புடைய அந்த ஆசனத்தை ஏற்றுக்கொண்டனர் என்ற நிழற்பொருளும் இருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: அவர் இவ்வாறு கூறினார்
  rationale: முந்தைய வசனத்தில் தொடங்கிய வாக்கியத்துடன் தொடர்புடைய நிகழ்கால வினையெச்சத்தை, தமிழில் இயல்பாக உரையை அறிமுகப்படுத்தும் முற்றுவினை வடிவில் வழங்குகிறது.
- source_word: Ἐπὶ τῆς Μωϋσέως καθέδρας
  choice: மோசேயின் இருக்கையில்
  rationale: மோசேயுடன் தொடர்புடைய போதனை அதிகாரத்தின் இடத்தைக் குறிக்கும் உருவகத்தைத் தக்கவைக்கிறது; ‘இருக்கை’ என்பது நவீன தமிழில் தெளிவானதும் இயல்பானதும்.
- source_word: ἐκάθισαν
  choice: அமர்ந்திருக்கிறார்கள்
  rationale: இறந்தகாலச் செயலில் விளைந்த தற்போதைய நிலையை இயல்பான தமிழில் காட்டுகிறது; அவர்கள் அந்த அதிகார இடத்தை வகிப்பதையும் தெரிவிக்கிறது, ஆனால் ‘தாங்களாகவே’ என்று மூலத்தில் வெளிப்படையாக இல்லாத பொருளைச் சேர்ப்பதில்லை.
- source_word: οἱ γραμματεῖς
  choice: வேத அறிஞர்கள்
  rationale: திருச்சட்டம் மற்றும் வேத எழுத்துகளில் தேர்ச்சிபெற்ற அங்கீகரிக்கப்பட்ட குழுவை சாதாரண நவீன வாசகர்களுக்குத் தெளிவாகக் குறிக்கிறது; பழமையான தொழிற்பெயரைத் தவிர்க்கிறது.
- source_word: οἱ Φαρισαῖοι
  choice: பரிசேயர்கள்
  rationale: இக்குழுவின் பெயருக்கான தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
theological_decisions:
- issue: ἐκάθισαν என்பது நடுநிலையாக ‘அமர்கிறார்கள்’ என்பதா, அதிகார இடத்தை ஏற்றுக்கொண்டதைக் குறிக்கும் விளைவுநிலையா?
  choice: அமர்ந்திருக்கிறார்கள்
  alternative: அமர்கிறார்கள்; அமர்ந்துகொண்டார்கள்
  rationale: கிரேக்க இறந்தகால வினையின் விளைவுநிலையையும் அதிகார இடத்தை வகிக்கும் கருத்தையும் தக்கவைக்கிறது. அதேவேளை, அவர்கள் அந்த இடத்தைத் தாங்களாகவே கைப்பற்றினார்கள் என்ற குற்றச்சாட்டை மொழிபெயர்ப்பே தீர்மானித்துவிடாமல் விடுகிறது.
translation_notes:
  register: நவீன, மரியாதையான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். ‘வேதபாரகர்’ போன்ற பழமையான சொல்லுக்குப் பதிலாக ‘வேத அறிஞர்கள்’ பயன்படுத்தப்பட்டுள்ளது; அதிகாரத்தைச் சுட்டும் ‘மோசேயின் இருக்கை’ என்ற உருவகம் தக்கவைக்கப்பட்டுள்ளது.
