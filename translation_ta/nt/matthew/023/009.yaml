  source_fidelity: மூலக் கிரேக்கத்தின் தடைச்சொல் (μὴ καλέσητε), ‘பூமியில்’ என்ற எதிர்நிலை, ‘உங்கள் தந்தை’ என்ற உறவுச்சுட்டு, மற்றும் εἷς என்பதன் தனித்த வலிமை ஆகியவை நம்பகமாகக் காக்கப்பட்டுள்ளன. ‘எவரையும்’ என்பது கிரேக்கத்தில் வெளிப்படையாக ஒரு மனிதர்-பெயர்ச்சொல் இல்லாத நிலையில் தமிழில் இயல்பாகத் தேவையான பொதுப்பொருளைத் தருகிறது. ‘விண்ணகத்தவர்’ என்பது ὁ οὐράνιος-இன் பெயரடைசார், சற்றுக் குறியீட்டான பயன்பாட்டைத் தேவையற்ற விளக்கமின்றிக் காட்டுகிறது.
  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘பூமியில் உள்ள எவரையும்’ மற்றும் ‘உங்களுக்குத் தந்தை ஒருவரே’ ஆகியவை இயல்பானவை. ‘விண்ணகத்தவர்’ பொதுவழக்கை விட ஓரளவு உயர்நடையாயினும், இச்சூழலின் சமயப் பதிவிற்கும் மூலத்தின் சுருக்கமான நிறைவிற்கும் பொருந்துகிறது.
