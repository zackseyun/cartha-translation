    reason: lexical_alternative
  - marker: b
    text: அல்லது, “விண்ணகத் தந்தை,” அல்லது “விண்ணகத்தில் இருக்கிறவர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πατέρα μὴ καλέσητε ὑμῶν
  choice: எவரையும் உங்கள் தந்தை என்று அழைக்காதீர்கள்
  rationale: μή உடன் வரும் அயோரிஸ்ட் துணைவினை தடை கட்டளையாக உள்ளது. தனியாக ‘மனிதன்’ என்ற பெயர்ச்சொல் கிரேக்கத்தில் இல்லாததால், தமிழில் இயல்பான பொதுப்பொருளைத் தர ‘எவரையும்’ பயன்படுத்தப்பட்டுள்ளது. ‘உங்கள் தந்தை’ என்பது பட்டம் அல்லது அடையாளப்பெயராக அழைப்பதைக் குறிக்கும் நேரடியான சொல்லாக்கத்தையும் அடுத்த கூற்றுடனான இணைப்பையும் காக்கிறது.
- source_word: ἐπὶ τῆς γῆς
  choice: பூமியில் உள்ள
  rationale: விண்ணகத்தவருடன் அமைந்த இடவியல் முரண்பாட்டை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἷς γάρ ἐστιν ὑμῶν ὁ πατήρ
  choice: ஏனெனில், உங்களுக்குத் தந்தை ஒருவரே
  rationale: εἷς என்பதன் ‘ஒருவர்’ என்ற நேரடி பொருளைக் காத்து, சூழல் தரும் தனித்தன்மையை ‘ஒருவரே’ இயல்பாக வெளிப்படுத்துகிறது. ὑμῶν என்பதிலுள்ள உறவுமுறையும் காக்கப்படுகிறது.
- source_word: ὁ οὐράνιος
  choice: விண்ணகத்தவர்
  rationale: பெயர்ச்சொல் போலப் பயன்படுத்தப்பட்ட ‘விண்ணகத்துக்குரியவர்’ என்ற பெயரடையின் குறியீட்டுத்தன்மையைப் பாதுகாக்கிறது; கிரேக்கத்தில் இல்லாத ‘தந்தை’ அல்லது ‘விண்ணகத்தில் இருக்கிறவர்’ என்ற விரிவாக்கத்தை முதன்மை உரையில் சேர்க்கவில்லை.
theological_decisions:
- issue: இயேசுவின் தடையின் வரம்பு
  choice: பூமியில் எவரையும் ‘உங்கள் தந்தை’ என்று அழைக்காதீர்கள் என்ற கூற்றை அதன் நேரடியான, வலுவான வடிவில் வைத்தல்
  alternative: எல்லா உயிரியல் அல்லது சமூகப் பயன்பாடுகளையும் முற்றிலும் தடைசெய்வதாக விரிவாக்குதல், அல்லது இது வெறும் மிகைப்படுத்தல் எனக் கருதி கட்டளையை மென்மையாக்குதல்
  rationale: கிரேக்க உரை கூர்மையான தடையை முன்வைக்கிறது. அது சாதாரண குடும்பப் பயன்பாட்டுடன் எவ்வாறு தொடர்புபடுகிறது என்பதை மொழிபெயர்ப்பு தீர்மானிக்காமல், உரையிலுள்ள இறையியல் பதற்றத்தைச் சூழலே விளக்குமாறு காக்கிறது.
- issue: ὁ οὐράνιος என்பதன் விளக்கம்
  choice: ‘விண்ணகத்தவர்’ என்று பெயரடைசார் வடிவை வைத்தல்
  alternative: ‘விண்ணகத் தந்தை’ அல்லது ‘விண்ணகத்தில் இருக்கிறவர்’
  rationale: மாற்று வடிவங்கள் பொருளில் சாத்தியமானவை; ஆனால் முதன்மை உரை கிரேக்கத்தின் சற்றுக் குறியீட்டான பெயரடைப் பயன்பாட்டைத் தெளிவுபடுத்தாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையில் நேரடியும் கண்ணியமுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பரலோகம்’ என்பதற்குப் பதிலாக இயல்பான தமிழ் வடிவமான ‘விண்ணகம்’ தேர்ந்தெடுக்கப்பட்டுள்ளது; கட்டளையின் கடுமையும் மூலத்தின் குறியீட்டான முடிவும் காக்கப்பட்டுள்ளன.
