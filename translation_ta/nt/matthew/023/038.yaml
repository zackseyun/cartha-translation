  verdict: revise
  source_fidelity: The draft accurately represents ἰδού, the present passive ἀφίεται, ‘your house,’ and ἔρημος. However, ‘உங்களுக்கே’ adds an emphatic/exclusive nuance not expressed by the unmodified Greek dative ὑμῖν. ‘உங்களுக்கு’ preserves the dative without adding that emphasis.
  naturalness: ‘இதோ, உங்கள் வீடு பாழடைந்த நிலையில் உங்களுக்கு விடப்படுகிறது’ is clear, dignified modern standard Tamil and retains the solemn pronouncement. The phrase ‘பாழடைந்த நிலையில்’ naturally conveys the desolate condition.
  terminology: ‘வீடு’ appropriately preserves the breadth of οἶκος, and the footnote responsibly identifies ‘ஆலயம்’ as a possible contextual referent without narrowing the main text. ‘பாழடைந்த நிலையில்’ suitably renders ἔρημος.
  issues:
