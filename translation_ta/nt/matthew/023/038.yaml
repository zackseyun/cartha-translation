id: MAT.23.38
reference: Matthew 23:38
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἰδοὺ ἀφίεται ὑμῖν ὁ οἶκος ὑμῶν ⸀ἔρημος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/038.yaml
  text: Look[a], your house is left to you desolate.
translation:
  language: ta
  text: இதோ, உங்கள் வீடு பாழடைந்த நிலையில் உங்களுக்கு விடப்படுகிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உங்கள் ஆலயம்’; ‘உங்கள் வீடு’ என்ற சொற்றொடர் குறிப்பாக ஆலயத்தைக் குறிக்கலாம். எனினும், கிரேக்கத்தில் இந்தச் சொற்றொடர் அதைவிட விரிவான பொருளுக்கு இடமளிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் solemn announcement-ஐ இயல்பான, மரியாதையான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀφίεται
  choice: விடப்படுகிறது
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவத்தைப் பேணி, செய்பவர் யார் என்பதை மொழிபெயர்ப்பில் கூடுதலாக நிர்ணயிக்காமல் விடுகிறது.
- source_word: ὑμῖν
  choice: உங்களுக்கே
  rationale: கிரேக்க வேற்றுமைப் பொருளான ‘உங்களுக்கு’ என்பதைப் பேணுவதோடு, அந்த வீடு அவர்களிடமே விடப்படுவதன் வலியுறுத்தலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ὁ οἶκος ὑμῶν
  choice: உங்கள் வீடு
  rationale: சொற்றொடரின் நேரடியான உருவகத்தைப் பேணி, அதை ஆலயம், எருசலேம் அல்லது இஸ்ரவேல் என்று முதன்மை உரையிலேயே குறுக்கி விளக்கவில்லை.
- source_word: ἔρημος
  choice: பாழடைந்த நிலையில்
  rationale: கைவிடப்பட்ட தன்மையையும் தீர்ப்பினால் நேரும் வெறுமை அல்லது அழிவையும் எடுத்துரைக்கிறது; வெறும் ‘காலியாக’ என்ற குறுகிய பொருளைத் தவிர்க்கிறது.
theological_decisions:
- issue: ‘உங்கள் வீடு’ என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘உங்கள் வீடு’ என்ற விரிவான உருவகமே வைக்கப்பட்டது.
  alternative: ‘உங்கள் ஆலயம்’, ‘எருசலேம்’ அல்லது ‘இஸ்ரவேல் மக்கள்’ என்று வெளிப்படையாகக் குறிப்பிடுதல்.
  rationale: சூழல் ஆலயத்தையும் எருசலேமையும் வலுவாகச் சுட்டினாலும், கிரேக்கச் சொற்றொடர் அவற்றைவிட விரிவானது. ஆகவே அதன் தீர்க்கதரிசனத் தீவிரத்தையும் பொருள் சார்ந்த பதற்றத்தையும் மொழிபெயர்ப்பு தீர்த்துவிடாமல் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் தீர்ப்பை அறிவிக்கும் வசனத்தின் கண்ணியமான, கடுமையான தொனியைப் பேணும் வகையிலும் மொழியாக்கப்பட்டது. ‘உங்களுக்கே’ என்பது இயல்பான தமிழ் வலியுறுத்தலைத் தருகிறது; ‘விடப்படுகிறது’ என்பது மூலத்தின் செயப்பாட்டு அமைப்பைப் பேணுகிறது.
