source:
  edition: SBLGNT
  text: καί· Ὃς ⸀ἂν ὀμόσῃ ἐν τῷ θυσιαστηρίῳ, οὐδέν ἐστιν, ὃς δ’ ἂν ὀμόσῃ ἐν τῷ δώρῳ τῷ ἐπάνω αὐτοῦ ὀφείλει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/018.yaml
  text: And[a], ‘Whoever swears by the altar, it is nothing[b]; but whoever swears by the gift on top of it is obligated.’
translation:
  language: ta
  text: மேலும், “பலிபீடத்தின்மேல் ஆணையிடுகிற எவனும், அது ஒன்றுமில்லை; ஆனால் அதன்மேல் உள்ள காணிக்கையின்மேல் ஆணையிடுகிறவன் கடமைப்பட்டவன்.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καί
  choice: மேலும்
  rationale: முந்தைய வசனத்தில் கண்டிக்கப்படும் போதனைகளின் பட்டியலைத் தொடரும் இணைப்புச் சொல்லாக இயல்பாக அமைகிறது.
- source_word: Ὃς ἂν ... ὀμόσῃ / ὃς δ’ ἂν ... ὀμόσῃ
  choice: சத்தியம் செய்கிற எவருக்கும் ... சத்தியம் செய்கிறவர்
  rationale: ὅς + ἄν மற்றும் இறந்தகாலத் துணைவினை வடிவம் பொதுவான, வரையறுக்கப்படாத நிபந்தனையைத் தெரிவிக்கிறது; தமிழில் இந்த அமைப்பு அதன் பொதுப்படையான பொருளை இயல்பாகத் தருகிறது.
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: பலிபீடத்தின் மீது
  rationale: சத்தியம் செய்யும் மொழிநடையில் ἐν என்பது எதன்மீது சத்தியம் செய்யப்படுகிறது என்பதைக் குறிக்கிறது; தமிழில் ‘மீது’ பொருத்தமானது.
- source_word: θυσιαστήριον
  choice: பலிபீடம்
  rationale: ஆலயத்தில் பலி செலுத்தப்படும் பீடத்தைக் குறிக்கும் வழக்கமான, துல்லியமான தமிழ்ச் சொல்.
- source_word: οὐδέν ἐστιν
  choice: அது ஒன்றுமில்லை
  rationale: கிரேக்கத்தின் சுருக்கத்தையும் தெளிவின்மையையும் காக்கிறது; அந்தச் சத்தியம் செல்லாது என்ற கண்டிக்கப்படும் போதனையின் கருத்தை அடிக்குறிப்பு விளக்குகிறது.
- source_word: ἐν τῷ δώρῳ
  choice: காணிக்கையின் மீது
  rationale: δῶρον என்பது பொதுவாக ‘பரிசு’ என்றாலும், ஆலயப் பலிபீடச் சூழலில் கடவுளுக்குச் செலுத்தப்படும் காணிக்கையைக் குறிக்கிறது.
- source_word: τῷ ἐπάνω αὐτοῦ
  choice: அதன்மேல் உள்ள
  rationale: காணிக்கை பலிபீடத்தின் மேல் இருப்பதைக் குறிக்கும் இடவியல் உறவை இயல்பான தமிழில் தெளிவாகத் தருகிறது.
- source_word: ὀφείλει
  choice: கடமைப்பட்டவர்
  rationale: சத்தியத்தால் ஏற்படும் அறநெறி சார்ந்த கட்டுப்பாட்டைத் தெரிவிக்கிறது; ஆனால் கிரேக்கத்தில் கூறப்படாத செயற்பொருளைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: சத்தியத்தால் உண்டாகும் கடமையின் கூறப்படாத செயற்பொருள்
  choice: ‘கடமைப்பட்டவர்’ என்று மட்டும் மொழிபெயர்த்தல்
  alternative: ‘தமது சத்தியத்தை நிறைவேற்றக் கடமைப்பட்டவர்’ அல்லது ‘அந்தச் சத்தியத்துக்குக் கட்டுப்பட்டவர்’
  rationale: கிரேக்கத்தில் கடமையின் செயற்பொருள் கூறப்படவில்லை. சூழல் அது சத்தியத்தைக் காப்பதைக் குறிக்கிறது என்றாலும், முதன்மை உரை மூலத்தின் சுருக்கத்தைக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் முந்தைய உரையின் தொடர்ச்சி என்பதைக் காட்ட ‘மேலும்’ பயன்படுத்தப்பட்டு, தமிழில் வாக்கியம் இயல்பாக நிறைவடைய சூழலில் வெளிப்படையாக உள்ள ‘என்கிறீர்கள்’ சேர்க்கப்பட்டுள்ளது. பாலினத்தை முன்னிறுத்தாத ‘எவர்’ அமைப்பு பொதுப்படையான கிரேக்கப் பொருளைத் தருகிறது.
