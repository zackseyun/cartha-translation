source:
  edition: SBLGNT
  text: ὁδηγοὶ τυφλοί, ⸀οἱ διϋλίζοντες τὸν κώνωπα τὴν δὲ κάμηλον καταπίνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/024.yaml
  text: Blind guides[a], straining out the gnat but swallowing the camel!
translation:
  language: ta
  text: குருட்டு வழிகாட்டிகளே! கொசுவை வடிகட்டி அகற்றிவிட்டு[a], ஒட்டகத்தையோ விழுங்குகிறவர்களே!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கே பயன்படுத்தப்பட்டுள்ள கிரேக்க வினைச்சொல், திரவத்தில் உள்ள வேண்டாத ஒன்றை வடிகட்டிப் பிரித்து அகற்றுவதைக் குறிக்கிறது.
    reason: lexical_clarification
lexical_decisions:
- source_word: ὁδηγοὶ
  choice: வழிகாட்டிகளே
  rationale: மற்றவர்களை நடத்திச் செல்பவர்களைக் குறிக்கும் சொல்லாகவும், உருவகத்தை நேரடியாகத் தக்கவைக்கும் இயல்பான தமிழ்ச் சொல்லாகவும் உள்ளது. கிரேக்கத்தில் வடிவம் பெயரெச்ச அழைப்பைச் சுட்டுவதால் தமிழ் அழைப்புவிகுதி பயன்படுத்தப்பட்டுள்ளது.
- source_word: τυφλοί
  choice: குருட்டு
  rationale: ஆவிக்குரிய உணர்வின்மையைச் சுட்டும் கடுமையான உருவகக் கண்டனத்தை மென்மைப்படுத்தாமல் தக்கவைக்கிறது.
- source_word: διϋλίζοντες
  choice: வடிகட்டி அகற்றிவிட்டு
  rationale: திரவத்தில் இருக்கும் ஒன்றை வடிகட்டிப் பிரித்து அகற்றும் செயலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; பின்னர் வரும் முரண்பாட்டைத் தமிழில் ஓட்டமாக இணைக்கிறது.
- source_word: τὸν κώνωπα
  choice: கொசுவை
  rationale: κώνωψ குறிக்கும் மிகச் சிறிய கொசு வகைப் பூச்சிக்கான பொதுவாகப் புரியும் தமிழ் இணை; ஒட்டகத்துடனான அளவின் அபத்தமான முரண்பாட்டைத் தக்கவைக்கிறது.
- source_word: τὴν δὲ κάμηλον
  choice: ஒட்டகத்தையோ
  rationale: δέ தரும் கூர்மையான முரண்பாட்டை தமிழ் எதிர்மறை ஒப்பீட்டு அமைப்பான ‘-ஐயோ’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: καταπίνοντες
  choice: விழுங்குகிறவர்களே
  rationale: முழுவதுமாக விழுங்கும் மிகைப்படுத்தப்பட்ட படிமத்தை நேரடியாகத் தக்கவைக்கிறது; பங்கேற்புச் சொல்லை அழைப்பாக இயல்பான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: சடங்குத் தூய்மை சார்ந்த உருவகத்தின் வலிமை
  choice: கொசுவை வடிகட்டி அகற்றியும் ஒட்டகத்தை விழுங்குவதுமான தெளிவான படிமத்தை அப்படியே தக்கவைத்தல்
  alternative: சிறிய தவறுகளில் கவனம் செலுத்தி பெரிய தவறுகளைப் புறக்கணிப்பதாக விளக்கவுரை வடிவில் மொழிபெயர்த்தல்
  rationale: மிகச் சிறிய அசுத்தத்தை மிகுந்த கவனத்துடன் அகற்றிக்கொண்டே மிகப் பெரிய அசுத்தத்தை ஏற்றுக்கொள்ளும் அபத்தமான அளவுமாறுபாடே கண்டனத்தின் வலிமை. அதை விளக்கவுரையாகத் தீர்த்துவிடாமல் மூலத்தின் உருவகத்தையும் இறையியல் பதற்றத்தையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் அதே நேரத்தில் இயேசுவின் கூர்மையான கண்டனத்தையும் மிகைப்படுத்தப்பட்ட உருவகத்தையும் கண்ணியமான மொழிநடையில் தக்கவைக்கிறது. ‘குருட்டு’ என்பது மூலத்தின் நேரடியான உருவக வலிமையைப் பாதுகாக்கத் தேர்ந்தெடுக்கப்பட்டது.
