  source_fidelity: மூலக் கிரேக்கத்தின் கூர்மையான அழைப்புக் கண்டனமும், ‘கொசுவை வடிகட்டுதல்/ஒட்டகத்தை விழுங்குதல்’ என்ற மிகைப்படுத்தப்பட்ட முரண்பாட்டுப் படிமமும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. διϋλίζοντες என்பதன் திரவத்தை வடிகட்டி சிறு அசுத்தத்தை அகற்றும் பொருள் ‘வடிகட்டி அகற்றிவிட்டு’ என்பதில் போதுமானளவு வெளிப்படுகிறது; δέ-யின் முரண்பாடும் ‘ஒட்டகத்தையோ’ மூலம் இயல்பாகத் தரப்பட்டுள்ளது.
