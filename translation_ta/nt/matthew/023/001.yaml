  text: Then Jesus spoke to the crowds and to his disciples,
translation:
  language: ta
  text: 'பின்பு இயேசு மக்கள் கூட்டங்களிடமும் தம் சீடர்களிடமும் பேசினார்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: பின்பு
  rationale: கதை நிகழ்வுகளின் தொடர்ச்சியைக் குறிக்கும் கால வினையடை. இச்சூழலில் இயல்பான நவீனத் தமிழ் நடை.
- source_word: ὁ Ἰησοῦς
  choice: இயேசு
  rationale: கிரேக்கக் கதையாடலில் இயல்பாக வரும் முன்னொட்டுடன் கூடிய இயற்பெயர்; தமிழில் பெயருக்கு முன்னொட்டு தேவையில்லை.
- source_word: ἐλάλησεν
  choice: பேசினார்
  rationale: λαλέω என்பதன் எளிய பேசுதல் என்ற பொருளைப் பாதுகாக்கிறது; ‘உரையாற்றினார்’ போன்ற கூடுதல் நுட்பத்தைச் சேர்ப்பதில்லை.
- source_word: τοῖς ὄχλοις
  choice: மக்கள் கூட்டங்களிடம்
  rationale: மூலத்தின் பன்மை வடிவத்தை ‘கூட்டங்கள்’ பாதுகாக்கிறது; ‘மக்கள்’ என்பது தமிழில் பொருளைத் தெளிவாக்குகிறது.
- source_word: καὶ
  choice: -உம் … -உம்
  rationale: இரு பெறுநர் குழுக்களையும் இணைக்கும் καὶ என்பதைக் தமிழின் இயல்பான இணைப்பு அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: தம் சீடர்களிடம்
  rationale: αὐτοῦ என்பதன் உடைமைப் பொருளை ‘தம்’ இயல்பாகக் காட்டுகிறது; μαθηταί என்பதற்கு நிலைபெற்ற தமிழ்ச் சொல் ‘சீடர்கள்’.
