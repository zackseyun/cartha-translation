  register: நவீன நிலையான தமிழ்; எளிமையான, கண்ணியமான வேதாகமக் கதையாடல் நடை. அடுத்த வசனத்தில் வரும் நேரடி உரையை அறிமுகப்படுத்துவதால் இறுதியில் முக்காற்புள்ளி இடப்பட்டுள்ளது.
