id: MAT.23.15
reference: Matthew 23:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι περιάγετε τὴν θάλασσαν καὶ τὴν ξηρὰν ποιῆσαι ἕνα προσήλυτον, καὶ ὅταν γένηται ποιεῖτε αὐτὸν υἱὸν γεέννης διπλότερον ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/015.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! Because you travel over sea and land to make one convert, and when he becomes one[b], you make him twice as much a son of Gehenna as yourselves.
translation:
  language: ta
  text: “மறைநூல் அறிஞர்களே, பரிசேயர்களே, வெளிவேடக்காரர்களே, உங்களுக்கு ஐயோ! ஒருவரை யூத மதத்தில் சேர்ப்பதற்காக[a] நீங்கள் கடலையும் நிலத்தையும் சுற்றித் திரிகிறீர்கள். அவர் யூத மதத்தில் சேர்ந்ததும், அவரை உங்களைவிட இருமடங்கு கெஹென்னாவின் மகனாக்குகிறீர்கள்[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கச் சொல், பிற இனத்தைச் சேர்ந்த ஒருவர் யூத மதத்தில் இணைந்ததைக் குறிக்கிறது; இதை “ஒருவரை மதம் மாறியவராக்குவதற்காக” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “கெஹென்னாவின் மகன்” என்பது கெஹென்னாவுக்கு உரியவர் அல்லது அதன் தீர்ப்புக்குள்ளானவர் என்பதைக் குறிக்கும் மரபுத்தொடர். இதை “நரகத்துக்குரியவராக்குகிறீர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐαὶ
  choice: உங்களுக்கு ஐயோ
  rationale: தீர்க்கதரிசனப் பாணியிலான கண்டனத்தையும் வரவிருக்கும் கேட்டைப் பற்றிய எச்சரிக்கையையும் தக்கவைக்கிறது.
- source_word: γραμματεῖς
  choice: மறைநூல் அறிஞர்கள்
  rationale: யூத மறைநூல்களிலும் சட்டத்திலும் தேர்ச்சி பெற்ற அங்கீகரிக்கப்பட்ட குழுவை, இன்றைய தமிழ் வாசகருக்குப் புரியும் வகையில் குறிக்கிறது.
- source_word: Φαρισαῖοι
  choice: பரிசேயர்கள்
  rationale: அக்கால யூத சமயக் குழுவுக்கான தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: ὑποκριταί
  choice: வெளிவேடக்காரர்கள்
  rationale: சமயநீதியின் தோற்றத்தை வெளியில் காட்டும் பாசாங்கை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: περιάγετε τὴν θάλασσαν καὶ τὴν ξηρὰν
  choice: கடலையும் நிலத்தையும் சுற்றித் திரிகிறீர்கள்
  rationale: வெகுதூரம் சென்று பெருமுயற்சி செய்வதைக் குறிக்கும் மூலத்தின் இணைச்சொல் அமைப்பையும் இயக்கத்தையும் காக்கிறது.
- source_word: ποιῆσαι ἕνα προσήλυτον
  choice: ஒரே ஒருவரை யூத மதத்தைத் தழுவியவராக்குவதற்காக
  rationale: προσήλυτος என்பதன் இச்சூழலுக்குரிய யூத மதமாற்றப் பொருளைத் தெளிவாக்குகிறது; ἕνα என்பதன் வலியுறுத்தலை ‘ஒரே ஒருவர்’ எனத் தக்கவைக்கிறது.
- source_word: ὅταν γένηται
  choice: அவர் அப்படித் தழுவியதும்
  rationale: மதத்தைத் தழுவியவராக ஆகும் முடிவைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது; மூலத்தின் ஒருமைச் சுட்டுதலையும் காக்கிறது.
- source_word: υἱὸν γεέννης
  choice: கெஹென்னாவின் மகன்
  rationale: γεέννα என்ற தனிப்பெயரையும் ‘மகன்’ என்ற செமித்திய உறவுமுறைச் சொல்லாட்சியையும் விளக்கமாக மாற்றாமல் பாதுகாக்கிறது.
- source_word: διπλότερον ὑμῶν
  choice: உங்களைவிட இருமடங்கு
  rationale: ஒப்பீட்டுடன் கூடிய ‘இருமடங்கு’ என்ற மூலப் பொருளைத் தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: γεέννα என்பதன் மொழிபெயர்ப்பு
  choice: கெஹென்னா
  alternative: நரகம்
  rationale: மூலத்தில் உள்ள யூத வரலாற்று மற்றும் இறுதிக்காலப் பின்னணி கொண்ட குறிப்பிட்ட சொல்லைப் பொதுவான ‘நரகம்’ என்று சமப்படுத்தாமல் ஒலிபெயர்க்கிறது.
- issue: υἱὸν γεέννης என்ற செமித்திய மரபுத்தொடர்
  choice: கெஹென்னாவின் மகன்
  alternative: கெஹென்னாவுக்கு உரியவர் / நரகத்துக்குரியவர்
  rationale: மூல உருவகத்தையும் அதன் கடுமையான தீர்ப்புத் தொனியையும் முதன்மை உரையில் பாதுகாத்து, அதன் கருத்தை அடிக்குறிப்பில் விளக்குகிறது.
- issue: προσήλυτος என்பதன் சூழல்சார் பொருள்
  choice: யூத மதத்தைத் தழுவியவர்
  alternative: மதம் மாறியவர் / புரோசிலைட்
  rationale: இங்கு பொதுவான எந்த மதமாற்றமும் அல்லாமல் யூத மதத்தில் சேரும் ஒருவரே குறிக்கப்படுகிறார்; ஆகவே தேவையான சூழல்சார் தெளிவு வழங்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நேரடி கண்டனப் பாணி பயன்படுத்தப்பட்டுள்ளது. வரலாற்றுக் குழுப் பெயரான ‘பரிசேயர்கள்’ மற்றும் பின்னணி முக்கியத்துவம் கொண்ட ‘கெஹென்னா’ தக்கவைக்கப்பட்டுள்ளன; அரிதான கருத்துகள் அடிக்குறிப்புகளில் விளக்கப்பட்டுள்ளன.
