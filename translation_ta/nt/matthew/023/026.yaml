source:
  edition: SBLGNT
  text: Φαρισαῖε τυφλέ, καθάρισον πρῶτον τὸ ἐντὸς τοῦ ποτηρίου ⸂καὶ τῆς παροψίδος⸃, ἵνα γένηται καὶ τὸ ἐκτὸς ⸀αὐτοῦ καθαρόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/026.yaml
  text: Blind Pharisee[a], first clean the inside of the cup and the dish, so that its outside also may become clean.
translation:
  language: ta
  text: குருட்டுப் பரிசேயனே, முதலில் கிண்ணத்தினதும் உணவுத் தட்டினதும்[a][b] உட்புறத்தைத் தூய்மையாக்கு; அதன் வெளிப்புறமும் தூய்மையாகும்படி செய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உணவுத் தட்டு’ என்பதற்கான கிரேக்கச் சொல் (παροψίς), உணவு வைக்க அல்லது பரிமாறப் பயன்படும் கிண்ணம், அகன்ற பாத்திரம், அல்லது பெரிய தட்டையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சில பழங்காலக் கையெழுத்துப் பிரதிகளில் ‘உணவுத் தட்டினதும்’ என்ற சொற்றொடர் இல்லை.
    reason: textual_variant
lexical_decisions:
- source_word: Φαρισαῖε τυφλέ
  choice: குருட்டுப் பரிசேயனே
  rationale: இரண்டு சொற்களும் ஒருமை விளிவேற்றுமையில் நேரடி அழைப்பாக உள்ளன. இயேசுவின் கடுமையான ஆன்மீக உருவகத்தையும் ‘பரிசேயன்’ என்ற குறிப்பிட்ட குழுப்பெயரையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: καθάρισον πρῶτον
  choice: முதலில் … தூய்மையாக்கு
  rationale: முதன்மையையும் ஒருமை கட்டளையின் தீர்மானமான தன்மையையும் காக்கிறது. ‘தூய்மையாக்கு’ என்பது பாத்திரத்தைச் சுத்தப்படுத்தும் நேரடி படிமத்தையும் ஒழுக்கத் தூய்மை குறித்த உட்பொருளையும் தாங்குகிறது.
- source_word: τὸ ἐντὸς τοῦ ποτηρίου
  choice: கிண்ணத்தின் … உட்புறம்
  rationale: ποτήριον என்பதற்கான இயல்பான பாத்திரப் பெயரையும், substantivized ἐντός குறிக்கும் உள்ளேயுள்ள பகுதியையும் தெளிவாகத் தருகிறது.
- source_word: καὶ τῆς παροψίδος
  choice: உணவுத் தட்டு
  rationale: παροψίς உணவு வைக்க அல்லது பரிமாறப் பயன்படும் தட்டு, கிண்ணம் போன்ற பாத்திரத்தைக் குறிக்கிறது. ‘உணவுத் தட்டு’ அதன் பயன்பாட்டை இயல்பான தமிழில் காட்டுகிறது; வடிவத்தை மிகையாகக் குறுக்கவில்லை.
- source_word: ἵνα γένηται καὶ τὸ ἐκτὸς αὐτοῦ καθαρόν
  choice: அப்பொழுது அதன் வெளிப்புறமும் தூய்மையாகும்
  rationale: உட்புறத் தூய்மையைத் தொடர்ந்து வெளிப்புறமும் தூய்மையாகும் என்ற நோக்கம்/விளைவு உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது. αὐτοῦ என்ற ஒருமை வடிவத்துக்கேற்ப ‘அதன்’ என வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: பாத்திரப் படிமமா அல்லது வெளிப்படையான ஒழுக்க விளக்கமா
  choice: கிண்ணம் மற்றும் உணவுத் தட்டின் உட்புறம்–வெளிப்புறம் என்ற நேரடிப் படிமத்தை அப்படியே வைத்தல்
  alternative: ‘முதலில் உன் உள்ளத்தைத் தூய்மையாக்கு; அப்பொழுது உன் வெளிவாழ்க்கையும் தூய்மையாகும்’ என்று உருவகத்தை விளக்கிப் பெயர்த்தல்
  rationale: மூலவாக்கியம் ஒழுக்கப் பொருளை நேரடியாக விளக்காமல் பாத்திரப் படிமத்தின் வழியே பேசுகிறது. அதை விளக்கமாக மாற்றுவது உரையின் சொல்லாட்சியையும் தாக்கத்தையும் குறைக்கும்.
- issue: ἵνα என்பதிலுள்ள நோக்கம்/விளைவு உறவு
  choice: ‘அப்பொழுது … தூய்மையாகும்’ என்று விளைவு சார்ந்த இயல்பான தமிழில் தருதல்
  alternative: ‘… தூய்மையாகும்படி’ என்று வெளிப்படையான நோக்கக் கட்டமைப்பில் தருதல்
  rationale: இச்சூழலில் ἵνα உட்புறத்தை முதலில் தூய்மையாக்குவதால் ஏற்படும் தொடர்புடைய முடிவைச் சுட்டுகிறது. தேர்ந்த வடிவம் அந்த உறவைத் தெளிவாக்கினாலும் காரணவியல் விளக்கத்தை கூடுதலாகச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், நேரடியும் கண்ணியமுமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘குருட்டுப் பரிசேயனே’ என்பது மூலத்தின் கடுமையான நேரடி அழைப்பை மென்மையாக்காமல் காக்கிறது. பாத்திரப் படிமம் விளக்கவுரையாக மாற்றப்படவில்லை.
