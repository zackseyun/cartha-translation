source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι καθαρίζετε τὸ ἔξωθεν τοῦ ποτηρίου καὶ τῆς παροψίδος, ἔσωθεν δὲ γέμουσιν ἐξ ἁρπαγῆς καὶ ⸀ἀκρασίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/025.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you clean the outside of the cup and the dish, but inside they are full of greed and self-indulgence.
translation:
  language: ta
  text: “உங்களுக்கு ஐயோ, மறைநூல் அறிஞர்களே, பரிசேயர்களே, வெளிவேடக்காரர்களே! ஏனெனில் கிண்ணத்தையும் தட்டையும் வெளிப்புறத்தில் சுத்தம் செய்கிறீர்கள்; ஆனால் அவற்றின் உட்புறங்கள் அபகரிப்பாலும் தன்னடக்கமின்மையாலும்[a] நிறைந்திருக்கின்றன.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அபகரிப்பு” என்பதற்கு “கொள்ளை,” “சுரண்டிப் பறித்தல்,” அல்லது சூழலுக்கு ஏற்ப “பேராசை” என்றும் பொருள் கொள்ளலாம். “தன்னடக்கமின்மை” என்பதற்கு “கட்டுப்பாடற்ற இன்பநுகர்வு” அல்லது “அளவுகடந்த போக்கு” என்றும் பொருள் கொள்ளலாம். கிரேக்கச் சொற்கள் பிறரிடமிருந்து சுரண்டிப் பெறுதலையும் ஆசைகளைக் கட்டுப்படுத்தாத நிலையையும் வலுவாகக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: உங்களுக்கு ஐயோ
  rationale: தீர்க்கதரிசனக் கண்டனத்தின் கடுமையைத் தக்கவைத்து, நவீனத் தமிழிலும் புரியக்கூடியதாக உள்ளது.
- source_word: γραμματεῖς
  choice: மறைநூல் அறிஞர்கள்
  rationale: ‘வேதபாரகர்’ என்ற பழைய வழக்கைத் தவிர்த்து, யூத மறைநூல்களையும் சட்டத்தையும் நன்கு அறிந்த எழுத்தறிஞர்களைக் குறிக்கும் இயல்பான நவீனத் தமிழ்.
- source_word: Φαρισαῖοι
  choice: பரிசேயர்கள்
  rationale: இக்குழுவின் பெயருக்கான நிலைபெற்ற தமிழ் ஒலிபெயர்ப்பு.
- source_word: ὑποκριταί
  choice: வெளிவேடக்காரர்கள்
  rationale: மதநல்லொழுக்கம் உள்ளவர்கள்போல் பாசாங்கு செய்வோர் என்ற சூழல்சார்ந்த பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: καθαρίζετε
  choice: சுத்தம் செய்கிறீர்கள்
  rationale: நிகழ்காலச் செயலைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: τὸ ἔξωθεν
  choice: வெளிப்புறத்தில்
  rationale: ἔσωθεν என்பதுடன் உள்ள வெளி–உள் முரணை நேரடியாகப் பாதுகாக்கிறது.
- source_word: ποτηρίου
  choice: கிண்ணம்
  rationale: குடிப்பதற்கான பாத்திரத்தைக் குறிக்கும் பொதுவான, இயல்பான தமிழ் சொல்.
- source_word: παροψίδος
  choice: தட்டு
  rationale: உணவு பரிமாறும் பாத்திரத்தைக் குறிக்கும் பரந்த, பொதுவாகப் புரியும் சொல்; குறிப்பிட்ட வடிவத்தைத் தேவையின்றி நிர்ணயிக்கவில்லை.
- source_word: ἔσωθεν
  choice: உட்புறம்
  rationale: பாத்திரங்களின் வெளிப்புறத்துக்கு எதிரான உட்பகுதியைத் தெளிவாகக் காட்டுகிறது.
- source_word: γέμουσιν
  choice: அவற்றின் உட்புறமோ … நிறைந்திருக்கிறது
  rationale: கிரேக்கப் பன்மை வினை கிண்ணம், தட்டு ஆகிய இரண்டையும் குறிக்கிறது; தமிழில் ‘அவற்றின்’ என்பதால் அந்தப் பன்மைத் தொடர்பு வெளிப்படுகிறது.
- source_word: ἁρπαγῆς
  choice: பறித்தெடுக்கும் பேராசை
  rationale: வெறும் மனப்பேராசை என்ற மென்மையான பொருளோடு நிறுத்தாமல், பிறருடையதைப் பலவந்தமாகவோ சுரண்டலாகவோ கைப்பற்றும் சொல்லின் வலிமையையும் தக்கவைக்கிறது.
- source_word: ἀκρασίας
  choice: தன்னடக்கமின்மை
  rationale: ஆசைகளை அடக்கி ஆளாத நிலை என்ற கிரேக்கச் சொல்லின் அடிப்படைப் பொருளை நேரடியாக வழங்குகிறது; ‘அளவுகடந்த இன்பநுகர்வு’ என்பது சூழல்சார்ந்த மாற்றாகும்.
theological_decisions:
- issue: உட்புற அசுத்தத்தின் உருவகக் குறிப்பு
  choice: ‘அவற்றின் உட்புறம்’ என்று கிண்ணம், தட்டு ஆகிய பாத்திரங்களையே இலக்கண நிலையில் குறிப்பது
  alternative: ‘உங்கள் உட்புறம்’ அல்லது ‘உங்கள் உள்ளம்’ என்று தலைவர்களை நேரடியாகக் குறிப்பது
  rationale: கிரேக்க வாக்கியம் உருவகத்தைப் பாத்திரங்களின் நிலையிலேயே வைத்திருக்கிறது; அது தலைவர்களைச் சுட்டுவது தெளிவாக இருந்தாலும், மொழிபெயர்ப்பில் சொல்லப்படாத விளக்கத்தைச் சேர்க்காமல் உருவகத்தைப் பாதுகாக்கிறது.
- issue: ἁρπαγή என்பதின் அறநெறிசார் வலிமை
  choice: ‘பறித்தெடுக்கும் பேராசை’ என்று கைப்பற்றும் செயலும் உள்ளார்ந்த பேராசையும் இணைந்த வகையில் மொழிபெயர்ப்பது
  alternative: ‘பேராசை’ மட்டும் அல்லது ‘கொள்ளை’ மட்டும்
  rationale: இச்சொல் பேராசையையும் கொள்ளை, பறிப்பு, சுரண்டல் போன்ற பிறரிடமிருந்து கைப்பற்றுதலையும் உணர்த்தக்கூடும்; ஒரே குறுகிய பொருளாக முடிவுசெய்யாமல் அதன் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் கண்டனத்தின் கண்ணியமான தீவிரம் குறையாத வகையிலும் அமைக்கப்பட்டது. ‘வேதபாரகர்’, ‘மாயக்காரர்’ போன்ற பழைய அல்லது தெளிவற்ற மரபுச் சொற்களுக்குப் பதிலாக ‘மறைநூல் அறிஞர்கள்’, ‘வெளிவேடக்காரர்கள்’ பயன்படுத்தப்பட்டுள்ளன.
