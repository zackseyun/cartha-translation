  text: And they love the places of honor at banquets and the best seats in the synagogues[c][b][a],
translation:
  language: ta
  text: அவர்கள் விருந்துகளில் முதன்மையான இடத்தையும்[a][c], சபைக்கூடங்களில் முதன்மையான இருக்கைகளையும்[b] விரும்புகிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பந்தியில் முதன்மையான இடம்.” பண்டைய உலகின் முறையான விருந்துகளில் மரியாதைக்குரிய சாய்ந்து உணவருந்தும் இடத்தை இது குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “முதன்மை இருக்கைகள்.” கிரேக்கச் சொல் மிக உயர்ந்த அந்தஸ்தையோ முன்னுரிமையையோ பெற்ற இருக்கைகளை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: பண்டைய மத்தியதரைக் கடல் உலகின் விருந்துகளில், ஒருவர் அமர்ந்த அல்லது சாய்ந்திருந்த இடம் அவரது மரியாதை நிலையை வெளிப்படையாகக் காட்டியது. ஆகவே, இங்கு வசதிக்கான விருப்பம் அல்ல; பொதுமக்கள் முன்னிலையில் உயர்ந்த அந்தஸ்தைப் பெறுவதற்கான ஆசையே சுட்டப்படுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: φιλοῦσι
  choice: விரும்புகிறார்கள்
  rationale: இங்கு φιλέω என்பது உடன்படிக்கை சார்ந்த அன்பை அல்ல, வலுவான விருப்பத்தை வெளிப்படுத்துகிறது. “விரும்புகிறார்கள்” என்பது இயல்பான நவீனத் தமிழில் இயேசுவின் கண்டனத் தொனியையும் காக்கிறது.
- source_word: δὲ
  choice: மேலும்
  rationale: δέ இங்கு வலுவான முரண்பாட்டைக் குறிக்காமல், முந்தைய நடத்தைகளின் விவரிப்பைத் தொடரும் மென்மையான இணைப்பாக உள்ளது.
- source_word: πρωτοκλισίαν
  choice: முதன்மையான இடம்
  rationale: பண்டைய முறையான விருந்துகளில் உணவருந்தும்போது சாய்ந்திருப்பதற்குரிய மிக உயர்ந்த மதிப்பு கொண்ட இடத்தை இச்சொல் குறிக்கிறது. ஒருமை வடிவத்தையும் சமூக மரியாதை சார்ந்த பொருளையும் இம்மொழிபெயர்ப்பு காக்கிறது.
- source_word: ἐν τοῖς δείπνοις
  choice: விருந்துகளில்
  rationale: δεῖπνον என்பது இரவு உணவு அல்லது உணவு விருந்தைக் குறிக்கும்; இச்சூழலில் பொதுவாக மரியாதை நிலைகள் வெளிப்பட்ட முறையான விருந்துகள் கருதப்படுவதால் “விருந்துகளில்” இயல்பாகப் பொருந்துகிறது.
- source_word: πρωτοκαθεδρίας
  choice: முதன்மையான இருக்கைகள்
  rationale: மிக உயர்ந்த அந்தஸ்து அல்லது முன்னுரிமை பெற்ற இருக்கைகளை இச்சொல் குறிக்கிறது. “முதன்மையான இருக்கைகள்” என்பது அதன் பன்மையையும் அந்தஸ்து சார்ந்த வலியுறுத்தலையும் தெளிவாகக் காட்டுகிறது.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: ஜெபக்கூடங்களில்
  rationale: யூதர்கள் வழிபாட்டிற்கும் வேத வாசிப்பிற்கும் கூடிவந்த இடங்களைக் குறிக்கும் வகையில், தமிழ்க் கிறிஸ்தவ வாசகர்களுக்குப் பரிச்சயமானதும் புரிந்துகொள்ளத்தக்கதுமான சொல்லாக “ஜெபக்கூடங்கள்” பயன்படுத்தப்பட்டுள்ளது.
