id: MAT.23.33
reference: Matthew 23:33
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὄφεις γεννήματα ἐχιδνῶν, πῶς φύγητε ἀπὸ τῆς κρίσεως τῆς γεέννης;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/033.yaml
  text: You snakes[a], offspring of vipers! How will you escape from the judgment of Gehenna?
translation:
  language: ta
  text: பாம்புகளே, விரியன் பாம்புகளின் குட்டிகளே! கெஹென்னாவின்[a] தீர்ப்பிலிருந்து நீங்கள் எப்படித் தப்புவீர்கள்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “நரகத்தின் தீர்ப்பு.” கிரேக்கத்தில்: “கெஹென்னா.”'
    reason: மூலச் சொல்லின் பொதுவான மொழிபெயர்ப்பையும் கிரேக்கப் பெயரையும் வாசகருக்குத் தெளிவுபடுத்துகிறது.
lexical_decisions:
- source_word: ὄφεις
  choice: பாம்புகளே
  rationale: நேரடியான விளிவேற்றுமை வசைமொழியை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: γεννήματα
  choice: குட்டிகளே
  rationale: பிறந்தவை அல்லது சந்ததி என்ற பொருளை, பாம்பு உருவகத்தோடு இயல்பாக இணைத்து வெளிப்படுத்துகிறது.
- source_word: ἐχιδνῶν
  choice: விரியன் பாம்புகளின்
  rationale: பொதுவான பாம்புகளிலிருந்து வேறுபட்ட நச்சுப்பாம்பு வகையைக் குறிப்பிட்டு, கண்டனத்தின் தீவிரத்தைப் பாதுகாக்கிறது.
- source_word: πῶς
  choice: எப்படி
  rationale: தப்புவதற்கான சாத்தியத்தையும் எதிர்கால எதிர்பார்ப்பையும் கேள்விக்குள்ளாக்கும் சொல்லாட்சிக் கேள்வியின் திறந்த தன்மையைப் பேணுகிறது.
- source_word: φύγητε
  choice: தப்புவீர்கள்
  rationale: தீர்ப்பிலிருந்து விடுபடுதல் என்ற சூழலுக்குப் பொருத்தமான, எதிர்கால நோக்குள்ள இயல்பான தமிழ் வினை வடிவம்.
- source_word: κρίσεως
  choice: தீர்ப்பிலிருந்து
  rationale: கிரேக்கச் சொல்லின் நீதித்துறை சார்ந்த பரந்த பொருளைப் பேணுகிறது; ‘தண்டனைத் தீர்ப்பு’ என்று வலுப்படுத்தி விளக்கவில்லை.
- source_word: γεέννης
  choice: கெஹென்னாவின்
  rationale: யூத வரலாற்று மற்றும் இறுதிக்காலப் பின்னணியுடைய குறிப்பிட்ட கிரேக்கச் சொல்லை ‘நரகம்’ என்று முழுமையாகப் பொதுமைப்படுத்தாமல் ஒலிபெயர்த்துள்ளது.
theological_decisions:
- issue: γέεννα என்பதன் மொழிபெயர்ப்பு
  choice: கெஹென்னா
  alternative: நரகம்
  rationale: மூலமொழிச் சொல்லின் தனித்துவத்தையும் அதன் யூதப் பின்னணியையும் பாதுகாக்கிறது. வாசகர்களுக்குப் பரிச்சயமான ‘நரகம்’ என்பது அடிக்குறிப்பில் மாற்று மொழிபெயர்ப்பாக வழங்கப்படுகிறது.
- issue: κρίσις என்பதன் வலிமை
  choice: தீர்ப்பு
  alternative: கண்டனத் தீர்ப்பு
  rationale: இச்சொல் இங்கு அச்சுறுத்தும் இறைநீதித் தீர்ப்பைக் குறித்தாலும், தனியாகப் பார்க்கும்போது கிரேக்கம் கட்டாயமாக ‘கண்டனம்’ என்று வெளிப்படையாகச் சொல்லவில்லை; ஆகவே அதன் பரந்த நீதித்துறைப் பொருள் பேணப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியானதும் கண்ணியமானதும் கடுமையான கண்டனத் தொனியுடையதுமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் சொல்லாட்சிக் கேள்வியும் ‘கெஹென்னாவின் தீர்ப்பு’ என்ற இணைப்பின் சுருக்கமும் விளக்கிச் சீராக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
