  text: οὗτος προσελθὼν τῷ Πιλάτῳ ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ. τότε ὁ Πιλᾶτος ἐκέλευσεν ⸀ἀποδοθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/058.yaml
  text: He went to Pilate and asked for the body of Jesus[a]. Then Pilate ordered it to be given to him.
translation:
  language: ta
  text: இவர் பிலாத்துவிடம் சென்று, இயேசுவின் உடலைக் கேட்டார். அப்போது பிலாத்து அதை அவருக்குக் கொடுக்கும்படி கட்டளையிட்டான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதை ஒப்படைக்கும்படி.” இங்குள்ள கிரேக்க வினைச்சொல்லை, சூழலுக்கேற்ப ‘கொடுக்க’ அல்லது ‘ஒப்படைக்க’ என்று மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: இவர்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட அரிமத்தியா ஊரைச் சேர்ந்த யோசேப்பையே இந்தச் சுட்டுப்பெயர் குறிக்கிறது. மரியாதையான நவீன தமிழ் நடையில் ‘இவர்’ இயல்பாக உள்ளது.
- source_word: προσελθὼν
  choice: சென்று
  rationale: பிலாத்துவை நோக்கிச் சென்று அணுகிய முன்ன நிகழ்வை இயல்பான தமிழ் கதைநடையில் தெரிவிக்கிறது.
- source_word: ᾐτήσατο
  choice: கேட்டார்
  rationale: இங்கு ஒரு பொருளைத் தருமாறு கேட்டுக்கொள்வதைக் குறிக்கிறது; ‘இயேசுவின் உடலைக் கேட்டார்’ என்பது தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: இயேசுவின் உடலை
  rationale: σῶμα என்பதன் நேரடிப் பொருளான ‘உடல்’ என்பதே சூழலுக்கு ஏற்றது; ‘சடலம்’ என்பது தேவையற்ற அளவு கடுமையாகவும் மருத்துவச் சொல் போலவும் ஒலிக்கலாம்.
- source_word: τότε
  choice: அப்போது
  rationale: அடுத்தடுத்து நிகழும் செயலைக் குறிக்கும் இயல்பான தமிழ் கதைத் தொடர்புச்சொல்.
- source_word: ἐκέλευσεν
  choice: கட்டளையிட்டான்
  rationale: அதிகாரப்பூர்வமாக ஓர் உத்தரவு கொடுத்ததைக் κελεύω குறிக்கிறது. பிலாத்தைப் பற்றிய கதைநடையில் ஒருமை ஆண்பால் வினைமுற்று இயல்பானது.
- source_word: ἀποδοθῆναι
  choice: அதை அவருக்குக் கொடுக்கும்படி
  rationale: செயப்பாட்டு இறந்தகால வினையெச்சம் உடல் யோசேப்பிடம் வழங்கப்பட வேண்டும் என்ற பிலாத்துவின் உத்தரவைக் குறிக்கிறது. ‘அவருக்கு’ என்பது கிரேக்கத்தில் வெளிப்படையாக இல்லாவிட்டாலும் உடனடி சூழலால் தெளிவாக உணர்த்தப்படும் பெறுநரை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
