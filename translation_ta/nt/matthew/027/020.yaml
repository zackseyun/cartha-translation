  text: Οἱ δὲ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι ἔπεισαν τοὺς ὄχλους ἵνα αἰτήσωνται τὸν Βαραββᾶν τὸν δὲ Ἰησοῦν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/020.yaml
  text: But the chief priests and the elders persuaded the crowds to ask for Barabbas[a], but to destroy Jesus.
translation:
  language: ta
  text: ஆனால், தலைமைக் குருக்களும் மூப்பர்களும் மக்கள் கூட்டங்களைப் பரபாசைக் கேட்கவும், இயேசுவை அழிக்கவும் இணங்கச் செய்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இயேசுவைக் கொன்றுவிடவும்.”
    reason: ἀπολέσωσιν என்பதற்கு இச்சூழலில் பொருந்தும் தெளிவான மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய நிகழ்வுடன் உள்ள முரண்பாட்டை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἀρχιερεῖς
  choice: தலைமைக் குருக்கள்
  rationale: எருசலேமின் பிரதான ஆசாரியத் தலைவர்களைக் குறிக்கும் பன்மையைத் தெளிவாகவும் வரலாற்றுப் பொருளுடனும் வழங்குகிறது.
- source_word: πρεσβύτεροι
  choice: மூப்பர்கள்
  rationale: அங்கீகரிக்கப்பட்ட யூதத் தலைவர்களைக் குறிக்கும் வரலாற்று மற்றும் நிறுவனப் பொருளைப் பாதுகாக்கிறது.
- source_word: ἔπεισαν
  choice: இணங்கச் செய்தார்கள்
  rationale: மக்கள் கூட்டங்கள் குறிப்பிட்ட கோரிக்கையை முன்வைக்கவும் இயேசுவுக்கு அழிவு தேடவும் அவர்களைச் சம்மதிக்கச் செய்த முடிவுற்ற செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τοὺς ὄχλους
  choice: மக்கள் கூட்டங்களை
  rationale: கிரேக்க மூலத்தின் பன்மையையும் திரண்டிருந்த மக்களைக் குறிக்கும் பொருளையும் பாதுகாக்கிறது.
- source_word: ἵνα
  choice: …கேட்கவும் …அழித்துவிடவும்
  rationale: இணங்கச் செய்த செயலின் நோக்கம் அல்லது உள்ளடக்கத்தைத் தமிழின் இணை வினையெச்ச அமைப்பில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: αἰτήσωνται τὸν Βαραββᾶν
  choice: பரபாசைத் தங்களுக்குத் தரும்படி கேட்கவும்
  rationale: நடுநிலை வினையின் தங்களுக்காகக் கோரும் நுணுக்கத்தை வெளிப்படுத்துகிறது; மூலத்தில் நேரடியாக இல்லாத ‘விடுதலை செய்ய’ என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: Βαραββᾶν
  choice: பரபாஸ்
  rationale: பெயரைத் தமிழில் வழக்கமான வடிவில் ஒலிபெயர்க்கிறது; வேற்றுமை உருபுடன் ‘பரபாசை’ என வருகிறது.
- source_word: ἀπολέσωσιν
  choice: அழித்துவிடவும்
  rationale: ஒருவரை அழிவுக்குள்ளாக்குதல் அல்லது ஒழித்தல் என்ற கிரேக்க வினையின் பரந்த சொற்பொருளைப் பாதுகாக்கிறது; இச்சூழலில் கொலை செய்வதைக் குறிக்கும் தெளிவான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τὸν δὲ Ἰησοῦν
  choice: இயேசுவை
  rationale: பரபாசைக் கோருவதற்கும் இயேசுவை அழிப்பதற்கும் இடையிலான எதிர்மறை இணையை வாக்கிய அமைப்பு தெளிவாகக் காட்டுவதால், தமிழில் தனியாக இன்னொரு ‘ஆனால்’ சேர்க்காமல் இயல்பாக வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: நீதித்துறை மரணதண்டனைச் சூழலில் ἀπολέσωσιν என்பதன் மொழிபெயர்ப்பு
  choice: இயேசுவை அழித்துவிடவும்
  alternative: இயேசுவைக் கொன்றுவிடவும்
  rationale: கிரேக்க வினை தொழில்நுட்பமான மரணதண்டனைச் சொல்லைவிடப் பரந்தது; ‘அழித்துவிட’ என்பது அதன் சொற்பொருள் வலிமையைப் பாதுகாக்கிறது. அதேவேளையில், இச்சூழலில் அது இயேசுவைக் கொல்வதைக் குறிக்கிறது என்பதை மாற்று வாசகம் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தலைமைக் குருக்கள்’, ‘மூப்பர்கள்’ ஆகியவை வரலாற்று நிறுவனப் பொருளைப் பேணுகின்றன; கிரேக்கத்தின் பரந்த சொல்லாட்சியும் நீதித்துறைச் சூழலின் தீவிரமும் முதன்மை உரை மற்றும் அடிக்குறிப்பில் சமநிலைப்படுத்தப்பட்டுள்ளன.
