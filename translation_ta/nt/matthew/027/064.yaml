id: MAT.27.64
reference: Matthew 27:64
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: κέλευσον οὖν ἀσφαλισθῆναι τὸν τάφον ἕως τῆς τρίτης ἡμέρας, μήποτε ἐλθόντες οἱ μαθηταὶ ⸀αὐτοῦ κλέψωσιν αὐτὸν καὶ εἴπωσιν τῷ λαῷ· Ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ ἔσται ἡ ἐσχάτη πλάνη χείρων τῆς πρώτης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/064.yaml
  text: Therefore[a], order the tomb to be secured until the third day, lest his disciples come and steal him and say to the people[b], ‘He has been raised from the dead,’ and the last deception will be worse than the first.
translation:
  language: ta
  text: ஆகவே, மூன்றாம் நாள்வரை கல்லறை பாதுகாப்பாக வைக்கப்படும்படி கட்டளையிடுங்கள். இல்லையென்றால், அவருடைய சீடர்கள் வந்து[a] அவரைத் திருடிக்கொண்டு போய், ‘அவர் இறந்தோரிலிருந்து எழுப்பப்பட்டார்[b]’ என்று மக்களிடம் சொல்வார்கள்; அப்போது இறுதியான வஞ்சகம் முதலாவதைவிட மோசமாக இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகள் ‘வந்து’ என்பதற்குப் பிறகு ‘இரவில்’ என்று சேர்த்து, ‘அவருடைய சீடர்கள் இரவில் வந்து அவரைத் திருடிக்கொண்டு போகாதபடி’ என வாசிக்கின்றன. இங்கு குறுகிய வாசகமே பின்பற்றப்பட்டுள்ளது.
    reason: textual_variant
  - marker: b
    text: அல்லது, ‘அவர் இறந்தோரிலிருந்து எழுப்பப்பட்டிருந்தார்.’ கிரேக்க வினை செயப்பாட்டு வடிவில் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: κέλευσον
  choice: கட்டளையிடுங்கள்
  rationale: பிலாத்துவின் அதிகாரத்தைக் கொண்டு தீர்மானமான நடவடிக்கை எடுக்குமாறு கோரும் இறந்தகால ஏவல் வடிவத்தை, இயல்பான மரியாதைப் பன்மை ஏவலாகக் கொடுக்கிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய கூற்றிலிருந்து வரும் முடிவுறுத்தும் தொடர்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἀσφαλισθῆναι
  choice: பாதுகாப்பாக வைக்கப்படும்படி
  rationale: கல்லறையை உறுதிப்படுத்தும் செயலைக் குறிக்கும் செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது; முத்திரையிடுதல் அல்லது காவல் வைப்பது என்ற ஒரு குறிப்பிட்ட முறையை மட்டும் முன்கூட்டியே நிர்ணயிப்பதில்லை.
- source_word: τὸν τάφον
  choice: கல்லறை
  rationale: இயேசு வைக்கப்பட்ட பாறையில் வெட்டப்பட்ட அடக்க இடத்திற்கு நவீனத் தமிழில் இயல்பான சொல்.
- source_word: ἕως τῆς τρίτης ἡμέρας
  choice: மூன்றாம் நாள்வரை
  rationale: கால எல்லையையும் உயிர்த்தெழுதல் குறித்த முன்னறிவிப்புடன் உள்ள சொல் தொடர்பையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: μήποτε
  choice: இல்லையென்றால்
  rationale: தடுக்கப்பட வேண்டிய அச்சத்திற்குரிய சாத்தியத்தை இயல்பான நவீனத் தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: ἐλθόντες
  choice: வந்து
  rationale: முதன்மை வினைகளுக்கு முந்திய பங்கேற்பு செயலைத் தமிழில் இயல்பான வினையெச்சமாகக் கொடுக்கிறது; மூல உரையில் இல்லாத ‘இரவில்’ என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: அவருடைய சீடர்கள்
  rationale: உடைமைத் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: κλέψωσιν αὐτόν
  choice: அவரைத் திருடிக்கொண்டு போய்
  rationale: நேரடி செயப்படுபொருளான ‘அவரை’ என்பதைக் ‘உடலை’ என்று வெளிப்படையாக மாற்றாமல் பாதுகாக்கிறது; தமிழில் இச்சூழலில் செயலை இயல்பாக வெளிப்படுத்த ‘திருடிக்கொண்டு போய்’ பயன்படுத்தப்படுகிறது.
- source_word: εἴπωσιν τῷ λαῷ
  choice: மக்களிடம் சொல்வார்கள்
  rationale: λαός என்பதை அப்போதைய ஒரு கூட்டமாகக் குறுக்காமல், பொதுவாக மக்களைக் குறிக்கும் விதத்தில் வழங்குகிறது.
- source_word: Ἠγέρθη
  choice: எழுப்பப்பட்டார்
  rationale: கிரேக்கச் செயப்பாட்டு வடிவத்தைப் பாதுகாத்து, எழுப்பியவர் யார் என்பதை உரை வெளிப்படையாகச் சொல்லாத நிலையையும் காக்கிறது.
- source_word: ἀπὸ τῶν νεκρῶν
  choice: இறந்தோரிலிருந்து
  rationale: பன்மை வடிவத்தையும் உயிர்த்தெழுதல் சூழலிலுள்ள பொருளையும் சுருக்காமல் வழங்குகிறது.
- source_word: ἡ ἐσχάτη πλάνη
  choice: இறுதியான வஞ்சகம்
  rationale: எதிரிகள் கூறும் மதிப்பீட்டில் உள்ள ‘கடைசி/இறுதி’ மற்றும் ‘வஞ்சகம்’ என்ற கருத்துகளைத் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: உயிர்த்தெழுதல் கூற்றின் செயப்பாட்டு வடிவம்
  choice: அவர் இறந்தோரிலிருந்து எழுப்பப்பட்டார்
  alternative: அவர் இறந்தோரிலிருந்து உயிர்த்தெழுந்தார்
  rationale: Ἠγέρθη என்பது செயப்பாட்டு வினை. ‘எழுப்பப்பட்டார்’ என்பது அந்த வடிவத்தைப் பாதுகாத்து, மறைமுகமாக உள்ள செய்பவரை உரைக்கு அப்பால் வெளிப்படையாகச் சேர்க்காமல் விடுகிறது.
- issue: ‘முதல் வஞ்சகம்’ என்பதன் ஒப்பீடு
  choice: முந்தையதைவிட
  alternative: முதலாவதைவிட
  rationale: τῆς πρώτης என்பது நேரடியாக ‘முதலாவதை’ என வரலாம்; இங்கு முன்னர் கூறப்பட்டதாகக் கருதப்படும் வஞ்சகத்துடன் ஒப்பிடுவதால் ‘முந்தையதைவிட’ என்பது தமிழில் இயல்பாக இருந்து, அது என்ன என்பதைத் தனியாக விளக்கி இறையியல் பதற்றத்தைத் தீர்த்துவிடுவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் கண்ணியமான நடையைக் கொண்ட மொழிபெயர்ப்பு. பிலாத்துவை நோக்கிய உரையில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் செயப்பாட்டு உயிர்த்தெழுதல் மொழியும், ‘அவரை’ என்ற தனிப்பட்ட சுட்டுப்பெயரும் பாதுகாக்கப்பட்டுள்ளன.
