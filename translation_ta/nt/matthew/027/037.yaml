source:
  edition: SBLGNT
  text: καὶ ἐπέθηκαν ἐπάνω τῆς κεφαλῆς αὐτοῦ τὴν αἰτίαν αὐτοῦ γεγραμμένην· Οὗτός ἐστιν Ἰησοῦς ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/037.yaml
  text: 'And they placed above his head the charge against him[a], written: “This is Jesus[b], the King of the Jews.”'
translation:
  language: ta
  text: 'அவர்கள் அவருடைய தலைக்கு மேலாக, எழுதப்பட்டிருந்த அவர்மீதான குற்றச்சாட்டை வைத்தார்கள்: “இவர் யூதர்களின்[b] அரசரான இயேசு.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “யூதர்களின் அரசர்” என்பதற்குப் பதிலாக, “யூதேயர்களின் அரசர்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் சூழலைப் பொறுத்து “யூதர்கள்” அல்லது “யூதேயர்கள்” என இருவிதமாகவும் பொருள்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέθηκαν
  choice: வைத்தார்கள்
  rationale: ἐπιτίθημι என்பதன் இறந்தகால வடிவம் இங்கு எழுத்துப் பலகையை இயேசுவின் தலைக்கு மேலாக வைத்த செயலைக் குறிக்கிறது; ‘வைத்தார்கள்’ என்பது இயல்பான, நேரடியான தமிழ்.
- source_word: ἐπάνω τῆς κεφαλῆς αὐτοῦ
  choice: அவருடைய தலைக்கு மேலாக
  rationale: ἐπάνω + உரிமை வேற்றுமை, தலைக்கு மேற்புறத்தில் இருந்த இடநிலையைத் தெளிவாகக் குறிக்கிறது; தலைமேல் நேரடியாக வைக்கப்பட்டது என்ற தவறான எண்ணத்தை இது தவிர்க்கிறது.
- source_word: τὴν αἰτίαν αὐτοῦ
  choice: அவர்மீதான குற்றச்சாட்டை
  rationale: αἰτία இச்சூழலில் சட்ட அல்லது நீதித்துறை சார்ந்த குற்றச்சாட்டைக் குறிக்கிறது. ‘குற்றச்சாட்டு’ அதன் நீதித்துறைப் பொருளை நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: γεγραμμένην
  choice: எழுதி
  rationale: γράφω என்பதன் நிறைவுற்ற செயப்பாட்டு எச்ச வடிவம், குற்றச்சாட்டு எழுதப்பட்டிருந்ததைச் சொல்கிறது. தமிழ் வாக்கிய அமைப்பில் ‘எழுதி வைத்தார்கள்’ இயல்பாக இதை வெளிப்படுத்துகிறது.
- source_word: Οὗτός ἐστιν
  choice: இவர்
  rationale: சுட்டுப்பெயரும் இணைப்புவினையும் சேர்ந்த கிரேக்கச் சொற்றொடரை, ஒரு நபரைச் சுட்டும் பலகை வாசகத்தில் ‘இவர்’ என்று வழங்குவது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: Ἰησοῦς
  choice: இயேசு
  rationale: தமிழ் வேதாகம மற்றும் பொதுப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: யூதர்களின் அரசர்
  rationale: βασιλεύς அரசப் பட்டத்தைக் குறிக்கிறது; ‘அரசர்’ நவீனத் தமிழில் கண்ணியமானதும் தெளிவானதும். Ἰουδαίων இங்கு மக்கள் குழுவான யூதர்களைக் குறிக்கும் வழக்கமான புரிதலில் மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: சிலுவைத் தண்டனைப் பலகையின் நீதித்துறைச் சொல்
  choice: அவர்மீதான குற்றச்சாட்டு
  alternative: அவருக்கு எதிரான குற்றச்சாட்டு
  rationale: இது மரணதண்டனைக்குக் கூறப்பட்ட அதிகாரபூர்வ காரணத்தைச் சுட்டுகிறது; கூடுதல் இறையியல் விளக்கத்தைச் சேர்க்காமல் αἰτία என்பதன் நீதித்துறை வலிமையைப் பாதுகாக்கிறது.
- issue: Ἰουδαίων என்பதன் பொருள்
  choice: யூதர்கள்
  alternative: யூதேயர்கள்
  rationale: பாடுபாட்டு நிகழ்விலுள்ள அரசியல்-அரசப் பட்டமாக ‘யூதர்களின் அரசர்’ என்பது சூழலுக்கும் வழக்கமான பொருளுக்கும் ஏற்றது. இருப்பினும், கிரேக்கச் சொல் சில சூழல்களில் ‘யூதேயர்கள்’ என்றும் பொருள்படக்கூடியதால் அந்த மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. பலகையின் நேரடியான வாசகத் தன்மையும் நீதித்துறைச் சூழலும் காக்கப்பட்டுள்ளன; கிரேக்கத்தில் உள்ள உண்மையான சொற்பொருள் மாற்றுகள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
