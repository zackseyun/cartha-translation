  source_fidelity: கிரேக்க மூலத்தின் καὶ καθήμενοι ἐτήρουν αὐτὸν ἐκεῖ என்ற அமைப்பைத் துல்லியமாகப் பிரதிபலிக்கிறது. “உட்கார்ந்து” பங்கேற்பின் உடனிகழ்வுச் செயலையும், “காவல் காத்துக்கொண்டிருந்தார்கள்” ἐτήρουν என்பதன் தொடர்ச்சியான இறந்தகாலப் பொருளையும் இயல்பாகக் காட்டுகிறது. “அங்கே” இடச்சுட்டலையும் “அவரை” இயேசுவைக் குறிக்கும் சுட்டுப்பெயரையும் பாதுகாக்கின்றன.
  naturalness: “அவர்கள் அங்கே உட்கார்ந்து, அவரைக் காவல் காத்துக்கொண்டிருந்தார்கள்” என்பது நவீன நிலையான தமிழில் தெளிவான, கண்ணியமான, இயல்பான நடை. வினையெச்சத் தொடர் கிரேக்க இணைப்பின் கதைத் தொடர்ச்சியைத் தமிழில் சீராக வெளிப்படுத்துகிறது.
  terminology: “காவல் காத்துக்கொண்டிருந்தார்கள்” இச்சூழலில் ἐτήρουν என்பதற்கான பொருத்தமான சொல்; வெறும் பார்த்துக்கொண்டிருத்தலைவிடக் காவல்காத்தல் என்ற சூழற்பொருளைச் சரியாகத் தருகிறது. மரியாதை ஒருமைச் சுட்டுப்பெயரான “அவரை” தொடர்ந்து சரியாகப் பயன்படுத்தப்பட்டுள்ளது.
