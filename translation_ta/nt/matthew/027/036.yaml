  text: And sitting there[a], they kept watch over him.
translation:
  language: ta
  text: அவர்கள் அங்கே உட்கார்ந்து, அவரைக் காவல் காத்துக்கொண்டிருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் அங்கே உட்கார்ந்த பிறகு, அவரைக் காவல் காத்துக்கொண்டிருந்தார்கள்.”
    reason: καθήμενοι என்ற பங்கேற்பு வடிவத்தை உடனிகழ்வாகவோ, முதன்மைச் செயலுக்கு முந்திய செயலாகவோ வெளிப்படுத்த இயலும் என்பதைக் காட்டும் மொழியியல் மாற்று.
lexical_decisions:
- source_word: καὶ
  choice: அவர்கள் … உட்கார்ந்து
  rationale: கிரேக்க இணைப்புச் சொல் தொடர்ச்சியான நிகழ்வை எளிமையாக இணைக்கிறது; தமிழில் வினையெச்சத் தொடர் இயல்பாக அந்த இணைப்பை வெளிப்படுத்துகிறது.
- source_word: καθήμενοι
  choice: உட்கார்ந்து
  rationale: κάθημαι என்பதன் அமர்ந்திருக்கும் நிலையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; முதன்மைச் செயலுடன் உடனிகழ்வாக இணைக்கப்படுகிறது.
- source_word: ἐτήρουν
  choice: காவல் காத்துக்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வடிவம் தொடர்ச்சியான செயலைக் குறிக்கிறது; சூழலில் கண்காணித்தல் மட்டுமன்றி காவலில் வைத்திருந்த பொருளையும் இத்தொடர் இயல்பாகப் பிடிக்கிறது.
- source_word: αὐτὸν
  choice: அவரை
  rationale: இயேசுவைக் குறிக்கும் ஒருமை ஆண்பால் குற்றுவினைப் பெயர்ப்பதிலி; தமிழின் மரியாதை வழக்கிற்கு ஏற்ப ‘அவரை’ என வழங்கப்படுகிறது.
- source_word: ἐκεῖ
  choice: அங்கே
  rationale: செயல் நடைபெற்ற இடத்தைச் சுட்டும் இடவினையடை; தமிழில் வினையெச்சத்திற்கு முன் வைப்பது இயல்பான சொல் வரிசை.
