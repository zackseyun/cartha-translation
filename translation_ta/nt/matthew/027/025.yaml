  text: καὶ ἀποκριθεὶς πᾶς ὁ λαὸς εἶπεν· Τὸ αἷμα αὐτοῦ ἐφ’ ἡμᾶς καὶ ἐπὶ τὰ τέκνα ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/025.yaml
  text: And all the people answered[a], “His blood be on us and on our children.”
translation:
  language: ta
  text: அதற்கு மக்கள் அனைவரும் பதிலளித்து, “அவருடைய இரத்தம் எங்கள்மேலும் எங்கள் பிள்ளைகள்மேலும் இருக்கட்டும்” என்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, இந்தக் காட்சியில் கூடியிருந்த மக்கள் பேசுகின்றனர். இந்தச் சொற்கள் ஒவ்வொரு தலைமுறையிலுமுள்ள எல்லா யூதர்கள்மீதும் நிலையான பழியைச் சுமத்துவதாகப் புரிந்துகொள்ளப்படக் கூடாது.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: பதிலளித்தார்கள்
  rationale: ἀποκρίνομαι என்பதன் இறந்தகாலப் பங்கேற்பும் εἶπεν என்பதும் சேர்ந்து ஒரு பதிலை அறிமுகப்படுத்தும் கிரேக்க மரபுத்தொடராக வருகின்றன. தமிழில் இயல்பாகப் பன்மை எழுவாய்க்கேற்ப ‘பதிலளித்தார்கள்’ என்று வழங்கப்படுகிறது.
- source_word: πᾶς ὁ λαὸς
  choice: மக்கள் அனைவரும்
  rationale: πᾶς உடன் ஒருமை definite noun வருவது கூட்டு முழுமையைக் குறிக்கிறது. ‘மக்கள் அனைவரும்’ என்பது அந்தக் காட்சியில் கூடியிருந்த மக்களை இயல்பான நவீன தமிழில் குறிக்கிறது; இதை எல்லாக் காலங்களிலுமுள்ள ஓர் இனத்தாருக்கான கூற்றாக விரிவாக்கவில்லை.
- source_word: Τὸ αἷμα αὐτοῦ
  choice: அவருடைய இரத்தப்பழி
  rationale: நீதித்துறைச் சூழலில் αἷμα வெறும் உடல்சார் ‘இரத்தம்’ என்பதைவிட ஒருவரின் மரணத்திற்கான பொறுப்பைச் சுமக்கும் மரபுத்தொடர்பொருளைக் கொண்டுள்ளது. தமிழில் ‘அவருடைய இரத்தம் எங்கள்மேல்’ என்பது தெளிவற்றதாகவோ ஆசீர்வாதப் பொருளில்கூட வாசிக்கப்படக்கூடியதாகவோ இருப்பதால், ‘இரத்தப்பழி’ மூலத்தின் நீதிசார் உட்பொருளைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: ἐφ’ ἡμᾶς
  choice: எங்கள்மேல் ... இருக்கட்டும்
  rationale: கிரேக்கத்தில் வினைச்சொல் வெளிப்படையாக இல்லை; சூழலில் விருப்பம் அல்லது பொறுப்பேற்பைச் சுட்டும் வலிமை உள்ளது. ‘இருக்கட்டும்’ அதை மிகைப்படுத்தாமல் தமிழில் நிறைவு செய்கிறது.
- source_word: ἐπὶ τὰ τέκνα ἡμῶν
  choice: எங்கள் பிள்ளைகள்மேலும்
  rationale: τέκνα என்பதற்கு இயல்பான நேரடிப் பொருள் ‘பிள்ளைகள்.’ ‘சந்ததியினர்’ என்று வழங்குவது சொற்பொருளின் உடனடி வரம்பை தேவையின்றி விரிவாக்கும். -மேலும் என்ற இணை வடிவம் கிரேக்கத்தின் இணையான அமைப்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: πᾶς ὁ λαὸς என்பதை யூதர் அனைவர்மீதும் எல்லாக் காலத்திற்கும் பழி சுமத்துவதாகத் தவறாக வாசிக்கும் சாத்தியம்
  choice: கதைக்காட்சியில் அப்போது கூடியிருந்த மக்களின் கூட்டுப் பதிலாக ‘மக்கள் அனைவரும்’ என்று மொழிபெயர்த்து, வரலாற்றைக் கடந்த இனக்குற்றமாக விரிவாக்காமல் அடிக்குறிப்பில் தெளிவுபடுத்துதல்
  alternative: ‘கூட்டத்தார் அனைவரும்’ என்று மொழிபெயர்த்து உடனடிக் காட்சியை முதன்மை உரையிலேயே வரையறுத்தல்
  rationale: λαός என்பதன் அடிப்படைச் சொல்லாட்சியை ‘மக்கள்’ தக்கவைக்கிறது. அதேவேளை, வசனம் குறிப்பிட்ட காட்சியில் பேசுவோரையே சுட்டுகிறது; தலைமுறைதோறும் எல்லா யூதர்களுக்கும் நிலையான கூட்டுப்பழி உண்டு என்று உரை கூறுவதில்லை. மூலத்தின் கூட்டு வலிமையை மென்மைப்படுத்தாமலும் அதற்கு அப்பாற்பட்ட கோட்பாட்டைச் சேர்க்காமலும் அடிக்குறிப்பு தவறான விரிவாக்கத்தைத் தடுக்கிறது.
- issue: Τὸ αἷμα αὐτοῦ என்பதன் பொருள்
  choice: மரணத்திற்கான பொறுப்பு என்ற நீதிசார் மரபுத்தொடர்பொருளை ‘இரத்தப்பழி’ என்று வெளிப்படுத்துதல்
  alternative: சொல்லுக்குச் சொல் முறையில் ‘அவருடைய இரத்தம்’ என்று வழங்குதல்
  rationale: இங்கு αἷμα என்பது மரணப் பொறுப்பைக் குறிக்கும் மரபுத்தொடரில் வருகிறது. ‘இரத்தப்பழி’ தமிழில் அந்தப் பொருளைத் தெளிவாகத் தருகிறது; எனினும் யார்மீது அந்தப் பொறுப்பு எவ்வாறு அமைகிறது என்ற வசனத்தின் பதற்றத்தை மேலதிக விளக்கத்தால் தீர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அப்போது’ என்பது καί-யின் கதைத்தொடர் செயல்பாட்டை இயல்பாக வெளிப்படுத்துகிறது. மேற்கோளில் உள்ள பொறுப்பேற்பின் கடுமையும் இணை அமைப்பும் பாதுகாக்கப்பட்டுள்ளன; அடிக்குறிப்பு உரையின் வரலாற்றுக் காட்சியைத் தாண்டிய யூதவிரோத விரிவாக்கத்தை மட்டும் தடுக்கிறது.
