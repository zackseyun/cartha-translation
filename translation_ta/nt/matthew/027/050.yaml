  text: But Jesus cried out again with a loud voice and gave up his spirit[a].
translation:
  language: ta
  text: இயேசுவோ மீண்டும் உரத்த குரலில் கூக்குரலிட்டு, தம் ஆவியை விட்டார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடைசி மூச்சை விட்டார்.” கிரேக்கத்தில் சொல்லுக்கு சொல், “ஆவியை விட்டார்”; இது இறப்பைக் குறிக்கும் ஒரு சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: இயேசுவோ
  rationale: δέ குறிக்கும் மிதமான வேறுபாட்டையும் கதைத் தொடர்ச்சியையும், தமிழில் தலைப்பை வலியுறுத்தும் ‘-ஓ’ அமைப்பு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: முன்பு எழுப்பிய கூக்குரல் மறுபடியும் நிகழ்ந்ததை நேரடியாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: κράξας
  choice: கூக்குரலிட்டு
  rationale: κράζω என்பதன் உரத்த, தீவிரமான குரலெழுப்புதலைக் காட்டுகிறது; இதை வெறும் ‘கூப்பிட்டு’ என்று மென்மையாக்கவில்லை.
- source_word: φωνῇ μεγάλῃ
  choice: உரத்த குரலில்
  rationale: குரலின் ஒலியளவைத் தெளிவாகக் காட்டும் இயல்பான நவீனத் தமிழ் நடை.
- source_word: ἀφῆκεν
  choice: விட்டார்
  rationale: ἀφίημι என்பதன் ‘விடுதல்’ என்ற அடிப்படை எண்ணத்தைத் தக்கவைத்து, τὸ πνεῦμα உடன் வரும் இறப்பைக் குறிக்கும் சொற்றொடரிலும் தமிழில் சுருக்கமாக அமைகிறது.
- source_word: τὸ πνεῦμα
  choice: தம் ஆவியை
  rationale: கிரேக்கத்தின் πνεῦμα என்பதை ‘மூச்சு’ அல்லது ‘உயிர்’ என்று மட்டும் விளக்கிவிடாமல் ‘ஆவி’ எனப் பாதுகாக்கிறது. தமிழில் இயல்பாகத் தேவையான உடைமைப் பொருளை ‘தம்’ தெரிவிக்கிறது.
theological_decisions:
- issue: ἀφῆκεν τὸ πνεῦμα என்ற இறப்பைக் குறிக்கும் சொற்றொடரின் மொழிபெயர்ப்பு
  choice: தம் ஆவியை விட்டார்
  alternative: கடைசி மூச்சை விட்டார்
  rationale: மாற்று வாசகம் இறந்தார் என்ற கருத்தை இயல்பாகத் தெரிவிக்கிறது; ஆனால் πνεῦμα என்பதைக் ‘மூச்சு’ என்ற ஒரே பொருளுக்குள் கட்டுப்படுத்துகிறது. முதன்மை வாசகம் மூலத்தின் சொல் அமைப்பையும் அதிலுள்ள ஆவி/மூச்சு சார்ந்த பொருள் விரிவையும் கூடுதலாகத் தீர்மானிக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு புரியும் அதேவேளையில் நிகழ்வின் கண்ணியத்தையும் தீவிரத்தையும் காக்கும் நடை. ‘இயேசுவோ’ என்பது அளவுக்கு மீறிய ‘ஆனால்’ இணைப்பைத் தவிர்த்து δέ-யின் மிதமான வேறுபாட்டை வெளிப்படுத்துகிறது.
