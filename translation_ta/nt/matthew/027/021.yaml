source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ ἡγεμὼν εἶπεν αὐτοῖς· Τίνα θέλετε ἀπὸ τῶν δύο ἀπολύσω ὑμῖν; οἱ δὲ εἶπαν· ⸀Τὸν Βαραββᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/021.yaml
  text: But the governor answered them, “Which of the two do you want me to release for you?” And they said, “Barabbas.”
translation:
  language: ta
  text: ஆளுநர் அவர்களுக்குப் பதிலளித்து, “இந்த இருவரில் யாரை நான் உங்களுக்காக விடுதலை செய்ய வேண்டும் என்று நீங்கள் விரும்புகிறீர்கள்?” என்று கேட்டார். அதற்கு அவர்கள், “பரபாஸை” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ ἡγεμὼν εἶπεν αὐτοῖς
  choice: ஆளுநர் அவர்களிடம் ... என்று கேட்டார்
  rationale: கிரேக்கத்தில் உள்ள ‘பதிலளித்து ... சொன்னார்’ என்ற பங்கேற்புவினை + முற்றுவினை அமைப்பைத் தமிழில் இயல்பாகச் சுருக்குகிறது. தொடர்ந்து வரும் வாக்கியம் கேள்வியாக இருப்பதால் ‘கேட்டார்’ பொருத்தமானது; δέ குறிக்கும் மென்மையான உரையாடல் நகர்வு தமிழில் தனியாக மிகைப்படுத்தப்படவில்லை.
- source_word: ὁ ἡγεμὼν
  choice: ஆளுநர்
  rationale: இச்சூழலில் பிலாத்துவின் ரோம மாகாண நிர்வாகப் பதவியைத் துல்லியமாகக் குறிக்கிறது.
- source_word: Τίνα ... ἀπὸ τῶν δύο
  choice: இந்த இருவரில் யாரை
  rationale: குறிப்பிடப்பட்ட இரண்டு நபர்களிலிருந்து ஒருவரைத் தேர்ந்தெடுப்பதைக் கேட்கும் கிரேக்கச் சொற்றொடரை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: θέλετε
  choice: விரும்புகிறீர்கள்
  rationale: இங்கு கூட்டத்தாரின் விருப்பம் அல்லது தேர்வைக் குறிக்கிறது; மரியாதைப் பன்மைக்கு ஏற்ற நடுநிலையான நவீனத் தமிழ்.
- source_word: ἀπολύσω ὑμῖν
  choice: நான் உங்களுக்காக விடுதலை செய்ய வேண்டும்
  rationale: சட்டச் சூழலில் ἀπολύω என்பது காவலிலிருந்து விடுவிப்பதைக் குறிக்கிறது. ὑμῖν என்பதன் பயனாளிப் பொருளை ‘உங்களுக்காக’ காக்கிறது; θέλετε உடன் வரும் முதல் நபர் துணைவினை அமைப்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οἱ δὲ εἶπαν
  choice: அதற்கு அவர்கள் ... என்றார்கள்
  rationale: கூட்டத்தாரின் நேரடியான பதிலை இயல்பாக இணைக்கிறது; δέ-யின் உரையாடல் நகர்வை ‘அதற்கு’ தெளிவாகக் காட்டுகிறது.
- source_word: Τὸν Βαραββᾶν
  choice: பரபாஸை
  rationale: Βαραββᾶς என்ற பெயரைத் தமிழ் வேதாகமப் பயன்பாட்டிற்கு ஏற்றவாறு ஒலிபெயர்த்து, கிரேக்க வேற்றுமை உருபின் நேரடிப் பொருளைத் தமிழ் ‘ஐ’ உருபால் காட்டுகிறது.
