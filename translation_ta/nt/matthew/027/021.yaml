  register: நவீன நிலையான தமிழ்; dignified ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் உரையாடல் நடை. மூலத்தின் கேள்வி–பதில் நேர்த்தி காக்கப்பட்டுள்ளது; தேவையற்ற சமயவியல் விளக்கம் சேர்க்கப்படவில்லை.
