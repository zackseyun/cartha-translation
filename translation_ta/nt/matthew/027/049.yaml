base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/049.yaml
  text: But the rest said[a], “Leave him alone[b]. Let us see whether Elijah is coming to save him.”
translation:
  language: ta
  text: ஆனால் மற்றவர்களோ[a], “விடுங்கள். எலியா அவனைக் காப்பாற்ற வருகிறாரா என்று பார்ப்போம்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மீதமிருந்தவர்களோ’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: ஆனால் மற்றவர்களோ
  rationale: δέ காட்டும் மாறுபாட்டை ‘ஆனால்’ வெளிப்படுத்துகிறது; λοιποί என்பது முன்னர் குறிப்பிடப்பட்டவரைத் தவிர்த்த மற்றவர்களைக் குறிக்கிறது. ‘மற்றவர்களோ’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: ἔλεγον
  choice: என்றார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வடிவம் தொடர்ச்சியான அல்லது மீண்டும் மீண்டும் நடந்த பேச்சைக் குறிக்கக்கூடும்; எனினும் இக்கதைச் சூழலில் ‘என்றார்கள்’ இயல்பாகவும் மிகைப்படுத்தாமலும் உள்ளது.
- source_word: Ἄφες
  choice: அவனை அப்படியே விட்டுவிடு
  rationale: இது ஒருமை ஏவல் வடிவம். கிரேக்கத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லை; சூழலில் இயேசுவுக்குப் புளித்த திராட்சரசம் கொடுக்க முயன்றவரைத் தடுத்து, அவரிடம் தலையிடாமல் இருக்கச் சொல்கிறது. தமிழ் வாசகருக்குப் பொருள் தெளிவாக இருக்க ‘அவனை அப்படியே’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἴδωμεν
  choice: பார்ப்போம்
  rationale: முதல் நபர் பன்மைத் தூண்டல் பொருளுடைய துணைவினை வடிவத்தை இயல்பான தமிழில் ‘பார்ப்போம்’ நேரடியாகக் கூறுகிறது.
- source_word: εἰ ἔρχεται
  choice: வருகிறாரா என்று
  rationale: εἰ மறைமுக வினாவை அறிமுகப்படுத்துகிறது; நிகழ்கால ἔρχεται காட்சியின் உடனடித் தன்மையைத் தக்கவைக்க ‘வருகிறாரா’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: Ἠλίας
  choice: எலியா
  rationale: தீர்க்கதரிசியின் பெயருக்கான தமிழில் நிலைபெற்ற வடிவம்.
- source_word: σώσων αὐτόν
  choice: அவனைக் காப்பாற்ற
  rationale: எதிர்காலப் பெயரெச்சமான σώσων, வருவதன் நோக்கத்தைத் தெரிவிக்கிறது. ‘காப்பாற்ற’ என்பது சிலுவை மரணத்திலிருந்து விடுவிக்கும் உடனடி பொருளையும் σῴζω என்பதன் ‘save’ சார்ந்த சொல்லிணைப்பையும் காக்கிறது.
theological_decisions:
- issue: சிலுவைச் சூழலில் σῴζω என்பதற்கிருக்கக்கூடிய இறையியல் எதிரொலி
  choice: அவனைக் காப்பாற்ற
  alternative: அவனை மீட்க
  rationale: பேசுகிறவர்கள் சிலுவையிலிருந்து கண்கூடாக விடுவிக்கப்படுவதைப் பற்றியே கூறுகின்றனர்; நித்திய இரட்சிப்பைப் பற்றிய கோட்பாட்டு அறிக்கையைச் செய்யவில்லை. இருப்பினும் ‘காப்பாற்ற’ என்பது மூலச்சொல்லின் இயல்பான பொருளையும் பாடுபட்ட நிகழ்விலுள்ள நையாண்டித் தன்மையையும் தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. உரையாடலின் உடனடித் தன்மைக்காக ‘வருகிறாரா’ தக்கவைக்கப்பட்டுள்ளது; ‘எலியா’ என்பதுடன் மரியாதை வினைமுற்று பயன்படுத்தப்பட்டாலும், இயேசுவைக் குறித்து கேலி செய்பவர்களின் ‘அவன்’ என்ற பேச்சுநிலை மாற்றப்படவில்லை.
