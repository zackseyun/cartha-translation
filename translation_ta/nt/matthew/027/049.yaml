  to: ஆனால் மற்றவர்களோ[a], “விடுங்கள். எலியா அவனைக் காப்பாற்ற வருகிறாரா என்று பார்ப்போம்” என்றார்கள்.
  rationale: The revision retains the contrast, the indirect question, Elijah’s imminent coming, and the purpose ‘to save him.’ It removes the unsupported ‘அப்படியே’ and preserves the Greek imperative’s unstated object with the concise Tamil ‘விடுங்கள்.’ Footnote b records the contextual interpretation without embedding it in the translated text.
