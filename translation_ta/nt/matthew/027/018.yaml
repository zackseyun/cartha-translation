source:
  edition: SBLGNT
  text: ᾔδει γὰρ ὅτι διὰ φθόνον παρέδωκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/018.yaml
  text: For he knew that they had handed him over because of envy[a].
translation:
  language: ta
  text: ஏனெனில், அவர்கள் பொறாமையால்[a] அவரை ஒப்படைத்திருந்தார்கள் என்பதை அவன் அறிந்திருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பொறாமையின் காரணமாக’ அல்லது ‘அவர்மீது கொண்ட பொறாமையால்.’
    reason: φθόνος என்பதையும் διά குறிக்கும் காரணத் தொடர்பையும் தமிழில் வெளிப்படுத்தும் இயல்பான மாற்றுச் சொற்றொடர்கள்.
lexical_decisions:
- source_word: ᾔδει
  choice: அறிந்திருந்தான்
  rationale: οἶδα இங்கு அறிந்திருத்தல் அல்லது உணர்ந்திருத்தலைக் குறிக்கிறது. தமிழில் தொடர்ந்திருந்த அறிவுநிலையை இயல்பாக வெளிப்படுத்த ‘அறிந்திருந்தான்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: γάρ முந்தைய கூற்றுக்கான விளக்கத்தை அறிமுகப்படுத்துகிறது; ‘ஏனெனில்’ அந்தத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ὅτι
  choice: என்பதை
  rationale: இங்கு ὅτι, அவன் அறிந்திருந்ததன் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; காரணத்தைக் குறிக்கும் மற்றொரு இணைப்பாக அல்ல.
- source_word: διὰ φθόνον
  choice: பொறாமையால்
  rationale: διά + ஏவல் வேற்றுமை காரணத்தைக் குறிக்கிறது. φθόνος என்பது மற்றொருவரின் நிலை அல்லது செல்வாக்கைக் கண்டு எழும் பொறாமையையும் அதனுடன் சேர்ந்த தீய மனப்பான்மையையும் குறிக்கிறது.
- source_word: παρέδωκαν
  choice: ஒப்படைத்திருந்தார்கள்
  rationale: παραδίδωμι இங்கு ஒருவரை அதிகாரியின் கையில் ஒப்படைப்பதைக் குறிக்கிறது. அறிந்திருந்த காலத்துக்கு முன்பே நிகழ்ந்த செயல் என்பதைத் தமிழில் இயல்பாகக் காட்ட இறந்தகால நிறைவு வடிவம் பயன்படுத்தப்பட்டது; ‘காட்டிக்கொடுத்தார்கள்’ என்பது தேவையற்ற வகையில் துரோகத்தின் பொருளை முன்னிறுத்தும்.
- source_word: αὐτόν
  choice: அவரை
  rationale: இது இயேசுவைக் குறிக்கும் நேரடி செயப்படுபொருள் சுட்டுப்பெயர். இயேசுவைக் குறிப்பிடுவதற்கேற்ற மரியாதை வடிவம் தமிழில் பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: இயேசுவைக் குற்றஞ்சாட்டியவர்களின் நோக்கம்
  choice: அவர்கள் இயேசுவைப் பொறாமையால் ஒப்படைத்தார்கள் என்பதை அவன் அறிந்திருந்தான்.
  alternative: அவர்கள் இயேசுவின்மீது கொண்ட போட்டிப் பொறாமையால் அவரை ஒப்படைத்தார்கள் என்பதை அவன் அறிந்திருந்தான்.
  rationale: φθόνος கூறும் ஒழுக்க மற்றும் உளவியல் நோக்கத்தை ‘பொறாமை’ பாதுகாக்கிறது; வசனம் கூறாத கூடுதல் இறையியல் விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘அவன்’ என்பது உடனுள்ள சூழலில் பிலாத்துவைக் குறிக்கிறது; மூலத்தில் பெயர் மீண்டும் இடம்பெறாததால் இங்கும் பெயர் சேர்க்கப்படவில்லை. அடிக்குறிப்பு குறியீடு தொடர்புடைய காரணச் சொல்லுக்குப் பின் வைக்கப்பட்டுள்ளது.
