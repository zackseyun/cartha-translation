translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. யோசேப்பைக் குறிக்கும் ஒருமை மரியாதை வடிவங்களான ‘அவர்’, ‘தாம்’, ‘தமக்கு’ பயன்படுத்தப்பட்டுள்ளன. கிரேக்க αὐτό என்பதன் இலக்கண வடிவத்தையும் முந்தைய சூழலில் இயேசுவின் உடலைக் குறிக்கும் தொடர்பையும் காக்க ‘அதை’ என மொழிபெயர்க்கப்பட்டுள்ளது.
