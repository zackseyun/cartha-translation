review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the sequence and principal details of the Greek: placing the body in Joseph''s new, rock-hewn tomb; rolling a large stone to its entrance; and departing. The possessive force of αὐτοῦ and the prior action indicated by the relative clause are retained. However, “அதைத்” is grammatically possible in view of the preceding context but is unnatural and impersonal in Tamil for Jesus’ body; explicit reference to the body is the clearer contextual rendering. “தாம் ... தமக்குச் சொந்தமான” is also unnecessarily repetitive.'
  naturalness: The register is generally clear and dignified. Recasting the opening removes the awkward concentration of reflexive-honorific forms and yields smoother modern standard Tamil. “நுழைவாயில்” is slightly more immediately clear than “வாயில்” for the opening of a rock-cut tomb.
  terminology: “கல்லறை,” “பாறையில் வெட்டியிருந்த,” and “பெரிய கல்” are appropriate. “தமக்கெனப் புதிய” naturally conveys his own new tomb without adding that it was unused. The lexical footnote properly preserves the door/entrance alternative.
  issues:
  - severity: low
    issue: The opening phrase “அவர் அதைத் தாம் ... தமக்குச் சொந்தமான ...” is stylistically awkward and potentially impersonal.
    rationale: The Greek neuter pronoun refers contextually to Jesus’ body, but Tamil naturally expresses this as “அவருடைய உடலை.” Replacing the doubled reflexive phrasing with “தமக்கெனப்” retains the possessive emphasis of αὐτοῦ more idiomatically.
  - severity: low
    issue: “வாயில்” can be retained, but “நுழைவாயில்” is clearer in this burial-tomb context.
    rationale: θύρα denotes a door or entrance. “நுழைவாயில்” clearly identifies the tomb opening while the footnote continues to note “கதவு” as an alternative.
  revised_text: அவர் அவருடைய உடலைத் தமக்கெனப் புதிய கல்லறையில் வைத்தார்; அந்தக் கல்லறையை அவர் பாறையில் வெட்டியிருந்தார். பின்பு கல்லறையின் நுழைவாயிலுக்கு ஒரு பெரிய கல்லை உருட்டி வைத்துவிட்டு அங்கிருந்து சென்றார்.
