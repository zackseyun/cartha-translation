revisions:
- from: அவர் அதைத் தாம் பாறையில் வெட்டி அமைத்திருந்த தமக்குச் சொந்தமான புதிய கல்லறையில் வைத்தார். பின்பு கல்லறையின் வாயிலுக்கு[a] ஒரு பெரிய கல்லை உருட்டி வைத்துவிட்டு அங்கிருந்து சென்றார்.
  to: அவர் அவருடைய உடலைத் தமக்கெனப் புதிய கல்லறையில் வைத்தார்; அந்தக் கல்லறையை அவர் பாறையில் வெட்டியிருந்தார். பின்பு கல்லறையின் நுழைவாயிலுக்கு ஒரு பெரிய கல்லை உருட்டி வைத்துவிட்டு அங்கிருந்து சென்றார்.
  rationale: The revision makes the contextual referent of αὐτό natural in Tamil (“அவருடைய உடலை”), avoids redundant reflexive-honorific wording, and uses “நுழைவாயில்” for the tomb opening. It preserves the source’s meaning, narrative order, possessive emphasis, and the lexical ambiguity of θύρα in the footnote.
