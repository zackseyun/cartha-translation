id: MAT.27.60
reference: Matthew 27:60
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἔθηκεν αὐτὸ ἐν τῷ καινῷ αὐτοῦ μνημείῳ ὃ ἐλατόμησεν ἐν τῇ πέτρᾳ, καὶ προσκυλίσας λίθον μέγαν τῇ θύρᾳ τοῦ μνημείου ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/060.yaml
  text: and placed it in his own new tomb[a], which he had cut into the rock. And after rolling a large stone to the entrance of the tomb, he went away.
translation:
  language: ta
  text: அவர் அவருடைய உடலைத் தமக்கெனப் புதிய கல்லறையில் வைத்தார்; அந்தக் கல்லறையை அவர் பாறையில் வெட்டியிருந்தார். பின்பு கல்லறையின் நுழைவாயிலுக்கு ஒரு பெரிய கல்லை உருட்டி வைத்துவிட்டு அங்கிருந்து சென்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθηκεν
  choice: வைத்தார்
  rationale: τίθημι இங்கு உடலைக் கல்லறையில் வைக்கும் எளிய செயலைக் குறிக்கிறது; ‘வைத்தார்’ என்பது இயல்பான, கண்ணியமான நவீனத் தமிழ்.
- source_word: καινῷ αὐτοῦ μνημείῳ
  choice: தமக்குச் சொந்தமான புதிய கல்லறையில்
  rationale: μνημεῖον இச்சூழலில் பாறையில் வெட்டப்பட்ட அடக்கக் கல்லறையைக் குறிக்கிறது; καινός என்பதன் நேரடிப் பொருளான ‘புதிய’ என்பதே வைக்கப்பட்டது. பயன்படுத்தப்படாதது என்ற உட்கருத்து வெளிப்படையாகச் சேர்க்கப்படவில்லை.
- source_word: ἐλατόμησεν ἐν τῇ πέτρᾳ
  choice: பாறையில் வெட்டி அமைத்திருந்த
  rationale: λατομέω பாறையை வெட்டி அல்லது குடைந்து உருவாக்குவதைக் குறிக்கிறது. சார்பு வாக்கியம் முன்பே தயாரிக்கப்பட்ட கல்லறையை விளக்குவதால் ‘அமைத்திருந்த’ இயல்பான காலத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: προσκυλίσας λίθον μέγαν
  choice: ஒரு பெரிய கல்லை உருட்டி வைத்துவிட்டு
  rationale: இறந்தகால வினையெச்சம், அவர் சென்றுபோவதற்கு முன் கல்லை உருட்டிய செயலைக் காட்டுகிறது; தமிழில் ‘வைத்துவிட்டு’ செயல் வரிசையைத் தெளிவாக்குகிறது.
- source_word: τῇ θύρᾳ τοῦ μνημείου
  choice: கல்லறையின் வாயிலுக்கு
  rationale: θύρα என்பது ‘கதவு’ அல்லது ‘வாயில்/நுழைவிடம்’ எனப் பொருள்படும். பாறைக் கல்லறையின் திறப்பைக் குறிக்கும் இச்சூழலில் ‘வாயில்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: ἀπῆλθεν
  choice: அங்கிருந்து சென்றார்
  rationale: ἀπέρχομαι இங்கு அந்த இடத்தைவிட்டு நீங்கிச் செல்வதைக் குறிக்கிறது; ‘அங்கிருந்து சென்றார்’ தமிழ் உரைநடையில் இயல்பாக அந்த இயக்கத்தைத் தெரிவிக்கிறது.
