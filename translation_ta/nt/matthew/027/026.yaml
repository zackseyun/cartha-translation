id: MAT.27.26
reference: Matthew 27:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τότε ἀπέλυσεν αὐτοῖς τὸν Βαραββᾶν, τὸν δὲ Ἰησοῦν φραγελλώσας παρέδωκεν ἵνα σταυρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/026.yaml
  text: Then he released Barabbas to them[a], but after flogging Jesus, he handed him over to be crucified.
translation:
  language: ta
  text: அப்போது அவர் பரபாசை அவர்களுக்கு விடுதலை செய்தார்; ஆனால் இயேசுவைச் சாட்டையால் அடித்தபின்[a], சிலுவையில் அறையப்படும்படி அவரை ஒப்படைத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சவுக்கால் அடித்தபின்” என்றும் மொழிபெயர்க்கலாம். இந்தக் கிரேக்க வினைச்சொல், ரோமர்களின் சாட்டையடி தண்டனையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: கதையின் அடுத்த நிகழ்வை இயல்பாகக் குறிக்கும் நேரத்தொடர் சொல்.
- source_word: ἀπέλυσεν
  choice: விடுதலை செய்தார்
  rationale: சிறைக்கைதியை நீதித்துறைச் சூழலில் விடுவிப்பதைத் தெளிவாகக் குறிக்கிறது.
- source_word: αὐτοῖς
  choice: அவர்களுக்கு
  rationale: விடுதலையின் பெறுநர்கள் அல்லது பயனாளிகள் மக்களே என்பதை தத்திவ் வேற்றுமைக்கு ஏற்றபடி நேரடியாகக் காட்டுகிறது.
- source_word: Βαραββᾶν
  choice: பரபாசை
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவம்; வாக்கியத்தில் செயப்படுபொருள் உருபுடன் வருகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: பரபாசின் விடுதலைக்கும் இயேசுவுக்கு நேர்ந்ததற்கும் இடையிலான முரண்பாட்டை வெளிப்படுத்துகிறது.
- source_word: Ἰησοῦν
  choice: இயேசுவை
  rationale: தமிழில் நிலைபெற்ற பெயர் வடிவம்; செயப்படுபொருள் உருபுடன் வழங்கப்பட்டுள்ளது.
- source_word: φραγελλώσας
  choice: சாட்டையால் அடித்தபின்
  rationale: ரோமத் தண்டனையான கடுமையான சாட்டையடியை இன்றைய வாசகர்களுக்குப் புரியும் மொழியில் தருகிறது; இறந்தகாலப் பங்கேற்பு முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் குறிக்கிறது.
- source_word: παρέδωκεν
  choice: அவரை ஒப்படைத்தார்
  rationale: குறிப்பிட்ட முடிவை நிறைவேற்ற அதிகாரிகளிடம் ஒருவரை ஒப்படைக்கும் நீதித்துறைச் சூழலைக் காக்கிறது.
- source_word: ἵνα σταυρωθῇ
  choice: சிலுவையில் அறையப்படும்படி
  rationale: ἵνα மற்றும் செயப்பாட்டு வினையின் நோக்கம் அல்லது எதிர்பார்க்கப்பட்ட முடிவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இயேசுவின் தண்டனைத் தீர்ப்பில் நிகழ்வுகளின் வரிசையும் செயல்பாட்டாளரும்
  choice: பிலாத்து பரபாசை விடுதலை செய்து, இயேசுவைச் சாட்டையால் அடித்தபின், சிலுவையில் அறையப்படுவதற்காக அவரை ஒப்படைத்தார்.
  alternative: இயேசுவை ஒப்படைத்த பிறகு அவர் சாட்டையால் அடிக்கப்பட்டார்.
  rationale: φραγελλώσας என்னும் இறந்தகாலப் பங்கேற்பு, παρέδωκεν என்னும் முதன்மை வினைக்கு முன் நடந்த செயலை இயல்பாகக் குறிக்கிறது. ரோம நடைமுறையைப் பற்றிய மேலதிக இறையியல் ஊகமின்றி கிரேக்க உரையின் நிகழ்வு வரிசை காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. வசனத்தின் மறைமுக எழுவாயான பிலாத்து, தொடர்ச்சிக்கேற்ப “அவர்” என வைக்கப்பட்டுள்ளார். அடிக்குறிப்பு குறியீடு அது விளக்கும் சொற்றொடருக்குப் பின்னர் இடப்பட்டுள்ளது.
