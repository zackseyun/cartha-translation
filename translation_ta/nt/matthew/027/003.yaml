id: MAT.27.3
reference: Matthew 27:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τότε ἰδὼν Ἰούδας ὁ ⸀παραδιδοὺς αὐτὸν ὅτι κατεκρίθη μεταμεληθεὶς ⸀ἔστρεψεν τὰ τριάκοντα ἀργύρια τοῖς ἀρχιερεῦσιν ⸀καὶ πρεσβυτέροις
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/003.yaml
  text: Then Judas[a], who had betrayed him, seeing that he had been condemned[b], regretted it and returned the thirty pieces of silver to the chief priests and elders.
translation:
  language: ta
  text: அப்போது, அவரைக் காட்டிக்கொடுத்த யூதாஸ், அவர் குற்றவாளியெனத் தீர்ப்பளிக்கப்பட்டதைக் கண்டு மனம் வருந்தி, அந்த முப்பது வெள்ளிக்காசுகளையும் தலைமைக் குருமார்களிடமும் மூப்பர்களிடமும் திருப்பிக் கொடுத்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: அப்போது
  rationale: நிகழ்வுகளின் தொடர்ச்சியில் அடுத்த நிகழ்வை அறிமுகப்படுத்தும் இயல்பான காலச் சுட்டுச் சொல்.
- source_word: ἰδὼν
  choice: கண்டு
  rationale: இறந்தகால வினையெச்சத்தின் காலத்தொடர்பையும் முதன்மைச் செயலுக்கு முன் நிகழ்ந்த பார்வையையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: Ἰούδας
  choice: யூதாஸ்
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: அவரைக் காட்டிக்கொடுத்த
  rationale: யூதாஸை அவன் செய்த செயலால் அடையாளப்படுத்தும் பெயரெச்சத் தொடரை இயல்பான தமிழில் தருகிறது; இச்சூழலில் παραδίδωμι என்பதன் துரோகத்துடன் கூடிய ஒப்படைத்தல் பொருளை ‘காட்டிக்கொடுத்த’ வெளிப்படுத்துகிறது.
- source_word: ὅτι κατεκρίθη
  choice: அவர் குற்றவாளியெனத் தீர்ப்பளிக்கப்பட்டதை
  rationale: இயேசுவுக்கு எதிராகத் தீர்ப்பு வழங்கப்பட்டதைத் தெளிவாகக் கூறுகிறது; செயலின் செயப்பாட்டு வடிவத்தையும் பாதுகாக்கிறது.
- source_word: μεταμεληθεὶς
  choice: மனம் வருந்தி
  rationale: வருத்தம் அல்லது மனக்கசப்பைத் தெரிவிக்கிறது; முழுமையான மனந்திரும்புதல் என்ற வலுவான இறையியல் கருத்தை உரைக்குள் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: ἔστρεψεν
  choice: திருப்பிக் கொடுத்தான்
  rationale: பணத்தை அது வந்தவர்களிடமே மீண்டும் கொடுத்த செயலை இயல்பாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: τὰ τριάκοντα ἀργύρια
  choice: அந்த முப்பது வெள்ளிக்காசுகளையும்
  rationale: ἀργύρια என்பது வெள்ளிப் பணத்துண்டுகள் அல்லது நாணயங்களைக் குறிக்கும்; ‘வெள்ளிக்காசுகள்’ நவீனத் தமிழில் எளிதில் புரியும் வடிவம். ‘அந்த’ என்பது முன்பே குறிப்பிடப்பட்ட பணத்தைச் சுட்டுகிறது.
- source_word: τοῖς ἀρχιερεῦσιν καὶ πρεσβυτέροις
  choice: தலைமைக் குருமார்களிடமும் மூப்பர்களிடமும்
  rationale: மத்தேயுவில் வரும் யூதத் தலைமைக்குழுக்களைத் துல்லியமாகக் குறிக்கும் நிலையான, புரிந்துகொள்ளத்தக்க சொற்கள்.
theological_decisions:
- issue: μεταμεληθεὶς என்பது யூதாஸின் எதிர்வினையை எவ்வாறு வரையறுக்கிறது?
  choice: மனம் வருந்தி
  alternative: மனந்திரும்பி
  rationale: μεταμέλομαι வருத்தம் அல்லது மனக்கசப்பைக் குறிக்கிறது. ‘மனந்திரும்பி’ என்பது யூதாஸின் ஆன்மீக நிலையைப் பற்றி மூலவசனம் வெளிப்படையாகக் கூறாத வலுவான இறையியல் முடிவை ஏற்படுத்தக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்க வினையெச்சத் தொடர்கள் தமிழுக்கு இயல்பான பெயரெச்சம் மற்றும் வினையெச்ச அமைப்புகளாகக் கொடுக்கப்பட்டுள்ளன; தேவையற்ற விளக்கவுரை சேர்க்கப்படவில்லை.
