- source_word: ἐβλασφήμουν
  choice: தூஷித்துக்கொண்டிருந்தார்கள்
  rationale: இந்த வினை ஒருவரை இழிவாகப் பேசுதல், பழித்தல் அல்லது அவதூறு செய்தல் என்ற பொருளையும் தருகிறது; தேவனைப் பற்றிய குறுகிய பொருளில் மட்டுமே இதை அடைக்கவில்லை. இறந்தகாலத் தொடர்நிலைச் செயலைக் காட்டும் imperfect வடிவம் ‘-க்கொண்டிருந்தார்கள்’ மூலம் காக்கப்பட்டது.
- source_word: αὐτὸν
  choice: அவரை
  rationale: இது இயேசுவைக் குறிக்கும் நேரடிச் செயப்படுபொருள்; மரியாதை ஒருமை தமிழில் இயல்பாகப் பயன்படுத்தப்பட்டது.
- source_word: κινοῦντες
  choice: அசைத்து
  rationale: தூஷித்தபோது உடனிகழ்ந்த உடலசைவை இது குறிக்கிறது. ‘அசைத்து’ என்பது இன்றைய தமிழில் தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: τὰς κεφαλὰς αὐτῶν
  choice: தங்கள் தலைகளை
  rationale: கிரேக்கப் பன்மை காக்கப்பட்டுள்ளது; ‘தங்கள்’ என்பது செய்பவர்களையே திரும்பச் சுட்டும் இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: இயேசுவை நோக்கிப் பயன்படுத்தப்பட்ட βλασφημέω என்பதன் பொருள் வலிமை
  choice: முதன்மை உரையில் ‘தூஷித்துக்கொண்டிருந்தார்கள்’
  alternative: ‘பழித்துப் பேசிக்கொண்டிருந்தார்கள்’ அல்லது ‘நிந்தித்துக்கொண்டிருந்தார்கள்’
  rationale: கிரேக்கச் சொல் சாதாரண கேலியை விட வலிமையான இழிவுரையைக் குறிக்கிறது. ‘தூஷித்தல்’ அந்த வலிமையைத் தக்கவைக்கிறது; அதேவேளை, இங்கு மொழிபெயர்ப்பே தனிப்பட்ட கிறிஸ்தியல் முடிவை வெளிப்படையாகச் சேர்ப்பதில்லை. சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. தமிழ் வாக்கிய இயல்புக்காக உடனிகழ் பங்கேற்பான ‘தலைகளை அசைத்து’ முதன்மை வினைக்கு முன் வைக்கப்பட்டுள்ளது. ‘தூஷித்தல்’ சற்றே வலிமையானதாயினும் இன்னும் பரவலாகப் புரியக்கூடிய சொல்; அதன் பொருள் தேவதூஷணத்துக்கு மட்டும் கட்டுப்படுத்தப்படவில்லை.
