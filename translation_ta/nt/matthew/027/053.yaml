  text: καὶ ἐξελθόντες ἐκ τῶν μνημείων μετὰ τὴν ἔγερσιν αὐτοῦ εἰσῆλθον εἰς τὴν ἁγίαν πόλιν καὶ ἐνεφανίσθησαν πολλοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/053.yaml
  text: And coming out of the tombs after his resurrection[c][b][a], they entered the holy city and appeared to many.
translation:
  language: ta
  text: அவருடைய உயிர்த்தெழுதலுக்குப் பிறகு கல்லறைகளிலிருந்து வெளியே வந்து,[a] அவர்கள் புனித நகரத்திற்குள் நுழைந்து பலருக்குத் தோன்றினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் “அவருடைய உயிர்த்தெழுதலுக்குப் பிறகு” என்பது “கல்லறைகளிலிருந்து வெளியே வந்து” என்ற வினையெச்சத் தொடருக்குப் பின், “அவர்கள் நுழைந்தார்கள்” என்ற முதன்மை வினைக்கு முன் வருகிறது. ஆகவே, அவர்கள் கல்லறைகளிலிருந்து வெளியே வந்ததும் நகரத்திற்குள் நுழைந்ததும் அவருடைய உயிர்த்தெழுதலுக்குப் பிறகே நிகழ்ந்ததாக இவ்வாக்கியம் கூறுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξελθόντες
  choice: வெளியே வந்து
  rationale: இறந்தகால வினையெச்சத்தின் துணைநிலை உறவை இயல்பான தமிழில் காட்டுகிறது; அது முதன்மை வினையான ‘சென்றார்கள்’ என்பதற்கு முன் நிகழ்ந்த செயலைக் குறிக்கிறது.
- source_word: μνημείων
  choice: கல்லறைகளிலிருந்து
  rationale: இச்சூழலில் μνημεῖον என்பது அடக்கம் செய்யப்பட்ட இடங்களைக் குறிக்கிறது; முந்தைய வசனத்தில் திறக்கப்பட்ட கல்லறைகளோடும் இது பொருந்துகிறது.
- source_word: μετὰ τὴν ἔγερσιν αὐτοῦ
  choice: அவருடைய உயிர்த்தெழுதலுக்குப் பிறகு
  rationale: μετά + வேற்றுமை வடிவம் காலத்தைக் குறிக்கும் ‘பிறகு’ என்ற பொருளைக் கொண்டது. ἔγερσις உயிர்த்தெழுதலைக் குறிக்கிறது; சூழலில் ‘அவருடைய’ என்பது இயேசுவைக் குறிக்கிறது.
- source_word: εἰσῆλθον
  choice: சென்று
  rationale: நகரத்திற்குள் நுழைந்ததை இயல்பான தொடர்வினை அமைப்பில் தெரிவிக்கிறது; ‘நகரத்திற்குள்’ என்பதால் நுழைதல் தெளிவாக உள்ளது.
- source_word: τὴν ἁγίαν πόλιν
  choice: புனித நகரம்
  rationale: எருசலேமைக் குறிக்கும் வேதாகமச் சொல்லாட்சியை இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: ἐνεφανίσθησαν
  choice: தோன்றினார்கள்
  rationale: பிறர் காணும் வகையில் வெளிப்பட்டார்கள் என்ற பொருளை இயல்பாகத் தருகிறது; கிரேக்கத்தின் செயப்படுபொருள்/இடைநிலை வடிவத்தை தேவையின்றி விளக்கமாக்கவில்லை.
- source_word: πολλοῖς
  choice: பலருக்கு
  rationale: கிரேக்கத்தின் குறிப்பிடப்படாத பன்மையைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது; ‘மக்கள்’ என்பதைச் சேர்க்கத் தேவையில்லை.
theological_decisions:
- issue: ‘கல்லறைகளிலிருந்து வெளியே வந்து’ என்ற வினையெச்சத்துக்கும் ‘அவருடைய உயிர்த்தெழுதலுக்குப் பிறகு’ என்ற காலத் தொடருக்கும் உள்ள உறவு
  choice: இயேசுவின் உயிர்த்தெழுதலுக்குப் பிறகே அவர்கள் கல்லறைகளிலிருந்து வெளியே வந்தார்கள் என்று வாசிக்கும்படி காலத் தொடர் வினையெச்சத்துடன் இணைக்கப்பட்டுள்ளது.
  alternative: கல்லறைகள் இயேசுவின் மரணத்தின்போது திறந்தன என்றும், பரிசுத்தவான்கள் அவருடைய உயிர்த்தெழுதலுக்குப் பிறகுதான் வெளியே வந்து நகரத்திற்குள் சென்றார்கள் என்றும் முந்தைய வசனத்துடன் சேர்த்து சிலர் விளக்குகின்றனர்.
  rationale: கிரேக்கத்தில் μετὰ τὴν ἔγερσιν αὐτοῦ என்பது ἐκ τῶν μνημείων என்பதற்குப் பின், முதன்மை வினைக்கு முன் நிற்கும் வினையெச்சத் தொடருக்குள் வருகிறது. மொழிபெயர்ப்பு இந்த இயல்பான தொடர்பைத் தக்கவைக்கிறது; முந்தைய வசனத்துடனான காலவரிசையை உரைக்கு அப்பால் சென்று தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மதிப்புமிக்க நடையிலும் வடிவமைக்கப்பட்டது. ‘புனித நகரம்’ என்ற வேதாகமச் சொல்லாட்சி தக்கவைக்கப்பட்டு, அதன் குறிப்பு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. காலத் தொடரின் இறையியல் முக்கியத்துவம் உரையில் மறைக்கப்படாமல், அதே நேரத்தில் தேவையற்ற ஒத்திசைவு சேர்க்கப்படாமல் உள்ளது.
