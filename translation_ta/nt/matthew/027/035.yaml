base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/035.yaml
  text: And after they crucified him[a], they divided his garments by casting lots.
translation:
  language: ta
  text: அவர்கள் அவரைச் சிலுவையில் அறைந்தபின்[a], சீட்டுப் போட்டு அவருடைய உடைகளைப் பங்கிட்டுக்கொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்குச் சொல் அமைப்பில்: “அவரைச் சிலுவையில் அறைந்து, சீட்டுப் போட்டு அவருடைய உடைகளைப் பங்கிட்டுக்கொண்டார்கள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σταυρώσαντες
  choice: சிலுவையில் அறைந்தபின்
  rationale: இறந்தகால வினையெச்சம், உடைகளைப் பங்கிட்ட செயலுக்கு முன் சிலுவையில் அறைந்தது நிகழ்ந்ததைக் காட்டுகிறது. ‘அறைந்தபின்’ என்பது அந்தக் காலவரிசையை இயல்பான நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ கதைப்போக்கை மெதுவாகத் தொடரும் இணைப்புச்சொல். தமிழில் வாக்கியத் தொடர்ச்சியே அதன் பணியை இயல்பாகச் செய்கிறது; ‘மேலும்’ அல்லது ‘ஆனால்’ என்று சேர்ப்பது தேவையற்ற வலியுறுத்தலை உருவாக்கும்.
- source_word: διεμερίσαντο
  choice: பங்கிட்டுக்கொண்டார்கள்
  rationale: இந்த வினை பொருட்களைப் பிரித்துப் பகிர்ந்துகொள்வதைக் குறிக்கிறது. நடுவினை வடிவத்தின் தங்களுக்காகப் பகிர்ந்துகொண்ட நுணுக்கத்தையும் ‘பங்கிட்டுக்கொண்டார்கள்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: அவருடைய உடைகளை
  rationale: ἱμάτια என்பது இங்கு பொதுவாக அணியும் உடைகளைக் குறிக்கிறது. ‘உடைகள்’ நவீனத் தமிழில் தெளிவானது; ‘மேலாடைகள்’ என்பது மூலத்தில் உறுதியாக இல்லாத ஒரு குறிப்பைச் சேர்க்கக்கூடும்.
- source_word: βάλλοντες κλῆρον
  choice: சீட்டுப் போட்டு
  rationale: κλῆρος ஒருமையில் இருந்தாலும், பொருட்களை யாருக்குக் கொடுப்பது என்று வாய்ப்புமுறையில் தீர்மானிக்கும் வழக்கை இச்சொற்றொடர் குறிக்கிறது. ‘சீட்டுப் போட்டு’ என்பது தமிழில் அந்த நடைமுறையை இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: βάλλοντες κλῆρον என்ற வினையெச்சத் தொடருக்கும் διεμερίσαντο என்ற முதன்மை வினைக்கும் உள்ள உறவு
  choice: ‘சீட்டுப் போட்டு ... பங்கிட்டுக்கொண்டார்கள்’ என்று, சீட்டுப் போடுதல் உடைகளைப் பங்கிட்ட முறை எனத் தரப்பட்டுள்ளது.
  alternative: ‘உடைகளைப் பங்கிட்டுக்கொண்டு, சீட்டுப் போட்டார்கள்’
  rationale: கிரேக்க வினையெச்சம், அவர்கள் எவ்வாறு உடைகளைப் பங்கிட்டார்கள் என்பதை இயல்பாக விளக்குகிறது. தமிழ் அமைப்பு இந்தச் சாதன/முறை உறவைத் தெளிவாக்குகிறது; கூடுதல் இறையியல் விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியத்தக்கதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சிலுவையில் அறைதல்’ மற்றும் ‘சீட்டுப் போடுதல்’ ஆகியவை பரவலாகப் புரிந்துகொள்ளப்படும் இயல்பான சொற்றொடர்கள். மூலத்தின் சுருக்கமான கதைநடை பாதுகாக்கப்பட்டுள்ளது.
