  source_fidelity: மூல கிரேக்கத்தின் εἶχον δὲ τότε δέσμιον ἐπίσημον λεγόμενον Ἰησοῦν Βαραββᾶν என்ற கூறுகள் அனைத்தும் பொருளோடு காக்கப்பட்டுள்ளன. ‘அவர்களிடம் ... இருந்தான்’ என்பது εἶχον என்பதன் காவல்/கட்டுப்பாட்டு நிழலை இயல்பாகத் தருகிறது; ‘அப்போது’ τότε-ஐத் தருகிறது; δέ-யின் மென்மையான இணைப்புப் பணி தமிழில் விடப்படுவது ஏற்றது. ‘பேர்போன கைதி’ ἐπίσημον என்பதன் இச்சூழலுக்குரிய எதிர்மறை நிழலைச் சரியாக வெளிப்படுத்துகிறது. SBLGNT-இல் உள்ள ‘இயேசு பரபாஸ்’ முழுப் பெயரும் முதன்மைப் பாடத்தில் உள்ளது.
  naturalness: வாக்கியம் நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமான கதைநடையுடனும் உள்ளது. பெயருக்கு முன் ‘என்று அழைக்கப்பட்ட’ என்பதும் ‘பேர்போன கைதி ஒருவன்’ என்பதும் இயல்பான சொற்தொடர்களாக உள்ளன.
  terminology: ‘கைதி’ நீதித்துறைச் சூழலுக்கு துல்லியமானது. ‘பேர்போன’ என்பது ‘பிரபலமான’ என்பதைக் காட்டிலும் கைதியைப் பற்றிய சூழலுக்கு ஏற்ற எதிர்மறை நுண்ணர்த்தத்தைக் கொண்டுள்ளது; அதேவேளை மூலச் சொல்லின் பரந்த ‘நன்கு அறியப்பட்ட’ பொருளை மிகையாகக் கட்டுப்படுத்தவில்லை. ‘இயேசு பரபாஸ்’ என்ற பெயரெழுத்தும் நிலையான பயன்பாட்டிற்கு ஏற்றது.
