  text: εἶχον δὲ τότε δέσμιον ἐπίσημον λεγόμενον ⸀Ἰησοῦν Βαραββᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/016.yaml
  text: At that time they had a notorious prisoner called Jesus Barabbas[a].
translation:
  language: ta
  text: அப்போது அவர்களிடம் இயேசு பரபாஸ்[a] என்று அழைக்கப்பட்ட பேர்போன கைதி ஒருவன் இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் “இயேசு” என்பது விடப்பட்டு, “பரபாஸ்” என்று மட்டும் உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: εἶχον
  choice: அவர்களிடம் ... இருந்தான்
  rationale: குறிப்பிடப்படாத பன்மை எழுவாயைக் கொண்ட இச்சொல், அதிகாரிகளின் காவலில் அந்தக் கைதி இருந்ததை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: δὲ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது மென்மையான கதைத் தொடர்புச் சொல். தமிழில் ‘அப்போது’ என்பதுடன் மேலும் ஒரு இணைப்புச் சொல்லைச் சேர்ப்பது தேவையற்றதாகவும் செயற்கையாகவும் இருக்கும்.
- source_word: τότε
  choice: அப்போது
  rationale: வெளிப்படையான காலக் குறிப்பைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: δέσμιον
  choice: கைதி
  rationale: நீதித்துறைச் சூழலில் காவலில் வைக்கப்பட்ட ஒருவரைக் குறிக்கும் தெளிவான, வழக்கமான தமிழ்ச் சொல்.
- source_word: ἐπίσημον
  choice: பேர்போன
  rationale: இச்சூழலில் நன்கு அறியப்பட்ட, குறிப்பாகக் கெட்ட விதத்தில் அறியப்பட்ட கைதியைக் குறிக்கிறது. ‘பேர்போன’ என்பது அந்த எதிர்மறை நிழலைச் சூழல் மூலம் வெளிப்படுத்துவதோடு, மூலச்சொல்லின் ‘குறிப்பிடத்தக்க/நன்கு அறியப்பட்ட’ என்ற பரப்பையும் தேவையின்றி குறுக்காது.
- source_word: λεγόμενον
  choice: என்று அழைக்கப்பட்ட
  rationale: பெயர் அல்லது அழைப்புப் பெயரை அறிமுகப்படுத்தும் பங்கேற்பெச்சத்தின் பொருளை இயல்பாகத் தருகிறது.
- source_word: Ἰησοῦν Βαραββᾶν
  choice: இயேசு பரபாஸ்
  rationale: SBLGNT மூலவாசகத்தில் உள்ள இரு பெயர்களையும் நேரடியாகக் காக்கிறது; குறுகிய மாற்று வாசகம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: பரபாசின் முழுப் பெயருக்கான மூலபாட வேறுபாடு
  choice: முதன்மைப் பாடத்தில் ‘இயேசு பரபாஸ்’ என்று இடம்பெறுகிறது.
  alternative: ‘இயேசு’ என்பதை விடுத்து ‘பரபாஸ்’ என்று மட்டும் வாசித்தல்.
  rationale: கொடுக்கப்பட்ட SBLGNT மூலவாசகம் Ἰησοῦν Βαραββᾶν என்று கொண்டுள்ளது. ஆகவே அது முதன்மைப் பாடத்தில் மொழிபெயர்க்கப்பட்டு, குறிப்பிடத்தக்க கையெழுத்துப் பிரதி வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும், கண்ணியமான கதைநடை. ‘அவர்களிடம் ... இருந்தான்’ என்பது காவலில் வைத்திருந்தனர் என்ற கிரேக்கக் கருத்தைத் தமிழில் இயல்பாகத் தருகிறது. ‘பேர்போன’ என்பது ἐπίσημον என்பதிலுள்ள புகழ்பெற்ற/கெட்ட பெயர்பெற்ற என்ற சூழல் சார்ந்த நிழலை மிகையாகத் தீர்மானிக்காமல் காக்கிறது.
