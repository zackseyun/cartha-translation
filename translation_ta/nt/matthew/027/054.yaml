source:
  edition: SBLGNT
  text: Ὁ δὲ ἑκατόνταρχος καὶ οἱ μετ’ αὐτοῦ τηροῦντες τὸν Ἰησοῦν ἰδόντες τὸν σεισμὸν καὶ τὰ ⸀γενόμενα ἐφοβήθησαν σφόδρα λέγοντες· Ἀληθῶς ⸂θεοῦ υἱὸς⸃ ἦν οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/054.yaml
  text: When the centurion and those with him who were guarding Jesus saw the earthquake and the things that had happened[a], they were greatly afraid and said[c][b], “Truly this was the Son of God.”
translation:
  language: ta
  text: நூற்றுவர் தலைவனும், அவனோடு இயேசுவைக் காவல் காத்துக்கொண்டிருந்தவர்களும், நிலநடுக்கத்தையும் நிகழ்ந்தவற்றையும் கண்டபோது மிகவும் பயந்து, “உண்மையாகவே இவர் தேவனுடைய மகன்[a]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மாற்றாக, “தேவனுடைய ஒரு மகன்.” கிரேக்கத்தில் ‘தேவனுடைய மகன்’ என்ற சொற்றொடருக்கு முன் குறிப்புருபு இல்லை. எனினும் மத்தேயுவின் கதைச் சூழலில் இது இயேசுவுக்குரிய ‘தேவனுடைய மகன்’ என்னும் பட்டமாகப் புரிந்துகொள்ளப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἑκατόνταρχος
  choice: நூற்றுக்குத் தலைவன்
  rationale: ரோமப் படையில் ஏறக்குறைய நூறு வீரர்களுக்குத் தலைமை வகித்த அதிகாரியைக் குறிக்கும் சொல்லை, பொதுவாசகருக்குப் புரியும் வகையிலும் வரலாற்றுப் பொருளைத் தக்கவைத்தும் மொழிபெயர்க்கிறது.
- source_word: τηροῦντες τὸν Ἰησοῦν
  choice: இயேசுவைக் காவல் காத்துக்கொண்டிருந்தவர்கள்
  rationale: மரணதண்டனை நடைபெறும் இடத்தில் வெறுமனே பார்த்துக்கொண்டிருப்பதை அல்ல, காவல் பொறுப்பை நிறைவேற்றியதைக் குறிக்கிறது.
- source_word: ἰδόντες
  choice: கண்டபோது
  rationale: இறந்தகாலப் பங்கேற்புவினையின் காலத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: σεισμόν
  choice: நிலநடுக்கம்
  rationale: σεισμός என்பதன் நேரடியான, சூழலுக்கேற்ற பொருள்.
- source_word: τὰ γενόμενα
  choice: நிகழ்ந்தவை
  rationale: நிலநடுக்கத்தை மட்டும் அல்லாமல் அச்சூழலில் நடந்த மற்ற நிகழ்வுகளையும் உள்ளடக்கும் விரிவான பன்மைப் பொருளைத் தக்கவைக்கிறது.
- source_word: ἐφοβήθησαν σφόδρα
  choice: மிகவும் பயந்தார்கள்
  rationale: σφόδρα என்ற வலியுறுத்தலையும், தமிழின் இயல்பான உணர்ச்சி வெளிப்பாட்டையும் காக்கிறது.
- source_word: Ἀληθῶς
  choice: உண்மையாகவே
  rationale: கூற்றின் உறுதியையும் தீவிரத்தையும் வெளிப்படுத்துகிறது; பேசுவோரின் இறையியல் புரிதலை அதற்கு மேல் வரையறுக்கவில்லை.
- source_word: θεοῦ υἱὸς
  choice: தேவனுடைய மகன்
  rationale: மத்தேயுவின் கதைச் சூழலில் இயேசுவுக்குரிய பட்டப்பெயர் சார்ந்த, குறிப்பிட்ட பொருளை இயல்பான தமிழில் தருகிறது; கிரேக்கத்தில் பெயர்ச்சொல்லுக்கு உருபு இல்லாததால் சாத்தியமான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: οὗτος
  choice: இவர்
  rationale: சுட்டுப்பெயரின் உடனடித்தன்மையைத் தக்கவைத்து, இயேசுவைக் குறிப்பிடும் மரியாதையான நவீனத் தமிழுக்கு ஏற்ற வடிவை வழங்குகிறது.
theological_decisions:
- issue: θεοῦ υἱὸς என்ற சொற்றொடரின் பொருள்
  choice: தேவனுடைய மகன்
  alternative: ஒரு தெய்வத்தின் மகன் / தேவனுடைய ஒரு மகன்
  rationale: கிரேக்கச் சொற்றொடரில் உருபு இல்லாவிட்டாலும், பயனிலைப் பெயர்ச்சொல் அமைப்பும் மத்தேயு முழுவதிலும் ‘தேவனுடைய மகன்’ என்பது இயேசுவைக் குறிக்கும் முக்கியப் பட்டமாக இருப்பதும் குறிப்பிட்ட/பண்புசார் பொருளை ஆதரிக்கின்றன. எனினும் ரோமப் படைவீரர்கள் கூறிய சொற்கள் எவ்வளவு முழுமையான இறையியல் புரிதலை வெளிப்படுத்தின என்பது உரையில் தீர்மானிக்கப்படாததால், மாற்றுச் சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘நூற்றுக்குத் தலைவன்’ என்பது வரலாற்றுப் பதவியை விளங்கத்தக்க தமிழில் தருகிறது. வாக்கிய அமைப்பு கிரேக்கத்தின் குழு, காவல் செயல், காட்சி, பயம், அறிக்கை ஆகிய தொடர்புகளைத் தெளிவாகப் பாதுகாக்கிறது.
