id: MAT.27.19
reference: Matthew 27:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ βήματος ἀπέστειλεν πρὸς αὐτὸν ἡ γυνὴ αὐτοῦ λέγουσα· Μηδὲν σοὶ καὶ τῷ δικαίῳ ἐκείνῳ, πολλὰ γὰρ ἔπαθον σήμερον κατ’ ὄναρ δι’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/019.yaml
  text: While he was sitting on the judgment seat[a], his wife sent word to him, saying, “Have nothing to do with that righteous man[b], for I have suffered greatly today in a dream because of him.”
translation:
  language: ta
  text: அவர் தீர்ப்பு வழங்கும் இருக்கையில் அமர்ந்திருந்தபோது, அவருடைய மனைவி அவருக்குச் செய்தி அனுப்பி, “அந்த நீதிமானின்[a] விஷயத்தில் நீர் எதுவும் செய்ய வேண்டாம். ஏனெனில், அவர் காரணமாக இன்று ஒரு கனவில் நான் மிகவும் துன்பப்பட்டேன்” என்று சொன்னாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘குற்றமற்றவர்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ‘நீதியுள்ளவர்,’ ‘நியாயமானவர்’ அல்லது சட்ட விசாரணைச் சூழலில் ‘குற்றமற்றவர்’ என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθημένου δὲ αὐτοῦ
  choice: அவர் ... அமர்ந்திருந்தபோது
  rationale: நிகழ்ந்துகொண்டிருந்த பின்னணிச் சூழலைக் காட்டும் நிகழ்காலப் பங்கேற்புவினையுடன் கூடிய genitive absolute அமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: ἐπὶ τοῦ βήματος
  choice: தீர்ப்பு வழங்கும் இருக்கையில்
  rationale: நீதித்துறைச் சூழலில் βῆμα என்பது அதிகாரபூர்வமாகத் தீர்ப்பு வழங்கும் இருக்கையைக் குறிக்கிறது; வெறும் மேடை என்ற பொருளைத் தவிர்த்து, சாதாரண வாசகருக்கும் தெளிவாகத் தரப்பட்டுள்ளது.
- source_word: ἀπέστειλεν πρὸς αὐτὸν
  choice: அவருக்குச் செய்தி அனுப்பி
  rationale: தூதரின் வழியாகத் தகவல் அனுப்பப்பட்டிருப்பதை இயல்பாக உணர்த்துகிறது; ஆனால் மூலத்தில் வெளிப்படையாக இல்லாத தகவல் தொடர்பு முறையை மிகையாகக் குறிப்பிடவில்லை.
- source_word: ἡ γυνὴ αὐτοῦ
  choice: அவருடைய மனைவி
  rationale: இங்கு γυνή உறவுமுறையின் அடிப்படையில் மனைவியையே தெளிவாகக் குறிக்கிறது.
- source_word: Μηδὲν σοὶ καὶ τῷ δικαίῳ ἐκείνῳ
  choice: அந்த நீதிமானின் காரியத்தில் நீர் தலையிட வேண்டாம்
  rationale: ‘உமக்கும் அவருக்கும் ஒன்றும் வேண்டாம்’ என்ற கிரேக்க மொழிமரபின் எச்சரிக்கைப் பொருளை இயல்பான நவீன தமிழில் தருகிறது; அவருக்கு எதிராகச் குறிப்பிட்ட செயலை மட்டும் பொருளாக்காமல், இதில் ஈடுபட வேண்டாம் என்ற விரிவைத் தக்கவைக்கிறது.
- source_word: τῷ δικαίῳ ἐκείνῳ
  choice: அந்த நீதிமான்
  rationale: δίκαιος என்பதன் அறநெறி மற்றும் நீதிசார் வலிமையைத் தக்கவைக்கிறது; விசாரணைச் சூழலில் சாத்தியமான ‘குற்றமற்றவர்’ என்ற பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: πολλὰ ... ἔπαθον
  choice: நான் மிகவும் துன்பப்பட்டேன்
  rationale: ‘மிகுதியாகத் துன்பம் அனுபவித்தேன்’ என்ற கிரேக்க மரபுத்தொடரின் தீவிரத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: σήμερον κατ’ ὄναρ
  choice: இன்று ஒரு கனவில்
  rationale: காலக் குறிப்பையும் கனவு அனுபவத்தின் சூழலையும் மூல வரிசைக்கு நெருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: δι’ αὐτόν
  choice: அவர் காரணமாக
  rationale: διά + accusative குறிக்கும் காரண உறவை நேரடியாகத் தருகிறது; கனவின் பொருளாக அவர் இருந்தார் என்ற விளக்கத்தை மூலத்தைவிட அதிகமாகச் சேர்க்கவில்லை.
theological_decisions:
- issue: இயேசுவைக் குறிக்கும் δίκαιος சொல்லின் மொழிபெயர்ப்பு
  choice: நீதிமான்
  alternative: குற்றமற்றவர்
  rationale: ‘நீதிமான்’ என்பது சொல்லின் அறநெறிசார் வலிமையையும் மத்தேயுவின் கதையாடலில் உள்ள அழுத்தத்தையும் தக்கவைக்கிறது. விசாரணைச் சூழலில் ‘குற்றமற்றவர்’ என்பதும் சாத்தியமானது என்பதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: Μηδὲν σοὶ καὶ ... என்ற மொழிமரபின் பொருள்
  choice: காரியத்தில் ... தலையிட வேண்டாம்
  alternative: அவருக்கு எதிராக ஒன்றும் செய்ய வேண்டாம்
  rationale: மூல மொழிமரபு எந்தவித ஈடுபாட்டையும் தவிர்க்கும் எச்சரிக்கையாக உள்ளது. மாற்று வாசகம் தீங்கு செய்ய வேண்டாம் என்ற ஒரே திசையில் பொருளைக் குறுக்கிவிடக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கதையாடல் கண்ணியமும் காக்கப்பட்டுள்ளன. பிலாத்துவிடம் மனைவி பேசுவதால் ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது. ‘நியாயாசனம்’ போன்ற சமய வழக்குச் சொல்லுக்குப் பதிலாக சாதாரண வாசகருக்குத் தெளிவான ‘தீர்ப்பு வழங்கும் இருக்கை’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
