  text: καὶ ἔδωκαν αὐτὰ εἰς τὸν ἀγρὸν τοῦ κεραμέως, καθὰ συνέταξέν μοι κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/010.yaml
  text: and they gave them for the potter's field[b][a], just as the Lord directed me.
translation:
  language: ta
  text: அவற்றைக் குயவனின் நிலத்துக்காகக் கொடுத்தார்கள்; ஆண்டவர் எனக்குக் கட்டளையிட்டபடியே.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கட்டளையிட்ட’ என்பதற்கு ‘பணித்த’ அல்லது ‘அறிவுறுத்திய’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இந்தத் தீர்க்கதரிசன மேற்கோள் அல்லது சுட்டுரையில் கிரேக்க உரை ‘எனக்கு’ என்ற முதல் நபர் வடிவத்தைப் பேணுகிறது; அது சுற்றியுள்ள கதைச் சூழலுக்கு ஏற்ப மாற்றப்படவில்லை.
    reason: cross_reference
lexical_decisions:
- source_word: ἔδωκαν
  choice: கொடுத்தார்கள்
  rationale: δίδωμι என்பதன் இயல்பான பொருளான ‘கொடுத்தார்கள்’ என்பதைப் பேணுகிறது; ‘விலை கொடுத்தார்கள்’ என்பது சூழலுக்குப் பொருந்தினாலும், மூலச்சொல்லைவிட விளக்கமான மொழிபெயர்ப்பாகிவிடும்.
- source_word: αὐτὰ
  choice: அவற்றை
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட வெள்ளிக்காசுகளைக் குறிக்கும் நடுநிலைப் பன்மைப் பதிலிடுபெயரைப் பன்மையிலேயே வெளிப்படுத்துகிறது.
- source_word: εἰς τὸν ἀγρὸν
  choice: நிலத்துக்காக
  rationale: εἰς என்பதற்கு பொதுவாக ‘உள்ளே/நோக்கி’ என்ற பொருள் இருந்தாலும், பணத்தைக் கொடுத்து நிலத்தை வாங்கும் இச்சூழலில் நோக்கம் அல்லது பரிமாற்றத்தை இயல்பாகத் தெரிவிக்கிறது.
- source_word: τοῦ κεραμέως
  choice: குயவனின்
  rationale: உடைமைப் பொருளுடைய ஒருமை வேற்றுமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: καθὰ
  choice: படியே
  rationale: முன்னர் கூறப்பட்ட செயல் ஆண்டவரின் கட்டளைக்கு அப்படியே ஒத்திருந்ததைக் காட்டும் ஒப்புமை வலிமையைப் பேணுகிறது.
- source_word: συνέταξέν
  choice: கட்டளையிட்ட
  rationale: συντάσσω என்பதிலுள்ள அதிகாரப்பூர்வமான அறிவுறுத்தல் அல்லது கட்டளையின் பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; ‘பணித்த’ என்பதும் சாத்தியம்.
- source_word: μοι
  choice: எனக்கு
  rationale: முதல் நபர் ஒருமை முன்னிலை வேற்றுமையை நேரடியாகப் பேணுகிறது; கதைச் சூழலுக்கேற்ப அதை மாற்றவில்லை.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான இயல்பான, கண்ணியமான தமிழ் வேதாகமச் சொல்; கிரேக்கத்தில் உள்ள குறிப்புச் சுட்டையும் பொருளில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தீர்க்கதரிசன மேற்கோள்/சுட்டுரையில் பேசுபவரைக் குறிக்கும் முதல் நபர்
  choice: கிரேக்கத்தில் உள்ள ‘எனக்கு’ என்ற முதல் நபர் வடிவத்தை மாற்றாமல் வைத்தல்
  alternative: சுற்றியுள்ள கதையோ பழைய ஏற்பாட்டு மூலவாக்கியமோ தெளிவாகப் பொருந்துமாறு நபரைக் குறிக்கும் சொல்லை மாற்றுதல்
  rationale: மூலத்தில் μοι (‘எனக்கு’) என்று உள்ளது. மத்தேயுவின் மேற்கோள் முறையிலுள்ள உரைசார் மற்றும் இறையியல் பதற்றத்தை விளக்கி அகற்றாமல், மூலத்தின் உண்மையான வடிவத்தை மொழிபெயர்ப்பு வெளிப்படையாகப் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியக்கூடிய, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘குயவனின் நிலம்’ என்பது உடனடியான கதைச் சூழலோடு இயல்பாகப் பொருந்துகிறது. அரைப்புள்ளி, கொடுக்கப்பட்ட செயலும் ஆண்டவரின் கட்டளையுடனான அதன் தொடர்பும் தெளிவாகத் தெரிய உதவுகிறது.
