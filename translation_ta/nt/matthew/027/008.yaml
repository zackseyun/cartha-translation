  text: διὸ ἐκλήθη ὁ ἀγρὸς ἐκεῖνος Ἀγρὸς Αἵματος ἕως τῆς σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/008.yaml
  text: Therefore that field has been called Field of Blood to this day.
translation:
  language: ta
  text: அதனால், அந்த வயல் இன்றுவரை “இரத்த வயல்” என்று அழைக்கப்படுகிறது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὸ
  choice: அதனால்
  rationale: முந்தைய நிகழ்வின் விளைவாக வயலுக்கு இந்தப் பெயர் ஏற்பட்டது என்பதைத் தெளிவாகக் காட்டும் இயல்பான தமிழ் இணைப்புச்சொல்.
- source_word: ἐκλήθη
  choice: அழைக்கப்படுகிறது
  rationale: இறந்தகாலத்தில் தொடங்கி எழுத்தாளரின் காலம்வரை நீடித்த பெயர்வழக்கை, ἕως τῆς σήμερον என்பதுடன் இணைந்து இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ὁ ἀγρὸς ἐκεῖνος
  choice: அந்த வயல்
  rationale: ἀγρός என்பதன் அடிப்படைப் பொருளையும் ἐκεῖνος என்ற சுட்டுப்பெயரடையையும் நேரடியாகப் பாதுகாக்கிறது; தொடர்ந்து வரும் இடப்பெயரிலும் ‘வயல்’ என்பதை மீண்டும் பயன்படுத்துகிறது.
- source_word: Ἀγρὸς Αἵματος
  choice: இரத்த வயல்
  rationale: இடப்பெயராகச் சுருக்கமாகவும் இயல்பாகவும் உள்ளது; ἀγρός மற்றும் αἷμα ஆகிய இரு கூறுகளையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: αἵματος
  choice: இரத்த
  rationale: αἷμα என்பதன் மரபான, தெளிவான தமிழ் இணை; இங்கு இடப்பெயரின் முதல் கூறாக வருகிறது.
- source_word: ἕως τῆς σήμερον
  choice: இன்றுவரை
  rationale: எழுத்தாளரின் நிகழ்காலம்வரை அந்தப் பெயர் வழக்கில் இருந்ததைத் தெரிவிக்கும் சுருக்கமான, இயல்பான நவீன தமிழ் வடிவம்.
theological_decisions: []
