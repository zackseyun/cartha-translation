id: MAT.27.43
reference: Matthew 27:43
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πέποιθεν ἐπὶ τὸν θεόν, ῥυσάσθω ⸀νῦν εἰ θέλει αὐτόν· εἶπεν γὰρ ὅτι Θεοῦ εἰμι υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/043.yaml
  text: He has trusted in God[a]; let God rescue him now, if he wants him, for he said[b], ‘I am the Son of God.’
translation:
  language: ta
  text: அவன் கடவுள்மேல் நம்பிக்கை வைத்திருக்கிறான்[a]; கடவுள் அவனை விரும்பினால், இப்போது அவனை மீட்கட்டும். ஏனெனில், ‘நான் கடவுளின் மகன்’ என்று அவன் சொன்னான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன்மேல் பிரியமாயிருந்தால்.” இந்தச் சொற்கள் சங்கீதம் 22:8-ஐ எதிரொலிக்கின்றன; அங்கே கடவுளின் அருள் அல்லது பிரியம் என்ற பொருள் தெளிவாகத் தெரிகிறது.
    reason: alternative_reading
  - marker: b
    text: இந்தக் கேலி சங்கீதம் 22:8-ஐ நெருக்கமாக எதிரொலித்து, இயேசுவுக்கு நேர்ந்த கேலியை அந்தச் சங்கீதத்தில் வரும் நீதிமானின் துன்பத்துடன் இணைக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: πέποιθεν ἐπὶ τὸν θεόν
  choice: கடவுள்மேல் நம்பிக்கை வைத்திருக்கிறான்
  rationale: πέποιθεν என்பதன் நிறைவுநிலைத் தன்மை, முன்பு வைத்த நம்பிக்கையின் தொடரும் நிலையை உணர்த்துகிறது; இயல்பான நவீன தமிழில் இவ்வாறு வழங்கப்படுகிறது.
- source_word: ῥυσάσθω νῦν
  choice: இப்போது அவனை மீட்கட்டும்
  rationale: ῥύομαι ஆபத்திலிருந்து விடுவித்தல் அல்லது மீட்டல் என்று பொருள்படும்; νῦν கேலிச் சவாலின் உடனடித் தன்மையை வலியுறுத்துகிறது.
- source_word: εἰ θέλει αὐτόν
  choice: அவனை விரும்பினால்
  rationale: θέλω என்பதன் நேரடியான பொருள் ‘விரும்புதல்’; சங்கீதம் 22:8-ன் எதிரொலியால் ‘அவன்மேல் பிரியமாயிருந்தால்’ என்ற நிழற்பொருள் சாத்தியமானாலும் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: Θεοῦ εἰμι υἱός
  choice: நான் கடவுளின் மகன்
  rationale: மத்தேயுவின் சூழலில் இது பொதுவான தெய்வத் தொடர்பைக் காட்டாமல் கிறிஸ்துவியல் அடையாளக் கூற்றாக வருகிறது; தமிழ் உருபமைப்பில் ‘கடவுளின் மகன்’ அதன் தலைப்புசார் வலிமையைத் தக்கவைக்கிறது.
theological_decisions:
- issue: Θεοῦ εἰμι υἱός என்ற கிறிஸ்துவியல் கூற்றின் மொழிபெயர்ப்பு
  choice: நான் கடவுளின் மகன்
  alternative: நான் கடவுளுடைய ஒரு மகன்
  rationale: கிரேக்கத்தில் υἱός முன் கட்டுரை இல்லாவிட்டாலும், மத்தேயுவின் கதைச்சூழல் இதை அடையாளத் தலைப்பாகக் காட்டுகிறது; ‘ஒரு மகன்’ என்பது சூழலில் பலவீனமான வாசிப்பு.
- issue: θέλει αὐτόν என்பதில் விருப்பமா, பிரியமா
  choice: அவனை விரும்பினால்
  alternative: அவன்மேல் பிரியமாயிருந்தால்
  rationale: முதன்மை உரை θέλω என்பதன் சாதாரண பொருளைத் தக்கவைக்கிறது; சங்கீத எதிரொலியால் தோன்றும் தெய்வீகப் பிரியத்தின் நிழற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. கேலியின் கூர்மை, கிரேக்க நிறைவுநிலையின் தொடரும் நம்பிக்கை, சங்கீதம் 22:8-ன் மறைமுக எதிரொலி ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
