reference: Matthew 27:65
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀ἔφη αὐτοῖς ὁ Πιλᾶτος· Ἔχετε κουστωδίαν· ὑπάγετε ἀσφαλίσασθε ὡς οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/065.yaml
  text: Pilate said to them[a], “You have a guard. Go[b], make it secure as you know how.”
translation:
  language: ta
  text: பிலாத்து அவர்களிடம், “உங்களிடம் ஒரு காவல்படை இருக்கிறது.[a] போய், உங்களுக்குத் தெரிந்தபடி அதைப் பாதுகாப்பாகச் செய்யுங்கள்.[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு காவல்படையை அழைத்துச் செல்லுங்கள்”; “உங்களுக்கென்று ஒரு காவல்படை இருக்கிறதே” என்றும் பொருள் கொள்ளலாம். பிலாத்து ஒரு காவல்படையை வழங்குகிறாரா, அல்லது அவர்களுக்கு ஏற்கெனவே கிடைக்கக்கூடிய காவல்படையைக் குறிப்பிடுகிறாரா என்பது கிரேக்கத்தில் தெளிவாக இல்லை.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “உங்களுக்குத் தெரிந்தபடி அதைப் பாதுகாப்பாக ஆக்குங்கள்.”
    reason: alternative_rendering
lexical_decisions:
- source_word: ἔφη
  choice: என்றான்
  rationale: φημί என்பதன் வழக்கமான கதைநடைப் பேச்சுச் செயலைத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: αὐτοῖς
  choice: அவர்களிடம்
  rationale: பிலாத்தின் பேச்சு யாரை நோக்கியது என்பதைத் தெரிவிக்கும் பன்மை மறைமுகச் செயப்படுபொருளை இயல்பான தமிழில் தருகிறது.
- source_word: Ἔχετε
  choice: உங்களிடம் ... இருக்கிறது
  rationale: ἔχω என்பதன் நேரான நிகழ்காலப் பொருளைப் பேணுகிறது; இது ஏற்கெனவே அவர்களுக்கு ஒரு காவல்படை இருப்பதாகவோ, ஒன்றைப் பயன்படுத்த அனுமதி அளிப்பதாகவோ புரிந்துகொள்ளப்படலாம்.
- source_word: κουστωδίαν
  choice: ஒரு காவல்படை
  rationale: லத்தீன் custodia-விலிருந்து வந்த இச்சொல் காவல் பணியில் உள்ள ஒரு படைப்பிரிவைக் குறிக்கிறது; ‘காவல்படை’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: ὑπάγετε
  choice: போய்
  rationale: புறப்பட்டுச் செல்லும்படி கூறும் கட்டளையை அடுத்த செயற்பாட்டுடன் இயல்பாக இணைக்கிறது.
- source_word: ἀσφαλίσασθε
  choice: அதைப் பத்திரப்படுத்துங்கள்
  rationale: ஒன்றை பாதுகாப்பானதாக அல்லது தப்பிக்க முடியாதபடி உறுதிப்படுத்துதல் என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὡς οἴδατε
  choice: உங்களுக்குத் தெரிந்தபடி
  rationale: அவர்களுடைய அறிவு அல்லது தெரிந்த முறைக்கு ஏற்ப செயல்பட வேண்டும் என்ற பொருளைப் பொருள் மிகைப்படுத்தாமல் பேணுகிறது.
theological_decisions:
- issue: Ἔχετε κουστωδίαν என்பது பிலாத்து ரோமக் காவல்படையை வழங்குவதைக் குறிக்கிறதா, அல்லது தலைவர்களுக்கு ஏற்கெனவே இருந்த காவல்படையைக் குறிக்கிறதா?
  choice: முதன்மை உரையில் ‘உங்களிடம் ஒரு காவல்படை இருக்கிறது’ என்று நடுநிலையாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஒரு காவல்படையை அழைத்துச் செல்லுங்கள்’ அல்லது ‘உங்களுக்கென்று ஒரு காவல்படை இருக்கிறதே’
  rationale: கிரேக்க வடிவம் அனுமதி/வழங்கல் அல்லது ஏற்கெனவே உள்ள வசதியைச் சுட்டும் கூற்று ஆகிய இரு விதமாகவும் புரிந்துகொள்ளப்படலாம். விவாதத்திற்குரிய வரலாற்றுக் கேள்வியைத் தீர்மானிக்காமல் மூலத்தின் தெளிவின்மையைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. ‘காவல்படை’ என்பது தனி காவலாளியைவிட காவல் பிரிவைக் குறிக்கிறது. ‘பத்திரப்படுத்துங்கள்’ என்பது கல்லறையை முத்திரையிட்டு காவல் வைப்பதற்கான அடுத்த வசனச் சூழலோடு இயல்பாகப் பொருந்துகிறது; ஆனாலும் அந்தச் செயல்களை இந்த வசனத்துக்குள் வெளிப்படையாகச் சேர்க்கவில்லை.
