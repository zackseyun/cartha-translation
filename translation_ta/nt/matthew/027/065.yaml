revisions:
- from: பிலாத்து அவர்களிடம், “உங்களிடம் ஒரு காவல்படை இருக்கிறது.[a] போய், உங்களுக்குத் தெரிந்தபடி அதைப் பத்திரப்படுத்துங்கள்.[b]” என்றான்.
  to: பிலாத்து அவர்களிடம், “உங்களிடம் ஒரு காவல்படை இருக்கிறது.[a] போய், உங்களுக்குத் தெரிந்தபடி அதைப் பாதுகாப்பாகச் செய்யுங்கள்.[b]” என்றான்.
  rationale: The revision replaces a potentially broader ‘safeguard’ expression with wording that directly conveys securing the implied tomb/site. It also adjusts footnote b to preserve the manner-based sense of ὡς οἴδατε. The main-text ambiguity concerning the guard is retained, and the footnote anchors remain unchanged.
