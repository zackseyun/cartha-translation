  text: ἔδωκαν αὐτῷ πιεῖν ⸀οἶνον μετὰ χολῆς μεμιγμένον· καὶ γευσάμενος οὐκ ⸀ἠθέλησεν πιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/034.yaml
  text: They gave him wine mixed with gall to drink[a], but after tasting it, he was unwilling to drink.
translation:
  language: ta
  text: பித்தநீர் கலந்த திராட்சரசத்தை அவருக்குக் குடிக்கக் கொடுத்தார்கள்.[a] அவர் அதைச் சுவைத்தபின், குடிக்க விரும்பவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பித்தநீர்” என்பதற்கான கிரேக்கச் சொல் பொதுவாகக் கசப்பான ஒரு பொருளையும் குறிக்கலாம். மத்தேயுவின் சொல் தேர்வைத் தக்கவைக்க இங்கே “பித்தநீர்” என்று மொழிபெயர்க்கப்பட்டுள்ளது. தொடர்புடைய பாடுகள் பற்றிய விவரிப்பில் மாற்கு 15:23 வெள்ளைப்போளத்தைக் குறிப்பிடுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκαν αὐτῷ πιεῖν
  choice: அவருக்குக் குடிக்கக் கொடுத்தார்கள்
  rationale: δίδωμι என்பதன் நேரடியான பொருளான ‘கொடுத்தார்கள்’ என்பதையும், πιεῖν என்பதன் நோக்கத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οἶνον
  choice: திராட்சரசம்
  rationale: οἶνος என்பது பொதுவாக திராட்சையிலிருந்து தயாரிக்கப்படும் மதுவைக் குறிக்கிறது; நவீனத் தமிழில் தெளிவாக இருக்க ‘திராட்சரசம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: μετὰ χολῆς μεμιγμένον
  choice: பித்தநீர் கலந்த
  rationale: χολή என்பதன் முதன்மையான பொருளான பித்தநீரைத் தக்கவைத்து, μεμιγμένον என்பதைக் ‘கலந்த’ என்று இயல்பாக மொழிபெயர்க்கிறது; இதன் விரிவான பொருள் கசப்பான பொருளாகவும் இருக்கலாம்.
- source_word: καὶ γευσάμενος
  choice: அவர் அதைச் சுவைத்துப் பார்த்தபின்
  rationale: இறந்தகால வினையெச்சம் முன்னதாக நிகழ்ந்த சுவைத்தலைக் குறிக்கிறது. தமிழில் ‘சுவைத்துப் பார்த்தபின்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: οὐκ ἠθέλησεν πιεῖν
  choice: குடிக்க விரும்பவில்லை
  rationale: θέλω என்பதிலுள்ள விருப்பம் அல்லது மனவிருப்பம் சார்ந்த பொருளைத் தக்கவைக்கிறது; ‘மறுத்தார்’ என்று வலுப்படுத்தி விளக்கவில்லை.
theological_decisions:
- issue: பாடுகளின் நிகழ்வில் χολή என்பதன் பொருளும் வேதாகம ஒலிப்பும்
  choice: பித்தநீர்
  alternative: கசப்பான பொருள்
  rationale: χոլή பித்தநீரை நேரடியாகக் குறிக்கலாம்; விரிவாகக் கசப்பான பொருளையும் குறிக்கலாம். மத்தேயுவின் சொல் தேர்வையும் அதன் சாத்தியமான சங்கீத ஒலிப்பையும் பிரதான உரையில் தக்கவைத்து, பொருள் வரம்பை அடிக்குறிப்பில் குறிப்பிடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘குடிக்க விரும்பவில்லை’ என்பது மூலத்தின் மனவிருப்ப நுட்பத்தைத் தக்கவைக்கிறது; ‘பித்தநீர்’ மூலச் சொல்லின் திட்டவட்டத்தையும் அதன் பொருள் தெளிவின்மையையும் அடிக்குறிப்புடன் பாதுகாக்கிறது.
