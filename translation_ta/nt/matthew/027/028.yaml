  text: καὶ ἐκδύσαντες αὐτὸν ⸂χλαμύδα κοκκίνην περιέθηκαν αὐτῷ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/028.yaml
  text: And after stripping him[a], they put a scarlet cloak on him,
translation:
  language: ta
  text: அவர்கள் அவருடைய உடைகளைக் கழற்றிவிட்டு, செந்நிற மேலங்கியை[a] அவருக்குப் போர்த்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “செந்நிற அங்கி.” கிரேக்கச் சொல் உடைக்கு மேல் அணியும் அல்லது போர்த்தும் ஆடையைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: அவர்கள்…
  rationale: கிரேக்கத்தில் உள்ள இணைப்புச் சொல் முந்தைய நிகழ்வுடன் இதைத் தொடர்ச்சியாக இணைக்கிறது. தமிழில் தனி வசனமாக இயல்பாக வாசிக்க, நிகழ்வின் தொடர்ச்சி வினையெச்ச அமைப்பில் வெளிப்படுகிறது.
- source_word: ἐκδύσαντες αὐτόν
  choice: அவருடைய உடைகளைக் கழற்றிவிட்டு
  rationale: ἐκδύω ஒருவரின் ஆடைகளைக் கழற்றுவதைக் குறிக்கிறது. முற்றெச்சம், பிரதான செயலுக்கு முன் நடந்த செயலைக் காட்டுவதால், ‘கழற்றிவிட்டு’ என்பது காலத் தொடர்பை இயல்பாகப் பாதுகாக்கிறது.
- source_word: χλαμύδα
  choice: மேலங்கியை
  rationale: χλαμύς என்பது பொதுவாக உடைக்கு மேல் அணியும் அல்லது போர்த்தும் அங்கியைக் குறிக்கிறது; சில சூழல்களில் அது குறுகிய படைவீரர் மேலங்கியாக இருக்கலாம். ‘மேலங்கி’ மூலச்சொல்லின் பொருளைத் தெளிவாகவும் மிகைவிளக்கம் இன்றியும் தருகிறது.
- source_word: κοκκίνην
  choice: செந்நிற
  rationale: κόκκινος ஒளிரும் ஆழ்ந்த சிவப்பு அல்லது ஸ்கார்லெட் நிறத்தைக் குறிக்கிறது. ‘செந்நிற’ என்பது நவீனத் தமிழில் இயல்பானதும் இலக்கியக் கண்ணியமுள்ளதுமான இணைச்சொல்.
- source_word: περιέθηκαν αὐτῷ
  choice: அவருக்குப் போர்த்தினார்கள்
  rationale: περιτίθημι இங்கு ஒருவரைச் சுற்றி ஆடையை அணிவிப்பதையோ போர்த்துவதையோ குறிக்கிறது. மேலங்கியின் சூழலில் ‘போர்த்தினார்கள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
theological_decisions:
- issue: கேலிக்குரிய அரச ஆடையாகப் பயன்படுத்தப்பட்ட ஆடையின் தன்மை
  choice: செந்நிற மேலங்கி
  alternative: செந்நிற அங்கி; செந்நிறப் படைவீரர் மேலங்கி
  rationale: இக்காட்சி இயேசுவை அரசனாகக் கேலி செய்து அலங்கரிப்பதைக் காட்டுகிறது. ‘மேலங்கி’ என்பது χλαμύς என்பதன் அடிப்படை ஆடைப் பொருளைப் பாதுகாக்கிறது; ‘அரச அங்கி’ என்று மொழிபெயர்த்து மூலத்தில் இல்லாத அரச அடையாளத்தைச் சேர்ப்பதையும், ‘படைவீரர் மேலங்கி’ என்று சூழலை அதிகமாக விளக்குவதையும் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘கழற்றிவிட்டு’ முற்றெச்சச் செயலின் முன்னுரிமையையும், ‘போர்த்தினார்கள்’ ஆடையை அவரைச் சுற்றி அணிவித்த செயலையும் இயல்பாக வெளிப்படுத்துகின்றன.
