source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ὁ καταλύων τὸν ναὸν καὶ ἐν τρισὶν ἡμέραις οἰκοδομῶν, σῶσον σεαυτόν· εἰ υἱὸς εἶ τοῦ θεοῦ, ⸀κατάβηθι ἀπὸ τοῦ σταυροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/040.yaml
  text: and saying[a], “You who would destroy the temple and build it in three days, save yourself! If you are the Son of God, come down from the cross.”
translation:
  language: ta
  text: மேலும் அவர்கள், “ஆலயத்தை இடித்து, மூன்று நாட்களில் கட்டுகிறவனே[a], உன்னையே காப்பாற்றிக்கொள்! நீ கடவுளின் மகனானால், சிலுவையிலிருந்து இறங்கி வா!” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மீண்டும் கட்டுகிறவனே.” கிரேக்க வினைச்சொல் நேரடியாக “கட்டு” என்றே பொருள்படும்; ஆனால் இந்த இகழ்ச்சியின் சூழல் மீண்டும் கட்டுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: என்று சொன்னார்கள்
  rationale: முந்தைய வசனத்தின் செயலைத் தொடரும் நிகழ்காலப் பங்கேற்புவினை. தமிழில் நேரடி உரையின் முடிவில் வரும் இயல்பான உரையறிமுக வடிவமாக மொழிபெயர்க்கப்பட்டது.
- source_word: Ὁ καταλύων
  choice: இடித்துவிட்டு … கட்டுகிறவனே
  rationale: கட்டுரைச்சொல்லுடன் வரும் பங்கேற்புவினை நேரடி அழைப்பாகச் செயல்படுகிறது. ஆலயத்தைத் தகர்ப்பதைக் குறிக்கும் இகழ்ச்சியான சவாலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ναός
  choice: ஆலயம்
  rationale: இங்கு எருசலேம் ஆலயத்தைக் குறிக்கிறது; சாதாரண வாசகர்களுக்கு இயல்பாகவும், ναός என்பதன் ஆலயப் பொருளைத் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: ἐν τρισὶν ἡμέραις
  choice: மூன்று நாட்களில்
  rationale: கிரேக்க காலக் குறிப்பைச் சுருக்கமாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
- source_word: οἰκοδομῶν
  choice: கட்டுகிறவனே
  rationale: கிரேக்க வினைச்சொல் அடிப்படையில் ‘கட்டு’ என்றே பொருள்படும். சூழல் ‘மீண்டும் கட்டு’ என்பதை உணர்த்தக்கூடும் என்பதால் அது அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: σῶσον σεαυτόν
  choice: உன்னையே காப்பாற்றிக்கொள்
  rationale: தற்சுட்டுப் பெயர்ச்சொல்லின் வலியுறுத்தலையும் இகழ்ச்சியான கட்டளையையும் காக்கிறது.
- source_word: εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: நீ கடவுளின் மகனானால்
  rationale: நிபந்தனை வடிவிலான சவாலையும் கிறிஸ்துவியல் பட்டத்தின் முழு வலிமையையும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: κατάβηθι ἀπὸ τοῦ σταυροῦ
  choice: சிலுவையிலிருந்து இறங்கி வா
  rationale: உயரத்தில் சிலுவையில் இருப்பவரை நோக்கிச் சொல்லப்படும் கீழ்நோக்கிய இயக்கத்தை இயல்பான தமிழ்க் கட்டளையாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இகழ்ச்சிச் சூழலில் υἱὸς τοῦ θεοῦ என்ற கிறிஸ்துவியல் பட்டத்தை மொழிபெயர்த்தல்
  choice: கடவுளின் மகன்
  alternative: கடவுளுடைய மகன்
  rationale: இயேசுவின் அடையாளத்தைச் சவாலிடும் இகழ்ச்சியை அப்படியே காத்து, பட்டத்தின் இறையியல் வலிமையைக் குறைக்காமலும் உரைக்கு அப்பாற்பட்ட விளக்கத்தைச் சேர்க்காமலும் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நேரடி உரை நடை பயன்படுத்தப்பட்டுள்ளது. கேலி மற்றும் சவாலின் கூர்மை தணிக்கப்படவில்லை; அதே நேரத்தில் தேவையற்ற பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
