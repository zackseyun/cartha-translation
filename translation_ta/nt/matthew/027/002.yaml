id: MAT.27.2
reference: Matthew 27:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ δήσαντες αὐτὸν ἀπήγαγον καὶ ⸀παρέδωκαν Πιλάτῳ τῷ ἡγεμόνι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/002.yaml
  text: And after binding him[b][a], they led him away and handed him over to Pilate the governor.
translation:
  language: ta
  text: அவரைக் கட்டிய பின்பு[a], அவர்கள் அவரை அழைத்துச் சென்று ஆளுநரான பிலாத்துவிடம் ஒப்படைத்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரைக் கட்டி.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கையளித்தார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δήσαντες
  choice: கட்டிய பின்பு
  rationale: δέω என்பதன் இறந்தகால வினையெச்ச வடிவம், முதன்மை வினைகளுக்கு முன்பு நிகழ்ந்த செயலைக் குறிக்கிறது. ‘கட்டிய பின்பு’ என்பது அந்த முன்நிகழ்வை இயல்பான நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἀπήγαγον
  choice: அழைத்துச் சென்று
  rationale: ἀπάγω என்பது ஒருவரை ஓரிடத்திலிருந்து கூட்டிச் செல்வதைக் குறிக்கிறது. காவலின் கீழ் இயேசுவைக் கொண்டு சென்ற சூழலுக்கு ‘அழைத்துச் சென்று’ இயல்பாகப் பொருந்துகிறது.
- source_word: παρέδωκαν
  choice: ஒப்படைத்தார்கள்
  rationale: παραδίδωμι இங்கு ஒருவரை மற்றொருவரின் அதிகாரத்திற்கும் காவலுக்கும் ஒப்படைப்பதைக் குறிக்கிறது. ‘ஒப்படைத்தார்கள்’ என்பது நீதித்துறைச் சூழலைத் தெளிவாகக் காட்டுவதோடு, சொல்லின் இறையியல் எதிரொலியை மிகையாக விளக்குவதில்லை.
- source_word: Πιλάτῳ
  choice: பிலாத்துவிடம்
  rationale: Πιλᾶτος என்ற தனிப்பெயர் வழக்கமான தமிழ் வடிவில் ஒலிபெயர்க்கப்பட்டு, கிரேக்க வேற்றுமையின் பெறுநர் பொருள் ‘-ிடம்’ மூலம் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: τῷ ἡγεμόνι
  choice: ஆளுநரான
  rationale: ἡγεμών என்பது ஆட்சி அதிகாரியைக் குறிக்கும் பொதுவான பதவி. வரலாற்று ரீதியாக இன்னும் குறிப்பான பதவிப் பெயரைத் திணிக்காமல், மூலத்தின் பொதுத்தன்மையை ‘ஆளுநர்’ காக்கிறது.
- source_word: καὶ … καὶ
  choice: … பின்பு, … சென்று
  rationale: கிரேக்கத்தின் தொடர்ச்சியான இணைப்புகள், தமிழில் இயல்பான நிகழ்வு வரிசையாக மாற்றப்பட்டுள்ளன; கட்டுதல், அழைத்துச் செல்லுதல், ஒப்படைத்தல் என்ற வரிசை முழுமையாகப் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: பாடுகளின் நிகழ்வில் παραδίδωμι என்பதன் பொருள்
  choice: ஒப்படைத்தார்கள்
  alternative: கையளித்தார்கள்
  rationale: உடனடி சூழலில் இது பிலாத்துவின் அதிகாரத்திற்குள் இயேசுவை ஒப்படைத்த நீதித்துறைச் செயலைக் குறிக்கிறது. ‘ஒப்படைத்தார்கள்’ அந்த நேரடிப் பொருளை முன்னிறுத்துகிறது; அதேவேளையில், பாடுகளின் கதையில் உள்ள விரிவான இறையியல் எதிரொலியை மறுப்பதோ மிகைப்படுத்துவதோ இல்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அவர்கள்’ எனும் எழுவாய் தமிழில் தெளிவுக்காக வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது; அது கிரேக்க வினை வடிவில் உட்பொதிந்துள்ளது. நிகழ்வுகளின் வரிசையும் நீதித்துறைச் சூழலும் காக்கப்பட்டுள்ளன.
