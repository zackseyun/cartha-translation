  text: τότε λέγει αὐτῷ ὁ Πιλᾶτος· Οὐκ ἀκούεις πόσα σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/013.yaml
  text: Then Pilate says to him[a], “Do you not hear how many things they are testifying against you?”
translation:
  language: ta
  text: அப்போது பிலாத்து அவரிடம், “அவர்கள் உனக்கு எதிராக எத்தனை காரியங்களைச் சாட்சியாகக் கூறுகிறார்கள்[a] என்பதை நீ கேட்கவில்லையா?” என்று கேட்கிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “உனக்கு எதிராகச் சாட்சி கூறுகிறார்கள்” அல்லது “உனக்கு எதிராகச் சாட்சியளிக்கிறார்கள்.” கிரேக்க வினைச்சொல் சட்ட விசாரணை சார்ந்த பொருளைக் கொண்டுள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: அடுத்த நிகழ்வை அறிமுகப்படுத்தும் காலச் சுட்டியாக, இயல்பான நவீனத் தமிழில் ‘அப்போது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: λέγει αὐτῷ ὁ Πιλᾶτος
  choice: பிலாத்து அவரிடம் ... என்று கேட்டான்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் இருந்தாலும், தமிழ் கதைநடையில் இயல்பான இறந்தகாலம் பயன்படுத்தப்பட்டுள்ளது. கேள்வி உரையாதலால் ‘சொன்னான்’ என்பதற்குப் பதிலாக ‘கேட்டான்’ இயல்பாக உள்ளது; αὐτῷ என்பதன் பிரதிப்பெயர் தன்மையை ‘அவரிடம்’ காக்கிறது.
- source_word: Οὐκ ἀκούεις
  choice: நீ கேட்கவில்லையா?
  rationale: எதிர்மறை வினாவின் நேரடியான வலிமையையும் ἀκούω என்பதன் அடிப்படைப் பொருளான ‘கேள்’ என்பதையும் காக்கிறது.
- source_word: πόσα
  choice: எத்தனை காரியங்களை
  rationale: கிரேக்கத்தின் நடுநிலைப் பன்மையை வெளிப்படையாக ‘குற்றச்சாட்டுகள்’ என்று விளக்காமல், அதன் பொதுவான குறிப்பைத் தக்கவைக்கிறது.
- source_word: σου καταμαρτυροῦσιν
  choice: உனக்கு எதிராக ... சாட்சி கூறுகிறார்கள்
  rationale: καταμαρτυρέω என்பதிலுள்ள சட்டம் சார்ந்த ‘எதிராகச் சாட்சி கூறுதல்’ என்ற பொருளை, வெறுமனே ‘குற்றஞ்சாட்டுதல்’ என்று சுருக்காமல் வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் நீதிமன்றச் சூழலின் சாட்சிய மொழியைத் தக்கவைக்கும் வகையிலும் அமைக்கப்பட்டுள்ளது. இயேசுவைக் குறிக்கும் மூன்றாம் நபர் பிரதிப்பெயரில் மரியாதை வடிவமும், பிலாத்தின் நேரடி உரையில் மூலத்தின் ஒருமை இரண்டாம் நபர் வடிவமும் பயன்படுத்தப்பட்டுள்ளன.
