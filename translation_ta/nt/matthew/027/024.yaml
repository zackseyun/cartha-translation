  verdict: revise
  source_fidelity: The draft accurately represents Pilate's observation, the public handwashing, and his disclaimer of responsibility. However, the Tamil progressive present “உருவாகிக்கொண்டிருக்கிறது” conflicts with the past narrative frame introduced by “கண்டபோது”; it should be past progressive. The future middle ὄψεσθε is more closely retained by a Tamil future form than by the draft's imperative.
  naturalness: The wording is generally clear and dignified modern standard Tamil. Changing the progressive verb to past tense improves narrative coherence. “நீங்களே பார்த்துக்கொள்வீர்கள்” is natural in context as a responsibility-disclaiming statement, while retaining the source's future form.
  terminology: “இரத்தப்பழி” naturally conveys culpability for a death and is appropriately qualified by a literal footnote preserving “this blood.” “கலவரம்” is possible in this escalating public setting; the footnote appropriately records less specific alternatives.
  issues:
  - severity: medium
    issue: Narrative-tense mismatch in “கலவரம் உருவாகிக்கொண்டிருக்கிறது.”
    rationale: γένιται is present in Greek within past narration and is idiomatically rendered as an emerging/developing disturbance; Tamil requires past progressive (“உருவாகிக்கொண்டிருந்தது”) following “கண்டபோது.”
  - severity: low
    issue: “நீங்களே பார்த்துக்கொள்ளுங்கள்” is imperative although ὄψεσθε is future.
    rationale: The imperative conveys the contextual sense, but “நீங்களே பார்த்துக்கொள்வீர்கள்” preserves the Greek future while still naturally expressing Pilate's transfer of responsibility.
