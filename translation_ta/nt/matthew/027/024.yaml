  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Πιλᾶτος ὅτι οὐδὲν ὠφελεῖ ἀλλὰ μᾶλλον θόρυβος γίνεται λαβὼν ὕδωρ ἀπενίψατο τὰς χεῖρας ⸀ἀπέναντι τοῦ ὄχλου λέγων· Ἀθῷός εἰμι ἀπὸ τοῦ ⸀αἵματος τούτου· ὑμεῖς ὄψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/024.yaml
  text: So when Pilate saw that he was gaining nothing[a], but rather that a riot was developing, he took water and washed his hands before the crowd, saying, “I am innocent of this blood[c][b]; you yourselves will see to it.”
translation:
  language: ta
  text: அப்போது பிலாத்து, எதுவும் பயனளிக்கவில்லை என்றும், மாறாகக் கலவரம் உருவாகிக்கொண்டிருந்தது[a] என்றும் கண்டபோது, தண்ணீரை எடுத்து மக்கள் கூட்டத்தின் முன்னிலையில் தன் கைகளைக் கழுவி, “இந்த இரத்தப்பழியில் நான் குற்றமற்றவன்.[b] நீங்களே பார்த்துக்கொள்வீர்கள்.[c]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கூச்சலும் குழப்பமும் எழுந்துகொண்டிருந்தது” அல்லது “கலகம் ஏற்பட்டுக்கொண்டிருந்தது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “இந்த இரத்தத்திலிருந்து நான் குற்றமற்றவன்.” இது ஒருவரின் மரணத்துக்கான பொறுப்பிலிருந்து விடுபட்டிருப்பதாகக் கூறும் மரபுத்தொடர்.'
    reason: lexical_alternative
  - marker: c
    text: 'சொல்லுக்குச் சொல்: “நீங்களே பார்ப்பீர்கள்.” இங்கு, “இதற்கு நீங்களே பொறுப்பேற்றுக்கொள்வீர்கள்” என்ற பொருளில் இருக்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: அப்போது ... கண்டபோது
  rationale: δέ தொடர்கதையின் அடுத்த நிகழ்வை அறிமுகப்படுத்துகிறது; அசல் உரையில் இல்லாத வலுவான எதிர்மறைத் தொடர்பைச் சேர்க்காமல், இயல்பான தமிழ் ஓட்டத்தைக் கொடுக்கிறது.
- source_word: οὐδὲν ὠφελεῖ
  choice: எதுவும் பயனளிக்கவில்லை
  rationale: ‘எதுவும் உதவவில்லை/பயனளிக்கவில்லை’ என்ற கிரேக்கத்தின் பொதுவான அமைப்பையும், பிலாத்துவின் முயற்சியே பயனற்றதாயிற்று என்ற சூழல்சார் பொருளையும் தக்கவைக்கிறது.
- source_word: ἀλλὰ μᾶλλον θόρυβος γίνεται
  choice: மாறாகக் கலவரம் உருவாகிக்கொண்டிருக்கிறது
  rationale: θόρυβος பொதுக் குழப்பம், கூச்சல் அல்லது கலவரத்தைக் குறிக்கலாம்; γίνεται நிகழ்வு வளர்ந்து வருவதைக் காட்டுவதால் தொடர்நிலைப் பயன்பாடு தேர்ந்தெடுக்கப்பட்டது.
- source_word: λαβὼν ὕδωρ ἀπενίψατο τὰς χεῖρας
  choice: தண்ணீரை எடுத்து ... தன் கைகளைக் கழுவி
  rationale: முதலில் தண்ணீரை எடுத்து, பின்னர் கைகளைக் கழுவிய தொடர்ச்சியான செயல்களைத் தெளிவான, இயல்பான தமிழில் வழங்குகிறது; நடுவினை வடிவின் தன்சார்பை ‘தன்’ வெளிப்படுத்துகிறது.
- source_word: ἀπέναντι τοῦ ὄχλου
  choice: மக்கள் கூட்டத்தின் முன்னிலையில்
  rationale: செயல் கூட்டத்தினர் காணும்படி வெளிப்படையாக நடந்ததைக் காட்டுகிறது.
- source_word: Ἀθῷός εἰμι ἀπὸ τοῦ αἵματος τούτου
  choice: இந்த இரத்தப்பழியில் நான் குற்றமற்றவன்
  rationale: ‘இந்த இரத்தத்திலிருந்து நான் குற்றமற்றவன்’ என்ற நேரடி அமைப்பைத் தமிழில் புரியக்கூடிய மரணப் பொறுப்பு சார்ந்த மரபுத்தொடராக வழங்குகிறது; இது பிலாத்துவின் கூற்றே அன்றி உரையாசிரியரின் தீர்ப்பல்ல.
- source_word: ὑμεῖς ὄψεσθε
  choice: நீங்களே பார்த்துக்கொள்ளுங்கள்
  rationale: சொல்லுக்குச் சொல் ‘நீங்களே பார்ப்பீர்கள்’; இச்சூழலில் பொறுப்பை மற்றவர்களிடம் ஒப்படைக்கும் மரபுத்தொடராக இருப்பதால் ‘பார்த்துக்கொள்ளுங்கள்’ இயல்பான தமிழ் இணையாகும். ‘நீங்களே’ என்பது ὑμεῖς தரும் வலியுறுத்தலைக் காக்கிறது.
theological_decisions:
- issue: பிலாத்து தன்னைத் தானே குற்றமற்றவன் என்று அறிவித்தல்
  choice: அதை பிலாத்துவின் நேரடிக் கூற்றாக மட்டும் வழங்குதல்
  alternative: பிலாத்து உண்மையிலேயே பொறுப்பற்றவன் என்று மொழிபெயர்ப்பில் உறுதிப்படுத்துதல்
  rationale: கிரேக்க உரை பிலாத்துவின் பொறுப்புத் துறப்பைக் கூறுகிறது; அதன் உண்மைத்தன்மையைத் தீர்மானிப்பதில்லை. ஆகவே கதையின் அறநெறி மற்றும் இறையியல் பதற்றம் தீர்க்கப்படாமல் பாதுகாக்கப்படுகிறது.
- issue: ὑμεῖς ὄψεσθε என்பதில் உள்ள பொறுப்பு
  choice: “நீங்களே பார்த்துக்கொள்ளுங்கள்” என்று சூழல்சார் மரபுத்தொடராக வழங்குதல்
  alternative: “நீங்களே பார்ப்பீர்கள்” என்று சொல்லுக்குச் சொல் வழங்குதல்
  rationale: தெளிவான சூழல்சார் பொருளைக் கொடுத்தாலும், குறிப்பில் நேரடி வடிவம் தரப்பட்டு அசல் சொல்லாட்சியின் திறந்த தன்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் வகையிலும் நீதிமன்றச் சூழலுக்குரிய கண்ணியமான தொனியிலும் வடிவமைக்கப்பட்டது. ‘இரத்தப்பழி’ என்பது மரணத்துக்கான குற்றப்பொறுப்பை இயல்பாக உணர்த்துகிறது; இருப்பினும் அசல் ‘இரத்தம்’ என்ற சொல்லாட்சி அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
