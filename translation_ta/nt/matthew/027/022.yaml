id: MAT.27.22
reference: Matthew 27:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Πιλᾶτος· Τί οὖν ποιήσω Ἰησοῦν τὸν λεγόμενον χριστόν; ⸀λέγουσιν πάντες· Σταυρωθήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/022.yaml
  text: Pilate said to them[a], “What then should I do with Jesus who is called Messiah?” They all said, “Let him be crucified.”
translation:
  language: ta
  text: பிலாத்து அவர்களிடம், “அப்படியானால், மேசியா[a] என்று அழைக்கப்படும் இயேசுவை நான் என்ன செய்ய வேண்டும்?” என்றான். அவர்கள் அனைவரும், “அவர் சிலுவையில் அறையப்படட்டும்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்து.”
    reason: Χριστός என்ற கிரேக்கப் பட்டத்தை ‘மேசியா’ என்றும் மரபான ஒலிபெயர்ப்பில் ‘கிறிஸ்து’ என்றும் தரலாம்.
lexical_decisions:
- source_word: Τί οὖν ποιήσω
  choice: அப்படியானால், ... நான் என்ன செய்ய வேண்டும்?
  rationale: ποιήσω இங்கு ஆலோசனைக்குரிய கேள்வியில் வரும் இறந்தகாலத் துணைவினை வடிவம்; தமிழில் ‘நான் என்ன செய்ய வேண்டும்?’ என்பது அதன் இயல்பான கேள்வி வலிமையைத் தருகிறது. οὖν-இன் முடிவுசார் தொடர்பை ‘அப்படியானால்’ வெளிப்படுத்துகிறது.
- source_word: Ἰησοῦν
  choice: இயேசுவை
  rationale: தனிப்பெயர் தமிழில் நிலைபெற்ற வடிவில் ஒலிபெயர்க்கப்பட்டு, ποιήσω வினையின் செயப்படுபொருளாக வேற்றுமை உருபுடன் தரப்பட்டுள்ளது.
- source_word: τὸν λεγόμενον χριστόν
  choice: மேசியா என்று அழைக்கப்படும்
  rationale: λεγόμενον என்ற நிகழ்காலச் செயப்பாட்டு எச்சத்தின் பண்புப்பெயர் செயல்பாட்டை ‘என்று அழைக்கப்படும்’ காக்கிறது. χριστός இங்கு தனிப்பெயராக அல்ல, பட்டமாகச் செயல்படுவதால் அதன் யூத மேசியா சார்ந்த பொருளைக் காட்ட ‘மேசியா’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: λέγουσιν πάντες
  choice: அவர்கள் அனைவரும் ... என்றார்கள்
  rationale: வரலாற்று நிகழ்காலமான λέγουσιν தமிழ் கதைநடையில் இயல்பாக இறந்தகாலத்தில் தரப்படுகிறது; πάντες என்பதன் முழுக் கூட்டத்தையும் குறிக்கும் வலிமையை ‘அனைவரும்’ காக்கிறது.
- source_word: Σταυρωθήτω
  choice: அவர் சிலுவையில் அறையப்படட்டும்
  rationale: மூன்றாம் நபர் ஒருமை இறந்தகாலச் செயப்பாட்டு ஏவல் வடிவத்தின் கட்டளை வலிமையையும் செயப்பாட்டு அமைப்பையும் ‘அறையப்படட்டும்’ காக்கிறது; ‘சிலுவையில் அறையுங்கள்’ என்ற செயவினை மாற்றம் தவிர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: ‘மேசியா என்று அழைக்கப்படும் இயேசு’ என்ற தொடரில் χριστός ஒரு பட்டமாகச் செயல்படுகிறது. ஆகவே பட்டத்தின் பொருளை உணர்த்த ‘மேசியா’ முதன்மை உரையில் தரப்பட்டு, மரபான ‘கிறிஸ்து’ அடிக்குறிப்பில் மாற்றாகப் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. பிலாத்தின் கேள்வி நேரடி உரையாகவும், கூட்டத்தின் பதில் செயப்பாட்டு ஏவல் வடிவத்திலும் பாதுகாக்கப்பட்டுள்ளது.
