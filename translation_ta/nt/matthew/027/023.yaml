revisions:
- from: ஆனால் அவரோ, “இவர் என்ன தீமை செய்தார்?” என்று கேட்டார்.[a] அவர்களோ, “சிலுவையில் அறையப்படட்டும்!” என்று இன்னும் அதிகமாகக் கூக்குரலிட்டார்கள்.[b]
  to: ஆனால் அவர், “இவர் என்ன தீமை செய்தார்?” என்றார்.[a] அவர்களோ, “சிலுவையில் அறையப்படட்டும்!” என்று இன்னும் அதிகமாகக் கூக்குரலிட்டுக்கொண்டே இருந்தார்கள்.[b]
  rationale: ‘என்றார்’ ἔφηயின் பொதுவான பேச்சு-அறிமுகச் செயல்பாட்டைக் காக்கிறது. ‘கூக்குரலிட்டுக்கொண்டே இருந்தார்கள்’ ἔκραζον என்ற முற்றாத இறந்தகாலத்தின் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது; ‘இன்னும் அதிகமாக’ περισσῶς காட்டும் தீவிரமாதலைத் தக்கவைக்கிறது. திருத்தப்பட்ட குறிப்பு செயப்பாட்டு மூலவடிவத்தையும் செயல்வினை மாற்றுருவத்தையும் இலக்கணரீதியாகச் சரியாக வேறுபடுத்துகிறது.
