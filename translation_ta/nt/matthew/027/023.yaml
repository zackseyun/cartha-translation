reference: Matthew 27:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἔφη· Τί γὰρ κακὸν ἐποίησεν; οἱ δὲ περισσῶς ἔκραζον λέγοντες· Σταυρωθήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/023.yaml
  text: But he said[a], “What evil has he done?” But they cried out all the more, saying[b], “Let him be crucified.”
translation:
  language: ta
  text: ஆனால் அவர், “இவர் என்ன தீமை செய்தார்?” என்றார்.[a] அவர்களோ, “சிலுவையில் அறையப்படட்டும்!” என்று இன்னும் அதிகமாகக் கூக்குரலிட்டுக்கொண்டே இருந்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இயல்பான வலியுறுத்தலுடன், “ஏன், இவர் என்ன தவறு செய்தார்?” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இதைச் செய்வினை வடிவில், “அவரைச் சிலுவையில் அறையுங்கள்” என்றும் சொல்லலாம். கிரேக்கத்தில் நேரடியாக, “சிலுவையில் அறையப்படட்டும்” என்ற செயப்பாட்டு ஏவல் உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ ἔφη
  choice: ஆனால் அவரோ ... என்று கேட்டார்
  rationale: δέ காட்டும் எதிர்மறைத் தொடர்ச்சியை ‘ஆனால் ... -ஓ’ வெளிப்படுத்துகிறது. φημί இங்கு உரையாடலை அறிமுகப்படுத்தினாலும், நேரடியாக ஒரு கேள்வி வருவதால் இயல்பான தமிழில் ‘கேட்டார்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: Τί γὰρ κακὸν ἐποίησεν;
  choice: இவர் என்ன தீமை செய்தார்?
  rationale: τί ... κακόν என்பது செய்த தீமை என்ன என்று சவாலாகக் கேட்கிறது. γάρ-ஐ தனியாக ‘ஏனெனில்’ என்று மொழிபெயர்ப்பது தமிழில் இயல்பற்றது; கேள்வியின் சூழலும் தொனியும் அதன் செயல்பாட்டைத் தருகின்றன. κακόν என்பதன் ஒழுக்கநெறிசார் வலிமையை ‘தீமை’ காக்கிறது.
- source_word: οἱ δὲ
  choice: அவர்களோ
  rationale: பிலாத்துவின் கேள்விக்கும் கூட்டத்தின் பதிலுக்கும் உள்ள முரண்பாட்டை ‘-ஓ’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: περισσῶς ἔκραζον
  choice: இன்னும் அதிகமாகக் கூக்குரலிட்டார்கள்
  rationale: περισσῶς எதிர்வினை தீவிரமடைந்ததைச் சுட்டுகிறது; ἔκραζον என்பதன் இறந்தகாலத் தொடர்நிலைச் செயலை ‘கூக்குரலிட்டார்கள்’ சூழலில் இயல்பாக எடுத்துரைக்கிறது. ‘உரக்க’ எனச் சேர்த்து ஒலியளவை மட்டும் தேவையின்றி குறிப்பாக்கவில்லை.
- source_word: λέγοντες
  choice: “...” என்று
  rationale: கூக்குரலின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் கிரேக்கப் பங்கேற்புவினை தமிழின் இயல்பான மேற்கோள் அமைப்பான ‘என்று’ மூலம் தரப்பட்டுள்ளது.
- source_word: Σταυρωθήτω
  choice: சிலுவையில் அறையப்படட்டும்
  rationale: மூன்றாம் நபர் இறந்தகாலச் செயப்பாட்டு ஏவலைத் தமிழிலும் செயப்பாட்டு வடிவில் காக்கிறது. சூழலில் குறிப்பிடப்படுபவர் தெளிவாக இருப்பதால் தமிழில் எழுவாய் இயல்பாக விடப்பட்டுள்ளது.
theological_decisions:
- issue: கூட்டத்தின் சிலுவைத் தண்டனைக் கோரிக்கையின் இலக்கண வடிவம்
  choice: சிலுவையில் அறையப்படட்டும்
  alternative: அவனைச் சிலுவையில் அறையுங்கள்
  rationale: கிரேக்கத்தில் செயப்பாட்டு ஏவல் உள்ளது. செயப்பாட்டு வடிவத்தைத் தமிழிலும் வைத்திருப்பது, செயலைச் செய்ய வேண்டியவரை வெளிப்படையாகச் சேர்க்காமல் மூலத்தின் வடிவத்தையும் இறையியல் திறந்தநிலையையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. பிலாத்து இயேசுவைக் குறிப்பிடும் இடத்தில் ‘இவர்’ பயன்படுத்தப்பட்டுள்ளது; கூட்டத்தின் கோரிக்கையில் கிரேக்கத்தைப் போல எழுவாய் வெளிப்படையாகச் சேர்க்கப்படவில்லை. ‘கூக்குரலிட்டார்கள்’ என்பது சாதாரண வாசகர்களுக்குப் புரியும் தற்போதைய இலக்கியநடைச் சொல்.
