id: MAT.27.44
reference: Matthew 27:44
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τὸ δ’ αὐτὸ καὶ οἱ λῃσταὶ οἱ συσταυρωθέντες ⸀σὺν αὐτῷ ὠνείδιζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/044.yaml
  text: In the same way[b][a], even the robbers who had been crucified with him were insulting him.
translation:
  language: ta
  text: அதேபோலவே[a], அவரோடு சிலுவையில் அறையப்பட்டிருந்த கொள்ளையர்கள்கூட அவரை இகழ்ந்துகொண்டிருந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதையே செய்தார்கள்’; இந்தக் கிரேக்க மரபுத்தொடர், அவர்களும் முன்பு குறிப்பிடப்பட்டவர்களைப் போலவே அவரை நடத்தினார்கள் என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவரைப் பழித்துரைத்துக்கொண்டிருந்தார்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δ’ αὐτὸ
  choice: அதேபோலவே
  rationale: τὸ αὐτό இங்கு வினையடைத் தொடராக வந்து, முன்பு விவரிக்கப்பட்ட அதே வகையான இகழ்ச்சியைச் சுட்டுகிறது. ‘அதேபோலவே’ என்பது அந்தப் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: καὶ
  choice: கூட
  rationale: வழிப்போக்கர்களும் தலைவர்களும் மட்டுமல்லாமல், இயேசுவோடு சிலுவையில் அறையப்பட்ட கொள்ளையர்களும் இகழ்ந்தார்கள் என்ற வலியுறுத்தலை ‘கூட’ வெளிப்படுத்துகிறது.
- source_word: οἱ λῃσταὶ
  choice: கொள்ளையர்கள்
  rationale: λῃστής என்பது கொள்ளையன் அல்லது வழிப்பறிக்காரனைக் குறிக்கலாம். அரசியல் கிளர்ச்சியாளர்கள் என்று தேவையின்றிக் குறிப்பாக்காமல், பொதுவாகவும் தெளிவாகவும் ‘கொள்ளையர்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: οἱ συσταυρωθέντες σὺν αὐτῷ
  choice: அவரோடு சிலுவையில் அறையப்பட்டிருந்த
  rationale: இந்த இறந்தகாலச் செயப்பாட்டு எச்சம் கொள்ளையர்களை அடையாளப்படுத்துகிறது. ‘அறையப்பட்டிருந்த’ என்பது முதன்மை வினைக்கு முன் நிகழ்ந்த செயப்பாட்டு நிகழ்வை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ὠνείδιζον
  choice: இகழ்ந்துகொண்டிருந்தார்கள்
  rationale: நிறைவுறா இறந்தகால வினை தொடர்ந்து நடந்த செயலைக் காட்டுகிறது. ‘இகழ்ந்துகொண்டிருந்தார்கள்’ அந்த நீடித்த தன்மையை நவீனத் தமிழில் தெளிவாகக் காக்கிறது.
- source_word: αὐτόν
  choice: அவரை
  rationale: இது இயேசுவைக் குறிக்கும் நேரடிச் செயப்படுபொருள்; மரியாதை ஒருமைத் தமிழில் ‘அவரை’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: லூக்காவின் விவரிப்பில் ஒரு குற்றவாளி வேறுவிதமாகப் பேசுவதோடு ஒத்திசைக்க வேண்டுமா?
  choice: மத்தேயுவின் பன்மை வடிவத்தைத் தணிக்காமல், இக்காட்சியில் கொள்ளையர்கள் அவரை இகழ்ந்ததாக மொழிபெயர்த்தல்.
  alternative: நற்செய்தி நூல்களுக்கிடையிலான தோற்றமளிக்கும் பதற்றத்தைத் தவிர்க்க பன்மையின் வலிமையை மென்மைப்படுத்துதல்.
  rationale: கிரேக்க மூலத்தில் ‘கொள்ளையர்கள்’ என்பது பன்மையிலும், ὠνείδιζον என்பது தொடர்ச்சியைக் காட்டும் பன்மை வினையாகவும் உள்ளது. ஆகவே மத்தேயுவின் சொற்களை அப்படியே காத்து, வேறு நற்செய்தி விவரிப்போடு மறைமுகமாக ஒத்திசைக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும், அதேவேளையில் கண்ணியமான நடை. ‘அவரோடு’ மற்றும் ‘அவரை’ என்ற மரியாதை ஒருமை இயேசுவைக் குறிக்கிறது. தொடர்ச்சியான செயலை ‘-கொண்டிருந்தார்கள்’ வடிவம் காக்கிறது.
