  source_fidelity: மூலத்தின் τὸ δὲ αὐτὸ என்ற ‘அதேபோல/அதே விதமாக’ பொருளும், வலியுறுத்தும் καὶ (‘கூட’), பன்மையான οἱ λῃσταὶ, அவரோடு சிலுவையில் அறையப்பட்டவர்களைக் குறிக்கும் செயப்பாட்டு எச்சம், மற்றும் தொடர்ச்சியான ὠνείδιζον ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. பன்மையைத் தணிக்கவோ, லூக்காவுடன் ஒத்திசைக்கவோ முயற்சிக்கவில்லை.
  naturalness: “அதேபோலவே, அவரோடு சிலுவையில் அறையப்பட்டிருந்த கொள்ளையர்கள்கூட அவரை இகழ்ந்துகொண்டிருந்தார்கள்” என்பது நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமான நடையிலும் உள்ளது. “இகழ்ந்துகொண்டிருந்தார்கள்” நிறைவுறா இறந்தகாலத்தின் தொடர்ச்சியை நன்கு வெளிப்படுத்துகிறது.
