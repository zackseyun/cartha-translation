lexical_decisions:
- source_word: ἐλθόντες
  choice: வந்தார்கள்
  rationale: இறந்தகாலப் பெயரெச்சத்தின் காலச் சார்பைத் தமிழின் இயல்பான தொடர் வாக்கிய அமைப்பில் வெளிப்படுத்துகிறது; ‘வந்து’ என்பதைக் காட்டிலும் இங்கு முழு வாக்கியமாக அமைவது தெளிவானது.
- source_word: τόπον
  choice: ஓர் இடத்திற்கு
  rationale: τόπος என்பதன் இயல்பான பொருள் ‘இடம்’; கிரேக்கத்தில் சுட்டுச் சொல் இல்லாததால் ‘ஓர்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: λεγόμενον
  choice: எனப்படும்
  rationale: ஒரு பெயரால் அழைக்கப்படுவதைக் குறிக்கும் இந்தப் பயன்பாட்டுக்கு நவீன எழுத்துத் தமிழில் ‘எனப்படும்’ இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: Γολγοθᾶ
  choice: கொல்கொதா
  rationale: இடப்பெயர் மொழிபெயர்க்கப்படாமல், கிரேக்க ஒலிப்புக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: ὅ ἐστιν
  choice: அதற்கு … என்று பொருள்
  rationale: இது கொல்கொதா என்ற பெயரை வாசகருக்கு விளக்கும் சொற்றொடர். தமிழில் ‘அதற்கு … என்று பொருள்’ அதன் விளக்கத் தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Κρανίου Τόπος
  choice: மண்டையோட்டின் இடம்
  rationale: κρανίον என்பதற்கு பொதுவாகப் புரியும் ‘மண்டையோடு’ என்பதும் τόπος என்பதற்கு ‘இடம்’ என்பதும் பயன்படுத்தப்பட்டுள்ளன; கிரேக்க உரையின் உடைமைத் தொடர்பு காக்கப்பட்டுள்ளது.
- source_word: λεγόμενος
  choice: பொருள்
  rationale: கிரேக்கத்தில் ‘அழைக்கப்படும்’ என்பது மீண்டும் வந்தாலும், பெயருக்கான விளக்கமாக அதன் செயல்பாட்டைத் தமிழில் ‘பொருள்’ என்று இயல்பாகத் தெரிவித்துள்ளது; சொற்படியான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
