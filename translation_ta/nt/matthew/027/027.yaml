translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வரலாற்றுத் தன்மையுள்ள ‘பிரைத்தோரியம்’ முதன்மை உரையில் வைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது; ‘cohort’ என்பதற்குத் தொழில்நுட்ப ஒலிபெயர்ப்பை விடத் தெளிவான ‘படைப்பிரிவு’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
