  text: Τότε οἱ στρατιῶται τοῦ ἡγεμόνος παραλαβόντες τὸν Ἰησοῦν εἰς τὸ πραιτώριον συνήγαγον ἐπ’ αὐτὸν ὅλην τὴν σπεῖραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/027.yaml
  text: Then the governor’s soldiers took Jesus into the praetorium and gathered the whole cohort around him[a][b].
translation:
  language: ta
  text: பின்பு ஆளுநரின் படைவீரர்கள் இயேசுவை பிரைத்தோரியத்துக்குள்[a] அழைத்துச் சென்று, படைப்பிரிவு முழுவதையும்[b] அவரைச் சுற்றிக் கூட்டினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆளுநரின் தலைமையகத்துக்குள்.” “பிரைத்தோரியம்” என்ற கிரேக்கச் சொல் ரோம ஆளுநரின் அதிகாரப்பூர்வ இருப்பிடத்தை அல்லது இராணுவத் தலைமையகத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “படைப்பிரிவு” என்பது ரோம இராணுவத்தின் ஓர் அலகைக் குறிக்கும் சொல்; முழு படைப்பிரிவைச் சேர்ந்த ஒவ்வொரு வீரரும் அங்கே இருந்தார்கள் என்று இது கட்டாயமாகக் குறிக்க வேண்டியதில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: பின்பு
  rationale: நிகழ்வுகளின் தொடர்ச்சியில் அடுத்த நிகழ்வைக் குறிக்கும் இயல்பான நவீனத் தமிழ் இணைப்புச் சொல்.
- source_word: στρατιῶται τοῦ ἡγεμόνος
  choice: ஆளுநரின் படைவீரர்கள்
  rationale: ரோம ஆளுநரோடு தொடர்புடைய வீரர்கள் என்ற உடைமை/தொடர்பு பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἡγεμόνος
  choice: ஆளுநர்
  rationale: இச்சூழலில் ரோம மாகாணத்தின் ஆட்சியாளரைக் குறிக்கிறது; மூலச்சொல்லைவிட மிகக் குறிப்பான நிர்வாகப் பதவியைத் திணிக்காமல் பொருளைத் தருகிறது.
- source_word: παραλαβόντες
  choice: அழைத்துச் சென்று
  rationale: இயேசுவைத் தங்களுடன் காவலில் உள்ளே கொண்டு சென்ற செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἰς τὸ πραιτώριον
  choice: பிரைத்தோரியத்துக்குள்
  rationale: ரோம ஆளுநரின் அதிகாரப்பூர்வ இருப்பிடம் அல்லது இராணுவத் தலைமையகம் என்பதைக் குறிக்கும் வரலாற்றுச் சிறப்புடைய சொல்லை ஒலிபெயர்த்துப் பாதுகாக்கிறது; விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: συνήγαγον
  choice: கூட்டினார்கள்
  rationale: ஒன்றாகச் சேர்த்தல் என்ற வினைப்பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐπ’ αὐτὸν
  choice: அவரைச் சுற்றி
  rationale: வீரர்கள் இயேசுவை நோக்கி வந்து அவரைச் சூழ்ந்து கூடிய காட்சியை இச்சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὅλην τὴν σπεῖραν
  choice: படைப்பிரிவு முழுவதையும்
  rationale: σπεῖρα என்ற ரோம இராணுவ அலகின் பொருளைப் பாதுகாக்கிறது; ‘முழுவதையும்’ என்பது ὅλην என்பதைக் காட்டுகிறது.
