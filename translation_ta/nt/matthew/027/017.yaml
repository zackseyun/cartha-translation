source:
  edition: SBLGNT
  text: συνηγμένων οὖν αὐτῶν εἶπεν αὐτοῖς ὁ Πιλᾶτος· Τίνα θέλετε ἀπολύσω ὑμῖν, ⸂Ἰησοῦν τὸν⸃ Βαραββᾶν ἢ Ἰησοῦν τὸν λεγόμενον χριστόν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/017.yaml
  text: 'So when they had gathered together[a], Pilate said to them, “Which one do you want me to release to you: Jesus Barabbas[b], or Jesus who is called Messiah?”'
translation:
  language: ta
  text: எனவே, அவர்கள் கூடியிருந்தபோது, பிலாத்து அவர்களிடம், “உங்களுக்காக நான் யாரை விடுதலை செய்ய வேண்டும் என்று விரும்புகிறீர்கள்—இயேசு பரபாஸையா[a], அல்லது மெசியா[b] என்று அழைக்கப்படும் இயேசுவையா?” என்று கேட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் ‘இயேசு பரபாஸ்’ என்பதற்குப் பதிலாக ‘பரபாஸ்’ என்று மட்டும் உள்ளது.
    reason: textual_variant
  - marker: b
    text: அல்லது, ‘கிறிஸ்து.’ கிரேக்கப் பட்டமான கிறிஸ்தோஸ் இங்கு பட்டமாகச் செயல்படுவதால் ‘மெசியா’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: συνηγμένων
  choice: அவர்கள் கூடிவந்திருந்தபோது
  rationale: இது காலத்தைக் குறிக்கும் genitive absolute அமைப்பு. மக்கள் ஏற்கெனவே கூடிவந்திருந்த நிலையில் பிலாத்து கேள்வி கேட்டான் என்ற தொடர்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய நிகழ்விலிருந்து தொடரும் கதைத் தொடர்பையும் விளைவையும் காக்கிறது.
- source_word: Τίνα
  choice: யாரை
  rationale: இரு நபர்களுக்கிடையிலான தேர்வைக் கேட்கும் ஒருமை வினாப்பெயரின் நேரடியான தமிழ் இணை.
- source_word: θέλετε
  choice: விரும்புகிறீர்கள்
  rationale: இங்கு θέλω மக்களின் விருப்பத்தையோ தேர்வையோ குறிக்கிறது; மரியாதைப் பன்மையுடன் இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: ἀπολύσω
  choice: நான் ... விடுதலை செய்ய
  rationale: சிறைக்கைதியை விடுவிக்கும் நீதித்துறைச் சூழலைத் தெளிவாகக் காக்கிறது; மன்னிப்பு வழங்குதல் என்ற கூடுதல் பொருளைச் சேர்க்கவில்லை.
- source_word: Ἰησοῦν τὸν Βαραββᾶν
  choice: இயேசு பரபாஸ்
  rationale: SBLGNT மூல உரையிலுள்ள Ἰησοῦν என்பதைக் காத்து, இயேசு என்ற பெயருடைய இருவருக்கிடையிலான சொல்லாட்சித் தீவிரத்தை வெளிப்படுத்துகிறது.
- source_word: Ἰησοῦν τὸν λεγόμενον χριστόν
  choice: மெசியா என்று அழைக்கப்படும் இயேசு
  rationale: λεγόμενον என்பதற்கு நடுநிலையான ‘என்று அழைக்கப்படும்’ பயன்படுத்தப்பட்டுள்ளது; χριστός இங்கு பட்டமாக இருப்பதால் ‘மெசியா’ என மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: ‘என்று அழைக்கப்படும்’ என்ற அமைப்பில் χριστός ஒரு பட்டமாகச் செயல்படுகிறது. எனவே அதன் பட்டப் பொருளை வெளிப்படுத்தும் ‘மெசியா’ முதன்மை உரையில் வைக்கப்பட்டு, பரவலான ‘கிறிஸ்து’ மாற்று வாசிப்பாக அடிக்குறிப்பில் தரப்படுகிறது.
- issue: பரபாஸுக்கு முன் ‘இயேசு’ என்பதைக் கொண்டிருத்தல்
  choice: இயேசு பரபாஸ்
  alternative: பரபாஸ்
  rationale: வழங்கப்பட்ட SBLGNT உரையில் Ἰησοῦν உள்ளது. ஆகவே அது முதன்மை உரையில் காக்கப்படுகிறது; சில கையெழுத்துப் பிரதிகளின் குறுகிய வாசகம் அடிக்குறிப்பில் பதிவு செய்யப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. நேரடிப் பேச்சின் தேர்வு அமைப்பு கோடால் தெளிவுபடுத்தப்பட்டுள்ளது; மூலத்தின் இரு ‘இயேசு’ பெயர்களுக்கிடையிலான மோதல் காக்கப்பட்டுள்ளது.
