id: MAT.27.30
reference: Matthew 27:30
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐμπτύσαντες εἰς αὐτὸν ἔλαβον τὸν κάλαμον καὶ ἔτυπτον εἰς τὴν κεφαλὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/030.yaml
  text: And after spitting on him[b][a], they took the reed and kept striking his head.
translation:
  language: ta
  text: அவர்கள் அவர்மேல் துப்பிவிட்டு, அந்த நாணலை[a] எடுத்து, அவருடைய தலையில் தொடர்ந்து அடித்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நாணற்கோல்’ என்றும் மொழிபெயர்க்கலாம். κάλαμος என்பது நாணலையோ, நாணல்போன்ற ஒரு கோலையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அவருடைய தலையில் அடித்துக்கொண்டிருந்தார்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க இறந்தகால imperfect வினை, மீண்டும் மீண்டும் அல்லது தொடர்ந்து நடந்த செயலை வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμπτύσαντες εἰς αὐτόν
  choice: அவர்மேல் துப்பிவிட்டு
  rationale: இறந்தகால வினையெச்சம் முதன்மைச் செயல்களுக்கு முந்திய செயலைக் குறிக்கிறது; ‘துப்பிவிட்டு’ என்பது அந்த வரிசையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது. ἐμπτύω உடன் εἰς என்பது ஒருவர்மேல் துப்புவதைக் குறிக்கிறது.
- source_word: ἔλαβον
  choice: எடுத்து
  rationale: λαμβάνω என்பதன் எளிய சூழல்சார் பொருளைத் தருகிறது; முந்திய வினையெச்சத்துடன் இணைந்து தமிழில் இயல்பான வாக்கிய ஓட்டத்தை உருவாக்குகிறது.
- source_word: τὸν κάλαμον
  choice: அந்த நாணலை
  rationale: κάλαμος என்பதன் அடிப்படைப் பொருள் ‘நாணல்’; முன்பு இயேசுவின் கையில் வைக்கப்பட்ட பொருளையே குறிப்பதால் சுட்டுப்பெயரடை சேர்க்கப்பட்டது. ‘கோல்’ என்று மட்டும் மொழிபெயர்த்து பொருளை மிகையாகத் தீர்மானிப்பது தவிர்க்கப்பட்டது.
- source_word: ἔτυπτον
  choice: தொடர்ந்து அடித்தார்கள்
  rationale: இறந்தகால imperfect வடிவம் நீடித்த அல்லது மீண்டும் மீண்டும் நடந்த செயலைக் குறிக்கக்கூடும்; ‘தொடர்ந்து’ என்பது அந்த அம்சத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἰς τὴν κεφαλὴν αὐτοῦ
  choice: அவருடைய தலையில்
  rationale: இங்கு εἰς என்பது அடிகளின் இலக்கைக் குறிக்கிறது; ‘தலையில்’ என்பது தமிழில் நேரடியும் இயல்புமான இணை.
theological_decisions:
- issue: இயேசுவுக்கு இழைக்கப்பட்ட அவமதிப்பும் வன்முறையும்
  choice: செயல்களை மென்மைப்படுத்தாமலும் கூடுதல் விவரங்களைச் சேர்க்காமலும் நேரடியாகக் கூறுதல்
  alternative: ‘அவர்மேல் துப்பி, நாணலை எடுத்து, அவருடைய தலையில் அடித்துக்கொண்டிருந்தார்கள்’ என்று அதிகச் சொற்படியான தொடர்நிலை வடிவில் கூறுதல்
  rationale: வசனம் கோட்பாட்டுச் சர்ச்சையை முன்வைக்காமல் நிகழ்வை விவரிக்கிறது. மூலத்தின் அவமானத்தையும் தொடர்ந்த வன்முறையையும் தெளிவாகக் காக்கும் அதேவேளையில், மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்காமல் மொழிபெயர்க்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நேரடி நடை பயன்படுத்தப்பட்டது. ‘அவர்மேல்’, ‘அவருடைய’ என்ற மரியாதை வடிவங்கள் இயேசுவைக் குறிக்கும் தமிழ் வேதாகம நடைக்கு ஏற்றவை; மூலத்தின் கடுமை மென்மைப்படுத்தப்படவில்லை.
