reference: Matthew 27:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ οὐκ ἀπεκρίθη αὐτῷ πρὸς οὐδὲ ἓν ῥῆμα, ὥστε θαυμάζειν τὸν ἡγεμόνα λίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/014.yaml
  text: And he did not answer him with even one word[b][a], so that the governor was greatly amazed.
translation:
  language: ta
  text: அவர் அவருக்கு ஒரு வார்த்தைகூடப் பதில் சொல்லவில்லை. அதனால் ஆளுநர் மிகவும் வியந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: பதில் சொல்லவில்லை
  rationale: ἀποκρίνομαι என்பதன் இறந்தகால வடிவம் இங்கு ‘பதில் சொல்’ அல்லது ‘மறுமொழி கூறு’ என்று பொருள்படும். ‘பதில் சொல்லவில்லை’ என்பது நேரடியும் இயல்பானதுமான நவீனத் தமிழ் நடை.
- source_word: αὐτῷ
  choice: அவருக்கு
  rationale: பதில் யாருக்குக் கூறப்படவில்லை என்பதைக் குறிக்கும் வேற்றுமை உருபுடைய பிரதிப்பெயர்; சூழலில் இது ஆளுநரான பிலாத்துவைக் குறிக்கிறது.
- source_word: πρὸς οὐδὲ ἓν ῥῆμα
  choice: ஒரு வார்த்தைகூட
  rationale: οὐδὲ ἓν என்பது முற்றிலுமான மறுப்பை வலியுறுத்துகிறது; ῥῆμα இங்கு ‘வார்த்தை/கூற்று’ என்ற பொதுவான பொருளில் கொள்ளப்படுகிறது. ‘ஒரு வார்த்தைகூட’ என்பது அந்த வலியுறுத்தலை இயல்பாகத் தக்கவைக்கிறது.
- source_word: ὥστε
  choice: அதனால்
  rationale: ὥστε விளைவைக் குறிக்கிறது. ‘அதனால்’ என்பது இயேசுவின் மௌனத்தின் விளைவாக ஆளுநர் வியந்தார் என்ற தொடர்பைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: θαυμάζειν
  choice: வியந்தார்
  rationale: ὥστε-க்குப் பின் வரும் இந்நிகழ்கால வினையெச்சம் விளைவாக ஏற்பட்ட ஆளுநரின் வியப்பைக் குறிக்கிறது; தமிழில் வரையறுக்கப்பட்ட வினையாக ‘வியந்தார்’ என்பது இயல்பானது.
- source_word: ἡγεμόνα
  choice: ஆளுநர்
  rationale: ரோமப் பேரரசின் மாகாண நிர்வாகச் சூழலில் ἡγεμών என்பது பிலாத்துவின் பதவியான ‘ஆளுநர்’ என்பதைக் குறிக்கிறது.
- source_word: λίαν
  choice: மிகவும்
  rationale: வியப்பின் அளவை வலுப்படுத்தும் λίαν என்பதற்கு ‘மிகவும்’ என்பது தெளிவான, பொதுவழக்கிலுள்ள இணைச்சொல்.
