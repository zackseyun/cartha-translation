translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கத்தின் தொடக்க καί தனி இணைப்புச்சொல்லாக வெளிப்படுத்தப்படாமல், முந்தைய உரையோடு இயல்பாகத் தொடரும் தமிழ் வாக்கியமாக அமைக்கப்பட்டுள்ளது; இரண்டு கூறுகளின் விளைவுத் தொடர்பு ‘அதனால்’ மூலம் தெளிவாக்கப்பட்டுள்ளது.
