source:
  edition: SBLGNT
  text: Τότε σταυροῦνται σὺν αὐτῷ δύο λῃσταί, εἷς ἐκ δεξιῶν καὶ εἷς ἐξ εὐωνύμων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/038.yaml
  text: Then two robbers are crucified with him[a], one on the right and one on the left.
translation:
  language: ta
  text: அப்போது அவரோடு இரண்டு கொள்ளையர்கள்[a] சிலுவையில் அறையப்பட்டனர்—ஒருவர் வலப்பக்கத்திலும் மற்றவர் இடப்பக்கத்திலும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கொள்ளைக் கூட்டத்தினர்.” இதற்கான கிரேக்கச் சொல் வன்முறையில் ஈடுபடும் கொள்ளையர்களைக் குறிக்கலாம்; சில சூழல்களில் கிளர்ச்சி நடவடிக்கையில் ஈடுபடுகிறவர்களையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: அப்போது
  rationale: கதை நிகழ்வுகளின் வரிசையில் அடுத்த நிகழ்வைக் குறிக்கும் இயல்பான, சுருக்கமான தமிழ்ச் சொல்.
- source_word: σταυροῦνται
  choice: சிலுவையில் அறையப்பட்டார்கள்
  rationale: கிரேக்கத்தில் இது நிகழ்காலச் செயப்பாட்டு வடிவில் வரும் வரலாற்று நிகழ்காலம். நவீன தமிழில் கடந்தகாலச் செயப்பாட்டு வடிவம் கதைநடைக்கு இயல்பாக இருந்து, செயல் அவர்கள்மீது செய்யப்பட்டதையும் தெளிவாகக் காக்கிறது.
- source_word: σὺν αὐτῷ
  choice: அவரோடு
  rationale: உடனிருப்பையும் ஒரே நிகழ்வில் பங்குபெறுவதையும் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: δύο λῃσταί
  choice: இரண்டு கொள்ளையர்கள்
  rationale: λῃστής பொதுவாக வன்முறையோடு கொள்ளையிடுபவரைக் குறிக்கலாம். ‘கொள்ளையர்கள்’ தெளிவான பொதுப் பொருளைக் காக்கிறது; அரசியல் கிளர்ச்சியாளர்கள் என்று தேவையின்றிக் குறிப்பாக்கவில்லை.
- source_word: εἷς ἐκ δεξιῶν καὶ εἷς ἐξ εὐωνύμων
  choice: ஒருவர் வலப்பக்கத்திலும் மற்றவர் இடப்பக்கத்திலும்
  rationale: கிரேக்க இடவியல் மரபுத்தொடரின் இயல்பான தமிழாக்கம். இரண்டாவது εἷς என்பதற்கு ‘மற்றவர்’ என்று மொழிபெயர்ப்பது இருவருக்கிடையேயான எதிரிணையைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
theological_decisions:
- issue: λῃσταί என்பவர்களின் அடையாளம்
  choice: கொள்ளையர்கள்
  alternative: கொள்ளைக் கூட்டத்தினர்; கிளர்ச்சியாளர்கள்
  rationale: இந்தச் சொல் வன்முறைக் கொள்ளையர்களையோ கொள்ளைக் கூட்டத்தினரையோ குறிக்கலாம்; சில சூழல்களில் கிளர்ச்சி நடவடிக்கையுடன் பொருள் ஒன்றிப்போகவும் கூடும். ஆனால் இவ்வசனம் மட்டும் அவர்களை அரசியல் கிளர்ச்சியாளர்கள் என்று குறிப்பாக அடையாளப்படுத்தவில்லை; எனவே அந்தப் பொருள் முதன்மை உரையில் திணிக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வரலாற்று நிகழ்காலம் தமிழில் இயல்பான கடந்தகாலமாக வழங்கப்பட்டுள்ளது; செயப்பாட்டு நிலை காக்கப்பட்டுள்ளது. அடிக்குறிப்புக் குறியீடு சம்பந்தப்பட்ட பெயர்ச்சொல்லுக்குப் பின் வைக்கப்பட்டுள்ளது.
