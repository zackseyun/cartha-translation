source:
  edition: SBLGNT
  text: καὶ εὐθέως δραμὼν εἷς ἐξ αὐτῶν καὶ λαβὼν σπόγγον πλήσας τε ὄξους καὶ περιθεὶς καλάμῳ ἐπότιζεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/048.yaml
  text: And immediately one of them ran[a], took a sponge, filled it with sour wine, put it on a reed[b], and gave him a drink.
translation:
  language: ta
  text: உடனே அவர்களில் ஒருவன் ஓடிப்போய், ஒரு கடற்பஞ்சை எடுத்து, புளித்த திராட்சைமதுவால்[a] அதை நிரப்பி, ஒரு நாணல் தண்டில் பொருத்தி, அவருக்குக் குடிக்கக் கொடுத்தான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “திராட்சைமதுக் காடி” என்றும் மொழிபெயர்க்கலாம். ὄξος என்ற கிரேக்கச் சொல் புளித்த திராட்சைமதுவையோ திராட்சைமதுக் காடியையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்க வினை வடிவத்தை “அவருக்குக் குடிக்கக் கொடுத்துக்கொண்டிருந்தான்” அல்லது “குடிக்கக் கொடுக்க முயன்றான்” என்றும் புரிந்துகொள்ளலாம்.
    reason: aspectual_ambiguity
lexical_decisions:
- source_word: εὐθέως
  choice: உடனே
  rationale: செயல் தாமதமின்றி நிகழ்ந்ததை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: δραμὼν
  choice: ஓடிப்போய்
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த விரைவான செயலைத் தமிழில் இயல்பான வினையெச்சமாகக் காட்டுகிறது.
- source_word: εἷς ἐξ αὐτῶν
  choice: அவர்களில் ஒருவன்
  rationale: அந்தக் குழுவைச் சேர்ந்த ஒரே நபர் செயல்பட்டார் என்ற பகுதிப்பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: σπόγγον
  choice: கடற்பஞ்சை
  rationale: பண்டைய சூழலில் திரவத்தை உறிஞ்சப் பயன்படுத்தப்பட்ட இயற்கைப் பஞ்சைத் துல்லியமாகக் குறிக்கிறது.
- source_word: ὄξους
  choice: புளித்த திராட்சைமது
  rationale: குடிக்கத்தக்க புளிப்பான மலிவான திராட்சைமதுவைக் குறிக்கிறது; சமையலில் பயன்படுத்தும் நவீன வினிகர் என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: περιθεὶς καλάμῳ
  choice: ஒரு நாணல் தண்டில் பொருத்தி
  rationale: καλάμῳ என்பதன் நாணல் அல்லது நாணல் தண்டு என்ற அடிப்படைப் பொருளையும், பஞ்சை அதில் வைத்த செயல் தொடர்பையும் இயல்பாகக் காட்டுகிறது.
- source_word: ἐπότιζεν αὐτόν
  choice: அவருக்குக் குடிக்கக் கொடுத்தான்
  rationale: ஒருவரை அருந்தச் செய்வது என்ற ποτίζω-வின் காரணவினைப் பொருளை இயல்பான தமிழில் தருகிறது; இறந்தகால நிறைவுறா வடிவத்தின் சாத்தியமான தொடர்ச்சி அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
theological_decisions:
- issue: இயேசுவுக்குக் கொடுக்கப்பட்ட பானத்தின் தன்மை
  choice: புளித்த திராட்சைமது
  alternative: காடி / திராட்சைமதுக் காடி
  rationale: ὄξος புளித்த திராட்சைமது அல்லது திராட்சைமதுக் காடியைக் குறிக்கலாம். ‘புளித்த திராட்சைமது’ என்பது குடிக்கத்தக்க பானம் என்ற சூழலைக் காக்கிறது; பாரம்பரிய மொழிபெயர்ப்பால் உருவாகக்கூடிய தேவையற்ற கோட்பாட்டுச் சார்பைச் சேர்ப்பதில்லை.
- issue: ἐπότιζεν என்ற இறந்தகால நிறைவுறா வினையின் செயற்பாங்கு
  choice: அவருக்குக் குடிக்கக் கொடுத்தான்
  alternative: அவருக்குக் குடிக்கக் கொடுத்துக்கொண்டிருந்தான் / குடிக்கக் கொடுக்க முயன்றான்
  rationale: சூழலில் இது முன்னேறும் கதைநிகழ்வாக இயல்பாகப் படிக்கிறது. கிரேக்க நிறைவுறா வடிவம் தொடரும் அல்லது முயற்சிக்கப்படும் செயலைக் குறிக்கக்கூடியதால், அந்தச் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது; ஒன்றை மட்டும் உறுதியாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க கதைநடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வினையெச்சத் தொடரைத் தமிழுக்கேற்ற வினையெச்சத் தொடராக அமைத்து, இறுதி வினையைத் தெளிவாக வைத்துள்ளது. ‘கடற்பஞ்சு’, ‘நாணல் தண்டு’, ‘புளித்த திராட்சைமது’ ஆகியவை வரலாற்றுச் சூழலைத் துல்லியமாகவும் வாசிக்க எளிதாகவும் தருகின்றன.
