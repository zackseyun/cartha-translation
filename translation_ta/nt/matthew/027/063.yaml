id: MAT.27.63
reference: Matthew 27:63
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγοντες· Κύριε, ἐμνήσθημεν ὅτι ἐκεῖνος ὁ πλάνος εἶπεν ἔτι ζῶν· Μετὰ τρεῖς ἡμέρας ἐγείρομαι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/063.yaml
  text: saying[a], “Lord, we remember that that deceiver said while he was still alive[b], ‘After three days I rise.’”
translation:
  language: ta
  text: அவர்கள், “ஐயா, அந்த ஏமாற்றுக்காரன் உயிரோடிருந்தபோது[b], ‘மூன்று நாட்களுக்குப் பிறகு நான் உயிர்த்தெழுகிறேன்’[a] என்று சொன்னது எங்களுக்கு நினைவிருக்கிறது” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மூன்று நாட்களுக்குப் பிறகு நான் உயிர்த்தெழுவேன்”; அல்லது, “மூன்று நாட்களுக்குப் பிறகு நான் எழுப்பப்படுவேன்.” கிரேக்கத்தில், “நான் எழுப்பப்படுகிறேன்” எனப் பொருள்படக்கூடிய நிகழ்கால வடிவம் உள்ளது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “உயிரோடிருந்தபோது அந்த ஏமாற்றுக்காரன் சொன்னது.”
    reason: alternative_word_order
lexical_decisions:
- source_word: λέγοντες
  choice: என்றார்கள்
  rationale: முந்தைய வசனத்தோடு இணைந்துள்ள நிகழ்காலப் பங்கேற்புச் சொல்லை, தமிழில் இயல்பாக நேரடி உரையை முடிக்கும் வினையாக வழங்குகிறது.
- source_word: Κύριε
  choice: ஐயா
  rationale: பிலாத்துவை மரியாதையுடன் அழைக்கும் விளிவேற்றுமைச் சொல். இச்சூழலில் தெய்வீகப் பட்டத்தைக் குறிப்பதாகத் தோன்றாமல், κύριος என்பதன் மரியாதை அழைப்புப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἐμνήσθημεν
  choice: எங்களுக்கு நினைவிருக்கிறது
  rationale: கிரேக்க இறந்தகால வடிவத்தின் தற்போதைய தொடர்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ‘நாங்கள் நினைவுகூர்ந்தோம்’ என்பது இச்சூழலில் செயற்கையாக ஒலிக்கும்.
- source_word: ἐκεῖνος ὁ πλάνος
  choice: அந்த ஏமாற்றுக்காரன்
  rationale: ἐκεῖνος என்பதன் விலக்கி வைக்கும் சாயலையும் πλάνος என்பதன் பழிப்பான ‘ஏமாற்றுகிறவன்’ என்ற பொருளையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἔτι ζῶν
  choice: உயிரோடிருந்தபோது
  rationale: அவன் இறப்பதற்கு முன்பு இவ்வாறு கூறிய காலத்தைக் குறிக்கும் சொற்றொடரைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: Μετὰ τρεῖς ἡμέρας
  choice: மூன்று நாட்களுக்குப் பிறகு
  rationale: μετά + குற்றுவேற்றுமையின் நேரடியான ‘பிறகு’ என்ற பொருளைப் பாதுகாக்கிறது; ‘மூன்றாம் நாளில்’ என்று வேறு இடங்களோடு ஒத்திசைக்கவில்லை.
- source_word: ἐγείρομαι
  choice: நான் உயிர்த்தெழுகிறேன்
  rationale: கிரேக்கத்தின் நிகழ்கால வடிவத்தையும் உயிர்த்தெழுதல் சார்ந்த பொருளையும் வாசிக்கத்தக்க தமிழில் பாதுகாக்கிறது. நடு/செயப்பாட்டு வடிவத்தின் நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: இயேசுவின் உயிர்த்தெழுதல் முன்னறிவிப்பில் ἐγείρομαι என்பதன் காலமும் வினைநிலையும்
  choice: மூன்று நாட்களுக்குப் பிறகு நான் உயிர்த்தெழுகிறேன்
  alternative: மூன்று நாட்களுக்குப் பிறகு நான் உயிர்த்தெழுவேன் / உயிரோடு எழுப்பப்படுவேன்
  rationale: மூலத்தில் எதிர்காலத் துணைவினை இல்லாமல் நிகழ்கால நடு/செயப்பாட்டு வடிவம் உள்ளது. முதன்மை உரை அந்த வடிவத்தை இயன்றவரை நிலைநிறுத்துகிறது; எதிர்கால மற்றும் செயப்பாட்டு புரிதல்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, மரியாதைமிக்க உரைநடை பயன்படுத்தப்பட்டுள்ளது. பிலாத்துவை நோக்கிய κύριε என்பதற்கு சூழலுக்கேற்ற ‘ஐயா’ தேர்ந்தெடுக்கப்பட்டுள்ளது. ‘உயிர்த்தெழுகிறேன்’ என்ற நிகழ்கால வடிவம் சற்று குறிப்பிடத்தக்கதாக இருந்தாலும், மூலத்தின் காலவடிவத் திணறலை அழிக்காமல் தமிழில் புரியத்தக்கதாக வைத்திருக்கிறது.
