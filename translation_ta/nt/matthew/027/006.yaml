source:
  edition: SBLGNT
  text: οἱ δὲ ἀρχιερεῖς λαβόντες τὰ ἀργύρια εἶπαν· Οὐκ ἔξεστιν βαλεῖν αὐτὰ εἰς τὸν κορβανᾶν, ἐπεὶ τιμὴ αἵματός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/006.yaml
  text: But the chief priests[a], taking the silver pieces, said, “It is not lawful to put them into the temple treasury[b], since they are the price of blood.”
translation:
  language: ta
  text: ஆனால் தலைமைக் குருக்கள் அந்த வெள்ளிக்காசுகளை எடுத்துக்கொண்டு, “இவை இரத்தத்தின் விலை[b] என்பதால், இவற்றை ஆலயக் கருவூலத்தில்[a] போடுவது சட்டப்படி அனுமதிக்கப்பட்டதல்ல” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கச் சொல் κορβανᾶν (கொர்பான்); ஆலயக் கருவூலத்தை அல்லது கடவுளுக்கென அர்ப்பணிக்கப்பட்ட புனித நிதியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இரத்தப்பணம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερεῖς
  choice: தலைமைக் குருக்கள்
  rationale: பன்மையில் வரும் இச்சொல் மூத்த யூத குருத்துவத் தலைவர்களைக் குறிக்கிறது; நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: λαβόντες
  choice: எடுத்துக்கொண்டு
  rationale: முதன்மை வினையுடன் இணைந்த உடனிகழ்வையும் இயல்பான தமிழ் வாக்கிய ஓட்டத்தையும் காக்கிறது.
- source_word: τὰ ἀργύρια
  choice: அந்த வெள்ளிக்காசுகள்
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட வெள்ளிப் பணத்தைக் குறிக்கிறது; குறிப்பிட்ட நாணய வகையை ஊகிக்காமல் அதன் பணப் பொருளைத் தெளிவாக்குகிறது.
- source_word: Οὐκ ἔξεστιν
  choice: சட்டப்படி அனுமதிக்கப்பட்டதல்ல
  rationale: குருக்கள் கூறும் சமயச் சட்டம் சார்ந்த அனுமதியின்மையை நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: βαλεῖν
  choice: போடுவது
  rationale: கருவூலத்தில் பணத்தைச் சேர்ப்பது என்ற சூழலில் இயல்பான பொருள்; ‘எறிவது’ என்ற தேவையற்ற வலிமையைத் தவிர்க்கிறது.
- source_word: κορβανᾶν
  choice: திருக்கோவில் கருவூலம்
  rationale: எருசலேம் திருக்கோவிலுக்குரிய புனித நிதிக் கருவூலத்தை வாசகருக்குத் தெளிவாகக் காட்டுகிறது; மூலச் சொல்லின் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐπεὶ
  choice: என்பதால்
  rationale: தடை கூறப்பட்டதற்கான காரணத்தை இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: τιμὴ αἵματός
  choice: இரத்தத்தின் விலை
  rationale: கிரேக்கச் சொற்றொடரின் உருவகத்தையும் அதன் கூர்மையான நெறிசார் பதற்றத்தையும் விளக்கிச் சீராக்காமல் காக்கிறது.
theological_decisions:
- issue: κορβανᾶν என்பதைக் ஒலிபெயர்ப்பதா அல்லது பொருள்பெயர்ப்பதா
  choice: திருக்கோவில் கருவூலம்
  alternative: கொர்பான்
  rationale: இங்கு கோட்பாட்டுச் சிறப்புச்சொல்லைவிட திருக்கோவிலின் புனித நிதியே குறிக்கப்படுகிறது. ஆகவே பொருள்பெயர்ப்பு பொதுவாசகருக்குத் தெளிவாக உள்ளது; ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: τιμὴ αἵματός என்பதன் உருவகத்தை எவ்வாறு காப்பது
  choice: இரத்தத்தின் விலை
  alternative: கொலைக்கான கூலி
  rationale: மூலத்தின் சுருக்கமான, திட்டமிட்ட சொற்றொடரை அப்படியே நெருக்கமாகக் காக்கிறது; மாற்று வாசிப்பு அதன் சூழல்சார் பொருளை விளக்கினாலும் ‘கொலை’ என்பதை வெளிப்படையாகச் சேர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. யூத சமயச் சூழலைத் தெளிவாக்க ‘திருக்கோவில்’ என்றும், மூலத்தின் ‘இரத்தத்தின் விலை’ என்ற உருவகத்தைத் தீர்த்துவிடாமல் அப்படியே காக்கவும் தேர்ந்தெடுக்கப்பட்டது.
