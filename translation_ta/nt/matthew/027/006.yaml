- from: ஆனால் தலைமைக் குருக்கள் அந்த வெள்ளிக்காசுகளை எடுத்துக்கொண்டு, “இவை இரத்தத்தின் விலை[b] என்பதால், இவற்றைத் திருக்கோவில் கருவூலத்தில்[a] போடுவது சட்டப்படி அனுமதிக்கப்பட்டதல்ல” என்றார்கள்.
