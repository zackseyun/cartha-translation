    issue: Redundant time expression
    rationale: ‘ஒன்பதாம் மணி நேரத்தளவில்’ combines overlapping expressions. ‘ஒன்பதாம் மணியளவில்’ naturally expresses περὶ τὴν ἐνάτην ὥραν.
  - severity: medium
    issue: Psalm-echo footnote anchor is attached to ‘உரத்த குரலில்’
    rationale: The note concerns the words of the cry, not the loudness of Jesus’ voice. Moving marker a to the Semitic cry supplies an accurate anchor.
  - severity: low
    issue: Sentence division weakens the syntactic connection of the cry and its explanation
    rationale: Greek presents the cry and its explanatory ‘that is’ as one continuous construction. A semicolon in Tamil more clearly preserves that relationship.
