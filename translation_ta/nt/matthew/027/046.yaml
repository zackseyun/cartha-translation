source:
  edition: SBLGNT
  text: περὶ δὲ τὴν ἐνάτην ὥραν ⸀ἀνεβόησεν ὁ Ἰησοῦς φωνῇ μεγάλῃ λέγων· ⸂Ἠλὶ ἠλὶ⸃ λεμὰ σαβαχθάνι; τοῦτ’ ἔστιν· Θεέ μου θεέ μου, ἱνατί με ἐγκατέλιπες;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/046.yaml
  text: About the ninth hour Jesus cried out with a loud voice[a], saying, “Eli, Eli, lema sabachthani?” that is, “My God, my God[b], why have you forsaken me?”
translation:
  language: ta
  text: ஒன்பதாம் மணியளவில் இயேசு, “ஏலி, ஏலி, லெமா சபக்தானி?”[a] என்று உரத்த குரலில் கூக்குரலிட்டார்; அதாவது, “என் தேவனே, என் தேவனே, ஏன் என்னைக் கைவிட்டீர்?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்தக் கூக்குரலின் சொற்கள் சங்கீதம் 22:1-ஐ எதிரொலிக்கின்றன.
    reason: cross_reference
  - marker: b
    text: ‘ஏன் என்னைக் கைவிட்டீர்?’ என்பதற்கு ‘எதற்காக என்னைக் கைவிட்டீர்?’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் இறந்தகால வடிவில் உள்ளது; தமிழ் இறந்தகாலம் இங்கு கூக்குரலின் இயல்பான வலிமையையும் சங்கீத எதிரொலியையும் தக்கவைக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τὴν ἐνάτην ὥραν
  choice: ஒன்பதாம் மணி நேரத்தளவில்
  rationale: περί + வேற்றுமை உருபு ஒரு நேரப் புள்ளியைச் சுமார் எனக் குறிக்கிறது. δέ இங்கு மென்மையான இணைப்புச் சொல்; தமிழில் தனியாக மொழிபெயர்க்காமல் இயல்பான உரையோட்டத்தில் கொண்டுவரப்பட்டுள்ளது. அக்காலக் கணக்குப்படி ஒன்பதாம் மணி சுமார் பிற்பகல் மூன்று மணி.
- source_word: ἀνεβόησεν
  choice: கூக்குரலிட்டார்
  rationale: இவ்வினைச்சொல் வலிமையான, உரத்த அழைப்பைக் குறிக்கிறது; ‘கூக்குரலிட்டார்’ என்பது சூழலின் தீவிரத்தையும் மரியாதையான நடையையும் தக்கவைக்கிறது.
- source_word: φωνῇ μεγάλῃ
  choice: உரத்த குரலில்
  rationale: முறை/விதத்தைக் குறிக்கும் இத்தொடரை இயல்பான தமிழில் கூறி, குரலின் வலிமையைப் பாதுகாக்கிறது.
- source_word: λέγων
  choice: என்று
  rationale: கூக்குரலின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் பங்கேற்பு வினையைத் தமிழின் இயல்பான மேற்கோள் அமைப்பில் ‘என்று’ என வழங்குகிறது.
- source_word: Ἠλὶ ἠλὶ λεμὰ σαβαχθάνι
  choice: ஏலி, ஏலி, லெமா சபக்தானி?
  rationale: மத்தேயு செமித்திய மொழியிலான கூக்குரலை முதலில் அப்படியே பதிவு செய்து, பின்னர் அதன் பொருளைத் தருகிறார். அதே கதையமைப்பைத் தமிழிலும் ஒலிபெயர்ப்பால் பாதுகாக்கிறது.
- source_word: τοῦτ’ ἔστιν
  choice: அதாவது
  rationale: முன்னுள்ள செமித்திய சொற்களின் மொழிபெயர்ப்பு/விளக்கத்தைச் சுருக்கமாகவும் இயல்பாகவும் அறிமுகப்படுத்துகிறது.
- source_word: Θεέ μου θεέ μου
  choice: என் தேவனே, என் தேவனே
  rationale: நேரடி விளிப்பும் அதன் இருமுறை கூறுதலும் பாதுகாக்கப்படுகின்றன; இது சங்கீதம் 22:1-ன் எதிரொலியையும் தக்கவைக்கிறது.
- source_word: ἱνατί
  choice: ஏன்
  rationale: காரணத்தைக் கேட்கும் வினாவை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: ἐγκατέλιπες
  choice: கைவிட்டீர்
  rationale: கிரேக்க இறந்தகால வடிவின் நிறைவேறிய செயலுணர்வைத் தமிழ் இறந்தகாலம் இயல்பாக வெளிப்படுத்துகிறது. ‘கைவிட்டீர்’ என்பது மூலத்தின் தீவிரத்தையும் சங்கீத எதிரொலியையும் காக்கிறது; மரியாதைப் பன்மை தமிழில் தேவனை நேரடியாக அழைக்கும் கண்ணியமான நடை.
theological_decisions:
- issue: இயேசுவின் கூக்குரலுக்கும் சங்கீதம் 22:1-க்கும் உள்ள தொடர்பு
  choice: கைவிடப்பட்டதைக் குறித்த உண்மையான கூக்குரலாக வார்த்தைகளை நேரடியாக மொழிபெயர்த்து, சங்கீத எதிரொலியைப் பாதுகாத்து, அதன் இறையியல் ஆழத்தை மொழிபெயர்ப்பில் தீர்மானிக்காமல் விடுதல்
  alternative: இதை முதன்மையாக சங்கீத மேற்கோளுக்கான சுட்டியாக மட்டும் காட்டுதல் அல்லது கைவிடப்பட்ட உணர்வை மென்மைப்படுத்திப் பொழிப்புரை செய்தல்
  rationale: கிரேக்க உரை விளக்கத் தணிக்கை எதுவும் சேர்க்காமல் கூக்குரலையும் அதன் மொழிபெயர்ப்பையும் தருகிறது. ஆகவே மொழிபெயர்ப்பு அதன் அனுபவத் தீவிரத்தை மறுக்காமலும், குமாரன் பிதாவை இவ்வாறு அழைப்பதற்கான ஓர் குறிப்பிட்ட கோட்பாட்டு விளக்கத்தைத் திணிக்காமலும் இருக்கிறது.
- issue: செமித்திய மொழிக் கூக்குரலை முதன்மை உரையில் வைத்திருத்தல்
  choice: ஒலிபெயர்க்கப்பட்ட செமித்திய சொற்களை முதன்மை உரையில் வைத்து, அதன்பின் அவற்றின் பொருளை வழங்குதல்
  alternative: செமித்திய சொற்களை விடுத்து அவற்றின் தமிழ் பொருளை மட்டும் தருதல்
  rationale: மத்தேயுவே மூலக் கூக்குரலைப் பாதுகாத்து பின்னர் விளக்குகிறார். இரண்டையும் வைத்திருப்பது மூல உரையின் வடிவத்தையும், அடுத்தடுத்த வசனங்களில் ‘ஏலி’ என்பதை எலியாவுக்கான அழைப்பாகக் கேட்போர் தவறாகப் புரிந்துகொள்ளும் கதைக் கூறையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தேவன்’, ‘கூக்குரலிட்டார்’, ‘கைவிட்டீர்’ ஆகியவை வசனத்தின் பெருமிதமிக்க மற்றும் வேதனை நிறைந்த தொனியைத் தக்கவைக்கின்றன. செமித்திய சொற்கள் தமிழ் எழுத்தில் ஒலிபெயர்க்கப்பட்டுள்ளன.
