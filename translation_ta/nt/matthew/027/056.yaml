source:
  edition: SBLGNT
  text: ἐν αἷς ἦν Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ἡ τοῦ Ἰακώβου καὶ ⸀Ἰωσὴφ μήτηρ καὶ ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/056.yaml
  text: among whom were Mary Magdalene[a], and Mary the mother of James and Joseph, and the mother of the sons of Zebedee.
translation:
  language: ta
  text: அவர்களில் மகதலேனா மரியாளும், யாக்கோபுக்கும் யோசேப்புக்கும்[a] தாயான மரியாளும், செபெதேயுவின் மகன்களின் தாயும் இருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் ‘யோசேப்பு’ என்பதற்குப் பதிலாக ‘யோசே’ என்று வாசிக்கப்படுகிறது.
    reason: textual_variant
lexical_decisions:
- source_word: ἐν αἷς
  choice: அவர்களில்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட பெண்களின் குழுவைச் சார்ந்தவர்கள் இவர்கள் என்பதைத் தமிழில் இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: ἦν
  choice: இருந்தார்கள்
  rationale: கிரேக்கத்தில் வினை ஒருமையாக இருந்தாலும், தொடர்ந்து பல பெண்கள் பட்டியலிடப்படுவதால் தமிழில் மனிதர்களைக் குறிக்கும் மரியாதைப் பன்மை இயல்பானது.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: மகதலேனா மரியாள்
  rationale: Μαγδαληνή என்பது மரியாளை அடையாளப்படுத்தும் இடப்பெயர் சார்ந்த பட்டம்; தமிழ் வேதாகமப் பயன்பாட்டில் அறிமுகமான வடிவம் காக்கப்படுகிறது.
- source_word: Μαρία ἡ τοῦ Ἰακώβου καὶ Ἰωσὴφ μήτηρ
  choice: யாக்கோபுக்கும் யோசேப்புக்கும் தாயான மரியாள்
  rationale: இருவருக்கும் இந்த மரியாள் தாய் என்பதைத் தெளிவாகவும் இயல்பான தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: Ἰάκωβος
  choice: யாக்கோபு
  rationale: கிரேக்கப் பெயரின் மூலவடிவத்தையும் தமிழ் புதிய ஏற்பாட்டுப் பெயர்ப் பயன்பாட்டையும் பிரதிபலிக்கிறது.
- source_word: Ἰωσὴφ
  choice: யோசேப்பு
  rationale: SBLGNT முதன்மை உரையிலுள்ள Ἰωσήφ என்பதற்கான வழக்கமான தமிழ் ஒலிபெயர்ப்பு; மாற்று வாசகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου
  choice: செபெதேயுவின் மகன்களுடைய தாய்
  rationale: செபெதேயுவுக்கும் அவரது மகன்களுக்கும் உள்ள உறவையும், அந்தப் பெண் அவர்களின் தாய் என்பதையும் தெளிவாகக் காட்டும் இயல்பான தமிழ் அமைப்பு.
- source_word: Ζεβεδαίου
  choice: செபெதேயு
  rationale: Ζεβεδαῖος என்ற பெயரின் தமிழ் வேதாகம மரபில் அறிமுகமான ஒலிபெயர்ப்பு.
