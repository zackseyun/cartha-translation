translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட வடிவங்களில் தரப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையில் [a] குறி ‘மகதலேனா’ என்பதற்குப் பின் இருந்தாலும், அடிக்குறிப்பு யோசேப்பின் பெயருக்கான உரைவேறுபாட்டைக் குறிப்பதால், மூல உரைச் சான்றின் அடிப்படையில் குறி ‘யோசேப்புக்கும்’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
