revisions:
- from: அங்கே பெண்கள் பலர் தூரத்திலிருந்து பார்த்துக்கொண்டிருந்தார்கள்.[a] அவர்கள் கலிலேயாவிலிருந்து இயேசுவைப் பின்தொடர்ந்து வந்து, அவருக்குப் பணிவிடை செய்தவர்கள்.[b]
  to: அங்கே, தூரத்திலிருந்து பார்த்துக்கொண்டிருந்த[a] பெண்கள் பலர் இருந்தார்கள்; அவர்கள் கலிலேயாவிலிருந்து இயேசுவைப் பின்தொடர்ந்து, அவருக்குச் சேவை செய்துவந்தவர்கள்.[b]
