  text: Ἦσαν δὲ ἐκεῖ γυναῖκες πολλαὶ ἀπὸ μακρόθεν θεωροῦσαι, αἵτινες ἠκολούθησαν τῷ Ἰησοῦ ἀπὸ τῆς Γαλιλαίας διακονοῦσαι αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/055.yaml
  text: There were many women there[a], watching from a distance, who had followed Jesus from Galilee[b], serving him.
translation:
  language: ta
  text: அங்கே, தூரத்திலிருந்து பார்த்துக்கொண்டிருந்த[a] பெண்கள் பலர் இருந்தார்கள்; அவர்கள் கலிலேயாவிலிருந்து இயேசுவைப் பின்தொடர்ந்து, அவருக்குச் சேவை செய்துவந்தவர்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தொலைவிலிருந்து கவனித்துக்கொண்டிருந்தார்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அவருக்குப் பணிவிடை செய்தவர்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் நடைமுறை உதவி அல்லது ஆதரவைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ ἐκεῖ
  choice: அங்கே … இருந்தார்கள்
  rationale: Ἦσαν என்பது கடந்தகாலத்தில் இருந்ததைக் குறிக்கிறது; ἐκεῖ இடத்தைக் குறிக்கிறது. δέ இங்கு மென்மையான தொடரிணைப்பாக இருப்பதால், தமிழில் தனிச் சொல்லால் வெளிப்படுத்தாமல் இயல்பான வாக்கியத் தொடரால் உணர்த்தப்பட்டுள்ளது.
- source_word: γυναῖκες πολλαὶ
  choice: பெண்கள் பலர்
  rationale: எண்ணிக்கையையும் பாலினத்தையும் இயல்பான நவீனத் தமிழில் நேரடியாகக் காக்கிறது.
- source_word: ἀπὸ μακρόθεν θεωροῦσαι
  choice: தூரத்திலிருந்து பார்த்துக்கொண்டிருந்தார்கள்
  rationale: ἀπὸ μακρόθεν இடைவெளியையும், θεωροῦσαι தொடர்ந்து கவனித்துப் பார்த்துக்கொண்டிருந்த செயலையும் குறிக்கின்றன.
- source_word: ἠκολούθησαν τῷ Ἰησοῦ ἀπὸ τῆς Γαλιλαίας
  choice: கலிலேயாவிலிருந்து இயேசுவைப் பின்தொடர்ந்து வந்து
  rationale: அவர்கள் கலிலேயாவிலிருந்து இயேசுவுடன் பயணித்து அவரைப் பின்தொடர்ந்ததை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘வந்து’ என்பது சிலுவைச் சம்பவத்திற்கு முன்பே தொடங்கிய செயலைத் தெளிவாக்குகிறது.
- source_word: διακονοῦσαι αὐτῷ
  choice: அவருக்குப் பணிவிடை செய்தவர்கள்
  rationale: διακονέω குறிக்கும் நடைமுறைச் சேவை அல்லது ஆதரவு என்ற பரந்த பொருளைக் காக்கிறது; பிற்காலத் திருச்சபைப் பதவியைக் குறிக்கும் வகையில் இதைச் சுருக்கவில்லை.
theological_decisions:
- issue: பெண்களின் பங்கை விவரிக்கும் διακονοῦσαι என்பதன் பொருள்
  choice: அவருக்குப் பணிவிடை செய்தவர்கள்
  alternative: அவருக்குச் சேவை செய்தவர்கள்
  rationale: இச்சொல் நடைமுறை உதவி, பராமரிப்பு, ஆதரவு ஆகியவற்றை உள்ளடக்கலாம். ‘பணிவிடை’ அந்தப் பரப்பைத் தக்கவைத்துக் கொண்டு, அதை வீட்டு வேலை என்றோ அதிகாரப்பூர்வ ஊழியப் பதவி என்றோ குறுக்கவில்லை.
- issue: பெண்கள் இயேசுவைப் பின்தொடர்ந்த செயலுக்கும் இக்காட்சிக்கும் உள்ள காலத் தொடர்பு
  choice: பின்தொடர்ந்து வந்து
  alternative: பின்தொடர்ந்தவர்கள்
  rationale: கலிலேயாவில் தொடங்கிய பின்தொடர்தல் இக்காட்சிக்கு முந்தியது என்பதைக் காட்டுகிறது; அதேவேளை அவர்கள் முழுப் பயணத்தின் ஒவ்வொரு கட்டத்திலும் இருந்ததாக மூலத்தைவிட அதிகமாகக் கூறவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியம் தமிழின் இயல்புக்கேற்ப இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; தொடர்பு ‘அவர்கள்’ மற்றும் ‘செய்தவர்கள்’ என்பவற்றால் காக்கப்பட்டுள்ளது.
