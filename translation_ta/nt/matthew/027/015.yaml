  text: Κατὰ δὲ ἑορτὴν εἰώθει ὁ ἡγεμὼν ἀπολύειν ἕνα τῷ ὄχλῳ δέσμιον ὃν ἤθελον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/015.yaml
  text: At the feast the governor was accustomed to release to the crowd one prisoner[a], whom they wanted.
translation:
  language: ta
  text: பண்டிகையின்போது[a], மக்கள் கூட்டம் விரும்பிய ஒரு கைதியை விடுதலை செய்வது ஆளுநரின் வழக்கமாக இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘திருவிழா.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ δὲ ἑορτὴν
  choice: பண்டிகையின்போது
  rationale: κατά + accusative இங்கு காலத்தைக் குறிக்கும் மரபுத்தொடர்; δέ மென்மையான கதைத் தொடர்பைக் காட்டுவதால் தமிழில் தனியாக மிகைப்படுத்தப்படவில்லை.
- source_word: ἑορτὴν
  choice: பண்டிகை
  rationale: ἑορτή என்பது சமயப் பண்டிகை அல்லது திருவிழாவைக் குறிக்கிறது; பஸ்கா சூழலில் ‘பண்டிகை’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: εἰώθει
  choice: வழக்கமாக இருந்தது
  rationale: இறந்தகாலத்தில் தொடர்ந்து கடைப்பிடிக்கப்பட்ட பழக்கத்தை imperfect வடிவம் குறிக்கிறது.
- source_word: ὁ ἡγεμὼν
  choice: ஆளுநர்
  rationale: இச்சூழலில் ரோம மாகாண ஆட்சியாளரைக் குறிக்கும் தெளிவான நவீனத் தமிழ் சொல்.
- source_word: ἀπολύειν
  choice: விடுதலை செய்வது
  rationale: காவலிலிருந்த ஒருவரை விடுவிப்பதைக் குறிக்கும் நீதித்துறைச் சூழலுக்கு ஏற்ற சொற்றொடர்.
- source_word: ἕνα
  choice: ஒரு
  rationale: விடுதலை செய்யப்பட்ட கைதிகளின் எண்ணிக்கை ஒன்றென்பதை நேரடியாகக் காட்டுகிறது.
- source_word: τῷ ὄχλῳ
  choice: மக்கள் கூட்டத்திற்காக / அவர்களுக்காக
  rationale: இந்த dative மக்கள் கூட்டத்தின் வேண்டுகோளுக்காக அல்லது அவர்களிடம் கைதி விடுவிக்கப்படுவதைச் சுட்டுகிறது; தமிழில் இயல்புக்காக ‘அவர்களுக்காக’ என அமைக்கப்பட்டது.
- source_word: δέσμιον
  choice: கைதி
  rationale: கட்டுண்ட அல்லது காவலில் வைக்கப்பட்ட நபரை இச்சூழலில் தெளிவாகக் குறிக்கிறது.
- source_word: ὃν ἤθελον
  choice: மக்கள் கூட்டம் விரும்பிய
  rationale: ஒரே கைதியை மக்கள் கூட்டமே தேர்ந்தெடுத்ததை உறவுத்தொடரின் பொருளுடன் இயல்பான தமிழில் தெரிவிக்கிறது.
