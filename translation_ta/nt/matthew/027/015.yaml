  register: நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தில் தனியான ‘இப்போது’ என்ற சொல் இல்லாததால் தொடக்கத்தில் ‘இப்போது’ சேர்க்கப்படவில்லை; δέ-யின் மென்மையான தொடர்பு தமிழ் வாக்கிய ஓட்டத்தில் இயல்பாக விடப்பட்டுள்ளது.
