id: MAT.27.29
reference: Matthew 27:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ πλέξαντες στέφανον ἐξ ἀκανθῶν ἐπέθηκαν ἐπὶ ⸂τῆς κεφαλῆς⸃ αὐτοῦ καὶ κάλαμον ⸂ἐν τῇ δεξιᾷ⸃ αὐτοῦ, καὶ γονυπετήσαντες ἔμπροσθεν αὐτοῦ ⸀ἐνέπαιξαν αὐτῷ λέγοντες· Χαῖρε, ⸀βασιλεῦ τῶν Ἰουδαίων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/029.yaml
  text: And after weaving a crown of thorns[a], they put it on his head, and a reed in his right hand; and kneeling before him, they mocked him, saying, “Hail, King of the Jews!”
translation:
  language: ta
  text: அவர்கள் முட்களால் ஒரு கிரீடத்தைப் பின்னி, அதை அவருடைய தலையில் வைத்தார்கள்; அவருடைய வலக்கையில் ஒரு நாணலையும் வைத்தார்கள். பிறகு அவர்முன் மண்டியிட்டு, “யூதர்களின் அரசரே, வாழ்க!” என்று சொல்லி அவரை ஏளனம் செய்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλέξαντες
  choice: பின்னி
  rationale: முட்களை ஒன்றோடொன்று பின்னிக் கிரீடமாக்கிய செயலை இயல்பான தமிழில் தெரிவிக்கிறது; இறந்தகாலப் பெயரெச்சத்தின் முன்னிகழ்வையும் தொடர்ச்சியான வாக்கிய அமைப்பில் காக்கிறது.
- source_word: στέφανον ἐξ ἀκανθῶν
  choice: முட்களால் ஒரு கிரீடம்
  rationale: στέφανος என்பதன் மாலை அல்லது வளையம் என்ற அடிப்படைப் பொருளையும், இங்குள்ள கேலியான அரசச் சூழலில் அதன் ‘கிரீடம்’ என்ற செயலையும் பொருத்தமாக வெளிப்படுத்துகிறது.
- source_word: ἐπέθηκαν ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: அதை அவருடைய தலையில் வைத்து
  rationale: வைத்தல் என்ற நேரடியான வினை, பொருளைத் தலையின் மேல் அணிவித்த செயலைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது.
- source_word: κάλαμον
  choice: ஒரு நாணல்
  rationale: அரச செங்கோலைப் போலக் கேலியாகப் பயன்படுத்தப்பட்டிருக்கலாம் என்ற உட்குறிப்பை விளக்கமாகச் சேர்க்காமல், மூலத்தின் குறிப்பிட்ட பொருளை காக்கிறது.
- source_word: ἐν τῇ δεξιᾷ αὐτοῦ
  choice: அவருடைய வலக்கையில்
  rationale: நாணல் வைக்கப்பட்ட இடத்தை இயல்பான நவீனத் தமிழில் துல்லியமாகக் குறிக்கிறது.
- source_word: γονυπετήσαντες ἔμπροσθεν αὐτοῦ
  choice: அவர்முன் முழங்கால்படியிட்டு
  rationale: கேலியான பணிவணக்கத்தின் உடல் நிலையையும் அவருக்கு முன்னால் செய்யப்பட்டதையும் சுருக்கமாகக் காக்கிறது.
- source_word: ἐνέπαιξαν αὐτῷ
  choice: அவரை ஏளனம் செய்தார்கள்
  rationale: ἐμπαίζω குறிக்கும் இகழ்ச்சியுடனான கேலியை கண்ணியமான கதைநடைத் தமிழில் தெரிவிக்கிறது.
- source_word: Χαῖρε
  choice: வாழ்க!
  rationale: இங்கு இது சாதாரண வாழ்த்து அல்ல, அரசருக்குச் செலுத்தப்படும் கேலியான வாழ்த்தொலி. ‘வாழ்க!’ அந்த அரசவைக் குரலையும் நையாண்டியையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: βασιλεῦ τῶν Ἰουδαίων
  choice: யூதர்களின் அரசரே
  rationale: விளிவேற்றுமையை ‘அரசரே’ எனக் காத்து, இந்தப் பாடுபகுதியில் வழக்கிலுள்ள பரந்த இன-மத அடையாளத்தை ‘யூதர்கள்’ என வழங்குகிறது; ‘யூதேயர்கள்’ என்ற புவியியல் சார்ந்த சாத்தியத்தை அடிக்குறிப்பில் வைத்துள்ளது.
theological_decisions:
- issue: கேலியான அரச வாழ்த்தின் நையாண்டியையும் அரசப் பட்டத்தின் வலிமையையும் காப்பது
  choice: “யூதர்களின் அரசரே, வாழ்க!”
  alternative: “யூதர்களின் அரசரே, வணக்கம்!”
  rationale: படைவீரர்கள் அரச மரியாதையைப் போல நடித்துக் கேலி செய்கிறார்கள். ‘வாழ்க!’ என்பது அரசரை வாழ்த்தும் முழக்கமாக ஒலிப்பதால் நையாண்டியைத் தெளிவாக்குகிறது; அதேவேளை இயேசுவுக்குக் கூறப்பட்ட அரசப் பட்டத்தை மங்கச் செய்யாது.
- issue: Ἰουδαίων என்பதன் அடையாள வரம்பு
  choice: யூதர்களின்
  alternative: யூதேயர்களின்
  rationale: சொல் யூதேயப் பகுதியைச் சேர்ந்தவர்களையோ யூத மக்களையோ குறிக்க முடியும். இங்குள்ள விசாரணை மற்றும் கேலிப் பட்டச் சூழலில் பரந்த மக்கள் அடையாளமான ‘யூதர்கள்’ முதன்மை உரையில் இயல்பாக உள்ளது; புவியியல் சார்ந்த மாற்று உண்மையான சொற்பொருள் சாத்தியமாக அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, தெளிவான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அவருடைய’ என்ற மரியாதைச் சுட்டு இயேசுவைக் குறிக்கிறது. கேலியை விளக்கச் சொற்களால் அதிகப்படுத்தாமல், செயல்களும் நேரடி உரையும் அதை வெளிப்படுத்தும்படி விடப்பட்டுள்ளது.
