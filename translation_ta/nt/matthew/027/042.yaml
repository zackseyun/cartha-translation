source:
  edition: SBLGNT
  text: Ἄλλους ἔσωσεν, ἑαυτὸν οὐ δύναται σῶσαι· ⸀βασιλεὺς Ἰσραήλ ἐστιν, καταβάτω νῦν ἀπὸ τοῦ σταυροῦ καὶ πιστεύσομεν ἐπ’ ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/042.yaml
  text: He saved others; he cannot save himself. He is the King of Israel; let him come down now from the cross[a], and we will believe in him.
translation:
  language: ta
  text: “மற்றவர்களை மீட்டான்; தன்னையே மீட்க அவனால் முடியவில்லை. அவன் இஸ்ரவேலின் அரசன்; இப்போது சிலுவையிலிருந்து இறங்கி வரட்டும்[a]; நாங்கள் அவனை நம்புவோம்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் இஸ்ரவேலின் அரசனானால், இப்போது சிலுவையிலிருந்து இறங்கி வரட்டும்; நாங்கள் அவனை நம்புவோம்.” சில மொழிபெயர்ப்புகள் கேலியை வெளிப்படையாக்க நிபந்தனைப் பொருளைச் சேர்க்கின்றன; ஆனால் கிரேக்க வாசகம் இந்தப் பட்டத்தை நேரடியாகக் கூறுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄλλους
  choice: மற்றவர்களை
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட பன்மை வடிவம். ‘தன்னையே’ என்பதுடன் உள்ள கேலியான முரண்பாட்டை இயல்பாகப் பேணுகிறது.
- source_word: ἔσωσεν
  choice: மீட்டான்
  rationale: σῴζω என்பதன் இறந்தகாலச் செயலைக் குறிக்கிறது. விடுவித்தல், குணமாக்குதல் ஆகிய உடனடிப் பொருள்களையும் பரந்த இரட்சிப்பு சார்ந்த பொருள் நிழலையும் தேவையின்றிக் குறுக்காமல் தாங்குகிறது.
- source_word: ἑαυτὸν
  choice: தன்னையே
  rationale: மற்றவர்களுக்கும் அவனுக்குமிடையிலான கேலியான முரண்பாட்டை வலியுறுத்தும் தன்மைச் சுட்டுப்பெயர்.
- source_word: οὐ δύναται σῶσαι
  choice: மீட்டுக்கொள்ள அவனால் முடியவில்லை
  rationale: δύναμαι + வினையெச்சத்தின் இயலாமைப் பொருளைப் பேச்சின் கேலி வலிமையுடன் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: βασιλεὺς Ἰσραήλ
  choice: இஸ்ரவேலின் அரசன்
  rationale: இது கேலியாகச் சொல்லப்பட்டாலும் அடையாளம் காணத்தக்க அரச பட்டமாகவே உள்ளது.
- source_word: καταβάτω
  choice: இறங்கி வரட்டும்
  rationale: மூன்றாம் நபர் கட்டளை வடிவத்தின் சவால் மற்றும் கேலி தொனியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: νῦν
  choice: இப்போது
  rationale: கோரிக்கையின் உடனடித் தன்மையைப் பேணுகிறது.
- source_word: ἀπὸ τοῦ σταυροῦ
  choice: சிலுவையிலிருந்து
  rationale: மூலத்தின் முன்னிடைச் சொற்றொடரைத் துல்லியமாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: πιστεύσομεν ἐπ’ αὐτόν
  choice: நாங்கள் அவனை நம்புவோம்
  rationale: ஒரு நபரை நோக்கிய நம்பிக்கையை நவீன தமிழில் இயல்பாகக் குறிக்கிறது; வெறும் அவரது கூற்றை நம்புவது என்ற குறுகிய பொருளைத் தவிர்க்கிறது.
theological_decisions:
- issue: இயேசுவைப் பற்றிய கேலியான அரச உரிமைக்கூற்றை மொழிபெயர்த்தல்
  choice: இஸ்ரவேலின் அரசன் அல்லவா!
  alternative: அவன் இஸ்ரவேலின் அரசனானால்
  rationale: கிரேக்கத்தில் வெளிப்படையான நிபந்தனைச் சொல் இல்லை; அரச பட்டம் நேரடியாகக் கூறப்படுகிறது. தமிழில் ‘அல்லவா!’ என்பது நிபந்தனையைச் சேர்க்காமல், சூழலிலுள்ள கேலி மற்றும் சவால் தொனியை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நேரடி உரை. ‘அல்லவா!’ கேலி தொனியை வெளிப்படுத்தினாலும் மூலத்தில் இல்லாத வெளிப்படையான ‘என்றால்’ நிபந்தனையை முதன்மை உரையில் சேர்க்கவில்லை. அடிக்குறிப்பு குறியீடு [a] முதன்மை உரையில் இடம்பெற்றுள்ளது.
