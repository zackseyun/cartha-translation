id: MAT.27.4
reference: Matthew 27:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγων· Ἥμαρτον παραδοὺς αἷμα ⸀ἀθῷον. οἱ δὲ εἶπαν· Τί πρὸς ἡμᾶς; σὺ ⸀ὄψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/004.yaml
  text: saying, “I have sinned by betraying innocent blood.” But they said, “What is that to us? You will see to it.”
translation:
  language: ta
  text: “குற்றமற்ற இரத்தத்தைக் காட்டிக்கொடுத்ததால்[a] நான் பாவம் செய்துவிட்டேன்” என்று அவன் சொன்னான். அதற்கு அவர்கள், “அது எங்களுக்கு என்ன? அதை நீயே பார்த்துக்கொள்[b]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல்லாக, “குற்றமற்ற இரத்தத்தைக் காட்டிக்கொடுத்துவிட்டு.”
    reason: lexical_alternative
  - marker: b
    text: சொல்லுருவில், “அதை நீயே பார்ப்பாய்”; இங்கு “அது உன் பொறுப்பு” என்று கடுமையாக விலக்கிவிடும் பொருள்.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἥμαρτον
  choice: நான் பாவம் செய்துவிட்டேன்
  rationale: தனது கடந்த செயல் இப்போது தன் மீது குற்றமாக நிற்பதை யூதாஸ் ஒப்புக்கொள்வதால், இறந்தகாலச் செயலும் அதன் தற்போதைய விளைவும் இயல்பாக வெளிப்படும் தமிழ் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: παραδοὺς
  choice: காட்டிக்கொடுத்ததால்
  rationale: இங்கு வினையெச்சம் அவன் செய்த பாவத்திற்கான காரணத்தை விளக்குகிறது. கதைச்சூழலில் இயேசுவை எதிரிகளிடம் ஒப்படைத்த துரோகச் செயலை ‘காட்டிக்கொடுத்தல்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: αἷμα ἀθῷον
  choice: குற்றமற்ற இரத்தம்
  rationale: கிரேக்கத்தின் சுருக்கமான சட்ட-ஒழுக்க மரபுத்தொடரைப் பாதுகாக்கிறது; இயேசு அல்லது ஒரு மனிதன் என்று மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: Τί πρὸς ἡμᾶς;
  choice: அது எங்களுக்கு என்ன?
  rationale: பொறுப்பையும் அக்கறையையும் தள்ளிவிடும் கிரேக்க மரபுத்தொடருக்கு நெருக்கமான, இயல்பான தமிழ் கேள்வி.
- source_word: σὺ ὄψῃ
  choice: அதை நீயே பார்த்துக்கொள்
  rationale: வடிவத்தில் எதிர்காலமாக இருந்தாலும், சூழலில் இது ‘நீயே கவனித்துக்கொள்/அது உன் பொறுப்பு’ என்ற கடுமையான விலக்கலைக் குறிக்கிறது. தமிழ் கட்டளை வடிவம் அதன் உரையாடல் வலிமையைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: ‘குற்றமற்ற இரத்தம்’ யாரைக் குறிக்கிறது என்பதை வெளிப்படையாகச் சொல்வதா
  choice: ‘குற்றமற்ற இரத்தம்’ என்று மூலத்தின் மறைமுகக் குறிப்பையே வைத்தல்
  alternative: ‘குற்றமற்ற ஒருவரின் இரத்தம்’ அல்லது ‘இயேசுவின் இரத்தம்’
  rationale: மூலம் குறிக்கப்படுபவரின் பெயரைச் சொல்லவில்லை. பெயரையோ ‘ஒருவர்’ என்பதையோ சேர்ப்பது பொருளைத் தெளிவாக்கினாலும், மூலத்தின் சுருக்கத்தையும் வேதாகம மரபுத்தொடரையும் மாற்றிவிடும்.
- issue: σὺ ὄψῃ என்பதின் எதிர்கால வடிவத்தையா, விலக்கும் கட்டளைப் பொருளையா முன்னிறுத்துவது
  choice: ‘அதை நீயே பார்த்துக்கொள்’ என்று சூழல்சார் கட்டளைப் பொருளை முன்னிறுத்தல்
  alternative: ‘அதை நீயே பார்ப்பாய்’
  rationale: சொல்லுருவில் எதிர்காலம் என்ற இருமையை அடிக்குறிப்பில் பதிவு செய்து, பிரதான உரையில் இயல்பான தமிழ் வழியாக அந்தக் கடுமையான பொறுப்புத் தள்ளுதலை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், ஒப்புதல் மற்றும் கடுமையான மறுப்பு ஆகிய உரையாடல் தொனிகள் தெளிவாகவும் அமைக்கப்பட்டுள்ளது. ‘குற்றமற்ற இரத்தம்’ என்ற வேதாகமச் சட்ட-ஒழுக்க மரபுத்தொடர் பாதுகாக்கப்பட்டுள்ளது.
