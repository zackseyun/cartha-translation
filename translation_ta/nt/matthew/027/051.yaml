id: MAT.27.51
reference: Matthew 27:51
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ τὸ καταπέτασμα τοῦ ναοῦ ἐσχίσθη ⸂ἀπ’ ἄνωθεν ἕως κάτω εἰς δύο⸃, καὶ ἡ γῆ ἐσείσθη, καὶ αἱ πέτραι ἐσχίσθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/051.yaml
  text: And behold[a], the curtain of the temple was torn in two from top to bottom, and the earth shook, and the rocks were split.
translation:
  language: ta
  text: இதோ, தேவாலயத்தின் திரை[a] மேலிருந்து கீழ்வரை இரண்டாகக் கிழிந்தது; பூமி அதிர்ந்தது; பாறைகள் பிளந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பரிசுத்தஸ்தலத்தின் திரை.’ கிரேக்க καταπέτασμα என்பது ஆலயத்தின் உட்புறத் திரையைக் குறிக்கலாம்; ναός என்பதும் இங்கு குறிப்பாகப் பரிசுத்தஸ்தலத்தைக் குறிக்கக்கூடும்.
    reason: καταπέτασμα மற்றும் ναός ஆகியவற்றின் குறிப்பான சன்னதி/உட்புறத் திரை சார்ந்த சாத்தியமான பொருளை, முதன்மை உரையில் ஒரு விளக்கத்தைத் திணிக்காமல் தெரிவிக்கிறது.
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: திடீரென நிகழ்வதன் மீது வாசகரின் கவனத்தைத் திருப்பும் வலிமையான உரையாடல் குறியீட்டை இயல்பாகவும் நேரடியாகவும் தக்கவைக்கிறது.
- source_word: καταπέτασμα τοῦ ναοῦ
  choice: தேவாலயத்தின் திரை
  rationale: καταπέτασμα என்பது தொங்கவிடப்பட்ட திரையையும், ναός இங்கு தேவாலயத்தின் பரிசுத்த இடத்தையும் குறிக்கலாம். சாதாரண வாசகருக்குத் தெளிவான ‘தேவாலயத்தின் திரை’ முதன்மை உரையில் பயன்படுத்தப்பட்டு, குறிப்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐσχίσθη
  choice: கிழிந்தது
  rationale: துணியைப் பற்றிப் பேசும்போது இயல்பான வினைச்சொல்; கிரேக்கச் செயலப்பாட்டு வடிவத்தைப் போலவே செயலைச் செய்தவர் யார் என்று வெளிப்படையாகக் குறிப்பிடவில்லை.
- source_word: ἀπ’ ἄνωθεν ἕως κάτω εἰς δύο
  choice: மேலிருந்து கீழ்வரை இரண்டாக
  rationale: கிழிவு ஏற்பட்ட திசையையும் அதன் விளைவையும் இயல்பான தமிழ் சொற்றொடரில் துல்லியமாகக் காட்டுகிறது.
- source_word: ἡ γῆ ἐσείσθη
  choice: பூமி அதிர்ந்தது
  rationale: γῆ என்பதன் விரிவான பொருளையும் நிலநடுக்க நிகழ்வையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: αἱ πέτραι ἐσχίσθησαν
  choice: பாறைகள் பிளந்தன
  rationale: πέτραι என்பதற்கு இச்சூழலில் ‘பாறைகள்’ பொருத்தமானது; σχίζω என்ற ஒரே கிரேக்க வினைச்சொல் பயன்படுத்தப்பட்டிருந்தாலும், பாறைகளைப் பற்றிய தமிழில் ‘பிளந்தன’ இயல்பானது.
theological_decisions:
- issue: தேவாலயத் திரை கிழிந்த நிகழ்வின் பொருள்
  choice: திரை கிழிந்ததாக நிகழ்வை மட்டும் நேரடியாக மொழிபெயர்த்தல்
  alternative: இது கடவுளிடம் செல்லும் வழி திறந்ததையோ தேவாலயத்தின் மீதான தீர்ப்பையோ குறிக்கிறது என்று உரையிலேயே விளக்குதல்
  rationale: இந்த வசனம் நிகழ்வுகளைக் கூறுகிறது; அவற்றின் இறையியல் பொருளை நேரடியாக விளக்கவில்லை. ஆகவே விளக்கவுரையை மொழிபெயர்ப்புக்குள் சேர்க்காமல் வசனத்தின் இறையியல் அழுத்தத்தையும் திறந்த தன்மையையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியக்கூடிய அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘இதோ’ என்ற சொல் மூலத்தின் திடீர் கவன ஈர்ப்பைத் தக்கவைக்கிறது; தொடர்ச்சியான நிகழ்வுகள் அரைப்புள்ளிகளால் தெளிவாக இணைக்கப்பட்டுள்ளன.
