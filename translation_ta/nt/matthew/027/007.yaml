source:
  edition: SBLGNT
  text: συμβούλιον δὲ λαβόντες ἠγόρασαν ἐξ αὐτῶν τὸν Ἀγρὸν τοῦ Κεραμέως εἰς ταφὴν τοῖς ξένοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/007.yaml
  text: So after taking counsel[b][a], they bought the Potter’s Field with them as a burial place for foreigners.
translation:
  language: ta
  text: ஆகவே, அவர்கள் ஆலோசனை செய்து, அவற்றைக் கொண்டு[a] குயவனின் நிலத்தை அந்நியர்களை[b] அடக்கம் செய்யும் இடமாக வாங்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்தப் பணத்தைக் கொண்டு.” கிரேக்கத்தில் சொல்லுக்கு சொல் “அவற்றிலிருந்து” என்று உள்ளது; இது முந்தைய சூழலில் குறிப்பிடப்பட்ட வெள்ளிக்காசுகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வெளியூராரை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συμβούλιον ... λαβόντες
  choice: ஆலோசனை செய்து
  rationale: ‘ஆலோசனையை எடுத்துக்கொண்டு’ என்ற சொல்லாட்சியை விட, கூட்டாக முடிவெடுக்க ஆலோசித்தார்கள் என்ற கிரேக்க மரபுத்தொடரின் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: δὲ
  choice: ஆகவே
  rationale: இங்கு வலுவான எதிர்மறையை அல்லாமல், முந்தைய நிகழ்விலிருந்து தொடரும் விளைவு சார்ந்த கதை நகர்வைக் குறிக்கிறது.
- source_word: ἠγόρασαν
  choice: வாங்கினார்கள்
  rationale: ἀγοράζω என்பதன் இறந்தகாலச் செயலை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐξ αὐτῶν
  choice: அவற்றைக் கொண்டு
  rationale: முந்தைய சூழலில் கூறப்பட்ட வெள்ளிக்காசுகளைக் குறிக்கும் பன்மைப் பிரதிப்பெயரைத் தக்கவைத்து, அவற்றை விலையாகப் பயன்படுத்தினர் என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τὸν Ἀγρὸν τοῦ Κεραμέως
  choice: குயவனின் நிலத்தை
  rationale: உடைமைப் பொருளுள்ள கிரேக்கத் தொடரை தெளிவாகவும் வழக்கமான தமிழிலும் தருகிறது.
- source_word: εἰς ταφὴν
  choice: அடக்கம் செய்யும் இடமாக
  rationale: நிலம் எந்த நோக்கத்திற்காக வாங்கப்பட்டது என்பதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τοῖς ξένοις
  choice: அந்நியர்களை
  rationale: உள்ளூரைச் சேர்ந்திராதவர்கள் அல்லது வெளியிலிருந்து வந்தவர்கள் என்ற ξένος சொல்லின் பரப்பைத் திறந்தவாறு வைத்திருக்கிறது.
theological_decisions:
- issue: ἐξ αὐτῶν என்பதிலுள்ள பிரதிப்பெயரின் சுட்டுப்பொருள்
  choice: முந்தைய வசனச் சூழலில் உள்ள வெள்ளிக்காசுகளைச் சுட்டும் ‘அவற்றைக் கொண்டு’
  alternative: ‘அந்தப் பணத்தைக் கொண்டு’ என்று வெளிப்படையாக விரித்துரைத்தல்
  rationale: உடனடியான சூழல் வெள்ளிக்காசுகளையே சுட்டுகிறது; அதேவேளை, மூலத்தின் பிரதிப்பெயர் வடிவத்தைத் தமிழிலும் இயன்றவரை காக்கிறது.
- issue: τοῖς ξένοις என்பதன் பொருள் வரம்பு
  choice: அந்நியர்கள்
  alternative: வெளியூரார் / அறிமுகமில்லாதவர்கள்
  rationale: இங்கு உள்ளூரைச் சேர்ந்திராதவர்களைக் குறிக்கும் வாய்ப்பு அதிகம்; ‘அந்நியர்கள்’ என்பது அந்தப் பொருளைத் தருவதோடு சொல்லின் பரந்த தன்மையையும் முற்றிலும் மூடிவிடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. கிரேக்கப் பிரதிப்பெயரின் சுட்டுப்பொருளும் ξένοις சொல்லின் பொருள் வரம்பும் அடிக்குறிப்புகள் மூலம் வெளிப்படையாக வைக்கப்பட்டுள்ளன.
