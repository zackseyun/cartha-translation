  text: καὶ ἐν τῷ κατηγορεῖσθαι αὐτὸν ὑπὸ τῶν ἀρχιερέων ⸀καὶ πρεσβυτέρων οὐδὲν ἀπεκρίνατο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/012.yaml
  text: And while he was being accused by the chief priests and elders[a], he answered nothing.
translation:
  language: ta
  text: தலைமை ஆசாரியர்களும் மூப்பர்களும் அவர் மீது குற்றம் சாட்டிக்கொண்டிருந்தபோது, அவர் எதற்கும் பதிலளிக்கவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῷ κατηγορεῖσθαι
  choice: குற்றம் சாட்டப்பட்டபோது
  rationale: ἐν + பெயர்ச்சொல் தன்மையிலான நிகழ்கால வினையெச்சம், அதே நேரத்தில் நடைபெறும் செயலைக் குறிக்கிறது. தமிழில் ‘குற்றம் சாட்டப்பட்டபோது’ என்பது இயல்பாகவும் செயப்பாட்டு பொருளைத் தெளிவாகவும் தருகிறது.
- source_word: κατηγορεῖσθαι
  choice: குற்றம் சாட்டப்பட்ட
  rationale: நீதித்துறைச் சூழலில் அவருக்கு எதிராகக் குற்றச்சாட்டுகள் முன்வைக்கப்பட்டதை இந்தச் செயப்பாட்டு வினை குறிக்கிறது.
- source_word: ὑπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων
  choice: தலைமை ஆசாரியர்களாலும் மூப்பர்களாலும்
  rationale: ἀρχιερεῖς என்பது நற்செய்தி நூல்களில் ஆசாரியத் தலைவர்களைக் குறிக்கும் வழக்குச் சொல்; ‘தலைமை ஆசாரியர்கள்’ என்பது பன்மையையும் அவர்களின் தலைமைப் பொறுப்பையும் துல்லியமாகக் காட்டுகிறது. πρεσβύτεροι என்பதற்கு இச்சூழலில் மரபானதும் தெளிவானதும் ‘மூப்பர்கள்’.
- source_word: οὐδὲν
  choice: எதுவும் ... இல்லை
  rationale: ἀπεκρίνατο என்பதோடு சேர்ந்த οὐδέν, ‘எதையும் பதிலாகச் சொல்லவில்லை’ என்ற முழுமையான மறுப்பைத் தருகிறது; தமிழில் ‘எதுவும் பதிலளிக்கவில்லை’ என்பது நேரடியும் இயல்புமான வடிவம்.
- source_word: ἀπεκρίνατο
  choice: பதிலளிக்கவில்லை
  rationale: ἀποκρίνομαι என்பதன் இயல்பான தமிழ் இணை ‘பதிலளி’. இறந்தகால நிகழ்வையும் οὐδέν உடனான மறுப்பையும் ஒருங்கிணைத்து ‘பதிலளிக்கவில்லை’ என வழங்கப்பட்டுள்ளது.
- source_word: καὶ
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: கிரேக்க καὶ முந்தைய வசனத்துடன் கதையை இணைக்கிறது. தனி வசனமாக வாசிக்கப்படும் நவீன தமிழில் தொடக்க ‘மேலும்/அப்போது’ தேவையற்ற சுமையை ஏற்படுத்துவதால், தொடர்ச்சியை வாக்கிய ஒழுங்கே இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: குற்றம் சாட்டியவர்களுக்கு முன் இயேசுவின் மௌனம்
  choice: அவர் எதுவும் பதிலளிக்கவில்லை என்று நிகழ்வை மட்டும் நேரடியாகக் கூறுதல்
  alternative: ஏசாயா 53-ஐ நினைவூட்டும் வகையில் ‘அவர் வாய் திறக்கவில்லை’ என்று பொருள் விரித்தல்
  rationale: இந்த வசனம் அவரது பதிலின்மையை விவரிக்கிறது; தீர்க்கதரிசன நிறைவேற்றத்தை வெளிப்படையாகக் குறிப்பிடவில்லை. ஆகவே அந்தத் தொடர்பை மொழிபெயர்ப்புக்குள் சேர்க்காமல், மூலத்தின் இறையியல் ஒலிப்பையும் பதற்றத்தையும் வாசகருக்கே விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், கண்ணியமான உரைநடை. ‘பிரதான ஆசாரியர்கள்’ என்பதற்குப் பதிலாக இயல்பான ‘தலைமை ஆசாரியர்கள்’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் உண்மையான விளக்க வேறுபாடு இல்லாததால் அடிக்குறிப்பு சேர்க்கப்படவில்லை; ஆங்கில POB-இன் [a] குறி உள்ளடக்கத்துடன் பொருந்தாததாகத் தோன்றுவதால் அது தமிழில் மீளிடப்படவில்லை.
