id: MAT.27.41
reference: Matthew 27:41
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁμοίως ⸀καὶ οἱ ἀρχιερεῖς ἐμπαίζοντες μετὰ τῶν γραμματέων καὶ ⸀πρεσβυτέρων ἔλεγον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/041.yaml
  text: Likewise[a], the chief priests also, mocking him with the scribes and elders, were saying,
translation:
  language: ta
  text: 'அவ்வாறே[a], தலைமைக் குருக்களும் மறைநூல் அறிஞர்களோடும் மூப்பர்களோடும் சேர்ந்து அவரைக் கேலி செய்து, இவ்வாறு சொல்லிக்கொண்டிருந்தார்கள்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இதேபோல, தலைமைக் குருக்களும் மறைநூல் அறிஞர்களோடும் மூப்பர்களோடும் சேர்ந்து அவரைக் கேலி செய்து இவ்வாறு சொல்லிக்கொண்டிருந்தார்கள்:”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: அவ்வாறே
  rationale: முந்தைய வசனங்களில் நிகழ்ந்த கேலியுடன் இச்செயலை ஒப்பிட்டு இணைக்கும் வினையுரிச்சொல்லின் பொருளை இயல்பாகத் தருகிறது.
- source_word: καὶ
  choice: -உம்
  rationale: முன்னர் குறிப்பிடப்பட்ட கேலி செய்தவர்களுடன் தலைமைக் குருக்களையும் சேர்க்கும் கூட்டுப் பொருளைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: ἀρχιερεῖς
  choice: தலைமைக் குருக்கள்
  rationale: முதன்மை வகித்த குருத்துவ அதிகாரிகளைக் குறிக்கும் பன்மைக்கான தெளிவான, வழக்கமான மொழிபெயர்ப்பு.
- source_word: ἐμπαίζοντες
  choice: அவரைக் கேலி செய்து
  rationale: இகழ்ச்சியுடன் பரிகசித்த செயலைக் காட்டுகிறது; சூழலிலிருந்து இயேசுவே அதன் செயப்படுபொருள் என்பது தெளிவாதலால் ‘அவரை’ சேர்க்கப்பட்டுள்ளது.
- source_word: μετὰ
  choice: -ஓடும் ... -ஓடும் சேர்ந்து
  rationale: மறைநூல் அறிஞர்களும் மூப்பர்களும் கேலி செயலில் பங்கேற்ற கூட்டுறவைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: γραμματέων
  choice: மறைநூல் அறிஞர்கள்
  rationale: யூத மறைநூல்களை நகலெடுத்து விளக்கிய அங்கீகரிக்கப்பட்ட அறிஞர்களைக் குறிக்கும் சொல்லை இன்றைய வாசகருக்குப் புரியும் வகையில் தருகிறது.
- source_word: πρεσβυτέρων
  choice: மூப்பர்கள்
  rationale: வெறும் வயது முதிர்ந்த ஆண்களை அல்லாமல், அங்கீகரிக்கப்பட்ட சமூகத் தலைவர்களைக் குறிக்கும் நிறுவனப் பொருளைப் பாதுகாக்கிறது.
- source_word: ἔλεγον
  choice: சொல்லிக்கொண்டிருந்தார்கள்
  rationale: இறந்தகாலத்தில் நீடித்த அல்லது தொடர்ந்த பேச்சைக் குறிக்கும் கிரேக்க நிறைவுறா காலத்தின் அம்சத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கேலி செய்தவர்களின் அடையாளமும் பங்கேற்பும்
  choice: தலைமைக் குருக்கள், மறைநூல் அறிஞர்கள், மூப்பர்கள் ஆகியோர் சேர்ந்து இயேசுவைக் கேலி செய்தனர்.
  alternative: தலைமைக் குருக்கள் மறைநூல் அறிஞர்களும் மூப்பர்களும் இருந்த இடத்தில் மட்டும் கேலி செய்தனர் என வாசித்தல்.
  rationale: μετὰ + பிறப்புவேற்றுமை இங்கு வெறும் உடனிருப்பைக் காட்டுவதைக் காட்டிலும், செயலில் கூட்டாகப் பங்கேற்றதையே இயல்பாகக் குறிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் பங்கேற்பு வினையெச்சத்தையும் நிறைவுறா கால வினையையும் தமிழின் இயல்பான ‘கேலி செய்து ... சொல்லிக்கொண்டிருந்தார்கள்’ என்ற அமைப்பில் பாதுகாக்கிறது.
