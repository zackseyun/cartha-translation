source:
  edition: SBLGNT
  text: οἱ δὲ πορευθέντες ἠσφαλίσαντο τὸν τάφον σφραγίσαντες τὸν λίθον μετὰ τῆς κουστωδίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/066.yaml
  text: So they went and secured the tomb by sealing the stone with the guard.
translation:
  language: ta
  text: அவர்கள் போய், காவற்படையுடன் கல்லில் முத்திரையிட்டு, கல்லறையைப் பாதுகாப்பாக வைத்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘காவற்படையின் முன்னிலையில் கல்லில் முத்திரையிட்டு’ என்றும், ‘கல்லில் முத்திரையிட்டு காவற்படையை நிறுத்தி’ என்றும் பொருள் கொள்ளலாம். கிரேக்கச் சொற்றொடர் சுருக்கமானது; அது தனியான இரண்டாவது செயலைக் காட்டாமல் காவற்படையின் உடனிருப்பைக் குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ πορευθέντες
  choice: அவர்கள் போய்
  rationale: δέ கதையின் தொடர்ச்சியைக் குறிக்கிறது; πορευθέντες முதன்மை வினையுடன் இணைந்த துணைச் செயலைக் குறிக்கிறது. தமிழில் ‘அவர்கள் போய்’ என்பது இயல்பாகவும் மூலத்தின் தொடர்ச்சியை மிகைப்படுத்தாமலும் தருகிறது.
- source_word: ἠσφαλίσαντο
  choice: பாதுகாப்பாக வைத்தார்கள்
  rationale: ἀσφαλίζω என்பதன் ‘பாதுகாப்பானதாகச் செய்தல், உறுதிப்படுத்துதல்’ என்ற பொருளை சாதாரண நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: τὸν τάφον
  choice: கல்லறையை
  rationale: இச்சூழலில் τάφος இயேசு அடக்கம் செய்யப்பட்ட கல்லறையைக் குறிக்கிறது; ‘கல்லறை’ தெளிவான வழக்குச் சொல்.
- source_word: σφραγίσαντες
  choice: முத்திரையிட்டு
  rationale: இந்த இறந்தகால வினையெச்சம் கல்லறை எவ்வாறு பாதுகாப்பாக்கப்பட்டது என்பதை அல்லது அதனுடன் நிகழ்ந்த செயலைக் காட்டுகிறது. ‘முத்திரையிட்டு’ இரண்டையும் இயல்பாகத் தாங்குகிறது.
- source_word: τὸν λίθον
  choice: கல்லுக்கு
  rationale: கல்லறை வாயிலிலிருந்த குறிப்பிட்ட கல்லையே உரை சுட்டுகிறது; மூலத்தில் இல்லாத ‘வாயிற்கல்’ போன்ற விளக்கத்தைச் சேர்க்காமல் ‘கல்’ என வழங்கப்படுகிறது.
- source_word: μετὰ τῆς κουστωδίας
  choice: காவற்படையுடன்
  rationale: κουστωδία என்பது காவல் பணியில் இருந்த குழுவைக் குறிக்கும் இலத்தீன் கடன்சொல்; μετὰ + உரிமை வேற்றுமை உடனிருப்பை இயல்பாகக் குறிக்கிறது. ‘காவற்படையுடன்’ என்பது அவர்கள் ரோமப் படையினரா ஆலயக் காவலரா என்பதைத் தீர்மானிக்காமல், காவலின் கூட்டு/உடனிருப்பு பொருளைப் பேணுகிறது.
theological_decisions:
- issue: கல்லறையைப் பாதுகாப்பாக்கிய செயலில் μετὰ τῆς κουστωδίας என்பதன் தொடர்பு
  choice: காவற்படையுடன் கல்லுக்கு முத்திரையிட்டு கல்லறையைப் பாதுகாப்பாக வைத்தார்கள்
  alternative: கல்லுக்கு முத்திரையிட்டு காவற்படையை நிறுத்தினார்கள்; அல்லது காவற்படையின் முன்னிலையில் கல்லுக்கு முத்திரையிட்டார்கள்
  rationale: கிரேக்கச் சொற்றொடர் சுருக்கமானது. காவற்படை உடனிருந்தது அல்லது இதில் பங்குகொண்டது என்பதே நேரடியான அமைப்பு; காவற்படையை நிறுத்துவது தனியான இரண்டாவது செயல் என்று உரை வெளிப்படையாகச் சொல்லவில்லை. முதன்மை உரை இந்தத் தெளிவின்மையைப் பேணுகிறது; அடிக்குறிப்பு சாத்தியமான மற்ற புரிதல்களைக் குறிப்பிடுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பத்திரப்படுத்தினார்கள்’ போன்ற சற்றே நிர்வாகத் தொனியுள்ள சொல்லுக்கு மாற்றாக ‘பாதுகாப்பாக வைத்தார்கள்’ தேர்ந்தெடுக்கப்பட்டுள்ளது. காவலர்களின் அடையாளம் அல்லது முத்திரையிடும் நடைமுறை குறித்து மூலத்தில் இல்லாத விவரங்கள் சேர்க்கப்படவில்லை.
