revisions:
- from: யோசேப்பு அந்த உடலை எடுத்துச் சுத்தமான மெல்லிய நார்த்துணியில் சுற்றினார்.[a]
  to: யோசேப்பு அந்த உடலை எடுத்துச் சுத்தமான லினன் துணியால் சுற்றினார்.[a]
  rationale: The revision preserves the narrative sequence and the Greek reference to ‘the body,’ while rendering σινδών specifically as linen without adding the unsupported idea that the cloth was fine or thin. The footnote retains the permissible burial-cloth sense as an alternative rather than making it part of the main text.
