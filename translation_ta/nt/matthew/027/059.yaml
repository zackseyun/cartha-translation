  yaml_path: translation/nt/matthew/027/059.yaml
  text: And Joseph took the body and wrapped it in a clean linen cloth[b][a],
translation:
  language: ta
  text: யோசேப்பு அந்த உடலை எடுத்துச் சுத்தமான லினன் துணியால் சுற்றினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சுத்தமான லினன் அடக்கத் துணியில் சுற்றினார்.’ கிரேக்கச் சொல் அடக்கத்திற்குப் பயன்படுத்தப்படும் லினன் துணியைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: எடுத்து
  rationale: இறந்தகாலப் பங்கேற்புவினை முதன்மை வினைக்கு முந்திய செயலைக் குறிக்கிறது; தமிழில் ‘எடுத்து ... சுற்றினார்’ என்பது இயல்பாகவும் மூலத்தின் செயல்முறை வரிசையைத் தக்கவைத்தும் உள்ளது.
- source_word: σῶμα
  choice: அந்த உடலை
  rationale: σῶμα என்பதன் நேர்ப்பொருள் ‘உடல்’. கிரேக்கத்தில் உடைமைச்சொல் இல்லை; முன்சூழலில் குறிப்பிடப்பட்ட இயேசுவின் உடலைச் சுட்டுவதால் தமிழில் ‘அந்த’ சேர்ப்பது இயல்பான தெளிவை அளிக்கிறது.
- source_word: ἐνετύλιξεν
  choice: சுற்றினார்
  rationale: ἐντυλίσσω என்பது சுற்றுதல் அல்லது பொதிதல். அடக்கச் சூழலில் துணியால் உடலைச் சுற்றிய செயலை ‘சுற்றினார்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: αὐτὸ
  choice: அந்த உடலை
  rationale: நடுநிலை ஒருமைப் பெயர்ப்பதிலி σῶμα என்பதையே இலக்கணப்படி மீண்டும் சுட்டுகிறது. தமிழில் தனியே ‘அதை’ என்று மொழிபெயர்ப்பதைவிட, வாக்கிய அமைப்பில் ‘அந்த உடலை’ என்பதோடு பொருளை ஒருங்கிணைப்பது இயல்பானது.
- source_word: σινδόνι
  choice: மெல்லிய நார்த்துணியில்
  rationale: σινδών என்பது மெல்லிய நாரால் செய்யப்பட்ட துணியைக் குறிக்கிறது; இச்சூழலில் அது அடக்கத்திற்குப் பயன்படுத்தப்பட்ட துணி. ‘நார்த்துணி’ பொருளைத் தருகிறது; ‘அடக்கப் போர்வை’ என்று குறிப்பிட்டுவிடாமல் மூலத்தின் சொற்பொருள் அகலத்தைப் பாதுகாக்கிறது.
- source_word: καθαρᾷ
  choice: சுத்தமான
  rationale: இங்கு καθαρός துணியின் தூய்மை அல்லது அழுக்கின்மையை விவரிக்கிறது; நவீன தமிழில் ‘சுத்தமான’ இயல்பான இணை.
- source_word: καὶ ... ὁ Ἰωσὴφ
  choice: யோசேப்பு
  rationale: καί கதைத் தொடரை இணைக்கிறது. தனி வசனமாக வாசிக்கும்போது தமிழில் தொடக்க ‘மேலும்/அப்போது’ தேவையின்றி செயல்வரிசை தெளிவாக இருப்பதால் வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை.
