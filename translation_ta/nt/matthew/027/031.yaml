id: MAT.27.31
reference: Matthew 27:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὅτε ἐνέπαιξαν αὐτῷ, ἐξέδυσαν αὐτὸν τὴν χλαμύδα καὶ ἐνέδυσαν αὐτὸν τὰ ἱμάτια αὐτοῦ καὶ ἀπήγαγον αὐτὸν εἰς τὸ σταυρῶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/031.yaml
  text: And when they had mocked him[a], they stripped the cloak off him and put his own clothes on him, and led him away to crucify him.
translation:
  language: ta
  text: அவர்கள் அவரை ஏளனம் செய்து முடித்தபின், அந்த மேலங்கியை அவரிடமிருந்து கழற்றி, அவருடைய சொந்த உடைகளை அவருக்கு உடுத்தி, சிலுவையில் அறைவதற்காக அவரைக் கூட்டிக்கொண்டு போனார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: ஏளனம் செய்து முடித்தபின்
  rationale: வினைச்சொல் இகழ்ச்சியுடன் கேலி செய்வதைக் குறிக்கிறது. ὅτε உடன் வரும் இறந்தகால நிகழ்வின் நிறைவையும் அடுத்த செயல்வரிசையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: χλαμύδα
  choice: அந்த மேலங்கியை
  rationale: χλαμύς என்பது பொதுவாக மேலே அணியும் போர்வை போன்ற ஆடையைக் குறிக்கும்; சூழலில் முன்பு இயேசுவுக்கு அணிவிக்கப்பட்ட கேலி அரச ஆடையைச் சுட்டுவதால் ‘அந்த’ சேர்க்கப்பட்டுள்ளது. ‘அரச அங்கி’ என்று பொருளை மிகையாகத் தீர்மானிப்பது தவிர்க்கப்படுகிறது.
- source_word: ἐξέδυσαν αὐτὸν τὴν χλαμύδα
  choice: அந்த மேலங்கியை அவரிடமிருந்து கழற்றி
  rationale: ἐκδύω ஆடையை ஒருவரிடமிருந்து அகற்றுதல் அல்லது கழற்றுதலைக் குறிக்கிறது. தமிழ் இயல்புக்கேற்ப பொருள் முன்னிலைப்படுத்தப்பட்டுள்ளது.
- source_word: ἐνέδυσαν αὐτὸν τὰ ἱμάτια αὐτοῦ
  choice: அவருடைய சொந்த உடைகளை அவருக்கு உடுத்தி
  rationale: ἱμάτια என்பது பொதுவான பன்மைச் சொல்; ‘உடைகள்’ நவீன தமிழில் தெளிவானது. αὐτοῦ காட்டும் உடைமையையும் கேலி மேலங்கியுடனான வேறுபாட்டையும் ‘சொந்த’ தெளிவாக்குகிறது.
- source_word: ἀπήγαγον
  choice: கூட்டிக்கொண்டு போனார்கள்
  rationale: காவலில் உள்ள ஒருவரை ஓர் இடத்திற்குக் கொண்டுசெல்லும் பொருளை இயல்பான தமிழில் தருகிறது; அவர் தன்னிச்சையாகச் சென்றார் என்ற உணர்வைத் தவிர்க்கிறது.
- source_word: εἰς τὸ σταυρῶσαι
  choice: சிலுவையில் அறைவதற்காக
  rationale: εἰς உடன் வரும் பெயரெச்ச வினை நோக்கத்தைக் குறிக்கிறது. ‘சிலுவையில் அறை’ என்பது σταυρόω என்பதற்கான தெளிவான, வழக்கமான தமிழ் வெளிப்பாடு.
