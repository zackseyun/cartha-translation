source:
  edition: SBLGNT
  text: Ὀψίας δὲ γενομένης ἦλθεν ἄνθρωπος πλούσιος ἀπὸ Ἁριμαθαίας, τοὔνομα Ἰωσήφ, ὃς καὶ αὐτὸς ⸀ἐμαθητεύθη τῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/057.yaml
  text: When evening had come[a], a rich man from Arimathea came, named Joseph[b], who himself also had become a disciple of Jesus.
translation:
  language: ta
  text: மாலை ஆனபோது, அரிமத்தியாவைச் சேர்ந்த யோசேப்பு என்ற செல்வந்தர் ஒருவர் வந்தார். அவரும் கூட இயேசுவின் சீடராகியிருந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரும் இயேசுவால் சீடராக்கப்பட்டிருந்தார்”; அல்லது, “அவரும் இயேசுவின் சீடராக இருந்தார்.”
    reason: ἐμαθητεύθη என்ற செயப்பாட்டு வினை, சீடராக ஆனதையோ சீடராக்கப்பட்டதையோ குறிக்கலாம்.
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: மாலை வேளையானபோது
  rationale: முற்றுப்பெற்ற காலச் சூழலைக் காட்டும் உடைமை வேற்றுமைத் தனிநிலைத் தொடரை இயல்பான தமிழில் காலத் துணைவாக்கியமாக வழங்குகிறது. δέ குறிக்கும் மென்மையான கதை மாற்றத்தைச் சூழலும் வாக்கிய அமைப்பும் உணர்த்துவதால் தனியே மிகைப்படுத்தப்படவில்லை.
- source_word: ἦλθεν
  choice: வந்தார்
  rationale: ἔρχομαι என்பதன் எளிய இறந்தகாலக் கதைநடைப் பொருளை நேரடியாகவும், யோசேப்புக்குரிய மரியாதைப் பன்மையுடனும் தருகிறது.
- source_word: ἄνθρωπος πλούσιος
  choice: செல்வந்தர் ஒருவர்
  rationale: அவர் செல்வமுள்ள மனிதர் என்பதை இயல்பான, கண்ணியமான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἀπὸ Ἁριμαθαίας
  choice: அரிமத்தியாவைச் சேர்ந்த
  rationale: ἀπό குறிக்கும் ஊர்த் தோற்றம் அல்லது தொடர்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τοὔνομα Ἰωσήφ
  choice: யோசேப்பு என்ற
  rationale: பெயரை அடையாளப்படுத்தும் கிரேக்கச் சொற்றொடரின் சுருக்கமான இயல்பான தமிழ் வடிவம்.
- source_word: ὃς καὶ αὐτὸς
  choice: அவரும்
  rationale: யோசேப்பும் மற்றவர்களுடன் சேர்ந்து சீடராக இருந்தார் என்ற καί மற்றும் αὐτός ஆகியவற்றின் இணைந்த வலியுறுத்தலை இயல்பான தமிழில் தருகிறது; தேவையற்ற ‘அவர்தாமும்’ என்ற செயற்கையான நடையைத் தவிர்க்கிறது.
- source_word: ἐμαθητεύθη τῷ Ἰησοῦ
  choice: இயேசுவின் சீடராகியிருந்தார்
  rationale: யோசேப்பு இயேசுவின் சீடர் என்ற நிலைக்கு வந்திருந்தார் என்பதைத் தெளிவாகக் கூறுகிறது; அவர் எவ்வாறு சீடராக்கப்பட்டார் என்பதை மூலத்தைவிடக் குறிப்பாக நிர்ணயிப்பதில்லை.
theological_decisions:
- issue: ἐμαθητεύθη என்பதன் செயப்பாட்டு வடிவமும் இயேசுவுடனான தொடர்பும்
  choice: இயேசுவின் சீடராகியிருந்தார்
  alternative: இயேசுவால் சீடராக்கப்பட்டிருந்தார்; இயேசுவின் சீடராக இருந்தார்
  rationale: செயப்பாட்டு வடிவம் ‘சீடரானார்’ அல்லது ‘சீடராக்கப்பட்டார்’ என்ற இரு நுணுக்கங்களையும் அனுமதிக்கிறது. முதன்மை மொழிபெயர்ப்பு யோசேப்பின் சீடர் நிலையைத் தெளிவுபடுத்துகிறது; சீடராக்கப்பட்ட விதத்தைப் பற்றிய கூடுதல் கோட்பாட்டைத் திணிக்காமல் மாற்றுப் பொருளை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையான, கண்ணியமான கதைநடை. ‘யோசேப்பு’, ‘அரிமத்தியா’ ஆகிய வழக்கமான வேதாகமப் பெயர்வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தில் உள்ள சீடராதல் குறித்த நுணுக்க வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
