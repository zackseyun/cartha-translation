  to: மாலை ஆனபோது, அரிமத்தியாவைச் சேர்ந்த யோசேப்பு என்ற செல்வந்தர் ஒருவர் வந்தார். அவரும் கூட இயேசுவின் சீடராகியிருந்தார்.[a]
