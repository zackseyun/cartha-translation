base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/032.yaml
  text: And as they were going out[a], they found a man of Cyrene named Simon[b]. They compelled him to carry his cross.
translation:
  language: ta
  text: அவர்கள் வெளியே சென்றுகொண்டிருந்தபோது, சிரேனே நகரைச் சேர்ந்த சீமோன் என்ற ஒரு மனிதரைக் கண்டார்கள். இயேசுவின் சிலுவையைச் சுமக்கச் சீமோனைக் கட்டாயப்படுத்தினர்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வற்புறுத்தினர்’ அல்லது ‘கட்டாயச் சேவையில் ஈடுபடுத்தினர்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினை, அதிகாரத்தின் பேரில் திணிக்கப்படும் கட்டாயச் சேவையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξερχόμενοι
  choice: அவர்கள் வெளியே போய்க்கொண்டிருந்தபோது
  rationale: நிகழ்ந்துகொண்டிருக்கும் செயலைக் குறிக்கும் நிகழ்காலப் பங்கேற்புவினை இங்கு காலப் பொருளில் வருகிறது; முதன்மை வினையுடன் ஒரே நேரத்தில் நடந்த செயலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது வலுவான முரண்பாட்டைக் காட்டாமல் கதையை முன்னெடுக்கும் மென்மையான இணைப்பாக உள்ளது; தமிழில் வாக்கியத் தொடர்ச்சியே அந்தப் பணியை இயல்பாக நிறைவேற்றுகிறது.
- source_word: εὗρον
  choice: கண்டார்கள்
  rationale: εὑρίσκω என்ற வினையின் இறந்தகால வடிவத்துக்கு நேரான, இயல்பான தமிழ் இணை.
- source_word: ἄνθρωπον Κυρηναῖον
  choice: சிரேனே ஊரைச் சேர்ந்த ... ஒரு மனிதர்
  rationale: Κυρηναῖον அந்த மனிதரின் புவியியல் பிறப்பிடத்தையோ ஊர்ச் சார்பையோ குறிக்கிறது; தமிழில் புரிந்துகொள்ள எளிதாக ஊரின் பெயருடன் உறவைத் தெளிவுபடுத்துகிறது.
- source_word: ὀνόματι Σίμωνα
  choice: சீமோன் என்ற
  rationale: ஒருவரின் பெயரை அறிமுகப்படுத்தும் கிரேக்க மரபுத்தொடருக்கு இயல்பான தமிழ் வடிவம்.
- source_word: τοῦτον
  choice: இவரை
  rationale: வெறும் ‘அவரை’ என்பதற்குப் பதிலாக கிரேக்கச் சுட்டுப்பெயரின் வெளிப்படையான சுட்டுதலையும் லேசான அழுத்தத்தையும் காக்கிறது.
- source_word: ἠγγάρευσαν
  choice: கட்டாயப்படுத்தினர்
  rationale: அதிகாரத்தின் பேரில் ஒருவரைக் கட்டாயச் சேவைக்கு உட்படுத்தும் வினையின் வற்புறுத்தல் பொருளைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: ἵνα ἄρῃ
  choice: சுமக்க
  rationale: ἵνα உடன் வரும் துணைவினை நோக்கத்தைக் குறிக்கிறது; சிலுவைப் பயணச் சூழலில் αἴρω என்பதற்கு ‘சுமக்க’ என்பதே தெளிவான பொருள்.
- source_word: τὸν σταυρὸν
  choice: சிலுவை
  rationale: கிரேக்கச் சொல்லின் வழக்கமானதும் துல்லியமானதுமான இணை; ‘குறுக்குமரம்’ என வரலாற்று விவரத்தைச் சுருக்கிச் சேர்க்கவில்லை.
- source_word: αὐτοῦ
  choice: அவருடைய
  rationale: மூலத்தின் பிரதிப்பெயரை வெளிப்படையான ‘இயேசுவின்’ என்று மாற்றாமல் காக்கிறது; சூழலில் அது இயேசுவைக் குறிக்கிறது.
theological_decisions:
- issue: αὐτοῦ (‘அவருடைய’) என்பதன் குறிப்பு
  choice: முதன்மை உரையில் பிரதிப்பெயரைப் பாதுகாத்து, அது இயேசுவின் சிலுவையைக் குறிக்கிறது என்பதை அடிக்குறிப்பில் தெளிவுபடுத்துதல்
  alternative: முதன்மை உரையிலேயே ‘இயேசுவின் சிலுவை’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: கதைச்சூழலில் குறிப்பு இயேசுவையே சுட்டுகிறது. ஆனாலும் மூலத்தின் பிரதிப்பெயரை மாற்றாமல் வைத்திருப்பது அதன் வடிவத்தையும் சாத்தியமான கணநேரத் தெளிவின்மையையும் காக்கிறது; அடிக்குறிப்பு வாசகருக்கு குறிப்பை விளக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமக் கதையுரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘போய்க்கொண்டிருந்தபோது’ பங்கேற்புவினையின் ஒரேநேரச் செயலைக் காக்கிறது; ‘இவரை’ கிரேக்கச் சுட்டுப்பெயரை இயல்பாகப் பிரதிபலிக்கிறது.
