revisions:
- from: அவர்கள் வெளியே போய்க்கொண்டிருந்தபோது, சிரேனே ஊரைச் சேர்ந்த சீமோன் என்ற ஒரு மனிதரைக் கண்டார்கள். அவருடைய சிலுவையைச் சுமக்க இவரைக் கட்டாயப்படுத்தினர்[a][b].
  to: அவர்கள் வெளியே சென்றுகொண்டிருந்தபோது, சிரேனே நகரைச் சேர்ந்த சீமோன் என்ற ஒரு மனிதரைக் கண்டார்கள். இயேசுவின் சிலுவையைச் சுமக்கச் சீமோனைக் கட்டாயப்படுத்தினர்[a].
  rationale: The revision removes a consequential Tamil antecedent ambiguity by identifying Jesus as the possessor of the cross, as the narrative context requires. It retains the source's meaning, coercive force, and concise narrative style. The redundant referent footnote is removed, while the lexical note on compulsory service is retained and anchored directly to the relevant verb.
