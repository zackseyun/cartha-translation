base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/061.yaml
  text: Mary Magdalene and the other Mary were there, sitting opposite the tomb.
translation:
  language: ta
  text: மகதலேனா மரியாளும் மற்ற மரியாளும் அங்கே கல்லறைக்கு எதிரே உட்கார்ந்திருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν ... ἐκεῖ
  choice: அங்கே ... இருந்தார்கள்
  rationale: கிரேக்கத்தில் வினை ஒருமையில் இருந்தாலும், பின்னர் குறிப்பிடப்படும் இரு இணை எழுவாய்களின் இருப்பை அறிமுகப்படுத்துகிறது; இயல்பான நவீனத் தமிழில் பன்மை வினை பயன்படுத்தப்படுகிறது.
- source_word: δὲ
  choice: தனி சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ வலுவான எதிர்மறையைக் காட்டாமல் மென்மையான கதைத் தொடர்ச்சியை மட்டும் குறிக்கிறது; தமிழில் வாக்கியத் தொடரால் அது இயல்பாக வெளிப்படுவதால் தேவையற்ற இணைப்புச்சொல் சேர்க்கப்படவில்லை.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: மகதலேனா மரியாள்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவம்; நபரின் அடையாளத்தையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἡ ἄλλη Μαρία
  choice: மற்ற மரியாள்
  rationale: முன்னர் குறிப்பிடப்பட்ட மகதலேனா மரியாளிலிருந்து இம்மரியாளை வேறுபடுத்தும் ἄλλη என்பதன் நேரான, இயல்பான தமிழ் வடிவம்.
- source_word: καθήμεναι
  choice: உட்கார்ந்திருந்தார்கள்
  rationale: அவர்கள் அங்கே தொடர்ந்து அமர்ந்திருந்த நிலையை, இயல்பான தமிழ் இறந்தகாலத் தொடர்நிலை வடிவில் தெரிவிக்கிறது.
- source_word: ἀπέναντι τοῦ τάφου
  choice: கல்லறைக்கு எதிரே
  rationale: கல்லறையின் எதிர்ப்புறத்தில் அல்லது அதை நோக்கிய நிலையில் இருந்த இடவமைப்பைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: τάφος
  choice: கல்லறை
  rationale: இவ்வடக்கச் சூழலில் τάφος என்பதற்கான பொதுவான, தெளிவான நவீனத் தமிழ் சொல்.
