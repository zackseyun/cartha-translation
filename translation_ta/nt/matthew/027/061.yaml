  naturalness: “மகதலேனா மரியாளும் மற்ற மரியாளும் அங்கே கல்லறைக்கு எதிரே உட்கார்ந்திருந்தார்கள்” என்பது நவீன நிலையான தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது. “உட்கார்ந்திருந்தார்கள்” தொடர்நிலையையும் சரியாக வெளிப்படுத்துகிறது.
