translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. பெயர்களுக்கு வழக்கமான தமிழ் வேதாகம வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; தேவையற்ற உரையாடல் அல்லது பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
