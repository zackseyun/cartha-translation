id: MAT.27.62
reference: Matthew 27:62
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπαύριον, ἥτις ἐστὶν μετὰ τὴν παρασκευήν, συνήχθησαν οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι πρὸς Πιλᾶτον
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/062.yaml
  text: On the next day[a], which is after the day of Preparation, the chief priests and the Pharisees gathered before Pilate
translation:
  language: ta
  text: மறுநாளில்[a], அதாவது ஆயத்த நாளுக்கு அடுத்த நாளில், தலைமை ஆசாரியர்களும் பரிசேயர்களும் பிலாத்துவிடம் கூடிவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆயத்தத்துக்கு அடுத்த நாளில்.” இதற்கான கிரேக்கச் சொல் ஓய்வுநாளுக்கு முந்திய ஆயத்த நாளைக் குறிக்கலாம்; அதை “வெள்ளிக்கிழமை” என்று மொழிபெயர்ப்பது மூலவாக்கியம் தெரிவிப்பதைவிட அதிக விளக்கமாக இருக்கும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: மறுநாளில்
  rationale: இந்தச் சொற்றொடர் கால முன்னேற்றத்தைக் குறிக்கிறது. δέ-யின் மெலிதான இணைப்புப் பொருளைத் தமிழில் தேவையற்ற தனிச் சொல்லால் மிகைப்படுத்தாமல், இயல்பான தொடராக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἥτις ἐστὶν μετὰ τὴν παρασκευήν
  choice: அதாவது ஆயத்த நாளுக்கு அடுத்த நாளில்
  rationale: ἥτις இங்கு முந்திய காலக் குறிப்பை விளக்கும் உறவுத் தொடராக வருகிறது. ‘அதாவது’ அதன் விளக்கத் தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: παρασκευήν
  choice: ஆயத்த நாள்
  rationale: இந்தச் சொல் பொதுவாக ‘ஆயத்தம்’ என்று பொருள்படலாம்; யூதக் காலக்கணக்குச் சூழலில் ஓய்வுநாளுக்கு முந்திய ஆயத்த நாளைக் குறிப்பது வழக்கம். ‘வெள்ளிக்கிழமை’ என்பது மூலத்தைவிட அதிக விளக்கமாகிவிடும்.
- source_word: συνήχθησαν
  choice: கூடிவந்தார்கள்
  rationale: செயப்பாட்டு வடிவம் இங்கு தன்வினைப் பொருளில் ‘ஒன்றுகூடினர்’ எனச் செயல்படுகிறது. ‘கூடிவந்தார்கள்’ என்பது பிலாத்துவிடம் அவர்கள் ஒன்றாக வந்ததையும் இயல்பாக உணர்த்துகிறது.
- source_word: οἱ ἀρχιερεῖς
  choice: தலைமை ஆசாரியர்கள்
  rationale: ஒரே பிரதான ஆசாரியரை அல்லாமல், முன்னணி ஆசாரிய அதிகாரிகளைக் குறிக்கும் பன்மைக்கான தெளிவான வழக்குச் சொல்.
- source_word: οἱ Φαρισαῖοι
  choice: பரிசேயர்கள்
  rationale: இந்த யூதக் குழுவின் பெயருக்கான தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: πρὸς Πιλᾶτον
  choice: பிலாத்துவிடம்
  rationale: ஒருவரை நோக்கிச் செல்லுதல் அல்லது அவர் முன்னிலையில் கூடுதல் ஆகிய பொருள் நிழல்களை πρός கொண்டிருக்கலாம். தமிழில் ‘பிலாத்துவிடம்’ என்பது இரண்டையும் இயல்பாகத் தாங்குகிறது.
- source_word: Πιλᾶτον
  choice: பிலாத்து
  rationale: Πιλᾶτος என்ற பெயருக்கான தமிழில் நிலைபெற்ற வடிவம்.
