    text: “உறங்கிப்போயிருந்த” என்பது “இறந்திருந்த” என்பதைக் குறிக்கும் வழக்கமான உருவகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ μνημεῖα
  choice: கல்லறைகள்
  rationale: இச்சூழலில் μνημεῖα என்பது இறந்தவர்களை அடக்கம் செய்யும் கல்லறைகளைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἀνεῴχθησαν
  choice: திறக்கப்பட்டன
  rationale: இறந்தகாலச் செயப்பாட்டு வடிவத்தை நேரடியாகப் பாதுகாக்கிறது; அவை எவ்வாறு திறந்தன என்ற கூடுதல் விளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: πολλὰ σώματα
  choice: பலருடைய உடல்கள்
  rationale: தமிழில் இயல்பான சொல் வரிசைக்காக அடுத்துள்ள உரிமைத் தொடர்புடன் இணைக்கப்பட்டுள்ளது; σώματα என்பதன் நடுநிலையான பொருளான ‘உடல்கள்’ பாதுகாக்கப்படுகிறது.
- source_word: τῶν κεκοιμημένων
  choice: உறங்கிப்போயிருந்த
  rationale: மரணத்தைக் குறிக்கும் கிரேக்க உருவக வழக்கை மொழிபெயர்ப்பிலும் பாதுகாக்கிறது; பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: ἁγίων
  choice: பரிசுத்தவான்கள்
  rationale: கடவுளுக்குரிய பரிசுத்த மக்களைக் குறிக்கும் புதிய ஏற்பாட்டுப் பயன்பாட்டுக்கு ஏற்ற, தமிழ்க் கிறிஸ்தவ வழக்கில் பரவலாக அறியப்பட்ட சொல்.
- source_word: ἠγέρθησαν
  choice: எழுப்பப்பட்டன
  rationale: செயப்பாட்டு வடிவத்தையும் ‘எழுப்புதல்’ என்ற அடிப்படைப் பொருளையும் காக்கிறது; இவ்வசனத்தில் மட்டும் உயிர்த்தெழுதலின் துல்லியமான தன்மையைத் தீர்மானித்துச் சொல்லவில்லை.
theological_decisions:
- issue: ἠγέρθησαν குறிக்கும் நிகழ்வின் தன்மை
  choice: எழுப்பப்பட்டன
  alternative: உயிர்த்தெழுந்தன / உயிர்த்தெழுப்பப்பட்டன
  rationale: இந்த வினை மரணத்திலிருந்து எழுப்பப்படுவதைக் குறிக்கக்கூடும். ஆனால் ‘எழுப்பப்பட்டன’ என்பது மூலத்தின் மொழியை நெருக்கமாகக் காத்து, இது தற்காலிக உயிர்ப்பா அல்லது இறுதி உயிர்த்தெழுதலா என்பதை இவ்வசனத்தில் மட்டும் தீர்மானிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் தொடரிணைப்பை தமிழில் இயல்பாகக் காட்ட அரைப்புள்ளி இடப்பட்டுள்ளது. அடிக்குறிப்பு குறி அது விளக்கும் உருவகச் சொல்லுக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
