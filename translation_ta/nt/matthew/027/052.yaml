  text: And the tombs were opened[a], and many bodies of the saints who had fallen asleep were raised,
translation:
  language: ta
  text: கல்லறைகள் திறக்கப்பட்டன; உறங்கிப்போயிருந்த[a] பரிசுத்தவான்கள் பலருடைய உடல்கள் எழுப்பப்பட்டன.
  philosophy: optimal-equivalence
  footnotes:
