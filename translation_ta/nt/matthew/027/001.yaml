id: MAT.27.1
reference: Matthew 27:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Πρωΐας δὲ γενομένης συμβούλιον ἔλαβον πάντες οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ κατὰ τοῦ Ἰησοῦ ὥστε θανατῶσαι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/001.yaml
  text: When morning came[b][a], all the chief priests and the elders of the people took counsel against Jesus so as to put him to death.
translation:
  language: ta
  text: காலை வந்தபோது, தலைமைக் குருக்களும் மக்களின் மூப்பர்களும் அனைவரும் இயேசுவுக்கு எதிராக அவரைக் கொல்லும்படி ஆலோசனை நடத்தினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρωΐας δὲ γενομένης
  choice: காலை வந்தபோது
  rationale: கால மாற்றத்தைக் குறிக்கும் உடைமை வேற்றுமைத் தனிநிலைத் தொடரை இயல்பான நவீனத் தமிழில் தருகிறது. δέ தனியாக மொழிபெயர்க்கப்படாமல் வாக்கிய மாற்றத்தில் மென்மையாக வெளிப்படுகிறது.
- source_word: συμβούλιον ἔλαβον
  choice: ஆலோசனை நடத்தி
  rationale: இந்த மரபுத்தொடரின் கூட்டு ஆலோசனை அல்லது கலந்தாய்வு என்ற பொருளைப் பாதுகாக்கிறது; ‘சதித்திட்டம் தீட்டினார்கள்’ என்று மூலத்தில் உள்ளதைவிடக் கடுமையாக விளக்கவில்லை.
- source_word: πάντες οἱ ἀρχιερεῖς
  choice: தலைமைக் குருக்கள் அனைவரும்
  rationale: πάντες என்பதன் முழுமையைக் குறிப்பாகத் தக்கவைத்து, எருசலேமின் குருத்துவத் தலைவர்களைக் குறிக்கும் வழக்கமான பதவிப் பெயரைத் தெளிவாகத் தருகிறது.
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: மக்களின் மூப்பர்களும்
  rationale: மக்களிடையே அதிகாரப்பூர்வத் தலைமை வகித்த குழுவைக் குறிக்கும் சொல்லை இயல்பான தமிழில் தருகிறது.
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: இயேசுவுக்கு எதிராக
  rationale: இந்தப் பகைமை நிறைந்த சூழலில் κατά என்பதற்குள்ள எதிர்ப்புப் பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ὥστε θανατῶσαι αὐτόν
  choice: அவரைக் கொன்றுபோடும் நோக்கில் செயல்பட்டார்கள்
  rationale: இயேசுவின் மரணத்தை ஏற்படுத்துவதே ஆலோசனையின் நோக்கம் என்பதை வெளிப்படுத்துகிறது; குறிப்பிட்ட சட்ட நடைமுறையை மூலத்தைவிட அதிகமாக வரையறுக்கவில்லை.
theological_decisions:
- issue: இயேசுவுக்கு எதிரான தலைவர்களின் நடவடிக்கையின் தன்மை
  choice: அவருக்கு எதிரான கூட்டு ஆலோசனையாகவும் அவரைக் கொன்றுபோடுவதை நோக்கமாகக் கொண்ட செயலாகவும் மொழிபெயர்த்தல்
  alternative: ‘இயேசுவைப் பற்றி ஆலோசித்தார்கள்’ என்று நடுநிலையாகவோ, ‘இயேசுவுக்கு எதிராகச் சதித்திட்டம் தீட்டினார்கள்’ என்று வலுப்படுத்தியோ மொழிபெயர்த்தல்
  rationale: κατά பகைமை அல்லது எதிர்ப்பையும், ὥστε θανατῶσαι உயிரைப் போக்கும் நோக்கையும் காட்டுகின்றன. அதேவேளையில், ‘சதி’ என்ற கூடுதல் கருத்தைச் சேர்க்காமல் மூலத்தின் தீவிரத்தையும் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் நீதித்துறைச் சூழலுக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘தலைமைக் குருக்கள்’, ‘மூப்பர்கள்’, ‘ஆலோசனை நடத்தி’ ஆகிய சொற்கள் தெளிவையும் முறையான தொனியையும் இணைக்கின்றன.
