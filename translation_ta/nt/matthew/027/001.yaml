revisions:
- from: காலை வந்தபோது, தலைமைக் குருக்கள் அனைவரும் மக்களின் மூப்பர்களும் இயேசுவுக்கு எதிராக ஆலோசனை நடத்தி, அவரைக் கொன்றுபோடும் நோக்கில் செயல்பட்டார்கள்.
  to: காலை வந்தபோது, தலைமைக் குருக்களும் மக்களின் மூப்பர்களும் அனைவரும் இயேசுவுக்கு எதிராக அவரைக் கொல்லும்படி ஆலோசனை நடத்தினார்கள்.
  rationale: The revision retains every source element while making the deliberation, rather than an added unspecified action, the main verb. It also places “அனைவரும்” after both leadership groups to reflect the scope of πάντες clearly. “அவரைக் கொல்லும்படி” expresses the purpose conveyed by ὥστε θανατῶσαι without importing a more specific judicial procedure or conspiratorial nuance.
