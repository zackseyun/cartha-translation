source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς ⸀ἐστάθη ἔμπροσθεν τοῦ ἡγεμόνος· καὶ ἐπηρώτησεν αὐτὸν ὁ ἡγεμὼν λέγων· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ Ἰησοῦς ⸀ἔφη· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/011.yaml
  text: Jesus stood before the governor[a], and the governor questioned him, saying, “Are you the King of the Jews?” And Jesus said[b], “You say so.”
translation:
  language: ta
  text: இயேசுவோ ஆளுநருக்கு முன்பாக நின்றார். ஆளுநர் அவரிடம், “நீ யூதர்களின்[a] அரசனா?” என்று கேட்டார். அதற்கு இயேசு, “நீரே அப்படிச் சொல்கிறீர்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதேயர்களின்.” இக்கிரேக்கச் சொல் பொதுவாக யூதர்களையும், சில சூழல்களில் குறிப்பாக யூதேயர்களையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நீர் சொல்கிறீர்,” அல்லது “நீர் சொல்வதுபோல்தான்.” கிரேக்கத்தில் இயேசுவின் பதில் சுருக்கமாகவும் ஓரளவு தெளிவற்றதாகவும் உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐστάθη
  choice: நின்றார்
  rationale: இங்கு இறந்தகால வடிவம் இயல்பாக ‘நின்றார்’ என்று பொருள்படும்; ‘நிற்க வைக்கப்பட்டார்’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத காரணத்தைச் சேர்க்கும்.
- source_word: ἔμπροσθεν τοῦ ἡγεμόνος
  choice: ஆளுநருக்கு முன்பாக
  rationale: நீதிவிசாரணைச் சூழலையும் இடத்தொடர்பையும் சுருக்கமாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: ἡγεμών
  choice: ஆளுநர்
  rationale: ரோம அரசின் அதிகாரியைக் குறிக்கும் தெளிவான, பொதுவாகப் புரியும் சொல்; ‘முன்னாளர்’ அல்லது மிகத் தொழில்நுட்பமான பதவிப்பெயர் இங்கு பொருத்தமல்ல.
- source_word: ἐπηρώτησεν
  choice: கேட்டார்
  rationale: கேள்வி எழுப்பிய செயலை இயல்பான நவீன தமிழில் தருகிறது; ‘விசாரித்தார்’ என்பது தனியே விசாரணை நடத்தியதாக அதிகப்படியான பொருளைத் தரக்கூடும்.
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: யூதர்களின் அரசன்
  rationale: ரோமரின் அரசியல் குற்றச்சாட்டுச் சூழலில் மக்களினத்தின் அரசர் என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: ἔφη
  choice: என்றார்
  rationale: இயேசுவின் பதிலை அறிமுகப்படுத்தும் எளிய, நேரான தமிழ் வடிவம்.
- source_word: Σὺ λέγεις
  choice: நீரே அப்படிச் சொல்கிறீர்
  rationale: கிரேக்கத்தின் சுருக்கமான, மறைமுகமான பதிலைத் தமிழில் இயல்பாகத் தருகிறது; அதை முழுமையான நேரடி ஒப்புதலாகவோ மறுப்பாகவோ மாற்றவில்லை.
theological_decisions:
- issue: Σὺ λέγεις என்ற இயேசுவின் பதிலின் நுட்பம்
  choice: “நீரே அப்படிச் சொல்கிறீர்” என்ற கட்டுப்படுத்தப்பட்ட, மறைமுகப் பதில்
  alternative: “நீர் சொல்வது சரிதான்” என்ற நேரடியான உறுதிப்படுத்தல்
  rationale: மூல கிரேக்கம் குற்றச்சாட்டை வெளிப்படையாக மறுப்பதில்லை; அதேவேளையில் ஆளுநரின் அரசியல் வடிவமைப்பில் அதைத் தெளிவான ஒப்புதலாகவும் கூறுவதில்லை. ஆகவே அந்த இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. δέ என்பதன் உரையாடல்/மாற்றத் தொடர்பு முதல் இடத்தில் ‘இயேசுவோ’ எனக் காட்டப்பட்டுள்ளது; மூலத்தில் இல்லாத காலக் குறிப்பு சேர்க்கப்படவில்லை. ஆளுநர் இயேசுவிடம் பேசும்போது இயல்பான ஒருமை ‘நீ’ பயன்படுத்தப்பட்டுள்ளது; இயேசு அதிகாரியிடம் பேசும்போது கண்ணியமான ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது.
