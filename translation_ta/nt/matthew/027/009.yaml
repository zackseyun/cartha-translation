- source_word: τὸ ῥηθὲν διὰ Ἰερεμίου τοῦ προφήτου
  choice: இறைவாக்கினர் எரேமியா வழியாகச் சொல்லப்பட்டது
  rationale: διά என்பதன் இடையீட்டு முகமைப் பொருளை ‘வழியாக’ என்பதன் மூலம் காத்து, முன்பு உரைக்கப்பட்ட இறைவாக்கைக் குறிக்கிறது.
- source_word: τὰ τριάκοντα ἀργύρια
  choice: முப்பது வெள்ளிக்காசுகள்
  rationale: ἀργύρια இங்கு வெள்ளியாலான பணத்துண்டுகள் அல்லது நாணயங்களைக் குறிக்கிறது; ‘வெள்ளிக்காசுகள்’ நவீன வாசகருக்குத் தெளிவானது.
- source_word: τὴν τιμὴν τοῦ τετιμημένου ὃν ἐτιμήσαντο
  choice: யாருக்கு விலை நிர்ணயித்தார்களோ, விலை நிர்ணயிக்கப்பட்ட அந்த ஒருவரின் விலை
  rationale: τιμάω என்ற ஒரே வேர்ச்சொல்லின் இருமுறை பயன்பாட்டையும் அதன் வணிகச் சூழலையும் ‘விலை நிர்ணயித்தல்’ என்ற மீளுரைப்பால் காக்கிறது.
- source_word: ἀπὸ υἱῶν Ἰσραήλ
  choice: இஸ்ரவேல் மக்களில் சிலர்
  rationale: கடினமான ἀπό தொடரைச் சாத்தியமான பகுதிப்பொருளில் இயல்பான தமிழாக வழங்குகிறது; ‘மக்கள்’ என்பது இங்கு குழுவைக் குறிக்கும் உள்ளடக்கமான நவீன தமிழ்.
theological_decisions:
- issue: சகரியா 11:12–13-ஐ மிக நெருக்கமாக ஒத்த சொற்கள் எரேமியாவுக்குச் சேர்த்துக் கூறப்படுதல்
  choice: முதன்மை உரையில் ‘இறைவாக்கினர் எரேமியா’ என்பதை மாற்றமின்றி வைத்தல்
  alternative: ‘சகரியா’ என்று திருத்துதல், அல்லது இறைவாக்கினரின் பெயரைப் பொதுமைப்படுத்துதல்
  rationale: SBLGNT உரை எரேமியாவைத் தெளிவாகக் குறிப்பிடுகிறது. மேற்கோளின் மூலத்தைப் பற்றிய வரலாற்று மற்றும் உரைநிலைச் சிக்கலை மொழிபெயர்ப்பு அமைதியாகத் தீர்க்கக்கூடாது.
- issue: ἀπὸ υἱῶν Ἰσραήλ என்ற கடினமான தொடரின் தொடர்பு
  choice: ‘இஸ்ரவேல் மக்களில் சிலர்’ என்ற பகுதிப்பொருள் வாசிப்பு
  alternative: ‘இஸ்ரவேல் மக்களிடமிருந்து’ அல்லது ‘இஸ்ரவேல் மக்களால்’
  rationale: கிரேக்கத் தொடர் இலக்கண ரீதியாகக் கடினமானது. தேர்ந்தெடுக்கப்பட்ட வாசிப்பு வாக்கியத்தைத் தமிழில் புரியத்தக்கதாக ஆக்குகிறது; மாற்று சாத்தியம் அடிக்குறிப்பில் வெளிப்படையாகக் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இறைவாக்கினர்’ தீர்க்கதரிசியின் பணியை இயல்பாகக் குறிக்கிறது. மேற்கோளில் உள்ள விலை நிர்ணயித்தல் பற்றிய நோக்கமுள்ள சொல் மீளுரையும், மூலத்தின் இலக்கணச் சிக்கலும் தேவையின்றி மென்மைப்படுத்தப்படவில்லை.
