source:
  edition: SBLGNT
  text: τότε ἐπληρώθη τὸ ῥηθὲν διὰ Ἰερεμίου τοῦ προφήτου λέγοντος· Καὶ ἔλαβον τὰ τριάκοντα ἀργύρια, τὴν τιμὴν τοῦ τετιμημένου ὃν ἐτιμήσαντο ἀπὸ υἱῶν Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/009.yaml
  text: Then what was spoken through Jeremiah the prophet was fulfilled[a], saying, ‘And they took the thirty pieces of silver, the price of the one who had been valued[b], whom they valued from among the sons of Israel,’
translation:
  language: ta
  text: 'அப்போது, இறைவாக்கினர் எரேமியா வழியாகச் சொல்லப்பட்டது நிறைவேறியது[a]: “இஸ்ரவேல் மக்களில் சிலர்[b] யாருக்கு விலை நிர்ணயித்தார்களோ, விலை நிர்ணயிக்கப்பட்ட அந்த ஒருவரின் விலையான முப்பது வெள்ளிக்காசுகளை அவர்கள் எடுத்தார்கள்,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மத்தேயு இந்த இறைவாக்கை எரேமியாவுக்குச் சேர்த்துக் கூறுகிறார். இதன் சொற்கள் சகரியா 11:12–13-ஐ மிக நெருக்கமாக ஒத்திருக்கின்றன. இது பல இறைவாக்குப் பகுதிகளை இணைத்த மேற்கோளா, எரேமியாவின் பெயரில் அறியப்பட்ட இறைவாக்குத் தொகுப்பைக் குறிக்கிறதா, அல்லது உரை பரவலில் ஏற்பட்ட சிக்கலா என்பதில் விளக்கவுரையாளர்கள் வேறுபடுகின்றனர்.
    reason: textual_variant
  - marker: b
    text: அல்லது, ‘இஸ்ரவேல் மக்களிடமிருந்து.’ இங்குள்ள கிரேக்கத் தொடர் கடினமானது; ‘இஸ்ரவேல் மக்களில் சிலர்’ என்பது அதற்குச் சாத்தியமான பகுதிப்பொருள் வாசிப்பு.
    reason: lexical_alternative
