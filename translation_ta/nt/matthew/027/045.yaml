source:
  edition: SBLGNT
  text: Ἀπὸ δὲ ἕκτης ὥρας σκότος ἐγένετο ἐπὶ πᾶσαν τὴν γῆν ἕως ὥρας ἐνάτης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/045.yaml
  text: From the sixth hour darkness came over all the land until the ninth hour[a][b].
translation:
  language: ta
  text: ஆறாம் மணியிலிருந்து ஒன்பதாம் மணி வரை நாடு முழுவதும் இருள் சூழ்ந்தது.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஆறாம் மணி என்பது ஏறத்தாழ நண்பகல் பன்னிரண்டு மணி; ஒன்பதாம் மணி என்பது ஏறத்தாழ பிற்பகல் மூன்று மணி.
    reason: cultural_note
  - marker: b
    text: அல்லது, “பூமி முழுவதும்.” கிரேக்கச் சொல் “நாடு” அல்லது “பூமி” ஆகிய இரண்டில் எதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ
  choice: …இலிருந்து
  rationale: ἀπό தொடக்க நேரத்தைக் குறிக்கிறது. δέ மென்மையான இணைப்புச்சொல் என்பதால், தமிழில் தேவையற்ற வலுவான மாறுபாட்டைச் சேர்க்காமல் வாக்கிய ஓட்டத்திலேயே அதன் பணி வெளிப்படுகிறது.
- source_word: ἕκτης ὥρας
  choice: ஆறாம் மணி நேரம்
  rationale: மூலத்தின் பண்டைய நேரக் கணக்கீட்டு முறையை முதன்மை உரையில் பாதுகாக்கிறது; இன்றைய நேரத்துக்கு ஏறத்தாழ இணையானது அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: σκότος
  choice: இருள்
  rationale: சொல்லின் நேரடியான, இயல்பான பொருளைத் தெளிவாகவும் நிகழ்வின் தீவிரத்தைக் குறைக்காமலும் தருகிறது.
- source_word: ἐγένετο
  choice: சூழ்ந்தது
  rationale: இருள் தோன்றி ஒரு பரப்பை மூடியதைக் குறிக்கும் இயல்பான தமிழாக்கம்; நிலை தொடங்கியதையும் வெளிப்படுத்துகிறது.
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: நாடெங்கும்
  rationale: γῆ என்பதற்கு ‘நாடு/நிலம்’ என்றும் ‘பூமி’ என்றும் பொருள் வரலாம். இங்கு உடனடி கதைச் சூழலைக் கருத்தில் கொண்டு ‘நாடெங்கும்’ எனத் தரப்படுகிறது; பரந்த மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἕως ὥρας ἐνάτης
  choice: ஒன்பதாம் மணி நேரம் வரை
  rationale: மூலத்தின் நேரக் குறிப்பை முதன்மை உரையில் பாதுகாக்கிறது; அதன் இன்றைய தோராயமான நேரம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: இருள் சூழ்ந்த பரப்பைக் குறிக்கும் γῆ என்பதன் வீச்சு
  choice: நாடு
  alternative: பூமி
  rationale: γῆ என்ற கிரேக்கச் சொல் இரு பொருள்களையும் ஏற்கிறது. ‘நாடு’ என்பது உடனடி நிகழ்விடச் சூழலைக் காக்கிறது; ‘பூமி’ என்ற அண்டளாவிய வாசிப்பும் சாத்தியமாதலால் அதை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கிறோம்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பண்டைய நேரக் குறிப்புகள் முதன்மை உரையில் வைக்கப்பட்டு, அவற்றின் இன்றைய தோராயமான நேரங்கள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளன. γῆ என்பதன் உண்மையான சொற்பொருள் தெளிவின்மை தீர்த்துவிடப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
