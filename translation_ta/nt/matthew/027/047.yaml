source:
  edition: SBLGNT
  text: τινὲς δὲ τῶν ἐκεῖ ⸀ἑστηκότων ἀκούσαντες ἔλεγον ὅτι Ἠλίαν φωνεῖ οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/047.yaml
  text: But some of those standing there[a], when they heard it, were saying[b], “This man is calling Elijah.”
translation:
  language: ta
  text: ஆனால் அங்கே நின்றுகொண்டிருந்தவர்களில் சிலர் அதைக் கேட்டதும்[a], “இந்த மனிதன்[b] எலியாவைக் கூப்பிடுகிறான்” என்று சொல்லிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: முந்தைய வசனத்தில் இயேசு எழுப்பிய கூக்குரலை, எலியாவை அழைக்கும் கூக்குரலாக அங்கே நின்றவர்கள் புரிந்துகொண்டிருக்கலாம்.
    reason: cross_reference
  - marker: b
    text: 'இன்னும் சொற்சொல்லான மொழிபெயர்ப்பு: “இவர்” அல்லது “இவன்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ τῶν ἐκεῖ ἑστηκότων
  choice: ஆனால் அங்கே நின்றுகொண்டிருந்தவர்களில் சிலர்
  rationale: τινὲς என்பதன் குறிப்பிடப்படாத ஒரு பகுதியைக் ‘சிலர்’ இயல்பாகத் தெரிவிக்கிறது; δὲ இங்குள்ள மென்மையான எதிர்மாற்றத்தை ‘ஆனால்’ காட்டுகிறது; ἑστηκότων என்பதிலுள்ள நிற்கும் நிலையும் தக்கவைக்கப்படுகிறது.
- source_word: ἀκούσαντες
  choice: அதைக் கேட்டதும்
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த செயலை இறந்தகாலப் பங்கேற்பு காட்டுகிறது. சூழலில் மறைந்துள்ள செயப்படுபொருள் இயேசுவின் முந்தைய கூக்குரல் என்பதால் ‘அதை’ சேர்க்கப்படுகிறது.
- source_word: ἔλεγον
  choice: சொல்லிக்கொண்டிருந்தார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வடிவத்தின் தொடர்ச்சியான அல்லது நீடித்த கூறை, மீண்டும் மீண்டும் சொன்னார்கள் என்று மிகைப்படுத்தாமல் வெளிப்படுத்துகிறது.
- source_word: Ἠλίαν φωνεῖ
  choice: எலியாவைக் கூப்பிடுகிறான்
  rationale: தனிநபரை நோக்கிய φωνεῖ என்பதற்கு ‘கூப்பிடுகிறான்’ இயல்பான தமிழாகவும், ‘உதவிக்கு அழைக்கிறான்’ போன்ற கூடுதல் விளக்கத்தைப் புகுத்தாததாகவும் உள்ளது.
- source_word: οὗτος
  choice: இந்த மனிதன்
  rationale: சுட்டுப்பெயரின் சுட்டும் வலிமையை இயல்பான தமிழில் காக்கிறது; வெறும் ‘அவன்’ என்று தட்டையாக்கவில்லை.
theological_decisions:
- issue: இயேசு உண்மையில் எலியாவைக் கூப்பிட்டார் என்று மொழிபெயர்ப்பு உறுதிப்படுத்த வேண்டுமா, அல்லது அங்கிருந்தவர்கள் அவ்வாறு புரிந்துகொண்டதாக மட்டும் தெரிவிக்க வேண்டுமா?
  choice: 'அங்கிருந்தவர்களின் கூற்றாக மட்டும் நேரடிப் பேச்சில் வழங்கப்பட்டது: ‘இந்த மனிதன் எலியாவைக் கூப்பிடுகிறான்.’'
  alternative: ‘இவர் எலியாவிடம் உதவி கேட்கிறார்’ அல்லது ‘அவர்கள் இயேசுவின் கூக்குரலைத் தவறாகப் புரிந்துகொண்டார்கள்.’
  rationale: கிரேக்க உரை அங்கிருந்தவர்கள் கூறியதைப் பதிவு செய்கிறது; அவர்களின் புரிதலைக் கதையாசிரியரின் உறுதிப்படுத்தலாக மாற்றவில்லை. தவறான புரிதலுக்கான வாய்ப்பை அடிக்குறிப்பு விளக்குகிறது; முதன்மை உரை அதைத் தீர்மானமாக அறிவிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘நின்றுகொண்டிருந்தவர்கள்’ காட்சியின் உடல் நிலையைப் பாதுகாக்கிறது; ‘சொல்லிக்கொண்டிருந்தார்கள்’ ἔλεγον என்பதன் முற்றுப்பெறாத கூறை வெளிப்படுத்துகிறது. ‘இந்த மனிதன்’ இயல்பான சுட்டுச் சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது; ‘இவன்’ தரக்குறைவாக ஒலிக்கக்கூடியதால் மாற்றாக அடிக்குறிப்பில் மட்டும் தரப்பட்டுள்ளது.
