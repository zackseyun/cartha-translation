source:
  edition: SBLGNT
  text: καὶ ῥίψας τὰ ἀργύρια ⸂εἰς τὸν ναὸν⸃ ἀνεχώρησεν, καὶ ἀπελθὼν ἀπήγξατο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/005.yaml
  text: And throwing the silver into the temple[a], he departed[b], and went and hanged himself.
translation:
  language: ta
  text: அவன் அந்த வெள்ளிக்காசுகளை ஆலயத்துக்குள்[a] எறிந்துவிட்டு, புறப்பட்டான்; போய்த் தூக்குப்போட்டுக்கொண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆலயத்தின் பரிசுத்த இடத்துக்குள்.’ இங்குள்ள கிரேக்கச் சொல் (ναός), முழு ஆலய வளாகத்தைக் காட்டிலும் ஆலயத்தின் உட்புறப் பரிசுத்த இடத்தைக் குறிப்பாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίψας
  choice: எறிந்துவிட்டு
  rationale: இறந்தகால வினையெச்சம் முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைக் காட்டுகிறது; ‘எறிந்துவிட்டு’ என்பது செயல்வரிசையை இயல்பான தமிழில் தெளிவாகத் தருகிறது.
- source_word: τὰ ἀργύρια
  choice: அந்த வெள்ளிக்காசுகளை
  rationale: சொல்லடிப்படையில் ‘வெள்ளி’ என்றாலும், சூழலில் இது யூதாஸ் திருப்பிக்கொடுத்த வெள்ளிக்காசுகளைக் குறிக்கிறது. தமிழில் ‘வெள்ளிக்காசுகள்’ பொருளை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: εἰς τὸν ναόν
  choice: ஆலயத்துக்குள்[a]
  rationale: ναός பொதுவாக முழு ஆலய வளாகத்தைக் காட்டிலும் ஆலயத்தின் உட்புறப் பரிசுத்த இடத்தைக் குறிக்கக்கூடும். வாசிப்பின் இயல்புக்காகப் பொதுவான சொல் முதன்மை உரையில் வைக்கப்பட்டு, குறிப்பான நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀνεχώρησεν
  choice: அங்கிருந்து புறப்பட்டான்
  rationale: வினை ‘புறப்படுதல்’ அல்லது ‘அகன்றுசெல்லுதல்’ எனப் பொருள்படும். சூழல் தெளிவுக்காகத் தமிழில் இயல்பான ‘அங்கிருந்து புறப்பட்டான்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἀπελθών
  choice: பின்பு போய்
  rationale: ἀνεχώρησεν என்பதற்குப் பின் வரும் இரண்டாவது நகர்வுச் சொல்லை முற்றிலும் நீக்காமல், தொடர்ச்சியான இயக்கத்தை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἀπήγξατο
  choice: தூக்குப்போட்டுக்கொண்டான்
  rationale: இடை வினை வடிவம் தன்னையே நோக்கிய செயலைக் காட்டுகிறது; இச்சூழலில் தூக்கிட்டு தற்கொலை செய்துகொண்டதையே இச்சொல் தெளிவாகக் குறிக்கிறது.
theological_decisions:
- issue: ναός என்பது முழு ஆலயத்தையா அல்லது ஆலயத்தின் உட்புறப் பரிசுத்த இடத்தையா குறிக்கிறது
  choice: முதன்மை உரையில் ‘ஆலயத்துக்குள்’ என்று வைத்து, உட்புறப் பரிசுத்த இடம் என்ற குறிப்பான பொருளை அடிக்குறிப்பில் தெரிவித்தல்
  alternative: ‘ஆலயத்தின் பரிசுத்த இடத்துக்குள்’
  rationale: கிரேக்கச் சொல் குறிப்பான கட்டடப்பகுதியைக் குறிக்கக்கூடியது; ஆனால் முதன்மை உரையில் மிகையாக விளக்காமல் அதன் உண்மையான பொருள் நுணுக்கத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியக்கூடிய ஆனால் கண்ணியமான விவரிப்பு நடை பயன்படுத்தப்பட்டுள்ளது. ‘புறப்பட்டான்; பின்பு போய்’ என்பது மூலத்தில் உள்ள இரண்டு நகர்வு வடிவங்களையும் தமிழில் இயன்றவரை காக்கிறது.
