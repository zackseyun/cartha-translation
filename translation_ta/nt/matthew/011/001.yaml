id: MAT.11.1
reference: Matthew 11:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς διατάσσων τοῖς δώδεκα μαθηταῖς αὐτοῦ, μετέβη ἐκεῖθεν τοῦ διδάσκειν καὶ κηρύσσειν ἐν ταῖς πόλεσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/001.yaml
  text: And when Jesus had finished instructing his twelve disciples[b][a], he went on from there to teach and preach in their cities.
translation:
  language: ta
  text: இயேசு தமது பன்னிரண்டு சீடர்களுக்கு அறிவுறுத்தி[a] முடித்தபின், அங்கிருந்து புறப்பட்டு அவர்களுடைய நகரங்களில்[b] போதிக்கவும் பிரசங்கிக்கவும் சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அறிவுறுத்தி’ என்பதற்குப் பதிலாக ‘கட்டளையிட்டு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அவர்களுடைய நகரங்கள்’ என்ற கிரேக்கச் சொற்றொடர் யாருடைய நகரங்கள் என்பதைத் தெளிவுபடுத்தவில்லை; அது சீடர்களுடைய நகரங்களையோ, பொதுவாக அப்பகுதி மக்களின் நகரங்களையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: …முடித்தபின்
  rationale: மத்தேயுவின் செமித்தியத் தன்மையுள்ள கதைத் தொடர்புச் சூத்திரத்தைத் தமிழில் இயல்பான காலத் தொடராக வெளிப்படுத்துகிறது; தனியே ‘அப்போது நிகழ்ந்ததாவது’ என்று மொழிபெயர்ப்பதால் ஏற்படும் செயற்கைத்தன்மையைத் தவிர்க்கிறது.
- source_word: ἐτέλεσεν
  choice: முடித்தபின்
  rationale: அடுத்த முதன்மைச் செயலுக்கு முன் அறிவுறுத்தல் நிறைவடைந்ததைத் தெளிவாகக் காட்டுகிறது.
- source_word: διατάσσων
  choice: அறிவுறுத்தி
  rationale: பன்னிருவருக்கு அதிகாரத்துடன் வழிமுறைகள் வழங்கிய பொருளைச் சூழலுக்கு ஏற்ற இயல்பான தமிழில் தருகிறது; ‘கட்டளையிட்டு’ என்பதும் சாத்தியமான வலுவான மாற்று என்பதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: τοῖς δώδεκα μαθηταῖς αὐτοῦ
  choice: தமது பன்னிரண்டு சீடர்களுக்கு
  rationale: நற்செய்தி நூல்களின் சூழலில் μαθηταί என்பதற்கான நிலைபெற்ற தமிழ்ச் சொல் ‘சீடர்கள்’; αὐτοῦ இயேசுவையே சுட்டுவதால் ‘தமது’ இயல்பாக உள்ளது.
- source_word: μετέβη ἐκεῖθεν
  choice: அங்கிருந்து புறப்பட்டு … சென்றார்
  rationale: ஒரு இடத்திலிருந்து வேறிடத்திற்குச் சென்ற இயக்கத்தையும் கதைத் தொடர்ச்சியையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τοῦ διδάσκειν καὶ κηρύσσειν
  choice: போதிக்கவும் பிரசங்கிக்கவும்
  rationale: நோக்கத்தைக் குறிக்கும் கிரேக்க infinitive அமைப்பையும், போதித்தல் மற்றும் பொதுவாக அறிவித்தல் ஆகிய இரு தனித்த செயல்களையும் காக்கிறது.
- source_word: ἐν ταῖς πόλεσιν αὐτῶν
  choice: அவர்களுடைய நகரங்களில்
  rationale: αὐτῶν என்பதன் சுட்டுப்பொருளை விளக்கிச் சேர்க்காமல் கிரேக்கத்தின் உண்மையான தெளிவின்மையைத் தக்கவைக்கிறது; πόλις என்பதற்கு நேரடியான ‘நகரம்’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: ἐν ταῖς πόλεσιν αὐτῶν என்பதில் αὐτῶν யாரைக் குறிக்கிறது?
  choice: ‘அவர்களுடைய நகரங்களில்’ என்று தெளிவின்மையைத் தக்கவைத்தல்
  alternative: ‘சீடர்களுடைய நகரங்களில்’ அல்லது ‘அப்பகுதியிலுள்ள நகரங்களில்’ என்று விளக்கிக் கூறுதல்
  rationale: கிரேக்கச் சுட்டுப்பெயர் அதன் முன்னிலையை வெளிப்படையாக அடையாளப்படுத்தவில்லை. ஆகவே சீடர்களையோ, அப்பகுதி மக்களையோ மொழிபெயர்ப்பிலேயே தேர்ந்தெடுப்பது மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்கும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘சீடர்கள்’, ‘போதிக்க’, ‘பிரசங்கிக்க’ ஆகியவை பொதுவாக அறியப்பட்ட வேதாகமச் சொற்களாக இருப்பதுடன் சாதாரண வாசகருக்கும் புரியும். மூலத்தின் அதிகாரத் தொனியும் சுட்டுப்பெயரின் தெளிவின்மையும் அடிக்குறிப்புகளுடன் பாதுகாக்கப்பட்டுள்ளன.
