  text: Δεῦτε πρός με πάντες οἱ κοπιῶντες καὶ πεφορτισμένοι, κἀγὼ ἀναπαύσω ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/028.yaml
  text: Come to me[a], all who labor and are burdened[b], and I will give you rest.
translation:
  language: ta
  text: உழைக்கிறவர்களும் சுமை சுமத்தப்பட்டவர்களுமான நீங்கள் எல்லாரும் என்னிடம் வாருங்கள்; நான் உங்களுக்கு இளைப்பாறுதல் அளிப்பேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் உங்களுக்குப் புத்துணர்வு அளிப்பேன்.” கிரேக்க வினைச்சொல் ஒருவரை இளைப்பாறச் செய்வதையோ புத்துணர்வடையச் செய்வதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεῦτε πρός με
  choice: என்னிடம் வாருங்கள்
  rationale: அழைப்பைக் குறிக்கும் Δεῦτε என்பதையும், ஒருவரை நோக்கிய வருகையைக் குறிக்கும் πρός με என்பதையும் இயல்பான நவீனத் தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: πάντες
  choice: நீங்கள் எல்லாரும்
  rationale: அழைப்பின் அனைவரையும் உள்ளடக்கும் பரப்பைத் தெளிவாகக் காக்கிறது.
- source_word: οἱ κοπιῶντες
  choice: உழைத்துக் களைத்தவர்களாக
  rationale: தொடர்ந்து உழைப்பதையும் அதனால் ஏற்படும் களைப்பையும் கிரேக்கச் சொல்லின் பொருள் வரம்புக்குள் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πεφορτισμένοι
  choice: சுமை சுமத்தப்பட்டவர்களாக
  rationale: நிறைவேற்றப்பட்ட செயப்பாட்டு வினையெச்சம் குறிக்கும்—சுமை ஏற்றப்பட்டதால் அந்த நிலையிலேயே இருப்பதை—பாதுகாக்கிறது.
- source_word: κἀγὼ
  choice: நான்
  rationale: தமிழில் வினைமுற்றுடன் வெளிப்படையான எழுவாயைப் பயன்படுத்தி கிரேக்கத்தில் உள்ள மென்மையான வலியுறுத்தலைக் காக்கிறது; இணைப்பு அரைப்புள்ளியால் இயல்பாகத் தொடர்கிறது.
- source_word: ἀναπαύσω ὑμᾶς
  choice: நான் உங்களுக்கு இளைப்பாறுதல் அளிப்பேன்
  rationale: ஓய்வளித்தல் அல்லது புத்துணர்வளித்தல் என்ற பரந்த பொருள் வரம்பை முற்றிலும் குறுக்காமல், வாக்குறுதியை இயல்பான கண்ணியமான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ἀναπαύσω என்பதில் வாக்களிக்கப்படும் இளைப்பாறுதலின் இயல்பு
  choice: இளைப்பாறுதல் அளிப்பேன்
  alternative: புத்துணர்வு அளிப்பேன்
  rationale: இந்த வசனம் இளைப்பாறுதல் ஆன்மீகமானதா, இறுதிக்காலத்துக்குரியதா, உணர்ச்சிசார் அல்லது உடல்சார் ஓய்வா என்று தனித்துக் குறிப்பிடவில்லை. ஆகவே அதன் பரந்த இறையியல் செறிவைத் திறந்தவாறே வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு விளங்கும், கண்ணியமான அழைப்பு நடை. கிரேக்கத்தின் அழைப்புத் தொனியும் வாக்குறுதியின் பரந்த பொருளும் காக்கப்பட்டுள்ளன.
