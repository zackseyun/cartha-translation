  to: உழைக்கிறவர்களும் சுமை சுமத்தப்பட்டவர்களுமான நீங்கள் எல்லாரும் என்னிடம் வாருங்கள்; நான் உங்களுக்கு இளைப்பாறுதல் அளிப்பேன்.[a]
