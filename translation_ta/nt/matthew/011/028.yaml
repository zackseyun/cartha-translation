review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the invitation, the comprehensive πάντες, the toil of κοπιῶντες, the burdened state of πεφορτισμένοι, and the broad promise of ἀναπαύσω. However, “உழைத்துக் களைத்தவர்களாகவும்” makes being tired an explicit component rather than rendering the participle more directly as those who labor/toil. A more source-close modern rendering is preferable.
  naturalness: The sentence is understandable and dignified, but “உழைத்துக் களைத்தவர்களாகவும் சுமை சுமத்தப்பட்டவர்களாகவும் இருக்கிற நீங்கள் எல்லாரும்” is syntactically heavy and less idiomatic than a direct participial address.
  terminology: “இளைப்பாறுதல் அளிப்பேன்” is a good broad rendering of ἀναπαύσω and avoids narrowing the promised rest. “சுமை சுமத்தப்பட்டவர்கள்” appropriately reflects the passive, resultant-state sense. The alternate “புத்துணர்வு அளிப்பேன்” is acceptable.
  issues:
  - severity: low
    issue: The rendering of οἱ κοπιῶντες adds explicit fatigue.
    rationale: “உழைத்துக் களைத்தவர்கள்” is semantically plausible in context, but κοπιῶντες itself denotes those laboring/toiling. “உழைக்கிறவர்கள்” preserves the active participle without adding a distinct result.
  - severity: low
    issue: The opening nominal construction is cumbersome in modern Tamil.
    rationale: Replacing “...வர்களாகவும் ...வர்களாகவும் இருக்கிற நீங்கள் எல்லாரும்” with a direct coordinated address is clearer while retaining the Greek scope and coordination.
  revised_text: உழைக்கிறவர்களும் சுமை சுமத்தப்பட்டவர்களுமான நீங்கள் எல்லாரும் என்னிடம் வாருங்கள்; நான் உங்களுக்கு இளைப்பாறுதல் அளிப்பேன்.[a]
