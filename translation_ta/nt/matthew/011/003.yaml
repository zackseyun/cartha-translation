id: MAT.11.3
reference: Matthew 11:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶπεν αὐτῷ· Σὺ εἶ ὁ ἐρχόμενος ἢ ἕτερον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/003.yaml
  text: and said to him, “Are you the Coming One, or should we expect another?”
translation:
  language: ta
  text: அவரிடம், “வருகிறவர் நீர்தானா[a]? அல்லது வேறொருவரை நாங்கள் எதிர்பார்க்க வேண்டுமா?” என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வருகிறவர்’ என்பதை ‘வரவிருப்பவர்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத் தொடர், எதிர்பார்க்கப்பட்ட மேசியாவைக் குறிக்கும் பட்டப்பெயராகச் செயல்படக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: அவரிடம் … என்று கேட்டார்கள்
  rationale: εἶπεν என்பது சொற்பட ‘சொன்னார்கள்’ என்றாலும், நேரடிக் கேள்வியை அறிமுகப்படுத்தும் இச்சூழலில் ‘என்று கேட்டார்கள்’ என்பது இயல்பான தமிழ். αὐτῷ ‘அவரிடம்’ என வழங்கப்பட்டுள்ளது. பன்மை எழுவாய் முந்தைய வசனத்திலுள்ள யோவானின் சீடர்களைச் சார்ந்தது.
- source_word: Σὺ εἶ
  choice: நீர்தானா
  rationale: வெளிப்படையாக வந்துள்ள σύ தரும் வலியுறுத்தலை ‘தானா’ வெளிப்படுத்துகிறது; இயேசுவிடம் பேசும் சூழலுக்கு ஏற்ற மரியாதை ஒருமையாக ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ὁ ἐρχόμενος
  choice: வருகிறவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பெயரெச்சத்தின் வடிவத்தையும், சூழலில் அதற்குள்ள எதிர்பார்க்கப்பட்ட மேசியாவைக் குறிக்கும் பட்டப்பெயர் சார்ந்த சாத்தியத்தையும் இது காக்கிறது; ‘மேசியா’ என்று வெளிப்படையாகச் சேர்த்து பொருளை முடிவுசெய்யவில்லை.
- source_word: ἢ
  choice: அல்லது
  rationale: மாற்றுக் கேள்வியை அறிமுகப்படுத்தும் இயல்பான பிரிநிலை இணைப்புச்சொல்.
- source_word: ἕτερον
  choice: வேறொருவரை
  rationale: ἕτερον என்பதிலுள்ள ‘மற்றவர்/வேறானவர்’ என்ற பொருளை நபரைக் குறிக்கும் இயல்பான தமிழில் அளிக்கிறது.
- source_word: προσδοκῶμεν
  choice: நாங்கள் எதிர்பார்க்க வேண்டுமா
  rationale: இலக்கண வடிவில் நிகழ்காலமாக இருந்தாலும் இது ஆலோசனைத் தன்மையுள்ள கேள்வி; ‘வேண்டுமா’ அந்தச் செயல்பாட்டை இயல்பான தமிழில் தெரிவிக்கிறது. ‘காத்திருக்க வேண்டுமா’ என்பதைவிட ‘எதிர்பார்க்க’ என்பது எதிர்நோக்குதல் மற்றும் காத்திருத்தல் ஆகிய விரிவான பொருளைத் தக்கவைக்கிறது.
theological_decisions:
- issue: ὁ ἐρχόμενος என்பதன் மேசியாவைக் குறிக்கும் பட்டப்பெயர்த் தன்மை
  choice: முதன்மை உரையில் ‘வருகிறவர்’ என்று மொழிபெயர்த்து, பட்டப்பெயர் சார்ந்த பயன்பாட்டை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘வரவிருப்பவர்’ அல்லது நேரடியாக ‘மேசியா’
  rationale: கிரேக்கத் தொடர் சொற்பட ‘வருகிறவர்/வருபவர்’ என்று பொருள்படும்; சூழலில் அது எதிர்பார்க்கப்பட்ட மேசியாவுக்கான அடையாளத் தொடராகச் செயல்படலாம். ‘மேசியா’ என்று நேரடியாக வழங்குவது மூலத்தில் உள்ள மறைமுகத்தன்மையை நீக்கும்; ஆகவே உரை அந்தத் திறந்த தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘நீர்’ மரியாதை ஒருமையைப் பேணுகிறது; ‘நீர்தானா’ மூலம் σύ என்பதன் வலியுறுத்தல் தெளிவாகிறது. கேள்வியை அறிமுகப்படுத்துவதால் ‘சொன்னார்கள்’ என்பதற்குப் பதிலாக இயல்பான ‘கேட்டார்கள்’ தேர்ந்தெடுக்கப்பட்டது.
