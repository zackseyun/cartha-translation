  text: ἄρατε τὸν ζυγόν μου ἐφ’ ὑμᾶς καὶ μάθετε ἀπ’ ἐμοῦ, ὅτι πραΰς εἰμι καὶ ταπεινὸς τῇ καρδίᾳ, καὶ εὑρήσετε ἀνάπαυσιν ταῖς ψυχαῖς ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/029.yaml
  text: Take my yoke upon you and learn from me[a], because I am gentle and humble in heart, and you will find rest for your souls.
translation:
  language: ta
  text: என் நுகத்தை உங்கள்மேல் ஏற்றிக்கொண்டு, என்னிடமிருந்து கற்றுக்கொள்ளுங்கள்; ஏனெனில் நான் சாந்தமானவனும் இதயத்தில் தாழ்மையுள்ளவனும் ஆவேன்; உங்கள் ஆத்துமாக்களுக்கு இளைப்பாறுதலைக் கண்டடைவீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் உங்கள் ஆத்துமாக்களுக்கு இளைப்பாறுதலைப் பெறுவீர்கள்.”
    reason: εὑρήσετε ἀνάπαυσιν என்பதன் இயல்பான தமிழாக்க மாற்று; முதன்மை வாசகம் ‘கண்டடைவீர்கள்’ மூலம் ‘find’ என்ற வினையின் நுணுக்கத்தைத் தக்கவைக்கிறது.
lexical_decisions:
- source_word: ἄρατε τὸν ζυγόν μου ἐφ’ ὑμᾶς
  choice: என் நுகத்தை உங்கள்மேல் ஏற்றுக்கொண்டு
  rationale: நுகத்தைத் தம்மேல் ஏற்றுக்கொள்ளும் உருவகத்தை இயல்பான தமிழில் காக்கிறது; வெறுமனே ‘தூக்குங்கள்’ என்ற பொருளாகக் குறுக்கவில்லை.
- source_word: μάθετε ἀπ’ ἐμοῦ
  choice: என்னிடமிருந்து கற்றுக்கொள்ளுங்கள்
  rationale: இயேசுவிடமிருந்து போதனையும் சீடத்துவமும் பெறும் கருத்தை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: இயேசுவிடமிருந்து ஏன் கற்றுக்கொள்ள வேண்டும் என்பதற்கான விளக்கக் காரணத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: πραΰς
  choice: சாந்தம்
  rationale: கடுமையற்ற மென்மையையும் அடக்கமான பண்பையும் குறிக்கிறது; பலவீனம் என்ற தேவையற்ற பொருளைத் தவிர்க்கிறது.
- source_word: ταπεινὸς τῇ καρδίᾳ
  choice: இதயத்தில் தாழ்மை உள்ளவன்
  rationale: ταπεινός என்பதையும் τῇ καρδίᾳ குறிக்கும் உள்ளார்ந்த மனப்பாங்கையும் தெளிவாகக் காக்கிறது.
- source_word: εὑρήσετε ἀνάπαυσιν
  choice: இளைப்பாறுதலைக் கண்டடைவீர்கள்
  rationale: எதிர்கால வாக்குறுதியையும் வேதாகமப் பின்னணியுள்ள ‘இளைப்பாறுதல்’ என்ற கருத்தையும் காக்கிறது.
- source_word: ταῖς ψυχαῖς ὑμῶν
  choice: உங்கள் ஆத்துமாக்களுக்கு
  rationale: ψυχή என்பதன் உள்ளார்ந்த உயிர் அல்லது முழு நபர் சார்ந்த பரப்பை பாரம்பரியமாக அறியப்பட்ட தமிழ்ச் சொல்லால் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: πραΰς ... καὶ ταπεινὸς τῇ καρδίᾳ என்பதில் இயேசு தமது பண்பை விவரித்தல்
  choice: நான் சாந்தமும் இதயத்தில் தாழ்மையும் உள்ளவன்
  alternative: நான் கனிவும் உள்ளத்தில் எளிமையும் உள்ளவன்
  rationale: இயேசுவின் தனிப்பட்ட சுயவிவரிப்பையும் அதன் இறையியல் முக்கியத்துவத்தையும் காக்கிறது; சொற்களின் பொருளை எந்தக் குறிப்பிட்ட கோட்பாட்டிற்காகவும் மாற்றவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. மையமான ‘நுகம்’ உருவகம் மொழிபெயர்த்துக் கரைக்கப்படாமல் வைக்கப்பட்டுள்ளது. ‘ஆத்துமா’ என்பது இவ்வசனத்தின் வேதாகம ஒலிப்பையும் ψυχή என்பதன் அகலமான பொருளையும் காக்கத் தேர்ந்தெடுக்கப்பட்டது.
