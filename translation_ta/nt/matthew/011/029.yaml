review_pass:
  verdict: revise
  source_fidelity: The central metaphor, the two imperatives, the causal clause, and the future promise are retained. However, the draft adds the temporal connective “அப்போது” (‘then’), whereas the Greek simply coordinates the promise with καί (‘and’).
  naturalness: “நான் சாந்தமும் இதயத்தில் தாழ்மையும் உள்ளவன்” is grammatically understandable but not idiomatic modern standard Tamil. The coordinated adjectival form “நான் சாந்தமானவனும் இதயத்தில் தாழ்மையுள்ளவனும் ஆவேன்” is clearer and natural. “ஏற்றிக்கொண்டு” is also a smoother form in this imperative construction.
  terminology: “நுகம்” appropriately retains ζυγός and its governing/discipleship metaphor. “சாந்தமானவன்” and “இதயத்தில் தாழ்மையுள்ளவன்” faithfully express πραΰς and ταπεινὸς τῇ καρδίᾳ. “ஆத்துமாக்கள்” is a traditional, intelligible rendering of ψυχαί and suitably preserves the biblical expression without narrowing it to merely emotions.
  issues:
  - severity: medium
    issue: The word “அப்போது” has been added before the final clause.
    rationale: The source reads καὶ εὑρήσετε (‘and you will find’), not a temporal ‘then.’ Removing it avoids introducing a sequence not explicitly stated.
  - severity: medium
    issue: The self-description is awkwardly constructed in Tamil.
    rationale: “சாந்தமும் ... தாழ்மையும் உள்ளவன்” coordinates abstract nouns rather than the Greek adjectives. A coordinated adjectival construction directly represents the source and reads naturally.
