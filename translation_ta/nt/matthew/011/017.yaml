id: MAT.11.17
reference: Matthew 11:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀λέγουσιν· Ηὐλήσαμεν ὑμῖν καὶ οὐκ ὠρχήσασθε· ⸀ἐθρηνήσαμεν καὶ οὐκ ἐκόψασθε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/017.yaml
  text: They say[a], ‘We played the flute for you, and you did not dance; we sang a lament[c][b], and you did not mourn.’
translation:
  language: ta
  text: அவர்கள், ‘உங்களுக்காகக் குழல் ஊதினோம்; நீங்கள் ஆடவில்லை. புலம்பல் பாடினோம்; நீங்கள் மார்பில் அடித்துக்கொள்ளவில்லை[a]’ என்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘துக்கம் அனுசரிக்கவில்லை.’ கிரேக்கச் சொல், துக்கத்தின் அடையாளமாக மார்பில் அடித்துக்கொள்வது போன்ற செய்கையைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: λέγουσιν
  choice: என்கிறார்கள்
  rationale: நிகழ்கால வடிவம் உவமைக் காட்சியில் சிறுவர்களின் சொல்லை உயிரோட்டத்துடன் அறிமுகப்படுத்துகிறது.
- source_word: Ηὐλήσαμεν
  choice: குழல் ஊதினோம்
  rationale: αὐλέω என்பது பொதுவாக இசைப்பதைக் காட்டிலும் குறிப்பாகக் குழல் அல்லது ஊதுகுழல் வாசிப்பதைக் குறிக்கிறது; ‘குழல் ஊதினோம்’ இயல்பான நவீனத் தமிழ்.
- source_word: ὑμῖν
  choice: உங்களுக்காக
  rationale: இசை மற்றவர்களை நோக்கி அவர்களுக்காக இசைக்கப்பட்டது என்பதைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: ὠρχήσασθε
  choice: நீங்கள் ஆடவில்லை
  rationale: நடுவினை வடிவுக்கு இங்கு தனிப்பட்ட தற்சுட்டுப் பொருள் தேவையில்லை; எளிய ‘ஆடவில்லை’ பொருளைத் தெளிவாகக் கொடுக்கிறது.
- source_word: ἐθρηνήσαμεν
  choice: புலம்பல் பாடினோம்
  rationale: θρηνέω இறப்புச் சூழலோடு தொடர்புடைய புலம்பலைக் குறிக்கிறது; ‘பாடினோம்’ என்பது முதல் கூறிலுள்ள இசை நிகழ்த்தலுடன் உள்ள இணைப்பைப் பேணுகிறது.
- source_word: ἐκόψασθε
  choice: மாரடித்து அழவில்லை
  rationale: κόπτω என்பதன் நடுவினை வடிவம் இங்கு துக்கத்தில் தம்மை அடித்துக்கொள்ளும் வழக்கமான செய்கையைக் குறிக்கிறது. ‘மாரடித்து அழுதல்’ தமிழில் புரியக்கூடிய துக்கச் செய்கையாகவும் மூலத்தின் உடல்சார் படிமத்தைப் பேணுவதாகவும் உள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், சிறுவர்களின் நேரடியான குற்றச்சாட்டுக்குரிய எளிமையையும் செய்யுளின் இரு இணையான கூறுகளையும் பேணும் கண்ணியமான நடை. மூலத்தின் குறிப்பான ‘மாரடித்தல்’ படிமம் முதன்மை உரையில் வைக்கப்பட்டு, அதன் விரிவான துக்கப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
