source:
  edition: SBLGNT
  text: Τότε ⸀ἤρξατο ὀνειδίζειν τὰς πόλεις ἐν αἷς ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ, ὅτι οὐ μετενόησαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/020.yaml
  text: Then he began to reproach the cities in which most of his mighty works had been done[a], because they did not repent.
translation:
  language: ta
  text: அப்போது, அவருடைய வல்லமைச் செயல்களில் பெரும்பாலானவை நிகழ்ந்திருந்த நகரங்கள் மனந்திரும்பவில்லை என்பதனால், அவர் அவற்றைக் கண்டிக்கத் தொடங்கினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“வல்லமைச் செயல்கள்” என்பதற்கு “அற்புதங்கள்” அல்லது “வல்ல செயல்கள்” என்றும் மொழிபெயர்க்கலாம் (கிரேக்கம்: dynameis).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: அப்போது
  rationale: அடுத்த நிகழ்வை அறிமுகப்படுத்தும் காலக் குறியீட்டை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἤρξατο ὀνειδίζειν
  choice: கடிந்துகொள்ளத் தொடங்கினார்
  rationale: ἤρξατο என்பதன் தொடக்கநிலைப் பொருளையும், ὀνειδίζειν என்பதிலுள்ள குற்றத்தைச் சுட்டிக் கடிந்துரைக்கும் வலிமையையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: τὰς πόλεις ἐν αἷς
  choice: நகரங்கள் ... நிகழ்ந்திருந்த
  rationale: மூலத்தில் நகரங்களே இலக்கணரீதியாகக் குறிப்பிடப்படுகின்றன; அவற்றின் குடிமக்கள் குறிக்கப்படுகிறார்கள் என்ற மறைபொருளை வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ
  choice: தமது வல்லமைச் செயல்களில் பெரும்பாலானவை நிகழ்ந்திருந்த
  rationale: πλεῖσται என்பதன் ‘பெரும்பாலானவை’ என்ற அளவையும், δυνάμεις என்பதன் வல்லமை சார்ந்த செயல்கள் என்ற பரந்த பொருளையும் பாதுகாக்கிறது; முந்திய நிகழ்வை நிகழ்ந்திருந்த எனக் காட்டுகிறது.
- source_word: ὅτι οὐ μετενόησαν
  choice: மனந்திரும்பாததால்
  rationale: கடிந்துகொண்டதற்கான காரணத்தைத் தெளிவாகக் காட்டி, μετανοέω என்பதன் ஒழுக்க-ஆவிக்குரிய திரும்புதலை வழக்கமான, புரிந்துகொள்ளத்தக்க தமிழில் தருகிறது.
theological_decisions:
- issue: δυνάμεις என்பதைக் அற்புதச் செயல்களின் சூழலில் மொழிபெயர்த்தல்
  choice: வல்லமைச் செயல்கள்
  alternative: அற்புதங்கள்; வல்ல செயல்கள்
  rationale: இயேசுவின் அற்புதமான செயல்களைக் குறிக்கும் சூழலை ஏற்றுக்கொள்ளும் அதேவேளையில், கிரேக்கச் சொல்லிலுள்ள ‘வல்லமை’ என்ற அழுத்தத்தைப் பாதுகாத்து, அதை ‘அற்புதங்கள்’ என்ற சற்றுக் குறுகிய வகைப்பாட்டுக்குள் மட்டும் அடைக்கவில்லை.
- issue: μετενόησαν என்பதன் மொழிபெயர்ப்பு
  choice: மனந்திரும்பவில்லை
  alternative: தங்கள் எண்ணத்தை மாற்றிக்கொள்ளவில்லை; திரும்பவில்லை
  rationale: இயேசுவின் வல்லமைச் செயல்களுக்கு உரிய ஒழுக்க-ஆவிக்குரிய பதிலை அளிக்காததைக் குறிக்கும் சொல்லின் இறையியல் கனத்தை, தனிப்பட்ட சமயப்பிரிவு விளக்கத்தைச் சேர்க்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘நகரங்கள்’ மனந்திரும்பவில்லை என்ற மூலத்தின் உருவகப் பயன்பாடு விளக்கமாக விரிவாக்கப்படாமல் அப்படியே பாதுகாக்கப்பட்டுள்ளது.
