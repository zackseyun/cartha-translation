id: MAT.11.21
reference: Matthew 11:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ἐγένοντο αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/021.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works done among you had taken place in Tyre and Sidon, they would have repented long ago in sackcloth and ashes.
translation:
  language: ta
  text: “கோராசினே, உனக்கு ஐயோ! பெத்சாயிதாவே, உனக்கு ஐயோ! ஏனெனில், உங்களிடையே நிகழ்ந்த வல்ல செயல்கள்[a] தீருவிலும் சீதோனிலும் நிகழ்ந்திருந்தால், அவர்கள் வெகு காலத்திற்கு முன்பே துக்க உடை உடுத்தி, சாம்பல் பூசி, மனந்திரும்பியிருப்பார்கள்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அற்புதங்கள்”; கிரேக்கில், “வல்ல செயல்கள்” அல்லது “வல்லமையின் செயல்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαί σοι
  choice: உனக்கு ஐயோ
  rationale: தீர்ப்பை அறிவிக்கும் எச்சரிக்கையையும் அதனுடன் கலந்த துயரத்தையும் கொண்ட தீர்க்கதரிசனப் பாணியைப் பாதுகாக்கிறது. நகரங்கள் ஒவ்வொன்றும் ஒருமையில் நேரடியாக அழைக்கப்படுவதால் ‘உனக்கு’ பயன்படுத்தப்பட்டது.
- source_word: Χοραζίν
  choice: கோராசின்
  rationale: கிரேக்க இடப்பெயரின் ஒலிப்பை நவீனத் தமிழில் தெளிவாக எழுத்துப்பெயர்க்கிறது.
- source_word: Βηθσαϊδά
  choice: பெத்சாயிதா
  rationale: கிரேக்க இடப்பெயரின் ஒலிப்பை நவீனத் தமிழில் எழுத்துப்பெயர்க்கிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முன்னுள்ள ‘ஐயோ’ என்ற தீர்ப்புரைக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: αἱ δυνάμεις
  choice: வல்ல செயல்கள்
  rationale: தெய்வீக வல்லமையை வெளிப்படுத்தும் செயல்கள் என்ற பொருளைப் பாதுகாக்கிறது; ‘அற்புதங்கள்’ என்பதும் சூழலுக்கேற்ற மாற்று மொழிபெயர்ப்பு.
- source_word: ἐν ὑμῖν
  choice: உங்களிடையே
  rationale: நகரங்களில் வாழ்ந்த மக்களின் நடுவே இச்செயல்கள் நிகழ்ந்தன என்பதைக் காட்டுகிறது; அவர்களுக்குள் உள்ளார்ந்து நிகழ்ந்தன என்ற தவறான பொருளைத் தவிர்க்கிறது.
- source_word: πάλαι
  choice: வெகு காலத்திற்கு முன்பே
  rationale: அவர்களுடைய மனந்திரும்புதல் இந்நேரத்துக்கு மிகவும் முன்னரே நிகழ்ந்திருக்கும் என்ற கால வலியுறுத்தலை வெளிப்படுத்துகிறது.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: துக்கவுடை அணிந்து சாம்பலில்
  rationale: துயரத்தையும் மனந்திரும்புதலையும் வெளிப்படுத்திய பண்டைய அடையாளங்களை இயல்பான தமிழில் படிமத்துடன் வழங்குகிறது.
- source_word: μετενόησαν
  choice: மனந்திரும்பியிருப்பார்கள்
  rationale: சூழலில் இது வெறும் எண்ணமாற்றம் அல்லாமல் பாவத்திலிருந்து திரும்புவதைக் குறிக்கிறது; ἄν உடன் வரும் நிகழாத நிபந்தனையின் விளைவையும் ‘இருப்பார்கள்’ அமைப்பு வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தீரு, சீதோன் நகரங்களுடன் இயேசு செய்யும் ஒப்பீட்டின் தன்மை
  choice: இயேசுவின் வல்ல செயல்களைக் கண்டும் மனந்திரும்பாத நகரங்களுக்கு அதிகப் பொறுப்பு உண்டு என்பதைக் காட்டும் உண்மையான எதிர்நிகழ்வு ஒப்பீடாக மொழிபெயர்க்கப்பட்டது.
  alternative: ஒப்பீட்டுத் தீர்ப்பை உண்மையாகக் குறிக்காத வெறும் சொல்லணி மிகைப்படுத்தல்.
  rationale: கிரேக்க உரை நிகழாத நிபந்தனையையும் அதன் விளைவையும் நேரடியாக முன்வைக்கிறது. மொழிபெயர்ப்பு அந்தத் தார்மீக வேறுபாட்டைப் பாதுகாக்கிறது; ஆனால் அதற்கு அப்பாற்பட்ட கோட்பாட்டு முடிவைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் அதேவேளையில் தீர்க்கதரிசனத் தீர்ப்புரையின் கண்ணியமும் தீவிரமும் நிலைக்குமாறு வடிவமைக்கப்பட்டது. ‘கோராசினே’, ‘பெத்சாயிதாவே’ என்ற நேரடி அழைப்புகள் மூலத்தின் ஒருமையைப் பாதுகாக்கின்றன; ‘உங்களிடையே’ என்பது அந்த நகர மக்களைக் கூட்டாகக் குறிக்கிறது.
