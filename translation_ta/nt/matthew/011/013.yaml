translation:
  language: ta
  text: ஏனெனில், எல்லாத் தீர்க்கதரிசிகளும் திருச்சட்டமும் யோவான் வரை தீர்க்கதரிசனம் உரைத்தன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யோவான் வரைக்கும்” அல்லது “யோவானின் காலம் வரை.” இச்சொற்றொடர் யோவானைத் தீர்க்கதரிசனச் சாட்சியின் நிறைவாகக் காட்டலாம்; அல்லது அதன் மாற்றத்தைக் குறிக்கும் எல்லையாகக் காட்டலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: அனைவரும்
  rationale: οἱ προφῆται என்பதுடன் சேர்ந்து தீர்க்கதரிசிகளின் முழுக் குழுவையும் குறிக்கிறது; தமிழில் இயல்பான கூட்டுப்பொருளைத் தருகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத்தையோ அடிப்படையையோ அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையைத் தெளிவாகக் காக்கிறது.
- source_word: οἱ προφῆται
  choice: தீர்க்கதரிசிகள்
  rationale: தேவனுடைய சார்பில் தீர்க்கதரிசனமாகப் பேசுவோரைக் குறிக்கும் வழக்கமான, பரவலாகப் புரிந்துகொள்ளப்படும் தமிழ் சொல்.
- source_word: ὁ νόμος
  choice: திருச்சட்டம்
  rationale: பொதுவான சட்டத்தை அல்லாமல் இஸ்ரவேலின் அங்கீகரிக்கப்பட்ட மோசேயின் சட்டநூல்/தோராவைக் குறிக்கும் வேதாகமத் தலைப்பாக இருப்பதை உணர்த்துகிறது.
- source_word: ἕως Ἰωάννου
  choice: யோவான்வரை
  rationale: கால எல்லையைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது; யோவான் அந்தச் சாட்சியின் நிறைவாக உள்ளாரா அல்லது மாற்றத்தின் எல்லையைக் குறிக்கிறாரா என்ற மூலமொழியின் தெளிவின்மையைத் தீர்க்காமல் விடுகிறது.
- source_word: ἐπροφήτευσαν
  choice: தீர்க்கதரிசனம் உரைத்தன
  rationale: வினைச்சொல்லின் நேரடியான தீர்க்கதரிசனப் பொருளைக் காக்கிறது. தீர்க்கதரிசிகளோடு திருச்சட்டமும் ஒரே கூட்டெழுவாயாக இருப்பதால், உயிரற்ற நூலையும் உள்ளடக்கும் மரியாதைப் பன்மையான ‘உரைத்தன’ இயல்பாக அமைகிறது; திருச்சட்டம் தீர்க்கதரிசனச் சாட்சி அளித்தது என்ற உருவகத்தையும் காக்கிறது.
theological_decisions:
- issue: ὁ νόμος என்பது பொதுவான சட்டமா அல்லது வேதாகம நூற்பகுதியின் பெயரா
  choice: திருச்சட்டம்
  alternative: சட்டம் / நியாயப்பிரமாணம்
  rationale: ‘தீர்க்கதரிசிகள்’ என்பதுடன் இணைந்து வருவதால், இது பொதுவான சட்டக் கோட்பாட்டை அல்லாமல் இஸ்ரவேலின் அங்கீகரிக்கப்பட்ட தோரா சாட்சியைக் குறிக்கிறது. ‘திருச்சட்டம்’ இந்த நூற்பகுதி சார்ந்த பொருளை இயல்பான நவீன தமிழில் காட்டுகிறது.
- issue: ἕως Ἰωάννου என்பதில் யோவான் தீர்க்கதரிசனக் காலத்துக்குள் சேர்க்கப்படுகிறாரா அல்லது அதன் முடிவெல்லையைக் குறிக்கிறாரா
  choice: யோவான்வரை
  alternative: யோவானின் காலம்வரை / யோவான் வரைக்கும்
  rationale: மூலக்கிரேக்கச் சொற்றொடர் கால எல்லையைத் தருகிறது; ஆனால் யோவான் நிறைவுப் புள்ளியா அல்லது மாற்றத்தின் எல்லையா என்பதை முழுமையாகத் தீர்மானிக்கவில்லை. எனவே மொழிபெயர்ப்பு அந்த இறையியல் இழுபறியைத் திறந்தே வைக்கிறது.
- issue: திருச்சட்டம் ‘தீர்க்கதரிசனம் உரைத்தது’ என்ற உருவகப் பயன்பாடு
  choice: தீர்க்கதரிசனம் உரைத்தன
  alternative: தீர்க்கதரிசனச் சாட்சியாக இருந்தன
  rationale: மூலத்தில் ஒரே வினை தீர்க்கதரிசிகளுக்கும் திருச்சட்டத்துக்கும் பொருந்துகிறது. அதை விளக்கவுரையாக மெலிதாக்காமல், திருச்சட்டத்தையே தீர்க்கதரிசனச் சாட்சி உரைப்பதாக இயேசு உருவகப்படுத்தும் கூற்றைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைக் கடைப்பிடிக்கிறது. ‘நியாயப்பிரமாணம்’ என்பதற்குப் பதிலாக இயல்பான ‘திருச்சட்டம்’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் கூட்டெழுவாயும் தீர்க்கதரிசன உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
