id: MAT.11.11
reference: Matthew 11:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, οὐκ ἐγήγερται ἐν γεννητοῖς γυναικῶν μείζων Ἰωάννου τοῦ βαπτιστοῦ· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τῶν οὐρανῶν μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/011.yaml
  text: Truly I say to you[a], among those born of women no one greater than John the Baptist has arisen[c][b]; yet the least in the kingdom of heaven is greater than he.
translation:
  language: ta
  text: '“உண்மையாகவே உங்களுக்குச் சொல்கிறேன்: பெண்களிடமிருந்து பிறந்தவர்களுள்[a], திருமுழுக்கு கொடுக்கும் யோவானைவிடப் பெரியவர் எவரும் தோன்றியதில்லை[b]. ஆனாலும், பரலோக அரசில் மிகச் சிறியவர்[c] அவரைவிடப் பெரியவர்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பெண்களிடமிருந்து பிறந்தவர்கள்’ என்பது மனிதர்களைக் குறிக்கும் செமித்திய மொழிவழக்கு.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘எழுந்ததில்லை’ / ‘எழுப்பப்பட்டதில்லை.’ கிரேக்க வினைச்சொல் ‘எழுந்திருக்கிறார்’ அல்லது ‘எழுப்பப்பட்டிருக்கிறார்’ என்று பொருள்படலாம்; இங்கே உயிர்த்தெழுதலைவிட வரலாற்றில் ஒருவர் தோன்றியதையே பெரும்பாலும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘சிறியவர்.’ கிரேக்கத்தில் ஒப்பீட்டு வடிவம் சொற்பொருளில் ‘இன்னும் சிறியவர்’ என உள்ளது; இங்கே பரலோக அரசில் தரம் அல்லது நிலையில் மிகச் சிறியவரைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: உண்மையாகவே
  rationale: இது இயேசுவின் அதிகாரமிக்க, உறுதியான கூற்றை அறிமுகப்படுத்துகிறது. ஒலிபெயர்ப்பான ‘ஆமென்’ என்பதைவிட இத்தமிழாக்கம் ஓடும் உரையில் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: λέγω ὑμῖν
  choice: உங்களுக்குச் சொல்கிறேன்
  rationale: மூலத்தின் நேரடியான உரையாடல் சூத்திரத்தை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: οὐκ ἐγήγερται
  choice: எவரும் தோன்றியதில்லை
  rationale: வரலாற்றில் ஒருவர் எழுந்து தோன்றியிருப்பதைக் குறிக்கும் சூழல்சார் பொருளை வழங்குகிறது; உயிர்த்தெழுதலைத் தேவையின்றி உணர்த்துவதைத் தவிர்க்கிறது.
- source_word: ἐν γεννητοῖς γυναικῶν
  choice: பெண்ணிடம் பிறந்தவர்களுள்
  rationale: மனிதர்களைக் குறிக்கும் செமித்திய மொழிவழக்கின் உருவகத்தைப் பாதுகாக்கும் அதே நேரத்தில் தமிழில் புரியுமாறு உள்ளது.
- source_word: μείζων Ἰωάννου τοῦ βαπτιστοῦ
  choice: திருமுழுக்கு கொடுக்கிற யோவானைவிடப் பெரியவர் எவரும்
  rationale: ஒப்பீட்டுக் கட்டமைப்பைத் தெளிவான தமிழில் தருகிறது; βαπτιστής என்பதைச் செயற்பாட்டை வெளிப்படுத்தும் பெயரடையாக மொழிபெயர்க்கிறது.
- source_word: ὁ δὲ μικρότερος
  choice: ஆனாலும் ... மிகச் சிறியவர்
  rationale: மூலத்தில் ஒப்பீட்டு வடிவம் இருந்தாலும், அரசில் தரம் அல்லது நிலையில் எல்லாரிலும் சிறியவரைக் குறிக்கும் இயல்பான தமிழ்ச் சொற்றொடரைப் பயன்படுத்துகிறது.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: பரலோக அரசில்
  rationale: மத்தேயுவின் வழக்கமான சொற்றொடரைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது; மூலத்தின் பன்மை வடிவத்தைத் தமிழில் இயல்பற்ற முறையில் கட்டாயப்படுத்தவில்லை.
- source_word: μείζων αὐτοῦ ἐστιν
  choice: அவரைவிடப் பெரியவர்
  rationale: யோவானுடனான நேரடி ஒப்பீட்டைத் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: அரசில் மிகச் சிறியவருக்கும் யோவானுக்கும் இடையிலான பெருமை ஒப்பீடு
  choice: அரசில் மிகச் சிறியவர் யோவானைவிடப் பெரியவர் என்ற கூற்றை விளக்கித் தீர்க்காமல் நேரடியாக மொழிபெயர்த்தல்
  alternative: இது உடன்படிக்கைக் காலம், இரட்சிப்பு வரலாற்றிலான நிலை, அல்லது தனிப்பட்ட பரிசுத்தம் ஆகியவற்றில் குறிப்பாக எதைக் குறிக்கிறது என்று மொழிபெயர்ப்பிலேயே விளக்குதல்
  rationale: இந்த வசனம் முரண்பாடுபோல் தோன்றும் ஒப்பீட்டை முன்வைக்கிறது; அது எவ்வகையில் உண்மை என்பதை வசனமே விளக்கவில்லை. ஆகவே அதன் இறையியல் அழுத்தமும் திறந்த தன்மையும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் இயேசுவின் கூற்றுக்குரிய கண்ணியமான, அதிகாரமிக்க தொனியுடனும் வடிவமைக்கப்பட்டது. ‘திருமுழுக்கு கொடுக்கிற யோவான்’ என்பது மரபுசார் பெயர்ப்பட்டத்தை மட்டும் ஒலிபெயர்க்காமல் அவரது செயலைத் தெளிவுபடுத்துகிறது.
