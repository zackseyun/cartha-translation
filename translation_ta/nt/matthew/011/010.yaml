id: MAT.11.10
reference: Matthew 11:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀οὗτός ἐστιν περὶ οὗ γέγραπται· Ἰδοὺ ἐγὼ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/010.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face, who will prepare your way before you.’'
translation:
  language: ta
  text: 'எழுதப்பட்டுள்ளவர் இவரே: “இதோ, நான் என் தூதனை உன் முகத்துக்கு முன்பாக[a] அனுப்புகிறேன்; அவன் உனக்கு முன்பாக உன் வழியை ஆயத்தப்படுத்துவான்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இயல்பான தமிழில் “உனக்கு முன்னே” என்றும் சொல்லலாம். ஆனால் கிரேக்க வேதாகம மேற்கோள் “உன் முகத்துக்கு முன்பாக” என்ற காட்சிப்பூர்வமான சொல்லாட்சியைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός ἐστιν περὶ οὗ
  choice: இவரைக் குறித்தே
  rationale: சுட்டுப்பெயரின் அடையாளப்படுத்தும் வலியுறுத்தலையும் περί உடன் வரும் ‘குறித்து’ என்ற பொருளையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: γέγραπται
  choice: இவ்வாறு எழுதப்பட்டுள்ளது
  rationale: வேதாகம மேற்கோளை அறிமுகப்படுத்தும் நிறைவு passive சூத்திரத்தையும், எழுதப்பட்டதன் தொடரும் நிலைத்தன்மையையும் காக்கிறது.
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் தீர்க்கதரிசன மேற்கோளின் உயர்ந்த நடையை இயல்பான தமிழில் தருகிறது.
- source_word: ἀποστέλλω
  choice: அனுப்புகிறேன்
  rationale: நிகழ்கால வடிவத்தின் உயிரோட்டத்தையும் சூழலில் உள்ள வரவிருக்கும் செயலின் நுணுக்கத்தையும் காக்கிறது.
- source_word: τὸν ἄγγελόν μου
  choice: என் தூதனை
  rationale: ἄγγελος என்பதன் அடிப்படைப் பொருள் ‘செய்தியுடன் அனுப்பப்பட்டவர்’; இங்கு மனித முன்னோடியான யோவானைக் குறிப்பதால் ‘தேவதூதன்’ என்பதைவிட ‘தூதன்’ பொருத்தமானது.
- source_word: πρὸ προσώπου σου
  choice: உன் முகத்திற்கு முன்பாக
  rationale: மேற்கோளில் உள்ள ‘உன் முகத்திற்கு முன்’ என்ற உருவகமிக்க, திட்டவட்டமான சொல்லமைப்பைத் தக்கவைக்கிறது; இயல்பான தமிழ் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: κατασκευάσει
  choice: ஆயத்தப்படுத்துவான்
  rationale: ஒரு வழியை முன்கூட்டியே தயாராக்குதல் என்ற வினையின் பொருளையும் மேற்கோளின் கண்ணியமான நடையையும் வெளிப்படுத்துகிறது.
- source_word: τὴν ὁδόν σου
  choice: உன் வழியை
  rationale: ὁδός என்பதன் நேரடியான பாதை உணர்வையும் உருவகப் பொருளையும் ஒருசேர காக்கிறது.
- source_word: ἔμπροσθέν σου
  choice: உனக்கு முன்பாக
  rationale: ‘உனக்கு முன்னால்’ என்ற இடத்தொடர்பைத் தெளிவாகக் காட்டி, மேற்கோளின் இரண்டாவது முன்னிலைத் தொடரையும் தனியாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: மேற்கோளிலுள்ள இரண்டு ஒத்த முன்னிலைத் தொடர்களை மொழிபெயர்த்தல்
  choice: ‘உன் முகத்திற்கு முன்பாக’ மற்றும் ‘உனக்கு முன்பாக’ ஆகிய இரண்டையும் முதன்மை உரையில் தக்கவைத்தல்
  alternative: இரண்டையும் ஒன்றிணைத்து ‘உனக்கு முன்னே’ என்று சீராக்குதல்
  rationale: கிரேக்க உரையில் πρὸ προσώπου σου மற்றும் ἔμπροσθέν σου என இரண்டு தனித்தொடர்கள் உள்ளன. அவற்றை ஒன்றாக்காமல் வைத்திருப்பது மேற்கோளின் உருவகத்தையும் வலியுறுத்தும் இணைநிலையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. மேற்கோளின் தீர்க்கதரிசனத் தொனிக்காக ‘இதோ’ மற்றும் ‘ஆயத்தப்படுத்துவான்’ தேர்ந்தெடுக்கப்பட்டுள்ளன; அதேவேளை வாக்கியம் பொதுவாசகர்களுக்குப் புரியத்தக்கதாக வைக்கப்பட்டுள்ளது.
