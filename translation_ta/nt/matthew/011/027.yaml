source:
  edition: SBLGNT
  text: Πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς ἐπιγινώσκει τὸν υἱὸν εἰ μὴ ὁ πατήρ, οὐδὲ τὸν πατέρα τις ἐπιγινώσκει εἰ μὴ ὁ υἱὸς καὶ ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/027.yaml
  text: All things have been handed over to me by my Father[a], and no one knows the Son except the Father[b], nor does anyone know the Father except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: ta
  text: அனைத்தும் என் தந்தையால் என்னிடம் ஒப்படைக்கப்பட்டுள்ளன; தந்தையைத் தவிர வேறு எவரும் மகனை அறியவில்லை[a]; மகனையும், மகன் தந்தையை வெளிப்படுத்த விரும்புகிற எவரையும் தவிர, வேறு எவரும் தந்தையை அறியவில்லை.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அறியவில்லை” என்பதற்கு “முழுமையாக அறியவில்லை” அல்லது “ஆழமாக அறியவில்லை” என்றும் மொழிபெயர்க்கலாம்; கிரேக்க வினைச்சொல் நெருக்கமான அல்லது முழுமையான அறிதலைக் குறிக்கக்கூடும். இது இரண்டு இடங்களுக்கும் பொருந்தும்.
    reason: lexical_alternative
  - marker: b
    text: “மகன் தந்தையை வெளிப்படுத்தத் தேர்ந்தெடுக்கிற எவரையும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα
  choice: அனைத்தும்
  rationale: பால் சாராத பன்மை வடிவத்தின் விரிவான பொருளைத் தேவையின்றி எல்லை குறிக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: παρεδόθη
  choice: ஒப்படைக்கப்பட்டுள்ளன
  rationale: தந்தையிடமிருந்து மகனுக்கு நிகழ்ந்த ஒப்படைப்பையும் அதன் தற்போதைய விளைவையும் காட்டுகிறது.
- source_word: ὑπὸ τοῦ πατρός μου
  choice: என் தந்தையால்
  rationale: செயப்பாட்டு வினையின் செய்பவரையும் தனிப்பட்ட தந்தை–மகன் உறவையும் தெளிவாகக் காட்டுகிறது.
- source_word: ἐπιγινώσκει
  choice: அறிந்திருக்கவில்லை
  rationale: இங்கு இந்த வினைச்சொல்லுக்கு ‘முழுமையாக’ என்ற தீவிரப்பொருள் கட்டாயமல்ல; தமிழில் உறுதியான, உறவுசார் அறிதலை இயல்பாக வெளிப்படுத்துகிறது. இரு இணையான கூற்றுகளிலும் ஒரே சொல் பயன்படுத்தப்பட்டுள்ளது.
- source_word: τὸν υἱὸν / τὸν πατέρα
  choice: மகன் / தந்தை
  rationale: பரஸ்பரமான உறவுப் பட்டங்களை நவீன, கண்ணியமான தமிழில் பாதுகாக்கிறது.
- source_word: εἰ μὴ
  choice: தவிர வேறு எவரும்
  rationale: எதிர்மறை வாக்கியத்துடன் வரும் விலக்குப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι
  choice: மகன் எவருக்குத் தந்தையை வெளிப்படுத்த விரும்புகிறாரோ
  rationale: மகனின் சித்தம் அல்லது விருப்பத்தைப் பாதுகாக்கிறது; வெளிப்படுத்தப்படுபவர் தந்தை என்பதைச் சூழலிலிருந்து தமிழில் தெளிவாக்குகிறது.
- source_word: ἀποκαλύψαι
  choice: வெளிப்படுத்த
  rationale: மறைந்திருந்ததை அறியச் செய்யும் வெளிப்பாட்டுப் பொருளை நேரடியாகத் தருகிறது.
theological_decisions:
- issue: ἐπιγινώσκω என்ற வினையின் தீவிரப்பொருள்
  choice: முதன்மை உரையில் ‘அறிந்திருக்கவில்லை’
  alternative: ‘முழுமையாக அறிந்திருக்கவில்லை’ அல்லது ‘ஆழமாக அறிந்திருக்கவில்லை’
  rationale: கூட்டு வினை இச்சூழலில் கட்டாயமாக ‘முழுமையாக’ என்னும் கூடுதல் தீவிரத்தைக் குறிக்கிறது என்று உறுதியாகச் சொல்ல முடியாது. ஆகவே பரஸ்பர அறிதலின் தனித்தன்மையைப் பாதுகாத்தபடியே உரை கூறுவதைக் கடந்து செல்லவில்லை.
- issue: βούληται என்பதில் மகனின் விருப்பம்/சித்தம்
  choice: ‘வெளிப்படுத்த விரும்புகிறாரோ’
  alternative: ‘வெளிப்படுத்தத் தேர்ந்தெடுக்கிறாரோ’ அல்லது ‘வெளிப்படுத்தச் சித்தங்கொள்கிறாரோ’
  rationale: மகனின் வெளிப்படுத்தும் முன்முயற்சியையும் விருப்பத்தையும் தருகிறது; ‘தேர்ந்தெடுக்கிறார்’ எனக் கூறி நபரைத் தேர்வு செய்வதே வினையின் ஒரே நுணுக்கம் என்று தீர்மானிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘தந்தை’, ‘மகன்’ ஆகிய உறவுப் பட்டங்கள் இணையான அமைப்பில் வைக்கப்பட்டுள்ளன. நீண்ட கிரேக்க வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டாலும் அதன் தர்க்க இணைவு பாதுகாக்கப்பட்டுள்ளது.
