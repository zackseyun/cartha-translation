  text: ναί, ὁ πατήρ, ὅτι οὕτως ⸂εὐδοκία ἐγένετο⸃ ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/026.yaml
  text: Yes[a], Father, because this was pleasing in your sight.
translation:
  language: ta
  text: ஆம்[a], தந்தையே, ஏனெனில் இவ்வாறே உமக்கு விருப்பமாயிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆம், தந்தையே, ஏனெனில் இவ்வாறே உமது நல்விருப்பமாயிருந்தது.”
    reason: εὐδοκία என்பதைப் பெயர்ச்சொல் வடிவில் ‘நல்விருப்பம்’ எனத் தரும் மாற்றுவாசிப்பு; οὕτως என்பதன் ‘இவ்வாறே’ என்ற முறைக் குறிப்பைத் தக்கவைக்கிறது.
lexical_decisions:
- source_word: ναί
  choice: ஆம்
  rationale: செபத்தில் தந்தையின் செயலை ஏற்றுக்கொள்ளும் நேரடியான உறுதிப்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὁ πατήρ
  choice: தந்தையே
  rationale: அழைப்புப் பொருளுடைய கிரேக்கப் பெயர்ச்சொல்லை நவீன, கண்ணியமான தமிழ் விளிவேற்றுமையில் தருகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முன்னுள்ள உறுதிப்பாட்டிற்கான காரணத்தை அறிமுகப்படுத்தும் கிரேக்கச் சொல்லின் காரணப்பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: οὕτως
  choice: இது
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட மறைத்தல் மற்றும் வெளிப்படுத்தல் முறையைப் பின்னோக்கிச் சுட்டுகிறது; தமிழில் இச்சூழலில் ‘இது’ இயல்பானது.
- source_word: εὐδοκία
  choice: உகந்தது
  rationale: தந்தைக்கு விருப்பமானதும் ஏற்புடையதுமானது என்ற மதிப்பீட்டுப் பொருளைக் காக்கிறது; ‘திட்டம்’ அல்லது ‘தீர்மானம்’ என்ற வலுவான கருத்தைத் தேவையின்றி புகுத்தவில்லை.
- source_word: ἐγένετο
  choice: ஆயிருந்தது
  rationale: ‘உண்டானது/ஆனது’ என்ற γίνομαι சொல்லின் நிழற்பொருளை, தமிழில் இயல்பான இறந்தகாலப் பயனிலையுடன் இணைக்கிறது.
- source_word: ἔμπροσθέν σου
  choice: உமக்கு
  rationale: சொற்படியாக ‘உமக்கு முன்பாக’ என்றாலும், இங்கு ‘உமது பார்வையில்/உமக்கு’ என்ற மதிப்பீட்டுப் பொருள் உள்ளது; ‘உமக்கு உகந்தது’ என்பது இயல்பான தமிழ் சொற்றொடர்.
theological_decisions:
- issue: εὐδοκία என்பது தெய்வீகத் தீர்மானம் அல்லது நோக்கத்தைச் சுட்டுகிறதா, தந்தையின் விருப்பம் மற்றும் அங்கீகாரத்தைச் சுட்டுகிறதா
  choice: ‘உமக்கு உகந்ததாயிருந்தது’ என்று மொழிபெயர்த்து, தந்தையின் விருப்பம் மற்றும் அங்கீகாரத்தை முன்னிறுத்துதல்
  alternative: ‘இவ்வாறு செய்வது உமது நல்விருப்பமாயிருந்தது’
  rationale: மூலவாசகம் தந்தையின் செயல்முறை அவருக்கு விருப்பமானது என்பதை உறுதிப்படுத்துகிறது. ‘நோக்கம்’ அல்லது ‘தீர்மானம்’ என்பது உடனடி சொற்களைவிட வலுவான இறையியல் முடிவைத் திணிக்கக்கூடும்; மாற்றுவாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், செபத்திற்குரிய கண்ணியமான நடையுடன் ‘உமக்கு’ என்ற மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. வாசகம் சுருக்கமாகவும் பொதுவாசகர்களுக்கு இயல்பாகவும் வைக்கப்பட்டுள்ளது.
