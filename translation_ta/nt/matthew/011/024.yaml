  text: πλὴν λέγω ὑμῖν ὅτι γῇ Σοδόμων ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ σοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/024.yaml
  text: But I tell you that it will be more tolerable for the land of Sodom on the day of judgment than for you[a].
translation:
  language: ta
  text: 'ஆனால் நான் உனக்குச் சொல்கிறேன்: நியாயத்தீர்ப்பு நாளில் உனக்கானதைவிட சோதோம் நாட்டுக்கானது அதிகம் தாங்கத்தக்கதாக இருக்கும்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நியாயத்தீர்ப்பு நாளில் உனக்கானதைவிட சோதோம் நாட்டுக்கானது அதிகம் சகிக்கத்தக்கதாக இருக்கும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: ஆனால்
  rationale: முந்தைய கண்டனத்துடன் வலுவான முரண்பாட்டையும் தொடர்ச்சியையும் இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: λέγω ὑμῖν
  choice: நான் உனக்குச் சொல்கிறேன்
  rationale: சூழலில் நகரம் ஒருமையில் நேரடியாக விளிக்கப்படுவதால், கிரேக்கத் தொடரின் நேரடிப் பேச்சையும் ஒருமை முகவரியையும் காக்கிறது.
- source_word: γῇ Σοδόμων
  choice: சோதோம் நாட்டுக்கு
  rationale: γῇ என்பதிலுள்ள ‘நிலம்/நாடு’ என்ற வெளிப்படையான கூறைத் தக்கவைத்து, சோதோமுடன் தொடர்புடைய பிரதேசத்தைக் குறிக்கிறது.
- source_word: ἀνεκτότερον
  choice: நிலை பொறுத்துக்கொள்ளத்தக்கதாக
  rationale: நியாயத்தீர்ப்பை ஒரு நிலையாக அனுபவிப்பது குறித்த ஒப்பீட்டைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது; ‘மேலும்’ என்று தேவையற்ற இரட்டை ஒப்பீட்டைச் சேர்க்கவில்லை.
- source_word: ἔσται
  choice: இருக்கும்
  rationale: எளிய எதிர்கால இணைப்புவினையை இயல்பான தமிழில் தருகிறது.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: நியாயத்தீர்ப்பு நாளில்
  rationale: குறிப்பிட்ட இறுதி நியாயத்தீர்ப்பு நாளைக் குறிக்கும் காலத் தொடரைத் தெளிவாகவும் மரபான தமிழிலும் தருகிறது.
- source_word: ἢ σοί
  choice: உனக்கு இருப்பதைவிட
  rationale: ஒப்பீட்டையும் ஒருமை நேரடி விளிப்பையும் தமிழில் வெளிப்படையாகக் காக்கிறது.
theological_decisions:
- issue: ஒருமை σοί என்பதன் குறிப்பு
  choice: நகரத்தை ஆளுருவாக்கி ‘உனக்கு’ என்ற ஒருமை நேரடி விளிப்பைத் தக்கவைத்தல்
  alternative: ‘உங்கள் மக்களுக்கு’ என்று பன்மை மக்களைக் குறிப்பதாக விரித்தல்
  rationale: கிரேக்கத்தில் ஒருமை உள்ளது; சுற்றுச் சூழலில் நகரத்துக்கான தீர்க்கதரிசனப் பாணி நேரடி விளிப்பு தொடர்கிறது. இதை விரித்து விளக்காமல் அதன் சொல்லாட்சிசார் மற்றும் இறையியல்சார் அழுத்தத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் கண்ணியமான தீர்ப்புரை நடையைக் காக்கிறது. ‘சோதோம் நாட்டுக்கு’ என்பது மூலத்தின் γῇ கூறை வெளிப்படையாகப் பாதுகாக்கிறது; ஒருமை ‘உனக்கு’ நகரத்துக்கான நேரடி விளிப்பைத் தொடர்கிறது.
