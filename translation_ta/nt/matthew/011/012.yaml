id: MAT.11.12
reference: Matthew 11:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀπὸ δὲ τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ ἕως ἄρτι ἡ βασιλεία τῶν οὐρανῶν βιάζεται, καὶ βιασταὶ ἁρπάζουσιν αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/012.yaml
  text: But from the days of John the Baptist until now[a], the kingdom of heaven suffers violence, and violent men seize it.
translation:
  language: ta
  text: ஆனால், திருமுழுக்கு அளிக்கும் யோவானின் நாட்களிலிருந்து இப்போது வரை, பரலோக அரசாட்சி வன்முறைக்கு உள்ளாகிறது; வன்முறையாளர்கள் அதை வலுக்கட்டாயமாகக் கைப்பற்றுகிறார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரலோக அரசாட்சி வல்லமையுடன் முன்னேறுகிறது; வல்லமையுடன் முனைவோர் அதைப் பற்றிக்கொள்கிறார்கள்.” ‘வன்முறைக்கு உள்ளாகிறது’ என்று மொழிபெயர்க்கப்பட்டுள்ள கிரேக்க வினைச்சொல்லை இடைநிலைப் பொருளிலும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ δὲ
  choice: ஆனால், … முதல்
  rationale: ἀπό தொடக்கப் புள்ளியைக் குறிக்கிறது; δέ மென்மையான உரைமாற்றத்தையோ வேறுபாட்டையோ காட்டுகிறது. ‘ஆனால்’ அந்த உரைமாற்றத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ
  choice: திருமுழுக்கு அளிக்கும் யோவானின் நாட்கள்
  rationale: ‘நாட்கள்’ என்பது கிரேக்க மரபுத்தொடரைப் பாதுகாக்கிறது; ‘திருமுழுக்கு அளிக்கும் யோவான்’ என்பது அவரது அடைமொழியைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἕως ἄρτι
  choice: இன்றுவரை
  rationale: யோவானின் நாட்களிலிருந்து இயேசு பேசும் தற்போதைய நேரம்வரை தொடரும் காலத்தைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: பரலோக அரசு
  rationale: மத்தேயுவுக்கே சிறப்பான இச்சொற்றொடரில் உள்ள ஆட்சி/அரசு என்ற பொருளை, நவீனத் தமிழில் எளிதில் புரியும் வகையில் தருகிறது.
- source_word: βιάζεται
  choice: வன்முறைக்கு உள்ளாக்கப்படுகிறது
  rationale: இங்கு வினைச்சொல் செயலப்பாட்டு அல்லது இடைநிலைப் பொருளில் புரிந்துகொள்ளப்படலாம். அடுத்துள்ள ‘வன்முறையாளர்கள்’ என்பதுடன் நன்கு பொருந்தும் செயலப்பாட்டு வாசிப்பு முதன்மை உரையில் வைக்கப்பட்டுள்ளது; மற்ற வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: βιασταὶ
  choice: வன்முறையாளர்கள்
  rationale: வலுக்கட்டாயமாக அல்லது வன்முறையாகச் செயல்படுகிறவர்களைக் குறிக்கும் பெயர்ச்சொல்லின் எதிர்மறை வலிமையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ἁρπάζουσιν αὐτήν
  choice: அதை வலுக்கட்டாயமாகக் கைப்பற்றுகிறார்கள்
  rationale: ἁρπάζω என்பதில் உள்ள பறித்தல் அல்லது பலவந்தமாக எடுத்துக்கொள்ளுதல் என்ற நுணுக்கத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: βιάζεται என்பது பரலோக அரசைப் பற்றி எந்தப் பொருளில் பயன்படுத்தப்பட்டுள்ளது?
  choice: 'செயலப்பாட்டு வாசிப்பு: ‘பரலோக அரசு வன்முறைக்கு உள்ளாக்கப்படுகிறது’'
  alternative: 'இடைநிலை/தன்னிலை வாசிப்பு: ‘பரலோக அரசு வல்லமையுடன் முன்னேறுகிறது’'
  rationale: கிரேக்க வடிவம் இரு பொருள்களுக்கும் இடமளிக்கிறது. தொடர்ந்து வரும் ‘வன்முறையாளர்கள் … கைப்பற்றுகிறார்கள்’ என்பதுடன் செயலப்பாட்டு வாசிப்பு நன்கு பொருந்தினாலும், வல்லமையுடன் முன்னேறுதல் என்ற வாசிப்புக்கும் மொழியியல் ஆதாரம் உள்ளது. ஆகவே முதன்மை உரையில் ஒரு வாசிப்பைத் தேர்ந்தெடுத்து, உண்மையான தெளிவின்மையை அடிக்குறிப்பில் பாதுகாக்கிறோம்.
translation_notes:
  register: நவீன பொதுத்தமிழில், சாதாரண வாசகர்களுக்கும் புரியக்கூடிய கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘நாட்கள்’ என்ற மூல உருவகமும், வன்முறையைக் குறிக்கும் தொடர்ச்சியான சொல் நயமும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
