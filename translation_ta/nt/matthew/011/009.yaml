source:
  edition: SBLGNT
  text: ἀλλὰ τί ἐξήλθατε⸂; προφήτην ἰδεῖν⸃; ναί, λέγω ὑμῖν, καὶ περισσότερον προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/009.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
translation:
  language: ta
  text: ஆனால், நீங்கள் எதைப் பார்க்க வெளியே சென்றீர்கள்? ஓர் இறைவாக்கினரையா? ஆம், உங்களுக்குச் சொல்கிறேன், அவர் ஓர் இறைவாக்கினரைவிட மேலானவர்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் நேரடியாக, ‘ஓர் இறைவாக்கினரைவிட அதிகம்’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய வினாக்களுடன் உள்ள முரண்பாட்டையும் அடுத்த வினாவிற்கான மாற்றத்தையும் இயல்பாகக் குறிக்கிறது.
- source_word: τί ἐξήλθατε
  choice: நீங்கள் எதைப் பார்க்க வெளியே சென்றீர்கள்
  rationale: τί என்பதை ‘ஏன்’ என்று மாற்றாமல், அவர்கள் பார்க்கச் சென்றது எது என்ற பொருளில் காக்கிறது; ἰδεῖν உடன் இணைத்து இயல்பான தமிழாக்கம் தரப்பட்டுள்ளது.
- source_word: ἰδεῖν
  choice: பார்க்க
  rationale: ἐξήλθατε என்பதற்குப் பின் நோக்கத்தைக் குறிக்கும் வினையெச்சத்தின் எளிய, இயல்பான தமிழ் வடிவம்.
- source_word: προφήτην
  choice: ஓர் இறைவாக்கினரை
  rationale: குறிப்பிடப்படாத ஒருமை நபரைக் காட்டுகிறது; ‘இறைவாக்கினர்’ என்பது நவீன, கண்ணியமான தமிழ் வேதாகமச் சொல்.
- source_word: ναί
  choice: ஆம்
  rationale: முந்தைய வினாவுக்கு நேரடியான உறுதிப்பாட்டைத் தெளிவாக வழங்குகிறது.
- source_word: λέγω ὑμῖν
  choice: உங்களுக்குச் சொல்கிறேன்
  rationale: கிரேக்க உரையாடல் சூத்திரத்தின் வலிமையை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: καὶ περισσότερον προφήτου
  choice: அவர் ஓர் இறைவாக்கினரைவிட மேலானவர்
  rationale: ஒப்பீட்டின் பொருளைக் காக்கிறது. தமிழில் முழுமையான, இயல்பான வாக்கியமாக அமையச் சூழலில் தெளிவாக உள்ள ‘அவர்’ சேர்க்கப்பட்டுள்ளது; அவர் எந்த விதத்தில் மேலானவர் என்பதை விளக்காமல் விடுகிறது.
theological_decisions:
- issue: இயேசுவின் கூற்றில் யோவானின் அடையாளமும் நிலையும்
  choice: ‘அவர் ஓர் இறைவாக்கினரைவிட மேலானவர்’ என்று மொழிபெயர்த்து, அவர் எவ்விதத்தில் மேலானவர் என்பதை விரிவாக்காமல் விடுதல்
  alternative: ‘அவர் சாதாரண இறைவாக்கினரைவிட பெரியவர்’
  rationale: இக்கூற்று யோவானை இறைவாக்கினர் என்ற வகைக்கு மேலாக உயர்த்துகிறது; ஆனால் எப்படி என்பதை இப்பகுதி கூறவில்லை. ‘சாதாரண’ போன்ற விளக்கச் சொல்லைச் சேர்க்காமல் இருப்பது மூலத்தின் இறையியல் அழுத்தத்தையும் திறந்த தன்மையையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான மற்றும் வாசிக்க எளிதான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இறைவாக்கினர்’ என்ற மரியாதை ஒருமை வடிவம் முழுவதும் சீராகக் காக்கப்பட்டுள்ளது.
