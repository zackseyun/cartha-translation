  text: And blessed is the one who is not offended by me[a].
translation:
  language: ta
  text: மேலும், என் காரணமாக இடறிப்போகாதவர் பேறுபெற்றவர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னைக் குறித்து மனம் புண்படாதவர்” / “என்னால் மனத்தடை அடையாதவர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καί
  choice: மேலும்
  rationale: முந்தைய வசனத்தில் இயேசு கூறிய பதிலோடு இவ்வாக்கியத்தை இயல்பாக இணைக்கிறது.
- source_word: μακάριος
  choice: பேறுபெற்றவர்
  rationale: வெறும் மனமகிழ்ச்சியையோ உலகியல் அதிர்ஷ்டத்தையோ அல்லாமல், கடவுளின் அருளுக்குரிய நல்வாழ்வு அறிவிப்பை நவீனத் தமிழில் கண்ணியமாக வெளிப்படுத்துகிறது.
- source_word: ὃς ἐὰν μὴ
  choice: —ஆதவர்
  rationale: குறிப்பிட்ட ஒருவரை மட்டுமல்லாமல், இந்த நிபந்தனைக்குப் பொருந்தும் எவரையும் குறிக்கும் பொதுமையான ஒருமை அமைப்பைப் பாதுகாக்கிறது.
- source_word: σκανδαλισθῇ
  choice: இடறிப்போகாதவர்
  rationale: மூலச்சொல்லின் இடறுதல் உருவகத்தைத் தக்கவைத்து, வெறும் உணர்ச்சிவசப்பட்ட புண்படுதலாகப் பொருளைக் குறுக்காமல், விசுவாசத்தில் தடுமாறுதல் அல்லது விலகுதல் என்ற சாத்தியமான வலிமையையும் கொண்டுள்ளது.
- source_word: ἐν ἐμοί
  choice: என் காரணமாக
  rationale: இயேசுவே இடறுதலுக்கான சந்தர்ப்பமாக இருப்பதை இயல்பான தமிழில் காட்டுகிறது; அவர் திட்டமிட்டு ஒருவரை இடறச் செய்கிறார் என்ற தேவையற்ற பொருளைத் தவிர்க்கிறது.
theological_decisions:
- issue: σκανδαλισθῇ என்பதன் இடறுதல் உருவகத்தையும் இயேசுவைக் குறித்து உண்டாகும் மறுப்பையும் எவ்வாறு வெளிப்படுத்துவது
  choice: முதன்மை உரையில் “என் காரணமாக இடறிப்போகாதவர்” என்று உருவகத்தைத் தக்கவைத்தல்
  alternative: “என்னைக் குறித்து மனத்தடை அடையாதவர்” அல்லது “என்னை ஏற்றுக்கொள்ளத் தயங்காதவர்”
  rationale: இயேசுவையும் அவரது செயல்களையும் கண்டு வெறும் மனவருத்தம் அடையாதிருப்பதைவிட, அவரால் தடுமாறி விசுவாசத்திலிருந்து விலகாதிருப்பதே இங்கு உள்ள ஆழமான பதற்றம். அதேவேளையில், ‘அவரைக் குறித்து மறுப்பு கொள்ளுதல்’ என்ற சூழல்சார் நுண்பொருளை அடிக்குறிப்பு தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. “பேறுபெற்றவர்” மலைப்பொழிவு சார்ந்த ஆசீர்வாத அறிவிப்பின் சமய நிறையைத் தக்கவைக்கிறது; “இடறிப்போகாதவர்” மூலத்தின் உருவகத்தையும் அதன் தீவிரத்தையும் காக்கிறது.
