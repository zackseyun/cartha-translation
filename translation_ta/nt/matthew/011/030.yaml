    rationale: வாசகருக்குத் தேவையான மாற்றுப் பொருள்களை நேரடியாகக் கொடுத்தால் போதுமானது; மொழிபெயர்ப்புத் தேர்வின் விளக்கத்தை அடிக்குறிப்பிலேயே மீளச் சொல்லத் தேவையில்லை.
