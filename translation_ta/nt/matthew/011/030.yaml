  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ γὰρ ζυγός μου χρηστὸς καὶ τὸ φορτίον μου ἐλαφρόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/030.yaml
  text: For my yoke is kind, and my burden is light.
translation:
  language: ta
  text: ஏனெனில் என் நுகம் இதமானது[a]; என் சுமை இலகுவானது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நன்மையானது,” “கனிவானது”; சிலர், “சுமக்க எளிதானது” என மொழிபெயர்க்கின்றனர்.
    reason: χρηστός என்பது நன்மை, கனிவு, இதம், சுமப்பதற்கான எளிமை ஆகிய தொடர்புடைய நுணுக்கங்களைக் கொண்டதால், முக்கியமான மாற்று மொழிபெயர்ப்புகளைச் சுருக்கமாகக் காட்டுகிறது.
lexical_decisions:
- source_word: ζυγός
  choice: நுகம்
  rationale: மாடுகளை இணைத்துப் பணி செய்ய வைக்கும் நுகத்தையும், உருவகமாக ஒருவர் ஏற்றுக்கொள்ளும் கட்டுப்பாடு அல்லது சீடத்துவத்தையும் குறிக்கும் மூல உருவகத்தைப் பாதுகாக்கிறது.
- source_word: χρηστός
  choice: கனிவானது
  rationale: ‘நல்லது, கனிவுள்ளது, இதமானது, சுமக்க எளிதானது’ என்ற பொருள் வட்டத்தைக் கொண்ட சொல்லுக்கு ‘கனிவானது’ என்பது இயேசுவின் நுகத்தின் பண்பை முன்னிறுத்துகிறது; அதை வெறுமனே ‘எளிதானது’ என்று மட்டும் சுருக்கவில்லை.
- source_word: φορτίον
  choice: சுமை
  rationale: ஒருவர் சுமக்க வேண்டிய பாரம் என்ற நேரடியான மற்றும் உருவகமான இரு பொருள்களையும் இயல்பாகக் கொண்டுள்ளது.
- source_word: ἐλαφρόν
  choice: இலகுவானது
  rationale: ‘எடை குறைந்தது, சுமக்க லேசானது’ என்ற மூலப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட அழைப்புக்கான காரணத்தை இந்த வசனம் தருகிறது என்பதை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: χρηστός என்பதை ‘எளிதானது’ எனவா, ‘கனிவானது’ எனவா மொழிபெயர்ப்பது
  choice: கனிவானது
  alternative: எளிதானது / இதமானது
  rationale: மூலச்சொல் வெறும் சிரமமின்மையை மட்டும் அல்லாமல் நன்மை, கனிவு, இதம் ஆகிய நுணுக்கங்களையும் தாங்குகிறது. ‘கனிவானது’ அந்தப் பண்புசார் நுணுக்கத்தைப் பாதுகாக்கிறது; மாற்று வாசிப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘நுகம்’ என்ற வேதாகம உருவகம் அப்படியே வைக்கப்பட்டுள்ளது. இரண்டு இணையான கூறுகளின் சமநிலையை அரைப்புள்ளி பாதுகாக்கிறது.
