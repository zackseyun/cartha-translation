revisions:
- from: கப்பர்நகூமே, நீ வானம்வரை உயர்த்தப்படுவாயா? பாதாளம்வரை[a] இறங்கிப்போவாய். ஏனெனில், உன்னில் செய்யப்பட்ட வல்ல செயல்கள் சோதோமில் செய்யப்பட்டிருந்தால், அது இன்றுவரை நிலைத்திருந்திருக்கும்.
  to: கப்பர்நகூமே, நீ வானம்வரை உயர்த்தப்படுவாயா? ஹேடீஸ்வரை[a] இறங்குவாய். ஏனெனில், உன்னிடத்தில் நிகழ்ந்த வல்லமைமிக்க செயல்கள் சோதோமில் நிகழ்ந்திருந்தால், அது இன்றுவரை நிலைத்திருந்திருக்கும்.
  rationale: The revision retains the rhetorical negative question and the unreal past condition while rendering the deeds as events occurring in the respective cities. Most importantly, it transliterates ᾅδης as ‘ஹேடீஸ்’ and explains it in a footnote, preserving the source text’s distinction from Gehenna without importing a narrower doctrinal meaning.
