review_pass:
  verdict: revise
  source_fidelity: The rhetorical question, the heaven–Hades contrast, the counterfactual condition, and the result concerning Sodom are all represented accurately. However, ‘பாதாளம்’ can carry broader Tamil cosmological and infernal associations, whereas ᾅδης is deliberately distinct from Gehenna in this verse. Retaining the Greek designation in the text best preserves that distinction.
  naturalness: The draft is generally clear, but ‘உன்னில் செய்யப்பட்ட’ is somewhat wooden for events occurring in a city. ‘உன்னிடத்தில் நிகழ்ந்த’ is idiomatic modern Tamil and retains the locative sense. ‘வல்லமைமிக்க செயல்கள்’ is a natural rendering of δυνάμεις in this context.
  terminology: Use ‘ஹேடீஸ்’ for ᾅδης, with an explanatory footnote giving ‘இறந்தோரின் உலகம்’ as an alternative. This avoids equating Hades with either Gehenna or a fully defined Tamil ‘பாதாளம்.’
  issues:
  - severity: medium
    issue: ‘பாதாளம்’ is used for ᾅδης in the main text.
    rationale: Although it may be used for the realm of the dead, it can also evoke a broader underworld or infernal concept in Tamil. The Greek term is explicitly distinguished from Gehenna in the audit trail; transliteration preserves this lexical and theological distinction without over-specifying it.
  - severity: low
    issue: ‘உன்னில் செய்யப்பட்ட வல்ல செயல்கள்’ is stylistically awkward.
    rationale: The Greek refers to mighty deeds that occurred in Capernaum. ‘உன்னிடத்தில் நிகழ்ந்த வல்லமைமிக்க செயல்கள்’ is more idiomatic while preserving the city-directed personification and locative force.
  revised_text: கப்பர்நகூமே, நீ வானம்வரை உயர்த்தப்படுவாயா? ஹேடீஸ்வரை[a] இறங்குவாய். ஏனெனில், உன்னிடத்தில் நிகழ்ந்த வல்லமைமிக்க செயல்கள் சோதோமில் நிகழ்ந்திருந்தால், அது இன்றுவரை நிலைத்திருந்திருக்கும்.
