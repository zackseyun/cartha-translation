    reason: lexical_alternative
  revision_rationale: The revision retains the rhetorical negative question and the unreal past condition while rendering the deeds as events occurring in the respective cities. Most importantly, it transliterates ᾅδης as ‘ஹேடீஸ்’ and explains it in a footnote, preserving the source text’s distinction from Gehenna without importing a narrower doctrinal meaning.
