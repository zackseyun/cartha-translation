reference: Matthew 11:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ᾅδου ⸀καταβήσῃ· ὅτι εἰ ἐν Σοδόμοις ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν σοί, ⸀ἔμεινεν ἂν μέχρι τῆς σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/023.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will go down to Hades. For if the mighty works done in you had happened in Sodom, it would have remained until today.
translation:
  language: ta
  text: கப்பர்நகூமே, நீ வானம்வரை உயர்த்தப்படுவாயா? ஹேடீஸ்வரை[a] இறங்குவாய். ஏனெனில், உன்னிடத்தில் நிகழ்ந்த வல்லமைமிக்க செயல்கள் சோதோமில் நிகழ்ந்திருந்தால், அது இன்றுவரை நிலைத்திருந்திருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இறந்தோரின் உலகம்வரை.” இங்குள்ள கிரேக்கச் சொல் “ஹேடீஸ்”; இது “கெஹென்னா” அல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καφαρναούμ
  choice: கப்பர்நகூம்
  rationale: தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பைப் பயன்படுத்தி, நேரடி அழைப்பில் இயல்பாக ‘கப்பர்நகூமே’ என வடிவமைக்கப்பட்டது.
- source_word: μὴ ἕως οὐρανοῦ ὑψωθήσῃ;
  choice: நீ வானம்வரை உயர்த்தப்படுவாயா?
  rationale: μή உடன் வரும் எதிர்காலச் செயப்பாட்டு வினையை எதிர்மறையான பதிலை எதிர்பார்க்கும் வினாவாகக் கொண்டு, செயப்பாட்டு வடிவத்தையும் இடவெளி உருவகத்தையும் காக்கிறது.
- source_word: ἕως ᾅδου καταβήσῃ
  choice: பாதாளம்வரை இறங்கிப்போவாய்
  rationale: καταβαίνω என்பதன் கீழ்நோக்கிய இயக்கத்தை நேரடியாக வெளிப்படுத்துகிறது; ᾅδης என்பதை கெஹென்னாவுடன் ஒன்றாக்காமல், தமிழில் இறந்தோரின் உலகைக் குறிக்க வழக்கமாகப் பயன்படும் ‘பாதாளம்’ என வழங்குகிறது.
- source_word: δυνάμεις
  choice: வல்ல செயல்கள்
  rationale: இயேசுவின் ஆற்றல் வெளிப்படும் செயல்களைக் குறிக்கும் சொல்லின் ‘வல்லமை’ மற்றும் ‘செயல்’ ஆகிய இரு கூறுகளையும் காக்கிறது; ‘அற்புதங்கள்’ என்று மட்டும் குறுக்கவில்லை.
- source_word: γενόμεναι ἐν σοί
  choice: உன்னில் செய்யப்பட்ட
  rationale: நகரத்தை ஒருமையில் நேரடியாக அழைக்கும் மூலத்தின் ஆளுருவாக்கத்தையும் ἐν என்பதன் இடப்பொருளையும் காக்கிறது.
- source_word: ἐγενήθησαν
  choice: செய்யப்பட்டிருந்தால்
  rationale: நிகழாத கடந்தகால நிபந்தனையைத் தமிழில் தெளிவாகக் காட்டுகிறது; வல்ல செயல்களோடு இயல்பாக இணைகிறது.
- source_word: ἔμεινεν ἂν
  choice: அது நிலைத்திருந்திருக்கும்
  rationale: சோதோமை ஒருமை நகரமாக எடுத்துக்கொண்டு, நிகழ்ந்திருக்காத விளைவைக் குறிக்கும் ἄν உடைய வடிவத்தைத் தமிழில் எதிர்நிலை இறந்தகாலமாக வழங்குகிறது.
- source_word: μέχρι τῆς σήμερον
  choice: இன்றுவரை
  rationale: கால வரம்பைச் சுருக்கமாகவும் இயல்பான நவீனத் தமிழிலும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ᾅδης என்பதன் மொழிபெயர்ப்பு
  choice: பாதாளம்
  alternative: ஹேடீஸ் / இறந்தோரின் உலகம் / நரகம்
  rationale: மூலத்தில் உள்ள ᾅδης என்பதை கெஹென்னா அல்லது இறுதித் தண்டனைக்கான பொதுச் சொல்லான ‘நரகம்’ என மாற்றாமல், இறந்தோரின் உலகைக் குறிக்கும் தனித்த கருத்தை காக்கிறது. அடிக்குறிப்பு கிரேக்கச் சொல்லையும் வேறுபாட்டையும் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. நகரத்தை நேரடியாக அழைக்கும் ஆளுருவாக்கமும், வானம்–பாதாளம் என்ற எதிர்மறை இடவெளி உருவகமும், நிகழாத நிபந்தனையின் அழுத்தமும் காக்கப்பட்டுள்ளன.
