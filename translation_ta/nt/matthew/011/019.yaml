source:
  edition: SBLGNT
  text: ἦλθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγουσιν· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, τελωνῶν φίλος καὶ ἁμαρτωλῶν. καὶ ἐδικαιώθη ἡ σοφία ἀπὸ τῶν ⸀ἔργων αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/019.yaml
  text: The Son of Man came eating and drinking[a], and they say, ‘Look, a glutton and a drunkard[b], a friend of tax collectors and sinners!’ And wisdom was justified by her works.
translation:
  language: ta
  text: மனிதகுமாரன் உண்டும் குடித்தும் வந்தார்; அவர்கள், ‘இதோ, பெருந்தீனிக்காரனும் குடிகாரனுமான மனிதன்; வரி வசூலிப்பவர்களுக்கும் பாவிகளுக்கும் நண்பன்!’ என்கிறார்கள். ஞானம் அதன் செயல்களால் சரியானது என நிரூபிக்கப்பட்டது[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஞானம் அதன் செயல்களால் நியாயப்படுத்தப்பட்டது.”
    reason: ἐδικαιώθη என்பதற்கான சொல் நெருக்கமான மாற்று மொழிபெயர்ப்பு.
  - marker: b
    text: 'சில கையெழுத்துப் பிரதிகளில் “செயல்கள்” என்பதற்குப் பதிலாக “பிள்ளைகள்” என்று உள்ளது: “ஞானம் அதன் பிள்ளைகளால் சரியானது என நிரூபிக்கப்பட்டது.”'
    reason: மூலப்பாட வேறுபாடு.
lexical_decisions:
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: இயேசுவின் சுயகுறிப்புப் பட்டத்திற்கான நிலைபெற்ற தமிழ் வடிவம்; அதன் செமித்தியப் பின்னணியையும் இறையியல் எதிரொலியையும் விளக்கிச் சுருக்காமல் காக்கிறது.
- source_word: ἐσθίων καὶ πίνων
  choice: உண்டும் குடித்தும்
  rationale: யோவானின் துறவற வாழ்க்கை முறையுடன் உள்ள சூழல்சார் முரண்பாட்டைக் காக்கும் நேரடியான, இயல்பான மொழிபெயர்ப்பு; ‘விருந்துண்டு’ என்று மிகைப்படுத்தவில்லை.
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: பொதுமக்கள் முன் சுட்டிக்காட்டிக் குற்றஞ்சாட்டும் வலிமையைத் தக்கவைக்கும் இயல்பான தமிழ் சொல்.
- source_word: φάγος
  choice: பெருந்தீனிக்காரன்
  rationale: நடுநிலையான ‘அதிகம் உண்பவர்’ என்பதற்குப் பதிலாக, மூலத்திலுள்ள இழிவான குற்றச்சாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: οἰνοπότης
  choice: குடிகாரன்
  rationale: இது வெறுமனே திராட்சரசம் குடிப்பவரைக் குறிக்காமல், அளவுக்கு மீறிக் குடிப்பதாகச் சுமத்தப்படும் பழியைத் தெரிவிக்கிறது.
- source_word: τελωνῶν φίλος καὶ ἁμαρτωλῶν
  choice: வரி வசூலிப்பவர்களுக்கும் பாவிகளுக்கும் நண்பன்
  rationale: சமூக மற்றும் சமய அடையாளங்களின் குற்றஞ்சாட்டும் தொனியையும், இரு குழுக்களோடும் உள்ள நட்பைக் குறிக்கும் கிரேக்க அமைப்பையும் காக்கிறது.
- source_word: ἐδικαιώθη
  choice: சரியானது என்பது … மெய்ப்பிக்கப்பட்டது
  rationale: இச்சூழலில் வினைச்சொல் ‘சரியானதாக நிரூபிக்கப்பட்டது/நிலைநாட்டப்பட்டது’ என்ற பொருளைக் கொண்டதால், சாதாரண வாசகருக்குத் தெளிவான தமிழில் அதன் கருத்தை வழங்குகிறது; சொல் நெருக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἡ σοφία
  choice: ஞானம்
  rationale: ஞானம் யாரை அல்லது எதைச் சுட்டுகிறது என்று விளக்கிச் சுருக்காமல், மூலத்தின் உருவகப்படுத்தப்பட்ட சொல்லாட்சியையும் இறையியல் திறந்தநிலையையும் காக்கிறது.
- source_word: ἀπὸ τῶν ἔργων αὐτῆς
  choice: அதன் செயல்களால்
  rationale: SBLGNT-யின் ‘செயல்கள்’ என்ற வாசகத்தைப் பின்பற்றி, ஞானம் சரியானது என்பதற்கான சான்றாக அதன் செயல்கள் விளங்குகின்றன என்ற இடைமொழிப் பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: முடிவுக் கூற்றில் ‘ஞானம்’ என்பதன் அடையாளம்
  choice: ‘ஞானம்’ என்ற உருவகப்படுத்தப்பட்ட சொல்லை விளக்கமின்றித் தக்கவைத்தல்
  alternative: அதை இயேசு, கடவுளின் ஞானம், அல்லது கடவுளின் மீட்புத் திட்டம் என்று வெளிப்படையாக அடையாளப்படுத்துதல்
  rationale: வசனம் அந்த அடையாளத்தைத் தெளிவாக வரையறுக்கவில்லை; ஆகவே அதன் இலக்கிய மற்றும் இறையியல் பதற்றத்தை மொழிபெயர்ப்பு தீர்த்துவிடாமல் காக்கிறது.
- issue: இறுதிக் கூற்றின் மூலபாடம்
  choice: SBLGNT வாசகமான ‘செயல்கள்’ என்பதை முதன்மைப் பாடத்தில் பயன்படுத்துதல்
  alternative: சில கையெழுத்துப் பிரதிகளிலுள்ள ‘பிள்ளைகள்’ என்ற வாசகம்
  rationale: வழங்கப்பட்ட மூலப்பாடம் ἔργων (‘செயல்கள்’) என்று வாசிக்கிறது. பரவலாக அறியப்பட்ட τέκνων (‘பிள்ளைகள்’) என்ற மாற்றுப் பாடம் ஆய்வுக்காக அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. குற்றச்சாட்டின் கடுமை ‘பெருந்தீனிக்காரன்’, ‘குடிகாரன்’ என்பவற்றால் பாதுகாக்கப்படுகிறது. கிரேக்கத்தில் ஞானம் பெண்பாலாக உருவகப்படுத்தப்பட்டாலும், தமிழில் இலக்கணப் பால் அதே முறையில் செயல்படாததால் செயற்கையான பெண்பால் சுட்டுப்பெயர் சேர்க்கப்படவில்லை.
