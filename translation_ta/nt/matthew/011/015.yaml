  text: ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/015.yaml
  text: The one who has ears[a], let him hear.
translation:
  language: ta
  text: காதுகள் உள்ளவன் கேட்கட்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘காதுகள் உள்ள எவரும் கேட்கட்டும்.’ கிரேக்கத்தில் பொதுப்பொருளுடைய ஒருமை வெளிப்பாடு பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: உள்ளவன்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் கிரேக்கக் கட்டுரை-வினையெச்சத் தொடர், இந்தப் பண்புடைய எவரையும் பொதுவாகக் குறிக்கும் ஒருமை ஆண்பால் வடிவம். ‘உள்ளவன்’ அந்த இலக்கண வடிவத்தையும் பொதுப்பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ὦτα
  choice: காதுகள்
  rationale: கிரேக்கச் சொல் பன்மையில் உள்ளது. ‘காதுகள்’ என்பது அதன் நேரான, இயல்பான தமிழ் இணை; இங்கு கவனமாகக் கேட்டு உணர வேண்டும் என்ற உருவகப் பொருளுக்கும் இடமளிக்கிறது.
- source_word: ἀκουέτω
  choice: கேட்கட்டும்
  rationale: மூன்றாம் நபர் ஒருமை நிகழ்காலக் கட்டளை வடிவத்தை ‘கேட்கட்டும்’ இயல்பாக வெளிப்படுத்துகிறது. இது வெறுமனே ஒலி கேட்பது, கவனித்துக் கேட்பது, ஏற்றுக்கொள்வது ஆகிய பொருள் நிழல்களை முன்கூட்டியே சுருக்காமல் காக்கிறது.
theological_decisions:
- issue: பொதுப்பொருளுடைய ஆண்பால் ஒருமை வெளிப்பாடு
  choice: காதுகள் உள்ளவன் கேட்கட்டும்.
  alternative: காதுகள் உள்ள எவரும் கேட்கட்டும்.
  rationale: கிரேக்கத்தில் ஆண்பால் ஒருமை வடிவம் பொதுப்பொருளில் பயன்படுத்தப்பட்டுள்ளது. ‘உள்ளவன்’ அதன் ஒருமை ஆண்பால் வடிவத்தைத் தக்கவைக்கிறது; அதேவேளையில் சூழலில் இது அத்தகைய ஒவ்வொருவருக்கும் விடுக்கப்படும் அழைப்பாகப் புரிகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான கட்டளை வாக்கியம். மூலத்தின் சொல்லாக்கத் தாக்கத்தையும் ‘கேட்பது’ என்பதிலுள்ள உணர்ந்து ஏற்றுக்கொள்ளும் பொருள் நிழலையும் காக்கிறது.
