revisions:
- from: 'ஆனால் நான் உங்களுக்குச் சொல்கிறேன்: நியாயத்தீர்ப்பு நாளில் உங்களைவிட தீருவுக்கும் சீதோனுக்கும் தாங்கிக்கொள்வது எளிதாக இருக்கும்.'
  to: 'ஆனால் நான் உங்களுக்குச் சொல்கிறேன்: நியாயத்தீர்ப்பு நாளில், உங்களைவிடத் தீருவுக்கும் சீதோனுக்கும் தாங்குவது எளிதாக இருக்கும்.'
