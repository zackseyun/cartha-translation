id: MAT.11.22
reference: Matthew 11:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πλὴν λέγω ὑμῖν, Τύρῳ καὶ Σιδῶνι ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/022.yaml
  text: But I tell you[a], it will be more tolerable for Tyre and Sidon on the day of judgment than for you.
translation:
  language: ta
  text: 'ஆனால் நான் உங்களுக்குச் சொல்கிறேன்: நியாயத்தீர்ப்பு நாளில், உங்களைவிடத் தீருவுக்கும் சீதோனுக்கும் தாங்குவது எளிதாக இருக்கும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν
  choice: ஆனால்
  rationale: முந்தைய கண்டனத்துடன் வலுவான முரண்பாட்டை இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: λέγω ὑμῖν
  choice: நான் உங்களுக்குச் சொல்கிறேன்
  rationale: நேரடியான தனிப்பட்ட உரையையும் அதன் வலியுறுத்தலையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: தீருவுக்கும் சீதோனுக்கும்
  rationale: ஒப்பீட்டோடு வரும் கிரேக்க வேற்றுமையின் பொருளைத் தமிழின் நான்காம் வேற்றுமை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀνεκτότερον
  choice: தாங்கிக்கொள்வது எளிதாக
  rationale: தாங்கக்கூடிய தன்மையைக் குறிக்கும் ஒப்பீட்டுப் பொருளை ordinary modern Tamil-இல் தெளிவாக வழங்குகிறது; வெறும் ‘எளிது’ என்பதைக் காட்டிலும் எதைத் தாங்குவது என்ற கருத்தை நிலைநிறுத்துகிறது.
- source_word: ἔσται
  choice: இருக்கும்
  rationale: எதிர்கால நிலையை இயல்பான தமிழ் வாக்கிய அமைப்பில் காட்டுகிறது.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: நியாயத்தீர்ப்பு நாளில்
  rationale: வரவிருக்கும் தீர்ப்பின் காலத்தைக் குறிக்கும் சொற்றொடரைத் தெளிவாகவும் சுருக்கமாகவும் வழங்குகிறது.
- source_word: κρίσεως
  choice: நியாயத்தீர்ப்பு
  rationale: தண்டனை என்ற முடிவை மட்டும் முன்கூட்டியே நிர்ணயிக்காமல், நீதிசார் தீர்ப்பு நிகழ்வின் விரிந்த பொருளைப் பாதுகாக்கிறது.
- source_word: ἢ ὑμῖν
  choice: உங்களைவிட
  rationale: உரையாடப்படுகிறவர்களுடன் செய்யப்படும் ஒப்பீட்டை இயல்பான தமிழில் நேரடியாக நிறைவு செய்கிறது.
theological_decisions:
- issue: வரவிருக்கும் தீர்ப்பின் இயல்பு
  choice: நியாயத்தீர்ப்பு நாளில்
  alternative: ஒரு நியாயத்தீர்ப்பு நாளில்
  rationale: கிரேக்கத்தில் குறிப்புச் சுட்டு இல்லாவிட்டாலும், மத்தேயுவின் சூழலில் அறியப்பட்ட இறுதி நியாயத்தீர்ப்பு நாளையே குறிக்கிறது. கூடுதல் கோட்பாட்டு விவரங்களைச் சேர்க்காமல் அந்தச் சூழல்சார் பொருளைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடை. ‘தாங்கிக்கொள்வது எளிதாக இருக்கும்’ என்பது ἀνεκτότερον என்பதன் ஒப்பீட்டுப் பொருளை வாசகருக்கு உடனடியாகத் தெளிவாக்குகிறது. இடப்பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டிற்கு ஏற்றபடி ‘தீரு’, ‘சீதோன்’ என ஒலிபெயர்க்கப்பட்டுள்ளன.
