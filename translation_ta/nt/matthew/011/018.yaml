  text: ἦλθεν γὰρ Ἰωάννης μήτε ἐσθίων μήτε πίνων, καὶ λέγουσιν· Δαιμόνιον ἔχει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/018.yaml
  text: For John came neither eating nor drinking[a], and they say, ‘He has a demon.’
translation:
  language: ta
  text: ஏனெனில் யோவான் உண்ணாமலும் குடிக்காமலும் வந்தார்; அவர்கள், “அவருக்குப் பேய் இருக்கிறது” என்கிறார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருக்குப் பேய் பிடித்திருக்கிறது.” கிரேக்கத்தில் சொல்லுக்குச் சொல், “அவருக்குப் பேய் இருக்கிறது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: வந்தார்
  rationale: ἔρχομαι என்பதன் இறந்தகால வடிவம் யோவான் வெளிப்படையாக ஊழியத்திற்கு வந்ததைக் குறிக்கிறது; இயல்பான தமிழில் ‘வந்தார்’ இதைச் சுருக்கமாகத் தருகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத்தை இந்த வசனம் தருகிறது; ‘ஏனெனில்’ அதன் காரணவிளக்கத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: Ἰωάννης
  choice: யோவான்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவம்; சூழலில் திருமுழுக்கு யோவானைக் குறிக்கிறது.
- source_word: μήτε ἐσθίων μήτε πίνων
  choice: உண்ணாமலும் குடிக்காமலும்
  rationale: μήτε…μήτε என்ற இணை அமைப்பையும் யோவானின் துறவற வாழ்க்கைமுறையைக் குறிக்கும் சுருக்கமான சொல்லாட்சியையும் பாதுகாக்கிறது; கிரேக்கத்தில் இல்லாத அப்பம் அல்லது திராட்சரசம் போன்ற விவரங்களைச் சேர்க்கவில்லை.
- source_word: καὶ λέγουσιν
  choice: ஆனால் அவர்களோ … என்கிறார்கள்
  rationale: καί இங்கு முந்தைய நிலைக்கும் மக்களின் எதிர்வினைக்கும் இடையிலான முரண்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது. நிகழ்கால λέγουσιν-ஐ ‘என்கிறார்கள்’ என வைத்தும், குறிப்பிடப்படாத பன்மை எழுவாயை ‘அவர்கள்’ எனப் பாதுகாத்தும் உள்ளது.
- source_word: Δαιμόνιον ἔχει
  choice: அவருக்குள் பேய் இருக்கிறது
  rationale: ‘ஒரு பேயைக் கொண்டிருக்கிறார்’ என்பது தமிழில் இயல்பற்றது. ‘அவருக்குள் பேய் இருக்கிறது’ என்பது ‘பேய் பிடித்திருக்கிறது’ என்பதைவிட கிரேக்கத்தின் ‘பேய் இருக்கிறது/உள்ளது’ என்ற வடிவத்திற்கு அருகிலும், இயல்பான தமிழிலும் உள்ளது.
theological_decisions:
- issue: δαιμόνιον குறித்த குற்றச்சாட்டை மொழிபெயர்த்தல்
  choice: அவருக்குள் பேய் இருக்கிறது
  alternative: அவருக்குப் பேய் பிடித்திருக்கிறது
  rationale: இது யோவானைப் பற்றிய மக்களின் குற்றச்சாட்டு; கதைசொல்லியின் உறுதிப்படுத்தல் அல்ல. தேர்ந்த வடிவம் கிரேக்கத்தின் ‘பேய் இருக்கிறது’ என்ற சொல்லாட்சியைப் பாதுகாத்து, ‘பேய் பிடித்தவர்’ என்ற சற்றுக் கூடுதல் விளக்கமுள்ள வடிவத்தை முதன்மை உரையில் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘உண்ணாமலும் குடிக்காமலும்’ என்ற செறிவான இணைச்சொல் மூலத்தின் துறவறக் குறிப்பைப் பாதுகாக்கிறது. அடிக்குறிப்பு குறி குற்றச்சாட்டு வாக்கியத்திற்குப் பின் வைக்கப்பட்டுள்ளது.
