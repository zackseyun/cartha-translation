revisions:
- from: ஏனெனில், யோவான் உண்ணாமலும் குடிக்காமலும் வந்தார்; ஆனால் அவர்களோ, “அவருக்குள் பேய் இருக்கிறது” என்கிறார்கள்.[a]
  to: ஏனெனில் யோவான் உண்ணாமலும் குடிக்காமலும் வந்தார்; அவர்கள், “அவருக்குப் பேய் இருக்கிறது” என்கிறார்கள்.[a]
  rationale: The revision removes the unsupported adversative connective and avoids making the Greek possession idiom explicitly locative. It retains the source’s present-tense accusation (‘என்கிறார்கள்’), the indefinite plural subject (‘அவர்கள்’), and the compressed ‘neither eating nor drinking’ expression without importing food or drink details absent from Matthew.
