source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰωάννης ἀκούσας ἐν τῷ δεσμωτηρίῳ τὰ ἔργα τοῦ χριστοῦ πέμψας ⸀διὰ τῶν μαθητῶν αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/002.yaml
  text: When John heard in prison about the works of the Messiah[a], he sent word through his disciples
translation:
  language: ta
  text: யோவான் சிறையில் இருந்தபோது மேசியாவின்[a] செயல்களைக் குறித்துக் கேள்விப்பட்டு, தன் சீடர்கள் மூலம் செய்தி அனுப்பினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்துவின் செயல்கள்.”
    reason: Χριστός என்பதற்கான பாரம்பரிய மாற்று மொழிபெயர்ப்பைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக வெளிப்படுத்தப்படவில்லை
  rationale: இது கதை நகர்வைக் குறிக்கும் மென்மையான இணைப்புச்சொல்; தமிழில் வாக்கிய ஓட்டமே அந்தப் பணியை இயல்பாகச் செய்கிறது.
- source_word: ἀκούσας
  choice: கேள்விப்பட்டு
  rationale: இறந்தகாலப் பங்கேற்பு வடிவத்தின் முன்நிகழ்வை இயல்பான தமிழ் வினையெச்சம் தெரிவிக்கிறது.
- source_word: ἐν τῷ δεσμωτηρίῳ
  choice: சிறையில் இருந்தபோது
  rationale: யோவான் சிறையில் இருந்த நிலையிலேயே கேட்டார் என்பதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τὰ ἔργα
  choice: செயல்கள்
  rationale: இயேசுவின் வல்ல செயல்கள் உட்பட அவரது ஊழியச் செயல்களை விரிவாகக் குறிக்கும் ἔργα என்பதற்கான நேரடியான, இயல்பான சொல்.
- source_word: τοῦ χριστοῦ
  choice: மேசியாவின்
  rationale: இங்கு Χριστός பெயராக அல்லாமல் ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற பட்டமாகச் செயல்படுகிறது; யூதப் பின்னணியைக் காக்க ‘மேசியா’ பயன்படுத்தப்படுகிறது.
- source_word: πέμψας
  choice: செய்தி அனுப்பினார்
  rationale: அனுப்பப்பட்ட செய்தியின் உள்ளடக்கம் அடுத்த வசனத்தில் வருகிறது; தமிழில் செயலை முழுமையாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: διὰ τῶν μαθητῶν αὐτοῦ
  choice: தன் சீடர்கள் மூலம்
  rationale: διά + உறவுவேற்றுமை இடைமுக முகவர்களைக் குறிக்கிறது; ‘தன்’ என்பது αὐτοῦ யோவானைக் குறிப்பதைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இந்த இடத்தில் இச்சொல் இயேசுவின் பட்டமாக இருந்து அவரது மேசியாவுக்குரிய செயல்களைக் குறிக்கிறது. பாரம்பரியமான ‘கிறிஸ்து’ அடிக்குறிப்பில் மாற்றாகத் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடை. ‘கேள்விப்பட்டு’ என்பது வெறும் வதந்தி என்ற பொருளில் அல்ல, செய்தியைக் கேட்டறிந்தார் என்ற பொருளில் பயன்படுத்தப்பட்டுள்ளது.
