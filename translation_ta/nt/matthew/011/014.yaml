  yaml_path: translation/nt/matthew/011/014.yaml
  text: And if you are willing to accept it[b][a], he is Elijah who is to come.
translation:
  language: ta
  text: மேலும், நீங்கள் இதை ஏற்றுக்கொள்ள விரும்பினால், வரவேண்டிய எலியா இவரே.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நீங்கள் இதைப் பெற்றுக்கொள்ள விரும்பினால்.’
    reason: lexical_alternative
  - marker: b
    text: இங்கே திருமுழுக்கு யோவானே வரவேண்டிய எலியா என நேரடியாக அடையாளப்படுத்தப்படுகிறார்; மல்கியா 4:5; மத்தேயு 17:10–13 ஆகியவற்றை ஒப்பிடுக.
    reason: cross_reference
lexical_decisions:
- source_word: εἰ θέλετε δέξασθαι
  choice: நீங்கள் இதை ஏற்றுக்கொள்ள மனமுள்ளவர்களாயிருந்தால்
  rationale: θέλετε உடன் வரும் δέξασθαι வெறும் விருப்பத்தை அல்ல, ஏற்றுக்கொள்ளும் மனப்பான்மையைக் குறிக்கிறது. கிரேக்கத்தில் வெளிப்படையாக இல்லாத பொருள் தமிழில் இயல்புக்காக ‘இதை’ என்று வழங்கப்படுகிறது; அது இயேசு யோவானைப்பற்றி கூறும் அடையாளப்படுத்தலைச் சுட்டுகிறது.
- source_word: αὐτός
  choice: இவரே
  rationale: இது முன் குறிப்பிடப்பட்ட திருமுழுக்கு யோவானைச் சுட்டுகிறது. ‘இவரே’ என்பது தமிழில் இயல்பாகவும், αὐτός கொண்டிருக்கக்கூடிய வலியுறுத்தலையும் அளவோடு வெளிப்படுத்துகிறது.
- source_word: ἐστιν Ἠλίας
  choice: எலியா இவரே
  rationale: கிரேக்கத்தின் நேரடியான அடையாளப்படுத்தலை ‘எலியா இவரே’ என்று காக்கிறது; ‘எலியாவைப் போன்றவர்’ அல்லது ‘எலியாவின் பணியை நிறைவேற்றுபவர்’ என்று விளக்கி மென்மைப்படுத்தவில்லை.
- source_word: ὁ μέλλων ἔρχεσθαι
  choice: வரவிருக்கிற
  rationale: எதிர்பார்க்கப்பட்ட வருகையைச் சுட்டும் எதிர்கால நோக்கை இயல்பான தமிழில் காக்கிறது. இது ‘உடனே வரப்போகிற’ என்ற மிக அண்மையான காலப்பொருளைத் திணிப்பதில்லை.
- source_word: καὶ
  choice: மேலும்
  rationale: முந்தைய உரையோடு உள்ள இணைப்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ஆனால் தனி வசனமாக வாசிக்கும்போது வாக்கியம் கனமாகாமல் இருக்க முதன்மை உரையில் வெளிப்படையாகச் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: திருமுழுக்கு யோவானை எலியாவாக அடையாளப்படுத்துதல்
  choice: ‘வரவிருக்கிற எலியா இவரே’ என்று நேரடியாக வழங்கி, ‘நீங்கள் இதை ஏற்றுக்கொள்ள மனமுள்ளவர்களாயிருந்தால்’ என்ற நிபந்தனையையும் காத்தல்
  alternative: ‘இவர் எலியாவின் பணியை நிறைவேற்றுகிறவர்’ அல்லது ‘இவர் எலியாவைப் போன்றவர்’
  rationale: αὐτός ἐστιν Ἠλίας என்பது அடையாளப்படுத்தலைத் தெளிவாகக் கூறுகிறது; அதேவேளை அதை கேட்போர் ஏற்றுக்கொள்வதைக் குறித்த நிபந்தனையோடு இயேசு முன்வைக்கிறார். மொழிபெயர்ப்பு இந்த இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் இரு கூறுகளையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘திருமுழுக்கு யோவான்’ பொதுவாகப் புரியும் பெயர்வடிவமாக அடிக்குறிப்பில் பயன்படுத்தப்பட்டுள்ளது. வசனத்தின் நேரடியான அடையாளப்படுத்தலும் நிபந்தனைத் தன்மையும் விளக்கவுரையால் தீர்க்கப்படாமல் காக்கப்பட்டுள்ளன.
