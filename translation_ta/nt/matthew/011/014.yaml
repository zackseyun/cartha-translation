revisions:
- from: நீங்கள் இதை ஏற்றுக்கொள்ள மனமுள்ளவர்களாயிருந்தால், வரவிருக்கிற எலியா இவரே.[a][b]
  to: மேலும், நீங்கள் இதை ஏற்றுக்கொள்ள விரும்பினால், வரவேண்டிய எலியா இவரே.[a][b]
  rationale: ‘மேலும்’ மூலம் καί சேர்க்கப்பட்டுள்ளது. நிபந்தனைத் தொடரை நவீனத் தமிழில் இயல்பாக்க ‘ஏற்றுக்கொள்ள விரும்பினால்’ பயன்படுத்தப்பட்டுள்ளது. ‘வரவேண்டிய’ என்பது ὁ μέλλων ἔρχεσθαι-யின் எதிர்பார்க்கப்பட்ட எதிர்கால வருகையைத் தக்கவைக்கிறது. அடிக்குறிப்பு b, யோவானை எலியாவைப் போன்றவர் என்று மட்டுப்படுத்தாமல், மூலத்தின் நேரடியான அடையாளப்படுத்தலைக் காக்குமாறு திருத்தப்பட்டுள்ளது.
