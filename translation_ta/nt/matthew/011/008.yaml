translation_notes:
  register: நவீன தரநிலைத் தமிழ்; சொல்லாட்சிக் கேள்விகளின் வலிமையும் ‘மென்மையான’ என்ற மூலச் சொல்லின் மறுபயன்பாடும் காக்கப்பட்டுள்ளன. ‘அரண்மனை’ இயல்பான முதன்மை வாசகமாகவும், மூலத்தின் நேரடி ‘அரசர்களின் வீடுகள்’ அடிக்குறிப்பாகவும் வழங்கப்பட்டுள்ளது.
