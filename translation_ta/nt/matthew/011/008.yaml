id: MAT.11.8
reference: Matthew 11:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλὰ τί ἐξήλθατε ἰδεῖν; ἄνθρωπον ἐν ⸀μαλακοῖς ἠμφιεσμένον; ἰδοὺ οἱ τὰ μαλακὰ φοροῦντες ἐν τοῖς οἴκοις τῶν ⸀βασιλέων ⸀εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/008.yaml
  text: But what did you go out to see? A man dressed in soft clothes? Look[b][a], those who wear soft clothes are in the houses of kings.
translation:
  language: ta
  text: ஆனால், எதைப் பார்க்க நீங்கள் வெளியே சென்றீர்கள்? மென்மையான ஆடைகளை அணிந்த ஒரு மனிதரையா? இதோ, மென்மையான ஆடைகளை அணிகிறவர்கள் அரசர்களின் அரண்மனைகளில் இருக்கிறார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, ‘அரசர்களின் வீடுகளில் இருக்கிறார்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய சொல்லாட்சிக் கேள்வியிலிருந்து மாறுபாட்டைத் தொடரும் எதிர்மறை இணைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τί ἐξήλθατε ἰδεῖν
  choice: எதைப் பார்க்க நீங்கள் வெளியே சென்றீர்கள்
  rationale: τί என்பதன் ‘எதை’ என்ற கேள்வியையும், ἐξήλθατε ἰδεῖν என்பதன் நோக்கக் கருத்தான ‘பார்க்க வெளியே சென்றீர்கள்’ என்பதையும் காக்கிறது.
- source_word: ἄνθρωπον
  choice: ஒரு மனிதரை
  rationale: இங்கு யோவானைக் குறிக்கும் ஆண்பால் ஒருமையைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐν μαλακοῖς ἠμφιεσμένον
  choice: மென்மையான ஆடைகளை அணிந்த
  rationale: μαλακοῖς என்பதன் நேரடியான ‘மென்மையான’ உருவகத்தைக் காத்து, சூழலில் உள்ள நயமான அல்லது ஆடம்பரமான உடை என்ற உட்குறிப்பை வாசகர் உணர இடமளிக்கிறது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் கிரேக்க இடைச்சொல்லின் சொல்லாட்சித் தாக்கத்தை நவீன, கண்ணியமான தமிழில் காக்கிறது.
- source_word: οἱ τὰ μαλακὰ φοροῦντες
  choice: மென்மையான ஆடைகளை அணிகிறவர்கள்
  rationale: φοροῦντες குறிக்கும் வழக்கமான அணிதலை நிகழ்காலப் பொதுவினையால் காட்டி, முன்வந்த ‘மென்மையான ஆடைகள்’ என்ற சொற்றொடரையும் தொடர்கிறது.
- source_word: ἐν τοῖς οἴκοις τῶν βασιλέων εἰσίν
  choice: அரசர்களின் அரண்மனைகளில் இருக்கிறார்கள்
  rationale: ‘அரசர்களின் வீடுகள்’ என்ற மூல அமைப்பின் பொருளை இயல்பான தமிழில் ‘அரண்மனைகள்’ எனத் தெளிவுபடுத்துகிறது; அடிக்குறிப்பில் நேரடியான மாற்று தரப்படுகிறது.
