  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Πορευθέντες ἀπαγγείλατε Ἰωάννῃ ἃ ἀκούετε καὶ βλέπετε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/004.yaml
  text: And Jesus answered them[a], “Go and report to John what you hear and see:”
translation:
  language: ta
  text: 'இயேசு அவர்களுக்குப் பதிலளித்தார்[a]: “நீங்கள் போய், கேட்பவற்றையும் காண்பவற்றையும் யோவானிடம் தெரிவியுங்கள்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லாக: “இயேசு அவர்களுக்குப் பதிலளித்துச் சொன்னார்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: இயேசு...
  rationale: வசனம் முந்தைய நிகழ்வின் தொடர்ச்சியாக உள்ளது. தமிழில் தனித்து வாசிக்கும்போது இயல்பாக இருக்க, தொடக்க இணைப்புச் சொல்லை வெளிப்படையாக மொழிபெயர்க்காமல் தொடர்ச்சியை வாக்கிய அமைப்பில் உணர்த்தப்பட்டுள்ளது.
- source_word: ἀποκριθεὶς ... εἶπεν αὐτοῖς
  choice: அவர்களுக்குப் பதிலளித்தார்
  rationale: கிரேக்க மொழியின் ‘பதிலளித்து... சொன்னார்’ என்ற உரையாடல் சூத்திரத்தை இயல்பான நவீன தமிழில் சுருக்கமாகத் தருகிறது; αὐτοῖς என்பதையும் ‘அவர்களுக்கு’ எனப் பாதுகாக்கிறது.
- source_word: Πορευθέντες
  choice: நீங்கள் போய்
  rationale: கட்டளைக்கு முன் வரும் இந்தப் பங்கேற்புவினை தொடர்ச்சியான கட்டளை வலிமை பெறுகிறது; ‘போய்... தெரிவியுங்கள்’ என்பது இயல்பான தமிழ்.
- source_word: ἀπαγγείλατε
  choice: தெரிவியுங்கள்
  rationale: தாங்கள் கேட்டதையும் கண்டதையும் யோவானிடம் திரும்பச் சென்று அறிவிப்பதைச் சூழலுக்கு ஏற்ற தெளிவான சொல்லால் தருகிறது.
- source_word: Ἰωάννῃ
  choice: யோவானிடம்
  rationale: இடப்பொருள் வடிவம் மறைமுகப் பெறுநரைக் குறிக்கிறது; தமிழில் ‘யோவானிடம்’ இயல்பானது.
- source_word: ἃ ἀκούετε καὶ βλέπετε
  choice: கேட்பவற்றையும் காண்பவற்றையும்
  rationale: இரு நிகழ்கால வினைகளையும் இணையான பெயரெச்சத் தொடர்களால் தருகிறது; அவர்கள் தற்போது அனுபவித்து அறிவதைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ἀποκριθεὶς ... εἶπεν என்ற கிரேக்க உரையாடல் சூத்திரம்
  choice: அவர்களுக்குப் பதிலளித்தார்
  alternative: அவர்களுக்குப் பதிலளித்துச் சொன்னார்
  rationale: இது கோட்பாட்டுச் சிக்கல் அல்ல, நடையியல் தெரிவாகும். முக்கியப் பதிலுரைச் செயலையும் உரை தொடங்குவதையும் முதன்மை உரை இயல்பாகத் தருகிறது; மேலும் சொற்சொல்லான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதும் கண்ணியமானதும். ‘தெரிவியுங்கள்’ மரியாதைப் பன்மையையும் கட்டளையின் வலிமையையும் இயல்பாகக் காக்கிறது. வசனத்தின் முடிவிலுள்ள முக்காற்புள்ளி அடுத்த வசனத்தில் பட்டியல் தொடர்வதைக் காட்டுகிறது.
