  source_fidelity: மூலக் கிரேக்கத்தின் உரையாடல் சூத்திரமான καὶ ἀποκριθεὶς ... εἶπεν αὐτοῖς இயல்பான தமிழில் “இயேசு அவர்களுக்குப் பதிலளித்தார்” எனச் சுருக்கப்பட்டுள்ளது. αὐτοῖς, கட்டளை வலிமையுள்ள Πορευθέντες ἀπαγγείλατε, மற்றும் ἃ ἀκούετε καὶ βλέπετε ஆகியவை பொருளிழப்பின்றித் தரப்பட்டுள்ளன. தொடக்க καί தமிழில் வெளிப்படையாக இல்லாவிட்டாலும், பொருளில் இழப்பு ஏற்படவில்லை.
  naturalness: “நீங்கள் போய் ... யோவானிடம் தெரிவியுங்கள்” என்பது நவீன நிலையான தமிழில் தெளிவான, மரியாதையான, இயல்பான கட்டளை வடிவம். “கேட்பவற்றையும் காண்பவற்றையும்” இணையான அமைப்பில் நிகழ்கால அனுபவத்தின் உள்ளடக்கத்தைச் சரியாகக் குறிக்கிறது. அடுத்த வசனத்தில் உரை தொடர்வதைக் காட்டும் முக்காற்புள்ளியும் திறந்த மேற்கோளும் பொருத்தமானவை.
