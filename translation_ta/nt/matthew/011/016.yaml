  text: Τίνι δὲ ὁμοιώσω τὴν γενεὰν ταύτην; ὁμοία ἐστὶν παιδίοις ⸂καθημένοις ἐν ταῖς ἀγοραῖς ἃ προσφωνοῦντα τοῖς ἑτέροις⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/016.yaml
  text: But to what shall I compare this generation? It is like children sitting in the marketplaces[a], calling out to the others[b],
translation:
  language: ta
  text: 'ஆனால், இந்தத் தலைமுறையை எதற்கு ஒப்பிடுவேன்? இது சந்தைத் திடல்களில்[a] உட்கார்ந்து, மற்றவர்களை[b] நோக்கிக் கூப்பிடும் பிள்ளைகளைப் போன்றது:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சந்தைகளில்.’ கிரேக்கச் சொல் மக்கள் கூடிவந்த பொது சந்தைப் பகுதிகளையோ திறந்த வெளித் திடல்களையோ குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மற்ற பிள்ளைகளை.’ கிரேக்கத்தில் ‘மற்றவர்கள்’ என்று மட்டுமே உள்ளது; அவர்கள் பிள்ளைகள் என்பது உவமையின் சூழலிலிருந்து புரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίνι
  choice: எதற்கு
  rationale: ὁμοιώσω என்பதுடன் வரும் வினாவியல் வேற்றுமை ஒப்பீட்டின் இலக்கைக் கேட்கிறது. ‘எதற்கு’ என்பது கிரேக்கத்தின் பொதுவான வினாவியல் தன்மையை இயல்பான தமிழில் காக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: δέ இங்கு மென்மையான மாற்றத்தையோ முரண்பாட்டையோ குறிக்கிறது; ‘ஆனால்’ அந்த உரையாடல் திருப்பைத் தெளிவாகத் தருகிறது.
- source_word: ὁμοιώσω
  choice: ஒப்பிடுவேன்
  rationale: எதிர்கால வினைமுற்றின் சொல்லாட்சிசார் வினா வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: γενεὰν ταύτην
  choice: இந்தத் தலைமுறையை
  rationale: γενεά இங்கு இயேசுவின் காலத்தவர்களை ஒருங்கிணைத்து குறிப்பிடுகிறது; ‘தலைமுறை’ நவீனத் தமிழில் தெளிவானதும் நிலைபெற்றதுமான சொல்.
- source_word: ὁμοία ἐστὶν
  choice: போன்றது
  rationale: ஒற்றுமையைக் குறிக்கும் எளிய பயனிலையை இயல்பான தமிழில் வழங்குகிறது.
- source_word: παιδίοις
  choice: பிள்ளைகளை
  rationale: παιδίον பொதுவாகக் குழந்தைகளைக் குறிக்கிறது; இங்கு தேவையற்ற வயது நுணுக்கத்தைச் சேர்க்காமல் ‘பிள்ளைகள்’ என வழங்கப்பட்டுள்ளது.
- source_word: καθημένοις
  choice: உட்கார்ந்து
  rationale: காட்சியில் பிள்ளைகளின் நிலையைத் தெரிவிக்கும் நிகழ்காலப் பங்கேற்புச் சொல்லை இயல்பான தமிழ் வினையெச்சமாக வழங்குகிறது.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: சந்தைத் திடல்களில்
  rationale: ἀγορά என்பது வணிகமும் மக்கள் கூடுதலும் நடைபெற்ற பொது சந்தைப் பகுதி அல்லது திறந்த வெளித் திடலைக் குறிக்கிறது; ‘சந்தைத் திடல்கள்’ இரு அம்சங்களையும் காக்கிறது.
- source_word: ἃ
  choice: பிள்ளைகளைப் பற்றிய தொடர்பு வடிவமாக இயல்பாக்கப்பட்டது
  rationale: நடுநிலைப் பன்மை வடிவம் παιδίοις என்பதோடு இலக்கண ஒத்திசைவில் உள்ளது; தமிழில் தனியான தொடர்புப்பெயர் தேவையில்லாததால் ‘கூப்பிடும் பிள்ளைகள்’ என்ற பெயரெச்ச அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: προσφωνοῦντα
  choice: நோக்கிக் கூப்பிடும்
  rationale: προσφωνέω ஒருவரைச் சத்தமாக அழைப்பதையோ அவரிடம் உரையாற்றுவதையோ குறிக்கிறது; பொது இடக் காட்சிக்கு ‘கூப்பிடும்’ பொருத்தமானது.
- source_word: τοῖς ἑτέροις
  choice: மற்றவர்களை
  rationale: கிரேக்கம் ‘மற்றவர்கள்’ என்று மட்டுமே கூறுகிறது. அவர்கள் மற்ற பிள்ளைகள் என்பது உவமையின் சூழலால் புரிந்தாலும், அதை முதன்மை உரையில் வெளிப்படையாகச் சேர்க்கவில்லை.
