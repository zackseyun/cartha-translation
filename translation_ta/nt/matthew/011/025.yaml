source:
  edition: SBLGNT
  text: Ἐν ἐκείνῳ τῷ καιρῷ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ⸀ἔκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/025.yaml
  text: At that time Jesus answered and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding[b], and revealed them to little children.”
translation:
  language: ta
  text: 'அந்த நேரத்தில் இயேசு பதிலளித்துச் சொன்னார்: “தந்தையே, வானத்துக்கும் பூமிக்கும் ஆண்டவரே, நான் உம்மைப் போற்றுகிறேன்[a]. ஏனெனில், இவற்றை ஞானிகளிடமிருந்தும் விவேகமுள்ளவர்களிடமிருந்தும் நீர் மறைத்தீர்; அவற்றைச் சிறு பிள்ளைகளுக்கு[b] வெளிப்படுத்தினீர்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் உமக்கு நன்றி செலுத்துகிறேன்.” கிரேக்க வினைச்சொல் நன்றி செலுத்துதல், போற்றுதல் அல்லது வெளிப்படையாக ஏற்றுக்கொள்ளுதல் ஆகிய பொருள்களை வெளிப்படுத்தக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கைக்குழந்தைகளுக்கு.” இங்கு இச்சொல் தாழ்மையோடு அல்லது குழந்தைபோன்ற ஏற்புத்தன்மையோடு இருப்பவர்களை உருவகமாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: அந்த நேரத்தில்
  rationale: கதை நிகழும் காலச்சூழலை இயல்பான நவீனத் தமிழில் குறிக்கிறது; உடனடியான கணத்தைத் தேவையின்றி வலியுறுத்துவதில்லை.
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: மறுமொழியாகச் சொன்னார்
  rationale: முந்தைய வெளிப்படையான கேள்வி இல்லாவிட்டாலும், கிரேக்கத்தின் பதிலளித்துச் சொல்லும் கதைநடைச் சூத்திரத்தைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: Ἐξομολογοῦμαί σοι
  choice: நான் உம்மைப் போற்றுகிறேன்
  rationale: இச்சூழலில் இவ்வினைச்சொல் பாவ அறிக்கையை அல்ல, வெளிப்படையான ஏற்றுக்கொள்ளுதலுடன் கூடிய புகழையும் நன்றியையும் குறிக்கிறது. ‘போற்றுகிறேன்’ துதித் தொனியைப் பாதுகாக்கிறது; ‘நன்றி செலுத்துகிறேன்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: தந்தையே, வானத்துக்கும் பூமிக்கும் ஆண்டவரே
  rationale: இரண்டு நேரடி அழைப்புகளையும், கடவுளின் ஆட்சியுரிமையையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: இயேசுவின் போற்றுதலுக்கான காரணத்தை அறிமுகப்படுத்தும் காரணப் பொருளை வெளிப்படுத்துகிறது.
- source_word: ἔκρυψας ... ἀπεκάλυψας
  choice: நீர் மறைத்தீர் ... வெளிப்படுத்தினீர்
  rationale: இரு வினைகளிலும் தந்தையே நேரடிச் செயல்பாட்டாளராக இருப்பதை மூலத்தின் செயப்பாட்டு வடிவுக்கு ஏற்ப தெளிவாக வைத்திருக்கிறது.
- source_word: ταῦτα ... αὐτά
  choice: இவற்றை ... அவற்றை
  rationale: எவற்றைக் குறிக்கிறது என்பதை விளக்கிச் சுருக்காமல், கிரேக்கச் சுட்டுப்பெயர்களின் திறந்த குறிப்பைத் தக்கவைக்கிறது.
- source_word: ἀπὸ σοφῶν καὶ συνετῶν
  choice: ஞானிகளிடமிருந்தும் விவேகமுள்ளவர்களிடமிருந்தும்
  rationale: σοφός என்பதன் ஞானத்தையும் συνετός என்பதன் புரிந்து பகுத்தறியும் விவேகத்தையும் வேறுபடுத்திக் காட்டுகிறது.
- source_word: νηπίοις
  choice: சிறு பிள்ளைகளுக்கு
  rationale: சொல் நேரடியாகக் கைக்குழந்தைகளைக் குறிக்கக்கூடும்; இங்கு உருவகப் பயன்பாடு இருக்கலாம். ‘சிறு பிள்ளைகள்’ அந்த உருவகத்தை விளக்கவுரையாக மாற்றாமல் தக்கவைக்கிறது.
theological_decisions:
- issue: மறைத்தலிலும் வெளிப்படுத்தலிலும் கடவுளின் நேரடிச் செயல்பாடு
  choice: ‘நீர் மறைத்தீர் ... வெளிப்படுத்தினீர்’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘மறைந்திருக்க அனுமதித்தீர்’ என்று அனுமதிப் பொருளில் மென்மைப்படுத்தல்
  rationale: கிரேக்கத்தில் தந்தையை எழுவாயாகக் கொண்ட நேரடி வினைகள் உள்ளன. இறைத் தேர்வு அல்லது கடினப்படுத்துதல் பற்றிய விரிவான கோட்பாட்டைச் சேர்க்காமல், வசனத்தின் இறையியல் பதற்றம் அப்படியே பாதுகாக்கப்படுகிறது.
- issue: νηπίοις என்பதன் பொருள்
  choice: உருவகத்தைப் பாதுகாக்கும் ‘சிறு பிள்ளைகளுக்கு’
  alternative: நேரடியான ‘கைக்குழந்தைகளுக்கு’ அல்லது விளக்கவுரையான ‘தாழ்மையானவர்களுக்கு’
  rationale: இச்சொல் ஞானிகளுக்கும் விவேகமுள்ளவர்களுக்கும் எதிர்நிலையில் வருகிறது. ‘சிறு பிள்ளைகள்’ என்ற மொழிபெயர்ப்பு குழந்தைபோன்ற ஏற்புத்தன்மை அல்லது சமூகச் சிறுமை ஆகிய சாத்தியங்களை ஒன்றாகச் சுருக்காமல் உருவகத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. கடவுளை நேரடியாக அழைக்கும் இடத்தில் மரியாதைப் பன்மை வடிவங்களான ‘உம்மை’, ‘நீர்’, ‘மறைத்தீர்’, ‘வெளிப்படுத்தினீர்’ பயன்படுத்தப்பட்டுள்ளன. தேவையற்ற சமயக்குழுச் சொற்களும் விளக்கவுரைகளும் தவிர்க்கப்பட்டுள்ளன.
