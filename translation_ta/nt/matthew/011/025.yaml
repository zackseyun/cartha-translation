revisions:
- from: 'அந்த நேரத்தில் இயேசு மறுமொழியாகச் சொன்னார்: “தந்தையே, வானத்துக்கும் பூமிக்கும் ஆண்டவரே, நான் உம்மைப் போற்றுகிறேன்[a]. ஏனெனில், இவற்றை ஞானிகளிடமிருந்தும் விவேகமுள்ளவர்களிடமிருந்தும் நீர் மறைத்தீர்; சிறு பிள்ளைகளுக்கு[b] அவற்றை வெளிப்படுத்தினீர்.”'
  to: 'அந்த நேரத்தில் இயேசு பதிலளித்துச் சொன்னார்: “தந்தையே, வானத்துக்கும் பூமிக்கும் ஆண்டவரே, நான் உம்மைப் போற்றுகிறேன்[a]. ஏனெனில், இவற்றை ஞானிகளிடமிருந்தும் விவேகமுள்ளவர்களிடமிருந்தும் நீர் மறைத்தீர்; அவற்றைச் சிறு பிள்ளைகளுக்கு[b] வெளிப்படுத்தினீர்.”'
  rationale: 'மூலப் பொருள், இறையியல் பதற்றம், மற்றும் உருவகத்தின் திறந்தநிலை அனைத்தும் மாற்றமின்றி வைக்கப்பட்டுள்ளன. இரண்டு சிறிய நடைத்திருத்தங்கள் மட்டுமே செய்யப்பட்டுள்ளன: கிரேக்கக் கதைநடைச் சூத்திரத்திற்கான நேரடியான தமிழ் வடிவம் மற்றும் வெளிப்படுத்துதல் வாக்கியத்தின் இயல்பான சொல் வரிசை.'
