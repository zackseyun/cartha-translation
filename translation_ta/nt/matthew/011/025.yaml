  source_fidelity: மூலக் கிரேக்கத்தின் காலக் குறிப்பு, ‘பதிலளித்துச் சொன்னார்’ என்னும் கதைநடைச் சூத்திரம், தந்தையிடம் நேரடியான அழைப்பு, மறைத்தல்/வெளிப்படுத்தல் ஆகியவற்றில் கடவுளின் நேரடிச் செயல்பாடு, மற்றும் νηπίοις-இன் உருவகத் திறந்தநிலை ஆகியவை வரைவில் நன்றாகப் பாதுகாக்கப்பட்டுள்ளன. மாற்றம் பொருள் மாற்றமல்ல; தமிழ் வாக்கிய ஒழுங்கை இயல்பாக்குவதே நோக்கம்.
  naturalness: ‘சிறு பிள்ளைகளுக்கு அவற்றை வெளிப்படுத்தினீர்’ என்பது இலக்கணப்படி ஏற்கத்தக்கது; ஆனால் ‘அவற்றைச் சிறு பிள்ளைகளுக்கு வெளிப்படுத்தினீர்’ என்ற இயல்பான பொருள்-பெறுநர் வரிசை நவீன நிலையான தமிழில் தெளிவாகவும் சீராகவும் அமையும். ‘மறுமொழியாகச் சொன்னார்’ என்பதற்குப் பதில் ‘பதிலளித்துச் சொன்னார்’ என்பது ἀποκριθεὶς ... εἶπεν என்பதனை நேரடியாகவும் இயல்பாகவும் காட்டுகிறது.
