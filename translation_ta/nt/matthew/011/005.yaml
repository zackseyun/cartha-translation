source:
  edition: SBLGNT
  text: τυφλοὶ ἀναβλέπουσιν καὶ χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται καὶ κωφοὶ ἀκούουσιν, ⸀καὶ νεκροὶ ἐγείρονται καὶ πτωχοὶ εὐαγγελίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/005.yaml
  text: The blind receive sight and the lame walk[a], lepers are cleansed and the deaf hear[b], and the dead are raised and the poor have good news proclaimed to them.
translation:
  language: ta
  text: பார்வையற்றோர் பார்வை பெறுகிறார்கள்; நடக்க இயலாதோர் நடக்கிறார்கள்; தொழுநோயாளிகள் தூய்மையாக்கப்படுகிறார்கள்; செவிடர்கள் கேட்கிறார்கள்; இறந்தோர் உயிர்த்தெழுப்பப்படுகிறார்கள்; ஏழைகளுக்கு நற்செய்தி அறிவிக்கப்படுகிறது.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “ஏழைகளுக்குச் சுவிசேஷம் பிரசங்கிக்கப்படுகிறது.” கிரேக்க வினைச்சொல் செயலப்பாட்டு வடிவில் உள்ளது: நற்செய்தி ஏழைகளுக்கு அறிவிக்கப்படுகிறது.'
    reason: lexical_alternative
  - marker: b
    text: இந்தப் பட்டியல் ஏசாயா 35:5–6; 61:1 ஆகிய பகுதிகளை எதிரொலிக்கிறது; மெசியாவின் செயலோடு தொடர்புடைய அடையாளங்களை முன்வைக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: τυφλοὶ ἀναβλέπουσιν
  choice: பார்வையற்றோர் பார்வை பெறுகிறார்கள்
  rationale: குணமாக்கும் சூழலில் ἀναβλέπω என்பது பார்வையைப் பெறுதல் அல்லது மீண்டும் பெறுதல் என்று பொருள்படும். ஒருவர் முன்பு பார்த்தவரா என்பதை கிரேக்கம் குறிப்பிடாததால், இயல்பானதும் பொதுவானதுமான சொல்லாக்கம் பயன்படுத்தப்பட்டது.
- source_word: χωλοὶ περιπατοῦσιν
  choice: நடக்க இயலாதோர் நடக்கிறார்கள்
  rationale: χωλός என்பது இயல்பாக நடக்க முடியாதவர்களைக் குறிக்கிறது. நவீன தமிழில் மரியாதையுடனும் தெளிவாகவும் இருக்க நபரை மையப்படுத்தும் சொல்லாக்கம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: λεπροὶ καθαρίζονται
  choice: தொழுநோயாளிகள் தூய்மையாக்கப்படுகிறார்கள்
  rationale: καθαρίζονται என்பதன் செயலப்பாட்டு வடிவத்தையும், உடல்நல மீட்புடன் சடங்குசார் தூய்மையையும் உள்ளடக்கும் பொருளையும் ‘தூய்மையாக்கப்படுகிறார்கள்’ காக்கிறது.
- source_word: κωφοὶ ἀκούουσιν
  choice: செவிடர்கள் கேட்கிறார்கள்
  rationale: κωφός என்பது செவிடர் அல்லது பேச இயலாதவர் என அமையலாம்; ஆனால் ἀκούουσιν உடன் வருவதால் இங்கே செவிடர்களே தெளிவாகக் குறிக்கப்படுகின்றனர்.
- source_word: νεκροὶ ἐγείρονται
  choice: இறந்தோர் உயிருடன் எழுப்பப்படுகிறார்கள்
  rationale: ἐγείρονται என்பதன் செயலப்பாட்டு வடிவம் காக்கப்படுகிறது. தமிழில் உயிர்த்தெழச் செய்யப்படுதல் தெளிவாகத் தெரிய ‘உயிருடன்’ சேர்க்கப்பட்டது; செய்பவர் கிரேக்கத்தைப் போல வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
- source_word: πτωχοὶ εὐαγγελίζονται
  choice: ஏழைகளுக்கு நற்செய்தி அறிவிக்கப்படுகிறது
  rationale: 'εὐαγγελίζονται என்பதன் செயலப்பாட்டுப் பொருளை இயல்பான தமிழில் காக்கிறது: ஏழைகள் நற்செய்தியின் பெறுநர்கள். பிற்கால திருச்சபைத் தொழில்நுட்பச் சொல்லாக்கத்தை முதன்மை உரையில் திணிக்கவில்லை.'
theological_decisions:
- issue: εὐαγγελίζονται என்பதையும் ‘நற்செய்தி’ சொற்பயன்பாட்டையும் மொழிபெயர்த்தல்
  choice: ஏழைகளுக்கு நற்செய்தி அறிவிக்கப்படுகிறது
  alternative: ஏழைகளுக்குச் சுவிசேஷம் பிரசங்கிக்கப்படுகிறது
  rationale: தெய்வீக நற்செய்தி அறிவிக்கப்படுவதையும் செயலப்பாட்டு கருத்தையும் காக்கும் அதேவேளையில், சாதாரண நவீன வாசகருக்கு இயல்பாக உள்ளது; பிற்காலத் திருச்சபை வழக்கைத் தேவையின்றி முன்வைக்கவில்லை.
- issue: இந்த அற்புதப் பட்டியலை மெசியாவின் செயலுக்கான சான்றாக விளக்குதல்
  choice: அற்புதச் செயல்களை உரையில் இருப்பதுபோல நேரடியாகக் கூறுதல்
  alternative: ‘மெசியாவைப் பற்றிய தீர்க்கதரிசனம் நிறைவேறுவதற்காக’ என்ற விளக்கத்தை முதன்மை உரையில் சேர்த்தல்
  rationale: ஏசாயா நூலுக்கான எதிரொலி வலுவானது; ஆனால் கிரேக்க வசனம் நிறைவேற்றம் குறித்த விளக்கத்தை வெளிப்படையாகச் சேர்க்கவில்லை. ஆகவே அந்தத் தொடர்பு அடிக்குறிப்பில் சுட்டப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமானதும் சாதாரண வாசகர்களுக்குத் தெளிவானதுமான நடையில் மொழிபெயர்க்கப்பட்டது. பட்டியலின் சுருக்கமான இணை அமைப்பு அரைப்புள்ளிகளால் காக்கப்பட்டது. மாற்றுத்திறனாளிகளைக் குறிக்கும் இடத்தில் அவமதிப்பற்ற, நபர் மையமான மொழி பயன்படுத்தப்பட்டது; ‘தூய்மையாக்கப்படுகிறார்கள்’, ‘எழுப்பப்படுகிறார்கள்’, ‘அறிவிக்கப்படுகிறது’ ஆகிய செயலப்பாட்டு வடிவங்கள் மூலத்தின் இறையியல் திறந்தநிலையைப் பாதுகாக்கின்றன.
