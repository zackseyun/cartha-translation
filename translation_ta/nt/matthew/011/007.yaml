id: MAT.11.7
reference: Matthew 11:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τούτων δὲ πορευομένων ἤρξατο ὁ Ἰησοῦς λέγειν τοῖς ὄχλοις περὶ Ἰωάννου· Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/007.yaml
  text: 'As these men were going away[b][a], Jesus began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed being shaken by the wind?”'
translation:
  language: ta
  text: 'அவர்கள் புறப்பட்டுச் சென்றுகொண்டிருந்தபோது, இயேசு யோவானைப் பற்றி மக்கள் கூட்டத்தினரிடம் பேசத் தொடங்கினார்: “எதைப் பார்க்க நீங்கள் பாலைநிலத்துக்குப் புறப்பட்டுச் சென்றீர்கள்?[a] காற்றால் அசைக்கப்படும் ஒரு நாணலையா?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எதைக் காண நீங்கள் பாலைநிலத்துக்குப் புறப்பட்டுச் சென்றீர்கள்?”
    reason: θεάομαι என்பதற்கு ‘பார்க்க’ என்றும் ‘காண’ என்றும் மொழிபெயர்க்க முடியும்.
  - marker: b
    text: காற்றால் அசைக்கப்படும் நாணல், நிலையின்மை அல்லது தடுமாற்றத்தைக் குறிக்கும் உருவகமாக இருக்கலாம்; யோவான் அப்படிப்பட்டவர் அல்ல என்ற எதிர்மறை விடையை இயேசுவின் கேள்வி எதிர்பார்க்கிறது.
    reason: உருவகத்தின் சாத்தியமான கருத்தையும் வினாவின் சொல்லாட்சித் தாக்கத்தையும் விளக்கும் குறிப்பு.
lexical_decisions:
- source_word: Τούτων δὲ πορευομένων
  choice: அவர்கள் புறப்பட்டுச் சென்றுகொண்டிருந்தபோது
  rationale: தனித்த வேற்றுமைத் தொகைமைச் சொற்றொடர், முதன்மை நிகழ்வுடன் ஒரே நேரத்தில் நடைபெறும் செயலைக் குறிக்கிறது. முந்தைய சூழலில் உள்ள யோவானின் சீடர்களையே “அவர்கள்” இயல்பாகச் சுட்டுகிறது; “சென்றுகொண்டிருந்தபோது” என்பது பங்கேற்புவினையின் தொடரும் தன்மையைப் பேணுகிறது.
- source_word: ἤρξατο ... λέγειν
  choice: பேசத் தொடங்கினார்
  rationale: ἄρχομαι + வினையெச்ச அமைப்பின் ‘தொடங்குதல்’ என்ற பொருளைத் தெளிவாகக் கொடுக்கிறது; மக்கள் கூட்டத்தினரிடம் நிகழும் உரைக்கு நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: τοῖς ὄχλοις
  choice: மக்கள் கூட்டத்தினரிடம்
  rationale: மூலத்தில் பன்மை இருந்தாலும், தமிழில் கூட்டு ஒருமையுடன் மனிதப் பன்மையை உணர்த்தும் இந்த வடிவம் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: περὶ Ἰωάννου
  choice: யோவானைப் பற்றி
  rationale: περί + உடைமை வேற்றுமை இங்கு உரையின் பொருளை அல்லது தலைப்பைக் குறிக்கிறது; “பற்றி” என்பது தற்போதைய தமிழில் நேரடியான வடிவம்.
- source_word: Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι;
  choice: எதைப் பார்க்க நீங்கள் பாலைநிலத்துக்குப் புறப்பட்டுச் சென்றீர்கள்?
  rationale: τί என்பதை ‘ஏன்?’ என்று அல்லாமல் ‘எதை?’ என்று மொழிபெயர்க்கிறது. θεάομαι என்பதன் நோக்கத்துடன் பார்த்தல் என்ற நுணுக்கத்தை “பார்க்க” காக்கிறது; ἔρημος என்பதற்கு யூதேயாவின் குடியிருப்பற்ற வறண்ட பகுதியை உணர்த்தும் “பாலைநிலம்” பயன்படுத்தப்பட்டுள்ளது.
- source_word: κάλαμον
  choice: ஒரு நாணலை
  rationale: κάλαμος என்பதன் வழக்கமான பொருளான ‘நாணல்’ ஒருமையில் பேணப்பட்டு, வினாவுக்கேற்ற இரண்டாம் வேற்றுமை வடிவில் தரப்பட்டுள்ளது.
- source_word: ὑπὸ ἀνέμου σαλευόμενον
  choice: காற்றால் அசைக்கப்படும்
  rationale: செயப்பாட்டு பங்கேற்புவினையை நெருக்கமாகப் பேணி, காற்றின் தாக்கத்தால் நாணல் அசைவதை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: Τούτων (‘இவர்கள்/அவர்கள்’) என்பதன் சுட்டுப்பொருள்
  choice: முந்தைய உடனடி சூழலில் வரும் யோவானின் சீடர்களைச் சுட்டும் “அவர்கள்”
  alternative: “யோவானின் சீடர்கள்” என்று வெளிப்படையாகப் பெயரிடுதல் அல்லது “இவர்கள்” என்று நேரடிச் சுட்டாக மொழிபெயர்த்தல்
  rationale: சூழல் சுட்டுப்பொருளைத் தெளிவாக்குகிறது. இருப்பினும் மூலத்தில் இல்லாத பெயர்ச்சொற்றொடரை வசனத்துக்குள் சேர்க்காமல், இயல்பான தமிழுக்காக “அவர்கள்” பயன்படுத்தப்பட்டுள்ளது.
- issue: காற்றால் அசைக்கப்படும் நாணலின் மறைபொருள்
  choice: உருவகத்தை விளக்காமல் வசனத்தில் அப்படியே வைத்தல்
  alternative: நிலையற்ற அல்லது மனம் மாறுகிற மனிதன் என்று வசனத்திலேயே விளக்குதல்
  rationale: இயேசுவின் சொல்லாட்சியில் உள்ள உருவகத் திறனையும் எதிர்மறை விடையை எதிர்பார்க்கும் வினாவையும் பேணுகிறது; விளக்கத்தை அடிக்குறிப்பில் மட்டும் தருவதால் பொருளை தேவையின்றி உறுதிப்படுத்துவது தவிர்க்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் மரியாதைமிக்க உரைநடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. “வனாந்தரம்” என்ற மரபுவழிச் சொல்லுக்குப் பதிலாக இயல்பான “பாலைநிலம்” பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் சொல்லாட்சிவினாக்களும் உருவகத் தெளிவின்மையும் பேணப்பட்டுள்ளன.
