  source_fidelity: மூலத்தின் genitive absolute-இன் தொடர்நிகழ்வும், ἤρξατο + infinitive அமைப்பின் ‘தொடங்கினார்’ என்ற பொருளும், கூட்டங்களுக்கான உரையும், யோவானைப் பற்றிய தலைப்பும் சரியாகப் பேணப்பட்டுள்ளன. τί என்பதற்கு ‘எதை?’ என்றும் θεάσασθαι என்பதற்கு நோக்கத்துடன் ‘பார்க்க’ என்றும் வழங்கப்பட்டுள்ளது. ‘காற்றால் அசைக்கப்படும் ஒரு நாணலையா?’ என்பது κάλαμον ὑπὸ ἀνέμου σαλευόμενον என்பதன் சொல்லாட்சிவினா மற்றும் செயப்பாட்டு நுணுக்கத்தைத் தக்கவைக்கிறது.
