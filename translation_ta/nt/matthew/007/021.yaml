source:
  edition: SBLGNT
  text: Οὐ πᾶς ὁ λέγων μοι· Κύριε κύριε εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν, ἀλλ’ ὁ ποιῶν τὸ θέλημα τοῦ πατρός μου τοῦ ἐν ⸀τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/021.yaml
  text: Not everyone who says to me[a], ‘Lord, Lord,’ will enter into the kingdom of heaven[b], but the one who does the will of my Father who is in heaven will enter.
translation:
  language: ta
  text: “‘ஆண்டவரே, ஆண்டவரே’ என்று என்னிடம் சொல்கிற எல்லாரும் பரலோக அரசுக்குள்[a] நுழைவார்கள் என்பதில்லை. பரலோகத்தில்[b] இருக்கும் என் தந்தையின் விருப்பத்தைச் செய்கிறவரே நுழைவார்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு நெருக்கமாக, “வானங்களின் அரசு.” மத்தேயு இந்தச் சொற்றொடரை அடிக்கடி பயன்படுத்துகிறார்; வேறு இடங்களில் இதற்கு இணையாக “கடவுளின் அரசு” என்று வருகிறது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் “வானங்களில்” என்று பன்மையில் உள்ளது; இயல்பான தமிழில் “பரலோகத்தில்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ πᾶς ὁ λέγων μοι
  choice: என்று என்னிடம் சொல்கிற எல்லாரும் ... நுழைவார்கள் என்பதில்லை
  rationale: Οὐ πᾶς தரும் பகுதி மறுப்பை (‘எல்லாரும் அல்ல’) தெளிவாகக் காக்கிறது; அதை ‘யாரும் நுழையமாட்டார்கள்’ என்ற முழு மறுப்பாக மாற்றவில்லை. நிகழ்காலப் பங்கேற்புச் சொல் இயல்பான தொடர்புத் தொடராக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: Κύριε κύριε
  choice: ஆண்டவரே, ஆண்டவரே
  rationale: κύριος என்பதற்கான வழக்கமான, கண்ணியமான தமிழ் இணை ‘ஆண்டவர்’; இருமுறை அழைக்கும் வலியுறுத்தலும் அப்படியே காக்கப்பட்டுள்ளது.
- source_word: εἰσελεύσεται
  choice: நுழைவார் / நுழைவார்கள்
  rationale: எதிர்காலச் செயலை இயல்பான தமிழில் தருகிறது. இரண்டாம் கூறில் கிரேக்கத்தில் உள்ளுறைவாக இருக்கும் வினை, தமிழில் எதிர்மறை–நேர்மறை முரணைத் தெளிவாக்க மீண்டும் கூறப்பட்டுள்ளது.
- source_word: εἰς τὴν βασιλείαν τῶν οὐρανῶν
  choice: பரலோக அரசில்
  rationale: βασιλεία-வின் ஆட்சி/அரசு கருத்தை ‘அரசு’ காக்கிறது; மத்தேயுவின் பன்மை ‘வானங்கள்’ என்பது இயல்பான தமிழில் ‘பரலோகம்’ என வழங்கப்படுகிறது. εἰς உடன் வரும் நுழைவு இலக்கு தமிழில் ‘-இல்’ மூலம் இயல்பாக வெளிப்படுகிறது.
- source_word: ἀλλ’ ὁ ποιῶν
  choice: செய்கிறவரே
  rationale: சொல்வதற்கும் செய்வதற்கும் இடையிலான முக்கிய முரணை ‘-ஏ’ வலியுறுத்தல் காக்கிறது; ஒருமை சார்ந்த பெயரெச்ச அமைப்பும் பேணப்பட்டுள்ளது.
- source_word: τὸ θέλημα τοῦ πατρός μου
  choice: என் தந்தை விரும்புவதை
  rationale: ‘சித்தம்’ போன்ற மரபுசார் சொல்லைத் தவிர்த்து, θέλημα குறிக்கும் தந்தையின் நோக்கம்/விருப்பத்தை நவீன, இயல்பான தமிழில் தருகிறது; ‘செய்கிற’ என்பதால் கீழ்ப்படிதல் சார்ந்த செயற்பாடு நிலைக்கிறது.
- source_word: τοῦ ἐν τοῖς οὐρανοῖς
  choice: பரலோகத்தில் இருக்கிற
  rationale: தந்தையை விவரிக்கும் கிரேக்க அடைமொழித் தொடரை நேரடியாகக் காக்கிறது; பன்மை வடிவம் தமிழின் வழக்குக்கு ஏற்ப ஒருமை ‘பரலோகம்’ என வழங்கப்படுகிறது.
theological_decisions:
- issue: வாயால் இயேசுவை ஆண்டவர் என அழைப்பதற்கும் தந்தையின் விருப்பத்தைச் செய்வதற்கும் உள்ள உறவு
  choice: வெறும் வாய்மொழி அழைப்பு போதாது என்பதையும் தந்தை விரும்புவதைச் செய்கிறவரையே வசனம் எதிர்மறை–நேர்மறை முரணில் முன்னிறுத்துவதையும் மொழிபெயர்ப்பு காக்கிறது.
  alternative: இந்த ஒரே வசனத்திலிருந்து செயல்களால் தகுதி பெறுதல் என்ற முழுமையான இரட்சிப்புக் கோட்பாட்டையோ, வாய்மொழி அறிக்கை மட்டும் போதும் என்ற கோட்பாட்டையோ உருவாக்குதல்.
  rationale: கிரேக்கம் ‘சொல்கிறவர்’ என்பதையும் ‘செய்கிறவர்’ என்பதையும் வெளிப்படையாக முரண்படுத்துகிறது; ஆனால் இரட்சிப்பின் முழுக் கோட்பாட்டை இவ்வசனம் தனியாக விளக்கவில்லை. ஆகவே அந்த இறையியல் பதற்றம் தீர்க்கப்படாமல் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. பகுதி மறுப்பு தெளிவாக இருக்க ‘எல்லாரும் ... என்பதில்லை’ பயன்படுத்தப்பட்டது. பாரம்பரியமான ஆனால் சிலருக்கு தெளிவில்லாத ‘சித்தம்’ என்பதற்குப் பதில் இயல்பான ‘விரும்புவதை’ தேர்ந்தெடுக்கப்பட்டது.
