source:
  edition: SBLGNT
  text: Αἰτεῖτε, καὶ δοθήσεται ὑμῖν· ζητεῖτε, καὶ εὑρήσετε· κρούετε, καὶ ἀνοιγήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/007.yaml
  text: Ask[a], and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: ta
  text: கேளுங்கள்[a], உங்களுக்குக் கொடுக்கப்படும்; தேடுங்கள், கண்டடைவீர்கள்; தட்டுங்கள், உங்களுக்குத் திறக்கப்படும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'கிரேக்க நிகழ்கால ஏவல்வடிவங்களைத் தொடர்ச்சியான பொருளிலும் புரிந்துகொள்ளலாம்: “தொடர்ந்து கேளுங்கள் … தொடர்ந்து தேடுங்கள் … தொடர்ந்து தட்டுங்கள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αἰτεῖτε
  choice: கேளுங்கள்
  rationale: நிகழ்காலச் செயப்பாட்டு ஏவல் பன்மையை இயல்பான, மரியாதைமிக்க தமிழில் தெரிவிக்கிறது. தொடர்ச்சியான செயல் என்ற நுட்பத்தை அடிக்குறிப்பில் குறிப்பிடுகிறது.
- source_word: δοθήσεται
  choice: கொடுக்கப்படும்
  rationale: எதிர்காலச் செயப்பாட்டுவினையைப் பாதுகாத்து, கொடுப்பவர் யார் என்பதை கிரேக்கத்தைப் போல வெளிப்படையாகச் சொல்லாமல் விடுகிறது.
- source_word: ὑμῖν
  choice: உங்களுக்கு
  rationale: கிரேக்க வேற்றுமை உறவைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ζητεῖτε
  choice: தேடுங்கள்
  rationale: கட்டளையின் வலிமையையும் நேரடி மற்றும் உருவகப் பொருள் சாத்தியங்களையும் தக்கவைக்கிறது.
- source_word: εὑρήσετε
  choice: கண்டடைவீர்கள்
  rationale: எதிர்காலச் செயப்பாட்டை இயல்பான தமிழில் தெரிவிக்கிறது; தேடலுக்குப் பின் அடைவது என்ற இணைப்பையும் தெளிவாக்குகிறது.
- source_word: κρούετε
  choice: தட்டுங்கள்
  rationale: கதவு போன்ற ஒன்றைத் தட்டுதல் என்ற பொருளுக்கான இயல்பான தமிழ் ஏவல்வடிவம்.
- source_word: ἀνοιγήσεται
  choice: திறக்கப்படும்
  rationale: கிரேக்க எதிர்காலச் செயப்பாட்டுவினையைப் பாதுகாக்கிறது; திறப்பவர் மறைமுகமாகவே இருக்கிறார்.
- source_word: καὶ
  choice: ; மூலம் இணைக்கப்பட்ட இணை அமைப்பு
  rationale: தமிழில் ஒவ்வொரு கட்டளை–வாக்குறுதி இணைப்பும் அரைப்புள்ளியால் இயல்பாகப் பிரிக்கப்படுகிறது; கிரேக்கத்தின் தாளமிக்க இணை அமைப்பு தக்கவைக்கப்படுகிறது.
theological_decisions:
- issue: மூன்று நிகழ்கால ஏவல்வினைகளின் வினையம்சம்
  choice: முதன்மை உரையில் எளிய கட்டளைகளாக ‘கேளுங்கள், தேடுங்கள், தட்டுங்கள்’ என்று மொழிபெயர்த்து, தொடர்ச்சியான பொருள் சாத்தியத்தை அடிக்குறிப்பில் தருதல்.
  alternative: ‘தொடர்ந்து கேட்டுக்கொண்டிருங்கள் … தொடர்ந்து தேடிக்கொண்டிருங்கள் … தொடர்ந்து தட்டிக்கொண்டிருங்கள்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: கிரேக்க நிகழ்கால ஏவல்வடிவங்கள் நீடித்த அல்லது மீள்மீள் செயலை உணர்த்தக்கூடும்; ஆனால் அந்தப் பொருளை விரிவாக்கி முதன்மை உரையிலேயே கட்டாயப்படுத்துவதில்லை. இவ்வாறு மொழிபெயர்ப்பது உண்மையான வினையம்சத் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நடை. மூன்று இணையான கட்டளை–வாக்குறுதி தொடர்களின் சுருக்கமும் ஓசைநயமும் காக்கப்பட்டுள்ளன.
