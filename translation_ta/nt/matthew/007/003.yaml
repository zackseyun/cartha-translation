  naturalness: The draft is generally clear, but placing ‘ஏன்’ only with the second clause makes its scope less immediately clear in Tamil. Recasting the paired rhetorical question with parallel verbal clauses gives a smoother modern-standard Tamil sentence and makes clear that the question concerns the contrast as a whole.
  terminology: ‘சிறுதுரும்பு’ and ‘மரக்கட்டை’ are understandable, appropriately contrasting terms. No theological terminology issue arises. No footnotes are necessary in Tamil for this verse.
  issues:
  - severity: low
    issue: Scope and placement of ‘ஏன்’ in the Tamil question
    rationale: Greek τί introduces the whole rhetorical contrast (‘Why do you see … but not notice …?’). In the draft, ‘ஏன்’ occurs only immediately before ‘கவனிக்காமல் இருக்கிறாய்,’ which can momentarily sound as though it questions only the failure to notice. Parallel wording improves clarity without altering meaning.
  revised_text: ஆனால், உன் சகோதரனின் கண்ணில் இருக்கும் சிறுதுரும்பை நீ ஏன் பார்க்கிறாய், உன் சொந்தக் கண்ணில் இருக்கும் மரக்கட்டையை ஏன் கவனிப்பதில்லை?
