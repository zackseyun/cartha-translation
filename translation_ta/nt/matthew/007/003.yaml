id: MAT.7.3
reference: Matthew 7:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ ἐν τῷ σῷ ὀφθαλμῷ δοκὸν οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/003.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: ta
  text: ஆனால், உன் சகோதரனின் கண்ணில் இருக்கும் சிறுதுரும்பை நீ ஏன் பார்க்கிறாய், உன் சொந்தக் கண்ணில் இருக்கும் மரக்கட்டையை ஏன் கவனிப்பதில்லை?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί
  choice: ஏன்
  rationale: βλέπεις என்பதுடன் வரும் இவ்வினாவாக்கியத்தில் τί, நேரடியான ‘என்ன’ என்பதைவிட காரணம் கேட்கும் ‘ஏன்’ என்ற சொல்லாட்சிப் பொருளைக் கொண்டுள்ளது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய போதனையிலிருந்து வரும் மென்மையான எதிர்மறைத் திருப்பத்தை இயல்பான தமிழில் காட்டுகிறது.
- source_word: βλέπεις
  choice: பார்க்கிறாய்
  rationale: கண்ணைப் பற்றிய உருவகத்தைத் தக்கவைத்தும், பின்னர் வரும் κατανοεῖς என்பதிலிருந்து சொற்பொருள் வேறுபாட்டைக் காத்தும் உள்ளது.
- source_word: κάρφος
  choice: சிறுதுரும்பு
  rationale: கண்ணில் படக்கூடிய மிகச் சிறிய உலர்ந்த துகள் அல்லது மரச்சிதல் என்ற பரப்பை இயல்பான தமிழில் உணர்த்துகிறது; δοκός உடனான மிகைப்படுத்தப்பட்ட வேறுபாடும் தெளிவாகிறது.
- source_word: ἀδελφοῦ
  choice: சகோதரன்
  rationale: மூலத்தின் ஆண்பால் ஒருமை உறவுமுறைச் சொல்லை நடுநிலைப்படுத்தாமல் துல்லியமாகத் தக்கவைக்கிறது.
- source_word: σῷ
  choice: உன் சொந்த
  rationale: மற்றவருடைய கண்ணுக்கும் ஒருவருடைய கண்ணுக்கும் இடையிலான வலியுறுத்தப்பட்ட முரண்பாட்டை வெளிப்படுத்துகிறது.
- source_word: δοκόν
  choice: மரக்கட்டை
  rationale: δοκός என்பது பெரிய கட்டுமான மரத்துண்டு அல்லது உத்திரத்தைக் குறிக்கிறது. ‘மரக்கட்டை’ சாதாரண வாசகருக்குப் புரியும் வகையில் அதன் அளவையும் மிகைப்படுத்தப்பட்ட காட்சியையும் தருகிறது.
- source_word: οὐ κατανοεῖς
  choice: கவனிக்காமல் இருக்கிறாய்
  rationale: கவனித்தறிதல் அல்லது உற்றுநோக்குதல் என்ற பொருளைத் தருகிறது; பிறரின் சிறு குறையைப் பார்க்கிறவன் தன் பெருங்குறையைக் கவனிக்காத முரணை இயல்பான தமிழில் காக்கிறது.
- source_word: ὀφθαλμῷ
  choice: கண்
  rationale: இந்தத் தெளிவான உருவகத்தில் ὀφθαλμός என்பதற்கான வழக்கமான, நேரடியான தமிழ் இணைச்சொல்.
theological_decisions:
- issue: ἀδελφοῦ என்ற பாலினம் குறிக்கப்பட்ட உறவுமுறைச் சொல்
  choice: சகோதரன்
  alternative: சகோதரன் அல்லது சகோதரி; சக விசுவாசி
  rationale: இந்தக் கூற்று அனைவருக்கும் பொருந்தக்கூடியதாக இருந்தாலும், கிரேக்க மூலம் ஆண்பால் ஒருமையைப் பயன்படுத்துகிறது. விளக்கமாக விரிவாக்காமல் அந்த வடிவம் தக்கவைக்கப்பட்டது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, கண்ணியமும் பொதுவாசிப்புத் தெளிவும் கொண்ட நடை. ‘சிறுதுரும்பு—மரக்கட்டை’ என்ற அளவு முரண்பாடு சொல்லின் தாக்கத்துக்காகப் பாதுகாக்கப்பட்டுள்ளது; வாக்கிய முடிவில் ‘ஏன்’ அமைக்கப்பட்டிருப்பது தமிழில் இயல்பான வினாவோட்டத்தைத் தருகிறது.
