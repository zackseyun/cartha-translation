revisions:
- from: ஆனால், உன் சகோதரனுடைய கண்ணில் இருக்கும் சிறுதுரும்பை நீ பார்க்கிறாய்; உன் சொந்தக் கண்ணில் இருக்கும் மரக்கட்டையையோ ஏன் கவனிக்காமல் இருக்கிறாய்?
  to: ஆனால், உன் சகோதரனின் கண்ணில் இருக்கும் சிறுதுரும்பை நீ ஏன் பார்க்கிறாய், உன் சொந்தக் கண்ணில் இருக்கும் மரக்கட்டையை ஏன் கவனிப்பதில்லை?
  rationale: The revision retains every principal lexical and rhetorical element of the source while using parallel Tamil interrogative clauses to express the intended ‘why see … yet not notice …?’ contrast naturally. ‘சகோதரனின்’ is a natural possessive form, and ‘கவனிப்பதில்லை’ is more direct and idiomatic than ‘கவனிக்காமல் இருக்கிறாய்’ in this rhetorical question.
