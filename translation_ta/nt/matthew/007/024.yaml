id: MAT.7.24
reference: Matthew 7:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Πᾶς οὖν ὅστις ἀκούει μου τοὺς λόγους τούτους καὶ ποιεῖ αὐτούς, ⸀ὁμοιωθήσεται ἀνδρὶ φρονίμῳ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/024.yaml
  text: Therefore everyone who hears these words of mine and does them will be like a wise man who built his house on the rock[a][b].
translation:
  language: ta
  text: ஆகையால், என்னுடைய இந்த வார்த்தைகளைக் கேட்டு அவற்றின்படி செயல்படுகிற ஒவ்வொருவரும், பாறையின்மேல் தன் வீட்டைக் கட்டிய விவேகமுள்ள ஒரு மனிதனைப்போல் இருப்பார்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒப்பிடப்படுவார்’ அல்லது ‘ஒப்பாக்கப்படுவார்.’
    reason: lexical_alternative
  - marker: b
    text: கிரேக்க மூலத்தில், ‘விவேகமுள்ள ஒரு மனிதன்’; மூலமொழியில் இந்த ஒப்பீடு ஆண்பால் வடிவில் உள்ளது.
    reason: cultural_note
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: ஆகையால் ... ஒவ்வொருவரும்
  rationale: Πᾶς ὅστις என்பதன் பகிர்ந்தளிக்கும் பொதுப்பொருளை ‘ஒவ்வொருவரும்’ தெரிவிக்கிறது; οὖν முந்தைய போதனையிலிருந்து வரும் முடிவுறு தொடர்பைக் காட்டுவதால் ‘ஆகையால்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ἀκούει μου τοὺς λόγους τούτους
  choice: என்னுடைய இந்த வார்த்தைகளைக் கேட்டு
  rationale: λόγους என்பதற்கு நேரடியான ‘வார்த்தைகள்’ பயன்படுத்தப்பட்டுள்ளது; μου என்பதன் உடைமைப் பொருள் ‘என்னுடைய’ என்பதால் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
- source_word: καὶ ποιεῖ αὐτούς
  choice: அவற்றின்படி செயல்படுகிற
  rationale: கேட்ட வார்த்தைகளை நடைமுறைப்படுத்துவதே இங்கு ποιεῖ என்பதன் சூழல்சார் பொருள். தமிழில் இயல்பற்ற ‘அவற்றைச் செய்கிற’ என்பதற்குப் பதிலாக, அதே கருத்தைத் தெளிவாகச் சொல்லும் இயல்பான தொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: ὁμοιωθήσεται
  choice: போல் இருப்பார்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தின் ஒப்பீட்டுப் பொருளை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது; ‘ஒப்பிடப்படுவார்’ என்ற நேரடி மாற்றும் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀνδρὶ φρονίμῳ
  choice: விவேகமுள்ள ஒரு மனிதன்
  rationale: φρόνιμος என்பது சூழலில் நடைமுறை விவேகம் உடையவரைக் குறிக்கிறது. ἀνήρ ஆண் ஒருவரைக் குறிப்பதால், மூலத்தின் ஆண்பால் உருவம் ‘மனிதன்’ என்பதில் தக்கவைக்கப்பட்டு அடிக்குறிப்பிலும் விளக்கப்படுகிறது.
- source_word: ᾠκοδόμησεν
  choice: கட்டிய
  rationale: வீடு கட்டும் உருவகத்தில் οἰκοδομέω என்பதற்கான நேரடியான, இயல்பான தமிழ் இணை.
- source_word: αὐτοῦ τὴν οἰκίαν
  choice: தன் வீட்டை
  rationale: ஒரே வாக்கிய எழுவாயைத் திரும்பக் குறிக்கும் αὐτοῦ என்பதற்கு தமிழில் இயல்பான ‘தன்’ பயன்படுத்தப்பட்டுள்ளது; οἰκία என்பதன் கட்டிட உருவகத்தை ‘வீடு’ பாதுகாக்கிறது.
- source_word: ἐπὶ τὴν πέτραν
  choice: பாறையின்மேல்
  rationale: πέτρα என்பதன் உறுதியான பாறை உருவகத்தை கூடுதல் விளக்கம் இன்றி நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: ஒப்பீட்டில் வரும் ஆண்பால் பிரதிநிதித்துவ மொழி
  choice: விவேகமுள்ள ஒரு மனிதன்
  alternative: விவேகமுள்ள ஒருவர்
  rationale: முழு கூற்றின் பொதுவான பொருள் ‘ஒவ்வொருவரும்’ என்பதால் தெளிவாகிறது. ஆனால் ஒப்பீட்டில் மூல கிரேக்கம் குறிப்பாக ἀνήρ என்ற ஆண்பால் சொல்லைப் பயன்படுத்துவதால் அதை பாலினப் பொதுமைப்படுத்தாமல் தக்கவைக்கப்பட்டுள்ளது.
- issue: ὁμοιωθήσεται என்ற செயப்பாட்டு ஒப்பீட்டின் மொழிபெயர்ப்பு
  choice: மனிதனைப்போல் இருப்பார்
  alternative: மனிதனுக்கு ஒப்பிடப்படுவார்
  rationale: இரண்டும் கிரேக்க வடிவின் சாத்தியமான பொருளைத் தருகின்றன. முதன்மை உரையில் இயல்பான தமிழ் தேர்ந்தெடுக்கப்பட்டாலும், செயப்பாட்டு நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது; எந்தத் தனிப்பட்ட இறையியல் விளக்கமும் இதில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழில் பொதுவாசகருக்கு எளிதாகப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘அவற்றின்படி செயல்படுகிற’ என்பது கிரேக்கத்தின் கேட்பது–செய்வது என்ற இணைப்பை இயல்பாக வெளிப்படுத்துகிறது; பாறை மற்றும் வீடு என்ற உருவகங்கள் நேரடியாகத் தக்கவைக்கப்பட்டுள்ளன.
