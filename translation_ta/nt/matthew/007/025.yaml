id: MAT.7.25
reference: Matthew 7:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ κατέβη ἡ βροχὴ καὶ ἦλθον οἱ ποταμοὶ καὶ ἔπνευσαν οἱ ἄνεμοι καὶ προσέπεσαν τῇ οἰκίᾳ ἐκείνῃ, καὶ οὐκ ἔπεσεν, τεθεμελίωτο γὰρ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/025.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it did not fall[b], for it had been founded on the rock.
translation:
  language: ta
  text: மழை பெய்தது; ஆறுகள் வந்தன; காற்றுகள் வீசின; அவை அந்த வீட்டின்மேல் மோதின[b]. ஆனாலும் அந்த வீடு விழவில்லை; ஏனெனில் அது பாறையின்மேல் அடித்தளமிடப்பட்டிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: அல்லது, “அந்த வீட்டின்மேல் விழுந்தன” அல்லது “அதைத் தாக்கின.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: மழை பெய்தது
  rationale: கிரேக்கில் மழை ‘கீழே வந்தது’ என்ற இயக்கம் வெளிப்படுகிறது. தமிழில் ‘மழை பெய்தது’ என்பதே அதற்கான இயல்பான, மிகைப்படுத்தாத வழக்கு.
- source_word: οἱ ποταμοί
  choice: வெள்ளப்பெருக்குகள்
  rationale: ποταμοί என்பதன் அடிப்படைப் பொருள் ‘ஆறுகள்’ என்றாலும், புயலால் வீட்டைத் தாக்க வரும் நீர்ப்பெருக்கை இச்சூழல் சித்தரிக்கிறது. தமிழில் ‘வெள்ளப்பெருக்குகள்’ அந்த அச்சுறுத்தும் நீரோட்டத்தை இயல்பாகத் தெரிவிக்கிறது; சொற்சார்ந்த மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: காற்றுகள் வீசி
  rationale: பன்மையையும் காற்று வீசும் செயற்பாட்டையும் நேரடியாகப் பாதுகாக்கும் இயல்பான தமிழ்.
- source_word: προσέπεσαν
  choice: மோதின
  rationale: προσπίπτω என்பது சொற்சார்ந்து ‘மேல்/எதிராக விழுதல்’ என்று பொருள்படலாம். புயல் சூழலில் ‘மோதின’ என்பது வீட்டின் மீது செலுத்தப்பட்ட தாக்கத்தை இயல்பாகச் சொல்கிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் உள்ளன.
- source_word: οἰκίᾳ ἐκείνῃ
  choice: அந்த வீட்டின்மேல்
  rationale: உவமையில் இது குடும்பத்தாரை அல்ல, கட்டடமாகிய வீட்டையே குறிக்கிறது.
- source_word: οὐκ ἔπεσεν
  choice: அந்த வீடு விழவில்லை
  rationale: கிரேக்க வினையின் எளிய பொருளைத் தக்கவைக்கிறது. ‘இடிந்து விழவில்லை’ என்பது மூலத்தில் இருப்பதைவிடச் சற்று விளக்கமானதாக இருக்கும்.
- source_word: τεθεμελίωτο
  choice: அஸ்திவாரம் அமைக்கப்பட்டிருந்தது
  rationale: முன்பே நிறைவேற்றப்பட்டு தொடர்ந்து நிலவிய நிலையைக் காட்டும் இறந்தகால நிறைவினையையும் செயல்பாட்டு வாய்பாட்டையும், அஸ்திவார உருவகத்தையும் பாதுகாக்கிறது.
- source_word: ἐπὶ τὴν πέτραν
  choice: பாறையின்மேல்
  rationale: πέτρα என்பதன் நேரடியான பொருளான ‘பாறை’ தக்கவைக்கப்படுகிறது; ‘அடிப்பாறை’ என்று குறிப்பாக்கப்படவில்லை.
theological_decisions:
- issue: அஸ்திவாரம் குறித்த உவமையில் பாறையின் அடையாளம்
  choice: பாறையின்மேல்
  alternative: அடிப்பாறையின்மேல்; அல்லது பாறையை ஒரு குறிப்பிட்ட இறையியல் நபர்/கோட்பாட்டுடன் இவ்வசனத்திலேயே வெளிப்படையாக அடையாளப்படுத்துதல்
  rationale: இந்த வசனம் பாறையை உவமையின் படிமமாக மட்டுமே குறிப்பிடுகிறது. அதன் பொருளை அடுத்தடுத்த சூழல் விளக்குவதற்கு இடமளித்து, வசனத்தில் இல்லாத சமயக்கோட்பாட்டு அடையாளத்தை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. புயலின் தொடர்ச்சியான நிகழ்வுகள் அரைப்புள்ளிகளால் தெளிவாகப் பிரிக்கப்பட்டுள்ளன. ‘அஸ்திவாரம்’ என்பது பரவலாகப் புரிந்துகொள்ளப்படும் கட்டடச் சொல்; கிரேக்கத்தில் உள்ள அடித்தளப் படிமத்தையும் இயல்பாகத் தக்கவைக்கிறது.
