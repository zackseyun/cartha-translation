source:
  edition: SBLGNT
  text: πολλοὶ ἐροῦσίν μοι ἐν ἐκείνῃ τῇ ἡμέρᾳ· Κύριε κύριε, οὐ τῷ σῷ ὀνόματι ἐπροφητεύσαμεν, καὶ τῷ σῷ ὀνόματι δαιμόνια ἐξεβάλομεν, καὶ τῷ σῷ ὀνόματι δυνάμεις πολλὰς ἐποιήσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/022.yaml
  text: Many will say to me on that day[a], ‘Lord, Lord, did we not prophesy in your name, and cast out demons in your name, and do many mighty works in your name?’
translation:
  language: ta
  text: அந்த நாளில் பலர் என்னிடம், ‘ஆண்டவரே, ஆண்டவரே, உமது பெயரில் நாங்கள் தீர்க்கதரிசனம் உரைக்கவில்லையா? உமது பெயரில் பேய்களைத் துரத்தவில்லையா? உமது பெயரில் வல்ல செயல்கள் பலவற்றைச் செய்யவில்லையா?[a]’ என்று சொல்வார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அற்புதங்கள் பலவற்றைச் செய்யவில்லையா?’ அல்லது, ‘வல்லமையுள்ள செயல்கள் பலவற்றைச் செய்யவில்லையா?’ கிரேக்கத்தில் சொல்லுக்கு சொல் ‘வல்லமைகள் பல’ என்று உள்ளது; நற்செய்தி நூல்களில் இச்சொல் பெரும்பாலும் அற்புதச் செயல்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: பலர்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் ஆண்பால் பன்மை அடைமொழியை, கிரேக்கத்தில் இல்லாத ‘மக்கள்’ என்பதைச் சேர்க்காமல் இயல்பாகக் காட்டுகிறது.
- source_word: ἐροῦσίν μοι
  choice: என்னிடம் ... சொல்வார்கள்
  rationale: λέγω என்பதன் எதிர்கால வடிவத்தையும் அதனுடன் வரும் மூன்றாம் வேற்றுமைப் பிரதிப்பெயரையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: அந்த நாளில்
  rationale: கிரேக்கத்தின் காலக் குறிப்பை இயல்பான தமிழில் தருகிறது; அது நியாயத்தீர்ப்பு நாளைக் குறிப்பதை விளக்கமாக முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: Κύριε κύριε
  choice: ஆண்டவரே, ஆண்டவரே
  rationale: நேரடி அழைப்பையும் வலியுறுத்தும் இரட்டிப்பையும் காக்கிறது; κύριος என்பதன் கிறிஸ்துவியல் நிறையையும் குறைக்கவில்லை.
- source_word: οὐ ... ἐπροφητεύσαμεν
  choice: நாங்கள் தீர்க்கதரிசனம் உரைக்கவில்லையா?
  rationale: உறுதிப்படுத்தும் பதிலை எதிர்பார்க்கும் கிரேக்க எதிர்மறைக் கேள்வியைத் தமிழில் இயல்பாகத் தருகிறது; προφητεύω என்பதற்கு பரவலாக அறியப்படும் சமயச் சொல்லைப் பயன்படுத்துகிறது.
- source_word: τῷ σῷ ὀνόματι
  choice: உமது பெயரில்
  rationale: ஒருவருடைய பெயரையும் அதிகாரத்தையும் முன்வைத்துச் செயல்படுதல் என்ற பொருளைத் தரும் இயல்பான தமிழ் சொற்றொடர். மூன்று முறை வரும் மறுபடியும் கூறுதல் முழுமையாகக் காக்கப்பட்டுள்ளது.
- source_word: δαιμόνια ἐξεβάλομεν
  choice: பேய்களைத் துரத்தவில்லையா?
  rationale: ἐκβάλλω என்பதன் வெளியேற்றும் பொருளை இயல்பாகத் தருகிறது; δαιμόνια என்பதற்கு சாதாரண வாசகர்கள் உடனே புரிந்துகொள்ளும் சொல்லைப் பயன்படுத்துகிறது.
- source_word: δυνάμεις πολλὰς ἐποιήσαμεν
  choice: வல்ல செயல்கள் பலவற்றைச் செய்யவில்லையா?
  rationale: δύναμις என்பதிலுள்ள ‘வல்லமை’ சார்ந்த பொருளைக் காத்து, அது அற்புதச் செயல்களைக் குறிக்கக்கூடும் என்பதை மிகையாகக் குறிப்பாக்காமல் விடுகிறது.
theological_decisions:
- issue: இயேசுவை நேரடியாக அழைக்கும்போது κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவரே
  alternative: எஜமானரே
  rationale: ‘ஆண்டவர்’ என்பது சாதாரண தலைப்புப் பொருளையும் கிறிஸ்துவியல் நிறையையும் ஒருங்கே காக்கிறது; ‘எஜமானர்’ இவ்விடத்தில் பொருளைத் தேவையின்றிக் குறுக்குகிறது.
- issue: ‘அந்த நாள்’ என்பதன் இறுதிக்காலப் பொருள்
  choice: அந்த நாளில்
  alternative: நியாயத்தீர்ப்பு நாளில்
  rationale: சூழல் இறுதி நியாயத்தீர்ப்பைக் காட்டினாலும், கிரேக்க உரை ‘அந்த நாள்’ என்று மட்டுமே கூறுகிறது. ஆகவே மறைமுகமான கருத்தை முதன்மை உரையில் வெளிப்படையாக்காமல் அதன் இறையியல் அழுத்தம் காக்கப்படுகிறது.
- issue: δυνάμεις என்பதன் அற்புதச் செயல் சார்ந்த பொருள்
  choice: வல்ல செயல்கள்
  alternative: அற்புதங்கள்
  rationale: நற்செய்தி நூல்களில் இச்சொல் அற்புதச் செயல்களைக் குறிக்கலாம்; இருப்பினும் அதன் அடிப்படை ‘வல்லமை’ தொடர்பை முதன்மை உரை காக்கிறது, மேலும் தெளிவான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘உமது’ மற்றும் ‘ஆண்டவரே’ ஆகியவை நேரடி உரையின் மரியாதையையும் வேதாகமப் பதிவின் உயர்ந்த நடையையும் காக்கின்றன. கிரேக்கத்தில் மூன்று முறை வரும் ‘உமது பெயரில்’ என்ற தொடரும், ‘ஆண்டவரே’ என்ற இரட்டிப்பும் சொல்லாட்சியின் வலிமைக்காகப் பாதுகாக்கப்பட்டுள்ளன. வழங்கப்பட்ட ஆங்கில ஆலோசனை உரையில் [a] குறி ‘அந்த நாள்’ என்பதற்குப் பின் இருந்தாலும் அதன் அடிக்குறிப்பு δυνάμεις πολλὰς பற்றியது; ஆகவே மூலமொழிச் சான்றின் அடிப்படையில் குறி தொடர்புடைய ‘வல்ல செயல்கள்’ சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
