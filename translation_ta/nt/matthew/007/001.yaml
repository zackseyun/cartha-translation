  text: Μὴ κρίνετε, ἵνα μὴ κριθῆτε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/001.yaml
  text: Do not judge[a], so that you may not be judged.
translation:
  language: ta
  text: நீங்கள் தீர்ப்பளிக்காதீர்கள்[a]; நீங்களும் தீர்ப்பளிக்கப்படாதபடி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கண்டிக்காதீர்கள்; நீங்களும் கண்டிக்கப்படாதபடி.’ கிரேக்க வினைச்சொல் சில சூழல்களில் கண்டிப்பதைக் குறிக்கலாம்; ஆனால் ‘தீர்ப்பளி’ என்பது பரந்த பொருளைக் கொண்டதோடு, வசனத்தின் இரு கூறுகளிலும் ஒரே வினைச்சொல் திரும்ப வருவதையும் காக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ
  choice: தீர்ப்பளிக்காதீர்கள் என்பதிலுள்ள ‘-ஆதீர்கள்’
  rationale: நிகழ்காலக் கட்டளை வினையுடன் வரும் μή ஒரு தடையைத் தெரிவிக்கிறது. தமிழில் மரியாதை/பன்மை எதிர்மறைக் கட்டளை விகுதி இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: κρίνετε
  choice: தீர்ப்பளிக்காதீர்கள்
  rationale: κρίνω என்பது மதிப்பிடுதல், தீர்ப்பளித்தல், கண்டனத் தீர்ப்பளித்தல் ஆகிய பரந்த பொருள் எல்லையைக் கொண்டது. ‘தீர்ப்பளி’ அந்தப் பரப்பை குறுக்காமல், இரண்டாம் கூறிலுள்ள அதே வினையுடனான சொல் மறுமொழியையும் காக்கிறது.
- source_word: ἵνα
  choice: அப்போது
  rationale: இங்கு ἵνα நோக்கம் அல்லது விளைவைக் குறிக்கிறது. தமிழில் ‘அப்போது’ இரண்டு கூறுகளுக்கிடையிலான எச்சரிக்கை சார்ந்த விளைவுத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது; நோக்கமா விளைவா என்பதைத் தேவையின்றி மிகத் துல்லியமாக நிர்ணயிப்பதில்லை.
- source_word: μὴ
  choice: மாட்டீர்கள் என்பதிலுள்ள எதிர்மறை
  rationale: இரண்டாவது μή, செயல்பாட்டு வாய்ப்பைக் குறிக்கும் κριθῆτε என்பதை மறுக்கிறது. தமிழின் ‘மாட்டீர்கள்’ அமைப்பு இதை இயல்பான எதிர்காலத் தோற்றமுள்ள எச்சரிக்கையாக வழங்குகிறது.
- source_word: κριθῆτε
  choice: தீர்ப்பளிக்கப்பட மாட்டீர்கள்
  rationale: இது κρίνω என்பதன் இறந்தகாலச் செயப்பாட்டு வாய்ப்புவினை வடிவம். செயப்பாட்டு அமைப்பையும், முதல் கூறிலுள்ள ‘தீர்ப்பளி’ என்ற அதே சொல்லின் மறுமொழியையும் மொழிபெயர்ப்பு காக்கிறது.
theological_decisions:
- issue: இயேசுவின் தடையில் κρίνω என்பதன் பொருள் எல்லை
  choice: பரந்த பொருளுடைய ‘தீர்ப்பளி’ என்பதை முதன்மைப் பாடத்தில் வைத்தல்
  alternative: ‘கண்டனத் தீர்ப்பளிக்காதீர்கள்; அப்போது நீங்களும் கண்டனத் தீர்ப்புக்கு உள்ளாக மாட்டீர்கள்.’
  rationale: இந்த வசனம் எந்த வகையான தீர்ப்பைத் தடைசெய்கிறது என்பதை அடுத்துள்ள சூழல் (மத் 7:2–5) மேலும் தெளிவுபடுத்துகிறது. இங்கேயே அதை இறுதிக் கண்டனத் தீர்ப்பு என்று குறுக்குவது மூலத்தின் பொருள் விரிவையும் இறையியல் அழுத்தத்தையும் முன்கூட்டியே தீர்த்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் சுருக்கமான, கண்ணியமான நடை. ‘நியாயந்தீர்க்காதீர்கள்’ போன்ற மரபுவழி ஆனால் இன்றைய பொதுப் பயன்பாட்டில் குறைவான வடிவத்திற்குப் பதிலாக ‘தீர்ப்பளிக்காதீர்கள்’ பயன்படுத்தப்பட்டுள்ளது.
