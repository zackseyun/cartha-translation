revisions:
- from: என்னுடைய இந்த வார்த்தைகளைக் கேட்டும் அவற்றின்படி செய்யாத ஒவ்வொருவரும், மணலின்மேல் தன் வீட்டைக் கட்டிய அறிவற்ற மனிதனைப் போல இருப்பார்[a].
  to: என் இந்த வார்த்தைகளைக் கேட்டு, அவற்றைச் செய்யாத ஒவ்வொருவரும், மணல்மேல் தன் வீட்டைக் கட்டிய முட்டாளான மனிதனைப் போல இருப்பார்[a].
  rationale: The revision removes a possible concessive implication, keeps the direct object relationship of “do them,” and uses a more contextually exact equivalent for μωρός. It retains the source’s masculine representative expression and preserves the stated lexical alternative in the footnote.
