id: MAT.7.26
reference: Matthew 7:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ἀκούων μου τοὺς λόγους τούτους καὶ μὴ ποιῶν αὐτοὺς ὁμοιωθήσεται ἀνδρὶ μωρῷ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν ἄμμον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/026.yaml
  text: And everyone who hears these words of mine and does not do them will be like a foolish man[a], who built his house on the sand.
translation:
  language: ta
  text: என் இந்த வார்த்தைகளைக் கேட்டு, அவற்றைச் செய்யாத ஒவ்வொருவரும், மணல்மேல் தன் வீட்டைக் கட்டிய முட்டாளான மனிதனைப் போல இருப்பார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘முட்டாளான ஒருவரைப் போல இருப்பார்.’ கிரேக்கத்தில் ‘முட்டாளான மனிதன்’ என்று ஆண்பால் பிரதிநிதித்துவ மொழி பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ ἀκούων
  choice: கேட்டும் ... ஒவ்வொருவரும்
  rationale: பெயர்ச்சொல் போலச் செயல்படும் நிகழ்காலப் பங்கேற்புச் சொற்றொடர் பொதுவாக அனைவரையும் குறிக்கிறது. அடுத்துள்ள எதிர்மறைச் செயலுடன் இயல்பாக இணைக்க ‘கேட்டும்’ பயன்படுத்தப்பட்டது.
- source_word: μου τοὺς λόγους τούτους
  choice: என்னுடைய இந்த வார்த்தைகளை
  rationale: μου என்பதன் உடைமைத் தொடர்பையும் τούτους என்பதன் சுட்டு வலியுறுத்தலையும் தெளிவாகப் பாதுகாக்கிறது; λόγους என்பதற்கு இங்கு ‘வார்த்தைகள்’ இயல்பான தேர்வு.
- source_word: μὴ ποιῶν αὐτούς
  choice: அவற்றின்படி செய்யாத
  rationale: கேட்ட வார்த்தைகளை நடைமுறைப்படுத்தாததைக் குறிக்கிறது. தமிழில் வெறும் ‘அவற்றைச் செய்யாத’ என்பதைவிட ‘அவற்றின்படி செய்யாத’ என்பது பொருளை இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: ὁμοιωθήσεται
  choice: போல இருப்பார்
  rationale: எதிர்காலச் செயப்பாட்டு ஒப்பீட்டை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀνδρὶ μωρῷ
  choice: அறிவற்ற மனிதனை
  rationale: ἀνήρ ஆண் மனிதரைக் குறித்தாலும் இவ்வுவமையில் பிரதிநிதித்துவப் பொதுப்பயன்பாடு உள்ளது. μωρός என்பதற்கு ‘அறிவற்ற’ என்பது கண்ணியமான, தெளிவான நவீனத் தமிழ்.
- source_word: ᾠκοδόμησεν αὐτοῦ τὴν οἰκίαν
  choice: தன் வீட்டைக் கட்டிய
  rationale: கட்டியவரையே αὐτοῦ சுட்டுவதால் தமிழின் இயல்பான தற்சுட்டு உடைமைச் சொல்லான ‘தன்’ பயன்படுத்தப்பட்டது; οἰκία கட்டிட உருவகத்தில் ‘வீடு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ἐπὶ τὴν ἄμμον
  choice: மணலின்மேல்
  rationale: வீட்டின் அடித்தளமாக மணல் இருந்ததைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: உவமையில் பாலினம் குறித்த பிரதிநிதித்துவ மொழி
  choice: அறிவற்ற மனிதன்
  alternative: அறிவற்றவன் / அறிவற்ற ஒருவர்
  rationale: மூலத்தின் ἀνήρ ஆண்பால் ஒருமைச் சொல் என்பதைக் ‘மனிதன்’ முற்றிலும் மறைக்காமல் காக்கிறது; அதேவேளை ஒப்பீடு பொதுவாக அனைவருக்கும் பொருந்துவதை அடிக்குறிப்பு விளக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. ‘அவற்றின்படி செய்யாத’ என்பது கிரேக்கத்தின் செயற்பாட்டு நோக்கத்தைத் தமிழில் தெளிவாக்குகிறது.
