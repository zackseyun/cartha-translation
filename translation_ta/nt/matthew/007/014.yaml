id: MAT.7.14
reference: Matthew 7:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀ὅτι στενὴ ἡ πύλη καὶ τεθλιμμένη ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ζωήν, καὶ ὀλίγοι εἰσὶν οἱ εὑρίσκοντες αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/014.yaml
  text: For the gate is narrow and the way that leads to life is hard, and few are those who find it.
translation:
  language: ta
  text: ஏனெனில், வாசல் குறுகியது; வாழ்வுக்கு வழிநடத்தும் பாதை இடுக்கமானது. அதைக் கண்டுபிடிப்பவர்கள் சிலரே.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στενὴ
  choice: குறுகியது
  rationale: வாசலின் குறுகிய தன்மையை இயல்பான நவீனத் தமிழில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: τεθλιμμένη
  choice: நெருக்கமானது
  rationale: θλίβω என்பதன் அழுத்துதல் அல்லது நெருக்குதல் சார்ந்த உருவகத்தைப் பாதுகாக்கிறது; வெறுமனே ‘கடினமானது’ என்று பொருளை மட்டும் கூறாமல் மூலத்தின் படிமத்தையும் தக்கவைக்கிறது.
- source_word: ἀπάγουσα
  choice: வழிநடத்தும்
  rationale: ஒரு இலக்கை நோக்கிக் கொண்டு செல்லும் பாதை என்ற இயக்கப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ζωήν
  choice: வாழ்வு
  rationale: மூலத்தில் விளக்கமின்றி நிற்கும் ‘வாழ்வு’ என்ற இறையியல் செறிவுள்ள சொல்லின் திறந்த பொருளைத் தக்கவைக்கிறது.
- source_word: εὑρίσκοντες
  choice: கண்டுபிடிப்பவர்கள்
  rationale: தேடுதல் என மூலத்தில் வெளிப்படையாக இல்லாத கருத்தைச் சேர்க்காமல், ‘கண்டடைதல்’ என்ற பொருளைத் தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: ‘வாழ்வு’ என்பதன் தன்மை
  choice: வாழ்வு
  alternative: நித்திய வாழ்வு
  rationale: இங்கு αἰώνιος இல்லை; ஆகவே ‘நித்திய’ என்பதைச் சேர்க்காமல், சூழல் அளிக்கும் இறையியல் பரப்பை வாசகருக்குத் திறந்தவாறு விடுகிறது.
- issue: τεθλιμμένη என்பதன் மொழிபெயர்ப்பு
  choice: நெருக்கமானது
  alternative: கடினமானது
  rationale: பாதை துன்பமிக்கது அல்லது கடினமானது என்ற விளக்கத்தை மட்டும் உறுதிப்படுத்தாமல், கிரேக்கச் சொல்லின் ‘நெருக்கப்பட்ட/இடுக்கமான’ படிமத்தையும் அதன் இயல்பான இரட்டைத் தொனியையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட சொற்றொடர். ‘வாசல்’ மற்றும் ‘பாதை’ என்ற இணைப் படிமம் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளது; தேவையற்ற இறையியல் விரிவாக்கங்கள் தவிர்க்கப்பட்டுள்ளன.
