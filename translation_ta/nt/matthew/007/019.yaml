  yaml_path: translation/nt/matthew/007/019.yaml
  text: Every tree not producing good fruit is cut down and thrown into the fire[a][b].
translation:
  language: ta
  text: நல்ல கனியைக் கொடுக்காத ஒவ்வொரு மரமும் வெட்டப்பட்டு, நெருப்பில் எறியப்படுகிறது.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நல்ல கனியைத் தராத.’
    reason: lexical_alternative
  - marker: b
    text: ‘நெருப்பு’ என்பது நியாயத்தீர்ப்பின் உருவகம். இங்கு வலியுறுத்தப்படுவது இக்காலத் தீர்ப்பா, இறுதிக்காலத் தீர்ப்பா, அல்லது இரண்டுமா என்பதை இந்த வசனம் இன்னும் துல்லியமாகக் குறிப்பிடவில்லை.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶν δένδρον
  choice: ஒவ்வொரு மரமும்
  rationale: πᾶν என்பது ஒருமை பெயர்ச்சொல்லுடன் பகிர்ந்தளிக்கும் பொருளில் வந்து, தனித்தனியாக ஒவ்வொரு மரத்தையும் குறிக்கிறது. ‘ஒவ்வொரு மரமும்’ என்பது இயல்பான தமிழாகவும் பழமொழி போன்ற வலிமையைத் தக்கவைப்பதாகவும் உள்ளது.
- source_word: μὴ ποιοῦν
  choice: கொடுக்காத
  rationale: நிகழ்காலப் பெயரெச்சம் மரத்தின் தொடர்ச்சியான இயல்பான செயலைக் குறிக்கிறது. கனியைப் பற்றிய தமிழ்ப் பயன்பாட்டில் ‘கனி கொடுக்காத’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது; ‘உண்டாக்காத’ என்பது சொற்சார்பில் நெருக்கமானாலும் இங்கு செயற்கையாக ஒலிக்கும்.
- source_word: καρπὸν καλὸν
  choice: நல்ல கனி
  rationale: καλός இச்சூழலில் நல்ல, தரமான அல்லது தகுந்ததைக் குறிக்கிறது. ‘நல்ல கனி’ அதன் மதிப்பீட்டு மற்றும் உருவகப் பொருளை நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἐκκόπτεται
  choice: வெட்டப்படுகிறது
  rationale: செயப்பாட்டு நிகழ்கால வடிவம் அத்தகைய மரத்திற்கு நிகழ்வதைச் சொல்கிறது. மரத்தைப் பற்றிய சூழலில் ‘வெட்டப்படுகிறது’ இயல்பானது; தமிழில் இதுவே மரம் வெட்டி அகற்றப்படுவதை போதுமான அளவு தெரிவிக்கிறது.
- source_word: εἰς πῦρ βάλλεται
  choice: நெருப்பில் எறியப்படுகிறது
  rationale: βάλλεται என்பது செயப்பாட்டு வடிவில் ‘எறியப்படுகிறது’; εἰς என்பது நெருப்புக்குள் செல்லும் இயக்கத்தைக் காட்டுகிறது. ‘நெருப்பில் எறியப்படுகிறது’ இயல்பான தமிழில் அந்த இயக்கத்தையும் நியாயத்தீர்ப்பு உருவகத்தையும் காக்கிறது.
theological_decisions:
- issue: நெருப்பு குறிக்கும் நியாயத்தீர்ப்பு
  choice: மரம் வெட்டப்பட்டு நெருப்பில் எறியப்படும் உருவகத்தை அப்படியே தக்கவைத்து, நெருப்பின் துல்லியமான குறிப்பு எது என்பதை மொழிபெயர்ப்பில் வரையறுக்கவில்லை.
  alternative: இதை இவ்வுலகத் தண்டனை, இறுதிக்கால நியாயத்தீர்ப்பு அல்லது நரகம் என்று வெளிப்படையாகக் குறிப்பிடுதல்.
  rationale: வசனம் தெளிவாக நியாயத்தீர்ப்பைப் பற்றிய எச்சரிக்கையைத் தருகிறது; ஆனால் அதன் காலம் அல்லது துல்லியமான வடிவத்தைத் தனியாக விளக்கவில்லை. ஆகவே இறையியல் பதற்றமும் உண்மையான தெளிவின்மையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘கனி கொடுக்காத’ என்பது பேச்சுவழக்கில் மிகத் தாழாமல் இயல்பான வேளாண்மைச் சொல்லாக்கத்தை வழங்குகிறது; செயப்பாட்டு வடிவங்கள் கிரேக்கத்தின் அமைப்பைப் பாதுகாக்கின்றன.
