id: MAT.7.15
reference: Matthew 7:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀Προσέχετε ἀπὸ τῶν ψευδοπροφητῶν, οἵτινες ἔρχονται πρὸς ὑμᾶς ἐν ἐνδύμασι προβάτων ἔσωθεν δέ εἰσιν λύκοι ἅρπαγες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/015.yaml
  text: Beware of false prophets[a], who come to you in sheep’s clothing[c][b], but inwardly are ravenous wolves.
translation:
  language: ta
  text: பொய்த் தீர்க்கதரிசிகளைக் குறித்து எச்சரிக்கையாக இருங்கள். அவர்கள் செம்மறியாடுகளின் உடைகளை அணிந்துகொண்டு உங்களிடம் வருகிறார்கள்; ஆனால் உள்ளுக்குள் அவர்கள் இரையைக் கவ்வும் ஓநாய்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προσέχετε ἀπὸ
  choice: குறித்து எச்சரிக்கையாக இருங்கள்
  rationale: நிகழ்காலக் கட்டளையின் தொடர்ந்த விழிப்புணர்வையும், ἀπό என்பதுடன் சேர்ந்துள்ள ‘எதிராக எச்சரிக்கையாயிருத்தல்’ என்ற பொருளையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ψευδοπροφητῶν
  choice: பொய்த் தீர்க்கதரிசிகள்
  rationale: தீர்க்கதரிசன அதிகாரத்தைப் பொய்யாகக் கோருகிறவர்களையோ தீர்க்கதரிசிகளாகப் பொய் பேசுகிறவர்களையோ குறிக்கும் கிரேக்கச் சொல்லின் வழக்கமான, தெளிவான இணை.
- source_word: ἔρχονται πρὸς ὑμᾶς
  choice: உங்களிடம் வருகிறார்கள்
  rationale: அவர்கள் சீடர்களை அணுகுவதை நிகழ்காலத்தில் நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐν ἐνδύμασι προβάτων
  choice: செம்மறியாடுகளின் உடைகளை அணிந்துகொண்டு
  rationale: வெளித்தோற்றத்தின் ஏமாற்றும் தன்மையைப் பேணுகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘தோல்’ என்பதை உரைக்குள் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: ἔσωθεν
  choice: உள்ளுக்குள்
  rationale: வெளிப்புறத் தோற்றத்துக்கும் உண்மையான உள்ளார்ந்த இயல்புக்கும் உள்ள முரண்பாட்டை இயல்பான தமிழில் காட்டுகிறது.
- source_word: λύκοι ἅρπαγες
  choice: இரையைக் கவ்வும் ஓநாய்கள்
  rationale: ἅρπαγες என்பதன் இரைபறிக்கும், அழிவுண்டாக்கும் தன்மையை உயிரோட்டமான தமிழில் வெளிப்படுத்துகிறது; வெறும் பசியை மட்டும் வலியுறுத்துவதில்லை.
theological_decisions:
- issue: ஏமாற்றும் சமயத் தலைவர்களைப் பற்றிய எச்சரிக்கையின் வரம்பு
  choice: பின்னாளைய திருச்சபைப் பிரிவுகளைக் குறிப்பிடாமல், பொய்த் தீர்க்கதரிசிகளைப் பற்றிய ஒழுக்க-ஆவிக்குரிய எச்சரிக்கையாக உருவகத்தை நேரடியாக மொழிபெயர்த்தல்
  alternative: ஒரு குறிப்பிட்ட பிற்காலக் கொள்கைப் பிரிவைச் சேர்ந்த தவறான போதகர்களுக்கு மட்டும் பொருந்துமாறு குறுக்குதல்
  rationale: கிரேக்க வசனம் வெளித்தோற்றத்துக்கும் உள்ளார்ந்த உண்மைக்கும் இடையிலான வேறுபாட்டால் பொய்த் தீர்க்கதரிசிகளை எச்சரிக்கிறது; அதில் இல்லாத பிற்கால நிறுவன அல்லது சமயப்பிரிவுச் சார்ந்த வகைப்பாடுகளை மொழிபெயர்ப்பு சேர்க்கக்கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குத் தெளிவானதும் மரியாதைமிக்கதுமான நடை. வசனத்தின் எச்சரிக்கை வலிமையும் செம்மறியாடு–ஓநாய் உருவகமும் பேணப்பட்டுள்ளன.
