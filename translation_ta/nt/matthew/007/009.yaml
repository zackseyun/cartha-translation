revisions:
- from: அல்லது, உங்களில் எந்த மனிதனிடம் அவனுடைய மகன் அப்பம் கேட்டால், அவன் அவனுக்குக் கல்லைக் கொடுப்பானா?
  to: அல்லது, உங்களில் எந்த மனிதன், அவனுடைய மகன் அவனிடம் அப்பம் கேட்டால், அவனுக்குக் கல்லைக் கொடுப்பான்?
  rationale: The revision is limited to Tamil syntax and pronoun placement. It retains the masculine representative singular, the specific relationship ‘son,’ the bread/stone contrast, and the negative-expectation rhetorical question without adding an explicit negation absent from the Greek surface wording.
