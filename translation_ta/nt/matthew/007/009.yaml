id: MAT.7.9
reference: Matthew 7:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἢ τίς ⸀ἐστιν ἐξ ὑμῶν ἄνθρωπος, ὃν ⸀αἰτήσει ὁ υἱὸς αὐτοῦ ἄρτον— μὴ λίθον ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/009.yaml
  text: Or what man is there among you whose son asks him for bread[a], and he will give him a stone?
translation:
  language: ta
  text: அல்லது, உங்களில் எந்த மனிதன், அவனுடைய மகன் அவனிடம் அப்பம் கேட்டால், அவனுக்குக் கல்லைக் கொடுப்பான்?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ
  choice: அல்லது
  rationale: முந்தைய வசனத்தின் கருத்தைத் தொடர்ந்து மற்றொரு சொல்லாட்சிக் கேள்வியை அறிமுகப்படுத்துகிறது.
- source_word: τίς ἐστιν ἐξ ὑμῶν ἄνθρωπος
  choice: உங்களில் எந்த மனிதனிடம்
  rationale: கிரேக்கப் பகுதி பிரதிநிதித்துவ ஒருமை ஆண்பாலைக் கொண்டுள்ளது; தமிழில் இயல்பாகவும் தெளிவாகவும் அமையும் வகையில் மொழிபெயர்க்கப்பட்டது.
- source_word: ὃν αἰτήσει ὁ υἱὸς αὐτοῦ
  choice: அவனுடைய மகன் ... கேட்டால்
  rationale: சொல்லாட்சிக் கேள்வியில் இடம்பெறும் பொதுவான நிகழ்நிலையைத் தமிழில் நிபந்தனை அமைப்பால் இயல்பாக வெளிப்படுத்துகிறது; ‘மகன்’ என்ற மூலத்தின் குறிப்பைத் தக்கவைக்கிறது.
- source_word: ἄρτον
  choice: அப்பம்
  rationale: அன்றாட அடிப்படை உணவான அப்பத்தை நேரடியாகக் குறிக்கிறது; ‘உணவு’ என்று பொதுமைப்படுத்தவில்லை.
- source_word: μὴ λίθον ἐπιδώσει αὐτῷ
  choice: அவன் அவனுக்குக் கல்லைக் கொடுப்பானா?
  rationale: μή எதிர்மறையான பதிலை எதிர்பார்க்கும் சொல்லாட்சிக் கேள்வியைச் சுட்டுகிறது; தமிழில் கேள்வி வடிவமே அந்த எதிர்பார்ப்பை இயல்பாக உணர்த்துகிறது.
theological_decisions:
- issue: பிரதிநிதித்துவ ஆண்பால் மொழி
  choice: எந்த மனிதனிடம் ... அவனுடைய மகன்
  alternative: உங்களில் யாரிடம் அவருடைய பிள்ளை
  rationale: மூலத்தில் ἄνθρωπος மற்றும் υἱός என்று முறையே ‘மனிதன்’ மற்றும் ‘மகன்’ குறிப்பிடப்படுவதால், அவற்றை பாலினப் பொதுமைப்படுத்தல் இன்றித் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் பேச்சின் இயல்பும் கலந்த சொல்லாட்சிக் கேள்வியாக வடிவமைக்கப்பட்டது. ‘அப்பம்’ வேதாகமச் சூழலில் பரவலாகப் புரியக்கூடிய சொல்; வாக்கியத்தில் உள்ள இரு ஆண் நபர்களையும் குறிக்கும் பதிற்பெயர்கள் மூலத்தின் அமைப்பைப் பின்பற்றுகின்றன.
