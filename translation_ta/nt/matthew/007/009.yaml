review_pass:
  verdict: revise
  source_fidelity: The draft faithfully conveys the rhetorical alternative, the representative singular ‘man,’ ‘son,’ bread, stone, and the question that expects a negative answer. The conditional Tamil construction appropriately represents the generalizing relative/future construction in Greek.
  naturalness: ‘உங்களில் எந்த மனிதனிடம் அவனுடைய மகன்’ is grammatically intelligible but less idiomatic, since a son asks his father rather than asks ‘at a man.’ Recasting with ‘எந்த மனிதன்’ as the subject of the main question is more natural modern standard Tamil and makes the rhetorical structure clearer.
  terminology: ‘மனிதன்,’ ‘மகன்,’ ‘அப்பம்,’ and ‘கல்’ are suitable and preserve the source’s specificity. ‘அப்பம்’ is an established biblical Tamil term for ἄρτος.
  issues:
  - severity: low
    issue: Less idiomatic placement of the first noun phrase
    rationale: ‘எந்த மனிதனிடம் ... அவனுடைய மகன்’ can momentarily sound as though the question asks which man a son approaches. Using ‘எந்த மனிதன்’ directly as the questioned subject more naturally expresses ‘what man among you ... would give.’
  revised_text: அல்லது, உங்களில் எந்த மனிதன், அவனுடைய மகன் அவனிடம் அப்பம் கேட்டால், அவனுக்குக் கல்லைக் கொடுப்பான்?
  revised_footnotes: []
  revision_rationale: The revision is limited to Tamil syntax and pronoun placement. It retains the masculine representative singular, the specific relationship ‘son,’ the bread/stone contrast, and the negative-expectation rhetorical question without adding an explicit negation absent from the Greek surface wording.
