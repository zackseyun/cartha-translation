source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ⸀ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, ἐξεπλήσσοντο οἱ ὄχλοι ἐπὶ τῇ διδαχῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/028.yaml
  text: And it happened that when Jesus had finished these words[b][a], the crowds were astonished at his teaching.
translation:
  language: ta
  text: இயேசு இந்த வார்த்தைகளைச் சொல்லி முடித்தபோது[a][b], மக்கள் கூட்டங்கள் அவருடைய போதனையால் வியப்பில் ஆழ்ந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இந்தக் கூற்றுகளை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “நிகழ்ந்தது என்னவென்றால், இயேசு … முடித்தபோது” என்பது கிரேக்கச் சொற்றொடரின் இன்னும் நேரடியான வடிவம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: … முடித்தபோது
  rationale: இது கதை அல்லது உரையின் அடுத்த கட்டத்துக்கு மாறுவதைக் குறிக்கும் கிரேக்க மரபுத்தொடர். அதன் காலத் தொடர்பை இயல்பான நவீனத் தமிழில் “போது” எனத் தந்து, இன்னும் நேரடியான அமைப்பை அடிக்குறிப்பில் பதிவு செய்துள்ளது.
- source_word: ἐτέλεσεν
  choice: சொல்லி முடித்த
  rationale: இயேசு மேற்கண்ட உரையை நிறைவுக்குக் கொண்டுவந்தார் என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: τοὺς λόγους τούτους
  choice: இந்த வார்த்தைகளை
  rationale: λόγους என்பதன் பொதுவான பொருளையும் τούτους என்பதன் சுட்டுப்பொருளையும் காக்கிறது; “கூற்றுகளை” என்ற சாத்தியமும் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἐξεπλήσσοντο
  choice: வியப்பில் ஆழ்ந்தார்கள்
  rationale: சாதாரண ஆச்சரியத்தைவிட வலிமையான, மக்கள் அனைவரிடமும் தொடர்ந்திருந்த எதிர்வினையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: οἱ ὄχλοι
  choice: மக்கள் கூட்டங்கள்
  rationale: கிரேக்க மூலத்தின் பன்மையைச் சுருக்காமல் காக்கிறது.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: அவருடைய போதனையைக் கேட்டு
  rationale: வியப்புக்குக் காரணமாக இருந்தது இயேசுவின் போதனை என்பதைத் தமிழில் இயல்பாகக் காட்டுகிறது; இங்கு “கேட்டு” என்பது போதனையால் ஏற்பட்ட எதிர்வினையைக் குறிக்கிறது.
theological_decisions:
- issue: இயேசுவின் உரைக்கான குறிப்பு
  choice: இந்த வார்த்தைகளை
  alternative: இந்தக் கூற்றுகளை; இந்தப் பிரசங்கத்தை
  rationale: உடனடியாக முந்திய இயேசுவின் போதனையையே குறிக்கிறது. கிரேக்கத்தில் இல்லாத “பிரசங்கம்” என்ற விளக்கப் பெயரைச் சேர்க்காமல், மூலத்தின் திறந்த சொற்பயன்பாடு காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. கிரேக்கக் கதைமாற்று மரபுத்தொடர் தமிழில் சுமுகமாக்கப்பட்டு, அதன் நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
