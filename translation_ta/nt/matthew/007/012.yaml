id: MAT.7.12
reference: Matthew 7:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Πάντα οὖν ὅσα ⸀ἐὰν θέλητε ἵνα ποιῶσιν ὑμῖν οἱ ἄνθρωποι, οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς· οὗτος γάρ ἐστιν ὁ νόμος καὶ οἱ προφῆται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/012.yaml
  text: Therefore[a], in everything, whatever you want people to do for you, do the same for them; for this is the Law and the Prophets.
translation:
  language: ta
  text: ஆகவே, மற்றவர்கள் உங்களுக்கு எவற்றையெல்லாம் செய்ய வேண்டும் என்று நீங்கள் விரும்புகிறீர்களோ, அவற்றையெல்லாம் நீங்களும் அவர்களுக்குச் செய்யுங்கள். ஏனெனில், இதுவே திருச்சட்டமும் இறைவாக்கினர்களும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “திருச்சட்டமும் இறைவாக்கினர்களும்” என்பது திருமறையின் பகுதிகளைக் குறிக்கும் வழக்கமான யூதச் சுருக்கச் சொற்றொடர்.
    reason: cultural_context
lexical_decisions:
- source_word: Πάντα οὖν ὅσα
  choice: ஆகவே ... எவற்றையெல்லாம் ... அவற்றையெல்லாம்
  rationale: οὖν முந்தைய போதனையிலிருந்து வரும் முடிவைக் குறிக்கிறது; Πάντα ... ὅσα என்ற விரிவான கட்டமைப்பின் அனைத்தையும் உள்ளடக்கும் வலிமையை இயல்பான தமிழில் இந்த இணை அமைப்பு காக்கிறது.
- source_word: ὅσα ἐὰν θέλητε
  choice: எவற்றையெல்லாம் ... வேண்டும் என்று நீங்கள் விரும்புகிறீர்களோ
  rationale: ἐὰν உடன் வரும் தொடர்புச் சொற்றொடர் பொதுவான, வரையறுக்கப்படாத நோக்கத்தைத் தெரிவிக்கிறது; தமிழ் நிபந்தனைத் தொடர்பமைப்பு இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: οἱ ἄνθρωποι
  choice: மற்றவர்கள்
  rationale: இங்கு ἄνθρωποι ஆண்களை மட்டும் அல்லாமல் பொதுவாக பிற மனிதர்களைக் குறிக்கிறது. ‘மற்றவர்கள்’ என்பது பாலின வரம்பின்றி எதிரெதிர் மனித உறவை இயல்பாகக் காட்டுகிறது.
- source_word: οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς
  choice: அவற்றையெல்லாம் நீங்களும் அவர்களுக்குச் செய்யுங்கள்
  rationale: οὕτως καὶ என்பதன் ஒத்திசைவு/பரஸ்பர வலிமையையும், ποιεῖτε என்ற கட்டளையின் தொடர்ச்சியான நடத்தைக்கான அழைப்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: οὗτος γάρ ἐστιν
  choice: ஏனெனில், இதுவே
  rationale: γάρ தரும் விளக்கக் காரணத்தையும் ἐστιν என்ற நேரடியான சமன்பாட்டையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ὁ νόμος καὶ οἱ προφῆται
  choice: திருச்சட்டமும் இறைவாக்கினர்களும்
  rationale: மத்தேயுவிலும் யூதப் பயன்பாட்டிலும் திருமறையின் இரு பகுதிகளைக் குறிக்கும் நிலையான சுருக்கச் சொற்றொடராக இதைப் பாதுகாக்கிறது; வெறும் பொதுச் சட்டம் அல்லது தீர்க்கதரிசிகள் எனத் தவறாகப் புரியாமல் ‘திருச்சட்டம்’ மற்றும் ‘இறைவாக்கினர்கள்’ பயன்படுத்தப்படுகின்றன.
theological_decisions:
- issue: ἄνθρωποι என்ற பொதுப்பால் சொல்
  choice: மற்றவர்கள்
  alternative: மனிதர்கள் / ஆட்கள்
  rationale: கிரேக்கச் சொல் இங்கு ஆண்களுக்கு மட்டும் உரியதல்ல; எல்லா மனித உறவுகளையும் உள்ளடக்கும் அறநெறிக் கட்டளை. ‘மற்றவர்கள்’ அந்தப் பொதுவான மற்றும் பரஸ்பர நோக்கத்தைத் தமிழில் இயல்பாகக் காக்கிறது.
- issue: ‘திருச்சட்டமும் இறைவாக்கினர்களும்’ என்பதன் பரப்பு
  choice: திருமறைத் தொகுப்பைக் குறிக்கும் சூத்திரத்தை அப்படியே தக்கவைத்தல்
  alternative: திருமறையின் அறநெறிப் போதனை முழுவதும் / சட்டம் மற்றும் இறைவாக்குப் போதனையின் சாரம்
  rationale: மூலம் நிறுவப்பட்ட யூத-மத்தேயு சுருக்கச் சூத்திரத்தையே பயன்படுத்துகிறது. அதை விளக்கவுரையாக விரித்தால் மூலத்தில் இல்லாத தீர்மானத்தைச் சேர்க்கும்; எனவே அதன் இடைநூல் மற்றும் இறையியல் ஒலிப்பைத் தக்கவைக்கிறது.
- issue: ‘இதுவே’ என்ற சமன்பாட்டின் வலிமை
  choice: இதுவே திருச்சட்டமும் இறைவாக்கினர்களும்
  alternative: இதில் திருச்சட்டமும் இறைவாக்கினர்களும் அடங்கியுள்ளன / இதுவே அவற்றின் சாரம்
  rationale: οὗτος ... ἐστιν என்ற நேரடி சமன்பாட்டை மெலிதாக்காமலும், இக்கட்டளை திருமறையை முழுமையாக மாற்றுகிறது என்ற கூடுதல் விளக்கத்தையும் புகுத்தாமலும் மொழிபெயர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்கு எளிதானதாயும் மரியாதைமிக்கதாயும் உள்ளது. ‘எவற்றையெல்லாம் ... அவற்றையெல்லாம்’ என்ற அமைப்பு மூலத்தின் முழுமையான பரப்பைத் தெளிவாகக் காக்கிறது. ‘திருச்சட்டம்’, ‘இறைவாக்கினர்கள்’ ஆகியவை மதநூல் சூழலைத் தெளிவுபடுத்தும் பரவலாகப் புரியக்கூடிய சொற்கள்.
