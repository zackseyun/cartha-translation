id: MAT.7.4
reference: Matthew 7:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἢ πῶς ἐρεῖς τῷ ἀδελφῷ σου· Ἄφες ἐκβάλω τὸ κάρφος ⸀ἐκ τοῦ ὀφθαλμοῦ σου, καὶ ἰδοὺ ἡ δοκὸς ἐν τῷ ὀφθαλμῷ σοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/004.yaml
  text: Or how will you say to your brother[a], ‘Let me take the speck out of your eye,’ and behold[c][b], the beam is in your own eye?
translation:
  language: ta
  text: அல்லது, நீ உன் சகோதரனிடம்[a], ‘உன் கண்ணிலிருந்து அந்தத் துரும்பை நான் எடுத்துப்போடட்டும்’ என்று எப்படிச் சொல்வாய்? இதோ, உன் கண்ணில் உத்திரம் இருக்கிறதே!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘சகோதரன்’ என்று மொழிபெயர்க்கப்பட்டுள்ள ஆண்பால் ஒருமைச் சொல், உடன் சீடரைக் பொதுவான பிரதிநிதிப் பொருளில் குறிக்கக்கூடும்.
    reason: cultural_note
lexical_decisions:
- source_word: ἢ πῶς ἐρεῖς
  choice: அல்லது ... எப்படிச் சொல்வாய்?
  rationale: ἢ தொடரும் மாற்றுக் கேள்வியை அறிமுகப்படுத்துகிறது; எதிர்கால வினை வடிவத்தையும் கேள்வியின் சவாலான தொனியையும் ‘சொல்வாய்’ காக்கிறது.
- source_word: τῷ ἀδελφῷ σου
  choice: உன் சகோதரனிடம்
  rationale: ஆண்பால் ஒருமை மூலவடிவத்தை நேரடியாகப் பிரதிபலிக்கிறது; சூழலில் இது உடன் இருப்பவரைக் குறிக்கும் பிரதிநிதிப் பயன்பாடாகவும் இருக்கலாம்.
- source_word: Ἄφες ἐκβάλω
  choice: எடுத்துப்போட என்னை அனுமதி
  rationale: Ἄφες இங்கு அனுமதி கோரும் கட்டளை வடிவம்; ἐκβάλω கண்ணிலுள்ள பொருளை அகற்றுவதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τὸ κάρφος
  choice: துரும்பு
  rationale: சிறிய உலர்ந்த துணுக்கு அல்லது சுள்ளித் துண்டு என்ற உருவகத்தை இயல்பாகக் காட்டி, பெரிய உத்திரத்துடனான மிகைப்படுத்தப்பட்ட வேறுபாட்டைக் காக்கிறது.
- source_word: καὶ ἰδοὺ
  choice: '... இருக்கும்போது'
  rationale: ἰδού கவனத்தை ஈர்த்து வெளிப்படையான முரண்பாட்டைச் சுட்டுகிறது. தமிழில் கேள்விக்குள் ‘இருக்கும்போது’ என அமைப்பது அந்த வலிமையை இயல்பாக வெளிப்படுத்துகிறது; தனி ‘இதோ’ என்பது இங்கு செயற்கையாக ஒலிக்கும்.
- source_word: ἡ δοκὸς
  choice: உத்திரம்
  rationale: δοκός என்பது கட்டிடத்தைத் தாங்கும் பெரிய மரக்கட்டை அல்லது விட்டம்; ‘உத்திரம்’ இதனைத் துல்லியமாகக் குறிக்கிறது.
- source_word: ἐν τῷ ὀφθαλμῷ σοῦ
  choice: உன் கண்ணில்
  rationale: இடத்தைக் குறிக்கும் கிரேக்கத் தொடரை நேரடியாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: ἀδελφῷ என்பதன் பாலினம் மற்றும் பொருள்
  choice: சகோதரன்
  alternative: சகோதரன் அல்லது சகோதரி; உடன் விசுவாசி
  rationale: மூலச்சொல் ஆண்பால் ஒருமையில் உள்ளது. விரிவான பிரதிநிதிப் பொருள் சாத்தியமானாலும், அதை முதன்மை உரையில் விளக்கமாகச் சேர்க்காமல் அடிக்குறிப்பில் குறிப்பிடுவது மூலவடிவத்தையும் அதன் சாத்தியமான பரப்பையும் காக்கிறது.
- issue: κάρφος / δοκός என்ற மிகைப்படுத்தப்பட்ட எதிர்மறை ஒப்புமை
  choice: துரும்பு / உத்திரம்
  alternative: சிறு சுள்ளி / பெரிய மரக்கட்டை
  rationale: இயேசுவின் உருவகத்திலுள்ள மிகச் சிறிய பொருளுக்கும் பெரும் கட்டுமான மரத்துக்கும் இடையேயான திட்டமிட்ட அளவு வேறுபாட்டை இச்சொற்கள் காக்கின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், நேரடியும் கண்ணியமுமான கேள்வி வடிவம். ‘உத்திரம்’ பரவலாக அறியப்படாத பகுதிகளிலும் சூழல் அதன் பெரிய கட்டுமான மரம் என்ற பொருளைத் தெளிவாக்குகிறது; மிகைப்படுத்தப்பட்ட உருவகம் பாதுகாக்கப்பட்டுள்ளது.
