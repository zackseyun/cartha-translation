review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the explanatory γάρ, the two parallel instrument/standard clauses, the judgment/measure wordplays, and the agent-unspecified passives. However, “உங்களுக்கும்” can suggest an added comparison (‘to you also’) rather than simply the dative ‘to you,’ and the passive wording for judgment is not idiomatic modern Tamil.
  naturalness: “தீர்ப்பளிக்கப்படுவீர்கள்” is awkward, since Tamil normally speaks of a judgment being rendered to someone rather than a person being ‘judgment-given.’ “அளவையால்” and the footnote’s “திருப்பி அளக்கப்படும்” are also less natural than the revised forms. The revision keeps the compact proverbial parallelism in contemporary standard Tamil.
  terminology: “தீர்ப்பு / தீர்ப்பளிக்கிறீர்கள்” appropriately avoids narrowing κρίνω to condemnation. “அளவு / அளக்கிறீர்கள் / அளக்கப்படும்” effectively preserves the μέτρον–μετρέω wordplay. “தீர்ப்பு வழங்கப்படும்” provides an idiomatic passive equivalent without identifying the unstated agent.
  issues:
  - severity: medium
    issue: The judgment passive is unnatural Tamil.
    rationale: “நீங்களும் தீர்ப்பளிக்கப்படுவீர்கள்” is not a normal way to say that someone will be judged; it can sound as though judgment is being performed through that person. “உங்களுக்கும் தீர்ப்பு வழங்கப்படும்” naturally communicates the passive result while retaining an unspecified agent.
  - severity: low
    issue: The dative and measure wording can be made clearer and more idiomatic.
    rationale: “உங்களுக்கும்” may carry an unintended additive force. “உங்களுக்கு” directly represents ὑμῖν. “அளவால்” is the normal instrumental form here, and the footnote alternative should use natural Tamil.
