- from: ஏனெனில், நீங்கள் எந்தத் தீர்ப்பினால் தீர்ப்பளிக்கிறீர்களோ, அதே தீர்ப்பினால் நீங்களும் தீர்ப்பளிக்கப்படுவீர்கள்; நீங்கள் எந்த அளவையால் அளக்கிறீர்களோ, அதே அளவையால் உங்களுக்கும் அளக்கப்படும்.[a]
