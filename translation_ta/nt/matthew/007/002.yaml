id: MAT.7.2
reference: Matthew 7:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐν ᾧ γὰρ κρίματι κρίνετε κριθήσεσθε, καὶ ἐν ᾧ μέτρῳ μετρεῖτε μετρηθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/002.yaml
  text: For with the judgment by which you judge[a], you will be judged, and with the measure by which you measure, it will be measured to you.
translation:
  language: ta
  text: ஏனெனில், நீங்கள் எந்தத் தீர்ப்பின்படி தீர்ப்பளிக்கிறீர்களோ, அதே தீர்ப்பின்படி உங்களுக்கும் தீர்ப்பு வழங்கப்படும்; நீங்கள் எந்த அளவால் அளக்கிறீர்களோ, அதே அளவால் உங்களுக்கு அளக்கப்படும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களுக்குத் திருப்பி அளக்கப்படும்.” பரஸ்பரமான பொருள் உள்ளடங்கியிருந்தாலும், “திருப்பி” என்பது கிரேக்க மூலத்தில் வெளிப்படையாக இல்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίματι / κρίνετε / κριθήσεσθε
  choice: தீர்ப்பினால் / தீர்ப்பளிக்கிறீர்களோ / தீர்ப்பளிக்கப்படுவீர்கள்
  rationale: பெயர்ச்சொல் மற்றும் அதனுடன் தொடர்புடைய வினைச்சொற்களின் சொல் ஒற்றுமையையும், ‘கண்டனம்’ என்று பொருளைக் குறுக்காமல் பொதுவான நீதித்தீர்ப்பு சார்ந்த பொருளையும் காக்கிறது.
- source_word: μέτρῳ / μετρεῖτε / μετρηθήσεται
  choice: அளவையால் / அளக்கிறீர்களோ / அளக்கப்படும்
  rationale: கிரேக்க மூலத்தில் உள்ள பெயர்ச்சொல்–வினைச்சொல் சொல்விளையாட்டையும் பழமொழித் தன்மையையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: μετρηθήσεται ὑμῖν
  choice: உங்களுக்கும் அளக்கப்படும்
  rationale: செயப்பாட்டு வடிவத்தையும் செய்பவர் குறிப்பிடப்படாத நிலையையும் காக்கிறது. ‘திருப்பி’ என்ற பரஸ்பரப் பொருள் சூழலில் உட்கிடந்தாலும் மூலத்தில் வெளிப்படையாக இல்லை.
- source_word: ἐν ᾧ ... ἐν ᾧ
  choice: எந்தத் ... அதே ...; எந்த ... அதே ...
  rationale: கருவி அல்லது அளவுகோலைக் குறிக்கும் இணை அமைப்பை, தமிழில் தெளிவான ஒத்திசைவு வடிவில் வழங்குகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்திலுள்ள தடைக்கான காரணத்தை விளக்கும் தொடர்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: பரஸ்பரத் தீர்ப்பின் செய்பவர்
  choice: தீர்ப்பளிப்பவரும் அளப்பவரும் யார் என்பதை வெளிப்படையாகக் குறிப்பிடாமல் செயப்பாட்டு வடிவம் காக்கப்பட்டது.
  alternative: ‘கடவுள் உங்களைத் தீர்ப்பார்’ அல்லது ‘மற்றவர்கள் உங்களைத் தீர்ப்பார்கள்’ என்று செய்பவரை வெளிப்படையாகக் கூறுதல்.
  rationale: கிரேக்கச் செயப்பாட்டு வினைகள் செய்பவரைக் குறிப்பிடவில்லை; ஆகவே தெய்வீகத் தீர்ப்பா, மனிதர்களிடையேயான எதிர்வினையா என்ற விளக்கத் திறப்பை மொழிபெயர்ப்பு முன்கூட்டியே முடிவு செய்யவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; மரியாதையும் பழமொழித் தாளமும் காக்கப்பட்டுள்ளன. ‘தீர்ப்பளி’ என்ற சொல் κρίμα/κρίνω தொடர்பைத் தமிழில் முடிந்தவரை வெளிப்படுத்துகிறது.
