id: MAT.7.20
reference: Matthew 7:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἄρα γε ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/020.yaml
  text: So then[a], you will recognize them by their fruits.
translation:
  language: ta
  text: ஆகவே[a], அவர்களுடைய கனிகளால் அவர்களை அடையாளம் கண்டுகொள்வீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆகவே உண்மையாகவே, அவர்களுடைய கனிகளிலிருந்து அவர்களை அறிந்துகொள்வீர்கள்.”
    reason: ἄρα γε என்பதன் மென்மையான வலியுறுத்தலையும், ἀπὸ மற்றும் ἐπιγινώσκω என்பவற்றின் மேலும் சொற்சார்ந்த மாற்று மொழிபெயர்ப்பையும் காட்டுகிறது.
lexical_decisions:
- source_word: ἄρα γε
  choice: ஆகவே
  rationale: முன்னர் கூறப்பட்டதிலிருந்து வரும் முடிவை இயல்பான நவீனத் தமிழில் காட்டுகிறது; γε தரும் மென்மையான வலியுறுத்தலை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
- source_word: ἀπὸ
  choice: -ஆல்
  rationale: இங்கு ஒருவரை அடையாளம் காண்பதற்கான அடிப்படை அல்லது சான்றைச் சுட்டுகிறது; தமிழில் ‘கனிகளால்’ என்பது இயல்பாக உள்ளது.
- source_word: καρπῶν
  choice: கனிகள்
  rationale: கிரேக்க மூலத்தின் பன்மையைப் பேணுவதோடு, சுற்றியுள்ள வசனங்களின் உருவகத்தையும் விளக்கமாக மாற்றாமல் அப்படியே வைத்திருக்கிறது.
- source_word: αὐτῶν
  choice: அவர்களுடைய
  rationale: ‘கனிகள்’ யாருக்குரியவை என்பதைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: ἐπιγνώσεσθε
  choice: அடையாளம் கண்டுகொள்வீர்கள்
  rationale: காணக்கூடிய சான்றுகளின் அடிப்படையில் அவர்கள் யார் என்பதை இனங்காணும் பொருளைத் தெளிவாக எடுத்துரைக்கிறது; எதிர்கால இரண்டாம் நபர் பன்மையையும் பேணுகிறது.
- source_word: αὐτούς
  choice: அவர்களை
  rationale: முன்னர் குறிப்பிடப்பட்ட நபர்களைக் குறிக்கும் பன்மைச் சுட்டுப்பெயரை நேரடியாகப் பேணுகிறது.
theological_decisions:
- issue: மனிதர்களை மதிப்பிடுவதில் ‘கனிகள்’ என்ற உருவகம்
  choice: ‘கனிகள்’ என்ற உருவகத்தை அப்படியே வைத்தல்
  alternative: அவர்களுடைய செயல்கள் / விளைவுகள்
  rationale: உடனடிச் சூழலுடன் உள்ள தொடர்பைப் பேணுகிறது; உருவகத்தை ஒரு குறிப்பிட்ட இறையியல் விளக்கமாகக் குறுக்காமல், அதன் இயல்பான விரிவையும் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கனிகள்’ என்ற வேதாகம உருவகம் பேணப்பட்டுள்ளது; ‘அடையாளம் கண்டுகொள்வீர்கள்’ என்பது இச்சூழலில் உள்ள இனங்காணும் பொருளைத் தெளிவாக்குகிறது.
