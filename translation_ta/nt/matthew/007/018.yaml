id: MAT.7.18
reference: Matthew 7:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐ δύναται δένδρον ἀγαθὸν καρποὺς πονηροὺς ⸀ποιεῖν, οὐδὲ δένδρον σαπρὸν καρποὺς καλοὺς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/018.yaml
  text: A good tree cannot produce bad fruit[c][b][a], nor can a rotten tree produce good fruit.
translation:
  language: ta
  text: நல்ல மரம் கெட்ட கனிகளைக் கொடுக்க முடியாது; அழுகிய மரமும் நல்ல கனிகளைக் கொடுக்க முடியாது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δένδρον ἀγαθόν
  choice: நல்ல மரம்
  rationale: ἀγαθός என்பதன் நேரடியான மதிப்பீட்டுப் பொருள் ‘நல்ல’ என்பதாகும்; இது மரத்தின் உருவகத்தையும் அதன் ஒழுக்கநெறி சார்ந்த வலிமையையும் தேவையின்றி ‘ஆரோக்கியமான’ என்று விளக்காமல் காக்கிறது.
- source_word: οὐ δύναται ... ποιεῖν
  choice: கொடுக்க முடியாது
  rationale: δύναται இயலாமையைத் தெரிவிக்கிறது; καρπούς உடன் வரும் ποιεῖν என்பதைத் தமிழில் மரம் ‘கனி கொடுக்கிறது’ என இயல்பாகச் சொல்வது பொருத்தமானது. ‘முடியாது’ என்ற சொல் கூற்றின் திட்டவட்டத்தைக் காக்கிறது.
- source_word: καρποὺς πονηρούς
  choice: கெட்ட கனிகள்
  rationale: πονηρός என்பதற்கு இங்கு தரத்திலும் மதிப்பீட்டிலும் எதிர்மறையான ‘கெட்ட’ என்பது இயல்பான தமிழ் இணை; ‘தீய’ என்பதும் சாத்தியம் என்றாலும் அது உருவகத்தை அதிகமாக ஒழுக்கவியல் நோக்கில் குறுக்கக்கூடும்.
- source_word: οὐδέ
  choice: மரமும் ... முடியாது
  rationale: οὐδέ இரண்டாம் இணைக் கூற்றையும் மறுப்பாக இணைக்கிறது. தமிழின் இயல்பான இணை அமைப்பில் ‘-உம் ... முடியாது’ என்பது ‘nor’ என்பதன் சமநிலையைத் தெளிவாகக் காட்டுகிறது.
- source_word: δένδρον σαπρόν
  choice: அழுகிய மரம்
  rationale: σαπρός என்பது அழுகிய அல்லது கெட்டுப்போன நிலையைக் குறிக்கிறது. ‘அழுகிய’ என்பது உருவகத்தைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
- source_word: καρποὺς καλούς
  choice: நல்ல கனிகள்
  rationale: καλός இங்கு நல்ல தரமுள்ள கனியைக் குறிக்கிறது. ‘நல்ல கனிகள்’ என்பது முந்தைய ‘கெட்ட கனிகள்’ என்பதுடன் தெளிவான எதிர்மறை இணையை உருவாக்குகிறது.
theological_decisions:
- issue: உருவகத்தில் கூறப்படும் இயலாமையின் தன்மை
  choice: ‘முடியாது’ எனத் திட்டவட்டமான இயலாமையாக மொழிபெயர்த்தல்
  alternative: ‘பொதுவாகக் கொடுக்காது’ அல்லது ‘கொடுக்கக்கூடாது’
  rationale: οὐ δύναται என்பது வெறும் வழக்கம், சாத்தியக்குறைவு, அல்லது கடமையை அல்லாமல் இயலாமையை நேரடியாகக் கூறுகிறது. இதற்கு அப்பாற்பட்ட கோட்பாட்டுத் தீர்மானத்தைச் சேர்க்காமல், இயேசுவின் கூற்றிலுள்ள வலுவான முரணை மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் உடனே புரிந்துகொள்ளும் வகையில், இரு இணைக் கூற்றுகளின் சமநிலையும் திட்டவட்டமான தொனியும் காக்கப்பட்டுள்ளன. ‘கனி கொடுக்கிறது’ என்ற இயல்பான தமிழ் வழக்கு பயன்படுத்தப்பட்டுள்ளது.
