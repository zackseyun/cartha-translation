source:
  edition: SBLGNT
  text: ἦν γὰρ διδάσκων αὐτοὺς ὡς ἐξουσίαν ἔχων καὶ οὐχ ὡς οἱ γραμματεῖς ⸀αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/029.yaml
  text: for he was teaching them as one having authority[a], and not as their scribes.
translation:
  language: ta
  text: ஏனெனில், அவர் அதிகாரமுடைய ஒருவர் கற்பிப்பதைப் போல் அவர்களுக்குக் கற்பித்துக்கொண்டிருந்தார்; அவர்களுடைய மறைநூல் அறிஞர்கள் கற்பித்ததைப் போல் அல்ல.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இயல்பான சொல்லாக்கத்தில், ‘அதிகாரத்தோடு கற்பித்துக்கொண்டிருந்தார்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν γὰρ διδάσκων
  choice: ஏனெனில், அவர் ... கற்பித்துக்கொண்டிருந்தார்
  rationale: γάρ முந்தைய வசனத்தில் மக்களின் வியப்புக்கான காரணத்தை விளக்குகிறது; ἦν + நிகழ்காலப் பெயரெச்சத்தின் சுற்றுவழி இறந்தகால அமைப்பு, கடந்தகாலத்தில் தொடர்ந்த கற்பித்தல் செயலைக் காட்டுகிறது.
- source_word: αὐτούς
  choice: அவர்களுக்கு
  rationale: இது கேட்டுக்கொண்டிருந்த மக்கள் கூட்டத்தைக் குறிக்கும் நேர்செயப்படுபொருள்; இயல்பான தமிழில் ‘அவர்களுக்குக் கற்பித்தார்’ என வேற்றுமை மாற்றத்துடன் வழங்கப்படுகிறது.
- source_word: ὡς ἐξουσίαν ἔχων
  choice: அதிகாரம் உடையவராக
  rationale: ἐξουσία என்பது அதிகாரம், உரிமை அல்லது ஆளுமையைக் குறிக்கிறது. இந்தத் தேர்வு கிரேக்கத்தின் நபர்சார்ந்த ஒப்பீட்டு அமைப்பைப் பாதுகாக்கிறது; வெறும் தன்னம்பிக்கை அல்லது பேச்சுத்திறன் எனக் குறுக்கவில்லை.
- source_word: καὶ οὐχ ὡς
  choice: '... போல் அல்ல'
  rationale: கிரேக்கத்தில் உள்ள வெளிப்படையான ஒப்பீட்டையும் முரண்பாட்டையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: οἱ γραμματεῖς αὐτῶν
  choice: அவர்களுடைய வேத அறிஞர்கள்
  rationale: γραμματεῖς என்பது இச்சூழலில் வேதச்சட்டத்தில் தேர்ச்சி பெற்ற அங்கீகரிக்கப்பட்ட சமய அறிஞர்களைக் குறிக்கிறது. ‘வேத அறிஞர்கள்’ நவீன வாசகர்களுக்கு பொருளைத் தெளிவுபடுத்துகிறது; αὐτῶν என்பதையும் ‘அவர்களுடைய’ எனப் பாதுகாக்கிறது.
theological_decisions:
- issue: இயேசுவின் கற்பித்தல் அதிகாரத்தின் இயல்பு
  choice: ‘அதிகாரம் உடையவராக’ என்று, அவரது கற்பித்தல் முறையையும் உண்மையான அதிகாரத்தையும் விவரிக்கும் ஒப்பீடாக மொழிபெயர்த்தல்.
  alternative: அது வெளிப்படையாகத் தெய்வீக அதிகாரம் என்று விரித்துரைத்தல், அல்லது வெறும் தன்னம்பிக்கையான பேச்சு எனக் குறைத்தல்.
  rationale: இந்த வசனம் இயேசுவின் அதிகாரத்தை வேத அறிஞர்களின் முறையுடன் வேறுபடுத்துகிறது; ஆனால் அந்த அதிகாரத்தின் முழுத் தெய்வவியல் அடிப்படையை இங்கே விளக்கவில்லை. ஆகவே உரை கூறுவதைப் பாதுகாத்து, கூறாத விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘வேதபாரகர்’ என்ற மரபுச் சொல்லைவிட உடனடியாகப் புரியும் ‘வேத அறிஞர்கள்’ பயன்படுத்தப்பட்டுள்ளது; தொடர்ச்சியான கடந்தகாலச் செயலை ‘கற்பித்துக்கொண்டிருந்தார்’ தக்கவைக்கிறது.
