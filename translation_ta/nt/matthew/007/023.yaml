source:
  edition: SBLGNT
  text: καὶ τότε ὁμολογήσω αὐτοῖς ὅτι Οὐδέποτε ἔγνων ὑμᾶς· ἀποχωρεῖτε ἀπ’ ἐμοῦ οἱ ἐργαζόμενοι τὴν ἀνομίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/023.yaml
  text: And then I will declare to them[a], ‘I never knew you; depart from me[b], you who practice lawlessness.’
translation:
  language: ta
  text: 'அப்போது நான் அவர்களிடம் வெளிப்படையாக அறிவிப்பேன்: ‘நான் உங்களை ஒருபோதும் அறிந்ததே இல்லை[a]. என்னைவிட்டு அகன்று போங்கள், சட்டமீறுதலில் ஈடுபடுகிறவர்களே[b].’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அறிந்ததே இல்லை’ என்பதற்கு சூழலுக்கு ஏற்ப ‘அங்கீகரித்ததே இல்லை’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் வெறும் தகவலறிவை மட்டுமல்லாமல், உறவுசார் அறிதலையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘சட்டமீறுதலில் ஈடுபடுகிறவர்கள்’ என்பதை ‘அக்கிரமம் செய்கிறவர்கள்’ அல்லது ‘தீமை செய்கிறவர்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τότε
  choice: அப்போது
  rationale: முந்திய வசனத்தோடு உள்ள தொடர்பையும் நிகழ்வின் கால வரிசையையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ὁμολογήσω
  choice: வெளிப்படையாகச் சொல்வேன்
  rationale: இச்சூழலில் இந்த வினை பொதுவாகவும் திட்டவட்டமாகவும் அறிவிப்பதைக் குறிக்கிறது; குற்றத்தை ஒப்புக்கொள்வது என்ற பொருள் இங்கு இல்லை.
- source_word: Οὐδέποτε
  choice: ஒருபோதும் … இல்லை
  rationale: முழுமையான, வலியுறுத்தப்பட்ட மறுப்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἔγνων
  choice: அறிந்ததே
  rationale: அறிவுசார் தெரிதலை மட்டுமல்லாமல் உறவுசார் அறிதலையும் சுமக்கக்கூடிய மூலமொழியின் சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: ἀποχωρεῖτε ἀπ’ ἐμοῦ
  choice: என்னைவிட்டு அகன்று போங்கள்
  rationale: விலகிச் செல்லும்படி இடப்படும் கடுமையான கட்டளையை நவீனமான, அதேவேளை கண்ணியமான தமிழில் தருகிறது.
- source_word: οἱ ἐργαζόμενοι
  choice: ஈடுபடுகிறவர்களே
  rationale: தொடர்ச்சியான அல்லது ஒருவரின் நடத்தையை வகைப்படுத்தும் செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὴν ἀνομίαν
  choice: சட்டமீறுதலில்
  rationale: பொதுவான தீமை என்பதைவிட, சட்டத்தையும் ஒழுங்கையும் மீறும் தன்மையை மூலச்சொல்லுக்கு நெருக்கமாகப் பாதுகாக்கிறது; அது எந்தச் சட்டம் என்பதை மொழிபெயர்ப்பில் விரித்துரைக்கவில்லை.
theological_decisions:
- issue: ‘நான் உங்களை ஒருபோதும் அறிந்ததே இல்லை’ என்பதன் பொருள்
  choice: உறவுசார் மற்றும் நியாயத்தீர்ப்புசார் பொருளைத் தாங்கக்கூடிய ‘அறிந்ததே இல்லை’ என்ற நேரடி சொல்லாட்சி வைக்கப்பட்டது.
  alternative: ‘நான் உங்களை ஒருபோதும் அங்கீகரித்ததில்லை’ அல்லது ‘நீங்கள் ஒருபோதும் என்னுடையவர்களாக இருந்ததில்லை.’
  rationale: மூலவாக்கியம் உறவுசார் அறிதலை நேரடியாகக் கூறுகிறது. அதை அங்கீகாரம், ஒப்புதல் அல்லது இரட்சிப்பு நிலை பற்றிய கோட்பாட்டு விளக்கமாக மாற்றுவது வசனம் விட்டுள்ள இறையியல் பதற்றத்தைத் தீர்த்துவிடும்.
- issue: ἀνομία என்பதன் வலிமை
  choice: ‘சட்டமீறுதல்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அக்கிரமம்’, ‘தீமை’ அல்லது ‘நியாயக்கேடு’.
  rationale: இது பொதுவான ஒழுக்கத் தீமையை மட்டும் சொல்லாமல், சட்டநெறியைப் புறக்கணிக்கும் மூலச்சொல்லின் சட்ட-ஒழுக்க வலிமையைப் பாதுகாக்கிறது; குறிப்பிட்ட சமயப்பிரிவின் சட்டக் கோட்பாட்டைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் நியாயத்தீர்ப்புச் சொல்லின் கண்ணியமான தீவிரம் நிலைத்திருக்குமாறும் வடிவமைக்கப்பட்டது. பழமையான ‘அக்கிரமச் செய்கைக்காரர்’ போன்ற அமைப்பு முதன்மை உரையில் தவிர்க்கப்பட்டது; நேரடி அழைப்பின் வலிமைக்காக ‘வர்களே’ வைக்கப்பட்டது.
