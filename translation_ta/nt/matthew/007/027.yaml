base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/027.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it fell—and its fall was great.
translation:
  language: ta
  text: மழை பெய்தது, ஆறுகள் வந்தன[a], காற்றுகள் வீசி அந்த வீட்டின்மேல் மோதின; அது விழுந்தது, அதன் வீழ்ச்சி பெரிதாக இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வெள்ளங்கள் வந்தன.’ கிரேக்கச் சொல் நேரடியாக ‘ஆறுகள்’ என்று பொருள்படும்; இச்சூழலில் அது பெருக்கெடுத்து வரும் வெள்ளநீரையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: மழை பெய்தது
  rationale: கிரேக்கத்தில் மழை ‘கீழே வந்தது’ என்ற இயக்கம் இருந்தாலும், நவீனத் தமிழில் ‘மழை பெய்தது’ என்பதே இயல்பானதும் பொருளைத் துல்லியமாகத் தருவதுமான வழக்கு.
- source_word: ἦλθον οἱ ποταμοί
  choice: ஆறுகள் வந்தன
  rationale: ποταμοί என்பதன் நேரடியான பொருள் ‘ஆறுகள்.’ வெள்ளநீரைக் குறிக்கும் சூழல்சார் சாத்தியத்தை அடிக்குறிப்பில் வைத்தபடி, மூலச்சொல்லின் உருவகத்தை முதன்மை உரை காக்கிறது.
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: காற்றுகள் வீசி
  rationale: பன்மையையும் புயல் நிகழ்வுகளின் தொடர்ச்சியான ஓசையையும் காக்கும் நேரடியான மொழிபெயர்ப்பு.
- source_word: προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ
  choice: அந்த வீட்டின்மேல் மோதின
  rationale: இச்சூழலில் προσκόπτω தடுமாறுவதைக் குறிக்காமல் வலிமையுடன் தாக்குவதைக் குறிக்கிறது; ‘மோதின’ என்பது அதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἔπεσεν
  choice: அது விழுந்தது
  rationale: ‘இடிந்து விழுந்தது’ என விரிவாக்காமல், πίπτω என்பதன் எளிய ‘விழுதல்’ பொருளைக் காக்கிறது.
- source_word: ἡ πτῶσις αὐτῆς μεγάλη
  choice: அதன் வீழ்ச்சி பெரிதாயிருந்தது
  rationale: πίπτω–πτῶσις ஆகிய உறவுடைய சொற்களை ‘விழுந்தது–வீழ்ச்சி’ எனத் தமிழிலும் பிரதிபலித்து, மூலத்தின் இறுதி வலியுறுத்தலைக் காக்கிறது.
theological_decisions:
- issue: உவமையின் முடிவிலுள்ள அழிவும் நியாயத்தீர்ப்பும் சார்ந்த படிமம்
  choice: அதன் வீழ்ச்சி பெரிதாயிருந்தது
  alternative: அது பேரழிவுடன் இடிந்து விழுந்தது
  rationale: மூலம் வீட்டின் வீழ்ச்சி பெரிது என்று மட்டுமே கூறுகிறது. இறுதிக்கால நியாயத்தீர்ப்பு போன்ற விளக்கத்தை உரைக்குள் சேர்க்காமல் எச்சரிக்கையின் வலிமையும் அதன் விளக்கத் திறப்பும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை. ‘ஆறுகள் வந்தன’ என்ற சற்றே செறிவான மூலப்படிமம் வேண்டுமென்றே காக்கப்பட்டுள்ளது; அதன் சூழல்சார் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது.
