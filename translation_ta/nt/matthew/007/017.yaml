id: MAT.7.17
reference: Matthew 7:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὕτως πᾶν δένδρον ἀγαθὸν καρποὺς καλοὺς ποιεῖ, τὸ δὲ σαπρὸν δένδρον καρποὺς πονηροὺς ποιεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/017.yaml
  text: So[a], every good tree produces good fruit[c][b], but the rotten tree produces bad fruit.
translation:
  language: ta
  text: அவ்வாறே[a], ஒவ்வொரு நல்ல மரமும் நல்ல கனிகளைக் கொடுக்கிறது; ஆனால் அழுகிய[b] மரமோ கெட்ட கனிகளைக்[c] கொடுக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவ்வாறே” என்பதற்கு “இதன்படி” அல்லது “இவ்விதமாக” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அழுகிய” என்று மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொல் “கெட்டுப்போன,” “பயனற்ற,” அல்லது “கெட்ட” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: c
    text: “கெட்ட கனிகள்” என்பதை “தீய கனிகள்” என்றும் மொழிபெயர்க்கலாம்; “கெட்ட” என்பது விவசாய உருவகத்தில் இயல்பாக இருந்து, சூழலின் அறநெறிக் குறிப்பையும் தக்கவைக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: அவ்வாறே
  rationale: முந்தைய உவமையிலிருந்து தொடரும் ஒப்பீட்டு மற்றும் முடிவுரைக்கும் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: πᾶν δένδρον
  choice: ஒவ்வொரு ... மரமும்
  rationale: ஒருமை பெயர்ச்சொல்லுடன் வரும் πᾶν என்பதன் பகிர்ந்தளிக்கும் பொருளையும் பொதுவான பழமொழித் தன்மையையும் தெளிவாகக் காட்டுகிறது.
- source_word: ἀγαθὸν
  choice: நல்ல
  rationale: மரத்தின் நேர்மறையான தரத்தை எளிமையாகக் குறிக்கிறது; உருவகத்தின் அறநெறிப் பொருளை மொழிபெயர்ப்பிலேயே மிகைப்படுத்துவதில்லை.
- source_word: καρποὺς καλοὺς
  choice: நல்ல கனிகள்
  rationale: καλός என்பதன் நல்ல, சிறந்த என்ற பொருளை இச்சூழலில் இயல்பாக வழங்குகிறது.
- source_word: ποιεῖ
  choice: கொடுக்கிறது
  rationale: மரம் கனியை உண்டாக்குவதைத் தமிழில் இயல்பாகச் சொல்லும் வழக்கு; கிரேக்க வினையின் விளைவு சார்ந்த பொருளைத் தக்கவைக்கிறது.
- source_word: τὸ δὲ
  choice: ஆனால் ... மரமோ
  rationale: δέ குறிக்கும் தெளிவான முரண்பாட்டைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: σαπρὸν
  choice: அழுகிய
  rationale: σαπρός குறிக்கும் அழுகிய, கெட்டுப்போன நிலையை விவசாய உருவகத்துக்கு ஏற்றவாறு தெளிவாகக் காட்டுகிறது.
- source_word: καρποὺς πονηροὺς
  choice: கெட்ட கனிகள்
  rationale: விவசாய உருவகத்தில் இயல்பாக ஒலிக்கிறது; அதேவேளையில் சூழலில் உள்ள எதிர்மறையான அறநெறிக் குறிப்பையும் முற்றிலும் நீக்குவதில்லை.
theological_decisions:
- issue: உருவகத்தின் அறநெறிப் பொருளா அல்லது வெறும் விவசாயப் பொருளா
  choice: மரம்–கனி உருவகத்தை நேரடியாக வைத்திருந்து, அதன் அறநெறிப் பயன்பாட்டை மொழிபெயர்ப்பில் வெளிப்படையாகச் சேர்க்கவில்லை.
  alternative: “நல்லொழுக்கக் கனிகள்” அல்லது “தீய செயல்கள்” போன்ற விளக்கமளிக்கும் சொற்களைப் பயன்படுத்துதல்.
  rationale: இந்த வசனம் கள்ளத் தீர்க்கதரிசிகளைப் பற்றிய எச்சரிக்கையின் சூழலில் இருந்தாலும், கிரேக்க மூலவாக்கியம் உருவகத்தையே கூறுகிறது; அதன் பயன்பாட்டைச் சூழல் உணர்த்த அனுமதிப்பது மூலத்தின் இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையான, கண்ணியமான, பழமொழித் தன்மையுள்ள நடை பயன்படுத்தப்பட்டுள்ளது. “மரமோ” என்ற வடிவம் இரு வகை மரங்களுக்கிடையிலான முரண்பாட்டை இயல்பாக வலியுறுத்துகிறது.
