id: MAT.7.11
reference: Matthew 7:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὄντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς δώσει ἀγαθὰ τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/011.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will your Father in the heavens give good things to those who ask him.
translation:
  language: ta
  text: ஆகவே, தீயவர்களாய் இருக்கும் நீங்கள் உங்கள் பிள்ளைகளுக்கு நல்ல பரிசுகளைக் கொடுக்க அறிந்திருக்கிறீர்கள் என்றால், வானங்களில் இருக்கிற உங்கள் தந்தை[a] தம்மிடம் கேட்கிறவர்களுக்கு நல்லவற்றை[b] எவ்வளவு அதிகமாகக் கொடுப்பார்!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பாரம்பரியமாக, ‘வானத்தில் இருக்கிற உங்கள் தந்தை’ என்றும் மொழிபெயர்க்கப்படுகிறது. கிரேக்கத்தில் ‘வானங்கள்’ என்பது பன்மையில் உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: சில மொழிபெயர்ப்புகள் இங்கே ‘நல்ல பரிசுகளை’ என்று கூறுகின்றன; ஆனால் கிரேக்கத்தில் இப்பகுதி ‘நல்லவற்றை’ என்று மட்டுமே கூறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηροὶ ὄντες
  choice: தீயவர்களாகிய
  rationale: கிரேக்கத்தின் நேரடியான மனித இயல்பு குறித்த விளக்கத்தை மென்மைப்படுத்தாமலும், ‘கொடியவர்கள்’ என்று தேவையின்றிக் கடுமையாக்காமலும் காக்கிறது.
- source_word: οἴδατε ... διδόναι
  choice: கொடுக்க அறிந்திருக்கிறீர்கள்
  rationale: இது வெறும் அறிவைக் காட்டாமல், எப்படிக் கொடுக்க வேண்டும் என்ற நடைமுறை அறிவைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δόματα ἀγαθὰ
  choice: நல்ல பரிசுகள்
  rationale: δόματα என்பதன் ‘கொடுக்கப்படும் பரிசுகள்’ என்ற பொருளையும் ἀγαθὰ என்பதன் பண்பையும் தெளிவாகக் காக்கிறது.
- source_word: τοῖς τέκνοις ὑμῶν
  choice: உங்கள் பிள்ளைகளுக்கு
  rationale: τέκνα ஆண், பெண் இருபாலரையும் உள்ளடக்கும் பொதுச்சொல்; ‘பிள்ளைகள்’ நவீனத் தமிழில் இயல்பானது.
- source_word: πόσῳ μᾶλλον
  choice: எவ்வளவு அதிகமாக
  rationale: குறைந்ததிலிருந்து அதிகத்திற்குச் செல்லும் இயேசுவின் ஒப்பீட்டு வாதத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: வானங்களில் இருக்கிற உங்கள் தந்தை
  rationale: ‘தந்தை’ என்பதையும் அதை விளக்கும் இடக்குறிப்பையும் தனித்தனியாகக் காப்பதுடன், οὐρανοῖς என்பதன் பன்மையையும் வெளிப்படுத்துகிறது.
- source_word: δώσει ἀγαθὰ
  choice: நல்லவற்றைக் கொடுப்பார்
  rationale: இரண்டாம் பகுதியில் δόματα மீண்டும் வராததால், ἀγαθὰ என்பதைப் பொருளடைந்த பெயரடையாக ‘நல்லவை’ என மொழிபெயர்க்கிறது; ‘பரிசுகள்’ என்பதைச் சேர்ப்பதில்லை.
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: தம்மிடம் கேட்கிறவர்களுக்கு
  rationale: பொதுவாகவும் தொடர்ந்தும் கேட்பவர்களைக் குறிக்கும் நிகழ்காலப் பெயரெச்சத்தின் பொருளை இயல்பான தமிழில் தருகிறது; மரியாதைத் தற்சுட்டாக ‘தம்மிடம்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: πονηροὶ ὄντες என்பதன் மனித இயல்பு குறித்த வலிமை
  choice: ‘தீயவர்களாகிய’ என்ற நேரடியான வருணனையைத் தக்கவைத்தல்
  alternative: ‘குறைபாடுள்ளவர்களாகிய’ அல்லது ‘பாவ இயல்புள்ளவர்களாகிய’
  rationale: மனிதர்களுக்கும் தந்தையின் மேன்மையான நன்மைக்கும் இடையிலான கூர்மையான வேறுபாட்டைக் காக்கிறது; அதேவேளை விரிவான ஒரு குறிப்பிட்ட பாவக் கோட்பாட்டை வசனத்திற்குள் சேர்ப்பதில்லை.
- issue: ὁ ἐν τοῖς οὐρανοῖς என்பதன் வடிவம்
  choice: ‘வானங்களில் இருக்கிற உங்கள் தந்தை’
  alternative: ‘பரலோகத் தந்தை’ அல்லது ‘வானத்தில் இருக்கிற உங்கள் தந்தை’
  rationale: இடத்தைக் குறிக்கும் கிரேக்கத் தொடரையும் ‘வானங்கள்’ என்ற பன்மையையும் வெளிப்படையாகக் காக்கிறது; பாரம்பரியப் பெயரடை வடிவத்தால் அதை மாற்றுவதில்லை.
- issue: இரண்டாம் ἀγαθὰ என்பதில் ‘பரிசுகள்’ சேர்க்கப்படுமா
  choice: ‘நல்லவற்றை’ என்று மட்டும் மொழிபெயர்த்தல்
  alternative: ‘நல்ல பரிசுகளை’
  rationale: முதல் பகுதியில் உள்ள δόματα என்ற பெயர்ச்சொல் இரண்டாம் பகுதியில் மீண்டும் வரவில்லை. ஆகவே கிரேக்கத்தில் உள்ள திறந்த பொருள் வரம்பைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் மரியாதையும் வேதவாக்கியத்திற்குரிய கண்ணியமும் குன்றாத வகையிலும் வடிவமைக்கப்பட்டது. கிரேக்க வாக்கியத்தின் ‘என்றால்—எவ்வளவு அதிகமாக’ என்ற வலியுறுத்தும் ஒப்பீட்டு அமைப்பு இயல்பான தமிழில் காக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னர் வைக்கப்பட்டுள்ளன.
