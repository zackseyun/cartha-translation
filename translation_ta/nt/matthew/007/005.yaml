  source_fidelity: மூலத்தின் நேரடி விளிவேற்றுமைக் கடிந்துரை (ὑποκριτά), முதன்மை வரிசை (πρῶτον), பெரிய கட்டிட மரம் (δοκός), தெளிவாகக் காணுதல் (διαβλέψεις), சிறிய துரும்பு (κάρφος), மற்றும் ஆண்பால் ஒருமை உறவுமுறைச் சொல் (ἀδελφοῦ) அனைத்தும் பொருளுக்கு உண்மையாகக் கொடுக்கப்பட்டுள்ளன. “அகற்றுவதற்குத் தெளிவாகப் பார்ப்பாய்” என்பது διαβλέψεις ἐκβαλεῖν என்பதன் நோக்கத் தொடர்பையும் எதிர்காலப் பொருளையும் இயல்பாகத் தக்கவைக்கிறது.
  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாகவும், இயேசுவின் கூர்மையான கண்டனத்திற்கேற்ற கண்ணியமான பதிவிலும் உள்ளது. “உத்திரம்” ஓரளவு மரபுவழி/கட்டிடச் சொல் என்றாலும், பெரிய மரத் தாங்குக்கட்டையின் படிமத்தைத் துல்லியமாகக் காக்கும் பொதுவாக அறியத்தக்க வேதாகமப் பயன்பாடாக இச்சூழலில் இயங்குகிறது.
