id: MAT.7.5
reference: Matthew 7:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὑποκριτά, ἔκβαλε πρῶτον ⸂ἐκ τοῦ ὀφθαλμοῦ σοῦ τὴν δοκόν⸃, καὶ τότε διαβλέψεις ἐκβαλεῖν τὸ κάρφος ἐκ τοῦ ὀφθαλμοῦ τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/005.yaml
  text: Hypocrite[a], first remove the beam from your eye[b], and then you will see clearly to remove the speck from your brother’s eye.
translation:
  language: ta
  text: வெளிவேடக்காரனே, முதலில் உன் கண்ணிலிருந்து உத்திரத்தை அகற்றிவிடு; அப்போது உன் சகோதரனுடைய கண்ணிலிருந்து துரும்பை அகற்றுவதற்குத் தெளிவாகப் பார்ப்பாய்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποκριτά
  choice: வெளிவேடக்காரனே
  rationale: ஒருமை விளிவேற்றுமையில் நேரடியாகக் கடிந்துகொள்ளும் சொல்லாக இருப்பதால், கூர்மையையும் பாசாங்கு என்ற பொருளையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ἔκβαλε / ἐκβαλεῖν
  choice: அகற்றிவிடு / அகற்றுவதற்கு
  rationale: கண்ணிலுள்ள தடையை வெளியே எடுக்கும் உருவகத்திற்கு இயல்பான நவீனத் தமிழ்; இரு இடங்களிலும் ஒரே வினைச்சொல் தொடர்பைத் தக்கவைக்கிறது.
- source_word: πρῶτον
  choice: முதலில்
  rationale: செயல்களின் முன்னுரிமையையும் வரிசையையும் நேரடியாகக் குறிக்கிறது.
- source_word: δοκόν
  choice: உத்திரத்தை
  rationale: கட்டிடத்தைத் தாங்கும் பெரிய மரக்கட்டையைக் குறிக்கும் δοκός என்பதற்கான துல்லியமான தமிழ்ச் சொல்; சிறிய துரும்புடனான மிகைப்படுத்தப்பட்ட முரண்பாட்டைக் காக்கிறது.
- source_word: διαβλέψεις
  choice: தெளிவாகப் பார்ப்பாய்
  rationale: διαβλέπω என்பதிலுள்ள தெளிவாகப் பார்க்கும் தீவிரப் பொருளையும் எதிர்கால வடிவையும் தக்கவைக்கிறது; இது திறன் குறித்த மறைபொருளையும் திறந்தவாறே வைக்கிறது.
- source_word: κάρφος
  choice: துரும்பை
  rationale: சிறிய உலர்ந்த துகள் அல்லது மெல்லிய சிதலைக் குறிக்கும் சொல்; கண்ணில் இருப்பதாகச் சொல்லப்படும் உருவகத்திற்கும் உத்திரத்துடனான அளவு முரண்பாட்டிற்கும் இயல்பாகப் பொருந்துகிறது.
- source_word: ἀδελφοῦ
  choice: சகோதரனுடைய
  rationale: கிரேக்கத்தின் ஆண்பால் ஒருமையையும் உறவுமுறைச் சொல்லையும் பொதுமைப்படுத்தாமல் தக்கவைக்கிறது.
theological_decisions:
- issue: ἀδελφοῦ என்ற பாலினம் குறிக்கப்பட்ட உறவுமுறைச் சொல்
  choice: சகோதரனுடைய
  alternative: மற்றவருடைய / அயலானுடைய
  rationale: மூலத்தில் ஆண்பால் ஒருமை தெளிவாக உள்ளது; அது சமய அல்லது ஒழுக்கச் சமூகத்திற்குள் உள்ள உறவையும் சுட்டக்கூடும். ஆகவே பாலினமற்ற சொல்லாக மாற்றப்படவில்லை.
- issue: διαβλέψεις ἐκβαλεῖν என்பதன் தொடரமைப்பு
  choice: அகற்றுவதற்குத் தெளிவாகப் பார்ப்பாய்
  alternative: அகற்றுவதற்கு உன்னால் தெளிவாகப் பார்க்க முடியும்
  rationale: மூலத்தின் சொற்றொடருக்கு நெருக்கமாக இருந்து, இது வெறும் தெளிவான பார்வையா அல்லது அகற்றும் திறனையும் உட்படுத்துகிறதா என்ற இயல்பான பொருள் நுணுக்கத்தைத் தீர்மானிக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; நேரடியான கடிந்துரை மற்றும் மிகைப்படுத்தப்பட்ட கண் உருவகம் கண்ணியமான, பொதுவாகப் புரியும் நடையில் தக்கவைக்கப்பட்டுள்ளன. ‘உத்திரம்’ கட்டிட மரத்தைக் குறிக்கும் துல்லியமான சொல்; வசனத்தின் படிம முரண்பாட்டை வலுப்படுத்துகிறது.
