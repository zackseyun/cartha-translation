id: MAT.7.10
reference: Matthew 7:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀ἢ καὶ ⸂ἰχθὺν αἰτήσει⸃— μὴ ὄφιν ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/010.yaml
  text: Or if he asks for a fish—he will not give him a snake[b][a], will he?
translation:
  language: ta
  text: அல்லது, அவன் மீன் கேட்டால்—அவனுக்குப் பாம்பைக் கொடுப்பாரா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்தக் கேள்வி “கொடுக்கமாட்டார்” என்ற பதிலை எதிர்பார்க்கிறது.
    reason: rhetorical_force
lexical_decisions:
- source_word: ἢ καὶ
  choice: அல்லது
  rationale: முந்தைய எடுத்துக்காட்டைத் தொடர்ந்து இரண்டாவது மாற்று எடுத்துக்காட்டை அறிமுகப்படுத்துகிறது; καί-ஐத் தனியே மொழிபெயர்ப்பது தமிழில் தேவையற்றதாக இருக்கும்.
- source_word: ἰχθὺν
  choice: மீன்
  rationale: உணவுச் சூழலில் வரும் சாதாரண பொருளை நேரடியாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: αἰτήσει
  choice: கேட்டால்
  rationale: எதிர்கால வினை வடிவம் பொதுவான நிபந்தனை எடுத்துக்காட்டாகப் பயன்படுகிறது; தமிழில் நிபந்தனை வினையெச்சம் இயல்பாக அந்தப் பொருளைத் தருகிறது.
- source_word: μὴ
  choice: கொடுப்பாரா?
  rationale: எதிர்மறையான பதிலை எதிர்பார்க்கும் வினாவைத் தமிழின் சூழல்சார் வினா வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὄφιν
  choice: பாம்பை
  rationale: நவீனத் தமிழில் இவ்விலங்கிற்கான இயல்பான பொதுச் சொல்.
- source_word: ἐπιδώσει
  choice: கொடுப்பார்
  rationale: இச்சூழலில் ‘கொடு’ என்பதே தெளிவான, இயல்பான பொருத்தம்.
- source_word: αὐτῷ
  choice: அவனுக்கு
  rationale: மறைமுகச் செயப்படுபொருளைத் தமிழில் இயல்பான நான்காம் வேற்றுமை வடிவில் தருகிறது.
theological_decisions:
- issue: எதிர்மறைப் பதிலை எதிர்பார்க்கும் சொல்லாட்சிக் கேள்வி
  choice: “அவனுக்குப் பாம்பைக் கொடுப்பாரா?” என்று கேள்வியாக மொழிபெயர்த்தல்
  alternative: “அவனுக்குப் பாம்பைக் கொடுக்கமாட்டார்” என்று கூற்றாக மொழிபெயர்த்தல்
  rationale: μή உடன் அமைந்த கிரேக்கக் கேள்வி ‘இல்லை’ என்ற பதிலை எதிர்பார்க்கிறது. கேள்வி வடிவத்தைத் தக்கவைப்பது இயேசுவின் வாதத்தின் சொல்லாட்சிச் சக்தியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், கண்ணியமான தமிழ். முந்தைய வசனத்தில் தந்தையைக் குறிக்கும் ஒருமை ஆண்பால் எழுவாய் தொடர்வதால் மரியாதை வினைமுற்றான “கொடுப்பார்” பயன்படுத்தப்பட்டுள்ளது; கிரேக்கத்தின் இடைநிறுத்தத்தை நீண்ட கோடு பிரதிபலிக்கிறது.
