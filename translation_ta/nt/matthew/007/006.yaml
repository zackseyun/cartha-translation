source:
  edition: SBLGNT
  text: Μὴ δῶτε τὸ ἅγιον τοῖς κυσίν, μηδὲ βάλητε τοὺς μαργαρίτας ὑμῶν ἔμπροσθεν τῶν χοίρων, μήποτε ⸀καταπατήσουσιν αὐτοὺς ἐν τοῖς ποσὶν αὐτῶν καὶ στραφέντες ῥήξωσιν ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/006.yaml
  text: Do not give what is holy to dogs[a], and do not throw your pearls before pigs[d][c][b], lest they trample them under their feet and turn and tear you to pieces.
translation:
  language: ta
  text: பரிசுத்தமானதை நாய்களுக்குக் கொடுக்காதீர்கள்[a]; உங்கள் முத்துக்களைப் பன்றிகளுக்கு முன் எறியாதீர்கள்[b]. அவை அவற்றைத் தங்கள் கால்களால் மிதித்து, திரும்பி உங்களைக் கிழித்துப்போடக்கூடும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்தமான பொருளை” அல்லது “புனிதமானதை.” கிரேக்கத் தொடர் பொதுவானது; பரிசுத்தமாக்கப்பட்ட அல்லது புனிதமான எதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'மரபுவழி நடை: “உங்கள் முத்துக்களைப் பன்றிகளுக்கு முன் வீசாதீர்கள்.”'
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “உங்களைப் பிய்த்துப்போடக்கூடும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἅγιον
  choice: பரிசுத்தமானதை
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட நடுநிலை ஒருமை அடைமொழியின் பரந்த பொருளைத் தக்கவைக்கிறது; இது ஒரு குறிப்பிட்ட பரிசுத்தப் பொருளையோ போதனையையோ என வரையறுக்கவில்லை.
- source_word: τοῖς κυσίν
  choice: நாய்களுக்கு
  rationale: உருவகத்தின் நேரடியான, கடுமையான தன்மையை மென்மையாக்காமல் தக்கவைக்கிறது.
- source_word: βάλητε
  choice: எறியாதீர்கள்
  rationale: βάλλω என்பதன் பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: τοὺς μαργαρίτας ὑμῶν
  choice: உங்கள் முத்துக்களை
  rationale: பன்மையையும் உடைமைச் சுட்டையும் நேரடியாகத் தக்கவைக்கிறது.
- source_word: ἔμπροσθεν τῶν χοίρων
  choice: பன்றிகளுக்கு முன்
  rationale: இடத்தைக் குறிக்கும் கிரேக்கத் தொடரை இயல்பான தமிழில் மொழிபெயர்க்கிறது.
- source_word: μήποτε
  choice: கூடும்
  rationale: எச்சரிக்கும் எதிர்மறை நோக்கம் அல்லது விளைவைக் காட்டும் μήποτε என்பதை தமிழில் இயல்பான சாத்திய எச்சரிக்கையாக வெளிப்படுத்துகிறது.
- source_word: καταπατήσουσιν αὐτοὺς ἐν τοῖς ποσὶν αὐτῶν
  choice: அவை அவற்றைத் தங்கள் கால்களால் மிதித்துவிட்டு
  rationale: αὐτοὺς என்பது முத்துக்களைக் குறிக்கும் ஆண்பால் பன்மை சுட்டுப்பெயர்; தமிழில் ‘அவற்றை’ எனத் தெளிவாகிறது. ἐν τοῖς ποσὶν என்பது செயற்கருவிப் பொருளில் ‘தங்கள் கால்களால்’ என இயல்பாக வழங்கப்படுகிறது.
- source_word: στραφέντες
  choice: திரும்பி
  rationale: மிதித்த பின் அடுத்ததாக நிகழும் பகைமையான செயலின் தொடரைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: ῥήξωσιν ὑμᾶς
  choice: உங்களைக் கிழித்துப்போடக்கூடும்
  rationale: ῥήγνυμι வெளிப்படுத்தும் வன்மையான கிழித்தல் அல்லது பிய்த்தல் என்ற உருவகத்தை ‘தாக்கும்’ என்று மென்மையாக்காமல் வழங்குகிறது; ὑμᾶς என்பதன் பன்மை சூழலால் தமிழில் புரிகிறது.
theological_decisions:
- issue: ‘பரிசுத்தமானது,’ ‘நாய்கள்,’ ‘முத்துக்கள்,’ ‘பன்றிகள்’ ஆகிய உருவகங்களின் விளக்கம்
  choice: உருவகங்களை விளக்க விரிவாக்கமின்றி அப்படியே தக்கவைத்தல்
  alternative: ‘பரிசுத்தமானது’ அல்லது ‘முத்துக்கள்’ என்பவற்றை இறையரசின் போதனை என்றும், ‘நாய்கள்’ மற்றும் ‘பன்றிகள்’ என்பவற்றை நற்செய்தியை எதிர்ப்போர் என்றும் வெளிப்படையாக விளக்குதல்
  rationale: வசனம் இந்த உருவகங்களின் குறிப்பான பொருளை வரையறுப்பதில்லை. ஆகவே ஒரு குறுகிய இறையியல் விளக்கத்தை உரைக்குள் சேர்க்காமல் மூலத்தின் பொருள் திறப்பையும் பதற்றத்தையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ். பன்மை கட்டளைக்கு மரியாதை/பன்மை வடிவமான ‘-ஆதீர்கள்’ பயன்படுத்தப்பட்டுள்ளது. விலங்கு உருவகங்களின் பண்பாட்டு கடுமை மென்மையாக்கப்படவில்லை; தெளிவில்லாத உருவகப் பொருள் விளக்கமாக உரைக்குள் சேர்க்கப்படவில்லை.
