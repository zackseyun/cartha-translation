source:
  edition: SBLGNT
  text: ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς. μήτι συλλέγουσιν ἀπὸ ἀκανθῶν ⸀σταφυλὰς ἢ ἀπὸ τριβόλων σῦκα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/016.yaml
  text: You will recognize them by their fruits[a]. Do people gather grapes from thorns[b], or figs from thistles?
translation:
  language: ta
  text: அவர்களுடைய கனிகளினால்[a] அவர்களை அறிந்துகொள்வீர்கள். முட்செடிகளிலிருந்து திராட்சைப் பழங்களையோ, முட்புதர்களிலிருந்து அத்திப்பழங்களையோ பறிப்பார்களா?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய கனிகளைக் கொண்டு அவர்களை அடையாளம் கண்டுகொள்வீர்கள்.”
    reason: lexical_alternative
  - marker: b
    text: 'இந்தக் கேள்வி எதிர்மறையான பதிலை எதிர்பார்க்கிறது: முட்செடிகளிலிருந்து திராட்சைப் பழங்களையோ, முட்புதர்களிலிருந்து அத்திப்பழங்களையோ மக்கள் பறிப்பதில்லை.'
    reason: rhetorical_clarification
lexical_decisions:
- source_word: καρπῶν
  choice: கனிகளினால்
  rationale: கிரேக்கத்தில் உள்ள பன்மையையும் வேளாண்மை உருவகத்தையும் தக்கவைக்கிறது; செயல்கள் அல்லது விளைவுகள் என்று விளக்கிக் கூறாமல் உள்ளது.
- source_word: ἐπιγνώσεσθε
  choice: அறிந்துகொள்வீர்கள்
  rationale: கவனிக்கக்கூடிய கனிகளின் அடிப்படையில் ஒருவரை அறிதல் அல்லது அடையாளம் காணுதல் என்ற சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது; ‘முழுமையாக அறிவீர்கள்’ என்று மிகைப்படுத்தவில்லை.
- source_word: μήτι
  choice: …பறிப்பார்களா?
  rationale: எதிர்மறையான பதிலை எதிர்பார்க்கும் கிரேக்க வினாவை இயல்பான தமிழ் சொல்லாட்சியிலுள்ள வினாவாக வழங்குகிறது; அதன் எதிர்பார்க்கப்படும் பதிலை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: συλλέγουσιν
  choice: பறிப்பார்களா
  rationale: செடியிலிருந்து உண்ணக்கூடிய பழங்களைச் சேகரிப்பதைக் குறிக்க இச்சூழலில் இயல்பான தமிழ் வினை.
- source_word: ἀκανθῶν
  choice: முட்செடிகளிலிருந்து
  rationale: முட்களையோ முட்செடிகளையோ குறிக்கக்கூடிய சொல்லின் தாவரப் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: σταφυλάς
  choice: திராட்சைப் பழங்களை
  rationale: கிரேக்கப் பன்மைக்கான நேரடியான, தெளிவான தமிழ் இணை.
- source_word: τριβόλων
  choice: முட்புதர்களிலிருந்து
  rationale: முட்களுள்ள களைச்செடி அல்லது புதரைக் குறிக்கும் சொல்லை நவீன வாசகருக்குப் புரியும் வகையில் தருகிறது; ἀκανθῶν என்பதிலிருந்து சிறிய சொல்லியல் வேறுபாட்டையும் காக்கிறது.
- source_word: σῦκα
  choice: அத்திப்பழங்களை
  rationale: கிரேக்கப் பன்மைக்கான வழக்கமான தமிழ் இணை.
- source_word: αὐτῶν / αὐτούς
  choice: அவர்களுடைய / அவர்களை
  rationale: முந்தைய வசனத்தில் பேசப்பட்ட மனிதர்களை—சூழலில் பொய்த்தீர்க்கதரிசிகளை—குறிக்கும் தனிப்பட்ட சுட்டைத் தக்கவைக்கிறது.
theological_decisions:
- issue: மனிதர்களை பகுத்தறிவதில் ‘கனிகள்’ என்ற உருவகத்தின் பொருள்
  choice: ‘கனிகள்’ என்ற உருவகத்தை அப்படியே தக்கவைத்தல்
  alternative: ‘செயல்கள்’ அல்லது ‘அவர்கள் உண்டாக்கும் விளைவுகள்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: இயேசுவின் வேளாண்மை உருவகத்தையும் அதன் விரிவான இறையியல் ஒலிப்பையும் காக்கிறது; உருவகத்தின் பொருளை ஒரு குறிப்பிட்ட விளக்கத்திற்குள் குறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை. ‘கனிகள்’ என்ற வேதாகம உருவகம் பாதுகாக்கப்பட்டுள்ளது; இணை அமைப்பும் எதிர்மறைப் பதிலை எதிர்பார்க்கும் வினாவும் தக்கவைக்கப்பட்டுள்ளன.
