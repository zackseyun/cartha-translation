id: MAT.7.13
reference: Matthew 7:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Εἰσέλθατε διὰ τῆς στενῆς πύλης· ὅτι πλατεῖα ⸂ἡ πύλη⸃ καὶ εὐρύχωρος ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ἀπώλειαν, καὶ πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/013.yaml
  text: Enter through the narrow gate[a]. For wide is the gate and broad is the road that leads to destruction[c][b], and many are those who enter through it.
translation:
  language: ta
  text: இடுக்கமான வாயில் வழியாக நுழையுங்கள். ஏனெனில், வாயில் அகலமானது; அழிவுக்கு[b] வழிநடத்தும் பாதை விசாலமானது[a]; அதன் வழியாக[c] நுழைகிறவர்கள் பலர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாதை அகலமாகவும் இடவசதியுள்ளதாகவும் உள்ளது.” கிரேக்கச் சொல் அகலத்தையும் தாராளமான இடவசதியையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கேடுக்கு” அல்லது “நாசத்துக்கு.”
    reason: lexical_alternative
  - marker: c
    text: “அதன்” என்பது வாயிலையோ பாதையையோ குறிக்கலாம்; கிரேக்கத்தில் இரண்டும் பெண்பால் பெயர்ச்சொற்கள்.
    reason: referent_ambiguity
lexical_decisions:
- source_word: Εἰσέλθατε
  choice: நுழையுங்கள்
  rationale: இரண்டாம் நபர் பன்மை ஏவலை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: διὰ τῆς στενῆς πύλης
  choice: இடுக்கமான வாயில் வழியாக
  rationale: διά உடன் வரும் மரபுவேற்றுமை, ஒன்றின் ஊடாகச் செல்லும் இயக்கத்தைக் குறிக்கிறது. στενός என்பதன் இடவியல் எதிர்மறை இங்கு ‘இடுக்கமான’ என்று இயல்பாக வெளிப்படுகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளைக்கான விளக்கக் காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: πλατεῖα ἡ πύλη
  choice: வாயில் அகலமானது
  rationale: πλατύς என்பதன் சாதாரண இடவியல் பொருளைத் தெளிவாகக் கொடுத்து, இடுக்கமான வாயிலுடன் உள்ள முரண்பாட்டைப் பேணுகிறது.
- source_word: εὐρύχωρος ἡ ὁδός
  choice: பாதை விசாலமானது
  rationale: εὐρύχωρος என்பது அகன்ற அல்லது தாராளமான இடவசதியுள்ள ஒன்றைக் குறிக்கலாம். ‘விசாலமானது’ இரு நிழற்பொருள்களையும் இயல்பாக உள்ளடக்குகிறது.
- source_word: ἡ ἀπάγουσα
  choice: வழிநடத்தும்
  rationale: பாதையின் திசையையும் இறுதி விளைவையும் சுட்டும் நிகழ்காலப் பெயரெச்சத்தின் பொருளைப் பேணுகிறது.
- source_word: εἰς τὴν ἀπώλειαν
  choice: அழிவுக்கு
  rationale: ἀπώλεια குறிக்கும் அழிவு அல்லது கேடான முடிவின் தீவிரத்தைப் பேணுகிறது; அதன் முழுத் தத்துவவியல் தன்மையை உரை கூறுவதைக் காட்டிலும் குறுகலாக வரையறுக்கவில்லை.
- source_word: πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς
  choice: அதன் வழியாக நுழைகிறவர்கள் பலர்
  rationale: ‘பலர்’ என்பதற்கான கிரேக்க அழுத்தத்தைப் பேணுகிறது. αὐτῆς என்பதன் பிரதிப்பெயர் வடிவத்தையும், அதன் சாத்தியமான முன்னிலைக் குறிப்பின் தெளிவின்மையையும் தமிழில் தக்கவைக்கிறது.
theological_decisions:
- issue: ἀπώλεια என்பதன் பொருள்
  choice: அழிவு
  alternative: கேடு; நாசம்
  rationale: இயேசுவின் எச்சரிக்கையின் கடுமையை ‘அழிவு’ தெளிவாக வெளிப்படுத்துகிறது; அதே நேரத்தில், அந்த முடிவின் தத்துவவியல் இயல்பை வசனம் கூறுவதைக் காட்டிலும் அதிகமாக வரையறுக்காது.
- issue: δι’ αὐτῆς என்பதன் முன்னிலைக் குறிப்பு
  choice: அதன் வழியாக
  alternative: அந்த வாயில் வழியாக; அந்தப் பாதையில்
  rationale: πύλη (‘வாயில்’), ὁδός (‘பாதை’) ஆகிய இரண்டும் கிரேக்கத்தில் பெண்பால் பெயர்ச்சொற்கள்; எனவே αὐτῆς இலக்கணப்படி இரண்டில் எதையும் குறிக்கக்கூடும். வாயில் என்பதே சூழலில் இயல்பான சாத்தியம் என்றாலும், மொழிபெயர்ப்பு அந்தத் தெளிவின்மையைத் தீர்மானித்து விடவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் நேரடியான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இடுக்கமான—அகலமான—விசாலமான’ என்ற இடவியல் முரண்பாடும் எச்சரிக்கையின் தீவிரமும் பேணப்பட்டுள்ளன.
