review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents γάρ, the universal participial construction, the present verbs in the first two clauses, and the future passive with unstated object in the final clause. However, “பெற்றுக்கொள்கிறார்” can suggest actively taking/appropriating, whereas λαμβάνει here is most directly and naturally “பெறுகிறார்.”
  naturalness: The parallel structure is clear and dignified. Replacing “பெற்றுக்கொள்கிறார்” with “பெறுகிறார்” improves idiomatic modern Tamil and makes the first pair more concise and memorable. “கண்டடைகிறார்” is acceptable but slightly elevated; “கண்டுபிடிக்கிறார்” would be less suitable because it may imply discovery rather than finding.
  terminology: “கேட்கிற,” “தேடுகிறவர்,” “தட்டுகிறவருக்கு,” and “திறக்கப்படும்” are suitable modern-standard Tamil renderings. The footnote correctly preserves the Greek’s unspecified item and should retain the textual clarification without treating “door” as explicit.
  issues:
  - severity: low
    issue: பெற்றுக்கொள்கிறார் for λαμβάνει
    rationale: Although possible, this compound often carries a nuance of taking for oneself. “பெறுகிறார்” is the ordinary, direct equivalent of λαμβάνει and better fits the balanced aphoristic style.
  revised_text: ஏனெனில், கேட்கிற ஒவ்வொருவரும் பெறுகிறார்; தேடுகிறவர் கண்டடைகிறார்; தட்டுகிறவருக்குத் திறக்கப்படும்.[a]
