id: MAT.7.8
reference: Matthew 7:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ αἰτῶν λαμβάνει καὶ ὁ ζητῶν εὑρίσκει καὶ τῷ κρούοντι ⸀ἀνοιγήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/008.yaml
  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: ta
  text: ஏனெனில், கேட்கிற ஒவ்வொருவரும் பெறுகிறார்; தேடுகிறவர் கண்டடைகிறார்; தட்டுகிறவருக்குத் திறக்கப்படும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மூலமொழியில் எது திறக்கப்படும் என்று வெளிப்படையாகக் கூறப்படவில்லை; தட்டுதல் என்ற உருவகத்திலிருந்து கதவு என்பது குறிப்பால் உணரப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς γὰρ ὁ αἰτῶν
  choice: ஏனெனில், கேட்கிற ஒவ்வொருவரும்
  rationale: πᾶς என்பதன் பொதுவான, அனைவரையும் உள்ளடக்கும் பரப்பையும், γὰρ என்பதன் முந்தைய வசனத்தை விளக்கும் தொடர்பையும் இயல்பான நவீனத் தமிழில் காக்கிறது. நிகழ்காலப் பெயரெச்சம் பொதுவாகவும் தொடர்ச்சியாகவும் கேட்பவரைக் குறிக்கிறது.
- source_word: λαμβάνει
  choice: பெற்றுக்கொள்கிறார்
  rationale: வினையின் நிகழ்காலத்தையும் ‘கேட்பவர்—பெறுகிறார்’ என்ற நேரான இணைப்பையும் காக்கும் மரியாதையான, இயல்பான தமிழ் வடிவம்.
- source_word: ὁ ζητῶν εὑρίσκει
  choice: தேடுகிறவர் கண்டடைகிறார்
  rationale: கிரேக்கத்தின் இணையான பெயரெச்ச அமைப்பையும் எளிய, நினைவில் நிற்கும் ஒலிநயத்தையும் காக்கிறது.
- source_word: τῷ κρούοντι
  choice: தட்டுகிறவருக்கு
  rationale: இங்கு உள்ள வேற்றுமைத் தொடர்பை ‘தட்டுகிறவருக்கு’ என்று இயல்பாக வெளிப்படுத்தி, அடுத்துவரும் செயப்பாட்டு வினையுடன் இணைக்கிறது.
- source_word: ἀνοιγήσεται
  choice: திறக்கப்படும்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தைத் துல்லியமாகக் காக்கிறது. கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘கதவு’ என்ற சொல்லை உரைக்குள் சேர்க்கவில்லை.
theological_decisions:
- issue: வாக்குறுதியின் பரப்பும் வலிமையும்
  choice: ‘கேட்கிற ஒவ்வொருவரும்’ என்ற பொதுவான உறுதியை அப்படியே காத்தல்
  alternative: ஒவ்வொரு குறிப்பிட்ட வேண்டுதலும் கேட்டபடியே கட்டாயம் கிடைக்கும் என்று விரிவுபடுத்துதல், அல்லது குறிப்பிட்ட ஆவிக்குரிய வேண்டுதல்களுக்கு மட்டும் என்று உரைக்குள்ளேயே கட்டுப்படுத்துதல்
  rationale: மூலவாக்கியம் அனைவரையும் உள்ளடக்கும் பொதுமொழியைப் பயன்படுத்துகிறது. சூழலிலிருந்து பிரித்து அதை முழுமையான உத்தரவாதமாகவும் மாற்றாமல், உரையில் இல்லாத வரம்பையும் சேர்க்காமல், அதன் இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூன்று இணை வாக்கியங்களின் தாளமும் பொதுவான நிகழ்கால உணர்வும் காக்கப்பட்டுள்ளன; கிரேக்கத்தில் இல்லாத ‘கதவு’ உரைக்குள் சேர்க்கப்படவில்லை.
