- from: ஏனெனில், கேட்கிற ஒவ்வொருவரும் பெற்றுக்கொள்கிறார்; தேடுகிறவர் கண்டடைகிறார்; தட்டுகிறவருக்குத் திறக்கப்படும்.[a]
  to: ஏனெனில், கேட்கிற ஒவ்வொருவரும் பெறுகிறார்; தேடுகிறவர் கண்டடைகிறார்; தட்டுகிறவருக்குத் திறக்கப்படும்.[a]
  rationale: A small lexical revision replaces a potentially overnuanced compound verb with the direct modern Tamil equivalent for λαμβάνει. The revision preserves the source’s general scope, rhythmic parallelism, future passive in the final clause, and the implicit—not explicit—reference to a door.
