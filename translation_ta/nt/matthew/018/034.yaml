source:
  edition: SBLGNT
  text: καὶ ὀργισθεὶς ὁ κύριος αὐτοῦ παρέδωκεν αὐτὸν τοῖς βασανισταῖς ἕως οὗ ἀποδῷ πᾶν τὸ ⸀ὀφειλόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/034.yaml
  text: And in anger his master handed him over to the torturers until he should pay all that was owed[a][b].
translation:
  language: ta
  text: அவனுடைய எஜமான்[a] கோபமடைந்து, அவன் கடன்பட்டிருந்த அனைத்தையும் திருப்பிச் செலுத்தும்வரை அவனைச் சித்திரவதை செய்பவர்களிடம்[b] ஒப்படைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்டவர்.” கிரேக்கச் சொல் kyrios. இங்கு அது உவமைக்குள் பணியாளின் எஜமானைக் குறிப்பதால், முதன்மை உரையில் “எஜமான்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “வேதனை கொடுப்பவர்களிடம்”; வலுக்குறைந்த பொருளில், “சிறைக் காவலர்களிடம்.” கிரேக்கச் சொல் சாதாரண காவலர்களை மட்டும் அல்லாமல் வேதனை அல்லது சித்திரவதை கொடுப்பவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: கோபமடைந்து
  rationale: இறந்தகாலப் பங்கேற்புவினையின் உணர்ச்சிசார் சூழலையும் முதன்மை வினையோடு அதன் தொடர்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: κύριος
  choice: எஜமான்
  rationale: உவமைக்குள் இது பணியாளின் மனித எஜமானைக் குறிக்கிறது; இங்கு தெய்வீகப் பட்டத்தை நேரடியாகக் குறிக்காததால் சூழலுக்கேற்ற சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: παρέδωκεν
  choice: ஒப்படைத்தான்
  rationale: ஒருவரை மற்றவர்களின் கட்டுப்பாட்டில் ஒப்புவிக்கும் நீதிசார் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: βασανισταῖς
  choice: சித்திரவதை செய்பவர்களிடம்
  rationale: இச்சொல் சாதாரண சிறைக் காவலர்களை மட்டும் அல்லாமல் வேதனை அல்லது சித்திரவதை கொடுப்பவர்களைக் குறிக்கும் கடுமையான பொருளைப் பாதுகாக்கிறது.
- source_word: ἕως οὗ
  choice: வரை
  rationale: எதிர்பார்க்கப்படும் முடிவுப் புள்ளியைக் குறிக்கும் காலத் தொடர்பை இயல்பான தமிழில் தருகிறது.
- source_word: ἀποδῷ
  choice: திருப்பிச் செலுத்தும்வரை
  rationale: கடனாக உள்ளதைச் செலுத்துதல் அல்லது திருப்பிக் கொடுத்தல் என்ற பொருளையும், subjunctive வடிவத்தின் எதிர்நோக்கிய முடிவையும் சூழலுக்கேற்றவாறு வெளிப்படுத்துகிறது.
- source_word: πᾶν τὸ ὀφειλόμενον
  choice: அவன் கடன்பட்டிருந்த அனைத்தையும்
  rationale: மூலத்தில் குறிப்பிட்ட 'கடன் தொகை' என்ற பெயர்ச்சொல் இல்லாததால், கடன்பட்டிருந்த முழுவதையும் குறிக்கும் விரிவான பங்கேற்புவினை அமைப்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: κύριος என்பதைக் தெய்வீகப் பட்டமாக மொழிபெயர்க்க வேண்டுமா
  choice: எஜமான்
  alternative: ஆண்டவர்
  rationale: இது உவமையின் கதைநிலையில் பணியாளின் மனித எஜமானைக் குறிக்கிறது. உவமையின் இறையியல் பயன்பாட்டை மறுக்காமலேயே, கதைநிலையிலுள்ள நேரடிப் பொருளை முதன்மை உரை பாதுகாக்கிறது.
- issue: βασανισταῖς என்பதன் கடுமையை எவ்வாறு வெளிப்படுத்துவது
  choice: சித்திரவதை செய்பவர்கள்
  alternative: வேதனை கொடுப்பவர்கள்; சிறைக் காவலர்கள்
  rationale: கிரேக்கச் சொல் சாதாரண காவலைவிட வேதனை கொடுக்கும் செயலையே வலியுறுத்துகிறது. இந்தத் தேர்வு உவமையின் எச்சரிக்கையைப் பாதுகாக்கிறது; அதேவேளை இறுதித் தீர்ப்பைப் பற்றிய விரிவான கோட்பாட்டை வசனத்தில் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் உவமையின் நீதிசார் கடுமையைத் தணிக்காமலும் வடிவமைக்கப்பட்டது. “எஜமான்,” “ஒப்படைத்தான்,” “திருப்பிச் செலுத்தும்வரை” ஆகியவை கதைச்சூழலில் இயல்பான, கண்ணியமான நடைமுறையை வழங்குகின்றன.
