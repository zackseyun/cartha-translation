  text: For the Son[a] of Man came to save the lost.
translation:
  language: ta
  text: ஏனெனில், மானிடமகன் இழந்துபோனதை மீட்பதற்காக வந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த வசனம் சினாய்ட்டிகஸ், வத்திக்கானஸ் ஆகிய 4ஆம் நூற்றாண்டுச் சுவடிகள் உட்பட மிகப் பழமையான கிரேக்கக் கையெழுத்துப் பிரதிகளிலும் ஆரம்பகால காப்டிக் மொழிபெயர்ப்புகளிலும் இல்லை. ஆனால் 5ஆம் நூற்றாண்டைச் சேர்ந்த கோடெக்ஸ் பேஸே, பைசாந்தியப் பெரும்பான்மை உரைமரபு, இலத்தீன் வுல்கேட் ஆகியவற்றில் உள்ளது. லூக்கா 19:10 உடன் ஒத்திசைக்கப் பிற்கால எழுத்தர்கள் இதைச் சேர்த்திருக்கலாம்.
    reason: textual_critical
lexical_decisions:
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மானிடமகன்
  rationale: இது இயேசுவைக் குறிக்கும் நிலைபெற்ற பட்டப்பெயர். நவீனத் தமிழில் இயல்பாகவும் மூலத்தின் ஒருமையையும் பட்டப்பெயர்த் தன்மையையும் காக்கும் வகையிலும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: σῶσαι
  choice: மீட்பதற்காக
  rationale: σῴζω இங்கு ஆபத்து அல்லது அழிவிலிருந்து காப்பாற்றி மீட்பதைக் குறிக்கிறது; நோக்கத்தைக் காட்டும் infinitive-ஐ ‘-தற்காக’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὸ ἀπολωλός
  choice: இழந்துபோனதை
  rationale: இது நடுநிலை ஒருமை perfect participle; ஆகவே ‘இழந்துபோனவர்களை’ என்று மனிதர்களுக்கு மட்டும் வரையறுக்காமல், மூலத்தின் இலக்கண வடிவத்தையும் உள்ளார்ந்த தெளிவின்மையையும் காக்கிறது.
- source_word: γὰρ
  choice: (தனி வசனத்தில் வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை)
  rationale: γὰρ முந்தைய வசனத்தோடு காரணத் தொடர்பைக் காட்டுகிறது. தமிழில் இந்தச் சுருக்கமான கூற்று தனித்து வாசிக்கப்படும்போது ‘ஏனெனில்’ இயல்பற்ற தொங்கும் இணைப்பாகிவிடும்; சூழலில் தொடர்பு உணரப்படுவதால் வெளிப்படையாகச் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: τὸ ἀπολωλός என்பதன் குறிப்பு
  choice: இழந்துபோனதை
  alternative: இழந்துபோனவர்களை
  rationale: மூலத்தில் நடுநிலை ஒருமை வடிவம் இருப்பதால் அதை மனிதர்களைக் குறிக்கும் பன்மையாகத் தெளிவுபடுத்தாமல், உண்மையான இலக்கண மற்றும் பொருள் விரிவைத் தக்கவைத்துள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான, கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. ‘மானிடமகன்’ பட்டப்பெயர்த் தன்மையைக் காக்கிறது; ‘இழந்துபோனதை’ என்பது மூலத்தின் நடுநிலை ஒருமை வடிவத்தை தேவையின்றி விளக்காமல் பாதுகாக்கிறது.
