source:
  edition: SBLGNT
  text: Διὰ τοῦτο ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ ὃς ἠθέλησεν συνᾶραι λόγον μετὰ τῶν δούλων αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/023.yaml
  text: For this reason the kingdom of heaven has become like a king who wanted to settle accounts with his servants[a][b].
translation:
  language: ta
  text: “இதனாலே, பரலோக அரசாட்சி, தன் அடிமைகளுடன்[b] கணக்குத் தீர்க்க விரும்பிய ஓர் அரசனுக்கு ஒப்பிடத்தக்கதாகியது[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில், ‘ஒப்பிடத்தக்கதாகியது’ அல்லது ‘ஒப்பிடப்பட்டது’; வினைச்சொல் செயப்பாட்டு வடிவில் உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘வேலைக்காரர்கள்’ அல்லது ‘பணியாளர்கள்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் அடிமைப்பட்ட நிலையையும் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: ஆகையால்
  rationale: முந்தைய போதனையிலிருந்து இந்த உவமைக்குச் செல்லும் காரணவிளைவு சார்ந்த தொடர்பை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: ὡμοιώθη
  choice: ஒப்பிடப்பட்டது
  rationale: ὁμοιόω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவத்தைத் தெளிவாகப் பாதுகாக்கிறது; வெறுமனே ‘போன்றது’ என்று கூறுவதைவிட மூலத்தின் ஒப்பீட்டு வடிவத்துக்கு நெருக்கமானது.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: பரலோக அரசாட்சி
  rationale: மத்தேயுவின் வழக்கமான சொற்றொடரை இயல்பான தமிழில் தருகிறது; βασιλεία என்பதிலுள்ள ஆட்சி அல்லது அரசாளும் செயல் என்ற கருத்தையும் வெளிப்படுத்துகிறது.
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: ஓர் அரசன்
  rationale: ‘மனிதனாகிய அரசன்’ என்று சொல்வது தமிழில் தேவையற்றும் செயற்கையாகவும் ஒலிக்கும்; βασιλεῖ, ἀνθρώπῳ என்பதை விளக்குவதால் ‘ஓர் அரசன்’ பொருளை இழக்காமல் இயல்பாக உள்ளது.
- source_word: ἠθέλησεν
  choice: விரும்பிய
  rationale: அரசனின் மனவிருப்பத்தையும் நோக்கத்தையும் நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: συνᾶραι λόγον
  choice: கணக்குத் தீர்க்க
  rationale: நிதிக் கணக்கைக் கேட்டுச் சரிசெய்யும் இந்தச் சொற்றொடரின் பொருளைத் தமிழில் வழக்கமான முறையில் தருகிறது.
- source_word: μετὰ τῶν δούλων αὐτοῦ
  choice: தன் அடிமைகளுடன்
  rationale: δοῦλοι என்பது அரசனின் அதிகாரத்திற்குக் கட்டுப்பட்ட, சுதந்திரமற்ற நிலையைக் குறிப்பிடுகிறது; இந்த உவமையின் கடன் மற்றும் தண்டனைச் சூழலில் ‘அடிமைகள்’ அந்த நிலையைத் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: அரசரின் பொருளாதாரச் சூழலில் δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: அடிமைகள்
  alternative: வேலைக்காரர்கள்; பணியாளர்கள்
  rationale: அரசன் அவர்கள்மேல் கொண்டுள்ள அதிகாரமும், கடன் கணக்கைத் தீர்க்கும் சூழலும் அவர்களுடைய கட்டுண்ட நிலையைக் குறிப்பிடுகின்றன. ‘பணியாளர்கள்’ எளிதாக வாசிக்கப்படலாம்; ஆனால் மூலச்சொல்லின் சுதந்திரமற்ற நிலையை மங்கச் செய்யக்கூடும்.
- issue: ὡμοιώθη என்பதிலுள்ள செயப்பாட்டு ஒப்பீடு
  choice: ஒப்பிடப்பட்டது
  alternative: ஒப்பானது; போன்றது
  rationale: யார் ஒப்பிட்டார் என்பதை உரை கூறாமல் விடும் செயப்பாட்டு வடிவத்தையும் அதன் இறையியல் திறந்தநிலையையும் மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘பரலோக அரசாட்சி’ என்பது இடத்தைக் காட்டும் ‘ராஜ்யம்’ என்பதைக் காட்டிலும் அரசாளும் கருத்தைத் தெளிவாகக் கொண்டுவருகிறது; செயப்பாட்டு ஒப்பீடும் δοῦλοι என்பதின் கட்டுண்ட நிலையும் அடிக்குறிப்புகளுடன் பாதுகாக்கப்பட்டுள்ளன.
