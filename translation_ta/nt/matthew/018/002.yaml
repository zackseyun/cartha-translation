lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: தம்மிடம் அழைத்து
  rationale: இடைநிலை வினை வடிவத்தின் ‘தன்னிடம் அழைத்தல்’ என்ற பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: παιδίον
  choice: ஒரு சிறு பிள்ளையை
  rationale: வயதில் இளைய குழந்தையைக் குறிக்கும் சொல்லின் இயல்பான, பாலினம் குறிப்பிடாத தமிழ் வடிவம்.
- source_word: ἔστησεν
  choice: நிறுத்தினார்
  rationale: இங்கு காரணவினைப் பொருளில் ‘நிற்கச் செய்தார்’ என்பதைக் குறுகிய, இயல்பான தமிழில் தருகிறது.
- source_word: ἐν μέσῳ αὐτῶν
  choice: அவர்களுடைய நடுவில்
  rationale: குழுவின் மத்தியில் என்ற இடப்பொருளை நேரடியாகப் பாதுகாக்கிறது.
