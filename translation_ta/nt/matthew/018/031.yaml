source:
  edition: SBLGNT
  text: ἰδόντες ⸀οὖν οἱ σύνδουλοι αὐτοῦ τὰ γενόμενα ἐλυπήθησαν σφόδρα, καὶ ἐλθόντες διεσάφησαν τῷ κυρίῳ ἑαυτῶν πάντα τὰ γενόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/031.yaml
  text: Therefore[a], when his fellow servants saw what had happened, they were deeply grieved[b], and they came and reported to their lord everything that had happened.
translation:
  language: ta
  text: ஆகவே, நடந்ததை அவனுடைய சக அடிமைகள்[a] கண்டபோது, அவர்கள் மிகவும் மனவேதனை அடைந்தார்கள்; பின்பு தங்கள் எஜமானிடம்[b] சென்று, நடந்த எல்லாவற்றையும் விரிவாகத் தெரிவித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சக பணியாளர்கள்.” σύνδουλοι என்ற கிரேக்கச் சொல் சொல்லுக்குச் சொல் “சக அடிமைகள்” என்று பொருள்படும்; இங்கு அவர்கள் ஒரே எஜமானுக்குக் கீழ் அடிமைகளாக இருப்பது உவமைக்கு முக்கியமானது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “தங்கள் ஆண்டவரிடம்.” κύριος என்ற கிரேக்கச் சொல் சூழலுக்கேற்ப “ஆண்டவர்” அல்லது “எஜமான்” என்று மொழிபெயர்க்கப்படலாம்; இங்கு அது உவமையிலுள்ள மனித எஜமானைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய நிகழ்வின் விளைவாக அடுத்த செயல் நடந்ததைச் சுட்டும் இணைப்புச் சொல்லின் வலிமையைத் தெளிவாகக் காக்கிறது.
- source_word: σύνδουλοι
  choice: சக அடிமைகள்
  rationale: ஒரே எஜமானுக்குக் கீழ் அடிமை நிலையில் இருப்பவர்களைக் குறிக்கும் கூட்டுச்சொல். உவமையின் கடன் மற்றும் அடிமைநிலைச் சூழலை மென்மைப்படுத்தாமல் வெளிப்படுத்துகிறது.
- source_word: τὰ γενόμενα / πάντα τὰ γενόμενα
  choice: நடந்ததை / நடந்த எல்லாவற்றையும்
  rationale: γίνομαι என்பதன் பெயர்ச்சொல் தன்மையுடைய பங்கேற்பு வடிவத்தை இயல்பான தமிழில் தருகிறது; இரண்டாம் இடத்திலுள்ள πάντα என்ற முழுமையைக் குறிக்கும் சொல்லையும் காக்கிறது.
- source_word: ἐλυπήθησαν σφόδρα
  choice: மிகவும் மனவேதனை அடைந்தார்கள்
  rationale: λυπέω குறிக்கும் ஆழ்ந்த துயரம் அல்லது மனவருத்தத்தையும், σφόδρα தரும் தீவிரத்தையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐλθόντες
  choice: சென்று
  rationale: முதன்மை வினைக்கு முன் நிகழும் துணைச்செயலைத் தமிழின் இயல்பான வினையெச்ச வடிவில் தருகிறது. எஜமானை அணுகிச் சென்றனர் என்பது சூழலுக்குப் பொருந்துகிறது.
- source_word: διεσάφησαν
  choice: விரிவாகத் தெரிவித்தார்கள்
  rationale: வெறுமனே அறிவித்தல் மட்டுமன்றி, தெளிவாக அல்லது முழுமையாக விவரித்தல் என்ற வினையின் நுணுக்கத்தையும் காக்கிறது.
- source_word: τῷ κυρίῳ ἑαυτῶν
  choice: தங்கள் எஜமானிடம்
  rationale: இங்கு κύριος ஒரு மனித அதிகாரியையும் அடிமைகளின் உரிமையாளரையும் குறிக்கிறது; ‘எஜமான்’ உவமையின் சமூக உறவை இயல்பாகவும் தெளிவாகவும் தருகிறது.
theological_decisions:
- issue: உவமையின் சமூகச் சூழலில் δοῦλος சொல்லினத்தை மொழிபெயர்த்தல்
  choice: சக அடிமைகள்
  alternative: சக பணியாளர்கள்
  rationale: σύνδουλοι என்பது ஒரே எஜமானுக்குக் கீழுள்ள பகிரப்பட்ட அடிமைநிலையைத் தெளிவாகக் குறிக்கிறது. ‘பணியாளர்கள்’ என்பது அந்தக் கட்டுப்பட்ட நிலையைக் குறைத்துக் காட்டக்கூடும்.
- issue: மனித அதிகாரியைக் குறிக்கும் κύριος சொல்லை மொழிபெயர்த்தல்
  choice: எஜமான்
  alternative: ஆண்டவர்
  rationale: இந்த இடத்தில் குறிப்பிடப்படுவது உவமையிலுள்ள மனித எஜமான். ‘எஜமான்’ என்பது அந்த உறவைத் தெளிவுபடுத்துகிறது; ‘ஆண்டவர்’ என மொழிபெயர்த்தால் தமிழில் தேவனைப் பற்றிய நேரடி குறிப்பாகத் தவறாகப் புரிந்துகொள்ளப்படலாம்.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் உவமையின் சமூகக் கடுமையை மென்மைப்படுத்தாமலும் அமைக்கப்பட்டுள்ளது. ‘மனவேதனை அடைந்தார்கள்’ உணர்ச்சியின் தீவிரத்தைக் காக்கிறது; ‘விரிவாகத் தெரிவித்தார்கள்’ διεσάφησαν என்பதன் விளக்கமான அறிக்கையிடல் நுணுக்கத்தை வெளிப்படுத்துகிறது.
