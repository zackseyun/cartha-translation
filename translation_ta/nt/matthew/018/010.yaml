  text: Ὁρᾶτε μὴ καταφρονήσητε ἑνὸς τῶν μικρῶν τούτων, λέγω γὰρ ὑμῖν ὅτι οἱ ἄγγελοι αὐτῶν ἐν οὐρανοῖς διὰ παντὸς βλέπουσι τὸ πρόσωπον τοῦ πατρός μου τοῦ ἐν ⸀οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/010.yaml
  text: See that you do not despise one of these little ones[c][b][a], for I tell you that their angels in heaven continually see the face of my Father who is in heaven.
translation:
  language: ta
  text: இந்தச் சிறியவர்களில் ஒருவரைக்கூட இகழாதபடி கவனமாக இருங்கள்.[a] ஏனெனில், பரலோகத்தில் உள்ள அவர்களுடைய தேவதூதர்கள்[b] எப்போதும் பரலோகத்தில் உள்ள என் தந்தையின் முகத்தைப் பார்க்கிறார்கள் என்று உங்களுக்குச் சொல்கிறேன்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தச் சிறியவர்களில் ஒருவரைக்கூட அற்பமாக எண்ணிவிடாதபடி.”
    reason: lexical_alternative
  - marker: b
    text: “அவர்களுடைய தேவதூதர்கள்” என்பது இந்தச் சிறியவர்களோடு தொடர்புடைய அல்லது அவர்களைப் பிரதிநிதித்துவப்படுத்தும் தேவதூதர்களைக் குறிக்கலாம்; தனிப்பட்ட காவல் தூதர்களைப் பற்றிய முழுக் கோட்பாட்டை இந்த வசனம் மட்டும் தீர்மானிப்பதில்லை.
    reason: alternative_reading
  - marker: c
    text: “பரலோகத்தில்” என்று இருமுறை மொழிபெயர்க்கப்பட்டுள்ள இடங்களில் கிரேக்கத்தில் சொல்லுக்குச் சொல் “பரலோகங்களில்” என்று பன்மை உள்ளது.
    reason: lexical_alternative
