- source_word: Ὁρᾶτε
  choice: கவனமாக இருங்கள்
  rationale: எச்சரிக்கையுடன் பார்த்துக்கொள்ள வேண்டும் என்ற நிகழ்காலக் கட்டளையின் வலிமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: μὴ καταφρονήσητε
  choice: இகழாதபடி
  rationale: καταφρονέω என்பதிலுள்ள ஒருவரை அற்பமாக எண்ணுதல் அல்லது அவமதித்தல் என்ற கருத்தைச் சுருக்கமாகவும் வலிமையாகவும் தருகிறது.
- source_word: ἑνὸς τῶν μικρῶν τούτων
  choice: இந்தச் சிறியவர்களில் ஒருவரைக்கூட
  rationale: வயதில் சிறிய குழந்தைகளை மட்டும் குறிக்கும் வகையில் பொருளைக் குறுக்காமல், தாழ்ந்த நிலையிலுள்ளவர்களையும் உள்ளடக்கக்கூடிய மூலமொழியின் பரப்பைத் தக்கவைக்கிறது; ‘ஒருவரைக்கூட’ என்பது எவரையும் விதிவிலக்காக்கக் கூடாது என்ற வலியுறுத்தலை இயல்பாகத் தருகிறது.
- source_word: λέγω γὰρ ὑμῖν
  choice: ஏனெனில் … என்று உங்களுக்குச் சொல்கிறேன்
  rationale: γάρ என்பதன் விளக்கக் காரணத் தொடர்பையும், இயேசுவின் உரைச்சூத்திரத்தையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: οἱ ἄγγελοι αὐτῶν
  choice: அவர்களுடைய தேவதூதர்கள்
  rationale: உடைமைத் தொடர்பை நேரடியாகத் தக்கவைக்கிறது; அதேவேளையில் ஒவ்வொருவருக்கும் தனிப்பட்ட காவல் தூதர் உண்டு என்ற முழுமையான கோட்பாட்டை மொழிபெயர்ப்புக்குள் சேர்ப்பதில்லை.
- source_word: ἐν οὐρανοῖς
  choice: பரலோகத்தில்
  rationale: கிரேக்கத்தில் பன்மையாக இருந்தாலும், இந்த இடவழக்கை நவீனத் தமிழில் இயல்பாக ஒருமை வடிவில் வழங்குகிறது.
- source_word: διὰ παντὸς
  choice: எப்போதும்
  rationale: ‘தொடர்ந்து’ அல்லது ‘எல்லா நேரங்களிலும்’ என்ற கிரேக்க மரபுத்தொடரின் கருத்தைத் தெளிவாகத் தருகிறது.
- source_word: βλέπουσι τὸ πρόσωπον
  choice: முகத்தைப் பார்க்கிறார்கள்
  rationale: தேவனுடைய நேரடி முன்னிலையையும் அணுகலையும் உணர்த்தும் முக உருவகத்தை விளக்கிக் கரைக்காமல் தக்கவைக்கிறது.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: பரலோகத்தில் இருக்கிற என் தந்தையின்
  rationale: ‘என் தந்தை’ என்ற இயேசுவின் உறவுமொழியையும், அதைத் தொடர்ந்து வரும் இடத்தைக் குறிக்கும் அடைமொழியையும் வெளிப்படையாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘அவர்களுடைய தேவதூதர்கள்’ என்பதன் துல்லியமான பொருள்
  choice: ‘அவர்களுடைய தேவதூதர்கள்’ என்ற உடைமைத் தொடர்பை அப்படியே தக்கவைத்து, தனிப்பட்ட காவல் தூதர்கள் என்ற கோட்பாட்டை உரையில் நிர்ணயிக்காமல் விடுதல்
  alternative: ஒவ்வொரு சிறியவருக்கும் நியமிக்கப்பட்ட தனிப்பட்ட காவல் தூதர்கள் என்று வெளிப்படையாக மொழிபெயர்த்தல்; அல்லது அவர்களைப் பிரதிநிதித்துவப்படுத்தும் அல்லது அவர்களுக்குப் பணிவிடை செய்யும் தேவதூதர்கள் என்று விளக்குதல்
  rationale: கிரேக்க உரை ‘அவர்களுடைய தேவதூதர்கள்’ என்று கூறினாலும், அந்த உறவின் முழுமையான இயல்பை வரையறுக்கவில்லை. ஆகவே உண்மையான இறையியல் திறந்தநிலையை மொழிபெயர்ப்பு தக்கவைக்கிறது.
