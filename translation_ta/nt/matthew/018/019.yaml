  edition: SBLGNT
  text: Πάλιν ⸀ἀμὴν λέγω ὑμῖν ὅτι ἐὰν δύο ⸂συμφωνήσωσιν ἐξ ὑμῶν⸃ ἐπὶ τῆς γῆς περὶ παντὸς πράγματος οὗ ἐὰν αἰτήσωνται, γενήσεται αὐτοῖς παρὰ τοῦ πατρός μου τοῦ ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/019.yaml
  text: Again[a], truly I tell you, if two of you agree on earth about any matter they ask for[c][b], it will be done for them by my Father in heaven.
translation:
  language: ta
  text: 'மீண்டும், உங்களுக்குச் உண்மையாகச் சொல்கிறேன்: பூமியில் உங்களில் இருவர், அவர்கள் கேட்கும் எந்தக் காரியத்தைக் குறித்தும் ஒருமனப்பட்டால்,[a][c] பரலோகத்தில்[b] இருக்கிற என் தந்தையால் அது அவர்களுக்குச் செய்யப்படும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உங்களில் இருவர் ஒத்துக்கொண்டால்.’
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில், ‘பரலோகங்களில்’; தமிழில் இயல்பாக ‘பரலோகத்தில்’ என்று தரப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: இந்தக் கூற்று சமூகத் திருத்தம் மற்றும் அதிகாரத்தைப் பற்றிய இயேசுவின் போதனைக்குப் பின் வருகிறது (18:15–18); ஆனாலும் இவ்வசனத்தின் சொற்கள் ஒத்துக்கொண்டு கேட்கும் காரியத்தைப் பரந்த விதத்தில் குறிப்பிடுகின்றன.
    reason: cross_reference
lexical_decisions:
- source_word: Πάλιν
  choice: மேலும்
  rationale: முந்தைய போதனையோடு தொடர்புடைய இன்னொரு வலியுறுத்தப்பட்ட கூற்றை அறிமுகப்படுத்துகிறது; தமிழில் உரையோட்டத்துக்கு இயல்பாக உள்ளது. ‘மறுபடியும்’ என்பதும் சாத்தியம்.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: உண்மையாகவே உங்களுக்குச் சொல்கிறேன்
  rationale: இயேசுவின் வலியுறுத்தும் solemn formula-வின் பொருளையும் அழுத்தத்தையும் நவீனத் தமிழில் இயல்பாகக் காக்கிறது.
- source_word: ἐὰν δύο συμφωνήσωσιν ἐξ ὑμῶν
  choice: உங்களில் இருவர் … ஒருமனப்பட்டால்
  rationale: συμφωνέω இங்கு ஒரு காரியத்தில் உடன்படுதல் அல்லது ஒத்த கருத்துடையவர்களாக இருத்தலைக் குறிக்கிறது; ἐξ ὑμῶν என்பது ‘உங்களில்’ என்று இயல்பாகக் கொடுக்கப்பட்டுள்ளது.
- source_word: ἐπὶ τῆς γῆς
  choice: பூமியில்
  rationale: பரலோகத்தில் இருக்கும் தந்தையுடன் உள்ள இடவியல் எதிர்மறையைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: περὶ παντὸς πράγματος οὗ ἐὰν αἰτήσωνται
  choice: தாங்கள் கேட்கும் எந்தக் காரியத்தைக் குறித்தும்
  rationale: πρᾶγμα என்பதன் பரந்த ‘காரியம்/விஷயம்’ பொருளையும், αἰτέω என்பதன் ‘கேட்பது/வேண்டுவது’ பொருளையும் இயல்பான தமிழில் தருகிறது; வசனத்தில் இல்லாத வரம்பைச் சேர்க்கவில்லை.
- source_word: γενήσεται αὐτοῖς
  choice: அது அவர்களுக்குச் செய்யப்படும்
  rationale: பின்வரும் தந்தையைக் குறிக்கும் சொற்றொடருடன் இணைந்து, அவர்களுக்காக விளைவு ஏற்படுத்தப்படும் என்ற பொருளைத் தெளிவாகக் கொடுக்கிறது.
- source_word: παρὰ τοῦ πατρός μου
  choice: என் தந்தையால்
  rationale: παρά + genitive இங்கு மூலத்தையோ செயற்பாட்டாளரையோ சுட்டலாம்; ‘செய்யப்படும்’ என்பதுடன் ‘தந்தையால்’ இயல்பாக இணைகிறது, அதேவேளை செயல் தந்தையிடமிருந்து வருவதைத் தெரிவிக்கிறது.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: பரலோகத்தில் இருக்கிற
  rationale: கிரேக்கப் பன்மையான οὐρανοῖς என்பதைத் தமிழில் வழக்கமான ஒருமை ‘பரலோகம்’ என மொழிபெயர்க்கிறது.
theological_decisions:
- issue: வாக்குறுதியின் சூழலும் எல்லையும்
  choice: வசனத்தின் பரந்த சொற்களை அப்படியே வைத்து, சபை ஒழுங்கு நடவடிக்கை அல்லது பொதுவான ஜெபம் என்று மொழிபெயர்ப்பிலேயே வரையறுக்காமல் விடுதல்
  alternative: இதைச் சபை ஒழுங்கு நடவடிக்கைகளுக்கு மட்டும் கட்டுப்படுத்துதல்; அல்லது எந்த ஜெபக் கோரிக்கைக்கும் நிபந்தனையற்ற வாக்குறுதியாக விரிவாக்குதல்
  rationale: உடனடி சூழல் சமூகத் திருத்தம் மற்றும் அதிகாரத்தைப் பற்றியது (18:15–18); இருப்பினும் இவ்வசனத்தின் சொற்கள் ஒப்புக்கொண்டு கேட்கும் காரியத்தைப் பரந்த முறையில் கூறுகின்றன. மொழிபெயர்ப்பு இந்தச் சூழல் சார்ந்த இறையியல் இழுப்பைத் தீர்மானமாகக் குறுக்கவோ விரிவாக்கவோ கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘மேலும்’, ‘ஒருமனப்பட்டால்’, ‘எந்தக் காரியம்’ போன்ற சொற்கள் இயல்பான உரையோட்டத்தையும் மூலத்தின் பரந்த பொருளையும் காக்கின்றன.
