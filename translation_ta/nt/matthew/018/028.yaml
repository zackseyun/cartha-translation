source:
  edition: SBLGNT
  text: ἐξελθὼν δὲ ὁ δοῦλος ἐκεῖνος εὗρεν ἕνα τῶν συνδούλων αὐτοῦ ὃς ὤφειλεν αὐτῷ ἑκατὸν δηνάρια, καὶ κρατήσας αὐτὸν ἔπνιγεν λέγων· ⸀Ἀπόδος εἴ τι ὀφείλεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/028.yaml
  text: But when that servant went out[a], he found one of his fellow servants who owed him a hundred denarii, and seizing him, he began choking him, saying[b], ‘Pay back whatever you owe.’
translation:
  language: ta
  text: ஆனால் அந்த அடிமை வெளியே போனபோது, தனக்குக் கடன்பட்டிருந்த தன் சக அடிமைகளில் ஒருவனைக் கண்டான். அவன் நூறு தினாரிகள்[b] கடன்பட்டிருந்தான். அவனைப் பிடித்து, அவனுடைய கழுத்தை நெரிக்கத் தொடங்கி, ‘நீ கடன்பட்டிருப்பது எதுவோ, அதைத் திருப்பிக் கொடு’[a] என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “நீ ஏதாவது கடன்பட்டிருந்தால், திருப்பிக் கொடு.”
    reason: lexical_alternative
  - marker: b
    text: ஒரு தினாரி என்பது பொதுவாக ஒரு தொழிலாளி அல்லது படைவீரரின் ஒரு நாள் கூலியாக இருந்தது.
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλος
  choice: அடிமை
  rationale: உரிமையாளரின் அதிகாரத்திற்குக் கீழ்ப்பட்ட நிலையும் இவ்வுவமையிலுள்ள வற்புறுத்தலும் தெளிவாக இருப்பதால், மென்மையான ‘வேலைக்காரன்’ என்பதற்குப் பதிலாக சமூக உண்மையை வெளிப்படுத்தும் ‘அடிமை’ பயன்படுத்தப்பட்டது.
- source_word: ἐξελθὼν δὲ
  choice: ஆனால் ... வெளியே போனபோது
  rationale: δέ குறிக்கும் எதிர்மறைத் திருப்பத்தையும், இறந்தகாலப் பங்கேற்புச் சொல்லின் காலத் தொடர்பையும் இயல்பான தமிழில் தருகிறது.
- source_word: συνδούλων
  choice: உடன் அடிமைகள்
  rationale: σύν- என்பதிலுள்ள ‘உடன்/சக’ பொருளைப் பேணுவதோடு δοῦλος என்பதற்கான மொழிபெயர்ப்புடனும் ஒத்திசைகிறது.
- source_word: ὤφειλεν
  choice: கடன்பட்டிருந்தான்
  rationale: இங்கு பணக் கடனே நேரடியாகக் குறிக்கப்படுவதால் தெளிவான நவீன தமிழ் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: ἑκατὸν δηνάρια
  choice: நூறு தினாரிகள்
  rationale: முந்தைய மிகப் பெரிய கடனுடன் உள்ள அளவு வேறுபாட்டைப் பாதுகாக்க வரலாற்று நாணயப் பெயர் தக்கவைக்கப்பட்டது.
- source_word: κρατήσας
  choice: அவனைப் பிடித்து
  rationale: வலுக்கட்டாயமான உடல் செயலை இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: ἔπνιγεν
  choice: கழுத்தை நெரிக்கத் தொடங்கி
  rationale: நிறைவுறா இறந்தகால வினையின் தொடர்ச்சியான அல்லது தொடக்கநிலைச் செயலைத் தெரிவித்து, இங்குள்ள வன்முறையையும் தெளிவாக்குகிறது.
- source_word: Ἀπόδος
  choice: திருப்பிக் கொடு
  rationale: கடன் சூழலில் உள்ள கூர்மையான கட்டளையை இயல்பான தமிழில் தருகிறது.
- source_word: εἴ τι ὀφείλεις
  choice: நீ கடன்பட்டிருப்பது எதுவோ, அதை
  rationale: εἴ τι என்பதிலுள்ள வரையறுக்கப்படாத ‘ஏதாவது/எதுவோ’ பொருளைப் பாதுகாத்து, தமிழில் மிரட்டலான கோரிக்கையாக இயல்பாக ஒலிக்கிறது.
theological_decisions:
- issue: உவமைக்கதையில் δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: அடிமை / உடன் அடிமைகள்
  alternative: வேலைக்காரன் / உடன் வேலைக்காரர்கள்
  rationale: எஜமானின் உரிமை, கட்டுப்பாடு, வற்புறுத்தல் ஆகியவை இவ்விடத்தில் முக்கியமானவை. எனவே அக்கால சமூக நிலையைக் குறைவாகக் காட்டாமல் ‘அடிமை’ என்று மொழிபெயர்க்கப்பட்டது; தனிப்பட்ட கோட்பாட்டுப் பொருள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. வரலாற்று நாணயப் பெயர் விளக்கக் குறிப்புடன் தக்கவைக்கப்பட்டுள்ளது; அடிமைநிலையும் வன்முறையும் மூலத்தின் வலிமை குறையாமல் சொல்லப்பட்டுள்ளன.
