source:
  edition: SBLGNT
  text: ἐὰν δὲ παρακούσῃ αὐτῶν, εἰπὸν τῇ ἐκκλησίᾳ· ἐὰν δὲ καὶ τῆς ἐκκλησίας παρακούσῃ, ἔστω σοι ὥσπερ ὁ ἐθνικὸς καὶ ὁ τελώνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/017.yaml
  text: But if he refuses to listen to them[a], tell it to the assembly. And if he also refuses to listen to the assembly, let him be to you like the Gentile and the tax collector.
translation:
  language: ta
  text: ஆனால், அவன் அவர்களுக்குச் செவிகொடுக்க மறுத்தால், அதைச் சபையிடம் தெரிவி. அவன் சபைக்கும் செவிகொடுக்க மறுத்தால், அவன் உனக்குப் பிற இனத்தவனைப் போலவும் வரி வசூலிப்பவனைப் போலவும் இருக்கட்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρακούσῃ
  choice: செவிகொடுக்க மறுத்தால்
  rationale: இச்சூழலில் இது வெறுமனே கேட்கத் தவறுவதை அல்ல, சொல்லப்படுவதை ஏற்றுச் செவிகொடுக்க மறுப்பதைக் குறிக்கிறது. தமிழில் இயல்பாகவும் மூலத்தின் நோக்கச்சாயலைக் காக்கும் வகையிலும் இவ்வாறு தரப்பட்டுள்ளது.
- source_word: εἰπὸν
  choice: சொல்
  rationale: λέγω என்பதன் கட்டளை வடிவம். முந்தைய சூழலில் உள்ள விவகாரமே மறைமுகச் செயப்படுபொருளாக இருப்பதால், தமிழில் ‘அதைச் ... சொல்’ என இயல்பாகத் தரப்பட்டுள்ளது.
- source_word: ἐκκλησίᾳ / ἐκκλησίας
  choice: சபை
  rationale: ἐκκλησία இங்கு கூடியுள்ள விசுவாசச் சமூகத்தைக் குறிக்கிறது. ‘சபை’ என்பது தமிழில் சுருக்கமாகவும் மரியாதையான நடையிலும் அந்தக் கருத்தைத் தருகிறது; பிற்கால நிறுவன அமைப்பை மட்டும் கட்டாயப்படுத்துவதில்லை.
- source_word: ἔστω σοι
  choice: அவன் உனக்கு ... இருக்கட்டும்
  rationale: மூலத்திலுள்ள கட்டளை வலிமையையும் σοι என்ற ஒருமை முன்னிலையையும் நேரடியாகக் காக்கிறது; ‘அவனை அப்படியே நடத்து’ என்று நடைமுறை விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: ὥσπερ
  choice: போல
  rationale: மூலத்திலுள்ள ஒப்புமையைத் தெளிவாகவும் இயல்பான தமிழிலும் பாதுகாக்கிறது.
- source_word: ὁ ἐθνικὸς
  choice: பிற இனத்தவன்
  rationale: யூத உடன்படிக்கைச் சமூகத்திற்கு வெளியிலுள்ள இனத்தவரைக் குறிக்கும் பிரதிநிதி வகையை வெளிப்படுத்துகிறது. ‘புறமதத்தவன்’ என மொழிபெயர்த்து தேவையற்ற மதநுட்பத்தைச் சேர்ப்பது தவிர்க்கப்பட்டுள்ளது.
- source_word: ὁ τελώνης
  choice: வரி வசூலிப்பவன்
  rationale: τελώνης என்பதற்கான தெளிவான நவீனத் தமிழ் இணை. மூலத்தில் இருப்பதுபோல் ஒரு பிரதிநிதி வகையாக ஒருமையில் வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: உயிர்த்தெழுதலுக்கு முந்தைய மத்தேயு ஒழுங்கு நடவடிக்கைச் சூழலில் ἐκκλησία என்பதன் மொழிபெயர்ப்பு
  choice: சபை
  alternative: திருச்சபை; சபைக் கூட்டம்; கூடுகை
  rationale: இயேசுவின் அறிவுரைக்குள் பிற்காலப் பிரிவுசார் அல்லது நிறுவனக் கருத்துகளைச் சேர்க்காமல், கூடிவரும் உடன்படிக்கைச் சமூகத்தை ‘சபை’ இயல்பாகக் குறிக்கிறது. பொருத்தமான மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
- issue: மனந்திரும்பாத நபரை வெளிப்புறத்தவரைப் போலக் கருதுவதன் வலிமை
  choice: அவன் உனக்குப் பிற இனத்தவனைப் போலவும் வரி வசூலிப்பவனைப் போலவும் இருக்கட்டும்
  alternative: அவனைப் பிற இனத்தவனாகவும் வரி வசூலிப்பவனாகவும் நடத்து; அவனை வெளிப்புறத்தவனாகக் கருது
  rationale: மூலத்தின் ஒப்புமையையும் கட்டளை வடிவத்தையும் பாதுகாக்கிறது. இதை முழுமையாக வரையறுக்கப்பட்ட சபைநீக்க நடைமுறையாக விரித்துரைக்காமல், வசனத்தில் உள்ள இறையியல் அழுத்தத்தையும் தெளிவின்மையையும் அப்படியே விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் மரியாதையான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘செவிகொடுக்க மறுத்தால்’ என்பது ஒழுங்கு நடவடிக்கைச் சூழலின் நோக்கமுள்ள மறுப்பை வெளிப்படுத்துகிறது. ‘இருக்கட்டும்’ என்ற வடிவம் மூலத்தின் கட்டளையையும் ஒப்புமையையும் காக்கிறது.
