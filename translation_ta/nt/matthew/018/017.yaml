  source_fidelity: மொத்தத்தில் மூலத்துக்கு நெருக்கமானது. παρακούσῃ என்பதன் நோக்கமுள்ள மறுப்பை ‘செவிகொடுக்க மறுத்தால்’ சரியாகத் தருகிறது; ἔστω σοι மற்றும் ὥσπερ ஆகியவற்றின் கட்டளை/ஒப்புமை வலிமையும் பாதுகாக்கப்படுகிறது. ஆனால் முதல் நிகழ்வில் ‘அவர்களுக்கும்’ என்பதிலுள்ள ‘-உம்’ மூலத்தில் இல்லாத ‘அவர்களுக்கும் கூட’ என்ற நிழலைத் தரக்கூடும். இரண்டாம் நிகழ்வில்தான் καί (‘கூட’) உள்ளது.
  naturalness: ‘அதைச் சபையிடம் சொல்’ புரிந்துகொள்ளத்தக்கது; ஆயினும் ஒழுங்கு நடவடிக்கைச் சூழலில் ‘அதைச் சபையிடம் தெரிவி’ நவீன நிலையான தமிழில் இன்னும் இயல்பாகவும் தெளிவாகவும் உள்ளது. மற்ற வாக்கிய அமைப்பு இயல்பானது.
