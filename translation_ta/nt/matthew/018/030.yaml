revisions:
- from: ஆனால் அவன் அதற்கு மனமில்லாமல்[a], போய், கடன்பட்டவன் செலுத்த வேண்டியதைச் செலுத்தும்வரை அவனைச் சிறையில் தள்ளினான்[b][c].
  to: ஆனால் அவன் விரும்பவில்லை[a]; அதற்குப் பதிலாக, போய், அவன் செலுத்த வேண்டியதை[c]ச் செலுத்தும்வரை அவனைச் சிறைக்குள் தள்ளினான்[b].
  rationale: The revision renders the finite unwillingness clause naturally, explicitly reflects the adversative ἀλλά, retains the sequential force of ἀπελθών with “போய்,” and removes redundant wording around the substantival participle τὸ ὀφειλόμενον. Footnote anchors now correspond directly to the words they explain.
