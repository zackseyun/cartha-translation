translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. மூலத்தின் கடுமையான செயற்பாட்டு நுணுக்கமும், விருப்பமின்மையை வெளிப்படுத்தும் சொற்றொடரும் காக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு அடையாளங்களும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
