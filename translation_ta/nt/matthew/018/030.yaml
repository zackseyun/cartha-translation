  text: ὁ δὲ οὐκ ἤθελεν, ἀλλὰ ἀπελθὼν ἔβαλεν αὐτὸν εἰς φυλακὴν ἕως ⸀οὗ ἀποδῷ τὸ ὀφειλόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/030.yaml
  text: But he was not willing[a]; instead[c][b], he went away and threw him into prison until he should pay what was owed.
translation:
  language: ta
  text: ஆனால் அவன் விரும்பவில்லை[a]; அதற்குப் பதிலாக, போய், அவன் செலுத்த வேண்டியதை[c]ச் செலுத்தும்வரை அவனைச் சிறைக்குள் தள்ளினான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவன் மறுத்தான்’; கிரேக்கத்தில் சொல்லுக்குச் சொல், ‘அவன் விரும்பவில்லை’ அல்லது ‘மனமில்லாமல் இருந்தான்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவனைச் சிறையில் அடைத்தான்’; கிரேக்க வினைச்சொல் வலிமையானது—சொல்லுக்குச் சொல், ‘அவனைச் சிறைக்குள் எறிந்தான்/தள்ளினான்.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘கடன் தொகையை’ அல்லது ‘கடனை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: ஆனால் அவன்
  rationale: δέ காட்டும் முரண்பாட்டை ‘ஆனால்’ வெளிப்படுத்துகிறது; substantival article முந்தைய அடியாரைக் குறிப்பதால் தமிழில் இயல்பாக ‘அவன்’ என வழங்கப்படுகிறது.
- source_word: οὐκ ἤθελεν
  choice: அதற்கு மனமில்லாமல்
  rationale: θέλω என்பதின் விருப்பம்/மனநிலை சார்ந்த பொருளைத் தக்கவைக்கிறது; சூழலில் உள்ள மறுப்பை ‘மறுத்துவிட்டான்’ என்று மேலும் வலுப்படுத்தாமல் இயல்பான தமிழில் தருகிறது.
- source_word: ἀλλὰ ἀπελθὼν
  choice: போய்
  rationale: ἀλλά வலுவான எதிர்மாற்றத்தைக் குறிக்கிறது; தமிழில் முந்தைய ‘ஆனால்’ மற்றும் தொடரும் எதிர்ச்செயல் மூலம் அது இயல்பாக வெளிப்படுகிறது. Aorist participle செயல்களின் வரிசையைக் காட்ட ‘போய்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: ἔβαλεν αὐτὸν εἰς φυλακήν
  choice: அவனைச் சிறையில் தள்ளினான்
  rationale: βάλλω என்பதின் கடுமையை நடுநிலையான ‘வைத்தான்’ என்பதைக் காட்டிலும் ‘தள்ளினான்’ நன்கு தக்கவைக்கிறது.
- source_word: ἕως οὗ ἀποδῷ
  choice: செலுத்தும்வரை
  rationale: ἕως οὗ உடன் வரும் subjunctive எதிர்நோக்கப்படும் முழுச் செலுத்துதலைக் கால எல்லையாகக் காட்டுகிறது; ‘செலுத்தும்வரை’ தமிழ் வழக்கில் இதைத் துல்லியமாகக் கூறுகிறது.
- source_word: τὸ ὀφειλόμενον
  choice: கடன்பட்டவன் செலுத்த வேண்டியதை
  rationale: Substantival participle-ன் ‘செலுத்தப்பட வேண்டியது’ என்ற பொருளைத் தக்கவைத்து, யார் செலுத்த வேண்டும் என்பதையும் தமிழில் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
