  verdict: revise
  source_fidelity: 'கருத்து நம்பகமாக உள்ளது: ὅστις…οὗτος என்ற தொடர்பும், ‘இந்தக் குழந்தையைப்போல்’ என்ற சுட்டு ஒப்புமையும், தன்னைத் தாழ்த்துதல் மற்றும் அரசில் உயர்ந்த நிலை ஆகியவையும் காக்கப்பட்டுள்ளன. ஆனால் மத்தேயுவின் நிலையான βασιλεία τῶν οὐρανῶν சொல்லாட்சிக்கு ‘பரலோக அரசு’ என்பதற்குப் பதிலாக ‘பரலோக ராஜ்யம்’ அதிகத் துல்லியமும் வழக்கமான வேதாகமப் பயன்பாடும் உடையது.'
  naturalness: ‘எவரோ’ என்பதுடன் ‘அவரே’ இணைப்பு புரிந்துகொள்ளக்கூடியது; ஆயினும் ‘எவராயினும்’ நவீன நிலையான தமிழில் பொதுநிபந்தனையைச் சீராக வெளிப்படுத்துகிறது. ‘குழந்தையைப் போல்’ என்ற இடைவெளியுடனான வடிவமும் வாசிப்புக்கு இயல்பானது.
  terminology: ‘பரலோக ராஜ்யம்’ என்பது βασιλεία τῶν οὐρανῶν என்பதற்கான நிலைபெற்ற தமிழ் வேதாகமச் சொல்லாட்சியாகும்; இது அரசராட்சி/ஆட்சி என்ற பொருளைத் தவிர்த்து வெறும் நவீன அரசாங்கம் என்ற தவறான நுணுக்கத்தை ஏற்படுத்தாது.
