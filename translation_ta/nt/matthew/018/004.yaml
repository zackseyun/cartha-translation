    rationale: βασιλεία இங்கு ‘அரசாங்கம்’ என்ற நவீன நிர்வாக அமைப்பை அல்ல, தேவனுடைய அரசாட்சி/ராஜ்யம் என்னும் மத்தேயுவுக்குரிய சொல்லாட்சியைக் குறிக்கிறது. ‘பரலோக ராஜ்யம்’ பொருளையும் தமிழ் வேதாகம வழக்கையும் சிறப்பாகக் காக்கிறது.
