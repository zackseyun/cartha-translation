reference: Matthew 18:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅστις οὖν ταπεινώσει ἑαυτὸν ὡς τὸ παιδίον τοῦτο, οὗτός ἐστιν ὁ μείζων ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/004.yaml
  text: Therefore, whoever humbles himself like this child, he is the greatest in the kingdom of heaven.
translation:
  language: ta
  text: ஆகையால், இந்தக் குழந்தையைப் போல் தன்னைத் தாழ்த்துகிறவர் எவராயினும், அவரே பரலோக ராஜ்யத்தில் மிகப் பெரியவர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅστις
  choice: எவரோ
  rationale: பொதுவான, நிபந்தனைத் தன்மையுள்ள ‘யார் எவராயினும்’ என்ற பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ταπεινώσει ἑαυτόν
  choice: தன்னைத் தாழ்த்துகிறவர்
  rationale: எதிர்கால வடிவம் இங்கு பொதுவான நிபந்தனைச் செயலைக் குறிக்கிறது; தன்னார்வத் தாழ்மையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ὡς τὸ παιδίον τοῦτο
  choice: இந்தக் குழந்தையைப்போல
  rationale: ὡς என்பதன் ஒப்புமையையும் τοῦτο என்பதன் சுட்டுப்பொருளையும் நேரடியாகக் காக்கிறது.
- source_word: οὗτός ἐστιν ὁ μείζων
  choice: அவரே ... மிகப் பெரியவர்
  rationale: மூலத்தின் வலியுறுத்தும் மீள்சுட்டை ‘அவரே’ எனக் காத்து, மேன்மைத் தரத்தைக் காட்டும் இயல்பான தமிழைப் பயன்படுத்துகிறது.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: பரலோக அரசு
  rationale: மத்தேயுவுக்குரிய ‘வானங்களின் அரசு’ என்ற சொற்றொடரின் ஆட்சிப் பொருளை நவீன, தெளிவான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: குழந்தையைப்போலத் தன்னைத் தாழ்த்துதல் மற்றும் அரசில் மேன்மை
  choice: ஒப்புமையை விளக்கிச் சுருக்காமல் அப்படியே காத்தல்
  alternative: குழந்தையின் சார்புநிலை, நிர்ப்பாவம் அல்லது சமூகத் தாழ்நிலையை மொழிபெயர்ப்பிலேயே குறிப்பாகச் சேர்த்தல்
  rationale: மூலம் எந்தக் குறிப்பிட்ட குழந்தைப் பண்பைத் தனியே வரையறுக்கவில்லை; ஆகவே அதன் விளக்கத் திறந்தநிலையும் இறையியல் இழுப்பும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும், மரியாதைமிக்க நடை. ‘அவரே’ என்பது மூலத்தின் οὗτος என்ற வலியுறுத்தலை இயல்பாகக் காட்டுகிறது.
