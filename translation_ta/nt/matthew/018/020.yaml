  edition: SBLGNT
  text: οὗ γάρ εἰσιν δύο ἢ τρεῖς συνηγμένοι εἰς τὸ ἐμὸν ὄνομα, ἐκεῖ εἰμι ἐν μέσῳ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/020.yaml
  text: For where two or three are gathered in my name[a], there I am in their midst.
translation:
  language: ta
  text: ஏனெனில், இரண்டு அல்லது மூன்று பேர் என் பெயரில் ஒன்றுகூடியிருக்கும் இடத்தில், அங்கே நான் அவர்கள் நடுவில்[a] இருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்களிடையே.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: இடத்தில்
  rationale: இடத்தைக் குறிக்கும் தொடர்புச் சொல்லைத் தமிழில் இயல்பான சார்பு அமைப்பாகக் காட்டுகிறது; ‘எங்கெல்லாம்’ என்று மொழிபெயர்ப்பது கிரேக்கத்தின் பொருளைச் சற்றே விரிவுபடுத்தும்.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய சூழலோடு இவ்வாக்கியத்தை இணைக்கும் விளக்கக் காரணத் தொடர்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: δύο ἢ τρεῖς
  choice: இரண்டு அல்லது மூன்று பேர்
  rationale: எண்ணிக்கையை நேரடியாகக் காக்கிறது; நபர்களைக் குறிக்கும் இயல்பான தமிழுக்காக ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: συνηγμένοι
  choice: ஒன்றுகூடியிருக்கிற
  rationale: கூடி வந்ததன் விளைவாக அவர்கள் ஒன்றாக இருக்கும் நிலையைக் காட்டும் நிறைவுற்ற வினையெச்சத்தின் நுணுக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἰς τὸ ἐμὸν ὄνομα
  choice: என் பெயரில்
  rationale: இயேசுவின் பெயரைச் சார்ந்து, அவருடைய அதிகாரத்தின்கீழ் அல்லது அவர்மீதுள்ள பற்றுறுதியோடு கூடுவதைக் குறிக்கக்கூடிய கிரேக்கத் தொடரின் இயல்பான தமிழ் வடிவம்; இந்நுணுக்கங்களில் ஒன்றை மட்டும் நிர்ணயிக்கவில்லை.
- source_word: ἐκεῖ
  choice: அங்கே
  rationale: οὗ என்பதோடு இணையும் ‘இடத்தில் ... அங்கே’ என்ற கிரேக்க அமைப்பைப் பாதுகாக்கிறது.
- source_word: εἰμι
  choice: நான் இருக்கிறேன்
  rationale: எளிய நிகழ்காலக் கூற்றின் நேரடித் தன்மையைப் பாதுகாக்கிறது; ‘நான் பிரசன்னமாக இருக்கிறேன்’ போன்ற விளக்க விரிவைத் தவிர்க்கிறது.
- source_word: ἐν μέσῳ αὐτῶν
  choice: அவர்கள் நடுவில்
  rationale: கிரேக்கத்தின் இடவியல் உருவகத்தை நெருக்கமாகவும் இயல்பாகவும் காட்டுகிறது; ‘அவர்களிடையே’ என்பதும் பொருத்தமான மாற்று.
theological_decisions:
- issue: தமது பெயரில் கூடியிருப்பவர்களின் நடுவில் இயேசு இருப்பதாகக் கூறுவதன் கிறிஸ்தியல் உட்பொருள்
  choice: இயேசுவின் உண்மையான இருப்பைப் பற்றிய கூற்றை ‘அவர்கள் நடுவில் நான் இருக்கிறேன்’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘அவர்களுடன் நான் பிரசன்னமாக இருக்கிறேன்’ என்று விளக்கமாக மொழிபெயர்த்தல் அல்லது ஒரு குறிப்பிட்ட திருச்சபை/திருவருட்சாதனக் கோட்பாட்டோடு இணைத்தல்
  rationale: வசனம் இயேசுவின் இருப்பைத் தெளிவாக உறுதிப்படுத்துகிறது; ஆனால் அந்த இருப்பின் முறை அல்லது இயல்பை வரையறுக்கவில்லை. ஆகவே எந்தப் பிற்காலப் பிரிவுசார் கோட்பாட்டையும் சேர்க்காமல் கூற்றின் வலிமையும் திறந்த தன்மையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘இடத்தில் ... அங்கே’ என்ற அமைப்பு மூலத்தின் தொடர்பைத் தக்கவைக்கிறது; ‘என் பெயரில்’ மற்றும் ‘அவர்கள் நடுவில்’ ஆகியவை தேவையற்ற கோட்பாட்டு விளக்கமின்றி மூலத்தின் பொருள் விரிவை பாதுகாக்கின்றன.
