source:
  edition: SBLGNT
  text: σπλαγχνισθεὶς δὲ ὁ κύριος τοῦ δούλου ἐκείνου ἀπέλυσεν αὐτόν, καὶ τὸ δάνειον ἀφῆκεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/027.yaml
  text: Then the master of that servant[a], moved with compassion[b], released him and forgave him the debt.
translation:
  language: ta
  text: அப்போது அந்த அடிமையின் எஜமான் மனம் இரங்கி, அவனை விடுவித்து, அவனுடைய கடனைத்[a] தள்ளுபடி செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, ‘கடனாகக் கொடுக்கப்பட்ட தொகை’ அல்லது ‘கடன் தொகை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: மனம் இரங்கி
  rationale: ஆழ்ந்த இரக்க உணர்வைக் குறிக்கும் வினையெச்சத்தை இயல்பான நவீனத் தமிழில் உணர்ச்சி வலிமையுடன் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: அப்போது
  rationale: இங்கு எதிர்மறை இணைப்பைக் காட்டாமல் கதையின் அடுத்த நிகழ்வை அறிமுகப்படுத்துகிறது.
- source_word: κύριος
  choice: எஜமான்
  rationale: உவமையில் வரும் மனித உரிமையாளரையே குறிக்கிறது; தெய்வீகப் பட்டமாகத் தவறாகப் புரிந்துகொள்ளப்படுவதைத் தவிர்க்கிறது.
- source_word: δοῦλος
  choice: அடிமை
  rationale: கடன், அதிகாரம், உடைமை ஆகியவை முக்கியமான இந்தச் சூழலில் கட்டுப்பட்ட சமூக நிலையைக் ‘வேலைக்காரன்’ என்பதைவிடத் தெளிவாகக் காட்டுகிறது.
- source_word: ἀπέλυσεν αὐτόν
  choice: அவனை விடுவித்து
  rationale: உடனிருந்த கட்டுப்பாட்டிலிருந்தும் கடன் காரணமான பிடிப்பிலிருந்தும் அவனைப் போகவிட்ட செயலை மிகைப்படுத்தாமல் தெரிவிக்கிறது.
- source_word: τὸ δάνειον
  choice: அவனுடைய கடனை
  rationale: δάνειον என்பது குறிப்பாகக் கடனாகக் கொடுக்கப்பட்டதைக் குறித்தாலும், இச்சூழலில் திருப்பிச் செலுத்த வேண்டிய தொகையை ‘கடன்’ என்பது இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: ἀφῆκεν αὐτῷ
  choice: தள்ளுபடி செய்தார்
  rationale: பணக் கடப்பாட்டை நீக்கிய செயலைத் தமிழில் இயல்பாகக் குறிக்கிறது; பொதுவான பாவமன்னிப்பை நேரடியாக உரையில் புகுத்தாமல், உவமையின் நிதிசார் பொருளை நிலைநிறுத்துகிறது.
theological_decisions:
- issue: κύριος என்பதைத் தெய்வீகப் பட்டமாக மிகையாக வாசிக்கும் வாய்ப்பு
  choice: மனித உரிமையாளரைக் குறிக்கும் ‘எஜமான்’
  alternative: ஆண்டவர்
  rationale: உடனடிக் கதைச் சூழலில் இவர் அந்த அடிமையின் மனித எஜமான். உவமையின் விரிவான இறையியல் ஒப்புமையை மறுக்காமலேயே, நேரடி குறிப்பைத் துல்லியமாக வைத்திருக்கிறது.
- issue: δοῦλος என்பதன் சமூக நிலை
  choice: அடிமை
  alternative: வேலைக்காரன் / பணியாளர்
  rationale: அதிகார ஏற்றத்தாழ்வும் கட்டுப்பட்ட நிலையும் இந்தக் கடன் உவமையில் பொருத்தமானவை; மென்மைப்படுத்தப்பட்ட மாற்றுகள் அந்த அம்சத்தை மறைக்கக்கூடும்.
- issue: ἀφίημι என்பதிலுள்ள மன்னிப்பு–கடன் நீக்கம் தொடர்பு
  choice: கடனைத் ‘தள்ளுபடி செய்தார்’
  alternative: கடனை மன்னித்தார்
  rationale: இங்கு நேரடிப் பொருள் நிதிசார் கடன் நீக்கம். ‘தள்ளுபடி’ அந்தப் பொருளைத் தெளிவாக்குகிறது; அதே வேளையில் உவமையின் மன்னிப்பு சார்ந்த இறையியல் எதிரொலியை வாசகர் உணர இடமளிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை. ‘மனம் இரங்கி’ பொதுவாகப் புரியும் வகையில் ஆழ்ந்த பரிவை வெளிப்படுத்துகிறது; ‘எஜமான்’ மனித அதிகார உறவைத் தெளிவாக்குகிறது.
