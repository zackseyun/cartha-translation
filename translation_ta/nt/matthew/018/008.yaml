    issue: The expression ‘உன்னை இடறச் செய்தால்’ is somewhat awkward in modern Tamil.
    rationale: For σκανδαλίζει σε, ‘உன்னை இடற வைக்குமானால்’ expresses ‘causes you to stumble’ more idiomatically while preserving the Greek metaphor and its ambiguity.
  - severity: low
    issue: The footnote’s literal gloss is nominalized as ‘இடறச் செய்தல்.’
    rationale: ‘இடறச் செய்வது’ is a more natural Tamil gloss for the verbal Greek expression and better matches the wording in the revised main text.
