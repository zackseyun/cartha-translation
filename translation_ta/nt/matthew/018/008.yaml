id: MAT.18.8
reference: Matthew 18:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Εἰ δὲ ἡ χείρ σου ἢ ὁ πούς σου σκανδαλίζει σε, ἔκκοψον ⸀αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν εἰσελθεῖν εἰς τὴν ζωὴν ⸂κυλλὸν ἢ χωλόν⸃, ἢ δύο χεῖρας ἢ δύο πόδας ἔχοντα βληθῆναι εἰς τὸ πῦρ τὸ αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/008.yaml
  text: And if your hand or your foot causes you to stumble[a], cut it off and throw it away from you. It is better for you to enter into life maimed or lame than, having two hands or two feet, to be thrown into the eternal fire.
translation:
  language: ta
  text: உன் கையோ உன் காலோ உன்னை இடற வைக்குமானால்[a], அதை வெட்டி, உன்னிடமிருந்து எறிந்துவிடு. இரண்டு கைகளோ இரண்டு கால்களோ உடையவனாய் நித்திய நெருப்பில் எறியப்படுவதைவிட, உறுப்பிழந்தவனாகவோ கால் ஊனமுற்றவனாகவோ வாழ்வில் நுழைவது உனக்கு நல்லது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உன்னைப் பாவம் செய்யச் செய்தால்.’ கிரேக்க வினைச்சொல்லின் நேரடிப் பொருள் ‘உன்னை இடறச் செய்வது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίζει
  choice: இடறச் செய்தால்
  rationale: பாவத்தில் விழச் செய்வதைக் குறிக்கும் கிரேக்க உருவகத்தைத் தமிழிலும் இயன்றவரை தக்கவைக்கிறது; அதன் ஒழுக்கப் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: ἔκκοψον
  choice: வெட்டிப்போட்டு
  rationale: கை அல்லது காலைத் துண்டிக்கும் வலிமையான, நேரடியான கட்டளையை மென்மைப்படுத்தாமல் வெளிப்படுத்துகிறது.
- source_word: βάλε ἀπὸ σοῦ
  choice: உன்னிடமிருந்து எறிந்துவிடு
  rationale: வலுக்கட்டாயமாக அகற்றி முற்றிலும் தூரப்படுத்தும் செயலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: καλόν σοί ἐστιν
  choice: உனக்கு நல்லது
  rationale: ἤ மூலம் உருவாகும் ஒப்பீட்டுச் சூழலில், தமிழில் ‘...விட ... நல்லது’ என்பது இயல்பாக ‘better’ என்ற பொருளைத் தருகிறது.
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: வாழ்வுக்குள் நுழைவது
  rationale: εἰς என்ற திசைநோக்கையும் ζωή என்ற எளிய சொல்லையும் தக்கவைத்து, மூலத்தில் இல்லாத ‘நித்திய’ என்பதை ‘வாழ்வு’ என்பதோடு சேர்க்கவில்லை.
- source_word: κυλλὸν
  choice: உறுப்பிழந்தவனாக
  rationale: வெட்டப்பட்ட கை அல்லது காலால் உடல் உறுப்பு இழந்த நிலையைச் சூழலுக்கேற்றவாறு குறிப்பாகச் சொல்கிறது.
- source_word: χωλόν
  choice: கால் ஊனமுற்றவனாக
  rationale: கால் அல்லது நடையுடன் தொடர்புடைய χωλός என்பதன் பொருளைத் தெளிவான, தற்போதைய தமிழில் வழங்குகிறது.
- source_word: ἔχοντα
  choice: உடையவனாய்
  rationale: இரண்டு கைகள் அல்லது இரண்டு கால்கள் இருப்பதை வெளிப்படையாகக் காட்டி கிரேக்கப் பங்கேற்பு வடிவத்தின் எதிர்மறை ஒப்பீட்டைத் தக்கவைக்கிறது.
- source_word: βληθῆναι
  choice: எறியப்படுவதை
  rationale: βάλλω என்பதன் இறப்புவினை வடிவத்தையும் வலிமையான செயலையும் நேரடியாகக் காட்டுகிறது.
- source_word: τὸ πῦρ τὸ αἰώνιον
  choice: நித்திய நெருப்பு
  rationale: நியாயத்தீர்ப்புச் சூழலில் αἰώνιος என்பதற்கான இயல்பான, மரபும் நவீனப் புரிதலும் கொண்ட தமிழாக்கம்.
theological_decisions:
- issue: σκανδαλίζει என்பதை நேரடியாக ‘பாவம் செய்யச் செய்கிறது’ என்று பொருளாக்குவதா அல்லது இடறுதல் உருவகத்தைத் தக்கவைப்பதா
  choice: இடறச் செய்தால்
  alternative: பாவம் செய்யத் தூண்டினால்
  rationale: கிரேக்கத்தின் இடறுதல் உருவகத்தையும் அதன் திறந்த பொருள்வெளியையும் முதன்மை உரையில் தக்கவைத்து, ஒழுக்கப் பொருளை அடிக்குறிப்பில் வழங்குகிறது.
- issue: εἰς τὴν ζωὴν என்பதில் ‘வாழ்வு’ என்பதை ‘நித்திய வாழ்வு’ என்று விரிவாக்குவதா
  choice: வாழ்வுக்குள்
  alternative: நித்திய வாழ்வுக்குள்
  rationale: இறுதிக்கால வாழ்வு என்பது சூழலில் தெளிவாக இருந்தாலும், கிரேக்கத்தில் இங்கு ‘நித்திய’ என்ற சொல் இல்லை; ஆகவே மூலத்தின் சுருக்கம் பாதுகாக்கப்படுகிறது.
- issue: உடல் உறுப்பை வெட்டும் கட்டளையை உருவகம் என விளக்கிப் பொருளுரைப்பதா
  choice: கட்டளையின் நேரடியான, கடுமையான உருவகத்தை அப்படியே மொழிபெயர்த்தல்
  alternative: தீய தூண்டுதலை முற்றிலும் அகற்ற வேண்டும் என்று விளக்கிப் பரிமாற்றுதல்
  rationale: இந்தச் சொல் மிகைப்படுத்தலா அல்லது நேரடிக் கட்டளையா என்பதை மொழிபெயர்ப்பு தீர்மானிக்காமல், மூலத்தின் அதிர்ச்சியூட்டும் தீவிரத்தையும் இறையியல் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஒருமை இரண்டாம் நபருக்கான ‘உன்/உன்னை/உனக்கு’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. நடை கண்ணியமானதும் பொதுவாசகர்களுக்குத் தெளிவானதும் ஆகும்; வசனத்தின் கடுமை மென்மைப்படுத்தப்படவில்லை.
