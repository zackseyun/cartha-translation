source:
  edition: SBLGNT
  text: οὕτως οὐκ ἔστιν θέλημα ⸀ἔμπροσθεν τοῦ πατρὸς ⸀ὑμῶν τοῦ ἐν οὐρανοῖς ἵνα ἀπόληται ⸀ἓν τῶν μικρῶν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/014.yaml
  text: In the same way, it is not the will of your Father in heaven that even one of these little ones should perish.
translation:
  language: ta
  text: அவ்வாறே, இந்தச் சிறியவர்களில் ஒருவர்கூட அழிந்துபோவது உங்கள் பரலோகத் தந்தையின் விருப்பம் அல்ல.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தச் சிறியவர்களில் ஒருவர்கூட காணாமற்போவது.” கிரேக்க வினைச்சொல் “அழிந்துபோவது” அல்லது “காணாமற்போவது” என்ற இரு பொருள்களையும் தரக்கூடும்; உடனடியாக முந்திவரும் காணாமற்போன ஆட்டைப் பற்றிய சூழல் இரண்டாவது பொருளை ஆதரிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: அவ்வாறே
  rationale: முந்தைய காணாமற்போன ஆட்டைப் பற்றிய உவமையோடு இந்த முடிவுரையை இயல்பாக இணைத்து, ஒப்பீட்டுத் தொடர்பைத் தெளிவாக்குகிறது.
- source_word: θέλημα
  choice: விருப்பம்
  rationale: இங்கு தந்தையின் சித்தம் அல்லது நோக்கத்தைக் குறிக்கிறது. ‘விருப்பம்’ என்பது நவீனத் தமிழில் இயல்பாகவும் புரிந்துகொள்ள எளிதாகவும் உள்ளது.
- source_word: ἔμπροσθεν
  choice: உங்கள் தந்தையின் விருப்பம்
  rationale: சொல்லுக்கு நேரடியாக ‘முன்பாக’ என்று பொருள் இருந்தாலும், θέλημα ἔμπροσθεν τοῦ πατρός என்ற சொற்றொடர் தந்தையின் பார்வையில் அல்லது அவரிடம் உள்ள விருப்பத்தைக் குறிக்கிறது; தமிழில் ‘தந்தையின் விருப்பம்’ என்பது பொருளை இயல்பாகத் தருகிறது.
- source_word: πατρὸς ὑμῶν τοῦ ἐν οὐρανοῖς
  choice: பரலோகத்தில் இருக்கிற உங்கள் தந்தை
  rationale: கிரேக்கத்தின் இடத்தைக் குறிக்கும் தொடரைத் தெளிவாகப் பேணுகிறது. οὐρανοῖς பன்மையில் இருந்தாலும், வழக்கமான நவீனத் தமிழில் ‘பரலோகம்’ இயல்பானது.
- source_word: ἵνα ἀπόληται
  choice: அழிந்துபோவது
  rationale: ἀπόλλυμι இங்கு ‘அழிந்துபோதல்’ அல்லது ‘காணாமற்போதல்’ எனப் பொருள்படலாம். பிரதான உரை கடுமையான விளைவைக் காக்கிறது; உடனடி காணாமற்போன ஆட்டுச் சூழலைச் சார்ந்த மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἓν
  choice: ஒருவர்கூட
  rationale: தனிப்பட்ட ஒருவரையும் விலக்காத வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘கூட’ என்பது சூழலில் உள்ள குறைந்தபட்ச வலியுறுத்தலைத் தருகிறது.
- source_word: τῶν μικρῶν τούτων
  choice: இந்தச் சிறியவர்களில்
  rationale: வயதில் சிறிய குழந்தைகளை மட்டும் குறிப்பதாக வரையறுக்காமல், அதிகாரத்தின் சீடத்துவச் சூழலில் தாழ்ந்த அல்லது சிறியவர்களாகக் கருதப்படுபவர்களையும் உள்ளடக்கக்கூடிய சொல்லாட்சியைப் பேணுகிறது.
theological_decisions:
- issue: ἀπόληται என்பதன் பொருள் மற்றும் முந்தைய காணாமற்போன ஆட்டின் சூழல்
  choice: அழிந்துபோவது
  alternative: காணாமற்போவது
  rationale: இந்த வினைச்சொல் இறுதி அழிவையும் காணாமற்போதல் அல்லது இழக்கப்படுதலையும் குறிக்க முடியும். எச்சரிக்கையின் தீவிரத்தை பிரதான உரை காக்கிறது; முந்தைய உவமை ஆதரிக்கும் மற்ற நுணுக்கத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: ‘சிறியவர்கள்’ யாரைக் குறிக்கிறது
  choice: இந்தச் சிறியவர்கள்
  alternative: இந்தச் சிறு குழந்தைகள்
  rationale: மத்தேயு 18-ன் சூழல் குழந்தையை எடுத்துக்காட்டாகப் பயன்படுத்தினாலும், இச்சொல் சீடர்கள் அல்லது முக்கியமற்றவர்களாகக் கருதப்படுபவர்களையும் குறிக்கக்கூடும். ஆகவே வயதை மட்டும் குறிப்பதாக மொழிபெயர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தந்தை’ என்ற உறவுச்சொல் பேணப்பட்டுள்ளது; ‘சிறியவர்கள்’ என்பது குழந்தைகளுக்கு மட்டும் வரையறுக்கப்படாமல் மூலத்தின் பரந்த சாத்தியத்தைத் தக்கவைக்கிறது. அடிக்குறிப்பு குறியீடு பிரதான உரையில் [a] என இடப்பட்டுள்ளது.
