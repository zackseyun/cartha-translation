id: MAT.18.5
reference: Matthew 18:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἐὰν δέξηται ⸂ἓν παιδίον τοιοῦτο⸃ ἐπὶ τῷ ὀνόματί μου, ἐμὲ δέχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/005.yaml
  text: And whoever receives one such child in my name receives me[a][b].
translation:
  language: ta
  text: என் பெயரில் இப்படிப்பட்ட ஒரு குழந்தையை[b] ஏற்றுக்கொள்கிற எவரும் என்னையே ஏற்றுக்கொள்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வரவேற்கிறார்’ அல்லது ‘பெற்றுக்கொள்கிறார்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் ஏற்றுக்கொள்வது, வரவேற்பது, பெற்றுக்கொள்வது ஆகிய பொருள்களைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘இப்படிப்பட்ட ஒரு குழந்தை.’ இந்த வசனத்தின் கிரேக்க மூலத்தில் ‘சிறு’ என்ற அடைமொழி இல்லை.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἐὰν
  choice: எவரும்
  rationale: உறுதியற்ற பொதுநிபந்தனையைக் குறிக்கும் கிரேக்கத் தொடரை, பாலின வேறுபாடின்றி இயல்பான தமிழில் பொதுப்படையாக வெளிப்படுத்துகிறது.
- source_word: δέξηται / δέχεται
  choice: ஏற்றுக்கொள்கிற / ஏற்றுக்கொள்கிறார்
  rationale: δέχομαι என்பதன் ‘பெற்றுக்கொள், வரவேல், ஏற்றுக்கொள்’ என்ற பொருள் வரம்பைத் தக்கவைத்தபடி, இரு கூறுகளிலும் ஒரே வினையைப் பயன்படுத்தி கிரேக்க மூலத்தின் திட்டமிட்ட மறுபயன்பாட்டைப் பாதுகாக்கிறது.
- source_word: ἓν παιδίον τοιοῦτο
  choice: இப்படிப்பட்ட ஒரு குழந்தையை
  rationale: இயேசு முன்பு நிறுத்திய குழந்தையையும், அந்தக் குழந்தையைப் போன்ற தன்மையுடைய ஒருவரையும் சுட்டும் தொடரை இயல்பாகக் கொடுக்கிறது; மூலத்தில் இல்லாத ‘சிறு’ என்ற அடைமொழி சேர்க்கப்படவில்லை.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: என் பெயரில்
  rationale: இயேசுவின் பெயர், அதிகாரம் அல்லது அவருடனான தொடர்பைக் கருத்தில் கொண்டு செய்யப்படுவதை அளவுக்கு மீறித் தெளிவுபடுத்தாமல் இயல்பாகக் காட்டுகிறது.
- source_word: ἐμὲ
  choice: என்னையே
  rationale: கிரேக்கத்தில் வெளிப்படையாகவும் வலியுறுத்தப்பட்டும் உள்ள முதலாம் நபர் சுட்டுப்பெயரின் தாக்கத்தை இயல்பான தமிழில் ‘-ஏ’ மூலம் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: குழந்தைக்கும் இயேசுவுக்கும் இடையிலான பிரதிநிதித்துவ அடையாளப்படுத்தல்
  choice: இப்படிப்பட்ட ஒரு குழந்தையை இயேசுவின் பெயரில் ஏற்றுக்கொள்வது இயேசுவையே ஏற்றுக்கொள்வதாக வசனம் நேரடியாகக் கூறுகிறது.
  alternative: அவ்வாறு குழந்தையை ஏற்றுக்கொள்வது இயேசுவைக் கனப்படுத்துவது மட்டுமே என்று மென்மையாக்கிக் கூறலாம்.
  rationale: இரு கூறுகளிலும் δέχομαι என்ற ஒரே வினை பயன்படுத்தப்பட்டு, பொருள் ‘ஒரு குழந்தை’ என்பதிலிருந்து ‘என்னை’ என்பதற்கு மாறுகிறது. ஆகவே வலுவான பிரதிநிதித்துவ அடையாளத்தை மொழிபெயர்ப்பு காக்கிறது; வசனத்தில் இல்லாத திருச்சபை அல்லது திருவருட்சாதனக் கருத்துகளைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘எவரும் … ஏற்றுக்கொள்கிறார்’ என்ற அமைப்பு பொதுப்படையான பொருளையும் மரியாதை ஒருமையையும் இணைக்கிறது; இரு கூறுகளிலும் ஒரே வினை மீண்டும் வருவது மூலத்தின் வலியுறுத்தலைத் தக்கவைக்கிறது.
