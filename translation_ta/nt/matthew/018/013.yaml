source:
  edition: SBLGNT
  text: καὶ ἐὰν γένηται εὑρεῖν αὐτό, ἀμὴν λέγω ὑμῖν ὅτι χαίρει ἐπ’ αὐτῷ μᾶλλον ἢ ἐπὶ τοῖς ἐνενήκοντα ἐννέα τοῖς μὴ πεπλανημένοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/013.yaml
  text: And if he happens to find it[a], truly I tell you[b], he rejoices over it more than over the ninety-nine that have not gone astray.
translation:
  language: ta
  text: 'மேலும், அவன் அதைக் கண்டுபிடிக்க நேர்ந்தால்[a], உண்மையாகவே உங்களுக்குச் சொல்கிறேன்: வழிதவறிப் போகாத[b] தொண்ணூற்றொன்பதைக் குறித்து மகிழ்வதைவிட, அதைக் குறித்து அவன் அதிகமாக மகிழ்கிறான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்கு நெருக்கமாக, ‘அவன் அதைக் கண்டுபிடிப்பது நிகழ்ந்தால்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அலைந்து விலகிப் போகாத.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: மேலும்
  rationale: இயேசுவின் உவமை தொடர்ந்து செல்வதைக் காட்டும் எளிய இணைப்புச் சொல்; கிரேக்கத் தொடர்ச்சியை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ἐὰν γένηται εὑρεῖν αὐτό
  choice: அவன் அதைக் கண்டுபிடிக்க நேர்ந்தால்
  rationale: ἐὰν + γένηται + வினையெச்சக் கட்டமைப்பிலுள்ள நிகழ்வுச் சார்ந்த நிபந்தனையைத் தக்கவைக்கிறது; வெறும் ‘கண்டுபிடித்தால்’ என்பதைக் காட்டிலும் ‘அப்படி நிகழ்ந்தால்’ என்ற நுணுக்கத்தை வெளிப்படுத்துகிறது.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: உண்மையாகவே உங்களுக்குச் சொல்கிறேன்
  rationale: இயேசுவின் உரையிலுள்ள உறுதியும் வலியுறுத்தலும் நிறைந்த வழக்குச் சூத்திரத்தை, பழமையான நடையின்றி தெளிவான நவீன தமிழில் வழங்குகிறது.
- source_word: χαίρει ἐπ’ αὐτῷ
  choice: அதைக் குறித்து அவன் அதிகமாக மகிழ்கிறான்
  rationale: χαίρω என்பதன் வலுவான மகிழ்ச்சியையும், ἐπί + வேற்றுமை உருபு குறிக்கும் மகிழ்ச்சிக்குரிய பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μᾶλλον ἢ
  choice: மகிழ்வதைவிட ... அதிகமாக
  rationale: கிரேக்க ஒப்பீட்டை நேரடியாகத் தக்கவைக்கிறது; மற்றவற்றில் மகிழ்ச்சியே இல்லை என்ற விலக்குப் பொருளை உருவாக்காது.
- source_word: τοῖς ἐνενήκοντα ἐννέα
  choice: தொண்ணூற்றொன்பது
  rationale: ‘ஆடுகள்’ என்பது முந்தைய வசனத்திலிருந்து புரிந்துகொள்ளப்படுவதால், கிரேக்கத்தைப் போல இங்கும் பெயர்ச்சொல் மீண்டும் சேர்க்கப்படவில்லை.
- source_word: τοῖς μὴ πεπλανημένοις
  choice: வழிதவறிப் போகாத
  rationale: πλανάω என்பதன் நிறைவுற்ற நிலையை ஆட்டு உருவகத்திற்கு ஏற்ற இயல்பான தமிழில் காட்டுகிறது; அவை சரியான வழியிலிருந்து விலகவில்லை என்ற பொருளைத் தக்கவைக்கிறது.
theological_decisions:
- issue: மேய்ப்பனின் மகிழ்ச்சியை ஒப்பிடுவதன் பொருள்
  choice: மீட்கப்பட்ட ஒன்றைக் குறித்து, வழிதவறாத தொண்ணூற்றொன்பதைக் குறித்ததைவிட மேய்ப்பன் அதிகமாக மகிழ்கிறான் என்ற ஒப்பீட்டை நேரடியாகத் தக்கவைத்தல்
  alternative: தொண்ணூற்றொன்பதின் மதிப்பு குறைவாகத் தோன்றாதபடி ஒப்பீட்டை மென்மையாக்குதல்
  rationale: μᾶλλον ἢ உண்மையான ஒப்பீட்டை வெளிப்படுத்துகிறது. தொண்ணூற்றொன்பதின்மீது அக்கறை இல்லை என்றோ அவற்றின் மதிப்பு குறைவு என்றோ உரை கூறவில்லை; ஆகவே அந்த இறையியல் பதற்றம் விளக்கித் தீர்க்கப்படாமல் அப்படியே வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. கிரேக்கத்தில் மீண்டும் வராத ‘ஆடுகள்’ என்ற சொல்லைச் சேர்க்காமல், சூழல் தரும் குறிப்பைத் தக்கவைத்துள்ளது. வழங்கப்பட்ட ஆங்கில ஆலோசனை உரையில் [b] குறி வேறொரு இடத்தில் இருந்தாலும், அதன் அடிக்குறிப்பு πλανάω பற்றியது என்பதால் தமிழில் அது ‘வழிதவறிப் போகாத’ என்பதற்குப் பின் பொருத்தப்பட்டுள்ளது.
