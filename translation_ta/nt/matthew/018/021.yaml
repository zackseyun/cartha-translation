id: MAT.18.21
reference: Matthew 18:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τότε προσελθὼν ⸂αὐτῷ ὁ Πέτρος εἶπεν⸃· Κύριε, ποσάκις ἁμαρτήσει εἰς ἐμὲ ὁ ἀδελφός μου καὶ ἀφήσω αὐτῷ; ἕως ἑπτάκις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/021.yaml
  text: Then Peter came up to him and said[a], “Lord, how many times will my brother sin against me, and I forgive him? Up to seven times?”
translation:
  language: ta
  text: அப்போது பேதுரு இயேசுவிடம் வந்து, “ஆண்டவரே, என் சகோதரன்[a] எனக்கு எதிராகப் பாவம் செய்தால், நான் எத்தனை முறை அவனை மன்னிக்க வேண்டும்? ஏழு முறை வரையிலா?” என்று கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் சகோதரனோ சகோதரியோ.’ கிரேக்கத்தில் ‘என் சகோதரன்’ என்று ஆண்பால் ஒருமையில் உள்ளது; இச்சூழலில் அது சக சீடரைப் பொதுவாகவும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: அப்போது
  rationale: கதையின் தொடர்ச்சியைக் காட்டும் இயல்பான காலக் குறிப்பு.
- source_word: προσελθὼν αὐτῷ
  choice: இயேசுவிடம் வந்து
  rationale: προσέρχομαι என்பதன் அணுகிவருதல் பொருளை இயல்பான தமிழில் தருகிறது; αὐτῷ யாரைக் குறிக்கிறது என்பதைச் சூழலின் அடிப்படையில் ‘இயேசுவிடம்’ எனத் தெளிவுபடுத்துகிறது.
- source_word: ὁ Πέτρος
  choice: பேதுரு
  rationale: தமிழ் வேதாகம மரபில் நிலைபெற்ற பெயர் வடிவம்.
- source_word: εἶπεν
  choice: என்று கேட்டார்
  rationale: சொல்லப்பட்டவை நேரடியான கேள்விகள் என்பதால், தமிழில் ‘கேட்டார்’ என்பது இயல்பாக உள்ளது; இது பேச்சுச் செயலைச் சூழலுக்கேற்ப வெளிப்படுத்துகிறது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: κύριος என்பதன் மரியாதையையும் சாத்தியமான இறையியல் ஒலியையும் காக்கும் நிலையான தமிழ் விளிப்பு வடிவம்.
- source_word: ποσάκις
  choice: எத்தனை முறை
  rationale: பின்னர் வரும் ஏழு என்ற எண்ணிக்கைக்கு ஏற்ப, நிகழ்வின் எண்ணிக்கையைத் துல்லியமாகக் கேட்கிறது.
- source_word: ἁμαρτήσει εἰς ἐμὲ
  choice: எனக்கு எதிராகப் பாவம் செய்தால்
  rationale: εἰς ἐμέ என்பதன் திசைசார் பொருளை ‘எனக்கு எதிராக’ எனக் காக்கிறது. கிரேக்க எதிர்கால வினை, கேள்வியின் மறுமுறை நிகழும் நிபந்தனைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்த ‘செய்தால்’ என வழங்கப்படுகிறது.
- source_word: ὁ ἀδελφός μου
  choice: என் சகோதரன்
  rationale: ஆண்பால் ஒருமையில் உள்ள கிரேக்கச் சொல்லை முதன்மை உரையில் நேரடியாகக் காக்கிறது; சூழலில் இருக்கக்கூடிய விரிந்த பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: καὶ ἀφήσω αὐτῷ
  choice: நான் ... அவனை மன்னிக்க வேண்டும்
  rationale: ἀφίημι என்பதன் இச்சூழலுக்குரிய ‘மன்னித்தல்’ பொருளைக் காக்கிறது. கேள்வியின் ஆலோசனை/கடமை சார்ந்த நோக்கத்தை இயல்பான நவீன தமிழில் ‘மன்னிக்க வேண்டும்’ என வெளிப்படுத்துகிறது.
- source_word: ἕως ἑπτάκις
  choice: ஏழு முறை வரையிலா?
  rationale: பேதுரு முன்வைக்கும் உச்சவரம்பைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: ἀδελφός என்பதன் சூழல்சார் பரப்பு
  choice: முதன்மை உரையில் ‘என் சகோதரன்’
  alternative: ‘என் சகோதரனோ சகோதரியோ’ அல்லது ‘சக சீடர்’
  rationale: கிரேக்க வடிவம் ஆண்பால் ஒருமை. அது சூழலில் சக சீடரைப் பொதுவாகக் குறிக்கக்கூடும்; எனினும் அந்த விரிவை முதன்மை உரையில் கட்டாயப்படுத்தாமல் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: எதிர்கால வினைகளின் கேள்விசார் பொருள்
  choice: ‘பாவம் செய்தால் ... மன்னிக்க வேண்டும்?’
  alternative: ‘பாவம் செய்வான், நான் அவனை மன்னிப்பேன்—எத்தனை முறை?’
  rationale: கிரேக்கத்தில் இரு வினைகளும் எதிர்கால வடிவில் இருந்தாலும், கேள்வி நடை மறுமுறை நிகழும் சூழலிலும் பேதுரு எத்தனை முறை மன்னிக்க வேண்டும் என்ற ஆலோசனையிலும் மையம் கொள்கிறது. இயல்பற்ற சொற்சொல் வடிவத்தைத் தவிர்த்து, அந்தத் திறனை நவீன தமிழில் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையில் மொழிபெயர்க்கப்பட்டது. ‘ஆண்டவரே,’ ‘பாவம்,’ ‘மன்னிக்க’ ஆகிய நிலைபெற்ற சொற்கள் காக்கப்பட்டுள்ளன; வாக்கிய அமைப்பு இயல்பான தமிழ் கேள்விநடைக்கு மாற்றப்பட்டுள்ளது.
