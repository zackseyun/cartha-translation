  source_fidelity: மூலக் கிரேக்கத்தின் காலத் தொடர்குறி (Τότε), பேதுருவின் அணுகிவருதல், இயேசுவுக்கான மரியாதைமிக்க விளிப்பு, ‘எனக்கு எதிராகப் பாவம் செய்தால்,’ மன்னிப்பின் எண்ணிக்கை, மற்றும் ‘ஏழு முறை வரை’ என்ற முன்மொழியப்பட்ட உச்சவரம்பு ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. εἶπεν என்பதற்கு ‘கேட்டார்’ என்பது சொற்சொல் இணை அல்ல; ஆனால் முழுவதும் கேள்வியாக அமைந்துள்ளதால் தமிழில் இயல்பான, பொருளை மாற்றாத நடைமுறைத் தேர்வாகும். எதிர்கால வடிவங்களின் கேள்விசார்/மறுநிகழ்வு பொருளை ‘செய்தால் ... மன்னிக்க வேண்டும்?’ என வழங்கியிருப்பதும் ஏற்றது.
