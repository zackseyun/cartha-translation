review_pass:
  verdict: revise
  source_fidelity: The coordinated conditional verbs are accurately represented by “திரும்பி ... ஆகாவிட்டால்,” and “ஒருபோதும் ... மாட்டீர்கள்” appropriately conveys the emphatic οὐ μή. “குழந்தைகளைப்போல்” preserves the comparison without specifying an implied virtue. However, “பரலோக அரசு” can suggest a modern governmental administration; it is less fitting for βασιλεία in this idiom.
  naturalness: The sentence is clear, dignified, and natural modern Tamil. “விண்ணரசில்” is both idiomatic in biblical Tamil and more concise than “பரலோக அரசுக்குள்.”
  terminology: Revise βασιλεία τῶν οὐρανῶν as “விண்ணரசு,” a suitable established Tamil rendering of ‘kingdom of heaven’ that retains the royal-realm sense without importing the political-administration sense of “அரசு.”
  issues:
  - severity: medium
    issue: “பரலோக அரசு” is potentially misleading for βασιλεία.
    rationale: In current Tamil, அரசு commonly denotes a government or administration. Here βασιλεία denotes a kingdom/royal reign in Matthew’s characteristic expression. “விண்ணரசு” better preserves the source expression’s sense and biblical register.
