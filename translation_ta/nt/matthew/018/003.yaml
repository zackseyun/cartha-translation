id: MAT.18.3
reference: Matthew 18:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ἀμὴν λέγω ὑμῖν, ἐὰν μὴ στραφῆτε καὶ γένησθε ὡς τὰ παιδία, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/003.yaml
  text: And he said[a], “Truly I say to you, unless you turn and become like children[c][b], you will certainly not enter the kingdom of heaven.”
translation:
  language: ta
  text: 'அவர் சொன்னார்: “உண்மையாகவே உங்களுக்குச் சொல்கிறேன்: நீங்கள் திரும்பி, குழந்தைகளைப்போல் ஆகாவிட்டால், விண்ணரசில் ஒருபோதும் நுழையமாட்டீர்கள்.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிச்சயமாக நுழையமாட்டீர்கள்.” கிரேக்கத்தில் வலியுறுத்தப்பட்ட மறுப்பு பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: உண்மையாகவே
  rationale: இது அதிகாரபூர்வமான, உறுதியான கூற்றை அறிமுகப்படுத்தும் சொல்லாகும். ‘உண்மையாகவே’ என்பது அதன் வலிமையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: στραφῆτε
  choice: திரும்பி
  rationale: இந்த வினை தீர்மானமான திசைமாற்றத்தைக் குறிக்கிறது; செய்பவர் அல்லது செயப்படுபவர் என்ற இலக்கண நுட்பத்தைத் தேவையின்றி முடிவுசெய்யாமல், தமிழில் இயல்பாக ‘திரும்பி’ என வழங்கப்பட்டுள்ளது.
- source_word: γένησθε
  choice: ஆகாவிட்டால்
  rationale: γίνομαι இங்கு நிலைமாற்றத்தைக் குறிக்கும் ‘ஆகு’ என்ற பொருளில் உள்ளது; நிபந்தனை அமைப்பில் இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: ὡς τὰ παιδία
  choice: குழந்தைகளைப்போல்
  rationale: கிரேக்கச் சொற்றொடர் குழந்தைகளோடு ஒப்பிடுகிறது; அப்பாவித்தனம், தாழ்மை போன்ற குறிப்பிட்ட பண்பை மொழிபெயர்ப்பிலேயே சேர்க்காமல் பொருள் திறந்தவாறு வைக்கப்பட்டுள்ளது.
- source_word: οὐ μὴ εἰσέλθητε
  choice: ஒருபோதும் நுழையமாட்டீர்கள்
  rationale: οὐ μή என்ற வலியுறுத்தப்பட்ட மறுப்பை ‘ஒருபோதும் ... மாட்டீர்கள்’ தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: பரலோக அரசு
  rationale: மத்தேயுவுக்கே சிறப்பான இச்சொற்றொடரில் βασιλεία என்பது ஆட்சி மற்றும் அரசுரிமை சார்ந்த பொருளைக் கொண்டது; ‘பரலோக அரசு’ என்பது நவீன தமிழில் சுருக்கமாகவும் புரிந்துகொள்ளத்தக்கவாறும் உள்ளது.
theological_decisions:
- issue: στραφῆτε என்பதிலுள்ள மனமாற்றம் சார்ந்த மொழி
  choice: ‘திரும்பி’ என்று மொழிபெயர்த்தல்
  alternative: ‘மதம் மாறி’ அல்லது தொழில்நுட்பத் தெய்வவியல் சொல்லாக ‘மாற்றப்பட்டு’
  rationale: கிரேக்கம் தீர்மானமான திருப்பத்தைக் கோருகிறது; ஆனால் பிற்கால சமய அல்லது பிரிவுசார் தொழில்நுட்பச் சொல்லை கட்டாயப்படுத்தவில்லை.
- issue: παιδία குறிக்கும் ஒப்பீட்டின் தன்மை
  choice: ‘குழந்தைகளைப்போல்’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘அப்பாவிகளாக’ அல்லது ‘தாழ்மையுள்ளவர்களாக’
  rationale: இந்த வசனம் எந்தக் குழந்தைப் பண்பு கருத்தில் கொள்ளப்படுகிறது என்பதைத் தனியே வரையறுக்கவில்லை; ஆகவே விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்க்காமல் இறையியல் திறந்தநிலை பாதுகாக்கப்படுகிறது.
- issue: οὐ μή மறுப்பின் வலிமை
  choice: ‘ஒருபோதும் நுழையமாட்டீர்கள்’
  alternative: ‘நிச்சயமாக நுழையமாட்டீர்கள்’
  rationale: கிரேக்கத்தின் வலியுறுத்தப்பட்ட மறுப்பைத் தெளிவாகக் காட்டுகிறது; இரட்சிப்பின் பிற நிபந்தனைகள் குறித்த கூடுதல் கோட்பாட்டை இதில் புகுத்தவில்லை.
translation_notes:
  register: நவீன தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘உண்மையாகவே உங்களுக்குச் சொல்கிறேன்’ என்ற அமைப்பு இயேசுவின் அதிகாரமிக்க கூற்று முறையைப் பாதுகாக்கிறது. ‘குழந்தைகளைப்போல்’ என்பது தமிழில் இயல்பான பொதுப்பண்பு ஒப்பீடு; உடனடி சூழலில் முன்நிறுத்தப்பட்ட குழந்தையுடனான தொடர்பையும் மறுப்பதில்லை.
