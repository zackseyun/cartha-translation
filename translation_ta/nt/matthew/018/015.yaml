reference: Matthew 18:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἐὰν δὲ ἁμαρτήσῃ ⸂εἰς σὲ⸃ ὁ ἀδελφός σου, ⸀ὕπαγε ἔλεγξον αὐτὸν μεταξὺ σοῦ καὶ αὐτοῦ μόνου. ἐάν σου ἀκούσῃ, ἐκέρδησας τὸν ἀδελφόν σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/015.yaml
  text: But if your brother sins against you[a], go and reprove him between you and him alone. If he listens to you[c][b], you have gained your brother.
translation:
  language: ta
  text: “ஆனால், உன் சகோதரன்[c] உனக்கு எதிராகப் பாவம் செய்தால்[a], நீ போய், அவனோடு தனியாக அவன் தவறைச் சுட்டிக்காட்டு[b]. அவன் உனக்குச் செவிகொடுத்தால், உன் சகோதரனை நீ வென்றுகொண்டாய்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சில கையெழுத்துப் பிரதிகளில் ‘உனக்கு எதிராக’ என்ற சொற்கள் இல்லை; அவற்றின்படி: ‘உன் சகோதரன் பாவம் செய்தால், நீ போய்…’'
    reason: textual_variant
  - marker: b
    text: அல்லது, ‘அவனைக் கண்டி’ அல்லது ‘அவனுடைய தவறை அவனுக்கு உணர்த்து.’
    reason: lexical_alternative
  - marker: c
    text: ‘சகோதரன்’ என்பது இலக்கணப்படி ஆண்பால் ஒருமை; இச்சூழலில் இது பரந்த வகையில் உடன் சீடரையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτήσῃ
  choice: பாவம் செய்தால்
  rationale: ἐὰν என்பதுடன் வரும் இறந்தகாலத் துணைநிலை வினை பொதுவான நிபந்தனையைத் தெரிவிக்கிறது. ‘பாவம் செய்தால்’ என்பது அதன் அறநெறி மற்றும் இறையியல் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: εἰς σέ
  choice: உனக்கு எதிராக
  rationale: இங்கு εἰς + குறிக்கோள் வேற்றுமை, பாவம் கேட்பவருக்கு எதிராகச் செய்யப்பட்டதைச் சுட்டுகிறது. SBLGNT உரையில் உள்ள இச்சொற்றொடர் முதன்மை உரையில் வைக்கப்பட்டு, அதன் உரைவேறுபாடு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀδελφός σου
  choice: உன் சகோதரன்
  rationale: கிரேக்கச் சொல் இலக்கணப்படி ஆண்பால் ஒருமை. உரையின் வடிவத்தைப் பேண ‘உன் சகோதரன்’ என மொழிபெயர்க்கப்படுகிறது; சூழலில் இது உடன் சீடரைக் குறிக்கக்கூடிய பரந்த பயன்பாடு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: ὕπαγε
  choice: நீ போய்
  rationale: கட்டளையை அறிமுகப்படுத்தும் இவ்வினைக்கு சுருக்கமான, இயல்பான தமிழ் இணை இது.
- source_word: ἔλεγξον
  choice: அவனுடைய குற்றத்தை அவனுக்கு உணர்த்து
  rationale: ἐλέγχω இங்கு தவறை வெளிப்படுத்தி, தவறு செய்தவருக்கு அதை உணர்த்துவதைக் குறிக்கிறது. ‘கண்டி’ என்பது தேவையற்ற கடுமையை ஏற்படுத்தலாம்; ‘எதிர்கொள்’ என்பது குற்றத்தை வெளிப்படுத்தும் கூறை முழுமையாகக் காட்டாது.
- source_word: μεταξὺ σοῦ καὶ αὐτοῦ μόνου
  choice: உனக்கும் அவனுக்கும் இடையில் மட்டும்
  rationale: விவகாரம் வேறு எவருமின்றி இருவருக்குள் மட்டுமே நடத்தப்பட வேண்டும் என்ற தனிமையையும் வரம்பையும் நேரடியாகப் பேணுகிறது.
- source_word: ἀκούσῃ
  choice: உனக்குச் செவிகொடுத்தால்
  rationale: ἀκούω இங்கு வெறுமனே ஒலி கேட்பதைவிட ஏற்றுக்கொள்ளும் மனத்துடன் கேட்பதைக் குறிக்கிறது. ‘கீழ்ப்படிந்தால்’ என்பது மூலத்தில் இருப்பதைவிட வலுவான பொருளைச் சேர்க்கும்.
- source_word: ἐκέρδησας
  choice: ஆதாயப்படுத்திக்கொண்டாய்
  rationale: κερδαίνω என்பதிலுள்ள ‘ஆதாயம்/பெறுதல்’ உருவகத்தைப் பேணுகிறது. ‘மீட்டுக்கொண்டாய்’ என்பது முன்பு இழந்திருந்தான் என்ற கருத்தை வெளிப்படையாகச் சேர்க்கும்.
theological_decisions:
- issue: ἀδελφός என்பதைப் பயன்பாட்டில் பாலினத்தை உள்ளடக்கும் வகையில் மொழிபெயர்க்க வேண்டுமா
  choice: உன் சகோதரன்
  alternative: உன் சகோதரனோ சகோதரியோ; உடன் விசுவாசி
  rationale: மூலத்தின் ஆண்பால் ஒருமை வடிவம் முதன்மை உரையில் பேணப்படுகிறது. சூழலில் உடன் சீடரைப் பொதுவாகக் குறிக்கக்கூடும் என்பது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது; விளக்க விரிவாக்கம் முதன்மை உரைக்குள் சேர்க்கப்படவில்லை.
- issue: εἰς σέ என்பதன் உரைவிமர்சன நிலை
  choice: ‘உனக்கு எதிராக’ என்பதை முதன்மை உரையில் சேர்த்தல்
  alternative: அச்சொற்றொடரை விடுத்து ‘உன் சகோதரன் பாவம் செய்தால்’ என்று வாசித்தல்
  rationale: வழங்கப்பட்ட SBLGNT மூல உரையில் εἰς σέ உள்ளது. சில கையெழுத்துப் பிரதிகளில் அது இல்லாததால், அறிவுரை தனிப்பட்ட பாவத்திற்கே உரியதா அல்லது பொதுவான பாவத்திற்கும் உரியதா என்பதில் ஏற்படும் உண்மையான உரைத் தளர்வு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἐκέρδησας என்பதிலுள்ள உறவு சார்ந்த உருவகம்
  choice: ஆதாயப்படுத்திக்கொண்டாய்
  alternative: மீட்டுக்கொண்டாய்; வென்றெடுத்தாய்
  rationale: மூலத்தின் ‘ஆதாயம் செய்தல்’ உருவகத்தைத் தீர்த்துவிடாமல் பேணுகிறது. இது பொருளாதார ஆதாயம் அல்ல, சகோதர உறவைச் சார்ந்த ஆதாயம் என்பதைச் சூழலும் அடிக்குறிப்பும் தெளிவுபடுத்துகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில் ஒருமை உரையாடல் வடிவம் பயன்படுத்தப்பட்டுள்ளது. நடை மரியாதையும் நேர்மையும் கொண்டதாக உள்ளது; ‘குற்றத்தை உணர்த்து’ என்பது மூல வினையின் வலிமையைத் தக்கவைத்தபடி தேவையற்ற கடுமையைத் தவிர்க்கிறது. ‘ஆதாயப்படுத்திக்கொண்டாய்’ சற்று முறையான சொல்லாக இருந்தாலும், κερδαίνω உருவகத்தைத் தெளிவாகப் பேணுவதற்காகத் தேர்ந்தெடுக்கப்பட்டது.
