id: MAT.18.25
reference: Matthew 18:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι ἐκέλευσεν αὐτὸν ὁ ⸀κύριος πραθῆναι καὶ τὴν ⸀γυναῖκα καὶ τὰ τέκνα καὶ πάντα ὅσα ⸀ἔχει καὶ ἀποδοθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/025.yaml
  text: But since he was unable to repay[a], the master ordered that he be sold, along with his wife and children and all that he had[b], and that payment be made.
translation:
  language: ta
  text: ஆனால், அவனால் கடனைத் திருப்பிச் செலுத்த முடியாததால், அவனும் அவன் மனைவியும் பிள்ளைகளும், அவனிடம் இருந்த அனைத்தும் விற்கப்படவும், கடன் திருப்பிச் செலுத்தப்படவும் எஜமான் கட்டளையிட்டான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அவனும் அவன் குடும்பத்தினரும் விற்கப்படவும், அவனுடைய உடைமைகள் அனைத்தும் விற்கப்படவும், அதன்மூலம் கடன் திருப்பிச் செலுத்தப்படவும் கட்டளையிடப்பட்டது.
    reason: cultural_note
lexical_decisions:
- source_word: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι
  choice: ஆனால், அவனால் கடனைத் திருப்பிச் செலுத்த முடியாததால்
  rationale: இந்த இறைமை வேற்றுமைத் தனிநிலைத் தொடர், திருப்பிச் செலுத்த இயலாத சூழ்நிலையையோ காரணத்தையோ குறிக்கிறது. கடன் பற்றிய உவமைச் சூழலால் ‘கடனை’ என்பது இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: ἐκέλευσεν
  choice: கட்டளையிட்டான்
  rationale: அதிகாரத்துடன் ஆணையிடுவதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ὁ κύριος
  choice: எஜமான்
  rationale: இங்கு κύριος என்பது உவமையிலுள்ள வேலைக்காரனின் மனித எஜமானைக் குறிக்கிறது; நேரடியான தெய்வீகப் பட்டமல்ல.
- source_word: πραθῆναι
  choice: விற்று
  rationale: அவன் விற்கப்பட வேண்டும் என்ற செயப்பாட்டு infinitive-ஐ, தமிழ் கட்டளைத் தொடரில் இயல்பான வினையெச்ச வடிவில் தருகிறது.
- source_word: τὴν γυναῖκα καὶ τὰ τέκνα
  choice: அவன் மனைவியையும் பிள்ளைகளையும்
  rationale: கிரேக்க மொழியில் உடைமைச் சொல் வெளிப்படையாக இல்லாவிட்டாலும், குறிக்கப்படுவது கடன்பட்டவனின் குடும்பமே என்பதால் தமிழில் இயல்பாக ‘அவன்’ சேர்க்கப்பட்டுள்ளது.
- source_word: πάντα ὅσα ἔχει
  choice: அவனுக்குச் சொந்தமான எல்லாவற்றையும்
  rationale: அவனிடம் உள்ள உடைமைகள் அனைத்தையும் உள்ளடக்கும் மூலமொழித் தொடரின் பரப்பைத் தக்கவைக்கிறது.
- source_word: καὶ ἀποδοθῆναι
  choice: பணத்தைத் திருப்பிச் செலுத்தும்படி
  rationale: விற்பனையின் மூலம் திருப்பிச் செலுத்துதல் நடைபெற வேண்டும் என்ற பொருளை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: உவமைச் சூழலில் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: எஜமான்
  alternative: ஆண்டவன்
  rationale: இவ்வசனத்தில் சொல் மனித அதிகாரியைக் குறிக்கிறது. ‘ஆண்டவன்’ என்பது தமிழில் தெய்வீகப் பட்டமாக எளிதில் புரிந்துகொள்ளப்படலாம்; ‘எஜமான்’ கதையின் சமூக உறவைத் தெளிவாகக் காட்டுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடிய அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் நீண்ட கட்டளை அமைப்பு தமிழில் இயல்பான வினையெச்சத் தொடராக வழங்கப்பட்டுள்ளது.
