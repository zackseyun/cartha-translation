review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately identifies the debtor’s inability to repay, the master’s order, the wife, children, possessions, and repayment. However, its active participle “விற்று” can make the master sound like the direct seller rather than preserving the Greek passive infinitive (“to be sold”). “பணத்தைத் திருப்பிச் செலுத்தும்படி” also shifts the object: the Greek states that repayment be made, not that money be repaid.'
  naturalness: The proposed revision is natural, dignified modern standard Tamil and handles the coordinated passive commands clearly.
  terminology: “எஜமான்” appropriately renders κύριος for a human superior in this parable. “கடன் திருப்பிச் செலுத்தப்படவும்” conveys the implied debt without unnecessarily specifying sale proceeds.
  issues:
  - severity: medium
    issue: The wording “அவனையும் ... விற்று” does not clearly preserve the passive force of πραθῆναι.
    rationale: The Greek says that the debtor, his family, and possessions were ordered to be sold. A Tamil passive construction makes this explicit and avoids assigning the selling action directly to the master.
  - severity: medium
    issue: “பணத்தைத் திருப்பிச் செலுத்தும்படி” makes ‘money’ the item repaid.
    rationale: καὶ ἀποδοθῆναι refers to repayment being made in the debt context. Tamil should state that the debt is repaid, rather than that money itself is repaid.
  revised_text: ஆனால், அவனால் கடனைத் திருப்பிச் செலுத்த முடியாததால், அவனும் அவன் மனைவியும் பிள்ளைகளும், அவனிடம் இருந்த அனைத்தும் விற்கப்படவும், கடன் திருப்பிச் செலுத்தப்படவும் எஜமான் கட்டளையிட்டான்.[a]
  revised_footnotes:
