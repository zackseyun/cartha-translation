revisions:
- from: ஆனால், அவனால் கடனைத் திருப்பிச் செலுத்த முடியாததால், அவனையும் அவன் மனைவியையும் பிள்ளைகளையும் அவனுக்குச் சொந்தமான எல்லாவற்றையும் விற்று, பணத்தைத் திருப்பிச் செலுத்தும்படி எஜமான் கட்டளையிட்டான்.[a]
  to: ஆனால், அவனால் கடனைத் திருப்பிச் செலுத்த முடியாததால், அவனும் அவன் மனைவியும் பிள்ளைகளும், அவனிடம் இருந்த அனைத்தும் விற்கப்படவும், கடன் திருப்பிச் செலுத்தப்படவும் எஜமான் கட்டளையிட்டான்.[a]
  rationale: 'The revision preserves the coordinated passive infinitives in the Greek: the man, his wife, children, and possessions are to be sold, and repayment is to be made. It also corrects the semantic focus from repaying ‘money’ to repaying the implied debt, while retaining the contextual rendering “எஜமான்.”'
  reviewer_model: gpt-5.6-terra
