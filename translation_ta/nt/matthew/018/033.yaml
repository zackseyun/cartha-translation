  source_fidelity: மூல கிரேக்கத்தின் கண்டன வினா, அறநெறிசார் கடமை (οὐκ ἔδει), இரக்கத்தைச் சுட்டும் இருமுறைப் பயன்பாடு (ἐλεῆσαι / ἠλέησα), மற்றும் ஒப்புமை (ὡς κἀγώ) அனைத்தும் துல்லியமாக வெளிப்பட்டுள்ளன. தமிழில் ஒப்புமைக் கூறை முன்னிறுத்துவது பொருளை மாற்றவில்லை.
  naturalness: “நான் உனக்கு இரக்கம் காட்டியதுபோல, நீயும் உன் சக அடிமைக்கு இரக்கம் காட்டியிருக்க வேண்டாமா?” என்பது நவீன நிலையான தமிழில் இயல்பான, தெளிவான, கண்ணியமான கண்டன வினாவாக உள்ளது.
  terminology: “சக அடிமை” என்பது σύνδουλος என்பதன் பகிரப்பட்ட அடிமை/ஒரே எஜமான் உறவைப் பொருத்தமாகக் காக்கிறது. “இரக்கம் காட்டுதல்” மூலத்தில் மீளும் ἐλεάω வினையைத் தொடர்ச்சியாகவும் இயல்பாகவும் தருகிறது.
