id: MAT.18.33
reference: Matthew 18:33
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐκ ἔδει καὶ σὲ ἐλεῆσαι τὸν σύνδουλόν σου, ὡς κἀγὼ σὲ ἠλέησα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/033.yaml
  text: Should you not also have had mercy on your fellow servant[a], as I also had mercy on you?
translation:
  language: ta
  text: நான் உனக்கு இரக்கம் காட்டியதுபோல, நீயும் உன் சக அடிமைக்கு[a] இரக்கம் காட்டியிருக்க வேண்டாமா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன்னோடு அடிமையாக இருப்பவனுக்கு.” கிரேக்கச் சொல், ஒரே எஜமானுக்குக் கீழுள்ள உடன் அடிமையைக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἔδει
  choice: காட்டியிருக்க வேண்டாமா?
  rationale: ἔδει தெரிவிக்கும் அறநெறிசார் கடமையையும், οὐκ உடன் அமைந்த கண்டனத் தொனியுள்ள வினாவையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: καὶ σὲ
  choice: நீயும்
  rationale: எஜமான் செய்ததற்கு ஒத்த செயலை அந்த அடிமையும் செய்திருக்க வேண்டும் என்ற இணைப்பையும் வலியுறுத்தலையும் காக்கிறது.
- source_word: ἐλεῆσαι / ἠλέησα
  choice: இரக்கம் காட்டியிருக்க / இரக்கம் காட்டிய
  rationale: ஒரே கிரேக்க வினைச்சொல் இருமுறை வருவதை ஒரே தமிழ் சொற்றொடரால் பிரதிபலித்து, இரக்கத்தின் அறநெறி மற்றும் இறையியல் நிறையைத் தக்கவைக்கிறது.
- source_word: τὸν σύνδουλόν σου
  choice: உன் சக அடிமைக்கு
  rationale: σύνδουλος என்பது ஒரே எஜமானுக்குக் கீழுள்ள உடன் அடிமையைக் குறிக்கிறது. உவமையின் அடிமைத்தனச் சூழலை மென்மைப்படுத்தாமல், σύν- கூறின் பகிரப்பட்ட நிலையையும் ‘சக அடிமை’ தெரிவிக்கிறது.
- source_word: ὡς κἀγὼ
  choice: நான் ... காட்டியதுபோல
  rationale: எஜமான் ஏற்கெனவே காட்டிய இரக்கத்துக்கும் அடிமையிடமிருந்து எதிர்பார்க்கப்பட்ட இரக்கத்துக்கும் இடையிலான ஒப்புமையைத் தெளிவாகக் காட்டுகிறது; தமிழ் இயல்புக்காக ஒப்புமைக் கூறு வாக்கியத்தின் தொடக்கத்துக்கு நகர்த்தப்பட்டுள்ளது.
theological_decisions:
- issue: σύνδουλος என்ற δοῦλος சொற்குடும்பப் பதத்தின் மொழிபெயர்ப்பு
  choice: சக அடிமை
  alternative: உடன் பணியாளர்; சக ஊழியன்
  rationale: இந்த உவமையில் அரசன்/எஜமான் அதிகாரத்தின் கீழுள்ள கட்டுப்பட்ட நிலை முக்கியமானது. ஆகவே ‘அடிமை’ என்பது மூலத்தின் சமூக நிலையைக் காக்கிறது; ‘சக’ என்பது இருவருக்கும் ஒரே எஜமான் இருப்பதைச் சுருக்கமாக உணர்த்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கண்டன வினாவாக வடிவமைக்கப்பட்டுள்ளது. ‘இரக்கம் காட்டுதல்’ இரு இடங்களிலும் மீளப் பயன்படுத்தப்பட்டு மூலத்தின் சொல் மறுபயன்பாடு காக்கப்பட்டுள்ளது; ஒப்புமைக் கூறு தமிழ் வாக்கிய ஓட்டத்திற்கேற்ப முன்னிறுத்தப்பட்டுள்ளது.
