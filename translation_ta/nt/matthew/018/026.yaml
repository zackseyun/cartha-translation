  source_fidelity: மூலத்தின் πεσὼν (‘விழுந்து’) மற்றும் προσεκύνει (‘பணிந்து/வணங்கிக்கொண்டு இருந்தான்’) ஆகிய இரு செயல்களும் மொழிபெயர்ப்பில் பாதுகாக்கப்பட்டுள்ளன. ஆனால் ‘என்னிடம் பொறுமையாக இருங்கள்’ என்பதற்குப் பதில், Μακροθύμησον ἐπ’ ἐμοί என்பதன் வேண்டுகோள் பொருளைத் தமிழில் நேரடியாகவும் இயல்பாகவும் தரும் ‘எனக்குப் பொறுமை காட்டுங்கள்’ சிறந்தது. ‘திருப்பிச் செலுத்திவிடுவேன்’ என்பதிலுள்ள ‘விடு’ மூலத்தில் இல்லாத நிறைவு நுணுக்கத்தைச் சேர்க்கக்கூடும்; எளிய எதிர்கால வாக்குறுதியான ‘திருப்பிச் செலுத்துவேன்’ போதுமானது.
  naturalness: திருத்தப்பட்ட உரை நவீனத் தரத் தமிழில் இயல்பானது. ‘பணிந்துகொண்டு ... சொன்னான்’ என்பது உடல் தாழ்மையையும் அடுத்துவரும் நேரடிக் கூற்றையும் இணைக்கிறது. எஜமானை நோக்கிய பேச்சுக்கு மரியாதைப் பன்மை தக்கது.
