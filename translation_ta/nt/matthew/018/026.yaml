source:
  edition: SBLGNT
  text: πεσὼν οὖν ὁ δοῦλος προσεκύνει αὐτῷ λέγων· ⸀Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ πάντα ⸂ἀποδώσω σοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/026.yaml
  text: So the servant fell down before him and kept pleading[a], saying, ‘Be patient with me, and I will repay you everything.’
translation:
  language: ta
  text: அதனால், அந்த அடிமை அவர் முன் விழுந்து பணிந்துகொண்டு, “எனக்குப் பொறுமை காட்டுங்கள்; எல்லாவற்றையும் உங்களுக்குத் திருப்பிச் செலுத்துவேன்” என்று சொன்னான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεσὼν
  choice: விழுந்து
  rationale: இறந்தகால வினையெச்சம், பேசுவதற்கு முன் அடிமை உடலைத் தாழ்த்தி விழுந்த செயலைக் குறிக்கிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வசனத்தில் அரசன் கொடுத்த கட்டளைக்கு எதிர்வினையாக இது நிகழ்வதைக் காட்டும் காரணவிளைவு இணைப்பைத் தக்கவைக்கிறது.
- source_word: δοῦλος
  choice: அடிமை
  rationale: கடனும் முழுமையான கடப்பாடும் மையமாக உள்ள இந்த உவமையில் δοῦλος குறிக்கும் கட்டுப்பட்ட சமூக நிலையைக் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: προσεκύνει
  choice: அவர் முன் ... பணிந்தபடி
  rationale: மனித எஜமானுக்கு முன் தரையில் விழுந்து மரியாதையுடன் பணிவதையே இச்சூழலில் குறிக்கிறது. வினையின் தொடர்நிலைத் தன்மையை ‘பணிந்தபடி’ வெளிப்படுத்துகிறது; மதவழிபாடு என்ற பொருளைத் தேவையின்றித் திணிக்கவில்லை.
- source_word: λέγων
  choice: என்றான்
  rationale: வினையெச்சம் நேரடிக் கூற்றை அறிமுகப்படுத்துகிறது; தமிழில் வாக்கிய இறுதியிலுள்ள ‘என்றான்’ இயல்பாக இதை வெளிப்படுத்துகிறது.
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: என்னிடம் பொறுமையாக இருங்கள்
  rationale: தண்டனையை உடனே நிறைவேற்றாமல் கால அவகாசம் தருமாறு கேட்கும் பொருளை எளிய, நவீன தமிழில் தருகிறது.
- source_word: πάντα
  choice: எல்லாவற்றையும்
  rationale: முழுத் தொகையையும் உள்ளடக்கும் நடுநிலைப் பன்மையின் விரிவான பொருளைத் தக்கவைக்கிறது.
- source_word: ἀποδώσω σοι
  choice: உங்களுக்குத் திருப்பிச் செலுத்திவிடுவேன்
  rationale: கடன் சூழலில் ἀποδίδωμι என்பதன் ‘திருப்பிச் செலுத்துதல்’ என்ற பொருளையும் எதிர்கால வாக்குறுதியையும் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: மனித எஜமானை நோக்கிய προσκυνέω என்பதன் பொருள்
  choice: மரியாதையுடன் தரையில் விழுந்து பணிதல்
  alternative: அவரை வணங்கினான்
  rationale: உவமையின் கதைச்சூழலில் இது அரசன் அல்லது எஜமானுக்கு முன் காட்டப்படும் ஆழ்ந்த மரியாதையையும் மன்றாட்டையும் குறிக்கிறது. ‘வழிபட்டான்’ என்பது இங்கு அவசியமில்லாத மதவழிபாட்டு அர்த்தத்தைச் சேர்க்கக்கூடும்; அடிக்குறிப்பு கிரேக்கச் சொல்லின் பரந்த பொருள் வரம்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எஜமானிடம் பேசுவதால் ஒருமை மூலப்பிரதியிலுள்ள வேண்டுகோள் தமிழின் மரியாதைப் பன்மையான ‘இருங்கள்/உங்களுக்கு’ மூலம் சமூக உறவுக்கு ஏற்றவாறு வழங்கப்பட்டுள்ளது.
