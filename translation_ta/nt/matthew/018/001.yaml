id: MAT.18.1
reference: Matthew 18:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῃ τῇ ὥρᾳ προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ λέγοντες· Τίς ἄρα μείζων ἐστὶν ἐν τῇ βασιλείᾳ τῶν οὐρανῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/001.yaml
  text: At that time the disciples came to Jesus, saying, “Who then is greater in the kingdom of heaven?”
translation:
  language: ta
  text: அந்த நேரத்தில் சீடர்கள் இயேசுவிடம் வந்து, “அப்படியானால், பரலோக அரசாட்சியில் பெரியவர் யார்?” என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: அந்த நேரத்தில்
  rationale: கிரேக்க காலக் குறிப்பை இயல்பான நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: Τίς ἄρα
  choice: அப்படியானால் ... யார்?
  rationale: ἄρα குறிக்கும் சூழ்நிலை சார்ந்த முடிவு அல்லது தொடர்ச்சியைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μείζων
  choice: பெரியவர்
  rationale: இது ஒப்பீட்டுப் படிவம் என்றாலும், கிரேக்கத்தில் ஒப்பீட்டின் இரண்டாம் உறுப்பு வெளிப்படையாக இல்லை; ‘மிகப் பெரியவர்’ என்று உச்சநிலையாக மாற்றாமல் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: பரலோக அரசு
  rationale: மத்தேயுவின் வழக்கமான சொற்றொடரில் βασιλεία என்பது ஆட்சி/அரசாட்சியையும் அதன் ஆளுகைத் தளத்தையும் குறிக்கக்கூடும்; சுருக்கமாகவும் பொதுமக்களுக்கு புரியுமாறும் ‘அரசு’ பயன்படுத்தப்படுகிறது.
- source_word: λέγοντες
  choice: என்று கேட்டார்கள்
  rationale: அதைத் தொடர்ந்து நேரடிக் கேள்வி வருவதால், தமிழில் ‘கேட்டார்கள்’ என்பது உரையாடல் செயல்பாட்டை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: μείζων என்பதன் ஒப்பீட்டு அல்லது உச்சநிலைப் பொருள்
  choice: பெரியவர்
  alternative: மிகப் பெரியவர்
  rationale: மூலத்தில் μίζων ஒப்பீட்டுப் படிவமாக உள்ளது; வெளிப்படையான ஒப்பீட்டு அளவுகோல் இல்லாததால் அதை ‘மிகப் பெரியவர்’ எனத் தீர்மானமாக்காமல் வைத்திருக்கிறது.
- issue: βασιλεία τῶν οὐρανῶν என்பதன் வடிவம்
  choice: பரலோக அரசு
  alternative: பரலோக ராஜ்யம் / பரலோக அரசாட்சி
  rationale: மதப்பிரிவு சார்ந்த தனிச்சொல்லாக்கத்தைத் தவிர்த்து, நவீன வாசகருக்குப் புரியும் மொழியில் மூலத்தின் ஆட்சி மற்றும் ஆளுகைத் தளப் பரப்பைத் திறந்தவாறு வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையான, கண்ணியமான நடையுடன் நேரடிக் கேள்வியின் உயிரோட்டம் காக்கப்பட்டுள்ளது. மூலத்தில் இல்லாத அடிக்குறிப்பு சேர்க்கப்படவில்லை.
