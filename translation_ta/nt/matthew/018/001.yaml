  verdict: revise
  source_fidelity: The temporal phrase, approach to Jesus, and the question are conveyed accurately. The comparative force of μείζων is appropriately retained by பெரியவர் rather than turned into an explicit superlative. However, பரலோக அரசில் can readily mean ‘in the heavenly government’ in modern Tamil, narrowing βασιλεία; அரசாட்சியில் better retains the sense of reign/kingdom.
  naturalness: The sentence is fluent, clear modern standard Tamil. The revised kingdom term remains natural in a dignified biblical register.
  terminology: இயேசு and சீடர்கள் are appropriate. பரலோக அரசாட்சி is preferable here to அரசு because it conveys βασιλεία as kingship/reign or kingdom without implying a modern governmental body.
  issues:
  - severity: medium
    issue: ‘பரலோக அரசில்’ may suggest a governmental administration.
    rationale: βασιλεία denotes kingship, reign, or kingdom. In contemporary Tamil, அரசு commonly denotes a government/state; அரசாட்சி more faithfully preserves the intended semantic range.
