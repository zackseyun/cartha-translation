id: MAT.18.9
reference: Matthew 18:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ ὀφθαλμός σου σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν μονόφθαλμον εἰς τὴν ζωὴν εἰσελθεῖν, ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/009.yaml
  text: And if your eye causes you to stumble[a], tear it out and throw it away from you. It is better for you to enter into life with one eye than, having two eyes[b], to be thrown into the Gehenna of fire.
translation:
  language: ta
  text: உன் கண் உன்னை இடறச் செய்தால்[a], அதைப் பிடுங்கி உன்னிடமிருந்து எறிந்துவிடு. இரண்டு கண்களுடன் நெருப்பின் கெஹென்னாவுக்குள்[b] எறியப்படுவதைவிட, ஒரு கண்ணுடன் வாழ்வில் நுழைவது உனக்குச் சிறந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உன்னைப் பாவம் செய்யச் செய்தால்.’ இங்குள்ள கிரேக்க வினைச்சொல் ஒருவரை இடறவோ, விழவோ, பாவம் செய்யவோ செய்தல் என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘கெஹென்னா’ என்பது இறுதி நியாயத்தீர்ப்பின் இடத்தைக் குறிக்கிறது; இது பாரம்பரியமாக ‘நரகம்’ என்று மொழிபெயர்க்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζει
  choice: இடறச் செய்தால்
  rationale: பாவத்தில் விழச் செய்வதையும் உள்ளடக்கக்கூடிய ‘இடறச் செய்தல்’ என்ற உருவகத்தைப் பாதுகாக்கிறது; பொருளை வெறும் சோதனை அல்லது பாவம் எனக் குறுக்கவில்லை.
- source_word: ἔξελε
  choice: பிடுங்கி
  rationale: வலிமையான கட்டளையையும் அவசரமான, கடுமையான உருவகத்தையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: βάλε ἀπὸ σοῦ
  choice: உன்னிடமிருந்து எறிந்துவிடு
  rationale: முழுமையாகவும் தீர்மானமாகவும் அகற்றுதல் என்ற கருத்தைப் பாதுகாக்கிறது.
- source_word: καλόν σοί ἐστιν
  choice: உனக்கு மேலானது
  rationale: ἤ என்பதுடன் வரும் ஒப்பீட்டுச் சூழலில் ‘நல்லது’ என்பதைவிட ‘மேலானது’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: μονόφθαλμον
  choice: ஒரு கண்ணுடன்
  rationale: ‘ஒற்றைக்கண்ணனாக’ என்பதைக் காட்டிலும் நடுநிலையானதும் தற்போதைய தமிழில் இயல்பானதும் ஆகும்; உடல்சார் உருவகத்தையும் காக்கிறது.
- source_word: εἰς τὴν ζωὴν
  choice: வாழ்வுக்குள்
  rationale: மூலத்தில் ‘நித்திய’ என்ற அடைமொழி இல்லாததால் அதைச் சேர்க்காமல், முடிவுக்கால வாழ்வைக் குறிக்கக்கூடிய திறந்த இறையியல் பொருளைப் பாதுகாக்கிறது.
- source_word: βληθῆναι
  choice: எறியப்படுவதை
  rationale: செயப்பாட்டு infinitive-இன் வலிமையையும் பொருளையும் நேரடியாகத் தருகிறது.
- source_word: γέενναν
  choice: கெஹென்னா
  rationale: யூத வரலாற்று மற்றும் முடிவுக்காலத் தொடர்புகளுள்ள குறிப்பிட்ட கிரேக்கச் சொல்லைப் பொதுவான ‘நரகம்’ என்பதுடன் ஒன்றாக்காமல் பாதுகாக்கிறது.
- source_word: τοῦ πυρός
  choice: நெருப்பின்
  rationale: மூலத்தின் genitive அமைப்பை ‘நெருப்பின் கெஹென்னா’ என்று நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: γέεννα என்பதன் மொழிபெயர்ப்பு
  choice: கெஹென்னா
  alternative: நரகம்
  rationale: மூலம் பொதுவான பாதாளம் அல்லது தண்டனைக்கான சொல்லைப் பயன்படுத்தாமல் γέεννα என்ற குறிப்பிட்ட சொல்லைப் பயன்படுத்துகிறது; ஒலிபெயர்ப்பு அதன் தனித்த வரலாற்று மற்றும் இறுதிநியாயத் தொடர்புகளைப் பாதுகாக்கிறது.
- issue: εἰς τὴν ζωὴν என்பதன் மொழிபெயர்ப்பு
  choice: வாழ்வுக்குள்
  alternative: நித்திய வாழ்வுக்குள்
  rationale: சூழல் முடிவுக்கால வாழ்வைச் சுட்டக்கூடும்; எனினும் கிரேக்கத்தில் ‘நித்திய’ என்று வெளிப்படையாக இல்லை. ஆகவே அதைச் சேர்க்காமல் மூலத்தின் சுருக்கத்தையும் இறையியல் அழுத்தத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘இடறச் செய்தால்’ என்ற உருவகமும், ‘பிடுங்கி… எறிந்துவிடு’ என்ற கடுமையான வலியுறுத்தலும், ‘வாழ்வு’ மற்றும் ‘கெஹென்னா’ என்ற மூலத்தின் இறையியல் சொற்களும் விளக்கிச் சீராக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன. கெஹென்னாவைப் பற்றிய [b] குறிப்பு தொடர்புடைய சொல்லின் பின்னரே வைக்கப்பட்டுள்ளது.
