  source_fidelity: மூல கிரேக்கத்தின் ἀμὴν λέγω ὑμῖν என்பதன் வலிமை ‘உண்மையாகவே உங்களுக்குச் சொல்கிறேன்’ என்பதில் துல்லியமாக உள்ளது. ὅσα ἐὰν δήσητε / λύσητε என்ற பொதுநிபந்தனை அமைப்பும் ‘எவற்றைக் கட்டுவீர்களோ ... எவற்றை அவிழ்ப்பீர்களோ’ எனப் பாதுகாக்கப்பட்டுள்ளது. ἔσται + நிறைவுற்ற செயப்பாட்டு வினையெச்சம் கொண்ட இரு கூறுகளின் விளைவுநிலை/முன்னரே நிறுவப்பட்ட நிலை சாத்தியம் ‘கட்டப்பட்டிருக்கும் / அவிழ்க்கப்பட்டிருக்கும்’ என்பதில் நன்றாக வெளிப்படுகிறது.
