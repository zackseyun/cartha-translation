source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὅσα ⸀ἐὰν δήσητε ἐπὶ τῆς γῆς ἔσται δεδεμένα ⸀ἐν οὐρανῷ καὶ ὅσα ἐὰν λύσητε ἐπὶ τῆς γῆς ἔσται λελυμένα ⸁ἐν οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/018.yaml
  text: Truly I tell you[a], whatever you bind on earth will have been bound in heaven, and whatever you loose on earth will have been loosed in heaven.
translation:
  language: ta
  text: '“உண்மையாகவே உங்களுக்குச் சொல்கிறேன்: பூமியில் நீங்கள் எவற்றைக் கட்டுவீர்களோ, அவை பரலோகத்தில் கட்டப்பட்டிருக்கும்; பூமியில் நீங்கள் எவற்றை அவிழ்ப்பீர்களோ, அவை பரலோகத்தில் அவிழ்க்கப்பட்டிருக்கும்.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை மரபுவழியாக, “பரலோகத்தில் கட்டப்படும் … பரலோகத்தில் அவிழ்க்கப்படும்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடர் அந்த மொழிபெயர்ப்பையும் அனுமதிக்கிறது; ஆனால் இங்குள்ள எதிர்கால வினையுடன் சேர்ந்த நிறைவுற்ற செயப்பாட்டு வடிவம், பரலோகத்தில் ஏற்கெனவே ஏற்படுத்தப்பட்டு நிலவும் நிலையைக் குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: உண்மையாகவே
  rationale: அதிகாரத்துடன் கூறப்படும் உறுதியான அறிவிப்பை நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: λέγω ὑμῖν
  choice: உங்களுக்குச் சொல்கிறேன்
  rationale: நேரடி உரையையும் அதிகாரத் தொனியையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ὅσα ἐὰν
  choice: எவற்றை … ஓ
  rationale: குறிப்பிடப்படாத அனைத்தையும் உள்ளடக்கும் பொதுவான நிபந்தனைப் பொருளைத் தமிழ் தொடர்பிணை வாக்கிய அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: δήσητε
  choice: கட்டுவீர்களோ
  rationale: δέω என்பதன் அடிப்படை உருவகமான ‘கட்டுதல்’ என்பதைப் பேணி, அதை ‘தடைசெய்தல்’ என்ற ஒரே அதிகாரப்பூர்வ பொருளுக்குள் குறுக்கவில்லை.
- source_word: ἐπὶ τῆς γῆς
  choice: பூமியில்
  rationale: பூமிக்குரிய தளத்தையும் பரலோகத் தளத்தையும் இயல்பாக வேறுபடுத்திக் காட்டுகிறது.
- source_word: ἔσται δεδεμένα
  choice: கட்டப்பட்டிருக்கும்
  rationale: எதிர்காலத்தில் நிலவும், ஏற்கெனவே நிகழ்த்தப்பட்ட செயலின் விளைவுநிலையைத் தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது; அதேவேளையில் கிரேக்கத்தின் நிலைமையைக் குறிக்கும் வலிமையையும் காக்கிறது.
- source_word: ἐν οὐρανῷ
  choice: பரலோகத்தில்
  rationale: இறைத் தளத்தைக் குறிக்கும் ஒருமை οὐρανῷ என்பதற்கான தெளிவான, வழக்கமான தமிழ் இணை.
- source_word: λύσητε
  choice: அவிழ்ப்பீர்களோ
  rationale: λύω என்பதன் ‘அவிழ்த்தல்/விடுவித்தல்’ உருவகத்தைப் பேணி, ‘கட்டுதல்’ என்பதற்கு இயல்பான எதிரிணையாக அமைகிறது; ‘அனுமதித்தல்’ என்று பொருளை முன்கூட்டியே குறுக்கவில்லை.
- source_word: ἔσται λελυμένα
  choice: அவிழ்க்கப்பட்டிருக்கும்
  rationale: எதிர்காலத்தில் நிலவும், முன்பே நிகழ்த்தப்பட்ட செயலின் விளைவுநிலையைத் தெரிவித்து, முதல் கூறின் இலக்கண அமைப்புக்கு இணையாக உள்ளது.
theological_decisions:
- issue: கட்டுதல்–அவிழ்த்தல் கூற்றின் காலவியல் மற்றும் இறையியல் வலிமை
  choice: ‘கட்டப்பட்டிருக்கும் / அவிழ்க்கப்பட்டிருக்கும்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘கட்டப்படும் / அவிழ்க்கப்படும்’
  rationale: ἔσται என்பதோடு நிறைவுற்ற செயப்பாட்டு வினையெச்சம் இணையும் கிரேக்க அமைப்பு, முன்பே நிகழ்ந்த செயலால் எதிர்காலத்தில் நிலவும் நிலையைக் குறிக்கக்கூடும். தமிழ் ‘-ப்பட்டிருக்கும்’ அமைப்பு அந்த வலிமையைப் பேணுகிறது; அதே சமயம் திருச்சபை அதிகாரம் குறித்த எந்த ஒரு பிரிவுசார் விளக்கத்தையும் உரைக்குள் திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் உரைக்குரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘கட்டுதல்/அவிழ்த்தல்’ என்ற உருவக இணை பாதுகாக்கப்பட்டுள்ளது; காலவியல் நுணுக்கம் ‘-ப்பட்டிருக்கும்’ வடிவிலும் அடிக்குறிப்பிலும் தரப்பட்டுள்ளது.
