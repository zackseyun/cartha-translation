  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τί ὑμῖν δοκεῖ; ἐὰν γένηταί τινι ἀνθρώπῳ ἑκατὸν πρόβατα καὶ πλανηθῇ ἓν ἐξ αὐτῶν, οὐχὶ ⸀ἀφήσει τὰ ἐνενήκοντα ἐννέα ἐπὶ τὰ ὄρη ⸀καὶ πορευθεὶς ζητεῖ τὸ πλανώμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/012.yaml
  text: What do you think? If a man has a hundred sheep[a], and one of them goes astray[c][b], will he not leave the ninety-nine on the mountains and go and seek the one going astray?
translation:
  language: ta
  text: நீங்கள் என்ன நினைக்கிறீர்கள்? ஒரு மனிதனுக்கு நூறு ஆடுகள் இருந்தால், அவற்றில் ஒன்று வழிதவறிப் போனால்[a], அவன் தொண்ணூற்றொன்பது ஆடுகளையும் மலைகளில்[b] விட்டுவிட்டு, போய் வழிதவறிச் செல்கிற அந்த ஆட்டை[c]த் தேட மாட்டானா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அலைந்து விலகிப் போனால்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் ‘வழிதவறுதல்,’ ‘அலைந்து விலகுதல்,’ சில சூழல்களில் ‘தவறாக வழிநடத்தப்படுதல்’ என்றும் பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: ‘குன்றுகளில்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: 'சொல்லுக்குச் சொல்: ‘வழிதவறிச் செல்கிற ஒன்றை.’ மரபாக, ‘காணாமற்போன ஆட்டை’ என்று மொழிபெயர்க்கப்படுகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: நீங்கள் என்ன நினைக்கிறீர்கள்?
  rationale: கேட்போரின் தீர்ப்பைக் கோரும் நேரடியான தொடக்கக் கேள்வியை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἐὰν γένηταί τινι ἀνθρώπῳ
  choice: ஒரு மனிதனுக்கு ... இருந்து
  rationale: γίνομαι என்பதுடன் வரும் தரவு வேற்றுமை இங்கு உடைமைச் சூழலைக் குறிக்கிறது; ἀνθρώπῳ என்பதன் ஒருமை வடிவத்தையும் பிரதிநிதித்துவப் பயன்பாட்டையும் காக்கிறது.
- source_word: ἑκατὸν πρόβατα
  choice: நூறு ஆடுகள்
  rationale: எண்ணையும் πρόβατα என்பதன் இயல்பான தமிழ்ப் பொருளையும் நேரடியாக வழங்குகிறது.
- source_word: πλανηθῇ ἓν ἐξ αὐτῶν
  choice: அவற்றில் ஒன்று வழிதவறிப் போனால்
  rationale: πλανάω என்பதிலுள்ள ‘வழிதவறுதல்/அலைந்து விலகுதல்’ என்ற நுட்பத்தைப் பாதுகாத்து, வெளிப்புற முகமையைத் தேவையின்றி குறிப்பிடவில்லை.
- source_word: οὐχὶ ἀφήσει
  choice: விட்டுவிட்டு ... மாட்டானா?
  rationale: οὐχί எதிர்பார்க்கும் ஆம் என்ற பதிலைத் தமிழின் எதிர்மறை வினா அமைப்பால் இயல்பாக வெளிப்படுத்துகிறது; ἀφήσει-ஐ ‘கைவிடுதல்’ என்ற வலுவான பொருளாக்காமல் ‘விட்டுவிட்டு’ என்கிறது.
- source_word: τὰ ἐνενήκοντα ἐννέα
  choice: தொண்ணூற்றொன்பது ஆடுகளையும்
  rationale: எண்ணைத் தெளிவாகத் தருவதுடன், தமிழில் குறிக்கப்படுபவை ஆடுகள் என்பதை இயல்பாக மீண்டும் கூறுகிறது.
- source_word: ἐπὶ τὰ ὄρη
  choice: மலைகளில்
  rationale: ὄρη என்பதன் பன்மையான நிலவியல் உருவகத்தைத் தக்கவைக்கிறது; ἐπί இச்சூழலில் இருப்பிடத்தைக் குறிக்கும் இயல்பான தமிழ் வடிவம் ‘மலைகளில்’.
- source_word: καὶ πορευθεὶς ζητεῖ
  choice: போய் ... தேட
  rationale: பங்கேற்புவினையும் முதன்மை வினையும் தமிழில் இயல்பான தொடர்வினையாக வழங்குகிறது; ζητέω-வின் நோக்கமுள்ள தேடுதலை ‘தேட’ காக்கிறது.
- source_word: τὸ πλανώμενον
  choice: வழிதவறிச் செல்கிற அந்த ஆட்டை
  rationale: நிகழ்காலப் பங்கேற்புவினையின் தொடரும் செயற்பாட்டையும் முன்பு வந்த πλανάω சொல்லுடனான ஒற்றுமையையும் காக்கிறது; ‘காணாமற்போன ஆடு’ என்று வேறு கிரேக்கச் சொல்லின் கருத்தை இறக்குமதி செய்யவில்லை.
theological_decisions:
- issue: ἀνθρώπῳ என்பதன் பொதுப்பொருளுடைய ஆண்பால் ஒருமை
  choice: ஒரு மனிதனுக்கு
  alternative: ஒருவருக்கு
  rationale: மூலத்தின் ஒருமை மனித நபரைக் காத்தாலும், இது ஆண்களை மட்டுமே குறிக்கும் போதனையாக மாற்றப்படவில்லை; உவமையில் வரும் தனி மனிதனை இயல்பாகச் சித்தரிக்கிறது.
- issue: πλανάω என்பதன் நுட்பம்
  choice: வழிதவறிப் போனால் / வழிதவறிச் செல்கிற
  alternative: அலைந்து விலகிப் போனால் / காணாமற்போன
  rationale: மந்தைச் சூழலுக்கும் உருவகமான அல்லது ஒழுக்கத் தொனிக்கும் இடமளிக்கிறது; ஆடு திட்டமிட்டு விலகியது அல்லது வேறொருவரால் தவறாக நடத்தப்பட்டது என்று தீர்மானிக்கவில்லை.
- issue: οὐχί அமைக்கும் எதிர்பார்ப்பு
  choice: தேட மாட்டானா?
  alternative: தேடுவானல்லவா?
  rationale: கிரேக்கக் கேள்வி ஆம் என்ற பதிலை எதிர்பார்ப்பதைத் தமிழில் தெளிவாகக் காக்கிறது; மாற்றும் சாத்தியமானதே, ஆனால் தேர்ந்த வடிவம் பொதுவாசகருக்கு நேரடியானது.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழ்; பொதுவாசகருக்குப் புரியும் இயல்பான, கண்ணியமான நடை. ‘வழிதவறுதல்’ என்ற சொல்லை இரு இடங்களிலும் வைத்திருப்பதன் மூலம் கிரேக்கச் சொல் மீளுருவாக்கம் பாதுகாக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் தொடர்புடைய சொற்றொடர்களின் அருகே வரிசையாக இடப்பட்டுள்ளன.
