source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Οὐ λέγω σοι ἕως ἑπτάκις ἀλλὰ ἕως ἑβδομηκοντάκις ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/022.yaml
  text: Jesus says to him[a], “I do not say to you, up to seven times, but up to seventy times seven.
translation:
  language: ta
  text: 'இயேசு அவனிடம் கூறுகிறார்: “நான் உனக்குச் சொல்வது ஏழு முறைவரை அல்ல; எழுபத்தேழு முறைவரை.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எழுபது முறை ஏழு.”
    reason: ἑβδομηκοντάκις ἑπτά என்ற கிரேக்க எண்-தொடருக்கான மாற்று வாசிப்பை, அதன் தெளிவின்மையைத் தீர்மானிக்காமல் பாதுகாக்கிறது.
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: இயேசு அவனிடம் கூறுகிறார்
  rationale: கிரேக்கக் கதைநடையின் நிகழ்காலத்தைத் தக்கவைத்து, αὐτῷ என்பதைக் குறிப்பிட்ட பெயராக மாற்றாமல் ‘அவனிடம்’ என மொழிபெயர்க்கிறது.
- source_word: Οὐ λέγω σοι
  choice: நான் உனக்குச் சொல்லவில்லை
  rationale: நேரடியான மறுப்பை இயல்பான நவீனத் தமிழில் தருகிறது; தொடர்ந்து வரும் எதிர்மறை–நேர்மறை முரணைத் தெளிவாக்க இறுதியில் ‘என்று சொல்கிறேன்’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἕως ἑπτάκις
  choice: ஏழு முறைவரை
  rationale: ἕως என்பதன் எண்ணிக்கை வரம்பையும் ἑπτάκις என்பதன் நிகழ்வு எண்ணிக்கையையும் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἀλλὰ
  choice: ; … என்று சொல்கிறேன்
  rationale: கிரேக்கத்தில் விடுபட்டுள்ள வினையைத் தமிழில் இயல்புக்காக மீட்டுரைத்து, ‘அல்ல’ என்பதில் உள்ள எதிர்மறை–நேர்மறை மாறுபாட்டை அரைப்புள்ளியால் தெளிவாகக் காட்டுகிறது.
- source_word: ἑβδομηκοντάκις ἑπτά
  choice: எழுபத்தேழு முறைவரை
  rationale: இரு விதமாகப் புரிந்துகொள்ளக்கூடிய கிரேக்கத் தொடருக்கு ‘எழுபத்தேழு முறை’ என்பதை முதன்மை வாசிப்பாகத் தேர்ந்தெடுக்கிறது; ‘எழுபது முறை ஏழு’ என்ற மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: மன்னிப்பின் எண்ணிக்கையைச் சுட்டும் ἑβδομηκοντάκις ἑπτά என்ற தொடரின் பொருள் தெளிவின்மை
  choice: எழுபத்தேழு முறைவரை
  alternative: எழுபது முறை ஏழு, அதாவது 490 முறைவரை
  rationale: கிரேக்கத் தொடரை 77 என்றும் 70×7 என்றும் வாசிக்க முடியும். ஒரு வாசிப்பை முதன்மை உரையில் அளித்தாலும், மற்ற வாசிப்பை அடிக்குறிப்பில் வெளிப்படையாகத் தக்கவைத்து மூலத்தின் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது; வசனம் குறிப்பிட்ட எண்ணிக்கைக்குப் பிந்தைய கொள்கையை விளக்குகிறது என்று மொழிபெயர்ப்புக்குள் கூடுதல் விளக்கம் புகுத்தப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட நேரடி உரை. கிரேக்கக் கதைநடை நிகழ்காலம் ‘கூறுகிறார்’ எனத் தக்கவைக்கப்பட்டுள்ளது. எண் தொடரின் பொருள் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகக் கொடுக்கப்பட்டுள்ளது.
