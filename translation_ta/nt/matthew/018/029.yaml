id: MAT.18.29
reference: Matthew 18:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πεσὼν οὖν ὁ σύνδουλος ⸀αὐτοῦ παρεκάλει αὐτὸν λέγων· Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ ἀποδώσω σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/029.yaml
  text: So his fellow servant fell down and pleaded with him[a], saying, ‘Be patient with me, and I will repay you.’
translation:
  language: ta
  text: 'ஆகவே, அவனுடைய சக அடிமை[a] அவன் காலில் விழுந்து, அவனிடம் கெஞ்சிக் கேட்டான்: “என்னிடம் பொறுமையாக இரு; நான் உனக்குத் திருப்பிச் செலுத்துவேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சக பணியாள்.” கிரேக்கச் சொல் ஒரே எஜமானுக்குக் கீழ்ப்பட்ட இன்னொருவரைக் குறிக்கிறது; இந்த உவமையில் அடிமை உறவு முக்கியமாக இருப்பதால் “சக அடிமை” என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: σύνδουλος
  choice: சக அடிமை
  rationale: ஒரே எஜமானுக்குக் கீழ்ப்பட்ட இன்னொரு அடிமையை இச்சொல் குறிக்கிறது. கடன், அரசன், அடிமைகள் ஆகியவை இடம்பெறும் உவமையின் சமூகச் சூழலில் பிணைக்கப்பட்ட கீழ்நிலை உறவை ‘அடிமை’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: πεσὼν
  choice: கீழே விழுந்து
  rationale: இரக்கம் கோரும் பணிவான உடல் செயலை நேரடியாகப் பாதுகாக்கிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வசனத்தின் செயலுக்குப் பதிலாக நிகழ்வதை இணைக்கும் தொடர்/விளைவு நுணுக்கத்தை வெளிப்படுத்துகிறது.
- source_word: παρεκάλει
  choice: கெஞ்சிக் கேட்டான்
  rationale: கடனைத் திருப்பிச் செலுத்த அவகாசம் கேட்கும் தீவிரமான வேண்டுதலை இயல்பான நவீனத் தமிழில் காட்டுகிறது; இறந்தகாலத் தொடர்நிலையின் நீடித்த வேண்டுகோள் நுணுக்கத்தையும் சூழலில் உணர்த்துகிறது.
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: என்னிடம் பொறுமையாக இரு
  rationale: ஒருவரிடம் கால அவகாசத்தோடும் பொறுமையோடும் நடந்துகொள்ளுமாறு கோரும் கிரேக்க மரபுத்தொடரை இயல்பாக வழங்குகிறது.
- source_word: ἀποδώσω
  choice: திருப்பிச் செலுத்துவேன்
  rationale: இது கடன் சூழல் என்பதால், பொதுவான ‘திருப்பிக் கொடுப்பேன்’ என்பதைவிட பணம் அல்லது கடனை மீளச் செலுத்தும் பொருளைத் துல்லியமாகக் காட்டுகிறது.
theological_decisions:
- issue: σύνδουλος என்பதில் உள்ள δοῦλος சார்ந்த சமூக உறவை மொழிபெயர்த்தல்
  choice: முதன்மை உரையில் ‘சக அடிமை’
  alternative: ‘சக பணியாள்’ அல்லது ‘உடன் ஊழியன்’
  rationale: ஒரே எஜமானுக்குச் சொந்தமான அடிமை என்ற பிணைக்கப்பட்ட சமூக நிலை உவமையில் முக்கியமானது. மென்மையாக்கப்பட்ட மாற்றுச் சொற்கள் அந்த அதிகார மற்றும் சார்பு உறவை மறைக்கக்கூடும்; எனவே ‘அடிமை’ பயன்படுத்தப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. நேரடி உரையில் இயல்பான ஒருமைச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன; உவமையின் கடன் மற்றும் அடிமைச் சூழல் மென்மையாக்கப்படவில்லை.
