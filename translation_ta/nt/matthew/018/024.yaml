source:
  edition: SBLGNT
  text: ἀρξαμένου δὲ αὐτοῦ συναίρειν ⸀προσηνέχθη ⸂αὐτῷ εἷς⸃ ὀφειλέτης μυρίων ταλάντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/024.yaml
  text: And when he began to settle accounts[a], one debtor who owed ten thousand talents was brought to him.
translation:
  language: ta
  text: அவர் கணக்குகளைத் தீர்க்கத் தொடங்கியபோது, பத்தாயிரம் தாலந்துகள்[a] கடன்பட்டிருந்த ஒரு கடனாளி அவரிடம் கொண்டுவரப்பட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஒரு தாலந்து மிகப் பெரிய பண அலகாக இருந்தது; இந்த உவமையின் சூழலில் ‘பத்தாயிரம் தாலந்துகள்’ என்பது கற்பனைக்கெட்டாத அளவிலான பெரும் கடனைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: ἀρξαμένου δὲ αὐτοῦ
  choice: அவர் ... தொடங்கியபோது
  rationale: இந்தப் பிறப்புவேற்றுமைத் தனிநிலை அமைப்பு முதன்மை நிகழ்வு நடந்த காலச் சூழலைக் குறிக்கிறது. தமிழில் இயல்பான காலத் தொடர்பை இவ்வாறு தெளிவாகக் காட்டலாம்.
- source_word: συναίρειν
  choice: கணக்குத் தீர்க்க
  rationale: நிதிசார் சூழலில் கணக்குகளை ஆராய்ந்து நிலுவைகளை முடிவுக்குக் கொண்டுவருவதைக் குறிக்கிறது. ‘கணக்குத் தீர்க்க’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: προσηνέχθη αὐτῷ
  choice: அவரிடம் கொண்டுவரப்பட்டான்
  rationale: இறந்தகாலச் செயலப்பாட்டு வடிவம், வேறு சிலர் அந்தக் கடனாளியைக் கொண்டுவந்தனர் என்பதைக் காட்டுகிறது; தேவையில்லாமல் அந்தச் செய்பவர்களை அடையாளப்படுத்தவில்லை.
- source_word: εἷς ὀφειλέτης
  choice: ஒரு கடனாளி
  rationale: εἷς ஒரு குறிப்பிட்ட நபரை அறிமுகப்படுத்துகிறது. நவீன தமிழில் ‘ஒரு கடனாளி’ என்பது இயல்பாகவும் கிரேக்கத்தின் பொருளுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: μυρίων ταλάντων
  choice: பத்தாயிரம் தாலந்துகள்
  rationale: μύριοι என்பதன் நேரடி எண்ணியல் பொருள் ‘பத்தாயிரம்.’ தாலந்து என்பது வரலாற்றுக்குரிய பெரும் எடை/பண அலகு என்பதால், விவாதத்திற்குரிய நவீன பண மதிப்பாக மாற்றாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. வரலாற்றுப் பண அலகான ‘தாலந்து’ தக்கவைக்கப்பட்டு, அதன் அளவு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
