id: MAT.18.6
reference: Matthew 18:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὃς δ’ ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν τούτων τῶν πιστευόντων εἰς ἐμέ, συμφέρει αὐτῷ ἵνα κρεμασθῇ μύλος ὀνικὸς ⸀εἰς τὸν τράχηλον αὐτοῦ καὶ καταποντισθῇ ἐν τῷ πελάγει τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/006.yaml
  text: But whoever causes one of these little ones who believe in me to stumble[c][b][a], it is better for him that a donkey millstone be hung around his neck and that he be drowned in the open sea.
translation:
  language: ta
  text: “ஆனால், என்னை நம்புகிற இந்தச் சிறியவர்களில் ஒருவரை யாராவது இடறும்படி செய்தால்[a], அவனுடைய கழுத்தில் கழுதையால் இயக்கப்படும் ஆலைக்கல் ஒன்று கட்டப்பட்டு[b], அவன் நடுக்கடலில்[c] மூழ்கடிக்கப்படுவது அவனுக்கு நல்லது.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாவத்தில் விழும்படி செய்தால்.” கிரேக்க வினைச்சொல் ஒருவரை இடறச் செய்வது, பாவத்தில் விழச் செய்வது, அல்லது விசுவாசத்திலிருந்து விலகச் செய்வது ஆகிய பொருள்களைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், “கழுதைக்குரிய ஆலைக்கல்”; அதாவது, கழுதையால் இயக்கப்படும் பெரிய ஆலைக்கல்.
    reason: cultural_note
  - marker: c
    text: அதாவது, கரையிலிருந்து விலகிய திறந்த கடற்பரப்பில்; “கடலின் ஆழத்தில்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίσῃ
  choice: இடறச் செய்தால்
  rationale: ஆவிக்குரிய தடுமாற்றம், பாவத்தில் விழுதல், விசுவாசத்திலிருந்து விலகுதல் ஆகிய பரந்த பொருள் வாய்ப்புகளையும் உருவகத்தையும் காக்கிறது; ‘பாவம் செய்யத் தூண்டினால்’ என்பது பொருளைத் தேவையின்றிக் குறுக்கும்.
- source_word: μικρῶν τούτων
  choice: இந்தச் சிறியவர்களில்
  rationale: உடல் வயதில் சிறிய குழந்தைகளை மட்டும் குறிக்காமல், தாழ்ந்தவர்களாக அல்லது பலவீனமானவர்களாகக் கருதப்படும் சீடர்களையும் உள்ளடக்கக்கூடிய கிரேக்கச் சொல்லின் பரப்பைப் பாதுகாக்கிறது.
- source_word: τῶν πιστευόντων εἰς ἐμέ
  choice: என்னை நம்புகிற
  rationale: இயேசுவை நோக்கிய நம்பிக்கையை நேரடியாகவும் இயல்பான நவீன தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: συμφέρει αὐτῷ
  choice: அவனுக்கு நல்லது
  rationale: கடுமையான ஒப்பீட்டு எச்சரிக்கையின் சூழலில், ‘அவனுக்குப் பயனுள்ளது’ என்பதைவிட இயல்பாக ஒப்பீட்டுப் பொருளைத் தருகிறது.
- source_word: μύλος ὀνικὸς
  choice: கழுதை சுற்றும் ஆலைக்கல்
  rationale: கையால் சுற்றும் சிறிய கல்லுக்கு மாறாகக் கழுதையால் இயக்கப்பட்ட பெரிய ஆலைக்கல் என்ற வரலாற்றுப் படிமத்தைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: εἰς τὸν τράχηλον αὐτοῦ
  choice: அவனுடைய கழுத்தில் … கட்டி
  rationale: கழுத்தில் கல் தொங்கவிடப்படும் படிமத்தை இயல்பான தமிழ் நடையில் வெளிப்படுத்துகிறது.
- source_word: καταποντισθῇ
  choice: மூழ்கடிப்பதே
  rationale: ஆழமான நீரில் அமிழ்த்தப்பட்டு அழிவதைக் குறிக்கும் இறப்புச் செயப்பாட்டு வினையின் கடுமையைத் தெளிவாகக் காக்கிறது.
- source_word: ἐν τῷ πελάγει τῆς θαλάσσης
  choice: நடுக்கடலில்
  rationale: கரையோரமல்லாத திறந்த கடற்பரப்பைக் குறிக்கும் πέλαγος என்பதன் பொருளை இயல்பான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: ‘சிறியவர்கள்’ என்போரின் வரம்பு
  choice: வயதில் சிறிய குழந்தைகளுக்கு மட்டும் வரம்பிடாமல், இயேசுவை நம்புகிற ‘இந்தச் சிறியவர்கள்’ என்று பரந்தே மொழிபெயர்க்கப்பட்டது.
  alternative: என்னை நம்புகிற இந்தச் சிறு குழந்தைகளில்
  rationale: உடனடி சூழலில் ஒரு குழந்தை எடுத்துக்காட்டாக இருந்தாலும், ‘என்னை நம்புகிற’ என்ற அடைமொழி தாழ்மையான அல்லது எளிய சீடர்களையும் குறிக்கக்கூடும். மொழிபெயர்ப்பு இந்தத் தெளிவின்மையைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் இயல்பானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டது. எச்சரிக்கையின் கடுமையும் கிரேக்க மூலத்தின் செயப்பாட்டு படிமமும் காக்கப்பட்டுள்ளன; தெளிவுபடுத்த வேண்டிய சொற்பொருள் மற்றும் பண்பாட்டு விவரங்கள் அடிக்குறிப்புகளுக்கு மாற்றப்பட்டுள்ளன.
