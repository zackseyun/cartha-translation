source:
  edition: SBLGNT
  text: ἐὰν δὲ μὴ ἀκούσῃ, παράλαβε μετὰ σοῦ ἔτι ἕνα ἢ δύο, ἵνα ἐπὶ στόματος δύο μαρτύρων ἢ τριῶν σταθῇ πᾶν ῥῆμα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/016.yaml
  text: But if he does not listen[a], take one or two others with you[b], so that by the mouth of two or three witnesses every matter may be established.
translation:
  language: ta
  text: ஆனால், அவன் செவிகொடுக்காவிட்டால்[a], இரண்டு அல்லது மூன்று சாட்சிகளின் வாக்கால் ஒவ்வொரு காரியமும் உறுதிப்படுத்தப்படும்படி, உன்னுடன் மேலும் ஒருவரையோ இருவரையோ அழைத்துக்கொள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கேட்காவிட்டால்”; இங்கு கேட்டு அதற்கு இணங்குதல் என்ற கருத்து உட்பொருளாக உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: இது உபாகமம் 19:15-ஐச் சுட்டுகிறது; அங்கு இரண்டு அல்லது மூன்று சாட்சிகளின் அடிப்படையில் ஒரு காரியம் உறுதிப்படுத்தப்படுகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: ἀκούσῃ
  choice: செவிகொடுக்காவிட்டால்
  rationale: இச்சூழலில் வெறுமனே ஒலி கேட்பதைக் காட்டிலும், சொல்வதைக் கவனித்து ஏற்றுக்கொள்வது அல்லது அதற்குச் செவிசாய்ப்பது என்ற பொருள் முதன்மையானது.
- source_word: παράλαβε μετὰ σοῦ
  choice: உன்னுடன் அழைத்துக்கொள்
  rationale: கூடுதலான நபர்களைத் தன்னோடு கூட்டிச் செல்லுமாறு கூறும் கட்டளையின் இயல்பான தமிழாக்கம்.
- source_word: ἔτι ἕνα ἢ δύο
  choice: இன்னும் ஒருவரையோ இருவரையோ
  rationale: ἔτι குறிப்பிடும் கூடுதல் என்ற கருத்தை ‘இன்னும்’ தெளிவாகக் காட்டுகிறது.
- source_word: ἵνα
  choice: உறுதிப்படுத்தப்படும்படி
  rationale: நோக்கத்தைக் குறிக்கும் ἵνα-வின் பொருள் தமிழில் இயல்பாக வெளிப்படுகிறது.
- source_word: ἐπὶ στόματος δύο μαρτύρων ἢ τριῶν
  choice: இரண்டு அல்லது மூன்று சாட்சிகளின் வாக்கால்
  rationale: ‘வாயால்’ என்ற எபிரேயத் தாக்கமுள்ள சட்ட மரபுத்தொடரைத் தமிழில் புரியும்படி ‘வாக்கால்’ என வழங்கி, சாட்சியத்தின் சட்டச் சாரத்தையும் காக்கிறது.
- source_word: σταθῇ
  choice: உறுதிப்படுத்தப்படும்படி
  rationale: சட்டச் சூழலில் ஒரு காரியம் நிலைநாட்டப்படுதல் அல்லது உறுதிசெய்யப்படுதல் என்ற பொருளைத் தருகிறது.
- source_word: πᾶν ῥῆμα
  choice: ஒவ்வொரு காரியமும்
  rationale: சொல்லப்பட்ட ஒவ்வொரு ‘வார்த்தை’ என்பதன் நேரடிப் பொருளைவிட, இங்குள்ள சட்டச் சூழலில் விசாரிக்கப்படும் ஒவ்வொரு காரியத்தையும் குறிக்கிறது.
theological_decisions:
- issue: உபாகமம் 19:15-இன் சட்டச் சாட்சி முறையைச் சபை ஒழுங்குச் சூழலில் பயன்படுத்துதல்
  choice: ‘இரண்டு அல்லது மூன்று சாட்சிகளின் வாக்கால் ஒவ்வொரு காரியமும் உறுதிப்படுத்தப்படும்படி’
  alternative: ‘இரண்டு அல்லது மூன்று சாட்சிகளின் வாயின்மேல் ஒவ்வொரு வார்த்தையும் நிலைநிற்கும்படி’
  rationale: தேர்ந்தெடுக்கப்பட்ட வடிவம் பழைய ஏற்பாட்டுச் சட்டச் சுட்டலை மறைக்காமல் அதன் சட்ட வலிமையைத் தெளிவான நவீன தமிழில் தருகிறது; அதேவேளையில் ‘குற்றச்சாட்டு’ என்று பொருளைத் தேவையின்றி குறுக்குவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்கள் புரிந்துகொள்ளும் வகையில் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘செவிகொடு’, ‘வாக்கு’, ‘காரியம்’ ஆகியவை வசனத்தின் அறிவுறுத்தல் மற்றும் சட்டச் சாட்சி நயத்தை இயல்பாகக் காக்கின்றன.
