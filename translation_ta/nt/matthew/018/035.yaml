reference: Matthew 18:35
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Οὕτως καὶ ὁ πατήρ μου ὁ ⸀οὐράνιος ποιήσει ὑμῖν ἐὰν μὴ ἀφῆτε ἕκαστος τῷ ἀδελφῷ αὐτοῦ ἀπὸ τῶν καρδιῶν ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/035.yaml
  text: So also my heavenly Father will do to you[b][a], if each of you does not forgive his brother from your hearts.
translation:
  language: ta
  text: நீங்கள் ஒவ்வொருவரும் உங்கள் சகோதரனை[a] உள்ளத்திலிருந்து மன்னிக்காவிட்டால், என் பரலோகத் தந்தையும் உங்களுக்கு இப்படியே செய்வார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதரன்” என்பது கிரேக்க மூலத்திலுள்ள ஆண்பால் ஒருமைச் சொல்லை மொழிபெயர்க்கிறது; இச்சூழலில் அது ஒவ்வொரு சக சீடரையும் அல்லது சக விசுவாசியையும் பிரதிநிதித்துவமாகக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: இப்படியே ... உம்
  rationale: முந்தைய உவமையில் எஜமான் செய்ததோடு இந்த எச்சரிக்கையை ஒப்பிட்டு அதன் பயன்பாட்டை எடுத்துரைக்கும் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: என் பரலோகத் தந்தை
  rationale: ‘என்’ என்ற உறவையும் οὐράνιος என்ற ‘பரலோகத்துக்குரிய’ அடைமொழியையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ποιήσει ὑμῖν
  choice: உங்களுக்கு இப்படியே செய்வார்
  rationale: ποιέω என்பதன் பொதுவான வினைப்பொருளைப் பாதுகாத்து, எஜமான் செய்ததை முந்தைய சூழலிலிருந்து வாசகர் புரிந்துகொள்ள விடுகிறது; ‘இப்படியே’ என்பது தமிழில் தேவைப்படும் இயல்பான தொடர்பை அளிக்கிறது.
- source_word: ἐὰν μὴ ἀφῆτε
  choice: மன்னிக்காவிட்டால்
  rationale: எதிர்மறை நிபந்தனையையும், இச்சூழலில் ἀφίημι குறிக்கும் தனிப்பட்ட குற்றமன்னிப்பையும் தெளிவாகத் தருகிறது.
- source_word: ἕκαστος
  choice: நீங்கள் ஒவ்வொருவரும்
  rationale: பன்மை கேட்போரில் ஒவ்வொருவருக்கும் தனித்தனியாக விதிக்கப்படும் கடமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: உங்கள் சகோதரனை
  rationale: கிரேக்கத்தின் ஆண்பால் ஒருமையைப் பாதுகாக்கிறது; தமிழில் ‘நீங்கள் ஒவ்வொருவரும் உங்கள் சகோதரனை’ என்பது பகிர்வுநிலையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἀπὸ τῶν καρδιῶν ὑμῶν
  choice: உள்ளத்திலிருந்து
  rationale: தமிழில் உண்மையான, அகமார்ந்த மன்னிப்பைக் குறிக்கும் இயல்பான சொற்றொடர். கிரேக்கத்தில் பன்மையாக உள்ள ‘உங்கள் இருதயங்களிலிருந்து’ என்பதைக் சொற்சொல்லாக மொழிபெயர்ப்பது தமிழில் செயற்கையாக ஒலிக்கும்; ‘ஒவ்வொருவரும்’ என்பதே தனித்தனி உள்ளங்களைக் குறிக்கிறது.
theological_decisions:
- issue: எச்சரிக்கையின் வீச்சும் வலிமையும்
  choice: தெய்வீகத் தீர்ப்பைப் பற்றிய நேரடியான, கடுமையான நிபந்தனை எச்சரிக்கையாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘உங்களை இதேபோல் நடத்துவார்’ என்று மென்மையாக்குதல் அல்லது இது நித்திய தண்டனையா, வெகுமதி இழப்பா என்று விரிவுபடுத்துதல்.
  rationale: கிரேக்க உரை முந்தைய உவமையில் எஜமான் செய்ததைச் சுட்டும் தீவிர எச்சரிக்கையைத் தருகிறது; ஆனால் அந்தத் தீர்ப்பின் முழு கோட்பாட்டுப் பிரிவை இவ்வசனத்திலேயே வரையறுக்கவில்லை. ஆகவே அதன் இறையியல் இறுக்கம் தீர்க்கப்படாமல் பாதுகாக்கப்படுகிறது.
- issue: ἀδελφῷ என்பதிலுள்ள ஆண்பால் மொழி
  choice: சகோதரன்
  alternative: சகோதரன் அல்லது சகோதரி; சக விசுவாசி
  rationale: மூலச்சொல் ஆண்பால் ஒருமை. அதன் பிரதிநிதித்துவப் பயன்பாடு அடிக்குறிப்பில் விளக்கப்படுகிறது; முதன்மை உரையில் பாலின வடிவம் மாற்றப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், மரியாதையும் தீவிரமும் கொண்ட நேரடியான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இருதயங்களிலிருந்து’ என்ற சொற்சொல் வடிவத்திற்குப் பதிலாக, அகமார்ந்த மன்னிப்பைக் குறிக்கும் இயல்பான ‘உள்ளத்திலிருந்து’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
