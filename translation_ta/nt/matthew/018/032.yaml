source:
  edition: SBLGNT
  text: τότε προσκαλεσάμενος αὐτὸν ὁ κύριος αὐτοῦ λέγει αὐτῷ· Δοῦλε πονηρέ, πᾶσαν τὴν ὀφειλὴν ἐκείνην ἀφῆκά σοι, ἐπεὶ παρεκάλεσάς με·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/032.yaml
  text: Then his master summoned him and said to him[a], ‘Wicked servant[b], I forgave you all that debt because you pleaded with me.’
translation:
  language: ta
  text: அப்போது அவனுடைய எஜமான் அவனை வரவழைத்து, அவனிடம், “பொல்லாத அடிமையே[b], நீ என்னிடம் கெஞ்சிக் கேட்டதால், அந்தக் கடன் முழுவதையும் உனக்கு மன்னித்துவிட்டேன்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்தக் கடன் முழுவதையும் உனக்குத் தள்ளுபடி செய்துவிட்டேன்.” கிரேக்க வினைச்சொல் மன்னிப்பதையும், கடனை விடுவிப்பதையும் அல்லது ரத்து செய்வதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வேலைக்காரனே.” கிரேக்கச் சொல் அடிமையையோ வேலைக்காரனையோ குறிக்கலாம்; இங்கு எஜமானுக்குக் கட்டுப்பட்ட உறவு உவமையில் முக்கியமானதால் “அடிமை” என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: உவமையின் நிகழ்வுத் தொடரில் அடுத்த நிகழ்வை இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: προσκαλεσάμενος
  choice: வரவழைத்து
  rationale: ஒருவரைத் தன்னிடம் அதிகாரத்துடன் அழைப்பதைக் குறிக்கிறது; எஜமானின் செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ὁ κύριος αὐτοῦ
  choice: அவனுடைய எஜமான்
  rationale: இங்கு இது தெய்வீகப் பட்டம் அல்ல; அடிமையின் எஜமானைக் குறிக்கும் சமூக உறவுச் சொல்.
- source_word: λέγει αὐτῷ
  choice: அவனிடம் … என்றார்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் இருந்தாலும், தமிழ் கதைநடையில் இறந்தகாலம் இயல்பானது.
- source_word: Δοῦλε
  choice: அடிமையே
  rationale: இந்த உவமையில் கட்டுப்பட்ட உடைமை மற்றும் அதிகார உறவு முக்கியமானதால், பொதுவான ‘வேலைக்காரன்’ என்பதைவிட ‘அடிமை’ துல்லியமானது.
- source_word: πονηρέ
  choice: பொல்லாத
  rationale: அவனுடைய ஒழுக்கத் தீமையைத் தீர்ப்பாகச் சுட்டுகிறது; நேரடியும் கண்ணியமானதுமான தமிழ் வடிவம்.
- source_word: πᾶσαν τὴν ὀφειλὴν ἐκείνην
  choice: அந்தக் கடன் முழுவதையும்
  rationale: πᾶσαν மற்றும் ἐκείνην ஆகியவற்றின் முழுமையையும் சுட்டுதலையும் தெளிவாகக் காக்கிறது.
- source_word: ἀφῆκά σοι
  choice: உனக்கு மன்னித்துவிட்டேன்
  rationale: உடனடிச் சூழலில் கடன் தள்ளுபடியைக் குறித்தாலும், மத்தேயுவில் உள்ள மன்னிப்பு தொடர்பை இச்சொல் காக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐπεὶ
  choice: …தால்
  rationale: எஜமானின் செயலுக்கான காரணத்தை இயல்பான தமிழ் காரண விகுதியால் தெரிவிக்கிறது.
- source_word: παρεκάλεσάς με
  choice: நீ என்னிடம் கெஞ்சிக் கேட்ட
  rationale: அவனுடைய தீவிரமான வேண்டுதலைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: δοῦλος என்பதைக் எஜமான்–அடிமை உறவில் மொழிபெயர்த்தல்
  choice: அடிமை
  alternative: வேலைக்காரன் / பணியாளர்
  rationale: கடனாளி எஜமானின் அதிகாரத்துக்குக் கட்டுப்பட்டிருப்பது உவமையின் வலிமைக்கு மையமானது. ஆகவே உறவின் கடுமையை மென்மைப்படுத்தாமல் ‘அடிமை’ எனத் தரப்பட்டுள்ளது.
- issue: கடன் சூழலில் ἀφίημι என்பதன் பொருள்
  choice: மன்னித்துவிட்டேன்
  alternative: தள்ளுபடி செய்துவிட்டேன் / ரத்து செய்துவிட்டேன்
  rationale: இங்கு கடன் நீக்கப்படுவதே நேரடிப் பொருள். அதேவேளையில், இந்த உவமையை மன்னிப்பு என்ற பரந்த கருத்துடன் இணைக்கும் சொல்லியல் ஒலிப்பையும் ‘மன்னித்தேன்’ காக்கிறது; வணிகப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கதைநடைக்கு ஏற்ற கண்ணியமான பேச்சு வடிவம் பயன்படுத்தப்பட்டுள்ளது. ‘எஜமான்’ சமூக உறவைத் தெளிவுபடுத்துகிறது; ‘ஆண்டவன்’ என மொழிபெயர்த்து தேவையற்ற தெய்வீகப் பட்டத் தோற்றம் ஏற்படுத்தப்படவில்லை. மூலத்தின் கடன்–மன்னிப்பு இரட்டைப் பொருள் முதன்மை உரையும் அடிக்குறிப்பும் சேர்ந்து பாதுகாக்கப்படுகிறது.
