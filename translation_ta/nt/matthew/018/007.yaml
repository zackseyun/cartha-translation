id: MAT.18.7
reference: Matthew 18:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐαὶ τῷ κόσμῳ ἀπὸ τῶν σκανδάλων· ἀνάγκη ⸀γὰρ ἐλθεῖν τὰ σκάνδαλα, πλὴν οὐαὶ τῷ ⸀ἀνθρώπῳ δι’ οὗ τὸ σκάνδαλον ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/007.yaml
  text: Woe to the world because of stumbling blocks[a]; for it is necessary that the stumbling blocks come[b], but woe to the man through whom the stumbling block comes.
translation:
  language: ta
  text: இடறல்களால்[a] உலகத்திற்கு ஐயோ! ஏனெனில், இடறல்கள் வருவது அவசியம்; ஆனால், எந்த மனிதன் வழியாக அந்த இடறல் வருகிறதோ, அவனுக்கு[b] ஐயோ!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இடறல்கள்,’ ‘பாவத்தில் விழச் செய்பவை,’ அல்லது ‘கண்ணிகள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் மனவருத்தம், கவர்ச்சி, அல்லது பாவம் செய்யும் வாய்ப்பு ஆகியவற்றால் ஒருவரை இடறச் செய்யும் எதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘மனிதன்’ என்பது கிரேக்கத்தில் இலக்கணப்படி ஆண்பால் ஒருமை வடிவம்; இங்கு இப்படிப்பட்ட இடறல் யார் வழியாக வந்தாலும், அந்தத் தனிநபரைக் குறிக்கும் பிரதிநிதித்துவமான பயன்பாடாகும்.
    reason: cultural_note
lexical_decisions:
- source_word: οὐαί
  choice: ஐயோ
  rationale: தீர்க்கதரிசன எச்சரிக்கையும் தண்டனை அறிவிப்பும் கலந்த வலிமையைத் தக்கவைக்கிறது; இரண்டு இடங்களிலும் ஒரே சொல்லைப் பயன்படுத்தி மூலத்தின் சொல்லாட்சித் திரும்பலைப் பேணுகிறது.
- source_word: κόσμῳ
  choice: உலகத்திற்கு
  rationale: படைப்புலகை மட்டும் அல்லாமல், பாவத்தால் பாதிக்கப்பட்ட மனித உலகை விரிவாகக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: ἀπὸ
  choice: …ஆல்
  rationale: இங்கு துயரத்திற்கான காரணத்தைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: σκάνδαλα / σκάνδαλον
  choice: இடறச் செய்பவை / இடறச் செய்வது
  rationale: ஒருவரை மனவருத்தம் அடையச் செய்வது என்ற குறுகிய பொருளுக்கு மட்டுப்படுத்தாமல், சோதனை, கண்ணி, பாவத்தில் விழுவதற்கான வாய்ப்பு ஆகிய பரந்த பொருளையும் உள்ளடக்கும் இடறல் உருவகத்தைப் பேணுகிறது. பன்மை மற்றும் ஒருமை வேறுபாடும் காக்கப்படுகிறது.
- source_word: ἀνάγκη
  choice: அவசியம்
  rationale: அவை வருவதற்கான அவசியம் அல்லது தவிர்க்க முடியாமையைத் தெரிவிக்கிறது; அதன் அடிப்படை இறைத் தீர்மானமா, உலகின் நிலைமையா என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய துயர அறிவிப்புக்கான விளக்கத்தைத் தெளிவாக இணைக்கிறது.
- source_word: ἐλθεῖν ... ἔρχεται
  choice: வருவது ... வருகிறதோ
  rationale: மூலத்தில் மீண்டும் வரும் ‘வருதல்’ வினையைப் பேணி, கருத்தை அளவுக்கு மீறி ‘நிகழ்தல்’ என்று அருவமாக்காமல் வைக்கிறது.
- source_word: πλήν
  choice: ஆனாலும்
  rationale: இடறச் செய்பவை வருவதன் அவசியத்திலிருந்து, அவை யார் வழியாக வருகின்றனவோ அவருக்கான தனிப்பட்ட எச்சரிக்கைக்குத் திருப்பும் வலுவான எதிர்மறை இணைப்பை வெளிப்படுத்துகிறது.
- source_word: ἀνθρώπῳ
  choice: அந்த மனிதனுக்கு
  rationale: மூலத்தின் ஒருமை மனித முகவரைக் காக்கிறது. சூழலில் இது எந்த ஒரு தனிநபரையும் பிரதிநிதித்துவமாகக் குறிக்க முடியும் என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: δι’ οὗ
  choice: எவன் வழியாக
  rationale: இடறச் செய்வது வரும் மனித முகவரை அல்லது வழிமூலத்தை இயல்பான தமிழில் குறிக்கிறது.
theological_decisions:
- issue: ἀνάγκη γὰρ ἐλθεῖν τὰ σκάνδαλα என்பதில் உள்ள அவசியத்தின் தன்மை
  choice: ‘வருவது அவசியம்’ என்று அதன் அடிப்படையை விளக்காமல் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘கட்டாயம் வந்தே தீரும்’ அல்லது ‘வரும்படி இறைவன் நியமித்திருக்கிறார்’ என்று வலுப்படுத்துதல்.
  rationale: கிரேக்கம் அவசியத்தைச் சொல்கிறது; ஆனால் அதன் காரணம் அல்லது ஆதாரத்தை வெளிப்படையாகக் கூறவில்லை. ஆகவே இறைவன் நேரடியாகக் காரணமாகிறார் என்ற கோட்பாட்டைச் சேர்க்காமல், மூலத்தின் இறையியல் பதற்றம் அப்படியே விடப்படுகிறது.
- issue: ἀνθρώπῳ என்பதன் பிரதிநிதித்துவப் பயன்பாடு
  choice: முதன்மை உரையில் ‘அந்த மனிதனுக்கு’ என்று ஒருமையை வைத்துப், அது எந்தத் தனிநபரையும் குறிக்கக்கூடும் என்பதை அடிக்குறிப்பில் விளக்குதல்.
  alternative: ‘அந்த நபருக்கு’ அல்லது ‘யார் வழியாக வருகிறதோ அவருக்கு’ என்று பாலினச் சுட்டில்லாமல் மொழிபெயர்த்தல்.
  rationale: மூல வடிவம் இலக்கணப்படி ஆண்பால் ஒருமையாக இருந்தாலும், சூழலில் எவருக்கும் பொருந்தும் பிரதிநிதித்துவ எச்சரிக்கையாகச் செயல்படுகிறது. இரு அம்சங்களையும் முதன்மை உரை மற்றும் அடிக்குறிப்பு சேர்ந்து காக்கின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் தீர்க்கதரிசன எச்சரிக்கையின் கண்ணியமும் வலிமையும் குறையாத வகையிலும் அமைக்கப்பட்டது. ‘இடறச் செய்பவை’ என்ற வடிவம் சற்றே உருவகத் தன்மையுடன் இருந்தாலும், மூலச்சொல்லின் பரந்த பொருளையும் ஒருமை/பன்மை அமைப்பையும் காக்கிறது.
