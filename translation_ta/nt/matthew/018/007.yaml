  to: இடறல்களால்[a] உலகத்திற்கு ஐயோ! ஏனெனில், இடறல்கள் வருவது அவசியம்; ஆனால், எந்த மனிதன் வழியாக அந்த இடறல் வருகிறதோ, அவனுக்கு[b] ஐயோ!
  rationale: மூலத்தின் சொல்லுருவையும் கருத்தளவையும் மாற்றாமல், தமிழில் இயல்பற்ற வினைத் தொடர்களைத் தெளிவான பெயர்ச்சொல் வடிவங்களால் மாற்றியுள்ளேன். ‘வருவது … வருகிறதோ’ என்ற மூல வினைத் திரும்பல், இடறல்களின் பன்மை மற்றும் இறுதியில் இடறலின் ஒருமை, அவசியத்தின் விளக்கப்படாத தன்மை, மற்றும் மனித முகவருக்கான தனிப்பட்ட ஐயோ ஆகியவை அனைத்தும் காக்கப்பட்டுள்ளன.
