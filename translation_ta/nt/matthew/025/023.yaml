id: MAT.25.23
reference: Matthew 25:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/023.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will put you over many things. Enter into the joy of your master.’
translation:
  language: ta
  text: அவனுடைய எஜமான் அவனிடம், “நன்றாகச் செய்தாய், நல்லவனும் உண்மையுள்ளவனுமான பணியாளனே![a] சில காரியங்களில் நீ உண்மையுள்ளவனாய் இருந்தாய்; பல காரியங்களுக்கு உன்னைப் பொறுப்பாளனாக நியமிப்பேன். உன் எஜமானின் மகிழ்ச்சிக்குள் நுழை” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அடிமையே!” கிரேக்கச் சொல் δοῦλος; சூழலைப் பொறுத்து இது பணியாளனையோ அடிமையையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: என்றான்
  rationale: நேர்க் கூற்றை முடிக்கும் இயல்பான நவீனத் தமிழ் கதைநடை வடிவம்.
- source_word: κύριος
  choice: எஜமான்
  rationale: உவமையின் சூழலில் இது பணியாளனுக்கு அதிகாரமுள்ள மனித எஜமானைக் குறிக்கிறது; நேரடியான தெய்வீகப் பட்டமாக மொழிபெயர்ப்பதைத் தவிர்க்கிறது.
- source_word: δοῦλε
  choice: பணியாளனே
  rationale: சூழலிலுள்ள கீழ்ப்படிதல் மற்றும் சேவை உறவை இயல்பான தமிழில் தெரிவிக்கிறது; ‘அடிமை’ என்ற வலுவான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: Εὖ
  choice: நன்று செய்தாய்
  rationale: பாராட்டைத் தெரிவிக்கும் εὖ என்பதற்கான இயல்பான தமிழ் சொற்றொடர்.
- source_word: ἀγαθὲ καὶ πιστέ
  choice: நல்லவனும் நம்பிக்கைக்குரியவனுமான
  rationale: இரு அழைப்புநிலைப் பெயரடைகளையும் காத்து, πιστός என்பதன் நம்பகத்தன்மை சார்ந்த பொருளைத் தெளிவாக்குகிறது.
- source_word: ἐπὶ ὀλίγα ἦς πιστός
  choice: சிறிதானவற்றில் நீ நம்பிக்கைக்குரியவனாய் இருந்தாய்
  rationale: ஒப்படைக்கப்பட்ட குறைந்த அளவிலான காரியங்களில் காட்டிய நம்பகத்தன்மையைத் தெரிவிக்கிறது; ‘சிலவற்றில்’ என்றும் பொருள்கொள்ளக்கூடிய எண்ணிக்கை/அளவு நுணுக்கத்தைத் தேவையின்றி தீர்மானிக்கவில்லை.
- source_word: ἐπὶ πολλῶν σε καταστήσω
  choice: பலவற்றுக்கு உன்னைப் பொறுப்பாளனாக நியமிப்பேன்
  rationale: καθίστημι இங்கு அதிகமானவற்றின் மேல் பொறுப்பு அளிப்பதைக் குறிக்கிறது; தமிழில் முழுப் பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἴσελθε εἰς τὴν χαρὰν
  choice: மகிழ்ச்சிக்குள் நுழை
  rationale: ‘உள்ளே நுழை’ என்ற மூல உருவகத்தைத் தக்கவைத்து, அதை வெறுமனே ‘மகிழ்ச்சியில் பங்குகொள்’ என்று விளக்கமாக மாற்றவில்லை.
theological_decisions:
- issue: உவமையில் மனித மேலதிகாரியைக் குறிக்கும் κύριος
  choice: எஜமான்
  alternative: ஆண்டவர்
  rationale: கதையின் உடனடிச் சுட்டுப்பொருள் மனித எஜமான். ‘ஆண்டவர்’ என்பது நேரடித் தெய்வீகப் பட்டம் என்ற எண்ணத்தை உண்டாக்கக்கூடும்; உவமையின் இறையியல் தொடர்பு சூழலிலிருந்து வெளிப்பட அனுமதிக்கப்படுகிறது.
- issue: இச்சூழலில் δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: பணியாளன்
  alternative: அடிமை
  rationale: வசனத்தின் முன்னிலையில் இருப்பது உண்மையுடன் பொறுப்பை நிறைவேற்றியதற்கான பாராட்டு. அதனால் இயல்பான ‘பணியாளன்’ முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டு, சட்ட/சமூக அடிமைநிலை நுணுக்கமுள்ள ‘அடிமை’ அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; dignified ஆனால் பொதுவாசகருக்குப் புரியும் கதைநடை. ‘எஜமான்,’ ‘பணியாளன்,’ ‘பொறுப்பாளன்’ ஆகியவை உவமையின் அதிகார மற்றும் பொறுப்புறவைத் தெளிவாக வைத்திருக்கின்றன. πιστός இருமுறையும் ‘நம்பிக்கைக்குரிய’ என ஒரே சொல் தொடர்புடன் வழங்கப்பட்டுள்ளது.
