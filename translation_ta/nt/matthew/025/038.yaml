  text: πότε δέ σε εἴδομεν ξένον καὶ συνηγάγομεν, ἢ γυμνὸν καὶ περιεβάλομεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/038.yaml
  text: And when did we see you as a stranger and take you in[c][b][a], or naked and clothe you?
translation:
  language: ta
  text: “மேலும், நாங்கள் எப்போது உம்மை அந்நியராக[a]க் கண்டு ஏற்றுக்கொண்டோம்[b]? அல்லது உம்மை ஆடையின்றி இருந்தவராக[c]க் கண்டு உமக்கு ஆடை அணிவித்தோம்?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அறிமுகமில்லாதவராக” அல்லது “வெளியிலிருந்து வந்தவராக.” கிரேக்கச் சொல் அறிமுகமில்லாத ஒருவரையோ தமது சமூக வட்டத்திற்கு வெளியே உள்ள ஒருவரையோ குறிக்கலாம்; இங்கு விருந்தோம்பல் தேவைப்படும் ஒருவரே கருத்தில் உள்ளார்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “சேர்த்துக்கொண்டோம்” அல்லது “உள்ளே அழைத்துக்கொண்டோம்.” இங்கு ஒருவரை ஏற்று விருந்தோம்புவது பொருள்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “போதிய ஆடையில்லாமல்.” கிரேக்கச் சொல் முற்றிலும் ஆடையில்லாத நிலையையோ தேவையான அளவு ஆடை இல்லாத நிலையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πότε
  choice: எப்போது
  rationale: கடந்த காலத்தில் அந்தச் செயல் நிகழ்ந்த நேரத்தைப் பற்றிய இயல்பான தமிழ் வினாவடிவம்.
- source_word: δέ
  choice: மேலும்
  rationale: முந்தைய கேள்விகளின் தொடரில் இதையும் மென்மையாக இணைக்கிறது; வலுவான எதிர்மறைப் பொருளை உருவாக்கவில்லை.
- source_word: σε
  choice: உம்மை / உமக்கு
  rationale: உவமையில் அரசரை நோக்கிப் பேசுவதால், ஒருமையைப் பாதுகாக்கும் மரியாதை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: εἴδομεν
  choice: கண்டு
  rationale: இறந்தகாலச் செயலைத் தொடர்ந்து வரும் மற்ற வினைகளுடன் இயல்பான தமிழில் இணைக்கிறது.
- source_word: ξένον
  choice: அந்நியராக
  rationale: அறிமுகமற்றவர் அல்லது தமது வட்டத்திற்கு வெளியேயுள்ளவர் என்ற சமூகப் பொருளைத் தக்கவைத்து, விருந்தோம்பல் தேவைப்படும் நிலையைச் சுட்டுகிறது.
- source_word: συνηγάγομεν
  choice: ஏற்றுக்கொண்டோம்
  rationale: சொல்லுக்குச் சொல் பொருள் ‘ஒன்றாகச் சேர்த்தோம்’ என்றாலும், இச்சூழலில் ஒருவரைத் தம்மிடம் ஏற்று விருந்தோம்புவதைக் குறிக்கிறது.
- source_word: ἢ
  choice: அல்லது
  rationale: இரண்டாவது கேள்வியை மாற்றாக இணைக்கும் இயல்பான தமிழ் இணைப்புச்சொல்.
- source_word: γυμνὸν
  choice: ஆடையின்றி
  rationale: நிர்வாணமாக அல்லது போதிய ஆடையில்லாமல் இருப்பது ஆகிய இரு சாத்தியங்களையும் உள்ளடக்கக்கூடிய தெளிவான தமிழ் வடிவம்.
- source_word: περιεβάλομεν
  choice: உமக்கு ஆடை அணிவித்தோம்
  rationale: ஒருவருக்கு ஆடை உடுத்துவித்த செயலைத் துல்லியமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: நியாயத்தீர்ப்பு உவமையில் ξένος என்பதன் பொருள்
  choice: அந்நியர்
  alternative: வெளிநாட்டவர்
  rationale: இங்கு இனத்தையோ நாட்டுரிமையையோ குறிப்பாக முன்வைப்பதைவிட, அறிமுகமற்றவராகவும் வரவேற்பு தேவைப்படுபவராகவும் இருப்பதே மையம். ‘அந்நியர்’ அந்த விரிந்த சமூகப் பொருளைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. அரசரை நோக்கிய ஒருமை மரியாதை வடிவமாக ‘உம்மை/உமக்கு’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் வினா அமைப்பும் ξένος மற்றும் γυμνός ஆகிய சொற்களின் பொருள் விரிவும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
