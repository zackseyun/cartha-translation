  text: And he will place the sheep at his right hand[b][a], but the goats at the left.
translation:
  language: ta
  text: அவர் செம்மறியாடுகளைத் தமது வலப்பக்கத்திலும்[b], வெள்ளாட்டுக் குட்டிகளைத்[a] தமது இடப்பக்கத்திலும் நிறுத்துவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “வெள்ளாடுகளை.” கிரேக்கச் சொல் இளம் வெள்ளாடுகளையோ வெள்ளாட்டுக் குட்டிகளையோ குறிப்பாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் சொல்லுக்குச் சொல் வடிவம் “வலப்புறத்திலிருந்து … இடப்புறத்திலிருந்து”; இங்கு இது வலப்பக்கத்திலும் இடப்பக்கத்திலும் நிறுத்துவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: στήσει
  choice: நிறுத்துவார்
  rationale: ἵστημι என்பதன் எதிர்காலச் செயப்பாட்டு வடிவம் இங்கு ஒருவரை அல்லது ஒன்றை ஓர் இடத்தில் நிற்கச் செய்வதைக் குறிக்கிறது. “நிறுத்துவார்” என்பது அந்தக் காரணவினைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: πρόβατα
  choice: செம்மறியாடுகளை
  rationale: πρόβατα என்பது இங்கு வெள்ளாடுகளுக்கு மாறாகச் செம்மறியாடுகளைக் குறிக்கிறது. தமிழில் இரு வகைகளையும் தெளிவாக வேறுபடுத்த “செம்மறியாடுகள்” பொருத்தமானது.
- source_word: ἐκ δεξιῶν αὐτοῦ
  choice: தமது வலப்பக்கத்திலும்
  rationale: சொல்லுக்குச் சொல் வடிவில் “அவருடைய வலப்புறத்திலிருந்து” என்றிருந்தாலும், இவ்விட அமைப்பில் இந்தக் கிரேக்க மரபுத்தொடர் அவருடைய வலப்பக்கத்தில் நிறுத்தப்படுவதைக் குறிக்கிறது. எழுவாயையே திரும்பச் சுட்டுவதால் “தமது” இயல்பான தமிழ்.
- source_word: ἐρίφια
  choice: வெள்ளாட்டுக் குட்டிகளை
  rationale: ἐρίφια என்பது குறிப்பாக இளம் வெள்ளாடுகளை அல்லது வெள்ளாட்டுக் குட்டிகளைக் குறிக்கலாம். மூலச்சொல்லின் வயது நுணுக்கத்தைத் தமிழில் இயல்பாகப் பாதுகாக்க “வெள்ளாட்டுக் குட்டிகள்” தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἐξ εὐωνύμων
  choice: தமது இடப்பக்கத்திலும்
  rationale: இந்த இட அமைப்பில் கிரேக்க மரபுத்தொடர் இடப்பக்கத்தில் என்பதைக் குறிக்கிறது. αὐτοῦ மீண்டும் வராவிட்டாலும், தமிழில் இணையான எதிர்மறை அமைப்பைத் தெளிவாக்க “தமது” வழங்கப்பட்டுள்ளது.
- source_word: μὲν ... δὲ
  choice: …-இலும், …-இலும்
  rationale: μὲν … δὲ இரு குழுக்களையும் எதிரெதிராக அமைக்கிறது. தமிழில் வலப்பக்கம்–இடப்பக்கம் என்ற இணை அமைப்புடன் வரும் “-இலும் … -இலும்” அந்த வேறுபாட்டை இயல்பாக வெளிப்படுத்துகிறது; தனியாக “ஆனால்” சேர்ப்பது தேவையில்லை.
theological_decisions:
- issue: வலப்பக்கம் மற்றும் இடப்பக்கத்தின் அடையாளப் பொருளை மொழிபெயர்ப்பிலேயே விளக்க வேண்டுமா?
  choice: இட அமைப்பை மட்டும், “தமது வலப்பக்கத்திலும் … தமது இடப்பக்கத்திலும்” என்று மொழிபெயர்த்தல்
  alternative: “மதிப்புக்குரிய இடம்” மற்றும் “மதிப்பற்ற இடம்” என்று விளக்கமாக விரித்தல்
  rationale: வசனம் நியாயத்தீர்ப்புக் காட்சியில் இரு குழுக்களும் எங்கு நிறுத்தப்படுகின்றன என்பதையே நேரடியாகச் சொல்கிறது. வலம்–இடம் என்பவற்றின் மதிப்பீட்டு நுணுக்கம் சூழலில் வெளிப்படுகிறது; அதை முதன்மை உரையில் விரிப்பது மூலத்தை மீறிய விளக்கமாகிவிடும்.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குத் தெளிவாகவும் நியாயத்தீர்ப்புக் காட்சிக்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. “செம்மறியாடுகள் / வெள்ளாட்டுக் குட்டிகள்” என்ற சொற்கள் மேய்ப்பர் உருவகத்தைத் தெளிவாக வைத்திருக்கின்றன.
