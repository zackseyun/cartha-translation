base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/004.yaml
  text: But the wise took oil in their containers with their lamps[a].
translation:
  language: ta
  text: ஆனால் விவேகமுள்ளவர்கள் தங்கள் விளக்குகளுடன்[a] பாத்திரங்களில் எண்ணெயையும் எடுத்துக்கொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘விளக்குகள்’ என்பதற்குப் பதிலாக ‘தீப்பந்தங்கள்’ என்றும் மொழிபெயர்க்கலாம் (கிரேக்கம்: lampadas); சூழலைப் பொறுத்து இச்சொல் விளக்கையோ தீப்பந்தத்தையோ குறிக்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φρόνιμοι
  choice: விவேகமுள்ளவர்கள்
  rationale: நடைமுறை அறிவும் முன்யோசனையும் உடையவர்கள் என்ற பொருளை இயல்பாகத் தருகிறது; சூழலில் வரும் மதியற்றவர்களுடனான வேறுபாட்டையும் காக்கிறது. ‘ஆயத்தமுள்ளவர்கள்’ என்பது விளக்கவுரையாகிவிடும்.
- source_word: ἔλαβον
  choice: எடுத்துக்கொண்டார்கள்
  rationale: கதையின் சூழலில் தங்களுடன் எடுத்துச் சென்றார்கள் என்பதே பொருள்; ‘பெற்றுக்கொண்டார்கள்’ பொருந்தாது.
- source_word: ἔλαιον
  choice: எண்ணெய்
  rationale: மூலச்சொல்லின் பொதுவான பொருளைத் தருகிறது; அது ஒலிவ எண்ணெய் என்று தேவையின்றிக் குறிப்பாக்கவில்லை.
- source_word: ἀγγείοις
  choice: பாத்திரங்களில்
  rationale: வடிவம் அல்லது பொருள் எதையும் குறிப்பாக்காமல், பொதுவான கொள்கலன் என்ற பொருளைக் காக்கிறது.
- source_word: λαμπάδων
  choice: விளக்குகளுடன்
  rationale: இச்சொல் விளக்கு அல்லது தீப்பந்தம் எனப் பொருள்படலாம். எண்ணெய் குறித்த சூழலிலும் தமிழ் வேதாகம நடையிலும் ‘விளக்குகள்’ இயல்பானது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἑαυτῶν
  choice: தங்கள்
  rationale: எழுவாயைத் திரும்பச் சுட்டும் உடைமையை இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: μετὰ τῶν λαμπάδων ἑαυτῶν
  choice: தங்கள் விளக்குகளுடன்
  rationale: μετά என்னும் சொல்லின் உடனிணைவு பொருளைக் காத்து, எண்ணெயைப் பாத்திரங்களில் விளக்குகளோடு எடுத்துச் சென்றதை இயல்பாகக் கூறுகிறது.
