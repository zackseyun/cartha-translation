source:
  edition: SBLGNT
  text: ὕστερον δὲ ἔρχονται καὶ αἱ λοιπαὶ παρθένοι λέγουσαι· Κύριε κύριε, ἄνοιξον ἡμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/011.yaml
  text: Later[a], the other virgins also come, saying, ‘Lord, lord[c][b], open to us.’
translation:
  language: ta
  text: பிறகு, மற்ற கன்னிப்பெண்களும் வந்து, “ஆண்டவரே, ஆண்டவரே[a], எங்களுக்குத் திறந்துவிடுங்கள்[b]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “ஐயா, ஐயா” அல்லது “எஜமானே, எஜமானே.” கிரேக்கம்: «Κύριε κύριε».'
    reason: alternative_reading
  - marker: b
    text: கிரேக்கத்தில் ‘எங்களுக்குத் திற’ என்று மட்டுமே உள்ளது; ‘கதவை’ என்பது சூழலிலிருந்து புரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: பிறகு
  rationale: கதையில் அடுத்ததாக நிகழ்ந்த செயலைக் குறிக்கும் கால வினையடை; நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: δὲ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது மென்மையான இணைப்புச் சொல். ‘பிறகு’ என்பதும் தமிழ் வாக்கிய அமைப்பும் மாற்றத்தைப் போதுமான அளவு வெளிப்படுத்துகின்றன.
- source_word: ἔρχονται
  choice: வந்து
  rationale: கிரேக்க நிகழ்காலம் இங்கு கதையை உயிரோட்டமாகச் சொல்லும் நிகழ்காலமாக உள்ளது. தமிழில் அடுத்துள்ள ‘என்றார்கள்’ என்பதோடு இயல்பாக இணைவதற்காக வினையெச்ச வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: καὶ
  choice: -உம்
  rationale: சேர்க்கைப் பொருளைத் தமிழின் ‘உம்’ விகுதி இயல்பாக வெளிப்படுத்துகிறது.
- source_word: αἱ λοιπαὶ παρθένοι
  choice: மற்ற கன்னிப்பெண்கள்
  rationale: λοιπαί என்பதன் ‘மற்ற/மீதமுள்ள’ பொருளையும் παρθένοι என்பதன் நேரடிப் பொருளையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: λέγουσαι
  choice: …என்றார்கள்
  rationale: நேர்கூற்றை அறிமுகப்படுத்தும் கிரேக்கப் பங்கேற்பு வினை, தமிழில் இயல்பான நேர்கூற்று முடிப்பு வினையாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: Κύριε κύριε
  choice: ஆண்டவரே, ஆண்டவரே
  rationale: κύριος என்பதன் மரியாதைமிக்க சமூகப் பொருளையும் மத்தேயுவில் இருக்கக்கூடிய இறையியல் ஒலிப்பையும் பாதுகாக்கிறது; அவசரத்தை வெளிப்படுத்தும் இரட்டிப்பு அப்படியே வைக்கப்பட்டுள்ளது.
- source_word: ἄνοιξον ἡμῖν
  choice: எங்களுக்குத் திறந்துவிடுங்கள்
  rationale: கட்டளை வடிவத்தையும் அவர்கள் உள்ளே செல்லும் வகையில் திறக்குமாறு கேட்பதையும் இயல்பான மரியாதைத் தமிழில் தருகிறது; கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘கதவை’ முதன்மை உரையில் சேர்க்கவில்லை.
theological_decisions:
- issue: நேரடி அழைப்பில் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவரே
  alternative: ஐயா; எஜமானே
  rationale: உவமையின் உடனடிச் சூழலில் இது மரியாதை அழைப்பாக இருக்கலாம்; அதேவேளையில் மத்தேயுவின் பரந்த இறையியல் சூழலில் ‘ஆண்டவர்’ என்ற ஒலிப்பையும் கொண்டிருக்கலாம். ‘ஆண்டவரே’ என்பது அந்த இரு சாத்தியங்களுக்கிடையேயான பதற்றத்தைச் சுருக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘கன்னிப்பெண்கள்’ மூலச்சொல்லை நேரடியாகப் பாதுகாக்கிறது; உரையாடலில் மரியாதைப் பன்மையான ‘திறந்துவிடுங்கள்’ இயல்பான வேண்டுகோளாக உள்ளது.
