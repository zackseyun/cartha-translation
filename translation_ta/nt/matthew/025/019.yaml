  text: μετὰ δὲ ⸂πολὺν χρόνον⸃ ἔρχεται ὁ κύριος τῶν δούλων ἐκείνων καὶ συναίρει ⸂λόγον μετ’ αὐτῶν⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/019.yaml
  text: After a long time[a], the master of those servants comes and settles accounts with them.
translation:
  language: ta
  text: நீண்ட காலத்திற்குப் பிறகு, அந்த அடிமைகளின் எஜமான் வந்து அவர்களோடு கணக்குத் தீர்க்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எஜமான்” என்பதை “ஆண்டவர்” என்றும், “அடிமைகள்” என்பதை “பணியாளர்கள்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் κύριος என்பது ‘ஆண்டவர்’ அல்லது ‘எஜமான்’ என்றும், δοῦλοι என்பது ‘அடிமைகள்’ அல்லது ‘பணியாளர்கள்’ என்றும் பொருள்படலாம்; இங்கு உவமையின் வீட்டு மற்றும் பொருளாதாரச் சூழலை முதன்மை உரை வெளிப்படுத்துகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ δὲ πολὺν χρόνον
  choice: நீண்ட காலத்திற்குப் பிறகு
  rationale: μετά உடன் வரும் காலக் குறிப்பு ‘பிறகு’ என்ற பொருளைத் தருகிறது. δέ இங்கு மென்மையான கதைத் தொடர்ச்சி இணைப்பாக இருப்பதால், தமிழில் தனியாக ‘ஆனால்’ அல்லது ‘இப்போது’ என்று சேர்க்காமல் இயல்பாக விடப்பட்டுள்ளது.
- source_word: ἔρχεται
  choice: வந்து ... தீர்க்கிறார்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தின் உயிரோட்டத்தைத் தமிழிலும் நிகழ்கால வடிவில் தக்கவைக்கிறது; ‘வருகிறார்’ என்பதைத் தனியே கூறுவதற்குப் பதிலாக அடுத்த செயலுடன் ‘வந்து’ என இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: ὁ κύριος
  choice: எஜமான்
  rationale: இங்கு κύριος நேரடியான கிறிஸ்தியல் பட்டமாக அல்லாமல், உவமையில் அடிமைகள்மேல் அதிகாரமுள்ள வீட்டுத் தலைவரைக் குறிக்கிறது. ‘எஜமான்’ அந்த சமூக உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: τῶν δούλων ἐκείνων
  choice: அந்த அடிமைகளின்
  rationale: δοῦλος இச்சூழலில் எஜமானுக்குக் கீழ்ப்பட்ட பிணைக்கப்பட்ட சமூக நிலையைக் குறிக்கிறது. எனவே மென்மையான ‘பணியாளர்கள்’ என்பதைக் காட்டிலும் ‘அடிமைகள்’ மூலத்தின் தன்மையைத் தெளிவாகக் காக்கிறது.
- source_word: συναίρει λόγον μετ’ αὐτῶν
  choice: அவர்களோடு கணக்குத் தீர்க்கிறார்
  rationale: இது ஒருவரோடு கணக்கைப் பார்த்துத் தீர்ப்பது அல்லது கணக்கு ஒப்பிப்பது என்ற வணிகக் கணக்கியல் மரபுத்தொடர். ‘கணக்குத் தீர்க்கிறார்’ என்பது நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
theological_decisions:
- issue: உவமையில் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: எஜமான்
  alternative: ஆண்டவர்
  rationale: வசனத்தின் நேரடி கதைச்சூழலில் இவர் அடிமைகளின் உரிமையாளரும் தலைவருமாக இருக்கிறார். ‘எஜமான்’ என்பது இந்தக் கதைப் பாத்திரத்தின் உறவை வெளிப்படுத்துகிறது; அதேவேளை உவமையின் விரிவான இறையியல் சுட்டுதலை மறுப்பதில்லை.
- issue: δοῦλος என்பதன் சமூகப் பொருள்
  choice: அடிமைகள்
  alternative: பணியாளர்கள்
  rationale: எஜமான்–அடிமை உறவும் ஒப்படைக்கப்பட்ட செல்வத்தின் கணக்கெடுப்பும் இங்கு வெளிப்படையாக இருப்பதால், பிணைக்கப்பட்ட நிலையை மறைக்காத ‘அடிமைகள்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- issue: வரலாற்று நிகழ்காலம் ἔρχεται
  choice: வந்து ... தீர்க்கிறார்
  alternative: வந்து ... தீர்த்தார்
  rationale: மூலத்தின் நிகழ்கால வடிவம் உவமைக் கதைக்கு உயிரோட்டம் அளிக்கிறது. தமிழிலும் நிகழ்காலத்தைப் பேணுவது அந்த இலக்கிய விளைவைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குத் தெளிவானதும் மரியாதைமிக்கதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கணக்குத் தீர்க்கிறார்’ என்ற இயல்பான சொற்றொடர் மூலத்தின் கணக்கியல் உருவகத்தைப் பேணுகிறது; தேவையற்ற விளக்கச் சொற்கள் சேர்க்கப்படவில்லை.
