  naturalness: ‘அதேபோல், இரண்டு வைத்திருந்தவனும் மேலும் இரண்டு ஈட்டினான்’ என்பது நவீனத் தரத் தமிழில் தெளிவாகவும் வாசிப்புக்கு இயல்பாகவும் உள்ளது. சூழலில் ‘தாலந்துகள்’ ஏற்கெனவே அறிமுகமாகியிருப்பதால் முதன்மை உரையில் அதை மீண்டும் சேர்க்காதது ஏற்றது.
