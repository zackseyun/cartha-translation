lexical_decisions:
- source_word: ὡσαύτως
  choice: அதேபோல்
  rationale: முந்தைய பணியாளன் செய்ததோடு இவனுடைய செயலை ஒப்பிட்டு இணைக்கும் வினையடை; நவீனத் தமிழில் இயல்பாகவும் சுருக்கமாகவும் ஒப்புமைப் பொருளைத் தருகிறது.
- source_word: ὁ τὰ δύο
  choice: இரண்டு வைத்திருந்தவன்
  rationale: மூலத்தில் பெயர்ச்சொல் விடுபட்டுள்ள நீள்வட்டத் தொடர்; சூழலில் இரண்டு தாலந்துகள் ஒப்படைக்கப்பட்ட பணியாளனைக் குறிக்கிறது. மூலத்தின் சுருக்கத்தைத் தக்கவைக்கிறது.
- source_word: ἐκέρδησεν
  choice: ஈட்டினான்
  rationale: வெற்றிகரமான செயலால் கூடுதல் பணத்தைப் பெற்றதைக் குறிக்கிறது; ‘சம்பாதித்தான்’ என்பதைக் காட்டிலும் சுருக்கமாகவும் கண்ணியமான நடையிலும் நிதிசார் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: ἄλλα δύο
  choice: மேலும் இரண்டு
  rationale: அதே வகையைச் சேர்ந்த கூடுதல் இரண்டைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
