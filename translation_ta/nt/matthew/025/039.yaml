    text: அல்லது, “உம்மைச் சந்தித்தோம்?” கிரேக்கத்தில் இன்னும் நேரடியாக, “உம்மிடம் வந்தோம்?” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πότε
  choice: எப்போது
  rationale: செயல் நிகழ்ந்த காலத்தை வினவும் வினாவடையாக இருப்பதால், நேரடியும் இயல்பானதுமான “எப்போது” பயன்படுத்தப்பட்டுள்ளது.
- source_word: δέ
  choice: (தனியே மொழிபெயர்க்கப்படவில்லை)
  rationale: தொடர்ச்சியான கேள்விகளுக்கிடையே மென்மையான இணைப்பாக இது செயல்படுகிறது. தமிழில் தனியாக “மேலும்” அல்லது “ஆனால்” என்று சேர்ப்பது தேவையற்ற வலியுறுத்தலை உண்டாக்கும்; கேள்வித் தொடரின் இயல்பான ஓட்டமே இதன் பணியை வெளிப்படுத்துகிறது.
- source_word: εἴδομεν
  choice: நாங்கள் … கண்டு
  rationale: ὁράω என்பதன் இறந்தகாலச் செயலைத் தக்கவைத்து, தமிழில் கேள்விக்குப் பொருத்தமான இயல்பான வினையெச்ச அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἀσθενοῦντα
  choice: நீர் நோயுற்று … இருந்தபோது
  rationale: சுற்றியுள்ள சூழலில் இது உடல்நோயைக் குறிக்கிறது. “பலவீனமாக” என்பது தேவையற்ற பரந்த பொருளைக் கொடுக்கும் என்பதால் “நோயுற்று” தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: ἐν φυλακῇ
  choice: சிறையில்
  rationale: φυλακή இங்கு அடைத்து வைக்கப்படும் இடத்தைக் குறிக்கிறது. நவீன பொதுத்தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ள “சிறையில்” பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἤλθομεν πρός σε
  choice: உம்மிடம் வந்தோம்
  rationale: கிரேக்கத்தின் நேரடியான “உம்மிடம் வந்தோம்” என்ற இயக்கப் பொருளைத் தக்கவைக்கிறது. “சந்தித்தோம்” அல்லது “வந்து பார்த்தோம்” என்பது சூழலுக்கு ஏற்ற விளக்கமாக இருக்கலாம்; ஆனால் மூலத்தில் குறிப்பாக ‘பார்க்கச் செல்லுதல்’ என்ற வினை இல்லை.
theological_decisions:
- issue: ἤλθομεν πρός σε என்பதை குறிப்பான இரக்கச் செயலான ‘வந்து பார்த்தோம்/சந்தித்தோம்’ என மொழிபெயர்ப்பதா, அல்லது நேரடியாக ‘உம்மிடம் வந்தோம்’ என மொழிபெயர்ப்பதா
  choice: உம்மிடம் வந்தோம்
  alternative: உம்மைச் சந்தித்தோம்; உம்மை வந்து பார்த்தோம்
  rationale: இப்பகுதியின் சூழல் நோயாளியையும் சிறையிலிருப்பவரையும் சென்று கவனிக்கும் இரக்கச் செயலைக் குறித்தாலும், கிரேக்கச் சொற்றொடர் ஒருவரிடம் வருவதையே நேரடியாகக் கூறுகிறது. ஆகவே விளக்கப் பொருளை முதன்மை உரைக்குள் சேர்க்காமல், நேரடியான வாசகம் வைக்கப்பட்டு இயல்பான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகப் புரியும் வகையில் வாக்கியம் அமைக்கப்பட்டுள்ளது. அரசராக உரையாடப்படுகிற ஒருமை இரண்டாம் நபருக்குக் கண்ணியமான “நீர்/உம்மை/உம்மிடம்” வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. “நோயுற்றோ சிறையிலோ இருந்தபோது” என்பது கிரேக்கத்தின் இரண்டு நிலைகளையும் தெளிவாக இணைக்கிறது; எந்த நிலையிலும் வந்து அணுகியதைக் கேட்கும் வினாவின் பொருள் பாதுகாக்கப்பட்டுள்ளது.
