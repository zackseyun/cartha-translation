  text: And when did we see you sick or in prison and come to you?[a]
translation:
  language: ta
  text: நீர் நோயுற்றோ சிறையிலோ இருந்தபோது, நாங்கள் எப்போது உம்மைக் கண்டு உம்மிடம் வந்தோம்?[a]
  philosophy: optimal-equivalence
  footnotes:
