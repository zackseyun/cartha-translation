base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/003.yaml
  text: For the foolish[a], when they took their lamps, did not take oil with them.
translation:
  language: ta
  text: ஏனெனில், அறிவில்லாதவர்கள் தங்கள் விளக்குகளை எடுத்துக்கொண்டபோது, தங்களுடன் எண்ணெயை எடுத்துக்கொள்ளவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘விளக்குகள்’ என்பதற்குப் பதிலாக ‘தீப்பந்தங்கள்’ என்றும் மொழிபெயர்க்கலாம் (கிரேக்கம்: λαμπάδας).'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றிற்கான விளக்கத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: μωραὶ
  choice: அறிவில்லாதவர்கள்
  rationale: பெண்பால் பன்மை பெயரடையாகிய இது உவமையில் முன்பு குறிப்பிடப்பட்ட கன்னிப்பெண்களைச் சுட்டுகிறது; இவ்வசனத்தில் அதை மீண்டும் கூறாமல், அவர்களின் அறிவற்ற தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: λαβοῦσαι
  choice: எடுத்துக்கொண்டபோது
  rationale: முதன்மை வினைக்கு முன்பான இறந்தகாலப் பங்கேற்பு வினையின் காலத்தொடர்பை தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: λαμπάδας
  choice: விளக்குகளை
  rationale: எண்ணெய் குறிப்பிடப்படும் சூழலுக்கும் தமிழ் வேதாகம வழக்குக்கும் ஏற்ற பொதுவான மொழிபெயர்ப்பு; ‘தீப்பந்தங்கள்’ என்பதும் சாத்தியம்.
- source_word: οὐκ ἔλαβον
  choice: எடுத்துக்கொள்ளவில்லை
  rationale: λαβοῦσαι/ἔλαβον ஆகிய இரு வடிவங்களுக்கிடையிலான ‘எடுத்துக்கொண்டனர்/எடுத்துக்கொள்ளவில்லை’ என்ற சொல் ஒத்திசைவைப் பாதுகாக்கிறது.
- source_word: μεθ’ ἑαυτῶν
  choice: தங்களுடன்
  rationale: கிரேக்கத் தற்சுட்டுப் பதத்தை இயல்பான, தெளிவான தமிழில் வழங்குகிறது.
- source_word: ἔλαιον
  choice: எண்ணெயை
  rationale: விளக்குகளுக்கான எண்ணெயைக் குறிக்கும் நேரடியான பொருள்.
