id: MAT.25.21
reference: Matthew 25:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/021.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will appoint you over many things[b]. Enter into the joy of your master.’
translation:
  language: ta
  text: அவனுடைய எஜமான்[b] அவனிடம், “நன்று செய்தாய், நல்லவனும் உண்மையுள்ளவனுமான ஊழியனே![a] நீ சிலவற்றில் உண்மையுள்ளவனாக இருந்தாய்; பலவற்றின்மேல் உன்னை நியமிப்பேன். உன் எஜமானின் மகிழ்ச்சிக்குள் நுழை” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது “அடிமையே”: “நன்று செய்தாய், நல்லவனும் உண்மையுள்ளவனுமான அடிமையே!” கிரேக்கச் சொல் δοῦλος (doulos); சூழலுக்கேற்ப அது “ஊழியன்” அல்லது “அடிமை” என்று பொருள்படலாம்.'
    reason: alternative_reading
  - marker: b
    text: இங்குள்ள கிரேக்கச் சொல் κύριος (kyrios) என்பதை “ஆண்டவர்” என்றும் மொழிபெயர்க்கலாம். ஆனால் இந்த உவமையில் ஊழியனுக்கும் அவனுடைய எஜமானுக்கும் உள்ள உறவைக் குறிப்பதால் “எஜமான்” என்பது சூழலுக்கு மிகவும் பொருத்தமானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη
  choice: என்றான்
  rationale: நேர்க் கூற்றை அறிமுகப்படுத்தும் இயல்பான தமிழ் கதைநடை வடிவம்; பேசுபவர் ஆண்பால் ஒருமை என்பதையும் சூழலுக்கேற்ப வெளிப்படுத்துகிறது.
- source_word: κύριος
  choice: எஜமான்
  rationale: உவமையின் உடனடி சூழலில் இது ஊழியன்மீது அதிகாரமுள்ள எஜமானைக் குறிக்கிறது; ‘ஆண்டவர்’ என்ற இறையியல் பட்டத்தை உரையாடலுக்குள் முன்கூட்டியே புகுத்தாமல் சமூக உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: δοῦλε
  choice: ஊழியனே
  rationale: அழைப்புவேற்றுமையை இயல்பாகக் காக்கிறது; கீழ்ப்பட்டுப் பணிபுரியும் உறவைத் தெரிவிக்கிறது. மூலச்சொல்லின் வலுவான ‘அடிமை’ பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: Εὖ
  choice: நன்று செய்தாய்
  rationale: பாராட்டுச் சூத்திரமாக வரும் வினையடைச் சொல்லை நவீன தமிழில் இயல்பான முழுமையான பாராட்டாகத் தருகிறது.
- source_word: ἀγαθὲ
  choice: நல்லவனுமான
  rationale: அடிப்படையான நற்பண்பைக் குறிக்கும் நேரடியான பொருளைக் காக்கிறது.
- source_word: πιστέ / πιστός
  choice: உண்மையுள்ளவனுமான / உண்மையுள்ளவனாக
  rationale: அழைப்பிலும் பின்னர் வரும் கூற்றிலும் ஒரே சொல்வேரின் மீளுரையைத் தெளிவாகப் பாதுகாத்து, நம்பகமான விசுவாசத்தைக் குறிக்கிறது.
- source_word: ἐπὶ ὀλίγα
  choice: சிலவற்றில்
  rationale: ஒப்படைக்கப்பட்ட குறைந்த அளவிலான பொறுப்புத் துறையை இயல்பான தமிழில் குறிக்கிறது.
- source_word: καταστήσω
  choice: நியமிப்பேன்
  rationale: அதிகமான பொறுப்பின் மேல் ஒருவரை அமர்த்துதல் அல்லது பொறுப்பாளராக ஏற்படுத்துதல் என்ற எதிர்காலச் செயலைத் துல்லியமாகத் தருகிறது.
- source_word: ἐπὶ πολλῶν
  choice: பலவற்றின்மேல்
  rationale: ‘சிலவற்றில்’ என்பதற்கு இணையான எதிர்மறை ஒப்புமையைப் பாதுகாத்து, விரிவான பொறுப்பு வழங்கப்படுவதைத் தெரிவிக்கிறது.
- source_word: εἴσελθε εἰς τὴν χαρὰν
  choice: மகிழ்ச்சிக்குள் நுழை
  rationale: ‘உள்ளே நுழை’ என்ற மூல உருவகத்தைப் பாதுகாக்கிறது; வெறுமனே ‘மகிழ்ச்சியில் பங்குகொள்’ என்று விளக்கிப் பொருளைச் சுருக்கவில்லை.
theological_decisions:
- issue: உவமையின் மனித எஜமானைக் குறிக்கும் κύριος, தேவன் அல்லது கிறிஸ்துவை உருவகமாகச் சுட்டக்கூடிய இடத்தில் எவ்வாறு மொழிபெயர்க்கப்பட வேண்டும்
  choice: எஜமான்
  alternative: ஆண்டவர்
  rationale: கதையின் உடனடி நிலையில் ஊழியன்–எஜமான் உறவே வெளிப்படையாக உள்ளது. ‘எஜமான்’ அதைத் தெளிவாகக் காக்கிறது; அதேவேளை உவமையின் இறையியல் தொடர்பை வாசகர் உணர்வதற்குத் தடையிடாது, அதை வெளிப்படையான பட்டமாகவும் மாற்றாது.
- issue: இந்தச் சூழலில் δοῦλος என்பதன் சமூக நிலையை எவ்வாறு வெளிப்படுத்துவது
  choice: ஊழியன்
  alternative: அடிமை
  rationale: முதன்மை உரையில் ‘ஊழியன்’ பாராட்டுச் சூத்திரத்தோடு இயல்பாக அமைகிறது; இருப்பினும் δοῦλος என்பதில் அடிமைநிலைப் பொருள் உண்மையாக இருப்பதால் அது அடிக்குறிப்பில் வெளிப்படையாகக் கொடுக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க கதைநடையிலும் வடிவமைக்கப்பட்டது. ‘நன்று செய்தாய்’ இயல்பான பாராட்டாகவும், ‘மகிழ்ச்சிக்குள் நுழை’ மூலத்தின் உருவகத்தைப் பாதுகாக்கும் சற்றே உயர்ந்த நடையாகவும் உள்ளது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்களோடு நேரடியாக இணைக்கப்பட்டுள்ளன.
