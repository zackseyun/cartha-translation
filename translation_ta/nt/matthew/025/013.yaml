id: MAT.25.13
reference: Matthew 25:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: γρηγορεῖτε οὖν, ὅτι οὐκ οἴδατε τὴν ἡμέραν οὐδὲ τὴν ⸀ὥραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/013.yaml
  text: Therefore[a], stay awake, because you do not know the day or the hour.
translation:
  language: ta
  text: ஆகவே, விழித்திருங்கள்[a]; ஏனெனில் அந்த நாளையும் அந்த நேரத்தையும் நீங்கள் அறியவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தொடர்ந்து விழிப்புடன் இருங்கள்” அல்லது “காவலாயிருங்கள்.” கிரேக்கக் கட்டளை தொடர்ந்து நிலைக்கும் விழிப்புணர்வைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: விழித்திருங்கள்
  rationale: நிகழ்காலக் கட்டளை வடிவம் தொடர்ந்து விழித்திருப்பதையும் எச்சரிக்கையுடன் இருப்பதையும் வலியுறுத்துகிறது. உவமையின் விழிப்பு உருவகத்தைத் தமிழில் இயல்பாகத் தக்கவைக்கிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய உவமையிலிருந்து வரும் முடிவைத் தெளிவாகக் குறிக்கிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: கட்டளைக்கான காரணத்தை அறிமுகப்படுத்தும் கிரேக்கச் சொல்லின் காரணப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὐκ οἴδατε
  choice: நீங்கள் அறியவில்லை
  rationale: இரண்டாம் நபர் பன்மையில் உள்ள மறுக்கப்பட்ட அறிதல் வினையை விரிவாக்கமின்றி நேரடியாக மொழிபெயர்க்கிறது.
- source_word: τὴν ἡμέραν
  choice: அந்த நாளை
  rationale: கிரேக்கத் திட்டச் சுட்டைத் தக்கவைக்கிறது; எந்த நாளைக் குறிக்கிறது என்பதை வசனத்தில் இல்லாத விளக்கத்தால் விரிவுபடுத்தவில்லை.
- source_word: οὐδὲ τὴν ὥραν
  choice: அந்த நேரத்தையும்
  rationale: மறுப்பு வாக்கியத்தில் நாளோடு இரண்டாவது அறியப்படாத காலக் கூறை இணைக்கிறது. தமிழில் ‘அறியவில்லை’ என்பதோடு ‘நாளையும் ... நேரத்தையும்’ என்பது இரண்டையும் அறியாதிருப்பதை இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: விழிப்பைக் குறிக்கும் கட்டளை உருவகம்
  choice: விழித்திருங்கள்
  alternative: விழிப்புடன் இருங்கள்; காவலாயிருங்கள்
  rationale: காலம் அறியப்படாததால் ஆயத்தமாக இருக்க வேண்டும் என்ற அழைப்பை இது தருகிறது. ‘விழித்திருங்கள்’ என்பது உவமையின் உருவகத்தைத் தக்கவைக்கிறது; குறிப்பிட்ட இறுதிக்காலக் கோட்பாட்டை உரையில் சேர்ப்பதில்லை.
- issue: ‘அந்த நாளையும் அந்த நேரத்தையும்’ என்பதன் குறிப்பு
  choice: விளக்க விரிவாக்கமின்றி மூலத்தின் சொற்றொடரைத் தக்கவைத்தல்
  alternative: மனிதகுமாரன் வரும் நாளையும் நேரத்தையும்; குறிக்கப்பட்ட காலத்தை
  rationale: பரந்த சூழல் இறுதித் தீர்ப்பையும் மனிதகுமாரனின் வருகையையும் பற்றியதாக இருந்தாலும், இவ்வசனம் ‘நாளையும் நேரத்தையும்’ என்று மட்டுமே கூறுகிறது. ஆகவே மறைமுகமான பொருளை மொழிபெயர்ப்பில் வெளிப்படையாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘விழித்திருங்கள்’ உவமையைப் பாதுகாக்கிறது; அடிக்குறிப்பு அதன் தொடர்ச்சியான விழிப்புணர்வு பொருளையும் மாற்று மொழிபெயர்ப்புகளையும் தருகிறது.
