revisions:
- from: ஒருவனுக்கு ஐந்து தாலந்துகளையும்[a], இன்னொருவனுக்கு இரண்டையும், வேறொருவனுக்கு ஒன்றையும்—அவரவர் திறனுக்கு ஏற்ப—கொடுத்தார். பின்பு அவர் வெளியூர் சென்றார். உடனே[b]
  to: ஒருவனுக்கு ஐந்து தாலந்துகளையும், இன்னொருவனுக்கு இரண்டையும், வேறொருவனுக்கு ஒன்றையும், ஒவ்வொருவருடைய திறமைக்கு ஏற்பக் கொடுத்தார்; பின்னர் அவர் பயணமாகப் புறப்பட்டார். உடனே…
  rationale: The revision preserves all words in the supplied verse while making clear that εὐθέως continues syntactically into 25:16. It retains the historical term “தாலந்து,” improves the contextual explanation of its monetary sense, and uses idiomatic modern Tamil for the differentiated recipients and their respective capacities.
