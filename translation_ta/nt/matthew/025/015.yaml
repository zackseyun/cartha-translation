  text: καὶ ᾧ μὲν ἔδωκεν πέντε τάλαντα ᾧ δὲ δύο ᾧ δὲ ἕν, ἑκάστῳ κατὰ τὴν ἰδίαν δύναμιν, καὶ ἀπεδήμησεν. εὐθέως
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/015.yaml
  text: And to one he gave five talents[a], to another two, and to another one, to each according to his own ability[b]; and he went away immediately.
translation:
  language: ta
  text: ஒருவனுக்கு ஐந்து தாலந்துகளையும், இன்னொருவனுக்கு இரண்டையும், வேறொருவனுக்கு ஒன்றையும், ஒவ்வொருவருடைய திறமைக்கு ஏற்பக் கொடுத்தார்; பின்னர் அவர் பயணமாகப் புறப்பட்டார். உடனே…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τάλαντα
  choice: தாலந்துகள்
  rationale: இது அக்காலத்தின் மிகப் பெரிய எடை அல்லது பண மதிப்பு அலகைக் குறிக்கிறது; இயல்பாக உள்ள திறமையைக் குறிக்கவில்லை. வரலாற்றுச் சொல்லையும் உவமையின் பரிச்சயத்தையும் காக்க ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டு, பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ᾧ μὲν ... ᾧ δὲ ... ᾧ δὲ
  choice: ஒருவனுக்கு ... இன்னொருவனுக்கு ... வேறொருவனுக்கு
  rationale: வேறுபட்ட மூன்று பெறுநர்களுக்குப் பகிர்ந்தளித்ததை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ἕν
  choice: ஒன்றையும்
  rationale: முன்னருள்ள ‘தாலந்துகள்’ என்ற பெயர்ச்சொல் இங்கும் பொருந்துவது தெளிவாக இருப்பதால், கிரேக்கத்தைப் போல அது மறைமுகமாக விடப்படுகிறது.
- source_word: ἑκάστῳ κατὰ τὴν ἰδίαν δύναμιν
  choice: அவரவர் திறனுக்கு ஏற்ப
  rationale: ஒவ்வொருவரின் தனிப்பட்ட ஆற்றல் அல்லது செயல்திறனுக்கு ஏற்றவாறு என்பதைக் குறிக்கும் இயல்பான நவீனத் தமிழ்; இங்கு δύναμις அற்புத வல்லமையைக் குறிக்கவில்லை.
- source_word: ἀπεδήμησεν
  choice: அவர் வெளியூர் சென்றார்
  rationale: சொந்த இடத்தைவிட்டு வேறிடத்திற்குப் பயணம் சென்றார் என்ற வினையின் பயண நுணுக்கத்தைச் சுருக்கமாகக் காக்கிறது.
- source_word: εὐθέως
  choice: உடனே
  rationale: ‘உடனடியாக’ என்ற கால நுணுக்கத்தைத் துல்லியமாகக் காக்கிறது. கிரேக்கச் சொல் வரிசையிலும் கொடுக்கப்பட்ட பதிப்பின் நிறுத்தக்குறியிலும் இது அடுத்த செயலோடு இணையக்கூடியதால், தனியே வைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: τάλαντα என்பதன் பொருள்
  choice: பணம்/எடைக்கான பெரிய அலகான ‘தாலந்து’
  alternative: இயல்பான திறமை
  rationale: உவமையின் உடனடிச் சூழல் ஒப்படைக்கப்பட்ட செல்வத்தைப் பற்றியது; நவீன மொழியில் ‘திறமை’ எனப் புரிந்துகொள்ளும்படி மொழிபெயர்ப்பது மூலப் பொருளை மாற்றிவிடும்.
- issue: κατὰ τὴν ἰδίαν δύναμιν என்பதிலுள்ள பகிர்வுசார் ஒருமை
  choice: அவரவர் திறனுக்கு ஏற்ப
  alternative: ஒவ்வொருவனுடைய சொந்தத் திறனுக்கு ஏற்ப
  rationale: கிரேக்கத்தின் ஒருமை மற்றும் பகிர்வுசார் பொருளைத் தமிழின் இயல்பான ‘அவரவர்’ அமைப்பு காக்கிறது; தேவையற்ற பாலின வலியுறுத்தலையும் தவிர்க்கிறது.
- issue: εὐθέως எந்தச் செயலுடன் இணைகிறது
  choice: அடுத்த வாக்கியத்தைத் தொடங்கும் சொல்லாகத் தனியே வைத்தல்
  alternative: ‘அவர் உடனே வெளியூர் சென்றார்’ என்று முந்தைய வினையுடன் இணைத்தல்
  rationale: கொடுக்கப்பட்ட SBLGNT உரையில் ἀπεδήμησεν என்பதற்குப் பின் முற்றுப்புள்ளி உள்ளது; மேலும் εὐθέως அடுத்த வசனத்தின் πορευθεὶς என்பதோடு இயல்பாக இணையலாம். வசனத் துண்டில் சொல் விடுபடாமல் இருக்க அது இங்கே வைக்கப்பட்டு, தொடரமைப்பின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: மொழிநடை நவீனமானதும் கண்ணியமானதும் ஆகும். ‘ஒருவன்… இன்னொருவன்… வேறொருவன்’ பகிர்வைத் தெளிவாக்குகிறது; ‘அவரவர் திறனுக்கு ஏற்ப’ பொதுவாசகருக்கு இயல்பாக உள்ளது. εὐθέως குறித்த மூலத் தொடரமைப்பின் நிச்சயமின்மையைத் தீர்த்துவிடாமல், பிரதான உரையும் அடிக்குறிப்பும் சேர்ந்து பாதுகாக்கின்றன.
