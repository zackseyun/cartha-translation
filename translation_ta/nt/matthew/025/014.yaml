id: MAT.25.14
reference: Matthew 25:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὥσπερ γὰρ ἄνθρωπος ἀποδημῶν ἐκάλεσεν τοὺς ἰδίους δούλους καὶ παρέδωκεν αὐτοῖς τὰ ὑπάρχοντα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/014.yaml
  text: For it is like a man going on a journey[a], who called his own servants and entrusted his possessions to them.
translation:
  language: ta
  text: ஏனெனில், இது பயணம் புறப்படவிருந்த ஒரு மனிதன் தன் அடிமைகளை[a] அழைத்து, தன் உடைமைகளை அவர்களிடம் ஒப்படைத்தது போன்றது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பணியாளர்களை.” கிரேக்கச் சொல்லான தூலோஸ், சூழலுக்கேற்ப பணியாளரையோ அடிமையையோ குறிக்கலாம்; இங்கு எஜமானரின் உரிமையும் அதிகாரமும் முன்னிலைப்படுவதால் “அடிமைகள்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὥσπερ γὰρ
  choice: ஏனெனில், இது ... போன்றது
  rationale: γὰρ முந்தைய கூற்றை விளக்குகிறது; ὥσπερ தொடங்கும் ஒப்புமை கிரேக்கத்தில் சுருக்கமாக இருப்பதால், தமிழில் முழுமையான இயல்பான வாக்கியமாக அமைய ‘இது’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἄνθρωπος
  choice: ஒரு மனிதர்
  rationale: உவமையில் வரும் குறிப்பிட்ட ஆண் நபரைச் சுட்டுகிறது; நவீன மரியாதைமிக்க தமிழில் இயல்பாக உள்ளது.
- source_word: ἀποδημῶν
  choice: பயணம் செல்லவிருந்த
  rationale: வேறோர் இடத்துக்குப் புறப்படுதலைக் குறிக்கிறது. அடிமைகளை அழைத்து உடைமைகளை ஒப்படைத்தது புறப்படுவதற்கு முன் நடந்ததாகத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ‘வெளிநாடு’ என்று தேவையின்றி குறிப்பாக்கவில்லை.
- source_word: ἐκάλεσεν
  choice: அழைத்து
  rationale: அவர்களைத் தம்மிடம் அழைத்தார் என்ற நேரடியான பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: τοὺς ἰδίους δούλους
  choice: தமக்குச் சொந்தமான அடிமைகளை
  rationale: ἰδίους உரிமை/தனிப்பட்ட உறவை வலியுறுத்துகிறது. δοῦλος இச்சூழலில் எஜமானரின் உரிமைக்கும் அதிகாரத்திற்கும் உட்பட்டவர்களைக் குறிப்பதால் ‘அடிமைகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: παρέδωκεν
  choice: ஒப்படைத்தது
  rationale: உடைமைகளை நிர்வகிக்கும் பொறுப்புடன் அவர்களிடம் கொடுத்ததை சூழலில் தெளிவாகக் குறிக்கிறது.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: தமது உடைமைகளை
  rationale: அந்த மனிதருக்குச் சொந்தமான பொருட்கள் அல்லது சொத்துகள் அனைத்தையும் குறிக்கும் தெளிவான, பரந்த தமிழ்ச் சொற்றொடர்.
theological_decisions:
- issue: உவமையின் வீட்டுச் சூழலில் δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: அடிமைகள்
  alternative: பணியாளர்கள்
  rationale: இந்த உவமையில் எஜமானரின் உரிமையும் அதிகாரமும் முன்னிலைப்படுவதால், பழங்காலச் சமூக உறவை மென்மையாக்காமல் ‘அடிமைகள்’ என மொழிபெயர்க்கப்பட்டது. அதே நேரத்தில் சூழல்படி ‘பணியாளர்கள்’ என்றும் புரிந்துகொள்ள முடியும் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் மரியாதைமிக்க நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்க ஒப்புமையின் சுருக்கமான அமைப்பைத் தமிழில் முழுமையாக்க ‘இது ... போன்றது’ பயன்படுத்தப்பட்டுள்ளது; சமூக வரலாற்றை மறைக்காத வகையில் δοῦλος ‘அடிமைகள்’ என வைக்கப்பட்டுள்ளது.
