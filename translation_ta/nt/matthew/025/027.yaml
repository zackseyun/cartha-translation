source:
  edition: SBLGNT
  text: ἔδει ⸂σε οὖν⸃ βαλεῖν ⸂τὰ ἀργύριά⸃ μου τοῖς τραπεζίταις, καὶ ἐλθὼν ἐγὼ ἐκομισάμην ἂν τὸ ἐμὸν σὺν τόκῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/027.yaml
  text: Therefore[a], you should have deposited my money with the bankers, and when I came, I would have received what was mine with interest.
translation:
  language: ta
  text: ஆகவே, நீ என் பணத்தை வங்கியாளர்களிடம் வைப்பாக இட்டிருக்க வேண்டியதாயிருந்தது; நான் வந்தபோது, என்னுடையதை வட்டியுடன் பெற்றிருப்பேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் வெள்ளியை வங்கியாளர்களிடம் வைத்திருக்க வேண்டியதாயிருந்தது.’
    reason: ἀργύρια என்பது சூழலுக்கு ஏற்ப ‘பணம்’ அல்லது ‘வெள்ளி’ எனப் பொருள்படும்; முதன்மை உரையில் நிதிச் சூழலுக்கு ஏற்ற ‘பணம்’ பயன்படுத்தப்பட்டுள்ளது.
lexical_decisions:
- source_word: ἔδει
  choice: இட்டிருக்க வேண்டும்
  rationale: கடந்த காலத்தில் செய்ய வேண்டியிருந்த கடமையையும், அதைச் செய்யாததற்கான கண்டனத்தையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய குற்றச்சாட்டிலிருந்து எடுக்கப்படும் முடிவைத் தெளிவாகக் குறிக்கிறது.
- source_word: βαλεῖν
  choice: வைப்பில் இட்டிருக்க
  rationale: βάλλω என்பதன் அடிப்படைப் பொருள் ‘இடு’ என்றாலும், வங்கியாளர்களும் வட்டியும் குறிப்பிடப்படும் இந்நிதிச் சூழலில் பணத்தை வைப்பாக ஒப்படைப்பதே பொருள்.
- source_word: τὰ ἀργύριά μου
  choice: என் பணத்தை
  rationale: ἀργύριον என்பது வெள்ளியையோ பணத்தையோ குறிக்கலாம்; இவ்வணிகச் சூழலில் ‘பணம்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: τραπεζίταις
  choice: வங்கியாளர்களிடம்
  rationale: τραπεζίτης பணப் பரிமாற்றம் அல்லது வங்கித் தொழிலில் ஈடுபடுபவரைக் குறிக்கிறது; வட்டி பெறும் சூழல் ‘வங்கியாளர்கள்’ என்ற தெரிவை ஆதரிக்கிறது.
- source_word: ἐλθὼν ἐγὼ
  choice: நான் திரும்பி வந்தபோது
  rationale: பங்கேற்புவினையின் காலத் தொடர்பை இயல்பாகக் காட்டுகிறது; உவமையின் சூழலில் எஜமானன் திரும்பிவருவதையும் தெளிவுபடுத்துகிறது.
- source_word: ἐκομισάμην ἂν
  choice: பெற்றிருப்பேன்
  rationale: ἄν உடன் வரும் இவ்வடிவம் நிகழாத நிபந்தனையின் விளைவைக் காட்டுகிறது; நடந்திருக்கும் பெறுதலைத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: τὸ ἐμὸν
  choice: எனக்குரியதை
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட உடைமைச் சொல்லின் வலியுறுத்தலைச் சுருக்கமாகவும் தெளிவாகவும் காக்கிறது.
- source_word: σὺν τόκῳ
  choice: வட்டியுடன்
  rationale: τόκος இங்கு பணத்தின் மீதான வட்டியைக் குறிக்கிறது; ‘கந்துவட்டி’ போன்ற சொற்கள் மூலத்தில் இல்லாத சுரண்டல் சார்ந்த மதிப்பீட்டைச் சேர்த்துவிடும்.
theological_decisions:
- issue: உவமையில் வரும் வட்டி மொழிக்கு ஒழுக்க அல்லது கோட்பாட்டு மதிப்பீடு சேர்த்தல்
  choice: நிதிசார் சொற்களை உவமையின் சாதாரண பொருளாதாரப் படிமமாக நடுநிலையாக மொழிபெயர்த்தல்
  alternative: ‘கந்துவட்டி’ போன்ற எதிர்மறைச் சொல்லைப் பயன்படுத்தி வட்டி வாங்குதலைக் கண்டிக்கும் தொனியைச் சேர்த்தல்
  rationale: இவ்வசனம் உவமையின் நிகழ்வுக்குள் வைப்பும் வட்டியும் பற்றிப் பேசுகிறது; எல்லா வகையான வட்டி வாங்குதலையும் ஆதரிப்பதாகவோ கண்டிப்பதாகவோ தனியே போதிக்கவில்லை.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் கண்ணியமான தொனியிலும் அமைக்கப்பட்டது. ‘அப்படிச் செய்திருந்தால்’ என்பது கிரேக்கத்தில் உள்ள நிகழாத நிபந்தனை விளைவை தமிழில் வெளிப்படையாகவும் இயல்பாகவும் இணைக்கிறது. அடிக்குறிப்பு தேவையில்லை; ‘பணம்’ என்ற தெரிவு சூழலில் தெளிவானது.
