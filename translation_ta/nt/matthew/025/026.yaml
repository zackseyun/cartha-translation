source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ κύριος αὐτοῦ εἶπεν αὐτῷ· Πονηρὲ δοῦλε καὶ ὀκνηρέ, ᾔδεις ὅτι θερίζω ὅπου οὐκ ἔσπειρα καὶ συνάγω ὅθεν οὐ διεσκόρπισα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/026.yaml
  text: But his master answered and said to him[a], ‘Wicked and lazy servant[b], you knew that I reap where I did not sow and gather where I did not scatter?
translation:
  language: ta
  text: அதற்கு அவனுடைய எஜமான் அவனிடம், “பொல்லாத, சோம்பேறியான அடிமையே[a], நான் விதைக்காத இடத்தில் அறுவடை செய்கிறேன் என்றும், நான் சிதறவிடாத எங்கிருந்து சேர்த்துக்கொள்கிறேன் என்றும் உனக்குத் தெரிந்திருந்ததா?[b]” என்று பதிலளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பொல்லாத, சோம்பேறியான வேலைக்காரனே.” கிரேக்கச் சொல் இச்சூழலில் ‘அடிமை’ அல்லது ‘வேலைக்காரன்’ என்று மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'இதை ஒரு கூற்றாகவும் வாசிக்கலாம்: “நான் விதைக்காத இடத்தில் அறுவடை செய்கிறேன் என்றும், நான் சிதறவிடாத எங்கிருந்து சேர்த்துக்கொள்கிறேன் என்றும் உனக்குத் தெரிந்திருந்தது.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: அதற்கு ... பதிலளித்தார்
  rationale: இது வழக்கமான கதைநடைப் பதிலுரை அமைப்பு. δέ குறிக்கும் மென்மையான திருப்பத்தையும் ἀποκριθείς குறிக்கும் பதிலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὁ κύριος αὐτοῦ
  choice: அவனுடைய எஜமான்
  rationale: உவமையின் எஜமான்–அடிமை சமூக உறவை இங்கு κύριος குறிக்கிறது; நேரடியான கிறிஸ்தவப் பட்டப்பெயராக அல்ல. ‘எஜமான்’ அந்த உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: Πονηρὲ
  choice: பொல்லாதவனும்
  rationale: இங்கு இது தரக்குறைவை அல்ல, ஒழுக்கரீதியான கண்டனத்தைக் குறிக்கிறது. ‘பொல்லாதவன்’ அந்த வலிமையைத் தக்கவைக்கிறது.
- source_word: δοῦλε
  choice: அடிமையே
  rationale: δοῦλος என்பது இச்சூழலில் எஜமானுக்குக் கீழ்ப்பட்ட அடிமை நிலையைக் குறிக்கிறது. ‘அடிமை’ சமூக உறவை மறைக்காமல் நேரடியாக மொழிபெயர்க்கிறது; ‘வேலைக்காரன்’ என்பது மென்மையான சூழல்சார் மாற்றாக இருக்கலாம்.
- source_word: ὀκνηρέ
  choice: சோம்பேறியுமான
  rationale: செயல்படத் தயங்கும் அல்லது சோம்பலான பண்பைத் தெளிவான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ᾔδεις
  choice: உனக்குத் தெரிந்திருந்ததா?
  rationale: οἶδα என்பதன் கடந்தகால அறிவைத் தமிழில் இயல்பாகக் காட்டுகிறது. வினாக்குறியுடன் சேர்ந்து எஜமான் பணியாளனின் சொந்தக் கூற்றை அவனுக்கு எதிராகத் திருப்பிக் கேட்பதை வெளிப்படுத்துகிறது.
- source_word: ὅτι
  choice: என்றும் ... என்றும்
  rationale: அறிந்திருந்ததன் உள்ளடக்கத்தைத் தமிழில் இயல்பான மேற்கோள் சார்ந்த அமைப்பில் அறிமுகப்படுத்துகிறது; காரணப் பொருளாக மாற்றவில்லை.
- source_word: θερίζω
  choice: அறுவடை செய்கிறேன்
  rationale: விதைத்தல்–அறுவடை செய்தல் என்ற வேளாண் உருவகத்தைத் தெளிவாகக் காக்கிறது.
- source_word: ὅπου οὐκ ἔσπειρα
  choice: நான் விதைக்காத இடத்தில்
  rationale: உறவுப்பிரிவை சுருக்கமாகவும் இயல்பாகவும் மொழிபெயர்த்து, செயலைக் கடந்தகாலத் தொடர்புடைய பெயரெச்ச வடிவில் தருகிறது.
- source_word: συνάγω
  choice: சேர்த்துக்கொள்கிறேன்
  rationale: பயிர் அல்லது விளைவைத் திரட்டிக் கொள்வதைக் குறிக்கும் இயல்பான தமிழ்; செய்பவருக்கான பெறுபேற்றையும் வெளிப்படுத்துகிறது.
- source_word: ὅθεν οὐ διεσκόρπισα
  choice: நான் சிதறவிடாத இடத்திலிருந்து
  rationale: ὅθεν என்பதன் ‘எங்கிருந்து’ பொருளையும் διασκορπίζω என்பதன் ‘சிதறவிடு’ பொருளையும் காக்கிறது. மூலத்தில் இல்லாத ‘விதை’ என்ற செயப்படுபொருளைச் சேர்க்காமல் உண்மையான சுருக்கத்தையும் சாத்தியமான வேளாண் குறிப்பையும் அப்படியே விடுகிறது.
theological_decisions:
- issue: இறுதிக் கூற்றின் வாக்கிய வலிமையும் நிறுத்தக்குறியும்
  choice: எஜமானின் சொற்களை வினாவடிவில் முடியும் சொல்லாட்சிக் கேள்வியாக மொழிபெயர்த்தல்
  alternative: “நான் விதைக்காத இடத்தில் அறுவடை செய்கிறேன் என்றும், நான் சிதறவிடாத இடத்திலிருந்து சேர்த்துக்கொள்கிறேன் என்றும் உனக்குத் தெரிந்திருந்தது.” என்று கூற்றாக மொழிபெயர்த்தல்
  rationale: கிரேக்க வடிவம் கூற்றாகவோ சொல்லாட்சிக் கேள்வியாகவோ வாசிக்கப்படலாம். முந்தைய வசனத்தில் அடிமை கூறிய காரணத்தை எஜமான் அவனுக்கு எதிராகத் திருப்பும் வாதநடைக்கு வினாவடிவு பொருந்துகிறது; எனினும் மாற்று வாசிப்பை அடிக்குறிப்பில் காக்க வேண்டும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘எஜமான்’, ‘அடிமை’ ஆகியவை உவமையின் வரலாற்றுச் சமூக உறவைத் தெளிவாகக் காக்கின்றன. ‘சிதறவிடாத’ என்பதில் மூலத்தில் வெளிப்படையாக இல்லாத ‘விதை’ சேர்க்கப்படவில்லை; இதனால் மூலத்தின் சுருக்கமும் சிறு தெளிவின்மையும் பாதுகாக்கப்படுகின்றன.
