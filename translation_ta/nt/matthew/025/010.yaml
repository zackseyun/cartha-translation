id: MAT.25.10
reference: Matthew 25:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀπερχομένων δὲ αὐτῶν ἀγοράσαι ἦλθεν ὁ νυμφίος, καὶ αἱ ἕτοιμοι εἰσῆλθον μετ’ αὐτοῦ εἰς τοὺς γάμους, καὶ ἐκλείσθη ἡ θύρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/010.yaml
  text: But while they were going away to buy[a], the bridegroom came, and those who were ready went in with him to the wedding feast, and the door was shut.
translation:
  language: ta
  text: அவர்கள் வாங்குவதற்காகப் போய்க்கொண்டிருந்தபோது, மணமகன் வந்தார். ஆயத்தமாக இருந்தவர்கள் அவருடன் திருமண விருந்துக்குள் நுழைந்தார்கள்[a]; கதவு அடைக்கப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘திருமணக் கொண்டாட்டத்துக்கு’ அல்லது வெறுமனே ‘திருமணத்துக்கு.’ கிரேக்கப் பன்மை வடிவம் திருமணக் கொண்டாட்டம் முழுவதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπερχομένων δὲ αὐτῶν ἀγοράσαι
  choice: அவர்கள் வாங்குவதற்காகப் போய்க்கொண்டிருந்தபோது
  rationale: மரபுத்தொடரின் ஒரே நேரத்தில் நிகழும் செயலை ‘போய்க்கொண்டிருந்தபோது’ இயல்பாக வெளிப்படுத்துகிறது; இறந்தகால வினையெச்சம் வாங்குவதன் நோக்கத்தைக் காட்டுகிறது. முந்தைய வசனத்திலிருந்து எண்ணெய் என்பது புரிந்தாலும், மூலத்தில் இங்கு செயப்படுபொருள் இல்லாததால் அது சேர்க்கப்படவில்லை.
- source_word: ὁ νυμφίος
  choice: மணமகன்
  rationale: திருமணச் சூழலில் νυμφίος என்பதற்கான துல்லியமான, இயல்பான நவீனத் தமிழ் சொல்; உவமையின் படிமத்தையும் காக்கிறது.
- source_word: αἱ ἕτοιμοι
  choice: ஆயத்தமாக இருந்தவர்கள்
  rationale: பெண்பால் பன்மை பெயரடை இங்கு முன்னர் குறிப்பிடப்பட்ட கன்னிப்பெண்களைக் குறிக்கும் பெயர்ச்சொல்லாகப் பயன்படுகிறது. தமிழில் பாலினத்தை மீண்டும் வெளிப்படையாகச் சேர்க்காமல் குறிப்பை இயல்பாகத் தக்கவைக்கிறது.
- source_word: εἰσῆλθον μετ’ αὐτοῦ
  choice: அவருடன் ... சென்றார்கள்
  rationale: உள்ளே நுழையும் கதைநகர்வை ‘விருந்துக்குள் சென்றார்கள்’ என இயல்பாகக் காட்டுகிறது; μετ’ αὐτοῦ என்பதையும் ‘அவருடன்’ எனத் தெளிவாகக் காக்கிறது.
- source_word: εἰς τοὺς γάμους
  choice: திருமண விருந்துக்குள்
  rationale: γάμοι என்ற கிரேக்கப் பன்மை வடிவம் இச்சூழலில் திருமணக் கொண்டாட்டம் அல்லது விருந்தைக் குறிக்கிறது. தமிழில் ‘திருமண விருந்து’ காட்சியின் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: ἐκλείσθη ἡ θύρα
  choice: கதவு அடைக்கப்பட்டது
  rationale: இறந்தகாலச் செயப்பாட்டு வடிவத்தையும் காட்சியின் இறுதியான தன்மையையும் சுருக்கமாகப் பாதுகாக்கிறது; கதவை அடைத்தவர் யார் என்று மூலமும் குறிப்பிடாததால் தமிழிலும் குறிப்பிடப்படவில்லை.
theological_decisions:
- issue: உவமையிலுள்ள திருமணப் படிமத்தை மொழிபெயர்த்தல்
  choice: ‘மணமகன்’, ‘திருமண விருந்து’ என்ற சாதாரண கதைப் படிமங்களையே தக்கவைத்தல்
  alternative: மணமகனை வெளிப்படையாகக் கிறிஸ்துவுடன் அடையாளப்படுத்தும் விளக்கத்தை மொழிபெயர்ப்பில் சேர்த்தல்
  rationale: உவமையின் கிறிஸ்தியல் பொருள் சூழலிலிருந்து வெளிப்பட வேண்டும்; மூலத்தில் சொல்லப்படாத இறையியல் அடையாளத்தை மொழிபெயர்ப்புக்குள் சேர்க்கக் கூடாது.
- issue: கதவு அடைக்கப்பட்டதன் செயற்பாட்டாளர்
  choice: செயப்பாட்டு வடிவத்தைத் தக்கவைத்து செயற்பாட்டாளரைச் சொல்லாமல் விடுதல்
  alternative: ‘அவர் கதவை அடைத்தார்’ அல்லது ‘தேவன் கதவை அடைத்தார்’ என்று செயற்பாட்டாளரைச் சேர்த்தல்
  rationale: ἐκλείσθη என்பது செயப்பாட்டு வினை; கதவை அடைத்தவர் யார் என்பதை வசனம் வெளிப்படையாகக் கூறவில்லை. அதன் திட்டமிட்ட தெளிவின்மையை மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆயத்தமாக’ என்பது வேதாகமச் சூழலுக்கு ஏற்றதாயிருந்தாலும் பொதுவாகப் புரியக்கூடியது. ‘மணமகன் வந்தார்’ என மரியாதைப் பன்மை வினை பயன்படுத்தப்பட்டுள்ளது; இதனால் மூலத்தில் இல்லாத வெளிப்படையான கிறிஸ்தியல் அடையாளம் சேர்க்கப்படவில்லை. ஆங்கில ஆலோசனை உரையில் [a] குறி ‘buy’ என்பதற்குப் பின் இருந்தாலும், அதன் அடிக்குறிப்பு γάμοι பற்றியது என்பதால் தமிழில் தொடர்புடைய ‘திருமண விருந்துக்குள்’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
