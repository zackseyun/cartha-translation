source:
  edition: SBLGNT
  text: ἐπείνασα γὰρ καὶ ἐδώκατέ μοι φαγεῖν, ἐδίψησα καὶ ἐποτίσατέ με, ξένος ἤμην καὶ συνηγάγετέ με,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/035.yaml
  text: For I was hungry and you gave me something to eat[a]; I was thirsty and you gave me something to drink; I was a stranger and you welcomed me,
translation:
  language: ta
  text: ஏனெனில், நான் பசியாயிருந்தேன்; நீங்கள் எனக்கு உண்ணக் கொடுத்தீர்கள். நான் தாகமாயிருந்தேன்; நீங்கள் எனக்குக் குடிக்கக் கொடுத்தீர்கள். நான் அந்நியனாயிருந்தேன்; நீங்கள் என்னை வரவேற்றீர்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னைச் சேர்த்துக்கொண்டீர்கள்.” கிரேக்க வினைச்சொல்லின் அடிப்படைப் பொருள் “ஒன்றுசேர்த்தல்”; இங்கு அது அந்நியரை விருந்தோம்பலுடன் ஏற்றுக்கொள்வதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπείνασα
  choice: நான் பசியாயிருந்தேன்
  rationale: இறந்தகாலத்தில் அனுபவித்த பசி நிலையைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் காரணவிளக்கத் தன்மையைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐδώκατέ μοι φαγεῖν
  choice: நீங்கள் எனக்கு உண்ணக் கொடுத்தீர்கள்
  rationale: δίδωμι + வேற்றுமை உருபு + வினையெச்சக் கட்டமைப்பை இயல்பான தமிழில் வெளிப்படுத்தி, உணவளித்த செயலைப் பாதுகாக்கிறது.
- source_word: ἐδίψησα
  choice: நான் தாகமாயிருந்தேன்
  rationale: தாகத்தை அனுபவித்த கடந்தகால நிலையைக் குறிக்கும் தெளிவான, இயல்பான தமிழ்.
- source_word: ἐποτίσατέ με
  choice: நீங்கள் எனக்குக் குடிக்கக் கொடுத்தீர்கள்
  rationale: இச்சூழலில் ποτίζω என்பது குடிக்கச் செய்தல் என்பதைவிட பானம் அளித்தல் என்ற இரக்கச் செயலைக் குறிக்கிறது; குறிப்பாகத் தண்ணீர் என்று மூலத்தில் இல்லாததைச் சேர்க்கவில்லை.
- source_word: ξένος
  choice: அந்நியனாயிருந்தேன்
  rationale: அறிமுகமும் வழக்கமான சமூகச் சார்பும் தங்குமிட ஆதரவும் இல்லாத ஒருவரைக் குறிக்கும் சொல்லின் பரப்பை வைத்திருக்கிறது; நவீன சட்ட அல்லது அரசியல் வகைப்பாடுகளைப் புகுத்தவில்லை.
- source_word: συνηγάγετέ με
  choice: நீங்கள் என்னை ஏற்றுக்கொண்டீர்கள்
  rationale: συνάγω என்பதன் அடிப்படைப் பொருள் ‘ஒன்றுசேர்த்தல்’ என்றாலும், ξένος உடன் இச்சூழலில் அது விருந்தோம்பலுடன் ஒருவரை ஏற்றுக்கொள்வதைக் குறிக்கிறது. தமிழ் வாசகத்தில் இயல்பாக அந்த உறவுசார் வரவேற்பை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ξένος ... συνηγάγετέ με என்பதில் விருந்தோம்பலின் பொருள்
  choice: “நான் அந்நியனாயிருந்தேன்; நீங்கள் என்னை ஏற்றுக்கொண்டீர்கள்” என்று தனிப்பட்ட, இரக்கமுள்ள வரவேற்பாக மொழிபெயர்த்தல்.
  alternative: “நான் அந்நியனாயிருந்தேன்; நீங்கள் என்னைச் சேர்த்துக்கொண்டீர்கள்.”
  rationale: இக்கூற்று இனத்தையோ சட்ட நிலையையோ வரையறுப்பதைவிட ஆதரவற்ற அந்நியரை ஏற்றுக்கொள்ளும் இரக்கத்தை வலியுறுத்துகிறது. அதே நேரத்தில், வீட்டுக்குள் என்று மூலத்தில் வெளிப்படையாக இல்லாத இடத்தைக் கூறாமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இணையான மூன்று கூறுகளின் ஓசையும் அமைப்பும் பாதுகாக்கப்பட்டுள்ளன; ‘உண்ண’ என்பது மரியாதையானதாய் இருந்தாலும் பொதுவாகப் புரியும் சொல். அடிக்குறிப்பு குறி அது விளக்கும் ‘ஏற்றுக்கொண்டீர்கள்’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
