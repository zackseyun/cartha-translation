  text: καὶ ἀπελεύσονται οὗτοι εἰς κόλασιν αἰώνιον, οἱ δὲ δίκαιοι εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/046.yaml
  text: And these will go away into eternal punishment[a], but the righteous into eternal life.
translation:
  language: ta
  text: இவர்கள் நித்திய தண்டனைக்குள் செல்வார்கள்[a]; நீதிமான்களோ நித்திய வாழ்வுக்குள் செல்வார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யுககால தண்டனை” … “யுககால வாழ்வு.” αἰώνιος என்ற கிரேக்கப் பெயரடையின் பொருள் சில சூழல்களில் விவாதிக்கப்படுகிறது. இங்கு அதே சொல் “தண்டனை,” “வாழ்வு” ஆகிய இரண்டையும் வரையறுப்பதால், இரு கூறுகளின் இணை அமைப்பைப் பாதுகாக்க முதன்மை உரையில் இரு இடங்களிலும் “நித்திய” என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελεύσονται
  choice: செல்வார்கள்
  rationale: ἀπέρχομαι என்பதன் எதிர்கால வடிவம் இங்கிருந்து அகன்று ஒரு முடிவை நோக்கிச் செல்வதைக் குறிக்கிறது. தமிழில் இயல்பாகவும் சுருக்கமாகவும் ‘செல்வார்கள்’ என்று மொழிபெயர்க்கப்படுகிறது; இரண்டாம் கூறிலும் சூழலால் புரியும் வினைச்சொல் தெளிவுக்காக மீண்டும் வழங்கப்பட்டுள்ளது.
- source_word: οὗτοι
  choice: இவர்கள்
  rationale: முன்னர் விவரிக்கப்பட்ட குழுவைச் சுட்டுகிறது. ‘இவர்கள்’ என்பது தமிழில் இயல்பான சுட்டுப்பெயராக இருந்து, ‘நீதிமான்களோ’ என்ற எதிர்மறை ஒப்புமையைத் தெளிவாக வைத்திருக்கிறது.
- source_word: κόλασιν
  choice: தண்டனை
  rationale: இறுதித் தீர்ப்பின் இச்சூழலில் κόλασις தண்டனைக்குரிய விளைவைக் குறிக்கிறது. திருத்துதல் என்ற பொருளைத் தேவையின்றி சேர்க்காமல், ‘தண்டனை’ நேரடியான சமமான சொல்லாக உள்ளது.
- source_word: αἰώνιον
  choice: நித்திய
  rationale: ஒரே பெயரடை ‘தண்டனை’ மற்றும் ‘வாழ்வு’ ஆகிய இரண்டையும் இணையாக வரையறுக்கிறது. அந்த இணை அமைப்பை ஒரே சொல்லால் பாதுகாக்க ‘நித்திய’ இரு இடங்களிலும் பயன்படுத்தப்பட்டுள்ளது; ‘யுககால’ என்ற சாத்தியமான மாற்று அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: δίκαιοι
  choice: நீதிமான்கள்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் δίκαιοι, நீதியுள்ளவர்கள் அல்லது நீதிமான்களாகக் கருதப்படுவோரைக் குறிக்கிறது. ‘நீதிமான்கள்’ நவீனத் தமிழில் புரியக்கூடியதும் வேதாகமப் பதிவுக்கேற்ற கண்ணியமுடையதுமாகும்.
- source_word: ζωὴν
  choice: வாழ்வு
  rationale: ζωή என்பதற்கான இயல்பான தமிழ் இணை ‘வாழ்வு.’ இங்கு பொருளை விரிவாக்க வேண்டிய சூழல் காரணம் இல்லை.
- source_word: δὲ
  choice: -ஓ
  rationale: οἱ δὲ δίκαιοι என்ற முரண்பாட்டை தமிழில் ‘நீதிமான்களோ’ எனும் எதிர்மறைத் தலைப்புத் தொடரால் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: κόλασιν αἰώνιον மற்றும் ζωὴν αἰώνιον ஆகிய இணைச் சொற்றொடர்களில் αἰώνιον என்பதன் மொழிபெயர்ப்பு
  choice: இரு கூறுகளிலும் ‘நித்திய’ என்று மொழிபெயர்த்தல்
  alternative: இரு கூறுகளிலும் ‘யுககால’ அல்லது ‘யுகத்துக்குரிய’ என்று மொழிபெயர்த்தல்
  rationale: கிரேக்கத்தில் ஒரே பெயரடை தண்டனையையும் வாழ்வையும் இணையாக வரையறுப்பதால், அவற்றின் காலநீளம் அல்லது இயல்பை மொழிபெயர்ப்பிலேயே வேறுபடுத்தாமல் ஒரே தமிழ் சொல்லைப் பயன்படுத்துவது அவசியம். ‘நித்திய’ இச்சூழலில் இயல்பான முதன்மைத் தேர்வு; விவாதிக்கப்படும் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கச் சொல்வரிசையை இயந்திரமாகப் பின்பற்றாமல், ‘நீதிமான்களோ’ மூலம் முரண்பாடு இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது. இரண்டாம் கூறில் கிரேக்கத்தில் விடுபட்டுள்ள வினைச்சொல் தமிழில் தெளிவுக்காக மீண்டும் வழங்கப்பட்டுள்ளது.
