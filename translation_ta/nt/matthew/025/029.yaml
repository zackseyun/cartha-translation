id: MAT.25.29
reference: Matthew 25:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τῷ γὰρ ἔχοντι παντὶ δοθήσεται καὶ περισσευθήσεται· ⸂τοῦ δὲ⸃ μὴ ἔχοντος καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/029.yaml
  text: For to everyone who has[a], more will be given, and he will have an abundance; but from the one who does not have, even what he has will be taken away from him.
translation:
  language: ta
  text: ஏனெனில், வைத்திருக்கும் ஒவ்வொருவருக்கும் கொடுக்கப்படும்; அவருக்கு மிகுதி உண்டாகும்.[a] ஆனால் வைத்திராதவரிடமிருந்து, அவரிடம் இருப்பதுகூட எடுத்துக்கொள்ளப்படும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் மிகுதியடைவார்.”
    reason: περισσευθήσεται என்பதன் மாற்று நேரடியான வெளிப்பாடு; அது நபர் மிகுதியாக இருப்பார் அல்லது மிகுதியை அடைவார் என்ற கருத்தைத் தருகிறது.
lexical_decisions:
- source_word: τῷ ... ἔχοντι παντί
  choice: வைத்திருக்கும் ஒவ்வொருவருக்கும்
  rationale: இறந்தகாலமற்ற பெயரெச்சத் தொடரின் பொதுவான, பகிர்ந்தளிக்கும் ஒருமை வலிமையை இயல்பான தமிழில் காக்கிறது; எது வைத்திருக்கப்படுகிறது என்பதை மூலத்தைப் போலவே வெளிப்படையாகச் சொல்லாமல் விடுகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்க ஆதாரத்தை அறிமுகப்படுத்தும் இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: δοθήσεται
  choice: கொடுக்கப்படும்
  rationale: δίδωμι என்பதன் எதிர்காலச் செயப்பாட்டு வடிவத்தைத் தமிழிலும் செயப்பாட்டு அமைப்பில் காக்கிறது; மூலத்தில் இல்லாத ‘மேலும்’ என்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: περισσευθήσεται
  choice: அவருக்கு மிகுதியாக இருக்கும்
  rationale: περισσεύω இங்கு தெரிவிக்கும் விளைவான நிறைவு அல்லது மிகுதியை இயல்பான தமிழில் தருகிறது; ‘அவர் பெருகுவார்’ என்று நபரே எண்ணிக்கையில் பெருகுவதாகத் தோன்றும் குழப்பத்தைத் தவிர்க்கிறது.
- source_word: τοῦ δὲ μὴ ἔχοντος
  choice: ஆனால் வைத்திராதவரிடமிருந்து
  rationale: முதல் பகுதிக்கு எதிரான, பிரதிநிதித்துவ ஒருமையிலுள்ள பெயரெச்ச அமைப்பையும் ‘இடமிருந்து’ என்ற பிரிவுப் பொருளையும் காக்கிறது.
- source_word: καὶ ὃ ἔχει
  choice: அவரிடம் இருப்பதும்கூட
  rationale: καί என்பதன் இங்குள்ள வலியுறுத்தும் ‘கூட’ பொருளைக் காட்டி, கூற்றின் முரணான தீவிரத்தைப் பாதுகாக்கிறது.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: அவரிடம் ... எடுத்துக்கொள்ளப்படும்
  rationale: எதிர்காலச் செயப்பாட்டையும் ἀπό குறிக்கும் பிரித்தெடுத்தலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘வைத்திருப்பது’ எதைக் குறிக்கிறது என்பது வெளிப்படையாகக் கூறப்படாதது
  choice: இரு பகுதிகளிலும் பொருளை நிரப்பாமல் ‘வைத்திருக்கும்/வைத்திராத’ என்று மொழிபெயர்த்தல்
  alternative: ‘வரங்கள்/செல்வம்/விசுவாசம் வைத்திருப்பவர்’ என்று குறிப்பாக்குதல்
  rationale: கிரேக்க மூலத்தில் செயப்படுபொருள் சொல்லப்படவில்லை. உவமையின் உடனடிச் சூழல் பொருளை வழிநடத்தினாலும், ஒரு குறிப்பிட்ட கோட்பாட்டு விளக்கத்தை வசனத்துக்குள் சேர்க்காமல் அதன் திறந்த தன்மையைப் பாதுகாக்க வேண்டும்.
- issue: பொதுப்பொருளுடைய ஆண்பால் ஒருமை அமைப்பு
  choice: ‘ஒவ்வொருவர்/அவர்’ என்ற பிரதிநிதித்துவ ஒருமையைப் பயன்படுத்துதல்
  alternative: ‘வைத்திருப்பவர்கள்/அவர்கள்’ என்று பன்மைக்கு மாற்றுதல்
  rationale: தமிழின் ‘அவர்’ பாலினத்தைத் திணிக்காமல் மரியாதையான பொதுமை ஒருமையாக இயங்குகிறது; இதனால் கிரேக்கத்தின் ஒருமை அமைப்பும் அனைவருக்கும் பொருந்தும் தன்மையும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க தொனியுடனும் அமைக்கப்பட்டது. மூலத்தின் இரு இணையான ஒருமைத் தொடர்களும் செயப்பாட்டு வினைகளும் பாதுகாக்கப்பட்டுள்ளன.
