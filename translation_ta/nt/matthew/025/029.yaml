revisions:
- from: ஏனெனில், வைத்திருக்கும் ஒவ்வொருவருக்கும் கொடுக்கப்படும்; அவருக்கு மிகுதியாக இருக்கும்.[a] ஆனால் வைத்திராதவரிடமிருந்து, அவரிடம் இருப்பதும்கூட எடுத்துக்கொள்ளப்படும்.
  to: ஏனெனில், வைத்திருக்கும் ஒவ்வொருவருக்கும் கொடுக்கப்படும்; அவருக்கு மிகுதி உண்டாகும்.[a] ஆனால் வைத்திராதவரிடமிருந்து, அவரிடம் இருப்பதுகூட எடுத்துக்கொள்ளப்படும்.
  rationale: பிரதான திருத்தம் περισσευθήσεται-க்கான இயல்பான நவீனத் தமிழ் வெளிப்பாட்டை வழங்குகிறது. மற்றபடி மூலத்தின் திறந்த 'வைத்திருத்தல்' கருத்து, எதிர்காலச் செயப்பாட்டு அமைப்பு, வலியுறுத்தும் 'கூட', மற்றும் பிரதிநிதித்துவ ஒருமை ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
