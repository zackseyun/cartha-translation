id: MAT.25.6
reference: Matthew 25:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μέσης δὲ νυκτὸς κραυγὴ γέγονεν· Ἰδοὺ ὁ ⸀νυμφίος, ἐξέρχεσθε εἰς ἀπάντησιν ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/006.yaml
  text: 'But at midnight a cry rang out: ‘Look[b][a], the bridegroom! Come out to meet him.’'
translation:
  language: ta
  text: 'ஆனால் நள்ளிரவில் ஒரு கூக்குரல் எழுந்தது[a]: “இதோ[b], மணமகன்! அவரைச் சந்திக்க வெளியே வாருங்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு முழக்கம் கேட்டது.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பாருங்கள், மணமகன்!”
    reason: lexical_alternative
lexical_decisions:
- source_word: μέσης δὲ νυκτός
  choice: ஆனால் நள்ளிரவில்
  rationale: மரபுத்தொடரான இந்த இறைவேற்றுமை அமைப்பு ‘நள்ளிரவில்’ என்ற காலப்பொருளைத் தருகிறது; δέ இங்கு மென்மையான கதைமாற்றத்தையும் சிறிய எதிர்மறைத் திருப்பத்தையும் குறிக்கிறது.
- source_word: κραυγὴ γέγονεν
  choice: ஒரு கூக்குரல் எழுந்தது
  rationale: γίνομαι என்பதன் நிறைவுக்கால வடிவம் இங்கு திடீரென நிகழ்ந்த அறிவிப்பை அறிமுகப்படுத்துகிறது. ‘கூக்குரல் எழுந்தது’ என்பது இயல்பான நவீனத் தமிழில் அந்த நிகழ்வின் திடீர்மையைத் தக்கவைக்கிறது.
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: ἰδού கேட்போரின் கவனத்தை உடனடியாக ஈர்க்கும் சுட்டுச்சொல். ‘இதோ’ சுருக்கமாகவும் இயல்பாகவும் அதன் வலிமையை வெளிப்படுத்துகிறது.
- source_word: ὁ νυμφίος
  choice: மணமகன்
  rationale: νυμφίος திருமணச் சூழலில் மணமகனைக் குறிப்பாகக் குறிக்கிறது; இச்சொல் உவமையின் திருமணப் படிமத்தைத் தெளிவாகக் காக்கிறது.
- source_word: ἐξέρχεσθε
  choice: வெளியே வாருங்கள்
  rationale: இந்தக் கட்டளை ‘வெளியே செல்லுங்கள்/வாருங்கள்’ என்று பொருள்படலாம். அழைப்பைக் கேட்டு உள்ளே இருப்போரிடம் நேரடியாகச் சொல்லப்படும் தமிழில் ‘வெளியே வாருங்கள்’ இயல்பாக உள்ளது.
- source_word: εἰς ἀπάντησιν αὐτοῦ
  choice: அவரைச் சந்திக்க
  rationale: εἰς ἀπάντησιν என்பது ஒருவரை எதிர்கொண்டு சந்திக்கச் செல்வதைக் குறிக்கும் மரபுத்தொடர்; ‘அவரைச் சந்திக்க’ அதன் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: உவமையில் νυμφίος குறிக்கும் நபர்
  choice: உவமையின் இலக்கிய மட்டத்தில் ‘மணமகன்’ என்று மட்டும் மொழிபெயர்க்கப்பட்டது; கிறிஸ்துவைக் குறிக்கும் அடையாளம் மொழிபெயர்ப்பில் வெளிப்படையாகச் சேர்க்கப்படவில்லை.
  alternative: ‘கிறிஸ்துவாகிய மணமகன்’ அல்லது சிறப்புப் பட்டமாகக் காட்டுதல்
  rationale: மத்தேயுவின் விரிவான சூழலில் மணமகன் இயேசுவைக் குறித்தாலும், இவ்வசனம் அவரை உவமையின் பாத்திரமாகவே முன்வைக்கிறது. எனவே விளக்கத்தை உரைக்குள் சேர்க்காமல், அதன் இலக்கிய மற்றும் இறையியல் நெருக்கடியைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் கண்ணியமான நேரடி உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அவரை’ என்பது தமிழின் மரியாதைமிக்க இயல்பான ஒருமைச் சுட்டாகும்; இதனால் மொழிபெயர்ப்புக்குள் கூடுதல் கிறிஸ்தியல் பட்டம் சேர்க்கப்படவில்லை.
