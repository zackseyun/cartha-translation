id: MAT.25.41
reference: Matthew 25:41
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τότε ἐρεῖ καὶ τοῖς ἐξ εὐωνύμων· Πορεύεσθε ἀπ’ ἐμοῦ ⸀οἱ κατηραμένοι εἰς τὸ πῦρ τὸ αἰώνιον τὸ ἡτοιμασμένον τῷ διαβόλῳ καὶ τοῖς ἀγγέλοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/041.yaml
  text: Then he will also say to those on the left[a], ‘Go away from me, you cursed, into the eternal fire prepared for the devil and his angels.’
translation:
  language: ta
  text: 'அப்போது அவர் இடப்பக்கத்தில் இருப்பவர்களிடமும், “சபிக்கப்பட்டவர்களே,[a] என்னைவிட்டு அகன்று, பிசாசுக்காகவும் அவனுடைய தூதர்களுக்காகவும் ஆயத்தம் செய்யப்பட்டுள்ள நித்திய நெருப்புக்குள் செல்லுங்கள்” என்று சொல்வார்.


    [a] அல்லது, “சாபத்துக்குள்ளானவர்களே.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சாபத்துக்குள்ளானவர்களே.”
    reason: οἱ κατηραμένοι என்ற செயப்பாட்டு வடிவத்தை இயல்பான தமிழில் தரும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: நியாயத்தீர்ப்புக் காட்சியில் அடுத்ததாக நிகழ்வதை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: τοῖς ἐξ εὐωνύμων
  choice: இடப்பக்கத்தில் இருப்பவர்களிடம்
  rationale: உடனடி சூழலில் அரசரின் இடப்பக்கத்தில் நிறுத்தப்பட்டுள்ள குழுவைக் குறிக்கும் மரபுத்தொடரைத் தெளிவாகத் தருகிறது.
- source_word: Πορεύεσθε ἀπ’ ἐμοῦ
  choice: என்னைவிட்டு அகன்று ... செல்லுங்கள்
  rationale: பேசுகிறவரிடமிருந்து பிரிந்து குறிப்பிட்ட இடத்துக்குச் செல்லும் கட்டளையின் இயக்கத்தையும் பிரிவையும் காக்கிறது.
- source_word: οἱ κατηραμένοι
  choice: சபிக்கப்பட்டவர்களே
  rationale: நிறைவுற்ற செயப்பாட்டு வினையெச்சத்தின் நேரடி அழைப்பையும் அதன் கடுமையையும் சுருக்கமாகக் காக்கிறது.
- source_word: τὸ πῦρ τὸ αἰώνιον
  choice: நித்திய நெருப்பு
  rationale: நெருப்பை விவரிக்கும் αἰώνιον என்பதற்கான வழக்கமான, கண்ணியமான தமிழாக்கம்; அதன் காலநீட்சி குறித்த வலிமையைத் தளர்த்தவில்லை.
- source_word: τὸ ἡτοιμασμένον
  choice: ஆயத்தம் செய்யப்பட்டுள்ள
  rationale: முன்பே ஆயத்தப்படுத்தப்பட்டு இப்போது அந்த நிலையில் இருப்பதைக் காட்டும் நிறைவுற்ற செயப்பாட்டு வடிவத்தின் நுணுக்கத்தைக் காக்கிறது.
- source_word: τῷ διαβόλῳ
  choice: பிசாசுக்காக
  rationale: இங்கு διάβολος பொதுவான ‘அவதூறு பேசுபவன்’ அல்ல, சாத்தானைக் குறிக்கும் நிலைபெற்ற தனிப்பெயர் சார்ந்த பட்டம்.
- source_word: τοῖς ἀγγέλοις αὐτοῦ
  choice: அவனுடைய தூதர்களுக்காக
  rationale: இறுதிநியாயத்தீர்ப்புச் சூழலில் பிசாசுடன் சேர்ந்துள்ள இயற்கைக்கு அப்பாற்பட்ட தூதர்களைக் குறிக்கிறது.
theological_decisions:
- issue: நியாயத்தீர்ப்புச் சூழலில் αἰώνιον என்பதன் பொருள்
  choice: நித்திய
  alternative: யுகத்துக்குரிய / நீண்டகாலம் நீடிக்கும்
  rationale: இந்தச் சூழலில் αἰώνιον என்பதன் இயல்பான பொருளை ‘நித்திய’ என்பதே காக்கிறது; குறிப்பிட்ட ஒரு கோட்பாட்டு அமைப்பை உரைக்குள் கூடுதலாகச் சேர்க்கவில்லை.
- issue: διάβολος மற்றும் ἄγγελοι என்பவற்றின் குறிப்பீடு
  choice: பிசாசும் அவனுடைய தூதர்களும்
  alternative: அவதூறு பேசுபவனும் அவனுடைய செய்தியாளர்களும்
  rationale: இறுதிநியாயத்தீர்ப்புச் சூழலும் நிலைபெற்ற புதிய ஏற்பாட்டுப் பயன்பாடும் சாத்தானையும் அவனுடன் சேர்ந்த வானுலகத் தூதர்களையும் சுட்டுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், நேரடி தீர்ப்புரையின் கண்ணியமும் கடுமையும் குன்றாதவாறும் அமைக்கப்பட்டுள்ளது. ‘நித்திய’, ‘ஆயத்தம்’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் சூழலில் தெளிவாக இருப்பதால் தக்கவைக்கப்பட்டுள்ளன.
