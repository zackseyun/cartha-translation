  source_fidelity: மூலக் கிரேக்கத்தின் வரிசை, எதிர்கால உரைநடை, இடப்பக்கக் குழுவின் குறிப்பு, பேசுபவரிடமிருந்து விலகும் கட்டளை, சபிக்கப்பட்டோர் என்ற அழைப்பு, நித்திய நெருப்புக்குள் செல்லுதல், மேலும் அது பிசாசுக்கும் அவனுடைய தூதர்களுக்கும் ஆயத்தம் செய்யப்பட்டிருப்பது ஆகிய அனைத்தும் துல்லியமாகக் காக்கப்பட்டுள்ளன. ‘ஆயத்தம் செய்யப்பட்டுள்ள’ என்பது ἡτοιμασμένον என்ற நிறைவுற்ற செயப்பாட்டு வினையெச்சத்தின் தற்போதைய விளைவு நிலையையும் நன்றாக வெளிப்படுத்துகிறது.
  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாகவும், தீர்ப்புரைக்குரிய கண்ணியமும் கடுமையும் கொண்டதாகவும் உள்ளது. ‘என்னைவிட்டு அகன்று ... செல்லுங்கள்’ என்ற தொடர் கட்டளையின் பிரிவு மற்றும் இலக்குநோக்கிய இயக்கம் இரண்டையும் இயல்பாகத் தருகிறது.
