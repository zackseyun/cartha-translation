id: MAT.25.1
reference: Matthew 25:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τότε ὁμοιωθήσεται ἡ βασιλεία τῶν οὐρανῶν δέκα παρθένοις, αἵτινες λαβοῦσαι τὰς λαμπάδας ⸀ἑαυτῶν ἐξῆλθον εἰς ⸀ὑπάντησιν τοῦ νυμφίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/001.yaml
  text: Then the kingdom of heaven will be like ten virgins[c][b][a], who took their lamps and went out to meet the bridegroom.
translation:
  language: ta
  text: அப்போது, பரலோக ராஜ்யம், தங்கள் விளக்குகளை[a] எடுத்துக்கொண்டு மணமகனைச் சந்திக்கப் புறப்பட்ட பத்துக் கன்னிப்பெண்களுக்கு ஒப்பிடப்படும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “விளக்குகள்” என்பதற்குப் பதிலாக “தீப்பந்தங்கள்” என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் ஊர்வலத்தில் கையில் ஏந்திச் செல்லும் ஒளிச்சாதனத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பரலோக ராஜ்யம் ... பத்துக் கன்னிப்பெண்களைப் போல இருக்கும்.” கிரேக்க வினைச்சொல் செயப்பாட்டு வடிவில் இருப்பதால், சொற்பட “ஒப்பிடப்படும்” என்று பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: அப்போது
  rationale: முந்தைய இறுதிக்கால உரையுடன் இவ்வுவமையை இணைக்கும் காலக் குறிப்பு; இயல்பான நவீனத் தமிழ்.
- source_word: ὁμοιωθήσεται
  choice: ஒப்பிடப்படும்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தைத் தெளிவாகப் பாதுகாக்கிறது; ‘போல இருக்கும்’ என்பதும் இயல்பான மாற்று.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: பரலோக அரசு
  rationale: மத்தேயுவின் வழக்கமான சொற்றொடரைச் சுருக்கமாகவும் இயல்பாகவும் வழங்குகிறது; இங்கு ‘அரசு’ என்பது ஆட்சி/அரசாட்சி என்ற பொருளைத் தாங்குகிறது.
- source_word: δέκα παρθένοις
  choice: பத்துக் கன்னிப்பெண்கள்
  rationale: திருமணச் சூழலில் இளம் திருமணமாகாத பெண்களைக் குறிக்கும் மூலச்சொல்லின் தனித்த பொருளைப் பாதுகாக்கிறது.
- source_word: λαβοῦσαι
  choice: எடுத்துக்கொண்டு
  rationale: முதன்மை வினைக்கு முன்பான செயலை இயல்பான தமிழ் வினையெச்சமாகக் காட்டுகிறது.
- source_word: τὰς λαμπάδας ἑαυτῶν
  choice: தங்கள் விளக்குகள்
  rationale: λαμπάς என்பதற்கான பாரம்பரியமும் புரிந்துகொள்ள எளிதுமான மொழிபெயர்ப்பு; ஊர்வலத்தில் ஏந்தப்படும் தீப்பந்தங்களையும் இச்சொல் குறிக்கக்கூடும்.
- source_word: ἐξῆλθον εἰς ὑπάντησιν
  choice: எதிர்கொள்ளப் புறப்பட்ட
  rationale: ஒருவரை வரவேற்று சந்திப்பதற்காக வெளியே செல்வதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: τοῦ νυμφίου
  choice: மணமகன்
  rationale: திருமணச் சூழலுக்குரிய νυμφίος என்பதற்கான தெளிவான நவீனத் தமிழ்.
theological_decisions:
- issue: உவமை ஒப்பீட்டு வாய்பாடு
  choice: பரலோக அரசு ... கன்னிப்பெண்களுக்கு ஒப்பிடப்படும்
  alternative: பரலோக அரசு ... கன்னிப்பெண்களைப் போல இருக்கும்
  rationale: மூலத்தின் எதிர்காலச் செயப்பாட்டு இலக்கணத்தைப் பாதுகாக்கிறது; ஒப்பீடு பெண்களின் ஒவ்வொரு பண்போடும் அல்ல, தொடர்ந்து வரும் முழு நிகழ்வோடும் தொடர்புடையது என்ற இயல்பான உவமைத் திறப்பையும் விடுகிறது.
- issue: παρθένοις என்பதன் மொழிபெயர்ப்பு
  choice: கன்னிப்பெண்கள்
  alternative: இளம்பெண்கள் / திருமணமாகாத பெண்கள்
  rationale: திருமணச் சூழலில் மூலச்சொல்லின் குறிப்பான பொருளை விரிவாக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். ‘மணவாளன்’ என்பதற்குப் பதிலாக இன்றைய இயல்பான ‘மணமகன்’ பயன்படுத்தப்பட்டது. மூலத்தின் செயப்பாட்டு ஒப்பீட்டு வடிவம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, இயல்பான மாற்று அடிக்குறிப்பில் தரப்பட்டது.
