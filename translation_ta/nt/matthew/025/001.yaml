  to: அப்போது, பரலோக ராஜ்யம், தங்கள் விளக்குகளை[a] எடுத்துக்கொண்டு மணமகனைச் சந்திக்கப் புறப்பட்ட பத்துக் கன்னிப்பெண்களுக்கு ஒப்பிடப்படும்.[b]
  rationale: βασιλείαக்கு “ராஜ்யம்” என மாற்றுவதால் ‘kingdom’ என்ற மூலச் சொல்லின் பரப்பு மற்றும் மத்தேயுவின் நிலையான இறையியல் சொல்லாட்சி பாதுகாக்கப்படுகிறது; இது நவீன “அரசு” என்பதன் அரசாங்க-நிர்வாகப் பொருளைத் தவிர்க்கிறது. மேலும், ὑπάντησιν என்பதன் நோக்கமுள்ள சந்திப்பை “மணமகனைச் சந்திக்கப் புறப்பட்ட” என்று தெளிவாக்கியுள்ளோம். மற்றபடி எதிர்காலச் செயப்பாட்டு ஒப்பீட்டு வடிவம், கன்னித்தன்மையைக் குறிக்கும் பெயர்ச் சொல், மற்றும் விளக்கு/தீப்பந்தம் குறித்த மாற்று அடிக்குறிப்பு பாதுகாக்கப்பட்டுள்ளன.
