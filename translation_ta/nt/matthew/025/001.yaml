  source_fidelity: மூலத்தின் காலக் குறிப்பு, எதிர்காலச் செயப்பாட்டு உவமை-வாய்பாடு, பத்து கன்னிப்பெண்கள், அவர்களது ஒளிச்சாதனங்கள், மணமகனைச் சந்திக்க வெளியே செல்லுதல் ஆகியவை வரைவு உரையில் அடிப்படையில் பாதுகாக்கப்பட்டுள்ளன. ஆனால் βασιλείαக்கு “அரசு” என்பது நவீனத் தமிழில் பெரும்பாலும் அரசாங்கத்தைக் குறிக்கும்; இச்சூழலில் “ராஜ்யம்” என்பது நிலையானதும் பொருளில் துல்லியமானதும் ஆகும். ὑπάντησιν என்பதற்கு “எதிர்கொள்ள” என்பதற்குப் பதிலாக “சந்திக்க” என்பது மோதல்/எதிர்ப்பின் தேவையற்ற நிழலின்றி பொருளைத் தருகிறது.
