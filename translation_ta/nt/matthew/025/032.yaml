  text: καὶ ⸀συναχθήσονται ἔμπροσθεν αὐτοῦ πάντα τὰ ἔθνη, καὶ ἀφορίσει αὐτοὺς ἀπ’ ἀλλήλων, ὥσπερ ὁ ποιμὴν ἀφορίζει τὰ πρόβατα ἀπὸ τῶν ἐρίφων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/032.yaml
  text: And all the nations will be gathered before him[a], and he will separate them from one another, just as the shepherd separates the sheep from the goats[b],
translation:
  language: ta
  text: எல்லா தேசத்தாரும் அவருக்கு முன்பாகக் கூட்டிச் சேர்க்கப்படுவார்கள்[a]; மேய்ப்பன் செம்மறியாடுகளை வெள்ளாட்டுக் குட்டிகளிடமிருந்து[b] பிரிப்பதுபோல, அவர் அவர்களை ஒருவரை ஒருவரிடமிருந்து பிரிப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எல்லா மக்களும்”; கிரேக்கத்தில், “எல்லா தேசங்களும்” (πάντα τὰ ἔθνη).
    reason: lexical_alternative
  - marker: b
    text: இங்கு பயன்படுத்தப்பட்டுள்ள கிரேக்கச் சொல் ἐρίφων, குறிப்பாக “இளம் வெள்ளாடுகள்” அல்லது “வெள்ளாட்டுக் குட்டிகள்” என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: συναχθήσονται
  choice: கூட்டிச் சேர்க்கப்படுவார்கள்
  rationale: συνάγω என்பதன் எதிர்காலச் செயப்பாட்டு வடிவத்தை இயல்பான தமிழில் தருகிறது; கூட்டுபவர் யார் என்பதை உரையில் சேர்க்கவில்லை.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: அவருக்கு முன்பாக
  rationale: இச்சொற்றொடரின் இடத்தையும் நீதித்தீர்ப்புக் காட்சியின் தன்மையையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: πάντα τὰ ἔθνη
  choice: எல்லா தேசத்தாரும்
  rationale: ἔθνη என்பதன் ‘தேசங்கள்/மக்கள் கூட்டங்கள்’ என்ற பரந்த பொருளைத் தக்கவைத்து, உயிருள்ள மனிதர்களைக் குறிக்கும் இயல்பான தமிழை வழங்குகிறது.
- source_word: ἀφορίσει
  choice: பிரிப்பார்
  rationale: ஒரு குழுவை மற்றொரு குழுவிலிருந்து வேறுபடுத்திப் பிரிப்பதை நேரடியாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: αὐτοὺς ἀπ’ ἀλλήλων
  choice: அவர்களை ஒருவரிடமிருந்து ஒருவராக
  rationale: கூடியிருப்போருக்குள் நிகழும் பரஸ்பரப் பிரிவை கிரேக்க அமைப்புக்கு நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: ὥσπερ
  choice: பிரிப்பதுபோல
  rationale: மேய்ப்பனின் செயலை அடுத்துள்ள செயலுடன் ஒப்பிடும் உவமையை இயல்பான தமிழில் இணைக்கிறது.
- source_word: ὁ ποιμὴν
  choice: மேய்ப்பன்
  rationale: பொதுவகை எடுத்துக்காட்டாக வரும் குறிப்பிட்ட உருவகத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: τὰ πρόβατα
  choice: செம்மறியாடுகளை
  rationale: தமிழில் வெள்ளாடுகளிலிருந்து தெளிவாக வேறுபடுத்துவதற்காக πρόβατα என்பதைக் குறிப்பான ‘செம்மறியாடுகள்’ என வழங்குகிறது.
- source_word: τῶν ἐρίφων
  choice: வெள்ளாட்டுக் குட்டிகளிடமிருந்து
  rationale: ἔριφος என்பது குறிப்பாக இளம் வெள்ளாடு அல்லது வெள்ளாட்டுக் குட்டியைக் குறிக்கக்கூடும்; தமிழில் அந்தக் குறிப்புத்தன்மையை இயல்பாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: πάντα τὰ ἔθνη என்பதன் வரம்பு
  choice: எல்லா தேசத்தாரும்
  alternative: எல்லா மக்களும்; யூதரல்லாத எல்லா மக்களும்
  rationale: ‘யூதரல்லாதவர்கள்’ என்று குறுக்காமலும், வெறும் தனிநபர்களாகத் தட்டையாக்காமலும், சொற்றொடரின் பரந்த தேசிய/மக்கள் சார்ந்த பொருளையும் இறுதித் தீர்ப்புக் காட்சியின் திட்டமிட்டு விடப்பட்டுள்ள வரம்புத் தெளிவின்மையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘தேசத்தார்’ என்பது தேசங்களையே உயிரற்ற அலகுகளாகக் காட்டாமல் அவற்றைச் சேர்ந்த மக்களைக் குறிக்கிறது. ‘செம்மறியாடு/வெள்ளாட்டுக் குட்டி’ என்ற சொற்கள் தமிழ் கால்நடை வேறுபாட்டைத் தெளிவாகக் காட்டுகின்றன. அனைத்து அடிக்குறிப்பு சுட்டிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
