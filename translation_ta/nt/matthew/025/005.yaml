  text: χρονίζοντος δὲ τοῦ νυμφίου ἐνύσταξαν πᾶσαι καὶ ἐκάθευδον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/005.yaml
  text: But while the bridegroom was delayed[b][a], they all became drowsy and fell asleep.
translation:
  language: ta
  text: ஆனால் மணமகன் தாமதித்தபோது[a], அவர்கள் எல்லாரும் தூக்கமயக்கமடைந்து, தூங்கிக்கொண்டிருந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மணமகன் நீண்ட நேரம் எடுத்துக்கொண்டபோது.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் முதலில் தூக்கமயக்கம் ஏற்பட்டதையும் (ἐνύσταξαν), பின்னர் அவர்கள் தூங்கிக்கொண்டிருந்ததையும் (ἐκάθευδον) வேறுபடுத்திக் கூறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρονίζοντος
  choice: தாமதித்தபோது
  rationale: χρονίζω என்பது எதிர்பார்த்ததைவிடத் தாமதிப்பதையோ நீண்ட நேரம் எடுத்துக்கொள்வதையோ குறிக்கிறது. மரபுத்தொடரின் காலச் சூழலை இயல்பான தமிழில் இது தெளிவாகக் காட்டுகிறது; ‘வர’ என்பதை மூலத்தில் வெளிப்படையாக இல்லாததால் முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: δὲ
  choice: ஆனால்
  rationale: δέ இங்கு எதிர்பார்ப்பிலிருந்து தாமதத்திற்கும் அதன் விளைவிற்கும் செல்லும் மென்மையான எதிர்மாற்றத்தைக் குறிக்கிறது.
- source_word: νυμφίου
  choice: மணமகன்
  rationale: νυμφίος திருமணச் சூழலில் மணமகனைக் குறிப்பாகக் குறிக்கிறது. இச்சொல் உவமையின் படிமத்தை விளக்கவுரை இன்றி தக்கவைக்கிறது.
- source_word: ἐνύσταξαν
  choice: தூக்கக் கலக்கமடைந்து
  rationale: νυστάζω தூக்கம் வரத் தொடங்குவதையோ மயக்கமடைவதையோ குறிக்கிறது. அடுத்துவரும் உண்மையான உறக்கத்திலிருந்து இதை வேறுபடுத்த இத்தேர்வு உதவுகிறது.
- source_word: πᾶσαι
  choice: அவர்கள் எல்லாரும்
  rationale: பெண்பால் பன்மையான πᾶσαι முன்னர் குறிப்பிடப்பட்ட அனைவரையும் உள்ளடக்குகிறது. ‘அவர்கள் எல்லாரும்’ என்பது தமிழில் இயல்பாகவும் முழுமையாகவும் அந்தப் பொருளைத் தருகிறது.
- source_word: ἐκάθευδον
  choice: தூங்கிக்கொண்டிருந்தார்கள்
  rationale: καθεύδω என்பது தூங்குவதைக் குறிக்கிறது; இறந்தகாலத் தொடர்நிலை வடிவமான ἐκάθευδον நடந்துகொண்டிருந்த உறக்கத்தைச் சுட்டுவதால் ‘தூங்கிக்கொண்டிருந்தார்கள்’ என்று மொழிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: மணமகன் குறித்த உவமைப் படிமம்
  choice: ‘மணமகன்’ என்ற கதைப் படிமத்தை அப்படியே தக்கவைத்து, அதன் கிறிஸ்துவியல் அடையாளத்தை மொழிபெயர்ப்பில் வெளிப்படையாகச் சேர்க்கவில்லை.
  alternative: ‘மாப்பிள்ளை’ எனப் பொதுவழக்கில் மொழிபெயர்ப்பது அல்லது மணமகன் யாரைக் குறிக்கிறார் என்பதை உரையிலேயே விளக்குவது.
  rationale: மத்தேயுவின் விரிந்த சூழலில் இப்பெயர் இறையியல் ஒலிப்பைக் கொண்டிருந்தாலும், இந்த வசனம் உவமையின் நிகழ்வை நேரடியாகச் சொல்கிறது. ஆகவே விளக்கத்தைத் திணிக்காமல் படிமமும் அதன் இறையியல் திறந்தநிலையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘தூக்கக் கலக்கமடைந்து’ மற்றும் ‘தூங்கிக்கொண்டிருந்தார்கள்’ என்பவை கிரேக்கத்தின் இரு வேறுபட்ட நிலைகளையும் வினைக்கால நுணுக்கத்தையும் காக்கின்றன.
