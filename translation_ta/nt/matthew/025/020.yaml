  source_fidelity: 'மூலத்தின் செயல்வரிசையும் மீளுரைத்தலும் காக்கப்பட்டுள்ளன: ஐந்து தாலந்துகளைப் பெற்றவன் முன்வருகிறான், கூடுதலான ஐந்து தாலந்துகளை கொண்டு வருகிறான், ஒப்படைக்கப்பட்ட ஐந்தையும் சுட்டி மேலும் ஐந்தை ஈட்டியதாகக் கூறுகிறான். «பாருங்கள்» என்பது ἴδε-யின் கவன ஈர்ப்புச் செயல்பாட்டைத் தக்கவைக்கிறது; «ஈட்டியிருக்கிறேன்» என்பது ἐκέρδησα-வின் இலாபம்/ஆதாயம் பெற்ற பொருளுக்குச் சரியானது.'
