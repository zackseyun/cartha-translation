language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ὁ τὰ πέντε τάλαντα λαβὼν προσήνεγκεν ἄλλα πέντε τάλαντα λέγων· Κύριε, πέντε τάλαντά μοι παρέδωκας· ἴδε ἄλλα πέντε τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/020.yaml
  text: And the one who had received the five talents came forward and brought another five talents[a], saying, ‘Lord, you delivered five talents to me; look[b], I have gained another five talents.’
translation:
  language: ta
  text: ஐந்து தாலந்துகளை[b]ப் பெற்றுக்கொண்டவன் முன்வந்து, மேலும் ஐந்து தாலந்துகளைக் கொண்டுவந்து, “ஆண்டவரே[a], ஐந்து தாலந்துகளை என்னிடம் ஒப்படைத்தீர்கள். பாருங்கள், மேலும் ஐந்து தாலந்துகளை நான் ஈட்டியிருக்கிறேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது “எஜமானரே.” கிரேக்கம்: Kyrios.'
    reason: alternative_reading
  - marker: b
    text: ஒரு தாலந்து என்பது பெரிய பண மதிப்பைக் குறிக்கும் ஓர் அலகு.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: முன்வந்து
  rationale: προσέρχομαι என்ற வினையின் அணுகிவரும் பொருளையும், எஜமானர்முன் கணக்குச் சமர்ப்பிக்கும் காட்சியையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: ஐந்து தாலந்துகளைப் பெற்றுக்கொண்டவன்
  rationale: முதன்மைச் செயலுக்கு முன்னரே அவன் பணத்தைப் பெற்றிருந்ததைப் பெயரெச்சத் தொடர் தெளிவாகக் காட்டுகிறது; மூலத்தில் இல்லாத ‘மனிதன்’ அல்லது ‘வேலைக்காரன்’ என்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: τάλαντα
  choice: தாலந்துகள்
  rationale: τάλαντον என்பது பெரும் எடை அல்லது பண மதிப்பு அலகு. பாரம்பரியமாக அறியப்பட்ட மூலச்சொல்லைத் தக்கவைத்து, அதன் பணப் பொருளை அடிக்குறிப்பில் விளக்குகிறது.
- source_word: προσήνεγκεν
  choice: கொண்டுவந்து
  rationale: கூடுதலாகப் பெற்ற தொகையை எஜமானரிடம் கொண்டு வந்த செயலை நேரடியாகவும் இயல்பாகவும் குறிக்கிறது; பலியிடுதல் போன்ற தேவையற்ற நிழற்பொருளைத் தவிர்க்கிறது.
- source_word: ἄλλα πέντε τάλαντα
  choice: மேலும் ஐந்து தாலந்துகள்
  rationale: ἄλλα என்பது முன் கொடுக்கப்பட்ட அளவுக்கு மேலான, அதே அளவுள்ள கூடுதல் தொகையைக் குறிக்கிறது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: κύριος என்பதன் மரியாதைமிக்க நேரடி அழைப்பைத் தக்கவைக்கிறது; உவமையின் உடனடிச் சூழலில் இது எஜமானரைக் குறிக்கலாம்.
- source_word: παρέδωκας
  choice: என்னிடம் ஒப்படைத்தீர்கள்
  rationale: παραδίδωμι என்பதிலுள்ள கையளித்தல் அல்லது ஒப்படைத்தல் என்ற கருத்தை இயல்பான தமிழில் தருகிறது; பொறுப்பாகக் கொடுத்த சூழலையும் அளவுக்கு மீறி விளக்காமல் உணர்த்துகிறது.
- source_word: ἴδε
  choice: பாருங்கள்
  rationale: கவனத்தை ஈர்க்கும் கட்டளைச்சொல்லின் உயிரோட்டத்தை நவீன, மரியாதைமிக்க தமிழில் காக்கிறது.
- source_word: ἐκέρδησα
  choice: நான் ஈட்டியிருக்கிறேன்
  rationale: κερδαίνω என்பதன் இலாபமாகப் பெறுதல் என்ற பொருளையும், முடிந்த செயலின் தற்போதைய விளைவையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: உவமையின் நேரடி அழைப்பில் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவரே
  alternative: எஜமானரே
  rationale: உவமையின் கதைக்குள் இச்சொல் வேலைக்காரனின் எஜமானரைக் குறிக்கிறது. அதேவேளையில், மத்தேயுவில் κύριος கொண்டிருக்கக்கூடிய பரந்த கதை-இறையியல் எதிரொலியை முற்றிலும் நீக்காமல் ‘ஆண்டவரே’ என்று மொழிபெயர்க்கப்பட்டுள்ளது; ‘எஜமானரே’ என்பது சூழலுக்கேற்ற மாற்று.
translation_notes:
  register: நவீன தரத் தமிழில், நேரடியானதும் மரியாதைமிக்கதுமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் மீளுரைத்தல் (‘ஐந்து தாலந்துகள்’) காக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்களோடு பொருத்தப்பட்டுள்ளன.
