id: MAT.25.43
reference: Matthew 25:43
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ξένος ἤμην καὶ οὐ συνηγάγετέ με, γυμνὸς καὶ οὐ περιεβάλετέ με, ἀσθενὴς καὶ ἐν φυλακῇ καὶ οὐκ ἐπεσκέψασθέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/043.yaml
  text: I was a stranger and you did not welcome me[a], naked and you did not clothe me[b], sick and in prison and you did not visit me.
translation:
  language: ta
  text: நான் அந்நியனாக இருந்தேன்; நீங்கள் என்னை ஏற்றுக்கொள்ளவில்லை[a]. உடையின்றி[b] இருந்தேன்; நீங்கள் எனக்கு உடை அணிவிக்கவில்லை. நோயுற்றிருந்தேன், சிறையில் இருந்தேன்; நீங்கள் என்னை வந்து பார்க்கவில்லை[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உள்ளே சேர்த்துக்கொள்ளவில்லை’ அல்லது ‘வரவேற்கவில்லை’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல்லின் நேரடிப் பொருள் ‘ஒன்றுகூட்டுதல்’; இங்கு அந்நியரை விருந்தோம்பலுடன் ஏற்றுக்கொள்வதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘நிர்வாணமாக’ அல்லது ‘போதிய உடையில்லாமல்’ என்றும் பொருள்படலாம்.
    reason: lexical_ambiguity
  - marker: c
    text: ‘என்னைக் கவனித்துக்கொள்ளவில்லை’ என்றும் பொருள்படலாம்; இது வெறுமனே சந்திப்பதைவிட அக்கறையுடன் சென்று பார்ப்பதைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ξένος
  choice: அந்நியனாக
  rationale: தன் குடும்பம் அல்லது சமூக வட்டத்துக்கு வெளியே இருந்து உபசரிப்பு தேவைப்படும் ஒருவரைக் குறிக்கிறது. ‘அந்நியன்’ என்பது ‘வெளிநாட்டவர்’ என்ற இன அல்லது நாட்டுச் சார்ந்த பொருளுக்குள் இதைச் சுருக்காமல், அறிமுகமற்றவரின் சமூகப் பாதுகாப்பின்மையை வெளிப்படுத்துகிறது.
- source_word: συνηγάγετέ
  choice: ஏற்றுக்கொள்ளவில்லை
  rationale: συνάγω என்பதன் அடிப்படைப் பொருள் ‘ஒன்றுகூட்டுதல்’ என்றாலும், ξένος உடன் இங்கு விருந்தோம்பலுடன் ஒருவரைத் தம்மிடம் சேர்த்துக்கொள்வதைக் குறிக்கிறது. ‘ஏற்றுக்கொள்ளவில்லை’ என்பது அந்த உபசரிப்புப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: γυμνός
  choice: உடையின்றி
  rationale: முழுமையாக நிர்வாணமாக இருப்பதையோ போதிய உடை இல்லாமையையோ குறிக்கக்கூடிய கிரேக்கச் சொல்லின் பரப்பை ‘உடையின்றி’ இயல்பாகத் தக்கவைக்கிறது.
- source_word: περιεβάλετέ
  choice: உடை அணிவிக்கவில்லை
  rationale: சொல்லின் அடிப்படை எண்ணம் ஒன்றைச் சுற்றிப் போர்த்துவது; இச்சூழலில் உடை கொடுத்து அணிவிப்பதைக் குறிக்கிறது.
- source_word: ἀσθενής
  choice: நோயுற்றிருந்தேன்
  rationale: இச்சூழலில் பொதுவான பலவீனத்தைவிட உடல்நோயே இயல்பான பொருள்; தமிழில் தெளிவான வினைநிலையாக வழங்கப்பட்டுள்ளது.
- source_word: ἐν φυλακῇ
  choice: சிறையில் இருந்தேன்
  rationale: φυλακή இங்கு காவல் நிலையையோ காவலாளியையோ அல்ல, சிறைவாசத்தைக் குறிக்கிறது.
- source_word: ἐπεσκέψασθέ
  choice: வந்து பார்க்கவில்லை
  rationale: வெறும் சமூகச் சந்திப்பை மட்டுமல்லாமல் அக்கறையுடன் சென்று கவனிப்பதையும் குறிக்கக்கூடிய சொல்லை, அதன் நேரடியான செயலைத் தக்கவைக்கும் இயல்பான தமிழில் வழங்குகிறது; பரந்த அக்கறைப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: ἐπεσκέψασθέ με என்பதில் இரக்கமுள்ள அக்கறையின் நுணுக்கம்
  choice: நீங்கள் என்னை வந்து பார்க்கவில்லை
  alternative: நீங்கள் என்னைக் கவனித்துக்கொள்ளவில்லை
  rationale: மூலத்தில் பெயரிடப்படும் நேரடியான வருகைச் செயலை மொழிபெயர்ப்பு தக்கவைக்கிறது; அதேவேளை அது வெறும் மரியாதை நிமித்தமான சந்திப்பு அல்ல, அக்கறையுள்ள கவனிப்பையும் உட்படுத்தலாம் என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் மரியாதையான நடையில் அமைக்கப்பட்டுள்ளது. பட்டியலின் ஒவ்வொரு குற்றச்சாட்டையும் அரைப்புள்ளி மற்றும் முற்றுப்புள்ளிகளால் தெளிவுபடுத்தி, மூலத்தின் மீளுரைத்தல் அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
