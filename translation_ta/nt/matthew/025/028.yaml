  text: ἄρατε οὖν ἀπ’ αὐτοῦ τὸ τάλαντον καὶ δότε τῷ ἔχοντι τὰ δέκα τάλαντα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/028.yaml
  text: Therefore take the talent from him and give it to the one who has the ten talents[a][b].
translation:
  language: ta
  text: எனவே, அவனிடமிருந்து அந்தத் தாலந்தை எடுத்துக்கொள்ளுங்கள்; அதை பத்துத் தாலந்துகளை வைத்திருப்பவனுக்குக் கொடுங்கள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அகற்றுங்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கக் கட்டளை வடிவம் இச்சூழலில் இருவிதமாகவும் வழங்கப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘தாலந்து’ என்பது பெரிய எடை அலகாகவும், அதனடிப்படையில் பெரிய பணத் தொகையாகவும் பயன்படுத்தப்பட்டது.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρατε
  choice: எடுத்துக்கொள்ளுங்கள்
  rationale: αἴρω என்பதன் இறந்தகாலக் கட்டளைப் பன்மை வடிவம் இது. இச்சூழலில் ஒருவரிடமிருந்து ஒன்றை எடுத்தல் அல்லது அகற்றுதல் என்ற நேரடியான கட்டளையைத் தருகிறது. ‘எடுத்துக்கொள்ளுங்கள்’ என்பது இயல்பான நவீனத் தமிழில் கட்டளை வலிமையைப் பேணுகிறது; ‘எடுத்துவிடுங்கள்’ என்பதும் சாத்தியம்.
- source_word: οὖν
  choice: எனவே
  rationale: முந்தைய தீர்ப்பிலிருந்து வரும் முடிவை அல்லது விளைவைச் சுட்டுகிறது. ‘எனவே’ தர்க்கத் தொடர்பைத் தெளிவாகப் பேணுகிறது.
- source_word: ἀπ’ αὐτοῦ
  choice: அவனிடமிருந்து
  rationale: ἀπό உடன் வரும் வேற்றுமை பிரிவைச் சுட்டுகிறது; உவமையில் இப்போது கண்டிக்கப்பட்ட மனிதனிடமிருந்து தாலந்து எடுக்கப்படுவதை நேரடியாகக் கூறுகிறது.
- source_word: τὸ τάλαντον
  choice: அந்தத் தாலந்தை
  rationale: வரலாற்றுக் காலத்தில் பெரிய எடை அலகையும் அதனால் பெரிய பணத் தொகையையும் குறித்த τάλαντον என்ற சொல்லை ஒலிபெயர்த்து வழங்குகிறது. ‘அந்த’ என்பது முன்பு குறிப்பிடப்பட்ட குறிப்பிட்ட தாலந்தைச் சுட்டும் கிரேக்க இடைச்சொல்லின் குறிப்புத்தன்மையை வெளிப்படுத்துகிறது.
- source_word: δότε
  choice: கொடுங்கள்
  rationale: δίδωμι என்பதன் இறந்தகாலக் கட்டளைப் பன்மை வடிவம். ‘கொடுங்கள்’ நேரடியானதும் இயல்பானதும் ஆகும்; கட்டளை வலிமையையும் பேணுகிறது.
- source_word: τῷ ἔχοντι
  choice: வைத்திருப்பவனிடம்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் பங்கேற்புவினை வடிவத்தை இயல்பான தமிழில் காட்டுகிறது. உரையில் குறிப்பிட்ட ஆண் அடிமையைச் சுட்டுவதால் ‘வைத்திருப்பவனிடம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: τὰ δέκα τάλαντα
  choice: பத்துத் தாலந்துகளை
  rationale: முன்னரே குறிப்பிடப்பட்ட குறிப்பிட்ட பத்துத் தாலந்துகளை கிரேக்க இடைச்சொல் சுட்டுகிறது. தமிழ் வாக்கியத்தில் ‘வைத்திருப்பவனிடம்’ என்பதோடு இணைந்து அந்தக் குறிப்புத்தன்மை இயல்பாக வெளிப்படுகிறது.
theological_decisions:
- issue: உவமைச் சூழலில் τάλαντον என்பதன் பொருள்
  choice: இயல்பான திறமை என்று விளக்காமல், வரலாற்றுக் காலப் பணம்/எடை அலகான ‘தாலந்து’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: பணம்; பெருந்தொகை
  rationale: உவமை ஒப்படைக்கப்பட்ட பணத் தொகைகளையும் கணக்குக் கொடுத்தலையும் பற்றியது. ‘தாலந்து’ என்ற வரலாற்றுச் சொல்லைப் பேணுவது உரையை இயல்பான திறமைகளைப் பற்றியதாக முன்கூட்டியே விளக்குவதைத் தவிர்க்கிறது; அதன் பொருளை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் மரியாதைப் பன்மைக் கட்டளை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. வரலாற்றுச் சொல்லான ‘தாலந்து’ பேணப்பட்டு, அதன் பணப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
