id: MAT.25.22
reference: Matthew 25:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: προσελθὼν ⸀δὲ καὶ ὁ τὰ δύο ⸀τάλαντα εἶπεν· Κύριε, δύο τάλαντά μοι παρέδωκας· ἴδε ἄλλα δύο τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/022.yaml
  text: Then the one who had received the two talents also came forward and said[a], ‘Lord, you handed over to me two talents. Look[b], I gained two more talents.’
translation:
  language: ta
  text: அப்போது, இரண்டு தாலந்துகளைப்[b] பெற்றவனும் முன்வந்து, “ஆண்டவரே,[a] இரண்டு தாலந்துகளை என்னிடம் ஒப்படைத்தீர்கள். இதோ, மேலும் இரண்டு தாலந்துகளை ஈட்டினேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எஜமானே.” கிரேக்கச் சொல்லான கிரியோஸ் பொதுவாக “ஆண்டவர்” என்று மொழிபெயர்க்கப்படுகிறது; இந்த உவமையில் அது எஜமானை மரியாதையுடன் அழைக்கும் சொல்லாகவும் அமையலாம்.
    reason: alternative_reading
  - marker: b
    text: தாலந்து என்பது ஒருவரின் இயல்பான திறமை அல்ல; அது பெரிய பணமதிப்பின் அலகு.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: முன்வந்து
  rationale: எஜமானிடம் அணுகி அறிக்கை அளிக்கும் நிகழ்வை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: δὲ καὶ
  choice: -உம்
  rationale: முந்தைய ஊழியனைத் தொடர்ந்து இவரும் வந்தார் என்ற சேர்க்கையையும் கதைத் தொடர்ச்சியையும் இயல்பாகக் காட்டுகிறது.
- source_word: ὁ τὰ δύο τάλαντα
  choice: இரண்டு தாலந்துகளைப் பெற்றவன்
  rationale: கிரேக்கத்தில் சூழலால் உணர்த்தப்படும் பெறுதலைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: κύριος என்பதற்கான வழக்கமான மரியாதை அழைப்பு; உவமையின் சூழலில் எஜமானைக் குறிக்கவும் இயலும்.
- source_word: παρέδωκας
  choice: ஒப்படைத்தீர்கள்
  rationale: சொத்தை ஒருவரிடம் பொறுப்பாகக் கொடுத்ததைக் குறிக்கும் παραδίδωμι என்பதன் சூழல்சார் பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: ἴδε
  choice: பாருங்கள்
  rationale: முடிவின்மீது கவனத்தை ஈர்க்கும் இடைச்சொல்லின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: ἄλλα δύο τάλαντα
  choice: மேலும் இரண்டு தாலந்துகள்
  rationale: முதலில் கொடுக்கப்பட்ட அளவுக்கு மேலாக அதே அளவு கிடைத்ததைத் தெளிவாகச் சொல்கிறது.
- source_word: ἐκέρδησα
  choice: ஈட்டியிருக்கிறேன்
  rationale: κερδαίνω என்பதன் ‘லாபமாகப் பெறு/ஈட்டு’ என்ற பொருளை பணச் சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τάλαντα
  choice: தாலந்துகள்
  rationale: பண்டைய பெரிய எடை மற்றும் பணமதிப்பு அலகைக் குறிக்கும் மரபான சொல்லைத் தக்கவைத்து, அதன் பொருளை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: உவமையில் κύριος என்ற அழைப்பின் மொழிபெயர்ப்பு
  choice: ஆண்டவரே
  alternative: எஜமானே
  rationale: κύριος என்பதன் வழக்கமான மொழிபெயர்ப்பைத் தக்கவைக்கிறது; அதேவேளை உவமையின் சமூகச் சூழலில் ‘எஜமானே’ என்றும் பொருள்படலாம் என்பதைக் குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையான நேரடி உரையாடலோடு அமைக்கப்பட்டுள்ளது. ‘தாலந்து’ என்ற மரபுச் சொல் தக்கவைக்கப்பட்டு அதன் பண்டைய பணமதிப்புப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
