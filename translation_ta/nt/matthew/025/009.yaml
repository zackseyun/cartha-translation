source:
  edition: SBLGNT
  text: ἀπεκρίθησαν δὲ αἱ φρόνιμοι λέγουσαι· Μήποτε ⸂οὐ μὴ⸃ ἀρκέσῃ ἡμῖν καὶ ὑμῖν· ⸀πορεύεσθε μᾶλλον πρὸς τοὺς πωλοῦντας καὶ ἀγοράσατε ἑαυταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/009.yaml
  text: But the wise answered[a], saying, ‘No, lest there not be enough for us and for you. Go instead to those who sell, and buy for yourselves.’
translation:
  language: ta
  text: ஆனால் விவேகமுள்ளவர்கள், “இல்லை; அது எங்களுக்கும் உங்களுக்கும் போதாமல் போய்விடுமோ.[a] அதற்குப் பதிலாக, விற்பவர்களிடம் சென்று உங்களுக்காக வாங்கிக்கொள்ளுங்கள்” என்று பதிலளித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் சொல்லுக்கு நெருக்கமாக, “அது எங்களுக்கும் உங்களுக்கும் போதாமல் போகாமல் இருக்குமோ” என்று மொழிபெயர்க்கலாம். கிரேக்கத்தில் வலியுறுத்தும் மறுப்பு பயன்படுத்தப்பட்டிருப்பதால், இரு தரப்புக்கும் போதாது போகலாம் என்ற கவலை வலுவாக வெளிப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: பதிலளித்தார்கள்
  rationale: கதைநடையில் வரும் வழக்கமான பதில்வினை; மேற்கோளைத் தொடர்ந்து ‘என்று பதிலளித்தார்கள்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: αἱ φρόνιμοι
  choice: விவேகமுள்ளவர்கள்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் பெயரடை. முந்தைய சூழலில் குறிப்பிடப்பட்ட பெண்களைச் சுட்டுகிறது; மூலத்தில் இங்கு இல்லாத பெயர்ச்சொல்லைச் சேர்க்காமல் அதன் பண்பையும் அடையாளத்தையும் காக்கிறது.
- source_word: Μήποτε ⸂οὐ μὴ⸃ ἀρκέσῃ
  choice: வேண்டாம்; அது ... போதாமல் போய்விடுமோ!
  rationale: எண்ணெயைப் பகிர மறுப்பதையும், இரு தரப்புக்கும் போதாத நிலை ஏற்படும் என்ற வலுவான கவலையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது. வலியுறுத்தப்பட்ட கிரேக்க மறுப்பின் தீவிரம் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ἡμῖν καὶ ὑμῖν
  choice: எங்களுக்கும் உங்களுக்கும்
  rationale: இரு குழுக்களுக்கும் தேவையான அளவைப் பற்றிய பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: πορεύεσθε μᾶλλον
  choice: அதற்குப் பதிலாக ... போய்
  rationale: முன்னர் கோரப்பட்ட செயலுக்கு மாற்றாகச் செய்ய வேண்டிய செயலை μᾶλλον குறிக்கிறது.
- source_word: πρὸς τοὺς πωλοῦντας
  choice: விற்பவர்களிடம்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் நிகழ்காலப் பங்கேற்புச் சொல்லைச் சுருக்கமாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘எண்ணெய்’ என்பதைச் சேர்க்கவில்லை.
- source_word: ἀγοράσατε ἑαυταῖς
  choice: உங்களுக்காக வாங்கிக்கொள்ளுங்கள்
  rationale: கட்டளை வடிவத்தையும், தங்களுடைய பயன்பாட்டிற்காக வாங்க வேண்டும் என்ற தற்சுட்டுப் பொருளையும் காக்கிறது.
