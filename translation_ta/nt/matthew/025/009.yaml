translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘விவேகமுள்ளவர்கள்’ என்பது முந்தைய வசனங்களில் அறிமுகமான பெண்களைச் சூழலின் வழியே சுட்டுகிறது. மூலத்தில் இவ்வசனத்தில் மீண்டும் சொல்லப்படாத ‘எண்ணெய்’ பிரதான உரையில் சேர்க்கப்படவில்லை.
