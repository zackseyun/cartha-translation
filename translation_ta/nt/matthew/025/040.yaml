source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ βασιλεὺς ἐρεῖ αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐφ’ ὅσον ἐποιήσατε ἑνὶ τούτων τῶν ἀδελφῶν μου τῶν ἐλαχίστων, ἐμοὶ ἐποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/040.yaml
  text: And the King will answer them[a], ‘Truly I say to you, insofar as you did it to one of the least of these brothers of mine[b], you did it to me.’
translation:
  language: ta
  text: 'அரசர் பதிலளித்து அவர்களிடம் கூறுவார்: “மெய்யாகவே உங்களுக்குச் சொல்கிறேன்: என் இந்தச் சகோதரர்களில் மிகச் சிறியவர்களில் ஒருவருக்கு நீங்கள் எந்த அளவுக்கு இதைச் செய்தீர்களோ, அந்த அளவுக்கு எனக்கே செய்தீர்கள்.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மெய்யாகவே உங்களுக்குச் சொல்கிறேன்” என்பதற்குப் பதிலாக, இன்னும் சொற்படியாக, “ஆமென், உங்களுக்குச் சொல்கிறேன்” என்றும் மொழிபெயர்க்கலாம். “என் இந்தச் சகோதரர்கள்” என்பது குறிப்பாக இயேசுவின் சீடர்களையோ, பொதுவாக விசுவாசிகளையோ, அல்லது இன்னும் விரிவாகத் துன்புறும் அல்லது பாதிக்கப்படக்கூடிய மக்களையோ குறிக்கலாம்; மூலவசனம் அந்தக் கேள்வியைத் தீர்மானிக்கவில்லை.
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς ὁ βασιλεὺς ἐρεῖ αὐτοῖς
  choice: அப்போது அரசர் அவர்களுக்குப் பதிலளிப்பார்
  rationale: இறந்தகால வினையெச்சத்தையும் எதிர்கால முற்றுவினையையும் தமிழில் இயல்பான ஒரே பதிலுரைக்கும் செயலாக வழங்குகிறது; ‘அப்போது’ சூழலோடு இணைக்கிறது.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: உறுதியாக உங்களுக்குச் சொல்கிறேன்
  rationale: இயேசுவின் வலியுறுத்தலான அறிமுகச் சூத்திரத்தின் பொருளை நவீன தமிழில் தெளிவாகவும் கண்ணியமாகவும் தருகிறது; நேரடியான ‘ஆமென்’ வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐφ’ ὅσον
  choice: நீங்கள் செய்ததை
  rationale: இந்தச் சூழலில் ஒருவருக்குச் செய்யப்பட்ட செயலைக் குறிக்கும் இயல்பான தமிழ் தொடர்பு அமைப்பு; அளவு/எல்லை நுணுக்கத்தை முழுமையாகச் சொற்படியாக்காமல் வாக்கியத்தின் கருத்தைத் துல்லியமாகத் தருகிறது.
- source_word: ἑνὶ τούτων τῶν ἀδελφῶν μου τῶν ἐλαχίστων
  choice: மிகச் சிறியவர்களான என் சகோதரர்கள் இவர்களில் ஒருவருக்கு
  rationale: ἑνί என்பதன் ‘ஒருவர்’ என்ற தனிப்படுத்தும் வலிமையையும், ἐλαχίστων என்பதன் நிலை அல்லது முக்கியத்துவம் சார்ந்த திறந்த பொருளையும், ἀδελφῶν என்பதன் ஆண்பால் பன்மையையும் காக்கிறது.
- source_word: ἐμοὶ ἐποιήσατε
  choice: எனக்கே செய்தீர்கள்
  rationale: ἐμοί மீது உள்ள வலியுறுத்தலை ‘எனக்கே’ மூலம் வெளிப்படுத்தி, சகோதரருக்குச் செய்த செயலும் அரசருக்குச் செய்த செயலுமாகிய அடையாளப்படுத்தலைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘என் சகோதரர்கள் இவர்கள்’ என்போரின் அடையாளம்
  choice: சீடர்கள், பொதுவாக விசுவாசிகள், அல்லது எளியோர்/பாதிக்கப்படக்கூடியோர் என்று குறிப்பாக வரையறுக்காமல் மூலத்தின் உறவுச் சொல்லைத் தக்கவைத்தல்
  alternative: ‘எளிய மக்கள்’, ‘தேவையிலிருப்போர்’ அல்லது ‘என் சீடர்கள்’ என்று வெளிப்படையாக விளக்குதல்
  rationale: வசனம் தானாகவே இந்த விளக்கக் கேள்வியை முடிவு செய்யவில்லை; ஆகவே மொழிபெயர்ப்பு இறையியல் பதற்றத்தைத் திறந்தவாறே வைக்கிறது.
- issue: ἀδελφῶν என்பதன் பாலின வடிவம்
  choice: சகோதரர்கள்
  alternative: சகோதர சகோதரிகள் / உடன்பிறந்தோர்
  rationale: கிரேக்கச் சொல் இலக்கணரீதியாக ஆண்பால் பன்மை. குழுவின் பரப்பு விவாதத்திற்குரியதால், மூலத்தில் இல்லாத பாலின விரிவாக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு புரியும் கண்ணியமான நடையில், அரசரின் முறையான தீர்ப்புரையின் தொனி காக்கப்பட்டுள்ளது. ‘மிகச் சிறியவர்கள்’ சமூக நிலை, முக்கியத்துவம், தாழ்மை ஆகிய சாத்திய நுணுக்கங்களைத் திறந்தவாறே வைக்கிறது.
