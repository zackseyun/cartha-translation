source:
  edition: SBLGNT
  text: καὶ φοβηθεὶς ἀπελθὼν ἔκρυψα τὸ τάλαντόν σου ἐν τῇ γῇ· ἴδε ἔχεις τὸ σόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/025.yaml
  text: And being afraid[a], I went away and hid your talent in the ground. Look, you have what is yours.
translation:
  language: ta
  text: நான் பயந்து போய், உமது தாலந்தை[a] நிலத்தில் மறைத்தேன். இதோ, உமக்குரியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘தாலந்து’ என்பது இயற்கையான திறமையைக் குறிக்கவில்லை; அது மிக உயர்ந்த மதிப்புடைய பண அலகு (எடை அலகாகவும் பயன்பட்ட சொல்). வேறுவிதமாக: ‘ஒரு பெருந்தொகைப் பணம்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβηθεὶς
  choice: பயந்து
  rationale: இது வினையெச்சமாக வந்து பணியாளனின் செயலுக்கான மனநிலையையும் காரணத்தையும் காட்டுகிறது. ‘பயந்து’ என்பது பக்தியுணர்வைத் தேவையின்றி சேர்க்காமல் அச்சத்தை நேரடியாகத் தெரிவிக்கிறது.
- source_word: ἀπελθὼν
  choice: போய்
  rationale: முதன்மை வினையான ἔκρυψα என்பதற்கு முன் நிகழ்ந்த செயலைக் குறிக்கும் வினையெச்சம். தமிழில் ‘போய் ... மறைத்துவைத்தேன்’ என்பது செயல்களின் வரிசையை இயல்பாகக் காக்கிறது.
- source_word: ἔκρυψα
  choice: மறைத்துவைத்தேன்
  rationale: κρύπτω என்பதன் நேரடிப் பொருள் மறைத்தல். அடுத்துள்ள ‘நிலத்தில்’ என்பது புதைத்ததைக் குறிப்பால் உணர்த்தினாலும், வினைச்சொல்லிலேயே ‘புதைத்தேன்’ என்று விளக்கிப் பொருள் சேர்க்காமல் இருக்க ‘மறைத்துவைத்தேன்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: τὸ τάλαντόν σου
  choice: உமது தாலந்து
  rationale: τάλαντον என்பது பெரும் மதிப்புடைய வரலாற்றுக் கால எடை மற்றும் பண அலகு. வரலாற்றுச் சொல்லைப் பாதுகாக்க ‘தாலந்து’ என ஒலிபெயர்த்து, அதன் பணப் பொருளை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
- source_word: ἐν τῇ γῇ
  choice: நிலத்தில்
  rationale: இங்கு γῆ என்பது பொருள் மறைக்கப்பட்ட தரை அல்லது மண்ணைக் குறிக்கிறது. ‘நிலத்தில்’ என்பது இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: ἴδε
  choice: இதோ
  rationale: கவனத்தை முன்னிலையிலுள்ள பொருளின் மீது திருப்பும் சுட்டுச்சொல். ‘இதோ’ என்பது சூழலுக்கு ஏற்ற இயல்பான தமிழ்.
- source_word: ἔχεις τὸ σόν
  choice: உமக்குரியது உம்மிடமே இருக்கிறது
  rationale: சொற்றொடர் சொற்படியாக ‘உமக்குரியதை நீர் வைத்திருக்கிறீர்’ என்ற உடைமை வலியுறுத்தலைக் கொண்டது. தேர்ந்த வடிவம் எஜமானின் சொத்தைத் திருப்பிக் கொடுப்பதாகப் பணியாளன் கூறும் வலியுறுத்தலை இயல்பாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: இயற்கைத் திறமையைக் குறிக்கும் சொல்லாகப் பிற்காலத்தில் புரிந்துகொள்ளப்படக்கூடிய τάλαντον என்பதன் பொருள்
  choice: முதன்மை உரையில் வரலாற்றுப் பண அலகைக் குறிக்கும் ‘தாலந்து’ என்பதை வைத்திருந்து, அடிக்குறிப்பில் அதன் பொருளை விளக்குதல்
  alternative: பெருந்தொகைப் பணம்
  rationale: இங்கு கிரேக்கச் சொல் இயற்கையான திறமையை அல்ல, மிக உயர்ந்த மதிப்புடைய எடை அல்லது பண அலகைக் குறிக்கிறது. வரலாற்றுச் சொல்லைப் பாதுகாப்பது உவமையின் இலக்கிய வடிவத்தைக் காக்கிறது; அடிக்குறிப்பு தவறான நவீனப் புரிதலைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எஜமானை நோக்கிய மரியாதையான ஒருமை வடிவங்களான ‘உமது’, ‘உமக்குரியது’, ‘உம்மிடமே’ பயன்படுத்தப்பட்டுள்ளன. உரை இயல்பாகவும் கண்ணியமாகவும் இருக்கும்படி வினையெச்சங்களின் வரிசை காக்கப்பட்டுள்ளது.
