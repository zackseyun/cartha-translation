source:
  edition: SBLGNT
  text: καὶ τὸν ἀχρεῖον δοῦλον ἐκβάλετε εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/030.yaml
  text: And throw the worthless servant into the outer darkness[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: ta
  text: “அந்தப் பயனற்ற அடிமையை[a] வெளிப்புற இருளுக்குள் தள்ளிவிடுங்கள். அங்கே அழுகையும் பற்கடிப்பும் இருக்கும்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பணியாளை.” கிரேக்கச் சொல் δοῦλος; அது “பணியாள்” அல்லது “அடிமை” எனப் பொருள்படலாம். இந்த உவமையில் எஜமான்–அடிமை உறவு முன்னிலையில் இருப்பதால் இங்கே “அடிமை” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀχρεῖον
  choice: பயனற்ற
  rationale: ஒருவரால் எவ்விதப் பயனும் விளையவில்லை என்ற எஜமானின் மதிப்பீட்டை இது வெளிப்படுத்துகிறது; தீர்ப்பின் கடுமையையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: δοῦλον
  choice: அடிமையை
  rationale: எஜமான்–அடிமை உறவு இந்த உவமையின் சூழலில் முக்கியமானது. ஆகவே பொதுவான ‘பணியாள்’ என்பதைக் காட்டிலும் ‘அடிமை’ சமூக உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐκβάλετε
  choice: தள்ளிவிடுங்கள்
  rationale: வலிமையான இறைமொழியின் திடீரான வெளியேற்றத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: σκότος τὸ ἐξώτερον
  choice: வெளியேயுள்ள இருள்
  rationale: ஆசீர்வாதம் அல்லது கொண்டாட்டம் நடைபெறும் இடத்திலிருந்து விலக்கப்படுவதை விளக்கமின்றி, மூலத்தின் இடவியல் உருவகத்தோடு தெரிவிக்கிறது.
- source_word: ἐκεῖ
  choice: அங்கே
  rationale: முன்னர் குறிப்பிடப்பட்ட வெளியேயுள்ள இருளைச் சுருக்கமாகவும் தெளிவாகவும் சுட்டுகிறது.
- source_word: κλαυθμὸς
  choice: அழுகை
  rationale: துயரத்தைத் தெரிவிக்கிறது; அதன் தீவிரம் அல்லது தன்மையை தேவையின்றி மிகைப்படுத்துவதில்லை.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: பற்கடிப்பு
  rationale: வேதத் தமிழில் அறியப்பட்ட, இயல்பான சுருக்கமான சொல்; வேதனை மற்றும்/அல்லது சினம் என்ற மூலச் சொற்றொடரின் சாத்தியமான நுட்பங்களைத் தீர்மானிக்காமல் காக்கிறது.
theological_decisions:
- issue: உவமையிலுள்ள தீர்ப்பின் உருவகத்தின் இயல்பு
  choice: விலக்கப்படுதலையும் வேதனையையும் காட்டும் மூல உருவகத்தை அப்படியே வைத்தல்
  alternative: இதை நேரடியாக நரகம் அல்லது இறுதித் தீர்ப்பு என்று விளக்குதல்; அல்லது தற்காலிகமான, வெறும் உருவக விலக்கலாகக் குறைத்தல்
  rationale: இது மத்தேயுவில் திரும்பத் திரும்ப வரும் தீர்ப்பு மொழியாக இருந்தாலும், வசனமே கூறுவதற்கு அப்பால் தண்டனையின் துல்லியமான இயல்பை மொழிபெயர்ப்பு நிர்ணயிக்கக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், கண்ணியமான நேரடி நடை. ‘வெளியேயுள்ள இருள்’ என்ற வடிவம் மூல உருவகத்தை விளக்கவுரையாக்காமல் காக்கிறது; ‘பற்கடிப்பு’ மரபில் அறியப்பட்டதாயினும் இன்றும் தெளிவாகப் புரியும் சொல்.
