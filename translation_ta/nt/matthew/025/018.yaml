source:
  edition: SBLGNT
  text: ὁ δὲ τὸ ἓν λαβὼν ἀπελθὼν ὤρυξεν ⸀γῆν καὶ ⸀ἔκρυψεν τὸ ἀργύριον τοῦ κυρίου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/018.yaml
  text: But the one who had received the one talent went away[a], dug in the ground, and hid his master's money.
translation:
  language: ta
  text: ஆனால், ஒரு தாலந்தைப் பெற்றவனோ போய், நிலத்தைத் தோண்டி, தன் எஜமானின் பணத்தை மறைத்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் நேரடியாக, “தன் எஜமானின் வெள்ளியை மறைத்தான்.”
    reason: ἀργύριον என்பதன் நேரடியான ‘வெள்ளி’ என்ற பொருளைப் பாதுகாக்கும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: ὁ δὲ
  choice: ஆனால், ... பெற்றவனோ
  rationale: δέ முந்தைய பணியாளர்களின் செயலுடன் உள்ள முரண்பாட்டைக் காட்டுகிறது; ‘ஆனால்’ என்பதும் ‘-ஓ’ என்ற எதிர்மறை ஒப்பீட்டு விகுதியும் தமிழில் அந்த வேறுபாட்டை இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: τὸ ἓν
  choice: ஒரு தாலந்தை
  rationale: கிரேக்கத்தில் ‘ஒன்று’ என்று மட்டும் இருந்தாலும், உடனடியான சூழலில் அது 25:15-இல் கூறப்பட்ட தாலந்தைக் குறிக்கிறது; தமிழில் தெளிவுக்காக ‘தாலந்து’ சேர்க்கப்பட்டுள்ளது.
- source_word: λαβὼν
  choice: பெற்றவன்
  rationale: எஜமானிடமிருந்து ஒப்படைக்கப்பட்ட தொகையைப் பெற்றதைக் குறிக்கிறது; முதன்மைச் செயல்களுக்கு முன் நிகழ்ந்த செயலைத் தமிழ் வினையாலணையும் பெயர் இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἀπελθὼν
  choice: போய்
  rationale: அவன் அங்கிருந்து சென்று பின்னர் செய்த செயல்களின் தொடரைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: ὤρυξεν γῆν
  choice: நிலத்தைத் தோண்டி
  rationale: நிலம் அல்லது மண்ணைத் தோண்டுதல் என்ற கிரேக்கச் சொல்லாக்கத்தை, ‘குழி’ என்பதை வெளிப்படையாகச் சேர்க்காமல், இயல்பான தமிழில் தருகிறது.
- source_word: ἔκρυψεν
  choice: மறைத்து வைத்தான்
  rationale: κρύπτω என்பதன் ‘மறைத்தல்’ என்ற பொருளைத் தருவதோடு, பணத்தை நிலத்தில் தொடர்ந்து மறைவாக வைத்த செயலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὸ ἀργύριον
  choice: பணம்
  rationale: ἀργύριον என்பதற்கு ‘வெள்ளி’ என்றும் ‘பணம்’ என்றும் பொருள் உண்டு; ஒப்படைக்கப்பட்ட செல்வத்தைப் பற்றிய இச்சூழலில் ‘பணம்’ நவீன வாசகருக்கு பொருளைத் தெளிவாகத் தருகிறது. ‘வெள்ளி’ என்ற சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: τοῦ κυρίου αὐτοῦ
  choice: தன் எஜமானுடைய
  rationale: இங்கு κύριος உவமைக் கதைக்குள் வரும் பணியாளரின் மனித எஜமானைக் குறிக்கிறது; ‘எஜமான்’ அதிகார உறவைத் தெளிவாகக் காட்டி, நேரடியான தெய்வீகப் பட்டப்பெயர் என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
theological_decisions:
- issue: உவமைக் கதையில் மனிதரைக் குறிக்கும் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: எஜமான்
  alternative: ஆண்டவர்
  rationale: உடனடியான கதையுலகில் இது பணியாளரின் மனித எஜமானைக் குறிக்கிறது. ‘ஆண்டவர்’ என்பது தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் தெய்வீகப் பட்டப்பெயராக எளிதில் புரிந்துகொள்ளப்படலாம்; ஆகவே ‘எஜமான்’ சமூக மற்றும் அதிகார உறவைத் தெளிவாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தாலந்து’ முந்தைய வசனத்தின் பண அலகைக் குறிக்கிறது. கிரேக்கத்தின் செயல் தொடரை ‘பெற்றவனோ போய், ... தோண்டி, ... மறைத்து வைத்தான்’ என்ற இயல்பான தமிழ் தொடரமைப்பு பாதுகாக்கிறது.
