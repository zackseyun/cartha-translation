id: MAT.25.12
reference: Matthew 25:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ἀμὴν λέγω ὑμῖν, οὐκ οἶδα ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/012.yaml
  text: But he answered[a], ‘Truly I tell you, I do not know you.’
translation:
  language: ta
  text: 'ஆனால் அவர் பதிலளித்து, “உண்மையாக உங்களுக்குச் சொல்கிறேன்: நான் உங்களை அறியேன்[a]” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் உங்களை அடையாளம் காணவில்லை.” கிரேக்கத்தில் நேரடியாக, “நான் உங்களை அறியேன்” என்று உள்ளது; சூழலில் இது உறவுசார் ஏற்றுக்கொள்ளாமையையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: அதற்கு அவர் … என்று பதிலளித்தார்
  rationale: பங்கேற்புவினை மற்றும் முற்றுவினை சேர்ந்த கிரேக்கக் கதைநடைச் சொற்றொடரை இயல்பான நவீனத் தமிழில் சுருக்கமாகத் தருகிறது. δέ முந்தைய வேண்டுகோளுக்கு மாறான பதிலைச் சுட்டுவதால் ‘அதற்கு’ என வழங்கப்பட்டது.
- source_word: Ἀμὴν
  choice: உண்மையாகவே
  rationale: இயேசுவின் வலியுறுத்தலான கூற்றைத் தெளிவான, கண்ணியமான நவீனத் தமிழில் தருகிறது; மூலத்தில் ஒருமுறை மட்டுமே வரும் சொல்லை இரட்டிப்பாக்கவில்லை.
- source_word: λέγω ὑμῖν
  choice: உங்களுக்குச் சொல்கிறேன்
  rationale: நேரடி உரையையும் இரண்டாம் நபர் பன்மை முகவரியையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: οὐκ οἶδα
  choice: எனக்குத் தெரியாது
  rationale: οἶδα என்பதன் அடிப்படைப் பொருளான ‘அறிதல்/தெரிதல்’ என்பதைக் காக்கிறது. சூழலில் உறவுசார் ஏற்றுக்கொள்ளாமை அல்லது அடையாளம் காணாமை இருக்கலாம்; அதை முதன்மை உரையில் மிகையாக விளக்கவில்லை.
- source_word: ὑμᾶς
  choice: உங்களை
  rationale: குழுவை நோக்கிய இரண்டாம் நபர் பன்மை செயப்படுபொருளைத் தமிழில் வெளிப்படையாகக் காட்டுகிறது.
theological_decisions:
- issue: ‘உங்களை எனக்குத் தெரியாது’ என்பதன் பொருள் வலிமை
  choice: எளிய ஆனால் உறவுசார் கனமுள்ள ‘உங்களை எனக்குத் தெரியாது’ என்ற மொழிபெயர்ப்பை வைத்திருத்தல்
  alternative: ‘உங்களை நான் அடையாளம் காணவில்லை’ அல்லது ‘உங்களோடு எனக்கு உறவு இல்லை’
  rationale: சூழலில் இச்சொற்றொடர் விலக்குதலையும் உறவுசார் மறுப்பையும் உணர்த்துகிறது. ஆனால் இரட்சிப்பைப் பற்றிய விரிவான கோட்பாட்டுக் கூற்றாக அதை மாற்றாமல், கிரேக்கத்தின் பதற்றத்தையும் மறைபொருளையும் காக்க வேண்டும்.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘எனக்குத் தெரியாது’ என்பது நடப்புத் தமிழில் இயல்பானது; அடிக்குறிப்பு அதன் நேரடி மற்றும் உறவுசார் நுணுக்கத்தைப் பதிவு செய்கிறது.
