revisions:
- from: 'அதற்கு அவர், “உண்மையாகவே உங்களுக்குச் சொல்கிறேன்: உங்களை எனக்குத் தெரியாது[a]” என்று பதிலளித்தார்.'
  to: 'ஆனால் அவர் பதிலளித்து, “உண்மையாக உங்களுக்குச் சொல்கிறேன்: நான் உங்களை அறியேன்[a]” என்றார்.'
  rationale: 'The revision restores the contrastive force of δέ and uses a direct Tamil equivalent for ‘I do not know you.’ It maintains the source’s ambiguity: the main text does not replace ‘know’ with the more interpretive ‘recognize,’ while the footnote records that contextual alternative.'
