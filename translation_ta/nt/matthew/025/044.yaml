id: MAT.25.44
reference: Matthew 25:44
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσονται καὶ αὐτοὶ λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα ἢ διψῶντα ἢ ξένον ἢ γυμνὸν ἢ ἀσθενῆ ἢ ἐν φυλακῇ καὶ οὐ διηκονήσαμέν σοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/044.yaml
  text: Then they too will answer, saying, ‘Lord, when did we see you hungry or thirsty or a stranger or naked or sick or in prison, and not serve you?’
translation:
  language: ta
  text: அப்போது அவர்களும் பதிலளித்து, “ஆண்டவரே, எப்போது நாங்கள் உம்மைப் பசியுள்ளவராகவோ, தாகமுள்ளவராகவோ, அந்நியராகவோ, ஆடையில்லாதவராகவோ, நோயுற்றவராகவோ, சிறையில் இருப்பவராகவோ கண்டு, உமக்குப் பணிவிடை செய்யாமல் இருந்தோம்[a]?” என்பார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“பணிவிடை செய்யாமல்” என்பதற்கு “சேவை செய்யாமல்” அல்லது “தேவைகளைக் கவனித்துக்கொள்ளாமல்” என்றும் மொழிபெயர்க்கலாம் (கிரேக்கம்: διακονέω).'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: நியாயத்தீர்ப்புக் காட்சியில் நிகழ்வுகளின் தொடர்ச்சியைக் குறிக்கும் இயல்பான காலச் சொல்.
- source_word: καὶ αὐτοὶ
  choice: அவர்களும்
  rationale: முந்தைய குழுவைப் போல இந்தக் குழுவும் பதிலளிக்கிறது என்ற இணைப்பையும் மென்மையான வலியுறுத்தலையும் தருகிறது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: κύριος என்பதன் விளிவேற்றுமை அழைப்பை மரியாதையுடனும் கிறிஸ்துவியல் ஒலிநயத்துடனும் இயல்பாகக் காக்கிறது.
- source_word: ξένον
  choice: அந்நியராக
  rationale: தன் குடும்பம் அல்லது சமூக வட்டத்திற்கு வெளியே இருந்து வரவேற்பு தேவைப்படும் ஒருவரைக் குறிக்கும் பரந்த சமூகப் பொருளைக் காக்கிறது; இனத்தைத் தேவையின்றிக் குறிப்பாக்கவில்லை.
- source_word: γυμνὸν
  choice: ஆடையில்லாதவராக
  rationale: γυμνός என்பதன் நேரடியான பொருளை நவீனத் தமிழில் இயல்பாகத் தருகிறது; போதிய ஆடை இல்லாத நிலையும் சூழலில் உள்ளடங்கலாம்.
- source_word: ἀσθενῆ
  choice: நோயுற்றவராக
  rationale: இந்த உடல் மற்றும் சமூகத் தேவைகளின் பட்டியலில் ‘பலவீனமானவர்’ என்பதைக் காட்டிலும் நோயுற்ற நிலையே பொருத்தமானது.
- source_word: διηκονήσαμέν σοι
  choice: உமக்குப் பணிவிடை செய்யாமல் இருந்தோம்
  rationale: διακονέω குறிக்கும் நடைமுறை உதவி மற்றும் சேவையை மரியாதையான, இயல்பான தமிழில் வெளிப்படுத்துகிறது; திருச்சபைப் பதவிப் பணியாகச் சுருக்கவில்லை.
theological_decisions:
- issue: இயேசுவை நோக்கிய κύριος என்ற பட்டம்
  choice: ஆண்டவரே
  alternative: ஐயா / தலைவரே
  rationale: மரியாதையான நேரடி அழைப்பையும் மத்தேயுவில் உள்ள கிறிஸ்துவியல் எதிரொலியையும் காக்கிறது; உரை கூறுவதைக் கடந்த விளக்கத்தைச் சேர்க்கவில்லை.
- issue: இறுதி வாக்கியத்தில் διακονέω என்பதன் வலிமை
  choice: உமக்குப் பணிவிடை செய்யாமல் இருந்தோம்
  alternative: உமக்குச் சேவை செய்யாமல் இருந்தோம் / உம்மைக் கவனித்துக்கொள்ளாமல் இருந்தோம்
  rationale: இரக்கத்தின் நடைமுறைச் செயல்களையும் அவை அரசருக்குச் செய்யப்பட்ட பணிவிடையாகக் கருதப்படுவதையும் காக்கிறது; ‘கவனித்துக்கொள்’ என்று குறுக்கவோ, சபை ஊழியம் என்று சிறப்பாக்கவோ இல்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. நேரடி உரையில் ‘உம்மை/உமக்கு’ பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் பட்டியல் அமைப்பும் இறுதிக் கேள்வியின் வலிமையும் காக்கப்பட்டுள்ளன.
