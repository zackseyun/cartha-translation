source:
  edition: SBLGNT
  text: Ὅταν δὲ ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ δόξῃ αὐτοῦ καὶ πάντες ⸀οἱ ἄγγελοι μετ’ αὐτοῦ, τότε καθίσει ἐπὶ θρόνου δόξης αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/031.yaml
  text: But when the Son of Man comes in his glory[a], and all the angels with him, then he will sit on his glorious throne.
translation:
  language: ta
  text: ஆனால், மனிதகுமாரன் தமது மகிமையில் வந்து, எல்லாத் தூதர்களும் அவரோடு வரும்போது, அவர் தமது மகிமைமிக்க அரியணையில்[a] அமர்வார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “தமது மகிமையின் அரியணையில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν
  choice: வரும்போது
  rationale: எதிர்காலத்தில் நடைபெறவுள்ள ஒரே நிகழ்வைக் குறிக்கும் காலநிலைத் தொடராக இயல்பான தமிழில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய உரையிலிருந்து அடுத்த கட்டத்துக்கு மாறும் மென்மையான எதிர்மறை அல்லது உரைமாற்றச் சாயலைத் தக்கவைக்கிறது.
- source_word: ἔλθῃ
  choice: வந்து
  rationale: ὅταν உடன் வரும் எதிர்கால நிகழ்வைத் தமிழின் இயல்பான வினையெச்சத் தொடரில் வெளிப்படுத்துகிறது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: இயேசுவின் நிலைபெற்ற பட்டப்பெயரையும் தானியேல் நூலுடனான தொடர்பையும் பாதுகாக்கிறது.
- source_word: ἐν τῇ δόξῃ αὐτοῦ
  choice: தமது மகிமையில்
  rationale: வெளிப்படும் மாட்சியையும் கனத்தையும் குறிக்கும் δόξα என்பதன் வேதாகமச் சாயலை ‘மகிமை’ தக்கவைக்கிறது.
- source_word: πάντες οἱ ἄγγελοι
  choice: எல்லாத் தூதர்களும்
  rationale: மூலத்தில் உடைமைப்பெயர் இல்லாததால் ‘அவருடைய தூதர்கள்’ என்று சேர்க்காமல், ‘எல்லாத் தூதர்களும்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: μετ’ αὐτοῦ
  choice: அவரோடு
  rationale: உடன்வருதலை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τότε
  choice: அவர் ... அமர்வார்
  rationale: தமிழ் ‘வரும்போது’ அமைப்பிலேயே அடுத்துச் சம்பவிக்கும் விளைவு தெளிவாக இருப்பதால், தனியே ‘அப்போது’ சேர்க்காமல் இயல்பான தொடராக்கப்பட்டுள்ளது.
- source_word: καθίσει
  choice: அமர்வார்
  rationale: எதிர்காலச் செயலை நேரடியாகக் கூறுகிறது; மரியாதை ஒருமை நடையையும் பேணுகிறது.
- source_word: ἐπὶ θρόνου
  choice: அரியணையில்
  rationale: அரச அதிகாரத்தைக் குறிக்கும் θρόνος என்பதையும், அதன் மேல் அமர்வதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: θρόνου δόξης αὐτοῦ
  choice: தமது மகிமைமிக்க அரியணையில்
  rationale: உடைமை மற்றும் மகிமையால் சிறப்பிக்கப்படும் அரியணை என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது; வடிவத்துக்கு நெருக்கமான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου என்ற கிறிஸ்துவியல் பட்டப்பெயர்
  choice: மனிதகுமாரன்
  alternative: மனிதனானவர்
  rationale: நிலைபெற்ற பட்டப்பெயரைத் தக்கவைத்து, தானியேல் 7 பின்னணியையும் இப்பகுதியின் மேசியா மற்றும் நீதித்தீர்ப்பு சார்ந்த பொருளையும் பாதுகாக்கிறது.
- issue: θρόνου δόξης αὐτοῦ என்ற மரபுத்தொடர்
  choice: தமது மகிமைமிக்க அரியணை
  alternative: தமது மகிமையின் அரியணை
  rationale: அரச மற்றும் நீதித்தீர்ப்பு அதிகாரத்தை இயல்பான தமிழில் தெரிவிக்கிறது; மூல அமைப்புக்கு நெருக்கமான வாசகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவைக் குறிக்கும் இடங்களில் மரியாதை ஒருமை பேணப்பட்டுள்ளது; மூலத்தில் இல்லாத ‘அவருடைய’ என்ற உடைமைச்சொல் தூதர்களோடு சேர்க்கப்படவில்லை.
