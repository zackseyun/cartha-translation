id: MAT.25.36
reference: Matthew 25:36
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: γυμνὸς καὶ περιεβάλετέ με, ἠσθένησα καὶ ἐπεσκέψασθέ με, ἐν φυλακῇ ἤμην καὶ ἤλθατε πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/036.yaml
  text: I was naked and you clothed me[a]; I was sick and you visited me[b]; I was in prison and you came to me.
translation:
  language: ta
  text: நான் உடையின்றி இருந்தேன்; நீங்கள் எனக்கு உடை அணிவித்தீர்கள். நான் நோயுற்றிருந்தேன்; நீங்கள் என்னைப் பார்க்க வந்தீர்கள்[a]. நான் சிறையில் இருந்தேன்; நீங்கள் என்னிடம் வந்தீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னைக் கவனித்துக்கொண்டீர்கள்”; இங்குள்ள கிரேக்க வினைச்சொல் அக்கறையுடன் வந்து பார்த்தல் அல்லது கவனித்தல் என்ற பொருளையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυμνὸς
  choice: உடையின்றி
  rationale: ஆடையில்லாத நிலையைக் குறிக்கும் கிரேக்கச் சொல்லை நேரடியாகவும், இன்றைய தமிழில் கண்ணியமாகவும் வெளிப்படுத்துகிறது; போதிய உடையின்மை என்ற சூழல்சார் நிழற்பொருளையும் மறுப்பதில்லை.
- source_word: περιεβάλετέ
  choice: எனக்கு உடை அணிவித்தீர்கள்
  rationale: ஒருவர்மேல் அல்லது ஒருவரைச் சுற்றி ஆடை போடுதல் என்ற பொருளை இயல்பான தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: ἠσθένησα
  choice: நான் நோயுற்றிருந்தேன்
  rationale: இச்சூழலில் பொதுவான பலவீனத்தைவிட உடல்நோயைக் குறிப்பதே இயல்பான வாசிப்பு; தமிழ் வாக்கியத்தில் நிலையைச் சீராக வெளிப்படுத்துகிறது.
- source_word: ἐπεσκέψασθέ
  choice: என்னைப் பார்க்க வந்தீர்கள்
  rationale: வருகை தந்து சந்தித்தல் என்ற அடிப்படைப் பொருளை இயல்பான தமிழில் தருகிறது; அக்கறையுடன் கவனித்தல் என்ற சாத்தியமான நிழற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: φυλακῇ
  choice: சிறையில்
  rationale: காவலில் அடைக்கப்பட்டிருக்கும் இடத்தைக் குறிக்கும் இச்சொல்லுக்கு நவீனத் தமிழில் வழக்கமான, பரந்த பொருளுடைய இணைச்சொல்.
- source_word: ἤλθατε πρός με
  choice: நீங்கள் என்னிடம் வந்தீர்கள்
  rationale: கிரேக்கத்தின் எளிய, நேரடியான சொல்லமைப்பைப் பாதுகாக்கிறது; ‘சந்திக்க’ அல்லது ‘பார்க்க’ போன்ற கூடுதல் கருத்துகளைச் சேர்க்கவில்லை.
theological_decisions:
- issue: இரக்கச் செயல்களை விளக்கி விரிவாக்கும் அளவு
  choice: ‘உடை அணிவித்தீர்கள்,’ ‘பார்க்க வந்தீர்கள்,’ ‘என்னிடம் வந்தீர்கள்’ என்ற கண்கூடான செயல்களை வேறுபாட்டுடன் வைத்திருத்தல்
  alternative: ‘என்னைக் கவனித்துக்கொண்டீர்கள்’ அல்லது ‘சிறையில் என்னைப் பார்க்க வந்தீர்கள்’ என்று விரிவாக்குதல்
  rationale: மூலவாக்கியம் எளிய செயல்களை நேரடியாகக் கூறுகிறது. அவற்றை மேய்ப்புப்பணி சார்ந்தோ கோட்பாடு சார்ந்தோ விரிவாக்காமல் இருப்பது மூலத்தின் தெளிவையும், இரண்டாம் மற்றும் மூன்றாம் கூறுகளுக்கிடையிலான சொல் வேறுபாட்டையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நிர்வாணமாக’ என்பதற்குப் பதிலாக ‘உடையின்றி’ என்பது நேரடித்தன்மையையும் சூழலுக்கேற்ற கண்ணியத்தையும் இணைக்கிறது; தொடர்ச்சியான மூன்று கூறுகளும் தெளிவான தமிழ்ச் சொற்றொடர்களாக அமைக்கப்பட்டுள்ளன.
