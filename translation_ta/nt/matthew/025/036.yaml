  source_fidelity: 'மூலக் கிரேக்கத்தின் மூன்று இணைச் செயல்களும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன: γυμνός—‘உடையின்றி’, περιεβάλετέ—‘உடை அணிவித்தீர்கள்’, ἠσθένησα—‘நோயுற்றிருந்தேன்’, ἐπεσκέψασθέ—‘என்னைப் பார்க்க வந்தீர்கள்’, φυλακῇ—‘சிறையில்’, ἤλθατε πρός με—‘என்னிடம் வந்தீர்கள்’. குறிப்பாக இரண்டாவது கூறின் வருகை/பார்த்தல் மற்றும் மூன்றாவது கூறின் எளிய ‘வந்தீர்கள்’ என்ற வேறுபாடு முறையாகக் காக்கப்பட்டுள்ளது.'
