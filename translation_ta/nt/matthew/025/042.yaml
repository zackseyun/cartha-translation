source:
  edition: SBLGNT
  text: ἐπείνασα γὰρ καὶ οὐκ ἐδώκατέ μοι φαγεῖν, ⸀ἐδίψησα καὶ οὐκ ἐποτίσατέ με,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/042.yaml
  text: For I was hungry and you gave me nothing to eat[a]; I was thirsty and you gave me nothing to drink.
translation:
  language: ta
  text: ஏனெனில், நான் பசியாயிருந்தேன்; நீங்கள் எனக்குச் சாப்பிட எதுவும் கொடுக்கவில்லை. நான் தாகமாயிருந்தேன்; நீங்கள் எனக்குக் குடிக்க எதுவும் கொடுக்கவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπείνασα
  choice: நான் பசியாயிருந்தேன்
  rationale: இறந்தகாலப் பசியின் நிலையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள நியாயத்தீர்ப்புக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐδώκατέ μοι φαγεῖν
  choice: நீங்கள் எனக்குச் சாப்பிட எதுவும் கொடுக்கவில்லை
  rationale: ‘எனக்குச் சாப்பிடக் கொடுக்கவில்லை’ என்ற கிரேக்க அமைப்பை இயல்பான தமிழில் வெளிப்படுத்தி, μοι என்பதன் தனிப்பட்ட நோக்கையும் காக்கிறது.
- source_word: φαγεῖν
  choice: சாப்பிட
  rationale: பெயர்ச்சொல்லான ‘உணவு’ என்பதற்குப் பதிலாக வினை வடிவைத் தக்கவைத்து, மூலத்தின் அமைப்பை நெருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: ἐδίψησα
  choice: நான் தாகமாயிருந்தேன்
  rationale: ἐπείνασα என்பதற்கு இணையான இறந்தகால நிலையையும் இரு கூறுகளின் ஒத்த அமைப்பையும் காக்கிறது.
- source_word: ἐποτίσατέ με
  choice: நீங்கள் எனக்குக் குடிக்க எதுவும் கொடுக்கவில்லை
  rationale: இச்சூழலில் ποτίζω என்பதன் ‘குடிக்கக் கொடு’ என்ற பொருளை இயல்பாகத் தருகிறது; உணவு வழங்காததுடன் உள்ள இணை அமைப்பையும் காக்கிறது.
theological_decisions:
- issue: மறுக்கப்பட்ட உதவியை எவ்வளவு வெளிப்படையாக மொழிபெயர்ப்பது
  choice: இரு கூறுகளிலும் ‘எனக்குச் சாப்பிட/குடிக்க எதுவும் கொடுக்கவில்லை’ என்று மொழிபெயர்த்தல்
  alternative: ‘எனக்குச் சாப்பிட/குடிக்கக் கொடுக்கவில்லை’
  rationale: இது கிரேக்கத்தின் பொருளைத் தெளிவான நவீனத் தமிழில் தருகிறது; அதேவேளையில், இயேசுவுக்கு இரக்கம் காட்டாமல் விட்டதன் தனிப்பட்ட தீவிரத்தையும் குறைக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் தெளிவும் கொண்ட பொதுவாசகர் நடைக்கு ஏற்ற மொழி. ‘பசியாயிருந்தேன்/தாகமாயிருந்தேன்’ என்ற இணை வடிவம் மூலத்தின் சமச்சீரைத் தக்கவைக்கிறது.
