id: MAT.25.7
reference: Matthew 25:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τότε ἠγέρθησαν πᾶσαι αἱ παρθένοι ἐκεῖναι καὶ ἐκόσμησαν τὰς λαμπάδας ⸀ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/007.yaml
  text: Then all those virgins got up and trimmed their lamps[a].
translation:
  language: ta
  text: அப்போது அந்தக் கன்னிப்பெண்கள் அனைவரும் எழுந்து, தங்கள் விளக்குகளை ஆயத்தப்படுத்தினார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“விளக்குகள்” என்பதற்குப் பதிலாக “தீப்பந்தங்கள்” என்றும் மொழிபெயர்க்கலாம் (கிரேக்கம்: λαμπάδας). இச்சொல் கையில் எடுத்துச் செல்லும் ஒளிச்சாதனத்தைக் குறிக்கலாம்; எண்ணெயும் ஆயத்தப்படுத்துதலும் பற்றிய சூழல் இரு மொழிபெயர்ப்புகளுக்கும் இடமளிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: கதையின் அடுத்த நிகழ்வைக் குறிக்கும் கால வினையடை; நவீன தமிழில் இயல்பான தொடர்ச்சியைத் தருகிறது.
- source_word: ἠγέρθησαν
  choice: எழுந்து
  rationale: உறக்கத்திலிருந்து அல்லது படுத்திருந்த நிலையிலிருந்து எழுவதைக் குறிக்கிறது; செயலின் நேரடியான பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πᾶσαι αἱ παρθένοι ἐκεῖναι
  choice: அந்தக் கன்னிப்பெண்கள் அனைவரும்
  rationale: παρθένοι என்பதன் திருமணச் சூழலுக்குரிய குறிப்பான பொருளைப் பேணுகிறது; 'அனைவரும்' πᾶσαι என்பதன் முழுமையைக் காட்டுகிறது.
- source_word: ἐκόσμησαν
  choice: ஆயத்தப்படுத்தினார்கள்
  rationale: அடிப்படையில் ஒழுங்குபடுத்துதல் அல்லது தயார்படுத்துதல் எனப் பொருள்படும். திரி வெட்டுதல் மட்டுமே உரையில் வெளிப்படையாகக் கூறப்படாததால், விளக்குகளைப் பயன்பாட்டுக்கு ஆயத்தப்படுத்திய செயலைப் பரந்தும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: λαμπάδας
  choice: விளக்குகளை
  rationale: எண்ணெயும் ஆயத்தப்படுத்துதலும் இடம்பெறும் உடனடிச் சூழலில் 'விளக்குகள்' இயல்பாகப் பொருந்துகிறது; 'தீப்பந்தங்கள்' என்பதும் சாத்தியமான பொருள் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἑαυτῶν
  choice: தங்கள்
  rationale: எழுவாயையே திரும்பச் சுட்டும் பன்மைத் தற்சுட்டுப் பெயர்ச்சொல்லின் உடைமைப் பொருளைத் தமிழில் துல்லியமாக வெளிப்படுத்துகிறது.
