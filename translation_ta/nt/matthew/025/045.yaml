review_pass:
  verdict: revise
  source_fidelity: The draft retains the future reply, solemn affirmation, representative singular ('one'), negated parallelism, and the direct identification of neglect toward the least with neglect toward Jesus. However, 'மிகச் சிறியவர்களான இவர்களில் ஒருவருக்கு' is grammatically less idiomatic and slightly obscures the Greek construction 'one of these least [ones].'
  naturalness: The current wording is generally clear, but 'அவர் அவர்களுக்குப் பதிலளித்து … என்று சொல்வார்' is redundant in modern Tamil, and the placement of 'மிகச் சிறியவர்களான' is awkward. A compact finite speech verb makes the judicial declaration more natural without reducing its formality.
  terminology: ‘உண்மையாக’ suitably conveys the force of Ἀμήν in the text, while the formal ‘ஆமென்’ alternative is properly retained in the footnote. ‘இந்த மிகச் சிறியவர்களில் ஒருவருக்கு’ naturally preserves the open referent and representative singular. The interpretive footnote appropriately does not resolve whether the group is disciples specifically or needy people broadly.
  issues:
  - severity: medium
    issue: Awkward rendering of ἑνὶ τούτων τῶν ἐλαχίστων
    rationale: ‘மிகச் சிறியவர்களான இவர்களில் ஒருவருக்கு’ places the descriptive phrase before ‘இவர்களில்’ in a way that is less natural in Tamil. ‘இந்த மிகச் சிறியவர்களில் ஒருவருக்கு’ directly and idiomatically expresses ‘to one of these least [ones].’
  - severity: low
    issue: Redundant speech construction
    rationale: ‘பதிலளித்து … என்று சொல்வார்’ duplicates the act of speaking. ‘பதிலளித்து … என்பார்’ is natural modern standard Tamil and retains the attendant-speech sense.
  revised_text: 'அப்போது அவர் அவர்களுக்குப் பதிலளித்து, “உண்மையாக[a] உங்களுக்குச் சொல்கிறேன்: இந்த மிகச் சிறியவர்களில் ஒருவருக்கு நீங்கள் இதைச் செய்யாத அளவுக்கு, எனக்கும் இதைச் செய்யவில்லை” என்பார்.'
