source:
  edition: SBLGNT
  text: τότε ἀποκριθήσεται αὐτοῖς λέγων· Ἀμὴν λέγω ὑμῖν, ἐφ’ ὅσον οὐκ ἐποιήσατε ἑνὶ τούτων τῶν ἐλαχίστων, οὐδὲ ἐμοὶ ἐποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/045.yaml
  text: Then he will answer them[a], saying, ‘Truly I say to you, insofar as you did not do it for one of the least of these[b], neither did you do it for me.’
translation:
  language: ta
  text: 'அப்போது அவர் அவர்களுக்குப் பதிலளித்து, “உண்மையாக[a] உங்களுக்குச் சொல்கிறேன்: இந்த மிகச் சிறியவர்களில் ஒருவருக்கு நீங்கள் இதைச் செய்யாத அளவுக்கு, எனக்கும் இதைச் செய்யவில்லை” என்பார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சார்ந்த முறையில், “ஆமென், உங்களுக்குச் சொல்கிறேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: நியாயத்தீர்ப்புக் காட்சியில் அடுத்த நிகழ்வை இயல்பாகக் குறிக்கிறது.
- source_word: ἀποκριθήσεται αὐτοῖς λέγων
  choice: அவர் அவர்களுக்குப் பதிலளித்து … என்று சொல்வார்
  rationale: எதிர்கால வினையையும் உடனிகழ் பேச்சைக் குறிக்கும் பங்கேற்பு வடிவத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: உண்மையாகவே உங்களுக்குச் சொல்கிறேன்
  rationale: இயேசுவின் வலியுறுத்தல்மிக்க உறுதிமொழிச் சூத்திரத்தைத் தெளிவான நவீன தமிழில் தருகிறது; ‘ஆமென்’ என்ற சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐφ’ ὅσον
  choice: செய்யாத அளவுக்கு
  rationale: வெறும் காரணவாக்கியமாக மாற்றாமல், கிரேக்கச் சொற்றொடரிலுள்ள அளவு அல்லது தொடர்பின் நுட்பத்தை இயன்றவரைத் தக்கவைக்கிறது.
- source_word: οὐκ ἐποιήσατε
  choice: நீங்கள் இதைச் செய்யவில்லை
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட இரக்கச் செயல்களை ‘இதை’ என்பதன் மூலம் இயல்பாகச் சுட்டுகிறது.
- source_word: ἑνὶ τούτων τῶν ἐλαχίστων
  choice: மிகச் சிறியவர்களான இவர்களில் ஒருவருக்கு
  rationale: குழுவிலுள்ள ஒருவரைக் குறிக்கும் ஒருமையையும் ἐλάχιστος என்பதன் மிகையுயர்நிலைப் பொருளையும் காக்கிறது.
- source_word: οὐδὲ ἐμοὶ ἐποιήσατε
  choice: எனக்கும் இதைச் செய்யவில்லை
  rationale: முந்தைய மறுப்புடன் நேரான இணைப்பையும் இயேசுவோடு செய்யப்படும் அடையாளப்படுத்தலின் வலிமையையும் காக்கிறது.
theological_decisions:
- issue: ‘மிகச் சிறியவர்களான இவர்கள்’ யார் என்பது
  choice: அந்தச் சொற்றொடரை வரையறுக்காமல் அப்படியே வைத்தல்
  alternative: இவர்கள் குறிப்பாக இயேசுவின் சீடர்கள் அல்லது தூதர்கள் என்று கூறுதல்; அல்லது பொதுவாகத் தாழ்ந்தவர்களும் தேவையுள்ளவர்களும் என்று கூறுதல்
  rationale: வசனம் அவர்களில் ஒருவருக்குச் செய்யாததை இயேசுவுக்குச் செய்யாததாக நேரடியாக அடையாளப்படுத்துகிறது; ஆனால் அந்தக் குழுவின் எல்லையை இவ்வசனம் மட்டும் உறுதியாக வரையறுப்பதில்லை. எனவே விளக்க வேறுபாடு மொழிபெயர்ப்பில் தீர்மானிக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. நீதித்தீர்ப்புக் காட்சியின் solemn tone காக்கப்பட்டாலும் தேவையற்ற பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
