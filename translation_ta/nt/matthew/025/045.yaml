revisions:
- from: 'அப்போது அவர் அவர்களுக்குப் பதிலளித்து, “உண்மையாகவே[a] உங்களுக்குச் சொல்கிறேன்: மிகச் சிறியவர்களான இவர்களில் ஒருவருக்கு[b] நீங்கள் இதைச் செய்யாத அளவுக்கு, எனக்கும் இதைச் செய்யவில்லை” என்று சொல்வார்.'
  to: 'அப்போது அவர் அவர்களுக்குப் பதிலளித்து, “உண்மையாக[a] உங்களுக்குச் சொல்கிறேன்: இந்த மிகச் சிறியவர்களில் ஒருவருக்கு நீங்கள் இதைச் செய்யாத அளவுக்கு, எனக்கும் இதைச் செய்யவில்லை” என்பார்.'
  rationale: The revision improves Tamil idiom and clarifies the Greek noun phrase while preserving the source's extent-related ‘insofar as’ construction, its implied object, and its unresolved referent. Footnote b is retained as an interpretive note, but its anchor is moved to ‘மிகச் சிறியவர்கள்,’ the phrase it explains.
