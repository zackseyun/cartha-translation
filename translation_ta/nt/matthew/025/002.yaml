  text: πέντε δὲ ⸂ἐξ αὐτῶν ἦσαν⸃ ⸂μωραὶ καὶ πέντε φρόνιμοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/002.yaml
  text: And five of them were foolish, and five were wise.
translation:
  language: ta
  text: அவர்களில் ஐந்து பேர் புத்தியில்லாதவர்களாகவும், ஐந்து பேர் விவேகமுள்ளவர்களாகவும் இருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέντε
  choice: ஐந்து பேர்
  rationale: ஐந்து என்ற எண்ணை நேரடியாகக் கொடுத்து, பெண்களைக் குறிக்கும் தமிழின் இயல்பான ஆளெண்ணுச் சொல்லான ‘பேர்’ சேர்க்கப்பட்டுள்ளது; கிரேக்கத்தின் சமநிலையான எதிர்மறை அமைப்பைப் பேண இருமுறையும் வழங்கப்பட்டுள்ளது.
- source_word: δὲ
  choice: -ஆகவும்
  rationale: இங்கு δέ வலுவான எதிர்மறை இணைப்பல்ல; முந்தைய வசனத்துடன் தொடரும் விவரிப்பைத் தமிழ் வாக்கிய அமைப்பிலுள்ள இணைநிலை ‘-ஆகவும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐξ αὐτῶν
  choice: அவர்களில்
  rationale: முன்பு குறிப்பிடப்பட்ட குழுவிலிருந்து ஒரு பகுதியினரைச் சுட்டும் பங்கீட்டுப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἦσαν
  choice: இருந்தார்கள்
  rationale: εἰμί என்பதன் இறந்தகால விவரிப்பு இங்கு இணைப்புவினையாக உள்ளது; மனிதர்களுக்குரிய மரியாதைப் பன்மையுடன் இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: μωραὶ
  choice: புத்தியில்லாதவர்களாக
  rationale: சரியான உணர்வும் தீர்மானமும் இல்லாத முட்டாள்தனத்தைச் சுட்டும் μωρός என்பதன் பொருளை, நவீன வாசகருக்கு புரியும் இயல்பான தமிழில் தருகிறது.
- source_word: φρόνιμοι
  choice: விவேகமுள்ளவர்களாக
  rationale: φρόνιμος குறிக்கும் அறிவார்ந்த, முன்யோசனையுள்ள, நடைமுறை விவேகத்தை வெளிப்படுத்துகிறது; ‘புத்தியில்லாத’ என்பதுடனான எதிர்மறைத் தொடர்பும் தெளிவாக உள்ளது.
