  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கத்தின் ‘ஐந்து—ஐந்து’ சமநிலையும் இரு குழுக்களுக்கிடையிலான எதிர்மறையும் பாதுகாக்கப்பட்டுள்ளன.
