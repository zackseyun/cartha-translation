source:
  edition: SBLGNT
  text: αἱ δὲ μωραὶ ταῖς φρονίμοις εἶπαν· Δότε ἡμῖν ἐκ τοῦ ἐλαίου ὑμῶν, ὅτι αἱ λαμπάδες ἡμῶν σβέννυνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/008.yaml
  text: But the foolish said to the wise[a], ‘Give us some of your oil, because our lamps are going out.’
translation:
  language: ta
  text: ஆனால் மதியற்றவர்கள் விவேகமுள்ளவர்களிடம், “உங்கள் எண்ணெயில் கொஞ்சம் எங்களுக்குக் கொடுங்கள்; ஏனெனில் எங்கள் விளக்குகள்[a] அணைந்துகொண்டிருக்கின்றன” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘விளக்குகள்’ என்பதற்குப் பதிலாக ‘தீப்பந்தங்கள்’ என்றும் மொழிபெயர்க்கலாம் (கிரேக்கம்: λαμπάδες). இச்சொல் கையில் எடுத்துச் செல்லப்படும் எரியும் ஒளிச்சாதனத்தைக் குறிக்கக்கூடும்; நிகழ்வை எவ்வாறு புரிந்துகொள்கிறார்கள் என்பதற்கேற்ப மொழிபெயர்ப்புகள் வேறுபடுகின்றன.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μωραὶ
  choice: அறிவில்லாதவர்கள்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட இந்தப் பெயரடை, உவமையில் ஆயத்தமின்றி இருந்த கன்னிப்பெண்களைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும், φρονίμοις என்பதுடனான வேறுபாட்டைத் தெளிவாகவும் காட்டுகிறது.
- source_word: φρονίμοις
  choice: விவேகமுள்ளவர்களிடம்
  rationale: இச்சூழலில் நடைமுறை விவேகத்தையும் முன்னாயத்தத்தையும் குறிக்கிறது; ‘விவேகமுள்ளவர்கள்’ என்பது பொருளை மிகைப்படுத்தாமல் எடுத்துரைக்கிறது.
- source_word: Δότε
  choice: கொடுங்கள்
  rationale: δίδωμι என்பதன் பன்மை ஏவல் வடிவத்தின் நேரடியான வேண்டுகோள் அல்லது கட்டளையின் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: ἐκ τοῦ ἐλαίου ὑμῶν
  choice: உங்கள் எண்ணெயில் கொஞ்சம்
  rationale: ἐκ உடன் வரும் இப்பயன்பாடு அவர்களுடைய எண்ணெய்க் கையிருப்பிலிருந்து ஒரு பகுதியைக் கேட்பதைக் குறிக்கிறது; ‘கொஞ்சம்’ என்பது அந்தப் பகுதிப்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: λαμπάδες
  choice: விளக்குகள்
  rationale: λαμπάς என்பது விளக்கு அல்லது தீப்பந்தம் என இருவகையாகப் பொருள்படலாம். எண்ணெய் இடம்பெறும் இவ்வுவமையில் ‘விளக்குகள்’ இயல்பான முதன்மைத் தேர்வு; உண்மையான சொற்பொருள் மாற்று அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: σβέννυνται
  choice: அணைந்துகொண்டிருக்கின்றன
  rationale: நிகழ்கால வடிவம் தீ அணையும் செயல் நடந்துகொண்டிருப்பதைக் காட்டுகிறது; இந்தத் தமிழ் வடிவம் அந்தத் தொடர்நிலையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ὅτι
  choice: என்பதற்கான காரண உறவு வாக்கிய அமைப்பில் வெளிப்படுத்தப்பட்டது
  rationale: தமிழில் காரணத்தை முதலில் கூறி, பின்னர் வேண்டுகோளை வைப்பது இயல்பானது. ஆகவே தனியான ‘ஏனெனில்’ என்பதற்குப் பதிலாக ‘அணைந்துகொண்டிருக்கின்றன; ... கொடுங்கள்’ என்ற அமைப்பு காரண உறவைத் தெளிவாக உணர்த்துகிறது.
