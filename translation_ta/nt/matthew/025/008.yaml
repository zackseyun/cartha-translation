translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. கிரேக்க வாக்கியத்தின் காரணத்திற்குப் பின் வேண்டுகோள் வரும் வரிசை, தமிழின் இயல்புக்காக காரணம் முதலில் வருமாறு மாற்றப்பட்டது; பொருள் மாற்றப்படவில்லை.
