review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the groups, the partitive request for oil, and the ongoing extinguishing of the lamps. However, the explicit causal conjunction ὅτι (‘because/for’) is only implied by punctuation and word order; it should be stated in an optimal-equivalence rendering.
  naturalness: The Tamil is generally clear and modern. Restoring the request-before-reason order is also fully natural in Tamil when joined with ‘ஏனெனில்’.
  terminology: ‘அறிவில்லாதவர்கள்’ can suggest people who lack knowledge rather than the prudential/moral sense of μωραὶ. ‘மதியற்றவர்கள்’ more closely and idiomatically preserves the contrast with ‘விவேகமுள்ளவர்கள்’ without importing a doctrinal interpretation. ‘விளக்குகள்’ is appropriate, with the lexical alternative retained in the footnote.
  issues:
  - severity: medium
    issue: The causal force of ὅτι is not explicitly translated.
    rationale: A semicolon after ‘அணைந்துகொண்டிருக்கின்றன’ permits the causal connection to be inferred, but the Greek expressly gives the reason for the request. ‘ஏனெனில்’ preserves this semantic link.
  - severity: low
    issue: ‘அறிவில்லாதவர்கள்’ is less precise for μωραὶ.
    rationale: It may denote lack of information or education. In this parabolic contrast, ‘மதியற்றவர்கள்’ naturally conveys foolish lack of practical judgment.
  revised_text: ஆனால் மதியற்றவர்கள் விவேகமுள்ளவர்களிடம், “உங்கள் எண்ணெயில் கொஞ்சம் எங்களுக்குக் கொடுங்கள்; ஏனெனில் எங்கள் விளக்குகள்[a] அணைந்துகொண்டிருக்கின்றன” என்றார்கள்.
