source:
  edition: SBLGNT
  text: ⸀πορευθεὶς ὁ τὰ πέντε τάλαντα λαβὼν ἠργάσατο ἐν αὐτοῖς καὶ ⸀ἐκέρδησεν ἄλλα ⸀πέντε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/016.yaml
  text: The one who had received the five talents went and worked with them[b][a], and gained another five.
translation:
  language: ta
  text: ஐந்து தாலந்துகளைப்[a] பெற்றவன் போய், அவற்றைக் கொண்டு தொழில் செய்து[b], மேலும் ஐந்து தாலந்துகளை ஈட்டினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஒரு தாலந்து என்பது இயல்பான திறமை அல்ல; அது மிகப் பெரிய பண அலகு.
    reason: cultural_note
  - marker: b
    text: 'வேறுவிதமாக: ‘அவற்றை வைத்து வேலை செய்து.’ பெற்ற பணத்தை லாபம் ஈட்டுவதற்குப் பயன்படுத்தியதை கிரேக்கம் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθεὶς
  choice: போய்
  rationale: இறந்தகாலப் பெயரெச்சத்தின் செயல்வரிசையை இயல்பான தமிழில் காட்டுகிறது; மூலத்தில் இல்லாத ‘உடனே’ என்ற கருத்தைச் சேர்க்கவில்லை.
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: ஐந்து தாலந்துகளைப் பெற்றவன்
  rationale: பெற்ற தொகையின் அடிப்படையில் அந்தப் பணியாளரை அடையாளப்படுத்தும் கிரேக்கக் கட்டமைப்பைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: τάλαντα
  choice: தாலந்துகளை
  rationale: பெரிய பண அளவைக் குறிக்கும் மூலச் சொல்லைப் பாதுகாக்கிறது; இது இயல்பான திறமையைக் குறிக்கவில்லை என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: ἠργάσατο ἐν αὐτοῖς
  choice: அவற்றைக் கொண்டு தொழில் செய்து
  rationale: பெற்ற பணத்தை லாபத்திற்காகச் செயல்படச் செய்ததைத் தெரிவிக்கிறது; குறிப்பிட்ட ஒரு வணிக முறையை மூலத்தைவிடத் துல்லியமாக நிர்ணயிப்பதில்லை.
- source_word: ἐκέρδησεν
  choice: ஈட்டினான்
  rationale: இச்சூழலில் κερδαίνω குறிக்கும் லாபம் அல்லது கூடுதல் வருவாய் பெறுதலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἄλλα πέντε
  choice: மேலும் ஐந்து தாலந்துகளை
  rationale: கூடுதலாக ஐந்து கிடைத்தது என்பதைத் தெளிவாகக் காட்டுகிறது; தமிழில் தெளிவுக்காக ‘தாலந்துகளை’ மீண்டும் குறிப்பிடுகிறது.
