  naturalness: ‘தமது வலப்பக்கத்தில் இருப்பவர்களிடம்’ மற்றும் ‘வாருங்கள்’ இயல்பாகவும் காட்சியின் மாண்பான பதிவுக்குப் பொருத்தமாகவும் உள்ளன. ‘என் பிதா’ வேதாகமப் பதிவில் ஏற்கத்தக்கது; ஆயினும் நவீனத் தரத் தமிழில் ‘என் தந்தை’ இயல்பானது. ‘உரிமைப்பேறாகப் பெறுங்கள்’ என்பது ‘பெற்றுக்கொள்ளுங்கள்’ என்பதைக் காட்டிலும் கட்டளை வடிவில் சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
