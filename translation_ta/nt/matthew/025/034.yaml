id: MAT.25.34
reference: Matthew 25:34
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τότε ἐρεῖ ὁ βασιλεὺς τοῖς ἐκ δεξιῶν αὐτοῦ· Δεῦτε, οἱ εὐλογημένοι τοῦ πατρός μου, κληρονομήσατε τὴν ἡτοιμασμένην ὑμῖν βασιλείαν ἀπὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/034.yaml
  text: Then the King will say to those on his right[a], ‘Come, you who are blessed by my Father[b], inherit the kingdom prepared for you from the foundation of the world.’
translation:
  language: ta
  text: அப்போது அரசர் தமது வலப்பக்கத்தில் இருப்பவர்களிடம், “வாருங்கள், என் தந்தையால் ஆசீர்வதிக்கப்பட்டவர்களே[a]. உலகம் தோற்றுவிக்கப்பட்டதிலிருந்து[b] உங்களுக்காக ஆயத்தம் செய்யப்பட்டுள்ள இராஜ்யத்தை உரிமைப்பேறாகப் பெறுங்கள்” என்று சொல்வார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “என் தந்தையின் ஆசீர்வதிக்கப்பட்டவர்களே.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உலகம் தோற்றுவிக்கப்பட்ட காலத்திலிருந்து.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: நியாயத்தீர்ப்புக் காட்சியில் நிகழ்வுகளின் தொடர்ச்சியைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: ἐρεῖ
  choice: சொல்வார்
  rationale: எதிர்கால வினைமுற்றையும் நேரடிக் கூற்றின் அறிமுகத்தையும் தெளிவாகத் தருகிறது.
- source_word: ὁ βασιλεὺς
  choice: அரசர்
  rationale: குறிப்பிட்ட அரசரைக் குறிக்கும் மரியாதையான தமிழ்ச் சொல்; தமிழில் பெரிய எழுத்து வேறுபாடு இல்லாததால் சூழலே பட்டத்தன்மையை வெளிப்படுத்துகிறது.
- source_word: τοῖς ἐκ δεξιῶν αὐτοῦ
  choice: தமது வலப்பக்கத்தில் இருப்பவர்களிடம்
  rationale: இடநிலையையும் வலப்பக்கத்தோடு தொடர்புடைய மதிப்பையும் விளக்கமாகப் பாதுகாக்கிறது.
- source_word: Δεῦτε
  choice: வாருங்கள்
  rationale: பன்மையினருக்கு விடுக்கப்படும் மாண்பான அழைப்பை இயல்பாகக் காட்டுகிறது.
- source_word: οἱ εὐλογημένοι τοῦ πατρός μου
  choice: என் பிதாவால் ஆசீர்வதிக்கப்பட்டவர்களே
  rationale: முற்றுப்பெற்ற செயலின் தொடரும் நிலையைப் பாதுகாத்து, பிதாவே ஆசீர்வாதத்தின் மூலமாக இருப்பதைத் தெளிவாகத் தருகிறது.
- source_word: κληρονομήσατε
  choice: உரிமைப்பேறாகப் பெற்றுக்கொள்ளுங்கள்
  rationale: வெறுமனே ‘பெறுங்கள்’ என்பதைக் காட்டிலும் குடும்ப மற்றும் சுதந்தரப் பேற்றின் நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: τὴν ... βασιλείαν
  choice: அரசை
  rationale: இங்கு ஆயத்தம் செய்யப்பட்டு உரிமைப்பேறாகப் பெறப்படும் ஆட்சிப்பரப்பைக் குறிக்கிறது; ‘ஆட்சி’ என்று மட்டும் கூறி செயல்பாட்டுப் பொருளுக்குள் சுருக்குவதைத் தவிர்க்கிறது.
- source_word: ἡτοιμασμένην ὑμῖν
  choice: உங்களுக்காக ஆயத்தம் செய்யப்பட்டுள்ள
  rationale: முன்பே நிறைவேற்றப்பட்ட ஆயத்தமும் அதன் தற்போதைய விளைவும் வெளிப்படுகின்றன.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: உலகம் நிறுவப்பட்டதுமுதல்
  rationale: ἀπό என்பதன் தொடக்கப்புள்ளி உணர்வையும் உலகின் நிறுவுதலைக் குறிக்கும் உருவகத்தையும் நெருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: 'τοῦ πατρός μου என்பதன் உறவு: மூலம்/செயற்பாட்டாளர் அல்லது நேரடியான உடைமைத் தொடர்பு'
  choice: ‘என் பிதாவால் ஆசீர்வதிக்கப்பட்டவர்களே’ என்று மூலம் அல்லது செயற்பாட்டாளரைக் காட்டுதல்
  alternative: ‘என் பிதாவின் ஆசீர்வதிக்கப்பட்டவர்களே’
  rationale: ஆசீர்வாதம் பிதாவிடமிருந்து வருகிறது என்ற இயல்பான பொருளை நவீனத் தமிழில் தெளிவாக்குகிறது; இன்னும் சொற்சொல்லான அமைப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: βασιλεία என்பதன் பொருள்
  choice: ‘அரசு’
  alternative: ‘அரசாட்சி’
  rationale: βασιλεία ஆட்சி அல்லது அரசு என இருவகை நுணுக்கம் கொள்ளலாம்; ஆனால் ‘உரிமைப்பேறாகப் பெறுதல்’, ‘ஆயத்தம் செய்யப்படுதல்’ ஆகியவற்றோடு வருவதால் இங்கு எஸ்கத்தாலஜிக்கான ஆட்சிப்பரப்பு முன்னிலையில் உள்ளது. இருப்பினும் இறையாட்சியின் பரந்த கருத்தை இந்தச் சொல் மறுப்பதில்லை.
- issue: ἀπὸ καταβολῆς κόσμου என்பதன் தொடரியல் இணைப்பு
  choice: ‘உங்களுக்காக ஆயத்தம் செய்யப்பட்டுள்ள’ என்பதோடு இணைத்தல்
  alternative: அழைப்பு முழுவதையும் காலவகையில் விளக்கும் தளர்வான இணைப்பு
  rationale: அருகிலுள்ள ἡτοιμασμένην என்ற பங்கேற்புவினையோடு இணைப்பதே இயல்பான தொடரியல் வாசிப்பு; இதற்கு அப்பால் ஒரு குறிப்பிட்ட கோட்பாட்டு அமைப்பை வசனத்தில் திணிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், அதேவேளையில் நியாயத்தீர்ப்புக் காட்சிக்கேற்ற மாண்பான நடையைப் பயன்படுத்துகிறது. ‘பிதா’, ‘ஆயத்தம்’, ‘உரிமைப்பேறு’ ஆகிய சொற்கள் வழக்கமான பேச்சுத் தமிழைவிட உயர்ந்த பதிவைச் சேர்ந்தவை என்றாலும், வேதாகமச் சூழலில் பரவலாகப் புரிந்துகொள்ளக்கூடியவை. எல்லா அடிக்குறிப்பு அடையாளங்களும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
