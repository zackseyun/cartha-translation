id: MAT.25.37
reference: Matthew 25:37
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσονται αὐτῷ οἱ δίκαιοι λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα καὶ ἐθρέψαμεν, ἢ διψῶντα καὶ ἐποτίσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/037.yaml
  text: Then the righteous will answer him[a], saying, ‘Lord, when did we see you hungry and feed you, or thirsty and give you drink?’
translation:
  language: ta
  text: அப்போது நீதிமான்கள் அவருக்குப் பதிலளித்து, ‘ஆண்டவரே, நாங்கள் எப்போது உம்மைப் பசியாயிருக்கக் கண்டு உணவளித்தோம், அல்லது தாகமாயிருக்கக் கண்டு குடிக்கக் கொடுத்தோம்?’ என்று சொல்வார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: உரையாடலில் நிகழ்வுகளின் தொடர்ச்சியைக் குறிக்கும் இயல்பான, சுருக்கமான காலச் சொல்.
- source_word: ἀποκριθήσονται αὐτῷ
  choice: அவருக்குப் பதிலளித்து ... சொல்வார்கள்
  rationale: எதிர்கால வினையின் பொருளையும் αὐτῷ என்ற மறைமுகச் செயப்படுபொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; தொடர்ந்து வரும் λέγοντες என்பதையும் ‘சொல்வார்கள்’ எனக் காக்கிறது.
- source_word: οἱ δίκαιοι
  choice: நீதிமான்கள்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் பெயரடையைத் தமிழில் நிலைபெற்றதும் தெளிவானதுமான முறையில் தருகிறது; காட்சியில் நீதியுள்ளவர்களாக அறியப்படுபவர்களைக் குறிக்கிறது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: κύριος என்பதன் அழைப்புவேற்றுமையையும் மரியாதை மற்றும் கிறிஸ்துவியல் ஒலிநயத்தையும் கூடுதல் விளக்கமின்றிக் காக்கிறது.
- source_word: πεινῶντα καὶ ἐθρέψαμεν
  choice: பசியோடு கண்டு உணவளித்தோம்
  rationale: நிகழ்ந்துகொண்டிருக்கும் பசி நிலையையும் அதற்குப் பதிலாகச் செய்யப்பட்ட உணவளிக்கும் செயலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: διψῶντα καὶ ἐποτίσαμεν
  choice: தாகத்தோடு கண்டு குடிக்கக் கொடுத்தோம்
  rationale: தாகநிலையையும் குடிக்க ஏதாவது கொடுத்த செயலையும் காக்கிறது; மூலத்தில் இல்லாத ‘தண்ணீர்’ போன்ற குறிப்பிட்ட பானத்தைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: இயேசுவை நேரடியாக அழைக்கும் κύριος என்ற பட்டம்
  choice: ஆண்டவரே
  alternative: எஜமானே
  rationale: ‘ஆண்டவர்’ என்பது மரியாதையான அழைப்பையும் மத்தேயுவில் உள்ள கிறிஸ்துவியல் பொருளொலியையும் காக்கிறது; ‘எஜமான்’ என்பது தேவையின்றி எஜமான்–அடிமை உறவை முன்னிறுத்தக்கூடும்.
- issue: οἱ δίκαιοι என்போரின் நிலை
  choice: நீதிமான்கள்
  alternative: நீதியுள்ளவர்கள்
  rationale: மூலம் இவர்களை நீதிமான்கள் என்று அடையாளப்படுத்துகிறது; அவர்கள் எவ்வாறு அல்லது எந்த அடிப்படையில் நீதிமான்களாகக் கருதப்படுகிறார்கள் என்பதை வசனம் விளக்காததால் மொழிபெயர்ப்பும் அதைத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. மரியாதை ஒருமையைச் சுட்ட ‘உம்மை’ பயன்படுத்தப்பட்டது. மூலத்தின் இணை அமைப்பும் எதிர்கால உரையும் காக்கப்பட்டுள்ளன.
