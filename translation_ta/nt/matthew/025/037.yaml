review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the sequence, future response, indirect object, direct address, and the paired acts of feeding and giving drink. However, “உம்மைப் பசியோடு கண்டு” and “தாகத்தோடு கண்டு” do not naturally express the Greek object-complement sense (“see you as hungry/thirsty”) in modern Tamil.
  naturalness: The proposed revision uses idiomatic Tamil constructions for seeing someone in a state of hunger or thirst, while retaining the verse’s formal, dignified register and respectful singular address.
  terminology: “நீதிமான்கள்” suitably renders οἱ δίκαιοι, and “ஆண்டவரே” appropriately renders the vocative Κύριε. “உணவளித்தோம்” and “குடிக்கக் கொடுத்தோம்” faithfully preserve the two concrete actions without specifying a beverage absent from the Greek.
  issues:
  - severity: medium
    issue: State-complement wording is unnatural
    rationale: In modern Tamil, “உம்மைப் பசியோடு கண்டு” / “தாகத்தோடு கண்டு” can sound as though hunger or thirst is an accompanying circumstance of the seeing rather than the condition in which Jesus was seen. “பசியாயிருக்கக் கண்டு” and “தாகமாயிருக்கக் கண்டு” clearly convey the Greek participles πεινῶντα and διψῶντα.
  revised_text: அப்போது நீதிமான்கள் அவருக்குப் பதிலளித்து, ‘ஆண்டவரே, நாங்கள் எப்போது உம்மைப் பசியாயிருக்கக் கண்டு உணவளித்தோம், அல்லது தாகமாயிருக்கக் கண்டு குடிக்கக் கொடுத்தோம்?’ என்று சொல்வார்கள்.
  revised_footnotes: []
  revision_rationale: The revision is limited to replacing two awkward Tamil state expressions with idiomatic object-complement constructions. It retains the source’s ambiguity concerning what was given to drink and makes no theological expansion.
