id: MAT.25.24
reference: Matthew 25:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: προσελθὼν δὲ καὶ ὁ τὸ ἓν τάλαντον εἰληφὼς εἶπεν· Κύριε, ἔγνων σε ὅτι σκληρὸς εἶ ἄνθρωπος, θερίζων ὅπου οὐκ ἔσπειρας καὶ συνάγων ὅθεν οὐ διεσκόρπισας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/024.yaml
  text: Then the one who had received the one talent also came and said[a], ‘Lord, I knew that you are a hard man[b], reaping where you did not sow and gathering where you did not scatter.’
translation:
  language: ta
  text: அப்போது, ஒரு தாலந்தைப் பெற்றவனும் அணுகி வந்து, ‘ஆண்டவரே, நீர் கடுமையானவர்[a] என்று நான் அறிந்தேன்; நீர் விதைக்காத இடத்தில் அறுவடை செய்கிறவரும், சிதறவிடாத இடத்திலிருந்து சேகரிக்கிறவரும் ஆவீர்[b]’ என்று சொன்னான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கடினமானவர்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் கடினமானவர், கடுமையானவர் அல்லது கண்டிப்பானவர் என்ற பொருள்களைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: நேர்ச்சொல்லாக, ‘நீர் சிதறவிடாத இடத்திலிருந்து சேகரிக்கிறவர்.’ வேளாண்மைச் சூழலில் சிதறவிடப்படுவது விதையாக இருக்கலாம்; ஆனால் ‘விதை’ என்பது கிரேக்க மூலத்தில் வெளிப்படையாக இல்லை.
    reason: source_ambiguity
lexical_decisions:
- source_word: προσελθὼν
  choice: வந்து
  rationale: பேசுவதற்கு முன் அவன் அணுகிவந்ததைக் குறிக்கும் இறந்தகால வினையெச்சத்தை இயல்பான தமிழ் கதைநடையில் தருகிறது.
- source_word: δὲ καὶ
  choice: அப்போது ... உம்
  rationale: δέ குறிக்கும் கதைநடை முன்னேற்றத்தை ‘அப்போது’ என்பதும், καί குறிக்கும் சேர்க்கையை ‘உம்’ விகுதியும் வெளிப்படுத்துகின்றன.
- source_word: ὁ τὸ ἓν τάλαντον εἰληφὼς
  choice: ஒரு தாலந்து பெற்றிருந்தவன்
  rationale: அவனை அவன் பெற்ற தொகையால் அடையாளப்படுத்தும் மூலமொழி அமைப்பையும், εἰληφώς என்பதன் நிறைவுற்று தொடரும் நிலையையும் ‘பெற்றிருந்தவன்’ காக்கிறது.
- source_word: τάλαντον
  choice: தாலந்து
  rationale: பண்டைய எடை மற்றும் பெருந்தொகை பணத்தைக் குறிக்கும் மூலச்சொல்லின் தனித்துவத்தையும் உவமையின் தொடர்பையும் காக்கிறது; ‘பணப்பை’ போன்ற விளக்கச் சொல் தேவையின்றி பொருளைக் குறுக்கிவிடும்.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: மரியாதையுடன் நேரடியாக அழைக்கும் κύριε என்பதற்கு இயல்பான, உயர்வான தமிழ் வடிவம்; உவமையில் எஜமானை நோக்கிய அழைப்பாகவும் பொருந்துகிறது.
- source_word: ἔγνων σε ὅτι
  choice: நீர் ... என்று நான் அறிந்திருந்தேன்
  rationale: அவனுடையதாகக் கூறப்படும் அறிவை இயல்பான தமிழில் தருகிறது; எஜமானைப் பற்றிய அவனது மதிப்பீட்டை மொழிபெயர்ப்பு ஏற்றுக்கொள்வதாக மாற்றாது.
- source_word: σκληρὸς ἄνθρωπος
  choice: கடினமானவர்
  rationale: σκληρός என்பதிலுள்ள கடினம், கடுமை, இரக்கம் குறைவு ஆகிய பொருள் வாய்ப்புகளை ஓரளவு திறந்தவையாக வைத்திருக்கிறது; தமிழில் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது.
- source_word: θερίζων ὅπου οὐκ ἔσπειρας
  choice: நீர் விதைக்காத இடத்தில் அறுவடை செய்கிறவர்
  rationale: விதைத்தல்–அறுவடை செய்தல் என்ற வேளாண்மை உருவகத்தையும் நிகழ்காலப் பண்புரைப்பையும் நேரடியாகக் காக்கிறது.
- source_word: συνάγων ὅθεν οὐ διεσκόρπισας
  choice: சிதறவிடாத இடத்திலிருந்து சேகரிக்கிறவர்
  rationale: ὅθεν என்பதன் ‘இடத்திலிருந்து’ என்ற இயக்கத்தையும், διασκορπίζω என்பதன் பொருள் குறிப்பிடப்படாத ‘சிதறவிடுதல்’ என்ற சொல்லையும் காக்கிறது; ‘விதை’ என்பதை மூலத்தில் இல்லாதபடி சேர்க்கவில்லை.
theological_decisions:
- issue: உவமையில் κύριος என்ற அழைப்பை மொழிபெயர்த்தல்
  choice: ஆண்டவரே
  alternative: எஜமானே
  rationale: இச்சூழலில் உவமைக் கதையின் எஜமானை நோக்கிய அழைப்பாக இருந்தாலும், κύριος என்பதன் மரியாதை மற்றும் அதிகாரப் பொருளை ‘ஆண்டவரே’ காக்கிறது; இதனால் கதாபாத்திரத்தைப் பற்றிய கூடுதல் கோட்பாட்டு முடிவு திணிக்கப்படவில்லை.
- issue: வேலைக்காரன் எஜமானை σκληρός என்று வர்ணித்தல்
  choice: அவன் கூறும் குற்றச்சாட்டாக ‘கடினமானவர்’ என்று மொழிபெயர்த்தல்
  alternative: ‘கடுமையானவர்’ என்று அதிக வலுவாக மொழிபெயர்த்தல்
  rationale: இது வேலைக்காரனின் கூற்று என்பதை அப்படியே வைத்திருக்கிறது; அந்த வர்ணனை உண்மையா பொய்யா என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவோ மென்மைப்படுத்தவோ இல்லை.
- issue: διασκορπίζω என்பதற்கான மறைபொருளை வெளிப்படையாகச் சேர்த்தல்
  choice: பொருளைக் குறிப்பிடாமல் ‘சிதறவிடாத’ என்று தருதல்
  alternative: ‘விதையைச் சிதறவிடாத’ என்று தருதல்
  rationale: வேளாண்மைச் சூழல் விதையை உணர்த்தக்கூடும்; ஆயினும் மூலவாக்கியத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லை. ஆகவே அதன் உண்மையான சுருக்கத்தையும் சாத்தியமான தெளிவின்மையையும் முதன்மை உரை காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் புரியுமாறு, அதேவேளையில் உவமையின் மரியாதையான உரையாடல் தொனியைப் பேணும் உயர்வான நடை பயன்படுத்தப்பட்டுள்ளது. எஜமானை நோக்கி ‘நீர்/வர்’ மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. ‘தாலந்து’ என்ற வரலாற்றுச் சொல் பொருள் விரிவை இழக்காமல் பாதுகாக்கப்பட்டுள்ளது.
