source:
  edition: SBLGNT
  text: Ὀζίας δὲ ἐγέννησεν τὸν Ἰωαθάμ, Ἰωαθὰμ δὲ ἐγέννησεν τὸν Ἀχάζ, Ἀχὰζ δὲ ἐγέννησεν τὸν Ἑζεκίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/009.yaml
  text: Uzziah fathered Jotham[a], and Jotham fathered Ahaz, and Ahaz fathered Hezekiah,
translation:
  language: ta
  text: உசியா யோதாமைப் பெற்றான்[a]; யோதாம் ஆகாசைப் பெற்றான்; ஆகாஸ் எசேக்கியாவைப் பெற்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் ἐγέννησεν என்பதற்கு மரபாக ‘ஜனிப்பித்தான்’ போன்ற வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; வம்சவரிசையில் அதன் தந்தைவழிப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்க இங்கே ‘பெற்றான்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀζίας
  choice: உசியா
  rationale: கிரேக்கப் பெயரின் பின்னால் உள்ள பழைய ஏற்பாட்டின் பரிச்சயமான அரசர்ப் பெயருடன் ஒத்த தமிழ்வேதாகம மரபுப் பெயர் பயன்படுத்தப்பட்டது.
- source_word: δὲ
  choice: வாக்கியப் பிரிப்பும் அரைப்புள்ளிகளும் மூலம் உணர்த்தப்பட்டது
  rationale: இந்த வம்சவரிசையில் δέ மென்மையான தொடரிணைப்பாக வருகிறது. ஒவ்வொரு முறையும் ‘மேலும்’ என்று இடுவது தமிழில் செயற்கையாக இருப்பதால், தொடர்ச்சியை அரைப்புள்ளிகள் இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: ἐγέννησεν
  choice: பெற்றான்
  rationale: தந்தைவழி வம்சத் தொடர்பைக் குறிக்கும் சுருக்கமான, இயல்பான தமிழ் மரபுச் சொல். மீண்டும் வரும் வம்சவரிசை அமைப்பையும் இது காக்கிறது.
- source_word: Ἰωαθάμ
  choice: யோதாம்
  rationale: யூதாவின் அரசராகப் பழைய ஏற்பாட்டில் அறியப்படும் நபருக்கான பரிச்சயமான தமிழ்வேதாகமப் பெயர் வடிவம்.
- source_word: Ἀχάζ
  choice: ஆகாஸ்
  rationale: பழைய ஏற்பாட்டின் அரசருக்கான பரிச்சயமான தமிழ்வேதாகமப் பெயர் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: Ἑζεκίαν
  choice: எசேக்கியா
  rationale: யூதாவின் அரசராகப் பழைய ஏற்பாட்டில் அறியப்படும் நபருக்கான பரிச்சயமான தமிழ்வேதாகமப் பெயர் வடிவம்.
theological_decisions:
- issue: γεννάω என்பதன் வம்சவரிசைப் பொருள்
  choice: ‘பெற்றான்’ என்று நேரடியான தந்தைவழி வம்சத் தொடராக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘தந்தையானான்’ அல்லது ‘மூதாதையானான்’
  rationale: மத்தேயுவின் மூலவாக்கியம் திரும்பத் திரும்ப வரும் நேரடியான வம்சவரிசைச் சூத்திரத்தைப் பயன்படுத்துகிறது. வேதாகம வம்சவரிசைகளில் தலைமுறைகள் விடுபட்டிருக்கக்கூடும் என்ற சாத்தியத்தை மறுக்காமலும், இவ்வசனத்தில் இல்லாத ‘மூதாதை’ என்ற விரிவான விளக்கத்தைச் சேர்க்காமலும் ‘பெற்றான்’ மூலத்தின் வடிவத்தையும் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வம்சவரிசை நடை. பெயர்கள் தமிழ்வேதாகமப் பயன்பாட்டில் பரிச்சயமான பழைய ஏற்பாட்டு வடிவங்களுடன் ஒத்திசைக்கப்பட்டுள்ளன; மீளுரையின் இலக்கிய ஒழுங்கு காக்கப்பட்டுள்ளது.
