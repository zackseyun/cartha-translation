id: MAT.1.11
reference: Matthew 1:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἰωσίας δὲ ἐγέννησεν τὸν Ἰεχονίαν καὶ τοὺς ἀδελφοὺς αὐτοῦ ἐπὶ τῆς μετοικεσίας Βαβυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/011.yaml
  text: Josiah fathered Jeconiah and his brothers at the time of the deportation to Babylon[a].
translation:
  language: ta
  text: யோசியா யெகொனியாவையும் அவனுடைய சகோதரர்களையும் பெற்றார்; பாபிலோனுக்கான நாடுகடத்தலின் போது இது நிகழ்ந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாபிலோனுக்கு நாடுகடத்தப்பட்ட காலத்தில்.” கிரேக்கச் சொல் வலுக்கட்டாயமான இடமாற்றத்தையோ நாடுகடத்தலையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: பெற்றார்
  rationale: மத்தேயுவின் வம்சவரலாற்றுச் சூத்திரத்தில் ஆண் வழி வம்சத் தொடர்பைக் குறிக்கிறது. இயல்பான நவீனத் தமிழில் ‘பெற்றார்’ சுருக்கமாகவும் மரியாதைமிக்கதாகவும் உள்ளது; ஒவ்வொரு தலைமுறையும் உடனடி உயிரியல் தந்தைமைதான் என்று கூடுதலாகத் தீர்மானிக்காது.
- source_word: Ἰεχονίαν
  choice: எகொனியா
  rationale: கிரேக்க வடிவத்தை நெருக்கமாகப் பின்பற்றும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: ἀδελφοὺς αὐτοῦ
  choice: அவருடைய சகோதரர்களை
  rationale: கிரேக்கத்தில் ஆண்பால் பன்மை வெளிப்படையாக இருப்பதால் அதைக் காக்கிறது.
- source_word: ἐπὶ τῆς μετοικεσίας Βαβυλῶνος
  choice: பாபிலோனுக்குக் கட்டாயமாகக் குடிபெயர்க்கப்பட்ட காலத்தில்
  rationale: μετοικεσία குறிக்கும் வலுக்கட்டாயமான இடமாற்றத்தையும், ἐπί + பிறப்புவேற்றுமையின் காலப் பொருளையும் தெளிவாக வெளிப்படுத்துகிறது; பாபிலோன் சென்றடையும் இடமாகப் பொருள்படுகிறது.
- source_word: δὲ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: வம்சவரலாற்றில் இது மென்மையான இணைப்புச் சொல்; தமிழில் தனியே மொழிபெயர்க்காமல் விடுவது பொருள் இழப்பின்றி இயல்பான நடையைத் தருகிறது.
theological_decisions:
- issue: மத்தேயுவின் வம்சவரலாற்றில் தலைமுறைகள் சுருக்கப்பட்டிருக்கக்கூடிய தன்மை
  choice: கிரேக்கத்தில் கூறப்பட்ட வம்சத் தொடர்பை நேரடியாக மொழிபெயர்த்து, வரலாற்றுச் சிக்கலை மூலவசனத்தில் தீர்க்காமல் விடுதல்
  alternative: γεννάω ஒவ்வொரு இடத்திலும் உடனடி தந்தைமையைக் குறிக்காமல் முன்னோர் வழி வம்சத்தையும் குறிக்கலாம் என்று வெளிப்படையாக விரித்துரைத்தல்
  rationale: மூலத்தின் வம்சவரலாற்றுச் சூத்திரத்தை மொழிபெயர்ப்பு காக்க வேண்டும்; அமைதியான ஒத்திசைவு விளக்கத்தைச் சேர்க்காமல் உண்மையான வரலாற்று/வம்சவழித் திரட்சியைத் திறந்த நிலையில் வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடை. ‘கட்டாயமாகக் குடிபெயர்க்கப்பட்ட’ என்பது நிகழ்வின் வலுக்கட்டாயத் தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
