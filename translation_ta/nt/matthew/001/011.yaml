    text: அல்லது, “பாபிலோனுக்கு நாடுகடத்தப்பட்ட காலத்தில்.” கிரேக்கச் சொல் வலுக்கட்டாயமான இடமாற்றத்தையோ நாடுகடத்தலையோ குறிக்கலாம்.
    reason: lexical_alternative
  revision_rationale: The name is corrected to reflect the Greek form, and the temporal phrase is recast to state the deportation event directly. The semicolon and explicit «இது நிகழ்ந்தது» preserve the temporal relation naturally in Tamil without implying a particular resolution of the genealogy's historical compression.
