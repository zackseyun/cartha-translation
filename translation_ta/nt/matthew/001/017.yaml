id: MAT.1.17
reference: Matthew 1:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Πᾶσαι οὖν αἱ γενεαὶ ἀπὸ Ἀβραὰμ ἕως Δαυὶδ γενεαὶ δεκατέσσαρες, καὶ ἀπὸ Δαυὶδ ἕως τῆς μετοικεσίας Βαβυλῶνος γενεαὶ δεκατέσσαρες, καὶ ἀπὸ τῆς μετοικεσίας Βαβυλῶνος ἕως τοῦ χριστοῦ γενεαὶ δεκατέσσαρες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/017.yaml
  text: So all the generations from Abraham to David were fourteen generations[a], and from David to the exile to Babylon fourteen generations[b], and from the exile to Babylon to the Messiah fourteen generations.
translation:
  language: ta
  text: எனவே, ஆபிரகாமிலிருந்து தாவீதுவரையிலான தலைமுறைகள் அனைத்தும் பதினான்கு தலைமுறைகள்; தாவீதிலிருந்து பாபிலோனுக்கு நாடுகடத்தப்பட்டதுவரை பதினான்கு தலைமுறைகள்; பாபிலோனுக்கு நாடுகடத்தப்பட்டதிலிருந்து மேசியாவரை[a] பதினான்கு தலைமுறைகள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்துவரை.” கிரேக்கச் சொல் χριστός என்பதற்கு “அபிஷேகம் பெற்றவர்” என்று பொருள்; இங்கு அது ஒரு பட்டமாக வருகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: Πᾶσαι οὖν αἱ γενεαὶ
  choice: எனவே ... தலைமுறைகள் அனைத்தும்
  rationale: οὖν என்பதன் தொகுத்துரைக்கும் முடிவுணர்வை ‘எனவே’ வெளிப்படுத்துகிறது; Πᾶσαι என்பதையும் விடாமல் ‘அனைத்தும்’ எனக் கொண்டுள்ளது.
- source_word: γενεαὶ
  choice: தலைமுறைகள்
  rationale: இங்கு வம்சவரிசையில் ஒன்றன்பின் ஒன்றாக வரும் தலைமுறைகளைக் குறிக்கிறது; நவீனத் தமிழில் தெளிவான இயல்பான சொல் இதுவே.
- source_word: ἀπὸ ... ἕως
  choice: இலிருந்து ... வரை
  rationale: வம்சவரிசையின் இரு எல்லைகளுக்கு இடையிலான காலப்பரப்பைத் துல்லியமாகக் காட்டுகிறது.
- source_word: μετοικεσίας Βαβυλῶνος
  choice: பாபிலோனுக்கு நாடுகடத்தப்பட்டது
  rationale: μετοικεσία கட்டாயமாக வேறிடத்துக்கு அகற்றப்பட்ட வரலாற்று நிகழ்வைக் குறிக்கிறது. ‘நாடுகடத்தப்பட்டது’ இடமாற்றத்தையும் தண்டனை சார்ந்த நாடுகடத்தலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τοῦ χριστοῦ
  choice: மேசியா
  rationale: கட்டுரையுடன் வரும் χριστός இங்கு பெயராக அல்லாமல் எதிர்பார்க்கப்பட்ட அபிஷேகம் பெற்றவரைக் குறிக்கும் பட்டமாகச் செயல்படுகிறது; வம்சவரிசையின் உச்சத்தையும் இது காட்டுகிறது.
- source_word: γενεαὶ δεκατέσσαρες
  choice: பதினான்கு தலைமுறைகள்
  rationale: மூன்று பகுதிகளிலும் மீளவரும் எண்ணிக்கைச் சூத்திரத்தைத் தமிழிலும் தெளிவாகப் பேணுகிறது.
- source_word: Ἀβραὰμ / Δαυὶδ / Βαβυλῶνος
  choice: ஆபிரகாம் / தாவீது / பாபிலோன்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
theological_decisions:
- issue: Χριστός என்ற பட்டத்தின் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு அந்தச் சொல் வம்சவரிசை சென்றடையும் எதிர்பார்க்கப்பட்ட அரசர்/அபிஷேகம் பெற்றவர் என்ற பட்டப்பொருளில் வருகிறது. ‘மேசியா’ அந்தப் பட்டப்பொருளை வெளிப்படையாகப் பேணுகிறது; மாற்று மரபுவழி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. மூன்று காலப்பகுதிகளின் இணையான அமைப்பும் ‘பதினான்கு தலைமுறைகள்’ என்ற மறுமொழியும் பேணப்பட்டுள்ளன; கிரேக்கத்தில் உள்ள ‘அனைத்தும்’ என்பதும் விடப்படவில்லை.
