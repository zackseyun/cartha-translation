id: MAT.1.15
reference: Matthew 1:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἐλιοὺδ δὲ ἐγέννησεν τὸν Ἐλεάζαρ, Ἐλεάζαρ δὲ ἐγέννησεν τὸν Ματθάν, Ματθὰν δὲ ἐγέννησεν τὸν Ἰακώβ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/015.yaml
  text: Eliud fathered Eleazar, and Eleazar fathered Matthan, and Matthan fathered Jacob.
translation:
  language: ta
  text: எலியூத் எலெயாசாரைப் பெற்றான்; எலெயாசார் மத்தானைப் பெற்றான்; மத்தான் யாக்கோபைப் பெற்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλιοὺδ
  choice: எலியூத்
  rationale: கிரேக்கப் பெயரின் ஒலியை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: δὲ
  choice: தனிச் சொல்லாக மொழிபெயர்க்காமல் அரைப்புள்ளியால் தொடர் இணைப்பு காட்டப்பட்டது
  rationale: இந்த வம்சவரிசையில் δέ மென்மையான தொடர் இணைப்பாக உள்ளது; ஒவ்வொரு முறையும் ‘மேலும்’ அல்லது ‘பின்பு’ என்று இடுவது தமிழில் தேவையற்ற கனத்தை உண்டாக்கும்.
- source_word: ἐγέννησεν
  choice: பெற்றான்
  rationale: வம்சவரிசையில் ஆண் முன்னோரிடமிருந்து வந்த சந்ததியுறவைச் சுருக்கமாகவும் வழக்கமான தமிழிலும் குறிக்கிறது; ‘பெற்றெடுத்தான்’ என்ற சொல் தாயின் மகப்பேற்றைக் குறிப்பதுபோல் ஒலிக்கக்கூடும்.
- source_word: τὸν
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: கிரேக்கத்தில் நேர்ச்செயப்படுபொருளுக்கு முன் வரும் உருபு; தமிழில் பெயருடன் ‘-ஐ’ வேற்றுமை உருபு சேர்த்து அதன் இலக்கணப் பணி வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: Ἐλεάζαρ
  choice: எலெயாசார்
  rationale: கிரேக்கப் பெயரின் ஒலியமைப்பைத் தமிழில் அடையாளம் காணத்தக்க விதத்தில் எழுத்துப்பெயர்த்துள்ளது.
- source_word: Ματθάν
  choice: மத்தான்
  rationale: கிரேக்க Ματθάν என்பதன் மெய்யொலி மற்றும் நீண்ட இறுதி உயிரொலியைத் தமிழில் நெருக்கமாகக் காட்டுகிறது.
- source_word: Ἰακώβ
  choice: யாக்கோபு
  rationale: கிரேக்கப் பெயரின் ஒலியைப் பின்பற்றுவதோடு தமிழில் நிலைபெற்ற வேதாகமப் பெயர் வடிவத்தையும் பயன்படுத்துகிறது.
theological_decisions:
- issue: ἐγέννησεν குறிக்கும் வம்ச உறவின் துல்லியம்
  choice: ‘பெற்றான்’ என்று மொழிபெயர்த்து நேரடி தந்தை–மகன் உறவாக வெளிப்படுத்தப்பட்டது
  alternative: ‘முன்னோரானான்’ அல்லது ‘வம்சத்தில் தோன்றச் செய்தான்’
  rationale: இவ்வசனத்தின் இலக்கண வடிவம் வழக்கமான தந்தை–மகன் வம்சத் தொடரை முன்வைக்கிறது. அதேவேளையில், γεννάω என்ற சொல்லுக்குள் இல்லாத கூடுதல் தலைமுறைகளைத் தமிழாக்கம் தானாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் நடை. வம்சவரிசையின் மீளுருவாக்கத்தையும் சுருக்கத்தையும் காக்க, மூன்று இணை வாக்கியங்கள் அரைப்புள்ளிகளால் பிரிக்கப்பட்டுள்ளன. வாசிப்புக்கு இயல்பாக இருக்கச் செயப்படுபொருள் பெயர்களில் ‘-ஐ’ உருபு பயன்படுத்தப்பட்டுள்ளது.
