source:
  edition: SBLGNT
  text: Σολομὼν δὲ ἐγέννησεν τὸν Ῥοβοάμ, Ῥοβοὰμ δὲ ἐγέννησεν τὸν Ἀβιά, Ἀβιὰ δὲ ἐγέννησεν τὸν ⸂Ἀσάφ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/007.yaml
  text: Solomon fathered Rehoboam[a], Rehoboam fathered Abijah, and Abijah fathered Asaph.
translation:
  language: ta
  text: சாலொமோன் ரெகொபெயாமைப் பெற்றான்; ரெகொபெயாம் அபியாவைப் பெற்றான்; அபியா ஆசாப்பைப்[a] பெற்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், 1 இராஜாக்கள் 15 மற்றும் 2 நாளாகமம் 14–16 ஆகிய பகுதிகளில் குறிப்பிடப்படும் யூதாவின் அரசனுடைய பெயருக்கு ஏற்ப, ‘ஆசா’ என்று உள்ளது; இங்குள்ள கிரேக்க மூலப்பாடம் ‘ஆசாப்’ என்று வாசிக்கிறது.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγέννησεν
  choice: பெற்றான்
  rationale: ஆண் வழி வம்சப் பட்டியலில் பிறப்பித்துத் தந்தையானதைக் குறிக்கிறது. தமிழில் மரபுப் பட்டியலுக்கேற்ற சுருக்கமான, இயல்பான சொல்லாக ‘பெற்றான்’ உள்ளது.
- source_word: δὲ
  choice: ; (தொடரமைப்பால் வெளிப்படுத்தப்பட்டது)
  rationale: இங்கு எதிர்மறைப் பொருள் இல்லை; வம்சத் தொடரின் மென்மையான இணைப்பைத் தமிழ் வாக்கியத் தொடரமைப்பும் அரைப்புள்ளிகளும் இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: Σολομών
  choice: சாலொமோன்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவம்.
- source_word: Ῥοβοάμ
  choice: ரெகொபெயாம்
  rationale: பழைய ஏற்பாட்டு அரசனுடன் பெயர்த் தொடர்ச்சியைப் பேணும், தமிழில் அறியப்பட்ட வடிவம்.
- source_word: Ἀβιά
  choice: அபியா
  rationale: கிரேக்கப் பெயருக்கு நெருக்கமாகவும் பழைய ஏற்பாட்டுப் பெயருடன் அடையாளத் தொடர்ச்சியைப் பேணுவதாகவும் உள்ளது.
- source_word: Ἀσάφ
  choice: ஆசாப்
  rationale: வழங்கப்பட்ட SBLGNT மூலப்பாடம் Ἀσάφ என்று வாசிப்பதால், எதிர்பார்க்கப்படும் ‘ஆசா’ என அமைதியாக ஒத்திசைக்காமல் மூல வாசகம் முதன்மை உரையில் பேணப்படுகிறது.
theological_decisions:
- issue: மத்தேயுவின் வம்சப் பட்டியலைப் பழைய ஏற்பாட்டு அரசர் பட்டியலுடன் ஒத்திசைக்க Ἀσάφ என்பதை ‘ஆசா’ என்று மொழிபெயர்க்க வேண்டுமா?
  choice: முதன்மை உரையில் ‘ஆசாப்’ எனப் பேணுதல்
  alternative: ‘ஆசா’ என்று வாசித்தல் அல்லது ஒத்திசைத்தல்
  rationale: வழங்கப்பட்ட கிரேக்க மூலப்பாடம் Ἀσάφ என உள்ளது. ஆகவே மூலமொழிக்கு முன்னுரிமை அளித்து ‘ஆசாப்’ முதன்மை உரையில் வைக்கப்படுகிறது; யூதா அரசனான ‘ஆசா’ என்ற வேறுபட்ட கையெழுத்துப் பிரதிகளின் வாசகம் அடிக்குறிப்பில் வெளிப்படையாகத் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் தெளிவும் கொண்ட வம்சப் பட்டியல் நடை. கிரேக்க δέ ஒவ்வொன்றையும் செயற்கையாக ‘மேலும்’ என்று மொழிபெயர்க்காமல் அரைப்புள்ளித் தொடரால் வெளிப்படுத்தப்பட்டுள்ளது; அனைத்து பெயர்களும் தமிழ் வேதாகம வாசகர்களுக்குப் பரிச்சயமான வடிவங்களில் தரப்பட்டுள்ளன.
