source:
  edition: SBLGNT
  text: Ἑζεκίας δὲ ἐγέννησεν τὸν Μανασσῆ, Μανασσῆς δὲ ἐγέννησεν τὸν ⸂Ἀμώς, Ἀμὼς⸃ δὲ ἐγέννησεν τὸν Ἰωσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/010.yaml
  text: Hezekiah fathered Manasseh[a], Manasseh fathered Amos, and Amos fathered Josiah.
translation:
  language: ta
  text: எசேக்கியா மனாசேயின் தந்தையானார்; மனாசே ஆமோசின்[a] தந்தையானார்; ஆமோஸ் யோசியாவின் தந்தையானார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில மொழிபெயர்ப்புகள், 2 இராஜாக்கள் 21-இல் குறிப்பிடப்படும் யூதா அரசரின் பெயருடன் ஒத்திசைத்து, இங்கே “ஆமோன்” என்று வழங்குகின்றன; மத்தேயுவின் கிரேக்க உரையோ “ஆமோஸ்” என்று வாசிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγέννησεν
  choice: பெற்றார்
  rationale: வம்சவரலாற்றுச் சூழலில் ஆண் முன்னோரின் வழியாக வந்த சந்ததியுறவைக் குறிக்கிறது. தமிழில் மீண்டும் மீண்டும் இயல்பாகப் பயன்படுத்தக்கூடிய, மரியாதையும் தெளிவும் கொண்ட சுருக்கமான வடிவம்.
- source_word: Ἑζεκίας
  choice: எசேக்கியா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவம்.
- source_word: Μανασσῆς
  choice: மனாசே
  rationale: தமிழ் வேதாகம மரபில் அறியப்பட்ட பெயர் வடிவம்; கிரேக்கப் பெயருக்கான இயல்பான தமிழ் ஒலிபெயர்ப்பு.
- source_word: Ἀμώς
  choice: ஆமோஸ்
  rationale: SBLGNT மூலத்தில் உள்ள Ἀμώς என்ற வடிவத்தை நேரடியாகப் பிரதிபலிக்கிறது; ‘ஆமோன்’ என ஒத்திசைக்கவில்லை.
- source_word: Ἰωσίας
  choice: யோசியா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவம்.
- source_word: δέ
  choice: அரைப்புள்ளியால் இணைத்தல்
  rationale: மீளும் வம்சப்பட்டியலில் δέ பட்டியலைத் தொடரும் எளிய இணைப்பாக உள்ளது. தமிழில் ஒவ்வொரு முறையும் ‘பின்பு’ அல்லது ‘மேலும்’ எனச் சேர்ப்பதைவிட அரைப்புள்ளி இயல்பாகத் தொடர்ச்சியை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: மத்தேயுவின் கிரேக்க உரைக்கும் பழைய ஏற்பாட்டிலுள்ள யூதா அரசரின் பெயருக்கும் இடையிலான வேறுபாடு
  choice: முதன்மை உரையில் கிரேக்க மூலத்தின்படி ‘ஆமோஸ்’
  alternative: 2 இராஜாக்கள் 21-இல் உள்ள அரசரின் பெயருடன் ஒத்திசைத்து ‘ஆமோன்’ என்று வழங்குதல்
  rationale: மூலமொழி உரைக்கு முன்னுரிமை அளிக்கப்படுகிறது. இங்கு கிரேக்க உரை Ἀμώς என வாசிப்பதால் அதை அமைதியாக ‘ஆமோன்’ என்று திருத்தாமல், வேறுபாட்டை அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான வம்சவரலாற்று நடை. பெயர்கள் அறியப்பட்ட தமிழ் வேதாகம வடிவங்களில் தரப்பட்டுள்ளன; மூலத்தின் மீளுருவாக்க அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
