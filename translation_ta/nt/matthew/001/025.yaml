id: MAT.1.25
reference: Matthew 1:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ οὐκ ἐγίνωσκεν αὐτὴν ἕως οὗ ἔτεκεν ⸀υἱόν· καὶ ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/025.yaml
  text: And he did not know her until she gave birth to a son[c][b][a], and he called his name Jesus.
translation:
  language: ta
  text: அவள் ஒரு மகனைப் பெற்றெடுக்கும் வரை, அவர் அவளுடன் தாம்பத்திய உறவு கொள்ளவில்லை[a][b]. அவனுக்கு இயேசு என்று பெயரிட்டார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, ‘அவளை அறிந்துகொள்ளவில்லை.’ இங்கு ‘அறிதல்’ என்பது தாம்பத்திய உறவைக் குறிக்கும் மென்மையான வழக்கு.
    reason: lexical_alternative
  - marker: b
    text: ‘வரை’ என்பது இயேசுவின் பிறப்பு வரையிலும் உண்மையாக இருந்ததைச் சுட்டுகிறது; அதற்குப் பிறகு என்ன நடந்தது என்பதை இச்சொல் தனியாகத் தீர்மானிப்பதில்லை.
    reason: alternative_reading
  - marker: c
    text: சொற்சொல்லாக, ‘அவனுடைய பெயரை இயேசு என்று அழைத்தார்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγίνωσκεν
  choice: தாம்பத்திய உறவு கொள்ளவில்லை
  rationale: இங்கு γινώσκω (‘அறிதல்’) என்பது பாலுறவைக் குறிக்கும் மென்மையான வழக்கு. தமிழில் ‘அவளை அறியவில்லை’ என்பது இயல்பாகவும் தெளிவாகவும் இப்பொருளைத் தராததால், சூழலுக்கேற்ற தெளிவான ‘தாம்பத்திய உறவு கொள்ளவில்லை’ பயன்படுத்தப்பட்டது; சொற்சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἕως οὗ
  choice: வரை
  rationale: பிள்ளைப்பேறு நிகழ்ந்த காலம் வரையிலும் நிலவிய சூழலை இயல்பான தமிழில் குறிக்கிறது; அதன் பிறகு என்ன நடந்தது என்பதை இந்தச் சொற்றொடர் தனியாகத் தீர்மானிப்பதில்லை.
- source_word: ἔτεκεν
  choice: பெற்றெடுத்தாள்
  rationale: τίκτω என்பதற்கான இயல்பான, நவீனத் தமிழ் வினை; குழந்தையைப் பெற்றெடுத்த நிகழ்வைத் தெளிவாகச் சொல்கிறது.
- source_word: υἱόν
  choice: ஒரு மகன்
  rationale: கிரேக்கத்தில் சுட்டுச்சொல் இல்லாததால், கூடுதல் வலியுறுத்தலைச் சேர்க்காமல் இயல்பாக ‘ஒரு மகன்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν
  choice: அவனுக்கு இயேசு என்று பெயரிட்டார்
  rationale: மூலத்தின் செமித்தியத் தாக்கமுள்ள ‘அவனுடைய பெயரை இயேசு என்று அழைத்தார்’ என்ற அமைப்பின் பொருளை இயல்பான நவீனத் தமிழில் வழங்குகிறது.
- source_word: Ἰησοῦν
  choice: இயேசு
  rationale: புதிய ஏற்பாட்டில் இப்பெயருக்குப் பயன்படும் நிலையான தமிழ் வடிவம்.
theological_decisions:
- issue: ‘வரை’ என்பது மரியாளின் பிற்கால கன்னிமையைப் பற்றி உணர்த்துவது
  choice: ἕως οὗ என்பதை ‘வரை’ என்று மட்டும் மொழிபெயர்த்து, அதற்குப் பின் தாம்பத்திய உறவு ஏற்பட்டதா இல்லையா என்பதை வசனத்தில் முடிவு செய்யாமல் விடுதல்.
  alternative: சிலர் இதற்குப் பிறகு தாம்பத்திய உறவு தொடங்கியதாகக் கருதுகின்றனர்; வேறு சிலர் இச்சொற்றொடர் பின்னர் ஏற்பட்ட நிலையைப் பற்றி எதையும் உணர்த்தாது எனக் கருதுகின்றனர்.
  rationale: கிரேக்க காலச் சொற்றொடர் இயேசுவின் பிறப்பு வரையிலான நிலையைத் தெளிவுபடுத்துகிறது; ஆனால் அதன் பிந்தைய நிலையைத் தனியாகத் தீர்மானிப்பதில்லை. ஆகவே எந்தச் சமயப் பிரிவின் முடிவும் மொழிபெயர்ப்பில் புகுத்தப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குத் தெளிவாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. பாலுறவைக் குறிக்கும் இடத்தில் மிகக் கடுமையான சொல்லைத் தவிர்த்து ‘தாம்பத்திய உறவு’ பயன்படுத்தப்பட்டுள்ளது. ஆண் குழந்தைக்கான இயல்பான ஒருமைச் சுட்டாக ‘அவன்’ பயன்படுத்தப்பட்டுள்ளது.
