  text: Ἰεσσαὶ δὲ ἐγέννησεν τὸν Δαυὶδ τὸν βασιλέα. Δαυὶδ ⸀δὲ ἐγέννησεν τὸν Σολομῶνα ἐκ τῆς τοῦ Οὐρίου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/006.yaml
  text: Jesse fathered David the king[a]. David fathered Solomon by the wife of Uriah,
translation:
  language: ta
  text: ஈசாய் அரசனாகிய தாவீதைப் பெற்றார். தாவீது உரியாவின் மனைவியால்[a] சாலொமோனைப் பெற்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் சொல்லுக்குச் சொல், “உரியாவுடைய [பெண்ணிடமிருந்து]” என்று உள்ளது. இது “உரியாவின் மனைவியால்” என்று பொருள்படும் சுருக்கமான மறைமுகச் சொல்லாட்சி. மத்தேயு இங்கு பத்சேபாளின் பெயரைக் குறிப்பிடவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: பெற்றார்
  rationale: வம்சப் பட்டியலில் ஆண் வழிப் பிறப்புறவைச் சுருக்கமாகக் குறிக்கும் γεννάω என்பதற்கு, நவீனத் தமிழில் இயல்பாகவும் மரியாதையாகவும் உள்ள “பெற்றார்” பயன்படுத்தப்பட்டது. சூழல் தந்தைமை உறவைத் தெளிவாக்குகிறது.
- source_word: τὸν Δαυὶδ τὸν βασιλέα
  choice: அரசனாகிய தாவீதை
  rationale: தாவீதின் குறிப்பிட்ட அரச அடையாளத்தை வலியுறுத்தும் பெயர்ச்சொல் அடுக்கை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ἐκ τῆς τοῦ Οὐρίου
  choice: உரியாவின் மனைவியிடம்
  rationale: கிரேக்கத்தில் “உரியாவுக்குரிய [பெண்ணிடமிருந்து]” என மனைவி என்ற சொல் மறைமுகமாக உள்ளது. தமிழில் பொருள் தெளிவாக இருக்க “மனைவி” நிரப்பப்பட்டாலும், பத்சேபாள் என்ற பெயர் சேர்க்கப்படவில்லை.
- source_word: Ἰεσσαὶ
  choice: ஈசாய்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: Δαυὶδ
  choice: தாவீது
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம்; வேற்றுமைச் சூழலில் “தாவீதை” என வருகிறது.
- source_word: Σολομῶνα
  choice: சாலொமோன்
  rationale: தமிழில் பரவலாக அறியப்படும் வேதாகமப் பெயர்வடிவம்; வேற்றுமைச் சூழலில் “சாலொமோனை” என வருகிறது.
- source_word: Οὐρίου
  choice: உரியா
  rationale: தமிழில் நிலைபெற்ற வேதாகமப் பெயர்வடிவம்; உடைமை வேற்றுமையில் “உரியாவின்” என வருகிறது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல் இன்றி வாக்கியத் தொடர்ச்சி
  rationale: வம்சப் பட்டியலில் இது மென்மையான தொடரிணைப்பாக உள்ளது. தமிழில் அடுத்தடுத்த வாக்கியங்களின் வரிசையே அந்தத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பத்சேபாளை மத்தேயு மறைமுகமாகக் குறிப்பிடுதல்
  choice: “உரியாவின் மனைவி” என்ற மறைமுக அடையாளத்தைத் தக்கவைத்தல்
  alternative: “பத்சேபாள்” அல்லது “முன்பு உரியாவின் மனைவியாக இருந்தவள்”
  rationale: மூல உரை பெண்ணின் பெயரைச் சொல்லாமல் உரியாவுடனான உறவின் வழியே அடையாளப்படுத்துகிறது. இது 2 சாமுவேல் நிகழ்வின் இலக்கிய மற்றும் அறச்சார் எதிரொலியைத் தக்கவைக்கிறது; மொழிபெயர்ப்பு அதைத் தீர்த்து மறைக்கக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும், மரியாதையான வேதாகம நடை. வம்சப் பட்டியலின் சுருக்கத்தன்மை காக்கப்பட்டுள்ளது. “மனைவியிடம் … பெற்றார்” என்பது தந்தை வழிப் பிறப்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; மூலத்தின் மறைமுகக் குறிப்பை அடிக்குறிப்பு விளக்குகிறது.
