id: MAT.1.13
reference: Matthew 1:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ζοροβαβὲλ δὲ ἐγέννησεν τὸν Ἀβιούδ, Ἀβιοὺδ δὲ ἐγέννησεν τὸν Ἐλιακίμ, Ἐλιακὶμ δὲ ἐγέννησεν τὸν Ἀζώρ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/013.yaml
  text: Zerubbabel fathered Abiud[a], Abiud fathered Eliakim, and Eliakim fathered Azor.
translation:
  language: ta
  text: செருபாபேல் அபியூதைப் பெற்றான்[a]; அபியூத் எலியாக்கீமைப் பெற்றான்; எலியாக்கீம் ஆசோரைப் பெற்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தந்தையானான்.” வேதாகம வம்சப் பட்டியல்களில், மீண்டும் மீண்டும் வரும் இந்த வினைச்சொல் சில தலைமுறைகளைச் சுருக்கி வம்சத் தொடரைக் குறிப்பிடக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ζοροβαβέλ
  choice: செருபாபேல்
  rationale: பெயரை மொழிபெயர்க்காமல், தமிழ் வேதாகமப் பயன்பாட்டில் இந்த வரலாற்று நபரை அடையாளம் காண உதவும் வழக்கமான வடிவில் ஒலிபெயர்க்கப்பட்டது.
- source_word: δέ
  choice: — / தொடர்ச்சிக்கான அரைப்புள்ளி
  rationale: இங்கு δέ வலுவான எதிர்மறையைக் காட்டாமல் வம்சப் பட்டியலைத் தொடர்ந்து நகர்த்துகிறது. இயல்பான தமிழில் ஒவ்வொரு கூறிலும் ‘ஆனால்’ அல்லது ‘மேலும்’ என்று சேர்க்காமல், அரைப்புள்ளியால் தொடர்ச்சி காட்டப்பட்டுள்ளது.
- source_word: ἐγέννησεν
  choice: பெற்றான்
  rationale: ஆண் வழி வம்ச உறவைக் குறிக்கும் சுருக்கமான, மரியாதையான தமிழ் வம்சப்பட்டியல் சொல். பழமையான அல்லது மிக விரிவான நடையைத் தவிர்த்து, கிரேக்கத்தின் திரும்பத் திரும்ப வரும் வடிவைத் தக்கவைக்கிறது.
- source_word: Ἀβιούδ
  choice: அபியூத்
  rationale: கிரேக்கப் பெயரின் ஒலியை இயல்பான தமிழ் எழுத்தமைப்பில் ஒலிபெயர்க்கிறது; வேற்றுமை உருபுடன் ‘அபியூதை’ என வருகிறது.
- source_word: Ἐλιακίμ
  choice: எலியாக்கீம்
  rationale: கிரேக்கப் பெயரைத் தெளிவாகவும் தமிழ் வாசிப்புக்கு ஏற்றவாறும் ஒலிபெயர்க்கிறது.
- source_word: Ἀζώρ
  choice: ஆசோர்
  rationale: கிரேக்க நீள்வொலியையும் பெயரின் ஒலியையும் வாசிக்கத்தக்க தமிழ் வடிவில் பிரதிபலிக்கிறது.
theological_decisions:
- issue: வம்சப் பட்டியலில் γεννάω உடனடி தந்தை–மகன் உறவை மட்டுமே குறிக்கிறதா, அல்லது சுருக்கப்பட்ட வம்சத் தொடரையும் அனுமதிக்கிறதா?
  choice: பெற்றான்
  alternative: தந்தையானான் / முன்னோனாக இருந்தான்
  rationale: ‘பெற்றான்’ கிரேக்க வம்சப்பட்டியல் வாய்பாட்டின் நேரடியான தன்மையைத் தக்கவைக்கிறது. அதே நேரத்தில் ஒவ்வொரு இணைப்பும் தவறாமல் அடுத்த தலைமுறையையே குறிக்கிறது என்று உரையில் கூடுதலாகத் தீர்மானிக்கவில்லை; சுருக்கப்பட்ட வம்சத் தொடருக்கான வாய்ப்பை அடிக்குறிப்பு தெரிவிக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ஒரே கிரேக்க வினைச்சொல்லின் மீளுருவாக்கம் தமிழிலும் ஒரே சொல்லால் பாதுகாக்கப்பட்டுள்ளது.
