id: MAT.1.3
reference: Matthew 1:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἰούδας δὲ ἐγέννησεν τὸν Φαρὲς καὶ τὸν Ζάρα ἐκ τῆς Θαμάρ, Φαρὲς δὲ ἐγέννησεν τὸν Ἑσρώμ, Ἑσρὼμ δὲ ἐγέννησεν τὸν Ἀράμ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/003.yaml
  text: Judah fathered Perez and Zerah by Tamar[a], Perez fathered Hezron, and Hezron fathered Aram.
translation:
  language: ta
  text: யூதா, தாமார் மூலம் பெரேஸையும் சேராவையும் பெற்றான். பெரேஸ் எஸ்ரோனைப் பெற்றான்; எஸ்ரோன் ஆராமைப்[a] பெற்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில மொழிபெயர்ப்புகளிலும் வம்சவரிசை மரபுகளிலும் இப்பெயர் “ராம்” என்று உள்ளது; இங்குள்ள கிரேக்கப் பாடம் “ஆராம்” என்று வாசிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰούδας
  choice: யூதா
  rationale: இங்கு இஸ்ரவேலின் கோத்திரத் தந்தையான யூதாவைக் குறிக்கிறது; புதிய ஏற்பாட்டில் வரும் ‘யூதாஸ்’ என்ற பெயரிலிருந்து வேறுபடுத்தவும், பழைய ஏற்பாட்டுடனான பெயர் தொடர்ச்சியைப் பேணவும் ‘யூதா’ பயன்படுத்தப்பட்டது.
- source_word: δὲ
  choice: வாக்கியத் தொடரமைப்பு மற்றும் அரைப்புள்ளி மூலம் உணர்த்தப்பட்டது
  rationale: இங்கு δέ எதிர்மறை முரண்பாட்டைக் காட்டாமல் வம்சவரிசையின் அடுத்த கட்டத்தை மெதுவாக இணைக்கிறது. ஒவ்வொரு முறையும் தனிச் சொல்லாக மொழிபெயர்ப்பதைவிட இயல்பான தமிழ் வாக்கியத் தொடரமைப்பு அதன் பணியைச் செய்கிறது.
- source_word: ἐγέννησεν
  choice: பெற்றான்
  rationale: வம்சவரிசையில் ஆண் வழிப் பிறப்புறவையோ வம்சத் தொடர்பையோ குறிக்கும் இயல்பான, சுருக்கமான தமிழ் சொல். ‘தந்தையானான்’ என்பதைவிட வம்சப்பட்டியல் நடைக்கு ஏற்றது.
- source_word: Φαρὲς
  choice: பெரேஸ்
  rationale: எபிரெயப் பெயரான פֶּרֶץ உடன் வேதாகமப் பெயர் தொடர்ச்சியைப் பேணும் நவீன தமிழ் ஒலிபெயர்ப்பு.
- source_word: Ζάρα
  choice: சேரா
  rationale: எபிரெயப் பெயரான זֶרַח உடன் பெயர் தொடர்ச்சியைப் பேணும் தமிழ் வடிவம்.
- source_word: ἐκ τῆς Θαμάρ
  choice: தாமார் மூலம்
  rationale: ἐκ இங்கு தாய்வழிப் பிறப்பைச் சுட்டுகிறது. ‘தாமார் மூலம்’ என்பது அந்த உறவைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: Θαμάρ
  choice: தாமார்
  rationale: பெயரின் பரவலாக அறியப்படும் தமிழ் வடிவம்.
- source_word: Ἑσρώμ
  choice: எஸ்ரோன்
  rationale: எபிரெயப் பெயரான חֶצְרוֹן உடன் வேதாகமப் பெயர் தொடர்ச்சியைப் பேணும் தமிழ் வடிவம்.
- source_word: Ἀράμ
  choice: ஆராம்
  rationale: கொடுக்கப்பட்ட கிரேக்க மூலப்பாடம் Ἀράμ என்று வாசிப்பதால் அதை நேரடியாகப் பின்பற்றுகிறது; வேறு வம்சவரிசை மரபுடன் ஒத்திசைக்க ‘ராம்’ என மாற்றப்படவில்லை.
theological_decisions:
- issue: இறுதிப் பெயரை பழைய ஏற்பாட்டின் சில வம்சவரிசை மரபுகளுடன் ஒத்திசைப்பதா
  choice: ஆராம்
  alternative: ராம்
  rationale: மொழிபெயர்ப்பு மரபை விட வழங்கப்பட்ட மூலமொழிப் பாடத்துக்கு முன்னுரிமை அளிக்கப்பட்டது. SBLGNT பாடத்தில் Ἀράμ இருப்பதால் முதன்மைப் பாடத்தில் ‘ஆராம்’ வைக்கப்பட்டு, வாசகர்கள் அறிந்திருக்கக்கூடிய ‘ராம்’ அடிக்குறிப்பில் தரப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழ்; வம்சப்பட்டியலுக்கேற்ற சுருக்கமான, கண்ணியமான நடை. பெயர்களில் பழைய ஏற்பாட்டுடனான அடையாளத் தொடர்ச்சி பேணப்பட்டுள்ளது. அடிக்குறிப்பு குறி அது விளக்கும் ‘ஆராம்’ என்ற பெயருக்குப் பின்னரே வைக்கப்பட்டுள்ளது.
