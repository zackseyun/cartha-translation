  source_fidelity: திருத்தம் தேவை. வரைவில் ἵνα πληρωθῇ மற்றும் ஆண்டவர்–தீர்க்கதரிசி முகமை வேறுபாடு அடிப்படையில் காக்கப்பட்டுள்ளன. ஆனால் τοῦτο δὲ ὅλον என்பது ஒருமைத் தொகுப்புச் சுட்டலாக இருக்க, ‘இவை அனைத்தும்’ என்பதுடன் பன்மை வினை பயன்படுத்துவது தமிழில் இயல்பானாலும் மூலத்தின் தொகுப்புத் தன்மையைச் சற்றுத் தளர்த்துகிறது. மேலும் ‘நிறைவேறும்படியாகவே’யில் உள்ள ‘வே’ கிரேக்கத்தில் இல்லாத வலியுறுத்தலைச் சேர்க்கிறது; ‘ஆண்டவர் ... சொன்னது’ passive வடிவத்தைத் தெளிவாகக் காட்டவில்லை.
  naturalness: ‘இவை அனைத்தும் நிகழ்ந்தது’ என்பது நவீனத் தமிழில் எண்ணிக்கை ஒத்திசைவில் இயல்பாக இல்லை. ஒருமைத் தொகுப்புச் சுட்டலுக்கு ‘இவை அனைத்தும் நடந்தது’ என்பதற்குப் பதிலாக ‘இவை அனைத்தும் நிகழ்ந்தன’ இயல்பானது; எனினும் இவ்வசனத்தில் மூலத்தின் ஒருமைத் தொகுப்பு உணர்வைத் தக்கவைக்க ‘இவை அனைத்தும் நிகழ்ந்தது’ என்ற வடிவம் சில நடைகளில் சாத்தியமாயினும் குறைவான இயல்புடையது. ‘இவை அனைத்தும் நிகழ்ந்தன’ என்பதைப் பயன்படுத்தி, அடிக்குறிப்பில் தொகுப்பு உணர்வை விளக்குவது சிறந்த சமநிலை. ‘அவர் சொன்னதாவது’ என்பதன் முன்னோடி தமிழில் தெளிவற்றதாக உள்ளது; ‘என்று கூறி:’ என்பது மேற்கோள் அறிமுகமாக இயல்பாகவும் தேவையற்ற நபர்-குறிப்பைத் தவிர்ப்பதாகவும் உள்ளது.
  terminology: ‘ஆண்டவர்,’ ‘தீர்க்கதரிசி,’ ‘நிறைவேற’ ஆகியவை நவீன தரத் தமிழுக்கும் வேதாகமப் பதிவுக்கும் பொருத்தமானவை. ‘தீர்க்கதரிசியின் வழியாக’ என்பதற்குப் பதில் ‘தீர்க்கதரிசி மூலம்’ சுருக்கமானது; ஆனால் ‘வழியாக’ மூலத்தின் இடைமுகமையை நன்கு வெளிப்படுத்துகிறது. ‘ஆண்டவரால் ... கூறப்பட்டது’ என்பது ὑπὸ κυρίου-இன் முகமையையும் τὸ ῥηθέν-இன் செயல்பாட்டு நிலையையும் தெளிவாக்குகிறது.
