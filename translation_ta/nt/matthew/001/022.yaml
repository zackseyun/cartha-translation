source:
  edition: SBLGNT
  text: τοῦτο δὲ ὅλον γέγονεν ἵνα πληρωθῇ τὸ ῥηθὲν ⸀ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/022.yaml
  text: All this happened so that what was spoken by the Lord through the prophet might be fulfilled[a], saying,
translation:
  language: ta
  text: 'இவை அனைத்தும், ஆண்டவரால் தீர்க்கதரிசியின் வழியாகக் கூறப்பட்டது நிறைவேறும்படி நிகழ்ந்தன என்று கூறி:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: இவை அனைத்தும்
  rationale: τοῦτο முன் விவரிக்கப்பட்ட நிகழ்வுகளை ஒரே தொகுப்பாகச் சுட்டுகிறது; ὅλον அவற்றின் முழுமையை வலியுறுத்துகிறது. δέ இங்கு வலுவான எதிர்மறையை அல்ல, உரையின் தொடர்ச்சியைச் சுட்டுவதால் தனியாக மொழிபெயர்க்கப்படவில்லை.
- source_word: γέγονεν
  choice: நிகழ்ந்தது
  rationale: γίνομαι என்பதன் perfect வடிவம் நிகழ்ந்த சம்பவத்தையும் அதன் நிலைத்த விளைவையும் குறிக்கலாம்; இங்கு இயல்பான தமிழ் கதைநடைக்கு ‘நிகழ்ந்தது’ பொருத்தமானது.
- source_word: ἵνα πληρωθῇ
  choice: நிறைவேறும்படியாகவே
  rationale: ἵνα + subjunctive அமைப்பிலுள்ள நோக்கம்/விளைவு ஆகிய இரு சாத்தியங்களையும் முற்றாகப் பிரித்துத் தீர்மானிக்காமல், நிறைவேற்றத்தின் நோக்குநிலையைத் தக்கவைக்கிறது.
- source_word: τὸ ῥηθὲν ὑπὸ κυρίου
  choice: ஆண்டவர் ... சொன்னது
  rationale: ῥηθέν என்பதன் passive கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; κύριος என்பதற்கு நவீன, கண்ணியமான ‘ஆண்டவர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: διὰ τοῦ προφήτου
  choice: தீர்க்கதரிசியின் வழியாக
  rationale: 'διά + genitive குறிக்கும் இடைநிலை முகமையைத் தெளிவாகக் காக்கிறது: ஆண்டவர் மூலப் பேச்சாளர்; தீர்க்கதரிசி வழிமூலம்.'
- source_word: λέγοντος
  choice: அவர் சொன்னதாவது
  rationale: அடுத்த வசனத்தில் வரும் மேற்கோளை அறிமுகப்படுத்தும் participle-இன் செயல்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது. ‘அவர்’ என்பது கிரேக்கத்தில் உள்ள இலக்கணத் தெளிவின்மையை அளவுக்கு மீறித் தீர்க்காமல் விடுகிறது.
theological_decisions:
- issue: தீர்க்கதரிசன வார்த்தையின் முகமை
  choice: ஆண்டவர் தீர்க்கதரிசியின் வழியாகச் சொன்னது
  alternative: தீர்க்கதரிசி ஆண்டவரிடமிருந்து சொன்னது
  rationale: ὑπό + genitive ஆண்டவரை மூல முகவராகவும், διά + genitive தீர்க்கதரிசியை இடைநிலை வழியாகவும் வேறுபடுத்துகிறது; இதை விரிவான கோட்பாட்டு விளக்கமின்றி மொழிபெயர்ப்பு காக்கிறது.
- issue: நிறைவேற்றச் சூத்திரத்தில் நோக்கமா விளைவா
  choice: நிறைவேறும்படியாகவே
  alternative: அதன் விளைவாக நிறைவேறியது
  rationale: ἵνα + subjunctive நோக்கத்தையும் விளைவையும் தாங்கக்கூடும். தேர்ந்த வடிவம் இறைநோக்கை மறைக்காமல், இயந்திரமான நிர்ணயவாதத்தையும் உரைக்கு அப்பாற்பட்டு வலியுறுத்தாது.
- issue: λέγοντος என்பதன் தொடர்பு
  choice: அவர் சொன்னதாவது
  alternative: தீர்க்கதரிசி சொன்னதாவது
  rationale: λέγοντος என்பது κυρίου அல்லது προφήτου ஆகிய இரண்டுடனும் இலக்கண வடிவில் தொடர்புபடக்கூடியது. மேற்கோளை அறிமுகப்படுத்தும் அதன் செயல்பாட்டைக் காத்து, மூலத்தில் இல்லாத முழுத் தெளிவை மொழிபெயர்ப்பில் திணிக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆண்டவர்’, ‘தீர்க்கதரிசி’, ‘நிறைவேறு’ ஆகிய சொற்கள் வேதாகமச் சூழலின் கருத்துத் துல்லியத்தையும் இயல்பான வாசிப்பையும் இணைக்கின்றன.
