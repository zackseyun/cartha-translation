  text: Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰωσὴφ τὸν ἄνδρα Μαρίας, ἐξ ἧς ἐγεννήθη Ἰησοῦς ὁ λεγόμενος χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/016.yaml
  text: And Jacob fathered Joseph[a], the husband of Mary, from whom Jesus was born[b], who is called the Messiah.
translation:
  language: ta
  text: யாக்கோபு, மரியாளின் கணவரான யோசேப்புக்குத் தந்தையானான்; மரியாளிடமிருந்து மேசியா[a] என்று அழைக்கப்படும் இயேசு பிறந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கிறிஸ்து’. கிரேக்கச் சொல்லான கிறிஸ்தோஸ் இங்கு ஒரு பட்டமாக வருவதால் ‘மேசியா’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_rendering
lexical_decisions:
- source_word: δὲ
  choice: (தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை)
  rationale: இங்கு δέ வம்சவரலாற்றின் அடுத்த படியை மெதுவாகத் தொடர்கிறது. தமிழில் வாக்கிய வரிசையே அந்தத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துவதால் தனியாக ‘மேலும்’ அல்லது ‘ஆனால்’ சேர்ப்பது தேவையற்ற வலியுறுத்தலை ஏற்படுத்தும்.
- source_word: ἐγέννησεν
  choice: தந்தையானான்
  rationale: வம்சவரலாற்றில் ஆண் வழிப் பிறப்புறவைத் தெளிவாகவும், பழமையான ‘பெற்றெடுத்தான்’ போன்ற இயல்பற்ற சொல்லாட்சியின்றியும் தெரிவிக்கிறது.
- source_word: τὸν ἄνδρα Μαρίας
  choice: மரியாளின் கணவரான
  rationale: மரியாளுடனான திருமண உறவைக் குறிக்கும் ἀνήρ என்பதன் சூழல்சார் பொருளை நேரடியாகக் காட்டுகிறது.
- source_word: ἐξ ἧς
  choice: மரியாளிடமிருந்து
  rationale: பெண்பால் ஒருமை உறவுப்பெயர் குறிப்பாக மரியாளையே சுட்டுகிறது; வம்சவரலாற்றில் இதற்கு முன் வந்த ஆண் மைய வாய்பாட்டிலிருந்து ஏற்படும் மாற்றத்தையும் காக்கிறது.
- source_word: ἐγεννήθη
  choice: பிறந்தார்
  rationale: செயப்பாட்டு வடிவத்தின் பொருளை இயல்பான நவீன தமிழில் தருகிறது; யோசேப்பு இயேசுவுக்குத் தந்தையானார் என்று உரை கூறாத வேறுபாட்டையும் நிலைநிறுத்துகிறது.
- source_word: ὁ λεγόμενος
  choice: என்று அழைக்கப்படும்
  rationale: இயேசுவுக்கு வழங்கப்படும் பட்டத்தை நேரடியான, இயல்பான தமிழில் அடையாளப்படுத்துகிறது.
- source_word: χριστός
  choice: மேசியா
  rationale: இங்கு χριστός பெயர்போன்ற வடிவமாக அல்லாமல் ‘அழைக்கப்படும்’ என்பதுடன் பட்டமாக வருகிறது; ஆகவே அதன் மேசியாப் பொருளை வெளிப்படுத்தும் ‘மேசியா’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: χριστός என்பதை கிறிஸ்தவ அடையாளப்படுத்தும் சொற்றொடரில் மொழிபெயர்த்தல்
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: ὁ λεγόμενος χριστός என்ற அமைப்பில் χριστός ஒரு பட்டமாகச் செயல்படுகிறது. ஆகவே பெயர்போல ஒலிபெயர்ப்பதைவிட அதன் பட்டப் பொருளை வெளிப்படுத்தும் ‘மேசியா’ முதன்மை உரையில் தரப்பட்டுள்ளது; பரவலான மாற்று வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- issue: யோசேப்பின் பிறப்புறவிலிருந்து இயேசுவின் பிறப்புக்கு மாறும் சொற்றொடர்
  choice: யாக்கோபு யோசேப்புக்குத் தந்தையானான்; மரியாளிடமிருந்து இயேசு பிறந்தார்
  alternative: யோசேப்பு இயேசுவுக்குத் தந்தையானார்
  rationale: கிரேக்க உரை யாக்கோபைப் பற்றி செயப்பாட்டு ἐγέννησεν என்பதையும், இயேசுவைப் பற்றி செயப்பாட்டு அல்லாத ἐγεννήθη என்பதையும் பெண்பால் ἐξ ἧς உடன் பயன்படுத்துகிறது. மொழிபெயர்ப்பு இந்த நோக்கமுள்ள வேறுபாட்டை எந்த மேலதிக கோட்பாட்டு விளக்கமும் சேர்க்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வம்சவரலாற்று நடை பயன்படுத்தப்பட்டுள்ளது. ‘தந்தையானான்’ என்பது ஆண் வழிப் பிறப்புறவை இயல்பாகக் காட்டுகிறது; இயேசுவைப் பற்றிய ‘பிறந்தார்’ என்ற மரியாதைப் பன்மை தமிழின் வழக்கமான மதிப்புநிலைக்கு ஏற்றது. மூலத்தின் ஒரே வாக்கிய அமைப்பும், மரியாளைத் தனித்துச் சுட்டும் மாற்றமும் அரைப்புள்ளி மூலம் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
