  yaml_path: translation/nt/matthew/001/001.yaml
  text: The book of the genealogy of Jesus the Messiah[a], the son of David[b], the son of Abraham.
translation:
  language: ta
  text: தாவீதின் மகனும் ஆபிரகாமின் மகனுமான மேசியாவாகிய[b] இயேசுவின் வம்சவரலாற்று[a] நூல்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தோற்றத்தைப் பற்றிய நூல்” அல்லது “பிறப்பைப் பற்றிய நூல்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் “தோற்றம்/ஆரம்பம்” என்ற விரிவான பொருளையும் கொண்டிருக்கலாம்; எனினும், அடுத்து வரும் வம்சப்பட்டியால் “வம்சவரலாறு” இங்கு சிறப்பாகப் பொருந்துகிறது.
    reason: alternative_reading
  - marker: b
    text: “மேசியாவாகிய இயேசு” என்பதற்குப் பாரம்பரியமாக “இயேசு கிறிஸ்து” என்றும் வழங்கப்படுகிறது. “மேசியா” என்பது கிரேக்க Χριστός என்ற பட்டத்தின் பொருளை வெளிப்படுத்துகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: Βίβλος
  choice: நூல்
  rationale: βίβλος என்பது நூல், சுருள் அல்லது எழுதப்பட்ட பதிவு என்று பொருள்படலாம். இங்கு தலைப்பாக வருவதால், சுருக்கமானதும் கண்ணியமானதுமான “நூல்” இயல்பாகப் பொருந்துகிறது.
- source_word: γενέσεως
  choice: வம்சவரலாற்று
  rationale: γένεσις என்பதற்கு தோற்றம், பிறப்பு, வம்சவரலாறு ஆகிய பொருள்கள் உண்டு. அடுத்து வரும் வம்சப்பட்டியைக் கருத்தில் கொண்டு “வம்சவரலாறு” முதன்மைப் பொருளாகத் தேர்ந்தெடுக்கப்பட்டது; சொல்லின் விரிவான பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: Ἰησοῦ
  choice: இயேசு
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் நிலைபெற்ற பெயர்வடிவம்.
- source_word: χριστοῦ
  choice: மேசியாவாகிய
  rationale: Χριστός இங்கு பெயரின் ஒரு பகுதியாக மட்டுமல்லாமல், அபிஷேகம் செய்யப்பட்ட அரசரைச் சுட்டும் பட்டமாகச் செயல்படுகிறது. தமிழில் பட்டத்தன்மையை இயல்பாக வெளிப்படுத்த “மேசியாவாகிய” பயன்படுத்தப்பட்டது.
- source_word: υἱοῦ Δαυὶδ
  choice: தாவீதின் மகன்
  rationale: “மகன்” என்பது சொற்பொருளைத் தக்கவைத்ததோடு, இங்கு உள்ள தாவீதிய அரச-மேசிய அடையாளத்தையும் காக்கிறது; சூழலில் இது வழித்தோன்றலைக் குறிக்கலாம்.
- source_word: υἱοῦ Ἀβραάμ
  choice: ஆபிரகாமின் மகன்
  rationale: வம்சவழி மற்றும் உடன்படிக்கைத் தொடர்பை வெளிப்படுத்தும் மூலமொழியின் “மகன்” என்ற மரபுத்தொடர் அப்படியே காக்கப்பட்டது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியாவாகிய
  alternative: கிறிஸ்துவாகிய
  rationale: இவ்வசனத்தில் சொல் ஒரு பட்டமாக இயேசுவின் மேசிய அடையாளத்தை அறிமுகப்படுத்துகிறது. ஆகவே “மேசியா” முதன்மைப்படுத்தப்பட்டது; தமிழ் கிறிஸ்தவ மரபில் பரவலான “கிறிஸ்து” மாற்றுவடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: γενέσεως என்ற சொல்லின் பொருள்
  choice: வம்சவரலாறு
  alternative: தோற்றம் அல்லது பிறப்பு
  rationale: உடனடியாகத் தொடரும் பகுதி வம்சப்பட்டியல் என்பதால் “வம்சவரலாறு” முதன்மைப் பொருள். எனினும், கிரேக்கச் சொல் கொண்டுள்ள தோற்றம்/பிறப்பு என்ற விரிவான ஒலிப்பை அடிக்குறிப்பில் பாதுகாப்பது உரையின் சாத்தியமான பல்பொருளைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான தலைப்பு நடையைப் பயன்படுத்துகிறது. மூலத்தின் தாவீது–ஆபிரகாம் வரிசை காக்கப்பட்டுள்ளது; “மகன்” என்ற வேதாகம வம்சவழி மொழிநடை “வழித்தோன்றல்” என்று தட்டையாக்கப்படவில்லை.
