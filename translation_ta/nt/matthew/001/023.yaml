source:
  edition: SBLGNT
  text: Ἰδοὺ ἡ παρθένος ἐν γαστρὶ ἕξει καὶ τέξεται υἱόν, καὶ καλέσουσιν τὸ ὄνομα αὐτοῦ Ἐμμανουήλ· ὅ ἐστιν μεθερμηνευόμενον Μεθ’ ἡμῶν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/023.yaml
  text: Behold[a], the virgin will conceive and bear a son, and they will call his name Immanuel—which is translated[d][c][b], 'God with us.'
translation:
  language: ta
  text: “இதோ, கன்னிப்பெண்[a] கருவுறுவாள்; ஒரு மகனைப் பெற்றெடுப்பாள்; அவருக்கு ‘இம்மானுவேல்’ என்று பெயரிடுவார்கள்[b].” ‘இம்மானுவேல்’ என்பதை மொழிபெயர்த்தால், “கடவுள் நம்மோடு” என்று பொருள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இளம்பெண்.” எனினும் மத்தேயுவின் சூழலில், கிரேக்கச் சொல்லும் அதைச் சுற்றியுள்ள பிறப்பு நிகழ்வும் “கன்னிப்பெண்” என்ற மொழிபெயர்ப்பை ஆதரிக்கின்றன.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் “பெயரிடுவார்கள்” என்பது எழுவாய் யார் என்று குறிப்பிடாத பன்மை வினைச்சொல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: மேற்கோளின் தீர்க்கதரிசனத் தொனியையும், வாசகரின் கவனத்தை ஈர்க்கும் சொல்லின் வலிமையையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: παρθένος
  choice: கன்னிப்பெண்
  rationale: மத்தேயுவின் பிறப்பு நிகழ்வுச் சூழலிலும் இங்குள்ள கிரேக்கச் சொல்லின் இயல்பான பொருளிலும் ‘கன்னிப்பெண்’ என்பதே பொருத்தமானது. ஏசாயா 7:14 குறித்த விரிவான சொற்பொருள் விவாதத்தை மறைக்காமல் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐν γαστρὶ ἕξει
  choice: கருவுறுவாள்
  rationale: சொல்லுக்குச் சொல் ‘கருப்பையில் கொண்டிருப்பாள்’ என்ற பொருளுடைய கிரேக்க மரபுத்தொடரைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது; எதிர்காலப் பொருளும் காக்கப்படுகிறது.
- source_word: τέξεται υἱόν
  choice: ஒரு மகனைப் பெற்றெடுப்பாள்
  rationale: குழந்தைப் பிறப்பைக் குறிக்கும் வினையையும் υἱόν என்பதன் ‘மகன்’ என்ற பொருளையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: καλέσουσιν τὸ ὄνομα αὐτοῦ
  choice: அவருக்கு … என்று பெயரிடுவார்கள்
  rationale: கிரேக்கத்தின் குறிப்பிடப்படாத மூன்றாம் நபர் பன்மை எழுவாயை ‘பெயரிடுவார்கள்’ என்று காக்கிறது; தமிழில் இயல்பற்ற சொல்லுக்குச் சொல் அமைப்பைத் தவிர்க்கிறது.
- source_word: Ἐμμανουήλ
  choice: இம்மானுவேல்
  rationale: தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு; தொடர்ந்து வரும் பெயர்ப்பொருள் விளக்கத்தோடும் ஒத்துள்ளது.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: என்பதை மொழிபெயர்த்தால் … என்று பொருள்
  rationale: பெயரை வாசகருக்காக விளக்கும் கிரேக்கப் பங்கேற்பு வினையின் செயல்பாட்டை நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: Μεθ’ ἡμῶν ὁ θεός
  choice: கடவுள் நம்மோடு
  rationale: மூலத்தின் சுருக்கமான பெயர்ப்பொருளை கூடுதல் கிறிஸ்தவக் கோட்பாட்டு விளக்கமின்றி காக்கிறது; கிரேக்கத்தில் வெளிப்படையாக இல்லாத வினையைச் சேர்க்கவில்லை.
theological_decisions:
- issue: παρθένος என்ற சொல்லை கன்னிப்பிறப்புடன் தொடர்புடைய இவ்வசனத்தில் மொழிபெயர்த்தல்
  choice: கன்னிப்பெண்
  alternative: இளம்பெண்
  rationale: மத்தேயு 1-ன் உடனடி நிகழ்வுச் சூழலும் παρθένος என்ற கிரேக்கச் சொல்லின் இங்குள்ள இயல்பான பொருளும் ‘கன்னிப்பெண்’ என்பதை ஆதரிக்கின்றன. எனினும் ஏசாயா 7:14 சார்ந்த சொற்பொருள் விவாதத்தை மறைக்காமல் மாற்று வாசிப்பு அடிக்குறிப்பில் வைக்கப்படுகிறது.
- issue: ‘இம்மானுவேல்’ என்ற பெயரின் இறையியல் நிறைவை வழங்குதல்
  choice: கடவுள் நம்மோடு
  alternative: மனிதராக வந்த கடவுள் நம்மோடு இருக்கிறார் என்ற விரிவான விளக்கம்
  rationale: வசனம் தானே தரும் பெயர்ப்பொருளை மட்டும் மொழிபெயர்த்து, அவதாரம் குறித்த சரியானதாயினும் இங்கு வெளிப்படையாகக் கூறப்படாத கோட்பாட்டு விரிவுரையைச் சேர்க்காமல் விடுகிறது.
- issue: καλέσουσιν என்ற குறிப்பிடப்படாத பன்மை எழுவாய்
  choice: பெயரிடுவார்கள்
  alternative: அவருடைய பெயர் … என்று அழைக்கப்படும்
  rationale: மூலத்தில் உள்ள செயப்பாட்டு மூன்றாம் நபர் பன்மையைத் தக்கவைத்து, பெயரிடுபவர்கள் யார் என்பதை மொழிபெயர்ப்பு தீர்மானிக்காமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம மேற்கோளுக்கேற்ற கண்ணியமான தொனியிலும் வடிவமைக்கப்பட்டது. ‘இதோ’ தீர்க்கதரிசனக் கவன ஈர்ப்பைத் தக்கவைக்கிறது; ‘கன்னிகை’ போன்ற பழமையான வடிவத்தை விட ‘கன்னிப்பெண்’ தெளிவாக உள்ளது. பெயரின் பொருள் வினைச்சொல் சேர்க்காமல் சுருக்கமாக வைக்கப்பட்டதால் மூலத்தின் அமைப்பும் இறையியல் செறிவும் காக்கப்படுகின்றன.
