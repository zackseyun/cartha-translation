id: MAT.1.12
reference: Matthew 1:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Μετὰ δὲ τὴν μετοικεσίαν Βαβυλῶνος Ἰεχονίας ἐγέννησεν τὸν Σαλαθιήλ, Σαλαθιὴλ δὲ ἐγέννησεν τὸν Ζοροβαβέλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/012.yaml
  text: After the deportation to Babylon[a], Jeconiah fathered Shealtiel, and Shealtiel fathered Zerubbabel.
translation:
  language: ta
  text: பாபிலோனுக்கு நாடுகடத்தப்பட்ட பிறகு[a], யெகொனியா சலாத்தியேலைப் பெற்றான்; சலாத்தியேல் செருபாபேலைப் பெற்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாபிலோனியச் சிறைவாசத்திற்குப் பிறகு.” கிரேக்கச் சொல் மக்கள் வலுக்கட்டாயமாக அகற்றப்பட்டு பாபிலோனில் சிறைவாசத்திற்கு உட்படுத்தப்பட்ட நிகழ்வைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ
  choice: பிறகு
  rationale: μετά + வேற்றுமை உருபு காலத் தொடரை, அதாவது ‘பிறகு’ என்பதைச் சுட்டுகிறது. δέ மென்மையான இணைப்புச்சொல் என்பதால் இயல்பான தமிழில் தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: τὴν μετοικεσίαν Βαβυλῶνος
  choice: பாபிலோனுக்குக் கட்டாயமாகக் கொண்டுபோகப்பட்ட
  rationale: μετοικεσία மக்கள் தங்கள் நாட்டிலிருந்து அகற்றப்பட்டு வேறிடத்துக்குக் கொண்டுபோகப்பட்ட நிகழ்வைக் குறிக்கிறது. ‘கட்டாயமாகக் கொண்டுபோகப்பட்ட’ என்பது அதன் வலுக்கட்டாயத் தன்மையைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: Ἰεχονίας
  choice: எகொனியா
  rationale: கிரேக்க வடிவத்தின் ஒலிப்பை நெருக்கமாகப் பின்பற்றும், தமிழில் வாசிக்க ஏற்ற பெயர் வடிவம்.
- source_word: ἐγέννησεν
  choice: பெற்றான்
  rationale: வம்சவரலாற்றுச் சூழலில் γεννάω தந்தைவழி மரபுத் தொடரைக் குறிக்கிறது. தமிழில் ‘பெற்றான்’ என்பது சுருக்கமானதும் மரபாகப் புரிந்துகொள்ளத்தக்கதுமான சொல்; ஒவ்வொரு தலைமுறையும் உடனடி உயிரியல் தந்தை-மகன் உறவாகவே இருக்க வேண்டும் என்று இது தேவையின்றி வலியுறுத்தாது.
- source_word: Σαλαθιήλ
  choice: சலாத்தியேல்
  rationale: கிரேக்கப் பெயரின் ஒலியமைப்பைத் தமிழில் தெளிவாகக் கொண்டுவரும் வடிவம்.
- source_word: δὲ
  choice: ;
  rationale: இரண்டாவது வம்சத் தொடரை δέ இணைக்கிறது. தமிழில் அரைப்புள்ளியும் அடுத்த பெயரை நேரடியாகத் தொடங்குவதும் இயல்பான தொடர்ச்சியை அளிக்கிறது.
- source_word: Ζοροβαβέλ
  choice: செருபாபேல்
  rationale: பழைய ஏற்பாட்டுத் தொடர்பை அடையாளம் காண உதவும், எபிரெயப் பெயருக்கு நெருக்கமான பரவலான தமிழ் வடிவம்.
theological_decisions:
- issue: வம்சவரலாற்றில் γεννάω என்பதன் பொருள்
  choice: ‘பெற்றான்’ என்று மொழிபெயர்த்து தந்தைவழி வம்சத் தொடரைக் காட்டுதல்
  alternative: ‘தந்தையானான்’ அல்லது ‘பெற்றெடுத்தான்’
  rationale: மத்தேயுவின் வம்சவரலாற்று நடை முன்னோர்-வழித்தோன்றல் உறவையும் உள்ளடக்கக்கூடும். ‘பெற்றான்’ அந்த மரபுச் சூத்திரத்தைப் பாதுகாக்கிறது; தலைமுறை இடைவெளிகள் இல்லை என்ற கடுமையான உயிரியல் உடனடித் தொடர்பை மொழிபெயர்ப்பே தீர்மானிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வம்சவரலாற்று நடை பயன்படுத்தப்பட்டுள்ளது. ‘கட்டாயமாகக் கொண்டுபோகப்பட்ட’ என்பது மூலச்சொல்லின் வலுக்கட்டாய இடமாற்றப் பொருளை முதன்மை உரையிலேயே தெளிவாக்குகிறது; ‘நாடுகடத்தப்பட்ட’ என்பது அடிக்குறிப்பில் சுருக்கமான மாற்றாக வழங்கப்பட்டுள்ளது.
