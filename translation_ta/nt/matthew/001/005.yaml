revisions:
- from: சல்மோன் ராகாபின் மூலம்[a] போவாசைப் பெற்றான்; போவாஸ் ரூத்தின் மூலம் ஓபேதைப் பெற்றான்; ஓபேத் ஈசாயைப் பெற்றான்.
  to: சல்மோன் ராகாபால் போவாஸைப் பெற்றான்; போவாஸ் ரூத்தால் ஓபேத்தைப் பெற்றான்; ஓபேத் ஈசாயைப் பெற்றான்.
  rationale: The revision corrects the inconsistent spelling of போவாஸ் and uses «...ஆல் ... பெற்றான்» to express the explicit maternal relationship more naturally in modern Tamil. It preserves the Greek sequence, paternal genealogy, and the lexical alternative represented by ἐκ.
