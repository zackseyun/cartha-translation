id: MAT.1.5
reference: Matthew 1:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Σαλμὼν δὲ ἐγέννησεν τὸν ⸂Βόες ἐκ τῆς Ῥαχάβ, Βόες⸃ δὲ ἐγέννησεν τὸν ⸂Ἰωβὴδ ἐκ τῆς Ῥούθ, Ἰωβὴδ⸃ δὲ ἐγέννησεν τὸν Ἰεσσαί,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/005.yaml
  text: Salmon fathered Boaz by Rahab[a], and Boaz fathered Obed by Ruth, and Obed fathered Jesse,
translation:
  language: ta
  text: சல்மோன் ராகாபால் போவாஸைப் பெற்றான்; போவாஸ் ரூத்தால் ஓபேத்தைப் பெற்றான்; ஓபேத் ஈசாயைப் பெற்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγέννησεν
  choice: பெற்றான்
  rationale: இந்த வம்சவரலாற்றுச் சூழலில் ஆண் வழியிலான சந்ததி உறவை இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கிறது; பழமையான அல்லது மிகத் தொழில்நுட்பமான சொல்லாட்சியைத் தவிர்க்கிறது.
- source_word: ἐκ
  choice: மூலம்
  rationale: தாயின் பெயருடன் வரும் ἐκ, தாய்வழிப் பிறப்பைச் சுட்டுகிறது. ‘மூலம்’ என்பது அந்த உறவை வெளிப்படையாக வைத்துக்கொண்டு நவீன தமிழில் இயல்பாக ஒலிக்கிறது.
- source_word: δὲ
  choice: ; (தொடர்ச்சியால் உணர்த்தப்பட்டது)
  rationale: இங்கு δέ எதிர்மறைப் பொருள் தராமல் வம்சவரிசையின் அடுத்த இணைப்பைக் குறிக்கிறது. தமிழில் அரைப்புள்ளியால் இணைக்கப்பட்ட தொடர் வாக்கிய அமைப்பு அந்த ஓட்டத்தை இயல்பாக உணர்த்துகிறது; ஒவ்வொரு முறையும் ‘மேலும்’ அல்லது ‘ஆனால்’ என்று மொழிபெயர்ப்பது தேவையற்றது.
- source_word: Σαλμὼν
  choice: சல்மோன்
  rationale: கிரேக்கப் பெயரின் ஒலிப்பையும் தமிழில் அறியப்பட்ட வேதாகமப் பெயர் வடிவத்தையும் பின்பற்றுகிறது.
- source_word: Βόες
  choice: போவாஸ்
  rationale: கிரேக்க வடிவம் Βόες என்றாலும், பழைய ஏற்பாட்டில் அறியப்பட்ட அதே நபருடன் பெயர்த் தொடர்ச்சியைப் பேணும் வழக்கமான தமிழ் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: Ῥαχάβ
  choice: ராகாப்
  rationale: பழைய ஏற்பாட்டு நபரை எளிதில் அடையாளம் காண உதவும் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: Ἰωβὴδ
  choice: ஓபேத்
  rationale: பழைய ஏற்பாட்டுப் பெயருடனான தொடர்ச்சியைப் பேணும் வழக்கமான தமிழ் வடிவம்.
- source_word: Ῥούθ
  choice: ரூத்
  rationale: பழைய ஏற்பாட்டு நூலிலும் நபருக்கும் பரவலாக அறியப்பட்ட தமிழ் பெயர் வடிவம்.
- source_word: Ἰεσσαί
  choice: ஈசாய்
  rationale: வேதாகமத் தமிழில் அறியப்பட்ட பெயர் வடிவத்தைப் பயன்படுத்தி, பழைய மற்றும் புதிய ஏற்பாடுகளுக்கிடையிலான நபர் அடையாளத் தொடர்ச்சியைப் பேணுகிறது.
theological_decisions:
- issue: வம்சவரலாற்று வாய்பாடும் தாய்மார்களின் பெயர்க் குறிப்பும்
  choice: தந்தைவழி வம்சத் தொடரை ‘பெற்றான்’ என்று வைத்துக்கொண்டு, ராகாபையும் ரூத்தையும் ‘மூலம்’ என்ற சொல்லால் வெளிப்படையாகக் குறிப்பிடுதல்.
  alternative: தாய்மார்களின் பங்கைத் தெளிவாக்காமல் ‘தந்தையானான்’ என்று மட்டும் கூறுதல்; அல்லது இன்னும் சொற்சொல்லாக ‘ராகாபிடமிருந்து’, ‘ரூத்திடமிருந்து’ என்று மொழிபெயர்த்தல்.
  rationale: கிரேக்கத்தில் இரு தாய்மார்களின் பெயர்களுக்கும் ἐκ பயன்படுத்தப்பட்டிருப்பது குறிப்பிடத்தக்க அம்சம். மொழிபெயர்ப்பு அதை மறைக்காமல், அதேவேளையில் தந்தைவழி வம்சவரிசையையும் தெளிவாக வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வம்சவரலாற்று நடை. தொடர் அமைப்பில் தேவையற்ற இணைப்புச் சொற்களைத் தவிர்த்து, தாய்மார்களின் குறிப்பை வெளிப்படையாகப் பேணுகிறது.
