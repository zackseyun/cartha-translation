source:
  edition: SBLGNT
  text: ⸀ἐγερθεὶς δὲ ὁ Ἰωσὴφ ἀπὸ τοῦ ὕπνου ἐποίησεν ὡς προσέταξεν αὐτῷ ὁ ἄγγελος κυρίου καὶ παρέλαβεν τὴν γυναῖκα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/024.yaml
  text: Then Joseph[a], having awakened from sleep, did as the angel of the Lord commanded him and took his wife.
translation:
  language: ta
  text: பின்பு யோசேப்பு தூக்கத்திலிருந்து விழித்தெழுந்து, ஆண்டவருடைய தூதர் யோசேப்புக்குக் கட்டளையிட்டபடியே செய்தார்; தன் மனைவியை ஏற்றுக்கொண்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் மனைவியைப் பெற்றுக்கொண்டார்” அல்லது “தன் மனைவியைத் தன்னுடன் ஏற்றுக்கொண்டார்.” கிரேக்க வினைச்சொல் ஒருவரைத் தன்னுடன் அல்லது தன் வீட்டில் ஏற்றுக்கொள்வதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθεὶς δὲ ... ἀπὸ τοῦ ὕπνου
  choice: பின்பு ... தூக்கத்திலிருந்து விழித்தெழுந்து
  rationale: δέ இங்கு வலுவான முரண்பாட்டைக் காட்டாமல் கதைத் தொடர்ச்சியைக் குறிக்கிறது. இறந்தகாலப் பெயரெச்சமான ἐγερθεὶς மற்றும் ἀπὸ τοῦ ὕπνου ஆகியவை, முதலில் விழித்தெழுதல் நிகழ்ந்து பின்னர் செயல் நடந்த வரிசையை இயல்பான தமிழில் தருகின்றன.
- source_word: ἐποίησεν ὡς προσέταξεν αὐτῷ
  choice: தனக்குக் கட்டளையிட்டபடியே செய்து
  rationale: ἐποίησεν ὡς என்பது கட்டளைக்கு ஏற்பச் செய்ததைக் குறிக்கிறது; προσέταξεν என்பதின் அதிகாரப்பூர்வமான வலிமையை ‘கட்டளையிட்ட’ காக்கிறது.
- source_word: ὁ ἄγγελος κυρίου
  choice: ஆண்டவருடைய தூதர்
  rationale: κύριος என்பதற்கு திட்டத்தின் வழக்கமான ‘ஆண்டவர்’ பயன்படுத்தப்பட்டு, கிரேக்க உரையின் உரிமைத் தொடர்பு இயல்பான நவீனத் தமிழில் வெளிப்படுத்தப்படுகிறது.
- source_word: παρέλαβεν
  choice: தன்னிடம் ஏற்றுக்கொண்டார்
  rationale: παραλαμβάνω இங்கு ஒருவரைத் தன்னுடன் அல்லது தன் இல்லத்தில் ஏற்றுக்கொள்ளும் பொருளைக் கொண்டிருக்கலாம். ‘ஏற்றுக்கொண்டார்’ என்பது வெறும் உடல்சார் ‘அழைத்துச் சென்றார்’ என்பதைக் காட்டிலும் இந்த உறவுச் சூழலை இயல்பாக வெளிப்படுத்துகிறது; ‘தன்னிடம்’ என்பது வினையின் தன்னை நோக்கிய நுண்பொருளைத் தெளிவாக்குகிறது.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: தன் மனைவியை
  rationale: γυνή என்பதற்கு சூழலின்படி ‘பெண்’ அல்லது ‘மனைவி’ என்று பொருள் வரலாம். நிச்சயிக்கப்பட்ட திருமணத்தின் சட்ட-சமூகச் சூழலில் ‘மனைவி’ என்பதே இயல்பானது; ‘தன்’ என்பது αὐτοῦ குறிக்கும் தொடர்பைத் தமிழில் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: திருமண உறவு நிறைவேறுவதற்கு முன்பான சூழலில் γυνή என்பதன் மொழிபெயர்ப்பு
  choice: தன் மனைவி
  alternative: அந்தப் பெண்
  rationale: அடுத்த வசனம் திருமண உறவு இன்னும் நிறைவேறவில்லை என்று கூறினாலும், மத்தேயு மரியாளை ஏற்கெனவே சமூக-சட்ட ரீதியான திருமண உறவுக்குள் குறிப்பிடுகிறார். எனவே ‘மனைவி’ என்பது உரையின் திருமணச் சட்டகத்தைக் காக்கிறது; உறவு நிறைவேறியதாகத் தனியே கூறுவதில்லை.
- issue: ἄγγελος κυρίου என்பதில் κύριος என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவருடைய தூதர்
  alternative: யாவேயின் தூதர்
  rationale: கிரேக்க மூலத்தில் κύριος உள்ளது. அதனை ‘ஆண்டவர்’ என மொழிபெயர்ப்பது மூலச்சொல்லை நேரடியாகப் பின்பற்றுகிறது; எபிரேயப் பெயரை உரைக்குள் ஊகித்து சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மரியாதை வினைமுற்றுகள் தொடர்ச்சியாகப் பேணப்பட்டுள்ளன; ‘தூதர்’, ‘ஆண்டவர்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் வைக்கப்பட்டுள்ளன.
