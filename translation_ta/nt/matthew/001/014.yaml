  source_fidelity: மூலக் கிரேக்கத்தின் மூன்று இணையான வம்சவரலாற்றுக் கூறுகளும், பெயர்களும், ஒவ்வொரு ἐγέννησεν வினைச்சொல்லின் தொடர்ச்சியும் துல்லியமாகக் காக்கப்பட்டுள்ளன. ‘பெற்றார்’ என்பது இவ்வகை வம்சவரலாற்றுச் சூழலில் ஆண் வழித் தந்தைமை/வழித்தோன்றல் உறவைச் சுருக்கமாகக் குறிக்கிறது; மூலத்தில் உள்ள சாத்தியமான தலைமுறை-இடைவெளி திறந்த நிலையையும் மிகைப்படுத்தவில்லை. δέ-யின் எளிய தொடரிணைப்பு மீளும் அமைப்பு மற்றும் அரைப்புள்ளிகள் மூலம் போதுமான அளவில் உணர்த்தப்படுகிறது.
