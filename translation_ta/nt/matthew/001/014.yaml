id: MAT.1.14
reference: Matthew 1:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἀζὼρ δὲ ἐγέννησεν τὸν Σαδώκ, Σαδὼκ δὲ ἐγέννησεν τὸν Ἀχίμ, Ἀχὶμ δὲ ἐγέννησεν τὸν Ἐλιούδ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/014.yaml
  text: Azor fathered Zadok, Zadok fathered Achim, and Achim fathered Eliud.
translation:
  language: ta
  text: அசோர் சாதோக்கைப் பெற்றார்; சாதோக்கு ஆகீமைப் பெற்றார்; ஆகீம் எலியூதைப் பெற்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀζώρ
  choice: அசோர்
  rationale: கிரேக்கப் பெயரின் ஒலிப்பை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: δέ
  choice: வாக்கியப் பிரிப்பாலும் தொடரமைப்பாலும் உணர்த்தப்பட்டது
  rationale: வம்சவரலாற்றின் தொடர்ச்சியைக் குறிக்கும் எளிய இணைப்புச்சொல். ஒவ்வொரு முறையும் தனியே மொழிபெயர்த்தால் தமிழ் நடை செயற்கையாகும்; அரைப்புள்ளிகளும் மீளும் வாக்கிய அமைப்பும் அதன் பணியைச் செய்கின்றன.
- source_word: ἐγέννησεν
  choice: பெற்றார்
  rationale: ஆண் வழி வம்சவரலாற்றில் தந்தையானதையும் சந்ததி தொடர்வதையும் குறிக்கும் வழக்கமான, சுருக்கமான தமிழ் சொல்; பழமையான அல்லது மிக விரிவான நடையைத் தவிர்க்கிறது.
- source_word: τὸν
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: கிரேக்கத்தில் பெயரை நேரடிச் செயப்படுபொருளாகக் குறிக்கும் வேற்றுமை உருபின் பணி தமிழில் பெயருடன் சேரும் ‘-ஐ’ உருபால் வெளிப்படுகிறது.
- source_word: Σαδώκ
  choice: சாதோக்கு
  rationale: SBLGNT கிரேக்க வடிவத்தின் ஒலிப்பை ஆதாரமாகக் கொண்ட தமிழ் எழுத்துப்பெயர்ப்பு; வேற்றுமை உருபு சேரும்போது ‘சாதோக்கைப்’ என வருகிறது.
- source_word: Ἀχίμ
  choice: ஆகீம்
  rationale: கிரேக்கப் பெயரின் நீளுயிர் மற்றும் மெய்யொலிகளைக் கருத்தில் கொண்ட தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: Ἐλιούδ
  choice: எலியூது
  rationale: கிரேக்க Ἐλιούδ என்பதன் ஒலிப்பைத் தமிழில் இயல்பாகக் காட்டும் எழுத்துப்பெயர்ப்பு; செயப்படுபொருள் வடிவம் ‘எலியூதைப்’ ஆகும்.
theological_decisions:
- issue: ἐγέννησεν குறிக்கும் உறவின் துல்லியம்
  choice: பெற்றார்
  alternative: தந்தையானார் / வழித்தோன்றலாகப் பெற்றார்
  rationale: வம்சப்பட்டியலில் இச்சொல் நேரடி தந்தைமை அல்லது வம்சத் தொடர்ச்சியைச் சுட்டக்கூடும். ‘பெற்றார்’ மூலத்தின் சுருக்கத்தையும் பாரம்பரிய வம்சமொழியையும் காக்கிறது; தலைமுறை இடைவெளி இல்லையென கூடுதலாகத் தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதைப் பன்மை வினைமுற்றுடன் அமைந்த சுருக்கமான வம்சவரலாற்று நடை. மூலத்தின் மூன்று இணையான கூறுகளும் அரைப்புள்ளிகளால் தெளிவாகப் பிரிக்கப்பட்டுள்ளன.
