  terminology: 'பெயரெழுத்துப்பெயர்ப்புகள் தமிழில் இயல்பாகவும் உரையில் ஒருமையாகவும் உள்ளன: அசோர், சாதோக்கு, ஆகீம், எலியூது. வம்சவரலாற்றுக்கான ‘பெற்றார்’ என்ற சொல் நடுநிலையானது; தேவையற்ற இறையியல் விளக்கத்தைச் சேர்ப்பதில்லை.'
