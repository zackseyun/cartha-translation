base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/021.yaml
  text: She will bear a son[a], and you shall call his name Jesus, for he will save his people from their sins.
translation:
  language: ta
  text: அவள் ஒரு மகனைப் பெற்றெடுப்பாள்; அவருக்கு இயேசு[a] என்று பெயரிடுவாய். ஏனெனில், அவரே தமது மக்களை அவர்களுடைய பாவங்களிலிருந்து மீட்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இயேசு’ என்பது எபிரெய அல்லது அரமேயப் பெயரான ‘யேஷுவா’ (யோசுவா) என்பதற்குரிய கிரேக்க வடிவம். அந்தப் பெயர் ‘யாவே மீட்கிறார்’ என்ற கருத்துடன் தொடர்புடையது; அவர் தமது மக்களைப் பாவங்களிலிருந்து மீட்பார் என்ற மத்தேயுவின் விளக்கம் இந்தச் சொல்விளையாட்டைப் பிரதிபலிக்கிறது.
    reason: lexical_alternative
