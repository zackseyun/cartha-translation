  alternative: ‘அவர் … மீட்பார்’
  rationale: கிரேக்கச் சுட்டுப்பெயரின் வெளிப்படையான வலியுறுத்தலை ஏகாரம் இயல்பாகத் தருகிறது; வசனம் கூறுவதற்கு மேல் கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
- issue: ‘தமது மக்கள்’ என்பதன் வரம்பு
  choice: ‘தமது மக்கள்’ என்று மட்டும் மொழிபெயர்த்தல்
  alternative: ‘தமது மக்களாகிய இஸ்ரவேலரை’ அல்லது ‘தமக்குச் சொந்தமான அனைவரையும்’
  rationale: உடனடிச் சூழல் யூத உடன்படிக்கைப் பின்னணியைக் கொண்டிருந்தாலும், இவ்வசனம் அந்த மக்களின் வரம்பை மேலும் வரையறுக்கவில்லை; ஆகவே உள்ளார்ந்த தெளிவின்மை பாதுகாக்கப்படுகிறது.
