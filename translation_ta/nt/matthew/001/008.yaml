source:
  edition: SBLGNT
  text: Ἀσὰφ⸃ δὲ ἐγέννησεν τὸν Ἰωσαφάτ, Ἰωσαφὰτ δὲ ἐγέννησεν τὸν Ἰωράμ, Ἰωρὰμ δὲ ἐγέννησεν τὸν Ὀζίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/008.yaml
  text: Asaph fathered Jehoshaphat[a], Jehoshaphat fathered Joram, and Joram fathered Uzziah.
translation:
  language: ta
  text: ஆசாப் யோசபாத்துக்குத் தந்தையானார்[a]; யோசபாத் யோராமுக்குத் தந்தையானார்; யோராம் உசியாவுக்குத் தந்தையானார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் ‘ஆசாப்’ என்பதற்குப் பதிலாக ‘ஆசா’ என்று உள்ளது; பழைய ஏற்பாட்டு வம்சவரலாற்றில் குறிப்பிடப்படும் யூதா அரசனின் பெயரும் ‘ஆசா’ என்பதே.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀσὰφ
  choice: ஆசாப்
  rationale: SBLGNT மூலப்பாடத்தில் உள்ள Ἀσὰφ என்ற பெயரைத் தமிழில் ஒலிபெயர்த்துள்ளது; பழைய ஏற்பாட்டு வம்சவரலாற்றோடு ஒத்திசைக்கும்படி முதன்மைப் பாடத்தில் ‘ஆசா’ என மாற்றவில்லை.
- source_word: δὲ
  choice: தனிச் சொல்லாக மொழிபெயர்க்காமல் அரைப்புள்ளிகளால் தொடர் இணைப்பு
  rationale: இங்கு δέ எதிர்மறைப் பொருளின்றி வம்சவரலாற்றின் அடுத்தடுத்த கூற்றுகளை மென்மையாக இணைக்கிறது; தமிழில் அரைப்புள்ளிகளால் அந்தத் தொடர்ச்சி இயல்பாக வெளிப்படுகிறது.
- source_word: ἐγέννησεν
  choice: பெற்றார்
  rationale: வம்சவரலாற்றுச் சூழலில் தந்தைவழி உறவைக் குறிக்கும் இயல்பான, சுருக்கமான நவீனத் தமிழ் நடை. இது ஒவ்வொரு தலைமுறை இணைப்பையும் தெளிவாக வைத்திருக்கிறது.
- source_word: Ἰωσαφάτ
  choice: யோசபாத்
  rationale: கிரேக்கப் பெயரின் ஒலியையும் தமிழில் பரவலாக அறியப்படும் பழைய ஏற்பாட்டுப் பெயர் வடிவத்தையும் கருத்தில் கொண்ட வடிவம்.
- source_word: Ἰωράμ
  choice: யோராம்
  rationale: Ἰωράμ என்ற கிரேக்க வடிவத்துக்கு நெருக்கமான, தமிழில் இயல்பான ஒலிபெயர்ப்பு.
- source_word: Ὀζίαν
  choice: உசியா
  rationale: யூதா அரசனின் பெயருக்குத் தமிழில் அடையாளம் காணத்தக்க வழக்கமான வடிவம்; வேற்றுமை உருபுடன் ‘உசியாவை’ என வருகிறது.
theological_decisions:
- issue: மீண்டும் வரும் δὲ மற்றும் ἐγέννησεν ஆகியவற்றுடன் வம்சவரிசையை வழங்குதல்
  choice: ஒவ்வொரு தந்தை–மகன் இணைப்பையும் தனித்தனியாகத் தக்கவைத்து, அரைப்புள்ளிகளால் இயல்பான தமிழ்த் தொடராக வழங்குதல்.
  alternative: ஒவ்வொரு உட்கூற்றிலும் ‘மேலும்’ அல்லது ‘பின்பு’ என்று δέ-ஐ வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: δέ இங்கு எதிர்மறை இணைப்பல்ல; தமிழ் வாசிப்பில் தேவையற்ற மீள்வருகையைத் தவிர்த்தும் மூலத்தின் மூன்று இணைப்புகளையும் முழுமையாகப் பாதுகாக்கிறது.
- issue: Ἀσὰφ என்பதை எதிர்பார்க்கப்படும் வரலாற்றுப் பெயரான ஆசா என்பதுடன் முதன்மைப் பாடத்தில் ஒத்திசைப்பதா
  choice: மூல கிரேக்க வடிவத்தின்படி ‘ஆசாப்’ என்பதை முதன்மைப் பாடத்தில் வைத்து, ‘ஆசா’ என்பதை அடிக்குறிப்பில் தருதல்.
  alternative: பழைய ஏற்பாட்டு வம்சவரலாற்றோடு ஒத்திசைத்து முதன்மைப் பாடத்தில் ‘ஆசா’ என்று வழங்குதல்.
  rationale: மூலமொழிப் பாடத்திற்கு முன்னுரிமை அளித்து அதன் உண்மையான வாசகத்தை அமைதியாகத் திருத்தாமல் காக்கிறது; அதேவேளை கையெழுத்துப் பிரதிகளின் மாற்றுவாசகத்தையும் வரலாற்று அடையாளத்தையும் வெளிப்படையாகக் குறிப்பிடுகிறது.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், கண்ணியமானதும் சாதாரண வாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான வம்சவரலாற்று நடை. பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டில் அடையாளம் காணத்தக்க வடிவங்களில் தரப்பட்டுள்ளன; மூலத்தின் மீள்வரிசை அரைப்புள்ளிகளால் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளது.
