source:
  edition: SBLGNT
  text: ταῦτα δὲ αὐτοῦ ἐνθυμηθέντος ἰδοὺ ἄγγελος κυρίου κατ’ ὄναρ ἐφάνη αὐτῷ λέγων· Ἰωσὴφ υἱὸς Δαυίδ, μὴ φοβηθῇς παραλαβεῖν ⸀Μαρίαν τὴν γυναῖκά σου, τὸ γὰρ ἐν αὐτῇ γεννηθὲν ἐκ πνεύματός ἐστιν ἁγίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/020.yaml
  text: But as he was considering these things, behold, an angel of the Lord appeared to him in a dream, saying, “Joseph, son of David, do not be afraid to take Mary as your wife, for what has been conceived in her is from the Holy Spirit.”
translation:
  language: ta
  text: அவர் இவற்றைக் குறித்து சிந்தித்துக்கொண்டிருந்தபோது, இதோ, ஆண்டவருடைய ஒரு தூதன் கனவில் அவருக்குத் தோன்றி, “தாவீதின் மகனான யோசேப்பே, உன் மனைவி மரியாளை ஏற்றுக்கொள்ள அஞ்சாதே[a]. ஏனெனில், அவளில் உண்டாகியிருப்பது பரிசுத்த ஆவியிலிருந்து வந்தது” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் மனைவி மரியாளை உன்னுடன் ஏற்றுக்கொள்ள.” இங்குள்ள கிரேக்கச் சொற்றொடர், மணவாழ்க்கைக்காக அவளைத் தன் இல்லத்தில் சேர்த்துக்கொள்வதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνθυμηθέντος
  choice: சிந்தித்துக்கொண்டிருக்கையில்
  rationale: யோசேப்பு உள்ளத்தில் தொடர்ந்து ஆலோசித்துக்கொண்டிருந்ததைக் காட்டுகிறது; முடிவெடுத்துவிட்டதாக மிகைப்படுத்தவில்லை.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கதையில் திடீர் கவன ஈர்ப்பையும் உயிரோட்டத்தையும் தரும் உரையாடல் குறியீட்டைப் பாதுகாக்கிறது.
- source_word: ἄγγελος κυρίου
  choice: ஆண்டவருடைய தூதன்
  rationale: ἄγγελος என்பதற்கு உருபு இல்லாதபோதும், இயல்பான தமிழில் இவ்வமைப்பு குறிப்பிட்ட ஒரே தூதன் என்ற இறையியல் அடையாளத்தைத் திணிக்காமல் பொருளைத் தருகிறது.
- source_word: κατ’ ὄναρ
  choice: கனவில்
  rationale: கிரேக்க மரபுத்தொடரின் இயல்பான, தெளிவான தமிழ் வடிவம்.
- source_word: ἐφάνη
  choice: தோன்றி
  rationale: வெளிப்பாட்டு நிகழ்வில் காணப்படுதல் அல்லது வெளிப்படுதல் என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: υἱὸς Δαυίδ
  choice: தாவீதின் மகனாகிய
  rationale: யோசேப்பின் தாவீதிய வம்சத் தொடர்பையும் அந்தச் சொல்லின் மெசியா சார்ந்த எதிரொலியையும் பாதுகாக்கிறது.
- source_word: μὴ φοβηθῇς
  choice: அஞ்சாதே
  rationale: தடை மற்றும் அச்ச உணர்வு இரண்டையும் சுருக்கமான, dignified modern Tamil-ல் தருகிறது.
- source_word: παραλαβεῖν Μαρίαν τὴν γυναῖκά σου
  choice: உன் மனைவி மரியாளை உன்னுடன் அழைத்துக்கொள்ள
  rationale: மரியாள் ஏற்கெனவே ‘உன் மனைவி’ என அழைக்கப்படுவதைக் காத்து, அவளை மணவாழ்க்கைக்காகத் தன் இல்லத்தில் ஏற்றுக்கொள்வது என்ற சூழல்சார் பொருளைக் கூறுகிறது.
- source_word: τὸ ἐν αὐτῇ γεννηθὲν
  choice: அவளில் உருவாகியிருப்பது
  rationale: நடுநிலைப் பெயரெச்சத்தின் ‘அவளில் உண்டாக்கப்பட்டிருப்பது’ என்ற வடிவை குழந்தை என முன்கூட்டியே விரிவாக்காமல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐκ πνεύματός ἐστιν ἁγίου
  choice: பரிசுத்த ஆவியினால் உண்டானது
  rationale: ἐκ குறிக்கும் மூலத்தைத் தெளிவாகக் காட்டி, பரிசுத்த ஆவியை தனிப்பட்ட தெய்வீக அடையாளமாக வழங்குகிறது.
theological_decisions:
- issue: ἄγγελος κυρίου என்பதில் κυρίου-வின் மொழிபெயர்ப்பு
  choice: ஆண்டவருடைய தூதன்
  alternative: கர்த்தருடைய தூதன்; யெகோவாவின் தூதன்
  rationale: κύριος என்பதைக் ‘ஆண்டவர்’ என வழங்குவது தற்போதைய பொதுத்தமிழில் இயல்பாகவும் மரியாதையுடனும் உள்ளது; பழைய ஏற்பாட்டின் குறிப்பிட்ட தெய்வத் தோற்ற அடையாளத்தை உரையில் இல்லாத அளவுக்கு வற்புறுத்தவில்லை.
- issue: πνεύματός ... ἁγίου என்பதன் குறிப்பு
  choice: பரிசுத்த ஆவி
  alternative: பரிசுத்த ஆவியின் வல்லமை; ஒரு பரிசுத்த ஆவி
  rationale: மத்தேயுவின் பிறப்புக் கதையில் இது பெயரற்ற ஆவியையோ வெறும் ஆற்றலையோ அல்லாமல் தெய்வீக பரிசுத்த ஆவியைக் குறிக்கிறது.
- issue: மரியாளின் மணநிலை
  choice: உன் மனைவி மரியாள்
  alternative: மரியாளை உன் மனைவியாக
  rationale: τὴν γυναῖκά σου மரியாளை ஏற்கெனவே யோசேப்பின் மனைவியாக அடையாளப்படுத்துகிறது. முதன்மை உரை அந்த நிலையைப் பாதுகாக்கிறது; செயல் அவளை வீட்டில் ஏற்றுக்கொள்வதைக் குறிக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, மரியாதைமிக்க வேதாகம நடையைப் பயன்படுத்துகிறது. ‘இதோ’ என்ற உயர்நடை கவன ஈர்ப்புச் சொல் மூலத்தின் கதைத் தாக்கத்தைக் காக்கிறது. ‘உன் மனைவி மரியாள்’ என்பது கிரேக்கச் சொல் அமைப்பிலுள்ள மணநிலையைப் பாதுகாக்க, அடிக்குறிப்பு παραλαμβάνω என்பதன் சூழல்சார் நுணுக்கத்தை விளக்குகிறது.
