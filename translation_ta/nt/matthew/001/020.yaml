  to: அவர் இவற்றைக் குறித்து சிந்தித்துக்கொண்டிருந்தபோது, இதோ, ஆண்டவருடைய ஒரு தூதன் கனவில் அவருக்குத் தோன்றி, “தாவீதின் மகனான யோசேப்பே, உன் மனைவி மரியாளை ஏற்றுக்கொள்ள அஞ்சாதே[a]. ஏனெனில், அவளில் உண்டாகியிருப்பது பரிசுத்த ஆவியிலிருந்து வந்தது” என்றான்.
