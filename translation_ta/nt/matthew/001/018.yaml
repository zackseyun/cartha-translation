id: MAT.1.18
reference: Matthew 1:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τοῦ δὲ ⸀Ἰησοῦ χριστοῦ ἡ ⸀γένεσις οὕτως ἦν. ⸀μνηστευθείσης τῆς μητρὸς αὐτοῦ Μαρίας τῷ Ἰωσήφ, πρὶν ἢ συνελθεῖν αὐτοὺς εὑρέθη ἐν γαστρὶ ἔχουσα ἐκ πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/018.yaml
  text: 'The birth of Jesus the Messiah happened in this way: when his mother Mary had been betrothed to Joseph[a], before they came together[c][b], she was found to be pregnant from the Holy Spirit.'
translation:
  language: ta
  text: 'இயேசு மெசியாவின்[a] பிறப்பு இவ்வாறு நிகழ்ந்தது: அவருடைய தாய் மரியாளுக்கும் யோசேப்புக்கும் திருமணம் நிச்சயிக்கப்பட்டிருந்தது[b]. அவர்கள் ஒன்றுசேர்வதற்கு முன்பே[c], அவள் தூய ஆவியிலிருந்து கருவுற்றிருப்பது தெரியவந்தது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மெசியா’ என்பதற்குப் பதிலாக ‘கிறிஸ்து’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க Χριστός என்பது ‘அபிஷேகம் பெற்றவர்’ என்னும் பட்டப்பெயர்.
    reason: lexical_alternative
  - marker: b
    text: அக்காலத்தில் திருமண நிச்சயம் என்பது இன்றைய நிச்சயதார்த்தத்தைவிட அதிகக் கட்டுப்பாடுடைய, சட்டபூர்வமாக அங்கீகரிக்கப்பட்ட திருமண உறுதிப்பாடு.
    reason: cultural_note
  - marker: c
    text: ‘ஒன்றுசேர்வது’ என்பது அவர்கள் சேர்ந்து வாழத் தொடங்குவதைக் குறிக்கலாம்; தாம்பத்திய உறவு இன்னும் நிறைவேறாதிருந்ததையும் உட்குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: γένεσις
  choice: பிறப்பு
  rationale: இங்கு இயேசுவின் உலகிற்கான வருகையையும் பிறப்பைச் சுற்றிய நிகழ்வையும் அறிமுகப்படுத்துவதால், இயல்பான தமிழில் ‘பிறப்பு’ பொருத்தமானது; ‘தோற்றம்’ என்ற விரிந்த பொருளைச் சூழல் சாத்தியப்படுத்தினாலும், தொடரும் பிறப்புக் கதை இந்தத் தேர்வை ஆதரிக்கிறது.
- source_word: Ἰησοῦ χριστοῦ
  choice: இயேசு மெசியா
  rationale: Χριστός இங்கு பட்டப்பெயராகச் செயல்படுகிறது. அதன் அபிஷேகம் பெற்றவர் என்ற மெசியானியப் பொருளைக் காக்க ‘மெசியா’ என மொழிபெயர்க்கப்பட்டது.
- source_word: οὕτως ἦν
  choice: இவ்வாறு நிகழ்ந்தது
  rationale: நிகழ்வு எந்த விதத்தில் நடந்தது என்பதை அறிமுகப்படுத்தும் கிரேக்கச் சொற்றொடரை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: μνηστευθείσης
  choice: திருமணம் நிச்சயிக்கப்பட்டிருந்தது
  rationale: நவீன வாசகருக்கு இயல்பாகப் புரியும் சொற்றொடர்; அக்கால நிச்சயத்தின் சட்டபூர்வமான கட்டுப்பாட்டை அடிக்குறிப்பு விளக்குகிறது.
- source_word: πρὶν ἢ συνελθεῖν αὐτούς
  choice: அவர்கள் ஒன்றுசேர்வதற்கு முன்பே
  rationale: கிரேக்கத்தின் மரியாதையானதும் ஓரளவு பொருள் விரிவுடையதுமான சொல்லாட்சியைத் தக்கவைக்கிறது; இது சேர்ந்து வாழ்வதையும் திருமண உறவு நிறைவேறுவதையும் குறிக்கக்கூடும்.
- source_word: εὑρέθη
  choice: தெரியவந்தது
  rationale: கிரேக்கச் செயலப்பாட்டு வடிவத்தின் கண்டறியப்பட்ட நிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; யார் கண்டார்கள் என்பதைச் சேர்க்கவில்லை.
- source_word: ἐν γαστρὶ ἔχουσα
  choice: கருவுற்றிருந்தது
  rationale: ‘வயிற்றில் கொண்டிருந்தாள்’ என்ற சொற்சொல் மொழிபெயர்ப்பைவிட இச்சூழலில் தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: ἐκ πνεύματος ἁγίου
  choice: தூய ஆவியினால்
  rationale: ἐκ குறிப்பிடும் மூலத்தைக் தமிழின் கருவி/காரண வேற்றுமை இயல்பாகத் தெரிவிக்கிறது; இங்கு குறிப்பது தெய்வீகத் தூய ஆவியையே.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இவ்விடத்தில் இது பெயரின் ஒரு பகுதியாக மட்டும் அல்லாமல் பட்டப்பெயராகவும் செயல்படுகிறது; ஆகவே அதன் மெசியானியப் பொருளை வெளிப்படையாகக் காக்கப்பட்டது. பரவலான ‘கிறிஸ்து’ வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: πνεύματος ἁγίου என்பதன் குறிப்பு
  choice: தூய ஆவி
  alternative: தூய ஓர் ஆவி
  rationale: மத்தேயுவின் பிறப்புக் கதைச் சூழலில் இது ஏதோ ஓர் ஆவியை அல்ல, தெய்வீகத் தூய ஆவியைக் குறிக்கிறது; கிரேக்கத்தில் சுட்டிடைச்சொல் இல்லாதது இதைக் கட்டாயமாக வரையறையற்றதாக ஆக்காது.
- issue: συνελθεῖν என்பதன் பொருள் விரிவு
  choice: ஒன்றுசேர்வது
  alternative: தாம்பத்திய உறவு கொள்வது
  rationale: கிரேக்கச் சொற்றொடர் சேர்ந்து வாழத் தொடங்குவதையும் தாம்பத்திய உறவு நிறைவேறுவதையும் சுட்டக்கூடும். முதன்மை உரையில் அந்த மறைமுகத்தன்மை பாதுகாக்கப்பட்டு, அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, தெளிவான, மரியாதைமிக்க உரை. பாரம்பரிய வேதாகம நடையின் அளவுக்கு மீறிய தொன்மைத் தன்மை தவிர்க்கப்பட்டுள்ளது. மரியாள் என்பதற்கு ‘அவள்’ பயன்படுத்தப்பட்டது; இது கதையுரையில் இயல்பான மூன்றாம் நபர் குறிப்பு. ‘ஒன்றுசேர்வது’ என்ற மரியாதையான மறைமுகச் சொல்லாட்சி மூலத்தின் பொருள் விரிவையும் இறையியல் பதற்றத்தையும் முன்கூட்டியே தீர்க்காமல் காக்கிறது.
