  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைக்குரிய வேதாகம நடையிலும் அமைக்கப்பட்டது. ‘நீதிமான்’, ‘விவாகரத்து’ போன்ற பரவலாகப் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன; வரலாற்று மற்றும் சொற்படியான நுணுக்கங்கள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
