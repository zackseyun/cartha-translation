id: MAT.1.19
reference: Matthew 1:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἰωσὴφ δὲ ὁ ἀνὴρ αὐτῆς, δίκαιος ὢν καὶ μὴ θέλων αὐτὴν ⸀δειγματίσαι, ἐβουλήθη λάθρᾳ ἀπολῦσαι αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/019.yaml
  text: And Joseph[a], her husband, being a righteous man and not wanting to expose her to public disgrace[c][b], intended to divorce her quietly.
translation:
  language: ta
  text: அவளுடைய கணவனாகிய யோசேப்பு[a], நீதிமானாகவும் அவளைப் பொதுவில் அவமானப்படுத்த[b] விரும்பாதவராகவும் இருந்ததால், அவளை இரகசியமாக விவாகரத்து செய்ய[c] எண்ணினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவளுக்குத் திருமண நிச்சயம் செய்யப்பட்டவர்.” கிரேக்கத்தில் சொற்படியாக “அவளுடைய ஆண்/கணவன்” என்று உள்ளது; இது யூத நிச்சயதார்த்தத்தின் சட்டபூர்வக் கட்டுப்பாட்டைப் பிரதிபலிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவளை ஒரு எடுத்துக்காட்டாகக் காட்ட” அல்லது “அவளைப் பொதுவில் இழிவுபடுத்த.”
    reason: lexical_alternative
  - marker: c
    text: சொற்படியாக, “அவளை இரகசியமாக அனுப்பிவிட.” இச்சூழலில் இது நிச்சயதார்த்தக் காலத்தில் உறவை முறையாக விவாகரத்து செய்வதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ αὐτῆς
  choice: அவளுடைய கணவன்
  rationale: ἀνήρ என்பது சூழலுக்கேற்ப ‘ஆண்’ அல்லது ‘கணவன்’ என்று பொருள்படும். யோசேப்பும் மரியாளும் சட்டபூர்வக் கட்டுப்பாடுடைய நிச்சயதார்த்த நிலையில் இருந்ததையும், உறவை முறையாகக் கலைப்பது தொடர்ந்து குறிப்பிடப்படுவதையும் கருத்தில் கொண்டு ‘கணவன்’ என மொழிபெயர்க்கப்பட்டது; உறவின் அந்நிலையை அடிக்குறிப்பு விளக்குகிறது.
- source_word: δίκαιος
  choice: நீதிமான்
  rationale: இச்சொல் யோசேப்பின் கடவுளுக்கு முன்பான நேர்மையையும் அவரது நடத்தையையும் குறிக்கிறது. சட்டநேர்மை அல்லது இரக்கம் என்ற ஒன்றுக்கு மட்டும் பொருளைக் குறுக்காமல், வேதாகமத் தத்துவ ஒலியையும் தக்கவைக்கிறது.
- source_word: δειγματίσαι
  choice: பொதுவில் அவமானப்படுத்த
  rationale: δειγματίζω பொதுமக்கள் முன் வெளிப்படுத்தி இழிவுக்கு உள்ளாக்கும் கருத்தைக் கொண்டுள்ளது. தமிழில் அதன் வெளிப்படையான அவமானப்படுத்தும் வலிமையை இயல்பாகத் தெரிவிக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: ἐβουλήθη
  choice: எண்ணினார்
  rationale: βούλομαι ஆலோசித்த நோக்கம் அல்லது தீர்மானத்தைச் சுட்டுகிறது. ‘எண்ணினார்’ என்பது இறுதி நடவடிக்கை ஏற்கெனவே நடந்ததாகக் கூறாமல் அவரது கருதிய முடிவை இயல்பாகத் தெரிவிக்கிறது.
- source_word: λάθρᾳ
  choice: இரகசியமாக
  rationale: λάθρᾳ என்பது பிறர் அறியாதவாறு அல்லது தனிப்பட்ட முறையில் என்பதைக் குறிக்கிறது. பொதுவில் அவமானப்படுத்துவதற்கு எதிரான கருத்தை ‘இரகசியமாக’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἀπολῦσαι
  choice: விவாகரத்து செய்ய
  rationale: யூத நிச்சயதார்த்தச் சூழலில் ἀπολύω சட்டபூர்வமாகக் கட்டுப்பட்ட உறவை முறித்தலைக் குறிக்கிறது. ‘அனுப்பிவிட’ என்பது சொற்படியான மாற்றாக இருந்தாலும், இன்றைய வாசகருக்கு சட்டரீதியான கருத்தை ‘விவாகரத்து செய்ய’ தெளிவாகத் தருகிறது.
- source_word: ὢν καὶ μὴ θέλων
  choice: நீதிமானாகவும் ... விரும்பாதவராகவும் இருந்ததால்
  rationale: இரு பங்கேற்புவினைத் தொடர்களும் யோசேப்பின் எண்ணத்திற்கான பின்னணியை வழங்குகின்றன. தமிழில் இயல்பான காரணப் பின்னணித் தொடராக அமைக்கப்பட்டாலும், நேர்மையும் அவமானப்படுத்த விரும்பாமையும் தனித்தனியாகத் தக்கவைக்கப்பட்டுள்ளன.
theological_decisions:
- issue: யோசேப்பை δίκαιος என வருணித்தல்
  choice: ‘நீதிமான்’ என்று மட்டும் மொழிபெயர்த்து, அது கடுமையான சட்டக் கடைப்பிடிப்பையா, இரக்கத்தையா, இரண்டையுமா குறிக்கிறது என்பதை உரையில் தீர்மானிக்கவில்லை.
  alternative: ‘நியாயமானவர்’ என்று சட்டநேர்மையை வலியுறுத்துதல் அல்லது இரக்கத்தை வெளிப்படையாகச் சேர்த்துப் பொருளுரைத்தல்.
  rationale: கிரேக்க உரை யோசேப்பை δίκαιος எனக் கூறுவதோடு, மரியாளை அவமானப்படுத்த அவர் விரும்பவில்லை என்றும் இணைக்கிறது. நேர்மைக்கும் இரக்கமுள்ள கட்டுப்பாட்டிற்கும் இடையிலான பொருள் அழுத்தத்தை மொழிபெயர்ப்பு திறந்தவாறே வைத்திருக்கிறது.
- issue: யோசேப்பு–மரியாள் உறவின் சட்டநிலை
  choice: முதன்மை உரையில் ‘கணவன்’ மற்றும் ‘விவாகரத்து செய்ய’ பயன்படுத்தப்பட்டன.
  alternative: ‘நிச்சயிக்கப்பட்டவர்’ மற்றும் ‘நிச்சயதார்த்தத்தை முறிக்க’, அல்லது சொற்படியாக ‘அவளுடைய ஆண்’ மற்றும் ‘அனுப்பிவிட’.
  rationale: முதல் நூற்றாண்டு யூத நிச்சயதார்த்தம் சட்டபூர்வக் கட்டுப்பாடுடையதாக இருந்தது; அதை முறையாகக் கலைக்க வேண்டியிருந்தது. தற்போதைய தமிழ் வாசகருக்கு அந்தச் சட்டவலிமையை முதன்மை உரை தெளிவாகத் தெரிவிக்கிறது; சொற்படியான மற்றும் வரலாற்றுச் சிறப்புள்ள மாற்றுகள் அடிக்குறிப்புகளில் பாதுகாக்கப்படுகின்றன.
