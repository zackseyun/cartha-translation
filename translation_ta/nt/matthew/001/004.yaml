id: MAT.1.4
reference: Matthew 1:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἀρὰμ δὲ ἐγέννησεν τὸν Ἀμιναδάβ, Ἀμιναδὰβ δὲ ἐγέννησεν τὸν Ναασσών, Ναασσὼν δὲ ἐγέννησεν τὸν Σαλμών,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/004.yaml
  text: Aram fathered Amminadab[a], and Amminadab fathered Nahshon, and Nahshon fathered Salmon.
translation:
  language: ta
  text: ஆராம்[a] அம்மினதாபைப் பெற்றார்; அம்மினதாப் நகசோனைப் பெற்றார்; நகசோன் சல்மோனைப் பெற்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ராம்.’ கிரேக்க மூலத்தில் ‘ஆராம்’ (Ἀράμ) என்று உள்ளது; எபிரெய வம்சப்பட்டியல் பெயர்வடிவத்தைப் பின்பற்றி ‘ராம்’ என்றும் வழங்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀρὰμ
  choice: ஆராம்
  rationale: கிரேக்க மூலத்தின் Ἀράμ என்ற பெயர்வடிவத்தைத் தமிழில் நேரடியாக ஒலிபெயர்க்கிறது; எபிரெய மரபில் காணப்படும் ‘ராம்’ மாற்றுவடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: δὲ
  choice: ; (தொடரிணைப்பு நிறுத்தக்குறியால் வெளிப்படுத்தப்பட்டது)
  rationale: இங்கு δέ எதிர்மறை வேறுபாட்டைக் காட்டாமல் வம்சவரிசையைத் தொடர்ந்து நகர்த்துகிறது. ஒவ்வொரு முறையும் ‘மேலும்’ என்று மொழிபெயர்ப்பதைவிட அரைப்புள்ளி இயல்பான தமிழ் ஓட்டத்தைக் கொடுக்கிறது.
- source_word: ἐγέννησεν
  choice: பெற்றார்
  rationale: வம்சப்பட்டியலில் ஆண் முன்னோரின் தந்தை–மகன் உறவு அல்லது வழித்தோன்றலைக் குறிக்கிறது. ‘பெற்றார்’ என்பது நவீனத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது; ‘பிறப்பித்தார்’ என்பதைவிட கண்ணியமான வழக்குச் சொல்.
- source_word: Ἀμιναδάβ
  choice: அம்மினதாப்
  rationale: கிரேக்கப் பெயரின் ஒலியையும், தமிழில் வேற்றுமை உருபு சேரும்போது பெயரின் வடிவம் தெளிவாக இருப்பதையும் கருத்தில் கொண்ட ஒலிபெயர்ப்பு.
- source_word: Ναασσών
  choice: நகசோன்
  rationale: இப்பெயரின் எபிரெயப் பின்னணியையும் பரவலான வேதாகமப் பெயர்வடிவத்தையும் கருத்தில் கொண்ட தமிழாக்கம்; கடுமையான கிரேக்க எழுத்துப்பெயர்ப்பான ‘நாஸ்ஸோன்’ தவிர்க்கப்பட்டது.
- source_word: Σαλμών
  choice: சல்மோன்
  rationale: கிரேக்க Σαλμών என்பதன் தெளிவான தமிழ் ஒலிபெயர்ப்பு; தனிப்பெயராக எளிதில் அடையாளம் காணக்கூடியது.
