  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வம்சப்பட்டியல் நடை. கிரேக்கத்தில் மீண்டும் மீண்டும் வரும் δέ என்பதன் தொடரிணைப்புப் பணி தமிழ் நிறுத்தக்குறியால் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது; பெயர்கள் மூலமொழிச் சான்றும் பரவலான வேதாகம அடையாளமும் சமநிலைப்படுத்தப்பட்டு வழங்கப்பட்டுள்ளன.
