id: MAT.1.2
reference: Matthew 1:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἀβραὰμ ἐγέννησεν τὸν Ἰσαάκ, Ἰσαὰκ δὲ ἐγέννησεν τὸν Ἰακώβ, Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰούδαν καὶ τοὺς ἀδελφοὺς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/002.yaml
  text: Abraham fathered Isaac[a], and Isaac fathered Jacob, and Jacob fathered Judah and his brothers,
translation:
  language: ta
  text: ஆபிரகாம் ஈசாக்குக்குத் தந்தையானார்[a]; ஈசாக்கு யாக்கோபுக்குத் தந்தையானார்; யாக்கோபு யூதாவுக்கும் அவனுடைய சகோதரர்களுக்கும் தந்தையானார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆபிரகாம் ஈசாக்கைப் பெற்றார்.” இவ்விடத்தில் கிரேக்க வினைச்சொல் தந்தைவழி வம்சத் தொடர்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: தந்தையானார்
  rationale: வம்சவரலாற்றுச் சூழலில் இந்த வினை ஆண் வழிப் பிறப்புறவையும் வம்சத் தொடர்பையும் குறிக்கிறது. ‘தந்தையானார்’ என்பது இன்றைய தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது; ‘பெற்றெடுத்தார்’ என்பதில் ஏற்படக்கூடிய தாய்வழிப் பிறப்பு என்ற தவறான எண்ணத்தையும் தவிர்க்கிறது.
- source_word: δὲ
  choice: தனி இணைப்புச் சொல்லாக மொழிபெயர்க்காமல், அரைப்புள்ளியால் தொடர்ச்சி காட்டப்பட்டது
  rationale: இங்கு δέ எதிர்மறை வேறுபாட்டைக் காட்டாமல் வம்சவரிசையின் அடுத்த படியை மெதுவாக இணைக்கிறது. தமிழில் மீண்டும் மீண்டும் ‘மேலும்’ அல்லது ‘அடுத்து’ என்று கூறுவதைவிட அரைப்புள்ளியுடன் தொடர்வது இயல்பான ஓட்டத்தை அளிக்கிறது.
- source_word: Ἰούδαν
  choice: யூதா
  rationale: இவர் யாக்கோபின் மகனான பழைய ஏற்பாட்டுக் கோத்திரத் தலைவர் யூதா; புதிய ஏற்பாட்டுக் காலத்து யூதாஸ் அல்ல. ‘யூதா’ என்பது தமிழில் அந்த வேறுபாட்டைத் தெளிவாகக் காட்டும் வழக்கமான பெயர் வடிவம்.
- source_word: ἀδελφοὺς αὐτοῦ
  choice: அவருடைய சகோதரர்கள்
  rationale: இங்கு ஆண்பால் பன்மை வடிவம் யூதாவின் சகோதரர்களாகிய யாக்கோபின் மற்ற மகன்களைக் குறிக்கிறது. ஆகவே பாலினத்தைப் பொதுமைப்படுத்தாமல் ‘சகோதரர்கள்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: Ἀβραὰμ / Ἰσαάκ / Ἰακώβ
  choice: ஆபிரகாம் / ஈசாக்கு / யாக்கோபு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் நிலையான பெயர் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
theological_decisions:
- issue: வம்சவரலாற்று வினைச்சொல்லின் மொழிபெயர்ப்பு
  choice: வசனம் முழுவதும் ‘தந்தையானார்’ என்ற உறவுமுறைச் சொல்லைப் பயன்படுத்துதல்
  alternative: ‘பெற்றார்’ அல்லது ‘பெற்றெடுத்தார்’ என்று மொழிபெயர்த்தல்
  rationale: இந்தத் தேர்வு கிரேக்கத்தின் தந்தைவழி வம்ச வலியுறுத்தலைத் தக்கவைக்கிறது. அதேவேளையில் ஒவ்வொரு உறவும் கட்டாயமாக உடனடியான தலைமுறைதான் என்று மூலத்தைவிட அதிகமாக வரையறுக்காமல், வம்சத் தொடர்பு குறித்த உண்மையான நெகிழ்வையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. பெயர்களுக்கு மரியாதைப் பன்மை வினைமுற்று பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சியான வம்சப்பட்டியலின் இயல்பான ஓட்டத்திற்காக δέ தனித்தனியாகச் சொல்லாக்கப்படாமல் நிறுத்தக்குறியால் உணர்த்தப்பட்டுள்ளது.
