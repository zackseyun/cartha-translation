id: MAT.3.11
reference: Matthew 3:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν ⸂ὑμᾶς βαπτίζω⸃ ἐν ὕδατι εἰς μετάνοιαν· ὁ δὲ ὀπίσω μου ἐρχόμενος ἰσχυρότερός μού ἐστιν, οὗ οὐκ εἰμὶ ἱκανὸς τὰ ὑποδήματα βαστάσαι· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ ⸂καὶ πυρί⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/011.yaml
  text: I indeed baptize you in water for repentance[a], but the one coming after me is stronger than I, whose sandals I am not worthy to carry[c][b]. He himself will baptize you in the Holy Spirit and fire.
translation:
  language: ta
  text: “மனந்திரும்புதலுக்காக நான் உங்களுக்குத் தண்ணீரில் திருமுழுக்கு அளிக்கிறேன்[a][b]. ஆனால் எனக்குப் பின்னால் வருகிறவர் என்னைவிட வலிமைமிக்கவர். அவருடைய செருப்புகளைச் சுமப்பதற்குக்கூட நான் தகுதியானவன் அல்ல. அவரே பரிசுத்த ஆவியிலும் நெருப்பிலும் உங்களுக்குத் திருமுழுக்கு அளிப்பார்[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தண்ணீரால்’ என்றும், பின்னர் ‘பரிசுத்த ஆவியாலும் நெருப்பாலும்’ என்றும் மொழிபெயர்க்கலாம்; இந்த இடங்களில் வரும் கிரேக்க ἐν என்ற முன்னிடைச்சொல் ‘-இல்’ அல்லது ‘-ஆல்’ என்ற இரு பொருள்களையும் கொள்ளக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘மனந்திரும்புதலை நோக்கி’ என்றும் புரிந்துகொள்ளலாம். கிரேக்கச் சொற்றொடர் நோக்கு அல்லது திசையைச் சுட்டுகிறது; மனந்திரும்புதல் திருமுழுக்கிற்கு முன்பே நிகழ்கிறதா அல்லது திருமுழுக்கினால் அடையாளப்படுத்தப்படுகிறதா என்பதை அது இங்கே வெளிப்படையாகத் தீர்மானிக்கவில்லை.
    reason: lexical_alternative
  - marker: c
    text: இங்கே ‘நெருப்பு’ தூய்மைப்படுத்துதலையோ தீர்ப்பையோ குறிக்கலாம்; கிரேக்க உரை உருவகத்தைத் திறந்த நிலையில் விடுகிறது, எனவே சுற்றியுள்ள சூழலைக் கொண்டு புரிந்துகொள்ள வேண்டும்.
    reason: alternative_reading
lexical_decisions:
- source_word: βαπτίζω / βαπτίσει
  choice: திருமுழுக்குக் கொடுக்கிறேன் / திருமுழுக்குக் கொடுப்பார்
  rationale: சடங்கான நீராட்டைக் குறிக்கும் நிலைபெற்ற, எளிதில் புரியும் தமிழ் சொற்றொடர்; செய்முறையை விளக்கி விரிவுபடுத்தாமல் கிரேக்க வினையின் சமயச் சூழலைக் காக்கிறது.
- source_word: ἐν ὕδατι
  choice: தண்ணீரில்
  rationale: ἐν என்பதன் இடப்பொருளை நேரடியாகக் காத்து, பின்னர் வரும் ‘பரிசுத்த ஆவியிலும் நெருப்பிலும்’ என்ற இணை அமைப்புடன் ஒத்திசைக்கிறது; ‘தண்ணீரால்’ என்பதும் சாத்தியம்.
- source_word: εἰς μετάνοιαν
  choice: மனந்திரும்புதலுக்காக
  rationale: εἰς என்பதன் நோக்கு அல்லது தொடர்பைக் குறிக்கும் பொருளை இயல்பான நவீன தமிழில் தருகிறது; மனந்திரும்புதல் திருமுழுக்கிற்கு முன்பா அல்லது அதனால் அடையாளப்படுத்தப்படுகிறதா என்பதைத் தீர்மானிக்கவில்லை.
- source_word: ὁ δὲ ὀπίσω μου ἐρχόμενος
  choice: ஆனால் எனக்குப் பின்னால் வருகிறவர்
  rationale: பெயர்ச்சொல் நிலையில் உள்ள நிகழ்காலப் பங்கேற்பையும், ὀπίσω μου என்பதன் தொடர்வரிசைப் பொருளையும் இயல்பாகக் காக்கிறது.
- source_word: ἰσχυρότερός μού
  choice: என்னைவிட வலிமைமிக்கவர்
  rationale: ஒப்பீட்டு வடிவத்தைத் தெளிவாகவும் கண்ணியமான நவீன தமிழிலும் வழங்குகிறது.
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς
  choice: நான் தகுதியானவன் அல்ல
  rationale: ἱκανός என்பதற்கு ‘போதுமானவன்/திறனுள்ளவன்’ என்ற பொருள்களும் இருந்தாலும், இங்குள்ள தாழ்மை மொழிநடையில் ‘தகுதியானவன் அல்ல’ என்பது பொருத்தமானது.
- source_word: τὰ ὑποδήματα βαστάσαι
  choice: அவருடைய செருப்புகளைச் சுமப்பதற்கு
  rationale: βαστάσαι என்பதன் ‘சுமத்தல்/எடுத்துச் செல்லுதல்’ என்ற பொருளைத் துல்லியமாகக் காக்கிறது; ‘கழற்றுதல்’ என்று மாற்றவில்லை. ὑποδήματα என்பதற்கு ordinary modern Tamil-இல் ‘செருப்புகள்’ இயல்பானது.
- source_word: αὐτὸς
  choice: அவரே
  rationale: யோவானின் செயலைத் தொடர்ந்து வருகிறவரின் செயலுடன் வேறுபடுத்தும் வலியுறுத்தலைக் காக்கிறது.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: பரிசுத்த ஆவியில்
  rationale: இச்சூழலில் தனிப்பட்ட பரிசுத்த ஆவியைக் குறிக்கும் வழக்கமான புதிய ஏற்பாட்டுப் புரிதலைத் தருகிறது; ἐν என்பதற்காக ‘-இல்’ வடிவம் வைக்கப்பட்டுள்ளது.
- source_word: καὶ πυρί
  choice: நெருப்பிலும்
  rationale: ‘பரிசுத்த ஆவியிலும்’ என்பதோடு இணையான அமைப்பைத் தக்கவைத்து, நெருப்பு தூய்மைப்படுத்துதலையா தீர்ப்பையா குறிக்கிறது என்பதை முதன்மை உரையில் தீர்மானிக்கவில்லை.
theological_decisions:
- issue: ‘பரிசுத்த ஆவியும் நெருப்பும்’ என்பதன் பொருள்
  choice: ‘பரிசுத்த ஆவியிலும் நெருப்பிலும்’ என்று விளக்க விரிவாக்கமின்றி வைத்தல்
  alternative: ‘பரிசுத்த ஆவியிலும் தூய்மைப்படுத்தும் நெருப்பிலும்’ அல்லது ‘பரிசுத்த ஆவியிலும் தீர்ப்பின் நெருப்பிலும்’
  rationale: உடனடி சூழல் தூய்மைப்படுத்துதல் அல்லது தீர்ப்பு ஆகிய வாசிப்புகளுக்கு இடமளிக்கிறது. கிரேக்க உரையின் திறந்த உருவகத்தையும் இறையியல் இழுபறியையும் மொழிபெயர்ப்பு காக்கிறது.
- issue: πνεύματι ἁγίῳ என்பதன் குறிப்பு
  choice: ‘பரிசுத்த ஆவி’
  alternative: ‘பரிசுத்தமான ஆவி’ அல்லது ‘பரிசுத்த ஆவியின் வல்லமை’
  rationale: மத்தேயுவின் சூழலில் இது பரிசுத்த ஆவியைக் குறிப்பதாகப் புரிவது இயல்பானது; ‘வல்லமை’ போன்ற உரையில் இல்லாத விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘அவரே’ என்பது αὐτός-இன் வலியுறுத்தலைக் காக்கிறது. ‘செருப்புகளைச் சுமப்பதற்குக்கூட’ என்பது அடிமைத்தனமான எளிய பணியையும் செய்யத் தகுதியில்லை என்ற யோவானின் தாழ்மையை இயல்பாக வெளிப்படுத்துகிறது. அடிக்குறி குறிகள் அனைத்தும் சம்பந்தப்பட்ட சொற்றொடர்களுக்குப் பின்னர் முதன்மை உரையில் இடப்பட்டுள்ளன.
