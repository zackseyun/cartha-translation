source:
  edition: SBLGNT
  text: καὶ μὴ δόξητε λέγειν ἐν ἑαυτοῖς· Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/009.yaml
  text: And do not presume to say among yourselves[a], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
translation:
  language: ta
  text: '“ஆபிரகாம் எங்களுக்குத் தந்தை” என்று உங்களுக்குள் சொல்லிக்கொள்ளலாம் என எண்ணாதீர்கள்.[a] ஏனெனில் நான் உங்களுக்குச் சொல்கிறேன்: இந்தக் கற்களிலிருந்துகூட ஆபிரகாமுக்குப் பிள்ளைகளை எழுப்பக் கடவுளால் முடியும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் மனத்திற்குள் சொல்லிக்கொள்ள.” கிரேக்கச் சொற்றொடர் ஒருவர் தம் மனத்திற்குள் சொல்லிக்கொள்வதையோ, அவர்கள் ஒரு குழுவாகத் தங்களுக்கிடையே சொல்லிக்கொள்வதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δόξητε
  choice: சொல்லிக்கொள்ளத் துணியாதீர்கள்
  rationale: μή உடன் வரும் aorist subjunctive, ஆதாரமற்ற தன்னம்பிக்கையான எண்ணத்தை ஏற்றுக்கொள்ள வேண்டாம் என்ற எச்சரிக்கையைத் தருகிறது. ‘துணியாதீர்கள்’ என்பது வெறும் ‘நினைக்காதீர்கள்’ என்பதைவிட யோவானின் கடிந்துரைக்கும் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: λέγειν ἐν ἑαυτοῖς
  choice: உங்களுக்குள் சொல்லிக்கொள்ள
  rationale: இந்தக் கிரேக்கச் சொற்றொடர் உள்ளார்ந்த தனக்குத்தானான பேச்சையோ, குழுவினரிடையே சொல்லிக்கொள்வதையோ குறிக்கலாம். ‘உங்களுக்குள்’ இரு சாத்தியங்களையும் ஓரளவு திறந்துவைக்கிறது; அடிக்குறிப்பு ambiguity-ஐ விளக்குகிறது.
- source_word: Πατέρα ἔχομεν τὸν Ἀβραάμ
  choice: ஆபிரகாம் எங்களுக்குத் தந்தையாக இருக்கிறார்
  rationale: ஆபிரகாமிய வம்சத்தைத் தங்களுடைய பாதுகாப்பான உரிமையாக முன்வைக்கும் வலியுறுத்தப்பட்ட கூற்றை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: λέγω γὰρ ὑμῖν
  choice: ஏனெனில் நான் உங்களுக்குச் சொல்கிறேன்
  rationale: γάρ தரும் விளக்கத் தொடர்பையும், இயேசுவுக்கு முன் யோவானின் உரையில் உள்ள நேரடியான அறிவிப்பின் கம்பீரத்தையும் காக்கிறது.
- source_word: δύναται
  choice: கடவுளால் முடியும்
  rationale: இது கடவுளின் ஆற்றலைத் தெளிவாகக் காட்டும் இயல்பான தமிழ் வடிவம்.
- source_word: ἐκ τῶν λίθων τούτων
  choice: இந்தக் கற்களிலிருந்துகூட
  rationale: ἐκ என்பதன் மூல/தொடக்கப் பொருளை ‘இலிருந்து’ காக்கிறது; ‘கூட’ வாக்கியத்தில் வெளிப்படும் அதிர்ச்சிகரமான சாத்தியத்தை இயல்பாக எடுத்துரைக்கிறது.
- source_word: ἐγεῖραι
  choice: எழுப்ப
  rationale: இங்கு சந்ததியினரை உண்டாக்குதல் அல்லது தோன்றச் செய்தல் என்ற பொருள். ‘எழுப்ப’ மூல வினையின் உருவக வலிமையையும் வேதாகம ஒலியையும் காக்கிறது; உயிர்த்தெழுதலை மட்டும் குறிப்பதாகத் தீர்மானிப்பதில்லை.
- source_word: τέκνα
  choice: பிள்ளைகள்
  rationale: பாலின வேறுபாடின்றி குழந்தைகள் அல்லது சந்ததியினரைக் குறிக்கிறது. ‘பிள்ளைகள்’ நவீன தமிழில் இயல்பாகவும் உள்ளடக்கமானதாகவும் உள்ளது.
- source_word: τῷ Ἀβραάμ
  choice: ஆபிரகாமுக்குப்
  rationale: dative வடிவம் ஆபிரகாமுடன் உறவுடைய, அவருக்குச் சந்ததியாகும் பிள்ளைகள் என்ற பொருளைத் தருகிறது; ‘ஆபிரகாமுக்கு’ அதனைச் சுருக்கமாகக் காக்கிறது.
theological_decisions:
- issue: ஆபிரகாமின் வழிவந்தவர்கள் என்ற உரிமையின் பொருள்
  choice: ஆபிரகாமின் உடல்வழிச் சந்ததி என்பதையே கடவுளுக்கு முன் போதுமான பாதுகாப்பாக நம்புவதை வசனம் கண்டிக்கிறது; இஸ்ரவேலின் வரலாற்றுத் தந்தை ஆபிரகாம் என்பதை மறுப்பதில்லை.
  alternative: இது வம்ச உரிமையை விமர்சிக்காத வெறும் மிகைப்படுத்தல்; அல்லது இன இஸ்ரவேல் முழுமையாக மாற்றப்பட்டதாகக் கூறுகிறது.
  rationale: மூல உரை வம்சத்தைச் சார்ந்த தன்னம்பிக்கையை நேரடியாகக் கண்டிக்கிறது. ஆனால் பிற்கால மாற்றீட்டுக் கோட்பாடுகளையோ மற்றொரு விரிவான இறையியல் முடிவையோ வெளிப்படையாகக் கூறவில்லை; மொழிபெயர்ப்பு அந்தத் தளராத பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், யோவானின் கடுமையான எச்சரிக்கைக்கு ஏற்ற கண்ணியமான தொனியுடனும் வடிவமைக்கப்பட்டது. நேரடிப் பேச்சு தெளிவாகக் குறிக்கப்பட்டுள்ளது; [a] குறி முதன்மை உரையில் இடம்பெற்றுள்ளது.
