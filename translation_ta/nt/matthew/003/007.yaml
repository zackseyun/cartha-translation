id: MAT.3.7
reference: Matthew 3:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων ἐρχομένους ἐπὶ τὸ βάπτισμα ⸀αὐτοῦ εἶπεν αὐτοῖς· Γεννήματα ἐχιδνῶν, τίς ὑπέδειξεν ὑμῖν φυγεῖν ἀπὸ τῆς μελλούσης ὀργῆς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/007.yaml
  text: But when he saw many of the Pharisees and Sadducees coming for his baptism[a], he said to them, “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: ta
  text: ஆனால் பரிசேயர்களிலும் சதுசேயர்களிலும் பலர் தன்னுடைய திருமுழுக்கிற்கு வருவதை அவர் கண்டபோது, அவர்களிடம், “விரியன் பாம்புகளின் சந்ததிகளே[a], வரவிருக்கும் சினத்திலிருந்து தப்பியோடும்படி உங்களை எச்சரித்தவர் யார்?[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விரியன் பாம்புக் கூட்டமே.”
    reason: γεννήματα என்ற சொல்லை வழித்தோன்றலைக் குறிக்கும் ‘சந்ததிகள்’ என்றும் ஒரே இனக்கூட்டத்தைக் குறிக்கும் ‘கூட்டம்’ என்றும் சூழலுக்கேற்ப இயல்பாக வழங்கலாம்.
  - marker: b
    text: அல்லது, “வரப்போகும் சினத்திலிருந்து தப்பியோட உங்களுக்கு வழிகாட்டியவர் யார்?”
    reason: ὑποδείκνυμι என்பதற்கு ‘எச்சரித்தல்’ என்பதோடு ‘காட்டுதல்/வழிகாட்டுதல்’ என்ற சொல்லியல் வாய்ப்பும் உண்டு.
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: ஆனால் ... அவர் கண்டபோது
  rationale: இறந்தகாலப் பங்கேற்புவினையை இயல்பான தமிழ்க் காலத் துணைவாக்கியமாக அளிக்கிறது; δέ காட்டும் மென்மையான மாறுபாட்டை ‘ஆனால்’ தக்கவைக்கிறது.
- source_word: πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: பரிசேயர்களிலும் சதுசேயர்களிலும் பலர்
  rationale: முழுக் குழுக்களையும் அல்லாமல் அவற்றைச் சேர்ந்த பலரைக் குறிக்கும் பகுதிப்பொருள் அமைப்பைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ἐρχομένους ἐπὶ τὸ βάπτισμα αὐτοῦ
  choice: தன்னுடைய திருமுழுக்கிற்கு வருவதை
  rationale: அவர்கள் யோவானின் திருமுழுக்கு நிகழ்வு அல்லது ஊழியத்தை நோக்கி வந்தனர் என்பதைக் காட்டுகிறது; இந்த வசனம் வெளிப்படையாகக் கூறாத ‘அவரால் திருமுழுக்குப் பெற’ என்ற விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: Γεννήματα ἐχιδνῶν
  choice: விரியன் பாம்புகளின் சந்ததிகளே
  rationale: γεννήματα என்பதன் பிறப்பு அல்லது வழித்தோன்றல் கருத்தையும் ἐχιδνῶν என்பதன் குறிப்பான நச்சுப்பாம்பு உருவகத்தையும் கூர்மையான தீர்க்கதரிசனக் கண்டனமாகத் தக்கவைக்கிறது.
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: உங்களை எச்சரித்தவர் யார்?
  rationale: ὑποδείκνυμι என்பதற்கு ‘காட்டுதல்’ என்ற அடிப்படைப் பொருள் இருந்தாலும், வரவிருக்கும் சினத்திலிருந்து ஓடுதல் என்ற சூழலில் எச்சரித்தல் என்ற பொருள் இயல்பானது.
- source_word: φυγεῖν ἀπὸ
  choice: இருந்து தப்பியோடும்படி
  rationale: φυγεῖν கூறும் அவசரமான ஓட்டத்தின் படிமத்தை ‘தப்பியோடு’ தக்கவைக்கிறது.
- source_word: τῆς μελλούσης ὀργῆς
  choice: வரவிருக்கும் சினம்
  rationale: μέλλω காட்டும் வருங்கால அல்லது நெருங்கிவரும் தன்மையையும் ὀργή என்பதன் கடுமையான இறையியல் நிறையையும் மென்மைப்படுத்தாமல் அளிக்கிறது.
theological_decisions:
- issue: அழைக்கப்பட்ட குழுக்களின் வரம்பு
  choice: பரிசேயர்களையும் சதுசேயர்களையும் சேர்ந்த பலரையே யோவான் நேரடியாகக் கண்டிக்கிறார்.
  alternative: பரிசேயர், சதுசேயர் அனைவரையும் ஒரே தொகுதியாகக் குறிப்பிடுதல்.
  rationale: πολλούς உடன் வரும் பகுதி வேற்றுமை அமைப்பு அந்தக் குழுக்களில் ஒரு பகுதியைக் குறிக்கிறது; கிரேக்கம் கூறுவதைத் தாண்டிப் பொதுமைப்படுத்தாமல் கண்டனத்தின் கூர்மையை இது காக்கிறது.
- issue: ὀργή என்பதன் இறுதிக்கால வலிமை
  choice: சினம்
  alternative: தீர்ப்பு அல்லது தண்டனை
  rationale: ‘சினம்’ மூலச்சொல்லின் உணர்ச்சிசார் மற்றும் இறையியல் கனத்தைத் தக்கவைக்கிறது; அதை விளைவைக் குறிக்கும் ‘தண்டனை’ என மாற்றி அமைப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் மரியாதைமிக்க ஆனால் நேரடியான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஞானஸ்நானம்’ என்பதற்குப் பதிலாக மூலத்தின் βάπτισμα கருத்துக்கு நெருக்கமான, தேவையற்ற பிரிவுசார் நிறம் குறைந்த ‘திருமுழுக்கு’ தேர்ந்தெடுக்கப்பட்டுள்ளது. தீர்க்கதரிசனக் கண்டனத்தின் கடுமை மென்மைப்படுத்தப்படவில்லை.
