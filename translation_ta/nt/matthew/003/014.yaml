source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Ἰωάννης διεκώλυεν αὐτὸν λέγων· Ἐγὼ χρείαν ἔχω ὑπὸ σοῦ βαπτισθῆναι, καὶ σὺ ἔρχῃ πρός με;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/014.yaml
  text: But John kept trying to prevent him[a], saying, “I need to be baptized by you, and do you come to me?”
translation:
  language: ta
  text: ஆனால் யோவான் அவரைத் தடுக்கத் தொடர்ந்து முயன்று, “நான் உம்மால் திருமுழுக்குப் பெற வேண்டும்; நீரோ என்னிடம் வருகிறீர்?” என்று கூறினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διεκώλυεν
  choice: தடுக்கத் தொடர்ந்து முயன்று
  rationale: முற்றுப்பெறாத இறந்தகால வினை, தொடர்ந்த அல்லது மீண்டும் மீண்டும் மேற்கொண்ட முயற்சியைக் குறிக்கக்கூடும். தமிழில் இயல்பாக அதைப் பிரதிபலிக்கிறது; மாற்று வாசிப்பை அடிக்குறிப்பு தருகிறது.
- source_word: λέγων
  choice: என்றார்
  rationale: கிரேக்க நிகழ்கால வினையெச்சத்தைத் தமிழின் இயல்பான நேர்கூற்று முடிவாக அமைத்து, யோவானின் தடுப்பு முயற்சியோடு அவரது சொற்களின் தொடர்பைப் பேணுகிறது.
- source_word: χρείαν ἔχω
  choice: நான்தான் ... பெற வேண்டியவன்
  rationale: ‘எனக்குத் தேவை’ என்ற பொருளை, அடுத்துள்ள எதிர்மறை வினாவோடு இயல்பான தமிழில் வலியுறுத்திப் பதிவு செய்கிறது.
- source_word: ὑπὸ σοῦ
  choice: உம்மால்
  rationale: செயப்பாட்டு வினையோடு ὑπό + உடைமை வேற்றுமை செய்பவரைக் குறிக்கிறது; மரியாதை ஒருமையைப் பேணுகிறது.
- source_word: βαπτισθῆναι
  choice: திருமுழுக்குப் பெற
  rationale: கிறிஸ்தவத் தமிழில் பரவலாகப் புரியக்கூடிய சொல்லைத் தேர்ந்தெடுத்து, செய்முறையை உரை கூறுவதற்கு மேலாகக் குறிப்பிட்டுவிடாமல் செயப்பாட்டுப் பொருளைப் பேணுகிறது.
- source_word: καὶ σὺ ἔρχῃ πρός με;
  choice: நீரோ என்னிடம் வருகிறீர்?
  rationale: καί உருவாக்கும் வியப்பும் முரண்பாடும் தமிழின் ‘-ஓ’ வலியுறுத்தலால் இயல்பாக வெளிப்படுகின்றன; நிகழ்கால வினாவும் பேணப்படுகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் இயேசு யோவானிடம் வந்ததற்கும் யோவானின் எதிர்ப்புக்கும் இடையிலான மென்மையான முரண்பாட்டைக் காட்டுகிறது.
theological_decisions:
- issue: இயேசுவுக்குத் திருமுழுக்குக் கொடுப்பதற்கான யோவானின் மறுப்பு
  choice: யோவான் இயேசுவிடம் திருமுழுக்குப் பெற வேண்டியவன் என்று உணர்ந்ததையும், இயேசுவின் மேன்மையையும் உரையில் உள்ளபடியே வெளிப்படுத்துதல்
  alternative: இதை முதன்மையாக இயேசுவின் பாவமின்மை பற்றியதாகவோ அல்லது பதவி/அதிகார வரிசை பற்றியதாகவோ விளக்குதல்
  rationale: வசனம் யோவானின் தேவை மற்றும் இயேசுவின் மேன்மையைத் தெரிவிக்கிறது; ஆனால் அதற்கான முழுத் தத்துவவியல் காரணத்தை விளக்கவில்லை. ஆகவே அந்தத் தத்துவவியல் அழுத்தம் தீர்க்கப்படாமல் பேணப்படுகிறது.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ். இயேசுவை நோக்கிய உரையில் ‘உம்மால்/நீரோ/வருகிறீர்’ என்ற மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. ‘திருமுழுக்கு’ நிறுவப்பட்ட கிறிஸ்தவச் சொல்லாகப் பயன்படுத்தப்பட்டாலும், முழுகச் செய்தல் என்ற முறையைத் தனியாகத் தீர்மானிக்கவில்லை.
