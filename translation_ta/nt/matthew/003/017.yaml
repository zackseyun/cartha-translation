revisions:
- from: அப்போது, இதோ, வானங்களிலிருந்து ஒரு குரல், “இவரே என் அன்பு மகன்; இவரில் நான் மகிழ்ச்சியடைந்தேன்” என்று சொன்னது.
  to: மேலும், இதோ, வானங்களிலிருந்து ஒரு குரல், “இவரே என் அன்புக்குரிய மகன்; இவரில் நான் மகிழ்ச்சி கொண்டேன்” என்று சொன்னது.
  rationale: The revision removes the unsupported temporal addition, retains the marked attention signal (‘இதோ’), preserves the Greek plural ‘from the heavens,’ and uses an idiomatic Tamil expression for divine pleasure without changing the aorist-oriented rendering or adding theological interpretation.
