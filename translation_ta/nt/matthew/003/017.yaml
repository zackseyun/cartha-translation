id: MAT.3.17
reference: Matthew 3:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ φωνὴ ἐκ τῶν οὐρανῶν λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/017.yaml
  text: And behold[a], a voice from the heavens said, “This is my beloved Son[b], with whom I am well pleased.”
translation:
  language: ta
  text: மேலும், இதோ, வானங்களிலிருந்து ஒரு குரல், “இவரே என் அன்புக்குரிய மகன்; இவரில் நான் மகிழ்ச்சி கொண்டேன்” என்று சொன்னது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: அப்போது, இதோ
  rationale: καί இங்கு நிகழ்வின் தொடர்ச்சியைக் காட்டுகிறது; ἰδού முக்கியமான நிகழ்வின் மீது கவனத்தை ஈர்க்கிறது. ‘அப்போது, இதோ’ என்பது இரண்டின் உரையாடல் ஓட்டத்தையும் சிறப்பான கவன ஈர்ப்பையும் காக்கிறது.
- source_word: φωνὴ
  choice: ஒரு குரல்
  rationale: தொடர்ந்து நேரடிப் பேச்சு வருவதால், இது வெறும் ஒலி அல்ல, தெளிவாகப் பேசும் குரல்.
- source_word: ἐκ τῶν οὐρανῶν
  choice: வானங்களிலிருந்து
  rationale: மூலத்தில் οὐρανῶν பன்மையில் இருப்பதைத் தமிழிலும் வெளிப்படையாகக் காக்கிறது.
- source_word: λέγουσα
  choice: என்று சொன்னது
  rationale: ‘குரல்’ என்பதுடன் இயல்பாக இணைந்து, மேற்கோள் உரையைத் தமிழில் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: Οὗτός ἐστιν
  choice: இவரே
  rationale: சுட்டுப்பெயர் மற்றும் வினையின் அடையாளப்படுத்தும் வலிமையை இயல்பான மரியாதைத் தமிழில் ‘இவரே’ தெரிவிக்கிறது.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: என் அன்பு மகன்
  rationale: υἱός என்பதன் மகன் உறவையும் ἀγαπητός என்பதன் அன்புக்குரிய நிலையும் எளிய, கண்ணியமான தமிழில் காக்கிறது.
- source_word: ἐν ᾧ
  choice: இவரில்
  rationale: ἐν என்பதன் ‘இல்’ வடிவை நேரடியாகக் காத்து, மூலவாக்கியத்தின் தொடர்பையும் அதன் சாத்தியமான வேதாகம எதிரொலியையும் தேவையின்றி விளக்காமல் விடுகிறது.
- source_word: εὐδόκησα
  choice: நான் மகிழ்ச்சியடைந்தேன்
  rationale: அஓரிஸ்ட் வினையின் இறந்தகால வடிவைத் தமிழில் காத்து, εὐδοκέω என்பதிலுள்ள மகிழ்ச்சி மற்றும் அங்கீகார உணர்வை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: இயேசுவைப் பற்றிய தெய்வீக மகன் அறிவிப்பு
  choice: என் அன்பு மகன்
  alternative: எனக்கு அன்பான மகன்
  rationale: மூலத்தில் உள்ள மகன் உறவையும் அன்புக்குரியவர் என்ற அறிவிப்பையும் நேரடியாகக் காக்கிறது; தத்தெடுப்பு அல்லது பிற கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
- issue: ἐν ᾧ εὐδόκησα என்பதன் தொடர்பு
  choice: இவரில் நான் மகிழ்ச்சியடைந்தேன்
  alternative: இவரைக் குறித்து நான் மிகவும் மகிழ்கிறேன்
  rationale: ἐν ᾧ என்பதன் உருவகத் திறந்தநிலையையும் εὐδόκησα என்பதன் அஓரிஸ்ட் வடிவையும் காக்கிறது; அதை வெறும் தற்போதைய அங்கீகாரமாக மட்டும் குறுக்கவில்லை.
- issue: οὐρανῶν என்ற பன்மை
  choice: வானங்களிலிருந்து
  alternative: வானத்திலிருந்து
  rationale: மூலத்தின் பன்மையை நேரடியாகப் பாதுகாக்கிறது; பழக்கமான ஒருமை வடிவத்திற்காக அதை ஒற்றைப்படுத்தவில்லை.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘இதோ’ பரிசுத்தமான கவன ஈர்ப்பு வலிமையைத் தருகிறது; ‘இவரே’ மரியாதையுடனான நேரடி அடையாளப்படுத்தலை வெளிப்படுத்துகிறது. மூலத்தின் பன்மை ‘வானங்களிலிருந்து’ என்றும் அஓரிஸ்ட் ‘மகிழ்ச்சியடைந்தேன்’ என்றும் காக்கப்பட்டுள்ளன.
