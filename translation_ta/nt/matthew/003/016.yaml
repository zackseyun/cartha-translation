id: MAT.3.16
reference: Matthew 3:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂βαπτισθεὶς δὲ⸃ ὁ Ἰησοῦς ⸂εὐθὺς ἀνέβη⸃ ἀπὸ τοῦ ὕδατος· καὶ ἰδοὺ ⸀ἠνεῴχθησαν οἱ οὐρανοί, καὶ εἶδεν ⸀πνεῦμα θεοῦ καταβαῖνον ὡσεὶ ⸀περιστερὰν ἐρχόμενον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/016.yaml
  text: And when Jesus was baptized[a], he immediately came up from the water. And behold, the heavens were opened[c][b], and he saw the Spirit of God descending like a dove and coming upon him.
translation:
  language: ta
  text: இயேசு திருமுழுக்கு பெற்றபின், உடனே தண்ணீரிலிருந்து மேலே வந்தார். இதோ, வானங்கள் திறக்கப்பட்டன; கடவுளின் ஆவி புறாவைப் போல இறங்கி அவர்மேல் வருவதை இயேசு கண்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαπτισθεὶς
  choice: திருமுழுக்குப் பெற்றவுடன்
  rationale: இறந்தகாலச் செயலெச்சத்தின் பிரதான வினைக்கு முந்திய கால உறவை இயல்பான தமிழில் காட்டுகிறது; செயப்பாட்டு பொருளையும் காக்கிறது.
- source_word: δὲ
  choice: தனி இணைப்புச் சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது கதைநடையை முன்னெடுக்கும் மென்மையான இணைப்பு; தமிழில் செயலெச்சத் தொடரே அந்த உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εὐθὺς
  choice: உடனே
  rationale: நிகழ்வின் விரைவான தொடர்ச்சியைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: ἀνέβη ἀπὸ τοῦ ὕδατος
  choice: தண்ணீரிலிருந்து மேலே வந்தார்
  rationale: ἀπό என்பதன் ‘இலிருந்து’ என்ற பொருளைத் துல்லியமாகக் காக்கிறது; ‘தண்ணீரைவிட்டு வெளியே’ என்று மூலத்தைவிட வலுப்படுத்தவில்லை.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் உயிரோட்டமான கதைநடைச் சொல்லின் வலிமையை நவீன தமிழில் காக்கிறது.
- source_word: ἠνεῴχθησαν οἱ οὐρανοί
  choice: வானங்கள் திறக்கப்பட்டன
  rationale: மூலத்தின் பன்மையையும் செயப்பாட்டு வடிவத்தையும் காக்கிறது.
- source_word: εἶδεν
  choice: அவர் கண்டார்
  rationale: எளிய இறந்தகாலப் பார்வை வினையை நேரடியாக வழங்குகிறது; சூழலில் காண்பவர் இயேசு என்பது தெளிவு.
- source_word: πνεῦμα θεοῦ
  choice: கடவுளின் ஆவி
  rationale: மூலத்தின் உரிமை வேற்றுமை அமைப்பை இயல்பான தமிழில் காக்கிறது; ‘தூய ஆவி’ என்று மூலத்தில் இல்லாத பட்டத்தைச் சேர்க்கவில்லை.
- source_word: καταβαῖνον
  choice: இறங்கி
  rationale: கீழ்நோக்கிய இயக்கத்தையும் நிகழ்ந்துகொண்டிருக்கும் செயலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὡσεὶ περιστερὰν
  choice: புறாவைப் போல
  rationale: ὡσεὶ குறிக்கும் ஒப்புமையைத் தெளிவாகக் காக்கிறது; ஆவியே சொற்பொருளில் புறா என்று அடையாளப்படுத்தவில்லை.
- source_word: ἐρχόμενον ἐπ’ αὐτόν
  choice: தம்மேல் வருவதை
  rationale: ἐρχόμενον என்பதன் பொதுவான ‘வருதல்’ பொருளையும் ἐπί குறிக்கும் அவர்மேலான இயக்கத்தையும் காக்கிறது; ‘வந்து அமர்ந்தது’ என்ற கூடுதல் விளக்கத்தைத் தவிர்க்கிறது.
theological_decisions:
- issue: πνεῦμα θεοῦ என்பது பொதுவான ஓர் ஆவியையா அல்லது கடவுளின் ஆவியையா குறிக்கிறது
  choice: கடவுளின் ஆவி
  alternative: கடவுளிடமிருந்து ஓர் ஆவி
  rationale: திருமுழுக்கு நிகழ்வின் சூழல் குறிப்பிட்ட கடவுளின் ஆவியைக் குறிக்கிறது; அதேவேளையில் மூலத்தில் இல்லாத ‘தூய ஆவி’ என்ற விரிவாக்கத்தைச் செய்யவில்லை.
- issue: ὡσεὶ περιστερὰν ஆவியைப் புறாவாக அடையாளப்படுத்துகிறதா அல்லது ஒப்புமையைச் சொல்கிறதா
  choice: புறாவைப் போல
  alternative: புறாவாக
  rationale: ὡσεὶ வெளிப்படையாக ஒப்புமையைக் குறிக்கிறது; அதன் தோற்றமா அல்லது இறங்கிய விதமா ஒப்பிடப்படுகிறது என்ற நுண்ணிய திறந்தநிலையை மொழிபெயர்ப்பு தேவையின்றி முடிவுசெய்யவில்லை.
- issue: ἐρχόμενον ἐπ’ αὐτόν என்பதை ‘அமர்ந்தது’ எனக் குறிப்பாக்க வேண்டுமா
  choice: தம்மேல் வருவதை
  alternative: தம்மேல் வந்து அமர்வதை
  rationale: மூல வினை ‘வருதல்’ என்பதே; புறா உருவகத்தின் அடிப்படையில் ‘அமர்தல்’ என்ற பொருளை இறக்குமதி செய்யாமல் இயக்கத்தை மட்டும் காக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. ‘திருமுழுக்கு’ என்பது βαπτίζω-வின் மூழ்குதல் சார்ந்த உருவகத்தை வெளிப்படுத்தும் பரவலாக அறியப்பட்ட தமிழ் வேதாகமச் சொல். ‘அவர்/தம்மேல்’ என்ற மரியாதை ஒருமை இயேசுவைக் குறிக்கிறது. மூலத்தில் உண்மையான உரைமாற்று அல்லது விளக்கமின்றிப் புரியாத தெளிவின்மை இல்லாததால் அடிக்குறிப்புகள் சேர்க்கப்படவில்லை.
