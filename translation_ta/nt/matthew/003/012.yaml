id: MAT.3.12
reference: Matthew 3:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ, καὶ διακαθαριεῖ τὴν ἅλωνα αὐτοῦ καὶ συνάξει τὸν σῖτον αὐτοῦ εἰς τὴν ⸀ἀποθήκην, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/012.yaml
  text: His winnowing fork is in his hand[a], and he will thoroughly clear his threshing floor and gather his wheat into the storehouse[b], but the chaff he will burn up with unquenchable fire.
translation:
  language: ta
  text: அவருடைய தூற்றும் கருவி[a] அவர் கையில் இருக்கிறது. அவர் தமது களத்தை முற்றிலும் சுத்தப்படுத்துவார்; தமது கோதுமையைக் களஞ்சியத்தில்[b] சேர்ப்பார்; ஆனால் பதரை அணைக்க முடியாத நெருப்பால் சுட்டெரிப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூற்றுமுறம்” அல்லது “தூற்றுக்கூடை.” தானியத்தை மேலே வீசித் தூற்றி, மணியிலிருந்து பதரைப் பிரிப்பதற்கான கருவி.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பண்டகசாலை” அல்லது “தானியக் களஞ்சியம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πτύον
  choice: தூற்றுக்கூடை
  rationale: தானியத்தை மேலே வீசித் தூற்றி, மணியிலிருந்து பதரைப் பிரிக்கப் பயன்படுத்திய வேளாண் கருவியை இயல்பான நவீன தமிழில் குறிக்கிறது; கருவியின் துல்லியமான வடிவம் உறுதியல்ல என்பதால் மாற்றுச் சொல்லை அடிக்குறிப்பில் தருகிறது.
- source_word: διακαθαριεῖ
  choice: முற்றிலும் தூய்மைப்படுத்தி
  rationale: வினையின் தீவிரப்படுத்தப்பட்ட, முழுமையாகச் சுத்தப்படுத்தும் பொருளைத் தக்கவைக்கிறது.
- source_word: ἅλωνα
  choice: களம்
  rationale: இச்சூழலில் தானியம் போரடிக்கப்பட்டு தூற்றப்படும் களத்தைக் குறிக்கும் இயல்பான தமிழ் வேளாண் சொல்.
- source_word: σῖτον
  choice: கோதுமை
  rationale: σῖτος பொதுவாகத் தானியத்தையும் குறிக்கலாம்; எனினும் பதருடன் எதிர்நிறுத்தப்படும் இத்தூற்றல் உருவகத்தில் ‘கோதுமை’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἀποθήκην
  choice: பண்டகசாலை
  rationale: தானியம் சேமிக்கப்படும் இடம் என்ற பொதுப் பொருளைத் தருகிறது; குறிப்பிட்ட கட்டட வடிவத்தை தேவையின்றி முன்வைப்பதில்லை.
- source_word: ἄχυρον
  choice: பதர்
  rationale: தூற்றும்போது தானியத்திலிருந்து பிரிக்கப்படும் பயனற்ற உமி அல்லது கழிவுப் பகுதியைச் சூழலுக்கு ஏற்ற தமிழில் குறிக்கிறது.
- source_word: κατακαύσει
  choice: முற்றிலும் எரித்துவிடுவார்
  rationale: முழுமையாக எரித்து அழிக்கும் கூட்டு வினையின் தீவிரத்தை வெளிப்படுத்துகிறது.
- source_word: πυρὶ ἀσβέστῳ
  choice: அணைக்க முடியாத நெருப்பால்
  rationale: தணிக்கவோ அணைக்கவோ இயலாத நெருப்பையும், தத்திவ் வேற்றுமையின் கருவிப் பொருளையும் இயல்பாகக் காட்டுகிறது.
- source_word: οὗ
  choice: அவருடைய
  rationale: முந்தைய வசனத்தில் வரும் ஒருவரைச் சார்ந்த உறவுச் சுட்டின் உடைமைப் பொருளைத் தமிழில் தெளிவாகத் தொடர்கிறது.
theological_decisions:
- issue: கோதுமையையும் பதரையும் பிரிக்கும் நியாயத்தீர்ப்பு உருவகம்
  choice: வேளாண் உருவகத்தையும் எதிர்காலச் செயல்களையும் விளக்கவுரையாக்காமல் அப்படியே தக்கவைத்தல்
  alternative: கோதுமை நீதிமான்களையும் பதர் பொல்லாதவர்களையும் நேரடியாகக் குறிக்கிறது என்று முதன்மை உரையிலேயே விரித்துரைத்தல்
  rationale: மூலவசனம் அடையாளப்படுத்தப்படுவோரை நேரடியாகப் பெயரிடாமல் கடுமையான பிரிப்பு மற்றும் நெருப்பு உருவகத்தை முன்வைக்கிறது; மொழிபெயர்ப்பு அந்தத் தெய்வவியல் அழுத்தத்தையும் இடைவெளியையும் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘களம்’, ‘பதர்’ போன்ற சுருக்கமான வேளாண் சொற்கள் உருவகத்தின் செறிவைத் தக்கவைக்கின்றன; அரிதாக இருக்கக்கூடிய கருவி மற்றும் சேமிப்பிடம் சார்ந்த சொற்களுக்கு அடிக்குறிப்புகள் வழங்கப்பட்டுள்ளன.
