  text: ποιήσατε οὖν καρπὸν ἄξιον τῆς μετανοίας
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/008.yaml
  text: Therefore[a], produce fruit worthy of repentance.
translation:
  language: ta
  text: ஆகவே, மனந்திரும்புதலுக்கு ஏற்ற கனியைக் கொடுங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனந்திரும்புதலுக்கு இசைவான கனியைக் கொடுங்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσατε
  choice: கொடுங்கள்
  rationale: இது இரண்டாம் நபர் பன்மை இறந்தகால ஏவல் வடிவம்; தீர்மானமான செயலைக் கோருகிறது. καρπός என்பதுடன் தமிழில் இயல்பாகப் பயன்படும் ‘கனி கொடுங்கள்’ என்ற சொற்றொடர், ‘செய்யுங்கள்’ என்பதைவிட உருவகத்தைத் தெளிவாகக் காக்கிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய எச்சரிக்கையிலிருந்து வரும் முடிவுறுத்தலைத் தெளிவாகவும் இயல்பாகவும் இணைக்கிறது.
- source_word: καρπὸν
  choice: கனி
  rationale: καρπός என்பதற்கான நேரடியான பொருள்; இங்கு மனந்திரும்புதலின் வெளிப்படையான விளைவு அல்லது நடத்தையைக் குறிக்கும் உருவகம். மூலத்தின் ஒருமை வடிவம் கூட்டுப்பொருளில் தக்கவைக்கப்படுகிறது.
- source_word: ἄξιον
  choice: ஏற்ற
  rationale: ἄξιος + பிறப்புவேற்றுமை இங்கு தகுதி, பொருத்தம் அல்லது ஒத்திசைவைத் தெரிவிக்கிறது. ‘ஏற்ற’ என்பது தகுதிச் சம்பாதிப்பைக் குறிக்காமல், மனந்திரும்புதலுடன் ஒத்துப்போகும் கனியைக் குறிக்கிறது.
- source_word: μετανοίας
  choice: மனந்திரும்புதலுக்கு
  rationale: μετάνοια இச்சூழலில் மனப்போக்கு மற்றும் வாழ்க்கையின் உண்மையான திருப்பத்தைக் குறிக்கிறது. தமிழ்க் கிறிஸ்தவச் சொல்வழக்கில் நிலைபெற்றுள்ள ‘மனந்திரும்புதல்’ இயல்பாகவும் பரந்த பொருளுடனும் உள்ளது.
theological_decisions:
- issue: καρπὸν ἄξιον τῆς μετανοίας என்ற சொற்றொடரின் பொருள்
  choice: உண்மையான மனந்திரும்புதலுக்கு ஒத்த வெளிப்படையான நடத்தையைக் கோரும் கட்டளை
  alternative: மனந்திரும்புதலைச் சம்பாதிக்கும் கனி அல்லது அதற்குச் சம மதிப்புடைய கனி
  rationale: பிறப்புவேற்றுமைக் கட்டமைப்பு தகுந்த ஒத்திசைவை அல்லது பொருத்தத்தைக் குறிக்கிறது; மனந்திரும்புதலைச் செயல்களால் வாங்குவதையோ உருவாக்குவதையோ அல்ல. ‘ஏற்ற’ என்பது அந்தத் தொடர்பைத் தக்கவைத்து, தேவையற்ற கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான கட்டளை நடை. ‘கனி கொடுங்கள்’ என்பது வேளாண்மை உருவகத்தையும் மூலத்தின் கட்டளை வலிமையையும் காக்கிறது; ‘மனந்திரும்புதல்’ நிலைபெற்ற இறையியல் சொல்லாக இருந்தாலும் சாதாரண வாசகருக்கும் புரியக்கூடியது.
