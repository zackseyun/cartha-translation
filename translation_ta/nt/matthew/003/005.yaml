  yaml_path: translation/nt/matthew/003/005.yaml
  text: Then Jerusalem[a], all Judea, and all the region around the Jordan were going out to him[c][b],
translation:
  language: ta
  text: அப்போது எருசலேமிலிருந்தும், யூதேயா முழுவதிலிருந்தும், யோர்தானைச் சுற்றியுள்ள பகுதி முழுவதிலிருந்தும் மக்கள் தொடர்ந்து அவரிடம் சென்று கொண்டிருந்தார்கள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தொடர்ந்து … சென்று கொண்டிருந்தார்கள்” என்பதற்கு, “சென்றுகொண்டே இருந்தார்கள்” என்றும் மொழிபெயர்க்கலாம்; கிரேக்க வினை வடிவம் நீடித்த அல்லது மீண்டும் மீண்டும் நிகழ்ந்த செயலைச் சுட்டலாம்.
    reason: lexical_alternative
  - marker: b
    text: “யூதேயா முழுவதிலிருந்தும்”, “யோர்தானைச் சுற்றியுள்ள பகுதி முழுவதிலிருந்தும்” என்பவை யோவானிடம் மக்கள் பெருமளவில் வந்ததை விவரிக்கும் பரந்த புவியியல் சொற்றொடர்கள்; அவை அந்தப் பகுதிகளிலிருந்த ஒவ்வொரு நபரையும் அவசியம் குறிக்கவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: முந்தைய பகுதியில் விவரிக்கப்பட்ட யோவானின் ஊழியத்தோடு மக்களின் வருகையை இணைக்கும் இயல்பான காலக் குறிப்பு.
- source_word: ἐξεπορεύετο
  choice: மக்கள் தொடர்ந்து ... சென்று கொண்டிருந்தார்கள்
  rationale: இறந்தகாலத்தில் நீடித்த அல்லது மீண்டும் மீண்டும் நிகழ்ந்த செயலைக் காட்டும் கிரேக்க imperfect வடிவத்தின் கூறைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது. ஒருமை வினைச்சொல்லோடு வரும் இடப்பெயர்கள் அவற்றின் குடிமக்களைக் குறிக்கும் ஆகுபெயர்கள் என்பதையும் ‘மக்கள்’ தெளிவாக்குகிறது.
- source_word: πρὸς αὐτόν
  choice: அவரிடம்
  rationale: ஒரு நபரை நோக்கிய இயக்கத்தைக் குறிக்கும் πρός + accusative அமைப்புக்கு இயல்பான தமிழ் வடிவம்.
- source_word: Ἱεροσόλυμα
  choice: எருசலேமிலிருந்து
  rationale: தமிழில் நிலைபெற்ற இடப்பெயர்; சென்று வருதலின் புறப்படும் இடத்தைத் தெளிவாக்க ‘இலிருந்து’ இணைக்கப்பட்டுள்ளது.
- source_word: πᾶσα ἡ Ἰουδαία
  choice: யூதேயா முழுவதிலிருந்தும்
  rationale: பகுதியை ஒட்டுமொத்தமாகச் சுட்டும் πᾶσα என்பதைக் காக்கிறது; ஒவ்வொரு குடிமகனையும் கணிதரீதியாகக் குறிக்க வேண்டியதில்லை.
- source_word: πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου
  choice: யோர்தானைச் சுற்றியுள்ள பகுதி முழுவதிலிருந்தும்
  rationale: περίχωρος என்பதன் சுற்றுப்புறப் பகுதி என்ற புவியியல் பொருளையும் யோர்தானுடனான தொடர்பையும் இயல்பான தமிழில் தருகிறது.
- source_word: καὶ ... καὶ
  choice: …இலிருந்தும், …இலிருந்தும்
  rationale: மூன்று புவியியல் மூலங்களையும் சேர்த்துக் காட்டும் தொடர்ச்சியான καί அமைப்பைத் தமிழின் இணைப்பும்மை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: புவியியல் முழுமைச் சொற்களின் வரம்பு
  choice: பரந்த மக்கள் வரவேற்பைக் குறிக்கும் பொதுவழக்காக உரையில் ‘முழுவதிலிருந்தும்’ என வைத்தல்
  alternative: ‘எல்லா மக்களும்’ என்று ஒவ்வொரு நபரையும் உள்ளடக்குவது போல மொழிபெயர்த்தல்
  rationale: πᾶσα உடன் வரும் பிரதேசப் பெயர்கள் பரவலான வருகையைச் சுட்டுகின்றன; அவை அவசியமாக ஒவ்வொரு தனிநபரையும் குறிக்கவில்லை. மூலத்தின் வலிமையைத் தக்கவைத்து தவறான தனிநபர் முழுமையைச் சேர்க்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதைமிக்க நடையைப் பயன்படுத்துகிறது. இடப்பெயர்கள் எழுவாய்களாக மக்களைக் குறிக்கும் கிரேக்க ஆகுபெயர் அமைப்பைத் தமிழில் புரியும்படி ‘மக்கள்’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது; imperfect கூறு ‘தொடர்ந்து ... சென்று கொண்டிருந்தார்கள்’ எனப் பாதுகாக்கப்பட்டுள்ளது.
