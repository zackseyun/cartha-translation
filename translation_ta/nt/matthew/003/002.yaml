  yaml_path: translation/nt/matthew/003/002.yaml
  text: and saying[a], “Repent[b], for the kingdom of heaven has drawn near.”
translation:
  language: ta
  text: அவர், “மனந்திரும்புங்கள்[a]; ஏனெனில் பரலோக அரசு நெருங்கி வந்துள்ளது[b]” என்று கூறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, உங்கள் மனப்பாங்கையும் வாழ்வுத் திசையையும் மாற்றுங்கள். இதற்கான கிரேக்கச் சொல் வெறும் வருத்தம் அல்லது குற்றவுணர்ச்சியை மட்டும் குறிக்காது.
    reason: lexical_clarification
  - marker: b
    text: இன்னும் சொல்லுக்குச் சொல் மொழிபெயர்த்தால், ‘வானங்களின் அரசு நெருங்கி வந்துள்ளது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: என்று சொல்லிக்கொண்டிருந்தார்
  rationale: முந்தைய வசனத்திலுள்ள எழுவாயுடன் தொடரும் நிகழ்காலப் பங்கேற்புவினையைத் தமிழில் இயல்பான தொடர்ச்சியான செயலாக வெளிப்படுத்துகிறது; ‘பிரசங்கித்தார்’ அல்லது ‘அறிவித்தார்’ என்ற கூடுதல் கருத்தைச் சேர்க்கவில்லை.
- source_word: Μετανοεῖτε
  choice: மனந்திரும்புங்கள்
  rationale: பன்மை ஏவல்வினையைத் தக்கவைத்து, சிந்தனை, மனப்பாங்கு, வாழ்வுத் திசை ஆகியவற்றின் அடிப்படை மாற்றத்தைக் குறிக்கும் நிலையானவும் இயல்பானவும் உள்ள தமிழ் சொல். வெறும் குற்றவுணர்ச்சி அல்லது வருத்தம் என்ற அளவுக்கு இதன் பொருளைக் குறுக்கவில்லை.
- source_word: ἤγγικεν
  choice: நெருங்கி வந்துள்ளது
  rationale: அரசு அண்மித்து வந்து இப்போது அருகில் உள்ளது என்ற கிரேக்க நிறைவுநிலையின் விளைவை வெளிப்படுத்துகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: மனந்திரும்ப வேண்டும் என்ற அழைப்புக்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: ἡ βασιλεία
  choice: அரசு
  rationale: βασιλεία என்பதில் உள்ள அரசாட்சி மற்றும் அரசுரிமைக்குட்பட்ட தளம் ஆகிய இரண்டையும் திறந்தவாறு வைத்திருக்கும் இயல்பான தமிழ் வேதாகமச் சொல்.
- source_word: τῶν οὐρανῶν
  choice: பரலோக
  rationale: சொல்லுக்குச் சொல் ‘வானங்களின்’ என்ற பன்மையாக இருந்தாலும், மத்தேயுவின் வழக்கமான மரியாதைமிக்க தொடரை நவீன தமிழில் இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: ‘பரலோக அரசு’ என்பதன் பொருள்
  choice: மத்தேயுவின் தனித்துவமான ‘பரலோக அரசு’ என்ற சொல்லாட்சியைத் தக்கவைத்தல்
  alternative: ‘கடவுளின் ஆட்சி’ அல்லது ‘பரலோகத்தின் ஆட்சி’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: மத்தேயுவின் இறையியல் சொல்லாட்சியைப் பாதுகாக்கிறது; ‘அரசு’ என்பது ஆட்சியையும் ஆட்சிக்குட்பட்ட தளத்தையும் உள்ளடக்கக்கூடிய உண்மையான பொருள் விரிவைத் தீர்மானிக்காமல் விடுகிறது.
- issue: μετανοεῖτε என்பதன் அழைப்பு
  choice: ‘மனந்திரும்புங்கள்’ என்று மொழிபெயர்த்தல்
  alternative: ‘உங்கள் சிந்தனையை மாற்றுங்கள்’
  rationale: இது வெறும் உணர்ச்சிபூர்வ வருத்தமாக அல்லாமல் உள்ளார்ந்த மனப்பாங்கு மற்றும் வாழ்வுத் திசை மாற்றமாகப் புரிந்துகொள்ளப்படும் இயல்பான தமிழ்; அடிச்சொல் விளக்கத்தை மட்டும் கொண்டு பொருளை அறிவுசார் மாற்றமாகக் குறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசிப்புக்கும் உரத்த வாசிப்புக்கும் ஏற்ற கண்ணியமான அறிவிப்பு நடை. முந்தைய வசனத்துடன் உள்ள இலக்கணத் தொடர்ச்சியை ‘சொல்லிக்கொண்டிருந்தார்’ வெளிப்படுத்துகிறது.
