id: MAT.3.3
reference: Matthew 3:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὗτος γάρ ἐστιν ὁ ῥηθεὶς ⸀διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/003.yaml
  text: 'For this is the one spoken of through Isaiah the prophet[a], saying: “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: ta
  text: 'ஏனெனில், “வனாந்தரத்தில் முழங்குகிற ஒருவரின் குரல்: ‘ஆண்டவரின்[b] வழியை ஆயத்தப்படுத்துங்கள்; அவருடைய பாதைகளை நேராக்குங்கள்’” என்று கூறிய இறைவாக்கினர் ஏசாயா மூலம் உரைக்கப்பட்டவர் இவரே.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'மாற்றாக, ஏசாயா 40:3-ன் எபிரெய உரையின் நிறுத்தத்தின்படி: “ஒருவரின் குரல் முழங்குகிறது: ‘வனாந்தரத்தில் ஆண்டவரின் வழியை ஆயத்தப்படுத்துங்கள்…’” என்றும் புரிந்துகொள்ளலாம்.'
    reason: ‘வனாந்தரத்தில்’ என்பது முழங்குகிறவருடன் இணைவதா, கட்டளையுடன் இணைவதா என்ற ஏசாயா 40:3-ன் மேற்கோள்-பின்னணி சார்ந்த மாற்று இணைப்பைத் தெரிவிக்கிறது.
  - marker: b
    text: இந்த மேற்கோள் ஏசாயா 40:3-ஐ எதிரொலிக்கிறது; அங்குள்ள எபிரெய உரையில் இவ்விடத்தில் YHWH என்ற இறைப்பெயர் உள்ளது.
    reason: கிரேக்க κυρίου என்பதன் பின்னணியில் உள்ள எபிரெய இறைப்பெயரை வாசகருக்குத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: οὗτος
  choice: இவரே
  rationale: உடனடி சூழலில் திருமுழுக்கு யோவானைக் குறிக்கும் சுட்டுப்பெயர்; ‘இவரே’ என்பது கிரேக்கத்தின் சுட்டும் வலியுறுத்தலையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத்தை அறிமுகப்படுத்தும் தொடர்புச் சொல்.
- source_word: ὁ ῥηθεὶς
  choice: உரைக்கப்பட்டவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் செயப்பாட்டு வினையெச்சத்தின் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: διὰ Ἠσαΐου τοῦ προφήτου
  choice: இறைவாக்கினர் ஏசாயா மூலம்
  rationale: διά + பிறப்புவேற்றுமை இங்கு இடைநிலை முகமையைக் குறிக்கிறது; ‘மூலம்’ என்பது தீர்க்கதரிசன உரையின் வழிமுறையைப் பாதுகாக்கிறது.
- source_word: λέγοντος
  choice: இவ்வாறு
  rationale: மேற்கோளை அறிமுகப்படுத்தும் λέγοντος என்பதன் செயல்பாட்டை இயல்பான தமிழ் மேற்கோள் அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: Φωνὴ βοῶντος
  choice: முழங்குகிற ஒருவரின் குரல்
  rationale: βοῶντος என்ற பிறப்புவேற்றுமை வினையெச்சத்தையும் φωνή என்பதையும் வெளிப்படையாகத் தக்கவைக்கிறது.
- source_word: ἐν τῇ ἐρήμῳ
  choice: வனாந்தரத்தில்
  rationale: யோவானின் பணியோடும் ஏசாயா 40:3 மேற்கோளோடும் தொடர்புடைய குடியிருப்பற்ற காட்டுப்பகுதியைக் குறிக்கிறது.
- source_word: Ἑτοιμάσατε
  choice: ஆயத்தப்படுத்துங்கள்
  rationale: தீர்மானமான செயலைக் கோரும் பன்மை கட்டளை வடிவத்தையும் தீர்க்கதரிசன நடையையும் காக்கிறது.
- source_word: τὴν ὁδὸν κυρίου
  choice: ஆண்டவரின் வழியை
  rationale: ὁδός என்பதன் நேரடியான மற்றும் உருவகப் பொருளையும் κυρίου என்பதன் கிரேக்க வடிவையும் தக்கவைக்கிறது.
- source_word: εὐθείας ποιεῖτε
  choice: நேராக்குங்கள்
  rationale: பாதைகளை நேராக ஆக்குமாறு கூறும் கட்டளை உருவகத்தை இயல்பான தமிழில் வழங்குகிறது.
- source_word: τὰς τρίβους αὐτοῦ
  choice: அவருடைய பாதைகளை
  rationale: τρίβος என்பதற்கு ‘பாதைகள்’ பொருத்தமானது; αὐτοῦ என்ற தனிப்பட்ட சுட்டையும் வெளிப்படையாகக் காக்கிறது.
theological_decisions:
- issue: எபிரெய மூலத்தில் YHWH என வரும் ஏசாயா 40:3 மேற்கோளில் κυρίου என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: யாவே / கர்த்தர் எனத் தெய்வீகப் பெயரை வெளிப்படையாகக் காட்டுதல்
  rationale: மத்தேயுவின் கிரேக்க உரை κυρίου என்று வாசிப்பதால் முதன்மை உரை ‘ஆண்டவர்’ என மொழிபெயர்க்கப்படுகிறது; மேற்கோளின் எபிரெயப் பின்னணியில் YHWH இருப்பது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: ἐν τῇ ἐρήμῳ என்பதன் தொடரியல் இணைப்பு
  choice: வனாந்தரத்தில் முழங்குகிறவர்
  alternative: வனாந்தரத்தில் ஆண்டவரின் வழியை ஆயத்தப்படுத்துங்கள்
  rationale: கிரேக்க சொல் வரிசையும் மத்தேயுவின் உடனடி சூழலும் இதை முழங்குகிறவருடன் இணைப்பதை ஆதரிக்கின்றன; ஏசாயா மேற்கோளின் எபிரெயப் பின்னணியில் காணப்படும் மாற்று நிறுத்தக்குறி/இணைப்பு உண்மையான தெளிவின்மையாக அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான தீர்க்கதரிசன நடை பயன்படுத்தப்பட்டுள்ளது. ‘இறைவாக்கினர்’ என்பது προφήτης என்பதற்கு தெளிவான சமகாலச் சொல்; ‘ஆயத்தப்படுத்துங்கள்’ மற்றும் ‘நேராக்குங்கள்’ ஆகியவை பன்மை கட்டளைகளைத் தக்கவைக்கின்றன.
