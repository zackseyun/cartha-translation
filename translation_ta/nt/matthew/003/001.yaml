  text: In those days John the Baptist came[a], preaching in the wilderness of Judea[b],
translation:
  language: ta
  text: அந்த நாட்களில் திருமுழுக்கு கொடுக்கும் யோவான்[a] யூதேயாவின் வனாந்தரத்தில் பிரசங்கித்துக்கொண்டு வந்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
