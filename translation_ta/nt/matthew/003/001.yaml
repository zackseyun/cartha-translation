    text: அல்லது, “திருமுழுக்காளர் யோவான்.”
    reason: lexical_alternative
  - marker: b
    text: “வந்தார்” என்பதற்கு “தோன்றினார்” என்றும் மொழிபெயர்க்கலாம். கிரேக்க மூலத்தில் இங்கு வரலாற்று நிகழ்கால வினை பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ ταῖς ἡμέραις ἐκείναις
  choice: அந்த நாட்களில்
  rationale: காலத்தைக் குறிக்கும் சொற்றொடரை இயல்பாகத் தருகிறது. δέ ஒரு மென்மையான கதைத் தொடர்பை உருவாக்குகிறது; தமிழில் தனியாக ‘அப்போது’ அல்லது ‘ஆனால்’ என்று சேர்க்காமல் வாக்கிய ஓட்டத்தில் அதை உணர்த்துவது இயல்பானது.
- source_word: παραγίνεται
  choice: வந்தார்
  rationale: புதிய நபர் கதை நிகழ்வுக்குள் வருவதைக் குறிக்கும் வரலாற்று நிகழ்கால வினை. நவீன தமிழ் கதைநடையில் இறந்தகாலமான ‘வந்தார்’ இயல்பாக உள்ளது; ‘தோன்றினார்’ என்பதும் சாத்தியம்.
- source_word: Ἰωάννης
  choice: யோவான்
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் நிலைபெற்ற பெயர் வடிவம்.
- source_word: ὁ βαπτιστὴς
  choice: திருமுழுக்கு கொடுக்கும் யோவான்
  rationale: βαπτιστής என்பதன் செயற்பொருளைத் தெளிவாகவும் சமயப்பிரிவு பெயராகத் தவறாகப் புரிந்துகொள்ள இடமில்லாமலும் தருகிறது.
- source_word: κηρύσσων
  choice: அறிவித்துக்கொண்டிருந்தார்
  rationale: முதன்மை வினையுடன் ஒரே காலத்தில் நடைபெறும் தொடர்ச்சியான அறிவிப்புச் செயலை நிகழ்காலப் பங்கேற்பு வடிவம் குறிக்கிறது. ‘அறிவித்துக்கொண்டிருந்தார்’ அதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν τῇ ἐρήμῳ
  choice: வனாந்தரத்தில்
  rationale: மக்கள் குடியிராத, பாழான நிலப்பகுதியைக் குறிக்கிறது; மணற்பாலை என்ற மிகக் குறுகிய நவீன பொருளைத் தவிர்க்கிறது.
- source_word: τῆς Ἰουδαίας
  choice: யூதேயாவின்
  rationale: இங்கு கோத்திரமான யூதாவை அல்ல, யூதேயா என்ற நிலப்பகுதியைக் குறிக்கிறது.
theological_decisions:
- issue: βαπτιστής என்ற யோவானின் அடைமொழி
  choice: திருமுழுக்கு கொடுக்கும் யோவான்
  alternative: திருமுழுக்காளர் யோவான்
  rationale: இது கோட்பாட்டைத் தீர்மானிக்கும் சொல் அல்ல; யோவானின் செயலைக் குறிக்கும் அடைமொழி. செயற்பொருளை வெளிப்படையாகத் தரும் வடிவம் சாதாரண வாசகருக்கு தெளிவாக உள்ளது; சுருக்கமான பெயரடை மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன, மரியாதைமிக்க பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. வசனம் 2-இல் வரும் நேரடி அறிவிப்பை அறிமுகப்படுத்துவதற்காக முடிவில் முக்காற்புள்ளி இடப்பட்டுள்ளது; ‘அறிவித்துக்கொண்டிருந்தார்’ என்பது κηρύσσων என்பதன் ஒரேகாலத் தொடர்ச்சியைப் பாதுகாக்கிறது.
