revisions:
- from: அவர்கள் தங்கள் பாவங்களை அறிக்கையிட்டுக்கொண்டு, யோர்தான் ஆற்றில் அவரால் திருமுழுக்குப் பெற்றுவந்தார்கள்.[a]
  to: அவர்கள் தங்கள் பாவங்களை ஒப்புக்கொண்டு, யோர்தான் ஆற்றில் அவரால் திருமுழுக்குப் பெற்றுக்கொண்டிருந்தார்கள்.[a]
  rationale: The revision preserves every source element while replacing an ambiguous Tamil aspectual expression with one that more clearly reflects the Greek imperfect. It also uses the natural confession idiom without adding theological interpretation. The footnote retains the legitimate simple-past alternative and explains why the main rendering reflects ongoing or repeated action.
