source:
  edition: SBLGNT
  text: καὶ ἐβαπτίζοντο ἐν τῷ Ἰορδάνῃ ⸀ποταμῷ ὑπ’ αὐτοῦ ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/006.yaml
  text: and they were being baptized by him in the Jordan River[a], confessing their sins.
translation:
  language: ta
  text: அவர்கள் தங்கள் பாவங்களை ஒப்புக்கொண்டு, யோர்தான் ஆற்றில் அவரால் திருமுழுக்குப் பெற்றுக்கொண்டிருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திருமுழுக்குப் பெற்றார்கள்.” கிரேக்க முற்றாத இறந்தகால வினைவடிவம் தொடர்ந்து அல்லது மீண்டும் மீண்டும் நிகழ்ந்த செயலை வலியுறுத்தக்கூடும்; அதனால் “திருமுழுக்குப் பெற்றுக்கொண்டிருந்தார்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: அவர்கள்
  rationale: தமிழில் முந்தைய வசனத்துடன் இயல்பாகத் தொடர, தனியாக ‘மேலும்’ என்று தொடங்காமல் எழுவாயுடன் வாக்கியம் அமைக்கப்பட்டுள்ளது; இணைப்புத் தொடர்ச்சி சூழலால் தெளிவாகிறது.
- source_word: ἐβαπτίζοντο
  choice: திருமுழுக்குப் பெற்றுவந்தார்கள்
  rationale: இது சடங்கைக் குறிக்கும் நிலைபெற்ற தமிழ்ச் சொல்லாட்சியைத் தக்கவைக்கிறது; ‘பெற்றுவந்தார்கள்’ என்பது கிரேக்க இறந்தகாலத் தொடர்வினையின் நீடித்த அல்லது மீண்டும் மீண்டும் நிகழ்ந்த செயல் நுணுக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது. செய்முறையைத் தனியாக வரையறுக்கவில்லை.
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: யோர்தான் ஆற்றில்
  rationale: ἐν என்பதன் இடப்பொருளையும், ποταμός என்பதால் வெளிப்படையாகக் கூறப்படும் ‘ஆறு’ என்பதையும் இயல்பான தமிழ் பெயரமைப்பில் தருகிறது.
- source_word: ὑπ’ αὐτοῦ
  choice: அவரால்
  rationale: ὑπό + பிறப்புவேற்றுமை குறிக்கும் செயற்படுத்துபவரைத் தெரிவிக்கிறது; உடனடிச் சூழலில் இது யோவானைக் குறிப்பிட்டாலும், மூலத்தின் பிரதிப்பெயரை அப்படியே காக்கிறது.
- source_word: ἐξομολογούμενοι
  choice: அறிக்கையிட்டுக்கொண்டு
  rationale: முதன்மைச் செயலுடன் ஒரே நேரத்தில் நிகழும் பங்கேற்பு வினையின் பொருளைத் தருகிறது; மனந்திரும்புதல் சூழலில் தவறுகளை வாய்மொழியாக ஒப்புக்கொள்வதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: தங்கள் பாவங்களை
  rationale: பன்மையான ‘பாவங்கள்’ என்பதையும், செய்பவர்களையே திரும்பக் குறிக்கும் உடைமைத் தொடர்பையும் தெளிவான தமிழில் காக்கிறது.
theological_decisions:
- issue: திருமுழுக்கின் செய்முறையை மொழிபெயர்ப்பிலேயே வரையறுப்பதா
  choice: சடங்கைக் குறிக்கும் ‘திருமுழுக்குப் பெற்றார்கள்’ என்ற நிலைபெற்ற சொல்லாட்சியைப் பயன்படுத்துதல்
  alternative: ‘முழுவதுமாக அமிழ்த்தப்பட்டார்கள்’ அல்லது ‘கழுவப்பட்டார்கள்’
  rationale: இவ்வசனம் யோவானால் யோர்தானில் நிகழ்த்தப்பட்ட சடங்கைக் கூறுகிறது; அதன் செய்முறையை விளக்கும் கூடுதல் சொற்களைச் சேர்ப்பதில்லை. ஆகவே எந்த ஒரு திருச்சபைப் பிரிவின் முடிவையும் மொழிபெயர்ப்பில் திணிக்காமல், சடங்குப் பெயரைப் பயன்படுத்துகிறது.
- issue: ἐβαπτίζοντο என்பதன் காலநிலை நுணுக்கம்
  choice: நீடித்த அல்லது மீண்டும் நிகழ்ந்த செயலாக ‘பெற்றுவந்தார்கள்’
  alternative: எளிய இறந்தகாலமாக ‘பெற்றார்கள்’
  rationale: கிரேக்க imperfect வடிவம் காட்சியில் தொடர்ந்து அல்லது பலரிடம் ஒன்றன்பின் ஒன்றாக நிகழ்ந்த செயலை முன்வைக்கக்கூடும்; அந்த நுணுக்கத்தை முதன்மை உரை காக்கிறது, ஆனால் எளிய இறந்தகாலமும் சாத்தியமான தமிழாக்கம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் மதிப்புமிக்க நடையில் அமைக்கப்பட்டுள்ளது. ‘அறிக்கையிட்டுக்கொண்டு’ என்பது பாவங்களை வெளிப்படையாக ஒப்புக்கொள்ளும் பொருளைத் தருகிறது; ‘அவரால்’ என்பது மூலத்தின் பிரதிப்பெயரையும் அதன் இயல்பான முன்னிலைச் சுட்டையும் காக்கிறது.
