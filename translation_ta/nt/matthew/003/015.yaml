  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν ⸂πρὸς αὐτόν⸃· Ἄφες ἄρτι, οὕτως γὰρ πρέπον ἐστὶν ἡμῖν πληρῶσαι πᾶσαν δικαιοσύνην. τότε ἀφίησιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/015.yaml
  text: But Jesus answered him[a], “Permit it for now, for in this way it is fitting for us to fulfill all righteousness.” Then he permitted him.
translation:
  language: ta
  text: 'ஆனால் இயேசு அவருக்குப் பதிலளித்துச் சொன்னார்: “இதை இப்போதைக்கு அனுமதியுங்கள். ஏனெனில், இவ்வாறே எல்லா நீதியையும்[a] நிறைவேற்றுவது நமக்குப் பொருத்தமானது.” அப்போது யோவான் அவருக்கு இடங்கொடுத்தார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நீதி” என்பதற்கான கிரேக்கச் சொல் நீதிமையையோ நியாயத்தையோ குறிக்கலாம். இங்கு, கடவுளுடைய விருப்பத்துக்கு ஏற்ப நடப்பது என்ற பரந்த பொருள் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν
  choice: அதற்கு இயேசு அவரிடம் … என்றார்
  rationale: முந்தைய வசனத்தில் யோவான் தெரிவித்த மறுப்புக்கு இயேசு அளிக்கும் பதில் என்பதை “அதற்கு” இயல்பாகக் காட்டுகிறது; “பதிலளித்து … சொன்னார்” என்ற தேவையற்ற இரட்டிப்பைத் தவிர்க்கிறது.
- source_word: Ἄφες ἄρτι
  choice: இப்போதைக்கு இதை அனுமதி
  rationale: ἀφίημι இங்கு ‘மன்னித்தல்’ அல்லது ‘விட்டுச் செல்லுதல்’ அல்ல, யோவான் திருமுழுக்கை மேற்கொள்ள அனுமதிப்பதைக் குறிக்கிறது. ἄρτι-யின் உடனடி, தற்காலிக நுணுக்கத்தை “இப்போதைக்கு” தக்கவைக்கிறது.
- source_word: οὕτως γὰρ
  choice: ஏனெனில், இவ்வாறே
  rationale: யோவான் இயேசுவுக்குத் திருமுழுக்கு அளிக்கும் முறையையே οὕτως சுட்டுகிறது; γάρ காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: πρέπον ἐστὶν ἡμῖν
  choice: நமக்கு ஏற்றதாக இருக்கிறது
  rationale: πρέπον கூறும் பொருத்தம் அல்லது தகுதியை, மிகக் கடுமையான சட்டக் கடமை போலச் சுருக்காமல் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: πληρῶσαι πᾶσαν δικαιοσύνην
  choice: எல்லா நீதியையும் நிறைவேற்றுவது
  rationale: πληρόω-வின் மத்தேயு நற்செய்திக்குரிய ‘நிறைவேற்றுதல்’ ஒலியையும், δικαιοσύνη-யின் விரிவான இறையியல் பொருளையும் குறுக்காமல் தக்கவைக்கிறது.
- source_word: τότε ἀφίησιν αὐτόν
  choice: அப்போது யோவான் அவருக்கு இடங்கொடுத்தார்
  rationale: வரலாற்று நிகழ்காலத்தைத் தமிழ் கதைநடைக்கேற்ற இறந்தகாலத்தில் தருகிறது. சூழலிலிருந்து தெளிவாகும் யோவானை வெளிப்படையாகக் குறிப்பிட்டு, அவர் இயேசுவின் கோரிக்கைக்கு இணங்கியதை “இடங்கொடுத்தார்” தெரிவிக்கிறது.
theological_decisions:
- issue: πᾶσαν δικαιοσύνην என்பதன் பொருள்
  choice: எல்லா நீதியையும்
  alternative: நீதியான அனைத்தையும்; எல்லா நியாயத்தையும்; நீதி கோருகிற அனைத்தையும்
  rationale: இச்சொற்றொடரை ஒவ்வொரு சட்டக் கட்டளையையும் நிறைவேற்றுதல் என்று குறுக்குவதோ, வசனம் வெளிப்படையாகச் சொல்லாத ஒரு முழுமையான கோட்பாட்டு அமைப்பாக விரிப்பதோ தவிர்க்கப்படுகிறது. உடனடிச் சூழலில், யோவானிடமிருந்து இயேசு திருமுழுக்குப் பெறுவதன் மூலம் கடவுளின் நீதியான விருப்பத்துக்கு ஏற்ப நடப்பது என்ற பரந்த பொருள் தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. “அனுமதி,” “நிறைவேற்றுவது,” “இடங்கொடுத்தார்” ஆகியவை மூலத்தின் மீளுரைகளையும் இறையியல் நுணுக்கத்தையும் இயல்பான தமிழில் தக்கவைக்கின்றன.
