source:
  edition: SBLGNT
  text: αὐτὸς δὲ ὁ Ἰωάννης εἶχεν τὸ ἔνδυμα αὐτοῦ ἀπὸ τριχῶν καμήλου καὶ ζώνην δερματίνην περὶ τὴν ὀσφὺν αὐτοῦ, ἡ δὲ τροφὴ ⸂ἦν αὐτοῦ⸃ ἀκρίδες καὶ μέλι ἄγριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/004.yaml
  text: John himself wore clothing made of camel’s hair and a leather belt around his waist[c][b][a], and his food was locusts and wild honey.
translation:
  language: ta
  text: யோவான் தாமே ஒட்டகமுடியால் ஆன ஆடையை அணிந்திருந்தார்[b]; தம் இடுப்பைச் சுற்றித் தோல் இடுப்புப்பட்டையைக் கட்டியிருந்தார்.[a] வெட்டுக்கிளிகளும் காட்டுத் தேனுமே அவருடைய உணவாக இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த உடை விவரிப்பு 2 இராஜாக்கள் 1:8-இல் வரும் இறைவாக்கினர் எலியாவின் தோற்றத்தை நினைவூட்டுகிறது; மத்தேயு யோவானைச் சித்தரிப்பதற்கான முக்கியமான பின்னணியாக இது அமைகிறது.
    reason: cross_reference
  - marker: b
    text: அல்லது, ‘ஒட்டகமுடியால் ஆன ஓர் ஆடை’.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ ὁ Ἰωάννης
  choice: யோவான் தாமே
  rationale: αὐτός தரும் வலியுறுத்தலை ‘தாமே’ இயல்பாகத் தக்கவைக்கிறது; δέ இங்கு மென்மையான தொடர்ச்சி என்பதால் தமிழில் தனிச்சொல்லாக வெளிப்படுத்தத் தேவையில்லை.
- source_word: εἶχεν τὸ ἔνδυμα αὐτοῦ
  choice: ஆடையை அணிந்திருந்தார்
  rationale: εἶχεν என்பதன் அடிப்படைப் பொருள் ‘வைத்திருந்தார்’ என்றாலும், ஆடை குறித்த இச்சூழலில் தொடர்ச்சியான அணிதலைக் குறிக்கும் ‘அணிந்திருந்தார்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἀπὸ τριχῶν καμήλου
  choice: ஒட்டகமுடியால் ஆன
  rationale: ἀπό இங்கு பொருளின் மூலப்பொருளைக் குறிக்கிறது; ‘ஒட்டகமுடியால் ஆன’ என்பது ஆடை எந்தப் பொருளால் செய்யப்பட்டது என்பதைத் தெளிவுபடுத்துகிறது.
- source_word: ζώνην δερματίνην
  choice: தோல் கச்சை
  rationale: ζώνη என்பது இடுப்பைச் சுற்றிக் கட்டும் பட்டை அல்லது கச்சை; பண்டைய ஆடைச் சூழலில் ‘கச்சை’ இயல்பானதும், δερματίνην குறிக்கும் தோல் பொருளையும் துல்லியமாகக் காட்டுவதுமாகும்.
- source_word: περὶ τὴν ὀσφὺν αὐτοῦ
  choice: தமது இடுப்பைச் சுற்றி
  rationale: ὀσφύς என்பதற்கு இச்சூழலில் ‘இடுப்பு’ என்பது நவீனத் தமிழில் இயல்பான இணை; περί சுற்றியிருப்பதைச் சுட்டுகிறது.
- source_word: ἡ δὲ τροφὴ ἦν αὐτοῦ
  choice: அவருடைய உணவாக இருந்தன
  rationale: τροφή என்பதற்கு நேரடியான ‘உணவு’ பயன்படுத்தப்படுகிறது; பட்டியலிடப்பட்ட இரண்டு உணவுப்பொருட்களோடு தமிழின் இயல்பான பன்மை வினை அமைப்பு இணைக்கப்பட்டுள்ளது.
- source_word: ἀκρίδες
  choice: வெட்டுக்கிளிகள்
  rationale: சொல்லின் வழக்கமான பொருள் உண்ணத்தக்க locust பூச்சிகள்; வேறு தாவரப் பொருளாக விளக்க ஆதாரம் இல்லை.
- source_word: μέλι ἄγριον
  choice: காட்டுத் தேன்
  rationale: ἄγριον என்பது வளர்ப்பு முறையில் பெறப்படாத, காட்டில் கிடைக்கும் தேனைச் சுட்டுகிறது; ‘காட்டுத் தேன்’ இயல்பான தமிழ்.
theological_decisions:
- issue: எலியாவை நினைவூட்டும் தீர்க்கதரிசனத் தோற்றம்
  choice: யோவானின் உடை மற்றும் உணவை உரையில் நேரடியாக விவரித்து, எலியாவுடனான தொடர்பை அடிக்குறிப்பில் மட்டும் குறிப்பிடுதல்
  alternative: எலியாவை வெளிப்படையாக நினைவூட்டும் விளக்கச் சொற்களை முதன்மை உரைக்குள் சேர்த்தல்
  rationale: கிரேக்க உரை யோவானின் தோற்றத்தையும் உணவையும் மட்டுமே விவரிக்கிறது. 2 இராஜாக்கள் 1:8 உடனான தொடர்பு முக்கியமானதாயினும், அதை மொழிபெயர்ப்புக்குள் புகுத்தாமல் வாசகர் குறிப்பாக வழங்குவது உரையின் விவரிப்பையும் அதன் மறைமுக ஒலிப்பையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட உரை. மரியாதைப் பன்மை தொடர்ச்சியாகப் பயன்படுத்தப்பட்டுள்ளது. ‘தோல் கச்சை’ பண்டைய உடைச் சூழலை இயல்பாகக் காட்டுகிறது; எலியாவுடனான தொடர்பு முதன்மை உரையில் விளக்கப்படாமல் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
