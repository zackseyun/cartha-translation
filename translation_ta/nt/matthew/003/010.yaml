  source_fidelity: மூலத்தின் காலவலிமையான ἤδη ‘இப்போதே’ எனத் துல்லியமாக வெளிப்படுகிறது. ἀξίνη, வேரருகே வைக்கப்பட்டிருக்கும் நிலை, οὖν-இன் விளைவுறுத்தல், கனிதராமை, வெட்டப்படுதல், நெருப்பில் எறியப்படுதல் ஆகிய அனைத்தும் கிரேக்க உருவகத்தையும் நிகழ்காலச் செயலற்ற வினை வடிவங்களையும் போதுமான துல்லியத்துடன் காக்கின்றன. நெருப்பின் பொருளைப் பற்றிய விளக்கத்தைச் சேர்க்காமல் விட்டிருப்பதும் சரியானது.
  naturalness: ‘மரங்களின் வேரருகே கோடரி வைக்கப்பட்டிருக்கிறது,’ ‘நல்ல கனி தராத ஒவ்வொரு மரமும்’ ஆகியவை நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமான வேதாகம நடையுடனும் உள்ளன. வாக்கிய ஓட்டமும் தெளிவானது.
  terminology: ‘கோடரி,’ ‘கனி தராத,’ ‘வெட்டப்பட்டு,’ ‘நெருப்பில் எறியப்படுகிறது’ ஆகிய சொற்கள் உருவகத்திற்கும் நடப்புத் தமிழ் பயன்பாட்டிற்கும் பொருத்தமானவை. அடிக்குறிப்பிலுள்ள ‘கிடக்கிறது’ κέῖται என்பதற்கான நேரடியான மாற்றை நன்றாக வழங்குகிறது.
