id: MAT.3.10
reference: Matthew 3:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἤδη ⸀δὲ ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται· πᾶν οὖν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/010.yaml
  text: And already the axe is laid at the root of the trees[a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: ta
  text: இப்போதே மரங்களின் வேரருகே கோடரி வைக்கப்பட்டிருக்கிறது[a]. ஆகவே, நல்ல கனி தராத ஒவ்வொரு மரமும் வெட்டப்பட்டு நெருப்பில் எறியப்படுகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மரங்களின் வேரருகே கோடரி கிடக்கிறது.’
    reason: κεῖται என்பதற்கான இன்னும் நேரடியான சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: ἤδη δὲ
  choice: இப்போதே
  rationale: ἤδη என்பதன் உடனடித் தன்மையை இயல்பான தமிழில் வலியுறுத்துகிறது; δέ இங்கு மென்மையான தொடர்புச்சொல் என்பதால் தனியாக மொழிபெயர்க்காமல் வாக்கிய ஓட்டத்தில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: ἡ ἀξίνη
  choice: கோடரி
  rationale: மரத்தை வெட்டும் கருவியைக் குறிக்கும் நேரடியான, பொதுவாகப் புரியும் தமிழ் சொல்.
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται
  choice: மரங்களின் வேரருகே ... வைக்கப்பட்டிருக்கிறது
  rationale: கோடரி ஏற்கெனவே வெட்டுவதற்குத் தயாராக வேருக்கு அருகில் இருப்பதைக் காட்டுகிறது. κεῖται என்பதிலுள்ள ‘கிடக்கிறது’ என்ற நேரடிப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: πᾶν οὖν δένδρον
  choice: ஆகவே ... ஒவ்வொரு மரமும்
  rationale: οὖν குறிக்கும் முடிவுறுத்தும் தொடர்பை ‘ஆகவே’ தெளிவாக வெளிப்படுத்துகிறது; πᾶν என்பதன் ஒவ்வொன்றையும் உள்ளடக்கும் பொருள் காக்கப்படுகிறது.
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: நல்ல கனி தராத
  rationale: மரத்தைப் பற்றிய தமிழ்ப் பயன்பாட்டில் ‘கனி தருதல்’ இயல்பானது; καλόν என்பதன் மதிப்பீட்டுப் பொருள் ‘நல்ல’ என்று நேரடியாகக் காக்கப்படுகிறது.
- source_word: ἐκκόπτεται
  choice: வெட்டப்படுகிறது
  rationale: மர உருவகத்தில் முற்றிலும் வெட்டி அகற்றப்படுவதைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: εἰς πῦρ βάλλεται
  choice: நெருப்பில் எறியப்படுகிறது
  rationale: βάλλεται என்பதன் வலிமையையும் நியாயத்தீர்ப்பு உருவகத்தையும் விளக்கச் சேர்க்கையின்றி காக்கிறது.
theological_decisions:
- issue: நெருப்பு உருவகத்தின் தன்மை
  choice: ‘நெருப்பு’ என்று மட்டும் மொழிபெயர்த்து, அதன் பொருளை விரிவுபடுத்தவில்லை.
  alternative: இறுதிக்கால நியாயத்தீர்ப்பு, காலத்திற்குட்பட்ட தண்டனை, அல்லது நரக நெருப்பு என்று குறிப்பாக்குதல்.
  rationale: வசனம் நியாயத்தீர்ப்பை உருவகமாகக் காட்டினாலும், நெருப்பின் தன்மையை இதற்கு மேல் வரையறுக்கவில்லை; எனவே மூலத்தின் இறையியல் திறப்பும் பதற்றமும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘கனி தருதல்’, ‘கோடரி’, ‘நெருப்பில் எறிதல்’ ஆகியவை உருவகத்தின் தெளிவையும் மூலத்தின் தீவிரத்தையும் காக்கின்றன.
