source:
  edition: SBLGNT
  text: Τότε παραγίνεται ὁ Ἰησοῦς ἀπὸ τῆς Γαλιλαίας ἐπὶ τὸν Ἰορδάνην πρὸς τὸν Ἰωάννην τοῦ βαπτισθῆναι ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/013.yaml
  text: Then Jesus comes from Galilee to the Jordan[a], to John[c][b], to be baptized by him.
translation:
  language: ta
  text: அப்போது இயேசு கலிலேயாவிலிருந்து யோர்தானுக்கு, யோவானிடம், அவரால் திருமுழுக்குப் பெறுவதற்காக வருகிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வருகிறார்’ என்பது கிரேக்க மூலத்தில் உள்ள வரலாற்று நிகழ்காலத்தைப் பிரதிபலிக்கிறது; தமிழில் ‘வந்தார்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: அப்போது
  rationale: அடுத்த நிகழ்வை அறிமுகப்படுத்தும் காலக் குறியீட்டை இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: παραγίνεται
  choice: வருகிறார்
  rationale: கிரேக்க மூலத்தின் வரலாற்று நிகழ்காலத்தையும் அதன் உயிரோட்டமான கதைநடையையும் தக்கவைக்கிறது.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: கலிலேயாவிலிருந்து
  rationale: ἀπό குறிக்கும் புறப்பட்ட இடத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐπὶ τὸν Ἰορδάνην
  choice: யோர்தானுக்கு
  rationale: இயக்கத்துடன் வரும் ἐπί + வேற்றுமை வடிவம் நோக்கிச் செல்லும் இடத்தைக் குறிக்கிறது; சூழலில் இது யோர்தான் ஆறு என்பது தெளிவு.
- source_word: πρὸς τὸν Ἰωάννην
  choice: யோவானிடம்
  rationale: ஒரு நபரை நோக்கிச் செல்லுதலை இயல்பான தமிழில் தெரிவிக்கிறது; மூலத்தில் இல்லாத ‘திருமுழுக்கு யோவான்’ என்ற பட்டம் சேர்க்கப்படவில்லை.
- source_word: τοῦ βαπτισθῆναι
  choice: திருமுழுக்குப் பெறுவதற்காக
  rationale: நோக்கத்தைக் குறிக்கும் செயப்பாட்டு articular infinitive-ஐ தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὑπ’ αὐτοῦ
  choice: தம்மிடம்
  rationale: யோவானே செயற்படுத்துபவர் என்பதைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது; ‘அவரால்’ என்பதைவிட ‘யோவானிடம் திருமுழுக்குப் பெறுதல்’ இயல்பான பயன்பாடு.
theological_decisions:
- issue: παραγίνεται என்ற வரலாற்று நிகழ்காலம்
  choice: ‘வருகிறார்’ என நிகழ்கால உயிரோட்டத்தைத் தக்கவைத்தல்
  alternative: ‘வந்தார்’ என்ற எளிய இறந்தகாலம்
  rationale: மத்தேயுவின் உயிரோட்டமான கதைநடையைப் பாதுகாக்கிறது; இறந்த நிகழ்வை நிகழ்காலத்தில் விவரிக்கும் கிரேக்க நடை தமிழிலும் புரிந்துகொள்ளத்தக்கது.
- issue: யோவானின் பட்டத்தைக் குறிப்பிடுதல்
  choice: ‘யோவான்’ மட்டும்
  alternative: ‘திருமுழுக்கு யோவான்’
  rationale: இந்த வசனத்தின் மூல உரையில் பட்டம் இல்லை; சூழலால் அடையாளம் தெளிவாக இருப்பதால் கூடுதல் சொல்லைச் சேர்க்கவில்லை.
- issue: இயேசு திருமுழுக்குப் பெறும் நோக்கம்
  choice: நோக்கத்தை ‘பெறுவதற்காக’ என வெளிப்படையாகக் காட்டுதல்
  alternative: ‘பெற’ என்ற சுருக்கமான வடிவம்
  rationale: τοῦ + infinitive இங்கு நோக்கத்தைச் சுட்டுவதால், அதைத் தமிழில் தெளிவாகக் காட்டுகிறது; நிகழ்வுக்கான மேலதிக இறையியல் விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடை. ‘திருமுழுக்கு’ என்பது βαπτίζω என்பதற்கான தெளிவான திருச்சபைச் சூழல் சொல்; சொற்றொடரின் தமிழியல்புக்காக நோக்கக் கூறு வினைக்கு முன் அமைக்கப்பட்டது.
