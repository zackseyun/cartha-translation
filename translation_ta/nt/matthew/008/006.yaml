id: MAT.8.6
reference: Matthew 8:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ λέγων· Κύριε, ὁ παῖς μου βέβληται ἐν τῇ οἰκίᾳ παραλυτικός, δεινῶς βασανιζόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/006.yaml
  text: and saying[a], “Lord, my servant is lying paralyzed at home[b], suffering terribly.”
translation:
  language: ta
  text: அவன், “ஆண்டவரே, என் பணியாள்[a] வீட்டில் முடக்குவாதத்தால் படுத்துக்கிடந்து, மிகுந்த வேதனைப்படுகிறான்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “என் சிறுவன்” அல்லது “என் பிள்ளை”; கிரேக்கச் சொல் பணியாளையோ பிள்ளையையோ குறிக்கலாம். இச்சூழலில் “பணியாள்” என்பதே மிகப் பொருத்தமானது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “கொடுமையாக வதைக்கப்படுகிறான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: என்றான்
  rationale: கிரேக்கத்தில் நிகழ்கால வினையெச்சத் தொடர் இருந்தாலும், தமிழில் இயல்பான உரையாடல் நடைக்கு இறந்தகால முற்றுவினை பொருத்தமானது; καί இங்கு முந்தைய வசனத்தோடு இணைகிறது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: மரியாதையான அழைப்பாகவும் உயர்ந்த பட்டமாகவும் இருக்கக்கூடிய இருபொருள் சாத்தியத்தையும் ‘ஆண்டவரே’ ஓரளவு காக்கிறது.
- source_word: ὁ παῖς μου
  choice: என் பணியாள்
  rationale: παῖς என்பது பணியாள், சிறுவன், அல்லது பிள்ளை எனப் பொருள்படலாம். நூற்றுக்குத் தலைவனின் சூழலில் ‘பணியாள்’ மிகப் பொருத்தமானது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: βέβληται ἐν τῇ οἰκίᾳ
  choice: வீட்டில் ... படுத்துக்கிடந்து
  rationale: βέβληται என்பதன் நிறைவுற்ற செயலின் விளைவுநிலையை, தமிழில் நோயால் படுத்திருக்கும் நிலையாக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: παραλυτικός
  choice: முடக்குவாதத்தால்
  rationale: உடல் இயக்கத்தை முடக்கும் நோய்நிலையை நவீனத் தமிழில் புரியுமாறு தெரிவிக்கிறது; ஒருவரை நோயின் பெயரால் அடையாளப்படுத்துவதையும் தவிர்க்கிறது.
- source_word: δεινῶς βασανιζόμενος
  choice: மிகுந்த வேதனைப்படுகிறான்
  rationale: கடுமையான துன்பம் அல்லது வேதனையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; ‘கொடுமையாக வதைக்கப்படுகிறான்’ என்ற வலுவான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: இயேசுவை நோக்கிக் கூறப்படும் Κύριε என்பதன் வலிமை
  choice: ஆண்டவரே
  alternative: ஐயா
  rationale: இது மரியாதை அழைப்பா அல்லது ஆழ்ந்த அங்கீகாரத்தைக் கொண்ட பட்டமா என்பதை உரை வெளிப்படையாகத் தீர்மானிக்கவில்லை. ‘ஆண்டவரே’ அந்த இறையியல் திறந்தநிலையை ‘ஐயா’ என்பதைக் காட்டிலும் நன்றாகக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. கிரேக்கத்தின் சொற்பொருள் தெளிவின்மைகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
