    reason: lexical_alternative
lexical_decisions:
- source_word: Καταβάντος δὲ αὐτοῦ
  choice: அவர் … இறங்கி வந்தபோது
  rationale: இறந்தகாலப் பங்கேற்பு வினையைக் கொண்ட தனிநிலை வேற்றுமைத் தொடர், நிகழ்வுகளின் வரிசையை இயல்பாகக் காட்டும் காலத் துணைவாக்கியமாக மொழிபெயர்க்கப்பட்டுள்ளது. δέ மென்மையான இணைப்புச் சொல் என்பதால் தனியே வலியுறுத்தப்படவில்லை.
- source_word: ἀπὸ τοῦ ὄρους
  choice: மலையிலிருந்து
  rationale: ὄρος என்பதன் ‘மலை’ என்ற பொருள் முந்தைய உரைப்பகுதியின் இடத்தையும் இயல்பாகத் தொடர்கிறது; ἀπόவின் விலகல் பொருள் ‘-இலிருந்து’ மூலம் வெளிப்படுகிறது.
- source_word: ἠκολούθησαν αὐτῷ
  choice: அவரைப் பின்தொடர்ந்தன
  rationale: ἀκολουθέω இங்கு உடலளவில் பின்னால் செல்வதைக் குறிக்கும் வழக்கமான கதைநடை வினை. கிரேக்கத்தில் தத்திவுடன் வரும் αὐτῷ, தமிழில் இயல்பாக இரண்டாம் வேற்றுமை உருபுடன் தரப்பட்டுள்ளது.
- source_word: ὄχλοι πολλοί
  choice: ஏராளமான மக்கள் கூட்டங்கள்
  rationale: ὄχλοι என்ற பன்மையையும் πολλοί குறிக்கும் மிகுதியையும் காக்கும் அதே நேரத்தில், சாதாரண நவீனத் தமிழில் புரியும்படி அமைக்கப்பட்டுள்ளது.
