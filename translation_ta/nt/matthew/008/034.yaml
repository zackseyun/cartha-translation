source:
  edition: SBLGNT
  text: καὶ ἰδοὺ πᾶσα ἡ πόλις ἐξῆλθεν εἰς ⸀ὑπάντησιν τῷ Ἰησοῦ, καὶ ἰδόντες αὐτὸν παρεκάλεσαν ὅπως μεταβῇ ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/034.yaml
  text: And behold[a], the whole city went out to meet Jesus, and when they saw him, they begged him to depart from their region.
translation:
  language: ta
  text: இதோ, நகரத்தார் அனைவரும் இயேசுவைச் சந்திக்க வெளியே வந்தார்கள். அவரைக் கண்டதும், தங்கள் பகுதியைவிட்டு அவர் போய்விட வேண்டும் என்று அவரை மன்றாடினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தங்கள் பகுதியைவிட்டு” என்பது “தங்கள் பிரதேசத்திலிருந்து” என்றும், இன்னும் சொற்பட “தங்கள் எல்லைகளிலிருந்து” என்றும் மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து நிகழ்வை உயிரோட்டமாக முன்வைக்கும் கிரேக்க உரையாடல் குறியீட்டின் வலிமையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: πᾶσα ἡ πόλις
  choice: நகரத்தார் அனைவரும்
  rationale: முழு நகர மக்களையும் ஒரு சமூகமாகக் குறிக்கும் கிரேக்க மரபுத்தொடரை, நகரமே இடம்பெயர்ந்தது என்ற தவறான எண்ணமின்றி இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἐξῆλθεν
  choice: வெளியே வந்தார்கள்
  rationale: நகரிலிருந்து இயேசுவை நோக்கி அவர்கள் வெளியே வந்த இயக்கத்தைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: εἰς ὑπάντησιν τῷ Ἰησοῦ
  choice: இயேசுவைச் சந்திக்க
  rationale: ஒருவரை எதிர்கொண்டு சந்திப்பதற்காக வெளியே செல்லுதல் என்ற கிரேக்க மரபுத்தொடரின் நோக்கத்தைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: ἰδόντες αὐτὸν
  choice: அவரைக் கண்டதும்
  rationale: முற்றுவினைக்கு முன் நிகழ்ந்த செயலைக் குறிக்கும் இறந்தகாலப் பெயரெச்சத்தின் காலத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: παρεκάλεσαν
  choice: மன்றாடினார்கள்
  rationale: வெறும் வேண்டுகோளைவிட வலியுறுத்திய வேண்டுதலைக் குறிக்கும் வினையின் வலிமையைக் கண்ணியமான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: ὅπως μεταβῇ
  choice: அவர் போய்விட வேண்டும் என்று
  rationale: அவர்களுடைய வேண்டுகோளின் உள்ளடக்கத்தை இயல்பான மறைமுகக் கூற்றாகத் தருகிறது; அங்கிருந்து விலகிச் செல்லும் கருத்தையும் தெளிவாக்குகிறது.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: தங்கள் பகுதியைவிட்டு
  rationale: ὅρια என்பதன் சொற்பொருள் எல்லைகள் என்றாலும், இங்கு அது அவற்றால் வரையறுக்கப்பட்ட நிலப்பகுதியைக் குறிக்கிறது; ‘பகுதி’ சூழலுக்கு இயல்பானது.
theological_decisions:
- issue: நகரத்தார் இயேசுவைப் போகும்படி வேண்டியதற்கான காரணம்
  choice: அவர்களுடைய நோக்கத்திற்கான காரணத்தை மொழிபெயர்ப்பு கூறாமல் விடுகிறது.
  alternative: இயேசுவின் வல்லமையைக் கண்டு பயந்தனர்; பன்றிகள் அழிந்ததால் கோபமடைந்தனர்; நிகழ்வினால் பொதுவாகக் கலக்கமடைந்தனர்.
  rationale: கிரேக்க மூலவசனம் அவர்களுடைய வேண்டுகோளை மட்டும் பதிவு செய்கிறது; அதன் காரணத்தை வெளிப்படையாகக் கூறவில்லை. ஆகவே எந்த விளக்கமும் உரைக்குள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை. ‘இதோ’ மூலத்தின் கவனஈர்ப்பு வலிமையைத் தக்கவைக்கிறது; ‘மன்றாடினார்கள்’ வேண்டுகோளின் தீவிரத்தை வெளிப்படுத்துகிறது.
