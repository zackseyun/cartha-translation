reference: Matthew 8:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἐμβάντι αὐτῷ ⸀εἰς πλοῖον ἠκολούθησαν αὐτῷ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/023.yaml
  text: And when he got into the boat[b][a], his disciples followed him.
translation:
  language: ta
  text: அவர் படகில் ஏறியபோது[a], அவருடைய சீடர்கள் அவரைப் பின்தொடர்ந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர் படகில் ஏறிய பின்பு.’
    reason: கிரேக்கப் பங்கேற்பு வினைச்சொல், படகில் ஏறிய செயல் முதன்மைச் செயலுக்கு முன்னதாக நிகழ்ந்தது என்பதை வலியுறுத்துவதாகவும் மொழிபெயர்க்கப்படலாம்.
lexical_decisions:
- source_word: ἐμβάντι
  choice: ஏறியபோது
  rationale: இறந்தகாலப் பங்கேற்பு வினைச்சொல், முதன்மை வினைக்கு முன்னதாகவோ அதனுடன் தொடர்புடைய நேரத்திலோ நிகழ்ந்த செயலைக் குறிக்கிறது. தமிழில் ‘ஏறியபோது’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது; ‘உள்ளே நுழைந்தபோது’ என்பதைக் காட்டிலும் படகில் செல்வதற்கு ‘ஏறு’ பொருத்தமானது.
- source_word: πλοῖον
  choice: படகில்
  rationale: கலிலேயக் கடல் சூழலில் πλοῖον என்பதற்கு நவீன தமிழில் ‘படகு’ இயல்பானது. கிரேக்கத்தில் பெயர்ச்சொல்லுக்கு முன் சுட்டிடைச்சொல் இல்லை; தமிழிலும் ‘படகில்’ என்பது அது குறிப்பிட்ட படகா அல்லது ஒரு படகா என்பதைத் தேவையின்றி நிர்ணயிக்காமல் மூலத்தின் இயல்பான தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: ἠκολούθησαν
  choice: பின்தொடர்ந்தார்கள்
  rationale: இங்கு சீடர்கள் இயேசுவுக்குப் பின்னால் படகில் சென்ற உடனடி நிகழ்வையும், மத்தேயுவில் காணப்படும் சீடத்துவச் சாயலையும் ‘பின்தொடர்ந்தார்கள்’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: μαθηταὶ
  choice: சீடர்கள்
  rationale: இயேசுவின் μαθηταί என்பவர்களைக் குறிக்கும் நிலைபெற்ற, பொதுவாகப் புரிந்துகொள்ளப்படும் நற்செய்தி நூல் சொல் ‘சீடர்கள்’ ஆகும்.
- source_word: αὐτῷ ... αὐτῷ ... αὐτοῦ
  choice: அவர் / அவரை / அவருடைய
  rationale: சூழலில் இம்மூன்று பதிலிடுபெயர்களும் இயேசுவையே குறிக்கின்றன. மரியாதையும் இயல்பான தமிழ் நடையும் காக்க ‘அவர்’, ‘அவரை’, ‘அவருடைய’ பயன்படுத்தப்பட்டுள்ளன.
theological_decisions:
- issue: ἀκολουθέω என்பதில் இருக்கக்கூடிய சீடத்துவச் சாயல்
  choice: பின்தொடர்ந்தார்கள்
  alternative: அவருடன் சென்றார்கள்
  rationale: இவ்வசனம் உடல்ரீதியான நகர்வை விவரித்தாலும், மத்தேயுவில் ἀκολουθέω சீடத்துவத்தையும் எதிரொலிக்கக்கூடும். ‘பின்தொடர்ந்தார்கள்’ இரு பரிமாணங்களையும் மிகைப்படுத்தாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. தமிழில் சுட்டிடைச்சொற்கள் இல்லாததால் πλοῖον என்பதிலுள்ள குறிப்பிட்ட/குறிப்பிடாத தன்மையை ‘படகில்’ இயல்பாகத் திறந்தவாறே வைக்கிறது.
