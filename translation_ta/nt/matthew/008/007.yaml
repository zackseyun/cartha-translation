id: MAT.8.7
reference: Matthew 8:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀καὶ λέγει ⸀αὐτῷ· Ἐγὼ ἐλθὼν θεραπεύσω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/007.yaml
  text: And he says to him[a], “I will come and heal him.”
translation:
  language: ta
  text: அவர் அவனிடம்[a], “நான் வந்து அவனைக் குணமாக்குவேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் வந்து அவனைக் குணமாக்க வேண்டுமா?” சூழலைக் கருத்தில் கொண்டு சிலர் இயேசுவின் சொற்களைக் கேள்வியாகப் புரிந்துகொள்கிறார்கள்; ஆனால் கிரேக்கச் சொற்றொடர் இயல்பாக ஓர் அறிவிப்பாகவே வாசிக்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: அவர்
  rationale: தமிழ் உரைநடையில் முந்தைய நிகழ்வுடன் இயல்பாகத் தொடர்பு தொடர்வதால், தனியாக ‘மேலும்’ அல்லது ‘அப்போது’ சேர்க்காமல் விடுவது செயற்கையான இணைப்பையும் கிரேக்கத்தில் இல்லாத கால அல்லது விளைவு நுணுக்கத்தையும் தவிர்க்கிறது.
- source_word: λέγει
  choice: என்றார்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தைத் தமிழ் கதைநடையின் இயல்பான இறந்தகால வினையாக அளிக்கிறது; ‘சொல்கிறார்’ என்பது இச்சூழலில் தேவையற்ற நடைக்கலப்பாகத் தோன்றலாம்.
- source_word: αὐτῷ
  choice: அவனிடம்
  rationale: λέγει என்பதுடன் வரும் மறைமுகச் செயப்படுபொருளை இயல்பான தமிழில் குறிக்கிறது; சூழலில் இது நூற்றுக்குத் தலைவனைக் குறிக்கிறது.
- source_word: Ἐγὼ
  choice: நான்
  rationale: வெளிப்படையாக உள்ள கிரேக்கப் பிரதிப்பெயரைத் தக்கவைத்து, இயல்பான அளவில் வலியுறுத்தலைக் காட்டுகிறது.
- source_word: ἐλθὼν
  choice: வந்து
  rationale: முதன்மை வினைக்கு முன் நிகழும் அல்லது அதனுடன் இணைந்த செயலைத் தமிழ் வினையெச்சம் இயல்பாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: θεραπεύσω
  choice: குணமாக்குவேன்
  rationale: நோயுற்ற பணியாளனை நலம்பெறச் செய்வதைக் குறிக்கும் θεραπεύω என்பதற்கு நவீனத் தமிழில் தெளிவான, இயல்பான சொல்.
- source_word: αὐτόν
  choice: அவனை
  rationale: நோயுற்ற பணியாளனைக் குறிக்கும் ஆண்பால் ஒருமை நேர்ச் செயப்படுபொருளைத் தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: இயேசுவின் கூற்றை அறிவிப்பாகவா கேள்வியாகவா மொழிபெயர்ப்பது
  choice: 'அறிவிப்பு: “நான் வந்து அவனைக் குணமாக்குவேன்.”'
  alternative: 'கேள்வி: “நான் வந்து அவனைக் குணமாக்க வேண்டுமா?”'
  rationale: கிரேக்கத்தில் கேள்வியைக் குறிக்கும் துகள் இல்லை; சொற்றொடரின் இயல்பான இலக்கண வாசிப்பு அறிவிப்பாகும். சூழலை அடிப்படையாகக் கொண்டு கேள்வியாகப் புரிந்துகொள்ளும் வாய்ப்பு இருப்பதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘குணமாக்குவேன்’ என்பது மருத்துவச் சூழலைத் தெளிவாகக் காட்டுகிறது; [a] குறிப்பு உண்மையான வாசிப்பு வாய்ப்பைத் தக்கவைக்கிறது.
