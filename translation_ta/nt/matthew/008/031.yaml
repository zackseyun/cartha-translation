id: MAT.8.31
reference: Matthew 8:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἱ δὲ δαίμονες παρεκάλουν αὐτὸν λέγοντες· Εἰ ἐκβάλλεις ἡμᾶς, ⸂ἀπόστειλον ἡμᾶς⸃ εἰς τὴν ἀγέλην τῶν χοίρων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/031.yaml
  text: And the demons kept begging him[a], saying, “If you cast us out[b], send us into the herd of pigs.”
translation:
  language: ta
  text: 'அப்போது தீய ஆவிகள் அவரிடம் தொடர்ந்து கெஞ்சிக் கூறின[a]: “நீர் எங்களைத் துரத்திவிடுவீரானால், எங்களைப் பன்றிக் கூட்டத்துக்குள் அனுப்பிவிடும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரிடம் கெஞ்சின.” கிரேக்க வினைச்சொல் தொடர்ந்து அல்லது மீண்டும் மீண்டும் நடந்த செயலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ δαίμονες
  choice: அப்பொழுது பேய்கள்
  rationale: δέ கதையின் தொடர்ச்சியை இங்கு இயல்பாகக் குறிக்கிறது; δαίμονες என்பதற்கு தனிப்பட்ட தீய ஆவிகளைக் குறிக்கும், பொதுவாகப் புரியும் ‘பேய்கள்’ பயன்படுத்தப்பட்டது.
- source_word: παρεκάλουν
  choice: தொடர்ந்து கெஞ்சிக் கேட்டன
  rationale: இறந்தகாலத் தொடர்வினை வடிவம் மீண்டும் மீண்டும் அல்லது தொடர்ந்து வேண்டிய செயலைக் காட்டுகிறது; இந்தத் தொடர்ச்சியைத் தமிழில் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: λέγοντες
  choice: என்றன
  rationale: நேர்கூற்றை அறிமுகப்படுத்தும் பங்கேற்புவினை தமிழில் வாக்கிய முடிவிலுள்ள ‘என்றன’ மூலம் இயல்பாகத் தரப்பட்டது.
- source_word: Εἰ ἐκβάλλεις ἡμᾶς
  choice: நீர் எங்களைத் துரத்திவிடுவீரானால்
  rationale: Εἰ என்பதன் நிபந்தனைத் தன்மையைப் பாதுகாக்கிறது; ἐκβάλλω இச்சூழலில் வலுக்கட்டாயமாக வெளியேற்றுவதைக் குறிக்கும். மரியாதை ஒருமை ‘நீர்’ இயேசுவை நோக்கிய நேர்கூற்றுக்கு ஏற்றது.
- source_word: ἀπόστειλον ἡμᾶς
  choice: எங்களை ... அனுப்பிவிடும்
  rationale: கட்டளை வடிவிலுள்ள உடனடியான வேண்டுகோளை இயல்பான தமிழ் மரியாதை ஏவலில் தருகிறது.
- source_word: εἰς τὴν ἀγέλην τῶν χοίρων
  choice: பன்றிக் கூட்டத்திற்குள்
  rationale: εἰς என்பதன் உள்ளே செல்லும் திசையையும், ἀγέλη என்பதன் விலங்குக் கூட்டப் பொருளையும் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
theological_decisions:
- issue: தீய ஆவிகளுக்கான பெயர்ப்பு
  choice: பேய்கள்
  alternative: தீய ஆவிகள்
  rationale: வசனம் பேசிச் செயல்படும் இயற்கைக்கு அப்பாற்பட்ட தீய உயிர்களை முன்வைக்கிறது. ‘பேய்கள்’ என்பது நவீனத் தமிழில் நேரடியும் பொதுவாகப் புரியக்கூடியதும் ஆகும்; கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: நிபந்தனைச் சொல்லின் பொருள்
  choice: நீர் ... துரத்திவிடுவீரானால்
  alternative: நீர் ... துரத்திவிடுவதால் / துரத்திவிடப்போகிறீர் என்பதால்
  rationale: Εἰ என்பதிலுள்ள உண்மையான நிபந்தனை வடிவத்தை அப்படியே வைத்திருக்கிறது; அதை ‘என்பதால்’ என்று உறுதிப்படுத்தி இறையியல் பதற்றத்தைத் தீர்த்துவிடவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் இணைந்த நடையில் மொழிபெயர்க்கப்பட்டது. ‘தொடர்ந்து’ என்பது கிரேக்க இறந்தகாலத் தொடர்வினையின் நீடித்த தன்மையை வெளிப்படுத்துகிறது; ‘பன்றிக் கூட்டத்திற்குள்’ என்பது εἰς என்பதன் திசைப் பொருளைப் பாதுகாக்கிறது.
