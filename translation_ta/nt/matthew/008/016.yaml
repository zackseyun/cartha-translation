id: MAT.8.16
reference: Matthew 8:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὀψίας δὲ γενομένης προσήνεγκαν αὐτῷ δαιμονιζομένους πολλούς· καὶ ἐξέβαλεν τὰ πνεύματα λόγῳ, καὶ πάντας τοὺς κακῶς ἔχοντας ἐθεράπευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/016.yaml
  text: When evening came[a], they brought to him many who were demon-possessed; and he cast out the spirits with a word, and healed all who were sick.
translation:
  language: ta
  text: மாலையானபோது, பேய் பிடித்திருந்த பலரை அவரிடம் கொண்டுவந்தார்கள்[a]. அவர் ஒரு வார்த்தையினால் ஆவிகளைத் துரத்தி, நோயுற்றிருந்த அனைவரையும் குணமாக்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பேய்களால் துன்புறுத்தப்பட்டிருந்த பலரை.” கிரேக்கச் சொல், பேய்களின் தாக்கத்துக்கோ ஆளுகைக்கோ உட்பட்டவர்களைக் குறிக்கிறது; “பேய் பிடித்திருந்த” என்பது வழக்கமான சுருக்கமான மொழிபெயர்ப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: மாலையானபோது
  rationale: காலத்தைக் குறிக்கும் இந்தப் பிறவினை முழுமையை, இயல்பான நவீனத் தமிழில் சுருக்கமாகவும் துல்லியமாகவும் தருகிறது.
- source_word: προσήνεγκαν αὐτῷ
  choice: அவரிடம் கொண்டுவந்தார்கள்
  rationale: இங்கு மனிதர்களை இயேசுவிடம் அழைத்துவருவதைக் குறிக்கிறது; தமிழில் இயல்பாகவும் மூலத்தின் பொருளுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: δαιμονιζομένους πολλούς
  choice: பேய் பிடித்திருந்த பலரை
  rationale: பிசாசுகளின் தாக்கத்துக்கோ ஆளுகைக்கோ உட்பட்டவர்களைக் குறிக்கும் கிரேக்கப் பங்கேற்புவினைக்கு இது வழக்கமான, சுருக்கமான தமிழாக்கம். ஆளுகையின் சரியான இயல்பைச் சொல் தனியே வரையறுக்காததால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐξέβαλεν τὰ πνεύματα
  choice: ஆவிகளைத் துரத்தி
  rationale: ἐκβάλλω என்பதன் வலிமையான வெளியேற்றும் பொருளைத் ‘துரத்தி’ இயல்பாக வெளிப்படுத்துகிறது; மூலத்தில் உள்ள ‘ஆவிகள்’ என்பதையும் கூடுதல் விளக்கமின்றித் தக்கவைக்கிறது.
- source_word: λόγῳ
  choice: ஒரு வார்த்தையினால்
  rationale: கருவிப்பொருள் வேற்றுமையை வெளிப்படுத்தி, அவர் கூறிய ஒரு வார்த்தை மூலமாகவே ஆவிகள் வெளியேற்றப்பட்டதைத் தெரிவிக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘தமது’ என்பது சேர்க்கப்படவில்லை.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: நோயுற்றிருந்த அனைவரையும்
  rationale: κακῶς ἔχειν என்ற மரபுத்தொடர் இச்சூழலில் உடல்நலமின்றி இருப்பதைக் குறிக்கிறது; ‘நோயுற்றிருந்த’ என்பது தெளிவான, இயல்பான தமிழ்.
- source_word: ἐθεράπευσεν
  choice: குணமாக்கினார்
  rationale: நற்செய்தி நூல்களின் சுகமாக்கும் நிகழ்வுகளில் θεραπεύω என்பதன் செயப்படுபொருள் கொண்ட பொருளைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: δαιμονιζομένους மற்றும் τὰ πνεύματα குறிக்கும் நிலை
  choice: ‘பேய் பிடித்திருந்த’ என்றும் ‘ஆவிகள்’ என்றும் மொழிபெயர்த்து, உரை காட்டும் பேய்சார்ந்த துன்பத்தைத் தக்கவைத்தல்
  alternative: ‘பேய்களால் துன்புறுத்தப்பட்டிருந்த’ அல்லது மனநோயுற்றிருந்தவர்கள் என்று விளக்குதல்
  rationale: இந்த வசனம் ஆவிகளை வெளியேற்றுவதையும் நோயுற்றவர்களைக் குணமாக்குவதையும் தனித்தனி செயல்களாகக் குறிப்பிடுகிறது. ஆகவே அதன் சொந்த வகைப்பாட்டை உளவியல் விளக்கமாக மாற்றாமல் பாதுகாக்கப்படுகிறது; அதேவேளை δαιμονίζομαι குறிக்கும் ஆளுகையின் அளவு தீர்மானிக்கப்படாமல் அடிக்குறிப்பில் மாற்று தரப்படுகிறது.
- issue: λόγῳ என்பதன் கருவிப்பொருள்
  choice: ‘ஒரு வார்த்தையினால்’
  alternative: ‘தமது வார்த்தையினால்’ அல்லது ‘பேசி’
  rationale: இயேசுவின் கட்டளைக்குரிய அதிகாரத்தை விரிவாக்கமின்றி வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத உரிமைப்பெயர் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பேய் பிடித்திருந்த’ என்பது வழக்குப் பயன்பாட்டில் தெளிவானது; அதன் பொருள் அளவுக்கு மீறி நிர்ணயிக்கப்படாதவாறு மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது. மூலத்தின் இரண்டு இணைச் செயல்களைத் தெளிவாக்க இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது.
