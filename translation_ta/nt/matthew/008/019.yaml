id: MAT.8.19
reference: Matthew 8:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ προσελθὼν εἷς γραμματεὺς εἶπεν αὐτῷ· Διδάσκαλε, ἀκολουθήσω σοι ὅπου ἐὰν ἀπέρχῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/019.yaml
  text: And one scribe came up and said to him[a], “Teacher, I will follow you wherever you go.”
translation:
  language: ta
  text: ஒரு மறைநூல் அறிஞர் அவரிடம் வந்து, “ஆசிரியரே, நீங்கள் எங்கே சென்றாலும்[a] நான் உங்களைப் பின்பற்றுவேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நீங்கள் எங்கே புறப்பட்டுச் சென்றாலும்” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்க வினைச்சொல் விலகிச் செல்வதையோ புறப்படுவதையோ குறிப்பாகக் குறிக்கக்கூடும்; இச்சூழலில் அது இயல்பாக “செல்வது” என்ற பொருளில் வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: அவரிடம் வந்து
  rationale: இயேசுவை நோக்கி அணுகிவந்து பின்னர் பேசிய செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἷς
  choice: ஒரு
  rationale: குறிப்பிட்ட ஓர் ஆளை அறிமுகப்படுத்தும் கிரேக்க எண்ணுப்பெயரின் இயல்பான தமிழ் வடிவம்.
- source_word: γραμματεὺς
  choice: மறைநூல் அறிஞர்
  rationale: வேத எழுத்துகளையும் சமயச் சட்டத்தையும் ஆராய்ந்து கற்பித்தவரைக் குறிக்கும் வரலாற்றுப் பணியை நவீன வாசகர்களுக்குப் புரியும்படி சொல்கிறது; வெறும் நகலெழுதுபவர் என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: Διδάσκαλε
  choice: போதகரே
  rationale: நேரடி அழைப்பின் மரியாதையையும் கற்பிப்பவர் என்ற அடிப்படைப் பொருளையும் இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: ἀκολουθήσω
  choice: நான் உங்களைப் பின்பற்றுவேன்
  rationale: எதிர்கால நோக்கத்தை நேரடியாகத் தெரிவிப்பதோடு, உடன் செல்வது மற்றும் சீடராகப் பின்பற்றுவது ஆகிய இரு நிழற்பொருள்களையும் தக்கவைக்கிறது.
- source_word: ὅπου ἐὰν
  choice: எங்கே … ஆனாலும்
  rationale: எந்த இடத்தையும் வரையறுக்காத கிரேக்கத் தொடரின் விரிந்த பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀπέρχῃ
  choice: சென்றாலும்
  rationale: இச்சூழலில் பொதுவாக இடம்பெயர்ந்து செல்வதைக் குறிக்கும் இயல்பான தமிழ்; விலகிச் செல்வது அல்லது புறப்படுவது என்ற குறிப்பான பொருளும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: இயேசுவை διδάσκαλος என்று அழைத்தல்
  choice: போதகரே
  alternative: ஆசிரியரே; குருவே
  rationale: கற்பிப்பவர் என்ற சொல்லின் நேரடிப் பொருளைத் தருகிறது; மூலத்தில் வெளிப்படையாக இல்லாத உயர்த்தப்பட்ட கிறிஸ்தியல் பொருளையோ தனிப்பட்ட சமயப் பட்டத்தையோ சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும் அதேவேளையில் கண்ணியமான வேதாகம நடையைக் கடைப்பிடிக்கிறது. மறைநூல் அறிஞர் என்ற சொல் வரலாற்றுப் பணியைத் தெளிவுபடுத்துகிறது. அடிக்குறிப்பு குறி சம்பந்தப்பட்ட வாக்கியத்தின் முடிவில் வைக்கப்பட்டுள்ளது.
