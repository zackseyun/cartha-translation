language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Αὐτὸς τὰς ἀσθενείας ἡμῶν ἔλαβεν καὶ τὰς νόσους ἐβάστασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/017.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[b][a], saying: “He himself took our sicknesses and carried our diseases.”'
translation:
  language: ta
  text: 'இறைவாக்கினர் ஏசாயா வாயிலாகச் சொல்லப்பட்டது நிறைவேறும்படியாக இது நடந்தது:


    “அவரே நம்முடைய உடல்நலக் குறைவுகளை[a] எடுத்தார்;

    நம்முடைய நோய்களைச் சுமந்தார்[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பலவீனங்கள்’ அல்லது ‘நலிவுகள்’ என்றும் மொழிபெயர்க்கலாம். ἀσθενείας என்ற கிரேக்கச் சொல் பலவீனம், உடல்நலக் குறைவு, அல்லது நோயுற்ற நிலை ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘தாங்கினார்’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள சொல் சுமந்து தாங்குவதைக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως πληρωθῇ
  choice: நிறைவேறும்படியாக
  rationale: நோக்கம் அல்லது விளைவைக் குறிக்கும் ὅπως உடன் வரும் நிறைவேற்றச் சூத்திரத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου
  choice: இறைவாக்கினரான ஏசாயா மூலம் சொல்லப்பட்டது
  rationale: διά உடன் வரும் இடைமுகச் செயற்பாட்டை ‘மூலம்’ எனக் காத்து, ஏசாயா வழியாக உரைக்கப்பட்டது என்ற பொருளைத் தருகிறது.
- source_word: Αὐτὸς
  choice: அவரே
  rationale: கிரேக்கச் சுட்டுப்பெயரின் வலியுறுத்தலை இயல்பான தமிழ் ஏகாரத்தால் வெளிப்படுத்துகிறது.
- source_word: ἀσθενείας
  choice: நலிவுகளை
  rationale: பலவீனம், உடல்நலக் குறைவு, நோயுற்ற நிலை ஆகியவற்றை உள்ளடக்கக்கூடிய சொல்லின் பரப்பைச் சுருக்காமல், இங்குள்ள குணமாக்கும் சூழலுக்கும் பொருந்துகிறது.
- source_word: ἔλαβεν
  choice: எடுத்துக்கொண்டு
  rationale: λαμβάνω என்பதன் அடிப்படைப் பொருளைத் தருகிறது; ‘நீக்கினார்’ என்ற விளக்கத்தைத் தேவையின்றி சேர்க்கவில்லை.
- source_word: νόσους
  choice: நோய்களை
  rationale: உடல் நோயைக் குறிப்பாகக் குறிக்கும் νόσος என்பதற்கான தெளிவான, இயல்பான தமிழ் இணை.
- source_word: ἐβάστασεν
  choice: சுமந்தார்
  rationale: βαστάζω என்பதிலுள்ள சுமந்து தாங்குதல் என்ற பொருளையும் ஏசாயா 53:4 உடனான மொழித்தொடர்பையும் காக்கிறது.
theological_decisions:
- issue: மத்தேயுவின் குணமாக்கும் சூழலில் ஏசாயா 53:4 மேற்கோளை மொழிபெயர்த்தல்
  choice: ‘நலிவுகள்’ மற்றும் ‘நோய்கள்’ என்று உடல் துன்பத்தின் சூழலைத் தெளிவாகக் காட்டுதல்
  alternative: ‘பலவீனங்கள்’ அல்லது பரிகாரப் பலியை அதிகமாக முன்வைப்பதாகத் தோன்றக்கூடிய சொற்களைப் பயன்படுத்துதல்
  rationale: உடனடியான சூழல் இயேசுவின் குணமாக்கும் பணியைப் பற்றியது. அதையே வெளிப்படுத்தியபோதும், ‘நலிவுகள்’ மற்றும் ‘சுமந்தார்’ என்பவை மூலத்தின் விரிந்த பொருளையும் ஏசாயா மேற்கோளின் இறையியல் எதிரொலியையும் முன்கூட்டியே குறுக்காமல் காக்கின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம மேற்கோளுக்குரிய செறிவும் காக்கப்பட்டுள்ளன. ‘இறைவாக்கினர்’ என்பது ordinary readers புரிந்துகொள்ளக்கூடிய உயர்நடைச் சொல்; மேற்கோள் கவிதை வரிகளாக அமைக்கப்பட்டுள்ளது.
