source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ πέραν εἰς τὴν χώραν τῶν ⸀Γαδαρηνῶν ὑπήντησαν αὐτῷ δύο δαιμονιζόμενοι ἐκ τῶν μνημείων ἐξερχόμενοι, χαλεποὶ λίαν ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν διὰ τῆς ὁδοῦ ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/028.yaml
  text: And when he came to the other side[a], into the region of the Gadarenes, two demon-possessed men met him, coming out of the tombs[c][b], so extremely fierce that no one was able to pass along that road.
translation:
  language: ta
  text: அவர் அக்கரையில் உள்ள கதரேனரின் பகுதிக்கு வந்தபோது, கல்லறைகளிலிருந்து வெளியே வந்த பேய்பிடித்த மனிதர்கள் இருவர் அவரை எதிர்கொண்டார்கள். அந்த வழியாக யாரும் செல்ல முடியாத அளவுக்கு அவர்கள் மிகவும் கொடியவர்களாக இருந்தார்கள்.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் “கதரேனர்” என்பதற்குப் பதிலாக “கெர்கெசேனர்” அல்லது “கெரசேனர்” என்று உள்ளது.
    reason: textual_variant
  - marker: b
    text: அல்லது, “மிகவும் மூர்க்கமானவர்களாக.”
    reason: lexical_alternative
  - marker: c
    text: “அந்த வழியாகச் செல்ல” என்பதை “அந்தச் சாலையில் செல்ல” என்றும் மொழிபெயர்க்கலாம்.
    reason: previous_rendering
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: அவர் … வந்து … அடைந்தபோது
  rationale: வினைச்சார்புப் பெயரெச்சத் தொடரைத் தமிழில் இயல்பான காலத் துணைவாக்கியமாக அளிக்கிறது.
- source_word: τὸ πέραν
  choice: அக்கரை
  rationale: சூழலில் நீர்நிலையின் மறுபக்கத்தைக் குறிக்கும் இயல்பான, சுருக்கமான தமிழ் சொல்.
- source_word: χώραν τῶν Γαδαρηνῶν
  choice: கதரேனர் பகுதி
  rationale: χώρα என்பதன் நிலப்பரப்பு அல்லது பிரதேசப் பொருளை ‘பகுதி’ தெளிவாகத் தருகிறது; SBLGNT வாசகத்தின்படி இனப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: δύο δαιμονιζόμενοι
  choice: பேய்பிடித்த மனிதர்கள் இருவர்
  rationale: தீய ஆவிகளின் ஆளுகைக்குட்பட்ட நிலையை நவீன வாசகர்களுக்கு உடனடியாகப் புரியும் வழக்கமான தமிழில் தெரிவிக்கிறது; ஆண்பால் குறிப்பு சூழலுக்கேற்ப வெளிப்படுத்தப்படுகிறது.
- source_word: ἐκ τῶν μνημείων ἐξερχόμενοι
  choice: கல்லறைகளிலிருந்து வெளியே வந்த
  rationale: அவர்கள் அடக்க இடங்களிலிருந்து வெளிவந்ததைக் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: χαλεποὶ λίαν
  choice: மிகவும் கொடியவர்களாக
  rationale: χαλεπός என்பதிலுள்ள கடுமை, அச்சுறுத்தல், ஆபத்து ஆகிய பரப்பை ‘கொடிய’ இயல்பாகத் தருகிறது; λίαν என்பதற்கு ‘மிகவும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν
  choice: யாரும் செல்ல முடியாத அளவுக்கு
  rationale: ὥστε குறிக்கும் விளைவைத் தமிழில் இயல்பான அளவு–விளைவு அமைப்பில் தருகிறது; ἰσχύειν இங்கு உடல் வலிமையை மட்டும் அல்ல, இயலாமையைக் குறிக்கிறது.
- source_word: διὰ τῆς ὁδοῦ ἐκείνης
  choice: அந்த வழியாக
  rationale: குறிப்பிட்ட பாதையைப் பயண வழியாகப் பயன்படுத்துவதைச் செம்மையான நவீன தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: தீய ஆவிகளால் பாதிக்கப்பட்ட நிலைக்கான சொற்பயன்பாடு
  choice: பேய்பிடித்த
  alternative: பேய்களின் ஆளுகைக்குட்பட்ட
  rationale: δαιμονιζόμενοι உண்மையான தீய ஆவிகளின் செயல்பாட்டைச் சுட்டுகிறது. ‘பேய்பிடித்த’ என்பது தமிழில் தெளிவான வழக்குச் சொல்; கிரேக்கச் சொல்லுக்கு அப்பாற்பட்ட தொழில்நுட்ப விளக்கத்தைச் சேர்க்கவில்லை.
- issue: இடப்பெயரின் கையெழுத்துப் பிரதிவேறுபாடு
  choice: கதரேனர்
  alternative: கெர்கெசேனர் அல்லது கெரசேனர்
  rationale: முதன்மை உரை SBLGNT-இன் Γαδαρηνῶν வாசகத்தைப் பின்பற்றுகிறது; பிற முக்கிய வாசகங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியம் தமிழில் இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; காரண–விளைவு தொடர்பும் மூலத்தின் தீவிரமும் பாதுகாக்கப்பட்டுள்ளன.
