id: MAT.8.26
reference: Matthew 8:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Τί δειλοί ἐστε, ὀλιγόπιστοι; τότε ἐγερθεὶς ἐπετίμησεν τοῖς ἀνέμοις καὶ τῇ θαλάσσῃ, καὶ ἐγένετο γαλήνη μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/026.yaml
  text: And he said to them, “Why are you fearful, you of little faith?” Then, having risen, he rebuked the winds and the sea, and there was a great calm.
translation:
  language: ta
  text: அவர் அவர்களிடம், “விசுவாசம் குறைந்தவர்களே, ஏன் அஞ்சுகிறீர்கள்?” என்று சொன்னார். அப்போது அவர் எழுந்து காற்றுகளையும் கடலையும் கடிந்தார்; பெரும் அமைதி உண்டாயிற்று.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δειλοί
  choice: அஞ்சுகிறீர்கள்
  rationale: இச்சூழலில் சீடர்களின் பயத்தையும் துணிவின்மையையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὀλιγόπιστοι
  choice: அற்ப விசுவாசிகளே
  rationale: ‘குறைந்த விசுவாசமுள்ளவர்களே’ என்ற பொருளைச் சுருக்கமாகவும் இயேசுவின் நேரடி விளிப்பைத் தக்கவைத்தும் வழங்குகிறது.
- source_word: ἐπετίμησεν
  choice: அதட்டினார்
  rationale: காற்றுகளுக்கும் கடலுக்கும் அதிகாரத்துடன் விடுக்கப்பட்ட கடிந்த கட்டளையை வெளிப்படுத்துகிறது.
- source_word: γαλήνη μεγάλη
  choice: மிகுந்த அமைதி
  rationale: அலைகள் அடங்கி ஏற்பட்ட பெரும் அமைதியை இயல்பாகக் குறிக்கிறது; μεγάλη என்பதன் வலிமையையும் காக்கிறது.
theological_decisions:
- issue: சீடர்களின் விசுவாசத்தை இயேசு மதிப்பிடும் விதம்
  choice: அற்ப விசுவாசிகளே
  alternative: விசுவாசம் குறைந்தவர்களே
  rationale: மூலத்தின் ὀλιγόπιστοι என்ற நேரடி விளிப்பையும் அதன் கண்டிக்கும் தொனியையும் தக்கவைக்கிறது; அவர்கள் முற்றிலும் விசுவாசமற்றவர்கள் என்று மிகைப்படுத்தவில்லை.
- issue: இயற்கையின் மீது இயேசுவின் அதிகாரம்
  choice: காற்றுகளையும் கடலையும் அதட்டினார்
  alternative: காற்றுகளுக்கும் கடலுக்கும் கட்டளையிட்டார்
  rationale: மூலத்தில் உள்ள ἐπιτιμάω வினையின் கடிந்துகொள்ளும் அல்லது அதட்டும் நுணுக்கத்தைத் தக்கவைத்து, அதன் இறையியல் பொருளை விளக்கமாகச் சேர்க்காமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; இயல்பானதாயும் கண்ணியமானதாயும் வாசிக்கும்படி அமைக்கப்பட்டது. மூலத்தின் கேள்வி, நேரடி விளிப்பு, செயற்பாட்டு வரிசை, மற்றும் ‘மிகுந்த அமைதி’ என்ற தீவிரம் பாதுகாக்கப்பட்டுள்ளன.
