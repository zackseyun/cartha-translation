revisions:
- from: அவர் அவர்களிடம், “அற்ப விசுவாசிகளே, ஏன் இவ்வளவு அஞ்சுகிறீர்கள்?” என்று கேட்டார். பின்பு அவர் எழுந்து காற்றுகளையும் கடலையும் அதட்டினார்; உடனே மிகுந்த அமைதி உண்டாயிற்று.
  to: அவர் அவர்களிடம், “விசுவாசம் குறைந்தவர்களே, ஏன் அஞ்சுகிறீர்கள்?” என்று சொன்னார். அப்போது அவர் எழுந்து காற்றுகளையும் கடலையும் கடிந்தார்; பெரும் அமைதி உண்டாயிற்று.
  rationale: The revision removes additions not present in the Greek, replaces a potentially pejorative rendering of the vocative with a clear equivalent for “you of little faith,” and uses a more direct modern Tamil rendering of the rebuke. It preserves the source’s question, direct address, temporal sequence, rebuke of both winds and sea, and resulting great calm.
