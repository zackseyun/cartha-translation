review_pass:
  verdict: revise
  source_fidelity: The draft retains the basic sequence and sense, but «இவ்வளவு» adds an unexpressed degree to the question, and «உடனே» adds immediacy not stated in this verse. The vocative «அற்ப விசுவாசிகளே» can suggest believers of little worth rather than persons with little faith.
  naturalness: «விசுவாசம் குறைந்தவர்களே» is clearer and more idiomatic modern standard Tamil in this direct address. «கடிந்தார்» naturally conveys ἐπετίμησεν without introducing an explicit command.
  terminology: '«விசுவாசம் குறைந்தவர்களே» preserves the qualified force of ὀλιγόπιστοι: they are not characterized as wholly lacking faith. «காற்றுகளையும் கடலையும் கடிந்தார்» retains the marked rebuking verb applied to the elements.'
  issues:
  - severity: medium
    issue: «அற்ப விசுவாசிகளே»
    rationale: In modern Tamil, «அற்ப» commonly connotes trivial, mean, or contemptible. It is therefore liable to misrepresent ὀλιγόπιστοι as a judgment of personal worth rather than limited faith.
  - severity: low
    issue: «இவ்வளவு» and «உடனே» add unstated nuances
    rationale: Neither “so much” nor “immediately” is expressed in the Greek text of this verse; both should be omitted for optimal equivalence.
  - severity: low
    issue: «அதட்டினார்» is less precise in this context
    rationale: It can mean scolded or snapped at, whereas «கடிந்தார்» more directly represents the rebuking sense of ἐπετίμησεν while retaining the unusual application to wind and sea.
  revised_text: அவர் அவர்களிடம், “விசுவாசம் குறைந்தவர்களே, ஏன் அஞ்சுகிறீர்கள்?” என்று சொன்னார். அப்போது அவர் எழுந்து காற்றுகளையும் கடலையும் கடிந்தார்; பெரும் அமைதி உண்டாயிற்று.
  revised_footnotes: []
