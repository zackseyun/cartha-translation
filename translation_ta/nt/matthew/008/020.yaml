reference: Matthew 8:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/020.yaml
  text: And Jesus says to him[a], “Foxes have dens, and the birds of the sky have nests[d][c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: ta
  text: இயேசு அவனிடம், “நரிகளுக்கு வளைகளும் வானத்துப் பறவைகளுக்குக் கூடுகளும் உள்ளன; ஆனால் மனிதகுமாரனுக்கு[a] தம் தலையைச் சாய்க்க இடமில்லை” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மனிதகுமாரன்” என்பது இயேசு தம்மைக் குறித்துப் பயன்படுத்தும் பட்டம்; இதை “மானிடர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: என்றார்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தைத் தமிழில் இயல்பான கதைநடை இறந்தகாலமாக வழங்குகிறது; நிகழ்வின் பொருள் மாறுவதில்லை.
- source_word: ἀλώπεκες
  choice: நரிகள்
  rationale: பன்மை பெயர்ச்சொல்லின் நேரான, இயல்பான தமிழ் இணை.
- source_word: φωλεοὺς
  choice: குகைகள்
  rationale: நரிகள் தங்கும் வளைகள் அல்லது பதுங்கிடங்களைக் குறிக்கும் இயல்பான பொதுமொழித் தேர்வு; ‘வளைகள்’ என்பதும் சாத்தியம்.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: வானத்துப் பறவைகள்
  rationale: மூலத்தின் ‘வானத்தின் பறவைகள்’ என்ற உருவகத்தைச் சுருக்கமான, இயல்பான தமிழில் காக்கிறது.
- source_word: κατασκηνώσεις
  choice: கூடுகள்
  rationale: பறவைகளின் சூழலில் தங்கும் இடங்களைக் குறிக்க இயல்பான தமிழ் சொல்; சொல்லின் விரிவான பொருள் ‘தங்குமிடங்கள்’ என்பதாகவும் இருக்கலாம்.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: இயேசுவின் தற்குறிப்புப் பட்டத்தை மொழிபெயர்த்து, அதன் வேதாகம மற்றும் இறையியல் ஒலிப்பையும் மூலத்திலுள்ள பொருள் அடுக்குகளையும் காக்கிறது.
- source_word: οὐκ ἔχει ποῦ
  choice: இடமில்லை
  rationale: ‘எங்கே ... என்பதில்லை’ என்ற கிரேக்க அமைப்பை இயல்பான தமிழில் அதன் மறுப்புப் பொருளுடன் வழங்குகிறது.
- source_word: τὴν κεφαλὴν κλίνῃ
  choice: தம் தலையைச் சாய்க்க
  rationale: தலையை வைக்க அல்லது ஓய்வெடுக்க இடமின்மையை உணர்த்தும் மூலத்தின் தெளிவான உருவகத்தை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου என்ற இயேசுவின் தற்குறிப்பை மொழிபெயர்த்தல்
  choice: மனிதகுமாரன்
  alternative: மனிதன் / மானிடர்
  rationale: ‘மனிதகுமாரன்’ என்பது பட்டத்தின் சொற்தொடரையும் தானியேல் 7 உள்ளிட்ட சாத்தியமான வேதாகம எதிரொலிகளையும் காக்கிறது; மாற்றுகள் அதை பொதுவான மனிதக் குறிப்பாக முன்கூட்டியே விளக்கிவிடக்கூடும்.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான பொதுத்தமிழ். கதைநடையின் இயல்புக்காக வரலாற்று நிகழ்காலம் இறந்தகாலமாக்கப்பட்டுள்ளது. ‘தம்’ என்பது இயேசுவைக் குறிக்கும் மரியாதை ஒருமை; வசனத்தின் நேரடியான வறுமை மற்றும் இடமின்மை உருவகம் பாதுகாக்கப்பட்டுள்ளது.
