id: MAT.8.32
reference: Matthew 8:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὑπάγετε. οἱ δὲ ἐξελθόντες ἀπῆλθον εἰς ⸂τοὺς χοίρους⸃· καὶ ἰδοὺ ὥρμησεν πᾶσα ἡ ⸀ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, καὶ ἀπέθανον ἐν τοῖς ὕδασιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/032.yaml
  text: And he said to them[a], “Go.” Then they came out and went into the pigs; and behold[c][b], the whole herd rushed down the steep bank into the sea and died in the waters.
translation:
  language: ta
  text: அவர் அவைகளிடம், “போங்கள்” என்றார். அவை வெளியே வந்து பன்றிகளுக்குள் சென்றன. இதோ, முழு மந்தையும் செங்குத்தான சரிவில் இறங்கி, கடலுக்குள் பாய்ந்து, நீரில் இறந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீரில் மூழ்கி இறந்தது.” கிரேக்க மூலத்தில் சொல்லுக்குச் சொல், “நீரில் இறந்தது” என்று உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὑπάγετε
  choice: போங்கள்
  rationale: இயேசுவின் சுருக்கமான பன்மை கட்டளையை இயல்பான நவீனத் தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: ἐξελθόντες
  choice: வெளியே வந்து
  rationale: பேய்கள் முன்பு இருந்தவர்களிடமிருந்து வெளியேறியதைச் சூழலுக்கு ஏற்ற இயல்பான தொடர்வினையாக வெளிப்படுத்துகிறது.
- source_word: ἀπῆλθον εἰς τοὺς χοίρους
  choice: பன்றிகளுக்குள் சென்றன
  rationale: பேய்கள் விலங்குகளுக்குள் சென்ற இயக்கத்தைத் தெளிவாகவும் மிகைவிளக்கம் இன்றியும் தருகிறது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: அடுத்து நிகழ்வதைக் கவனிக்கச் செய்யும் கிரேக்க உரையாடல் குறியின் உயிரோட்டத்தைப் பேணுகிறது.
- source_word: πᾶσα ἡ ἀγέλη
  choice: மந்தை முழுவதும்
  rationale: πᾶσα என்பதன் முழுமையையும் ἀγέλη என்பதன் கூட்டுப்பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: ὥρμησεν
  choice: பாய்ந்து
  rationale: திடீரான, வேகமான, வலிமையான இயக்கத்தைச் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: செங்குத்தான சரிவில்
  rationale: κρημνός குறிக்கக்கூடிய கடுமையான சரிவு அல்லது பள்ளத்தாக்குக் கரையைத் தேவையின்றி ‘பாறைக்குன்று’ எனக் குறுக்காமல் காட்டுகிறது.
- source_word: εἰς τὴν θάλασσαν
  choice: கடலை நோக்கி
  rationale: θάλασσα என்பதைக் ‘கடல்’ எனப் பேணுகிறது; இயக்கத்தின் இலக்கைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: ἀπέθανον ἐν τοῖς ὕδασιν
  choice: நீரில் இறந்துபோனது
  rationale: கிரேக்கம் நேரடியாகச் சொல்வது ‘நீரில் இறந்தன’ என்பதே; ‘மூழ்கி இறந்தன’ என்ற சூழல்சார் முடிவை முதன்மை உரையில் சேர்க்கவில்லை.
theological_decisions:
- issue: மந்தையின் மரணத்தை எவ்வளவு குறிப்பாக விவரிப்பது
  choice: ‘நீரில் இறந்துபோனது’ என்று மூலத்தின் நேரடி சொல்லாட்சியைப் பேணுதல்
  alternative: ‘நீரில் மூழ்கி இறந்துபோனது’
  rationale: சூழல் மூழ்கி இறந்ததை வலுவாக உணர்த்தினாலும், கிரேக்க வினைச்சொல் வெறுமனே ‘இறந்தன’ என்றே கூறுகிறது; ஆகவே விளக்கமான முடிவை உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையானதாயினும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. பேய்களைக் குறிக்கும் அஃறிணைப் பன்மை தமிழில் வினைமுற்றில் ஒருமை வடிவாக இயல்பாக அமைந்துள்ளது; ‘மந்தை’ என்ற கூட்டுப்பெயருக்கும் ஒருமை வினை பயன்படுத்தப்பட்டுள்ளது.
