id: MAT.8.3
reference: Matthew 8:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα ἥψατο ⸀αὐτοῦ λέγων· Θέλω, καθαρίσθητι· καὶ εὐθέως ἐκαθαρίσθη αὐτοῦ ἡ λέπρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/003.yaml
  text: And stretching out his hand[a], he touched him, saying, “I am willing[c][b]; be cleansed.” And immediately his leprosy was cleansed.
translation:
  language: ta
  text: அவர் தமது கையை நீட்டி அவனைத் தொட்டு, “எனக்கு விருப்பம் உண்டு; தூய்மையாகு” என்றார். உடனே அவன் தனது தொழுநோயிலிருந்து[a] தூய்மையாக்கப்பட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘தொழுநோய்’ என்று மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொல், நவீன ஹான்சன் நோயை மட்டும் அல்லாமல் பலவகையான கடுமையான தோல் நோய்களையும் குறிக்கக்கூடும்.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: தமது கையை நீட்டி
  rationale: முந்திய துணைச்செயலை இயல்பான தமிழில் வெளிப்படுத்தி, உடல் அசைவின் தெளிவையும் காக்கிறது.
- source_word: ἥψατο αὐτοῦ
  choice: அவனைத் தொட்டு
  rationale: ἅπτομαι என்பதன் இச்சூழலுக்குரிய நேரடியான பொருள் ‘தொடு’; குணமாக்கும் நிகழ்வில் தேவையற்ற ‘பற்றிக்கொள்’ என்ற வலிமையைச் சேர்க்கவில்லை.
- source_word: Θέλω
  choice: எனக்கு விருப்பம் உண்டு
  rationale: முந்தைய வேண்டுகோளில் எழுப்பப்பட்ட விருப்பம்/மனமுண்டா என்ற கேள்விக்கு இயேசு அளிக்கும் சம்மதத்தைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; இதை எதிர்கால வாக்குறுதியாக மாற்றவில்லை.
- source_word: καθαρίσθητι
  choice: தூய்மையாகு
  rationale: உடல்நல மீட்போடு சடங்குசார் தூய்மையின் கருத்தையும் காக்கிறது; ‘குணமாகு’ என்பதைக் காட்டிலும் மூலத்தின் καθαρίζω சொற்பொருளுக்கு நெருக்கமானது.
- source_word: εὐθέως
  choice: உடனே
  rationale: விளைவு தாமதமின்றி நிகழ்ந்ததைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐκαθαρίσθη αὐτοῦ ἡ λέπρα
  choice: அவனுடைய தொழுநோய் நீங்கி, அவன் தூய்மையானான்
  rationale: கிரேக்கத்தில் ‘அவனுடைய λέπρα’ இலக்கண எழுவாயாக இருந்தாலும், ‘நோய் தூய்மையாக்கப்பட்டது’ என்பது தமிழில் இயல்பற்றது. ஆகவே நோய் நீங்கியதையும் அதனால் அவன் தூய்மையானதையும் இணைத்து, உடல் மற்றும் தூய்மை ஆகிய இரு பரிமாணங்களையும் காக்கிறது.
- source_word: ἡ λέπρα
  choice: தொழுநோய்
  rationale: வேதாகமப் பயன்பாட்டில் அறியப்பட்ட மரபுச் சொல்லைத் தக்கவைக்கிறது; இது நவீன ஹான்சன் நோயை மட்டும் துல்லியமாகக் குறிக்காமல் இருக்கலாம் என்பதால் அடிக்குறிப்பு தரப்படுகிறது.
theological_decisions:
- issue: καθαρίζω என்பதில் உள்ள தூய்மை மற்றும் குணமடைதல் சார்ந்த இரட்டை பரிமாணம்
  choice: கட்டளையில் ‘தூய்மையாகு’ என்றும் விளைவில் நோய் நீங்கி அவன் தூய்மையானான் என்றும் மொழிபெயர்த்தல்
  alternative: இரு இடங்களிலும் ‘குணமாகு/குணமானான்’ என்று மொழிபெயர்த்தல்
  rationale: ‘குணம்’ மட்டும் பயன்படுத்தினால் கிரேக்கத்தில் உள்ள சடங்குசார் மற்றும் சமூகத் தூய்மை நுணுக்கம் மறையும்; தேர்ந்த வடிவம் உடல் குணமடைதலையும் தூய்மையையும் ஒன்றாகக் காக்கிறது.
- issue: Θέλω என்பதன் பொருள்
  choice: எனக்கு விருப்பம் உண்டு
  alternative: நான் செய்வேன்
  rationale: இது எதிர்காலச் செயலை வாக்களிப்பதைவிட, வேண்டுகோளுக்கு மனமுவந்த சம்மதத்தை வெளிப்படுத்துகிறது; முந்தைய வசனத்தின் ‘உமக்கு விருப்பமானால்’ என்ற கருத்தோடு இயல்பாகப் பொருந்துகிறது.
- issue: இறுதி வாக்கியத்தின் இலக்கண எழுவாய்
  choice: நோய் நீங்கியதையும் மனிதன் தூய்மையானதையும் இணைத்துக் கூறுதல்
  alternative: ‘அவனுடைய தொழுநோய் தூய்மையாக்கப்பட்டது’ என கிரேக்க இலக்கண அமைப்பை அப்படியே பின்பற்றுதல்
  rationale: மூலத்தில் நோயே எழுவாயாக இருப்பதை ‘அவனுடைய தொழுநோய் நீங்கி’ என்ற கூறு காக்கிறது; தமிழில் பொருளற்றதாகத் தோன்றும் ‘நோய் தூய்மையாக்கப்பட்டது’ என்பதைத் தவிர்த்து, καθαρίζω தரும் தூய்மை விளைவையும் வெளிப்படையாக வைத்திருக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை. ‘தமது’ மரியாதையுடனும் தெளிவான முன்னிலைச் சுட்டுடனும் பயன்படுத்தப்பட்டுள்ளது. மேற்கோள் உரை சுருக்கமாக இருந்து மூலத்தின் அதிகாரமிக்க கட்டளையையும் மனமுவந்த சம்மதத்தையும் காக்கிறது.
