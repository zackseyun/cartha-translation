id: MAT.8.9
reference: Matthew 8:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ⸀ἐξουσίαν, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/009.yaml
  text: For I also am a man under authority[a], having soldiers under me. And I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.
translation:
  language: ta
  text: ஏனெனில், நானும் அதிகாரத்துக்குக் கீழ்ப்பட்ட ஒரு மனிதன்; எனக்குக் கீழ் படைவீரர்கள் இருக்கிறார்கள். நான் இவனிடம், ‘போ’ என்று சொன்னால், அவன் போகிறான்; இன்னொருவனிடம், ‘வா’ என்று சொன்னால், அவன் வருகிறான்; என் அடிமையிடம்[a], ‘இதைச் செய்’ என்று சொன்னால், அவன் செய்கிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “வேலைக்காரன்”; கிரேக்கச் சொல்: δοῦλος (தூலோஸ்).'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத்தையும் காரணத்தையும் அறிமுகப்படுத்தும் γάρ என்பதன் தொடர்பை இயல்பான தமிழில் தெரிவிக்கிறது; καί இங்கு வலியுறுத்தும் இணைப்பாக உள்ளது.
- source_word: ἐγὼ ἄνθρωπός εἰμι ὑπὸ ἐξουσίαν
  choice: நானும் அதிகாரத்துக்குக் கீழ்ப்பட்ட ஒரு மனிதன்
  rationale: ἐγώ மற்றும் καί தரும் ‘நானும்’ என்ற வலியுறுத்தலையும், ὑπὸ ἐξουσίαν குறிக்கும் கட்டளை அதிகாரத்திற்குக் கீழிருக்கும் நிலையையும் காக்கிறது.
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: எனக்குக் கீழ் படைவீரர்கள் இருக்கிறார்கள்
  rationale: நூற்றுக்குத் தலைவன் தானும் அதிகாரத்துக்குக் கீழிருப்பதோடு, தனக்குக் கீழும் வீரர்கள் இருப்பதைத் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται
  choice: நான் ஒருவனிடம், ‘போ’ என்றால் அவன் போகிறான்
  rationale: கிரேக்கத்தின் கட்டளை–உடனடிக் கீழ்ப்படிதல் அமைப்பை இயல்பான தமிழ் நிபந்தனை வடிவில் காக்கிறது.
- source_word: καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται
  choice: இன்னொருவனிடம், ‘வா’ என்றால் அவன் வருகிறான்
  rationale: τούτῳ … ἄλλῳ என்ற பகிர்ந்துரைக்கும் இணை அமைப்பை ‘ஒருவன் … இன்னொருவன்’ என்று தெளிவாகத் தருகிறது.
- source_word: τῷ δούλῳ μου
  choice: என் அடிமையிடம்
  rationale: δοῦλος அக்காலத்தில் சட்ட மற்றும் சமூக ரீதியாக உரிமையாளருக்குக் கீழ்ப்பட்ட அடிமையைக் குறிக்கக்கூடும்; ‘அடிமை’ அந்த உறவை மறைக்காமல் நேரடியாகத் தருகிறது.
- source_word: Ποίησον τοῦτο, καὶ ποιεῖ
  choice: ‘இதைச் செய்’ என்றால் அவன் செய்கிறான்
  rationale: ஒரே வினைச்சொல்லை கட்டளையிலும் நிறைவேற்றுதலிலும் மீளக் கூறும் கிரேக்க இணைநிலையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: அடிமை
  alternative: வேலைக்காரன் / பணியாளர்
  rationale: இந்த வசனத்தின் மையம் அதிகார அமைப்பாக இருந்தாலும், δοῦλος குறிக்கும் கட்டுப்பட்ட சமூக நிலையைக் ‘வேலைக்காரன்’ என்று மென்மைப்படுத்தாமல் ‘அடிமை’ எனத் தருவது மூலச்சொல்லின் வரலாற்று வலிமையைப் பாதுகாக்கிறது; பரந்த பொருள் வாய்ப்பை அடிக்குறிப்பு குறிப்பிடுகிறது.
- issue: நூற்றுக்குத் தலைவனின் அதிகார ஒப்புமை
  choice: இயேசுவின் அதிகாரத்தின் இயல்பை விளக்கமாகச் சேர்க்காமல், அவன் சொன்ன அதிகாரச் சங்கிலி ஒப்புமையை மட்டும் மொழிபெயர்த்தல்
  alternative: இயேசுவின் அதிகாரம் தேவனிடமிருந்து ஒப்படைக்கப்பட்டது என வெளிப்படையாக விளக்கிச் சேர்த்தல்
  rationale: வசனம் ஒப்புமையை முன்வைக்கிறது; அதன் கிறிஸ்துவியல் பொருளை உரைக்குள் தீர்மானமாகச் சேர்ப்பது மூலத்தின் மறைமுகத்தன்மையையும் இறையியல் அழுத்தத்தையும் குறைக்கும்.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அதிகாரத்துக்குக் கீழ்ப்பட்ட’ என்பது இராணுவக் கட்டளைச் சங்கிலியைத் தெளிவாகக் காட்டுகிறது. கட்டளை–செயல் இணைகள் எளிய நிகழ்காலத்தில் வைக்கப்பட்டுள்ளன.
