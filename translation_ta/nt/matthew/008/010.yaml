id: MAT.8.10
reference: Matthew 8:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ Ἰησοῦς ἐθαύμασεν καὶ εἶπεν τοῖς ἀκολουθοῦσιν· Ἀμὴν λέγω ὑμῖν, ⸂παρ’ οὐδενὶ τοσαύτην πίστιν ἐν τῷ Ἰσραὴλ⸃ εὗρον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/010.yaml
  text: When Jesus heard this[a], he marveled and said to those following him, “Truly I tell you[b], with no one in Israel have I found such faith.”
translation:
  language: ta
  text: 'இதைக் கேட்ட இயேசு வியந்து, தம்மைப் பின்தொடர்ந்தவர்களிடம், “உண்மையாகவே உங்களுக்குச் சொல்கிறேன்: இஸ்ரவேலில் யாரிடமும் இவ்வளவு பெரிய விசுவாசத்தை[a] நான் கண்டதில்லை[b]” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இத்தகைய விசுவாசத்தை.”
    reason: τοσαύτην என்பது அளவை வலியுறுத்தும் ‘இவ்வளவு பெரிய’ என்றும், தன்மையைச் சுட்டும் ‘இத்தகைய’ என்றும் இயல்பாக மொழிபெயர்க்கப்படலாம்.
  - marker: b
    text: அல்லது, “இத்தகைய விசுவாசமுள்ள ஒருவரையும் இஸ்ரவேலில் நான் கண்டதில்லை.”
    reason: παρ’ οὐδενὶ … πίστιν என்பதன் தொடர்பை தமிழில் விசுவாசத்தை நேரடிப் பொருளாகவோ, விசுவாசமுள்ள நபரை மையப்படுத்தியோ வெளிப்படுத்தலாம்; பொருள் மாறாது.
lexical_decisions:
- source_word: ἀκούσας
  choice: இதைக் கேட்ட
  rationale: இறந்தகால வினையெச்சம் முதன்மை வினைக்கான சூழலைக் குறிக்கிறது. முந்தைய வசனத்தில் நூற்றுக்குத் தலைவன் கூறியதையே இது சுட்டுவதால், தமிழில் இயல்பாக இருக்க ‘இதை’ சேர்க்கப்பட்டது.
- source_word: ἐθαύμασεν
  choice: வியந்து
  rationale: இயேசு அந்த விசுவாசத்தைக் கண்டு கொண்ட ஆழ்ந்த ஆச்சரியத்தை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τοῖς ἀκολουθοῦσιν
  choice: தம்மைப் பின்தொடர்ந்தவர்களிடம்
  rationale: அந்த நேரத்தில் இயேசுவோடு சென்றுகொண்டிருந்தவர்களைக் குறிக்கிறது; ஓர் அமைப்புசார் பட்டமாக மாற்றாமல் செயற்பொருளைப் பாதுகாக்கிறது.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: உண்மையாகவே உங்களுக்குச் சொல்கிறேன்
  rationale: இயேசுவின் உறுதியான, சிறப்பான அறிமுகக் கூற்றின் வலிமையை நவீன தமிழில் தெளிவாகக் காக்கிறது.
- source_word: παρ’ οὐδενὶ
  choice: யாரிடமும்
  rationale: παρά + வேற்றுமை இங்கு ஒருவரிடத்தில் அல்லது அவரது நிலைமையில் காணப்படுதல் என்ற தொடர்பைக் குறிக்கிறது.
- source_word: τοσαύτην πίστιν
  choice: இவ்வளவு பெரிய விசுவாசத்தை
  rationale: τοσαύτην அளவையும் மேன்மையையும் வலியுறுத்துவதால், ‘இவ்வளவு பெரிய’ என்பது கிரேக்கத்தின் தீவிரத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐν τῷ Ἰσραὴλ
  choice: இஸ்ரவேலில்
  rationale: இஸ்ரவேல் மக்களின் நடுவிலும் அவர்களின் சமூகச் சூழலிலும் என்ற இடவியல்-கூட்டுப்பொருளை நேரடியாகத் தருகிறது.
- source_word: εὗρον
  choice: நான் கண்டதில்லை
  rationale: οὐδενί உடனான கிரேக்க மறுப்பு தமிழில் இயல்பாக வினையில் ‘இல்லை’ என வெளிப்படுகிறது; இயேசுவின் இதுவரையிலான அனுபவத்தைச் சூழல் உணர்த்துகிறது.
theological_decisions:
- issue: πίστις என்பதன் மொழிபெயர்ப்பு
  choice: விசுவாசம்
  alternative: நம்பிக்கை / நம்புதல்
  rationale: இங்கு நூற்றுக்குத் தலைவன் இயேசுவின் அதிகாரத்தில் வைத்த உறுதியான நம்பிக்கையை πίστις குறிக்கிறது. வேதாகமத் தெய்வவியல் சொல்லாகவும் இச்சூழலின் நம்புதல் சார்ந்த பொருளை உள்ளடக்குவதாகவும் ‘விசுவாசம்’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘தம்மைப்’ என்பது இயேசுவையே திரும்பச் சுட்டும் மரியாதைத் தற்சுட்டுப் பெயராகப் பயன்படுத்தப்பட்டது; வாக்கியம் உரையின் வலியுறுத்தலையும் இயல்பான தமிழ் சொல் வரிசையையும் சமநிலைப்படுத்துகிறது.
