  yaml_path: translation/nt/matthew/008/005.yaml
  text: When he entered Capernaum[a], a centurion came to him, pleading with him[b],
translation:
  language: ta
  text: 'அவர் கப்பர்நகூமுக்குள் சென்றபோது, நூற்றுவர் படைத்தலைவர் ஒருவர் அவரிடம் வந்து, அவரை வேண்டிக்கொண்டான்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰσελθόντος δὲ αὐτοῦ
  choice: அவர் … சென்றபோது
  rationale: இறந்தகால வினையெச்சத்துடன் அமைந்த தனிநிலை ஆறாம் வேற்றுமைத் தொடரை இயல்பான காலத் துணைவாக்கியமாக மொழிபெயர்க்கிறது. ‘சென்றபோது’ என்பது ‘சென்ற பிறகு’ அல்லது ‘சென்றுகொண்டிருக்கையில்’ என்று கால உறவைத் தேவையின்றி மிகத் துல்லியமாக்காமல் காக்கிறது.
- source_word: εἰς Καφαρναοὺμ
  choice: கப்பர்நகூமுக்குள்
  rationale: இடப்பெயர் தமிழின் வழக்கமான ஒலிபெயர்ப்பில் தரப்பட்டுள்ளது; εἰς என்பதின் உள்ளே செல்லும் இயக்கத்தை ‘-க்குள்’ தெளிவாகக் காட்டுகிறது.
- source_word: προσῆλθεν αὐτῷ
  choice: அவரிடம் வந்து
  rationale: προσέρχομαι என்பதின் ‘ஒருவரிடம் வருதல்/அணுகுதல்’ என்ற பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἑκατόνταρχος
  choice: நூற்றுவர் படைத்தலைவன்
  rationale: குறிப்பிட்ட இராணுவப் பதவியை வெறும் பொதுவான ‘அதிகாரி’ என்று மங்கச் செய்யாமல், இன்றைய வாசகருக்கும் புரியுமாறு தருகிறது.
- source_word: παρακαλῶν αὐτὸν
  choice: அவரை வேண்டிக்கொண்டான்
  rationale: அடுத்த வசனத்தில் வரும் கோரிக்கையை அறிமுகப்படுத்தும் உருக்கமான விண்ணப்பத்தை வெளிப்படுத்துகிறது; ‘கேட்டான்’ என்பதைவிட வலிமையானதும், ‘கெஞ்சினான்’ என்பதைவிட தொனியை மிகைப்படுத்தாததும் ஆகும்.
theological_decisions: []
translation_notes:
  register: இயல்பான, தற்போதைய செந்தமிழ் நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தின் நேரடி உரையை அறிமுகப்படுத்துவதால் முடிவில் முக்காற்புள்ளி வைக்கப்பட்டுள்ளது.
