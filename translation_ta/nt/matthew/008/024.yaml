base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/024.yaml
  text: And behold[a], a great storm arose on the sea, so that the boat was being swamped by the waves[b]; but he was sleeping.
translation:
  language: ta
  text: இதோ, கடலில் ஒரு பெரும் புயல்[a] எழுந்தது; அதனால் படகு அலைகளால் மூடப்பட்டுக்கொண்டிருந்தது[b]. ஆனால் அவரோ தூங்கிக்கொண்டிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘பெரும் புயல்’ என மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொல் பெரும்பாலும் ‘நிலநடுக்கம்’ அல்லது ‘அதிர்வு’ என்றும் பொருள்படும்; இக்கடல் சூழலில் அது கடுமையான புயலைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அலைகளால் மூழ்கடிக்கப்பட்டுக்கொண்டிருந்தது.’
    reason: translation_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தைத் திடீரென நிகழ்வின்மீது திருப்பும் மூலமொழியின் உரையாடல் குறியீட்டை இயல்பாகவும் சுருக்கமாகவும் தக்கவைக்கிறது.
- source_word: σεισμὸς μέγας
  choice: ஒரு பெரும் புயல்
  rationale: σεισμός பொதுவாக ‘நிலநடுக்கம்’ அல்லது ‘அதிர்வு’ எனப் பொருள்படலாம்; ஆனால் கடல், படகு, அலைகள் ஆகிய இச்சூழலில் கடுமையான கடற்புயலைக் குறிக்கிறது.
- source_word: ἐγένετο
  choice: எழுந்தது
  rationale: புயல் தொடங்கியதைத் தமிழில் இயல்பாக எடுத்துரைக்கிறது.
- source_word: ἐν τῇ θαλάσσῃ
  choice: கடலில்
  rationale: நிகழ்வு நடந்த இடத்தை இயல்பான தமிழில் தெரிவிக்கிறது; மூலத்தின் ‘கடல்’ என்ற சொல்லையும் தக்கவைக்கிறது.
- source_word: ὥστε
  choice: அதனால்
  rationale: புயலின் விளைவாக அலைகள் படகை மூடியதைத் தெளிவாக இணைக்கிறது.
- source_word: τὸ πλοῖον
  choice: படகு
  rationale: கலிலேயக் கடல் சூழலுக்கும் சாதாரண நவீன தமிழுக்கும் ‘படகு’ பொருத்தமானது.
- source_word: καλύπτεσθαι
  choice: மூடப்பட்டுக்கொண்டிருந்தது
  rationale: அலைகள் படகைத் தொடர்ந்து மூடிக்கொண்டிருந்த செயலை present passive infinitive-ன் நீடித்த அம்சத்துடன் நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: ὑπὸ τῶν κυμάτων
  choice: அலைகளால்
  rationale: செயப்பாட்டு அமைப்பில் அலைகளே படகை மூடிய கருவி அல்லது காரணம் என்பதைத் துல்லியமாகக் காட்டுகிறது.
- source_word: αὐτὸς δὲ
  choice: ஆனால் அவரோ
  rationale: சுற்றியுள்ள கொந்தளிப்புக்கும் இயேசுவின் உறக்கத்திற்கும் இடையிலான எதிர்மறை வேறுபாட்டையும் αὐτός-ன் மிதமான வலியுறுத்தலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐκάθευδεν
  choice: தூங்கிக்கொண்டிருந்தார்
  rationale: இறந்தகாலத்தில் நீடித்துக்கொண்டிருந்த செயலை imperfect வினையின் அம்சத்துக்கு ஏற்றவாறு தெரிவிக்கிறது; தமிழின் மரியாதை ஒருமை நற்செய்தி உரைநடைக்கு இயல்பானது.
theological_decisions:
- issue: σεισμός குறிக்கும் நிகழ்வின் தன்மை
  choice: கடல் சூழலுக்கேற்ப ‘புயல்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘நிலநடுக்கம்’ அல்லது ‘பெரும் அதிர்வு’ என்று நேரடியாக மொழிபெயர்த்தல்.
  rationale: இது கோட்பாட்டுத் தீர்மானம் அல்ல; சொற்பொருள் மற்றும் சூழல் சார்ந்த முடிவு. கடல், படகு, அலைகள் ஆகியவை கடுமையான கடற்புயலைச் சுட்டுவதால், தமிழில் தவறான நிலநடுக்கப் படிமத்தை உருவாக்காமல் சூழலின் பொருளைத் தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான வேதாகம உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ மூலத்தின் திடீர் கவன ஈர்ப்பைத் தக்கவைக்கிறது; ‘அவரோ’ எதிர்மறை வேறுபாட்டை இயல்பாக வலியுறுத்துகிறது. இணைக்கப்பட்டுள்ள [a], [b] குறிகள் அனைத்தும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
