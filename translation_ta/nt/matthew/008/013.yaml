reference: Matthew 8:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς τῷ ἑκατοντάρχῃ· Ὕπαγε, ⸀ὡς ἐπίστευσας γενηθήτω σοι· καὶ ἰάθη ὁ ⸀παῖς ἐν τῇ ὥρᾳ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/013.yaml
  text: And Jesus said to the centurion[a], “Go; as you have believed, let it be done for you.” And the servant was healed in that hour.
translation:
  language: ta
  text: இயேசு நூற்றுவர் படைத்தலைவனிடம், “போ; நீ நம்பியபடியே உனக்கு ஆகட்டும்” என்றார். அந்த வேளையில் பணியாள்[a] குணமடைந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சிறுவன்” அல்லது “குழந்தை.” கிரேக்கச் சொல் παῖς ஒரு பணியாளையோ இளம் நபரையோ குறிக்கலாம். இச்சூழலில் நூற்றுவர் படைத்தலைவனுக்குக் கீழ்ப்பட்டவரைக் குறிப்பதால், “பணியாள்” என்பது மிகவும் பொருத்தமானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: நூற்றுவர் படைத்தலைவன்
  rationale: சுமார் நூறு வீரர்களுக்குத் தலைமை வகித்த ரோமப் படை அதிகாரியைத் துல்லியமாகக் குறிக்கும், தமிழ் வேதாகம நடையில் புரிந்துகொள்ளக்கூடிய சொல்.
- source_word: Ὕπαγε
  choice: போ
  rationale: புறப்பட்டுச் செல்லும்படி கூறும் கட்டளையைச் சேர்க்கையின்றி இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ὡς ἐπίστευσας
  choice: நீ நம்பியபடியே
  rationale: πίστευσας என்பதன் வினைச்சொல் தன்மையையும், நூற்றுவர் படைத்தலைவனின் தனிப்பட்ட நம்பிக்கையையும் பாதுகாக்கிறது; ‘உன் விசுவாசத்தின்படி’ என்ற பெயர்ச்சொல் சார்ந்த விளக்கத்தைத் தவிர்க்கிறது.
- source_word: γενηθήτω σοι
  choice: உனக்கு ஆகட்டும்
  rationale: γίνομαι என்பதன் இறைப்பாட்டு வடிவத்தையும் விருப்பம் அல்லது ஆணையை வெளிப்படுத்தும் கட்டளைத் தொனியையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: παῖς
  choice: பணியாள்
  rationale: உடனுள்ள சூழலில் நூற்றுவர் படைத்தலைவனுக்குக் கீழ்ப்பட்ட ஒருவரைக் குறிப்பதால் ‘பணியாள்’ மிகவும் பொருத்தமானது. ‘சிறுவன்’ அல்லது ‘குழந்தை’ என்ற பொருளும் சாத்தியமுள்ளதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἰάθη
  choice: குணமடைந்தான்
  rationale: ἰάομαι என்பதன் செயல்படுபொருள் வடிவத்தைக் கருத்தில் கொண்டு, நோயிலிருந்து மீட்கப்பட்டதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐν τῇ ὥρᾳ ἐκείνῃ
  choice: அந்த வேளையிலேயே
  rationale: கிரேக்கத்தின் காலக் குறிப்பைப் பாதுகாப்பதுடன், குணமடைதல் தாமதமின்றி நிகழ்ந்ததை இயல்பாக உணர்த்துகிறது; துல்லியமான ஒரு கணம் என்று தேவையின்றி வரையறுப்பதில்லை.
theological_decisions:
- issue: πιστεύω என்ற நம்பிக்கைச் சொல்லின் மொழிபெயர்ப்பு
  choice: நம்பியபடியே
  alternative: விசுவாசித்தபடியே; நம்பிக்கை வைத்தபடியே
  rationale: ‘நம்பு’ என்பது πιστεύω என்பதன் தனிப்பட்ட வினைச்செயலைத் தெளிவாகவும் இயல்பாகவும் தருகிறது. ‘விசுவாசம்’ என்ற பெயர்ச்சொல் வடிவத்துக்கு மாற்றி வசனத்தின் இலக்கணத் தொனியை விளக்கவுரை ஆக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘நூற்றுவர் படைத்தலைவன்’ வரலாற்றுப் பதவியின் துல்லியத்தைத் தக்கவைக்கிறது. அடிக்குறிப்பு குறி, அதற்குரிய παῖς என்பதன் மொழிபெயர்ப்பான ‘பணியாள்’ என்பதற்குப் பின்னரே வைக்கப்பட்டுள்ளது.
