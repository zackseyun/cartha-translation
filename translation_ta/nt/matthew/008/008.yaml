id: MAT.8.8
reference: Matthew 8:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂καὶ ἀποκριθεὶς⸃ ὁ ἑκατόνταρχος ἔφη· Κύριε, οὐκ εἰμὶ ἱκανὸς ἵνα μου ὑπὸ τὴν στέγην εἰσέλθῃς· ἀλλὰ μόνον εἰπὲ λόγῳ, καὶ ἰαθήσεται ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/008.yaml
  text: And the centurion answered[a], “Lord, I am not worthy that you should come under my roof. But only speak a word[b], and my servant will be healed.”
translation:
  language: ta
  text: அதற்குப் பதிலளித்த நூற்றுவர் தலைவர், “ஆண்டவரே, நீர் என் கூரையின் கீழ் வருவதற்கு நான் தகுதியானவன் அல்ல. ஆனால் ஒரு வார்த்தை மட்டும் சொல்லுங்கள்[a]; என் பணியாள்[b] குணமடைவான்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த வார்த்தையை மட்டும் சொல்லுங்கள்.” கிரேக்கத்தில் சொற்பட, “ஒரு வார்த்தை சொல்லுங்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “சிறுவன்” அல்லது “குழந்தை.” கிரேக்கச் சொல் சூழலுக்கேற்ப குழந்தை, இளைஞன், அல்லது பணியாள் என்பதைக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς … ἔφη
  choice: அதற்குத் தலைவன் … என்றான்
  rationale: பதிலளிக்கும் பொருளுடைய வினையெச்சமும் ‘சொன்னான்’ என்ற உரையறிமுக வினையும் இணைந்துள்ள கிரேக்க அமைப்பை, தமிழில் தேவையற்ற இரட்டிப்பின்றி இயல்பாகக் காட்டுகிறது.
- source_word: ἑκατόνταρχος
  choice: தலைவன்
  rationale: நூறு படைவீரர்களுக்குப் பொறுப்பான ரோமப் படை அதிகாரியைக் குறிக்கும் சொல்; இச்சூழலில் முன்பே அறிமுகமான அதிகாரியை இயல்பாகச் சுட்டுகிறது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: மரியாதையான அழைப்பையும் இயேசுவைக் குறித்திருக்கக்கூடிய ஆழமான இறையியல் ஒலிப்பையும் ஒருசேரத் திறந்த நிலையில் வைக்கிறது.
- source_word: οὐκ εἰμὶ ἱκανός
  choice: நான் தகுதியானவன் அல்ல
  rationale: இங்கு வெறும் திறனை அல்ல, இயேசுவை வீட்டில் ஏற்கத் தனக்குத் தகுதி இல்லை என்ற தாழ்மையைக் குறிக்கிறது.
- source_word: ὑπὸ τὴν στέγην
  choice: என் கூரையின் கீழ்
  rationale: ‘என் வீட்டிற்குள்’ என்று பொதுமைப்படுத்தாமல், மூலத்தின் உயிரோட்டமான வீட்டுக் கூரை உருவகத்தைப் பாதுகாக்கிறது.
- source_word: μόνον εἰπὲ λόγῳ
  choice: ஒரு வார்த்தை மட்டும் சொல்லும்
  rationale: λόγῳ என்பதன் சொற்பொருளையும் μόνον என்பதன் கட்டுப்படுத்தும் வலியுறுத்தலையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἰαθήσεται
  choice: குணமடைவான்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவின் விளைவை இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: παῖς
  choice: பணியாள்
  rationale: இராணுவத் தலைவனின் சமூகச் சூழலும் இணை நிகழ்வும் ‘பணியாள்’ என்பதைக் ஆதரிக்கின்றன; இருப்பினும் சொல்லின் ‘சிறுவன்/குழந்தை’ என்ற சாத்தியங்கள் அடிக்குறிப்பில் வைக்கப்படுகின்றன.
theological_decisions:
- issue: இயேசுவை நோக்கிய κύριος என்ற அழைப்பு
  choice: ஆண்டவரே
  alternative: ஐயா; தலைவரே
  rationale: இது மரியாதை அழைப்பாக இருக்கலாம்; அதேவேளையில் கிறிஸ்துவியல் ஆழத்தையும் கொண்டிருக்கலாம். ‘ஆண்டவரே’ இரு சாத்தியங்களையும் முன்கூட்டியே முடிவுசெய்யாமல் பாதுகாக்கிறது.
- issue: παῖς என்பவரின் அடையாளம்
  choice: பணியாள்
  alternative: சிறுவன்; குழந்தை
  rationale: சூழல் ‘பணியாள்’ என்பதை அதிகம் ஆதரித்தாலும், கிரேக்கச் சொல்லின் உண்மையான பொருள் விரிவை அடிக்குறிப்பில் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மதிப்புடனும் அமைக்கப்பட்டுள்ளது. இயேசுவை நோக்கிய மரியாதைக்கு ‘நீர்/சொல்லும்’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; படைத்தலைவனின் தாழ்மையும் கட்டளையிடும் அதிகாரத்தின்மேல் அவனுடைய நம்பிக்கையும் தெளிவாக வைக்கப்பட்டுள்ளன.
