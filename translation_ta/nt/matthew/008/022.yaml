id: MAT.8.22
reference: Matthew 8:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀λέγει αὐτῷ· Ἀκολούθει μοι, καὶ ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/022.yaml
  text: But Jesus says to him[a], “Follow me, and leave the dead to bury their own dead.”
translation:
  language: ta
  text: ஆனால் இயேசு அவனிடம், “என்னைப் பின்பற்றி வா; இறந்தவர்கள்[a] தங்கள் இறந்தவர்களை அடக்கம் செய்யட்டும்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'முதலில் வரும் “இறந்தவர்கள்” என்பது அடிக்கடி உருவகமாகப் புரிந்துகொள்ளப்படுகிறது: ஆன்மீகமாகப் பதிலளிக்காதவர்கள் உடலளவில் இறந்தவர்களை அடக்கம் செய்யலாம்.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வேண்டுகோளுக்கு இயேசு அளிக்கும் திருத்தமான பதிலில் உள்ள மிதமான முரண்பாட்டைக் காட்டுகிறது.
- source_word: λέγει
  choice: என்றார்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் வந்தாலும், தமிழ்க் கதைநடையில் கடந்தகாலமான ‘என்றார்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: Ἀκολούθει μοι
  choice: என்னைப் பின்பற்றி வா
  rationale: நேரடியான சீடத்துவ அழைப்பை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἄφες
  choice: செய்யட்டும்
  rationale: இங்கு மற்றவர்களிடம் அந்தப் பொறுப்பை விட்டுவிடும் கருத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; வாக்கிய அமைப்பில் அனுமதி/விட்டுவிடுதல் இரண்டின் நுணுக்கமும் உள்ளது.
- source_word: νεκρούς ... νεκρούς
  choice: இறந்தவர்கள் ... இறந்தவர்களை
  rationale: ஒரே கிரேக்கச் சொல்லின் திட்டமிட்ட மறுபயன்பாட்டையும் அதன் சொல்லாடல் வலிமையையும் இறையியல் பதற்றத்தையும் காக்கிறது.
- source_word: θάψαι
  choice: அடக்கம் செய்ய
  rationale: இறந்தவரை புதைத்தல் அல்லது பிற வழக்கப்படி உடலை ஒப்படைத்தல் ஆகியவற்றை உள்ளடக்கும் இயல்பான, கண்ணியமான தமிழ்ச் சொற்றொடர்.
- source_word: τοὺς ἑαυτῶν νεκρούς
  choice: தங்களுடைய இறந்தவர்களை
  rationale: ἑαυτῶν தரும் தற்சுட்டு உடைமை வலியுறுத்தலைக் காக்கிறது.
theological_decisions:
- issue: இயேசுவின் கூற்றில் ‘இறந்தவர்கள்’ என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘இறந்தவர்கள் ... தங்களுடைய இறந்தவர்களை’ என்ற ஒரே சொல்லின் மறுபயன்பாடு பாதுகாக்கப்பட்டுள்ளது.
  alternative: முதல் ‘இறந்தவர்கள்’ என்பது ஆன்மீக ரீதியில் உணர்வற்றவர்களையும், இரண்டாவது சொல் உடலளவில் இறந்தவர்களையும் குறிப்பதாக வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: கிரேக்க உரை முதல் இடத்தில் ‘ஆன்மீக ரீதியில்’ என்று சேர்க்கவில்லை. இயேசுவின் நோக்கமுள்ள சொல்லாடலையும் அதன் இறையியல் பதற்றத்தையும் விளக்கி முடிவுசெய்யாமல் பாதுகாப்பது பொருத்தமானது; சாத்தியமான உருவகப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; எளிமையானதாயும் கண்ணியமானதாயும் நேரடியாகவும் அமைந்துள்ளது. ‘இறந்தவர்கள்’ என்ற மறுபயன்பாடு திட்டமிட்டு காக்கப்பட்டுள்ளது.
