id: MAT.8.4
reference: Matthew 8:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ὅρα μηδενὶ εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ, καὶ προσένεγκον τὸ δῶρον ὃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/004.yaml
  text: And Jesus said to him[a], “See that you tell no one, but go, show yourself to the priest, and offer the gift that Moses commanded[b], as a testimony to them.”
translation:
  language: ta
  text: இயேசு அவனிடம், “யாரிடமும் சொல்லாதபடி பார்த்துக்கொள். மாறாக, நீ போய் உன்னை ஆசாரியரிடம் காட்டு; அவர்களுக்குச் சாட்சியாக[a], மோசே கட்டளையிட்ட காணிக்கையைச் செலுத்து[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்களுக்குச் சாட்சியாக” என்ற சொற்றொடர் ஆசாரியர்களிடம் அளிக்கப்படும் சான்றைக் குறிக்கலாம்; நம்ப மறுப்பவர்களுக்கு எதிரான மறைமுகச் சாட்சி என்றும் சிலர் இதைப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: b
    text: இந்தக் கட்டளை, தொழுநோயிலிருந்து தூய்மையடைந்த ஒருவர் பின்பற்ற வேண்டுமென மோசேயின் சட்டம் கூறும் முறையைக் குறிக்கிறது; லேவியராகமம் 14-ஐப் பார்க்கவும்.
    reason: cross_reference
lexical_decisions:
- source_word: Ὅρα μηδενὶ εἴπῃς
  choice: யாரிடமும் சொல்லாதபடி பார்த்துக்கொள்
  rationale: Ὅρα இங்கு எச்சரிக்கையுடன் கூடிய கட்டளையாகவும், μηδενὶ εἴπῃς தடையாகவும் வருகின்றன. இந்தத் தமிழ் நடை அவற்றின் வலிமையை இயல்பாகக் காக்கிறது.
- source_word: ὕπαγε
  choice: நீ போய்
  rationale: இயக்கத்தைக் குறிக்கும் எளிய கட்டளையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: உன்னை ஆசாரியரிடம் காட்டு
  rationale: தன்னை ஆசாரியரின் பரிசோதனைக்கு முன்வைக்க வேண்டும் என்ற பிரதிபெயர்ச்சிக் கட்டமைப்பையும் மோசேயின் சட்டப் பின்னணியையும் காக்கிறது.
- source_word: προσένεγκον τὸ δῶρον
  choice: காணிக்கையைச் செலுத்து
  rationale: பலியாராதனைச் சூழலில் προσφέρω வெறுமனே கொண்டுவருவதைவிட அர்ப்பணிப்பதைக் குறிக்கிறது; δῶρον என்பதன் வழிபாட்டுச் சார்ந்த பொருளை ‘காணிக்கை’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὃ προσέταξεν Μωϋσῆς
  choice: மோசே கட்டளையிட்ட
  rationale: προστάσσω என்பதிலுள்ள அதிகாரப்பூர்வமான கட்டளையின் வலிமையை நேரடியாகக் காக்கிறது.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: அவர்களுக்குச் சாட்சியாக
  rationale: சாட்சி யாருக்கானது, அதன் நோக்கம் சாதகமான சான்றா அல்லது எதிரான சாட்சியா என்பதைத் தீர்மானிக்காமல் கிரேக்கத்தின் திறந்த பொருளைத் தக்கவைக்கிறது.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: இயேசு அவனிடம் … என்றார்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தை இயல்பான தமிழ் கதைநடைக்கேற்ப இறந்தகாலத்தில் வழங்குகிறது.
theological_decisions:
- issue: ‘அவர்களுக்குச் சாட்சியாக’ என்பதில் ‘அவர்கள்’ யார் என்பதும் சாட்சியின் தன்மையும்
  choice: ‘அவர்கள்’ யார் என்பதை விளக்கிச் சேர்க்காமலும், சாட்சியை ஆதரவான சான்று அல்லது நம்பாதவர்களுக்கு எதிரான சாட்சி என்று தீர்மானிக்காமலும் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஆசாரியர்களுக்குச் சான்றாக’ அல்லது ‘அவர்களுக்கு எதிரான சாட்சியாக’
  rationale: αὐτοῖς என்பதன் சுட்டுப்பொருள் வசனத்தில் வெளிப்படையாகக் குறிப்பிடப்படவில்லை; μαρτύριον என்பது பொதுவாகச் சாட்சி அல்லது சான்று என்ற இரு நுணுக்கங்களையும் ஏற்கக்கூடும்.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘ஆசாரியர்’, ‘காணிக்கை’, ‘சாட்சி’ ஆகியவை சட்ட-வழிபாட்டுப் பின்னணியைத் தக்கவைத்தபடியே பரவலாகப் புரிந்துகொள்ளக்கூடிய சொற்களாகத் தேர்ந்தெடுக்கப்பட்டன.
