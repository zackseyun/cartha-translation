id: MAT.8.29
reference: Matthew 8:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἔκραξαν λέγοντες· Τί ἡμῖν καὶ ⸀σοί, υἱὲ τοῦ θεοῦ; ἦλθες ὧδε πρὸ καιροῦ βασανίσαι ἡμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/029.yaml
  text: And behold[a], they cried out, saying, “What have we to do with you[b], Son of God? Have you come here before the appointed time to torment us?”
translation:
  language: ta
  text: 'இதோ, அவர்கள் கூக்குரலிட்டுச் சொன்னார்கள்: “தேவனுடைய மகனே, எங்களுக்கும் உமக்கும் என்ன சம்பந்தம்?[a] குறித்த காலத்திற்கு முன்பே[b] எங்களை வேதனைப்படுத்த இங்கே வந்தீரா?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சார்பாக, “எங்களுக்கும் உமக்கும் என்ன?”
    reason: lexical_alternative
  - marker: b
    text: “குறித்த காலம்” என்பது நியமிக்கப்பட்ட அல்லது தக்க காலத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: இதோ
  rationale: திடீரென நிகழ்வின்மேல் கவனத்தை ஈர்க்கும் ἰδού என்பதன் உரையாடல் வலிமையை இயல்பான தமிழில் தக்கவைக்கிறது; καί-ஐ தனியே ‘மற்றும்’ என மொழிபெயர்ப்பது இங்கு தேவையில்லை.
- source_word: ἔκραξαν λέγοντες
  choice: உரத்த குரலில் … என்று கேட்டார்கள்
  rationale: κράζω குறிக்கும் சத்தமான கூக்குரலை ‘உரத்த குரலில்’ வெளிப்படுத்துகிறது. மேற்கோள் வினாவாக இருப்பதால் λέγοντες என்பதை இயல்பான தமிழில் ‘என்று கேட்டார்கள்’ எனத் தருகிறது.
- source_word: Τί ἡμῖν καὶ σοί
  choice: உமக்கும் எங்களுக்கும் என்ன தொடர்பு?
  rationale: விலகல் அல்லது எதிர்ப்பை வெளிப்படுத்தும் செமித்தியச் சொற்றொடரின் உருவகத்தையும் பொருளையும் காக்கிறது; இயேசுவிடம் நேரடியாகப் பேசுவதால் மரியாதைப் பன்மையான ‘உமக்கு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: υἱὲ τοῦ θεοῦ
  choice: தேவனுடைய மகனே
  rationale: இயேசுவை நேரடியாக விளிக்கும் கிறிஸ்துவியல் பட்டத்தை விரிவாக்காமலும் வலுவிழக்கச் செய்யாமலும் தருகிறது.
- source_word: ἦλθες ὧδε
  choice: இங்கே வந்தீரா?
  rationale: ὧδε என்பதன் இடப்பொருளை ‘இங்கே’ என்றும், நேரடி விளியில் இயேசுவைக் குறிக்கும் வினையை மரியாதை வடிவிலும் தருகிறது.
- source_word: πρὸ καιροῦ
  choice: குறித்த காலத்திற்கு முன்பே
  rationale: καιρός என்பது வெறும் நேரத்தை மட்டுமல்லாமல் நிர்ணயிக்கப்பட்ட அல்லது தக்க காலத்தையும் குறிக்கக்கூடும். ‘குறித்த காலம்’ அந்த நியாயத்தீர்ப்பு சார்ந்த உட்பொருளை அளவுக்கு மீறி விளக்காமல் காக்கிறது.
- source_word: βασανίσαι
  choice: வேதனைப்படுத்த
  rationale: கடுமையான துன்புறுத்தல் அல்லது நியாயத்தீர்ப்பின் வேதனையைச் சுட்டுகிறது; ‘சித்திரவதை’ என்று உடல்சார்ந்த பொருளை அளவுக்கு மீறிக் குறிப்பதில்லை.
- source_word: ἡμᾶς
  choice: எங்களை
  rationale: பேசுகிற தீய ஆவிகளைக் குறிக்கும் நேரடியான பன்மை செயப்படுபொருள்.
theological_decisions:
- issue: தீய ஆவிகள் இயேசுவின் அடையாளத்தை அறிந்து கூறுதல்
  choice: தேவனுடைய மகனே
  alternative: இறைவனின் மகனே
  rationale: மூலத்தில் உள்ள உயர்ந்த கிறிஸ்துவியல் பட்டத்தை நேரடியாகக் காக்கிறது; உரை கூறுவதற்கு மேலான கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: καιρός என்பதிலுள்ள இறுதிக்கால நியாயத்தீர்ப்பு சார்ந்த நுண்பொருள்
  choice: குறித்த காலத்திற்கு முன்பே
  alternative: காலத்திற்கு முன்பே
  rationale: வேதனைக்காக ஒரு நிர்ணயிக்கப்பட்ட காலம் உண்டு என்ற கேள்வியின் பதற்றத்தைத் தக்கவைக்கிறது; அந்தக் காலத்தின் தன்மையை உரை கூறுவதைவிட விரிவாக வரையறுப்பதில்லை.
- issue: Τί ἡμῖν καὶ σοί என்ற சொற்றொடரின் தெளிவின்மை
  choice: உமக்கும் எங்களுக்கும் என்ன தொடர்பு?
  alternative: எங்களிடம் உமக்கு என்ன வேண்டும்?
  rationale: மூலச் சொற்றொடர் விலகல், எதிர்ப்பு, ‘நமக்குள் என்ன உள்ளது?’ ஆகிய நிழற்பொருள்களைத் தாங்குகிறது. அதிகமாக விளக்கிவிடும் மாற்றுக்கு பதிலாக genuine ambiguity-ஐ காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை. இயேசுவை நேரடியாக விளிக்கும் இடத்தில் ‘உமக்கு/வந்தீரா’ என்ற மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. ‘இதோ’ என்ற சற்றே வேதாகம மரபுள்ள சொல் இன்றும் எளிதில் புரியக்கூடியதாகவும் கவன ஈர்ப்பைத் தக்கவைக்கும் வகையிலும் உள்ளது.
