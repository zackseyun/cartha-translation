source:
  edition: SBLGNT
  text: ἕτερος δὲ τῶν ⸀μαθητῶν εἶπεν αὐτῷ· Κύριε, ἐπίτρεψόν μοι πρῶτον ἀπελθεῖν καὶ θάψαι τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/021.yaml
  text: Then another of the disciples said to him[a], “Lord[b], permit me first to go away and bury my father.”
translation:
  language: ta
  text: சீடர்களில் வேறொருவர் அவரிடம், “ஆண்டவரே, முதலில் நான் போய் என் தந்தையை அடக்கம் செய்ய[b] அனுமதியுங்கள்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எனக்கு அனுமதி அளியுங்கள்’ அல்லது ‘என்னைப் போகவிடுங்கள்.’
    reason: lexical_alternative
  - marker: b
    text: இந்த வேண்டுகோள் உடனடியாக நடைபெற வேண்டிய அடக்கத்தைக் குறிக்கலாம்; அல்லது தந்தை இறக்கும் வரை அவருக்குச் செய்ய வேண்டிய மகனின் கடமைகளை நிறைவேற்றுவதை விரிவாகக் குறிக்கலாம். கிரேக்க உரை இதைத் தெளிவுபடுத்தவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: ἕτερος δὲ τῶν μαθητῶν
  choice: சீடர்களில் வேறொருவர்
  rationale: ἕτερος என்பது முன்பு பேசியவரிலிருந்து வேறான இன்னொருவரைக் குறிக்கிறது; τῶν μαθητῶν அவரைச் சீடர் குழுவைச் சேர்ந்தவராக அடையாளப்படுத்துகிறது. δέ இங்கு மென்மையான தொடர்புச் சொல் என்பதால், தமிழில் தேவையற்ற வலுவான எதிர்மறையையோ கண்டிப்பான காலவரிசையையோ சேர்க்காமல் இயல்பான வாக்கிய ஓட்டத்தில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: இயேசுவை நேரடியாக அழைக்கும் மரியாதையையும் κύριος என்பதன் சாத்தியமான இறையியல் நிறையையும் காக்கும் வழக்கமான தமிழ் சொல்.
- source_word: ἐπίτρεψόν μοι
  choice: அனுமதியுங்கள்
  rationale: இது அனுமதி கோரும் கட்டளை வடிவம். மரியாதைப் பன்மையுடன் கூடிய இச்சொல் வேண்டுகோளின் பணிவான தொனியை இயல்பான தமிழில் தருகிறது.
- source_word: πρῶτον
  choice: முதலில்
  rationale: செயல்களின் வரிசையில் முன்னுரிமையைக் குறிக்கும் மூலச்சொல்லை நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: ἀπελθεῖν
  choice: நான் போய்
  rationale: தற்போதைய இடத்திலிருந்து செல்வதைக் குறிக்கும் வினையை இயல்பான தமிழ் தொடர் வினை அமைப்பில் தருகிறது; ‘திரும்பிவர’ என்ற மூலத்தில் இல்லாத கருத்து சேர்க்கப்படவில்லை.
- source_word: θάψαι τὸν πατέρα μου
  choice: என் தந்தையை அடக்கம் செய்ய
  rationale: வினையையும் அதன் நேரடி செயப்படுபொருளையும் தெளிவாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
theological_decisions:
- issue: தந்தையை அடக்கம் செய்யும் வேண்டுகோளின் காலப் பொருள்
  choice: தந்தையை அடக்கம் செய்யப் போவதாக உள்ள வேண்டுகோளை அதன் நேரடி வடிவிலேயே மொழிபெயர்த்து, தந்தை ஏற்கெனவே இறந்துவிட்டாரா என்பதை முதன்மை உரையில் தீர்மானிக்கவில்லை.
  alternative: இது உடனடியாக நடைபெற வேண்டிய அடக்கத்தைக் குறிக்கலாம்; அல்லது தந்தை இறக்கும் வரை மகனுக்குரிய கடமைகளை நிறைவேற்றுவதை விரிவாகக் குறிக்கலாம்.
  rationale: கிரேக்க வசனம் அடக்கம் எப்போது நடைபெறும் என்பதைத் தெளிவுபடுத்தவில்லை. ஆகவே இரு சாத்தியங்களுக்கிடையிலான உண்மையான தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified நடையில் அமைக்கப்பட்டுள்ளது. ‘அடக்கம் செய்ய’ என்பது தற்போதைய பொதுப் பயன்பாட்டைத் தக்கவைக்கிறது; ‘அடக்கம் செய்துவிட்டு வர’ என்று மொழிபெயர்க்காமல், மூலத்தில் இல்லாத திரும்பிவருதல் அல்லது செயல் நிறைவு நுணுக்கம் சேர்க்கப்படவில்லை.
