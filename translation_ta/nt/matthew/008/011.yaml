source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι πολλοὶ ἀπὸ ἀνατολῶν καὶ δυσμῶν ἥξουσιν καὶ ἀνακλιθήσονται μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/011.yaml
  text: But I tell you that many will come from east and west and will recline at table with Abraham and Isaac and Jacob in the kingdom of heaven[a][b].
translation:
  language: ta
  text: 'ஆனால் நான் உங்களுக்குச் சொல்கிறேன்: கிழக்கிலிருந்தும் மேற்கிலிருந்தும் பலர் வந்து, பரலோக ராஜ்யத்தில் ஆபிரகாம், ஈசாக்கு, யாக்கோபு ஆகியோருடன் விருந்துண்ண அமர்வார்கள்[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாகச் சொன்னால், “சாய்ந்து அமர்வார்கள்.” பண்டைய காலத்தில் விருந்துண்பவர்கள் மேசையருகே சாய்ந்து அமர்வது வழக்கம்.
    reason: cultural_note
  - marker: b
    text: “கிழக்கிலிருந்தும் மேற்கிலிருந்தும்” என்பது தொலைதூரப் பகுதிகளிலிருந்து வருபவர்களை, இஸ்ரவேலுக்கு வெளியிலுள்ளவர்களும் உட்பட, குறிப்பதாக இருக்கலாம்.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: ஆனால் நான் உங்களுக்குச் சொல்கிறேன்
  rationale: δέ இங்கு முந்தைய கருத்தோடு மென்மையான முரண்பாட்டையும் உரையின் திருப்பத்தையும் குறிக்கிறது; ‘ஆனால்’ அதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πολλοὶ
  choice: பலர்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் இந்தப் பன்மை உரிச்சொல்லைத் தமிழில் இயல்பாகவும் சுருக்கமாகவும் ‘பலர்’ என்று வழங்கலாம்.
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: கிழக்கிலிருந்தும் மேற்கிலிருந்தும்
  rationale: பன்மை வடிவங்கள் திசைகளையும் பரந்த பிரதேசங்களையும் குறிக்கும் மரபுத்தொடர்; மூலத்தில் இல்லாத மக்களின அடையாளத்தைச் சேர்க்காமல் புவியியல் விரிவைத் தக்கவைக்கிறது.
- source_word: ἥξουσιν
  choice: வந்து
  rationale: வருதல் அல்லது வந்தடைதல் என்ற பொருளைத் தருகிறது; அடுத்த எதிர்கால வினையோடு இணையும் தமிழ்த் தொடரில் ‘வந்து’ இயல்பானது.
- source_word: ἀνακλιθήσονται
  choice: விருந்துண்ண அமர்வார்கள்
  rationale: பண்டைய விருந்தில் உணவுக்காகச் சாய்ந்து இடம்பிடிப்பதைக் குறிக்கும் வினை. தமிழில் வெறும் உடல் நிலையைக் காட்டிலும் விருந்து மற்றும் மேசைத் தோழமையைத் தெளிவாக உணர்த்த இவ்வாறு வழங்கப்பட்டுள்ளது; நேரடி உடல் நிலை அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ
  choice: ஆபிரகாம், ஈசாக்கு, யாக்கோபு ஆகியோருடன்
  rationale: μετά உடனிருப்பையும் இங்கு விருந்து உறவையும் குறிக்கிறது; பெயர்கள் தமிழில் நிலைபெற்ற வடிவங்களில் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: பரலோக அரசில்
  rationale: மத்தேயுவின் தனிச்சிறப்பான சொற்றொடரை நவீன, சுருக்கமான, இயல்பான தமிழில் வழங்குகிறது; பன்மையான ‘வானங்கள்’ என்பதைச் சொற்படியாக்கி தமிழைச் செயற்கையாக்கவில்லை.
theological_decisions:
- issue: விருந்து உருவகமும் இறுதிக்காலத் தோழமையும்
  choice: ‘விருந்துண்ண அமர்வார்கள்’ என்று உணவுப் பகிர்வின் உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘ஆபிரகாம், ஈசாக்கு, யாக்கோபு ஆகியோருடன் இருப்பார்கள்’
  rationale: இவ்வசனம் வெறும் இடப்பூர்வ உடனிருப்பை அல்ல, விருந்து உறவையும் ஏற்றுக்கொள்ளப்படுதலையும் சித்தரிக்கிறது; அதற்கு மேலான கோட்பாட்டு விளக்கத்தை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
- issue: கிழக்கிலும் மேற்கிலும் இருந்து வரும் ‘பலர்’ யார் என்பதன் வரம்பு
  choice: மூலத்தைப் போலவே ‘பலர்’ என்று கூறி அவர்களின் இன அடையாளத்தை வெளிப்படையாகச் சேர்க்காமல் விடுதல்
  alternative: ‘பிற இனத்தார் பலர்’
  rationale: சூழல் இஸ்ரவேலுக்கு வெளியிலுள்ளவர்களையும் சுட்டக்கூடும்; ஆயினும் கிரேக்க உரை அவர்களை வெளிப்படையாக ‘பிற இனத்தார்’ என்று அழைக்கவில்லை. எனவே உள்ளார்ந்த குறிப்பை மொழிபெயர்ப்பு தீர்மானித்து விடவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘விருந்துண்ண அமர்வார்கள்’ இயல்பான தமிழை முன்னிறுத்துகிறது; பண்டைய சாய்ந்து உண்ணும் வழக்கம் அடிக்குறிப்பில் விளக்கப்படுகிறது.
