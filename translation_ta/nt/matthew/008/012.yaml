  text: But the sons of the kingdom will be cast out into the outer darkness[c][b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: ta
  text: ஆனால், அரசாட்சியின் மகன்கள் வெளியேயுள்ள இருளுக்குள் தள்ளப்படுவார்கள்.[a] அங்கே அழுகையும் பற்கடிப்பும் இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அரசாட்சியின் பிள்ளைகள்” அல்லது “அரசாட்சிக்கு உரியவர்களாகக் கருதப்பட்டவர்கள்” என்றும் பொருள் கொள்ளலாம். கிரேக்கத்தில் நேரடியாக “அரசாட்சியின் மகன்கள்”; இது அரசாட்சியின் உரிய வாரிசுகள் அல்லது எதிர்பார்க்கப்பட்ட உறுப்பினர்கள் எனக் கருதப்பட்டவர்களைக் குறிக்கும் இடியமொழி.
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱοὶ τῆς βασιλείας
  choice: அரசின் மகன்கள்
  rationale: கிரேக்க உருவகத்தை நெருக்கமாகத் தக்கவைத்து, அரசுக்கு உரியவர்கள் அல்லது அதன் எதிர்பார்க்கப்பட்ட வாரிசுகள் எனக் கருதப்பட்டவர்களைச் சுட்டும் முரண்பாட்டையும் பாதுகாக்கிறது. தமிழில் ‘மகன்கள்’ என்பது மூலத்தின் ஆண்பால் பன்மையை வெளிப்படுத்துகிறது.
- source_word: ἐκβληθήσονται
  choice: தள்ளப்படுவார்கள்
  rationale: ἐκβάλλω என்பதன் எதிர்காலச் செயப்பாட்டு வடிவத்திலுள்ள வலுக்கட்டாய வெளியேற்றத்தின் வலிமையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: τὸ σκότος τὸ ἐξώτερον
  choice: வெளியே உள்ள இருள்
  rationale: உள்ளே நடைபெறும் அரச விருந்துக்கும் அதற்கு வெளியேயுள்ள இருளுக்கும் இடையிலான இடவியல் எதிர்மறையை இயல்பான தமிழில் பாதுகாக்கிறது; இதனை ‘நரகம்’ என்று விளக்கி விரிவாக்கவில்லை.
- source_word: κλαυθμός
  choice: அழுகை
  rationale: துயரத்தையும் புலம்பலையும் மிகைப்படுத்தாமல் நேரடியாகத் தெரிவிக்கிறது.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: பற்கடிப்பு
  rationale: பற்களைக் கடிப்பதைக் குறிக்கும் கிரேக்கச் சொற்றொடரைச் சுருக்கமான, அறியப்பட்ட தமிழ்ச் சொல்லால் தெரிவிக்கிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் பலர் அரசில் விருந்தமர்வதற்கும் இங்கே எதிர்பார்க்கப்பட்டவர்கள் வெளியேற்றப்படுவதற்கும் உள்ள முரண்பாட்டைத் தெளிவாக்குகிறது.
- source_word: ἐκεῖ
  choice: அங்கே
  rationale: தீர்ப்பின் இடத்தை வாக்கியத்தின் தொடக்கத்தில் வலியுறுத்தும் கிரேக்க வரிசையை இயல்பாகப் பிரதிபலிக்கிறது.
