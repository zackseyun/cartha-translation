  rationale: மூலத்தின் ஆண்பால் வடிவத்தையும் அதன் அதிர்ச்சியூட்டும் முரண்பாட்டையும் பாதுகாத்து, இது அரசுக்கு உரியவர்களாகக் கருதப்பட்டவர்களைக் குறிக்கும் இடியமொழி என்பதை வாசகருக்குத் தெளிவுபடுத்துகிறது.
