  source_fidelity: 'மூல கிரேக்கத்தின் செயல்வரிசை துல்லியமாகக் காக்கப்பட்டுள்ளது: சீடர்கள் இயேசுவிடம் வந்து, அவரைத் தூக்கத்திலிருந்து எழுப்பி, வேண்டுகோள் விடுக்கிறார்கள். σῶσον என்பதற்குச் சூழலுக்கு ஏற்றவாறு ‘எங்களைக் காப்பாற்றுங்கள்’ என்றும், ἀπολλύμεθα என்பதற்கு நிகழ்கால அவசர உணர்வுடன் ‘நாங்கள் அழிந்துபோகிறோம்’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘எங்களை’ என்பது கிரேக்க வினையில் வெளிப்படையாக இல்லாவிட்டாலும் சூழலாலும் அடுத்த வினையாலும் தெளிவாகக் குறிக்கப்படுவதால் தமிழில் சேர்த்தல் நியாயமானது.'
  naturalness: ‘அவர்கள் அவரிடம் வந்து அவரை எழுப்பி, … என்றார்கள்’ என்பது நவீனத் தரத் தமிழில் இயல்பான, தெளிவான தொடராக உள்ளது. ‘ஆண்டவரே’ என்ற மரியாதைமிக்க அழைப்பும் ‘காப்பாற்றுங்கள்’ என்ற வேண்டுகோளும் தமிழின் உரிய மரியாதை நிலையைப் பேணுகின்றன. ‘அழிந்துபோகிறோம்’ உடனடியான பேராபத்து உணர்வை நன்றாக வெளிப்படுத்துகிறது.
  terminology: Κύριε என்பதற்கு ‘ஆண்டவரே’ என்பது பொருத்தமானது; இச்சொல்லின் மரியாதை மற்றும் விரிவான கிறிஸ்துவியல் சாத்தியத்தைத் தீர்மானமாகக் குறுக்குவதில்லை. σῶσον-க்கு ‘காப்பாற்றுங்கள்’ என்பது இங்குள்ள புயல்-ஆபத்துச் சூழலில் துல்லியமானது. அடிக்குறிப்பில் ‘மீட்டருளுங்கள்’ என்ற மாற்று வாசகம், உடனடி விடுதலையையும் பரந்த ‘மீட்பு’ பொருளையும் வாசகருக்குத் தெரிவிக்கிறது.
