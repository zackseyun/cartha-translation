source:
  edition: SBLGNT
  text: καὶ ⸀προσελθόντες ἤγειραν αὐτὸν λέγοντες· Κύριε, ⸀σῶσον, ἀπολλύμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/025.yaml
  text: And they came and woke him[a], saying, “Lord, save us! We are perishing!”
translation:
  language: ta
  text: அவர்கள் அவரிடம் வந்து அவரை எழுப்பி, “ஆண்டவரே, எங்களைக் காப்பாற்றுங்கள்![a] நாங்கள் அழிந்துபோகிறோம்!” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்களை மீட்டருளுங்கள்.” σῶσον என்ற கிரேக்கக் கட்டளைவினை உடனடி ஆபத்திலிருந்து காப்பாற்றுவதையும், விரிவான பொருளில் மீட்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: அவர்கள் அவரிடம் வந்து
  rationale: இறந்தகாலப் பங்கேற்புவினை இயேசுவை நோக்கி அவர்கள் வந்ததைச் சுட்டுகிறது. தமிழில் இலக்கு இயல்பாகத் தெளிவுபடுத்தப்பட்டு, அடுத்த செயல் தொடராக இணைக்கப்படுகிறது.
- source_word: ἤγειραν
  choice: அவரை எழுப்பி
  rationale: ἐγείρω இங்கு தூங்கிக்கொண்டிருந்த ஒருவரை விழிக்கச் செய்வதைக் குறிக்கிறது; உயிர்த்தெழுதல் சார்ந்த பொருள் இங்கு வராது. சூழலில் ‘எழுப்பி’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: λέγοντες
  choice: என்றார்கள்
  rationale: அவர்களுடைய நேரடிப் பேச்சை அறிமுகப்படுத்தும் பங்கேற்புவினை தமிழில் இயல்பான நேரடிப் பேச்சு முடிவாக மாற்றப்பட்டுள்ளது; மூலத்தில் இல்லாத ‘கதறி’ போன்ற உணர்ச்சி விவரம் சேர்க்கப்படவில்லை.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: κύριος என்பதன் அழைப்புவேற்றுமையையும், மரியாதைமிக்க பட்டத்தின் பொருள் விரிவையும் ‘ஆண்டவரே’ தக்கவைக்கிறது; அதை வெறும் ‘போதகரே’ அல்லது ‘எஜமானே’ என்று குறுக்கவில்லை.
- source_word: σῶσον
  choice: எங்களைக் காப்பாற்றுங்கள்
  rationale: இந்த கட்டளைவடிவம் உடனடி ஆபத்திலிருந்து மீட்குமாறு வேண்டுவதைக் குறிக்கிறது. தமிழுக்கு தேவையான செயப்படுபொருள், தொடர்ந்து வரும் முதல் நபர் பன்மையான ‘நாங்கள் அழிந்துபோகிறோம்’ என்பதிலிருந்து வெளிப்படையாக அளிக்கப்படுகிறது.
- source_word: ἀπολλύμεθα
  choice: நாங்கள் அழிந்துபோகிறோம்
  rationale: நிகழ்கால வடிவம் நேரவிருக்கும் அழிவையும் மரண ஆபத்தின் தீவிரத்தையும் காட்டுகிறது. ‘அழிந்துபோகிறோம்’ என்பது வெறும் ‘சாகிறோம்’ என்பதைக் காட்டிலும் மூலச்சொல்லின் பொருள் விரிவைத் தக்கவைக்கிறது.
theological_decisions:
- issue: இயேசுவை நோக்கி κύριος என்ற பட்டத்தைப் பயன்படுத்துதல்
  choice: ஆண்டவரே
  alternative: எஜமானே
  rationale: இந்த அழைப்பு மரியாதைமிக்க அழைப்பிலிருந்து ஆழமான கிறிஸ்துவியல் பொருள்வரை தாங்கக்கூடும். ‘ஆண்டவரே’ அந்தப் பொருள் விரிவைத் தீர்மானித்து சுருக்காமல் காக்கிறது.
- issue: σῶσον என்பதில் மறைந்துள்ள செயப்படுபொருளை வெளிப்படுத்துதல்
  choice: எங்களைக் காப்பாற்றுங்கள்
  alternative: காப்பாற்றுங்கள்
  rationale: கிரேக்க வினையில் செயப்படுபொருள் வெளிப்படையாக இல்லாவிட்டாலும், அடுத்துள்ள ‘நாங்கள் அழிந்துபோகிறோம்’ என்பதும் சூழலும் ‘எங்களை’ என்பதைக் குழப்பமின்றி உணர்த்துகின்றன. இயல்பான தமிழுக்காக அது வெளிப்படுத்தப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும், வழிபாட்டு மரியாதையை இழக்காத வகையிலும் மொழியாக்கப்பட்டுள்ளது. ‘இரட்சியும்’ என்ற சிறப்புத் தெய்வவியல் சொல்லுக்கு பதிலாக, புயல் ஆபத்தின் உடனடிச் சூழலைத் தெளிவாகக் காட்டும் ‘காப்பாற்றுங்கள்’ பயன்படுத்தப்பட்டுள்ளது.
