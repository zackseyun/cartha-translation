  text: A large herd of pigs was feeding some distance away from them[a].
translation:
  language: ta
  text: அவர்களிடமிருந்து வெகு தொலைவில்[a], பல பன்றிகள் கொண்ட ஒரு மந்தை மேய்ந்துகொண்டிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்களிடமிருந்து தொலைவில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: இருந்தது
  rationale: ἦν என்பதன் இருப்பு/நிலைப் பொருளை வாக்கிய இறுதியில் இயல்பாக வெளிப்படுத்துகிறது. δέ மென்மையான கதைத் தொடர்புச்சொல்; இவ்வசனத்தில் தனிச் சொல்லாக மொழிபெயர்க்காமல், தொடரின் இயல்பான ஓட்டத்தில் விடப்பட்டுள்ளது.
- source_word: μακρὰν ἀπ’ αὐτῶν
  choice: அவர்களிடமிருந்து சற்றுத் தொலைவில்
  rationale: ἀπό குறிக்கும் விலகலை ‘அவர்களிடமிருந்து’ என்பதும், μακράν குறிக்கும் இடத்தொலைவை இயல்பான தமிழில் ‘சற்றுத் தொலைவில்’ என்பதும் தெரிவிக்கின்றன; ‘வெகுதொலைவில்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: ἀγέλη
  choice: மந்தை
  rationale: விலங்குகளின் கூட்டத்தைக் குறிக்கும் இயல்பான, பொதுவாகப் புரியும் தமிழ்ச்சொல்.
- source_word: χοίρων πολλῶν
  choice: ஏராளமான பன்றிகளைக் கொண்ட
  rationale: πολλῶν என்பதன் எண்ணிக்கைப் பொருளை ‘ஏராளமான’ எனத் தெளிவாகக் காத்து, χοίρων என்பதைக் ‘பன்றிகள்’ என நவீன தமிழில் வழங்குகிறது.
- source_word: βοσκομένη
  choice: மேய்ந்துகொண்டிருந்தது
  rationale: நிகழ்ந்துகொண்டிருந்த உணவுண்ணும் செயலை இயல்பான தமிழில் குறிக்கிறது; ‘மேய்க்கப்பட்டுக்கொண்டிருந்தது’ என்று மொழிபெயர்த்தால் மூலத்தில் வெளிப்படையாக இல்லாத மேய்ப்பவரின் செயலை முன்னிறுத்திவிடும்.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டுள்ளது. கிரேக்கச் சொல்வரிசையை இயந்திரமாகப் பின்பற்றாமல் இயல்பான தமிழ் வாக்கிய அமைப்பு பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் இடத்தொலைவு குறித்த நெகிழ்வும் அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
