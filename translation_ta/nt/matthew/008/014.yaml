id: MAT.8.14
reference: Matthew 8:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν Πέτρου εἶδεν τὴν πενθερὰν αὐτοῦ βεβλημένην καὶ πυρέσσουσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/014.yaml
  text: And when Jesus came into Peter’s house[b][a], he saw his mother-in-law lying down and having a fever.
translation:
  language: ta
  text: இயேசு பேதுருவின் வீட்டிற்குள் வந்தபோது, பேதுருவின் மாமியார் படுத்துக்கிடந்து[a] காய்ச்சலுடன் இருப்பதைக் கண்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நோயுற்றுப் படுக்கையில் கிடந்து.’ கிரேக்கத்தில் அவர் படுத்த நிலையில் இருந்ததும் காய்ச்சலுடன் இருந்ததும் சொல்லப்படுகிறது; ‘படுக்கையில்’ என்பது சூழலால் உணரப்பட்டாலும் வெளிப்படையாகக் கூறப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: வந்தபோது
  rationale: இறந்தகாலப் பங்கேற்புவினையின் காலத் தொடர்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: οἰκίαν Πέτρου
  choice: பேதுருவின் வீட்டிற்குள்
  rationale: உடைமைத் தொடர்பையும் εἰς என்பதன் ‘உள்ளே’ என்ற திசை உணர்வையும் தெளிவாகக் காட்டுகிறது.
- source_word: πενθερὰν αὐτοῦ
  choice: பேதுருவின் மாமியார்
  rationale: πενθερά என்பதற்கு ‘மாமியார்’ நேரான தமிழ்ச் சொல். αὐτοῦ என்பது இயேசுவை அல்ல, பேதுருவைக் குறிக்கிறது என்பதைத் தெளிவாக்க பெயர் மீண்டும் பயன்படுத்தப்பட்டுள்ளது.
- source_word: βεβλημένην
  choice: படுத்துக்கிடந்து
  rationale: நோயின் காரணமாகப் படுத்த நிலையில் இருந்ததைக் காட்டுகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘படுக்கையில்’ என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: πυρέσσουσαν
  choice: காய்ச்சலுடன் இருப்பதை
  rationale: தொடர்ந்து நிலவிய காய்ச்சல் நிலையை நேரடியாகவும் மிகைப்படுத்தாமலும் தெரிவிக்கிறது.
theological_decisions:
- issue: αὐτοῦ என்ற பிரதிப்பெயர் யாரைக் குறிக்கிறது?
  choice: அந்தப் பெண் பேதுருவின் மாமியார் என்று வெளிப்படையாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அவருடைய மாமியார்’ என்று மொழிபெயர்த்தால் தமிழில் அது இயேசுவைக் குறிப்பதாகத் தவறாகப் புரிந்துகொள்ளப்படலாம்.
  rationale: வாக்கிய அமைப்பிலும் சூழலிலும் αὐτοῦ என்பது பேதுருவைக் குறிக்கிறது. இதற்கு அப்பாற்பட்ட திருமண அல்லது கோட்பாட்டுத் தீர்மானம் எதுவும் உரையில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, தெளிவான, மரியாதைக்குரிய நடை பயன்படுத்தப்பட்டுள்ளது. ‘பேதுருவின்’ என்ற சொல் மீண்டும் வருவது சிறிது மீளுரையாக இருந்தாலும், பிரதிப்பெயரின் சுட்டுப்பொருளைத் தவறாகப் புரிந்துகொள்ளாமல் பாதுகாக்கிறது.
