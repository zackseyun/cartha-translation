id: MAT.8.2
reference: Matthew 8:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ λεπρὸς ⸀προσελθὼν προσεκύνει αὐτῷ λέγων· Κύριε, ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/002.yaml
  text: And behold[a], a leper came and bowed down before him, saying, “Lord, if you are willing, you are able to cleanse me.”
translation:
  language: ta
  text: இதோ, தொழுநோயுள்ள ஒருவர் அவரிடம் வந்து, அவர்முன் பணிந்து[a], “ஆண்டவரே, உமக்கு விருப்பமானால், என்னைத் தூய்மையாக்க உம்மால் முடியும்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரை வழிபட்டு”; கிரேக்க வினைச்சொல் சூழலுக்கேற்ப பணிந்து வணங்குதல், மரியாதை செலுத்துதல், அல்லது வழிபடுதல் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கதையில் கவனத்தை ஈர்த்து நிகழ்வுக்கு உயிரோட்டம் தரும் இடைச்சொல்லின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: λεπρὸς
  choice: தொழுநோயுள்ள ஒருவர்
  rationale: தோல் நோயால் பாதிக்கப்பட்ட ஒருவரைக் குறிக்கும் பெயராக்கப்பட்ட அடைமொழியை, அவரை நோயுடன் மட்டுமே அடையாளப்படுத்தாமல் நவீன தமிழில் இயல்பாகத் தருகிறது; மரபான நோய்ப்பெயரையும் காக்கிறது.
- source_word: προσελθὼν
  choice: அவரிடம் வந்து
  rationale: இயேசுவை நோக்கி அணுகிய செயலைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: προσεκύνει
  choice: அவர்முன் பணிந்து
  rationale: இச்சொல் பணிதல், மரியாதை செலுத்துதல், வழிபடுதல் ஆகிய பொருள் எல்லைகளைக் கொண்டது. உடல் சார்ந்த மரியாதைச் செயலைத் தெளிவுபடுத்தி, அதன் முழுத் தெய்வியல் பொருளைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: மரியாதையான அதிகார அழைப்பையும் சாத்தியமான கிறிஸ்துவியல் ஆழத்தையும் ஒருங்கே காக்கும் நிலையான தமிழ் சொல்.
- source_word: ἐὰν θέλῃς
  choice: உமக்கு விருப்பமானால்
  rationale: இயேசுவின் சித்தத்துக்குட்பட்ட நிபந்தனையான வேண்டுகோளை இயல்பாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: δύνασαί
  choice: உம்மால் முடியும்
  rationale: திறன் அல்லது வல்லமையை நேரடியாகக் குறிக்கும் வினையின் பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: καθαρίσαι
  choice: என்னைத் தூய்மையாக்க
  rationale: இங்கு உடல் குணமடைதலோடு சடங்குசார் தூய்மையும் தொடர்புடையதால், பொதுவான ‘குணமாக்க’ என்பதைவிட மூலத்தின் தூய்மைப்படுத்தும் பொருளைத் தக்கவைக்கிறது.
theological_decisions:
- issue: இயேசுவை நோக்கிய προσκυνέω என்பதன் பொருள்
  choice: அவர்முன் பணிந்து
  alternative: அவரை வழிபட்டு
  rationale: சூழலில் மரியாதையும் உடல் பணிதலும் தெளிவாக உள்ளன; ஆனால் ‘வழிபட்டார்’ என்று மட்டும் மொழிபெயர்ப்பது சொல்லின் பொருள் எல்லையை முன்கூட்டியே தெய்வியல் ரீதியாக முடிவுசெய்யக்கூடும். முதன்மை உரை உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
- issue: Κύριε என்ற அழைப்பின் பொருள் எல்லை
  choice: ஆண்டவரே
  alternative: ஐயா
  rationale: இச்சூழலில் மரியாதையான அழைப்பாக இருக்கக்கூடியதோடு கிறிஸ்துவியல் நிறையும் கொண்டிருக்கலாம்; ‘ஆண்டவரே’ இரு சாத்தியங்களையும் ‘ஐயா’ என்பதைக் காட்டிலும் நன்றாகக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான வேதாகம நடையுடன் பொதுவாசகர்களுக்கு எளிதில் புரியும் சொற்றொடர்கள் பயன்படுத்தப்பட்டுள்ளன. இயேசுவை நோக்கிய உரையில் மரியாதைப் பன்மை காக்கப்பட்டுள்ளது.
