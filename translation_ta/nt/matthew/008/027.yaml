  text: οἱ δὲ ἄνθρωποι ἐθαύμασαν λέγοντες· Ποταπός ἐστιν οὗτος ὅτι καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα ⸂αὐτῷ ὑπακούουσιν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/027.yaml
  text: And the men marveled[a], saying, “What sort of man is this, that even the winds and the sea obey him?”
translation:
  language: ta
  text: அந்த ஆண்கள் வியந்து, “இவர் எப்படிப்பட்டவர்[a], காற்றுகளும் கடலும் கூட இவருக்குக் கீழ்ப்படிகின்றனவே?” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவர் எத்தகையவர்?” கிரேக்க வெளிப்பாடு இவர் எத்தகைய தன்மையுள்ளவர் அல்லது எந்த வகையானவர் என்று வினவுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄνθρωποι
  choice: அந்த மனிதர்கள்
  rationale: ἄνθρωποι இச்சூழலில் படகிலிருந்த ஆண்களைக் குறிக்கிறது. ‘அந்த மனிதர்கள்’ என்பது பாலினக் குறிப்பையும் கதையின் சூழலையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἐθαύμασαν
  choice: வியந்து
  rationale: இச்சொல் அவர்களுக்கு ஏற்பட்ட ஆச்சரியமும் வியப்பும் கலந்த உடனடி எதிர்வினையைத் தெரிவிக்கிறது; தமிழ் கதைநடையில் ‘வியந்து’ இயல்பாக உள்ளது.
- source_word: λέγοντες
  choice: … என்றார்கள்
  rationale: கிரேக்கப் பங்கேற்புவினையைத் தமிழில் இயல்பான மேற்கோள் அமைப்பாக மாற்றி, அவர்கள் வியந்தபடியே கூறிய தொடர்பைப் பாதுகாக்கிறது.
- source_word: Ποταπός
  choice: எப்படிப்பட்டவர்
  rationale: ஒருவரின் வகை அல்லது தன்மையைப் பற்றிய வியப்பான கேள்வியை இது வெளிப்படுத்துகிறது; ‘எப்படிப்பட்டவர்’ நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: οὗτος
  choice: இவர்
  rationale: அருகில் இருப்பவரைச் சுட்டும் οὗτος என்பதையும், இயேசுவைக் குறிக்கும் மரியாதையான தமிழ் ஒருமையையும் ‘இவர்’ வழங்குகிறது.
- source_word: ὅτι
  choice: …, …வே?
  rationale: இங்கு ὅτι கேள்விக்கான காரணத்தையோ அடிப்படையையோ அறிமுகப்படுத்துகிறது. தமிழில் தொடர்வாக்கியமும் ‘வே’ என்னும் வலியுறுத்தலும் அந்த உறவை இயல்பாகத் தருகின்றன.
- source_word: καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα
  choice: காற்றுகளும் கடலும் கூட
  rationale: மீண்டும் வரும் καί தரும் விரிவையும் வலியுறுத்தலையும் ‘…உம் …உம் கூட’ என்ற அமைப்பு வெளிப்படுத்துகிறது.
- source_word: αὐτῷ ὑπακούουσιν
  choice: இவருக்குக் கீழ்ப்படிகின்றன
  rationale: ὑπακούω அதிகாரத்திற்கு இணங்குதல் அல்லது கீழ்ப்படிதல் என்பதைக் குறிக்கிறது. இயற்கைச் சக்திகள்மீதான தனிப்பட்ட அதிகாரத்தை ‘கீழ்ப்படிகின்றன’ தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: சீடர்களின் கேள்வியிலுள்ள கிறிஸ்துவியல் வலிமை
  choice: இயேசுவின் அடையாளத்தை விளக்கிச் சேர்க்காமல், படைப்பின்மீதான அவரது அசாதாரண அதிகாரத்தை உணர்த்தும் கேள்வியாகவே மொழிபெயர்க்கப்பட்டது.
  alternative: ‘இவர் யாராக இருக்க முடியும்?’ போன்ற விளக்கமான சொற்களைச் சேர்த்து உட்கருத்தை வெளிப்படையாக்குதல்.
  rationale: மூலவசனம் இயேசுவின் அதிகாரத்தின் உட்கருத்தை வலுவாகக் காட்டினாலும், அதற்கான இறையியல் முடிவை நேரடியாகக் கூறவில்லை. மொழிபெயர்ப்பு அந்த வியப்பையும் தீர்க்கப்படாத கேள்வியையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் கதைநடைக்கேற்ற கண்ணியமான தொனியிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கீழ்ப்படிகின்றனவே’ என்பது வியப்பையும் கேள்வியின் வலியுறுத்தலையும் இயல்பாக வெளிப்படுத்துகிறது.
