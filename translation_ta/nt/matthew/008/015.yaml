source:
  edition: SBLGNT
  text: καὶ ἥψατο τῆς χειρὸς αὐτῆς, καὶ ἀφῆκεν αὐτὴν ὁ πυρετός, καὶ ἠγέρθη καὶ διηκόνει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/015.yaml
  text: And he touched her hand, and the fever left her, and she got up and began serving him.
translation:
  language: ta
  text: அவர் அவளுடைய கையைத் தொட்டார்; காய்ச்சல் அவளைவிட்டு நீங்கியது. அவள் எழுந்து அவருக்குப் பணிவிடை செய்துகொண்டிருந்தாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருக்குப் பணிவிடை செய்யத் தொடங்கினாள்.” கிரேக்க முற்றுப்பெறா காலம் தொடர்ந்த செயலைக் குறிக்கலாம்; செயல் தொடங்கியதையும் உணர்த்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥψατο
  choice: தொட்டார்
  rationale: இச்சூழலில் ἅπτομαι என்பது தொடுதல் அல்லது உடல்தொடர்பு கொள்ளுதல் என்று பொருள்படும்; செயலை மிகைப்படுத்தாமல் இயல்பாகத் தெரிவிக்கிறது.
- source_word: τῆς χειρὸς αὐτῆς
  choice: அவளுடைய கையை
  rationale: χείρ என்பதன் இயல்பான பொருள் ‘கை.’ ἅπτομαι உடன் வரும் கிரேக்க வேற்றுமையைத் தமிழில் நேர்ச்செயப்படுபொருளாக வழங்குவது இயல்பானது.
- source_word: ἀφῆκεν αὐτὴν ὁ πυρετός
  choice: காய்ச்சல் அவளைவிட்டு நீங்கியது
  rationale: ἀφίημι இங்கு ‘விட்டுச் செல்லுதல்/நீங்குதல்’ எனப் பொருள்படும். இத்தேர்வு மூலத்தின் காய்ச்சலை எழுவாயாகக் காட்டும் அமைப்பையும் காக்கிறது.
- source_word: πυρετός
  choice: காய்ச்சல்
  rationale: இச்சொல் நேரடியாகக் காய்ச்சலைக் குறிக்கிறது; ‘நோய்’ போன்ற விளக்க விரிவாக்கம் தேவையில்லை.
- source_word: ἠγέρθη
  choice: அவள் எழுந்து
  rationale: ἐγείρω என்பதன் செயலப்பாட்டு வடிவம் இங்கு தன்னியக்கப் பொருளில், குணமடைந்தபின் அவள் எழுந்ததைச் சொல்கிறது.
- source_word: διηκόνει αὐτῷ
  choice: அவருக்குப் பணிவிடை செய்துகொண்டிருந்தாள்
  rationale: διακονέω என்பது சேவை அல்லது பணிவிடை செய்தலைக் குறிக்கிறது. இறந்தகால முற்றுப்பெறா வடிவத்தின் தொடர்நிலைத் தன்மையை ‘செய்துகொண்டிருந்தாள்’ இயல்பாக வெளிப்படுத்துகிறது; செயல் தொடங்கியதாக மட்டும் கட்டுப்படுத்தாது.
theological_decisions:
- issue: ἠγέρθη என்பதற்கு உயிர்த்தெழுதல் சார்ந்த பொருளை மிகையாக ஏற்றுதல்
  choice: அவள் எழுந்து
  alternative: அவள் எழுப்பப்பட்டு
  rationale: உடனடிச் சூழல் குணமடைந்த பெண் படுக்கையிலிருந்து எழுவதைச் சொல்கிறது. உயிர்த்தெழுதல் சார்ந்த இறையியல் கருத்தை இங்கு மொழிபெயர்ப்பு இறக்குமதி செய்யக்கூடாது.
- issue: διηκόνει என்ற முற்றுப்பெறா வடிவத்தைத் தொடக்கநிலையாக மட்டும் விளக்குதல்
  choice: பணிவிடை செய்துகொண்டிருந்தாள்
  alternative: பணிவிடை செய்யத் தொடங்கினாள்
  rationale: கிரேக்க முற்றுப்பெறா காலம் தொடரும் செயலைக் குறிப்பிடலாம்; தொடக்கநிலைப் பொருளும் சாத்தியம். பிரதான உரை தொடர்நிலையைப் பாதுகாக்கிறது; மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட உரை. ‘பணிவிடை’ வீட்டுச் சூழலிலான சேவையை இயல்பாகக் குறிக்கிறது. மூன்று கிரேக்க καί தொடர்களைத் தமிழில் வாசிக்க ஏற்றவாறு அரைப்புள்ளி மற்றும் முற்றுப்புள்ளியால் அமைத்துள்ளோம்.
