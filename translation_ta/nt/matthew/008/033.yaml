  terminology: ‘பேய் பிடித்திருந்தவர்கள்’ என்பது δαιμονιζομένων என்பதற்கான நிலையான, பொதுவாகப் புரியக்கூடிய தமிழ் வேதாகம வழக்காகும். மூலத்தில் இல்லாத கோட்பாட்டு நுணுக்கங்களை இது திணிக்கவில்லை. ‘அறிவித்தார்கள்’ ἀπήγγειλαν என்பதற்குச் சரியான கண்ணியமான கதைநடைத் தேர்வு.
