  source_fidelity: மூல கிரேக்கத்துக்கு உரியது. οἱ δὲ βόσκοντες என்பது முன்சூழலில் உள்ள பன்றிக்கூட்டத்தை மேய்த்தவர்களைக் குறிக்கிறது; ‘பன்றிகளை’ என்பது பாதுகாப்பான சூழல்சார் வெளிப்படுத்தல். ἔφυγον, ἀπελθόντες εἰς τὴν πόλιν, ἀπήγγειλαν πάντα ஆகியவை ‘தப்பியோடி, நகரத்திற்குச் சென்று, எல்லாவற்றையும் அறிவித்தார்கள்’ எனத் துல்லியமாகக் காக்கப்பட்டுள்ளன. καὶ τὰ τῶν δαιμονιζομένων என்பதன் சூழல்சார் பொருளான அவர்களுக்கு நடந்தவற்றையும் சேர்த்துச் செய்தியிட்டனர் என்பதும் சரியாக உள்ளது.
