id: MAT.8.33
reference: Matthew 8:33
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἱ δὲ βόσκοντες ἔφυγον, καὶ ἀπελθόντες εἰς τὴν πόλιν ἀπήγγειλαν πάντα καὶ τὰ τῶν δαιμονιζομένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/033.yaml
  text: Then the herdsmen fled[a], and going away into the city, they reported everything, including what had happened to the demon-possessed men.
translation:
  language: ta
  text: அப்போது பன்றிகளை மேய்த்துக்கொண்டிருந்தவர்கள் தப்பியோடி, நகரத்திற்குச் சென்று எல்லாவற்றையும்—பேய் பிடித்திருந்தவர்களுக்கு நடந்தவற்றையும்—அறிவித்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ βόσκοντες
  choice: அப்போது பன்றிகளை மேய்த்துக்கொண்டிருந்தவர்கள்
  rationale: βόσκοντες என்பது சொல்லர்த்தமாக ‘மேய்த்துக்கொண்டிருந்தவர்கள்’; முந்தைய சூழலில் பன்றிகள் குறிப்பிடப்படுவதால், தமிழில் யாரை மேய்த்தார்கள் என்பது தெளிவாக இருக்க ‘பன்றிகளை’ சேர்க்கப்பட்டது. δέ கதைத் தொடர்ச்சியைக் காட்ட ‘அப்போது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ἔφυγον
  choice: தப்பியோடி
  rationale: φεύγω இங்கு அச்சத்தால் ஓடிப்போவதைக் குறிக்கிறது; ‘தப்பியோடி’ என்பது இயல்பான, உயிரோட்டமுள்ள தமிழ் நடை.
- source_word: ἀπελθόντες εἰς τὴν πόλιν
  choice: நகரத்திற்குச் சென்று
  rationale: இறந்தகாலப் பங்கேற்பு வினையைத் தமிழில் இயல்பான தொடர்வினை அமைப்பில் வழங்குகிறது; εἰς குறிக்கும் நகரத்தை நோக்கிய இயக்கமும் காக்கப்படுகிறது.
- source_word: ἀπήγγειλαν πάντα
  choice: எல்லாவற்றையும் … அறிவித்தார்கள்
  rationale: ἀπαγγέλλω என்பது செய்தியை எடுத்துரைத்தல் அல்லது அறிவித்தலைக் குறிக்கிறது; πάντα என்பதன் முழுமையான பொருளை ‘எல்லாவற்றையும்’ காக்கிறது.
- source_word: καὶ τὰ τῶν δαιμονιζομένων
  choice: பேய் பிடித்திருந்தவர்களுக்கு நடந்தவற்றையும்
  rationale: கிரேக்கத்தில் சொல்லர்த்தமாக ‘பேய் பிடித்திருந்தவர்களைச் சார்ந்தவற்றையும்’ என்று உள்ளது. சூழலில் அவர்களுக்கு நடந்த சம்பவங்களை இது குறிக்கிறது என்பதால், இயல்பான தமிழில் இவ்வாறு வழங்கப்பட்டது; καί-யின் சேர்க்கைப் பொருள் ‘-யும்’ மூலம் காக்கப்பட்டது.
- source_word: δαιμονιζομένων
  choice: பேய் பிடித்திருந்தவர்கள்
  rationale: இது தீய ஆவிகளின் ஆளுகையில் இருந்தவர்களைக் குறிக்கும் வழக்கமான, பொதுமக்கள் புரிந்துகொள்ளக்கூடிய தமிழ் சொற்றொடர்; மூலத்தை மீறிய கோட்பாட்டு நுண்வேறுபாடுகள் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: δαιμονιζομένων என்பதன் மொழிபெயர்ப்பு
  choice: பேய் பிடித்திருந்தவர்கள்
  alternative: பேய்களால் துன்புறுத்தப்பட்டவர்கள்
  rationale: மூலச் சொல் உண்மையான பேய் சார்ந்த ஆளுகை அல்லது பாதிப்பைக் குறிக்கிறது; அதன் சரியான தன்மையைத் தேவையின்றி வரையறுக்காமல், தமிழ் வேதாகம மற்றும் பொதுப் பயன்பாட்டில் தெளிவாகப் புரியும் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான கதைநடை. கிரேக்கத்தின் சுருக்கமான ஒருங்கிணைப்பை இயல்பான தமிழ் தொடர்வினைகளால் வெளிப்படுத்துகிறது.
