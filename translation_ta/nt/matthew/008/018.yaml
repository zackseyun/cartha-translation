source:
  edition: SBLGNT
  text: Ἰδὼν δὲ ὁ Ἰησοῦς ⸂πολλοὺς ὄχλους⸃ περὶ αὐτὸν ἐκέλευσεν ἀπελθεῖν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/018.yaml
  text: When Jesus saw many crowds around him, he gave orders to go to the other side.
translation:
  language: ta
  text: இயேசு தம்மைச் சுற்றிலும் பல மக்கள் கூட்டங்களைக் கண்டபோது, மறுகரைக்குப் போகும்படி கட்டளையிட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὺς ὄχλους
  choice: பல மக்கள் கூட்டங்கள்
  rationale: மூலத்தில் ‘கூட்டங்கள்’ என்பது பன்மையில் இருப்பதைப் பாதுகாக்கிறது; அதேவேளையில் நவீன தமிழில் இயல்பாகப் புரிகிறது.
- source_word: περὶ αὐτόν
  choice: தம்மைச் சுற்றிலும்
  rationale: இயேசுவையே சுட்டும் தன்னிலைப் பதிலிப்பெயருடன் ‘அவரைச் சுற்றி’ என்ற இடப்பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐκέλευσεν
  choice: கட்டளையிட்டார்
  rationale: வெறும் வேண்டுகோள் அல்ல, அதிகாரத்துடன் ஆணையிடுதல் என்ற வினையின் வலிமையைத் தக்கவைக்கிறது.
- source_word: ἀπελθεῖν εἰς τὸ πέραν
  choice: மறுகரைக்குப் போகும்படி
  rationale: நீர்நிலையின் எதிர்ப்புறத்தைக் குறிக்கும் τὸ πέραν என்பதற்கு ‘மறுகரை’ இயல்பான இணை; ἀπελθεῖν என்பதன் நகர்வை ‘போக’ தெளிவாகத் தருகிறது.
- source_word: δὲ
  choice: தனி சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது முதன்மையாக உரையோட்டத்தை இணைக்கும் இடைச்சொல்; ‘இப்போது’ அல்லது வலுவான எதிர்மறைத் தொடர்பைச் சேர்ப்பது மூலத்தில் இல்லாத நுண்ணர்த்தத்தை உருவாக்கும்.
theological_decisions:
- issue: கட்டளை யாருக்குக் கொடுக்கப்பட்டது என்பது
  choice: ‘போகும்படி கட்டளையிட்டார்’ என்று பெறுநரை வெளிப்படையாகச் சேர்க்காமல் வைக்கப்பட்டது
  alternative: ‘சீடர்களை மறுகரைக்குப் போகும்படி கட்டளையிட்டார்’
  rationale: இந்த வசனத்தின் கிரேக்க உரை கட்டளையின் பெறுநரை வெளிப்படையாகக் குறிப்பிடவில்லை. சூழலால் சீடர்கள் எனப் புரிந்துகொள்ள முடிந்தாலும், அதை இவ்வசனத்திற்குள் சேர்க்காமல் மூலத்தின் மறைமுகத்தன்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘பல மக்கள் கூட்டங்கள்’ என்ற சற்றே அசாதாரணமான பன்மை, மூல கிரேக்கத்தின் πολλοὺς ὄχλους வடிவை நோக்கத்துடன் பிரதிபலிக்கிறது.
