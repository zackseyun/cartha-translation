    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் உரையாடல் குறியீட்டின் வலிமையை இயல்பான, மரியாதையான நவீன தமிழில் காக்கிறது.
- source_word: ἀναβαίνομεν
  choice: போய்க்கொண்டிருக்கிறோம்
  rationale: நிகழ்காலத்தில் நடைபெறும் பயணத்தை இயல்பாகத் தெரிவிக்கிறது. எருசலேமுக்குச் ‘செல்வது’ உயரேறுதல் எனச் சொல்லப்படும் மூலமொழி நுணுக்கம் தமிழில் ‘மேலே போகிறோம்’ என மொழிபெயர்க்கப்பட்டால் தவறான புவியியல் எண்ணத்தை உருவாக்கக்கூடும்.
- source_word: Ἱεροσόλυμα
  choice: எருசலேம்
  rationale: தமிழில் நிலைபெற்றுள்ள இடப்பெயர் வடிவம்.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மானிடமகன்
  rationale: நற்செய்தி நூல்களில் இயேசு தம்மைக் குறிக்கப் பயன்படுத்தும் தனித்துவமான பட்டப்பெயரைச் சுருக்கமாகவும் மரபை மதித்தும் காக்கிறது; தானியேல் 7 பின்னணியையும் மறைக்கவில்லை.
- source_word: παραδοθήσεται
  choice: ஒப்படைக்கப்படுவார்
  rationale: ஒருவரை மற்றவர்களின் அதிகாரத்திற்குள் கொடுத்துவிடும் எதிர்காலச் செயப்பாட்டு வினையின் பரந்த பொருளைக் காக்கிறது; இதை ‘காட்டிக்கொடுக்கப்படுவார்’ என்று குறுக்கி யூதாசின் துரோகத்தை மட்டும் முன்கூட்டியே வரையறுக்கவில்லை.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: தலைமைக் குருமாரிடம்
  rationale: ஒரே தலைமைக் குருவை அல்லாமல் முன்னணி ஆசாரிய அதிகாரிகளைக் குறிக்கும் பன்மையைத் தெளிவாக வழங்குகிறது.
- source_word: γραμματεῦσιν
  choice: மறைநூல் அறிஞர்கள்
  rationale: வேத எழுத்துக்களை நகலெடுத்து விளக்கிய சமயச் சட்ட அறிஞர்களைக் குறிக்கும் சொல்லை சாதாரண வாசகருக்குப் புரியும் தமிழில் வழங்குகிறது; வெறும் எழுதுநர்கள் என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: κατακρινοῦσιν αὐτὸν θανάτῳ
  choice: அவர்கள் அவருக்கு மரணத் தண்டனை விதிப்பார்கள்
  rationale: குற்றத் தீர்ப்பின் விளைவாக மரணத்தைத் தண்டனையாக விதிக்கும் நீதித்துறைப் பொருளை இயல்பான தமிழில் துல்லியமாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου என்ற கிறிஸ்துவியல் பட்டப்பெயர்
  choice: மானிடமகன்
  alternative: மனிதகுமாரன்; மனிதன்
  rationale: இயேசுவின் தனித்துவமான தற்குறிப்பையும் தானியேல் 7:13–14-இன் சாத்தியமான எதிரொலியையும் காக்கிறது; இதை பொதுவான ‘மனிதன்’ என்ற பொருளாகத் தட்டையாக்கவில்லை.
- issue: παραδοθήσεται என்பதன் பொருள் வரம்பு
  choice: ஒப்படைக்கப்படுவார்
  alternative: காட்டிக்கொடுக்கப்படுவார்
  rationale: இவ்வசனத்தின் கிரேக்கம் குறிப்பிடும் பகைவர்களின் அதிகாரத்திற்குள் ஒப்படைக்கப்படுதலைக் காக்கிறது; குறிப்பிட்ட துரோகியை அல்லது செயல் முறையை வசனத்திற்குள் இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான நேரடி உரை. ‘மறைநூல் அறிஞர்கள்’ என்பது ‘வேதபாரகர்’ என்ற பழைய அல்லது குழுவுக்கே உரிய சொல்லை விட பொதுவாசகருக்கு தெளிவானது. மூலத்தில் உள்ள ஒரே தொடர்வாக்கியம் தமிழின் இயல்புக்கும் வாசிப்புத் தெளிவுக்கும் ஏற்ப மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
