base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/018.yaml
  text: Look[a], we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and scribes, and they will condemn him to death[c][b],
translation:
  language: ta
  text: “இதோ[a], நாம் எருசலேமுக்கு ஏறிச் செல்கிறோம். மானிடமகன்[b] தலைமைக் குருமாரிடமும் மறைநூல் அறிஞர்களிடமும் ஒப்படைக்கப்படுவார்[c]. அவர்கள் அவருக்கு மரணத் தண்டனை விதிப்பார்கள்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கவனியுங்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “மானிடமகன்” என்பது இயேசு தம்மைக் குறிக்கத் தனிச்சிறப்பாகப் பயன்படுத்திய பெயர்; இது தானியேல் 7:13–14-ஐ எதிரொலிக்கலாம்.
    reason: cross_reference
  - marker: c
