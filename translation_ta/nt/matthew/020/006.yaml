translation_notes:
  register: நவீன தரநிலைத் தமிழில் இயல்பும் கண்ணியமும் பேணப்பட்டுள்ளன. மூலத்தின் நேரக் கணக்கு பிரதான உரையில் பாதுகாக்கப்பட்டு, அதன் நவீன நேர ஒப்புமை அடிக்குறிப்பில் தரப்பட்டுள்ளது. ἀργοί என்பது ஒழுக்கக் குற்றச்சாட்டாக மிகைப்படுத்தப்படாமல், சூழலில் ‘வேலை செய்யாமல்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
