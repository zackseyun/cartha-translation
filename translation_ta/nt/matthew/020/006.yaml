source:
  edition: SBLGNT
  text: περὶ δὲ τὴν ⸀ἑνδεκάτην ἐξελθὼν εὗρεν ἄλλους ⸀ἑστῶτας, καὶ λέγει αὐτοῖς· Τί ὧδε ἑστήκατε ὅλην τὴν ἡμέραν ἀργοί;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/006.yaml
  text: And about the eleventh hour he went out and found others standing there[a], and he says to them[b], ‘Why have you been standing here idle all day?’
translation:
  language: ta
  text: பதினொன்றாம் மணிநேர வாக்கில் அவர் வெளியே சென்று, மற்ற சிலர் அங்கே நின்றுகொண்டிருப்பதைக் கண்டார்.[a] அவர்களிடம், “நாள் முழுவதும் ஏன் இங்கே வேலை செய்யாமல் நின்றுகொண்டிருக்கிறீர்கள்?” என்று கேட்கிறார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பதினொரு மணியளவில்.” நேரடியாக, “பதினொன்றாம் மணிநேரத்தைச் சுற்றி.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கேட்டார்.” கிரேக்கத்தில் கடந்தகால நிகழ்வை நிகழ்கால வினையால் விவரிக்கும் வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τὴν ἑνδεκάτην
  choice: பதினொன்றாம் மணிநேரத்தை நெருங்கியபோது
  rationale: περί + accusative இங்கு தோராயமான நேரத்தைக் குறிக்கிறது. யூதர்களின் பகல்நேரக் கணக்கை நவீன கடிகார நேரமாக மாற்றாமல், மூலத்தின் ‘பதினொன்றாம் மணிநேரம்’ என்ற அமைப்பைப் பேணுகிறது.
- source_word: ἐξελθὼν
  choice: அவர் வெளியே சென்று
  rationale: Aorist participle முதன்மை வினையான εὗρεν-க்கு முன்னான செயலைக் குறிக்கிறது; தமிழில் இயல்பான வினையெச்சத் தொடரால் வரிசை தெளிவாகிறது.
- source_word: εὗρεν
  choice: கண்டார்
  rationale: εὑρίσκω என்பதற்கான நேரடியான, இயல்பான தமிழ் இணை.
- source_word: ἄλλους
  choice: வேறு சிலர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் ἄλλους என்பதைக் பாலினத்தைத் தேவையின்றிக் குறிப்பிடாமல் இயல்பாக அளிக்கிறது.
- source_word: ἑστῶτας
  choice: நின்றுகொண்டிருப்பதை
  rationale: Perfect participle தொடரும் நிலையை உணர்த்துவதால், ‘நின்றுகொண்டிரு’ என்ற வடிவம் அதன் நீடித்த தன்மையை வெளிப்படுத்துகிறது.
- source_word: καὶ λέγει αὐτοῖς
  choice: அவர்களிடம் … என்று கேட்கிறார்
  rationale: λέγει என்ற வரலாற்று நிகழ்காலத்தை ‘கேட்கிறார்’ என நிகழ்காலத்திலேயே பேணி, தொடர்ந்து வரும் கேள்வியுடன் இயல்பாக இணைக்கிறது.
- source_word: Τί
  choice: ஏன்
  rationale: இந்தக் கேள்வி அமைப்பில் τί என்பதன் இயல்பான பொருள் ‘ஏன்’ என்பதாகும்.
- source_word: ὧδε
  choice: இங்கே
  rationale: இடத்தைக் குறிக்கும் ὧδε என்பதற்கான நேரடியான தமிழ் இணை.
- source_word: ἑστήκατε
  choice: நின்றுகொண்டிருக்கிறீர்கள்
  rationale: Perfect வடிவம் இதுவரை நீடித்துவரும் நிலையைக் குறிக்கிறது; தமிழ் தொடர்நிலை வடிவம் இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὅλην τὴν ἡμέραν
  choice: நாள் முழுவதும்
  rationale: கால நீட்சியைக் குறிக்கும் சொற்றொடரின் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: ἀργοί
  choice: வேலை செய்யாமல்
  rationale: ἀργός என்பதன் ‘செயலற்ற, வேலை செய்யாத’ பொருளைச் சூழலுக்கேற்ற தெளிவான தமிழில் தருகிறது; ‘சோம்பலாக’ என்று கூறி குற்றப்பண்பைச் சேர்ப்பதையும், ‘வேலையில்லாமல்’ என்று கூறி வேலைவாய்ப்பின்மையைத் தீர்மானிப்பதையும் தவிர்க்கிறது.
