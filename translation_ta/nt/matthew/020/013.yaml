  source_fidelity: 'மூலக் கிரேக்கத்தின் முக்கிய கூறுகள் சரியாக உள்ளன: பதிலளித்தல், குழுவிலுள்ள ஒருவரிடம் பேசுதல், ‘நண்பனே’ என்ற அழைப்பு, அநியாயம் செய்யாமை, தினாரியத்திற்கான முன் உடன்பாடு, மற்றும் உடன்பாட்டை எதிர்பார்க்கும் வினா ஆகியவை பாதுகாக்கப்பட்டுள்ளன. ஆனால் ‘ஒப்புக்கொண்டாய்’ என்பது பொதுவான சம்மதமாகவும் புரியக்கூடும்; இச்சூழலில் συνεφώνησάς குறிக்கும் கூலி-ஒப்பந்தத்தைத் தெளிவாகத் தர ‘ஒப்பந்தம் செய்துகொண்டாய்’ சிறந்தது.'
