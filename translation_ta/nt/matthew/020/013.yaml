translation_notes:
  register: நவீன தரத் தமிழில், உரையாடலுக்கேற்ற இயல்பும் வேதாகமப் பகுதிக்கேற்ற கண்ணியமும் பேணப்பட்டுள்ளன. கிரேக்கத்தின் பதில்-கூற்று அமைப்பு முடிந்தவரை காக்கப்பட்டுள்ளது; சொல்லுக்குச் சொல் மொழிபெயர்ப்பால் ஏற்படும் செயற்கைத்தன்மை தவிர்க்கப்பட்டுள்ளது.
