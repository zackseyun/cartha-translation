source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς ⸂ἑνὶ αὐτῶν εἶπεν⸃· Ἑταῖρε, οὐκ ἀδικῶ σε· οὐχὶ δηναρίου συνεφώνησάς μοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/013.yaml
  text: But answering[a], he said to one of them, ‘Friend, I am not wronging you[b]. Did you not agree with me for a denarius?’
translation:
  language: ta
  text: ஆனால் அவர் அவர்களில் ஒருவனுக்குப் பதிலளித்து, “நண்பனே, நான் உனக்கு அநியாயம் செய்யவில்லை.[a] ஒரு தினாரியத்துக்கு நீ என்னோடு ஒப்பந்தம் செய்துகொண்டாய் அல்லவா?[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் உனக்கு அநீதி இழைக்கவில்லை.”
    reason: lexical_alternative
  - marker: b
    text: தினாரியம் என்பது ரோமப் பேரரசில் பயன்பட்ட ஒரு வழக்கமான வெள்ளி நாணயம்; பொதுவாக அது ஒரு தொழிலாளியின் ஒரு நாள் கூலியாகக் கருதப்பட்டது.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: பதிலளித்து
  rationale: பதில் கூறுவதைக் குறிக்கும் பங்கேற்புவினையின் பொருளையும், அதைத் தொடர்ந்து வரும் ‘என்றார்’ என்பதுடனான கிரேக்க வாக்கிய அமைப்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἑνὶ αὐτῶν
  choice: அவர்களில் ஒருவனுக்கு
  rationale: ஒரு குழுவிலிருந்து ஓர் தனிநபரைத் தேர்ந்து அவரிடம் பேசுவதைத் தெளிவாகக் காட்டுகிறது.
- source_word: Ἑταῖρε
  choice: நண்பனே
  rationale: நேரடி அழைப்பை இயல்பான நவீன தமிழில் தருகிறது; சூழலில் இது நெருக்கமான அன்பைக் காட்டுவதாக மட்டுமல்லாமல் கட்டுப்படுத்தப்பட்ட தொனியையும் கொண்டிருக்கலாம்.
- source_word: οὐκ ἀδικῶ σε
  choice: நான் உனக்கு அநியாயம் செய்யவில்லை
  rationale: ἀδικέω என்பதன் ‘ஒருவரிடம் அநியாயமாக நடப்பது/அவருக்குத் தீங்கு செய்வது’ என்ற தனிப்பட்ட செயப்படுபொருள் சார்ந்த வலிமையைப் பாதுகாக்கிறது.
- source_word: οὐχὶ
  choice: அல்லவா?
  rationale: உடன்பாட்டை எதிர்பார்க்கும் கிரேக்க எதிர்மறை வினாவின் சொல்லாட்சிச் சக்தியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δηναρίου
  choice: ஒரு தினாரியத்திற்கு
  rationale: விலையைக் குறிக்கும் வேற்றுமைப் பொருளைத் தருவதோடு, வரலாற்றுச் சிறப்புடைய நாணயத்தின் பெயரையும் பொதுவான ‘கூலி’ என்று மாற்றாமல் காக்கிறது.
- source_word: συνεφώνησάς μοι
  choice: நீ என்னோடு ஒப்புக்கொண்டாய்
  rationale: முன்னர் எட்டப்பட்ட வேலைக்கான உடன்பாட்டைக் குறிக்கும் இறந்தகாலச் செயலைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
