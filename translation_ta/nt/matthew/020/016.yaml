  source_fidelity: 'The Tamil faithfully represents οὕτως as a concluding/applicative ‘இவ்வாறே,’ retains the future force of ἔσονται, and preserves the balanced substantive-adjective reversal: ‘the last’/‘the first’ become ‘first’/‘last.’ It does not narrow the referents to status, salvation, reward, or chronology.'
  naturalness: ‘இவ்வாறே, கடைசியாக இருப்பவர்கள் முதலாவார்கள்; முதலாக இருப்பவர்கள் கடைசியாவார்கள்’ is clear, dignified modern standard Tamil. The parallel phrasing and semicolon effectively preserve the aphoristic antithesis.
  terminology: ‘கடைசியாக இருப்பவர்கள்’ and ‘முதலாக இருப்பவர்கள்’ appropriately render the substantival Greek adjectives without importing an interpretive term such as ‘தாழ்ந்தவர்கள்.’ ‘முதலாவார்கள்/கடைசியாவார்கள்’ preserves the concise reversal and future assertion.
