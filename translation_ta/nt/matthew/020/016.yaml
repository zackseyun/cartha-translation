  text: οὕτως ἔσονται οἱ ἔσχατοι πρῶτοι καὶ οἱ πρῶτοι ⸀ἔσχατοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/016.yaml
  text: So the last will be first[a], and the first last.
translation:
  language: ta
  text: இவ்வாறே[a], கடைசியாக இருப்பவர்கள் முதலாவார்கள்; முதலாக இருப்பவர்கள் கடைசியாவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆகவே, கடைசியாக இருப்பவர்கள் முதலாவார்கள்; முதலாக இருப்பவர்கள் கடைசியாவார்கள்.”
    reason: οὕτως என்பது இங்கு ‘இவ்வாறே’ என்ற விதத்தையும் ‘ஆகவே’ என்ற முடிவு அல்லது விளைவையும் உணர்த்தக்கூடும்.
lexical_decisions:
- source_word: οὕτως
  choice: இவ்வாறே
  rationale: உவமையிலிருந்து வரும் முடிவையும், ‘இவ்விதமாக/இப்படியே’ என்ற மூலச்சொல்லின் விதம் அல்லது விளைவு சார்ந்த நுணுக்கத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἔσονται
  choice: ஆவார்கள்
  rationale: εἰμί என்பதன் எதிர்கால வடிவத்தைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: οἱ ἔσχατοι
  choice: கடைசியாக இருப்பவர்கள்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் பெயரடையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ‘தாழ்ந்தவர்கள்’ என்று மொழிபெயர்த்து சமூக மதிப்பு என்ற பொருளைத் தேவையின்றி சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: πρῶτοι
  choice: முதலாவார்கள்
  rationale: சுருக்கமான எதிர்மாற்றுக் கூற்றின் இணை அமைப்பையும் ‘முதல்’ என்ற அடிப்படைப் பொருளையும் காக்கிறது.
- source_word: καὶ
  choice: ;
  rationale: இரண்டு இணையான உட்பிரிவுகளையும் எதிர்மாற்றின் சமநிலையையும் தமிழில் தெளிவாக இணைக்க அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது; ‘ஆனால்’ என்ற மூலத்தில் வெளிப்படையாக இல்லாத எதிர்மறை இணைப்பைச் சேர்க்கவில்லை.
- source_word: οἱ πρῶτοι
  choice: முதலாக இருப்பவர்கள்
  rationale: முதல் உட்பிரிவிலுள்ள ‘கடைசியாக இருப்பவர்கள்’ என்பதற்கு இணையான பெயர்ச்சொல் அமைப்பைத் தக்கவைக்கிறது.
- source_word: ἔσχατοι
  choice: கடைசியாவார்கள்
  rationale: முதல் உட்பிரிவைத் தலைகீழாகத் திருப்பும் சுருக்கமான இணை அமைப்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: கூற்றில் கூறப்படும் எதிர்மாற்றின் தன்மை
  choice: ‘கடைசி/முதல்’ என்ற சுருக்கமான எதிர்மாற்றுக் கூற்றாகவே மொழிபெயர்த்தல்
  alternative: இதை சமூக நிலை, சீடத்துவத்தின் வெகுமதி, காலவரிசை அல்லது மீட்பின் வரிசை என்று குறிப்பாக விளக்குதல்
  rationale: கிரேக்க வாசகம் எதிர்மாற்றை மட்டும் கூறுகிறது; அது எந்தத் துறையைச் சுட்டுகிறது என்பதை இவ்வசனத்தின் சொற்களே குறுக்கிவிடவில்லை. ஆகவே மொழிபெயர்ப்பு அந்த இறையியல் திறந்தநிலையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘கடைசியாக இருப்பவர்கள் / முதலாக இருப்பவர்கள்’ என்ற இணைச் சொற்றொடர்கள் சாதாரண வாசகர்களுக்குத் தெளிவாக இருப்பதோடு, மூலத்தின் சமச்சீர் எதிர்மாற்றையும் பாதுகாக்கின்றன.
