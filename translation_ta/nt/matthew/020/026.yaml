  edition: SBLGNT
  text: οὐχ οὕτως ⸀ἔσται ἐν ὑμῖν· ἀλλ’ ὃς ⸀ἂν θέλῃ ἐν ὑμῖν μέγας γενέσθαι ἔσται ὑμῶν διάκονος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/026.yaml
  text: It shall not be so among you[a]. But whoever wants to become great among you shall be your servant,
translation:
  language: ta
  text: உங்களிடையே அப்படி இருக்கக்கூடாது[a]. ஆனால், உங்களிடையே பெரியவராக ஆக விரும்புகிறவர் உங்களுக்குச் சேவை செய்பவராக இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களிடையே அப்படி இல்லை.” கிரேக்கத்தில் “இருக்கும்” என்ற எதிர்கால வினை உள்ளது; இயேசுவைப் பின்பற்றுவோரிடையே இது எவ்வாறு இருக்கக்கூடாது என்பதைக் குறிக்கவும் அது பயன்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ οὕτως ἔσται ἐν ὑμῖν
  choice: உங்களிடையே அப்படி இருக்கக்கூடாது
  rationale: ἔσται என்பதன் எதிர்கால வடிவத்திலுள்ள நெறிப்படுத்தும் வலிமையை இயல்பான நவீன தமிழில் ‘இருக்கக்கூடாது’ எனக் காக்கிறது; ἐν ὑμῖν சமூக உறவைக் குறிக்கும் வகையில் ‘உங்களிடையே’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἀλλ’ ὃς ἂν θέλῃ
  choice: மாறாக, ... விரும்புகிறவர்
  rationale: ὃς ἂν உடன் வரும் துணைவினை வடிவம் பொதுவான, வரையறுக்கப்படாத நபரைக் குறிக்கிறது; θέλῃ விருப்பத்தைத் தெளிவாகக் காட்ட ‘விரும்புகிறவர்’ பொருத்தமானது.
- source_word: μέγας γενέσθαι
  choice: பெரியவராக ஆக
  rationale: γενέσθαι நிலையை மட்டும் அல்லாமல் அந்த நிலையை அடைவதைக் குறிப்பதால், ‘ஆக’ என்ற கூறு விடப்படவில்லை.
- source_word: διάκονος
  choice: பணியாளர்
  rationale: இங்கு διάκονος சேவை செய்பவரைக் குறிக்கிறது. ‘திருத்தொண்டர்’ போன்ற பிற்காலச் சபைப் பதவிப் பொருளைத் தவிர்த்து, δοῦλος குறிக்கும் அடிமைநிலையையும் இதில் இறக்குமதி செய்யாமல் ‘பணியாளர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ὑμῶν
  choice: உங்களுக்குப்
  rationale: உடைமை வடிவை மரபுச்சொல் போல் இறுக்கமாக மொழிபெயர்க்காமல், குழுவுக்குச் சேவை செய்யும் உறவைக் காட்டும் இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: இயேசுவைப் பின்பற்றுவோரின் சமூகத்தில் பெருமையின் இயல்பு
  choice: உலகியலான அதிகார வரிசையைத் தலைகீழாக்கும் நெறியாகவும், பெருமையைப் பிறருக்குச் செய்யும் சேவையோடு இணைப்பதாகவும் மொழிபெயர்த்தல்
  alternative: διάκονος என்பதைச் சபையின் ‘திருத்தொண்டர்’ பதவியாகக் கொள்ளுதல், அல்லது பணியாளர் என்ற உருவகத்தை நீக்கிப் பொதுவான தாழ்மையாகப் பொழிப்புரை செய்தல்
  rationale: சுற்றியுள்ள வசனங்களில் ஆட்சியாளர்களின் ஆதிக்கத்துக்கு மாறாக சீடர்களுக்கான நெறி கூறப்படுகிறது. ஆகவே சேவைச் சொல் தக்கவைக்கப்படுகிறது; ஆனால் பிற்கால நிறுவனப் பதவி இதில் புகுத்தப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குத் தெளிவாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘இருக்கக்கூடாது’ என்பது கிரேக்க எதிர்காலத்தின் நெறிப்படுத்தும் வலிமையை இயல்பாக வெளிப்படுத்துகிறது. ‘பணியாளர்’ என்பது இச்சூழலில் சேவையை முன்னிறுத்தி, சபைப் பதவி அல்லது அடிமைநிலை என்ற தேவையற்ற குறிப்புகளைத் தவிர்க்கிறது.
