id: MAT.20.25
reference: Matthew 20:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς προσκαλεσάμενος αὐτοὺς εἶπεν· Οἴδατε ὅτι οἱ ἄρχοντες τῶν ἐθνῶν κατακυριεύουσιν αὐτῶν καὶ οἱ μεγάλοι κατεξουσιάζουσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/025.yaml
  text: But Jesus[a], calling them to himself, said, “You know that the rulers of the Gentiles lord it over them[b], and their great men exercise authority over them.”
translation:
  language: ta
  text: ஆனால் இயேசு அவர்களைத் தம்மிடம் அழைத்து, “புறவினத்தாரின்[a] ஆட்சியாளர்கள் அவர்கள்மேல் ஆதிக்கம் செலுத்துகிறார்கள்; அவர்களுடைய பெரியோர்[b] அவர்கள்மேல் அதிகாரம் செலுத்துகிறார்கள் என்பது உங்களுக்குத் தெரியும்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாடுகளின்.”
    reason: மூலமொழியின் ἐθνῶν என்பது சூழலின்படி ‘புறவினத்தார்’ அல்லது ‘நாடுகள்’ என்று பொருள்படலாம்.
  - marker: b
    text: அல்லது, “அவர்களுடைய உயர் அதிகாரிகள்.”
    reason: οἱ μεγάλοι என்பது சொல்லுக்கு சொல் ‘பெரியோர்’; இங்கு சமூக அல்லது அரசியல் உயர்நிலையினரைக் குறிக்கலாம்.
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: அவர்களைத் தம்மிடம் அழைத்து
  rationale: இடை வினை வடிவம், சீடர்களை இயேசு தம்மிடம் அழைத்ததை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Οἴδατε
  choice: உங்களுக்குத் தெரியும்
  rationale: வடிவத்தில் நிறைவுக்காலமாக இருந்தாலும் நிகழ்காலப் பொருளில் வரும் οἶδα என்பதற்கு இது இயல்பான தமிழ்.
- source_word: ἄρχοντες
  choice: ஆட்சியாளர்கள்
  rationale: ஆளுகிறவர்களைக் குறிக்கும் சொல்லின் அரசியல் சூழலையும் பரந்த பொருளையும் தெளிவாகக் காட்டுகிறது.
- source_word: τῶν ἐθνῶν
  choice: புறவினத்தாரின்
  rationale: யூதச் சூழலில் யூதரல்லாத மக்களைக் குறிக்கும் வழக்கமான பொருளைத் தருகிறது; ‘நாடுகளின்’ என்ற உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: κατακυριεύουσιν
  choice: அடக்கி ஆளுகிறார்கள்
  rationale: வெறுமனே ஆட்சி செய்வதைவிட, மேலாதிக்கத்தோடு கட்டுப்படுத்தும் எதிர்மறை நிழற்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οἱ μεγάλοι
  choice: அவர்களுடைய பெரியவர்கள்
  rationale: சமூக அல்லது அரசியல் செல்வாக்குள்ளவர்களைக் குறிக்கும் பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட பெயரடையை நெருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: κατεξουσιάζουσιν
  choice: அதிகாரம் செலுத்துகிறார்கள்
  rationale: ஒருவர்மேல் அதிகாரத்தைப் பயன்படுத்துதல் என்ற அடிப்படைப் பொருளைத் தெளிவாகத் தருகிறது; இணையான முந்தைய வினைச்சொல் அதன் அழுத்தமான சூழலை உணர்த்துகிறது.
- source_word: αὐτῶν
  choice: அவர்களை / அவர்கள்மேல்
  rationale: இரு இடங்களிலும் புறவின மக்களையே சுட்டுகிறது; அந்தந்த தமிழ் வினைச்சொல்லுக்கு ஏற்ற வேற்றுமை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: யூதச் சூழலில் ἐθνῶν என்பதன் பொருள்
  choice: புறவினத்தாரின்
  alternative: நாடுகளின்
  rationale: இயேசுவின் சீடர்களுக்கும் யூதரல்லாத மக்களிடையே காணப்படும் ஆட்சிமுறைக்கும் உள்ள சூழல்சார் வேறுபாட்டை முதன்மை வாசகம் காட்டுகிறது; மூலச்சொல்லின் ‘நாடுகள்’ என்ற பொருளும் அடிக்குறிப்பில் விடப்பட்டுள்ளது.
- issue: οἱ μεγάλοι என்ற ஆண்பால் பன்மை வடிவம்
  choice: அவர்களுடைய பெரியவர்கள்
  alternative: அவர்களுடைய உயர் அதிகாரிகள்
  rationale: தமிழில் ‘பெரியவர்கள்’ என்பது செல்வாக்குள்ள அல்லது உயர்நிலையிலுள்ளவர்களை இயல்பாகக் குறிக்கிறது; கிரேக்கத்தின் ஆண்பால் வடிவத்தைத் தமிழில் செயற்கையாகச் சேர்க்காமல், அதிகாரப் பதவியை வலியுறுத்தும் மாற்றும் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘அடக்கி ஆளுகிறார்கள்’ என்பது முதல் வினையின் மேலாதிக்க நிழற்பொருளைக் காக்கிறது; இரண்டாவது இணை வினை ‘அதிகாரம் செலுத்துகிறார்கள்’ என்று நேரடியாகத் தரப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையிலுள்ள அடிக்குறி இடமாற்றம் மூலமொழியின் பொருளுக்கு ஏற்ப சரிசெய்யப்பட்டுள்ளது.
