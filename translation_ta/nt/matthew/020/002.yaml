id: MAT.20.2
reference: Matthew 20:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂συμφωνήσας δὲ⸃ μετὰ τῶν ἐργατῶν ἐκ δηναρίου τὴν ἡμέραν ἀπέστειλεν αὐτοὺς εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/002.yaml
  text: After agreeing with the workers for one denarius for the day[a], he sent them into his vineyard.
translation:
  language: ta
  text: தொழிலாளர்களுடன், ஒரு நாளுக்கு ஒரு தினாரியம் கூலி என ஒப்பந்தம் செய்தபின், அவர்களைத் தன் திராட்சைத்தோட்டத்துக்கு அனுப்பினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஒரு தினாரியம் என்பது அக்காலத்தில் ஒரு தொழிலாளிக்கு வழக்கமாக வழங்கப்பட்ட ஒரு நாள் கூலி.
    reason: cultural_note
lexical_decisions:
- source_word: συμφωνήσας
  choice: ஒப்புக்கொண்ட பின்பு
  rationale: இறந்தகால வினையெச்சம் முதன்மை வினைக்கு முன்னர் உடன்பாடு ஏற்பட்டதைக் காட்டுகிறது; இத்தமிழாக்கம் அந்தக் காலத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது மென்மையான தொடர்ச்சியைக் குறிக்கிறது; வினையெச்சத் தொடர் தமிழில் அந்தக் கதைத்தொடர்பை ஏற்கெனவே இயல்பாக அளிக்கிறது.
- source_word: ἐργατῶν
  choice: தொழிலாளர்களோடு
  rationale: திராட்சைத்தோட்டத்தில் கூலிக்கு அமர்த்தப்படும் பணியாளர்களைக் குறிக்கும் தெளிவான, நவீன பொதுத்தமிழ்ச் சொல்.
- source_word: ἐκ δηναρίου
  choice: ஒரு தினாரியம் என்று
  rationale: ஒப்புக்கொள்ளப்பட்ட கூலித்தொகையைச் சுட்டுகிறது; பண்டைய நாணயத்தின் பெயரை நவீன மதிப்பாக மாற்றாமல் தக்கவைக்கிறது.
- source_word: τὴν ἡμέραν
  choice: ஒரு நாளுக்கு
  rationale: கூலி எந்தக் கால அளவுக்குரியது என்பதை இயல்பாகவும் கிரேக்க மூலத்திற்கு நெருக்கமாகவும் தெரிவிக்கிறது.
- source_word: ἀπέστειλεν
  choice: அனுப்பினார்
  rationale: கதைத்தொடரில் வரும் பொதுவான வினைக்கு இயல்பான தமிழ் இணை.
- source_word: ἀμπελῶνα
  choice: திராட்சைத்தோட்டத்திற்கு
  rationale: திராட்சைக் கொடிகள் பயிரிடப்படும் தோட்டத்தைக் குறிக்கும் வழக்கமான தமிழ்ச் சொல்.
- source_word: αὐτοῦ
  choice: தன்
  rationale: எழுவாயாகிய நில உரிமையாளருக்கே தோட்டம் சொந்தமானது என்பதைத் தமிழில் இயல்பாகக் காட்டும் தற்சுட்டுப் பெயரடை.
