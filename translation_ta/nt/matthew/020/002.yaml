  revised_text: தொழிலாளர்களுடன், ஒரு நாளுக்கு ஒரு தினாரியம் கூலி என ஒப்பந்தம் செய்தபின், அவர்களைத் தன் திராட்சைத்தோட்டத்துக்கு அனுப்பினார்.[a]
