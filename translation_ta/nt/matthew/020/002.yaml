  terminology: ‘தொழிலாளர்கள்,’ ‘தினாரியம்,’ and ‘திராட்சைத்தோட்டம்’ are appropriate modern-standard Tamil terms. The cultural note should identify the statement as referring to the ancient context, rather than presenting it as an unqualified general fact.
