translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. பண்டைய நாணயப் பெயர் விளக்கக் குறிப்புடன் தக்கவைக்கப்பட்டுள்ளது.
