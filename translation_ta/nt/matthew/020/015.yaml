source:
  edition: SBLGNT
  text: ⸀οὐκ ἔξεστίν μοι ⸂ὃ θέλω ποιῆσαι⸃ ἐν τοῖς ἐμοῖς; ⸀ἢ ὁ ὀφθαλμός σου πονηρός ἐστιν ὅτι ἐγὼ ἀγαθός εἰμι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/015.yaml
  text: Is it not lawful for me to do what I want with what is mine? Or is your eye evil because I am good?[a]
translation:
  language: ta
  text: எனக்குச் சொந்தமானவற்றைக் கொண்டு நான் விரும்பியதைச் செய்ய எனக்கு உரிமை இல்லையா? அல்லது நான் நல்லவனாக இருப்பதால் உன் கண் தீயதாயிருக்கிறதா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “நான் நல்லவனாக இருப்பதால் நீ பொறாமைப்படுகிறாயா?” “கண் தீயதாயிருத்தல்” என்பது பொறாமையை அல்லது மற்றவருக்குக் கிடைக்கும் நன்மையைப் பொறுக்காத மனப்பான்மையைக் குறிக்கும் ஒரு கிரேக்க மரபுத்தொடர்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξεστίν
  choice: உரிமை இல்லையா?
  rationale: இச்சொல் அனுமதிக்கப்பட்டிருப்பதையும் சட்டப்படி உரிமை இருப்பதையும் குறிக்கிறது. உரிமையாளரின் நியாயமான அதிகாரத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὃ θέλω ποιῆσαι
  choice: என் விருப்பப்படி செய்ய
  rationale: θέλω குறிக்கும் தனிப்பட்ட விருப்பத்தைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐν τοῖς ἐμοῖς
  choice: எனக்குச் சொந்தமானவற்றை
  rationale: உரிமையாளருக்குச் சொந்தமான உடைமைகளை இச்சூழலில் தெளிவாகக் குறிக்கிறது.
- source_word: ὁ ὀφθαλμός σου πονηρός
  choice: உன் கண் தீயதாக இருக்கிறதா?
  rationale: கிரேக்க மூலத்தின் உருவகத்தைப் பாதுகாக்கிறது; பொறாமை அல்லது பிறருக்குக் கிடைக்கும் நன்மையைப் பொறுக்காத மனப்பான்மை என்ற பொருளை அடிக்குறிப்பு விளக்குகிறது.
- source_word: ἀγαθός
  choice: நல்லவனாக
  rationale: அடிப்படைப் பொருளான ‘நல்லவன்’ என்பதைப் பாதுகாத்து, சூழலில் உள்ள தாராள மனப்பான்மை என்ற உட்பொருளை வாசகர் உணர இடமளிக்கிறது.
theological_decisions:
- issue: ὁ ὀφθαλμός σου πονηρός என்ற மரபுத்தொடரை முதன்மைப் பனுவலில் விளக்கிப் பொருள்படுத்துவதா
  choice: ‘உன் கண் தீயதாக இருக்கிறதா?’ என்ற மூல உருவகத்தைப் பாதுகாத்தல்
  alternative: ‘நான் நல்லவனாக இருப்பதால் நீ பொறாமைப்படுகிறாயா?’
  rationale: தொழிலாளியின் ‘தீய கண்’ என்பதையும் உரிமையாளரின் நன்மையையும் இணைக்கும் மூலத்தின் எதிர்மறை ஒப்புமையையும் இறையியல் அழுத்தத்தையும் தீர்த்து விடாமல் பாதுகாக்கிறது; சாத்தியமான மரபுத்தொடர்ப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; நேர்த்தியான, கண்ணியமான பேச்சுநடை. ‘உரிமை’ என்பது ἔξεστίν என்பதன் அனுமதி/சட்டப்பூர்வ அதிகார நுணுக்கத்தை இயல்பாக வெளிப்படுத்துகிறது. மூல உருவகம் முதன்மைப் பனுவலில் காக்கப்பட்டு, அதன் மரபுத்தொடர்ப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
