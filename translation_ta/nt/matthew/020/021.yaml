source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῇ· Τί θέλεις; λέγει αὐτῷ· Εἰπὲ ἵνα καθίσωσιν οὗτοι οἱ δύο υἱοί μου εἷς ἐκ δεξιῶν ⸀σου καὶ εἷς ἐξ εὐωνύμων σου ἐν τῇ βασιλείᾳ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/021.yaml
  text: And he said to her[a], “What do you want?” She said to him, “Command that these two sons of mine may sit, one at your right and one at your left[c][b], in your kingdom.”
translation:
  language: ta
  text: அவர் அவளிடம், “உனக்கு என்ன வேண்டும்?” என்று கேட்டார். அவள் அவரிடம், “என் இந்த இரு மகன்களும்—ஒருவன் உமது வலப்பக்கத்திலும் மற்றவன் உமது இடப்பக்கத்திலும்—உமது அரசாட்சியில்[b] அமரும்படி சொல்லுங்கள்[a]” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “சொல்லுங்கள்.” இச்சூழலில் இது ஒரு ஏற்பாட்டை அறிவிக்குமாறு கேட்பதைக் குறிக்கிறது; “கட்டளையிடுங்கள்” அல்லது “அனுமதி அளியுங்கள்” என்பவை சூழல்சார் மாற்றுரைகளாகும்.
    reason: lexical_alternative
  - marker: b
    text: “அரசாட்சி” என்பதை “ஆட்சி” அல்லது “அரசரின் ஆளுகை” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί θέλεις
  choice: உனக்கு என்ன வேண்டும்?
  rationale: அவள் முன்வைக்க விரும்பும் கோரிக்கையை நேரடியாகக் கேட்கும் இயல்பான நவீனத் தமிழ்; θέλω என்பதன் நேரடியான வலிமையைத் தக்கவைக்கிறது.
- source_word: Εἰπὲ
  choice: கட்டளையிடும்
  rationale: சொல்லர்த்தமாக ‘சொல்’ என்றாலும், தொடர்ந்து வரும் ἵνα உட்பிரிவுடன் இங்கு அரச அதிகாரத்தோடு ஒரு ஏற்பாட்டை அறிவிக்கும்படி கேட்கப்படுகிறது. தமிழில் ‘அமரும்படி சொல்லும்’ என்பது மகன்களிடம் சொல்லுதல் எனத் தவறாகப் புரியக்கூடும்; ‘கட்டளையிடும்’ சூழலுக்கேற்ற இயல்பான பொருளைத் தருகிறது, சொல்லர்த்த மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἵνα καθίσωσιν
  choice: அமரும்படி
  rationale: கோரிக்கையின் உள்ளடக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; அனுமதி அல்லது நியமனத்தின் உட்குறிப்பை அதிகமாக விளக்காமல் விடுகிறது.
- source_word: οὗτοι οἱ δύο υἱοί μου
  choice: என்னுடைய இந்த இரண்டு மகன்களில்
  rationale: οὗτοι என்ற சுட்டையும் μου என்ற தனிப்பட்ட உறவையும் தக்கவைத்து, அடுத்துவரும் ‘ஒருவன்… மற்றவன்…’ அமைப்போடு இயல்பாக இணைக்கிறது.
- source_word: εἷς ἐκ δεξιῶν σου καὶ εἷς ἐξ εὐωνύμων σου
  choice: ஒருவன் உமது வலப்பக்கத்திலும் மற்றவன் உமது இடப்பக்கத்திலும்
  rationale: இரு இடங்களையும் இணையான, இயல்பான தமிழில் தருகிறது; அவை கௌரவ இடங்கள் என்பதை உரைக்குள் விளக்கிச் சேர்க்கவில்லை.
- source_word: ἐν τῇ βασιλείᾳ σου
  choice: உமது அரசாட்சியில்
  rationale: βασιλεία என்பதில் உள்ள அரசாட்சி/ஆட்சி என்ற கருத்தைத் தெளிவாகக் காட்டுகிறது; அது பூமிக்குரியதா விண்ணுக்குரியதா என்பதைத் தீர்மானிக்கவில்லை.
theological_decisions:
- issue: இயேசுவின் அரசாட்சியில் கேட்கப்படும் இருக்கைகளின் தன்மை
  choice: ‘உமது அரசாட்சியில்’ என்று அரசருக்குரிய சூழலையும் வலது, இடது பக்கங்களிலான இடங்களையும் மட்டும் கூறுதல்
  alternative: இதைப் பூமிக்குரிய மெசியாவின் அரசு அல்லது நிறைவுபெற்ற விண்ணரசு என்று குறிப்பாக விளக்குதல்
  rationale: கிரேக்க உரை எந்தக் காலகட்டத்தையோ இடத்தையோ தெளிவாக வரையறுக்கவில்லை. ஆகவே கௌரவமும் அரச அதிகாரமும் சார்ந்த கோரிக்கையைத் தக்கவைத்து, குறிப்பிட்ட இறுதிக்காலக் கோட்பாட்டைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் மொழிபெயர்க்கப்பட்டுள்ளது. இயேசுவைக் குறிக்க ‘அவர்/உமது’ என்ற மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; குறிப்பிட்ட திருச்சபை மரபின் சொற்களோ இறுதிக்கால விளக்கமோ சேர்க்கப்படவில்லை.
