source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ· Ὅτι οὐδεὶς ἡμᾶς ἐμισθώσατο. λέγει αὐτοῖς· Ὑπάγετε καὶ ὑμεῖς εἰς τὸν ⸀ἀμπελῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/007.yaml
  text: They said to him[a], “Because no one has hired us.” He says to them, “You also go into the vineyard.”
translation:
  language: ta
  text: அவர்கள் அவரிடம், “யாரும் எங்களை வேலைக்கு அமர்த்தாததால்” என்றார்கள்[a]. அவர் அவர்களிடம், “நீங்களும் திராட்சைத்தோட்டத்திற்குப் போங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என்றார்கள்,’ ‘என்றார்’ என மொழிபெயர்க்கப்பட்டுள்ள இரு வினைகளும் கிரேக்கத்தில் வரலாற்று நிகழ்காலத்தில், அதாவது ‘சொல்கிறார்கள்,’ ‘சொல்கிறார்’ என்ற வடிவில் உள்ளன.
    reason: மூலமொழியின் வரலாற்று நிகழ்கால வடிவத்தையும் அதன் மாற்று மொழிபெயர்ப்பையும் பதிவு செய்வதற்காக.
lexical_decisions:
- source_word: λέγουσιν
  choice: என்றார்கள்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டிருந்தாலும், தமிழ் கதைநடையில் கடந்தகால வினைமுற்று இயல்பாகவும் தெளிவாகவும் உள்ளது; மூலத்தின் நிகழ்கால வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: Ὅτι
  choice: ஏனென்றால்
  rationale: இங்கு ὅτι, அவர்கள் ஏன் அங்கே நிற்கிறார்கள் என்பதற்கான காரணத்தை அறிமுகப்படுத்துகிறது; ‘ஏனென்றால்’ அந்த விளக்கத் தொடர்பை வெளிப்படையாகக் காக்கிறது.
- source_word: οὐδεὶς
  choice: யாரும் … இல்லை
  rationale: எதிர்மறை வாக்கியத்தில் οὐδεὶς என்பதற்கான இயல்பான நவீனத் தமிழ் அமைப்பு இது.
- source_word: ἡμᾶς ἐμισθώσατο
  choice: எங்களை வேலைக்கு அமர்த்தவில்லை
  rationale: μισθόομαι என்பது கூலிக்கு அல்லது வேலைக்கு அமர்த்துவதைக் குறிக்கிறது; சூழலில் ‘வேலைக்கு அமர்த்துதல்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: λέγει
  choice: என்றார்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தைத் தமிழ் கதைநடைக்கு ஏற்ற கடந்தகாலமாக வழங்குகிறது; இரு பேச்சு வினைகளின் மூல வடிவமும் அடிக்குறிப்பில் சுட்டப்படுகிறது.
- source_word: Ὑπάγετε
  choice: போங்கள்
  rationale: வேலை நடைபெறும் இடத்திற்குச் செல்லும்படி கூறும் நேரடியான கட்டளையை இயல்பான மரியாதைப் பன்மையில் தருகிறது.
- source_word: καὶ ὑμεῖς
  choice: நீங்களும்
  rationale: முன்பு அனுப்பப்பட்டவர்களோடு இந்தக் குழுவினரையும் சேர்த்துக்கொள்ளும் வலியுறுத்தலை ‘-உம்’ தெளிவாகக் காட்டுகிறது.
- source_word: ἀμπελῶνα
  choice: திராட்சைத்தோட்டம்
  rationale: திராட்சைக் கொடிகள் பயிரிடப்படும் தோட்டத்தைக் குறிக்கும் நிலையான, பொதுவாகப் புரியும் தமிழ் சொல்.
