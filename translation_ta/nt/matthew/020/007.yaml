translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. நேரடிப் பேச்சில் காரணத் தொடர்பு வெளிப்படையாக வைக்கப்பட்டுள்ளது; மரியாதைப் பன்மை தமிழ் உரையாடல் மரபுக்கு ஏற்ப பயன்படுத்தப்பட்டுள்ளது.
