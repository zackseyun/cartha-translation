source:
  edition: SBLGNT
  text: καὶ ἐκείνοις εἶπεν· Ὑπάγετε καὶ ὑμεῖς εἰς τὸν ἀμπελῶνα, καὶ ὃ ἐὰν ᾖ δίκαιον δώσω ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/004.yaml
  text: And he said to them[a], ‘You also go into the vineyard, and whatever is right I will give you.’
translation:
  language: ta
  text: அவர் அவர்களிடம், ‘நீங்களும் திராட்சைத்தோட்டத்திற்குப் போங்கள்; நியாயமானது எதுவோ அதை உங்களுக்குக் கொடுப்பேன்[a]’ என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சரியானது எதுவோ” அல்லது “முறையானது எதுவோ.”
    reason: δίκαιον என்பது இங்கு நியாயமானது, சரியானது, முறையானது ஆகிய பொருள் நிழல்களைத் தரலாம்.
lexical_decisions:
- source_word: ἐκείνοις
  choice: அவர்களிடம்
  rationale: முன்னதாகக் குறிப்பிடப்பட்ட மற்ற வேலையாட்களைக் குறிக்கும் பன்மைச் சுட்டுப்பெயர்; தமிழில் இயல்பாக ‘அவர்களிடம்’ என வருகிறது.
- source_word: εἶπεν
  choice: என்றார்
  rationale: நேர்கூற்றை அறிமுகப்படுத்தும் λέγω வினையின் இயல்பான தமிழ் கதைநடை வடிவம்.
- source_word: Ὑπάγετε
  choice: போங்கள்
  rationale: திராட்சைத்தோட்டத்திற்குச் செல்லும்படி கூறும் பன்மை மரியாதை ஏவல்; கட்டளையின் நேரடித் தன்மையைத் தக்கவைக்கிறது.
- source_word: καὶ ὑμεῖς
  choice: நீங்களும்
  rationale: முன்னர் அனுப்பப்பட்டவர்களுடன் இவர்களையும் சேர்த்துக்கொள்ளும் வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀμπελῶνα
  choice: திராட்சைத்தோட்டம்
  rationale: ἀμπελών என்பதற்கான வழக்கமான, தெளிவான தமிழ் இணைச்சொல்.
- source_word: ὃ ἐὰν ᾖ δίκαιον
  choice: நியாயமானது எதுவோ
  rationale: எது நியாயத்திற்கும் சரியான ஒழுங்கிற்கும் ஏற்ப இருக்கிறதோ என்ற திறந்த பொருளைத் தக்கவைக்கிறது; கூலித் தொகையை உரை குறிப்பிடாததால் அதைச் சேர்க்கவில்லை.
- source_word: δώσω ὑμῖν
  choice: அதை உங்களுக்குக் கொடுப்பேன்
  rationale: δίδωμι என்பதன் அடிப்படைப் பொருளான ‘கொடுப்பேன்’ என்பதைப் பேணுகிறது; சூழல் கூலியைப் பற்றியதாயினும் ‘செலுத்துவேன்’ என்று வெளிப்படையாக மாற்றவில்லை.
theological_decisions:
- issue: கூலி நிர்ணயிக்கும் சூழலில் δίκαιον என்பதன் மொழிபெயர்ப்பு
  choice: நியாயமானது
  alternative: சரியானது; நீதியானது; முறையானது
  rationale: ‘நியாயமானது’ என்பது நீதிக்கும் சரியான நடத்தைக்கும் உரிய ஒழுக்கப் பொருளைப் பேணுகிறது; சட்டரீதியான ‘நீதியானது’ என்ற குறுகிய சாயலையோ, வெறும் தனிப்பட்ட சமச்சீர் உணர்வையோ திணிக்கவில்லை.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நீங்களும்’ மூலம் மூலத்தின் சேர்த்துக்கொள்ளும் வலியுறுத்தலும், ‘கொடுப்பேன்’ மூலம் வினையின் பொதுப் பொருளும் பாதுகாக்கப்பட்டுள்ளன.
