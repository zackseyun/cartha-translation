source:
  edition: SBLGNT
  text: Τότε προσῆλθεν αὐτῷ ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου μετὰ τῶν υἱῶν αὐτῆς προσκυνοῦσα καὶ αἰτοῦσά τι ⸀παρ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/020.yaml
  text: Then the mother of the sons of Zebedee came to him with her sons[a], bowing down and asking something from him.
translation:
  language: ta
  text: அப்போது, செபெதேயுவின் மகன்களுடைய தாய் தன் மகன்களுடன் அவரிடம் வந்து, அவர் முன் பணிந்து[a], அவரிடம் ஏதோ ஒன்றைக் கேட்டாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரை வழிபட்டு”; கிரேக்க வினைச்சொல் சூழலுக்கு ஏற்ப பணிந்து மரியாதை செலுத்துதல், வணங்குதல் அல்லது வழிபடுதல் என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: அப்போது
  rationale: அடுத்த நிகழ்வை அறிமுகப்படுத்தும் இயல்பான காலத் தொடர்புச் சொல்.
- source_word: προσῆλθεν αὐτῷ
  choice: அவரிடம் வந்து
  rationale: ஒருவரை நோக்கி வருதல் அல்லது அணுகுதல் என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου
  choice: செபெதேயுவின் மகன்களுடைய தாய்
  rationale: அந்தப் பெண்ணை செபெதேயுவின் மகன்களுடனான உறவால் அடையாளப்படுத்தும் கிரேக்க மரபுத்தொடரைத் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: μετὰ τῶν υἱῶν αὐτῆς
  choice: தன் மகன்களுடன்
  rationale: μετά உடனிருத்தலைக் குறிக்கிறது; எழுவாய் அந்தத் தாயே என்பதால் தன் என்பது தமிழில் தெளிவும் இயல்பும் தருகிறது.
- source_word: προσκυνοῦσα
  choice: அவர் முன் பணிந்து
  rationale: உடலைத் தாழ்த்தி மரியாதை செலுத்தும் செயலைக் காட்டுகிறது; வழிபட்டாள் என்ற வலுவான இறையியல் பொருளை முதன்மை உரையில் கட்டாயப்படுத்தாமல் மூலச்சொல்லின் பொருள் விரிவைப் பாதுகாக்கிறது.
- source_word: καὶ αἰτοῦσά τι παρ’ αὐτοῦ
  choice: அவரிடம் ஏதோ ஒன்றைக் கேட்டாள்
  rationale: τι என்பதன் வரையறுக்கப்படாத ‘ஏதோ ஒன்று’ என்ற பொருளையும், παρά குறிக்கும் கேட்டுப் பெறும் நபரையும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: இயேசுவை நோக்கிப் பயன்படுத்தப்பட்ட προσκυνοῦσα என்பதன் பொருள்
  choice: அவர் முன் பணிந்து
  alternative: அவரை வழிபட்டு
  rationale: προσκυνέω என்பது சூழலுக்கு ஏற்ப பணிதல், மரியாதை செலுத்துதல் அல்லது வழிபடுதல் ஆகிய பொருள்களைத் தரலாம். இங்கு மரியாதையுடன் வேண்டுகோள் வைக்கும் உடனடிச் சூழலுக்கு ‘பணிந்து’ பொருந்துகிறது; அதேவேளை ‘வழிபட்டு’ என்ற இறையியல் சாத்தியத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘செபெதேயு’ என்பது கிரேக்க Ζεβεδαῖος பெயரின் தமிழாக்க வடிவம்; வாக்கியத்தின் பங்கேற்பு அமைப்பு இயல்பான தமிழ் வினைத் தொடராக வழங்கப்பட்டுள்ளது.
