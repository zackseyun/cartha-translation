reference: Matthew 20:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν θέλῃ ἐν ὑμῖν εἶναι πρῶτος ⸀ἔσται ὑμῶν δοῦλος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/027.yaml
  text: And whoever wants to be first among you will be your servant[a].
translation:
  language: ta
  text: உங்களில் யார் முதன்மையானவராக இருக்க விரும்புகிறாரோ, அவர் உங்களுக்கு அடிமையாக இருப்பார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பணியாளர்.’ இங்குள்ள கிரேக்கச் சொல் டூலோஸ்; இது முந்தைய வசனத்தில் ‘பணியாளர்’ என்று மொழிபெயர்க்கப்பட்ட சொல்லைவிட வலிமையானது; பொதுவாக அடிமை அல்லது கட்டுண்ட பணியாளரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: மேலும்
  rationale: முந்தைய வசனத்தின் போதனையைத் தொடர்ந்து இணைக்கும் சொல்லாக இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: ὃς ἂν θέλῃ
  choice: யார் ... இருக்க விரும்புகிறாரோ
  rationale: ἄν உடன் வரும் இறந்தகாலமல்லாத துணைவினை வடிவம் பொதுவான, வரையறுக்கப்படாத நிபந்தனையை உணர்த்துகிறது; ‘யார் ... விரும்புகிறாரோ’ என்பது அந்தப் பொருளையும் விருப்பத்தின் கூறையும் இயல்பாகக் காக்கிறது.
- source_word: ἐν ὑμῖν
  choice: உங்களில்
  rationale: சமூகத்திற்குள் ஒருவருடைய நிலையைச் சுட்டுவதால், இடத்தைக் காட்டும் சொல்லாக்கத்தைவிட ‘உங்களில்’ பொருத்தமானது.
- source_word: εἶναι πρῶτος
  choice: முதன்மையானவராக இருக்க
  rationale: உயர்ந்த இடத்தையோ தரத்தையோ நாடுவதை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἔσται
  choice: இருப்பார்
  rationale: எதிர்கால வினை வடிவத்தைத் தக்கவைக்கிறது; சூழலில் உள்ள நெறிப்படுத்தும் வலிமையை ‘வேண்டும்’ என்று வெளிப்படையாகச் சேர்த்து தீர்மானிக்காமல் விடுகிறது.
- source_word: ὑμῶν
  choice: உங்களுக்கு
  rationale: மற்ற சீடர்களுக்காகவும் அவர்களுக்குக் கீழ்ப்பட்டும் சேவை செய்வதைக் காட்டும் இயல்பான தமிழ் உறவுவேற்றுமை.
- source_word: δοῦλος
  choice: அடிமை
  rationale: முந்தைய வசனத்தின் διάκονος என்பதைக் காட்டிலும் வலிமையான, கட்டுப்பட்ட கீழ்நிலையை உணர்த்தும் சொல்லாக இருப்பதால் ‘அடிமை’ இயேசுவின் சொல்லாட்சியிலுள்ள தீவிரத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: சீடத்துவத்தைப் பற்றிய கூற்றில் δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: அடிமை
  alternative: பணியாளர்; கட்டுண்ட பணியாளர்
  rationale: இந்தக் கூற்று உயர்நிலையை நாடுவதற்கு மாறாக முழுமையான தாழ்வையும் பிறருக்கான சேவையையும் முன்வைக்கிறது. முந்தைய வசனத்தில் வேறு சேவைச்சொல் பயன்படுத்தப்பட்டிருப்பதால், இங்கு உள்ள வலிமையான சமூகக் கீழ்நிலையை மென்மையாக்காமல் காக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மரியாதைப் பன்மை வடிவங்கள் இயல்பான தமிழுக்காகப் பயன்படுத்தப்பட்டாலும், மூலத்தின் ஒருமை சார்ந்த பொதுவான ‘யார்’ அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
