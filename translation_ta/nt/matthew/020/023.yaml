id: MAT.20.23
reference: Matthew 20:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀λέγει αὐτοῖς· Τὸ μὲν ποτήριόν μου ⸀πίεσθε, τὸ δὲ καθίσαι ἐκ δεξιῶν μου καὶ ἐξ ⸀εὐωνύμων οὐκ ἔστιν ⸀ἐμὸν δοῦναι, ἀλλ’ οἷς ἡτοίμασται ὑπὸ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/023.yaml
  text: He said to them[a], “You will indeed drink my cup, but to sit at my right and at my left is not mine to grant[b], but it is for those for whom it has been prepared by my Father.”
translation:
  language: ta
  text: அவர் அவர்களிடம், “என் கிண்ணத்தை நீங்கள் நிச்சயமாகக் குடிப்பீர்கள்[a]. ஆனால் என் வலப்புறத்திலும் இடப்புறத்திலும் அமர இடமளிப்பது எனக்குரியது அல்ல[b]; என் தந்தையால் யாருக்காக அந்த இடங்கள் ஆயத்தம் செய்யப்பட்டிருக்கின்றனவோ, அவர்களுக்கே அவை உரியவை” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கே ‘கிண்ணம்’ என்பது இயேசுவுக்கு நியமிக்கப்பட்ட துன்பம் அல்லது விதியைச் சுட்டும் உருவகம்; அவருடைய சீடர்களும் அதில் பங்குபெறுவார்கள்.
    reason: cross_reference
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “அளிப்பது என்னுடையது அல்ல.”'
    reason: literal_rendering
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: அவர் அவர்களிடம் … என்றார்
  rationale: கிரேக்கத்தில் வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டிருந்தாலும், இயல்பான தமிழ் கதைநடையில் இறந்தகாலம் பொருத்தமானது.
- source_word: Τὸ μὲν ποτήριόν μου πίεσθε
  choice: என் கிண்ணத்திலிருந்து நீங்கள் நிச்சயமாகக் குடிப்பீர்கள்
  rationale: ‘கிண்ணம்’ என்ற உருவகத்தை விளக்கிப் பரப்பாமல் அப்படியே காக்கிறது; μὲν தொடங்கும் உறுதிப்படுத்தல்–மாறுபாட்டு அமைப்பை ‘நிச்சயமாக’ மற்றும் அடுத்துவரும் ‘ஆனால்’ வெளிப்படுத்துகின்றன.
- source_word: καθίσαι ἐκ δεξιῶν μου καὶ ἐξ εὐωνύμων
  choice: என் வலப்பக்கத்திலும் இடப்பக்கத்திலும் அமரும் இடங்கள்
  rationale: இயேசுவுக்கு இருபுறமும் உள்ள மதிப்புக்குரிய இடங்களைக் குறிக்கும் கிரேக்கச் சொற்றொடரை இயல்பான தமிழில் தருகிறது.
- source_word: οὐκ ἔστιν ἐμὸν δοῦναι
  choice: கொடுப்பது எனக்குரியது அல்ல
  rationale: ‘கொடுப்பது என்னுடையது அல்ல’ என்ற கிரேக்க அமைப்பைத் தெளிவான தமிழில் நேரடியாகத் தருகிறது; இயேசுவின் அதிகாரத்தை விளக்கவோ குறைக்கவோ கூடுதல் சொற்கள் சேர்க்கப்படவில்லை.
- source_word: ἀλλ’ οἷς ἡτοίμασται
  choice: யாருக்காக அவை ஆயத்தம் செய்யப்பட்டிருக்கின்றனவோ, அவர்களுக்கே அவை உரியவை
  rationale: கிரேக்கத்தில் விடப்பட்டுள்ள வாக்கிய உறுப்பை தமிழில் இயல்பாக நிறைவு செய்கிறது. நிறைவேறிய ஆயத்தத்தின் தொடரும் விளைவை perfect passive வடிவத்திற்கேற்ப காக்கிறது.
- source_word: ὑπὸ τοῦ πατρός μου
  choice: என் தந்தையால்
  rationale: செயப்பாட்டு வினையின் தனிப்பட்ட செய்பவரை நேரடியாக மொழிபெயர்க்கிறது; மூலத்தில் இல்லாத ‘மட்டுமே’ போன்ற சொல்லைச் சேர்க்கவில்லை.
theological_decisions:
- issue: இடங்களைக் கொடுப்பது ‘எனக்குரியது அல்ல’ என்று இயேசு கூறுவதன் கிறிஸ்துவியல் பதற்றம்
  choice: எந்த விளக்கக் கட்டுப்பாடும் சேர்க்காமல் கூற்றை நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘தந்தையிடமிருந்து தனியாகக் கொடுப்பது எனக்குரியது அல்ல’ போன்ற இணக்கப்படுத்தும் விளக்கத்தைச் சேர்த்தல்
  rationale: மூலவாசகம் கொண்டுள்ள இறையியல் பதற்றத்தை மொழிபெயர்ப்பு தானாகத் தீர்க்கக்கூடாது. தந்தையின் திட்டத்தில் உள்ள பங்குகளை வாசகரே சூழலில் உணருமாறு கூற்று அப்படியே விடப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் எளிமையும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘கிண்ணம்’ என்ற முக்கிய உருவகம் காக்கப்பட்டுள்ளது; ‘ஆயத்தம் செய்யப்பட்டிருக்கின்றன’ என்பது சற்றே உயர்நடையாக இருந்தாலும் வேதாகமச் சூழலுக்கு இயல்பானதும் பொதுவாசகர்களுக்குப் புரியக்கூடியதும் ஆகும்.
