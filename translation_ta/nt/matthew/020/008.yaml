id: MAT.20.8
reference: Matthew 20:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὀψίας δὲ γενομένης λέγει ὁ κύριος τοῦ ἀμπελῶνος τῷ ἐπιτρόπῳ αὐτοῦ· Κάλεσον τοὺς ἐργάτας καὶ ἀπόδος ⸀αὐτοῖς τὸν μισθὸν ἀρξάμενος ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/008.yaml
  text: When evening came, the master of the vineyard says to his steward, ‘Call the workers and pay them their wages, beginning with the last and ending with the first.’
translation:
  language: ta
  text: மாலை நேரமானபோது, திராட்சைத்தோட்டத்தின் உரிமையாளர் தன் மேற்பார்வையாளரிடம், ‘வேலையாட்களை அழைத்து, கடைசியாக வந்தவர்களிலிருந்து தொடங்கி முதலில் வந்தவர்கள் வரை அவர்களுக்குரிய கூலியைக் கொடு’ என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀψίας
  choice: மாலை நேரம்
  rationale: இங்கு நாளின் வேலை முடியும் மாலைப்பொழுதைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொற்றொடர்.
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: திராட்சைத்தோட்டத்தின் உரிமையாளர்
  rationale: κύριος என்பது இச்சூழலில் தோட்டத்தின் சொந்தக்காரரைச் சுட்டுகிறது; ‘உரிமையாளர்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: τῷ ἐπιτρόπῳ
  choice: மேற்பார்வையாளர்
  rationale: வேலையாட்களையும் கூலி வழங்குவதையும் நிர்வகிக்கும் பொறுப்பாளரைச் சுட்டும் பொருத்தமான சொல்.
- source_word: ἀπόδος αὐτοῖς τὸν μισθόν
  choice: அவர்களுக்குரிய கூலியைக் கொடு
  rationale: ἀπόδος என்பது செலுத்த வேண்டியதை வழங்குதல் என்ற நுணுக்கம் கொண்டதால் ‘அவர்களுக்குரிய’ என இயல்பாக வெளிப்படுத்தப்பட்டது.
- source_word: ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων
  choice: கடைசியாக வந்தவர்களிலிருந்து தொடங்கி முதலில் வந்தவர்கள் வரை
  rationale: உவமையின் சூழலில் வருகை/வேலைக்கு அமர்த்தப்பட்ட வரிசையே குறிக்கப்படுவதால் தமிழில் மறைபொருள் தெளிவாக்கப்படுகிறது.
- source_word: λέγει
  choice: என்றார்
  rationale: கிரேக்கத்தின் வரலாற்று நிகழ்காலம் தமிழ்க் கதைநடையில் இயல்பான இறந்தகாலமாக வழங்கப்பட்டது; நிகழ்வின் பொருள் மாறாது.
theological_decisions:
- issue: ‘கடைசியானவர்கள்’ மற்றும் ‘முதலானவர்கள்’ என்பதன் குறிப்பு
  choice: வேலைக்கு வந்த வரிசையை வெளிப்படையாகக் குறிப்பது
  alternative: ‘கடைசியானவர்களிலிருந்து முதலானவர்கள் வரை’ என்று சொற்சொல்லாக வழங்குவது
  rationale: உடனடியான கதைச்சூழலில் இது வேலையாட்கள் வேலைக்கு வந்த வரிசையைக் குறிக்கிறது. இதனால் அடுத்த வசனங்களின் இறையியல் பயன்பாடு முன்கூட்டியே விளக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ். கட்டளையின் நேரடியான தன்மையும் உவமையின் கதைநடையும் பாதுகாக்கப்பட்டுள்ளன.
