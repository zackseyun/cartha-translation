translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தலா ஒரு தினாரியம்’ என்பது பகிர்வுப் பொருளைத் தெளிவாக வைத்திருக்கிறது; வரலாற்று நாணயப் பெயர் எழுத்துப்பெயர்ப்பாகப் பாதுகாக்கப்பட்டுள்ளது.
