  text: ⸂καὶ ἐλθόντες⸃ οἱ περὶ τὴν ἑνδεκάτην ὥραν ἔλαβον ἀνὰ δηνάριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/009.yaml
  text: And those who came about the eleventh hour received a denarius each[a].
translation:
  language: ta
  text: பதினொன்றாம் மணியளவில் வந்தவர்கள் தலா ஒரு தினாரியத்தைப் பெற்றுக்கொண்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: தினாரியம் என்பது ரோமர்களின் ஒரு பொதுவான வெள்ளி நாணயம்; அது பொதுவாக ஒரு தொழிலாளியின் வழக்கமான ஒருநாள் கூலியாகக் கருதப்பட்டது.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντες
  choice: வந்தவர்கள்
  rationale: இறந்தகாலப் பங்கேற்புவினையை இயல்பான தமிழில் பெயரெச்சத் தொடராக அளிக்கிறது; சூழலில் வேலைக்கு அமர்த்தப்பட்டவர்கள் என்பது தெரிந்தாலும், இச்சொல் நேரடியாக ‘வந்தவர்கள்’ என்றே கூறுகிறது.
- source_word: οἱ περὶ τὴν ἑνδεκάτην ὥραν
  choice: பதினொன்றாம் மணியளவில் வந்தவர்கள்
  rationale: περὶ என்பதன் தோராயமான காலக் குறிப்பை ‘மணியளவில்’ இயல்பாக வெளிப்படுத்துகிறது. ‘வேலைக்கு அமர்த்தப்பட்டவர்கள்’ என்று மூலத்தில் இல்லாத சொல்லைச் சேர்க்கவில்லை.
- source_word: ἔλαβον
  choice: பெற்றுக்கொண்டார்கள்
  rationale: கூலி வழங்கப்படும் சூழலில் ‘பெற்றுக்கொண்டார்கள்’ என்பது ἔλαβον என்பதன் பொருளை இயல்பாகவும் மரியாதையான நடையிலும் தருகிறது.
- source_word: ἀνὰ
  choice: தலா
  rationale: ஒவ்வொருவருக்கும் ஒன்று என்ற பகிர்வுப் பொருளைச் சுருக்கமாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: δηνάριον
  choice: ஒரு தினாரியம்
  rationale: வரலாற்று நாணயத்தின் பெயரை மொழிபெயர்ப்பில் பாதுகாக்கிறது; அதன் தோராயமான மதிப்பு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: καὶ
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: தமிழில் இவ்வாக்கியம் முந்தைய நிகழ்வின் தொடர்ச்சியாக இயல்பாக அமைகிறது; கட்டாயமாக ‘மேலும்’ அல்லது ‘பின்பு’ சேர்ப்பது மூலத்தில் இல்லாத வலியுறுத்தல் அல்லது காலநுட்பத்தை உண்டாக்கலாம்.
