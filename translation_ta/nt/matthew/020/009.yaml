  source_fidelity: மூலத்தின் ἐλθόντες, οἱ περὶ τὴν ἑνδεκάτην ὥραν, ἔλαβον, ἀνὰ δηνάριον ஆகிய கூறுகள் முறையே ‘வந்தவர்கள்,’ ‘பதினொன்றாம் மணியளவில்,’ ‘பெற்றுக்கொண்டார்கள்,’ ‘தலா ஒரு தினாரியம்’ எனத் துல்லியமாக வெளிப்பட்டுள்ளன. ‘வேலைக்கு அமர்த்தப்பட்டவர்கள்’ போன்ற சூழலிலிருந்து மட்டும் பெறப்படும் சொல்லைச் சேர்க்கவில்லை. καὶ-யைத் தனிச்சொல்லாக விடுத்திருப்பது தமிழின் இயல்பான தொடர்நடையில் பொருளிழப்பை ஏற்படுத்தவில்லை.
