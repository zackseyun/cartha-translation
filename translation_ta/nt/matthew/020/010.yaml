reference: Matthew 20:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂καὶ ἐλθόντες⸃ οἱ πρῶτοι ἐνόμισαν ὅτι ⸀πλεῖον λήμψονται· καὶ ἔλαβον ⸂τὸ ἀνὰ δηνάριον καὶ αὐτοί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/010.yaml
  text: When the first ones came[a], they thought they would receive more[b], but they too received a denarius each.
translation:
  language: ta
  text: முதலில் வேலைக்கு அமர்த்தப்பட்டவர்கள்[a] வந்தபோது, தங்களுக்கு அதிகமாகக் கிடைக்கும் என்று நினைத்தார்கள். ஆனால் அவர்களும் ஆளுக்கு ஒரு தினாரியம்[b] பெற்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முதலில் வந்தவர்கள்”; உவமையில் முதலில் வேலைக்கு அமர்த்தப்பட்ட தொழிலாளர்களை இது குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ஒரு தினாரியம் என்பது ஒரு தொழிலாளிக்குப் பொதுவாக வழங்கப்பட்ட ஒரு நாள் கூலி.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντες
  choice: வந்தபோது
  rationale: இறந்தகாலப் பெயரெச்சம் இங்கு காலத்தைக் குறிக்கிறது; இயல்பான தமிழில் ‘வந்தபோது’ என்று மொழிபெயர்ப்பது நிகழ்வுகளின் வரிசையைத் தெளிவாகக் காட்டுகிறது.
- source_word: οἱ πρῶτοι
  choice: முதலில் வேலைக்கு வந்தவர்கள்
  rationale: உவமையில் முதலில் வேலைக்கு அமர்த்தப்பட்ட தொழிலாளர்களைக் குறிக்கிறது. சூழலுக்குத் தேவையான ‘வேலைக்கு’ என்பதைக் கொண்டு, தமிழில் குறிப்பு தெளிவாக்கப்படுகிறது.
- source_word: ἐνόμισαν
  choice: நினைத்தார்கள்
  rationale: இங்கு எதிர்பார்ப்பு அல்லது ஊகத்தைக் குறிக்கிறது; உறுதியான முடிவைக் குறிக்காமல் இயல்பாக உள்ளது.
- source_word: πλεῖον
  choice: அதிகமாக
  rationale: கிடைக்கவிருந்த கூலியின் அளவு அதிகம் என்ற ஒப்பீட்டுப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: λήμψονται
  choice: கிடைக்கும்
  rationale: கடந்தகால ‘நினைத்தார்கள்’ என்பதன் உட்பொருளாக வரும் எதிர்கால எதிர்பார்ப்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὸ ἀνὰ δηνάριον
  choice: ஆளுக்கு ஒரு தினாரியமே
  rationale: ἀνά என்பதன் பகிர்வுப் பொருளை ‘ஆளுக்கு’ வெளிப்படுத்துகிறது; ‘ஒரு தினாரியம்’ ஒவ்வொருவரும் பெற்ற தொகையைத் தருகிறது. ‘-ஏ’ சமத்துவமான கூலியின் ஆச்சரியத்தை அடுத்துள்ள καὶ αὐτοί உடன் சேர்த்துக் காட்டுகிறது.
- source_word: καὶ αὐτοί
  choice: அவர்களும்
  rationale: பின்னர் வந்தவர்களைப் போல இவர்களும் அதே தொகையைப் பெற்றார்கள் என்ற வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
