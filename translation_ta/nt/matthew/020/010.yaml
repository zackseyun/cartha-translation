translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தினாரியம்’ என்ற வரலாற்று நாணயப் பெயர் தக்கவைக்கப்பட்டு, அதன் மதிப்பு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
