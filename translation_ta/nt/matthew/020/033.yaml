reference: Matthew 20:33
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ· Κύριε, ἵνα ⸂ἀνοιγῶσιν οἱ ὀφθαλμοὶ ἡμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/033.yaml
  text: They said to him[a], “Lord, let our eyes be opened.”
translation:
  language: ta
  text: அவர்கள் அவரிடம், “ஆண்டவரே[a], எங்கள் கண்கள் திறக்கப்படட்டும்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஐயா.”
    reason: κύριε என்பது சூழலின்படி ‘ஆண்டவரே’ அல்லது மரியாதை அழைப்பாக ‘ஐயா’ என்று பொருள்படலாம்.
lexical_decisions:
- source_word: λέγουσιν
  choice: என்றார்கள்
  rationale: கதைச் சூழலில் வரும் வரலாற்று நிகழ்காலத்தை, இயல்பான நவீனத் தமிழ் நடைக்கேற்ப இறந்தகாலமாக மொழிபெயர்க்கிறது.
- source_word: αὐτῷ
  choice: அவரிடம்
  rationale: இயேசுவை நோக்கிச் சொல்லப்பட்ட பதிலை இயல்பான தமிழில் குறிக்கிறது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: κύριος என்பதன் அழைப்புவேற்றுமையையும் மரியாதை மற்றும் அதிகாரம் சார்ந்த பொருள் வாய்ப்பையும் காக்கிறது; இங்கு ‘ஐயா’ என்பதும் சாத்தியம்.
- source_word: ἵνα
  choice: வேண்டும்
  rationale: வேண்டுகோளின் உள்ளடக்கத்தை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀνοιγῶσιν
  choice: திறக்கப்பட வேண்டும்
  rationale: இது இறந்தகாலச் செயலெச்ச வாய்ப்புநிலைச் செயப்பாட்டு வடிவம்; கண்கள் செயலைப் பெறுகின்றன என்பதைக் காக்க செயப்பாட்டு அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: οἱ ὀφθαλμοὶ ἡμῶν
  choice: எங்கள் கண்கள்
  rationale: உடைமைப் பொருளையும் பன்மையையும் நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
theological_decisions:
- issue: இயேசுவை நோக்கிய κύριος என்ற அழைப்பின் மொழிபெயர்ப்பு
  choice: ஆண்டவரே
  alternative: ஐயா
  rationale: ‘ஆண்டவரே’ என்பது மரியாதையையும் அதிகாரத்தையும் காக்கிறது; அதேவேளை இவ்வழைப்பு மட்டும் முழுமையான கிறிஸ்தியல் அறிக்கையைத் திணிப்பதில்லை. ‘ஐயா’ என்ற பொதுவான மரியாதை அழைப்பும் சொற்பொருள் அடிப்படையில் சாத்தியமானதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடை. கிரேக்கச் செயப்பாட்டு வடிவத்தைக் காக்க ‘திறக்கப்பட வேண்டும்’ பயன்படுத்தப்பட்டுள்ளது; வேண்டுகோளின் இயல்பைத் தமிழில் ‘வேண்டும்’ வெளிப்படுத்துகிறது.
