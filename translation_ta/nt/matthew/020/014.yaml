revisions:
- from: உனக்குரியதை எடுத்துக்கொண்டு போ. ஆனால் உனக்குக் கொடுத்தது போலவே கடைசியாக வந்த இவனுக்கும் கொடுக்க நான் விரும்புகிறேன்.
  to: உனக்குரியதை எடுத்துக்கொண்டு போ; ஆனால், இந்தக் கடைசியாக இருப்பவனுக்கும் உனக்குக் கொடுப்பதுபோலவே கொடுக்க நான் விரும்புகிறேன்.
  rationale: The revision removes the unsupported past tense and avoids explicitly supplying ‘came,’ while preserving the direct command, the mild contrast, the masculine singular personal reference, and the equality of what is given.
