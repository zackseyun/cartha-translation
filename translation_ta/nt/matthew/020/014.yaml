source:
  edition: SBLGNT
  text: ἆρον τὸ σὸν καὶ ὕπαγε· θέλω δὲ τούτῳ τῷ ἐσχάτῳ δοῦναι ὡς καὶ σοί·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/014.yaml
  text: Take what is yours and go[a]. But I want to give to this last man the same as to you.
translation:
  language: ta
  text: உனக்குரியதை எடுத்துக்கொண்டு போ; ஆனால், இந்தக் கடைசியாக இருப்பவனுக்கும் உனக்குக் கொடுப்பதுபோலவே கொடுக்க நான் விரும்புகிறேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἆρον
  choice: எடுத்துக்கொள்
  rationale: αἴρω என்பதன் இறந்தகாலக் கட்டளை வடிவம் இங்கு தனக்குரியதைப் பெற்றுக்கொண்டு செல்லுமாறு நேரடியாகக் கூறுகிறது; ‘எடுத்துக்கொள்’ இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: τὸ σὸν
  choice: உனக்குரியது
  rationale: இந்த நடுநிலைப் பெயரடைத்தொடர் சொல்லுக்கு சொல் ‘உன்னுடையது’ என்று பொருள்படும். சூழலில் கூலியைக் குறித்தாலும், கிரேக்கம் வெளிப்படையாகச் சொல்லாத ‘கூலி’ என்பதைச் சேர்க்காமல் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: ὕπαγε
  choice: போ
  rationale: ὑπάγω என்பதன் கட்டளை வடிவம் இங்கு அனுப்பிவைப்பதைக் குறிக்கிறது. ‘போ’ சுருக்கமாகவும் இயல்பாகவும் இருந்து, தேவையற்ற கடுமையைச் சேர்ப்பதில்லை.
- source_word: θέλω δὲ
  choice: ஆனால் ... நான் விரும்புகிறேன்
  rationale: θέλω விருப்பத்தையோ தீர்மானத்தையோ வெளிப்படுத்துகிறது; δέ குறிக்கும் மென்மையான முரண்பாட்டை ‘ஆனால்’ காட்டுகிறது.
- source_word: τούτῳ τῷ ἐσχάτῳ
  choice: கடைசியாக வந்த இவனுக்கு
  rationale: ἐσχάτῳ என்பதன் அடிப்படைப் பொருள் ‘கடைசியானவன்.’ உவமையின் சூழலில் வேலைக்கு கடைசியாக வந்த தொழிலாளியைக் குறிப்பது தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுகிறது.
- source_word: δοῦναι
  choice: கொடுக்க
  rationale: δίδωμι என்பதன் இயல்பான பொருள் ‘கொடு.’ சம்பளம் வழங்கும் சூழல் இருந்தாலும், ‘கூலியாகக் கொடுக்க’ என்று விரிவாக்காமல் மூலச்சொல்லின் பரப்பைத் தக்கவைக்கிறது.
- source_word: ὡς καὶ σοί
  choice: உனக்குக் கொடுத்தது போலவே
  rationale: ὡς καὶ σοί சமமான அளவில் வழங்கப்படுவதை உணர்த்துகிறது. தமிழில் ஒப்பீட்டை இயல்பாகத் தெளிவுபடுத்த வினை சூழலிலிருந்து நிரப்பப்பட்டுள்ளது.
theological_decisions:
- issue: ஆண்பால் ஒருமை நபரைக் குறிக்கும் தொடரின் மொழிபெயர்ப்பு
  choice: கடைசியாக வந்த இவன்
  alternative: இந்தக் கடைசியானவன்
  rationale: கிரேக்கத்தில் ஒரு ஆண் தொழிலாளியைக் குறிக்கும் ஆண்பால் ஒருமை வடிவங்கள் உள்ளன. ‘இவன்’ அந்த தனிநபர் குறிப்பைத் தக்கவைக்கிறது; ‘கடைசியாக வந்த’ என்பது உவமையின் சூழலில் ‘கடைசியானவன்’ என்பதன் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையான ஆனால் கண்ணியமான நேரடி உரை. ஒருமை நெருக்கச் சுட்டும் ‘உன்/உனக்கு’ வடிவங்கள் கிரேக்கத்தின் இரண்டாம் நபர் ஒருமையைத் தக்கவைக்கின்றன; பேச்சாளரின் நேரடியான தொனியும் பாதுகாக்கப்படுகிறது.
