source:
  edition: SBLGNT
  text: ⸀λέγοντες· Οὗτοι οἱ ἔσχατοι μίαν ὥραν ἐποίησαν, καὶ ἴσους ⸂αὐτοὺς ἡμῖν⸃ ἐποίησας τοῖς βαστάσασι τὸ βάρος τῆς ἡμέρας καὶ τὸν καύσωνα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/012.yaml
  text: saying[a], ‘These last worked one hour, and you made them equal to us who bore the burden of the day and the scorching heat.’
translation:
  language: ta
  text: “கடைசியாக வந்த இவர்கள் ஒரு மணி நேரம் மட்டுமே வேலை செய்தார்கள். ஆனால், முழு நாளின் பாரத்தையும் கொளுத்தும் வெயிலையும் தாங்கிய எங்களுக்கு இவர்களைச் சமமாக்கிவிட்டீரே[a]” என்று கூறினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களையும் எங்களையும் ஒரே விதமாக நடத்தினீரே.”
    reason: ἴσους ... ἐποίησας என்ற சொற்றொடரை நேரடியாக ‘சமமாக்கினீர்’ என்றும், செயல்பாட்டு பொருளில் ‘ஒரே விதமாக நடத்தினீர்’ என்றும் புரிந்துகொள்ளலாம்.
lexical_decisions:
- source_word: λέγοντες
  choice: என்று கூறினார்கள்
  rationale: இது முன் வசனத்தின் வினையோடு தொடர்புடைய நிகழ்காலப் பன்மைப் பெயரெச்சம். தமிழில் மேற்கோளின் முடிவில் ‘என்று கூறினார்கள்’ என அமைப்பது இயல்பான கதைநடையைத் தருகிறது.
- source_word: Οὗτοι οἱ ἔσχατοι
  choice: கடைசியாக வந்த இவர்கள்
  rationale: ἔσχατοι என்பது உவமையில் கடைசியாக வேலைக்கு அமர்த்தப்பட்டவர்களைக் குறிக்கிறது; ‘வந்த’ என்பது சூழலால் தெளிவாகும் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: μίαν ὥραν ἐποίησαν
  choice: ஒரு மணி நேரம் மட்டுமே வேலை செய்தார்கள்
  rationale: கால அளவோடு வரும் ποιέω இங்கு அந்த நேரம் வேலை செய்ததைக் குறிக்கிறது. ‘மட்டுமே’ என்பது முதலில் வந்த தொழிலாளர்களின் ஒப்பீட்டுப் புகாரில் உள்ள வலியுறுத்தலை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἴσους αὐτοὺς ἡμῖν ἐποίησας
  choice: எங்களுக்கு இவர்களைச் சமமாக்கிவிட்டீரே
  rationale: கிரேக்கச் சொற்றொடரின் ‘எங்களுக்குச் சமமாக அவர்களை ஆக்கினீர்’ என்ற நேரடிப் பொருளையும் புகாரின் உணர்வையும் இது காக்கிறது.
- source_word: τοῖς βαστάσασι
  choice: தாங்கிய எங்களுக்கு
  rationale: βαστάζω இங்கு உடல் உழைப்பின் பாரத்தைச் சுமத்தல் மற்றும் கடும் வெப்பத்தைச் சகித்தல் ஆகிய இரு நுணுக்கங்களையும் கொண்டுள்ளது; ‘தாங்கிய’ இரண்டுக்கும் பொருந்துகிறது.
- source_word: τὸ βάρος τῆς ἡμέρας
  choice: நாள் முழுவதும் வேலையின் பாரம்
  rationale: βάρος என்பதிலுள்ள பாரம் என்ற உருவகத்தைத் தக்கவைத்தபடி, முழு வேலைநாளின் கடின உழைப்பை நவீன தமிழில் தெளிவாக்குகிறது.
- source_word: τὸν καύσωνα
  choice: கொளுத்தும் வெயில்
  rationale: καύσων குறிக்கும் ஒடுக்குகிற கடும் வெப்பத்தை ‘கொளுத்தும் வெயில்’ இயல்பாகவும் வலிமையாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: நியாயம் மற்றும் சமத்துவம் குறித்த உவமைப் புகார்
  choice: தொழிலாளர்களின் புகாரை அதன் நேரடியான வலிமையுடன் மொழிபெயர்த்து, அவர்களை ‘சமமாக்கியதாக’ கூறுதல்
  alternative: முதலாளி அவர்களை அநியாயமாக நடத்தியதாக வெளிப்படையாக விளக்கிச் சொல்லுதல்
  rationale: இந்த வசனம் தொழிலாளர்களின் புகாரைப் பதிவு செய்கிறது; விரிவான இறையியல் கருத்தை மொழிபெயர்ப்புக்குள் சேர்க்காமல், உவமையிலுள்ள நியாயம் குறித்த பதற்றத்தை அப்படியே விட வேண்டும்.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘சமமாக்கிவிட்டீரே’ மற்றும் ‘கொளுத்தும் வெயில்’ ஆகியவை புகாரின் உணர்ச்சியையும் மூலத்தின் தீவிரத்தையும் காக்கின்றன.
