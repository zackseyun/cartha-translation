id: MAT.20.30
reference: Matthew 20:30
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ δύο τυφλοὶ καθήμενοι παρὰ τὴν ὁδόν, ἀκούσαντες ὅτι Ἰησοῦς παράγει, ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/030.yaml
  text: And behold, two blind men sitting by the road, when they heard that Jesus was passing by, cried out, saying, “Lord, have mercy on us, Son of David.”
translation:
  language: ta
  text: இதோ, சாலையோரத்தில் அமர்ந்திருந்த பார்வையற்ற இரு மனிதர்கள், இயேசு அந்த வழியாகச் செல்கிறார் என்று கேள்விப்பட்டதும், “ஆண்டவரே, எங்களுக்கு இரங்கும், தாவீதின் மகனே!” என்று உரக்கக் கூப்பிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கதையில் வாசகரின் கவனத்தைத் திருப்பும் சொல்லாகவும் நிகழ்வுக்கு உயிரோட்டம் தரும் குறியீடாகவும் உள்ள கிரேக்கச் சொல்லின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: δύο τυφλοὶ
  choice: பார்வையற்ற மனிதர்கள் இருவர்
  rationale: குறிப்பிட்ட இரண்டு ஆண்களைச் சுட்டும் ஆண்பால் பன்மையைத் துல்லியமாகக் காட்டுகிறது; நவீனத் தமிழில் மரியாதையானதும் தெளிவானதுமான சொற்றொடர்.
- source_word: καθήμενοι παρὰ τὴν ὁδόν
  choice: சாலையோரத்தில் உட்கார்ந்திருந்த
  rationale: அவர்கள் இருந்த உடல் நிலையும் இடமும் இயல்பான நவீனத் தமிழில் நேரடியாக வெளிப்படுகின்றன.
- source_word: ἀκούσαντες ὅτι Ἰησοῦς παράγει
  choice: இயேசு அவ்வழியாகச் சென்றுகொண்டிருக்கிறார் என்று கேள்விப்பட்டதும்
  rationale: இறந்தகால வினையெச்சத்தின் காலத் தொடர்பை ‘கேள்விப்பட்டதும்’ என்றும், நிகழ்ந்துகொண்டிருந்த கடந்து செல்லுதலை ‘சென்றுகொண்டிருக்கிறார்’ என்றும் வெளிப்படுத்துகிறது.
- source_word: ἔκραξαν
  choice: உரக்கக் கூப்பிட்டார்கள்
  rationale: குரலின் தீவிரத்தைக் காக்கிறது; அதே நேரத்தில் சாதாரண வாசகருக்கு இயல்பான தமிழாக உள்ளது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: நேரடி அழைப்பின் மரியாதையையும், அடுத்து வரும் தாவீதிய மேசியா பட்டத்துடன் தொடர்புடைய இறையியல் நிறையையும் குறைக்காமல் காக்கிறது.
- source_word: ἐλέησον ἡμᾶς
  choice: எங்களுக்கு இரங்கும்
  rationale: இரக்கத்தோடு உதவுமாறு விடுக்கும் கட்டளை வடிவிலான வேண்டுதலைச் சுருக்கமாகவும் மரபான உயர்தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: υἱὸς Δαυίδ
  choice: தாவீதின் மகனே
  rationale: மத்தேயுவில் மேசியாவைக் குறிக்கும் பட்டத்தின் தாவீதிய மற்றும் அரச மரபுச் சார்பை அப்படியே காக்கிறது.
theological_decisions:
- issue: இயேசுவை நேரடியாக அழைக்கும் κύριος என்பதன் பொருள்
  choice: ஆண்டவரே
  alternative: ஐயா
  rationale: ‘தாவீதின் மகனே’ என்ற மேசியா பட்டத்துடன் இணைந்துள்ளதால், வெறும் மரியாதை அழைப்பாகக் குறுக்காமல் அதன் பயபக்தி மற்றும் சாத்தியமான கிறிஸ்துவியல் நிறையைப் பாதுகாக்கிறது.
- issue: υἱὸς Δαυίδ என்பதன் மேசியா சார்ந்த வலிமை
  choice: தாவீதின் மகனே
  alternative: தாவீதின் வழிவந்தவரே
  rationale: இதை வெறும் வம்சாவளிக் குறிப்பாக மாற்றாமல், மத்தேயு பயன்படுத்தும் நிலையான மேசியா பட்டமாகப் பாதுகாக்கிறது.
- issue: இரு அழைப்புச் சொற்களின் வரிசை
  choice: ஆண்டவரே, தாவீதின் மகனே, எங்களுக்கு இரங்கும்
  alternative: ஆண்டவரே, எங்களுக்கு இரங்கும், தாவீதின் மகனே
  rationale: கிரேக்கத்தில் இரண்டாவது அழைப்புச் சொல் வேண்டுதலுக்குப் பின் வந்தாலும், தமிழில் இரு அழைப்புகளையும் வேண்டுதலுக்கு முன் வைப்பது இயல்பாகவும் தெளிவாகவும் உள்ளது; அவை ஒரே நபரான இயேசுவைக் குறிக்கின்றன என்பதும் மாறவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகருக்குப் புரியும் இயல்பான நடை, அதே நேரத்தில் நேரடி வேண்டுதலுக்கு ஏற்ற கண்ணியமான உயர்வு. பாலினத்தைக் காட்ட ‘மனிதர்கள்’ பயன்படுத்தப்பட்டுள்ளது; குறைபாட்டை மரியாதையுடன் குறிப்பிட ‘பார்வையற்ற’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
