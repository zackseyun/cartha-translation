revisions:
- from: இதோ, சாலையோரத்தில் உட்கார்ந்திருந்த பார்வையற்ற மனிதர்கள் இருவர், இயேசு அவ்வழியாகச் சென்றுகொண்டிருக்கிறார் என்று கேள்விப்பட்டதும், “ஆண்டவரே, தாவீதின் மகனே, எங்களுக்கு இரங்கும்!” என்று உரக்கக் கூப்பிட்டார்கள்.
  to: இதோ, சாலையோரத்தில் அமர்ந்திருந்த பார்வையற்ற இரு மனிதர்கள், இயேசு அந்த வழியாகச் செல்கிறார் என்று கேள்விப்பட்டதும், “ஆண்டவரே, எங்களுக்கு இரங்கும், தாவீதின் மகனே!” என்று உரக்கக் கூப்பிட்டார்கள்.
