  text: Καὶ ἀκούσαντες οἱ δέκα ἠγανάκτησαν περὶ τῶν δύο ἀδελφῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/024.yaml
  text: And when the ten heard it, they became indignant about the two brothers.
translation:
  language: ta
  text: அதைக் கேட்டபோது, மற்ற பத்துப் பேரும் அந்த இரண்டு சகோதரர்களைக் குறித்து கோபமடைந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δέκα
  choice: மற்ற பத்துப் பேரும்
  rationale: சூழலில் குறிப்பிடப்படுவது மீதமுள்ள பத்து சீடர்கள்; தமிழில் இயல்பாகப் புரிய ‘மற்ற’ சேர்க்கப்பட்டது. ‘பேர்’ மனிதர்களைக் குறிக்கும் இயல்பான நவீன நடை.
- source_word: ἠγανάκτησαν
  choice: கடுங்கோபம் கொண்டார்கள்
  rationale: இந்த வினை வெறும் எரிச்சலை அல்ல, வலுவான அதிருப்தி கலந்த கோபத்தைக் குறிக்கிறது; இத்தொடர் அதன் தீவிரத்தை இயல்பான தமிழில் தருகிறது.
- source_word: περὶ τῶν δύο ἀδελφῶν
  choice: அந்த இரண்டு சகோதரர்கள்மீது
  rationale: περί இங்கு கோபம் நோக்கிச் செலுத்தப்பட்ட நபர்களைக் குறிக்கிறது. ‘மீது’ என்பது தமிழில் அந்த உறவை இயல்பாக வெளிப்படுத்துகிறது; சகோதரர்களைப் பற்றிய விவகாரமே காரணம் என்ற சூழலுணர்வும் மறுக்கப்படவில்லை.
theological_decisions:
- issue: சீடர்களின் கோபம் யாரை நோக்கியது அல்லது எதைப் பற்றியது
  choice: அந்த இரண்டு சகோதரர்கள்மீது
  alternative: அந்த இரண்டு சகோதரர்களைப் பற்றி
  rationale: περί + genitive சில நெகிழ்வைக் கொண்டிருந்தாலும், ἀγανακτέω உடன் நபர்களைக் குறிக்கும் இவ்வமைப்பில் ‘அவர்கள்மீது கோபம்’ என்பது இயல்பான பொருள். எந்த மறைமுக உள்நோக்கத்தையும் வசனத்தில் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; சுருக்கமான, கண்ணியமான, பொதுவாசகருக்கு எளிதில் புரியும் நடை. மூலத்தின் தொடர் அமைப்பும் உணர்ச்சித் தீவிரமும் இயல்பான தமிழில் பாதுகாக்கப்பட்டுள்ளன.
