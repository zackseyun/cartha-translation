revisions:
- from: அதைக் கேட்ட மற்ற பத்துப் பேரும் அந்த இரண்டு சகோதரர்கள்மீது கடுங்கோபம் கொண்டார்கள்.
  to: அதைக் கேட்டபோது, மற்ற பத்துப் பேரும் அந்த இரண்டு சகோதரர்களைக் குறித்து கோபமடைந்தார்கள்.
  rationale: The revision preserves the contextual identification of the ten while representing περί + genitive with the noncommittal and natural Tamil expression “குறித்து,” in line with the English POB audit trail’s “about.” It also avoids adding an unnecessary degree of anger.
