    text: அல்லது, ‘அவர்கள் எரிகோவைவிட்டுப் புறப்பட்டபோது.’
    reason: lexical_alternative
  revision_rationale: The revision makes only a small aspectual adjustment to reflect the Greek present participle in the temporal clause. It retains the source text’s plural ‘they’ and singular ‘him,’ and keeps the alternative footnote anchored to the temporal expression.
