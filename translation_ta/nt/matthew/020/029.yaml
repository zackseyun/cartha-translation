  text: Καὶ ἐκπορευομένων αὐτῶν ἀπὸ Ἰεριχὼ ἠκολούθησεν αὐτῷ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/029.yaml
  text: And as they were going out from Jericho[a], a large crowd followed him.
translation:
  language: ta
  text: அவர்கள் எரிகோவிலிருந்து புறப்பட்டுச் செல்லும்போது[a], பெருந்திரளான மக்கள் அவரைப் பின்தொடர்ந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்கள் எரிகோவைவிட்டுப் புறப்பட்டபோது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένων
  choice: புறப்பட்டுச் சென்றபோது
  rationale: நிகழ்காலப் பங்கேற்புவினைச்சொல்லின் காலச்சூழலையும் தொடர்ந்து நிகழும் இயக்கத்தையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀπὸ Ἰεριχὼ
  choice: எரிகோவிலிருந்து
  rationale: ἀπό இங்கு ஓர் இடத்திலிருந்து விலகிச் செல்லும் இயக்கத்தின் தொடக்க இடத்தைக் குறிக்கிறது; ‘எரிகோவிலிருந்து’ என்பது இயல்பான தமிழ்.
- source_word: ἠκολούθησεν
  choice: பின்தொடர்ந்தார்கள்
  rationale: ἀκολουθέω என்பதன் சூழலுக்கேற்ற அடிப்படைப் பொருளான ஒருவருக்குப் பின்னால் செல்வதைத் தெளிவாகக் காட்டுகிறது; எழுவாய் கூட்டுப் பெயராக இருப்பதால் தமிழில் மரியாதை அல்லாத பன்மை வினைமுற்று பயன்படுத்தப்பட்டுள்ளது.
- source_word: αὐτῷ
  choice: அவரை
  rationale: கிரேக்க ஒருமைச் சுட்டுப்பெயர் சூழலில் இயேசுவைக் குறிக்கிறது. முன் வரும் ‘அவர்கள்’ என்ற பன்மையிலிருந்து ஒருமைக்கு ஏற்படும் மாற்றம் அழிக்கப்படவில்லை.
- source_word: ὄχλος πολύς
  choice: பெருந்திரளான மக்கள்
  rationale: கூட்டத்தின் எண்ணிக்கை மிகுதியை நவீன வாசகர்களுக்கு இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: பன்மை பங்கேற்புவினைச்சொல்லுக்குப் பின் வரும் αὐτῷ என்ற ஒருமைச் சுட்டுப்பெயரின் குறிப்பு
  choice: மக்கள் இயேசுவைப் (‘அவரை’) பின்தொடர்ந்தார்கள்.
  alternative: மக்கள் அந்தக் குழுவைப் (‘அவர்களை’) பின்தொடர்ந்தார்கள்.
  rationale: கிரேக்க உரை முதலில் ‘அவர்கள் புறப்பட்டபோது’ என்று பன்மையில் கூறிவிட்டு, பின்னர் ‘அவரைப் பின்தொடர்ந்தார்கள்’ என்று ஒருமைக்கு மாறுகிறது. சூழலில் இது இயேசுவை மையப்படுத்துகிறது; அந்த மாற்றத்தை மொழிபெயர்ப்பு சமப்படுத்தாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியக்கூடிய, இயல்பான, கண்ணியமான நடை. ‘அவர்கள்’ என்பதிலிருந்து ‘அவரை’ என்பதற்கான மூல உரையின் எண்ணிக்கை மாற்றம் பாதுகாக்கப்பட்டுள்ளது.
