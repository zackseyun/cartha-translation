translation_notes:
  register: நவீன தரமான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் நேரக் குறிப்பு முதன்மை உரையில் பாதுகாக்கப்பட்டு விளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது; ἀργούς என்பதில் தேவையற்ற ஒழுக்கக் குற்றச்சாட்டு தவிர்க்கப்பட்டுள்ளது.
