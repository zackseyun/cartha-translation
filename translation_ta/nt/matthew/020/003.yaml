source:
  edition: SBLGNT
  text: καὶ ἐξελθὼν περὶ τρίτην ὥραν εἶδεν ἄλλους ἑστῶτας ἐν τῇ ἀγορᾷ ἀργούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/003.yaml
  text: And going out about the third hour[b][a], he saw others standing idle in the marketplace.
translation:
  language: ta
  text: அவர் மூன்றாம் மணியளவில்[a] வெளியே சென்று, சந்தையில் வேலை செய்யாமல்[b] நின்றுகொண்டிருந்த மற்றவர்களைக் கண்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘காலையில் ஏறக்குறைய ஒன்பது மணிக்கு.’ ‘மூன்றாம் மணியளவு’ என்பது சூரிய உதயத்திலிருந்து பகல் நேரத்தைக் கணக்கிடும் யூத முறையைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘வேலையில்லாமல்.’ கிரேக்கச் சொல் அவர்கள் அப்போது வேலை செய்துகொண்டிருக்கவில்லை என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: வெளியே போனபோது
  rationale: இறந்தகாலப் பங்கேற்புவினையின் தொடர்ச்சியான நிகழ்வை இயல்பான தமிழில் காலத்தொடர் வாக்கியமாகக் காட்டுகிறது.
- source_word: περὶ τρίτην ὥραν
  choice: ஏறக்குறைய மூன்றாம் மணிநேரத்தில்
  rationale: மூலத்தின் யூத நேரக் கணக்கீட்டு முறையை முதன்மை உரையில் வெளிப்படையாகப் பாதுகாக்கிறது; நவீன நேர மதிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: εἶδεν
  choice: கண்டார்
  rationale: ὁράω என்பதன் எளிய இறந்தகாலக் கதைநடைப் பொருளை நேரடியாகத் தருகிறது.
- source_word: ἄλλους
  choice: வேறு சிலரை
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட அடைமொழியை இயல்பான தமிழில் தருகிறது; மூலத்தில் இல்லாத பாலினக் குறிப்பைச் சேர்க்கவில்லை.
- source_word: ἑστῶτας
  choice: நின்றுகொண்டிருந்த
  rationale: நின்ற நிலையில் இருந்ததைக் குறிக்கும் பங்கேற்புவினையின் நிலைத்தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀγορᾷ
  choice: சந்தைவெளியில்
  rationale: வேலையாட்கள் கூடக்கூடிய பொது சந்தைப் பகுதியைக் குறிக்கும் ἀγορά என்பதற்கு தெளிவான, சூழலுக்கேற்ற தமிழ் சொல்.
- source_word: ἀργούς
  choice: வேலை செய்யாமல்
  rationale: அவர்கள் அப்போது வேலை செய்துகொண்டிருக்கவில்லை என்ற ἀργός என்பதன் சூழல்சார் பொருளைத் தெளிவாகத் தருகிறது; சோம்பேறிகள் என்ற ஒழுக்கத் தீர்ப்பையோ நவீன பொருளாதார வகைப்பாட்டையோ திணிக்கவில்லை.
