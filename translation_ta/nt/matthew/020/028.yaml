id: MAT.20.28
reference: Matthew 20:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὥσπερ ὁ υἱὸς τοῦ ἀνθρώπου οὐκ ἦλθεν διακονηθῆναι ἀλλὰ διακονῆσαι καὶ δοῦναι τὴν ψυχὴν αὐτοῦ λύτρον ἀντὶ πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/028.yaml
  text: just as the Son of Man did not come to be served[a], but to serve, and to give his life as a ransom for many.
translation:
  language: ta
  text: அப்படியே, மனிதகுமாரன் சேவை பெறுவதற்காக வரவில்லை; மாறாக, சேவை செய்வதற்காகவும், பலருக்காக[a] தம் உயிரை மீட்புவிலையாகக் கொடுப்பதற்காகவும் வந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் வெளிப்படையாக, ‘தம் உயிரை பலருக்குப் பதிலாக மீட்புவிலையாக’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ
  choice: அப்படியே
  rationale: முந்தைய போதனையுடன் இவ்வசனத்தை ஒப்பிடும் இணைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: இயேசுவின் சுயகுறிப்பாகவும் தானியேல் நூலுடனான தொடர்பைக் காக்கும் நிலைபெற்ற தமிழ்ச் சொற்றொடராகவும் உள்ளது.
- source_word: οὐκ ἦλθεν
  choice: வரவில்லை
  rationale: இறந்தகால வினையின் எளிய மறுப்பை, மூலத்தில் இல்லாத இடம் அல்லது காலநிலைத் தகவலைச் சேர்க்காமல் தருகிறது.
- source_word: διακονηθῆναι
  choice: பணிவிடை பெறுவதற்காக
  rationale: செயப்பாட்டு வடிவத்தைத் தெளிவாகக் காத்து, சமயப் பணிப் பதவியை மட்டும் குறிக்காமல் பொதுவான சேவையை உணர்த்துகிறது.
- source_word: ἀλλὰ διακονῆσαι
  choice: மாறாக, பணிவிடை செய்வதற்காக
  rationale: முந்தைய செயப்பாட்டு வடிவத்துடனான நேரடியான முரணைக் காக்கிறது.
- source_word: καὶ δοῦναι
  choice: கொடுப்பதற்காகவும்
  rationale: முந்தைய நோக்க வினையுடன் இதையும் இணைத்து, மூலத்தின் எளிய ‘கொடு’ என்ற பொருளைக் காக்கிறது.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: தம் உயிரை
  rationale: இச்சூழலில் ψυχή என்பது உடலற்ற ஆன்மாவை மட்டும் அல்லாமல் மரணத்திற்கு ஒப்புக்கொடுக்கப்படும் உயிரைக் குறிக்கிறது.
- source_word: λύτρον
  choice: மீட்புவிலையாக
  rationale: ஒருவரை விடுவிப்பதற்காகச் செலுத்தப்படும் விலை என்ற சொல்லின் மையப் பொருளைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: ἀντὶ πολλῶν
  choice: பலருக்காக
  rationale: இயல்பான தமிழில் பயனாளி அல்லது பிரதிநிதித்துவத்தைக் காட்டுகிறது; ἀντί என்பதிலுள்ள பதிலீட்டின் வலுவான நுணுக்கம் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: மீட்புக் கூற்றில் ἀντί என்பதன் வலிமை
  choice: முதன்மை உரையில் இயல்பான ‘பலருக்காக’ என்று வழங்கி, பதிலீட்டு நுணுக்கத்தை அடிக்குறிப்பில் தெளிவுபடுத்துதல்
  alternative: பலருக்குப் பதிலாக
  rationale: இவ்வசனம் இயேசுவின் உயிரளிப்பை பிறரின் நன்மைக்காகவும் அவர்களுக்குப் பதிலாகவும் நிகழ்வதாகக் காட்டுகிறது. தமிழில் ‘பலருக்காக’ இயல்பாக இருந்தாலும், பரிமாற்றம் அல்லது பதிலீடு என்ற ἀντί-யின் சாத்தியமான வலிமை மறைக்கப்படாமல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘பணிவிடை பெறுதல்/செய்தல்’ என்ற இணைச் சொற்கள் கிரேக்கத்தில் உள்ள செயப்பாட்டு–செய்வினை முரணைக் காக்கின்றன; இறுதியில் ‘வந்தார்’ மீண்டும் சேர்க்கப்படுவது தமிழ்ச் சொற்றொடரின் தெளிவுக்காகும்.
