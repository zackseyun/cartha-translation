revisions:
- from: அப்படியே, மனிதகுமாரன் பணிவிடை பெறுவதற்காக வரவில்லை; மாறாக, பணிவிடை செய்வதற்காகவும், பலருக்காக[a] தம் உயிரை மீட்புவிலையாகக் கொடுப்பதற்காகவும் வந்தார்.
  to: அப்படியே, மனிதகுமாரன் சேவை பெறுவதற்காக வரவில்லை; மாறாக, சேவை செய்வதற்காகவும், பலருக்காக[a] தம் உயிரை மீட்புவிலையாகக் கொடுப்பதற்காகவும் வந்தார்.
  rationale: The revision improves contemporary Tamil idiom by using the matched pair ‘சேவை பெறுதல்/செய்தல்,’ while retaining the passive–active contrast in διακονηθῆναι / διακονῆσαι. It also supplies a complete alternative in the footnote to document the explicit ‘in place of many’ force of ἀντί without making that interpretively stronger wording mandatory in the main text.
