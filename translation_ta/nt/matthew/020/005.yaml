  text: οἱ δὲ ἀπῆλθον. ⸀πάλιν ἐξελθὼν περὶ ἕκτην καὶ ἐνάτην ὥραν ἐποίησεν ὡσαύτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/005.yaml
  text: So they went away. Going out again about the sixth and ninth hour[a], he did likewise.
translation:
  language: ta
  text: அவர்கள் போனார்கள். அவர் மறுபடியும் ஏறக்குறைய ஆறாம் மணி மற்றும் ஒன்பதாம் மணி நேரங்களில்[a] வெளியே போய், அதேபோலச் செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, யூதர்களின் நேரக் கணக்கின்படி ஏறக்குறைய நண்பகல் மற்றும் பிற்பகல் மூன்று மணி.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ ἀπῆλθον
  choice: அவர்களும் போனார்கள்
  rationale: οἱ என்பது முன்பு குறிப்பிடப்பட்ட வேலையாட்களைக் குறிக்கிறது; δέ இங்கு மென்மையான தொடர்ச்சியைத் தருவதால் தமிழில் ‘-உம்’ இயல்பாக அமைகிறது; ἀπῆλθον என்பதற்கு ‘போனார்கள்’ என்பது தெளிவான நவீன நடை.
- source_word: πάλιν
  choice: மறுபடியும்
  rationale: மீண்டும் நிகழ்ந்த செயலை நேரடியாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: ἐξελθὼν
  choice: வெளியே போய்
  rationale: இறந்தகாலப் பங்கேற்புவினையின் தொடர்ச்சியான நிகழ்வைத் தமிழில் இயல்பான வினையெச்சமாகக் காட்டுகிறது; கால உறவைத் தேவையின்றி மிகத் துல்லியமாக நிர்ணயிக்கவில்லை.
- source_word: περὶ ἕκτην καὶ ἐνάτην ὥραν
  choice: ஏறக்குறைய ஆறாம் மணியிலும் ஒன்பதாம் மணியிலும்
  rationale: περί என்பதன் தோராயப் பொருளை ‘ஏறக்குறைய’ காட்டுகிறது. மூலப் பண்பாட்டின் நேரக் கணக்கை முதன்மை உரையில் காத்து, இன்றைய நேர மதிப்பை அடிக்குறிப்பில் விளக்குகிறது.
- source_word: ἐποίησεν ὡσαύτως
  choice: அதேபோலச் செய்தார்
  rationale: ποιέω என்பதன் பொதுவான செயற்பொருளையும் ὡσαύτως என்பதன் ஒப்பீட்டுப் பொருளையும் இணைத்து, சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘ஆறாம் மணி’, ‘ஒன்பதாம் மணி’ என்ற பண்பாட்டு நேரக் குறிப்பு பாதுகாக்கப்பட்டு, வாசகருக்கான நவீன நேர விளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
