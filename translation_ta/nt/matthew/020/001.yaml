  source_fidelity: மூலத்தின் முக்கிய உவமை அமைப்பும், அதிகாலை புறப்படுதலும், கூலிக்கு ஆட்களை அமர்த்துதலும், திராட்சைத்தோட்டமும் வரைவு உரையில் உள்ளன. ஆனால் ἐργάτας என்பது கூலித் தொழிலாளர்களைக் குறிக்கும் நிலையில், «வேலைக்காரர்கள்» என்பது வீட்டுப் பணியாளர்கள்/சேவகர்கள் என்ற பொருளையும் தரக்கூடும். மேலும் βασιλείαக்கு «அரசாங்கம்» என்பது ஒரு நவீன நிர்வாக அமைப்பைக் குறிக்கும்; இவ்விடத்தின் ‘kingdom/reign’ பொருளுக்கு அது துல்லியமானதல்ல.
  naturalness: «பரலோக அரசாங்கம்» நவீன தமிழில் அரசுத் துறைகள் அல்லது நிர்வாக இயந்திரம் என்ற எண்ணத்தைத் தூண்டுகிறது. «பரலோக ராஜ்யம்» நவீன நிலையான தமிழிலும் வேதாகமப் பயன்பாட்டிலும் இயல்பான, தெளிவான சொல்லாட்சியாகும். திருத்தப்பட்ட வாக்கியம் இயல்பான ஓட்டத்துடன் மூலத்தின் நோக்கத்தையும் காக்கிறது.
  terminology: βασιλεία τῶν οὐρανῶν என்பதற்கு «பரலோக ராஜ்யம்»; ἐργάτας என்பதற்கு «தொழிலாளர்கள்» பயன்படுத்தப்பட்டுள்ளன. οἰκοδεσπότῃயின் வீட்டு-தலைமை/உரிமையாளர் நுணுக்கத்தை «வீட்டின் தலைவரான» பாதுகாக்கிறது; இதை நிலஉரிமையாளர் என்று விரிவுபடுத்தவில்லை.
