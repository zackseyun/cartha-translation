  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὁμοία γάρ ἐστιν ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐξῆλθεν ἅμα πρωῒ μισθώσασθαι ἐργάτας εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/001.yaml
  text: For the kingdom of heaven is like a man, a master of a house, who went out early in the morning to hire workers for his vineyard.
translation:
  language: ta
  text: ஏனெனில், பரலோக ராஜ்யம் தன் திராட்சைத்தோட்டத்திற்குத் தொழிலாளர்களைக் கூலிக்கு அமர்த்துவதற்காக அதிகாலையில் புறப்பட்டுச் சென்ற வீட்டின் தலைவரான ஒரு மனிதனைப் போன்றது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: பரலோக அரசாங்கம்
  rationale: βασιλεία என்பதன் ஆட்சி/அரசாட்சி சார்ந்த பொருளைத் தெளிவாகக் காட்டுகிறது; மத்தேயுவின் வழக்கமான τῶν οὐρανῶν சொல்லாட்சியையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: வீட்டுத் தலைவரான ஒரு மனிதர்
  rationale: ἀνθρώπῳ என்பதையும் οἰκοδεσπότῃ என்பதையும் விடாமல், ஒரே நபரை விளக்கும் கிரேக்க அமைப்பைப் பேணுகிறது.
- source_word: ἅμα πρωῒ
  choice: அதிகாலையிலேயே
  rationale: மிகவும் காலையிலேயே என்ற நேர வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: μισθώσασθαι ἐργάτας
  choice: வேலைக்காரர்களைக் கூலிக்கு அமர்த்த
  rationale: μισθόω-வின் கூலிக்காக வேலைக்கு அமர்த்துதல் என்ற பொருளை வெளிப்படையாகத் தருகிறது.
- source_word: ἀμπελῶνα
  choice: திராட்சைத்தோட்டம்
  rationale: திராட்சைக் கொடிகள் பயிரிடப்படும் vineyard என்பதற்கான தெளிவான, பொதுவான தமிழ் சொல்.
theological_decisions:
- issue: Ὁμοία ... ἀνθρώπῳ οἰκοδεσπότῃ என்ற உவமைத் தொடர்பு
  choice: அரசாங்கம் வீட்டுத் தலைவரான மனிதரைப் போன்றது என்று நேரடியாக வைத்தல்
  alternative: அரசாங்கம் அந்த மனிதரின் செயல்கள் அல்லது முழுக் கதையைப் போன்றது என்று விரிவாக்குதல்
  rationale: மூலத்தில் உள்ள நேரடி இலக்கண ஒப்புமையையும் அதன் சாத்தியமான உவமைத் தளர்வையும் விளக்கிச் சீராக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பானதும் கண்ணியமானதுமான நடை. வசனத்தின் தொடக்கத்திலுள்ள γάρ ‘ஏனெனில்’ என்று மொழிபெயர்க்கப்பட்டு முந்தைய உரையோட்டத்துடனான தொடர்பு பேணப்பட்டுள்ளது.
