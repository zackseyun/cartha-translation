id: MAT.20.34
reference: Matthew 20:34
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: σπλαγχνισθεὶς δὲ ὁ Ἰησοῦς ἥψατο τῶν ⸀ὀμμάτων αὐτῶν, καὶ εὐθέως ⸀ἀνέβλεψαν καὶ ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/034.yaml
  text: And Jesus[a], moved with compassion, touched their eyes, and immediately they received their sight and followed him.
translation:
  language: ta
  text: இயேசு மனம் உருகி, அவர்களுடைய கண்களைத் தொட்டார். உடனே அவர்கள் பார்வை பெற்றார்கள்[a]; அவரைப் பின்தொடர்ந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மீண்டும் பார்வை பெற்றார்கள்’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்க வினை, ‘பார்வையை மீண்டும் பெறுதல்’ அல்லது சொற்படியாக ‘மேலே பார்த்தல்’ என்று பொருள்படலாம்; இந்தச் சூழலில் இது பார்வை கிடைத்ததைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: மனம் உருகி
  rationale: ஆழ்ந்த இரக்கத்தால் உள்ளம் நெகிழ்ந்ததை இயல்பான, உணர்வாற்றல் கொண்ட தமிழில் தெரிவிக்கிறது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது கதைநடையை மெதுவாக முன்னெடுக்கும் இணைப்புச் சொல். தமிழில் வாக்கியத் தொடர்ச்சியே அந்தப் பணியை இயல்பாகச் செய்கிறது; ‘ஆனால்’ என்பது இல்லாத முரண்பாட்டை உருவாக்கும்.
- source_word: ἥψατο
  choice: தொட்டார்
  rationale: குணமாக்கும் இச்சூழலில் உடல்ரீதியாகத் தொடுவதைக் குறிக்கும் நேரான, இயல்பான சொல்.
- source_word: τῶν ὀμμάτων αὐτῶν
  choice: அவர்களுடைய கண்களை
  rationale: கிரேக்கத்தில் வினையுடன் வரும் வேற்றுமை அமைப்பைத் தமிழில் இயல்பான செயப்படுபொருள் வடிவில் தருகிறது.
- source_word: εὐθέως
  choice: உடனே
  rationale: இயேசு தொட்டதன் விளைவு தாமதமின்றி நிகழ்ந்ததைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀνέβλεψαν
  choice: பார்வை பெற்றார்கள்
  rationale: குருடர்களைக் குணமாக்கும் உடனடிச் சூழலில் பார்வை கிடைத்ததைக் குறிக்கிறது. கிரேக்க வினையின் ‘மீண்டும் பார்வை பெற்றார்கள்’ அல்லது சொற்படியாக ‘மேலே பார்த்தார்கள்’ என்ற சாத்தியங்களை அடிக்குறிப்பு பதிவு செய்கிறது.
- source_word: ἠκολούθησαν αὐτῷ
  choice: அவரைப் பின்தொடர்ந்தார்கள்
  rationale: அவர்கள் இயேசுவுக்குப் பின்னால் சென்றார்கள் என்ற நேரடிப் பொருளையும், சீடத்துவத்தை ஒலிக்கச் செய்யும் கதைநடை நயத்தையும், மிகைவிளக்கம் இன்றி காக்கிறது.
theological_decisions:
- issue: ἀνέβλεψαν என்பதில் குணமாக்கப்பட்டதன் தன்மை
  choice: உண்மையான, உடனடியான பார்வைப் பெறுதல்
  alternative: அவர்கள் வெறுமனே மேலே பார்த்தார்கள் அல்லது தெளிவற்ற வகையில் பார்க்கத் தொடங்கினார்கள்
  rationale: குருடர்கள் பற்றிய உடனடிச் சூழலும் εὐθέως என்பதும் பார்வை உடனே கிடைத்ததைக் காட்டுகின்றன; அவர்கள் முன்பு பார்த்தவர்களா என்பதை முதன்மை உரை தேவையின்றி தீர்மானிக்கவில்லை.
- issue: ἠκολούθησαν αὐτῷ என்பதன் வலிமை
  choice: அவரைப் பின்தொடர்ந்தார்கள்
  alternative: அவருடைய சீடர்களானார்கள்
  rationale: அவர்கள் இயேசுவைப் பின்தொடர்ந்ததாக உரை கூறுகிறது. இது சீடத்துவத்தை உணர்த்தக்கூடும்; ஆனால் அதன் ஆழத்தையோ கால அளவையோ இவ்வசனம் வெளிப்படையாக வரையறுக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘மனம் உருகி’ ஆழ்ந்த இரக்கத்தின் உணர்வாற்றலைக் காக்கிறது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘பார்வை பெற்றார்கள்’ என்ற தொடருக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
