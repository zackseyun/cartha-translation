id: MAT.20.31
reference: Matthew 20:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ δὲ ὄχλος ἐπετίμησεν αὐτοῖς ἵνα σιωπήσωσιν· οἱ δὲ μεῖζον ⸀ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/031.yaml
  text: But the crowd rebuked them so that they would be silent[a]. Yet they cried out all the more, saying, “Lord, have mercy on us[b], Son of David.”
translation:
  language: ta
  text: ஆனால் கூட்டத்தினர் அவர்களை அமைதியாக இருக்கும்படி அதட்டினார்கள். அவர்களோ இன்னும் அதிகமாக[a] உரத்துக் கூப்பிட்டு, “ஆண்டவரே, எங்கள்மேல் இரக்கம் காட்டும், தாவீதின் குமாரனே![b]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இன்னும் உரக்க.” கிரேக்க ஒப்பீட்டுச் சொல் பொதுவாக அதிகரித்த தீவிரத்தையோ (“இன்னும் அதிகமாக”), குறிப்பாக அதிக ஒலியையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “தாவீதின் குமாரன்” என்பது வெறும் வம்சத் தொடர்பைக் குறிக்கும் சொல் மட்டுமல்ல; மேசியாவைக் குறிக்கும் ஒரு பட்டமும் ஆகும்.
    reason: cultural_note
lexical_decisions:
- source_word: ὄχλος
  choice: கூட்டத்தினர்
  rationale: மக்கள் கூட்டத்தை இயல்பான நவீன தமிழில் குறிக்கிறது; தொடர்ந்து வரும் அதட்டும் செயலைச் செய்யும் நபர்களாகவும் தெளிவாக அமைகிறது.
- source_word: ἐπετίμησεν
  choice: அதட்டினார்கள்
  rationale: வெறுமனே அறிவுறுத்துவதைவிடக் கடுமையாகக் கண்டித்து அடக்க முயல்வதை வெளிப்படுத்துகிறது; சூழலுக்கு ஏற்ற இயல்பான தமிழ்.
- source_word: ἵνα σιωπήσωσιν
  choice: அமைதியாக இருக்கும்படி
  rationale: அவர்கள் பேசாமல் இருக்கவேண்டும் என்ற கூட்டத்தினரின் நோக்கத்தை இயல்பாகத் தெரிவிக்கிறது.
- source_word: μεῖζον
  choice: இன்னும் அதிகமாக
  rationale: ஒப்பீட்டு வலியுறுத்தலைப் பொதுவாகவே தக்கவைக்கிறது; ஒலியளவை மட்டும் குறிப்பதாகக் குறுக்கவில்லை.
- source_word: ἔκραξαν
  choice: உரத்துக் கூப்பிட்டு
  rationale: κράζω குறிக்கும் உரத்த, அவசரமான கூக்குரலை நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: Κύριε
  choice: ஆண்டவரே
  rationale: மரியாதையான நேரடி அழைப்பையும் சாத்தியமான கிறிஸ்துவியல் நிறைவையும் குறுக்காமல் தக்கவைக்கிறது.
- source_word: ἐλέησον ἡμᾶς
  choice: எங்கள்மேல் இரக்கம் காட்டும்
  rationale: இரக்கத்திற்கான வேண்டுகோளைத் தெளிவான, மரியாதைமிக்க நவீன தமிழில் தருகிறது.
- source_word: υἱὸς Δαυίδ
  choice: தாவீதின் குமாரனே
  rationale: வம்சத் தகவலாக மட்டும் மாற்றாமல், மத்தேயுவில் உள்ள அரச மற்றும் மேசியா சார்ந்த பட்டத்தின் வடிவத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: இயேசுவுக்குப் பயன்படுத்தப்படும் மேசியா சார்ந்த பட்டம்
  choice: தாவீதின் குமாரனே
  alternative: தாவீதின் வழிவந்தவரே
  rationale: சொற்றொடர் வெறும் வம்சத் தொடர்பை மட்டுமல்லாமல் மேசியா சார்ந்த பட்டமாகவும் செயல்படுகிறது; நேரடியான வடிவம் அந்த இறையியல் மற்றும் கதையியல் ஆற்றலைத் தக்கவைக்கிறது.
- issue: இயேசுவை நோக்கிய κύριος என்ற அழைப்பு
  choice: ஆண்டவரே
  alternative: எஜமானே
  rationale: இது மரியாதையான அழைப்பாகவும் ஆழமான கிறிஸ்துவியல் பொருள் கொண்டதாகவும் புரிந்துகொள்ளப்படலாம்; “ஆண்டவரே” அந்தப் பொருள் நெருக்கத்தைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம நிகழ்வுக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கச் சொல்லான μεῖζον உள்ள பொதுவான தீவிரப்படுத்தல் பிரதான உரையில் தக்கவைக்கப்பட்டு, ஒலியளவைக் குறிக்கும் சாத்தியம் அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது. இறுதி நேரடி அழைப்பின் கிரேக்க வரிசை பெருமளவில் பாதுகாக்கப்பட்டுள்ளது.
