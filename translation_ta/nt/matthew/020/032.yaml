id: MAT.20.32
reference: Matthew 20:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ στὰς ὁ Ἰησοῦς ἐφώνησεν αὐτοὺς καὶ εἶπεν· Τί θέλετε ποιήσω ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/032.yaml
  text: And Jesus stopped[a], called them, and said, “What do you want me to do for you?”
translation:
  language: ta
  text: இயேசு நின்று, அவர்களைக் கூப்பிட்டு, “நான் உங்களுக்கு என்ன செய்ய வேண்டுமென்று விரும்புகிறீர்கள்?” என்று சொன்னார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στὰς
  choice: நின்று
  rationale: ἵστημι என்பதன் இறந்தகால வினையெச்சம் இங்கு இயேசு தமது நடையை நிறுத்தியதைச் சுருக்கமாகக் குறிக்கிறது. ‘நின்று’ என்பது இயல்பான தமிழில் அந்தக் கதையோட்டத்தைத் தருகிறது.
- source_word: ἐφώνησεν
  choice: கூப்பிட்டு
  rationale: φωνέω இச்சூழலில் ஒருவரை அழைப்பதை அல்லது கூப்பிடுவதைக் குறிக்கிறது. ‘கூப்பிட்டு’ என்பது அடுத்துவரும் நேரடி உரையுடன் இயல்பாக இணைகிறது.
- source_word: αὐτοὺς
  choice: அவர்களை
  rationale: இது முந்தைய சூழலில் குறிப்பிடப்பட்ட பார்வையற்ற இருவரைக் குறிக்கும் பன்மைச் சுட்டுப்பெயர்.
- source_word: Τί
  choice: என்ன
  rationale: நேரடியான வினாவை அறிமுகப்படுத்தும் வினாப்பெயரின் இயல்பான தமிழ் இணை.
- source_word: θέλετε
  choice: விரும்புகிறீர்கள்
  rationale: θέλω விருப்பத்தையோ மனவிருப்பத்தையோ குறிக்கிறது. மரியாதைப் பன்மையிலும் இருவரைக் குறிக்கும் பன்மையிலும் ‘விரும்புகிறீர்கள்’ தெளிவாக உள்ளது.
- source_word: ποιήσω
  choice: நான் ... செய்ய வேண்டும் என்று
  rationale: θέλετε என்பதற்குப் பின் வரும் இறந்தகாலத் துணைவினைநிலை, அவர்கள் இயேசு செய்ய விரும்பும் செயலைக் குறிக்கிறது. தமிழ் தொடரமைப்பில் ‘நான் ... செய்ய வேண்டும் என்று’ என்பது பொருளைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ὑμῖν
  choice: உங்களுக்கு
  rationale: இங்குள்ள வேற்றுமை வடிவம் அவர்களுக்காக அல்லது அவர்களுடைய நலனுக்காகச் செய்யப்படும் செயலைக் குறிக்கிறது; தமிழில் ‘உங்களுக்கு’ இதை இயல்பாகக் கொண்டுவருகிறது.
- source_word: ὁ Ἰησοῦς
  choice: இயேசு
  rationale: தனிப்பெயர் வழக்கமான தமிழ் வடிவில் தரப்பட்டுள்ளது; கிரேக்கக் குறிப்புச் சுட்டு தனியாக மொழிபெயர்க்கப்பட வேண்டியதில்லை.
theological_decisions:
- issue: இயேசுவின் கேள்வியின் தொனியும் வலிமையும்
  choice: “நான் உங்களுக்கு என்ன செய்ய வேண்டும் என்று விரும்புகிறீர்கள்?” என்ற நேரடியான, தனிப்பட்ட கேள்வி
  alternative: “நான் உங்களுக்கு என்ன செய்ய வேண்டுமென்று ஆசைப்படுகிறீர்கள்?” அல்லது அதிகச் சொற்படி வடிவம்
  rationale: கிரேக்கம் இயேசுவின் நேரடியான ஈடுபாட்டை வெளிப்படுத்துகிறது; கேள்வியை மறைமுகமாக்காமலும் தேவையற்ற கோட்பாட்டு விளக்கத்தைச் சேர்க்காமலும் தமிழில் இயல்பாகத் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதும் கண்ணியமானதும். இருவரை நோக்கிய பன்மை வினை வடிவம் காக்கப்பட்டுள்ளது. வெளியீட்டு உரையில் அடிக்குறிப்பு தேவையில்லை; வழங்கப்பட்ட ஆங்கில அடிக்குறிப்பு στὰς என்பதோடு பொருந்தாமல் கேள்வியின் முறையான மாற்றுரையை அளிப்பதால் அது பின்பற்றப்படவில்லை.
