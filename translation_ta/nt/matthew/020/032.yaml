review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents Jesus stopping, calling the two men, and asking what they want him to do for them. However, the Tamil complement clause needs a small grammatical and idiomatic adjustment: with the plural subject implicit in “விரும்புகிறீர்கள்,” the intended sense is best expressed as “நான் உங்களுக்கு என்ன செய்ய வேண்டுமென்று விரும்புகிறீர்கள்?”'
  naturalness: “நான் உங்களுக்கு என்ன செய்ய வேண்டும் என்று விரும்புகிறீர்கள்?” is understandable, but “வேண்டுமென்று” is smoother in modern standard Tamil for this embedded question. Rendering εἶπεν as “என்று சொன்னார்” more explicitly preserves the source’s speech verb than “என்று கேட்டார்,” while retaining the interrogative force.
  terminology: “இயேசு,” “அவர்களை,” and respectful plural “விரும்புகிறீர்கள்” are appropriate. “கூப்பிட்டு” is a natural modern rendering of ἐφώνησεν in this narrative context and does not introduce interpretive content.
  issues:
  - severity: low
    issue: The embedded question is slightly awkward as drafted.
    rationale: “நான் உங்களுக்கு என்ன செய்ய வேண்டும் என்று விரும்புகிறீர்கள்?” can be understood, but “வேண்டுமென்று” more naturally marks the content of what the two men desire Jesus to do.
  - severity: low
    issue: The speech verb is rendered as ‘asked’ rather than ‘said.’
    rationale: Since the Greek explicitly has καὶ εἶπεν, “என்று சொன்னார்” preserves the speech verb while the quoted question itself makes the interrogative function clear.
  revised_text: இயேசு நின்று, அவர்களைக் கூப்பிட்டு, “நான் உங்களுக்கு என்ன செய்ய வேண்டுமென்று விரும்புகிறீர்கள்?” என்று சொன்னார்.
  revised_footnotes: []
  revision_rationale: 'This revision retains the Greek sequence and directness: Jesus stopped, called them, and spoke a question. It makes only a safe idiomatic correction to the Tamil embedded-question construction and more closely reflects εἶπεν without altering meaning or register.'
