revisions:
- from: இயேசு நின்று, அவர்களைக் கூப்பிட்டு, “நான் உங்களுக்கு என்ன செய்ய வேண்டும் என்று விரும்புகிறீர்கள்?” என்று கேட்டார்.
  to: இயேசு நின்று, அவர்களைக் கூப்பிட்டு, “நான் உங்களுக்கு என்ன செய்ய வேண்டுமென்று விரும்புகிறீர்கள்?” என்று சொன்னார்.
