  text: And after receiving it[a], they began grumbling against the master of the house,
translation:
  language: ta
  text: அதைப் பெற்றுக்கொண்டதும், அவர்கள் வீட்டுத் தலைவருக்கு எதிராக முணுமுணுக்கத் தொடங்கினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβόντες
  choice: அதைப் பெற்றுக்கொண்டதும்
  rationale: இறந்தகால வினையெச்சம், முதன்மை வினைக்கு முன்பு நிகழ்ந்த செயலைக் காட்டுகிறது. கிரேக்கத்தில் விடப்பட்டுள்ள செயப்படுபொருள், சூழலில் முந்தைய வசனத்திலுள்ள தினாரியைக் குறிக்கிறது; இயல்பான தமிழுக்காக ‘அதை’ என வழங்கப்பட்டுள்ளது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ வலுவான முரண்பாட்டைக் காட்டாமல் கதையை மெதுவாக முன்னெடுக்கிறது. ‘-தும்’ அமைப்பே தமிழ் வாக்கியத்தில் அந்தத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐγόγγυζον
  choice: முணுமுணுக்கத் தொடங்கினார்கள்
  rationale: இறந்தகால imperfect வடிவம் தொடர்ந்த அல்லது தொடக்கநிலையிலிருந்த செயலைக் குறிக்கலாம். பணத்தைப் பெற்றபின் அதிருப்தியை வெளிப்படுத்தத் தொடங்கியதை இந்தச் சொற்றொடர் காட்டுகிறது; ‘முணுமுணுத்தார்கள்’ என்ற தொடர்ச்சிப் பொருளும் சாத்தியம்.
- source_word: κατὰ
  choice: எதிராக
  rationale: genitive உடன் வரும் κατά இங்கு ஒருவரை நோக்கிய எதிர்ப்பைக் குறிக்கிறது.
- source_word: τοῦ οἰκοδεσπότου
  choice: வீட்டுத் தலைவர்
  rationale: οἰκοδεσπότης என்பது ஒரு வீடு அல்லது குடும்பச் சொத்தின் தலைவரைக் குறிக்கிறது. ‘வீட்டுத் தலைவர்’ அதன் அடிப்படைப் பொருளைப் பேணும் இயல்பான நவீனத் தமிழ்; உவமையின் சூழலில் ‘நிலத்தின் உரிமையாளர்’ என்பதும் பொருந்தக்கூடியது.
