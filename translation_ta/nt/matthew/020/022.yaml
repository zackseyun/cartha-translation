- from: ஆனால் இயேசு அவர்களுக்குப் பதிலளித்து, “நீங்கள் என்ன கேட்கிறீர்கள் என்று உங்களுக்குத் தெரியவில்லை. நான் குடிக்கவிருக்கும் கிண்ணத்தில் குடிக்க உங்களால் முடியுமா?[a]” என்று கேட்டார். அவர்கள் அவரிடம், “எங்களால் முடியும்” என்றார்கள்.
