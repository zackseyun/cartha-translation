  rationale: The revision corrects the object relation of ‘cup’ and replaces ‘asked’ with a Tamil expression that represents both ‘answered’ and ‘said.’ It retains the direct, plural address; the capability emphasis of δύνασθε/Δυνάμεθα; the forward-looking sense of μέλλω; and the intentionally open ‘cup’ metaphor. The footnote is adjusted correspondingly without making suffering the main-text meaning.
