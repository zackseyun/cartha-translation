  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Οὐκ οἴδατε τί αἰτεῖσθε· δύνασθε πιεῖν τὸ ποτήριον ὃ ἐγὼ μέλλω ⸀πίνειν; λέγουσιν αὐτῷ· Δυνάμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/022.yaml
  text: But Jesus answered and said[a], “You do not know what you are asking. Are you able to drink the cup that I am about to drink?” They said to him, “We are able.”
translation:
  language: ta
  text: 'ஆனால் இயேசு அவர்களுக்குப் பதிலளித்துக் கூறினார்: “நீங்கள் என்ன கேட்கிறீர்கள் என்று உங்களுக்குத் தெரியவில்லை. நான் குடிக்கவிருக்கும் கிண்ணத்தை நீங்கள் குடிக்க உங்களால் முடியுமா?[a]” அவர்கள் அவரிடம், “எங்களால் முடியும்” என்றார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் வெளிப்படையாக: “நான் குடிக்கவிருக்கும் துன்பத்தின் கிண்ணத்தை நீங்கள் குடிக்க உங்களால் முடியுமா?” கிரேக்கம் ‘கிண்ணம்’ என்ற உருவகத்தைக் காக்கிறது; அது ஒருவருக்குக் குறிக்கப்பட்ட பங்கைக், குறிப்பாகத் துன்பத்தைக், குறிக்கும் பொதுவான வேதாகமப் படிமம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: ஆனால் இயேசு அவர்களுக்குப் பதிலளித்து ... என்று கேட்டார்
  rationale: δέ தரும் மென்மையான எதிர்மறைத் தொடர்ச்சியை ‘ஆனால்’ காட்டுகிறது. கிரேக்கத்தின் பதிலளித்தல்–சொல்லுதல் அமைப்பு தமிழில் இயல்பாக அமைய, ‘பதிலளித்து ... என்று கேட்டார்’ என வழங்கப்பட்டது.
- source_word: Οὐκ οἴδατε
  choice: உங்களுக்குத் தெரியவில்லை
  rationale: οἶδα என்பதன் அடிப்படைப் பொருளான ‘அறிதல்/தெரிதல்’ காக்கப்படுகிறது; ‘புரியவில்லை’ என்ற விளக்கமான பொருள் திணிக்கப்படவில்லை.
- source_word: τί αἰτεῖσθε
  choice: நீங்கள் என்ன கேட்கிறீர்கள்
  rationale: தற்போதைய வேண்டுகோளை இயல்பான நவீனத் தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: δύνασθε πιεῖν
  choice: குடிக்க உங்களால் முடியுமா?
  rationale: செய்யும் திறன் அல்லது ஆற்றலைக் குறிக்கும் δύνασθε என்பதன் வலிமையைத் தெளிவாகக் காக்கிறது.
- source_word: τὸ ποτήριον
  choice: கிண்ணம்
  rationale: கிரேக்க உருவகத்தை விளக்கவுரையாக மாற்றாமல் அப்படியே காக்கிறது; இது ஒருவருக்குக் குறிக்கப்பட்ட பங்கு, குறிப்பாகத் துன்பம், என்பதைக் குறிக்கக்கூடிய வேதாகமப் படிமம்.
- source_word: ὃ ἐγὼ μέλλω πίνειν
  choice: நான் குடிக்கவிருக்கும்
  rationale: μέλλω குறிக்கும் வரவிருக்கும் செயலைத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: λέγουσιν αὐτῷ· Δυνάμεθα
  choice: அவர்கள் அவரிடம், ‘எங்களால் முடியும்’ என்றார்கள்
  rationale: வரலாற்று நிகழ்காலம் தமிழ்க் கதைநடைக்கேற்ற இறந்தகாலத்தில் வழங்கப்பட்டு, δύνασθε/Δυνάμεθα இடையிலான ‘முடியும்’ என்ற சொல் ஒற்றுமை காக்கப்படுகிறது.
theological_decisions:
- issue: ‘கிண்ணம்’ என்ற உருவகத்தின் பொருள்
  choice: முதன்மை உரையில் ‘கிண்ணம்’ என்ற உருவகத்தை அப்படியே வைத்தல்
  alternative: ‘நான் அனுபவிக்கவிருக்கும் துன்பத்தை உங்களால் அனுபவிக்க முடியுமா?’
  rationale: உருவகம் இயேசுவின் வரவிருக்கும் பாடுகளைச் சுட்டினாலும், அதை ‘துன்பம்’ அல்லது ‘மரணம்’ என்று மட்டும் வரையறுக்காமல் மூலத்தின் இறையியல் ஆழத்தையும் திறந்த தன்மையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் எளிய புரிதலும் இணைந்த நடை. ‘கிண்ணம்’ என்ற வேதாகம உருவகம் காக்கப்பட்டு, அதன் பொருள் அடிக்குறிப்பில் மட்டும் விளக்கப்பட்டுள்ளது.
