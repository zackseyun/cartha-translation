translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை. கிரேக்க வாக்கியத்தின் தொடர்ச்சியைக் காட்ட இறுதியில் முக்காற்புள்ளி இடப்பட்டுள்ளது; அடுத்த வசனத்தில் இயேசுவின் நேரடி உரை தொடர்கிறது.
