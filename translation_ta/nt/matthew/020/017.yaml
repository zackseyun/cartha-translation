  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂Καὶ ἀναβαίνων ὁ⸃ Ἰησοῦς εἰς Ἱεροσόλυμα παρέλαβεν τοὺς δώδεκα ⸀μαθητὰς κατ’ ἰδίαν, ⸂καὶ ἐν τῇ ὁδῷ⸃ εἶπεν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/017.yaml
  text: And as Jesus was going up to Jerusalem, he took the twelve disciples aside by themselves, and on the way he said to them,
translation:
  language: ta
  text: 'இயேசு எருசலேமுக்கு ஏறிச் சென்றுகொண்டிருந்தபோது, பன்னிரண்டு சீடர்களைத் தனியே அழைத்துக்கொண்டு, வழியில் அவர்களிடம் கூறினார்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβαίνων
  choice: போய்க்கொண்டிருந்தபோது
  rationale: நிகழ்காலப் பெயரெச்சம், முதன்மை வினையுடன் ஒரே நேரத்தில் நடைபெறும் பயணத்தைச் சுட்டுகிறது. எருசலேமுக்குச் ‘மேலே போதல்’ என்ற கிரேக்க மரபுவழக்கைத் தமிழில் இயல்பான பயணச் சொல்லாக்கமாக வழங்குகிறது.
- source_word: εἰς Ἱεροσόλυμα
  choice: எருசலேமுக்கு
  rationale: நகரத்தை நோக்கிய பயண இலக்கை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: παρέλαβεν
  choice: அழைத்துக்கொண்டு
  rationale: ஒருவரைத் தம்முடன் கூட்டிக்கொள்வது என்ற வினையின் பொருளைத் தருகிறது; தொடர்ந்து வரும் ‘தனியாக’ என்பதுடன் சேர்ந்து மற்றவர்களிடமிருந்து ஒதுக்கி அழைத்துச் சென்ற நுணுக்கத்தையும் வெளிப்படுத்துகிறது.
- source_word: τοὺς δώδεκα μαθητὰς
  choice: பன்னிரண்டு சீடர்களையும்
  rationale: எண்ணிக்கையையும் μαθητάς என்ற வெளிப்படையான பெயர்ச்சொல்லையும் விடாமல் பிரதிபலிக்கிறது; ‘சீடர்கள்’ என்பது நற்செய்தி நூல் சூழலில் நிலைபெற்ற இயல்பான சொல்.
- source_word: κατ’ ἰδίαν
  choice: தனியாக
  rationale: பிறரிடமிருந்து பிரித்து, தனிப்பட்ட முறையில் பேசுவதற்கான சூழலைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐν τῇ ὁδῷ
  choice: வழியில்
  rationale: பயணம் நடைபெற்றுக்கொண்டிருக்கும் சூழலை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: εἶπεν αὐτοῖς
  choice: அவர்களிடம் கூறினார்
  rationale: சொல்லுதல் என்ற சாதாரண வினையை மரியாதையான, கண்ணியமான தமிழ் நடையில் வழங்கி, உரையின் உள்ளடக்கத்தை அடுத்த வசனத்திற்குத் திறந்துவைக்கிறது.
