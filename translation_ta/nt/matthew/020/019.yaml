source:
  edition: SBLGNT
  text: καὶ παραδώσουσιν αὐτὸν τοῖς ἔθνεσιν εἰς τὸ ἐμπαῖξαι καὶ μαστιγῶσαι καὶ σταυρῶσαι, καὶ τῇ τρίτῃ ἡμέρᾳ ⸀ἐγερθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/019.yaml
  text: and they will hand him over to the Gentiles to mock and flog and crucify[a], and on the third day he will be raised.
translation:
  language: ta
  text: அவரைக் கேலி செய்யவும், சாட்டையால் அடிக்கவும், சிலுவையில் அறையவும் யூதரல்லாதவர்களிடம் ஒப்படைப்பார்கள். மூன்றாம் நாளில் அவர் உயிர்த்தெழுப்பப்படுவார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் உயிர்த்தெழுவார்.” கிரேக்க வினைச்சொல் செயப்பாட்டு வடிவில், “அவர் உயிர்த்தெழுப்பப்படுவார்” என்று உள்ளது; உயிர்த்தெழுதலைக் குறிக்கும் இந்தப் பொதுவான சொற்றொடர் கடவுளின் செயலை மறைமுகமாக உணர்த்தலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: παραδώσουσιν
  choice: ஒப்படைப்பார்கள்
  rationale: ஒருவரை மற்றவர்களின் அதிகாரத்திற்குள் ஒப்படைக்கும் பொருளை இயல்பான நவீன தமிழில் தருகிறது; ‘காட்டிக்கொடுப்பார்கள்’ என்பதில் உள்ள துரோகத்தின் குறிப்பான பொருளை தேவையின்றி சேர்ப்பதில்லை.
- source_word: τοῖς ἔθνεσιν
  choice: யூதரல்லாதவர்களிடம்
  rationale: இந்த யூதச் சூழலில் இந்தச் சொல் பொதுவாக எல்லா நாடுகளையும் அல்ல, யூதரல்லாத ஆட்சியாளர்களையும் மக்களையும் குறிக்கிறது; சாதாரண வாசகருக்கும் தெளிவாக உள்ளது.
- source_word: εἰς τὸ ἐμπαῖξαι
  choice: கேலி செய்யவும்
  rationale: நோக்கம் அல்லது விளைவைச் சுட்டும் கிரேக்க அமைப்பைத் தமிழின் இணை வினையெச்சத் தொடரில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μαστιγῶσαι
  choice: சாட்டையால் அடிக்கவும்
  rationale: நீதித்தண்டனையாகச் சாட்டையால் அடிப்பதைத் தெளிவாகவும் தற்போதைய வழக்கிலும் கூறுகிறது.
- source_word: σταυρῶσαι
  choice: சிலுவையில் அறையவும்
  rationale: சிலுவையில் அறைந்து கொல்லும் செயலை நேரடியாகக் குறிக்கிறது; பகிரப்பட்ட செயப்படுபொருளான ‘அவரை’ தமிழ் வாக்கியத்தின் தொடக்கத்திலேயே வைத்திருக்கிறது.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: மூன்றாம் நாளில்
  rationale: கிரேக்க காலக் குறிப்பின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: ἐγερθήσεται
  choice: அவர் உயிருடன் எழுப்பப்படுவார்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது. ‘உயிருடன்’ என்பது உயிர்த்தெழுதல் சூழலைத் தமிழில் தெளிவாக்குகிறது; செய்பவர் யார் என்பதை வெளிப்படையாகச் சேர்க்கவில்லை.
theological_decisions:
- issue: உயிர்த்தெழுதல் வினையின் செயப்பாட்டு நிலை
  choice: அவர் உயிருடன் எழுப்பப்படுவார்
  alternative: அவர் உயிர்த்தெழுவார்
  rationale: கிரேக்கத்தில் எதிர்காலச் செயப்பாட்டு வினை உள்ளது. செயப்பாட்டு வடிவம் கடவுளின் செயலை மறைமுகமாக உணர்த்தக்கூடிய மொழிநயத்தைப் பாதுகாக்கிறது; அதே நேரத்தில் வேறு இடங்களில் கூறப்படும் கிறிஸ்துவின் சொந்த செயலாண்மையை மறுப்பதில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகருக்குத் தெளிவாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. மூன்று துன்புறுத்தல் செயல்களும் ஒரே செயப்படுபொருளுடன் இணைக்கப்பட்டுள்ளன; கிரேக்கத்தின் செயப்பாட்டு உயிர்த்தெழுதல் மொழி அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
