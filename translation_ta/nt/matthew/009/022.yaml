source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀στραφεὶς καὶ ἰδὼν αὐτὴν εἶπεν· Θάρσει, θύγατερ· ἡ πίστις σου σέσωκέν σε. καὶ ἐσώθη ἡ γυνὴ ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/022.yaml
  text: But Jesus[a], turning and seeing her, said, “Take courage, daughter[d][c][b]; your faith has saved you.” And the woman was healed from that hour.
translation:
  language: ta
  text: ஆனால் இயேசு திரும்பி அவளைப் பார்த்து, “மகளே, துணிவாயிரு[a]; உன் விசுவாசம்[b] உன்னை மீட்டிருக்கிறது[c]” என்றார். அந்த நேரத்திலிருந்தே அந்தப் பெண் குணமடைந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மனந்தளராதே’ அல்லது ‘தைரியமாயிரு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘விசுவாசம்’ என்பதற்கு ‘நம்பிக்கை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: c
    text: ‘உன்னைக் குணமாக்கியிருக்கிறது’ அல்லது ‘உன்னை நலமாக்கியிருக்கிறது’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் காப்பாற்றுதல், மீட்டல், குணமாக்குதல் ஆகிய பொருள்களைத் தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς καὶ ἰδὼν αὐτήν
  choice: திரும்பி அவளைப் பார்த்து
  rationale: இரு பங்கேற்பு வினைகளின் தொடர்ச்சியான செயலை இயல்பான தமிழில் சுருக்கமாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது; திரும்பிய திசையை மூலத்தைவிட அதிகமாகக் குறிப்பிடவில்லை.
- source_word: Θάρσει
  choice: துணிவாயிரு
  rationale: தைரியமும் மனவுறுதியும் கொள்ளும்படி கூறும் ஒருமை ஏவலை நேரடியான, நவீன தமிழில் தருகிறது.
- source_word: θύγατερ
  choice: மகளே
  rationale: அன்பும் குடும்பநெருக்கமும் கொண்ட நேரடி அழைப்பை விளக்கச் சொற்கள் சேர்க்காமல் காக்கிறது.
- source_word: πίστις
  choice: விசுவாசம்
  rationale: இச்சூழலில் இயேசுவின்மீது வைத்த நம்பிக்கையைச் சுட்டுவதோடு, πίστις என்பதன் சமயவியல் நிறையையும் காக்கிறது; ‘நம்பிக்கை’ என்பது சாத்தியமான மாற்று.
- source_word: σέσωκέν σε
  choice: உன்னை மீட்டிருக்கிறது
  rationale: σῴζω என்பதன் குணமாக்குதல், காப்பாற்றுதல், மீட்பளித்தல் ஆகிய பரந்த பொருள் வளையத்தைக் காக்கிறது. நிறைவுற்ற செயலின் தொடரும் விளைவை ‘மீட்டிருக்கிறது’ வெளிப்படுத்துகிறது.
- source_word: ἐσώθη
  choice: குணமடைந்தாள்
  rationale: அதே σῴζω வினை இங்கு கதையின் உடனடியான உடல்நல விளைவைக் குறிக்கிறது; ஆகவே தமிழில் தெளிவாக ‘குணமடைந்தாள்’ எனத் தரப்பட்டுள்ளது.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: அந்த நேரத்திலிருந்தே
  rationale: அந்த நேரத்திலிருந்து ஏற்பட்ட உடனடியும் தொடர்ச்சியுமான விளைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: πίστις என்பதன் மொழிபெயர்ப்பு
  choice: விசுவாசம்
  alternative: நம்பிக்கை
  rationale: ‘விசுவாசம்’ மூலச்சொல்லின் சமயவியல் பரப்பைக் காக்கிறது; இச்சூழலில் தனிப்பட்ட நம்பிக்கையும் உட்பொருளாக இருப்பதால் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: இயேசுவின் கூற்றிலும் கதையாளரின் முடிவுரையிலும் σῴζω என்பதன் மொழிபெயர்ப்பு
  choice: இயேசுவின் கூற்றில் ‘மீட்டிருக்கிறது’; முடிவுரையில் ‘குணமடைந்தாள்’
  alternative: இரு இடங்களிலும் ‘குணமாக்கியது/குணமடைந்தாள்’ என்று உடல்நலப் பொருளில் மட்டும் மொழிபெயர்த்தல்
  rationale: முதல் இடத்தில் மீட்பு மற்றும் குணமாக்குதல் ஆகிய இரு ஒலிப்புகளையும் திறந்தவாறு வைத்திருக்கிறது; இரண்டாம் இடத்தில் கதையின் வெளிப்படையான உடல்நல விளைவைத் தெளிவாக்குகிறது. இதனால் மூலத்தின் பொருள் இழுபறி தீர்த்துவிடப்படாமல் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நேரடி உரையின் அன்பான அழைப்பும் கட்டளையின் ஊக்கமளிக்கும் தொனியும் காக்கப்பட்டுள்ளன; σῴζω என்பதிலுள்ள மீட்பு–குணமாக்குதல் பொருள் பரப்பு அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
