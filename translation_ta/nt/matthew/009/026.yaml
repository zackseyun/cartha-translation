translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டது. ‘செய்தி பரவியது’ என்பது சாதாரண வாசகர்களுக்கு இயல்பான சொற்றொடர்; மூலத்தின் புவியியல் பரப்பைச் சார்ந்த பொருள் வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
