  text: And this report went out into all that region[a].
translation:
  language: ta
  text: இந்தச் செய்தி அந்தப் பகுதி முழுவதும் பரவியது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அந்த நிலப்பகுதி முழுவதிலும்.’ கிரேக்கச் சொல் γῆ என்பது நிலம், நாடு அல்லது பகுதி என்பவற்றைக் குறிக்கலாம்; இங்கு முழு உலகத்தையல்ல, சுற்றியிருந்த பகுதியையே பெரும்பாலும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: இந்தச் செய்தி...
  rationale: தொடர்ச்சியைத் தமிழில் இயல்பாக வெளிப்படுத்த தனியாக ‘மேலும்’ அல்லது ‘அப்பொழுது’ சேர்க்காமல் வாக்கியம் அமைக்கப்பட்டது; καί குறிக்கும் எளிய கதைத் தொடர்ச்சி சூழலில் நிலைக்கிறது.
- source_word: ἐξῆλθεν
  choice: பரவியது
  rationale: செய்தி ஓர் இடத்திலிருந்து வெளியே சென்று எங்கும் அறியப்பட்டதைக் குறிக்கும் கிரேக்க உருவகத்தை நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் ‘பரவியது’ தெரிவிக்கிறது.
- source_word: ἡ φήμη αὕτη
  choice: இந்தச் செய்தி
  rationale: φήμη இங்கு நிகழ்வைப் பற்றிப் பரவிய செய்தியைக் குறிக்கிறது; ‘வதந்தி’ உண்மையற்றது என்ற தேவையற்ற பொருளைத் தரக்கூடும். αὕτη-யின் சுட்டுப்பொருளை ‘இந்த’ நேரடியாகக் காக்கிறது.
- source_word: εἰς ὅλην τὴν γῆν ἐκείνην
  choice: அந்தப் பகுதி முழுவதும்
  rationale: γῆ என்பதற்கு நிலம், நாடு, பிரதேசம் ஆகிய பொருள்கள் இருக்கலாம். இங்குள்ள உள்ளூர் கதைச் சூழலில் ‘பகுதி’ இயல்பானது; ὅλην என்பதன் முழுமையையும் ‘முழுவதும்’ காக்கிறது.
