source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας— τότε λέγει τῷ παραλυτικῷ· ⸀Ἐγερθεὶς ἆρόν σου τὴν κλίνην καὶ ὕπαγε εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/006.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins”—then he says to the paralytic[a], “Get up, pick up your bed[b], and go to your house.”
translation:
  language: ta
  text: ஆனால், மானிடமகனுக்கு[a] பூமியில் பாவங்களை மன்னிக்க அதிகாரம் உண்டு என்பதை நீங்கள் அறியும்படியாக”—பின்பு அவர் முடக்குவாதமுற்றவரிடம், “எழுந்து, உன் படுக்கையை[b] எடுத்துக்கொண்டு, உன் வீட்டுக்குப் போ” என்று சொல்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மானிடமகன்” என்பதற்கு “மனிதகுமாரன்” என்றும் மொழிபெயர்க்கலாம். இது இயேசு தம்மைக் குறிக்கப் பயன்படுத்திய பட்டமாகவும், தானியேல் 7-ஐ நினைவூட்டுவதாகவும் இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “படுக்கை” என்பதற்கு “படுக்கைப் பாய்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் கட்டில், படுக்கை அல்லது படுப்பதற்கான பாயைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ εἰδῆτε
  choice: ஆனால், ... என்பதை நீங்கள் அறிந்துகொள்ள வேண்டும்
  rationale: δέ குறிக்கும் மென்மையான மாறுதலையும் ἵνα உடன் வரும் நோக்கத்தையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐξουσίαν ἔχει
  choice: அதிகாரம் உண்டு
  rationale: இங்கு வெறும் வல்லமையை அல்ல, பாவங்களை மன்னிப்பதற்கான உரிமையுள்ள அதிகாரத்தை ἐξουσία குறிக்கிறது.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: மானிடமகன்
  rationale: இயேசுவின் நிலைபெற்ற தனிப்பட்ட பட்டத்தையும் தானியேல் 7 உடனான சாத்தியமான தொடர்பொலியையும் காக்கும் மரியாதைக்குரிய தமிழ் வடிவம்.
- source_word: ἐπὶ τῆς γῆς
  choice: பூமியில்
  rationale: இச்சூழலில் பூமிக்குரிய செயல்களம் என்பதைக் குறிக்கும் நேரான மொழிபெயர்ப்பு.
- source_word: ἀφιέναι ἁμαρτίας
  choice: பாவங்களை மன்னிக்க
  rationale: இச்சூழலில் ἀφίημι என்பது பாவங்களை மன்னித்தல் அல்லது நீக்குதல் என்ற வழக்கமான பொருளைக் கொண்டது.
- source_word: τότε λέγει
  choice: பின்பு அவர் ... சொல்கிறார்
  rationale: τότε குறிக்கும் அடுத்த நிகழ்வையும் λέγει என்ற வரலாற்று நிகழ்காலத்தின் காட்சித் தெளிவையும் காக்கிறது.
- source_word: τῷ παραλυτικῷ
  choice: முடக்குவாதமுற்றவரிடம்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் உரிச்சொல்லை இழிவற்ற, தெளிவான நவீனத் தமிழில் வழங்குகிறது.
- source_word: Ἐγερθεὶς
  choice: எழுந்து
  rationale: கட்டளைத் தொடரில் கட்டளைப்பொருள் பெறும் இறந்தகாலப் பங்கேற்புச் சொல்லை இயல்பாக வழங்குகிறது.
- source_word: ἆρόν
  choice: எடுத்துக்கொண்டு
  rationale: படுக்கையைத் தூக்கி எடுத்துச் செல்லும் செயலுக்கேற்ற இயல்பான தமிழ்.
- source_word: κλίνην
  choice: படுக்கையை
  rationale: κλίνη என்பதன் பரந்த பொருளை காக்கிறது; அது கட்டில், படுக்கை அல்லது படுக்கைப் பாயைக் குறிக்கலாம்.
- source_word: ὕπαγε εἰς τὸν οἶκόν σου
  choice: உன் வீட்டுக்குப் போ
  rationale: நேரடியான கட்டளையையும் οἶκος என்பதன் முதன்மையான சொற்பொருளையும் இயல்பாகக் காக்கிறது.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου என்ற கிறிஸ்துவியல் பட்டம்
  choice: மானிடமகன்
  alternative: மனிதகுமாரன்; மனிதனாகிய ஒருவர்
  rationale: இதைப் பொதுவான மனிதக் குறிப்பாக விளக்கிவிடாமல், இயேசுவின் தனிப்பட்ட பட்டமாகவும் தானியேல் 7-ன் தொடர்பொலியுடன் கூடியதாகவும் உள்ள பதற்றத்தைப் பாதுகாக்கிறது.
- issue: பாவங்களை மன்னிப்பதில் ἐξουσία என்பதன் தன்மை
  choice: அதிகாரம்
  alternative: வல்லமை; உரிமை
  rationale: இவ்வசனம் இயேசுவின் செயல்திறனை மட்டும் அல்ல, பாவங்களை மன்னிப்பதற்கான உரிமையுள்ள அதிகாரத்தையும் வலியுறுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. வரலாற்று நிகழ்காலம் ‘சொல்கிறார்’ என்று காக்கப்பட்டுள்ளது; நேரடி உரையின் இடைச்செருகலைக் காட்ட நீண்ட கோடு பயன்படுத்தப்பட்டுள்ளது.
