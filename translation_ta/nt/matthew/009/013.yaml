id: MAT.9.13
reference: Matthew 9:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πορευθέντες δὲ μάθετε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν· οὐ γὰρ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/013.yaml
  text: 'But go and learn what this means: ‘I desire mercy and not sacrifice.’ For I did not come to call the righteous[c][b][a], but sinners.'
translation:
  language: ta
  text: ஆனால் நீங்கள் போய், ‘நான் பலியை அல்ல, இரக்கத்தையே விரும்புகிறேன்’ என்பதன் பொருள் என்ன என்று கற்றுக்கொள்ளுங்கள்.[a][b] ஏனெனில், நீதிமான்களை[c] அழைக்க நான் வரவில்லை; பாவிகளை அழைக்கவே வந்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “இது என்ன என்று கற்றுக்கொள்ளுங்கள்.”
    reason: lexical_alternative
  - marker: b
    text: ஓசியா 6:6-இலிருந்து மேற்கோள்.
    reason: cross_reference
  - marker: c
    text: அல்லது, “தங்களை நீதிமான்கள் என்று நினைப்பவர்கள்” என்று பொருள்கொள்ளலாம்; கிரேக்கத்தில் “நீதிமான்கள்” என்று மட்டுமே உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: πορευθέντες
  choice: நீங்கள் போய்
  rationale: பின்வரும் கட்டளையுடன் இணைந்து ‘போய் ... கற்றுக்கொள்ளுங்கள்’ என்ற இடியோமாட்டிக் கட்டளைத் தொடரை உருவாக்குகிறது; தமிழில் இயல்பாகவும் கண்டிக்கும் தொனியுடனும் உள்ளது.
- source_word: μάθετε
  choice: கற்றுக்கொள்ளுங்கள்
  rationale: ஒரு வேதவாக்கின் பொருளைப் புரிந்துகொள்ளும்படி விடுக்கும் கட்டளையை நேரடியாகத் தக்கவைக்கிறது.
- source_word: τί ἐστιν
  choice: என்பதன் பொருள் என்ன
  rationale: மேற்கோளின் அர்த்தத்தை உணர்வதைக் குறிக்கும் இயல்பான தமிழ் வடிவம்; சொற்சொல்லான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: Ἔλεος
  choice: இரக்கம்
  rationale: ἔλεος என்பதன் கருணை மற்றும் உடன்படிக்கைச் சார்ந்த அருள் ஆகிய ஒலிப்புகளை அளவுக்கு மீறி விரிவாக்காமல் தக்கவைக்கும் பொதுவான தமிழ் சொல்.
- source_word: θέλω
  choice: விரும்புகிறேன்
  rationale: தெய்வீக விருப்பத்தை இயல்பான, கண்ணியமான நடையில் தெரிவிக்கிறது.
- source_word: θυσίαν
  choice: பலி
  rationale: தீர்க்கதரிசன மேற்கோளில் உள்ள ஒருமை வழிபாட்டுச் சொல்லை நேரடியாகத் தக்கவைக்கிறது.
- source_word: ἦλθον
  choice: நான் வரவில்லை ... வந்தேன்
  rationale: இயேசுவின் பணிநோக்கைக் குறிக்கும் இறந்தகாலத்தைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது; இரண்டாம் கூறில் பொருளை இயல்பாக்க வினை மீண்டும் சொல்லப்படுகிறது.
- source_word: καλέσαι
  choice: அழைக்க
  rationale: வரவழைத்தல், அழைப்பு விடுத்தல் ஆகிய பரந்த பொருள்களைத் திறந்தவாறே வைத்திருக்கிறது.
- source_word: δικαίους
  choice: நீதிமான்கள்
  rationale: உரையில் உள்ள பெயர்ச்சொல் தன்மையிலான பெயரடையை அதன் வகைப்பாட்டு எதிர்மறையுடன் தக்கவைக்கிறது; இது உண்மையில் நீதிமான்களையா அல்லது தங்களை அப்படிக் கருதுவோரையா குறிக்கிறது என்பதை முதன்மை உரை தீர்மானிப்பதில்லை.
- source_word: ἁμαρτωλούς
  choice: பாவிகள்
  rationale: மூலத்தில் உள்ள கூர்மையான ஒழுக்க எதிர்மறையை நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: ஓசியா 6:6 மேற்கோளில் இரக்கத்துக்கும் பலிக்கும் இடையிலான எதிர்மறை
  choice: ‘நான் பலியை அல்ல, இரக்கத்தையே விரும்புகிறேன்’ என்று தீர்க்கதரிசன எதிர்மறையை நேரடியாகத் தக்கவைத்தல்
  alternative: எல்லா பலிகளையும் கடவுள் முற்றிலும் நிராகரிக்கிறார் என்று விரிவாக்குதல், அல்லது இச்சூழலில் மட்டும் ஒரு மென்மையான முன்னுரிமை என்று மாற்றுதல்
  rationale: கிரேக்க உரை தீர்க்கதரிசன முரணை அப்படியே முன்வைக்கிறது. பலியை எல்லா வகையிலும் ஒழிப்பதாகவோ, அதன் கண்டிக்கும் வலிமையைத் தளர்த்துவதாகவோ மொழிபெயர்ப்பு தீர்மானிக்கக் கூடாது.
- issue: ‘நீதிமான்கள்’ யாரைக் குறிக்கிறது
  choice: ‘நீதிமான்கள்’ என்ற வெளிப்படையான சொற்றொடரையே வைத்தல்
  alternative: ‘தங்களை நீதிமான்கள் என்று நினைப்பவர்கள்’ அல்லது ‘சுயநீதிமான்கள்’ என்று விளக்கிப் பெயர்த்தல்
  rationale: சூழல் நையாண்டிப் பொருளை அனுமதித்தாலும், கிரேக்க உரை அதை வெளிப்படையாகக் குறிக்கவில்லை. ஆகவே உண்மையான நீதிமான்களா அல்லது தங்களை அப்படிக் கருதுவோரா என்ற இறையியல் பதற்றம் முதன்மை உரையில் தீர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் சாதாரண வாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆனால் நீங்கள் போய்’ என்பது δὲ மற்றும் கட்டளைத் தொடரின் கண்டிக்கும் திருப்பத்தைத் தக்கவைக்கிறது. மேற்கோளில் ‘இரக்கத்தையே’ மற்றும் இறுதியில் ‘அழைக்கவே’ என்பவை கிரேக்க எதிர்மறையின் அழுத்தத்தை இயல்பான தமிழில் வெளிப்படுத்துகின்றன.
