  terminology: ‘இரக்கம்,’ ‘பலி,’ ‘நீதிமான்கள்,’ ‘பாவிகள்,’ மற்றும் ‘அழைக்க’ ஆகியவை நிலையான வேதாகமத் தமிழிலும் இச்சூழலிலும் பொருத்தமானவை. ‘நீதிமான்கள்’ என்பதை விளக்கிப் பரிமாற்றாமல் வைத்திருப்பது கிரேக்கத்தின் நோக்கமுள்ள தெளிவின்மையைப் பாதுகாக்கிறது.
