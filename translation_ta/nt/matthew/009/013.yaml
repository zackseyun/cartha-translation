  source_fidelity: மூலக் கிரேக்கத்தின் கட்டளைத் தொடர் (πορευθέντες… μάθετε), ஓசியா மேற்கோளின் எதிர்மறை, மற்றும் ‘நீதிமான்கள்/பாவிகள்’ என்ற திறந்த எதிர்மறை அனைத்தும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. ‘பாவிகளை அழைக்கவே வந்தேன்’ என்பது ἀλλά-வின் எதிர்மறை வலிமையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத குறிப்பிட்ட இறையியல் விளக்கத்தைச் சேர்ப்பதில்லை.
