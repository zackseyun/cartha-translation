source:
  edition: SBLGNT
  text: καὶ ἰδόντες οἱ Φαρισαῖοι ⸀ἔλεγον τοῖς μαθηταῖς αὐτοῦ· Διὰ τί μετὰ τῶν τελωνῶν καὶ ἁμαρτωλῶν ἐσθίει ὁ διδάσκαλος ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/011.yaml
  text: And when the Pharisees saw it[a], they were saying to his disciples, “Why does your teacher eat with tax collectors and sinners?”
translation:
  language: ta
  text: அதை[a] பார்த்த பரிசேயர்கள் அவருடைய சீடர்களிடம், “உங்கள் ஆசிரியர் வரி வசூலிப்பவர்களோடும் பாவிகளோடும் ஏன் சாப்பிடுகிறார்?” என்று கேட்டுக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொற்சார்பாக, “பார்த்த பரிசேயர்கள்…” கிரேக்கத்தில் அவர்கள் எதைப் பார்த்தார்கள் என்பது வெளிப்படையாகக் கூறப்படவில்லை; சூழலில் அது அங்கு நடந்த உணவு நிகழ்வைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: அதைப் பார்த்த
  rationale: இறந்தகால வினையெச்சத்தின் காலத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது. கிரேக்கத்தில் காணப்பட்ட பொருள் வெளிப்படையாகக் கூறப்படவில்லை; தமிழில் தெளிவுக்காக ‘அதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἔλεγον
  choice: என்று கேட்டுக்கொண்டிருந்தார்கள்
  rationale: இது கேள்வி வடிவிலான நேர்கூற்று என்பதால் ‘கேட்டுக்கொண்டிருந்தார்கள்’ இயல்பாக உள்ளது; கிரேக்க இறந்தகாலத் தொடர்நிலை அம்சத்தையும் முடிந்தவரை காக்கிறது.
- source_word: μαθηταῖς
  choice: சீடர்களிடம்
  rationale: போதகர்–சீடர் உறவைச் சுவிசேஷச் சூழலில் தெளிவாகவும் வழக்கமாகவும் தெரிவிக்கும் சொல்.
- source_word: Διὰ τί
  choice: ஏன்
  rationale: காரணத்தை வினவும் கிரேக்கச் சொற்றொடரின் சுருக்கமான, இயல்பான தமிழாக்கம்.
- source_word: τελωνῶν
  choice: வரி வசூலிப்பவர்களோடும்
  rationale: அக்காலத்தில் சமூக இகழ்ச்சிக்கு உள்ளான தொழிலைக் கூடுதல் தொழில்நுட்ப விவரமின்றித் தெளிவாகக் குறிக்கிறது.
- source_word: ἁμαρτωλῶν
  choice: பாவிகளோடும்
  rationale: ἁμαρτωλός என்பதன் நேரடியான, நிலைபெற்ற தமிழாக்கம்; சமூக மற்றும் ஒழுக்கக் குற்றச்சாட்டின் நுணுக்கத்தைத் தீர்த்துவிடாமல் காக்கிறது.
- source_word: ἐσθίει
  choice: சாப்பிடுகிறார்
  rationale: மேற்கோள் கேள்வியிலுள்ள நிகழ்காலத்தையும் அடிப்படைப் பொருளான ‘உண்பது’ என்பதையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: διδάσκαλος
  choice: போதகர்
  rationale: இங்கு கற்பிப்பவரைக் குறிக்கும் சொல்லாக, பெயரொலிப்பை விடப் பொருளைத் தெளிவாகத் தருகிறது; சீடர்களுடனான உறவுக்கும் பொருந்துகிறது.
theological_decisions:
- issue: ἰδόντες என்பதற்கான மறைமுகச் செயப்படுபொருளை வெளிப்படுத்த வேண்டுமா?
  choice: தமிழில் ‘அதை’ என்று சேர்த்தல்
  alternative: ‘பார்த்த பரிசேயர்கள்’ என்று செயப்படுபொருளைக் கூறாமல் விடுதல்
  rationale: கிரேக்கம் அவர்கள் எதைப் பார்த்தார்கள் என்று வெளிப்படையாகக் கூறவில்லை; சூழலில் அது இயேசு வரி வசூலிப்பவர்களுடனும் பாவிகளுடனும் உணவருந்திய நிகழ்ச்சியைக் குறிக்கிறது. ‘அதை’ என்பது புதிய இறையியல் விளக்கத்தைச் சேர்க்காமல் தமிழில் தொடர்பைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் சுவிசேஷ உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. கேள்வியின் விமர்சனத் தொனியை அதிகரிக்கவோ தணிக்கவோ செய்யவில்லை.
