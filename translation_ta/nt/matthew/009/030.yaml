  source_fidelity: மூலக் கிரேக்கத்தின் செயப்பாட்டு உருவகம் «அவர்களுடைய கண்கள் திறக்கப்பட்டன» என்று துல்லியமாகத் தரப்பட்டுள்ளது. ἐνεβριμήθη என்பதன் வலுவான, கண்டிப்பான எச்சரிக்கைத் தொனி «கடுமையாக எச்சரித்து» என்பதில் பாதுகாக்கப்படுகிறது. «யாரும் அறிந்துகொள்ளாதபடி பார்த்துக்கொள்ளுங்கள்» என்பது Ὁρᾶτε μηδεὶς γινωσκέτω என்ற எச்சரிக்கை-தடைக் கட்டளையை இயல்பாகவும், வெளிப்படையான செயப்படுபொருளைச் சேர்க்காமலும் வழங்குகிறது.
