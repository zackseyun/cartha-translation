  terminology: «இயேசு», «கண்கள்», «கடுமையாக எச்சரித்து», «பார்த்துக்கொள்ளுங்கள்» ஆகியவை பொருத்தமான பொதுவழக்குச் சொற்கள். அடிக்குறிப்பு அ ἐμβριμάομαι வினையின் வலிமையைச் சரியாகக் குறிப்பிடுகிறது; அடிக்குறிப்பு ஆ மறைமுகமான பொருள் சூழலிலிருந்து அறியப்படுவதைத் தெளிவுபடுத்துகிறது.
