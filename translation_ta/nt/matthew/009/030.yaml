id: MAT.9.30
reference: Matthew 9:30
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἠνεῴχθησαν αὐτῶν οἱ ὀφθαλμοί. καὶ ⸀ἐνεβριμήθη αὐτοῖς ὁ Ἰησοῦς λέγων· Ὁρᾶτε μηδεὶς γινωσκέτω·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/030.yaml
  text: And their eyes were opened[a]. And Jesus sternly warned them, saying[b], “See that no one knows.”
translation:
  language: ta
  text: அவர்களுடைய கண்கள் திறக்கப்பட்டன. இயேசு அவர்களைக் கடுமையாக எச்சரித்து[a], “யாரும் அறிந்துகொள்ளாதபடி பார்த்துக்கொள்ளுங்கள்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கண்டிப்பாகக் கட்டளையிட்டு” அல்லது “கடுமையாக அறிவுறுத்தி” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் வலுவான உணர்ச்சியையும் எச்சரிக்கையின் தீவிரத்தையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “யாரும் அறியாதபடி பார்த்துக்கொள்ளுங்கள்.” எதை அறியக்கூடாது என்பது குணமாக்கப்பட்ட நிகழ்வின் சூழலிலிருந்து புரிகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνεῴχθησαν
  choice: திறக்கப்பட்டன
  rationale: ἀνοίγω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவத்தைத் தக்கவைக்கிறது; பார்வை கிடைத்ததை கிரேக்க மொழியின் உருவகத்தை விரிவுபடுத்தாமல் இயல்பாகத் தெரிவிக்கிறது.
- source_word: οἱ ὀφθαλμοί
  choice: அவர்களுடைய கண்கள்
  rationale: கிரேக்கத்தில் உள்ள உடைமைப் பொருளைத் தெளிவாகவும் இயல்பான நவீனத் தமிழிலும் அளிக்கிறது.
- source_word: ἐνεβριμήθη
  choice: கடுமையாக எச்சரித்து
  rationale: வலுவான உணர்ச்சியோடும் கண்டிப்போடும் கொடுக்கப்பட்ட எச்சரிக்கையை இச்சூழலில் தெளிவாக வெளிப்படுத்துகிறது; ‘கடிந்துகொண்டார்’ என்று மொழிபெயர்த்து தேவையற்ற எதிர்மறைப் பொருளைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: Ὁρᾶτε
  choice: பார்த்துக்கொள்ளுங்கள்
  rationale: இங்கு எச்சரிக்கையுடன் ஒன்றை உறுதிசெய்யுமாறு கட்டளையிடும் வழக்குச் சொல்லாக உள்ளது; தமிழில் ‘பார்த்துக்கொள்ளுங்கள்’ அந்தக் கட்டளைத் தொனியை இயல்பாகக் கொண்டுவருகிறது.
- source_word: μηδεὶς γινωσκέτω
  choice: யாரும் அறிந்துகொள்ளாதபடி
  rationale: μηδείς உடனான மூன்றாம் நபர் கட்டளையின் தடையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது. கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘இதை’ என்ற செயப்படுபொருளை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: λέγων
  choice: என்றார்
  rationale: தமிழின் இயல்பான மேற்கோள் அமைப்புக்கேற்ப கிரேக்கப் பங்கேற்பு வினையை முதன்மை வினையுடன் இணைத்து வழங்குகிறது.
theological_decisions:
- issue: குணமாக்கப்பட்ட செய்தியை வெளியிட வேண்டாம் என்ற இயேசுவின் கட்டளையின் வலிமை
  choice: கடுமையான எச்சரிக்கையாகவும் தடையாகவும் மொழிபெயர்க்கப்பட்டது
  alternative: இயேசு அவர்களைக் கடிந்துகொண்டார் / கண்டிப்பாகக் கட்டளையிட்டார்
  rationale: வசனம் கட்டளையின் வலிமையைத் தெரிவிக்கிறது; ஆனால் அதன் காரணத்தை விளக்கவில்லை. எனவே கட்டளையின் தீவிரம் தக்கவைக்கப்பட்டு, இயேசுவின் நோக்கத்தைப் பற்றிய இறையியல் விளக்கம் எதுவும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கண்கள் திறக்கப்பட்டன’ என்ற வேதாகம உருவகம் இயல்பாகத் தக்கவைக்கப்பட்டுள்ளது; எச்சரிக்கையின் காரணம் விளக்கிச் சேர்க்கப்படவில்லை.
