id: MAT.9.4
reference: Matthew 9:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ⸀εἰδὼς ὁ Ἰησοῦς τὰς ἐνθυμήσεις αὐτῶν εἶπεν· ⸀Ἱνατί ἐνθυμεῖσθε πονηρὰ ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/004.yaml
  text: And Jesus[a], knowing their thoughts, said, “Why are you thinking evil in your hearts?”
translation:
  language: ta
  text: இயேசு அவர்களுடைய எண்ணங்களை அறிந்து, “உங்கள் இதயங்களில் ஏன் தீயவற்றை எண்ணுகிறீர்கள்?” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰδὼς
  choice: அறிந்து
  rationale: இறந்தகாலப் பெயரெச்சம் இயேசு அவர்களின் உள்ளார்ந்த எண்ணங்களை அறிந்திருந்ததை இயல்பாக வெளிப்படுத்துகிறது; அது எவ்வாறு அறியப்பட்டது என்பதை உரைக்கு அப்பால் விளக்கவில்லை.
- source_word: ἐνθυμήσεις
  choice: எண்ணங்கள்
  rationale: உள்ளத்தில் நிகழும் சிந்தனைகளையும் ஆலோசனைகளையும் குறிக்கும் சொல்லுக்கு நவீனத் தமிழில் இயல்பான இணை.
- source_word: Ἱνατί
  choice: ஏன்
  rationale: காரணத்தைக் கேட்கும் கிரேக்க வினாவைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: ἐνθυμεῖσθε
  choice: எண்ணுகிறீர்கள்
  rationale: தொடர்ந்து நடைபெறும் உள்ளார்ந்த சிந்தனையை நிகழ்கால வினையாகத் தருவதுடன், ἐνθυμήσεις என்பதோடும் சொற்பொருள் தொடர்பைப் பேணுகிறது.
- source_word: πονηρὰ
  choice: தீயவற்றை
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் நடுநிலைப் பன்மை அடைமொழியின் பொருளையும் பன்மையையும் தேவையற்ற விளக்கமின்றிப் பேணுகிறது.
- source_word: καρδίαις
  choice: இதயங்களில்
  rationale: சிந்தனையும் நோக்கமும் அடங்கிய உள்ளார்ந்த மனிதனைச் சுட்டும் மூலமொழி உருவகத்தையும் வேதாகம ஒலிநயத்தையும் பேணுகிறது.
theological_decisions:
- issue: சொல்லப்படாத உள்ளார்ந்த எண்ணங்களை இயேசு அறிந்திருத்தல்
  choice: இயேசு அவர்களுடைய எண்ணங்களை அறிந்து
  alternative: இயேசு அவர்களுடைய எண்ணங்களை உணர்ந்து
  rationale: இயேசு அவர்களுடைய உள்ளார்ந்த எண்ணங்களை அறிந்தார் என்ற உரையின் கூற்றைப் பேணுகிறது; அவர் அவற்றை எவ்வாறு அறிந்தார் என்பது குறித்து மேலதிக கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை. ‘இதயங்கள்’ என்ற மூல உருவகம் காக்கப்பட்டுள்ளது; ‘தீயவற்றை’ என்பது πονηρὰ-வின் பெயர்ச்சொல் பயன்பாட்டையும் பன்மையையும் பிரதிபலிக்கிறது.
