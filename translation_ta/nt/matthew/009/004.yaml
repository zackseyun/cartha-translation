  source_fidelity: 'The translation accurately represents the Greek: καὶ is naturally incorporated in Tamil narrative flow; εἰδὼς is rendered by அறிந்து; ἐνθυμήσεις and ἐνθυμεῖσθε are consistently conveyed as எண்ணங்கள் / எண்ணுகிறீர்கள்; πονηρὰ is retained as a substantive plural, தீயவற்றை; and καρδίαις preserves the biblical heart metaphor in இதயங்களில். The question and present-tense force are maintained without adding an explanation of how Jesus knew their thoughts.'
  naturalness: The wording is clear, dignified, and natural in modern standard Tamil. The placement of ஏன் before the object is idiomatic Tamil, and the direct address is appropriately preserved by உங்கள் / எண்ணுகிறீர்கள்.
  terminology: இயேசு, எண்ணங்கள், இதயங்கள், and தீயவற்றை are suitable biblical-register terms. தீயவற்றை faithfully preserves the Greek substantival plural without narrowing it merely to 'evil thoughts' or expanding it doctrinally.
