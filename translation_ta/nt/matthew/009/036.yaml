id: MAT.9.36
reference: Matthew 9:36
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ τοὺς ὄχλους ἐσπλαγχνίσθη περὶ αὐτῶν ὅτι ἦσαν ἐσκυλμένοι καὶ ἐρριμμένοι ⸀ὡσεὶ πρόβατα μὴ ἔχοντα ποιμένα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/036.yaml
  text: And when he saw the crowds[a], he had compassion on them, because they were harassed and cast down, like sheep without a shepherd.
translation:
  language: ta
  text: அவர் மக்கள் கூட்டங்களைக் கண்டபோது, அவர்கள் மேய்ப்பன் இல்லாத ஆடுகளைப்போல் துன்புறுத்தப்பட்டு வீழ்த்தப்பட்டிருந்ததால், அவர்கள்மேல் மனமிரங்கினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: அவர் ... கண்டபோது
  rationale: இறந்தகால வினையெச்சத்தின் காலத் தொடர்பை இயல்பான நவீனத் தமிழில் காட்டுகிறது; δέ இங்கு மென்மையான கதைத் தொடர்ச்சியை அளிப்பதால் தனியாக மொழிபெயர்க்க வேண்டியதில்லை.
- source_word: τοὺς ὄχλους
  choice: மக்கள் கூட்டங்களை
  rationale: ὄχλοι என்பது திரண்டிருந்த பெருந்திரளான மக்களைக் குறிக்கிறது; ‘மக்கள் கூட்டங்கள்’ என்பது இன்றைய தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: ἐσπλαγχνίσθη περὶ αὐτῶν
  choice: அவர்கள்மேல் மனமிரங்கினார்
  rationale: σπλαγχνίζομαι குறிக்கும் ஆழ்ந்த இரக்கத்தை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὅτι
  choice: இருந்ததால்
  rationale: இயேசுவின் இரக்கத்திற்கான காரணத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐσκυλμένοι
  choice: துன்புறுத்தப்பட்டும்
  rationale: σκύλλω என்பதிலுள்ள மோசமாக நடத்தப்படுதல், தொல்லைப்படுத்தப்படுதல், சோர்வடையச் செய்யப்படுதல் ஆகிய பொருள் நிழல்களில், செயப்பாட்டு வடிவையும் மக்கள் அனுபவித்த துயரையும் காக்கிறது.
- source_word: καὶ ἐρριμμένοι
  choice: வீழ்த்தப்பட்டும்
  rationale: ῥίπτω என்பதின் ‘எறிதல்/வீழ்த்துதல்’ என்ற வலுவான காட்சியையும் முற்றிய செயப்பாட்டு நிலையும் காக்கிறது; ‘உதவியற்ற’ என்பது சாத்தியமான ஆனால் விளக்கவுரையான மாற்று.
- source_word: ὡσεὶ πρόβατα μὴ ἔχοντα ποιμένα
  choice: மேய்ப்பன் இல்லாத ஆடுகளைப்போல்
  rationale: தலைமை மற்றும் பாதுகாப்பு இல்லாத நிலையைக் காட்டும் மேய்ப்பியல் உவமையைச் சுருக்கமாகவும் நேரடியாகவும் காக்கிறது.
theological_decisions:
- issue: இயேசுவின் இரக்கத்தைக் குறிக்கும் மொழி
  choice: அவர்கள்மேல் மனமிரங்கினார்
  alternative: அவர்களுக்காக ஆழ்ந்த இரக்கம் கொண்டார்
  rationale: உள்ளத்தின் ஆழத்திலிருந்து எழும் இரக்கத்தைத் தெரிவிக்கிறது; அதேவேளையில் உடல் உறுப்பை அடிப்படையாகக் கொண்ட கிரேக்க மரபுத்தொடரைச் சொல்லுக்குச் சொல் இறுக்கமாக்குவதில்லை.
- issue: மக்கள் கூட்டங்களின் நிலை
  choice: துன்புறுத்தப்பட்டும் வீழ்த்தப்பட்டும்
  alternative: சோர்ந்துபோய் உதவியற்றவர்களாய்
  rationale: இரு கிரேக்க செயப்பாட்டு வினையெச்சங்களின் தீவிரத்தையும் ‘வீழ்த்தப்பட்ட’ என்ற காட்சியையும் காக்கிறது. மாற்று வாசிப்பு அவற்றின் விளைவான சோர்வு மற்றும் இயலாமையை முன்னிறுத்துகிறது; அதை அடிக்குறிப்பில் தருவது மூலத்தின் பொருள் விரிவைத் திறந்தவாறு வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மனமிரங்கினார்’ மற்றும் ‘மேய்ப்பன்’ ஆகியவை பரவலாகப் புரியும் வேதாகமச் சொற்களாக இருந்தாலும் பழமையான வாக்கிய அமைப்பு தவிர்க்கப்பட்டுள்ளது.
