source:
  edition: SBLGNT
  text: ⸀ἔλεγεν· Ἀναχωρεῖτε, οὐ γὰρ ἀπέθανεν τὸ κοράσιον ἀλλὰ καθεύδει· καὶ κατεγέλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/024.yaml
  text: He was saying[a], “Go away, for the girl has not died, but is sleeping.” And they were laughing at him.
translation:
  language: ta
  text: 'அவர் சொல்லிக்கொண்டிருந்தார்: “விலகிச் செல்லுங்கள்; ஏனெனில் சிறுமி இறந்துவிடவில்லை, தூங்கிக்கொண்டிருக்கிறாள்.” அவர்களோ அவரைக் கேலி செய்து சிரித்துக்கொண்டிருந்தார்கள்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரைக் கேலி செய்துகொண்டிருந்தார்கள்.” கிரேக்க வினைச்சொல் ஒருவரை நோக்கிக் கேலியாகச் சிரிப்பதையோ அவரைக் கேலி செய்வதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: அவர் சொல்லிக்கொண்டிருந்தார்
  rationale: இறந்தகாலத் தொடர்நிலை வினை வடிவம், அவர் தொடர்ந்து அல்லது திரும்பத் திரும்பச் சொன்ன காட்சிநிலையை வெளிப்படுத்துகிறது.
- source_word: Ἀναχωρεῖτε
  choice: வெளியே போங்கள்
  rationale: பன்மை ஏவல் வடிவத்தின் வலிமையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; அங்கிருந்தவர்கள் அந்த இடத்தைவிட்டு அகல வேண்டும் என்பதே சூழல்.
- source_word: οὐ γὰρ
  choice: ஏனெனில் ... இல்லை
  rationale: γάρ, முன்வந்த கட்டளைக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: ἀπέθανεν
  choice: இறந்துவிடவில்லை
  rationale: இறப்பை நிகழ்ந்த ஒரு சம்பவமாகக் குறிக்கும் இறந்தகால வினையின் பொருளைத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: τὸ κοράσιον
  choice: சிறுமி
  rationale: κοράσιον என்பது இளம் பெண் குழந்தையைக் குறிக்கிறது; ‘சிறுமி’ சுருக்கமான, இயல்பான நவீனத் தமிழ்.
- source_word: ἀλλὰ καθεύδει
  choice: தூங்கிக்கொண்டிருக்கிறாள்
  rationale: நிகழ்காலச் செயலைத் தக்கவைத்து, இறப்புக்கும் தூக்கத்துக்கும் இடையில் இயேசு கூறும் நேரடியான முரண்பாட்டைப் பாதுகாக்கிறது.
- source_word: κατεγέλων αὐτοῦ
  choice: அவரைப் பார்த்து ஏளனமாகச் சிரித்துக்கொண்டிருந்தார்கள்
  rationale: வினைச்சொல்லிலுள்ள கேலியான சிரிப்பின் பொருளையும், இறந்தகாலத் தொடர்நிலை அம்சத்தையும் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சிறுமி ‘இறந்துவிடவில்லை, தூங்கிக்கொண்டிருக்கிறாள்’ என்ற இயேசுவின் கூற்று
  choice: ‘தூங்கிக்கொண்டிருக்கிறாள்’ என்ற உருவகத்தை விளக்கமின்றி நேரடியாகத் தக்கவைத்தல்
  alternative: ‘தூங்குவது போல இருக்கிறாள்’ அல்லது ‘மரணம் என்னும் தூக்கத்தில் இருக்கிறாள்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: மூலவசனம் இந்தக் கூற்றை விளக்காமல் அதன் கதையியல் மற்றும் இறையியல் அழுத்தத்தோடு முன்வைக்கிறது. அது உருவகமா, தோற்றநிலைச் சொல்லா, அல்லது வரவிருக்கும் உயிர்ப்பை முன்னிட்டுச் சொல்லப்பட்டதா என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. தொடர்நிலை வினைகள் கிரேக்க இறந்தகாலத் தொடர்நிலை அம்சத்தை இயன்றவரைத் தக்கவைக்கின்றன.
