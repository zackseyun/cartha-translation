source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ὄχλοι ⸀ἐφοβήθησαν καὶ ἐδόξασαν τὸν θεὸν τὸν δόντα ἐξουσίαν τοιαύτην τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/008.yaml
  text: But when the crowds saw it[a], they were afraid and glorified God[b], who had given such authority to men.
translation:
  language: ta
  text: கூடியிருந்த மக்கள் இதைக் கண்டபோது பயந்தார்கள்[a]; மனிதர்களுக்கு இப்படிப்பட்ட அதிகாரத்தைக் கொடுத்திருந்த கடவுளை அவர்கள் மகிமைப்படுத்தினார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பயபக்தியால் நிறைந்தார்கள்’ என்றும் பொருள் கொள்ளலாம். கிரேக்க வினையின் நேரடிப் பொருள் ‘பயந்தார்கள்’; இங்கு அந்தப் பயத்தில் பயபக்தியுடனான வியப்பும் அடங்கியிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘மக்களுக்கு’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் இங்கு மனிதர்களைப் பொதுவாகக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: இதைக் கண்டபோது
  rationale: இறந்தகாலப் பங்கேற்புவினை இயல்பான தமிழில் காலத்தைக் குறிக்கும் துணைவாக்கியமாக மொழிபெயர்க்கப்பட்டுள்ளது. ‘இதை’ என்பது முந்தைய சூழலில் நிகழ்ந்த குணமாக்குதலையும் அதனுடன் தொடர்புடைய அதிகார வெளிப்பாட்டையும் சுட்டுகிறது.
- source_word: δὲ
  choice: -ஓ
  rationale: கதை நகர்விலும் மக்களின் எதிர்வினைக்கான மாறுதலிலும் உள்ள மென்மையான வேறுபாட்டை தமிழின் ‘கூட்டங்களோ’ என்ற அமைப்பு இயல்பாகக் காட்டுகிறது.
- source_word: οἱ ὄχλοι
  choice: மக்கள் கூட்டங்கள்
  rationale: மூலத்தின் பன்மை வடிவம் காக்கப்பட்டுள்ளது; ‘திரளான மக்கள்’ என்பதைக் காட்டிலும் இது வடிவத்துக்கு நெருக்கமானதும் நவீன தமிழில் தெளிவானதும் ஆகும்.
- source_word: ἐφοβήθησαν
  choice: பயந்தார்கள்
  rationale: φοβέομαι என்பதன் நேரடியான பொருள் ‘பயப்படுதல்.’ சூழலில் பயபக்தியுடனான வியப்பும் இருக்கக்கூடும்; எனினும் அந்த நுட்பத்தை முதன்மை உரையில் தீர்மானித்து மென்மையாக்காமல் நேரடிப் பொருள் காக்கப்பட்டுள்ளது.
- source_word: ἐδόξασαν
  choice: மகிமைப்படுத்தினார்கள்
  rationale: δοξάζω என்ற முக்கிய இறையியல் வினையின் ‘மகிமைப்படுத்துதல்’ என்ற பொருளையும் சொல்லியல் ஒற்றுமையையும் காக்கிறது.
- source_word: τὸν θεὸν
  choice: கடவுளை
  rationale: வினையின் நேரடிச் செயப்படுபொருளாக உள்ள θεός என்பதற்கான இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: τὸν δόντα
  choice: கொடுத்திருந்த
  rationale: பெயரடைத் தன்மையுள்ள இறந்தகாலப் பங்கேற்புவினை, மக்களின் எதிர்வினைக்கு முன்னரே அதிகாரம் கொடுக்கப்பட்டிருந்ததை இயல்பான தமிழில் காட்டும் தொடர்பு அமைப்பாக வழங்கப்பட்டுள்ளது.
- source_word: ἐξουσίαν
  choice: அதிகாரம்
  rationale: இது வெறும் வல்லமையைவிட உரிமையுடனும் அனுமதியுடனும் செயல்படும் அதிகாரத்தைக் குறிக்கிறது; பாவங்களை மன்னிக்கும் இயேசுவின் அதிகாரம் பற்றிய சூழலுக்கும் பொருந்துகிறது.
- source_word: τοιαύτην
  choice: இப்படிப்பட்ட
  rationale: τοιαύτην என்பதன் வகை/தன்மை குறிக்கும் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τοῖς ἀνθρώποις
  choice: மனிதர்களுக்கு
  rationale: ἄνθρωποι இங்கு மனிதர்களைப் பொதுவாகக் குறிக்கக்கூடிய பன்மைச் சொல். ‘மனிதர்களுக்கு’ என்பது அதன் பன்மையையும் மனிதகுலப் பொருளையும் தமிழில் துல்லியமாகக் காக்கிறது.
theological_decisions:
- issue: மக்களின் எதிர்வினை பயமா அல்லது பயபக்தியுடனான வியப்பா
  choice: பயந்தார்கள்
  alternative: பயபக்தியால் நிறைந்தார்கள் / பிரமித்தார்கள்
  rationale: கிரேக்க வினை நேரடியாகப் பயத்தைக் குறிக்கிறது. பயபக்தியுடனான வியப்பு சூழலில் சாத்தியமானாலும், உணர்ச்சியின் இறையியல் நுட்பத்தை மொழிபெயர்ப்பிலேயே தீர்மானிக்காமல் பதற்றம் காக்கப்பட்டுள்ளது.
- issue: τοῖς ἀνθρώποις என்பது குறிப்பிட்ட ஆண்களையா அல்லது மனிதர்களைப் பொதுவாகவா குறிக்கிறது
  choice: மனிதர்களுக்கு
  alternative: மக்களுக்கு
  rationale: ἄνθρωπος பொதுவாக மனிதர்களைக் குறிக்க முடியும்; இங்குள்ள பன்மையைப் பாதுகாக்கும் அதே நேரத்தில் ஆண்களுக்கு மட்டும் என்று தமிழில் தேவையின்றிக் கட்டுப்படுத்தாமல் ‘மனிதர்களுக்கு’ என வழங்கப்பட்டுள்ளது. இயேசுவின் செயலைக் கண்டு மனிதர்களுக்கு இத்தகைய அதிகாரம் கொடுக்கப்பட்டதாக மக்கள் கூறும் உரைநடைப் பதற்றமும் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் பன்மை, பயம் குறித்த தெளிவும் நுட்பமும், அதிகாரம் மனிதர்களுக்குக் கொடுக்கப்பட்டது என்ற உரைநடைப் பதற்றமும் காக்கப்பட்டுள்ளன.
