base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/032.yaml
  text: As they were going out[a], behold, they brought to him a mute[c][b], demon-possessed man.
translation:
  language: ta
  text: அவர்கள் வெளியே போய்க்கொண்டிருந்தபோது, இதோ, பேய் பிடித்திருந்த[b], பேச முடியாத[a] ஒரு மனிதனை அவரிடம் கொண்டுவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “காது கேளாத.” கிரேக்கச் சொல் சூழலுக்கேற்ப “பேச முடியாத” அல்லது “காது கேளாத” என்று பொருள்படும். அடுத்த வசனத்தில் அவர் பேசியதாகக் கூறப்படுவதால் இங்கு “பேச முடியாத” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பேயின் ஆளுகைக்குள்ளாகியிருந்த.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτῶν δὲ ἐξερχομένων
  choice: அவர்கள் வெளியே போய்க்கொண்டிருந்தபோது
  rationale: மரபுத்தொடரின் காலச்சூழலை இயல்பான தமிழில் தருகிறது; δέ இங்கு காட்சிமாற்றத்தைக் குறிப்பதால் தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: திடீரென நிகழ்வின்மீது கவனத்தை ஈர்க்கும் கிரேக்கச் சொல்லின் கதையாடல் வலிமையைத் தக்கவைக்கிறது.
- source_word: προσήνεγκαν αὐτῷ
  choice: அவரிடம் கொண்டுவந்தார்கள்
  rationale: ஒருவரை இயேசுவிடம் கொண்டுவருதல் என்ற பொருளையும் αὐτῷ என்பதையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἄνθρωπον
  choice: ஒரு மனிதனை
  rationale: இங்கு குறிப்பிடப்படும் தனிநபரை இயல்பான, மரியாதையான தமிழில் குறிக்கிறது.
- source_word: κωφὸν
  choice: பேச முடியாத
  rationale: κωφός என்பது சூழலுக்கேற்ப பேச முடியாதவர் அல்லது காது கேளாதவர் எனப் பொருள்படலாம்; அடுத்த வசனத்தில் அவர் பேசினார் என்று கூறப்படுவதால் இங்கு பேச்சின்மையே முதன்மைப்படுத்தப்படுகிறது.
- source_word: δαιμονιζόμενον
  choice: பேய் பிடித்திருந்த
  rationale: நற்செய்தி நூல்களின் பேய்சார் துன்புறுத்தல் சூழலில் பொதுவாகப் புரியும் இயல்பான தமிழ்; அதன் துல்லியமான செயல்முறையை வசனத்திற்கு அப்பால் வரையறுக்கவில்லை.
theological_decisions:
- issue: பேய்சார் துன்புறுத்தலைக் குறிக்கும் மொழி
  choice: பேய் பிடித்திருந்த
  alternative: பேயின் ஆளுகைக்குள்ளாகியிருந்த
  rationale: வசனம் பேய்சார் துன்புறுத்தலை நேரடியான நிகழ்வாகக் கூறுவதைப் பாதுகாக்கிறது; அதேவேளையில் அந்த நிலையின் இயல்பைப் பற்றி உரையில் இல்லாத கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் வகையிலும் கதையாடலுக்குரிய கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. “இதோ” என்பது மூலத்தின் கவன ஈர்ப்பைத் தக்கவைக்கிறது; κωφός என்பதிலுள்ள உண்மையான பொருள் இருமை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
