id: MAT.9.35
reference: Matthew 9:35
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ὁ Ἰησοῦς τὰς πόλεις πάσας καὶ τὰς κώμας, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν ⸀μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/035.yaml
  text: And Jesus went throughout all the cities and villages[b][a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness.
translation:
  language: ta
  text: இயேசு எல்லா நகரங்களிலும் கிராமங்களிலும் சுற்றித் திரிந்து, அவர்களுடைய ஜெபக்கூடங்களில் கற்பித்து, அரசாட்சியின் நற்செய்தியை[a] அறிவித்து, எல்லா நோய்களையும் எல்லா சுகவீனங்களையும்[b] குணமாக்கிவந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரசாட்சியின் சுவிசேஷத்தை.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எல்லா பலவீனங்களையும்” அல்லது “எல்லா உடல்நலக் குறைவுகளையும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περιῆγεν
  choice: சுற்றிச் சென்று
  rationale: முற்றுப்பெறாத கால வினை வடிவம் தொடர்ச்சியான பயணச் செயல்பாட்டைக் குறிக்கிறது; ‘சுற்றிச் சென்று’ என்பது இதை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: πόλεις πάσας καὶ τὰς κώμας
  choice: எல்லாப் பட்டணங்களையும் கிராமங்களையும்
  rationale: பெரிய குடியிருப்புகளுக்கும் சிறிய ஊர்களுக்கும் இடையிலான மூலமொழி வேறுபாட்டைத் தக்கவைத்து, πάσας என்பதன் முழுமையான பரப்பையும் வெளிப்படுத்துகிறது.
- source_word: διδάσκων
  choice: கற்பித்தார்
  rationale: இயேசுவின் தொடர்ச்சியான போதனைச் செயலை எளிய, கண்ணியமான தமிழில் தெரிவிக்கிறது.
- source_word: συναγωγαῖς αὐτῶν
  choice: அவர்களுடைய ஜெபக்கூடங்களில்
  rationale: αὐτῶν என்ற உடைமைச் சுட்டைத் தக்கவைக்கிறது; ‘ஜெபக்கூடம்’ என்பது யூதர்களின் வரலாற்று வழிபாட்டுக் கூடத்தைக் குறிக்கும் தமிழில் பரவலாகப் புரியக்கூடிய சொல்.
- source_word: κηρύσσων
  choice: அறிவித்தார்
  rationale: ஒரு செய்தியைப் பொதுவாகப் பிரகடனப்படுத்தும் κηρύσσω என்பதன் வலிமையைச் சபைச்சார்ந்த சிறப்புப் பொருள் சேர்க்காமல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὸ εὐαγγέλιον τῆς βασιλείας
  choice: அரசாட்சியின் நற்செய்தி
  rationale: εὐαγγέλιον என்பதன் நேரடியான பொருளை ‘நற்செய்தி’ எனவும், τῆς βασιλείας என்ற தொடர்பை விளக்கி விரிவாக்காமல் ‘அரசாட்சியின்’ எனவும் தக்கவைக்கிறது.
- source_word: θεραπεύων
  choice: குணமாக்கினார்
  rationale: நோயிலிருந்து நலம் அளிக்கும் செயலை இச்சூழலில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: πᾶσαν νόσον
  choice: எல்லா நோய்களையும்
  rationale: νόσος என்பதற்கு இயல்பான தமிழ் இணையான ‘நோய்’ பயன்படுத்தப்பட்டு, πᾶσαν என்பதன் முழுமையான பரப்பு தக்கவைக்கப்பட்டுள்ளது.
- source_word: πᾶσαν μαλακίαν
  choice: எல்லா உடல்நலக் குறைவுகளையும்
  rationale: μαλακία குறிக்கக்கூடிய பலவீனம், சுகவீனம் அல்லது உடல் தளர்ச்சி ஆகிய பரப்பை நவீன வாசகருக்குத் தெளிவாகக் காட்டுகிறது; νόσος என்பதிலிருந்து சொல் வேறுபாடும் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: εὐαγγέλιον என்பதன் மொழிபெயர்ப்பு
  choice: நற்செய்தி
  alternative: சுவிசேஷம்
  rationale: ‘நற்செய்தி’ என்பது கிரேக்கச் சொல்லின் பொருளை நவீன வாசகருக்கு நேரடியாகத் தெரிவிக்கிறது; பாரம்பரியமான ‘சுவிசேஷம்’ அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: τῆς βασιλείας என்பதில் அரசாட்சியின் அடையாளம்
  choice: அரசாட்சி
  alternative: இறையாட்சி
  rationale: மூல வசனத்தில் θεοῦ அல்லது οὐρανῶν இல்லை. ஆகவே சூழலால் உணரப்படும் கடவுளின் அரசாட்சி என்பதை உரைக்குள் வெளிப்படையாகச் சேர்க்காமல், மூலத்தின் சுருக்கத்தையும் இறையியல் நெருக்கடியையும் தக்கவைக்கிறது.
- issue: πᾶσαν νόσον καὶ πᾶσαν μαλακίαν என்பதன் முழுமையான பரப்பு
  choice: எல்லா நோய்களையும் எல்லா உடல்நலக் குறைவுகளையும்
  alternative: ஒவ்வொரு நோயையும் ஒவ்வொரு பலவீனத்தையும்
  rationale: மீண்டும் வரும் πᾶσαν என்பதன் விரிவான பரப்பை இரு பெயர்ச்சொற்களுடனும் வெளிப்படையாகத் தக்கவைக்கிறது; இது உரையின் கூற்று மட்டுமே, அதற்கு அப்பாற்பட்ட கோட்பாட்டு முடிவைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் இணைந்த நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தில் ஒரே வாக்கியத்தில் வரும் மூன்று நிகழ்காலப் பங்கேற்பு வடிவங்கள் தமிழில் தெளிவுக்காக இணையான இறந்தகால வினைமுற்றுகளாக அமைக்கப்பட்டுள்ளன; அவற்றின் தொடர்ச்சியான ஊழியச் செயல்பாடு ‘சுற்றிச் சென்று’ என்ற அமைப்பால் பாதுகாக்கப்படுகிறது.
