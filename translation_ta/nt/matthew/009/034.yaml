  yaml_path: translation/nt/matthew/009/034.yaml
  text: But the Pharisees were saying[a], “By the ruler of the demons he casts out the demons.”
translation:
  language: ta
  text: ஆனால் பரிசேயர்கள், “பேய்களின் தலைவனால்[a] அவன் பேய்களை வெளியேற்றுகிறான்” என்று சொல்லிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தலைவன்” என்பதற்கு “ஆட்சியாளர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் மக்களின் வியப்புக்கும் இங்கு பரிசேயர்கள் கூறும் எதிர்மறையான விளக்கத்துக்கும் இடையிலான முரண்பாட்டை இயல்பாகக் காட்டுகிறது.
- source_word: Φαρισαῖοι
  choice: பரிசேயர்கள்
  rationale: இந்த யூத சமயக் குழுவுக்கான வழக்கமான, தெளிவான தமிழ்ப் பெயர்; கிரேக்கப் பன்மையும் தக்கவைக்கப்படுகிறது.
- source_word: ἔλεγον
  choice: சொல்லிக்கொண்டிருந்தார்கள்
  rationale: கிரேக்க இறந்தகாலத் தொடர்நிலை வடிவம் நீடித்த அல்லது திரும்பத் திரும்ப நிகழ்ந்த பேச்சைக் குறிக்கக்கூடும்; தமிழில் இந்த வடிவம் அந்த அம்சத்தைப் பாதுகாக்கிறது.
- source_word: Ἐν τῷ ἄρχοντι
  choice: ஆட்சியாளனைக் கொண்டு
  rationale: ἐν உடன் வரும் வேற்றுமை இங்கு கருவி அல்லது செயலாற்றும் வழிமூலத்தைக் குறிக்கிறது; பரிசேயர்களின் குற்றச்சாட்டை கூடுதல் விளக்கமின்றி இயல்பான தமிழில் தருகிறது.
- source_word: ἄρχοντι
  choice: ஆட்சியாளன்
  rationale: அதிகாரம் செலுத்துபவர் என்ற ἄρχων சொல்லின் நேரடியான பொருளைத் தருகிறது; அரச மரபைச் சேர்ந்த இளவரசன் என்ற தேவையற்ற கருத்தைத் தவிர்க்கிறது.
- source_word: τῶν δαιμονίων / τὰ δαιμόνια
  choice: பேய்களின் / பேய்களை
  rationale: δαιμόνια என்பதற்கு நவீனத் தமிழில் தெளிவாகவும் சுருக்கமாகவும் உள்ள நேரடி இணை; ஒரே கிரேக்கச் சொல்லின் மீளுரைப்பும் தக்கவைக்கப்படுகிறது.
- source_word: ἐκβάλλει
  choice: வெளியேற்றுகிறான்
  rationale: ஒருவரிடமிருந்து பேய்களை அகற்றும் சூழலில் ἐκβάλλω என்பதன் செயற்பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: δαιμόνια என்பதைக் குறிப்பாகப் பெயரிடுதல்
  choice: பேய்கள்
  alternative: தீய ஆவிகள்
  rationale: மூலத்தில் πνεύματα அல்ல, δαιμόνια என்ற குறிப்பிட்ட சொல் உள்ளது. ஆகவே இயற்கைக்கு அப்பாற்பட்ட உயிர்களைக் குறித்த உரையின் கூற்றை மென்மையாக்காமல் நேரடியாக மொழிபெயர்க்கப்படுகிறது.
- issue: இயேசுவின் அதிகாரத்தின் மூலத்தைப் பற்றிய பரிசேயர்களின் குற்றச்சாட்டு
  choice: “பேய்களின் ஆட்சியாளனைக் கொண்டு” என்ற கருவிப்பொருள்
  alternative: “பேய்களின் ஆட்சியாளனின் வல்லமையால்”
  rationale: கிரேக்க வாசகம் வழிமூலம் அல்லது செயலாற்றும் கருவியை மட்டும் வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத “வல்லமை” என்ற பெயர்ச்சொல்லைச் சேர்க்காமல் அதன் இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. “இவன்” என்பது மேற்கோளுக்குள் பரிசேயர்கள் இயேசுவைக் குறிப்பிடுவதை இயல்பாகக் காட்டுகிறது; அவர்களின் குற்றச்சாட்டின் தொனியோடு பொருந்தினாலும் தனியாக அவமதிப்புச் சொல்லைச் சேர்ப்பதில்லை.
