id: MAT.9.18
reference: Matthew 9:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ταῦτα αὐτοῦ λαλοῦντος αὐτοῖς ἰδοὺ ἄρχων εἷς ⸀ἐλθὼν προσεκύνει αὐτῷ λέγων ὅτι Ἡ θυγάτηρ μου ἄρτι ἐτελεύτησεν· ἀλλὰ ἐλθὼν ἐπίθες τὴν χεῖρά σου ἐπ’ αὐτήν, καὶ ζήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/018.yaml
  text: While he was saying these things to them, look, a ruler came and bowed down before him, saying, “My daughter has just died. But come and lay your hand on her, and she will live.”
translation:
  language: ta
  text: அவர் அவர்களிடம் இவற்றைப் பேசிக்கொண்டிருந்தபோது, இதோ, ஒரு தலைவர் வந்து அவர்முன் பணிந்து, “என் மகள் இப்போதுதான் இறந்துவிட்டாள். ஆனால் நீங்கள் வந்து உங்கள் கையை அவள்மேல் வையுங்கள்; அவள் உயிர்வாழ்வாள்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: நிகழ்வில் திடீரென தோன்றும் புதிய நபர்மீது கவனத்தை ஈர்க்கும் கிரேக்கச் சொல்லின் உரையாடல் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: ἄρχων
  choice: ஒரு தலைவர்
  rationale: அவரது துல்லியமான பதவி இவ்வசனத்தில் குறிப்பிடப்படாததால், பொதுவான அதிகாரி அல்லது சமூகத் தலைவர் என்ற பொருளைத் திறந்தவையாக வைத்திருக்கிறது.
- source_word: προσεκύνει
  choice: அவரைப் பணிந்துகொண்டு
  rationale: உடலால் தாழ்ந்து மரியாதை செலுத்துதல் என்ற பொருளை வெளிப்படுத்துகிறது; இங்கு வழிபாடு என்ற இறையியல் முடிவைத் தேவையின்றி முன்கூட்டியே நிர்ணயிப்பதைத் தவிர்க்கிறது.
- source_word: ἄρτι ἐτελεύτησεν
  choice: இப்போதுதான் இறந்துவிட்டாள்
  rationale: ἄρτι என்பதன் உடனடித் தன்மையையும் ἐτελεύτησεν என்பதன் மரணத்தைக் குறிக்கும் தெளிவையும் காக்கிறது.
- source_word: ζήσεται
  choice: உயிர்பெறுவாள்
  rationale: இறந்த மகள் மீண்டும் உயிருடன் இருப்பாள் என்ற சூழ்நிலைப் பொருளை இயல்பாகவும் தெளிவாகவும் தருகிறது.
theological_decisions:
- issue: προσκυνέω என்ற வினை வழிபாட்டையா மரியாதைப் பணிவையா குறிக்கிறது?
  choice: அவரைப் பணிந்துகொண்டு
  alternative: அவரை வழிபட்டு
  rationale: சொல் இரு நிழற்பொருள்களையும் ஏற்கக்கூடியது. இச்சூழலில் உடலால் பணிந்து வேண்டுதல் என்பது உறுதி; ‘வழிபட்டு’ என்பது நோக்கத்தை அதிகமாகத் தீர்மானித்துவிடும்.
- issue: தலைவரின் கூற்று வேண்டுகோளா அல்லது நம்பிக்கையுள்ள உறுதியுரையா?
  choice: “உமது கையை அவள்மேல் வையும்; அப்போது அவள் உயிர்பெறுவாள்”
  alternative: “உமது கையை அவள்மேல் வைத்தருளும்; அவள் உயிர்பெறுவாள்”
  rationale: கிரேக்க உரையின் கட்டளை வடிவத்தையும் அதைத் தொடரும் எதிர்கால உறுதியையும் காக்கிறது; கூடுதல் பக்தி மரியாதைச் சொல்லைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; இயல்பான ஆனால் கண்ணியமான விவரண நடை. இயேசுவை நோக்கிய உரையில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் இல்லாத பதவி விவரம் அல்லது இறையியல் விளக்கம் சேர்க்கப்படவில்லை.
