review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the ruler's arrival, act of bowing, report that his daughter has just died, and confidence that she will live if Jesus lays his hand on her. However, the imperative «வையும்» is not suitable modern-standard Tamil in this construction. The revision uses a natural honorific imperative and renders ζήσεται as “will live,” without adding an interpretive nuance.
  naturalness: «அவரைப் பணிந்துகொண்டு» is understandable, but «அவர்முன் பணிந்து» more directly and naturally represents the bodily act of προσκυνέω in this context. Consistent modern honorific plural forms («நீங்கள் / உங்கள் / வையுங்கள்») improve idiomatic flow.
  terminology: «ஒரு தலைவர்» appropriately leaves ἄρχων unspecified. «அவர்முன் பணிந்து» preserves the gesture without prematurely deciding that προσκυνέω here specifically denotes worship. «உயிர்வாழ்வாள்» is a direct, natural contextual rendering of ζήσεται.
  issues:
  - severity: medium
    issue: The quoted request uses «வையும்».
    rationale: With the respectful address used in the verse, «வையும்» is not a natural modern-standard Tamil imperative. «வையுங்கள்» is the appropriate honorific imperative.
  - severity: low
    issue: Honorific address is inconsistent in register.
    rationale: «நீர் / உமது» alongside the imperative «வையும்» is stylistically uneven for modern standard Tamil. «நீங்கள் / உங்கள் / வையுங்கள்» is consistent and natural.
  - severity: low
    issue: «அவரைப் பணிந்துகொண்டு» is slightly less direct than the Greek gesture.
    rationale: «அவர்முன் பணிந்து» clearly expresses bowing/prostration before him while retaining the source's ambiguity concerning worship.
  revised_text: அவர் அவர்களிடம் இவற்றைப் பேசிக்கொண்டிருந்தபோது, இதோ, ஒரு தலைவர் வந்து அவர்முன் பணிந்து, “என் மகள் இப்போதுதான் இறந்துவிட்டாள். ஆனால் நீங்கள் வந்து உங்கள் கையை அவள்மேல் வையுங்கள்; அவள் உயிர்வாழ்வாள்” என்றார்.
