revisions:
- from: அவர் அவர்களிடம் இவற்றைப் பேசிக்கொண்டிருந்தபோது, இதோ, ஒரு தலைவர் வந்து அவரைப் பணிந்துகொண்டு, “என் மகள் இப்போதுதான் இறந்துவிட்டாள். ஆனாலும் நீர் வந்து உமது கையை அவள்மேல் வையும்; அப்போது அவள் உயிர்பெறுவாள்” என்றார்.
  to: அவர் அவர்களிடம் இவற்றைப் பேசிக்கொண்டிருந்தபோது, இதோ, ஒரு தலைவர் வந்து அவர்முன் பணிந்து, “என் மகள் இப்போதுதான் இறந்துவிட்டாள். ஆனால் நீங்கள் வந்து உங்கள் கையை அவள்மேல் வையுங்கள்; அவள் உயிர்வாழ்வாள்” என்றார்.
  rationale: The revision corrects the imperative, regularizes the respectful address in modern standard Tamil, and makes the ruler’s bowing explicit without imposing a worship interpretation. It retains the source sequence, the unspecified sense of ἄρχων, the immediacy of the death, and the ruler’s future-oriented assertion that his daughter will live.
