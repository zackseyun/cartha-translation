id: MAT.9.25
reference: Matthew 9:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐξεβλήθη ὁ ὄχλος, εἰσελθὼν ἐκράτησεν τῆς χειρὸς αὐτῆς, καὶ ἠγέρθη τὸ κοράσιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/025.yaml
  text: But when the crowd had been put outside[a], he went in and took her by the hand, and the girl rose.
translation:
  language: ta
  text: ஆனால், கூட்டம் வெளியே அனுப்பப்பட்டபின், அவர் உள்ளே சென்று அவளுடைய கையைப் பிடித்தார்; சிறுமி எழுந்தாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சிறுமி எழுப்பப்பட்டாள்.”
    reason: ἠγέρθη என்ற கிரேக்கச் செயப்பாட்டு வினையை விளைவைக் குறிக்கும் ‘எழுந்தாள்’ என்றும், செயப்பாட்டை வெளிப்படையாகக் காட்டும் ‘எழுப்பப்பட்டாள்’ என்றும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: ὅτε δὲ
  choice: ஆனால், …பின்
  rationale: ὅτε காலத் தொடர்பைக் குறிக்கிறது; δέ மென்மையான கதைத் தொடர்ச்சி அல்லது மாறுதலைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாக அமைய ‘ஆனால்’ மற்றும் ‘…பின்’ பயன்படுத்தப்பட்டன.
- source_word: ἐξεβλήθη ὁ ὄχλος
  choice: கூட்டம் வெளியே அனுப்பப்பட்டபின்
  rationale: இறந்தவருக்காகப் புலம்பியவர்களையும் அங்கு கூடியிருந்தவர்களையும் அறையிலிருந்து அகற்றிய சூழலில், வினையின் செயப்பாட்டு வடிவத்தைப் பேணும் இயல்பான தமிழ் இது. ‘துரத்தப்பட்டபின்’ என்பது மூலச்சொல் அவசியமாகக் குறிக்காத கடுமையை இச்சூழலில் சேர்க்கக்கூடும்.
- source_word: εἰσελθὼν
  choice: அவர் உள்ளே சென்று
  rationale: முதன்மைச் செயலுக்கு முன் நிகழும் தொடர்ச்சியான செயலைக் குறிக்கும் இறந்தகால வினையெச்சம், தமிழில் இயல்பான தொடர் வினையாக மொழிபெயர்க்கப்பட்டது.
- source_word: ἐκράτησεν τῆς χειρὸς αὐτῆς
  choice: அவளுடைய கையைப் பிடித்தார்
  rationale: κρατέω என்பதுடன் வரும் உறவுவேற்றுமை இங்கு ‘கையைப் பற்றிக்கொள்’ என்ற பொருளைத் தருகிறது. ‘கையைப் பிடித்தார்’ தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: ἠγέρθη
  choice: எழுந்தாள்
  rationale: செயப்பாட்டு வடிவிலுள்ள ἐγείρω இச்சூழலில் விளைவைக் குறிக்கும் வகையில் ‘எழுந்தாள்’ என இயல்பாக வழங்கப்படலாம். இதனால் செய்பவர் யார் என்பதை வாக்கியம் வெளிப்படையாகச் சேர்க்காமல் மூலத்தின் திறந்த தன்மை காக்கப்படுகிறது.
- source_word: τὸ κοράσιον
  choice: சிறுமி
  rationale: κοράσιον என்பது பெண் குழந்தையையோ இளம் சிறுமியையோ குறிக்கிறது. ‘சிறுமி’ சுருக்கமானதும் நவீன வாசகருக்கு இயல்பானதும் ஆகும்.
theological_decisions:
- issue: உயிர் திரும்பிய சூழலில் ἠγέρθη என்பதன் மொழிபெயர்ப்பு
  choice: சிறுமி எழுந்தாள்
  alternative: சிறுமி எழுப்பப்பட்டாள்
  rationale: ‘எழுந்தாள்’ என்பது நிகழ்ந்த விளைவை இயல்பாகச் சொல்கிறது; ‘எழுப்பப்பட்டாள்’ என்பது கிரேக்க வினையின் செயப்பாட்டு வடிவத்தை இன்னும் வெளிப்படையாகக் காட்டுகிறது. முதன்மை உரை செய்பவரை இலக்கண ரீதியாகத் தெளிவுபடுத்தாமல், மாற்று வாசிப்பை அடிக்குறிப்பில் தருவதன் மூலம் மூலத்திலுள்ள இறையியல் நுட்பமும் திறந்த தன்மையும் பேணப்படுகின்றன.
translation_notes:
  register: நவீனச் செந்தமிழை அடிப்படையாகக் கொண்ட, எளிதில் புரியும் கண்ணியமான கதைநடை. தேவையற்ற பழமையான சொற்களும் விளக்கச் சேர்க்கைகளும் தவிர்க்கப்பட்டுள்ளன; மரியாதை ஒருமைக்காக இயேசுவைக் குறிக்க ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது.
