id: MAT.9.14
reference: Matthew 9:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τότε προσέρχονται αὐτῷ οἱ μαθηταὶ Ἰωάννου λέγοντες· Διὰ τί ἡμεῖς καὶ οἱ Φαρισαῖοι νηστεύομεν ⸀πολλά, οἱ δὲ μαθηταί σου οὐ νηστεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/014.yaml
  text: Then John's disciples came to him[a], saying, “Why do we and the Pharisees fast often, but your disciples do not fast?”
translation:
  language: ta
  text: அப்போது யோவானின் சீடர்கள் அவரிடம் வந்து, “நாங்களும் பரிசேயர்களும் அடிக்கடி நோன்பிருக்கிறோம்[a]; ஆனால் உம்முடைய சீடர்கள் ஏன் நோன்பிருப்பதில்லை?” என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மிகுதியாக நோன்பிருக்கிறோம்” அல்லது “பலமுறை நோன்பிருக்கிறோம்” என்றும் மொழிபெயர்க்கலாம்; நோன்பிருத்தலுடன் வரும் πολλά என்ற கிரேக்கச் சொல் அது அடிக்கடி கடைப்பிடிக்கப்படுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: அப்போது
  rationale: அடுத்த நிகழ்வை அறிமுகப்படுத்தும் காலச் சுட்டியாக இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: προσέρχονται αὐτῷ
  choice: அவரிடம் வந்து
  rationale: இயேசுவை அணுகிச் சென்ற இயக்கத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: யோவானின் சீடர்கள்
  rationale: உடைமைப் பொருளுடைய கிரேக்க வேற்றுமையைத் தெளிவான தமிழில் தருகிறது.
- source_word: λέγοντες
  choice: என்று கேட்டார்கள்
  rationale: சொல்லுதல் வடிவில் வந்த கேள்வியை இயல்பான தமிழ் உரையாடல் நடையில் வெளிப்படுத்துகிறது; கேள்வியின் செயலைத் தெளிவாக்குகிறது.
- source_word: Διὰ τί
  choice: ஏன்
  rationale: காரணத்தை வினவும் சொற்றொடருக்கான நேரடியான, இயல்பான தமிழ் இணை.
- source_word: ἡμεῖς καὶ οἱ Φαρισαῖοι
  choice: நாங்களும் பரிசேயர்களும்
  rationale: வலியுறுத்தப்பட்ட முதலாம் நபர் பன்மையையும் ஒப்பிடப்படும் குழுவையும் தக்கவைக்கிறது.
- source_word: νηστεύομεν
  choice: நோன்பிருக்கிறோம்
  rationale: உணவைத் தவிர்க்கும் சமயப் பழக்கத்திற்கான பொதுவாகப் புரியும் தமிழ் சொல்.
- source_word: πολλά
  choice: அடிக்கடி
  rationale: νηστεύομεν என்பதுடன் வினையடைப் பொருளில் வந்து, நோன்பின் தொடர்ச்சியான அல்லது மீண்டும் மீண்டும் நிகழும் பழக்கத்தைக் குறிக்கிறது.
- source_word: οἱ δὲ μαθηταί σου
  choice: ஆனால் உம்முடைய சீடர்கள்
  rationale: δέ குறிக்கும் முரண்பாட்டைத் தெளிவாகக் காட்டுகிறது; இயேசுவை நோக்கிய மரியாதையான ஒருமை முன்னிலையையும் பேணுகிறது.
- source_word: οὐ νηστεύουσιν
  choice: நோன்பிருப்பதில்லை
  rationale: ஒரு குறிப்பிட்ட தருணத்தைவிட வழக்கமான நடைமுறையின்மையை நிகழ்காலத்தில் காட்டுகிறது.
theological_decisions:
- issue: நோன்பைப் பற்றிய முறையீட்டின் தன்மை
  choice: வழக்கமான சமய நடைமுறைகளின் ஒப்பீடாகக் கேள்வியை மொழிபெயர்த்தல்
  alternative: இயேசுவின் சீடர்கள் கட்டாயமான கடமையைப் புறக்கணித்ததாகக் குற்றஞ்சாட்டுதல்; அல்லது ஒரு குறிப்பிட்ட நோன்பு நாளை மட்டும் குறிப்பதாகக் கொள்ளுதல்
  rationale: நிகழ்கால வினைச்சொற்களும் πολλά என்பதன் வினையடைப் பயன்பாடும் பொதுவான, மீண்டும் நிகழும் நடைமுறையைக் குறிக்கின்றன. மூலத்தில் இல்லாத வலுவான குற்றச்சாட்டை மொழிபெயர்ப்பு சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. சமயச் சூழலில் பரவலாகப் புரியும் “நோன்பிருத்தல்” தெரிவுசெய்யப்பட்டது. இயேசுவை நேரடியாக அழைக்கும் இடத்தில் மரியாதையான “உம்முடைய” பயன்படுத்தப்பட்டுள்ளது.
