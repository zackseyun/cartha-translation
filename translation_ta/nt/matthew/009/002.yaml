source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ προσέφερον αὐτῷ παραλυτικὸν ἐπὶ κλίνης βεβλημένον. καὶ ἰδὼν ὁ Ἰησοῦς τὴν πίστιν αὐτῶν εἶπεν τῷ παραλυτικῷ· Θάρσει, τέκνον· ⸀ἀφίενταί ⸂σου αἱ ἁμαρτίαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/002.yaml
  text: And behold[a], they brought to him a paralytic lying on a bed. And when Jesus saw their faith, he said to the paralytic, “Take courage, child[c][b]; your sins are forgiven.”
translation:
  language: ta
  text: இதோ[a], படுக்கையில் கிடந்த பக்கவாத நோயாளி ஒருவரை அவரிடம் கொண்டுவந்தார்கள். இயேசு அவர்களுடைய[b] விசுவாசத்தைக் கண்டு, அந்தப் பக்கவாத நோயாளியிடம், “துணிவுகொள், பிள்ளையே! உன் பாவங்கள் மன்னிக்கப்படுகின்றன[c]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாருங்கள்.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் “அவர்களுடைய விசுவாசம்.” இந்தப் பன்மை பக்கவாத நோயாளியையும் அவரைக் கொண்டுவந்தவர்களையும் குறிக்கலாம்; அல்லது கொண்டுவந்தவர்களை மட்டும் குறிக்கலாம்.
    reason: alternative_reading
  - marker: c
    text: அல்லது, “உன் பாவங்கள் மன்னிக்கப்பட்டிருக்கின்றன.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கதையில் வாசகரின் கவனத்தைத் திருப்பும் கிரேக்க உரையாடல் குறியின் உயிரோட்டத்தைத் தக்கவைக்கிறது; நவீன தமிழிலும் சுருக்கமாகவும் புரிந்துகொள்ளத்தக்கதாகவும் உள்ளது.
- source_word: προσέφερον
  choice: கொண்டுவந்தார்கள்
  rationale: இச்சூழலில் ஒருவரை இயேசுவிடம் கொண்டுவரும் செயலை இயல்பான தமிழ் இறந்தகால நடையில் தெரிவிக்கிறது. கிரேக்க இறந்தகாலத் தொடர்ச்சியுரு பின்னணிச் செயலைச் சுட்டலாம்; ஆனால் தமிழில் செயல் நடந்துகொண்டிருந்தது என்று வலியுறுத்த வேண்டிய கட்டாயம் இல்லை.
- source_word: παραλυτικὸν
  choice: பக்கவாத நோயாளி ஒருவர்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட பெயரடையை நவீன வாசகர்களுக்கு தெளிவாக வழங்குகிறது; மூலத்தில் இல்லாத பாலினத்தைக் குறிப்பிடவில்லை.
- source_word: ἐπὶ κλίνης βεβλημένον
  choice: படுக்கையில் கிடந்த
  rationale: அந்த நபரின் நிலையையும் உடல் அமைவையும் இயல்பான தமிழில் காட்டுகிறது. κλίνη என்பதற்கு பாதுகாப்பான பொதுச் சொலாக ‘படுக்கை’ பயன்படுத்தப்படுகிறது.
- source_word: πίστιν
  choice: விசுவாசம்
  rationale: πίστις என்பதற்கான நிலையான இறையியல் சார்பற்ற மொழிபெயர்ப்பு; இங்கு செயலில் வெளிப்பட்ட நம்பிக்கையையும் தாங்குகிறது.
- source_word: Θάρσει
  choice: துணிவுகொள்
  rationale: ஆறுதலும் ஊக்கமும் தரும் கட்டளையின் நேரடியான வலிமையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: τέκνον
  choice: பிள்ளையே
  rationale: அன்பும் கனிவும் நிறைந்த அழைப்பைத் தக்கவைக்கிறது; ‘மகனே’ என்று பாலினத்தைத் தெளிவுபடுத்துவதைத் தவிர்க்கிறது.
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: உன் பாவங்கள் மன்னிக்கப்படுகின்றன
  rationale: நிகழ்காலப் பன்மைச் செயலப்பாட்டு வடிவத்தையும், மன்னிப்பைச் செய்பவர் மூலத்தில் வெளிப்படையாகக் குறிப்பிடப்படாததையும் தக்கவைக்கிறது.
- source_word: ἁμαρτίαι
  choice: பாவங்கள்
  rationale: மூலத்தின் பன்மையையும் வழக்கமான பொருளையும் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: τὴν πίστιν αὐτῶν என்பதில் ‘அவர்களுடைய’ யாரைக் குறிக்கிறது?
  choice: ‘அவர்களுடைய விசுவாசம்’ என்ற பன்மையைத் தக்கவைத்து, பக்கவாத நோயாளி அதில் சேர்க்கப்பட்டாரா என்பதைத் தீர்மானிக்காமல் விடுதல்.
  alternative: அவரைச் சுமந்து வந்தவர்களின் விசுவாசம் மட்டும்; அல்லது நோயாளியையும் சுமந்து வந்தவர்களையும் உள்ளடக்கிய குழுவின் விசுவாசம்.
  rationale: αὐτῶν பன்மை வடிவம் ஒன்றுக்கு மேற்பட்டவர்களைக் குறிக்கிறது; ஆனால் பக்கவாத நோயாளி அதில் உள்ளாரா என்பதை உரை வெளிப்படையாகக் கூறவில்லை.
- issue: இயேசுவின் மன்னிப்பு அறிவிப்பின் தன்மை
  choice: செய்பவரைக் குறிப்பிடாத செயலப்பாட்டு அறிவிப்பாக ‘உன் பாவங்கள் மன்னிக்கப்படுகின்றன’ என்று வழங்குதல்.
  alternative: ‘உன் பாவங்கள் மன்னிக்கப்பட்டிருக்கின்றன’ என்று நிறைவடைந்த நிலையை வலியுறுத்துதல்; அல்லது மன்னிப்பை நிகழ்த்தும் தெய்வீகச் செயலை விளக்கமாகச் சேர்த்தல்.
  rationale: கிரேக்கச் செயலப்பாட்டு வடிவம் செய்பவரைச் சொல்லாமல் மன்னிப்பை அறிவிக்கிறது. மொழிபெயர்ப்பு இயேசுவின் அதிகாரம் குறித்த கதையின் இறையியல் அழுத்தத்தை விளக்கிச் சேர்க்காமல் அப்படியே விடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ மத்தேயுவின் கவன ஈர்ப்பு நடையைப் பாதுகாக்கிறது; ‘பிள்ளையே’ கனிவான அழைப்பையும் பாலினத் தெளிவின்மையையும் தக்கவைக்கிறது. அடிக்குறிப்பு குறிகள் பொருந்தும் சொற்றொடர்களுக்குப் பின்பே வைக்கப்பட்டுள்ளன.
