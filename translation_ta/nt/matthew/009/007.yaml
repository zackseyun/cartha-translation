  text: அவன் எழுந்து தன் வீட்டுக்குப் போனான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: —
  rationale: தமிழில் முந்தைய நிகழ்வைத் தொடர்ந்து வரும் இந்தச் சுருக்கமான வாக்கியத்தில் இணைப்புச் சொல்லை வெளிப்படையாக மொழிபெயர்க்காமல் விடுவது இயல்பான தொடர் நடையைத் தருகிறது; நிகழ்வுகளின் வரிசை வினைகளால் தெளிவாக உள்ளது.
- source_word: ἐγερθεὶς
  choice: எழுந்து
  rationale: இறந்தகாலப் பங்கேற்பு வடிவத்தின் சூழல்சார் உள்நிலைப் பொருளை இயல்பான தமிழ் வினையெச்சமாக அளிக்கிறது.
- source_word: ἀπῆλθεν
  choice: போனான்
  rationale: அங்கிருந்து புறப்பட்டுச் சென்ற செயலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; ‘புறப்பட்டான்’ என்பதும் சாத்தியம், ஆனால் இங்கு தேவையற்ற வலியுறுத்தலைச் சேர்க்கலாம்.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: தன் வீட்டுக்கு
  rationale: செயப்பொருளின் சொந்த வீட்டை நோக்கிய இயக்கத்தைத் தெளிவாகக் காட்டுகிறது. αὐτοῦ இங்கு வாக்கிய எழுவாயையே சுட்டுவதால் ‘தன்’ இயல்பான தமிழ் வடிவம்.
