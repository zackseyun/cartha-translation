id: MAT.9.12
reference: Matthew 9:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἀκούσας ⸀εἶπεν· Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/012.yaml
  text: But when he heard it[a], he said, “Those who are well have no need of a physician, but those who are sick do.”
translation:
  language: ta
  text: அவர் அதைக் கேட்டபோது, “நலமாக இருப்பவர்களுக்கு மருத்துவர் தேவையில்லை; நோயுற்றவர்களுக்குத்தான் தேவை” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: அதைக் கேட்டபோது
  rationale: இறந்தகாலப் பங்கேற்புவினையின் காலத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது; முந்தைய சூழலில் கூறப்பட்டதை அவர் கேட்டார் என்பதால் தமிழில் மறைந்துள்ள செயப்படுபொருளை ‘அதை’ என வழங்குகிறது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: δέ இங்கு மென்மையான மாற்றம் அல்லது எதிர்வினையைச் சுட்டுகிறது. ‘கேட்டபோது’ என்று தொடங்கும் தமிழ் வாக்கிய ஓட்டத்திலும் நேரடியான பதிலுரையிலும் அந்தத் தொடர்பு இயல்பாக வெளிப்படுவதால் ‘ஆனால்’ சேர்ப்பது செயற்கையாக இருக்கும்.
- source_word: εἶπεν
  choice: என்றார்
  rationale: பொதுவான பேச்சுவினையான λέγω-வை, ‘பதிலளித்தார்’ என்ற கூடுதல் விளக்கத்தைப் புகுத்தாமல், தமிழின் நேரடி உரை அமைப்பில் இயல்பாக வழங்குகிறது.
- source_word: Οὐ χρείαν ἔχουσιν
  choice: தேவையில்லை
  rationale: χρείαν ἔχειν என்ற மரபுத்தொடரின் பொருளைத் தெளிவாகவும் சுருக்கமாகவும் தரும் இயல்பான நவீன தமிழ்.
- source_word: οἱ ἰσχύοντες
  choice: நலமாக இருப்பவர்கள்
  rationale: ἰσχύω அடிப்படையில் வலிமையுடன் இருப்பதைக் குறித்தாலும், மருத்துவர் மற்றும் நோயுற்றோர் என்ற மருத்துவ எதிரிணையில் உடல்நலமுள்ளவர்களையே இங்கு குறிக்கிறது. ‘நலமாக இருப்பவர்கள்’ இந்தச் சூழல்சார் பொருளை இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἰατροῦ
  choice: மருத்துவர்
  rationale: ἰατρός என்பதற்கான துல்லியமான, பொதுவாகப் புரியும் நவீன தமிழ்ச் சொல்.
- source_word: οἱ κακῶς ἔχοντες
  choice: நோயுற்றவர்கள்
  rationale: κακῶς ἔχω என்ற மரபுத்தொடர் இம்மருத்துவச் சூழலில் நோயுடன் இருப்பதைக் குறிக்கிறது; ‘நோயுற்றவர்கள்’ தெளிவானதும் கண்ணியமானதும் ஆகும்.
- source_word: ἀλλὰ
  choice: –க்குத்தான்
  rationale: οὐ ... ἀλλά என்ற ‘அவர்கள் அல்ல, இவர்களே’ என்னும் வலுவான எதிர்மறை அமைப்பை, தமிழில் ‘நோயுற்றவர்களுக்குத்தான்’ என இயல்பாகவும் அழுத்தத்துடனும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பழமொழியின் உடல்சார் மருத்துவப் பொருளும் சூழலிலுள்ள ஆன்மீகப் பயன்பாடும்
  choice: முதன்மை உரையில் சொல்லை நேரடியான மருத்துவ உருவகமாகவே வைத்தல்
  alternative: ‘பாவிகளுக்குத்தான் இரட்சகர் தேவை’ போன்ற விளக்கத்தை உரைக்குள் சேர்த்து ஆன்மீகப் பயன்பாட்டை வெளிப்படையாக்குதல்
  rationale: கிரேக்க வாக்கியம் மருத்துவர், நலமாக இருப்பவர்கள், நோயுற்றவர்கள் என்ற மருத்துவ மொழியையே பயன்படுத்துகிறது. அதன் ஆன்மீகப் பயன்பாட்டைச் சுற்றியுள்ள வசனங்கள் உணர்த்துகின்றன; அதை மொழிபெயர்ப்பிலேயே தீர்மானமாக விரித்துரைக்காமல் இருப்பது மூலத்தின் உருவகத்தையும் இறையியல் அழுத்தத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘மருத்துவர்’ என்பது தொழில்முறைச் சொல்லாக இருந்தாலும் பொதுவழக்கில் தெளிவானது. கிரேக்கத்தின் சுருக்கமான எதிரிணையைப் பாதுகாக்க இரண்டாம் பகுதியில் ‘தேவை’ இயல்பாகச் சேர்க்கப்பட்டுள்ளது.
