source:
  edition: SBLGNT
  text: Καὶ ἐγένετο αὐτοῦ ἀνακειμένου ἐν τῇ οἰκίᾳ, ⸀καὶ ἰδοὺ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ ἐλθόντες συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/010.yaml
  text: And as he was reclining at table in the house[a], behold[b], many tax collectors and sinners came and were reclining at table with Jesus and his disciples.
translation:
  language: ta
  text: அவர் வீட்டில் உணவுக்காகச் சாய்ந்திருந்தபோது[a], இதோ[b], பல வரி வசூலிப்பவர்களும் பாவிகளும் வந்து, இயேசுவுடனும் அவருடைய சீடர்களுடனும் சேர்ந்து உணவுக்காகச் சாய்ந்திருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அக்காலத்தில் உணவு உண்ணும்போது சாய்ந்திருப்பது வழக்கம். கிரேக்க மூலத்தில் பயன்படுத்தப்பட்ட சொல், வெறுமனே உட்கார்ந்திருப்பதை அல்ல, உணவுக்காகச் சாய்ந்திருப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘இதோ’ என்பது அடுத்து வருவதற்கு கவனத்தை ஈர்க்கும் கதைநடைச் சுட்டுச்சொல்.
    reason: discourse_marker
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: …இருந்தபோது
  rationale: இந்தக் கிரேக்க மரபுத்தொடர் இங்கு கதைத் தொடர்ச்சியையும் காலச் சூழலையும் அறிமுகப்படுத்துகிறது. தமிழில் தனியே ‘அது நிகழ்ந்தது’ என்று மொழிபெயர்ப்பதைவிட, சார்புவாக்கியமாக அமைப்பது அதன் இயல்பான கதைநடைப் பணியைத் தக்கவைக்கிறது.
- source_word: ἀνακειμένου
  choice: உணவருந்தச் சாய்ந்திருந்தபோது
  rationale: உணவு வேளையில் சாய்ந்து அமரும் அக்கால வழக்கத்தைக் குறிக்கிறது. ‘உட்கார்ந்திருந்தபோது’ என்பது அந்தக் குறிப்பை இழக்கும்; ‘உணவருந்த’ என்பது நவீன வாசகருக்குச் சூழலைத் தெளிவாக்குகிறது.
- source_word: ἐν τῇ οἰκίᾳ
  choice: அந்த வீட்டில்
  rationale: கிரேக்கத்தில் வீடு திட்டவட்டமாகக் குறிப்பிடப்பட்டாலும், அது யாருடைய வீடு என்பது இவ்வசனத்தில் சொல்லப்படவில்லை. எனவே உரிமையாளரைச் சேர்க்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: அடுத்து நிகழ்வதற்கு வாசகரின் கவனத்தை ஈர்க்கும் கிரேக்க உரையாடல்/கதைநடைச் சுட்டியைத் தமிழில் இயல்பாகத் தக்கவைக்கிறது.
- source_word: τελῶναι
  choice: வரி வசூலிப்பவர்கள்
  rationale: அரசு அல்லது ஆட்சிக்காக வரி திரட்டியவர்களைக் குறிக்கும் சொல்லுக்கு நவீனத் தமிழில் தெளிவான, வழக்கமான இணை.
- source_word: ἁμαρτωλοὶ
  choice: பாவிகள்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்டுள்ள பெயரடையின் சமூக-சமய வகைப்படுத்தலைச் சுருக்காமல் தக்கவைக்கிறது.
- source_word: ἐλθόντες
  choice: வந்து
  rationale: முதன்மை வினைக்கு முன் நிகழ்ந்த செயலைத் தமிழின் இயல்பான வினையெச்ச வடிவில் அளிக்கிறது.
- source_word: συνανέκειντο
  choice: …ஓடும் சேர்ந்து உணவருந்தச் சாய்ந்திருந்தார்கள்
  rationale: கூடவே சாய்ந்து உணவில் பங்கேற்றதையும் மேசைத் தோழமையையும் கூட்டு வினை உணர்த்துகிறது; ‘சேர்ந்து’ அந்த உடனிருப்பு நுணுக்கத்தை வெளிப்படுத்துகிறது.
- source_word: τῷ Ἰησοῦ
  choice: இயேசுவோடும்
  rationale: தமிழ் வேதாகம மற்றும் பொதுப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: அவருடைய சீடர்களோடும்
  rationale: ஆசிரியரைப் பின்பற்றிக் கற்றுக்கொள்ளும் உறவை ‘சீடர்கள்’ துல்லியமாகவும் வழக்கமாகவும் குறிக்கிறது.
theological_decisions:
- issue: உணவு வேளையின் உடல்நிலையும் மேசைத் தோழமையும்
  choice: ‘உணவருந்தச் சாய்ந்திருந்த’ என்ற படிமத்தை இரு இடங்களிலும் தக்கவைத்தல்
  alternative: ‘உணவருந்திக்கொண்டிருந்தார்/உணவருந்தினார்கள்’ என்று மட்டும் மொழிபெயர்த்தல்
  rationale: சேர்ந்து உணவருந்திய சமூக உறவை இவ்வசனம் முன்னிறுத்துகிறது. அக்கால உணவுப் பழக்கமான சாய்ந்திருத்தலைத் தக்கவைப்பது உரையில் உள்ள படிமத்தைப் பாதுகாக்கிறது; அதற்கு மேலான கோட்பாட்டுப் பொருளைச் சேர்ப்பதில்லை.
- issue: ‘அந்த வீடு’ யாருடையது என்ற அடையாளம்
  choice: முதன்மை உரையில் உரிமையாளரைக் குறிப்பிடாமல் ‘அந்த வீட்டில்’ என்று மொழிபெயர்த்தல்
  alternative: ‘மத்தேயுவின் வீட்டில்’ அல்லது ‘அவருடைய வீட்டில்’
  rationale: ἐν τῇ οἰκίᾳ என்பது ‘வீட்டில்’ என்று மட்டுமே கூறுகிறது. சுற்றுச் சூழலிலிருந்து ஓர் அடையாளத்தை ஊகிக்க இயன்றாலும், இவ்வசனம் அதை வெளிப்படையாகக் கூறாததால் அந்த ஊகத்தை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் அமைக்கப்பட்டுள்ளது. ‘உணவருந்தச் சாய்ந்திருந்த’ என்பது சற்று குறியிடப்பட்டாலும் வரலாற்று உணவு முறையை இயல்பாக விளக்குகிறது; ‘பந்தி’ அல்லது ‘மேசை’ என்று மூலத்தில் இல்லாத பொருளை நேரடியாகச் சேர்ப்பது தவிர்க்கப்பட்டுள்ளது. நடை கண்ணியமாகவும் கதைநடை ஓட்டத்துடனும் உள்ளது.
