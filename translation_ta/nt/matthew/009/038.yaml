id: MAT.9.38
reference: Matthew 9:38
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: δεήθητε οὖν τοῦ κυρίου τοῦ θερισμοῦ ὅπως ἐκβάλῃ ἐργάτας εἰς τὸν θερισμὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/038.yaml
  text: Therefore pray earnestly to the Lord of the harvest that he would send out workers into his harvest[a].
translation:
  language: ta
  text: ஆகவே, அறுவடையின் ஆண்டவரிடம், அவர் தமது அறுவடைக்கு வேலையாட்களை அனுப்பும்படி மன்றாடுங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வேலையாட்களை வெளியே அனுப்பும்படி’ என்றும் மொழிபெயர்க்கலாம்; இங்குள்ள கிரேக்க வினை வெறுமனே ‘அனுப்பு’ என்பதைவிட வலிமையானது. எனினும், இச்சூழலில் வேலையாட்களை அறுவடைப் பணிக்கு அனுப்புவதையே குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεήθητε
  choice: மன்றாடுங்கள்
  rationale: δέομαι என்பதன் அவசரமும் தீவிரமும் கொண்ட வேண்டுதலை, வெறும் ‘வேண்டுங்கள்’ என்பதைவிட ‘மன்றாடுங்கள்’ இயல்பாக வெளிப்படுத்துகிறது; ஜெபத்தின் சூழலும் இதனால் தெளிவாகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட மிகுந்த அறுவடையும் குறைந்த வேலையாட்களும் அடிப்படையாகக் கொண்ட முடிவுறு அழைப்பைத் தெளிவாக இணைக்கிறது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: அறுவடையின்மேல் அதிகாரமும் உரிமையும் உடையவரைக் குறிக்கும் κύριος என்பதற்கான வழக்கமான, கண்ணியமான தமிழ் சொல்.
- source_word: θερισμοῦ
  choice: அறுவடை
  rationale: மூலத்தின் அறுவடை உருவகத்தை விளக்கவுரையாக மாற்றாமல் அப்படியே பாதுகாக்கிறது.
- source_word: ὅπως
  choice: …படி
  rationale: வேண்டுதலின் உள்ளடக்கத்தையும் நோக்கத்தையும் இயல்பான தமிழ் வாக்கிய அமைப்பில் காட்டுகிறது.
- source_word: ἐκβάλῃ
  choice: அனுப்பிவைக்கும்படி
  rationale: இச்சூழலில் வேலையாட்களைப் பணிக்காக அறுவடைக்குள் அனுப்புவதைக் குறிக்கிறது. கிரேக்க வினையின் வலிமையான அடிநிழல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: ἐργάτας
  choice: வேலையாட்களை
  rationale: அறுவடைப் பணியில் ஈடுபடுகிறவர்களைச் சாதாரண வாசகருக்குத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: தமது அறுவடைக்குள்
  rationale: εἰς குறிக்கும் உள்ளே செல்லும் இயக்கத்தையும் αὐτοῦ குறிக்கும் உரிமையையும் பாதுகாக்கிறது; மூலத்தில் இல்லாத ‘வயல்’ என்ற சொல்லைச் சேர்க்கவில்லை.
theological_decisions:
- issue: ‘அறுவடையின் ஆண்டவர்’ என்பவரின் அடையாளம்
  choice: தந்தை, இயேசு, அல்லது பொதுவாகக் கடவுள் என்று குறிப்பிட்டு வரையறுக்காமல் ‘அறுவடையின் ஆண்டவர்’ என்றே மொழிபெயர்த்தல்
  alternative: ‘தந்தை’ என்று குறிப்பாகவோ ‘இயேசு’ என்று குறிப்பாகவோ அடையாளப்படுத்துதல்
  rationale: இவ்வசனம் அந்த அடையாளத்தை வெளிப்படையாகக் குறிப்பிடவில்லை. ஆகவே மூலத்தில் உள்ள இறையியல் திறந்தநிலையை மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘அறுவடை’ உருவகமும், ஆண்டவரின் அடையாளத்தைத் திட்டவட்டமாக வரையறுக்காத மூலத்தின் இறையியல் திறந்தநிலையும் பாதுகாக்கப்பட்டுள்ளன.
