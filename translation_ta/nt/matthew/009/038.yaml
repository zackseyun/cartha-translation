revisions:
- from: ஆகவே, அறுவடையின் ஆண்டவரிடம், அவர் தமது அறுவடைக்குள் வேலையாட்களை அனுப்பிவைக்கும்படி மன்றாடுங்கள்.[a]
  to: ஆகவே, அறுவடையின் ஆண்டவரிடம், அவர் தமது அறுவடைக்கு வேலையாட்களை அனுப்பும்படி மன்றாடுங்கள்.[a]
  rationale: The revision replaces an overly literal locative expression with idiomatic modern Tamil while preserving the destination and possessive force of the Greek. It also refines the lexical footnote so that the forceful nuance of ἐκβάλλω is retained without suggesting an inappropriate literal action. No theological identification beyond the Greek title is introduced.
  reviewer_model: gpt-5.6-terra
