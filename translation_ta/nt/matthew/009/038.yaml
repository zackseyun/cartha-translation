review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the inferential οὖν, the urgent petition of δεήθητε, the unqualified title ‘Lord of the harvest,’ and the possessive ‘his harvest.’ Its main rendering of ἐκβάλῃ as ‘send’ is contextually sound, with the stronger sense appropriately noted. However, ‘அறுவடைக்குள்’ is an overly literal and somewhat unnatural Tamil expression for εἰς τὸν θερισμὸν; Tamil idiom normally expresses dispatch to the harvest with ‘அறுவடைக்கு.’
  naturalness: ‘ஆகவே’ and ‘மன்றாடுங்கள்’ are natural in a dignified modern Tamil biblical register. ‘தமது அறுவடைக்குள்’ is not idiomatic in this context and interrupts otherwise fluent phrasing. ‘அறுவடைக்கு வேலையாட்களை அனுப்பும்படி’ is clearer and naturally retains the harvest metaphor.
  terminology: ‘ஆண்டவர்,’ ‘அறுவடை,’ and ‘மன்றாடுங்கள்’ are suitable and preserve the theological and rhetorical register. ‘வேலையாட்கள்’ appropriately denotes harvest workers. The footnote’s ‘தள்ளி அனுப்ப’ can suggest physically pushing workers and is less precise than an alternative that states the forceful ‘send out’ nuance without over-literalizing it.
  issues:
  - severity: low
    issue: ‘தமது அறுவடைக்குள்’ is unnatural Tamil phrasing.
    rationale: Although it attempts to represent εἰς literally, the phrase ‘send workers into his harvest’ is conventionally and naturally expressed in Tamil as ‘அறுவடைக்கு ... அனுப்ப.’ This does not alter the metaphor or possessive meaning.
  - severity: low
    issue: The footnote alternative ‘தள்ளி அனுப்ப’ may be misleading.
    rationale: ἐκβάλλω has a stronger sense than simple sending, but ‘தள்ளி அனுப்ப’ can evoke a literal physical shove. ‘வெளியே அனுப்ப’ together with an explicit note about the verb’s force better preserves the lexical alternative in Tamil.
  revised_text: ஆகவே, அறுவடையின் ஆண்டவரிடம், அவர் தமது அறுவடைக்கு வேலையாட்களை அனுப்பும்படி மன்றாடுங்கள்.[a]
  revised_footnotes:
