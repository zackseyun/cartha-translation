source:
  edition: SBLGNT
  text: καὶ ἐκβληθέντος τοῦ δαιμονίου ἐλάλησεν ὁ κωφός. καὶ ἐθαύμασαν οἱ ὄχλοι λέγοντες· Οὐδέποτε ἐφάνη οὕτως ἐν τῷ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/033.yaml
  text: And when the demon had been cast out[a], the mute man spoke. And the crowds were amazed, saying, “Never has anything like this appeared in Israel.”
translation:
  language: ta
  text: பேய் விரட்டப்பட்டதும், பேச முடியாத[a] அந்த மனிதன் பேசினான். மக்கள் கூட்டங்கள் வியப்படைந்து, “இஸ்ரவேலில் இப்படிப்பட்ட ஒன்று ஒருபோதும் காணப்பட்டதில்லை” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கேளாத அந்த மனிதன்.” கிரேக்கச் சொல் ‘கேளாதவர்’ அல்லது ‘பேச முடியாதவர்’ என இருபொருள் தரலாம்; இங்கே அவன் பேசியதே வலியுறுத்தப்படுவதால், சூழல் ‘பேச முடியாதவர்’ என்ற பொருளை ஆதரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβληθέντος
  choice: விரட்டப்பட்டதும்
  rationale: 'இறந்தகாலச் செயப்பாட்டு எச்சத்தின் முன்நிகழ்வுத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது: பேய் விரட்டப்பட்ட பிறகே மனிதன் பேசினான்.'
- source_word: δαιμονίου
  choice: பேய்
  rationale: நற்செய்தி நூல்களின் பேயோட்டும் சூழலில் δαιμόνιον என்பதற்கான தெளிவான, வழக்கமான நவீனத் தமிழ் இணை.
- source_word: ἐλάλησεν
  choice: பேசினான்
  rationale: λαλέω என்பதன் எளிய இறந்தகாலப் பொருளைத் தருகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘பேசத் தொடங்கினான்’ என்ற நுண்பொருளைச் சேர்க்கவில்லை.
- source_word: ὁ κωφός
  choice: பேச முடியாதிருந்த அந்த மனிதன்
  rationale: κωφός என்பது கேளாதவர் அல்லது பேச முடியாதவர் என இருபொருள் கொள்ளலாம். உடனடிச் சூழலில் ‘பேசினான்’ என்பதே வலியுறுத்தப்படுவதால், பேச்சின்மையை முதன்மைப்படுத்துகிறது; ‘மனிதன்’ என்பது முந்தைய வசனச் சூழலிலிருந்து இயல்பாக வழங்கப்படுகிறது.
- source_word: ἐθαύμασαν
  choice: வியப்படைந்து
  rationale: கூட்டத்தாரின் ஆழ்ந்த ஆச்சரியத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: οἱ ὄχλοι
  choice: மக்கள் கூட்டங்கள்
  rationale: மூலத்தின் பன்மையைப் பாதுகாக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: Οὐδέποτε
  choice: ஒருபோதும் ... இல்லை
  rationale: முழுமையான மறுப்பைக் குறிக்கும் ‘ஒருபோதும் இல்லை’ என்ற இயல்பான தமிழ் அமைப்பு.
- source_word: ἐφάνη
  choice: காணப்பட்டதில்லை
  rationale: செயப்பாட்டு வடிவத்தின் இச்சூழலுக்குரிய ‘காணப்பட்டது’ என்ற பொருளை இயல்பாகத் தருகிறது; வியப்பைத் தூண்டிய நிகழ்வைக் குறிக்கிறது.
- source_word: οὕτως
  choice: இப்படிப்பட்ட ஒன்று
  rationale: முன்னர் நிகழ்ந்த சம்பவத்தின் தன்மை அல்லது வகையைச் சுட்டுகிறது; தமிழில் வாக்கியத்துக்குத் தேவையான பெயர்ச்சொல் சார்பை இயல்பாக வழங்குகிறது.
- source_word: ἐν τῷ Ἰσραήλ
  choice: இஸ்ரவேலில்
  rationale: இஸ்ரவேல் மக்களிடையே அல்லது இஸ்ரவேலின் எல்லைக்குள் என்ற மூலத்தின் விரிவைத் தீர்மானிக்காமல் வைத்திருக்கும் சுருக்கமான இயல்பான மொழிபெயர்ப்பு.
theological_decisions:
- issue: κωφός என்பதன் பொருள் வரம்பு
  choice: பேச முடியாதிருந்த மனிதன்
  alternative: கேளாத மனிதன்
  rationale: κωφός இரு பொருள்களையும் தரக்கூடியது. ஆனால் ‘அவன் பேசினான்’ என்ற உடனடிச் சூழல் பேச்சின்மையை வலியுறுத்துகிறது. இருப்பினும் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἐφάνη என்பதன் மொழிபெயர்ப்பு
  choice: காணப்பட்டதில்லை
  alternative: தோன்றியதில்லை
  rationale: இச்சூழலில் மக்கள் கண்ட அசாதாரண நிகழ்வைப் பற்றிய கூற்றாக ‘காணப்பட்டது’ இயல்பாக உள்ளது; அதேவேளை மூலத்தின் செயப்பாட்டு வடிவத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பேய்’, ‘வியப்படைந்து’, ‘காணப்பட்டதில்லை’ ஆகியவை தெளிவும் மூலநெருக்கமும் சமநிலைப்படுத்துகின்றன. அடிக்குறி [a] தொடர்புடைய சொல்லுக்குப் பின் முதன்மை உரையில் இடம்பெற்றுள்ளது.
