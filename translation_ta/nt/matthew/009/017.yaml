id: MAT.9.17
reference: Matthew 9:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐδὲ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή γε, ῥήγνυνται οἱ ἀσκοί, καὶ ὁ οἶνος ἐκχεῖται καὶ οἱ ἀσκοὶ ⸀ἀπόλλυνται· ἀλλὰ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς καινούς, καὶ ἀμφότεροι συντηροῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/017.yaml
  text: Nor do they put new wine into old wineskins. Otherwise[a], the wineskins burst, and the wine is spilled, and the wineskins are ruined. Rather, they put new wine into fresh wineskins, and both are preserved.
translation:
  language: ta
  text: புதிய திராட்சரசத்தைப் பழைய தோல் பைகளில் யாரும் ஊற்றி வைப்பதில்லை. அப்படிச் செய்தால், தோல் பைகள் வெடிக்கும்; திராட்சரசம் சிந்திவிடும்; தோல் பைகளும் பாழாகிவிடும். மாறாக, புதிய திராட்சரசத்தைப் புதிய தோல் பைகளில்[a] ஊற்றி வைப்பார்கள்; இரண்டும் பாதுகாக்கப்படும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில், திராட்சரசத்துக்கு ‘புதியது’ (νέος) என்றும், தோல் பைகளுக்கு ‘புதிய நிலையில் உள்ளவை’ (καινός) என்றும் வேறுபட்ட சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ βάλλουσιν
  choice: யாரும் ஊற்றி வைப்பதில்லை
  rationale: முந்தைய எதிர்மறை உவமையுடன் தொடரும் கருத்தை இயல்பான தமிழில் காட்டுகிறது; திராட்சரசத்தைத் தோற்பையில் சேமிக்கும் சூழலில் βάλλουσιν என்பதற்கு ‘ஊற்றி வைப்பது’ பொருத்தமானது.
- source_word: οἶνον νέον
  choice: புதிதாகத் தயாரிக்கப்பட்ட திராட்சரசம்
  rationale: νέος இங்கு புதிதாக உருவாக்கப்பட்ட திராட்சரசத்தைக் குறிக்கிறது. இந்த விரிவான இயல்பான சொற்றொடர், பின்னர் வரும் καινός என்பதிலிருந்து வேறுபாட்டைத் தெளிவாக்குகிறது.
- source_word: ἀσκούς
  choice: தோற்பைகள்
  rationale: பண்டைக்காலத்தில் திராட்சரசம் வைக்கப் பயன்படுத்தப்பட்ட தோலால் ஆன பைகளைச் சுருக்கமாகவும் புரியத்தக்க வகையிலும் குறிக்கிறது.
- source_word: παλαιούς
  choice: பழைய
  rationale: வயதும் பயன்பாட்டினால் ஏற்பட்ட நிலையும் சார்ந்த நேரடியான எதிர்மறையைப் பாதுகாக்கிறது.
- source_word: εἰ δὲ μή γε
  choice: அப்படிச் செய்தால்
  rationale: அவ்வாறு பழைய தோற்பைகளில் ஊற்றுவதால் வரும் விளைவை இயல்பான தமிழில் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: ῥήγνυνται
  choice: வெடித்து
  rationale: உள்ளழுத்தத்தால் தோற்பைகள் பிளந்து திறப்பதைத் தெளிவாகவும் உயிரோட்டமாகவும் தெரிவிக்கிறது.
- source_word: ἐκχεῖται
  choice: சிந்திப்போகும்
  rationale: தோற்பைகள் வெடிப்பதால் திராட்சரசம் வெளியேறி வீணாவதைச் சூழலுக்கேற்ற இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἀπόλλυνται
  choice: பாழாகும்
  rationale: தோற்பைகள் பயன்படுத்த முடியாதபடி கெட்டுப்போவதைக் குறிக்கிறது; இங்கு ‘அழியும்’ என்பதைவிட சூழலுக்குப் பொருத்தமானது.
- source_word: ἀλλὰ
  choice: மாறாக
  rationale: தவறான நடைமுறைக்கு எதிராகச் சரியான நடைமுறையை அறிமுகப்படுத்தும் திருத்தும் முரண்பாட்டைக் காட்டுகிறது.
- source_word: ἀσκοὺς καινούς
  choice: புதிய தோற்பைகள்
  rationale: καινός என்பதன் புதிய நிலை அல்லது பயன்படுத்தத் தகுந்த புத்துணர்ந்த நிலையை நேரடியாகக் காட்டுகிறது.
- source_word: ἀμφότεροι συντηροῦνται
  choice: திராட்சரசமும் தோற்பைகளும் பாதுகாக்கப்படும்
  rationale: ‘இரண்டும்’ எவற்றைக் குறிக்கிறது என்பதைத் தமிழில் தெளிவுபடுத்தி, இரண்டுமே இழப்பிலிருந்து காக்கப்படுவதைப் பாதுகாக்கிறது.
theological_decisions:
- issue: νέος மற்றும் καινός ஆகிய இரு சொற்களின் வேறுபாடு
  choice: νέος என்பதை ‘புதிதாகத் தயாரிக்கப்பட்ட’ என்றும் καινός என்பதை ‘புதிய’ என்றும் மொழிபெயர்த்தல்
  alternative: இரண்டையும் வெறுமனே ‘புதிய’ என்று மொழிபெயர்த்தல்
  rationale: மூலமொழி திராட்சரசத்தின் காலப் புதுமையையும் தோற்பைகளின் புதிய நிலையையும் வேறு சொற்களால் குறிக்கிறது. இவ்வேறுபாட்டை உரையிலும் அடிக்குறிப்பிலும் பாதுகாப்பது பொருளைத் தேவையின்றி இறையியல் ரீதியில் விளக்காமல் நுணுக்கத்தை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், எளிதில் புரியக்கூடிய ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பழக்கமான வேதாகமச் சொல்லான ‘துருத்தி’க்கு மாறாக உடனடியாகப் புரியும் ‘தோற்பை’ தேர்ந்தெடுக்கப்பட்டது; திராட்சரசச் சேமிப்பு என்ற சூழல் அதன் பயன்பாட்டைத் தெளிவாக்குகிறது.
