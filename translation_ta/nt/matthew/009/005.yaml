id: MAT.9.5
reference: Matthew 9:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τί γάρ ἐστιν εὐκοπώτερον, εἰπεῖν· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/005.yaml
  text: 'For which is easier: to say[a], ‘Your sins are forgiven,’ or to say, ‘Get up and walk’?”'
translation:
  language: ta
  text: ஏனெனில், ‘உன் பாவங்கள் மன்னிக்கப்படுகின்றன’[a] என்று சொல்வதா, அல்லது ‘எழுந்து நட’ என்று சொல்வதா—எது எளிது?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் பாவங்கள் மன்னிக்கப்பட்டிருக்கின்றன.” கிரேக்க நிகழ்காலச் செயப்பாட்டு வடிவத்தை, ஒரு செயல் நிறைவேறியதால் ஏற்பட்டுத் தொடரும் நிலையைக் குறிப்பதாகவும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ ἐστιν εὐκοπώτερον
  choice: எது எளிது?
  rationale: τί உடன் வரும் ஒப்பீட்டுச் சொல் εὐκοπώτερον இரண்டு கூற்றுகளில் எது எளிது எனக் கேட்கிறது. γάρ முந்தைய வசனத்துடனான விளக்கத் தொடர்பைக் காட்டினாலும், நவீன தமிழில் கேள்வியின் இயல்பான ஓட்டத்திற்காகத் தனியே மொழிபெயர்க்கப்படவில்லை; அந்தத் தொடர்பு சூழலில் தெளிவாக உள்ளது.
- source_word: εἰπεῖν
  choice: என்று சொல்வதா
  rationale: இரு கூற்றுகளிலும் சாதாரணமாகச் சொல்வதைக் குறிக்கும் வினையெச்சத்தின் பொருளையும் இணையான அமைப்பையும் காக்கிறது.
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: உன் பாவங்கள் மன்னிக்கப்படுகின்றன
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவத்தை நேரடியாகக் காத்து, மன்னிப்பின் காலம் குறித்த மேலதிக விளக்கத்தை உரைக்குள் சேர்க்காமல் விடுகிறது.
- source_word: ἁμαρτίαι
  choice: பாவங்கள்
  rationale: இச்சூழலில் ἁμαρτίαι என்பதற்கான நிலையான, தெளிவான தமிழ் இணை.
- source_word: Ἔγειρε
  choice: எழுந்து
  rationale: குணமாக்கும் சூழலில் உடல்ரீதியாக எழும்பும்படி கொடுக்கப்படும் சுருக்கமான கட்டளையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: καὶ περιπάτει
  choice: நட
  rationale: எழுந்த பின் நடக்கும்படி கூறும் தொடர்ச்சியான செயலை இயல்பான தமிழ் கட்டளையாகத் தருகிறது.
- source_word: σου
  choice: உன்
  rationale: இரண்டாம் நபர் ஒருமையைத் தமிழில் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
theological_decisions:
- issue: இயேசுவின் மன்னிப்பு அறிவிப்பை மொழிபெயர்த்தல்
  choice: உன் பாவங்கள் மன்னிக்கப்படுகின்றன
  alternative: உன் பாவங்கள் மன்னிக்கப்பட்டிருக்கின்றன
  rationale: கிரேக்க நிகழ்காலச் செயப்பாட்டு வடிவத்தை நேரடியாகக் காத்து, மன்னிப்பு எப்போது நிகழ்ந்தது என்பதைக் குறித்த இறையியல் முடிவை மொழிபெயர்ப்பில் முன்கூட்டியே விதிக்கவில்லை. முடிவுற்ற செயலால் ஏற்பட்ட தற்போதைய நிலையைக் குறிக்கும் வாசிப்பும் சாத்தியமானதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான தமிழில், எளியதாயினும் கண்ணியமான நேரடி கேள்வி வடிவம் பயன்படுத்தப்பட்டுள்ளது. ஒருமை அழைப்பு ‘உன்’ என்றும், இரு மாற்றுகளின் இணையான அமைப்பு ‘என்று சொல்வதா’ என்றும் காக்கப்பட்டுள்ளது.
