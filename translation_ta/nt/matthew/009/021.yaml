source:
  edition: SBLGNT
  text: ἔλεγεν γὰρ ἐν ἑαυτῇ· Ἐὰν μόνον ἅψωμαι τοῦ ἱματίου αὐτοῦ σωθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/021.yaml
  text: For she was saying to herself[a], “If only I touch his garment, I will be saved.”
translation:
  language: ta
  text: ஏனெனில், “அவருடைய ஆடையை மட்டும் நான் தொட்டால், நான் குணமடைவேன்[a]” என்று அவள் தனக்குள் சொல்லிக்கொண்டிருந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில், “நான் காப்பாற்றப்படுவேன்” என்று உள்ளது; இச்சூழலில் அது “நான் குணமடைவேன்” அல்லது “நான் நலமடைவேன்” என்றும் பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: சொல்லிக்கொண்டிருந்தாள்
  rationale: முற்றுப்பெறாத இறந்தகால வினை வடிவம் தொடர்ந்த அல்லது திரும்பத் திரும்ப நிகழ்ந்த உள்ளார்ந்த சொல்லுதலைக் குறிக்கிறது; இத்தமிழ் வடிவம் அந்தக் கூறுநிலையை இயல்பாகப் பாதுகாக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள நிகழ்வுக்கான விளக்கத்தை அறிமுகப்படுத்தும் இணைப்பின் காரணவிளக்கத் தன்மையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐν ἑαυτῇ
  choice: தனக்குள்
  rationale: வாய்விட்டுப் பிறரிடம் பேசாமல் உள்ளத்தில் சொல்லிக்கொண்டதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: Ἐὰν μόνον
  choice: மட்டும் ... தொட்டால்
  rationale: தொடுதல் ஒன்றே போதும் என்ற குறைந்தபட்ச நிபந்தனையையும் அதன்மீதான வலியுறுத்தலையும் தமிழின் இயல்பான சொல்வரிசையில் அளிக்கிறது.
- source_word: ἅψωμαι
  choice: நான் தொட்டால்
  rationale: ἐάν உடன் வரும் துணைநிலை வினையின் நிபந்தனைப் பொருளை இயல்பான தமிழ் நிபந்தனை வடிவில் தருகிறது; இங்கு பிடித்துக்கொள்வது என்பதைக் காட்டிலும் தொடுவது பொருத்தமானது.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: அவருடைய ஆடையை
  rationale: ἱμάτιον வெளிப்புற ஆடை அல்லது மேலாடையைக் குறிக்கலாம்; ‘ஆடை’ தேவையற்ற குறிப்பாக்கம் இன்றி மூலத்தின் பரப்பைப் பாதுகாக்கிறது.
- source_word: σωθήσομαι
  choice: நான் மீட்கப்படுவேன்
  rationale: σῴζω உடல் நலம்பெறுதல், ஆபத்திலிருந்து மீட்பு, இரட்சிப்பு ஆகிய பரந்த பொருள்களைக் கொண்டது. உடனடிச் சூழல் குணமடைதலைக் குறித்தாலும், ‘மீட்கப்படுவேன்’ அந்தச் சொல்லின் அகலத்தையும் செயப்பாட்டு வடிவத்தையும் பாதுகாக்கிறது; சூழல்சார் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: குணமாக்கும் சூழலில் σωθήσομαι என்பதன் மொழிபெயர்ப்பு
  choice: நான் மீட்கப்படுவேன்
  alternative: நான் குணமடைவேன் / நான் நலமடைவேன்
  rationale: இங்கு எதிர்பார்க்கப்படுவது உடல்நல மீட்பு என்றாலும், கிரேக்கம் குறுகிய மருத்துவச் சொல்லுக்குப் பதிலாக பரந்த பொருளுடைய σῴζω என்பதைப் பயன்படுத்துகிறது. முதன்மை உரை அதன் மீட்பு/இரட்சிப்பு ஒலிவட்டத்தைத் தக்கவைக்கிறது; எந்தக் கோட்பாட்டையும் திணிக்காமல் உடனடிச் சூழலின் குணமடைதல் பொருளை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. பெண்ணின் தொடர்ந்த உள்ளார்ந்த சொல்லுதலும், σωθήσομαι என்பதிலுள்ள மீட்பு–குணமடைதல் பொருள் அகலமும் பாதுகாக்கப்பட்டுள்ளன.
