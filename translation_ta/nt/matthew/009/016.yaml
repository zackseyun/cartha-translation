  register: நவீன பொதுத்தமிழில், மரியாதையானதும் எளிதில் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஒட்டு’, ‘கிழிசல்’ போன்ற வழக்கிலுள்ள ஆடைச் சொற்கள் உவமையின் தெளிவைக் காக்கின்றன; மூலத்தின் காரண–விளைவு அமைப்பும் நிலைநிறுத்தப்பட்டுள்ளது.
