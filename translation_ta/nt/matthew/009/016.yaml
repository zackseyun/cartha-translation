source:
  edition: SBLGNT
  text: οὐδεὶς δὲ ἐπιβάλλει ἐπίβλημα ῥάκους ἀγνάφου ἐπὶ ἱματίῳ παλαιῷ· αἴρει γὰρ τὸ πλήρωμα αὐτοῦ ἀπὸ τοῦ ἱματίου, καὶ χεῖρον σχίσμα γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/016.yaml
  text: But no one puts a patch of unshrunk cloth on an old garment, for the patch pulls away from the garment, and a worse tear results.
translation:
  language: ta
  text: ஆனால், சுருங்காத துணியால் செய்யப்பட்ட ஒட்டுத் துணியைப் பழைய ஆடையின்மேல் யாரும் போடுவதில்லை.[a] ஏனெனில், அந்த ஒட்டுத் துணி ஆடையிலிருந்து கிழித்துக்கொண்டு போய்விடும்; கிழிசல் இன்னும் பெரிதாகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இன்னும் பதப்படுத்தப்படாத துணியால் செய்யப்பட்ட ஒட்டுத் துணி.” கிரேக்கச் சொல் இன்னும் முழுமையாகப் பதப்படுத்தப்படாத துணியைக் குறிக்கிறது; அத்தகைய துணி பின்னர் சுருங்கும்போது பழைய ஆடையை இழுக்கும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς δὲ
  choice: ஆனால் ... யாரும் ... இல்லை
  rationale: δὲ இங்கு முந்தைய உவமையுடன் மென்மையான எதிர்மறைத் தொடர்பை உருவாக்குகிறது; οὐδεὶς என்பதன் பொதுவான மறுப்பை இயல்பான தமிழில் ‘யாரும் ... இல்லை’ என வழங்குகிறது.
- source_word: ἐπιβάλλει ἐπίβλημα
  choice: ஒட்டை ... போடுவதில்லை
  rationale: ἐπιβάλλει என்பது குறிப்பாக ‘தைக்கிறான்’ என்று சொல்லாமல் ‘மேல் இடுகிறான்/போடுகிறான்’ என்பதைக் குறிக்கிறது; ஆடைச் சூழலில் ‘ஒட்டுப் போடுதல்’ இயல்பான தமிழ் வழக்கு.
- source_word: ῥάκους ἀγνάφου
  choice: சுருங்காத துணியால் செய்த
  rationale: ἀγνάφου என்பது இன்னும் பதப்படுத்தப்படாத, அதனால் பின்னர் சுருங்கக்கூடிய துணியைக் குறிக்கிறது. உவமையின் நடைமுறை விளைவை நவீன வாசகருக்குத் தெளிவாக ‘சுருங்காத துணி’ தெரிவிக்கிறது; மாற்று தொழில்நுட்பப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐπὶ ἱματίῳ παλαιῷ
  choice: பழைய ஆடையின்மேல்
  rationale: ἱμάτιον என்பதன் பொதுவான ஆடைப் பொருளை ‘ஆடை’ என்றும், ἐπί என்பதைக் ‘மேல்’ என்றும் நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: αἴρει ... ἀπὸ τοῦ ἱματίου
  choice: ஆடையிலிருந்து இழுத்துக்கொண்டு பிரிந்துவிடும்
  rationale: இங்கு αἴρει என்பது ஒட்டு பழைய ஆடையை இழுத்தவாறு அதிலிருந்து விலகும் விளைவைச் சுட்டுகிறது. ‘இழுத்துக்கொண்டு பிரிந்துவிடும்’ என்பது ‘எடுத்துவிடும்’ என்ற குழப்பத்தைத் தவிர்த்து, இழுவையையும் பிரிவையும் வெளிப்படுத்துகிறது.
- source_word: τὸ πλήρωμα αὐτοῦ
  choice: அந்த ஒட்டு
  rationale: சொல்லாட்சிப்படி ‘அதன் நிரப்புதல்/நிரப்பும் துண்டு’; இச்சூழலில் அது முன்கூறிய ஒட்டையே குறிக்கிறது. தமிழில் ‘அந்த ஒட்டு’ தெளிவானது.
- source_word: χεῖρον σχίσμα γίνεται
  choice: கிழிசல் இன்னும் பெரிதாகும்
  rationale: χείρον என்ற ஒப்பீட்டுத் தன்மையையும் σχίσμα என்ற கிழிசலையும் இயல்பான தமிழில் விளைவாகக் கூறுகிறது. ‘மோசமான கிழிசல்’ என்பதைவிட ‘இன்னும் பெரிதாகும்’ ஆடை கிழியும் காட்சியைத் தெளிவாக வழங்குகிறது.
