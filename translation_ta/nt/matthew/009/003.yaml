    issue: καὶ is rendered as “அப்பொழுது.”
    rationale: The Greek conjunction is simply connective in this verse. “அப்பொழுது” introduces a temporal relationship that the source does not expressly state; it should be rendered with a connective or not converted into a temporal adverb.
