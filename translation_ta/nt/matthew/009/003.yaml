  language: en
  yaml_path: translation/nt/matthew/009/003.yaml
  text: And behold[a], some of the scribes said among themselves, “This man is blaspheming.”
translation:
  language: ta
  text: மேலும், இதோ, வேத அறிஞர்களில் சிலர் தங்களுக்குள்[a], “இவன் இறைவனைப் பழித்துப் பேசுகிறான்” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தங்களுக்குத் தாங்களே” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடர் தனிப்பட்ட பேச்சையோ உள்ளார்ந்த சிந்தனையையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: அப்பொழுது
  rationale: கதைத் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் காட்டுகிறது; இங்கு καί ஒரு எளிய தொடரிணைப்பாக உள்ளது.
- source_word: ἰδού
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் மூலமொழிச் சொல்லின் உரையாடல் வலிமையையும் காட்சியின் உயிரோட்டத்தையும் தக்கவைக்கிறது.
- source_word: τινες τῶν γραμματέων
  choice: வேத அறிஞர்களில் சிலர்
  rationale: γραμματεῖς என்பவர்கள் வெறும் எழுதுநர்கள் அல்லாமல் வேதச்சட்டத்தில் தேர்ச்சி பெற்ற அறிஞர்கள் என்பதைக் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; τινες...τῶν என்ற பகுதி குறிப்பிடப்படாத ஒரு துணைக்குழுவைக் குறிக்கிறது.
- source_word: εἶπαν ἐν ἑαυτοῖς
  choice: தங்களுக்குள் ... சொன்னார்கள்
  rationale: சொல்லுதல் என்ற வினையையும் ἐν ἑαυτοῖς என்பதன் அகத்திலான அல்லது தனிப்பட்ட பரிமாற்றம் என்ற தெளிவின்மையையும் பாதுகாக்கிறது.
- source_word: Οὗτος
  choice: இவன்
  rationale: அருகுச் சுட்டின் நேரடியான வலிமையையும் சூழலில் காணப்படும் இகழ்ச்சித் தொனியையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: βλασφημεῖ
  choice: இறைவனைப் பழித்துப் பேசுகிறான்
  rationale: தமிழில் ‘தூஷிக்கிறான்’ என்பதைக் காட்டிலும் சாதாரண வாசகர்களுக்குத் தெளிவாக, கடவுளுக்கு எதிரான பழிப்புரையை குறிக்கும் சொல்லின் சூழல்சார் பொருளை வழங்குகிறது; நிகழ்காலக் குற்றச்சாட்டையும் தக்கவைக்கிறது.
theological_decisions:
- issue: இயேசுவுக்கு எதிரான வேத அறிஞர்களின் βλασφημεῖ குற்றச்சாட்டு
  choice: இவன் இறைவனைப் பழித்துப் பேசுகிறான்
  alternative: இவன் தேவதூஷணம் பேசுகிறான்
  rationale: குற்றச்சாட்டின் தீவிரத்தையும் கடவுளை அவமதிக்கும் பொருளையும் பாதுகாக்கிறது; அது சரியா தவறா என்பதை மொழிபெயர்ப்பிலேயே தீர்மானிக்காமல் கதையின் இறையியல் பதற்றத்தை அப்படியே விடுகிறது.
- issue: ἐν ἑαυτοῖς என்பது உள்ளார்ந்த சிந்தனையா அல்லது தனிப்பட்ட உரையாடலா
  choice: தங்களுக்குள் சொன்னார்கள்
  alternative: தங்களுக்குத் தாங்களே சொன்னார்கள் / மனத்தில் நினைத்தார்கள்
  rationale: மூலவாக்கியத்தின் உண்மையான இருபொருள் வாய்ப்பைப் பாதுகாக்கிறது; இதை முற்றிலும் மௌனமான சிந்தனை என்று கட்டாயப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், கண்ணியமான கதைநடை. ‘இதோ’ மூலத்தின் கவன ஈர்ப்பைத் தக்கவைக்கிறது. ‘வேத அறிஞர்கள்’ வரலாற்றுப் பணியை தெளிவாக்குகிறது; ‘இறைவனைப் பழித்துப் பேசுகிறான்’ தொழில்நுட்ப சமயச் சொல்லைத் தவிர்த்து குற்றச்சாட்டின் பொருளை வெளிப்படுத்துகிறது.
