id: MAT.9.20
reference: Matthew 9:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ γυνὴ αἱμορροοῦσα δώδεκα ἔτη προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/020.yaml
  text: And behold[b][a], a woman who had been suffering from bleeding for twelve years came up behind him and touched the fringe of his garment.
translation:
  language: ta
  text: இதோ, பன்னிரண்டு ஆண்டுகளாக இரத்தப்போக்கு இருந்த ஒரு பெண், அவருக்குப் பின்னால் வந்து, அவருடைய மேலாடையின் விளிம்பை[a][b] தொட்டாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விளிம்பு’ என்பதற்குப் பதிலாக ‘குஞ்சம்,’ ‘தொங்கல்’ அல்லது ‘ஓரம்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ஆடையின் விளிம்பையோ, யூத ஆடையுடன் தொடர்புடைய குஞ்சம் போன்ற தொங்கலையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இஸ்ரவேலரின் ஆடைகளிலிருந்த குஞ்சங்கள் அல்லது தொங்கல்களின் பின்னணிக்கு எண்ணாகமம் 15:38; உபாகமம் 22:12 ஆகியவற்றைப் பார்க்கவும்.
    reason: cross_reference
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: அப்போது, இதோ
  rationale: καί கதைத் தொடர்ச்சியைச் சுட்டுகிறது; ἰδού திடீர் கவனஈர்ப்பையும் நிகழ்வின் உயிரோட்டத்தையும் தருவதால் ‘இதோ’ என வெளிப்படையாக வைக்கப்பட்டது.
- source_word: γυνὴ αἱμορροοῦσα δώδεκα ἔτη
  choice: பன்னிரண்டு ஆண்டுகளாக இரத்தப்போக்கினால் அவதிப்பட்டுவந்த ஒரு பெண்
  rationale: நீடித்த இரத்தப்போக்கு நிலையும் பன்னிரண்டு ஆண்டுகள் என்ற கால அளவும் இயல்பான நவீனத் தமிழில் தெரிவிக்கப்படுகின்றன. ‘அவதிப்பட்டுவந்த’ என்பது நீடித்த துன்பநிலையைத் தெளிவாக்குகிறது.
- source_word: προσελθοῦσα ὄπισθεν
  choice: அவருக்குப் பின்னால் வந்து
  rationale: பெண் இயேசுவை அணுகியதையும் அது பின்புறத்திலிருந்து நிகழ்ந்ததையும் இயல்பாகச் சொல்கிறது.
- source_word: ἥψατο
  choice: தொட்டாள்
  rationale: இச்சூழலில் ἅπτω என்பதன் நடுநிலைப் பொருள் ‘தொடுதல்’; ‘பற்றிக்கொண்டாள்’ போன்ற வலிமையான சொல்லால் தொடர்பை மிகைப்படுத்தவில்லை.
- source_word: τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ
  choice: அவருடைய மேலாடையின் விளிம்பை
  rationale: ἱμάτιον வெளிப்புற ஆடையைக் குறிக்கிறது; κράσπεδον விளிம்பு, ஓரம் அல்லது குஞ்சம் ஆகியவற்றைக் குறிக்கக்கூடியதால் பொதுவான ‘விளிம்பு’ முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: κράσπεδον என்ற சொல்லில் யூத ஆடையின் குஞ்சம் அல்லது தொங்கல் குறித்த சட்டப் பின்னணி இருக்கக்கூடும்
  choice: முதன்மை உரையில் ‘விளிம்பு’
  alternative: ‘குஞ்சம்’, ‘தொங்கல்’ அல்லது ‘ஓரம்’
  rationale: கிரேக்கச் சொல் ஆடையின் ஓரத்தையோ அதனுடன் சேர்ந்த குஞ்சத்தையோ குறிக்கலாம். வசனம் அந்த அடையாளத்தை வெளிப்படையாக விளக்காததால், முதன்மை உரை ஒரு குறிப்பிட்ட விளக்கத்துக்குள் பொருளைச் சுருக்காமல் வைத்திருக்கிறது; மாற்றுப் பொருளும் சட்டப் பின்னணியும் அடிக்குறிப்புகளில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகருக்குப் புரியும், கண்ணியமான கதைநடை. ‘இதோ’ என்ற கவனஈர்ப்புச் சொல் மூலத்தின் உயிரோட்டத்தைப் பாதுகாக்கிறது. ‘மேலாடை’ என்பது ἱμάτιον என்பதைக் ‘அங்கி’ அல்லது ‘சால்வை’ என அளவுக்கு மீறிக் குறிப்பாக்காமல் தெரிவிக்கிறது.
