id: MAT.9.28
reference: Matthew 9:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐλθόντι δὲ εἰς τὴν οἰκίαν προσῆλθον αὐτῷ οἱ τυφλοί, καὶ λέγει αὐτοῖς ὁ Ἰησοῦς· Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι; λέγουσιν αὐτῷ· Ναί, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/028.yaml
  text: When he entered the house[a], the blind men approached him, and Jesus said to them, “Do you believe that I am able to do this?” They said to him, “Yes[b], Lord.”
translation:
  language: ta
  text: அவர் வீட்டிற்குள் நுழைந்தபோது[a], பார்வையற்றவர்கள் அவரை அணுகினார்கள். இயேசு அவர்களிடம், “இதைச் செய்ய என்னால் முடியும் என்று நம்புகிறீர்களா?” என்று கேட்டார். அவர்கள் அவரிடம், “ஆம், ஆண்டவரே[b]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு விதமாக: “அவர் வீட்டிற்குள் வந்தபோது.”'
    reason: மூலத்தின் ἐλθόντι என்பதற்கு ‘வந்தபோது’ என்ற நெருக்கமான வடிவமும் சாத்தியம்; ‘நுழைந்தபோது’ என்பது εἰς உடன் வரும் உள்ளே செல்லும் கருத்தை இயல்பாக வெளிப்படுத்துகிறது.
  - marker: b
    text: அல்லது, “ஐயா.” கிரேக்கத்தில் κύριε என்பது மரியாதையான அழைப்பாகவும் இருக்கலாம்; “ஆண்டவரே” என்பது இயேசுவின் அதிகாரத்தை அவர்கள் உணர்ந்திருக்கக்கூடிய சாத்தியத்தையும் காக்கிறது.
    reason: κύριε என்ற சொல்லின் மரியாதை அழைப்பு மற்றும் அதிகார அங்கீகாரம் ஆகிய இரு சாத்தியங்களையும் வெளிப்படையாகப் பாதுகாக்கும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: ἐλθόντι δὲ εἰς τὴν οἰκίαν
  choice: அவர் வீட்டிற்குள் நுழைந்தபோது
  rationale: இறந்தகாலப் பங்கேற்புவினையும் δέ-யும் அடுத்த நிகழ்வை அறிமுகப்படுத்துகின்றன. ‘வீட்டிற்குள் நுழைந்தபோது’ என்பது உள்ளே வந்த செயலை இயல்பான நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: προσῆλθον αὐτῷ
  choice: அவரை அணுகினார்கள்
  rationale: προσέρχομαι என்பது ஒருவரிடம் வருதல் அல்லது அணுகுதல். ‘அணுகினார்கள்’ என்பது முதல் வினையுடன் தேவையற்ற சொல் மீளலைத் தவிர்த்து, அதன் திசைநோக்கிய பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: οἱ τυφλοί
  choice: பார்வையற்றவர்கள்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் இந்தப் பன்மை அடைமொழியை, மனிதர்களை மரியாதையுடன் குறிக்கும் தற்போதைய தமிழில் ‘பார்வையற்றவர்கள்’ என்று மொழிபெயர்த்துள்ளது.
- source_word: Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι
  choice: இதைச் செய்ய என்னால் முடியும் என்று நம்புகிறீர்களா?
  rationale: πιστεύετε என்பதன் நம்பிக்கை சார்ந்த நேரடிக் கேள்வியையும் δύναμαι என்பதன் ஆற்றல்/வல்லமைப் பொருளையும் இயல்பான தமிழ் வாக்கிய அமைப்பில் காக்கிறது.
- source_word: Ναί
  choice: ஆம்
  rationale: நேரடியான உறுதிப்படுத்தும் பதிலுக்கு எளிய, கண்ணியமான தமிழ் இணை.
- source_word: κύριε
  choice: ஆண்டவரே
  rationale: κύριε மரியாதை விளியாகவும் அதிகாரத்தை ஏற்றுக்கொள்ளும் அழைப்பாகவும் இருக்கலாம். ‘ஆண்டவரே’ அதன் இறையியல் சாத்தியத்தை அழிக்காமல் காக்கிறது; ‘ஐயா’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: இயேசுவை நோக்கிய κύριε என்ற அழைப்பின் பொருள்
  choice: ஆண்டவரே
  alternative: ஐயா
  rationale: இச்சொல் சாதாரண மரியாதை அழைப்பாகவும் இயேசுவின் அதிகாரத்தை உணர்த்தும் அழைப்பாகவும் புரிந்துகொள்ளப்படலாம். முதன்மை உரையில் ‘ஆண்டவரே’ என்றும், குறுகிய மரியாதைப் பொருளை அடிக்குறிப்பிலும் கொடுப்பது மூலத்தின் இறையியல் திறந்தநிலையைப் பாதுகாக்கிறது.
- issue: λέγει / λέγουσιν ஆகிய வரலாற்று நிகழ்கால வினைகள்
  choice: கேட்டார் / என்றார்கள் என்ற இயல்பான தமிழ் இறந்தகால நடை
  alternative: கேட்கிறார் / சொல்கிறார்கள் என நிகழ்காலத்தை வடிவரீதியாகப் பேணுதல்
  rationale: கிரேக்கக் கதையாடலில் வரலாற்று நிகழ்காலம் நிகழ்வுக்கு உயிரோட்டம் தருகிறது. ஆனால் இங்கு அதனை நிகழ்காலமாக நேரடியாகப் பயன்படுத்துவது நவீனத் தமிழில் காலமாற்றமாகத் தோன்றலாம்; எனவே பொருளையும் இயல்பான கதையாடல் ஓட்டத்தையும் காக்க இறந்தகாலம் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத் தமிழ், கண்ணியமான வேதாகமக் கதையாடல் நடை. ‘பார்வையற்றவர்கள்’ என்பது மனித மரியாதையைப் பேணும் தற்போதைய சொல். கேள்வி நேரடியாகவும் உரையாடல் இயல்பாகவும் வைக்கப்பட்டுள்ளது.
