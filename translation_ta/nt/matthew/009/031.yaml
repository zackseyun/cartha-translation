source:
  edition: SBLGNT
  text: οἱ δὲ ἐξελθόντες διεφήμισαν αὐτὸν ἐν ὅλῃ τῇ γῇ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/031.yaml
  text: But after they went out[a], they spread the news about him throughout that whole region.
translation:
  language: ta
  text: ஆனால் அவர்கள் வெளியே போனபின், அவரைப் பற்றிய செய்தியை அந்தப் பகுதி முழுவதும் பரப்பினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த நிலப்பரப்பு முழுவதும்.” கிரேக்கச் சொல் γῆ என்பதற்கு “நிலம்,” “நிலப்பரப்பு,” அல்லது “பகுதி” என்று பொருள் வரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் இயேசு கொடுத்த எச்சரிக்கைக்கும் இவர்கள் செய்ததற்கும் இடையிலான மென்மையான முரண்பாட்டை வெளிப்படுத்துகிறது.
- source_word: ἐξελθόντες
  choice: அவர்கள் வெளியே போனபின்
  rationale: முதன்மை வினைக்கு முன்பு நடந்த செயலைக் குறிக்கும் இறந்தகாலப் பங்கேற்பு வடிவத்தின் கால வரிசையை இயல்பான தமிழில் காக்கிறது.
- source_word: διεφήμισαν
  choice: செய்தியை ... பரப்பினார்கள்
  rationale: ஒருவரைப் பற்றிய செய்தியைப் பரவலாக அறியச் செய்தல் என்ற வினையின் பொருளை நவீனத் தமிழில் தெளிவாக வழங்குகிறது.
- source_word: αὐτὸν
  choice: அவரைப் பற்றிய
  rationale: கிரேக்கத்தில் நேரடிச் செயப்படுபொருளாக உள்ளதை, ‘செய்தியைப் பரப்புதல்’ என்ற தமிழ் தொடருக்கு இயல்பாக உறவுப்படுத்துகிறது.
- source_word: ἐν ὅλῃ τῇ γῇ ἐκείνῃ
  choice: அந்தப் பகுதி முழுவதும்
  rationale: ἐν என்பதன் பரவல் சார்ந்த பொருளையும், ὅλῃ என்பதன் முழுமையையும் காக்கிறது; γῆ இங்கு உள்ளூர் நிலப்பரப்பைக் குறிக்க வாய்ப்புள்ளதால் ‘பகுதி’ பொருத்தமானது.
theological_decisions:
- issue: γῆ என்பதன் புவியியல் பரப்பு
  choice: பகுதி
  alternative: நிலப்பரப்பு / நாடு
  rationale: சூழல் இயேசுவைப் பற்றிய செய்தி உள்ளூர் வட்டாரத்தில் பரவியதைச் சுட்டுகிறது. ‘பகுதி’ என்பது பரப்பை மிகைப்படுத்தாமல், γῆ என்பதிலுள்ள உண்மையான பொருள் வரம்பையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடியதாயும் மதிப்புமிக்க நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. முந்தைய கட்டளைக்கும் இவர்களின் செயலுக்கும் உள்ள முரண்பாடு ‘ஆனால்’ என்பதால் காக்கப்பட்டுள்ளது.
