id: MAT.9.15
reference: Matthew 9:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος πενθεῖν ἐφ’ ὅσον μετ’ αὐτῶν ἐστιν ὁ νυμφίος; ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/015.yaml
  text: And Jesus said to them[a], “The wedding attendants cannot mourn as long as the bridegroom is with them, can they? But days will come when the bridegroom is taken away from them[b], and then they will fast.”
translation:
  language: ta
  text: இயேசு அவர்களிடம், “மணமகன் அவர்களுடன் இருக்கும் வரையில், மணமகனின் தோழர்கள் துக்கப்பட முடியுமா? ஆனால் மணமகன் அவர்களிடமிருந்து எடுத்துக்கொள்ளப்படும் நாட்கள் வரும்; அப்போது அவர்கள் நோன்பிருப்பார்கள்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: υἱοὶ τοῦ νυμφῶνος
  choice: மணமகனின் தோழர்கள்
  rationale: சொல்லுக்குச் சொல் மொழிபெயர்த்தால் ‘மணவறையின் மகன்கள்’ என வரும் செமித்திய மரபுத்தொடர், திருமண விழாவில் மணமகனோடு இருக்கும் தோழர்களைக் குறிக்கிறது. நவீன தமிழில் சமூகப் பங்கையும் இயல்பான நடையையும் தெளிவாகத் தருகிறது.
- source_word: πενθεῖν
  choice: துக்கப்பட
  rationale: துயருறுதல் அல்லது புலம்புதல் என்ற பொருளைத் தருகிறது; நோன்புடன் அமைந்துள்ள எதிர்மறை ஒப்புமைக்கு ‘துக்கப்பட’ பொருத்தமானது.
- source_word: ἐφ’ ὅσον
  choice: இருக்கும் வரையில்
  rationale: கால நீட்சியைக் காட்டும் கிரேக்கச் சொற்றொடரை இயல்பான தமிழில் துல்லியமாகத் தருகிறது.
- source_word: νυμφίος
  choice: மணமகன்
  rationale: திருமண உருவகத்தைத் தெளிவாகக் காக்கும் வழக்கமான தமிழ் சொல்.
- source_word: ἀπαρθῇ
  choice: எடுத்துக்கொள்ளப்படும்
  rationale: வெறுமனே பிரிந்து செல்வதைவிட, பிறரால் அகற்றப்படுவதைக் குறிக்கும் செயப்பாட்டு வடிவத்தையும் அதன் மறைநயத்தையும் காக்கிறது.
- source_word: νηστεύσουσιν
  choice: நோன்பிருப்பார்கள்
  rationale: உணவைத் தவிர்த்து நோன்பு கடைப்பிடிப்பதைக் குறிக்கும் எதிர்கால வினையை இயல்பான தமிழில் தருகிறது.
- source_word: Μὴ δύνανται ... ;
  choice: முடியுமா?
  rationale: எதிர்மறையான பதிலை எதிர்பார்க்கும் வினாவின் சொல்லாட்சி வலிமையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: ஆனால் ... நாட்கள் வரும்
  rationale: எதிர்கால நிகழ்வை அறிவிக்கும் கிரேக்க மரபுத்தொடரையும் δέ காட்டும் மென்மையான முரண்பாட்டையும் காக்கிறது.
theological_decisions:
- issue: மணமகன் உருவகத்தின் கிறிஸ்துவியல் முக்கியத்துவம்
  choice: ‘மணமகன்’ என்ற உருவகத்தை விளக்க விரிவாக்கமின்றி அப்படியே வைத்தல்
  alternative: இயேசுவை மேசியாவாகிய மணமகன் என்று மொழிபெயர்ப்பிலேயே வெளிப்படையாக அடையாளப்படுத்துதல்
  rationale: வசனமே உருவகத்தை முன்வைக்கிறது; அதன் இறையியல் குறிப்பை வாசகர் உணர இடமளிக்க வேண்டும். மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்காமல் இறையியல் நுட்பத்தைக் காக்கிறது.
- issue: ἀπαρθῇ குறிக்கும் அகற்றப்படுதல்
  choice: செயப்பாட்டு வடிவத்தையும் வலுக்கட்டாய அகற்றத்தின் சாத்தியமான நயத்தையும் காக்க ‘எடுத்துக்கொள்ளப்படும்’ எனத் தருதல்
  alternative: ‘பிரிந்து செல்வார்’ என்று சாதாரணப் புறப்பாடாகத் தெளிவுபடுத்துதல்
  rationale: இச்சொல் இயேசுவின் வரவிருக்கும் மரணத்தை முன்னறிவிக்கக்கூடும்; ஆனால் அதனை மொழிபெயர்ப்பில் வெளிப்படையாகச் சொல்லாமல் மூலத்தின் மறைநயத்தைப் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. உருவகங்களும் செயப்பாட்டு வடிவத்தின் மறைநயமும் காக்கப்பட்டுள்ளன; ‘மணவறையின் மகன்கள்’ என்ற நேரடி ஆனால் தெளிவற்ற வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
