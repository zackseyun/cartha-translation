  text: τότε λέγει τοῖς μαθηταῖς αὐτοῦ· Ὁ μὲν θερισμὸς πολύς, οἱ δὲ ἐργάται ὀλίγοι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/037.yaml
  text: Then he says to his disciples[a], “The harvest indeed is plentiful[b], but the workers are few.”
translation:
  language: ta
  text: அப்போது அவர் தமது சீடர்களிடம், “அறுவடை ஏராளமாக உள்ளது[a]; ஆனால் வேலையாட்களோ சிலரே” என்று சொல்கிறார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “அறுவடை மிகுதியாக உள்ளது; ஆனால் உழைப்பாளர்கள் சிலரே.”
    reason: lexical_alternative
  - marker: b
    text: 'கிரேக்கத்தில் வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டுள்ளது: “சொல்கிறார்.” சில மொழிபெயர்ப்புகள் “சொன்னார்” என்று தருகின்றன.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: கதை நிகழ்வுகளின் தொடர்ச்சியைக் குறிக்கும் இயல்பான, சுருக்கமான தமிழ் இணை.
- source_word: λέγει
  choice: சொல்கிறார்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தைத் தக்கவைத்து, கதைசொல்லலின் உயிரோட்டத்தைப் பாதுகாக்கிறது.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: தமது சீடர்களிடம்
  rationale: αὐτοῦ என்ற உடைமையைக் குறிக்கும் சொல்லை வெளிப்படையாகத் தக்கவைக்கிறது; மரியாதை ஒருமைக்கு இயல்பாகத் ‘தமது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: Ὁ μὲν ... οἱ δὲ
  choice: …; ஆனால் …-ஓ
  rationale: μέν…δέ அமைப்பின் ஒப்பீட்டு முரண்பாட்டை இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: θερισμός
  choice: அறுவடை
  rationale: வேளாண்மை உருவகத்தை மாற்றாமல் காக்கும் நிலையான தமிழ் சொல்.
- source_word: πολύς
  choice: மிகுதி
  rationale: அறுவடை பெருமளவில் இருப்பதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐργάται
  choice: வேலையாட்கள்
  rationale: அறுவடைப் பணியில் ஈடுபடுபவர்களைக் குறிக்கும் உருவகத்துக்கு ஏற்ற, பொதுமக்கள் புரிந்துகொள்ளும் சொல்.
- source_word: ὀλίγοι
  choice: சிலரே
  rationale: மிகுதியான அறுவடைக்கு எதிராக பணியாளர்கள் குறைவாக இருப்பதை வலியுறுத்தும் இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: அறுவடை என்ற உருவகத்தின் பொருள்
  choice: அறுவடை என்ற வேளாண்மை உருவகத்தை விளக்கமின்றி அப்படியே தக்கவைத்தல்
  alternative: இயேசுவின் பணியை ஏற்கத் தயாராக உள்ள மக்களை அறுவடை குறிக்கிறது என்று மொழிபெயர்ப்பிலேயே வெளிப்படுத்துதல்
  rationale: இந்த வசனம் உருவகத்தை மட்டுமே முன்வைக்கிறது; அதன் குறியீட்டை மொழிபெயர்ப்பில் விளக்குவது மூலத்தில் இல்லாத விளக்கத்தைச் சேர்த்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும் அதேவேளை கண்ணியமான நடை. கிரேக்கத்தின் வரலாற்று நிகழ்காலமும் அறுவடை உருவகமும் தக்கவைக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
