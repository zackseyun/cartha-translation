id: MAT.9.19
reference: Matthew 9:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐγερθεὶς ὁ Ἰησοῦς ⸀ἠκολούθει αὐτῷ καὶ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/019.yaml
  text: And Jesus rose and followed him, and his disciples did too.
translation:
  language: ta
  text: இயேசு எழுந்து அவரைப் பின்தொடர்ந்தார்; அவருடைய சீடர்களும் பின்தொடர்ந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγερθεὶς
  choice: எழுந்து
  rationale: இங்கு ἐγείρω என்ற வினையின் இறந்தகாலப் பெயரெச்சம் இயேசு இருந்த இடத்திலிருந்து எழுந்து அடுத்த செயலை மேற்கொண்டதைக் குறிக்கிறது. “எழுந்து” என்பது இயல்பான தமிழ் கதைநடை.
- source_word: ἠκολούθει
  choice: பின்தொடர்ந்தார்
  rationale: ἀκολουθέω என்பதன் இறந்தகாலத் தொடர்நிலை வடிவம் உடன் சென்று பின்பற்றிய செயலைக் குறிக்கிறது. தமிழில் “பின்தொடர்ந்தார்” நிகழ்வையும் வினையின் அடிப்படைப் பொருளையும் இயல்பாகத் தருகிறது.
- source_word: αὐτῷ
  choice: அவரை
  rationale: இந்த இடத்தில் முன்னைய வசனத்தில் வந்த தலைவரே சுட்டப்படுகிறார். ἀκολουθέω உடன் வரும் வேற்றுமைப் பொருளைத் தமிழில் நேரடியாக “அவரை” என்று வழங்குவது இயல்பு.
- source_word: μαθηταὶ
  choice: சீடர்கள்
  rationale: நற்செய்தி நூல்களில் μαθηταί என்பது ஆசிரியரைப் பின்பற்றிக் கற்றுக்கொள்பவர்களைக் குறிக்கும் நிலையான சொல்; “சீடர்கள்” அந்த உறவைத் துல்லியமாகக் காக்கிறது.
- source_word: καὶ οἱ μαθηταὶ αὐτοῦ
  choice: அவருடைய சீடர்களும் பின்தொடர்ந்தார்கள்
  rationale: கிரேக்கத்தில் இரண்டாம் கூறில் வினை மீண்டும் சொல்லப்படவில்லை. தமிழில் தெளிவுக்காக “பின்தொடர்ந்தார்கள்” என்பதை மீண்டும் வழங்குவது இயல்பானது; αὐτοῦ இயேசுவைக் குறிக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. இயேசுவுக்கும் முந்தைய வசனத்தில் வந்த தலைவருக்கும் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; சீடர்களைப் பற்றிய வினை பன்மையில் தெளிவாக மீண்டும் கூறப்பட்டுள்ளது.
