id: MAT.9.1
reference: Matthew 9:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ⸀ἐμβὰς ⸀εἰς πλοῖον διεπέρασεν καὶ ἦλθεν εἰς τὴν ἰδίαν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/001.yaml
  text: And after getting into a boat[a], he crossed over and came to his own city.
translation:
  language: ta
  text: அவர் ஒரு படகில் ஏறி, மறுகரைக்குக் கடந்து, தமக்குச் சொந்தமான நகரத்திற்கு[a] வந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தமது சொந்த ஊருக்கு.” கிரேக்கத்தில் “தமக்குச் சொந்தமான நகரத்திற்கு” என்று உள்ளது. இக்கதைப்பகுதியில் இயேசுவோடு தொடர்புடைய நகரத்தை, பெரும்பாலும் கப்பர்நகூமை, இது குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβὰς
  choice: ஏறி
  rationale: இறந்தகால வினையெச்சம் பிரதான செயல்களுக்கு முன் நிகழ்ந்த செயலைக் குறிக்கிறது. தமிழில் ‘ஏறி’ என்பது இந்தச் செயல்தொடரை இயல்பாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: πλοῖον
  choice: ஒரு படகு
  rationale: இது பொதுவாக நீர்வழிப் பயணத்திற்கான கலத்தைக் குறிக்கிறது. கலிலேயக் கடல் சூழலில் ‘படகு’ இயல்பான சொல்; கிரேக்கத்தில் சுட்டுச்சொல் இல்லாததால் ‘ஒரு’ சேர்க்கப்பட்டுள்ளது.
- source_word: διεπέρασεν
  choice: மறுகரைக்குக் கடந்து
  rationale: διαπεράω ஒரு பக்கத்திலிருந்து மறுபக்கத்திற்குக் கடப்பதைக் குறிக்கிறது. நீர்நிலைச் சூழலில் ‘மறுகரைக்குக் கடந்து’ அதன் திசைநுட்பத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἦλθεν
  choice: வந்தார்
  rationale: ἔρχομαι என்பதன் அடிப்படை வருகைப் பொருளையும் கதையின் பார்வையையும் ‘வந்தார்’ நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: ἰδίαν πόλιν
  choice: தமக்குச் சொந்தமான நகரம்
  rationale: ἴδιος தனிப்பட்ட உரிமை அல்லது நெருங்கிய தொடர்பை வலியுறுத்துகிறது. எந்த நகரம் என்று மூலவசனம் பெயரிடாததால், ‘சொந்த ஊர்’ எனத் தீர்மானிக்காமல் நேரடியான பொருள் பாதுகாக்கப்பட்டுள்ளது.
- source_word: Καὶ ... καὶ
  choice: வினையெச்சத் தொடர்
  rationale: கிரேக்கத்தின் தொடர்ச்சியான καί நிகழ்வுகளை எளிய வரிசையில் இணைக்கிறது. தமிழில் மீண்டும் மீண்டும் ‘மற்றும்’ என்று கூறுவதைவிட, ‘ஏறி, ... கடந்து, ... வந்தார்’ என்ற வினையெச்சத் தொடர் அதே நிகழ்வரிசையை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: ‘தமக்குச் சொந்தமான நகரம்’ என்பது எந்த நகரம்?
  choice: முதன்மை உரையில் நகரத்தின் பெயரைக் குறிப்பிடாமல், கிரேக்கச் சொல்லமைப்பை நடுநிலையாகப் பாதுகாத்தல்
  alternative: மத்தேயுவின் கதைச்சூழலின் அடிப்படையில் அதைக் கப்பர்நகூம் என்று வெளிப்படையாக அடையாளப்படுத்துதல்
  rationale: கதைச்சூழல் கப்பர்நகூமை வலுவாகச் சுட்டக்கூடும்; ஆனாலும் கிரேக்க மூலவசனம் நகரத்தின் பெயரைக் கூறவில்லை. எனவே அந்த அடையாளத்தை முதன்மை உரைக்குள் சேர்க்காமல், மூலத்தின் தெளிவின்மையைப் பாதுகாப்பது பொருத்தமானது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகப் புரியுமாறு, அதேவேளையில் வேதாகம வாசிப்பிற்கு ஏற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; கிரேக்கத்தின் இணைப்புச் சொற்கள் தமிழுக்கேற்ற வினையெச்சத் தொடராக அமைக்கப்பட்டுள்ளன.
