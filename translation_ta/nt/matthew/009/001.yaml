  source_fidelity: மூலக் கிரேக்கத்தின் நிகழ்வுவரிசை, πλοῖον என்பதன் பொதுப்பொருள், διαπεράω-வின் ‘மறுகரைக்குக் கடத்தல்’ நுட்பம், மற்றும் ἰδίαν πόλιν என்பதன் பெயரிடப்படாத தொடர்புப் பொருள் அனைத்தும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. ‘ஏறி … கடந்து … வந்தார்’ என்பது aorist participle மற்றும் தொடர்ச்சியான பிரதான வினைகளைத் தமிழில் இயல்பாகத் தருகிறது.
