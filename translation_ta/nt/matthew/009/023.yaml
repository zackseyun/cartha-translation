  text: καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν τοῦ ἄρχοντος καὶ ἰδὼν τοὺς αὐλητὰς καὶ τὸν ὄχλον θορυβούμενον
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/023.yaml
  text: And when Jesus came into the ruler's house and saw the flute players and the crowd making a commotion[c][b][a],
translation:
  language: ta
  text: இயேசு தலைவரின் வீட்டுக்குள் வந்து, புல்லாங்குழல் வாசிப்பவர்களையும் அமளி செய்துகொண்டிருந்த கூட்டத்தையும் கண்டார்.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதிகாரியின்.” இணை நிகழ்ச்சிகளுடன் ஒப்பிட்டால், “ஜெபக்கூடத் தலைவரின்” என்றும் புரிந்துகொள்ளலாம். இங்கு மத்தேயு பயன்படுத்தும் சொல் பொதுவாக “தலைவர்” என்றே பொருள்படும்.
    reason: alternative_reading
  - marker: b
    text: அதாவது, இறுதிச் சடங்குகளில் புல்லாங்குழல் வாசிப்பவர்களும் துக்கம் அனுசரிப்போரும் இருப்பது அக்காலத்தில் வழக்கமாக இருந்தது.
    reason: cultural_note
  - marker: c
    text: அல்லது, “பெரும் குழப்பத்தில் இருந்த.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: வந்து
  rationale: இறந்தகால வினையெச்சம் நிகழ்வுகளின் காலவரிசையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: οἰκίαν
  choice: வீட்டுக்குள்
  rationale: οἰκία என்பதன் நேரடியான பொருள் ‘வீடு’; εἰς என்பதன் உள்ளே செல்லும் இயக்கத்தையும் ‘வீட்டுக்குள்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἄρχοντος
  choice: தலைவரின்
  rationale: மத்தேயுவின் சொல் பொதுவாக ஆளும் அல்லது தலைமை வகிக்கும் ஒருவரைக் குறிக்கிறது; இணை நிகழ்ச்சிகளிலிருந்து ‘ஜெபக்கூடத் தலைவர்’ என்று குறிப்பாக்காமல் பரந்த பொருள் காக்கப்படுகிறது.
- source_word: ἰδὼν
  choice: கண்டார்
  rationale: எளிய கதைநடைச் செயலை இயல்பாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: αὐλητὰς
  choice: புல்லாங்குழல் வாசிப்பவர்களை
  rationale: αὐλός வகை ஊதுகருவியை வாசிப்பவர்களைக் குறிக்கும் சொல்லுக்கு நவீன வாசகர்கள் எளிதில் புரிந்துகொள்ளும் இணை.
- source_word: ὄχλον
  choice: கூட்டத்தை
  rationale: கதைநடையில் ὄχλος என்பதற்கான இயல்பான பொதுத் தமிழ் சொல்.
- source_word: θορυβούμενον
  choice: கூச்சலிட்டுக்கொண்டிருந்த
  rationale: தொடர்ந்து நிகழ்ந்த சத்தமான கலகலப்பை இயல்பான தமிழில் காட்டுகிறது; துக்கத்தின் உணர்ச்சியை மூலத்தைவிட அதிகமாகக் குறிப்பாக்கவில்லை.
theological_decisions:
- issue: வீட்டுக்குரியவரின் அடையாளம்
  choice: தலைவர்
  alternative: அதிகாரி; ஜெபக்கூடத் தலைவர்
  rationale: இங்கு கிரேக்க மூலத்தில் ἄρχων என்ற பொதுச் சொல் மட்டுமே உள்ளது. இணை நிகழ்ச்சிகளின் விவரத்தைப் புகுத்தாமல் மூலத்தின் பரந்த குறிப்பைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் பங்கேற்பு அமைப்பு தமிழுக்கு இயல்பான தொடர்வினை அமைப்பாக மாற்றப்பட்டுள்ளது; குறிப்பாக θορυβούμενον என்பதன் சத்தமான தன்மை காக்கப்பட்டாலும் துக்க உணர்வு முதன்மை உரையில் மேலதிகமாகச் சேர்க்கப்படவில்லை.
