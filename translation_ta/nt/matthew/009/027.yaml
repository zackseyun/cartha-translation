id: MAT.9.27
reference: Matthew 9:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ παράγοντι ἐκεῖθεν τῷ Ἰησοῦ ἠκολούθησαν ⸀αὐτῷ δύο τυφλοὶ κράζοντες καὶ λέγοντες· Ἐλέησον ἡμᾶς, ⸀υἱὲ Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/027.yaml
  text: And as Jesus was passing on from there[a], two blind men followed him, crying out and saying, “Have mercy on us, Son of David.”
translation:
  language: ta
  text: இயேசு அங்கிருந்து போய்க்கொண்டிருந்தபோது, பார்வையற்ற இரு மனிதர்கள் அவரைப் பின்தொடர்ந்து, “தாவீதின் மகனே[a], எங்கள்மேல் இரங்கும்!” என்று உரக்கக் கூப்பிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தாவீதின் மகன்” என்பது அரசருக்குரிய மேசியப் பட்டப்பெயர்; தாவீதின் வம்சத்தில் வருவதாக வாக்களிக்கப்பட்ட அரசராக இயேசுவை இது அடையாளப்படுத்துகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: παράγοντι ἐκεῖθεν
  choice: அங்கிருந்து போய்க்கொண்டிருந்தபோது
  rationale: நிகழ்காலப் பங்கேற்புவினையின் ஒரே நேர நிகழ்வையும், ἐκεῖθεν என்பதன் ‘அங்கிருந்து’ என்ற இடப்பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἠκολούθησαν αὐτῷ
  choice: அவரைப் பின்தொடர்ந்து
  rationale: இங்கு ἀκολουθέω உடல்ரீதியாகப் பின்னால் செல்வதைக் குறிக்கிறது; தொடர்ந்துவரும் கூப்பிடுதலுடன் இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: δύο τυφλοὶ
  choice: பார்வையற்ற மனிதர்கள் இருவர்
  rationale: ஆண்பால் பன்மையான பெயரடை இங்கு மனிதர்களைக் குறிக்கிறது. நவீன மரியாதையான தமிழில் ‘பார்வையற்ற’ என்பது தெளிவாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: κράζοντες καὶ λέγοντες
  choice: என்று உரக்கக் கூப்பிட்டார்கள்
  rationale: κράζω-வின் உரத்த, அவசரமான வேண்டுகோள் உணர்வைக் காக்கிறது; λέγοντες-ஐ தமிழின் நேரடி உரை அமைப்பில் இயல்பாக உள்ளடக்குகிறது.
- source_word: Ἐλέησον ἡμᾶς
  choice: எங்களுக்கு இரங்கும்
  rationale: இரக்கத்தோடு உதவுமாறு முன்வைக்கப்படும் நேரடியான வேண்டுகோளைச் சுருக்கமாகவும் மரியாதையான ஏவல் வடிவிலும் வெளிப்படுத்துகிறது.
- source_word: υἱὲ Δαυίδ
  choice: தாவீதின் மகனே
  rationale: மூலத்தின் நேரடி அழைப்பையும் மத்தேயுவில் காணப்படும் அரச-மேசிய அடைமொழியையும் விளக்கச் சொற்களைச் சேர்க்காமல் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘தாவீதின் மகன்’ என்ற அடைமொழியின் மேசியப் பொருள்
  choice: முதன்மை உரையில் ‘தாவீதின் மகனே’ என்று அடைமொழியை அப்படியே வைத்தல்
  alternative: ‘தாவீதின் வழியில் வந்த மேசியாவே’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: கிரேக்க உரை பாரம்பரிய அடைமொழியை மட்டுமே தருகிறது; அதன் அரச-மேசிய முக்கியத்துவத்தை உரைக்குள் விரித்துச் சேர்க்காமல் அடிக்குறிப்பில் விளக்குவது மூலத்தின் சுருக்கத்தையும் பொருள் அடுக்கையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு எளிதில் புரியும், அதேவேளை கண்ணியமான நடையைப் பயன்படுத்துகிறது. கிரேக்கத்தின் பங்கேற்புவினைத் தொடரைச் சொற்சொல்லாகப் பின்பற்றாமல் இயல்பான தமிழ்ச் சம்பவத் தொடராக அமைத்துள்ளது.
