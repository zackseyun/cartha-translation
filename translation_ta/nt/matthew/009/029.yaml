id: MAT.9.29
reference: Matthew 9:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τότε ἥψατο τῶν ὀφθαλμῶν αὐτῶν λέγων· Κατὰ τὴν πίστιν ὑμῶν γενηθήτω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/029.yaml
  text: Then he touched their eyes[a], saying, “According to your faith, let it be done for you.”
translation:
  language: ta
  text: அப்போது அவர் அவர்களுடைய கண்களைத் தொட்டு, “உங்கள் விசுவாசத்தின்படியே[a] உங்களுக்கு ஆகட்டும்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் நம்பிக்கையின்படி உங்களுக்கு நிகழட்டும்.” கிரேக்கச் சொல்லான πίστις என்பதை “நம்பிக்கை” என்றும், சில சூழல்களில் “விசுவாசத்தன்மை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: நிகழ்வுகளின் தொடரில் அடுத்த செயலைக் குறிக்கும் இயல்பான நவீனத் தமிழ் கதைநடைச் சொல்.
- source_word: ἥψατο
  choice: தொட்டு
  rationale: இங்கு உடல்ரீதியாகத் தொடுவதைக் குறிக்கிறது; தேவையற்ற விரிவாக்கமின்றி நேரடிப் பொருளைப் பேணுகிறது.
- source_word: τῶν ὀφθαλμῶν αὐτῶν
  choice: அவர்களுடைய கண்களை
  rationale: ἅπτομαι உடன் வரும் கிரேக்க வேற்றுமைத் தொடர்பை இயல்பான தமிழ் செயப்படுபொருள் அமைப்பில் தருகிறது.
- source_word: λέγων
  choice: என்றார்
  rationale: கிரேக்க நிகழ்கால வினையெச்சத்தின் ஒரேநேரத் தொடர்பை இயல்பான தமிழ் மேற்கோள் அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: Κατὰ
  choice: -இன்படியே
  rationale: ஒத்திசைவு அல்லது அளவின்படி என்பதைக் காட்டுகிறது; வலுவான காரணப் பொருளைத் திணிக்கவில்லை.
- source_word: τὴν πίστιν ὑμῶν
  choice: உங்கள் விசுவாசம்
  rationale: πίστις என்பதற்கான நிலைபெற்ற வேதாகமத் தமிழ் இணை; இச்சூழலில் இயேசுவின் குணமாக்கும் ஆற்றல்மீது அவர்கள் வைத்த நம்பிக்கையைக் குறிக்கிறது.
- source_word: γενηθήτω
  choice: ஆகட்டும்
  rationale: γίνομαι வினையின் கட்டளை/அனுமதி வலிமையைச் சுருக்கமாகவும் இயல்பாகவும் பேணும் தமிழ் வடிவம்.
- source_word: ὑμῖν
  choice: உங்களுக்கு
  rationale: அவர்களுக்குச் சம்பவிக்கும் அல்லது அவர்களுக்குப் பயனாக அமையும் செயலைக் குறிக்கும் இயல்பான தத்துவேற்றுமை வடிவம்.
theological_decisions:
- issue: குணமாக்குதல் குறித்த கூற்றில் πίστις என்பதன் மொழிபெயர்ப்பு
  choice: விசுவாசம்
  alternative: நம்பிக்கை
  rationale: இச்சூழலில் சொல் இயேசுவின்மீது வைத்த நம்பிக்கையைக் குறித்தாலும், ‘விசுவாசம்’ அதன் வேதாகம மற்றும் இறையியல் பரப்பைத் திறந்தவாறே வைத்திருக்கிறது. ‘நம்பிக்கை’ ஒரு செல்லத்தக்க சூழல்சார் மாற்று.
- issue: κατά என்பதன் உறவு
  choice: உங்கள் விசுவாசத்தின்படியே
  alternative: உங்கள் விசுவாசத்தின் அடிப்படையில்
  rationale: கிரேக்கம் ஒத்திசைவு அல்லது அளவைத் தெரிவிக்கிறது; விசுவாசமே குணமாக்குதலின் தனித்த காரணம் என்று வலுப்படுத்தும் மொழியைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் dignified, எளிதில் புரியும் கதைநடை. ‘விசுவாசத்தின்படியே’ என்பது மூலத்தின் κατά + குற்றுவேற்றுமை அமைப்பை இயல்பாகப் பேணுகிறது; ‘ஆகட்டும்’ கட்டளைத் தன்மையுள்ள அறிவிப்பைச் சுருக்கமாக வெளிப்படுத்துகிறது.
