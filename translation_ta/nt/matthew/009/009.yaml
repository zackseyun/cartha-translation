id: MAT.9.9
reference: Matthew 9:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ παράγων ὁ Ἰησοῦς ἐκεῖθεν εἶδεν ἄνθρωπον καθήμενον ἐπὶ τὸ τελώνιον, Μαθθαῖον λεγόμενον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι· καὶ ἀναστὰς ἠκολούθησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/009.yaml
  text: And as Jesus was passing on from there[a], he saw a man called Matthew sitting at the tax booth, and he says to him[c][b], “Follow me.” And he rose and followed him.
translation:
  language: ta
  text: இயேசு அங்கிருந்து போய்க்கொண்டிருக்கையில், வரி வசூல் சாவடியில் அமர்ந்திருந்த மத்தேயு என்ற ஒரு மனிதரைக் கண்டார். அவரிடம், “என்னைப் பின்பற்று” என்று சொன்னார்.[a] அவர் எழுந்து இயேசுவைப் பின்பற்றினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில், “சொல்கிறார்”; கதைநிகழ்வை உயிரோட்டமாகக் காட்ட வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: παράγων … ἐκεῖθεν
  choice: அங்கிருந்து போய்க்கொண்டிருக்கையில்
  rationale: நிகழ்ந்துகொண்டிருந்த நகர்வைக் குறிக்கும் நிகழ்காலப் பெயரெச்சத்தையும், முந்தைய இடத்திலிருந்து புறப்பட்டுச் செல்வதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἄνθρωπον
  choice: ஒரு மனிதரை
  rationale: இங்கு குறிப்பிட்ட ஓர் ஆணைக் குறித்தாலும், ‘மனிதர்’ என்பது நவீனத் தமிழில் இயல்பாகவும் மரியாதையாகவும் உள்ளது; மத்தேயு என்ற பெயர் நபரைத் தெளிவுபடுத்துகிறது.
- source_word: καθήμενον ἐπὶ τὸ τελώνιον
  choice: வரி வசூல் சாவடியில் அமர்ந்திருந்த
  rationale: வரி அல்லது சுங்கம் வசூலிக்கப்பட்ட இடத்தில் அவர் பணியில் அமர்ந்திருந்த காட்சியைத் தெளிவாகத் தருகிறது; ‘அலுவலகம்’ என்று நிறுவனத் தன்மையை மிகைப்படுத்தவில்லை.
- source_word: Μαθθαῖον λεγόμενον
  choice: மத்தேயு என்ற
  rationale: அவர் அறியப்பட்ட பெயரை அறிமுகப்படுத்தும் இயல்பான நவீனத் தமிழ் நடை.
- source_word: λέγει αὐτῷ
  choice: அவரிடம் … என்று சொன்னார்
  rationale: தமிழ் கடந்தகாலக் கதைநடையில் இயல்பாக அமைய இறந்தகாலம் பயன்படுத்தப்பட்டுள்ளது; கிரேக்கத்தின் வரலாற்று நிகழ்காலம் அடிக்குறிப்பில் சுட்டப்பட்டுள்ளது.
- source_word: Ἀκολούθει μοι
  choice: என்னைப் பின்பற்று
  rationale: சீடத்துவ அழைப்பின் பொருளை விளக்கச் சொற்கள் சேர்க்காமல், கட்டளையின் நேரடித் தன்மையைப் பாதுகாக்கிறது.
- source_word: ἀναστὰς
  choice: எழுந்து
  rationale: முதன்மைச் செயலுக்கு முன் நிகழ்ந்த உடனடியான உடல் இயக்கத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἠκολούθησεν αὐτῷ
  choice: இயேசுவைப் பின்பற்றினார்
  rationale: தமிழில் ‘அவரைப்’ என்பதன் சுட்டுப்பொருள் குழப்பமடையாமல் இயேசுவின் பெயர் மீண்டும் தரப்பட்டுள்ளது; நேரடியான பின்தொடர்தலையும் சீடத்துவ உட்பொருளையும் பாதுகாக்கிறது.
theological_decisions:
- issue: மத்தேயுவுக்கு இயேசு விடுத்த அழைப்பின் இயல்பு
  choice: ‘என்னைப் பின்பற்று’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘என் சீடனாக வா’
  rationale: இந்த நிகழ்வு சீடத்துவ அழைப்பைக் குறித்தாலும், மூலத்தில் இல்லாத விளக்கத்தை வசனத்துக்குள் சேர்க்காமல் அதன் இறையியல் உட்பொருளை நேரடிக் கட்டளையிலேயே நிலைநிறுத்துகிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமக் கதைநடைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டுள்ளது. ‘வரி வசூல் சாவடி’ என்பது பண்டைய வரி அல்லது சுங்க வசூல் இடத்தை நவீன அலுவலகமாகத் தவறாகக் காட்டாமல் தெளிவுபடுத்துகிறது.
