  verdict: revise
  source_fidelity: The rendering accurately conveys Jesus’ movement from the prior location, his seeing a man called Matthew at a tax-collection booth, the summons, and Matthew’s subsequent response. However, ‘உடனே’ (‘immediately’) adds an explicit temporal emphasis not present in the Greek text.
  naturalness: The Tamil is clear, modern, and suitably dignified. ‘வரி வசூல் சாவடி’ naturally conveys τελώνιον without anachronistically making it an office. The explicit repetition ‘இயேசுவைப்’ avoids pronoun ambiguity effectively.
  terminology: ‘மத்தேயு,’ ‘வரி வசூல் சாவடி,’ and ‘என்னைப் பின்பற்று’ are appropriate. The imperative preserves the unexpanded discipleship summons. The footnote appropriately identifies the historical present in λέγει.
  issues:
  - severity: low
    issue: ‘உடனே’ is an unwarranted addition.
    rationale: ἀναστὰς followed by ἠκολούθησεν indicates that he got up and followed, but the adverb ‘immediately’ is not expressed in this verse. Removing it preserves the narrative sequence without adding emphasis.
