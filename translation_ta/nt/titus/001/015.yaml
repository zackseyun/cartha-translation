id: TIT.1.15
reference: Titus 1:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀πάντα καθαρὰ τοῖς καθαροῖς· τοῖς δὲ μεμιαμμένοις καὶ ἀπίστοις οὐδὲν καθαρόν, ἀλλὰ μεμίανται αὐτῶν καὶ ὁ νοῦς καὶ ἡ συνείδησις.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/015.yaml
  text: All things are pure to the pure; but to those who are defiled and unbelieving[a], nothing is pure. Instead, both their mind and their conscience are defiled.
translation:
  language: ta
  text: தூய்மையானவர்களுக்கு எல்லாமே தூய்மையானவை; ஆனால் தீட்டுப்பட்டவர்களுக்கும் நம்பாதவர்களுக்கும்[a] எதுவுமே தூய்மையானதல்ல. மாறாக, அவர்களுடைய மனமும் மனச்சாட்சியும் தீட்டுப்பட்டிருக்கின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த வசனம் முழுவதிலும் ‘சுத்தம்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் சடங்குசார் தூய்மை, ஒழுக்கத் தூய்மை ஆகிய இரு பொருள் நிழல்களையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: எல்லாமே
  rationale: நடுநிலைப் பன்மை வடிவத்தின் விரிவான பொருளையும், வாக்கியத்தின் பழமொழி போன்ற வலியுறுத்தலையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: καθαρά / καθαρόν / καθαροῖς
  choice: தூய்மையானவை / தூய்மையானவர்களுக்கு
  rationale: καθαρός என்பதிலுள்ள சடங்குசார் தூய்மை மற்றும் ஒழுக்கத் தூய்மை ஆகிய இரு பொருள் நிழல்களையும் ‘தூய்மை’ தக்கவைக்கிறது.
- source_word: τοῖς δὲ μεμιαμμένοις
  choice: தீட்டுப்பட்டவர்களுக்கும்
  rationale: முன்னதாக ஏற்பட்ட மாசினால் தொடரும் நிலையைக் குறிக்கும் நிறைவுக்காலப் பங்கேற்பு வடிவத்தின் நிலைசார் வலிமையை இது வெளிப்படுத்துகிறது.
- source_word: ἀπίστοις
  choice: நம்பாதவர்களுக்கும்
  rationale: இச்சூழலில் நம்பிக்கையின்மையே முதன்மையான எதிர்மறை; ‘விசுவாசமற்றவர்கள்’ என்பதைவிட இது சாதாரண வாசகருக்கு நேரடியாகவும் இயல்பாகவும் உள்ளது.
- source_word: οὐδὲν καθαρόν
  choice: எதுவுமே தூய்மையானதல்ல
  rationale: முதல் கூற்றின் சொல் அமைப்பை எதிரொலிப்பதுடன் முழுமையான மறுப்பையும் வலியுறுத்துகிறது.
- source_word: ἀλλὰ
  choice: மாறாக
  rationale: வெளிப்புறப் பொருட்கள் அல்ல, அவர்களின் உள்ளார்ந்த நிலையே பிரச்சினை என்ற வலுவான எதிர்மறை விளக்கத் திருப்பைத் தெளிவாக்குகிறது.
- source_word: μεμίανται
  choice: தீட்டுப்பட்டிருக்கின்றன
  rationale: தீட்டுப்படுதல் நிகழ்ந்து அதன் விளைவு தொடர்ந்து நிலவுவதை நிறைவுக்கால வடிவத்துக்கு ஏற்றவாறு காட்டுகிறது.
- source_word: νοῦς
  choice: மனம்
  rationale: சிந்திக்கும் மற்றும் உணரும் திறனைக் குறிக்கும் இயல்பான, பரவலாகப் புரியக்கூடிய தமிழ்ச் சொல்.
- source_word: συνείδησις
  choice: மனச்சாட்சி
  rationale: நன்மை தீமையை உள்ளார்ந்து உணர்ந்து தீர்மானிக்கும் ஒழுக்க உணர்வுக்கான நிலையான தமிழாக்கம்.
- source_word: καὶ ... καὶ
  choice: மனமும் மனச்சாட்சியும்
  rationale: இணையான ‘உம்...உம்’ அமைப்பு இரண்டும் தீட்டுப்பட்டுள்ளன என்ற கிரேக்கத்தின் இரட்டை வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: தூய்மை மொழியின் பொருள் வரம்பு
  choice: καθαρός என்பதற்கு வசனம் முழுவதும் ‘தூய்மை’ சார்ந்த சொற்கள் பயன்படுத்தப்பட்டன.
  alternative: ‘சுத்தம்’ அல்லது ‘தீட்டில்லாதது’ என்று மொழிபெயர்த்து சடங்குசார் தூய்மையை முன்னிலைப்படுத்துதல்.
  rationale: உடனடிச் சூழலில் யூதச் சடங்கு விதிகள் தொடர்புடையவையாக இருந்தாலும், கூற்று மனிதரின் உள்ளார்ந்த ஒழுக்க நிலையையும் உள்ளடக்குகிறது. ‘தூய்மை’ இரு பரிமாணங்களையும் ஒன்றுக்குள் சுருக்காமல் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘தூய்மை’ மற்றும் ‘தீட்டு’ என்ற இணைச்சொற்கள் சடங்கு மற்றும் ஒழுக்கப் பொருள் நிழல்களைத் தக்கவைக்கின்றன.
