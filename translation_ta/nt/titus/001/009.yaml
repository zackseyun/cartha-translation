source:
  edition: SBLGNT
  text: ἀντεχόμενον τοῦ κατὰ τὴν διδαχὴν πιστοῦ λόγου, ἵνα δυνατὸς ᾖ καὶ παρακαλεῖν ἐν τῇ διδασκαλίᾳ τῇ ὑγιαινούσῃ καὶ τοὺς ἀντιλέγοντας ἐλέγχειν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/009.yaml
  text: holding firmly to the trustworthy word in accordance with the teaching[b][a], so that he may be able both to exhort by sound teaching and to rebuke those who contradict it.
translation:
  language: ta
  text: அவர் போதனைக்கு ஏற்ப அமைந்த நம்பத்தகுந்த செய்தியை உறுதியாகப் பற்றிக்கொண்டிருக்க வேண்டும்.[a] இதன்மூலம் அவர் ஆரோக்கியமான போதனையின் மூலம் அறிவுறுத்தவும், எதிர்த்துப் பேசுகிறவர்களைக் கண்டிக்கவும்[b] முடியும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “போதனைக்கு ஏற்ப அமைந்த உண்மையுள்ள வார்த்தையை உறுதியாகப் பற்றிக்கொண்டிருக்க வேண்டும்.”
    reason: πιστός என்பதற்கு ‘நம்பத்தகுந்த’ அல்லது ‘உண்மையுள்ள’ என்றும், λόγος என்பதற்கு ‘செய்தி’ அல்லது ‘வார்த்தை’ என்றும் இச்சூழலில் மொழிபெயர்க்கலாம்.
  - marker: b
    text: அல்லது, “எதிர்த்துப் பேசுகிறவர்கள் தவறென்று நிரூபிக்கவும்.”
    reason: ἐλέγχω என்பது கண்டிப்பதோடு, ஒருவரின் தவறை வெளிப்படுத்துவது அல்லது தவறென்று நிரூபிப்பது என்ற பொருளையும் தரலாம்.
lexical_decisions:
- source_word: ἀντεχόμενον
  choice: உறுதியாகப் பற்றிக்கொண்டிருக்க வேண்டும்
  rationale: இந்த நிகழ்காலப் பங்கேற்புவினை, தளராமல் தொடர்ந்து பற்றியிருப்பதைக் குறிக்கிறது. தமிழ் வாக்கியச் சூழலில் தலைவருக்குரிய தகுதியாக இயல்பாக அமைய ‘வேண்டும்’ சேர்க்கப்பட்டுள்ளது.
- source_word: πιστοῦ λόγου
  choice: நம்பத்தகுந்த செய்தி
  rationale: πιστός இங்கு நம்புவதைக் காட்டிலும் நம்பகத்தன்மையைக் குறிக்கிறது. λόγος என்பதன் கருத்து இச்சூழலில் அறிவிக்கப்பட்ட செய்தி என்பதால், நவீன தமிழில் தெளிவாக ‘செய்தி’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: κατὰ τὴν διδαχήν
  choice: போதனைக்கு ஏற்ப அமைந்த
  rationale: κατά இங்கு அங்கீகரிக்கப்பட்ட போதனையுடன் ஒத்துப்போவதைக் குறிக்கிறது; பொதுவான ஓர் அறிவுரையாகச் சுருக்கப்படவில்லை.
- source_word: παρακαλεῖν
  choice: அறிவுறுத்த
  rationale: மேய்ப்புப் பணியின் இச்சூழலில் παρακαλέω என்பது வெறும் ஆறுதலை அல்லாமல், மக்களை வலியுறுத்தி வழிநடத்துவதைக் குறிக்கிறது. ‘அறிவுறுத்த’ என்பது அதிகாரத்துடனான நேர்மறையான போதனையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν τῇ διδασκαλίᾳ τῇ ὑγιαινούσῃ
  choice: ஆரோக்கியமான போதனையால்
  rationale: ὑγιαίνω என்பதிலுள்ள ‘ஆரோக்கியம்’ என்ற உருவகத்தைப் பாதுகாத்து, ἐν என்பதைக் கருவி அல்லது வழிமுறையைக் குறிக்கும் ‘ஆல்’ என இயல்பாக வழங்குகிறது.
- source_word: ἀντιλέγοντας
  choice: எதிர்த்துப் பேசுகிறவர்கள்
  rationale: செய்திக்கோ போதனைக்கோ எதிராக வாய்மொழியாக மறுப்பவர்களை இந்தச் சொல் குறிக்கிறது. கிரேக்கத்தில் வெளிப்படையாக இல்லாத செயப்படுபொருளை முதன்மை உரையில் கட்டாயமாகச் சேர்க்கவில்லை.
- source_word: ἐλέγχειν
  choice: கண்டிக்க
  rationale: இந்த வினை தவறை வெளிப்படுத்துதல், தவறென நிரூபித்தல், திருத்தும் நோக்கில் கண்டித்தல் ஆகிய நுணுக்கங்களைக் கொண்டது. மேய்ப்புப் பணிக்குரிய திருத்தும் வலிமையை ‘கண்டிக்க’ வெளிப்படுத்துகிறது; ‘மறுத்து நிறுவ’ என்ற நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: δυνατὸς ᾖ
  choice: அவரால் முடியும்
  rationale: ἵνα உடன் வரும் நோக்கவாக்கியத்தில் திறன் அல்லது ஆற்றலைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: ‘போதனை’ மற்றும் ‘நம்பத்தகுந்த செய்தி’ என்பவற்றின் தொடர்பு
  choice: சபைத் தலைவரின் தனிப்பட்ட கருத்தை அல்ல, ஏற்கெனவே வழங்கப்பட்ட அங்கீகரிக்கப்பட்ட கிறிஸ்தவப் போதனைக்கு ஏற்ப அமைந்த செய்தியைக் குறிக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: பொதுவான ஒழுக்க அறிவுரை என்று கொள்ளுதல்
  rationale: διδαχή உடன் வரும் குறிப்புச் சுட்டும், மேய்ப்புத் திருமுகங்களிலுள்ள πιστὸς λόγος பயன்பாடும் நிலைபெற்ற போதனையைச் சுட்டுகின்றன; இருப்பினும் பிற்காலக் கோட்பாட்டு தொழில்நுட்பச் சொற்கள் இறக்குமதி செய்யப்படவில்லை.
- issue: எதிர்த்துப் பேசுகிறவர்களிடம் ἐλέγχειν செய்யும் செயல்
  choice: திருத்தும் மற்றும் நேரடியாக எதிர்கொள்ளும் வலிமையை ‘கண்டிக்க’ என வழங்குதல்
  alternative: மறுத்து நிறுவுதல்; தவறென நிரூபித்தல்
  rationale: வசனம் நேர்மறையான அறிவுறுத்தலையும் எதிர்ப்புக்கு எதிரான திருத்தத்தையும் இணைக்கிறது. சொல்லின் விவாதரீதியான ‘தவறென நிரூபித்தல்’ நுணுக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் அதேவேளையில் சபைத் தலைவர் தகுதிப் பட்டியலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆரோக்கியமான போதனை’ என்பது மூலத்தின் உடல்நல உருவகத்தை வேண்டுமென்றே பாதுகாக்கிறது.
