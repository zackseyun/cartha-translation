base_translation:
  language: en
  yaml_path: translation/nt/titus/001/003.yaml
  text: but in his own times he revealed his word through the proclamation with which I was entrusted[a], according to the command of God our Savior[c][b],
translation:
  language: ta
  text: ஆனால், தமக்குரிய காலங்களில்[a] தமது வார்த்தையை அவர் ஓர் அறிவிப்பின் மூலம்[b] வெளிப்படுத்தினார்; நம் மீட்பரான கடவுளின் கட்டளையின்படி அந்த அறிவிப்பு என்னிடம் ஒப்படைக்கப்பட்டது.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தமக்குரிய காலங்களில்’ என்பதை ‘உரிய காலங்களில்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் சொல்லுக்கு சொல் ‘அவருக்குரிய காலங்களில்’ என்று உள்ளது; இது கடவுள் குறித்த காலங்களைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அறிவிப்பின் மூலம்’ என்பதை ‘அறிவித்தலின் மூலம்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் அறிவிக்கும் செயலையோ அறிவிக்கப்பட்ட செய்தியையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: இந்தத் தொடர்புத் தொடரை ‘தமது வார்த்தையை ... என்னிடம் ஒப்படைத்தார்’ என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐφανέρωσεν
  choice: வெளிப்படுத்தினார்
  rationale: முன்பு மறைந்திருந்ததை வெளிப்படையாக அறியச் செய்தார் என்ற பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; முந்தைய சூழலிலிருந்து கடவுளே எழுவாயாக உள்ளார்.
- source_word: καιροῖς ἰδίοις
  choice: தமக்குரிய காலங்களில்
  rationale: கிரேக்கப் பன்மையையும் ἰδίοις என்பதன் உடைமை நுணுக்கத்தையும் காக்கிறது; கடவுள் குறித்த காலங்கள் என்ற கருத்தை மொழிபெயர்ப்பிலேயே மிகையாக விளக்கவில்லை.
- source_word: τὸν λόγον αὐτοῦ
  choice: தமது வார்த்தையை
  rationale: λόγος என்பதுடனான சொல் தொடர்பைக் காத்து, இங்கு கடவுள் தெரிவித்த செய்தியைக் குறிக்கிறது. மரியாதை ஒருமையான ‘தமது’ கடவுளையே சுட்டுகிறது.
- source_word: ἐν κηρύγματι
  choice: ஓர் அறிவிப்பின் மூலம்
  rationale: ἐν என்பதன் கருவிப்பொருளைத் தெரிவிக்கிறது. ‘அறிவிப்பு’ என்பது அறிவிக்கும் செயலையும் அறிவிக்கப்பட்ட செய்தியையும் சுட்டக்கூடியதால் κήρυγμα என்பதன் பொருள் விரிவை ஓரளவு காக்கிறது.
- source_word: ὃ
  choice: அந்த அறிவிப்பு
  rationale: அருகிலுள்ள நடுநிலை ஒருமைச் சொல்லான κήρυγμα-ஐ இயல்பான முன்னோடியாகக் கொண்டு, தமிழில் தொடர்பைத் தெளிவாக வெளிப்படுத்துகிறது; வேறு தொடர்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἐπιστεύθην
  choice: என்னிடம் ஒப்படைக்கப்பட்டது
  rationale: இந்தச் செயப்பாட்டு வடிவம் ‘நான் நம்பினேன்’ என்று அல்லாமல், பொறுப்பாக ஒன்று பவுலிடம் ஒப்படைக்கப்பட்டது என்று பொருள்படுகிறது.
- source_word: κατ’ ἐπιταγὴν
  choice: கட்டளையின்படி
  rationale: அதிகாரபூர்வமான கட்டளைக்கு ஏற்ப அல்லது அதன் அடிப்படையில் நிகழ்ந்தது என்ற κατά + வேற்றுமைத் தொடரின் பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: நம் மீட்பரான கடவுளின்
  rationale: σωτήρ என்பதை இயல்பான தமிழில் ‘மீட்பர்’ என்ற பட்டமாகக் கொடுத்து, கடவுளே நம் மீட்பர் என்ற இணைப்பையும் காக்கிறது.
theological_decisions:
- issue: ἐφανέρωσεν என்பதன் மறைந்துள்ள எழுவாயும் καιροῖς ἰδίοις என்பதிலுள்ள உடைமை நுணுக்கமும்
  choice: கடவுளை எழுவாயாகக் கொண்டு, ‘தமக்குரிய காலங்களில் ... அவர் ... வெளிப்படுத்தினார்’ என்று மொழிபெயர்த்தல்
  alternative: ‘உரிய காலங்களில் அது வெளிப்படுத்தப்பட்டது’ என்ற எழுவாயற்ற வாசிப்பு
  rationale: முந்தைய வசனச் சூழலில் வாக்குறுதி அளித்த கடவுளே இங்கு அதை வெளிப்படுத்துகிறார். இவ்வாசிப்பு ἰδίοις என்பதன் உடைமை நுணுக்கத்தையும் கருத்தோட்டத்தையும் காக்கிறது.
- issue: ὃ என்ற தொடர்புப்பெயரின் முன்னோடி
  choice: அது ‘அறிவிப்பு’ (κήρυγμα) என்பதைக் குறிக்கிறது
  alternative: 'அது ‘தமது வார்த்தை’ (λόγος) என்பதைக் குறிக்கிறது: ‘தமது வார்த்தையை ... என்னிடம் ஒப்படைத்தார்’'
  rationale: இலக்கண ரீதியாக அருகிலுள்ள பொருத்தமான முன்னோடி κήρυγμα. எனினும் λόγος என்பதோடு இணைக்கும் வாசிப்பும் சாத்தியமாதலால் அது அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலைத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘அறிவிப்பு’ என்ற சொல் செயல்/செய்தி இருபொருள் வாய்ப்பையும் வைத்திருக்கிறது; அரிதான சமயக் கலைச்சொற்கள் தவிர்க்கப்பட்டுள்ளன.
