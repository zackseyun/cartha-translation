source:
  edition: SBLGNT
  text: εἶπέν τις ἐξ αὐτῶν, ἴδιος αὐτῶν προφήτης, Κρῆτες ἀεὶ ψεῦσται, κακὰ θηρία, γαστέρες ἀργαί·
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/012.yaml
  text: One of them[a], their own prophet, said, “Cretans are always liars, evil beasts, lazy gluttons.”
translation:
  language: ta
  text: அவர்களில் ஒருவன், அவர்களுடைய சொந்தத் தீர்க்கதரிசி, “கிரேத்தர்கள் எப்போதும் பொய்யர்கள், கொடிய மிருகங்கள், சோம்பேறிப் பெருந்தீனிக்காரர்கள்[a]” என்று கூறினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “சோம்பேறி வயிறுகள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπέν τις ἐξ αὐτῶν
  choice: அவர்களில் ஒருவன் ... கூறியிருக்கிறான்
  rationale: τις ἐξ αὐτῶν என்பதிலுள்ள வரையறுக்கப்படாத ஒருவரையும், அந்தக் குழுவைச் சேர்ந்தவர் என்ற பகுதி சார்ந்த பொருளையும் இயல்பான தமிழில் தருகிறது. மேற்கோள் இங்கு தொடர்ந்து பொருத்தமுள்ள சான்றாக எடுத்தாளப்படுவதால், தமிழ் நடையில் ‘கூறியிருக்கிறான்’ இயல்பாக உள்ளது.
- source_word: ἴδιος αὐτῶν προφήτης
  choice: அவர்களுடைய சொந்தத் தீர்க்கதரிசி
  rationale: ἴδιος வலியுறுத்தும் ‘அவர்களுக்கே உரியவர்’ என்ற கருத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: Κρῆτες
  choice: கிரேத்தர்கள்
  rationale: கிரேத்து தீவைச் சேர்ந்த மக்களைக் குறிக்கும் இனப்பெயரின் வழக்கமான தமிழ் வடிவம்.
- source_word: ἀεὶ ψεῦσται
  choice: எப்போதும் பொய்யர்கள்
  rationale: ἀεί என்பதன் நேரடியான ‘எப்போதும்’ என்ற பொருளையும் ψεῦσται என்பதன் ‘பொய்யர்கள்’ என்ற குற்றச்சாட்டையும் அப்படியே தருகிறது.
- source_word: κακὰ θηρία
  choice: கொடிய மிருகங்கள்
  rationale: θηρία என்பதன் மிருக உருவகத்தைப் பாதுகாத்து, κακά இங்கு தரும் தீய/அபாயகரமான பண்பை இயல்பான தமிழில் ‘கொடிய’ என வெளிப்படுத்துகிறது.
- source_word: γαστέρες ἀργαί
  choice: சோம்பேறிப் பெருந்தீனிக்காரர்கள்
  rationale: சொல்லுக்குச் சொல் ‘சோம்பேறி வயிறுகள்’; சூழலில் உழைக்காமல் உண்பதில் நாட்டமுள்ளவர்களை இழிவாகக் குறிக்கிறது. ‘பெருந்தீனிக்காரர்கள்’ அந்தச் சொற்றொடரின் நோக்கத்தை நவீன வாசகருக்குத் தெளிவாக்குகிறது; நேரடி உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: பவுல் மேற்கோளிடும் இனக்குழுவைப் பற்றிய கடுமையான பொதுமைப்படுத்தல்
  choice: இதை அவர்களுடைய சொந்தத் தீர்க்கதரிசியின் மேற்கோளாகத் தெளிவாகக் காட்டி, அதன் கடுமையான மொழியை மென்மையாக்காமல் மொழிபெயர்த்தல்
  alternative: எதிர்மறையான இனப் பொதுமைப்படுத்தலைத் தணித்து மறுவடிவமைத்தல்
  rationale: கிரேக்க உரை இதை நேரடியான கூற்றாக அல்ல, மேற்கோளாக முன்வைக்கிறது. ஆகவே மேற்கோள் அமைப்பையும் அதன் சொல்லாற்றல் சார்ந்த பதற்றத்தையும் பாதுகாக்க வேண்டும்; அதேவேளையில் உரையில் இல்லாத நிரந்தரமான மானிடவியல் அல்லது இனவியல் கோட்பாட்டைச் சேர்க்கக்கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தீர்க்கதரிசி’ என்பது பரவலாக அறியப்படும் வேதாகமச் சொல். மேற்கோளின் கடுமை பாதுகாக்கப்பட்டுள்ளது; ‘கொடிய மிருகங்கள்’ மற்றும் ‘சோம்பேறிப் பெருந்தீனிக்காரர்கள்’ இழிவான உருவகங்களாகவே வாசிக்கப்படுகின்றன.
