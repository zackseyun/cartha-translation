  text: not paying attention to Jewish myths and commandments of people who turn away from the truth[a].
translation:
  language: ta
  text: யூதக் கட்டுக்கதைகளுக்கும் உண்மையை விட்டு விலகுகிற மனிதர்களின் கட்டளைகளுக்கும் செவி கொடுக்காதபடி.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதக் கட்டுக்கதைகளுக்கும் உண்மையை விட்டு விலகுகிறவர்களிடமிருந்து வரும் மனிதக் கட்டளைகளுக்கும் தங்களை அர்ப்பணிக்காதபடி.”
    reason: μὴ προσέχοντες என்பதற்கு சூழலுக்கு ஏற்ப ‘தங்களை அர்ப்பணிக்காதபடி’ என்ற மாற்று மொழிபெயர்ப்பும் சாத்தியம். ἀποστρεφομένων என்பதை ἀνθρώπων என்பதோடு இணைத்து, அந்த மனிதர்களே உண்மையை விட்டு விலகுகிறவர்கள் என இந்த மாற்று அமைப்பு வெளிப்படுத்துகிறது.
lexical_decisions:
- source_word: μὴ προσέχοντες
  choice: செவிகொடுக்காமல் இருக்க வேண்டும்
  rationale: προσέχω என்பது மனத்தைக் குறிப்பிட்ட ஒன்றின்மேல் செலுத்துதல், கவனம் கொடுத்தல் என்ற பொருளுடையது. முந்தைய வசனத்தின் அறிவுறுத்தலைத் தொடரும் இப்பங்கேற்பு வடிவத்தைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘செவிகொடுக்காமல் இருக்க வேண்டும்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: Ἰουδαϊκοῖς μύθοις
  choice: யூதக் கட்டுக்கதைகள்
  rationale: μῦθος புனையப்பட்ட கதைகள் அல்லது ஆதாரமற்ற மரபுக்கதைகளைக் குறிக்கிறது; ‘கட்டுக்கதைகள்’ என்பது அதன் எதிர்மறை நுண்ணுணர்வை நவீனத் தமிழில் தெளிவாகத் தருகிறது. Ἰουδαϊκοῖς அவை யூத இயல்பு அல்லது தோற்றம் கொண்டவை என்பதைக் குறிக்கிறது.
- source_word: ἐντολαῖς ἀνθρώπων
  choice: மனிதர்களின் கட்டளைகள்
  rationale: ἐντολαῖς என்பது கட்டளைகள்; ἀνθρώπων என்பது மனிதர்கள் என்பதன் பன்மை உடைமை வடிவம். இந்த மொழிபெயர்ப்பு, அவை இறை கட்டளைகள் அல்லாமல் மனிதர்களிடமிருந்து வந்தவை என்ற வேறுபாட்டைத் தேவையின்றி விரிவுபடுத்தாமல் காக்கிறது.
- source_word: ἀποστρεφομένων
  choice: விலகுகிற
  rationale: ἀποστρέφω என்பதிலுள்ள திரும்பிவிடுதல் அல்லது விலகுதல் என்ற உருவகத்தை ‘விலகுகிற’ காக்கிறது. நிகழ்காலப் பங்கேற்பின் தொடர்ச்சியான செயல் நுண்ணுணர்வும் இதில் உள்ளது.
- source_word: τὴν ἀλήθειαν
  choice: உண்மை
  rationale: ἀλήθεια என்பதற்கான நேரான, இயல்பான தமிழ் இணை. இங்கு அது நற்செய்தியின் உண்மையை உள்ளடக்கக்கூடும்; எனினும் மூலத்தில் இல்லாத விளக்கத்தை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
theological_decisions:
- issue: ἀποστρεφομένων என்ற உடைமைப் பன்மைப் பங்கேற்பின் தொடர்பு
  choice: ‘உண்மையைவிட்டு விலகுகிற மனிதர்களின் கட்டளைகள்’ என்று, பங்கேற்பை ‘மனிதர்கள்’ என்பதோடு இணைத்தல்
  alternative: உண்மையைவிட்டு விலகியவர்களுடன் தொடர்புடைய ‘யூதக் கட்டுக்கதைகள்’ மற்றும் ‘மனிதக் கட்டளைகள்’ ஆகிய இரண்டையும் இது தளர்வாக விவரிப்பதாகப் புரிந்துகொள்ளலாம்.
  rationale: ἀποστρεφομένων மற்றும் ἀνθρώπων இரண்டும் உடைமைப் பன்மையில் இருப்பதால், அருகிலுள்ள ‘மனிதர்கள்’ என்பதோடு இணைப்பதே இலக்கணரீதியாக மிகவும் இயல்பானது. அதற்கு மேல் ஒரு குறிப்பிட்ட கோட்பாட்டை உரைக்குள் இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. ‘புராணங்கள்’ என்பதற்குப் பதில் ‘கட்டுக்கதைகள்’ பயன்படுத்தப்பட்டது; முன்னது தமிழில் மதச்சார்ந்த தனிப்பட்ட தொடர்புகளைத் தூண்டக்கூடும். அடிக்குறி குறியீடு பிரதான உரையில் சேர்க்கப்பட்டுள்ளது.
