revisions:
- from: யூதக் கட்டுக்கதைகளுக்கும், உண்மையைவிட்டு விலகுகிற மனிதர்களின் கட்டளைகளுக்கும் செவிகொடுக்காமல் இருக்க வேண்டும்.[a]
  to: யூதக் கட்டுக்கதைகளுக்கும் உண்மையை விட்டு விலகுகிற மனிதர்களின் கட்டளைகளுக்கும் செவி கொடுக்காதபடி.[a]
