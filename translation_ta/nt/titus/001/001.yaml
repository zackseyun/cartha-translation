    issue: 'ἐπίγνωσιν is rendered as a verbal infinitive/process: “சத்தியத்தை அறிந்துகொள்வதற்காகவும்.”'
    rationale: Greek has the coordinated noun phrase κατὰ πίστιν ... καὶ ἐπίγνωσιν, “for/toward faith ... and knowledge.” Rendering it as “for coming to know” loses the nominal parallel with “விசுவாசத்திற்காகவும்” and introduces a process nuance not explicit in the source.
