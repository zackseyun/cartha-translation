  alternative: தேவபக்திக்கு வழிநடத்தும் சத்தியம்
  rationale: முதன்மை வாசிப்பு ஒத்திசைவைப் பாதுகாக்கிறது; விளைவு அல்லது நோக்கத்தை வலியுறுத்தும் வாசிப்பும் சாத்தியமாதலால் அது அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வேதாகமக் கடித நடையும் காக்கப்பட்டுள்ளன. ‘அடிமை’ மூலச்சொல்லின் வலிமையைத் தணிக்காமல் தருகிறது; ‘அப்போஸ்தலன்,’ ‘விசுவாசம்,’ ‘சத்தியம்,’ ‘தேவபக்தி’ ஆகியவை பொதுவாகப் புரியக்கூடிய நிலைபெற்ற சொற்கள். மூலவாக்கியம் அடுத்த வசனத்திற்குத் தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
