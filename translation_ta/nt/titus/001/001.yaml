  rationale: சுருக்கமான கிரேக்கத் தொடரில் நோக்கம், திசை, அல்லது ஒத்திசைவு ஆகிய நிழற்பொருள்கள் இருக்கலாம். முதன்மை உரை சாத்தியமான பணிநோக்கு வாசிப்பை அளிக்கிறது; மாற்று இலக்கண உறவை இறுதியானதாகக் கட்டாயப்படுத்தவில்லை.
- issue: κατ’ εὐσέβειαν என்பதன் சத்தியத்துடனான உறவு
