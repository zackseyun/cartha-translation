  text: Εἰσὶν γὰρ πολλοὶ ⸀καὶ ἀνυπότακτοι, ματαιολόγοι καὶ φρεναπάται, μάλιστα οἱ ἐκ ⸀τῆς περιτομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/010.yaml
  text: For there are many rebellious people[a], empty talkers and deceivers, especially those of the circumcision,
translation:
  language: ta
  text: ஏனெனில், அடங்க மறுப்பவர்களும் வீண்பேச்சுக்காரர்களும் மனங்களை ஏமாற்றுகிறவர்களுமாகப் பலர் இருக்கிறார்கள்; அவர்களில் குறிப்பாக விருத்தசேதனத்தைச் சார்ந்தவர்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விருத்தசேதனக் குழுவைச் சேர்ந்தவர்கள்,” அல்லது “விருத்தசேதனத்திலிருந்து வந்தவர்கள்.” இத்தொடர் யூதர்களையோ யூத முறைமைகளை வலியுறுத்திய எதிர்ப்பாளர்களையோ குறிக்கக்கூடும்; ஆனால் கிரேக்கத்தில் அது இவ்வளவு வெளிப்படையாக இல்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட அறிவுறுத்தலுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πολλοὶ
  choice: பலர்
  rationale: மனிதர்களைக் குறிக்கும் பெயரடை இங்கு பெயர்ச்சொல்லாகப் பயன்படுவதால், ‘பலர்’ என்பது சுருக்கமானவும் இயல்பானவும் உள்ள இணை.
- source_word: ἀνυπότακτοι
  choice: அடங்க மறுப்பவர்கள்
  rationale: உரிய அதிகாரத்திற்குக் கீழ்ப்படிய மறுக்கும் கருத்தைத் தெளிவாகக் காட்டுகிறது; ‘கலகக்காரர்கள்’ என்பதைக் காட்டிலும் மூலச்சொல்லின் பொருளுக்கு நெருக்கமானது.
- source_word: ματαιολόγοι
  choice: வீண்பேச்சுக்காரர்கள்
  rationale: பயனற்ற அல்லது வெறுமையானவற்றைப் பேசுகிறவர்களைக் குறிக்கும் கூட்டு சொல்லின் எதிர்மறை மதிப்பீட்டை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: φρεναπάται
  choice: மனங்களை ஏமாற்றுகிறவர்கள்
  rationale: மனத்தையோ சிந்தனையையோ ஏமாற்றி வழிதவறச் செய்பவர்கள் என்ற மூலச்சொல்லின் குறிப்பான நுணுக்கத்தை வெளிப்படுத்துகிறது.
- source_word: μάλιστα
  choice: குறிப்பாக
  rationale: பெரிய தொகுதிக்குள் சிறப்பு கவனம் பெறும் ஒரு பிரிவைச் சுட்டுகிறது.
- source_word: οἱ ἐκ τῆς περιτομῆς
  choice: விருத்தசேதனத்தைச் சார்ந்தவர்கள்
  rationale: ‘விருத்தசேதனத்திலிருந்து/விருத்தசேதனத்தைச் சேர்ந்தவர்கள்’ என்ற சுருக்கமான கிரேக்கத் தொடரை, ‘யூதர்கள்’ அல்லது ஒரு குறிப்பிட்ட ‘கட்சி’ என்று வெளிப்படையாகக் குறுக்காமல் தமிழில் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘விருத்தசேதனத்தைச் சார்ந்தவர்கள்’ என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘விருத்தசேதனத்தைச் சார்ந்தவர்கள்’ என்று வெளிப்படையாக அல்லாத வடிவில் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘விருத்தசேதனக் குழுவைச் சேர்ந்தவர்கள்’ அல்லது ‘யூதப் பின்னணியிலிருந்து வந்தவர்கள்’
  rationale: இத்தொடர் யூதர்களையோ யூத வழக்கங்களைக் கட்டாயப்படுத்திய எதிர்ப்பாளர்களையோ குறிக்கலாம். ஆனால் கிரேக்கம் ‘குழு’, ‘கட்சி’, அல்லது ‘யூதர்கள்’ என்று வெளிப்படையாகச் சொல்லாததால், வரலாற்றுக் குறிப்பை தேவையின்றி குறுக்காமல் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அடங்க மறுப்பவர்கள்’ என்பது அதிகாரத்திற்குக் கீழ்ப்படியாமையைத் தெளிவாகக் காட்டுகிறது; ‘மனங்களை ஏமாற்றுகிறவர்கள்’ என்பது φρεναπάται என்பதிலுள்ள மனம்/சிந்தனை சார்ந்த நுணுக்கத்தைப் பாதுகாக்கிறது. இறுதியில் ‘அப்படிப்பட்டவர்கள்’ என்பது தமிழில் இயல்பான வாக்கிய நிறைவிற்காகச் சேர்க்கப்பட்டுள்ளது; புதிய கருத்தைச் சேர்ப்பதில்லை.
