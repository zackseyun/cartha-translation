id: TIT.1.13
reference: Titus 1:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἡ μαρτυρία αὕτη ἐστὶν ἀληθής. δι’ ἣν αἰτίαν ἔλεγχε αὐτοὺς ἀποτόμως, ἵνα ὑγιαίνωσιν ἐν τῇ πίστει,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/013.yaml
  text: This testimony is true. For this reason[a], rebuke them sharply, so that they may be sound in the faith,
translation:
  language: ta
  text: இந்தச் சாட்சி உண்மையானது. இந்தக் காரணத்தினால், அவர்கள் விசுவாசத்தில்[a] நல்நிலையில் இருக்கும்படி அவர்களைக் கடுமையாகக் கண்டி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “விசுவாசத்தில்” என்பது கிறிஸ்தவ விசுவாசத்தின் போதனைகளில் நல்நிலையில் இருப்பதையோ, தங்கள் விசுவாசத்தில் நலமாக இருப்பதையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρία
  choice: சாட்சி
  rationale: முந்தைய வசனத்தில் மேற்கோள் காட்டப்பட்ட கூற்றைச் சான்றளிக்கும் அறிக்கையாகக் குறிக்கிறது; தமிழில் “சாட்சி” அதன் ஆதாரத் தன்மையைப் பாதுகாக்கிறது.
- source_word: ἀληθής
  choice: உண்மையானது
  rationale: அந்தச் சாட்சி நிகழ்நிலைக்கு ஒத்தது என்பதை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: δι’ ἣν αἰτίαν
  choice: இந்தக் காரணத்தினால்
  rationale: முந்தைய கூற்றிலிருந்து வரும் காரணவியல் முடிவைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἔλεγχε
  choice: கண்டித்துத் திருத்து
  rationale: தவறை நேரடியாக எதிர்கொண்டு திருத்தும் கட்டளையின் இரு கூறுகளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; வெறும் தண்டனையாகப் பொருள்படுவதைத் தவிர்க்கிறது.
- source_word: ἀποτόμως
  choice: கடுமையாக
  rationale: கண்டிப்பின் தீவிரத்தையும் கூர்மையையும் தெரிவிக்கிறது; தண்டனை சார்ந்த மிகைப்படுத்தலைத் தவிர்க்கிறது.
- source_word: ὑγιαίνωσιν
  choice: சீரானவர்களாக இருக்கும்படி
  rationale: உடல்நலச் சொல்லின் உருவகப் பொருளான நலமான, குறைபாடற்ற நிலையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἐν τῇ πίστει
  choice: விசுவாசத்தில்
  rationale: ஒருவரின் நம்பிக்கையையோ கிறிஸ்தவ விசுவாசத்தின் உள்ளடக்கத்தையோ குறிக்கக்கூடிய மூலமொழியின் தெளிவின்மையைத் தமிழ் முதன்மைப் பாடத்தில் திறந்தவாறே வைக்கிறது.
theological_decisions:
- issue: ἐν τῇ πίστει என்பதன் பொருள்
  choice: விசுவாசத்தில்
  alternative: கிறிஸ்தவ விசுவாசத்தில்; தங்கள் விசுவாசத்தில்
  rationale: சூழல் பொய்ப் போதனையையும் சரியான போதனையையும் பற்றியதால் கிறிஸ்தவ விசுவாசத்தின் உள்ளடக்கம் சாத்தியமான பொருள். இருப்பினும், சொற்றொடர் அவர்களுடைய விசுவாச நிலையின் நலத்தையும் குறிக்கலாம்; ஆகவே முதன்மைப் பாடம் இரண்டையும் அனுமதித்து, அடிக்குறிப்பு தெளிவின்மையை விளக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. “கண்டித்துத் திருத்து” என்பது ἔλεγχε என்பதன் நேரடி எதிர்கொள்ளுதலையும் திருத்தும் நோக்கத்தையும் இணைக்கிறது; “சீரானவர்களாக” என்பது ὑγιαίνωσιν என்பதன் உருவக நலத்தைக் கடினமான சமயச் சொற்கள் இன்றித் தெரிவிக்கிறது.
