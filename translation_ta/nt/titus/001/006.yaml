id: TIT.1.6
reference: Titus 1:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἴ τίς ἐστιν ἀνέγκλητος, μιᾶς γυναικὸς ἀνήρ, τέκνα ἔχων πιστά, μὴ ἐν κατηγορίᾳ ἀσωτίας ἢ ἀνυπότακτα.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/006.yaml
  text: if anyone is above reproach[a], the husband of one wife[c][b], having faithful children not under accusation of debauchery or insubordinate.
translation:
  language: ta
  text: ஒருவன் குற்றஞ்சாட்ட இடமில்லாதவனாகவும், ஒரே மனைவியின் கணவனாகவும்[b], நம்பிக்கைக்குரிய பிள்ளைகளையுடையவனாகவும்[a], அவன் பிள்ளைகள் ஒழுக்கங்கெட்ட வாழ்க்கை[c] குறித்த குற்றச்சாட்டுக்கு உட்பட்டவர்களாகவோ கீழ்ப்படியாதவர்களாகவோ இல்லாதவர்களாகவும் இருந்தால்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விசுவாசிகளான பிள்ளைகள்.” கிரேக்கச் சொல் “நம்பிக்கைக்குரியவர்கள்” அல்லது “விசுவாசிகள்” என்று பொருள்படலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “ஒரே பெண்ணுக்கு உண்மையுள்ளவன்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “கட்டுப்பாடற்ற வாழ்க்கை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέγκλητος
  choice: குற்றஞ்சாட்ட இடமில்லாதவன்
  rationale: எந்தக் குறையும் இல்லாத முழுமையானவன் என்ற பொருளைத் தரக்கூடிய சொல்லைத் தவிர்த்து, நியாயமாகக் குற்றஞ்சாட்டுவதற்கு இடமில்லாதவன் என்ற கிரேக்கச் சொல்லின் கருத்தை இயல்பான தமிழில் தருகிறது.
- source_word: μιᾶς γυναικὸς ἀνήρ
  choice: ஒரே மனைவியின் கணவன்
  rationale: கிரேக்கச் சொற்றொடரின் வடிவத்தை வெளிப்படையாகப் பாதுகாத்து, திருமண நிலை, பாலியல் உண்மைத்தன்மை, மறுமணம் ஆகியவற்றைப் பற்றிய விவாதத்துக்குரிய முடிவுகளை மொழிபெயர்ப்பில் திணிக்காமல் விடுகிறது.
- source_word: τέκνα
  choice: பிள்ளைகள்
  rationale: குடும்பத்தைப் பற்றிய இந்தச் சூழலில் இயல்பாகவும் பரவலாகவும் புரிந்துகொள்ளப்படும் நவீனத் தமிழ்ச் சொல்.
- source_word: πιστά
  choice: நம்பிக்கைக்குரிய
  rationale: நம்பத்தக்கவர் அல்லது உண்மையுள்ளவர் என்ற பொருளை முதன்மை உரையில் தருகிறது; ‘விசுவாசிகளான’ என்ற சாத்தியமான சமயப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐν κατηγορίᾳ
  choice: குற்றஞ்சாட்டப்பட்டவர்கள்
  rationale: ஒழுக்கக்கேட்டைப் பற்றிய குற்றச்சாட்டுக்கு உட்பட்டிருப்பது என்ற நீதித்துறைத் தொனியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀσωτίας
  choice: ஒழுக்கங்கெட்ட வாழ்க்கை
  rationale: வீணான, கட்டுப்பாடற்ற, ஒழுக்க வரம்புகளை மீறிய நடத்தை என்ற கருத்தை சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான தமிழில் தருகிறது.
- source_word: ἀνυπότακτα
  choice: கீழ்ப்படியாதவர்கள்
  rationale: உரிய ஒழுங்கிற்கோ அதிகாரத்திற்கோ தம்மை உட்படுத்த மறுப்பதை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: τέκνα ἔχων πιστά என்பதில் πιστά என்பதன் பொருள்
  choice: நம்பிக்கைக்குரிய பிள்ளைகள்
  alternative: விசுவாசிகளான பிள்ளைகள்
  rationale: πιστά என்பது இங்கு நடத்தை சார்ந்த நம்பகத்தன்மையையோ கிறிஸ்தவ விசுவாசத்தையோ குறிக்கலாம். இந்த உண்மையான இருபொருள் வாய்ப்பைத் தீர்மானித்துவிடாமல், மாற்றுப் பொருளை அடிக்குறிப்பில் தருகிறது.
- issue: μιᾶς γυναικὸς ἀνήρ என்பதன் வலிமை
  choice: ஒரே மனைவியின் கணவன்
  alternative: ஒரே பெண்ணுக்கு உண்மையுள்ளவன்
  rationale: முதன்மை மொழிபெயர்ப்பு கிரேக்கச் சொற்றொடரின் திருமணச் சொல்லாட்சியைப் பாதுகாக்கிறது; மாற்று மொழியாக்கம் அதன் சாத்தியமான பண்புநலத் தொனியைக் காட்டுகிறது. இதனால் குறிப்பிட்ட சபைப் பிரிவின் திருமணம் அல்லது மறுமணம் குறித்த விளக்கத்தை உரையில் திணிப்பது தவிர்க்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் ஒரே நிபந்தனை வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாக அமைக்கப்பட்டுள்ளது; இரண்டாம் வாக்கியத்தில் ‘அவன் பிள்ளைகள்’ என்பது கிரேக்கத்தில் உள்ள பன்மை உரிச்சொற்களின் தொடர்பை வெளிப்படையாக்குகிறது.
