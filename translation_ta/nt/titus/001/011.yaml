base_translation:
  language: en
  yaml_path: translation/nt/titus/001/011.yaml
  text: They must be silenced[c][b][a], since they are upsetting whole households by teaching what they ought not for the sake of shameful gain.
translation:
  language: ta
  text: அவர்களுடைய வாயை அடைக்க வேண்டும்[a]. ஏனெனில், இழிவான ஆதாயத்திற்காக[b] கற்பிக்கக்கூடாதவற்றைக் கற்பித்து, முழுக் குடும்பங்களையும்[c] அவர்கள் சீர்குலைக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களை மௌனமாக்க வேண்டும்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வெட்கக்கேடான லாபத்திற்காக.”
    reason: lexical_alternative
  - marker: c
    text: “குடும்பங்கள்” என்பது வீடு என்னும் கட்டடங்களை மட்டும் அல்லாமல், வீட்டாரையும் அவர்களைச் சார்ந்திருப்போரையும் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: οὓς δεῖ ἐπιστομίζειν
  choice: அவர்களுடைய வாயை அடைக்க வேண்டும்
  rationale: ἐπιστομίζειν என்பதன் நேரடியான உருவகம் ‘வாயை அடைத்தல்’; இங்கு அவர்களின் தீங்கான போதனையைத் தடுத்து நிறுத்த வேண்டிய அவசியத்தை இது வலிமையாகவும் இயல்பான தமிழிலும் தெரிவிக்கிறது. எந்தத் தண்டனை முறையையும் உரை குறிப்பிடாததால் அதனைச் சேர்க்கவில்லை.
- source_word: οἵτινες
  choice: ஏனெனில் ... அவர்கள்
  rationale: இந்த உறவுப்பெயர் முன் கூறிய கட்டளைக்கான காரணத்தை விளக்குகிறது; தமிழில் ‘ஏனெனில்’ என்பது அந்த விளக்கத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ὅλους οἴκους
  choice: குடும்பங்களையே
  rationale: οἶκος இச்சூழலில் கட்டடங்களை மட்டும் அல்லாமல் வீட்டாரையும் சார்ந்திருப்போரையும் உள்ளடக்கிய குடும்ப அலகைக் குறிக்கிறது; -ஏ விகுதி ὅλους என்பதன் முழுமையான தாக்கத்தை இயல்பாக எடுத்துரைக்கிறது.
- source_word: ἀνατρέπουσιν
  choice: சீர்குலைக்கிறார்கள்
  rationale: இந்த வினை கவிழ்த்தல், நிலைகுலையச் செய்தல், பாழாக்குதல் ஆகிய பொருள் எல்லைகளைக் கொண்டது. ‘சீர்குலைக்கிறார்கள்’ குடும்பங்களின் ஒழுங்கைத் தீவிரமாகக் குலைப்பதைத் தெரிவிக்கிறது; முற்றிலும் அழிப்பதாக மிகைப்படுத்துவதில்லை.
- source_word: διδάσκοντες ἃ μὴ δεῖ
  choice: கற்பிக்கக்கூடாதவற்றைக் கற்பித்து
  rationale: பங்கேற்புவினை குடும்பங்கள் சீர்குலைக்கப்படும் வழிமுறையைச் சுட்டுகிறது. μὴ δεῖ தகாத அல்லது அனுமதிக்கப்படாத போதனைப் பொருளைக் குறிப்பதால் இந்தத் தமிழ் அமைப்பு இயல்பாக உள்ளது.
- source_word: αἰσχροῦ κέρδους χάριν
  choice: இழிவான ஆதாயத்திற்காக
  rationale: αἰσχρός ஒழுக்கரீதியாக வெட்கக்கேடான அல்லது இழிவான தன்மையையும் κέρδος ஆதாயத்தையும் குறிக்கிறது. நோக்கத்தைக் காட்டும் χάριν என்பதற்கு ‘-க்காக’ பொருந்துகிறது.
theological_decisions:
- issue: பொய்ப் போதகர்களுக்கு எதிரான கட்டளையின் தன்மை
  choice: அவர்களுடைய வாயை அடைக்க வேண்டும்
  alternative: அவர்களைப் பேசவிடாமல் தடுக்க வேண்டும்
  rationale: கிரேக்கச் சொற்றொடரின் வலிமையான ‘வாயை அடைத்தல்’ உருவகத்தைத் தக்கவைத்துள்ளது. நோக்கம் அவர்களின் தீங்கான போதனையை நிறுத்துவது; அதற்கான குடிமை, உடல் அல்லது தண்டனை முறையை மூலவுரை குறிப்பிடாததால் மொழிபெயர்ப்பும் ஒன்றை நிர்ணயிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வாயை அடைக்க வேண்டும்’ என்ற மூல உருவகம் தக்கவைக்கப்பட்டு அடிக்குறிப்பில் அதன் சூழல்சார் பொருள் விளக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்பு வரிசையாக அமைக்கப்பட்டுள்ளன.
