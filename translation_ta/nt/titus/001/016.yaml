source:
  edition: SBLGNT
  text: θεὸν ὁμολογοῦσιν εἰδέναι, τοῖς δὲ ἔργοις ἀρνοῦνται, βδελυκτοὶ ὄντες καὶ ἀπειθεῖς καὶ πρὸς πᾶν ἔργον ἀγαθὸν ἀδόκιμοι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/016.yaml
  text: They profess to know God[a], but by their works they deny him[d][c][b], being detestable and disobedient and unfit for every good work.
translation:
  language: ta
  text: அவர்கள் கடவுளை அறிந்திருப்பதாகக் கூறுகிறார்கள்[a]; ஆனால் தங்கள் செயல்களால் அவரை மறுக்கிறார்கள்[b]. அவர்கள் அருவருப்பானவர்களாகவும்[c], கீழ்ப்படியாதவர்களாகவும், எந்த நற்செயலுக்கும் தகுதியற்றவர்களாகவும் இருக்கிறார்கள்[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளைத் தாங்கள் அறிவதாக உரிமைகோருகிறார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தங்கள் நடத்தையால் அவரை மறுக்கிறார்கள்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “வெறுக்கத்தக்கவர்களாகவும்.”
    reason: lexical_alternative
  - marker: d
    text: அல்லது, “எந்த நற்செயலுக்கும் தகுதிநீக்கம் செய்யப்பட்டவர்களாகவும் இருக்கிறார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὸν
  choice: கடவுளை
  rationale: ὁμολογοῦσιν εἰδέναι என்பதன் நேரடிச் செயப்படுபொருள்; நவீன பொதுத் தமிழில் இயல்பான மொழிபெயர்ப்பு.
- source_word: ὁμολογοῦσιν
  choice: சொல்லிக்கொள்கிறார்கள்
  rationale: வாய்மொழிக் கூற்றுக்கும் செயல்களுக்கும் இடையிலான முரண்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது; இங்கு ‘அறிக்கையிடுகிறார்கள்’ என்பதைக் காட்டிலும் தெளிவானது.
- source_word: εἰδέναι
  choice: அறிந்திருப்பதாக
  rationale: கடவுளை அறிந்திருப்பதாக அவர்கள் முன்வைக்கும் கூற்றைத் தெளிவாகக் குறிக்கிறது.
- source_word: τοῖς δὲ ἔργοις
  choice: ஆனால் தங்கள் செயல்களால்
  rationale: δὲ-யின் முரண்பாட்டையும், செயல்கள் மறுதலிக்கும் வழிமுறையாக இருப்பதையும் தக்கவைக்கிறது.
- source_word: ἀρνοῦνται
  choice: அவரை மறுதலிக்கிறார்கள்
  rationale: முதல் உட்பிரிவிலுள்ள ‘கடவுள்’ என்பதையே மறைமுகச் செயப்படுபொருளாகத் தொடர்ந்து, வலுவான மறுப்பை வெளிப்படுத்துகிறது.
- source_word: βδελυκτοὶ
  choice: அருவருப்பானவர்கள்
  rationale: கடுமையான ஒழுக்க வெறுப்பைத் தெளிவாகவும் கண்ணியமான நடையிலும் தெரிவிக்கிறது.
- source_word: ἀπειθεῖς
  choice: கீழ்ப்படியாதவர்கள்
  rationale: மேய்ப்புப் பணி மற்றும் ஒழுக்கச் சூழலில் காணப்படும் கீழ்ப்படிய மறுக்கும் பொருளை நேரடியாகக் கொடுக்கிறது.
- source_word: πρὸς πᾶν ἔργον ἀγαθὸν
  choice: எந்த நற்செயலுக்கும்
  rationale: தகுதி அல்லது பொருத்தம் சார்ந்த πρός-இன் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; πᾶν இங்கு எதிர்மறைச் சூழலில் ‘எந்த ... உம்’ என இயல்பாக அமைகிறது.
- source_word: ἀδόκιμοι
  choice: தகுதியற்றவர்கள்
  rationale: சோதனையில் ஏற்றுக்கொள்ளப்படாமை அல்லது பயன்பாட்டுக்குப் பொருந்தாமை என்ற கருத்தை வாசிக்க எளிதான தமிழில் தருகிறது.
theological_decisions:
- issue: வாய்மொழியாகக் கடவுளை அறிந்ததாகச் சொல்வதற்கும் செயல்களால் அவரை மறுதலிப்பதற்கும் உள்ள உறவு
  choice: அவர்கள் கடவுளை அறிந்திருப்பதாகக் கூறினாலும், அவர்களுடைய செயல்கள் கடவுளையே மறுதலிக்கின்றன என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘கடவுளைப் பற்றிய உண்மையை மறுக்கிறார்கள்’ என்று விரிவாக்குவது.
  rationale: முதல் உட்பிரிவின் ‘கடவுளை’ என்பதே இரண்டாம் உட்பிரிவிலும் இயல்பாகத் தொடர்கிறது. மூலத்தில் இல்லாத கோட்பாட்டு விரிவாக்கமின்றி, வாய்க்கூற்றுக்கும் வாழ்க்கை நடத்தைக்கும் இடையிலான இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘சொல்லிக்கொள்கிறார்கள்’ என்பது வாய்க்கூற்றையும் அதன் பின்னுள்ள செயல்முறை முரண்பாட்டையும் இயல்பாகக் காட்டுகிறது. ‘நற்செயல்’, ‘மறுதலிக்கிறார்கள்’, ‘தகுதியற்றவர்கள்’ ஆகியவை வேதவாக்கியத்தின் கடுமையைத் தளர்த்தாமல் தெளிவைத் தக்கவைக்கின்றன.
