source:
  edition: SBLGNT
  text: δεῖ γὰρ τὸν ἐπίσκοπον ἀνέγκλητον εἶναι ὡς θεοῦ οἰκονόμον, μὴ αὐθάδη, μὴ ὀργίλον, μὴ πάροινον, μὴ πλήκτην, μὴ αἰσχροκερδῆ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/007.yaml
  text: For an overseer must be above reproach as God's steward[a], not self-willed, not quick-tempered, not given to wine, not violent, not greedy for shameful gain[b],
translation:
  language: ta
  text: ஏனெனில், கண்காணிப்பாளர்[a] கடவுளின் வீட்டுப் பொறுப்பாளராகக் குற்றச்சாட்டுக்கு இடமளிக்காதவராக இருக்க வேண்டும்; அவர் தன் விருப்பப்படியே நடப்பவராகவோ, முன்கோபக்காரராகவோ, மது அருந்துவதில் அளவுகடந்தவராகவோ, வன்முறையாளராகவோ, இழிவான ஆதாயத்தை விரும்புகிறவராகவோ[b] இருக்கக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆயர்.” கிரேக்கச் சொல் மேற்பார்வை செய்கிறவரைக் குறிக்கிறது; “கண்காணிப்பாளர்” என்பது “ஆயர்” என்ற சொல்லோடு இணைக்கப்படக்கூடிய பிற்காலத் திருச்சபைப் பதவிசார் கருத்துகளைத் தவிர்க்கிறது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “நேர்மையற்ற ஆதாயத்தை விரும்புகிறவராக.” கிரேக்கச் சொல் ஒழுக்கரீதியாக இழிவான முறையில் தேடப்படும் ஆதாயத்தை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: இருக்க வேண்டும்
  rationale: கிரேக்கச் சொல்லிலுள்ள அவசியத்தையும் கடமையையும் இயல்பான நவீன தமிழில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் கூறப்பட்டதற்கான விளக்கத் தொடர்பைப் பேணுகிறது.
- source_word: ἐπίσκοπον
  choice: கண்காணிப்பாளர்
  rationale: பிற்காலத் திருச்சபைப் பதவியமைப்புகளை இறக்குமதி செய்யாமல், மேற்பார்வை செய்கிறவர் என்ற சொல்லின் அடிப்படைப் பொருளைத் தருகிறது.
- source_word: ἀνέγκλητον
  choice: குற்றஞ்சாட்ட இடமில்லாதவர்
  rationale: பாவமே இல்லாதவர் என்ற முழுமையான பொருளைத் தராமல், நியாயமான குற்றச்சாட்டுக்கு ஆளாகாதவர் என்ற கருத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ὡς θεοῦ οἰκονόμον
  choice: கடவுளுடைய பொறுப்பாளர் என்பதால்
  rationale: கடவுளுக்குச் சொந்தமான காரியங்களை அவர் சார்பாக நிர்வகித்து அவருக்குக் கணக்குக் கொடுக்கும் பொறுப்பை இயல்பான தமிழில் உணர்த்துகிறது; ὡς இங்கு அந்தப் பொறுப்பே தகுதியின் அடிப்படை என்பதைச் சுட்டுகிறது.
- source_word: αὐθάδη
  choice: தன்னிச்சையானவர்
  rationale: தன் விருப்பத்தையே பிடிவாதமாக முன்னிறுத்தும், பிறரைக் கருத்தில் கொள்ளாத இயல்பைச் சுருக்கமாகக் குறிக்கிறது.
- source_word: ὀργίλον
  choice: முன்கோபக்காரர்
  rationale: ஒரே ஒரு கோபச் செயலை அல்லாமல், எளிதில் கோபப்படும் மனப்பாங்கைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்.
- source_word: πάροινον
  choice: மதுவுக்கு அடிமையானவர்
  rationale: மது அருந்துதலால் குணமும் நடத்தையும் ஆளப்படுகிற நிலையைக் கூறுகிறது; வெறும் ஒரு முறை குடிப்பதை அல்ல, மதுவோடு தொடர்புடைய மிகுதியான ஈடுபாட்டைக் குறிக்கிறது.
- source_word: πλήκτην
  choice: வன்முறையில் ஈடுபடுகிறவர்
  rationale: அடிக்கிறவர் அல்லது சண்டைக்காரர் என்ற நேரடிப் பொருளை, நவீன தமிழில் தெளிவாகவும் மிகையாக விரிவுபடுத்தாமலும் தெரிவிக்கிறது.
- source_word: αἰσχροκερδῆ
  choice: இழிவான ஆதாயத்துக்கு ஆசைப்படுகிறவர்
  rationale: ஆதாய வேட்கையையும், அந்த ஆதாயம் அறநெறிக்கு முரணான அல்லது அவமானகரமான வழியில் தேடப்படுவதையும் பேணுகிறது; சட்டவிரோதம் என்ற பொருளுக்கு மட்டும் கட்டுப்படுத்தவில்லை.
theological_decisions:
- issue: திருச்சபைப் பொறுப்புச் சூழலில் ἐπίσκοπος என்பதன் மொழிபெயர்ப்பு
  choice: கண்காணிப்பாளர்
  alternative: ஆயர் / பிஷப்
  rationale: மூலச்சொல்லின் மேற்பார்வைச் செயல் சார்ந்த பொருளைத் தருகிறது; வசனம் குறிப்பிடாத பிற்காலப் படிநிலை அல்லது குறிப்பிட்ட திருச்சபை அமைப்பை உட்புகுத்துவதில்லை.
- issue: ἀνέγκλητος குறிக்கும் தகுதியின் அளவு
  choice: குற்றஞ்சாட்ட இடமில்லாதவர்
  alternative: குற்றமற்றவர்
  rationale: இது முழுமையான பாவமின்மையை வலியுறுத்துவதாகத் தீர்மானிக்காமல், நியாயமான குற்றச்சாட்டுக்கு இடமளிக்காத பொதுவாழ்வு மற்றும் நடத்தைத் தகுதியை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. கிரேக்க வாக்கியத்தின் விளக்கத் தொடர்பும் தகுதிப் பட்டியலின் எதிர்மறை அமைப்பும் பேணப்பட்டுள்ளன. குறிப்பிட்ட திருச்சபை மரபுகளுக்குரிய பதவிச்சொற்கள் தவிர்க்கப்பட்டுள்ளன.
