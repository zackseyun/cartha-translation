base_translation:
  language: en
  yaml_path: translation/nt/titus/001/002.yaml
  text: in the hope of eternal life[a], which the God who does not lie promised before the ages began
translation:
  language: ta
  text: பொய் சொல்லாத கடவுள் காலங்கள் தொடங்குவதற்கு முன்பே[a] வாக்களித்த நித்திய வாழ்வின் நம்பிக்கையில்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: ‘காலம் தொடங்குவதற்கு முன்பே.’ கிரேக்கத்தில் சொல்லுக்குச் சொல், ‘நித்தியமான அல்லது யுகங்களுக்குரிய காலங்களுக்கு முன்பு’ என்று உள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπ’ ἐλπίδι
  choice: நம்பிக்கையில்
  rationale: ἐπί என்பதுடன் வரும் இத்தொடர் அடிப்படை, சூழல் அல்லது தொடர்பைக் குறிக்கக்கூடும். ‘நம்பிக்கையில்’ என்பது அவற்றில் ஒன்றை மட்டும் அளவுக்கு மீறி வரையறுக்காமல், தமிழில் இயல்பாக அந்தத் தொடர்பைப் பேணுகிறது.
- source_word: ζωῆς αἰωνίου
  choice: நித்திய வாழ்வின்
  rationale: இங்கு மரபுத்தொடர் நம்பிக்கையின் உள்ளடக்கமாகிய நித்திய வாழ்வைக் குறிக்கிறது. ‘நித்திய வாழ்வு’ என்பது காலநீடிப்பையும் புதிய ஏற்பாட்டின் இறையியல் ஒலியையும் தெளிவாகப் பேணுகிறது.
- source_word: ἣν
  choice: வாக்களித்த நித்திய வாழ்வு
  rationale: பெண்பால் ஒருமை சார்புப்பெயர் ‘நித்திய வாழ்வு’ என்பதையே இயல்பாகச் சுட்டுகிறது. தமிழில் சார்புப்பெயரைத் தனியே மொழிபெயர்ப்பதைவிட, பெயரெச்சத் தொடராக அமைப்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἐπηγγείλατο
  choice: வாக்களித்த
  rationale: கிரேக்க வினையின் பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது; இடைநிலை வினை நுட்பத்தைத் தமிழில் செயற்கையாகச் சேர்க்கவில்லை.
- source_word: ὁ ἀψευδὴς θεὸς
  choice: பொய் சொல்லாத கடவுள்
  rationale: ἀψευδής என்பதன் நேரடியான பொருளான ‘பொய் சொல்லாதவர்’ என்பதைப் பேணுகிறது. ‘பொய் சொல்ல இயலாதவர்’ என்று மூலத்தைவிட வலுப்படுத்துவதைத் தவிர்க்கிறது.
- source_word: πρὸ χρόνων αἰωνίων
  choice: காலங்கள் தொடங்குவதற்கு முன்பே
  rationale: காலங்கள் அல்லது யுகங்களுக்கு முந்திய தன்மையைத் தெளிவாகத் தெரிவிக்கிறது; ‘காலமே தொடங்குவதற்கு முன்பு’ என்ற மேன்மெய்யியல் விளக்கத்தை முதன்மை உரையில் கட்டாயப்படுத்தவில்லை.
theological_decisions:
- issue: πρὸ χρόνων αἰωνίων என்ற காலக்குறிப்பும் கடவுளின் வாக்குறுதியும்
  choice: காலங்கள் தொடங்குவதற்கு முன்பே
  alternative: காலம் தொடங்குவதற்கு முன்பே; நித்திய காலங்களுக்கு முன்பே
  rationale: கிரேக்கம் அந்த வாக்குறுதியைக் காலங்கள் அல்லது யுகங்களுக்கு முன் வைக்கிறது. அது யாருக்கு அளிக்கப்பட்டது அல்லது அதன் மேன்மெய்யியல் நடைமுறை என்ன என்பதை வசனம் விளக்காததால், மொழிபெயர்ப்பும் அதைத் தீர்மானிக்கவில்லை.
- issue: ἀψευδής எனும் கடவுளைப் பற்றிய விளக்கம்
  choice: பொய் சொல்லாத கடவுள்
  alternative: பொய் சொல்ல இயலாத கடவுள்; உண்மையுள்ள கடவுள்
  rationale: மூலம் கடவுளின் பொய்யற்ற தன்மையை உறுதிப்படுத்துகிறது. ‘இயலாத’ என்று மொழிபெயர்ப்பது பெயரடையின் நேரடிக் கூற்றைவிட வலுவான கோட்பாட்டு விளக்கத்தைச் சேர்க்கும் என்பதால் தவிர்க்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. இது முந்தைய வசனத்தின் வாக்கியத்தைத் தொடரும் பகுதி என்பதால் இறுதியில் நீண்ட கோடு இடப்பட்டுள்ளது. ‘நித்திய ஜீவன்’ என்பதற்குப் பதிலாக பொதுவாசகர்களுக்கு இயல்பான ‘நித்திய வாழ்வு’ பயன்படுத்தப்பட்டுள்ளது.
