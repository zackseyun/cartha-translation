source:
  edition: SBLGNT
  text: Τούτου χάριν ⸀ἀπέλιπόν σε ἐν Κρήτῃ ἵνα τὰ λείποντα ἐπιδιορθώσῃ, καὶ καταστήσῃς κατὰ πόλιν πρεσβυτέρους, ὡς ἐγώ σοι διεταξάμην,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/005.yaml
  text: For this reason I left you in Crete[a], so that you might set in order what remained and appoint elders in every city[c][b], as I directed you.
translation:
  language: ta
  text: 'இந்தக் காரணத்திற்காக நான் உன்னைக் கிரேத்தாவில் விட்டுவந்தேன்: எஞ்சியிருந்த காரியங்களை[a] ஒழுங்குபடுத்தவும், நான் உனக்கு அறிவுறுத்தியபடி[c] ஒவ்வொரு நகரத்திலும்[b] மூப்பர்களை நியமிக்கவும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குறைவாயிருந்தவற்றை.”
    reason: τὰ λείποντα என்பது எஞ்சியிருந்த காரியங்களையோ குறைவாக இருந்தவற்றையோ குறிக்கலாம்.
  - marker: b
    text: அல்லது, “நகரந்தோறும்.”
    reason: κατὰ πόλιν என்பதிலுள்ள பகிர்வுப் பொருளுக்கான மாற்று மொழிபெயர்ப்பு.
  - marker: c
    text: அல்லது, “நான் உனக்குக் கட்டளையிட்டபடி.”
    reason: διεταξάμην என்பதன் வலுவான அதிகார நுணுக்கத்தை வெளிப்படுத்தும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: Τούτου χάριν
  choice: இதன் காரணமாகவே
  rationale: முந்தைய கருத்துடன் இந்த வசனத்தை இணைக்கும் காரணப் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; ‘வே’ நோக்கத்திற்கான வலியுறுத்தலைக் காட்டுகிறது.
- source_word: ἀπέλιπόν
  choice: விட்டுவந்தேன்
  rationale: பவுல் அங்கிருந்து புறப்பட்டபோது தீத்துவைக் கிரேத்தாவில் தங்கவைத்தார் என்ற பொருளைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἐν Κρήτῃ
  choice: கிரேத்தாவில்
  rationale: தீவின் பெயரைத் தமிழில் வழக்கமான வடிவில் எழுதி, இடப்பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἵνα
  choice: …ஒழுங்குபடுத்தவும் …நியமிக்கவும் அப்படிச் செய்தேன்
  rationale: கிரேத்தாவில் விட்டுவந்ததன் நோக்கத்தைத் தமிழில் தெளிவாகக் காட்டும் நோக்கக் கட்டமைப்பு.
- source_word: τὰ λείποντα
  choice: எஞ்சியிருந்தவற்றை
  rationale: இன்னும் செய்து முடிக்கப்படாமல் மீந்திருந்த காரியங்களைக் குறிக்கிறது. குறைபாடு என்ற மாற்று நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐπιδιορθώσῃ
  choice: ஒழுங்குபடுத்தவும்
  rationale: முழுமை பெறாதவற்றைச் சீர்செய்து உரிய நிலையில் அமைத்தல் என்ற பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: καταστήσῃς
  choice: நியமிக்கவும்
  rationale: ஒரு பொறுப்புக்குரிய பணியில் அதிகாரப்பூர்வமாக அமர்த்துதல் என்ற சூழல்சார் பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: κατὰ πόλιν
  choice: நகரந்தோறும்
  rationale: ஒவ்வொரு நகருக்கும் பகிர்ந்தளிக்கும் கிரேக்கத் தொடரின் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: πρεσβυτέρους
  choice: மூப்பர்களை
  rationale: இங்கு வயதில் மூத்த ஆண்களை மட்டும் அல்லாமல், திருச்சபையில் அங்கீகரிக்கப்பட்ட தலைவர்களைக் குறிக்கிறது; பின்னாளைய எந்தக் குறிப்பிட்ட திருச்சபை ஆட்சிமுறையையும் மொழிபெயர்ப்பில் திணிக்கவில்லை.
- source_word: ὡς ἐγώ σοι διεταξάμην
  choice: நான் உனக்கு அறிவுறுத்தியபடி
  rationale: அதிகாரத்துடன் வழங்கப்பட்ட வழிகாட்டுதலை இயல்பான தமிழில் காட்டுகிறது; ‘கட்டளையிட்டபடி’ என்ற வலுவான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: πρεσβυτέρους என்பதன் திருச்சபைப் பணிப் பெயர்
  choice: மூப்பர்கள்
  alternative: பிரஸ்பித்தர்கள்; வயதில் மூத்தவர்கள்
  rationale: உடனடிச் சூழலில் இது அங்கீகரிக்கப்பட்ட திருச்சபைத் தலைவர்களைக் குறிக்கிறது. ‘மூப்பர்கள்’ என்ற சொல் அந்தப் பொருளைப் பாதுகாக்கிறது; அதேவேளை பின்னாளைய பிரிவுசார் ஆட்சியமைப்பை முன்கூட்டியே தீர்மானிப்பதில்லை.
- issue: διεταξάμην என்பதன் அதிகார வலிமை
  choice: அறிவுறுத்தியபடி
  alternative: கட்டளையிட்டபடி; பணித்தபடி
  rationale: கிரேக்கச் சொல் அதிகாரமுள்ள உத்தரவு அல்லது அறிவுறுத்தலைக் குறிக்கலாம். முதன்மைப் பாடம் அதிகாரத்தை அழிக்காமல் தொனியை அளவுக்கு மீறி வலுப்படுத்தாத வடிவைப் பயன்படுத்துகிறது; வலுவான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன, பொதுநிலை, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. நீளமான கிரேக்க வாக்கியத்தின் காரண–நோக்க உறவு தெளிவாக இருக்க முக்காற்புள்ளியும் இறுதியில் ‘அப்படிச் செய்தேன்’ என்ற இயல்பான தமிழ்க் கட்டமைப்பும் பயன்படுத்தப்பட்டுள்ளன. ‘மூப்பர்கள்’ என்பது புரிந்துகொள்ள எளிய, பிரிவுசார் சார்பற்ற திருச்சபைச் சொல்.
