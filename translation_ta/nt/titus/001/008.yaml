translation:
  language: ta
  text: மாறாக, அவர் விருந்தோம்புகிறவராகவும், நன்மையை நேசிக்கிறவராகவும், நிதானமுள்ளவராகவும்[a], நீதியுள்ளவராகவும், இறைப்பற்றுள்ளவராகவும்[b], தன்னடக்கமுள்ளவராகவும் இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘நிதானமுள்ளவர்’ என்பதற்கான கிரேக்கச் சொல் தெளிந்த சிந்தனையையும் அளவான நடத்தையையும் குறிக்கிறது; வசனத்தின் முடிவிலுள்ள ‘தன்னடக்கமுள்ளவர்’ என்பதற்கான வேறொரு கிரேக்கச் சொல், ஒருவர் தமது ஆசைகளையும் உந்துதல்களையும் அடக்கி ஆள்வதை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘பக்தியுள்ளவராக’; கிரேக்கச் சொல் புனிதமானவற்றுக்கேற்ற பக்தியையும் அர்ப்பணிப்பையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: மாறாக
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட தகாத பண்புகளுக்கு எதிராக இங்குள்ள நல்ல பண்புகளை அறிமுகப்படுத்தும் எதிர்மறைத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: φιλόξενον
  choice: விருந்தோம்புகிறவராக
  rationale: விருந்தினர்களையும் அந்நியர்களையும் வரவேற்று உபசரிக்கும் பண்பை நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: φιλάγαθον
  choice: நன்மையை நேசிக்கிறவராக
  rationale: கூட்டுச்சொல்லின் ‘நல்லதை நேசிப்பவர்’ என்ற பொருளைத் தெளிவாகவும் நேரடியாகவும் காக்கிறது.
- source_word: σώφρονα
  choice: நிதானமுள்ளவராக
  rationale: தெளிந்த சிந்தனை, விவேகம், அளவோடு நடத்தல் ஆகிய நுண்பொருள்களைத் தருகிறது; பின்னர் வரும் ἐγκρατῆ என்பதிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: δίκαιον
  choice: நீதியுள்ளவராக
  rationale: நடத்தையில் நேர்மையும் நியாயமும் உடையவராக இருப்பதைக் குறிக்கிறது; நீதித்துறை சார்ந்த குறுகிய பொருளுக்கு மட்டும் கட்டுப்படுத்துவதில்லை.
- source_word: ὅσιον
  choice: இறைப்பற்றுள்ளவராக
  rationale: புனிதமானவற்றுக்கேற்ற பக்தி, இறைநேயம், அர்ப்பணிப்பு ஆகியவற்றைக் குறிக்கும் சொல்லின் சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἐγκρατῆ
  choice: தன்னடக்கமுள்ளவராக
  rationale: ஆசைகளையும் உந்துதல்களையும் ஆளும் சுயகட்டுப்பாட்டை நேரடியாகக் குறிக்கிறது; σώφρονα என்பதின் நிதானம்/தெளிந்த சிந்தனை என்ற நுண்பொருளுடன் ஒன்றாக்காமல் வைக்கிறது.
theological_decisions:
- issue: σώφρονα மற்றும் ἐγκρατῆ என்னும் தொடர்புடைய இரு நற்பண்புகளை வேறுபடுத்துதல்
  choice: σώφρονα என்பதை ‘நிதானமுள்ளவராக’ என்றும் ἐγκρατῆ என்பதை ‘தன்னடக்கமுள்ளவராக’ என்றும் மொழிபெயர்த்தல்
  alternative: இரண்டையும் ‘தன்னடக்கமுள்ளவர்’ போன்ற ஒரே பொருள் கொண்ட சொற்களால் மொழிபெயர்த்தல்
  rationale: 'மூலத்தில் தொடர்புடையவையாக இருந்தாலும் வேறுபட்ட இரு பண்புகள் உள்ளன: முதலாவது தெளிந்த, அளவான சிந்தனை மற்றும் நடத்தையையும்; இரண்டாவது ஆசைகள் மற்றும் உந்துதல்கள்மேல் ஆளுகையையும் வலியுறுத்துகிறது.'
- issue: ὅσιον என்பதின் புனிதம்–பக்தி சார்ந்த நுண்பொருள்
  choice: இறைப்பற்றுள்ளவராக
  alternative: பரிசுத்தமுள்ளவராக அல்லது பக்தியுள்ளவராக
  rationale: ‘பரிசுத்தம்’ என்பது ἅγιος என்பதோடு எளிதில் ஒன்றுபடக்கூடும்; ‘பக்தி’ என்பது தமிழில் பல சமயச் சூழல்களில் பரந்த பொருள் பெறலாம். ‘இறைப்பற்று’ இங்கு தேவனுக்கேற்ற பக்தியையும் அர்ப்பணிப்பையும் தெளிவாகக் காட்டுகிறது; இருப்பினும் மூலத்தின் நுண்பொருள் அடிக்குறிப்பில் சுட்டப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் திருச்சபைத் தலைவருக்குரிய நற்பண்புப் பட்டியலின் கண்ணியத்தைப் பேணும் வகையிலும் அமைக்கப்பட்டது. கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘அவர்’ மற்றும் ‘இருக்க வேண்டும்’ என்பவை முந்தைய வசனத்தின் இலக்கணத் தொடர்ச்சியைத் தமிழில் முழுமையான வாக்கியமாக இயல்பாக வழங்கச் சேர்க்கப்பட்டுள்ளன.
