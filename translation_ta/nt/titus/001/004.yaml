id: TIT.1.4
reference: Titus 1:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τίτῳ γνησίῳ τέκνῳ κατὰ κοινὴν πίστιν· χάρις ⸀καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς καὶ ⸂Χριστοῦ Ἰησοῦ⸃ τοῦ σωτῆρος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/004.yaml
  text: 'To Titus[b][a], my true child according to our common faith: grace and peace from God the Father and Messiah Jesus our Savior.'
translation:
  language: ta
  text: 'நமக்குப் பொதுவான விசுவாசத்தின்படி[a] என் உண்மையான பிள்ளையாகிய தீத்துவுக்கு: தந்தையாகிய கடவுளிடமிருந்தும், நம் மீட்பராகிய மேசியாவாகிய இயேசுவிடமிருந்தும்[b] அருளும் சமாதானமும் உண்டாவதாக.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாம் பகிர்ந்துகொள்ளும் விசுவாசத்தின்படி.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில், “கிறிஸ்து இயேசு”; இங்கு Χριστός ஒரு பட்டமாகக் கருதப்பட்டதால் “மேசியாவாகிய இயேசு” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: γνησίῳ
  choice: உண்மையான
  rationale: உயிரியல் பிள்ளை என்ற பொருளில் அல்லாமல், விசுவாச உறவின் மெய்ம்மையையும் நம்பகத்தன்மையையும் குறிக்கிறது.
- source_word: τέκνῳ
  choice: பிள்ளை
  rationale: ஆண் பாலைக் கூடுதலாகச் சுட்டாமல், பவுலுக்கும் தீத்துவுக்கும் இடையிலான ஆன்மிகக் குடும்ப உறவு உருவகத்தை இயல்பாகப் பாதுகாக்கிறது.
- source_word: κατὰ κοινὴν πίστιν
  choice: நமக்குப் பொதுவான விசுவாசத்தின்படி
  rationale: κατά என்பதன் தொடர்பு அல்லது அளவுகோல் சார்ந்த பொருளையும், κοινήν என்பதன் பகிரப்பட்ட தன்மையையும் வெளிப்படுத்துகிறது; ‘நமக்கு’ என்பது பவுலும் தீத்துவும் பகிரும் விசுவாசத்தைத் தமிழில் இயல்பாகத் தெளிவாக்குகிறது.
- source_word: πίστιν
  choice: விசுவாசம்
  rationale: இங்கு தனிப்பட்ட நம்பகத்தன்மையை அல்ல, பவுலும் தீத்துவும் பகிரும் கிறிஸ்தவ விசுவாசத்தைக் குறிக்கிறது.
- source_word: χάρις
  choice: அருள்
  rationale: பவுலின் கடித வாழ்த்துகளில் வழக்கமான, தமிழில் இயல்பும் கண்ணியமும் கொண்ட இணைச்சொல்.
- source_word: εἰρήνη
  choice: சமாதானம்
  rationale: χάρις உடன் இணையும் கடித ஆசீர்வாதச் சொல்; வெறும் மோதலின்மையைத் தாண்டிய நல்வாழ்வுப் பொருளையும் தாங்குகிறது.
- source_word: θεοῦ πατρὸς
  choice: தந்தையாகிய கடவுள்
  rationale: கிரேக்கத்தில் ‘நம்’ என்ற உடைமைச்சொல் இல்லாததால் ‘நம் தந்தையாகிய கடவுள்’ என்று சேர்க்காமல், தந்தை என்னும் அடையாளத்தைத் துல்லியமாகப் பாதுகாக்கிறது.
- source_word: Χριστοῦ Ἰησοῦ
  choice: மேசியாவாகிய இயேசு
  rationale: Χριστός என்பதை வெறும் பெயர்போல் ஒலிபெயர்க்காமல், ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற பட்டப்பொருளுடைய ‘மேசியா’ என மொழிபெயர்க்கிறது; ‘-ஆகிய’ தமிழில் பட்டத்தையும் பெயரையும் இயல்பாக இணைக்கிறது.
- source_word: σωτῆρος ἡμῶν
  choice: நம் மீட்பர்
  rationale: இயேசுவை அடையாளப்படுத்தும் பட்டத்தை நேரடியாகவும் இயல்பான நவீன தமிழிலும் வழங்குகிறது.
theological_decisions:
- issue: Χριστός என்ற பட்டத்தின் மொழிபெயர்ப்பு
  choice: மேசியாவாகிய இயேசு
  alternative: கிறிஸ்து இயேசு
  rationale: Χριστός என்பதன் பட்டப்பொருளை வெளிப்படையாகக் காக்க ‘மேசியா’ பயன்படுத்தப்படுகிறது; மரபான ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: σωτῆρος ἡμῶν என்பதன் தொடர்பு
  choice: ‘நம் மீட்பர்’ என்பது மேசியாவாகிய இயேசுவை அடையாளப்படுத்துகிறது
  alternative: ஒருங்கிணைக்கப்பட்ட முழு மூலவாக்கியத்துடன் தளர்வாகத் தொடர்புபடுத்துதல்
  rationale: Χριστοῦ Ἰησοῦ என்பதற்குப் பின் வரும் τοῦ σωτῆρος ἡμῶν என்ற உருபுடை பெயர்த்தொடர், உடனடி இலக்கண அமைப்பில் இயேசுவுக்கான இணைநிலை அடையாளமாக மிக இயல்பாக அமைகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான கடித வாழ்த்து நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தில் வினைச்சொல் இல்லாவிட்டாலும், தமிழில் ஆசீர்வாத வாழ்த்தை முழுமைப்படுத்த ‘உண்டாவதாக’ சேர்க்கப்பட்டுள்ளது. ‘தந்தை’ என்பது இன்றைய வாசகர்களுக்கு ‘பிதா’வை விட நேரடியாகப் புரியும் சொல்; ‘மீட்பர்’ என்பது மரபுசார் ‘இரட்சகர்’ என்பதைக் காட்டிலும் பொதுவாகப் புரியக்கூடியதாகத் தேர்ந்தெடுக்கப்பட்டுள்ளது.
