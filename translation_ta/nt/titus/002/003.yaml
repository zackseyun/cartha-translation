base_translation:
  language: en
  yaml_path: translation/nt/titus/002/003.yaml
  text: Older women likewise are to be reverent in behavior[a], not slanderers nor enslaved to much wine, teachers of what is good[b],
translation:
  language: ta
  text: முதிர்ந்த பெண்களும் அதேபோல், நடத்தையில் புனிதத்துக்கு ஏற்றவர்களாகவும், அவதூறு செய்கிறவர்களாக இல்லாமலும், அதிகமான திராட்சரசத்தால் அடிமைப்படுத்தப்பட்டவர்களாக[b] இல்லாமலும், நல்லவற்றைக் கற்பிக்கிறவர்களாகவும் இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: அல்லது, ‘அதிகமான திராட்சரசத்துக்கு பழக்கத்துக்கு அடிமையானவர்களாக.’ கிரேக்கத்தில் சொல்லர்த்தமாக, ‘அதிகமான திராட்சரசத்தால் அடிமைப்படுத்தப்பட்டவர்களாக’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρεσβύτιδας
  choice: முதிர்ந்த பெண்கள்
  rationale: πρεσβῦτις வயதில் மூத்த பெண்களைக் குறிக்கிறது; முந்தைய வசனத்திலுள்ள முதிர்ந்த ஆண்களுக்கு இணையான சொல். ‘முதிர்ந்த பெண்கள்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: ὡσαύτως
  choice: அதேபோல்
  rationale: முந்தைய அறிவுரையுடன் உள்ள தொடர்பைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: ἐν καταστήματι ἱεροπρεπεῖς
  choice: நடத்தையில் பரிசுத்தத்துக்கு ஏற்றவர்களாக
  rationale: κατάστημα வெளிப்படும் நடத்தை அல்லது தோற்றப்பாங்கையும், ἱεροπρεπής புனிதமானவற்றுக்கு ஏற்ற தன்மையையும் குறிக்கின்றன. இவ்விரண்டையும் தெளிவாகப் பாதுகாக்கும் இயல்பான தமிழ் சொற்றொடர் இது.
- source_word: μὴ διαβόλους
  choice: அவதூறு செய்கிறவர்களாக இல்லாமல்
  rationale: இங்கு διάβολος பிசாசைக் குறிக்கும் பெயராக அல்லாமல், பிறரைப் பழித்துப் பொய்க்குற்றம் சாட்டுகிறவர்களைக் குறிக்கும் ஒழுக்கவியல் சொல்லாக வருகிறது. ‘அவதூறு செய்கிறவர்கள்’ அதன் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: μηδὲ οἴνῳ πολλῷ δεδουλωμένας
  choice: அதிகமான திராட்சரசத்துக்கு அடிமைப்பட்டவர்களாக இல்லாமல்
  rationale: δεδουλωμένας என்பது δουλόω என்பதன் நிறைவுற்ற செயப்பாட்டு வினையெச்சம்; திராட்சரசத்தின் கட்டுப்பாட்டுக்கு உட்பட்டிருக்கும் அடிமைத்தன உருவகத்தை ‘அடிமைப்பட்ட’ பாதுகாக்கிறது.
- source_word: καλοδιδασκάλους
  choice: நல்லவற்றைக் கற்பிக்கிறவர்களாக
  rationale: இந்தக் கூட்டுச்சொல் கற்பித்தலின் திறனை அல்ல, கற்பிக்கப்படும் நல்ல உள்ளடக்கத்தைக் குறிக்கிறது. ‘நல்லவற்றைக் கற்பிக்கிறவர்கள்’ அந்த வேறுபாட்டைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: திராட்சரசம் ஆட்கொள்வதை விவரிக்கும் δουλόω என்ற அடிமைத்தன உருவகம்
  choice: ‘அதிகமான திராட்சரசத்துக்கு அடிமைப்பட்டவர்கள்’ என்று அடிமைத்தன மொழியைத் தக்கவைத்தல்
  alternative: ‘அதிகமான திராட்சரசத்துக்கு அடிமையானவர்கள் / அதற்கு பழக்கப்பட்டவர்கள்’
  rationale: மூலமொழி வெறும் பழக்கத்தையோ பயன்பாட்டையோ அல்லாமல், திராட்சரசத்தின் ஆதிக்கத்துக்கு உட்பட்ட நிலையைக் காட்டுகிறது. ஆகவே அதன் உருவக வலிமையைத் தக்கவைப்பது பொருத்தமானது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வேதாகம உரைக்கு ஏற்ற கண்ணியமும் உள்ள நடையைப் பயன்படுத்தியுள்ளது. பட்டியல் அமைப்பைத் தெளிவாக வைத்தபடியே, தமிழில் இயல்பாக அமைய ‘இருக்க வேண்டும்’ இறுதியில் சேர்க்கப்பட்டுள்ளது; இது முந்தைய சூழலில் உள்ள மறைமுக அறிவுரையை வெளிப்படுத்துகிறது.
