source:
  edition: SBLGNT
  text: σώφρονας, ἁγνάς, ⸀οἰκουργούς, ἀγαθάς, ὑποτασσομένας τοῖς ἰδίοις ἀνδράσιν, ἵνα μὴ ὁ λόγος τοῦ θεοῦ βλασφημῆται.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/005.yaml
  text: self-controlled[a], pure, working at home, kind, being subject to their own husbands[c][b], so that the word of God may not be slandered.
translation:
  language: ta
  text: தன்னடக்கமுள்ளவர்களாகவும், தூய்மையானவர்களாகவும், வீட்டு வேலைகளில் ஈடுபடுகிறவர்களாகவும்[a], நல்லவர்களாகவும், தங்கள் சொந்தக் கணவர்களுக்குப் பணிந்திருப்பவர்களாகவும்[b] இருக்க வேண்டும்; தேவனுடைய வார்த்தை தூற்றப்படாதபடி[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வீட்டில் சுறுசுறுப்பாகப் பணிபுரிகிறவர்களாக” அல்லது “வீட்டைக் கவனிக்கிறவர்களாக.” இந்த அரிதான கிரேக்கச் சொல் வீடு சார்ந்த வேலைகளில் ஈடுபடுவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தங்கள் சொந்தக் கணவர்களுக்குக் கீழ்ப்படிகிறவர்களாக.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “பழித்துப் பேசப்படாது”; இன்னும் சொற்சார்பாக, “தூஷிக்கப்படாது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σώφρονας
  choice: தன்னடக்கமுள்ளவர்களாக
  rationale: மனத்தெளிவுடன் தன்னைக் கட்டுப்படுத்தும் பண்பை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἁγνάς
  choice: தூய்மையானவர்களாக
  rationale: ஒழுக்கம் சார்ந்த தூய்மையையும், சொல்லின் விரிவான பொருளையும் குறுகச் செய்யாமல் காக்கிறது.
- source_word: οἰκουργούς
  choice: வீட்டு வேலைகளில் ஈடுபடுகிறவர்களாக
  rationale: வீடு சார்ந்த உழைப்பில் முனைப்புடன் ஈடுபடுவதைக் குறிக்கிறது; வீட்டுக்குள் அடைபட்டிருக்க வேண்டும் என்ற கூடுதல் கருத்தைச் சேர்ப்பதில்லை.
- source_word: ἀγαθάς
  choice: நல்லவர்களாக
  rationale: கிரேக்கச் சொல்லின் விரிவான அறநெறிப் பொருளைத் தக்கவைக்கிறது; ‘கனிவுள்ளவர்களாக’ என்பது சாத்தியமானாலும் பொருளை உறவுசார் கனிவாக மட்டும் குறுக்கக்கூடும்.
- source_word: ὑποτασσομένας
  choice: பணிந்திருப்பவர்களாக
  rationale: திருமண உறவில் கூறப்படும் ஒழுங்குபட்ட பணிவை இயல்பான தமிழில் தெரிவிக்கிறது; வசனத்திற்கு அப்பாற்பட்ட கோட்பாட்டு அமைப்பைச் சேர்ப்பதில்லை.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: தங்கள் சொந்தக் கணவர்களுக்கு
  rationale: உடைமைச் சுட்டின் வரம்பைத் தக்கவைத்து, சூழலில் ἀνήρ என்பது கணவரைக் குறிக்கிறது என்பதைத் தெளிவாக்குகிறது.
- source_word: ἵνα μὴ
  choice: இதனால் ... படாது
  rationale: நோக்கம் அல்லது எதிர்பார்க்கப்படும் விளைவை இயல்பான தமிழில் இணைக்கிறது.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: தேவனுடைய வார்த்தை
  rationale: தேவனுடைய செய்தியைக் குறிக்கும் நிலைபெற்ற, நேரடியான தமிழ் மொழிபெயர்ப்பு.
- source_word: βλασφημῆται
  choice: தூற்றப்படாது
  rationale: இங்கே தேவனுடைய வார்த்தை பொதுவெளியில் இழிவாகப் பேசப்படுவதைத் தெளிவாகக் குறிக்கிறது; வழக்கமான தமிழில் ‘தேவதூஷணம்’ என்பதைக் காட்டிலும் பொருத்தமானது.
theological_decisions:
- issue: οἰκουργούς என்ற வீட்டுப் பொறுப்பு சொல்லை வீட்டுக்குள் கட்டுப்படுத்தும் கட்டளையாக மிகைப்படுத்தாமல் மொழிபெயர்த்தல்
  choice: வீட்டு வேலைகளில் ஈடுபடுகிறவர்களாக
  alternative: வீட்டைக் கவனிக்கிறவர்களாக
  rationale: அரிதான கிரேக்கச் சொல் வீட்டுடன் தொடர்புடைய பயனுள்ள உழைப்பை வலியுறுத்துகிறது; தனிமைப்படுத்தல் அல்லது வீட்டைவிட்டு வெளியே செயல்படக் கூடாது என்ற கருத்தை வெளிப்படையாகக் கூறவில்லை.
- issue: ὑποτασσομένας என்பதில் உள்ள திருமண உறவின் பணிவைச் சமயப்பிரிவு சார்ந்த விரிவாக்கமின்றிக் காத்தல்
  choice: தங்கள் சொந்தக் கணவர்களுக்குப் பணிந்திருப்பவர்களாக
  alternative: தங்கள் சொந்தக் கணவர்களுக்குக் கீழ்ப்படிகிறவர்களாக
  rationale: கிரேக்க உரை திருமண உறவில் பணிவைக் கூறுகிறது. ‘தங்கள் சொந்த’ என்பதைத் தக்கவைப்பது அதன் வரம்பை அந்தந்த திருமண உறவுக்குள் வைத்திருக்கிறது; இதிலிருந்து ஒரு முழுமையான பாலினக் கோட்பாட்டை மொழிபெயர்ப்பு சேர்ப்பதில்லை.
- issue: ἵνα μὴ என்பதின் நோக்கம்–விளைவு தொடர்பு
  choice: இதனால் தேவனுடைய வார்த்தை தூற்றப்படாது
  alternative: தேவனுடைய வார்த்தை தூற்றப்படாதபடி
  rationale: ἵνα பொதுவாக நோக்கத்தைக் குறித்தாலும், இச்சூழலில் எதிர்பார்க்கப்படும் விளைவின் நிழலும் இருக்கலாம். பிரதான உரை இயல்பான தமிழில் இரண்டையும் ஏற்கும் வகையில் அமைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க உரை முந்தைய வசனத்தின் இலக்கணத்தைத் தொடர்ந்து பெயரடைகளாக வருவதால், தனி வசனமாக இயல்பாக வாசிக்க “இருக்க வேண்டும்” சேர்க்கப்பட்டுள்ளது. பண்புப் பட்டியலின் இணை அமைப்பைக் காக்க “-வர்களாகவும்” தொடர்ந்து பயன்படுத்தப்பட்டுள்ளது.
