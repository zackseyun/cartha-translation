translation:
  language: ta
  text: பாக்கியமான நம்பிக்கையையும், நமது மாபெரும் கடவுளும் மீட்பருமான இயேசு மேசியாவின் மகிமை வெளிப்படுதலையும் நாம் ஆவலுடன் எதிர்பார்க்கிறோம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσδεχόμενοι
  choice: நாம் ஆவலுடன் எதிர்பார்க்கிறோம்
  rationale: இது முந்தைய வசனத்தின் கருத்தைத் தொடரும் நிகழ்காலப் பங்கேற்புவினை; வெறும் காத்திருத்தலைவிட எதிர்நோக்கியிருக்கும் ஆவலையும் நீடித்த நிலையையும் இச்சொற்றொடர் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: μακαρίαν
  choice: பாக்கியமான
  rationale: இறுதிக்கால நம்பிக்கையின் சிறப்பையும் நற்பேற்றையும் குறிக்கிறது; ‘மகிழ்ச்சியான’ என்பது இச்சூழலில் ஆழம் குறைந்ததாக இருக்கும்.
- source_word: ἐλπίδα
  choice: நம்பிக்கை
  rationale: இங்கு வெறும் விருப்பமல்ல, உறுதியாக எதிர்பார்க்கப்படும் வருங்கால நிகழ்வைக் குறிக்கும் வழக்கமான, தெளிவான மொழிபெயர்ப்பு.
- source_word: ἐπιφάνειαν
  choice: வெளிப்படுவது
  rationale: காணக்கூடிய விதத்தில் தோன்றுதல் என்ற இறுதிக்காலப் பொருளை இயல்பான நவீன தமிழில் தருகிறது; சமயக் கலைச்சொல் தவிர்க்கப்படுகிறது.
- source_word: δόξης
  choice: மகிமை
  rationale: கிரேக்கச் சொல்லின் நேரடியான, வழக்கமான பொருள்; ‘மகிமை வெளிப்படுவது’ என்று மூலத்தின் உறவமைப்பும் காக்கப்படுகிறது.
- source_word: μεγάλου
  choice: மாபெரும்
  rationale: θεοῦ-ஐ அடைமொழியாக வர்ணிக்கும் வலிமையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: θεοῦ
  choice: கடவுள்
  rationale: நவீன பொதுத்தமிழில் தெளிவான நிலையான மொழிபெயர்ப்பு; இவ்வாக்கிய அமைப்பில் இயேசுவைக் குறிக்கும் ஒருங்கிணைந்த பட்டத்தின் பகுதியாக வைக்கப்பட்டுள்ளது.
- source_word: σωτῆρος
  choice: மீட்பர்
  rationale: காப்பவரும் விடுவிப்பவருமான பொருளை பொதுவாசகர்களுக்குப் புரியும் தமிழில் தருகிறது; ‘இரட்சகர்’ என்பதிலுள்ள சமயக் கலைச்சொல் தன்மை தவிர்க்கப்படுகிறது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மேசியா
  rationale: Χριστός இங்கு பெயராக மட்டும் ஒலிபெயர்க்கப்படாமல், அபிஷேகம் செய்யப்பட்ட வாக்குறுதியான அரசர் என்ற பட்டப் பொருளுடன் ‘மேசியா’ என வழங்கப்படுகிறது.
theological_decisions:
- issue: ‘நமது மாபெரும் கடவுளும் மீட்பருமான இயேசு மேசியா’ என்பது ஒரே நபரைக் குறிக்கிறதா, அல்லது பிதாவையும் இயேசுவையும் ஆகிய இருவரைக் குறிக்கிறதா?
  choice: ‘கடவுள்’, ‘மீட்பர்’ ஆகிய இரு பட்டங்களும் ஒரே நபரான இயேசு மேசியாவைக் குறிக்கின்றன.
  alternative: ‘மாபெரும் கடவுள்’ ஒருவரையும் ‘நமது மீட்பராகிய இயேசு மேசியா’ வேறொருவரையும் குறிக்கின்றன.
  rationale: τοῦ என்ற ஒரே சுட்டுரை καὶ-ஆல் இணைக்கப்பட்ட இரண்டு ஒருமை நபர்ப் பெயர்ச்சொற்களையும் ஆள்கிறது; பின்னர் வரும் Ἰησοῦ Χριστοῦ அவற்றின் ஒரே குறிப்பாளரை இயல்பாக அடையாளப்படுத்துகிறது. இருப்பினும் இலக்கண ரீதியாக முன்வைக்கப்பட்ட இரு-குறிப்பாளர் வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: மொழிநடை நவீன, மரியாதைமிக்க பொதுத்தமிழாக வைக்கப்பட்டுள்ளது. ‘ஆவலுடன் எதிர்பார்க்கிறோம்’ என்பது தொடர்ச்சியான எதிர்நோக்குதலை வெளிப்படுத்துகிறது. ‘மீட்பர்’ பொதுவாகப் புரியும் சொல்லாகவும், ‘மேசியா’ Χριστός என்பதன் பட்டப் பொருளைக் காக்கும் சொல்லாகவும் தேர்ந்தெடுக்கப்பட்டன.
