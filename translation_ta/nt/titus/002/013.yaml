revisions:
- from: பாக்கியமான நம்பிக்கையையும், நமது மாபெரும் கடவுளும் மீட்பருமான[a] இயேசு மேசியாவின் மகிமை வெளிப்படுவதையும் நாம் ஆவலுடன் எதிர்பார்க்கிறோம்.
  to: பாக்கியமான நம்பிக்கையையும், நமது மாபெரும் கடவுளும் மீட்பருமான இயேசு மேசியாவின் மகிமை வெளிப்படுதலையும் நாம் ஆவலுடன் எதிர்பார்க்கிறோம்.
  rationale: The revision keeps the preferred one-person reading while making the glory’s appearing grammatically explicit in Tamil. The footnote is rewritten to identify the disputed referential reading without introducing an unnatural possessive structure or implying a different underlying Greek wording.
