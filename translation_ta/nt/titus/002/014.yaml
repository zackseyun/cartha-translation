source:
  edition: SBLGNT
  text: ὃς ἔδωκεν ἑαυτὸν ὑπὲρ ἡμῶν ἵνα λυτρώσηται ἡμᾶς ἀπὸ πάσης ἀνομίας καὶ καθαρίσῃ ἑαυτῷ λαὸν περιούσιον, ζηλωτὴν καλῶν ἔργων.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/014.yaml
  text: who gave himself for us[a], so that he might redeem us from all lawlessness and purify for himself a people for his own possession, zealous for good works.
translation:
  language: ta
  text: அவர் நமக்காகத் தம்மையே கொடுத்தார்; எல்லா நெறிமீறலிலிருந்தும் நம்மை மீட்கவும், தமக்கே உரிய, நற்செயல்களைச் செய்வதில் ஆர்வமுள்ள ஒரு மக்களைத் தூய்மைப்படுத்தவும் அவ்வாறு செய்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδωκεν ἑαυτὸν
  choice: தம்மையே கொடுத்தார்
  rationale: தன்னார்வமான சுயஅர்ப்பணிப்பையும் கிரேக்கத்தின் வலியுறுத்தும் தற்சுட்டுப் பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ὑπὲρ ἡμῶν
  choice: நமக்காக
  rationale: நமது நன்மைக்காக அல்லது நமது சார்பாக என்ற பரந்த பொருளைத் தக்கவைத்து, குறிப்பிட்ட ஒரு பரிகாரக் கோட்பாட்டை மொழிபெயர்ப்பிலேயே திணிக்கவில்லை.
- source_word: ἵνα λυτρώσηται
  choice: மீட்டுக்கொள்ளவும்
  rationale: விடுதலை மற்றும் மீட்பு ஆகிய λυτρόομαι என்பதன் பொருள்களைச் சுருக்கமாக வெளிப்படுத்துகிறது; நடுவினை வடிவத்தின் தனக்கென மீட்டுக்கொள்ளும் நுணுக்கத்தையும் சூழலில் உணர்த்துகிறது.
- source_word: ἀπὸ πάσης ἀνομίας
  choice: எல்லா நெறிமீறலிலிருந்தும்
  rationale: ἀνομία என்பதன் ‘நெறி அல்லது சட்டத்தை மீறுதல்’ என்ற குறிப்பான கருத்தை, நவீன வாசகர்கள் வெறும் அரசுச் சட்ட மீறலாக மட்டுப்படுத்தாத வகையில் வழங்குகிறது.
- source_word: καθαρίσῃ
  choice: தூய்மைப்படுத்தவும்
  rationale: சடங்கு சார்ந்த தூய்மையும் ஒழுக்கத் தூய்மையும் ஒலிக்கும் καθαρίζω என்பதன் பரப்பைத் தக்கவைக்கிறது.
- source_word: ἑαυτῷ
  choice: தமக்கே
  rationale: மக்கள் அவருக்காகவும் அவருக்குச் சொந்தமாகவும் இருக்கிறார்கள் என்ற உடைமை மற்றும் பயன் சார்ந்த பொருளை வெளிப்படுத்துகிறது.
- source_word: λαὸν περιούσιον
  choice: தமக்கே சொந்தமான மக்களாக
  rationale: கிரேக்கப் பழைய ஏற்பாட்டின் உடன்படிக்கைச் சொல்லாட்சியை எதிரொலிக்கும், கடவுளுக்குச் சிறப்பாக உரிய மக்கள் என்ற வலுவான உடைமைப் பொருளைக் காக்கிறது.
- source_word: ζηλωτὴν καλῶν ἔργων
  choice: நற்செயல்களில் ஆர்வமுள்ள
  rationale: நல்ல செயல்களைச் செய்யும் தீவிர விருப்பத்தையும் அர்ப்பணிப்பையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: கிறிஸ்து தம்மைக் கொடுத்ததில் ὑπὲρ ἡμῶν என்பதன் வலிமை
  choice: ‘நமக்காக’ என்று பரந்த பொருளில் மொழிபெயர்க்கப்பட்டது
  alternative: ‘நமது சார்பாக’ அல்லது ‘நமது இடத்தில்’
  rationale: இச்சொல் நமது நன்மைக்காக என்ற பொருளோடு பதிலீட்டின் நுணுக்கத்தையும் ஏற்கக்கூடும். ஆனால் இவ்வசனம் மட்டும் வெளிப்படையாக வரையறுக்காத ஒரு குறிப்பிட்ட பரிகார விளக்கத்திற்குள் மொழிபெயர்ப்பைச் சுருக்காமல் அதன் இறையியல் அகலத்தைப் பாதுகாக்கிறது.
- issue: λαὸν περιούσιον என்பதன் உடன்படிக்கை சார்ந்த பொருள்
  choice: ‘தமக்கே சொந்தமான மக்கள்’
  alternative: ‘தனிச்சிறப்புள்ள மக்கள்’ அல்லது ‘அருமையாகக் கருதும் மக்கள்’
  rationale: கடவுளுக்கு விசேஷமாக உரிய உடன்படிக்கை மக்கள் என்ற வலுவான பொருளையும் பழைய ஏற்பாட்டின் எதிரொலியையும் இது நேரடியாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியத்தின் நோக்கத் தொடர்பைத் தெளிவாக வைத்திருக்க இரண்டு தமிழ் வாக்கியங்களாக வழங்கப்பட்டுள்ளது; ‘இவ்வாறு’ என்பது ἵνα அறிமுகப்படுத்தும் நோக்கத்தை இணைக்கிறது. மரியாதைப் பன்மை வடிவங்கள் தொடர்ச்சியாகப் பயன்படுத்தப்பட்டுள்ளன.
