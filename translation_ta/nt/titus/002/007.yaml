lexical_decisions:
- source_word: περὶ πάντα
  choice: எல்லாவற்றிலும்
  rationale: இந்தச் சொற்றொடர் தீத்துவின் நடத்தையின் முழுமையான பரப்பைக் குறிக்கிறது. ‘எல்லாவற்றிலும்’ என்பது இயல்பான தமிழில் அந்த விரிவைத் தக்கவைக்கிறது.
- source_word: σεαυτὸν παρεχόμενος
  choice: உன்னையே காட்டிக்கொள்
  rationale: தீத்து தன்னையே பிறர் பின்பற்றத்தக்கவராக வெளிப்படுத்த வேண்டும் என்ற இடைநிலை வினையெச்சத்தின் தற்சுட்டுப் பொருளை இது காக்கிறது.
- source_word: τύπον
  choice: முன்மாதிரி
  rationale: நெறிசார் சூழலில் பின்பற்றத்தக்க மாதிரியைக் குறிக்கும் τύπος என்பதற்கு ‘முன்மாதிரி’ தெளிவான நவீனத் தமிழ்.
- source_word: καλῶν ἔργων
  choice: நற்செயல்கள்
  rationale: நல்லதும் பாராட்டத்தக்கதுமான செயல்களை நேரடியாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: ἐν τῇ διδασκαλίᾳ
  choice: உன் போதனையில்
  rationale: சூழலில் இது தீத்துவின் போதிக்கும் செயலையும் அதன் உள்ளடக்கத்தையும் குறிக்கலாம். ‘உன்’ என்பது தமிழில் குறிப்பிடப்படுபவரைத் தெளிவாக்குகிறது.
- source_word: ἀφθορίαν
  choice: மாசற்ற தன்மை
  rationale: சீர்கேடு அல்லது கலப்படம் இல்லாத நிலை என்ற சொல்லின் அடிப்படைப் பொருளை, இச்சூழலில் இயல்பான தமிழில் தருகிறது; ‘நேர்மை’ என்று மட்டும் பொருளைச் சுருக்கவில்லை.
- source_word: σεμνότητα
  choice: கண்ணியம்
  rationale: மதிப்புக்குரிய தீவிரத்தையும் மரியாதைக்குரிய நடத்தையையும் ‘கண்ணியம்’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: διδασκαλία என்பதை திருச்சபைச் சிறப்புச் சொல்லாக மொழிபெயர்ப்பதா
  choice: ‘கோட்பாடு’ என்பதற்குப் பதிலாக ‘போதனை’
  alternative: கோட்பாட்டில்
  rationale: இங்கு தீத்துவின் போதிக்கும் முறையும் உள்ளடக்கமும் இரண்டும் கருத்தில் இருக்கலாம். ‘போதனை’ அந்தப் பொருள் அகலத்தைத் தக்கவைக்கிறது.
- issue: ἀφθορίαν என்பதன் குறிப்பான பொருள்
  choice: மாசற்ற தன்மை
  alternative: தூய்மை; நேர்மை; சீர்கேடின்மை
  rationale: இந்தச் சொல் போதனையின் தூய்மையையோ நேர்மையையோ சீர்கேடற்ற தன்மையையோ சுட்டலாம். ‘மாசற்ற தன்மை’ இந்த வாய்ப்புகளை மிகையாகக் குறுக்காமல் இயல்பாகத் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தில் இவ்வசனம் முன் வரும் அறிவுறுத்தலுடன் வினையெச்சத் தொடர்பில் உள்ளது; தமிழில் வசனம் தனியே வாசிக்க இயலுமாறு அறிவுறுத்தல் வடிவம் பயன்படுத்தப்பட்டது. ‘மாசற்ற தன்மை’ என்பது ἀφθορίαν என்பதன் பொருள் அகலத்தையும் சூழலுக்குரிய இயல்பையும் சமநிலைப்படுத்துகிறது.
