  text: எல்லாவற்றிலும்[a] நற்செயல்களில் முன்மாதிரியாக[b] உன்னையே காட்டிக்கொள்; உன் போதனையில்[c] மாசற்ற தன்மையையும்[d] கண்ணியத்தையும்[e] வெளிப்படுத்து.
