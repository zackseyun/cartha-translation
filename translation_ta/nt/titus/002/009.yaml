  text: Δούλους ἰδίοις δεσπόταις ὑποτάσσεσθαι ἐν πᾶσιν, εὐαρέστους εἶναι, μὴ ἀντιλέγοντας,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/009.yaml
  text: Servants are to submit to their own masters in everything[a], to be pleasing, not argumentative[b],
translation:
  language: ta
  text: அடிமைகள்[a] தங்கள் சொந்த எஜமானர்களுக்கு எல்லாவற்றிலும் கீழ்ப்படிந்து, அவர்களுக்கு மனநிறைவளிப்பவர்களாய் இருந்து, எதிர்த்துப் பேசாமல்[b] இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பணியாளர்கள்’ அல்லது ‘பிணைக்கப்பட்ட பணியாளர்கள்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் doulous பணிசெய்பவர்களைக் குறிக்கக்கூடும், ஆனால் இங்கு அடிமைப்பட்ட நிலையே பெரும்பாலும் கருத்தில் உள்ளது.
    reason: alternative_reading
  - marker: b
    text: ‘மறுத்துப் பேசாமல்’ அல்லது ‘பதில் பேசாமல்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δούλους
  choice: அடிமைகள்
  rationale: இங்கு δεσπόταις என்பதுடன் வரும் δοῦλος, வெறும் பணிசெய்பவர்களை அல்லாமல் எஜமானரின் அதிகாரத்திற்கும் உடைமைநிலைக்கும் உட்பட்டவர்களைக் குறிக்கிறது; ஆகவே பிணைக்கப்பட்ட சமூக நிலையை மென்மையாக்காமல் ‘அடிமைகள்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: ἰδίοις δεσπόταις
  choice: தங்கள் சொந்த எஜமானர்களுக்கு
  rationale: ἰδίοις என்பதின் தனிப்பட்ட உடைமைத் தொடர்பை ‘தங்கள் சொந்த’ என்பதும், δεσπόταις என்பதின் அதிகார உறவை இயல்பான தமிழில் ‘எஜமானர்களுக்கு’ என்பதும் வெளிப்படுத்துகின்றன.
- source_word: ὑποτάσσεσθαι
  choice: கீழ்ப்படிந்து ... இருக்க வேண்டும்
  rationale: இந்த நிகழ்கால infinitive அறிவுறுத்தப்படும் தொடர்ச்சியான கீழ்ப்படிதலைக் குறிக்கிறது. முந்தைய வசனத்தின் அறிவுறுத்தல் அமைப்பைத் தமிழில் நிறைவு செய்ய ‘இருக்க வேண்டும்’ பயன்படுத்தப்பட்டது.
- source_word: ἐν πᾶσιν
  choice: எல்லாவற்றிலும்
  rationale: சொற்றொடரின் விரிவான, கட்டுப்படுத்தப்படாத பரப்பை விளக்கவுரை மூலம் குறுக்காமல் அப்படியே காக்கிறது.
- source_word: εὐαρέστους εἶναι
  choice: அவர்களுக்குப் பிரியமானவர்களாய் இருந்து
  rationale: εὐάρεστος என்பது ‘பிரியமான, மனநிறைவு அளிக்கிற’ என்ற பொருளுடையது. சூழலில் எஜமானர்களே மறைமுகமாக இதன் தொடர்புப் பொருளாக இருப்பதால், இயல்பான தமிழுக்காக ‘அவர்களுக்குப்’ எனத் தெளிவாக்கப்பட்டது.
- source_word: μὴ ἀντιλέγοντας
  choice: எதிர்த்துப் பேசாமல்
  rationale: ἀντιλέγω இங்கு வாய்மொழியாக எதிர்ப்பது, மறுத்துப் பேசுவது, அல்லது பதிலுக்குப் பதில் பேசுவது ஆகிய பொருள் வரம்பைக் கொண்டுள்ளது; ‘எதிர்த்துப் பேசாமல்’ என்பது நடுநிலையான, இயல்பான தமிழில் அந்த வரம்பை நன்றாகக் காக்கிறது.
theological_decisions:
- issue: வீட்டு ஒழுங்குமுறைச் சூழலில் δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: அடிமைகள்
  alternative: பணியாளர்கள்; கட்டுண்ட பணியாளர்கள்
  rationale: இவ்வசனம் δεσπότης எனப்படும் எஜமானர்களின் அதிகாரத்திற்குட்பட்ட வரலாற்றுச் சமூக நிலையிலிருந்தவர்களைச் சுட்டுகிறது. ‘அடிமைகள்’ என்பது அந்தப் பிணைக்கப்பட்ட நிலையைக் காக்கிறது; இது அந்த அமைப்பை ஆதரிக்கும் விளக்கமாக அல்ல, மூலத்தின் சமூக உண்மையை மறைக்காத மொழிபெயர்ப்பாகும்.
- issue: ἐν πᾶσιν என்பதின் முழுமையான பரப்பு
  choice: எல்லாவற்றிலும்
  alternative: எல்லா விதத்திலும்
  rationale: மூலவாசகம் வெளிப்படையான விதிவிலக்கைச் சேர்க்கவில்லை. அதன் இறையியல் மற்றும் ஒழுக்கவியல் பதற்றத்தை மொழிபெயர்ப்பாளர் அமைதியாகத் தீர்க்காமல், பரந்த சொல்லாட்சியை அப்படியே வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. தொடர்ச்சியான கிரேக்க infinitive/participle அமைப்பு தமிழில் ‘கீழ்ப்படிந்து ... இருந்து ... இருக்க வேண்டும்’ என்ற இயல்பான அறிவுறுத்தல் தொடராக வழங்கப்பட்டது. ‘அடிமைகள்’ என்ற வரலாற்று ரீதியாகக் கடினமான சொல்லை மென்மையாக்காமல் வைத்ததுடன், மொழிபெயர்ப்பு அந்த நிறுவனத்தை ஆதரிப்பதாக ஒலிக்காதபடி அடிக்குறிப்பில் சமூக நிலை தெளிவுபடுத்தப்பட்டது.
