reference: Titus 2:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ταῦτα λάλει καὶ παρακάλει καὶ ἔλεγχε μετὰ πάσης ἐπιταγῆς· μηδείς σου περιφρονείτω.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/015.yaml
  text: Speak these things[a], and exhort and rebuke with all authority. Let no one disregard you.
translation:
  language: ta
  text: இவற்றைப் பேசு; அறிவுறுத்து; முழு அதிகாரத்துடன் கண்டி. யாரும் உன்னை அலட்சியப்படுத்த வேண்டாம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாரும் உன்னை இகழக் கூடாது” / “யாரும் உன்னைத் தாழ்வாகக் கருதக் கூடாது.”
    reason: περιφρονέω என்பது ஒருவரை அலட்சியப்படுத்துதல், இகழ்தல், அல்லது தாழ்வாகக் கருதுதல் ஆகிய பொருள் நிழல்களைக் கொண்டிருப்பதால், வலுவான மாற்று மொழிபெயர்ப்புகள் தரப்படுகின்றன.
lexical_decisions:
- source_word: Ταῦτα
  choice: இவற்றை
  rationale: முந்தைய அறிவுரைகள் அனைத்தையும் பொதுவாகச் சுட்டுகிறது; ‘இந்தப் போதனைகள்’ என்று பொருளைக் குறுக்காமல் மூலத்தின் பரந்த சுட்டுப்பொருளைப் பாதுகாக்கிறது.
- source_word: λάλει
  choice: பேசு
  rationale: தொடர்ந்து வாய்மொழியாக எடுத்துரைக்கும்படியான கட்டளையை நேரடியாகவும் இயல்பாகவும் தருகிறது; ‘போதித்துக்கொண்டிரு’ என்று தேவையற்ற வகையில் குறிப்பாக்கவில்லை.
- source_word: παρακάλει
  choice: அறிவுறுத்து
  rationale: ஊக்குவித்தல், வலியுறுத்துதல், அறிவுறுத்துதல் ஆகிய பொருள் எல்லைகளை உடைய சொல்லுக்கு, இந்த மேய்ப்புப் பணிச் சூழலில் வழிநடத்தும் வலிமையைக் காக்கும் இயல்பான தமிழ்ச் சொல்.
- source_word: ἔλεγχε
  choice: கண்டி
  rationale: தவறை வெளிப்படுத்தி அதைச் சீர்செய்யும் நோக்கிலான கடிந்துரைப்பைக் குறுகிய, தெளிவான கட்டளை வடிவில் வெளிப்படுத்துகிறது.
- source_word: μετὰ πάσης ἐπιταγῆς
  choice: முழு அதிகாரத்துடன்
  rationale: ἐπιταγή என்பதன் ‘கட்டளை/அதிகாரம்’ பொருளையும் πάσης தரும் முழுமையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; வெறும் கட்டளையிடும் தொனி என்று குறுக்கவில்லை.
- source_word: μηδείς
  choice: யாரும் ... கூடாது
  rationale: எவரும் விதிவிலக்கல்ல என்ற எதிர்மறைத் தடைப்பொருளை நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: σου
  choice: உன்னை
  rationale: περιφρονείτω என்பதுடன் தொடர்புடைய நபரைத் தமிழின் இயல்பான வேற்றுமை வடிவில் காட்டுகிறது.
- source_word: περιφρονείτω
  choice: பொருட்படுத்தாமல் இருக்கக் கூடாது
  rationale: ஒருவரை முக்கியமற்றவராகக் கருதி அலட்சியம் செய்வது என்ற பொருளை இயல்பாகத் தருகிறது; ‘இகழ்தல்’ அல்லது ‘தாழ்வாகக் கருதுதல்’ என்ற வலுவான சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: μετὰ πάσης ἐπιταγῆς என்பதில் தீத்துவின் ஊழிய அதிகாரத்தின் வலிமை
  choice: பேசுதல், அறிவுறுத்துதல், கண்டித்தல் ஆகியவற்றைத் தீத்து முழு அதிகாரத்துடன் செய்ய வேண்டும்.
  alternative: இது கட்டளையிடும் தொனியை மட்டும் குறிக்கலாம்; அல்லது செய்தியின் அதிகாரத்தை மட்டும் குறிக்கலாம்.
  rationale: இச்சொற்றொடர் அருகிலுள்ள கட்டளைகளை இயல்பாக மாற்றி, அவற்றை நிறைவேற்ற வேண்டிய முழு அதிகார வலிமையைக் காட்டுகிறது. ‘முழு அதிகாரத்துடன்’ என்பது அந்த வலிமையைப் பாதுகாக்கிறது; ஆனால் அது தீத்துவின் சுயாதீனமான தனிப்பட்ட அதிகாரம் என்று உரைக்கு அப்பாற்பட்டு வரையறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான கட்டளைத் தொனியிலும் வடிவமைக்கப்பட்டது. மூலத்தின் மூன்று இணைச் செயல்களும் சுருக்கமாகப் பாதுகாக்கப்பட்டுள்ளன; இறுதி மூன்றாம் நபர் தடை தமிழில் இயல்பான ‘கூடாது’ வடிவில் தரப்பட்டுள்ளது.
