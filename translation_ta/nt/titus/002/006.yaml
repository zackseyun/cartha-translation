  yaml_path: translation/nt/titus/002/006.yaml
  text: Likewise[b][a], urge the younger men to be self-controlled.
translation:
  language: ta
  text: அவ்வாறே, இளைய ஆண்களைத்[a] தன்னடக்கத்துடன் இருக்கும்படி[b] அறிவுறுத்து.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இளைஞர்களை.” கிரேக்கச் சொல் பொதுவாக எல்லா இளையோரையும் அல்ல, குறிப்பாக இளைய ஆண்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நிதானமாகச் சிந்திக்கும்படி” அல்லது “தெளிந்த மனதுடன் இருக்கும்படி.” கிரேக்கச் சொல் தெளிந்த சிந்தனையையும் ஒழுக்கமான சுயக்கட்டுப்பாட்டையும் வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοὺς νεωτέρους
  choice: இளைஞர்களை
  rationale: கிரேக்கச் சொற்றொடர் ஆண்பால் பன்மையாக இருந்து, சூழலில் வயதிலும் பாலினத்திலும் வேறுபட்ட குழுக்களுக்கு வழங்கப்படும் அறிவுரைகளின் தொடரில் இளைய ஆண்களைக் குறிக்கிறது. தமிழில் ‘இளைஞர்கள்’ இயல்பாக இளம் ஆண்களைக் குறிக்கும்.
- source_word: ὡσαύτως
  choice: அவ்வாறே
  rationale: முந்தைய இணையான அறிவுரைகளுடன் இவ்வசனத்தைத் தொடர்புபடுத்தும் விதத்தைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: παρακάλει
  choice: அறிவுறுத்து
  rationale: தீத்து தொடர்ந்து வலியுறுத்திக் கற்பிக்க வேண்டும் என்ற நிகழ்காலக் கட்டளையின் பொருளை, நவீனத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: σωφρονεῖν
  choice: தன்னடக்கத்துடன் இருக்கும்படி
  rationale: தெளிவான நிதானமான சிந்தனை, சுயக்கட்டுப்பாடு, ஒழுக்கமான நடத்தை ஆகியவற்றை உள்ளடக்கும் சொல்லின் இச்சூழலுக்குரிய மையப் பொருளை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: νεωτέρους என்பதிலுள்ள பாலினக் குறிப்பு
  choice: குறிப்பாக இளைஞர்கள், அதாவது இளைய ஆண்கள்
  alternative: இளையவர்கள் என்ற பொதுப்பாலினக் குறிப்பு
  rationale: உடனடி இலக்கியச் சூழல் வயது மற்றும் பாலின அடிப்படையில் தனித்தனி குழுக்களை வரிசையாகக் குறிப்பிடுவதால், மூலத்தின் ஆண்பால் குறிப்பைத் தக்கவைத்துள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட நேரடி கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அவ்வாறே’ முந்தைய அறிவுரைகளுடனான தொடுப்பைத் தக்கவைக்கிறது; ‘அறிவுறுத்து’ திருச்சபைச் சொல்வழக்கில் மிகத் தொழில்நுட்பமாக ஒலிக்காமல் παρακάλει என்பதின் வலிமையை வழங்குகிறது.
