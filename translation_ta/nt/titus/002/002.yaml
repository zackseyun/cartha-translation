revisions:
- from: முதிய ஆண்கள் நிதானமுள்ளவர்களாகவும், கண்ணியமுள்ளவர்களாகவும், தன்னடக்கமுள்ளவர்களாகவும், விசுவாசத்திலும்[a] அன்பிலும் பொறுமையுடன் நிலைத்திருப்பதிலும் உறுதியானவர்களாகவும் இருக்க வேண்டும்.
  to: முதிய ஆண்கள் நிதானமுள்ளவர்களாகவும், கண்ணியமுள்ளவர்களாகவும், தன்னடக்கமுள்ளவர்களாகவும், விசுவாசத்திலும்[a] அன்பிலும் நிலைத்திருப்பதிலும் உறுதியானவர்களாகவும் இருக்க வேண்டும்.
  rationale: The revision preserves the virtue-list structure and makes ‘உறுதியானவர்களாக’ govern each of the three coordinated spheres—faith, love, and endurance. It removes the added adverbial ‘பொறுமையுடன்,’ while ‘நிலைத்திருப்பதில்’ naturally conveys ὑπομονή as steadfast endurance. The footnote is retained with a slightly smoother Tamil connective.
