id: TIT.2.2
reference: Titus 2:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πρεσβύτας νηφαλίους εἶναι, σεμνούς, σώφρονας, ὑγιαίνοντας τῇ πίστει, τῇ ἀγάπῃ, τῇ ὑπομονῇ.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/002.yaml
  text: Older men are to be temperate[a], dignified, self-controlled, sound in faith, in love, and in steadfastness.
translation:
  language: ta
  text: முதிய ஆண்கள் நிதானமுள்ளவர்களாகவும், கண்ணியமுள்ளவர்களாகவும், தன்னடக்கமுள்ளவர்களாகவும், விசுவாசத்திலும்[a] அன்பிலும் நிலைத்திருப்பதிலும் உறுதியானவர்களாகவும் இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உண்மைத்தன்மையில்.” கிரேக்கச் சொல்லான πίστις, சூழலைப் பொறுத்து “விசுவாசம்” அல்லது “உண்மைத்தன்மை” என்று பொருள்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: πρεσβύτας
  choice: முதிய ஆண்கள்
  rationale: இங்கு திருச்சபைப் பதவியான ‘மூப்பர்கள்’ குறிக்கப்படவில்லை; வயதில் முதிர்ந்த ஆண்களே குறிக்கப்படுகிறார்கள். ‘முதிய ஆண்கள்’ என்பது இதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: νηφαλίους
  choice: நிதானமுள்ளவர்கள்
  rationale: மது அருந்தாதிருத்தலை மட்டும் குறுக்காமல், தெளிந்த சிந்தனையையும் அளவான நடத்தையையும் உள்ளடக்கும் விரிவான அறநெறிப் பொருளை ‘நிதானமுள்ளவர்கள்’ வெளிப்படுத்துகிறது.
- source_word: σεμνούς
  choice: கண்ணியமுள்ளவர்கள்
  rationale: மற்றவர்களின் மதிப்பைப் பெறத்தக்க மதிப்பார்ந்த, பொறுப்பான நடத்தையை இச்சொல் இயல்பாகக் குறிக்கிறது.
- source_word: σώφρονας
  choice: தன்னடக்கமுள்ளவர்கள்
  rationale: கட்டுப்பாடான சிந்தனை, தீர்மானம், நடத்தை ஆகியவற்றை உள்ளடக்கும் இச்சொல்லுக்கு நவீனத் தமிழில் தெளிவான இணை இது.
- source_word: ὑγιαίνοντας
  choice: உறுதியானவர்கள்
  rationale: சொல்லின் அடிப்படை உருவகம் ‘ஆரோக்கியமாக இருத்தல்’ என்பதாக இருந்தாலும், விசுவாசம், அன்பு, நிலைத்திருத்தல் ஆகிய பண்புகளுடன் தமிழில் ‘உறுதியானவர்கள்’ என்பது கருத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τῇ πίστει
  choice: விசுவாசத்தில்
  rationale: πίστις என்பதற்கான முதன்மைப் பொருளான ‘விசுவாசம்’ பிரதான உரையில் வைக்கப்படுகிறது; சூழலில் சாத்தியமான ‘உண்மைத்தன்மை’ என்ற பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: τῇ ἀγάπῃ
  choice: அன்பில்
  rationale: ἀγάπη என்பதன் நேரடியான, இயல்பான தமிழாக்கம் ‘அன்பு’; இணையான வேற்றுமை அமைப்பும் தக்கவைக்கப்படுகிறது.
- source_word: τῇ ὑπομονῇ
  choice: பொறுமையுடன் நிலைத்திருப்பதில்
  rationale: துன்பம் அல்லது அழுத்தத்தின் நடுவிலும் பொறுமையுடன் தொடர்ந்து நிலைத்திருப்பதை ὑπομονή குறிக்கிறது; வெறும் காத்திருக்கும் பொறுமையைவிட இந்தத் தொடர் முழுப் பொருளையும் தெளிவாக்குகிறது.
- source_word: εἶναι
  choice: இருக்க வேண்டும்
  rationale: முந்தைய வசனத்திலிருந்து தொடரும் அறிவுறுத்தலின் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பண்புகளின் பட்டியலில் πίστις என்பதன் பொருள்
  choice: விசுவாசம்
  alternative: உண்மைத்தன்மை
  rationale: விசுவாசம், அன்பு, பொறுமையுடன் நிலைத்திருத்தல் என்ற முத்தொடரில் πίστις என்பது கடவுள்மீதான விசுவாசத்தையோ ஒருவரின் உண்மைத்தன்மையையோ குறிக்கக்கூடும். பிரதான உரையில் ‘விசுவாசம்’ வைக்கப்பட்டு, உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான அறிவுறுத்தல் நடையில் அமைக்கப்பட்டது. பண்புகளின் பட்டியல் ‘-உள்ளவர்களாகவும்’ என்ற இணை அமைப்பால் ஓட்டமுடன் தரப்பட்டுள்ளது; இறுதி மூன்று பண்புகள் ὑγιαίνοντας என்பதின் ஆட்சிக்குள் ஒன்றிணைக்கப்பட்டுள்ளன.
