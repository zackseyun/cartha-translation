id: TIT.2.1
reference: Titus 2:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Σὺ δὲ λάλει ἃ πρέπει τῇ ὑγιαινούσῃ διδασκαλίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/001.yaml
  text: But as for you[a], speak the things that are fitting for sound teaching.
translation:
  language: ta
  text: ஆனால் நீயோ, ஆரோக்கியமான போதனைக்கு[a] ஏற்றவற்றைப் பேசு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆரோக்கியமான கோட்பாடு.’
    reason: διδασκαλία என்பது ‘போதனை’ அல்லது ‘கோட்பாடு’ என்றும், ὑγιαινούσῃ என்பது நேரடியாக ‘ஆரோக்கியமான’ என்றும் மொழிபெயர்க்கப்படலாம்.
lexical_decisions:
- source_word: Σὺ δὲ
  choice: ஆனால் நீயோ
  rationale: வெளிப்படையாக வரும் Σὺ என்பதும் δὲ என்பதும் முந்தைய பகுதியில் குறிப்பிடப்பட்டவர்களிலிருந்து தீத்துவை வேறுபடுத்தி வலியுறுத்துகின்றன. ‘ஆனால் நீயோ’ இந்த முரண்பாட்டையும் தலைப்புமாற்றத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: λάλει
  choice: பேசு
  rationale: இந்த வினைச்சொல் பொதுவாகப் ‘பேசு’ அல்லது ‘சொல்’ என்று பொருள்படும். இதை ‘போதித்துக்கொண்டிரு’ என்று குறுக்காமல், கட்டளையின் விரிவான பொருளை ‘பேசு’ காக்கிறது.
- source_word: ἃ πρέπει
  choice: ஏற்றவற்றை
  rationale: ἃ என்பது பன்மையான ‘அவற்றை’ குறிக்கிறது; πρέπει என்பது பொருத்தமான அல்லது தகுந்தவற்றைக் குறிக்கிறது. ‘ஏற்றவற்றை’ இரண்டையும் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὑγιαινούσῃ
  choice: நலமான
  rationale: இது அடிப்படையில் ‘ஆரோக்கியமாக இருக்கிற’ என்ற உருவகத்தைத் தருகிறது. போதனையுடன் சேரும் இச்சூழலில், தவறற்றதும் பயனுள்ளதுமான போதனையைச் சுட்டும் வகையில் ‘நலமான’ என்பது இயல்பான நவீன தமிழாக உள்ளது; மருத்துவப் பொருளை அளவுக்கு மீறி முன்னிறுத்துவதையும் தவிர்க்கிறது.
- source_word: διδασκαλίᾳ
  choice: போதனைக்கு
  rationale: διδασκαλία என்பது போதிக்கும் செயல் அல்லது போதனையின் உள்ளடக்கம் ஆகிய இரண்டையும் குறிக்கலாம். ‘போதனை’ இந்தத் தெளிவின்மையை ஓரளவு காத்து, ‘கோட்பாடு’ என்பதைக் காட்டிலும் பொதுவாசகர்களுக்கு எளிதாகப் புரிகிறது.
theological_decisions:
- issue: τῇ ὑγιαινούσῃ διδασκαλίᾳ என்ற சொற்றொடரின் மொழிபெயர்ப்பு
  choice: நலமான போதனை
  alternative: ஆரோக்கியமான கோட்பாடு
  rationale: ‘நலமான போதனை’ என்பது மூலத்தின் ஆரோக்கிய உருவகத்தையும் அப்போஸ்தலரின் நம்பத்தகுந்த அறிவுறுத்தல் என்ற கருத்தையும் இயல்பான தமிழில் தெரிவிக்கிறது. ‘கோட்பாடு’ என்ற மாற்று, போதனையின் உள்ளடக்கத்தைத் தெளிவுபடுத்தினாலும், διδασκαλία என்பதைக் கருத்தியல் தொகுப்பாக மட்டும் குறுக்கக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் தெளிவும் கொண்ட நேரடியான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நீயோ’ மூலத்தில் உள்ள எதிர்மறை ஒப்பீட்டு வலியுறுத்தலைக் காக்கிறது; ‘நலமான போதனை’ திருச்சபைச் சிறப்புச்சொற்களைத் தேவையின்றி பெருக்காமல் பொதுவாசகர்களுக்கும் புரியும்படி அமைந்துள்ளது.
