id: TIT.2.10
reference: Titus 2:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μὴ νοσφιζομένους, ἀλλὰ ⸂πᾶσαν πίστιν⸃ ἐνδεικνυμένους ἀγαθήν, ἵνα τὴν διδασκαλίαν ⸀τὴν τοῦ σωτῆρος ἡμῶν θεοῦ κοσμῶσιν ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/010.yaml
  text: not pilfering[a], but showing all good faith, so that in everything they may adorn the teaching of God our Savior.
translation:
  language: ta
  text: திருடாமல், மாறாக எல்லா வகையிலும் நல்ல நம்பகத்தன்மையைக் காட்டி, நம் மீட்பரான கடவுளின் போதனைக்கு எல்லாவற்றிலும் அழகு சேர்க்க வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νοσφιζομένους
  choice: திருடாமல்
  rationale: பிறருக்குரியதைத் தமக்கென எடுத்துக்கொள்வதை இச்சூழலில் குறிக்கிறது. ‘திருடாமல்’ என்பது இன்றைய வாசகர்களுக்குத் தெளிவான, இயல்பான சொல்.
- source_word: πᾶσαν πίστιν ἐνδεικνυμένους ἀγαθήν
  choice: முழுமையான நம்பகத்தன்மையைக் காட்டி
  rationale: இங்கு πίστις என்பது எஜமானர்களிடம் நடத்தையில் காட்டப்படும் உண்மைத்தன்மை அல்லது நம்பகத்தன்மையை முதன்மையாகக் குறிக்கிறது; πᾶσαν அதன் முழுமையையும், ἀγαθήν அதன் நல்ல தன்மையையும் வலியுறுத்துகிறது.
- source_word: κοσμῶσιν
  choice: அழகு சேர்க்கும்படி
  rationale: ‘அலங்கரித்தல், அழகூட்டுதல்’ என்ற உருவகத்தை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: διδασκαλίαν
  choice: போதனை
  rationale: διδασκαλία என்பதன் பொருளைத் தெளிவாகவும் வழக்கமான தமிழிலும் தருகிறது.
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: நம் மீட்பரான கடவுளின்
  rationale: கிரேக்கத் தொடரில் கடவுளே ‘நம் மீட்பர்’ என்று அழைக்கப்படுவதை நேரடியாகக் காக்கிறது; இவ்வசனத்தில் வெளிப்படையாக இல்லாத வேறு அடையாளத்தைச் சேர்ப்பதில்லை.
- source_word: ἐν πᾶσιν
  choice: எல்லாவற்றிலும்
  rationale: நடத்தையின் எல்லாப் பகுதிகளையும் உள்ளடக்கும் கிரேக்கச் சொல்லின் பரந்த பொருளைக் காக்கிறது.
theological_decisions:
- issue: ஒழுக்கநடத்தைச் சூழலில் πίστις என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘நம்பகத்தன்மை’
  alternative: ‘விசுவாசம்’ அல்லது ‘உண்மைத்தன்மை’
  rationale: இங்கு திருடாமை மற்றும் எஜமானரிடம் காட்ட வேண்டிய நடத்தை பற்றிப் பேசப்படுவதால், நம்பகத்தன்மை என்பதே சூழலுக்கு ஏற்ற முதன்மைப் பொருள். எனினும் πίστις என்பதன் வழக்கமான ‘விசுவாசம்’ என்ற பொருளும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ‘நம் மீட்பரான கடவுள்’ என்பவரின் குறிப்பு
  choice: கடவுளை ‘நம் மீட்பர்’ என்று நேரடியாகக் குறிப்பிடுதல்
  alternative: மேய்ப்புக் கடிதங்களின் விரிந்த சூழலில் ‘மீட்பர்’ என்னும் பட்டம் கிறிஸ்துவுக்கும் பயன்படுத்தப்படுவதை இங்கே வெளிப்படையாக்குதல்
  rationale: இந்தக் கூறு வெளிப்படையாகச் சொல்வதை மட்டும் மொழிபெயர்த்து, இவ்வசனத்தில் இல்லாத கிறிஸ்துவியல் அடையாளத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமப் போதனைக்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. ‘அழகு சேர்க்க’ என்பது மூலத்தின் உருவகத்தைத் தக்கவைக்கிறது.
