    text: ‘முழுமையான உண்மைத்தன்மையைக் காட்டி’ அல்லது ‘முற்றிலும் நம்பத்தக்கவர்களாய் இருப்பதைக் காட்டி’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் πίστις என்ற சொல் உள்ளது; அது பல இடங்களில் ‘விசுவாசம்’ என்று மொழிபெயர்க்கப்பட்டாலும், இங்கு உண்மையுடனும் நம்பகமாகவும் நடந்துகொள்வதைக் குறிக்க வாய்ப்பு அதிகம்.
