translation:
  language: ta
  text: 'அது நம்மைப் பயிற்றுவிக்கிறது[a]—இறைப்பற்றின்மையையும் உலகத்துக்குரிய ஆசைகளையும்[b] துறந்துவிட்டு, இப்போதைய யுகத்தில் தன்னடக்கத்தோடும், நீதியோடும், இறைப்பற்றோடும்[c] நாம் வாழும்படி.


    [a] “அறிவுறுத்துகிறது” அல்லது “ஒழுக்கப்படுத்துகிறது” என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல், ஒருவரின் பண்பையும் நடத்தையையும் உருவாக்கும் பயிற்சியைக் குறிக்கிறது.

    [b] “உலகத்துக்குரிய இச்சைகளையும்” என்றும் மொழிபெயர்க்கலாம்.

    [c] கிரேக்கத்தில் இவை மூன்றும் “தன்னடக்கமாகவும், நீதியாகவும், இறைப்பற்றுடனும்” என்று ‘வாழ்வதை’ விவரிக்கும் வினையுரிச்சொற்களாக உள்ளன.'
  philosophy: optimal-equivalence
