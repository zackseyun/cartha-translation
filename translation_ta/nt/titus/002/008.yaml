id: TIT.2.8
reference: Titus 2:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λόγον ὑγιῆ ἀκατάγνωστον, ἵνα ὁ ἐξ ἐναντίας ἐντραπῇ μηδὲν ἔχων ⸂λέγειν περὶ ἡμῶν⸃ φαῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/008.yaml
  text: sound speech that cannot be condemned[a], so that the one who opposes us may be put to shame[c][b], having nothing evil to say about us.
translation:
  language: ta
  text: கண்டனத்துக்கு இடமில்லாத[a] நலமான பேச்சைப் பேசு[b]; அப்பொழுது எதிர்ப்பவர்[c], நம்மைப் பற்றி எந்தத் தீயதையும் சொல்ல எதுவும் இல்லாமல் வெட்கமடையும்படி இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘குற்றஞ்சாட்ட முடியாத’ அல்லது ‘குறைகூற இடமளிக்காத.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நலமான சொல்’ அல்லது ‘நலமான செய்தி.’
    reason: lexical_alternative
  - marker: c
    text: கிரேக்கத்தில், ‘எதிர்த் தரப்பைச் சேர்ந்தவர்’; அதாவது, எதிர்ப்பவர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγον
  choice: பேச்சை
  rationale: இங்கு ஒரு தனிச்சொல்லை அல்ல, தீத்து போதிக்கும்போது பயன்படுத்தும் பேச்சின் உள்ளடக்கத்தையும் முறையையும் குறிக்கிறது. ‘பேச்சு’ என்பது நவீன தமிழில் இயல்பாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: ὑγιῆ
  choice: நலமான
  rationale: உடல்நல உருவகத்தை முழுமையாகக் கைவிடாமல், கோட்பாட்டு மற்றும் ஒழுக்க ரீதியான சீர்மையைக் குறிக்கும் வகையில் இயல்பான தமிழில் தருகிறது.
- source_word: ἀκατάγνωστον
  choice: கண்டனத்துக்கு இடமில்லாத
  rationale: நியாயமான கண்டனத்திற்கோ குற்றச்சாட்டிற்கோ உட்படுத்த முடியாத தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἵνα
  choice: அப்போது … வெட்கமடைவார்
  rationale: கிரேக்கத்தின் நோக்கம் அல்லது விளைவு சார்ந்த தொடர்பைத் தமிழில் இயல்பான விளைவு வாக்கியமாகக் காட்டுகிறது; முன்சொல்லப்பட்ட பேச்சுக்கும் எதிராளியின் வெட்கத்துக்கும் உள்ள தொடர்பு நிலைத்திருக்கிறது.
- source_word: ὁ ἐξ ἐναντίας
  choice: எதிர்த்தரப்பில் இருப்பவர்
  rationale: ‘எதிர்ப்புறத்திலிருந்து இருப்பவர்’ என்ற கிரேக்கச் சொல்லோட்டத்தைத் தெளிவான, இயல்பான தமிழில் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: ἐντραπῇ
  choice: வெட்கமடைவார்
  rationale: எதிர்ப்பவர் தமது குற்றச்சாட்டுக்கு ஆதாரம் இல்லாததால் வெட்கத்துக்குள்ளாவதைச் சொல்கிறது; வெறும் சங்கடத்தைவிடச் சமூக-ஒழுக்க வலிமையைப் பாதுகாக்கிறது.
- source_word: μηδὲν ἔχων λέγειν
  choice: எதையும் சொல்ல வழியில்லாமல்
  rationale: சொல்லத்தக்க குற்றச்சாட்டு எதுவும் அவரிடம் இல்லை என்பதைக் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: περὶ ἡμῶν
  choice: நம்மைப் பற்றி
  rationale: மூலத்திலுள்ள முதல் நபர் பன்மையை அதன் வரம்பை விரிவுபடுத்தாமலும் சுருக்காமலும் அப்படியே காக்கிறது.
- source_word: φαῦλον
  choice: தீமையானது
  rationale: ஒழுக்க ரீதியில் தீயதையும் பழிக்கத்தக்க குற்றச்சாட்டையும் குறிக்கும் சொல்லின் வலிமையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: περὶ ἡμῶν என்பதிலுள்ள முதல் நபர் பன்மையின் வரம்பு
  choice: ‘நம்மைப் பற்றி’ என்று மட்டும் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘உன்னைப் பற்றி’, ‘கிறிஸ்தவர்களாகிய நம்மைப் பற்றி’, அல்லது ‘நமது போதனையைப் பற்றி’
  rationale: கிரேக்க மூலத்தில் முதல் நபர் பன்மை மட்டுமே உள்ளது. அது பவுல், தீத்து, அல்லது விரிந்த கிறிஸ்தவச் சமூகத்தில் யாரையெல்லாம் உள்ளடக்குகிறது என்பதை மொழிபெயர்ப்பில் தீர்மானிக்காமல் மூலத்தின் திறந்த தன்மை காக்கப்படுகிறது.
- issue: ἐντραπῇ என்பதன் செயப்படுபொருள்/நிலை சார்ந்த நுணுக்கம்
  choice: ‘வெட்கமடைவார்’
  alternative: ‘வெட்கப்படுத்தப்படுவார்’
  rationale: கிரேக்க வடிவம் எதிர்ப்பவர் வெட்கத்துக்குள்ளாவதைச் சுட்டுகிறது. தமிழில் ‘வெட்கமடைவார்’ என்பது இயல்பானது; அவரை மனிதர்கள் திட்டமிட்டு அவமானப்படுத்துகிறார்கள் என்ற தேவையற்ற கருத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் முந்தைய வசனத்தின் அறிவுறுத்தலைத் தொடர்வதால், தமிழில் முழுமையான கட்டளை வாக்கியமாக இயல்பாக்க ‘வழங்கு’ சேர்க்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறியீடுகளும் அவற்றுக்குரிய சொற்றொடர்களின் அருகில் முதன்மை உரையில் இடம்பெற்றுள்ளன.
