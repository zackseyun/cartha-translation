  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἐπεφάνη γὰρ ἡ χάρις τοῦ ⸀θεοῦ σωτήριος πᾶσιν ἀνθρώποις
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/011.yaml
  text: For the grace of God has appeared[b][a], bringing salvation to all people.
translation:
  language: ta
  text: ஏனெனில், மக்கள் அனைவருக்கும் மீட்பைக் கொண்டுவரும் கடவுளின் அருள் வெளிப்பட்டுள்ளது.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை, “மக்கள் அனைவரையும் மீட்கும் கடவுளின் அருள் வெளிப்பட்டுள்ளது” என்றோ, “கடவுளின் மீட்பளிக்கும் அருள் மக்கள் அனைவருக்கும் வெளிப்பட்டுள்ளது” என்றோ மொழிபெயர்க்கவும் இயலும். ‘மீட்பளிக்கும்’ என்று பொருள்படும் கிரேக்கப் பெயரடையையும் ‘மக்கள் அனைவருக்கும்’ என்ற வேற்றுமைத் தொடரையும் ஒன்றோடொன்று சற்றே வேறுபட்ட விதங்களில் தொடர்புபடுத்திப் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: “மக்கள்” என்பதற்கான கிரேக்கச் சொல் இங்கு ஆண்களை மட்டும் அல்லாமல் மனிதர்கள் அனைவரையும் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπεφάνη
  choice: வெளிப்பட்டுள்ளது
  rationale: இறந்தகால நிகழ்வையும் அதன் தொடரும் முக்கியத்துவத்தையும் இயல்பான தமிழில் தெரிவிக்கிறது; ‘தோன்றியது’ என்பதைவிட வெளிப்படுதல் என்ற கருத்தைத் தெளிவாகக் காக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான அடிப்படையையோ விளக்கத்தையோ அறிமுகப்படுத்தும் இணைப்பைத் தெளிவாகத் தருகிறது.
- source_word: ἡ χάρις τοῦ θεοῦ
  choice: கடவுளின் அருள்
  rationale: மூலத்தின் உரிமை/தொடர்பு அமைப்பைப் பேணி, பவுலின் பயன்பாட்டில் உள்ள தெய்வீகத் தயவு மற்றும் செயலாற்றும் கொடை ஆகிய நுணுக்கங்களைச் சுருக்கமாகக் கொண்டுள்ளது.
- source_word: σωτήριος
  choice: மீட்பைக் கொண்டுவரும்
  rationale: அருளின் மீட்பளிக்கும் தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘மீட்புக்குரிய’ போன்ற செயற்கையான சொல்லாக்கத்தைத் தவிர்க்கிறது.
- source_word: πᾶσιν ἀνθρώποις
  choice: மக்கள் அனைவருக்கும்
  rationale: ἄνθρωποι இங்கு ஆண்களை மட்டும் அல்லாமல் மனிதகுலத்தைக் பொதுவாகக் குறிக்கிறது. ‘அனைவருக்கும்’ என்பது வசனத்தின் பரந்த நோக்கத்தைச் சுருக்காமல் காக்கிறது.
theological_decisions:
- issue: πᾶσιν ἀνθρώποις என்பதற்கும் மீட்பிற்கும் இடையிலான தொடர்பின் பரப்பு
  choice: ‘மக்கள் அனைவருக்கும்’ என்று பரந்த பொருளில் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘எல்லா வகையான மக்களுக்கும்’ அல்லது ‘மக்கள் அனைவருக்கும் வெளிப்பட்டது’
  rationale: கிரேக்க வாசகம் உலகளாவிய பரப்பைக் கூறுகிறது; ஆனால் ஒவ்வொரு தனிநபரையும் விதிவிலக்கின்றி குறிக்கிறதா அல்லது எல்லா வகுப்பு மக்களையும் குறிக்கிறதா என்ற இறையியல் விவாதத்தை மொழிபெயர்ப்பு தானாகத் தீர்மானிக்கக் கூடாது.
- issue: σωτήριος மற்றும் πᾶσιν ἀνθρώποις ஆகியவற்றின் இலக்கணத் தொடர்பு
  choice: ‘மக்கள் அனைவருக்கும் மீட்பைக் கொண்டுவரும்’ என்று σωτήριος என்பதை அருளோடு இணைத்துப் புரிந்துகொள்ளப்பட்டது.
  alternative: ‘மக்கள் அனைவரையும் மீட்கும்’ அல்லது ‘மக்கள் அனைவருக்கும் வெளிப்பட்ட’
  rationale: σωτήριος என்ற பெயரடை மற்றும் வேற்றுமைத் தொடர் பலவிதமாகச் சேர்த்துப் புரிந்துகொள்ளப்படலாம். முதன்மை உரை இயல்பான வாசிப்பை அளிக்கிறது; மாற்று வாய்ப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இரட்சிப்பு’ என்பதற்குப் பதிலாக பரந்த தமிழ்ப் பயன்பாட்டிற்கு இயல்பான ‘மீட்பு’ தேர்ந்தெடுக்கப்பட்டது; எந்தச் சமயப்பிரிவின் தனிப்பட்ட மீட்பியல் விளக்கமும் உரைக்குள் சேர்க்கப்படவில்லை.
