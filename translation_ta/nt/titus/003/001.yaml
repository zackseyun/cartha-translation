source:
  edition: SBLGNT
  text: Ὑπομίμνῃσκε αὐτοὺς ⸀ἀρχαῖς ἐξουσίαις ὑποτάσσεσθαι πειθαρχεῖν, πρὸς πᾶν ἔργον ἀγαθὸν ἑτοίμους εἶναι,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/001.yaml
  text: Remind them to be subject to rulers and authorities[a], to be obedient, to be ready for every good work,
translation:
  language: ta
  text: ஆட்சியாளர்களுக்கும் அதிகாரிகளுக்கும் உட்பட்டு, அவர்களுக்குக் கீழ்ப்படியவும், ஒவ்வொரு நற்செயலுக்கும் ஆயத்தமாக இருக்கவும் அவர்களுக்கு நினைவூட்டு.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆட்சியாளர்களுக்கும் அதிகாரிகளுக்கும் கீழ்ப்பட்டு, அவர்களுக்குக் கீழ்ப்படியவும்.”
    reason: ὑποτάσσεσθαι என்பதற்கு ‘உட்பட்டு’ என்பதற்குப் பதிலாக ‘கீழ்ப்பட்டு’ என்ற நெருக்கமான மாற்று வழங்கப்படுகிறது; πειθαρχεῖν-இன் தனித்த ‘கீழ்ப்படியவும்’ என்ற பொருள் காக்கப்படுகிறது.
lexical_decisions:
- source_word: Ὑπομίμνῃσκε
  choice: நினைவூட்டு
  rationale: நிகழ்காலக் கட்டளை வடிவம் தொடர்ந்து நினைவூட்டும் பணியைச் சுட்டுகிறது; தமிழில் ‘நினைவூட்டு’ இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: αὐτοὺς
  choice: அவர்களுக்கு
  rationale: தீத்து அறிவுறுத்த வேண்டிய கிரேத்தா விசுவாசிகளைச் சுட்டும் பன்மைப் பதிலிப்பெயர்; தமிழ் வாக்கிய அமைப்பில் ‘நினைவூட்டு’ என்பதுடன் நான்காம் வேற்றுமை இயல்பானது.
- source_word: ἀρχαῖς
  choice: ஆட்சியாளர்கள்
  rationale: இக்குடிமைச் சூழலில் விண்ணுலக வல்லமைகளை அல்ல, ஆளும் தலைவர்களையோ ஆட்சிப் பொறுப்பில் இருப்பவர்களையோ குறிக்கிறது.
- source_word: ἐξουσίαις
  choice: அதிகாரத்தில் இருப்பவர்கள்
  rationale: ἀρχαῖς என்பதுடன் இணைந்து ஆட்சி அதிகாரம் கொண்டவர்களைக் குறிக்கிறது; இரு கிரேக்கச் சொற்களின் வேறுபாட்டை முற்றிலும் ஒன்றாக்காமல் காக்கிறது.
- source_word: ὑποτάσσεσθαι
  choice: கீழ்ப்படிந்து நடக்கவும்
  rationale: ஒழுங்கமைந்த அதிகாரத்துக்கு உட்பட்டு நடப்பதைக் குறிக்கிறது. ‘கீழ்ப்படிந்து நட’ என்பது நவீன தமிழில் இயல்பாக இருந்து, அடிமைத்தனத்தை அவசியமாக உணர்த்தாது.
- source_word: πειθαρχεῖν
  choice: சொல்வதைக் கேட்கவும்
  rationale: அதிகாரத்தில் இருப்போருக்குச் செவிகொடுத்து நடப்பது என்ற பொருளை இயல்பான தமிழில் தருகிறது; இதனை முந்தைய வினையுடன் ஒன்றாக்காமல் தனியே வைத்துள்ளது.
- source_word: πρὸς πᾶν ἔργον ἀγαθὸν
  choice: ஒவ்வொரு நற்செயலையும் செய்ய
  rationale: எல்லா நல்ல செயல்களையும் நோக்கிய ஆயத்தநிலையைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἑτοίμους εἶναι
  choice: ஆயத்தமாக இருக்கவும்
  rationale: ஒரு தொடர்ந்த தயார் நிலையைக் குறிக்கும்; ‘ஆயத்தமாக’ என்பது கண்ணியமான, பொதுவாகப் புரியும் தமிழ்ச் சொல்.
theological_decisions:
- issue: குடிமை ஆட்சி அமைப்புகளுக்குக் கீழ்ப்படிதலின் வரம்பு
  choice: ஆட்சியாளர்களுக்கும் அதிகாரத்தில் இருப்பவர்களுக்கும் கீழ்ப்படிந்து, அவர்கள் சொல்வதைக் கேட்க வேண்டும் என்ற பொதுவான அறிவுறுத்தலாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: எந்தச் சூழலிலும் விதிவிலக்கின்றி முழுமையாகக் கீழ்ப்படிய வேண்டும் என்று வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: வசனம் குடிமை அதிகாரத்துக்குக் கீழ்ப்படிதலைத் தெளிவாகக் கூறினாலும், அதன் வரம்புகளை இங்கே விளக்கவில்லை. ஆகவே கீழ்ப்படிதலை வலியுறுத்தியபடியே, மூலத்தில் இல்லாத ‘நிபந்தனையற்ற’ என்ற கருத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கொண்டுள்ளது. கிரேக்கத்தின் கட்டளைத் தொடர் காக்கப்பட்டுள்ளது; அரசியல் அதிகாரத்துக்குக் கீழ்ப்படிதலின் வரம்பைப் பற்றி மூலவசனம் கூறாத விளக்கங்கள் சேர்க்கப்படவில்லை.
