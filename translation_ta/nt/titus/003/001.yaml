- from: ஆட்சியாளர்களுக்கும் அதிகாரத்தில் இருப்பவர்களுக்கும் கீழ்ப்படிந்து நடக்கவும், சொல்வதைக் கேட்கவும், ஒவ்வொரு நற்செயலையும் செய்ய ஆயத்தமாக இருக்கவும் அவர்களுக்கு நினைவூட்டு.[a]
  to: ஆட்சியாளர்களுக்கும் அதிகாரிகளுக்கும் உட்பட்டு, அவர்களுக்குக் கீழ்ப்படியவும், ஒவ்வொரு நற்செயலுக்கும் ஆயத்தமாக இருக்கவும் அவர்களுக்கு நினைவூட்டு.[a]
