lexical_decisions:
- source_word: οὗ
  choice: அவரை
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட தூய ஆவியைக் குறிக்கும் உறவுப்பெயர். தமிழ் வாக்கிய அமைப்பில் ἐξέχεεν என்பதன் செயப்படுபொருளாக ‘அவரை’ இயல்பாக அமைகிறது; ஆவியை ஆள்தன்மையுடன் குறிப்பிடுவதையும் இது காக்கிறது.
- source_word: ἐξέχεεν
  choice: பொழிந்தார்
  rationale: ἐκχέω என்பதன் அடிப்படைப் பொருளான ‘ஊற்றுதல்/பொழிதல்’ என்பதையும், ஆவியை அருளுவது குறித்த வேதாகம உருவகத்தையும் ‘பொழிந்தார்’ இயல்பாகத் தருகிறது.
- source_word: ἐφ’ ἡμᾶς
  choice: நம்மேல்
  rationale: ἐπί உடன் வரும் திசை அல்லது இலக்கைச் சுருக்கமாகவும் இயல்பான நவீன தமிழிலும் தெரிவிக்கிறது.
- source_word: πλουσίως
  choice: மிகுதியாக
  rationale: அளவின் நிறைவையும் பெருக்கத்தையும் தெளிவாகக் காட்டுகிறது; இச்சூழலில் ‘செழுமையாக’ என்பதைவிட இயல்பான தமிழ்.
- source_word: διὰ
  choice: வழியாக
  rationale: மூலம் அல்லது இடைமுகச் செயலாற்றலைக் குறிக்கும் διά + மரபுவேற்றுமையின் பொருளை இயல்பாகக் காக்கிறது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: மெசியாவாகிய இயேசுவின்
  rationale: Χριστός என்பதை பெயரின் ஓர் அங்கமாக மட்டும் ஒலிபெயர்க்காமல் ‘மெசியா’ என்ற பட்டமாகத் தருகிறது. தமிழில் பட்டத்தையும் நபரின் பெயரையும் இயல்பாக இணைக்க ‘மெசியாவாகிய இயேசு’ என அமைக்கப்பட்டுள்ளது.
- source_word: τοῦ σωτῆρος ἡμῶν
  choice: நம் மீட்பரான
  rationale: σωτήρ என்ற இரட்சிப்பு/மீட்புப் பட்டத்தையும் ἡμῶν என்ற உடைமைப் பொருளையும் சுருக்கமான, இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: οὗ என்ற உறவுப்பெயரின் சுட்டுப்பொருள்
  choice: முந்தைய வசனத்தில் உள்ள தூய ஆவியைக் குறிக்கும் ஆள்தன்மையுள்ள ‘அவரை’
  alternative: ஆள்தன்மையை வெளிப்படுத்தாமல் ‘அதை’ என்று மொழிபெயர்த்தல்
  rationale: உடனடி முன்னிலைச் சொல் தூய ஆவி. கிரேக்க வடிவம் இலக்கண ரீதியாக ஆண்பால் அல்லது நடுப்பாலாக இருக்கக்கூடியதால் அடிப்படை வடிவத்தில் ஒரு தெளிவின்மை உள்ளது; இருப்பினும் தமிழில் ‘அவரை’ என்பது சுட்டுப்பொருளையும் புதிய ஏற்பாட்டின் ஆவியைப் பற்றிய ஆள்தன்மைமிக்க மொழியையும் இயல்பாக வெளிப்படுத்துகிறது. மாற்று வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: Χριστοῦ என்பதன் மொழிபெயர்ப்பு
  choice: மெசியாவாகிய
  alternative: கிறிஸ்துவாகிய / இயேசு கிறிஸ்து
  rationale: இங்கு Χριστός, ‘நம் மீட்பர்’ என்ற மற்றொரு பட்டத்துடன் தொடர்புடைய மெசியாப் பட்டமாக விளங்குகிறது. ஆகவே அதன் பொருளை மொழிபெயர்த்து, மரபான வடிவத்தை அடிக்குறிப்பில் தருவது பொருத்தமானது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுமக்கள் எளிதில் புரிந்துகொள்ளக்கூடிய தமிழ் பயன்படுத்தப்பட்டுள்ளது. முந்தைய வசனத்துடன் தொடரும் சார்பு வாக்கிய அமைப்பும், கிரேக்கத்தில் வெளிப்படையாகச் சொல்லப்படாத எழுவாயும் அப்படியே விடப்பட்டுள்ளன.
