source:
  edition: SBLGNT
  text: ἦμεν γάρ ποτε καὶ ἡμεῖς ἀνόητοι, ἀπειθεῖς, πλανώμενοι, δουλεύοντες ἐπιθυμίαις καὶ ἡδοναῖς ποικίλαις, ἐν κακίᾳ καὶ φθόνῳ διάγοντες, στυγητοί, μισοῦντες ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/003.yaml
  text: For we ourselves also were once foolish[a], disobedient, being led astray, enslaved to various desires and pleasures, spending our lives in malice and envy, hateful[b], hating one another.
translation:
  language: ta
  text: ஏனெனில், நாமும்கூட ஒருகாலத்தில் அறிவற்றவர்களாகவும், கீழ்ப்படியாதவர்களாகவும், வழிதவறச் செய்யப்பட்டவர்களாகவும்[a], பலவகையான ஆசைகளுக்கும் இன்பங்களுக்கும் அடிமைப்பட்டவர்களாகவும், தீய எண்ணங்களிலும் பொறாமையிலும் வாழ்க்கையைக் கழிப்பவர்களாகவும், வெறுக்கத்தக்கவர்களாகவும்[b], ஒருவரையொருவர் வெறுப்பவர்களாகவும் இருந்தோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஏமாற்றப்பட்டவர்களாகவும்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘வெறுக்கப்பட்டவர்களாகவும்.’ கிரேக்கப் பெயரடை ‘வெறுக்கத்தக்கவர்கள்’ என்றும் ‘வெறுக்கப்பட்டவர்கள்’ என்றும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦμεν γάρ ποτε καὶ ἡμεῖς
  choice: ஏனெனில், நாமும்கூட ஒருகாலத்தில் ... இருந்தோம்
  rationale: γάρ முந்தைய கூற்றுடனான காரணத் தொடர்பைச் சுட்டுவதால் ‘ஏனெனில்’ என மொழிபெயர்க்கப்பட்டது. καὶ ἡμεῖς தரும் உள்ளடக்கும் வலியுறுத்தலை ‘நாமும்கூட’ என்பதும், ποτε தரும் காலக் குறிப்பை ‘ஒருகாலத்தில்’ என்பதும் காக்கின்றன.
- source_word: ἀνόητοι
  choice: அறிவற்றவர்களாக
  rationale: புரிந்துணர்வும் ஒழுக்க விவேகமும் இல்லாத நிலையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; வெறும் அறிவுத்திறன் குறைவு என்ற பொருளுக்குள் சுருக்கவில்லை.
- source_word: ἀπειθεῖς
  choice: கீழ்ப்படியாதவர்களாக
  rationale: நம்ப மறுத்தல் அல்லது இணங்க மறுத்தல் வழியாக வெளிப்படும் கீழ்ப்படியாமையை இச்சூழலில் தெளிவாகத் தருகிறது.
- source_word: πλανώμενοι
  choice: வழிதவறச் செய்யப்பட்டவர்களாக
  rationale: இறந்தகால முதன்மை வினையுடன் வரும் நிகழ்காலப் பங்கேற்பு வடிவத்தின் passive/middle நிழலைக் காத்து, அறிவுசார் ஏமாற்றம் மட்டும் என்று பொருளைக் குறுக்கவில்லை.
- source_word: δουλεύοντες
  choice: அடிமைப்பட்டவர்களாக
  rationale: ஆசைகளும் இன்பங்களும் ஆளும் பிணைநிலையை வலுவாக வெளிப்படுத்துகிறது; சாதாரணமாக ‘சேவை செய்தோம்’ என்று மெலிதாக்கவில்லை.
- source_word: ἐπιθυμίαις καὶ ἡδοναῖς ποικίλαις
  choice: பலவகையான ஆசைகளுக்கும் இன்பங்களுக்கும்
  rationale: ἐπιθυμίαις என்பது பாலியல் இச்சையை மட்டும் குறிக்காத விரிவான சொல் என்பதால் ‘ஆசைகள்’ எனவும், ἡδοναῖς என்பதை ‘இன்பங்கள்’ எனவும் வழங்குகிறது. ποικίλαις இரண்டையும் கருத்தளவில் வரையறுப்பதை ‘பலவகையான’ காட்டுகிறது.
- source_word: ἐν κακίᾳ καὶ φθόνῳ διάγοντες
  choice: தீய நோக்கத்திலும் பொறாமையிலும் வாழ்க்கையைக் கழிப்பவர்களாக
  rationale: διάγοντες என்பதின் நீடித்த வாழ்க்கை நடத்தையை ‘வாழ்க்கையைக் கழிப்பவர்களாக’ வெளிப்படுத்துகிறது. நபர்களுக்கிடையேயான தீங்குநினைவை κακία இங்கு சுட்டுவதால் ‘தீய நோக்கம்’ எனவும், φθόνος என்பதை ‘பொறாமை’ எனவும் தருகிறது.
- source_word: στυγητοί
  choice: வெறுக்கத்தக்கவர்களாக
  rationale: இழிவான அல்லது அருவருப்பான தன்மையால் வெறுப்புக்குரியவர்கள் என்ற active sense-ஐ இயல்பாகத் தருகிறது; passive பொருளான ‘வெறுக்கப்பட்டவர்கள்’ அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: μισοῦντες ἀλλήλους
  choice: ஒருவரையொருவர் வெறுப்பவர்களாக
  rationale: பங்கேற்பு வடிவத்தையும் பரஸ்பரச் செயலையும் நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: உயிரற்ற எஜமான்களான ஆசைகளுக்கும் இன்பங்களுக்கும் δουλεύοντες காட்டும் அடிமைத்தனத்தின் வலிமை
  choice: பலவகையான ஆசைகளுக்கும் இன்பங்களுக்கும் அடிமைப்பட்டவர்களாக
  alternative: பலவகையான ஆசைகளுக்கும் இன்பங்களுக்கும் சேவை செய்பவர்களாக
  rationale: முந்தைய ஒழுக்க வாழ்வை ஆசைகளின் ஆட்சிக்குட்பட்ட பிணைநிலையாக வசனம் சித்தரிக்கிறது. ‘அடிமைப்பட்டவர்கள்’ என்பது அந்த வலிமையைப் பாதுகாக்கிறது; ஆனால் உரைக்கு அப்பாற்பட்ட ஒரு குறிப்பிட்ட கோட்பாட்டு அமைப்பைச் சேர்க்கவில்லை.
- issue: στυγητοί என்பதின் active/passive தெளிவின்மை
  choice: வெறுக்கத்தக்கவர்களாக
  alternative: வெறுக்கப்பட்டவர்களாக
  rationale: தீய பண்புகளின் பட்டியலில் ‘வெறுக்கத்தக்கவர்கள்’ இயல்பாகப் பொருந்தி, அடுத்து வரும் ‘ஒருவரையொருவர் வெறுப்பவர்கள்’ என்பதோடு வலுவான தொடர்பை உருவாக்குகிறது. எனினும் கிரேக்கச் சொல் passive பொருளையும் ஏற்கக்கூடியதால் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்க வசனத்தின் தொடர்ச்சியான பண்புப் பட்டியல் ‘-வர்களாகவும்’ என்ற ஒரே இலக்கண அமைப்பால் காக்கப்பட்டுள்ளது. ‘வழிதவறச் செய்யப்பட்டவர்கள்’ மற்றும் ‘அடிமைப்பட்டவர்கள்’ மூலத்தின் வலுவான passive/bondage நிழல்களைத் தக்கவைக்கின்றன; στυγητοί என்பதின் உண்மையான இருபொருள் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
