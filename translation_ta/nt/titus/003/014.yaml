base_translation:
  language: en
  yaml_path: translation/nt/titus/003/014.yaml
  text: And let our people also learn to engage in good works for necessary needs[c][b][a], so that they may not be unfruitful.
translation:
  language: ta
  text: நம்மவர்களும்[a] அவசியமான தேவைகளைப் பூர்த்தி செய்வதற்காக[c] நற்செயல்களில் ஈடுபட[b] கற்றுக்கொள்ளட்டும்; அவர்கள் கனியற்றவர்களாக இருக்காதபடிக்கு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம்முடையவர்கள்” அல்லது “நம்முடைய மக்கள்.”
    reason: lexical_alternative
  - marker: b
    text: “நற்செயல்களில் ஈடுபட” என்பதற்கு, “நற்செயல்களில் முன்னின்று செயல்பட” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: c
    text: “அவசியமான தேவைகள்” என்பதற்கு, “அவசரத் தேவைகள்” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μανθανέτωσαν
  choice: கற்றுக்கொள்ளட்டும்
  rationale: மூன்றாம் நபர் பன்மை நிகழ்காலக் கட்டளை வடிவத்தின் அறிவுறுத்தும் வலிமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: οἱ ἡμέτεροι
  choice: நம்மவர்கள்
  rationale: சொல்லுக்குச் சொல் பொருள் ‘நம்முடையவர்கள்’; இங்கு பவுலும் தீத்துவும் சார்ந்த கிறிஸ்தவச் சமூகத்தினரைக் குறிக்கும் இயல்பான, பாலினக் கட்டுப்பாடற்ற தமிழ்ச் சொல்.
- source_word: καλῶν ἔργων
  choice: நற்செயல்கள்
  rationale: தீத்து நூலில் மீண்டும் மீண்டும் வரும் நன்மை பயக்கும் ஒழுக்கச் செயல்கள் என்ற கருத்தைத் தெளிவாகக் காக்கிறது.
- source_word: προΐστασθαι
  choice: ஈடுபட
  rationale: முன்னின்று நடத்துதல், கவனித்துக்கொள்ளுதல், அர்ப்பணிப்புடன் செயல்படுதல் ஆகிய பொருள் வாய்ப்புகள் உள்ளன; இச்சூழலில் நற்செயல்களைச் செயல்முறையாக மேற்கொள்வது என்ற பரந்த பொருளைத் தருகிறது.
- source_word: εἰς τὰς ἀναγκαίας χρείας
  choice: தேவையான தேவைகளை நிறைவேற்றுவதற்காக
  rationale: ἀναγκαίας என்பதன் அவசியத்தையும் χρείας என்பதன் நிஜமான தேவைகள் என்ற பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἵνα μὴ ὦσιν ἄκαρποι
  choice: அப்போது அவர்கள் கனியற்றவர்களாய் இருக்கமாட்டார்கள்
  rationale: நோக்கம் அல்லது விளைவைச் சுட்டும் ἵνα உட்கூற்றையும் ἄκαρποι என்பதிலுள்ள ‘கனியற்ற’ உருவகத்தையும் காக்கிறது.
theological_decisions:
- issue: οἱ ἡμέτεροι என்பதன் வரம்பு
  choice: பவுலும் தீத்துவும் சார்ந்த கிறிஸ்தவச் சமூகத்தினர் (‘நம்மவர்கள்’)
  alternative: நம்முடைய ஆண்கள்; வெளியினருக்கு மாறாக நம்முடைய மக்கள்
  rationale: இந்தச் சொற்றொடர் உறவு மற்றும் சமூகச் சார்பைச் சுட்டுகிறது; மூலத்தில் தேவையில்லாத பாலின வரம்பை விதிக்காமல் அதன் சமூகக் குறிப்பை ‘நம்மவர்கள்’ காக்கிறது.
- issue: προΐστασθαι என்பதன் பொருள்
  choice: நற்செயல்களில் ஈடுபடுதல்
  alternative: நற்செயல்களில் முன்னின்று செயல்படுதல்; நற்செயல்களுக்குத் தங்களை அர்ப்பணித்தல்
  rationale: இந்த வினை தலைமை வகித்தல் அல்லது அக்கறையுடன் மேற்கொள்ளுதல் ஆகிய இரு நிழற்பொருள்களையும் கொண்டிருக்கலாம். இங்கு சபைப் பதவித் தலைமை என்று தீர்மானிக்காமல் செயலில் பங்கெடுக்கும் கருத்தை முதன்மைப்படுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நற்செயல்கள்’ மற்றும் ‘கனியற்றவர்கள்’ மூலத்தின் முக்கியச் சொல் மற்றும் உருவகத் தொடர்ச்சியைப் பாதுகாக்கின்றன; குறியீடுகள் உரிய சொற்றொடர்களுக்கு அருகில் வைக்கப்பட்டுள்ளன.
