reference: Titus 3:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Πιστὸς ὁ λόγος, καὶ περὶ τούτων βούλομαί σε διαβεβαιοῦσθαι, ἵνα φροντίζωσιν καλῶν ἔργων προΐστασθαι οἱ πεπιστευκότες θεῷ. ταῦτά ⸀ἐστιν καλὰ καὶ ὠφέλιμα τοῖς ἀνθρώποις·
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/008.yaml
  text: This saying is trustworthy[a], and concerning these things I want you to insist confidently, so that those who have believed God may be careful to devote themselves to good works[b]. These things are good and beneficial for people.
translation:
  language: ta
  text: இந்தக் கூற்று நம்பத்தகுந்தது. கடவுளை நம்பியவர்கள்[a] நற்செயல்களில் முனைப்புடன் ஈடுபடும்படி[b], இவற்றைக் குறித்து நீ உறுதியாக வலியுறுத்த வேண்டும் என்று நான் விரும்புகிறேன். இவை மக்களுக்கு நல்லவையும் பயனுள்ளவையும் ஆகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடவுள்மீது நம்பிக்கை வைத்தவர்கள்’ அல்லது ‘கடவுளை நம்பி வாழ்பவர்கள்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நற்செயல்களைச் செய்வதில் தங்களை அர்ப்பணித்துக்கொள்ளும்படி’ அல்லது ‘நற்செயல்களில் ஈடுபடக் கவனமாயிருக்கும்படி.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Πιστὸς ὁ λόγος
  choice: இந்தக் கூற்று நம்பத்தகுந்தது
  rationale: λόγος இங்கு முந்தைய செய்தி அல்லது அறிக்கையைக் குறிக்கும் மேய்ப்புக் கடிதங்களுக்குரிய சூத்திரமாக இருப்பதால், ‘கூற்று’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது; πιστός என்பதன் நம்பகத்தன்மைச் சிறப்பை ‘நம்பத்தகுந்தது’ காக்கிறது.
- source_word: περὶ τούτων
  choice: இவற்றைக் குறித்து
  rationale: περί + பிறப்புவேற்றுமையின் நேரடியான பொருளை முறையான, வாசிக்க எளிய தமிழில் தருகிறது.
- source_word: βούλομαί σε διαβεβαιοῦσθαι
  choice: நீ உறுதியாக வலியுறுத்த வேண்டும் என்று நான் விரும்புகிறேன்
  rationale: βούλομαι என்பதன் விருப்பத்தையும், διαβεβαιόομαι என்பதன் உறுதியான வலியுறுத்தல் அல்லது நம்பிக்கையுடன் அறுதியிடுதல் என்ற வலிமையையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: ἵνα φροντίζωσιν
  choice: அப்போது ... கவனமாயிருப்பார்கள்
  rationale: ἵνα இங்கு நோக்கம் அல்லது எதிர்பார்க்கப்படும் விளைவை அறிமுகப்படுத்துகிறது; φροντίζω என்பதன் அக்கறையுடன் சிந்தித்துச் செயல்படும் கருத்தை ‘கவனமாயிருப்பார்கள்’ வெளிப்படுத்துகிறது.
- source_word: καλῶν ἔργων προΐστασθαι
  choice: நற்செயல்களில் தங்களை ஈடுபடுத்திக்கொள்ள
  rationale: προΐστασθαι இச்சூழலில் தலைமை வகிப்பதைவிட நற்செயல்களைச் செய்வதில் தொடர்ந்து தம்மை அர்ப்பணித்தல் அல்லது ஈடுபடுத்துதல் எனப் பொருள்படுகிறது. ‘நற்செயல்கள்’ Pauline சொற்பயன்பாட்டின் தொடர்ச்சியையும் காக்கிறது.
- source_word: οἱ πεπιστευκότες θεῷ
  choice: கடவுளை நம்பியவர்கள்
  rationale: நிறைவுக் காலப் பங்கேற்புச் சொல் நம்பிக்கை கொண்டவர்களாக நிலைத்திருப்போரைக் குறிக்கிறது. θεῷ என்ற நான்காம் வேற்றுமையோடு வரும் πιστεύω, கடவுளின் சொல்லை உண்மையென ஏற்று அவரை நம்புதல் என்ற நேரடிப் பொருளைத் தருகிறது.
- source_word: ταῦτά ἐστιν καλὰ καὶ ὠφέλιμα τοῖς ἀνθρώποις
  choice: இவை மக்களுக்கு நல்லவையும் பயனுள்ளவையும் ஆகும்
  rationale: ταῦτα என்பதன் பன்மையைத் தமிழில் காக்கிறது; καλά என்பதன் நன்மையையும் ὠφέλιμα என்பதன் பயனையும் வேறுபடுத்திக் காட்டுகிறது; ἀνθρώποις பாலினப் பொதுமையுடன் ‘மக்களுக்கு’ என மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: நம்பிக்கைக்கும் நற்செயல்களுக்கும் இடையிலான உறவு
  choice: ஏற்கெனவே கடவுளை நம்பியவர்கள் நற்செயல்களில் ஈடுபடுவதைக் கவனிக்க வேண்டும் என்ற விளைவுச் சங்கிலி காக்கப்பட்டது.
  alternative: நற்செயல்களை இரட்சிப்பைப் பெறுவதற்கான அடிப்படையாகவோ, வெறும் பொதுவான நல்லொழுக்க அறிவுரையாகவோ வெளிப்படுத்துதல்.
  rationale: கிரேக்க உரையில் நம்பிக்கை முதலில் வருகிறது; நற்செயல்கள் அந்த நம்பிக்கையின் நோக்கமுள்ள நடைமுறை விளைவாக வருகின்றன. எந்தச் சமயப்பிரிவின் தனிப்பட்ட விளக்கத்தையும் சேர்க்காமல் இந்த வரிசை பாதுகாக்கப்பட்டது.
- issue: πιστεύω என்பதுடன் θεῷ என்ற நான்காம் வேற்றுமை
  choice: முதன்மை உரையில் ‘கடவுளை நம்பியவர்கள்’ என நேரடியாக வழங்கப்பட்டது.
  alternative: ‘கடவுள்மீது நம்பிக்கை வைத்தவர்கள்’ அல்லது ‘கடவுளில் விசுவாசம் வைத்தவர்கள்.’
  rationale: இந்தக் கட்டமைப்பு கடவுளை நம்புதல், அதாவது அவர் கூறுவதை உண்மையென ஏற்றல் என்ற நுணுக்கத்தைத் தரக்கூடும். தமிழில் ‘கடவுளை நம்புதல்’ இயல்பாக இரு நுணுக்கங்களையும் தாங்குவதால் மூலத்தின் திறந்த தன்மை காக்கப்படுகிறது.
- issue: ἵνα வாக்கியத்தின் நோக்கம் அல்லது விளைவு
  choice: ‘அப்போது’ என நோக்கத்துடன் தொடர்புடைய எதிர்பார்க்கப்படும் விளைவாக வழங்கப்பட்டது.
  alternative: ‘அதற்காக’ எனத் தெளிவான நோக்கமாக மட்டும் மொழிபெயர்த்தல்.
  rationale: ἵνα நோக்கத்தையும் விளைவையும் குறிக்கக்கூடியதால், ஒன்றை மட்டும் இறுக்கமாகத் தீர்மானிக்காமல் தமிழில் இயல்பான காரண-விளைவு தொடர்பு பயன்படுத்தப்பட்டது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டது. ‘விசுவாசம்’ என்பதற்குப் பதில் பரவலாகப் புரியும் ‘நம்புதல்’ தேர்ந்தெடுக்கப்பட்டது. மூலத்தின் வலியுறுத்தும் தொனியை ‘உறுதியாக வலியுறுத்த’ காக்கிறது; வாக்கியத்தைத் தமிழில் தெளிவாக்க இரண்டு வாக்கியங்களாகப் பிரித்தாலும் தர்க்கத் தொடர்பு பாதுகாக்கப்பட்டுள்ளது.
