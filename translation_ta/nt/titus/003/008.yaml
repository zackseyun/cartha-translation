revisions:
- from: இந்தக் கூற்று நம்பத்தகுந்தது. இவற்றைக் குறித்து நீ உறுதியாக வலியுறுத்த வேண்டும் என்று நான் விரும்புகிறேன். அப்போது, கடவுளை நம்பியவர்கள்[a] நற்செயல்களில் தங்களை ஈடுபடுத்திக்கொள்ளக் கவனமாயிருப்பார்கள்[b]. இவை மக்களுக்கு நல்லவையும் பயனுள்ளவையும் ஆகும்.
  to: இந்தக் கூற்று நம்பத்தகுந்தது. கடவுளை நம்பியவர்கள்[a] நற்செயல்களில் முனைப்புடன் ஈடுபடும்படி[b], இவற்றைக் குறித்து நீ உறுதியாக வலியுறுத்த வேண்டும் என்று நான் விரும்புகிறேன். இவை மக்களுக்கு நல்லவையும் பயனுள்ளவையும் ஆகும்.
  rationale: 'The revision restores the purpose-oriented force of ἵνα φροντίζωσιν while retaining the source’s sequence: people who have believed God are to be intentional about good works. It keeps προΐστασθαι in its contextual sense of committed engagement rather than organizational leadership, and it replaces an unnatural footnote alternative without imposing a doctrinal interpretation.'
