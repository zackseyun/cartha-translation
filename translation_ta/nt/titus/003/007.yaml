review_pass:
  verdict: revise
  source_fidelity: The purpose clause, passive antecedent participle, instrumental grace, heir imagery, and prospective becoming are represented well. However, ‘நீதிமான்களாக்கப்பட்டு’ can naturally imply that people were made morally righteous, whereas δικαιωθέντες here is best rendered with its declarative/justification sense. The revision makes that sense explicit without specifying a theological mechanism. ‘நித்திய வாழ்வைப் பற்றிய நம்பிக்கைக்கேற்ப’ faithfully represents κατ’ ἐλπίδα ζωῆς αἰωνίου; the alternative ‘in hope of eternal life’ is suitably retained in the footnote.
  naturalness: The sentence is clear, dignified modern standard Tamil, and its final ‘ஆகும்படி’ appropriately maintains the dependent purpose-clause structure from the preceding verse. ‘நீதிமான்கள் என அறிவிக்கப்பட்டு’ is idiomatic and clearer than the draft’s potentially transformational wording.
  terminology: '‘அருள்,’ ‘வாரிசுகள்,’ and ‘நித்திய வாழ்வு’ are appropriate and consistent theological vocabulary. The revised rendering of δικαιωθέντες preserves the judicial/declarative force of ‘justify’ without forcing an account of how justification occurs. Footnote markers are anchored to the expressions they explain: [b] follows δικαιωθέντες and [a] follows the hope phrase.'
  issues:
  - severity: medium
    issue: ‘நீதிமான்களாக்கப்பட்டு’ may be read as moral transformation rather than justification.
    rationale: The aorist passive δικαιωθέντες is Paul’s δικαιόω language and, in this context, is most directly conveyed as being declared righteous/justified. A declarative Tamil rendering better preserves the source sense and avoids adding a transformational nuance.
