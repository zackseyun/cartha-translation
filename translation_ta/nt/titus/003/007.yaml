  text: ἵνα δικαιωθέντες τῇ ἐκείνου χάριτι κληρονόμοι ⸀γενηθῶμεν κατ’ ἐλπίδα ζωῆς αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/007.yaml
  text: so that[a], having been justified by his grace[b], we might become heirs according to the hope of eternal life.
translation:
  language: ta
  text: அவருடைய அருளினால் நீதிமான்கள் என அறிவிக்கப்பட்டு[b], நித்திய வாழ்வைப் பற்றிய நம்பிக்கைக்கேற்ப[a] நாம் வாரிசுகளாகும்படி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நித்திய வாழ்வின் நம்பிக்கையில்.”
    reason: lexical_alternative
  - marker: b
    text: “நீதிமான்கள் என அறிவிக்கப்பட்டு” என்பதை “நீதிமான்களாக்கப்பட்டு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ஆகும்படி
  rationale: நோக்கம் அல்லது விளைவை அறிமுகப்படுத்தும் ἵνα என்பதன் வலிமையை, முந்தைய வசனத்தோடு இயல்பாக இணையும் தமிழ்ச் சொற்றொடராகப் பாதுகாக்கிறது.
- source_word: δικαιωθέντες
  choice: நீதிமான்களாக்கப்பட்டு
  rationale: இறந்தகாலச் செயலையும் செயப்பாட்டு நிலையையும் காட்டும் பங்கேற்புவினையின் தன்மையைப் பாதுகாக்கிறது; பிரதான வினைக்கு முன் நிகழ்ந்த செயலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τῇ ἐκείνου χάριτι
  choice: அவருடைய அருளினால்
  rationale: கருவிப்பொருள் தரும் வேற்றுமையை ‘அருளினால்’ என்று காட்டுகிறது. ‘அவருடைய’ என்பது சுட்டுப்பெயரின் குறிப்பை தேவையின்றி வெளிப்படையாக்காமல் விடுகிறது.
- source_word: κληρονόμοι
  choice: வாரிசுகள்
  rationale: சுதந்தரிப்பு சார்ந்த மூல உருவகத்தை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: γενηθῶμεν
  choice: நாம் ... ஆகும்படி
  rationale: γίνομαι குறிக்கும் ஒரு புதிய நிலைக்கு வருதலை ‘ஆகு’ தெளிவாகக் காட்டுகிறது; ἵνα உடன் வரும் நோக்கநிலையையும் தமிழில் இயல்பாகத் தருகிறது.
- source_word: κατ’ ἐλπίδα
  choice: நம்பிக்கைக்கேற்ப
  rationale: κατά என்பதன் ‘ஒத்தபடி/ஏற்ப’ என்ற உறவைப் பாதுகாக்கிறது; ‘நம்பிக்கையில்’ என்பதும் சாத்தியமானதால் அது அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ζωῆς αἰωνίου
  choice: நித்திய வாழ்வைப் பற்றிய
  rationale: நம்பிக்கையின் பொருளாக நித்திய வாழ்வு இருப்பதை இயல்பான தமிழில் காட்டுகிறது; ‘நித்திய வாழ்வு’ என்பது அறிமுகமானதும் துல்லியமானதும் ஆகும்.
theological_decisions:
- issue: பவுலின் இரட்சிப்பு மொழியில் δικαιωθέντες என்பதன் பொருள்
  choice: நீதிமான்களாக்கப்பட்டு
  alternative: நீதியுள்ளவர்கள் என அறிவிக்கப்பட்டு
  rationale: தேர்ந்தெடுக்கப்பட்ட சொல் முக்கிய இறையியல் சொல்லிணைப்பைப் பாதுகாக்கிறது; அது உள்ளார்ந்த மாற்றமா அல்லது நீதிமன்ற அறிவிப்பா என்பதை மொழிபெயர்ப்பில் தேவையின்றி இறுதியாகத் தீர்மானிக்கவில்லை. விளக்கமான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- issue: ἐκείνου என்பதன் குறிப்பு
  choice: அவருடைய
  alternative: தேவனுடைய / இயேசு கிறிஸ்துவுடைய
  rationale: கிரேக்க உரை இவ்வசனத்திலேயே குறிப்பவரின் பெயரை மீண்டும் சொல்லவில்லை. ‘அவருடைய’ என்பது முந்தைய சூழலை நோக்கச் செய்து, குறிப்பை ஓர் ஒரே நபராக மொழிபெயர்ப்பாளர் தீர்மானிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் முந்தைய வாக்கியத்தின் நோக்கக் கூறாக இருப்பதால், மூலத்தின் வாக்கியத் தொடர்ச்சியைப் பாதுகாக்க “ஆகும்படி” என்று முடிக்கப்பட்டுள்ளது. அடிக்குறி எழுத்துகள் ஆங்கில ஆலோசனை உரையிலுள்ள பொருத்தத்தையே பின்பற்றுவதால் [b] உரையில் [a]-க்கு முன் வருகிறது.
