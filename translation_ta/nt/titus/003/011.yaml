  text: εἰδὼς ὅτι ἐξέστραπται ὁ τοιοῦτος καὶ ἁμαρτάνει, ὢν αὐτοκατάκριτος.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/011.yaml
  text: knowing that such a person is warped and is sinning[c][b][a], being self-condemned.
translation:
  language: ta
  text: அப்படிப்பட்டவன் நெறிபிறழ்ந்தவனாக இருக்கிறான்[a]; பாவம் செய்துகொண்டிருக்கிறான்; தானே தன் குற்றத்தீர்ப்புக்குக் காரணமானவனாக இருக்கிறான்[b] என்பதை நீ அறிந்திருக்கிறாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நெறியைவிட்டு விலகியிருக்கிறான்’ அல்லது ‘சீர்கெட்டிருக்கிறான்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க நிறைவேற்றுக் கால வினை, முன்பு ஏற்பட்ட பிறழ்வினால் உருவான தற்போதைய நிலையைக் காட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘தன்னைத்தானே குற்றவாளியாகத் தீர்த்துக்கொண்டவனாக இருக்கிறான்’ என்றும் மொழிபெயர்க்கலாம். இச்சொல், ஒருவன் தன் செயல்களாலோ தன் சொந்தச் சாட்சியாலோ தனக்கு எதிராகத் தீர்ப்பை வரவழைப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: நீ அறிந்திருக்கிறாய்
  rationale: முந்தைய வசனத்தின் கட்டளையை நிறைவேற்றுகிற தீத்துவே இதன் மறைமுக எழுவாய். கிரேக்கத்தில் இது வினையெச்சமாக இருந்தாலும், தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க முற்றுவினையாக மொழிபெயர்க்கப்பட்டது; காரண அல்லது விட்டுக்கொடுப்பு நுணுக்கம் தனியே சேர்க்கப்படவில்லை.
- source_word: ἐξέστραπται
  choice: நெறிபிறழ்ந்த நிலையில் இருக்கிறான்
  rationale: நிறைவேற்றுக் கால வடிவம், முன்பு ஏற்பட்ட பிறழ்வின் விளைவாகத் தொடரும் தற்போதைய நிலையைக் குறிக்கிறது. ‘நெறிபிறழ்ந்த நிலையில்’ என்பது அந்த நிலைத்த விளைவை வெளிப்படுத்துகிறது.
- source_word: ὁ τοιοῦτος
  choice: அப்படிப்பட்டவன்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட பிரிவினையை உண்டாக்குகிற ஆணைக் குறிக்கும் ஆண்பால் ஒருமைத் தொடர். தமிழில் ‘அப்படிப்பட்டவன்’ இயல்பாக அந்தக் குறிப்பையும் பாலையும் காக்கிறது.
- source_word: ἁμαρτάνει
  choice: பாவம் செய்துகொண்டிருக்கிறான்
  rationale: நிகழ்கால வினை தொடரும் செயலைக் காட்டக்கூடும். இந்த மொழிபெயர்ப்பு ‘தொடர்ந்து’ போன்ற கூடுதல் விளக்கத்தைச் சேர்க்காமல் முன்னேற்றத் தன்மையை வெளிப்படுத்துகிறது.
- source_word: ὢν
  choice: தீர்ந்திருக்கிறான்
  rationale: கிரேக்கப் பெயரெச்சம் இறுதிப் பண்பை முந்தைய விளக்கத்துடன் இணைக்கிறது. தமிழில் இயல்பான வாக்கிய ஓட்டத்திற்காக அது இறுதி முற்றுவினையோடு உள்ளடக்கப்பட்டது.
- source_word: αὐτοκατάκριτος
  choice: தன் செயல்களாலேயே குற்றவாளியாகத் தீர்ந்திருக்கிறான்
  rationale: அவனுடைய சொந்த நடத்தையே அவனுக்கு எதிராகச் சாட்சி கூறி அவனைக் குற்றவாளியாக்குகிறது என்ற பிரதிபலிப்புப் பொருளை இது தெரிவிக்கிறது; இறுதி நியாயத்தீர்ப்பைப் பற்றிய கூடுதல் கருத்தை இதில் புகுத்தவில்லை.
theological_decisions:
- issue: ὁ τοιοῦτος என்பதிலுள்ள பாலினக் குறிப்பு
  choice: அப்படிப்பட்டவன்
  alternative: அப்படிப்பட்ட நபர்
  rationale: கிரேக்கத் தொடர் ஆண்பால் ஒருமையில் உள்ளது; உடனடிச் சூழலில் பிரிவினையை உண்டாக்குகிற ஒருவனைக் குறிக்கிறது. ஆகவே ஆண்பால் குறிப்பு காக்கப்பட்டது.
- issue: αὐτοκατάκριτος என்பதன் வலிமை
  choice: தன் செயல்களாலேயே குற்றவாளியாகத் தீர்ந்திருக்கிறான்
  alternative: தன்னைத்தானே குற்றவாளியாகத் தீர்த்துக்கொண்டிருக்கிறான்
  rationale: அந்த நபரின் நிலையும் நடத்தையும் அவனுக்கு எதிராகவே தீர்ப்பளிக்கின்றன என்பதைக் காக்கிறது. அவன் தன்னைப் பற்றி வாய்மொழியாகத் தீர்ப்பு வழங்குகிறான் என்ற ஒரே விளக்கத்திற்குள் பொருளைக் குறுக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம உரைக்கு ஏற்ற செறிவும் காக்கப்பட்டுள்ளன. கிரேக்க வாக்கியத்தின் பெயரெச்ச அமைப்பு தமிழில் இயல்பான முற்றுவாக்கியமாக மாற்றப்பட்டுள்ளது; ஆனால் அதன் காரணத் தொடர்பு வெளிப்படையாக நிர்ணயிக்கப்படவில்லை. ‘நெறிபிறழ்ந்த நிலையில்’ என்பது நிறைவேற்றுக் காலத்தின் தொடர்நிலையை வெளிப்படுத்துகிறது.
