source:
  edition: SBLGNT
  text: Ὅταν πέμψω Ἀρτεμᾶν πρὸς σὲ ἢ Τυχικόν, σπούδασον ἐλθεῖν πρός με εἰς Νικόπολιν, ἐκεῖ γὰρ κέκρικα παραχειμάσαι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/012.yaml
  text: When I send Artemas or Tychicus to you[a], make every effort to come to me at Nicopolis[b], for I have decided to spend the winter there.
translation:
  language: ta
  text: நான் அர்த்தெமாவையோ தீகிக்குவையோ உன்னிடம் அனுப்பும்போது, நிக்கொப்போலிக்கு என்னிடம் வர எல்லா முயற்சியும் செய்[a]. ஏனெனில், அங்கே குளிர்காலத்தைக் கழிக்க நான் முடிவு செய்திருக்கிறேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னிடம் வருவதில் முனைப்பாயிரு” அல்லது “என்னிடம் வர உன்னால் இயன்ற அனைத்தையும் செய்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அங்கே குளிர்காலத்தைக் கழிக்க நான் தீர்மானித்திருக்கிறேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν πέμψω
  choice: நான் ... அனுப்பும்போது
  rationale: ὅταν உடன் வரும் இறந்தகாலத் தோற்றமுடைய subjunctive இங்கு எதிர்காலத்தில் எதிர்பார்க்கப்படும் குறிப்பிட்ட நிகழ்வைக் குறிக்கிறது; நவீன தமிழில் ‘அனுப்பும்போது’ இயல்பாக அந்த எதிர்காலச் சூழ்நிலையை வெளிப்படுத்துகிறது.
- source_word: Ἀρτεμᾶν ... ἢ Τυχικόν
  choice: அர்த்தெமாவையோ தீகிக்குவையோ
  rationale: ἢ குறிக்கும் இரண்டு மாற்று நபர்களைத் தமிழின் ‘-ஓ ... -ஓ’ அமைப்பு தெளிவாகக் காட்டுகிறது; பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: σπούδασον
  choice: முழு முயற்சி செய்
  rationale: இச்சொல் வெறும் வேகத்தை மட்டுமல்லாமல் ஆர்வம், அக்கறை, முனைப்பு ஆகியவற்றையும் உள்ளடக்குகிறது; ‘முழு முயற்சி செய்’ அந்த வலிமையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἐλθεῖν πρός με εἰς Νικόπολιν
  choice: நிக்கொப்போலியில் என்னிடம் வருவதற்கு
  rationale: இயக்கம் பவுலை நோக்கியது என்பதால் ‘என்னிடம் வர’ என மொழிபெயர்க்கப்பட்டுள்ளது; εἰς Νικόπολιν இலக்கிடத்தைச் சுட்டினாலும், தமிழில் மீளுரையைத் தவிர்த்து இயல்பாக ‘நிக்கொப்போலியில்’ என அமைக்கப்பட்டுள்ளது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வேண்டுகோளுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையைத் தெளிவாகக் காக்கிறது.
- source_word: κέκρικα
  choice: நான் முடிவு செய்திருக்கிறேன்
  rationale: Perfect வடிவம் கடந்த காலத்தில் எடுக்கப்பட்டு இப்போதும் நிலைத்திருக்கும் தீர்மானத்தைக் குறிக்கிறது; ‘முடிவு செய்திருக்கிறேன்’ இதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: παραχειμάσαι
  choice: குளிர்காலத்தை ... கழிக்க
  rationale: ஒரு இடத்தில் குளிர்காலம் முழுவதும் தங்கியிருத்தல் அல்லது குளிர்காலத்தைக் கடத்துதல் என்ற கருத்தை எளிய, இயல்பான தமிழில் தருகிறது.
