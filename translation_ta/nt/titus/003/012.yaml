translation_notes:
  register: மரியாதையும் இயல்பும் கொண்ட நவீன நிலையான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ஒருமை இரண்டாம் நபருக்கான ‘உன்னிடம்/செய்’ வடிவங்கள் கிரேக்க மூலத்தின் எண்ணைத் துல்லியமாகக் காக்கின்றன. ‘நிக்கொப்போலி’ என்ற இடப்பெயரும் ‘அர்த்தெமா’, ‘தீகிக்கு’ என்ற நபர்பெயர்களும் தமிழ் வேதாகமப் பயன்பாட்டிற்கு ஏற்ற ஒலிவடிவங்களில், வேற்றுமை உருபுகளுடன் வழங்கப்பட்டுள்ளன.
