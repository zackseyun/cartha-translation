  source_fidelity: 'முதன்மைக் கருத்தும் வினைநிலைத் தொடர்புகளும் துல்லியமாக உள்ளன: எதிர்காலச் சூழ்நிலையில் அர்த்தெமா அல்லது தீகிக்குவை அனுப்புதல், தீத்துவின் அவசரமான வருகை, பவுலின் நிக்கொப்பொலியில் குளிர்காலம் கழிக்கும் நிலையான தீர்மானம் ஆகியவை காக்கப்பட்டுள்ளன. ஆனால் εἰς Νικόπολιν இலக்கிடத்தைச் சுட்டுவதால், ‘நிக்கொப்போலியில்’ என்பதற்குப் பதில் ‘நிக்கொப்போலிக்கு’ என்பது மூலத்தின் இயக்கத் திசையை நேரடியாகவும் தெளிவாகவும் காட்டும்.'
  naturalness: ‘முழு முயற்சி செய்’ புரிந்துகொள்ளத்தக்கது; ஆயினும் கட்டளை வடிவில் ‘வர எல்லா முயற்சியும் செய்’ நவீன நிலையான தமிழில் இயல்பாகவும் வலிமையாகவும் உள்ளது. ‘நிக்கொப்போலிக்கு என்னிடம் வர’ என்பது இடமும் நபரும் நோக்கிய இயக்கத்தைத் தெளிவாக இணைக்கிறது.
