  text: μηδένα βλασφημεῖν, ἀμάχους εἶναι, ἐπιεικεῖς, πᾶσαν ἐνδεικνυμένους πραΰτητα πρὸς πάντας ἀνθρώπους.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/002.yaml
  text: to slander no one[a], to be peaceable, gentle[c][b], showing all meekness toward all people.
translation:
  language: ta
  text: யாரையும் பழித்துப் பேசாமலும்[a], சண்டையிடாதவர்களாகவும்[b], கனிவுள்ளவர்களாகவும்[c], எல்லா மக்களிடமும் முழுமையான சாந்தத்தைக்[d] காட்டுகிறவர்களாகவும் இருக்கும்படி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாரையும் இழிவாகப் பேசாமலும்.” இச்சொல் பொய்யான அவதூறை மட்டும் அல்லாமல், ஒருவருக்கு எதிரான தீய அல்லது அவமதிப்பான பேச்சையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “சச்சரவு செய்யாதவர்களாகவும்.” மூலச்சொல் சண்டையையும் வாக்குவாதத்தையும் நாடாதிருப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “பிறரைக் கருத்தில் கொண்டு விட்டுக்கொடுப்பவர்களாகவும்.” மூலச்சொல் கனிவு, நியாயமான அணுகுமுறை, விட்டுக்கொடுக்கும் மனம் ஆகிய பொருள் நிழல்களைக் கொண்டுள்ளது.
    reason: lexical_alternative
  - marker: d
    text: அல்லது, “மென்மையைக்.” இங்கு “சாந்தம்” என்பது பலவீனத்தை அல்ல, தன்னடக்கத்துடன் நடந்துகொள்ளும் மென்மையைச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδένα
  choice: யாரையும் … பேசாமலும்
  rationale: வினையின் எதிர்மறைப் பொருளோடு இணைந்து, ஒருவர்கூட விதிவிலக்கல்ல என்ற பொதுவான வரம்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: βλασφημεῖν
  choice: பழித்துப் பேசுதல்
  rationale: இங்கு மனிதர்களைக் குறித்துப் பேசுவதால், கடவுளைத் தூஷிப்பது என்ற குறுகிய பொருள் அல்ல; ஒருவரை இழிவுபடுத்தும் அல்லது தீமையாகப் பேசும் பரந்த பொருள் பொருத்தமானது.
- source_word: ἀμάχους
  choice: சண்டையிடாதவர்கள்
  rationale: சண்டை அல்லது வாக்குவாதத்தை நாடாத பண்பை, மூலத்தின் எதிர்மறை வடிவத்தையும் காத்து, தெளிவான நவீன தமிழில் தருகிறது.
- source_word: εἶναι
  choice: இருந்து
  rationale: முந்தைய வசனத்தின் ‘நினைவூட்டு’ என்ற ஆளும் வினையைச் சார்ந்த பண்புப் பட்டியலைத் தமிழில் இயல்பாகத் தொடரச் செய்கிறது.
- source_word: ἐπιεικεῖς
  choice: கனிவுள்ளவர்கள்
  rationale: கடுமையாக உரிமை கோராமல், பிறரைக் கருத்தில் கொண்டு மென்மையாகவும் நியாயமாகவும் நடந்துகொள்ளும் பண்பை எளிய தமிழில் தெரிவிக்கிறது.
- source_word: πᾶσαν
  choice: முழுமையான
  rationale: சாந்தம் பகுதியளவில் அல்ல, அதன் முழு அளவிலும் வெளிப்பட வேண்டும் என்ற வலியுறுத்தலை இயல்பாகத் தருகிறது.
- source_word: ἐνδεικνυμένους
  choice: காட்டும்படி
  rationale: அந்தப் பண்பு நடைமுறையில் வெளிப்படுவதைச் சுட்டுகிறது; முந்தைய வசனத்தின் கட்டளையைச் சார்ந்த தொடராகவும் அமைகிறது.
- source_word: πραΰτητα
  choice: சாந்தம்
  rationale: தன்னடக்கமுள்ள மென்மையையும் வலிமையை அடக்கி நடத்தும் பண்பையும் குறிக்கிறது; முன்னுள்ள ἐπιεικεῖς என்பதற்கான ‘கனிவு’ என்பதிலிருந்து சொல் வேறுபாட்டையும் காக்கிறது.
- source_word: πρὸς πάντας ἀνθρώπους
  choice: எல்லா மக்களிடமும்
  rationale: πρός காட்டும் பிறரை நோக்கிய நடத்தை மற்றும் ἄνθρωποι என்பதன் பாலினப் பொதுமை ஆகிய இரண்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἀνθρώπους என்பதன் பொதுப்பாலினப் பொருள்
  choice: எல்லா மக்களிடமும்
  alternative: எல்லா மனிதர்களிடமும்
  rationale: கிரேக்கச் சொல் இங்கு ஆண்களை மட்டும் அல்ல, மனிதர்கள் அனைவரையும் குறிக்கிறது; ‘மக்கள்’ என்பது அந்த உலகளாவிய வரம்பை இயல்பாகக் காக்கிறது.
- issue: ἐπιεικεῖς மற்றும் πραΰτητα ஆகிய நெருங்கிய பண்புச் சொற்களை வேறுபடுத்துதல்
  choice: கனிவுள்ளவர்களாக … சாந்தத்தைக் காட்டும்படி
  alternative: மென்மையானவர்களாக … எல்லா மென்மையையும் காட்டும்படி
  rationale: இரு சொற்களையும் ஒன்றாக்காமல், ἐπιεικής என்பதிலுள்ள பரிவான, விட்டுக்கொடுக்கும் அணுகுமுறையையும் πραΰτης என்பதிலுள்ள தன்னடக்கமான சாந்தத்தையும் தனித்தனியாக வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டது. வசனம் 3:1-இல் உள்ள ஆளும் கட்டளையை இலக்கணரீதியாகச் சார்ந்திருப்பதால், தனியாக ஒரு புதிய கட்டளையைச் சேர்க்காமல் “காட்டும்படி” என்று முடிக்கப்பட்டது. நெருங்கிய பொருளுடைய ἐπιεικεῖς மற்றும் πραΰτης ஆகியவை முறையே “கனிவு” மற்றும் “சாந்தம்” என வேறுபடுத்தப்பட்டன.
