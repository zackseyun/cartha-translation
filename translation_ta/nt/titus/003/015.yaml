source:
  edition: SBLGNT
  text: Ἀσπάζονταί σε οἱ μετ’ ἐμοῦ πάντες. ἄσπασαι τοὺς φιλοῦντας ἡμᾶς ἐν πίστει. ἡ χάρις μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/015.yaml
  text: All who are with me greet you[a]. Greet those who love us in faith. Grace be with all of you.
translation:
  language: ta
  text: என்னுடன் இருப்பவர்கள் அனைவரும் உனக்கு வாழ்த்துகள் தெரிவிக்கிறார்கள். விசுவாசத்தில்[a] எங்களை அன்பு செய்கிறவர்களுக்கு வாழ்த்துகள் தெரிவி. அருள் உங்கள் அனைவரோடும் இருப்பதாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “விசுவாசத்தில்” என்பதை “விசுவாசத்தின் அடிப்படையில்” என்றும், மாற்றாக “விசுவாச உண்மையுடன்” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζονταί
  choice: வாழ்த்துச் சொல்கிறார்கள்
  rationale: கடிதத்தின் முடிவில் ἀσπάζομαι கொண்டுள்ள வழக்கமான வாழ்த்துத் தெரிவிக்கும் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: οἱ μετ’ ἐμοῦ πάντες
  choice: என்னுடன் இருக்கிற அனைவரும்
  rationale: μετά + மரபுவேற்றுமையின் உடனிருப்பையும் πάντες என்பதன் ‘அனைவரும்’ என்ற முழுமையையும் காக்கிறது.
- source_word: ἄσπασαι
  choice: வாழ்த்துச் சொல்
  rationale: கடித நிறைவில் வரும் கட்டளை வடிவின் நேரடியான, இயல்பான தமிழாக்கம்.
- source_word: φιλοῦντας
  choice: அன்புகூருகிறவர்களுக்கு
  rationale: φιλέω குறிக்கும் தனிப்பட்ட பாசத்தையும் உறவுசார் அன்பையும் dignified, பொதுவாகப் புரியும் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν πίστει
  choice: விசுவாசத்தில்
  rationale: πίστις என்பதன் முதன்மைப் பொருளான ‘விசுவாசம்’ என்பதைத் தக்கவைத்து, அன்பின் பகிர்ந்த ஆன்மிகச் சூழல் அல்லது அடிப்படையை மிகையாக விளக்காமல் விடுகிறது.
- source_word: ἡ χάρις
  choice: அருள்
  rationale: பவுலின் வழக்கமான ஆசீர்வாத மொழியில் χάρις குறிக்கும் இறையருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: μετὰ πάντων ὑμῶν
  choice: உங்கள் அனைவரோடும் இருப்பதாக
  rationale: கிரேக்கத்தில் உள்ளடங்கியுள்ள வினையைத் தமிழில் வெளிப்படுத்தி, πάντων என்பதன் ‘அனைவரும்’ என்ற வலியுறுத்தலைக் காக்கிறது.
theological_decisions:
- issue: ἐν πίστει என்பதில் πίστις-ஐ மொழிபெயர்த்தல்
  choice: விசுவாசத்தில்
  alternative: விசுவாச உண்மையுடன்; விசுவாசத்தின் அடிப்படையில்
  rationale: இங்கு பகிர்ந்த கிறிஸ்தவ விசுவாசமே அன்பின் சூழல் அல்லது அடிப்படை என்பது இயல்பான வாசிப்பு. எனினும், πίστις ‘விசுவாச உண்மை/உண்மைத்தன்மை’ என்பதையும் குறிக்கக்கூடும்; கிரேக்கத்தில் பெயர்ச்சொல்லுக்கு முன் குறிப்புச் சுட்டு இல்லை. ஆகவே மாற்று வாசிப்புகள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், கடித நிறைவுக்குரிய மரியாதையும் சுருக்கமும் காக்கப்பட்டுள்ளன. ஒருமை முகவரியான σε/ἄσπασαι ‘உனக்கு/சொல்’ என்றும், இறுதி பன்மை ὑμῶν ‘உங்கள் அனைவரோடும்’ என்றும் வேறுபடுத்தப்பட்டுள்ளது.
