source:
  edition: SBLGNT
  text: οὐκ ἐξ ἔργων τῶν ἐν δικαιοσύνῃ ⸀ἃ ἐποιήσαμεν ἡμεῖς ἀλλὰ κατὰ ⸂τὸ αὐτοῦ ἔλεος⸃ ἔσωσεν ἡμᾶς διὰ λουτροῦ παλιγγενεσίας καὶ ἀνακαινώσεως πνεύματος ἁγίου,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/005.yaml
  text: not from works done in righteousness, which we ourselves did, but according to his mercy he saved us, through the washing of regeneration and renewal by the Holy Spirit,
translation:
  language: ta
  text: நாமே செய்த நீதியான செயல்களால் அல்ல[a], மாறாக, தமது இரக்கத்தின்படி அவர் நம்மை இரட்சித்தார்; மறுபிறப்பின் கழுவுதலினாலும்[b] பரிசுத்த ஆவியால் உண்டாகும் புதுப்பித்தலினாலும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நேர்மையில் நாம் செய்த செயல்களால் அல்ல.” கிரேக்கச் சொல் “நீதி” அல்லது “நேர்மை” என்று பொருள்படலாம்.
    reason: alternative_reading
  - marker: b
    text: “கழுவுதல்” என்பது திருமுழுக்கையையோ, தூய்மைப்படுத்தும் உருவகத்தையோ, அல்லது இரண்டையுமோ குறிக்கலாம்; கிரேக்கச் சொல் மட்டும் இவற்றில் ஒன்றைத் தீர்மானிக்கவில்லை.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “பரிசுத்த ஆவியின் புதுப்பித்தலினாலும்.” கிரேக்க இலக்கண அமைப்பு, “பரிசுத்த ஆவி”க்கும் “புதுப்பித்தல்”க்கும் உள்ள தொடர்பைச் சற்றே வேறுபட்ட விதங்களில் புரிந்துகொள்ள இடமளிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἐξ ἔργων τῶν ἐν δικαιοσύνῃ ἃ ἐποιήσαμεν ἡμεῖς
  choice: நாம் நேர்மையில் செய்த செயல்களினால் அல்ல
  rationale: ἐκ இங்கு அடிப்படை அல்லது காரணத்தைச் சுட்டுகிறது; வெளிப்படையான ἡμεῖς மனிதர்களாகிய ‘நாம்’ செய்த செயல்களை வலியுறுத்துகிறது. δικαιοσύνηக்கு இச்சூழலில் இயல்பான நவீனத் தமிழ் சொல்லாக ‘நேர்மை’ வைக்கப்பட்டுள்ளது; ‘நீதி’ மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀλλὰ κατὰ τὸ αὐτοῦ ἔλεος
  choice: மாறாக, அவர் தமது இரக்கத்தின்படி
  rationale: κατά காட்டும் அளவுகோல்/அடிப்படை உணர்வை ‘இரக்கத்தின்படி’ காக்கிறது; αὐτοῦ என்பதன் வலியுறுத்தலை இயல்பான தமிழில் ‘தமது’ வெளிப்படுத்துகிறது.
- source_word: ἔσωσεν ἡμᾶς
  choice: நம்மை மீட்டார்
  rationale: σῴζωவின் இரட்சிப்பு சார்ந்த பொருளை பொதுவாகப் புரியும் ‘மீட்டார்’ தெளிவாகத் தருகிறது; உடனடியான ஆபத்திலிருந்து மட்டும் காப்பாற்றுதல் என்ற குறுகிய பொருளைத் தவிர்க்கிறது.
- source_word: διὰ λουτροῦ
  choice: கழுவுதலினாலும்
  rationale: διά + மரபுவேற்றுமை வழி/கருவியைக் குறிக்கிறது. λουτρόν என்பதிலுள்ள கழுவுதல் அல்லது குளியல் சார்ந்த உருவகத்தை ‘கழுவுதல்’ காக்கிறது; திருமுழுக்கு என்ற விளக்கத்தை மூலவசனம் கூறுவதைவிடத் தெளிவாகச் சேர்க்கவில்லை.
- source_word: παλιγγενεσίας
  choice: மறுபிறப்பின்
  rationale: παλιγγενεσίαவின் புதிய பிறப்பு/மீண்டும் பிறத்தல் கருத்தை இயல்பாகவும் இறையியல் கனத்தை இழக்காமலும் ‘மறுபிறப்பு’ தருகிறது.
- source_word: καὶ ἀνακαινώσεως πνεύματος ἁγίου
  choice: பரிசுத்த ஆவியால் உண்டாகும் புதுப்பித்தலினாலும்
  rationale: ἀνακαίνωσις என்பதற்கு ‘புதுப்பித்தல்’ பொருந்துகிறது. πνεύματος ἁγίου உடனடியாக அதனோடு தொடர்புடையதாகவும் செயற்பாட்டின் மூலத்தை/செய்பவரைக் குறிப்பதாகவும் வாசிக்கப்படும் சாத்தியத்தை இந்த வடிவம் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: δικαιοσύνη என்பதன் பொருள்
  choice: நேர்மை
  alternative: நீதி
  rationale: இங்கு மனிதர்கள் செய்த செயல்களின் பண்பைச் சொல்வதால் ‘நேர்மை’ இயல்பாக உள்ளது. ஆயினும் சொல்லின் ‘நீதி’ என்ற பொருளும் உண்மையான சாத்தியம் என்பதால் அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: λουτροῦ என்பது திருமுழுக்கைக் குறிப்பதாகத் தெளிவுபடுத்த வேண்டுமா
  choice: முதன்மை உரையில் ‘கழுவுதல்’ என்ற திறந்த சொல்லைப் பயன்படுத்துதல்
  alternative: திருமுழுக்கு; தூய்மைப்படுத்துதல்
  rationale: கிரேக்கச் சொல் திருமுழுக்கு, தூய்மைப்படுத்தும் உருவகம், அல்லது இரண்டையும் நினைவூட்டக்கூடும். முதன்மை உரை அந்த இறையியல் விவாதத்தைத் தீர்மானிக்காமல் மூலத்தின் திறந்த தன்மையைப் பாதுகாக்கிறது.
- issue: πνεύματος ἁγίου என்பதற்கும் ἀνακαινώσεως என்பதற்கும் உள்ள தொடர்பு
  choice: பரிசுத்த ஆவியால் உண்டாகும் புதுப்பித்தல்
  alternative: பரிசுத்த ஆவியின் புதுப்பித்தல்
  rationale: அருகிலுள்ள ‘புதுப்பித்தல்’ என்பதோடு ஆவியை இணைத்து, ஆவியே அதன் செய்பவர்/மூலம் என்ற சாத்தியமான பொருளைத் தெளிவான தமிழில் தருகிறது. உரிமை அல்லது வேறு வகை தொடர்பைக் காட்டும் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு விளங்கும் கண்ணியமான நடை. நீண்ட கிரேக்க வாக்கியத்தின் எதிர்மறை–நேர்மறை மாறுபாட்டைத் தெளிவாக வைத்திருக்க ‘மாறாக’ பயன்படுத்தப்பட்டுள்ளது. தமிழில் வாக்கிய நிறைவு தெளிவாக அமைய ‘மீட்டார்’ இறுதியில் மீண்டும் கூறப்பட்டுள்ளது; இது பொருளை மாற்றாத இயல்பாக்கம்.
