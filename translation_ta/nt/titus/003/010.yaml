- from: பிரிவினையை உண்டாக்குகிற ஒருவரை, முதலாம் இரண்டாம் எச்சரிப்புக்குப் பிறகு விலக்கிவிடு.[a]
  to: பிரிவினை ஏற்படுத்துகிற ஒருவரை, முதலாவது மற்றும் இரண்டாவது எச்சரிப்புக்குப் பிறகு தவிர்த்துக்கொள்.[a]
  rationale: The revision corrects the coordinated-warning phrase, chooses a rendering of the imperative that does not overstate the disciplinary action, and improves the naturalness of the lexical alternatives in the footnote. It retains the source’s concise singular imperative and its likely first-century sense of αἱρετικόν.
