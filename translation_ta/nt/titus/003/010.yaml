translation:
  language: ta
  text: பிரிவினை ஏற்படுத்துகிற ஒருவரை, முதலாவது மற்றும் இரண்டாவது எச்சரிப்புக்குப் பிறகு தவிர்த்துக்கொள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கட்சிவாதியான ஒருவரை”; பாரம்பரிய மொழிபெயர்ப்புகளில், “மதவிரோதியான ஒருவரை.” கிரேக்கச் சொல், குழுக்களையோ பிரிவினைகளையோ உருவாக்குகிற ஒருவரைக் குறிக்க வாய்ப்பு அதிகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἱρετικὸν
  choice: பிரிவினையை உண்டாக்குகிற
  rationale: இச்சூழலில் இந்தச் சொல், பிற்காலத் தொழில்நுட்பப் பொருளான ‘மதக்கொள்கைத் தவறுடைய’ என்பதைக் காட்டிலும், குழுவாதத்தையும் பிரிவினையையும் உருவாக்குகிறவரைக் குறிக்க வாய்ப்பு அதிகம். இயல்பான நவீனத் தமிழில் செயற்பாட்டு விளைவை இது தெளிவாகத் தெரிவிக்கிறது.
- source_word: ἄνθρωπον
  choice: ஒருவரை
  rationale: இங்கு தனிநபரைக் குறிக்கும் பொதுவான மனிதச் சொல். தமிழில் ‘ஒருவரை’ என்பது இயல்பாகவும் மரியாதையுடனும் உள்ளது; தேவையின்றி ஆண்பாலைக் குறிப்பாக்குவதில்லை.
- source_word: μετὰ μίαν καὶ δευτέραν νουθεσίαν
  choice: முதலாம் இரண்டாம் எச்சரிப்புக்குப் பிறகு
  rationale: ஒருமுறையும் பின்னர் இரண்டாம் முறையும் திருத்தும் நோக்குடன் எச்சரித்த பின்பே நடவடிக்கை எடுக்க வேண்டும் என்ற வரிசையைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: παραιτοῦ
  choice: விலக்கிவிடு
  rationale: அத்தகைய நபருடனான தொடர்பையோ ஏற்றுக்கொள்ளுதலையோ தீர்மானமாக மறுக்கும் நடுத்தர வினைமுறை கட்டளையின் வலிமையைத் தருகிறது. ‘நிராகரி’ என்பதைவிட சமூக ஒழுங்கு நடவடிக்கையின் சூழலில் இயல்பாக உள்ளது.
theological_decisions:
- issue: αἱρετικὸν என்பதை பிற்காலக் கோட்பாட்டு மொழியிலா அல்லது முதல் நூற்றாண்டின் பிரிவினை ஏற்படுத்தும் பொருளிலா மொழிபெயர்ப்பது
  choice: பிரிவினையை உண்டாக்குகிற
  alternative: குழுவாதியான; பாரம்பரிய மொழிபெயர்ப்புகளில், மதக்கொள்கைத் தவறுடைய
  rationale: தொடர்ந்து திருத்தம் பெற்ற பின்னும் பிரிவினை ஏற்படுத்தும் ஒருவர்மீது எடுக்கப்படும் சமூக ஒழுங்கு நடவடிக்கையே வசனத்தின் மையம். ஆகவே பிற்காலத் தொழில்நுட்பமான ‘heresy’ கருத்தைத் திணிக்காமல், இச்சூழலில் அதிக வாய்ப்புள்ள பொருளை முதன்மை உரை தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. மூலத்தின் சுருக்கமான கட்டளைத் தொனியும், இரண்டு எச்சரிப்புகளுக்குப் பின்னரே நடவடிக்கை என்ற வரிசையும் பாதுகாக்கப்பட்டுள்ளன.
