id: TIT.3.9
reference: Titus 3:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μωρὰς δὲ ζητήσεις καὶ γενεαλογίας καὶ ⸀ἔρεις καὶ μάχας νομικὰς περιΐστασο, εἰσὶν γὰρ ἀνωφελεῖς καὶ μάταιοι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/009.yaml
  text: But avoid foolish controversies and genealogies and strife and quarrels about the law[b][a], for they are unprofitable and futile.
translation:
  language: ta
  text: ஆனால், மூடத்தனமான விவாதங்களையும்[a] வம்சவரலாறுகளையும் சச்சரவுகளையும் சட்டத்தைப் பற்றிய வாக்குவாதங்களையும்[b] தவிர்த்துக்கொள்; ஏனெனில் அவை பயனற்றவையும் வீணானவையும் ஆகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “விவாதங்கள்” என்பதற்கு “சர்ச்சைகள்” அல்லது “ஊக விசாரணைகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “சட்டம் சார்ந்த வாக்குவாதங்கள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρὰς ζητήσεις
  choice: அறிவற்ற சர்ச்சைகள்
  rationale: μωρός என்பதன் நடைமுறை மற்றும் அறநெறிசார் ‘மூடத்தனமான/அறிவற்ற’ பொருளையும், ζητήσεις என்பதன் சர்ச்சைக்குரிய விசாரணைகள் அல்லது விவாதங்கள் என்ற சூழல்சார் பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: γενεαλογίας
  choice: வம்சவரலாறுகள்
  rationale: குறிப்பிட்ட யூத அல்லது ஞானவாதப் பின்னணியைத் திணிக்காமல், மூலச்சொல்லின் பொதுவான ‘genealogies’ பொருளைப் பாதுகாக்கிறது.
- source_word: ἔρεις
  choice: சச்சரவுகள்
  rationale: ἔρις குறிக்கும் முரண்பாடு மற்றும் பூசலைத் தெளிவாகக் காட்டுகிறது; அடுத்து வரும் μάχας என்பதிலிருந்து ஓரளவு வேறுபடுத்துகிறது.
- source_word: μάχας νομικὰς
  choice: திருச்சட்டத்தைப் பற்றிய வாக்குவாதங்கள்
  rationale: இது நீதிமன்ற வழக்குகளைக் குறிக்கும் என்ற தவறான எண்ணத்தைத் தவிர்த்து, νόμος தொடர்பான வாய்மொழி மோதல்களைச் சுட்டுகிறது. மேய்ப்புக் கடிதச் சூழலில் ‘திருச்சட்டம்’ என்பது வேதாகமச் சட்டத்தைக் குறிக்க இயல்பானது.
- source_word: περιΐστασο
  choice: தவிர்த்துவிடு
  rationale: தன்னையே இவற்றிலிருந்து விலக்கிக்கொள்ளும்படி கூறும் நிகழ்கால நடுவினைக் கட்டளையின் நடைமுறை வலிமையை இயல்பான ஒருமைத் தமிழில் தருகிறது.
- source_word: ἀνωφελεῖς
  choice: பயனற்றவை
  rationale: நன்மையோ பயனோ அளிக்காதவை என்ற பொருளை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: μάταιοι
  choice: வீணானவை
  rationale: வெறுமை, பலனின்மை, நோக்கமின்மை ஆகிய நுணுக்கங்களை நவீன தமிழில் சுருக்கமாகத் தருகிறது.
theological_decisions:
- issue: ‘வம்சவரலாறுகள்’ மற்றும் ‘திருச்சட்டத்தைப் பற்றிய வாக்குவாதங்கள்’ என்பவற்றின் வரலாற்றுப் பின்னணி
  choice: குறிப்பிட்ட ஒரு யூத, ஞானவாத அல்லது வேறு சமயமறுப்பு அமைப்பாக விளக்காமல் பொதுவாக மொழிபெயர்த்தல்
  alternative: வம்சவரலாறுகளை யூதக் குலமரபு விவாதங்களாகவோ, தொடக்ககால ஞானவாத ஊகங்களாகவோ குறிப்பாக விளக்குதல்
  rationale: வசனம் இச்செயல்களைப் பெயரிடுகிறது; ஆனால் அவற்றின் துல்லியமான வரலாற்று அமைப்பை நிர்ணயிக்கவில்லை. பொதுவான சொற்கள் மூலத்தின் தெளிவின்மையைக் காக்கின்றன.
- issue: νομικὰς என்பதன் குறிப்பு
  choice: திருச்சட்டத்தைப் பற்றிய
  alternative: சட்டரீதியான அல்லது நீதிமன்றம் சார்ந்த
  rationale: சூழலில் இந்தப் பெயரடை வாக்குவாதங்களின் பொருளைச் சுட்டுகிறது; நீதிமன்றத் தகராறுகளை அல்ல. எனினும் எந்தத் தனிப்பட்ட சட்டப் பிரச்சினை என்பது விளக்கப்படவில்லை.
translation_notes:
  register: நவீன, பொதுநிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. தீத்துவை நேரடியாக அழைக்கும் ஒருமைக் கட்டளை வடிவம் காக்கப்பட்டுள்ளது. ‘சச்சரவுகள்’ மற்றும் ‘வாக்குவாதங்கள்’ என்பவை அடுத்தடுத்து வரும் ἔρεις, μάχας ஆகியவற்றின் பொருள் ஒற்றுமையையும் சிறிய வேறுபாட்டையும் பிரதிபலிக்கின்றன; அனைத்து அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
