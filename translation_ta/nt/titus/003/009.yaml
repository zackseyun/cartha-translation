revisions:
- from: ஆனால், அறிவற்ற சர்ச்சைகளையும்[a] வம்சவரலாறுகளையும் சச்சரவுகளையும் திருச்சட்டத்தைப் பற்றிய வாக்குவாதங்களையும்[b] தவிர்த்துவிடு; ஏனெனில், அவை பயனற்றவையும் வீணானவையும் ஆகும்.
