  text: ὅτε δὲ ἡ χρηστότης καὶ ἡ φιλανθρωπία ἐπεφάνη τοῦ σωτῆρος ἡμῶν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/004.yaml
  text: But when the kindness and love for humanity of God our Savior appeared,[a]
translation:
  language: ta
  text: ஆனால், நம் மீட்பரான கடவுளின் கனிவும் மனிதர்கள்மீதான அன்பும் வெளிப்பட்டபோது,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மனிதகுலத்தின்மீதான அன்பு” என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் மனிதர்களை நோக்கிய பரிவு அல்லது அன்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: ஆனால் ... போது
  rationale: ὅτε காலத்தைக் குறிக்கும் துணைவாக்கியத்தை அறிமுகப்படுத்துகிறது; δέ முந்தைய பாவநிலையிலிருந்து கடவுளின் மீட்புச் செயலுக்கு மாறும் மென்மையான முரண்பாட்டைக் காட்டுகிறது.
- source_word: χρηστότης
  choice: கனிவு
  rationale: உறவுசார் நன்மை, இரக்கம், அன்பான நடத்தையை இயல்பான நவீன தமிழில் குறிக்கிறது; அடுத்துள்ள φιλανθρωπία என்பதிலிருந்து பொருள் வேறுபாட்டையும் காக்கிறது.
- source_word: φιλανθρωπία
  choice: மனிதர்கள்மீதான அன்பு
  rationale: மனிதர்களை நோக்கிய பரிவு அல்லது அன்பு என்ற கிரேக்கப் பொருளைத் தெளிவாகத் தருகிறது; பொதுவான ‘அன்பு’ என்று சுருக்கி அதன் தனித்துவத்தை இழக்கவில்லை.
- source_word: ἐπεφάνη
  choice: வெளிப்பட்டது
  rationale: தோன்றுதல் அல்லது புலப்படுதல் என்ற வெளிப்பாட்டுச் சாயலை இயல்பான தமிழில் காக்கிறது; வெளிப்பட்ட விதத்தை மேலதிகமாக விளக்குவதில்லை.
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: நம் மீட்பரான கடவுளின்
  rationale: இந்த மரபுத்தொடர் முன்னுள்ள ‘கனிவு’ மற்றும் ‘அன்பு’ இரண்டையும் சார்ந்திருப்பதைத் தமிழ் வேற்றுமை அமைப்பு தெளிவாக்குகிறது; ‘மீட்பர்’ என்பதை கடவுளுக்குரிய பட்டமாகக் காக்கிறது.
theological_decisions:
- issue: ‘நம் மீட்பரான கடவுள்’ என்பதன் குறிப்பு
  choice: இவ்வசனத்தில் பட்டம் கடவுளைக் குறிக்கும் விதத்தில் மொழிபெயர்க்கப்படுகிறது; சூழலில் அது தந்தையாகிய கடவுளைக் குறிப்பதாகப் புரிந்துகொள்ளலாம், அடுத்த வசனங்களில் இயேசு கிறிஸ்து தனியே குறிப்பிடப்படுகிறார்.
  alternative: இந்த வசனம் மட்டும் கொண்டு நபர் சார்ந்த வேறுபாட்டை வலியுறுத்தாமல், இதை பொதுவான தெய்வீகப் பட்டமாக வாசிக்கலாம்.
  rationale: மூலத்தின் சொற்றொடரை மட்டும் மொழிபெயர்த்து, திரித்துவ நபர்களை ஒன்றாக்கவோ மொழிபெயர்ப்பிலேயே கூடுதல் விளக்கம் சேர்க்கவோ செய்யவில்லை; மூலத்தில் உள்ள இறையியல் நிறையும் சூழல்சார் வேறுபாடும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும், இயல்பான, கண்ணியமான நடை. ‘கனிவு’ மற்றும் ‘மனிதர்கள்மீதான அன்பு’ ஆகிய இணைச்சொற்களின் தனித்தனி பொருள் காக்கப்பட்டுள்ளது.
