  text: ζηνᾶν τὸν νομικὸν καὶ ⸀Ἀπολλῶν σπουδαίως πρόπεμψον, ἵνα μηδὲν αὐτοῖς λείπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/013.yaml
  text: Diligently send Zenas the lawyer and Apollos on their way[a], so that they may lack nothing.
translation:
  language: ta
  text: சட்ட அறிஞரான சேனாஸையும் அப்பொல்லோவையும் மிகுந்த அக்கறையுடன் வழியனுப்பு; அவர்களுக்கு எதுவும் குறைவுபடாதபடி பார்த்துக்கொள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சட்ட அறிஞரான சேனாஸுக்கும் அப்பொல்லோவுக்கும் அவர்களுடைய பயணத்தில் மிகுந்த அக்கறையுடன் உதவி செய்.’ இங்குள்ள வினைச்சொல், அவர்களை வெறுமனே அனுப்புவதோடு மட்டுமல்லாமல், பயணத்திற்குத் தேவையான நடைமுறை உதவிகளையும் அளிப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηνᾶν
  choice: சேனா
  rationale: Ζηνᾶς என்ற ஆள் பெயர், தமிழில் இயல்பாக வேற்றுமை உருபு ஏற்கும் வகையில் ‘சேனா’ என்று ஒலிபெயர்க்கப்பட்டது.
- source_word: τὸν νομικὸν
  choice: சட்ட அறிஞரான
  rationale: νομικός என்பது சட்டத்தில் தேர்ச்சி பெற்றவரைக் குறிக்கிறது. இது தொழில்முறை வழக்கறிஞரையோ சட்ட வல்லுநரையோ குறிக்கக்கூடும் என்பதால், பொருளை அளவுக்கு மீறிக் குறுக்காமல் ‘சட்ட அறிஞர்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: Ἀπολλῶν
  choice: அப்பொல்லோ
  rationale: Ἀπολλῶς என்ற ஆள் பெயர் தமிழின் வழக்கமான வேதாகமப் பெயர்வடிவத்துக்கு ஏற்ப ஒலிபெயர்க்கப்பட்டது.
- source_word: σπουδαίως
  choice: முழு அக்கறையுடன்
  rationale: இந்த வினையுரிச்சொல் அவசரத்தை மட்டும் அல்லாமல் ஆர்வம், கவனம், முனைப்பு ஆகியவற்றையும் உணர்த்துகிறது; ‘முழு அக்கறையுடன்’ என்பது அந்த விரிந்த நுண்பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: πρόπεμψον
  choice: வழியனுப்பிவை
  rationale: பயணிகளை வெறுமனே அனுப்புவதல்லாமல், அவர்களுக்குத் தேவையான நடைமுறை உதவிகளையும் அளித்து அனுப்பும் பொருள் இச்சூழலில் உள்ளது. ‘வழியனுப்பிவை’ அந்தப் பயணச் சூழலைச் சுருக்கமாகக் காட்டுகிறது; கூடுதல் நுண்பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ἵνα μηδὲν αὐτοῖς λείπῃ
  choice: அவர்களுக்கு ஒன்றும் குறைவுபடாதபடி பார்த்துக்கொள்
  rationale: இது பயணத்துக்குத் தேவையான எதுவும் அவர்களிடம் இல்லாமல் போகாதிருக்க வேண்டும் என்ற நோக்கத்தைத் தெரிவிக்கிறது. தமிழில் இயல்பான கட்டளையாகவும் நோக்கப்பொருளைத் தெளிவாகவும் தர இவ்வடிவம் தேர்ந்தெடுக்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் தெளிவும் கொண்ட நேரடியான அறிவுறுத்தல் நடையில் மொழிபெயர்க்கப்பட்டது. பழமையான ‘நியாயசாஸ்திரி’ போன்ற சொற்களைத் தவிர்த்து, பொதுவாகப் புரியும் ‘சட்ட அறிஞர்’ பயன்படுத்தப்பட்டது.
