  text: κατὰ ⸀τοσοῦτο ⸀κρείττονος διαθήκης γέγονεν ἔγγυος Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/022.yaml
  text: By so much[a], Jesus has become the guarantor of a better covenant.
translation:
  language: ta
  text: அவ்வளவுக்கு மேலான உடன்படிக்கையின்[a] உத்தரவாதியாக இயேசு ஆகியிருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உடன்படிக்கை’ என்பதற்கான கிரேக்கச் சொல் சில சூழல்களில் ‘மரணசாசனம்’ அல்லது ‘இறுதி விருப்ப ஆவணம்’ என்றும் பொருள்படலாம்; இங்கு ஆசாரியத்துவத்தையும் சத்தியத்தையும் பற்றிய வாதத்திற்கு ‘உடன்படிக்கை’ என்பதே மிகவும் பொருத்தமானது.
    reason: alternative_reading
lexical_decisions:
- source_word: κατὰ τοσοῦτο
  choice: அந்த அளவுக்கு
  rationale: κατά + அளவைக் குறிக்கும் வேற்றுமை வடிவம் ஒப்பீட்டின் அளவைச் சுட்டுகிறது. முந்தைய வசனத்தில் கூறப்பட்ட சத்தியத்துடன் உள்ள தொடர்பையும் κρείττονος என்ற ஒப்பீட்டுச் சொல்லின் வலிமையையும் இது இயல்பாகத் தக்கவைக்கிறது.
- source_word: κρείττονος
  choice: மேம்பட்ட
  rationale: எபிரெயர் நூலில் மீண்டும் மீண்டும் வரும் ஒப்பீட்டுக் கருத்தைத் தெளிவாகக் காட்டுகிறது; இங்கு உடன்படிக்கை முந்தைய ஏற்பாட்டைவிட மேலானது என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: διαθήκης
  choice: உடன்படிக்கை
  rationale: இந்தச் சூழலில் ஆசாரியத்துவமும் சத்தியமும் குறித்த வாதமே மையமாக இருப்பதால், இறுதி விருப்ப ஆவணம் என்ற பொருளைவிட கடவுள் ஏற்படுத்திய உடன்படிக்கை என்ற பொருள் பொருத்தமானது.
- source_word: γέγονεν
  choice: ஆகியிருக்கிறார்
  rationale: γίνομαι என்பதன் நிறைவேற்ற நிலை வடிவம் கடந்த காலத்தில் நிகழ்ந்து இப்போதும் தொடரும் நிலையைச் சுட்டுகிறது; ‘ஆகியிருக்கிறார்’ அந்த அம்சத்தைத் தமிழில் தக்கவைக்கிறது.
- source_word: ἔγγυος
  choice: உத்தரவாதி
  rationale: ஒரு கடமை அல்லது ஏற்பாடு நிறைவேறும் என்பதற்கு உறுதியாக நிற்கும் நபரை இச்சொல் குறிக்கிறது. ‘உத்தரவாதி’ நவீனத் தமிழில் சுருக்கமாகவும் துல்லியமாகவும் உள்ளது.
- source_word: Ἰησοῦς
  choice: இயேசு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
theological_decisions:
- issue: எபிரெயர் 7:22-இல் διαθήκη என்பதன் பொருள்
  choice: உடன்படிக்கை
  alternative: மரணசாசனம் / இறுதி விருப்ப ஆவணம்
  rationale: διαθήκη சில சூழல்களில் மரணசாசனத்தையும் குறிக்கலாம். ஆனால் இங்கு சத்தியத்தால் நிறுவப்பட்ட இயேசுவின் ஆசாரியத்துவம் பற்றிய வாதம் தொடர்வதால் ‘உடன்படிக்கை’ என்பதே சூழலுக்கு ஏற்றது; வேறு பொருளை முன்கூட்டியே புகுத்துவதையும் இது தவிர்க்கிறது.
- issue: ἔγγυος என்பதில் இயேசுவின் பங்கு
  choice: உடன்படிக்கையின் உத்தரவாதி
  alternative: உடன்படிக்கையின் உத்தரவாதம்
  rationale: மூலச்சொல் ஓர் அருவமான உறுதியைக் காட்டாமல், உத்தரவாதமாக நிற்கும் நபரைக் குறிக்கிறது. ஆகவே இயேசுவைச் செயற்படும் நபராகவே மொழிபெயர்த்துள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அந்த அளவுக்கு’ முந்தைய வாதத்துடனான இணைப்பைத் தக்கவைக்கிறது; ‘உத்தரவாதி’ என்பது சட்டத் தொனி கொண்டிருந்தாலும் இன்றைய தமிழில் புரிந்துகொள்ளக்கூடிய துல்லியமான சொல்.
