id: HEB.7.13
reference: Hebrews 7:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐφ’ ὃν γὰρ λέγεται ταῦτα φυλῆς ἑτέρας μετέσχηκεν, ἀφ’ ἧς οὐδεὶς προσέσχηκεν τῷ θυσιαστηρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/013.yaml
  text: For the one about whom these things are said belongs to another tribe[b][a], from which no one has served at the altar.
translation:
  language: ta
  text: ஏனெனில், இந்தக் காரியங்கள் எவரைக் குறித்துச் சொல்லப்படுகின்றனவோ, அவர் வேறொரு கோத்திரத்தைச் சேர்ந்திருக்கிறார்[a]; அந்தக் கோத்திரத்தைச் சேர்ந்த எவரும் பலிபீடத்தில் ஊழியம் செய்ததில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வேறொரு கோத்திரத்தில் பங்குடையவர்” அல்லது “வேறொரு கோத்திரத்திலிருந்து வந்தவர்.” கிரேக்க வினைச்சொல் பங்குபெறுதலையோ தொடர்பையோ குறிக்கலாம்; இங்கு கோத்திரச் சார்பைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “பலிபீடத்தைக் கவனித்ததில்லை.” இச்சொற்றொடர் பலிபீடத்துடன் தொடர்புடைய ஆசாரியப் பணியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφ’ ὃν
  choice: யாரைக் குறித்து
  rationale: ἐπί + வேற்றுமை உருபு இங்கு சொல்லப்படுபவற்றின் பொருளாகிய நபரைக் குறிக்கிறது; தமிழில் இயல்பான தொடர்புச் சொற்றொடராக மொழிபெயர்க்கப்பட்டது.
- source_word: γὰρ
  choice: வாக்கிய அமைப்பில் விளக்கத் தொடர்பாக வெளிப்படுத்தப்பட்டது
  rationale: γὰρ முந்தைய கருத்துக்கான விளக்கக் காரணத்தை அறிமுகப்படுத்துகிறது. தமிழில் தனியே ‘ஏனெனில்’ எனத் தொடங்குவது இங்கு கடினமாக இருப்பதால், தொடரின் விளக்க இயல்பை வாக்கிய அமைப்பே தாங்குகிறது.
- source_word: λέγεται ταῦτα
  choice: இந்தக் காரியங்கள் ... சொல்லப்படுகின்றனவோ
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவத்தையும் ταῦτα என்பதன் பன்மையையும் காக்கிறது.
- source_word: φυλῆς ἑτέρας
  choice: வேறொரு கோத்திரம்
  rationale: இஸ்ரவேலின் கோத்திரங்களில் ஆசாரியக் கோத்திரத்திலிருந்து வேறான ஒன்றைக் குறிக்கிறது; ‘கோத்திரம்’ என்பது இச்சூழலில் தெளிவான மரபுச் சொல்.
- source_word: μετέσχηκεν
  choice: சேர்ந்தவர்
  rationale: வினைச்சொல் பங்குபெறுதல் அல்லது தொடர்புடையிருத்தலைக் குறிக்கலாம்; இங்கு கோத்திரச் சார்பே கருத்து. தமிழில் ‘சேர்ந்தவர்’ நிலையான சார்பையும் தற்போதைய பொருத்தத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀφ’ ἧς
  choice: அந்தக் கோத்திரத்தைச் சேர்ந்த
  rationale: முன்னுள்ள φυλή-ஐச் சுட்டுகிறது; தமிழில் மீண்டும் ‘கோத்திரம்’ என்று கூறுவது தெளிவை அளிக்கிறது.
- source_word: οὐδεὶς
  choice: எவரும் ... இல்லை
  rationale: முழுமையான மறுப்பை இயல்பான தமிழ் அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: προσέσχηκεν τῷ θυσιαστηρίῳ
  choice: பலிபீடத்தில் ஊழியம் செய்ததில்லை
  rationale: பலிபீடத்துடன் தொடர்புடைய ஆசாரியப் பணியை இச்சூழல் குறிக்கிறது. ‘ஊழியம் செய்தல்’ பொருளைத் தெளிவாக்குகிறது; துல்லியமான சடங்கை தேவையின்றி சேர்ப்பதில்லை.
- source_word: θυσιαστηρίῳ
  choice: பலிபீடம்
  rationale: பலியிடும் பீடத்திற்கான தெளிவான, வழக்கிலுள்ள வேதாகமத் தமிழ் சொல்.
theological_decisions:
- issue: இயேசுவின் லேவியரல்லாத கோத்திரச் சார்பும் ஆசாரியத்துவ வாதமும்
  choice: ‘வேறொரு கோத்திரத்தைச் சேர்ந்தவர்’ என்று மொழிபெயர்த்து கோத்திரச் சார்பை மட்டும் வெளிப்படுத்துதல்
  alternative: ‘வேறொரு கோத்திரத்தில் பிறந்தவர்’ அல்லது ‘வேறொரு கோத்திரத்திலிருந்து வந்தவர்’
  rationale: கிரேக்கச் சொல் பங்கு அல்லது சார்பை நேரடியாகக் கூறுகிறது; வம்சாவளி கருத்து சூழலில் இருந்தாலும், இவ்வசனம் பயன்படுத்தாத ‘பிறந்தவர்’ போன்ற விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்க்காமல் இருக்கிறது.
- issue: பலிபீடத்துடனான தொடர்பின் தன்மை
  choice: ‘பலிபீடத்தில் ஊழியம் செய்ததில்லை’
  alternative: ‘பலிபீடத்தைக் கவனித்ததில்லை’ அல்லது ‘பலிபீடத்தை அணுகியதில்லை’
  rationale: சூழல் ஆசாரியப் பணியைப் பற்றியது. மொழிபெயர்ப்பு அந்த வழிபாட்டுப் பணியைத் தெரிவிக்கிறது; குறிப்பிட்ட சடங்கு நடவடிக்கையைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘கோத்திரம்,’ ‘பலிபீடம்,’ ‘ஊழியம்’ ஆகிய பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன. கிரேக்கத்தின் தொடர்புச் சொற்றொடர் தமிழில் இயல்பாக மறுவடிவமைக்கப்பட்டுள்ளது; உண்மையான சொற்பொருள் மாற்றுகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
