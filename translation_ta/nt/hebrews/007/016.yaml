  text: ὃς οὐ κατὰ νόμον ἐντολῆς ⸀σαρκίνης γέγονεν ἀλλὰ κατὰ δύναμιν ζωῆς ἀκαταλύτου,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/016.yaml
  text: who has become such not according to a law of a fleshly commandment[a], but according to the power of an indestructible life[c][b],
translation:
  language: ta
  text: அவர் மாம்சத்துக்குரிய கட்டளைச் சட்டத்தின்படி அல்ல[a], அழிக்க முடியாத வாழ்வின் வல்லமையின்படி[b] அத்தகையவராகியிருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உடல்சார்ந்த கட்டளைச் சட்டத்தின்படி அல்ல.”
    reason: lexical_alternative
  - marker: b
    text: மரபுவழியாக, “முடிவில்லாத வாழ்வின் வல்லமையின்படி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: அவர்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்டவரைத் தொடர்புபடுத்தும் உறவுப்பெயர்; தனி வசனமாகத் தமிழில் இயல்பாக வாசிக்க மரியாதைப் பன்மையான ‘அவர்’ பயன்படுத்தப்பட்டது.
- source_word: κατὰ νόμον
  choice: சட்டத்தின்படி
  rationale: κατά இங்கு அளவுகோல் அல்லது அடிப்படையைக் குறிக்கிறது. νόμος குறிப்பிட்ட மோசேயின் சட்டம் என்ற பெயராக அல்லாமல் ஒரு சட்ட நெறியைக் குறிக்கிறது; தமிழில் எண்ணுப்பெயரைச் சேர்க்காமல் இருப்பது இயல்பானது.
- source_word: ἐντολῆς σαρκίνης
  choice: மாம்சத்துக்குரிய ஒரு கட்டளையின்
  rationale: மூலத்தின் பெயரெச்சத்தையும் சட்டம்–கட்டளை என்ற மரபுத்தொடரையும் காக்கிறது. ‘மாம்சத்துக்குரிய’ என்பது இங்கு பாவத்தன்மையை அல்ல, உடல் மற்றும் வம்சம் சார்ந்த வெளிப்புறத் தகுதியைக் குறிக்கிறது.
- source_word: γέγονεν
  choice: அத்தகையவரானார்
  rationale: நிகழ்ந்து முடிந்ததன் தொடரும் நிலையை உணர்த்தும் perfect வினையைப் பிரதிபலிக்கிறது; சூழலில் விடுபட்டுள்ள ‘ஆசாரியர்’ என்ற கருத்தை நேரடியாகச் சேர்க்காமல், முந்தைய வசனத்தோடு இணைக்கிறது.
- source_word: ἀλλὰ κατὰ δύναμιν
  choice: அழிக்க முடியாத வாழ்வின் வல்லமையின்படி
  rationale: முந்தைய κατὰ தொடருக்கு இணையான எதிர்மறை அமைப்பைக் காத்து, δύναμις என்பதற்கு இயல்பான ‘வல்லமை’ பயன்படுத்தப்பட்டது.
- source_word: ζωῆς ἀκαταλύτου
  choice: அழிக்க முடியாத வாழ்வு
  rationale: ἀκατάλυτος என்பது முடிவில்லாத காலநீட்டத்தை மட்டும் அல்லாமல் கலைக்கவோ அழிக்கவோ முடியாத தன்மையையும் குறிக்கிறது. ‘வாழ்வு’ என்பது இச்சூழலில் dignified, current Tamil.
theological_decisions:
- issue: σαρκίνης என்பதன் பொருள்
  choice: மாம்சத்துக்குரிய
  alternative: உடலுக்குரிய / உடல் சார்ந்த
  rationale: இங்கு ஆசாரியத் தகுதியின் உடல் அல்லது வம்ச அடிப்படையை அழிக்க முடியாத வாழ்வோடு வேறுபடுத்துகிறது; ‘பாவமுள்ள’ என்ற அறநெறிப் பொருளை இறக்குமதி செய்யவில்லை.
- issue: ἀκαταλύτου என்பதன் பொருள்
  choice: அழிக்க முடியாத
  alternative: முடிவில்லாத
  rationale: மூலச்சொல்லின் கலைக்கப்படாமை அல்லது அழிக்கப்படாமை என்ற வலிமையைப் பாதுகாக்கிறது; காலநீட்டத்துக்கு மட்டும் பொருளைச் சுருக்கவில்லை.
- issue: νόμον ἐντολῆς என்ற மரபுத்தொடர்
  choice: ஒரு கட்டளையின் சட்டம்
  alternative: ஒரு கட்டளையால் வரையறுக்கப்பட்ட சட்டம்
  rationale: மூலத்தின் genitive உறவை விளக்கவுரையால் ஒரேவிதமாகத் தீர்மானிக்காமல், அதன் சுருக்கத்தையும் ஓரளவு தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடை; வழிபாட்டு மரியாதையைத் தக்கவைத்தபடியே பொதுவாசகர்களுக்குப் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. ‘மாம்சம்’ என்ற வேதாகமச் சொல்லாட்சி காக்கப்பட்டு, அதன் சூழல்சார் உடல்/வம்சப் பொருள் அடிக்குறிப்பில் தெளிவாக்கப்பட்டுள்ளது.
