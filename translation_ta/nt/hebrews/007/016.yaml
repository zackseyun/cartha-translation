- from: அவர் மாம்சத்துக்குரிய ஒரு கட்டளையின் சட்டத்தின்படி அல்ல[a], அழிக்க முடியாத வாழ்வின் வல்லமையின்படி[b] அத்தகையவரானார்.
  to: அவர் மாம்சத்துக்குரிய கட்டளைச் சட்டத்தின்படி அல்ல[a], அழிக்க முடியாத வாழ்வின் வல்லமையின்படி[b] அத்தகையவராகியிருக்கிறார்.
