id: HEB.7.2
reference: Hebrews 7:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ᾧ καὶ δεκάτην ἀπὸ πάντων ἐμέρισεν Ἀβραάμ, πρῶτον μὲν ἑρμηνευόμενος βασιλεὺς δικαιοσύνης ἔπειτα δὲ καὶ βασιλεὺς Σαλήμ, ὅ ἐστιν βασιλεὺς εἰρήνης,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/002.yaml
  text: to whom Abraham also apportioned a tenth of everything[a]. First, his name is translated King of Righteousness, and then also King of Salem, that is[b], King of Peace.
translation:
  language: ta
  text: ஆபிரகாம் எல்லாவற்றிலிருந்தும் பத்தில் ஒரு பங்கை அவருக்குப் பிரித்துக் கொடுத்தார்[a]. அவருடைய பெயரின் பொருள் முதலில் “நீதியின் அரசர்”; அடுத்து, அவர் சாலேமின் அரசரும் ஆவார்; அதாவது, “சமாதானத்தின் அரசர்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தசமபாகத்தை.” கிரேக்கத்தில் நேரடியாக “பத்தில் ஒரு பங்கு” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ
  choice: இவருக்கு
  rationale: உறவுப்பெயரின் நான்காம் வேற்றுமை முன் குறிப்பிடப்பட்ட மெல்கிசேதேக்கைக் குறிக்கிறது; ஆபிரகாம் பங்கை அவருக்குக் கொடுத்தார் என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: δεκάτην ἀπὸ πάντων
  choice: எல்லாவற்றிலிருந்தும் பத்தில் ஒரு பங்கை
  rationale: δεκάτην என்பதன் நேரடிப் பொருளான ‘பத்தில் ஒரு பங்கு’ என்பதையும், ἀπὸ πάντων குறிக்கும் முழுத் தொகையிலிருந்து எடுத்த பங்கு என்பதையும் தெளிவாகப் பேணுகிறது.
- source_word: ἐμέρισεν
  choice: பிரித்துக் கொடுத்தார்
  rationale: வெறுமனே ‘கொடுத்தார்’ என்பதைக் காட்டிலும், ஒரு பங்கைப் பிரித்து ஒதுக்கிய செயலைப் பேணுவதோடு தமிழில் இயல்பாக உள்ளது.
- source_word: πρῶτον μὲν ἑρμηνευόμενος
  choice: இவருடைய பெயருக்கு முதலில் … என்று பொருள்
  rationale: பெயரின் பொருள் விளக்கப்படுவதைத் தமிழில் வெளிப்படையாகவும் இயல்பாகவும் கூறுகிறது; ‘முதலில்’ என்பது இருபகுதி விளக்கத்தின் முதல் அங்கத்தைப் பேணுகிறது.
- source_word: βασιλεὺς δικαιοσύνης
  choice: நீதியின் அரசர்
  rationale: δικαιοσύνη இங்கு பெயரின் விளக்கமாக வருகிறது. ‘நீதி’ என்பது தமிழில் நேர்மை/நீதித்தன்மை மற்றும் நியாயம் ஆகிய பொருள் பரப்பை இயல்பாகத் தாங்குகிறது.
- source_word: ἔπειτα δὲ καὶ βασιλεὺς Σαλήμ
  choice: அடுத்து, இவர் சாலேமின் அரசராகவும் இருக்கிறார்
  rationale: வரிசையையும் καί தரும் ‘மேலும்/ஆகவும்’ நுணுக்கத்தையும் பேணுகிறது; Σαλήμ இடப்பெயராக ஒலிபெயர்க்கப்படுகிறது.
- source_word: ὅ ἐστιν βασιλεὺς εἰρήνης
  choice: அதாவது, “சமாதானத்தின் அரசர்”
  rationale: ὅ ἐστιν அறிமுகப்படுத்தும் விளக்கத்தை ‘அதாவது’ என இயல்பாகக் காட்டுகிறது; εἰρήνηக்கு பொதுவாகப் புரியும், கண்ணியமான ‘சமாதானம்’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: δικαιοσύνης என்பதன் பொருள்
  choice: நீதி
  alternative: நியாயம்; நீதித்தன்மை
  rationale: கிரேக்கச் சொல் righteousness மற்றும் justice ஆகிய இரு பொருள் நிழல்களையும் தாங்க முடியும். ‘நீதி’ தமிழில் இவ்விரண்டையும் ஓரளவு திறந்தவாறு வைத்திருப்பதால், பெயர் விளக்கத்தின் இறையியல் ஒலிப்பை ஒரே குறுகிய பொருளுக்குள் அடைக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடன் வடிவமைக்கப்பட்டது. தொடர்ச்சியான சூழலில் மெல்கிசேதேக்கைச் சுட்டுவதால் ‘இவர்’ பயன்படுத்தப்பட்டது. பெயர் மற்றும் இடப்பெயர் விளக்கத்தைத் தெளிவுபடுத்த மேற்கோள் குறிகள் இடப்பட்டுள்ளன.
