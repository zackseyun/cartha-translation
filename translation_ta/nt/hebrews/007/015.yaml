id: HEB.7.15
reference: Hebrews 7:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ περισσότερον ἔτι κατάδηλόν ἐστιν, εἰ κατὰ τὴν ὁμοιότητα Μελχισέδεκ ἀνίσταται ἱερεὺς ἕτερος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/015.yaml
  text: And it is even more evident[a], if another priest arises according to the likeness of Melchizedek[b],
translation:
  language: ta
  text: மேலும், மெல்கிசேதேக்குக்கு ஒப்பானவராக[b] வேறொரு ஆசாரியர்[a] எழும்புகிறார் என்றால், இது இன்னும் தெளிவாக விளங்குகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வேறுபட்ட ஓர் ஆசாரியர்” என்றும் மொழிபெயர்க்கலாம்; ἕτερος என்பது எண்ணிக்கையில் இன்னொருவரை மட்டுமல்ல, வேறுபட்ட ஒருவரையும் வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “மெல்கிசேதேக்குக்கு ஒப்பானவராக” என்ற சொற்றொடர், இவ்வதிகாரத்தில் சங்கீதம் 110:4-இலிருந்து எடுத்தாளப்படும் சொற்களையும் வாதத்தையும் எதிரொலிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: περισσότερον ἔτι
  choice: இன்னும் தெளிவாக
  rationale: முந்தைய வாதத்தை மேலும் வலுப்படுத்தும் ஒப்பீட்டு வினையடைத் தொடரின் ஏறுமுக வலிமையை இயல்பான நவீனத் தமிழில் தருகிறது; κατάδηλόν என்பதோடு சேர்ந்து தேவையற்ற இரட்டிப்பு இல்லாமல் பொருளை வெளிப்படுத்துகிறது.
- source_word: κατάδηλόν
  choice: தெளிவாக விளங்குகிறது
  rationale: ‘வெளிப்படையானது, தெளிவானது’ என்ற பொருளை இயல்பான தமிழில் தருகிறது; ἐστιν என்பதன் நிகழ்கால நிலையும் காக்கப்படுகிறது.
- source_word: εἰ
  choice: என்றால்
  rationale: வாதத்தின் சூழலில் இது ‘ஏனெனில்/அப்படியிருக்கையில்’ என்ற உணர்வை அணுகக்கூடியதாயினும், கிரேக்கத்தின் நிபந்தனை வடிவைத் தீர்மானிக்காமல் காக்கிறது.
- source_word: κατὰ τὴν ὁμοιότητα
  choice: ஒப்பானவராக
  rationale: சொல்லுக்குச் சொல் அமைப்பைத் திணிக்காமல், ‘ஒப்புமை/ஒத்த தன்மைக்கு ஏற்ப’ என்ற கருத்தை தெளிவான நவீனத் தமிழில் தருகிறது.
- source_word: Μελχισέδεκ
  choice: மெல்கிசேதேக்கு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட பெயரெழுத்தாக்கத்தைப் பின்பற்றுகிறது; வேற்றுமை உருபுடன் ‘மெல்கிசேதேக்குக்கு’ என வருகிறது.
- source_word: ἀνίσταται
  choice: எழும்புகிறார்
  rationale: ஆசாரியர் தோன்றுதல் அல்லது முன்வருதல் என்ற உருவகத்தைப் பாதுகாக்கிறது; உயிர்த்தெழுதல் என்ற பொருளை இங்கு கட்டாயப்படுத்துவதில்லை.
- source_word: ἱερεὺς ἕτερος
  choice: வேறொரு ஆசாரியர்
  rationale: எண்ணிக்கையில் இன்னொருவர் என்பதையும், முன் கூறப்பட்ட ஆசாரியத்துவத்திலிருந்து வேறுபட்டவர் என்ற சாத்திய நுணுக்கத்தையும் தமிழில் இயல்பாகத் தாங்குகிறது.
theological_decisions:
- issue: ஆசாரியத்துவத்தைப் பொறுத்து ἕτερος என்பதன் நுணுக்கம்
  choice: வேறொரு ஆசாரியர்
  alternative: வேறுபட்ட ஓர் ஆசாரியர்
  rationale: இவ்வசனம் லேவிய ஆசாரிய முறையிலிருந்து தனித்தவராகவும் மெல்கிசேதேக்குக்கு ஒப்பானவராகவும் உள்ள ஆசாரியரைப் பற்றிப் பேசுகிறது. ‘வேறொரு’ என்பது இன்னொருவர் மற்றும் வேறுபட்டவர் ஆகிய இரு சாத்திய நுணுக்கங்களையும் அளவுக்கு மீறித் தீர்மானிக்காமல் காக்கிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் மரியாதையும் வேதாகம உரைக்கேற்ற கண்ணியமும் காக்கப்பட்டுள்ளன. ‘ஆசாரியர்’ என்ற பரவலாக அறியப்பட்ட முக்கியச் சொல் தொடர்ச்சிக்காகப் பயன்படுத்தப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் நிபந்தனைத் தன்மையும் அதன் வாதரீதியான திறந்த நிலையும்காக்கப்பட்டுள்ளன.
