source:
  edition: SBLGNT
  text: ὁ δὲ διὰ τὸ μένειν αὐτὸν εἰς τὸν αἰῶνα ἀπαράβατον ἔχει τὴν ἱερωσύνην·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/024.yaml
  text: But he[a], because he remains forever, holds the priesthood permanently.
translation:
  language: ta
  text: ஆனால் இவரோ, என்றென்றும் நிலைத்திருப்பதால், நிரந்தரமான[a] ஆசாரியத்துவத்தை உடையவராக இருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மாறாத” அல்லது “வேறொருவருக்கு மாற்றப்படாத.” கிரேக்கப் பெயரடை இந்த இரு நுண்பொருள்களையும் தரக்கூடும். அவர் என்றென்றும் உயிரோடு இருப்பதால், அவருடைய ஆசாரியத்துவம் வேறொருவரிடம் செல்வதில்லை என்பதே இச்சூழலின் கருத்து.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: ஆனால் இவரோ
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட பல ஆசாரியர்களுக்கு மாறாக இயேசுவைக் குறிப்பதால், பெயர்ச்சொல்லாகப் பயன்படும் கட்டுரையையும் δέ-யின் எதிர்மறை வேறுபாட்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: διὰ τὸ μένειν αὐτὸν
  choice: நிலைத்திருப்பதால்
  rationale: διά உடன் வரும் articular infinitive காரணத்தைக் குறிக்கிறது; μένω இங்கு தொடர்ந்து உயிரோடு இருப்பதைக் குறிக்கிறது. முந்தைய ஆசாரியர்களின் மரணத்துடன் உள்ள வேறுபாட்டை இது தக்கவைக்கிறது.
- source_word: εἰς τὸν αἰῶνα
  choice: என்றென்றும்
  rationale: முடிவில்லாத காலத் தொடர்ச்சியைக் குறிக்கும் கிரேக்க மரபுத்தொடருக்கு இயல்பான நவீனத் தமிழ் இணை.
- source_word: ἀπαράβατον
  choice: நிரந்தரமாக
  rationale: இந்தச் சொல் மாறாதது அல்லது வேறொருவருக்கு மாற்றப்படாதது என்ற நுண்பொருள்களைத் தரலாம். சூழலில், இயேசு என்றென்றும் உயிரோடு இருப்பதால் அவருடைய ஆசாரியப் பணி மற்றொருவரிடம் செல்லாமல் நிலைப்பதே வலியுறுத்தப்படுகிறது. முதன்மை உரை அந்தச் சூழற்பொருளைத் தெளிவாகத் தருகிறது; உண்மையான சொற்பொருள் நெகிழ்வு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἔχει τὴν ἱερωσύνην
  choice: ஆசாரியப் பணியை வகிக்கிறார்
  rationale: ἔχω என்பது இங்கு ஓர் அலுவல் அல்லது பதவியை உடையவராக இருந்து அதைத் தொடர்ந்து வகிப்பதைக் குறிக்கிறது. இத்தமிழாக்கம் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἱερωσύνην
  choice: ஆசாரியப் பணி
  rationale: இங்கு தனிநபர் ஆசாரியரின் அலுவல் அல்லது பணிநிலையைக் குறிக்கிறது; தமிழில் ‘ஆசாரியப் பணி’ என்பது அதைத் தெளிவாக வேறுபடுத்துகிறது.
theological_decisions:
- issue: கிறிஸ்துவின் ஆசாரியப் பணியுடன் தொடர்புடைய ἀπαράβατον என்பதன் பொருள்
  choice: அவர் ஆசாரியப் பணியை நிரந்தரமாக வகிக்கிறார்
  alternative: அவருடைய ஆசாரியப் பணி மாறாதது; அவருடைய ஆசாரியப் பணி வேறொருவருக்கு மாற்றப்படாதது
  rationale: மரித்ததால் அடுத்தடுத்து மாற்றப்பட்ட முந்தைய ஆசாரியர்களுக்கும் என்றென்றும் நிலைத்திருக்கும் இயேசுவுக்கும் இடையிலான ஆசிரியரின் வேறுபாட்டை இது வெளிப்படுத்துகிறது. ஒரு குறுகிய தொழில்நுட்பப் பொருளை மட்டும் தீர்மானிக்காமல், உண்மையான சொற்பொருள் சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இவரோ’ முந்தைய பல ஆசாரியர்களுடனான வேறுபாட்டைச் சுட்டுகிறது; ‘ஆசாரியப் பணி’ என்பது இங்கு அலுவல்/பதவி என்ற பொருளைத் தெளிவாக்குகிறது.
