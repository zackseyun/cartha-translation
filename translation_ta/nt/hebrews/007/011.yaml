id: HEB.7.11
reference: Hebrews 7:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Εἰ μὲν οὖν τελείωσις διὰ τῆς Λευιτικῆς ἱερωσύνης ἦν, ὁ λαὸς γὰρ ἐπ’ ⸀αὐτῆς ⸀νενομοθέτηται, τίς ἔτι χρεία κατὰ τὴν τάξιν Μελχισέδεκ ἕτερον ἀνίστασθαι ἱερέα καὶ οὐ κατὰ τὴν τάξιν Ἀαρὼν λέγεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/011.yaml
  text: If perfection had been through the Levitical priesthood—for on its basis the people had received the law—what further need was there for another priest to arise according to the order of Melchizedek and not be spoken of according to the order of Aaron?[a][b]
translation:
  language: ta
  text: லேவிய ஆசாரியத்துவத்தின் மூலம் நிறைவு கிடைத்திருக்குமானால்—ஏனெனில், அதை அடிப்படையாகக் கொண்டே மக்களுக்குச் சட்டம் வழங்கப்பட்டிருந்தது[a]—மெல்கிசேதேக்கின் முறைமையின்படி வேறொரு ஆசாரியர் எழும்பவும், அவர் ஆரோனின் முறைமையின்படி அழைக்கப்படாமல் இருக்கவும் இன்னும் என்ன தேவை இருந்தது?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏனெனில், அதன் கீழ் மக்களுக்குச் சட்டம் கொடுக்கப்பட்டிருந்தது.” கிரேக்கச் சொற்றொடரை இன்னும் சொல்லுக்குச் சொல்லாக இவ்வாறு மொழிபெயர்க்கலாம்; மக்களின் சட்ட ஏற்பாடு லேவிய ஆசாரியத்துவத்தை அடிப்படையாகக் கொண்டிருந்தது என்பதே கருத்து.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மெல்கிசேதேக்கின் முறைமையில் வேறொரு ஆசாரியர் எழும்பி, ஆரோனின் முறைமையின்படி அழைக்கப்படாமல் இருப்பதற்கு இன்னும் என்ன தேவை இருந்தது?”
    reason: alternative_reading
lexical_decisions:
- source_word: τελείωσις
  choice: நிறைவு
  rationale: வெறும் ஒழுக்க மேம்பாட்டையோ ஒரு செயலின் முடிவையோ மட்டும் குறுக்காமல், எபிரெயர் நூலில் காணப்படும் வழிபாட்டு மற்றும் மீட்பியல் கனத்தைத் தக்கவைக்கிறது; அதன் முழுப் பொருளைச் சூழல் விளக்க இடமளிக்கிறது.
- source_word: διὰ τῆς Λευιτικῆς ἱερωσύνης
  choice: லேவிய ஆசாரியத்துவத்தின் மூலம்
  rationale: διά + உரிமை வேற்றுமை இங்கு கருவி அல்லது வழிமுறையைக் குறிக்கிறது; ‘மூலம்’ என்பது அதனை இயல்பாகவும் துல்லியமாகவும் தருகிறது.
- source_word: ἐπ’ αὐτῆς
  choice: அதை அடிப்படையாகக் கொண்டே
  rationale: பெண்பால் சுட்டுப்பெயர் அருகிலுள்ள ‘லேவிய ஆசாரியத்துவத்தை’ச் சுட்டுவதாகப் புரிந்துகொள்ளப்படுகிறது; ἐπί வெளிப்படுத்தும் அடிப்படை உறவை இயல்பான தமிழில் கூறுகிறது.
- source_word: νενομοθέτηται
  choice: சட்டம் வழங்கப்பட்டது
  rationale: மக்கள் சட்டத்தைப் பெற்றதன் விளைவுநிலையை உணர்த்தும் நிறைவேற்றப்பட்ட வினை வடிவத்தின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: τίς ἔτι χρεία
  choice: இன்னும் என்ன தேவை இருந்தது
  rationale: தொடர்ந்தோ கூடுதலாகவோ உள்ள தேவையைப் பற்றிய வினாவை அதன் வாதத்தன்மையுடன் காக்கிறது.
- source_word: κατὰ τὴν τάξιν Μελχισέδεκ
  choice: மெல்கிசேதேக்கின் முறைமையின்படி
  rationale: τάξις இங்கு ஒரு வகை, ஒழுங்கு அல்லது நியமிக்கப்பட்ட மாதிரியைக் குறிக்கிறது; ‘முறைமை’ இவற்றை தேவையின்றி ஒரே பொருளுக்குள் சுருக்குவதில்லை.
- source_word: ἕτερον ... ἱερέα
  choice: வேறொரு ஆசாரியர்
  rationale: ἕτερον என்பதிலுள்ள வேறுபாட்டை வெளிப்படுத்துகிறது; தொடர்ந்து வரும் ஆரோனிய முறைமைக்கு எதிரான ஒப்பீடு அந்த வேறுபாட்டைத் தெளிவாக்குகிறது.
- source_word: ἀνίστασθαι
  choice: எழும்ப
  rationale: ஒரு ஆசாரியர் தோன்றுதல் அல்லது நியமிக்கப்படுதலைக் குறிக்கும் மூலத்தின் திறந்த பொருளைத் தக்கவைக்கிறது; உயிர்த்தெழுதல் என்ற பொருளைத் திணிப்பதில்லை.
- source_word: καὶ οὐ ... λέγεσθαι
  choice: என்று குறிப்பிடப்படாமல் இருக்கவும்
  rationale: அந்த ஆசாரியர் எந்த முறைமையைச் சேர்ந்தவர் எனச் சொல்லப்படுவது அல்லது வகைப்படுத்தப்படுவது என்பதைக் குறிக்கிறது; வெறும் பெயரிடுதல் என்ற குறுகிய பொருளைத் தவிர்க்கிறது.
- source_word: Μελχισέδεκ / Ἀαρών
  choice: மெல்கிசேதேக்கு / ஆரோன்
  rationale: நவீனத் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்ற வழக்கமான ஒலிபெயர்ப்புகள் பயன்படுத்தப்பட்டுள்ளன; உரிமை வடிவில் ‘மெல்கிசேதேக்கின்’ என வருகிறது.
theological_decisions:
- issue: எபிரெயர் நூலின் ஆசாரிய வாதத்தில் τελείωσις என்பதன் பொருள்
  choice: ‘நிறைவு’ என மொழிபெயர்த்து, அதன் வழிபாட்டு மற்றும் இறையியல் கனத்தைத் திறந்த நிலையில் வைத்தல்
  alternative: ‘பூரணத்துவம்’, ‘கடவுளை முழுமையாக அணுகும் தகுதி’
  rationale: லேவிய ஆசாரியத்துவம் நோக்கப்பட்ட இறுதி நிலையை ஏற்படுத்தியிருக்குமானால் மற்றொரு ஆசாரியர் தேவையில்லை என்பதே வாதம். ‘நிறைவு’ அந்த இறையியல் இழுபறியை முன்கூட்டியே விளக்கித் தீர்க்காமல் காக்கிறது.
- issue: ἐπ’ αὐτῆς என்பதில் αὐτῆς சுட்டும் பொருள்
  choice: லேவிய ஆசாரியத்துவம்
  alternative: சட்டம் அல்லது பரந்த உடன்படிக்கை ஏற்பாடு
  rationale: இலக்கண ரீதியாகப் பொருந்தும் மிக அருகிலுள்ள முன்னிலைச் சொல் ‘ஆசாரியத்துவம்’; இடைச்செருகல் வாக்கியம் மக்களின் சட்ட ஏற்பாடு அதனை அடிப்படையாகக் கொண்டது என வாதத்தை விளக்குகிறது.
- issue: τάξις என்பதன் ஆசாரிய வகைப்பாட்டு நுணுக்கம்
  choice: ‘முறைமை’ என்று மொழிபெயர்த்து மாதிரி, ஒழுங்கு, வகை ஆகிய சாத்தியங்களைத் தக்கவைத்தல்
  alternative: ‘வரிசை’, ‘ஒழுங்கு’
  rationale: இங்கு அது உடல் வழிவந்த வம்சவரிசையை மட்டும் குறிக்கிறது என்று தீர்மானிக்காமல், மெல்கிசேதேக்கு மற்றும் ஆரோன் சார்ந்த ஆசாரிய வகை அல்லது நியமிக்கப்பட்ட வடிவத்தையும் உள்ளடக்க இடமளிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு விளங்கும் மரியாதையான வேதாகம நடையில் வடிவமைக்கப்பட்டது. நீண்ட கிரேக்க வினாவைத் தமிழில் தெளிவாக வாசிக்க இடைச்செருகல் கோடுகளும் இணை வினையெச்ச அமைப்பும் பயன்படுத்தப்பட்டன. ‘ஆசாரியத்துவம்’, ‘முறைமை’, ‘நிறைவு’ போன்ற சொற்கள் பொருள்துல்லியத்தையும் வழக்கமான தமிழ் கிறிஸ்தவ வாசிப்புத் தெளிவையும் சமநிலைப்படுத்துகின்றன.
