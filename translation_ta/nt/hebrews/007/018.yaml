source:
  edition: SBLGNT
  text: ἀθέτησις μὲν γὰρ γίνεται προαγούσης ἐντολῆς διὰ τὸ αὐτῆς ἀσθενὲς καὶ ἀνωφελές,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/018.yaml
  text: For there is indeed a setting aside of the former commandment because of its weakness and uselessness[b][a],
translation:
  language: ta
  text: ஏனெனில், முந்தைய கட்டளை[a] அதன் பலவீனத்தினாலும் பயனின்மையினாலும்[b] உண்மையில் நீக்கப்படுகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘முன்னிருந்த கட்டளை,’ ‘முன்னே சென்ற கட்டளை.’
    reason: lexical_alternative
  - marker: b
    text: அதாவது, சுற்றியுள்ள பகுதியில் பேசப்படும் முழுநிறைவை உண்டாக்குவதற்கு அது செயலாற்றவில்லை (எபிரெயர் 7:19 பார்க்கவும்); கடவுளின் முந்தைய வெளிப்பாடு தன்னிலேயே தீமையானது என்று இது கூறவில்லை.
    reason: cross_reference
lexical_decisions:
- source_word: ἀθέτησις
  choice: நீக்கப்படுகிறது
  rationale: சட்டபூர்வ வலிமை நீக்கப்படுதல் அல்லது நடைமுறையிலிருந்து விலக்கப்படுதல் என்ற கருத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; ‘நிராகரிக்கப்படுகிறது’ என்பதுபோல் தவறானது எனத் தள்ளுபடி செய்யப்படுவதாக இது சொல்லவில்லை.
- source_word: μὲν γὰρ
  choice: ஏனெனில் … உண்மையில்
  rationale: γάρ தரும் விளக்கத் தொடர்பையும், μέν அடுத்த வசனத்தில் வரும் எதிரிணைக்கான முன்னோட்டத்தையும், தமிழில் இயன்றவரை இயல்பாகக் காட்டுகிறது.
- source_word: γίνεται
  choice: நீக்கப்படுகிறது
  rationale: ἀθέτησις என்பதோடு சேர்ந்து, நீக்குதல் நிகழ்கிறது என்ற கிரேக்கக் கட்டமைப்பை இயல்பான தமிழ் வினைமுற்றாக அளிக்கிறது.
- source_word: προαγούσης ἐντολῆς
  choice: முந்தைய கட்டளை
  rationale: ‘முன்னே சென்ற/முன்னிருந்த கட்டளை’ என்ற கால முன்னுரிமையைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: διὰ τὸ αὐτῆς ἀσθενὲς καὶ ἀνωφελές
  choice: அதன் பலவீனத்தினாலும் பயனின்மையினாலும்
  rationale: διά கூறும் காரணத்தையும், இரண்டு கூர்மையான மதிப்பீட்டுச் சொற்களையும் பெயர்ச்சொல் வடிவில் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: ἀσθενές
  choice: பலவீனம்
  rationale: வலிமை அல்லது செயலாற்றல் போதாமையைக் குறிக்கும் மூலச்சொல்லின் நேரடியான தமிழ் இணை.
- source_word: ἀνωφελές
  choice: பயனின்மை
  rationale: குறித்த நோக்கத்தை நிறைவேற்றுவதில் பயனளிக்காத தன்மையைச் சொல்கிறது; மூலத்தின் கூர்மையை தேவையின்றி மென்மைப்படுத்தவில்லை.
theological_decisions:
- issue: ‘முந்தைய கட்டளை’ குறித்த எதிர்மறை மதிப்பீட்டின் எல்லை
  choice: முந்தைய கட்டளை பலவீனமும் பயனின்மையும் உடையதால் நீக்கப்படுகிறது என்ற வசனத்தின் வலுவான கூற்றை அப்படியே வைத்தல்; அதன் சூழல் சார்ந்த எல்லையை அடிக்குறிப்பில் விளக்குதல்.
  alternative: மோசேயின் சட்டம் முழுவதும் எல்லா வகையிலும் மதிப்பற்றது என்று விரிவுபடுத்துதல், அல்லது வசனத்தின் எதிர்மறை மொழியை மென்மைப்படுத்துதல்.
  rationale: எபிரெயர் 7:11, 19-இன் உடனடிச் சூழல், ஆசாரிய ஏற்பாடு முழுநிறைவை உண்டாக்க முடியாததையே விவாதிக்கிறது. ஆகவே மொழியின் இறையியல் இழுவிசையை மொழிபெயர்ப்பு காக்கிறது; அதே சமயம் உரை கூறாத முழுமையான கண்டனத்தை அதில் புகுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பலவீனம்,’ ‘பயனின்மை,’ ‘நீக்கப்படுகிறது’ ஆகிய சொற்கள் மூலத்தின் வலுவான சட்ட மற்றும் இறையியல் மொழியைத் தக்கவைக்கின்றன; அடிக்குறிப்பு அதன் சூழல் சார்ந்த பொருளை மட்டும் விளக்குகிறது.
