revisions:
- from: ஏனெனில், இந்த மெல்கிசேதேக்கு—சாலேமின் அரசரும் உன்னதமான தேவனுடைய ஆசாரியருமான இவர்—அரசர்களை முறியடித்துவிட்டுத் திரும்பி வந்துகொண்டிருந்த ஆபிரகாமைச் சந்தித்து, அவரை ஆசீர்வதித்தார்[a],
  to: ஏனெனில், இந்த மெல்கிசேதேக்—சாலேமின் அரசரும் உன்னதமான தேவனுடைய ஆசாரியருமானவர்[a]—அரசர்களை முறியடித்துத் திரும்பி வந்துகொண்டிருந்த ஆபிரகாமைச் சந்தித்து, அவரை ஆசீர்வதித்தார்[b],
