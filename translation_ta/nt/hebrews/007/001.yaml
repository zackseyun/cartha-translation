source:
  edition: SBLGNT
  text: Οὗτος γὰρ ὁ Μελχισέδεκ, βασιλεὺς Σαλήμ, ἱερεὺς τοῦ θεοῦ τοῦ ὑψίστου, ⸀ὁ συναντήσας Ἀβραὰμ ὑποστρέφοντι ἀπὸ τῆς κοπῆς τῶν βασιλέων καὶ εὐλογήσας αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/001.yaml
  text: For this Melchizedek[a], king of Salem, priest of God Most High, met Abraham as he was returning from the slaughter of the kings and blessed him[b],
translation:
  language: ta
  text: ஏனெனில், இந்த மெல்கிசேதேக்—சாலேமின் அரசரும் உன்னதமான தேவனுடைய ஆசாரியருமானவர்[a]—அரசர்களை முறியடித்துத் திரும்பி வந்துகொண்டிருந்த ஆபிரகாமைச் சந்தித்து, அவரை ஆசீர்வதித்தார்[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மிக உன்னதமான தேவனின் ஆசாரியர்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அரசர்களை வெட்டிச் சாய்த்துவிட்டுத் திரும்பி வந்துகொண்டிருந்த.” கிரேக்கத்தில் இன்னும் நேரடியாக, “அரசர்களின் வெட்டிச் சாய்த்தலிலிருந்து” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτος γὰρ ὁ Μελχισέδεκ
  choice: ஏனெனில், இந்த மெல்கிசேதேக்கு
  rationale: γάρ முந்தைய வாதத்துடன் விளக்கத் தொடர்பை ஏற்படுத்துவதால் “ஏனெனில்” என மொழிபெயர்க்கப்பட்டது. Οὗτος தரும் சுட்டுவலியுறுத்தலை “இந்த” காக்கிறது.
- source_word: βασιλεὺς Σαλήμ
  choice: சாலேமின் அரசர்
  rationale: βασιλεύς என்பதற்கு இயல்பான நவீனத் தமிழ் “அரசர்.” Σαλήμ, ஆதியாகமம் 14 உடனான தொடர்பை அறியத்தக்க வகையில் வழக்கமான தமிழ் ஒலிபெயர்ப்பான “சாலேம்” எனத் தரப்பட்டது.
- source_word: ἱερεὺς τοῦ θεοῦ τοῦ ὑψίστου
  choice: உன்னதமான தேவனுடைய ஆசாரியர்
  rationale: இச்சொற்றொடர் ‘மிக உன்னதமான தேவனுடைய ஆசாரியர்’ என்ற தெய்வீகப் பட்டத்தை இயல்பான தமிழில் தருகிறது; கிரேக்கத்தில் ὕψιστος என்பது தேவனைச் சிறப்பிக்கும் சொல்லாக இருப்பது காக்கப்படுகிறது.
- source_word: ὁ συναντήσας Ἀβραὰμ
  choice: ஆபிரகாமைச் சந்தித்து
  rationale: συναντάω என்பதன் சூழலுக்கேற்ற நேரடியான பொருள் “சந்தி.” இறந்தகாலப் பங்கேற்புச் சொல்லின் செயல், தொடர்வாக்கிய அமைப்பில் இயல்பாகத் தரப்பட்டுள்ளது.
- source_word: ὑποστρέφοντι
  choice: திரும்பி வந்துகொண்டிருந்த
  rationale: நிகழ்காலப் பங்கேற்புச் சொல் சந்திப்பு நடந்தபோது ஆபிரகாம் திரும்பும் செயலில் இருந்ததைக் காட்டுவதால் தொடர்நிலை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: ἀπὸ τῆς κοπῆς τῶν βασιλέων
  choice: அரசர்களை முறியடித்துவிட்டு
  rationale: κοπή என்பதன் அடிப்படைப் படிமம் ‘வெட்டிச் சாய்த்தல்’ என்றாலும், போர்ச் சூழலில் நடந்த வெற்றியை இயல்பான தமிழில் “முறியடித்தல்” தெரிவிக்கிறது. நேரடியான சொல்லாக்கம் அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
- source_word: εὐλογήσας αὐτόν
  choice: அவரை ஆசீர்வதித்தார்
  rationale: εὐλογέω என்பதற்கான நிலைபெற்ற வேதாகமத் தமிழ்ச் சொல் “ஆசீர்வதி.” αὐτόν குறிக்கும் ஆபிரகாமுக்குரிய மரியாதை ஒருமை “அவரை” பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: τοῦ θεοῦ τοῦ ὑψίστου என்ற தெய்வீகப் பட்டத்தின் அமைப்பு
  choice: உன்னதமான தேவனுடைய ஆசாரியர்
  alternative: மிக உன்னதமான தேவனின் ஆசாரியர்
  rationale: இரு வடிவங்களும் கருத்தளவில் சாத்தியம். தேர்ந்த வடிவம் தேவனைச் சிறப்பிக்கும் ὕψιστος என்பதைக் காத்து, கூடுதல் கோட்பாட்டுப் பொருளைச் சேர்க்காமல் இயல்பான தமிழில் பட்டத்தை வழங்குகிறது.
- issue: κοπή என்பதில் கொலை அல்லது போர்த் தோல்வி என்ற நுணுக்கம்
  choice: முதன்மை உரையில் “முறியடித்துவிட்டு”; அடிக்குறிப்பில் நேரடியான “வெட்டிச் சாய்த்துவிட்டு”
  alternative: முதன்மை உரையில் “வெட்டிச் சாய்த்துவிட்டு”
  rationale: ஆதியாகமம் 14-இன் போர்ச் சூழலில் அரசர்களின் படைகளைத் தோற்கடித்த நிகழ்வு குறிக்கப்படலாம்; அரசர்கள் ஒவ்வொருவரும் கொல்லப்பட்டனர் என்று உரை கட்டாயப்படுத்தாது. அதே நேரத்தில் κοπή-யின் வலிமையான நேரடிப் பொருள் அடிக்குறிப்பில் மறைக்கப்படவில்லை.
translation_notes:
  register: நவீன, தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்கப் பெயரெச்ச அமைப்பை வாசிக்க எளிதாக்க இடைக்கோடுகள் பயன்படுத்தப்பட்டுள்ளன. வசனம் அடுத்த வசனத்தில் தொடரும் வாக்கியத்தின் ஒரு பகுதி என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
