base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/023.yaml
  text: And they indeed have become many priests[a], because they are prevented by death from remaining in office[b],
translation:
  language: ta
  text: மேலும், மரணம் அவர்களைத் தொடர்ந்து ஆசாரியப் பணியில் இருக்கத் தடுத்ததால், ஆசாரியர்களாக இருந்தவர்கள் பலர்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பல ஆசாரியர்கள் இருந்தனர்.” நேர்ப்பொருளில், “தொடர்ந்து இருக்க”; சூழலில், ஆசாரியப் பணியில் தொடர்ந்து இருப்பது என்று பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: மேலும்
  rationale: முந்தைய கருத்துடன் வாதத்தின் தொடர்ச்சியை இயல்பாக இணைக்கிறது.
- source_word: οἱ μὲν πλείονές εἰσιν γεγονότες ἱερεῖς
  choice: அவர்கள் பலர் ஆசாரியர்களாகியிருக்கிறார்கள்
  rationale: γεγονότες என்பதன் நிறைவுநிலைச் சாயலையும், பல ஆசாரியர்கள் இருந்ததைக் குறிக்கும் வலியுறுத்தலையும் காக்கிறது; μέν அடுத்த வசனத்தின் எதிர்மறை ஒப்பீட்டை முன்னறிவிக்கிறது.
- source_word: διὰ τὸ θανάτῳ κωλύεσθαι
  choice: ஏனெனில், மரணம் அவர்களை ... விடவில்லை
  rationale: διά உடன் வரும் பெயராக்கப்பட்ட வினையெச்சத்தின் காரணப்பொருளையும், θανάτῳ குறிக்கும் மரணத்தின் தடைசெய்யும் கருவிப்பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: παραμένειν
  choice: தொடர்ந்து நிலைத்திருக்க
  rationale: அவர்கள் தங்கள் ஆசாரியப் பணியில் தொடர்வதைக் சூழல் குறிக்கிறது; பிரதான உரையில் ‘பதவியில்’ என்று வெளிப்படையாகச் சேர்க்காமல் மூலத்தின் சுருக்கத்தையும் ஓரளவு பொதுமையையும் காக்கிறது.
theological_decisions:
- issue: பல ஆசாரியர்களுக்கும் இயேசுவின் நிலையான ஆசாரியத்துவத்திற்கும் இடையிலான ஒப்பீடு
  choice: மரணத்தால் தொடர்ந்து நிலைக்க முடியாத பல ஆசாரியர்களை மட்டும் இவ்வசனத்தில் குறிப்பிடுதல்
  alternative: ‘லேவிய ஆசாரியர்கள்’ என்று பிரதான உரையில் வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: சூழல் லேவிய ஆசாரியத்துவத்தைக் குறித்தாலும், கிரேக்க மூலத்தில் இவ்வசனத்தில் ‘லேவிய’ என்ற சொல் இல்லை. அடுத்த வசனத்தில் வரும் கிறிஸ்துவுடனான ஒப்பீட்டை முன்கூட்டியே விரிவாக்காமல் உரையின் பதற்றம் காக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆசாரியர்’ என்பது எபிரெயர் நூலின் ஆசாரியத்துவச் சூழலுக்கேற்ற நிலைபெற்ற சொல். மூலத்தில் இல்லாத ‘லேவிய’ அல்லது ‘பதவி’ போன்ற விளக்கங்கள் பிரதான உரையில் சேர்க்கப்படாமல் அடிக்குறிப்பில் சூழற்பொருள் தெளிவுபடுத்தப்பட்டுள்ளது.
