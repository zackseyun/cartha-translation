source:
  edition: SBLGNT
  text: ἔτι γὰρ ἐν τῇ ὀσφύϊ τοῦ πατρὸς ἦν ὅτε συνήντησεν αὐτῷ ⸀Μελχισέδεκ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/010.yaml
  text: For he was still in the loins of his father when Melchizedek met him[a].
translation:
  language: ta
  text: ஏனெனில், மெல்கிசேதேக்கு ஆபிரகாமைச் சந்தித்தபோது, லேவி இன்னும் தன் மூதாதையான ஆபிரகாமின் இடுப்பில் இருந்தான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, பொருளை விளக்கிக் கூறினால், ‘லேவி இன்னும் தன் மூதாதையின் உடலில் இருந்தான்.’ கிரேக்கத்தில் சொல்லுக்குச் சொல் ‘தன் தந்தையின் இடுப்பில்’ என்று உள்ளது; இங்கு ‘தந்தை’ என்பது லேவியின் மூதாதையான ஆபிரகாமைக் குறிக்கிறது. இது மூதாதை வழியான பிறப்புறவைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι
  choice: இன்னும்
  rationale: சந்திப்பு நடந்த காலத்தில் தொடர்ந்திருந்த முந்தைய நிலையைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தின் கருத்துக்கு விளக்கம் அளிக்கும் இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐν τῇ ὀσφύϊ
  choice: இடுப்பில்
  rationale: மூதாதை வழியான பிறப்புறவைச் சுட்டும் கிரேக்க மொழிப்படிமத்தைத் தக்கவைக்கிறது; கருத்தை உரைநடையாகத் தட்டையாக்கவில்லை.
- source_word: τοῦ πατρὸς
  choice: தன் தந்தையின்
  rationale: கிரேக்கத்தின் உறவுமுறைக் குறிப்பைத் தக்கவைக்கிறது. இங்கு சூழலில் ஆபிரகாம் லேவியின் மூதாதையாகக் குறிப்பிடப்படுகிறார்.
- source_word: ἦν
  choice: இருந்தான்
  rationale: இருத்தலைக் குறிக்கும் இறந்தகால வினையை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: ὅτε
  choice: சந்தித்தபோது
  rationale: சந்திப்பு நிகழ்ந்த காலத்தை இயல்பான தமிழ் காலவினையெச்ச அமைப்பில் தெரிவிக்கிறது.
- source_word: συνήντησεν
  choice: சந்தித்தார்
  rationale: நேரிடுதல் அல்லது சந்தித்தல் என்ற பொருளை இயல்பான தமிழில் தருகிறது; முதன்மை உரையில் எழுவாயுடன் இணைந்து ‘சந்தித்தபோது’ என வருகிறது.
- source_word: αὐτῷ
  choice: அவனை
  rationale: ஆபிரகாமைக் குறிக்கும் கிரேக்கப் பிரதிப்பெயரைப் பிரதிப்பெயராகவே தக்கவைக்கிறது.
- source_word: Μελχισέδεκ
  choice: மெல்கிசேதேக்கு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
theological_decisions:
- issue: ஆபிரகாமிலிருந்து லேவி வந்த மரபுறவை மொழிப்படிமமாகக் கூறுதல்
  choice: ‘தன் தந்தையின் இடுப்பில்’ என்ற தெளிவான உடல்சார் படிமத்தை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘தன் மூதாதையின் உடலில்’ அல்லது ‘தன் மூதாதையிடத்தில் மரபுவழியாக இருந்தான்’
  rationale: லேவி ஆபிரகாமில் மூதாதை வழியாக இருந்தார் என்னும் ஆசிரியரின் பிரதிநிதித்துவ வாதத்தைத் தெளிவுரை மூலம் முன்கூட்டியே தீர்மானிக்காமல், மூலத்தின் அழுத்தத்தையும் இறையியல் பதற்றத்தையும் காக்கிறது.
- issue: ‘தந்தை’ என்பவரை அடையாளப்படுத்துதல்
  choice: முதன்மை உரையில் ‘தன் தந்தை’ எனவே மொழிபெயர்த்தல்
  alternative: ‘தன் மூதாதையான ஆபிரகாம்’
  rationale: சூழல் ஆபிரகாமைக் குறித்தாலும், கிரேக்க உரை பெயரைச் சேர்க்காமல் ‘தந்தை’ என்கிறது. ஆகவே இல்லாத குறிப்பை முதன்மை உரையில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் உடல்சார் மரபுத்தொடர் முதன்மை உரையில் பாதுகாக்கப்பட்டு, அதன் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
