- from: ஏனெனில், மெல்கிசேதேக்கு அவனைச் சந்தித்தபோது, அவன் இன்னும் தன் தந்தையின் இடுப்பில் இருந்தான்[a].
  to: ஏனெனில், மெல்கிசேதேக்கு ஆபிரகாமைச் சந்தித்தபோது, லேவி இன்னும் தன் மூதாதையான ஆபிரகாமின் இடுப்பில் இருந்தான்[a].
  rationale: The revision retains the source’s concrete ancestral-procreative image while resolving a misleading implication that could arise from ‘தன் தந்தையின்’ in contemporary Tamil. Abraham and Levi are supplied as the contextually necessary referents of the Greek pronouns; no theological interpretation beyond the verse’s ancestral-descendance idiom is added.
