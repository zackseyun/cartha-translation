source:
  edition: SBLGNT
  text: Τοιοῦτος γὰρ ἡμῖν ⸀καὶ ἔπρεπεν ἀρχιερεύς, ὅσιος, ἄκακος, ἀμίαντος, κεχωρισμένος ἀπὸ τῶν ἁμαρτωλῶν, καὶ ὑψηλότερος τῶν οὐρανῶν γενόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/026.yaml
  text: 'For such a high priest was indeed fitting for us: holy[a], innocent, undefiled, separated from sinners[b], and having become higher than the heavens.'
translation:
  language: ta
  text: 'ஏனெனில், இப்படிப்பட்ட தலைமைக் குரு நமக்குப் பொருத்தமானவராகவே இருந்தார்: அவர் பரிசுத்தமானவர், தீமையற்றவர், மாசற்றவர், பாவிகளிடமிருந்து பிரிக்கப்பட்டவரும்[a], வானங்களைவிட உயர்ந்தவராக ஆனவரும்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பாவிகளிடமிருந்து தனியே வைக்கப்பட்டவர்’ என்றும் மொழிபெயர்க்கலாம். இச்சொற்றொடர் அவரது தூய்மையையும் உயர்த்தப்பட்ட தலைமைக் குருத்துவ நிலையையும் எடுத்துக்காட்டுகிறது; பிரிவின் வகையை மூல உரை மேலும் வரையறுக்கவில்லை.
    reason: lexical_alternative
  - marker: b
    text: ‘வானங்களுக்கு மேலாக உயர்த்தப்பட்டவர்’ என்றும் மொழிபெயர்க்கலாம். மூலத்தின் நேரடியான ஒப்பீடு, ‘வானங்களைவிட உயர்ந்தவர்’ என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοιοῦτος
  choice: இப்படிப்பட்ட
  rationale: முன்பு விவரிக்கப்பட்ட தலைமைக் குருவின் தன்மையைச் சுட்டிக்காட்டும் பின்னோக்கிய தொடர்பை இயல்பான தமிழில் காக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வாதத்திற்கான விளக்கத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: ἡμῖν καὶ ἔπρεπεν
  choice: நமக்கு உண்மையாகவே ஏற்றவராக இருந்தார்
  rationale: ἡμῖν என்பதன் தொடர்புநிலைப் பொருளையும், ἔπρεπεν என்பதன் தகுதி அல்லது பொருத்தத்தையும், καί தரும் வலியுறுத்தலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀρχιερεύς
  choice: தலைமைக் குரு
  rationale: எபிரெயர் திருமுகத்தின் ஆசாரியச் சூழலில் உள்ள உயர்ந்த குருத்துவப் பதவிக்கான தெளிவான, வழக்கமான தமிழ் சொல்.
- source_word: ὅσιος
  choice: பரிசுத்தமானவர்
  rationale: இங்கு தலைமைக் குருவின் கடவுளுக்குரிய தூய்மையையும் ஒழுக்கத் தன்மையையும் குறிக்கிறது.
- source_word: ἄκακος
  choice: தீமையற்றவர்
  rationale: தீய குணமோ தீய நோக்கமோ இல்லாத தன்மையைத் தெரிவிக்கிறது; வெறுமனே பிறருக்குத் தீங்கு செய்யாதவர் என்ற குறுகிய பொருளைத் தவிர்க்கிறது.
- source_word: ἀμίαντος
  choice: மாசற்றவர்
  rationale: ஒழுக்க மற்றும் வழிபாட்டுத் தூய்மை ஆகிய இரண்டையும் நினைவூட்டும் மாசுபடாத நிலையைச் சுருக்கமாகக் காக்கிறது.
- source_word: κεχωρισμένος ἀπὸ τῶν ἁμαρτωλῶν
  choice: பாவிகளிடமிருந்து பிரிக்கப்பட்டவர்
  rationale: முற்றுப்பெற்ற பிரிவின் விளைவாகத் தொடரும் நிலையைக் குறிக்கும் perfect passive participle-இன் வடிவையும் பொருளையும் காக்கிறது.
- source_word: ὑψηλότερος τῶν οὐρανῶν γενόμενος
  choice: வானங்களைவிட உயர்ந்தவரானவர்
  rationale: ஒப்பீட்டு வடிவமான ‘வானங்களைவிட உயர்ந்தவர்’ என்பதையும், γενόμενος குறிக்கும் அந்த உயர்ந்த நிலையை அடைந்ததையும் வெளிப்படுத்துகிறது; செய்பவரை உரையில் இல்லாமல் சேர்ப்பதில்லை.
theological_decisions:
- issue: ‘பாவிகளிடமிருந்து பிரிக்கப்பட்டவர்’ என்பதில் இயேசுவுக்கும் பாவிகளுக்கும் உள்ள உறவு
  choice: மூலத்தின் நேரடியான பிரிவுச் சொல்லை வைத்திருந்து, அது அவரது ஒழுக்கத் தூய்மையையும் உயர்த்தப்பட்ட தலைமைக் குருத்துவ நிலையையும் குறிப்பதற்கு இடமளித்தல்
  alternative: அவர் பூமியிலேயே பாவிகளுடன் எந்தத் தொடர்பும் கொள்ளவில்லை எனப் பொருள்படுத்துதல்; அல்லது விண்ணேற்றத்திற்குப் பிந்தைய இடவியல் பிரிவை மட்டும் வெளிப்படையாகக் கூறுதல்
  rationale: சுற்றியுள்ள அடைமொழிகள் தலைமைக் குருவுக்குரிய தூய்மையையும் உயர்வையும் வலியுறுத்துகின்றன. ஆயினும் மூல உரை பிரிவின் வகையைத் துல்லியமாக வரையறுக்காததால், அந்தத் தத்துவப் பதற்றம் மொழிபெயர்ப்பில் காக்கப்படுகிறது.
- issue: γενόμενος உடன் வரும் உயர்த்தப்பட்ட நிலை
  choice: ‘வானங்களைவிட உயர்ந்தவரானவர்’ என்று வரலாற்று அல்லது விளைவுநிலைக்கான நகர்வை வெளிப்படுத்துதல்
  alternative: ‘வானங்களைவிட உயர்ந்தவராக இருக்கிறவர்’ என்ற நிலைமட்டும் குறிக்கும் மொழிபெயர்ப்பு; அல்லது ‘வானங்களுக்கு மேலாக உயர்த்தப்பட்டவர்’ என்று வெளிப்படையான செயப்பாட்டு முகத்தைச் சேர்த்தல்
  rationale: γενόμενος உயர்ந்த நிலையை அடைந்ததைக் குறிக்கிறது; ஆனால் அந்த மாற்றத்தின் செய்பவரையோ இயல்பில் ஏற்பட்ட மாற்றத்தையோ நேரடியாகக் கூறவில்லை. ஆகவே கிறிஸ்துவின் அடையாளம் அல்லது இயல்பு மாறியதாக உரைக்கு அப்பாற்பட்டு உணர்த்தாமல், அவரது உயர்த்தப்பட்ட குருத்துவ நிலையைக் காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தலைமைக் குரு’ என்ற பதம் எபிரெயர் திருமுகத்தின் வழிபாட்டு மற்றும் ஆசாரியச் சூழலைத் தெளிவாகக் காக்கிறது. தொடர்ச்சியான அடைமொழிகளின் ஓசையும் வாதத்தின் வலிமையும் நிலைக்க, பட்டியல் அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
