reference: Hebrews 7:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ νόμος γὰρ ἀνθρώπους καθίστησιν ἀρχιερεῖς ἔχοντας ἀσθένειαν, ὁ λόγος δὲ τῆς ὁρκωμοσίας τῆς μετὰ τὸν νόμον υἱόν, εἰς τὸν αἰῶνα τετελειωμένον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/028.yaml
  text: For the law appoints men as high priests who have weakness[a], but the word of the oath, which came after the law[b], appoints a Son who has been perfected forever.
translation:
  language: ta
  text: ஏனெனில், திருச்சட்டம் பலவீனம் உள்ள மனிதர்களைத் தலைமை ஆசாரியர்களாக நியமிக்கிறது. ஆனால் திருச்சட்டத்திற்குப் பிறகு வந்த சத்தியப்பிரமாணத்தின் வாக்கு, என்றென்றைக்கும் முழுநிறைவாக்கப்பட்ட ஒரு மகனை[a][b] நியமிக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மகனை.’ கிரேக்கத்தில் ‘மகன்’ என்பதற்கு திட்டவுருபு இல்லை. இது ‘மனிதர்கள்’ என்பதுடனான வேறுபாட்டை வலியுறுத்துகிறது; சூழலில் இயேசுவையே குறிக்கிறது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘என்றென்றைக்கும் முழுநிறைவு பெற்றவராக ஆக்கப்பட்ட’; இந்த வினைச்சொல் ‘நோக்கத்திற்குரிய நிறைவுக்குக் கொண்டுவரப்பட்ட’ என்றும், ஆசாரியச் சூழலில் ‘அர்ப்பணிக்கப்பட்ட’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: திருச்சட்டம்
  rationale: இங்கு மோசேயின் சட்டத்தையும் அதனுடன் தொடர்புடைய ஆசாரிய முறைமையையும் குறிக்கிறது; நவீன தமிழில் இந்தச் சூழலைத் தெளிவாக உணர்த்தும் வழக்கமான சொல்.
- source_word: καθίστησιν
  choice: நியமிக்கிறது
  rationale: ஆசாரியப் பதவியில் அதிகாரபூர்வமாக ஏற்படுத்துவதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀνθρώπους
  choice: மனிதர்களை
  rationale: மூலத்தின் பொதுவான மனிதக் குறிப்பைத் தக்கவைத்து, அடுத்துள்ள ‘மகன்’ என்பதுடன் உள்ள வேறுபாட்டையும் வெளிப்படுத்துகிறது; வரலாற்றுச் சூழலில் இவர்கள் ஆண் தலைமை ஆசாரியர்கள் என்பது பதவிப்பெயரால் தெளிவாகிறது.
- source_word: ἀρχιερεῖς
  choice: தலைமை ஆசாரியர்களாக
  rationale: அடுத்தடுத்து அந்த ஒரே பதவியை வகித்தவர்களைக் குறிக்கும் பன்மையை இயல்பான தமிழில் தருகிறது.
- source_word: ἔχοντας ἀσθένειαν
  choice: பலவீனம் உள்ள
  rationale: ἀσθένεια என்ற பெயர்ச்சொல்லைத் தக்கவைத்து, உடல் நோயை மட்டும் அல்லாமல் மனிதக் குறைபாட்டையும் பலவீனத்தையும் குறிக்க இடமளிக்கிறது.
- source_word: ὁ λόγος τῆς ὁρκωμοσίας
  choice: ஆணையுறுதியின் வார்த்தை
  rationale: தேவன் ஆணையிட்டுக் கூறிய வேதவாக்கைக் குறிக்கும் சொற்றொடரின் வடிவத்தையும் அதன் வேதாகமச் செறிவையும் தக்கவைக்கிறது.
- source_word: τῆς μετὰ τὸν νόμον
  choice: திருச்சட்டத்திற்குப் பிறகு வந்த
  rationale: சங்கீதம் 110-இல் உள்ள ஆணையுறுதி திருச்சட்டத்திற்குப் பிந்தியது என்ற எபிரெயர் நிருபத்தின் வாதத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: υἱόν
  choice: ஒரு மகனை
  rationale: கிரேக்கத்தில் சுட்டு உருபில்லாத வடிவத்தையும் ‘மனிதர்கள்’ என்பதுடனான வேறுபாட்டையும் சாத்தியமான அளவு தக்கவைக்கிறது; சூழலில் இது இயேசுவையே குறிக்கிறது.
- source_word: εἰς τὸν αἰῶνα
  choice: என்றென்றைக்கும்
  rationale: நிலைத்திருக்கும் ஆசாரியத்துவச் சூழலில் இயல்பான தமிழ்ச் சமமாகும்.
- source_word: τετελειωμένον
  choice: முழுநிறைவு பெற்றிருக்கிற
  rationale: நிறைவு நிலையை அடையச் செய்யப்பட்டு அந்த நிலையில் இருப்பதைக் குறிக்கும் நிறைவேற்றப்பட்ட செயப்பாட்டு வினையெச்சத்தின் விளைவு நிலையை வெளிப்படுத்துகிறது; ஆசாரியப் பணிக்குத் தகுதிப்படுத்துதல் என்ற உட்பொருளையும் முற்றிலும் ஒதுக்கவில்லை.
theological_decisions:
- issue: சுட்டு உருபில்லாத υἱόν என்பதன் மொழிபெயர்ப்பு
  choice: ஒரு மகனை
  alternative: மகனை
  rationale: மனிதத் தலைமை ஆசாரியர்களுக்கும் மகனுக்கும் இடையிலான வேறுபாட்டை முன்னிறுத்தும் கிரேக்க வடிவத்தைத் தக்கவைக்கிறது. ‘ஒரு’ என்பது பல மகன்களில் ஒருவர் என்று கட்டாயமாகப் பொருள்படாது; இச்சூழலில் இயேசுவே குறிப்பிடப்படுகிறார் என்பதை அடிக்குறிப்பு தெளிவாக்குகிறது.
- issue: τετελειωμένον என்பதன் ஆசாரியவியல் பொருள்
  choice: முழுநிறைவு பெற்றிருக்கிற
  alternative: என்றென்றைக்கும் அர்ப்பணிக்கப்பட்டிருக்கிற
  rationale: எபிரெயர் நிருபத்தில் ‘முழுநிறைவு’ அல்லது ‘நோக்கத்திற்குரிய நிறைவை அடைதல்’ என்ற கருத்தைத் தீர்த்துவிடாமல் தக்கவைக்கிறது; ‘ஆசாரியப் பணிக்காக அர்ப்பணிக்கப்பட்டவர்’ என்ற வழிபாட்டுச் சார்ந்த சாத்தியப் பொருள் அடிக்குறிப்பில் வழங்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையில் மொழிபெயர்க்கப்பட்டது. ‘திருச்சட்டம்’, ‘தலைமை ஆசாரியர்’ போன்ற பரவலாக அறியப்பட்ட சொற்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தில் இல்லாத வினை இரண்டாம் கூறில் தமிழின் இலக்கணத் தெளிவுக்காக மீண்டும் வழங்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்களுக்கே நேரடியாக இணைக்கப்பட்டுள்ளன.
