  to: ஏனெனில், திருச்சட்டம் பலவீனம் உள்ள மனிதர்களைத் தலைமை ஆசாரியர்களாக நியமிக்கிறது. ஆனால் திருச்சட்டத்திற்குப் பிறகு வந்த சத்தியப்பிரமாணத்தின் வாக்கு, என்றென்றைக்கும் முழுநிறைவாக்கப்பட்ட ஒரு மகனை[a][b] நியமிக்கிறது.
