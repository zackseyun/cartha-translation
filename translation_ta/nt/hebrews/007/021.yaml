source:
  edition: SBLGNT
  text: ὁ δὲ μετὰ ὁρκωμοσίας διὰ τοῦ λέγοντος πρὸς αὐτόν· Ὤμοσεν κύριος, καὶ οὐ μεταμεληθήσεται, Σὺ ἱερεὺς εἰς τὸν ⸀αἰῶνα),
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/021.yaml
  text: but this one became a priest with an oath through the one who said to him[a], “The Lord has sworn and will not change his mind, ‘You are a priest forever.’”
translation:
  language: ta
  text: 'ஆனால் இவரோ, அவரிடம் கூறியவரால் செய்யப்பட்ட சத்தியத்துடன் ஆசாரியரானார்: “ஆண்டவர் சத்தியம் செய்திருக்கிறார்[a]; அவர் தம் மனதை மாற்றிக்கொள்ள மாட்டார்: ‘நீர் என்றென்றும் ஆசாரியர்.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொல்லுக்குச் சொல்லாக, “ஆண்டவர் சத்தியம் செய்தார்.” கிரேக்க இறந்தகால வினைச்சொல்லை “சத்தியம் செய்தார்” என்றும், அந்தச் சத்தியத்தின் தொடரும் வலிமையை உணர்த்த “சத்தியம் செய்திருக்கிறார்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: ஆனால் இவரோ
  rationale: முந்தைய வசனத்தில் ஆணையின்றி ஆசாரியர்களானவர்களுக்கும் இங்கு குறிப்பிடப்படுபவருக்கும் உள்ள வலுவான முரண்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: μετὰ ὁρκωμοσίας
  choice: ஆணையுடன்
  rationale: ஆசாரிய நியமனத்தோடு இணைந்திருந்த இறை ஆணையைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது; முந்தைய வசனத்தின் ‘ஆணையின்றி’ என்ற கருத்துடன் உள்ள எதிர்மறை ஒப்புமையையும் காக்கிறது.
- source_word: διὰ τοῦ λέγοντος πρὸς αὐτόν
  choice: தம்மிடம் சொன்னவரின் ஆணையுடன்
  rationale: διά + genitive குறிக்கும் முகமை/வழியைத் தமிழில் வாசிக்கத்தக்கவாறு உட்பொதிக்கிறது. ‘தம்மிடம்’ என்பது மேற்கோள் யாரிடம் சொல்லப்பட்டது என்பதைத் தெளிவாகக் காக்கிறது.
- source_word: Ὤμοσεν κύριος
  choice: ஆண்டவர் ஆணையிட்டிருக்கிறார்
  rationale: சங்கீத மேற்கோளில் உள்ள solemn oath-ஐ ‘ஆணையிட்டிருக்கிறார்’ என வழங்குவது அதன் நீடித்த செல்லுபடியை வெளிப்படுத்துகிறது; கிரேக்க இறந்தகால வடிவத்தை ‘ஆணையிட்டார்’ என்றும் தர முடியும் என்பதால் அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: கிரேக்க κύριος என்பதற்கான இயல்பான, மரியாதைமிக்க தமிழ் இணை; எபிரெய மூலத்தின் தெய்வீகப் பெயரை ஊகித்து வேறு வடிவம் புகுத்தாமல் கிரேக்க உரையைப் பின்பற்றுகிறது.
- source_word: οὐ μεταμεληθήσεται
  choice: அவர் தம் மனதை மாற்றிக்கொள்ள மாட்டார்
  rationale: இங்கு பொருள் ஒழுக்கரீதியான மனந்திரும்புதல் அல்ல; அறிவிக்கப்பட்ட நோக்கத்தைத் திரும்பப் பெறாதிருப்பதே. இதை நவீன தமிழில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: Σὺ ἱερεὺς
  choice: நீர் ... ஆசாரியர்
  rationale: மரியாதைமிக்க இரண்டாம் நபர் வடிவத்துடன், கிரேக்கத்தில் மறைந்துள்ள இணைப்புவினையை தமிழில் இயல்பாகப் பூர்த்தி செய்கிறது.
- source_word: εἰς τὸν αἰῶνα
  choice: என்றென்றும்
  rationale: இந்த நிலையான கிரேக்க சொற்றொடரின் முடிவில்லாத காலப் பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: சங்கீதம் 110:4 மேற்கோளில் ஆசாரியத்துவம் இறைவனின் ஆணையால் நிறுவப்பட்டிருப்பது
  choice: இவர் ஆணையுடன் ஆசாரியரானார் என்றும், அந்த ஆணை மாற்றப்படாது என்றும் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஆணையின் மூலம் ஆசாரியரானார்’ என்று இன்னும் கருவிசார் நடையில் தரலாம்.
  rationale: சூழலில் ஆணையின்றி நியமிக்கப்பட்ட முந்தைய ஆசாரியர்களுக்கும் இறை ஆணையால் நிறுவப்பட்ட நிலையான ஆசாரியத்துவத்துக்கும் உள்ள வேறுபாடே மையம். பிற்கால கோட்பாட்டுச் சொற்களைச் சேர்க்காமல் அந்த வேறுபாடு பாதுகாக்கப்படுகிறது.
- issue: Ὤμοσεν என்ற aorist வடிவத்தின் காலநிலை
  choice: ஆணையிட்டிருக்கிறார்
  alternative: ஆணையிட்டார்
  rationale: நிகழ்ந்து முடிந்த ஆணையின் தொடரும் வலிமையைத் தமிழின் நிறைவுநிகழ்கால வடிவம் இயல்பாக வெளிப்படுத்துகிறது; எளிய இறந்தகாலமும் இலக்கணரீதியாகச் சாத்தியமாதலால் அடிக்குறிப்பில் பதிவு செய்யப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் வேதாகம மேற்கோளுக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. ‘இவரோ’ முரண்பாட்டைத் தெளிவாக்குகிறது; ‘நீர்’ மேற்கோளின் நேரடி உரையாடல் மரியாதையைப் பேணுகிறது. ‘ஆசாரியர்’ என்பது வாசகர்களுக்கு பரிச்சயமான வேதாகமச் சொல் என்பதால் பயன்படுத்தப்பட்டது.
