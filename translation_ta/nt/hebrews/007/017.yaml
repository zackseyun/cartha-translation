  text: ⸀μαρτυρεῖται γὰρ ὅτι Σὺ ἱερεὺς εἰς τὸν αἰῶνα κατὰ τὴν τάξιν Μελχισέδεκ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/017.yaml
  text: 'For it is testified: “You are a priest forever according to the order of Melchizedek.”[a][b]'
translation:
  language: ta
  text: 'ஏனெனில், இவ்வாறு சாட்சி அளிக்கப்பட்டுள்ளது: “நீர் என்றென்றும் மெல்கிசேதேக்கின் முறைப்படி[a] ஆசாரியராக இருக்கிறீர்.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மெல்கிசேதேக்கின் வரிசையின்படி.”
    reason: lexical_alternative
  - marker: b
    text: சங்கீதம் 110:4-லிருந்து மேற்கோள்.
    reason: cross_reference
lexical_decisions:
- source_word: μαρτυρεῖται
  choice: சாட்சி அளிக்கப்பட்டுள்ளது
  rationale: நிகழ்காலச் செயப்பாட்டு/எழுவாயற்ற வடிவத்தைப் பாதுகாத்து, வேதவாக்கு சாட்சியாக முன்வைக்கப்படுவதை உணர்த்துகிறது; சாட்சியளிப்பவர் யார் என்பதை மூலத்தை மீறிக் குறிப்பதில்லை.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கு ஆதாரத்தையோ காரணத்தையோ அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக இயல்பாக உள்ளது.
- source_word: ὅτι
  choice: 'இவ்வாறு ... :'
  rationale: சாட்சியின் உள்ளடக்கமான நேரடி மேற்கோளை அறிமுகப்படுத்துவதால், தமிழில் ‘இவ்வாறு’ மற்றும் முக்காற்புள்ளி இயல்பாக அமைந்துள்ளன.
- source_word: Σὺ
  choice: நீர்
  rationale: வலியுறுத்தப்பட்ட ஒருமை இரண்டாம் நபர் சுட்டுப்பெயரை, நேரடி உரையின் கண்ணியமான தமிழில் தருகிறது.
- source_word: ἱερεὺς
  choice: ஆசாரியராக
  rationale: மூலத்தில் உள்ள பொதுவான ‘ஆசாரியர்’ என்ற பதவியைத் தருகிறது; ‘தலைமை ஆசாரியர்’ என்று விரிவுபடுத்தவில்லை.
- source_word: εἰς τὸν αἰῶνα
  choice: என்றென்றும்
  rationale: இடைவிடாத, நிரந்தர காலத்தைக் குறிக்கும் கிரேக்க மரபுத்தொடருக்கு தெளிவான இயல்பான தமிழ் இணை.
- source_word: κατὰ τὴν τάξιν
  choice: முறைப்படி
  rationale: ஒரு முன்மாதிரி அல்லது ஆசாரிய வகையுடன் உள்ள ஒத்திசைவைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது; வெறும் தொடர்வரிசை என்ற பொருளுக்கு மட்டுப்படுத்தவில்லை.
- source_word: Μελχισέδεκ
  choice: மெல்கிசேதேக்
  rationale: தனிப்பெயரை நவீனத் தமிழில் ஒலிபெயர்த்துள்ளது.
theological_decisions:
- issue: சங்கீத மேற்கோளில் உள்ள ஆசாரியப் பதவியைப் பிற்கால விளக்கத்தின் மூலம் விரிவுபடுத்தாமல் மொழிபெயர்த்தல்
  choice: ஆசாரியராக
  alternative: தலைமை ஆசாரியராக
  rationale: இந்த வசனத்தின் கிரேக்க மூலம் ἱερεύς (‘ஆசாரியர்’) என்றே கூறுகிறது. எபிரெயர் நூல் இயேசுவைத் தலைமை ஆசாரியராக விளக்கினாலும், இங்கே ‘தலைமை’ என்பதைச் சேர்ப்பது மூலத்தை மீறும்.
- issue: κατὰ τὴν τάξιν என்பதன் உறவை வெளிப்படுத்துதல்
  choice: மெல்கிசேதேக்கின் முறைப்படி
  alternative: மெல்கிசேதேக்கின் வரிசையின்படி
  rationale: τάξις என்பது இங்கு வெறும் காலவரிசையைக் காட்டாமல், மெல்கிசேதேக்குடன் ஒத்த ஆசாரிய முறை அல்லது வகையைச் சுட்டக்கூடும். ‘முறைப்படி’ இந்தப் பரப்பைத் திறந்தவாறே வைத்திருக்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. வேதாகமச் சூழலில் பரவலாக அறியப்படும் ‘ஆசாரியர்’ என்பதும், நேரடி தெய்வீக உரைக்கு ஏற்ற ‘நீர்’ என்பதும் தக்கவைக்கப்பட்டுள்ளன. வாக்கியம் இயல்பாக இருக்க ‘என்றென்றும்’ முன்னிறுத்தப்பட்டுள்ளது; மூலத்தின் இறையியல் உள்ளடக்கம் விரிவுபடுத்தப்படவில்லை.
