source:
  edition: SBLGNT
  text: Θεωρεῖτε δὲ πηλίκος οὗτος ⸀ᾧ δεκάτην Ἀβραὰμ ἔδωκεν ἐκ τῶν ἀκροθινίων ὁ πατριάρχης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/004.yaml
  text: Consider how great this man was[b][a], to whom Abraham the patriarch gave a tenth of the spoils.
translation:
  language: ta
  text: இவர் எவ்வளவு மேன்மையானவர் என்பதை எண்ணிப் பாருங்கள்! குலமுதல்வரான ஆபிரகாம், போரில் கைப்பற்றிய பொருள்களில்[b] பத்தில் ஒரு பங்கை[a] இவருக்குக் கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தசமபாகத்தை.” கிரேக்கத்தில் சொற்சொல்லாக “பத்தில் ஒரு பங்கு” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: இதற்கான கிரேக்கச் சொல் போரில் கைப்பற்றிய பொருள்களைக் குறிக்கிறது; அவற்றில் மிகச் சிறந்த பகுதியையும் அது குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θεωρεῖτε
  choice: எண்ணிப் பாருங்கள்
  rationale: பன்மை நிகழ்காலக் கட்டளையின் கவனமாகச் சிந்திக்கும்படி அழைக்கும் வலிமையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது வலுவான எதிர்மறையை அல்ல, மென்மையான உரையாடல் நகர்வையே குறிக்கிறது. தமிழில் தனி இணைப்புச் சொல்லைச் சேர்க்காமல் வாக்கிய ஓட்டமே அதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: πηλίκος
  choice: எவ்வளவு மேன்மையானவர்
  rationale: அளவு அல்லது பெருமையைச் சுட்டும் சொல்லின் மதிப்பீட்டு வலிமையைப் பாதுகாக்கிறது; அந்த மேன்மையின் முழுத் தன்மையைத் தீர்மானித்துவிடவில்லை.
- source_word: οὗτος
  choice: இவர்
  rationale: முந்தைய சூழலில் வரும் மெல்கிசேதேக்கைக் குறிக்கும் ஆண்பால் ஒருமைச் சுட்டுப்பெயரை இயல்பாகவும் மரியாதையுடனும் தருகிறது.
- source_word: δεκάτην
  choice: பத்தில் ஒரு பங்கு
  rationale: கிரேக்கத்தின் நேரடியான பொருளைத் தெளிவாகத் தருகிறது; பிற்கால நிறுவனச் சார்புகளை ஏற்படுத்தக்கூடிய ‘தசமபாகம்’ என்ற சொல்லை முதன்மை உரையில் தவிர்க்கிறது.
- source_word: Ἀβραὰμ
  choice: ஆபிரகாம்
  rationale: தமிழில் பரவலாக ஏற்றுக்கொள்ளப்பட்ட பெயர் வடிவம்.
- source_word: ἔδωκεν
  choice: கொடுத்தார்
  rationale: δίδωμι என்ற வினையின் எளிய இறந்தகாலச் செயலை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: ἐκ τῶν ἀκροθινίων
  choice: போரில் கைப்பற்றிய பொருள்களில்
  rationale: போர்க் கொள்ளைப் பொருள்களைக் குறிக்கும் சூழலைத் தெளிவாகவும், ‘கொள்ளை’ என்பதன் தேவையற்ற குற்றவியல் ஒலியைத் தவிர்த்தும் இயல்பான தமிழில் தருகிறது; ‘மிகச் சிறந்த பகுதி’ என்ற சாத்திய நுணுக்கம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: ὁ πατριάρχης
  choice: குலமுதல்வரான
  rationale: ஆபிரகாமின் மூதாதை மற்றும் குலத் தலைமை நிலையை, பழமையான அல்லது தெளிவற்ற சொற்களைத் தவிர்த்து, சுருக்கமாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: மெல்கிசேதேக்கின் மேன்மையை வலியுறுத்தும் விதம்
  choice: குலமுதல்வரான ஆபிரகாம் இவருக்குப் பத்தில் ஒரு பங்கைக் கொடுத்த செயல் மூலம் இவருடைய மேன்மையை வசனம் வலியுறுத்துகிறது.
  alternative: இந்தச் செயல் மெல்கிசேதேக்கின் மேலான அதிகாரநிலையை நேரடியாக அறிவிப்பதாக விரிவுபடுத்தலாம்.
  rationale: கிரேக்க உரை மேன்மையைச் சுட்டினாலும், அதன் முழுத் தத்துவவியல் விளைவுகளை இவ்வசனத்திலேயே தீர்மானிப்பதில்லை. எனவே சுற்றியுள்ள வாதம் அந்த முடிவை வளர்க்க இடமளிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘எண்ணிப் பாருங்கள்’ என்ற சொற்றொடர் அறிவார்ந்த கவனத்திற்கான அழைப்பைத் தக்கவைக்கிறது. ‘குலமுதல்வர்’ என்பது ஆபிரகாமின் முன்னோர் மற்றும் தலைமை நிலையை இயல்பாகத் தெரிவிக்கிறது; தேவையற்ற சமயக் குழுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
