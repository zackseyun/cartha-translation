  text: χωρὶς δὲ πάσης ἀντιλογίας τὸ ἔλαττον ὑπὸ τοῦ κρείττονος εὐλογεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/007.yaml
  text: Beyond all dispute[a], the lesser is blessed by the greater.
translation:
  language: ta
  text: எவ்வித மறுப்புக்கும் இடமின்றி[a], தாழ்ந்தவர் உயர்ந்தவரால் ஆசீர்வதிக்கப்படுகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எந்த எதிர்வாதமுமின்றி” அல்லது “எந்த முரண்பாடுமின்றி.”
    reason: ἀντιλογία என்பதன் ‘மறுப்பு,’ ‘எதிர்வாதம்,’ ‘முரண்பாடு’ என்ற நெருங்கிய பொருள் நிழல்களைக் காட்டுகிறது.
lexical_decisions:
- source_word: χωρὶς δὲ πάσης ἀντιλογίας
  choice: எந்த மறுப்புக்கும் இடமின்றி
  rationale: χωρίς + genitive என்பதன் ‘இல்லாமல்/இடமின்றி’ என்ற வலிமையையும், ἀντιλογία என்பதன் ‘மறுப்பு, எதிர்வாதம்’ என்ற பொருளையும் இயல்பான நவீனத் தமிழில் தருகிறது. δέ இங்கு மென்மையான உரைத் தொடர்ச்சியைச் சுட்டுவதால் தனியாக வலுவான எதிர்மறை இணைப்புச் சொல் சேர்க்கப்படவில்லை.
- source_word: τὸ ἔλαττον
  choice: சிறியவர்
  rationale: இது ஒருவரின் ஒப்பீட்டு நிலை அல்லது தரத்தைக் குறிக்கும் பொதுமைப்படுத்தப்பட்ட பெயர்ச்சொல் பயன்பாடு. ‘தாழ்ந்தவர்’ என்பது இழிவான அல்லது நெறிசார் அர்த்தத்தைத் தூண்டக்கூடும்; ‘சிறியவர்’ அந்தச் சேர்க்கையைத் தவிர்த்து ஒப்பீட்டைத் தக்கவைக்கிறது.
- source_word: ὑπὸ τοῦ κρείττονος
  choice: பெரியவரால்
  rationale: ὑπό + genitive செயலாற்றுபவரைக் குறிக்கிறது. κρείττων இங்கு உயர்ந்த நிலை அல்லது மேன்மையைச் சுட்டுகிறது; ‘பெரியவர்’ என்பது ‘சிறியவர்’ என்பதுடன் இயல்பான ஒப்பீட்டு இணையாக அமைகிறது.
- source_word: εὐλογεῖται
  choice: ஆசீர்வதிக்கப்படுகிறார்
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவத்தின் பொதுக் கோட்பாட்டு வலிமையையும், மெல்கிசேதேக்கு ஆபிரகாமை ஆசீர்வதித்த சூழலையும் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: ‘சிறியவர்’ மற்றும் ‘பெரியவர்’ என்போருக்கிடையிலான ஒப்பீட்டின் தன்மை
  choice: குறைந்த நிலையில் இருப்பவர் உயர்ந்த நிலையில் இருப்பவரால் ஆசீர்வதிக்கப்படுகிறார் என்ற பொதுக் கோட்பாடாக மொழிபெயர்க்கப்பட்டது.
  alternative: இது இறையியல் முக்கியத்துவமில்லாத ஒரு சமூக வழக்கம் மட்டுமே என வெளிப்படையாகக் குறிப்பிடுதல்.
  rationale: எபிரெயர் 7-இன் வாதத்தில் இந்தக் கூற்று மெல்கிசேதேக்கு ஆபிரகாமைவிட உயர்ந்தவர் என்பதை ஆதரிக்கிறது. இருப்பினும் அந்த விளக்கத்தை வசனத்துக்குள் சேர்க்காமல், மூலத்தின் ஒப்பீட்டு மொழியும் அதன் இறையியல் வலிமையும் பாதுகாக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சிறியவர்/பெரியவர்’ என்ற இணை சாதாரண வாசகருக்குப் புரியும்படி ஒப்பீட்டு நிலையை வெளிப்படுத்துகிறது; வயது அல்லது உடல் அளவு என்ற பொருள் சூழலால் கட்டுப்படுத்தப்படுகிறது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
