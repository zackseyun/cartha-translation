source:
  edition: SBLGNT
  text: ὁ δὲ μὴ γενεαλογούμενος ἐξ αὐτῶν δεδεκάτωκεν ⸀Ἀβραάμ, καὶ τὸν ἔχοντα τὰς ἐπαγγελίας εὐλόγηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/006.yaml
  text: But the one who is not traced by genealogy from them has taken a tenth from Abraham and has blessed the one who had the promises[a][b].
translation:
  language: ta
  text: ஆனால், அவர்களிடமிருந்து வந்ததாக வம்சவரிசையில் பதிவுசெய்யப்படாதவரோ, ஆபிரகாமிடமிருந்து பத்தில் ஒரு பங்கைப் பெற்றிருக்கிறார்[a]; வாக்குறுதிகளை உடையவரை ஆசீர்வதித்திருக்கிறார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆபிரகாமிடமிருந்து தசமபாகத்தைப் பெற்றிருக்கிறார்.’ கிரேக்க வினைச்சொல் பத்தில் ஒரு பங்கைப் பெறுதல் அல்லது வசூலித்தல் என்ற நுணுக்கங்களைக் கொண்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘வாக்குறுதிகளை உடையிருந்தவரை அவர் ஆசீர்வதித்தார்.’ கிரேக்கத்தில் ‘உடையவர்’ என்பது நிகழ்காலப் பங்கேற்பு வினை; ஆனால் ஆபிரகாமைப் பற்றிய வரலாற்றுக் குறிப்பில் தமிழில் கடந்தகால வடிவமும் இயல்பாக அமையலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ μὴ γενεαλογούμενος ἐξ αὐτῶν
  choice: ஆனால், அவர்களிலிருந்து வம்சாவளி கணக்கிடப்படாதவரோ
  rationale: γενεαλογούμενος என்பதன் நிகழ்காலச் செயப்பாட்டு நுணுக்கத்தையும், லேவியரின் வழிமரபிலிருந்து இவர் வராதவர் என்ற சூழல்சார் முரண்பாட்டையும் காக்கிறது. ‘அவர்களிலிருந்து’ என்பது ἐξ αὐτῶν என்பதை மிகைப்படுத்தாமல் மொழிபெயர்க்கிறது.
- source_word: δεδεκάτωκεν Ἀβραάμ
  choice: ஆபிரகாமிடமிருந்து பத்தில் ஒரு பங்கைப் பெற்றிருக்கிறார்
  rationale: வினைச்சொல் பத்தில் ஒரு பங்கை வாங்குதல் அல்லது பெறுதல் எனப் பொருள்படும். கிரேக்க நிறைவுக்காலத்தின் தொடரும் வாத முக்கியத்துவத்தை ‘பெற்றிருக்கிறார்’ வெளிப்படுத்துகிறது.
- source_word: τὸν ἔχοντα τὰς ἐπαγγελίας
  choice: வாக்குறுதிகளை உடையவரை
  rationale: ἔχοντα என்ற நிகழ்காலப் பங்கேற்பு வினையின் ‘உடையவர்’ என்ற நேரடியான பொருளையும், ἐπαγγελίας என்பதன் பன்மையையும் காக்கிறது.
- source_word: εὐλόγηκεν
  choice: ஆசீர்வதித்திருக்கிறார்
  rationale: கிரேக்க நிறைவுக்காலத்தைப் பிரதிபலித்து, மெல்கிசேதேக்கின் செயல் ஆசிரியரின் தற்போதைய வாதத்தில் இன்னும் முக்கியமானது என்பதைத் தக்கவைக்கிறது.
theological_decisions:
- issue: மெல்கிசேதேக்குக்கும் லேவிய வம்சவரிசைக்கும் இடையிலான தொடர்பு
  choice: லேவியரின் வழிமரபிலிருந்து வம்சாவளி கணக்கிடப்படாதவர் என்ற வம்சாவளி சார்ந்த முரண்பாட்டை மட்டும் உரை தெரிவிக்கிறது.
  alternative: இதை மெல்கிசேதேக்கின் பிறப்பு அல்லது இயல்பைப் பற்றிய மேன்மைநிலை கூற்றாக வாசிக்கலாம்.
  rationale: சூழலில் வாதம் ஆசாரியப் பணிக்கான லேவிய வம்சத் தகுதியைப் பற்றியது; மெல்கிசேதேக்கின் தோற்றம் அல்லது இயல்பைப் பற்றிய ஊகத்தை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘வம்சாவளி கணக்கிடப்படாதவர்’ என்பது சட்டபூர்வ/ஆசாரிய வம்சப் பதிவின் கருத்தைத் தக்கவைக்கிறது; ‘வாக்குறுதிகள்’ என்பது இன்றைய வாசகர்களுக்கு இயல்பாக இருப்பதால் பயன்படுத்தப்பட்டது.
