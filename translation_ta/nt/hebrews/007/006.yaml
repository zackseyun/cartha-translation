revisions:
- from: ஆனால், அவர்களிலிருந்து வம்சாவளி கணக்கிடப்படாதவரோ ஆபிரகாமிடமிருந்து பத்தில் ஒரு பங்கைப் பெற்றிருக்கிறார்[a]; வாக்குறுதிகளை உடையவரை அவர் ஆசீர்வதித்திருக்கிறார்[b].
  to: ஆனால், அவர்களிடமிருந்து வந்ததாக வம்சவரிசையில் பதிவுசெய்யப்படாதவரோ, ஆபிரகாமிடமிருந்து பத்தில் ஒரு பங்கைப் பெற்றிருக்கிறார்[a]; வாக்குறுதிகளை உடையவரை ஆசீர்வதித்திருக்கிறார்[b].
