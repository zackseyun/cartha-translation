  text: μετατιθεμένης γὰρ τῆς ἱερωσύνης ἐξ ἀνάγκης καὶ νόμου μετάθεσις γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/012.yaml
  text: For when the priesthood is changed[a], of necessity there is also a change of law.
translation:
  language: ta
  text: ஏனெனில், ஆசாரியத்துவம் மாற்றப்படும்போது, சட்டத்திலும் கட்டாயமாக ஒரு மாற்றம் ஏற்படுகிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்தச் சட்டத்திலும் கட்டாயமாக ஒரு மாற்றம் ஏற்படுகிறது.” சூழலில் இது லேவிய ஆசாரியத்துவத்தை ஏற்படுத்திய மோசேயின் சட்டத்தைச் சுட்டுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: μετατιθεμένης
  choice: மாற்றப்படும்போது
  rationale: இது இறைச்சொல் சார்ந்த தனிநிலைப் பெயரெச்சத் தொடராக இருந்து, ஆசாரியத்துவத்தில் ஏற்படும் மாற்றத்தைச் சட்டத்தின் மாற்றத்திற்கான காரண-காலச் சூழலாகக் காட்டுகிறது. ‘மாற்றப்படும்போது’ என்பது அந்த உறவை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἱερωσύνης
  choice: ஆசாரியத்துவம்
  rationale: தனிப்பட்ட ஆசாரியச் செயலை அல்லாமல், ஆசாரியப் பதவி அல்லது அமைப்பைச் சுட்டுகிறது; எபிரெயர் கடிதத்தின் வாதச்சூழலுக்கும் இது பொருந்துகிறது.
- source_word: ἐξ ἀνάγκης
  choice: கட்டாயமாக
  rationale: ஆசாரியத்துவ மாற்றத்திலிருந்து சட்ட மாற்றம் தவிர்க்க முடியாத தர்க்கரீதியான விளைவாக வருகிறது என்பதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: νόμου
  choice: சட்டமும்
  rationale: உடனடிச் சூழலில் ஆசாரியத்துவத்தை ஒழுங்குபடுத்தும் சட்ட ஏற்பாட்டைக் குறிக்கிறது. கிரேக்கத்தில் சுட்டுக் கட்டுரை இல்லாததால், ‘சட்டம்’ எனச் சற்றுப் பரந்த குறிப்பை முதன்மை உரை காக்கிறது; மோசேயின் சட்டத்தைக் குறிப்பாகக் கொள்ளும் வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: μετάθεσις
  choice: மாற்றப்படுகிறது
  rationale: முந்தைய μετατιθεμένης என்பதோடு உள்ள சொற்பிறப்பியல் இணைப்பை ‘மாற்றம்’ என்ற ஒரே சொல்லடிப்படையால் காக்கிறது; ‘இடமாற்றம்’ இங்கு அளவுக்கு மீறிய நிர்வாக அல்லது இடவியல் உணர்வைத் தரலாம்.
- source_word: γίνεται
  choice: மாற்றப்படுகிறது
  rationale: ஒரு விளைவு நிகழ்கிறது அல்லது உருவாகிறது என்ற பொருளைத் தமிழில் இயல்பான செயப்பாட்டு வாக்கியமாக வெளிப்படுத்துகிறது.
- source_word: καὶ
  choice: -உம்
  rationale: ஆசாரியத்துவ மாற்றத்துடன் சட்ட மாற்றமும் இணைந்து அவசியமாக நிகழ்வதைத் தமிழின் சேர்க்கைப் பின்னொட்டால் இயல்பாகக் காட்டுகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வாதத்திற்கான விளக்கத்தைக் கொண்டுவரும் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: ஆசாரியத்துவத்துடன் தொடர்புடைய νόμος என்பதன் வரம்பு
  choice: முதன்மை உரையில் ‘சட்டம்’ என்று மொழிபெயர்த்து, ஆசாரியத்துவத்தை நிர்ணயிக்கும் சட்ட ஒழுங்கையும் சூழலிலுள்ள மோசேயின் சட்டத்தையும் உள்ளடக்கக்கூடியதாக வைத்தல்.
  alternative: ‘அந்தச் சட்டம்’ அல்லது ‘மோசேயின் சட்டம்’ என்று வெளிப்படையாகக் குறிப்பிடுதல்.
  rationale: சூழல் மோசேயின் சட்ட ஏற்பாட்டை நோக்கினாலும், கிரேக்க νόμου சுட்டுக் கட்டுரையின்றி உள்ளது. எனவே முதன்மை உரையில் குறிப்பை அளவுக்கு மீறி சுருக்காமல், குறிப்பான வாசிப்பை அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எபிரெயர் கடிதத்தின் தர்க்கரீதியான மற்றும் கண்ணியமான நடையைப் பேணும் வகையில் மொழிபெயர்க்கப்பட்டது. ‘ஆசாரியத்துவம்’ என்ற பரவலாக அறியப்பட்ட வேதாகமச் சொல் நிறுவனத்தையும் பதவியையும் குறிக்கப் பயன்படுத்தப்பட்டுள்ளது; வாக்கியம் சாதாரண வாசகர்களுக்கும் தெளிவாக இருக்கும்படி சுருக்கமாக அமைக்கப்பட்டுள்ளது.
