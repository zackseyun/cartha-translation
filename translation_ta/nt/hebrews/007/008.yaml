revisions:
- from: இங்கே சாகக்கூடிய மனிதர்கள் பத்திலொன்றைப் பெறுகிறார்கள்; அங்கேயோ, அவர் உயிருடன் இருக்கிறார் என்று சாட்சி அளிக்கப்படுகிறது.[a]
  to: இங்கே மரணமடையும் மனிதர்கள் பத்திலொன்றுகளைப் பெறுகிறார்கள்; அங்கேயோ, உயிருடன் இருக்கிறார் என்று சாட்சி அளிக்கப்படும் ஒருவர் அவற்றைப் பெறுகிறார்.[a]
  rationale: The revision supplies the Greek’s implied ‘receives them’ in the second half and makes the substantival passive participle explicit in Tamil. It retains the literary/scriptural testimony formulation, so it does not settle the question of Melchizedek’s literal immortality.
