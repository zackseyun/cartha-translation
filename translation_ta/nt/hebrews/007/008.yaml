id: HEB.7.8
reference: Hebrews 7:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὧδε μὲν δεκάτας ἀποθνῄσκοντες ἄνθρωποι λαμβάνουσιν, ἐκεῖ δὲ μαρτυρούμενος ὅτι ζῇ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/008.yaml
  text: And here mortal men receive tithes[a], but there he is testified to be living.
translation:
  language: ta
  text: இங்கே மரணமடையும் மனிதர்கள் பத்திலொன்றுகளைப் பெறுகிறார்கள்; அங்கேயோ, உயிருடன் இருக்கிறார் என்று சாட்சி அளிக்கப்படும் ஒருவர் அவற்றைப் பெறுகிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அங்கே, அவர் உயிருடன் இருக்கிறார் என்று அவரைக் குறித்து சாட்சி அளிக்கப்படுகிற ஒருவரே அவற்றைப் பெறுகிறார்.” மெல்கிசேதேக் உண்மையிலேயே இறவாதவர் என்று நேரடியாகக் கூறாமல், கிரேக்க வாசகம் இதை வேதச்சாட்சியின் வடிவிலேயே வைத்திருக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ὧδε
  choice: இங்கே
  rationale: ἐκεῖ என்பதுடன் உள்ள ‘இங்கே … அங்கே’ என்ற சொல்லாட்சிசார் எதிர்மறை இணைப்பைப் பாதுகாக்கிறது; தற்போதைய லேவிய ஆசாரியச் சூழலைக் குறிக்கிறது.
- source_word: δεκάτας
  choice: பத்திலொன்றை
  rationale: பத்தில் ஒரு பங்கு என்ற வழிபாட்டு மற்றும் சட்ட நடைமுறையைத் தெளிவாகவும் இயல்பான தமிழிலும் குறிக்கிறது.
- source_word: ἀποθνῄσκοντες ἄνθρωποι
  choice: சாகக்கூடிய மனிதர்கள்
  rationale: மெல்கிசேதேக்கைப் பற்றிய வேதச் சாட்சிக்கு எதிராக, லேவிய ஆசாரியர்கள் மரணத்திற்குட்பட்டவர்கள் என்ற நிகழ்காலப் பங்கேற்பெயரின் வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: λαμβάνουσιν
  choice: பெறுகிறார்கள்
  rationale: பத்திலொன்றைப் பெற்றுக்கொள்ளும் செயலை மேலதிக விளக்கமின்றி நேரடியாகக் காட்டுகிறது.
- source_word: ἐκεῖ
  choice: அங்கேயோ
  rationale: ὧδε என்பதற்கு இணையான எதிர்நிலையைப் பேணி, மெல்கிசேதேக்கைப் பற்றிய வேதப்பதிவின் சூழலைச் சுட்டுகிறது.
- source_word: μαρτυρούμενος
  choice: சாட்சி அளிக்கப்படுகிறது
  rationale: கிரேக்கத்தின் செயப்பாட்டு வடிவத்தையும், இது நேரடியான தத்துவக் கூற்றாக அல்லாமல் வேதச் சாட்சியின் வடிவில் சொல்லப்படுகிறது என்பதையும் காக்கிறது.
- source_word: ὅτι ζῇ
  choice: அவர் உயிருடன் இருக்கிறார் என்று
  rationale: நிகழ்காலத்தின் பொருளைப் பேணி, தமிழில் இயல்பாகச் சாட்சி கூறும் உட்பொருள் வாக்கியமாக வழங்குகிறது.
theological_decisions:
- issue: லேவிய ஆசாரியர்களுக்கும் மெல்கிசேதேக்குக்கும் இடையிலான எதிர்நிலையின் தன்மை
  choice: மரணத்திற்குட்பட்ட லேவிய ஆசாரியர்களுக்கு எதிராக, மெல்கிசேதேக் உயிருடன் இருப்பதாக வேதத்தில் சாட்சி அளிக்கப்படுகிறார் என்று மொழிபெயர்க்கப்பட்டது.
  alternative: மெல்கிசேதேக் தனிப்பட்ட முறையில் என்றென்றும் இறவாமல் உயிரோடு இருக்கிறார் என்று இவ்வசனம் நேரடியாகக் கற்பிக்கிறது.
  rationale: μαρτυρούμενος என்ற செயப்பாட்டு சாட்சி மொழியைத் தக்கவைத்ததால், மெல்கிசேதேக்கின் நேரடியான அழியாமையைத் தீர்மானிக்காமல், ஆதியாகமப் பதிவில் அவர் எவ்வாறு முன்வைக்கப்படுகிறார் என்ற இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘இங்கே … அங்கேயோ’ என்ற மூலத்தின் சுருக்கமான எதிர்நிலைப் பேச்சு பாதுகாக்கப்பட்டுள்ளது; ‘சாட்சி அளிக்கப்படுகிறது’ என்பது வேதப்பதிவின் சாட்சிசார் தன்மையைத் தெளிவாக்குகிறது.
