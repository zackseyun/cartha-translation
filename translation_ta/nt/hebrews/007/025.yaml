id: HEB.7.25
reference: Hebrews 7:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅθεν καὶ σῴζειν εἰς τὸ παντελὲς δύναται τοὺς προσερχομένους δι’ αὐτοῦ τῷ θεῷ, πάντοτε ζῶν εἰς τὸ ἐντυγχάνειν ὑπὲρ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/025.yaml
  text: Therefore he is also able to save completely those who draw near to God through him[a], since he always lives to intercede for them.
translation:
  language: ta
  text: ஆகையால், அவர் மூலமாகக் கடவுளிடம் நெருங்கி வருகிறவர்களை முழுமையாக[a] மீட்க வல்லவர்; ஏனெனில், அவர்களுக்காகப் பரிந்துபேசுவதற்கு அவர் எப்போதும் உயிருடன் இருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்றென்றைக்கும் மீட்க”; மரபாக, “முற்றுமுடிய மீட்க.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: ஆகையால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட கிறிஸ்துவின் நிலையான ஆசாரியத்துவத்திலிருந்து வரும் முடிவை இயல்பான தமிழில் குறிக்கிறது.
- source_word: καὶ
  choice: அவர் ... மீட்க வல்லவர்
  rationale: கிரேக்கத்தில் உள்ள சேர்க்கை வலியுறுத்தல் தமிழ்ச் சொல்லமைப்பில் இயல்பாக உட்பொருளாகிறது; தனியே ‘மேலும்’ எனச் சேர்ப்பது இங்கு கனமாக இருக்கும்.
- source_word: σῴζειν
  choice: மீட்க
  rationale: இரட்சிப்புச் சூழலில் விடுவித்துக் காப்பாற்றுதல் என்ற பொருளையும் இறையியல் நிறையையும் இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: εἰς τὸ παντελές
  choice: முழுமையாக
  rationale: முழுநிறைவு என்ற முதன்மை நுண்பொருளைத் தருகிறது; காலமுழுவதும் என்ற சாத்தியப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: δύναται
  choice: வல்லவர்
  rationale: அவருடைய நிலையான ஆசாரியத்துவத்தில் அடங்கிய ஆற்றலை மரியாதையான, சுருக்கமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τοὺς προσερχομένους
  choice: நெருங்கி வருகிறவர்களை
  rationale: எபிரெயர் நூலில் கடவுளை வழிபாட்டிலும் உறவிலும் அணுகுதல் என்ற தொடர்ச்சியான கருத்தை ‘வருகிறவர்கள்’ என்பதைவிடத் தெளிவாகத் தக்கவைக்கிறது.
- source_word: δι’ αὐτοῦ
  choice: அவர் மூலமாக
  rationale: இயேசுவின் ஆசாரிய மத்தியஸ்தத்தின் வழியாகக் கடவுளை அணுகுதல் என்ற பொருளைத் தெரிவிக்கிறது.
- source_word: τῷ θεῷ
  choice: கடவுளிடம்
  rationale: προσέρχομαι உடனான தத்துவை இயல்பான தமிழில் இலக்காகக் காட்டுகிறது.
- source_word: πάντοτε ζῶν
  choice: அவர் எப்போதும் உயிருடன் இருக்கிறார்
  rationale: தொடர்ந்து உயிரோடிருப்பதையும், அதுவே மீட்கும் வல்லமைக்கான காரணம் என்பதையும் ‘ஏனெனில்’ மூலம் தெளிவுபடுத்துகிறது.
- source_word: εἰς τὸ ἐντυγχάνειν
  choice: பரிந்து பேசுவதற்கு
  rationale: பிறருக்காகக் கடவுளிடம் வேண்டுதல் செய்வதை பொதுவாசகர்களுக்குப் புரியும் நவீன தமிழில் கூறுகிறது; நோக்க நுண்பொருளையும் தக்கவைக்கிறது.
- source_word: ὑπὲρ αὐτῶν
  choice: அவர்களுக்காக
  rationale: அவர்களின் நன்மைக்காகவும் சார்பாகவும் செயல்படுதல் என்ற பிரதிநிதித்துவப் பொருளை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: εἰς τὸ παντελές என்பதன் பொருள் வரம்பு
  choice: முதன்மை உரையில் ‘முழுமையாக’
  alternative: ‘என்றென்றைக்கும்’; மரபாக, ‘முற்றுமுடிய’
  rationale: இந்தச் சொற்றொடர் முழுமையையும் காலமுழுவதையும் குறிக்கக்கூடும். தொடர்ந்து உயிருடன் இருப்பது பற்றிய அடுத்த கூற்று இரு நுண்பொருள்களுக்கும் இடமளிப்பதால், முதன்மை உரை முழுமையை முன்னிறுத்தி, கால நுண்பொருளையும் மரபுவழி வடிவையும் அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பானதும் மரியாதைமிக்கதுமான நடை. ‘நெருங்கி வருகிறவர்கள்’ எபிரெயர் நூலின் வழிபாட்டு/உறவு சார்ந்த அணுகுதல் மொழியைத் தக்கவைக்கிறது. அடிக்குறிப்பு குறியீடு தெளிவின்மை உள்ள சொற்றொடருக்குப் பின்னரே வைக்கப்பட்டுள்ளது.
