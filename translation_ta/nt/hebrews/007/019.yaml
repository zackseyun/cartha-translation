id: HEB.7.19
reference: Hebrews 7:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐδὲν γὰρ ἐτελείωσεν ὁ νόμος, ἐπεισαγωγὴ δὲ κρείττονος ἐλπίδος, δι’ ἧς ἐγγίζομεν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/019.yaml
  text: For the law perfected nothing[a], but there is the introduction of a better hope[b], through which we draw near to God.
translation:
  language: ta
  text: ஏனெனில், திருச்சட்டம் எதையும் முழுநிறைவுக்குக் கொண்டுவரவில்லை[a]. ஆனால், மேலான ஒரு நம்பிக்கையின் அறிமுகம் உண்டு[b]; அதன் மூலம் நாம் கடவுளிடம் நெருங்குகிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எதையும் முழுமையாக்கவில்லை.’ கிரேக்க வினைச்சொல் ‘இலக்கை அடையச் செய்தல்’ அல்லது ‘நிறைவு பெறச் செய்தல்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மேலான ஒரு நம்பிக்கையைக் கொண்டுவருதல்.’ கிரேக்கத்தில் இங்கே வெளிப்படையான முற்றுவினை இல்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲν
  choice: எதையும் ... இல்லை
  rationale: வினையுடன் இணைந்த எதிர்மறை அமைப்பு, கிரேக்கத்தின் முழுமையான மறுப்பை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத்தையோ அடிப்படையையோ அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐτελείωσεν
  choice: முழுநிறைவுக்குக் கொண்டுவரவில்லை
  rationale: எபிரெயர் நூலில் இந்த வினை குறிக்கும் நிறைவு, இலக்கை அடைதல், கடவுளை அணுகுவதற்கான தகுதி ஆகிய அர்த்தச்சாயல்களைத் தக்கவைக்கிறது; ‘எதுவும் செய்யவில்லை’ என்று மிகைப்படுத்துவதைத் தவிர்க்கிறது.
- source_word: ὁ νόμος
  choice: திருச்சட்டம்
  rationale: சூழலில் மோசேயின் உடன்படிக்கைச் சட்டத்தையும் ஆசாரிய ஒழுங்கையும் குறிக்கிறது. ‘நியாயப்பிரமாணம்’ என்பதைக் காட்டிலும் நவீன வாசகருக்கு இயல்பாகவும், வெறும் பொதுச் சட்டம் என்பதைக் காட்டிலும் சூழலுக்கேற்றவாறும் உள்ளது.
- source_word: ἐπεισαγωγὴ
  choice: கொண்டுவரப்பட்டுள்ளது
  rationale: ‘கூடுதலாகக் கொண்டுவருதல்/அறிமுகப்படுத்துதல்’ என்ற அரிய பெயர்ச்சொல்லின் கருத்தை இயல்பான தமிழ் வினை அமைப்பில் வெளிப்படுத்துகிறது. கிரேக்கத்தின் பெயர்ச்சொல் அமைப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: திருச்சட்டத்தின் வரம்புக்கும் மேலான நம்பிக்கையின் வருகைக்கும் இடையிலான முரண்பாட்டை வெளிப்படுத்துகிறது.
- source_word: κρείττονος ἐλπίδος
  choice: அதைவிட மேலான ஒரு நம்பிக்கை
  rationale: κρείττων என்ற எபிரெயர் நூலின் முக்கிய ஒப்பீட்டுச் சொல்லை ‘மேலான’ என்று தக்கவைக்கிறது; ‘அதைவிட’ என்பது முந்தைய ஏற்பாட்டுடனான ஒப்பீட்டைத் தமிழில் தெளிவாக்குகிறது.
- source_word: δι’ ἧς
  choice: அதன் வழியாக
  rationale: பெண்பால் சார்புப்பெயர் ‘நம்பிக்கை’யையே மிக இயல்பாகச் சுட்டுகிறது; வழிமுறை அல்லது ஊடகம் என்ற பொருளைத் தருகிறது.
- source_word: ἐγγίζομεν
  choice: அணுகுகிறோம்
  rationale: எபிரெயர் நூலில் உள்ள வழிபாட்டு மற்றும் கடவுளின் முன்னிலையை அடையும் அர்த்தச்சாயலை நவீன தமிழில் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: τῷ θεῷ
  choice: கடவுளை
  rationale: ‘அணுகு’ என்ற தமிழ் வினையுடன் இயல்பாக வரும் செயப்படுபொருள் வடிவம்; கிரேக்கத்தில் கடவுளை நோக்கிய அணுகுதலைச் சரியாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: திருச்சட்டத்துடன் தொடர்புடைய τελειόω என்பதன் பொருள்
  choice: திருச்சட்டம் எதையும் கடவுளின் முன் நோக்கப்பட்ட முழுநிறைவுக்குக் கொண்டுவரவில்லை.
  alternative: திருச்சட்டம் முற்றிலும் எதுவுமே செய்யவில்லை; அல்லது ஆசாரியத்துவத்தை மட்டும் முதிர்ச்சியடையச் செய்யவில்லை.
  rationale: ‘முழுநிறைவுக்குக் கொண்டுவருதல்’ என்பது நிறைவு, இலக்கு, கடவுளை அணுகும் தகுதி ஆகிய பதற்றங்களைப் பாதுகாக்கிறது; திருச்சட்டம் எல்லா வகையிலும் பயனற்றது என்ற பொருளை மொழிபெயர்ப்பு திணிப்பதைத் தவிர்க்கிறது.
- issue: ἐπεισαγωγὴ இடம்பெறும் வினையற்ற முரண்பாட்டு அமைப்பு
  choice: தமிழின் இயல்புக்காக ‘மேலான ஒரு நம்பிக்கை கொண்டுவரப்பட்டுள்ளது’ என்ற வினை அமைப்பைப் பயன்படுத்துதல்.
  alternative: ‘மேலான ஒரு நம்பிக்கையின் கொண்டுவருதல்’ என்ற பெயர்ச்சொல் அமைப்பை அப்படியே வைத்தல்.
  rationale: கிரேக்கத்தில் வெளிப்படையான முற்றுவினை இல்லாததால் காலத்தையும் செயலாற்றுபவரையும் குறிப்பாக நிர்ணயிக்காமல், நிகழ்ந்ததன் தற்போதைய விளைவை இயல்பான தமிழில் சொல்கிறது; மூலத்தின் பெயர்ச்சொல் அமைப்பு அடிக்குறிப்பில் சுட்டப்படுகிறது.
- issue: δι’ ἧς என்பதன் முன்னோடி
  choice: ‘அதன்’ என்பது மேலான நம்பிக்கையைக் குறிக்கிறது.
  alternative: முழு புதிய ஏற்பாட்டையோ அறிமுகப்படுத்தும் செயலையோ குறிக்கிறது.
  rationale: கிரேக்கத்தில் பெண்பாலில் உள்ள ἧς, அதற்கு மிக அருகிலுள்ள பெண்பால் பெயர்ச்சொல்லான ἐλπίδος (‘நம்பிக்கை’) உடன் இயல்பாகப் பொருந்துகிறது; இதைத் தமிழ் சார்புச் சுட்டு திறந்தும் தெளிவாகவும் காட்டுகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, கண்ணியமான ஆனால் பொதுவாசகருக்கும் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘நியாயப்பிரமாணம்’ போன்ற பழமையான சொல் தவிர்க்கப்பட்டு ‘திருச்சட்டம்’ தேர்ந்தெடுக்கப்பட்டது. ‘முழுநிறைவு’ மற்றும் ‘அணுகுதல்’ ஆகிய சொற்கள் எபிரெயர் நூலின் இலக்கியத் தொடர்களையும் வழிபாட்டு அர்த்தச்சாயலையும் பாதுகாக்கின்றன.
