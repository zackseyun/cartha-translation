    text: அல்லது, “சத்தியப்பிரமாணத்தைத் தவிர்த்து அல்ல.”
    reason: χωρὶς என்பதன் ‘இல்லாமல்’ என்பதற்கான ‘தவிர்த்து/பிரித்து’ என்ற சொற்பொருள் மாற்றைச் சுட்டுகிறது.
lexical_decisions:
- source_word: Καὶ
  choice: மேலும்
  rationale: முந்தைய வாதத்துடன் இந்தக் கூற்றை இணைக்கும் தொடர்புச் சொல்; தமிழில் வாதத்தின் தொடர்ச்சியை இயல்பாகக் காட்டுகிறது.
- source_word: καθ’ ὅσον
  choice: இது … நடைபெறவில்லை
  rationale: இந்த இடத்தில் வரும் அளவு அல்லது அடிப்படை சார்ந்த வாதத் தொடர்பைத் தமிழில் இயல்பாக வெளிப்படுத்த வாக்கிய அமைப்பில் உட்பொருத்தப்பட்டுள்ளது; அடுத்த வசனத்தில் முடியும் ஒப்பீட்டுக்கான முன்னுரையையும் காக்கிறது.
- source_word: οὐ χωρὶς ὁρκωμοσίας
  choice: ஆணையுறுதி இல்லாமல் நடைபெறவில்லை
  rationale: இரட்டை எதிர்மறையின் வலியுறுத்தலைக் காத்து, ὁρκωμοσία குறிக்கும் ஆணையிட்டு உறுதிப்படுத்தும் செயலை ‘ஆணையுறுதி’ எனச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: οἱ μὲν γὰρ
  choice: ஏனெனில், அவர்கள்
  rationale: γάρ என்பதன் விளக்கத் தொடர்பை ‘ஏனெனில்’ வெளிப்படுத்துகிறது. μέν தொடங்கும், அடுத்த வசனத்தில் நிறைவுபெறும் எதிர்மறை ஒப்பீடு தமிழ் வாக்கியத் தொடரில் இயல்பாக விடப்பட்டுள்ளது.
- source_word: χωρὶς ὁρκωμοσίας
  choice: ஆணையுறுதி இல்லாமலேயே
  rationale: முதல் சொற்றொடருடன் சொல் ஒருமைப்பாட்டைப் பேணுகிறது; ‘-ஏ’ முன்னைய ஆசாரியர்களுக்கும் பின்னர் குறிப்பிடப்படும் ஆசாரியருக்கும் இடையிலான வேறுபாட்டை மென்மையாக முன்னறிவிக்கிறது.
- source_word: εἰσὶν ἱερεῖς γεγονότες
  choice: ஆசாரியர்களானார்கள்
  rationale: முடிவுற்ற நிகழ்வால் ஏற்பட்ட நிலையைச் சுட்டும் சுற்றுவழிக் கட்டமைப்பை, அவர்கள் ஆசாரியப் பொறுப்புக்குள் வந்தார்கள் என்ற பொருளில் இயல்பான நவீனத் தமிழில் தருகிறது.
theological_decisions:
- issue: முன்னைய ஆசாரியர்களுக்கும் ஆணையால் நிறுவப்பட்ட ஆசாரியருக்கும் இடையிலான வேறுபாட்டின் குறிப்பு
  choice: இந்த வசனம் முன்னைய ஆசாரியர்கள் ஆணையுறுதி இல்லாமல் ஆசாரியர்களானதை மட்டும் கூறுகிறது; இயேசுவைப் பற்றிய எதிர்ப்பக்கம் அடுத்த வசனத்தில் நிறைவுபெறும்படி விடப்படுகிறது.
  alternative: இங்கேயே லேவிய ஆசாரியத்துவத்தையும் மேசியாவின் நித்திய ஆசாரியத்துவத்தையும் விரிவாக விளக்குதல்.
  rationale: கிரேக்க உரையின் μέν அமைப்பு அடுத்த வசனத்தின் δέ எதிர்ப்பக்கத்தை எதிர்நோக்குகிறது. ஆகவே இவ்வசனத்தில் வெளிப்படையாக உள்ள ஆணை சார்ந்த வேறுபாட்டைத் தாண்டிய கோட்பாட்டு முடிவுகள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளை எபிரெயர் நூலின் வாதநடைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் அடைப்புக்குறிக்குள் தொடங்கும் விளக்கம் அடுத்த வசனத்திற்குத் தொடருவதால், இங்கும் அடைப்புக்குறி திறந்தபடியே வைக்கப்பட்டுள்ளது.
