- from: மேலும், இது ஆணையுறுதி இல்லாமல் நடைபெறவில்லை. (ஏனெனில், அவர்கள் ஆணையுறுதி இல்லாமலேயே ஆசாரியர்களானார்கள்,[a]
  to: மேலும், இது சத்தியப்பிரமாணம் இல்லாமல் நிகழவில்லை. (ஏனெனில், ஒருபுறம் அவர்கள் சத்தியப்பிரமாணம் இல்லாமலேயே ஆசாரியர்களானார்கள்,[a]
  rationale: சத்தியப்பிரமாணம் ὁρκωμοசியாவின் சத்திய உறுதிப்படுத்தல் என்ற பொருளைத் துல்லியமாகத் தருகிறது. ‘சத்தியப்பிரமாணம் இல்லாமல் நிகழவில்லை’ மூலத்தின் வலியுறுத்தும் எதிர்மறை அமைப்பைக் காக்கிறது. ‘ஒருபுறம்’ μέν-ன் அடுத்த வசனத்தில் நிறைவுபெறும் எதிர்முக அமைப்பைச் சுட்டுகிறது; திறந்த அடைப்புக்குறியும் பாதுகாக்கப்பட்டுள்ளது.
