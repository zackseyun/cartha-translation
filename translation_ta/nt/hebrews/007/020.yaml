  text: மேலும், இது சத்தியப்பிரமாணம் இல்லாமல் நிகழவில்லை. (ஏனெனில், ஒருபுறம் அவர்கள் சத்தியப்பிரமாணம் இல்லாமலேயே ஆசாரியர்களானார்கள்,[a]
