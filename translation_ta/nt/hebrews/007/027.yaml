source:
  edition: SBLGNT
  text: ὃς οὐκ ἔχει καθ’ ἡμέραν ἀνάγκην, ὥσπερ οἱ ἀρχιερεῖς, πρότερον ὑπὲρ τῶν ἰδίων ἁμαρτιῶν θυσίας ἀναφέρειν, ἔπειτα τῶν τοῦ λαοῦ (τοῦτο γὰρ ἐποίησεν ἐφάπαξ ἑαυτὸν ἀνενέγκας)·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/027.yaml
  text: who has no need[a], day after day, like the high priests, to offer up sacrifices first for his own sins and then for those of the people[d][c][b], for this he did once for all when he offered up himself.
translation:
  language: ta
  text: தலைமை ஆசாரியர்களைப் போல, நாள்தோறும்[a] முதலில் தங்களுடைய பாவங்களுக்காகவும், பின்பு மக்களின் பாவங்களுக்காகவும்[b] பலிகளைச் செலுத்த வேண்டிய தேவை இவருக்கு இல்லை. ஏனெனில், தம்மையே பலியாகச் செலுத்தியபோது[d], இதை[e] ஒரே முறையாக, எல்லாக் காலத்திற்குமாகச் செய்தார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒவ்வொரு நாளும்.’ கிரேக்க மரபுத்தொடர், நாளுக்கு நாள் மீண்டும் ஏற்படும் தேவையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, ‘பின்பு மக்களுடையவற்றுக்காக.’ முன்பு கூறப்பட்ட ‘பாவங்கள்’ என்ற சொல் இங்கு பொருளில் கொள்ளப்பட்டுள்ளது.
    reason: source_ellipsis
  - marker: c
    text: அல்லது, ‘ஒரே தடவையாகவும் இறுதியான முறையாகவும்.’
    reason: lexical_alternative
  - marker: d
    text: அல்லது, ‘தம்மையே பலியாகச் செலுத்தியதால்’ அல்லது ‘தம்மையே பலியாகச் செலுத்தி.’
    reason: grammatical_alternative
  - marker: e
    text: ‘இதை’ என்பது முன் கூறப்பட்ட பலிச் செயலைக் குறிக்கிறது. இது குறிப்பாக மக்களுக்காகச் செலுத்தப்பட்ட பலியைச் சுட்டுகிறது என்றும், விரிவாக முன் கூறப்பட்ட செயலைச் சுட்டுகிறது என்றும் புரிந்துகொள்ளப்படுகிறது; இது இயேசு தமது சொந்தப் பாவங்களுக்காகப் பலி செலுத்தினார் என்று கூறுவதில்லை.
    reason: theological_ambiguity
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: நாள்தோறும்
  rationale: மீண்டும் மீண்டும் ஏற்படும் தினசரி தேவையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἀνάγκην
  choice: தேவை
  rationale: ἔχει ἀνάγκην என்ற தொடரைத் தமிழில் இயல்பாகவும் தெளிவாகவும் வழங்குகிறது; ‘கட்டாயம்’ என்பது இங்கு அளவுக்கு அதிகமான கடமைப் பொருளைத் தரக்கூடும்.
- source_word: ὥσπερ οἱ ἀρχιερεῖς
  choice: தலைமைக் குருக்கள் செய்வதுபோல
  rationale: லேவிய மரபைச் சேர்ந்த தலைமைக் குருக்களுடனான ஒப்பீட்டையும் கிரேக்கப் பன்மையையும் தெளிவாகக் காக்கிறது.
- source_word: πρότερον ... ἔπειτα
  choice: முதலில் ... பின்பு
  rationale: பலியிடும் செயல்களின் வரிசையைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: ὑπὲρ τῶν ἰδίων ἁμαρτιῶν
  choice: தங்களுடைய பாவங்களுக்காக
  rationale: ὑπέρ என்பதன் பலிசார் ‘ஆக/நிமித்தம்’ பொருளையும், பன்மையான தலைமைக் குருக்களைக் குறிக்கும் தற்சுட்டையும் காக்கிறது.
- source_word: θυσίας ἀναφέρειν
  choice: பலிகளைச் செலுத்த
  rationale: பலிசார் சூழலில் ἀναφέρω என்பதன் வழிபாட்டு அர்த்தத்தை நவீனத் தமிழில் வழக்கமான முறையில் தெரிவிக்கிறது.
- source_word: τῶν τοῦ λαοῦ
  choice: மக்களின் பாவங்களுக்காக
  rationale: கிரேக்கத்தில் முன் வந்த ‘பாவங்கள்’ விடுபட்டிருந்தாலும் தமிழில் தெளிவுக்காக அதை வெளிப்படையாகக் கூறுகிறது; அந்த விடுபாட்டை அடிக்குறிப்பு பதிவு செய்கிறது.
- source_word: ἐφάπαξ
  choice: ஒரே முறையாக, எல்லாக் காலத்திற்குமாக
  rationale: ஒருமுறை நிகழ்ந்ததையும் மீண்டும் செய்யத் தேவையற்ற அதன் தீர்மானமான தன்மையையும் ஒன்றாக வெளிப்படுத்துகிறது.
- source_word: ἑαυτὸν ἀνενέγκας
  choice: தம்மையே பலியாகச் செலுத்தியபோது
  rationale: இறந்தகாலப் பங்கேற்புச் சொல்லின் காலத் தொடர்பையும், இயேசு குருவும் பலியுமாக இருப்பதை உணர்த்தும் பலிசார் வலிமையையும் காக்கிறது.
theological_decisions:
- issue: τοῦτο (‘இதை’) என்பதன் குறிப்பு எல்லை
  choice: ‘இதை’ என்ற சுட்டுப்பெயரைத் திறந்த நிலையில் வைத்து, கிறிஸ்துவின் தன்னையே பலியாகச் செலுத்திய தீர்மானமான செயலை நோக்கச் செய்கிறது.
  alternative: இது மக்களின் பாவங்களுக்காகச் செலுத்திய பலியை மட்டும் குறிக்கிறது; அல்லது முன் கூறிய முழுப் பலிச் செயலை விரிவாகக் குறிக்கிறது.
  rationale: உடனடியான இலக்கணத் தொடர்பில் குறிப்பின் எல்லை முழுமையாக வெளிப்படையாக இல்லை. அதேவேளை, இயேசு தமது சொந்தப் பாவங்களுக்காகப் பலி செலுத்தினார் என்று வசனம் கூறுவதாக மாற்றாமல், எபிரெயர் நூலின் உடனடிச் சூழலைக் காக்கிறது.
- issue: கிறிஸ்துவின் தன்னையே பலியாகச் செலுத்துதல்
  choice: ‘தம்மையே பலியாகச் செலுத்தியபோது’
  alternative: ‘தம்மைக் கொடுத்தபோது’ அல்லது ‘தம்மையே அர்ப்பணித்தபோது’
  rationale: பொதுவான தற்கொடையாகச் சுருக்காமல், ἀναφέρω என்பதன் குருத்துவ மற்றும் பலிசார் பொருளைத் தெளிவாக வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘தலைமைக் குருக்கள்,’ ‘பலிகளைச் செலுத்த,’ ‘தம்மையே பலியாக’ ஆகிய சொற்றொடர்கள் எபிரெயர் நூலின் குருத்துவ மற்றும் பலிசார் பதிவைத் தக்கவைக்கின்றன. மரியாதைப் பன்மை இயேசுவுக்கு ‘தம்மையே’ என்றும், உண்மையான பன்மை தலைமைக் குருக்களுக்கு ‘தங்களுடைய’ என்றும் வேறுபடுத்தப்பட்டுள்ளது.
