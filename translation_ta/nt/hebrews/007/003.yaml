source:
  edition: SBLGNT
  text: ἀπάτωρ, ἀμήτωρ, ἀγενεαλόγητος, μήτε ἀρχὴν ἡμερῶν μήτε ζωῆς τέλος ἔχων, ἀφωμοιωμένος δὲ τῷ υἱῷ τοῦ θεοῦ, μένει ἱερεὺς εἰς τὸ διηνεκές.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/003.yaml
  text: without father[a], without mother, without genealogy, having neither beginning of days nor end of life, but being made like the Son of God[b], he remains a priest perpetually.
translation:
  language: ta
  text: தந்தை இல்லாதவர், தாய் இல்லாதவர், வம்சவரலாறு இல்லாதவர்[a]; நாட்களின் தொடக்கமோ வாழ்வின் முடிவோ இல்லாதவர்; ஆனால் தேவனுடைய மகனுக்கு ஒப்பாக்கப்பட்டவராய், அவர் நிரந்தரமாக[b] ஆசாரியராக நிலைத்திருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பதிவுசெய்யப்பட்ட வம்சவரலாறு இல்லாதவர்.” ஆதியாகமத்தில் மெல்கிசேதேக்கின் வம்சவரலாறு பதிவு செய்யப்படவில்லை; எபிரெயர் நிருபம் அந்த மௌனத்தை ஒரு முன்மாதிரியாகப் பயன்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எல்லாக் காலத்துக்கும்” அல்லது “என்றென்றும்.” வேதப்பதிவில் அவரது ஆசாரியத்துவம் நீடித்திருப்பதாகச் சித்தரிக்கப்படுவதை இச்சொற்றொடர் வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπάτωρ
  choice: தந்தை இல்லாதவர்
  rationale: கிரேக்கச் சொல்லின் மறுப்புப் பொருளை நேரடியாகத் தருகிறது; கைவிடப்பட்டவர் என்ற உணர்ச்சிசார் உட்பொருளைச் சேர்க்காமல், இணையான மூன்று தொடர்களில் முதலாவதைப் பாதுகாக்கிறது.
- source_word: ἀμήτωρ
  choice: தாய் இல்லாதவர்
  rationale: ἀπάτωρ என்பதற்கு இணையாக அமைந்து, கிரேக்கத்தின் சொற்றொடர் சமச்சீரை இயல்பான தமிழில் காக்கிறது.
- source_word: ἀγενεαλόγητος
  choice: வம்சவரலாறு இல்லாதவர்
  rationale: வம்சத் தொடர்பான பதிவு இல்லாமையைச் சுருக்கமாகக் குறிக்கிறது. இது உண்மையில் முன்னோர் யாருமே இல்லை என்று கட்டாயமாகப் பொருள்படாமல் இருக்க, பதிவுசார் விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: μήτε ἀρχὴν ἡμερῶν μήτε ζωῆς τέλος ἔχων
  choice: நாட்களின் தொடக்கமோ வாழ்வின் முடிவோ இல்லாதவர்
  rationale: இரட்டை மறுப்பையும் உயர்ந்த நடையையும் காத்து, தமிழில் இயல்பாக ஒலிக்கச் செய்கிறது.
- source_word: ἀφωμοιωμένος
  choice: ஒப்பாக்கப்பட்டவராய்
  rationale: நிறைவேற்றப்பட்ட நிலையில் தொடரும் ஒப்புமையைக் காட்டும் perfect passive participle-இன் செயப்பாட்டு வினை உணர்வைப் பாதுகாக்கிறது; மெல்கிசேதேக்கும் மகனும் ஒரே நபர் என்று கூறுவதில்லை.
- source_word: τῷ υἱῷ τοῦ θεοῦ
  choice: தேவனுடைய மகனுக்கு
  rationale: தமிழ் வேதாகம நடையில் இயல்பான கிறிஸ்துவியல் பட்டத்தைத் தருகிறது; ‘ஒப்பாக்கப்பட்டவர்’ என்பதோடு நான்காம் வேற்றுமை இயல்பாக இணைகிறது.
- source_word: μένει ἱερεὺς
  choice: ஆசாரியராக நிலைத்திருக்கிறார்
  rationale: μένει என்பதின் தொடரும் நிலையை ‘நிலைத்திருக்கிறார்’ தெளிவாக வெளிப்படுத்துகிறது; ἱερεύς என்பதற்கு பரவலாக அறியப்படும் ‘ஆசாரியர்’ பயன்படுத்தப்படுகிறது.
- source_word: εἰς τὸ διηνεκές
  choice: நிரந்தரமாக
  rationale: காலம் முழுவதும் தொடரும் ஆசாரியத்துவத்தின் நீடித்த தன்மையைச் சுருக்கமாகக் காட்டுகிறது; அதன் சாத்தியமான மாற்று வெளிப்பாடுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: மெல்கிசேதேக்கு உண்மையிலேயே பெற்றோரற்றவரும் நித்தியமானவருமா, அல்லது வேதப்பதிவில் அவ்வாறு சித்தரிக்கப்படுகிறாரா?
  choice: மூலத்தின் நேரடியான விளக்கச் சொற்கள் உரையில் பாதுகாக்கப்படுகின்றன; அதேவேளையில், ‘தேவனுடைய மகனுக்கு ஒப்பாக்கப்பட்டவர்’ என்ற செயப்பாட்டு ஒப்புமை மெல்கிசேதேக்கை மகனோடு ஒன்றாக்காமல், முன்மாதிரிசார் தொடர்பை வெளிப்படுத்துகிறது.
  alternative: மெல்கிசேதேக்கு மனிதப் பெற்றோர் இல்லாத நித்திய நபர் என்றோ, மனிதராகப் பிறப்பதற்கு முந்தைய மகனின் தோற்றம் என்றோ வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: ἀφωμοιωμένος என்பது மகனுக்கு ஒப்பாக்கப்பட்டவர் என்கிறது; அவர் மகனே எனக் கூறவில்லை. ஆதியாகமப் பதிவின் மௌனத்தை எபிரெயர் நிருபம் எவ்வாறு பயன்படுத்துகிறது என்பதையும், வசனத்தின் திட்டமிட்ட இறையியல் இழுபறியையும் மொழிபெயர்ப்பு தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் புரியக்கூடிய, ஆனால் வசனத்தின் உயர்ந்த மற்றும் சமச்சீரான நடையைத் தக்கவைக்கும் சொற்றொடர்கள் பயன்படுத்தப்பட்டுள்ளன. ‘தந்தை இல்லாதவர், தாய் இல்லாதவர், வம்சவரலாறு இல்லாதவர்’ என்ற மும்மை அமைப்பும், ‘தொடக்கம்—முடிவு’ என்ற எதிரிணையும் பாதுகாக்கப்பட்டுள்ளன.
