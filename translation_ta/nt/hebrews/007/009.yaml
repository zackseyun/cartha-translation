  - severity: medium
    issue: Footnote b’s Tamil gloss of the Greek passive is potentially misleading.
    rationale: “தசமபாகத்திற்கு உட்படுத்தப்பட்டிருக்கிறார்” can suggest being subjected to a tithe rather than the contextual sense that Levi is reckoned to have paid a tithe through Abraham. The note should identify the formal passive without supplying an inaccurate Tamil literalization.
