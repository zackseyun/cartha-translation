    reason: lexical_alternative
  - marker: b
    text: கிரேக்க வினைச்சொல் நிறைவுற்ற காலச் செயப்பாட்டு வடிவில் உள்ளது; நேரடியாக, “தசமபாகம் செலுத்தப்பட்டிருக்கிறார்” என்று வரும். இச்சூழலில், லேவி ஆபிரகாமின் வழியாகத் தசமபாகம் செலுத்தியவராகக் கருதப்படுகிறார் என்பதை இது உணர்த்துகிறது.
