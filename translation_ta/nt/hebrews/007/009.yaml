  language: ta
  text: மேலும், ஒருவகையில் சொல்வதானால்[a], தசமபாகங்களைப் பெற்றுக்கொள்ளும் லேவியும்கூட ஆபிரகாமின் வழியாகத் தசமபாகம் செலுத்தியிருக்கிறார்[b].
