lexical_decisions:
- source_word: ὡς ἔπος εἰπεῖν
  choice: இப்படிச் சொல்லலாம் என்றால்
  rationale: இது அடுத்து வரும் கருத்தைத் தகுந்த வரம்புடன், உருவகமான அல்லது பிரதிநிதித்துவமான முறையில் கூறுவதை உணர்த்தும் மரபுத்தொடர். நவீனத் தமிழில் இயல்பாகவும் ஆசிரியரின் சொல்லாட்சித் தயக்கத்தைப் பாதுகாக்கும் வகையிலும் உள்ளது.
- source_word: δι’ Ἀβραὰμ
  choice: ஆபிரகாமின் வழியாக
  rationale: διά என்பதன் ஆறாம் வேற்றுமை வடிவம் இங்கு இடைநிலையான பங்கேற்பைச் சுட்டுகிறது. லேவி ஆபிரகாமின் செயலில் பிரதிநிதித்துவப்படுத்தப்படுகிறார் என்ற வாதத்தை மேலதிகமாக விளக்காமல் இது காக்கிறது.
- source_word: καὶ Λευὶ
  choice: லேவியும்கூட
  rationale: καί இங்கு வலியுறுத்தும் சேர்க்கைப் பொருளைக் கொண்டது. வியப்பூட்டும் வகையில் வாதம் லேவிக்கும் நீட்டிக்கப்படுவதை ‘உம்கூட’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὁ δεκάτας λαμβάνων
  choice: தசமபாகங்களைப் பெற்றுக்கொள்ளும்
  rationale: பெயர்ச்சொல் போலச் செயல்படும் நிகழ்கால வினையெச்சம், லேவியின் வழிவந்த ஆசாரியப் பணியின் நிலையான இயல்பைச் சுட்டுகிறது. ‘பெற்றுக்கொள்ளும்’ என்பது ‘வசூலிக்கும்’ என்பதைவிட மூலத்தின் நடுநிலையான பொருளைப் பாதுகாக்கிறது.
- source_word: δεκάτας
  choice: தசமபாகங்கள்
  rationale: வழிபாட்டு மற்றும் பொருளாதாரச் சூழலில் கொடுக்கப்படும் பத்தில் ஒரு பங்குக்கான நிலைபெற்ற, புரிந்துகொள்ளத்தக்க தமிழ்ச் சொல்.
- source_word: δεδεκάτωται
  choice: தசமபாகம் செலுத்தியிருக்கிறார்
  rationale: கிரேக்கத்தில் இது நிறைவுற்ற காலச் செயப்பாட்டு வடிவம். சொற்சொல்லான தமிழ்ச் செயப்பாட்டு வடிவம் இயல்பற்றும் தெளிவற்றும் இருப்பதால், யார் கொடுத்தார் என்பதைக் கருத்துப்பொருளில் வெளிப்படுத்தும் இயல்பான செயல்வினை வடிவம் முதன்மை உரையில் பயன்படுத்தப்பட்டது; மூலத்தின் செயப்பாட்டு வடிவம் அடிக்குறிப்பில் பதிவு செய்யப்படுகிறது.
theological_decisions:
- issue: ஆபிரகாமின் செயலில் லேவியின் பிரதிநிதித்துவப் பங்கேற்பு
  choice: லேவி ஆபிரகாமின் வழியாகத் தசமபாகம் செலுத்தியதாக ஆசிரியர் முன்வைக்கும் கருத்தை, அதன் முறையை வரையறுக்காமல் மொழிபெயர்த்தல்
  alternative: லேவி தன் மூதாதையான ஆபிரகாமில் கூட்டாக இருந்தார் என்று வெளிப்படையாக விளக்குதல்; அல்லது இது வெறும் உருவகப் பேச்சு என்று குறைத்துக் கூறுதல்
  rationale: ‘ஆபிரகாமின் வழியாக’ என்பதும் ‘இப்படிச் சொல்லலாம் என்றால்’ என்பதும் மூலத்தின் பிரதிநிதித்துவ வாதத்தையும் அதன் சொல்லாட்சித் தகுதிப்பாட்டையும் காக்கின்றன. இதனால் பிற்கால இறையியல் பொறிமுறை எதுவும் உரைக்குள் சேர்க்கப்படவில்லை.
translation_notes:
  register: மொழிநடை நவீன, பொதுநிலை, கண்ணியமான தமிழில் அமைக்கப்பட்டுள்ளது. ‘தசமபாகம்’ என்ற பரவலாக அறியப்படும் வேதாகமச் சொல் தக்கவைக்கப்பட்டாலும், கடினமான செயப்பாட்டு வடிவம் முதன்மை உரையில் இயல்பான தமிழாக மாற்றப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
