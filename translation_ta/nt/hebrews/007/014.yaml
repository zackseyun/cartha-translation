source:
  edition: SBLGNT
  text: πρόδηλον γὰρ ὅτι ἐξ Ἰούδα ἀνατέταλκεν ὁ κύριος ἡμῶν, εἰς ἣν φυλὴν ⸂περὶ ἱερέων οὐδὲν⸃ Μωϋσῆς ἐλάλησεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/014.yaml
  text: For it is evident that our Lord has arisen from Judah[a], a tribe about which Moses said nothing concerning priests.
translation:
  language: ta
  text: ஏனெனில், நம் ஆண்டவர் யூதாவிலிருந்து தோன்றியிருக்கிறார்[a] என்பது தெளிவு; அந்தக் கோத்திரத்தைப் பொறுத்தவரை ஆசாரியர்களைக் குறித்து மோசே எதுவும் சொல்லவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யூதாவிலிருந்து முளைத்தெழுந்திருக்கிறார்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் உதித்தல் அல்லது முளைத்தெழுதல் என்ற உருவகத்தைத் தருகிறது; இங்கே அது முதன்மையாக உயிர்த்தெழுதலை அல்ல, யூதா கோத்திரத்திலிருந்து வந்த தோற்றத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρόδηλον
  choice: தெளிவு
  rationale: இது அனைவரும் அறியக்கூடிய வெளிப்படையான உண்மையை அறிமுகப்படுத்தும் பயனிலை அடைமொழி. ‘தெளிவு’ என்பது அதன் வலிமையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வாதத்திற்கான விளக்கக் காரணத்தைத் தெளிவாக இணைக்கிறது.
- source_word: ἐξ Ἰούδα
  choice: யூதாவிலிருந்து
  rationale: ἐξ என்பது இங்கே தோற்றம் அல்லது வம்சவழியைச் சுட்டுகிறது. தொடர்ந்து ‘கோத்திரம்’ வருவதால் இங்கே அதைக் கூடுதலாகச் சேர்க்கவில்லை.
- source_word: ἀνατέταλκεν
  choice: தோன்றியிருக்கிறார்
  rationale: ἀνατέλλω என்பதன் எழுதல் அல்லது முளைத்தல் என்ற உருவகத்தை முற்றிலும் அழிக்காமல், இச்சூழலில் யூதா கோத்திரத்திலிருந்து வந்த தோற்றத்தை இயல்பான தமிழில் குறிக்கிறது. நிறைவேற்றுக்காலத்தின் தொடரும் விளைவை ‘இருக்கிறார்’ வெளிப்படுத்துகிறது.
- source_word: ὁ κύριος ἡμῶν
  choice: நம் ஆண்டவர்
  rationale: சூழலில் இது இயேசுவைக் குறித்தாலும், மூலத்தில் உள்ள பட்டத்தையும் உடைமை உறவையும் மட்டும் மொழிபெயர்த்து, பெயரைச் சேர்க்கவில்லை.
- source_word: εἰς ἣν φυλήν
  choice: அந்தக் கோத்திரத்தைப் பொறுத்தவரை
  rationale: முன்னர் குறிப்பிடப்பட்ட யூதா கோத்திரத்தை மீண்டும் சுட்டி, அதைப் பற்றிய மோசேயின் மௌனத்தை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: περὶ ἱερέων οὐδὲν
  choice: ஆசாரியர்களைக் குறித்து ... எதுவும்
  rationale: மூலம் ‘ஆசாரியத்துவம்’ என்ற கருத்துப் பெயரைக் காட்டிலும் ‘ஆசாரியர்கள்’ என்ற நபர்களையே நேரடியாகக் குறிப்பிடுகிறது; அந்த வேறுபாடு காக்கப்பட்டுள்ளது.
- source_word: Μωϋσῆς ἐλάλησεν
  choice: மோசே ... சொல்லவில்லை
  rationale: λαλέω என்பதற்கு இச்சூழலில் ‘சொல்’ என்பது தெளிவான, இயல்பான தமிழ் இணை.
theological_decisions:
- issue: ‘நம் ஆண்டவர்’ என்பதன் குறிப்பு
  choice: மூலத்தைப் போலவே ‘நம் ஆண்டவர்’ என்று வைத்து, பெயரைச் சேர்க்காமல் விடுதல்
  alternative: ‘நம் ஆண்டவராகிய இயேசு’ என்று வெளிப்படையாகக் கூறுதல்
  rationale: உடனடியான சூழல் இதை இயேசுவுடன் அடையாளப்படுத்தினாலும், இவ்வசனம் பெயரைச் சொல்லவில்லை. ஆகவே மொழிபெயர்ப்பு பட்டத்தை மட்டும் காத்து, விளக்கத்தை உரைக்குள் இறக்குமதி செய்யவில்லை.
- issue: ἀνατέταλκεν என்பதன் பொருள்
  choice: யூதாவிலிருந்து தோன்றியிருக்கிறார்
  alternative: யூதாவிலிருந்து உயிர்த்தெழுந்திருக்கிறார்
  rationale: இங்கு வாதம் கோத்திரத் தோற்றத்தையும் ஆசாரியத் தகுதியையும் பற்றியது. எனவே இது முதன்மையாக உயிர்த்தெழுதலைக் குறிப்பதல்ல; அதேவேளை எழுதல் அல்லது முளைத்தல் என்ற மூல உருவகம் அடிக்குறிப்பில் காக்கப்படுகிறது.
