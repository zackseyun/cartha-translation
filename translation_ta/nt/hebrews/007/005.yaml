source:
  edition: SBLGNT
  text: καὶ οἱ μὲν ἐκ τῶν υἱῶν Λευὶ τὴν ἱερατείαν λαμβάνοντες ἐντολὴν ἔχουσιν ἀποδεκατοῦν τὸν λαὸν κατὰ τὸν νόμον, τοῦτ’ ἔστιν τοὺς ἀδελφοὺς αὐτῶν, καίπερ ἐξεληλυθότας ἐκ τῆς ὀσφύος Ἀβραάμ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/005.yaml
  text: And those from the sons of Levi who receive the priesthood have a commandment according to the law to collect a tenth from the people—that is[b][a], from their brothers—though they also have come from Abraham’s loins.
translation:
  language: ta
  text: லேவியின் மகன்களிலிருந்து ஆசாரியத்துவத்தைப் பெறுகிறவர்கள், சட்டத்தின்படி மக்களிடமிருந்து—அதாவது, தங்கள் சகோதரர்களிடமிருந்து[a]—பத்தில் ஒரு பங்கை வசூலிக்கக் கட்டளையுடையவர்கள்; அந்தச் சகோதரர்களும் ஆபிரகாமின் இடுப்பிலிருந்து வந்தவர்களாயிருந்தாலும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்கள் சக இஸ்ரவேலர்களிடமிருந்து.” கிரேக்கத்தில் “தங்கள் சகோதரர்களிடமிருந்து” என்று உள்ளது; இங்கு அது ஒரே மக்களினத்தைச் சேர்ந்தவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: 'அதாவது, “அவர்களும் ஆபிரகாமின் வழிவந்தவர்களாயிருந்தாலும்.” சொல்லுக்குச் சொல்: “ஆபிரகாமின் இடுப்பிலிருந்து வந்தவர்கள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μὲν ἐκ τῶν υἱῶν Λευὶ
  choice: லேவியின் மகன்களில்
  rationale: ἐκ என்பதன் பகுதிப்பொருளையும் υἱῶν என்பதன் குடும்பவழி மொழியையும் காக்கிறது; எல்லா லேவியர்களையும் பொதுவாகக் குறிக்காமல், லேவியின் வழியிலிருந்து ஆசாரியத்துவம் பெறுவோரைக் குறிக்கிறது.
- source_word: τὴν ἱερατείαν λαμβάνοντες
  choice: ஆசாரியத்துவத்தைப் பெறுகிறவர்கள்
  rationale: λαμβάνοντες என்பதைத் தாமாக எடுத்துக்கொள்வது என்று அல்லாமல், நியமனமாகப் பெறுவது என்ற பொருளில் மொழிபெயர்க்கிறது; ἱερατεία என்பதற்கான மரியாதையான, நிலையான தமிழ் சொல் ‘ஆசாரியத்துவம்.’
- source_word: ἐντολὴν ἔχουσιν
  choice: கட்டளையைப் பெற்றிருக்கிறார்கள்
  rationale: கிரேக்கத்தின் பெயர்ச்சொல் அமைப்பையும் சட்ட-உடன்படிக்கை வலிமையையும் காக்கிறது; தமிழில் ‘கட்டளையை உடையவர்கள்’ என்பதைக் காட்டிலும் இயல்பாக உள்ளது.
- source_word: ἀποδεκατοῦν
  choice: பத்தில் ஒரு பங்கை வசூலிக்க
  rationale: தாமே பத்தில் ஒரு பங்கைக் கொடுப்பதை அல்ல, மற்றவர்களிடமிருந்து அதைப் பெறுவதைத் தெளிவாக்குகிறது.
- source_word: τὸν λαὸν
  choice: மக்களிடமிருந்து
  rationale: λαός என்பதன் நேரான பொருளைக் காக்கிறது; தொடர்ந்து வரும் விளக்கவுரை அவர்கள் யார் என்பதைத் தெளிவுபடுத்துகிறது.
- source_word: κατὰ τὸν νόμον
  choice: சட்டத்தின்படி
  rationale: κατά + accusative என்பதன் நெறிப்படுத்தும் சட்டப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: τοῦτ’ ἔστιν
  choice: அதாவது
  rationale: முந்திய ‘மக்கள்’ என்ற சொல்லை விளக்கும் apposition-ஐ இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τοὺς ἀδελφοὺς αὐτῶν
  choice: தங்கள் சகோதரர்களிடமிருந்து
  rationale: கிரேக்கத்தின் ஆண்பால் உறவுமுறைச் சொல்லை முதன்மை உரையில் காக்கிறது; இது உடன்படிக்கை மக்களான சக இஸ்ரவேலர்களைக் குறிக்கும் விரிவான பயன்பாடு என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: καίπερ
  choice: இருந்தபோதிலும்
  rationale: தெளிவான விட்டுக்கொடுப்பு/முரண்பாட்டு உறவை மரியாதையான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐξεληλυθότας ἐκ τῆς ὀσφύος Ἀβραάμ
  choice: ஆபிரகாமின் இடுப்பிலிருந்து வந்தவர்களாக
  rationale: உடல்வழி வம்சத்தைச் சுட்டும் மூல உருவகத்தைப் பாதுகாக்கிறது; அதன் இயல்பான பொருளை அடிக்குறிப்பு தருகிறது.
theological_decisions:
- issue: இஸ்ரவேல் மக்களைக் குறிக்கும் உறவுமுறை மொழி
  choice: தங்கள் சகோதரர்கள்
  alternative: தங்கள் சக இஸ்ரவேலர்கள்
  rationale: ἀδελφούς என்பது ஆண்பால் உறவுமுறைச் சொல்; உரையின் குடும்ப/உடன்படிக்கைச் சாயலை முதன்மை உரையில் காத்து, அதன் விரிந்த கூட்டுப்பொருளை அடிக்குறிப்பில் விளக்குகிறது.
- issue: உடல்வழி வம்ச உருவகத்தைத் தக்கவைத்தல்
  choice: ஆபிரகாமின் இடுப்பிலிருந்து வந்தவர்கள்
  alternative: ஆபிரகாமின் வழிவந்தவர்கள்
  rationale: எபிரெயர் 7-இன் வாதத்தில் பொதுவான உடல்வழி வம்சம் முக்கியமானது; ஆகவே ὀσφύος என்ற திடமான மூல உருவகம் தக்கவைக்கப்படுகிறது, ஆனால் இயல்புப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதையான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘ஆசாரியத்துவம்,’ ‘கட்டளை,’ ‘சட்டம்’ ஆகியவை சட்ட-உடன்படிக்கைச் சாயலைக் காக்கின்றன. வம்சத்தைச் சுட்டும் ‘இடுப்பிலிருந்து’ என்ற மூல உருவகம் சற்றே இலக்கியமானதாக இருந்தாலும் வாதத்தின் உடல்வழி அம்சத்தைப் பாதுகாக்கிறது; அதன் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
