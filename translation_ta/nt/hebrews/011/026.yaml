id: HEB.11.26
reference: Hebrews 11:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μείζονα πλοῦτον ἡγησάμενος τῶν Αἰγύπτου θησαυρῶν τὸν ὀνειδισμὸν τοῦ Χριστοῦ, ἀπέβλεπεν γὰρ εἰς τὴν μισθαποδοσίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/026.yaml
  text: He considered the reproach of Messiah greater wealth than the treasures of Egypt[b][a], for he was looking to the reward.
translation:
  language: ta
  text: எகிப்தின் பொக்கிஷங்களைவிட மேசியாவின் நிந்தையே மேலான செல்வம் என்று அவர் கருதினார்[a][b]. ஏனெனில், அவர் வெகுமதியை நோக்கியிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கிறிஸ்துவின் நிந்தை.’ Χριστοῦ என்ற கிரேக்கப் பட்டத்தை ‘கிறிஸ்து’ என்றும் மொழிபெயர்க்கலாம்; இங்கு அது ஒரு பட்டமாகச் செயல்படுவதால் ‘மேசியா’ என்று வழங்கப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: ‘மேசியாவின் நிந்தை’ என்பது மேசியாவுக்காகச் சுமக்கப்படும் நிந்தையையோ, தேவனால் அபிஷேகம் செய்யப்பட்டவருடன் பகிரப்படும் நிந்தையையோ, அல்லது மேசியாவில் நிறைவேறுவதாக எபிரெயர் காணும் நிந்தையையோ குறிக்கலாம். கிரேக்கச் சொற்றொடரின் பொருளை ஒரு விளக்கத்திற்குள் சுருக்காமல் மொழிபெயர்ப்பு பாதுகாக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: μείζονα πλοῦτον
  choice: மேலான செல்வம்
  rationale: ஒப்பீட்டுச் சொல்லான μείζονα, எகிப்தின் பொக்கிஷங்களுடன் ஒப்பிடும்போது அதிக மதிப்புடைய செல்வம் என்பதைக் குறிக்கிறது. ‘மேலான செல்வம்’ என்பது மதிப்பின் ஒப்பீட்டை இயல்பான தமிழில் காக்கிறது.
- source_word: ἡγησάμενος
  choice: என்று அவர் கருதினார்
  rationale: ἡγέομαι இங்கு ஒன்றை மதிப்பிட்டு அவ்வாறு எண்ணுதல் அல்லது கருதுதல் என்ற பொருளில் வருகிறது. தமிழில் வினையெச்சத்தை வினைமுற்றாக வழங்குவது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: τῶν Αἰγύπτου θησαυρῶν
  choice: எகிப்தின் பொக்கிஷங்கள்
  rationale: இச்சொற்றொடர் எகிப்துக்குரிய அல்லது எகிப்திலுள்ள பொக்கிஷங்களைக் குறிக்கிறது. ‘எகிப்தின் பொக்கிஷங்கள்’ மூலத்தின் சுருக்கமான உடைமைத் தொடர்பைப் பாதுகாக்கிறது.
- source_word: τὸν ὀνειδισμὸν
  choice: நிந்தை
  rationale: ὀνειδισμός பொதுமக்கள் முன் சுமக்கப்படும் பழிப்பு, இகழ்ச்சி அல்லது அவமானத்தைக் குறிக்கலாம். ‘நிந்தை’ வேதாகம நடையையும் வெளிப்படையான பழிப்பின் கருத்தையும் காக்கிறது.
- source_word: τοῦ Χριστοῦ
  choice: மேசியாவின்
  rationale: Χριστός இங்கு ஒரு பட்டமாகச் செயல்படுவதால் ‘மேசியா’ என்று மொழிபெயர்க்கப்பட்டது. தமிழிலுள்ள உரிமை வேற்றுமை, இந்தக் கிரேக்கப் பிறப்புவேற்றுமைத் தொடரின் உறவை விளக்கிச் சுருக்காமல் பாதுகாக்கிறது.
- source_word: ἀπέβλεπεν
  choice: நோக்கியிருந்தார்
  rationale: இறந்தகாலத் தொடர்வினையான ἀπέβλεπεν நீடித்த கவனம் அல்லது எதிர்நோக்கைத் தெரிவிக்கிறது. ‘நோக்கியிருந்தார்’ அந்தத் தொடர்ச்சியான நோக்குநிலையைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: μισθαποδοσίαν
  choice: வெகுமதி
  rationale: μισθαποδοσία என்பது ஒருவருக்குக் கிடைக்கும் கைம்மாறு அல்லது வெகுமதியைக் குறிக்கிறது. ‘வெகுமதி’ நவீன வாசகர்களுக்குத் தெளிவானதும் இச்சூழலுக்கு ஏற்றதுமாகும்.
theological_decisions:
- issue: மோசேயுடன் தொடர்புபடுத்தப்படும் ‘மேசியாவின் நிந்தை’ என்பதன் துல்லியமான உறவு
  choice: ‘மேசியாவின் நிந்தை’ என்ற பிறப்புவேற்றுமைத் தொடரை விளக்க விரிவாக்கமின்றி வைத்தல்
  alternative: ‘மேசியாவுக்காகச் சுமந்த நிந்தை,’ ‘தேவனால் அபிஷேகம் செய்யப்பட்டவருடன் பகிர்ந்த நிந்தை,’ அல்லது ‘மேசியாவில் நிறைவேறுவதாக எபிரெயர் காணும் நிந்தை’ என்று பொருள் விளக்குதல்
  rationale: τοῦ Χριστοῦ என்ற கிரேக்கத் தொடர் பலவகையான உறவுகளை அனுமதிக்கிறது. ஒரு குறிப்பிட்ட கிறிஸ்தியல் விளக்கத்தை மொழிபெயர்ப்பிலேயே முடிவுசெய்யாமல், மூலத்தின் இறையியல் இறுக்கத்தையும் உண்மையான தெளிவின்மையையும் ‘மேசியாவின் நிந்தை’ பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடிய அதேவேளையில் கண்ணியமான வேதாகம நடையில் வடிவமைக்கப்பட்டது. ‘மேலான செல்வம்,’ ‘நிந்தை,’ ‘வெகுமதி’ ஆகியவை தேவையற்ற பழமையாக்கம் இன்றிச் சொற்களின் எடையைத் தக்கவைக்கின்றன.
