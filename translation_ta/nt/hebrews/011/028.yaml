id: HEB.11.28
reference: Hebrews 11:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πίστει πεποίηκεν τὸ πάσχα καὶ τὴν πρόσχυσιν τοῦ αἵματος, ἵνα μὴ ὁ ὀλοθρεύων τὰ πρωτότοκα θίγῃ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/028.yaml
  text: By faith he has kept the Passover and the sprinkling of the blood[a], so that the destroyer of the firstborn might not touch them.
translation:
  language: ta
  text: விசுவாசத்தினால், முதற்பேறானவர்களை அழிப்பவன் அவர்களைத் தொடாதிருக்கும்படி, அவர் பஸ்காவையும் இரத்தத் தெளிப்பையும்[a] கடைப்பிடித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இரத்தத்தைப் பூசுதலையும்.’ கிரேக்கச் சொல் சடங்குமுறையில் இரத்தத்தை இடுவதைக் குறிக்கிறது. ‘தெளிப்பு’ என்பது மரபான சடங்கியல் மொழிபெயர்ப்பு; யாத்திராகமம் 12-ன் பஸ்கா நிகழ்வில் இரத்தம் வாசலின் நிலைக்கால்களிலும் மேற்சட்டத்திலும் பூசப்பட்டதால் ‘பூசுதல்’ என்பது அந்தச் சூழலை இன்னும் குறிப்பாக வெளிப்படுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: விசுவாசத்தினால்
  rationale: கருவி அல்லது வழிமுறையைக் குறிக்கும் வேற்றுமையை வெளிப்படுத்துகிறது; எபிரெயர் 11 முழுவதும் திரும்பத் திரும்ப வரும் சொற்றொடருடனும் ஒத்திசைகிறது.
- source_word: πεποίηκεν
  choice: கடைப்பிடித்தார்
  rationale: இங்கு ποιέω என்பது பஸ்கா நியமத்தைச் செயல்படுத்தி அனுசரித்ததைக் குறிக்கிறது. இயல்பான தமிழில் முடிவுற்ற வரலாற்றுச் செயலைத் தெளிவாகச் சொல்கிறது.
- source_word: τὸ πάσχα
  choice: பஸ்கா
  rationale: உணவை மட்டும் அல்லாமல் பஸ்கா அனுசரிப்பு முழுவதையும் குறிக்கக்கூடிய மூலச்சொல்லின் பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: τὴν πρόσχυσιν τοῦ αἵματος
  choice: இரத்தத் தெளிப்பு
  rationale: சடங்குமுறையில் இரத்தம் இடப்பட்டதைக் குறிக்கும் மரபான வேதாகமச் சொல்லாட்சி. யாத்திராகமப் பின்னணியில் ‘பூசுதல்’ என்பதும் சாத்தியமாதலால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἵνα μὴ
  choice: தொடாதிருக்கும்படி
  rationale: μή உடன் வரும் நோக்கக் கூறின் எதிர்மறையான, குறிக்கோள் சார்ந்த பொருளைப் பாதுகாக்கிறது.
- source_word: ὁ ὀλοθρεύων
  choice: அழிப்பவன்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் நிகழ்காலப் பங்கேற்புவினையின் பொருளை நேரடியாகக் கொடுக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘தூதன்’ என்ற அடையாளத்தைச் சேர்க்கவில்லை.
- source_word: τὰ πρωτότοκα
  choice: முதற்பேறானவர்கள்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் பன்மை வடிவத்தைப் பாலினம் அல்லது வயதினால் தேவையின்றிக் கட்டுப்படுத்தாமல் வழங்குகிறது.
- source_word: θίγῃ
  choice: தொடாதிருக்க
  rationale: சூழலில் அழிவை விளைவிக்கும் தொடுதலாக இருந்தாலும், வினையின் அடிப்படைப் பொருளான ‘தொடு’ என்பதையும் யாத்திராகம நிகழ்வுடனான எதிரொலியையும் பாதுகாக்கிறது.
- source_word: αὐτῶν
  choice: அவர்களை
  rationale: மோசேயுடன் தொடர்புடைய இஸ்ரயேல் மக்களைக் குறிக்கும் சுட்டுப்பெயரை, மூலத்தைப் போலவே வெளிப்படையான பெயர்ச்சொல் சேர்க்காமல் வைத்திருக்கிறது.
theological_decisions:
- issue: ‘கடைப்பிடித்தார்’ என்பதன் மறைமுக எழுவாய்
  choice: முந்தைய சூழலின் தொடர்ச்சியாக மோசேயைக் குறிக்கும் ‘அவர்’ பயன்படுத்தப்பட்டது.
  alternative: ‘மோசே’ என்று பெயரை வெளிப்படையாகச் சேர்த்தல்.
  rationale: எபிரெயர் 11:23–29 மோசேயைப் பற்றியது; ஆனால் இந்த வசனத்தின் கிரேக்க உரையில் பெயர் மீண்டும் இடம்பெறாததால் சுட்டுப்பெயர் பாதுகாக்கப்பட்டது.
- issue: πίστις என்பதன் மொழிபெயர்ப்பு
  choice: விசுவாசம்
  alternative: நம்பிக்கை; நம்பகத்தன்மை
  rationale: எபிரெயர் 11-ன் மையக் கருத்தும் திரும்பத் திரும்ப வரும் கட்டமைப்பும் இங்கு ‘விசுவாசம்’ என்ற பொருளை வலுவாக ஆதரிக்கின்றன.
- issue: ὁ ὀλοθρεύων என்பவரின் அடையாளம்
  choice: அழிப்பவன்
  alternative: அழிக்கும் தூதன்
  rationale: மூல கிரேக்கம் அவரைத் ‘தூதன்’ என்று வெளிப்படையாக அடையாளப்படுத்தவில்லை; ஆகவே விளக்க மரபை முதன்மை உரைக்குள் சேர்க்காமல் பதற்றம் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையில் வடிவமைக்கப்பட்டது. ‘பஸ்கா’, ‘விசுவாசம்’ ஆகிய பரவலாக அறியப்பட்ட கிறிஸ்தவத் தமிழ்ச் சொற்கள் பயன்படுத்தப்பட்டன; தேவையற்ற விளக்கச் சேர்க்கைகள் தவிர்க்கப்பட்டன.
