source:
  edition: SBLGNT
  text: ἔσβεσαν δύναμιν πυρός, ἔφυγον στόματα ⸀μαχαίρης, ⸀ἐδυναμώθησαν ἀπὸ ἀσθενείας, ἐγενήθησαν ἰσχυροὶ ἐν πολέμῳ, παρεμβολὰς ἔκλιναν ἀλλοτρίων·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/034.yaml
  text: quenched the power of fire[a], escaped the edge of the sword, were made strong out of weakness, became mighty in battle[b], put foreign armies to flight.
translation:
  language: ta
  text: நெருப்பின் வல்லமையை அணைத்தார்கள்; வாளின் கூர்மையான விளிம்பிலிருந்து தப்பினார்கள்[a]; பலவீனத்திலிருந்து வலிமைப்படுத்தப்பட்டார்கள்; போரில் வல்லவர்களானார்கள்; அந்நியர்களின் படைகளை[b] பின்வாங்கச் செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லடியாக, “வாளின் வாய்களிலிருந்து”; இது வாளின் வெட்டும் விளிம்பைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பாளையங்களை”; இச்சொல் இங்கே பாளையமிட்டிருந்த படைகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσβεσαν δύναμιν πυρός
  choice: நெருப்பின் வல்லமையை அணைத்தார்கள்
  rationale: ‘அணைத்தார்கள்’ என்பது σβέννυμι என்பதன் உயிரோட்டமான செயற்பாட்டைத் தக்கவைக்கிறது; δύναμιν πυρός என்பதை வெறும் ‘நெருப்பு’ என்று சுருக்காமல் அதன் ‘வல்லமை’ என மொழிபெயர்க்கிறது.
- source_word: ἔφυγον στόματα μαχαίρης
  choice: வாளின் கூர்முனையிலிருந்து தப்பினார்கள்
  rationale: ἔφυγον இங்கு வெறுமனே ஓடிப்போனதை அல்ல, ஆபத்திலிருந்து வெற்றிகரமாகத் தப்பியதைக் குறிக்கிறது. ‘வாளின் வாய்கள்’ என்ற மூலமொழி மரபுத்தொடரை இயல்பான நவீனத் தமிழில் ‘வாளின் கூர்முனை’ என வழங்கி, சொல்லடித் தோற்றத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: ἐδυναμώθησαν ἀπὸ ἀσθενείας
  choice: பலவீனத்திலிருந்து வலிமையாக்கப்பட்டார்கள்
  rationale: ἀπό பலவீனமே தொடக்கநிலையாக இருந்ததைக் காட்டுகிறது; ἐδυναμώθησαν என்பதன் இறைவினை/செயப்பாட்டு வடிவத்தை ‘வலிமையாக்கப்பட்டார்கள்’ தக்கவைக்கிறது. வலிமை அவர்களால் தாமாக உருவாக்கப்பட்டது என்று உரை சொல்லாத நுணுக்கமும் பாதுகாக்கப்படுகிறது.
- source_word: ἐγενήθησαν ἰσχυροὶ ἐν πολέμῳ
  choice: போரில் வல்லவர்களானார்கள்
  rationale: γίνομαι உடன் வரும் பெயரடை ஒரு புதிய நிலையை அடைந்ததைக் குறிக்கிறது. முந்தைய ‘வலிமையாக்கப்பட்டார்கள்’ என்பதைக் காரணமின்றி மீண்டும் கூறாமல், ἰσχυροί என்பதற்கு இயல்பாக ‘வல்லவர்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: παρεμβολὰς ἔκλιναν ἀλλοτρίων
  choice: அந்நியர்களின் படைகளை பின்வாங்கச் செய்தார்கள்
  rationale: παρεμβολή என்பதன் அடிப்படைப் பொருள் ‘பாளையம்’; இம்மிலிட்டரி சூழலில் அது அங்கே முகாமிட்ட படையைக் குறிக்கிறது. ἔκλιναν என்பதன் ‘திரும்பச் செய்தார்கள்’ என்ற கருத்தை, போர்ச் சூழலுக்கேற்ற ‘பின்வாங்கச் செய்தார்கள்’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: விசுவாச வீரர்களின் விடுதலையும் போர்வெற்றிகளையும் குறிக்கும் தொடர் எவ்வளவு நேரடியாக மொழிபெயர்க்கப்பட வேண்டும்
  choice: நெருப்பு, வாள், பலவீனம், போர், அந்நியப் படைகள் ஆகிய உறுதியான வரலாற்று மற்றும் போரியல் உருவகங்களை அப்படியே தக்கவைத்தல்
  alternative: இவற்றைப் பொதுவான ஆபத்துகள்மீதான அல்லது ஆவிக்குரிய வெற்றியாக விரித்துரைத்தல்
  rationale: எபிரெயர் 11 இஸ்ரவேலின் வரலாற்றோடு தொடர்புடைய குறிப்பிட்ட செயல்களைப் பட்டியலிடுகிறது. மூல உரை இங்கே ஆவிக்குரிய உருவக விளக்கத்தை வெளிப்படையாக அளிக்காததால், மொழிபெயர்ப்பு அந்த விளக்கத்தைச் சேர்க்காமல் உரையின் உடல் சார்ந்த ஆபத்து மற்றும் போரியல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்க வினைகளின் தொடர்ச்சியான பன்மை அமைப்பையும் சொற்றொடரின் வேகத்தையும் காட்ட ஒத்த வாக்கிய முடிவுகள் பயன்படுத்தப்பட்டுள்ளன; அரைப்புள்ளிகள் செயல்களின் பட்டியலைத் தெளிவாக்குகின்றன.
