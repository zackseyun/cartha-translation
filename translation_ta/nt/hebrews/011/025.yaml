reference: Hebrews 11:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μᾶλλον ἑλόμενος συγκακουχεῖσθαι τῷ λαῷ τοῦ θεοῦ ἢ πρόσκαιρον ἔχειν ἁμαρτίας ἀπόλαυσιν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/025.yaml
  text: choosing rather to be mistreated with the people of God than to have the temporary enjoyment of sin,[a]
translation:
  language: ta
  text: பாவத்தின் தற்காலிக இன்பத்தை அனுபவிப்பதைவிட,[a] கடவுளின் மக்களோடு சேர்ந்து துன்புறுத்தப்படுவதையே அவர் தேர்ந்துகொண்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாவத்தின் சிறிது காலமே நீடிக்கும் இன்பத்தைவிட.”
    reason: πρόσκαιρον என்பதன் ‘விரைவில் கடந்துபோகும்’ நுண்பொருளை வெளிப்படுத்தும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: μᾶλλον ἑλόμενος
  choice: தேர்ந்துகொண்டார்
  rationale: இரண்டு வழிகளில் ஒன்றை மோசே திட்டமிட்டு விரும்பித் தேர்ந்தெடுத்தார் என்ற ஒப்பீட்டையும் நடுநிலை வினையின் தனிப்பட்ட முடிவையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: συγκακουχεῖσθαι
  choice: மக்களோடு சேர்ந்து துன்புறுத்தப்படுவது
  rationale: συν- என்பதிலுள்ள உடன் பங்கேற்பையும், வினையின் செயல்பாட்டுக்குட்படும் பொருளையும் காக்கிறது.
- source_word: τῷ λαῷ τοῦ θεοῦ
  choice: கடவுளின் மக்கள்
  rationale: கிரேக்க உரையின் உடைமைத் தொடர்பைக் காக்கும் தெளிவான, வழக்கமான உடன்படிக்கைச் சொற்றொடர்.
- source_word: πρόσκαιρον
  choice: தற்காலிக
  rationale: சிறிது காலம் மட்டுமே நீடிப்பதைக் குறிக்கிறது; நீடித்த மதிப்புக்கு எதிரான நிலையாமையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἔχειν ἁμαρτίας ἀπόλαυσιν
  choice: பாவத்தின் இன்பத்தை அனுபவிப்பது
  rationale: ἔχειν என்பதற்கு சொற்சொல்லான ‘வைத்திருப்பது’ தமிழில் இயல்பற்றது. ἀπόλαυσις ஏற்கெனவே இன்ப அனுபவத்தைக் குறிப்பதால், இவ்வாறு கூறுவது பொருளை மிகைப்படுத்தாமல் இயல்பான தமிழைத் தருகிறது.
theological_decisions:
- issue: ‘பாவத்தின் இன்பம்’ எதைக் குறிப்பதாகும்
  choice: பாவத்தோடு தொடர்புடைய குறுகியகால இன்பம் என்று பொதுவாகவே வைக்கப்பட்டது.
  alternative: பார்வோனின் அரண்மனைச் சலுகைகளையோ எகிப்தோடு தொடர்புடைய குறிப்பிட்ட சமரசங்களையோ இது நேரடியாகக் குறிக்கிறது என்று விளக்குதல்.
  rationale: கிரேக்க உரை பாவத்தின் குறிப்பிட்ட செயல்களையோ இன்பங்களையோ வரையறுக்கவில்லை; ஆகவே மொழிபெயர்ப்பு அந்தப் பரப்பைச் சுருக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கப் பங்கேற்பு வடிவம் முந்தைய வசனத்தைச் சார்ந்திருந்தாலும், தனி வசனமாகத் தெளிவாக வாசிக்க ‘அவர்’ சேர்க்கப்பட்டு வாக்கியம் முழுமையாக்கப்பட்டுள்ளது.
