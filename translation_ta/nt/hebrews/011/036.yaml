  text: ἕτεροι δὲ ἐμπαιγμῶν καὶ μαστίγων πεῖραν ἔλαβον, ἔτι δὲ δεσμῶν καὶ φυλακῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/036.yaml
  text: And others experienced mocking and flogging[a], and even chains and imprisonment.
translation:
  language: ta
  text: மற்ற சிலர் கேலிகளையும் சாட்டையடிகளையும், மேலும் சங்கிலிகளையும் சிறைவாசத்தையும் அனுபவித்தார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மற்ற சிலர் கேலிகள், சாட்டையடிகள், மேலும் சங்கிலிகள், சிறைவாசம் ஆகியவற்றின் சோதனையைச் சந்தித்தார்கள்.” கிரேக்கத்தில் சொல்லுக்கு சொல், “இவற்றின் சோதனையைப் பெற்றார்கள்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι
  choice: வேறு சிலர்
  rationale: முன்பு கூறப்பட்டவர்களிலிருந்து வேறான இன்னொரு குழுவினரைச் சுட்டும் பன்மை வடிவம்; இயல்பான தமிழில் வேறுபாட்டையும் வரையறுக்கப்படாத எண்ணையும் வெளிப்படுத்துகிறது.
- source_word: ἐμπαιγμῶν
  choice: கேலிகளாலும்
  rationale: பொதுவெளியில் இகழ்ந்து பரிகசிப்பதைக் குறிக்கிறது; பன்மையின் தாக்கத்தைத் தமிழிலும் தக்கவைக்கிறது.
- source_word: μαστίγων
  choice: சாட்டையடிகளாலும்
  rationale: சாட்டையால் அடிக்கப்படும் உடல் தண்டனையைத் தெளிவாகவும் தற்போதைய தமிழில் இயல்பாகவும் குறிக்கிறது.
- source_word: πεῖραν ἔλαβον
  choice: சோதிக்கப்பட்டார்கள்
  rationale: சொல்லுக்கு சொல் அமைப்பு ‘சோதனையைப் பெற்றார்கள்’ என்பதாக இருந்தாலும், இத்துன்பங்களைச் சோதனைகளாக அனுபவித்தார்கள் என்ற கருத்தை இயல்பான தமிழில் தருகிறது.
- source_word: ἔτι δὲ
  choice: அதுமட்டுமல்ல
  rationale: அடுத்துவரும் துன்பங்களுக்கான தீவிரப்படுத்தும் சேர்க்கையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δεσμῶν
  choice: சங்கிலிகளாலும்
  rationale: கைது அல்லது காவலில் பயன்படுத்தப்பட்ட கட்டுப்பாடுகளைக் குறிக்கும் தெளிவான, உருவகமற்ற நவீனத் தமிழ் சொல்.
- source_word: φυλακῆς
  choice: சிறைவாசத்தாலும்
  rationale: சிறை என்னும் இடத்தை மட்டும் அல்லாமல், சிறையில் அடைக்கப்பட்ட நிலையை இச்சூழலில் துல்லியமாகக் குறிக்கிறது.
theological_decisions:
- issue: πεῖραν ἔλαβον என்ற சொற்றொடரில் சோதனை என்ற கருத்தை வெளிப்படுத்துதல்
  choice: சோதிக்கப்பட்டார்கள்
  alternative: அனுபவித்தார்கள்
  rationale: இவை வெறும் அனுபவங்கள் மட்டுமல்ல, விசுவாசத்தைச் சோதித்த துன்பங்கள் என்ற கிரேக்கச் சொற்றொடரின் நுணுக்கத்தைத் தக்கவைக்கிறது; அதேவேளையில் அவை தெய்வீகத் தண்டனை என்று தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், வழிபாட்டு வாசிப்பிற்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கேலிகள்’, ‘சாட்டையடிகள்’ என்ற பன்மைகள் மூலத்தின் பன்மை வடிவத்தைத் தக்கவைக்கின்றன; வாக்கியத்தின் இரு பகுதிகளிலும் ‘சோதிக்கப்பட்டார்கள்’ சேர்க்கப்பட்டிருப்பது தமிழில் பொருளைத் தெளிவாக்குகிறது.
