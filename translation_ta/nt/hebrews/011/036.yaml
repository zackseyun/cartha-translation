revisions:
- from: வேறு சிலர் கேலிகளாலும் சாட்டையடிகளாலும் சோதிக்கப்பட்டார்கள்[a]; அதுமட்டுமல்ல, சங்கிலிகளாலும் சிறைவாசத்தாலும் சோதிக்கப்பட்டார்கள்.
  to: மற்ற சிலர் கேலிகளையும் சாட்டையடிகளையும், மேலும் சங்கிலிகளையும் சிறைவாசத்தையும் அனுபவித்தார்கள்[a].
  rationale: The revision retains every suffering named in the Greek and its intensifying addition (“மேலும்”), while expressing the single Greek idiom once in fluent Tamil. The footnote preserves the more literal singular ‘trial/test’ formulation without imposing a theological interpretation of the testing.
  reviewer_model: gpt-5.6-terra
