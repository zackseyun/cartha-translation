revisions:
- from: இவர்கள் விசுவாசத்தினால் அரசுகளை வென்றார்கள்; நீதியானவற்றைச் செய்தார்கள்[a]; வாக்குறுதிகளைப் பெற்றார்கள்; சிங்கங்களின் வாய்களை அடைத்தார்கள்.
  to: இவர்கள் விசுவாசத்தினால் அரசாட்சிகளை வென்றார்கள்; நீதியானதைச் செய்தார்கள்[a]; வாக்குறுதிகளைப் பெற்றார்கள்; சிங்கங்களின் வாய்களை அடைத்தார்கள்.
  rationale: 'Two small revisions improve precision without altering the verse’s meaning: அரசாட்சிகளை distinguishes kingdoms from modern governmental bodies, and நீதியானதைச் செய்தார்கள் naturally conveys the active practice of δικαιοσύνη while leaving its righteousness/justice range open in the footnote. No footnote is needed for விசுவாசத்தினால், since the Tamil wording already directly and unambiguously represents the instrumental phrase.'
