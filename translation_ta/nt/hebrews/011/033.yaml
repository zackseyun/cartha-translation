id: HEB.11.33
reference: Hebrews 11:33
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἳ διὰ πίστεως κατηγωνίσαντο βασιλείας, εἰργάσαντο δικαιοσύνην, ἐπέτυχον ἐπαγγελιῶν, ἔφραξαν στόματα λεόντων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/033.yaml
  text: who through faith conquered kingdoms[a], worked righteousness, obtained promises, shut the mouths of lions[b],
translation:
  language: ta
  text: இவர்கள் விசுவாசத்தினால் அரசாட்சிகளை வென்றார்கள்; நீதியானதைச் செய்தார்கள்[a]; வாக்குறுதிகளைப் பெற்றார்கள்; சிங்கங்களின் வாய்களை அடைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீதியை நிலைநாட்டினார்கள்.” கிரேக்கச் சொல் சூழலுக்கேற்ப ஒழுக்கநேர்மையையோ நீதியையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ πίστεως
  choice: விசுவாசத்தினால்
  rationale: διά + genitive இங்கு செயல்கள் நிகழ்ந்த வழிமுறையைச் சுட்டுகிறது. ‘விசுவாசத்தினால்’ என்பது கடவுள்மீது வைத்த நம்பிக்கையின் மூலம் அவர்கள் செயல்பட்டார்கள் என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: κατηγωνίσαντο βασιλείας
  choice: அரசுகளை வென்றார்கள்
  rationale: καταγωνίζομαι போராட்டத்தில் வெல்வது அல்லது கீழ்ப்படுத்துவது என்ற வலிமையான பொருளைக் கொண்டது; βασιλείας இங்கு அரசியல் ஆட்சிப்பரப்புகளைக் குறிக்கிறது. ‘அரசுகளை வென்றார்கள்’ என்பது நவீனத் தமிழில் நேரடியும் இயல்புமானது.
- source_word: εἰργάσαντο δικαιοσύνην
  choice: நீதியானவற்றைச் செய்தார்கள்
  rationale: ἐργάζομαι என்பதன் செயற்பாட்டு வலிமையையும் δικαιοσύνη என்பதன் ஒழுக்கநேர்மை மற்றும் நீதி ஆகிய பரந்த பொருளையும் இச்சொற்றொடர் காக்கிறது. ‘நீதியைச் செயல்படுத்தினார்கள்’ என்பது நீதித்துறை சார்ந்த பொருளாகச் சுருங்கக்கூடும்.
- source_word: ἐπέτυχον ἐπαγγελιῶν
  choice: வாக்குறுதிகளைப் பெற்றார்கள்
  rationale: ἐπιτυγχάνω என்பது பெறுதல் அல்லது அடைதல் என்று பொருள்படும். ‘பெற்றார்கள்’ என்பது வாக்குறுதிகள் எந்த அளவில் நிறைவேறின என்பதைக் கூடுதலாகத் தீர்மானிக்காமல் கிரேக்கத்தின் திறந்த தன்மையைப் பாதுகாக்கிறது.
- source_word: ἔφραξαν στόματα λεόντων
  choice: சிங்கங்களின் வாய்களை அடைத்தார்கள்
  rationale: φράσσω என்பதன் ‘அடைத்தல், தடுத்தல்’ என்ற பொருளையும் கிரேக்கத்தின் தெளிவான உருவகத்தையும் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: Hebrews 11 பட்டியலில் πίστις என்பதன் பொருள்
  choice: விசுவாசம்
  alternative: நம்பிக்கை / உண்மைத்தன்மை
  rationale: இவ்வதிகாரத்தின் சூழலில் கடவுளை நம்பிச் செயல்படுதலே முன்னிலையில் உள்ளது. ஆகவே ‘விசுவாசம்’ முதன்மைப் பொருத்தம்; ‘உண்மைத்தன்மை’ என்று மொழிபெயர்த்தால் இச்சூழலில் தேவையற்ற வகையில் பொருள் மாறும்.
- issue: δικαιοσύνη என்பதன் பரப்பு
  choice: நீதியானவற்றைச் செய்தார்கள்
  alternative: நீதியை நிலைநாட்டினார்கள்
  rationale: இங்கு சொல் ஒழுக்கநேர்மையான செயல் மற்றும் நீதி நிலைநாட்டுதல் ஆகிய இரண்டையும் உள்ளடக்கக்கூடும். முதன்மை வாசகம் பரந்த பொருளைக் காக்கிறது; மாற்று நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் தொடர்ச்சியான செயற்பட்டியல் அரைப்புள்ளிகளால் காக்கப்பட்டுள்ளது; தேவையற்ற சமயக்குழுச் சொற்பயன்பாடுகள் தவிர்க்கப்பட்டுள்ளன.
