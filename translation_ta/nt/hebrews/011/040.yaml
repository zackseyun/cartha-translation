source:
  edition: SBLGNT
  text: τοῦ θεοῦ περὶ ἡμῶν κρεῖττόν τι προβλεψαμένου, ἵνα μὴ χωρὶς ἡμῶν τελειωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/040.yaml
  text: since God had provided something better for us[b][a], so that they would not be made perfect apart from us.
translation:
  language: ta
  text: கடவுள் நமக்காக மேலான ஒன்றை முன்னரே ஏற்பாடு செய்திருந்தார்; அவர்கள் நம்மைத் தவிர்த்து நிறைவு அடையாதபடிக்கு அவர் அப்படிச் செய்தார்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடவுள் நமக்காக மேலான ஒன்றை முன்னரே கண்டிருந்தார்.’ கிரேக்க வினையெச்சம் முன்னறிதல் அல்லது முன்கூட்டிய ஏற்பாடு என்ற இரு நிழற்பொருள்களையும் கொண்டிருக்கலாம்; இச்சூழல் கடவுளின் ஏற்பாடு அல்லது திட்டத்தையே அதிகம் ஆதரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர்கள் நம்மில்லாமல் முழுமையாக்கப்படாதபடிக்கு’ அல்லது ‘அவர்கள் நம்மைத் தவிர்த்து முடிவான நிறைவை அடையாதபடிக்கு.’
    reason: alternative_reading
lexical_decisions:
- source_word: προβλεψαμένου
  choice: முன்னரே ஏற்பாடு செய்திருந்தார்
  rationale: இச்சூழலில் இது வெறும் முன்னறிவைக் காட்டுவதைக் காட்டிலும், பிற்கால விசுவாசிகளையும் கருத்தில் கொண்டு கடவுள் முன்கூட்டியே செய்த ஏற்பாடு அல்லது திட்டத்தைச் சுட்டுகிறது. ‘முன்னரே’ என்பது கிரேக்கச் சொல்லிலுள்ள முன்நோக்கிய அம்சத்தையும் காக்கிறது.
- source_word: κρεῖττόν τι
  choice: இன்னும் சிறந்த ஒன்றை
  rationale: எபிரெயர் நூலில் மீண்டும் மீண்டும் வரும் ‘சிறந்த’ என்ற ஒப்பீட்டுக் கருத்தைத் தக்கவைத்து, τι என்பதைக் ‘ஒன்று’ என இயல்பாக வெளிப்படுத்துகிறது.
- source_word: περὶ ἡμῶν
  choice: நமக்காக
  rationale: கடவுளின் ஏற்பாடு நம்மைக் கருத்தில் கொண்டதும் நமக்கு நன்மை பயப்பதுமானது என்பதை இயல்பான தமிழில் தெரிவிக்கிறது; ‘நம்மைக் குறித்து’ என்பதும் சொற்பொருள் சாத்தியம்.
- source_word: ἵνα μὴ
  choice: … கூடாது என்பதற்காக
  rationale: நோக்கம் அல்லது நோக்கத்துடன் கூடிய விளைவைத் தெரிவிக்கும் கிரேக்க அமைப்பின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: χωρὶς ἡμῶν
  choice: நம்மைத் தவிர்த்து
  rationale: அவர்களுடைய நிறைவு நம்மிடமிருந்து பிரிந்தோ தனித்தோ நிகழாது என்ற கூட்டு, இரட்சிப்பு-வரலாற்றுக் கருத்தைக் காக்கிறது.
- source_word: τελειωθῶσιν
  choice: நிறைவுபெற
  rationale: τελειόω என்பதில் உள்ள முழுமையாக்கப்படுதல் மற்றும் நிறைவை அடைதல் ஆகிய இரு நிழற்பொருள்களையும் தமிழில் இயன்றவரை திறந்தவையாக வைத்திருக்கிறது; ஒழுக்கக் குறையின்மையாக மட்டும் சுருக்குவதில்லை.
- source_word: τοῦ θεοῦ
  choice: கடவுள்
  rationale: முழுமைபெற்ற வினையெச்சத் தொடரை தமிழில் தெளிவான காரணக் கூற்றாக மாற்றி, செய்பவரை வெளிப்படையாகக் குறிப்பிடுகிறது.
theological_decisions:
- issue: எபிரெயர் நூலின் இரட்சிப்பு-வரலாற்றுச் சூழலில் τελειωθῶσιν என்பதன் பொருள்
  choice: ‘நிறைவுபெற’ என்று வைத்து, முழுமை மற்றும் முடிவுறுதல் ஆகிய இரு கருத்துகளுக்கும் இடமளித்தல்
  alternative: ‘முழுமையாக்கப்பட’, ‘முடிவான நிறைவை அடைய’
  rationale: இச்சொல் எபிரெயர் நூலில் நிறைவேற்றம், கடவுளை அணுகுதல், இறுதி நிறைவு ஆகியவற்றுடன் தொடர்புடைய செறிவான பொருளைக் கொண்டுள்ளது. ‘நிறைவுபெற’ என்பது அதை வெறும் ஒழுக்கப் பரிபூரணமாகவோ காலவரிசை முடிவாகவோ மட்டுப்படுத்தாமல் காக்கிறது.
- issue: முந்தைய விசுவாசிகளும் இக்கால விசுவாசிகளும் சேர்ந்து அடையும் நிறைவு
  choice: ‘நம்மைத் தவிர்த்து அவர்கள் நிறைவுபெறக் கூடாது’ என்று கூட்டு நிறைவை வெளிப்படுத்துதல்
  alternative: ‘நம்மில்லாமல் அவர்கள் முழுமையாக்கப்படக் கூடாது’
  rationale: வசனம் அவர்களின் நிறைவு நம்முடையதிலிருந்து தனியே நிகழாது என்பதைக் கூறுகிறது; எந்தக் குறிப்பிட்ட சமயக்கோட்பாட்டையும் மேலதிகமாகச் சேர்க்காமல் அந்த உறவைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. கிரேக்கத்தின் காரணத் தொடர்பைத் தமிழில் இயல்பாக்க இரண்டாவது வாக்கியத்தில் ‘அப்படிச் செய்தார்’ சேர்க்கப்பட்டுள்ளது. ‘இன்னும் சிறந்த’, ‘நிறைவுபெற’ ஆகியவை எபிரெயர் நூலின் ஒப்பீட்டு மொழியையும் இறையியல் செறிவையும் காக்கின்றன.
