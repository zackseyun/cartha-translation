base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/030.yaml
  text: By faith the walls of Jericho fell after they had been encircled for seven days[a].
translation:
  language: ta
  text: விசுவாசத்தினால் எரிகோவின் மதில்கள் ஏழு நாட்கள் சுற்றி வளைக்கப்பட்டபின் விழுந்தன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘விசுவாசத்தின் வழியாக.’ கிரேக்க மொழியில் πίστει என்ற வேற்றுமை வடிவம் வழிமுறையையோ செயல் நிகழும் விதத்தையோ குறிக்கலாம்; முதன்மைப் பாடம் எபிரெயர் 11-இல் பழக்கமான தொடரமைப்பைப் பேணுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: விசுவாசத்தினால்
  rationale: πίστις என்பதன் வேற்றுமை வடிவம் இங்கு கருவிப் பொருளையோ செயல்முறைப் பொருளையோ தரலாம். எபிரெயர் 11-இல் திரும்பத் திரும்ப வரும் தொடர் அமைப்பையும் ‘விசுவாசம்’ என்ற மையச் சொல்லையும் இது இயல்பாகப் பேணுகிறது.
- source_word: τὰ τείχη
  choice: மதில்கள்
  rationale: τεῖχος என்பது குறிப்பாக ஒரு நகரின் பாதுகாப்புச் சுவரைக் குறிக்கிறது; ‘மதில்கள்’ என்பது எரிகோ நகரச் சூழலில் இயல்பானதும் துல்லியமானதும் ஆகும்.
- source_word: Ἰεριχὼ
  choice: எரிகோவின்
  rationale: எரிகோ என்ற இடப்பெயர் தமிழில் வழக்கமான ஒலிபெயர்ப்பு வடிவில் தரப்பட்டு, மதில்களுடனான உடைமைத் தொடர்பு ‘எரிகோவின்’ என்று வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: ἔπεσαν
  choice: விழுந்தன
  rationale: πίπτω என்ற வினையின் நேரான பொருள் ‘விழுதல்.’ ‘இடிந்து விழுந்தன’ என்பது சற்றுக் கூடுதல் விளக்கத்தைச் சேர்க்கும் என்பதால் எளிய ‘விழுந்தன’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: κυκλωθέντα
  choice: அவற்றைச் சுற்றி வந்தபின்
  rationale: κυκλόω என்பதன் செயப்பாட்டு வினையெச்சம், மதில்கள் சுற்றிவரப்பட்டதைச் சுட்டுகிறது. சொல்லுக்குச் சொல் செயப்பாட்டு அமைப்பு தமிழில் இயல்பற்றதாக இருப்பதால், செய்பவரைக் குறிப்பிடாமல் ‘அவற்றைச் சுற்றி வந்தபின்’ என இயல்பாகத் தரப்பட்டுள்ளது; இது முதன்மை வினைக்கு முந்திய செயலைக் காட்டுகிறது.
- source_word: ἐπὶ ἑπτὰ ἡμέρας
  choice: ஏழு நாட்கள்
  rationale: ἐπί + காலத்தைக் குறிக்கும் எதிர்மறை வேற்றுமை இங்கு கால நீட்சியைக் காட்டுகிறது. தமிழில் ‘ஏழு நாட்கள்’ என்பதே இயல்பாக அந்த நீட்சியைத் தெரிவிக்கிறது.
theological_decisions:
- issue: எபிரெயர் 11:30-இல் πίστις என்பதன் மொழிபெயர்ப்பு
  choice: விசுவாசம்
  alternative: நம்பிக்கை / நம்பியிருத்தல்
  rationale: எபிரெயர் 11 முழுவதிலும் மீள வரும் சூத்திரத் தொடரும், முன்னுதாரண மனிதர்களின் கடவுள் நம்பிக்கையை எடுத்துரைக்கும் சூழலும் ‘விசுவாசம்’ என்பதற்கு ஆதரவாக உள்ளன. ‘உண்மைத்தன்மை’ என்று மொழிபெயர்ப்பது இங்கு தேவையற்ற இறையியல் தீர்மானத்தைச் சேர்க்கும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘மதில்கள்’ நகரப் பாதுகாப்புச் சுவர்களைத் துல்லியமாகக் குறிக்கிறது. கிரேக்கச் செயப்பாட்டு வினையெச்சத்தை அசட்டான தமிழ் செயப்பாட்டு வடிவமாக மாற்றாமல், பொருளை இயல்பான தொடரில் வழங்குகிறது.
