  source_fidelity: 'மூலத்தின் முக்கியக் கருத்துகள் சரியாக உள்ளன: πίστει-யின் கருவிப்பொருள், παρῴκησεν-இன் அந்நியக் குடியிருப்பு, கூடார வாழ்வு, ஈசாக்கு-யாக்கோபுடனான உறவு, ஒரே வாக்குத்தத்தத்தில் பங்குபெறும் வாரிசுரிமை ஆகியவை பாதுகாக்கப்பட்டுள்ளன. ஆனால் ‘அவர்களும் ... இருந்தார்கள்’ என்பது கிரேக்கத்தில் ஈசாக்கும் யாக்கோபும் பற்றிய விளக்கப்பெயர் அமைப்பாக உள்ள τῶν συγκληρονόμων-ஐ தனி முதன்மை வாக்கியமாக மாற்றுகிறது. அதை ‘உடன் வாரிசுகளாகிய’ என ஆபிரகாம் அவர்களோடு கூடாரங்களில் வாழ்ந்ததோடு இணைப்பது மூலத் தொடரமைப்பை நன்றாகக் காக்கும்.'
  naturalness: தற்போதைய உரையில் ‘அது வேறொருவருக்குச் சொந்தமான நாடுபோல் அங்கே’ என்ற தொடர் சற்று கனமாகவும், ‘அவர்கள்’ எதைக் குறிக்கிறது என்பதில் ஒரு கண நேரத் தடுமாற்றமும் உண்டு. திருத்திய வடிவம் நவீன நிலையான தமிழில் நேரடியாகவும் வாசிப்புக்கு இயல்பாகவும் உள்ளது.
  terminology: ‘விசுவாசம்,’ ‘வாக்குத்தத்தம்,’ ‘கூடாரங்கள்,’ ‘உடன் வாரிசுகள்’ ஆகிய சொற்கள் பொருத்தமான வேதாகமப் பதிவும் நவீனப் புரிதலும் உடையவை. ‘வாக்குத்தத்தம் அளிக்கப்பட்ட நாடு’ என்பது γῆ τῆς ἐπαγγελίας-ன் உறவைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
  issues:
