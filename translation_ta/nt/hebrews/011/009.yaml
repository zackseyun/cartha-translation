revisions:
- from: விசுவாசத்தினால் அவர், வாக்குத்தத்தம் செய்யப்பட்ட நாட்டில் அந்நியராகக் குடியிருந்தார்; அது வேறொருவருக்குச் சொந்தமான நாடுபோல் அங்கே ஈசாக்கோடும் யாக்கோபோடும் கூடாரங்களில் வாழ்ந்தார். அவர்களும் அதே வாக்குத்தத்தத்தின் உடன் வாரிசுகளாய் இருந்தார்கள்.[a]
  to: விசுவாசத்தினால் அவர், வாக்குத்தத்தம் அளிக்கப்பட்ட நாட்டில் அந்நியராகக் குடியிருந்தார்; அந்நிய நாடுபோல் அதில், அதே வாக்குத்தத்தத்தின் உடன் வாரிசுகளாகிய ஈசாக்கோடும் யாக்கோபோடும் கூடாரங்களில் வாழ்ந்தார்.[a]
  rationale: ஈசாக்கும் யாக்கோபும் ‘அதே வாக்குத்தத்தத்தின் உடன் வாரிசுகள்’ என்பதைக் கிரேக்கத்தின் விளக்கப்பெயர் அமைப்பாக மீட்டமைத்தோம். மேலும், வாக்குத்தத்த நாடு ஆபிரகாமுக்குத் தனக்குச் சொந்தமல்லாத அந்நிய நாடுபோல் இருந்தது என்ற ὡς ἀλλοτρίαν-ன் கருத்தை, தேவையற்ற விளக்க விரிவாக்கமின்றி இயல்பான தமிழில் வழங்கினோம்.
