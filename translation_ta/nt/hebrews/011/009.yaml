source:
  edition: SBLGNT
  text: πίστει παρῴκησεν εἰς γῆν τῆς ἐπαγγελίας ὡς ἀλλοτρίαν, ἐν σκηναῖς κατοικήσας μετὰ Ἰσαὰκ καὶ Ἰακὼβ τῶν συγκληρονόμων τῆς ἐπαγγελίας τῆς αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/009.yaml
  text: By faith he lived as a foreigner in the land of promise[a], as in a foreign land, dwelling in tents with Isaac and Jacob, fellow heirs of the same promise.
translation:
  language: ta
  text: விசுவாசத்தினால் அவர், வாக்குத்தத்தம் அளிக்கப்பட்ட நாட்டில் அந்நியராகக் குடியிருந்தார்; அந்நிய நாடுபோல் அதில், அதே வாக்குத்தத்தத்தின் உடன் வாரிசுகளாகிய ஈசாக்கோடும் யாக்கோபோடும் கூடாரங்களில் வாழ்ந்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “விசுவாசத்தினால் அவர், வாக்குத்தத்தம் அளிக்கப்பட்ட நாட்டில் அந்நிய நாடுபோல் தங்கியிருந்து, அதே வாக்குத்தத்தத்தின் உடன் வாரிசுகளான ஈசாக்கோடும் யாக்கோபோடும் கூடாரங்களில் வாழ்ந்தார்.”'
    reason: παρῴκησεν என்பதற்கு ‘தங்கியிருந்தார்/குடியிருந்தார்’ என்ற மாற்றும், ὡς ἀλλοτρίαν என்பதன் ‘அந்நிய நாடுபோல்’ என்ற ஒப்புமைத் தொடர்பும் சுருக்கமாக மாற்றி அமைக்கப்படலாம்.
lexical_decisions:
- source_word: πίστει
  choice: விசுவாசத்தினால்
  rationale: கருவிப் பொருள் தரும் வேற்றுமையை வெளிப்படுத்துகிறது; எபிரெயர் 11 முழுவதிலும் திரும்பத் திரும்ப வரும் விசுவாசம் என்ற மையக் கருத்தையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: παρῴκησεν
  choice: அந்நியராகக் குடியிருந்தார்
  rationale: சொந்த நாட்டவராக அல்லாமல் வெளியாளாக ஒரு இடத்தில் வசித்தல் என்ற சமூக நிலையையும் தற்காலிகத் தன்மையையும் தெளிவாகக் காட்டுகிறது.
- source_word: εἰς γῆν τῆς ἐπαγγελίας
  choice: வாக்குத்தத்தம் செய்யப்பட்ட நாட்டில்
  rationale: வசித்தலைக் குறிக்கும் வினையோடு εἰς இடப்பொருளில் வருவதால் ‘நாட்டில்’ என வழங்கப்பட்டது; τῆς ἐπαγγελίας என்பதன் வாக்குத்தத்தத் தொடர்பு இயல்பான தமிழில் வெளிப்படுத்தப்பட்டது.
- source_word: ὡς ἀλλοτρίαν
  choice: அது வேறொருவருக்குச் சொந்தமான நாடுபோல்
  rationale: ἀλλότριος என்பதிலுள்ள ‘மற்றொருவருக்குச் சொந்தமானது’ என்ற அடிப்படை நுண்பொருளையும் ὡς தரும் ஒப்பீட்டையும் காக்கிறது.
- source_word: ἐν σκηναῖς κατοικήσας
  choice: கூடாரங்களில் வாழ்ந்தார்
  rationale: நிலையற்ற குடியிருப்பின் தெளிவான உருவகத்தை இயல்பான நடப்புத் தமிழில் தருகிறது; பங்கேற்புவினையின் சூழ்நிலைப் பொருள் முதன்மை வாக்கியத்தோடு இணைக்கப்பட்டுள்ளது.
- source_word: μετὰ Ἰσαὰκ καὶ Ἰακὼβ
  choice: ஈசாக்கோடும் யாக்கோபோடும்
  rationale: μετά உடன் வரும் கூட்டுறவுப் பொருளை இயல்பான தமிழ் இணைப்பால் வழங்குகிறது.
- source_word: τῶν συγκληρονόμων
  choice: உடன் வாரிசுகள்
  rationale: ஒரே உரிமையைப் பகிர்ந்து பெறுகிறவர்கள் என்ற συγκληρονόμος-ன் பொருளை சுருக்கமாகவும் புரிந்துகொள்ளத்தக்க வகையிலும் தருகிறது.
- source_word: τῆς ἐπαγγελίας τῆς αὐτῆς
  choice: அதே வாக்குத்தத்தத்தின்
  rationale: ஈசாக்கும் யாக்கோபும் ஆபிரகாமுக்கு அளிக்கப்பட்ட அதே வாக்குத்தத்தத்தைப் பகிர்ந்தவர்கள் என்பதை αὐτῆς வலியுறுத்துவது பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: மறைந்துள்ள எழுவாயின் அடையாளம்
  choice: முந்தைய வசனத்திலிருந்து தொடரும் ஆபிரகாமைக் குறிக்க ‘அவர்’ பயன்படுத்தப்பட்டது.
  alternative: பெயரை வெளிப்படையாகச் சேர்த்து ‘ஆபிரகாம்’ என மொழிபெயர்த்தல்.
  rationale: கிரேக்க உரையில் பெயர் மீண்டும் இடம்பெறவில்லை; சூழல் ஆபிரகாமைத் தெளிவாகக் குறிக்கிறது. ஆகவே உரையில் இல்லாத பெயரைச் சேர்க்காமல் தொடர்ச்சியைப் பாதுகாக்கிறது.
- issue: ὡς ἀλλοτρίαν என்பதன் உறவு
  choice: நாடு அவருக்குச் சொந்தமல்லாதது போல் அவர் அங்கே வாழ்ந்தார் என்ற பொருள்.
  alternative: அவர் அந்நியராக வாழ்ந்தார் என்பதையே ὡς ἀλλοτρίαν நேரடியாகக் குறிக்கிறது என அமைத்தல்.
  rationale: ἀλλοτρίαν என்பது பெண்பால் ஒருமை குற்றுவேற்றுமையில் γῆν என்பதோடு இலக்கண ஒத்திசைவு பெறுகிறது; வாக்குத்தத்த நாடாக இருந்தும் அப்போது வேறொருவருக்குச் சொந்தமானதுபோல் இருந்த பதற்றம் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமும் எளிய வாசிப்புத்தன்மையும் பேணப்பட்டுள்ளன. ‘விசுவாசம்’, ‘வாக்குத்தத்தம்’, ‘வாரிசு’ போன்ற பரவலாக அறியப்படும் வேதாகமச் சொற்கள் வைக்கப்பட்டுள்ளன; ‘வேறொருவருக்குச் சொந்தமான நாடுபோல்’ என்பது வாக்குத்தத்தம் அளிக்கப்பட்டிருந்தும் உடைமை இன்னும் நிறைவேறாத பதற்றத்தைத் தெளிவாகக் காக்கிறது.
