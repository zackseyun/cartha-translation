    issue: ‘அவர்களும் அதே வாக்குத்தத்தத்தின் உடன் வாரிசுகளாய் இருந்தார்கள்’ என்ற தனி வாக்கியம்
    rationale: τῶν συγκληρονόμων τῆς ἐπαγγελίας τῆς αὐτῆς என்பது ஈசாக்கு, யாக்கோபு ஆகியோருக்கான விளக்கப்பெயர்; அவர்கள் ஆபிரகாமுடன் கூடாரங்களில் வாழ்ந்தார்கள் எனக் கூறும் தனி வாக்கியம் அல்ல. ‘உடன் வாரிசுகளாகிய ஈசாக்கோடும் யாக்கோபோடும்’ என இணைப்பது மூலத்தின் இலக்கண உறவைப் பாதுகாக்கிறது.
