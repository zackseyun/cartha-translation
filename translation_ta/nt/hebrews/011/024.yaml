  text: πίστει Μωϋσῆς μέγας γενόμενος ἠρνήσατο λέγεσθαι υἱὸς θυγατρὸς Φαραώ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/024.yaml
  text: By faith Moses[a], when he had grown up, refused to be called the son of Pharaoh’s daughter,
translation:
  language: ta
  text: விசுவாசத்தினால்[a] மோசே வயது வந்தபோது, பார்வோனுடைய மகளின் மகன் என்று அழைக்கப்படுவதை மறுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “நம்பிக்கையினால்”; அல்லது “விசுவாசத்தன்மையினால்.” கிரேக்கச் சொல் πίστει. இங்கு அதிகாரம் முழுவதும் திரும்பத் திரும்ப வரும் “விசுவாசத்தினால்” என்ற தொடர் முதன்மை உரையில் பின்பற்றப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: விசுவாசத்தினால்
  rationale: கருவிப் பொருளுடைய வேற்றுமை வடிவம்; எபிரெயர் 11 முழுவதும் திரும்பத் திரும்ப வரும் சூத்திரத்தை இயல்பாகவும் ஒரே சீராகவும் தெரிவிக்கிறது.
- source_word: Μωϋσῆς
  choice: மோசே
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட பெயர் வடிவம்.
- source_word: μέγας γενόμενος
  choice: வளர்ந்து பெரியவனானபோது
  rationale: அந்தஸ்தில் உயர்ந்தார் என்பதற்குப் பதிலாக வயதுவந்து முதிர்ச்சி அடைந்தார் என்ற சூழல்சார் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἠρνήσατο
  choice: மறுத்தார்
  rationale: தமக்குச் சூட்டப்பட்ட அடையாளத்தை ஏற்கத் திட்டவட்டமாக மறுத்த செயலை இயல்பான தமிழில் குறிக்கிறது.
- source_word: λέγεσθαι
  choice: என்று அழைக்கப்படுவதை
  rationale: செயப்பாட்டு வினையெச்சத்தின் பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: υἱὸς θυγατρὸς Φαραώ
  choice: பார்வோனுடைய மகளின் மகன்
  rationale: மோசேயின் குறிப்பிட்ட அரசகுல அடையாளத்தைத் தெளிவாகக் குறிக்கும் இயல்பான தமிழ் உடைமைத் தொடர்.
- source_word: Φαραώ
  choice: பார்வோன்
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் அறியப்பட்ட பட்டப்பெயர் வடிவம்.
theological_decisions:
- issue: எபிரெயர் 11-இன் சூத்திரத்தில் πίστις என்பதன் மொழிபெயர்ப்பு
  choice: விசுவாசம்
  alternative: நம்பிக்கை; உண்மைத்தன்மை
  rationale: இவ்வதிகாரத்தில் செயல்களுக்கு உந்துதலாக உள்ள விசுவாசத்தைச் சுட்டும் திரும்பத் திரும்ப வரும் சூத்திரத்திற்கு ‘விசுவாசம்’ பொருத்தமானது; மூலச்சொல்லின் பிற சாத்தியமான நுண்பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை. ‘மோசே’, ‘பார்வோன்’, ‘விசுவாசம்’ ஆகிய பரவலாக அறியப்பட்ட வேதாகமச் சொல்வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
