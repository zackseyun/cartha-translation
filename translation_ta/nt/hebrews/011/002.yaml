    text: ‘பாராட்டப்பட்டார்கள்’ அல்லது ‘அவர்களைப் பற்றி நற்சாட்சி அளிக்கப்பட்டது’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் சாதகமான சாட்சியைப் பெறுவதைக் குறிக்கிறது.
