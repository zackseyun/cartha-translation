lexical_decisions:
- source_word: ἐν ταύτῃ
  choice: இதன் மூலமே
  rationale: பெண்பால் ஒருமைச் சுட்டுப்பெயர் முந்தைய வசனத்திலுள்ள πίστις (விசுவாசம்) என்பதைக் குறிக்கிறது; ἐν இங்கு கருவிப் பொருளை வெளிப்படுத்துகிறது. ‘இதன் மூலமே’ என்பது மூலத்தின் சுட்டுத்தன்மையையும் ‘விசுவாசத்தின் மூலம்’ என்ற சூழல்சார் பொருளையும் இயல்பாகக் காக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் விசுவாசத்தைப் பற்றிக் கூறியதை விளக்கி ஆதரிக்கும் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐμαρτυρήθησαν
  choice: நற்சான்று பெற்றார்கள்
  rationale: μαρτυρέω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவம் இங்கு சாதகமான சாட்சியை அல்லது பாராட்டைப் பெறுதலைக் குறிக்கிறது. ‘நற்சான்று பெற்றார்கள்’ என்பது செயப்பாட்டுப் பொருளையும் சாதகமான மதிப்பீட்டையும் காக்கிறது; அந்தச் சான்றை அளிப்பவர் யார் என்பதை மூலத்தைவிட வெளிப்படையாகச் சேர்ப்பதில்லை.
- source_word: οἱ πρεσβύτεροι
  choice: முற்காலத்தவர்கள்
  rationale: πρεσβύτεροι என்பதற்கு நேரடியாக ‘மூப்பர்கள்’ என்று பொருள் இருந்தாலும், இச்சூழலில் அது சபைத் தலைவர்களைக் குறிக்காமல் முந்தைய தலைமுறைகளில் வாழ்ந்த விசுவாசிகளைப் பொதுவாகக் குறிக்கிறது. ‘முற்காலத்தவர்கள்’ இந்தச் சூழல்பொருளை நவீன தமிழில் தவறான பதவிசார் எண்ணமின்றி வழங்குகிறது.
theological_decisions:
- issue: ταύτῃ என்பதன் சுட்டுப்பொருள்
  choice: இது 11:1-இல் கூறப்பட்ட விசுவாசத்தைக் குறிக்கிறது.
  alternative: இது விசுவாசத்தை மட்டும் அல்லாமல் 11:1-இல் விவரிக்கப்பட்ட முழு உண்மையையும் விரிவாகக் குறிக்கலாம்.
  rationale: பெண்பால் ஒருமை வடிவம் πίστις என்பதோடு இயல்பாகப் பொருந்துகிறது; அதிகாரத்தின் வாத ஓட்டமும் விசுவாசத்தையே மையமாகக் கொண்டுள்ளது. எனினும், ‘இதன் மூலமே’ என்று மொழிபெயர்ப்பதால் சுட்டுப்பொருள் சூழலிலிருந்து அறியப்படுவதோடு, மூலத்தின் மறைமுகத்தன்மையும் காக்கப்படுகிறது.
- issue: நற்சான்றை அளிப்பவர்
  choice: முதன்மை உரையில் சான்றளிப்பவர் வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
  alternative: ‘கடவுளிடமிருந்து நற்சான்று பெற்றார்கள்’ என்று வெளிப்படுத்தலாம்.
  rationale: இவ்வதிகாரத்தின் சூழல் கடவுளின் அங்கீகாரத்தை உணர்த்தினாலும், இவ்வசனத்தின் கிரேக்க உரையில் சான்றளிப்பவர் நேரடியாகப் பெயரிடப்படவில்லை. ஆகவே இறையியல் உட்கருத்தை உரைக்குள் கூடுதலாகச் சேர்க்காமல் செயப்பாட்டு அமைப்பு காக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத்தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மூப்பர்கள்’ என்பது இன்றைய வாசகர்களுக்கு சபைப் பதவியைக் குறிக்கக்கூடும் என்பதால், வரலாற்றுச் சூழலைத் தெளிவாகக் காட்டும் ‘முற்காலத்தவர்கள்’ தேர்ந்தெடுக்கப்பட்டது. மூன்று அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
