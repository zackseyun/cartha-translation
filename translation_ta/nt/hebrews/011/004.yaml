  text: Πίστει πλείονα θυσίαν Ἅβελ παρὰ Κάϊν προσήνεγκεν τῷ θεῷ, δι’ ἧς ἐμαρτυρήθη εἶναι δίκαιος, μαρτυροῦντος ἐπὶ τοῖς δώροις αὐτοῦ ⸂τοῦ θεοῦ⸃, καὶ δι’ αὐτῆς ἀποθανὼν ἔτι ⸀λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/004.yaml
  text: By faith Abel offered to God a better sacrifice than Cain[a], through which he was attested as righteous, God testifying concerning his gifts; and through it, though he died[d][c][b], he still speaks.
translation:
  language: ta
  text: விசுவாசத்தினால் ஆபேல், காயீன் செலுத்தியதைவிட மேலான பலியைக்[a] கடவுளுக்குச் செலுத்தினார். அந்தப் பலியின் மூலம் அவர் நீதிமான் எனச் சான்று பெற்றார்[b], கடவுள் அவருடைய காணிக்கைகளைப் பற்றி சாட்சி அளித்தபோது. அவர் இறந்திருந்தும், அதன் மூலமாக[c] இன்னும் பேசுகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மிகுதியான பலி” என்றும் மொழிபெயர்க்கலாம். கிரேக்க ஒப்பீட்டுச் சொல் பலியின் மேன்மையையோ அளவையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “அவர் நீதிமான் என்று நற்சான்று பெற்றார்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “அதன் மூலமாக” என்பது ஆபேலின் விசுவாசத்தையோ அவர் செலுத்திய பலியையோ குறிக்கக்கூடும்; கிரேக்க வாசகம் இதைத் தெளிவாக வரையறுக்கவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: Πίστει
  choice: விசுவாசத்தினால்
  rationale: கருவிப் பொருளுடைய வேற்றுமையை வெளிப்படுத்துகிறது; எபிரெயர் 11-ன் சூழலில் மனிதரின் நம்பிக்கையுள்ள பதிலைச் சுட்டும் ‘விசுவாசம்’ இயல்பான தேர்வு.
- source_word: πλείονα θυσίαν
  choice: மேலான பலி
  rationale: ஒப்பீட்டுச் சொல் தரத்தையோ அளவையோ குறிக்கலாம். சூழலில் தர மேன்மை இயல்பாகத் தோன்றுவதால் ‘மேலான’ முதன்மை உரையில் வைக்கப்பட்டு, அளவு சார்ந்த வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: παρὰ Κάϊν
  choice: காயீன் செலுத்தியதைவிட
  rationale: ஒப்பீட்டின் பொருள் ஆபேலின் பலிக்கும் காயீனின் பலிக்கும் இடையிலானது என்பதைத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: προσήνεγκεν τῷ θεῷ
  choice: கடவுளுக்குச் செலுத்தினார்
  rationale: பலியிடுதல் சார்ந்த προσφέρω வினையின் வழிபாட்டுச் சூழலை ‘செலுத்தினார்’ இயல்பாகக் கொண்டுவருகிறது.
- source_word: δι’ ἧς
  choice: அந்தப் பலியின் மூலம்
  rationale: பெண்பால் தொடர்புப்பெயர் உடனடி முன்னிலைச் சொல்லான θυσίαν என்பதையே இலக்கணரீதியாகச் சுட்டுவதால் இது வெளிப்படையாக மொழிபெயர்க்கப்படுகிறது.
- source_word: ἐμαρτυρήθη εἶναι δίκαιος
  choice: அவர் நீதிமான் எனச் சான்றுபெற்றார்
  rationale: μαρτυρέω என்பதின் சாட்சி/சான்று கருத்தைத் தக்கவைத்தபடி தமிழில் இயல்பான செயப்பாட்டுவினை வடிவத்தை வழங்குகிறது.
- source_word: μαρτυροῦντος ἐπὶ τοῖς δώροις αὐτοῦ τοῦ θεοῦ
  choice: கடவுளும் அவருடைய காணிக்கைகளைக் குறித்து சாட்சி அளித்தார்
  rationale: தனிநிலை உருபுத்தொடரை இயல்பான தமிழ்ச் சார்பு வாக்கியமாக மாற்றி, δῶρα என்பதின் பலியிடுதல் சார்ந்த பொருளை ‘காணிக்கைகள்’ என வழங்குகிறது.
- source_word: δι’ αὐτῆς
  choice: அதன் மூலமாக
  rationale: பெண்பால் சுட்டுப்பெயர் விசுவாசத்தையோ பலியையோ குறிக்கக்கூடிய உண்மையான தெளிவின்மையைத் தமிழ் சுட்டுப்பெயர் தக்கவைக்கிறது.
- source_word: ἀποθανὼν ἔτι λαλεῖ
  choice: அவர் இறந்திருந்தும் … இன்னும் பேசுகிறார்
  rationale: இறப்புக்கும் தொடரும் பேச்சுக்கும் இடையிலான எதிர்மறை உறவையும் நிகழ்காலத்தின் தொடர்ச்சியையும் இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: δι’ αὐτῆς என்பதன் குறிப்பு
  choice: ‘அதன் மூலமாக’ என்று தெளிவுபடுத்தாமல் வைக்கப்பட்டது
  alternative: ‘விசுவாசத்தின் மூலம்’ அல்லது ‘பலியின் மூலம்’
  rationale: அத்தியாயத்தின் கருப்பொருள் விசுவாசத்தைச் சுட்டலாம்; அருகிலுள்ள பெண்பால் முன்னிலைச்சொல் பலியைச் சுட்டலாம். மூலத்தின் உண்மையான தெளிவின்மை முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்படுகிறது.
- issue: ἐμαρτυρήθη என்பதின் வலிமை
  choice: ‘சான்றுபெற்றார்’
  alternative: ‘நற்சான்று பெற்றார்’ அல்லது ‘நீதிமான் என்று அறிவிக்கப்பட்டார்’
  rationale: எபிரெயர் 11 முழுவதிலும் வரும் சாட்சி மொழியைத் தக்கவைத்து, வெறும் பாராட்டு அல்லது முறையான நீதித்தீர்ப்பு என்ற கூடுதல் கருத்தைச் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், ஆனால் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘விசுவாசம்,’ ‘பலி,’ ‘நீதிமான்,’ ‘சாட்சி’ போன்ற மையச் சொற்கள் கருத்தியல் தொடர்ச்சிக்காகத் தக்கவைக்கப்பட்டுள்ளன.
