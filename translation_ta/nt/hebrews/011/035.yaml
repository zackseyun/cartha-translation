  text: ἔλαβον γυναῖκες ἐξ ἀναστάσεως τοὺς νεκροὺς αὐτῶν· ἄλλοι δὲ ἐτυμπανίσθησαν, οὐ προσδεξάμενοι τὴν ἀπολύτρωσιν, ἵνα κρείττονος ἀναστάσεως τύχωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/035.yaml
  text: Women received back their dead by resurrection[a]; but others were tortured, not accepting release[c][b], so that they might obtain a better resurrection.
translation:
  language: ta
  text: பெண்கள் உயிர்த்தெழுதலின் மூலம் தங்கள் இறந்தவர்களைத் திரும்பப் பெற்றார்கள். வேறு சிலரோ, மேன்மையான உயிர்த்தெழுதலை அடைவதற்காக விடுதலையை ஏற்றுக்கொள்ளாமல் சித்திரவதை செய்யப்பட்டார்கள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சித்திரவதை செய்யப்பட்டார்கள்” என்று மொழிபெயர்க்கப்பட்ட வினைச்சொல் கடுமையான உடல் வேதனையைக் குறிக்கிறது; அது முரசு போன்ற கருவியாலோ சட்டகத்திலோ அடித்து வதைத்தலோடு தொடர்புடையதாக இருக்கலாம். சரியான முறை உறுதியாகத் தெரியவில்லை.
    reason: cultural_note
  - marker: b
    text: “மேன்மையான உயிர்த்தெழுதல்” என்பது இவ்வசனத்தின் முதல் பகுதியில் இறந்தவர்கள் மீண்டும் இம்மரணத்திற்குரிய வாழ்வுக்கு வந்ததைக் காட்டிலும் மேம்பட்ட, மரணத்திற்கு அப்பாற்பட்ட உயிர்த்தெழுதல் நம்பிக்கையைக் குறிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: ἔλαβον
  choice: திரும்பப் பெற்றார்கள்
  rationale: இறந்த தங்களுடையவர்கள் உயிர்த்தெழுந்து அவர்களிடம் மீண்டும் கிடைத்தார்கள் என்ற சூழமைவுப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: γυναῖκες
  choice: பெண்கள்
  rationale: இங்கு பொதுவாகப் பெண்களைக் குறிக்கிறது; குறிப்பாக மனைவிகள் என்று வரையறுக்கத் தேவையில்லை.
- source_word: ἐξ ἀναστάσεως
  choice: உயிர்த்தெழுதலின் மூலம்
  rationale: ἐξ என்பதன் மூலாதார அல்லது வழிமுறைப் பொருளைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: τοὺς νεκροὺς αὐτῶν
  choice: இறந்துபோன தங்களுடையவர்களை
  rationale: அவர்களுக்குரிய, இறந்த நெருங்கியவர்களைக் குறிக்கும் இயல்பான தமிழாக்கம்.
- source_word: ἄλλοι δὲ
  choice: வேறு சிலரோ
  rationale: முந்தைய விடுவிப்புச் சம்பவங்களிலிருந்து துன்பத்தை ஏற்றவர்களிடம் நிகழும் முரண்பாட்டுத் திருப்பை -ஓ விகுதி உணர்த்துகிறது.
- source_word: ἐτυμπανίσθησαν
  choice: சித்திரவதை செய்யப்பட்டார்கள்
  rationale: கடுமையான உடல் வேதனையைத் தெரிவிக்கிறது; உறுதியாக அறிய முடியாத கருவியையோ முறையையோ தேவையின்றி குறிப்பதில்லை.
- source_word: οὐ προσδεξάμενοι
  choice: ஏற்றுக்கொள்ளாமல்
  rationale: தங்களுக்கு வழங்கப்பட்ட வாய்ப்பை அவர்கள் மறுத்தார்கள் என்ற பங்கேற்புவினையின் பொருளைத் தருகிறது.
- source_word: τὴν ἀπολύτρωσιν
  choice: விடுதலையை
  rationale: இச்சூழலில் சித்திரவதை அல்லது மரணத்திலிருந்து விடுவிக்கப்படுவதைக் குறிக்கிறது; மீட்பு குறித்த தனிப்பட்ட இறையியல் பொருளைத் திணிப்பதில்லை.
- source_word: ἵνα
  choice: அடைவதற்காக
  rationale: அவர்கள் விடுதலையை மறுத்ததன் நோக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: κρείττονος ἀναστάσεως
  choice: மேன்மையான உயிர்த்தெழுதலை
  rationale: Hebrews நூலில் κρείττων கொண்டுள்ள ஒப்பீட்டுப் பொருளைப் பேணுகிறது; முந்தைய உயிர்ப்பித்தலுக்கும் இதற்கும் உள்ள வேறுபாட்டைத் தெரிவிக்கிறது.
- source_word: τύχωσιν
  choice: அடைவதற்காக
  rationale: τυγχάνω என்பதன் பெறுதல் அல்லது அடைதல் என்ற பொருளை நோக்க அமைப்புடன் இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: இச்சூழலில் ἀπολύτρωσις என்பதன் பொருள்
  choice: சித்திரவதை அல்லது மரணத்திலிருந்து விடுதலை
  alternative: பரந்த இறையியல் பொருளிலான மீட்பு
  rationale: உடனடிச் சூழல், விசுவாசத்தை விட்டுக்கொடுத்து தப்பும் வாய்ப்பை மறுத்த துன்புறுத்தப்பட்டவர்களைப் பற்றியது. ‘விடுதலை’ என்பது சூழமைவுப் பொருளைக் காத்து, இங்கு வெளிப்படையாக இல்லாத பாவமீட்புக் கருத்தைத் திணிக்காமல் இருக்கிறது.
- issue: ‘மேன்மையான உயிர்த்தெழுதல்’ என்பதன் வலிமை
  choice: மரணத்திற்குப் பிந்தைய, முந்தைய தற்காலிக உயிர்ப்பித்தலைவிட மேன்மையான உயிர்த்தெழுதல் நம்பிக்கை
  alternative: முந்தைய எடுத்துக்காட்டுடன் தெளிவான ஒப்பீடு இல்லாத, வெறுமனே சிறப்பான உயிர்த்தெழுதல்
  rationale: வசனத்தின் முதல் பகுதி இறந்தவர்கள் இம்மரணத்திற்குரிய வாழ்வுக்குத் திரும்பியதைச் சொல்கிறது; இரண்டாம் பகுதி மரணத்தை எதிர்கொண்டவர்கள் நாடிய மேன்மையான உயிர்த்தெழுதலை அதனுடன் முரண்படுத்துகிறது. அதன் தன்மையை அளவுக்கு மீறி வரையறுக்காமல் அந்த இறையியல் அழுத்தத்தைப் பேணுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘உயிர்த்தெழுதல்,’ ‘விடுதலை,’ ‘சித்திரவதை’ ஆகியவை சாதாரண வாசகருக்குப் புரியும் நிலையான சொற்கள். கிரேக்கத்தின் இரண்டு மாறுபட்ட அனுபவங்களுக்கிடையிலான எதிர்மறைத் திருப்பு பேணப்பட்டுள்ளது.
