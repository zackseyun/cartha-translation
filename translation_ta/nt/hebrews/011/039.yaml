lexical_decisions:
- source_word: καὶ πάντες
  choice: இவர்கள் அனைவரும்
  rationale: πάντες முன்பு பட்டியலிடப்பட்ட விசுவாச முன்னோர்களைக் குறிக்கிறது; இயல்பான தமிழில் அதன் பின்னோக்கிய சுட்டுதலை ‘இவர்கள் அனைவரும்’ தெளிவாக வெளிப்படுத்துகிறது. καὶ இங்கு தொடர்ச்சியை இணைக்கிறது; தனியாக ‘மேலும்’ என்று மொழிபெயர்ப்பது தமிழில் தேவையற்றதாக இருப்பதால் வாக்கிய ஓட்டத்தில் உட்பொருளாக வைக்கப்பட்டுள்ளது.
- source_word: μαρτυρηθέντες
  choice: நற்சாட்சி பெற்ற
  rationale: இது μαρτυρέω என்பதன் இறந்தகாலச் செயப்பாட்டு வினையெச்சம்; இவர்கள் குறித்து சாதகமான சாட்சி அளிக்கப்பட்டது என்பதைச் சொல்கிறது. ‘நற்சாட்சி பெற்ற’ என்பது பாராட்டப்பட்டனர், அங்கீகாரம் பெற்றனர் என்ற பொருள் பரப்பைச் சுருக்காமல் காக்கிறது.
- source_word: διὰ τῆς πίστεως
  choice: விசுவாசத்தின் மூலம்
  rationale: διά + பிறப்புவேற்றுமை இங்கு கருவி அல்லது வழிமுறையைக் குறிக்கிறது. ‘விசுவாசத்தின் மூலம்’ என்பது அதனைத் தெளிவாகவும் எபிரெயர் 11-ன் தொடர்ச்சியான சொல்லாட்சிக்கு ஏற்றவாறும் தருகிறது.
- source_word: οὐκ ἐκομίσαντο
  choice: பெற்றுக்கொள்ளவில்லை
  rationale: கொமίζω என்பதன் இடைநிலை வடிவம் இங்கு வாக்குறுதியான ஒன்றைப் பெறுதல் அல்லது அடைதல் என்ற பொருளைக் கொண்டது. ‘பெற்றுக்கொள்ளவில்லை’ இயல்பான நவீனத் தமிழில் அந்தப் பொருளைத் தருகிறது.
- source_word: τὴν ἐπαγγελίαν
  choice: வாக்குத்தத்தத்தை
  rationale: கிரேக்கத்தில் ஒருமையிலும் குறிப்புச் சுட்டியுடனும் உள்ள சுருக்கமான இறையியல் சொல்லாட்சியைப் பாதுகாக்கிறது; ‘வாக்குத்தத்தத்தின் நிறைவேற்றம்’ என்று விளக்கி மொழிபெயர்த்து பொருளை முன்கூட்டியே தீர்மானிப்பதைத் தவிர்க்கிறது.
