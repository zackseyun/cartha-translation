  rationale: அத்தியாயம் முழுவதும் காணப்படும் சாட்சி என்ற கருத்தோட்டத்தைப் பேணுகிறது; சாட்சியளிப்பவர் தேவன் என்று சூழல் உணர்த்தினாலும், இங்கு கிரேக்கத்தில் வெளிப்படையாக இல்லாத எழுவாயை முதன்மை உரையில் சேர்க்கவில்லை.
