source:
  edition: SBLGNT
  text: Πίστει διέβησαν τὴν Ἐρυθρὰν Θάλασσαν ὡς διὰ ξηρᾶς ⸀γῆς, ἧς πεῖραν λαβόντες οἱ Αἰγύπτιοι κατεπόθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/029.yaml
  text: By faith they crossed the Red Sea as through dry land[a], of which the Egyptians, when they attempted it, were swallowed up.
translation:
  language: ta
  text: விசுவாசத்தினால் அவர்கள் செங்கடலை உலர்ந்த தரை வழியாகக் கடப்பதுபோல் கடந்து சென்றார்கள்.[a] அதைக் கடக்க முயன்ற எகிப்தியர்கள் விழுங்கப்பட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நாணல் கடல்.’ இங்குள்ள கிரேக்க மூலத்தில் ‘செங்கடல்’ (Ἐρυθρὰν Θάλασσαν) என்றே உள்ளது; ஆனால் யாத்திராகமத்தில் இடம்பெறும் எபிரேயப் பெயரைச் சிலர் ‘நாணல் கடல்’ என்று புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: விசுவாசத்தினால்
  rationale: கருவிப்பொருள் தரும் வேற்றுமையை வெளிப்படுத்துகிறது; எபிரெயர் 11 முழுவதும் திரும்பத் திரும்ப வரும் Πίστει என்ற மையச் சொல்லுக்கு இயல்பான, நிலைபெற்ற தமிழ் இணை.
- source_word: διέβησαν
  choice: கடந்து சென்றார்கள்
  rationale: ஒரு பக்கத்திலிருந்து மறுபக்கத்துக்குச் சென்ற நிகழ்வை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: τὴν Ἐρυθρὰν Θάλασσαν
  choice: செங்கடலை
  rationale: கிரேக்க மூலத்தில் உள்ள பெயரை நேரடியாகப் பிரதிபலிக்கிறது; யாத்திராகமத்தின் எபிரெய இடப்பெயரைச் சார்ந்த மாற்று புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ὡς διὰ ξηρᾶς γῆς
  choice: உலர்ந்த தரை வழியாக
  rationale: ὡς மற்றும் διά ஆகியவற்றின் ஒப்பீட்டு, வழிச் சார்ந்த பொருளைத் தமிழில் இயல்பாகக் கொண்டுவருகிறது.
- source_word: ἧς πεῖραν λαβόντες
  choice: அவ்வாறே கடக்க முயன்றபோது
  rationale: πεῖραν λαμβάνειν என்ற மரபுத்தொடரின் ‘முயற்சி செய்தல்’ என்னும் பொருளையும், முன்னர் கூறப்பட்ட அதே கடத்தலைச் சுட்டும் தொடர்பையும் தெளிவாகக் காக்கிறது.
- source_word: οἱ Αἰγύπτιοι
  choice: எகிப்தியர்கள்
  rationale: எகிப்தைச் சேர்ந்தவர்களைக் குறிக்கும் நேரடியான இன/தேசியப் பெயர்.
- source_word: κατεπόθησαν
  choice: விழுங்கப்பட்டார்கள்
  rationale: καταπίνω என்பதன் வலுவான ‘விழுங்கப்படுதல்’ உருவகத்தையும் இறப்புவினையையும் காக்கிறது; ‘மூழ்கடிக்கப்பட்டார்கள்’ என்பது நிகழ்வை விளக்கும் அதிகப் பொருளுரை.
theological_decisions:
- issue: எபிரெயர் 11-ல் πίστις என்பதன் மொழிபெயர்ப்பு
  choice: விசுவாசம்
  alternative: நம்பிக்கை / நம்பியிருத்தல்
  rationale: அத்தியாயம் முழுவதும் Πίστει என்ற தொடர் மையக் கருத்தாக வருகிறது. ‘விசுவாசம்’ அந்தத் தொடர்ச்சியையும் இறையியல் பதற்றத்தைத் தீர்மானித்து விடாமல் நம்பிக்கையால் செயல்படும் பொருளையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியுமாறு இயல்பாகவும், வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘விழுங்கப்பட்டார்கள்’ என்ற மூலத்தின் உயிருள்ள உருவகம் பாதுகாக்கப்பட்டது.
