source:
  edition: SBLGNT
  text: πίστει χρηματισθεὶς Νῶε περὶ τῶν μηδέπω βλεπομένων εὐλαβηθεὶς κατεσκεύασεν κιβωτὸν εἰς σωτηρίαν τοῦ οἴκου αὐτοῦ, δι’ ἧς κατέκρινεν τὸν κόσμον, καὶ τῆς κατὰ πίστιν δικαιοσύνης ἐγένετο κληρονόμος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/007.yaml
  text: By faith Noah[a], having been warned about things not yet seen, in reverent fear constructed an ark for the salvation of his household[d][c][b], through which he condemned the world and became heir of the righteousness according to faith.
translation:
  language: ta
  text: விசுவாசத்தினால் நோவா, இன்னும் காணப்படாதவற்றைக் குறித்து இறை எச்சரிப்பைப் பெற்று[a], பயபக்தியுடன்[b] தன் வீட்டாரின் மீட்புக்காக ஒரு பேழையைக் கட்டினார். அதன் மூலமாக[c] அவர் உலகத்தைக் குற்றவாளி எனத் தீர்ப்பிட்டு, விசுவாசத்தின்படியான நீதியின் வாரிசானார்[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இறைவனால் அறிவுறுத்தப்பட்டு” அல்லது “இறை எச்சரிக்கையைப் பெற்று.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பக்தியுள்ள அச்சத்தால் உந்தப்பட்டு.”
    reason: lexical_alternative
  - marker: c
    text: “அதன் மூலமாக” என்பது இலக்கண ரீதியில் பெரும்பாலும் பேழையைக் குறிக்கிறது; சிலர் இதை நோவாவின் விசுவாசத்தையோ, விசுவாசத்தால் பிறந்த அவரது கீழ்ப்படிதலையோ பரந்த விதத்தில் குறிப்பதாகப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: d
    text: “நீதி” என்பதற்கு “நீதிநிலை” என்றும் மொழிபெயர்க்கலாம்; இங்கு அது விசுவாசத்துடன் தொடர்புடைய, சுதந்தர உரிமையாகப் பெறப்படும் நீதிநிலையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: விசுவாசத்தினால்
  rationale: இது வழி அல்லது கருவியைக் குறிக்கும் வேற்றுமை உருபாகவும், எபிரெயர் 11 முழுவதும் திரும்ப வரும் கட்டமைப்பாகவும் உள்ளது; இங்கு நோவாவின் நம்பிக்கையுள்ள பதிலைச் சுட்டுகிறது.
- source_word: χρηματισθεὶς
  choice: இறை எச்சரிப்பைப் பெற்றபோது
  rationale: செயப்பாட்டு வினையெச்சம் இறைவனிடமிருந்து வந்த அறிவுறுத்தல் அல்லது எச்சரிப்பைப் பெறுவதைக் குறிக்கலாம். கிரேக்கத்தில் தேவன் நேரடியாகப் பெயரிடப்படாததால், 'இறை' என்பது செய்தியின் தன்மையைத் தெரிவிக்கிறது; தனி அடிக்குறிப்பில் மாற்றுப் பொருள்கள் தரப்படுகின்றன.
- source_word: περὶ τῶν μηδέπω βλεπομένων
  choice: அதுவரை காணப்படாதவற்றைக் குறித்து
  rationale: μηδέπω என்பதின் 'இன்னும்/அதுவரை இல்லை' என்ற காலநிலையையும், வரவிருந்த நிகழ்வுகள் கண்ணுக்குப் புலப்படாதிருந்ததையும் இயல்பான தமிழில் காக்கிறது.
- source_word: εὐλαβηθεὶς
  choice: பயபக்தியுடன்
  rationale: வெறும் அச்சமல்லாமல், இறை எச்சரிப்புக்கு மரியாதையும் அச்சமும் கலந்த பக்தியுள்ள மறுமொழியைச் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: κατεσκεύασεν
  choice: கட்டினார்
  rationale: பேழையைத் திட்டமிட்டு உருவாக்கிய செயலைச் சூழலுக்கேற்ற இயல்பான தமிழில் குறிக்கிறது.
- source_word: κιβωτὸν
  choice: ஒரு பேழையை
  rationale: நோவாவின் பெருவெள்ளக் கதையில் நிலைபெற்றுள்ள தமிழ்ச் சொல்லாகும்; சாதாரண பெட்டி என்ற பொருளை இங்கு தவிர்க்கிறது.
- source_word: εἰς σωτηρίαν τοῦ οἴκου αὐτοῦ
  choice: தன் வீட்டாரின் மீட்புக்காக
  rationale: σωτηρία இங்கு உடனடியான உயிர்காப்பு அல்லது மீட்பைக் குறிக்கிறது; οἶκος என்பது குடும்பம் மட்டுமல்ல, வீட்டாரை முழுமையாகக் குறிக்கக்கூடியதால் 'வீட்டார்' தேர்ந்தெடுக்கப்பட்டது.
- source_word: δι’ ἧς
  choice: அதன் மூலமாக
  rationale: பெண்பால் தொடர்புப்பெயர் அருகிலுள்ள κιβωτός என்ற பேழையையே இயல்பாகச் சுட்டுகிறது; இருப்பினும் விசுவாசம் அல்லது கீழ்ப்படிதலான செயல் என்ற பரந்த புரிதல் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: κατέκρινεν τὸν κόσμον
  choice: உலகத்தைக் கண்டனத்திற்குள்ளாக்கி
  rationale: நோவாவின் விசுவாசமுள்ள கீழ்ப்படிதல், நம்பாத உலகத்தின் குற்றநிலையை வெளிப்படுத்தியதைக் காட்டுகிறது; அவர் தனிப்பட்ட முறையில் இறுதித் தீர்ப்பளித்தார் என்ற மிகை உணர்வைத் தவிர்க்கிறது.
- source_word: τῆς κατὰ πίστιν δικαιοσύνης
  choice: விசுவாசத்தின்படியான நீதிக்கு
  rationale: κατά என்பதன் தொடர்பைத் தீர்மானமாக 'மூலம்' என மாற்றாமல் காக்கிறது; δικαιοσύνη என்பதற்கு இங்கு நிலைபெற்ற 'நீதி' பயன்படுத்தப்படுகிறது.
- source_word: ἐγένετο κληρονόμος
  choice: உரிமையாளரானார்
  rationale: κληρονόμος என்பதன் வாரிசுரிமை சார்ந்த விளைவு நிலையை இயல்பான தமிழில் தெரிவிக்கிறது; 'வாரிசானார்' என்பதும் சாத்தியம் என்றாலும், நீதியுடன் இணையும் இடத்தில் 'உரிமையாளர்' வாசிப்பிற்கு இயல்பாக உள்ளது.
theological_decisions:
- issue: χρηματισθεὶς என்பதில் செய்தியின் இறைமூலத்தை வெளிப்படுத்துதல்
  choice: இறை எச்சரிப்பைப் பெற்றபோது
  alternative: எச்சரிக்கப்பட்டபோது; இறைவனால் அறிவுறுத்தப்பட்டபோது
  rationale: இந்தச் செயப்பாட்டு வடிவம் இறைச்செய்தியைப் பெறுதலை வழக்கமாகக் குறிக்கிறது. ஆனால் மூலத்தில் தேவன் நேரடியாகப் பெயரிடப்படவில்லை; ஆகவே 'இறைவனால்' என்று செய்பவரைத் தெளிவாகச் சேர்க்காமல், செய்தியின் இறைத்தன்மையை மட்டும் காட்டுகிறது.
- issue: εὐλαβηθεὶς என்பதின் உணர்வு
  choice: பயபக்தியுடன்
  alternative: பக்தியுள்ள அச்சத்தால் உந்தப்பட்டு; எச்சரிக்கையுடன்
  rationale: இச்சொல் வெறும் பயத்தையோ முன்னெச்சரிக்கையையோ மட்டும் குறைக்காமல், இறைவனை மதிக்கும் அச்சத்தையும் அதனால் எழும் கீழ்ப்படிதலையும் ஒன்றாகக் காக்கிறது.
- issue: δι’ ἧς எதைச் சுட்டுகிறது
  choice: அதன் மூலமாக = பேழையின் மூலமாக
  alternative: விசுவாசத்தின் மூலமாக; நோவாவின் கீழ்ப்படிதலான செயலின் மூலமாக
  rationale: இலக்கண ரீதியில் பெண்பாலான அருகிலுள்ள κιβωτός என்பதே மிக இயல்பான முன்னிலைச் சொல். சூழல் விசுவாசத்தை வலியுறுத்துவதால் பரந்த மாற்றுப் புரிதல் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- issue: δικαιοσύνη என்பதன் மொழிபெயர்ப்பு
  choice: நீதி
  alternative: நீதிநிலை; நியாயம்
  rationale: விசுவாசத்துடனும் உரிமைப்பேற்றுடனும் இணையும் இச்சூழலில் உறவு மற்றும் ஏற்றுக்கொள்ளப்பட்ட நிலையை உள்ளடக்கும் 'நீதி' பொருத்தமானது; சமூக அல்லது நீதிமன்ற நியாயம் என்ற ஒரே கோணத்துக்கு உரையைச் சுருக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையில் அமைக்கப்பட்டது. 'பயபக்தி', 'பேழை', 'விசுவாசத்தின்படியான நீதி' ஆகியவை வேதாகமச் சூழலின் செறிவைக் காக்கும் அதே நேரத்தில் மிகப் பழமையான வாக்கிய அமைப்பைத் தவிர்க்கின்றன. எல்லா அடிக்குறிப்பு குறியீடுகளும் தொடர்புடைய சொற்றொடர்களின் உடனேயே முதன்மை உரையில் இடம்பெற்றுள்ளன.
