  text: Ἔστιν δὲ πίστις ἐλπιζομένων ὑπόστασις, πραγμάτων ἔλεγχος οὐ βλεπομένων·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/001.yaml
  text: Faith is the assurance of things hoped for[b][a], the proof of things not seen.
translation:
  language: ta
  text: விசுவாசம் என்பது எதிர்நோக்கப்படும் காரியங்களின் உறுதி[a], காணப்படாத காரியங்களின் சான்று[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘எதிர்நோக்கப்படும் காரியங்களின் உள்ளமை’ அல்லது ‘மெய்நிலை’.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘காணப்படாத காரியங்களின் ஆதாரம்’ அல்லது ‘அவற்றைக் குறித்த உறுதிப்பாடு’.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστις
  choice: விசுவாசம்
  rationale: இங்கு இது கடவுளின் வாக்குறுதிகளை நம்பி சார்ந்திருக்கும் நிலைப்பாட்டைக் குறிக்கிறது. தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள ‘விசுவாசம்’ என்ற சொல், ‘நம்பிக்கை’ என்று மொழிபெயர்த்தால் ἐλπιζομένων என்பதோடு ஏற்படக்கூடிய குழப்பத்தையும் தவிர்க்கிறது.
- source_word: ἐλπιζομένων
  choice: எதிர்நோக்குகிறவற்றின்
  rationale: இந்தப் பன்மைச் செயப்பாட்டு எச்சம் நம்பிக்கையோடு எதிர்பார்க்கப்படும் காரியங்களைக் குறிக்கிறது. தமிழில் இயல்பாகவும் சுருக்கமாகவும் அமைய இவ்வாறு தரப்பட்டுள்ளது.
- source_word: ὑπόστασις
  choice: உறுதி
  rationale: இச்சொல் ‘உறுதி’, ‘அடிப்படை’, ‘மெய்நிலை’ போன்ற பொருள்களை ஏற்கக்கூடியது. இச்சூழலில் விசுவாசம் தரும் நிச்சயத்தன்மையை ‘உறுதி’ இயல்பாக வெளிப்படுத்துகிறது; பொருளியல்சார் ஒரு தொழில்நுட்பக் கருத்தைத் தேவையின்றி திணிப்பதில்லை.
- source_word: πραγμάτων
  choice: வற்றின்
  rationale: πρᾶγμα என்பது காரியங்கள், பொருள்கள் அல்லது மெய்ம்மைகள் என்ற பரந்த பொருளுடையது. தமிழில் இரு இணையான சொற்றொடர்களிலும் ‘வற்றின்’ என்பது இயல்பாக அந்தப் பொதுத்தன்மையைப் பேணுகிறது.
- source_word: ἔλεγχος
  choice: சான்று
  rationale: ἔλεγχος என்பது சான்று, நிரூபணம் அல்லது அதனால் உண்டாகும் உறுதிப்பாடு ஆகிய பொருள்களை உடையது. ‘சான்று’ அதன் ஆதாரப்பூர்வ வலிமையைப் பேணுவதோடு, தமிழில் மிகைப்படுத்தாத இயல்பான சொல்லாக உள்ளது.
- source_word: οὐ βλεπομένων
  choice: காணப்படாதவற்றின்
  rationale: மூலத்தின் மறுப்பையும் நிகழ்காலச் செயப்பாட்டு வடிவத்தையும் நேரடியாகப் பேணி, கண்களுக்கு இப்போது புலப்படாத மெய்ம்மைகளைக் குறிக்கிறது.
- source_word: δὲ
  choice: தனி வார்த்தையாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ வலுவான முரண்பாட்டைக் காட்டாமல் மென்மையான உரைத்தொடர்பை ஏற்படுத்துகிறது. தமிழில் ‘இப்போது’, ‘ஆனால்’ போன்ற சொல்லைச் சேர்ப்பது தேவையற்ற கால அல்லது முரண்பாட்டுச் சாயலை உண்டாக்கலாம்; வாக்கியத் தொடர்ச்சியே அதன் பணியைச் செய்கிறது.
theological_decisions:
- issue: எபிரெயர் 11:1-இல் ὑπόστασις என்பதன் பொருள்
  choice: ‘உறுதி’ என்று மொழிபெயர்க்கப்பட்டது
  alternative: ‘அடிப்படை’ அல்லது ‘மெய்நிலை’
  rationale: அத்தியாயத்தின் அறிவுறுத்தல் சார்ந்த சூழலில், எதிர்நோக்கப்படுகிறவற்றைக் குறித்து விசுவாசம் அளிக்கும் நிச்சயத்தை ‘உறுதி’ தெளிவாகச் சொல்கிறது. அதேவேளையில், மூலச்சொல்லில் இருக்கக்கூடிய பொருண்மை சார்ந்த மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- issue: πίστις என்பதன் பொருள்
  choice: ‘விசுவாசம்’
  alternative: ‘நம்புதல்’ அல்லது ‘நம்பிக்கை’
  rationale: இங்கு கிறிஸ்துவின் விசுவாசத்தன்மை போன்ற இலக்கண இருமை இல்லை; கடவுளையும் அவருடைய வாக்குறுதிகளையும் நம்பும் மனிதரின் நிலைப்பாடே சூழலுக்குப் பொருந்துகிறது. ‘விசுவாசம்’ இந்தத் தெய்வவியல் சொல்லை நிலையாகக் காக்கிறது.
- issue: ἔλεγχος என்பதன் புறச்சான்று அல்லது அகஉறுதிப்பாடு சார்ந்த நுணுக்கம்
  choice: ‘சான்று’
  alternative: ‘நிரூபணம்’ அல்லது ‘உறுதிப்பாடு’
  rationale: மூலச்சொல் ஆதாரம்/நிரூபணம் மற்றும் அதனால் உருவாகும் உள்ளார்ந்த உறுதி ஆகிய இரு திசைகளையும் ஏற்கிறது. ‘சான்று’ புறச்சான்றின் வலிமையைத் தக்கவைத்தபடியே அளவுக்கு மீறிய தர்க்கரீதியான ‘முழு நிரூபணம்’ என்ற கருத்தைத் திணிக்காது.
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான, கண்ணியமான வரையறை வடிவம் பயன்படுத்தப்பட்டுள்ளது. ‘என்பது’ கிரேக்கத்தின் இணைப்புவினையை இயல்பாக வெளிப்படுத்துகிறது. இரு இணையான கூறுகளிலும் ‘வற்றின்’ என்ற அமைப்பு பேணப்பட்டுள்ளது; வாசகருக்கு அந்நியமாக ஒலிக்கும் அளவுக்கு சொற்படி மொழிபெயர்க்காமல், மூலத்தின் இறையியல் நெருக்கடியும் சொற்பொருள் இருமைகளும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
