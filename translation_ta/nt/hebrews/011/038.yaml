source:
  edition: SBLGNT
  text: ὧν οὐκ ἦν ἄξιος ὁ κόσμος ⸀ἐπὶ ἐρημίαις πλανώμενοι καὶ ὄρεσι καὶ σπηλαίοις καὶ ταῖς ὀπαῖς τῆς γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/038.yaml
  text: —of whom the world was not worthy—wandering in deserts and mountains[b][a], and caves and holes in the ground.
translation:
  language: ta
  text: —இவர்களுக்கு உலகம் தகுதியானதாய் இருக்கவில்லை—அவர்கள் பாலைநிலங்களிலும்[a] மலைகளிலும் குகைகளிலும் நிலத்திலுள்ள பொந்துகளிலும்[b] அலைந்து திரிந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வெறிச்சோடிய இடங்களிலும்.’
    reason: lexical_alternative
  - marker: b
    text: சொற்சொல்லாக, ‘பூமியின் துவாரங்களிலும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν
  choice: இவர்களுக்கு
  rationale: முந்தைய வசனத்தில் துன்புற்ற விசுவாசிகளைச் சுட்டும் பன்மை உறவுப்பெயரின் உடைமை வேற்றுமையைத் தமிழில் இயல்பான ‘இவர்களுக்கு’ என்ற வடிவில் தருகிறது; அடுத்து வரும் தகுதி மதிப்பீட்டோடு நேரடியாக இணைகிறது.
- source_word: οὐκ ἦν ἄξιος
  choice: தகுதியானதாக இருக்கவில்லை
  rationale: உலகம் இவர்களுக்குத் தகுதியற்றது என்ற வலுவான மதிப்பீட்டை இயல்பான தமிழில் தக்கவைக்கிறது; வெறும் பொருந்தாமை என்ற மென்மையான பொருளாக்கத்தைத் தவிர்க்கிறது.
- source_word: ὁ κόσμος
  choice: உலகம்
  rationale: இந்த உண்மையுள்ளவர்களைப் புறக்கணித்த மனித உலகம் அல்லது சமுதாயத்தை விரிவாகச் சுட்டும் வழக்கமான, இயல்பான மொழிபெயர்ப்பு.
- source_word: ἐπὶ ἐρημίαις
  choice: பாலைநிலங்களில்
  rationale: இங்கு ἐπί + இடவேற்றுமை அலைந்து திரிந்த இடத்தைக் குறிக்கிறது. ‘பாலைநிலங்கள்’ என்பது concrete ஆன, இன்றைய வாசகருக்கு எளிதில் புரியும் சொல்; ‘வெறிச்சோடிய இடங்கள்’ என்பதும் சாத்தியம்.
- source_word: πλανώμενοι
  choice: அலைந்து திரிந்தார்கள்
  rationale: நிலையான உறைவிடமின்றி இடம்பெயர்ந்து சென்ற நிலையைக் காட்டும் இயல்பான தமிழ் வினைத்தொடர்; கிரேக்கப் பங்கேற்புவினையை முழு வாக்கிய வினையாக மாற்றுவது தமிழில் தெளிவை அளிக்கிறது.
- source_word: ὄρεσι
  choice: மலைகளில்
  rationale: ὄρος என்பதன் நேரடியான, பொதுவாகப் புரியும் பொருள்.
- source_word: σπηλαίοις
  choice: குகைகளில்
  rationale: மறைவிடங்களின் பட்டியலில் வரும் σπήλαιον என்பதற்கான இயல்பான நவீனத் தமிழ் சொல்.
- source_word: ὀπαῖς τῆς γῆς
  choice: நிலத்திலுள்ள பொந்துகளில்
  rationale: நிலம் அல்லது பூமியிலுள்ள துளை, குழிவு, பிளவு போன்ற மறைவிடங்களைத் தமிழில் இயல்பாகவும் காட்சிப்படியாகவும் கூறுகிறது; சொற்சொல்லான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: ‘உலகம் இவர்களுக்குத் தகுதியானதாக இருக்கவில்லை’ என்பதன் சுட்டும் பொருளும் வலிமையும்
  choice: உண்மையுள்ள துன்புறுவோரின் மதிப்புக்கு மாறாக, அவர்களைப் புறக்கணித்த உலகத்தின் மீது கூறப்படும் அறநெறி மதிப்பீடாகத் தக்கவைக்கப்பட்டது.
  alternative: உண்மையுள்ளவர்களுக்கும் உலகத்திற்கும் இடையிலான பொருந்தாமையை மட்டும் குறிக்கும் நடுநிலையான கூற்று.
  rationale: கிரேக்க வாசகம் வெறும் சமூகப் பொருந்தாமையை அல்ல, வலுவான மதிப்பீட்டை வெளிப்படுத்துகிறது. வசனத்துக்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல் அந்த இறையியல் பதற்றம் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இடங்களின் தொடரை ஒரே ‘-இலும்’ அமைப்பில் வைத்து கிரேக்கப் பட்டியலின் ஓட்டம் பாதுகாக்கப்பட்டுள்ளது; இருபுற நீள்கோடுகள் நடுவிலுள்ள வலுவான மதிப்பீட்டை முன்னிறுத்துகின்றன.
