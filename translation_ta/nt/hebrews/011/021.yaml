  source_fidelity: 'முக்கிய உரை கிரேக்கத்தின் கூறுகளைப் பொதுவாகத் துல்லியமாகக் கொண்டுள்ளது: πίστει, மரணநிலை, யோசேப்பின் மகன்கள் ஒவ்வொருவரும், ஆசீர்வாதம், மற்றும் கோல் ஆகியவை பாதுகாக்கப்பட்டுள்ளன. ஆனால் προσεκύνησεν என்பதற்குச் செயப்படுபொருளாக மூலத்தில் வெளிப்படையாக இல்லாத ‘கடவுளை’ சேர்ப்பது விளக்கமளிக்கும் கூடுதலாகும். கோலுடனான உறவு குறித்த கிரேக்கத் தெளிவின்மையை முதன்மை உரையிலேயே இயன்றவரைத் திறந்தவாறு வைக்க வேண்டும்.'
