source:
  edition: SBLGNT
  text: πίστει Ἰακὼβ ἀποθνῄσκων ἕκαστον τῶν υἱῶν Ἰωσὴφ εὐλόγησεν, καὶ προσεκύνησεν ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/021.yaml
  text: By faith Jacob[a], as he was dying, blessed each of the sons of Joseph[b], and worshiped while leaning on the top of his staff.
translation:
  language: ta
  text: விசுவாசத்தினால் யாக்கோபு, தான் இறக்கும் தருவாயில், யோசேப்பின் மகன்கள் ஒவ்வொருவரையும் ஆசீர்வதித்து, தனது கோலின் உச்சியைச் சார்ந்தவாறு வழிபட்டார்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஆதியாகமம் 47:31-ன் எபிரெய உரையைப் பின்பற்றினால், “தனது படுக்கையின் தலைமாட்டின்மேல் குனிந்து வழிபட்டார்” என்றும் மொழிபெயர்க்கலாம். இங்கே உள்ள கிரேக்க உரை “கோல்” என்று வாசிக்கிறது.
    reason: textual_variant
  - marker: b
    text: அல்லது, “தனது கோலின் உச்சியை நோக்கி வழிபட்டார்.” இந்தச் சொற்றொடர் யாக்கோபின் உடல் நிலையைக் குறிப்பதாக இருக்கலாம்; அவர் வழிபட்ட பொருளைக் குறிப்பதாக அல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: விசுவாசத்தினால்
  rationale: எபிரெயர் 11-இல் செயல்கள் விசுவாசத்தின் வழியாக அல்லது விசுவாசத்தோடு செய்யப்படுவதை உணர்த்தும் கருவிப் பொருள் கொண்ட வேற்றுமையைப் பாதுகாக்கிறது.
- source_word: ἀποθνῄσκων
  choice: தான் இறக்கும் தருவாயில்
  rationale: முதன்மை வினைகளோடு ஒரே காலத்தில் நிகழும் செயலை இயல்பான தமிழில் எடுத்துரைக்கிறது; மரணம் நெருங்கிய நிலையையும் தெளிவாக்குகிறது.
- source_word: ἕκαστον τῶν υἱῶν Ἰωσὴφ
  choice: யோசேப்பின் மகன்கள் ஒவ்வொருவரையும்
  rationale: யோசேப்பின் இரு மகன்களும் தனித்தனியாக ஆசீர்வதிக்கப்பட்டனர் என்ற பகிர்ந்தளிக்கும் வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: εὐλόγησεν
  choice: ஆசீர்வதித்து
  rationale: ஆதியாகமப் பின்னணிக்கும் உடன்படிக்கை சார்ந்த ஆசீர்வாதச் செயலுக்கும் பொருத்தமான, வழக்கிலுள்ள தமிழ் சொல்.
- source_word: προσεκύνησεν
  choice: கடவுளை வழிபட்டார்
  rationale: இங்கு வெறும் உடல் வணக்கத்தைவிட இறைவனை நோக்கிய வழிபாடு பொருந்துகிறது. கிரேக்கத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லாதபோதும், கோலே வழிபாட்டின் பொருள் என்ற தவறான புரிதலைத் தவிர்க்க ‘கடவுளை’ சேர்க்கப்பட்டுள்ளது; மாற்றுச் சொற்றொடரின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ
  choice: தனது கோலின் உச்சியில் சாய்ந்தவாறு
  rationale: கிரேக்கச் சொற்றொடரின் இயல்பான உடல்நிலைப் பொருளைத் தமிழில் தருகிறது; கோலை நோக்கி அல்லது கோலை வழிபட்டார் என்று உணர்த்துவதைத் தவிர்க்கிறது.
theological_decisions:
- issue: இறுதி சொற்றொடரில் யாக்கோபின் வழிபாட்டுக்கும் கோலுக்கும் உள்ள தொடர்பு
  choice: யாக்கோபு தனது கோலின் உச்சியில் சாய்ந்தவாறு கடவுளை வழிபட்டார்.
  alternative: யாக்கோபு தனது கோலின் உச்சியை நோக்கி வழிபட்டார்; அல்லது ஆதியாகமம் 47:31-ன் எபிரெய உரைப்படி, தனது படுக்கையின் தலைமாட்டின்மேல் குனிந்து வழிபட்டார்.
  rationale: எபிரெயர் நூலின் கிரேக்க உரை ‘கோல்’ என்கிறது; ஆதியாகமத்தின் எபிரெய உரை ‘படுக்கை’ என வாசிக்கப்படுகிறது. முதன்மை மொழி உரைக்கு முன்னுரிமை கொடுத்து ‘கோல்’ முதன்மை உரையில் வைக்கப்படுகிறது; குறிப்பிடத்தக்க உரைமரபு வேறுபாடும் சொற்றொடரின் மாற்றுப் புரிதலும் அடிக்குறிப்புகளில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘விசுவாசம்,’ ‘ஆசீர்வதித்தல்,’ ‘வழிபடுதல்’ ஆகிய பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன. மூல கிரேக்கத்தின் தெளிவின்மையும் ஆதியாகம உரைமரபு வேறுபாடும் அடிக்குறிப்புகளில் வெளிப்படையாகக் கொடுக்கப்பட்டுள்ளன.
