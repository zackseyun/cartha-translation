source:
  edition: SBLGNT
  text: πίστει καὶ ⸂αὐτῇ Σάρρᾳ⸃ δύναμιν εἰς καταβολὴν σπέρματος ἔλαβεν καὶ παρὰ καιρὸν ⸀ἡλικίας, ἐπεὶ πιστὸν ἡγήσατο τὸν ἐπαγγειλάμενον·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/011.yaml
  text: By faith even Sarah herself received power to conceive offspring[a], even beyond the proper time of life, because she considered the one who had promised to be faithful.
translation:
  language: ta
  text: விசுவாசத்தினால் சாராளும்கூட, வயதுக்கேற்ற காலத்தைத் தாண்டியிருந்தபோதிலும், சந்ததியைப் பெறுவதற்கான ஆற்றலைப் பெற்றாள்[a]; ஏனெனில், வாக்குறுதி அளித்தவர் உண்மையுள்ளவர் என்று அவள் கருதினாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “விதையை இடுவதற்கான ஆற்றலைப் பெற்றாள்.” இக்கிரேக்கத் தொடர் வழக்கத்திற்கு மாறான ஒரு மரபுத்தொடர்; இச்சூழலில் அது சந்ததியைப் பெறுவதற்கான ஆற்றலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: விசுவாசத்தினால்
  rationale: எபிரெயர் 11 முழுவதிலும் திரும்பத் திரும்ப வரும் கருவி அல்லது வழிமுறையைக் குறிக்கும் தொடர் இது; நம்பிக்கையினால் நிகழ்ந்ததைத் தெளிவாகக் காட்டுகிறது.
- source_word: καὶ αὐτῇ Σάρρᾳ
  choice: சாராளேகூட
  rationale: καὶ என்பதும் வலியுறுத்தும் αὐτῇ என்பதும் சாராளை கூடுதல் மற்றும் குறிப்பிடத்தக்க எடுத்துக்காட்டாக முன்னிறுத்துகின்றன; ‘சாராளேகூட’ அந்த வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
- source_word: δύναμιν ... ἔλαβεν
  choice: ஆற்றலைப் பெற்றாள்
  rationale: கிரேக்கச் சொற்களின் ‘வல்லமை அல்லது திறனைப் பெற்றாள்’ என்ற நேரடியான பொருளையும் தமிழின் இயல்பான நடையையும் காக்கிறது.
- source_word: εἰς καταβολὴν σπέρματος
  choice: சந்ததியைக் கருவுறுவதற்கான
  rationale: இது வழக்கத்திற்கு மாறான கிரேக்க மரபுத்தொடர். இச்சூழலில் சாராள் சந்ததியைப் பெறுவதற்கான உடல் ஆற்றலைக் குறிக்கிறது; சொற்சொல்லான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: καὶ παρὰ καιρὸν ἡλικίας
  choice: வயதுக்குரிய காலம் கடந்திருந்தபோதிலும்
  rationale: παρά இங்கு இயல்பான எல்லையைக் கடந்ததையும், καιρός மற்றும் ἡλικία வயதுக்கேற்ற காலத்தையும் வாழ்க்கைப் பருவத்தையும் குறிக்கின்றன; மூலத்தில் இல்லாத விவரத்தைச் சேர்க்காமல் கருத்தைத் தருகிறது.
- source_word: ἐπεὶ
  choice: ஏனெனில்
  rationale: சாராள் ஆற்றலைப் பெற்றதற்கான காரணத்தை அறிமுகப்படுத்தும் தொடர்புச் சொல்லாகத் தெளிவாக அமைகிறது.
- source_word: πιστὸν
  choice: உண்மையுள்ளவர்
  rationale: வாக்குறுதி அளித்தவரின் நம்பத்தகுந்த குணத்தையும் வாக்கில் நிலைத்திருப்பதையும் இறையியல் மிகைப்படுத்தலின்றி வெளிப்படுத்துகிறது.
- source_word: ἡγήσατο
  choice: கருதினாள்
  rationale: மதிப்பிட்டு ஒரு முடிவுக்கு வருதல் என்ற வினையின் அறிவுசார் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: τὸν ἐπαγγειλάμενον
  choice: வாக்குறுதி அளித்தவர்
  rationale: கடவுளைக் குறிக்கும் பெயராக்கப்பட்ட பங்கேற்பு வினையைத் தெளிவாகவும் மரியாதையாகவும் மொழிபெயர்க்கிறது.
theological_decisions:
- issue: இலக்கண ரீதியாகக் கடினமான வாக்கியத்தில் செய்பவர் யார், செயல் என்ன என்பவை
  choice: சாராளே எழுவாய்; சந்ததியைக் கருவுறுவதற்கான ஆற்றலை அவள் பெற்றாள்.
  alternative: ஆபிரகாம் மறைமுகமாக அல்லது முதன்மையாகச் சம்பந்தப்பட்டவர்; அல்லது சாராள் ஒரு சந்ததி வழியை நிறுவுவதற்கான ஆற்றலைப் பெற்றாள்.
  rationale: இப்பாட வடிவத்தில் αὐτῇ Σάρρᾳ என்பது ἔλαβεν என்பதன் எழுவாயாக சாராளை இயல்பாகச் சுட்டுகிறது. καταβολὴ σπέρματος என்ற தொடர் சொற்சொல்லாக ஆண் சார்ந்த படிமத்தைத் தரக்கூடும்; இருப்பினும், வயதைக் கடந்த நிலையிலும் சாராளின் விசுவாசமும் அற்புதமான கருவுறுதலும் இங்கு மையமாக உள்ளன. உண்மையான சொற்றொடரின் வித்தியாசம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: கடவுளைக் குறிக்கும் πιστός என்பதன் மொழிபெயர்ப்பு
  choice: உண்மையுள்ளவர்
  alternative: நம்பத்தகுந்தவர்; நம்பிக்கைக்குரியவர்
  rationale: சாராளின் விசுவாசம் வாக்குறுதி அளித்தவரின் மாறாத நம்பகத்தன்மையில் நிலைத்திருந்ததை இது காட்டுகிறது. ‘உண்மையுள்ளவர்’ என்பது கூடுதல் கோட்பாட்டுக் கருத்தைச் சேர்க்காமல் அந்த இறையியல் கனத்தைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘சாராளேகூட’ மூலத்தின் வலியுறுத்தலைக் காக்கிறது; கடினமான கிரேக்க மரபுத்தொடரின் இயல்பான பொருள் முதன்மை உரையிலும் அதன் சொற்சொல்லான வடிவம் அடிக்குறிப்பிலும் தரப்பட்டுள்ளது.
