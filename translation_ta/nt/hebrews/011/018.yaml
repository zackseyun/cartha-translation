  text: to whom it was said[a], “In Isaac your offspring will be called,”
translation:
  language: ta
  text: அவரிடம், “ஈசாக்கின் வழியாக உனக்குரிய சந்ததி அழைக்கப்படும்” என்று சொல்லப்பட்டது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லாக: “ஈசாக்கில் உனக்குரிய வித்து அழைக்கப்படும்.” இங்கு “வித்து” என்பது கூட்டுப்பொருளில் சந்ததியைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ὃν
  choice: அவரிடம்
  rationale: πρός + உறவுப்பெயர் இங்கு முன்சூழலில் உள்ள ஆபிரகாமிடம் உரைக்கப்பட்டதைக் குறிக்கிறது. செயப்பாட்டு வினையுடன் ‘அவரிடம்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: ἐλαλήθη
  choice: சொல்லப்பட்டிருந்தது
  rationale: λαλέω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது; இந்த உரைக்கு முன்னரே கூறப்பட்டிருந்த வாக்குறுதியைத் தமிழில் இயல்பாகச் சுட்டுகிறது.
- source_word: ὅτι
  choice: என்று
  rationale: கூறப்பட்ட செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் ὅτι என்பதற்கு மேற்கோளுக்குப் பின் வரும் ‘என்று’ இயல்பான தமிழ்ச் சமம்.
- source_word: Ἐν Ἰσαὰκ
  choice: ஈசாக்கின் வழியாக
  rationale: ἐν என்பதன் இடப்பொருளை இயந்திரமாக ‘ஈசாக்கில்’ என்று தராமல், இங்கு நோக்கமாக உள்ள சந்ததி வழிமுறையைத் தெளிவாகவும் அளவுக்கு மீறிய விளக்கமின்றியும் தெரிவிக்கிறது.
- source_word: κληθήσεταί
  choice: அழைக்கப்படும்
  rationale: καλέω என்பதன் எதிர்காலச் செயப்பாட்டு வடிவத்தையும் ‘அழைத்தல்/பெயரிடுதல்’ என்ற சொற்பிணைப்பையும் பாதுகாக்கிறது.
- source_word: σοι
  choice: உனக்குரிய
  rationale: இங்குள்ள நான்காம் வேற்றுமை ஆபிரகாமுக்குரிய சந்ததியைச் சுட்டுகிறது; ‘உனக்குரிய’ என்பது அந்த உறவைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: σπέρμα
  choice: சந்ததி
  rationale: σπέρμα என்பதன் ஒருமை வடிவிலுள்ள கூட்டுப்பொருளை நவீனத் தமிழில் இயல்பாகக் கொண்டுவருகிறது; ‘வித்து’ என்பது சொற்சொல்லான மாற்று என்றாலும் இச்சூழலில் தெளிவு குறையும்.
theological_decisions:
- issue: ஈசாக்கின் வழியாக வரும் வாக்குறுதியின் சந்ததியை மொழிபெயர்த்தல்
  choice: ஈசாக்கின் வழியாக உனக்குரிய சந்ததி அழைக்கப்படும்
  alternative: ஈசாக்கில் உனக்கு வித்து அழைக்கப்படும்
  rationale: தேர்ந்த வடிவம் வாக்குறுதியின் மரபுவழி ஈசாக்கின் மூலமாக அடையாளப்படுத்தப்படுவதைத் தெரிவிக்கிறது; அதே நேரத்தில் ‘அழைக்கப்படும்’ என்ற செயப்பாட்டு வடிவத்தையும் σπέρμα என்பதன் கூட்டொருமையையும் தக்கவைக்கிறது. எந்தப் பிற்கால இறையியல் விளக்கத்தையும் வசனத்துக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், மரியாதைமிக்க தமிழ். இது முந்தைய வசனத்துடன் தொடரும் துணைவாக்கியம் என்பதால் ‘அவரிடம்’ என்று தொடங்குகிறது. மேற்கோளின் செயப்பாட்டு அமைப்பும் மூலத்தின் சுருக்கமும் காக்கப்பட்டுள்ளன.
