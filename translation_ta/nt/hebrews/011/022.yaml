  source_fidelity: முதன்மை உரல் πίστει என்பதற்கு «விசுவாசத்தினால்» என்பதையும், τελευτῶν என்பதன் வாழ்க்கை-இறுதிக் காலக் கருத்தையும், இஸ்ரவேலின் மகன்களின் எதிர்கால வெளியேற்றத்தையும், யோசேப்பின் எலும்புகளைப் பற்றிய ஆணையையும் நன்றாகப் பாதுகாக்கிறது. இருப்பினும் «தன் எலும்புகளைக் குறித்தும் கட்டளையிட்டார்» என்பது தமிழில் கட்டளையின் பொருள்/பெறுநர் தெளிவின்றி சற்றே முழுமையற்றதாக ஒலிக்கிறது. «அறிவுறுத்தினார்» மூலத்தின் ἐνετείλατο-வின் வழிகாட்டல்/ஆணை கருத்தை இயல்பாகத் தருகிறது.
  naturalness: «இஸ்ரவேலின் மகன்கள் வெளியேறப்போவதைக் குறிப்பிட்டார்» இயல்பானது; ஆனால் ἔξοδος என்ற பெயர்ச்சொல் கருத்தை நேரடியாகப் பிரதிபலிக்கும் «இஸ்ரவேலின் மகன்களின் வெளியேற்றத்தைக் குறிப்பிட்டார்» சிறந்தது. இரண்டாவது இணை வினைச்சொல்லை «தன் எலும்புகளைக் குறித்து அறிவுறுத்தினார்» என மாற்றுவது நவீனத் தரத்தமிழில் தெளிவாகவும் இயல்பாகவும் இருக்கும்.
