source:
  edition: SBLGNT
  text: πίστει Ἰωσὴφ τελευτῶν περὶ τῆς ἐξόδου τῶν υἱῶν Ἰσραὴλ ἐμνημόνευσεν, καὶ περὶ τῶν ὀστέων αὐτοῦ ἐνετείλατο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/022.yaml
  text: By faith Joseph, as he was nearing the end of his life, mentioned the exodus of the sons of Israel and gave instructions concerning his bones.
translation:
  language: ta
  text: விசுவாசத்தினால் யோசேப்பு, தன் வாழ்வின் முடிவை நெருங்கியபோது[a], இஸ்ரவேலின் மகன்களின் வெளியேற்றத்தைக் குறிப்பிட்டார்; தன் எலும்புகளைக் குறித்து அறிவுறுத்தினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர் இறந்துகொண்டிருந்தபோது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: விசுவாசத்தினால்
  rationale: எபிரெயர் 11 முழுவதும் திரும்பத் திரும்ப வரும் சொற்றொடருடன் ஒத்திசைந்து, செயல் எந்த விசுவாசத்தினால் நிகழ்ந்தது என்பதைச் சுட்டும் கருவிப்பொருள் வேற்றுமையை வெளிப்படுத்துகிறது.
- source_word: τελευτῶν
  choice: தன் வாழ்வின் முடிவை நெருங்கியபோது
  rationale: யோசேப்பு வாழ்வின் இறுதிக்கட்டத்தில் இருந்தபோது என்பதைக் கண்ணியமான, இயல்பான நவீன தமிழில் தெரிவிக்கிறது; ‘இறந்துகொண்டிருந்தபோது’ என்ற நேரடியான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: περὶ τῆς ἐξόδου
  choice: வெளியேறப்போவதைப்
  rationale: ἔξοδος குறிக்கும் எதிர்கால வெளியேற்றத்தை இயல்பான தமிழில் தெரிவிக்கிறது. கிரேக்கத்தில் எகிப்து வெளிப்படையாகக் குறிப்பிடப்படாததால் அதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: கிரேக்கத்தின் வெளிப்படையான குடும்பவழிச் சொல்லான ‘மகன்கள்’ என்பதைப் பாதுகாக்கிறது; பொதுவான ‘இஸ்ரவேலர்’ என்று தட்டையாக்கவில்லை.
- source_word: ἐμνημόνευσεν
  choice: குறிப்பிட்டு
  rationale: περί என்பதுடன் இவ்வினைச்சொல் மனத்தில் நினைத்ததை அல்ல, ஒன்றைப் பற்றிக் குறிப்பிட்டதை அல்லது பேசியதை குறிக்கிறது.
- source_word: ἐνετείλατο
  choice: கட்டளையிட்டார்
  rationale: யோசேப்பு தன் எலும்புகளைக் குறித்து அதிகாரப்பூர்வமாக அறிவுறுத்தியதை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: περὶ τῶν ὀστέων αὐτοῦ
  choice: தன் எலும்புகளைக் குறித்தும்
  rationale: மூலத்தின் தெளிவான ‘எலும்புகள்’ என்ற சொல்லைப் பொதுவான ‘உடல் எச்சங்கள்’ என்று மாற்றாமல் பாதுகாக்கிறது.
theological_decisions:
- issue: எபிரெயர் 11-இல் πίστις என்பதன் மொழிபெயர்ப்பு
  choice: விசுவாசம்
  alternative: நம்பிக்கை / உண்மைத்தன்மை
  rationale: இவ்வதிகாரத்தில் மீண்டும் வரும் πίστει என்ற அமைப்பு மூதாதையர்கள் செயல்பட்ட விசுவாசத்தை முன்னிறுத்துகிறது. ‘உண்மைத்தன்மை’ என்ற பொருள் சில சூழல்களில் சாத்தியமானாலும் இங்கு அது குறைவாகப் பொருந்துகிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘இஸ்ரவேலின் மகன்கள்’ மற்றும் ‘எலும்புகள்’ ஆகிய மூலத்தின் குறிப்பான சொற்கள் பாதுகாக்கப்பட்டுள்ளன; தேவையற்ற விளக்கச் சேர்க்கைகள் தவிர்க்கப்பட்டுள்ளன.
