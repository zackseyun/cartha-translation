- from: விசுவாசத்தினால் ஆபிரகாம் சோதிக்கப்பட்டபோது ஈசாக்கைப் பலியாகச் செலுத்தினார்; வாக்குறுதிகளை ஏற்றுக்கொண்ட அவரே தமது ஒரே தனித்துவமான மகனைப் பலியாகச் செலுத்திக்கொண்டிருந்தார்.[a]
  to: விசுவாசத்தினால் ஆபிரகாம் சோதிக்கப்பட்டபோது ஈசாக்கைப் பலியாகச் செலுத்தினார்; வாக்குறுதிகளைப் பெற்றவரான அவர் தமது தனித்துவமான மகனை[a]ப் பலியாகச் செலுத்திக்கொண்டிருந்தார்.
  rationale: The revision renders ἀναδεξάμενος as ‘பெற்றவரான,’ preserving its relation to Abraham without adding the nuance of acceptance. It replaces the redundant ‘ஒரே தனித்துவமான’ with ‘தனித்துவமான,’ which is a natural, contextually accurate rendering of μονογενῆ; the note preserves ‘only son’ and the traditional rendering as alternatives. The progressive Tamil verb retains the imperfective presentation of προσέφερεν, while the first verb remains simple past for προσενήνοχεν.
