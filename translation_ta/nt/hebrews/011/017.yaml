  text: Πίστει προσενήνοχεν Ἀβραὰμ τὸν Ἰσαὰκ πειραζόμενος, καὶ τὸν μονογενῆ προσέφερεν ὁ τὰς ἐπαγγελίας ἀναδεξάμενος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/017.yaml
  text: By faith Abraham[a], when he was being tested, offered up Isaac, and the one who had received the promises was offering up his one and only son,
translation:
  language: ta
  text: விசுவாசத்தினால் ஆபிரகாம் சோதிக்கப்பட்டபோது ஈசாக்கைப் பலியாகச் செலுத்தினார்; வாக்குறுதிகளைப் பெற்றவரான அவர் தமது தனித்துவமான மகனை[a]ப் பலியாகச் செலுத்திக்கொண்டிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தமது ஒரே மகனை.” கிரேக்கச் சொல் ஒப்பற்ற தனித்துவத்தை வலியுறுத்துகிறது; “ஒரேபேறான மகன்” என்பது மரபுவழி மொழிபெயர்ப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: விசுவாசத்தினால்
  rationale: கருவி அல்லது வழிமுறையைக் குறிக்கும் வேற்றுமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; அதிகாரம் முழுவதும் மீளும் சூத்திரத்திற்கும் ஏற்றது.
- source_word: προσενήνοχεν
  choice: பலியாகச் செலுத்தினார்
  rationale: προσφέρω என்பதன் பலிசார் வலிமையை வெளிப்படுத்துகிறது; கிரேக்க நிறைவுவினையின் நிகழ்வுச் சுருக்கப் பயன்பாட்டை தமிழில் இயல்பான இறந்தகாலமாகத் தருகிறது.
- source_word: πειραζόμενος
  choice: சோதிக்கப்பட்டபோது
  rationale: ஆபிரகாம் பாவத்திற்கு தூண்டப்பட்டார் என்று அல்லாமல், அவரது விசுவாசம் சோதிக்கப்பட்டது என்ற செயப்பாட்டு மற்றும் காலச்சூழல் பொருளைக் காக்கிறது.
- source_word: μονογενῆ
  choice: ஒரே தனித்துவமான மகனை
  rationale: ஈசாக்கு ஆபிரகாமின் ஒரே உயிரியல் மகன் என்று தவறாகக் கூறாமல், வாக்குறுதியின் அடிப்படையில் அவருக்கிருந்த ஒப்பற்ற தனித்துவத்தை வெளிப்படுத்துகிறது.
- source_word: προσέφερεν
  choice: பலியாகச் செலுத்திக்கொண்டிருந்தார்
  rationale: கிரேக்க இறந்தகாலத் தொடர்வினையின் நிறைவுறாத, நடந்துகொண்டிருந்த பார்வையைத் தமிழில் காக்கிறது; முந்தைய வினைவடிவத்துடனான வேறுபாட்டையும் காட்டுகிறது.
- source_word: ἀναδεξάμενος
  choice: ஏற்றுக்கொண்ட
  rationale: வாக்குறுதிகளைப் பெற்றதோடு அவற்றை வரவேற்று ஏற்றுக்கொண்டார் என்ற நடுவினைச் சாயலை இயல்பாகத் தருகிறது.
- source_word: ἐπαγγελίας
  choice: வாக்குறுதிகளை
  rationale: கிரேக்கப் பன்மையைப் பாதுகாத்து, ஆபிரகாமுக்குக் கொடுக்கப்பட்ட தேவ வாக்குறுதிகளின் தொகுப்பைக் குறிக்கிறது.
- source_word: καὶ
  choice: ; … அவரே
  rationale: இரண்டாம் கூற்றின் வலியுறுத்தலை இயல்பான தமிழில் இணைக்கிறது; கிரேக்க இணைப்பின் அடிப்படை தொடர்பை மாற்றவில்லை.
theological_decisions:
- issue: ஈசாக்கைக் குறிக்கும் μονογενῆ, ஆபிரகாமுக்கு வேறொரு உயிரியல் மகனும் இருந்த நிலையில் எவ்வாறு மொழிபெயர்க்கப்பட வேண்டும்?
  choice: ஒரே தனித்துவமான மகன்
  alternative: ஒரே மகன்; தனித்துவமான மகன்; ஒரேபேறான மகன்
  rationale: இது ஈசாக்கின் வாக்குறுதி சார்ந்த ஒப்பற்ற நிலையை வெளிப்படுத்தி, அவர் மட்டுமே ஆபிரகாமின் உயிரியல் மகன் என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது. ‘ஒரேபேறான’ என்பது இச்சூழலில் தேவையற்ற பிறப்பியல் அல்லது பிற்கால கிறிஸ்தியல் தொடர்புகளை ஏற்படுத்தக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘பலியாகச் செலுத்தினார்’ என்பது பலிசார் சூழலைத் தெளிவாக்குகிறது. முதல் வினைக்கு எளிய இறந்தகாலமும் இரண்டாவது வினைக்கு தொடர்நிலை இறந்தகாலமும் பயன்படுத்தப்பட்டு, மூலத்தின் வினைநோக்கு வேறுபாடு பாதுகாக்கப்பட்டுள்ளது.
