  text: διὸ καὶ ἀφ’ ἑνὸς ἐγεννήθησαν, καὶ ταῦτα νενεκρωμένου, καθὼς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει καὶ ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης ἡ ἀναρίθμητος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/012.yaml
  text: Therefore from one man[a], and this one as good as dead, descendants were born as numerous as the stars of heaven and as the innumerable sand by the seashore.
translation:
  language: ta
  text: ஆகவே, ஒரே மனிதரிடமிருந்து[a]—அவரும் இறந்தவரைப் போன்ற நிலையிலிருந்தபோதிலும்—வானத்து நட்சத்திரங்களைப் போல எண்ணிக்கையில் மிகுந்தவர்களாகவும், கடற்கரையோர மணலைப் போல எண்ணிக்கையற்றவர்களாகவும் சந்ததியினர் பிறந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்கு நெருக்கமாக, “ஒருவரிடமிருந்து, அதுவும் மரித்துப்போனவராய் இருந்த ஒருவரிடமிருந்து.” இது ஆபிரகாம் முதுமையால் இயல்பாகச் சந்ததி உண்டாக்கும் ஆற்றலை இழந்திருந்த நிலையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: ஆகவே
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட விசுவாசத்தையும் வாக்குறுதியையும் தொடர்ந்து வரும் முடிவை இயல்பாகக் குறிக்கிறது.
- source_word: ἀφ’ ἑνὸς
  choice: ஒரே மனிதரிடமிருந்து
  rationale: ஆண்பால் வடிவமும் சூழலும் ஆபிரகாமைக் குறிக்கின்றன; தமிழில் குறிப்பைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐγεννήθησαν
  choice: சந்ததியினர் பிறந்தார்கள்
  rationale: ஆபிரகாமிலிருந்து வந்த பின்வரிசையினரின் தோற்றத்தை இயல்பான தமிழில் தெரிவிக்கிறது; வெறும் ‘பிறந்தார்கள்’ என்பதில் மறைந்திருக்கும் எழுவாயையும் தெளிவாக்குகிறது.
- source_word: καὶ ταῦτα νενεκρωμένου
  choice: அவரும் இறந்தவரைப் போலவே ஆகிவிட்டிருந்தபோதிலும்
  rationale: நிகழ்காலத்தில் உண்மையாக இறந்தார் என்று கூறாமல், முதுமையால் பிள்ளைபெறும் திறனற்ற நிலையைச் சுட்டும் வலுவான மரண உருவகத்தைப் பாதுகாக்கிறது.
- source_word: καθὼς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει
  choice: வானத்தின் விண்மீன்களைப் போல எண்ணிக்கையில் திரளானவர்கள்
  rationale: விண்மீன்களுடனான ஒப்பீட்டையும் τῷ πλήθει என்பதிலுள்ள எண்ணிக்கை அல்லது பெருந்திரள் என்ற கருத்தையும் காக்கிறது.
- source_word: ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης ἡ ἀναρίθμητος
  choice: கடற்கரையிலுள்ள எண்ண முடியாத மணலைப் போலப் பலர்
  rationale: ‘கடலின் விளிம்பு’ என்ற சொற்றொடரை இயல்பான ‘கடற்கரை’ என வழங்கி, ἀναρίθμητος என்பதன் எண்ண இயலாமையையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘ஒருவரிடமிருந்து’ என்பவர் யார்?
  choice: ஆபிரகாமைக் குறிக்கும் வகையில் ‘ஒரே மனிதரிடமிருந்து’ என்று தெளிவுபடுத்தப்பட்டது.
  alternative: ‘ஒருவரிடமிருந்து’ என்று மட்டும் மொழிபெயர்த்து குறிப்பை மறைமுகமாக விடலாம்.
  rationale: கிரேக்க ஆண்பால் வடிவமும் உடனடியான சூழலும் ஆபிரகாமைச் சுட்டுகின்றன; பெயரை நேரடியாகச் சேர்க்காமல் பாலினத்தையும் குறிப்பையும் பாதுகாக்கிறது.
- issue: νενεκρωμένου என்பதன் மரண உருவகம்
  choice: உண்மையான மரணம் அல்லாமல், முதுமையால் பிள்ளைபெறும் ஆற்றல் இல்லாத நிலையை ‘இறந்தவரைப் போலவே’ என்ற உருவகத்துடன் வழங்கப்பட்டது.
  alternative: ‘உயிரற்றுப்போனவர்’ அல்லது ‘பிள்ளைபெறும் ஆற்றல் அற்றவர்’ என்று மொழிபெயர்க்கலாம்.
  rationale: முதல் மாற்று உண்மையான மரணத்தைத் தவறாக உணர்த்தக்கூடும்; இரண்டாவது மூலத்தின் வலுவான மரண உருவகத்தை முற்றிலும் விளக்கமாக மாற்றிவிடும். தேர்ந்த வடிவம் உருவகத்தையும் சூழல்சார் பொருளையும் இணைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. வாக்குறுதி மொழியின் உயர்ந்த தொனியைப் பேண ‘வானத்தின் விண்மீன்கள்’, ‘எண்ண முடியாத மணல்’ ஆகிய உருவகங்கள் நேரடியாக வைக்கப்பட்டுள்ளன.
