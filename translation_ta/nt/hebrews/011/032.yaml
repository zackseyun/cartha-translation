  yaml_path: translation/nt/hebrews/011/032.yaml
  text: And what more shall I say? For time would fail me if I were telling about Gideon[a], Barak, Samson, Jephthah, David, and also Samuel and the prophets,
translation:
  language: ta
  text: இன்னும் நான் என்ன சொல்வேன்? கிதியோன், பாராக், சிம்சோன், யெப்தா, தாவீது, மேலும் சாமுவேல் மற்றும் தீர்க்கதரிசிகளைப் பற்றி நான் விவரித்துச் சொல்லிக்கொண்டிருந்தால், எனக்கு நேரம் போதாது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லாக: “நான் விவரித்துச் சொல்லிக்கொண்டிருக்கையில், நேரம் எனக்குப் போதாமல் போய்விடும்...”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ τί ἔτι λέγω;
  choice: இன்னும் நான் என்ன சொல்வேன்?
  rationale: மேலும் பல எடுத்துக்காட்டுகள் இருந்தாலும் அவற்றை விரிவாகச் சொல்லாமல் சுருக்கப் போவதை உணர்த்தும் சொல்லாட்சிக் கேள்வியாக இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: ἐπιλείψει με γὰρ ... ὁ χρόνος
  choice: எனக்கு நேரம் போதாது
  rationale: ‘நேரம் என்னைக் கைவிடும்’ என்ற சொற்சொல் அமைப்பைத் தவிர்த்து, நேரம் போதாமையைச் சுட்டும் கிரேக்க மொழிவழக்கை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: διηγούμενον
  choice: நான் எடுத்துச் சொல்லப் போனால்
  rationale: தொடர்ந்து விரிவாக விவரிக்கும் சூழ்நிலையை உணர்த்தும் நிகழ்காலப் பெயரெச்சத்தின் தொடர்ச்சியையும் சொல்லாட்சிக்குரிய நிபந்தனைத் தன்மையையும் இவ்வமைப்பு தக்கவைக்கிறது.
- source_word: περὶ
  choice: பற்றி
  rationale: தொடர்ந்து வரும் நபர்கள் விவரிப்பின் பொருள் என்பதை இயல்பாகக் குறிக்கிறது.
- source_word: Γεδεών, Βαράκ, Σαμψών, Ἰεφθάε, Δαυίδ, Σαμουὴλ
  choice: கிதியோன், பாராக், சிம்சோன், யெப்தா, தாவீது, சாமுவேல்
  rationale: தமிழில் பரவலாக அறியப்பட்ட வேதாகமப் பெயர் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
- source_word: τε καὶ
  choice: மேலும்
  rationale: தாவீதுக்குப் பின் சாமுவேலைச் சற்றே கூட்டிச் சேர்க்கும் இணைப்பின் நுணுக்கத்தை மிகைப்படுத்தாமல் காட்டுகிறது.
- source_word: τῶν προφητῶν
  choice: தீர்க்கதரிசிகள்
  rationale: தீர்க்கதரிசனப் பணியாற்றியவர்களைக் குழுவாகக் குறிக்கும், தமிழில் பரவலாகப் புரிந்துகொள்ளப்படும் வேதாகமச் சொல்.
theological_decisions:
- issue: நேரம் போதாமையைச் சுட்டும் வாக்கியத்தின் சொல்லாட்சித் தன்மை
  choice: ஆசிரியர் எல்லா எடுத்துக்காட்டுகளையும் விரிவாகச் சொல்ல நேரம் போதாது என்று சொல்லாட்சிமுறையில் கூறுவதாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: ‘நேரம் எனக்குப் போதாமல் போய்விடும்’ என்ற நேரடியான எதிர்கால வடிவம்.
  rationale: எதிர்கால வினைச்சொல் இங்கு வெறும் கால முன்னறிவிப்பு அல்ல; பட்டியலைச் சுருக்குவதற்கான காரணத்தைத் தெரிவிக்கும் சொல்லாட்சிசார் செயல்பாட்டைக் கொண்டுள்ளது.
- issue: இறுதிப் பெயர்களின் இணைப்பும் தொகுப்பும்
  choice: ‘தாவீது, மேலும் சாமுவேல் மற்றும் தீர்க்கதரிசிகள்’ என்று சாமுவேலைத் தீர்க்கதரிசிகளின் பொதுக் குழுவிலிருந்து இலக்கணரீதியாக வேறுபடுத்தி, கூட்டிச் சேர்க்கும் நுணுக்கம் காக்கப்பட்டுள்ளது.
  alternative: ‘தாவீது, சாமுவேல், தீர்க்கதரிசிகள்’ என்று எல்லாவற்றையும் ஒரே தொடராக அமைத்தல்.
  rationale: τε καὶ என்பதன் கூட்டிச் சேர்க்கும் வலிமையைத் தக்கவைக்கிறது; அதேவேளை சாமுவேலின் பங்கைப் பற்றிய கூடுதல் இறையியல் முடிவை உரைக்குள் புகுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. சொல்லாட்சிக் கேள்வியின் வேகம், தொடர்ந்து விவரிப்பதைக் குறிக்கும் பெயரெச்சம், இறுதிப் பெயர்களின் கூட்டிச் சேர்க்கும் அமைப்பு ஆகியவை காக்கப்பட்டுள்ளன. [a] குறிப்பு அதனுடன் தொடர்புடைய ‘நேரம் போதாது’ என்ற தொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
