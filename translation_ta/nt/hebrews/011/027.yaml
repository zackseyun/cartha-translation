source:
  edition: SBLGNT
  text: πίστει κατέλιπεν Αἴγυπτον, μὴ φοβηθεὶς τὸν θυμὸν τοῦ βασιλέως, τὸν γὰρ ἀόρατον ὡς ὁρῶν ἐκαρτέρησεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/027.yaml
  text: By faith he left Egypt[a], not fearing the king’s anger[b], for he endured as seeing the One who is invisible.
translation:
  language: ta
  text: விசுவாசத்தினால் அவன் அரசனுடைய கோபத்திற்கு அஞ்சாமல் எகிப்தை விட்டு வெளியேறினான்.[a] ஏனெனில், கண்ணுக்குப் புலப்படாதவரைக் கண்டுகொண்டிருப்பதுபோல் அவன் உறுதியுடன் நிலைத்திருந்தான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இது மோசே பார்வோனிடமிருந்து தப்பிச் சென்றதை (யாத் 2) குறிக்கலாம்; அல்லது இஸ்ரயேலரோடு எகிப்திலிருந்து வெளியேறியதை (யாத் 12–14) குறிக்கலாம். கிரேக்கச் சொற்றொடர் எந்த நிகழ்வு என்பதைத் தெளிவாகக் குறிப்பிடவில்லை.
    reason: cross_reference
  - marker: b
    text: 'வேறு வகையில்: “காணப்படாதவரை.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: விசுவாசத்தினால்
  rationale: கருவி அல்லது செயல்முறையைக் குறிக்கும் வேற்றுமையை வெளிப்படுத்துகிறது; எபிரெயர் 11 முழுவதிலும் திரும்பத் திரும்ப வரும் சொற்றொடருடனும் ஒத்திருக்கிறது.
- source_word: κατέλιπεν Αἴγυπτον
  choice: எகிப்தைவிட்டு வெளியேறினான்
  rationale: καταλείπω என்பதன் இச்சூழலுக்குரிய ‘விட்டுச் செல்லுதல்’ என்ற பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; ‘கைவிட்டான்’ என மொழிபெயர்த்து தேவையற்ற எதிர்மறை நுண்பொருளைச் சேர்க்கவில்லை.
- source_word: μὴ φοβηθεὶς τὸν θυμὸν τοῦ βασιλέως
  choice: அரசனுடைய கோபத்துக்கு அஞ்சாமல்
  rationale: பங்கேற்புவினையின் உடனிகழ்ச்சி அல்லது செயன்முறைத் தொடர்பைப் பாதுகாக்கிறது; θυμός குறிக்கும் வலுவான கோபத்தை மிகைப்படுத்தாமல் இயல்பாகத் தருகிறது.
- source_word: τὸν ἀόρατον
  choice: காணமுடியாதவரை
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் ἀόρατος என்ற அடைமொழியின் தனிப்பட்ட சுட்டுதலை வெளிப்படுத்துகிறது; அடுத்து வரும் ‘காணுதல்’ என்பதுடனான முரண்நயத்தையும் காக்கிறது.
- source_word: ὡς ὁρῶν
  choice: கண்டுகொண்டிருப்பதுபோல்
  rationale: ὡς என்பதன் ஒப்புமைத் தன்மையையும் நிகழ்ந்துகொண்டிருக்கும் பார்வையை உணர்த்தும் நிகழ்காலப் பங்கேற்புவினையின் உயிரோட்டத்தையும் காக்கிறது.
- source_word: ἐκαρτέρησεν
  choice: உறுதியுடன் நிலைத்திருந்தான்
  rationale: καρτερέω குறிக்கும் உறுதியான சகிப்பையும் தொடர்ந்து நிலைத்திருப்பதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘எகிப்தைவிட்டு வெளியேறினான்’ என்பது மோசேயின் எந்த நிகழ்வைக் குறிக்கிறது?
  choice: மோசேயை எழுவாயாக வைத்தாலும், இது யாத்திராகமம் 2-இல் வரும் தப்பிச் சென்ற நிகழ்வா அல்லது யாத்திராகமம் 12–14-இல் வரும் இஸ்ரயேலின் வெளியேற்றமா என்பதை முதன்மை உரை தீர்மானிக்கவில்லை.
  alternative: இதை மோசே பார்வோனிடமிருந்து தப்பிச் சென்ற ஒரே நிகழ்வாகவோ, இஸ்ரயேலை வழிநடத்தி வெளியே கொண்டுவந்த ஒரே நிகழ்வாகவோ வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: கிரேக்க உரை ‘எகிப்தைவிட்டு வெளியேறினான்’ என்று மட்டுமே கூறுகிறது. விவாதிக்கப்படும் வரலாற்றுச் சுட்டுதலை மொழிபெயர்ப்பில் தீர்த்துவிடாமல், உரையின் உண்மையான தெளிவின்மையை அடிக்குறிப்பில் பாதுகாக்கிறது.
- issue: காணமுடியாதவரைக் ‘காணுதல்’ என்ற முரண்நயம்
  choice: ‘காணமுடியாதவரை கண்டுகொண்டிருப்பதுபோல்’ என்று முரண்நயத்தை நேரடியாகப் பாதுகாத்தல்.
  alternative: இதை ‘கடவுள்மீது நம்பிக்கை வைத்ததால்’ என்று விளக்கவுரைபோல் மாற்றுதல்.
  rationale: உரை கடவுளின் காணமுடியாத தன்மையையும் மோசேயின் விசுவாசப் பார்வையையும் பதற்றமுள்ள ஒரே படிமத்தில் இணைக்கிறது; அதனை விளக்கி நீக்காமல் அப்படியே காக்க வேண்டும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிதான நடை பயன்படுத்தப்பட்டுள்ளது. ‘விசுவாசத்தினால்’ என்பது அதிகாரத்தின் தொடர்ச்சியான வடிவமைப்பைத் தக்கவைக்கிறது. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறியீடுகளுக்கும் அவற்றின் உள்ளடக்கத்துக்கும் இடையே தெரியும் இடமாற்றம், கிரேக்க உரை மற்றும் குறிப்பின் பொருள் அடிப்படையில் தமிழில் சரிசெய்யப்பட்டுள்ளது.
