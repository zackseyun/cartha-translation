  source_fidelity: 'முதன்மை உரை கிரேக்கத்தின் வாக்கிய அமைப்பையும் பொருளையும் நன்றாகப் பின்பற்றுகிறது: πίστει-யின் கருவிப்பொருள், அரசனின் கோபத்திற்கு அஞ்சாமை, மற்றும் காணமுடியாதவரைக் காண்பதுபோல நிலைத்திருத்தல் ஆகியவை பாதுகாக்கப்பட்டுள்ளன. ஆனால் ‘காணமுடியாதவர்’ என்பது நவீனத் தமிழில் ‘பார்க்க முடியாதவர்’ (பார்வையற்றவர்) என்ற பொருளிலும் இயல்பாகப் புரியக்கூடியதால், ἀόρατος (‘கண்ணுக்குப் புலப்படாதவர்’) என்பதற்குத் துல்லியமான சொல் தேவைப்படுகிறது.'
