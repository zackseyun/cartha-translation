revisions:
- from: இவர்கள் எல்லாரும் விசுவாசத்தோடு இறந்தார்கள். வாக்குறுதிகளைப் பெற்றுக்கொள்ளாமலேயே, தொலைவிலிருந்து அவற்றைக் கண்டு வரவேற்று,[a] தாங்கள் பூமியில் அந்நியர்களும் தற்காலிகமாகக் குடியிருப்பவர்களுமாய் இருக்கிறோம் என்று ஒப்புக்கொண்டார்கள்.[b]
  to: இவர்கள் எல்லாரும் விசுவாசத்தில் இறந்தார்கள். வாக்குறுதிகளைப் பெறாமல், தொலைவிலிருந்து அவற்றைக் கண்டு வரவேற்று,[a] தாங்கள் பூமியில் அந்நியர்களும் தற்காலிகக் குடியிருப்பவர்களுமாக இருக்கிறவர்கள் என்று ஒப்புக்கொண்டார்கள்.[b]
  rationale: 'The revision makes three limited adjustments for source precision and fluent modern Tamil: ‘விசுவாசத்தில்’ for the state/sphere denoted by Κατὰ πίστιν, ‘பெறாமல்’ without added emphasis, and a clearer indirect confession clause. The participial sequence, plural ‘promises,’ figurative welcoming, and the present condition of being strangers and temporary residents remain intact. Footnote markers and their lexical functions are retained.'
