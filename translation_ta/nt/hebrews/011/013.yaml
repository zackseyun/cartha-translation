id: HEB.11.13
reference: Hebrews 11:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Κατὰ πίστιν ἀπέθανον οὗτοι πάντες, μὴ ⸀λαβόντες τὰς ἐπαγγελίας, ἀλλὰ πόρρωθεν αὐτὰς ἰδόντες καὶ ἀσπασάμενοι, καὶ ὁμολογήσαντες ὅτι ξένοι καὶ παρεπίδημοί εἰσιν ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/013.yaml
  text: All these died in faith[a], not having received the promises, but having seen them from afar and greeted them[c][b], and having confessed that they are strangers and exiles on the earth.
translation:
  language: ta
  text: இவர்கள் எல்லாரும் விசுவாசத்தில் இறந்தார்கள். வாக்குறுதிகளைப் பெறாமல், தொலைவிலிருந்து அவற்றைக் கண்டு வரவேற்று,[a] தாங்கள் பூமியில் அந்நியர்களும் தற்காலிகக் குடியிருப்பவர்களுமாக இருக்கிறவர்கள் என்று ஒப்புக்கொண்டார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வாழ்த்தி’ அல்லது ‘தழுவி’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினை வாழ்த்துதல் அல்லது வரவேற்றல் என்ற பொருள்களைக் கொண்டது; இங்கு தொலைவிலிருந்து காணப்பட்ட வாக்குறுதிகளைப் பற்றி உருவகமாகப் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘பரதேசிகள்’ அல்லது ‘வேற்றிடத்தில் தங்கியிருப்பவர்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ஓரிடத்தில் முழுமையான நிலையான சொந்தமின்றி வசிப்பவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ πίστιν
  choice: விசுவாசத்தோடு
  rationale: κατά + accusative இங்கு விசுவாசத்துக்கு இசைந்த நிலை அல்லது மனப்பாங்கைக் குறிக்கிறது. ‘விசுவாசத்தின்படி’ என்பதைக் காட்டிலும் ‘விசுவாசத்தோடு’ இயல்பான தமிழில் அவர்கள் இறந்தபோதும் நிலைத்திருந்த விசுவாச நிலையைத் தெரிவிக்கிறது.
- source_word: ἀπέθανον
  choice: இறந்தார்கள்
  rationale: வினையின் நேரடியான, மறைமுகமற்ற பொருளைத் தக்கவைக்கிறது.
- source_word: οὗτοι πάντες
  choice: இவர்கள் எல்லாரும்
  rationale: முன்பு குறிப்பிடப்பட்ட அனைவரையும் சுட்டும் demonstrative வலியுறுத்தலை இயல்பான தமிழில் காக்கிறது.
- source_word: μὴ λαβόντες τὰς ἐπαγγελίας
  choice: வாக்குறுதிகளைப் பெற்றுக்கொள்ளாமலேயே
  rationale: μή உடன் வரும் aorist participle-ஐ முதன்மை வினையோடு இணைத்து, அவர்கள் இறந்தபோது வாக்குறுதிகளை இன்னும் பெற்றிருக்கவில்லை என்ற தொடர்பைத் தெளிவாகக் காட்டுகிறது; பன்மையும் காக்கப்படுகிறது.
- source_word: πόρρωθεν αὐτὰς ἰδόντες
  choice: தொலைவிலிருந்து அவற்றைக் கண்டு
  rationale: இடவெளியை உருவகமாகப் பயன்படுத்தும் மூலப்படிமத்தைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: ἀσπασάμενοι
  choice: வரவேற்று
  rationale: வாக்குறுதிகளே செயப்படுபொருளாக இருப்பதால், ‘வாழ்த்தி’ என்பதைவிட ‘வரவேற்று’ என்பது உருவகமான ஏற்றுக்கொள்ளுதலை இயல்பாக வெளிப்படுத்துகிறது; ‘தழுவி’ என்பது கூடுதல் உணர்வைச் சேர்க்கலாம்.
- source_word: ὁμολογήσαντες
  choice: ஒப்புக்கொண்டார்கள்
  rationale: வெளிப்படையாக ஏற்றுக்கொண்டு அறிக்கையிடும் ὁμολογέω என்பதன் பொருளை சாதாரண நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ξένοι
  choice: அந்நியர்கள்
  rationale: ஒரு இடத்துக்குச் சொந்தமானவர்களாக இல்லாதவர்களின் சமூக நிலையைத் துல்லியமாகவும் பரவலாகப் புரியக்கூடிய வகையிலும் குறிக்கிறது.
- source_word: παρεπίδημοί
  choice: தற்காலிகமாகக் குடியிருப்பவர்கள்
  rationale: முழுமையான நிலையான சொந்தமோ குடியுரிமையோ இல்லாமல் ஓரிடத்தில் வசிப்பவர்களைக் குறிக்கிறது. ‘நாடுகடத்தப்பட்டவர்கள்’ என்பது மூலத்தில் கட்டாயமில்லாத வெளியேற்றத்தின் கருத்தைச் சேர்க்கும்.
- source_word: ἐπὶ τῆς γῆς
  choice: பூமியில்
  rationale: γῆ என்பதன் பரந்த மனித வாழ்விடப் பொருளை இச்சூழலில் காக்கிறது; குறிப்பிட்ட ஒரு நாட்டைக் குறிக்கும் ‘நிலத்தில்’ என்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: πίστις என்பதன் பொருள்
  choice: விசுவாசம்
  alternative: நம்பிக்கை / உண்மைத்தன்மை
  rationale: இங்கு முன்னோர்களின் நீடித்த நம்பிக்கையான நிலைப்பாட்டைக் குறிக்கிறது. ‘விசுவாசம்’ மூலச்சொல்லின் இறையியல் மற்றும் சூழல்சார் பரப்பைத் திறந்தவாறே வைக்கிறது; ‘உண்மைத்தன்மை’ என்று மாற்றுவது தேவையற்ற தீர்மானமாகிவிடும்.
- issue: ἀσπασάμενοι என்ற உருவக வினை
  choice: வரவேற்று
  alternative: வாழ்த்தி / தழுவி
  rationale: பெறப்படாத வாக்குறுதிகளைத் தொலைவிலிருந்து நேர்மறையாக ஏற்றுக்கொண்டார்கள் என்ற உருவகத்தை இயல்பான தமிழில் காக்கிறது; பிற சாத்தியமான நிழற்பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- issue: παρεπίδημοί குறிக்கும் குடியிருப்பு நிலை
  choice: தற்காலிகமாகக் குடியிருப்பவர்கள்
  alternative: பரதேசிகள் / நாடுகடத்தப்பட்டவர்கள்
  rationale: நிலையான சொந்தம் இல்லாமல் வசிப்பவர்களைக் குறிக்கும் சமூக நிலையைத் தெரிவிக்கிறது. கட்டாய நாடுகடத்தலை மூலவசனம் வெளிப்படையாகக் கூறாததால் அதை முதன்மை உரையில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் participial தொடர் தமிழில் இயல்பாகப் பாயுமாறு இணைக்கப்பட்டாலும், வாக்குறுதிகளைப் பெறாமை, தொலைவிலிருந்து காணுதல், வரவேற்றல், தங்கள் அந்நிய நிலையைக் கூறுதல் ஆகிய கருத்துகளின் வரிசை காக்கப்பட்டுள்ளது.
