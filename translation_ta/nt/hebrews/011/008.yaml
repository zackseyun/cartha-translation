id: HEB.11.8
reference: Hebrews 11:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀Πίστει καλούμενος Ἀβραὰμ ὑπήκουσεν ἐξελθεῖν εἰς ⸀τόπον ὃν ἤμελλεν λαμβάνειν εἰς κληρονομίαν, καὶ ἐξῆλθεν μὴ ἐπιστάμενος ποῦ ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/008.yaml
  text: By faith Abraham[a], when called, obeyed to go out to a place that he was going to receive as an inheritance, and he went out not knowing where he was going.
translation:
  language: ta
  text: விசுவாசத்தினால் ஆபிரகாம் அழைக்கப்பட்டபோது, தாம் உரிமையாகப் பெறவிருந்த ஓர் இடத்திற்குப் புறப்பட்டுச் செல்லக் கீழ்ப்படிந்தார். அவர் எங்கே செல்கிறார் என்பதை அறியாமலேயே புறப்பட்டுச் சென்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πίστει
  choice: விசுவாசத்தினால்
  rationale: கருவிப் பொருளுடைய வேற்றுமையை வெளிப்படுத்துகிறது; இச்சூழலில் ஆபிரகாமின் நம்பிக்கை சார்ந்த பதிலை ‘விசுவாசம்’ இயல்பாகக் குறிக்கிறது.
- source_word: καλούμενος
  choice: அழைக்கப்பட்டபோது
  rationale: ஆபிரகாமை விளக்கும் நிகழ்காலச் செயப்பாட்டு எச்சத்தின் காலச் சூழலை இயல்பான தமிழில் காட்டுகிறது; நிகழ்வுகளின் வரிசையை அளவுக்கு மீறி நிர்ணயிக்கவில்லை.
- source_word: ὑπήκουσεν ἐξελθεῖν
  choice: புறப்பட்டுச் செல்லக் கீழ்ப்படிந்தார்
  rationale: ‘கீழ்ப்படிந்தார்’ என்பது ὑπήκουσεν என்பதன் நேரடிப் பொருளைத் தருகிறது; நோக்க/நிறைவு வினையெச்சம் கிரேக்க வினை மற்றும் அதன் infinitive தொடர்பைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: τόπον
  choice: ஓர் இடத்திற்குப்
  rationale: குறிப்பிடப்படாத இலக்கைத் தரும் பெயர்ச்சொல்லின் பொருளை ‘ஓர் இடம்’ வெளிப்படுத்துகிறது.
- source_word: ἤμελλεν λαμβάνειν εἰς κληρονομίαν
  choice: தாம் உரிமையாகப் பெறவிருந்த
  rationale: μέλλω எதிர்கால எதிர்பார்ப்பைக் குறிக்கிறது; ‘பெறவிருந்த’ அதனை விதிநியமம் போன்ற கூடுதல் கருத்தின்றி தருகிறது. κληρονομία இங்கு சொத்துரிமையாகக் கிடைப்பதைக் குறிக்கிறது.
- source_word: ἐξῆλθεν
  choice: அவர் புறப்பட்டுச் சென்றார்
  rationale: முன்னுள்ள ἐξελθεῖν உடனான ஆசிரியரின் சொல்லிசை மீளுருவை ‘புறப்பட்டுச் செல்’ என்ற ஒரே வினைத்தொடரால் பாதுகாக்கிறது.
- source_word: μὴ ἐπιστάμενος ποῦ ἔρχεται
  choice: தாம் எங்கே செல்கிறோம் என்பதை அறியாமலேயே
  rationale: எதிர்மறை எச்சத்தின் உடனிகழ்வுப் பொருளை இயல்பாகத் தருகிறது; இலக்கை நோக்கிய இயக்கச் சூழலில் ἔρχεται என்பதற்கு ‘செல்கிறோம்’ பொருத்தமானது.
theological_decisions:
- issue: πίστις என்பதன் சூழல்சார் மொழிபெயர்ப்பு
  choice: விசுவாசம்
  alternative: நம்பிக்கை; உண்மைத்தன்மை
  rationale: இங்கு வலியுறுத்தப்படுவது அழைப்புக்கு ஆபிரகாம் சார்ந்து கீழ்ப்படிந்த பதில்; ஆகவே ‘விசுவாசம்’ பொருத்தமானது. ‘உண்மைத்தன்மை’ என்று மொழிபெயர்ப்பது இச்சூழலில் முதன்மையல்ல.
- issue: κληρονομία என்பதன் பொருள்
  choice: உரிமையாக
  alternative: சுதந்தரமாக; பரம்பரைச் சொத்தாக
  rationale: இடம் ஆபிரகாமுக்குக் கிடைக்கவிருந்த உரிமைச் சொத்தாகக் கூறப்படுகிறது. தமிழில் ‘சுதந்தரம்’ வேறு பொருளிலும் பொதுவாகப் பயன்படுவதால், ‘உரிமையாகப் பெறுதல்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கத்தில் ἐξελθεῖν/ἐξῆλθεν என வரும் மீளுருவை ‘புறப்பட்டுச் செல்ல/புறப்பட்டுச் சென்றார்’ என்று காத்துள்ளது. மரியாதை ஒருமைக்கேற்ப ‘தாம்… செல்கிறோம்’ பயன்படுத்தப்பட்டுள்ளது.
