  text: νῦν δὲ κρείττονος ὀρέγονται, τοῦτ’ ἔστιν ἐπουρανίου. διὸ οὐκ ἐπαισχύνεται αὐτοὺς ὁ θεὸς θεὸς ἐπικαλεῖσθαι αὐτῶν, ἡτοίμασεν γὰρ αὐτοῖς πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/016.yaml
  text: But as it is[a], they long for a better country—that is, a heavenly one. Therefore God is not ashamed to be called their God, for he has prepared a city for them.
translation:
  language: ta
  text: ஆனால் உண்மையில், அவர்கள் மேன்மையான ஒரு தாயகத்தை—அதாவது, பரலோகத்துக்குரிய தாயகத்தை—ஆவலுடன் நாடுகிறார்கள்.[a] ஆகவே, அவர்களுடைய கடவுள் என்று அழைக்கப்படுவதற்குக் கடவுள் வெட்கப்படுவதில்லை; ஏனெனில் அவர் அவர்களுக்காக ஒரு நகரத்தை ஆயத்தப்படுத்தியிருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மேன்மையான ஒரு நாட்டை’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் இவ்வசனத்தில் பெயர்ச்சொல் வெளிப்படையாக இல்லை; பெண்பால் பெயரடைகள் முந்தைய சூழலில் உள்ள ‘தாயகம்’ அல்லது ‘சொந்த நாடு’ என்ற கருத்தைச் சுட்டுகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: ஆனால் உண்மையில்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட சாத்தியத்துக்கு மாறாக, இங்கு நிலவும் உண்மையை அறிமுகப்படுத்தும் உரையாடல் இணைப்பாக வருகிறது; வெறும் காலப்பொருளான ‘இப்போதோ’ என்பதைக் காட்டிலும் ‘ஆனால் உண்மையில்’ சூழலின் தர்க்க மாறுபாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: κρείττονος
  choice: மேன்மையான
  rationale: ‘சிறந்தது, மேலானது’ என்ற ஒப்பீட்டுப் பொருளைத் தருகிறது. எபிரெயர் நூலில் திரும்பத் திரும்ப வரும் மேன்மை சார்ந்த ஒப்பீட்டையும் காக்கிறது.
- source_word: ὀρέγονται
  choice: ஆவலுடன் நாடுகிறார்கள்
  rationale: வெறும் விருப்பத்தை மட்டுமல்லாமல், ஒன்றை எட்ட விரும்பும் தீவிர ஏக்கத்தையும் முயற்சியையும் நடுவினை வடிவம் உணர்த்துகிறது.
- source_word: κρείττονος ... ἐπουρανίου
  choice: மேன்மையான ஒரு தாயகத்தை—அதாவது, பரலோகத்துக்குரிய தாயகத்தை
  rationale: கிரேக்கத்தில் பெயர்ச்சொல் வெளிப்படையாக இல்லாவிட்டாலும், பெண்பால் உருபுகள் முந்தைய சூழலிலுள்ள πατρίς என்பதைக் குறிக்கின்றன. தமிழில் ‘தாயகம்’ என்று நிரப்புவது கருத்தைத் தெளிவாக்குகிறது; இரண்டாம் இடத்திலும் பெயர்ச்சொல்லை மீண்டும் கூறுவது தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: διὸ
  choice: ஆகவே
  rationale: அவர்களின் பரலோகத் தாயக ஏக்கத்திலிருந்து கடவுளின் பதிலுக்குச் செல்லும் விளைவு அல்லது தீர்மானத் தொடர்பைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: οὐκ ἐπαισχύνεται
  choice: வெட்கப்படுவதில்லை
  rationale: மூல வினைச்சொல்லின் வெட்கம் மற்றும் மதிப்புக்குரிய உறவு சார்ந்த நுண்ணுணர்வை நேரடியாகக் காக்கிறது.
- source_word: θεὸς ἐπικαλεῖσθαι αὐτῶν
  choice: அவர்களுடைய கடவுள் என்று அழைக்கப்படுவதற்கு
  rationale: கடவுள் அவர்களோடு கொண்டுள்ள உறவைச் சுட்டும் பெயரிடும் வடிவத்தை விரிவுபடுத்தாமல் காக்கிறது; ‘அவருடைய மக்கள்’ போன்ற மூலத்தில் வெளிப்படையாக இல்லாத கருத்தைச் சேர்க்கவில்லை.
- source_word: ἡτοίμασεν
  choice: ஆயத்தப்படுத்தியிருக்கிறார்
  rationale: நிறைவேறிய செயலும் அதன் தற்போதைய பொருத்தமும் தமிழில் இயல்பாக வெளிப்படுகின்றன.
- source_word: πόλιν
  choice: ஒரு நகரத்தை
  rationale: உருபில்லாத கிரேக்கப் பெயர்ச்சொல்லின் இயல்பான தமிழாக்கம்; எபிரெயர் நூலில் தொடரும் முடிவுக்கால நகரப் படிமத்தையும் அப்படியே காக்கிறது.
theological_decisions:
- issue: κρείττονος மற்றும் ἐπουρανίου ஆகியவற்றுடன் மறைந்துள்ள பெயர்ச்சொல்
  choice: முந்தைய சூழலிலுள்ள πατρίς என்பதிலிருந்து ‘தாயகம்’ என்பதை நிரப்புதல்
  alternative: ‘நாடு’ என்று நிரப்புதல் அல்லது ‘மேன்மையான ஒன்றை’ என்று பெயர்ச்சொல்லை மறைமுகமாகவே விடுதல்
  rationale: கிரேக்கப் பெண்பால் வடிவங்கள் முந்தைய வசனச் சூழலிலுள்ள ‘தாயகம்/சொந்த நாடு’ என்ற கருத்தைத் தொடர்கின்றன. ‘தாயகம்’ உறவையும் சொந்த இடத்தையும் இயல்பாகச் சொல்கிறது; அடிக்குறிப்பில் ‘நாடு’ என்ற சாத்தியத்தையும் தருவது உண்மையான சொற்பொருள் வரம்பைக் காக்கிறது.
- issue: ‘அவர்களுடைய கடவுள்’ என்ற உடன்படிக்கை உறவு வாய்பாடு
  choice: உறவு வாய்பாட்டை விரிவுபடுத்தாமல் அப்படியே வைத்தல்
  alternative: ‘அவர்களைத் தமது மக்களாக ஏற்றுக்கொள்ள’ என்று விளக்கிச் சொல்லுதல்
  rationale: மூலம் கடவுள் ‘அவர்களுடைய கடவுள்’ என்று அழைக்கப்படுவதைத் தெளிவாகக் கூறுகிறது. தொடர்புடையதாக இருந்தாலும், ‘அவருடைய மக்கள்’ என்ற விரிவாக்கம் இவ்வசனத்தில் நேரடியாக இல்லை.
