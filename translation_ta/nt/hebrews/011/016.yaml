  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டுள்ளது. ‘பரலோகத்துக்குரிய’ என்பது ἐπουράνιος என்பதன் பெயரடைத் தன்மையைக் காக்கிறது; ‘ஆயத்தப்படுத்தியிருக்கிறார்’ நிறைவேறிய ஆயத்தத்தின் தற்போதைய பொருத்தத்தை இயல்பாக வெளிப்படுத்துகிறது.
