id: HEB.11.19
reference: Hebrews 11:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λογισάμενος ὅτι καὶ ἐκ νεκρῶν ἐγείρειν δυνατὸς ὁ θεός· ὅθεν αὐτὸν καὶ ἐν παραβολῇ ἐκομίσατο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/019.yaml
  text: having considered that God is able even to raise from the dead[a], from where, in a figure[b], he also received him back.
translation:
  language: ta
  text: இறந்தோரிலிருந்துகூட உயிர்த்தெழச் செய்ய கடவுளால் முடியும் என்று ஆபிரகாம் எண்ணினார்; எனவே[a], அவர் ஈசாக்கை உவமையாகத் திரும்பப் பெற்றார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதிலிருந்து.”
    reason: ὅθεν முந்திய கருத்திலிருந்து வரும் விளைவைச் சுட்டலாம்; அல்லது அதனுடன் தொடர்புடைய மூலம்/தொடக்கப் பொருளையும் சுட்டலாம்.
  - marker: b
    text: அல்லது, “ஒரு உவமையில்.” ஆபிரகாம் ஈசாக்கை உண்மையான உயிர்த்தெழுதலின் மூலம் அல்ல, மரணத்திலிருந்து திரும்பப் பெற்றதைப் போல மீண்டும் பெற்றார்.
    reason: ἐν παραβολῇ என்பதன் உருவக அல்லது ஒப்புமை சார்ந்த பொருளை விளக்குகிறது; குறிப்பிட்ட இறையியல் விளக்கத்தை நிர்ணயிக்கவில்லை.
lexical_decisions:
- source_word: λογισάμενος
  choice: எண்ணினார்
  rationale: ஆபிரகாமின் உள்ளார்ந்த சிந்தனை மற்றும் தீர்மானத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐκ νεκρῶν
  choice: இறந்தோரிலிருந்து
  rationale: உயிர்த்தெழுதல் குறித்த கிரேக்க மரபுத்தொடரின் இயல்பான தமிழ் வடிவம்; பன்மைத் தன்மையையும் காக்கிறது.
- source_word: ἐγείρειν
  choice: எழுப்ப
  rationale: இச்சூழலில் உயிர்த்தெழச் செய்வதைக் குறிக்கும் தெளிவான, வழக்கமான சொல்.
- source_word: δυνατὸς ὁ θεός
  choice: கடவுள் வல்லவர்
  rationale: கிரேக்கத்தின் நிகழ்காலப் பொதுக்கூற்றையும் கடவுளின் ஆற்றலையும் சுருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: ὅθεν
  choice: அதனால்
  rationale: முந்தைய சிந்தனையிலிருந்து விளையும் முடிவை இயல்பாக இணைக்கிறது; இதன் இடம்/மூலம் சார்ந்த மாற்று பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἐν παραβολῇ
  choice: உவமையான முறையில்
  rationale: ஈசாக்கு உண்மையில் உயிர்த்தெழுப்பப்படவில்லை என்றாலும், மரணத்திலிருந்து திரும்பப் பெற்றதற்கு ஒப்பான நிகழ்வு என்பதை வெளிப்படுத்துகிறது; 'அடையாளமாக' என்று கூறி குறிப்பிட்ட இறையியல் விளக்கத்தைத் திணிப்பதைத் தவிர்க்கிறது.
- source_word: ἐκομίσατο
  choice: திரும்பப் பெற்றார்
  rationale: பலியிடப்படவிருந்த ஈசாக்கை ஆபிரகாம் மீண்டும் பெற்றுக்கொண்டார் என்ற சூழல்சார் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: καὶ ἐκ νεκρῶν
  choice: இறந்தோரிலிருந்துகூட
  rationale: முதல் καὶ வலியுறுத்தும் பொருளில் இருப்பதால் 'கூட' என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: αὐτόν
  choice: ஈசாக்கை
  rationale: தமிழில் சுட்டுப்பெயரின் குறிப்பு தெளிவாக இருக்க, முந்தைய வசனத்தின் நபரான ஈசாக்கின் பெயர் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: ஈசாக்கைத் திரும்பப் பெற்றதன் தன்மை
  choice: உண்மையான உயிர்த்தெழுதல் அல்லாமல், உயிர்த்தெழுதலுக்கு ஒப்பான உவமை முறையிலான மீட்பாக மொழிபெயர்த்தல்
  alternative: முன்னடையாளமாக அல்லது அடையாளமாக அவர் ஈசாக்கைத் திரும்பப் பெற்றார்
  rationale: ἐν παραβολῇ என்பது ஒப்புமை, உருவகம் அல்லது முன்னடையாளம் ஆகிய நுணுக்கங்களுக்கு இடமளிக்கிறது. எனவே ஒரு குறிப்பிட்ட typological விளக்கத்தை மட்டும் நிர்ணயிக்காமல் கிரேக்கத்தின் இறையியல் இழுவையைப் பாதுகாக்கிறது.
- issue: ὅθεν என்பதன் தொடர்பு
  choice: காரணவிளைவு சார்ந்து 'அதனால்'
  alternative: மூலம்/இடம் சார்ந்து 'அங்கிருந்து'
  rationale: இரு வாசிப்புகளும் சாத்தியம். முதன்மை உரையில் தமிழ் வாக்கியத் தொடர்புக்கு இயல்பான inferential பொருள் தேர்ந்தெடுக்கப்பட்டு, மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. “கடவுள் வல்லவர்” என்பது வேதாகமச் செறிவைத் தக்கவைத்தாலும் இயல்பான தமிழ். இரண்டாம் வாக்கியத்தில் பெயரை வெளிப்படையாகச் சேர்த்தது தமிழில் சுட்டுப்பெயர் குழப்பத்தைத் தவிர்க்கிறது.
