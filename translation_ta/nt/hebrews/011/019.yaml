revisions:
- from: இறந்தோரிலிருந்துகூட எழுப்பக் கடவுள் வல்லவர் என்று ஆபிரகாம் எண்ணினார். அதனால்[a], உவமையான முறையில்[b] ஈசாக்கை அவர் திரும்பப் பெற்றார்.
  to: இறந்தோரிலிருந்துகூட உயிர்த்தெழச் செய்ய கடவுளால் முடியும் என்று ஆபிரகாம் எண்ணினார்; எனவே[a], அவர் ஈசாக்கை உவமையாகத் திரும்பப் பெற்றார்[b].
  rationale: The revision improves modern Tamil flow, explicitly retains the resurrection sense of ἐγείρειν, and renders ἐν παραβολῇ with a closer, more idiomatic adverbial expression. The revised notes retain the contextual ambiguity of ὅθεν and the figurative/analogical force of ἐν παραβολῇ without doctrinal overstatement.
