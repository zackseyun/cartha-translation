source:
  edition: SBLGNT
  text: χωρὶς δὲ πίστεως ἀδύνατον εὐαρεστῆσαι, πιστεῦσαι γὰρ δεῖ τὸν προσερχόμενον τῷ θεῷ ὅτι ἔστιν καὶ τοῖς ἐκζητοῦσιν αὐτὸν μισθαποδότης γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/006.yaml
  text: And without faith it is impossible to please him[c][b][a], for the one who comes to God must believe that he exists and that he is a rewarder of those who diligently seek him.
translation:
  language: ta
  text: விசுவாசம் இன்றிக் கடவுளைப் பிரியப்படுத்துவது இயலாது.[a] ஏனெனில், கடவுளிடம் வருகிறவர் அவர் இருக்கிறார் என்றும், தம்மை முயன்று தேடுகிறவர்களுக்குப் பலன் அளிப்பவராக இருக்கிறார் என்றும் நம்ப வேண்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விசுவாசம்’ என்பதற்கு ‘நம்பிக்கை’ என்றும் மொழிபெயர்க்கலாம்; சில சூழல்களில் கிரேக்கச் சொல் ‘உண்மைத்தன்மை’ என்ற பொருளையும் தரும். இங்கு அடுத்துவரும் விளக்கம் கடவுளை நம்புவதை மையப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘பலன் அளிப்பவராக விளங்குகிறார்’ என்றும், இன்னும் சொற்பட, ‘பலன் அளிப்பவராக ஆகிறார்’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்க வினை, கடவுள் தம்மைத் தேடுகிறவர்களுக்கு எப்படிப்பட்டவராகத் தெரியவருகிறார் என்பதைச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς δὲ πίστεως
  choice: விசுவாசம் இல்லாமல்
  rationale: χωρίς பிரிவையோ இல்லாமையையோ குறிக்கிறது; δέ இங்கு மென்மையான இணைப்புச் சொல் என்பதால் தமிழில் தனியே வெளிப்படுத்த வேண்டிய அவசியமில்லை. πίστις, உடனடி சூழலில் கடவுளை நம்புவதைக் குறித்தாலும், நிலைபெற்றதும் இயல்பானதுமான ‘விசுவாசம்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ἀδύνατον εὐαρεστῆσαι
  choice: அவருக்கு உகந்தவர்களாக இருப்பது இயலாது
  rationale: εὐαρεστέω என்பது ஒருவருக்குப் பிரியமாயிருத்தல் அல்லது உகந்தவராயிருத்தல். மறைமுகப் பொருள் உடனடி சூழலிலுள்ள கடவுளைக் குறிப்பதால் ‘அவருக்கு’ என்று வழங்கப்பட்டது; தமிழ் வாக்கியத்தில் பொதுவான மனிதக் குறிப்பை இயல்பாக வெளிப்படுத்த பன்மை பயன்படுத்தப்பட்டது.
- source_word: πιστεῦσαι γὰρ δεῖ
  choice: ஏனெனில் ... நம்ப வேண்டும்
  rationale: γάρ காரணத்தை அறிமுகப்படுத்துகிறது; δεῖ அவசியத்தைக் குறிக்கிறது. ‘நம்ப வேண்டும்’ இரண்டின் வலிமையையும் இயல்பான தமிழில் தருகிறது.
- source_word: τὸν προσερχόμενον τῷ θεῷ
  choice: கடவுளிடம் வருகிறவர்
  rationale: προσέρχομαι அணுகுதல் அல்லது நெருங்கி வருதல் என்ற இயக்கத்தைக் குறிக்கிறது. ‘கடவுளிடம் வருகிறவர்’ எளிமையான நவீன தமிழில் அதன் உறவுசார் இயக்கத்தைப் பாதுகாக்கிறது.
- source_word: ὅτι ἔστιν
  choice: அவர் இருக்கிறார்
  rationale: கிரேக்கத்தின் சுருக்கமான ἔστιν என்பதைத் தெளிவுபடுத்தாமல், அதன் இயல்பான ‘அவர் இருக்கிறார்’ என்ற வடிவிலேயே வைத்ததால் ‘அவர் உண்மையில் உள்ளார்’ அல்லது தத்துவ ரீதியான ‘அவர் இருப்பவர்’ என்ற மேலதிக விளக்கங்கள் திணிக்கப்படவில்லை.
- source_word: τοῖς ἐκζητοῦσιν αὐτὸν
  choice: தம்மை ஊக்கமாகத் தேடுகிறவர்களுக்கு
  rationale: ἐκζητέω சாதாரண தேடுதலைவிட முனைப்பான தேடுதலை உணர்த்தலாம். ‘ஊக்கமாகத் தேடுகிறவர்கள்’ அந்தத் தீவிரத்தை நவீன, புரிந்துகொள்ளக்கூடிய தமிழில் வெளிப்படுத்துகிறது.
- source_word: μισθαποδότης γίνεται
  choice: பலன் அளிப்பவராக விளங்குகிறார்
  rationale: μισθαποδότης பலனையோ கைம்மாறையோ வழங்குபவரைக் குறிக்கிறது. γίνεται என்பதன் சொற்பொருள் ‘ஆகிறார்’ என்றாலும், இங்கு கடவுளின் இயல்பு மாறுவதாகச் சொல்லாமல், தேடுகிறவர்களுக்கு அவர் எப்படிப்பட்டவராக அனுபவத்தில் தெரியவருகிறார் என்பதை ‘விளங்குகிறார்’ பாதுகாக்கிறது.
theological_decisions:
- issue: πίστις என்பதன் கருத்து
  choice: விசுவாசம்
  alternative: நம்பிக்கை; நம்பியிருத்தல்; உண்மைத்தன்மை
  rationale: இந்த வசனத்தின் அடுத்த சொற்றொடர் πιστεῦσαι (‘நம்ப வேண்டும்’) என்பதால், கடவுளை நம்பும் பதில் முதன்மையாக உள்ளது. ‘விசுவாசம்’ மரபாக அறியப்பட்டிருந்தாலும் நவீன தமிழிலும் புரியக்கூடியது; ‘உண்மைத்தன்மை’ என்பதை முதன்மை வாசகமாக்குவது இச்சூழலுக்கு ஏற்றதல்ல. மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- issue: ὅτι ἔστιν என்பதன் பொருள்
  choice: அவர் இருக்கிறார்
  alternative: அவர் உள்ளார்; அவர் உண்மையில் இருக்கிறார்
  rationale: கிரேக்கம் திட்டமிட்டுச் சுருக்கமாக உள்ளது. ‘இருக்கிறார்’ அதன் இருத்தல் சார்ந்த பொருளைப் பாதுகாக்கிறது; கூடுதல் தத்துவ விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: γίνεται கடவுளோடு தொடர்புபடுத்தப்படும் விதம்
  choice: பலன் அளிப்பவராக விளங்குகிறார்
  alternative: பலன் அளிப்பவராக ஆகிறார்; பலன் அளிப்பவராக இருக்கிறார்
  rationale: ‘ஆகிறார்’ என்பது கடவுளின் இயல்பில் மாற்றம் ஏற்படுகிறது என்ற தேவையற்ற எண்ணத்தைத் தரக்கூடும்; வெறும் ‘இருக்கிறார்’ கிரேக்க வினையின் இயக்கத்தைத் தட்டையாக்கும். ‘விளங்குகிறார்’ அவர் தம்மைத் தேடுகிறவர்களுக்குப் பலன் அளிப்பவராகத் தெரியவருகிறார் என்ற பதற்றத்தைக் காக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் வேதாகமத்திற்குரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘கடவுள்’, ‘விசுவாசம்’, ‘பலன் அளிப்பவர்’ ஆகியவை தெளிவான, பிரிவுசார் தனிச்சாய்வு இல்லாத சொற்களாகத் தேர்ந்தெடுக்கப்பட்டன. கிரேக்கத்தின் சுருக்கமும் γίνεται குறித்த இறையியல் பதற்றமும் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டன.
