source:
  edition: SBLGNT
  text: ἐξεδέχετο γὰρ τὴν τοὺς θεμελίους ἔχουσαν πόλιν, ἧς τεχνίτης καὶ δημιουργὸς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/010.yaml
  text: For he was waiting for the city that has foundations[b][a], whose architect and builder is God.
translation:
  language: ta
  text: ஏனெனில், அஸ்திவாரங்களைக் கொண்ட அந்த நகரத்தை[a] அவர் எதிர்பார்த்துக் காத்திருந்தார். அந்த நகரத்தின் வடிவமைப்பாளரும் கட்டியவரும் கடவுளே.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அஸ்திவாரங்களைக் கொண்ட நகரத்தை.’ ‘அஸ்திவாரங்கள்’ என்ற பன்மை அதன் நிலைப்புத்தன்மையையும் உறுதியையும் வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அந்த நகரத்தைத் திட்டமிட்டு உருவாக்கியவர் கடவுளே.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεδέχετο
  choice: எதிர்பார்த்துக் காத்திருந்தார்
  rationale: இறந்தகாலத்தில் தொடர்ந்து நீடித்த எதிர்பார்ப்பையும் பொறுமையான காத்திருப்பையும் imperfect வடிவம் உணர்த்துகிறது; தமிழில் இந்த இணைச்சொல் இரு நுணுக்கங்களையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் ஆபிரகாம் விசுவாசத்தால் கூடாரங்களில் வாழ்ந்ததற்கான விளக்கத்தை இவ்வசனம் தருகிறது.
- source_word: τοὺς θεμελίους ἔχουσαν πόλιν
  choice: அஸ்திவாரங்களைக் கொண்ட அந்த நகரத்தை
  rationale: ‘அஸ்திவாரங்களைக் கொண்ட நகரம்’ என்ற கிரேக்கப் பங்கேற்புத் தொடரையும் பன்மையையும் காக்கிறது; ‘அந்த’ என்பது குறிப்பிட்ட, எதிர்பார்க்கப்பட்ட நகரம் என்ற சுட்டுதலை இயல்பான தமிழில் தருகிறது.
- source_word: θεμελίους
  choice: அஸ்திவாரங்கள்
  rationale: கட்டுமான உருவகத்திற்குப் பொருத்தமான வழக்கமான சொல்; பன்மை நிலைத்தன்மையையும் உறுதியையும் வலியுறுத்தக்கூடும்.
- source_word: πόλιν
  choice: நகரம்
  rationale: πόλις என்பதற்கான இயல்பான, சூழலுக்குப் பொருத்தமான தமிழ் மொழிபெயர்ப்பு.
- source_word: ἧς
  choice: அந்த நகரத்தின்
  rationale: உறவுப்பெயரின் உடைமைத் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: τεχνίτης
  choice: வடிவமைப்பாளர்
  rationale: திறமைமிக்க கைவினைஞர் அல்லது திட்டமிடுபவர் என்ற பொருள் உள்ளது; δημιουργός என்பதிலிருந்து வேறுபடுத்தி, நகரத்தின் வடிவமைப்பை முன்னிறுத்துகிறது.
- source_word: δημιουργὸς
  choice: கட்டியவர்
  rationale: ஒரு நகரத்தைப் பற்றிய சூழலில் ‘உருவாக்கியவர்’ என்பதைவிட கட்டுமான உருவகத்தை நேரடியாகக் காக்கிறது; ‘வடிவமைப்பாளர்’ என்பதுடன் இயல்பாக இணைகிறது.
- source_word: ὁ θεός
  choice: கடவுளே
  rationale: கடவுள்தான் வடிவமைப்பாளரும் கட்டியவரும் என்பதை வலியுறுத்தும் பயனிலை அமைப்பை ‘ஏ’ விகுதி இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: வாக்குறுதி அளிக்கப்பட்ட நகரத்தின் இயல்பு
  choice: ‘அஸ்திவாரங்களைக் கொண்ட அந்த நகரம்’ என்று மட்டும் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘பரலோக நகரம்’ அல்லது ‘நிலையான அஸ்திவாரங்களைக் கொண்ட நகரம்’
  rationale: இவ்வசனம் நகரத்தை வெளிப்படையாக ‘பரலோக நகரம்’ என்று பெயரிடாமல், அதன் அஸ்திவாரங்களாலும் கடவுளே அதன் வடிவமைப்பாளரும் கட்டியவரும் என்பதாலும் அடையாளப்படுத்துகிறது. அருகிலுள்ள வசனங்களின் விரிவான இறையியல் அடையாளத்தை இங்கே சேர்க்காமல் மூலத்தின் உருவகத்தையும் திறந்த தன்மையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. ‘எதிர்பார்த்துக் காத்திருந்தார்’ என்பது நீடித்த எதிர்பார்ப்பை வெளிப்படுத்துகிறது; ‘அஸ்திவாரங்கள்’ என்ற பன்மையும் வடிவமைப்பு–கட்டுதல் என்ற இரட்டை உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
