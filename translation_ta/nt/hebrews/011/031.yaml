    issue: ‘சமாதானத்துடன் வரவேற்றாள்’ என்பதன் தெளிவின்மை
    rationale: μετ’ εἰρήνης ராகாபின் ஏற்றுக்கொள்ளும் முறையைச் சுட்டுகிறது (‘peacefully/in peace’). ‘வேவுகாரர்களைச் சமாதானத்துடன்’ என்ற தமிழ் அமைப்பு, அவர்களுடன் சமாதான உறவில் இருந்தாள் என்ற வேறுபட்ட தொடர்புப் பொருளைத் தரலாம். ‘அமைதியாக வரவேற்றாள்’ முறைப்பொருளைத் தெளிவாக்குகிறது.
