review_pass:
  verdict: revise
  source_fidelity: 'மூலக் கிரேக்கத்தின் முக்கிய கூறுகள் பெரும்பாலும் காக்கப்பட்டுள்ளன: πίστει ‘விசுவாசத்தினால்’, πόρνη ‘விலைமகள்’, συναπώλετο-வின் ‘சேர்ந்து அழிதல்’, ἀπειθήσασιν-ன் கீழ்ப்படியாமை, κατάσκοποι ‘வேவுகாரர்’ ஆகியவை பொருத்தமானவை. ஆனால் μετ’ εἰρήνης என்பது ராகாப் வேவுகாரர்களை ஏற்றுக்கொண்ட முறையைக் குறிக்கிறது; தமிழில் ‘சமாதானத்துடன் வரவேற்றாள்’ என்றால் வேவுகாரர்களுடன் பரஸ்பர சமாதானம் இருந்தது எனப் பொருள்படும் வாய்ப்பு உள்ளது. ‘அமைதியாக வரவேற்றாள்’ என்பது முறைப்பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.'
  naturalness: வாக்கியம் நவீன தரத் தமிழில் பொதுவாக இயல்பாக உள்ளது. ஆயினும் ‘வரவேற்றிருந்தாள்’ தேவையற்ற முன்னிறந்தகால நிழலைச் சேர்க்கிறது; கிரேக்க அஓரிஸ்ட் வினையெச்சத்திற்கு ‘வரவேற்றாள்’ போதுமானது. ‘சமாதானத்துடன்’ என்பதற்குப் பதில் ‘அமைதியாக’ வாசிப்பில் தெளிவானது.
  terminology: ‘விசுவாசம்’, ‘விலைமகள்’, ‘ராகாப்’, ‘வேவுகாரர்கள்’ ஆகிய சொற்கள் நிலையான, புரியக்கூடிய தேர்வுகள். ‘கீழ்ப்படியாதவர்கள்’ ἀπειθήσασιν-க்கு ஏற்றது. ‘அமைதியாக’ μετ’ εἰρήνης-ன் முறைக் கருத்தைத் துல்லியமாகக் காட்டுகிறது; அடிக்குறிப்பில் ‘சமாதானத்துடன்’ என்ற சொல்லாட்சி மாற்றாகத் தக்கவைக்கப்படுகிறது.
  issues:
