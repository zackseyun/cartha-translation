revisions:
- from: விசுவாசத்தினால், விலைமகளான ராகாப் கீழ்ப்படியாதவர்களுடன் சேர்ந்து அழிந்துபோகவில்லை.[a] ஏனெனில், அவள் வேவுகாரர்களைச் சமாதானத்துடன் வரவேற்றிருந்தாள்.[b]
  to: விசுவாசத்தினால், விலைமகளான ராகாப் கீழ்ப்படியாதவர்களுடன் சேர்ந்து அழிந்துபோகவில்லை. ஏனெனில், அவள் வேவுகாரர்களை அமைதியாக வரவேற்றாள்.[a]
  rationale: மூலத்தின் பொருளை மாற்றாமல், μετ’ εἰρήνης-ன் முறைப்பொருளை நவீன தமிழில் தெளிவாக்க ‘அமைதியாக’ எனத் திருத்தப்பட்டது. அஓரிஸ்ட் வினையெச்சத்துக்கு இயல்பான தமிழ் இறந்தகாலமாக ‘வரவேற்றாள்’ பயன்படுத்தப்பட்டது. முதன்மை உரையில் உள்ள தேவையற்ற [a] அடிக்குறிப்பு நீக்கப்பட்டு, பயனுள்ள வினையெச்ச/சொல்லாட்சி மாற்று மட்டும் ஒரே அடிக்குறிப்பாக வைக்கப்பட்டது.
