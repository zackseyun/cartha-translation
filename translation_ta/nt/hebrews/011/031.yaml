id: HEB.11.31
reference: Hebrews 11:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πίστει Ῥαὰβ ἡ πόρνη οὐ συναπώλετο τοῖς ἀπειθήσασιν, δεξαμένη τοὺς κατασκόπους μετ’ εἰρήνης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/031.yaml
  text: By faith Rahab the prostitute did not perish with those who were disobedient[b][a], because she had welcomed the spies in peace.
translation:
  language: ta
  text: விசுவாசத்தினால், விலைமகளான ராகாப் கீழ்ப்படியாதவர்களுடன் சேர்ந்து அழிந்துபோகவில்லை. ஏனெனில், அவள் வேவுகாரர்களை அமைதியாக வரவேற்றாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வேவுகாரர்களைச் சமாதானத்துடன் வரவேற்று.” கிரேக்கத்தில் இது வினையெச்சத் தொடர்; காரணத்தையோ உடனிகழ்ந்த சூழலையோ குறிக்கலாம்.
    reason: δεξαμένη என்ற வினையெச்சத்தின் தர்க்கத் தொடர்பையும் μετ’ εἰρήνης என்பதற்கான சொல்லாட்சி மாற்றையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: πίστει
  choice: விசுவாசத்தினால்
  rationale: கருவி அல்லது வழிமுறையைக் குறிக்கும் வேற்றுமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; எபிரெயர் 11-இல் திரும்பத் திரும்ப வரும் விசுவாச முன்மாதிரி அமைப்பையும் காக்கிறது.
- source_word: Ῥαὰβ
  choice: ராகாப்
  rationale: தனிப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: ἡ πόρνη
  choice: விலைமகளான
  rationale: πόρνη என்பதன் நேரடியான சமூக மற்றும் ஒழுக்கப் பொருளைத் தேவையற்ற மறைமொழியின்றி, புரியக்கூடிய நவீன தமிழில் தருகிறது.
- source_word: οὐ συναπώλετο
  choice: சேர்ந்து அழிந்துபோகவில்லை
  rationale: συναπόλλυμι என்ற கூட்டுவினையில் உள்ள ‘மற்றவர்களோடு ஒரே அழிவுக்கு உள்ளாதல்’ என்ற கருத்தை வெளிப்படையாகக் காக்கிறது.
- source_word: τοῖς ἀπειθήσασιν
  choice: கீழ்ப்படியாதவர்களுடன்
  rationale: ἀπειθέω என்பதிலுள்ள கீழ்ப்படியாமை மற்றும் மறுப்பு சார்ந்த பொருளை முதன்மைப்படுத்துகிறது; வெறும் அறிவுசார் அவிசுவாசமாக மட்டும் சுருக்கவில்லை.
- source_word: δεξαμένη
  choice: வரவேற்றிருந்தாள்
  rationale: நபர்களை ஏற்றுக்கொண்டு பாதுகாப்பளித்த சூழலில் ‘வரவேற்றாள்’ என்பது இயல்பானது. இறந்தகால முன்னிகழ்வை ‘வரவேற்றிருந்தாள்’ தெளிவாக்குகிறது; காரணத் தொடர்பு வாக்கிய அமைப்பால் வெளிப்படுகிறது.
- source_word: τοὺς κατασκόπους
  choice: வேவுகாரர்களை
  rationale: யோசுவா நூலின் சூழலில் உளவறிய அனுப்பப்பட்டவர்களைத் தெளிவாகக் குறிக்கும் வழக்கமான தமிழ் சொல்.
- source_word: μετ’ εἰρήνης
  choice: சமாதானத்துடன்
  rationale: μετά + εἰρήνη என்பதன் ‘சமாதானமான முறையில், தீங்கு செய்யாமல்’ என்ற பொருளையும் மூலமொழியின் சொல்லாட்சியையும் காக்கிறது.
theological_decisions:
- issue: எபிரெயர் 11-இன் முன்மாதிரி வாய்பாட்டில் πίστις என்பதன் மொழிபெயர்ப்பு
  choice: விசுவாசம்
  alternative: நம்பிக்கை / நம்பியிருத்தல்
  rationale: πίστει + நபரின் பெயர் என்ற எபிரெயர் 11-இன் நிலையான அமைப்பில் ‘விசுவாசத்தினால்’ என்பது முதன்மைப் பொருளையும் இலக்கியத் தொடர்ச்சியையும் காக்கிறது; ‘நம்பிக்கை’ என்பது தமிழில் எதிர்பார்ப்பு என்ற பொருளையும் தரக்கூடும்.
- issue: ἀπειθήσασιν என்பதிலுள்ள கீழ்ப்படியாமை–அவிசுவாசம் தொடர்பு
  choice: கீழ்ப்படியாதவர்கள்
  alternative: நம்பாதவர்கள்
  rationale: இவ்வினையெச்சம் மறுப்பும் கீழ்ப்படியாமையும் சார்ந்த பொருளைக் கொண்டுள்ளது. இங்கு ‘கீழ்ப்படியாதவர்கள்’ என்பது ஒழுக்க மற்றும் செயற்பாட்டு வலிமையைப் பாதுகாக்கிறது; அதை ‘நம்பாதவர்கள்’ என்று மட்டும் இறையியல் ரீதியாகச் சுருக்கவில்லை.
- issue: δεξαμένη என்ற வினையெச்சத்தின் தர்க்கத் தொடர்பு
  choice: ஏனெனில் … வரவேற்றிருந்தாள்
  alternative: … வரவேற்று / வரவேற்றபின்
  rationale: சூழலில் ராகாபின் செயல் அவள் அழியாததுடன் காரண அல்லது ஆதாரத் தொடர்புடையதாக வாசிக்கப்படுகிறது. இருப்பினும் கிரேக்க வினையெச்சம் அந்தத் தொடர்பை முற்றிலும் வெளிப்படையாகக் குறிக்காததால் மாற்று அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘விலைமகள்’ மூலத்தின் நேரடித் தன்மையைப் பேணுகிறது; ‘சமாதானத்துடன்’ வேதாகமச் சொல்லாட்சியையும் இயல்பான தமிழ் புரிதலையும் சமநிலைப்படுத்துகிறது.
