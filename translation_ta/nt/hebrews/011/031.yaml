  revised_text: விசுவாசத்தினால், விலைமகளான ராகாப் கீழ்ப்படியாதவர்களுடன் சேர்ந்து அழிந்துபோகவில்லை. ஏனெனில், அவள் வேவுகாரர்களை அமைதியாக வரவேற்றாள்.[a]
