source:
  edition: SBLGNT
  text: Πίστει ⸀καὶ περὶ μελλόντων εὐλόγησεν Ἰσαὰκ τὸν Ἰακὼβ καὶ τὸν Ἠσαῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/020.yaml
  text: By faith Isaac blessed Jacob and Esau, even concerning things to come.
translation:
  language: ta
  text: விசுவாசத்தினால் ஈசாக்கு, வரவிருந்தவற்றைக் குறித்தும்கூட, யாக்கோபையும் ஏசாவையும் ஆசீர்வதித்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πίστει
  choice: விசுவாசத்தினால்
  rationale: கருவிப் பொருளைத் தெளிவாக வெளிப்படுத்தும், எபிரெயர் 11-ஆம் அதிகாரத்தின் தொடர்ச்சியான சொல்லாட்சிக்கு ஏற்ற இயல்பான தமிழ் வடிவம்.
- source_word: καὶ περὶ μελλόντων
  choice: வரவிருந்தவற்றைக் குறித்தும்கூட
  rationale: περὶ என்பதன் ‘குறித்து’ என்ற பொருளையும், μελλόντων என்பதன் எதிர்கால நோக்கையும் காக்கிறது; καὶ இங்கு வலியுறுத்தலாக இருப்பதை ‘கூட’ வெளிப்படுத்துகிறது.
- source_word: εὐλόγησεν
  choice: ஆசீர்வதித்தார்
  rationale: வேதாகமச் சூழலில் தந்தை வழங்கும் ஆசீர்வாதத்தை இயல்பாகவும் துல்லியமாகவும் குறிக்கிறது.
- source_word: τὸν Ἰακὼβ καὶ τὸν Ἠσαῦ
  choice: யாக்கோபையும் ஏசாவையும்
  rationale: இருவரும் வினையின் நேரடிச் செயப்படுபொருள்கள் என்பதை ‘-ஐயும்’ இணைப்பு தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: ஈசாக்கின் ஆசீர்வாதம் எதிர்கால நிகழ்வுகளோடு கொண்ட தொடர்பு
  choice: வரவிருந்தவற்றைக் குறித்தும்கூட
  alternative: எதிர்காலத்தில் நடக்கவிருந்தவற்றைக் குறித்து
  rationale: மூலத்தின் சுருக்கத்தையும் ‘வரவிருப்பவை’ என்ற திட்டமிட்ட தெளிவின்மையையும் காக்கிறது; அவை வாக்குறுதிகளா, சந்ததியினரின் நிலைகளா, வேறு நிகழ்வுகளா என்று உரை சொல்லாததை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையில் அமைக்கப்பட்டது. ‘வரவிருந்தவை’ என்ற மூலத்தின் பரந்த பொருள் குறுக்கப்படவில்லை; καὶ-ன் வலியுறுத்தல் ‘கூட’ மூலம் இயல்பாகப் பாதுகாக்கப்பட்டது.
