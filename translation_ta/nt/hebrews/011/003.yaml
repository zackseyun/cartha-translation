reference: Hebrews 11:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πίστει νοοῦμεν κατηρτίσθαι τοὺς αἰῶνας ῥήματι θεοῦ, εἰς τὸ μὴ ἐκ φαινομένων ⸂τὸ βλεπόμενον⸃ γεγονέναι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/003.yaml
  text: By faith we understand that the ages were framed by the word of God[a], so that what is seen did not come into being from things that are visible.
translation:
  language: ta
  text: விசுவாசத்தினால், கடவுளின் வார்த்தையினால் யுகங்கள் ஒழுங்குபடுத்தப்பட்டுள்ளன என்பதை நாம் புரிந்துகொள்கிறோம். இதன் விளைவாக, காணப்படுவது காணக்கூடியவற்றிலிருந்து தோன்றவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πίστει
  choice: விசுவாசத்தினால்
  rationale: கருவி அல்லது வழிமுறையைக் குறிக்கும் வேற்றுமையைத் தெளிவாக வெளிப்படுத்துகிறது; இவ்வதிகாரத்தில் மீண்டும் மீண்டும் வரும் விசுவாசக் கருத்தையும் ஒரே சொல்லால் தக்கவைக்கிறது.
- source_word: νοοῦμεν
  choice: நாம் புரிந்துகொள்கிறோம்
  rationale: புலனுணர்வை மட்டும் அல்லாமல் மனத்தால் உணர்ந்து அறிதலைக் குறிக்கும் νοέω என்பதன் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: κατηρτίσθαι
  choice: அமைக்கப்பட்டன
  rationale: ஒழுங்குபடுத்தி உருவமைத்தல் அல்லது நிலைநிறுத்துதல் என்ற பொருளைத் தருகிறது; பொருள்சார் படைப்பை மட்டும் மிகையாக வலியுறுத்தாமல் கிரேக்க வினையின் பரப்பைப் பாதுகாக்கிறது.
- source_word: τοὺς αἰῶνας
  choice: காலங்கள்
  rationale: αἰῶνες என்பதன் நேரடியான காலப் பொருளைப் பாதுகாக்கிறது; அதேவேளை அது காலம் முழுவதும் உள்ள உலக ஒழுங்கையும் குறிக்கக்கூடும் என்பதால் மாற்று மொழிபெயர்ப்புகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: ῥήματι θεοῦ
  choice: கடவுளின் வார்த்தையால்
  rationale: கடவுளுடைய உரைப்பு அல்லது சொல் செயல்பட்ட வழிமுறையாக இருந்ததை இயல்பாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: εἰς τὸ μὴ ... γεγονέναι
  choice: அதனால் ... உண்டாகவில்லை
  rationale: இக்கட்டமைப்பின் விளைவு சார்ந்த தொடர்பையும் γίνομαι என்பதன் இருப்புக்கு வருதல் என்ற வினைப் பொருளையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ἐκ φαινομένων
  choice: காணக்கூடியவற்றிலிருந்து
  rationale: தோன்றுகிற அல்லது புலனுக்குத் தெரிகிற பொருட்களைக் குறிக்கும் பன்மைச் சொல்லைத் தெளிவாகக் காட்டுகிறது.
- source_word: τὸ βλεπόμενον
  choice: காணப்படுவது
  rationale: ஒருமை வடிவில் இருந்தாலும் மொத்தக் காணத்தக்க படைப்பொழுங்கைக் கூட்டாகக் குறிக்கக்கூடிய கிரேக்கச் சொல்லின் பரந்த குறிப்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: படைப்புடன் தொடர்புடைய αἰῶνες என்பதன் பரப்பு
  choice: முதன்மை உரையில் “காலங்கள்” என்று மொழிபெயர்க்கப்பட்டது.
  alternative: “உலகங்கள்” அல்லது “பிரபஞ்சம்”
  rationale: கிரேக்கச் சொல் இடவெளிசார் பிரபஞ்சத்தை மட்டும் அல்லாமல், காலம் முழுவதும் விரியும் உலக ஒழுங்கையும் குறிக்க முடியும். நேரடி சொல்லை முதன்மை உரையில் வைத்து, அதன் அண்டவியல் பரப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: காணக்கூடியவற்றிலிருந்து படைப்பு தோன்றவில்லை என்பதன் இறையியல் உட்பொருள்
  choice: காணப்படுவது காணக்கூடியவற்றிலிருந்து உண்டாகவில்லை என்ற அளவிலேயே உரை மொழிபெயர்க்கப்பட்டது.
  alternative: “ஒன்றுமில்லாமையிலிருந்து படைக்கப்பட்டது” என்று வெளிப்படையாகக் கூறுதல்
  rationale: இந்த வசனம் ஒன்றுமில்லாமையிலிருந்து படைத்தல் என்ற போதனையுடன் ஒத்திருந்தாலும், கிரேக்க உரை வெளிப்படையாகக் கூறுவது காணப்படும் ஒழுங்கு காணக்கூடிய பொருட்களிலிருந்து தோன்றவில்லை என்பதே. ஆகவே விரிவான கொள்கை விளக்கம் முதன்மை உரையில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. “விசுவாசம்” என்பது இவ்வதிகாரத்தின் மைய இறையியல் சொல்லைத் தொடர்ந்து சீராகக் குறிக்கத் தேர்ந்தெடுக்கப்பட்டது; வாக்கிய அமைப்பு கிரேக்கத்தின் காரண–விளைவு தொடர்பைப் படிக்க எளிதான இரண்டு வாக்கியங்களாக வழங்குகிறது.
