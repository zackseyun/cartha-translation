revisions:
- from: விசுவாசத்தினால், கடவுளின் வார்த்தையால் காலங்கள்[a] அமைக்கப்பட்டன என்பதை நாம் புரிந்துகொள்கிறோம். அதனால், காணப்படுவது காணக்கூடியவற்றிலிருந்து உண்டாகவில்லை.
  to: விசுவாசத்தினால், கடவுளின் வார்த்தையினால் யுகங்கள் ஒழுங்குபடுத்தப்பட்டுள்ளன என்பதை நாம் புரிந்துகொள்கிறோம். இதன் விளைவாக, காணப்படுவது காணக்கூடியவற்றிலிருந்து தோன்றவில்லை.
