  text: οἱ γὰρ τοιαῦτα λέγοντες ἐμφανίζουσιν ὅτι πατρίδα ἐπιζητοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/014.yaml
  text: For those who say such things make it clear that they are seeking a homeland[a].
translation:
  language: ta
  text: ஏனெனில், இப்படிப்பட்டவற்றைச் சொல்கிறவர்கள் தாங்கள் ஒரு தாய்நாட்டைத் தேடிக்கொண்டிருக்கிறார்கள் என்பதைத் தெளிவாகக் காட்டுகிறார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தங்களுடைய சொந்த நாடு’ அல்லது ‘பிறந்த மண்.’ அவர்கள் நம்பிக்கையுடன் எதிர்நோக்கிய தாய்நாடு இறுதியில் பரலோகத்துக்குரியது என்பதைத் தொடர்ந்து வரும் வசனங்கள் தெளிவுபடுத்துகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: (தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை)
  rationale: இது முந்தைய வசனத்துக்கான விளக்கத் தொடர்பைக் குறிக்கிறது. தமிழில் ‘இப்படிப்பட்டவற்றைச் சொல்கிறவர்கள்’ என்ற அமைப்பும் சூழலும் அந்தத் தொடர்பை இயல்பாக வெளிப்படுத்துகின்றன; ‘ஏனெனில்’ சேர்ப்பது இவ்வாக்கியத்தைத் தனியே வாசிக்கும்போது செயற்கையாக ஒலிக்கலாம்.
- source_word: τοιαῦτα
  choice: இப்படிப்பட்டவற்றை
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட அதே வகையான சொற்களைச் சுட்டுகிறது; நவீன தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: λέγοντες
  choice: சொல்கிறவர்கள்
  rationale: பெயரெச்சப் பங்கேற்பைத் தமிழில் இயல்பான தொடர்புடைய பெயரமைப்பாகத் தருகிறது; நிகழ்காலத்தின் பொதுவான அல்லது தொடரும் தன்மையையும் காக்கிறது.
- source_word: ἐμφανίζουσιν
  choice: தெளிவுபடுத்துகிறார்கள்
  rationale: அவர்களுடைய சொற்கள் ஒரு உண்மையை வெளிப்படையாகக் காட்டுகின்றன என்ற பொருளைத் தருகிறது.
- source_word: ὅτι
  choice: என்பதை
  rationale: தெளிவுபடுத்தப்படும் செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் இயல்பான தமிழ் இணைப்பு.
- source_word: πατρίδα
  choice: ஒரு தாய்நாட்டை
  rationale: ஒருவரின் சொந்த நாடு அல்லது பிறந்த மண்ணைக் குறிக்கும் சொல்லின் பொருளை நவீனத் தமிழில் கண்ணியமாக வழங்குகிறது. ‘ஒரு’ என்பது கிரேக்கத்தில் உள்ள நிர்ணயமின்மையைக் காக்கிறது.
- source_word: ἐπιζητοῦσιν
  choice: தேடிக்கொண்டிருக்கிறார்கள்
  rationale: தொடர்ந்து நாடித் தேடும் நிகழ்காலச் செயலை வெளிப்படுத்துகிறது; வெறும் ஏக்கமாக மட்டுமே பொருளைக் குறுக்கவில்லை.
theological_decisions:
- issue: முற்பிதாக்கள் நாடிய πατρίς எது?
  choice: முதன்மை உரையில் பொதுவாக ‘ஒரு தாய்நாடு’ என்று தரப்பட்டுள்ளது.
  alternative: ‘பரலோகத் தாய்நாடு’ அல்லது ‘பூமிக்குரிய தாய்நாடு’ என்று வெளிப்படையாகக் குறிப்பிடுதல்.
  rationale: இந்த வசனம் அது எந்தத் தாய்நாடு என்று இன்னும் குறிப்பிடவில்லை; அடுத்த வசனமே அவர்கள் விரும்பியது மேலான, பரலோகத்துக்குரிய நாடு என்று தெளிவுபடுத்துகிறது. ஆகவே விளக்கத்தை முன்கூட்டியே முதன்மை உரைக்குள் கொண்டுவரவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தாய்நாடு’ இயல்பான தமிழ் வழக்கைத் தேர்ந்தெடுக்கிறது; இதற்கு உயிரியல் பாலினப் பொருள் நோக்கமல்ல. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
