    issue: The explanatory particle γὰρ is omitted.
    rationale: γὰρ explicitly connects this statement as an explanation of the preceding context. Tamil can render this naturally with “ஏனெனில்.”
  - severity: low
    issue: The footnote says that the next verse establishes the homeland as heavenly.
    rationale: Hebrews 11:15 addresses their not returning to the land from which they came; the explicit “heavenly” description occurs in verse 16. The note should refer to the following verses rather than the next verse alone.
