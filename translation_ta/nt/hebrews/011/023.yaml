source:
  edition: SBLGNT
  text: Πίστει Μωϋσῆς γεννηθεὶς ἐκρύβη τρίμηνον ὑπὸ τῶν πατέρων αὐτοῦ, διότι εἶδον ἀστεῖον τὸ παιδίον καὶ οὐκ ἐφοβήθησαν τὸ διάταγμα τοῦ βασιλέως.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/023.yaml
  text: By faith Moses[a], when he was born, was hidden for three months by his parents, because they saw that the child was beautiful, and they were not afraid of the king’s edict.
translation:
  language: ta
  text: விசுவாசத்தினால், மோசே பிறந்தபோது அவனுடைய பெற்றோரால் மூன்று மாதங்கள் மறைத்து வைக்கப்பட்டான். ஏனெனில், குழந்தை அழகாக[a] இருந்ததை அவர்கள் கண்டார்கள்; அரசனுடைய ஆணைக்கு அவர்கள் பயப்படவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அழகாக” என்பதற்குப் பதிலாக “நல்லதாக” அல்லது “தனிச்சிறப்புடையதாக” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ἀστεῖον; யாத்திராகமம் 2:2; அப்போஸ்தலர் 7:20 ஆகியவற்றையும் காண்க.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: விசுவாசத்தினால்
  rationale: கருவி அல்லது வழிமுறையைக் குறிக்கும் வேற்றுமையை வெளிப்படுத்தி, எபிரெயர் 11 முழுவதும் திரும்பத் திரும்ப வரும் விசுவாசக் கருத்தை இயல்பான தமிழில் முன்னிறுத்துகிறது.
- source_word: Μωϋσῆς
  choice: மோசே
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட பெயர் வடிவம்.
- source_word: γεννηθεὶς
  choice: பிறந்தபோது
  rationale: இறந்தகாலச் செயப்பாட்டு வினையெச்சத்தின் காலத் தொடர்பை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἐκρύβη
  choice: மறைத்து வைக்கப்பட்டான்
  rationale: மோசே பிறரால் மறைக்கப்பட்டார் என்பதைக் காட்டும் கிரேக்கச் செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது.
- source_word: τρίμηνον
  choice: மூன்று மாதங்கள்
  rationale: கால நீடிப்பைக் குறிக்கும் மூலமொழிச் சொல்லை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὑπὸ τῶν πατέρων αὐτοῦ
  choice: அவனுடைய பெற்றோரால்
  rationale: πατέρων என்பதன் சொற்பொருள் ‘தந்தையர்’ என்றாலும், இச்சூழலில் தந்தை தாய் இருவரையும் குறிக்கும் இயல்பான கூட்டுப்பெயர் ‘பெற்றோர்’ ஆகும்.
- source_word: διότι
  choice: ஏனெனில்
  rationale: பெற்றோரின் செயலுக்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: εἶδον
  choice: அவர்கள் கண்டார்கள்
  rationale: அவர்கள் குழந்தையைப் பற்றி நேரடியாகக் கவனித்ததை எளிய இறந்தகால வினையாகப் பாதுகாக்கிறது.
- source_word: ἀστεῖον
  choice: அழகாக
  rationale: இச்சொல் அழகு, நேர்த்தி அல்லது தனிச்சிறப்பைக் குறிக்கலாம்; யாத்திராகமம் 2:2 மற்றும் அப்போஸ்தலர் 7:20 ஆகியவற்றின் எதிரொலியுடன் ‘அழகாக’ என்பது இயல்பான முதன்மைத் தேர்வு. பிற சாத்தியங்களை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: τὸ παιδίον
  choice: குழந்தை
  rationale: வயதை மிகத் துல்லியமாக நிர்ணயிக்காமல், கிரேக்கச் சொல்லின் பொதுவான பொருளையும் கண்ணியமான நடையையும் காக்கிறது.
- source_word: οὐκ ἐφοβήθησαν
  choice: அவர்கள் பயப்படவில்லை
  rationale: விசுவாசத்திற்கும் பயத்திற்கும் இடையிலான மாறுபாட்டை நேரடியாகப் பாதுகாக்கிறது.
- source_word: τὸ διάταγμα τοῦ βασιλέως
  choice: அரசனுடைய ஆணை
  rationale: διάταγμα குறிக்கும் அதிகாரபூர்வ அரச கட்டளையை, பொதுவாசகர்களுக்குப் புரியும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: மோசேயை மறைத்த பெற்றோரின் உந்துதல்
  choice: குழந்தை அழகாக இருந்ததை அவர்கள் கண்டதும், அரசனுடைய ஆணைக்குப் பயப்படாததும், ‘விசுவாசத்தினால்’ செய்யப்பட்ட செயலின் கூறுகளாக உரையில் அப்படியே வைக்கப்பட்டுள்ளன.
  alternative: குழந்தையின் அழகு மட்டுமே அவர்களைத் தூண்டியது; அல்லது அதன் தோற்றம் ஒரு விசேஷமான தெய்வீக அடையாளமாக இருந்தது என்று வெளிப்படையாக விளக்குவது.
  rationale: கிரேக்க வாக்கிய அமைப்பு குழந்தையைப் பற்றிய அவர்களுடைய பார்வையையும் அரசனுடைய ஆணைக்குப் பயப்படாமையையும் சேர்த்துக் கூறி, முழுச் செயலையும் ‘விசுவாசத்தினால்’ என்ற தலைப்பின்கீழ் வைக்கிறது. தோற்றத்தில் அற்புதமான அடையாளம் இருந்ததாக மூலவசனம் வெளிப்படையாகச் சொல்லாததால், அந்தக் கருத்து மொழிபெயர்ப்பில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான வேதாகம நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் செயப்பாட்டு அமைப்பு முதல் வாக்கியத்தில் பாதுகாக்கப்பட்டுள்ளது; நீண்ட கிரேக்க வாக்கியம் தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. ‘அரசனுடைய ஆணைக்கும்’ என்ற வடிவம் அந்த ஆணையை எதிர்கொண்டபோதும் அவர்கள் பயப்படவில்லை என்ற அழுத்தத்தை இயல்பாகத் தருகிறது.
