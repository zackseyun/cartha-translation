source:
  edition: SBLGNT
  text: Πίστει Ἑνὼχ μετετέθη τοῦ μὴ ἰδεῖν θάνατον, καὶ οὐχ ηὑρίσκετο διότι μετέθηκεν αὐτὸν ὁ θεός· πρὸ γὰρ τῆς ⸀μεταθέσεως μεμαρτύρηται εὐαρεστηκέναι τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/005.yaml
  text: By faith Enoch was taken away so that he should not see death[a], and he was not found because God had taken him away. For before his being taken away, he had been commended as having pleased God[c][b],
translation:
  language: ta
  text: விசுவாசத்தினால் ஏனோக்கு, மரணத்தைக் காணாதபடி எடுத்துக்கொள்ளப்பட்டார்[a]. கடவுள் அவரை எடுத்துக்கொண்டதால், அவர் காணப்படவில்லை. ஏனெனில், அவர் எடுத்துக்கொள்ளப்படுவதற்கு முன்பே கடவுளுக்கு உகந்தவராக இருந்தார் என்று அவரைக் குறித்துச் சாட்சி அளிக்கப்பட்டிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மரணத்தை அனுபவிக்காதபடி.” “மரணத்தைக் காணுதல்” என்பது கிரேக்க மொழியின் ஒரு மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: விசுவாசத்தினால்
  rationale: எபிரெயர் 11-இல் πίστις என்பதற்கான நிலையான பொருளையும், இங்கு வரும் கருவிப்பொருள்/வாழ்வுமுறை சார்ந்த வேற்றுமையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Ἑνὼχ
  choice: ஏனோக்கு
  rationale: தமிழ் வேதாகம மரபில் நன்கு அறியப்பட்ட பெயர் வடிவம்.
- source_word: μετετέθη / μετέθηκεν / μεταθέσεως
  choice: எடுத்துக்கொள்ளப்பட்டார் / எடுத்துக்கொண்டதால் / எடுத்துக்கொள்ளப்படுவதற்கு
  rationale: ஒரே சொற்குடும்பத்தைத் தொடர்ந்து பயன்படுத்தி, கடவுளின் செயலால் ஏனோக்கு அகற்றப்பட்டார் என்ற கருத்தைத் தெளிவாகக் காட்டுகிறது; அவர் எங்கு அல்லது எவ்வாறு எடுத்துக்கொள்ளப்பட்டார் என்பதை உரைக்கு அப்பால் விளக்குவதில்லை.
- source_word: τοῦ μὴ ἰδεῖν θάνατον
  choice: மரணத்தைக் காணாதபடி
  rationale: நோக்கம் அல்லது விளைவைக் குறிக்கும் அமைப்பையும் ‘மரணத்தைக் காணுதல்’ என்ற மூலமொழி மரபுத்தொடரையும் காக்கிறது.
- source_word: οὐχ ηὑρίσκετο
  choice: அவர் காணப்படவில்லை
  rationale: தேடியவர் யார் என்பதைச் சேர்க்காமல், கிரேக்கத்தின் செயப்பாட்டு வடிவத்தையும் அதன் மறைபொருளையும் காக்கிறது.
- source_word: μεμαρτύρηται
  choice: அவரைக் குறித்துச் சாட்சி அளிக்கப்பட்டிருந்தது
  rationale: சாட்சியை அளித்தவர் யார் என்பதை வெளிப்படையாக நிர்ணயிக்காமல், perfect passive வடிவத்தின் பொருளையும் முன்னரே நிலைபெற்ற சாட்சியையும் வெளிப்படுத்துகிறது.
- source_word: εὐαρεστηκέναι τῷ θεῷ
  choice: கடவுளுக்கு உகந்தவராக இருந்தார்
  rationale: கடவுளைப் பிரியப்படுத்தியவர் அல்லது அவருக்கு ஏற்றவராக இருந்தவர் என்ற பொருளை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
theological_decisions:
- issue: ஏனோக்கு எடுத்துக்கொள்ளப்பட்டதன் தன்மை
  choice: ‘எடுத்துக்கொள்ளப்பட்டார்’ என்று மட்டும் மொழிபெயர்த்து, அதன் இடம் அல்லது நிகழ்ந்த விதத்தைச் சேர்க்கவில்லை.
  alternative: ‘பரலோகத்துக்கு எடுத்துக்கொள்ளப்பட்டார்’ என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: கடவுள் ஏனோக்கை மரணத்தைக் காணாதபடி எடுத்துக்கொண்டார் என்று வசனம் கூறுகிறது; ஆனால் இந்த வசனமே இலக்கையோ நிகழ்ந்த முறையையோ விரிவாகக் கூறவில்லை.
- issue: ‘மரணத்தைக் காணுதல்’ என்ற மரபுத்தொடர்
  choice: மூலமொழியின் ‘மரணத்தைக் காணாதபடி’ என்ற உருவகத்தை முதன்மை உரையில் காத்தல்.
  alternative: ‘மரணத்தை அனுபவிக்காதபடி’ என்று பொருளை மட்டும் மொழிபெயர்த்தல்.
  rationale: தமிழிலும் இவ்வுருவகம் புரிந்துகொள்ளத்தக்கது; அதன் நேரடிப் பொருளை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: μεμαρτύρηται என்பதில் சாட்சி அளிப்பவர்
  choice: சாட்சி அளிப்பவர் யார் என்பதைத் திறந்தவாறே வைக்கும் செயப்பாட்டு வடிவம்.
  alternative: ‘கடவுளிடமிருந்து நற்சாட்சி பெற்றார்’ அல்லது ‘வேதவாக்கு சாட்சி கூறியது’ என்று குறிப்பாக்குதல்.
  rationale: சூழல் தெய்வீக அல்லது வேதச்சாட்சியை உணர்த்தினாலும், கிரேக்க வாக்கியம் சாட்சியளிப்பவரை இங்கு வெளிப்படையாகச் சொல்லவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘எடுத்துக்கொள்ளப்பட்டார்’ என்ற செயப்பாட்டு வடிவமும் ‘சாட்சி அளிக்கப்பட்டிருந்தது’ என்ற வடிவமும் மூலத்தின் திட்டமிட்ட தெளிவின்மையைப் பாதுகாக்கின்றன.
