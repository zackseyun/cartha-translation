source:
  edition: SBLGNT
  text: καὶ εἰ μὲν ἐκείνης ⸀μνημονεύουσιν ἀφ’ ἧς ⸀ἐξέβησαν, εἶχον ἂν καιρὸν ἀνακάμψαι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/015.yaml
  text: And if they had been remembering that land from which they had gone out[a], they would have had opportunity to return.
translation:
  language: ta
  text: அவர்கள் புறப்பட்டுவந்த அந்த நாட்டை[a] நினைத்துக்கொண்டிருந்தால், அங்கே திரும்பிச் செல்ல அவர்களுக்கு வாய்ப்பு இருந்திருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அந்த தேசத்தை’ அல்லது ‘அந்தத் தாய்நாட்டை’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடர் அவர்கள் புறப்பட்டுவந்த பூமிக்குரிய இடத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημονεύουσιν
  choice: நினைத்துக்கொண்டிருந்தால்
  rationale: நிகழ்கால வினை வடிவம் இங்கு நிகழாத நிபந்தனையின் உட்பகுதியில் வருகிறது. தொடர்ச்சியாக மனதில் வைத்திருத்தல் என்ற பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; வெறும் ஏக்கத்தைத் தேவையின்றி சேர்ப்பதில்லை.
- source_word: ἐκείνης
  choice: அந்த நாட்டை
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட பூமிக்குரிய நாட்டை பெண்பால் சுட்டுப்பெயர் குறிக்கிறது. தமிழில் பொருளைத் தெளிவாக்க ‘நாடு’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: ἀφ’ ἧς
  choice: புறப்பட்டுவந்த
  rationale: எந்த இடத்திலிருந்து அவர்கள் புறப்பட்டார்கள் என்ற மூல இடத் தொடர்பை இயல்பான தமிழ் பெயரெச்சத் தொடராகக் காட்டுகிறது.
- source_word: ἐξέβησαν
  choice: புறப்பட்டுவந்த
  rationale: ἐκβαίνω என்பதன் ‘வெளியே போதல்/புறப்படுதல்’ என்ற இயக்கப் பொருளைத் தக்கவைக்கிறது; ‘விட்டுவந்த’ என்பதைவிட புறப்பாட்டின் நுண்ணுணர்வைத் தெளிவாகக் காட்டுகிறது.
- source_word: εἶχον ἂν
  choice: இருந்திருக்கும்
  rationale: ἄν உடன் வரும் இறந்தகால வடிவம் நிகழாத நிபந்தனையின் விளைவைக் குறிக்கிறது. தமிழில் ‘இருந்திருக்கும்’ அதற்கான இயல்பான இணை.
- source_word: καιρὸν
  choice: வாய்ப்பு
  rationale: வெறும் கால அளவை அல்லாமல் ஏற்ற சந்தர்ப்பம் அல்லது சாத்தியத்தை இங்கு குறிக்கிறது.
- source_word: ἀνακάμψαι
  choice: திரும்பிச் செல்ல
  rationale: முன்பு இருந்த இடத்திற்குத் திரும்புதல் என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: καὶ εἰ μὲν
  choice: …இருந்தால்
  rationale: முந்தைய கருத்துடன் இணைந்த நிபந்தனையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது. καί மற்றும் μέν ஆகியவற்றைத் தனித்தனியாக வலிந்து மொழிபெயர்க்காமல் வாக்கியத் தொடர்பில் பிரதிபலிக்கிறது.
theological_decisions:
- issue: நினைக்கப்பட்ட ‘நாட்டின்’ தன்மை
  choice: அவர்கள் முன்பு புறப்பட்டுவந்த பூமிக்குரிய நாடு
  alternative: ஒரு நேரடியான தாய்நாட்டைக் காட்டிலும், அவர்கள் விட்டுவந்த முந்தைய வாழ்க்கைமுறைக்கான பொதுவான உருவகம்
  rationale: எபிரெயர் 11:13–16 உடனடி சூழலில் முற்பிதாக்களின் பூமிக்குரிய பிறப்பிடமும் அவர்கள் நாடிய மேலான, பரலோக நாட்டும் வேறுபடுத்தப்படுகின்றன. ஆகவே மொழிபெயர்ப்பு இடம்சார்ந்த நேரடிப் பொருளைத் தக்கவைக்கிறது; அதை உருவகமாக மாற்றுவதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமானதும் எளிதில் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நினைத்துக்கொண்டிருந்தால் … இருந்திருக்கும்’ என்ற அமைப்பு நிகழாத நிபந்தனையை இயல்பாகக் காட்டுகிறது. ‘அங்கே’ என்பது திரும்பிச் செல்லும் இலக்கைத் தமிழில் தெளிவாக்குகிறது; புதிய கருத்தைச் சேர்ப்பதில்லை.
