  text: They were stoned[a], they were sawn in two, they died by the sword; they went about in sheepskins, in goatskins, destitute, afflicted, mistreated—
translation:
  language: ta
  text: அவர்கள் கல்லெறியப்பட்டார்கள்; ரம்பத்தால் இரண்டாக அறுக்கப்பட்டார்கள்; வாளால் கொல்லப்பட்டார்கள்.[a] செம்மறியாட்டுத் தோல்களையும் வெள்ளாட்டுத் தோல்களையும் அணிந்துகொண்டு, தேவையில் வாடியவர்களாய், துன்புறுத்தப்பட்டவர்களாய், கொடுமைப்படுத்தப்பட்டவர்களாய் அலைந்து திரிந்தார்கள்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வாளால் கொல்லப்பட்டார்கள்’ என்பதற்கான கிரேக்கச் சொற்றொடர் சொல்லுக்குச் சொல் ‘வாளின் கொலையில் இறந்தார்கள்’ என அமைகிறது; அதில் உள்ள ‘கொலை/படுகொலை’ என்ற நுணுக்கம் வன்முறையை வலுப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλιθάσθησαν
  choice: கல்லெறியப்பட்டார்கள்
  rationale: λιθάζω என்பதன் இறந்தகாலச் செயல்பாட்டு வினை வடிவம் கல்லெறிதலை நேரடியாகக் குறிக்கிறது. மரணம் நிகழ்ந்ததாகச் சொல்லை விரிவுபடுத்தாமல், மூலத்தின் செயப்பாட்டு வடிவம் காக்கப்படுகிறது.
- source_word: ἐπρίσθησαν
  choice: இரண்டாக அறுக்கப்பட்டார்கள்
  rationale: πρίζω என்பது ரம்பத்தால் அறுப்பதைக் குறிக்கிறது; இச்சாட்சிமரணப் பட்டியலில் உடல் இரண்டாக அறுக்கப்பட்டதாகிய பொருள் இயல்பாக வெளிப்படுகிறது.
- source_word: ἐν φόνῳ μαχαίρης ἀπέθανον
  choice: வாளால் கொல்லப்பட்டார்கள்
  rationale: சொல்லுக்குச் சொல் அமைப்பில் ‘வாளின் கொலையில் இறந்தார்கள்’ என்ற வன்மையான நுணுக்கம் உள்ளது. தமிழில் இயல்பாகவும் அந்த வன்முறையையும் காக்கவும் ‘வாளால் கொல்லப்பட்டார்கள்’ என வழங்கப்படுகிறது.
- source_word: περιῆλθον
  choice: அலைந்து திரிந்தார்கள்
  rationale: இடத்திலிருந்து இடம் சென்ற நிலையை περιέρχομαι குறிக்கிறது; துன்புறுத்தப்பட்டோரின் நிலைமையில் ‘அலைந்து திரிந்தார்கள்’ இயல்பான தமிழ்.
- source_word: ἐν μηλωταῖς, ἐν αἰγείοις δέρμασιν
  choice: செம்மறியாட்டுத் தோல்களையும் வெள்ளாட்டுத் தோல்களையும் அணிந்துகொண்டு
  rationale: இவை தோலால் ஆன உடைகளைக் குறிக்கின்றன. வெறும் ‘தோல்களில்’ என்பதைக் காட்டிலும் ‘அணிந்துகொண்டு’ தமிழில் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ὑστερούμενοι
  choice: தேவையில் வாடியவர்களாய்
  rationale: ὑστερέω இங்கு அத்தியாவசியங்கள் இல்லாமல் குறைவுபட்டிருப்பதைக் குறிக்கிறது; ‘தேவையில் வாடுதல்’ வறுமையின் தீவிரத்தைத் தெரிவிக்கிறது.
- source_word: θλιβόμενοι
  choice: ஒடுக்கப்பட்டவர்களாய்
  rationale: θλίβω என்பது நெருக்கப்படுதல், துன்புறுத்தப்படுதல் அல்லது ஒடுக்கப்படுதல் என்ற பரப்பைக் கொண்டது; இங்கு செயப்பாட்டு துன்புறுத்தலை ‘ஒடுக்கப்பட்டவர்கள்’ தெளிவாகக் காட்டுகிறது.
- source_word: κακουχούμενοι
  choice: கொடுமைப்படுத்தப்பட்டவர்களாய்
  rationale: κακουχέομαι என்பது மோசமாக நடத்தப்படுதல் அல்லது கொடுமைக்கு உட்படுத்தப்படுதலைக் குறிக்கிறது; இச்சூழலில் வலிமையையும் இயல்பையும் காக்கும் தமிழ் இது.
