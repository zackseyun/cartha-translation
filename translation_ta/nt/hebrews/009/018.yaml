  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅθεν οὐδὲ ἡ πρώτη χωρὶς αἵματος ἐγκεκαίνισται·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/018.yaml
  text: Therefore not even the first covenant was inaugurated without blood[a].
translation:
  language: ta
  text: ஆகவே, முதல் உடன்படிக்கைகூட இரத்தமில்லாமல் நிறுவப்படவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முதலாவதுகூட”—அதாவது, முதல் உடன்படிக்கை. மூலமொழியில் “உடன்படிக்கை” என்ற சொல் இங்கே வெளிப்படையாக இல்லை. சில மொழிபெயர்ப்புகள் இதை “முதல் உயில்” என்று வழங்குகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅθεν
  choice: ஆகவே
  rationale: முந்தைய வசனங்களில் உடன்படிக்கையும் மரணமும் பற்றிய வாதத்திலிருந்து வரும் முடிவைக் காட்டும் இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: οὐδὲ
  choice: கூட ... இல்லை
  rationale: ‘அதுவும்கூட இல்லை / not even’ என்ற வலியுறுத்தப்பட்ட மறுப்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἡ πρώτη
  choice: முதல் உடன்படிக்கை
  rationale: கிரேக்கத்தில் பெயர்ச்சொல் வெளிப்படையாக இல்லாவிட்டாலும், பெண்பால் பெயரடை சூழலில் முன்பு பேசப்பட்ட உடன்படிக்கையையே சுட்டுகிறது. தெளிவுக்காக ‘உடன்படிக்கை’ சேர்க்கப்படுகிறது.
- source_word: χωρὶς αἵματος
  choice: இரத்தமில்லாமல்
  rationale: இரத்தம் இன்றி என்பதைக் குறிக்கும் நேரடியான, இயல்பான தமிழ்; உடன்படிக்கை மற்றும் பலியின் சூழலையும் தக்கவைக்கிறது.
- source_word: ἐγκεκαίνισται
  choice: தொடங்கிவைக்கப்படவில்லை
  rationale: ἐγκαινίζω என்பதன் ‘சடங்குமுறையில் தொடங்கி நிறுவுதல்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது; சட்டரீதியான ‘உறுதிசெய்தல்’ என்ற ஒரே பொருளுக்குள் இதைச் சுருக்கவில்லை. கிரேக்க நிறைவுக் காலத்தின் முடிவுற்ற செயலைத் தமிழ் இறந்தகால வடிவம் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘முதல்’ என்பதன் குறிப்பு
  choice: முதல் உடன்படிக்கை
  alternative: ‘முதலாவது’ என்று மட்டும் கூறுதல்; அல்லது ‘முதல் ஏற்பாடு/மரணசாசனம்’
  rationale: எபிரெயர் 9-ன் உடனடிச் சூழலும் யாத்திராகமம் 24-ஐ நினைவூட்டும் இரத்தத்தால் தொடங்கிவைக்கும் செயலும் முதல் உடன்படிக்கையைக் குறிக்கின்றன. இருப்பினும், மூலத்தில் ‘உடன்படிக்கை’ என்ற பெயர்ச்சொல் இவ்வசனத்தில் வெளிப்படையாக இல்லை என்பதை அடிக்குறிப்பு பதிவு செய்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘தொடங்கிவைக்கப்பட்டது’ என்பது சடங்குமுறையிலான நிறுவுதலைக் காட்டுகிறது; ‘அர்ப்பணிக்கப்பட்டது’ அல்லது ‘சட்டப்படி உறுதிசெய்யப்பட்டது’ என்று பொருளை மிகையாகக் குறுக்கவில்லை.
