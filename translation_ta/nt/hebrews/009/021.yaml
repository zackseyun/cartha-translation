source:
  edition: SBLGNT
  text: καὶ τὴν σκηνὴν δὲ καὶ πάντα τὰ σκεύη τῆς λειτουργίας τῷ αἵματι ὁμοίως ἐράντισεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/021.yaml
  text: And likewise he sprinkled with the blood both the tabernacle and all the vessels of the ministry[a][b].
translation:
  language: ta
  text: அதுபோலவே, திருக்கூடாரத்தின்[a] மீதும் திருப்பணிக்குரிய எல்லாப் பொருள்களின்[b] மீதும் அவர் இரத்தத்தைத் தெளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கூடாரத்தின்.’ கிரேக்கச் சொல் பொதுவாகக் ‘கூடாரம்’ எனப் பொருள்படலாம்; இங்கு அது புனிதத் திருக்கூடாரத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘வழிபாட்டுப் பணிக்குரிய எல்லா உபகரணங்களின்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνή
  choice: திருக்கூடாரம்
  rationale: இச்சொல் பொதுவாகக் ‘கூடாரம்’ எனப் பொருள்படக்கூடியது; ஆனால் எபிரெயர் 9-இன் சூழலில் இது மோசேயின் காலத்துப் புனித உறைவிடத்தைக் குறிக்கிறது. ‘திருக்கூடாரம்’ அந்தச் சிறப்புப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: σκεύη
  choice: பொருள்கள்
  rationale: வழிபாட்டுப் பணியில் பயன்படுத்தப்பட்ட பாத்திரங்கள், கருவிகள் உள்ளிட்ட அனைத்தையும் உள்ளடக்கும் பொதுப்பெயராக ‘பொருள்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: λειτουργία
  choice: திருப்பணி
  rationale: இங்கு இது பொதுவான சேவையை அல்ல, ஆசாரியர்கள் செய்த புனித வழிபாட்டுப் பணியைக் குறிக்கிறது. ‘திருப்பணி’ சுருக்கமாகவும் சூழலுக்கேற்றதாகவும் உள்ளது.
- source_word: αἷμα
  choice: இரத்தம்
  rationale: பலியுடன் தொடர்புடைய இரத்தத்தை நேரடியாகக் குறிப்பிடுவதால் சொல்லுக்குச் சொல் பொருள் பாதுகாக்கப்பட்டது.
- source_word: ὁμοίως
  choice: அதுபோலவே
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட தெளித்தலுடன் இச்செயலை இணைக்கும் ஒப்புமை வலிமையைப் பாதுகாக்கிறது.
- source_word: ῥαντίζω
  choice: தெளித்தார்
  rationale: சடங்குமுறையில் இரத்தத்தைப் பயன்படுத்திய செயலைத் தெளிவாகவும் இயல்பான தமிழிலும் தெரிவிக்கிறது.
- source_word: δὲ
  choice: வே
  rationale: இங்கு வலுவான எதிர்மறைத் தொடர்பு இல்லை; முந்தைய கூற்றுடன் மென்மையாக இணைக்கும் பொருள் ‘அதுபோலவே’ என்பதில் இயல்பாக வெளிப்படுகிறது.
- source_word: πάντα τὰ σκεύη
  choice: எல்லாப் பொருள்கள்
  rationale: சடங்குப் பணிக்குப் பயன்பட்ட பொருள்கள் அனைத்தையும் உள்ளடக்கும் பன்மை மற்றும் முழுமை உணர்வைப் பாதுகாக்கிறது.
theological_decisions:
- issue: யாத்திராகமத்தில் உள்ள மோசேயின் சடங்குகளுடன் இவ்வசனத்துக்கு இருக்கும் தொடர்பு
  choice: மோசே திருக்கூடாரத்தின்மீதும் அதன் திருப்பணிப் பொருள்கள் அனைத்தின்மீதும் இரத்தத்தைத் தெளித்தார் என்ற சுருக்கக் கூற்றாக நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: யாத்திராகமப் பின்னணியையோ விவரங்களில் காணப்படும் வேறுபாடுகளையோ விளக்குவதற்காக வசனத்தை விரிவாக்குதல்.
  rationale: மூலவசனம் தரும் சுருக்கத்தையும் அதன் இடைநூல் சார்ந்த இறுக்கத்தையும் அப்படியே பாதுகாக்க வேண்டும்; வரலாற்று விளக்கமோ ஒத்திசைவாக்கமோ முதன்மை உரையில் சேர்க்கப்படக் கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘திருக்கூடாரம்’ மற்றும் ‘திருப்பணி’ ஆகியவை சடங்கு சார்ந்த சூழலைப் பாதுகாக்கின்றன; ‘பொருள்கள்’ பொதுவாசகர்களுக்குப் புரியும் வகையில் விரிவான σκεύη என்ற சொல்லை உள்ளடக்குகிறது. ‘மீதும் ... மீதும்’ என்பது கிரேக்கத்தின் இணை அமைப்பைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
