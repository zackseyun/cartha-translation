  source_fidelity: 'மூலக் கிரேக்கத்தின் இணை அமைப்பும் பொருளும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன: ‘அதுபோலவே’ ὁμοίως-ஐ, ‘அவர் ... தெளித்தார்’ ἐράντισεν-ஐ, ‘திருக்கூடாரத்தின் மீதும் ... எல்லாப் பொருள்களின் மீதும்’ τὴν σκηνὴν ... καὶ πάντα τὰ σκεύη-ஐ, ‘இரத்தத்தை’ τῷ αἵματι-ஐ உரிய சடங்கு சூழலுடன் வெளிப்படுத்துகின்றன. தமிழில் வேற்றுமை உருபுகளின் மீளுரையும் இரண்டு பொருட்களுக்கும் இரத்தம் தெளிக்கப்பட்டதைத் தெளிவுபடுத்துகிறது.'
