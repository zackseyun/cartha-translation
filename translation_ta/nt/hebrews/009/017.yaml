  text: διαθήκη γὰρ ἐπὶ νεκροῖς βεβαία, ἐπεὶ ⸀μήποτε ἰσχύει ὅτε ζῇ ὁ διαθέμενος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/017.yaml
  text: For a covenant is valid over dead ones[b][a], since it is never in force while the one who made it is living.
translation:
  language: ta
  text: ஏனெனில், உடன்படிக்கை இறந்தவர்களை முன்னிட்டு செல்லுபடியாகும்[b][a]; அதை ஏற்படுத்தியவர் உயிரோடிருக்கும்போது அது ஒருபோதும் செல்லுபடியாகாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: ‘ஏனெனில், ஒருவர் இறந்த பின்னரே உயில் செல்லுபடியாகிறது; அதை ஏற்படுத்தியவர் உயிரோடிருக்கும்போது அது ஒருபோதும் செல்லுபடியாகாது.’ ‘உடன்படிக்கை’ என்று மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொல் ‘உயில்’ அல்லது ‘மரணசாசனம்’ என்றும் பொருள்படலாம்.'
    reason: alternative_reading
  - marker: b
    text: ‘இறந்தவர்களை முன்னிட்டு’ என்ற கிரேக்கச் சொற்றொடர் சுருக்கமானதும் விளக்கத்தில் விவாதத்திற்குரியதுமாகும். உயில் சார்ந்த பொருளில் இறந்த நபர்களையோ, உடன்படிக்கை உறுதிப்படுத்தப்படுவதில் தொடர்புடைய மரணங்களையோ இது குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκη
  choice: உடன்படிக்கை
  rationale: எபிரெயர் 8–10 அதிகாரங்களின் பரந்த சூழல் மோசேயின் உடன்படிக்கையையும் பலியிரத்தத்தால் அதன் தொடக்கத்தையும் மையப்படுத்துவதால், முதன்மை உரையில் ‘உடன்படிக்கை’ என வழங்கப்படுகிறது. ‘உயில்’ என்ற சட்டப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐπὶ νεκροῖς
  choice: இறந்தவர்களின்மேல்
  rationale: கிரேக்கச் சொற்றொடரின் சுருக்கமான, விவாதத்திற்குரிய வடிவத்தை இயன்றவரை திறந்த நிலையில் வைத்திருக்கிறது; இது இறந்த நபர்களையோ உடன்படிக்கை உறுதிப்படுத்தலில் சம்பந்தப்பட்ட மரணத்தையோ குறிக்கக்கூடும்.
- source_word: βεβαία
  choice: உறுதியாகிறது
  rationale: உடன்படிக்கையின் செயலுறும் உறுதி அல்லது செல்லுபடித்தன்மையைத் தெரிவிக்கிறது; தமிழில் இயல்பான வினை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐπεὶ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரண விளக்கத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: μήποτε
  choice: ஒருபோதும் … இல்லை
  rationale: இச்சூழலில் ‘எந்த நேரத்திலும் இல்லை’ என்ற இடியோமாட்டிக் மறுப்புப் பொருளை அளிக்கிறது.
- source_word: ἰσχύει
  choice: நடைமுறைக்கு வருவதில்லை
  rationale: வெறும் வலிமையை அல்லாமல் சட்ட அல்லது உடன்படிக்கை சார்ந்த செயல்பாட்டை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ὅτε ζῇ
  choice: உயிரோடிருக்கும்போது
  rationale: மரணத்திற்கும் தொடர்ந்து உயிருடன் இருக்கும் நிலைக்கும் இடையேயான காலம்சார் முரண்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: ὁ διαθέμενος
  choice: அதை ஏற்படுத்தியவர்
  rationale: ‘உடன்படிக்கையை ஏற்படுத்தியவர்’ என்றும் ‘உயிலை ஏற்படுத்தியவர்’ என்றும் புரிந்துகொள்ள இடமளித்து, மூலத்தின் இருபொருள் வாய்ப்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: διαθήκη என்பதை ‘உடன்படிக்கை’ என்றா ‘உயில்’ என்றா மொழிபெயர்ப்பது
  choice: முதன்மை உரையில் ‘உடன்படிக்கை’
  alternative: ‘உயில்’ அல்லது ‘மரணசாசனம்’
  rationale: உடனடியான மற்றும் பரந்த சூழல் உடன்படிக்கை சார்ந்ததாக இருந்தாலும், 9:16–17 வசனங்களின் மொழி உயில் சார்ந்த சட்டப் பொருளையும் அனுமதிக்கிறது. ஆகவே சூழலின் முதன்மைப் பொருள் உரையில் வைக்கப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἐπὶ νεκροῖς என்பதிலுள்ள தெளிவின்மையை எவ்வளவு தீர்ப்பது
  choice: ‘இறந்தவர்களின்மேல்’ என்ற திறந்த மொழிபெயர்ப்பு
  alternative: ‘மரணம் ஏற்பட்ட பின்னர்’; ‘இறந்த நபர்களைப் பொறுத்தவரை’; ‘இறந்த பலிகளின்மேல்’
  rationale: இச்சொற்றொடர் இலக்கணரீதியாகச் சுருக்கமானதும் விளக்கவுரையில் விவாதத்திற்குரியதும் ஆகும். உயில் செய்தவரின் மரணம் அல்லது உடன்படிக்கை உறுதிப்படுத்தும் பலிகளின் மரணம் என்ற இரு சாத்தியங்களிலும் ஒன்றை உரைக்குள் கட்டாயப்படுத்தாமல் தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘இறந்தவர்களின்மேல்’ என்பது தமிழில் சற்றுச் செறிவான வெளிப்பாடாக இருந்தாலும், மூலத்தின் உண்மையான தெளிவின்மையைத் தீர்த்துவிடாமல் பாதுகாப்பதற்காக நோக்கத்துடன் வைக்கப்பட்டுள்ளது. அடிக்குறி வரிசை வழங்கப்பட்ட ஆலோசனை உரையைப் பின்பற்றி [b][a] என உள்ளது.
