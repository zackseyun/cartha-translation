id: HEB.9.22
reference: Hebrews 9:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ σχεδὸν ἐν αἵματι πάντα καθαρίζεται κατὰ τὸν νόμον, καὶ χωρὶς αἱματεκχυσίας οὐ γίνεται ἄφεσις.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/022.yaml
  text: And according to the law[a], almost everything is cleansed with blood, and without the shedding of blood there is no forgiveness.
translation:
  language: ta
  text: சட்டத்தின்படி ஏறக்குறைய எல்லாமே இரத்தத்தால் தூய்மையாக்கப்படுகிறது; இரத்தம் சிந்தப்படாமல் மன்னிப்பு[a] உண்டாவதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மன்னிப்பு” என மொழிபெயர்க்கப்பட்ட கிரேக்கச் சொல் “விடுதலை” அல்லது “குற்றமன்னிப்பு” என்றும் பொருள்படலாம்; இங்கு அது பாவமன்னிப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: σχεδόν
  choice: ஏறக்குறைய
  rationale: இந்த வினையடை கூற்றின் எல்லையை வரையறுக்கிறது; சட்டத்தின் கீழுள்ள ஒவ்வொரு தூய்மைப்படுத்தலும் இரத்தத்தால் நிகழ்ந்தது என்று முழுமைப்படுத்தாமல், மூலத்தின் துல்லியமான விதிவிலக்கைத் தக்கவைக்கிறது.
- source_word: ἐν αἵματι
  choice: இரத்தத்தால்
  rationale: ἐν இங்கு கருவிப்பொருளில் வருகிறது. சடங்குமுறைத் தூய்மைப்படுத்தலின் வழிமுறையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: πάντα
  choice: எல்லாமே
  rationale: அஃறிணைப் பன்மையான இச்சொல், சூழலில் பேசப்படும் பொருட்களையும் சடங்குசார் காரியங்களையும் பொதுவாகக் குறிக்கிறது; ‘ஏறக்குறைய’ என்பதால் அதன் எல்லை முறையாக வரையறுக்கப்படுகிறது.
- source_word: καθαρίζεται
  choice: தூய்மையாக்கப்படுகின்றன
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவம், சட்டத்தின்படி வழக்கமாக நடைபெறும் சடங்குசார் தூய்மைப்படுத்தலைக் குறிக்கிறது.
- source_word: κατὰ τὸν νόμον
  choice: சட்டத்தின்படி
  rationale: κατά இங்கு சட்டத்திற்கு ஏற்ப அல்லது அதன் விதிமுறையின்படி என்ற பொருளைத் தருகிறது; ‘மோசேயின்’ என்று மூலத்தில் இல்லாத சொல்லைச் சேர்க்காமல் சூழலின் பொருளைத் தக்கவைக்கிறது.
- source_word: χωρὶς
  choice: இல்லாமல்
  rationale: ஒன்றை விலக்கி அல்லது அது இன்றி என்ற நேரடியான பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: αἱματεκχυσίας
  choice: இரத்தம் சிந்தப்படாமல்
  rationale: பலியுடன் தொடர்புடைய இரத்தம் ஊற்றப்படுதல் அல்லது சிந்தப்படுதல் என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: οὐ γίνεται
  choice: உண்டாவதில்லை
  rationale: மன்னிப்பு நிகழ்வதில்லை அல்லது ஏற்படுவதில்லை என்ற விளைவுசார் பொருளைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: ἄφεσις
  choice: மன்னிப்பு
  rationale: விடுவித்தல் அல்லது குற்றத்தை மன்னித்தல் என்ற பொருள்வட்டம் கொண்ட இச்சொல், இங்குள்ள பாவம் மற்றும் பலி சார்ந்த சூழலில் இயல்பாக ‘மன்னிப்பு’ என அமைகிறது; ‘பாவம்’ என்பதை மூலவாக்கியத்தில் வெளிப்படையாகச் சேர்க்கவில்லை.
theological_decisions:
- issue: பலிசார் சூழலில் ἄφεσις என்பதன் மொழிபெயர்ப்பு
  choice: மன்னிப்பு
  alternative: விடுதலை; குற்றமன்னிப்பு
  rationale: எபிரெயர் நூலின் இப்பகுதி பாவம், பலி, இரத்தம் ஆகியவற்றைப் பற்றிப் பேசுவதால் ‘மன்னிப்பு’ சூழலுக்கு ஏற்ற தெளிவான சொல். அதே நேரத்தில் கிரேக்கச் சொல்லின் விரிந்த ‘விடுதலை’ பொருளை அடிக்குறிப்பில் தக்கவைத்து, ஒரு குறிப்பிட்ட கோட்பாட்டு விளக்கத்தை வாக்கியத்துக்குள் திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தூய்மையாக்கப்படுகின்றன’ என்பது சடங்குசார் பொருளைத் தக்கவைக்கிறது; ‘ஏறக்குறைய’ என்பது மூலத்தின் முக்கியமான வரம்பை வெளிப்படையாகப் பாதுகாக்கிறது. அடிக்குறிப்பு குறி அது விளக்கும் ‘மன்னிப்பு’ என்ற சொல்லுக்குப் பின்னரே வைக்கப்பட்டுள்ளது.
