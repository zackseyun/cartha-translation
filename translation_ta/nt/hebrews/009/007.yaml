reference: Hebrews 9:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰς δὲ τὴν δευτέραν ἅπαξ τοῦ ἐνιαυτοῦ μόνος ὁ ἀρχιερεύς, οὐ χωρὶς αἵματος, ὃ προσφέρει ὑπὲρ ἑαυτοῦ καὶ τῶν τοῦ λαοῦ ἀγνοημάτων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/007.yaml
  text: But into the second room only the high priest enters once a year[a], and not without blood[b], which he offers for himself and for the people's sins committed in ignorance.
translation:
  language: ta
  text: ஆனால் இரண்டாவது அறைக்குள்[a] தலைமை ஆசாரியர் மட்டுமே ஆண்டுக்கு ஒருமுறை நுழைகிறார். அவர் இரத்தமின்றி நுழைவதில்லை; அந்த இரத்தத்தைத் தனக்காகவும் மக்களின் அறியாமையில் செய்த பாவங்களுக்காகவும்[b] செலுத்துகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இரண்டாவது கூடாரத்திற்குள்’ அல்லது ‘இரண்டாவது பகுதிக்குள்’; இது திருக்கூடாரத்தின் உள்ளே இருந்த இரண்டாவது பகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மக்கள் தவறுதலாகச் செய்த பாவங்களுக்காகவும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς δὲ τὴν δευτέραν
  choice: ஆனால் இரண்டாவது அறைக்குள்
  rationale: சூழலில் திருக்கூடாரத்தின் இரண்டாவது உட்பகுதி குறிக்கப்படுகிறது. கிரேக்கத்தில் விடுபட்டுள்ள பெயர்ச்சொல்லைத் தமிழில் இயல்பாகவும் இடவியல் வேறுபாடு தெளிவாகவும் காட்ட ‘அறை’ சேர்க்கப்பட்டது; ‘கூடாரம்’ அல்லது ‘பகுதி’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பு தரப்பட்டது.
- source_word: ἅπαξ τοῦ ἐνιαυτοῦ
  choice: ஆண்டுக்கு ஒருமுறை
  rationale: வருடாந்திர நிகழ்வை இயல்பான நவீன தமிழில் துல்லியமாகக் காட்டுகிறது.
- source_word: μόνος ὁ ἀρχιερεύς
  choice: தலைமைக் குரு மட்டுமே
  rationale: μόνος குறிக்கும் தனியுரிமையைத் தெளிவாகக் காக்கிறது; ‘தலைமைக் குரு’ என்பது ἀρχιερεύς என்பதற்கான இயல்பான, மரியாதையான தமிழ்.
- source_word: οὐ χωρὶς αἵματος
  choice: இரத்தம் இல்லாமல் நுழைவதில்லை
  rationale: கிரேக்கத்தின் மறுப்புவழி வலியுறுத்தலைக் காத்து, வாக்கியத்தில் மறைந்துள்ள நுழைதல் செயலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது. பலியை விளக்கும் சொல்லை மூலத்தில் இல்லாதபடி இங்கே சேர்க்கவில்லை.
- source_word: ὃ προσφέρει
  choice: அதை ... செலுத்துகிறார்
  rationale: προσφέρει என்பதன் பலிசார் பொருளை ‘செலுத்துகிறார்’ இயல்பாக வெளிப்படுத்துகிறது; ὃ என்பது முன் குறிப்பிடப்பட்ட இரத்தத்தைச் சுட்டுவதால் ‘அதை’ பயன்படுத்தப்பட்டது.
- source_word: ὑπὲρ ἑαυτοῦ
  choice: தனக்காக
  rationale: பலிசார் சூழலில் ὑπέρ குறிக்கும் சார்பாக அல்லது நன்மைக்காக என்ற உறவைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: τῶν τοῦ λαοῦ ἀγνοημάτων
  choice: மக்களின் அறியாமையால் செய்த பாவங்களுக்காக
  rationale: ἀγνοήματα என்பது வெறும் தகவல் அறியாமையை அல்ல, அறியாமையிலோ அறியாமையின் காரணமாகவோ நிகழ்ந்த குற்றங்களைச் சுட்டுகிறது. ‘பாவங்கள்’ அதன் ஒழுக்க மற்றும் பலிசார் வலிமையைக் காக்கிறது; ‘தவறுதலாகச் செய்த பாவங்கள்’ என்ற மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: பலிசார் சூழலில் ἀγνοήματα என்பதன் இயல்பு
  choice: அறியாமையால் செய்த பாவங்கள்
  alternative: தவறுதலாகச் செய்த பாவங்கள்; அறியாமையின் செயல்கள்
  rationale: இச்சொல் குற்றத்தன்மையுள்ள செயல்களை அறியாமை அல்லது நோக்கமின்மை என்ற தன்மையோடு விவரிக்கிறது. ‘அறியாமையால் செய்த பாவங்கள்’ என்பது அதன் ஒழுக்க வலிமையைப் பாதுகாக்கிறது; அதேவேளை பிற்கால இறையியல் வகைப்பாட்டை உரைக்குள் திணிக்கவில்லை.
- issue: இரத்தத்தைச் செலுத்துவது யாருக்காக என்பதன் பொருள்
  choice: தனக்காகவும் மக்களின் ... பாவங்களுக்காகவும்
  alternative: தனது சார்பாகவும் மக்களின் சார்பாகவும்
  rationale: ὑπέρ என்பதன் பிரதிநிதித்துவ அல்லது நன்மை சார்ந்த நுணுக்கத்தைத் தீர்மானமாகக் குறுக்காமல், தமிழ் பலிசார் வழக்கில் இயல்பாகத் தருகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் மரியாதையான நடையில் மொழிபெயர்க்கப்பட்டது. பலி மற்றும் ஆசாரியப் பின்னணிக்குரிய சொற்கள் காக்கப்பட்டுள்ளன; கிரேக்கத்தின் சுருக்கமான அமைப்பு தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
