  text: λέγων· Τοῦτο τὸ αἷμα τῆς διαθήκης ἧς ἐνετείλατο πρὸς ὑμᾶς ὁ θεός·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/020.yaml
  text: saying[a], “This is the blood of the covenant that God commanded for you.”
translation:
  language: ta
  text: இவ்வாறு கூறி,[a] “இது தேவன் உங்களுக்குக் கட்டளையிட்ட உடன்படிக்கையின் இரத்தம்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, முந்தைய வாக்கியத்துடனான இலக்கணத் தொடர்பைச் சற்று தளர்த்தி, “இவ்வாறு கூறினார்:”
    reason: λέγων என்பது பங்கேற்புவினை; தமிழில் தொடர்ச்சியைப் பேண ‘கூறி’ எனவும், வாசிப்பின் இயல்புக்காக முற்றுவினையாக ‘கூறினார்’ எனவும் தரலாம்.
lexical_decisions:
- source_word: λέγων
  choice: இவ்வாறு கூறி
  rationale: நிகழ்காலப் பங்கேற்புவினை முந்தைய வசனத்தின் செயலோடு இந்த மேற்கோளை இணைக்கிறது; அதைத் தனி முற்றுவினையாக மாற்றாமல் இயல்பான தமிழில் தருகிறது.
- source_word: Τοῦτο
  choice: இது
  rationale: கிரேக்கத்தில் வெளிப்படையான இணைப்புவினை இல்லாவிட்டாலும், தமிழில் ‘இது ... இரத்தம்’ என்ற பெயர்ப் பயனிலை அமைப்பு இயல்பாகவே ‘இது ... ஆகும்’ என்ற பொருளைத் தருகிறது.
- source_word: αἷμα
  choice: இரத்தம்
  rationale: உடன்படிக்கையை உறுதிப்படுத்தப் பயன்படுத்தப்பட்ட பலியிரத்தத்தைக் குறிக்கும் நேரடியான சொல்; உருவக விளக்கமாக மாற்றப்படவில்லை.
- source_word: διαθήκης
  choice: உடன்படிக்கை
  rationale: யாத்திராகமம் 24 பின்னணியில் இது இறுதி விருப்பாவணத்தைக் குறிக்காமல், தேவனுக்கும் மக்களுக்கும் இடையிலான உடன்படிக்கையைக் குறிக்கிறது.
- source_word: ἧς
  choice: உடன்படிக்கையின்
  rationale: இடப்பெயரின் உரிமைவேற்றுமைத் தொடர்பைத் தமிழில் இயல்பாக முன்வைத்து, ‘தேவன் உங்களுக்குக் கட்டளையிட்ட உடன்படிக்கை’ என்று தெளிவாக்குகிறது.
- source_word: ἐνετείλατο
  choice: கட்டளையிட்ட
  rationale: ἐντέλλομαι என்பதன் நேரடியான, பொதுவாகப் புரியும் பொருள் ‘கட்டளையிடுதல்’ என்பதாகும்.
- source_word: πρὸς ὑμᾶς
  choice: உங்களுக்குக்
  rationale: கட்டளை மக்களிடம் நோக்கி வழங்கப்பட்டதைக் காட்டுகிறது; ‘உங்களுக்காக’ என்று நோக்கப் பொருளை மிகைப்படுத்தாமல், தமிழில் இயல்பான திசை/பெறுநர் தொடர்பைத் தருகிறது.
- source_word: ὁ θεός
  choice: தேவன்
  rationale: θεός என்பதற்கான மரியாதைமிக்க, பொதுவான தமிழ் வேதாகமச் சொல்.
theological_decisions:
- issue: διαθήκη என்பதைக் உடன்படிக்கை உறுதிப்படுத்தும் சூழலில் மொழிபெயர்த்தல்
  choice: உடன்படிக்கை
  alternative: ஏற்பாடு / இறுதி விருப்பாவணம்
  rationale: இந்த வசனம் யாத்திராகமம் 24:8-ஐ எதிரொலிக்கிறது; ஆகவே மோசேயின் உடன்படிக்கையே முன்னிலையில் உள்ளது. சட்டரீதியான இறுதி விருப்பாவணப் பொருளை இங்கு புகுத்தக்கூடாது.
- issue: Τοῦτο என்பதற்குப் பின் உள்ள மறைமுக இணைப்புவினை
  choice: ‘இது ... இரத்தம்’ என்ற தமிழ் பெயர்ப் பயனிலை அமைப்பு
  alternative: ‘இது ... இரத்தமாகும்’
  rationale: தமிழில் வெளிப்படையான ‘ஆகும்’ இல்லாமலேயே வாக்கியம் முழுமையாகவும் இயல்பாகவும் உள்ளது; கிரேக்கத்தில் இல்லாத வினையைத் தேவையின்றிச் சேர்ப்பதை இது தவிர்க்கிறது.
- issue: πρὸς ὑμᾶς என்பதன் உறவு
  choice: உங்களுக்குக் கட்டளையிட்ட
  alternative: உங்களுக்காகக் கட்டளையிட்ட / உங்களை நோக்கிக் கட்டளையிட்ட
  rationale: πρός என்பதன் திசை அல்லது பெறுநர் நுணுக்கத்தைப் பாதுகாத்து, உடன்படிக்கை மக்களுக்கான நன்மை மட்டுமே என ஒருதலைப்பட்சமாக விளக்காமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் மரியாதைமிக்க வேதாகம நடையிலும் வடிவமைக்கப்பட்டது. ‘தேவன்’, ‘உடன்படிக்கை’, ‘இரத்தம்’ ஆகிய முக்கியச் சொற்கள் சுருக்கவோ விளக்கவுரையாக்கவோ செய்யப்படவில்லை; வசனம் முந்தைய சூழலோடு தொடர்வதால் ‘கூறி’ என்ற பங்கேற்புவினைத் தொடர்பு பேணப்பட்டது.
