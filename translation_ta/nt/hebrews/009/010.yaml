source:
  edition: SBLGNT
  text: μόνον ἐπὶ βρώμασιν καὶ πόμασιν καὶ διαφόροις βαπτισμοῖς, ⸀δικαιώματα σαρκὸς μέχρι καιροῦ διορθώσεως ἐπικείμενα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/010.yaml
  text: concerned only with foods and drinks and various washings, fleshly regulations imposed until the time of reformation.
translation:
  language: ta
  text: இவை உணவுகள், பானங்கள், பலவகையான கழுவுதல்கள், சீரமைப்புக் காலம் வரும்வரை விதிக்கப்பட்ட உடல்சார்ந்த ஒழுங்குமுறைகள் ஆகியவற்றை மட்டுமே பற்றியவை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சீரமைப்பு” என்பதை “சரிசெய்தல்” அல்லது “புதிய ஒழுங்கை ஏற்படுத்துதல்” என்றும் பொருள்கொள்ளலாம்.
    reason: διορθώσεως என்ற சொல்லின் பொருள் பரப்பையும் அதன் மீட்புவரலாற்றுச் சுட்டின் இயல்பான தெளிவின்மையையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: βαπτισμοῖς
  choice: கழுவுதல்கள்
  rationale: இங்கு சடங்குசார்ந்த பலவகைக் கழுவுதல்களைக் குறிக்கிறது; வழக்கமான ஞானஸ்நானத்தைக் குறிக்கும் சொல்லாகச் சுருக்காமல், பன்மையையும் சூழலையும் காக்கிறது.
- source_word: δικαιώματα σαρκὸς
  choice: உடல்சார்ந்த ஒழுங்குமுறைகள்
  rationale: δικαιώματα என்பது கடைப்பிடிக்க வேண்டிய விதிமுறைகள் அல்லது ஒழுங்குமுறைகள்; σαρκὸς இங்கு மனித உடலைச் சார்ந்த வெளிப்புறச் சடங்குகளைக் குறிக்கிறது. ‘மாம்சத்துக்குரிய’ என்பது தமிழில் தேவையற்ற ஒழுக்கவியல் பொருளைத் தூண்டக்கூடும்.
- source_word: διορθώσεως
  choice: சீரமைப்பு
  rationale: சரிசெய்தல், ஒழுங்குபடுத்தல், நேராக்குதல் ஆகிய பொருள் நிழல்களை இயல்பான தமிழில் தாங்குகிறது; இறையியல் விளக்கத்தை மொழிபெயர்ப்புக்குள் முன்கூட்டியே நிர்ணயிக்கவில்லை.
- source_word: ἐπικείμενα
  choice: விதிக்கப்பட்ட
  rationale: இந்த ஒழுங்குமுறைகள் ஒரு குறிப்பிட்ட காலம்வரை கட்டாயமாக அமல்படுத்தப்பட்டிருந்ததைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘சீரமைப்புக் காலம்’ எதைச் சுட்டுகிறது?
  choice: சீரமைப்புக் காலம்
  alternative: புதிய ஒழுங்கு ஏற்படும் காலம்
  rationale: மூலச்சொல் நிலைமையைச் சரிசெய்தல் அல்லது ஒழுங்குபடுத்தல் என்ற கருத்தைக் கொண்டுள்ளது; அது குறிக்கும் மீட்புவரலாற்று நிகழ்வை மொழிபெயர்ப்பிலேயே விளக்கி முடிவுசெய்யாமல் அதன் திறந்த தன்மையைப் பாதுகாக்கிறது.
- issue: σαρκὸς என்பதன் இறையியல் நிழல்
  choice: உடல்சார்ந்த
  alternative: மாம்சத்துக்குரிய
  rationale: இச்சூழலில் உள்ளார்ந்த பாவ இயல்பைவிட உணவு, பானம், கழுவுதல் போன்ற வெளிப்புற உடல் சார்ந்த கட்டுப்பாடுகளே முன்னிலையில் உள்ளன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வழிபாட்டு வாசிப்புக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. முந்தைய வசனத்திலிருந்து தொடரும் கிரேக்க வாக்கியத் துண்டை தமிழில் இயல்பாக்க ‘இவை’ சேர்க்கப்பட்டது; அர்த்தம் விரிவாக்கப்படவில்லை.
