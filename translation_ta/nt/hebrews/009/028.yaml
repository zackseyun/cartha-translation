id: HEB.9.28
reference: Hebrews 9:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὕτως καὶ ὁ Χριστός, ἅπαξ προσενεχθεὶς εἰς τὸ πολλῶν ἀνενεγκεῖν ἁμαρτίας, ἐκ δευτέρου χωρὶς ἁμαρτίας ὀφθήσεται τοῖς αὐτὸν ἀπεκδεχομένοις εἰς σωτηρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/028.yaml
  text: so also the Messiah[a], having been offered once to bear the sins of many, will appear a second time, apart from sin, to those who eagerly await him, for salvation.
translation:
  language: ta
  text: அவ்வாறே மேசியாவும், பலருடைய பாவங்களைச் சுமப்பதற்காக ஒரே முறை பலியாகச் செலுத்தப்பட்டு, பாவத்துடன் தொடர்பின்றி இரண்டாம் முறை, அவரை ஆவலுடன் எதிர்பார்த்துக் காத்திருப்பவர்களுக்கு இரட்சிப்புக்காகத் தோன்றுவார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως καὶ
  choice: அவ்வாறே ...வும்
  rationale: முந்தைய வசனத்தின் ஒப்புமையைத் தொடரும் ஒப்பீட்டு வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὁ Χριστός
  choice: மேசியா
  rationale: Χριστός இங்கு வெறும் பெயராக அல்லாமல் இரட்சிப்பு வரலாற்றைச் சார்ந்த பட்டமாகச் செயல்படுவதால், அதன் பட்டப் பொருள் காக்கப்படுகிறது.
- source_word: ἅπαξ
  choice: ஒரே முறை
  rationale: ‘ஒருமுறை’ என்ற நேரடியான பொருளைத் தருகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘என்றென்றைக்குமாக’ போன்ற கருத்தைச் சேர்க்கவில்லை.
- source_word: προσενεχθεὶς
  choice: பலியாகச் செலுத்தப்பட்டார்
  rationale: பலிசார் சூழலைத் தெளிவாகக் காட்டுவதோடு, மூலத்தின் இறந்தகாலச் செயலப்பாட்டு வடிவத்தையும் காக்கிறது; ‘தம்மையே செலுத்தினார்’ என்ற வெளிப்படையற்ற தற்சுட்டுப் பொருளைச் சேர்க்கவில்லை.
- source_word: εἰς τὸ πολλῶν ἀνενεγκεῖν ἁμαρτίας
  choice: பலருடைய பாவங்களைச் சுமப்பதற்காக
  rationale: நோக்கத்தையும், பாவங்களை ‘சுமத்தல்’ என்ற பலிசார் மற்றும் ஏசாயா நூலை நினைவூட்டும் சொல்லாட்சியையும் காக்கிறது.
- source_word: ἐκ δευτέρου
  choice: இரண்டாம் முறை
  rationale: முதல் பலியிடுதலுடன் வேறுபடுத்தப்படும் அடுத்த தோற்றத்தை நேரடியாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: χωρὶς ἁμαρτίας
  choice: பாவம் சம்பந்தமின்றி
  rationale: சுருக்கமான கிரேக்கச் சொற்றொடரின் ‘பாவத்திலிருந்து தனியே/பாவத்தோடு தொடர்பின்றி’ என்ற பொருளைத் தருகிறது; அதை முதன்மை உரையிலேயே ‘பாவத்தைச் சுமப்பதற்காக அல்லாமல்’ என்று முழுமையாக விளக்கித் தீர்க்காமல், அடிக்குறிப்பில் அந்தச் சூழற்பொருளை வழங்குகிறது.
- source_word: ὀφθήσεται
  choice: தோன்றுவார்
  rationale: எதிர்காலத்தில் காணப்படுதல் அல்லது வெளிப்படுதல் என்ற இறுதிக்காலத் தோற்ற மொழியை இயல்பான தமிழில் தருகிறது.
- source_word: τοῖς αὐτὸν ἀπεκδεχομένοις
  choice: தமக்காக ஆவலுடன் காத்திருப்பவர்களுக்கு
  rationale: ἀπεκδέχομαι என்பதிலுள்ள எதிர்பார்ப்பும் ஆவலான காத்திருப்பும் இரண்டையும் வெளிப்படுத்துகிறது.
- source_word: εἰς σωτηρίαν
  choice: இரட்சிப்புக்காக
  rationale: εἰς குறிக்கும் இலக்கு அல்லது நோக்கத்தைச் சுருக்கமாகக் காக்கிறது; ‘இரட்சிப்பைக் கொண்டுவர’ என்று மூலத்தை விரிவுபடுத்தவில்லை.
theological_decisions:
- issue: இரண்டாம் தோற்றத்தில் χωρὶς ἁμαρτίας என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘பாவம் சம்பந்தமின்றி’ என்று சுருக்கமாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘பாவத்தைச் சுமப்பதற்காக அல்லாமல்’ அல்லது ‘பாவத்தைப் பற்றிய நோக்கமின்றி’.
  rationale: இரண்டாம் தோற்றம் முதல் பலியைப் போல பாவத்தைச் சுமப்பதற்கானது அல்ல என்பது சூழற்பொருள். ஆயினும் கிரேக்கத்தின் சுருக்கத்தையும் இறையியல் பதற்றத்தையும் முதன்மை உரையில் காத்து, தெளிவான விளக்கத்தை அடிக்குறிப்பில் தருவது மிகை விளக்கத்தைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகமச் செறிவும் காக்கப்பட்டுள்ளன. நீண்ட கிரேக்க வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டது. ‘மேசியா’, ‘இரட்சிப்பு’, ‘பலியாகச் செலுத்தப்பட்டார்’ போன்ற சொற்கள் பொதுவாக அறியப்படும் இறையியல் மொழியைப் பயன்படுத்தினாலும் எந்தச் சமயப் பிரிவின் தனிப்பட்ட விளக்கத்தையும் புகுத்தவில்லை.
