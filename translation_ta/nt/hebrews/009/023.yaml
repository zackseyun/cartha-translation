reference: Hebrews 9:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἀνάγκη οὖν τὰ μὲν ὑποδείγματα τῶν ἐν τοῖς οὐρανοῖς τούτοις καθαρίζεσθαι, αὐτὰ δὲ τὰ ἐπουράνια κρείττοσι θυσίαις παρὰ ταύτας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/023.yaml
  text: Therefore it was necessary for the copies of the things in the heavens to be cleansed with these[c][b][a], but the heavenly things themselves with better sacrifices than these.
translation:
  language: ta
  text: ஆகவே, பரலோகங்களில் உள்ளவற்றின் பிரதிகள்[a] இவற்றால் தூய்மையாக்கப்படுவது[b] அவசியமாயிருந்தது; ஆனால் பரலோகத்துக்குரியவை தாமோ, இவற்றைவிட மேலான பலிகளால்[c] தூய்மையாக்கப்பட வேண்டியிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘மாதிரிகள்’ அல்லது ‘பிரதிநிதித்துவங்கள்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘சுத்திகரிக்கப்படுவது.’ இங்கு வரும் வினைச்சொல் சடங்குமுறைத் தூய்மையாக்கத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: கிரேக்க மூலத்தில் ‘பலிகள்’ என்பது பன்மையில் உள்ளது; எபிரெயர் நூலின் சூழல் மேசியாவின் ஒரேமுறை செய்யப்பட்ட பலியை மையப்படுத்தினாலும், இங்கு பன்மையே பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνάγκη οὖν
  choice: ஆகவே ... அவசியமாயிருந்தது
  rationale: οὖν முந்தைய கருத்திலிருந்து வரும் முடிவைக் குறிக்கிறது. Ἀνάγκη என்பதன் ஆளற்ற அவசியப் பொருளை இயல்பான தமிழில் கடந்தகால வாதச் சூழலுக்கு ஏற்றவாறு தருகிறது.
- source_word: ὑποδείγματα
  choice: பிரதிகள்
  rationale: பரலோகத்தில் உள்ளவற்றுடன் ஒத்த தொடர்புடைய பூமிக்குரிய வழிபாட்டு அமைப்புகளைச் சுட்டுகிறது. பின்னர் வரும் உண்மையான பரலோகத்துக்குரியவற்றுடனான வேறுபாட்டையும் தெளிவாக வைத்திருக்கிறது.
- source_word: τῶν ἐν τοῖς οὐρανοῖς
  choice: பரலோகங்களில் உள்ளவற்றின்
  rationale: οὐρανοῖς என்பதன் பன்மையைப் பாதுகாத்து, பின்னர் வரும் ἐπουράνια என்ற பெயரடையிலிருந்து இச்சொற்றொடரை வேறுபடுத்துகிறது.
- source_word: τούτοις καθαρίζεσθαι
  choice: இவற்றால் தூய்மையாக்கப்படுவது
  rationale: τούτοις கருவிப் பொருளில் முன் கூறப்பட்ட பூமிக்குரிய பலியிடும் ஏற்பாடுகளைக் குறிக்கிறது. καθαρίζεσθαι என்பதன் சடங்குசார் தூய்மைப்படுத்தும் பொருளைத் தக்கவைக்கிறது.
- source_word: αὐτὰ δὲ τὰ ἐπουράνια
  choice: ஆனால் பரலோகத்துக்குரியவை தாமோ
  rationale: αὐτά தரும் அழுத்தத்தை ‘தாமோ’ வெளிப்படுத்துகிறது; ἐπουράνια என்பதை விளக்கவுரை சேர்க்காமல் பொதுவான ‘பரலோகத்துக்குரியவை’ என வழங்குகிறது.
- source_word: κρείττοσι θυσίαις παρὰ ταύτας
  choice: இவற்றைவிட மேலான பலிகளால்
  rationale: παρά உடனான ஒப்பீட்டையும் κρείττοσι என்பதன் மேன்மைப் பொருளையும் தெளிவாகத் தருகிறது; θυσίαις என்பதன் பன்மையை ஒருமையாக்காமல் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘பரலோகத்துக்குரியவை’ தூய்மையாக்கப்படுதல்
  choice: பரலோகத்துக்குரியவை தாமும் தூய்மையாக்கப்பட வேண்டியிருந்ததாக மூலத்தின் சடங்குசார் மொழியை அப்படியே வைத்தல்
  alternative: இதைப் பரலோகப் பரிசுத்த இடம் அல்லது பரலோக மக்களைக் குறிக்கிறது என்று விளக்கிப் பெயர்த்தல்
  rationale: மூலம் பூமிக்குரிய பிரதிகளையும் பரலோகத்துக்குரியவற்றையும் நேரடியாக எதிர்நிறுத்தி, இரண்டுக்கும் தூய்மையாக்கும் மொழியைப் பயன்படுத்துகிறது. அதன் இறையியல் பதற்றத்தை மொழிபெயர்ப்பு தீர்த்துவிடவில்லை.
- issue: கிறிஸ்துவின் ஒரே பலியுடன் தொடர்புடைய ‘பலிகள்’ என்ற பன்மை
  choice: θυσίαις என்பதற்கேற்ப ‘பலிகள்’ என்ற பன்மையை வைத்தல்
  alternative: எபிரெயர் நூலின் ஒரேமுறை பலியிடுதல் கருத்துடன் ஒத்திசைக்க ‘பலி’ என்று ஒருமையில் வழங்குதல்
  rationale: இவ்வசனத்தின் கிரேக்க உரை பன்மையைப் பயன்படுத்துவதால், வேறு இடங்களின் இறையியல் வலியுறுத்தலுக்காக இதை ஒருமையாக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பேணுகிறது. ‘தாமோ’ என்ற வடிவம் αὐτά தரும் அழுத்தத்தையும் இரு பகுதிகளின் எதிர்மறை இணைப்பையும் இயல்பாக வெளிப்படுத்துகிறது. ‘தூய்மையாக்கப்பட வேண்டியிருந்தது’ என்ற இரண்டாம் பகுதியின் விரிப்பு, கிரேக்கத்தில் விடுபட்டுள்ள வினைக் கருத்தை தமிழில் தெளிவாக்குகிறது.
