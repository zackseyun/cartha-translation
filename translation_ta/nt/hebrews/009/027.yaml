  text: And just as it is appointed for men to die once[a], and after this, judgment,
translation:
  language: ta
  text: மனிதர்கள் ஒருமுறை இறக்க நியமிக்கப்பட்டிருப்பதுபோலவும், அதற்குப் பிறகு நியாயத்தீர்ப்பு இருப்பதுபோலவும்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθ’ ὅσον
  choice: …போலவே
  rationale: இச்சொற்றொடர் அளவைக் குறிப்பதற்குப் பதிலாக, அடுத்த வசனத்தில் தொடரும் ஒப்பீட்டை அறிமுகப்படுத்துகிறது. தமிழில் வாக்கிய இறுதியில் ‘போலவே’ என்பது அந்தத் தொடர்ச்சியை இயல்பாகக் காட்டுகிறது.
- source_word: ἀπόκειται
  choice: நியமிக்கப்பட்டிருப்பது
  rationale: இறப்பது மனிதர்களுக்கு நிலையாக நிர்ணயிக்கப்பட்டுள்ளது என்ற பொருளைத் தருகிறது; ‘சேமித்து வைக்கப்பட்டுள்ளது’ என்ற அடிப்படை உருவகத்தை இச்சூழலில் நேரடியாக மொழிபெயர்ப்பது இயல்பாக இருக்காது.
- source_word: τοῖς ἀνθρώποις
  choice: மனிதர்கள்
  rationale: இங்கு கிரேக்கச் சொல் ஆண்களை மட்டும் அல்லாமல் மனிதகுலத்தைப் பொதுவாகக் குறிக்கிறது. ‘மனிதர்கள்’ அந்தப் பொதுப்பொருளைத் தமிழில் துல்லியமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἅπαξ
  choice: ஒருமுறை
  rationale: மனித இறப்பு ஒரே முறை நிகழ்வதைக் குறிக்கும் எளிய, நேரான மொழிபெயர்ப்பு; ‘ஒரே முறையாக என்றென்றைக்கும்’ போன்ற மிகைப்படுத்தலைத் தவிர்க்கிறது.
- source_word: ἀποθανεῖν
  choice: இறப்பதும்
  rationale: வினையெச்சப் பெயராக்கம் தமிழில் ‘நியமிக்கப்பட்டிருப்பது’ என்பதுடன் இயல்பாக இணைகிறது.
- source_word: μετὰ δὲ τοῦτο
  choice: அதற்குப் பிறகு
  rationale: இறப்புக்கும் நியாயத்தீர்ப்புக்கும் இடையிலான வரிசையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: κρίσις
  choice: நியாயத்தீர்ப்பு
  rationale: நீதிசார் மதிப்பீட்டைக் குறிக்கிறது. ‘தண்டனைத் தீர்ப்பு’ என மொழிபெயர்ப்பது முடிவை முன்கூட்டியே குறுகலாக்கிவிடும்.
theological_decisions:
- issue: τοῖς ἀνθρώποις என்பதன் பொதுமனிதக் குறிப்பு
  choice: ‘மனிதர்கள்’ என்று அனைவரையும் உள்ளடக்கும் வகையில் மொழிபெயர்க்கப்பட்டது
  alternative: ‘ஆண்கள்’
  rationale: கிரேக்க வடிவம் இலக்கண ரீதியாக ஆண்பால் பன்மையாக இருந்தாலும், இச்சூழலில் மனிதகுலம் முழுவதையும் பொதுவாகக் குறிக்கிறது. தமிழ் ‘மனிதர்கள்’ அந்தப் பொருளைத் தவறான பாலினக் கட்டுப்பாடின்றி தெரிவிக்கிறது.
- issue: இறப்புக்குப் பிந்தைய κρίσις என்பதன் பரப்பு
  choice: ‘நியாயத்தீர்ப்பு’ என்று மட்டும் மொழிபெயர்க்கப்பட்டது
  alternative: ‘தண்டனைத் தீர்ப்பு’ அல்லது ‘இறுதி நியாயத்தீர்ப்பு’
  rationale: இவ்வசனம் இறப்புக்குப் பிறகு நியாயத்தீர்ப்பு இருப்பதாகக் கூறுகிறது; அதன் முடிவையோ முழு இறுதிக்கால ஒழுங்கையோ இங்கே விரிவாக வரையறுப்பதில்லை. ஆகவே கூடுதல் கோட்பாட்டு விவரங்கள் சேர்க்கப்படவில்லை.
- issue: வசனம் 10:28-இல் நிறைவடையும் ஒப்பீடு
  choice: வசன இறுதியில் ‘போலவே’ வைத்து திறந்த ஒப்பீடாகப் பாதுகாக்கப்பட்டது
  alternative: இவ்வசனத்தை முற்றுப்பெற்ற தனி அறிவிப்பாக அமைத்தல்
  rationale: καθ’ ὅσον அடுத்த வசனத்தின் ஒப்பீட்டு நிறைவை எதிர்நோக்குகிறது. மூலத்தின் வாக்கிய ஓட்டமும் இறையியல் ஒப்பீடும் துண்டிக்கப்படாமல் வைக்கப்பட்டன.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘நியமிக்கப்பட்டிருப்பது’ மற்றும் ‘நியாயத்தீர்ப்பு’ ஆகியவை வேதப்பொருளின் எடையைத் தக்கவைத்தாலும், வாக்கிய அமைப்பு இயல்பான தமிழில் வைக்கப்பட்டுள்ளது. ‘வருவதும்’ என்பது கிரேக்கத்தில் வெளிப்படையாக இல்லாத இணைப்புவினையை தமிழின் இலக்கணத் தெளிவுக்காக மிகக் குறைந்த அளவில் நிரப்புகிறது; நியாயத்தீர்ப்பின் தன்மையையோ முடிவையையோ அது விளக்கிச் சேர்ப்பதில்லை.
