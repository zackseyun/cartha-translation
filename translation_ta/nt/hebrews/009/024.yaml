revisions:
- from: ஏனெனில், மேசியா மனிதக் கைகளால் செய்யப்பட்ட பரிசுத்த இடங்களுக்குள்—மெய்யானவற்றின் பிரதிகளுக்குள்—நுழையவில்லை; மாறாக, இப்போது நமக்காகக் கடவுளின் முன்னிலையில் தோன்றும்படி, பரலோகத்திற்குள்ளேயே நுழைந்தார்.[a]
  to: ஏனெனில், மேசியா மெய்யானவற்றின் பிரதிகளான, மனிதக் கைகளால் செய்யப்பட்ட பரிசுத்த இடங்களுக்குள் நுழையவில்லை; மாறாக, பரலோகத்திற்குள்ளேயே நுழைந்தார்; இப்போது நமது சார்பாகக் கடவுளின் முன்னிலையில் தோன்றுவதற்காக.[a]
  rationale: 'திருத்தம் பொருளை மாற்றாமல் இரண்டு அம்சங்களைச் சரிசெய்கிறது: (1) ὑπὲρ ἡμῶν என்பதன் சார்புநிலைப் பொருளை ‘நமது சார்பாக’ எனத் தெளிவாக்குகிறது; (2) ἐμφανισθῆναι குறிக்கும் நோக்கத்தை ‘தோன்றுவதற்காக’ என வாக்கியத்தின் இறுதியில் அமைத்து வாசிப்பை இயல்பாக்குகிறது. ἀντίτυπα τῶν ἀληθινῶν என்பதன் இணைநிலைத் தொடர்பு ‘மெய்யானவற்றின் பிரதிகளான’ எனத் தெளிவாக வைக்கப்பட்டுள்ளது.'
