source:
  edition: SBLGNT
  text: οὐ γὰρ εἰς χειροποίητα ⸂εἰσῆλθεν ἅγια⸃ Χριστός, ἀντίτυπα τῶν ἀληθινῶν, ἀλλ’ εἰς αὐτὸν τὸν οὐρανόν, νῦν ἐμφανισθῆναι τῷ προσώπῳ τοῦ θεοῦ ὑπὲρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/024.yaml
  text: For Messiah did not enter into holy places made by hands[a], copies of the true things, but into heaven itself[c][b], now to appear in the presence of God on our behalf.
translation:
  language: ta
  text: ஏனெனில், மேசியா மெய்யானவற்றின் பிரதிகளான, மனிதக் கைகளால் செய்யப்பட்ட பரிசுத்த இடங்களுக்குள் நுழையவில்லை; மாறாக, பரலோகத்திற்குள்ளேயே நுழைந்தார்; இப்போது நமது சார்பாகக் கடவுளின் முன்னிலையில் தோன்றுவதற்காக.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கடவுளின் முன்னிலையில்” என்பது சொல்லடியாக “கடவுளின் முகத்திற்கு முன்பாக” என்று வரும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστός
  choice: மேசியா
  rationale: இங்கு ஆசாரியப் பணியையும் நிறைவேற்றுதலையும் குறிக்கும் பட்டப்பெயர் உணர்வு செயல்படுவதால், பெயர்போல ஒலிக்கும் ‘கிறிஸ்து’ என்பதற்குப் பதிலாக பட்டத்தின் பொருளைத் தெளிவாகக் காட்டும் ‘மேசியா’ பயன்படுத்தப்பட்டது.
- source_word: χειροποίητα
  choice: மனிதக் கைகளால் செய்யப்பட்ட
  rationale: மனிதர் உருவாக்கிய பூமிக்குரிய பரிசுத்த இடங்களுக்கும் பரலோக மெய்ம்மைக்கும் இடையிலான வேறுபாட்டை இயல்பான தமிழில் காக்கிறது.
- source_word: ἅγια
  choice: பரிசுத்த இடங்கள்
  rationale: கிரேக்கப் பன்மையைப் பாதுகாத்து, கூடாரம்/ஆலயம் சார்ந்த புனிதப் பகுதிகளைக் குறிக்கிறது; ஒரே குறிப்பிட்ட அறையாக அர்த்தத்தைச் சுருக்கவில்லை.
- source_word: ἀντίτυπα
  choice: பிரதிகள்
  rationale: பூமிக்குரிய பரிசுத்த இடங்கள் பரலோக மெய்ம்மைகளுக்கு ஒத்த வடிவங்களாக இருப்பதைச் சுருக்கமாகக் காட்டுகிறது; ‘ஒத்த வடிவங்கள்’ அல்லது ‘சித்தரிப்புகள்’ என்ற நுணுக்கமும் சாத்தியம்.
- source_word: τῶν ἀληθινῶν
  choice: மெய்யானவற்றின்
  rationale: கிரேக்க மொழியின் பெயர்ச்சொல் தன்மையுடைய பன்மையைப் பாதுகாக்கிறது; இங்கு வெறுமனே உண்மையான கூற்றுகள் அல்ல, இறுதியான பரலோக மெய்ம்மைகள் குறிக்கப்படுகின்றன.
- source_word: αὐτὸν τὸν οὐρανόν
  choice: பரலோகத்திற்குள்ளேயே
  rationale: αὐτόν தரும் வலியுறுத்தலை ‘-ஏ’ மூலம் காட்டி, பூமிக்குரிய பிரதிக்கு மாறாக பரலோகத்திற்கே நுழைந்தார் என்பதைத் தெளிவாக்குகிறது.
- source_word: νῦν
  choice: இப்போது
  rationale: அவருடைய பரலோகத் தோற்றத்தின் தற்போதைய முக்கியத்துவத்தைக் குறிக்கும் காலச் சொல்லை அப்படியே காக்கிறது.
- source_word: ἐμφανισθῆναι
  choice: தோன்றும்படி
  rationale: நுழைந்ததன் நோக்கத்தை இயல்பாகத் தெரிவிக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘தம்மை முன்னிறுத்த’ போன்ற பிரதிபெயர்ச் சொல்லைச் சேர்க்கவில்லை.
- source_word: τῷ προσώπῳ τοῦ θεοῦ
  choice: கடவுளின் முன்னிலையில்
  rationale: ‘கடவுளின் முகத்திற்கு முன்பாக’ என்ற சொல்லடியான சொற்றொடரின் தனிப்பட்ட அணுகலை இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: ὑπὲρ ἡμῶν
  choice: நமக்காக
  rationale: நமது சார்பில் அவர் தோன்றும் பிரதிநிதித்துவ மற்றும் ஆசாரியப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ἅγια என்பதற்கான வழிபாட்டு மொழிநடை
  choice: பரிசுத்த இடங்கள்
  alternative: பரிசுத்த ஸ்தலம்; பரிசுத்த இடம்
  rationale: கிரேக்கத்தில் பன்மை இருப்பதால் அதைத் தக்கவைத்து, குறிப்பிட்ட ஓர் அறையாக பொருளை முன்கூட்டியே குறுக்காமல் கூடாரத்தின் புனிதப் பகுதிகள் என்ற படிமத்தைப் பாதுகாக்கிறது.
- issue: Χριστός என்ற கிறிஸ்தியல் பட்டம்
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இந்தச் சூழலில் அபிஷேகம் பெற்றவரின் மீட்புப் பட்டமும் ஆசாரிய நிறைவேற்றமும் முன்னிலையிலுள்ளதால், பட்டத்தின் பொருளை வெளிப்படுத்தும் மொழிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
- issue: ὑπὲρ ἡμῶν என்பதன் பிரதிநிதித்துவ வலிமை
  choice: நமக்காக
  alternative: நமது சார்பாக
  rationale: தமிழில் இயல்பாக இருந்து, அவர் நமது நன்மைக்காகவும் நமது சார்பிலும் கடவுள்முன் தோன்றுகிறார் என்ற ஆசாரியப் பொருளைத் தக்கவைக்கிறது; குறிப்பிட்ட பரிகாரக் கோட்பாட்டை வசனத்திற்குள் சேர்ப்பதில்லை.
- issue: τῷ προσώπῳ τοῦ θεοῦ என்ற உருவகம்
  choice: கடவுளின் முன்னிலையில்
  alternative: கடவுளின் முகத்திற்கு முன்பாக
  rationale: மூல உருவகத்தின் பொருளான நேரடி தெய்வீக முன்னிலையைத் தெளிவாகக் கொடுக்கிறது; சொல்லடியான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டது. ‘பரிசுத்த இடங்கள்,’ ‘பிரதிகள்,’ ‘மெய்யானவை’ ஆகியவை எபிரெயர் நூலின் வழிபாட்டு மற்றும் பூமி–பரலோகம் சார்ந்த எதிர்வை காக்கின்றன. வாக்கியத்தின் நீளம் கட்டுப்படுத்த இடைச்செருகல் கோடுகள் பயன்படுத்தப்பட்டன; ஆனால் மூலத்தின் தர்க்க ஒழுங்கு மாற்றப்படவில்லை.
