id: HEB.9.15
reference: Hebrews 9:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ διὰ τοῦτο διαθήκης καινῆς μεσίτης ἐστίν, ὅπως θανάτου γενομένου εἰς ἀπολύτρωσιν τῶν ἐπὶ τῇ πρώτῃ διαθήκῃ παραβάσεων τὴν ἐπαγγελίαν λάβωσιν οἱ κεκλημένοι τῆς αἰωνίου κληρονομίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/015.yaml
  text: And for this reason he is the mediator of a new covenant[a], so that, since a death has occurred for the redemption of the transgressions committed under the first covenant, those who have been called may receive the promise of the eternal inheritance.
translation:
  language: ta
  text: இதன் காரணமாக, முதல் உடன்படிக்கையின்கீழ் செய்யப்பட்ட மீறுதல்களிலிருந்து மீட்புக்காக ஒரு மரணம் நிகழ்ந்திருப்பதன் மூலம், அழைக்கப்பட்டவர்கள் நித்தியச் சுதந்தரத்தின் வாக்குத்தத்தத்தைப் பெற்றுக்கொள்ளும்படி, அவர் புதிய உடன்படிக்கையின்[a] நடுவராக இருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உடன்படிக்கை’ என்பதற்குப் பதிலாக ‘உயில்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் διαθήκη இவ்விரு பொருள்களையும் கொள்ளக்கூடும்; எபிரெயர் 9:16–17 இந்தப் பொருள் ஒட்டுமையை விரிவாகப் பயன்படுத்துகிறது. எனினும், இவ்வசனத்தில் முதல் உடன்படிக்கையோடு செய்யப்படும் ஒப்பீட்டிற்கு ‘உடன்படிக்கை’ என்பதே சிறப்பாகப் பொருந்துகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: இதனால்தான்
  rationale: முந்தைய வாதத்துடன் இவ்வசனத்தை இணைக்கும் காரணத் தொடர்பை இயல்பான நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: διαθήκης καινῆς
  choice: புதிய உடன்படிக்கையின்
  rationale: சுற்றியுள்ள பகுதியில் முதல் உடன்படிக்கையோடு செய்யப்படும் ஒப்பீட்டிற்கு ‘உடன்படிக்கை’ மிகச் சிறப்பாகப் பொருந்துகிறது; ‘ஏற்பாடு/உயில்’ என்ற பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: μεσίτης
  choice: நடுவர்
  rationale: இரு தரப்பினருக்கிடையில் நின்று உடன்படிக்கை உறவைச் செயல்படுத்துபவரைத் துல்லியமாகவும் வாசகர்களுக்குப் புரியும் வகையிலும் குறிக்கிறது.
- source_word: ὅπως
  choice: பெற்றுக்கொள்ளும்படி
  rationale: நோக்கம் அல்லது எதிர்பார்க்கப்பட்ட விளைவைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: θανάτου γενομένου
  choice: ஒரு மரணம் நிகழ்ந்திருப்பதால்
  rationale: மரணம் நிகழ்ந்துவிட்ட நிறைவு நிலையையும், தொடர்ந்து சொல்லப்படுவதற்கான அதன் காரண அடிப்படையையும் பாதுகாக்கிறது; கிரேக்கத்தில் உள்ள பொதுவான ‘ஒரு மரணம்’ என்ற வடிவை உடனடியாக ‘அவருடைய மரணம்’ என விளக்கிவிடவில்லை.
- source_word: ἀπολύτρωσιν
  choice: மீட்பதற்காக
  rationale: விலை செலுத்தப்பட்ட விடுதலை என்ற பலியியல் சூழலை இயல்பான வினை வடிவில் வெளிப்படுத்துகிறது.
- source_word: τῶν ἐπὶ τῇ πρώτῃ διαθήκῃ παραβάσεων
  choice: முதல் உடன்படிக்கையின்கீழ் செய்யப்பட்ட மீறுதல்களிலிருந்து
  rationale: ἐπί + dative தரும் ‘கீழ்/ஆட்சிப் பரப்பில்’ என்ற உறவைப் பாதுகாக்கிறது; ἀπολύτρωσις உடனான தொடர்பைத் தமிழில் தெளிவாக்க ‘-இலிருந்து’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: τὴν ἐπαγγελίαν
  choice: வாக்குத்தத்தத்தை
  rationale: ஒருமை பெயர்ச்சொல்லைப் பாதுகாத்து, தொடர்ந்து வரும் நித்திய உரிமைச்சொத்தோடு அதன் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: λάβωσιν
  choice: பெற்றுக்கொள்ளும்படி
  rationale: ὅπως உடன் வரும் நோக்கம்/விளைவை இயல்பான தமிழில் காட்டுகிறது.
- source_word: οἱ κεκλημένοι
  choice: அழைக்கப்பட்டவர்கள்
  rationale: அழைப்பு பெற்ற நிலையில் இருப்பவர்களைக் குறிக்கும் perfect passive participle-இன் பொருளைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: τῆς αἰωνίου κληρονομίας
  choice: நித்திய உரிமைச்சொத்தின்
  rationale: நிலைத்திருக்கும் பரம்பரை உரிமை அல்லது சுதந்தரத்தைத் துல்லியமாகக் குறிக்கிறது; தற்காலிகமானவற்றுக்கு எதிரான எபிரெயர் நூலின் கருத்தோட்டத்திற்கும் பொருந்துகிறது.
theological_decisions:
- issue: ἐστίν என்பதன் மறைமுக எழுவாய்
  choice: ‘அவர்’ என்று வெளிப்படையாக வழங்கப்பட்டது; உடனடியான சூழலில் இது கிறிஸ்து/இயேசுவைக் குறிக்கிறது.
  alternative: எழுவாயைச் சேர்க்காமல் விடுதல்
  rationale: தமிழ் வாக்கியத்தில் தெளிவுக்கு எழுவாய் தேவை; முந்தைய சூழல் அதன் முன்னிலையைத் தெளிவாக அளிப்பதால் புதிய கோட்பாட்டுப் பொருள் சேர்க்கப்படவில்லை.
- issue: இவ்வசனத்தில் διαθήκη என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘உடன்படிக்கை’
  alternative: ‘ஏற்பாடு’ அல்லது ‘உயில்’
  rationale: முதல் மற்றும் புதிய உடன்படிக்கைகளின் முரணே இவ்வசனத்தின் உடனடி சூழல். அதே நேரத்தில் 9:16–17-இல் பயன்படும் ‘உயில்/ஏற்பாடு’ சார்ந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: θανάτου γενομένου என்பதில் மரணத்தின் அடையாளம்
  choice: ‘ஒரு மரணம் நிகழ்ந்திருப்பதால்’ என்று மூலத்தின் பொதுவான வடிவம் பாதுகாக்கப்பட்டது.
  alternative: ‘அவருடைய மரணம் நிகழ்ந்திருப்பதால்’ அல்லது ‘கிறிஸ்து இறந்ததால்’
  rationale: சூழல் கிறிஸ்துவின் மரணத்தைச் சுட்டினாலும், கிரேக்க வாசகம் இங்கே உரிமைச் சுட்டுப்பெயரையோ பெயரையோ பயன்படுத்தவில்லை; எனவே விளக்கத்தை முதன்மை உரையில் தேவையின்றி அதிகரிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. ‘நடுவர்’, ‘உடன்படிக்கை’, ‘வாக்குத்தத்தம்’, ‘நித்திய உரிமைச்சொத்து’ ஆகியவை வேதாகமக் கருத்தின் துல்லியத்தைப் பாதுகாக்கும் பரவலாக அறியப்பட்ட சொற்களாகத் தேர்ந்தெடுக்கப்பட்டன. நீண்ட கிரேக்க வாக்கியத்தின் தர்க்கத் தொடர்பு தெளிவாக இருக்க ‘அவர் நடுவராக இருக்கிறார்’ என்பது இறுதியில் மீண்டும் கூறப்பட்டுள்ளது.
