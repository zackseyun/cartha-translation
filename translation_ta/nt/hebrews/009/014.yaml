revisions:
- from: அப்படியானால், நித்திய ஆவியின் வழியாகத் தம்மையே குறைபாடற்ற பலியாகக் கடவுளுக்கு ஒப்புக்கொடுத்த மேசியாவின் இரத்தம், உயிருள்ள கடவுளுக்குப் பணிசெய்வதற்காக நம் மனச்சாட்சியைச் செத்த செயல்களிலிருந்து எவ்வளவு அதிகமாகத் தூய்மைப்படுத்தும்![a]
  to: நித்திய ஆவியின்[a] மூலம் குறைபாடற்றவராகத் தம்மையே கடவுளுக்கு ஒப்புக்கொடுத்த மேசியாவின் இரத்தம், நம் மனச்சாட்சியைச் செத்த செயல்களிலிருந்து உயிருள்ள கடவுளுக்குப் பணிசெய்வதற்காக எவ்வளவு அதிகமாகத் தூய்மைப்படுத்தும்!
  rationale: The revision renders the reflexive offering and ‘without blemish’ directly, without adding ‘as a sacrifice’; preserves the future comparative question; retains the established literal expression ‘செத்த செயல்கள்’; and relocates the ambiguity footnote to its precise source phrase.
