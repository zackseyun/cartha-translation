id: HEB.9.14
reference: Hebrews 9:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πόσῳ μᾶλλον τὸ αἷμα τοῦ Χριστοῦ, ὃς διὰ πνεύματος αἰωνίου ἑαυτὸν προσήνεγκεν ἄμωμον τῷ θεῷ, καθαριεῖ τὴν συνείδησιν ⸀ἡμῶν ἀπὸ νεκρῶν ἔργων εἰς τὸ λατρεύειν θεῷ ζῶντι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/014.yaml
  text: how much more will the blood of Messiah—who through the eternal Spirit offered himself without blemish to God—cleanse our conscience from dead works to serve the living God[a].
translation:
  language: ta
  text: நித்திய ஆவியின்[a] மூலம் குறைபாடற்றவராகத் தம்மையே கடவுளுக்கு ஒப்புக்கொடுத்த மேசியாவின் இரத்தம், நம் மனச்சாட்சியைச் செத்த செயல்களிலிருந்து உயிருள்ள கடவுளுக்குப் பணிசெய்வதற்காக எவ்வளவு அதிகமாகத் தூய்மைப்படுத்தும்!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நித்தியமான ஓர் ஆவியின் மூலம்.” இக்கிரேக்கத் தொடரை பொதுவான பொருளிலும் வாசிக்கலாம்; முதன்மை உரை இதைப் பரிசுத்த ஆவியைக் குறிப்பதாக எடுத்துக்கொள்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: πόσῳ μᾶλλον
  choice: எவ்வளவு அதிகமாக
  rationale: முந்தைய வசனத்திலிருந்து வலிமையான முடிவுக்கு அழைத்துச் செல்லும் ஒப்பீட்டு வாதத்தின் சொல்லாட்சித் தாக்கத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: τὸ αἷμα τοῦ Χριστοῦ
  choice: மேசியாவின் இரத்தம்
  rationale: αἷμα என்பதன் பலியியல் முக்கியத்துவத்தை நேரடியாகத் தக்கவைக்கிறது; Χριστός இங்கு அபிஷேகம் பெற்றவர் என்ற பட்டப்பொருளில் இருப்பதால் ‘மேசியா’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: διὰ πνεύματος αἰωνίου
  choice: நித்திய ஆவியின் வழியாக
  rationale: διά என்பதன் இடைமுகப் பொருளைத் தக்கவைக்கிறது. முதன்மை வாசிப்பு பரிசுத்த ஆவியைக் குறிப்பதாக எடுத்துக்கொள்ளப்படுகிறது; கிரேக்கத்தில் உறுதியான சுட்டுச்சொல் இல்லாததால் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἑαυτὸν προσήνεγκεν ἄμωμον τῷ θεῷ
  choice: தம்மையே குறைபாடற்ற பலியாகக் கடவுளுக்கு ஒப்புக்கொடுத்த
  rationale: προσφέρω என்பதன் பலியியல் சூழலை ‘பலியாக’ என்பதால் தெளிவாக்கி, ἑαυτόν என்பதன் தற்சுட்டுப் பொருளையும் ἄμωμον என்பதன் பலிக்குரிய குறையின்மையையும் தக்கவைக்கிறது.
- source_word: καθαριεῖ τὴν συνείδησιν ἡμῶν
  choice: நம் மனச்சாட்சியைத் தூய்மைப்படுத்தும்
  rationale: எதிர்கால வினை வடிவத்தையும் உள்ளார்ந்த நெறியுணர்வைக் குறிக்கும் συνείδησις என்பதன் வழக்கமான பொருளையும் பாதுகாக்கிறது.
- source_word: ἀπὸ νεκρῶν ἔργων
  choice: செத்த செயல்களிலிருந்து
  rationale: விளக்கமாக விரிவாக்காமல் கிரேக்க உருவகத்தையும் எபிரெயர் 6:1 உடனான சொற்பிணைப்பையும் தக்கவைக்கிறது.
- source_word: εἰς τὸ λατρεύειν θεῷ ζῶντι
  choice: உயிருள்ள கடவுளுக்குப் பணிசெய்வதற்காக
  rationale: εἰς τό + infinitive என்பதன் நோக்கப் பொருளை வெளிப்படுத்துகிறது; λατρεύω-வின் வழிபாடு மற்றும் அர்ப்பணிப்பான சேவை ஆகிய இரு நிழற்பொருள்களையும் ‘பணிசெய்’ உள்ளடக்க முடியும்.
theological_decisions:
- issue: πνεύματος αἰωνίου என்பதன் குறிப்பு
  choice: பரிசுத்த ஆவியைக் குறிப்பதாக ‘நித்திய ஆவி’
  alternative: ‘நித்தியமான ஓர் ஆவியின் வழியாக’; கிறிஸ்துவின் சொந்த நித்திய ஆவி அல்லது ஆவிக்குரிய விதம்
  rationale: சூழலில் தனிப்பட்ட தெய்வீக ஆவி முதன்மையான வாசிப்பாக இருக்கலாம்; ஆயினும் பெயர்ச்சொல்லுக்கு கிரேக்கத்தில் சுட்டுச்சொல் இல்லாததால் இலக்கண ரீதியான தெளிவின்மை உண்மையானது. எனவே அதை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு அபிஷேகம் பெற்றவர் என்ற பட்டப்பொருள் செயல்படுவதால் அதன் பொருளை வெளிப்படுத்தும் ‘மேசியா’ தேர்ந்தெடுக்கப்பட்டது.
- issue: νεκρῶν ἔργων என்பதன் பொருள்
  choice: செத்த செயல்கள்
  alternative: மரணத்துக்கு வழிநடத்தும் செயல்கள்; பயனற்ற செயல்கள்
  rationale: இவ்விரிவாக்கங்கள் சாத்திய விளக்கங்களாக இருந்தாலும், மூலத்தின் செறிவான மற்றும் சற்றே திறந்த உருவகத்தை முதன்மை உரையில் தீர்மானித்து விடாமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மனச்சாட்சி’, ‘தூய்மைப்படுத்தும்’, ‘பலியாக ஒப்புக்கொடுத்த’ ஆகியவை மூலத்தின் நெறி மற்றும் பலியியல் மொழியை இயல்பாகத் தக்கவைக்கின்றன. ‘செத்த செயல்கள்’ என்ற சற்றே அசாதாரணமான உருவகம் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளது.
