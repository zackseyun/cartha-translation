source:
  edition: SBLGNT
  text: χρυσοῦν ἔχουσα θυμιατήριον καὶ τὴν κιβωτὸν τῆς διαθήκης περικεκαλυμμένην πάντοθεν χρυσίῳ, ἐν ᾗ στάμνος χρυσῆ ἔχουσα τὸ μάννα καὶ ἡ ῥάβδος Ἀαρὼν ἡ βλαστήσασα καὶ αἱ πλάκες τῆς διαθήκης,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/004.yaml
  text: having the golden censer[a], and the ark of the covenant covered on all sides with gold, in which were a golden jar holding the manna, Aaron’s staff that budded, and the tablets of the covenant,
translation:
  language: ta
  text: அதில் தங்கத் தூபபீடமும்[a], எல்லாப் பக்கங்களிலும் தங்கம் பூசப்பட்ட உடன்படிக்கைப் பெட்டியும் இருந்தன. அந்தப் பெட்டிக்குள் மன்னாவை வைத்திருந்த தங்கக் குடுவையும், துளிர்த்த ஆரோனின் கோலும், உடன்படிக்கைப் பலகைகளும் இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்கத் தூபக்கலசம்.” θυμιατήριον என்ற கிரேக்கச் சொல் தூபம் காட்டும் பாத்திரத்தையோ தூபபீடத்தையோ குறிக்கலாம்; இங்கு அதன் பொருள் குறித்து கருத்து வேறுபாடு உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: χρυσοῦν ἔχουσα θυμιατήριον
  choice: அதில் தங்கத் தூபபீடமும் இருந்தது
  rationale: θυμιατήριον என்பது தூபம் காட்டும் பாத்திரத்தையோ தூபபீடத்தையோ குறிக்கலாம். கூடாரத்தின் பொருட்களை விவரிக்கும் இச்சூழலில் ‘தூபபீடம்’ இயல்பான முதன்மைத் தேர்வு; உண்மையான சொற்பொருள் ஐயம் அடிக்குறிப்பில் காக்கப்படுகிறது. χρυσοῦν என்பதற்கு ‘தங்கத்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: τὴν κιβωτὸν τῆς διαθήκης
  choice: உடன்படிக்கைப் பெட்டி
  rationale: புனித உடன்படிக்கைப் பெட்டிக்கான தெளிவான, வழக்கமான தமிழ் சொற்றொடர்.
- source_word: περικεκαλυμμένην πάντοθεν χρυσίῳ
  choice: எல்லாப் பக்கங்களிலும் தங்கம் பூசப்பட்ட
  rationale: περικεκαλυμμένην மற்றும் πάντοθεν ஆகியவை பெட்டி முழுச் சுற்றிலும் தங்கத்தால் மூடப்பட்டிருந்ததை வலியுறுத்துகின்றன.
- source_word: ἐν ᾗ
  choice: அந்தப் பெட்டிக்குள்
  rationale: பெண்பால் ஒருமை உறவுப்பெயர் உடன்படிக்கைப் பெட்டியையே சுட்டுகிறது; பட்டியலிடப்படும் பொருட்கள் அதற்குள் இருந்ததாக உரையின் இலக்கணத் தொடர்பை வெளிப்படையாகக் காட்டுகிறது.
- source_word: στάμνος χρυσῆ ἔχουσα τὸ μάννα
  choice: மன்னாவை வைத்திருந்த தங்கக் குடுவை
  rationale: στάμνος என்பதற்கு சாதாரண வாசகர்களுக்குப் புரியும் ‘குடுவை’ பயன்படுத்தப்பட்டுள்ளது; ἔχουσα இயல்பான தமிழில் ‘வைத்திருந்த’ என வழங்கப்பட்டுள்ளது.
- source_word: ἡ ῥάβδος Ἀαρὼν ἡ βλαστήσασα
  choice: துளிர்த்த ஆரோனின் கோல்
  rationale: ῥάβδος என்பதற்கு இச்சூழலில் ‘கோல்’ இயல்பானது; βλαστήσασα நிகழ்ந்த துளிர்த்தலை நேரடியாகக் குறிக்கிறது.
- source_word: αἱ πλάκες τῆς διαθήκης
  choice: உடன்படிக்கைப் பலகைகள்
  rationale: πλάκες என்பது ‘பலகைகள்’; மூலத்தில் இவ்வசனத்தில் வெளிப்படையாக இல்லாத ‘கல்’ என்ற சொல்லைச் சேர்க்கவில்லை.
theological_decisions:
- issue: தூபம் தொடர்பான θυμιατήριον என்ற சொல்லின் பொருள்
  choice: தூபபீடம்
  alternative: தூபக்கலசம்
  rationale: இச்சொல் தூபபீடத்தையோ தூபம் காட்டும் பாத்திரத்தையோ குறிக்கக்கூடியது. கூடாரப் பொருட்களின் விளக்கத்தில் ‘தூபபீடம்’ முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டுள்ளது; வரலாற்று மற்றும் சொற்பொருள் சார்ந்த உண்மையான ஐயம் அடிக்குறிப்பில் மறைக்கப்படவில்லை.
- issue: உடன்படிக்கைப் பெட்டிக்குள் இருந்த பொருட்களின் பட்டியல்
  choice: மூலத்தின் இலக்கணப்படி குடுவை, கோல், பலகைகள் ஆகிய மூன்றும் பெட்டிக்குள் இருந்ததாக மொழிபெயர்த்தல்
  alternative: பழைய ஏற்பாட்டு விவரங்களுடன் ஒத்திசைக்க வாக்கியத் தொடர்பைத் தளர்த்துதல்
  rationale: ἐν ᾗ உடன்படிக்கைப் பெட்டியை இலக்கண ரீதியாகச் சுட்டுவதால், பிற வேதாகம விவரங்களுடன் ஏற்படக்கூடிய பதற்றத்தை மொழிபெயர்ப்பில் மறுசீரமைக்காமல் மூல உரையின் கூற்றை அப்படியே காக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் தெளிவான, கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. கிரேக்க வாக்கியம் முந்தைய வசனத்தோடு இலக்கண ரீதியாகத் தொடர்ந்தாலும், தமிழில் வாசிப்புத் தெளிவுக்காக ‘அதில்’ என்று தொடங்கி இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
