revisions:
- from: இல்லையென்றால், உலகம் படைக்கப்பட்டதுமுதல் அவர் பலமுறை பாடுபட வேண்டியிருந்திருக்கும். ஆனால் இப்போதோ, காலங்களின் நிறைவில்[a], தம்மையே பலியாகச் செலுத்தியதன் மூலம்[c] பாவத்தை ஒழிப்பதற்காக[b] அவர் ஒரே முறையாகத் தோன்றியிருக்கிறார்.
