source:
  edition: SBLGNT
  text: ἐπεὶ ἔδει αὐτὸν πολλάκις παθεῖν ἀπὸ καταβολῆς κόσμου· ⸀νυνὶ δὲ ἅπαξ ἐπὶ συντελείᾳ τῶν αἰώνων εἰς ἀθέτησιν ⸀ἁμαρτίας διὰ τῆς θυσίας αὐτοῦ πεφανέρωται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/026.yaml
  text: Otherwise[a], he would have had to suffer many times since the foundation of the world. But as it is[c][b], he has appeared once for all at the consummation of the ages to put away sin through the sacrifice of himself.
translation:
  language: ta
  text: இல்லையென்றால், உலகம் படைக்கப்பட்டதுமுதல் அவர் பலமுறை பாடுபட வேண்டியிருந்திருக்கும். ஆனால் இப்போதோ, காலங்களின் நிறைவில்[a], பாவத்தை ஒழிப்பதற்காக[b], தம்முடைய பலியின் மூலம்[c] அவர் ஒரே முறையாக வெளிப்பட்டிருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘காலங்களின் முடிவில்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பாவத்தை அகற்றுவதற்காக’ அல்லது ‘பாவத்தைச் செல்லாததாக்குவதற்காக.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘அவருடைய பலியின் மூலம்.’ கிரேக்கத்தில் சொல்லுக்குச் சொல்லாக, ‘தம்முடைய பலியின் மூலம்’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: இல்லையென்றால்
  rationale: முந்தைய கருத்து உண்மையாயிருந்தால் ஏற்படும் விளைவை இங்கு ἐπεὶ அறிமுகப்படுத்துகிறது; தமிழ் வாதநடையில் ‘இல்லையென்றால்’ அந்த எதிர்நிலைத் தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: ἔδει αὐτὸν ... παθεῖν
  choice: அவர் ... பாடுபட வேண்டியிருந்திருக்கும்
  rationale: இறந்தகாலத்தில் நிகழ்ந்திருக்கக்கூடிய கற்பனைசார் அவசியத்தை இந்த வடிவம் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: πολλάκις
  choice: பலமுறை
  rationale: பின்னர் வரும் ἅπαξ என்பதுடன் உள்ள ‘பலமுறை—ஒரே முறை’ என்ற நேரடியான முரண்பாட்டைப் பாதுகாக்கிறது.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: உலகம் படைக்கப்பட்டதுமுதல்
  rationale: உலகம் நிறுவப்பட்ட காலத்திலிருந்து தொடரும் காலப்பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: νυνὶ δὲ
  choice: ஆனால் இப்போதோ
  rationale: முன்வைக்கப்பட்ட கற்பனை நிலைக்கும் உண்மையில் நிகழ்ந்ததற்கும் இடையிலான வலுவான மாறுபாட்டைத் தக்கவைக்கிறது.
- source_word: ἅπαξ
  choice: ஒரே முறையாக
  rationale: πολλάκις என்பதற்கு எதிராக, கிறிஸ்துவின் தோற்றமும் பலியும் மீண்டும் மீண்டும் நிகழாத ஒரே நிகழ்வு என்பதைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: ἐπὶ συντελείᾳ τῶν αἰώνων
  choice: காலங்களின் நிறைவில்
  rationale: αἰώνων என்ற பன்மையையும் συντέλεια குறிக்கும் நிறைவு அல்லது உச்சக்கட்டத்தையும் பாதுகாக்கிறது; வெறும் காலவரிசை முடிவாக இதைச் சுருக்கவில்லை.
- source_word: εἰς ἀθέτησιν ἁμαρτίας
  choice: பாவத்தை ஒழிப்பதற்காக
  rationale: ἀθέτησις என்பதிலுள்ள அகற்றுதல், செல்லாததாக்குதல், ஒழித்தல் ஆகிய வலிமையான பொருள்களை சாதாரண வாசகருக்குப் புரியும் வகையில் தெரிவிக்கிறது.
- source_word: ἁμαρτίας
  choice: பாவத்தை
  rationale: கிரேக்க ஒருமையைப் பாதுகாத்து, தனித்தனி பாவச்செயல்கள் மட்டுமல்லாமல் ‘பாவம்’ என்னும் மொத்த யதார்த்தத்தையும் குறிக்க இடமளிக்கிறது.
- source_word: διὰ τῆς θυσίας αὐτοῦ
  choice: தம்மையே பலியாகச் செலுத்தியதன் மூலம்
  rationale: சூழலில் அவர் தம்மையே அர்ப்பணித்தார் என்ற பொருளை இயல்பான தமிழில் தெளிவாக்குகிறது; அதேவேளையில் ‘அவருடைய பலியின் மூலம்’ என்ற இலக்கணரீதியான சுருக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: πεφανέρωται
  choice: தோன்றியிருக்கிறார்
  rationale: நிறைவுற்ற வெளிப்பாடு தொடர்ந்து முக்கியத்துவம் உடையது என்ற perfect காலத்தின் நுணுக்கத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
theological_decisions:
- issue: கிறிஸ்துவின் பலியைக் குறிக்கும் ἅπαξ என்பதன் வலிமை
  choice: ஒரே முறையாக
  alternative: ஒருமுறை
  rationale: πολλάκις (‘பலமுறை’) என்பதுடனான உடனடி முரண்பாடு இந்தச் செயல் திரும்பத் திரும்ப நிகழாதது என்பதை வலியுறுத்துகிறது; உரைக்கு அப்பாற்பட்ட கோட்பாட்டு சொற்கள் சேர்க்கப்படவில்லை.
- issue: ἁμαρτίας என்ற ஒருமையின் பரப்பு
  choice: பாவத்தை
  alternative: பாவங்களை
  rationale: கிரேக்க ஒருமை, பல தனிப்பட்ட செயல்களின் பட்டியலை மட்டுமல்லாமல் பாவம் என்னும் யதார்த்தத்தை ஒருமையாக முன்வைக்கிறது; ஆகவே தமிழிலும் ஒருமை பாதுகாக்கப்படுகிறது.
- issue: αὐτοῦ என்பதன் பலிசார் தொடர்பு
  choice: தம்மையே பலியாகச் செலுத்தியதன் மூலம்
  alternative: அவருடைய பலியின் மூலம்
  rationale: உடனடிச் சூழல் கிறிஸ்துவின் சுயஅர்ப்பணிப்பைச் சுட்டுகிறது. எனினும் கிரேக்கத் தொடரை ‘அவருடைய பலி’ என்றும் நேரடியாகப் புரிந்துகொள்ள முடிவதால் அந்த மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் அதேவேளையில் மரியாதையும் இறையியல் செறிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘காலங்களின் நிறைவு,’ ‘பாவத்தை ஒழித்தல்’ போன்ற மூலத்தின் செறிவான சொற்றொடர்கள் எளிமைப்படுத்தி மங்கவிடப்படவில்லை; உண்மையான பொருள் மாற்றுகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
