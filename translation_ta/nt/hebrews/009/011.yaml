source:
  edition: SBLGNT
  text: Χριστὸς δὲ παραγενόμενος ἀρχιερεὺς τῶν ⸀γενομένων ἀγαθῶν διὰ τῆς μείζονος καὶ τελειοτέρας σκηνῆς οὐ χειροποιήτου, τοῦτ’ ἔστιν οὐ ταύτης τῆς κτίσεως,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/011.yaml
  text: But the Messiah came as high priest of the good things that have come[a], through the greater and more perfect tabernacle not made by hands—that is[b], not of this creation—
translation:
  language: ta
  text: ஆனால், வந்துவிட்ட நன்மைகளின்[a] தலைமை ஆசாரியராக மேசியா வந்து[b], மனிதக் கைகளால் செய்யப்படாத—அதாவது, இந்தப் படைப்பைச் சேர்ந்திராத—மேன்மையானதும் மேலும் நிறைவானதுமான திருக்கூடாரத்தின் வழியாக—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், ‘வரவிருக்கும் நன்மைகளின்’ என்று உள்ளது.
    reason: textual_variant
  - marker: b
    text: ‘ஆனால், வந்துவிட்ட நன்மைகளின் தலைமை ஆசாரியராக மேசியா தோன்றியபோது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: translation_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: மேசியா
  rationale: இச்சூழலில் இது தனிப்பெயராக அல்லாமல், அபிஷேகம் பெற்றவரைக் குறிக்கும் பட்டமாகச் செயல்படுகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய பகுதியில் கூறப்பட்ட பூமிக்குரிய திருக்கூடாரத்துக்கும் மேசியாவின் ஊழியத்துக்கும் இடையிலான வேறுபாட்டைக் குறிக்கிறது.
- source_word: παραγενόμενος
  choice: வந்து
  rationale: மேசியா இந்த ஆசாரியப் பணியில் வந்திருப்பதைக் குறிக்கும் இயல்பான வினையெச்ச வடிவம்; இதை அடுத்த வசனத்தின் முதன்மை வினையுடன் இணைக்கவும் உதவுகிறது.
- source_word: ἀρχιερεὺς
  choice: தலைமை ஆசாரியர்
  rationale: எபிரெயர் நூலின் பலியிடுதல் மற்றும் பரிசுத்த இடம் சார்ந்த சூழலில் இப்பதவியைத் துல்லியமாகக் குறிக்கும் வழக்கமான தமிழ் சொற்றொடர்.
- source_word: τῶν γενομένων ἀγαθῶν
  choice: வந்துவிட்ட நன்மைகளின்
  rationale: SBLGNT-இன் γενομένων என்ற வாசகத்தை நேரடியாகப் பின்பற்றி, நன்மைகள் ஏற்கெனவே வந்துள்ளன என்ற காலநிலையைப் பாதுகாக்கிறது.
- source_word: διὰ τῆς ... σκηνῆς
  choice: திருக்கூடாரத்தின் வழியாக
  rationale: σκηνή இங்கு வனாந்தரப் பரிசுத்த கூடாரத்தின் பின்னணியைக் கொண்டுள்ளது; ‘வழியாக’ என்பது διάவின் வழி அல்லது ஊடகம் என்ற உறவைத் திறந்தவாறே வைக்கிறது.
- source_word: μείζονος
  choice: மேன்மையான
  rationale: வெறும் உடல் அளவை அல்லாமல் தரத்திலும் நிலைமையிலும் உள்ள உயர்வைக் குறிக்கிறது.
- source_word: τελειοτέρας
  choice: அதிக நிறைவான
  rationale: எபிரெயர் நூலில் τέλειος சொற்குடும்பம் கொண்டுள்ள நிறைவு அல்லது பூரணத்தன்மை சார்ந்த கருத்துத் தொடர்பைப் பாதுகாக்கிறது.
- source_word: οὐ χειροποιήτου
  choice: மனிதக் கைகளால் செய்யப்படாத
  rationale: மனிதனால் உருவாக்கப்பட்ட பூமிக்குரிய பரிசுத்த இடத்துடன் உள்ள மாறுபாட்டைத் தெளிவாக்கும் வேதாகமச் சொல்லாட்சியை இயல்பான தமிழில் தருகிறது.
- source_word: τοῦτ’ ἔστιν
  choice: அதாவது
  rationale: பின்வரும் விளக்கக் குறிப்பை இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: οὐ ταύτης τῆς κτίσεως
  choice: இந்தப் படைப்பைச் சேர்ந்திராத
  rationale: κτίσις குறிக்கும் படைக்கப்பட்ட ஒழுங்குடன் அந்தத் திருக்கூடாரம் தொடர்புடையதல்ல என்ற பொருளைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
theological_decisions:
- issue: τῶν γενομένων ἀγαθῶν என்பதன் உரைவேறுபாடும் காலநிலையும்
  choice: வந்துவிட்ட நன்மைகளின்
  alternative: வரவிருக்கும் நன்மைகளின்
  rationale: முதன்மை உரை SBLGNT-இன் γενομένων வாசகத்தைப் பின்பற்றுகிறது. வேறு சில கையெழுத்துப் பிரதிகளின் μελλόντων வாசகம் எதிர்கால நன்மைகளைக் குறிக்கும் என்பதால், அந்த முக்கிய உரைவேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: διὰ τῆς ... σκηνῆς என்ற சொற்றொடரின் தொடரியல் இணைப்பு
  choice: வசன முடிவைத் திறந்தவாறு வைத்து, ‘திருக்கூடாரத்தின் வழியாக—’ என்பதை அடுத்த வசனத்தின் முதன்மை வினையை நோக்கிச் செல்லச் செய்தல்
  alternative: திருக்கூடாரத்தின் வழியாக மேசியா வந்தார் என்று வெளிப்படையாக இணைத்தல்
  rationale: கிரேக்க வாக்கியம் 12ஆம் வசனத்தில் தொடர்கிறது; διά சொற்றொடர் அங்குள்ள ‘நுழைந்தார்’ என்ற முதன்மை வினையுடன் இயல்பாக இணைகிறது. மொழிபெயர்ப்பு இந்தத் தொடரியலைத் தவறாகத் தீர்மானிக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டு மற்றும் ஆசாரியப் பின்னணிக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘திருக்கூடாரம்’ பழைய ஏற்பாட்டின் பரிசுத்த கூடாரத் தொடர்பைத் தக்கவைக்கிறது. வசனம் கிரேக்கத்தில் அடுத்த வசனத்தோடு தொடர்வதால் இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது.
