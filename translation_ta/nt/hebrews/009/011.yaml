  rationale: சொல் வரிசை மட்டும் சீரமைக்கப்பட்டு, மீளுரைப்பான ‘வந்து’ நீக்கப்பட்டுள்ளது. τελειοτέρας-இன் ஒப்பீட்டுப் பொருளுக்காக ‘மேலும் நிறைவான’ பயன்படுத்தப்பட்டுள்ளது. இறுதி நீண்ட கோடும் ‘திருக்கூடாரத்தின் வழியாக’ என்ற தொடரும் அடுத்த வசனத்தின் முதன்மை வினையை நோக்கித் திறந்தவாறே விடப்பட்டுள்ளன; எனவே அதன் தொடரியல் உறவு முன்கூட்டியே தவறாக நிர்ணயிக்கப்படவில்லை.
