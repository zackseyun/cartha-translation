  source_fidelity: மூலத்தின் γενομένων வாசகத்திற்கேற்ப ‘வந்துவிட்ட நன்மைகள்’ என்பதும், σκηνή, οὐ χειροποίητος, οὐ ταύτης τῆς κτίσεως ஆகியவற்றின் பொருளும் நன்றாகக் காக்கப்பட்டுள்ளன. ஆனால் ‘மேசியா ... தலைமை ஆசாரியராக வந்து’ என்ற வரிசை தேவையற்ற இரட்டை ‘வந்து’ அமைப்பை உருவாக்குகிறது. சொற்களை மறுவரிசைப்படுத்துவது participle-இன் பொருளையும், அடுத்த வசனத்தில் நிறைவுறும் ‘திருக்கூடாரத்தின் வழியாக—’ தொடரையும் பாதுகாக்கும்.
  naturalness: ‘வந்துவிட்ட நன்மைகளின் தலைமை ஆசாரியராக மேசியா வந்து’ என்பது நவீனத் தரத் தமிழில் இயல்பானது. ‘அதிக நிறைவான’ என்பதற்குப் பதில் ‘மேலும் நிறைவான’ என்பது comparative-ஐத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
  terminology: ‘மேசியா,’ ‘தலைமை ஆசாரியர்,’ ‘திருக்கூடாரம்,’ மற்றும் ‘படைப்பு’ ஆகிய சொற்கள் சூழலுக்கும் பதிவுக்கும் ஏற்றவை. உரைவேறுபாட்டு அடிக்குறிப்பு சரியான இடத்தில் உள்ளது. இரண்டாம் அடிக்குறிப்பை முழுமையான, இயல்பான மாற்று மொழிபெயர்ப்பாகச் சீரமைக்க வேண்டும்.
