  text: Τούτων δὲ οὕτως κατεσκευασμένων, εἰς μὲν τὴν πρώτην σκηνὴν διὰ παντὸς εἰσίασιν οἱ ἱερεῖς τὰς λατρείας ἐπιτελοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/006.yaml
  text: With these things prepared in this way[a], the priests continually enter the first tabernacle, performing the services[b],
translation:
  language: ta
  text: இவை இவ்வாறு ஆயத்தம் செய்யப்பட்டிருக்கையில், ஆசாரியர்கள் முதல் கூடாரத்திற்குள்[a] தொடர்ந்து நுழைந்து, வழிபாட்டுப் பணிகளைச் செய்கிறார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முதல் கூடாரப் பகுதிக்குள்” அல்லது “முதல் அறைக்குள்.” கிரேக்கச் சொல் முழுக் கூடாரத்தையோ, இச்சூழலில் அதன் முதல் பகுதியையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வழிபாட்டுச் செயல்களைச் செய்ய” அல்லது “சடங்குக் கடமைகளை நிறைவேற்ற.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτων δὲ οὕτως κατεσκευασμένων
  choice: இவை இவ்வாறு ஆயத்தம் செய்யப்பட்டிருக்க
  rationale: முன்பு விவரிக்கப்பட்ட பரிசுத்தக் கூடாரமும் அதன் பொருட்களும் ஒழுங்குபடுத்தப்பட்ட நிலையைச் சுட்டும் genitive absolute அமைப்பை இயல்பான தமிழில் பின்னணிச் சூழலாகத் தருகிறது. δὲ-யை தனியான ‘இப்போது’ என மிகைப்படுத்தவில்லை.
- source_word: εἰς μὲν τὴν πρώτην σκηνὴν
  choice: முதல் கூடாரத்திற்குள்
  rationale: σκηνή என்பதன் கூடாரம் என்ற வழிபாட்டுச் சூழலைப் பாதுகாக்கிறது; இங்கு அது கூடாரத்தின் முதல் பகுதியையும் குறிக்கக்கூடும் என்பதால் அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது. μὲν அடுத்த வசனத்தின் δὲ உடன் அமைக்கும் மாறுபாடு தமிழில் தொடர்ச்சியான சூழலால் வெளிப்படுகிறது.
- source_word: διὰ παντὸς
  choice: தொடர்ந்து
  rationale: ஒவ்வொரு கணமும் இடைவிடாமல் இருப்பதை அல்ல, வழக்கமாக மீண்டும் மீண்டும் நடைபெறும் ஆசாரியப் பணியைச் சுட்டுகிறது.
- source_word: εἰσίασιν
  choice: நுழைகிறார்கள்
  rationale: நிகழ்கால வினைச்சொல்லின் வழக்கமாக நடைபெறும் செயல் உணர்வை இயல்பான தமிழில் தருகிறது.
- source_word: οἱ ἱερεῖς
  choice: ஆசாரியர்கள்
  rationale: அடுத்த வசனத்தில் வரும் தலைமையாசாரியருக்கு மாறாக, சாதாரண ஆசாரியர்களைக் குறிக்கிறது; வேதாகம வழிபாட்டுச் சூழலுக்குரிய அறிமுகமான தமிழ்ச் சொல்.
- source_word: τὰς λατρείας
  choice: வழிபாட்டுப் பணிகளை
  rationale: ஆலயத்துக்குரிய நிர்ணயிக்கப்பட்ட சேவைகள் அல்லது சடங்குப் பணிகள் என்ற பன்மை உணர்வைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐπιτελοῦντες
  choice: செய்வதற்காக
  rationale: ஆசாரியர்கள் உள்ளே நுழைந்து மேற்கொள்ளும் பணியைத் தெளிவுபடுத்துகிறது. கிரேக்கப் பங்கேற்பு வினையின் சூழல்சார் நோக்கம்/செயல் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பரிசுத்த இடச் சூழலில் σκηνή என்பதன் பொருள்
  choice: கூடாரம்
  alternative: முதல் பகுதி / அறை
  rationale: எபிரெயர் 9 மோசேயின் வழிபாட்டுக் கூடாரத்தை விளக்குவதால் ‘கூடாரம்’ பழைய ஏற்பாட்டுச் சூழலைப் பாதுகாக்கிறது. அதேவேளை இவ்வசனத்தில் முதல் உட்பிரிவு குறிக்கப்படலாம் என்ற உண்மையான பொருள் வாய்ப்பை அடிக்குறிப்பு காக்கிறது.
- issue: διὰ παντὸς என்பதன் காலவலிமை
  choice: தொடர்ந்து
  alternative: எப்போதும் / வழக்கமாக
  rationale: சாதாரண ஆசாரியர்களின் மீண்டும் மீண்டும் நிகழும் அனுமதியையும் அடுத்த வசனத்தில் தலைமையாசாரியரின் கட்டுப்படுத்தப்பட்ட நுழைவையும் வேறுபடுத்துகிறது; இடைவிடாத உடலிருப்பை உணர்த்தாது.
- issue: λατρείας என்பதன் வழிபாட்டு இயல்பு
  choice: வழிபாட்டுப் பணிகள்
  alternative: வழிபாட்டுச் செயல்கள் / சடங்குக் கடமைகள்
  rationale: ஆசாரியர்கள் செய்த பரிசுத்த இடச் சேவைகளைச் சுட்டுகிறது; பொதுவான வேலை என்றும் பிற்கால திருச்சபை ஆராதனை நிகழ்ச்சி என்றும் குறுக்கிப் பொருள் கொள்ளாமல் வழிபாட்டு மற்றும் கடமை சார்ந்த இரு பரிமாணங்களையும் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையில் மொழிபெயர்க்கப்பட்டது. ‘ஆசாரியர்கள்’, ‘கூடாரம்’ ஆகியவை மோசேயின் வழிபாட்டுச் சூழலைத் தக்கவைக்கின்றன. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
