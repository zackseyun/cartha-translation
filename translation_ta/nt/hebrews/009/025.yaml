source:
  edition: SBLGNT
  text: οὐδ’ ἵνα πολλάκις προσφέρῃ ἑαυτόν, ὥσπερ ὁ ἀρχιερεὺς εἰσέρχεται εἰς τὰ ἅγια κατ’ ἐνιαυτὸν ἐν αἵματι ἀλλοτρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/025.yaml
  text: Nor was it so that he might offer himself many times[a], just as the high priest enters the holy places year by year with blood not his own,
translation:
  language: ta
  text: தலைமைக் குரு ஆண்டுதோறும் தன்னுடையதல்லாத இரத்தத்துடன் பரிசுத்த இடங்களுக்குள்[a] நுழைவதுபோல, அவர் தம்மைப் பலமுறை பலியாகச் செலுத்துவதற்காக நுழையவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பரிசுத்த ஸ்தலம்.’ கிரேக்கத்தில் இது பன்மையில் ‘பரிசுத்த இடங்கள்’ என்று உள்ளது; இந்த வழிபாட்டுச் சூழலில் சிலர் இதை இன்னும் குறிப்பாக ‘மகா பரிசுத்த ஸ்தலம்’ என்று புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδ’ ἵνα
  choice: …செய்வதற்காக அங்கு நுழையவில்லை
  rationale: முந்தைய வசனத்திலிருந்து தொடரும் மறுக்கப்பட்ட நோக்கத்தைத் தமிழில் முழுமையான, இயல்பான வாக்கியமாகத் தருகிறது. ‘அங்கு நுழையவில்லை’ என்பது சூழலிலிருந்து தெளிவாக உள்ள செயலை வெளிப்படையாகக் கூறுகிறது.
- source_word: πολλάκις
  choice: பலமுறை
  rationale: தலைமைக் குருவின் ஆண்டுதோறும் நிகழும் மீள்மீள் நுழைவோடு உள்ள முரண்பாட்டை நேரடியாகக் காட்டுகிறது.
- source_word: προσφέρῃ ἑαυτόν
  choice: தம்மைப் பலியாகச் செலுத்துவதற்காக
  rationale: προσφέρω என்பதன் பலிசார்ந்த பொருளையும் ἑαυτόν என்பதன் தற்சுட்டுப் பொருளையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ὥσπερ
  choice: …நுழைவதுபோல
  rationale: கிறிஸ்துவின் நுழைவையும் தலைமைக் குருவின் வழக்கமான நுழைவையும் ஒப்பிடும் அமைப்பை இயல்பான தமிழில் குறிக்கிறது.
- source_word: ὁ ἀρχιερεὺς
  choice: தலைமைக் குரு
  rationale: யூத வழிபாட்டு அலுவலைக் குறிக்கும் துல்லியமான, வழக்கிலுள்ள தமிழ் சொல்.
- source_word: εἰσέρχεται
  choice: நுழைகிறார்
  rationale: வழக்கமாக நிகழும் செயலைக் குறிக்கும் கிரேக்க நிகழ்காலத்தின் தன்மையைத் தமிழில் நிகழ்காலமாகப் பேணுகிறது.
- source_word: εἰς τὰ ἅγια
  choice: பரிசுத்த இடங்களுக்குள்
  rationale: கிரேக்கத்தின் பன்மை வடிவத்தைப் பேணி, அதை ‘மகா பரிசுத்த இடம்’ என்று அளவுக்கு மீறிக் குறிப்பாக்காமல் விடுகிறது.
- source_word: κατ’ ἐνιαυτὸν
  choice: ஆண்டுதோறும்
  rationale: ஒவ்வோர் ஆண்டும் மீண்டும் நிகழும் வழிபாட்டு முறையை இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: ἐν αἵματι ἀλλοτρίῳ
  choice: தன்னுடையதல்லாத இரத்தத்துடன்
  rationale: இரத்தம் தலைமைக் குருவுக்குச் சொந்தமானதல்ல என்ற முரண்பாட்டைப் பாதுகாக்கிறது; அதை வேறொரு மனிதரின் இரத்தம் என்று தவறாக உணர்த்துவதையும் தவிர்க்கிறது.
theological_decisions:
- issue: கிறிஸ்துவின் நுழைவும் தலைமைக் குருவின் நுழைவும் இடையிலான ஒப்பீடு
  choice: கிறிஸ்து தம்மைப் பலமுறை பலியாகச் செலுத்துவதற்காக நுழையவில்லை; இதற்கு மாறாக தலைமைக் குரு தன்னுடையதல்லாத இரத்தத்துடன் ஆண்டுதோறும் நுழைகிறார்.
  alternative: ‘பரிசுத்த இடங்கள்’ என்பதை இன்னும் குறுகிய பொருளில் ‘மகா பரிசுத்த இடம்’ என்று கொள்ளலாம்.
  rationale: உடனடிச் சூழல் கிறிஸ்துவின் மீண்டும் மீண்டும் செய்யப்படாத பலியையும் பழைய உடன்படிக்கையின் தலைமைக் குருவுடைய ஆண்டுதோறும் நிகழும் பணியையும் எதிரெதிராக வைக்கிறது. பிந்தைய கோட்பாட்டு விளக்கங்களைச் சேர்க்காமல் அந்த முரண்பாடு பேணப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதைமிக்க நடையைப் பயன்படுத்துகிறது. கிரேக்க வாக்கியம் முந்தைய வசனத்தைச் சார்ந்திருப்பதால், தமிழில் தனி வசனமாகத் தெளிவாக வாசிக்க ‘அங்கு நுழையவில்லை’ என்பது சூழலிலிருந்து நிரப்பப்பட்டுள்ளது. ‘தம்மை’ என்பது மரியாதை ஒருமையையும் தற்சுட்டுப் பொருளையும் காக்கிறது.
