base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/003.yaml
  text: And behind the second curtain was a tabernacle called the Most Holy Place,[a]
translation:
  language: ta
  text: இரண்டாவது திரைக்குப் பின்னால், “மிகப் பரிசுத்தமான இடம்”[a] என்று அழைக்கப்பட்ட கூடாரம் இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, மரபுவழியாக, “பரிசுத்த பரிசுத்தம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ... τὸ δεύτερον καταπέτασμα
  choice: இரண்டாவது திரைக்குப் பின்னால்
  rationale: μετά + accusative இங்கு காலத்தைக் காட்டாமல் இடத்தொடர்பைக் குறிக்கிறது. ஆகவே இயல்பான நவீன தமிழில் ‘பின்னால்’ என்று மொழிபெயர்க்கப்பட்டது. καταπέτασμα உள்ளார்ந்த பரிசுத்த இடங்களைப் பிரிக்கும் திரையைக் குறிக்கிறது.
- source_word: δὲ
  choice: தனி இணைப்புச்சொல்லாக வெளிப்படுத்தப்படவில்லை
  rationale: δέ விவரிப்பை மெதுவாகத் தொடரும் இணைப்புச்சொல். தமிழில் வாக்கிய ஓட்டத்திலேயே அதன் பணி இயல்பாக வெளிப்படுவதால் தனியாக ‘மேலும்’ அல்லது ‘ஆனால்’ சேர்க்கப்படவில்லை.
- source_word: σκηνὴ
  choice: கூடாரப் பகுதி
  rationale: σκηνή ஆசரிப்புக் கூடாரத்தைக் குறித்தாலும், இச்சூழலில் அதன் இரண்டாம் உட்பிரிவே உடனடி சுட்டுப்பொருள். ‘கூடாரப் பகுதி’ என்பது கட்டமைப்பையும் குறிப்பிட்ட உட்பகுதியையும் ஒருங்கே தெளிவுபடுத்துகிறது.
- source_word: ἡ λεγομένη
  choice: என்று அழைக்கப்பட்ட
  rationale: பெயரிடப்பட்டிருந்ததைத் தெரிவிக்கும் attributive participle தமிழில் இயல்பாக இவ்வாறு வழங்கப்பட்டது.
- source_word: Ἅγια Ἁγίων
  choice: மகா பரிசுத்த இடம்
  rationale: எபிரேயத் தாக்கமுள்ள மிகைநிலைச் சொற்றொடர் சொற்படியாக ‘பரிசுத்தங்களின் பரிசுத்தம்’ என்றாலும், உள்ளார்ந்த மிகப் பரிசுத்தமான சரணாலயப் பகுதியை நவீன தமிழில் தெளிவாகக் குறிக்க ‘மகா பரிசுத்த இடம்’ தேர்ந்தெடுக்கப்பட்டது. மரபுவழி வடிவம் அடிக்குறிப்பில் வைக்கப்பட்டது.
theological_decisions:
- issue: Ἅγια Ἁγίων என்ற சரணாலயப் பெயரின் மொழிபெயர்ப்பு
  choice: மகா பரிசுத்த இடம்
  alternative: பரிசுத்தங்களின் பரிசுத்தம்
  rationale: மூலத்தின் மிகைநிலைப் பொருளையும் உள்ளார்ந்த சரணாலயச் சுட்டையும் வாசகருக்கு தெளிவாக வழங்குகிறது; சொற்படியான மரபுவழி வடிவத்தை அடிக்குறிப்பில் வைத்திருப்பதால் மூல மொழியமைப்பும் மறைக்கப்படவில்லை.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘கூடாரப் பகுதி’ என்பது σκηνή என்பதன் வழிபாட்டு அமைப்புச் சுவையையும் இங்கு குறிக்கப்படும் உட்பிரிவையும் பாதுகாக்கிறது; அடிக்குறிப்பு மூலத்தின் பாரம்பரிய சொற்படியான வடிவத்தை வெளிப்படையாகத் தருகிறது.
