revisions:
- from: இரண்டாவது திரைக்குப் பின்னால், “மகா பரிசுத்த இடம்”[a] என்று அழைக்கப்பட்ட கூடாரப் பகுதி இருந்தது.
  to: இரண்டாவது திரைக்குப் பின்னால், “மிகப் பரிசுத்தமான இடம்”[a] என்று அழைக்கப்பட்ட கூடாரம் இருந்தது.
  rationale: The revision retains the source’s spatial relation and sanctuary terminology, renders σκηνή directly as “கூடாரம்,” and uses an idiomatic modern Tamil equivalent for the Most Holy Place. The footnote preserves the traditional designation without forcing a word-for-word genitive construction into the main text.
