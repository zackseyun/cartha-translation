  terminology: “பரிசுத்த ஆவியானவர்,” “முதல் கூடாரம்,” and “பரிசுத்த இடங்களுக்குள் செல்லும் வழி” are suitable, dignified, and contextually accurate Tamil renderings. The footnotes responsibly preserve the possible broader/specific sanctuary senses and the more physical sense of standing.
