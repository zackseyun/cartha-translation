  text: τοῦτο δηλοῦντος τοῦ πνεύματος τοῦ ἁγίου, μήπω πεφανερῶσθαι τὴν τῶν ἁγίων ὁδὸν ἔτι τῆς πρώτης σκηνῆς ἐχούσης στάσιν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/008.yaml
  text: By this the Holy Spirit is indicating that the way into the holy places has not yet been revealed while the first tabernacle still has standing,
translation:
  language: ta
  text: 'இதன் மூலம் பரிசுத்த ஆவியானவர் சுட்டிக்காட்டுவது என்னவென்றால்: முதல் கூடாரம் இன்னும் நிலைத்திருக்கும்வரை[b], பரிசுத்த இடங்களுக்குள் செல்லும் வழி[a] இன்னும் வெளிப்படுத்தப்படவில்லை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்த தலத்துக்குள் செல்லும் வழி.” கிரேக்கச் சொற்றொடர் பரிசுத்த வளாகத்தைப் பொதுவாகக் குறிக்கலாம்; சிலர் இதை இன்னும் குறிப்பாக, “மகா பரிசுத்த இடத்துக்குள் செல்லும் வழி” என்று புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “முதல் கூடாரம் இன்னும் நின்றுகொண்டிருக்கும்வரை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δηλοῦντος
  choice: இதன் மூலம் ... சுட்டிக்காட்டுவது இதுதான்
  rationale: மரபுத்தொடரின் விளக்கமளிக்கும் நிகழ்கால வலிமையை இயல்பான தமிழில் தருகிறது; ‘இதன் மூலம்’ என்பது முந்தைய கூடார ஒழுங்கைக் குறிக்கிறது.
- source_word: τοῦ πνεύματος τοῦ ἁγίου
  choice: பரிசுத்த ஆவியானவர்
  rationale: புதிய ஏற்பாட்டில் இச்சொற்றொடரின் வழக்கமான குறிப்பையும், தமிழில் நபரைக் குறிக்கும் மரியாதைமிக்க நடையையும் காக்கிறது.
- source_word: μήπω πεφανερῶσθαι
  choice: இன்னும் வெளிப்படுத்தப்படவில்லை
  rationale: நிறைவேற்றப்பட்ட வினையின் செயப்பாட்டு வடிவம் காட்டும், இதுவரை வெளிப்படுத்தப்படாத தொடர்நிலையைத் தெளிவாகத் தருகிறது.
- source_word: τὴν τῶν ἁγίων ὁδὸν
  choice: பரிசுத்த இடங்களுக்குள் செல்லும் வழி
  rationale: கூடாரச் சூழலில் τὰ ἅγια பரிசுத்த இடங்களைக் குறிக்கிறது. ‘உள்ளே செல்லும்’ என்பது அணுகலை இயல்பான தமிழில் தெரிவிக்கிறது; மகா பரிசுத்த இடம் என்று அளவுக்கு மீறிக் குறிப்பாக்கவில்லை.
- source_word: τῆς πρώτης σκηνῆς
  choice: முதல் கூடாரம்
  rationale: உடனடியான சூழலில் முதலாம் பகுதியைக் குறிக்கும் ஆசிரியரின் வரிசை வேறுபாட்டைக் காக்கிறது; ‘கூடாரம்’ வழிபாட்டுச் சூழலுக்கு ஏற்றது.
- source_word: ἔτι ... ἐχούσης στάσιν
  choice: இன்னும் நிலைத்திருக்கும்வரை
  rationale: அந்த முதல் கூடாரம் தொடர்ந்து இருப்பதையோ நிலைபெற்றிருப்பதையோ குறிக்கும் சொற்றொடரைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; வெறும் கட்டிடம் நின்றிருப்பது என்ற ஒரே பொருளுக்குள் கட்டுப்படுத்தவில்லை.
theological_decisions:
- issue: τῶν ἁγίων என்பதன் குறிப்பு
  choice: பரிசுத்த இடங்களுக்குள் செல்லும் அணுகல்
  alternative: பரிசுத்தவான்களின் வழி
  rationale: சுற்றியுள்ள பகுதி கூடாரத்தின் அமைப்பையும் ஆசாரியர்களின் நுழைவையும் பற்றியது; ஆகவே இங்கு இடம் மற்றும் வழிபாடு சார்ந்த பொருளே சூழலுக்கு ஏற்றது.
- issue: பரிசுத்த இடத்தின் குறிப்புத்தன்மை
  choice: பரிசுத்த இடங்கள் என்ற விரிவான குறிப்பு
  alternative: மகா பரிசுத்த இடம் மட்டும்
  rationale: சூழல் குறிப்பாக உட்புறத் திருத்தலத்தை மனதில் கொண்டிருக்கக்கூடும்; ஆனாலும் கிரேக்கப் பன்மை அதைவிட விரிவானது. எனவே மூலத்தின் தெளிவின்மையை முதன்மை உரை காக்கிறது.
- issue: முதல் கூடாரம் ‘நிலைத்திருப்பது’ என்பதன் பொருள்
  choice: அது தொடர்ந்து நிலைத்திருக்கும் காலம்
  alternative: அது கட்டிடமாக இன்னும் நின்றுகொண்டிருக்கும் காலம்
  rationale: στάσιν ἔχειν என்பது வெறும் பௌதிகமாக நிற்பதையும் தாண்டி தொடர்ந்த நிலை அல்லது நடைமுறையில் இருப்பதைக் குறிக்கலாம்; முதன்மை உரை இரண்டையும் அனுமதிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய நடை பயன்படுத்தப்பட்டுள்ளது. ‘பரிசுத்த இடங்கள்’ என்ற பன்மையும், ‘நிலைத்திருக்கும்வரை’ என்ற சொல்லின் பரப்பும் மூலத்திலுள்ள உண்மையான பொருள் நெகிழ்வைக் காக்கின்றன. எல்லா அடிக்குறிப்பு குறிகளும் தொடர்புடைய சொற்றொடர்களுக்குப் பின்னர் முதன்மை உரையில் இடப்பட்டுள்ளன.
