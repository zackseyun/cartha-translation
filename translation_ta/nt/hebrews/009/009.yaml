revisions:
- from: இது தற்போதைய காலத்திற்கான ஓர் உவமை[a]. அதன்படி செலுத்தப்படும் காணிக்கைகளும் பலிகளும், வழிபடுகிறவரை மனச்சாட்சியைப் பொறுத்தவரை நிறைவுள்ளவராக்க இயலாதவை.
  to: இது தற்போதுள்ள காலத்திற்கான ஓர் உவமை[a]. அதன்படி காணிக்கைகளும் பலிகளும் செலுத்தப்படுகின்றன; அவை வழிபடுகிறவரை மனச்சாட்சியைப் பொறுத்தவரை முழுமையாக்க இயலாதவை.
  rationale: திருத்தம் τελειῶσαι என்பதன் பொருளை இயல்பாகவும் துல்லியமாகவும் “முழுமையாக்க” என்று வழங்குகிறது. மேலும், அடிக்குறிப்பில் மூலத்தின் அனுமதிக்கும் சொற்பொருள் மாற்றுகளையே தருகிறது; ஒரு குறிப்பிட்ட முன்மாதிரி/வகை விளக்கத்தைத் திணிக்கவில்லை. வாக்கியப் பிரிப்பு மூலத்தின் தொடர்பைத் தக்கவைத்தபடி தமிழில் தெளிவை மேம்படுத்துகிறது.
