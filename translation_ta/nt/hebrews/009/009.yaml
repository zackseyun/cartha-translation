source:
  edition: SBLGNT
  text: ἥτις παραβολὴ εἰς τὸν καιρὸν τὸν ἐνεστηκότα, καθ’ ⸀ἣν δῶρά τε καὶ θυσίαι προσφέρονται μὴ δυνάμεναι κατὰ συνείδησιν τελειῶσαι τὸν λατρεύοντα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/009.yaml
  text: which is a parable for the present time[a], according to which both gifts and sacrifices are offered that are not able to perfect the worshiper with respect to conscience,
translation:
  language: ta
  text: இது தற்போதுள்ள காலத்திற்கான ஓர் உவமை[a]. அதன்படி காணிக்கைகளும் பலிகளும் செலுத்தப்படுகின்றன; அவை வழிபடுகிறவரை மனச்சாட்சியைப் பொறுத்தவரை முழுமையாக்க இயலாதவை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தற்போதுள்ள காலத்திற்கான ஓர் அடையாளம்” அல்லது “சித்திரம்.”
    reason: παραβολή என்பதற்கு இச்சூழலில் சாத்தியமான பொருள் மாற்றுகளான “symbol” மற்றும் “figure” ஆகியவற்றைப் பாதுகாக்கிறது; “முன்வடிவு” என்ற மிகக் குறிப்பான விளக்கத்தைத் தவிர்க்கிறது.
lexical_decisions:
- source_word: ἥτις
  choice: இது
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட கூடார அமைப்பைச் சுட்டி, அதன் விளக்கத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: παραβολὴ
  choice: உவமை
  rationale: உருவக ஒப்புமை என்ற பரந்த பொருளையும் எபிரெயர் நிருபத்தின் அடையாளத் தொடர்பையும் காக்கிறது; இச்சூழலில் சாத்தியமான வேறு பொருட்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: εἰς τὸν καιρὸν τὸν ἐνεστηκότα
  choice: தற்போதைய காலத்திற்கான
  rationale: ஆசிரியரின் வாதத்தில் அப்போது நிலவிய காலத்தைச் சுட்டும் சொற்றொடரைச் சுருக்கமாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: καθ’ ἣν
  choice: அதன்படி
  rationale: முன்னர் கூறப்பட்ட உவமை அல்லது கூடார ஏற்பாட்டின் அடிப்படையில் காணிக்கைகள் செலுத்தப்படுவதை வெளிப்படுத்துகிறது.
- source_word: δῶρά τε καὶ θυσίαι
  choice: காணிக்கைகளும் பலிகளும்
  rationale: இணைக்கப்பட்ட இரு வழிபாட்டுச் சொற்களையும் வேறுபடுத்திக் காக்கிறது.
- source_word: προσφέρονται
  choice: செலுத்தப்படும்
  rationale: வழிபாட்டில் காணிக்கைகளும் பலிகளும் அர்ப்பணிக்கப்படுவதைக் குறிக்கும் நிகழ்காலச் செயப்பாட்டு உணர்வைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: μὴ δυνάμεναι
  choice: இயலாதவை
  rationale: காணிக்கைகளுக்கும் பலிகளுக்கும் அந்த ஆற்றல் இல்லை என்பதைக் கருத்துத் தெளிவுடன் கூறுகிறது.
- source_word: κατὰ συνείδησιν
  choice: மனச்சாட்சியைப் பொறுத்தவரை
  rationale: நிறைவாக்க இயலாமை எந்தத் தளத்தில் பொருந்துகிறது என்பதைத் தெளிவாக வரையறுக்கிறது; இதை வெறும் நேர்மையான உள்நோக்கம் என்று குறுக்கவில்லை.
- source_word: τελειῶσαι
  choice: நிறைவுள்ளவராக்க
  rationale: கடவுள்முன் நோக்கப்பட்ட முழுநிலைக்கும் தகுதிக்கும் கொண்டுவருதல் என்ற எபிரெயர் நிருபத்தின் கருத்துச் சுமையைப் பேணுகிறது.
- source_word: τὸν λατρεύοντα
  choice: வழிபடுகிறவரை
  rationale: வழிபாட்டில் ஈடுபடும் ஒருவரைக் குறிக்கும் ஒருமைச் சொல்லை இயல்பான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: வழிபாட்டு மற்றும் முன்மாதிரி சார்ந்த சூழலில் παραβολή என்பதன் மொழிபெயர்ப்பு
  choice: உவமை
  alternative: அடையாளம் அல்லது முன்வடிவு
  rationale: பூமிக்குரிய பரிசுத்தகூடார ஏற்பாடு மற்றொரு உண்மையுடன் உருவகத் தொடர்புடையது என்ற பதற்றத்தை ‘உவமை’ காக்கிறது; அதை வெறும் கருத்தியல் அடையாளமாகச் சுருக்கவில்லை. சூழலுக்கு ஏற்ற மாற்று மொழிபெயர்ப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடை. மூலத்தின் நீண்ட வாக்கியத் தொடர்பைத் தக்கவைத்தபடியே வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது.
