  text: Εἶχε μὲν ⸀οὖν ἡ πρώτη δικαιώματα λατρείας τό τε ἅγιον κοσμικόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/001.yaml
  text: Even the first covenant had regulations for worship and an earthly sanctuary[a][b].
translation:
  language: ta
  text: முதல் உடன்படிக்கைக்கும் வழிபாட்டிற்கான விதிமுறைகளும் பூமிக்குரிய பரிசுத்த இடமும் இருந்தன.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முதல் ஒன்று”—அதாவது, முதல் உடன்படிக்கை; சிலர் இதைப் பொதுவாக “முதல் ஏற்பாடு” என்று புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “உலகத்துக்குரிய பரிசுத்த இடம்”; இந்த அதிகாரத்தில் பின்னர் பேசப்படும் பரலோக உண்மைகளுக்கு மாறாக, இங்கு “பூமிக்குரிய” என்பதே பொருளாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶχε
  choice: இருந்தன
  rationale: இறந்தகாலத்தில் நிலவிய ஏற்பாடுகளை அறிமுகப்படுத்தும் முற்றுப்பெறாத இறந்தகால வினை; தமிழில் பன்மை எழுவாய்களோடு இயல்பாக ‘இருந்தன’ என வழங்கப்படுகிறது.
- source_word: μὲν οὖν
  choice: -க்கும்கூட
  rationale: முந்தைய வாதத்திலிருந்து தொடரும் மாற்றத்தையும் மென்மையான வலியுறுத்தலையும் இயல்பான தமிழில் காட்டுகிறது; தனியான காலச்சுட்டுச் சொல்லைச் சேர்ப்பதில்லை.
- source_word: ἡ πρώτη
  choice: முதலாம் உடன்படிக்கை
  rationale: பெண்பால் வடிவமான ‘முதலாம்’ என்பதன் விடுபட்ட பெயர்ச்சொல், 8:13-இன் உடனடி சூழலில் ‘உடன்படிக்கை’ என்பதே மிகச் சாத்தியமானது; தெளிவுக்காக அது நிரப்பப்பட்டுள்ளது.
- source_word: δικαιώματα
  choice: ஒழுங்குமுறைகள்
  rationale: வழிபாட்டை ஒழுங்குபடுத்தும் விதிமுறைகள் அல்லது நியமங்கள் என்ற சமயச் சட்டப் பொருளை நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: λατρείας
  choice: வழிபாட்டுக்கான
  rationale: இங்கு சமய ஆராதனை அல்லது வழிபாட்டைச் சுட்டுகிறது; விதிமுறைகளின் நோக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τό τε ἅγιον
  choice: பரிசுத்த இடம்
  rationale: அடுத்த வசனங்களில் அதன் பகுதிகள் விரிவாக விவரிக்கப்படுவதால், குறிப்பிட்ட ஓர் அறையாகக் குறுக்காமல் பொதுவான புனித இருப்பிடத்தைச் சுட்டுகிறது.
- source_word: κοσμικόν
  choice: பூமிக்குரிய
  rationale: பின்னர் வரும் பரலோக உண்மைகளுடன் உள்ள இடம் மற்றும் ஒழுங்கு சார்ந்த வேறுபாட்டைத் தருகிறது; ‘உலகத்துக்குரிய’ என்பதில் தோன்றக்கூடிய ஒழுக்க எதிர்மறை நிழலைத் தவிர்க்கிறது.
theological_decisions:
- issue: ἡ πρώτη என்பதன் மறைந்துள்ள பெயர்ச்சொல்
  choice: முதலாம் உடன்படிக்கை
  alternative: முதலாம் ஒன்று; முதலாம் ஏற்பாடு; முதலாம் கூடாரம்
  rationale: எபிரெயர் 8-ஆம் அதிகாரத்தின் உடனடி சூழல் முதலாம் உடன்படிக்கையையும் புதிய உடன்படிக்கையையும் ஒப்பிடுகிறது. ஆகவே ‘உடன்படிக்கை’ மிகச் சாத்தியமான குறிப்பு; இருப்பினும் கிரேக்கத்தில் பெயர்ச்சொல் வெளிப்படையாக இல்லை என்பதால் மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: κοσμικόν என்பதன் பொருள்
  choice: பூமிக்குரிய
  alternative: உலகத்துக்குரிய
  rationale: இங்கு ஒழுக்க ரீதியில் உலகப்பற்றுள்ளதென்ற பொருள் அல்ல; பூமியிலுள்ள பரிசுத்த இடத்துக்கும் பின்னர் விவாதிக்கப்படும் பரலோக உண்மைகளுக்கும் இடையிலான வேறுபாடே முன்னிலைப்படுகிறது.
translation_notes:
  register: நவீன தரமான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘உடன்படிக்கை’ என்பது சூழலால் நிரப்பப்பட்ட சொல்லாக இருப்பதும், κοσμικόν என்பதன் மாற்றுப் பொருளும் அடிக்குறிப்புகளில் வெளிப்படையாகக் காக்கப்பட்டுள்ளன.
