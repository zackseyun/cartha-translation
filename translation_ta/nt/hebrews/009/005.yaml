reference: Hebrews 9:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὑπεράνω δὲ αὐτῆς Χερουβὶν δόξης κατασκιάζοντα τὸ ἱλαστήριον· περὶ ὧν οὐκ ἔστιν νῦν λέγειν κατὰ μέρος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/005.yaml
  text: And above it were the cherubim of glory overshadowing the atoning sacrifice[a]; about these things it is not now possible to speak in detail.
translation:
  language: ta
  text: அதன் மேலே, மகிமையின் கேருபீன்கள் கிருபாசனத்தின்மேல் நிழலிட்டுக்கொண்டிருந்தன[a]. இவற்றைக் குறித்து இப்போது ஒவ்வொன்றாக விவரிக்க இயலாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, உடன்படிக்கைப் பெட்டியின் மூடி. ‘பாவநிவாரணம்’ என்றும், சில சூழல்களில் ‘பாவநிவாரணப் பலி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: ἱλαστήριον இவ்வசனத்தில் பெட்டியின் மூடியைக் குறிக்கிறது; சொல்லின் பிற சூழல்சார் பொருள் வாய்ப்புகள் மாற்றுகளாகக் குறிப்பிடப்படுகின்றன.
lexical_decisions:
- source_word: ὑπεράνω δὲ αὐτῆς
  choice: அதற்கு மேலே
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட உடன்படிக்கைப் பெட்டிக்கு மேலுள்ள இடத்தைக் குறிக்கிறது; பெட்டியைப் பெயரிட்டு மீண்டும் சேர்க்காமல் கிரேக்கப் பிரதிப்பெயரின் தொடர்பைப் பேணுகிறது.
- source_word: Χερουβὶν
  choice: கேருபீன்கள்
  rationale: வானுலக உயிரினங்களுக்கான தமிழ்க் கிறிஸ்தவ வழக்கில் அறியப்பட்ட ஒலிபெயர்ப்பு; இங்கு பன்மையைக் குறிக்கிறது.
- source_word: δόξης
  choice: மகிமையின்
  rationale: கேருபீன்களுக்கும் இறை மகிமைக்கும் உள்ள தொடர்பைத் துல்லியமாக வரையறுக்காமல், கிரேக்க மொழியின் சுருக்கமான உடைமைவேற்றுமை அமைப்பையும் அதன் தெளிவின்மையையும் பேணுகிறது.
- source_word: κατασκιάζοντα
  choice: நிழலிட்டபடி இருந்தன
  rationale: கேருபீன்கள் மூடியின் மேல் தங்கள் சிறகுகளை விரித்திருந்த நிலையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: τὸ ἱλαστήριον
  choice: பாவநிவாரண மூடி
  rationale: இந்தத் திருக்கூடாரச் சூழலில் சொல் உடன்படிக்கைப் பெட்டியின் மூடியைக் குறிப்பதால் ‘மூடி’ என்பதை வெளிப்படையாகக் கூறுகிறது; அதேவேளை சொல்லின் பாவநிவாரணத் தொடர்பையும் பேணுகிறது. பிற சாத்தியமான மொழிபெயர்ப்புகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: περὶ ὧν
  choice: இவற்றைப் பற்றி
  rationale: முன்னர் விவரிக்கப்பட்ட திருக்கூடாரப் பொருட்களைச் சுட்டும் இயல்பான தமிழ்த் தொடர்.
- source_word: οὐκ ἔστιν νῦν λέγειν κατὰ μέρος
  choice: இப்போது விரிவாகப் பேச முடியாது
  rationale: தற்போது ஒவ்வொன்றையும் விவரமாக எடுத்துரைப்பது இயலாது அல்லது பொருத்தமல்ல என்ற கிரேக்கக் கூற்றை இயல்பாகத் தருகிறது; காரணத்தை மேலதிகமாக ஊகிக்கவில்லை.
theological_decisions:
- issue: திருக்கூடாரப் பொருளைக் குறிக்கும் ἱλαστήριον என்பதன் மொழிபெயர்ப்பு
  choice: பாவநிவாரண மூடி
  alternative: கிருபாசனம்; பாவநிவாரணம்; பாவநிவாரணப் பலி
  rationale: எபிரெயர் 9:5-ன் உடனடிச் சூழலில் இது உடன்படிக்கைப் பெட்டியின் மூடியையே குறிப்பாகச் சுட்டுகிறது. ‘பாவநிவாரண மூடி’ என்பது அந்தப் பொருளையும் அதன் சடங்கு-இறையியல் செயலையும் இணைத்துக் காட்டுகிறது. சொல் கொண்டுள்ள மாற்றுப் பொருள் வாய்ப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. ‘மகிமையின் கேருபீன்கள்’ என்ற அமைப்பு மூலத்தின் இறையியல் சுருக்கத்தையும் தெளிவின்மையையும் பேணுகிறது; ‘பாவநிவாரண மூடி’ சூழலிலுள்ள பொருளைத் தெளிவுபடுத்துகிறது.
