  text: σκηνὴ γὰρ κατεσκευάσθη ἡ πρώτη ἐν ᾗ ἥ τε λυχνία καὶ ἡ τράπεζα καὶ ἡ πρόθεσις τῶν ἄρτων, ἥτις λέγεται Ἅγια·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/002.yaml
  text: For a first tabernacle was prepared[a], in which were the lampstand and the table and the bread of the Presence[b], which is called the Holy Place.
translation:
  language: ta
  text: முதல் கூடாரம் ஆயத்தப்படுத்தப்பட்டது. அதில் விளக்குத்தண்டும் மேசையும் முன்வைக்கப்பட்ட அப்பங்களும்[a] இருந்தன. அந்த இடம் பரிசுத்த இடம்[b] என்று அழைக்கப்படுகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சந்நிதியின் அப்பங்கள்”; சொல்லர்த்தமாக, “அப்பங்களை முன்வைத்தல்.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் “பரிசுத்த இடங்கள்”; இங்கு கூடாரத்தின் முதல் அறையாகிய பரிசுத்த இடத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνὴ
  choice: கூடாரம்
  rationale: எபிரெயர் 9-ன் சூழலில் இது மோசேயின் காலத்து வழிபாட்டுக் கூடாரத்தையும், இங்கு குறிப்பாக அதன் முதல் அறையையும் குறிக்கிறது; ‘கூடாரம்’ இயல்பாகவும் பழைய ஏற்பாட்டுத் தொடர்பைத் தக்கவைத்தும் உள்ளது.
- source_word: κατεσκευάσθη
  choice: ஆயத்தப்படுத்தப்பட்டிருந்தது
  rationale: இறைச்செயப்பாட்டு வடிவத்தையும் புனித இடம் ஒழுங்கமைக்கப்பட்டிருந்த நிலைமையையும் வெளிப்படுத்துகிறது; கட்டுமானத்தை மட்டும் குறிக்கும் சொல்லைவிட இங்கு விரிவானது.
- source_word: ἡ πρώτη
  choice: முதலாம்
  rationale: அடுத்த வசனத்தில் வரும் இரண்டாம் பகுதிக்கு எதிராக, கூடாரத்தின் முதல் அறையைக் குறிக்கிறது.
- source_word: λυχνία
  choice: விளக்குத்தண்டு
  rationale: எண்ணெய் விளக்குகளைத் தாங்கிய வழிபாட்டுப் பொருளைக் குறிக்கிறது; மெழுகுவர்த்தி என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: τράπεζα
  choice: மேசை
  rationale: பரிசுத்த இடத்திலிருந்த வழிபாட்டுப் பொருளுக்கான நேரடியான, இயல்பான தமிழ் சொல்.
- source_word: ἡ πρόθεσις τῶν ἄρτων
  choice: அர்ப்பணிக்கப்பட்ட அப்பங்கள்
  rationale: அப்பங்களை முன்வைத்தல் அல்லது இறைசந்நிதியில் வைப்பது என்ற கிரேக்கக் கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது; ‘சந்நிதியின் அப்பங்கள்’ என்ற மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἥτις λέγεται
  choice: அது ... என்று அழைக்கப்படுகிறது
  rationale: முதல் கூடாரப் பகுதியின் பெயரை அறிமுகப்படுத்தும் உறவுத்தொடரைத் தெளிவான தமிழில் தருகிறது.
- source_word: Ἅγια
  choice: பரிசுத்த இடம்
  rationale: கிரேக்கத்தில் பன்மை வடிவம் இருந்தாலும், சூழலில் கூடாரத்தின் முதல் அறையே குறிக்கப்படுகிறது; அடுத்த வசனத்தின் மகா பரிசுத்த இடத்திலிருந்து இதை வேறுபடுத்துகிறது.
theological_decisions:
- issue: Ἅγια என்பதற்கும் கூடாரத்தின் அறைகளுக்கும் உள்ள தொடர்பு
  choice: பரிசுத்த இடம்
  alternative: பரிசுத்த இடங்கள்; பரிசுத்த ஸ்தலம்
  rationale: மூலத்தில் வடிவம் பன்மையாக இருந்தாலும் உடனடிச் சூழல் முதல் அறையைக் குறிக்கிறது. ஒருமை மொழிபெயர்ப்பு இடவமைப்புச் சார்ந்த வேறுபாட்டைத் தெளிவாக்குகிறது; பன்மை வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἡ πρόθεσις τῶν ἄρτων என்பதன் பொருள்
  choice: அர்ப்பணிக்கப்பட்ட அப்பங்கள்
  alternative: சந்நிதியின் அப்பங்கள்; முன்வைக்கப்பட்ட அப்பங்கள்
  rationale: சடங்கில் அப்பங்கள் இறைசந்நிதியில் முன்வைக்கப்பட்டதைத் தெரிவிக்கிறது; குறிப்பிட்ட பாரம்பரியப் பதத்தை மட்டும் கட்டாயப்படுத்தாமல் மூலத்தின் செயற்பொருளைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை. நீண்ட கிரேக்க வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; ஒவ்வொரு அடிக்குறிப்பு குறியீடும் உரையில் சேர்க்கப்பட்டுள்ளது.
