  yaml_path: translation/nt/hebrews/009/016.yaml
  text: For where there is a covenant[a], it is necessary for the death of the one who made it to be brought forward.
translation:
  language: ta
  text: ஏனெனில், எங்கே ஓர் உடன்படிக்கை இருக்கிறதோ, அங்கே அதை ஏற்படுத்தியவரின் மரணம் முன்வைக்கப்படுவது அவசியம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏனெனில், எங்கே ஓர் உயில் இருக்கிறதோ, அங்கே அதைச் செய்தவரின் மரணம் உறுதிப்படுத்தப்படுவது அவசியம்.” διαθήκη என்ற கிரேக்கச் சொல் ‘உடன்படிக்கை’ அல்லது ‘உயில்’ என இருவகையில் பொருள்படலாம்; 16–17 வசனங்களில் பலர் இதைச் சட்டரீதியான பொருளில் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: διαθήκη
  choice: உடன்படிக்கை
  rationale: எபிரெயர் 8–10 அதிகாரங்களின் பரந்த சூழலில் எரேமியா 31-ஐச் சார்ந்த உடன்படிக்கை வாதமும் பலியினால் தொடங்கிவைக்கப்படுதலும் மேலோங்குகின்றன. இருப்பினும், இச்சொல்லுக்கு ‘உயில்’ என்ற சட்டப் பொருளும் இருக்கக்கூடும் என்பதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: θάνατον
  choice: மரணம்
  rationale: இங்கு விவாதிக்கப்படும் அவசியமான நிபந்தனையாகிய உண்மையான மரணத்தை நேரடியாகக் குறிக்கிறது.
- source_word: ἀνάγκη
  choice: அவசியம்
  rationale: தேவையை வெளிப்படுத்தும் கிரேக்கப் பெயர்ச்சொல்லின் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: φέρεσθαι
  choice: முன்வைக்கப்படுவது
  rationale: ‘கொண்டுவரப்படுதல்/முன்வைக்கப்படுதல்’ என்ற செயல்பாட்டு இறைச்சொல்லின் கருத்தை நெருக்கமாகக் காக்கிறது; ‘நிறுவப்படுதல்’ என்று பொருளைத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: τοῦ διαθεμένου
  choice: அதை ஏற்படுத்தியவர்
  rationale: διατίθεμαι என்பதன் செய்பவரைக் குறிக்கிறது. ‘உயில் எழுதியவர்’ என்று சட்டப் பொருளை முதன்மை உரையிலேயே கட்டாயப்படுத்தாமல், உடன்படிக்கையை ஏற்படுத்தியவரை இயல்பாகச் சுட்டுகிறது.
- source_word: ὅπου γὰρ
  choice: ஏனெனில், எங்கே ... அங்கே
  rationale: γάρ என்பதன் விளக்கத் தொடர்பையும் ὅπου என்பதன் இடம்/நிலை சார்ந்த தொடர்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: எபிரெயர் 9:16-ல் διαθήκη என்பதற்கு ‘உடன்படிக்கை’ அல்லது ‘உயில்’ என்று மொழிபெயர்ப்பதா
  choice: முதன்மை உரையில் ‘உடன்படிக்கை’; அடிக்குறிப்பில் ‘உயில்’
  alternative: முதன்மை உரையில் ‘உயில்’
  rationale: உடனடி வசனங்களில் சட்டரீதியான உயில் பொருள் சாத்தியமானதாக இருந்தாலும், எபிரெயர் 8–10-ன் பரந்த வாதம் உடன்படிக்கையை மையமாகக் கொண்டது. உண்மையான இருபொருள் வாய்ப்பையும் இறையியல் அழுத்தத்தையும் மறைக்காமல் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: φέρεσθαι என்பதன் பொருளை ‘நிறுவப்படுதல்’ என்று விளக்குவதா அல்லது அதன் உருவகத்தைப் பாதுகாப்பதா
  choice: ‘முன்வைக்கப்படுவது’ என்று மொழிபெயர்த்தல்
  alternative: ‘உறுதிப்படுத்தப்படுவது’ அல்லது ‘நிறுவப்படுவது’
  rationale: கிரேக்கச் சொல்லின் ‘கொண்டுவரப்படுதல்/முன்வைக்கப்படுதல்’ என்ற அடிப்படை இயக்கத்தைப் பாதுகாத்து, விவாதத்திற்குரிய சட்ட அல்லது உடன்படிக்கைச் செயல்பாட்டை மொழிபெயர்ப்பிலேயே முடிவுசெய்யாமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘எங்கே ... அங்கே’ அமைப்பு கிரேக்க வாக்கியத்தின் தொடர்பை இயல்பாகக் காட்டுகிறது. விவாதத்திற்குரிய ‘உடன்படிக்கை/உயில்’ இருபொருள் முதன்மை உரை மற்றும் அடிக்குறிப்பு வழியாக வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
