revisions:
- from: வெள்ளாட்டுக் கடாக்கள் மற்றும் கன்றுகளின் இரத்தத்தின் மூலமாக அல்ல, தமது சொந்த இரத்தத்தின் மூலமாகவே அவர் ஒரே முறையாகப் பரிசுத்த இடங்களுக்குள்[a] நுழைந்து, நித்திய மீட்பைப் பெற்றார்.
  to: வெள்ளாட்டுக் கடாக்கள் மற்றும் கன்றுகளின் இரத்தத்தின் மூலமாக அல்ல; மாறாக, தம் சொந்த இரத்தத்தின் மூலமாக, நித்திய மீட்பைப் பெற்று, அவர் ஒரே முறையாகப் பரிசுத்த இடங்களுக்குள்[a] நுழைந்தார்.
