language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐδὲ δι’ αἵματος τράγων καὶ μόσχων διὰ δὲ τοῦ ἰδίου αἵματος, εἰσῆλθεν ἐφάπαξ εἰς τὰ ἅγια, αἰωνίαν λύτρωσιν εὑράμενος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/012.yaml
  text: and not through the blood of goats and calves[a], but through his own blood, he entered once for all into the holy places, having obtained eternal redemption.
translation:
  language: ta
  text: வெள்ளாட்டுக் கடாக்கள் மற்றும் கன்றுகளின் இரத்தத்தின் மூலமாக அல்ல; மாறாக, தம் சொந்த இரத்தத்தின் மூலமாக, நித்திய மீட்பைப் பெற்று, அவர் ஒரே முறையாகப் பரிசுத்த இடங்களுக்குள்[a] நுழைந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்த ஸ்தலத்துக்குள்.” கிரேக்கத்தில் நேரடியாக “பரிசுத்த இடங்களுக்குள்” என்ற பன்மை உள்ளது. சில மொழிபெயர்ப்புகள் இதை இன்னும் குறிப்பாக “மகா பரிசுத்த இடத்துக்குள்” என்று தருகின்றன; ஆனால் கிரேக்கச் சொற்கள் அவ்வளவு குறிப்பாகக் கூறவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ
  choice: அல்ல
  rationale: முந்தைய வசனத்திலிருந்து தொடரும் எதிர்மறை ஒப்பீட்டை இயல்பான தமிழில் காட்டுகிறது; அடுத்துள்ள ‘மூலமாகவே’ என்பதுடன் சேர்ந்து கிரேக்கத்தின் மாறுபாட்டைத் தெளிவாக்குகிறது.
- source_word: δι’ αἵματος τράγων καὶ μόσχων
  choice: வெள்ளாட்டுக் கடாக்கள் மற்றும் கன்றுகளின் இரத்தத்தின் மூலமாக
  rationale: διά + genitive இங்கு வழிமுறை அல்லது கருவியைக் குறிக்கிறது. ‘மூலமாக’ என்பது அடுத்த சொற்றொடரிலும் மீண்டும் வருவதால் ஒப்பீடு பாதுகாக்கப்படுகிறது; μόσχων என்பதற்கு ‘கன்றுகள்’ நேரான பொருத்தம்.
- source_word: διὰ δὲ τοῦ ἰδίου αἵματος
  choice: தமது சொந்த இரத்தத்தின் மூலமாகவே
  rationale: மீண்டும் வரும் διά என்பதற்கு அதே ‘மூலமாக’ பயன்படுத்தப்பட்டுள்ளது. ἰδίου தரும் உடைமை வலியுறுத்தலை ‘தமது சொந்த’ என்பதும், δέ தரும் முரண்பாட்டு வலியுறுத்தலை ‘வே’ என்பதும் இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: εἰσῆλθεν
  choice: அவர் … நுழைந்தார்
  rationale: Aorist indicative குறிக்கும் நிறைவேறிய நுழைவு செயலை இயல்பான தமிழில் தெரிவிக்கிறது. எழுவாய் சூழலில் கிறிஸ்து என்பதால் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐφάπαξ
  choice: ஒரே முறையாக
  rationale: ஒருமுறை மட்டுமே நிகழ்ந்த, மீண்டும் செய்யத் தேவையற்ற தீர்மானமான செயல் என்ற பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: εἰς τὰ ἅγια
  choice: பரிசுத்த இடங்களுக்குள்
  rationale: கிரேக்கப் பன்மையான τὰ ἅγια என்பதைப் பாதுகாக்கிறது. ‘மகா பரிசுத்த இடம்’ என்று குறிப்பாக்கி விளக்குவதைத் தவிர்க்கிறது.
- source_word: αἰωνίαν λύτρωσιν
  choice: நித்திய மீட்பு
  rationale: நிலைத்த, முடிவில்லாத பயனைக் கொண்ட மீட்பு என்னும் சூழல்சார் பொருளைத் துல்லியமாகவும் வழக்கமான இறையியல் தமிழிலும் தருகிறது.
- source_word: εὑράμενος
  choice: மீட்பைப் பெற்றார்
  rationale: சொல்லுக்கு நேராக ‘கண்டார்’ என்றாலும், இச்சூழலில் அடைதல் அல்லது பெற்றுக்கொள்ளுதல் என்பதே இயல்பான கருத்து. தமிழில் நுழைவு மற்றும் மீட்பைப் பெறுதல் ஆகியவற்றை ஒருங்கிணைந்த நிறைவேறிய செயல்களாகத் தெளிவாகக் கூறுகிறது.
theological_decisions:
- issue: கிறிஸ்து தமது சொந்த இரத்தத்தின் மூலமாக நுழைந்தார் என்பதன் பொருளும் வலிமையும்
  choice: விலங்குகளின் இரத்தத்திற்கு மாறாக, தமது சொந்த இரத்தத்தின் மூலமாக அவர் பரிசுத்த இடங்களுக்குள் நுழைந்தார் என்று மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: அவர் தமது இரத்தத்தைப் பொருள்சார்ந்த வகையில் எடுத்துச் சென்று சமர்ப்பித்தார்; அல்லது இரத்தம் சிந்திய பிறகு மட்டுமே அவர் நுழைந்தார்.
  rationale: மீண்டும் வரும் διά + genitive இரண்டிடத்திலும் ‘மூலமாக’ என்று ஒரே விதமாகக் கொடுக்கப்பட்டுள்ளது. இதனால் பலியின் மாதிரி ஒப்பீடு நிலைக்கிறது; ஆனால் பரலோகப் பரிசுத்த இடத்தில் இரத்தம் எவ்வாறு சமர்ப்பிக்கப்பட்டது என்ற ஊகமான செயல்முறை திணிக்கப்படவில்லை.
- issue: τὰ ἅγια என்பதன் பரப்பு
  choice: பன்மையைப் பாதுகாத்து ‘பரிசுத்த இடங்கள்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: ‘பரிசுத்த ஸ்தலம்’ அல்லது ‘மகா பரிசுத்த இடம்.’
  rationale: இது பரிசுத்த ஸ்தலத்தைக் குறிக்கும் வழிபாட்டுச் சொல்லாக இருக்கக்கூடும்; எனினும் ‘மகா பரிசுத்த இடம்’ என்பது கிரேக்கச் சொற்கள் வெளிப்படையாகச் சொல்வதைவிடக் குறிப்பான விளக்கம். மூலத்தின் உண்மையான திறந்தநிலை பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘பரிசுத்த இடங்கள்,’ ‘நித்திய மீட்பு’ போன்ற சொற்கள் மூலத்தின் வழிபாட்டு மற்றும் இறையியல் நுணுக்கத்தைப் பாதுகாக்கின்றன; தேவையற்ற சமயப்பிரிவு சார்ந்த விளக்கங்கள் சேர்க்கப்படவில்லை.
