id: HEB.9.13
reference: Hebrews 9:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ γὰρ τὸ αἷμα ⸂τράγων καὶ ταύρων⸃ καὶ σποδὸς δαμάλεως ῥαντίζουσα τοὺς κεκοινωμένους ἁγιάζει πρὸς τὴν τῆς σαρκὸς καθαρότητα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/013.yaml
  text: For if the blood of goats and bulls[a], and the ashes of a heifer that sprinkle those who have been defiled, sanctify for the purification of the flesh[d][c][b],
translation:
  language: ta
  text: ஏனெனில், ஆட்டுக்கடாக்கள் மற்றும் காளைகளின் இரத்தமும், தீட்டடைந்தவர்கள்மேல் தெளிக்கிற கிடாரியின் சாம்பலும்[a] உடல்சார்ந்த தூய்மைக்காக[b] அவர்களைப் பரிசுத்தமாக்குகின்றன என்றால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எண்ணாகமம் 19-ல் கூறப்படும் கிடாரியின் சாம்பலைப் பயன்படுத்திய தூய்மைப்படுத்தும் சடங்கை இது சுட்டுகிறது.
    reason: cross_reference
  - marker: b
    text: அதாவது, பழைய உடன்படிக்கையின் சடங்குகளின்படி உடல் சார்ந்த வெளிப்புறத் தூய்மை.
    reason: cultural_note
lexical_decisions:
- source_word: εἰ γὰρ
  choice: ஏனெனில் ... என்றால்
  rationale: γάρ என்பதன் காரணவிளக்கத் தொடர்பையும் εἰ என்பதன் நிபந்தனை அமைப்பையும் காக்கிறது; வாக்கியம் அடுத்த வசனத்தில் நிறைவடைவதால் இறுதியில் காற்புள்ளி வைக்கப்படுகிறது.
- source_word: τὸ αἷμα τράγων καὶ ταύρων
  choice: வெள்ளாட்டுக்கடாக்கள் மற்றும் காளைகளின் இரத்தம்
  rationale: பலியிடும் சூழலில் αἷμα என்பதற்கு நேரான ‘இரத்தம்’ பயன்படுத்தப்பட்டுள்ளது; τράγων என்பதன் ஆண்பால் குறிப்பை ‘வெள்ளாட்டுக்கடாக்கள்’ தெளிவாகக் காட்டுகிறது.
- source_word: σποδὸς δαμάλεως
  choice: கிடாரியின் சாம்பல்
  rationale: δαμάλις என்பது கன்று ஈனாத இளம் பெண்பசுவைக் குறிக்கும் பலிச்சடங்குச் சொல்; தமிழில் ‘கிடாரி’ அந்தக் குறிப்பைச் சுருக்கமாகவும் துல்லியமாகவும் தருகிறது.
- source_word: ῥαντίζουσα τοὺς κεκοινωμένους
  choice: தீட்டுப்பட்டவர்கள்மேல் தெளிக்கப்படும்
  rationale: கிரேக்கத்தில் ‘சாம்பல்’ எழுவாயாக அமைந்த செயப்பாட்டு வடிவம் இருந்தாலும், தமிழில் சடங்கின் செயலை இயல்பாகத் தெரிவிக்கச் செயப்பாட்டு வினை பயன்படுத்தப்படுகிறது; κεκοινωμένους என்பதன் நிறைவுற்ற சடங்குத் தீட்டு நிலையை ‘தீட்டுப்பட்டவர்கள்’ காக்கிறது.
- source_word: ἁγιάζει
  choice: பரிசுத்தமாக்குகின்றன
  rationale: பழைய உடன்படிக்கைச் சடங்கின் வழிபாட்டு சார்ந்த பரிசுத்தப்படுத்துதலைக் காக்கும் சொல்; உள்ளார்ந்த ஒழுக்க மாற்றம் என்று விரிவுபடுத்தவில்லை.
- source_word: πρὸς τὴν τῆς σαρκὸς καθαρότητα
  choice: மாம்சத் தூய்மைக்காக
  rationale: σάρξ என்பதற்கு ‘மாம்சம்’ என்றும் καθαρότης என்பதற்கு ‘தூய்மை’ என்றும் மொழிபெயர்த்து, அடுத்த வசனத்திலுள்ள மனச்சாட்சியின் சுத்திகரிப்புடனான வெளிப்புற வேறுபாட்டை நிலைநிறுத்துகிறது.
theological_decisions:
- issue: பழைய உடன்படிக்கைச் சடங்குகள் ‘பரிசுத்தமாக்குகின்றன’ என்பதன் பொருள்
  choice: சடங்கு மற்றும் வழிபாட்டு அடிப்படையிலான பரிசுத்தப்படுத்துதல்
  alternative: உள்ளார்ந்த ஆவிக்குரிய அல்லது ஒழுக்க மாற்றம்
  rationale: ‘மாம்சத் தூய்மை’ என்ற வரம்பும் அடுத்த வசனத்தில் வரும் மனச்சாட்சியின் சுத்திகரிப்புடனான ஒப்பீடும் இங்கு வெளிப்புறச் சடங்குத் தூய்மையே நோக்கப்படுவதை காட்டுகின்றன.
- issue: σάρξ என்பதன் பொருள்
  choice: வெளிப்புற, உடல் சார்ந்த ‘மாம்சம்’
  alternative: ‘பாவ இயல்பு’ அல்லது உள்ளார்ந்த மாம்ச சுபாவம்
  rationale: எண்ணாகமம் 19 சார்ந்த தூய்மைப்படுத்தும் சடங்கு இங்கு பேசப்படுவதால் σάρξ உடல்/வெளிப்புறத் தளத்தைக் குறிக்கிறது; பாவ இயல்பைக் குறிக்கவில்லை.
- issue: ῥαντίζουσα என்பதன் இலக்கண வடிவம்
  choice: தமிழில் ‘தெளிக்கப்படும்’ என்ற இயல்பான செயப்பாட்டு அமைப்பு
  alternative: ‘தீட்டுப்பட்டவர்களைத் தெளிக்கும் சாம்பல்’ என்ற கிரேக்கத்திற்கு நெருக்கமான செயல்வினை அமைப்பு
  rationale: கிரேக்கத்தில் பெண்பால் ஒருமை நிகழ்காலப் பங்குவினை ‘சாம்பல்’ என்பதோடு இயைகிறது. ஆனால் சாம்பலே தனியாகச் செயற்படுகிறது என்ற தவறான எண்ணத்தைத் தமிழில் தவிர்க்கவும், எண்ணாகமம் 19 சடங்கின் நடைமுறையை இயல்பாகச் சொல்லவும் செயப்பாட்டு அமைப்பு தேர்ந்தெடுக்கப்பட்டது; மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நடை நவீனத் தரத் தமிழிலும் வழிபாட்டு உரைக்கு ஏற்ற கண்ணியத்துடனும் உள்ளது. ‘கிடாரி’, ‘தீட்டு’, ‘பரிசுத்தமாக்கு’, ‘மாம்சத் தூய்மை’ ஆகியவை சூழலுக்குத் தேவையான சடங்கு மற்றும் இறையியல் துல்லியத்தைப் பாதுகாக்கின்றன. வசனம் அடுத்த வசனத்தில் நிறைவடையும் நிபந்தனைத் துணைவாக்கியம் என்பதால் முடிவில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
