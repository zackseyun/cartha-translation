source:
  edition: SBLGNT
  text: λαληθείσης γὰρ πάσης ἐντολῆς κατὰ ⸀τὸν νόμον ὑπὸ Μωϋσέως παντὶ τῷ λαῷ, λαβὼν τὸ αἷμα τῶν ⸀μόσχων μετὰ ὕδατος καὶ ἐρίου κοκκίνου καὶ ὑσσώπου αὐτό τε τὸ βιβλίον καὶ πάντα τὸν λαὸν ἐράντισεν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/019.yaml
  text: For when every commandment according to the law had been spoken by Moses to all the people[a], he took the blood of the calves with water and scarlet wool and hyssop, and sprinkled both the scroll itself and all the people,
translation:
  language: ta
  text: நியாயப்பிரமாணத்தின்படி ஒவ்வொரு கட்டளையும் மோசேயால் மக்கள் அனைவருக்கும் சொல்லப்பட்டபின், அவர் கன்றுகளின்[a] இரத்தத்தைத் தண்ணீருடனும் செந்நிற ஆட்டுமயிருடனும் ஈசோப்புடனும் எடுத்து, சுருளின் மீதேயும் மக்கள் அனைவர்மேலும் தெளித்தார்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இளம் காளைகளின்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் பலிச் சூழலில் கன்றுகளையோ இளம் காளைகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαληθείσης γὰρ πάσης ἐντολῆς
  choice: ஒவ்வொரு கட்டளையும் ... சொல்லப்பட்டபின்
  rationale: மரபுத்தொடரின் காலப் பொருளையும் πάσης என்பதன் பகிர்ந்தளிக்கும் வலிமையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது. γάρ முந்தைய கருத்துக்கான விளக்கத்தை அறிமுகப்படுத்துகிறது; தொடர்ச்சியான வாக்கிய அமைப்பில் அது தனியே மொழிபெயர்க்கப்படாமலிருந்தாலும் தொடர்பு காக்கப்படுகிறது.
- source_word: κατὰ τὸν νόμον
  choice: நியாயப்பிரமாணத்தின்படி
  rationale: κατά என்பதன் ‘அதற்கு இணங்க’ என்ற பொருளைச் சுருக்கமாகவும் தமிழ்வேதாகம வழக்கிற்கு ஏற்றவாறும் தருகிறது.
- source_word: ὑπὸ Μωϋσέως παντὶ τῷ λαῷ
  choice: மோசேயால் மக்கள் அனைவருக்கும்
  rationale: செயப்படுபொருள் வாக்கியத்தில் மோசேயைச் செய்பவராகவும் முழு மக்களையும் கேட்பவர்களாகவும் தெளிவாகக் காட்டுகிறது.
- source_word: λαβὼν τὸ αἷμα τῶν μόσχων
  choice: அவர் கன்றுகளின் இரத்தத்தை ... எடுத்து
  rationale: பங்கேற்புவினையை இயல்பான தமிழ் கதைநடையில் முடிவுற்ற வினையாக வழங்குகிறது. μόσχων என்பதன் நேரடியான பொதுப்பொருளாக ‘கன்றுகள்’ வைக்கப்பட்டு, பலிக்குரிய சூழலில் சாத்தியமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: μετὰ ὕδατος καὶ ἐρίου κοκκίνου καὶ ὑσσώπου
  choice: தண்ணீருடனும் செந்நிறக் கம்பளியுடனும் ஈசோப்புடனும்
  rationale: மூன்று பொருட்களின் உடனிணைவு அல்லது கருவிசார் தொடர்பைப் பாதுகாக்கிறது; ἐρίου என்பது கம்பளியையும் κοκκίνου அதன் செந்நிறத்தையும் குறிக்கிறது.
- source_word: αὐτό τε τὸ βιβλίον καὶ πάντα τὸν λαὸν
  choice: சுருளின்மேலேயும் மக்கள் அனைவர்மேலும்
  rationale: τε ... καί இணைப்பையும் αὐτό தரும் வலியுறுத்தலையும் ‘மேலேயும் ... மேலும்’ என்ற அமைப்பில் காக்கிறது. பண்டைய உடன்படிக்கை ஆவணத்தின் வடிவுக்கு ‘சுருள்’ பொருத்தமானது.
- source_word: ἐράντισεν
  choice: தெளித்தார்
  rationale: சடங்குசார் தெளித்தலைத் துல்லியமாகவும் சாதாரண வாசகருக்கு புரியும் வகையிலும் கூறுகிறது.
theological_decisions:
- issue: யாத்திராகமம் 24 நிகழ்வுடன் இவ்வசனத்திற்குள்ள தொடர்பும் μόσχων என்பதன் பொருளும்
  choice: எபிரெயர் நிருபத்தின் கிரேக்க உரையை யாத்திராகம விவரத்தோடு கட்டாயமாக ஒத்திசைக்காமல், ‘கன்றுகள்’ என்று மொழிபெயர்த்து மாற்றை அடிக்குறிப்பில் தருதல்
  alternative: பலிச் சூழலை முன்னிறுத்தி ‘இளம் காளைகள்’ என்று முதன்மை உரையிலேயே மொழிபெயர்த்தல்
  rationale: நிருபத்தின் சுருக்கமான மறுவிவரிப்பை விரிவுபடுத்தாமலும் பழைய ஏற்பாட்டு உரையிலிருந்து கூடுதல் தகவலை இறக்குமதி செய்யாமலும், மூலச்சொல்லின் உண்மையான சொற்பொருள் வரம்பைத் திறந்தவாறு வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் இயல்பும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘நியாயப்பிரமாணம்’, ‘ஈசோப்பு’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் காக்கப்பட்டுள்ளன; தேவையற்ற தொழில்நுட்பச் சொற்கள் தவிர்க்கப்பட்டுள்ளன. இறுதிக் காற்புள்ளி அடுத்த வசனத்துடன் தொடரும் கிரேக்க வாக்கிய அமைப்பைச் சுட்டுகிறது.
