  revised_text: “எல்லாவற்றையும் அவருடைய பாதங்களுக்குக் கீழ்ப்படுத்தினீர்.”[a] ஏனெனில், எல்லாவற்றையும் அவருக்குக் கீழ்ப்படுத்தியதில்[b], அவருக்குக் கீழ்ப்படுத்தப்படாமல் எதையும் அவர் விட்டுவைக்கவில்லை. ஆனால் இப்போதோ, எல்லாம் அவருக்குக் கீழ்ப்படுத்தப்பட்டிருப்பதை நாம் இன்னும் காணவில்லை.
