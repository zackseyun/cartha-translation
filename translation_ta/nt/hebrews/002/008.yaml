source:
  edition: SBLGNT
  text: πάντα ὑπέταξας ὑποκάτω τῶν ποδῶν αὐτοῦ· ἐν ⸂τῷ γὰρ⸃ ⸀ὑποτάξαι τὰ πάντα οὐδὲν ἀφῆκεν αὐτῷ ἀνυπότακτον. νῦν δὲ οὔπω ὁρῶμεν αὐτῷ τὰ πάντα ὑποτεταγμένα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/008.yaml
  text: You subjected all things under his feet.” For in subjecting all things to him[a], he left nothing not subjected to him[b]. But now we do not yet see all things subjected to him.
translation:
  language: ta
  text: “எல்லாவற்றையும் அவருடைய பாதங்களுக்குக் கீழ்ப்படுத்தினீர்.”[a] ஏனெனில், எல்லாவற்றையும் அவருக்குக் கீழ்ப்படுத்தியதில்[b], அவருக்குக் கீழ்ப்படுத்தப்படாமல் எதையும் அவர் விட்டுவைக்கவில்லை. ஆனால் இப்போதோ, எல்லாம் அவருக்குக் கீழ்ப்படுத்தப்பட்டிருப்பதை நாம் இன்னும் காணவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவருடைய’, ‘அவருக்கு’ என்ற பதிற்பெயர்கள் சங்கீதம் 8-இன் மொழியை எதிரொலிக்கின்றன. சங்கீதத்தின் முதற்சூழலில் அவை மனிதகுலத்தைக் குறிக்கலாம்; எபிரெயர் நூலின் பயன்பாட்டில் இயேசுவையும் குறிக்கலாம்.
    reason: cross_reference
  - marker: b
    text: அல்லது, “எல்லாவற்றையும் அவருக்குக் கீழ்ப்படுத்தியபோது.” கிரேக்கச் சொற்றொடரை காலத்தைக் குறிப்பதாகவும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: எல்லாவற்றையும் / எல்லாம்
  rationale: உயிரற்ற பன்மையின் முழுமையான பரப்பைத் தெளிவாகக் காட்டுகிறது; தமிழில் வேற்றுமைத் தேவைக்கேற்ப வடிவம் மாறினாலும் பொருள் ஒன்றே.
- source_word: ὑπέταξας
  choice: கீழ்ப்படுத்தினீர்
  rationale: இரண்டாம் நபர் ஒருமை இறந்தகால வினையை மதிப்புமிக்க ஒருமை வடிவில் தருகிறது; சங்கீதம் 8 மேற்கோளின் ஆட்சி மற்றும் கீழ்ப்படிதல் சார்ந்த சொல்லாட்சியையும் காக்கிறது.
- source_word: ὑποκάτω τῶν ποδῶν αὐτοῦ
  choice: அவருடைய பாதங்களுக்குக் கீழ்
  rationale: ஆட்சி மற்றும் கீழ்ப்படுத்துதலைக் குறிக்கும் வேதாகம உருவகத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: ἐν τῷ ... ὑποτάξαι
  choice: கீழ்ப்படுத்தியதில்
  rationale: இந்த அமைப்பு செயல் நிகழ்ந்த சூழலையோ அதிலிருந்து வரும் விளைவையோ சுட்டலாம்; முதன்மை உரை கிரேக்க அமைப்பின் விரிவை மிகையாகச் சுருக்காமல் காக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய மேற்கோளின் பொருளை ஆசிரியர் விளக்கத் தொடங்குவதைத் தெளிவுபடுத்துகிறது.
- source_word: οὐδὲν ἀφῆκεν
  choice: எதையும் அவர் விட்டுவைக்கவில்லை
  rationale: ஒன்றும் விலக்கப்படவில்லை என்ற முழுமையான கூற்றை இயல்பான தமிழில் தருகிறது.
- source_word: ἀνυπότακτον
  choice: கீழ்ப்படுத்தப்படாதது
  rationale: ὑποτάσσω என்ற ஒரே சொல் குடும்பம் வசனம் முழுவதும் மீண்டும் வருவதைத் தமிழிலும் பாதுகாக்கிறது.
- source_word: νῦν δὲ
  choice: ஆனால் இப்போதோ
  rationale: வேதவாக்கின் முழுமையான அறிவிப்புக்கும் தற்போதைய அனுபவத்துக்கும் இடையிலான முரண்பாட்டை வலியுறுத்துகிறது.
- source_word: οὔπω ὁρῶμεν
  choice: நாம் இன்னும் காணவில்லை
  rationale: நிறைவேற்றம் தற்போது முழுமையாகக் காணப்படாத ‘இன்னும் இல்லை’ என்ற நிலையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὑποτεταγμένα
  choice: கீழ்ப்படுத்தப்பட்டிருப்பதை
  rationale: கீழ்ப்படுத்தப்பட்டதன் விளைவாக நிலவும் நிலையைக் குறிக்கும் perfect passive participle-இன் வலிமையைத் தமிழின் நிறைநிலை வடிவில் காக்கிறது.
theological_decisions:
- issue: αὐτοῦ / αὐτῷ என்ற பதிற்பெயர்களின் குறிப்பு
  choice: ‘அவருடைய / அவருக்கு’ என்று பதிற்பெயர்களாகவே வைக்கப்பட்டது
  alternative: சங்கீதத்தின் முதல் சூழலில் மனிதகுலம் என்று வெளிப்படையாகக் கூறுதல்; அல்லது எபிரெயரின் கிறிஸ்துவை மையப்படுத்திய பயன்பாட்டில் இயேசு என்று வெளிப்படையாகக் கூறுதல்
  rationale: சங்கீதம் 8-இல் மனிதனைக் குறிக்கும் முதல் பொருளுக்கும், எபிரெயர் இயேசுவில் அதை உச்சமாகப் பயன்படுத்துவதற்கும் இடையிலான கருத்து நிறைந்த பதற்றத்தை உரை தானே தாங்குகிறது; மொழிபெயர்ப்பு அதை முன்கூட்டியே தீர்மானிக்கவில்லை.
- issue: முழுமையான கீழ்ப்படுத்துதலும் தற்போதைய காணாமையும்
  choice: ‘எதையும் ... விட்டுவைக்கவில்லை’ என்ற முழுமையான கூற்றையும் ‘இன்னும் காணவில்லை’ என்ற தற்போதைய வரம்பையும் அடுத்தடுத்து பாதுகாத்தல்
  alternative: கீழ்ப்படுத்துதல் எதிர்காலத்தில் மட்டுமே நிகழும் என விளக்கமாக மாற்றுதல்
  rationale: கிரேக்க உரை ஏற்கெனவே அறிவிக்கப்பட்ட கீழ்ப்படுத்துதலுக்கும் அது முழுமையாகக் கண்முன் தெரியாத தற்போதைய நிலைக்கும் இடையிலான இறையியல் பதற்றத்தைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘கீழ்ப்படுத்து’ என்ற ஒரே வேர்ச்சொல் தொடர்ந்து பயன்படுத்தப்பட்டதால் மூலத்தின் சொல் மீளுருவாக்கமும் வாத ஓட்டமும் தெளிவாகின்றன; பதிற்பெயர்களின் குறிப்பை விளக்கி எழுதாமல் மூலத்திலுள்ள உண்மையான இருபொருள் வாய்ப்பு பாதுகாக்கப்பட்டது.
