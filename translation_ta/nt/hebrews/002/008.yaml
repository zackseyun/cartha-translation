  source_fidelity: மொத்தத்தில் கிரேக்க மூலத்துக்கும் ஆங்கில POB தடத்துக்கும் நம்பிக்கையான மொழிபெயர்ப்பு. எல்லாவற்றின் முழுமையான கீழ்ப்படுத்தல், எதுவும் விலக்கப்படாமை, மற்றும் அது இன்னும் காணப்படாத தற்போதைய நிலை ஆகியவை தக்கவைக்கப்பட்டுள்ளன. ஆனால் மேற்கோளின் ὑπέταξας இரண்டாம் நபர் ஒருமை என்பதற்கும் அடுத்த விளக்கப் பகுதியில் உள்ள ἀφῆκεν மூன்றாம் நபர் ஒருமை என்பதற்கும் தமிழில் ஒரே மரியாதை வடிவமான ‘அவர்/அவருக்கு’ பயன்படுத்தப்படுவது தெளிவைச் சிறிது குறைக்கிறது. மூலத்தின் நபர்மாற்றத்தை வெளிப்படுத்த ‘நீர்’ மற்றும் ‘அவர்’ என வேறுபடுத்துவது பாதுகாப்பானது.
