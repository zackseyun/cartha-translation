  terminology: ‘கீழ்ப்படுத்துதல்’ என்ற தொடர்ச்சியான சொல்லாட்சி ὑποτάσσω சொற்குடும்பத்தைச் சரியாகப் பாதுகாக்கிறது. ‘பாதங்களுக்குக் கீழ்’ என்ற உருவகம் பொருத்தமானது. பதிற்பெயர் குறிப்பு பற்றிய அடிக்குறிப்பு உரையின் இருபொருள் வாய்ப்பை தேவையற்ற இறையியல் தீர்மானமின்றி நன்றாக விளக்குகிறது; ஆனால் தமிழில் ‘சங்கீதம் 8-இன்’ மற்றும் ‘எபிரெயர் நூலின்’ எனச் சிறிது இயல்பாக்கலாம்.
