source:
  edition: SBLGNT
  text: διεμαρτύρατο δέ πού τις λέγων· Τί ἐστιν ἄνθρωπος ὅτι μιμνῄσκῃ αὐτοῦ, ἢ υἱὸς ἀνθρώπου ὅτι ἐπισκέπτῃ αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/006.yaml
  text: But someone has testified somewhere[a], saying, “What is man, that you remember him, or the son of man[c][b], that you care for him?”
translation:
  language: ta
  text: 'ஆனால், ஒருவர் ஓரிடத்தில் இவ்வாறு சான்றுரைத்தார்: “மனிதன் எம்மாத்திரம், நீர் அவனை நினைவுகூருவதற்கு? அல்லது மனிதகுமாரன் எம்மாத்திரம்,[a] நீர் அவன்மேல் அக்கறை கொள்வதற்கு?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு “மனிதகுமாரன்” என்பது சங்கீதம் 8:4-இல் மனிதகுலத்தைக் குறிக்கும் கவிதைச் சொல்லாக வருகிறது; எபிரெயர் நிருபத்தின் விரிந்த சூழல் இந்தப் பகுதிக்கு இயேசுவைப் பற்றிய கூடுதல் முக்கியத்துவத்தையும் அளிக்கிறது.
    reason: cross_reference
  - marker: b
    text: அல்லது “அவனைச் சந்திக்க வருவதற்கு” அல்லது “அவனைக் கவனித்துக்கொள்வதற்கு.” கிரேக்க வினை, ஒருவரிடம் கவனத்துடன் வந்து அவர்மேல் அக்கறை காட்டுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεμαρτύρατο
  choice: சான்றுரைத்திருக்கிறார்
  rationale: வலியுறுத்திச் சாட்சி கூறுதல் என்ற பொருளைத் தக்கவைத்து, வேதமே தொடர்ந்து சான்றளிக்கிறது என்ற மேற்கோள் அறிமுகத்தின் தன்மையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: δέ
  choice: ஆனால்
  rationale: முந்தைய வசனத்திலிருந்து வரும் மென்மையான மாறுபாட்டையும் வாதத்தின் திருப்பத்தையும் குறிக்கிறது.
- source_word: πού τις
  choice: ஒருவர் ஓரிடத்தில்
  rationale: ஆசிரியருக்குக் குறிப்பிடம் தெரியாது என்று உணர்த்தாமல், பெயரையும் இடத்தையும் குறிப்பிடாத கிரேக்க மேற்கோள் அறிமுகத்தின் வடிவத்தைப் பாதுகாக்கிறது.
- source_word: Τί ἐστιν ἄνθρωπος
  choice: மனிதன் எம்மாத்திரம்
  rationale: ἄνθρωπος இங்கு மனிதகுலத்தைப் பிரதிநிதித்துவப்படுத்தும் ஒருமைச் சொல். கவிதைநயத்தையும் சங்கீத மேற்கோளின் வினாவையும் இயல்பான, dignified தமிழில் காக்கிறது.
- source_word: μιμνῄσκῃ αὐτοῦ
  choice: நீர் அவனை நினைவுகூருவதற்கு
  rationale: ஒருவரை நினைவில் வைத்திருத்தல் அல்லது நினைத்துக்கொள்ளுதல் என்ற அடிப்படைப் பொருளைத் தெளிவாகக் கொடுக்கிறது.
- source_word: υἱὸς ἀνθρώπου
  choice: மனிதகுமாரன்
  rationale: சங்கீதம் 8-இன் கவிதை இணைப்பையும் எபிரெயர் நிருபத்தில் பின்னர் உருவாகும் கிறிஸ்துவியல் ஒலியையும் காக்கிறது; அதேவேளையில் இதை இவ்வசனத்திலேயே வெளிப்படையான பட்டமாகத் தீர்மானிக்கவில்லை.
- source_word: ἐπισκέπτῃ αὐτόν
  choice: நீர் அவன்மேல் அக்கறைகொள்வதற்கு
  rationale: கவனத்துடன் நாடிவந்து பராமரித்தல் என்ற வினையின் சூழ்நிலைப் பொருளை நவீன வாசகருக்குத் தெளிவாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: “மனிதகுமாரன்” என்பது இங்கே வெளிப்படையான மேசியப் பட்டமாக மொழிபெயர்க்கப்பட வேண்டுமா?
  choice: சங்கீத மேற்கோளின் “மனிதகுமாரன்” என்ற வடிவத்தைத் தக்கவைத்து, பிரதான உரையில் அதை வெளிப்படையான பட்டமாகக் குறிக்காமல் விடுதல்
  alternative: “ஒரு மனிதன்” அல்லது “மனிதப் பிறவி” என்று முற்றிலும் பொதுப்படையாக மொழிபெயர்த்தல்; அல்லது இயேசுவைக் குறிக்கும் பட்டம் என்பதை வெளிப்படையாகக் காட்டுதல்
  rationale: சங்கீதம் 8-இல் இது மனிதகுலத்தைக் குறிக்கும் கவிதை இணைச்சொல். எபிரெயர் நிருபத்தின் அடுத்தடுத்த சூழல் இதை இயேசுவோடு தொடர்புபடுத்துகிறது. இரு நிலைகளுக்கும் இடையிலான உண்மையான இறையியல் பதற்றத்தை முன்கூட்டியே தீர்க்காமல் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன தரமான தமிழில், சங்கீத மேற்கோளுக்கேற்ற கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. “நீர்” என்பது தேவனை நோக்கிய மரியாதை ஒருமையைத் தெளிவாக வெளிப்படுத்துகிறது. “மனிதன் எம்மாத்திரம்” என்ற அமைப்பு பொதுவான மனிதகுலத்தைக் குறிக்கும் பிரதிநிதி ஒருமையையும் மேற்கோளின் வியப்புணர்வையும் காக்கிறது.
