  terminology: «மனிதகுமாரன்» சங்கீதத்தின் கவிதை இணைச்சொல்லையும் எபிரெயரின் பின்னணியில் எழும் ஒலியையும் பாதுகாக்கிறது; அதைத் தலைப்பாகத் தீர்மானிக்கவில்லை. குறிப்பு அந்தப் பொதுவான முதற்சூழல் பொருளைச் சரியாக விளக்குகிறது. «அக்கறை கொள்வது» ἐπισκέπτῃ என்பதன் சூழல்சார் பராமரிப்பு அர்த்தத்துக்கு ஏற்றது; மாற்றுவழிகளும் குறிப்பில் உள்ளன.
