id: HEB.2.2
reference: Hebrews 2:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ γὰρ ὁ δι’ ἀγγέλων λαληθεὶς λόγος ἐγένετο βέβαιος, καὶ πᾶσα παράβασις καὶ παρακοὴ ἔλαβεν ἔνδικον μισθαποδοσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/002.yaml
  text: For if the message spoken through angels proved firm[a], and every transgression and disobedience received a just penalty[b],
translation:
  language: ta
  text: ஏனெனில், தேவதூதர்கள் வழியாகப் பேசப்பட்ட செய்தி உறுதியாக நிலைபெற்றது[a]; ஒவ்வொரு மீறுதலும் கீழ்ப்படியாமையும் நீதியான தண்டனையைப் பெற்றன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இது தேவதூதர்கள் வழியாக வழங்கப்பட்டதாக யூத மரபில் புரிந்துகொள்ளப்பட்ட திருச்சட்டத்தைக் குறிக்கலாம்; அப்போஸ்தலர் 7:53; கலாத்தியர் 3:19 ஆகியவற்றை ஒப்பிடுக.
    reason: cross_reference
  - marker: b
    text: அல்லது, ‘நீதியான கைம்மாறு’ அல்லது ‘தகுந்த பிரதிபலன்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δι’ ἀγγέλων λαληθεὶς λόγος
  choice: தேவதூதர்கள் வழியாகப் பேசப்பட்ட செய்தி
  rationale: λόγος என்பதை இங்கு தனித்த ஒரு ‘சொல்’ என்பதற்குப் பதிலாக அறிவிக்கப்பட்ட இறைச்செய்தி என இயல்பாகக் காட்டுகிறது. διά + genitive-இன் இடைமுகம்/வழிமுறைப் பொருளை ‘வழியாக’ காக்கிறது; λαληθείς என்பதற்கு ‘பேசப்பட்ட’ என்பது நேரான இணை.
- source_word: ἀγγέλων
  choice: தேவதூதர்கள்
  rationale: எபிரெயர் 2-ன் சூழலிலும் சீனாய் சட்டம் தேவதூதர்கள் வழியாக வழங்கப்பட்டதாகிய யூத மரபிலும் இச்சொல் பரலோகத் தேவதூதர்களையே சுட்டுகிறது; மனிதத் தூதர்கள் எனப் புரிந்துகொள்ளப்படுவதைத் தவிர்க்கிறது.
- source_word: ἐγένετο βέβαιος
  choice: உறுதியானதாக விளங்கியது
  rationale: அந்தச் செய்தி செல்லத்தக்கதாகவும் நடைமுறை வலிமையுடையதாகவும் நிலைத்தது என்னும் விளைவை வெளிப்படுத்துகிறது. ‘விளங்கியது’ என்பது வெறும் தகவல் உறுதிப்படுத்தலைவிட, அதன் உறுதித்தன்மை நடைமுறையில் தெரியவந்ததைக் காட்டுகிறது.
- source_word: πᾶσα παράβασις
  choice: ஒவ்வொரு மீறுதலும்
  rationale: παράβασις கட்டளையால் வரையறுக்கப்பட்ட எல்லையைத் தாண்டுதல் அல்லது அதை மீறுதல் என்பதைக் குறிக்கிறது. ‘மீறுதல்’ நவீன தமிழில் தெளிவாகவும் சட்ட-ஒழுக்கச் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: παρακοὴ
  choice: கீழ்ப்படியாமை
  rationale: கேளாமை அல்லது செவிகொடாமையிலிருந்து உருவாகும் கீழ்ப்படியாமையை இச்சொல் குறிக்கிறது. παράβασις உடன் இணைந்துள்ள ஒழுக்க-சட்டப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἔλαβεν
  choice: பெற்றன
  rationale: மீறுதலும் கீழ்ப்படியாமையும் தத்தமக்குரிய நீதித் தீர்ப்பைப் பெற்றன என்ற கிரேக்க வாக்கிய அமைப்பை இயல்பான தமிழில் காக்கிறது.
- source_word: ἔνδικον μισθαποδοσίαν
  choice: நீதியான தண்டனை
  rationale: μισθαποδοσία கைம்மாறு அல்லது உரிய பதிலளிப்பு என்பதையும் ἔνδικος அதன் நீதியான, தகுந்த தன்மையையும் காட்டுகிறது. எதிர்மறைச் சூழலில் ‘நீதியான தண்டனை’ இயல்பாக நீதித்துறை வலிமையைத் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘தேவதூதர்கள் வழியாகப் பேசப்பட்ட செய்தி’ எதைக் குறிக்கிறது?
  choice: சீனாய் சட்டம் தேவதூதர்கள் வழியாக வழங்கப்பட்டதாகிய மரபை மறைமுகமாகச் சுட்டுவதாகக் கொள்ளப்படுகிறது; ஆனால் முதன்மை உரையில் அது ‘செய்தி’ என்றே வைக்கப்படுகிறது.
  alternative: தேவதூதர்கள் அறிவித்த பொதுவான ஓர் இறைச்செய்தி.
  rationale: பரந்த சூழல் சீனாய் சட்டத்தைக் குறிப்பதாக வலுவாக உணர்த்தினாலும், கிரேக்க உரை νόμος என்று சொல்லாமல் λόγος என்றே கூறுகிறது. ஆகவே ‘சட்டம்’ என்பதை முதன்மை உரைக்குள் சேர்க்காமல் உண்மையான மறைமுகத்தன்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குத் தெளிவாகவும் திருவிவிலிய உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘செய்தி’ என்பது λόγος-இன் தொடர்பாடல் பொருளைக் காட்டுகிறது; ‘உறுதியானதாக விளங்கியது’ βέβαιος என்பதன் செல்லுபடியாகும், நிலைபெற்ற தன்மையை மிகையாக விளக்காமல் காக்கிறது. கிரேக்கத்தில் ஒருமை வினை இருந்தாலும், தமிழில் இணை எழுவாய்களுக்கு இயல்பாகப் பன்மை ‘பெற்றன’ பயன்படுத்தப்பட்டுள்ளது.
