  to: எல்லாமும் எவருக்காக இருக்கின்றனவோ, எவர் மூலமாக எல்லாமும் இருக்கின்றனவோ, அவருக்குப் பல மகன்களை மகிமைக்குக் கொண்டுவருவதில், அவர்களுடைய மீட்பின் முன்னோடியைத் துன்பங்கள் வழியாக நிறைவுக்குக் கொண்டுவருவது தகுந்ததாக இருந்தது.[a][b][c]
  rationale: The revision corrects the added creation sense in “உண்டாயினவோ” by rendering both τὰ πάντα clauses as existence statements. It also improves the Tamil rendering of τελειῶσαι while retaining the Greek ambiguity concerning the participle’s precise circumstantial force; it does not turn the clause into an explicit purpose statement.
