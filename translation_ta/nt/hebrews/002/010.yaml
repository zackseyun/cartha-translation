base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/010.yaml
  text: For it was fitting for him—for whom are all things and through whom are all things—in bringing many sons to glory[d][c][b][a], to perfect the pioneer of their salvation through sufferings.
translation:
  language: ta
  text: எல்லாமும் எவருக்காக இருக்கின்றனவோ, எவர் மூலமாக எல்லாமும் இருக்கின்றனவோ, அவருக்குப் பல மகன்களை மகிமைக்குக் கொண்டுவருவதில், அவர்களுடைய மீட்பின் முன்னோடியைத் துன்பங்கள் வழியாக நிறைவுக்குக் கொண்டுவருவது தகுந்ததாக இருந்தது.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பல மகன்கள்” என்பது கிரேக்கச் சொல்லின் வடிவத்தையும் மகன்நிலை மற்றும் வாரிசுரிமை வலியுறுத்தலையும் காக்கிறது; இந்தச் சொற்றொடர் ஆண்களை மட்டும் அல்ல, கடவுளுடைய பிள்ளைகள் அனைவரையும் உள்ளடக்குகிறது.
    reason: lexical_alternative
  - marker: b
    text: “முன்னோடி” என்பதற்குப் பதிலாக “தொடக்கிவைப்பவர்,” “தலைவர்,” அல்லது “மீட்பை ஏற்படுத்தியவர்” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: c
    text: “நிறைவுக்குக் கொண்டுவருவது” என்பது ஒழுக்கக் குறையைத் திருத்துவதைக் குறிக்காது; துன்பங்களின் வழியாகக் குறிக்கப்பட்ட இலக்கு அல்லது பணிநிறைவை அடையச் செய்வதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔπρεπεν
  choice: தகுந்ததாக இருந்தது
  rationale: இறைவனுடைய நோக்கத்தில் இது பொருத்தமும் தகுதியும் உடையதாக இருந்தது என்ற முற்றாதகாலப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: αὐτῷ
  choice: அவருக்கு
  rationale: சூழலில் சுட்டுப்பெயர் கடவுளைக் குறிக்கிறது; கிரேக்கத்தின் சுட்டுப்பெயர் வடிவத்தைத் தொடர்ந்து வரும் தொடர்புக் கூறுகள் தெளிவுபடுத்துகின்றன.
- source_word: δι’ ὃν τὰ πάντα καὶ δι’ οὗ τὰ πάντα
  choice: எல்லாம் எவருக்காக இருக்கின்றனவோ, எவர் மூலமாக எல்லாம் உண்டாயினவோ
  rationale: முதல் διά இறுதி நோக்கத்தையும் இரண்டாவது διά செயற்பாட்டு வழியையும் வேறுபடுத்துகிறது. தமிழில் தொடர்புக் கூறாக அமைத்ததால் செறிவும் தெளிவும் கிடைக்கின்றன.
- source_word: πολλοὺς υἱοὺς
  choice: பல மகன்களை
  rationale: υἱούς என்பதன் ஆண்பால் வடிவத்தையும் மகனுக்குரிய நிலை மற்றும் வாரிசுரிமை ஒலிப்பையும் காக்கிறது; உள்ளடங்கும் பரந்த பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: εἰς δόξαν
  choice: மகிமைக்கு
  rationale: மகிமை என்னும் இலக்கு அல்லது நிலையை நோக்கிய நகர்வைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: ἀγαγόντα
  choice: கொண்டுவரும்போது
  rationale: இறந்தகால வினையெச்சத்தை τελειῶσαι என்பதோடு சூழ்நிலைத் தொடர்பில் இணைக்கிறது; அதைத் தெளிவான நோக்கவாக்கியமாக மாற்றாமல் கிரேக்கத்தின் தொடர்பு நெகிழ்வை காக்கிறது.
- source_word: ἀρχηγὸν
  choice: முன்னோடி
  rationale: ஒரு வழியைத் தொடங்கி அதில் முன்னே நடத்துபவர் என்ற இரு அம்சங்களையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τῆς σωτηρίας αὐτῶν
  choice: அவர்களுடைய மீட்பின்
  rationale: இயல்பான தமிழில் உடைமை/தொடர்பு மரபை நேரடியாகக் காக்கிறது.
- source_word: διὰ παθημάτων
  choice: துன்பங்களின் வழியாக
  rationale: παθημάτων என்பதன் பன்மையைப் பேணி, பல்வேறு துன்ப அனுபவங்களின் வழியாக என்பதைக் காட்டுகிறது.
- source_word: τελειῶσαι
  choice: நிறைவுபெறச் செய்வது
  rationale: ஒழுக்கக் குறையைத் திருத்துதல் என்று பொருள்படாமல், குறிக்கப்பட்ட இலக்கு அல்லது பணிநிறைவை அடையச் செய்தல் என்ற எபிரெயர் நூலுக்குரிய பொருளைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: குமாரனைப் பற்றி τελειῶσαι என்பதன் பொருள்
  choice: நிறைவுபெறச் செய்வது
  alternative: பூரணப்படுத்துவது
  rationale: இங்கு ஒழுக்கக் குறை நீக்கப்பட்டது என்பதல்ல; துன்பங்களின் வழியாக அவருடைய மீட்புப் பணி அதன் குறிக்கப்பட்ட நிறைவை அடைந்தது என்பதே பொருள். தமிழ் வாசகருக்கு தவறான ஒழுக்கப் பொருள் வராமல், மூலத்தின் நிறைவு/இலக்கு உணர்வு காக்கப்படுகிறது.
- issue: πολλοὺς υἱοὺς என்பதன் பாலினம் மற்றும் உள்ளடக்கம்
  choice: பல மகன்களை
  alternative: பல பிள்ளைகளை
  rationale: கிரேக்கத்தின் வெளிப்படையான ஆண்பால் சொல்லையும் மகன்நிலை மற்றும் வாரிசுரிமை ஒலிப்பையும் முதன்மை உரை காக்கிறது; இது ஆண்களை மட்டும் குறிக்கவில்லை என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: ἀγαγόντα மற்றும் τελειῶσαι ஆகியவற்றின் தொடர்பு
  choice: மகிமைக்குக் கொண்டுவரும்போது ... நிறைவுபெறச் செய்வது
  alternative: மகிமைக்குக் கொண்டுவருவதற்காக ... நிறைவுபெறச் செய்வது
  rationale: வினையெச்சத்தை உறுதியான நோக்கப் பொருளாக மாற்றாமல், பல மகன்களை மகிமைக்குக் கொண்டுவரும் செயலில் மீட்பின் முன்னோடியைத் துன்பங்கள் வழியாக நிறைவுபெறச் செய்தார் என்ற கிரேக்கத் தொடரமைப்பையும் அதன் உண்மையான நெகிழ்வையும் காக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், மரியாதையும் பொதுவாசகருக்கான தெளிவும் காக்கப்பட்டுள்ளன. கிரேக்கத் தொடரின் நீளத்தைத் தாங்கும் வகையில் தொடர்புக் கூறுகள் பயன்படுத்தப்பட்டன. “மீட்பு,” “மகிமை,” “முன்னோடி,” “நிறைவு” ஆகியவை வேதாகமச் செறிவைத் தக்கவைத்தும் இன்றைய தமிழில் புரியத்தக்கவாறும் தேர்ந்தெடுக்கப்பட்டன.
