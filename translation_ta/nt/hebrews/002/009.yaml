  text: τὸν δὲ βραχύ τι παρ’ ἀγγέλους ἠλαττωμένον βλέπομεν Ἰησοῦν διὰ τὸ πάθημα τοῦ θανάτου δόξῃ καὶ τιμῇ ἐστεφανωμένον, ὅπως ⸀χωρὶς θεοῦ ὑπὲρ παντὸς γεύσηται θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/009.yaml
  text: But we see Jesus[a], who was made lower than the angels for a little while, crowned with glory and honor because of the suffering of death, so that by the grace of God he might taste death for everyone.
translation:
  language: ta
  text: ஆனால், அவர் கடவுள் இல்லாமல் ஒவ்வொருவருக்காகவும் மரணத்தைச் சுவைக்கும்படியாக, தேவதூதர்களைவிடச் சிறிது காலம் தாழ்த்தப்பட்ட இயேசு மரணத் துன்பத்தினால் மகிமையாலும் கனத்தினாலும் முடிசூட்டப்பட்டிருப்பதை நாம் காண்கிறோம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βραχύ τι
  choice: சிறிது காலம்
  rationale: சங்கீதம் 8-ஐ எதிரொலிக்கும் இச்சூழலில், இது அளவைக் காட்டுவதைக் காட்டிலும் காலத்தைக் குறிப்பதாகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: παρ’ ἀγγέλους
  choice: தேவதூதர்களைவிட
  rationale: ἐλαττόω என்பதுடன் வரும் παρά + வேற்றுமை உருபு ஒப்பீட்டுப் பொருளைத் தருகிறது.
- source_word: ἠλαττωμένον
  choice: தாழ்த்தப்பட்ட
  rationale: செயப்பாட்டு வினையெச்சத்தின் ஒப்பீட்டுப் பொருளைப் பாதுகாத்து, இயல்பான தமிழில் தருகிறது.
- source_word: διὰ τὸ πάθημα τοῦ θανάτου
  choice: மரணத்தின் துன்பத்தினால்
  rationale: διά + accusative இங்கு காரணத்தைக் குறிப்பதாக இயல்பாகப் புரிகிறது; மரணத் துன்பமே முடிசூட்டப்படுவதற்கான காரணம் என்ற தொடர்பைப் பாதுகாக்கிறது.
- source_word: δόξῃ καὶ τιμῇ ἐστεφανωμένον
  choice: மகிமையாலும் கனத்தாலும் முடிசூட்டப்பட்டிருப்பதை
  rationale: στεφανόω என்பதன் முடிசூட்டுதல் உருவகத்தையும், நிறைவேறிய நிலையைச் சுட்டும் perfect participle-இன் வலிமையையும் பாதுகாக்கிறது.
- source_word: ὅπως
  choice: இவ்வாறு ... வேண்டியிருந்தது
  rationale: நோக்கம் அல்லது விளைவைக் குறிக்கும் தொடர்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; இரண்டிற்கிடையேயான நுண்ணிய திறந்தநிலையையும் முற்றிலும் நீக்கவில்லை.
- source_word: χωρὶς θεοῦ
  choice: கடவுள் இல்லாமல்
  rationale: வழங்கப்பட்ட SBLGNT மூலவாசகமான χωρὶς θεοῦ-ஐ நேரடியாகப் பின்பற்றுகிறது; அதன் கடினமான இறையியல் பதற்றத்தை விளக்கிப் போக்காமல் பாதுகாக்கிறது.
- source_word: ὑπὲρ παντός
  choice: ஒவ்வொருவருக்காகவும்
  rationale: ὑπέρ என்பதன் சார்பாக/நன்மைக்காக என்ற பொருளையும் παντός என்பதன் பகிர்ந்தளிக்கும் தனிப்பட்ட பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: γεύσηται θανάτου
  choice: மரணத்தைச் சுவைக்க
  rationale: மரணத்தை அனுபவித்தல் என்ற பொருளுடைய மூல உருவகத்தைப் பாதுகாக்கும் புரிந்துகொள்ளத்தக்க தமிழ் சொற்றொடர்.
theological_decisions:
- issue: நோக்கக் கூற்றிலுள்ள பாட வேறுபாடு
  choice: கடவுள் இல்லாமல்
  alternative: கடவுளின் அருளினால்
  rationale: வழங்கப்பட்ட SBLGNT உரை χωρὶς θεοῦ (‘கடவுள் இல்லாமல்’) என்று வாசிப்பதால் அதையே முதன்மை உரையில் வைத்துள்ளோம். பல முக்கிய கையெழுத்துப் பிரதிகளிலும் நவீன பதிப்புகளிலும் காணப்படும் χάριτι θεοῦ (‘கடவுளின் அருளினால்’) என்ற வாசகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: χωρὶς θεοῦ என்பதன் பொருள் தொடர்பு
  choice: கடவுள் இல்லாமல் ஒவ்வொருவருக்காகவும்
  alternative: கடவுளைத் தவிர மற்ற ஒவ்வொருவருக்காகவும்
  rationale: இந்தச் சொற்றொடர் இயேசு மரணத்தைச் சுவைத்த விதத்தைக் குறிக்கிறதா அல்லது ‘ஒவ்வொருவரும்’ என்பதிலிருந்து கடவுளை விலக்குகிறதா என்பது இலக்கண ரீதியாக விவாதிக்கப்படலாம். முதன்மை மொழிபெயர்ப்பு மூலத்தின் சொல் வரிசையையும் தெளிவின்மையையும் இயன்றவரை பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மரணத்தைச் சுவைக்க’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது. வழங்கப்பட்ட கிரேக்க மூலவாசகம் ஆங்கில ஆலோசனை உரையிலிருந்து மாறுவதால், முதன்மை உரை கிரேக்க வாசகத்தையே பின்பற்றுகிறது.
