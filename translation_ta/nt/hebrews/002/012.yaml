base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/012.yaml
  text: saying[a], “I will proclaim your name to my brothers[b]; in the midst of the assembly I will sing praise to you.”
translation:
  language: ta
  text: 'என்று கூறுகிறார்:


    “உமது பெயரை என் சகோதரர்களுக்கு[a] அறிவிப்பேன்;

    சபையின்[b] நடுவில் உம்மைப் புகழ்ந்து பாடுவேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் சகோதர சகோதரிகளுக்கு.” கிரேக்க மொழியில் “சகோதரர்கள்” என்று உள்ளது; ஆனால் சூழலில் இக்குடும்பச் சொல் சக விசுவாசிகள் அனைவரையும் உள்ளடக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கூட்டத்தின்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: என்று கூறுகிறார்
  rationale: மேற்கோளை அறிமுகப்படுத்தும் நிகழ்கால வினையெச்சத்தின் செயல்பாட்டைத் தெளிவான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: Ἀπαγγελῶ
  choice: அறிவிப்பேன்
  rationale: பகிரங்கமாகத் தெரிவிக்கும் அல்லது பிரகடனப்படுத்தும் எதிர்காலச் செயலை இயல்பான தமிழில் தருகிறது.
- source_word: τὸ ὄνομά σου
  choice: உமது பெயரை
  rationale: ‘பெயர்’ என்பதன் வேதாகமச் செறிவை விளக்கமாக விரிவாக்காமல் மூலத்தின் சொல்லாட்சியையே தக்கவைக்கிறது.
- source_word: τοῖς ἀδελφοῖς μου
  choice: என் சகோதரர்களுக்கு
  rationale: மூலத்திலுள்ள ஆண்பால் பன்மை குடும்பச் சொல்லை நேரடியாகத் தக்கவைக்கிறது; சூழலில் அது சக விசுவாசிகள் அனைவரையும் உள்ளடக்கக்கூடும் என்பது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: ἐν μέσῳ
  choice: நடுவில்
  rationale: மூலத்தின் இடவியல் உருவகத்தையும் மேற்கோளின் உயர்ந்த கவித்துவ நடையையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἐκκλησίας
  choice: சபையின்
  rationale: இங்கு கூடிவந்த மக்களைக் குறிக்கும் சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது; தமிழில் வழக்கமான வேதாகமப் பயன்பாட்டைத் தக்கவைத்து, ‘கூட்டம்’ என்ற மாற்றையும் அடிக்குறிப்பில் தருகிறது.
- source_word: ὑμνήσω σε
  choice: உம்மைப் புகழ்ந்து பாடுவேன்
  rationale: ὑμνέω என்பதில் உள்ள இசையோடு செலுத்தப்படும் புகழின் நுணுக்கத்தை முழுமையாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἀδελφοῖς என்ற குடும்பச் சொல்லின் பிரதிநிதித்துவப் பொருள்
  choice: சகோதரர்கள்
  alternative: சகோதர சகோதரிகள்
  rationale: மூலத்தின் ஆண்பால் வடிவம் முதன்மை உரையில் பாதுகாக்கப்படுகிறது; இச்சொல் விசுவாசக் குடும்பத்தின் ஆண்களையும் பெண்களையும் உள்ளடக்கக்கூடும் என்ற உண்மையான சூழற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: பழைய ஏற்பாட்டு மேற்கோளில் ἐκκλησία என்பதன் பொருள்
  choice: சபை
  alternative: கூட்டம்
  rationale: கூடியிருக்கும் தேவமக்களைச் சுட்டும் பொருளைத் தக்கவைக்கிறது. தமிழ் வேதாகம நடையில் ‘சபை’ இயல்பானது; நிறுவன ரீதியான பொருளை மட்டும் கட்டாயப்படுத்தாமல் மாற்றுச் சொல்லும் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மேற்கோளுக்கேற்ற கண்ணியமான கவித்துவ நடை பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கிய உரையில் மரியாதைப் பன்மையான ‘உமது/உம்மை’ கையாளப்பட்டுள்ளது. மூலத்தின் இரு இணை வரிகளும் புள்ளிக்காற்புள்ளியால் இணைக்கப்பட்டுள்ளன.
