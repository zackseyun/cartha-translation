source:
  edition: SBLGNT
  text: ἐν ᾧ γὰρ πέπονθεν αὐτὸς πειρασθείς, δύναται τοῖς πειραζομένοις βοηθῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/018.yaml
  text: For because he himself suffered when he was tempted[a], he is able to help those who are being tempted.
translation:
  language: ta
  text: ஏனெனில், அவர் தாமே சோதனைக்குள்ளானபோது துன்பம் அனுபவித்ததால், சோதனைக்குள்ளாகிறவர்களுக்கு உதவ அவரால் முடியும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இரு இடங்களிலும் ‘சோதிக்கப்பட்ட’: ‘அவர் தாமே சோதிக்கப்பட்டபோது துன்பம் அனுபவித்ததால், சோதிக்கப்படுகிறவர்களுக்கு உதவ அவரால் முடியும்.’ கிரேக்க வினைச்சொல் சூழலைப் பொறுத்து ‘தீமை செய்யத் தூண்டுதல்’ அல்லது ‘சோதித்தல்’ என்று பொருள்படலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: …போது …பட்டிருப்பதால்
  rationale: இந்த இடத்தில் இச்சொற்றொடர் காரணத்தைக் குறிக்கிறது; அதேவேளையில் அவர் சோதனைக்குள்ளான சூழலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத்தையும் காரணத் தொடர்பையும் தெளிவாகக் காட்டுகிறது.
- source_word: πέπονθεν
  choice: துன்பப்பட்டிருக்கிறார்
  rationale: முடிவுற்ற அனுபவத்தையும் அதன் தொடரும் பொருத்தத்தையும் கிரேக்க நிறைவுக்கால வினை உணர்த்துகிறது; தமிழில் ‘துன்பப்பட்டிருக்கிறார்’ அந்த நுணுக்கத்தை இயல்பாகத் தக்கவைக்கிறது.
- source_word: αὐτὸς
  choice: அவர் தாமே
  rationale: குமாரன் தனிப்பட்ட முறையில் இந்த அனுபவத்தை எதிர்கொண்டார் என்ற வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: πειρασθείς
  choice: சோதனைக்குள்ளானபோது
  rationale: πειράζω என்பது சூழலைப் பொறுத்து தீமைக்கான தூண்டுதலையோ பரிசோதனையையோ குறிக்கலாம். ‘சோதனைக்குள்ளான’ என்பது தமிழில் இந்த இரு சாத்தியங்களையும் ஓரளவு திறந்தவையாக வைத்திருக்கிறது.
- source_word: δύναται
  choice: அவரால் முடியும்
  rationale: உதவுவதற்கான அவரது ஆற்றலைத் தெளிவான, இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τοῖς πειραζομένοις
  choice: சோதனைக்குள்ளாகிறவர்களுக்கு
  rationale: நிகழ்காலப் பங்கேற்புச் சொல்லின் தொடரும் செயற்பாட்டை ‘குள்ளாகிற’ என்பதன் மூலம் வெளிப்படுத்துகிறது; சோதித்தல்/தூண்டுதல் என்ற பொருள் நெகிழ்வையும் காக்கிறது.
- source_word: βοηθῆσαι
  choice: உதவ
  rationale: உதவுதல் அல்லது துணைக்கு வருதல் என்ற பொருளை எளிய, கண்ணியமான தமிழில் நேரடியாகத் தருகிறது.
theological_decisions:
- issue: இயேசுவுக்கும் விசுவாசிகளுக்கும் பயன்படுத்தப்படும் πειράζω என்பதன் பொருள்
  choice: சோதனைக்குள்ளாதல்
  alternative: தீமை செய்யத் தூண்டப்படுதல் / பரிசோதிக்கப்படுதல்
  rationale: மக்களின் சோதனை அனுபவத்தில் குமாரன் உண்மையாகப் பங்குகொண்டார் என்பதையும் அதனால் அவர்களுக்கு உதவ வல்லவர் என்பதையும் மொழிபெயர்ப்பு காக்கிறது. அவர் பாவத்திற்கு இணங்கினார் என்ற பொருளைச் சேர்க்காமலும், கிரேக்கச் சொல்லின் ‘தூண்டுதல்’ மற்றும் ‘பரிசோதித்தல்’ ஆகிய இரு சாத்தியங்களையும் அடிக்குறிப்பில் வெளிப்படையாக வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடையைக் கொண்டுள்ளது. ‘அவர் தாமே’ என்பது மூலத்தின் வலியுறுத்தலைக் காக்கிறது; ‘சோதனைக்குள்ளாகிற’ என்பது நடைபெற்று வரும் அனுபவத்தைக் காட்டுகிறது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
