source:
  edition: SBLGNT
  text: πῶς ἡμεῖς ἐκφευξόμεθα τηλικαύτης ἀμελήσαντες σωτηρίας, ἥτις, ἀρχὴν λαβοῦσα λαλεῖσθαι διὰ τοῦ κυρίου, ὑπὸ τῶν ἀκουσάντων εἰς ἡμᾶς ἐβεβαιώθη,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/003.yaml
  text: How will we escape if we neglect so great a salvation? This salvation[a], having at first been spoken through the Lord, was confirmed to us by those who heard him,
translation:
  language: ta
  text: இவ்வளவு மகத்தான மீட்பை நாம் அலட்சியம் செய்தால், எப்படித் தப்பிப்போம்? இந்த மீட்பு[a] முதலில் ஆண்டவர் மூலமாக அறிவிக்கப்படத் தொடங்கி, அவர் கூறியதைக் கேட்டவர்களால் நமக்கு உறுதிப்படுத்தப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அது முதலில் ஆண்டவர் மூலமாக அறிவிக்கப்படத் தொடங்கி, அவர் கூறியதைக் கேட்டவர்களால் நமக்கு உறுதிப்படுத்தப்பட்டது.”
    reason: ἥτις என்பதை ‘இந்த மீட்பு’ எனப் பெயரை மீண்டும் கூறாமல், தொடர்புச் சொல்லாக நேரடியாக வழங்கக்கூடிய மாற்று.
lexical_decisions:
- source_word: πῶς ἡμεῖς ἐκφευξόμεθα
  choice: நாம் எப்படித் தப்பிப்போம்?
  rationale: எதிர்கால வினா வடிவத்தையும், தப்புவதற்கான வழியில்லை என்பதை உணர்த்தும் எச்சரிக்கை வலிமையையும் காக்கிறது; அதை நேரடியான தீர்ப்புக் கூற்றாக மாற்றவில்லை.
- source_word: τηλικαύτης ... σωτηρίας
  choice: இவ்வளவு மகத்தான மீட்பை
  rationale: τηλικαύτης என்பதன் அளவு மற்றும் வலியுறுத்தலை ‘இவ்வளவு மகத்தான’ என்பதும், σωτηρία என்பதன் விடுவிப்பு மற்றும் இறுதிக்கால மீட்பு சார்ந்த பரப்பை ‘மீட்பு’ என்பதும் இயல்பான நவீன தமிழில் தருகின்றன.
- source_word: ἀμελήσαντες
  choice: நாம் அலட்சியம் செய்தால்
  rationale: இறந்தகால வினையெச்சத்தைத் தமிழில் இயல்பான நிபந்தனைத் தொடராக வழங்குகிறது; எச்சரிக்கைச் சூழலில் முதன்மை வினையோடு அதன் தொடர்பைத் தெளிவாக்குகிறது.
- source_word: ἥτις
  choice: இந்த மீட்பு
  rationale: முந்தைய ‘மீட்பு’ என்பதையே சுட்டுகிறது. பெயரை மீண்டும் கூறுவது தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது; கிரேக்கத்தின் தொடர்புச் சொல் அமைப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀρχὴν λαβοῦσα λαλεῖσθαι
  choice: முதலில் ... எடுத்துரைக்கப்படத் தொடங்கி
  rationale: ‘ஒரு தொடக்கத்தைப் பெற்று பேசப்படுதல்’ என்ற கிரேக்க மரபுத்தொடரின் தொடக்கநிலைப் பொருளையும் passive வடிவத்தையும் காக்கும் இயல்பான தமிழ்.
- source_word: διὰ τοῦ κυρίου
  choice: ஆண்டவர் மூலமாக
  rationale: διά + genitive குறிக்கும் வழிமுறை அல்லது செயற்பாட்டாளரின் இடைமுகப் பொருளை காக்கிறது; κύριος என்பதற்கு நிலையான மரியாதைத் தலைப்பான ‘ஆண்டவர்’ பயன்படுத்தப்படுகிறது.
- source_word: ὑπὸ τῶν ἀκουσάντων
  choice: அவர் பேசியதைக் கேட்டவர்களால்
  rationale: செயப்படுபொருளைச் சூழலிலிருந்து தெளிவாக்கி, ஆண்டவர் பேசியதை நேரடியாகக் கேட்டவர்களைக் குறிக்கிறது; ‘அவரைக் கேட்டவர்கள்’ என்பதில் தோன்றக்கூடிய ‘அவருக்குக் கீழ்ப்படிந்தவர்கள்’ என்ற தமிழ் இருபொருளைத் தவிர்க்கிறது.
- source_word: εἰς ἡμᾶς ἐβεβαιώθη
  choice: நமக்கு உறுதிப்படுத்தப்பட்டது
  rationale: செய்தி பெறுநர்களை நோக்கிய திசையையும், அதன் நம்பகத்தன்மை உறுதிசெய்யப்பட்டதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: τοῦ κυρίου என்பதன் குறிப்பு
  choice: மீட்புச் செய்தியை முதலில் எடுத்துரைத்த இயேசுவைக் குறிக்கும் ‘ஆண்டவர்’
  alternative: பொதுவாகக் கடவுளைக் குறிக்கும் ‘ஆண்டவர்’
  rationale: அவரிடமிருந்து கேட்டவர்கள் பின்னர் அதை உறுதிப்படுத்தினார்கள் என்ற உடனடிச் சூழல், இயேசுவின் அறிவிப்பையும் அதை நேரில் கேட்டவர்களின் சாட்சியையும் வலுவாகச் சுட்டுகிறது; வசனம் கூறுவதைத் தாண்டிய கோட்பாட்டுக் கூற்றுகள் சேர்க்கப்படவில்லை.
- issue: எச்சரிக்கை வினாவின் வலிமை
  choice: ‘எப்படித் தப்பிப்போம்?’ என்ற வினா வடிவம்
  alternative: ‘நிச்சயமாகத் தப்ப மாட்டோம்’ என்ற வெளிப்படையான கூற்று
  rationale: கிரேக்கம் எதிர்கால வினா வடிவில் கடுமையான எச்சரிக்கையை முன்வைக்கிறது. வினாவை அப்படியே காப்பது அதன் இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
- issue: ἥτις தொடர்புச் சொல்லின் அமைப்பு
  choice: முதன்மை உரையில் ‘இந்த மீட்பு’ என்று தெளிவுபடுத்துதல்
  alternative: ‘அது’ என்ற தொடர்புத் தொடரை நேரடியாகப் பயன்படுத்துதல்
  rationale: இரண்டு வடிவங்களும் மீட்பையே குறிக்கின்றன. முதன்மை வடிவம் தமிழில் தெளிவானது; மூலத்தின் தொடர்புத் தொடர் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் மரியாதையும் எச்சரிக்கைத் தொனியும் காக்கப்பட்டுள்ளன. ‘இரட்சிப்பு’ என்ற சமய வழக்குச் சொல்லுக்குப் பதிலாக, σωτηρία என்பதன் விடுவிப்பு சார்ந்த பொருளை இயல்பாக எடுத்துரைக்கும் ‘மீட்பு’ தேர்ந்தெடுக்கப்பட்டது. வாக்கியத்தின் வினா வடிவமும் தொடக்கநிலைப் பொருளும் பாதுகாக்கப்பட்டுள்ளன.
