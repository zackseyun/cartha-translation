  source_fidelity: 'முக்கிய வாக்கிய அமைப்பும் பொருளும் மூலத்துக்கு உண்மையாக உள்ளன: நிபந்தனைத் தன்மையிலான எச்சரிக்கை வினா, ‘இவ்வளவு மகத்தான மீட்பு,’ ஆண்டவர் வழியாகத் தொடங்கிய அறிவிப்பு, கேட்டவர்களின் உறுதிப்படுத்தல் ஆகியவை காக்கப்பட்டுள்ளன. ஆனால் λαλεῖσθαι என்பதற்கு ‘எடுத்துரைக்கப்படுதல்’ என்பது விளக்கிக் கூறுதல் என்ற கூடுதல் நுணுக்கத்தைத் தரக்கூடும்; ‘அறிவிக்கப்படுதல்’ இங்கு மூலத்தின் அறிவித்தல்/பேசுதல் பொருளுக்கு நெருக்கமாகும்.'
