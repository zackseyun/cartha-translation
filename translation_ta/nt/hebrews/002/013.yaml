  text: καὶ πάλιν· Ἐγὼ ἔσομαι πεποιθὼς ἐπ’ αὐτῷ· καὶ πάλιν· Ἰδοὺ ἐγὼ καὶ τὰ παιδία ἅ μοι ἔδωκεν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/013.yaml
  text: And again[a], “I will put my trust in him.” And again, “Behold[d][c][b], I and the children whom God has given me.”
translation:
  language: ta
  text: 'மீண்டும்: “நான் அவர்மேல் நம்பிக்கை கொண்டிருப்பேன்[a].” மீண்டும்: “இதோ, நானும் கடவுள் எனக்குக் கொடுத்த பிள்ளைகளும்[b].”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “நான் அவர்மேல் நம்பிக்கையுள்ளவனாக இருப்பேன்” அல்லது “நான் அவர்மேல் உறுதியான நம்பிக்கை கொண்டிருப்பேன்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கடவுள் எனக்குத் தந்த பிள்ளைகள்.”
    reason: lexical_alternative
  - marker: c
    text: இந்த வசனத்தின் கிரேக்க உரையில் பேசுபவர் பெயரிடப்படவில்லை; சூழலில் எபிரெயர் நூல் இந்த மேற்கோள்களை மகனுக்குப் பொருத்துகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ πάλιν
  choice: மேலும் / மீண்டும்
  rationale: இது இன்னொரு மேற்கோளை அறிமுகப்படுத்துகிறது. கிரேக்கத்தில் ‘அவர் கூறுகிறார்’ என்ற வினைச்சொல் இல்லை; தமிழில் மேற்கோள் இயல்பாக அமைய ‘என்று உள்ளது’ சேர்க்கப்பட்டுள்ளது, ஆனால் பேச்சாளர் யார் என்று சேர்க்கப்படவில்லை.
- source_word: Ἐγὼ
  choice: நான்
  rationale: வலியுறுத்தலுடன் இடம்பெறும் தன்மைப் பெயர்ச்சொல் நேரடியாகத் தக்கவைக்கப்படுகிறது.
- source_word: ἔσομαι πεποιθὼς
  choice: நம்பிக்கை வைத்திருப்பேன்
  rationale: εἰμί என்பதன் எதிர்கால வடிவமும் πείθω என்பதன் நிறைவுப் பெயரெச்சமும் சேர்ந்த இந்தச் சொற்றொடர், தொடர்ந்தோ நிலைத்தோ இருக்கும் எதிர்கால நம்பிக்கையைக் குறிக்கிறது. ‘நம்பிக்கை வைத்திருப்பேன்’ என்பது இதை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐπ’ αὐτῷ
  choice: அவர்மேல்
  rationale: நம்பிக்கை சார்ந்த சூழலில் ἐπί என்பதன் பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்தும் வழக்கு.
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் மேற்கோள் நடையின் வலிமையை இயல்பாகத் தக்கவைக்கிறது.
- source_word: τὰ παιδία
  choice: பிள்ளைகள்
  rationale: மேற்கோளில் உறவுசார் பொருளில் வரும் குழந்தைகளை நவீன தமிழில் இயல்பாகக் குறிக்கிறது; சிறு வயதைத் தேவையின்றி வலியுறுத்தவில்லை.
- source_word: ἅ μοι ἔδωκεν ὁ θεός
  choice: கடவுள் எனக்குக் கொடுத்த
  rationale: கிரேக்க இறந்தகால வினையின் எளிய நிறைவுற்ற செயலைத் தமிழில் இயல்பான தொடர்பெயர் அமைப்பில் தருகிறது. παιδία என்பதுடன் இலக்கண ஒருமைப்பாட்டில் வரும் ἅ-வுக்கு தமிழில் தனி பாலினக் குறிப்பு தேவைப்படாது.
- source_word: ὁ θεός
  choice: கடவுள்
  rationale: θεός என்பதற்கான தெளிவான, பொதுவான நவீனத் தமிழ் மொழிபெயர்ப்பு.
theological_decisions:
- issue: மேற்கோள்களைப் பேசுபவர் மற்றும் கிறிஸ்துவைப் பற்றிய பயன்பாடு
  choice: முதலாம் நபர் மேற்கோள்களை அப்படியே வைத்து, பிரதான உரையில் பேச்சாளரைப் பெயரிட்டு அடையாளப்படுத்தாமல் விடுதல்
  alternative: ‘மகன் கூறுகிறார்’ அல்லது ‘மேசியா கூறுகிறார்’ என்று பிரதான உரையில் சேர்த்தல்
  rationale: இந்த வசனத்தின் கிரேக்க உரை பேச்சாளரைப் பெயரிடவில்லை; சூழலில் எபிரெயர் நூல் இம்மேற்கோள்களை மகனுக்குப் பொருத்துகிறது. மொழிபெயர்ப்பு அந்தச் சூழல்சார் இறையியல் பயன்பாட்டை முன்கூட்டியே உரைக்குள் சேர்க்காமல், மூலத்தின் அமைப்பையும் இறையியல் பதற்றத்தையும் தக்கவைக்கிறது.
translation_notes:
  register: நடை நவீன, பொதுவான, கண்ணியமான தமிழில் அமைக்கப்பட்டுள்ளது. மேற்கோளின் உயர்ந்த தொனிக்காக ‘இதோ’ தக்கவைக்கப்பட்டுள்ளது. கிரேக்கத்தில் இல்லாத பேச்சாளர் அடையாளம் பிரதான உரையில் சேர்க்கப்படவில்லை. தமிழில் தனித்து நிற்கும் மேற்கோள்கள் இயல்பாக அமைய ‘என்று உள்ளது’ பயன்படுத்தப்பட்டுள்ளது.
