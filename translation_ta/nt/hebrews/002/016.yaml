source:
  edition: SBLGNT
  text: οὐ γὰρ δήπου ἀγγέλων ἐπιλαμβάνεται, ἀλλὰ σπέρματος Ἀβραὰμ ἐπιλαμβάνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/016.yaml
  text: For surely it is not angels that he helps[a], but the offspring of Abraham.
translation:
  language: ta
  text: ஏனெனில், அவர் நிச்சயமாகத் தூதர்களுக்கு உதவி செய்வதில்லை; மாறாக, ஆபிரகாமின் சந்ததிக்கு உதவி செய்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பற்றிக்கொள்கிறார்.” கிரேக்க வினைச்சொல் நேரடியாக “பற்றிக்கொள்” என்று பொருள்படலாம்; இங்கே அது “உதவி செய்” அல்லது “உதவிக்கு வா” என்ற பொருளைக் கொண்டிருக்க வாய்ப்பு அதிகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: δήπου
  choice: நிச்சயமாக
  rationale: கேட்போருக்குத் தெளிவானதாகக் கருதப்படும் முடிவை வலியுறுத்தும் δήπου என்பதன் நயத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἀγγέλων
  choice: தூதர்களுக்கு
  rationale: இங்கே தேவதூதர்களைக் குறிக்கும் ἀγγέλων, எதிர்மறை ஒப்பீட்டில் உதவி பெறும் வகுப்பாக வருகிறது; தமிழில் வினைக்கேற்ப நான்காம் வேற்றுமை பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐπιλαμβάνεται
  choice: உதவி செய்கிறார்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘பற்றிக்கொள்’ என்பதாக இருந்தாலும், இச்சூழலில் உதவிக்காக அணுகுதல் அல்லது துணைநிற்றல் என்ற மரபுத்தொடர்ப் பொருள் பொருத்தமாக உள்ளது. சொல்லுக்குச் சொல் மாற்று அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: σπέρματος Ἀβραὰμ
  choice: ஆபிரகாமின் சந்ததிக்கு
  rationale: σπέρμα ஒருமை வடிவில் கூட்டுப் பொருளைக் கொண்டது. ‘சந்ததி’ என்பது ‘வித்து’ என்பதைவிட நவீன வாசகருக்கு இயல்பாகவும், ‘சந்ததியினர்’ என்பதைவிட மூலத்தின் கூட்டொருமையை நெருக்கமாகவும் காக்கிறது.
- source_word: οὐ γὰρ ... ἀλλὰ
  choice: ஏனெனில் ... செய்வதில்லை; மாறாக ... செய்கிறார்
  rationale: மூலத்தில் உள்ள மறுப்பையும் வலுவான எதிர்மறை ஒப்பீட்டையும் தெளிவான தமிழ் வாக்கிய அமைப்பில் காக்கிறது.
theological_decisions:
- issue: கிறிஸ்துவின் மீட்புச் செயலுடன் தொடர்புடைய ἐπιλαμβάνεται என்பதன் பொருள்
  choice: குமாரன் தூதர்களுக்கு அல்ல, ஆபிரகாமின் சந்ததிக்கு உதவி செய்கிறார்.
  alternative: குமாரன் ஆபிரகாமின் சந்ததியைப் பற்றிக்கொள்கிறார்; இது அவர் மனித இயல்பை ஏற்றதைக் குறிப்பதாக வாசிக்கலாம்.
  rationale: உடனடிச் சூழல் மனிதர்களுடன் குமாரன் கொண்ட ஒருமைப்பாட்டையும் அவர்களுக்காகச் செய்யும் மீட்புச் செயலையும் பேசுவதால், ‘உதவி செய்கிறார்’ என்பது இயல்பான சூழற்பொருள். எனினும் ‘பற்றிக்கொள்கிறார்’ என்ற நேரடிப் பொருளும் அதன் இறையியல் நயமும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘தூதர்கள்’ என்பது சூழலில் தேவதூதர்களைக் குறிக்கிறது. ‘சந்ததி’ மூலத்தின் கூட்டொருமையையும் உண்மையான பொருள் நெகிழ்வையும் காக்கிறது.
