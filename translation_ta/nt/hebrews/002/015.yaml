revisions:
- from: மேலும், மரண பயத்தினால் தங்கள் வாழ்நாள் முழுவதும் அடிமைத்தனத்துக்கு உட்பட்டிருந்த[a] அனைவரையும் விடுவிக்கவும்.
  to: மரணத்தின் பயத்தினால் தங்கள் வாழ்நாள் முழுவதும் அடிமைத்தனத்திற்கு உட்பட்டிருந்த அனைவரையும் விடுவிக்கவும்.
  rationale: The revision removes the mildly intensifying connective and uses a more exact, natural Tamil expression for “fear of death.” It retains the preceding-verse-dependent purpose form, the comprehensive duration, and the text’s deliberately unspecified description of slavery.
  reviewer_model: gpt-5.6-terra
