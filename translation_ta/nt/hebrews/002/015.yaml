source:
  edition: SBLGNT
  text: καὶ ἀπαλλάξῃ τούτους, ὅσοι φόβῳ θανάτου διὰ παντὸς τοῦ ζῆν ἔνοχοι ἦσαν δουλείας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/015.yaml
  text: and free those who[a], through fear of death, were subject to slavery all their lives.
translation:
  language: ta
  text: மரணத்தின் பயத்தினால் தங்கள் வாழ்நாள் முழுவதும் அடிமைத்தனத்திற்கு உட்பட்டிருந்த அனைவரையும் விடுவிக்கவும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπαλλάξῃ
  choice: விடுவிக்கவும்
  rationale: ஒரு கட்டுப்பட்ட நிலையிலிருந்து விடுதலை செய்வதை இயல்பாகவும் நேரடியாகவும் தெரிவிக்கிறது; தேவையற்ற கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: τούτους, ὅσοι
  choice: அனைவரையும்
  rationale: தொடர்ந்து விவரிக்கப்படும் வகுப்பில் அடங்கும் எல்லாரையும் குறிக்கும் உள்ளடக்கமான பொருளை நவீன தமிழில் இயல்பாகத் தருகிறது.
- source_word: φόβῳ θανάτου
  choice: மரண பயத்தினால்
  rationale: மரணத்தைப் பற்றிய பயம் அவர்களுடைய நிலைக்குக் காரணமாகவோ அதை ஆளும் சூழ்நிலையாகவோ இருந்தது என்ற காரண/கருவி நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: διὰ παντὸς τοῦ ζῆν
  choice: தங்கள் வாழ்நாள் முழுவதும்
  rationale: வாழ்க்கையின் முழுக் காலப்பரப்பையும் குறிக்கும் கிரேக்க மரபுத்தொடரை இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: ἔνοχοι ἦσαν δουλείας
  choice: அடிமைத்தனத்துக்கு உட்பட்டிருந்த
  rationale: ἔνοχος என்பதிலுள்ள கட்டுப்பட்ட அல்லது கீழ்ப்பட்ட நிலையைத் தக்கவைத்து, வெறும் சட்டரீதியான பொறுப்பு என்ற பலவீனமான பொருளைத் தவிர்க்கிறது.
- source_word: δουλείας
  choice: அடிமைத்தனம்
  rationale: சொல்லின் வலிமையான அடிமைநிலை உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: καὶ
  choice: மேலும்
  rationale: முந்தைய வசனத்தின் நோக்கக் கூற்றுடன் இக்கூற்றை இணைக்கிறது; தனி வசனமாக வாசிக்கும்போதும் தொடர்பு தெளிவாக இருக்கிறது.
theological_decisions:
- issue: δουλείας குறிக்கும் அடிமைநிலையின் தன்மை
  choice: மரண பயத்துடன் தொடர்புடைய உண்மையான அடிமைநிலை என்று மட்டும் மொழிபெயர்க்கப்பட்டது.
  alternative: பிசாசுக்கான அடிமைத்தனம், பாவத்துக்கான அடிமைத்தனம், அல்லது மரணநிலையின் இருப்பியல் பயம் என்று குறிப்பாக்குதல்.
  rationale: உடனடியான சூழலில் பிசாசும் மரணத்தின் வல்லமையும் குறிப்பிடப்பட்டாலும், இவ்வசனம் அடிமைத்தனத்தின் இயக்கமுறையை மேலும் குறுக்கமாக வரையறுக்கவில்லை. எனவே மூலத்தின் இறையியல் பதற்றமும் பொதுமையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. இவ்வசனம் முந்தைய நோக்கக் கட்டமைப்பைத் தொடர்வதால் “மேலும்” மற்றும் “விடுவிக்கவும்” பயன்படுத்தப்பட்டுள்ளன.
