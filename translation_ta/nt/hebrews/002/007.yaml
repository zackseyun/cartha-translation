source:
  edition: SBLGNT
  text: ἠλάττωσας αὐτὸν βραχύ τι παρ’ ἀγγέλους, δόξῃ καὶ τιμῇ ἐστεφάνωσας ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/007.yaml
  text: You made him lower than the angels for a little while[a]; you crowned him with glory and honor.
translation:
  language: ta
  text: நீர் அவரைச் சிறிது காலம் தேவதூதர்களைவிடத் தாழ்ந்தவராக்கினீர்[a]; மகிமையாலும் மரியாதையாலும் அவரை முடிசூட்டினீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீர் அவரைத் தேவதூதர்களைவிடச் சற்றுத் தாழ்ந்தவராக்கினீர்.” கிரேக்கச் சொற்றொடர் கால அளவுக்குப் பதிலாக அளவையும் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠλάττωσας
  choice: தாழ்ந்தவராக்கினீர்
  rationale: ἐλαττόω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவம் இங்கு ஒப்பீட்டுடன் காரணவினைப் பொருளில் வருகிறது; ஆகவே ‘தாழ்ந்தவராக்கினீர்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: αὐτὸν
  choice: அவரை / அவருக்கு
  rationale: சங்கீத மேற்கோளில் வரும் ஆண்பால் ஒருமைச் சுட்டுப்பெயரைப் பேணுகிறது; கிரேக்கத்தில் இல்லாத பெயர்ச்சொல்லைச் சேர்க்காமல் பிரதிநிதித்துவ மனிதப் பொருளுக்கும் இடமளிக்கிறது.
- source_word: βραχύ τι
  choice: சிறிது காலம்
  rationale: இச்சொற்றொடர் கால அளவையோ தர அளவையோ குறிக்கலாம். எபிரெயர் 2-ன் உடனடிச் சூழலில் தற்காலிகத் தாழ்வு என்ற காலப் பொருள் நன்கு பொருந்துகிறது; தர அளவுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: παρ’ ἀγγέλους
  choice: தேவதூதர்களைவிட
  rationale: ஒப்பீட்டுப் பயன்பாட்டில் παρά + வேற்றுமை உருபு ‘...விட’ என்ற பொருளைத் தருகிறது; ἄγγελοι இங்கு வானதூதர்களைக் குறிப்பதால் ‘தேவதூதர்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: δόξῃ
  choice: மகிமையால்
  rationale: στεφανόω உடன் வரும் கொடை/கருவிப் பொருளுடைய வேற்றுமையை இயல்பான தமிழில் ‘மகிமையால்’ என வெளிப்படுத்துகிறது.
- source_word: τιμῇ
  choice: கனத்தால்
  rationale: τιμή என்பது அளிக்கப்படும் மதிப்பு, கனம், மரியாதை ஆகியவற்றைக் குறிக்கிறது. δόξα உடன் இணையும் இந்த உயர்ந்த வேதாகம நடையில் ‘மகிமையும் கனமும்’ சுருக்கமாகவும் இயல்பாகவும் அமைகிறது.
- source_word: ἐστεφάνωσας
  choice: முடிசூட்டினீர்
  rationale: στεφανόω என்பதன் இறந்தகால வடிவத்தை நேரடியாகவும் இயல்பாகவும் தருகிறது; மேற்கோளின் நிறைவேற்றப்பட்ட செயலை மிகையாக விளக்கவில்லை.
theological_decisions:
- issue: சங்கீதம் 8 மேற்கோளில் βραχύ τι என்பதன் பொருள்
  choice: 'காலப் பொருள்: ‘சிறிது காலம்’'
  alternative: 'தர அளவுப் பொருள்: ‘சற்றுத் தாழ்ந்தவராக’'
  rationale: கிரேக்கச் சொற்றொடர் இரு பொருள்களையும் அனுமதிக்கிறது. எபிரெயர் 2-ல் இயேசுவின் தற்காலிகத் தாழ்வையும் அதைத் தொடரும் மகிமையையும் பற்றிய பயன்பாட்டுக்கு காலப் பொருள் வலுவாகப் பொருந்துகிறது. இருப்பினும் உண்மையான மொழியியல் மற்றும் இறையியல் தெளிவின்மையை மறைக்காமல் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், அதேவேளை வேதாகம மேற்கோளுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இறைவனை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘நீர்’, ‘ஆக்கினீர்’, ‘சூட்டினீர்’ ஆகியவை தொடர்ச்சியாகப் பேணப்பட்டுள்ளன.
