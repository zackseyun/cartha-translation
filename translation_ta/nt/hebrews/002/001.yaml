  text: For this reason[a], we must pay much closer attention to what we have heard, lest we drift away.
translation:
  language: ta
  text: இதன் காரணமாக, நாம் கேட்டவற்றை விட்டு விலகிச் சென்றுவிடாதபடி, அவற்றில் இன்னும் அதிகக் கவனம் செலுத்த வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: இதன் காரணமாக
  rationale: முந்தைய வாதத்துடன் உள்ள காரண–விளைவுத் தொடர்பை இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: δεῖ
  choice: வேண்டும்
  rationale: இது வெறும் அறிவுரை அல்ல, அவசியம் என்பதைத் தமிழில் இயல்பாகவும் வலிமையாகவும் தெரிவிக்கிறது.
- source_word: περισσοτέρως
  choice: இன்னும் அதிகக்
  rationale: ஒப்பீட்டு வலிமையைப் பாதுகாத்து, கவனம் செலுத்துவதன் தீவிரத்தை இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: προσέχειν ἡμᾶς
  choice: நாம் ... கவனம் செலுத்த வேண்டும்
  rationale: கேட்ட செய்தியை உன்னிப்பாகக் கவனித்து ஏற்றுக்கொள்ள வேண்டும் என்ற அறிவுறுத்தலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τοῖς ἀκουσθεῖσιν
  choice: நாம் கேட்டவற்றுக்கு
  rationale: இறந்தகாலச் செயப்பாட்டு பங்கேற்புப் பெயரெச்சத்தை இயல்பாக மொழிபெயர்த்து, கேட்டவை தொடர்ந்து பொருத்தமுடையவை என்ற உணர்வையும் காக்கிறது; ‘செய்தி’ என்று விளக்கிப் பொருளைச் சுருக்கவில்லை.
- source_word: μήποτε
  choice: விலகிச் சென்றுவிடாதபடி
  rationale: சாத்தியமான எதிர்மறை விளைவைக் குறித்த எச்சரிக்கையைத் தமிழின் எதிர்மறை நோக்குநிலை அமைப்பில் இயல்பாகத் தருகிறது.
- source_word: παραρυῶμεν
  choice: விலகிச் சென்றுவிடாதபடி
  rationale: கேட்பவர்களே மெதுவாக வழுவிச் செல்லும் உருவகத்தை இயல்பாக வெளிப்படுத்துகிறது. வினைச்சொல்லின் ‘கடந்து மிதந்து செல்லுதல்’ அல்லது ‘நழுவிப்போதல்’ என்ற பிற சாத்திய நுணுக்கங்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
theological_decisions:
- issue: παραρυῶμεν என்பதிலுள்ள எச்சரிக்கை உருவகத்தின் தன்மை
  choice: கேட்டவற்றை விட்டு ‘நாம் விலகிச் சென்றுவிடுதல்’ என்ற எச்சரிக்கையாக மொழிபெயர்த்தல்
  alternative: ‘நாம் அவற்றைக் கடந்து வழுவிச் செல்லுதல்’ அல்லது ‘அவை நம்மிடமிருந்து நழுவிப்போக விடுதல்’
  rationale: இலக்கண அமைப்பில் ‘நாம்’ என்பதே வினையின் எழுவாயாக இருப்பதும், எபிரெயர் நூலின் உடனடிச் சூழலில் கேட்போருக்கே எச்சரிக்கை விடுக்கப்படுவதும் முதன்மைத் தேர்வை ஆதரிக்கின்றன. இருப்பினும், விசுவாசத் துறப்பு குறித்த குறிப்பிட்ட கோட்பாட்டு முடிவை வசனத்திற்குள் திணிக்காமல், மூல உருவகத்தின் நெகிழ்வை அடிக்குறிப்பு காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதவாக்கியத்திற்குரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டுள்ளது. ‘செவிகொடு’ போன்ற உயர்நடைச் சொல்லுக்கு மாறாக ‘கவனம் செலுத்து’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் எச்சரிக்கைத் தொனியும் உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
