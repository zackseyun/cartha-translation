source:
  edition: SBLGNT
  text: Ἐπεὶ οὖν τὰ παιδία κεκοινώνηκεν ⸂αἵματος καὶ σαρκός⸃, καὶ αὐτὸς παραπλησίως μετέσχεν τῶν αὐτῶν, ἵνα διὰ τοῦ θανάτου καταργήσῃ τὸν τὸ κράτος ἔχοντα τοῦ θανάτου, τοῦτ’ ἔστι τὸν διάβολον,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/014.yaml
  text: Therefore[a], since the children share in flesh and blood, he himself likewise partook of the same things, so that through death he might nullify the one who has the power of death—that is, the devil[b],
translation:
  language: ta
  text: ஆகவே, பிள்ளைகள் இரத்தத்திலும் சதையிலும்[a] பங்குபெற்றிருப்பதால், அவரும் மரணத்தின் மூலம் மரணத்தின் வல்லமையை உடையவனை—அதாவது, பிசாசை—செயலிழக்கச் செய்வதற்காக[b] அதேவற்றில் அதேபோல் பங்குகொண்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'கிரேக்கச் சொல் வரிசை: “இரத்தமும் சதையும்.” வழக்கில் “சதையும் இரத்தமும்” என்றும் சொல்லலாம்.'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அழிப்பதற்காக.” இங்குள்ள கிரேக்க வினை “செயலிழக்கச் செய்தல்,” “வல்லமையற்றதாக்குதல்,” “செல்லுபடியற்றதாக்குதல்,” அல்லது “ஒழித்தல்” என்றும் பொருள்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐπεὶ οὖν
  choice: ஆகவே, ... பங்குபெற்றிருப்பதால்
  rationale: οὖν என்பதன் முடிவுரைக் கருத்தையும் ἐπεί என்பதன் காரணப் பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὰ παιδία
  choice: பிள்ளைகள்
  rationale: சுற்றியுள்ள வசனங்களில் குமாரனுக்குக் கொடுக்கப்பட்ட பிள்ளைகளைக் குறிக்கும் எளிய, நேரடியான சொல்.
- source_word: κεκοινώνηκεν
  choice: பங்குபெற்றிருப்பதால்
  rationale: கடந்த பங்கேற்பினால் தொடரும் நிலையை உணர்த்தும் கிரேக்க நிறைவுக்காலத்தின் வலிமையைப் பாதுகாக்கிறது.
- source_word: αἵματος καὶ σαρκός
  choice: இரத்தத்திலும் சதையிலும்
  rationale: கிரேக்கச் சொல் வரிசையான ‘இரத்தமும் சதையும்’ என்பதைக் காக்கிறது; σάρξ இங்கு உருவகமான ‘பாவ இயல்பு’ அல்ல, உடல்சார்ந்த சதையைக் குறிக்கிறது.
- source_word: παραπλησίως μετέσχεν τῶν αὐτῶν
  choice: அதேவற்றில் அவர்களைப் போலவே பங்குகொண்டார்
  rationale: உண்மையான ஒற்றுமையைத் தெளிவாகச் சொல்கிறது; அதேவேளை முதல் உட்பிரிவில் உள்ள κοινωνέω என்பதிலிருந்து μετέχω என்பதன் சொல்லாட்சிப் வேறுபாட்டை ஓரளவு காக்கிறது.
- source_word: διὰ τοῦ θανάτου
  choice: மரணத்தின் மூலம்
  rationale: διά + உறவுமுறை வேற்றுமை இங்கு கருவி அல்லது வழிமுறையைக் குறிக்கிறது.
- source_word: καταργήσῃ
  choice: வலிமையற்றவனாக்குவதற்காக
  rationale: அழித்து இல்லாமலாக்குதல் என்று கட்டாயப்படுத்தாமல், செயலாற்றும் வல்லமையை இழக்கச் செய்தல் என்ற பொருளைத் தெரிவிக்கிறது.
- source_word: τὸ κράτος ἔχοντα τοῦ θανάτου
  choice: மரணத்தின் அதிகாரத்தை உடையவனை
  rationale: κράτος என்பதன் வல்லமை அல்லது அதிகாரம் என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; கிரேக்க உறவுமுறை அமைப்பையும் தீர்த்துவிடாமல் பிரதிபலிக்கிறது.
- source_word: τοῦτ’ ἔστι τὸν διάβολον
  choice: அதாவது பிசாசை
  rationale: முந்தைய அடையாளத்தை விளக்கும் appositional சொற்றொடரைச் சுருக்கமாகவும் வழக்கமான புதிய ஏற்பாட்டு பெயராலும் தருகிறது.
theological_decisions:
- issue: கிறிஸ்து மனித இயல்பில் பங்குகொண்ட விதம்
  choice: அவரும் அதேவற்றில் அவர்களைப் போலவே பங்குகொண்டார்
  alternative: அவரும் அவர்களுடைய மனிதத் தன்மையில் பங்குகொண்டார்
  rationale: παραπλησίως என்பதன் ‘அவர்களைப் போலவே’ என்ற உண்மையான ஒற்றுமையைப் பாதுகாக்கிறது; ‘மனிதத் தன்மை’ போன்ற விளக்கச் சொல்லை மூலத்தில் இல்லாமல் சேர்ப்பதைத் தவிர்க்கிறது.
- issue: பிசாசின்மேல் καταργέω வினையின் விளைவு
  choice: வலிமையற்றவனாக்குதல்
  alternative: அழித்தல்
  rationale: வினை செயலிழக்கச் செய்தல், வல்லமையை நீக்குதல், ஒழித்தல் ஆகிய பொருள்களை ஏற்கலாம். முதன்மை உரை பிசாசு இல்லாமலாக்கப்பட்டான் என்ற தேவையற்ற முடிவைத் தவிர்க்கிறது; மரபான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: τὸ κράτος ... τοῦ θανάτου என்பதிலுள்ள உறவு
  choice: மரணத்தின் அதிகாரம்
  alternative: மரணத்தின்மேல் அதிகாரம்
  rationale: கிரேக்க உறவுமுறைத் தொடரை நேரடியாக வைத்துப் பொருளிலுள்ள அழுத்தத்தைத் தீர்மானிக்காமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமும் வாசிப்புத் தெளிவும் காக்கப்பட்டுள்ளன. கிரேக்கத்தின் ‘இரத்தமும் சதையும்’ என்ற வரிசை முதன்மை உரையில் வைக்கப்பட்டுள்ளது. நோக்கத்தைக் காட்டும் நீண்ட கிரேக்க வாக்கியம் தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டு, இரண்டாவது வாக்கியத்தில் ‘அவர் பங்குகொண்டார்’ மீண்டும் சொல்லப்பட்டுள்ளது.
