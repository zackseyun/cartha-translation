revisions:
- from: ஆகவே, பிள்ளைகள் இரத்தத்திலும் சதையிலும்[a] பங்குபெற்றிருப்பதால், அவரும் அதேவற்றில் அவர்களைப் போலவே பங்குகொண்டார். இவ்வாறு, மரணத்தின் மூலம் மரணத்தின் அதிகாரத்தை உடையவனை—அதாவது பிசாசை—வலிமையற்றவனாக்குவதற்காக[b] அவர் பங்குகொண்டார்.
  to: ஆகவே, பிள்ளைகள் இரத்தத்திலும் சதையிலும்[a] பங்குபெற்றிருப்பதால், அவரும் மரணத்தின் மூலம் மரணத்தின் வல்லமையை உடையவனை—அதாவது, பிசாசை—செயலிழக்கச் செய்வதற்காக[b] அதேவற்றில் அதேபோல் பங்குகொண்டார்.
  rationale: The revision removes the erroneous repeated main verb and places the purpose clause with Christ’s participation, reflecting ἵνα ... καταργήσῃ. “அதேபோல்” renders παραπλησίως without importing additional Christological formulation, while “செயலிழக்கச் செய்வதற்காக” faithfully conveys καταργέω’s likely sense without requiring annihilation. Footnote anchors and the original Greek word-order note are retained.
