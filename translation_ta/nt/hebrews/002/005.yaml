language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Οὐ γὰρ ἀγγέλοις ὑπέταξεν τὴν οἰκουμένην τὴν μέλλουσαν, περὶ ἧς λαλοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/005.yaml
  text: For he did not subject the world to come to angels[a], about which we are speaking.
translation:
  language: ta
  text: ஏனெனில், நாம் பேசிக்கொண்டிருக்கும் வரப்போகும் உலகத்தை[a] அவர் தேவதூதர்களுக்குக் கீழ்ப்படுத்தவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மக்கள் வாழும் வரப்போகும் உலகத்தை.”
    reason: οἰκουμένη என்பதன் அடிப்படைப் பொருள் ‘மக்கள் வாழும் உலகம்’ என்பதாகவும் இருக்கலாம்; ‘வரப்போகும்’ என்பது உலகத்தையே குறிக்கிறது.
lexical_decisions:
- source_word: Οὐ γὰρ
  choice: ஏனெனில் ... இல்லை
  rationale: γάρ முந்தைய கருத்துக்கான விளக்கத் தொடர்பைக் காட்டுவதால் ‘ஏனெனில்’ எனவும், οὐ வினையை மறுப்பதால் ‘இல்லை’ எனவும் மொழிபெயர்க்கப்பட்டது.
- source_word: ἀγγέλοις
  choice: தேவதூதர்களுக்கு
  rationale: எபிரெயர் நிருபத்தின் உடனடிச் சூழலில் இது மனிதத் தூதுவர்களை அல்ல, விண்ணுலகத் தேவதூதர்களையே குறிக்கிறது.
- source_word: ὑπέταξεν
  choice: கீழ்ப்படுத்தவில்லை
  rationale: ὑποτάσσω என்பது ஒருவரின் அதிகாரத்திற்கோ ஆட்சிக்கோ கீழ் வைப்பதைக் குறிக்கிறது; ‘கீழ்ப்படுத்து’ அந்த ஆட்சிப் பொருளை இயல்பாகத் தக்கவைக்கிறது.
- source_word: τὴν οἰκουμένην
  choice: உலகத்தை
  rationale: οἰκουμένη என்பது மக்கள் வாழும் உலகத்தையோ உலக ஒழுங்கையோ குறிக்கக்கூடும். முதன்மை உரையில் ‘உலகம்’ இயல்பாக உள்ளது; அதன் சொற்பொருள் நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τὴν μέλλουσαν
  choice: வரப்போகும்
  rationale: μέλλουσαν எதிர்காலத்தில் வரவிருப்பதைக் குறிக்கிறது; ‘வரப்போகும்’ அதன் காலநோக்கைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: περὶ ἧς λαλοῦμεν
  choice: நாம் பேசிக்கொண்டிருக்கும்
  rationale: நிகழ்கால வினையான λαλοῦμεν தொடரும் உரையாடலைக் காட்டுகிறது; தமிழில் பெயரைத் தழுவும் இத்தொடர் இயல்பாகவும் தெளிவாகவும் உள்ளது.
theological_decisions:
- issue: ‘வரப்போகும் உலகம்’ என்பதன் குறிப்பு
  choice: எதிர்காலத்தில் வரவிருக்கும் உலகம் அல்லது உலக ஒழுங்கு
  alternative: பொதுவாக மக்கள் வாழும் தற்போதைய பூமி; குறிப்பாக நற்செய்திக் காலம்
  rationale: τὴν οἰκουμένην τὴν μέλλουσαν என்ற தொடர் இயல்பாக வரவிருக்கும் உலகத்தைச் சுட்டுகிறது. ஆனால் அது எந்தத் துல்லியமான காலகட்டம் அல்லது அமைப்பைக் குறிக்கிறது என்பதை மொழிபெயர்ப்பில் தீர்மானிக்காமல், மூலத்தின் இறையியல் அழுத்தமும் திறந்த தன்மையும் பாதுகாக்கப்பட்டுள்ளன.
- issue: ὑπέταξεν என்பதன் மறைந்த எழுவாய்
  choice: அவர்
  alternative: தேவன் என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: கிரேக்கத்தில் எழுவாய் வெளிப்படையாகக் கூறப்படவில்லை; சூழலில் அது தேவனைக் குறிக்கிறது. ‘அவர்’ என்று மொழிபெயர்ப்பது சூழலுக்கேற்ப தெளிவைத் தருவதோடு, மூலத்தில் இல்லாத பெயரைச் சேர்ப்பதையும் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. கிரேக்க வாக்கியத்தின் விளக்கத் தொடர்பும், தேவதூதர்களின் ஆட்சிக்குக் கீழ்ப்படுத்தப்படாத வரப்போகும் உலகம் என்ற கருத்தும் பாதுகாக்கப்பட்டுள்ளன.
