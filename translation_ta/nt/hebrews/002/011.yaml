- from: பரிசுத்தமாக்குகிறவரும் பரிசுத்தமாக்கப்பட்டு வருகிறவர்களும் அனைவரும் ஒருவரிடமிருந்து வந்தவர்கள்[a]. இந்தக் காரணத்தினால், அவர்களைச் சகோதரர்கள் என்று அழைக்க அவர் வெட்கப்படுவதில்லை[b].
