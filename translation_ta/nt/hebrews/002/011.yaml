  text: ὅ τε γὰρ ἁγιάζων καὶ οἱ ἁγιαζόμενοι ἐξ ἑνὸς πάντες· δι’ ἣν αἰτίαν οὐκ ἐπαισχύνεται ἀδελφοὺς αὐτοὺς καλεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/011.yaml
  text: For both the one who sanctifies and those who are being sanctified are all from one[a]; for this reason he is not ashamed to call them brothers[b],
translation:
  language: ta
  text: பரிசுத்தமாக்குகிறவரும் பரிசுத்தமாக்கப்படுகிறவர்களும் அனைவரும் ஒன்றிலிருந்து வந்தவர்கள்[a]. அதனாலே, அவர்களைச் சகோதரர்கள் என்று அழைக்க அவர் வெட்கப்படுவதில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரே தந்தையிடமிருந்து,” “ஒரே மூலத்திலிருந்து,” அல்லது “ஒரே மூதாதையிடமிருந்து.” ‘ஒன்று’ எதைக் குறிக்கிறது என்பதை கிரேக்க மூலம் குறிப்பிடவில்லை.
    reason: alternative_reading
  - marker: b
    text: “சகோதரர்கள்” என்பது ἀδελφούς என்ற ஆண்பால் பன்மைச் சொல்லின் மொழிபெயர்ப்பு; இச்சூழலில் பெண்களையும் உள்ளடக்கிய விசுவாசிகளின் குடும்பத்தையும் அது குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἁγιάζων
  choice: பரிசுத்தமாக்குகிறவர்
  rationale: நிகழ்கால செயப்பாட்டு வினையெச்சம் பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது. ‘பரிசுத்தமாக்குகிறவர்’ என்பது செயலைத் தெளிவாகவும் வழக்கமான வேதாகமச் சொல்லாட்சியுடனும் வெளிப்படுத்துகிறது.
- source_word: οἱ ἁγιαζόμενοι
  choice: பரிசுத்தமாக்கப்பட்டு வருகிறவர்கள்
  rationale: நிகழ்காலச் செயப்பாட்டு எதிர்வினை வடிவம் தொடரும் செயல் அல்லது நடைமுறையில் உள்ள நிலையைச் சுட்டலாம். ‘பட்டு வருகிறவர்கள்’ அந்த அம்சத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: ἐξ ἑνὸς
  choice: ஒருவரிடமிருந்து வந்தவர்கள்
  rationale: ἑνός ஆண்பால்/அலிப்பால் ஒருமை வடிவமாக இருந்தாலும் அதன் குறிப்பு வெளிப்படையாகக் கூறப்படவில்லை. தமிழில் வாக்கியத்தை நிறைவாக்க ‘வந்தவர்கள்’ சேர்க்கப்பட்டுள்ளது; ‘ஒருவரிடமிருந்து’ என்பது தந்தை, மூதாதை அல்லது பொதுவான மூலம் எனத் தீர்மானிக்காமல் மனிதர் சார்ந்த குறிப்பின் தெளிவின்மையை இயன்றவரை காக்கிறது.
- source_word: πάντες
  choice: அனைவரும்
  rationale: பரிசுத்தமாக்குகிறவரையும் பரிசுத்தமாக்கப்பட்டு வருகிறவர்களையும் முழுமையாக உள்ளடக்கும் வலியுறுத்தலைக் காக்கிறது.
- source_word: δι’ ἣν αἰτίαν
  choice: இந்தக் காரணத்தினால்
  rationale: முந்தைய கூற்றிலிருந்து வரும் விளைவைத் தெளிவாகவும் dignified modern Tamil-இலும் தெரிவிக்கிறது.
- source_word: οὐκ ἐπαισχύνεται
  choice: வெட்கப்படுவதில்லை
  rationale: மூலத்தின் மானம்–வெட்கம் சார்ந்த நுணுக்கத்தைப் பொருள் விரிவாக்கமின்றி நேரடியாகக் காக்கிறது.
- source_word: ἀδελφοὺς
  choice: சகோதரர்கள்
  rationale: மூலத்தில் ஆண்பால் பன்மை குடும்பச் சொல் உள்ளது. தமிழின் ‘சகோதரர்கள்’ அதைப் பாதுகாக்கிறது; சூழலில் பெண்கள் உட்பட விசுவாசக் குடும்பம் குறிக்கப்படலாம் என்பது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: καλεῖν
  choice: அழைக்க
  rationale: ἐπαισχύνεται என்பதோடு வரும் வினையெச்சத்தின் இயல்பான தமிழ் இணை இது.
theological_decisions:
- issue: ‘அவர்’ என்பவரின் அடையாளமும் ἐξ ἑνὸς என்பதன் குறிப்பும்
  choice: சூழலின்படி ‘அவர்’ பரிசுத்தமாக்குகிற குமாரனைக் குறிக்கிறது; ‘ஒருவரிடமிருந்து’ என்பதன் குறிப்பு முதன்மை உரையில் தீர்மானிக்கப்படவில்லை.
  alternative: ‘ஒரே தந்தையிடமிருந்து,’ ‘ஒரே மூலத்திலிருந்து,’ அல்லது ‘ஒரே மூதாதையிடமிருந்து’
  rationale: உடனடிச் சூழல் பரிசுத்தமாக்குகிறவரை குமாரன்/இயேசு என அடையாளப்படுத்துகிறது. ஆனால் ἐξ ἑνὸς என்பது தேவன், ஒரு மூதாதை, அல்லது பொதுவான தோற்றம் ஆகியவற்றில் எதைச் சுட்டுகிறது என்று வெளிப்படையாகக் கூறவில்லை. ஆகவே அந்த இறையியல் திறந்தநிலை காக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத்தமிழில் இயல்பான, மரியாதைமிக்க வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. ‘பரிசுத்தமாக்குதல்’ என்ற நிலைபெற்ற இறையியல் சொல் தக்கவைக்கப்பட்டு, நிகழ்கால எதிர்வினையின் தொடர்ச்சி ‘பட்டு வருகிற’ என வெளிப்படுத்தப்பட்டுள்ளது. மூலத்தின் ἐξ ἑνὸς குறித்த தெளிவின்மை அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
