  text: ὅθεν ὤφειλεν κατὰ πάντα τοῖς ἀδελφοῖς ὁμοιωθῆναι, ἵνα ἐλεήμων γένηται καὶ πιστὸς ἀρχιερεὺς τὰ πρὸς τὸν θεόν, εἰς τὸ ἱλάσκεσθαι τὰς ἁμαρτίας τοῦ λαοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/017.yaml
  text: Therefore he had to become like his brothers in every respect[a], so that he might become a merciful and faithful high priest in the things pertaining to God[b], to make atonement for the sins of the people.
translation:
  language: ta
  text: ஆகையால், அவர் எல்லா விதத்திலும் தமது சகோதரர்களைப் போல ஆகவேண்டியிருந்தது[a]; அவர் கடவுளுக்குரிய காரியங்களில் இரக்கமுள்ளவரும் உண்மையுள்ளவருமான தலைமைக் குருவாகி, மக்களின் பாவங்களுக்குப் பரிகாரம் செய்யும்படியாக[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தமது சகோதர சகோதரிகளைப் போல.” கிரேக்கத்தில் “சகோதரர்கள்” என்ற ஆண்பால் பன்மைக் குடும்பச் சொல் உள்ளது; சூழலைப் பொறுத்து அது விசுவாசக் குடும்பத்திலுள்ள பெண்களையும் உள்ளடக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “பரிகாரம் செய்ய” என்பதற்கு, “பாவங்களை நிவிர்த்தி செய்ய” அல்லது “பாவங்களினால் உண்டான கோபத்தைத் தணிக்க” என்றும் பொருள் கொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅθεν
  choice: ஆகையால்
  rationale: முந்தைய வாதத்திலிருந்து வரும் முடிவை இயல்பான நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: ὤφειλεν
  choice: ஆகவேண்டியிருந்தது
  rationale: கடவுளின் மீட்புத் திட்டத்திலிருந்து எழும் உண்மையான அவசியத்தைத் தெரிவிக்கிறது; வெளிப்புறக் கட்டாயத்தைத் தேவையின்றி உணர்த்துவதில்லை.
- source_word: κατὰ πάντα
  choice: எல்லா விதத்திலும்
  rationale: ஒப்புமையின் விரிவான தன்மையை இயல்பான தமிழில் காக்கிறது.
- source_word: τοῖς ἀδελφοῖς
  choice: தமது சகோதரர்களை
  rationale: கிரேக்க மூலத்தின் ஆண்பால் பன்மைக் குடும்பச் சொல்லைத் தக்கவைக்கிறது; சூழலில் அது சகோதரிகளையும் உள்ளடக்கக்கூடும் என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ὁμοιωθῆναι
  choice: போல ஆக
  rationale: ஒத்தவராக ஆவதைக் குறிக்கும் இயல்பான தமிழ் வடிவம்; அவதாரச் சூழலுக்கும் பொருந்துகிறது.
- source_word: ἵνα
  choice: இவ்வாறு
  rationale: முன்னர் கூறப்பட்ட அவசியத்தின் நோக்கத்தையும் விளைவையும் தமிழில் ஓட்டமாக இணைக்கிறது.
- source_word: ἐλεήμων
  choice: இரக்கமுள்ளவர்
  rationale: இரக்கத்தைக் குறிக்கும் நேரடியான, கண்ணியமான சொல்; ஆசாரியப் பணியின் நுணுக்கத்தையும் ஏந்துகிறது.
- source_word: πιστὸς
  choice: உண்மையுள்ளவர்
  rationale: கடவுளுக்கு முன்பான நம்பகத்தன்மையையும் பணியில் நிலைத்திருப்பதையும் தெரிவிக்கிறது.
- source_word: ἀρχιερεὺς
  choice: தலைமைக் குரு
  rationale: யூத ஆசாரிய அமைப்பின் உயர்ந்த பதவியை நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: τὰ πρὸς τὸν θεόν
  choice: கடவுளுக்குரிய காரியங்களில்
  rationale: கடவுளைச் சார்ந்த ஆசாரியப் பணியின் துறையைக் குறிக்கும் மூலத்தின் சற்றே முறையான சொற்றொடரைப் பாதுகாக்கிறது.
- source_word: εἰς τὸ ἱλάσκεσθαι
  choice: பரிகாரம் செய்ய
  rationale: பாவங்களை ஆசாரிய முறையில் கையாளும் செயலை வாசகருக்குப் புரியும் வகையில் கூறுகிறது; கோபத்தைத் தணித்தல் அல்லது பாவத்தை அகற்றுதல் என்ற ஒரே விளக்கத்துக்குள் பொருளைச் சுருக்கவில்லை.
- source_word: τὰς ἁμαρτίας τοῦ λαοῦ
  choice: மக்களின் பாவங்களுக்கு
  rationale: பரிகாரச் செயலின் பொருளாக மக்களின் பாவங்களைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: ἱλάσκεσθαι என்பதன் பரிகாரவியல் பொருள்
  choice: பாவங்களுக்குப் பரிகாரம் செய்ய
  alternative: பாவங்களை நிவிர்த்தி செய்ய; பாவங்களினால் உண்டான கோபத்தைத் தணிக்க
  rationale: மூலச்சொல் ஆசாரியப் பரிகாரச் செயலைக் குறிக்கிறது; அது பாவநீக்கத்தையா கோபத் தணிப்பையா முன்னிறுத்துகிறது என்ற விவாதத்தை முதன்மை உரை ஒருதலைப்பட்சமாகத் தீர்க்காமல் இருக்கிறது.
- issue: ἀδελφοῖς என்ற ஆண்பால் குடும்பப் பன்மை
  choice: தமது சகோதரர்கள்
  alternative: தமது சகோதர சகோதரிகள்
  rationale: மூலத்தின் இலக்கண வடிவத்தையும் சுற்றியுள்ள குடும்ப உருவகத்தையும் முதன்மை உரையில் காக்கிறது; சூழலில் உள்ளடங்கக்கூடிய விரிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ὤφειλεν குறிக்கும் அவசியம்
  choice: ஆகவேண்டியிருந்தது
  alternative: கடமைப்பட்டிருந்தார்
  rationale: மீட்புத் திட்டத்துக்குரிய அவசியத்தைத் தெரிவிக்கிறது; கிறிஸ்துவின்மேல் விருப்பமற்ற வெளிப்புறக் கட்டாயம் சுமத்தப்பட்டதாகத் தெளிவின்றி உணர்த்துவதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. “தலைமைக் குரு” மற்றும் “பரிகாரம்” ஆகியவை ஆசாரியச் சூழலைத் தக்கவைக்கும் பரவலாகப் புரியக்கூடிய சொற்களாகப் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் நோக்கத் தொடர்பு தமிழில் இயல்பாக அமைய இரண்டு வாக்கியங்களாக வடிவமைக்கப்பட்டுள்ளது.
