revisions:
- from: ஆகையால், அவர் எல்லா விதத்திலும் தமது சகோதரர்களைப் போல ஆகவேண்டியிருந்தது[a]. இவ்வாறு, அவர் கடவுளுக்குரிய காரியங்களில் இரக்கமுள்ளவரும் உண்மையுள்ளவருமான தலைமைக் குருவாகி, மக்களின் பாவங்களுக்குப் பரிகாரம் செய்ய முடிந்தது[b].
  to: ஆகையால், அவர் எல்லா விதத்திலும் தமது சகோதரர்களைப் போல ஆகவேண்டியிருந்தது[a]; அவர் கடவுளுக்குரிய காரியங்களில் இரக்கமுள்ளவரும் உண்மையுள்ளவருமான தலைமைக் குருவாகி, மக்களின் பாவங்களுக்குப் பரிகாரம் செய்யும்படியாக[b].
