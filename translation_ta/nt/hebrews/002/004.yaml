source:
  edition: SBLGNT
  text: συνεπιμαρτυροῦντος τοῦ θεοῦ σημείοις τε καὶ τέρασιν καὶ ποικίλαις δυνάμεσιν καὶ πνεύματος ἁγίου μερισμοῖς κατὰ τὴν αὐτοῦ θέλησιν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/004.yaml
  text: while God also bore witness with signs and wonders and various miracles and distributions of the Holy Spirit according to his will.
translation:
  language: ta
  text: அதேவேளையில், கடவுளும் அடையாளங்களாலும் அற்புதங்களாலும் பலவகையான வல்லமைமிக்க செயல்களாலும்[a], தமது விருப்பத்தின்படி பரிசுத்த ஆவியின் பகிர்ந்தளிப்புகளாலும்[b] சாட்சியளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பலவகையான வல்லமைகளாலும்” அல்லது “பலவகையான வல்லமைமிக்க செயல்களாலும்.” கிரேக்கச் சொல் வல்லமையின் வெளிப்பாடுகளையும், இச்சூழலில் அதிசயச் செயல்களையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பரிசுத்த ஆவியின் பங்கீடுகளாலும்” அல்லது “பரிசுத்த ஆவியின் பங்குகளாலும்.” மூல உரை “வரங்கள்” என்று வெளிப்படையாகச் சேர்க்கவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεπιμαρτυροῦντος τοῦ θεοῦ
  choice: அதேவேளையில், கடவுளும் ... சாட்சியளித்தார்
  rationale: முந்தைய வசனத்தின் வினையோடு தொடர்புடைய உடனிகழ்வை ‘அதேவேளையில்’ வெளிப்படுத்துகிறது; συν- என்பதன் சேர்க்கைப் பொருளை ‘கடவுளும்’ காக்கிறது.
- source_word: σημείοις τε καὶ τέρασιν
  choice: அடையாளங்களாலும் அற்புதங்களாலும்
  rationale: கருவிப் பொருளுடைய வேற்றுமையை ‘-ஆல்’ வடிவம் காட்டுகிறது; இணையாக வரும் இரு சொற்களின் சான்றளிக்கும் மற்றும் வியப்பூட்டும் நுணுக்கங்களையும் காக்கிறது.
- source_word: ποικίλαις δυνάμεσιν
  choice: பலவகையான வல்ல செயல்களாலும்
  rationale: δύναμις என்பதிலுள்ள ‘வல்லமை’ என்ற அடிப்படை நுணுக்கத்தையும், இச்சூழலில் அது குறிக்கும் அதிசயச் செயல்களையும் ஒருங்கே வெளிப்படுத்துகிறது; ποικίλαις என்பதற்கு ‘பலவகையான’ என வழங்கப்பட்டுள்ளது.
- source_word: πνεύματος ἁγίου μερισμοῖς
  choice: பரிசுத்த ஆவியின் பகிர்ந்தளிப்புகளாலும்
  rationale: μερισμοῖς என்பதன் பகிர்தல் அல்லது பங்கிடுதல் என்ற பொருளைத் தக்கவைத்து, மூலத்தில் இல்லாத ‘வரங்கள்’ என்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: κατὰ τὴν αὐτοῦ θέλησιν
  choice: தமது விருப்பத்தின்படி
  rationale: κατά + வேற்றுமை உருபின் ஒத்திசைவு சார்ந்த பொருளை இயல்பான தமிழில் தருகிறது; ‘தமது’ என்பது சூழலின் எழுவாயான கடவுளைக் குறிக்கிறது.
theological_decisions:
- issue: αὐτοῦ (‘அவருடைய/தமது’) என்பதன் குறிப்பு
  choice: கடவுளைக் குறிக்கும் ‘தமது’
  alternative: பரிசுத்த ஆவியைக் குறிக்கிறது எனத் தளர்வாகப் புரிந்துகொள்ளலாம்
  rationale: இவ்வாக்கியத்தின் கட்டுப்படுத்தும் எழுவாய் கடவுளே; ஆகவே அவரது விருப்பத்தின்படி இந்தச் சான்றுகள் வழங்கப்பட்டன என்பதே தொடரமைப்பில் இயல்பான வாசிப்பு. மாற்று வாய்ப்பை முற்றிலும் மறுக்கும் கூடுதல் கோட்பாட்டுக் கூற்று சேர்க்கப்படவில்லை.
- issue: πνεύματος ἁγίου என்பதன் மொழிபெயர்ப்பு
  choice: பரிசுத்த ஆவி
  alternative: தூய ஆவி
  rationale: ‘பரிசுத்த ஆவி’ என்பது நவீனத் தமிழ் கிறிஸ்தவப் பயன்பாட்டில் பரவலாக அறியப்படும் மரியாதையான தெய்வீகப் பெயர்; மூலத்தின் பொருளுக்கு மேலாக விளக்கம் சேர்க்காது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. வசனம் முந்தைய வாக்கியத்தைத் தொடரும் பங்கேற்பு அமைப்புடையதாயினும், தமிழ் வாசிப்பின் இயல்புக்காக முழு வினை வடிவம் பயன்படுத்தப்பட்டுள்ளது. கருவிப் பொருளை ‘-ஆல்’ உருபுகள் தெளிவாக வெளிப்படுத்துகின்றன.
