revisions:
- from: ஏனெனில், எந்த விலங்குகளின் இரத்தம் பாவத்திற்காகத் தலைமைக் குருவால் பரிசுத்த இடங்களுக்குள் கொண்டுவரப்படுகிறதோ, அந்த விலங்குகளின் உடல்கள் முகாமுக்கு வெளியே எரிக்கப்படுகின்றன[a][b].
  to: ஏனெனில், பாவத்திற்காகத் தலைமை ஆசாரியரால் பரிசுத்த இடங்களுக்குள் இரத்தம் கொண்டுவரப்படும் விலங்குகளின் உடல்கள் முகாமுக்கு வெளியே எரிக்கப்படுகின்றன[a][b].
  rationale: The revision improves Tamil idiom and renders the high-priestly office with more precise cultic terminology. It leaves intact the source text’s present-generic sense, plural ‘holy places,’ broad ‘for sin’ expression, and the established image of burning outside the camp. Footnote markers and their lexical alternatives are preserved.
