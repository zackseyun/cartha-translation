source:
  edition: SBLGNT
  text: ὧν γὰρ εἰσφέρεται ζῴων τὸ αἷμα περὶ ἁμαρτίας εἰς τὰ ἅγια διὰ τοῦ ἀρχιερέως, τούτων τὰ σώματα κατακαίεται ἔξω τῆς παρεμβολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/011.yaml
  text: For the bodies of those animals whose blood is brought into the holy places for sin by the high priest are burned outside the camp[a][b].
translation:
  language: ta
  text: ஏனெனில், பாவத்திற்காகத் தலைமை ஆசாரியரால் பரிசுத்த இடங்களுக்குள் இரத்தம் கொண்டுவரப்படும் விலங்குகளின் உடல்கள் முகாமுக்கு வெளியே எரிக்கப்படுகின்றன[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்த ஸ்தலத்திற்குள்.” கிரேக்கத்தில் “பரிசுத்த இடங்களுக்குள்” என்று உள்ளது; இது பரிசுத்த சரணாலயப் பகுதியைக் குறிக்கும் வழிபாட்டுச் சொற்றொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “முற்றிலும் எரித்தழிக்கப்படுகின்றன.” இங்கு வரும் வினைச்சொல் முழுமையாக எரிக்கப்படுவதை வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν ... ζῴων / τούτων τὰ σώματα
  choice: எந்த விலங்குகளின் ... அந்த விலங்குகளின் உடல்கள்
  rationale: கிரேக்கத்தின் தொடர்புச் சொல்–சுட்டுச் சொல் அமைப்பைத் தமிழில் இயல்பான ‘எந்த... அந்த...’ வடிவில் வெளிப்படுத்துகிறது; பலியிடப்படும் விலங்குகளையே சூழல் குறிக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்திற்கான விளக்கக் காரணத்தை அறிமுகப்படுத்தும் இணைப்பைத் தெளிவாகக் காக்கிறது.
- source_word: εἰσφέρεται
  choice: கொண்டுவரப்படுகிறதோ
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவத்தையும், பரிசுத்த இடத்திற்குள் இரத்தம் கொண்டு செல்லப்படுவதையும் இயல்பான தமிழில் தருகிறது.
- source_word: τὸ αἷμα
  choice: இரத்தம்
  rationale: பலிச் சடங்கு சார்ந்த நேரடிப் பொருளை மாற்றமின்றிக் காக்கிறது.
- source_word: περὶ ἁμαρτίας
  choice: பாவத்திற்காக
  rationale: பாவத்துடன் தொடர்புடைய பலிச் செயலின் நோக்கத்தைத் தெரிவிக்கிறது; ‘பாவநிவாரண பலியாக’ என்று மூலத்தைவிடக் குறிப்பாக்கவில்லை.
- source_word: εἰς τὰ ἅγια
  choice: பரிசுத்த இடங்களுக்குள்
  rationale: τὰ ἅγια என்பதன் பன்மையையும், பரிசுத்த சரணாலயப் பகுதியைக் குறிக்கும் வழிபாட்டுச் சொல்லாட்சியையும் காக்கிறது.
- source_word: διὰ τοῦ ἀρχιερέως
  choice: தலைமைக் குருவால்
  rationale: διά + genitive காட்டும் செயற்படுத்தும் நபரை இயல்பான தமிழ் செயப்பாட்டு அமைப்பில் தெரிவிக்கிறது.
- source_word: κατακαίεται
  choice: எரிக்கப்படுகின்றன
  rationale: பலிச் சடங்கின் செயலைத் தெளிவாகத் தருகிறது; முழுமையாக எரித்தழிக்கும் வலியுறுத்தலை மாற்று வாசிப்பாக அடிக்குறிப்பில் காக்கிறது.
- source_word: ἔξω τῆς παρεμβολῆς
  choice: முகாமுக்கு வெளியே
  rationale: இஸ்ரயேலரின் பாளயத்தைச் சுட்டும் உருவகத்தை நவீனத் தமிழில் எளிதாகப் புரியும் வகையில் தருகிறது.
theological_decisions:
- issue: εἰς τὰ ἅγια குறிக்கும் வழிபாட்டுச் சார்ந்த இடம்
  choice: பரிசுத்த இடங்களுக்குள்
  alternative: பரிசுத்த ஸ்தலத்திற்குள்; மகா பரிசுத்த ஸ்தலத்திற்குள்
  rationale: எபிரெயர் நூலில் இச்சொற்றொடர் பரிசுத்த சரணாலயப் பகுதியை ஓரளவு நெகிழ்வாகக் குறிக்கலாம். இங்கே ‘மகா பரிசுத்த ஸ்தலம்’ என்று குறுக்குவது மூலத்தில் வெளிப்படையாக இல்லாத குறிப்பைச் சேர்க்கும்; பன்மையைப் பாதுகாப்பது உண்மையான பொருள் நெகிழ்வைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும், அதேவேளை வழிபாட்டுச் சூழலின் கண்ணியத்தைத் தக்கவைக்கும் நடை. ‘பரிசுத்த இடங்கள்’ என்ற பன்மை மூலத்தின் வடிவத்தையும் பொருள் நெகிழ்வையும் காக்கிறது.
