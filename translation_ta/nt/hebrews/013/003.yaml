id: HEB.13.3
reference: Hebrews 13:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μιμνῄσκεσθε τῶν δεσμίων ὡς συνδεδεμένοι, τῶν κακουχουμένων ὡς καὶ αὐτοὶ ὄντες ἐν σώματι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/003.yaml
  text: Remember those in prison[a], as though imprisoned with them; those who are mistreated[b], since you yourselves also are in the body.
translation:
  language: ta
  text: சிறையில் இருப்பவர்களை, நீங்களும் அவர்களோடு கட்டப்பட்டிருப்பதுபோல் நினைவுகூருங்கள்[a]; கொடுமைப்படுத்தப்படுகிறவர்களை, நீங்களும் உடலுடையவர்களாய் இருப்பதால் நினைவுகூருங்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்களும் அவர்களோடு கட்டப்பட்டவர்களாக.” கிரேக்கச் சொல் கைதிகளோடு சேர்ந்து கட்டப்பட்டிருக்கும் படிமத்தை நேரடியாக எழுப்புகிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், “உடலில் இருப்பதால்.” இது பெரும்பாலும், துன்பத்திற்கு உட்படக்கூடிய மனித உடல் நிலையில் நீங்களும் இருப்பதைக் குறிக்கிறது. கிறிஸ்துவின் உடலைக் குறிக்கும் ஒலிநயமும் இதில் இருக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: μιμνῄσκεσθε
  choice: நினைவுகூருங்கள்
  rationale: நிகழ்காலக் கட்டளை தொடர்ந்த அக்கறையோடு நினைவில் வைத்திருப்பதை வலியுறுத்துகிறது. ‘நினைவுகூருங்கள்’ என்பது இயல்பான, கண்ணியமான தமிழில் அந்தச் செயற்பாட்டு பொருளைத் தருகிறது.
- source_word: τῶν δεσμίων
  choice: சிறையில் இருப்பவர்களை
  rationale: δέσμιος என்பதன் அடிப்படைப் படிமம் கட்டப்பட்டிருப்பவர் என்பதாயினும், இச்சூழலில் அது கைதிகளைச் சுட்டுகிறது. ‘சிறையில் இருப்பவர்கள்’ என்பது நவீனத் தமிழில் தெளிவான இயல்பான சொல்லாக்கம்.
- source_word: ὡς συνδεδεμένοι
  choice: நீங்களும் அவர்களோடு கட்டப்பட்டிருப்பதுபோல்
  rationale: συνδέομαι என்பது ‘ஒன்றாக/உடன் கட்டப்படுதல்’ என்ற உயிருள்ள படிமத்தைக் கொண்டுள்ளது. சிறைவாசிகளோடு ஆழமாகத் தம்மை ஒன்றுபடுத்திக்கொள்ளும் அழைப்பையும், மூலத்தின் கட்டுண்டிருக்கும் படிமத்தையும் இச்சொல்லாக்கம் காக்கிறது.
- source_word: τῶν κακουχουμένων
  choice: கொடுமைப்படுத்தப்படுகிறவர்களை
  rationale: κακουχέομαι பிறரால் மோசமாக நடத்தப்படுதல், ஒடுக்கப்படுதல், துன்புறுத்தப்படுதல் ஆகிய பொருள்களைக் கொண்டது. ‘கொடுமைப்படுத்தப்படுகிறவர்கள்’ அதன் செயப்பாட்டு நிலையையும் தீவிரத்தையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ὡς καὶ αὐτοὶ ὄντες ἐν σώματι
  choice: ஏனெனில் நீங்களும் உடலில் இருக்கிறீர்கள்
  rationale: ἐν σώματι என்பதன் நேரடியான ‘உடலில்’ என்ற வடிவம் பாதுகாக்கப்படுகிறது. ὡς இங்கு அறிவுரைக்கான காரணத்தைக் காட்டுவதால் ‘ஏனெனில்’ இயல்பாக உள்ளது; அதேவேளை பொதுவான உடல் சார்ந்த பாதிப்புக்கும் கிறிஸ்துவின் உடல் சார்ந்த ஒலிநயத்திற்கும் இடமளிக்கிறது.
theological_decisions:
- issue: ‘உடலில் இருக்கிறீர்கள்’ (ἐν σώματι) என்பதன் பொருள்
  choice: துன்பத்திற்கு உட்படக்கூடிய பொதுவான மனித உடல் நிலை
  alternative: கிறிஸ்துவின் உடலின் உறுப்பினராக இருப்பது
  rationale: சிறையில் இருப்பவர்களிடமும் கொடுமைப்படுத்தப்படுகிறவர்களிடமும் பரிவு காட்ட வேண்டுமென்ற சூழலில், பொதுவான மனித உடல் நிலையும் அதனால் வரும் பாதிப்புக்குட்படும் தன்மையும் முதன்மைப் பொருளாகத் தெரிகிறது. எனினும் ‘உடலில் இருக்கிறீர்கள்’ என்ற நேரடி சொல்லாக்கம் திருச்சபையாகிய கிறிஸ்துவின் உடல் குறித்த சாத்தியமான ஒலிநயத்தை மூடிவிடவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான அறிவுரைநடை பயன்படுத்தப்பட்டுள்ளது. முதல் வாக்கியத்தில் மூலத்தின் ‘உடன் கட்டப்பட்டிருத்தல்’ என்ற படிமம் காக்கப்பட்டு, இரண்டாம் பகுதியில் தமிழின் இயல்பிற்காக ‘நினைவுகூருங்கள்’ மீண்டும் வழங்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அனைத்தும் தொடர்புடைய முதன்மை உரையில் இடம்பெற்றுள்ளன.
