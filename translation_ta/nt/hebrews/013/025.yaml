  source_fidelity: மூலக் கிரேக்கத்தின் ἡ χάρις μετὰ πάντων ὑμῶν என்ற சுருக்கமான நிறைவு ஆசிவாக்கியத்தைத் துல்லியமாக வெளிப்படுத்துகிறது. «கிருபை» χάριஸுக்கும், «உங்கள் அனைவரோடும்» πάντων ὑμῶν-இன் முழுமையான உள்ளடக்கத்துக்கும், «இருப்பதாக» தமிழில் இயல்பாகத் தரப்பட்டுள்ள ஆசிவடிவத்துக்கும் பொருந்துகின்றன.
  naturalness: «கிருபை உங்கள் அனைவரோடும் இருப்பதாக» என்பது நவீனத் தரநிலைத் தமிழில் கண்ணியமான, சுருக்கமான வேதாகமக் கடித நிறைவு வாழ்த்தாக இயல்பாக உள்ளது.
  terminology: «கிருபை» என்பது இவ்வகை கிறிஸ்தவ ஆசிவாக்கியங்களில் நிலைபெற்றதும் பொருத்தமானதுமான சொல்லாகும். பெயர்கள், சர்ச்சைக்குரிய வாசக வேறுபாடுகள், அல்லது அடிக்குறிப்பு தேவைப்படும் கூறுகள் இவ்வசனத்தில் இல்லை.
