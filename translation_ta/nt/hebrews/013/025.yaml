  text: Grace be with all of you.
translation:
  language: ta
  text: கிருபை உங்கள் அனைவரோடும் இருப்பதாக.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ χάρις
  choice: கிருபை
  rationale: கிறிஸ்தவக் கடித நிறைவு வாழ்த்தில் χάρις குறிக்கும் இறையருளைத் துல்லியமாகவும், நவீனத் தமிழ் வேதாகம நடையில் இயல்பாகவும் வெளிப்படுத்துகிறது. கிரேக்க மொழியின் வரையறைச் சுட்டை தமிழில் தனியே மொழிபெயர்க்கத் தேவையில்லை.
- source_word: μετὰ
  choice: இருப்பதாக
  rationale: μετά என்பது இங்கு ‘உடன்/ஓடு’ என்ற பொருளுடையது. வினைச்சொல் விடுபட்டுள்ள கிரேக்க ஆசிவாக்கியத்தைத் தமிழில் இயல்பாகக் கூற, ‘உங்கள் அனைவரோடும்’ என்பதுடன் ‘இருப்பதாக’ சேர்க்கப்பட்டுள்ளது.
- source_word: πάντων ὑμῶν
  choice: உங்கள் அனைவரோடும்
  rationale: πάντων என்பது கடிதம் பெறும் முழுக் குழுவையும் வெளிப்படையாக உள்ளடக்குகிறது; ‘உங்கள் அனைவரோடும்’ என்பது அந்த முழுமையையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions: []
translation_notes:
  register: சுருக்கமான, கண்ணியமான நவீனத் தமிழ் ஆசிவாக்கிய நடை. ‘கிருபை’ என்ற பரவலாக அறியப்பட்ட வேதாகமச் சொல் தக்கவைக்கப்பட்டுள்ளது; மூலத்தின் வினையற்ற ஆசிவாக்கியம் தமிழில் தெளிவாக அமைய ‘இருப்பதாக’ வழங்கப்பட்டுள்ளது.
