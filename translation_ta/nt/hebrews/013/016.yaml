id: HEB.13.16
reference: Hebrews 13:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τῆς δὲ εὐποιΐας καὶ κοινωνίας μὴ ἐπιλανθάνεσθε, τοιαύταις γὰρ θυσίαις εὐαρεστεῖται ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/016.yaml
  text: And do not neglect doing good and sharing[b][a], for with such sacrifices God is pleased.
translation:
  language: ta
  text: நன்மை செய்வதையும், பகிர்ந்துகொள்வதையும்[b] மறந்துவிடாதீர்கள்[a]; ஏனெனில் இப்படிப்பட்ட பலிகளால் கடவுள் மகிழ்ச்சியடைகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “புறக்கணிக்காதீர்கள்.” கிரேக்கச் சொல்லின் நேரடிப் பொருள் “மறந்துவிடாதீர்கள்”; இச்சூழலில் இச்செயல்களைச் செய்யத் தவறாதீர்கள் என்ற நடைமுறைப் பொருளையும் தருகிறது.
    reason: lexical_alternative
  - marker: b
    text: “பகிர்ந்துகொள்வது” என்பதை “கூட்டுறவு” அல்லது “தாராளமாக வழங்குவது” என்றும் மொழிபெயர்க்கலாம். இச்சூழலில், தமக்குள்ள வளங்களைப் பிறரோடு நடைமுறையில் பகிர்வதையே பெரும்பாலும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐποιΐας
  choice: நன்மை செய்வது
  rationale: செயல்முறையான நன்மையையும் பிறருக்கு நன்மை பயக்கும் செயல்களையும் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: κοινωνίας
  choice: பகிர்ந்துகொள்வது
  rationale: இச்சூழலில் வெறும் உறவொன்றிப்பை விட, வளங்களையும் உடைமைகளையும் பிறரோடு நடைமுறையில் பகிர்வதைக் குறிக்கிறது; அதேவேளை பொருளுதவி என்று மிகக் குறுகலாக்கவில்லை.
- source_word: μὴ ἐπιλανθάνεσθε
  choice: மறந்துவிடாதீர்கள்
  rationale: கிரேக்க வினையின் நேரடியான பொருளைத் தக்கவைக்கிறது; இங்கு இச்செயல்களைச் செய்யத் தவறாதீர்கள் என்ற நடைமுறை வலியுறுத்தலையும் சூழல் அளிக்கிறது.
- source_word: τοιαύταις ... θυσίαις
  choice: இப்படிப்பட்ட பலிகளால்
  rationale: நன்மை செய்வதையும் பகிர்வதையும் கடவுளுக்குப் பிரியமான பலிகளாக ஒப்பிடும் வழிபாட்டு உருவகத்தைப் பாதுகாக்கிறது.
- source_word: εὐαρεστεῖται
  choice: மகிழ்ச்சியடைகிறார்
  rationale: கடவுள் இத்தகைய பலிகளில் மகிழ்கிறார் என்ற பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ὁ θεός
  choice: கடவுள்
  rationale: நவீன பொதுத்தமிழில் θεός என்பதற்கான தெளிவான, பிரிவுசார்பற்ற வழக்கமான மொழிபெயர்ப்பு.
- source_word: δὲ
  choice: —
  rationale: δέ இங்கு மென்மையான தொடர்ச்சியைச் சுட்டுகிறது; தமிழில் தனிச் சேர்ப்புச் சொல் இன்றியே முந்தைய அறிவுறுத்தலோடு இயல்பாகத் தொடர்கிறது.
theological_decisions:
- issue: ‘பலிகள்’ என்பதன் தன்மை
  choice: நன்மை செய்வதும் பகிர்ந்துகொள்வதும் கடவுளை மகிழ்விக்கும் பலிகள் என்ற உருவகப் பொருள்
  alternative: இதைத் தர்மம் கொடுப்பதற்கு மட்டும் உரிய வழிபாட்டு மாற்றீடாகவோ, பலி உருவகமற்ற பொதுவான நன்னடத்தையாகவோ வாசித்தல்
  rationale: θυσίαις என்ற சொல் பலி உருவகத்தை வெளிப்படையாகக் கொண்டுள்ளது. மொழிபெயர்ப்பு அதைத் தக்கவைத்து, பொருளுதவிக்கு மட்டும் குறுக்காமலும் வெறும் ஒழுக்க அறிவுரையாகத் தட்டையாக்காமலும் உள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் எளிமையும் கொண்ட அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘பலிகள்’ என்ற வேதாகம வழிபாட்டு உருவகம் நேரடியாகப் பாதுகாக்கப்பட்டுள்ளது; அடிக்குறி குறிகள் அவை விளக்கும் சொற்றொடர்களின் உடனடிப் பின்பு வைக்கப்பட்டுள்ளன.
