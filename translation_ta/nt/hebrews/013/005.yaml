source:
  edition: SBLGNT
  text: ἀφιλάργυρος ὁ τρόπος· ἀρκούμενοι τοῖς παροῦσιν· αὐτὸς γὰρ εἴρηκεν· Οὐ μή σε ἀνῶ οὐδ’ οὐ μή σε ⸀ἐγκαταλίπω·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/005.yaml
  text: Let your way of life be free from the love of money[a], being content with what you have, for he himself has said, “I will never leave you[b], nor will I ever forsake you.”
translation:
  language: ta
  text: 'உங்கள் வாழ்க்கை முறை பண ஆசையற்றதாக இருக்கட்டும்; உங்களிடம் இருப்பவற்றில் மனநிறைவோடு இருங்கள்.[a] ஏனெனில், அவரே சொல்லியிருக்கிறார்: “நான் ஒருபோதும் உன்னை விட்டுவிடமாட்டேன்;[b] உன்னைக் கைவிடவும் மாட்டேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “தற்போது உள்ளவற்றில் மனநிறைவோடு இருங்கள்.” இது தற்போதைய உடைமைகளையும் சூழ்நிலைகளையும் உள்ளடக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இந்த வாக்குறுதி பழைய ஏற்பாட்டின் உடன்படிக்கை சார்ந்த உறுதிமொழிகளை, குறிப்பாக உபாகமம் 31:6, 8 மற்றும் யோசுவா 1:5 ஆகியவற்றை எதிரொலிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: ἀφιλάργυρος
  choice: பண ஆசையற்றதாக
  rationale: பணத்தை நேசிப்பதால் ஆளப்படாத நிலையைத் தெளிவாகக் குறிக்கிறது; பொதுவான ‘பேராசை’ என்பதைவிட மூலத்தின் பணம் சார்ந்த குறிப்பைத் தக்கவைக்கிறது.
- source_word: ὁ τρόπος
  choice: உங்கள் வாழ்க்கை முறை
  rationale: ஒருவரின் நடத்தை அல்லது வாழும் விதத்தைக் குறிக்கும் இச்சொற்றொடரை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀρκούμενοι
  choice: மனநிறைவோடு இருங்கள்
  rationale: தொடர்ந்து நிலவும் திருப்தியான மனப்பாங்கைக் குறிக்கும் பங்கேற்புவினையின் அறிவுறுத்தல் வலிமையை இயல்பான தமிழ் கட்டளையாக வழங்குகிறது.
- source_word: τοῖς παροῦσιν
  choice: உங்களிடம் இருப்பவற்றில்
  rationale: சொல்லுக்குச் சொல் ‘தற்போது உள்ளவற்றில்’ என்றாலும், இச்சூழலில் தற்போதைய உடைமைகள் அல்லது வசதிகளைக் குறிக்கும் பொருளை இயல்பாகத் தருகிறது.
- source_word: αὐτὸς γὰρ εἴρηκεν
  choice: ஏனெனில், அவரே சொல்லியிருக்கிறார்
  rationale: αὐτός என்பதன் வலியுறுத்தலையும், εἴρηκεν என்ற நிறைவுவினையின் தொடர்ந்து செல்லுபடியாகும் சொல்லையும் தக்கவைக்கிறது; மூலத்தில் இல்லாத ‘கடவுள்’ என்ற பெயரைச் சேர்க்கவில்லை.
- source_word: Οὐ μή σε ἀνῶ
  choice: நான் ஒருபோதும் உன்னைக் கைவிடமாட்டேன்
  rationale: οὐ μή என்ற வலுவான மறுப்பை ‘ஒருபோதும் ... மாட்டேன்’ எனத் தெளிவாக வெளிப்படுத்துகிறது; ἀνίημι என்பதற்கு இச்சூழலில் இயல்பான தமிழ் ‘கைவிடுதல்’ ஆகும்.
- source_word: οὐδ’ οὐ μή σε ἐγκαταλίπω
  choice: உன்னை ஒருபோதும் புறக்கணித்துவிடவும் மாட்டேன்
  rationale: ἐγκαταλείπω என்பதன் விட்டுச்செல்லுதல் அல்லது ஆதரவின்றி கைவிடுதல் என்ற பொருளை வழங்கி, முதல் வினையுடனான வேறுபாட்டை ஓரளவு காக்கிறது; மீண்டும் வரும் οὐ μή-யின் வலிமையையும் தக்கவைக்கிறது.
theological_decisions:
- issue: மேற்கோளில் பேசுகிறவரின் அடையாளம்
  choice: ‘அவரே’ என்று மூலத்திலுள்ள சுட்டுப்பெயரைத் தக்கவைத்தல்
  alternative: ‘கடவுளே சொல்லியிருக்கிறார்’
  rationale: சூழல் பேசுகிறவர் கடவுள் என்பதை உணர்த்தினாலும், கிரேக்கத்தில் θεός இல்லை; எனவே வெளிப்படையாக இல்லாத பெயரை முதன்மை உரையில் சேர்க்காமல் மூலத்தின் வடிவத்தைப் பாதுகாக்கிறது.
- issue: மேற்கோளிலுள்ள வலியுறுத்தப்பட்ட இரட்டை மறுப்புகள்
  choice: இரு வாக்கியங்களிலும் ‘ஒருபோதும் ... மாட்டேன்’
  alternative: ‘நிச்சயமாகக் கைவிடவோ புறக்கணிக்கவோ மாட்டேன்’
  rationale: இருமுறை வரும் οὐ μή கட்டமைப்பின் உறுதியான வாக்குறுதியை இயல்பான தமிழில் வலிமையாக வெளிப்படுத்துகிறது; செயற்கையான மறுப்புத் திருப்புகளைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘பண ஆசை’, ‘மனநிறைவு’ போன்ற வழக்கமான சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன. மேற்கோளின் உடன்படிக்கைத் தொனியும் வலியுறுத்தப்பட்ட மறுப்பும் காக்கப்பட்டுள்ளன.
