revisions:
- from: மெசியாவாகிய இயேசு நேற்றும் இன்றும் என்றென்றும் மாறாதவராக இருக்கிறார்[a].
  to: மெசியாவாகிய இயேசு நேற்றும் இன்றும் என்றென்றும் ஒரேவராகவே இருக்கிறார்[a].
  rationale: The revision replaces the interpretive «மாறாதவராக» with «ஒரேவராகவே», which directly reflects ὁ αὐτός (“the same”) while remaining natural in modern Tamil. The title rendering, repeated temporal linkage, and alternative-title footnote are retained.
