source:
  edition: SBLGNT
  text: Ἰησοῦς Χριστὸς ἐχθὲς καὶ σήμερον ὁ αὐτός, καὶ εἰς τοὺς αἰῶνας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/008.yaml
  text: Jesus the Messiah is the same yesterday and today and forever[a].
translation:
  language: ta
  text: மெசியாவாகிய இயேசு நேற்றும் இன்றும் என்றென்றும் ஒரேவராகவே இருக்கிறார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்துவாகிய இயேசு நேற்றும் இன்றும் என்றென்றும் ஒரேவராகவே இருக்கிறார்.” கிரேக்கப் பட்டமான Χριστός என்பதை “கிறிஸ்து” என்று ஒலிபெயர்க்கலாம் அல்லது “மெசியா” என்று மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰησοῦς
  choice: இயேசு
  rationale: இயேசுவின் தனிப்பெயருக்கான தமிழில் நிலைபெற்ற வடிவம்.
- source_word: Χριστὸς
  choice: மெசியாவாகிய
  rationale: Χριστός என்பதை ஒரு குடும்பப்பெயராகக் காட்டாமல், இயேசுவின் மெசியா பணியைச் சுட்டும் பட்டமாக இயல்பான தமிழில் மொழிபெயர்க்கிறது.
- source_word: ἐχθὲς
  choice: நேற்றும்
  rationale: கிரேக்கத்தின் நேரடிப் பொருளான ‘நேற்று’ என்பதையும் தொடரின் இணைப்பையும் காக்கிறது.
- source_word: σήμερον
  choice: இன்றும்
  rationale: கிரேக்கத்தின் நேரடிப் பொருளான ‘இன்று’ என்பதையும் காலத் தொடரின் ஓசையையும் காக்கிறது.
- source_word: ὁ αὐτός
  choice: மாறாதவராக இருக்கிறார்
  rationale: ‘அதேவர்’ என்ற கிரேக்கப் பொருளை நவீன தமிழில் இயல்பாக வெளிப்படுத்தி, காலங்களினூடே இயேசுவின் நிலைத்த தன்மையைச் சொல்கிறது.
- source_word: εἰς τοὺς αἰῶνας
  choice: என்றென்றும்
  rationale: முடிவில்லாத காலத்தைக் குறிக்கும் கிரேக்க மரபுத்தொடரின் தெளிவான, இயல்பான தமிழ் வடிவம்.
- source_word: καὶ ... καὶ ... καὶ
  choice: -உம் ... -உம் ... -உம்
  rationale: கிரேக்கத்தில் மீண்டும் வரும் இணைப்புச் சொற்களின் தாளத்தையும் வலியுறுத்தலையும் தமிழின் இணைப்பு விகுதிகளால் காக்கிறது.
theological_decisions:
- issue: இயேசுவின் காலங்கடந்த நிலைத்த தன்மை குறித்த கிறிஸ்தியல் வலிமை
  choice: இயேசு எல்லாக் காலங்களிலும் மாறாதவராக இருக்கிறார் என்று வசனம் கூறுவதையே நேரடியாக மொழிபெயர்த்தல்
  alternative: இதனை இயேசுவின் தெய்வீகம் அல்லது மாறாத்தன்மை பற்றிய விரிவான கோட்பாட்டு விளக்கமாக மொழிபெயர்த்தல்
  rationale: கிரேக்க வாசகம் இயேசுவின் தொடர்ந்த ஒரே தன்மையை உறுதிப்படுத்துகிறது; ஆனால் அது கூறுவதற்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்க்கவில்லை.
- issue: Χριστός என்பதன் பட்டப்பெயர் தன்மை
  choice: மெசியாவாகிய
  alternative: கிறிஸ்துவாகிய
  rationale: Χριστός என்பது ‘அபிஷேகம் செய்யப்பட்டவர்/மெசியா’ என்ற பட்டம் என்பதை முதன்மை உரையில் தெளிவாக்கி, தமிழில் பரவலாக அறியப்பட்ட ‘கிறிஸ்து’ வடிவத்தை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மாறாதவராக இருக்கிறார்’ என்பது மரபுவழி தமிழில் உள்ள கடினமான ‘அதேவராயிருக்கிறார்’ என்பதைக் காட்டிலும் இயல்பானது; அதேவேளையில் கிரேக்கத்தின் ὁ αὐτός குறிக்கும் காலங்களினூடான நிலைத்த ஒரே தன்மையைப் பாதுகாக்கிறது.
