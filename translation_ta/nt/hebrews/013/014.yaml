revisions:
- from: ஏனெனில், இங்கே நிலைத்திருக்கும் நகரம் நமக்கு இல்லை; வரவிருக்கும் நகரத்தையே நாம் தேடுகிறோம்.
  to: ஏனெனில், இங்கே நமக்கு நிலைத்திருக்கும் நகரம் இல்லை; மாறாக, வரவிருக்கும் நகரத்தை நாம் நாடுகிறோம்.
  rationale: 'The revision explicitly renders ἀλλά with ‘மாறாக’ while retaining the source’s city imagery, its non-specific ‘here,’ and the future orientation of τὴν μέλλουσαν. No footnote is needed: repeating ‘நகரம்’ is idiomatic Tamil and makes the implied noun clear without adding interpretation.'
  reviewer_model: gpt-5.6-terra
