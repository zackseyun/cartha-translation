id: HEB.13.14
reference: Hebrews 13:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐ γὰρ ἔχομεν ὧδε μένουσαν πόλιν, ἀλλὰ τὴν μέλλουσαν ἐπιζητοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/014.yaml
  text: For we do not have a lasting city here[a], but we seek the one that is to come.
translation:
  language: ta
  text: ஏனெனில், இங்கே நமக்கு நிலைத்திருக்கும் நகரம் இல்லை; மாறாக, வரவிருக்கும் நகரத்தை நாம் நாடுகிறோம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ γὰρ
  choice: ஏனெனில் ... இல்லை
  rationale: γάρ முந்தைய அறிவுறுத்தலுக்கான காரணத்தையோ விளக்கத்தையோ இணைக்கிறது; οὐ மறுப்பைத் தெளிவாகக் குறிக்கிறது.
- source_word: ἔχομεν
  choice: நமக்கு ... இல்லை
  rationale: தமிழில் உடைமையைக் குறிக்கும் இயல்பான வாக்கிய அமைப்பு; கிரேக்கத்தின் முதல் நபர் பன்மையையும் நிகழ்காலத்தையும் காக்கிறது.
- source_word: ὧδε
  choice: இங்கே
  rationale: இடத்தைச் சுட்டும் அடைவினையின் நேரடியான பொருள். ‘பூமியில்’ என்று மொழிபெயர்ப்பது சூழலிலிருந்து பெறப்படும் விளக்கத்தை உரைக்குள் சேர்த்துவிடும்.
- source_word: μένουσαν
  choice: நிலைத்திருக்கும்
  rationale: πόλιν என்பதைக் குறிப்பதான நிகழ்காலச் செயப்பெயரெச்சம், தொடர்ந்து நிலைத்திருப்பதையோ நீடிப்பதையோ குறிக்கிறது.
- source_word: πόλιν
  choice: நகரம்
  rationale: உருவகத்தை விரிவாக்கி ‘தாயகம்’ அல்லது ‘பரலோகம்’ என்று விளக்காமல், மூலத்தின் தெளிவான பெயர்ச்சொல் காக்கப்படுகிறது.
- source_word: ἀλλὰ
  choice: ஆனால் என்ற தனிச்சொல்லுக்குப் பதிலாக அரைப்புள்ளிக்குப் பின் எதிர்மறை மையப்படுத்தல்
  rationale: தமிழில் ‘இல்லை; ... நகரத்தையே’ என்ற அமைப்பு வலுவான மாறுபாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὴν μέλλουσαν
  choice: வரவிருக்கும் நகரத்தை
  rationale: பெண்பால் செயப்பெயரெச்சம் πόλιν என்பதைக் குறிப்பதால், தமிழில் பெயர்ச்சொல்லை மீண்டும் கூறுவது தெளிவாகவும் இயல்பாகவும் உள்ளது; எதிர்கால நோக்கமும் காக்கப்படுகிறது.
- source_word: ἐπιζητοῦμεν
  choice: நாம் தேடுகிறோம்
  rationale: தொடர்ந்து நாடுதல் அல்லது தேடுதல் என்ற பொருளை எளிய, இயல்பான தமிழில் தருகிறது; மூலத்தில் வெளிப்படையாக இல்லாத தீவிரத்தைக் குறிக்கும் வினையடையைச் சேர்க்கவில்லை.
theological_decisions:
- issue: ‘நகரம்’ என்ற உருவகத்தின் இயல்பு
  choice: ‘நகரம்’ என்ற மூல உருவகத்தையும், அது வரவிருக்கிறது என்ற எதிர்கால நோக்கத்தையும் அப்படியே வைத்தல்
  alternative: ‘பரலோகம்,’ ‘பரலோக நகரம்,’ அல்லது ‘பரலோக எருசலேம்’ என்று வெளிப்படையாக அடையாளப்படுத்துதல்
  rationale: இந்த வசனம் நகரத்தைப் பற்றியே பேசுகிறது; பரலோகம் அல்லது எருசலேம் என்று பெயரிடவில்லை. எபிரெயர் நூலின் பிற பகுதிகள் அந்தத் தொடர்பை வளர்த்தாலும், இங்கு உரை கூறாத அடையாளத்தை மொழிபெயர்ப்பில் சேர்க்காமல் அதன் உருவகத் திறப்பையும் இறையியல் அழுத்தத்தையும் காக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு தெளிவான, கண்ணியமான நடை. ‘இங்கே’ என்பதைக் ‘பூமியில்’ என்று விளக்கவில்லை. ‘வரவிருக்கும் நகரத்தையே’ என்ற மையப்படுத்தல் οὐ ... ἀλλά எனும் எதிர்மறையை இயல்பாகத் தெரிவிக்கிறது.
