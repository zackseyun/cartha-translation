    issue: “ஆண்டவரே” is wrongly inflected as a vocative.
    rationale: 'The Greek Κύριος is nominative, not vocative, and is the subject of βοηθός: “The Lord is my helper.” The Tamil vocative changes the syntax into a direct address and leaves the assertion structurally incomplete.'
