source:
  edition: SBLGNT
  text: ὥστε θαρροῦντας ἡμᾶς λέγειν· Κύριος ἐμοὶ βοηθός, ⸀οὐ φοβηθήσομαι· τί ποιήσει μοι ἄνθρωπος;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/006.yaml
  text: so that we confidently say[a], “The Lord is my helper; I will not be afraid[b]. What can man do to me?”
translation:
  language: ta
  text: ஆகவே, நாம் துணிவுடன், “ஆண்டவர் எனக்குத் துணை; நான் அஞ்சமாட்டேன். மனிதன்[b] எனக்கு என்ன செய்ய முடியும்?[a]” என்று சொல்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் நேரடியான வடிவில்: “மனிதன் எனக்கு என்ன செய்வான்?”'
    reason: lexical_alternative
  - marker: b
    text: இங்கே “மனிதன்” என்பது கிரேக்கத்தில் ஒருமையில் வரும் ἄνθρωπος என்ற சொல்லை மொழிபெயர்க்கிறது; அது ஆணை மட்டும் குறிக்காமல், மனிதரைப் பொதுவாகப் பிரதிநிதித்துவ முறையில் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: ὥστε
  choice: ஆகவே
  rationale: முந்தைய கூற்றிலிருந்து வரும் விளைவு அல்லது முடிவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: θαρροῦντας ἡμᾶς λέγειν
  choice: நாம் துணிவுடன் … என்று சொல்கிறோம்
  rationale: θαρροῦντας என்பதன் தைரியம் மற்றும் நம்பிக்கையுடனான மனநிலையைப் பாதுகாத்து, கிரேக்க வினையெச்ச–வினையெச்சப்பெயர் அமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: Κύριος
  choice: ஆண்டவர்
  rationale: தெய்வீகப் பட்டமாகவும் பழைய ஏற்பாட்டு மேற்கோளின் எதிரொலியோடும் இயல்பாகப் பொருந்துகிறது.
- source_word: ἐμοὶ βοηθός
  choice: எனக்குத் துணை
  rationale: ἐμοὶ என்பதன் ‘எனக்காக/என் சார்பாக’ என்ற உறவையும் βοηθός என்பதன் உதவிக்கு வருபவர் என்ற தனிப்பட்ட பொருளையும் சுருக்கமான இயல்பான தமிழில் தருகிறது.
- source_word: οὐ φοβηθήσομαι
  choice: நான் அஞ்சமாட்டேன்
  rationale: எதிர்கால வடிவையும் உறுதியான மறுப்பையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: τί ποιήσει μοι ἄνθρωπος
  choice: மனிதன் எனக்கு என்ன செய்ய முடியும்?
  rationale: ποιήσει இலக்கணப்படி எதிர்காலமானாலும், இவ்வினா மனித அச்சுறுத்தலின் வரம்பை வலியுறுத்தும் சொல்லாட்சிசார் வினா. ‘செய்ய முடியும்’ என்பது அந்த உட்பொருளை இயல்பான தமிழில் தருகிறது; நேரடியான எதிர்கால வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: ἄνθρωπος என்ற ஒருமை பொதுப்பெயரின் பொருள்
  choice: மனிதன்
  alternative: ஒரு மனிதர் / எவரும்
  rationale: ‘மனிதன்’ என்பது ஆண் ஒருவரை மட்டும் அல்லாமல் மனிதரைப் பொதுவாகக் குறிக்கக்கூடிய தமிழ்ச் சொல்; கிரேக்க ஒருமை பிரதிநிதித்துவ வடிவத்தையும் காக்கிறது. உள்ளடக்கிய பொருள் அடிக்குறிப்பில் தெளிவாக்கப்படுகிறது.
- issue: ποιήσει என்ற எதிர்காலத்தின் சொல்லாட்சிசார் வலிமை
  choice: என்ன செய்ய முடியும்?
  alternative: என்ன செய்வான்?
  rationale: இது மனிதனால் ஏற்படுத்தக்கூடிய இறுதி அச்சுறுத்தலை மறுக்கும் சொல்லாட்சிசார் வினா. ‘முடியும்’ என்பது அந்த வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; இலக்கண ரீதியான எதிர்கால மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம மேற்கோளுக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘ஆண்டவர்,’ ‘துணை,’ ‘அஞ்சமாட்டேன்’ ஆகியவை உயர்வானதாயினும் இயல்பான சொற்களாகத் தேர்ந்தெடுக்கப்பட்டன.
