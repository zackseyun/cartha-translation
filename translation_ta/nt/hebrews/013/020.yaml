lexical_decisions:
- source_word: Ὁ δὲ
  choice: சமாதானத்தின் கடவுள்
  rationale: δέ இங்கு அறிவுரைகளிலிருந்து ஆசீர்வாத வேண்டுதலுக்கு மாறுவதைக் குறிக்கும் மென்மையான இணைப்புச்சொல். தமிழில் தனியாக ‘இப்போது’ அல்லது ‘ஆனால்’ சேர்ப்பது தேவையற்ற கால அல்லது எதிர்மறை நிழலை உண்டாக்கும்; வாக்கிய ஓட்டத்திலேயே மாற்றம் இயல்பாகத் தெரிகிறது.
- source_word: θεὸς τῆς εἰρήνης
  choice: சமாதானத்தின் கடவுள்
  rationale: இறைவன் சமாதானத்தால் சிறப்பிக்கப்படுவதையும் சமாதானத்தின் ஊற்றாக இருப்பதையும் குறிக்கும் இயல்பான பெயரெச்சத் தொடர்பைத் தக்கவைக்கிறது.
- source_word: ὁ ἀναγαγὼν ἐκ νεκρῶν
  choice: இறந்தோரிலிருந்து எழுப்பினார்
  rationale: உயிர்த்தெழுதல் சூழலில் ἀνάγω என்பதன் ‘மேலே கொண்டுவருதல்/எழுப்புதல்’ கருத்தை நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் தருகிறது; ἐκ νεκρῶν என்பதையும் பன்மைத் தன்மையுடன் பிரதிபலிக்கிறது.
- source_word: τὸν ποιμένα τῶν προβάτων τὸν μέγαν
  choice: ஆடுகளின் பெரிய மேய்ப்பர்
  rationale: மேய்ப்பர் உருவகத்தையும் πρόβατα என்பதன் நேரடியான ‘ஆடுகள்’ பொருளையும், μέγας தரும் சிறப்பையும் தக்கவைக்கிறது.
- source_word: ἐν αἵματι
  choice: இரத்தத்தினால்
  rationale: ἐν இங்கு கருவி அல்லது அடிப்படை உறவைக் குறிக்கக்கூடும். ‘இரத்தத்தினால்’ என்பது அந்த உறவைச் சுருக்கமாகக் காட்டுகிறது; ஆனால் அதன் இலக்கணத் தொடர்பிலுள்ள ஐயத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: διαθήκης αἰωνίου
  choice: நித்திய உடன்படிக்கையின்
  rationale: எபிரெயர் நூலின் உடன்படிக்கைச் சூழலில் διαθήκη என்பதற்கு ‘உடன்படிக்கை’ பொருத்தமானது. αἰώνιος என்பதன் நீடித்த, முடிவில்லாத தன்மையை ‘நித்திய’ தருகிறது; கிரேக்கத்தில் சுட்டுப்பெயருரை இல்லாததால் தமிழிலும் தேவையற்ற ‘அந்த’ சேர்க்கப்படவில்லை.
- source_word: τὸν κύριον ἡμῶν Ἰησοῦν
  choice: நம் ஆண்டவர் இயேசுவை
  rationale: இயேசுவை எழுப்பப்பட்டவராக அடையாளப்படுத்தும் கிரேக்கத் தொடரை இயல்பான தமிழ்ச் சொல்வரிசையில் வழங்குகிறது; κύριος ‘ஆண்டவர்’ என மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: ἐν αἵματι διαθήκης αἰωνίου என்ற சொற்றொடரின் இலக்கணத் தொடர்பு
  choice: ‘நித்திய உடன்படிக்கையின் இரத்தத்தினால்’ என்பதை கடவுள் இயேசுவை எழுப்பிய செயலோடு முதன்மையாக இணைத்தல்
  alternative: அதை ‘ஆடுகளின் பெரிய மேய்ப்பர்’ என்பதோடு முதன்மையாக இணைத்து, ‘நித்திய உடன்படிக்கையின் இரத்தத்தோடு/இரத்தத்தினால் பெரிய மேய்ப்பரானவர்’ என வாசித்தல்
  rationale: கிரேக்கச் சொல்வரிசை இரு தொடர்புகளுக்கும் இடமளிக்கிறது. முதன்மை உரை இறைச் செயலோடு கருவியுறவாக இணைக்கும் இயல்பான வாசிப்பை அளிக்கிறது; அடிக்குறிப்பு மாற்று இலக்கணத் தொடர்பைத் தெரிவித்து, உயிர்த்தெழுதலுக்கும் உடன்படிக்கை இரத்தத்துக்கும் இடையிலான உறவை கோட்பாட்டு விரிவுரையால் மிகுதியாக வரையறுக்காமல் விடுகிறது.
- issue: வசனம் 20 தனித்து வழங்கப்படும்போது வினைமுற்றின் வடிவம்
  choice: ‘எழுப்பினார்’ என்று உறுதிப்பாட்டு வினையாக வழங்கி, முழு ஆசீர்வாத வேண்டுதல் அடுத்த வசனத்தில் தொடர்வதை மறைமுகமாக விடுதல்
  alternative: அடுத்த வசனத்தின் வேண்டுதல் வினையோடு இணைத்து ‘... கடவுள் உங்களைத் தகுதிப்படுத்துவாராக’ என்ற முழுத் தொடராக மொழிபெயர்த்தல்
  rationale: கொடுக்கப்பட்ட பகுதி வசனம் 20-இல் முடிவதால், தமிழில் தொங்கும் பெயரெச்சத் தொடரைத் தவிர்க்க வினை இயல்பாக்கப்பட்டுள்ளது. இருப்பினும் கிரேக்கத்தில் ἀναγαγών ஒரு பெயரெச்ச வினை வடிவமாக இருந்து, பிரதான வேண்டுதல் வசனம் 21-இல் வருவது பதிப்பு சூழலில் கவனிக்கப்பட வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையில் வடிவமைக்கப்பட்டது. ‘கடவுள்’, ‘ஆண்டவர்’, ‘மேய்ப்பர்’, ‘உடன்படிக்கை’ ஆகியவை தெளிவான வேதாகமச் சொற்களாகப் பயன்படுத்தப்பட்டுள்ளன. வசனம் தனியே காட்டப்படுவதால் நிறுத்தற்குறியாக அரைப்புள்ளி வைக்கப்பட்டுள்ளது; இதன் மூலம் அடுத்த வசனத்தோடு தொடரும் ஆசீர்வாத வேண்டுதல் சுட்டப்படுகிறது.
