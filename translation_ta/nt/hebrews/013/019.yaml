  source_fidelity: வரைவில் ἀποκατασταθῶ என்பதன் செயப்பாட்டு, சூழ்நிலையைக் குறிப்பிடாத ‘மீள்சேர்க்கப்படுதல்’ பொருள் காக்கப்பட்டுள்ளது. ஆனால் நோக்கத் தொடரின் சொல் வரிசை தமிழில் சற்றே கனமாக உள்ளது. திருத்தம், ‘இதைச் செய்ய’ என்பதை வேண்டுகோளுக்கு அருகில் வைத்து, எழுத்தாளர் வாசகர்களோடு மீண்டும் இணைக்கப்பட வேண்டும் என்ற நோக்கத்தைத் தெளிவாகச் சொல்கிறது. τάχιον-இன் ஒப்பீட்டு வலிமையும் ‘இன்னும் விரைவில்’ எனத் தக்கவைக்கப்பட்டுள்ளது.
