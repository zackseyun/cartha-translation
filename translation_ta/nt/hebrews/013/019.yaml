  yaml_path: translation/nt/hebrews/013/019.yaml
  text: And I urge you all the more to do this[a], so that I may be restored to you sooner.
translation:
  language: ta
  text: மேலும், இதைச் செய்ய நான் உங்களை இன்னும் அதிகமாக வேண்டிக்கொள்கிறேன்; நான் இன்னும் விரைவில் உங்களோடு மீண்டும் சேர்க்கப்படுவதற்காக[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களிடம் திரும்பி வருவதற்காக.” கிரேக்கச் சொல், எழுத்தாளர் எந்தச் சூழ்நிலையில் இருக்கிறார் என்பதைத் துல்லியமாகக் குறிப்பிடாமல், வாசகர்களோடு அவர் மீண்டும் சேர்க்கப்படுவதையோ அவர்களிடம் திரும்புவதையோ பொதுவாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: περισσοτέρως
  choice: இன்னும் அதிகமாக
  rationale: வேண்டுகோளின் தீவிரத்தை உயர்த்தும் ஒப்பீட்டு வினையடையின் பொருளை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: δὲ
  choice: மேலும்
  rationale: இங்கு வலுவான எதிர்மறைத் தொடர்பு இல்லாமல், முந்தைய வேண்டுகோளோடு இவ்வாக்கியத்தை மென்மையாக இணைக்கிறது.
- source_word: παρακαλῶ
  choice: வேண்டிக்கொள்கிறேன்
  rationale: சூழலில் உள்ள உருக்கமான வேண்டுகோளை இயல்பாக வெளிப்படுத்துகிறது; வெறும் கேட்டலைவிட வலிமையானது, ஆனால் கட்டளையாக ஒலிப்பதில்லை.
- source_word: τοῦτο ποιῆσαι
  choice: இதைச் செய்யுமாறு
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட ஜெப வேண்டுகோளைச் சுட்டும் τοῦτο என்பதன் பின்னோக்குச் சுட்டலைத் தெளிவாகக் காக்கிறது.
- source_word: ἵνα
  choice: …படி
  rationale: எழுத்தாளர் முன்வைக்கும் நோக்கத்தைத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τάχιον
  choice: இன்னும் விரைவில்
  rationale: ஒப்பீட்டுப் பொருளான ‘sooner’ என்பதைத் தக்கவைக்கிறது; வெறும் ‘விரைவில்’ என்று சமப்படுத்தவில்லை.
- source_word: ἀποκατασταθῶ
  choice: மீண்டும் சேர்க்கப்படும்படி
  rationale: கிரேக்கச் சொல்லின் செயப்பாட்டு வடிவத்தையும், வாசகர்களிடம் மீண்டும் கொண்டுவரப்படுதல் அல்லது அவர்களோடு மீண்டும் இணைக்கப்படுதல் என்ற பரந்த உறவுசார் பொருளையும் காக்கிறது.
- source_word: ὑμῖν
  choice: உங்களிடம்
  rationale: பன்மை வாசகர்களை நோக்கிய திசை அல்லது உறவை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: எழுத்தாளர் எதிர்பார்க்கும் மீள்சேர்க்கையின் சரியான சூழ்நிலை
  choice: சிறை விடுதலை, நோயிலிருந்து மீட்பு, பயணத்திலிருந்து திரும்புதல் என எந்த ஒரு சூழ்நிலையையும் குறிப்பிடாமல், வாசகர்களிடம் மீண்டும் சேர்க்கப்படுதல் என்ற பொதுவான பொருள்
  alternative: சிறையிலிருந்து விடுதலையாகி அவர்களிடம் திரும்புதல்; பிரிவுக்குப் பின் பயணத்திலிருந்து திரும்புதல்; அவர்களிடையே ஊழியத்துக்கு மீட்டளிக்கப்படுதல்
  rationale: ἀποκατασταθῶ ὑμῖν என்பது வாசகர்களிடம் மீண்டும் சேர்க்கப்படுவதைச் சொன்னாலும், அதற்கான வரலாற்றுச் சூழ்நிலையைத் தெளிவுபடுத்தவில்லை. ஆகவே மொழிபெயர்ப்பு ஆதாரத்தில் இல்லாத ஒரு சூழ்நிலையைச் சேர்க்காமல் அந்தத் திறந்த தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதையும் உருக்கமும் கொண்ட நடையைப் பயன்படுத்துகிறது. ‘மீண்டும் சேர்க்கப்படும்படி’ என்பது செயப்பாட்டு வடிவத்தையும் வரலாற்றுச் சூழ்நிலையின் தெளிவின்மையையும் காக்கிறது; அடிக்குறிப்பு இயல்பான மாற்று வாசிப்பை வழங்குகிறது.
