  text: διδαχαῖς ποικίλαις καὶ ξέναις μὴ παραφέρεσθε· καλὸν γὰρ χάριτι βεβαιοῦσθαι τὴν καρδίαν, οὐ βρώμασιν, ἐν οἷς οὐκ ὠφελήθησαν οἱ ⸀περιπατοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/009.yaml
  text: Do not be carried away by various and strange teachings[a], for it is good for the heart to be strengthened by grace, not by foods[c][b], by which those who occupied themselves with them were not benefited.
translation:
  language: ta
  text: பலவகையான, அந்நியமான போதனைகளால் அடித்துச் செல்லப்படாதீர்கள். ஏனெனில் உணவுகளால் அல்ல, அருளால் உள்ளம் உறுதிப்படுவது நல்லது; அவற்றைப் பின்பற்றி வாழ்ந்தவர்கள் அவற்றால் பயனடையவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவற்றைப் பின்பற்றி வாழ்ந்தவர்கள்” என்பதற்கு கிரேக்கத்தில் சொற்படியாக “அவற்றில் நடந்தவர்கள்” என்று உள்ளது; இது அவற்றில் ஈடுபட்டவர்களையோ, அவற்றின்படி வாழ்ந்தவர்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: διδαχαῖς ποικίλαις καὶ ξέναις
  choice: பலவகையான, அந்நியமான போதனைகள்
  rationale: ποικίλαις என்பதன் பல்வகைத் தன்மையையும் ξέναις என்பதன் ஏற்றுக்கொள்ளப்பட்ட செய்திக்குப் புறம்பான அல்லது அந்நியமான தன்மையையும் காக்கிறது; இன அல்லது புவியியல் பொருளைத் தேவையின்றி சேர்ப்பதில்லை.
- source_word: μὴ παραφέρεσθε
  choice: அடித்துச் செல்லப்படாதீர்கள்
  rationale: செயப்பாட்டு வடிவத்தையும், வழியிலிருந்து வேறு திசைக்கு எடுத்துச் செல்லப்படும் உருவகத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: χάριτι βεβαιοῦσθαι τὴν καρδίαν
  choice: அருளால் உள்ளம் உறுதிப்படுவது
  rationale: χάριτι-யை கருவிப் பொருளில் ‘அருளால்’ என்றும், βεβαιοῦσθαι-யை உறுதியாக்கப்படுதல் என்றும் மொழிபெயர்க்கிறது. καρδία-வின் உள்மனித மையப் பொருளுக்கு இயல்பான தமிழ்ச் சொல்லாக ‘உள்ளம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: οὐ βρώμασιν
  choice: உணவுகளால் அல்ல
  rationale: βρώμασιν என்பதைக் கூடுதல் விளக்கமின்றி நேரடியாக மொழிபெயர்த்து, அது உணவுச் சட்டங்களையா, சடங்கு உணவுகளையா குறிக்கிறது என்பதை முதன்மை உரையில் தீர்மானிக்கவில்லை.
- source_word: ἐν οἷς ... οἱ περιπατοῦντες
  choice: அவற்றைப் பின்பற்றி வாழ்ந்தவர்கள்
  rationale: ‘அவற்றில் நடந்தவர்கள்’ என்ற சொற்படி உருவகத்தை தமிழில் புரியக்கூடிய நடத்தை சார்ந்த சொற்றொடராக அளிக்கிறது; உணவு சார்ந்த நடைமுறைகளின்படி வாழ்ந்ததைக் குறிக்கிறது.
- source_word: οὐκ ὠφελήθησαν
  choice: பயனடையவில்லை
  rationale: கிரேக்கச் செயப்பாட்டு வடிவத்தின் விளைவை இயல்பான நவீன தமிழில் சுருக்கமாகத் தருகிறது.
theological_decisions:
- issue: ‘உணவுகள்’ என்பதன் குறிப்பு மற்றும் ‘அருள்’ உடனான முரண்
  choice: முதன்மை உரையில் ‘உணவுகள்’ என்ற பொதுவான சொல்லையே வைத்தல்
  alternative: உணவுச் சட்டங்கள் அல்லது பலியுணவுகள் என்று குறிப்பாக்குதல்
  rationale: βρώμασιν வெறுமனே ‘உணவுகள்’ என்கிறது. சூழலில் உணவு சார்ந்த கடைப்பிடிப்புகள் குறிக்கப்படலாம்; ஆனால் அவற்றின் சரியான வகையை உரை வெளிப்படையாகத் தீர்மானிக்கவில்லை.
- issue: καρδία என்பதன் உருவகப் பொருள்
  choice: உள்ளம்
  alternative: இதயம்; மனம்; உள்மனிதன்
  rationale: ‘உள்ளம்’ என்பது மனிதனின் அக மையத்தைக் குறிக்கும் இயல்பான, கண்ணியமான நவீன தமிழ்; இதை வெறும் அறிவுசார் ‘மனம்’ எனக் குறுக்கவில்லை.
- issue: περιπατοῦντες உருவகத்தின் விளக்கம்
  choice: அவற்றைப் பின்பற்றி வாழ்ந்தவர்கள்
  alternative: அவற்றில் நடந்தவர்கள்; அவற்றில் ஈடுபட்டவர்கள்
  rationale: ‘நடத்தல்’ என்ற கிரேக்க உருவகம் வாழ்க்கை நடத்தை குறிக்கிறது. தமிழ் முதன்மை உரையில் பொருள் தெளிவாக இருக்க இவ்வாறு வழங்கப்பட்டாலும், அதன் சொற்படி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘அருள்’, ‘உள்ளம்’, ‘உணவுகள்’ ஆகிய சொற்கள் விளக்கவுரை சேர்க்காமல் மூலத்தின் இறையியல் நிறையையும் தெளிவின்மையையும் காக்கின்றன.
