  yaml_path: translation/nt/hebrews/013/002.yaml
  text: Do not neglect hospitality[a], for through it some have entertained angels without knowing it.
translation:
  language: ta
  text: அந்நியரை உபசரிப்பதை மறந்துவிடாதீர்கள்; ஏனெனில், அதன்மூலம் சிலர் தங்களுக்குத் தெரியாமலேயே வானதூதர்களை[a] உபசரித்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தூதர்களை’. கிரேக்கச் சொல் ‘வானதூதர்கள்’ அல்லது பொதுவாக ‘தூதர்கள்’ என இருவிதமாகப் பொருள்படலாம்; இங்குள்ள சாத்தியமான மறைநூல் சுட்டுக்கு ‘வானதூதர்கள்’ என்பது மிகப் பொருத்தமானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλοξενίας
  choice: அந்நியரை உபசரிக்க
  rationale: இந்தச் சொல் அந்நியரிடம் அன்புகாட்டி அவர்களை வரவேற்று உபசரிப்பதைக் குறிக்கிறது. பொதுவான ‘விருந்தோம்பல்’ என்பதைவிட, ‘அந்நியரை உபசரிக்க’ என்பது மூலச்சொல்லின் அந்நியர் சார்ந்த பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: μὴ ἐπιλανθάνεσθε
  choice: மறந்துவிடாதீர்கள்
  rationale: வினைச்சொல் ‘மறத்தல்’ அல்லது நடைமுறையில் புறக்கணித்தல் என்ற பொருளைக் கொள்ளலாம். இங்குள்ள அறிவுறுத்தல் நடப்பில் அதைச் செய்யத் தவறாதிருக்குமாறு கூறுவதால், இயல்பான தமிழில் ‘மறந்துவிடாதீர்கள்’ இரு நுணுக்கங்களையும் தாங்குகிறது.
- source_word: διὰ ταύτης
  choice: இவ்வாறு உபசரித்ததன் மூலம்
  rationale: பெண்பால் சுட்டுப்பெயர் முன் கூறப்பட்ட அந்நியர் உபசரிப்பைக் குறிக்கிறது; διά என்பதன் கருவிப் பொருளை ‘மூலம்’ காக்கிறது.
- source_word: ἔλαθόν
  choice: தங்களுக்குத் தெரியாமலேயே
  rationale: λανθάνω உடன் வரும் பங்கேற்புவினை அமைப்பு, செயல் செய்தவர்களின் அறிவின்றி அது நிகழ்ந்ததைக் குறிக்கிறது. தமிழில் இதை ‘தங்களுக்குத் தெரியாமலேயே’ என்று இயல்பாக வெளிப்படுத்தலாம்.
- source_word: τινες
  choice: சிலர்
  rationale: குறிப்பிடப்படாத பன்மையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ξενίσαντες
  choice: உபசரித்திருக்கிறார்கள்
  rationale: விருந்தினரை ஏற்று தங்கவைத்து உபசரித்தலைக் குறிக்கிறது. ‘உபசரித்தல்’ என்பது நவீனத் தமிழில் இச்சூழலுக்கு இயல்பானதும் மரியாதையானதும் ஆகும்.
- source_word: ἀγγέλους
  choice: வானதூதர்களை
  rationale: ἄγγελος என்பது ‘தூதர்’ அல்லது ‘வானதூதர்’ எனப் பொருள்படலாம். ஆபிரகாம், லோத்து ஆகியோரின் விருந்தோம்பல் நிகழ்வுகள் பற்றிய சாத்தியமான சுட்டினால், இங்கு இயற்கைக்கு அப்பாற்பட்ட தூதர்களைக் குறிக்கும் ‘வானதூதர்கள்’ முதன்மைத் தேர்வாகிறது; பொதுவான ‘தூதர்கள்’ அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: ἀγγέλους என்பதன் குறிப்பு மற்றும் பொருள்
  choice: இயற்கைக்கு அப்பாற்பட்ட வானதூதர்கள்
  alternative: மனிதத் தூதர்கள்
  rationale: பழைய ஏற்பாட்டில் அறியாமல் பரலோக விருந்தினர்களை ஏற்ற நிகழ்வுகள் பற்றிய சாத்தியமான மறைசுட்டு ‘வானதூதர்கள்’ என்ற வாசிப்பை ஆதரிக்கிறது. எனினும், கிரேக்கச் சொல்லின் பரந்த ‘தூதர்கள்’ என்ற பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified அறிவுறுத்தல் நடையில் வடிவமைக்கப்பட்டது. மூலத்தின் காரணத் தொடர்பும், அறியாமலே நிகழ்ந்த செயல் என்ற நுணுக்கமும் காக்கப்பட்டுள்ளன. ‘அந்நியரை உபசரிக்க’ என்பது φιλοξενία என்பதிலுள்ள அந்நியர் சார்ந்த பொருளை வெளிப்படையாகக் காக்கிறது.
