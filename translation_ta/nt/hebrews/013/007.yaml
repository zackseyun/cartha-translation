source:
  edition: SBLGNT
  text: Μνημονεύετε τῶν ἡγουμένων ὑμῶν, οἵτινες ἐλάλησαν ὑμῖν τὸν λόγον τοῦ θεοῦ, ὧν ἀναθεωροῦντες τὴν ἔκβασιν τῆς ἀναστροφῆς μιμεῖσθε τὴν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/007.yaml
  text: Remember your leaders[a], who spoke the word of God to you. As you consider the outcome of their way of life[b], imitate their faith.
translation:
  language: ta
  text: உங்களுக்குக் கடவுளுடைய வார்த்தையைப் பேசிய உங்கள் தலைவர்களை நினைவுகூருங்கள். அவர்களுடைய வாழ்க்கை நடத்தையின் விளைவை[a] உற்றுச் சிந்தித்து, அவர்களுடைய விசுவாசத்தை[b] பின்பற்றுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “விளைவு” என்பதை “முடிவு” என்றும் மொழிபெயர்க்கலாம்; சில விளக்கங்களில் இது அவர்கள் இறந்த விதத்தைக் குறிப்பதாகக் கொள்ளப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “விசுவாசத்தன்மையை” அல்லது “உண்மைப்பற்றை.” கிரேக்கச் சொல் விசுவாசம் அல்லது விசுவாசத்தன்மை ஆகிய இரண்டையும் குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: Μνημονεύετε
  choice: நினைவுகூருங்கள்
  rationale: நிகழ்காலக் கட்டளை தொடர்ந்து நினைவில் கொள்ளும் செயலைக் குறிக்கலாம். தமிழில் இயல்பான கட்டளை வடிவமாகவும், முன்பு ஊழியம் செய்த தலைவர்களை மனத்தில் கொள்ளும் பொருளுடனும் இது அமைகிறது.
- source_word: τῶν ἡγουμένων ὑμῶν
  choice: உங்கள் தலைவர்களை
  rationale: சமூகத்தில் அங்கீகரிக்கப்பட்டு வழிநடத்தியவர்களைக் குறிக்கிறது. அரசியல் அல்லது கடுமையான அதிகாரத் தொனியுடைய ‘ஆட்சியாளர்கள்’ என்பதைக் காட்டிலும் ‘தலைவர்கள்’ இயல்பாக உள்ளது.
- source_word: οἵτινες ἐλάλησαν ὑμῖν τὸν λόγον τοῦ θεοῦ
  choice: உங்களுக்குக் கடவுளுடைய வார்த்தையைப் பேசிய
  rationale: λαλέω என்பதன் நேரான ‘பேசுதல்’ பொருளையும், τὸν λόγον τοῦ θεοῦ என்ற உடைமைத் தொடர்பையும் பாதுகாக்கிறது.
- source_word: ἀναθεωροῦντες
  choice: உற்றுச் சிந்தித்து
  rationale: வெறுமனே பார்ப்பதல்லாமல் கவனமாக நோக்கி ஆராயும் அல்லது சிந்திக்கும் செயலைப் பங்கேற்புவினை உணர்த்துகிறது.
- source_word: τὴν ἔκβασιν
  choice: விளைவை
  rationale: ஒரு வாழ்க்கையின் முடிவாக ஏற்பட்ட பலன் அல்லது இறுதி நிலையைப் பொதுவாகக் குறிக்கிறது; மரணம் அல்லது இரத்தசாட்சி என்பதை முதன்மை உரையில் தேவையின்றிக் குறிப்பாக்கவில்லை.
- source_word: τῆς ἀναστροφῆς
  choice: வாழ்க்கை நடத்தையின்
  rationale: ἀναστροφή என்பது ஒருவரின் நடத்தை, வாழும் முறை ஆகிய இரண்டையும் உள்ளடக்குகிறது. ‘வாழ்க்கை நடத்தை’ இந்த விரிவைத் தெளிவாகத் தருகிறது.
- source_word: μιμεῖσθε
  choice: பின்பற்றுங்கள்
  rationale: ஒருவரை முன்மாதிரியாகக் கொண்டு அவரைப் போல நடக்குமாறு கூறும் நேரடிக் கட்டளையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὴν πίστιν
  choice: அவர்களுடைய விசுவாசத்தை
  rationale: πίστις என்பதற்கான வழக்கமான வேதாகமத் தமிழ் இணைச்சொல் ‘விசுவாசம்.’ இங்கு ‘விசுவாசமுள்ள நிலை/உண்மைப்பற்று’ என்ற பொருளும் சாத்தியமுள்ளதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: பின்பற்றத்தக்க மனிதப் பண்பாக πίστις என்பதன் பொருள்
  choice: விசுவாசம்
  alternative: விசுவாசமுள்ள நிலை அல்லது உண்மைப்பற்று
  rationale: தலைவர்களைச் சிறப்பித்தது அவர்களுடைய நம்பிக்கையா அல்லது நிலைத்த உண்மைப்பற்றா என்பது கிரேக்கத்தில் முழுமையாகத் தீர்மானிக்கப்படவில்லை. முதன்மை உரை வழக்கமான ‘விசுவாசம்’ என்பதை வைத்துக்கொண்டு மாற்றுப் பொருளை அடிக்குறிப்பில் தருகிறது.
- issue: ἔκβασις தலைவர்களின் மரணத்தை அல்லது இரத்தசாட்சியைத் திட்டவட்டமாகக் குறிக்கிறதா
  choice: விளைவு
  alternative: முடிவு; சில விளக்கங்களில் அவர்கள் இறந்த விதம்
  rationale: சொல் முடிவு அல்லது இறுதி விளைவு என்பதைக் குறிக்கலாம்; ஆனால் குறிப்பாக மரணம் அல்லது இரத்தசாட்சி என்று வசனம் வெளிப்படையாகச் சொல்லவில்லை. எனவே பரந்த பொருள் முதன்மை உரையில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘கடவுளுடைய வார்த்தை,’ ‘தலைவர்கள்,’ ‘வாழ்க்கை நடத்தை’ ஆகியவை சாதாரண வாசகருக்குத் தெளிவாகவும், சமயப் பிரிவு சார்ந்த தனிப்பட்ட சொற்பயன்பாடுகளைத் தவிர்ப்பவையாகவும் உள்ளன. எல்லா அடிக்குறிப்பு குறியீடுகளும் உரையில் பொருத்தமான சொற்களுக்குப் பின் இடப்பட்டுள்ளன.
