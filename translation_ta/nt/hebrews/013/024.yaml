revisions:
- from: உங்களை வழிநடத்துகிற அனைவருக்கும், பரிசுத்தவான்கள் அனைவருக்கும் வாழ்த்துச் சொல்லுங்கள். இத்தாலியிலிருந்து வந்தவர்கள்[a] உங்களுக்கு வாழ்த்துச் சொல்கிறார்கள்.
  to: உங்களை வழிநடத்துகிறவர்கள் அனைவருக்கும், பரிசுத்தவான்கள் அனைவருக்கும் வாழ்த்துகளைத் தெரிவியுங்கள். இத்தாலியிலிருந்து வந்தவர்கள்[a] உங்களுக்கு வாழ்த்துச் சொல்கிறார்கள்.
  rationale: The revision improves modern Tamil syntax and epistolary style without altering the source’s scope, imperative force, ecclesial terminology, or the deliberately preserved ambiguity concerning those associated with Italy.
