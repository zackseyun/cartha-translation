id: HEB.13.24
reference: Hebrews 13:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀσπάσασθε πάντας τοὺς ἡγουμένους ὑμῶν καὶ πάντας τοὺς ἁγίους. ἀσπάζονται ὑμᾶς οἱ ἀπὸ τῆς Ἰταλίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/024.yaml
  text: Greet all your leaders and all the saints[a]. Those from Italy greet you.
translation:
  language: ta
  text: உங்களை வழிநடத்துகிறவர்கள் அனைவருக்கும், பரிசுத்தவான்கள் அனைவருக்கும் வாழ்த்துகளைத் தெரிவியுங்கள். இத்தாலியிலிருந்து வந்தவர்கள்[a] உங்களுக்கு வாழ்த்துச் சொல்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இத்தாலியில் உள்ளவர்கள்.” கிரேக்கச் சொற்றொடர் இத்தாலியிலிருந்து வந்தவர்களையோ இத்தாலியில் உள்ளவர்களையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: வாழ்த்துச் சொல்லுங்கள்
  rationale: கடிதச் சூழலில் வாழ்த்தைத் தெரிவிக்கும்படி கூறும் இறந்தகாலக் கட்டளை வடிவத்தின் வலிமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: πάντας
  choice: அனைவருக்கும்
  rationale: குறிப்பிடப்பட்ட ஒவ்வொரு குழுவின் முழுமையையும் நேரடியாகத் தெரிவிக்கிறது.
- source_word: τοὺς ἡγουμένους ὑμῶν
  choice: உங்களை வழிநடத்துகிற அனைவருக்கும்
  rationale: ἡγέομαι என்பதன் வழிநடத்துதல் என்ற அடிப்படைப் பொருளைப் பாதுகாத்து, அரசியல் ஆட்சியாளர்கள் என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: τοὺς ἁγίους
  choice: பரிசுத்தவான்கள்
  rationale: புதிய ஏற்பாட்டில் விசுவாசிகளைக் குறிக்கும் ἅγιοι என்பதன் 'பரிசுத்தமானவர்கள்' என்ற சொற்பொருளையும் அதன் இறையியல் நிறையையும் காக்கிறது.
- source_word: ἀσπάζονται
  choice: வாழ்த்துச் சொல்கிறார்கள்
  rationale: கடிதத்தின் முடிவில் வாழ்த்துகளைத் தெரிவிப்பதைக் குறிக்கும் நிகழ்கால வினையை இயல்பான தமிழில் வழங்குகிறது.
- source_word: οἱ ἀπὸ τῆς Ἰταλίας
  choice: இத்தாலியிலிருந்து வந்தவர்கள்
  rationale: ἀπό + உரிமை வேற்றுமை பொதுவாக மூலத்தையோ பிறப்பிடத்தையோ குறிக்கும் என்பதால், 'இத்தாலியிலிருந்து' என்ற நேரடிப் பொருள் முதன்மை உரையில் வைக்கப்படுகிறது.
theological_decisions:
- issue: οἱ ἀπὸ τῆς Ἰταλίας என்பதன் குறிப்பு
  choice: இத்தாலியிலிருந்து வந்தவர்கள்
  alternative: இத்தாலியில் இருப்பவர்கள்
  rationale: ἀπό பொதுவாக வந்த இடம் அல்லது மூலத்தைக் குறித்தாலும், இங்கு இத்தாலியில் தற்போது இருப்பவர்களையும் குறிக்கக்கூடும். கடிதம் எழுதப்பட்ட இடத்தைப் பற்றிய முடிவை மொழிபெயர்ப்பே தீர்மானிக்காதபடி மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் கடித நிறைவு நடையும் காக்கப்பட்டுள்ளன. 'பரிசுத்தவான்கள்' என்ற பரிச்சயமான வேதாகமச் சொல் தக்கவைக்கப்பட்டுள்ளது; தலைமைப் பொறுப்பை அரசியல் ஆட்சியாகத் தவறாகப் புரிந்துகொள்ளாதவாறு 'வழிநடத்துகிறவர்கள்' பயன்படுத்தப்பட்டுள்ளது.
