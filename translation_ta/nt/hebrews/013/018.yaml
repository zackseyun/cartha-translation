source:
  edition: SBLGNT
  text: Προσεύχεσθε περὶ ἡμῶν, ⸀πειθόμεθα γὰρ ὅτι καλὴν συνείδησιν ἔχομεν, ἐν πᾶσιν καλῶς θέλοντες ἀναστρέφεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/018.yaml
  text: Pray for us[a], for we are convinced that we have a good conscience[c][b], since we want to conduct ourselves well in everything.
translation:
  language: ta
  text: எங்களுக்காக வேண்டிக்கொள்ளுங்கள்; ஏனெனில், நாங்கள் நல்ல மனசாட்சியைக் கொண்டிருக்கிறோம் என்று உறுதியாக நம்புகிறோம்; எல்லாவற்றிலும் நன்றாக நடந்துகொள்ள விரும்புகிறவர்களாக இருக்கிறோம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προσεύχεσθε
  choice: வேண்டிக்கொள்ளுங்கள்
  rationale: இரண்டாம் நபர் பன்மை நிகழ்காலக் கட்டளை. தமிழில் இயல்பான கட்டளையாக மொழிபெயர்க்கப்பட்டுள்ளது; தொடர்ச்சியான செயலை வெளிப்படையாகச் சேர்ப்பது தேவையற்ற விரிவாக்கமாகும்.
- source_word: περὶ ἡμῶν
  choice: எங்களுக்காக
  rationale: செபம் அல்லது வேண்டுதல் குறித்த சூழலில் περί + genitive என்பதன் இயல்பான தமிழ் பொருள் ‘எங்களுக்காக’ என்பதாகும்.
- source_word: πειθόμεθα
  choice: நாங்கள் உறுதியாக நம்புகிறோம்
  rationale: பேசுகிறவர்களின் நிலையான உள்ளார்ந்த உறுதியையும் அறிவுசார் நம்பிக்கையையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: καλὴν συνείδησιν
  choice: நல்ல மனசாட்சி
  rationale: பெயரடையையும் பெயர்ச்சொல்லையும் நேரடியாகப் பேணி, ‘குற்றமற்ற மனசாட்சி’ போன்ற அதிக விளக்கமான பொருளைத் திணிக்காமல் உள்ளது.
- source_word: ἔχομεν
  choice: இருக்கிறது
  rationale: ‘எங்களுக்கு ... இருக்கிறது’ என்பது கிரேக்கத்தின் உடைமைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἐν πᾶσιν
  choice: எல்லாவற்றிலும்
  rationale: அனைத்துத் துறைகளையும் அம்சங்களையும் உள்ளடக்கும் விரிவான வினையடைப் பொருளைப் பேணுகிறது.
- source_word: καλῶς
  choice: நன்றாக
  rationale: ‘கண்ணியமாக’ அல்லது ‘நேர்மையாக’ என்று பொருளைக் குறுக்காமல், மூலத்தின் விரிவான நெறிசார் பொருளைப் பேணுகிறது.
- source_word: θέλοντες
  choice: விரும்புகிறோம்
  rationale: தொடர்ந்து நிலவும் விருப்பம் அல்லது நோக்கத்தை இயல்பான தமிழில் காட்டுகிறது; அதன் பங்கேற்பெச்சத் தொடர்பின் தெளிவின்மை குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: ἀναστρέφεσθαι
  choice: நடந்துகொள்ள
  rationale: ஒருவரின் வாழ்க்கை முறை மற்றும் நெறிசார் நடத்தையைச் சுட்டும் வினையின் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இறுதிப் பங்கேற்பெச்சத் தொடருக்கும் நல்ல மனசாட்சி குறித்த கூற்றுக்கும் உள்ள தொடர்பு
  choice: முதன்மை உரையில் தனித்தொடராக, ‘எல்லாவற்றிலும் நன்றாக நடந்துகொள்ள விரும்புகிறோம்’ என்று தரப்பட்டுள்ளது.
  alternative: ‘ஏனெனில் எல்லாவற்றிலும் நன்றாக நடந்துகொள்ள விரும்புகிறோம்’ என்று காரணத் தொடர்பை வெளிப்படையாக்கலாம்; அல்லது ‘எல்லாவற்றிலும் கண்ணியமாக நடந்துகொள்ள விரும்புகிறவர்களாய்’ என்று பங்கேற்பெச்ச அமைப்பை நெருக்கமாகப் பேணலாம்.
  rationale: θέλοντες என்ற பங்கேற்பெச்சம் காரணத்தையோ விளக்கத்தையோ குறிப்பதாக இருக்கலாம்; ஆனால் அந்தத் தொடர்பை கிரேக்கம் வெளிப்படையாக நிர்ணயிக்கவில்லை. ஆகவே பிரதான உரை அதன் தொடர்பை மிகையாகத் தீர்மானிக்காமல் இயல்பான தமிழில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘மனசாட்சி’ என்ற பரவலாக அறியப்பட்ட சொல் பயன்படுத்தப்பட்டுள்ளது. கிரேக்கப் பங்கேற்பெச்சத்தின் தொடர்பு பிரதான உரையில் மிகையாகத் தீர்மானிக்கப்படாமல், மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
