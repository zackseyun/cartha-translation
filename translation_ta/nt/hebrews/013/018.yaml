revisions:
- from: எங்களுக்காக வேண்டிக்கொள்ளுங்கள். ஏனெனில், எங்களுக்கு நல்ல மனசாட்சி[b] இருக்கிறது என்று நாங்கள் உறுதியாக நம்புகிறோம்[a]; எல்லாவற்றிலும் நன்றாக நடந்துகொள்ள விரும்புகிறோம்[c].
  to: எங்களுக்காக வேண்டிக்கொள்ளுங்கள்; ஏனெனில், நாங்கள் நல்ல மனசாட்சியைக் கொண்டிருக்கிறோம் என்று உறுதியாக நம்புகிறோம்; எல்லாவற்றிலும் நன்றாக நடந்துகொள்ள விரும்புகிறவர்களாக இருக்கிறோம்.
  rationale: The revision changes only the final clause’s Tamil syntax. ‘விரும்புகிறவர்களாக இருக்கிறோம்’ reflects the Greek participle θέλοντες as a characterization of ‘we,’ while remaining idiomatic modern Tamil. It deliberately does not add ‘ஏனெனில்’ or another causal connector before that clause, since the precise participial relation is not explicit in Greek.
