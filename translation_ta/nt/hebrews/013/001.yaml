  text: Ἡ φιλαδελφία μενέτω.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/001.yaml
  text: Let brotherly love continue[a].
translation:
  language: ta
  text: சகோதர அன்பு தொடர்ந்து நிலைத்திருக்கட்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சக விசுவாசிகளிடத்திலான அன்பு.” கிரேக்கச் சொல் கிறிஸ்தவச் சமூகத்திற்குள் குடும்பத்தினருக்குரிய பாசத்தைக் குறிக்கிறது; அது ஆண்களை மட்டும் குறிக்கவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλαδελφία
  choice: சகோதர அன்பு
  rationale: இந்தச் சொல் உடன்பிறந்தோருக்குரிய குடும்பப் பாசத்தை அடிப்படையாகக் கொண்டு, இங்கு விசுவாசச் சமூகத்தினரிடையே இருக்க வேண்டிய அன்பைக் குறிக்கிறது. “சகோதர அன்பு” என்பது அந்தக் குடும்ப உருவகத்தைத் தக்கவைக்கிறது; அது ஆண்களை மட்டும் குறிக்கவில்லை என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: μενέτω
  choice: தொடர்ந்து நிலைத்திருக்கட்டும்
  rationale: μένω என்பதன் நிகழ்காலக் கட்டளை வடிவம் ஏற்கெனவே உள்ள நிலை இடைவிடாமல் தொடர வேண்டும் என்ற பொருளைத் தருகிறது. “தொடர்ந்து நிலைத்திருக்கட்டும்” என்பது அதன் கட்டளை வலிமையையும் நீடித்த தன்மையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Ἡ
  choice: தனி வார்த்தையாக மொழிபெயர்க்கப்படவில்லை
  rationale: கிரேக்கச் சுட்டுருபு, வாசகர்கள் அறிந்த நற்பண்பாக φιλαδελφίαவைச் சுட்டுகிறது. தமிழ் வாக்கிய அமைப்பில் இதற்குத் தனியான இணைச்சொல் தேவையில்லை; அதன் குறிப்புத்தன்மை “சகோதர அன்பு” என்ற பெயர்த்தொடரில் இயல்பாகப் புரிகிறது.
theological_decisions:
- issue: φιλαδελφία என்பதன் வரம்பும் பாலினம் சுட்டும் குடும்ப மொழியும்
  choice: முதன்மை உரையில் “சகோதர அன்பு” என்று மொழிபெயர்த்து, குடும்ப உருவகத்தைத் தக்கவைத்தல்
  alternative: “சக விசுவாசிகளிடத்திலான அன்பு” அல்லது “ஒருவருக்கொருவர் அன்பு”
  rationale: கிரேக்கச் சொல் குடும்ப உறவின் உருவகத்தைத் தாங்கி, கிறிஸ்தவச் சமூகத்திலுள்ள அனைவரையும் உள்ளடக்குகிறது. பொதுவான “ஒருவருக்கொருவர் அன்பு” என்று மாற்றுவது அந்த உருவகத்தை மங்கச் செய்யும்; அதேவேளை “சகோதர” என்பதை ஆண்களுக்கு மட்டும் உரியதாகத் தவறாகப் புரிந்துகொள்ளாமல் இருக்க அடிக்குறிப்பு அவசியம்.
translation_notes:
  register: நவீன செந்தமிழ் நடையில் சுருக்கமான அறிவுறுத்தலாக அமைக்கப்பட்டுள்ளது. “தொடர்ந்து நிலைத்திருக்கட்டும்” என்பது மரியாதைமிக்க, இயல்பான நடையில் நிகழ்காலக் கட்டளையின் நீடித்த வலிமையை வெளிப்படுத்துகிறது.
