  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையும் நேரடியான வாக்கிய அமைப்பும் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் வேண்டுகோள் தொனியும், செய்தியைப் பொறுமையுடன் தாங்கி ஏற்க வேண்டும் என்ற நுணுக்கமும் காக்கப்பட்டுள்ளன.
