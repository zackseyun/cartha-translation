source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, ἀνέχεσθε τοῦ λόγου τῆς παρακλήσεως, καὶ γὰρ διὰ βραχέων ἐπέστειλα ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/022.yaml
  text: I urge you[a], brothers, bear with this word of exhortation[b], for I have written to you briefly.
translation:
  language: ta
  text: சகோதரர்களே[a], இந்த அறிவுரைச் செய்தியை[b] பொறுமையுடன் ஏற்றுக்கொள்ளும்படி உங்களை வேண்டிக்கொள்கிறேன். ஏனெனில், நான் உங்களுக்குச் சுருக்கமாக எழுதியிருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சகோதர சகோதரிகளே.’ கிரேக்கத்தில் ‘சகோதரர்களே’ என்று உள்ளது; அது முழுச் சபையையும் உள்ளடக்கி அழைக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘அறிவுரைச் செய்தி’ என்பதை ‘ஊக்கமளிக்கும் செய்தி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: உங்களை வேண்டிக்கொள்கிறேன்
  rationale: இங்கு ஆசிரியர் வாசகர்களிடம் அக்கறையுடனும் வலியுறுத்தலுடனும் வேண்டுகிறார். ‘வேண்டிக்கொள்கிறேன்’ என்பது கட்டளையாகக் கடுமையாக்காமலும் வெறும் ஊக்கப்படுத்துதலாகத் தளர்த்தாமலும் அந்த வேண்டுகோளின் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: δὲ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது வலுவான எதிர்மறையை அல்ல, முடிவுரைக்குள் ஒரு மென்மையான உரையாடல் மாற்றத்தைக் குறிக்கிறது. தமிழில் அழைப்புச் சொல்லுடன் வாக்கியத்தைத் தொடங்குவது அந்த ஓட்டத்தை இயல்பாக வெளிப்படுத்துவதால் தனிச் சொல் சேர்க்கப்படவில்லை.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: கிரேக்கத்தின் ஆண்பால் பன்மை அழைப்பை முதன்மை உரை நேரடியாகப் பாதுகாக்கிறது. முழுச் சபையையும் உள்ளடக்கக்கூடிய பயன்பாடு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: ἀνέχεσθε
  choice: பொறுமையுடன் ஏற்றுக்கொள்ளும்படி
  rationale: ἀνέχομαι என்பதன் ‘பொறுத்துக்கொள் / சகித்துக்கொள்’ என்ற அடிப்படை உணர்வையும், இங்கு செய்திக்குப் பொறுமையாகச் செவிகொடுத்து இடமளிக்க வேண்டும் என்ற சூழலையும் இயல்பான தமிழில் இணைக்கிறது. ‘சகித்துக்கொள்ளுங்கள்’ என்பது தேவையற்ற எதிர்மறைத் தொனியை உருவாக்கக்கூடும்.
- source_word: τοῦ λόγου τῆς παρακλήσεως
  choice: இந்த அறிவுரைச் செய்தியை
  rationale: λόγος இங்கு தனித்த ‘சொல்’ அல்ல, தெரிவிக்கப்பட்ட செய்தியைக் குறிக்கிறது; παράκλησις அறிவுறுத்தல், வலியுறுத்தல், ஊக்கமளித்தல் ஆகிய நெருங்கிய உணர்வுகளை உடையது. ‘அறிவுரைச் செய்தி’ சூழலுக்குப் பொருத்தமாகவும் இயல்பாகவும் உள்ளது; மாற்று உணர்வு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது. கிரேக்கத்தில் வெளிப்படையான சுட்டுப்பெயர் இல்லாவிட்டாலும், பேசப்படுவது இந்நூலின் செய்தியே என்பதைத் தமிழில் இயல்பாக்க ‘இந்த’ சேர்க்கப்பட்டுள்ளது.
- source_word: καὶ γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வேண்டுகோளுக்கான விளக்கக் காரணத்தை இந்த இணைப்பு தருகிறது. தமிழில் ‘ஏனெனில்’ அதன் காரணவியல் வலிமையைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: διὰ βραχέων
  choice: சுருக்கமாகவே
  rationale: ‘சில சொற்களால்’ அல்லது ‘சுருக்கமாக’ என்ற சொற்றொடரின் பொருளை இயல்பான தமிழில் தருகிறது. ‘வே’ ஆசிரியரின் ஒப்பீட்டளவிலான சுருக்கக் கூற்றை மென்மையாக வலியுறுத்துகிறது.
- source_word: ἐπέστειλα ὑμῖν
  choice: நான் உங்களுக்குச் … எழுதியிருக்கிறேன்
  rationale: ἐπέστειλα என்பது கடிதம் அல்லது செய்தி எழுதி அனுப்பியதைக் குறிக்கலாம். வாசகர்களின் கையில் உள்ள எழுத்தைக் கருத்தில் கொண்டு, தமிழின் நிறைவுநிலை வடிவமான ‘எழுதியிருக்கிறேன்’ இயல்பாக உள்ளது; ὑμῖν ‘உங்களுக்கு’ என நேரடியாகப் பிரதிபலிக்கப்படுகிறது.
theological_decisions:
- issue: ἀδελφοί என்ற ஆண்பால் அழைப்பின் உள்ளடக்கும் பரப்பு
  choice: முதன்மை உரையில் ‘சகோதரர்களே’
  alternative: ‘சகோதர சகோதரிகளே’
  rationale: மூலத்தின் இலக்கண வடிவத்தை முதன்மை உரை பாதுகாக்கிறது. அதேவேளை, இவ்வழைப்பு ஆண்களையும் பெண்களையும் கொண்ட முழுச் சபையையும் குறிக்கக்கூடும் என்ற உண்மையான பயன்பாட்டு வாய்ப்பு அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- issue: παράκλησις என்பதன் அறிவுரை–ஊக்கம் சார்ந்த பொருள் பரப்பு
  choice: ‘அறிவுரைச் செய்தி’
  alternative: ‘ஊக்கமளிக்கும் செய்தி’
  rationale: இச்சூழலில் வாசகர்கள் பொறுமையுடன் ஏற்றுக்கொள்ள வேண்டிய வலியுறுத்தும் அறிவுரை முன்னிலையில் உள்ளது. இருப்பினும், கிரேக்கச் சொல் ஊக்கமளித்தல் என்ற உணர்வையும் கொண்டிருப்பதால் அதை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
