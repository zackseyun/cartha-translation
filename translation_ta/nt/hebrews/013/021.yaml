  source_fidelity: ‘எல்லா நன்மையிலும்’ என்பது καταρτίζω உடன் வரும் ἐν παντὶ ἀγαθῷ-இன் வழங்கும்/உதவும் பொருளைத் தமிழில் தெளிவாகக் காட்டவில்லை. ‘எல்லா நன்மையானவற்றாலும்’ என்பது தேவையான நன்மையானவற்றை அளித்து ஆயத்தப்படுத்துதல் என்ற கருத்தை இயல்பாக வெளிப்படுத்துகிறது. மற்றபடி வேண்டுதல், கடவுளின் நமக்குள்ளான செயல், இயேசு மெசியா வழியான இடைமை, மற்றும் மகிமை உரையின் தெளிவின்மை ஆகியவை காக்கப்படுகின்றன.
