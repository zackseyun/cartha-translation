id: HEB.13.21
reference: Hebrews 13:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καταρτίσαι ὑμᾶς ἐν ⸀παντὶ ἀγαθῷ εἰς τὸ ποιῆσαι τὸ θέλημα αὐτοῦ, ποιῶν ἐν ⸀ἡμῖν τὸ εὐάρεστον ἐνώπιον αὐτοῦ διὰ Ἰησοῦ Χριστοῦ, ᾧ ἡ δόξα εἰς τοὺς ⸀αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/021.yaml
  text: may he equip you in every good thing to do his will[a], working in us what is pleasing before him through Jesus the Messiah, to whom be the glory forever and ever. Amen.
translation:
  language: ta
  text: அவர் தமது விருப்பத்தைச் செய்யும்படி, எல்லா நன்மையானவற்றாலும் உங்களை ஆயத்தப்படுத்தி, இயேசு மெசியாவின் வழியாகத் தம் பார்வையில் பிரியமானதை நமக்குள் செயல்படுத்துவாராக. அவருக்கே[a] என்றென்றும் மகிமை உண்டாவதாக. ஆமென்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவருக்கே’ என்பது குறிப்பாக இயேசு மெசியாவைக் குறிக்கலாம்; வேறு சிலர், இந்த வேண்டுதலின் எழுவாயான சமாதானத்தின் கடவுளைக் குறிப்பதாகப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: καταρτίσαι
  choice: ஆயத்தப்படுத்தி ... செயல்படுத்துவாராக
  rationale: இந்த ஆசீர்வாத வேண்டுதலில், கடவுள் தமது விருப்பத்தைச் செய்வதற்குத் தேவையான தகுதியையும் வசதியையும் விசுவாசிகளுக்கு அளிப்பதை ‘ஆயத்தப்படுத்து’ இயல்பான நவீன தமிழில் தெரிவிக்கிறது. கிரேக்க இறந்தகால விருப்பவினையின் வேண்டுதல் பொருள், வாக்கியத்தின் இறுதியில் உள்ள ‘செயல்படுத்துவாராக’ என்பதோடு இணைந்து வெளிப்படுகிறது.
- source_word: ἐν παντὶ ἀγαθῷ
  choice: எல்லா நன்மையிலும்
  rationale: மூலத்தின் ἐν அமைப்பையும் ‘ஒவ்வொரு/எல்லா நல்லது’ என்ற திட்டமிட்ட பொதுமையையும் காக்கிறது; ‘எல்லா நற்செயல்களுக்கும்’ என்று மொழிபெயர்த்து பொருளைச் செயல்களுக்கு மட்டும் குறுக்கவில்லை.
- source_word: εἰς τὸ ποιῆσαι τὸ θέλημα αὐτοῦ
  choice: தமது விருப்பத்தைச் செய்யும்படி
  rationale: εἰς + பெயராக்கப்பட்ட வினையெச்சத்தின் நோக்கப் பொருளை ‘செய்யும்படி’ தெளிவாகக் காட்டுகிறது. ஒரே எழுவாயைக் குறிக்கும் தமிழ் தற்சுட்டுப் பெயரடை ‘தமது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ποιῶν ἐν ἡμῖν
  choice: நமக்குள் செயல்படுத்தி
  rationale: கடவுளின் தொடர்ச்சியான உள்செயலை ‘நமக்குள்’ காக்கிறது; ‘நம்மிடையே’ என்ற சாத்தியமான சமூகப் பொருளைத் தேர்ந்தெடுக்கவில்லை.
- source_word: τὸ εὐάρεστον ἐνώπιον αὐτοῦ
  choice: தமக்கு முன்பாகப் பிரியமானதை
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் εὐάρεστον என்பதை ‘பிரியமானதை’ என்றும், கடவுளின் மதிப்பீட்டுப் பார்வையை ἐνώπιον என்பதற்கேற்ப ‘தமக்கு முன்பாக’ என்றும் மொழிபெயர்க்கிறது.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியாவின் வழியாக
  rationale: διά என்பதன் இடைமையைக் ‘வழியாக’ தெரிவிக்கிறது. Χριστός இங்கு பட்டப்பெயர் வலிமையைக் கொண்டிருப்பதால் ‘கிறிஸ்து’ என்ற ஒலிபெயர்ப்புக்குப் பதிலாக ‘மெசியா’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ᾧ ἡ δόξα
  choice: அவருக்கே மகிமை உண்டாவதாக
  rationale: கிரேக்க உறவுப்பெயரின் ஆண்பால் ஒருமைச் சுட்டை ‘அவருக்கே’ இயல்பாகத் தருகிறது; அதன் முன்னிலையை உரையில் வெளிப்படையாகத் தீர்மானிக்காமல் விடுகிறது.
- source_word: εἰς τοὺς αἰῶνας
  choice: என்றென்றும்
  rationale: முடிவில்லாத காலத்தைக் குறிக்கும் கிரேக்க மரபுத்தொடருக்கு இயல்பான, கண்ணியமான தமிழ் வடிவம்.
- source_word: ἀμήν
  choice: ஆமென்
  rationale: வழிபாட்டு மரபில் பரவலாக அறியப்பட்ட நிலையான தமிழ் ஒலிபெயர்ப்பு.
theological_decisions:
- issue: ᾧ (‘அவருக்கே’) என்பதன் முன்னிலை
  choice: ‘அவருக்கே’ என்று மட்டும் வைத்து, அது யாரைக் குறிக்கிறது என்பதை முதன்மை உரையில் தீர்மானிக்கவில்லை.
  alternative: அது அருகிலுள்ள ‘இயேசு மெசியா’வைக் குறிப்பதாகவோ, வேண்டுதலின் எழுவாயான கடவுளைக் குறிப்பதாகவோ வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: இலக்கணப்படி அருகிலுள்ள முன்னிலை இயேசு மெசியா; ஆனால் முழு வேண்டுதலின் எழுவாய் கடவுள். கிரேக்க உரை அனுமதிக்கும் இந்த இறையியல் பதற்றத்தைத் தமிழ் மொழிபெயர்ப்பு காக்கிறது; அடிக்குறிப்பு இரு புரிதல்களையும் குறிப்பிடுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான ஆசீர்வாத-வேண்டுதல் நடை பயன்படுத்தப்பட்டுள்ளது. நீளமான கிரேக்க வாக்கியத்தின் தொடர்பு காக்கப்பட்டாலும், வாசிப்புத் தெளிவுக்காக வேண்டுதலும் மகிமை உரையும் இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளன. ‘தமது/தமக்கு’ ஒரே தெய்வீக எழுவாயை இயல்பாகத் தொடர்கிறது; ‘அவருக்கே’ மட்டும் திட்டமிட்டு முன்னிலைத் தெளிவின்மையைத் தக்கவைக்கிறது.
