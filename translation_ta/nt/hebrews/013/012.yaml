  text: διὸ καὶ Ἰησοῦς, ἵνα ἁγιάσῃ διὰ τοῦ ἰδίου αἵματος τὸν λαόν, ἔξω τῆς πύλης ἔπαθεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/012.yaml
  text: Therefore Jesus also suffered outside the gate[b][a], so that he might sanctify the people through his own blood.
translation:
  language: ta
  text: ஆகவே, இயேசுவும் தமது சொந்த இரத்தத்தின் மூலம் மக்களைப் புனிதப்படுத்துவதற்காக[a] வாசலுக்கு வெளியே துன்புற்றார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்தமாக்குவதற்காக” அல்லது “அர்ப்பணித்துப் புனிதமாக்குவதற்காக.”
    reason: lexical_alternative
  - marker: b
    text: “வாசலுக்கு வெளியே” என்பது இயேசு எருசலேமுக்கு வெளியே துன்புற்ற இடத்தைக் குறிக்கலாம்; முந்தைய வசனத்தில் பலியிடப்பட்ட விலங்குகளின் உடல்கள் முகாமுக்கு வெளியே எரிக்கப்பட்டதையும் இது எதிரொலிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: διὸ
  choice: ஆகவே
  rationale: முந்தைய பலியிடும் நடைமுறையிலிருந்து இவ்வசனம் வருவிக்கும் முடிவை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: καὶ
  choice: இயேசுவும்
  rationale: முந்தைய பலியிடும் வடிவத்துடன் இயேசுவை இணைக்கும் பொருளை ‘-உம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Ἰησοῦς
  choice: இயேசு
  rationale: தமிழில் நிலைபெற்றுள்ள பெயர்வடிவம்.
- source_word: ἵνα ἁγιάσῃ
  choice: புனிதப்படுத்துவதற்காக
  rationale: ἵνα உடன் வரும் இறந்தகாலத் துணைவினை குறிக்கும் நோக்கப்பொருளையும், ἁγιάζω என்பதன் வழிபாட்டு மற்றும் உடன்படிக்கை சார்ந்த பொருளையும் காக்கிறது.
- source_word: διὰ τοῦ ἰδίου αἵματος
  choice: தமது சொந்த இரத்தத்தின் மூலம்
  rationale: διά என்பதன் கருவிப்பொருளையும் ἰδίου என்பதன் வலியுறுத்தலையும் பலியுடன் தொடர்புடைய இரத்த உருவகத்தையும் காக்கிறது.
- source_word: τὸν λαόν
  choice: மக்களை
  rationale: கிரேக்கத்தில் உள்ள பொருளையே தருகிறது; ‘தேவனுடைய மக்கள்’ என்று வெளிப்படையாக இல்லாத சொற்களைச் சேர்க்கவில்லை.
- source_word: ἔξω τῆς πύλης
  choice: நகரவாசலுக்கு வெளியே
  rationale: πύλη என்பதன் ஒருமையைப் பேணுகிறது. தமிழில் ‘வாசலுக்கு வெளியே’ மட்டும் இடத்தைத் தெளிவாக உணர்த்தாததால், சூழலில் உட்பொருளாக இருக்கும் நகரத்தைக் குறைந்த அளவில் வெளிப்படுத்துகிறது.
- source_word: ἔπαθεν
  choice: பாடுபட்டார்
  rationale: πάσχω என்பதன் துன்பம் அனுபவித்தல் என்ற பொருளைச் சுருக்கமாகவும் இயல்பான, கண்ணியமான தமிழிலும் தருகிறது.
theological_decisions:
- issue: பலிசார் சூழலில் ἁγιάζω என்பதன் மொழிபெயர்ப்பு
  choice: புனிதப்படுத்து
  alternative: பரிசுத்தமாக்கு; அர்ப்பணித்துப் புனிதமாக்கு
  rationale: ‘புனிதப்படுத்து’ என்பது வழிபாட்டு மற்றும் உடன்படிக்கை சார்ந்த நிறத்தை வைத்திருக்கிறது; அதை ஒழுக்க மாற்றமாக மட்டும் சுருக்கவோ குறிப்பிட்ட சமயப்பிரிவின் பரிசுத்தமாக்கல் கோட்பாட்டைத் திணிக்கவோ இல்லை.
- issue: τὸν λαόν என்பதன் வரம்பு
  choice: மக்களை
  alternative: தேவனுடைய மக்களை
  rationale: சூழல் தேவனுடைய உடன்படிக்கை மக்களைச் சுட்டினாலும், கிரேக்க மூலத்தில் ‘தேவனுடைய’ என்பது வெளிப்படையாக இல்லை; எனவே முதன்மை உரையில் அதைச் சேர்க்கவில்லை.
- issue: ἔξω τῆς πύλης என்பதில் இடக்குறிப்பு
  choice: நகரவாசலுக்கு வெளியே
  alternative: வாசலுக்கு வெளியே
  rationale: எருசலேம் என்ற பெயரைச் சேர்க்காமல், தமிழில் சொற்றொடரின் இடப்பொருளை இயல்பாக வெளிப்படுத்துகிறது. முந்தைய வசனத்தின் முகாமுக்கு வெளியே கொண்டுசெல்லப்பட்ட பலியுடல் எச்சங்களுடனான தொடர்பு அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘தமது’ மரியாதையையும் திரும்பச்சுட்டும் பொருளையும் தருகிறது; ‘சொந்த’ என்பது ἰδίου என்பதன் வலியுறுத்தலைப் பேணுகிறது. எல்லா அடிக்குறிப்பு குறிகளும் உரையில் இடம்பெற்றுள்ளன.
