revisions:
- from: ஆகவே, இயேசுவும் தமது சொந்த இரத்தத்தின் மூலம் மக்களைப் புனிதப்படுத்துவதற்காக[a], நகரவாசலுக்கு வெளியே பாடுபட்டார்.[b]
  to: ஆகவே, இயேசுவும் தமது சொந்த இரத்தத்தின் மூலம் மக்களைப் புனிதப்படுத்துவதற்காக[a] வாசலுக்கு வெளியே துன்புற்றார்.[b]
  rationale: The revision removes the unstated ‘city’ from the main text, preserving the source’s wording and singular ‘gate,’ while retaining the likely contextual identification in a carefully qualified footnote. It also uses a more precise Tamil verb for suffering and clarifies the lexical alternatives without changing the verse’s meaning.
