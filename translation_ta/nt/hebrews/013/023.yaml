  text: γινώσκετε τὸν ἀδελφὸν ⸀ἡμῶν Τιμόθεον ἀπολελυμένον, μεθ’ οὗ ἐὰν τάχιον ἔρχηται ὄψομαι ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/023.yaml
  text: Know that our brother Timothy has been released[a], with whom I will see you if he comes soon.
translation:
  language: ta
  text: நம் சகோதரர் தீமோத்தேயு விடுவிக்கப்பட்டுள்ளார்[a] என்பதை அறிந்துகொள்ளுங்கள். அவர் விரைவில் வந்தால், அவருடன் சேர்ந்து உங்களைக் காண்பேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘விடுதலை செய்யப்பட்டுள்ளார்.’ இது சிறையிலிருந்தோ காவலிலிருந்தோ விடுவிக்கப்பட்டதைக் குறிக்கலாம். இந்த வினைச்சொல் ‘அனுப்பிவிடப்பட்டுள்ளார்’ அல்லது ‘நீக்கப்பட்டுள்ளார்’ என்றும் பொருள்படலாம்; ஆனால் இச்சூழலில் ‘விடுவிக்கப்பட்டுள்ளார்’ என்பதே மிகப் பொருத்தமான பொருளாகத் தோன்றுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκετε
  choice: அறிந்துகொள்ளுங்கள்
  rationale: நிகழ்கால கட்டளை வடிவத்தின் அறிவுறுத்தும் வலிமையை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: τὸν ἀδελφὸν ἡμῶν
  choice: நம் சகோதரனாகிய
  rationale: கிறிஸ்தவ உறவுமுறை மொழியைத் தக்கவைத்து, தீமோத்தேயுவை குறிப்பாகச் சுட்டுகிறது.
- source_word: Τιμόθεον
  choice: தீமோத்தேயு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: ἀπολελυμένον
  choice: விடுவிக்கப்பட்டிருக்கிறார்
  rationale: முற்றுப்பெற்ற செயலின் தற்போதைய விளைவை உணர்த்தும் நிறைவு செயலெச்சத்தின் பொருளைக் காக்கிறது; காவல் அல்லது சிறையிலிருந்து விடுதலை என்பது சாத்தியமான சூழல், ஆனால் வினைச்சொல்லுக்கு வேறு பொருள்களும் இருக்கலாம்.
- source_word: μεθ’ οὗ
  choice: அவருடன்
  rationale: தீமோத்தேயுவுடன் சேர்ந்து வருவதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐὰν τάχιον ἔρχηται
  choice: அவர் விரைவில் வந்தால்
  rationale: நிபந்தனையையும் τάχιον என்பதன் சூழலுக்கேற்ற ‘விரைவில்’ என்ற பொருளையும் தெளிவாகக் காக்கிறது.
- source_word: ὄψομαι ὑμᾶς
  choice: உங்களைக் காண்பேன்
  rationale: ‘சந்திப்பேன்’ அல்லது ‘வந்து பார்ப்பேன்’ என விளக்காமல், ὁράω என்பதன் நேரடியான பொருளைக் காக்கிறது; தமிழில் வருகை கருத்தை தெளிவாக்க ‘வந்து’ சேர்க்கப்பட்டுள்ளது.
