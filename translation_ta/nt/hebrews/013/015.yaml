id: HEB.13.15
reference: Hebrews 13:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: δι’ αὐτοῦ ⸀οὖν ἀναφέρωμεν θυσίαν αἰνέσεως διὰ παντὸς τῷ θεῷ, τοῦτ’ ἔστιν καρπὸν χειλέων ὁμολογούντων τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/015.yaml
  text: Therefore[a], through him let us continually offer up to God a sacrifice of praise—that is[c][b], the fruit of lips confessing his name.
translation:
  language: ta
  text: ஆகவே, அவர் வழியாக நாம் கடவுளுக்குத் தொடர்ந்து[a] புகழ்ச்சிப் பலியைச் செலுத்துவோமாக; அதாவது, அவருடைய பெயரை அறிக்கையிடும்[b] உதடுகளின் கனி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எப்போதும்” அல்லது “எல்லா நேரங்களிலும்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவருடைய பெயரை ஒப்புக்கொள்ளும்.” கிரேக்க வினை வெளிப்படையாக அறிக்கையிடுதல் அல்லது அங்கீகரித்தல் என்ற பொருள்களைத் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: அவர் வழியாக
  rationale: διά + ஆறாம் வேற்றுமை இங்கு வழிமுறை அல்லது இடைநிலையைச் சுட்டுகிறது. சூழலில் சுட்டுப்பெயர் இயேசுவைக் குறித்தாலும், மூலத்தில் உள்ளபடியே பெயரை விரிவாக்காமல் வைக்கப்பட்டுள்ளது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய கருத்திலிருந்து வரும் முடிவுரையையும் அறிவுறுத்தலையும் இயல்பான தமிழில் தெளிவாக இணைக்கிறது.
- source_word: ἀναφέρωμεν
  choice: நாம் ... செலுத்துவோமாக
  rationale: முதலாம் நபர் பன்மை அறிவுறுத்தல் வினையின் அழைப்புத் தன்மையைப் பாதுகாக்கிறது; ‘செலுத்து’ என்பது பலி உருவகத்துக்கும் இயல்பாகப் பொருந்துகிறது.
- source_word: θυσίαν αἰνέσεως
  choice: புகழ்ச்சிப் பலி
  rationale: புகழ்ச்சியைப் பலியாக முன்வைக்கும் மூலத்தின் பலியியல் உருவகத்தைச் சுருக்கமாகவும் இயல்பாகவும் தக்கவைக்கிறது.
- source_word: διὰ παντός
  choice: தொடர்ந்து
  rationale: ‘எப்போதும்/இடைவிடாமல்’ என்ற காலத் தொடர்ச்சியை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: τῷ θεῷ
  choice: கடவுளுக்கு
  rationale: பலியைப் பெறுபவரைக் குறிக்கும் நான்காம் வேற்றுமையை நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: τοῦτ’ ἔστιν
  choice: அதாவது
  rationale: புகழ்ச்சிப் பலி எதில் அடங்குகிறது என்பதை விளக்கும் மறுகூற்றைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: καρπὸν χειλέων
  choice: உதடுகளின் கனி
  rationale: வேதாகமப் பின்னணியுள்ள உருவகத்தைப் பாதுகாக்கிறது; கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘நமது’ என்பது சேர்க்கப்படவில்லை.
- source_word: ὁμολογούντων
  choice: அறிக்கையிடும்
  rationale: வெளிப்படையாக ஒப்புக்கொள்வது அல்லது ஏற்றுக்கொண்டு அறிவிப்பது என்ற பொருளைத் தருகிறது; ‘புகழும்’ என்று மொழிபெயர்த்து ஒரே பொருளுக்குள் மட்டுப்படுத்தவில்லை.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: அவருடைய பெயரை
  rationale: கிரேக்கத்தில் நான்காம் வேற்றுமை வடிவம் இருந்தாலும், ὁμολογέω உடன் அதன் பொருளை இயல்பான தமிழில் நேரடி செயப்படுபொருளாக வழங்குகிறது.
theological_decisions:
- issue: δι’ αὐτοῦ என்பதிலுள்ள ‘அவர்’ யாரைக் குறிக்கிறது
  choice: உடனடியான சூழலின்படி அது இயேசுவைக் குறிக்கிறது; அவருடைய இடைநிலையின் வழியாகப் புகழ்ச்சிப் பலி கடவுளுக்குச் செலுத்தப்படுகிறது.
  alternative: பெயரைக் குறிப்பிடாமல் பொதுவாக ‘அவர் வழியாக’ என்று மட்டும் வாசித்தல்.
  rationale: முந்தைய வசனங்கள் இயேசுவையும் அவரது துன்பத்தையும் மையப்படுத்துகின்றன. இருப்பினும் மூலத்தில் பெயருக்குப் பதிலாகச் சுட்டுப்பெயர் இருப்பதால், மொழிபெயர்ப்பும் ‘அவர்’ என்பதையே வைத்திருக்கிறது.
- issue: பலியியல் மொழியின் வலிமை
  choice: ‘புகழ்ச்சிப் பலி’ மற்றும் ‘செலுத்துவோமாக’ எனப் பலி உருவகத்தைத் தக்கவைத்தல்.
  alternative: உருவகத்தைத் தளர்த்தி ‘கடவுளைத் தொடர்ந்து புகழ்வோமாக’ என்று மொழிபெயர்த்தல்.
  rationale: இவ்வசனம் புகழ்ச்சியைத் திட்டமிட்டே பலியாகச் சித்தரிக்கிறது. அந்த இறையியல் மற்றும் இலக்கியத் தொடர்பை விளக்கமாக மாற்றாமல் பாதுகாக்க வேண்டும்.
- issue: ὁμολογούντων என்பதன் பொருள்
  choice: ‘அறிக்கையிடும்’—கடவுளுடைய பெயரை வெளிப்படையாக ஒப்புக்கொண்டு அறிவிக்கும் செயல்.
  alternative: ‘ஏற்றுக்கொள்ளும்’ அல்லது சூழலுக்கேற்ப ‘புகழும்’.
  rationale: கிரேக்க வினை வெளிப்படையான அறிக்கை மற்றும் அங்கீகாரம் ஆகிய இரு நிழற்பொருள்களையும் கொண்டிருக்க முடியும். முதன்மை உரை அறிக்கையிடுதலைத் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘உதடுகளின் கனி’ என்ற சற்றே கவித்துவமான வேதாகம உருவகம் திட்டமிட்டே பாதுகாக்கப்பட்டுள்ளது; விளக்கத்திற்காக மூலத்தில் இல்லாத ‘நமது’ சேர்க்கப்படவில்லை.
