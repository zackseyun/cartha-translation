source:
  edition: SBLGNT
  text: ἔχομεν θυσιαστήριον ἐξ οὗ φαγεῖν οὐκ ἔχουσιν ἐξουσίαν οἱ τῇ σκηνῇ λατρεύοντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/010.yaml
  text: We have an altar from which those who serve at the tabernacle have no right to eat[a][b].
translation:
  language: ta
  text: நமக்கு ஒரு பலிபீடம் உண்டு; அதிலிருந்து உண்ணத் திருக்கூடாரப் பணியில் ஈடுபட்டிருப்பவர்களுக்கு உரிமை இல்லை.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் குறிப்பாக, “கூடாரத்தில் பணியாற்றுகிறவர்கள்” என்றும் மொழிபெயர்க்கலாம். இச்சொற்றொடர் பழைய உடன்படிக்கையின் பரிசுத்தக் கூடாரச் சேவையில் ஈடுபட்டவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “பலிபீடம்” என்பது கிறிஸ்து தாமே, சிலுவை, பரலோகப் பலிபீடம், அல்லது கிறிஸ்துவின் பலியால் கிடைக்கும் நன்மைகள் எனப் பலவாறு விளக்கப்படுகிறது. கிரேக்க உரை இங்கு இந்தப் படிமத்தை மேலும் குறிப்பாக விளக்காமல் விடுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχομεν
  choice: நமக்கு ... இருக்கிறது
  rationale: நிகழ்கால வினையின் பொருளையும், எழுத்தாளரும் வாசகர்களும் இதில் உள்ளடங்கியிருப்பதையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: θυσιαστήριον
  choice: பலிபீடம்
  rationale: பலிகள் செலுத்தப்படும் பீடத்தைக் குறிக்கும் நேரடியான, வழக்கிலுள்ள தமிழ் சொல். இதை ‘சிலுவை’ அல்லது ‘பலி’ என்று விளக்கிப் பெயர்க்காமல் மூல உருவகத்தை அப்படியே வைத்திருக்கிறது.
- source_word: ἐξ οὗ
  choice: அதிலிருந்து
  rationale: ἐκ என்பதன் மூலத்தைக் குறிக்கும் பொருளைப் பேணி, பலிபீடத்திலிருந்து உண்பது என்ற உருவகத்தை இயல்பாகத் தருகிறது.
- source_word: φαγεῖν
  choice: உண்பதற்கு
  rationale: ‘உண்ணுதல்’ என்ற மூல வினையின் எளிய பொருளைத் துல்லியமாகக் கொடுக்கிறது.
- source_word: οὐκ ἔχουσιν ἐξουσίαν
  choice: உரிமை இல்லை
  rationale: இங்கு ἐξουσία என்பது பலியில் பங்குபெறுவதற்கான அங்கீகரிக்கப்பட்ட உரிமை அல்லது அனுமதியைக் குறிக்கிறது; ‘அதிகாரம் இல்லை’ என்பதைக் காட்டிலும் ‘உரிமை இல்லை’ சூழலுக்குப் பொருத்தமானது.
- source_word: οἱ τῇ σκηνῇ λατρεύοντες
  choice: திருக்கூடாரத்தில் இறைப்பணி செய்கிறவர்கள்
  rationale: λατρεύω இங்கு பொதுவான வழிபாட்டை மட்டும் அல்லாமல் சமயச் சடங்குசார் பணியைக் குறிக்கிறது. σκηνή என்பது எபிரெயர் நூலின் சூழலில் பழைய உடன்படிக்கையின் பரிசுத்த கூடாரத்தைக் குறிக்கிறது; ‘திருக்கூடாரம்’ இதைச் சுருக்கமாகவும் புரியத்தக்க வகையிலும் தெரிவிக்கிறது.
theological_decisions:
- issue: எபிரெயர் 13:10-இல் ‘பலிபீடம்’ எதைக் குறிக்கிறது?
  choice: முதன்மை உரையில் ‘பலிபீடம்’ என்ற உருவகத்தை விளக்கமின்றி அப்படியே வைத்தல்
  alternative: கிறிஸ்து தாமே; சிலுவை; பரலோகப் பலிபீடம்; அல்லது கிறிஸ்துவின் பலியால் கிடைக்கும் நன்மைகள் என்று குறிப்பாக்குதல்
  rationale: கிரேக்க உரை இங்கு பலிபீடத்தின் குறிப்பிட்ட அடையாளத்தை விளக்கவில்லை. எனவே ஒரு குறிப்பிட்ட இறையியல் விளக்கத்தை மொழிபெயர்ப்பிற்குள் புகுத்தாமல், உரையின் திட்டமிட்ட இறையியல் செறிவையும் தெளிவின்மையையும் பேணுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகமச் சூழலுக்குரிய கண்ணியமும் உள்ள நடை பயன்படுத்தப்பட்டுள்ளது. ‘திருக்கூடாரம்’ பழைய உடன்படிக்கையின் பரிசுத்த கூடாரத்தை எளிதில் அடையாளப்படுத்துகிறது; ‘இறைப்பணி’ சடங்குசார் சேவையைப் பொதுவான ‘வழிபாடு’ என்பதிலிருந்து தெளிவுபடுத்துகிறது.
