source:
  edition: SBLGNT
  text: τίμιος ὁ γάμος ἐν πᾶσιν καὶ ἡ κοίτη ἀμίαντος, πόρνους ⸀γὰρ καὶ μοιχοὺς κρινεῖ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/004.yaml
  text: Let marriage be held in honor among all[a], and the marriage bed be undefiled[b], for God will judge the sexually immoral and adulterers.
translation:
  language: ta
  text: திருமணம் அனைவராலும் மதிக்கப்படட்டும்[a][b]; திருமணப் படுக்கையும் களங்கப்படாததாக இருக்கட்டும். ஏனெனில், பாலியல் ஒழுக்கக்கேட்டில் ஈடுபடுகிறவர்களையும் திருமணத் துரோகம் செய்கிறவர்களையும் கடவுள் நியாயந்தீர்ப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திருமணம் அனைவரிடமும் மதிப்புக்குரியது.” முதல் கூற்றில் கிரேக்கத்தில் வெளிப்படையான வினைச்சொல் இல்லை. எனவே, இதை அறிவுறுத்தலாகவோ அல்லது ஒரு நிலையைத் தெரிவிக்கும் கூற்றாகவோ வாசிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: “அனைவராலும்” என்பதற்குப் பதிலாக, “அனைவரிடமும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίμιος
  choice: மதிப்புக்குரியதாக இருக்கட்டும்
  rationale: இந்தச் சொல் மதிக்கப்படுதல், மேன்மையாகக் கருதப்படுதல், விலைமதிப்புடையதாக இருத்தல் ஆகிய பொருள்களை உடையது. சுற்றியுள்ள அறிவுரைகளின் ஓட்டத்துக்கு ஏற்றவாறு இது அறிவுறுத்தலாக மொழிபெயர்க்கப்பட்டுள்ளது; அதேவேளை வினைச்சொல் இல்லாத கிரேக்கத்தின் மாற்று வாசிப்பு அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: γάμος
  choice: திருமணம்
  rationale: இங்கு திருமண விழாவை அல்ல, திருமண உறவு அல்லது நிலையைச் சுட்டுகிறது; நவீனத் தமிழில் இயல்பானதும் துல்லியமானதும் ‘திருமணம்’ ஆகும்.
- source_word: ἐν πᾶσιν
  choice: எல்லாரிடையிலும்
  rationale: இங்குள்ள பன்மை வடிவம் மக்களைக் குறிப்பதாக இயல்பாகப் புரிகிறது. ‘எல்லாரிடையிலும்’ என்பது திருமணத்திற்கு வழங்கப்பட வேண்டிய பரந்த சமூக மதிப்பைத் தெரிவிக்கிறது; ‘எல்லாராலும்’ என்ற இலக்கணரீதியாகச் சாத்தியமான வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: κοίτη
  choice: திருமணப் படுக்கை
  rationale: சொல்லின் நேரடிப் பொருள் ‘படுக்கை’; இங்கு அது பாலுறவைக் குறிக்கும் ஆகுபெயராக, திருமணத்துடன் இணைந்து வருகிறது. ‘திருமணப் படுக்கை’ மூலத்தின் உருவகத்தையும் திருமணச் சூழலையும் காக்கிறது.
- source_word: ἀμίαντος
  choice: களங்கப்படாததாக
  rationale: ‘தீட்டுப்படாத, கறைபடாத, தூய’ என்ற பொருளுடைய சொல்லின் ஒழுக்க மற்றும் தூய்மை சார்ந்த ஒலிப்பை ‘களங்கப்படாததாக’ காக்கிறது.
- source_word: πόρνους
  choice: பாலியல் ஒழுக்கக்கேட்டில் ஈடுபடுகிறவர்கள்
  rationale: இந்தச் சொல் பாலியல் ஒழுக்கக்கேட்டில் ஈடுபடுவோரைக் பரந்த வகையில் குறிக்கிறது. பழமையான அல்லது பொருளைக் குறுகச் செய்யும் சொல்லைத் தவிர்த்து, தற்போதைய தமிழில் தெளிவாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: μοιχούς
  choice: விபசாரம் செய்கிறவர்கள்
  rationale: திருமணத் துரோகமாகிய விபசாரத்தில் ஈடுபடுவோரைக் குறிப்பாகக் குறிக்கிறது; முந்தைய பரந்த பிரிவிலிருந்து உள்ள வேறுபாடு பாதுகாக்கப்படுகிறது.
- source_word: κρινεῖ
  choice: நியாயந்தீர்ப்பார்
  rationale: எதிர்காலக் காலத்தையும் கடவுளின் தீர்ப்பையும் தெரிவிக்கிறது. மூலச்சொல் தீர்ப்பின் முடிவைத் தானாகவே ‘தண்டனை’ என்று நிர்ணயிக்காததால், அதைவிட வலுவாக மொழிபெயர்க்கப்படவில்லை.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான காரணத்தை அறிமுகப்படுத்தும் தர்க்கத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: முதல் கூற்று அறிவுறுத்தலா அல்லது நிலையைத் தெரிவிக்கும் வாக்கியமா?
  choice: ‘மதிப்புக்குரியதாக இருக்கட்டும்’ என்ற அறிவுறுத்தல் வாசிப்பு
  alternative: ‘திருமணம் எல்லாரிடையிலும் மதிப்புக்குரியது’ என்ற தெரிவிப்பு வாசிப்பு
  rationale: கிரேக்கத்தில் வெளிப்படையான வினைச்சொல் இல்லை; எனவே இரு வாசிப்புகளும் சாத்தியம். எபிரெயர் 13-ஆம் அதிகாரத்தில் தொடர்ச்சியாக வரும் ஒழுக்க அறிவுறுத்தல்களின் சூழல் அறிவுறுத்தல் வாசிப்பை ஆதரிக்கிறது. இருப்பினும் உண்மையான இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘திருமணப் படுக்கை’ என்ற வேதாகம உருவகம் பாதுகாக்கப்பட்டிருக்கிறது; பாலியல் ஒழுக்கம் குறித்த சொற்கள் பழமையோ தேவையற்ற மறைபொருளோ இன்றி தெளிவாகத் தரப்பட்டுள்ளன.
