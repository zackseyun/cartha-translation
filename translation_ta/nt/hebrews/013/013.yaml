  text: τοίνυν ἐξερχώμεθα πρὸς αὐτὸν ἔξω τῆς παρεμβολῆς, τὸν ὀνειδισμὸν αὐτοῦ φέροντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/013.yaml
  text: Therefore[a], let us go out to him outside the camp, bearing his reproach.
translation:
  language: ta
  text: ஆகவே, அவரது நிந்தையைச் சுமந்துகொண்டு, பாளயத்திற்கு வெளியே அவரை நோக்கிச் செல்வோம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘முகாமிற்கு வெளியே’ என்றும் மொழிபெயர்க்கலாம். இச்சொற்றொடர் லேவியராகமம் 16-இன் பலிமுறை சார்ந்த உருவகத்தையும், இயேசு நகரத்திற்கு வெளியே அனுபவித்த நிராகரிப்பையும் நினைவூட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοίνυν
  choice: ஆகவே
  rationale: முந்தைய வாதத்திலிருந்து, குறிப்பாக 13:11–12 இலிருந்து, எடுக்கப்படும் முடிவை இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ἐξερχώμεθα
  choice: புறப்பட்டுச் செல்வோம்
  rationale: முதல் நபர் பன்மை exhortative subjunctive-இன் அழைப்புத் தன்மையைப் பேணுகிறது; வெறுமனே ‘வெளியே செல்வோம்’ என்பதைக் காட்டிலும் அடுத்துவரும் ‘அவரிடம்’ என்ற திசைநோக்கிய சொற்றொடருடன் இயல்பாக அமைகிறது.
- source_word: πρὸς αὐτὸν
  choice: அவரிடம்
  rationale: ஒரு நபரை நோக்கிய நகர்வைக் குறிக்கும் πρός என்பதன் பொருளை இயல்பாக வழங்குகிறது; சூழலில் சுட்டப்படுவது இயேசு என்றாலும், மூலத்தின் பிரதிப்பெயர் அப்படியே வைக்கப்படுகிறது.
- source_word: ἔξω τῆς παρεμβολῆς
  choice: பாளயத்திற்கு வெளியே
  rationale: லேவியராகமப் பலியிடும் பின்னணியையும் எபிரெயர் நூலின் பாளய உருவகத்தையும் காக்கிறது; அதை மத அமைப்பு அல்லது சமூகம் என்று விளக்கவுரையாக்கவில்லை.
- source_word: τὸν ὀνειδισμὸν αὐτοῦ
  choice: அவரது நிந்தையை
  rationale: ὀνειδισμός குறிக்கும் அவமதிப்பு, பழிப்பு, சமூக இழிவு ஆகிய பரப்பை ‘நிந்தை’ தக்கவைக்கிறது. ‘அவரது’ என்பது அந்த நிந்தை அவரை நோக்கியதா அல்லது அவரோடு தொடர்புடையதா என்ற மூலத்தின் சுருக்கத்தையும் ஓரளவு பேணுகிறது.
- source_word: φέροντες
  choice: சுமந்துகொண்டு
  rationale: நிந்தையை ஏற்றுச் சுமக்கும் தொடர்ச்சியான பங்கேற்பை வெளிப்படுத்துகிறது; ‘சகித்துக்கொண்டு’ என்று மொழிபெயர்த்து பொருளை அதிகமாக விளக்குவதைக் தவிர்க்கிறது.
theological_decisions:
- issue: ‘அவர்’ என்பதன் குறிப்பு
  choice: முந்தைய வசனச் சூழலில் இயேசுவைக் குறிக்கும் பிரதிப்பெயராகவே வைத்தல்
  alternative: ‘இயேசுவிடம்’ என்று பெயரை வெளிப்படையாகச் சேர்த்தல்
  rationale: 13:12 இயேசுவைத் தெளிவாகக் குறிப்பிடுகிறது; ஆயினும் கிரேக்க உரை இங்கே αὐτόν என்ற பிரதிப்பெயரையே பயன்படுத்துவதால் மொழிபெயர்ப்பும் அதை மாற்றாமல் காக்கிறது.
- issue: ‘பாளயத்திற்கு வெளியே’ என்பதன் பொருள்
  choice: பலியிடும் முறையோடும் நிராகரிப்போடும் தொடர்புடைய மூல உருவகத்தை அப்படியே வைத்தல்
  alternative: ‘மத அமைப்பிற்கு வெளியே’ அல்லது ‘சமூகத்திற்கு வெளியே’ என்று விளக்கிப் பெயர்த்தல்
  rationale: எபிரெயர் 13:11–13 மற்றும் லேவியராகமம் 16 ஆகியவற்றின் தொடர்பை உருவகம் சுமக்கிறது. குறிப்பிட்ட அமைப்பை மட்டும் குறிக்கும் விளக்கவுரை மூலத்தில் உள்ள பல அடுக்குப் பொருளைச் சுருக்கிவிடும்.
- issue: ‘அவரது நிந்தை’ என்பதன் உறவு
  choice: உரிமை/தொடர்பு வடிவைத் தக்கவைத்து, இயேசுவின் நிராகரிப்பில் விசுவாசிகள் பங்குகொள்வதைக் சூழலிலிருந்து உணர விடுதல்
  alternative: ‘அவர் அடைந்த நிந்தை’ அல்லது ‘அவர்மீது சுமத்தப்பட்ட நிந்தை’ என்று வெளிப்படையாக விளக்குதல்
  rationale: மூலத்தின் genitive வடிவம் சுருக்கமானது. அதை விரித்து ஒரே உறவாக நிர்ணயிக்காமல் இருப்பது உண்மையான மொழியியல் மற்றும் இறையியல் அழுத்தத்தைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘பாளயம்’, ‘நிந்தை’ ஆகிய சொற்கள் வேதாகமத் தொடர்பைத் தக்கவைத்தாலும் வாக்கிய அமைப்பு இயல்பாக வைக்கப்பட்டுள்ளது; பிரதிப்பெயரும் உருவகமும் தேவையற்ற விளக்கமின்றிப் பாதுகாக்கப்பட்டுள்ளன.
