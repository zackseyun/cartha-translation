revisions:
- from: உங்களை வழிநடத்துகிறவர்களின் சொல்லை ஏற்று, அவர்களுக்கு இணங்கி நடங்கள்[a]. ஏனெனில், கணக்குக் கொடுக்க வேண்டியவர்களாக அவர்கள் உங்கள் உயிர்களுக்காக விழிப்புடன் காவல் காக்கிறார்கள். அவர்கள் இதை மகிழ்ச்சியோடு செய்யும்படியும், பெருமூச்சுவிட்டுச் செய்யாதபடியும் இவ்வாறு நடங்கள்; அவர்கள் பெருமூச்சுவிட்டுச் செய்வது உங்களுக்கு நன்மை பயக்காது.
  to: உங்களை வழிநடத்துகிறவர்களின் சொல்லை ஏற்று, அவர்களுக்கு இணங்கி நடங்கள்[a]. ஏனெனில், கணக்குக் கொடுக்க வேண்டியவர்களாக அவர்கள் உங்கள் ஆத்துமாக்களைக் கவனித்து விழித்திருக்கிறார்கள். அவர்கள் இதை மகிழ்ச்சியோடு செய்யவும், பெருமூச்சுடன் செய்யாமலும் இருக்கும்படி நடங்கள்; ஏனெனில், அது உங்களுக்கு நன்மை பயக்காது.
  rationale: The revision changes only the rendering of ψυχῶν and clarifies the purpose clause’s Tamil syntax. It preserves the source’s two distinct commands, the leaders’ accountable vigilance, and the statement that their groaning would not benefit the hearers. No doctrinal limitation or expansion has been added.
