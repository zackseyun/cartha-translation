    rationale: «அவர்கள் இதை ... செய்யும்படியும் ... இவ்வாறு நடங்கள்» leaves the logical relation and referent somewhat opaque. Retaining «அவர்கள் இதை ... செய்யவும் ... இருக்கும்படி நடங்கள்» more clearly conveys ἵνα ... ποιῶσιν.
