source:
  edition: SBLGNT
  text: Πείθεσθε τοῖς ἡγουμένοις ὑμῶν καὶ ὑπείκετε, αὐτοὶ γὰρ ἀγρυπνοῦσιν ὑπὲρ τῶν ψυχῶν ὑμῶν ὡς λόγον ἀποδώσοντες, ἵνα μετὰ χαρᾶς τοῦτο ποιῶσιν καὶ μὴ στενάζοντες, ἀλυσιτελὲς γὰρ ὑμῖν τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/017.yaml
  text: Be persuaded by your leaders and yield to them[a], for they are keeping watch over your souls as those who will give an account, so that they may do this with joy and not with groaning, for this would be unprofitable for you.
translation:
  language: ta
  text: உங்களை வழிநடத்துகிறவர்களின் சொல்லை ஏற்று, அவர்களுக்கு இணங்கி நடங்கள்[a]. ஏனெனில், கணக்குக் கொடுக்க வேண்டியவர்களாக அவர்கள் உங்கள் ஆத்துமாக்களைக் கவனித்து விழித்திருக்கிறார்கள். அவர்கள் இதை மகிழ்ச்சியோடு செய்யவும், பெருமூச்சுடன் செய்யாமலும் இருக்கும்படி நடங்கள்; ஏனெனில், அது உங்களுக்கு நன்மை பயக்காது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “உங்களை வழிநடத்துகிறவர்களுக்குக் கீழ்ப்படிந்து, அவர்களுக்கு இணங்கி நடங்கள்.” Πείθεσθε என்ற கிரேக்கச் சொல் ‘கீழ்ப்படியுங்கள்’ என்ற பொருளையும் தரலாம்; இன்னும் நேரடியாக, ஒருவருடைய சொல்லால் இணங்கச் செய்யப்படுவதையோ அதை ஏற்றுக்கொள்வதையோ சுட்டுகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πείθεσθε
  choice: சொல்லை ஏற்று
  rationale: இந்த நடுத்தர/செயப்பாட்டு ஏவல் வடிவம் ‘இணங்கச் செய்யப்படுங்கள், ஏற்றுக்கொள்ளுங்கள்’ என்றும், நீட்சியாக ‘கீழ்ப்படியுங்கள்’ என்றும் பொருள்படலாம். ‘சொல்லை ஏற்று’ என்பது வெறும் கட்டாயக் கீழ்ப்படிதலைவிட, நம்பி ஏற்றுக்கொண்டு அதற்குப் பதிலளிக்கும் உறவுசார் நுணுக்கத்தை இயல்பான தமிழில் காக்கிறது; பொதுவான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἡγουμένοις
  choice: உங்களை வழிநடத்துகிறவர்கள்
  rationale: இங்கு சமூகத்தில் அங்கீகரிக்கப்பட்ட வழிநடத்துநர்களைக் குறிக்கிறது. ‘வழிநடத்துகிறவர்கள்’ என்பது மூலத்தின் வினைச்சொல் தன்மையைக் காத்து, தேவையற்ற அதிகாரவாத வலிமையைச் சேர்க்காமல் நவீன தமிழில் தெளிவாக உள்ளது.
- source_word: ὑπείκετε
  choice: அவர்களுக்கு இணங்கி நடங்கள்
  rationale: ὑπείκω என்பது இடங்கொடுத்தல், விட்டுக்கொடுத்தல், இணங்குதல் ஆகிய பொருள்களைக் கொண்டது. ‘இணங்கி நடங்கள்’ என்பது முதல் ஏவலோடு ஒன்றாகக் கலந்துவிடாமல், அதற்குப் பதிலளிக்கும் நடைமுறைச் செயலையும் தெளிவாக்குகிறது.
- source_word: ἀγρυπνοῦσιν
  choice: விழிப்புடன் காவல் காக்கிறார்கள்
  rationale: இந்த வினை தூங்காமல் விழித்திருக்கும் விழிப்புணர்வை உருவகமாகக் கொண்டது. இங்கு பொறுப்புள்ள தொடர்ந்த கவனிப்பைக் குறிக்குவதால், ‘விழிப்புடன் காவல் காக்கிறார்கள்’ என்பது உருவகத்தையும் சூழலையும் காக்கிறது.
- source_word: ψυχῶν
  choice: உயிர்கள்
  rationale: ψυχή என்பது உயிர், ஆள், தன்முழுமை அல்லது ஆன்மா எனப் பொருள்படலாம். ‘உயிர்கள்’ என்பது மனிதர்களின் முழுமையான நலனைக் குறிக்கும் இயல்பான தமிழாகவும், சொல்லின் உயிர்சார் தீவிரத்தை இழக்காததாகவும் உள்ளது; ‘ஆத்துமாக்கள்’ என்பது இன்றைய பொதுவழக்கில் அதிகம் பழமையான சமயச்சொல்லாக ஒலிக்கும்.
- source_word: ὡς λόγον ἀποδώσοντες
  choice: கணக்குக் கொடுக்க வேண்டியவர்களாக
  rationale: வருங்காலப் பங்கேற்பு வடிவம் அவர்களுக்கு முன்நிற்கும் பொறுப்பையும் கணக்கு அளிக்க வேண்டிய நிலையையும் குறிக்கிறது. யாரிடம் கணக்குக் கொடுக்க வேண்டும் என்பதை மூலவசனம் வெளிப்படையாகச் சொல்லாததால் மொழிபெயர்ப்பிலும் சேர்க்கப்படவில்லை.
- source_word: μετὰ χαρᾶς
  choice: மகிழ்ச்சியோடு
  rationale: மூலத்தின் முன்னிடைச்சொல் அமைப்பையும் செயல் நிகழும் மனநிலையையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: στενάζοντες
  choice: பெருமூச்சுவிட்டுச்
  rationale: στενάζω துயரத்தால் அல்லது சுமையால் முனகுதல், பெருமூச்சுவிடுதல் என்பதைக் குறிக்கிறது. ‘பெருமூச்சுவிட்டுச்’ என்பது அதை வெறும் வருத்தம் என்ற கருத்தாக மாற்றாமல், மூலத்தின் உணரக்கூடிய உருவகத்தைப் பேணுகிறது.
- source_word: ἀλυσιτελὲς
  choice: நன்மை பயக்காது
  rationale: இச்சொல் பயனளிக்காதது அல்லது அனுகூலமற்றது என்பதைக் குறிக்கிறது. ‘நன்மை பயக்காது’ என்பது நவீன தமிழில் தெளிவானது; ‘தீங்கு விளைவிக்கும்’ என்பது மூலத்தைவிட வலிமையானதாகிவிடும்.
theological_decisions:
- issue: சபை வழிநடத்துநர்களை நோக்கிய அறிவுரையின் தன்மை
  choice: அங்கீகரிக்கப்பட்ட வழிநடத்துநர்களின் சொல்லை நம்பிக்கையுடன் ஏற்று, அவர்களுக்கு இணங்கி நடக்குமாறு வசனம் அழைக்கிறது; கட்டுப்பாடற்ற அதிகாரத்திற்கான முழுமையான கீழ்ப்படிதலை மொழிபெயர்ப்பு வலியுறுத்தவில்லை.
  alternative: வழிநடத்துநர்களுக்கு முழுமையாகக் கீழ்ப்படிய வேண்டும் என்ற வலிமையான கட்டளை.
  rationale: Πείθεσθε, ὑπείκετε என்ற இரு வினைகளும் ஏற்றுக்கொள்ளும் நம்பிக்கையையும் இணக்கத்தையும் காட்டுகின்றன. அதேவேளை, வழிநடத்துநர்கள் கணக்குக் கொடுக்க வேண்டிய பொறுப்புள்ள காவலர்கள் என்ற காரணவாக்கியம் அவர்களுடைய அதிகாரத்தைப் பொறுப்புக்குள் நிறுத்துகிறது. எனவே மூலத்தில் இல்லாத கட்டுப்பாடற்ற அதிகாரத்தையோ, அதற்கு எதிரான வரம்பையோ உரையில் சேர்க்காமல் பதற்றம் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘தலைவர்கள்’ என்பதற்குப் பதிலாக மூலத்தின் பங்கேற்பு வடிவத்தை நெருக்கமாகக் காக்க ‘உங்களை வழிநடத்துகிறவர்கள்’ பயன்படுத்தப்பட்டது. பழமையான ‘ஆத்துமாக்கள்’, அதிகாரவாதமாக ஒலிக்கக்கூடிய ‘அடிபணியுங்கள்’ போன்ற சொற்கள் தவிர்க்கப்பட்டன. காரணம் மற்றும் நோக்கத்தின் நீண்ட கிரேக்க வாக்கியத் தொடர்பு தமிழில் தெளிவாக இருக்க இரண்டு வாக்கியங்களாக அமைக்கப்பட்டாலும், தர்க்க ஓட்டம் காக்கப்பட்டுள்ளது.
