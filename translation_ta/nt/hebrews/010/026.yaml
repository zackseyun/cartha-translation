  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἑκουσίως γὰρ ἁμαρτανόντων ἡμῶν μετὰ τὸ λαβεῖν τὴν ἐπίγνωσιν τῆς ἀληθείας, οὐκέτι περὶ ἁμαρτιῶν ἀπολείπεται θυσία,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/026.yaml
  text: For if we go on sinning deliberately after receiving the knowledge of the truth[a], there no longer remains a sacrifice for sins,
translation:
  language: ta
  text: ஏனெனில், சத்தியத்தைப் பற்றிய அறிவைப்[அ] பெற்ற பின் நாம் வேண்டுமென்றே தொடர்ந்து பாவம் செய்தால், பாவங்களுக்கான பலி இனி எதுவும் எஞ்சியிருக்காது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: அ
    text: அல்லது, “சத்தியத்தைப் பற்றிய முழு அறிவு.” கிரேக்கச் சொல் ஆழமான அல்லது தீர்மானகரமான அறிவு என்ற நுணுக்கத்தையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑκουσίως
  choice: வேண்டுமென்றே
  rationale: தற்செயலாக அல்லாமல் அறிந்தே, மனமுவந்து செய்யும் நோக்கத்தைக் காட்டும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கருத்துக்கான விளக்கத் தொடர்பைத் தெளிவாகத் தக்கவைக்கிறது.
- source_word: ἁμαρτανόντων ἡμῶν
  choice: நாம் தொடர்ந்து பாவம் செய்தால்
  rationale: நிகழ்காலப் பங்கேற்புவினையின் நீடித்த அல்லது தொடரும் செயல் நுணுக்கத்தைத் தமிழில் வெளிப்படுத்துகிறது; நிபந்தனை வடிவம் கிரேக்க genitive absolute அமைப்பை இயல்பாக எடுத்துரைக்கிறது.
- source_word: μετὰ τὸ λαβεῖν
  choice: பெற்ற பின்பும்
  rationale: அறிவைப் பெற்றது முன்னதாக நிகழ்ந்ததைக் காட்டுகிறது; 'பின்பும்' என்பது அந்தப் பெறுதலுக்குப் பிறகும் பாவம் தொடர்வதிலுள்ள எச்சரிக்கைத் தீவிரத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐπίγνωσιν
  choice: அறிவு
  rationale: சொல்லின் அடிப்படைப் பொருளைத் தக்கவைக்கிறது; 'முழுமையான அறிவு' என்ற வலுவான சாத்தியத்தை முதன்மை உரையில் கட்டாயப்படுத்தாமல் விடுகிறது.
- source_word: τῆς ἀληθείας
  choice: சத்தியத்தைப் பற்றிய
  rationale: குறிப்பிட்ட சத்தியத்தைக் குறிக்கும் கிரேக்க உறவுநிலையை இயல்பான தமிழில் தருகிறது.
- source_word: οὐκέτι
  choice: இனி ... எதுவும்
  rationale: அந்த நிலையிலிருந்து மேலும் ஒன்றும் இல்லை என்ற நிறுத்தத்தையும் முழுமையையும் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: περὶ ἁμαρτιῶν
  choice: பாவங்களுக்கான
  rationale: பலியிடுதல் சார்ந்த சூழலில் பாவங்களை முன்னிட்டு அல்லது அவற்றுக்காகச் செலுத்தப்படும் பலி என்ற பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: ἀπολείπεται
  choice: எஞ்சியிராது
  rationale: '''மீதியாக இருப்பதில்லை'' என்ற பொருளை இயல்பான எதிர்கால நிபந்தனைத் தொடரில் வெளிப்படுத்துகிறது.'
- source_word: θυσία
  choice: பலி
  rationale: எபிரெயர் நூலின் பலியியல் வாதத்துக்கு ஏற்ற நிலையான, தெளிவான தமிழ் சொல்.
theological_decisions:
- issue: ἁμαρτανόντων என்பதன் காலவகை மற்றும் எச்சரிக்கையின் நோக்கம்
  choice: தொடர்ந்து பாவம் செய்தால்
  alternative: வேண்டுமென்றே பாவம் செய்தால்
  rationale: நிகழ்காலப் பங்கேற்புவினை தொடர்ச்சியான அல்லது நிலைத்த செயலை இயல்பாகச் சுட்டுகிறது. இதனால் ஓர் தனிப்பட்ட பாவமே இங்கு தீர்மானமாகக் குறிக்கப்படுகிறது என்று மிகைப்படுத்தாமல் எச்சரிக்கையின் தீவிரம் காக்கப்படுகிறது.
- issue: ἐπίγνωσις என்பதன் இறையியல் ஆழம்
  choice: சத்தியத்தைப் பற்றிய அறிவு
  alternative: சத்தியத்தைப் பற்றிய முழுமையான அறிவு
  rationale: உரை அறிவைப் பெற்றதாகச் சொல்கிறது; ஆனால் அது இரட்சிப்பளிக்கும் மறுபிறப்பை அவசியம் குறிக்கிறதா என்பதை இவ்வசனம் தனியே வரையறுக்கவில்லை. ஆகவே குறிப்பிட்ட கோட்பாட்டுத் தீர்வை மொழிபெயர்ப்புக்குள் புகுத்தவில்லை.
- issue: οὐκέτι ... θυσία என்ற கூற்றின் வரம்பு
  choice: பாவங்களுக்கான பலி இனி எதுவும் எஞ்சியிராது
  alternative: அவர்களுக்காக இனி எந்தப் பலியும் இல்லை
  rationale: கிரேக்க உரையில் வெளிப்படையாக இல்லாத 'அவர்களுக்காக' என்பதைச் சேர்க்காமல், பலி எஞ்சாதது என்ற கடுமையான கூற்றை அதன் இறையியல் பதற்றத்தோடு தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடியதாயும் எபிரெயர் நூலின் பலியியல் மொழிக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. தொடர்ச்சியான பாவச்செயலைத் தெளிவாக்கும் வகையில் 'தொடர்ந்து' சேர்க்கப்பட்டுள்ளது. ἐπίγνωσις என்பதற்கான 'முழுமையான அறிவு' என்ற சாத்தியம் உண்மையானதாயினும், தமிழில் 'அறிவு' என்பதே அதை முற்றிலும் விலக்காததால் தேவையற்ற அடிக்குறிப்பு சேர்க்கப்படவில்லை.
