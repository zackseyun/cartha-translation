source:
  edition: SBLGNT
  text: φοβερὰ δέ τις ἐκδοχὴ κρίσεως καὶ πυρὸς ζῆλος ἐσθίειν μέλλοντος τοὺς ὑπεναντίους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/027.yaml
  text: but a fearful expectation of judgment[a], and a fury of fire about to consume the adversaries.
translation:
  language: ta
  text: ஆனால், நியாயத்தீர்ப்பைப் பற்றிய பயங்கரமான எதிர்பார்ப்பும், எதிர்த்து நிற்பவர்களை விழுங்கவிருக்கும் நெருப்பின் கடுஞ்சீற்றமும் இருக்கின்றன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மாற்றாக, “எதிர்த்து நிற்பவர்களை விழுங்கவிருக்கும் நெருப்பின் ஆவேசம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: πυρὸς ζῆλος என்ற செறிவான கிரேக்கத் தொடருக்கு, ‘கடுஞ்சீற்றம்’ என்பதற்குப் பதிலான இயல்பான மாற்றுவடிவத்தைப் பதிவு செய்ய.
lexical_decisions:
- source_word: φοβερὰ
  choice: பயங்கரமான
  rationale: எதிர்பார்க்கப்படும் நியாயத்தீர்ப்பின் அச்சமூட்டும் தன்மையை நேரடியாகவும் இயல்பான தமிழிலும் தெரிவிக்கிறது.
- source_word: δέ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட மறுப்புக்கு மாறான விளைவை அறிமுகப்படுத்தும் எதிர்மறை இணைப்பைத் தக்கவைக்கிறது.
- source_word: τις
  choice: ஒரு (தமிழில் தனியே வெளிப்படுத்தப்படவில்லை)
  rationale: கிரேக்கத்தில் இது வரையறுக்கப்படாத ஆனால் உண்மையான எதிர்பார்ப்பைக் குறிக்கிறது; தமிழில் ‘ஒருவிதமான’ என்று வெளிப்படையாகச் சேர்ப்பது தேவையற்ற மங்கலையோ பலவீனத்தையோ ஏற்படுத்தும் என்பதால் பெயர்த்தொடரின் இயல்பான வடிவிலேயே அதன் பொருள் அடங்கியுள்ளது.
- source_word: ἐκδοχὴ
  choice: எதிர்பார்ப்பு
  rationale: வரவிருப்பதை எதிர்நோக்கியிருத்தல் என்ற பெயர்ச்சொல்லின் அடிப்படைப் பொருளைத் தக்கவைக்கிறது.
- source_word: κρίσεως
  choice: நியாயத்தீர்ப்பைப் பற்றிய
  rationale: நீதித்தீர்ப்பைக் குறிக்கும் பரந்த பொருளைத் தக்கவைத்து, ‘தண்டனைத்தீர்ப்பு’ போன்ற குறுகிய விளக்கத்தை உரைக்குள் சேர்க்காமல் விடுகிறது.
- source_word: πυρὸς ζῆλος
  choice: நெருப்பின் கடுஞ்சீற்றம்
  rationale: சுருக்கமான கிரேக்க உருவகத்தின் தீவிரத்தையும் நெருப்புக்கு அளிக்கப்படும் செயற்பண்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; ζῆλος என்பதன் இச்சூழலுக்குரிய கடுமையான ஆவேசத்தை ‘கடுஞ்சீற்றம்’ எடுத்துரைக்கிறது.
- source_word: ἐσθίειν
  choice: விழுங்க
  rationale: அழித்தொழிக்கும் நெருப்பின் உயிர்ப்புள்ள உருவகத்தை ‘நுகர்ந்துவிடு’ என்பதைக் காட்டிலும் இயல்பாகவும் வலிமையாகவும் தருகிறது.
- source_word: μέλλοντος
  choice: விருக்கும்
  rationale: செயல் நிகழவிருப்பதைக் குறிக்கும் μέλλω-வின் வருங்கால நோக்கைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: τοὺς ὑπεναντίους
  choice: எதிர்த்து நிற்பவர்களை
  rationale: வெறும் தனிப்பட்ட ‘எதிரிகள்’ என்பதைக் காட்டிலும், எதிர்நிலையில் இருப்பவர்களைச் சுட்டும் கிரேக்கச் சொல்லின் செயற்பொருளைத் தக்கவைக்கிறது.
theological_decisions:
- issue: நியாயத்தீர்ப்பின் நெருப்பு உருவகத்தின் இயல்பு
  choice: எதிர்த்து நிற்பவர்களை விழுங்கும் நெருப்பின் கடுஞ்சீற்றம் என்ற தீவிர உருவகத்தை அப்படியே தக்கவைத்தல்
  alternative: இதை வெளிப்படையாக நித்திய தண்டனை என்று விளக்குதல் அல்லது வெறும் உவமை என்று மென்மைப்படுத்துதல்
  rationale: வசனம் கடுமையான இறை நியாயத்தீர்ப்பைச் சித்தரிக்கிறது; ஆனால் அதன் எல்லா கோட்பாட்டுச் சிறப்புகளையும் இங்கே வரையறுப்பதில்லை. ஆகவே உரையின் எச்சரிக்கை வலிமை தக்கவைக்கப்பட்டு, கூடுதல் கோட்பாட்டு முடிவு சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, தீவிரமான எச்சரிக்கை நடையைப் பயன்படுத்துகிறது. முந்தைய வசனத்தோடு உள்ள தொடர்பை ‘ஆனால்’ என்பதும், தமிழில் வாக்கியத்தை நிறைவு செய்ய ‘இருக்கின்றன’ என்பதும் வெளிப்படுத்துகின்றன. ‘கடுஞ்சீற்றம்’ இயல்பான தமிழில் உருவகத்தின் வலிமையைப் பேணுகிறது.
