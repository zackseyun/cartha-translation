  edition: SBLGNT
  text: ἀδύνατον γὰρ αἷμα ταύρων καὶ τράγων ἀφαιρεῖν ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/004.yaml
  text: For it is impossible for the blood of bulls and goats to take away sins[a].
translation:
  language: ta
  text: ஏனெனில், காளைகள் மற்றும் வெள்ளாடுகளின் இரத்தம் பாவங்களை நீக்க இயலாது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பாவங்களை அகற்ற.’ கிரேக்க வினைச்சொல் நீக்குதல் அல்லது அகற்றுதல் என்ற பொருளைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδύνατον
  choice: இயலாதது
  rationale: வினையெச்சத்துடன் ஆளற்ற பயனிலையில் வரும் இந்தச் சொல், பாவங்களை நீக்குவது முற்றிலும் இயலாது என்ற வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வாதத்திற்கான விளக்கக் காரணத்தை அறிமுகப்படுத்தும் இணைப்பாக உள்ளது.
- source_word: αἷμα
  choice: இரத்தம்
  rationale: எழுத்தாளர் பலியின் இரத்தத்தையே நேரடியாகக் குறிப்பிடுவதால், ‘பலி’ அல்லது ‘மரணம்’ என்று உரைமாற்றாமல் சொற்பொருள் பாதுகாக்கப்படுகிறது.
- source_word: ταύρων
  choice: காளைகளின்
  rationale: ஆண்பால் மாடுகளைக் குறிக்கும் பன்மை உடைமை வடிவத்தைத் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: τράγων
  choice: வெள்ளாடுகளின்
  rationale: இச்சொல் குறிப்பாக ஆண் வெள்ளாட்டைக் குறிக்கக்கூடும்; எனினும் பலிச் சூழலில் இயல்பான தமிழுக்காக ‘வெள்ளாடுகள்’ என வழங்கப்படுகிறது.
- source_word: ἀφαιρεῖν
  choice: நீக்குவது
  rationale: பாவங்களை அகற்றுதல் அல்லது எடுத்துப்போடுதல் என்ற வினையின் கருத்தை இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: ἁμαρτίας
  choice: பாவங்களை
  rationale: கிரேக்க மூலத்தின் வெளிப்படையான பன்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: எபிரெயர் நிருபத்தில் மிருகப் பலிகளின் பயன்
  choice: மிருகங்களின் இரத்தத்தால் பாவங்களை நீக்குவது இயலாது என்ற வசனத்தின் முழு வலிமையை அப்படியே வைத்தல்
  alternative: அவை பாவங்களைத் தற்காலிகமாக மூடின அல்லது சடங்காசாரத் தூய்மையை மட்டும் அளித்தன என்று விளக்கிச் சேர்த்தல்
  rationale: அத்தகைய விரிவான கோட்பாட்டு விளக்கத்தை வசனத்திற்குள் சேர்க்காமல், கிறிஸ்துவின் பலியோடு சூழல் உருவாக்கும் வேறுபாட்டையும் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘இரத்தம்’ மற்றும் ‘பாவங்கள்’ என்ற மூலத்தின் முக்கியச் சொற்களும் பன்மையும் பாதுகாக்கப்பட்டுள்ளன.
