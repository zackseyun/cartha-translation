  naturalness: The revised sentence is concise, idiomatic modern standard Tamil, and avoids an unnecessary comma after the opening connector.
  terminology: ‘காளைகள்,’ ‘வெள்ளாடுகள்,’ ‘இரத்தம்,’ and plural ‘பாவங்கள்’ are appropriate. ‘நீக்க’ naturally conveys ἀφαιρεῖν; the footnote retains ‘அகற்ற’ as a genuine lexical alternative.
