revisions:
- from: ஏனெனில், காளைகள் மற்றும் வெள்ளாடுகளின் இரத்தத்தால் பாவங்களை நீக்குவது இயலாதது.[a]
  to: ஏனெனில், காளைகள் மற்றும் வெள்ளாடுகளின் இரத்தம் பாவங்களை நீக்க இயலாது.[a]
  rationale: The revision restores ‘blood’ as the subject of the statement rather than presenting it only as an instrument. It preserves the absolute impossibility expressed by ἀδύνατον, the explanatory force of γάρ, the plural ‘sins,’ and the lexical ambiguity between ‘remove’ and ‘take away,’ without importing a theological explanation.
