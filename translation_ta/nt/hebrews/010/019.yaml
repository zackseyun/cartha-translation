  text: Ἔχοντες οὖν, ἀδελφοί, παρρησίαν εἰς τὴν εἴσοδον τῶν ἁγίων ἐν τῷ αἵματι Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/019.yaml
  text: Therefore, brothers, since we have boldness to enter the holy places by the blood of Jesus,
translation:
  language: ta
  text: ஆகவே, சகோதரர்களே,[a] இயேசுவின் இரத்தத்தினால் பரிசுத்த இடங்களுக்குள்[b] நுழைவதற்கான துணிவு நமக்கு இருப்பதால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சகோதர சகோதரிகளே’; கிரேக்கத்தில் ‘சகோதரர்களே’ என்று உள்ளது. அது சபை முழுவதையும் பிரதிநிதித்துவமாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பரிசுத்த ஸ்தலத்திற்குள்’; எபிரெயர் நூலின் கூடார உருவகச் சூழலில் இச்சொற்றொடர் தேவ பிரசன்னத்தின் பரிசுத்த இடங்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχοντες
  choice: நமக்கு இருப்பதால்
  rationale: இது வடிவில் வினையெச்சமாக இருந்தாலும், தொடர்ந்து வரும் அறிவுரைக்கான அடிப்படையை அறிமுகப்படுத்துகிறது. ‘இருப்பதால்’ என்பது அதன் காரண/தர்க்கத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வாதத்திலிருந்து வரும் முடிவைத் தெளிவாகக் குறிக்கிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: கிரேக்க மூலத்தின் ஆண்பால் பன்மை விளிப்பைத் தக்கவைக்கிறது; இது சபை முழுவதையும் பிரதிநிதித்துவமாகக் குறிக்கக்கூடும் என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: παρρησίαν
  choice: துணிவு
  rationale: தேவனுடைய முன்னிலைக்குள் செல்லும் தடையற்ற, உறுதியான அணுகலை இச்சூழலில் குறிக்கிறது. ‘துணிவு’ அதன் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: εἰς τὴν εἴσοδον
  choice: நுழைவதற்கான
  rationale: ‘நுழைவு’ என்ற பெயர்ச்சொல் அமைப்பைத் தமிழில் இயல்பான வினைச்சொல் அமைப்பாக வழங்கி, அணுகும் உரிமை என்ற பொருளைப் பாதுகாக்கிறது.
- source_word: τῶν ἁγίων
  choice: பரிசுத்த இடங்களுக்குள்
  rationale: எபிரெயர் நூலின் கூடார/வழிபாட்டுச் சூழலில் இது பரிசுத்தவான்களை அல்ல, தேவ பிரசன்னத்தின் பரிசுத்த இடங்களைக் குறிக்கிறது; ஒரே ‘மகா பரிசுத்த இடம்’ என்று தேவையின்றிக் குறுக்கப்படவில்லை.
- source_word: ἐν τῷ αἵματι Ἰησοῦ
  choice: இயேசுவின் இரத்தத்தினால்
  rationale: நுழைவதற்கான வழிமுறை அல்லது அடிப்படையைச் சுட்டுகிறது; பலியின் இறையியல் வலிமையை மேலதிக விளக்கமின்றிப் பாதுகாக்கிறது.
theological_decisions:
- issue: τῶν ἁγίων என்பதன் வரம்பு
  choice: தேவ பிரசன்னத்துடன் தொடர்புடைய பரிசுத்த இடங்கள்
  alternative: பரிசுத்த ஸ்தலம்; மகா பரிசுத்த ஸ்தலம்; பரிசுத்தவான்கள்
  rationale: எபிரெயர் நூலின் தொடர்ச்சியான கூடார உருவகத்தில் இது இடம் சார்ந்த வழிபாட்டுக் குறிப்பாக உள்ளது. ‘மகா பரிசுத்த ஸ்தலம்’ என்பது கிரேக்கம் தெரிவிப்பதைவிடக் குறிப்பானதாகிவிடும்.
- issue: ἀδελφοί என்பதன் பிரதிநிதித்துவப் பயன்பாடு
  choice: முதன்மை உரையில் ‘சகோதரர்களே’ என்று வைத்து, உள்ளடக்கும் பயன்பாட்டை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: சகோதர சகோதரிகளே; உடன்பிறந்தவர்களே
  rationale: மூலத்தின் இலக்கண ஆண்பால் வடிவம் பாதுகாக்கப்படுகிறது; அதேவேளை இது சபை முழுவதையும் நோக்கியிருக்கலாம் என்ற உண்மை மறைக்கப்படவில்லை.
- issue: ἐν τῷ αἵματι Ἰησοῦ என்பதன் உறவு
  choice: ‘இயேசுவின் இரத்தத்தினால்’ என வழிமுறை/அடிப்படையைத் திறந்தவாறு வைத்தல்
  alternative: இயேசுவின் இரத்தத்தின் அடிப்படையில்; இயேசுவின் இரத்தத்தின் வழியாக
  rationale: ‘இரத்தத்தினால்’ என்பது பலி சார்ந்த காரணத்தையும் வழிமுறையையும் இயல்பாகத் தாங்குகிறது; அவற்றில் ஒன்றை மட்டும் இறுக்கமாக நிர்ணயிப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. வசனம் அடுத்த அறிவுரைக்கான காரணவாக்கியமாகத் தொடர்வதால், இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
