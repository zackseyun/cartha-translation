reference: Hebrews 10:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τότε εἶπον· Ἰδοὺ ἥκω, ἐν κεφαλίδι βιβλίου γέγραπται περὶ ἐμοῦ, τοῦ ποιῆσαι, ὁ θεός, τὸ θέλημά σου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/007.yaml
  text: Then I said[a], ‘Behold, I have come—in the scroll of the book it is written about me—to do your will, O God.’
translation:
  language: ta
  text: 'அப்போது நான் சொன்னேன்: “இதோ, கடவுளே, உமது சித்தத்தைச் செய்ய நான் வந்திருக்கிறேன்; நூல் சுருளில் என்னைக் குறித்து எழுதப்பட்டுள்ளது.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: அப்போது
  rationale: மேற்கோளில் வரும் பதிலை அறிமுகப்படுத்தும் காலவினையடை; சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: εἶπον
  choice: நான் சொன்னேன்
  rationale: λέγω என்பதன் இறந்தகால வடிவத்திற்கும் மேற்கோளை அறிமுகப்படுத்தும் சூழலுக்கும் இயல்பான தமிழ் இணை.
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் சொல்லின் வலிமையையும் வேதாகம மேற்கோளின் கண்ணியமான தொனியையும் காக்கிறது.
- source_word: ἥκω
  choice: நான் வந்திருக்கிறேன்
  rationale: இலக்கண வடிவம் நிகழ்காலமாக இருந்தாலும், வந்து சேர்ந்திருப்பதையும் அதன் தற்போதைய விளைவையும் ἥκω உணர்த்துகிறது.
- source_word: ἐν κεφαλίδι βιβλίου
  choice: புத்தகச் சுருளில்
  rationale: இச்சொற்றொடரில் κεφαλίς என்பது நவீன கட்டுப்புத்தகத்தின் தலைப்பை அல்ல, எழுதப்பட்ட சுருளைக் குறிக்கிறது.
- source_word: γέγραπται
  choice: எழுதப்பட்டுள்ளது
  rationale: எழுதப்பட்டிருப்பதும் அது தொடர்ந்து நிலைத்திருப்பதும் அடங்கிய நிறைவு செயலப்பாட்டு வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: περὶ ἐμοῦ
  choice: என்னைக் குறித்து
  rationale: περί உடன் வரும் தொடர்புப் பொருளைத் துல்லியமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τοῦ ποιῆσαι
  choice: நிறைவேற்றுவதற்காக
  rationale: இங்குள்ள பெயர்ச்சுட்டிய வினையெச்சம் வருகையின் நோக்கத்தைத் தெரிவிக்கிறது; ஒருவரின் திருவுளத்தை ‘செய்வது’ என்பதன் இயல்பான தமிழ் பொருள் அதை நிறைவேற்றுவதாகும்.
- source_word: ὁ θεός
  choice: கடவுளே
  rationale: வடிவத்தில் எழுவாயாக இருந்தாலும் நேரடி அழைப்பாகப் பயன்படுவதால், தமிழ் அழைப்புவேற்றுமை வெளிப்படையாகக் காட்டப்பட்டுள்ளது.
- source_word: τὸ θέλημά σου
  choice: உமது திருவுளத்தை
  rationale: θέλημα என்பதன் விருப்பம்/சித்தம் என்ற பொருளை, கடவுளைக் குறிக்கும் இச்சூழலில் கண்ணியமாகவும் தெளிவாகவும் தருகிறது.
theological_decisions:
- issue: எபிரெயர் நூலில் சங்கீத மேற்கோளின் மேசியாவைக் குறிக்கும் முதலாம் நபர் பேச்சு
  choice: பேசுபவரை வசனத்திற்குள் வெளிப்படையாக அடையாளப்படுத்தாமல் முதலாம் நபர் கூற்றாகவே மொழிபெயர்த்தல்
  alternative: முதன்மை உரையிலேயே பேசுபவரை மேசியா அல்லது கிறிஸ்து என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: சுற்றியுள்ள பகுதி இக்கூற்றைக் குமாரன்/கிறிஸ்துவுக்குப் பொருத்துகிறது; ஆனால் இவ்வசனத்தின் சொற்கள் முதலாம் நபர் அறிவிப்பாக மட்டுமே உள்ளன. ஆகவே கிறிஸ்துவியல் பயன்பாட்டைச் சூழல் நிறுவ அனுமதிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘இதோ’, ‘உமது’, ‘திருவுளம்’ ஆகியவை மேற்கோளின் மேன்மையான தொனியைப் பேணுகின்றன. கிரேக்கத்தில் ‘வந்திருக்கிறேன்’ என்பது ஒருமுறை மட்டுமே வெளிப்படையாக இருந்தாலும், தமிழில் நீண்ட இடைச்செருகலுக்குப் பின் நோக்கத்தொடரைத் தெளிவாக இணைக்க இறுதியில் ‘வந்திருக்கிறேன்’ மீண்டும் வழங்கப்பட்டுள்ளது.
