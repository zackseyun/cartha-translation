revisions:
- from: மோசேயின் சட்டத்தை ஒதுக்கித் தள்ளிய எவரும், இரண்டு அல்லது மூன்று சாட்சிகளின் வாக்குமூலத்தின் அடிப்படையில் இரக்கமின்றி மரணமடைகிறார்[a].
  to: மோசேயின் சட்டத்தை நிராகரித்த எவரும், இரண்டு அல்லது மூன்று சாட்சிகளின் வாக்குமூலத்தின் அடிப்படையில், இரக்கமின்றி மரணமடைகிறார்[a].
  rationale: The revision improves idiomatic modern Tamil while preserving the source text’s distinction between repudiating the Mosaic law and merely violating it. It retains the literal non-causative wording “மரணமடைகிறார்” in the text and confines the judicial-execution clarification to the footnote.
