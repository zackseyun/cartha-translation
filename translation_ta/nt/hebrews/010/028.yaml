source:
  edition: SBLGNT
  text: ἀθετήσας τις νόμον Μωϋσέως χωρὶς οἰκτιρμῶν ἐπὶ δυσὶν ἢ τρισὶν μάρτυσιν ἀποθνῄσκει·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/028.yaml
  text: Anyone who has set aside the law of Moses dies without mercy on the testimony of two or three witnesses[a].
translation:
  language: ta
  text: மோசேயின் சட்டத்தை நிராகரித்த எவரும், இரண்டு அல்லது மூன்று சாட்சிகளின் வாக்குமூலத்தின் அடிப்படையில், இரக்கமின்றி மரணமடைகிறார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கொல்லப்படுகிறார்.” கிரேக்க மூலத்தில் சொல்லர்த்தமாக “மரணமடைகிறார்” என்று உள்ளது; ஆனால் மோசேயின் சட்டத்தின் கீழ் சட்டத்தின்படி நிறைவேற்றப்படும் மரணதண்டனையையே இங்குள்ள சூழல் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετήσας
  choice: ஒதுக்கித் தள்ளிய
  rationale: அதிகாரமுள்ள ஒன்றை நிராகரித்தல் அல்லது செல்லாததுபோல் ஒதுக்குதல் என்ற பொருளைப் பாதுகாக்கிறது; வெறுமனே ஒரு கட்டளையை மீறுதல் என்ற குறுகிய பொருளைத் தவிர்க்கிறது.
- source_word: τις
  choice: எவரும்
  rationale: பொதுவாக யாரையும் குறிக்கும் காலவரையற்ற சுட்டுப்பெயரின் பிரதிநிதித்துவப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: νόμον Μωϋσέως
  choice: மோசேயின் சட்டத்தை
  rationale: கிரேக்க மரபுத்தொடருக்கு நெருக்கமாகவும், நவீனத் தமிழில் தெளிவாகவும் உள்ளது.
- source_word: χωρὶς οἰκτιρμῶν
  choice: இரக்கமின்றி
  rationale: நீதித் தீர்ப்பின் சூழலில் இரக்கம் காட்டப்படாததைக் குறிக்கும் இயல்பான தமிழ்ச் சொற்றொடர்.
- source_word: ἐπὶ δυσὶν ἢ τρισὶν μάρτυσιν
  choice: இரண்டு அல்லது மூன்று சாட்சிகளின் வாக்குமூலத்தின் அடிப்படையில்
  rationale: ἐπί என்பதன் தீர்ப்புக்கான ஆதாரம் என்ற பொருளைத் தெளிவாக்குகிறது; சாட்சிகள் அளிக்கும் வாக்குமூலமே சட்ட நடவடிக்கையின் அடிப்படை என்பதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀποθνῄσκει
  choice: மரணமடைகிறார்
  rationale: கிரேக்கத்தில் உள்ள எளிய ‘இறக்கிறார்’ என்ற கருத்தையும், பொதுவான சட்ட விளைவைச் சொல்லும் நிகழ்காலத் தன்மையையும் காக்கிறது; செயப்படுவினையான ‘கொல்லப்படுகிறார்’ என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
theological_decisions:
- issue: ἀποθνῄσκει என்பதில் நீதிமன்றத் தீர்ப்பின்படி கொல்லப்படுதல் என்ற பொருளை வெளிப்படையாகக் கூறுவதா
  choice: முதன்மை உரையில் ‘மரணமடைகிறார்’ என்று வைத்து, சட்டரீதியான மரணதண்டனைச் சூழலை உட்குறிப்பாக விடுதல்
  alternative: ‘கொல்லப்படுகிறார்’ அல்லது ‘மரணதண்டனைக்கு உட்படுத்தப்படுகிறார்’
  rationale: மோசேயின் சட்டமும் இரண்டு அல்லது மூன்று சாட்சிகளும் குறிப்பிடப்படுவது மரணதண்டனைக்குரிய நீதிச் சூழலைக் காட்டுகிறது. ஆயினும், கிரேக்க வினைச்சொல் நேரடியாக ‘மரணமடைகிறார்’ என்றே கூறுவதால், அதன் கட்டுப்பாட்டை முதன்மை உரையில் பாதுகாத்து, வெளிப்படையான நீதித்துறைப் பொருளை அடிக்குறிப்பில் தருவது ஏற்றது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘ஒதுக்கித் தள்ளிய’ என்பது அதிகாரத்தை நிராகரிக்கும் வலிமையைத் தக்கவைக்கிறது; ‘வாக்குமூலத்தின் அடிப்படையில்’ என்பது சட்டச் சூழலை இயல்பாகத் தெளிவாக்குகிறது.
