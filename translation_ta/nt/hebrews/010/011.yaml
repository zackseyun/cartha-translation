id: HEB.10.11
reference: Hebrews 10:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ πᾶς μὲν ἱερεὺς ἕστηκεν καθ’ ἡμέραν λειτουργῶν καὶ τὰς αὐτὰς πολλάκις προσφέρων θυσίας, αἵτινες οὐδέποτε δύνανται περιελεῖν ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/011.yaml
  text: And every priest stands day after day ministering and offering the same sacrifices again and again[a], which can never take away sins.
translation:
  language: ta
  text: ஒவ்வொரு ஆசாரியரும் நாள்தோறும் நின்று இறைப்பணி செய்து, அதே பலிகளைத் திரும்பத் திரும்பச் செலுத்துகிறார்; அவற்றால் பாவங்களை ஒருபோதும் நீக்க முடியாது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ... ἱερεὺς
  choice: ஒவ்வொரு ஆசாரியரும்
  rationale: ஒருமை பெயர்ச்சொல்லுடன் வரும் πᾶς பகிர்நிலைப் பொருளைக் கொண்டதால், லேவிய ஆசாரியர்களில் ஒவ்வொருவரையும் குறிக்கிறது. ἱερεύς என்பது ‘தலைமை ஆசாரியர்’ அல்ல.
- source_word: ἕστηκεν
  choice: நின்று
  rationale: ஆசாரியரின் தொடர்ந்த நிற்கும் நிலையை இயல்பான தமிழில் காட்டுகிறது; அடுத்த வசனத்தில் மேசியா அமர்ந்திருப்பதோடு உள்ள நோக்கமுள்ள முரண்பாட்டையும் காக்கிறது.
- source_word: καθ’ ἡμέραν
  choice: நாள்தோறும்
  rationale: ஒவ்வொரு நாளும் தொடர்ந்து நடைபெறும் செயலைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: λειτουργῶν
  choice: இறைப்பணி செய்து
  rationale: பொதுவான சேவையை மட்டும் அல்லாமல், வழிபாடு சார்ந்த ஆசாரியப் பணியைக் குறிக்கும் சொல்லாகத் தெளிவாக உள்ளது.
- source_word: τὰς αὐτὰς ... θυσίας
  choice: அதே பலிகளை
  rationale: மீண்டும் செலுத்தப்படுபவை ஒரே வகையான பலிகள் என்பதை αὐτάς வலியுறுத்துவதைக் காக்கிறது.
- source_word: πολλάκις
  choice: திரும்பத் திரும்ப
  rationale: பலமுறை நிகழும் தொடர்ச்சியான மறுசெயலை இயல்பான நவீன தமிழில் வலியுறுத்துகிறது.
- source_word: προσφέρων
  choice: செலுத்துகிறார்
  rationale: பலியிடும் சூழலில் προσφέρω என்பதற்கான இயல்பான தமிழ் வழக்கு ‘பலிகளைச் செலுத்துதல்’ ஆகும்.
- source_word: αἵτινες
  choice: அவற்றால்
  rationale: முன்னர் கூறப்பட்ட பலிகளையே சுட்டி, அவற்றின் இயலாமையைத் தமிழில் தெளிவான காரண-கருவி அமைப்பில் தெரிவிக்கிறது.
- source_word: οὐδέποτε δύνανται
  choice: ஒருபோதும் ... முடியாது
  rationale: முற்றிலும் இயலாது என்ற கிரேக்கச் சொற்றொடரின் வலிமையை மெலிதாக்காமல் காக்கிறது.
- source_word: περιελεῖν ἁμαρτίας
  choice: பாவங்களை ... நீக்க
  rationale: περιαιρέω என்பதன் ‘அகற்றுதல்/நீக்குதல்’ என்ற நேரடிப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: ஆசாரியரின் நிற்கும் நிலைக்கும் எபிரெயர் 10-ன் வாதத்திற்கும் உள்ள தொடர்பு
  choice: ‘நின்று’ என்று மொழிபெயர்த்து, தொடரும் ஆசாரியப் பணியையும் அடுத்த வசனத்தில் மேசியா அமர்ந்திருப்பதையும் எதிரெதிராகக் காட்டும் இலக்கிய அமைப்பைக் காத்தல்
  alternative: ‘நிலைகொண்டு’ அல்லது கால அம்சத்தை மட்டும் முன்னிறுத்தும் வடிவம்
  rationale: உடனடிச் சூழலில் நிற்பதும் அமர்வதும் நோக்கமுள்ள முரண்பாடாக உள்ளன; கூடுதல் விளக்கத்தைச் சேர்க்காமல் அந்த முரண்பாட்டை மொழிபெயர்ப்பு காக்க வேண்டும்.
- issue: பலிகளின் பயனின்மையின் அளவு
  choice: ‘பாவங்களை ஒருபோதும் நீக்க முடியாது’ என்ற முழுமையான இயலாமை
  alternative: ‘பாவங்களை முழுமையாகக் கையாள முடியாது’ போன்ற மெலிதாக்கப்பட்ட வாசகம்
  rationale: οὐδέποτε δύνανται என்பது ஆசிரியரின் வாதத்தில் முழுமையான இயலாமையைச் சொல்கிறது; மொழிபெயர்ப்பு அதைத் தளர்த்தக்கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘ஆசாரியர்’, ‘இறைப்பணி’, ‘பலி செலுத்துதல்’ ஆகியவை வழிபாட்டுச் சூழலைத் துல்லியமாகக் காக்கின்றன. தனி அடிக்குறிப்பு தேவையில்லை; ஆங்கில அடிக்குறிப்பிலுள்ள ‘remove sins’ என்பதே முதன்மைத் தமிழாக்கமாக நேரடியாக வழங்கப்பட்டுள்ளது.
