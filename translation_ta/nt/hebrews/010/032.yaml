source:
  edition: SBLGNT
  text: Ἀναμιμνῄσκεσθε δὲ τὰς πρότερον ἡμέρας, ἐν αἷς φωτισθέντες πολλὴν ἄθλησιν ὑπεμείνατε παθημάτων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/032.yaml
  text: But remember the former days[a], when, after you were enlightened, you endured a great struggle of sufferings[c][b],
translation:
  language: ta
  text: ஆனால், நீங்கள் ஒளியூட்டப்பட்ட பின்பு[a][b], பல துன்பங்களுடனான பெரும் போராட்டத்தை[c] சகித்த முந்தைய நாட்களை நினைவுகூருங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் ஒளியூட்டப்பட்டபோது.” கிரேக்கப் பங்கேற்புவினையை பிரதான நிகழ்வுக்கு முந்திய செயலாகவும், அதனோடு காலத்தில் இணைந்த செயலாகவும் புரிந்துகொள்ள முடியும்.
    reason: lexical_alternative
  - marker: b
    text: “ஒளியூட்டப்பட்ட” என்பது பொதுவாக ஆவிக்குரிய வெளிச்சத்தைப் பெற்றதைக் குறிக்கலாம். சிலர் இதை மனமாற்றம், திருமுழுக்கு, அல்லது விசுவாசப் போதனை ஆகியவற்றோடு தொடர்புபடுத்துகின்றனர்; வசனம் தானே இவற்றில் ஒன்றைக் குறிப்பாகத் தேர்ந்தெடுக்கவில்லை.
    reason: alternative_reading
  - marker: c
    text: அல்லது, “துன்பங்களுடனான கடும் போட்டியை.” இங்கு பயன்படுத்தப்பட்டுள்ள பெயர்ச்சொல் கடினமான போட்டி அல்லது போராட்டம் என்ற உணர்வைக் கொண்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναμιμνῄσκεσθε
  choice: நினைவுகூருங்கள்
  rationale: நிகழ்காலக் கட்டளை வினையின் அழைப்பை இயல்பான நவீனத் தமிழில் தருகிறது; தொடர்ந்து நினைவில் கொள்ளும் நுண்ணுணர்வு சூழலில் மறைமுகமாக உள்ளது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய எச்சரிக்கையிலிருந்து வாசகர்களின் முந்தைய நிலைத்தன்மையை நோக்கித் திரும்பும் மென்மையான முரண்பாட்டையும் மாற்றத்தையும் காட்டுகிறது.
- source_word: τὰς πρότερον ἡμέρας
  choice: அந்த முந்தைய நாட்களை
  rationale: முன்னிருந்த காலத்தைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது; ‘அந்த’ என்பது வாசகர்கள் அறிந்த நாட்களைச் சுட்டும் சூழலுணர்வை வெளிப்படுத்துகிறது.
- source_word: ἐν αἷς
  choice: அந்த … நாட்களை
  rationale: சொல்லுக்குச் சொல் ‘அவற்றில்’ என்பதற்குப் பதிலாக, தொடர்புடைய காலப்பொருளைத் தமிழ் வாக்கிய அமைப்பில் இயல்பாக இணைக்கிறது.
- source_word: φωτισθέντες
  choice: நீங்கள் ஒளியூட்டப்பட்ட பிறகு
  rationale: இறையியல் உருவகத்தைச் சுருக்காமல் காக்கிறது. இறந்தகாலப் பங்கேற்புவினை பிரதான வினைக்கு முந்திய செயலைக் குறிப்பதாக மொழிபெயர்க்கப்பட்டுள்ளது; கால ஒத்திசைவு வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: πολλὴν ἄθλησιν
  choice: ஒரு பெரும் போராட்டத்தை
  rationale: πολλήν தரும் தீவிரத்தையும் ἄθλησις தரும் போட்டி அல்லது கடும் போராட்ட உணர்வையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ὑπεμείνατε
  choice: சகித்த
  rationale: துன்பத்தின் கீழ் நிலைத்திருந்து தாங்கியதைச் சுருக்கமாகவும் சூழலுக்கு ஏற்றவாறும் வெளிப்படுத்துகிறது.
- source_word: παθημάτων
  choice: துன்பங்கள் நிறைந்த
  rationale: போராட்டத்தின் தன்மையை விளக்கும் பன்மை உருபைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; அனுபவித்த வேதனைகள் மற்றும் இன்னல்களின் பரந்த பொருளைக் காக்கிறது.
theological_decisions:
- issue: எச்சரிக்கை மற்றும் ஊக்குவிப்பு சூழலில் φωτισθέντες என்பதன் பொருள்
  choice: ‘ஒளியூட்டப்பட்ட’ என்ற உருவகச் சொல்லைத் தக்கவைத்தல்
  alternative: ‘மனந்திரும்பிய’, ‘திருமுழுக்குப் பெற்ற’, அல்லது ‘நற்செய்தியின் ஒளியைப் பெற்ற’ என்று குறிப்பாக்குதல்
  rationale: இச்சொல் முன்பு பெற்ற ஆவிக்குரிய வெளிச்சத்தைச் சுட்டுகிறது; ஆனால் அது மனமாற்றமா, திருமுழுக்கா, விசுவாசப் போதனையா என்பதை இவ்வசனம் தீர்மானிக்கவில்லை. எனவே உரையிலுள்ள இறையியல் திறந்தநிலையைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. ‘ஒளியூட்டப்பட்ட’ என்ற மூல உருவகமும் ‘போராட்டம்’ என்ற போட்டிசார் நுண்ணுணர்வும் காக்கப்பட்டுள்ளன.
