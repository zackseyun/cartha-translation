revisions:
- from: ஆனால், நீங்கள் ஒளியூட்டப்பட்ட பிறகு[a][b], துன்பங்கள் நிறைந்த ஒரு பெரும் போராட்டத்தை[c] சகித்த அந்த முந்தைய நாட்களை நினைவுகூருங்கள்.
  to: ஆனால், நீங்கள் ஒளியூட்டப்பட்ட பின்பு[a][b], பல துன்பங்களுடனான பெரும் போராட்டத்தை[c] சகித்த முந்தைய நாட்களை நினைவுகூருங்கள்.
