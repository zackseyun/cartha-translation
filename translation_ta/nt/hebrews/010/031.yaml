  text: φοβερὸν τὸ ἐμπεσεῖν εἰς χεῖρας θεοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/031.yaml
  text: It is a fearful thing to fall into the hands of the living God[a].
translation:
  language: ta
  text: உயிருள்ள கடவுளின் கைகளில் விழுவது அஞ்சத்தக்கது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உயிருள்ள கடவுளின் கைகளில் விழுவது பயங்கரமானது.”
    reason: φοβερὸν என்பதன் வலிமையான அச்சம் அல்லது திகில் சார்ந்த மாற்றுப் பொருளை வழங்குகிறது.
lexical_decisions:
- source_word: φοβερὸν
  choice: அஞ்சத்தக்கது
  rationale: இச்சொல் அச்சம், திகில், பயங்கரம் ஆகிய உணர்வுகளைத் தூண்டுவதைச் சுட்டுகிறது. இங்கு வரும் பெயரெச்சத்தையும் பெயராக்கப்பட்ட வினையெச்சத்தையும் தமிழில் இயல்பாகவும் எச்சரிக்கையின் கனத்தைப் பாதுகாக்கும் வகையிலும் “அஞ்சத்தக்கது” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: τὸ ἐμπεσεῖν
  choice: விழுவது
  rationale: பெயராக்கப்பட்ட இறந்தகால வினையெச்சத்தின் கருத்தைத் தமிழில் “விழுவது” இயல்பாகத் தருகிறது; தொடர்ந்து வரும் “கைகளில்” என்பதுடன் சேர்ந்து ஒருவரின் அதிகாரத்திற்குள் அகப்படுதல் என்ற வலிமையான படிமத்தையும் காக்கிறது.
- source_word: εἰς χεῖρας
  choice: கைகளில்
  rationale: ஒருவருடைய அதிகாரத்திற்குள் அல்லது தீர்ப்புக்கு உட்படுவதைக் குறிக்கும் மரபுத்தொடர் இது. “அதிகாரத்தில்” என்று பொருளை மட்டும் வெளிப்படுத்தாமல், மூலத்தின் கைப் படிமமும் வேதாகம இடையுரைக் தொடர்பும் பாதுகாக்கப்பட்டுள்ளன.
- source_word: θεοῦ
  choice: கடவுளின்
  rationale: “கைகள்” என்பதுடன் சார்புறும் உரிமைவேற்றுமையை இயல்பான நவீனத் தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: ζῶντος
  choice: உயிருள்ள
  rationale: θεοῦ என்பதைக் குறிப்பிட்டு “உயிருள்ள கடவுள்” என்ற பொருளைத் தருகிறது. இது கடவுளின் மெய்யான, செயல்படும் பிரசன்னத்தைச் சுட்டும் வேதாகமச் சொல்லாக்கத்தைத் தெளிவான நவீனத் தமிழில் காக்கிறது.
theological_decisions:
- issue: எச்சரிக்கை வாக்கியத்தின் வீச்சு
  choice: உயிருள்ள கடவுளின் கைகளில் விழுவதன் அச்சத்தைப் பற்றிய பொதுவான, கனமான அறிவிப்பாக மொழிபெயர்த்தல்
  alternative: இது இவ்வுலகத் தண்டனையை மட்டும் குறிக்கிறது என்று வரையறுத்தல் அல்லது தீர்ப்புடன் தொடர்பில்லாத இருப்பியல் கூற்றாக எடுத்தல்
  rationale: சூழலில் இது ஓர் எச்சரிக்கைப் பகுதியின் முடிவாக வருகிறது; “கைகளில் விழுதல்” என்பது அதிகாரத்திற்கும் தீர்ப்புக்கும் உட்படுவதை உணர்த்துகிறது. எனினும் கிரேக்கத்தில் “தீர்ப்பு” என்ற சொல் வெளிப்படையாக இல்லாததால் அதை மொழிபெயர்ப்பில் சேர்க்காமல், மூலத்தின் படிமத்தையும் இறையியல் பதற்றத்தையும் அப்படியே வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான, கனமான எச்சரிக்கை நடையைக் கொண்டுள்ளது. “ஜீவனுள்ள தேவன்” போன்ற பழைய வழக்குக்குப் பதிலாக ordinary readers எளிதில் புரிந்துகொள்ளும் “உயிருள்ள கடவுள்” பயன்படுத்தப்பட்டுள்ளது; “கைகளில் விழுவது” என்ற மூலப் படிமம் பாதுகாக்கப்பட்டுள்ளது.
