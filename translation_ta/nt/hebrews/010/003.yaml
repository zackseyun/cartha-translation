revisions:
- from: ஆனால் இந்தப் பலிகளிலோ, ஆண்டுதோறும் பாவங்கள் நினைவூட்டப்படுகின்றன.[a]
  to: ஆனால், இந்தப் பலிகளில் ஆண்டுதோறும் பாவங்கள் நினைவூட்டப்படுகின்றன.[a]
  rationale: The revision removes unnecessary contrastive marking from the locative phrase and places the annual temporal expression closer to the verbal assertion. It retains the draft’s valid passive formulation, which represents the source’s statement that a remembrance of sins occurs without specifying an agent.
  reviewer_model: gpt-5.6-terra
