  text: ἀλλ’ ἐν αὐταῖς ἀνάμνησις ἁμαρτιῶν κατ’ ἐνιαυτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/003.yaml
  text: But in these sacrifices there is a reminder of sins year after year,[a]
translation:
  language: ta
  text: ஆனால், இந்தப் பலிகளில் ஆண்டுதோறும் பாவங்கள் நினைவூட்டப்படுகின்றன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒவ்வோர் ஆண்டும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் பலிகள் வழிபடுகிறவர்களை முழுமைப்படுத்த முடியாது என்று கூறியதற்கு எதிர்முகத் தொடர்ச்சியை இயல்பாகக் காட்டுகிறது.
- source_word: ἐν αὐταῖς
  choice: இந்தப் பலிகளிலோ
  rationale: பெண்பால் பன்மைச் சுட்டுப்பெயர் முந்தைய சூழலில் கூறப்பட்ட பலிகளைக் குறிக்கிறது. ‘பலிகள்’ என்பதை வெளிப்படையாகச் சொல்வது புதிய கருத்தைச் சேர்க்காமல் பொருளைத் தெளிவாக்குகிறது; ‘-லோ’ எதிர்முக அழுத்தத்தையும் தருகிறது.
- source_word: ἀνάμνησις
  choice: நினைவூட்டப்படுகின்றன
  rationale: ἀνάμνησις என்பது நினைவுக்குக் கொண்டுவருதல் அல்லது நினைவூட்டுதல். தமிழில் இயல்பான வாக்கியத்திற்காக பெயர்ச்சொல் அமைப்பு வினைமுற்று அமைப்பாக மாற்றப்பட்டுள்ளது.
- source_word: ἁμαρτιῶν
  choice: பாவங்கள்
  rationale: ἀνάμνησις என்பதன் சார்புப் பன்மை வடிவம்; நினைவூட்டப்படுபவை பாவங்களே என்ற பொருளைத் தக்கவைக்கிறது.
- source_word: κατ’ ἐνιαυτόν
  choice: ஆண்டுதோறும்
  rationale: ஒவ்வோர் ஆண்டும் நிகழும் தொடர்ச்சியான மீள்நிகழ்வைச் சுருக்கமாகவும் இயல்பான நவீன தமிழிலும் தெரிவிக்கிறது.
theological_decisions:
- issue: αὐταῖς என்பதன் குறிப்பு
  choice: முந்தைய வசனங்களில் மீண்டும் மீண்டும் செலுத்தப்படும் பலிகளைக் குறிக்கும் வகையில் ‘இந்தப் பலிகளிலோ’ என்று வெளிப்படையாக்கப்பட்டது.
  alternative: ‘அவற்றிலோ’ என்று சுட்டுப்பெயரை மட்டும் வைத்தல்.
  rationale: உடனடிச் சூழல் அதே பலிகளைப் பற்றிப் பேசுவதால், குறிப்பை வெளிப்படையாக்குவது ஆசிரியரின் பலிகளுக்கும் சுத்திகரிப்புக்கும் இடையிலான வாதத்தை மாற்றாமல் தெளிவாக்குகிறது.
- issue: κατ’ ἐνιαυτόν என்பதன் காலவியல் வலிமை
  choice: தொடர்ச்சியாக நிகழும் வருடாந்திர மீள்நிகழ்வை உணர்த்த ‘ஆண்டுதோறும்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஒவ்வோர் ஆண்டும்.’
  rationale: இரு வடிவங்களும் வருடாந்திர நிகழ்வைக் குறிக்கின்றன; ‘ஆண்டுதோறும்’ எபிரெயர் நிருபத்தின் இச்சூழலில் வலியுறுத்தப்படும் மீள்மீள் நிகழ்வை இயல்பாக வெளிப்படுத்துகிறது.
- issue: ἀνάμνησις என்பதில் செய்பவர் குறிப்பிடப்படாமை
  choice: ‘பாவங்கள் நினைவூட்டப்படுகின்றன’ என்ற செயப்பாட்டு அமைப்பால் செய்பவரைத் தீர்மானிக்காமல் விடப்பட்டது.
  alternative: ‘மக்கள் பாவங்களை நினைவுகூருகிறார்கள்’ அல்லது ‘தேவன் பாவங்களை நினைவுகூருகிறார்.’
  rationale: கிரேக்க மூலவாக்கியம் நினைவூட்டல் இருப்பதையே கூறுகிறது; அதை மனிதர்களின் நினைவு அல்லது தேவனுடைய நினைவு என்று மட்டும் தீர்மானிப்பது மூலத்தில் உள்ள திறந்தநிலையைச் சுருக்கும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் சுருக்கமான, கண்ணியமான நடை. ‘பலிகள்’ சூழலிலிருந்து தெளிவாக்கப்பட்டுள்ளது; மூலத்தின் செய்பவர் குறிப்பிடப்படாத தன்மை பாதுகாக்கப்பட்டுள்ளது.
