base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/035.yaml
  text: Therefore[a], do not throw away your boldness, which has a great reward,
translation:
  language: ta
  text: ஆகவே, உங்கள் துணிவை[a]த் தூக்கி எறிந்துவிடாதீர்கள்; அதற்கு மிகுந்த வெகுமதி உண்டு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தன்னம்பிக்கையுள்ள சுதந்திரத்தை.’ கிரேக்கச் சொல், குறிப்பாக தேவனை அணுகுவதில், நம்பிக்கையுடன் கூடிய சுதந்திரத்தையோ வெளிப்படையாகப் பேசும் சுதந்திரத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἀποβάλητε
  choice: தூக்கி எறிந்துவிடாதீர்கள்
  rationale: μή உடன் வரும் இறந்தகாலத் துணைவினை வடிவம் தடையைத் தெரிவிக்கிறது. ἀποβάλλω என்பது தற்செயலாக இழப்பதைக் காட்டிலும் வேண்டுமென்றே கைவிடுவதைக் குறிக்கிறது; ‘தூக்கி எறிந்துவிடாதீர்கள்’ அந்த வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய கருத்துகளிலிருந்து வரும் முடிவையும் அறிவுரையையும் இணைக்கும் தர்க்கத் தொடர்பைக் காக்கிறது.
- source_word: παρρησίαν
  choice: துணிவு
  rationale: இச்சொல் தன்னம்பிக்கையோடு வெளிப்படையாக அணுகவும் பேசவும் உள்ள சுதந்திரத்தையும் தைரியத்தையும் குறிக்கலாம். ‘துணிவு’ அறிவுரையின் தைரியமான தொனியைக் காக்கிறது; ‘நம்பிக்கை’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: ὑμῶν
  choice: உங்கள்
  rationale: παρρησίαν என்பதோடு தொடர்புடைய உடைமைப் பொருளை நேரடியாகத் தருகிறது.
- source_word: ἥτις ἔχει
  choice: உடைய
  rationale: ἥτις அறிமுகப்படுத்தும் விளக்க உறவையும் ἔχει என்பதன் ‘கொண்டிருக்கிறது’ என்ற நேரடிப் பொருளையும் சுருக்கமான, இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: μεγάλην
  choice: மிகுந்த
  rationale: வெகுமதியின் பெருமையையும் மதிப்பையும் இயல்பான தமிழ் இணைப்பில் தெரிவிக்கிறது.
- source_word: μισθαποδοσίαν
  choice: வெகுமதி
  rationale: இங்கு நேர்மறையான பிரதிபலன் அல்லது பலன் என்ற பொருள் உள்ளது. ‘வெகுமதி’ தெளிவாகவும் இயல்பாகவும் இருந்து, தேவையற்ற அளவில் வாணிகப் பரிமாற்ற உணர்வை ஏற்படுத்தாது.
theological_decisions:
- issue: எபிரெயர் 10:35-இல் παρρησία என்பதன் பொருள்
  choice: தேவனை அணுகுவதிலும் விசுவாசத்தில் நிலைத்திருப்பதிலும் வெளிப்படும் நம்பிக்கையுள்ள துணிவு
  alternative: நம்பிக்கை அல்லது தன்னம்பிக்கை
  rationale: எபிரெயர் நூலில் இச்சொல் நம்பிக்கையோடு அணுகும் சுதந்திரத்தையும் வெளிப்படையான உறுதியையும் குறிக்கிறது. ‘துணிவு’ அறிவுரையின் வலிமையைத் தக்கவைக்கிறது; அதேவேளை அதன் பொருளை உள்ளார்ந்த உறுதியாக மட்டும் குறுக்குவதில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் மரியாதையும் அறிவுரையின் வலிமையும் காக்கப்பட்டுள்ளன. ‘தூக்கி எறிந்துவிடாதீர்கள்’ வேண்டுமென்றே கைவிடும் செயலை வலியுறுத்துகிறது; ‘மிகுந்த வெகுமதி’ மூலத்தின் மதிப்பீட்டுத் தொனியை இயல்பாகத் தருகிறது.
