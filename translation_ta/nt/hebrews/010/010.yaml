  text: ἐν ᾧ θελήματι ἡγιασμένοι ⸀ἐσμὲν διὰ τῆς προσφορᾶς τοῦ σώματος Ἰησοῦ Χριστοῦ ἐφάπαξ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/010.yaml
  text: By that will we have been sanctified through the offering of the body of Jesus the Messiah once for all[a][b].
translation:
  language: ta
  text: அந்தத் திருவுளத்தினால், இயேசு மெசியாவின் உடல் ஒரே முறையாகவே காணிக்கையாகச் செலுத்தப்பட்டதன் மூலம் நாம் பரிசுத்தமாக்கப்பட்டிருக்கிறோம்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் சொற்சார்ந்து, “அந்தத் திருவுளத்தில்” என்றும் மொழிபெயர்க்கலாம். சூழலில் சற்றுமுன் கூறப்பட்ட கடவுளின் திருவுளமே இங்கு குறிக்கப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: “இயேசு கிறிஸ்து” என்றும் மொழிபெயர்க்கலாம். கிரேக்க மொழியிலுள்ள Χριστός என்ற பட்டத்தின் பொருளைப் பாதுகாக்க இங்கு “மெசியா” என்று தரப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ θελήματι
  choice: அந்தத் திருவுளத்தினால்
  rationale: முந்தைய சூழலில் கூறப்பட்ட கடவுளின் திருவுளத்தை இது சுட்டுகிறது. ἐν என்பதன் கருவிப்பொருளை இயல்பான தமிழில் ‘-ஆல்’ வெளிப்படுத்துகிறது; ‘அந்தத் திருவுளத்தில்’ என்பது சொற்சார்ந்த மாற்று.
- source_word: ἡγιασμένοι ἐσμὲν
  choice: நாம் பரிசுத்தமாக்கப்பட்டிருக்கிறோம்
  rationale: நிறைவேறிய செயலும் அதன் தொடரும் விளைவும் சேர்ந்த கிரேக்க perfect periphrastic வடிவை ‘-ப்பட்டிருக்கிறோம்’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: διὰ τῆς προσφορᾶς
  choice: காணிக்கையாகச் செலுத்தப்பட்டதன் மூலம்
  rationale: διά + genitive இங்கு வழிமுறை அல்லது கருவியைக் குறிக்கிறது; προσφοράவின் காணிக்கை/செலுத்துதல் பொருளையும் தமிழ் வாக்கியத்தில் தெளிவாகக் கொண்டுவருகிறது.
- source_word: τοῦ σώματος
  choice: உடல்
  rationale: மூலத்தில் உள்ள தெளிவான உடல்சார்ந்த குறிப்பைப் பாதுகாக்கிறது; அதை வெறும் பொதுவான ‘பலி’ என்று சுருக்கவில்லை.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியாவின்
  rationale: Χριστός இங்கு இயேசுவுக்குரிய பட்டமாகப் பொருள்படுவதால், அதன் ‘அபிஷேகம் செய்யப்பட்டவர்/மெசியா’ என்ற பட்டப்பொருளைப் பாதுகாக்கிறது.
- source_word: ἐφάπαξ
  choice: ஒரே முறையாகவே
  rationale: அந்தச் செலுத்துதல் ஒரே முறை நிகழ்ந்ததும் மீண்டும் செய்யப்பட வேண்டாததுமான தன்மையைச் சுருக்கமாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பரிசுத்தமாக்குதலின் காலவினைத் தன்மை
  choice: ‘பரிசுத்தமாக்கப்பட்டிருக்கிறோம்’ என்று நிறைவேறிய செயலின் தொடரும் விளைவைக் காக்கப்பட்டது
  alternative: ‘பரிசுத்தமாக்கப்பட்டோம்’ அல்லது ‘பரிசுத்தமாக்கப்படுகிறோம்’
  rationale: ἡγιασμένοι ἐσμὲν என்பது நிகழ்காலத் தொடர்வினை அல்ல; perfect வடிவம் நிறைவேறிய செயலும் நிலைத்த விளைவும் இரண்டையும் உணர்த்துகிறது. இதற்கு மேலாக எந்தச் சமயக்கோட்பாட்டையும் உரையில் புகுத்தவில்லை.
- issue: Χριστός என்ற கிறிஸ்துவியல் பட்டம்
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இவ்விடத்தில் அந்தச் சொல் பட்டப்பொருளைத் தெளிவாகத் தாங்குவதால் ‘மெசியா’ என்று மொழிபெயர்க்கப்பட்டது; பரவலான பெயர்வடிவமான ‘கிறிஸ்து’ அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் புரியக்கூடிய, அதேவேளையில் வேதவாக்கியத்திற்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘திருவுளம்’, ‘பரிசுத்தமாக்கப்பட்டிருக்கிறோம்’, ‘காணிக்கையாகச் செலுத்தப்பட்டது’ ஆகியவை சமயச் சூழலின் செறிவைத் தக்கவைத்தும் வாக்கியத்தை இயல்பாக வைத்தும் உள்ளன.
