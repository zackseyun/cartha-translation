  source_fidelity: 'கருத்தும் இலக்கணத் தொடர்பும் பெரும்பாலும் துல்லியமாக உள்ளன: பரிசுத்த ஆவியானவர் செயற்படும் சாட்சியாகவும், ἡμῖν ‘நமக்கு’ என்றும், μετὰ γὰρ τὸ εἰρηκέναι ‘அவர் கூறிய பின்பு’ என்றும் சரியாகக் கொடுக்கப்பட்டுள்ளன. ஆனால் மூலத்தில் δέ மற்றும் γάρ இணைக்கும் ஒரே தொடரைத் தமிழில் முற்றுப்புள்ளி பிரிப்பது வாதத் தொடரைச் சற்றுத் தளர்த்துகிறது.'
