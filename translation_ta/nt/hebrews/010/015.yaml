  text: And the Holy Spirit also testifies to us[a]; for after saying,
translation:
  language: ta
  text: 'பரிசுத்த ஆவியானவரும் நமக்குச் சாட்சியளிக்கிறார்[a]; ஏனெனில், அவர் கூறிய பின்பு:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நமக்குச் சாட்சி கூறுகிறார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρεῖ
  choice: சாட்சி கூறுகிறார்
  rationale: நிகழ்காலச் செயப்பாட்டு வினையை இயல்பான நவீனத் தமிழில் தருவதோடு, சாட்சியளித்தல் என்ற சொலின் கருத்தையும் காக்கிறது.
- source_word: δὲ
  choice: —
  rationale: இங்கு இது வலுவான முரண்பாட்டைக் காட்டாமல் உரையை முன்னெடுக்கும் மென்மையான இணைப்பாக உள்ளது; தமிழில் தனிச் சொல்லாக மொழிபெயர்க்காமல் விடுவது இயல்பான ஓட்டத்தைத் தருகிறது.
- source_word: ἡμῖν
  choice: நமக்கு
  rationale: μαρτυρεῖ என்பதுடன் வரும் வேற்றுமைப் பொருளை, ஆவியானவர் வாசகர்களுக்குச் சாட்சி கூறுகிறார் என்று நேரடியாக வெளிப்படுத்துகிறது.
- source_word: καὶ
  choice: -உம்
  rationale: பரிசுத்த ஆவியானவரை கூடுதல் சாட்சியாகச் சேர்க்கும் பொருளைத் தமிழின் இணைப்புப் பின்னொட்டு இயல்பாகக் காட்டுகிறது.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: பரிசுத்த ஆவியானவர்
  rationale: குறிப்பிட்ட பரிசுத்த ஆவியைக் குறிக்கும் மரியாதைமிக்க, தற்காலத் தமிழ்க் கிறிஸ்தவப் பயன்பாடு; தனிப்பட்ட செயற்பாட்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μετὰ γὰρ τὸ εἰρηκέναι
  choice: ஏனெனில், அவர் கூறிய பின்பு
  rationale: μετά உடன் வரும் பெயரெச்ச வினைச்சொல்லின் காலத் தொடர்ச்சியைப் பாதுகாக்கிறது. கிரேக்கத்தில் மறைந்துள்ள செய்பவரை முந்தைய வாக்கியத்திலுள்ள பரிசுத்த ஆவியானவராகத் தமிழில் வெளிப்படையாகக் காட்டுவது இயல்புக்கும் தெளிவுக்கும் உதவுகிறது.
theological_decisions:
- issue: பரிசுத்த ஆவியானவரின் தனிப்பட்ட சாட்சிச் செயல்
  choice: பரிசுத்த ஆவியானவரும் நமக்குச் சாட்சி கூறுகிறார்
  alternative: பரிசுத்த ஆவியானவரும் நமக்காகச் சாட்சி கூறுகிறார்
  rationale: கிரேக்க வாக்கிய அமைப்பு பரிசுத்த ஆவியானவரைச் செயற்படும் சாட்சியாகக் காட்டுகிறது; ἡμῖν என்பதை ‘நமக்கு’ என்று தருவது சாட்சி யாரிடம் கூறப்படுகிறது என்பதைக் காக்கிறது, ‘நமக்காக’ என்று மாற்றி பரிந்துரைத்தல் அல்லது ஆதரவாகச் சாட்சி அளித்தல் என்ற கூடுதல் கருத்தைச் சேர்க்கவில்லை.
- issue: εἰρηκέναι என்பதன் மறைந்துள்ள எழுவாய்
  choice: அவர் கூறிய பின்பு
  alternative: கூறிய பின்பு
  rationale: எழுவாய் கிரேக்கத்தில் வெளிப்படையாக இல்லை என்றாலும், முந்தைய உடனடி எழுவாயான பரிசுத்த ஆவியானவரே இயல்பான தொடர்பு. தமிழில் ‘அவர்’ என்று குறிப்பிடுவது வாசிப்பை இயல்பாக்குகிறது; அடுத்த வசனத்தில் தொடங்கும் மேற்கோளோடு உள்ள தொடர்பை மாற்றுவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளை வேதாகம வாசிப்புக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்த மேற்கோளை அறிமுகப்படுத்துவதால் இறுதியில் முக்காற்புள்ளி வைக்கப்பட்டுள்ளது.
