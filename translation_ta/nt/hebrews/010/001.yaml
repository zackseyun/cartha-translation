id: HEB.10.1
reference: Hebrews 10:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Σκιὰν γὰρ ἔχων ὁ νόμος τῶν μελλόντων ἀγαθῶν, οὐκ αὐτὴν τὴν εἰκόνα τῶν πραγμάτων, κατ’ ἐνιαυτὸν ταῖς αὐταῖς θυσίαις ἃς προσφέρουσιν εἰς τὸ διηνεκὲς οὐδέποτε ⸀δύναται τοὺς προσερχομένους τελειῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/001.yaml
  text: For since the law has only a shadow of the good things to come[a], not the very form of the realities, it can never, by the same sacrifices that they continually offer year after year[c][b], perfect those who draw near.
translation:
  language: ta
  text: வரப்போகும் நன்மைகளின் நிழலை மட்டுமே திருச்சட்டம் கொண்டிருக்கிறது; நிஜங்களின் உண்மையான வடிவத்தையே அல்ல. அது, ஆண்டுதோறும் தொடர்ந்து செலுத்திவரும் அதே பலிகளால், அணுகுகிறவர்களை[a] ஒருபோதும் முழுமையாக்க முடியாது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அணுகுகிறவர்கள்” என்பது வழிபாட்டில் கடவுளை அணுகுகிறவர்களைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, “நிறைவுக்குக் கொண்டுவர முடியாது” அல்லது “இலக்கை அடையச் செய்ய முடியாது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σκιὰν
  choice: நிழலை
  rationale: σκιά என்பதன் நேரடியான உருவகத்தைப் பாதுகாக்கிறது; பின்னர் வரும் εἰκών உடனான வேறுபாடும் தெளிவாகிறது.
- source_word: τῶν μελλόντων ἀγαθῶν
  choice: வரப்போகும் நன்மைகளின்
  rationale: எதிர்கால நோக்கை இயல்பான தமிழில் தெரிவிக்கிறது; காலத்தை தேவையின்றி மேலும் குறிப்பாக்கவில்லை.
- source_word: οὐκ αὐτὴν τὴν εἰκόνα τῶν πραγμάτων
  choice: அவற்றின் உண்மையான உருவத்தையே அது கொண்டிருக்கவில்லை
  rationale: αὐτήν என்பதன் வலியுறுத்தலையும், நிழலுக்கு எதிராக நிற்கும் அசல்/முழுமையான உருவம் என்ற εἰκών கருத்தையும் தக்கவைக்கிறது. ‘அவற்றின்’ என்பது முன் கூறப்பட்ட நன்மைகளைக் குறிக்கிறது.
- source_word: κατ’ ἐνιαυτὸν
  choice: ஆண்டுதோறும்
  rationale: வருடாந்திரமாகத் திரும்பத் திரும்ப நிகழ்வதைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: ταῖς αὐταῖς θυσίαις
  choice: அதே பலிகளால்
  rationale: பலிகள் கருவியாக இருப்பதைக் காட்டும் தத்துவேற்றுமைப் பொருளையும் ‘அதே’ என்ற மீளச்செயல் வலியுறுத்தலையும் காக்கிறது.
- source_word: ἃς προσφέρουσιν εἰς τὸ διηνεκές
  choice: இடைவிடாமல் செலுத்தப்படும்
  rationale: தொடர்ச்சியாக மேற்கொள்ளப்படும் பலிச் செலுத்துதலைத் தெரிவிக்கிறது; கிரேக்கத்தில் செய்பவர் வெளிப்படையாகக் குறிப்பிடப்படாததால் தமிழில் இயல்பான செயப்பாட்டு வடிவம் பயன்படுத்தப்படுகிறது.
- source_word: οὐδέποτε δύναται
  choice: ஒருபோதும் ... முடியாது
  rationale: முற்றிலும் இயலாமையைச் சுட்டும் வலுவான மறுப்பை இயல்பான தமிழில் காக்கிறது.
- source_word: τοὺς προσερχομένους
  choice: கடவுளை அணுகுகிறவர்களை
  rationale: எபிரெயரில் உள்ள வழிபாட்டு/கடவுளை அணுகும் உட்பொருளை வெளிப்படுத்துகிறது; கிரேக்கத்தில் மறைந்துள்ள இலக்கை தெளிவுக்காகச் சேர்க்கிறது.
- source_word: τελειῶσαι
  choice: நிறைவுள்ளவர்களாக்க
  rationale: இலக்கை அடையச் செய்தல், கடவுளை முழுமையாக அணுகத் தகுதிப்படுத்துதல் என்ற எபிரெயர் நூலின் பொருளைத் தக்கவைக்கிறது; ஒழுக்கக் குறையின்மை என்று மட்டும் தவறாகப் புரிந்துகொள்ளப்படுவதைத் தவிர்க்கிறது.
theological_decisions:
- issue: திருச்சட்டத்தின் நிழலுக்கும் உண்மையான உருவத்துக்கும் உள்ள உறவு
  choice: திருச்சட்டம் வரப்போகும் நன்மைகளின் நிழலைக் கொண்டது; அவற்றின் உண்மையான உருவத்தையே கொண்டிருக்கவில்லை
  alternative: திருச்சட்டமே வரப்போகும் நன்மைகளின் உருவகம் அல்லது முழு நிஜம்
  rationale: கிரேக்கம் σκιά மற்றும் εἰκών ஆகியவற்றைத் தெளிவாக வேறுபடுத்துகிறது. மொழிபெயர்ப்பு திருச்சட்டத்தின் முன்னறிவிக்கும் பங்கை மதிக்கிறது; அதையே இறுதி நிறைவாகவும் ஆக்கவில்லை.
- issue: τελειῶσαι என்பதன் பலியியல் பொருள்
  choice: நிறைவுள்ளவர்களாக்க
  alternative: பரிபூரணமாக்க / முழுமைப்படுத்த
  rationale: இச்சொல் எபிரெயரில் கடவுளை அணுகுவதற்கான நிறைவு மற்றும் இலக்கை அடைதல் ஆகியவற்றோடு தொடர்புடையது. ‘நிறைவுள்ளவர்களாக்க’ என்பது இந்தத் தெய்வவியல் எதிரொலியைப் பாதுகாத்து, பாவமற்ற ஒழுக்கப் பரிபூரணம் என்ற ஒரே பொருளுக்குள் அதைச் சுருக்காது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்குரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘திருச்சட்டம்,’ ‘பலி,’ ‘கடவுளை அணுகுதல்,’ ‘நிறைவு’ ஆகிய சொற்கள் கடிதத்தின் வழிபாட்டு மற்றும் தெய்வவியல் சூழலைத் தக்கவைக்கின்றன.
