reference: Hebrews 10:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πόσῳ δοκεῖτε χείρονος ἀξιωθήσεται τιμωρίας ὁ τὸν υἱὸν τοῦ θεοῦ καταπατήσας, καὶ τὸ αἷμα τῆς διαθήκης κοινὸν ἡγησάμενος ἐν ᾧ ἡγιάσθη, καὶ τὸ πνεῦμα τῆς χάριτος ἐνυβρίσας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/029.yaml
  text: How much worse punishment do you think will be deserved by the one who has trampled underfoot the Son of God[a], and has regarded the blood of the covenant by which he was sanctified as common[c][b], and has insulted the Spirit of grace?
translation:
  language: ta
  text: தேவனுடைய மகனைக் காலால் மிதித்து, அதன் மூலம் தான் பரிசுத்தமாக்கப்பட்ட உடன்படிக்கையின் இரத்தத்தைச் சாதாரணமானதாகக் கருதி, அருளின் ஆவியை அவமதித்தவன் இன்னும் எவ்வளவு கடுமையான தண்டனைக்குத் தகுதியானவனாகக் கருதப்படுவான் என்று எண்ணுகிறீர்கள்?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόσῳ … χείρονος
  choice: இன்னும் எவ்வளவு கடுமையான
  rationale: ஒப்பீட்டுப் பொருளையும் வினாவியல் வலிமையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; முந்தைய தண்டனையைவிடக் கடுமையான தண்டனை என்பது சூழலில் தெளிவாகிறது.
- source_word: ἀξιωθήσεται τιμωρίας
  choice: தண்டனைக்குத் தகுதியானவனாகக் கருதப்படுவான்
  rationale: செயப்பாட்டு வடிவிலுள்ள ‘தகுதியுள்ளவனாகத் தீர்மானிக்கப்படுதல்’ என்ற நீதித்துறை சார்ந்த பொருளைப் பாதுகாக்கிறது.
- source_word: καταπατήσας
  choice: காலடியில் மிதித்து
  rationale: வெறுப்புடனும் இகழ்ச்சியுடனும் நடத்துவதைச் சித்தரிக்கும் மூலமொழியின் வலுவான உருவகத்தைத் தக்கவைக்கிறது.
- source_word: υἱὸν τοῦ θεοῦ
  choice: தேவனுடைய மகன்
  rationale: கிறிஸ்துவைக் குறிக்கும் மூலமொழிப் பட்டத்தைத் துல்லியமாகவும் வழக்கமான தமிழ் நடையிலும் தருகிறது.
- source_word: αἷμα τῆς διαθήκης
  choice: உடன்படிக்கையின் இரத்தம்
  rationale: உடன்படிக்கை மற்றும் பலி ஆகிய இரு தொடர்புகளையும் கொண்ட வேதாகமச் சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: κοινὸν
  choice: சாதாரணமானதாக
  rationale: பரிசுத்தமானதற்கு எதிரான ‘பொதுப் பயன்பாட்டுக்குரியது, தனியே அர்ப்பணிக்கப்படாதது’ என்ற அடிப்படைப் பொருளை வாசகருக்கு இயல்பான தமிழில் தருகிறது.
- source_word: ἡγησάμενος
  choice: கருதி
  rationale: ஒரு பொருளை மதிப்பிட்டு அவ்வாறு எண்ணுதல் என்ற மனத் தீர்மானத்தைக் குறிக்கும் வினையைச் சுருக்கமாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: ἐν ᾧ ἡγιάσθη
  choice: தான் பரிசுத்தமாக்கப்பட்ட
  rationale: இரத்தத்தின் வழியாகப் பரிசுத்தமாக்கப்பட்டதையும், செயப்படுபவனைக் குறிக்கும் ஒருமை வடிவத்தையும் தமிழ் வாக்கிய அமைப்பில் பாதுகாக்கிறது.
- source_word: τὸ πνεῦμα τῆς χάριτος
  choice: அருளின் ஆவி
  rationale: மூலத்தின் தொடர்புச் சொற்றொடரைத் தக்கவைத்து, தேவனுடைய அருளை அளிக்கும் அல்லது அருளால் அடையாளப்படுத்தப்படும் ஆவி என்ற செறிவைத் திறந்தே வைக்கிறது.
- source_word: ἐνυβρίσας
  choice: அவமதித்தவன்
  rationale: இழிவாகவும் அகந்தையுடனும் நடத்துதல் என்ற வலுவான பொருளை நவீனத் தமிழில் தெளிவாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: ἐν ᾧ ἡγιάσθη என்பதில் பரிசுத்தமாக்கப்பட்டவர் யார்?
  choice: மூலமொழியின் இயல்பான வாக்கியத் தொடர்பைப் பின்பற்றி, குற்றஞ்சாட்டப்படும் அந்த நபரே ‘தான் பரிசுத்தமாக்கப்பட்ட’வர் என முதன்மை உரை அமைக்கப்பட்டுள்ளது.
  alternative: சிலர் இதைக் கிறிஸ்துவையோ உடன்படிக்கைச் சமூகத்தையோ வேறு தொடர்பையோ குறிப்பதாக விளக்குகின்றனர்.
  rationale: ஒருமையில் வரும் வினையெச்சங்களால் விவரிக்கப்படும் நபரே அருகிலுள்ள இயல்பான இலக்கணத் தொடர்பு. இருப்பினும், விசுவாசத்திலிருந்து விலகுதல் மற்றும் நிலைத்திருத்தல் பற்றிய இறையியல் விவாதத்தை மொழிபெயர்ப்பே முடிவுசெய்யாதபடி மாற்றுக் கருத்து அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் நீண்ட வினையெச்சத் தொடரும் இறுதியிலுள்ள வினாவியல் உச்சமும் இயன்றவரை தக்கவைக்கப்பட்டுள்ளன; ‘பரிசுத்தமாக்கப்பட்ட’ மற்றும் ‘உடன்படிக்கை’ போன்ற முக்கிய வேதாகமச் சொற்கள் கருத்துச் செறிவுக்காகப் பாதுகாக்கப்பட்டுள்ளன.
