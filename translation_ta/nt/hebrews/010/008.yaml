source:
  edition: SBLGNT
  text: ἀνώτερον λέγων ὅτι ⸂Θυσίας καὶ προσφορὰς⸃ καὶ ὁλοκαυτώματα καὶ περὶ ἁμαρτίας οὐκ ἠθέλησας οὐδὲ εὐδόκησας, αἵτινες κατὰ ⸀νόμον προσφέρονται,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/008.yaml
  text: After saying above[a], “Sacrifices and offerings and whole burnt offerings and sin offerings you did not desire[c][b], nor did you delight in”—which are offered according to the law—
translation:
  language: ta
  text: மேலே, “பலிகளையும் காணிக்கைகளையும், முழுத் தகனபலிகளையும், பாவத்திற்கான பலிகளையும்[a] நீர் விரும்பவில்லை; அவற்றில் மகிழ்ச்சி அடையவும் இல்லை” என்று அவர் கூறுகிறார்—இவை சட்டத்தின்படி செலுத்தப்படுகின்றன—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாவபலிகளையும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνώτερον λέγων
  choice: முன்பு அவர் ... என்று சொல்கிறார்
  rationale: ἀνώτερον முந்தைய மேற்கோள் வரிகளைச் சுட்டுகிறது; நிகழ்காலப் பங்கேற்பான λέγων உடன் சேர்ந்த அமைப்பை இயல்பான தமிழ் உரையாடல் தொடராக வழங்குகிறது.
- source_word: Θυσίας καὶ προσφορὰς
  choice: பலிகளையும் காணிக்கைகளையும்
  rationale: வழிபாட்டுச் சூழலிலுள்ள இரு வேறுபட்ட பொதுப் பலிவகைச் சொற்களையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ὁλοκαυτώματα
  choice: முழுத் தகனபலிகளையும்
  rationale: பலிப்பீடத்தில் முழுவதுமாக எரிக்கப்படும் பலிகள் என்ற கூட்டுச்சொல்லின் சிறப்பு நுண்பொருளை வெளிப்படுத்துகிறது.
- source_word: περὶ ἁμαρτίας
  choice: பாவத்திற்கான பலிகளையும்
  rationale: சொற்றொடரின் நேரடியான பொருளையும் பலிசார் பயன்பாட்டையும் பாதுகாக்கிறது; 'பாவநிவாரணபலி' என விளைவைக் கூடுதலாக நிர்ணயிப்பதைத் தவிர்க்கிறது.
- source_word: οὐκ ἠθέλησας
  choice: நீர் விரும்பவில்லை
  rationale: இறைவனை நோக்கிய இரண்டாம் நபர் ஒருமையை மரியாதையான தமிழில் தருவதோடு θέλω என்பதன் விருப்பப் பொருளையும் காக்கிறது.
- source_word: οὐδὲ εὐδόκησας
  choice: அவற்றில் மகிழவும் இல்லை
  rationale: εὐδοκέω-வின் மனமகிழ்ச்சி அல்லது உவப்புப் பொருளை முந்தைய 'விரும்பவில்லை' என்பதிலிருந்து வேறுபடுத்துகிறது; தமிழில் தேவைப்படும் குறிப்பு-பொருள் பட்டியலிலிருந்து தெளிவாக நிரப்பப்படுகிறது.
- source_word: κατὰ νόμον προσφέρονται
  choice: திருச்சட்டத்தின்படி செலுத்தப்படுகின்றன
  rationale: சட்டத்தின் விதிமுறைக்கு இணங்க இப்பலிகள் செலுத்தப்படுவதை நிகழ்காலச் செயப்பாட்டு வடிவில் தருகிறது; சூழலில் மோசேயின் வழியாகக் கொடுக்கப்பட்ட இறைச்சட்டத்தைக் குறிக்கும் வகையில் 'திருச்சட்டம்' பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: சங்கீத மேற்கோளில் குறிப்பிடப்படும் பலிவகைகளின் தனித்தன்மை
  choice: “பலிகளையும் காணிக்கைகளையும், முழுத் தகனபலிகளையும், பாவத்திற்கான பலிகளையும்” என்று வகைகளைத் தனித்தனியாக வழங்குதல்
  alternative: “பலிகளையும் காணிக்கைகளையும், தகனபலிகளையும் பாவநிவாரணபலிகளையும்”
  rationale: கிரேக்கப் பட்டியலின் நான்கு கூறுகளையும் பாதுகாத்து, பின்னைய கோட்பாட்டு விளக்கத்தை உரைக்குள் சேர்க்காமல் பலிசார் தன்மையைத் தெளிவாக்குகிறது.
- issue: சட்டப்படி செலுத்தப்பட்ட பலிகள் குறித்த இறைவனின் எதிர்மறைக் கூற்றின் பதற்றம்
  choice: “நீர் விரும்பவில்லை; அவற்றில் மகிழவும் இல்லை”—“இவை திருச்சட்டத்தின்படி செலுத்தப்படுகின்றன” என்ற இரு கூற்றுகளையும் விளக்கமின்றிப் பக்கத்தில் வைத்தல்
  alternative: இறைவன் பலிகளை முழுமையாக நிராகரித்தார் அல்லது அவற்றை ஒப்பீட்டளவில் மட்டுமே விரும்பவில்லை என்று உரையிலேயே விளக்குதல்
  rationale: 'மூலத்தில் உள்ள இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் பாதுகாக்கிறது: மறுப்பு வலுவாகவே நிற்கிறது; அதேவேளை அவை சட்டத்தின்படி செலுத்தப்படுவன என்பதும் அப்படியே கூறப்படுகிறது.'
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் மரியாதைமிக்க வேதாகம நடையைப் பயன்படுத்தியுள்ளது. “முழுத் தகனபலி” தொழில்நுட்பத் தன்மையைத் தக்கவைக்கிறது; “திருச்சட்டம்” இச்சூழலில் மோசேயின் சட்டத்தைக் குறிக்கிறது. வசனம் அடுத்த வசனத்தில் தொடரும் இலக்கண அமைப்பாக இருப்பதால் இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது.
