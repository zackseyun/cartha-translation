source:
  edition: SBLGNT
  text: καὶ ἱερέα μέγαν ἐπὶ τὸν οἶκον τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/021.yaml
  text: and a great priest over the house of God[b][a],
translation:
  language: ta
  text: மேலும், கடவுளின் வீட்டை[b] மேற்பார்வையிடும் பெரிய ஆசாரியர்[a] ஒருவரும் நமக்கு இருப்பதால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பிரதான ஆசாரியர்.” எபிரெயர் நூல் இயேசுவைப் பலமுறை பிரதான ஆசாரியராக முன்வைக்கிறது; ஆனால் இவ்வசனம் சொல்லுக்குச் சொல் “பெரிய ஆசாரியர்” என்கிறது.
    reason: alternative_reading
  - marker: b
    text: “கடவுளின் வீடு” என்பது கடவுளுடைய வீட்டாரை, அதாவது அவருடைய மக்களையும், குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: ஒருவரும்
  rationale: முந்தைய கூற்றுடன் இந்த இணையான இரண்டாவது அடிப்படையை இணைக்கும் καὶ-யின் பொருளை, தமிழ் வாக்கிய அமைப்பில் இயல்பாக ‘-உம்’ வெளிப்படுத்துகிறது.
- source_word: ἱερέα
  choice: ஆசாரியர்
  rationale: ἱερεύς என்பதன் நேரான பொருள் ‘ஆசாரியர்’. இங்கு ἀρχιερεύς என்ற தொழில்நுட்பத் தலைப்பு வராததால் ‘பிரதான ஆசாரியர்’ என்று முதன்மை உரையில் மொழிபெயர்க்கப்படவில்லை.
- source_word: μέγαν
  choice: பெரிய
  rationale: ஆசாரியரின் மேன்மையைச் சுட்டும் μέγας என்ற சொல்லின் தனித்துவத்தைப் பாதுகாக்கிறது; அதை ‘பிரதான’ என்ற பதவிப்பெயராக மாற்றவில்லை.
- source_word: ἐπὶ
  choice: வீட்டுக்குப் பொறுப்பான
  rationale: ἐπὶ + accusative இங்கு மேற்பார்வை அல்லது பொறுப்பைக் குறிக்கிறது. சொல்லுக்குச் சொல் ‘வீட்டின்மேல்’ என்பதைவிட இவ்வடிவம் நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: τὸν οἶκον
  choice: வீடு
  rationale: οἶκος என்பதிலுள்ள ‘வீடு’ என்ற வேதாகம உருவகத்தைப் பாதுகாக்கிறது; அது ‘குடும்பம்/வீட்டார்’, அதாவது கடவுளுடைய மக்கள், என்ற பொருளையும் தாங்கக்கூடும் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: τοῦ θεοῦ
  choice: கடவுளின்
  rationale: இந்த உரிமை வேற்றுமையை நவீன பொதுத்தமிழில் நேராகவும் இயல்பாகவும் வழங்குகிறது.
theological_decisions:
- issue: ἱερέα μέγαν என்பதைத் தொழில்நுட்பத் தலைப்பான ‘பிரதான ஆசாரியர்’ என்று மொழிபெயர்க்க வேண்டுமா?
  choice: பெரிய ஆசாரியர்
  alternative: பிரதான ஆசாரியர்
  rationale: எபிரெயர் நூலின் விரிந்த சூழல் இயேசுவைப் பிரதான ஆசாரியராக முன்வைத்தாலும், இவ்வசனம் ἀρχιερεύς என்பதற்குப் பதிலாக ἱερεύς + μέγας என்பதையே பயன்படுத்துகிறது. ஆகவே மூலத்தின் சொல் வேறுபாடும் அதன் இறையியல் அழுத்தமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிதாகப் புரியும், அதே நேரத்தில் கண்ணியமான நடை பயன்படுத்தப்பட்டது. தனித்து வாசிக்கப்படும் வசனம் தமிழில் முழுமையாக அமைய, முந்தைய வசனங்களிலிருந்து தொடரும் ἔχοντες (‘நமக்கு இருப்பதால்’) என்ற இலக்கணக் கட்டமைப்பு வெளிப்படையாக வழங்கப்பட்டது. ‘பெரிய ஆசாரியர்’ என்ற சற்றே வழக்கமற்ற ஆனால் மூலத்திற்கு நெருக்கமான சொற்றொடர் நோக்கத்துடன் தக்கவைக்கப்பட்டது.
