revisions:
- from: ஏனெனில், நீங்கள் தேவனுடைய விருப்பத்தைச் செய்தபின், வாக்குத்தத்தத்தை[a] பெற்றுக்கொள்ளும்படி உறுதியுடன் நிலைத்திருப்பது உங்களுக்குத் தேவை.
  to: ஏனெனில், நீங்கள் தேவனுடைய விருப்பத்தைச் செய்தபின் வாக்குத்தத்தத்தைப் பெற்றுக்கொள்ளும்படி, உங்களுக்கு உறுதியுடன் நிலைத்திருத்தல் தேவை.
  rationale: The revision places the purpose clause after the statement of need and keeps “செய்தபின்” directly with the receiving of the promise. This preserves the Greek syntactic sequence and temporal relation without resolving whether ἐπαγγελία refers to the promise itself or what was promised.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:03:00Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the key terms, including endurance, doing God's will, receiving, and the deliberately open sense of "the promise." However, its word order makes "after doing God's will" appear to modify the need to endure, rather than the receiving of the promise. The Greek participle ποιήσαντες is antecedent to κομίσησθε.
  naturalness: The wording is generally clear and suitably dignified in modern standard Tamil. Reordering the clauses gives the intended relationship plainly and reads more naturally.
  terminology: “உறுதியுடன் நிலைத்திருத்தல்” adequately conveys ὑπομονή as steadfast endurance. “தேவனுடைய விருப்பம்” and “வாக்குத்தத்தம்” are appropriate. The footnote alternative is made more idiomatic as “வாக்குத்தத்தமாக அளிக்கப்பட்டதை.”
  issues:
  - severity: medium
    issue: Modifier scope and clause order
    rationale: In “நீங்கள் தேவனுடைய விருப்பத்தைச் செய்தபின், வாக்குத்தத்தத்தைப் பெற்றுக்கொள்ளும்படி உறுதியுடன் நிலைத்திருப்பது உங்களுக்குத் தேவை,” “செய்தபின்” can naturally be read with “நிலைத்திருப்பது உங்களுக்குத் தேவை.” The source instead states that endurance is needed so that, after doing God's will, the readers may receive the promise.
  revised_text: ஏனெனில், நீங்கள் தேவனுடைய விருப்பத்தைச் செய்தபின் வாக்குத்தத்தத்தைப் பெற்றுக்கொள்ளும்படி, உங்களுக்கு உறுதியுடன் நிலைத்திருத்தல் தேவை.
  revised_footnotes:
  - marker: a
    text: அல்லது, “வாக்குத்தத்தமாக அளிக்கப்பட்டதை.”
    reason: ἐπαγγελίαν என்பது வாக்குத்தத்தத்தையே அல்லது வாக்குத்தத்தமாக அளிக்கப்பட்டதைக் குறிக்கக்கூடிய பொருள் நுணுக்கத்தைப் பேணுகிறது.
  revision_rationale: The revision places the purpose clause after the statement of need and keeps “செய்தபின்” directly with the receiving of the promise. This preserves the Greek syntactic sequence and temporal relation without resolving whether ἐπαγγελία refers to the promise itself or what was promised.
