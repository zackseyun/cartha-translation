id: HEB.10.36
reference: Hebrews 10:36
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὑπομονῆς γὰρ ἔχετε χρείαν ἵνα τὸ θέλημα τοῦ θεοῦ ποιήσαντες κομίσησθε τὴν ἐπαγγελίαν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/036.yaml
  text: For you have need of endurance[a], so that after doing the will of God you may receive the promise.
translation:
  language: ta
  text: ஏனெனில், நீங்கள் தேவனுடைய விருப்பத்தைச் செய்தபின் வாக்குத்தத்தத்தைப் பெற்றுக்கொள்ளும்படி, உங்களுக்கு உறுதியுடன் நிலைத்திருத்தல் தேவை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπομονῆς
  choice: உறுதியுடன் நிலைத்திருப்பது
  rationale: சோதனை அல்லது அழுத்தத்தின் கீழும் தளராமல் தொடர்ந்து நிலைத்திருப்பதை ὑπομονή குறிக்கிறது. வெறும் காத்திருத்தலைக் குறிக்கக்கூடிய ‘பொறுமை’ என்பதைவிட இச்சொற்றொடர் சூழலுக்குரிய செயற்பாட்டு நுணுக்கத்தைத் தெளிவாகத் தருகிறது.
- source_word: χρείαν ἔχετε
  choice: உங்களுக்குத் தேவை
  rationale: ‘தேவைப்படுதல்’ என்னும் கிரேக்க மரபுத்தொடரின் பொருளை இயல்பான நவீன தமிழில் நேரடியாகத் தருகிறது.
- source_word: ἵνα
  choice: பெற்றுக்கொள்ளும்படி
  rationale: நோக்கம் அல்லது எதிர்பார்க்கப்படும் விளைவைத் தெரிவிக்கும் ἵνα என்பதன் உறவைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: தேவனுடைய விருப்பம்
  rationale: கிரேக்க உரையின் உடைமைத் தொடர்பைப் பேணுகிறது; θέλημα என்பதை நவீனத் தமிழில் எளிதாகப் புரியும் ‘விருப்பம்’ என மொழிபெயர்க்கிறது.
- source_word: ποιήσαντες
  choice: செய்தபின்
  rationale: இறந்தகாலப் பங்கேற்புவினை முதன்மை வினைக்கு முந்திய செயலைக் குறிப்பதால், ‘செய்தபின்’ அதன் காலத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: κομίσησθε
  choice: பெற்றுக்கொள்ளும்படி
  rationale: இச்சூழலில் வாக்குறுதியளிக்கப்பட்டதைப் பெறுதல் அல்லது அடைதல் என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: τὴν ἐπαγγελίαν
  choice: வாக்குத்தத்தத்தை
  rationale: கிரேக்கத்தில் உள்ள ‘வாக்குத்தத்தம்’ என்ற பெயர்ச்சொல்லை நேரடியாகப் பேணி, அது வாக்குறுதியையே குறிக்கிறதா அல்லது வாக்குறுதியளிக்கப்பட்ட நிறைவேற்றத்தைக் குறிக்கிறதா என்ற நுணுக்கத்தை முதன்மை உரையில் தீர்த்துவிடாமல் வைக்கிறது.
theological_decisions:
- issue: ἐπαγγελίαν என்பது வாக்குத்தத்தத்தையே குறிக்கிறதா, அல்லது வாக்குத்தத்தம் செய்யப்பட்ட பலன்/நிறைவேற்றத்தைக் குறிக்கிறதா?
  choice: வாக்குத்தத்தத்தை
  alternative: வாக்குத்தத்தம் செய்யப்பட்டதை
  rationale: கிரேக்க உரை நேரடியாக ‘வாக்குத்தத்தம்’ என்றாலும், κομίσησθε உடன் வரும்போது வாக்குத்தத்தம் செய்யப்பட்டதைப் பெறுதல் என்ற பொருளும் அமையலாம். மூலத்தின் சொல்வடிவத்தையும் இறையியல் நெருக்கடியையும் பேண முதன்மை உரையில் ‘வாக்குத்தத்தத்தை’ வைக்கப்பட்டு, விளக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘உறுதியுடன் நிலைத்திருப்பது’ என்பது சோதனையின் கீழ் தொடரும் மனத்திடத்தை இயல்பாக வெளிப்படுத்துகிறது.
