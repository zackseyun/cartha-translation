source:
  edition: SBLGNT
  text: ἐπεὶ οὐκ ἂν ἐπαύσαντο προσφερόμεναι, διὰ τὸ μηδεμίαν ἔχειν ἔτι συνείδησιν ἁμαρτιῶν τοὺς λατρεύοντας ἅπαξ ⸀κεκαθαρισμένους;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/002.yaml
  text: Otherwise[a], would they not have stopped being offered, because those who worship, having once been cleansed[b], would no longer have any consciousness of sins?
translation:
  language: ta
  text: அப்படியானால், வழிபடுகிறவர்கள் ஒரே முறை[b] தூய்மையாக்கப்பட்டபின், பாவங்களைப் பற்றிய எந்த உணர்வும்[a] இனி அவர்களுக்கு இருக்காது என்பதால், அந்தப் பலிகள் செலுத்தப்படுவதை நிறுத்தியிருக்கும் அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பாவங்களைக் குறித்த மனச்சாட்சி’ அல்லது ‘பாவக் குற்றவுணர்வு’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடர் பாவங்களைப் பற்றிய மனச்சாட்சி, விழிப்புணர்வு, அல்லது உள்ளார்ந்த உணர்வைக் குறிக்கலாம்; இங்கு கடவுள்முன் பாவத்தால் உண்டாகும் குற்றச்சுமையின் தொடர்ந்த உணர்வைச் சுட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘மீண்டும் செய்யத் தேவையில்லாத ஒரே முறையாக’ என்றும் பொருள் கொள்ளலாம். இச்சூழலில் ‘ஒரே முறை’ என்பதற்கு முடிவான, திரும்பச் செய்யப்படாத செயல் என்ற வலிமை இருக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: அப்படியிருந்தால்
  rationale: முந்தைய வசனத்தின் கூற்று உண்மையாக இருந்தால் ஏற்படும் எதிர்மறை-கற்பனை விளைவை இச்சொல் அறிமுகப்படுத்துகிறது. ‘அப்படியிருந்தால்’ என்பது தமிழில் வாதத்தின் தொடர்பையும் கற்பனை நிபந்தனையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὐκ ἂν ἐπαύσαντο
  choice: நின்றிருக்குமல்லவா?
  rationale: οὐκ ἄν உடன் வரும் இறந்தகால வினை, நிகழாத ஒரு விளைவை எதிர்பார்க்கும் வினாவாகக் காட்டுகிறது. இத்தமிழ் வடிவம் அந்த எதிர்மறை-கற்பனை வினாவின் வலிமையைப் பாதுகாக்கிறது.
- source_word: προσφερόμεναι
  choice: அந்தப் பலிகள் செலுத்தப்படுவது
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட பலிகளையே இப்பெயரெச்சம் சுட்டுகிறது. ‘செலுத்தப்படுவது’ பலி சார்ந்த சூழலில் இயல்பான தமிழாகும்; ‘அந்தப் பலிகள்’ என்பது தமிழில் மறைந்திருக்கும் குறிக்கப்பெற்ற பொருளைத் தெளிவாக்குகிறது.
- source_word: διὰ τὸ μηδεμίαν ἔχειν ἔτι
  choice: இனி அவர்களுக்கு இல்லாதிருக்கும் என்பதால்
  rationale: διά உடன் வரும் பெயராக்கப்பட்ட வினையெச்சத் தொடர் காரணத்தைக் காட்டுகிறது; μηδεμίαν மற்றும் ἔτι ஆகியவை ‘இனி ... இல்லாதிருக்கும்’ எனத் தெளிவாகக் கொண்டுவரப்பட்டுள்ளன.
- source_word: συνείδησιν ἁμαρτιῶν
  choice: பாவங்களைப் பற்றிய உணர்வு
  rationale: συνείδησις என்பது மனச்சாட்சி, விழிப்புணர்வு, அல்லது உள்ளார்ந்த உணர்வு ஆகிய பொருட்களைத் தரலாம். ‘பாவங்களைப் பற்றிய உணர்வு’ என்பது ஒழுக்க உணர்வே முற்றிலும் அழிகிறது என்று சொல்லாமல், பாவம் குறித்த தொடர்ந்த உள்ளுணர்வை வெளிப்படுத்தி, மூலத்தின் பொருள் விரிவையும் காக்கிறது.
- source_word: τοὺς λατρεύοντας
  choice: வழிபடுகிறவர்கள்
  rationale: இது வழிபாட்டுச் செயலில் ஈடுபடுவோரைக் குறிக்கும் பெயராக்கப்பட்ட பெயரெச்சம். ‘வழிபடுகிறவர்கள்’ அதன் வினைத் தன்மையைக் காக்கும் இயல்பான நவீனத் தமிழ்.
- source_word: ἅπαξ
  choice: ஒரே முறை
  rationale: ἅπαξ அடிப்படையில் ‘ஒரு முறை’ என்றும், சூழலைப் பொறுத்து ‘ஒரே முறையாக, மீண்டும் செய்யத் தேவையில்லாதவாறு’ என்றும் பொருள்படலாம். முதன்மை உரை குறைந்தபட்ச நேர்ப்பொருளைக் காக்கிறது; வலிமையான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: κεκαθαρισμένους
  choice: தூய்மையாக்கப்பட்டபின்
  rationale: நிறைவுற்ற செயலும் அதன் தொடரும் விளைவும் கொண்ட perfect passive participle-ஐ இது இயல்பான தமிழில் வெளிப்படுத்துகிறது. பலி மற்றும் வழிபாட்டுச் சூழலுக்கு ‘தூய்மையாக்கப்பட்ட’ என்பது பொருத்தமானது.
theological_decisions:
- issue: தூய்மையாக்கப்பட்ட வழிபடுகிறவர்களிடம் συνείδησιν ἁμαρτιῶν இல்லாமை என்பதன் பொருள்
  choice: ‘பாவங்களைப் பற்றிய உணர்வு’ என்று மொழிபெயர்த்து, கடவுள்முன் பாவத்தால் குற்றஞ்சாட்டப்பட்டிருப்பதாகத் தொடரும் உள்ளுணர்வைக் குறிக்கிறது.
  alternative: ‘பாவங்களைக் குறித்த மனச்சாட்சி’ அல்லது ‘பாவக் குற்றவுணர்வு’
  rationale: வசனத்தின் வாதம், உண்மையில் பயனுள்ள பலி வழிபடுகிறவர்களைத் தூய்மையாக்கி, பாவம் குறித்த தொடர்ந்த குற்றச்சுமையை நீக்குமானால் அது மீண்டும் மீண்டும் செலுத்தப்படாது என்பதாகும். அதேவேளை, மனிதர் இனி பாவத்தை ஒழுக்கரீதியாக உணரவே மாட்டார் என்ற கருத்தை மொழிபெயர்ப்பு கட்டாயப்படுத்தக் கூடாது.
- issue: ἅπαξ என்பதின் முடிவுறும் தன்மை
  choice: முதன்மை உரையில் ‘ஒரே முறை’ என்று வைத்து, மீண்டும் செய்யத் தேவையில்லாத முடிவுறும் பொருளை அடிக்குறிப்பில் குறிப்பிடுதல்.
  alternative: ‘ஒரே முறையாக, என்றென்றைக்குமாக’
  rationale: இச்சூழலில் முடிவுறும் தன்மை வலுவாக இருக்கலாம்; ஆனால் ἅπαξ என்ற ஒரே சொல் தரும் ‘ஒரு முறை’ என்ற காலப் பொருளை விட அதிகமான விளக்கத்தை முதன்மை உரையில் கட்டாயமாகச் சேர்க்காமல் இருப்பது மூலத்தின் நுட்பத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. நீண்ட கிரேக்க வாக்கியத்தின் காரணத் தொடர்பு தமிழில் தெளிவாக இருக்கும்படி சொல் வரிசை மாற்றப்பட்டுள்ளது. ‘பலிகள்’ என்பது முந்தைய வசனத்திலிருந்து புரிந்துகொள்ளப்படும் பொருளை வெளிப்படையாகக் கூறுகிறது; புதிய கருத்தைச் சேர்ப்பதல்ல.
