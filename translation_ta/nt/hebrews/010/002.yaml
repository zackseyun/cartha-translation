revisions:
- from: அப்படியிருந்தால், வழிபடுகிறவர்கள் ஒரே முறை[b] தூய்மையாக்கப்பட்டபின், பாவங்களைப் பற்றிய உணர்வு[a] இனி அவர்களுக்கு இல்லாதிருக்கும் என்பதால், அந்தப் பலிகள் செலுத்தப்படுவது நின்றிருக்குமல்லவா?
  to: அப்படியானால், வழிபடுகிறவர்கள் ஒரே முறை[b] தூய்மையாக்கப்பட்டபின், பாவங்களைப் பற்றிய எந்த உணர்வும்[a] இனி அவர்களுக்கு இருக்காது என்பதால், அந்தப் பலிகள் செலுத்தப்படுவதை நிறுத்தியிருக்கும் அல்லவா?
  rationale: The revision retains the draft’s source-sensitive renderings and footnote anchors, while improving the Tamil syntax of the rhetorical question and explicitly rendering the negative indefinite μηδεμίαν as ‘எந்த ... உம்.’ No theological interpretation has been added to the main text.
