translation:
  language: ta
  text: முழுவதுமாக எரிக்கப்படும் பலிகளிலும் பாவத்திற்கான பலிகளிலும் நீர் மகிழ்ச்சி கொள்ளவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தகனபலிகளிலும் பாவப்பலிகளிலும்.” கிரேக்கத்தில் நேரடியாக ‘பாவத்திற்காக’ என்று பொருள்படும் சொற்றொடர், பலியிடும் சூழலில் பாவத்திற்காகச் செலுத்தப்படும் பலியைக் குறிக்கும் மரபுத்தொடராகும்.
