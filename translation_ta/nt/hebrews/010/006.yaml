lexical_decisions:
- source_word: ὁλοκαυτώματα
  choice: முழுவதும் எரிக்கப்படும் பலிகள்
  rationale: பலிப்பொருள் முழுவதுமாக நெருப்பில் எரிக்கப்படும் பலிவகையைத் தெளிவாகக் குறிக்கிறது; பொதுவான ‘தகனபலிகள்’ என்பதைவிட அதன் தன்மையை இன்றைய வாசகருக்கு வெளிப்படையாகச் சொல்கிறது.
- source_word: καὶ
  choice: -உம் … -உம்
  rationale: இரு பலிவகைகளையும் இணைக்கும் எளிய இணைப்பை இயல்பான தமிழ் இணை அமைப்பில் தருகிறது.
- source_word: περὶ ἁμαρτίας
  choice: பாவநிவாரணப் பலிகள்
  rationale: பலியிடும் சூழலில் இது பாவத்திற்காகச் செலுத்தப்படும் ஒரு குறிப்பிட்ட பலிவகையைக் குறிக்கும் மரபுத்தொடர்; வெறும் ‘பாவத்தைக் குறித்து’ என்று மொழிபெயர்ப்பது இச்சூழலில் இயல்பற்றது.
- source_word: οὐκ εὐδόκησας
  choice: நீர் மகிழ்ச்சியடையவில்லை
  rationale: தேவனை நோக்கிய இரண்டாம் நபர் ஒருமை வினையை மரியாதை ஒருமையில் தருகிறது; εὐδοκέω என்பதன் விருப்பம் அல்லது அங்கீகாரம் சார்ந்த மதிப்பீட்டுப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சங்கீதம் 40:6-ன் கிரேக்க வடிவிலிருந்து மேற்கோள் காட்டப்படும் பலியியல் சொற்களின் துல்லியம்
  choice: ‘முழுவதும் எரிக்கப்படும் பலிகள்’ என்றும் ‘பாவநிவாரணப் பலிகள்’ என்றும் குறிப்பிட்ட பலிவகைகளைத் தக்கவைத்தல்
  alternative: ‘தகனபலிகளும் பாவத்திற்கான பலிகளும்’ அல்லது பொதுவாக ‘பலிகள்’
  rationale: எபிரெயர் நிருபத்தின் வாதம் குறிப்பிட்ட பலிவகைகளைச் சார்ந்திருப்பதால், அவற்றைப் பொதுமைப்படுத்தாமல் வைத்திருப்பது உரையின் இறையியல் அழுத்தத்தையும் பதற்றத்தையும் விளக்கவுரை சேர்க்காமல் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை. தேவனை நோக்கிய உரைக்கு ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது. குறிப்பிட்ட பலியியல் வகைகள் பொதுவான ‘பலிகள்’ என்று மங்கச் செய்யப்படவில்லை.
