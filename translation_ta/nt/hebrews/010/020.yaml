  text: அதை அவர் நமக்காகத் திரைச்சீலையின் வழியாக[a]—அதாவது, தமது மாம்சத்தின் வழியாக[b]—புதியதும் உயிருள்ளதுமான வழியாகத் தொடங்கிவைத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘திரைச்சீலை’ என்பதை ‘திரை’ என்றும் மொழிபெயர்க்கலாம்; இது பரிசுத்த இடத்தை மகா பரிசுத்த இடத்திலிருந்து பிரித்த திரையைக் குறிக்கிறது.
