lexical_decisions:
- source_word: ἣν
  choice: அதை
  rationale: பெண்பால் சார்புப்பெயர் முந்தைய வசனத்திலுள்ள கருத்தைச் சுட்டுகிறது. அதன் முன்னிலையைத் தெளிவுபடுத்தாமல், மூலத்தின் தொடர்பையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: ἐνεκαίνισεν
  choice: தொடங்கிவைத்தார்
  rationale: புதிதாகப் பயன்பாட்டுக்கு அர்ப்பணித்து ஆரம்பித்தல் என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது; வெறுமனே ‘திறந்தார்’ என்பதைக் காட்டிலும் மூல வினையின் தொடக்குவிப்பு நுணுக்கத்தைக் காக்கிறது.
- source_word: ἡμῖν
  choice: நமக்காக
  rationale: நன்மை அல்லது பயனைச் சுட்டும் வேற்றுமைப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ὁδὸν πρόσφατον καὶ ζῶσαν
  choice: புதியதும் உயிருள்ளதுமான ஒரு வழியாக
  rationale: ‘புதிய’ என்பது புதிதாக ஏற்படுத்தப்பட்டதையும், ‘உயிருள்ள’ என்பது ζῶσαν என்பதன் உருவகத் திறந்த நிலையையும் காக்கிறது; ‘உயிரளிக்கும்’ என்று விளக்கி விடவில்லை.
- source_word: διὰ τοῦ καταπετάσματος
  choice: திரைச்சீலையின் வழியாக
  rationale: கூடாரம் அல்லது ஆலயத்தின் உட்பிரிப்புத் திரையைக் குறிக்கும் சொல்லை சாதாரண வாசகருக்குப் புரியும் வகையில் தருகிறது.
- source_word: τοῦτ’ ἔστιν
  choice: அதாவது
  rationale: முன்னுள்ள உருவகத்துக்கு விளக்கம் தரும் வழக்கமான தமிழ்ச் சொற்றொடர்.
- source_word: τῆς σαρκὸς αὐτοῦ
  choice: தமது மாம்சத்தின் வழியாக
  rationale: σάρξ என்பதற்கு இங்கு உடல்சார்ந்த நேர்பொருளான ‘மாம்சம்’ பயன்படுத்தப்படுகிறது. முன் வந்த διά-வின் ‘வழியாக’ என்ற தொடர்பை தமிழில் வெளிப்படையாக மீட்டுரைத்து பொருள் தெளிவாக்கப்படுகிறது.
theological_decisions:
- issue: திரைச்சீலையும் கிறிஸ்துவின் மாம்சமும் இடையிலான உருவகத் தொடர்பு
  choice: ‘திரைச்சீலையின் வழியாக—அதாவது, தமது மாம்சத்தின் வழியாக’ என்று மொழிபெயர்த்தல்
  alternative: ‘திரைச்சீலை, அதாவது அவரது மாம்சம்’
  rationale: மூலத்தின் விளக்க இணைப்பையும் அணுகும் வழி என்ற கருத்தையும் காக்கிறது. திரைச்சீலையும் மாம்சமும் எந்தத் துல்லியமான விதத்தில் தொடர்புபடுத்தப்படுகின்றன என்பதை உரைக்கு அப்பால் முடிவுசெய்யவில்லை.
- issue: σάρξ என்பதன் மொழிபெயர்ப்பு
  choice: மாம்சம்
  alternative: உடல்
  rationale: இங்கு இயேசுவின் உண்மையான மனித உடல்சார்ந்த இருப்பைக் குறிக்கும் நேர்பொருள் உள்ளது. ‘மாம்சம்’ மூலச்சொல்லை வெளிப்படையாகக் காக்கிறது; ‘பாவ இயல்பு’ போன்ற விளக்கத்தைச் சேர்க்கவில்லை.
- issue: ζῶσαν என்பதன் உருவக வலிமை
  choice: உயிருள்ள
  alternative: உயிரளிக்கும்
  rationale: ‘உயிரளிக்கும்’ என்பது சாத்தியமான விளக்கம் என்றாலும், மூலத்தில் உள்ள ‘வாழும்/உயிருள்ள’ என்ற தெளிவான சொல் வடிவத்தை மாற்றாமல் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகருக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. நீளமான கிரேக்க வாக்கியத் தொடரை தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாக அமைத்தாலும், அதன் சார்பும் உருவகத் தொடர்பும் காக்கப்பட்டுள்ளன. ‘தமது’ என்பது எழுவாயான ‘அவர்’ என்பவரையே சுட்டுகிறது.
