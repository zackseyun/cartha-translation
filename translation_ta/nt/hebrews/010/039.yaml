source:
  edition: SBLGNT
  text: ἡμεῖς δὲ οὐκ ἐσμὲν ὑποστολῆς εἰς ἀπώλειαν, ἀλλὰ πίστεως εἰς περιποίησιν ψυχῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/039.yaml
  text: But we are not of shrinking back to destruction[d][c][b][a], but of faith to the preservation of the soul.
translation:
  language: ta
  text: ஆனால் நாம் அழிவுக்கு வழிவகுக்கும் பின்வாங்குதலுக்கு உரியவர்கள் அல்ல; மாறாக, உயிரைக் காப்பதற்கான விசுவாசத்திற்கு உரியவர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡμεῖς
  choice: நாம்
  rationale: முந்தைய எச்சரிக்கையுடன் உள்ள வலியுறுத்தப்பட்ட முரண்பாட்டைக் காட்ட, மூலத்தில் வெளிப்படையாக உள்ள முதலாம் நபர் பன்மைப் பெயர்ச்சொல் தக்கவைக்கப்பட்டது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய கூற்றுடன் உள்ள தெளிவான முரண்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὐκ ἐσμὲν … ἀλλὰ
  choice: சேர்ந்தவர்கள் அல்ல; மாறாக, … சேர்ந்தவர்கள்
  rationale: இரு மரபுப்பெயர்களின் உடைமை வேற்றுமை வடிவங்கள் குறிக்கும் வகை அல்லது சார்பைத் தமிழில் தெளிவாகவும் இயல்பாகவும் எடுத்துரைக்கிறது.
- source_word: ὑποστολῆς
  choice: பின்வாங்குதல்
  rationale: அஞ்சிப் பின்னடைதல், விலகிச் செல்லுதல் ஆகிய பொருள்களைத் தருகிறது; இதை நேரடியாக முழுமையான விசுவாசத் துறப்பு என்று மிகையாகத் தீர்மானிக்கவில்லை.
- source_word: εἰς ἀπώλειαν
  choice: அழிவுக்கு இட்டுச் செல்லும்
  rationale: εἰς குறிக்கும் முடிவு அல்லது விளைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πίστεως
  choice: விசுவாசம்
  rationale: இங்கு பின்வாங்குதலுக்கு எதிராக நிற்கும் நம்பும் நிலைப்பாட்டைக் குறிக்கிறது; நிலைத்த உண்மைப்பற்று என்ற சாத்தியமான நுட்பம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: εἰς περιποίησιν
  choice: காக்கப்படுவதற்கு இட்டுச் செல்லும்
  rationale: அழிவுடனான நேரடி முரண்பாட்டினால் பாதுகாப்பு அல்லது காப்பு என்ற பொருள் முதன்மைப்படுத்தப்படுகிறது; அதேவேளை அடைதல் அல்லது பெற்றுக்கொள்ளுதல் என்ற சொற்பொருள் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ψυχῆς
  choice: உயிர்
  rationale: இச்சூழலில் ψυχή ஒருவரின் உயிர் அல்லது முழு சுயத்தைக் குறிக்கலாம். நவீன வாசகர் இதை உடலிலிருந்து பிரிந்த ‘ஆத்துமா’ என மட்டும் குறுக்கிவிடாதபடி ‘உயிர்’ தேர்ந்தெடுக்கப்பட்டது; மரபான மாற்று அடிக்குறிப்பில் உள்ளது.
theological_decisions:
- issue: πίστις என்பதன் பொருள்
  choice: விசுவாசம்
  alternative: உண்மைப்பற்று அல்லது விசுவாசத்தில் நிலைத்திருத்தல்
  rationale: முதன்மைப் பொருளான விசுவாசத்தை உரையில் வைத்துக்கொண்டு, அறிவார்ந்த ஒப்புதல் மட்டுமல்லாமல் நிலைத்த பற்றுறுதியும் இதில் அடங்கக்கூடும் என்ற நுட்பத்தை அடிக்குறிப்பில் காக்கிறது.
- issue: περιποίησις ψυχῆς என்பதன் பொருள்
  choice: உயிர் காக்கப்படுதல்
  alternative: உயிரை அடைதல் அல்லது தக்கவைத்துக்கொள்ளுதல்; ஆத்துமாவைக் காத்துக்கொள்ளுதல்
  rationale: ‘அழிவு’ என்பதற்கு எதிரான அமைப்பு காப்பு என்ற பொருளை ஆதரிக்கிறது. இருப்பினும் περιποίησις என்பதன் அடைதல் அல்லது உடைமையாக்குதல் சார்ந்த பொருளையும் ψυχή என்பதன் உயிர், சுயம், ஆத்துமா என்ற பரப்பையும் அடிக்குறிப்புகள் திறந்துவைக்கின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வேதவாக்கியத்துக்குரிய செறிவும் உள்ள நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் சுருக்கமான இரட்டை வகை அமைப்பை ‘சேர்ந்தவர்கள்’ என்ற மறுமொழியால் காத்து, தமிழில் தெளிவுக்காக εἰς என்பதன் விளைவு சார்ந்த தொடர்பு ‘இட்டுச் செல்லும்’ என வெளிப்படுத்தப்பட்டது.
