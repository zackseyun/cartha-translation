  text: ⸀καὶ τῶν ἁμαρτιῶν αὐτῶν καὶ τῶν ἀνομιῶν αὐτῶν οὐ μὴ ⸀μνησθήσομαι ἔτι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/017.yaml
  text: and I will no longer remember their sins and their lawless deeds[a][b].
translation:
  language: ta
  text: அவர்களுடைய பாவங்களையும் அவர்களுடைய நெறிமீறிய செயல்களையும் இனி ஒருபோதும் நினைவுகூர மாட்டேன்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சார்பாக: “அவர்களுடைய பாவங்களையும் அவர்களுடைய நெறிமீறிய செயல்களையும் இனி நிச்சயமாக நினைவுகூர மாட்டேன்.”'
    reason: lexical_alternative
  - marker: b
    text: “நெறிமீறிய செயல்கள்” என்பதற்கான கிரேக்கச் சொல் ἀνομίαι; இதை “சட்டமீறிய செயல்கள்” என்றும், மரபாக “அக்கிரமங்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: -ஐயும் / மற்றும் என்ற இணைப்புப் பொருளைத் தரும் ‘-உம்’
  rationale: இது முந்தைய வசனத்தில் தொடங்கிய மேற்கோளின் தொடர்ச்சி. தமிழில் வாக்கியத் தொடக்கத்தில் தனியாக ‘மேலும்’ சேர்ப்பதைவிட, இரண்டு பெயர்த்தொடர்களிலும் ‘-உம்’ பயன்படுத்துவது இயல்பாக இணைப்பை வெளிப்படுத்துகிறது.
- source_word: τῶν ἁμαρτιῶν αὐτῶν
  choice: அவர்களுடைய பாவங்களை
  rationale: ἁμαρτία என்பதன் நேரடியான, வழக்கமான பொருள் ‘பாவம்’; பன்மை மற்றும் αὐτῶν ஆகியவை ‘அவர்களுடைய பாவங்கள்’ எனத் தரப்பட்டுள்ளன.
- source_word: καὶ τῶν ἀνομιῶν αὐτῶν
  choice: அவர்களுடைய நெறிமீறிய செயல்களை
  rationale: ἀνομία என்பது சட்டம் அல்லது நெறியை மீறுதலைக் குறிக்கிறது. பன்மையில் குறிப்பிட்ட செயல்களைக் குறிக்கும் தன்மையை, நவீன வாசகருக்குத் தெளிவான ‘நெறிமீறிய செயல்கள்’ வெளிப்படுத்துகிறது.
- source_word: οὐ μὴ μνησθήσομαι
  choice: ஒருபோதும் நினைவுகூர மாட்டேன்
  rationale: οὐ μή உடன் வரும் எதிர்கால வினை வலியுறுத்தப்பட்ட மறுப்பைக் காட்டுகிறது. ‘ஒருபோதும் ... மாட்டேன்’ அந்த உறுதியை இயல்பான தமிழில் வெளிப்படுத்துகிறது; μιμνῄσκομαι-இன் நினைவுகூருதல் என்ற வேதாகமச் சொல்லாட்சியும் பாதுகாக்கப்படுகிறது.
- source_word: ἔτι
  choice: இனி
  rationale: ἔτι இங்கு மறுப்புடன் சேர்ந்து ‘இனிமேல் / இனி இல்லை’ என்ற காலப்பொருளைத் தருகிறது. ‘இனி ஒருபோதும்’ என்பது மறுப்பின் வலிமையையும் தொடராமையையும் ஒன்றாகக் காட்டுகிறது.
theological_decisions:
- issue: தேவன் பாவங்களை நினைவுகூராதிருத்தல்
  choice: ‘இனி ஒருபோதும் நினைவுகூர மாட்டேன்’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘இனி அவற்றை அவர்களுக்கு எதிராகக் கணக்கிட மாட்டேன்’ என்று விளக்கிப் பொருளுரைத்தல்
  rationale: மூலத்தின் ‘நினைவுகூருதல்’ என்ற உடன்படிக்கைச் சொல்லாட்சி பாதுகாக்கப்படுகிறது. இது தேவனுடைய அறிவைப் பற்றிய தத்துவ விளக்கத்தைத் திணிக்காமலும், பாவங்களை நினைவுகூர மாட்டார் என்ற வசனத்தின் இறையியல் அழுத்தத்தையும் பதற்றத்தையும் அப்படியே வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், சாதாரண வாசகருக்குப் புரியக்கூடிய அதே நேரத்தில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அக்கிரமங்கள்’ என்ற மரபுச் சொல் முதன்மை உரையில் தவிர்க்கப்பட்டு, தெளிவான ‘நெறிமீறிய செயல்கள்’ தேர்ந்தெடுக்கப்பட்டது. வலியுறுத்தப்பட்ட மறுப்பு ‘இனி ஒருபோதும் ... மாட்டேன்’ என இயல்பாகத் தரப்பட்டுள்ளது.
