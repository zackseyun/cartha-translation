  source_fidelity: மூல கிரேக்கத்தின் இரண்டு இணைக்கப்பட்ட பொருட்களும்—“அவர்களுடைய பாவங்கள்” மற்றும் “அவர்களுடைய ἀνομίαι”—தெளிவாகத் தரப்பட்டுள்ளன. οὐ μὴ ... ἔτι என்பதன் வலியுறுத்தப்பட்ட, இனிமேல் தொடராத மறுப்பு “இனி ஒருபோதும் ... மாட்டேன்” எனப் பொருத்தமாக வெளிப்படுகிறது. “நினைவுகூர” என்பது μνησθήσομαι-இன் உடன்படிக்கைச் சொல்லாட்சியைப் பாதுகாக்கிறது.
  naturalness: உரை நவீனத் தரத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது. மேற்கோளின் தொடர்ச்சியான இவ்வசனத்தில் முதல் நபர் எழுவாய் வினைமுற்றிலேயே தெளிவாக இருப்பதால், தனியாக “நான்” சேர்க்க வேண்டியதில்லை. இரு பெயர்த்தொடர்களிலும் “-யும்” பயன்படுவது καὶ-யின் இணைப்பை இயல்பாகக் காட்டுகிறது.
