id: HEB.10.23
reference: Hebrews 10:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: κατέχωμεν τὴν ὁμολογίαν τῆς ἐλπίδος ἀκλινῆ, πιστὸς γὰρ ὁ ἐπαγγειλάμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/023.yaml
  text: Let us hold fast the confession of our hope without wavering[a], for the one who promised is faithful.
translation:
  language: ta
  text: நமது[a] நம்பிக்கை அறிக்கையைத் தளராமல் உறுதியாகப் பற்றிக்கொள்வோமாக; ஏனெனில், வாக்குறுதி அளித்தவர் உண்மையுள்ளவர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம்பிக்கையின் அறிக்கை.” கிரேக்க மூலத்தில் “நமது” என்பது வெளிப்படையாக இல்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέχωμεν
  choice: உறுதியாகப் பற்றிக்கொள்வோமாக
  rationale: முதல் நபர் பன்மை நிகழ்காலத் துணைவினையின் ஊக்குவிக்கும் வலிமையை ‘பற்றிக்கொள்வோமாக’ இயல்பாக வெளிப்படுத்துகிறது; ‘உறுதியாக’ என்பது விடாமல் நிலைத்திருக்கும் கருத்தைத் தெளிவாக்குகிறது.
- source_word: ὁμολογίαν
  choice: அறிக்கை
  rationale: இங்கு இது உள்ளார்ந்த நம்பிக்கையை மட்டும் அல்லாமல், வெளிப்படையாக ஏற்றுக்கொண்டு அறிவிக்கும் நிலைப்பாட்டைக் குறிக்கிறது. ‘அறிக்கை’ என்பது நவீனத் தமிழில் தெளிவாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: τῆς ἐλπίδος
  choice: நமது நம்பிக்கை
  rationale: கிரேக்கத்தில் உடைமைப் பெயர் வெளிப்படையாக இல்லை; ஆயினும் சமூகத்தினரிடம் கூறப்படும் ஊக்குவிப்பை இயல்பான தமிழில் தெரிவிக்க ‘நமது’ சேர்க்கப்பட்டுள்ளது. இதற்கான நேரடியான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἀκλινῆ
  choice: தளராமல்
  rationale: ‘சாயாத, அசையாத’ என்ற கருத்தை, இந்த ஊக்குவிப்பின் சூழலில் இயல்பான தமிழில் ‘தளராமல்’ வெளிப்படுத்துகிறது.
- source_word: πιστὸς
  choice: உண்மையுள்ளவர்
  rationale: வாக்குறுதியை நிறைவேற்றுவதில் நிலைத்தும் நம்பத்தகுந்தவருமாக இருப்பதை இது தெரிவிக்கிறது; வேதாகமத் தமிழின் இறையியல் ஒலியையும் காக்கிறது.
- source_word: ὁ ἐπαγγειλάμενος
  choice: வாக்குறுதி அளித்தவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் இறந்தகாலப் பங்கேற்புச் சொல்லை இயல்பாக மொழிபெயர்க்கிறது; அது யாரைக் குறிக்கிறது என்பதை மூலத்தைப் போலவே வெளிப்படையாகச் சேர்க்கவில்லை.
theological_decisions:
- issue: ‘வாக்குறுதி அளித்தவர்’ என்பவரின் மறைமுக அடையாளம்
  choice: மூலத்தைப் போலவே ‘வாக்குறுதி அளித்தவர்’ என்று வைத்து, தேவன் என்ற பெயரை வெளிப்படையாகச் சேர்க்கவில்லை.
  alternative: ‘வாக்குறுதி அளித்த தேவன்’
  rationale: சூழல் தேவனைக் குறித்தாலும், கிரேக்க உரை அவருடைய பெயரை இங்கு வெளிப்படையாகக் கூறவில்லை. அந்த மறைமுகத்தன்மை பாதுகாக்கப்படுகிறது.
- issue: ‘நம்பிக்கை’ என்பதோடு ‘நமது’ என்பதைச் சேர்த்தல்
  choice: இயல்பான சமூக ஊக்குவிப்பாக ‘நமது நம்பிக்கை அறிக்கை’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘நம்பிக்கையின் அறிக்கை’
  rationale: ‘நமது’ என்பது கிரேக்கத்தில் வெளிப்படையாக இல்லாததால் மாற்று அடிக்குறிப்பில் தரப்படுகிறது; முதன்மை உரையில் இது புதிய கோட்பாட்டைச் சேர்க்காமல், பன்மை ஊக்குவிப்பின் சூழலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான ஊக்குவிப்பு நடையைப் பயன்படுத்துகிறது. ‘பற்றிக்கொள்வோமாக’ என்பது கூட்டாக விடுக்கப்படும் அழைப்பைத் தெளிவாகக் காக்கிறது.
