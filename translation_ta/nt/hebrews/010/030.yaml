source:
  edition: SBLGNT
  text: οἴδαμεν γὰρ τὸν εἰπόντα· Ἐμοὶ ἐκδίκησις, ἐγὼ ⸀ἀνταποδώσω· καὶ πάλιν· ⸂Κρινεῖ κύριος⸃ τὸν λαὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/030.yaml
  text: For we know the one who said[a], “Vengeance is mine; I will repay,” and again[b], “The Lord will judge his people.”
translation:
  language: ta
  text: ஏனெனில், “பழிவாங்குதல் எனக்குரியது; நான் திருப்பிச் செலுத்துவேன்” என்றும்[a], மீண்டும், “ஆண்டவர் தமது மக்களை நியாயந்தீர்ப்பார்” என்றும்[b] சொன்னவரை நாம் அறிவோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த இரண்டு மேற்கோள்களும் உபாகமம் 32:35–36-ஐ எதிரொலிக்கின்றன.
    reason: cross_reference
  - marker: b
    text: “நியாயந்தீர்ப்பார்” என்பதற்கான கிரேக்கச் சொல் தண்டனைத் தீர்ப்பையும், சில சூழல்களில் விடுவிக்கும் அல்லது நியாயம் நிலைநாட்டும் தீர்ப்பையும் குறிக்கலாம். இங்கு எச்சரிக்கைச் சூழல் கடவுளின் நீதித்தீர்ப்பை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: நாம் அறிவோம்
  rationale: οἶδα இறந்தநிறை வடிவில் இருந்தாலும், கொய்னே கிரேக்கத்தில் நிகழ்காலப் பொருளைத் தருகிறது; தமிழில் இயல்பான நிகழ்காலமாக வழங்கப்பட்டது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்துடன் உள்ள விளக்கத் தொடர்பைத் தெளிவாகக் காக்கிறது.
- source_word: τὸν εἰπόντα
  choice: சொன்னவரை
  rationale: மேற்கோளைச் சொன்ன கடவுளைக் குறிக்கும் பெயர்ச்சொல் தன்மையுள்ள இறந்தகால வினையெச்சத்தை இயல்பான தமிழில் தருகிறது.
- source_word: Ἐμοὶ ἐκδίκησις
  choice: பழிவாங்குவது எனக்குரியது
  rationale: ‘எனக்கு பழிவாங்குதல்’ என்ற நீள்வட்ட கிரேக்க அமைப்பின் உரிமைப் பொருளைத் தெளிவாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
- source_word: ἀνταποδώσω
  choice: நானே பதிலளிப்பேன்
  rationale: செயலுக்கேற்ற கைம்மாறு அல்லது தண்டனை திருப்பிச் செய்வதை உணர்த்துகிறது; வலியுறுத்தும் ἐγώ-வையும் ‘நானே’ காக்கிறது.
- source_word: καὶ πάλιν
  choice: மேலும்
  rationale: இரண்டாவது வேதமேற்கோளை அறிமுகப்படுத்தும் தொடர்ச்சியை இயல்பான தமிழில் காட்டுகிறது; தமிழில் தேவைப்படும் ‘என்றும் சொல்லப்பட்டுள்ளது’ பொருளை வெளிப்படுத்தச் சேர்க்கப்பட்டது.
- source_word: Κρινεῖ
  choice: நீதி வழங்குவார்
  rationale: κρίνω என்பதன் தீர்ப்பிடுதல், தண்டித்தல், நியாயப்படுத்துதல் ஆகிய பரப்பைத் தமிழில் ஓரளவு திறந்துவைக்கிறது; ஆனால் எச்சரிக்கைச் சூழலில் தெய்வீக நீதித்தீர்ப்பின் தீவிரத்தையும் காக்கிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான வழக்கமான, கண்ணியமான தமிழ் வேதாகமச் சொல்.
- source_word: τὸν λαὸν αὐτοῦ
  choice: தமது மக்களுக்கு
  rationale: தன்னிலைச் சொந்தச் சுட்டை ‘தமது’ காக்கிறது. ‘நீதி வழங்கு’ தமிழில் நான்காம் வேற்றுமையுடன் இயல்பாக வருவதால் ‘மக்களுக்கு’ என வழங்கப்பட்டது.
theological_decisions:
- issue: உபாகம மேற்கோளிலுள்ள κρίνω என்ற நீதித்துறைச் சொல்லின் பொருள்
  choice: ஆண்டவர் தமது மக்களுக்கு நீதி வழங்குவார்
  alternative: ஆண்டவர் தமது மக்களை நியாயந்தீர்ப்பார்
  rationale: உபாகமம் 32:36-ன் மூலச் சூழலில் இச்சொல் தண்டனைத் தீர்ப்பையும் தமது மக்களுக்கு ஆதரவான நியாயவழங்குதலையும் உள்ளடக்கக்கூடும். எபிரெயர் 10-ன் எச்சரிக்கைச் சூழல் தீர்ப்பை வலியுறுத்தினாலும், ‘நீதி வழங்குவார்’ என்பது மூலத்தின் உண்மையான இருபக்கச் சாத்தியத்தை முற்றிலும் மூடாமல் காக்கிறது; அடிக்குறிப்பு சூழலின் வலியுறுத்தலை விளக்குகிறது.
translation_notes:
  register: நவீன தரத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. மேற்கோள்களின் செறிவும் எச்சரிக்கைத் தொனியும் காக்கப்பட்டுள்ளன; κρίνω-வின் பொருள் பரப்பு அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
