revisions:
- from: ஏனெனில், “பழிவாங்குவது எனக்குரியது; நானே பதிலளிப்பேன்” என்று சொன்னவரை நாம் அறிவோம். மேலும்[a], “ஆண்டவர் தமது மக்களுக்கு நீதி வழங்குவார்[b]” என்றும் சொல்லப்பட்டுள்ளது.
  to: ஏனெனில், “பழிவாங்குதல் எனக்குரியது; நான் திருப்பிச் செலுத்துவேன்” என்றும்[a], மீண்டும், “ஆண்டவர் தமது மக்களை நியாயந்தீர்ப்பார்” என்றும்[b] சொன்னவரை நாம் அறிவோம்.
  rationale: The revision corrects the central lexical error in ἀνταποδώσω and restores the direct-object syntax and judicial force of Κρινεῖ τὸν λαὸν αὐτοῦ. It retains the citation’s concise, formal tone and preserves the possible wider semantic range of κρίνω in a properly anchored footnote, without allowing that range to displace the warning-context sense in the main text.
