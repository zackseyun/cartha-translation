  revision_rationale: 'The revision retains the Greek clause order and its deliberate tension: the one offering has an enduringly completed effect (‘என்றென்றைக்கும் நிறைவாக்கியிருக்கிறார்’) for people who are presently being sanctified (‘பரிசுத்தமாக்கப்படுகிறவர்களை’). It also uses ‘காணிக்கை’ to align more closely with προσφορά and the English audit trail’s ‘offering,’ without imposing a theological interpretation.'
