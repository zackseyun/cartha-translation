id: HEB.10.14
reference: Hebrews 10:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μιᾷ γὰρ προσφορᾷ τετελείωκεν εἰς τὸ διηνεκὲς τοὺς ἁγιαζομένους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/014.yaml
  text: For by one offering he has perfected for all time those who are being sanctified[a].
translation:
  language: ta
  text: ஏனெனில், ஒரே காணிக்கையினால் அவர் பரிசுத்தமாக்கப்படுகிறவர்களை[a] என்றென்றைக்கும் நிறைவாக்கியிருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘புனிதமாக்கப்படுகிறவர்களை.’
    reason: ‘பரிசுத்தமாக்கப்படுகிறவர்களை’ என்பது ἁγιαζομένους என்ற நிகழ்காலச் செயப்பாட்டு வினையெச்சத்தின் தொடரும் செயல்முறையை வெளிப்படுத்துகிறது; ‘புனிதமாக்கப்படுகிறவர்களை’ என்பது இயல்பான சொல் மாற்று.
lexical_decisions:
- source_word: μιᾷ
  choice: ஒரே
  rationale: προσφορᾷ என்பதுடன் இணைந்து, அந்தப் பலியின் தனித்தன்மையையும் ஒருமையையும் வலியுறுத்துகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தின் கூற்றுக்கான விளக்கக் காரணத்தை அறிமுகப்படுத்தும் இணைப்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: προσφορᾷ
  choice: பலியினால்
  rationale: அடிப்படைப் பொருள் ‘காணிக்கை/செலுத்துதல்’ என்றாலும், எபிரெயர் 10-ன் பலியிடும் சூழலில் ‘பலி’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது; கருவிப்பொருள் வேற்றுமையை ‘-இனால்’ வெளிப்படுத்துகிறது.
- source_word: τετελείωκεν
  choice: நிறைவுள்ளவர்களாக்கியிருக்கிறார்
  rationale: τελειόω என்பதின் ‘நிறைவு/முழுமைக்குக் கொண்டுவருதல்’ என்ற பொருளையும், நிறைவேறிய செயலின் தொடரும் விளைவைக் காட்டும் perfect காலத்தின் வலிமையையும் பாதுகாக்கிறது.
- source_word: εἰς τὸ διηνεκές
  choice: என்றென்றைக்கும்
  rationale: ஒரே பலியின் விளைவு இடையறாது நிலைத்திருப்பதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: τοὺς ἁγιαζομένους
  choice: பரிசுத்தமாக்கப்பட்டு வருகிறவர்களை
  rationale: நிகழ்காலச் செயப்பாட்டு வினையெச்சத்தின் தொடரும் செயல்முறையை ‘-ப்பட்டு வருகிற’ என்பதன் மூலம் பாதுகாக்கிறது.
theological_decisions:
- issue: முடிவுற்ற நிறைவாக்கத்துக்கும் தொடர்ந்து நடைபெறும் பரிசுத்தமாக்குதலுக்கும் உள்ள உறவு
  choice: ‘நிறைவுள்ளவர்களாக்கியிருக்கிறார்’ என்பதையும் ‘பரிசுத்தமாக்கப்பட்டு வருகிறவர்களை’ என்பதையும் அருகருகே வைத்து இரு பரிமாணங்களையும் தக்கவைத்தல்.
  alternative: இதை முற்றிலும் நிலைசார் பரிசுத்தம் எனவோ, முற்றிலும் படிப்படியான முன்னேற்றம் எனவோ ஒருதலைப்பட்சமாக விளக்குதல்.
  rationale: τετελείωκεν முடிவுற்று நிலைக்கும் விளைவைக் குறிக்க, ἁγιαζομένους தொடர்ந்து நடைபெறும் செயப்பாட்டு செயல்முறையைச் சுட்டுகிறது. கிரேக்க உரையின் இந்த இறையியல் இழுவிசையை மொழிபெயர்ப்பு தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் dignified வேதாகம நடையைப் பேணுகிறது. ‘பரிசுத்தமாக்குதல்’ திருச்சபைப் பயன்பாட்டில் பரிச்சயமான சொல்லாக இருப்பதால் முதன்மை உரையில் வைக்கப்பட்டு, ‘புனிதமாக்குதல்’ அடிக்குறிப்பில் மாற்றாக வழங்கப்பட்டுள்ளது.
