source:
  edition: SBLGNT
  text: καὶ γὰρ τοῖς ⸀δεσμίοις συνεπαθήσατε, καὶ τὴν ἁρπαγὴν τῶν ὑπαρχόντων ὑμῶν μετὰ χαρᾶς προσεδέξασθε, γινώσκοντες ἔχειν ⸀ἑαυτοὺς κρείττονα ⸀ὕπαρξιν καὶ μένουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/034.yaml
  text: For you also suffered together with the prisoners[a], and you accepted with joy the plundering of your possessions[b], knowing that you yourselves have a better and lasting possession.
translation:
  language: ta
  text: ஏனெனில், சிறையில் இருந்தவர்களோடு நீங்களும் துன்பத்தைப் பகிர்ந்துகொண்டீர்கள்[a]. உங்கள் உடைமைகள் கொள்ளையிடப்பட்டதையும் மகிழ்ச்சியுடன் ஏற்றுக்கொண்டீர்கள். உங்களுக்கே சிறந்ததும் நிலைத்திருப்பதுமான ஓர் உடைமை இருக்கிறது என்பதை அறிந்திருந்தீர்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சிறையில் இருந்தவர்கள்மீது பரிவு காட்டினீர்கள்.’ கிரேக்க வினைச்சொல் பரிவைக் குறிக்கலாம்; ஆனால் இங்கு அவர்களுடைய துன்பத்தில் பங்குகொண்டதையும் உள்ளடக்கியிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சில கையெழுத்துப் பிரதிகளில், ‘பரலோகத்தில் உங்களுக்கென்று சிறந்ததும் நிலைத்திருப்பதுமான ஓர் உடைமை இருக்கிறது என்பதை அறிந்திருந்தீர்கள்’ என்று வாசிக்கப்படுகிறது.
    reason: textual_variant
lexical_decisions:
- source_word: δεσμίοις
  choice: சிறையில் இருந்தவர்களோடு
  rationale: δέσμιος என்பது கட்டுண்டவர் அல்லது சிறைவைக்கப்பட்டவர் எனப் பொருள்படும். இங்கு உடன் துன்பப்படுதலைக் குறிக்கும் வினையுடன் இயல்பாக இணைவதற்காக இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: συνεπαθήσατε
  choice: நீங்களும் துன்பத்தைப் பகிர்ந்துகொண்டீர்கள்
  rationale: συμπαθέω இரக்கம் அல்லது பரிவு காட்டுதல் என்ற பொருளையும் தரலாம்; ஆனால் σύν- கூறும் இச்சூழலும் சிறைவைக்கப்பட்டவர்களின் துன்பத்தில் செயல்பூர்வமாகப் பங்குகொண்ட ஒற்றுமையை முன்னிறுத்துகின்றன.
- source_word: ἁρπαγήν
  choice: கொள்ளையிடப்பட்டதையும்
  rationale: ἁρπαγή வலுக்கட்டாயமாகவும் அநியாயமாகவும் பறித்துக்கொள்ளப்படுவதைச் சுட்டுகிறது. ‘பறிமுதல்’ என்பதைக் காட்டிலும் ‘கொள்ளையிடப்பட்டது’ அந்த வலிமையைப் பாதுகாக்கிறது.
- source_word: τῶν ὑπαρχόντων ὑμῶν
  choice: உங்கள் உடைமைகள்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் ὑπαρχόντων ஒருவருக்குச் சொந்தமான பொருட்கள் அல்லது சொத்துகளைக் குறிக்கிறது. ‘உடைமைகள்’ இயல்பானதும் அடுத்துவரும் ὕπαρξις உடனான சொல்லுறவையும் ஓரளவு காக்கிறதுமான தேர்வு.
- source_word: μετὰ χαρᾶς
  choice: மகிழ்ச்சியுடன்
  rationale: கிரேக்கச் சொற்றொடரின் முறையையும் வலியுறுத்தலையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: προσεδέξασθε
  choice: ஏற்றுக்கொண்டீர்கள்
  rationale: προσδέχομαι என்பது பெற்றுக்கொள்ளுதல், வரவேற்றல், ஏற்றுக்கொள்ளுதல் எனப் பொருள்படலாம். இங்கு அநீதியை அவர்கள் அங்கீகரித்தார்கள் என்று உணர்த்தாமல், இழப்பை மனமுவந்து தாங்கியதை ‘ஏற்றுக்கொண்டீர்கள்’ தெரிவிக்கிறது.
- source_word: γινώσκοντες
  choice: அறிந்திருந்தீர்கள்
  rationale: கிரேக்கப் பங்கேற்புவினையின் காலச்சூழலையும் காரண நுட்பத்தையும் தமிழில் இயல்பாகத் தருகிறது; காரணத்தைத் தேவையின்றி வெளிப்படையாகக் கூட்டவில்லை.
- source_word: ἑαυτοὺς ἔχειν
  choice: உங்களுக்கே ... இருக்கிறது
  rationale: பிரதிபெயரின் வலியுறுத்தலை ‘உங்களுக்கே’ காக்கிறது; ἔχειν என்பதன் உடைமையைக் கொண்டிருக்கும் பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: κρείττονα
  choice: சிறந்ததும்
  rationale: எபிரெயர் நூலில் மீண்டும் வரும் κρείττων என்ற ஒப்பீட்டுச் சொல்லுக்கு ‘சிறந்த’ என்பது தெளிவான, தொடர்ச்சியாகப் பயன்படுத்தத்தக்க மொழிபெயர்ப்பு. ஒப்பிடப்படும் பூமிக்குரிய உடைமைகள் சூழலிலிருந்து புரிகின்றன.
- source_word: ὕπαρξιν
  choice: ஓர் உடைமை
  rationale: ὕπαρξις சொத்து அல்லது உடைமையைக் குறிக்கலாம். இங்கு ஒருமை வடிவில், முந்தைய பொருட்சார்ந்த உடைமைகளுக்கு மாறான மேலான உடைமையைக் குறிக்கிறது; அதன் குறிப்பான இயல்பை உரை சொல்லாததால் ‘உடைமை’ எனப் பொதுவாகவே வைக்கப்பட்டது.
- source_word: μένουσαν
  choice: நிலைத்திருப்பதுமான
  rationale: μένω இங்கு அந்த உடைமையின் நிரந்தரத் தன்மையை வலியுறுத்துகிறது. ‘நிலைத்திருக்கும்’ என்பது தற்போதைய தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
theological_decisions:
- issue: சிறைவைக்கப்பட்டவர்களுடனான ஒற்றுமையின் பொருள்
  choice: அவர்கள்மீது பரிவு உணர்ந்தது மட்டுமல்லாமல், அவர்களுடைய துன்பத்தில் பங்குகொண்டதாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘சிறையில் இருந்தவர்கள்மீது பரிவு காட்டினீர்கள்’ என்று மொழிபெயர்க்கலாம்.
  rationale: συμπαθέω என்ற சொல்லின் பொருள் பரிவையும் உள்ளடக்கலாம். எனினும் அதன் σύν- கூறும் எபிரெயர் 10:32–34 இன் துன்புறுத்தல் சூழலும், நம்பிக்கையாளர்கள் சிறைவைக்கப்பட்டவர்களோடு அடையாளப்படுத்திக்கொண்டு அதன் விலையைச் சுமந்ததை முன்னிறுத்துகின்றன.
- issue: ‘சிறந்ததும் நிலைத்திருப்பதுமான உடைமை’ என்பதன் இயல்பு
  choice: அது பரலோகம், இரட்சிப்பு அல்லது வெகுமதி என்று முதன்மை உரையில் குறிப்பாக்கப்படாமல் பொதுவாகவே வைக்கப்பட்டது.
  alternative: ‘பரலோகத்தில் சிறந்ததும் நிலைத்திருப்பதுமான உடைமை’ அல்லது ‘சிறந்த சுதந்தரம்’ என்று மொழிபெயர்க்கலாம்.
  rationale: சில கையெழுத்துப் பிரதிகள் பரலோகத்தைக் குறிப்பாகச் சேர்க்கின்றன; விளக்கவுரைகளும் இறுதிக்கால வெகுமதியைப் புரிந்துகொள்வது உண்டு. ஆனால் இங்கு பின்பற்றப்படும் SBLGNT உரையில் ‘பரலோகத்தில்’ இல்லை; எனவே உரை தரும் திறந்த தன்மை காக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்கு எளிதில் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘துன்பத்தைப் பகிர்ந்துகொண்டீர்கள்’ என்பது வெறும் உள்ளார்ந்த இரக்கத்தைவிடச் செயல்பூர்வமான ஒற்றுமையை வெளிப்படுத்துகிறது. இரண்டாம் பாதியில் மூல உரையின் குறிப்பாக்கப்படாத ‘உடைமை’ அப்படியே காக்கப்பட்டது; பரலோகக் குறிப்பு அடிக்குறிப்பில் உரைவேறுபாடாகத் தரப்பட்டது.
