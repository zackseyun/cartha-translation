source:
  edition: SBLGNT
  text: Αὕτη ἡ διαθήκη ἣν διαθήσομαι πρὸς αὐτοὺς μετὰ τὰς ἡμέρας ἐκείνας, λέγει κύριος, διδοὺς νόμους μου ἐπὶ καρδίας αὐτῶν, καὶ ἐπὶ ⸂τὴν διάνοιαν⸃ αὐτῶν ἐπιγράψω αὐτούς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/016.yaml
  text: 'This is the covenant that I will make with them after those days[a], says the Lord: putting my laws upon their hearts, and I will write them on their minds,'
translation:
  language: ta
  text: '“அந்த நாட்களுக்குப் பிறகு நான் அவர்களோடு செய்யும் உடன்படிக்கை இதுவே” என்று ஆண்டவர் கூறுகிறார்: “என் சட்டங்களை அவர்களுடைய இதயங்களின் மேல் வைத்து, அவற்றை அவர்களுடைய மனத்தின் மேல் எழுதுவேன்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαθήκη
  choice: உடன்படிக்கை
  rationale: எரேமியா மேற்கோளின் உடன்படிக்கை சார்ந்த பொருளையும் எபிரெயர் நூலின் இறையியல் தொடர்பையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: διαθήσομαι
  choice: செய்யும்
  rationale: உடன்படிக்கையை ஏற்படுத்துதல் என்ற பொருளைத் தமிழில் இயல்பான ‘உடன்படிக்கை செய்யும்’ என்ற தொடரால் தெரிவிக்கிறது.
- source_word: πρὸς αὐτούς
  choice: அவர்களோடு
  rationale: உடன்படிக்கை செய்யப்படும் இருதரப்புத் தொடர்பை இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: μετὰ τὰς ἡμέρας ἐκείνας
  choice: அந்த நாட்களுக்குப் பிறகு
  rationale: மூலத்தின் காலக் குறிப்பை விரிவாக்கமின்றி நேரடியாகப் பாதுகாக்கிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான மரியாதைமிக்க, வழக்கமான தமிழ் இணைச்சொல்; கிரேக்க உரையில் உள்ள வடிவத்தையே பின்பற்றுகிறது.
- source_word: διδοὺς
  choice: வைத்து
  rationale: சட்டங்களை இதயங்களின்மேல் வைக்கும் உருவகத்தைப் பாதுகாக்கிறது; வினையெச்ச வடிவம் கிரேக்கப் பங்கேற்பு வினையின் தொடர்ச்சியையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: νόμους
  choice: சட்டங்களை
  rationale: கிரேக்கப் பன்மையைப் பாதுகாப்பதோடு νόμος என்பதன் சட்டம் சார்ந்த நேரடி பொருளையும் தருகிறது.
- source_word: ἐπὶ καρδίας αὐτῶν
  choice: அவர்களுடைய இதயங்களின்மேல்
  rationale: ἐπί தரும் ‘மேல்’ உருவகத்தைத் தளர்த்தாமல், καρδία என்பதையும் நேரடியாகக் காட்டுகிறது.
- source_word: διάνοιαν
  choice: மனங்கள்
  rationale: சிந்தனை மற்றும் புரிதலின் ஆற்றலைக் குறிக்கும் διάνοια என்பதற்கு இயல்பான தமிழ் இணை; αὐτῶν என்ற பன்மை உடைமையாளருக்கு ஏற்ப தமிழில் பன்மையாக அமைக்கப்பட்டுள்ளது.
- source_word: ἐπιγράψω
  choice: எழுதுவேன்
  rationale: எழுதுதல் அல்லது பொறித்தல் என்ற பொருளை தெளிவாகக் காட்டுகிறது; ‘மேல்’ என்ற இடவுறவு ஏற்கெனவே தொடரில் உள்ளது.
- source_word: αὐτούς
  choice: அவற்றை
  rationale: முன்னர் கூறப்பட்ட ‘சட்டங்களை’ தெளிவாகச் சுட்டுகிறது; தமிழில் உயிரற்ற பன்மைக்குரிய இயல்பான சுட்டுப்பெயர்.
theological_decisions:
- issue: எரேமியா மேற்கோளின் உள்வாக்கிய அமைப்பு
  choice: முதல் செயலை ‘வைத்து’ என்ற வினையெச்சமாகவும், இரண்டாவதை ‘எழுதுவேன்’ என்ற எதிர்கால முற்றுவினையாகவும் வைத்தல்
  alternative: இரண்டையும் முற்றுவினைகளாக்கி, ‘வைப்பேன்; எழுதுவேன்’ என்று மொழிபெயர்த்தல்
  rationale: எபிரெயர் 10:16-இன் கிரேக்கத்தில் διδοὺς என்பது பங்கேற்பு வினையாகவும் ἐπιγράψω என்பது எதிர்கால முற்றுவினையாகவும் உள்ளது. தமிழ் வினையெச்சம் இந்த வேறுபாட்டை வாசிக்கத்தக்க முறையில் பாதுகாக்கிறது; எரேமியாவின் பழக்கமான மொழிபெயர்ப்பு வடிவத்தோடு அமைதியாக ஒத்திசைக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதைமிக்க வேதாகம நடையைப் பயன்படுத்துகிறது. ‘இதயங்களின்மேல்’, ‘மனங்களின்மேல்’ என்பவை அன்றாட தமிழைவிட சற்றே முறையானவை; எனினும் மூலத்தின் ‘மேல்’ என்ற எழுதுதல்/பதித்தல் உருவகத்தைப் பாதுகாக்க அவை தேர்ந்தெடுக்கப்பட்டன.
