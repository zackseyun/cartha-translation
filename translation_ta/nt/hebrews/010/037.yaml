  text: ἔτι γὰρ μικρὸν ὅσον ὅσον, ὁ ἐρχόμενος ἥξει καὶ οὐ χρονίσει·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/037.yaml
  text: For yet a very little while[b][a], the one who is coming will come and will not delay.
translation:
  language: ta
  text: ஏனெனில், இன்னும் மிகக் கொஞ்சக் காலமே உள்ளது[a]; வருகிறவர்[b] வருவார்; தாமதிக்கமாட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘இன்னும் கொஞ்சம், எவ்வளவு எவ்வளவோ’; இது ‘மிகக் கொஞ்சக் காலம்’ என்று பொருள்படும் வலியுறுத்தும் மரபுத்தொடர்.'
    reason: lexical_alternative
  - marker: b
    text: ‘வருகிறவர்’ என்ற சொற்றொடர் இங்கு வரவிருக்கும் மேசியாவைக் குறிக்கும் சிறப்புப் பெயராகவும் புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι γὰρ
  choice: ஏனெனில், இன்னும்
  rationale: γάρ முந்தைய அறிவுறுத்தலுக்கான காரணத் தொடர்பைக் காட்டுகிறது; ἔτι காலப் பொருளில் ‘இன்னும்’ என இயல்பாக வழங்கப்படுகிறது.
- source_word: μικρὸν ὅσον ὅσον
  choice: மிகக் கொஞ்சக் காலமே உள்ளது
  rationale: ὅσον ὅσον என்ற மீளுரை மிகக் குறுகிய காலத்தை வலியுறுத்தும் மரபுத்தொடர். தமிழில் ‘மிகக் கொஞ்சக் காலமே’ என்பது அந்த வலியுறுத்தலை இயல்பாகத் தருகிறது; ‘உள்ளது’ என்பது மேற்கோளின் காலநிலையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ὁ ἐρχόμενος
  choice: வருகிறவர்
  rationale: உறுப்புடன் வரும் நிகழ்காலப் பங்கேற்புவினை பெயர்ச்சொல் போலச் செயல்படுகிறது. ‘வருகிறவர்’ அதன் பங்கேற்புவினை வடிவத்தையும், சூழலில் இருக்கக்கூடிய மேசியாவைக் குறிக்கும் சிறப்புப் பொருளையும் அதிகமாகத் தீர்மானிக்காமல் காக்கிறது.
- source_word: ἥξει
  choice: வருவார்
  rationale: எதிர்கால வினையின் நேரடியான பொருளைத் தருவதோடு, ἐρχόμενος என்பதுடனான ‘வருதல்’ என்ற சொல் ஒலிப்பையும் காக்கிறது.
- source_word: οὐ χρονίσει
  choice: தாமதிக்கமாட்டார்
  rationale: χρονίζω இங்கு காலந்தாழ்த்துதல் அல்லது தாமதித்தல் எனப் பொருள்படும். ‘தாமதிக்கமாட்டார்’ நவீனத் தமிழில் தெளிவும் இயல்பும் உடையது.
theological_decisions:
- issue: ὁ ἐρχόμενος என்பது மேசியாவுக்குரிய சிறப்புப் பெயரா அல்லது பொதுவான பங்கேற்புவினைத் தொடரா?
  choice: முதன்மை உரையில் ‘வருகிறவர்’
  alternative: ‘வரவிருக்கிறவர்’ அல்லது ‘வருபவர்’
  rationale: இத்தொடர் சூழலில் வரவிருக்கும் மேசியாவைக் குறிக்கக்கூடும்; ஆயினும் கிரேக்க வடிவம் நேரடியாக ‘வருகிறவர்’ என்பதே. தமிழில் தனிப்பட்ட பெரியெழுத்து வேறுபாடு இல்லாததால், இந்த மொழிபெயர்ப்பு சாத்தியமான சிறப்புப்பெயர் வலிமையையும் இலக்கணத் தெளிவின்மையையும் ஒன்றாகக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. ‘வருகிறவர் வருவார்’ என்ற மீளமைப்பு கிரேக்கத்தின் சொல் ஒலிப்பையும் வாக்குறுதியின் வலிமையையும் காக்கிறது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
