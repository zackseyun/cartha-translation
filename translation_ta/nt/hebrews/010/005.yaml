revisions:
- from: 'ஆகவே[a], அவர் உலகத்திற்குள் வரும்போது கூறுவது: “பலியையும் காணிக்கையையும் நீ விரும்பவில்லை; ஆனால் எனக்காக ஓர் உடலை ஆயத்தப்படுத்தினாய்.”'
  to: 'ஆகவே[a], அவர் உலகத்திற்குள் வரும்போது கூறுகிறார்: “பலியையும் காணிக்கையையும் நீ விரும்பவில்லை; ஆனால் எனக்காக ஓர் உடலை ஆயத்தப்படுத்தினாய்.”'
  rationale: The revision makes only safe grammatical and consistency corrections. It preserves the Greek wording of Hebrews, including its present-tense citation formula and the contrast between sacrifices/offerings and the prepared body; it also retains the footnote documenting the differing Hebrew wording of Psalm 40:6.
