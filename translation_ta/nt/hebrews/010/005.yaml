id: HEB.10.5
reference: Hebrews 10:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διὸ εἰσερχόμενος εἰς τὸν κόσμον λέγει· Θυσίαν καὶ προσφορὰν οὐκ ἠθέλησας, σῶμα δὲ κατηρτίσω μοι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/005.yaml
  text: 'Therefore[a], when he comes into the world, he says: “Sacrifice and offering you did not desire, but a body you prepared for me.”'
translation:
  language: ta
  text: 'ஆகவே[a], அவர் உலகத்திற்குள் வரும்போது கூறுகிறார்: “பலியையும் காணிக்கையையும் நீ விரும்பவில்லை; ஆனால் எனக்காக ஓர் உடலை ஆயத்தப்படுத்தினாய்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கே எபிரெயர் நூல் சங்கீதம் 40:6-ன் கிரேக்க வாசகமான, “எனக்காக ஓர் உடலை ஆயத்தப்படுத்தினாய்” என்பதைப் பின்பற்றுகிறது. சங்கீதம் 40:6-ன் எபிரெய வாசகம், “எனக்காகச் செவிகளைத் திறந்தாய்” என்று உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: ஆகவே
  rationale: முந்தைய வாதத்திலிருந்து வரும் முடிவுறுத்தும் தொடர்பை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: εἰσερχόμενος εἰς τὸν κόσμον
  choice: அவர் உலகத்திற்குள் வரும்போது
  rationale: நிகழ்காலப் பங்கேற்புவினையின் காலத்தை அளவுக்கு மீறி வரையறுக்காமல், உலகிற்குள் வரும் சூழலை இயல்பாகத் தெரிவிக்கிறது.
- source_word: λέγει
  choice: கூறுவது
  rationale: வேதமேற்கோளை நிகழ்காலத்தில் அறிமுகப்படுத்தும் கிரேக்க நடையைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: Θυσίαν καὶ προσφορὰν
  choice: பலியையும் காணிக்கையையும்
  rationale: வழிபாட்டுச் சூழலிலுள்ள இரு தொடர்புடைய, ஆனால் தனித்த சொற்களையும் வேறுபடுத்திப் பாதுகாக்கிறது.
- source_word: οὐκ ἠθέλησας
  choice: நீ விரும்பவில்லை
  rationale: θέλω என்பதன் விருப்பம் அல்லது சித்தம் என்ற பொருளை இச்சூழலில் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: σῶμα δὲ
  choice: ஆனால் ... ஓர் உடலை
  rationale: δὲ காட்டும் எதிர்மறை மாறுபாட்டையும் σῶμα என்பதன் ஒருமை, தெளிவான உடல் சார்ந்த பொருளையும் பாதுகாக்கிறது.
- source_word: κατηρτίσω μοι
  choice: எனக்காக ... ஆயத்தப்படுத்தினாய்
  rationale: καταρτίζω என்பதன் தயார் செய்தல் என்ற பொருளையும் μοι என்பதன் பயன்நோக்கிய உறவையும் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: எபிரெயர் 10:5 மேற்கோளின் கிரேக்க வாசகம் சங்கீதம் 40:6-ன் எபிரெய வாசகத்திலிருந்து வேறுபடுகிறது.
  choice: “எனக்காக ஓர் உடலை ஆயத்தப்படுத்தினாய்” என்று எபிரெயர் நூலின் கிரேக்க வாசகத்தையே மொழிபெயர்த்தல்.
  alternative: “எனக்காகச் செவிகளைத் திறந்தீர்” என்று சங்கீதத்தின் எபிரெய வாசகத்தைப் பின்பற்றுதல்.
  rationale: மொழிபெயர்க்கப்படும் வசனத்தின் மூலமொழி வாசகத்திற்கே முன்னுரிமை அளிக்கப்படுகிறது. வேறுபாட்டை ஒத்திசைத்து மறைக்காமல் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் தெளிவும் கொண்ட வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. மேற்கோளுக்குள் கடவுளை நோக்கிப் பேசும் ஒருமை வடிவங்கள் மூலத்தின் இலக்கணத்தைப் பாதுகாக்கின்றன.
