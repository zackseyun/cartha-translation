  text: ὁ δὲ δίκαιός ⸀μου ἐκ πίστεως ζήσεται, καὶ ἐὰν ὑποστείληται, οὐκ εὐδοκεῖ ἡ ψυχή μου ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/038.yaml
  text: But my righteous one will live by faith[a], and if he shrinks back[c][b], my soul takes no pleasure in him.
translation:
  language: ta
  text: ஆனால், என் நீதிமான் விசுவாசத்தினால்[a] வாழ்வான்; அவன் பின்வாங்கினால்[c], என் உள்ளம் அவனிடத்தில் பிரியம் கொள்ளாது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நம்பிக்கையினால்’ அல்லது ‘நம்புவதினால்’ என்றும், ‘விசுவாசத்தன்மையினால்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் πίστις இப்பொருள்களைக் கொண்டிருக்கக்கூடும்; முதன்மை உரையில் ‘விசுவாசம்’ பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: சில கையெழுத்துப் பிரதிகளில் ‘என் நீதிமான்’ என்பதற்குப் பதிலாக ‘நீதிமான்’ என்று மட்டும் உள்ளது.
    reason: textual_variant
  - marker: c
    text: ‘அவன்,’ ‘அவனிடத்தில்’ என்ற ஒருமை ஆண்பால் வடிவங்கள் கிரேக்கச் சொல்லாட்சியைப் பிரதிபலிக்கின்றன; இவை பிரதிநிதித்துவப் பயன்பாடு உடையவை, ஆண்களை மட்டுமே குறிக்க வேண்டியதில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ δὲ δίκαιός μου
  choice: ஆனால், என் நீதிமான்
  rationale: கட்டுரையுடன் வரும் பெயரடையை நபரைக் குறிக்கும் பெயர்ச்சொல்லாக மொழிபெயர்த்து, SBLGNT உரையிலுள்ள μου என்பதையும் ‘என்’ என்று தக்கவைக்கிறது. δέ இங்குள்ள எதிர்மறைத் தொடர்பை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐκ πίστεως
  choice: விசுவாசத்தினால்
  rationale: ἐκ இங்கு வாழ்வதற்கான அடிப்படை அல்லது வழியைச் சுட்டுகிறது. πίστις என்பதற்கு முதன்மைத் தேர்வாக ‘விசுவாசம்’ பயன்படுத்தப்படுகிறது; ‘நம்பிக்கை/நம்புதல்’ மற்றும் ‘உண்மைத்தன்மை’ ஆகிய சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: ζήσεται
  choice: வாழ்வான்
  rationale: ζάω வினையின் எதிர்கால வடிவை நேரடியாகவும் இயல்பாகவும் தருகிறது; கிரேக்கத்தின் ஒருமை ஆண்பால் இலக்கணத் தொடரையும் காக்கிறது.
- source_word: ὑποστείληται
  choice: பின்வாங்கினால்
  rationale: அழுத்தம் அல்லது ஆபத்தின் முன் பின்னடைவது, விலகுவது என்ற சூழல்சார் பொருளை நவீனத் தமிழில் தெளிவாகச் சொல்கிறது.
- source_word: οὐκ εὐδοκεῖ
  choice: மகிழ்ச்சி கொள்ளாது
  rationale: ஒருவரில் பிரியம் அல்லது திருப்தி கொள்ளாமையை வெளிப்படுத்தும் εὐδοκέω என்பதன் தனிப்பட்ட உணர்வைத் தக்கவைக்கிறது.
- source_word: ἡ ψυχή μου
  choice: என் உள்ளம்
  rationale: கிரேக்கத்தின் ‘என் ஆத்துமா’ என்ற தனிப்பட்ட எபிரேய மரபுச் சொல்லாட்சியைத் தமிழில் இயல்பாக ‘என் உள்ளம்’ என்று தருகிறது; அதை வெறும் ‘நான்’ என்று சுருக்கவில்லை.
- source_word: ἐν αὐτῷ
  choice: அவனில்
  rationale: ἐν + வேற்றுமையின் வடிவத்தை நெருக்கமாகத் தக்கவைத்து, εὐδοκέω உடன் வரும் உறவுப்பொருளை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἐκ πίστεως என்பதில் πίστις-ன் பொருள்
  choice: விசுவாசத்தினால்
  alternative: நம்பிக்கையினால் / நம்புவதினால்; உண்மைத்தன்மையினால்
  rationale: இங்கு ‘விசுவாசம்,’ ‘நம்புதல்,’ ‘உண்மைத்தன்மை’ ஆகிய பொருள் நிழல்கள் சாத்தியம். முதன்மை உரை ‘விசுவாசம்’ என்பதைத் தேர்ந்தெடுத்தாலும் மற்ற சாத்தியங்களை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: ‘அவன் பின்வாங்கினால்’ என்பதன் எழுவாய்
  choice: முன்னர் கூறப்பட்ட அதே ஒருமை நபருடன் இலக்கணத் தொடரை வைத்தல்
  alternative: ‘யாராவது பின்வாங்கினால்’ என வேறு, பொதுவான நபரைக் குறித்தல்
  rationale: கிரேக்கத்தில் வெளிப்படையான புதிய எழுவாய் இல்லை; ஒருமை வடிவங்கள் தொடர்கின்றன. எனவே எச்சரிக்கையிலுள்ள இறையியல் பதற்றத்தை மென்மைப்படுத்தாமல் இலக்கணத் தொடரை மொழிபெயர்ப்பு காக்கிறது.
- issue: ஒருமை ஆண்பால் பிரதிநிதித்துவம்
  choice: ‘வாழ்வான்’, ‘அவன்’, ‘அவனில்’ என்று தக்கவைத்தல்
  alternative: பாலினம் காட்டாத பன்மை அல்லது ‘அந்த நபர்’
  rationale: கிரேக்கத்தின் ஒருமை ஆண்பால் வடிவங்கள் பிரதிநிதித்துவமாகப் பயன்படுகின்றன. தமிழ் முதன்மை உரை அந்த இலக்கண வடிவத்தைப் பாதுகாக்கிறது; அது ஆண்களுக்கு மட்டும் வரையறுக்கப்படவில்லை என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: ἡ ψυχή μου என்ற தெய்வீகப் பேச்சு
  choice: ‘என் உள்ளம்’
  alternative: ‘நான்’ அல்லது ‘என் ஆத்துமா’
  rationale: வேதாகம மேற்கோளின் தனிப்பட்ட, உருவகமான சொல்லாட்சியைப் பாதுகாத்தபடியே, இன்றைய பொதுத் தமிழில் இயல்பாக இருக்க ‘என் உள்ளம்’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified வேதாகம நடையைப் பயன்படுத்துகிறது. ‘நீதிமான்,’ ‘விசுவாசம்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; ‘என் உள்ளம்’ என்பது சொல்லுக்கு சொல் ‘என் ஆத்துமா’ என்பதைக் காட்டிலும் இயல்பானது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
