  text: Where there is forgiveness of these[a], there is no longer any offering for sin.
translation:
  language: ta
  text: இவற்றுக்கு[a] மன்னிப்பு இருக்கும் இடத்தில், பாவத்திற்கான பலியர்ப்பணம் இனி இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இவற்றின் மன்னிப்பு’ என்றும் மொழிபெயர்க்கலாம். ‘இவை’ என்பது முந்தைய வசனத்தில் குறிப்பிடப்பட்ட பாவங்களையும் அக்கிரமச் செயல்களையும் குறிக்கிறது.
    reason: ἄφεσις τούτων என்பதில் உள்ள மன்னிப்பு/விடுதலை என்ற கருத்தையும், τούτων என்பதன் முந்தைய வசனக் குறிப்பையும் விளக்குகிறது.
lexical_decisions:
- source_word: ὅπου
  choice: இருக்குமிடத்தில்
  rationale: ஒரு நிலை நிலவும் இடத்தையோ சூழலையோ குறிக்கிறது. தமிழில் ‘மன்னிப்பு இருக்குமிடத்தில்’ என்பது கிரேக்கத்தின் தர்க்கத் தொடர்பை இயல்பாகத் தருகிறது.
- source_word: δὲ
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது வலுவான எதிர்மறை இணைப்பல்ல; முந்தைய வசனத்திலிருந்து வரும் மென்மையான தொடர்ச்சி அல்லது முடிவைக் குறிக்கிறது. தமிழ் வாக்கிய அமைப்பிலேயே அந்தத் தொடர்பு தெளிவாக இருப்பதால் கூடுதல் இணைப்புச் சொல் சேர்க்கப்படவில்லை.
- source_word: ἄφεσις
  choice: மன்னிப்பு
  rationale: பாவங்கள் நீக்கப்படுதல் அல்லது மன்னிக்கப்படுதல் என்ற பொருளை இச்சூழலில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τούτων
  choice: இவற்றுக்கு
  rationale: கிரேக்கச் சுட்டுப்பெயரின் தெளிவின்மையைப் பேணுகிறது; அதன் குறிப்பு முந்தைய வசனத்தில் சொல்லப்பட்ட பாவங்களும் அக்கிரமச் செயல்களும் ஆகும்.
- source_word: οὐκέτι
  choice: இனி இல்லை
  rationale: முன்பு இருந்த ஒன்று தொடர்ந்து இல்லை என்ற நிறைவு அல்லது நிறுத்தத்தை இயல்பான தமிழில் துல்லியமாகக் காட்டுகிறது.
- source_word: προσφορὰ
  choice: பலியர்ப்பணம்
  rationale: இது பலி சார்ந்த சூழலில் செலுத்தப்படும் அர்ப்பணத்தைக் குறிக்கிறது. ‘பலியர்ப்பணம்’ என்பது பொதுவான அர்ப்பணம் என்ற பொருளையும் இச்சூழலின் பலித் தன்மையையும் இணைத்துக் காட்டுகிறது.
- source_word: περὶ ἁμαρτίας
  choice: பாவத்திற்கான
  rationale: பாவத்தை முன்னிட்டு அல்லது பாவத்திற்காகச் செலுத்தப்படும் பலியர்ப்பணம் என்ற பொருளைத் தருகிறது; ‘பாவநிவாரண பலி’ என்று விளக்கமாக விரிவுபடுத்தாமல் கிரேக்கத்தின் சுருக்கத்தைப் பேணுகிறது.
theological_decisions:
- issue: கிறிஸ்துவின் பலியின் இறுதித்தன்மை குறித்த உட்பொருள்
  choice: மன்னிப்பு இருக்குமிடத்தில் பாவத்திற்கான பலியர்ப்பணம் இனி இல்லை என்று நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: எல்லா வகையான காணிக்கைகளும் முற்றிலும் ஒழிக்கப்பட்டன என்று கூறுதல்; அல்லது லேவிய முறைமையின் சடங்குப் பலிகளை மட்டுமே வெளிப்படையாகக் குறிப்பதாகச் சுருக்குதல்.
  rationale: எபிரெயர் 10-ன் உடனடிச் சூழல் மீண்டும் மீண்டும் செலுத்தப்பட்ட பலிகளையும் கிறிஸ்துவின் ஒரே பலியின் பயனையும் ஒப்பிடுகிறது. இந்த மொழிபெயர்ப்பு பாவத்திற்கான பலியர்ப்பணம் இனி இல்லை என்ற வசனத்தின் கூற்றை மட்டும் பேணி, அதற்கு அப்பாற்பட்ட கோட்பாட்டு முடிவைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. வாக்கியம் மூலத்தின் சுருக்கத்தையும் ‘இவை’ என்ற சுட்டுப்பெயரின் உண்மையான தெளிவின்மையையும் பேணுகிறது.
