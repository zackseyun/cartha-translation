id: HEB.10.24
reference: Hebrews 10:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ κατανοῶμεν ἀλλήλους εἰς παροξυσμὸν ἀγάπης καὶ καλῶν ἔργων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/024.yaml
  text: and let us consider one another[a], to stir up love and good works,
translation:
  language: ta
  text: மேலும், அன்புக்கும் நற்செயல்களுக்கும் தூண்டுவதற்காக[a] ஒருவரையொருவர் கவனத்தில் கொள்வோமாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தீவிரமாகத் தூண்டுவதற்காக’ அல்லது ‘சீண்டிவிடுவதற்காக’ என்றும் மொழிபெயர்க்கலாம். παροξυσμός என்ற கிரேக்கப் பெயர்ச்சொல் வலுவான தூண்டுதலை அல்லது சீண்டுதலைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοῶμεν
  choice: கவனத்தில் கொள்வோமாக
  rationale: முதல் நபர் பன்மை நிகழ்காலத் துணைவினை வடிவத்தின் ஊக்குவிக்கும் பொருளை ‘-வோமாக’ வெளிப்படுத்துகிறது. வினை குறிக்கும் கவனமான பரிசீலனையையும் இந்தத் தேர்வு இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: ἀλλήλους
  choice: ஒருவரையொருவர்
  rationale: பரஸ்பரப் பொருளை நேரடியாகவும் சமூகத்தை நோக்கிய அறிவுரைக்கு ஏற்றவாறும் தருகிறது.
- source_word: εἰς
  choice: தூண்டுவதற்காக
  rationale: இங்கு εἰς நோக்கம் அல்லது விளைவை அறிமுகப்படுத்துவதால், தமிழில் நோக்கத்தைத் தெளிவாகக் காட்டும் ‘-வதற்காக’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: παροξυσμὸν
  choice: தூண்டுதல்
  rationale: இந்தப் பெயர்ச்சொல் வலுவான தூண்டுதலையோ சீண்டுதலையோ குறிக்கலாம். அன்பும் நற்செயல்களும் அதன் நேர்மறையான இலக்குகளாக இருப்பதால், ‘தூண்டுதல்’ அதன் செயலூக்க வலிமையை எதிர்மறையான பொருள் ஏற்றாமல் வெளிப்படுத்துகிறது; கூர்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἀγάπης
  choice: அன்பு
  rationale: ἀγάπη என்பதற்கான இயல்பான, தற்போதைய தமிழ் இணைச்சொல்; சூழலில் அதன் பரந்த நெறிசார் மற்றும் உறவுசார் பொருளைக் காக்கிறது.
- source_word: καλῶν ἔργων
  choice: நற்செயல்கள்
  rationale: ‘நல்ல செயல்கள்’ என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; குறிப்பிட்ட புண்ணிய அல்லது தகுதி சார்ந்த கோட்பாட்டைச் சேர்ப்பதில்லை.
- source_word: καὶ
  choice: மேலும் / -உம்
  rationale: வசனத்தை முந்தைய அறிவுரையுடன் இணைக்க ‘மேலும்’ என்றும், அன்பையும் நற்செயல்களையும் இணைக்க இணைப்பும்மை என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: παροξυσμός என்பதன் எதிர்மறையாக ஒலிக்கக்கூடிய வலிமை
  choice: முதன்மை உரையில் ‘தூண்டுதல்’ என்று நேர்மறையாகவும் வலிமையுடனும் தரப்பட்டது.
  alternative: ‘தீவிரமாகத் தூண்டுதல்’ அல்லது ‘சீண்டிவிடுதல்’
  rationale: சொல்லுக்கு கூர்மையான தூண்டுதல் அல்லது சீண்டுதல் என்ற நிழற்பொருள் இருக்கலாம். ஆனால் அதன் இலக்குகள் அன்பும் நற்செயல்களுமாக இருப்பதால், முதன்மை உரையில் நேர்மறையான செயலூக்கப் பொருள் பொருத்தமானது. மூலச்சொல்லின் தீவிரம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கூட்டுச் சமூகத்தை நோக்கிய கண்ணியமான அறிவுரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கவனத்தில் கொள்வோமாக’ என்பது பரஸ்பரமான கவனிப்பையும் சிந்தனையையும் காக்கிறது; ‘தூண்டுவதற்காக’ என்பது நோக்கத்தையும் மூலச்சொல்லின் செயலூக்கத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
