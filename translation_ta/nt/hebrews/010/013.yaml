source:
  edition: SBLGNT
  text: τὸ λοιπὸν ἐκδεχόμενος ἕως τεθῶσιν οἱ ἐχθροὶ αὐτοῦ ὑποπόδιον τῶν ποδῶν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/013.yaml
  text: from then on waiting until his enemies are made a footstool for his feet[b][a],
translation:
  language: ta
  text: அதுமுதல், தம் பகைவர்கள் தம் பாதங்களுக்குக் கால்மணையாக ஆக்கப்படும்வரை[b] காத்துக்கொண்டிருக்கிறார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எதிர்பார்த்திருக்கிறார்’ அல்லது ‘எதிர்நோக்கிக் காத்திருக்கிறார்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கப் பெயரெச்சம் எதிர்பார்ப்புடன் காத்திருக்கும் நுண்பொருளைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'இச்சொற்கள் சங்கீதம் 110:1-ஐ எதிரொலிக்கின்றன: “நான் உம் பகைவர்களை உம் பாதங்களுக்குக் கால்மணையாக்கும்வரை என் வலப்பக்கத்தில் அமர்ந்திரும்.”'
    reason: cross_reference
lexical_decisions:
- source_word: τὸ λοιπὸν
  choice: அதுமுதல்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட ஒரே பலியையும் அவர் அமர்ந்ததையும் தொடர்ந்து வரும் காலநிலையைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: ἐκδεχόμενος
  choice: காத்துக்கொண்டிருக்கிறார்
  rationale: தொடர்ந்து நிலவும் காத்திருத்தலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது. சூழலிலுள்ள முதன்மை வினையோடு தொடர்புடைய கிரேக்கப் பெயரெச்சம் தமிழில் முழு வினையாக அளிக்கப்பட்டுள்ளது.
- source_word: ἕως
  choice: ஆக்கப்படும்வரை
  rationale: காத்திருத்தலின் கால எல்லையைத் தெளிவாகக் குறிக்கிறது.
- source_word: τεθῶσιν
  choice: ஆக்கப்பட
  rationale: கிரேக்கச் செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது; பகைவர்களை யார் இந்நிலைக்கு உட்படுத்துகிறார் என்பதை மொழிபெயர்ப்பு வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: οἱ ἐχθροὶ αὐτοῦ
  choice: தம் பகைவர்கள்
  rationale: αὐτοῦ என்பது இங்கு காத்திருப்பவரையே சுட்டுவதால், தமிழில் இயல்பான தற்சுட்டுப் பெயரடையான ‘தம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ὑποπόδιον τῶν ποδῶν αὐτοῦ
  choice: தம் பாதங்களுக்குக் கால்மணையாக
  rationale: சங்கீதம் 110:1-ஐ எதிரொலிக்கும் கால்மணை உருவகத்தைச் சுருக்காமல் பாதுகாக்கிறது; ‘பாதங்கள்’ dignified modern Tamil register-க்கு ஏற்றது.
theological_decisions:
- issue: சங்கீதம் 110:1-இலிருந்து வரும் மெசியாவின் அரியணையேற்ற உருவகம்
  choice: பகைவர்கள் ‘தம் பாதங்களுக்குக் கால்மணையாக’ ஆக்கப்படுவார்கள் என்ற concrete உருவகத்தை அப்படியே வைத்தல்
  alternative: பகைவர்கள் தோற்கடிக்கப்படும்வரை / அவருடைய காலடியில் அடக்கப்படும்வரை
  rationale: எபிரெயர் நூலாசிரியர் பயன்படுத்தும் சங்கீதம் 110:1-ன் சொற்படிமத்தையும் கிறிஸ்துவின் அரசாட்சியைக் குறிக்கும் இடைநூல் தொடர்பையும் இது பாதுகாக்கிறது; வெறும் தோல்வி என்று விளக்கி அதன் பொருளைச் சுருக்கவில்லை.
- issue: செயப்பாட்டு வினையில் செய்பவர் வெளிப்படையாகக் குறிப்பிடப்படாமை
  choice: ‘ஆக்கப்படும்வரை’ என்று செயப்பாட்டு அமைப்பைத் தக்கவைத்தல்
  alternative: கடவுள் அவருடைய பகைவர்களைக் கால்மணையாக ஆக்கும்வரை
  rationale: சங்கீதச் சூழல் செய்பவரை உணர்த்தினாலும், இவ்வசனத்தின் கிரேக்க உரை அவரை வெளிப்படையாகப் பெயரிடவில்லை. ஆகவே உண்மையான இலக்கணத் திறப்பை மொழிபெயர்ப்பு மூடவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பான வாக்கிய அமைப்பு பயன்படுத்தப்பட்டுள்ளது. ‘கால்மணை’ என்ற concrete அரசாட்சி உருவகம் பாதுகாக்கப்பட்டுள்ளது; ‘பாதங்கள்’ மரியாதையும் இலக்கியத் தன்மையும் கொண்டிருந்தாலும் இன்றைய வாசகருக்குத் தெளிவான சொல்லாகும்.
