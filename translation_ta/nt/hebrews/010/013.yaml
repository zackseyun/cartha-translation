  source_fidelity: ‘அதுமுதல்’ accurately renders τὸ λοιπὸν in its temporal sense. ‘காத்துக்கொண்டிருக்கிறார்’ appropriately conveys the ongoing force of ἐκδεχόμενος, and ‘ஆக்கப்படும்வரை’ retains the passive and the temporal endpoint expressed by ἕως plus τεθῶσιν without supplying an agent. The concrete Psalm 110:1 image is preserved in ‘தம் பாதங்களுக்குக் கால்மணையாக.’
  naturalness: The sentence is clear, grammatical, and suitably formal in modern standard Tamil. The continuous verbal form reads naturally in a standalone verse while reflecting the ongoing posture conveyed by the Greek participle.
