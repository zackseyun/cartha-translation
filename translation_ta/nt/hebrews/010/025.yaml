revisions:
- from: நம்முடைய ஒன்றுகூடுதலைப் புறக்கணிக்காமல்[a]—சிலருக்கு வழக்கமாயிருப்பதுபோல்—ஒருவரையொருவர் ஊக்கப்படுத்துவோம்; அந்த நாள் நெருங்கி வருவதை நீங்கள் காண்கிறபடியால், இன்னும் அதிகமாக அப்படிச் செய்வோம்.[b]
