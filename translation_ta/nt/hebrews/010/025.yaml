source:
  edition: SBLGNT
  text: μὴ ἐγκαταλείποντες τὴν ἐπισυναγωγὴν ἑαυτῶν, καθὼς ἔθος τισίν, ἀλλὰ παρακαλοῦντες, καὶ τοσούτῳ μᾶλλον ὅσῳ βλέπετε ἐγγίζουσαν τὴν ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/025.yaml
  text: not neglecting our own gathering together[a], as is the habit of some[b], but encouraging one another—and all the more as you see the Day drawing near.
translation:
  language: ta
  text: நம்முடைய கூடிவருதலைப் புறக்கணிக்காமல்[a]—சிலருக்கு வழக்கமாயிருப்பதுபோல்—ஒருவரையொருவர் ஊக்கப்படுத்துவோம்; அந்த நாள் நெருங்கி வருவதை நீங்கள் காணும் அளவுக்கு, இன்னும் அதிகமாக ஊக்கப்படுத்துவோம்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம்முடைய கூடிவருதலைக் கைவிடாமல்” அல்லது “விட்டுவிடாமல்.”
    reason: lexical_alternative
  - marker: b
    text: “அந்த நாள்” என்பது கர்த்தருடைய நாளை அல்லது இறுதி நியாயத்தீர்ப்பு நாளைக் குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγκαταλείποντες
  choice: புறக்கணிக்காமல்
  rationale: கூடிவருவதைத் தொடர்ந்து கடைப்பிடிக்கத் தவறுதல் அல்லது அதைக் கைவிடுதல் என்ற பொருள் வரம்பை இது இயல்பான தமிழில் தருகிறது; முற்றிலும் கைவிடுதல் என்ற வலுவான பொருளை முதன்மை உரையில் தேவையின்றித் திணிப்பதில்லை.
- source_word: ἐπισυναγωγὴν ἑαυτῶν
  choice: நம்முடைய ஒன்றுகூடுதலை
  rationale: விசுவாசிகள் தாங்களே ஒன்றாகக் கூடிவருவதைக் குறிக்கிறது; பிற்கால நிறுவன அல்லது வழிபாட்டு நிகழ்ச்சி சார்ந்த கருத்துகளைச் சேர்க்காமல் கூட்டு இயல்பைப் பாதுகாக்கிறது.
- source_word: καθὼς ἔθος τισίν
  choice: சிலருக்கு வழக்கமாயிருப்பதுபோல்
  rationale: ἔθος என்பதன் வழக்கம் அல்லது பழக்கம் என்ற பொருளையும், ஆசிரியரின் மென்மையான ஆனால் தெளிவான கண்டிப்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: παρακαλοῦντες
  choice: ஒருவரையொருவர் ஊக்கப்படுத்துவோம்
  rationale: இச்சூழலில் உறுதியாக நிலைத்திருக்கப் பரஸ்பரம் வலுப்படுத்துதல் முதன்மையானது. கிரேக்கத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லாவிட்டாலும், சமூகச் சூழல் பரஸ்பரப் பொருளைத் தெளிவாக உணர்த்துகிறது.
- source_word: τοσούτῳ μᾶλλον ὅσῳ
  choice: நீங்கள் காண்கிறபடியால், இன்னும் அதிகமாக
  rationale: அந்த நாள் நெருங்குவதை உணரும் அளவுக்கு ஏற்ப ஊக்கப்படுத்துதல் அதிகரிக்க வேண்டும் என்ற ஒப்பீட்டு வலியுறுத்தலைத் தெளிவாகக் காட்டுகிறது.
- source_word: βλέπετε
  choice: நீங்கள் காண்கிறபடியால்
  rationale: இரண்டாம் நபர் பன்மை நிகழ்கால வடிவை நேரடியாகத் தருகிறது; அவர்கள் எதன் மூலம் இதை உணர்கிறார்கள் என்பதை உரை குறிப்பிடாததால் அதையும் திறந்தே வைக்கிறது.
- source_word: ἐγγίζουσαν
  choice: நெருங்கி வருவதை
  rationale: அந்த நாள் காலரீதியாக அணுகிவருகிறது என்ற உயிரோட்டமான கருத்தைப் பாதுகாக்கிறது.
- source_word: τὴν ἡμέραν
  choice: அந்த நாள்
  rationale: சூழலில் ஏற்கெனவே அறியப்பட்ட ஒரு தனித்த இறுதிக்கால நாளைக் குறிக்கும் சுட்டுத்தன்மையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ‘கர்த்தருடைய நாள்’ அல்லது ‘நியாயத்தீர்ப்பு நாள்’ என்று மூலத்தைவிட விரிவாக்கவில்லை.
theological_decisions:
- issue: ‘அந்த நாள்’ என்பதன் இறுதிக்காலக் குறிப்பு
  choice: முதன்மை உரையில் ‘அந்த நாள்’ என்று மட்டும் வழங்கி, இறுதிக்காலக் குறிப்பை அடிக்குறிப்பில் விளக்குதல்
  alternative: ‘கர்த்தருடைய நாள்’ அல்லது ‘நியாயத்தீர்ப்பு நாள்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: நிலைத்திருத்தல் மற்றும் நெருங்கிவரும் நிறைவு பற்றிய சூழல் இறுதிக்கால நாளைக் குறிக்கிறது. எனினும் கிரேக்க உரை அந்த நாளை மேலும் பெயரிட்டுச் சொல்லாததால், குறிப்பிட்ட விளக்கத்தை முதன்மை உரையில் திணிக்காமல் அதன் பொருள் பதற்றத்தைப் பாதுகாக்கிறது.
- issue: παρακαλοῦντες என்பதன் பரஸ்பரச் செயப்படுபொருள்
  choice: ‘ஒருவரையொருவர்’ என்று வெளிப்படுத்துதல்
  alternative: செயப்படுபொருளைக் குறிப்பிடாமல் ‘ஊக்கப்படுத்தி’ என்று விடுதல்
  rationale: கிரேக்கத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லாவிட்டாலும், ‘நம்முடைய ஒன்றுகூடுதல்’ என்ற சமூகச் சூழலில் பரஸ்பர ஊக்கமே இயல்பாக உணர்த்தப்படுகிறது. தமிழில் முழுமையான, தெளிவான வாக்கியத்திற்காக இது வெளிப்படுத்தப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்கும் புரியும் கண்ணியமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. முந்தைய வசனத்தின் அறிவுறுத்தலைத் தொடரும் கிரேக்கப் பெயரெச்ச அமைப்பு தமிழில் இயல்பான கூட்டுவினை அறிவுறுத்தலாக ‘ஊக்கப்படுத்துவோம் ... செய்வோம்’ என வழங்கப்பட்டுள்ளது. இரு அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
