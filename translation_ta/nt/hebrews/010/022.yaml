source:
  edition: SBLGNT
  text: προσερχώμεθα μετὰ ἀληθινῆς καρδίας ἐν πληροφορίᾳ πίστεως, ῥεραντισμένοι τὰς καρδίας ἀπὸ συνειδήσεως πονηρᾶς καὶ λελουσμένοι τὸ σῶμα ὕδατι καθαρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/022.yaml
  text: let us draw near with a true heart in full assurance of faith[d][c][b][a], with our hearts sprinkled clean from an evil conscience and our bodies washed with pure water.
translation:
  language: ta
  text: தீய[b] மனச்சாட்சியிலிருந்து நம் உள்ளங்கள் தெளிக்கப்பட்டு[d], தூய நீரால் நம் உடல்கள் கழுவப்பட்ட நிலையில்[c], உண்மையான[a] உள்ளத்தோடும் விசுவாசத்தின் முழு உறுதியோடும் நாம் கடவுளிடம் நெருங்குவோமாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நேர்மையான உள்ளத்தோடு.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “குற்றவுணர்வுள்ள மனச்சாட்சியிலிருந்து.”
    reason: lexical_alternative
  - marker: c
    text: இந்த உருவகம் சடங்குத் தூய்மைப்படுத்தும் மொழியை நினைவூட்டலாம்; சில வாசகர்களுக்கு இது திருமுழுக்கின் எதிரொலியாகவும் கேட்கலாம். ஆனால் இவ்வசனம் இந்தக் கழுவுதலை வெளிப்படையாக அடையாளப்படுத்தவில்லை.
    reason: cultural_note
  - marker: d
    text: அல்லது, “தூய்மைப்படுத்தும் வகையில் தெளிக்கப்பட்டு.”
    reason: previous_rendering
lexical_decisions:
- source_word: προσερχώμεθα
  choice: நாம் கடவுளிடம் நெருங்குவோமாக
  rationale: முதல் நபர் பன்மை அறிவுறுத்தல் வினையின் அழைப்புத் தன்மையைப் பேணுகிறது. எபிரெயர் நிருபத்தில் இவ்வினை கடவுளை அணுகுவதைக் குறிக்கும் சூழலில் வருவதால், தமிழில் இயல்பாக இருக்க மறைந்துள்ள இலக்கு ‘கடவுளிடம்’ என வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: ἀληθινῆς καρδίας
  choice: உண்மையான உள்ளத்தோடு
  rationale: ἀληθινός என்பதன் ‘உண்மையான, மெய்யான, போலியற்ற’ என்ற பரப்பைச் சுருக்காமல் பேணுகிறது; ‘நேர்மையான’ என்று மட்டும் மொழிபெயர்த்து மனநேர்மைக்குள் பொருளைக் குறுக்கவில்லை.
- source_word: ἐν πληροφορίᾳ πίστεως
  choice: விசுவாசத்தின் முழு உறுதியோடு
  rationale: πληροφορία குறிக்கும் நிறைவான உறுதி அல்லது நிச்சயத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; πίστις இங்கு விசுவாசியின் நம்பிக்கையைக் குறிக்கிறது.
- source_word: ῥεραντισμένοι τὰς καρδίας
  choice: நம் உள்ளங்கள் தெளிக்கப்பட்டவர்களாய்
  rationale: முற்றுப்பெற்ற தூய்மைப்படுத்தும் செயலில் விளைந்த தற்போதைய நிலையைச் சுட்டும் நிறைவு passive participle-ஐயும், பலியிடுதல்/சடங்குத் தூய்மைப்படுத்துதல் சார்ந்த ‘தெளித்தல்’ உருவகத்தையும் பேணுகிறது.
- source_word: ἀπὸ συνειδήσεως πονηρᾶς
  choice: தீய மனச்சாட்சியிலிருந்து
  rationale: πονηρός என்பதன் நேரடியான ‘தீய’ பொருளைத் தக்கவைக்கிறது; அதை ‘குற்றவுணர்வுள்ள’ என்று உளவியல் சார்ந்த குறுகிய பொருளாக்கவில்லை.
- source_word: λελουσμένοι τὸ σῶμα
  choice: நம் உடல்கள் கழுவப்பட்டவர்களாய்
  rationale: முற்றுப்பெற்ற கழுவுதலால் உண்டான நிலையைப் பேணுகிறது. கிரேக்க ஒருமை பன்மைப் பொருளுடைய ஒவ்வொருவரின் உடலையும் பகிர்ந்தளிக்கும் முறையில் குறிக்கிறது; தமிழில் பன்மை இயல்பானது.
- source_word: ὕδατι καθαρῷ
  choice: தூய நீரால்
  rationale: καθαρός என்பதன் தூய்மை/சுத்தம் சார்ந்த பொருளையும் இச்சூழலின் சடங்குத் தூய்மைப்படுத்தல் நிழலையும் தெரிவிக்கிறது.
theological_decisions:
- issue: உடல் கழுவப்படும் மொழி கிறிஸ்தவத் திருமுழுக்கை வெளிப்படையாகக் குறிக்கிறதா
  choice: முதன்மை உரையில் கழுவுதல் மற்றும் தூய்மைப்படுத்துதல் உருவகத்தை மட்டும் பேணி, அதைத் திருமுழுக்கு என்று வெளிப்படையாக அடையாளப்படுத்தவில்லை.
  alternative: இதனை நேரடியாகத் திருமுழுக்கைக் குறிக்கும் மொழியாக்குதல்; அல்லது முற்றிலும் உள்ளார்ந்த உருவகமாக மட்டும் எடுத்துரைத்தல்.
  rationale: இவ்வசனத்தின் மொழி லேவியத் தூய்மைப்படுத்தல் முறைகளையும் திருமுழுக்கையும் நினைவூட்டக்கூடும்; ஆனால் கழுவுதலை இவ்வசனமே வெளிப்படையாக அடையாளப்படுத்தவில்லை. ஆகவே இறையியல் பதற்றமும் உண்மையான தெளிவின்மையும் பேணப்படுகின்றன.
- issue: πονηρᾶς என்பதைக் ‘தீய’ என்றா ‘குற்றவுணர்வுள்ள’ என்றா மொழிபெயர்ப்பது
  choice: தீய மனச்சாட்சி
  alternative: குற்றவுணர்வுள்ள மனச்சாட்சி
  rationale: மூலச்சொல் ‘தீய’ என்று கூறுகிறது; அது குற்றவுணர்வை உள்ளடக்கக்கூடியதாயினும் அதற்கு மட்டும் வரையறுக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையும் வேதாகமத் தகுதியும் உடைய நடை பயன்படுத்தப்பட்டுள்ளது. ‘உள்ளம்,’ ‘மனச்சாட்சி,’ ‘விசுவாசம்,’ ‘தூய நீர்’ ஆகிய சொற்கள் மூலத்தின் வழிபாட்டு மற்றும் உள்ளார்ந்த தூய்மை உருவகங்களை ஒன்றுக்கொன்று எதிராகப் பிரிக்காமல் பேணுகின்றன.
