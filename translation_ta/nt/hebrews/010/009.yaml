source:
  edition: SBLGNT
  text: τότε εἴρηκεν· Ἰδοὺ ἥκω τοῦ ⸀ποιῆσαι τὸ θέλημά σου· ἀναιρεῖ τὸ πρῶτον ἵνα τὸ δεύτερον στήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/009.yaml
  text: Then he said[a], ‘Behold, I have come to do your will.’ He takes away the first so that he may establish the second.
translation:
  language: ta
  text: பின்பு அவர், “இதோ, உமது விருப்பத்தைச் செய்ய நான் வந்திருக்கிறேன்” என்று கூறியிருக்கிறார். இரண்டாவதை நிலைநிறுத்துவதற்காக முதலாவதை அவர் நீக்குகிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “முதலாவது”, “இரண்டாவது” என்பவை உடனடியான சூழலில் பலிகளும் காணிக்கைகளும் அடங்கிய முதல் ஒழுங்கையும், மெசியாவின் அர்ப்பணிப்பில் நிறைவேறிய தேவனுடைய விருப்பத்தையும் குறிக்கக்கூடும். மற்றொரு புரிதலின்படி, அவை சங்கீத மேற்கோளில் வரும் முதல் மற்றும் இரண்டாவது கூற்றுகளைக் குறிக்கலாம்; இன்னும் விரிவாக, பழைய மற்றும் புதிய உடன்படிக்கைகளைக் குறிக்கும் என்றும் புரிந்துகொள்ளப்படுகிறது.
    reason: மூல உரை இந்த இரு குறிப்புகளின் பொருளை வெளிப்படையாகப் பெயரிடவில்லை; உடனடி சூழலுக்கு ஏற்ற முதன்மை விளக்கத்தையும் முக்கிய மாற்றுப் புரிதல்களையும் உறுதிப்படுத்தாமல் பதிவு செய்கிறது.
lexical_decisions:
- source_word: τότε
  choice: பின்பு
  rationale: முந்தைய மேற்கோளின் தொடர்ச்சியாக வரும் காலமுறை/வாதமுறை இணைப்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: εἴρηκεν
  choice: கூறியிருக்கிறார்
  rationale: நிகழ்காலப் பொருத்தமுள்ள நிறைவு வினையின் வலிமையைத் தக்கவைக்கிறது; முன்பு கூறப்பட்ட வசனம் இன்னும் பொருந்துவதாக ஒலிக்கிறது.
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் வேதாகம நடையையும் அறிவிப்பின் வலியுறுத்தலையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἥκω
  choice: வந்திருக்கிறேன்
  rationale: வந்து தற்போது இருப்பதைக் குறிக்கும் கிரேக்க நிகழ்கால வடிவின் விளைவு நிலையைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: τοῦ ποιῆσαι
  choice: நிறைவேற்ற
  rationale: நோக்கத்தைக் குறிக்கும் வினையெச்சமாக இயல்பாக அமைகிறது; தேவனுடைய விருப்பத்தைச் செயலில் நிறைவேற்றும் பொருளையும் தருகிறது.
- source_word: τὸ θέλημά σου
  choice: உமது விருப்பத்தை
  rationale: θέλημα என்பதன் விருப்பம்/சித்தம் என்ற பொருளை நவீன பொதுத்தமிழில் தெளிவாக வழங்குகிறது; மரியாதை ஒருமையைப் பேணுகிறது.
- source_word: ἀναιρεῖ
  choice: நீக்குகிறார்
  rationale: முதலாவதை ஒதுக்குதல் அல்லது அகற்றுதல் என்ற சூழல்சார் பொருளை, ‘ஒழித்துவிடுகிறார்’ போன்ற அதிகமான விளக்கமின்றி வழங்குகிறது.
- source_word: τὸ πρῶτον
  choice: முதலாவதை
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் பெயரடையின் சுருக்கத்தையும், சூழலே அதன் குறிப்பை நிர்ணயிக்க விடும் தெளிவின்மையையும் காக்கிறது.
- source_word: ἵνα
  choice: நிலைநிறுத்துவதற்காக
  rationale: நோக்க உறவைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τὸ δεύτερον
  choice: இரண்டாவதை
  rationale: ‘முதலாவது’ என்பதற்கு இணையான சுருக்கமான எதிரிணையைப் பேணுகிறது; குறிப்பை உரையில் விரித்துரைக்கவில்லை.
- source_word: στήσῃ
  choice: நிலைநிறுத்த
  rationale: ஏற்படுத்தி செல்லுபடியாக நிலைக்கச் செய்தல் என்ற பொருளைச் சூழலுக்கு ஏற்ற கண்ணியமான தமிழில் தருகிறது.
theological_decisions:
- issue: ‘முதலாவது’, ‘இரண்டாவது’ என்பவற்றின் குறிப்பு
  choice: மூலத்தின் சுருக்கமான ‘முதலாவதை’ மற்றும் ‘இரண்டாவதை’ பிரதான உரையில் அப்படியே வைத்தல்
  alternative: முதலாவது பலிகளின் ஒழுங்கு என்றும் இரண்டாவது மெசியாவின் பலியில் நிறைவேறிய தேவனுடைய விருப்பம் என்றும் உரையிலேயே விரித்துக் கூறுதல்; அல்லது பழைய உடன்படிக்கை/புதிய உடன்படிக்கை என மொழிபெயர்த்தல்
  rationale: எபிரெயர் 10:8–10 பலிகளையும் தேவனுடைய விருப்பத்தைச் செய்வதையும் எதிரெதிராக வைக்கிறது. ஆயினும் கிரேக்க உரை குறிப்புகளை வெளிப்படையாகப் பெயரிடாததால், மொழிபெயர்ப்பு அந்தத் தத்துவ இறுக்கத்தையும் உண்மையான தெளிவின்மையையும் காக்கிறது.
- issue: ἀναιρεῖ மற்றும் στήσῃ ஆகியவற்றின் எழுவாய்
  choice: இரண்டிற்கும் ‘அவர்’ என்ற ஒரே மறைமுக எழுவாயைத் தமிழில் வெளிப்படுத்துதல்
  alternative: எழுவாயை தேவன் அல்லது கிறிஸ்து என்று பிரதான உரையிலேயே பெயரிடுதல்
  rationale: கிரேக்கத்தில் எழுவாய் வெளிப்படையாகப் பெயரிடப்படவில்லை. ‘அவர்’ என்பது வாக்கியத் தொடரைத் தெளிவாக்குவதோடு அடையாளத்தை அளவுக்கு மீறி தீர்மானிக்காது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ மேற்கோளின் உயர்ந்த அறிவிப்பு நடையைப் பேணுகிறது; ‘உமது’ தேவனை நோக்கிய மரியாதை ஒருமையை வழங்குகிறது. பிரதான உரை விளக்க விரிவாக்கத்தைத் தவிர்த்து, தேவையான சூழல்சார் விளக்கத்தை அடிக்குறிப்பில் தருகிறது.
