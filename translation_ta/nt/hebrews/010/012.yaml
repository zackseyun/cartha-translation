source:
  edition: SBLGNT
  text: ⸀οὗτος δὲ μίαν ὑπὲρ ἁμαρτιῶν προσενέγκας θυσίαν εἰς τὸ διηνεκὲς ἐκάθισεν ἐν δεξιᾷ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/012.yaml
  text: But this one[a], after offering one sacrifice for sins for all time, sat down at the right hand of God[b],
translation:
  language: ta
  text: ஆனால் இவரோ, பாவங்களுக்காக என்றும் நிலைத்திருக்கும் ஒரே பலியைச் செலுத்திவிட்டு[a], கடவுளின் வலப்பக்கத்தில் அமர்ந்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாவங்களுக்காக ஒரே பலியை என்றென்றைக்கும் செலுத்திவிட்டு.” கிரேக்கத்தில் “என்றென்றைக்கும்” என்ற சொற்றொடரைப் பலி செலுத்திய செயலுடன் இன்னும் நெருக்கமாக இணைத்துப் புரிந்துகொள்ளலாம்; அது அந்தப் பலியின் நிரந்தரச் செயல்திறனை வலியுறுத்துகிறது.
    reason: alternative_reading
  - marker: b
    text: “கடவுளின் வலப்பக்கத்தில்” என்பது சங்கீதம் 110:1-ஐ எதிரொலிக்கிறது; மேசியாவின் உயர்த்தப்படுதலை எடுத்துரைக்க எபிரெயர் நிருபத்தில் இது ஒரு முக்கிய மேற்கோள்.
    reason: cross_reference
lexical_decisions:
- source_word: οὗτος
  choice: இவரோ
  rationale: முந்தைய வசனத்தில் தினந்தோறும் நின்று பலியிடும் ஆசாரியர்களுடன் உள்ள வேறுபாட்டைச் சுட்டுப்பெயரும் ‘-ஓ’ வலியுறுத்தலும் இயல்பான தமிழில் வெளிப்படுத்துகின்றன.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய ஆசாரியர்களின் திரும்பத் திரும்பச் செய்யப்படும் பணிக்கும் இவருடைய ஒரே பலிக்கும் இடையிலான முரண்பாட்டைக் குறிக்கிறது.
- source_word: μίαν ... θυσίαν
  choice: ஒரே பலி
  rationale: கிறிஸ்துவின் பலி மீண்டும் மீண்டும் செலுத்தப்படாத ஒன்று என்பதை வலியுறுத்தும் கிரேக்க ஒருமையைப் பாதுகாக்கிறது.
- source_word: ὑπὲρ ἁμαρτιῶν
  choice: பாவங்களுக்காக
  rationale: பலியின் நோக்கத்தையும் பயனையும் இயல்பான தமிழில் தெரிவித்து, கிரேக்கப் பன்மையையும் காக்கிறது.
- source_word: προσενέγκας
  choice: செலுத்திவிட்டு
  rationale: முதன்மை வினையான ‘அமர்ந்தார்’ என்பதற்கு முன்னதாக பலி செலுத்தப்பட்டது என்ற இறந்தகாலப் பங்கேற்புவினையின் காலத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: εἰς τὸ διηνεκές
  choice: எல்லாக் காலத்திற்கும் உரிய
  rationale: ஒரே பலியின் நிலையான, தொடர்ந்த பலனை இயல்பான தமிழில் எடுத்துரைக்கிறது; சொற்றொடரின் இணைப்பு குறித்த உண்மையான தெளிவின்மை அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: ἐκάθισεν
  choice: அமர்ந்தார்
  rationale: முடிவுற்ற செயலை நேரடியாக வெளிப்படுத்தி, முந்தைய வசனத்தில் ஆசாரியர்கள் நிற்பதுடன் உள்ள வேறுபாட்டையும் காக்கிறது.
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: கடவுளின் வலப்பக்கத்தில்
  rationale: உயர்த்தப்பட்ட அதிகார நிலையைக் குறிக்கும் வழக்கமான வேதாகம மொழியைத் தெளிவாக வழங்கி, சங்கீதம் 110:1-ன் எதிரொலியையும் காக்கிறது.
theological_decisions:
- issue: εἰς τὸ διηνεκές என்ற சொற்றொடரின் இணைப்பு
  choice: ‘எல்லாக் காலத்திற்கும் உரிய ஒரே பலி’ என்று பலியின் நிலையான பயனுடன் முதன்மையாக இணைக்கப்பட்டது.
  alternative: ‘பாவங்களுக்காக ஒரே பலியை என்றென்றைக்கும் செலுத்திவிட்டு’ என்று பலி செலுத்தும் செயலுடன் நெருக்கமாக இணைக்கலாம்; அல்லது ‘என்றென்றைக்கும் கடவுளின் வலப்பக்கத்தில் அமர்ந்தார்’ என்று அமர்வுடன் இணைக்கலாம்.
  rationale: எபிரெயர் 10-ன் சூழலில் திரும்பத் திரும்பச் செலுத்தப்படும் லேவிய பலிகளுக்கு மாறாக ஒரே பலியின் நிரந்தரச் செயல்திறனே முதன்மையாக வலியுறுத்தப்படுகிறது. எனினும், கிரேக்கச் சொற்றொடரின் இலக்கண இணைப்பு முழுமையாக ஒரே விதத்தில் கட்டுப்படுத்தப்படாததால் மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἐκάθισεν என்பதன் இறையியல் உட்குறிப்பு
  choice: ‘அமர்ந்தார்’ என்று மட்டும் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘தம் பணியை முடித்து அமர்ந்தார்’ என்று விளக்கமாக மொழிபெயர்க்கலாம்.
  rationale: முடிவுற்ற ஆசாரியப் பணி என்பது சூழலிலிருந்து பெறப்படும் முக்கிய உட்குறிப்பாக இருந்தாலும், அந்த விளக்கத்தை வசனத்திற்குள் சேர்க்காமல் கிரேக்க வினையின் நேரடியான பொருள் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘இவரோ’ என்பது கிரேக்கச் சுட்டுப்பெயரின் வேறுபாட்டுச் சக்தியைச் சுருக்கமாகக் காக்கிறது. ‘பலியைச் செலுத்துதல்’ என்பது பலியியல் சூழலுக்கு இயல்பான தமிழ் வழக்கு. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
