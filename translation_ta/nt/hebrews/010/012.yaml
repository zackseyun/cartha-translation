revisions:
- from: ஆனால் இவரோ, பாவங்களுக்காக எல்லாக் காலத்திற்கும் உரிய ஒரே பலியைச் செலுத்திவிட்டு[a], கடவுளின் வலப்பக்கத்தில் அமர்ந்தார்[b].
  to: ஆனால் இவரோ, பாவங்களுக்காக என்றும் நிலைத்திருக்கும் ஒரே பலியைச் செலுத்திவிட்டு[a], கடவுளின் வலப்பக்கத்தில் அமர்ந்தார்[b].
  rationale: The revision replaces an idiomatically weak and potentially misleading rendering of εἰς τὸ διηνεκές with “என்றும் நிலைத்திருக்கும்,” which communicates the phrase’s enduring force in the argument of Hebrews 10. The alternative syntactic attachment is retained in footnote a. No other changes are required.
