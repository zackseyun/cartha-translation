review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the contrast (οὗτος δέ), the single sacrifice for sins, the antecedent offering, and the enthronement at God’s right hand. However, “எல்லாக் காலத்திற்கும் உரிய ஒரே பலி” can mean a sacrifice that belongs to every age, rather than a sacrifice whose efficacy endures. The revision makes the enduring force explicit without adding a doctrinal conclusion beyond the phrase’s contextual sense.
  naturalness: “எல்லாக் காலத்திற்கும் உரிய” is somewhat unnatural and semantically imprecise in this Tamil construction. “என்றும் நிலைத்திருக்கும்” is idiomatic modern standard Tamil and reads smoothly with “ஒரே பலி.”
  terminology: “இவரோ,” “பாவங்களுக்காக,” “ஒரே பலி,” “பலியைச் செலுத்திவிட்டு,” and “கடவுளின் வலப்பக்கத்தில் அமர்ந்தார்” are appropriate, dignified, and consistent with biblical Tamil register. The Psalm 110:1 cross-reference remains suitable.
  issues:
  - severity: medium
    issue: The phrase “எல்லாக் காலத்திற்கும் உரிய ஒரே பலி” is ambiguous in an unhelpful way.
    rationale: It may describe what the sacrifice is ‘for’ or what it ‘belongs to,’ rather than expressing εἰς τὸ διηνεκές as the enduring validity/effect of the one sacrifice. A clearer Tamil expression is needed while retaining the source phrase’s scope as far as possible.
  revised_text: ஆனால் இவரோ, பாவங்களுக்காக என்றும் நிலைத்திருக்கும் ஒரே பலியைச் செலுத்திவிட்டு[a], கடவுளின் வலப்பக்கத்தில் அமர்ந்தார்[b].
