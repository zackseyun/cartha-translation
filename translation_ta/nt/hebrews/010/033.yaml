  text: τοῦτο μὲν ὀνειδισμοῖς τε καὶ θλίψεσιν θεατριζόμενοι, τοῦτο δὲ κοινωνοὶ τῶν οὕτως ἀναστρεφομένων γενηθέντες·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/033.yaml
  text: sometimes being publicly exposed to insults and afflictions[b][a], and at other times becoming partners with those who were treated that way.
translation:
  language: ta
  text: ஒருபுறம், இகழ்ச்சிகளாலும் துன்பங்களாலும் பொதுமக்கள் முன் காட்சிப்பொருளாக்கப்பட்டீர்கள்[a]; மறுபுறம், அவ்வாறு நடத்தப்பட்டவர்களோடு இணைந்து நின்றீர்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் உயிரோட்டமாக, “பொதுமக்கள் முன் வேடிக்கைப் பொருளாக்கப்பட்டீர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அவ்வாறு வாழ்ந்தவர்களோடு” அல்லது “அவ்வாறு நடந்துகொண்டவர்களோடு இணைந்து நின்றீர்கள்” என்றும் பொருள் கொள்ள வாய்ப்புள்ளது; எனினும் இங்குள்ள துன்புறுத்தல் சூழல், “அவ்வாறு நடத்தப்பட்டவர்களோடு” என்பதையே ஆதரிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο μὲν ... τοῦτο δὲ
  choice: சில நேரங்களில் ... வேறு சில நேரங்களில்
  rationale: இரண்டு விதமான அனுபவங்களை இணைத்துக் காட்டும் கிரேக்க இணை அமைப்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὀνειδισμοῖς
  choice: பழிச்சொற்கள்
  rationale: வாய்மொழியான இகழ்ச்சி, நிந்தை, அவமானப்படுத்துதல் ஆகிய பொருள்களைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: θλίψεσιν
  choice: துன்பங்கள்
  rationale: துன்புறுத்தலின் சூழலில் ஏற்பட்ட நெருக்கடிகளையும் வேதனைகளையும் மிகக் குறுகலாக வரையறுக்காமல் வெளிப்படுத்துகிறது.
- source_word: θεατριζόμενοι
  choice: பொதுமக்கள் முன் காட்சிப்பொருளாக்கப்பட்டீர்கள்
  rationale: அரங்கில் காட்டப்படுவது போன்ற பொதுவெளி அவமானத்தின் உயிரோட்டமான உருவகத்தைத் தமிழில் பாதுகாக்கிறது.
- source_word: κοινωνοὶ
  choice: பங்காளிகள்
  rationale: வெறும் தோழமையை அல்லாமல், பிறருடைய துன்ப அனுபவத்தில் இணைந்து பங்குகொண்ட ஒற்றுமையைச் சுட்டுகிறது.
- source_word: τῶν οὕτως ἀναστρεφομένων
  choice: அவ்வாறு நடத்தப்பட்டவர்களுடன்
  rationale: உடனடி துன்புறுத்தல் சூழலுக்கும் முந்தைய இணை உறுப்புக்கும் ஏற்ற வகையில், அவர்கள் அதேபோல் நடத்தப்பட்டார்கள் என்ற பொருளை முதன்மைப்படுத்துகிறது; வாழ்க்கை நடத்தையைக் குறிக்கும் வாய்ப்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: γενηθέντες
  choice: பங்காளிகளானீர்கள்
  rationale: அவர்களுடன் பங்குபெறும் நிலைக்கு வந்ததை இயல்பான தமிழ் வினை வடிவில் தெரிவிக்கிறது.
theological_decisions:
- issue: ἀναστρεφομένων என்பதன் சூழல்சார் பொருள்
  choice: அவ்வாறு நடத்தப்பட்டவர்கள்
  alternative: அவ்வாறு வாழ்ந்தவர்கள் அல்லது நடந்துகொண்டவர்கள்
  rationale: உடனடி சூழல் பழிச்சொல், துன்பம், துன்புறுத்தப்பட்டவர்களுடனான ஒருமைப்பாடு ஆகியவற்றைப் பற்றியது. ஆகவே நடத்தப்பட்டவர்கள் என்பது சூழலுக்கு ஏற்ற முதன்மை வாசிப்பு; எனினும் கிரேக்கச் சொல்லின் வாழ்க்கை நடத்தை சார்ந்த சாத்தியம் அடிக்குறிப்பில் விடப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிதான நடை பயன்படுத்தப்பட்டுள்ளது. θεατριζόμενοι என்பதிலுள்ள பொதுக் காட்சியும் அவமானமும் மங்காதபடி “பொதுமக்கள் முன் காட்சிப்பொருளாக்கப்பட்டீர்கள்” என மொழிபெயர்க்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
