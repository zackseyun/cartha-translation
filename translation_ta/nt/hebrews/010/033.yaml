revisions:
- from: சில நேரங்களில் நீங்கள் பழிச்சொற்களுக்கும் துன்பங்களுக்கும் ஆளாக்கப்பட்டு, பொதுமக்கள் முன் காட்சிப்பொருளாக்கப்பட்டீர்கள்[a]; வேறு சில நேரங்களில், அவ்வாறு நடத்தப்பட்டவர்களுடன் பங்காளிகளானீர்கள்[b].
  to: ஒருபுறம், இகழ்ச்சிகளாலும் துன்பங்களாலும் பொதுமக்கள் முன் காட்சிப்பொருளாக்கப்பட்டீர்கள்[a]; மறுபுறம், அவ்வாறு நடத்தப்பட்டவர்களோடு இணைந்து நின்றீர்கள்[b].
  rationale: The revision follows the Greek correlative structure more closely, improves modern Tamil idiom, and retains the public humiliation and solidarity central to the verse. It does not resolve the lexical ambiguity of ἀναστρεφομένων beyond the contextual preference; the viable conduct-oriented reading remains in the footnote. Footnote markers are present and correctly anchored in the revised text.
