id: HEB.4.12
reference: Hebrews 4:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ζῶν γὰρ ὁ λόγος τοῦ θεοῦ καὶ ἐνεργὴς καὶ τομώτερος ὑπὲρ πᾶσαν μάχαιραν δίστομον καὶ διϊκνούμενος ἄχρι μερισμοῦ ψυχῆς ⸀καὶ πνεύματος, ἁρμῶν τε καὶ μυελῶν, καὶ κριτικὸς ἐνθυμήσεων καὶ ἐννοιῶν καρδίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/012.yaml
  text: For the word of God is living and active[a], and sharper than any double-edged sword, piercing to the division of soul and spirit, of joints and marrow[c][b], and able to judge the thoughts and intentions of the heart.
translation:
  language: ta
  text: 'எபிரெயர் 4:12


    ஏனெனில், கடவுளின் வார்த்தை உயிருள்ளது, செயலாற்றுகிறது; இருபுறமும் கூர்மையான எந்த வாளையும்விடக் கூர்மையானது. அது ஆன்மாவையும் ஆவியையும், மூட்டுகளையும் மஜ்ஜையையும் பிரிக்கும் அளவுக்கு ஊடுருவிச் செல்கிறது[a]; இதயத்தின் சிந்தனைகளையும் நோக்கங்களையும் ஆராய்ந்து மதிப்பிட வல்லது[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆன்மாவையும் ஆவியையும்’ என்ற சொற்றொடர், மனிதன் எத்தனை தனித்தனி கூறுகளால் ஆனவன் என்பதைக் கட்டாயமாக வரையறுப்பதில்லை. கடவுளின் வார்த்தை உள்ளார்ந்த வாழ்வின் மிக ஆழத்திற்கும் எட்டுவதை இவ்வுருவகம் வலியுறுத்துகிறது.
    reason: theological_ambiguity
  - marker: b
    text: அல்லது, ‘இதயத்தின் சிந்தனைகளையும் நோக்கங்களையும் பகுத்தறிகிறது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ζῶν
  choice: உயிருள்ளது
  rationale: வார்த்தை தொடர்ந்து உயிரோடு இருப்பதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; வெறும் ‘உயிர்ப்புள்ளது’ என்ற வலிமை சார்ந்த விளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான காரணத்தை இவ்வசனம் தரும் இணைப்பை வெளிப்படையாகக் காட்டுகிறது.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: கடவுளின் வார்த்தை
  rationale: கடவுளுடைய உரை, செய்தி, வாக்கு ஆகிய பொருள் விரிவைத் தக்கவைத்து, இதை வேதாகமம் மட்டுமாகவோ தனிப்பட்ட லோகோஸாகவோ குறுக்கவில்லை.
- source_word: ἐνεργὴς
  choice: செயலாற்றுகிறது
  rationale: வார்த்தை செயலில் இருப்பதை இயல்பாகத் தெரிவிக்கிறது; ‘வல்லமையுள்ளது’ என்று பொருளை விரிவாக்குவதையும் ‘பயனளிக்கிறது’ என்று முடிவை முன்கூட்டியே நிர்ணயிப்பதையும் தவிர்க்கிறது.
- source_word: τομώτερος ὑπὲρ πᾶσαν μάχαιραν δίστομον
  choice: இருபுறமும் கூர்மையான எந்த வாளையும்விடக் கூர்மையானது
  rationale: ஒப்பீட்டையும் இரு முனைகளில் அல்ல, இரு பக்கங்களிலும் வெட்டும் வாள் என்ற உருவகத்தையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: διϊκνούμενος
  choice: ஊடுருவிச் செல்கிறது
  rationale: ஆழமாகச் சென்று எட்டும் தொடர்ச்சியான இயக்கத்தைத் தெரிவிக்கிறது; வாள் உருவகத்திற்கும் பொருந்துகிறது.
- source_word: ἄχρι μερισμοῦ
  choice: பிரிக்கும் அளவுக்கு
  rationale: ἄχρι குறிக்கும் எட்டும் எல்லையையும் μερισμός குறிக்கும் பிரித்தலையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: ψυχῆς καὶ πνεύματος
  choice: ஆன்மாவையும் ஆவியையும்
  rationale: இரு சொற்களையும் வேறுபடுத்திப் பாதுகாக்கிறது; ஆனால் மனித இயல்பின் கூறுகள் பற்றிய ஒரு குறிப்பிட்ட கோட்பாட்டை மொழிபெயர்ப்பிலேயே நிறுவவில்லை.
- source_word: ἁρμῶν τε καὶ μυελῶν
  choice: மூட்டுகளையும் மஜ்ஜையையும்
  rationale: உடலின் ஆழமான பகுதிகளைச் சுட்டும் இணையான உருவகத்தை நேரடியாகவும் புரிந்துகொள்ளத்தக்க வகையிலும் தருகிறது.
- source_word: κριτικὸς
  choice: ஆராய்ந்து மதிப்பிட வல்லது
  rationale: உள்ளார்ந்தவற்றை வேறுபடுத்தி மதிப்பிடும் திறனை வெளிப்படுத்துகிறது; ‘நியாயந்தீர்க்கிறது’ என்ற தேவையற்ற இறுதித் தீர்ப்பு நிழற்பொருளைத் தவிர்க்கிறது.
- source_word: ἐνθυμήσεων
  choice: சிந்தனைகள்
  rationale: உள்ளத்தில் எழும் எண்ணங்களையும் மன ஆராய்ச்சிகளையும் உள்ளடக்கும் இயல்பான பொதுச்சொல்.
- source_word: ἐννοιῶν
  choice: நோக்கங்கள்
  rationale: முந்தைய ‘சிந்தனைகள்’ என்பதிலிருந்து வேறுபட்டு, உள்ளார்ந்த எண்ணப்போக்கு, திட்டம், உள்நோக்கம் ஆகியவற்றைச் சுட்டுகிறது.
theological_decisions:
- issue: ‘கடவுளின் வார்த்தை’ என்பதன் குறிப்பு
  choice: கிரேக்கத்தின் பொதுவான சொல்லாட்சியைப் பாதுகாத்து, ‘கடவுளின் வார்த்தை’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: வேதாகமம்; கடவுளின் உரைக்கப்பட்ட வாக்குறுதி அல்லது தீர்ப்பு; குமாரனாகிய தனிப்பட்ட வார்த்தை
  rationale: உடனடிச் சூழல் கடவுள் பேசுவதையும் அவரது வார்த்தையின் செயல்திறனையும் வலியுறுத்துகிறது; ஆயினும் இவ்விடத்தில் எந்த ஒரு குறிப்பையும் மட்டும் உரை வெளிப்படையாக நிர்ணயிக்கவில்லை.
- issue: ‘ஆன்மாவையும் ஆவியையும்’ என்பதன் மனித இயல்பு சார்ந்த உட்கருத்து
  choice: இரு சொற்களும் அப்படியே வேறுபடுத்தப்பட்டன; அவை மனிதனின் பிரிக்கத்தக்க தொழில்நுட்பக் கூறுகள் என்று மொழிபெயர்ப்பு வற்புறுத்தவில்லை.
  alternative: மனிதன் இரண்டு அல்லது மூன்று தனித்தனி கூறுகளால் ஆனவன் என்பதற்கான தொழில்நுட்ப விளக்கம்; அல்லது ஆழ்ந்த உள்ளார்ந்த வாழ்வைக் குறிக்கும் முற்றிலும் சொல்லாட்சியான இணை
  rationale: வசனத்தின் முதன்மை உருவகம் கடவுளின் வார்த்தை எவ்வளவு ஆழமாக ஊடுருவி மதிப்பிடுகிறது என்பதே. சொற்களைப் பாதுகாப்பது அவற்றின் இறையியல் இழுவைத் தக்கவைக்கிறது; அடிக்குறிப்பு அளவுக்கு மீறிய கோட்பாட்டு முடிவைத் தடுக்கிறது.
- issue: κριτικός என்பதன் தீர்ப்பளிக்கும் நிழற்பொருள்
  choice: ‘ஆராய்ந்து மதிப்பிட வல்லது’ என்று திறனையும் மதிப்பீட்டையும் வெளிப்படுத்தப்பட்டது.
  alternative: பகுத்தறிகிறது; தீர்ப்பளிக்கிறது; நியாயந்தீர்க்கிறது
  rationale: இந்தப் பெயரடை ஆராய்ந்து தீர்மானிக்கும் ஆற்றலைக் குறிக்கிறது. ‘நியாயந்தீர்க்கிறது’ என்பது இறுதித் தீர்ப்பு சார்ந்த பொருளை தேவையின்றி அதிகரிக்கலாம்; ‘பகுத்தறிகிறது’ மட்டும் மதிப்பீட்டின் வலிமையைச் சற்றுக் குறைக்கலாம்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் வடிவமைக்கப்பட்டது. குறுகிய முதன்மை வாக்கியங்கள் ‘உயிருள்ளது, செயலாற்றுகிறது’ என்ற கிரேக்க இணைப்பின் வேகத்தைத் தக்கவைக்கின்றன. ‘ஆன்மா’, ‘ஆவி’, ‘மஜ்ஜை’ போன்ற நிலைபெற்ற சொற்கள் மூல உருவகத்தையும் இறையியல் தெளிவின்மையையும் பாதுகாக்கப் பயன்படுத்தப்பட்டன.
