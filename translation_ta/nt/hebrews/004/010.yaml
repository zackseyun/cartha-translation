  text: For the one who has entered his rest has himself also rested from his works[b][a], just as God did from his own.
translation:
  language: ta
  text: ஏனெனில், அவருடைய இளைப்பாறுதலுக்குள் நுழைந்தவர், கடவுள் தம்முடைய சொந்த செயல்களிலிருந்து இளைப்பாறியதுபோல, தாமும் தமது செயல்களிலிருந்து இளைப்பாறினார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: அல்லது, “தமது செயல்களை நிறுத்தினார்.” இங்கே வரும் கிரேக்க வினைச்சொல், இந்தப் பகுதியில் ‘இளைப்பாறுதல்’ என்று மொழிபெயர்க்கப்பட்ட சொல்லுடன் ஒரே சொல்வேரைச் சேர்ந்தது; ஆகவே முதன்மை உரையில் அந்த மீளுரை காக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... εἰσελθὼν
  choice: நுழைந்தவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் இறந்தகாலப் பங்கேற்புவினை, நுழைந்து முடித்த ஒருவரை பொதுமை ஒருமையில் குறிக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத்தையும் ஆதாரத்தையும் அறிமுகப்படுத்தும் இணைப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: κατάπαυσιν
  choice: இளைப்பாறுதல்
  rationale: எபிரெயர் 3–4 முழுவதும் தொடரும் முக்கியச் சொல்லையும், கடவுளின் ஓய்வுடனான தொடர்பையும் காக்கிறது.
- source_word: αὐτοῦ
  choice: அவருடைய
  rationale: சூழலில் இது பெரும்பாலும் கடவுளைக் குறித்தாலும், கிரேக்கத்தில் உள்ள சுட்டுப்பெயரின் வெளிப்படையான தெளிவின்மையை முதன்மை உரையில் காக்கிறது.
- source_word: καὶ αὐτὸς
  choice: தாமும்
  rationale: καί என்பதன் ‘உம்’ பொருளையும் αὐτός தரும் வலியுறுத்தலையும் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: κατέπαυσεν
  choice: இளைப்பாறினார்
  rationale: κατάπαυσις என்பதுடன் உள்ள ஒரே சொல்வேர்ச் சார்ந்த மீளுரையைத் தமிழிலும் காக்கிறது; ‘செய்வதை நிறுத்தினார்’ என்பதும் பொருள்சாத்தியம்.
- source_word: ἀπὸ τῶν ἔργων αὐτοῦ
  choice: தமது செயல்களிலிருந்து
  rationale: ἔργα என்பதன் பரந்த ‘செயல்கள்’ பொருளைக் காத்து, அவை அந்த நபருக்குரியவை என்பதைத் தற்சுட்டுப்பெயரால் தெரிவிக்கிறது.
- source_word: ὥσπερ
  choice: எப்படியோ ... அதுபோல
  rationale: நுழைந்தவரின் இளைப்பாறுதலையும் கடவுளின் இளைப்பாறுதலையும் தெளிவாக ஒப்பிடுகிறது; வாக்கியத்தில் இயல்பாக ‘இளைப்பாறியதுபோல’ என அமைக்கப்பட்டுள்ளது.
- source_word: τῶν ἰδίων
  choice: தம்முடைய செயல்களிலிருந்து
  rationale: கிரேக்கத்தில் விடுபட்டுள்ள ‘செயல்கள்’ என்பதைத் தமிழின் தெளிவுக்காக நிரப்பி, ἰδίων என்பதன் ‘சொந்த’ வலியுறுத்தலை ‘தம்முடைய’ என வெளிப்படுத்துகிறது.
- source_word: ὁ θεός
  choice: கடவுள்
  rationale: நவீன பொதுத் தமிழில் θεός என்பதற்கான இயல்பான, மதிப்புமிக்க பொதுப் பெயர்.
theological_decisions:
- issue: αὐτοῦ என்பதன் சுட்டுப்பொருள்—‘அவருடைய இளைப்பாறுதல்’ யாருடையது?
  choice: சூழலின்படி கடவுளுடைய இளைப்பாறுதல் என்று புரிந்துகொள்ளப்படுகிறது; முதன்மை உரையில் ‘அவருடைய’ என வைக்கப்பட்டுள்ளது.
  alternative: நுழைந்த நபருடைய சொந்த இளைப்பாறுதல்.
  rationale: எபிரெயர் 3–4-இல் மீண்டும் மீண்டும் பேசப்படுவது கடவுளுடைய இளைப்பாறுதல்; மேலும், கடவுள் தமது செயல்களிலிருந்து இளைப்பாறியதுடனான ஒப்பீடும் இதை ஆதரிக்கிறது. எனினும், கிரேக்கச் சுட்டுப்பெயரை ‘கடவுளுடைய’ என்று வெளிப்படையாக மாற்றாமல் அதன் மொழியியல் தெளிவின்மை காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இளைப்பாறுதல்/இளைப்பாறினார்’ என்ற மீளுரை மூலத்தின் சொல்விளையாட்டையும் பகுதியின் மையக் கருத்தையும் காக்கிறது. மனிதரைப் பொதுமை ஒருமையில் மரியாதையுடன் குறிக்க ‘நுழைந்தவர்’, ‘தாமும்’, ‘தமது’ பயன்படுத்தப்பட்டுள்ளன.
