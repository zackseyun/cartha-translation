source:
  edition: SBLGNT
  text: καὶ γάρ ἐσμεν εὐηγγελισμένοι καθάπερ κἀκεῖνοι, ἀλλ’ οὐκ ὠφέλησεν ὁ λόγος τῆς ἀκοῆς ἐκείνους, μὴ ⸀συγκεκερασμένους τῇ πίστει τοῖς ἀκούσασιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/002.yaml
  text: For indeed[a], we also have had good news proclaimed to us, just as they did; but the message they heard did not benefit them[b], because it was not united by faith with those who heard.
translation:
  language: ta
  text: ஏனெனில், அவர்களைப் போலவே நமக்கும் நற்செய்தி அறிவிக்கப்பட்டிருக்கிறது. ஆனால் அவர்கள் கேட்ட செய்தி அவர்களுக்குப் பயனளிக்கவில்லை; ஏனென்றால், கேட்டவர்களோடு அவர்கள் விசுவாசத்தால் ஒன்றிணைக்கப்படவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு ஓர் உரைமாறுபாட்டையும் பாரம்பரிய மொழிபெயர்ப்பையும் பின்பற்றினால்: “ஏனென்றால், அவர்கள் கேட்ட செய்தி, கேட்டவர்களிடத்தில் விசுவாசத்துடன் கலக்கப்படவில்லை.”'
    reason: textual_variant
lexical_decisions:
- source_word: εὐηγγελισμένοι
  choice: நமக்கும் நற்செய்தி அறிவிக்கப்பட்டிருக்கிறது
  rationale: ἐσμεν என்பதுடன் சேர்ந்த நிறைநிலைச் செயப்பாட்டு வடிவத்தின், முன்பு அறிவிக்கப்பட்ட செய்தி இப்போதும் தொடர்புடையது என்ற பொருளைப் பேணுகிறது; வனாந்தரத் தலைமுறைக்கும் நற்செய்தி அறிவிக்கப்பட்டது என்ற ஒப்பீட்டை தேவையின்றி தொழில்நுட்பச் சொல்லாக்கமாக்கவில்லை.
- source_word: καθάπερ κἀκεῖνοι
  choice: அவர்களைப் போலவே
  rationale: இப்போதைய கேட்போரும் முன் குறிப்பிடப்பட்ட வனாந்தரத் தலைமுறையினரும் இறைச்செய்தியைப் பெற்றதில் ஒப்பானவர்கள் என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ὁ λόγος τῆς ἀκοῆς
  choice: அவர்கள் கேட்ட செய்தி
  rationale: சொல்லுக்குச் சொல் மொழிபெயர்க்கும்போது இயல்பில்லாத இவ்வமைப்பில், λόγος-ஐ அறிவிக்கப்பட்ட செய்தியாகவும் ἀκοή-ஐ கேட்டதாகவும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ὠφέλησεν
  choice: பயனளிக்கவில்லை
  rationale: அந்தச் செய்தி அவர்களுக்கு நன்மையையோ ஆன்மீகப் பயனையோ உண்டாக்கவில்லை என்ற கருத்தை இயல்பாகப் பேணுகிறது.
- source_word: συγκεκερασμένους
  choice: ஒன்றிணைக்கப்படவில்லை
  rationale: கலத்தல் அல்லது இணைத்தல் என்ற உருவகத்தை, இங்கு மனிதர்கள் விசுவாசத்தால் மற்ற கேட்போருடன் சேர்க்கப்படாத நிலையாக வாசிக்கத்தக்க வகையில் தெரிவிக்கிறது.
- source_word: πίστει
  choice: விசுவாசத்தால்
  rationale: இச்சூழலில் கேட்ட செய்திக்கான நம்பிக்கையான பதிலைச் சுட்டும் πίστις என்பதற்கு வழக்கமான வேதாகமத் தமிழ்ச் சொல்லைப் பயன்படுத்தி, தத்துவ விளக்கத்தைச் சேர்க்காமல் கருவிப் பொருளையும் பேணுகிறது.
- source_word: τοῖς ἀκούσασιν
  choice: கேட்டவர்களோடு
  rationale: ἀκούω என்பதன் அடிப்படைப் பொருளை நேரடியாகப் பேணுகிறது; அவர்கள் எவ்வாறு கேட்டார்கள் என்பதை மொழிபெயர்ப்பிலேயே கூடுதலாகத் தீர்மானிக்கவில்லை.
theological_decisions:
- issue: πίστις என்பதன் பொருள்
  choice: விசுவாசம்
  alternative: நம்பிக்கை; உண்மைத்தன்மை
  rationale: கேட்டல் மற்றும் விசுவாசப் பதில் ஆகியவற்றின் முரண்பாடே சூழலுக்கு ஏற்றது. ‘விசுவாசம்’ என்பதனால் எந்தச் சமயப் பிரிவின் தனிப்பட்ட கோட்பாடும் சேர்க்கப்படவில்லை.
- issue: இறுதிக் கூற்றின் உரை மற்றும் இலக்கணத் தொடர்பு
  choice: SBLGNT-இன் συγκεκερασμένους என்ற ஆண்பால் பன்மை வேற்றுமை வடிவத்தைப் பின்பற்றி, ‘அவர்கள்’ கேட்டவர்களோடு விசுவாசத்தால் ஒன்றிணைக்கப்படவில்லை
  alternative: ‘கேட்ட செய்தி, கேட்டவர்களிடத்தில் விசுவாசத்துடன் கலக்கப்படவில்லை’ என்ற பாரம்பரிய வாசிப்பு
  rationale: வழங்கப்பட்ட மூல உரையில் participle, ἐκείνους (‘அவர்களை’) என்பதோடு இயல்பாக ஒத்திசைகிறது. வேறு நன்கு அறியப்பட்ட உரைமாறுபாடு செய்தியை விசுவாசத்துடன் கலக்கப்பட்டதாக வாசிக்க ஆதரவளிப்பதால் அது அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நற்செய்தி அறிவிக்கப்பட்டிருக்கிறது’ என்பது நிறைநிலைச் செயப்பாட்டின் தொடரும் பொருத்தத்தைப் பேணுகிறது. SBLGNT மூல உரையின் கடினமான இறுதிக் கூற்று பிரதான உரையில் வலுக்கட்டாயமாக எளிமைப்படுத்தப்படாமல், முக்கிய உரைமாறுபாடு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
