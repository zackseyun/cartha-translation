revisions:
- from: யோசுவா[a] அவர்களுக்கு இளைப்பாறுதலைக் கொடுத்திருந்தால், அதன் பிறகு அவர் வேறொரு நாளைக் குறித்துப் பேசியிருக்க மாட்டார்.
  to: ஏனெனில், யோசுவா[a] அவர்களுக்கு இளைப்பாறுதலை அளித்திருந்தால், அதற்குப் பின்னர் தேவன் வேறொரு நாளைக் குறித்துப் பேசியிருக்க மாட்டார்.
