id: HEB.4.8
reference: Hebrews 4:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ γὰρ αὐτοὺς Ἰησοῦς κατέπαυσεν, οὐκ ἂν περὶ ἄλλης ἐλάλει μετὰ ταῦτα ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/008.yaml
  text: For if Joshua had given them rest[a], he would not have spoken later about another day.
translation:
  language: ta
  text: ஏனெனில், யோசுவா[a] அவர்களுக்கு இளைப்பாறுதலை அளித்திருந்தால், அதற்குப் பின்னர் தேவன் வேறொரு நாளைக் குறித்துப் பேசியிருக்க மாட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'கிரேக்கப் பெயர்வடிவம்: “இயேசு.” Ἰησοῦς என்ற பெயர்வடிவம் இயேசுவையோ யோசுவாவையோ குறிக்கலாம்; இங்கு சூழல் நூனின் மகன் யோசுவாவைக் குறிக்கிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰησοῦς
  choice: யோசுவா
  rationale: கிரேக்கப் பெயர்வடிவம் இயேசுவையோ யோசுவாவையோ குறிக்கக்கூடும். ஆனால் இங்கு, இஸ்ரவேலர் நாட்டிற்குள் நுழைந்த வரலாற்றையும் பின்னர் சங்கீதம் 95-ல் கூறப்பட்ட இளைப்பாறுதலையும் ஒப்பிடும் சூழல் நூனின் மகன் யோசுவாவைக் குறிக்கிறது.
- source_word: κατέπαυσεν
  choice: இளைப்பாறுதலைக் கொடுத்திருந்தால்
  rationale: καταπαύω என்பது ஓயச் செய்வது அல்லது இளைப்பாறுதல் அளிப்பது எனும் காரணவினைப் பொருளைக் கொண்டது. இங்கு αὐτούς என்பவர்களுக்கு இளைப்பாறுதல் அளித்தல் என்ற கருத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὐκ ἂν ... ἐλάλει
  choice: பேசியிருக்க மாட்டார்
  rationale: οὐκ ἂν என்பதுடன் வரும் இறந்தகால ἐλάλει, நிகழாத நிபந்தனையின் கடந்தகால விளைவைச் சுட்டுகிறது; தமிழ் எதிர்மறை நிபந்தனை அமைப்பில் இதை இயல்பாகத் தருகிறது.
- source_word: περὶ ἄλλης ... ἡμέρας
  choice: வேறொரு நாளைக் குறித்து
  rationale: முன்னர் குறிப்பிடப்பட்ட நாளிலிருந்து வேறான, பின்னரும் முன்வைக்கப்படும் இளைப்பாறுதலின் நாளைச் சுட்டுகிறது.
- source_word: μετὰ ταῦτα
  choice: அதன் பிறகு
  rationale: யோசுவாவின் காலத்திற்குப் பின்பு நிகழ்ந்த காலத் தொடர்ச்சியை நேரடியாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: γὰρ
  choice: —ஆதலால் விளக்கத் தொடர்பாக வாக்கிய அமைப்பில் வெளிப்படுத்தப்பட்டது
  rationale: γάρ முந்தைய கூற்றுக்கு ஆதார விளக்கம் தருகிறது. தமிழில் தனியே ‘ஏனெனில்’ சேர்ப்பதைவிட நிபந்தனை வாக்கியத்தின் தொடர்ச்சி சூழலில் தெளிவாக இருப்பதால் இயல்பான இணைப்பாக விடப்பட்டுள்ளது.
theological_decisions:
- issue: எபிரெயர் 4:8-ல் Ἰησοῦς என்பதன் குறிப்பு
  choice: நூனின் மகன் யோசுவா
  alternative: இயேசு
  rationale: இந்தப் பகுதியின் வாதம் யோசுவாவின் தலைமையில் இஸ்ரவேலர் நாட்டிற்குள் நுழைந்ததையும், அதற்குப் பின்னர் அறிவிக்கப்பட்ட இளைப்பாறுதலின் நாளையும் பற்றியது. ஆகவே மூல கிரேக்கப் பெயரின் வடிவ ஒற்றுமையை அடிக்குறிப்பில் பாதுகாத்தபடி, சூழலுக்குரிய நபரை முதன்மை உரையில் ‘யோசுவா’ எனத் தருவது பொருத்தம்.
- issue: ἐλάλει வினையின் மறைமுக எழுவாய்
  choice: அவர்
  alternative: தேவன்
  rationale: கிரேக்க உரையில் எழுவாய் வெளிப்படையாகப் பெயரிடப்படவில்லை. ‘தேவன்’ என்று சேர்ப்பது சூழலுக்கு ஏற்ற விளக்கமாக இருந்தாலும், மூலத்தின் மறைமுகத்தன்மையைப் பாதுகாக்க ‘அவர்’ என மொழிபெயர்க்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘இளைப்பாறுதல்’ என்பது எபிரெயர் 3–4 அதிகாரங்களின் மையச் சொல்லோட்டத்தைத் தொடர்கிறது. மூலத்தில் வெளிப்படையாக இல்லாத ‘தேவன்’ என்ற எழுவாய் சேர்க்கப்படாமல், ‘அவர்’ எனும் மறைமுகம் பாதுகாக்கப்பட்டது.
