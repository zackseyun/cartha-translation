source:
  edition: SBLGNT
  text: καὶ ἐν τούτῳ πάλιν· Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/005.yaml
  text: 'And in this place again: ‘They shall certainly not enter my rest.’[a]'
translation:
  language: ta
  text: 'மேலும், அந்த வேதப்பகுதியில் மீண்டும் இவ்வாறு கூறப்பட்டுள்ளது: “அவர்கள் என் இளைப்பாறுதலுக்குள் நிச்சயமாக நுழையமாட்டார்கள்.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் சொல்லுக்குச் சொல், “அவர்கள் என் இளைப்பாறுதலுக்குள் நுழைந்தால்” என்று உள்ளது; இது “அவர்கள் என் இளைப்பாறுதலுக்குள் நிச்சயமாக நுழையமாட்டார்கள்” என்று பொருள்படும் ஒரு சத்திய உறுதிமொழிச் சூத்திரம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: வேறோர் இடத்தில்
  rationale: இங்கு ἐν τούτῳ என்பது வேதவசனத்தில் மேற்கோள் காட்டப்படும் மற்றோர் இடத்தைக் குறிக்கிறது. தமிழில் மேற்கோள் தொடரை இயல்பாக வெளிப்படுத்த ‘வேறோர் இடத்தில்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: வேதவசனத்திலிருந்து மறுபடியும் மேற்கோள் காட்டப்படுவதையோ அதற்கு மீண்டும் முறையிடுவதையோ இது குறிக்கிறது.
- source_word: Εἰ εἰσελεύσονται
  choice: அவர்கள் நிச்சயமாக நுழையமாட்டார்கள்
  rationale: சொல்லுக்குச் சொல் பார்த்தால் இது ‘அவர்கள் நுழைந்தால்’ என்ற நிபந்தனை வடிவில் உள்ளது. ஆனால் சங்கீத மேற்கோளில் பிரதிபலிக்கும் எபிரேய ஆணைச் சூத்திரத்தின்படி, εἰ + எதிர்கால வினை வலியுறுத்தப்பட்ட மறுப்பாகச் செயல்படுகிறது.
- source_word: κατάπαυσίν
  choice: இளைப்பாறுதல்
  rationale: எபிரெயர் 3–4 அதிகாரங்களில் இது கடவுளுடைய ‘இளைப்பாறுதல்’ என்பதைக் குறிக்கும் முக்கியச் சொல். அதே கருத்துத் தொடரைத் தெளிவாகக் காக்கும் இயல்பான தமிழ் சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: μου
  choice: என்
  rationale: சங்கீத மேற்கோளில் கடவுள் நேரடியாகப் பேசுவதையும் அது அவருக்குரிய இளைப்பாறுதல் என்பதையும் உரியவாறு காக்கிறது.
theological_decisions:
- issue: ஆணைச் சூத்திரமாக அமைந்த Εἰ εἰσελεύσονται என்பதன் மொழிபெயர்ப்பு
  choice: அவர்கள் என் இளைப்பாறுதலுக்குள் நிச்சயமாக நுழையமாட்டார்கள்
  alternative: அவர்கள் என் இளைப்பாறுதலுக்குள் நுழைந்தால்
  rationale: கிரேக்கத்தில் நிபந்தனை வடிவம் இருந்தாலும், இங்கு அது எபிரேய ஆணை மரபிலிருந்து வந்த வலியுறுத்தப்பட்ட மறுப்பாகச் செயல்படுகிறது. ஆகவே வெறும் இலக்கண வடிவத்தை அல்லாமல் அதன் சூழல்சார் பொருளை மொழிபெயர்ப்பது, எந்தக் கூடுதல் கோட்பாட்டையும் புகுத்தாமல் மேற்கோளின் வலிமையைக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேத மேற்கோளுக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘இளைப்பாறுதல்’ என்ற சொல் எபிரெயர் 3–4 அதிகாரங்களின் கருத்துத் தொடரைக் காக்கிறது.
