revisions:
- from: 'மேலும், வேறோர் இடத்தில் மீண்டும் இவ்வாறு கூறப்பட்டுள்ளது: “அவர்கள் என் இளைப்பாறுதலுக்குள் நிச்சயமாக நுழையமாட்டார்கள்.”[a]'
  to: 'மேலும், அந்த வேதப்பகுதியில் மீண்டும் இவ்வாறு கூறப்பட்டுள்ளது: “அவர்கள் என் இளைப்பாறுதலுக்குள் நிச்சயமாக நுழையமாட்டார்கள்.”[a]'
  rationale: The revision removes the unwarranted ‘other place’ implication, while retaining the source’s repeated-citation signal. It also corrects the footnote’s technical description of the Semitic oath formula, without altering its meaning or theological force.
