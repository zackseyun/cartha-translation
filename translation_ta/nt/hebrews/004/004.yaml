source:
  edition: SBLGNT
  text: εἴρηκεν γάρ που περὶ τῆς ἑβδόμης οὕτως· Καὶ κατέπαυσεν ὁ θεὸς ἐν τῇ ἡμέρᾳ τῇ ἑβδόμῃ ἀπὸ πάντων τῶν ἔργων αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/004.yaml
  text: 'For he has spoken somewhere about the seventh day in this way: “And God rested on the seventh day from all his works,”[a][b]'
translation:
  language: ta
  text: 'ஏனெனில், ஏழாம் நாளைப் பற்றி ஓரிடத்தில் அவர் இவ்வாறு கூறியிருக்கிறார்: “மேலும், தேவன் ஏழாம் நாளில் தமது செயல்கள் அனைத்திலிருந்தும் ஓய்ந்தார்.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு குறிப்பிட்ட இடத்தில்.” கிரேக்கத்தில் “ஓரிடத்தில்” என்று உள்ளது. இது வேதமேற்கோள் அமைந்த இடத்தைத் திட்டவட்டமாகக் குறிப்பிடாத அறிமுகமே தவிர, அதன் அதிகாரத்தைப் பற்றிய ஐயத்தைக் குறிக்கவில்லை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “செய்வதை நிறுத்தினார்.” இவ்வினைச்சொல் வேலையை நிறுத்துவதை வலியுறுத்தலாம். இங்கு ஆதியாகமம் 2:2 உடனான தொடர்பையும் எபிரெயர் 3–4-இல் தேவனுடைய ஓய்வைப் பற்றிய வாதத்தையும் காக்க “ஓய்ந்தார்” என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκεν
  choice: கூறியிருக்கிறார்
  rationale: நிகழ்காலத்திலும் பொருந்தும் முந்தைய கூற்றைச் சுட்டும் கிரேக்க நிறைவுக்காலத்தின் வலிமையை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: முந்தைய வாதத்திற்கான ஆதாரத்தையும் விளக்கத்தையும் அறிமுகப்படுத்துகிறது.
- source_word: που
  choice: ஓரிடத்தில்
  rationale: வேதமேற்கோளின் இடத்தைத் திட்டவட்டமாகக் குறிப்பிடாத அறிமுகத்தை இயல்பாக வெளிப்படுத்துகிறது; அதன் அதிகாரத்தைப் பற்றிய ஐயத்தைக் குறிக்காது.
- source_word: περὶ τῆς ἑβδόμης
  choice: ஏழாம் நாளைப்பற்றி
  rationale: சூழலில் மறைந்துள்ள ‘நாள்’ என்பதைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: οὕτως
  choice: இவ்வாறு
  rationale: தொடர்ந்து வரும் மேற்கோளின் சொற்களை அறிமுகப்படுத்தும் சுட்டுப் பொருளைக் காக்கிறது.
- source_word: Καὶ
  choice: (தமிழில் தனியாக மொழிபெயர்க்கப்படவில்லை)
  rationale: மேற்கோளின் தொடக்கத்தில் உள்ள καί கிரேக்கத்திலும் எபிரெய மேற்கோள் மரபிலும் தொடரிணைப்பாக உள்ளது; தனித்த வசனமாக இயல்பாக வாசிக்கப்படும் தமிழில் ‘மேலும்’ எனச் சேர்ப்பது தேவையற்றதாகவும் செயற்கையாகவும் இருக்கும்.
- source_word: κατέπαυσεν
  choice: ஓய்ந்தார்
  rationale: ஆதியாகமம் 2:2 உடனான தொடர்பையும் எபிரெயர் 3–4 அதிகாரங்களின் ‘ஓய்வு’ வாதத்தையும் காக்கிறது; வேலை செய்வதை நிறுத்தினார் என்ற நுணுக்கத்தையும் சூழல் தாங்குகிறது.
- source_word: ὁ θεὸς
  choice: தேவன்
  rationale: இறைவனைச் சுட்டும் நேரடியான எழுவாய்; உயர்வானதும் தமிழ்க் கிறிஸ்தவ வேதாகம நடையில் பரவலாகப் புரிந்துகொள்ளப்படுவதுமான வடிவம்.
- source_word: ἐν τῇ ἡμέρᾳ τῇ ἑβδόμῃ
  choice: ஏழாம் நாளில்
  rationale: நாட்களுடன் தமிழில் இயல்பாகப் பயன்படும் இடவேற்றுமையைப் பயன்படுத்துகிறது.
- source_word: ἀπὸ πάντων τῶν ἔργων αὐτοῦ
  choice: தமது செயல்கள் அனைத்திலிருந்தும்
  rationale: ἔργων என்பதன் பன்மையையும் ἀπό குறிக்கும் விலகல் அல்லது நிறுத்தத்தையும் காக்கிறது; ‘தமது’ என்பது எழுவாயாகிய தேவனையே திரும்பச் சுட்டுகிறது.
theological_decisions:
- issue: தேவனுடைய ஏழாம் நாள் நிறுத்தத்தை எபிரெயரின் ஓய்வு இறையியலுடன் இணைத்தல்
  choice: ஓய்ந்தார்
  alternative: செய்வதை நிறுத்தினார்
  rationale: இவ்வசனம் ஆதியாகமம் 2:2-ஐ மேற்கோள் காட்டி, எபிரெயர் 3–4-இல் தேவனுடைய ஓய்வைப் பற்றிய வாதத்தின் பகுதியாக உள்ளது. ‘ஓய்ந்தார்’ அந்தச் சொல்லியல் மற்றும் வேதப்பகுதி தொடர்பைக் காக்கிறது; அது தேவன் களைப்படைந்தார் என்று அவசியமாகக் குறிக்காது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘கூறியிருக்கிறார்’ என்பது கிரேக்க நிறைவுக்காலத்தின் இன்றும் நிலைக்கும் பொருத்தத்தை வெளிப்படுத்துகிறது. ‘தேவன்’, ‘தமது’, ‘ஓய்ந்தார்’ ஆகியவை உயர்வானதாய் இருந்தாலும் சாதாரண வாசகர்களுக்குப் புரியும் சொற்கள். இரு அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
