source:
  edition: SBLGNT
  text: εἰσερχόμεθα γὰρ ⸀εἰς κατάπαυσιν οἱ πιστεύσαντες, καθὼς εἴρηκεν· Ὡς ὤμοσα ἐν τῇ ὀργῇ μου, Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου, καίτοι τῶν ἔργων ἀπὸ καταβολῆς κόσμου γενηθέντων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/003.yaml
  text: For we who have believed enter the rest[a], just as he has said, “As I swore in my wrath[b], ‘If they shall enter my rest,’” although his works were finished from the foundation of the world.
translation:
  language: ta
  text: 'விசுவாசித்தவர்களாகிய நாம் அந்த இளைப்பாறுதலுக்குள் நுழைகிறோம்; அவர் சொல்லியிருப்பதுபோல,


    “என் கடுங்கோபத்தில் நான் ஆணையிட்டேன்:

    ‘அவர்கள் என் இளைப்பாறுதலுக்குள் நுழைவார்களானால்—’[a]”


    உலகம் படைக்கப்பட்டதிலிருந்து அவருடைய செயல்கள் நிறைவடைந்திருந்தபோதிலும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இது ஆணையிடும்போது பயன்படுத்தப்படும் சொற்றொடர். கிரேக்கத்தில் சொல்லுக்குச் சொல், “அவர்கள் என் இளைப்பாறுதலுக்குள் நுழைவார்களானால்” என்று உள்ளது; இதன் பொருள், “அவர்கள் நிச்சயமாக என் இளைப்பாறுதலுக்குள் நுழையமாட்டார்கள்” அல்லது “ஒருபோதும் நுழையமாட்டார்கள்” என்பதாகும்.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσερχόμεθα
  choice: நுழைகிறோம்
  rationale: நிகழ்கால வினை வடிவத்தை இயல்பான தமிழ் நிகழ்காலத்தில் தருகிறது; விசுவாசிகள் இப்போது இளைப்பாறுதலுக்குள் நுழைகிறார்கள் என்ற கருத்தைத் தக்கவைத்து, அதை எதிர்காலத்துக்கு மட்டும் கட்டுப்படுத்தவில்லை.
- source_word: κατάπαυσιν
  choice: அந்த இளைப்பாறுதல்
  rationale: முன்னுள்ள உரையாடலில் ஏற்கெனவே குறிப்பிடப்பட்டுள்ள தேவனுடைய குறிப்பிட்ட இளைப்பாறுதலைச் சுட்டுவதால் ‘அந்த’ சேர்க்கப்பட்டது.
- source_word: οἱ πιστεύσαντες
  choice: விசுவாசித்தவர்களாகிய நாம்
  rationale: இறந்தகாலப் பங்கேற்புச் சொல்லையும் முதலாம் நபர் பன்மையின் தன்னுட்சேர்க்கையையும் காக்கிறது.
- source_word: καθὼς εἴρηκεν
  choice: அவர் சொல்லியிருப்பதுபோல
  rationale: εἴρηκεν என்பதின் நிறைவுற்ற நிலையையும் தொடர்ந்து நிலைக்கும் அதிகாரத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Ὡς ὤμοσα ἐν τῇ ὀργῇ μου
  choice: என் கடுங்கோபத்தில் நான் ஆணையிட்டபடி
  rationale: ὀργή என்பதிலுள்ள தீவிரமான நீதித்தீர்ப்புச் சாயலை ‘கடுங்கோபம்’ வெளிப்படுத்துகிறது; ὡς என்பதையும் ‘ஆணையிட்டபடி’ எனப் பிரதிபலிக்கிறது.
- source_word: Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου
  choice: அவர்கள் என் இளைப்பாறுதலுக்குள் நுழைவார்களானால்—
  rationale: கிரேக்கத்தில் உள்ள நிபந்தனை வடிவிலான செமித்திய ஆணைச் சூத்திரத்தை முதன்மை உரையில் அப்படியே தக்கவைத்து, அதன் வலியுறுத்தப்பட்ட எதிர்மறைப் பொருளை அடிக்குறிப்பில் விளக்குகிறது.
- source_word: καίτοι
  choice: ஆனாலும்
  rationale: முன்வரும் ஆணைக்கும் படைப்புச் செயல்கள் ஏற்கெனவே நிறைவடைந்திருந்ததற்கும் இடையிலான விட்டுக்கொடுப்பு/மாறுபாட்டை இயல்பாகக் காட்டுகிறது.
- source_word: τῶν ἔργων ... γενηθέντων
  choice: அவருடைய செயல்கள் நிறைவடைந்திருந்தன
  rationale: மரபணு முழுமை அமைப்பின் முன்னரே முடிந்த நிலையைத் தமிழின் நிறைவுற்ற இறந்தகாலம் தெளிவாகக் காட்டுகிறது; சூழலின்படி செயல்கள் தேவனுடையவை.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: உலகம் படைக்கப்பட்டதிலிருந்து
  rationale: உலகத்தின் அடித்தளம் இடப்படுதல் என்ற கிரேக்க மரபுத்தொடரின் பொருளை சாதாரண வாசகருக்குத் தெளிவான நவீன தமிழில் வழங்குகிறது.
theological_decisions:
- issue: சங்கீதம் 95-இலிருந்து மேற்கோள் காட்டப்பட்ட ஆணையின் வலிமை
  choice: முதன்மை உரையில் ‘நுழைவார்களானால்—’ என்ற நிறைவுறாத நிபந்தனை ஆணைச் சூத்திரத்தைப் பாதுகாத்தல்
  alternative: ‘அவர்கள் ஒருபோதும் என் இளைப்பாறுதலுக்குள் நுழையமாட்டார்கள்’ என்று அதன் பொருளை நேரடியாக மொழிபெயர்த்தல்
  rationale: εἰ + எதிர்கால வினை என்ற கிரேக்க வடிவம் எபிரெய ஆணைச் சூத்திரத்தைப் பிரதிபலிக்கிறது. அதன் உண்மையான பொருள் உறுதியான மறுப்பு என்றாலும், மூலத்தின் சொற்பண்பையும் பதற்றத்தையும் முதன்மை உரையில் காத்து, வாசகர் தவறாகப் புரிந்துகொள்ளாதபடி அடிக்குறிப்பில் பொருளைத் தெளிவுபடுத்துகிறது.
- issue: விசுவாசிகள் இளைப்பாறுதலுக்குள் நுழையும் காலநிலை
  choice: ‘நுழைகிறோம்’ என்ற நிகழ்காலம்
  alternative: ‘நுழைவோம்’ அல்லது ‘நுழைந்துகொண்டிருக்கிறோம்’
  rationale: கிரேக்க நிகழ்காலத்தைப் பாதுகாத்து, தற்போதைய பங்குபற்றுதலையும் எதிர்கால நிறைவேற்றத்தை மறுக்காத ஏற்கெனவே/இன்னும் இல்லை என்ற பதற்றத்தையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் விதத்தில் கண்ணியமான வேதாகம நடையைப் பேணுகிறது. ‘இளைப்பாறுதல்’ என்பது சூழலின் முக்கியச் சொல்லாக ஒரேவிதமாக வைக்கப்பட்டுள்ளது. மேற்கோளின் ஆணைச் சூத்திரத்தில் உள்ள உண்மையான இலக்கணத் தெளிவின்மையும் அதன் வலியுறுத்தப்பட்ட மறுப்புப் பொருளும் முறையே முதன்மை உரை மற்றும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
