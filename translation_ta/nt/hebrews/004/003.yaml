  terminology: ‘இளைப்பாறுதல்’ κατάπαυσις என்பதற்குச் சூழலுக்கு ஏற்ற, தொடர்ந்து பயன்படுத்தத்தக்க சொல். ‘கடுங்கோபம்’ ὀργή-யின் நீதித்தீர்ப்பு வலிமையை ஏற்றவாறு தருகிறது. ஆணைச் சூத்திரத்தின் வெளிப்படையான நிபந்தனை வடிவம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, அதன் வலியுறுத்தப்பட்ட மறுப்புப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
