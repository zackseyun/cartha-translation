  source_fidelity: 'முக்கியக் கருத்தும் வினைக்காலமும் சரியாக உள்ளன: விசுவாசித்த நாம் இளைப்பாறுதலுக்குள் நிகழ்காலத்தில் நுழைகிறோம்; படைப்பிலிருந்து தேவனுடைய செயல்கள் நிறைவுற்றிருந்தன. ஆனால் மேற்கோளின் தொடக்கமான Ὡς ὤμοσα என்பதன் நேரடி அறிவிப்புத் தன்மையை ‘ஆணையிட்டபடி’ முழுமையாகத் தரவில்லை. ‘நான் ஆணையிட்டேன்’ என்பது மூலத்திற்கு நெருக்கமானதும் தமிழில் தெளிவானதும் ஆகும்.'
