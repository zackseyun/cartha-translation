source:
  edition: SBLGNT
  text: σπουδάσωμεν οὖν εἰσελθεῖν εἰς ἐκείνην τὴν κατάπαυσιν, ἵνα μὴ ἐν τῷ αὐτῷ τις ὑποδείγματι πέσῃ τῆς ἀπειθείας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/011.yaml
  text: Therefore[a], let us make every effort to enter that rest, so that no one may fall by the same pattern of disobedience.
translation:
  language: ta
  text: ஆகவே, அந்த இளைப்பாறுதலுக்குள் நுழைய நாம் எல்லா முயற்சியும் எடுப்போமாக; கீழ்ப்படியாமையின் அதே மாதிரியில் யாரும் விழாதபடி[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம்பிக்கையின்மையின் அதே மாதிரியில்.” வனாந்தரத் தலைமுறையினர் தேவனை நம்ப மறுத்ததை முன்னிட்டு இவ்வாறு புரிந்துகொள்ளலாம்; ஆனால் கிரேக்கச் சொல் இன்னும் நேரடியாக “கீழ்ப்படியாமை” என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπουδάσωμεν
  choice: நாம் முழு முயற்சி செய்வோமாக
  rationale: ஊக்குவிக்கும் பொருளில் வரும் aorist subjunctive; ஆர்வம், அக்கறை, விடாமுயற்சி ஆகிய வலிமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய பகுதியில் தேவனுடைய இளைப்பாறுதலும் இஸ்ரவேலரின் தோல்வியும் பற்றிய வாதத்திலிருந்து வரும் முடிவைத் தெளிவாகக் குறிக்கிறது.
- source_word: εἰσελθεῖν
  choice: நுழைய
  rationale: σπουδάσωμεν என்பதுடன் இணைந்து நோக்கத்தை வெளிப்படுத்தும் infinitive-ஐ நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: ἐκείνην τὴν κατάπαυσιν
  choice: அந்த இளைப்பாறுதலுக்குள்
  rationale: முன்னர் விவாதிக்கப்பட்ட, தேவன் வாக்களித்த இளைப்பாறுதலைச் சுட்டும் demonstrative வலிமையைப் பேணுகிறது; அதன் தன்மையை தேவையின்றி மேலும் வரையறுக்கவில்லை.
- source_word: ἵνα μὴ
  choice: யாரும் ... விழுந்துவிடாதபடி
  rationale: எதிர்மறையான நோக்கம் அல்லது விளைவைக் காட்டும் அமைப்பை இயல்பான தமிழில் எச்சரிக்கைத் தொனியுடன் தருகிறது.
- source_word: ἐν τῷ αὐτῷ ... ὑποδείγματι
  choice: அதே ... மாதிரியைப் பின்பற்றி
  rationale: வனாந்தரத் தலைமுறையின் எச்சரிக்கை தரும் முன்னுதாரணத்தைச் சுட்டுகிறது. ἐν என்பதன் சூழல்/கருவி நுணுக்கத்தைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘பின்பற்றி’ என விரித்துரைக்கப்பட்டுள்ளது.
- source_word: πέσῃ
  choice: விழுந்துவிடாதபடி
  rationale: ἵνα μή என்பதற்குப் பின் வரும் எச்சரிக்கைப் பொருளுடைய aorist subjunctive-ன் தீவிரத்தைத் தக்கவைக்கிறது.
- source_word: τῆς ἀπειθείας
  choice: கீழ்ப்படியாமையின்
  rationale: சொல்லின் நேரடியான பொருள் ‘கீழ்ப்படியாமை’; நம்பாமையுடன் உள்ள சூழல்சார் தொடர்பை முதன்மை உரையிலேயே ஒன்றாக்காமல் பேணுகிறது.
theological_decisions:
- issue: வனாந்தரத் தலைமுறையின் தோல்வியோடு ἀπείθεια கொண்டுள்ள உறவு
  choice: முதன்மை உரையில் ‘கீழ்ப்படியாமை’ என்று மொழிபெயர்த்து, ‘நம்பிக்கையின்மை’ என்பதை அடிக்குறிப்பில் சூழல்சார் மாற்றாகக் குறிப்பிடுதல்
  alternative: நம்பிக்கையின்மை
  rationale: எபிரெயர் நிருபம் நம்பாமையையும் கீழ்ப்படியாமையையும் நெருக்கமாக இணைக்கிறது; இருப்பினும் இங்குள்ள ἀπείθεια என்பதன் நேரடியான சொற்பொருள் ‘கீழ்ப்படியாமை.’ இவ்வாறு மொழிபெயர்ப்பது அவற்றுக்கிடையிலான இறையியல் நெருக்கத்தை அழிக்காமலும் இரண்டையும் ஒரே கருத்தாகச் சுருக்காமலும் இருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான ஊக்குவிப்பு மற்றும் எச்சரிக்கைத் தொனி பயன்படுத்தப்பட்டுள்ளது. ‘இளைப்பாறுதல்’ என்பது இப்பகுதியின் முக்கியச் சொல்லைத் தொடர்ச்சியாகப் பேணுகிறது.
