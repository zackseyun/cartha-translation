  source_fidelity: மூலத்தின் முக்கியக் கூறுகளான காரண/முடிவுத் தொடர்பு, ‘வானங்கள்’ என்ற பன்மை, இயேசுவின் தேவகுமாரன் என்ற பட்டம், மற்றும் ஊக்குவிப்பு வடிவம் ஆகியவை வரைவில் நன்றாகக் காக்கப்பட்டுள்ளன. ஆனால் τῆς ὁμολογίας என்பது ‘நம்பிக்கை’ அல்ல; அது சமூகத்தின் அறிக்கை/ஒப்பறிக்கை. ‘நாம் அறிக்கையிடும் நம்பிக்கை’ என்பது விளக்கமாக இருந்தாலும், மூலத்தின் பெயர்ச்சொல்லை நம்பிக்கையாக மாற்றி அதன் பொது ஒப்பறிக்கை நுணுக்கத்தை மங்கலாக்குகிறது.
  naturalness: திருத்திய வாசகம் நவீனத் தரத் தமிழில் இயல்பாகவும், கண்ணியமான வேதாகம நடையுடனும் உள்ளது. ‘தேவனுடைய மகனான இயேசு’ என்ற அமைப்பு அடையாளப் பட்டத்தைத் தெளிவாக இணைக்கிறது; ‘நமது அறிக்கையை உறுதியாகப் பற்றிக்கொள்வோமாக’ என்பது இயல்பான கூட்டுத் தூண்டுதலாக அமைகிறது.
  terminology: ‘மாபெரும் தலைமை ஆசாரியர்’, ‘தேவனுடைய மகன்’, ‘வானங்கள்’, ‘உறுதியாகப் பற்றிக்கொள்வோமாக’ ஆகியவை பொருத்தமானவை. ὁμολογίαக்கு ‘நமது அறிக்கை’ என்பது ‘நம்பிக்கை’ என்பதைக் காட்டிலும் துல்லியமானது; இங்கு அது உள்ளார்ந்த நம்பிக்கையை மட்டும் அல்ல, வெளிப்படையாக ஏற்றுக்கொள்ளப்படும் ஒப்பறிக்கையையும் குறிக்கிறது.
