id: HEB.4.14
reference: Hebrews 4:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἔχοντες οὖν ἀρχιερέα μέγαν διεληλυθότα τοὺς οὐρανούς, Ἰησοῦν τὸν υἱὸν τοῦ θεοῦ, κρατῶμεν τῆς ὁμολογίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/014.yaml
  text: Therefore[a], since we have a great high priest who has passed through the heavens—Jesus the Son of God—let us hold fast to our confession.
translation:
  language: ta
  text: ஆகவே, வானங்களைக் கடந்து சென்றவரான தேவனுடைய மகன் இயேசு என்ற மாபெரும் தலைமை ஆசாரியர் நமக்கு இருப்பதால், நமது அறிக்கையை உறுதியாகப் பற்றிக்கொள்வோமாக.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔχοντες
  choice: நமக்கு இருப்பதால்
  rationale: இந்தப் பங்கேற்புவினை அடுத்து வரும் ஊக்குவிப்புக்கான அடிப்படையைத் தருகிறது. தமிழில் காரணத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய வாதத்திலிருந்து வரும் முடிவையும் ஊக்குவிப்பையும் தெளிவாக இணைக்கிறது.
- source_word: ἀρχιερέα μέγαν
  choice: மாபெரும் தலைமை ஆசாரியர்
  rationale: இயேசுவின் உயர்ந்த ஆசாரியப் பணியை வலியுறுத்தும் பெயர்–பெயரடை அமைப்பை dignified, natural Tamil-ல் தருகிறது.
- source_word: διεληλυθότα τοὺς οὐρανούς
  choice: வானங்களைக் கடந்து சென்றவரும்
  rationale: διέρχομαι என்பதன் கடந்து செல்லுதல் என்ற படிமத்தையும், οὐρανούς என்பதன் பன்மையையும், நிறைவேறிய செயலின் தொடரும் முக்கியத்துவத்தையும் இயன்றவரை காக்கிறது.
- source_word: Ἰησοῦν τὸν υἱὸν τοῦ θεοῦ
  choice: தேவனுடைய மகனுமான இயேசு
  rationale: தனிப்பெயரையும் கிறிஸ்துவியல் பட்டத்தையும் வெளிப்படையாகத் தக்கவைத்து, தமிழில் இயல்பான அடையாள விளக்கமாக அமைக்கிறது.
- source_word: κρατῶμεν
  choice: உறுதியாகப் பற்றிக்கொள்வோமாக
  rationale: தொடர்ந்து நிலைத்திருக்க அழைக்கும் hortatory subjunctive-இன் வலிமையை இயல்பான கூட்டு ஊக்குவிப்பாக வெளிப்படுத்துகிறது.
- source_word: τῆς ὁμολογίας
  choice: நாம் அறிக்கையிடும் நம்பிக்கையை
  rationale: ὁμολογία என்பது விசுவாசச் சமூகத்தின் வெளிப்படையான ஒப்பறிக்கையைச் சுட்டுகிறது. வெறும் உள்ளார்ந்த நம்பிக்கையாகக் குறுக்காமல், தமிழில் பொருளைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: υἱὸς τοῦ θεοῦ என்ற கிறிஸ்துவியல் பட்டத்தை மொழிபெயர்த்தல்
  choice: தேவனுடைய மகன்
  alternative: தேவமகன்
  rationale: மூலத்தின் உறவுசார் அமைப்பையும் வெளிப்படையான பட்டத்தின் நிறையையும் காக்கிறது; கூட்டுச்சொல் தரக்கூடிய கூடுதல் மரபுவழி நிழற்பொருளைத் தவிர்க்கிறது.
- issue: τοὺς οὐρανούς என்ற பன்மையைப் பாதுகாத்தல்
  choice: வானங்கள்
  alternative: வானம்
  rationale: மூலத்தில் உள்ள பன்மையையும் விண்ணுலகப் பயணப் படிமத்தையும் காக்கிறது; அதேவேளை குறிப்பிட்ட ஒரு முறைப்படுத்தப்பட்ட அண்டவியலை உரையில் சேர்க்கவில்லை.
- issue: ὁμολογία என்பதன் சமூக மற்றும் பொது தன்மை
  choice: நாம் அறிக்கையிடும் நம்பிக்கை
  alternative: நமது அறிக்கை
  rationale: இது விசுவாசத்தின் வெளிப்படையான ஒப்பறிக்கை என்பதை வாசகருக்கு தெளிவாக்குகிறது; அறிக்கை என்ற சொல் மட்டும் தரக்கூடிய நிர்வாக ஆவணப் பொருளைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வழிபாட்டு உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘வானங்கள்’ என்ற பன்மை நேரடியாக முதன்மை உரையில் பாதுகாக்கப்பட்டதால் அடிக்குறிப்பு தேவையில்லை.
