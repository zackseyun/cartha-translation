reference: Hebrews 4:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: προσερχώμεθα οὖν μετὰ παρρησίας τῷ θρόνῳ τῆς χάριτος, ἵνα λάβωμεν ἔλεος καὶ χάριν εὕρωμεν εἰς εὔκαιρον βοήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/016.yaml
  text: Therefore[a], let us approach the throne of grace with boldness[b], so that we may receive mercy and find grace for timely help.
translation:
  language: ta
  text: ஆகையால், இரக்கத்தைப் பெறவும், ஏற்ற நேரத்தில் உதவிக்காக[b] அருளைக் கண்டடையவும், நாம் அருளின் அரியணையைத் துணிவுடன்[a] அணுகுவோமாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நம்பிக்கையுடன்.’ கிரேக்கச் சொல் நம்பிக்கையையும், பேசுவதிலோ அணுகுவதிலோ உள்ள துணிவையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தேவைப்படும் நேரத்தில் உதவிக்காக.’ கிரேக்கச் சொற்றொடர் இன்னும் நேரடியாக, சரியான நேரத்தில் வரும் உதவியைச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσερχώμεθα
  choice: அணுகுவோமாக
  rationale: நிகழ்கால நடுநிலை வேண்டுகோள் வினையின் கூட்டான அறிவுறுத்தலை இயல்பான, கண்ணியமான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: οὖν
  choice: ஆகையால்
  rationale: இயேசுவின் தலைமைக் குருத்துவத்தைப் பற்றிய முந்தைய கருத்திலிருந்து வரும் முடிவுறுத்தும் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: μετὰ παρρησίας
  choice: துணிவுடன்
  rationale: παρρησία குறிக்கும் தடையற்ற வெளிப்படைத்தன்மை, நம்பிக்கை, துணிவு ஆகியவற்றில் வலிமையான அணுகுதலின் நுணுக்கத்தைப் பாதுகாக்கிறது; இது அகந்தையையோ மரியாதையின்மையையோ குறிக்கவில்லை.
- source_word: τῷ θρόνῳ τῆς χάριτος
  choice: அருளின் அரியணையை
  rationale: மூலத்தின் உருபுத்தொடரையும் அரியணை உருவகத்தையும் மிகையாக விளக்காமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἵνα
  choice: பெற்றுக்கொள்ளவும்… கண்டடையவும்
  rationale: அணுகுவதன் நோக்கத்தைத் தமிழில் இணை வினை அமைப்பால் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: λάβωμεν ἔλεος
  choice: நாம் இரக்கத்தைப் பெற்றுக்கொள்ளவும்
  rationale: λαμβάνω என்பதன் ‘பெறுதல்’ பொருளையும் ἔλεος என்பதன் வழக்கமான ‘இரக்கம்’ பொருளையும் தக்கவைக்கிறது.
- source_word: χάριν εὕρωμεν
  choice: அருளைக் கண்டடையவும்
  rationale: ‘இரக்கத்தைப் பெறுதல்’ என்பதிலிருந்து வேறுபட்ட ‘அருளைக் கண்டடைதல்’ என்ற மூலச் சொல் அமைப்பைப் பாதுகாப்பதோடு χάρις என்பதன் இறையியல் செறிவையும் தக்கவைக்கிறது.
- source_word: εἰς εὔκαιρον βοήθειαν
  choice: உரிய நேரத்தில் உதவி கிடைக்கும்படி
  rationale: εὔκαιρος என்பதன் சரியான அல்லது ஏற்ற நேரம் என்ற வலியுறுத்தலை இயல்பான தமிழில் தருகிறது; தேவையுள்ள நிலையை மட்டும் முன்னிறுத்தாமல் உதவியின் காலத்தக்க தன்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: கடவுளை அணுகுவதில் παρρησία என்பதன் நுணுக்கம்
  choice: துணிவுடன்
  alternative: நம்பிக்கையுடன்
  rationale: இயேசுவின் தலைமைக் குருத்துவத்தின் வழியாகக் கிடைக்கும் தடையற்ற அணுகுதலின் வலிமையை ‘துணிவுடன்’ தக்கவைக்கிறது; அதேவேளை அது முறையற்ற துணிச்சலைக் குறிக்கிறது என்று உரையில் சேர்க்கவில்லை.
- issue: χάρις என்பதன் மொழிபெயர்ப்பு
  choice: அருள்
  alternative: தயவு
  rationale: சூழலில் கடவுளுடைய கொடையைச் சுட்டும் முக்கியச் சொல்லின் இறையியல் நிறையையும் ‘அருளின் அரியணை’ என்பதுடனான சொல் தொடர்பையும் பாதுகாக்கிறது.
- issue: εἰς εὔκαιρον βοήθειαν என்பதன் காலத்தக்க தன்மை
  choice: உரிய நேரத்தில் உதவி கிடைக்கும்படி
  alternative: தேவையான நேரத்தில் உதவி பெறும்படி
  rationale: மூலம் முதன்மையாக உதவி ஏற்ற நேரத்தில் வருவதைச் சொல்கிறது. ‘தேவையான நேரம்’ என்பதும் சாத்தியமான பொருள்; ஆனால் அது பெறுபவரின் தேவைநிலையைச் சற்றுக் கூடுதலாக வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘அணுகுவோமாக’ என்ற வடிவம் கூட்டான அறிவுறுத்தலைத் தெளிவாகவும் வழிபாட்டு மரியாதையுடனும் தருகிறது. அடிக்குறி குறியீடுகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்பே வைக்கப்பட்டுள்ளன.
