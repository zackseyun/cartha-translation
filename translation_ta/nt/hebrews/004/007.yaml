id: HEB.4.7
reference: Hebrews 4:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πάλιν τινὰ ὁρίζει ἡμέραν, Σήμερον, ἐν Δαυὶδ λέγων μετὰ τοσοῦτον χρόνον, καθὼς ⸀προείρηται, Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε, μὴ σκληρύνητε τὰς καρδίας ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/007.yaml
  text: 'Again he appoints a certain day[a], “Today,” saying through David after so long a time, just as has been said before: “Today, if you hear his voice, do not harden your hearts.”'
translation:
  language: ta
  text: 'மீண்டும் அவர் ஒரு குறிப்பிட்ட நாளை, “இன்று” என்று நிர்ணயிக்கிறார்; இவ்வளவு நீண்ட காலத்திற்குப் பிறகு, தாவீதின் வாயிலாகக் கூறுகிறார்: முன்பே சொல்லப்பட்டுள்ளபடி,


    “இன்று நீங்கள் அவருடைய குரலைக் கேட்டால்,

    உங்கள் இதயங்களைக் கடினப்படுத்தாதீர்கள்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν
  choice: மீண்டும்
  rationale: முந்தைய கருத்தைத் தொடர்ந்து, கடவுள் ஒரு நாளை மறுபடியும் குறிப்பிடுவதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τινὰ ἡμέραν
  choice: ஒரு குறிப்பிட்ட நாளை
  rationale: τις என்பது எந்த நாள் என்று உடனே சொல்லப்படாவிட்டாலும், குறிப்பான ஒரு நாளைக் குறிக்கிறது; ‘குறிப்பிட்ட’ என்பது அந்த நுட்பத்தைத் தக்கவைக்கிறது.
- source_word: ὁρίζει
  choice: நிர்ணயிக்கிறார்
  rationale: அதிகாரபூர்வமாக ஒரு நாளை வரையறுத்து நியமிக்கும் பொருளைத் தருகிறது; தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: Σήμερον
  choice: “இன்று”
  rationale: சங்கீத மேற்கோளில் பெயரிடப்பட்ட நாளாகவும், தற்போதைய மறுமொழிக்கான அழைப்பாகவும் உள்ள சொல்லின் வலிமையை மேற்கோள் குறிகளுடன் தக்கவைக்கிறது.
- source_word: ἐν Δαυὶδ λέγων
  choice: தாவீதின் வாயிலாக அவர் கூறுவது
  rationale: கடவுள் தாவீதின் வழியாகப் பேசுகிறார் என்ற இடைமுகப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; சங்கீதத்தின் ஆசிரியத்துவம் குறித்து மூலவாக்கியத்தைவிட அதிகமாகத் தீர்மானிக்கவில்லை.
- source_word: μετὰ τοσοῦτον χρόνον
  choice: இவ்வளவு நீண்ட காலத்திற்குப் பிறகு
  rationale: வனாந்தரத் தலைமுறைக்குப் பின் ஏற்பட்ட நீண்ட கால இடைவெளியை வலியுறுத்துகிறது.
- source_word: καθὼς προείρηται
  choice: முன்பு சொல்லப்பட்டுள்ளபடியே
  rationale: முன்னரே கூறப்பட்டு இப்போதும் பொருத்தமுடையதாக இருக்கும் கருத்தை இறந்தகால வினையெச்ச வடிவில் தக்கவைக்கிறது.
- source_word: ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε
  choice: நீங்கள் அவருடைய குரலைக் கேட்டால்
  rationale: நிபந்தனையையும் ‘குரலைக் கேட்பது’ என்ற வேதாகம உருவகத்தையும் காக்கிறது; அதை விளக்கமாக ‘கீழ்ப்படிந்தால்’ என்று மாற்றவில்லை.
- source_word: μὴ σκληρύνητε τὰς καρδίας ὑμῶν
  choice: உங்கள் இதயங்களைக் கடினப்படுத்தாதீர்கள்
  rationale: மனவுறுதியான எதிர்ப்புக்கு எதிரான தடையை, உள்ளார்ந்த மனிதனைச் சுட்டும் ‘இதயம்’ என்ற மூல உருவகத்துடன் நேரடியாகத் தருகிறது.
theological_decisions:
- issue: கடவுளுடைய இளைப்பாறுதலைப் பற்றிய வாதத்தில் ‘இன்று’ என்பதன் வலிமை
  choice: பதிலளிப்பதற்காகக் கடவுள் நிர்ணயிக்கும் தற்போதைய வாய்ப்பாகப் புரியும்படி ‘இன்று’ என்பதை அப்படியே வைத்தல்
  alternative: சங்கீதக்காரர் பேசிய வரலாற்று நாளாக மட்டும் அல்லது முற்றிலும் இறுதிக்கால நாளாக மட்டும் விளக்குதல்
  rationale: வனாந்தரக் காலத்திற்குப் பல காலம் கழித்தும் பதிலளிப்பதற்கான ஒரு நாளைக் கடவுள் குறிப்பிடுகிறார் என்பதே வாக்கியத்தின் வாதம். மொழிபெயர்ப்பு இதை எந்த ஒரு காலவியல் கோட்பாட்டுக்குள்ளும் குறுக்கவில்லை.
- issue: ἐν Δαυὶδ என்பதன் பொருள்
  choice: தாவீதின் வாயிலாக
  alternative: ‘தாவீதுக்குள்’, அதாவது தாவீதுடன் தொடர்புடைய சங்கீதத்தில்
  rationale: கிரேக்கச் சொற்றொடரின் இடைமுகப் பொருளைத் தெளிவான தமிழில் தருகிறது; அதே நேரத்தில் இலக்கிய இடத்தைக் குறிக்கும் சாத்தியத்தை அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியம் தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், அதன் தர்க்கத் தொடர்பும் மேற்கோள் அமைப்பும் காக்கப்பட்டுள்ளன. ‘இதயம்’, ‘குரலைக் கேட்பது’ போன்ற மூல உருவகங்கள் விளக்கவுரையாக மாற்றப்படவில்லை.
