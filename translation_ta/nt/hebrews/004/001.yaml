source:
  edition: SBLGNT
  text: Φοβηθῶμεν οὖν μήποτε καταλειπομένης ἐπαγγελίας εἰσελθεῖν εἰς τὴν κατάπαυσιν αὐτοῦ δοκῇ τις ἐξ ὑμῶν ὑστερηκέναι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/001.yaml
  text: Therefore[a], let us fear lest, while the promise of entering his rest still remains[c][b], any one of you should seem to have fallen short.
translation:
  language: ta
  text: ஆகவே, அவருடைய இளைப்பாறுதலுக்குள் நுழைவதற்கான வாக்குறுதி இன்னும் நிலைத்திருக்கையில்[b], உங்களில் யாராவது அதை அடையத் தவறியவராகத் தோன்றிவிடாதபடி நாம் அஞ்சுவோமாக[a][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நாம் அஞ்சுவோமாக’ என்பதற்கு மாற்றாக, ‘நாம் பயப்படுவோமாக’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினை வெறும் ‘கவனமாக இருப்போம்’ என்பதைவிட வலுவானது.
    reason: lexical_alternative
  - marker: b
    text: இன்னும் சொற்சொல்லாக, ‘அவருடைய இளைப்பாறுதலுக்குள் நுழைவதற்கான ஒரு வாக்குறுதி நிலைத்திருக்கையில்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: c
    text: ‘உங்களில் யாராவது அதை அடையத் தவறிவிட்டவராகக் கருதப்படுவாரோ என்று’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Φοβηθῶμεν
  choice: நாம் அஞ்சுவோமாக
  rationale: எச்சரிக்கையின் தீவிரத்தைத் தணிக்காமல், ஊக்கவுரைத் தன்மையுள்ள கிரேக்க வினையை இயல்பான, கண்ணியமான தமிழில் எடுத்துரைக்கிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய பகுதியில் இஸ்ரவேலர் இளைப்பாறுதலுக்குள் நுழையத் தவறியதிலிருந்து வரும் முடிவைத் தெளிவாகக் குறிக்கிறது.
- source_word: μήποτε
  choice: தோன்றாதபடி
  rationale: அஞ்சுவதற்கான எதிர்மறை நோக்கத்தையும் எச்சரிக்கைத் தொனியையும் தமிழ் வாக்கிய அமைப்பில் இயல்பாகக் காட்டுகிறது.
- source_word: καταλειπομένης ἐπαγγελίας
  choice: வாக்குறுதி இன்னும் நிலைத்திருக்கையில்
  rationale: வாக்குறுதி தொடர்ந்து செல்லுபடியாக இருப்பதையும், முதன்மை வினையுடன் ஒரே காலச் சூழலில் இருப்பதையும் வெளிப்படுத்துகிறது.
- source_word: ἐπαγγελίας
  choice: வாக்குறுதி
  rationale: தேவனுடைய உறுதியான வாக்கைக் குறிக்கும் வழக்கமான, தெளிவான தமிழ்ச் சொல்.
- source_word: εἰσελθεῖν
  choice: நுழைவதற்கான
  rationale: வாக்குறுதியின் உள்ளடக்கமாகிய நுழைவை இயல்பான தமிழில் இணைக்கிறது.
- source_word: κατάπαυσιν
  choice: இளைப்பாறுதல்
  rationale: எபிரெயர் 3–4 பகுதிகளில் தேவனுடைய இளைப்பாறுதலைக் குறிக்கும் தொடர்ச்சியான கருத்தைத் தக்கவைக்கிறது.
- source_word: αὐτοῦ
  choice: அவருடைய
  rationale: கிரேக்க மூலத்தின் பிரதிப்பெயரை அப்படியே காக்கிறது; சூழலில் அது தேவனைக் குறிக்கிறது.
- source_word: δοκῇ
  choice: தோன்றாதபடி
  rationale: உண்மையில் தவறிவிட்டதாகத் தீர்மானித்துவிடாமல், ‘தோன்றுதல்’ அல்லது ‘கருதப்படுதல்’ என்ற மூலத்தின் திட்டமிட்ட தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: τις ἐξ ὑμῶν
  choice: உங்களில் யாராவது
  rationale: குழுவிலுள்ள ஒவ்வொருவரையும் தனிப்பட்ட முறையில் நோக்கும் எச்சரிக்கையை இயல்பான தமிழில் வழங்குகிறது.
- source_word: ὑστερηκέναι
  choice: அதை அடையத் தவறியதாக
  rationale: வாக்குறுதியான இலக்கை எட்டாமல் போதல் என்ற சூழல்சார் பொருளைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: எச்சரிக்கையை வெறும் கவனமாக இருக்க வேண்டிய அறிவுரையாக மென்மைப்படுத்தலாமா
  choice: ‘நாம் அஞ்சுவோமாக’ என்ற வலுவான அறிவுறுத்தலைத் தக்கவைத்தல்
  alternative: ‘நாம் எச்சரிக்கையாயிருப்போமாக’
  rationale: Φοβηθῶμεν என்பது உண்மையான அச்சத்தின் தீவிரத்தைக் கொண்டது; விசுவாசத்திலிருந்து விலகுதல் அல்லது நிலைத்திருத்தல் குறித்த எந்தக் கோட்பாட்டு முடிவையும் மொழிபெயர்ப்பு முன்கூட்டியே தீர்மானிக்கவில்லை.
- issue: ‘அவருடைய இளைப்பாறுதல்’ என்பதை முதன்மை உரையிலேயே விரிவாக விளக்க வேண்டுமா
  choice: ‘அவருடைய இளைப்பாறுதல்’ என்று பிரதிப்பெயரைப் பாதுகாத்தல்
  alternative: ‘தேவனுடைய இறுதிக்கால இளைப்பாறுதல்’
  rationale: சூழலில் குறிப்பு தேவனைச் சுட்டினாலும், இவ்வசனம் பிரதிப்பெயரையே பயன்படுத்துகிறது; கூடுதல் இறையியல் விளக்கத்தைச் சேர்க்காமல் மூல வடிவம் காக்கப்படுகிறது.
- issue: δοκῇ என்பது வெறும் வெளித்தோற்றமா அல்லது மதிப்பீட்டில் கண்டறியப்படுதலா
  choice: ‘தோன்றாதபடி’ என்று தெளிவின்மையைப் பாதுகாத்தல்
  alternative: ‘தவறிவிடாதபடி’
  rationale: மூலத்தில் உள்ள ‘தோன்றுதல்/கருதப்படுதல்’ நுணுக்கத்தை நீக்கி, நிகழ்வைத் திட்டவட்டமான உண்மையாக மொழிபெயர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பான வாக்கிய ஓட்டத்துடன், வேதாகம உரைக்கேற்ற கண்ணியமான நடை. ‘இளைப்பாறுதல்’, ‘வாக்குறுதி’, ‘அஞ்சுவோமாக’ ஆகியவை கருத்துத் தொடர்ச்சியையும் எச்சரிக்கையின் தீவிரத்தையும் காக்கின்றன.
