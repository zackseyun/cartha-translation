reference: Hebrews 4:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐπεὶ οὖν ἀπολείπεται τινὰς εἰσελθεῖν εἰς αὐτήν, καὶ οἱ πρότερον εὐαγγελισθέντες οὐκ εἰσῆλθον δι’ ἀπείθειαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/006.yaml
  text: Therefore[a], since it remains for some to enter it, and those who formerly had the good news proclaimed to them did not enter because of disobedience,
translation:
  language: ta
  text: ஆகவே, சிலர் அதற்குள் நுழைவதற்கு இன்னும் வாய்ப்பு இருப்பதாலும், முன்பு நற்செய்தி அறிவிக்கப்பட்டவர்கள் கீழ்ப்படியாமையால்[a] அதற்குள் நுழையாததாலும்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நம்பிக்கையின்மையால்.’ கிரேக்கச் சொல், கீழ்ப்படியாமையில் வெளிப்படும் நம்ப மறுத்தலைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ οὖν
  choice: ஆகவே, ... என்பதாலும்
  rationale: ἐπεί என்பதன் காரண/அடிப்படை அமைப்பையும் οὖν என்பதன் முடிவுரைக் தொடர்பையும் தமிழில் இயல்பான தொடர்வாக்கியமாகப் பாதுகாக்கிறது.
- source_word: ἀπολείπεται
  choice: இன்னும் வாய்ப்பு இருக்கிறது
  rationale: நுழைவு தொடர்ந்து சாத்தியமாகவும் திறந்ததாகவும் இருப்பதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; சொற்படியான ‘மீதியிருக்கிறது’ இங்கு தெளிவற்றதாக இருக்கும்.
- source_word: τινὰς
  choice: சிலர்
  rationale: குறிப்பிடப்படாத நபர்களைக் குறிக்கும் கிரேக்கப் பன்மையை நேரடியாகப் பாதுகாக்கிறது.
- source_word: εἰσελθεῖν εἰς αὐτήν
  choice: அதற்குள் நுழைவதற்கு
  rationale: முந்தைய சூழலில் கூறப்பட்ட தேவனுடைய இளைப்பாறுதலைச் சுட்டும் பெண்பால் பிரதிப்பெயரை, ‘இளைப்பாறுதல்’ என்பதை தேவையின்றி மீண்டும் சேர்க்காமல் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: οἱ πρότερον εὐαγγελισθέντες
  choice: முன்பு நற்செய்தி அறிவிக்கப்பட்டவர்கள்
  rationale: εὐαγγελισθέντες என்பதன் இறப்பினைச் செயப்பாட்டு வினைத் தன்மையைப் பாதுகாத்து, சபைசார் தொழில்நுட்பச் சொல்லைத் தவிர்க்கிறது.
- source_word: οὐκ εἰσῆλθον
  choice: நுழையவில்லை
  rationale: எளிய இறந்தகால மறுப்பை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: δι’ ἀπείθειαν
  choice: கீழ்ப்படியாமையால்
  rationale: ἀπείθεια என்பதன் முதன்மையான ‘கீழ்ப்படிய மறுத்தல்’ என்ற பொருளைப் பாதுகாக்கிறது; நம்பிக்கையின்மையுடன் உள்ள பொருள் தொடர்பை அடிக்குறிப்பு தெரிவிக்கிறது.
theological_decisions:
- issue: இளைப்பாறுதல் குறித்த எச்சரிக்கைச் சூழலில் ἀπείθεια என்பதன் மொழிபெயர்ப்பு
  choice: கீழ்ப்படியாமையால்
  alternative: நம்பிக்கையின்மையால்
  rationale: இச்சொல் தேவனுடைய வார்த்தையை நம்ப மறுப்பதும் அதற்குக் கீழ்ப்படிய மறுப்பதும் ஒன்றோடொன்று பின்னியிருப்பதைச் சுட்டலாம். எனினும் அதன் முதன்மைப் பொருளான கீழ்ப்படியாமையை மூல உரையில் வைத்து, உண்மையான பொருள் நெருக்கடியை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட தொடர்வாக்கியமாக வடிவமைக்கப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் தொடரும் இலக்கண அமைப்புடையதால் இறுதியில் முற்றுப்புள்ளிக்கு பதிலாக காற்புள்ளி வைக்கப்பட்டுள்ளது.
