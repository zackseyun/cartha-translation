  source_fidelity: 'மையப் பொருள் கிரேக்க மூலத்துடன் பொருந்துகிறது: எந்தப் படைக்கப்பட்டதும் கடவுளிடமிருந்து மறைவதில்லை; அனைத்தும் அவருடைய பார்வைக்கு வெளிப்பட்டவை; அவருக்குக் கணக்குக் கொடுக்க வேண்டியுள்ளது. ஆனால் τετραχηλισμένα என்ற இரண்டாம் உருவகத்துக்கு ‘முற்றிலும் வெளிப்படுத்தப்பட்டதாக’ என்பது ஒருமை வடிவில் அமைந்து, பன்மையான ‘எல்லாமே’யுடன் இலக்கண ஒத்திசைவு குறைகிறது. மேலும் ‘அவருடைய கண்களுக்கு முன்பாக’ என்பது τοῖς ὀφθαλμοῖς αὐτοῦ என்பதிலுள்ள ‘அவருடைய கண்களுக்கு’ என்ற நேரடி தொடர்பைச் சற்றே தேவையின்றி மாற்றுகிறது.'
  naturalness: ‘மறைவாயிருக்கும் படைப்பு எதுவும் இல்லை’ என்பது புரியத்தக்கது; ஆயினும் ‘மறைந்திருக்கும் படைக்கப்பட்ட எதுவும் இல்லை’ என்பது நவீனத் தமிழில் இயல்பாகவும் ἀφανὴς-ன் சூழல்பொருளுக்கும் நெருக்கமாகவும் உள்ளது. ‘நிர்வாணமாகவும் ... இருக்கின்றன’ என்பது தெளிவானது. இணைபெயரெச்சத்தைப் பன்மையில் அமைத்தால் நடை மேலும் சீராகும்.
  terminology: ‘படைக்கப்பட்ட எதுவும்’, ‘நிர்வாணமாக’, ‘கணக்குக் கொடுக்க வேண்டும்’ ஆகியவை பொருத்தமானவை. ‘கடவுள்’ என்ற குறிப்பு அடிக்குறிப்பில் மூலத்தின் ‘அவர்’ என்பதைக் குறிப்பதாகத் தெளிவாக உள்ளது. மாற்றுவாசிப்புக்கான அடிக்குறிப்பும் அரிய வினைச்சொல்லுக்கான அடிக்குறிப்பும் தக்க இடத்தில் உள்ளன.
