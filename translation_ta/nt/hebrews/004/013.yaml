source:
  edition: SBLGNT
  text: καὶ οὐκ ἔστιν κτίσις ἀφανὴς ἐνώπιον αὐτοῦ, πάντα δὲ γυμνὰ καὶ τετραχηλισμένα τοῖς ὀφθαλμοῖς αὐτοῦ, πρὸς ὃν ἡμῖν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/013.yaml
  text: And no creature is hidden from his sight[a], but all things are naked and laid bare to his eyes[b], to whom we must give account.
translation:
  language: ta
  text: அவருக்கு முன்பாக மறைந்திருக்கும் படைக்கப்பட்ட எதுவும் இல்லை; எல்லாமே அவருடைய கண்களுக்கு நிர்வாணமாகவும் முற்றிலும் வெளிப்படுத்தப்பட்டவையாகவும் இருக்கின்றன. அவருக்கே நாம் கணக்குக் கொடுக்க வேண்டும்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத் தொடரை இன்னும் நேரடியாக, ‘அவரோடுதான் நமக்குக் காரியம் இருக்கிறது’ என்று மொழிபெயர்க்கலாம்; ‘அவரிடமே நமது சொல் அல்லது விவகாரம் செல்கிறது’ என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: ‘முற்றிலும் வெளிப்படுத்தப்பட்டவையாக’ என மொழிபெயர்க்கப்பட்டுள்ள அரிதான கிரேக்க வினைச்சொல், கழுத்து வெளிப்படுத்தப்படுவதையோ பின்னோக்கி வளைக்கப்படுவதையோ நினைவூட்டக்கூடும்; கடவுளுக்கு முன் எதுவும் மறைவின்றி இருப்பதை அது வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: κτίσις
  choice: படைப்பு
  rationale: ஒருமையில் பொதுப்பொருளாக வரும் இச்சொல், படைக்கப்பட்ட உயிரையோ பொருளையோ குறிக்கலாம். ‘படைப்பு எதுவும்’ என்பது அதன் பரந்த, பகிர்ந்தளிக்கும் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἀφανὴς
  choice: மறைவாயிருக்கும்
  rationale: இங்கு கண்ணுக்குப் புலப்படாத இயல்பை அல்ல, கடவுளின் பார்வையிலிருந்து மறைந்திருப்பதையே குறிக்கிறது.
- source_word: ἐνώπιον αὐτοῦ
  choice: அவருக்கு முன்பாக
  rationale: கிரேக்கத் தொடரின் நேரடிப் பொருளைப் பேணுகிறது; அடுத்துள்ள ‘அவருடைய கண்கள்’ என்ற பார்வை உருவகத்துடனும் இயல்பாக இணைகிறது.
- source_word: πάντα
  choice: எல்லாமே
  rationale: நடுநிலைப் பன்மையின் முழுமையான பரப்பைத் தெளிவாகவும் வலியுறுத்தலுடனும் காட்டுகிறது.
- source_word: γυμνὰ
  choice: நிர்வாணமாக
  rationale: முழுமையாக மூடப்படாமல் இருப்பதைக் காட்டும் கிரேக்க உருவகத்தின் தெளிவையும் தீவிரத்தையும் பேணுகிறது.
- source_word: τετραχηλισμένα
  choice: முற்றிலும் வெளிப்படுத்தப்பட்டதாக
  rationale: அரிதான இவ்வினைச்சொல் கழுத்து வெளிப்படுதல் அல்லது பின்னோக்கி வளைக்கப்படுதல் போன்ற உருவகத்தைத் தரக்கூடும்; விவாதத்திற்குரிய குறிப்பிட்ட படிமத்தை முதன்மை உரையில் திணிக்காமல் முழு வெளிப்பாட்டின் விளைவைத் தெரிவிக்கிறது.
- source_word: τοῖς ὀφθαλμοῖς αὐτοῦ
  choice: அவருடைய கண்களுக்கு முன்பாக
  rationale: தெய்வீகப் பார்வைக்கு எல்லாம் வெளிப்பட்டிருப்பதை இயல்பான தமிழில் தெளிவாகத் தருகிறது.
- source_word: πρὸς ὃν ἡμῖν ὁ λόγος
  choice: அவருக்கே நாம் கணக்குக் கொடுக்க வேண்டும்
  rationale: சொல்லுக்குச் சொல் வடிவம் சுருக்கமானதும் பலபொருள் உடையதும் ஆகும். சூழலில் கடவுளின் ஆய்வுக்கும் தீர்ப்புக்கும் உட்பட்ட மனிதப் பொறுப்பை இத்தேர்வு தெளிவாகக் காட்டுகிறது; மாற்றுப் புரிதல்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: πρὸς ὃν ἡμῖν ὁ λόγος என்பதன் பொருள்
  choice: அவருக்கே நாம் கணக்குக் கொடுக்க வேண்டும்
  alternative: ‘அவரோடுதான் நமக்குக் காரியம் இருக்கிறது’ அல்லது ‘அவரிடமே நமது சொல்/விவகாரம் செல்கிறது’
  rationale: உடனடியான சூழல் கடவுளின் ஊடுருவிப் பார்க்கும் அறிவையும் நியாயத்தீர்ப்பையும் வலியுறுத்துவதால் பொறுப்புக்கணக்கு என்ற பொருள் எச்சரிக்கையின் வலிமையைப் பேணுகிறது. எனினும் கிரேக்கத் தொடரின் சுருக்கமும் உண்மையான பொருள் அகலமும் அடிக்குறிப்பில் தெரிவிக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘நிர்வாணமாக’ என்ற உயிருள்ள உருவகம் பாதுகாக்கப்பட்டது; அரிதான τετραχηλισμένα சொல்லின் விவாதத்திற்குரிய கழுத்துப் படிமம் முதன்மை உரையில் கட்டாயப்படுத்தப்படாமல் அடிக்குறிப்பில் தரப்பட்டது. அனைத்து அடிக்குறிப்பு குறிகளும் தொடர்புடைய பகுதிகளுக்குப் பின் சேர்க்கப்பட்டுள்ளன.
