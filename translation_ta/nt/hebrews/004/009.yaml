source:
  edition: SBLGNT
  text: ἄρα ἀπολείπεται σαββατισμὸς τῷ λαῷ τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/009.yaml
  text: So then[a], a Sabbath rest remains for the people of God.
translation:
  language: ta
  text: ஆகவே, தேவனுடைய மக்களுக்கு ஓய்வுநாளுக்குரிய ஓய்வு[a] இன்னும் எஞ்சியிருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஓய்வுநாள் கடைப்பிடிப்பு.” கிரேக்கச் சொல்லான σαββατισμός அரிதானது; அது ஓய்வுநாளைத் தெளிவாக நினைவூட்டுகிறது. இங்கு அது தேவனுடைய மக்களுக்காக எஞ்சியிருக்கும் ஓய்வுநாள் போன்ற ஓய்வைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα
  choice: ஆகவே
  rationale: முந்தைய வாதத்திலிருந்து பெறப்படும் முடிவைத் தெரிவிக்கும் காரணவிளைவுத் தொடர்பை இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: ἀπολείπεται
  choice: இன்னும் எஞ்சியிருக்கிறது
  rationale: வாக்குறுதியான ஒன்று தொடர்ந்து மீதமாயும் கிடைக்கத்தக்கதாயும் இருப்பதை நிகழ்கால வடிவத்தின் வலிமையுடன் தெரிவிக்கிறது.
- source_word: σαββατισμός
  choice: ஓய்வுநாளுக்குரிய ஓய்வு
  rationale: அரிதான இச்சொல்லில் உள்ள ஓய்வுநாள் தொடர்பையும், எபிரெயர் 3–4 அதிகாரங்களில் வலியுறுத்தப்படும் வரவிருக்கும் ஓய்வையும் ஒன்றை மற்றொன்றாகக் குறுக்காமல் காக்கிறது.
- source_word: τῷ λαῷ
  choice: மக்களுக்கு
  rationale: இந்த ஓய்வு தேவனுடைய மக்களுக்காக எஞ்சியிருப்பதைப் பயன் அல்லது உரிமை சார்ந்த வேற்றுமைப் பொருளில் இயல்பாகத் தருகிறது.
- source_word: τοῦ θεοῦ
  choice: தேவனுடைய
  rationale: உடைமை மற்றும் உறவைத் தெரிவிக்கும் கிரேக்கப் பிறப்புவேற்றுமையைச் சுருக்கமாகவும் தெளிவாகவும் மொழிபெயர்க்கிறது.
theological_decisions:
- issue: எபிரெயர் 4:9-இல் σαββατισμός என்பதன் பொருள்
  choice: தேவனுடைய மக்களுக்காக இன்னும் எஞ்சியிருக்கும் ஓய்வுநாள் தன்மையுள்ள ஓய்வு
  alternative: வாராந்திர ஓய்வுநாளைக் கடைப்பிடித்தல் மட்டுமே; அல்லது ஓய்வுநாள் தொடர்பே இல்லாத முற்றிலும் உருவகமான ஆன்மிக ஓய்வு
  rationale: இந்த அரிய சொல் ஓய்வுநாளைத் தெளிவாக எதிரொலிக்கிறது; சுற்றியுள்ள வாதம் தேவனுடைய ஓய்வு, ஏழாம் நாள், மக்களுக்கு வாக்குறுதியளிக்கப்பட்ட ஓய்வு ஆகியவற்றை இணைக்கிறது. ஆகவே, இரு முனைகளிலும் பொருளைச் சுருக்காமல் அந்தத் தெய்வவியல் இழுபறி காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. “ஓய்வுநாளுக்குரிய ஓய்வு” என்பது சற்றே தனித்துவமான சொற்றொடராக இருந்தாலும், மூலத்தின் அரிய சொல் விளையாட்டையும் ஓய்வுநாள் எதிரொலியையும் இயல்பாகக் காக்கிறது.
