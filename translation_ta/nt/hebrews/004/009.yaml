  source_fidelity: ஆகவே (ἄρα), இன்னும் எஞ்சியிருக்கிறது (ἀπολείπεται), தேவனுடைய மக்களுக்கு (τῷ λαῷ τοῦ θεοῦ) ஆகியவை மூலத்தின் தருக்கத் தொடர்பையும், தொடர்ந்து மீதமிருக்கும்/கிடைக்கத்தக்க தன்மையையும், பயனாளிகளையும் துல்லியமாகக் காட்டுகின்றன. “ஓய்வுநாளுக்குரிய ஓய்வு” என்பது σαββατισμός-இன் ஓய்வுநாள் எதிரொலியைத் தக்கவைத்துக்கொண்டு, உடனடியான சூழலின் ஓய்வு கருத்தையும் வெளிப்படுத்துகிறது.
  naturalness: வாக்கியம் நவீனத் தரமான தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. “ஓய்வுநாளுக்குரிய ஓய்வு” சற்று குறியீட்டுத் தன்மை கொண்ட சொற்றொடராயினும், மூலத்தில் உள்ள அரிய மற்றும் திட்டமிட்ட ஓய்வுநாள்-சார்ந்த சொல்லாட்சிக்குப் பொருத்தமானது; பொதுவாசகருக்கு விளக்கக் குறிப்பும் உதவுகிறது.
