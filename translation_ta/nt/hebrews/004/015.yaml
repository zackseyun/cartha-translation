id: HEB.4.15
reference: Hebrews 4:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐ γὰρ ἔχομεν ἀρχιερέα μὴ δυνάμενον συμπαθῆσαι ταῖς ἀσθενείαις ἡμῶν, ⸀πεπειρασμένον δὲ κατὰ πάντα καθ’ ὁμοιότητα χωρὶς ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/015.yaml
  text: For we do not have a high priest unable to sympathize with our weaknesses, but one who has been tested in every way according to likeness, yet without sin.
translation:
  language: ta
  text: ஏனெனில், நம்முடைய பலவீனங்களோடு அனுதாபம் கொள்ள இயலாத தலைமைக் குரு நமக்கு இல்லை; மாறாக, எல்லா வகையிலும் நம்மைப் போலவே[b] சோதிக்கப்பட்டவரும்[a], ஆயினும் பாவமில்லாதவருமான தலைமைக் குருவே நமக்கு இருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சோதிக்கப்பட்டவர்” என்பதற்கு “சோதனைக்குள்ளாக்கப்பட்டவர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: b
    text: “நம்மைப் போலவே” என்பது சொல்லர்த்தமாக “ஒப்புமையின்படி.” கிரேக்க மூலத்தில் “நம்மைப்” என்பது வெளிப்படையாக இல்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερέα
  choice: தலைமைக் குரு
  rationale: எபிரெயர் நூலில் இயேசுவின் ஆசாரிய நடுவுநிலையைச் சுட்டும் வழிபாட்டுப் பதவிக்கான துல்லியமான, புரிந்துகொள்ளத்தக்க தமிழ் சொல்.
- source_word: μὴ δυνάμενον συμπαθῆσαι
  choice: பரிவுகொள்ள இயலாத
  rationale: οὐ ... μὴ δυνάμενον என்ற மறுப்புக்குள் அமைந்த எதிர்மறை சொல்லாட்சியைத் தக்கவைக்கிறது. συμπαθέω வெறும் இரக்கம் காட்டுவதைவிட மற்றவரின் துன்பத்தோடு உணர்வுபூர்வமாகப் பங்குகொள்வதைக் குறிக்கிறது.
- source_word: ταῖς ἀσθενείαις ἡμῶν
  choice: நம்முடைய பலவீனங்களைக் கண்டு
  rationale: ἀσθένεια உடல் நோயை மட்டும் அல்லாமல் மனித இயலாமை மற்றும் எளிதில் பாதிக்கப்படும் நிலையையும் விரிவாகக் குறிக்கிறது; தமிழில் ‘பரிவுகொள்’ என்பதுடன் இயல்பாக இணைய ‘கண்டு’ சேர்க்கப்பட்டுள்ளது.
- source_word: πεπειρασμένον
  choice: சோதிக்கப்பட்டவர்
  rationale: πειράζω என்பது ‘சோதித்தல்’ அல்லது ‘தூண்டிச் சோதித்தல்’ என இரு நுணுக்கங்களைக் கொண்டது. நிறைவேற்றப்பட்டும் தொடர்ந்த பொருத்தமுள்ள அனுபவத்தையும் குறிக்கும் perfect participle-ன் வலிமையை இத்தேர்வு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: κατὰ πάντα
  choice: எல்லா வகையிலும்
  rationale: சோதனையின் விரிவையும் முழுமையையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: καθ’ ὁμοιότητα
  choice: நம்மைப் போலவே
  rationale: ὁμοιότης குறிக்கும் ஒப்புமையை சூழலில் இயல்பாக வெளிப்படுத்துகிறது. கிரேக்கத்தில் ஒப்பிடப்படும் தரப்பு வெளிப்படையாகக் கூறப்படவில்லை என்பதைக் குறிப்பில் பாதுகாக்கிறது.
- source_word: χωρὶς ἁμαρτίας
  choice: ஆனாலும் பாவமில்லாதவர்
  rationale: முழுமையான சோதனை அனுபவத்துக்கும் பாவமின்மைக்கும் இடையிலுள்ள தீர்மானமான வேறுபாட்டைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
theological_decisions:
- issue: πεπειρασμένον என்பதையும் கிறிஸ்துவின் பாவமின்மையையும் மொழிபெயர்த்தல்
  choice: சோதிக்கப்பட்டவர்
  alternative: தூண்டிச் சோதிக்கப்பட்டவர்
  rationale: மெய்யான சோதனை அனுபவத்தை உறுதிப்படுத்தியபடியே, மூலச்சொல்லின் ‘tempted’ நுணுக்கத்தை அடிக்குறிப்பில் காக்கிறது; பாவமின்மையை வசனத்தின் இறுதிக் கூறே தெளிவுபடுத்துகிறது.
- issue: καθ’ ὁμοιότητα என்பதில் மறைந்துள்ள ஒப்பீட்டை வெளிப்படுத்துதல்
  choice: நம்மைப் போலவே
  alternative: ஒப்புமையின்படி
  rationale: சூழலில் ஒப்பீடு மனிதர்களாகிய ‘நம்மோடு’ என்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது; இருப்பினும் மூலத்தில் ‘நம்மைப்’ என்பது வெளிப்படையாக இல்லை என்ற உண்மையை அடிக்குறிப்பு தெரிவிக்கிறது.
- issue: இரட்டை மறுப்பின் சொல்லாட்சியைப் பாதுகாத்தல்
  choice: பரிவுகொள்ள இயலாத தலைமைக் குரு நமக்கு இல்லை
  alternative: நம் பலவீனங்களில் பரிவுகொள்ளக்கூடிய தலைமைக் குரு நமக்கு இருக்கிறார்
  rationale: கிரேக்கத்தின் வலியுறுத்தும் எதிர்மறை அமைப்பைச் சீராக்காமல் தக்கவைத்து, அடுத்துள்ள ‘மாறாக’ என்ற முரண்பாட்டை பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை. ‘தலைமைக் குரு’ எபிரெயர் நூலின் வழிபாட்டுச் சொற்களஞ்சியத்தைத் தக்கவைக்கிறது. கிரேக்கத்தின் இரட்டை மறுப்பு நேர்மறையாகச் சீராக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளது; இயல்பிற்காக καθ’ ὁμοιότητα ‘நம்மைப் போலவே’ என வழங்கப்பட்டு அதன் சொல்லர்த்த வடிவம் குறிப்பில் தரப்பட்டுள்ளது.
