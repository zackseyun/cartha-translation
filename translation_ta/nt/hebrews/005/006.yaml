  text: just as he also says in another place[b][a], “You are a priest forever according to the order of Melchizedek,”
translation:
  language: ta
  text: 'அதுபோலவே, வேறொரு இடத்திலும்[a] அவர் கூறுகிறார்:


    “நீர் மெல்கிசேதேக்கின் வரிசையின்படி[b]

    என்றென்றும் ஆசாரியராக இருக்கிறீர்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வேறெங்கும்.” கிரேக்கத்தில் சொல்லுக்குச் சொல் “வேறொன்றில்”; ‘இடம்’ அல்லது வேறொரு வேதப்பகுதி என்பது உட்பொருள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மெல்கிசேதேக்கின் ஒழுங்கின்படி” அல்லது “முறைப்படி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς καὶ
  choice: அதுபோலவே ... -உம்
  rationale: முந்தைய மேற்கோளுக்கு இணையான இன்னொரு வேதவாக்கை அறிமுகப்படுத்தும் ஒப்புமையையும் καί தரும் ‘மேலும்’ என்ற நுணுக்கத்தையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ἐν ἑτέρῳ
  choice: வேறொரு இடத்தில்
  rationale: கிரேக்கத்தில் பெயர்ச்சொல் விடுபட்டிருந்தாலும், வேறொரு வேதப்பகுதி குறிக்கப்படுவதால் ‘இடத்தில்’ என்பதை வெளிப்படையாகச் சேர்ப்பது இயல்பான தமிழாகும்; மாற்றாக ‘வேறெங்கும்’ எனலாம்.
- source_word: λέγει
  choice: அவர் கூறுகிறார்
  rationale: நிகழ்கால வினையைத் தக்கவைத்து, வேதவாக்கின் மூலம் பேசுபவரை ஆண்பால் ஒருமைச் சுட்டுப்பெயரால் குறிக்கிறது; ‘தேவன்’ என்று மூலத்தில் இல்லாத பெயரைச் சேர்க்கவில்லை.
- source_word: Σὺ
  choice: நீர்
  rationale: நேரடி இரண்டாம் நபர் ஒருமை அழைப்பை, மேற்கோளுக்கேற்ற கண்ணியமான தமிழ் வடிவில் தருகிறது.
- source_word: ἱερεὺς
  choice: ஆசாரியர்
  rationale: ἱερεύς என்பதற்கான பரவலாக அறியப்பட்ட வேதாகமத் தமிழ் சொல்; இங்கு பயனிலை நிலையில் இருப்பதால் தனியான காலியுருபு தேவையில்லை.
- source_word: εἰς τὸν αἰῶνα
  choice: என்றென்றும்
  rationale: தொடர்ந்து நிலைக்கும் காலத்தை இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: κατὰ τὴν τάξιν
  choice: முறைப்படி
  rationale: τάξις குறிக்கும் ஒழுங்கு, வகை, வரிசை ஆகிய சாத்தியங்களை ஓரளவு திறந்துவைத்து, மெல்கிசேதேக்கோடு தொடர்புடைய ஆசாரியத்துவ அமைப்பை இயல்பான தமிழில் குறிக்கிறது.
- source_word: Μελχισέδεκ
  choice: மெல்கிசேதேக்கு
  rationale: கிரேக்கப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது; வேற்றுமை உருபை ஏற்கும் வகையில் தமிழாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: மேற்கோள் அறிமுகத்தில் பேசுபவர் யார்?
  choice: ‘அவர் கூறுகிறார்’ என்று மொழிபெயர்த்து, பேசுபவரின் பெயரை வெளிப்படையாகச் சேர்க்காமல் விட்டது.
  alternative: ‘வேதம் கூறுகிறது’ அல்லது ‘அதில் கூறப்பட்டுள்ளது.’
  rationale: λέγει என்பது ஒருமை நிகழ்காலச் செயப்பாட்டு வடிவம். எபிரெயர் நூலில் வேதவாக்கு உயிருள்ள தற்போதைய உரையாக வழங்கப்படுவதைக் காக்கிறது; அதேவேளை மூலத்தில் இல்லாத ‘தேவன்’ அல்லது ‘வேதம்’ என்ற பெயரைச் சேர்ப்பதில்லை.
- issue: τάξις என்பதன் ஆசாரியத்துவப் பொருள்
  choice: ‘முறை’ என்று வழங்கி, மெல்கிசேதேக்கோடு தொடர்புடைய ஆசாரியத்துவ வகை அல்லது ஒழுங்கைக் குறித்தது.
  alternative: ‘வரிசை’, ‘ஒழுங்கு’, அல்லது ‘மாதிரி’.
  rationale: இச்சொல் வெறும் செயல்முறையை மட்டுமல்லாமல் ஆசாரியத்துவ வகை/அமைப்பையும் குறிக்கலாம். ‘முறைப்படி’ என்பது தமிழில் இயல்பாக இருந்து, அந்தப் பரந்த பொருள் வாய்ப்பை முற்றிலும் அடைக்காது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பேணுகிறது. நேரடி அழைப்பில் ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது. மேற்கோளின் கவிதைநடை வரிப் பிரிப்பால் காட்டப்பட்டுள்ளது; தேவையற்ற சமயக்குழுச் சொற்கள் சேர்க்கப்படவில்லை.
