id: HEB.5.7
reference: Hebrews 5:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὃς ἐν ταῖς ἡμέραις τῆς σαρκὸς αὐτοῦ δεήσεις τε καὶ ἱκετηρίας πρὸς τὸν δυνάμενον σῴζειν αὐτὸν ἐκ θανάτου μετὰ κραυγῆς ἰσχυρᾶς καὶ δακρύων προσενέγκας καὶ εἰσακουσθεὶς ἀπὸ τῆς εὐλαβείας,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/007.yaml
  text: who[a], in the days of his flesh, having offered up both prayers and petitions with loud cries and tears to the one able to save him from death, and having been heard because of his reverence[b],
translation:
  language: ta
  text: அவர் தமது மாம்ச வாழ்வின் நாட்களில், தம்மை மரணத்திலிருந்து[a] காப்பாற்ற வல்லவரிடம் உரத்த கூக்குரலோடும் கண்ணீரோடும் வேண்டுதல்களையும் மன்றாட்டுகளையும் ஏறெடுத்து, தமது பயபக்தியின் காரணமாக[b] அவருக்குச் செவிகொடுக்கப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மரணத்திலிருந்து காப்பாற்ற” என்பதை, “மரணத்திலிருந்து வெளியே மீட்க,” அதாவது உயிர்த்தெழுதலின் மூலம் விடுவிக்க என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “அவருடைய இறைபயத்தின் காரணமாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις τῆς σαρκὸς αὐτοῦ
  choice: தாம் மாம்சத்தில் வாழ்ந்த நாட்களில்
  rationale: σάρξ என்பதன் உடல்சார்ந்த வலியுறுத்தலைக் காக்கும் அதேவேளையில், இயல்பான நவீனத் தமிழில் இயேசுவின் மனித வாழ்வுக் காலத்தைக் குறிக்கிறது.
- source_word: δεήσεις τε καὶ ἱκετηρίας
  choice: வேண்டுதல்களையும் மன்றாட்டுகளையும்
  rationale: இரு நெருங்கிய சொற்களையும் வேறுபடுத்தி, இரண்டாவதிலுள்ள தீவிரமான பணிவான விண்ணப்ப உணர்வையும் வெளிப்படுத்துகிறது.
- source_word: πρὸς τὸν δυνάμενον σῴζειν αὐτὸν ἐκ θανάτου
  choice: மரணத்திலிருந்து தம்மைக் காப்பாற்ற வல்லவரிடம்
  rationale: திறனைக் குறிக்கும் substantival participle-ஐ ‘வல்லவர்’ எனக் காட்டி, ἐκ θανάτου என்பது மரணத்தைத் தவிர்த்தல் அல்லது மரணத்திலிருந்து மீட்டல் என்ற இரு சாத்தியங்களையும் உடனடியாகத் தீர்மானிக்காமல் விடுகிறது.
- source_word: μετὰ κραυγῆς ἰσχυρᾶς καὶ δακρύων
  choice: உரத்த கதறலோடும் கண்ணீரோடும்
  rationale: κραυγή என்பதிலுள்ள தீவிரமான கூக்குரலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ஒருமை வடிவத்தைத் தமிழில் செயற்கையாகக் கட்டுப்படுத்தவில்லை.
- source_word: προσενέγκας
  choice: ஏறெடுத்தார்
  rationale: ஜெபத்தை இறைவனிடம் செலுத்துதல் என்ற இயல்பான தமிழ் வழக்கைத் தருவதோடு, எபிரெயர் நூலின் ஆசாரிய மற்றும் பலியிடும் பின்னொலியையும் முற்றிலும் இழக்காமல் காக்கிறது.
- source_word: εἰσακουσθεὶς
  choice: அவரது வேண்டுதல் கேட்கப்பட்டது
  rationale: வெறுமனே ஒலி கேட்டது என்பதல்லாமல் சாதகமாகச் செவிகொடுக்கப்பட்டது என்ற passive பொருளைக் காட்டுகிறது; பதிலின் குறிப்பிட்ட வடிவத்தைச் சேர்க்கவில்லை.
- source_word: ἀπὸ τῆς εὐλαβείας
  choice: அவருடைய பயபக்தியின் காரணமாக
  rationale: εὐλάβεια என்பதிலுள்ள மரியாதை, தேவபயம், பக்தி ஆகிய நிழற்பொருள்களை ‘பயபக்தி’ சுருக்கமாகக் காக்கிறது; தவறான கோழைத்தனமான பயத்தை உணர்த்துவதில்லை.
theological_decisions:
- issue: ἀπὸ τῆς εὐλαβείας என்பதன் பொருள்
  choice: அவருடைய பயபக்தியின் காரணமாக
  alternative: அவருடைய இறைபயத்தின் காரணமாக; அவருடைய மரியாதைமிக்க கீழ்ப்படிதலின் காரணமாக
  rationale: மூலச்சொல்லின் மரியாதையும் தேவபயமும் கலந்த பொருளை வைத்துக்கொண்டு, ‘கீழ்ப்படிதல்’ என்பதை விளக்கமாக முதன்மை உரைக்குள் சேர்ப்பதைத் தவிர்க்கிறது.
- issue: ἐκ θανάτου என்பதன் எல்லை
  choice: மரணத்திலிருந்து தம்மைக் காப்பாற்ற
  alternative: மரணத்திலிருந்து வெளியே மீட்க; மரணமடையாமல் காக்க
  rationale: இறப்பைத் தவிர்ப்பதா அல்லது உயிர்த்தெழுதலால் மரணத்திலிருந்து விடுவிப்பதா என்பதை முதன்மை உரை முடிவுசெய்யாமல், கிரேக்கத்தின் உண்மையான இருபொருள் வாய்ப்பைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. வசனம் முன் வாக்கியத்தைத் தொடரும் உறவுத்தொடராக இருப்பினும், தமிழில் இயல்பாக வாசிக்க ‘அவர்’ எனத் தொடங்குகிறது. ‘மாம்சத்தில் வாழ்ந்த நாட்களில்’ என்பது மூலத்தின் உடல்சார்ந்த சொல்லாட்சியைத் தக்கவைக்கிறது.
