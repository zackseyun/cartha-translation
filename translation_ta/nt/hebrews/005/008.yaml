  rationale: ἀπό குறிக்கும் மூலம் அல்லது அனுபவ அடிப்படையை ‘இலிருந்து’ தெளிவாகக் காட்டுகிறது; பன்மை உறவுப்பெயரின் கருத்தை ‘துன்பங்கள்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἔπαθεν
