theological_decisions:
- issue: மகனாகிய அவரது நிலைக்கும் அவர் கற்ற கீழ்ப்படிதலுக்கும் உள்ள தொடர்பு
  choice: அவர் மகனாக இருந்தபோதிலும்
  alternative: அவர் அந்த மகனாக இருந்தபோதிலும்
  rationale: மூலத்தில் υἱός என்பதற்கு கட்டுரைச் சொல் இல்லை. தமிழ் ‘மகனாக’ என்பது தேவையற்ற வரையறையையோ எண்ணையோ சேர்க்காமல் கிறிஸ்துவைக் குறிக்கும் சூழலையும் விட்டுக்கொடுக்கும் வலிமையையும் பாதுகாக்கிறது.
- issue: ‘கீழ்ப்படிதலைக் கற்றுக்கொண்டார்’ என்பது முந்தைய கீழ்ப்படியாமையைக் குறிக்கிறதா
  choice: நேரடியான ‘கீழ்ப்படிதலைக் கற்றுக்கொண்டார்’ என்ற வாசகத்தைத் தக்கவைத்தல்
  alternative: கீழ்ப்படிதலின் விலையை அனுபவத்தில் அறிந்துகொண்டார்
  rationale: கிரேக்கம் நேரடியாக ‘கீழ்ப்படிதலைக் கற்றார்’ என்கிறது. துன்பத்தின் வழியான அனுபவக் கற்றலைச் சுட்டுகிறது என்பதை அடிக்குறிப்பு விளக்குகிறது; மொழிபெயர்ப்பு உரையின் இறையியல் பதற்றத்தைப் பொழிப்புரையால் நீக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தாம்’ மற்றும் மரியாதை ஒருமை வினைமுற்று தெளிவான இயேசு குறிப்பைத் தக்கவைக்கின்றன. மூலத்தின் சுருக்கமும் இறையியல் பதற்றமும் பாதுகாக்கப்பட்டுள்ளன.
