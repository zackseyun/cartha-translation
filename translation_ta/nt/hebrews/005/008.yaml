lexical_decisions:
- source_word: καίπερ
  choice: இருந்தபோதிலும்
  rationale: மகன் என்ற அவரது நிலைக்கும், துன்பத்தின் வழியாகக் கீழ்ப்படிதலைக் கற்றதற்கும் இடையிலான விட்டுக்கொடுக்கும் முரண்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὢν υἱός
  choice: அவர் மகனாக இருந்த
  rationale: எழுவாய்ப்பொருள் நிலையில் வரும் ὢν என்பதையும், கட்டுரைச் சொல் இல்லாத υἱός என்பதையும் மிகைப்படுத்தாமல் இயல்பான தமிழில் தருகிறது. தமிழில் கட்டாயமற்ற ‘ஒரு’ என்பதைச் சேர்க்காமல் ‘மகனாக’ என மொழிபெயர்ப்பது மூலத்தின் திறந்த தன்மையைப் பாதுகாக்கிறது.
- source_word: ἔμαθεν
  choice: கற்றுக்கொண்டார்
  rationale: μανθάνω என்பதன் நேரடியான பொருளான உண்மையான கற்றலைத் தக்கவைக்கிறது; மரியாதை ஒருமை இயேசுவைக் குறிக்கும் நவீனத் தமிழ் நடைக்கு ஏற்றது.
- source_word: ἀφ’ ὧν
