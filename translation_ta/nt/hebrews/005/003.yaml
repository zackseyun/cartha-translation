reference: Hebrews 5:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ⸂δι’ αὐτὴν⸃ ὀφείλει, καθὼς περὶ τοῦ λαοῦ, οὕτως καὶ περὶ ⸀αὑτοῦ προσφέρειν ⸀περὶ ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/003.yaml
  text: And because of this he is obligated[a], just as for the people, so also for himself, to offer for sins.
translation:
  language: ta
  text: இதன் காரணமாக, மக்களுக்காகப் பாவங்களின் பொருட்டுப் பலி செலுத்துவதுபோலவே, தனக்காகவும் அப்படியே பலி செலுத்த அவர் கடமைப்பட்டிருக்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, “அதன் காரணமாக”; இது முந்தைய வசனத்தில் கூறப்பட்ட தலைமை ஆசாரியரின் பலவீனத்தைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ αὐτὴν
  choice: இதன் காரணமாகவே
  rationale: διά + accusative என்பதன் காரணப் பொருளை இயல்பான தமிழில் தருகிறது. பெண்பால் சுட்டுப்பெயர் முந்தைய வசனத்திலுள்ள பலவீனத்தைக் குறிப்பதாகத் தோன்றினாலும், மூலத்தின் சுட்டும் தன்மையை முதன்மை உரை காக்கிறது.
- source_word: ὀφείλει
  choice: கடமைப்பட்டிருக்கிறார்
  rationale: இது வெறும் அறிவுரையையல்ல, ஆசாரியர்மீது உள்ள கட்டாயக் கடமையைக் குறிக்கிறது.
- source_word: καθὼς ... οὕτως καὶ
  choice: '... செய்வதுபோல ...வும்'
  rationale: கிரேக்க ஒப்புமை அமைப்பை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: τοῦ λαοῦ
  choice: மக்களுக்காக
  rationale: லேவியத் தலைமை ஆசாரியச் சூழலில் உடன்படிக்கை மக்களைக் குறிக்கிறது; மூலத்தில் இல்லாத ‘இஸ்ரவேல்’ என்ற விரிவாக்கத்தைச் சேர்க்கவில்லை.
- source_word: περὶ αὑτοῦ
  choice: தனக்காகவும்
  rationale: தற்சுட்டுப் பொருளையும் மக்களுக்கும் ஆசாரியருக்கும் இடையிலான இணைப்பையும் தெளிவாகத் தருகிறது.
- source_word: προσφέρειν περὶ ἁμαρτιῶν
  choice: பாவங்களுக்காகப் பலி செலுத்த
  rationale: προσφέρειν என்பதற்கு வெளிப்படையான செயப்படுபொருள் இல்லாவிட்டாலும், ஆசாரியப் பலியிடும் சூழலில் ‘பலி செலுத்த’ என்பது தமிழில் இயல்பாகவும் கருத்தில் துல்லியமாகவும் உள்ளது; ‘பாவநிவாரணப் பலி’ என்று வகையை மிகையாகக் குறிப்பதில்லை.
theological_decisions:
- issue: ‘இதன் காரணமாகவே’ என்பதன் முன்சுட்டு
  choice: முந்தைய வசனத்தில் கூறப்பட்ட தலைமை ஆசாரியரின் பலவீனத்தைச் சுட்டுவதாகக் கொள்ளப்பட்டது; ஆனால் முதன்மை உரையில் ‘பலவீனம்’ என வெளிப்படையாகச் சேர்க்கப்படவில்லை.
  alternative: அவருடைய பதவி அல்லது மொத்தச் சூழ்நிலையைக் பொதுவாகச் சுட்டுவதாகக் கொள்ளலாம்.
  rationale: அருகிலுள்ள பெண்பால் பெயர்ச்சொல்லான ἀσθένεια (‘பலவீனம்,’ 5:2) இயல்பான முன்சுட்டாகும். இருப்பினும் மூலத்தின் சுட்டுப்பெயர் வடிவத்தைப் பாதுகாப்பது உண்மையான அளவிலான தெளிவின்மையை நிலைநிறுத்துகிறது.
- issue: προσφέρειν உடன் ‘பலி’ என்பதை வழங்குதல்
  choice: தமிழின் இயல்புக்கும் ஆசாரியச் சூழலுக்கும் ஏற்ப ‘பலி செலுத்த’ என மொழிபெயர்க்கப்பட்டது.
  alternative: செயப்படுபொருளைச் சேர்க்காமல் ‘செலுத்த’ அல்லது ‘படைக்க’ என மட்டும் தரலாம்.
  rationale: தமிழில் தனியாக ‘செலுத்த’ என்பது இங்கு முழுமையற்றதாகவும் தெளிவற்றதாகவும் ஒலிக்கும். சூழல் பலியிடுதலைத் தெளிவாகக் காட்டுவதால் ‘பலி’ என்பது விளக்கமான நிறைவு; குறிப்பிட்ட பலிவகையை இது திணிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையில் வடிவமைக்கப்பட்டது. ‘கடமைப்பட்டிருக்கிறார்’ என்பது கடமையின் வலிமையைத் தக்கவைக்கிறது; ‘பலி செலுத்த’ என்பது வழிபாட்டு சூழலை இயல்பாக வெளிப்படுத்துகிறது.
