  text: μετριοπαθεῖν δυνάμενος τοῖς ἀγνοοῦσι καὶ πλανωμένοις ἐπεὶ καὶ αὐτὸς περίκειται ἀσθένειαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/002.yaml
  text: being able to deal gently with those who are ignorant and going astray[a], since he himself also is beset with weakness[b],
translation:
  language: ta
  text: அறியாமையில் இருப்பவர்களிடமும் வழிதவறியவர்களிடமும்[a] அவர் மென்மையாக நடந்துகொள்ள வல்லவர்; ஏனெனில், அவரும்கூட பலவீனத்தால் சூழப்பட்டிருக்கிறார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வழிதவற வழிநடத்தப்பட்டவர்களிடமும்.’ கிரேக்கப் பங்கேற்புவினைக்கு செயப்பாட்டுப் பொருளும் இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘பலவீனத்தால் சுற்றப்பட்டிருக்கிறார்’ அல்லது ‘பலவீனத்தை ஆடையாக அணிந்திருக்கிறார்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: μετριοπαθεῖν
  choice: மென்மையாக நடந்துகொள்ள
  rationale: கடுமையாகவோ அலட்சியமாகவோ இல்லாமல், அளவோடும் கட்டுப்பாட்டோடும் அணுகுவதை இந்த வினை குறிக்கிறது. ‘மென்மையாக நடந்துகொள்ள’ என்பது அதன் மனநிலையையும் நடைமுறைச் செயலையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: δυνάμενος
  choice: வல்லவர்
  rationale: தலைமை ஆசாரியருக்கு உள்ள தொடர்ந்த திறனைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: τοῖς ἀγνοοῦσι
  choice: அறியாமையில் இருப்பவர்களிடம்
  rationale: பங்கேற்புவினையின் தொடர்ந்த நிலையைத் தக்கவைத்து, இவர்களை ஒரு நிலையான சமூக வகுப்பாகச் சித்தரிக்காமல் அறியாமை என்னும் நிலையில் இருப்பவர்களாகக் காட்டுகிறது.
- source_word: πλανωμένοις
  choice: வழிதவறிச் செல்பவர்களிடம்
  rationale: ஒழுக்க அல்லது ஆன்மிக நெறியிலிருந்து விலகுவதை இயல்பான தமிழில் தெரிவிக்கிறது; செயப்படுபொருள் நிழற்பொருளை அடிக்குறிப்பில் மாற்று வாசிப்பாகத் தக்கவைக்கிறது.
- source_word: ἐπεὶ
  choice: ஏனெனில்
  rationale: தலைமை ஆசாரியர் மென்மையாக நடந்துகொள்ள வல்லதற்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: καὶ αὐτὸς
  choice: அவரும்
  rationale: அவர் சேவை செய்கிற மக்களோடு அவரையும் இணைக்கும் சேர்க்கைப் பொருளையும், அவருடைய சொந்த நிலையையும் இயல்பான தமிழில் வலியுறுத்துகிறது.
- source_word: περίκειται ἀσθένειαν
  choice: பலவீனத்தால் சூழப்பட்டிருக்கிறார்
  rationale: பலவீனம் அவரைச் சுற்றியிருக்கும் அல்லது ஆடையைப்போல் போர்த்தியிருக்கும் கிரேக்க உருவகத்தை வாசிக்கத்தக்க தமிழில் காக்கிறது. ‘பலவீனம்’ என்பது உடல், ஒழுக்கம் அல்லது பொதுவான மனித இயலாமை என்று பொருளைச் சுருக்காமல் அதன் பரப்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: ἀγνοοῦσι καὶ πλανωμένοις என்பதால் குறிக்கப்படும் மக்களின் தவறின் இயல்பு
  choice: அறியாமையில் இருப்பவர்களையும் வழிதவறிச் செல்பவர்களையும் பொதுவாகக் குறிக்கும் மொழி
  alternative: லேவியராகமப் பலிமுறையில் அறியாமல் செய்யப்பட்ட பாவங்களை மட்டும் குறிக்கும் தொழில்நுட்பச் சுட்டு
  rationale: இந்தச் சொற்கள் பழைய ஏற்பாட்டின் ஆசாரியப் பின்னணியை நினைவூட்டினாலும், கிரேக்கச் சொற்றொடர் அந்தத் தொழில்நுட்பப் பிரிவைவிடப் பரந்தது. ஆகவே மொழிபெயர்ப்பு பொருளை ஒரு குறிப்பிட்ட பலிச்சட்ட வகைக்குள் கட்டுப்படுத்தவில்லை.
- issue: தலைமை ஆசாரியருடன் தொடர்புடைய ἀσθένεια என்பதன் பொருள்
  choice: பரந்த பொருளுடைய மனித பலவீனம்
  alternative: உடல் பலவீனம் மட்டும் அல்லது ஒழுக்க பலவீனம் மட்டும்
  rationale: இச்சொல் மரணத்திற்குட்பட்ட மனித வாழ்வின் பலவகையான இயலாமையையும் உள்ளடக்கக்கூடும். ‘பலவீனம்’ என்ற பொதுச் சொல் அந்த விரிவைத் தக்கவைத்து, வசனம் செய்யாத ஒரு குறிப்பிட்ட கோட்பாட்டுக் கூற்றை அதில் புகுத்துவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் காரணத் தொடர்பும், தலைமை ஆசாரியரின் மனித பலவீனத்தைச் சூழ்ந்திருக்கும் ஒன்றாகக் காட்டும் உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
