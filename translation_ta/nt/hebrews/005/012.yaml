source:
  edition: SBLGNT
  text: καὶ γὰρ ὀφείλοντες εἶναι διδάσκαλοι διὰ τὸν χρόνον, πάλιν χρείαν ἔχετε τοῦ διδάσκειν ὑμᾶς ⸀τινὰ τὰ στοιχεῖα τῆς ἀρχῆς τῶν λογίων τοῦ θεοῦ, καὶ γεγόνατε χρείαν ἔχοντες γάλακτος, ⸀οὐ στερεᾶς τροφῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/012.yaml
  text: For although by this time you ought to be teachers[a], you again need someone to teach you the basic elements of the beginning of the oracles of God, and you have come to need milk[b], not solid food.
translation:
  language: ta
  text: இந்தக் காலத்திற்குள் நீங்கள் ஆசிரியர்களாக இருக்க வேண்டியவர்களாயிருந்தும், கடவுளின் அருள்வாக்குகளின் தொடக்க அடிப்படைகளை[a] உங்களுக்கு மீண்டும் கற்பிக்க வேண்டிய தேவை உங்களுக்கு இருக்கிறது. நீங்கள் திட உணவு அல்ல, பால் தேவைப்படும் நிலைக்கு வந்துவிட்டீர்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் இச்சொற்றொடர், ‘இந்த அடிப்படைகள் என்ன/எவை’ என்ற நுணுக்கத்துடனும் அல்லது ‘சில அடிப்படைக் கூறுகள்’ என்ற நுணுக்கத்துடனும் புரிந்துகொள்ளப்படலாம்.
    reason: textual_ambiguity
  - marker: b
    text: ‘பால்’ மற்றும் ‘திட உணவு’ ஆசிரியர் பயன்படுத்தும் உருவகங்கள்; அவற்றின் குறிப்பான விளக்கம் இவ்வசனத்தில் தரப்படவில்லை.
    reason: metaphor_note
lexical_decisions:
- source_word: ὀφείλοντες εἶναι
  choice: இருக்க வேண்டியவர்கள்
  rationale: எதிர்பார்க்கப்படும் கடமையையும் அவர்கள் அடைந்திருக்க வேண்டிய நிலையையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; சட்டரீதியான கட்டாயமாக மிகைப்படுத்தவில்லை.
- source_word: διδάσκαλοι
  choice: போதகர்கள்
  rationale: மற்றவர்களுக்குக் கற்பிக்கத் தகுதியானவர்களைக் குறிக்கும் பொதுவாகப் புரியக்கூடிய சொல்லாக உள்ளது.
- source_word: διὰ τὸν χρόνον
  choice: காலம் கடந்துவிட்டதைக் கருத்தில் கொண்டால்
  rationale: கடந்துபோன காலத்தின் அளவை அடிப்படையாகக் கொண்ட முதிர்ச்சி எதிர்பார்ப்பைத் தெளிவுபடுத்துகிறது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: அடிப்படைப் போதனை மறுபடியும் தேவைப்படும் பின்னடைவைப் பாதுகாக்கிறது.
- source_word: τοῦ διδάσκειν ὑμᾶς τινὰ
  choice: ஒருவர் உங்களுக்கு … கற்பிக்க வேண்டிய
  rationale: τινὰ என்பதை διδάσκειν என்பதன் குறிப்பிடப்படாத எழுவாயான ‘ஒருவர்’ என்று கொண்டு, தமிழ் வாக்கிய அமைப்பில் இயல்பாகத் தருகிறது.
- source_word: τὰ στοιχεῖα τῆς ἀρχῆς
  choice: தொடக்கநிலை அடிப்படைகள்
  rationale: στοιχεῖα என்பதன் அடிப்படைக் கூறுகள் என்ற பொருளையும் ἀρχῆς என்பதன் ஆரம்பநிலை வலியுறுத்தலையும் தேவையற்ற சொற்பெருக்கின்றிப் பாதுகாக்கிறது.
- source_word: τῶν λογίων τοῦ θεοῦ
  choice: கடவுளின் அருள்வாக்குகள்
  rationale: λόγια என்பது சாதாரண சொற்களை அல்ல, கடவுளிடமிருந்து வரும் வாக்குகள் அல்லது வெளிப்பாடுகளைக் குறிக்கிறது என்பதை மரியாதையான, புரியக்கூடிய தமிழில் தெரிவிக்கிறது.
- source_word: γεγόνατε χρείαν ἔχοντες
  choice: தேவைப்படும் நிலைக்கு நீங்கள் வந்துவிட்டீர்கள்
  rationale: காலப்போக்கில் உருவாகி இப்போதும் நீடிக்கும் நிலையை கிரேக்க நிறைவுக்கால வினையின் நுணுக்கத்தோடு வெளிப்படுத்துகிறது.
- source_word: γάλακτος, οὐ στερεᾶς τροφῆς
  choice: திட உணவு அல்ல, பால்
  rationale: ஆசிரியரின் முதிர்ச்சியின்மை–முதிர்ச்சி உருவகத்தை விளக்கிப் பரப்பாமல் அப்படியே பாதுகாக்கிறது.
theological_decisions:
- issue: பாலும் திட உணவும் என்ற உருவக எதிர்மறை
  choice: ஆவிக்குரிய போதனையில் முதிர்ச்சியின்மையையும் முதிர்ச்சியையும் சுட்டும் உருவகமாக அப்படியே வைக்கப்பட்டது.
  alternative: ‘அடிப்படைப் போதனை’ மற்றும் ‘மேம்பட்ட போதனை’ என்று வெளிப்படையாகப் பொருளுரைத்தல்.
  rationale: வசனம் குறிப்பிட்ட ஒரு கோட்பாட்டு பாடத்திட்டத்தை வரையறுக்கவில்லை; ஆகவே உருவகத்தைப் பாதுகாப்பது ஆசிரியரின் சொல்லாற்றலையும் உரையிலுள்ள திறந்த தன்மையையும் காக்கிறது.
- issue: λόγια τοῦ θεοῦ என்பதன் பொருள்
  choice: கடவுளின் அருள்வாக்குகள்
  alternative: கடவுளின் வார்த்தைகள்
  rationale: இது சாதாரணப் பேச்சுச் சொற்களைக் காட்டிலும் கடவுளிடமிருந்து வரும் அதிகாரமுள்ள வாக்குகள் அல்லது வெளிப்பாடுகளைச் சுட்டுகிறது; அதேவேளை குறிப்பிட்ட ஒரு சமய மரபின் தொழில்நுட்பப் பொருளைத் திணிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் கண்டிப்பான தொனியும் பேணப்பட்டுள்ளன. கிரேக்கத்தின் நீண்ட வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டது; ‘அருள்வாக்குகள்’ என்ற சொல் உயர்ந்த தொனியைக் காக்கும் போதும் பொதுவாசகர்களுக்குப் புரியக்கூடியதாக உள்ளது.
