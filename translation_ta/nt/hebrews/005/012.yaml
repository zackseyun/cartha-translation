revisions:
- from: காலம் கடந்துவிட்டதைக் கருத்தில் கொண்டால், நீங்கள் போதகர்களாக இருக்க வேண்டியவர்கள். ஆனால், கடவுளின் அருள்வாக்குகளின் தொடக்கநிலை அடிப்படைகளை[a] ஒருவர் உங்களுக்கு மீண்டும் கற்பிக்க வேண்டிய தேவை உங்களுக்கு இருக்கிறது. திட உணவு அல்ல, பால் தேவைப்படும் நிலைக்கு நீங்கள் வந்துவிட்டீர்கள்[b].
