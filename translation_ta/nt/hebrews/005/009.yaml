revisions:
- from: மேலும், அவர் நிறைவுபெற்றவராக ஆக்கப்பட்டபின்[a], தமக்குக் கீழ்ப்படிகிற அனைவருக்கும் நித்திய மீட்பின் காரணரானார்[b].
  to: மேலும், அவர் நிறைவாக்கப்பட்டபின்[a], தமக்குக் கீழ்ப்படிகிற அனைவருக்கும் நித்திய மீட்பின் காரணமானார்[b].
  rationale: The revision removes an awkward double construction in the rendering of τελειωθείς and replaces a marked agent noun with the natural causal expression ‘காரணமானார்.’ It preserves the Greek sequence, passive/resultative relationship, obedience language, eternal scope, and both correctly anchored footnotes.
