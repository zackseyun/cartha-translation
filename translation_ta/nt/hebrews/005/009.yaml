- source_word: καὶ
  choice: மேலும்
  rationale: முந்தைய கூற்றுடன் உள்ள இணைப்பைக் காக்கிறது; தனித்த வசனமாக வாசிக்கும்போதும் தமிழில் இயல்பாக உள்ளது.
theological_decisions:
- issue: இயேசுவைப் பற்றிய τελειωθεὶς என்பதன் கிறிஸ்துவியல் பொருள்
  choice: ‘நிறைவுபெற்றவராக ஆக்கப்பட்டபின்’ என்று மொழிபெயர்த்து, அவருடைய பணி இலக்கை அடைந்து நிறைவு பெற்றதைக் காட்டுதல்
  alternative: ‘பரிபூரணராக்கப்பட்டபின்’ அல்லது ‘முழுமையாக்கப்பட்டபின்’
  rationale: கிரேக்கச் சொல் உண்மையான செயப்பாட்டையும் நிறைவுறுதலையும் கொண்டுள்ளது; ஆனால் அறநெறிக் குறை திருத்தப்பட்டது என்று அவசியமாகச் சொல்லாது. தேர்ந்த சொற்றொடர் அந்த இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல், ஆசாரிய மற்றும் மீட்புப் பணி நிறைவுக்கு வந்த உணர்வைக் காக்கிறது.
- issue: ‘தமக்குக் கீழ்ப்படிகிற அனைவருக்கும்’ என்பதிலுள்ள வரம்பும் நிபந்தனையும்
  choice: கீழ்ப்படிதல் என்ற சொல்லை வெளிப்படையாக அப்படியே வைத்தல்
  alternative: ‘அவரை நம்புகிற அனைவருக்கும்’ அல்லது ‘அவருக்குச் செவிகொடுக்கிற அனைவருக்கும்’
  rationale: மூல உரை ὑπακούω என நேரடியாகக் கீழ்ப்படிதலைக் கூறுகிறது. அதை நம்பிக்கை என்ற சொல்லாக மாற்றாமலும், குறிப்பிட்ட கோட்பாட்டு அமைப்பாக விரிவாக்காமலும் உள்ளபடியே காக்கப்படுகிறது.
- issue: αἴτιος என்பதன் மீட்பியல் முகமை
  choice: ‘காரணர்’
  alternative: ‘மூலாதாரம்’ அல்லது ‘உருவாக்கியவர்’
  rationale: இயேசு நித்திய மீட்பை விளைவிப்பவர் என்ற காரண முகமையை இச்சொல் நேரடியாகத் தருகிறது; இருப்பினும் அது எவ்வாறு செயல்படுகிறது என்பதை மேலதிக கோட்பாட்டால் நிரப்பவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான திருவிவிலிய நடை. ‘தமக்கு’, ‘காரணர்’, ‘நித்திய’ ஆகியவை மரியாதையையும் உரையின் தெய்வவியல் செறிவையும் காக்கின்றன. இரண்டு அடிக்குறிப்பு குறிகளும் உரையில் உரிய இடங்களில் இடம்பெற்றுள்ளன.
