lexical_decisions:
- source_word: τελειωθεὶς
  choice: நிறைவுபெற்றவராக ஆக்கப்பட்டபின்
  rationale: இறந்தகாலச் செயப்பாட்டு வினையெச்சம். எபிரெயரில் இது அறநெறிக் குறைபாட்டிலிருந்து மேம்படுவதைக் காட்டாமல், குறித்த இலக்குக்கும் ஆசாரிய மற்றும் மீட்புப் பணியின் முழுநிறைவுக்கும் கொண்டுவரப்படுவதைக் குறிக்கிறது. ‘நிறைவுபெற்றவராக ஆக்கப்பட்டபின்’ என்பது செயப்பாட்டு வடிவத்தையும் இலக்குநோக்கிய நிறைவு உணர்வையும் காக்கிறது.
- source_word: ἐγένετο
  choice: ஆனார்
  rationale: முந்தைய நிறைவேற்றத்திற்குப் பின் ஏற்பட்ட நிலை அல்லது பங்கை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: πᾶσιν τοῖς ὑπακούουσιν αὐτῷ
  choice: தமக்குக் கீழ்ப்படிகிற அனைவருக்கும்
  rationale: பயனடைவோரைக் குறிக்கும் வேற்றுமைப் பொருளையும் ὑπακούω என்பதன் ‘கீழ்ப்படிதல்’ உணர்வையும் வெளிப்படையாகக் காக்கிறது. நிகழ்கால வினையெச்சத்தின் தொடர்ச்சியான அல்லது இயல்பான பண்பும் ‘கீழ்ப்படிகிற’ என்பதில் நிலைக்கிறது.
- source_word: αἴτιος
  choice: காரணர்
  rationale: αἴτιος என்பது ஒன்றை விளைவிப்பவர் அல்லது அதற்குப் பொறுப்பானவர் என்பதைக் குறிக்கிறது. ‘காரணர்’ causal agency-ஐத் தெளிவாகக் காட்டுகிறது; ‘ஆதாரம்’ என்பது மூலவளத்தைப் போலவும் ‘ஆசிரியர்’ என்பது எழுத்தாளரைப் போலவும் தவறாகப் புரியலாம்.
- source_word: σωτηρίας
  choice: மீட்பு
  rationale: எபிரெயர் நிருபத்தின் இரட்சிப்பியல் சூழலில் σωτηρία குறிக்கும் விடுதலை மற்றும் காப்பை நவீனத் தமிழில் ‘மீட்பு’ இயல்பாகவும் தெய்வவியல் நிறையுடனும் தருகிறது.
- source_word: αἰωνίου
