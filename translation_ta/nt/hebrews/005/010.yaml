  source_fidelity: வரைவின் ‘கடவுளால் அறிவிக்கப்பட்டார்’ என்பது προσαγορευθεὶς என்பதன் செயப்பாட்டுத் தன்மையையும், இச்சூழலில் உள்ள அதிகாரபூர்வமான பெயரிடுதல்/அறிவித்தல் பொருளையும் பொருத்தமாகக் காட்டுகிறது. ‘கடவுளால்’ ὑπὸ τοῦ θεοῦ என்பதற்கு நேர்மையானது. ஆனால் τὴν τάξιν என்பது இங்கே ஒரு நடைமுறை அல்லது செயல்முறை அல்ல; மெல்கிசேதேக்குடன் தொடர்புடைய ஆசாரிய வரிசை/வகையைக் குறிக்கிறது. எனவே ‘முறைமை’ என்பதற்குப் பதில் ‘வரிசை’ மிகத் துல்லியமானது.
