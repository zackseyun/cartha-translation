  text: having been designated by God as a high priest according to the order of Melchizedek[a][b].
translation:
  language: ta
  text: மெல்கிசேதேக்கின் வரிசையின்படி தலைமை ஆசாரியர் என்று கடவுளால் அறிவிக்கப்பட்டார்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளால் தலைமை ஆசாரியர் என்று அழைக்கப்பட்டார்” அல்லது “கடவுளால் தலைமை ஆசாரியராக நியமிக்கப்பட்டார்.”
    reason: lexical_alternative
  - marker: b
    text: இது சங்கீதம் 110:4-ஐ எதிரொலிக்கிறது; அங்கு ஆசாரியத்துவம் “மெல்கிசேதேக்கின் வரிசையின்படி” என்று கூறப்படுகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: προσαγορευθεὶς
  choice: அறிவிக்கப்பட்டார்
  rationale: இறந்தகாலச் செயல்பாட்டு வாய்பாட்டு வினையெச்சமான இச்சொல், கடவுள் இயேசுவைத் தலைமை ஆசாரியர் என்று பெயரிட்டு அல்லது அதிகாரபூர்வமாக அறிவித்த செயலைக் குறிக்கிறது. ‘அறிவிக்கப்பட்டார்’ என்பது செயப்பாட்டு வினையின் தன்மையைப் பேணுகிறது; ‘நியமிக்கப்பட்டார்’ என்பதில் மூலச்சொல்லைவிட வலுவான பதவியேற்புப் பொருள் தோன்றக்கூடும்.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: கடவுளால்
  rationale: ὑπό உடன் வரும் உரிமை வேற்றுமை, செயப்பாட்டு அமைப்பில் செய்பவரைக் குறிக்கிறது. மூலத்தில் ‘கடவுள்’ என்று மட்டுமே உள்ளதால் ‘பிதாவாகிய கடவுள்’ என்று விரிவாக்கப்படவில்லை.
- source_word: ἀρχιερεὺς
  choice: தலைமை ஆசாரியர்
  rationale: இது ἀρχιερεύς என்பதற்கான இயல்பான தமிழ் இணை. தமிழில் தனி இடைச்சொல் தேவையில்லாமல் பதவிப் பெயராக இயல்பாக வருகிறது.
- source_word: κατὰ
  choice: …இன்படி
  rationale: இங்கு κατά ஒத்திசைவு அல்லது ஒரு முன்மாதிரிக்கு ஏற்ற தன்மையைக் குறிக்கிறது. ‘…இன்படி’ தெளிவான, இயல்பான தமிழ் வடிவம்.
- source_word: τὴν τάξιν
  choice: முறைமை
  rationale: எபிரெயர் நிருபத்தில் இச்சொல் வெறும் வரிசையை அல்ல, மெல்கிசேதேக்குடன் தொடர்புடைய ஆசாரியத்துவ வகை அல்லது அமைப்பைக் குறிக்கிறது. ‘முறைமை’ சங்கீதம் 110:4 உடனான கருத்துத் தொடர்பைப் பேணுகிறது; நவீன தமிழிலும் புரிந்துகொள்ளத்தக்கது.
- source_word: Μελχισέδεκ
  choice: மெல்கிசேதேக்கு
  rationale: மூலப் பெயரின் ஒலிபெயர்ப்பு; தமிழில் வேற்றுமை உருபு சேரும் வகையில் ‘மெல்கிசேதேக்கின்’ என்று பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: இவ்வினையெச்சம் இயேசுவின் நிலையில் மாற்றத்தைக் குறிக்கிறதா, அல்லது கடவுளின் பெயரிடுதல்/அறிவித்தலைக் குறிக்கிறதா?
  choice: கடவுளால் அறிவிக்கப்பட்டார்
  alternative: கடவுளால் தலைமை ஆசாரியராக நியமிக்கப்பட்டார்; கடவுளால் தலைமை ஆசாரியர் என்று அழைக்கப்பட்டார்
  rationale: ‘அறிவிக்கப்பட்டார்’ என்பது இயேசுவின் ஆசாரிய நிலையை கடவுள் அதிகாரபூர்வமாக அடையாளப்படுத்தியதை வெளிப்படுத்துகிறது; அதேவேளையில் பதவியேற்பு அல்லது இயல்புநிலை மாற்றம் போன்ற கருத்துகளை மூலத்தைவிட வலுவாகச் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடை. வசனம் முந்தைய கருத்தைத் தொடரும் வாக்கியத் துணுக்காக இருப்பதால், தமிழில் முழுமையான ஓட்டத்திற்கேற்றவாறு செயப்பாட்டு வினை வடிவில் தரப்பட்டுள்ளது. ‘தலைமை ஆசாரியர்’ மற்றும் ‘முறைமை’ ஆகியவை எபிரெயர் நிருபத்தின் ஆசாரியத்துவச் சொற்களஞ்சியத்தைத் தெளிவாகப் பேணுகின்றன.
