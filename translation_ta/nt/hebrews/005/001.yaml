source:
  edition: SBLGNT
  text: Πᾶς γὰρ ἀρχιερεὺς ἐξ ἀνθρώπων λαμβανόμενος ὑπὲρ ἀνθρώπων καθίσταται τὰ πρὸς τὸν θεόν, ἵνα προσφέρῃ δῶρά τε καὶ θυσίας ὑπὲρ ἁμαρτιῶν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/001.yaml
  text: For every high priest[a], being taken from among men, is appointed on behalf of men in the things pertaining to God, so that he may offer both gifts and sacrifices for sins,
translation:
  language: ta
  text: ஏனெனில், ஒவ்வொரு தலைமைக் குருவும் மனிதர்களிடமிருந்து எடுத்துக்கொள்ளப்பட்டு, கடவுளுக்குரிய காரியங்களில் மனிதர்களின் சார்பாக நியமிக்கப்படுகிறார்; பாவங்களுக்காகக் காணிக்கைகளையும் பலிகளையும் செலுத்தும்படியாகவே நியமிக்கப்படுகிறார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς γὰρ ἀρχιερεὺς
  choice: ஏனெனில், ஒவ்வொரு தலைமைக் குருவும்
  rationale: Πᾶς என்ற பகிர்ந்தளிக்கும் ஒருமையை ‘ஒவ்வொரு’ எனவும், γὰρ என்ற விளக்கத் தொடர்பை ‘ஏனெனில்’ எனவும் காட்டுகிறது. ἀρχιερεύς என்பதற்குத் தமிழில் நிலைபெற்ற ‘தலைமைக் குரு’ பயன்படுத்தப்பட்டது.
- source_word: ἐξ ἀνθρώπων λαμβανόμενος
  choice: மனிதர்களிடமிருந்து தேர்ந்தெடுக்கப்பட்டு
  rationale: λαμβανόμενος என்பது செயல்பாட்டு சூழலில் ஒரு குழுவிலிருந்து எடுத்துக்கொள்ளப்படுதல் அல்லது தேர்ந்தெடுக்கப்படுதலைக் குறிக்கும் செயப்பாட்டு வினையெச்சம். இயல்பான தமிழுக்காக ‘தேர்ந்தெடுக்கப்பட்டு’ என வழங்கப்பட்டது; ἀνθρώπων இங்கு மனிதகுலத்தைக் குறிக்கும் பொதுச் சொல்.
- source_word: ὑπὲρ ἀνθρώπων καθίσταται
  choice: மனிதர்களின் சார்பாக நியமிக்கப்படுகிறார்
  rationale: ὑπέρ என்பதன் பிரதிநிதித்துவப் பொருளை ‘சார்பாக’ தெளிவாகக் காட்டுகிறது; καθίσταται என்பது ஓர் அலுவலில் அமர்த்தப்படுதலைக் குறிப்பதால் ‘நியமிக்கப்படுகிறார்’ பொருத்தமானது.
- source_word: τὰ πρὸς τὸν θεόν
  choice: கடவுளுக்குரிய காரியங்களில்
  rationale: கடவுளை நோக்கிய வழிபாடு மற்றும் ஊழியம் சார்ந்த விஷயங்களைக் குறிக்கும் கிரேக்க மரபுத்தொடரை நெருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἵνα προσφέρῃ
  choice: செலுத்தும்படி
  rationale: ἵνα உடன் வரும் நோக்கப் பொருளைத் தமிழில் இயல்பான ‘-ும்படி’ அமைப்பு வெளிப்படுத்துகிறது.
- source_word: δῶρά τε καὶ θυσίας
  choice: காணிக்கைகளையும் பலிகளையும்
  rationale: τε καὶ இணைக்கும் இரு வழிபாட்டுச் சொற்களையும் தனித்தனியாகப் பாதுகாக்கிறது. δῶρα என்பதற்கு இச்சூழலில் ‘காணிக்கைகள்’ இயல்பானது.
- source_word: ὑπὲρ ἁμαρτιῶν
  choice: பாவங்களுக்காக
  rationale: பலியிடும் சூழலில் ὑπέρ + ἁμαρτιῶν என்பதன் தொடர்பு அல்லது நிவாரண நோக்கைத் தீர்மானிக்காமல், இயல்பான தமிழில் ‘பாவங்களுக்காக’ எனப் பாதுகாக்கிறது.
theological_decisions:
- issue: ἀνθρώπων என்பதிலுள்ள இலக்கணப் பால் மற்றும் பிரதிநிதித்துவப் பொருள்
  choice: இரு இடங்களிலும் ‘மனிதர்கள்’
  alternative: ‘ஆண்கள்’ அல்லது ‘மனிதர்’
  rationale: கிரேக்க ἄνθρωπος/ἄνθρωποι பொதுவாக மனிதர்களைக் குறிக்கிறது; இவ்வசனத்தில் வரலாற்றுத் தலைமைக் குருக்கள் ஆண்களாயிருந்தாலும், சொல்லின் மைய எதிரெதிர் அமைப்பு மனிதர்களிலிருந்து எடுக்கப்பட்டவர் மனிதர்களுக்காகச் சேவை செய்வதே. ‘ஆண்கள்’ என்று மொழிபெயர்ப்பது கிரேக்கத்தின் பொருள் வரம்பைத் தேவையின்றிக் குறுக்கும்.
- issue: ὑπὲρ ἁμαρτιῶν என்பதன் பலியியல் நுணுக்கம்
  choice: ‘பாவங்களுக்காக’
  alternative: ‘பாவநிவாரணத்திற்காக’
  rationale: ‘பாவநிவாரணத்திற்காக’ என்பது சாத்தியமான இறையியல் விளக்கத்தை வெளிப்படையாகச் சேர்க்கும். மூலத்தின் சுருக்கத்தையும் இறையியல் அழுத்தத்தையும் பாதுகாக்க ‘பாவங்களுக்காக’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. கிரேக்க வாக்கியத்தின் காரணத் தொடர்பு, பிரதிநிதித்துவம், நோக்கம், மற்றும் காணிக்கை–பலி என்ற இரட்டைக் கூறு பாதுகாக்கப்பட்டுள்ளன. அவசியமான மாற்று வாசிப்பு எதுவும் இல்லாததால் அடிக்குறிப்பு சேர்க்கப்படவில்லை.
