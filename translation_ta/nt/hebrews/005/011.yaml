source:
  edition: SBLGNT
  text: Περὶ οὗ πολὺς ἡμῖν ὁ λόγος καὶ δυσερμήνευτος λέγειν, ἐπεὶ νωθροὶ γεγόνατε ταῖς ἀκοαῖς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/011.yaml
  text: About this we have much to say[a], and it is hard to explain[c][b], since you have become dull in hearing.
translation:
  language: ta
  text: இதைக் குறித்து நாம் சொல்ல வேண்டியது நிறைய இருக்கிறது[a]; நீங்கள் கேட்பதில் மந்தமானவர்களாகிவிட்டதால்[c], அதை விளக்கிச் சொல்வது கடினம்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவரைக் குறித்து.” கிரேக்க உறவுப்பெயர் மெல்கிசெதேக்கை நேரடியாகக் குறிக்கக்கூடும்; எனினும் இங்கு பேசப்பட்டுவரும் பொருளை விரிவாகக் குறிப்பதாகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “பொருள் உரைப்பது கடினம்,” “விரித்துரைப்பது கடினம்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “கேட்பதில் சுணக்கமுள்ளவர்களாக.” இச்சொற்றொடர் போதனையைக் கேட்டு ஏற்றுக்கொள்வதில் மெதுவாக அல்லது பதிலளிக்காமல் இருப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ οὗ
  choice: இதைக் குறித்து
  rationale: οὗ என்பது மெல்கிசெதேக்கு என்னும் நபரையோ, முன்பு பேசப்பட்ட பொருளையோ குறிக்கக்கூடும். இங்கு தொடர்ந்து விரிவாக எடுத்துரைக்கப்படவுள்ள பொருளைக் குறிப்பதாக முதன்மை உரை இயல்பாக அமைகிறது; நபரைக் குறிக்கும் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: πολὺς ἡμῖν ὁ λόγος
  choice: நாம் சொல்ல வேண்டியது நிறைய இருக்கிறது
  rationale: ‘நமக்கு உரை மிகுதி’ என்ற சொற்சொல் அமைப்பைத் தவிர்த்து, ஆசிரியர் எடுத்துரைக்க வேண்டியவை பல உள்ளன என்ற பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: δυσερμήνευτος λέγειν
  choice: விளக்கிச் சொல்வது கடினம்
  rationale: δυσερμήνευτος என்பதிலுள்ள விளக்குதல் அல்லது பொருள் உரைத்தல் என்ற கருத்தையும், λέγειν என்பதிலுள்ள சொல்லுதல் என்ற கருத்தையும் சேர்த்துப் பாதுகாக்கிறது.
- source_word: ἐπεὶ
  choice: —தால்
  rationale: விளக்குவது ஏன் கடினம் என்பதற்கான காரணத்தைத் தெளிவாகக் காட்டும் இயல்பான தமிழ்க் காரண விகுதி.
- source_word: νωθροὶ
  choice: மந்தமானவர்களாக
  rationale: போதனையை ஏற்றுக்கொள்வதில் ஏற்பட்ட சுணக்கம் அல்லது பதிலளிக்காத தன்மையை ‘மந்தமானவர்கள்’ இயல்பாக வெளிப்படுத்துகிறது; வெறும் அறிவுத்திறன் குறைவு என்று பொருள்படாமல் இருக்கிறது.
- source_word: γεγόνατε
  choice: ஆகிவிட்டதால்
  rationale: அவர்கள் இப்படிப்பட்ட நிலையில் வந்து, இப்போது அதில் இருக்கிறார்கள் என்ற நிறைவுற்ற வினையின் விளைவு நிலையைக் காட்டுகிறது.
- source_word: ταῖς ἀκοαῖς
  choice: கேட்பதில்
  rationale: உடலுறுப்பான காதுகளை மட்டும் அல்லாமல், போதனையைக் கவனித்துக் கேட்டு ஏற்றுக்கொள்வதைக் குறிக்கும் உருவகத்தைச் சுருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: Περὶ οὗ என்பதன் குறிப்பு
  choice: முதன்மை உரையில், விவாதிக்கப்படும் பொருளைக் குறிக்கும் ‘இதைக் குறித்து’
  alternative: மெல்கிசெதேக்கு என்னும் நபரைக் குறிக்கும் ‘இவரைக் குறித்து’
  rationale: உடனடி முன்னுரையில் மெல்கிசெதேக்கு குறிப்பிடப்படுவதால் நபரைக் குறிக்கும் வாசிப்பு இலக்கணப்படி சாத்தியம். ஆயினும், அடுத்து விரிவாகக் கற்பிக்க வேண்டிய பொருளை அறிமுகப்படுத்தும் உரையோட்டத்தில் ‘இதைக் குறித்து’ இயல்பாக உள்ளது. மாற்று வாசிப்பை அடிக்குறிப்பு வெளிப்படையாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. அரைப்புள்ளி கிரேக்க வாக்கியத்தின் இரு பகுதிகளையும் இணைக்கிறது; காரணத் தொடர்பு ‘—தால்’ மூலம் தெளிவாக உள்ளது. மூலத்தில் உள்ள குறிப்பு ambiguity அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
