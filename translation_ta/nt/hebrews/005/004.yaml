  text: καὶ οὐχ ἑαυτῷ τις λαμβάνει τὴν τιμήν, ἀλλὰ καλούμενος ὑπὸ τοῦ θεοῦ, ⸀καθώσπερ καὶ Ἀαρών.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/004.yaml
  text: And no one takes this honor for himself[a], but is called by God, just as Aaron also was.
translation:
  language: ta
  text: இந்தக் கண்ணியத்தை எவரும் தாமாக எடுத்துக்கொள்வதில்லை; மாறாக, கடவுளால் அழைக்கப்பட்டவராகவே பெறுகிறார்; ஆரோனும் அப்படியே அழைக்கப்பட்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் ‘அந்தக் கண்ணியம்’ என்று திட்டவட்டக் குறிப்புடன் உள்ளது. சூழலில் இது தலைமைக் குருவுக்குரிய கண்ணியமிக்க நிலையைச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ... τις
  choice: எவரும் ... இல்லை
  rationale: மறுப்புடன் வரும் τις என்பதை நவீன தமிழில் இயல்பான பொதுமறுப்பாகத் தருகிறது.
- source_word: ἑαυτῷ
  choice: தாமாக
  rationale: ஒருவர் இந்த நிலையைத் தாமே ஏற்றுக்கொள்வது அல்லது தமக்கென உரிமைப்படுத்துவது என்ற தற்சார்பு நுணுக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: λαμβάνει
  choice: எடுத்துக்கொள்வதில்லை
  rationale: கடவுளின் அழைப்புக்கு மாறாக, மகிமையை ஒருவர் தாமே ஏற்றுக்கொள்ள முடியாது என்பதைக் காட்டுகிறது; ‘பெற்றுக்கொள்வதில்லை’ என்பதைவிட தற்சார்பு ஏற்றலைத் தெளிவாக உணர்த்துகிறது.
- source_word: τὴν τιμήν
  choice: இந்த மகிமையை
  rationale: τιμή என்பதன் நேரடியான பொருளைத் தக்கவைத்து, உடனடிச் சூழலில் கூறப்படும் தலைமைக் குருவின் கண்ணியமிக்க நிலையை ‘இந்த’ எனச் சுட்டுகிறது.
- source_word: καλούμενος ὑπὸ τοῦ θεοῦ
  choice: கடவுளால் அழைக்கப்படுகிறார்
  rationale: இறைவினைச் செயப்பாட்டு வடிவையும் அழைப்பின் தெய்வீக மூலத்தையும் பாதுகாக்கிறது.
- source_word: καθώσπερ καὶ Ἀαρών
  choice: ஆரோனைப்போல அவரும்
  rationale: καθώσπερ இன் ஒப்பீட்டையும் καί இன் ‘அவரும்’ நுணுக்கத்தையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; விடுபட்ட வினைச்சொல் பின்னர் நிறைவு செய்யப்படுகிறது.
theological_decisions:
- issue: குருத்துவ மகிமையைப் பெறும் விதம்
  choice: இந்த மகிமை தானாக ஏற்றுக்கொள்ளப்படுவதல்ல; ஆரோனைப்போல ஒருவர் கடவுளால் அழைக்கப்படுகிறார்.
  alternative: இது பொதுவான எந்த மகிமையையும் குறிக்கும் கூற்றாக மொழிபெயர்க்கப்படலாம்.
  rationale: எபிரெயர் 5:1–5 இன் உடனடிச் சூழல் தலைமைக் குருத்துவத்தைப் பற்றியது. எனினும் τιμή என்பதை நேரடியாக ‘பதவி’ என்று விளக்காமல் ‘மகிமை’ என வைத்து, சூழல் தரும் பொருளை நிலைநிறுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை. ‘மகிமை’ என்பது குருத்துவப் பதவியின் கண்ணியத்தைக் குறிக்கச் சூழலால் நிர்ணயிக்கப்படுகிறது; குறிப்பை விளக்கும் அடிக்குறிப்பு வாக்கியத்தின் முடிவில் வைக்கப்பட்டுள்ளது.
