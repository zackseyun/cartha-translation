id: HEB.5.5
reference: Hebrews 5:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Οὕτως καὶ ὁ Χριστὸς οὐχ ἑαυτὸν ἐδόξασεν γενηθῆναι ἀρχιερέα, ἀλλ’ ὁ λαλήσας πρὸς αὐτόν· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/005.yaml
  text: 'So also the Messiah did not glorify himself to become high priest[a], but the one who spoke to him: “You are my Son[c][b]; today I have begotten you.”'
translation:
  language: ta
  text: 'அவ்வாறே மெசியாவும்[a] தலைமைக் குருவாக ஆகும்படி தம்மைத் தாமே மகிமைப்படுத்திக்கொள்ளவில்லை[b]. மாறாக, அவரிடம்,


    “நீர் என் மகன்;

    இன்று நான் உம்மைப் பிறப்பித்தேன்”[c]


    என்று சொன்னவரே அவரைத் தலைமைக் குருவாக மகிமைப்படுத்தினார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்து.” கிரேக்கச் சொல் Χριστός இங்கு தனிப்பெயரைவிட ஒரு பட்டமாகப் பயன்படுவதால் “மெசியா” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: “தம்மைத் தாமே கனப்படுத்திக்கொள்ளவில்லை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: சங்கீதம் 2:7-இலிருந்து மேற்கோள்.
    reason: cross_reference
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: அவ்வாறே ...வும்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட இறை நியமனத்தோடு ஒப்பிடும் தொடர்ச்சியையும் வலியுறுத்தலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὁ Χριστὸς
  choice: மெசியா
  rationale: இங்கு Χριστός ஒரு தனிப்பெயர்போல அல்லாமல், கடவுளால் நியமிக்கப்பட்ட பதவியைக் குறிக்கும் பட்டமாகச் செயல்படுகிறது; எனவே அதன் பட்டப்பொருளைத் தெளிவாக வைத்திருக்கிறது.
- source_word: οὐχ ἑαυτὸν ἐδόξασεν
  choice: தம்மைத் தாமே மகிமைப்படுத்திக்கொள்ளவில்லை
  rationale: δοξάζω என்பதிலுள்ள ‘மகிமைப்படுத்து’ என்ற முதன்மைப் பொருளையும், ἑαυτόν என்பதிலுள்ள தற்சுட்டுப் பொருளையும் காக்கிறது. மரியாதையைக் குறிக்கும் ‘தம்’ வடிவம் தமிழில் இயல்பாக உள்ளது.
- source_word: γενηθῆναι ἀρχιερέα
  choice: தலைமைக் குருவாவதற்காக
  rationale: γενηθῆναι ஒரு பதவி அல்லது நிலைக்கு வருவதைக் குறிக்கிறது. ἀρχιερεύς என்பதற்கு ‘தலைமைக் குரு’ என்பது நவீன, தெளிவான, சமயப் பிரிவுச் சார்பற்ற தமிழ்.
- source_word: ἀλλ’ ὁ λαλήσας πρὸς αὐτόν
  choice: மாறாக, அவரிடம் ... என்று சொன்னவரே அவரை மகிமைப்படுத்தினார்
  rationale: கிரேக்கத்தில் விடுபட்டுள்ள எதிர்மறை வாக்கியத்தின் செயலைத் தமிழில் தெளிவாக நிரப்புகிறது. செய்பவர் யார் என்பதைப் பெயரிட்டு விளக்காமல், மூலத்தின் மறைமுகக் குறிப்பைத் தக்கவைக்கிறது.
- source_word: Υἱός μου εἶ σύ
  choice: நீர் என் மகன்
  rationale: தமிழின் இயல்பான சொல் வரிசையில் நேரடி அறிவிப்பை வழங்குகிறது; ‘நீர்’ என்பது கண்ணியமான ஒருமை அழைப்பு.
- source_word: ἐγὼ σήμερον γεγέννηκά σε
  choice: இன்று நான் உம்மைப் பெற்றெடுத்தேன்
  rationale: γεννάω என்பதன் பிறப்பித்தல்/பெற்றெடுத்தல் உருவகத்தை விளக்கவுரை இன்றி காக்கிறது. இதை அரியணையேற்றம், உயிர்த்தெழுதல் அல்லது நித்தியப் பிறப்பு என்று மொழிபெயர்ப்பிலேயே தீர்மானிப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு இந்தச் சொல் நியமிக்கப்பட்ட பதவியைப் பற்றிய வாதத்தில் பட்டமாகப் பயன்படுகிறது; ‘மெசியா’ அதன் பட்டப்பொருளைக் காக்கிறது.
- issue: “இன்று நான் உம்மைப் பெற்றெடுத்தேன்” என்பதன் கிறிஸ்துவியல் பொருள்
  choice: சங்கீத மேற்கோளை விளக்கவுரை சேர்க்காமல் நேரடியாகத் தக்கவைத்தல்
  alternative: அரியணையேற்றம், உயிர்த்தெழுதல் அல்லது நித்தியப் பிறப்பு என்று பொருளை முதன்மை உரையிலேயே குறிப்பாக்குதல்
  rationale: மேற்கோள் தானாகக் கூறும் உருவகத்தையும் அதன் இறையியல் அழுத்தத்தையும் காத்து, பிற்கால விளக்கங்களில் ஒன்றை மொழிபெயர்ப்பு கட்டாயப்படுத்தாமல் விடுகிறது.
- issue: எதிர்மறை வாக்கியத்தில் விடுபட்ட செயற்பாடு
  choice: “சொன்னவரே அவரை மகிமைப்படுத்தினார்” என்று இயல்பாக நிரப்புதல்
  alternative: “ஆனால் அவரிடம் சொன்னவர்” என்று இலக்கண ரீதியில் முழுமையற்ற நிலையில் விடுதல்
  rationale: கிரேக்கத்தில் சூழலால் புரியும் விடுபாடு தமிழில் நிரப்பப்பட வேண்டும்; இது செய்பவரின் பெயரைச் சேர்க்காமல் கருத்தைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையுடன், பொதுவாக வாசிக்கக்கூடிய கண்ணியமான மொழி பயன்படுத்தப்பட்டுள்ளது. ‘பிரதான ஆசாரியர்’ போன்ற மரபுவழிச் சமயச் சொற்றொடருக்குப் பதிலாகத் தெளிவான ‘தலைமைக் குரு’ தேர்ந்தெடுக்கப்பட்டுள்ளது. கவிதை மேற்கோள் தனி வரிகளாக அமைக்கப்பட்டுள்ளது; இறைமகனை நோக்கிய நேரடி உரையில் கண்ணிய ஒருமை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
