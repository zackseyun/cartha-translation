  source_fidelity: மொத்தத்தில் மூலக் கிரேக்கத்தின் ஒப்புமை, தற்சுட்டு மறுப்பு, தலைமைக் குருப் பதவி, மற்றும் சங்கீத மேற்கோள் ஆகியவை நன்றாகக் காக்கப்பட்டுள்ளன. ஆனால் “தலைமைக் குருவாவதற்காக” என்பதை “தலைமைக் குருவாக ஆகும்படி” என அமைப்பது γενηθῆναι-யின் நோக்க/நிலைக்கு வருதல் என்ற கருத்தைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்தும். எதிர்மறைத் தொடரில் கிரேக்கத்தில் சூழலால் விடுபட்ட செயலை ‘மகிமைப்படுத்தினார்’ என நிரப்புவது நியாயமானது; அதைத் தலைமைக் குருப் பதவியோடு இணைப்பது வாதத்தின் பொருளைத் தெளிவாக்குகிறது.
  naturalness: ‘அவ்வாறே’, ‘மெசியா’, ‘தம்மைத் தாமே’, ‘மாறாக’ ஆகியவை நவீன தரநிலைத் தமிழில் கண்ணியமாகவும் இயல்பாகவும் உள்ளன. மேற்கோளில் “இன்று நான் உம்மைப் பெற்றெடுத்தேன்” என்பதற்குப் பதில் “இன்று நான் உம்மைப் பிறப்பித்தேன்” என்பது நவீனத் தமிழில் செய்பவரின் செயலை இன்னும் நேரடியாகக் குறிக்கும்; இருப்பினும் இரு வடிவங்களும் சங்கீத மேற்கோளின் உருவகத்தைப் பாதுகாக்கின்றன.
