  to: 'அவ்வாறே மெசியாவும்[a] தலைமைக் குருவாக ஆகும்படி தம்மைத் தாமே மகிமைப்படுத்திக்கொள்ளவில்லை[b]. மாறாக, அவரிடம்,


    “நீர் என் மகன்;

    இன்று நான் உம்மைப் பிறப்பித்தேன்”[c]


    என்று சொன்னவரே அவரைத் தலைமைக் குருவாக மகிமைப்படுத்தினார்.'
  rationale: சிறிய நடையியல் மற்றும் துல்லியத் திருத்தங்கள் மட்டுமே செய்யப்பட்டுள்ளன. பதவிக்கு வருதலைக் குறிக்கும் கிரேக்க வினைச்சொல்லின் நுணுக்கம் தெளிவுபடுத்தப்பட்டுள்ளது; மேலும், மூலத்தில் சூழலால் விடுபட்டுள்ள ‘மகிமைப்படுத்தினார்’ என்ற செயல் தலைமைக் குருப் பதவியுடன் இணைக்கப்பட்டுள்ளது. சங்கீத மேற்கோளின் இறையியல் தெளிவின்மை எந்த விளக்கத்தாலும் தீர்மானிக்கப்படவில்லை.
