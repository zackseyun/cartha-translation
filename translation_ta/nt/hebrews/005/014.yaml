base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/014.yaml
  text: But solid food is for the mature[b][a], who because of practice have their powers of discernment trained to distinguish both good and evil.
translation:
  language: ta
  text: ஆனால் திட உணவு முதிர்ச்சியடைந்தவர்களுக்குரியது. அவர்கள் தொடர்ந்து பழகியதால்[a], நன்மையையும் தீமையையும் பகுத்தறிய அவர்களுடைய புலனுணர்வுத் திறன்கள்[b] பயிற்சி பெற்றிருக்கின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பழக்கத்தினால்” அல்லது “தொடர்ந்த பயன்பாட்டினால்.”
    reason: lexical_alternative
  - marker: b
    text: நேர்ச்சொல்லாக, “புலன்கள்”; இங்கு ஒருவருடைய உணர்ந்து பகுத்தறியும் திறன்களை உருவகமாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τελείων
  choice: முதிர்ச்சியடைந்தவர்கள்
  rationale: முந்தைய வசனத்தில் வரும் குழந்தைகளுக்கு எதிர்மாறாக, வளர்ச்சியில் முதிர்ந்தவர்களைக் குறிக்கிறது; பாவமற்ற பரிபூரணத்தைக் குறிப்பதாகத் தேவையின்றி உணர்த்துவதைத் தவிர்க்கிறது.
- source_word: στερεὰ τροφή
  choice: திட உணவு
  rationale: பாலுக்கு எதிரான, அதிகச் செறிவுள்ள உணவு என்ற உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: διὰ τὴν ἕξιν
  choice: தொடர்ந்து பழகியதால்
  rationale: ἕξις என்பதன் பழக்கம், பயிற்சி, தொடர்ந்த பயன்பாடு ஆகிய பொருள்களையும் διὰ என்பதன் காரணத் தொடர்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὰ αἰσθητήρια
  choice: புலனுணர்வுத் திறன்கள்
  rationale: சொற்பொருளில் புலன்கள் அல்லது உணர்வுக் கருவிகள்; இங்கு நன்மை தீமையை உணரும் உள்ளார்ந்த திறன்களைக் குறிக்கும் உருவகப் பயன்பாட்டைத் தக்கவைக்கிறது.
- source_word: γεγυμνασμένα ἐχόντων
  choice: பயிற்சி பெற்றிருக்கின்றன
  rationale: பயிற்சியின் விளைவாக நிலைபெற்றுள்ள திறன்களை perfect passive participle சுட்டுவதைக் காட்டுகிறது.
- source_word: πρὸς διάκρισιν
  choice: பகுத்தறிய
  rationale: நோக்கம் அல்லது விளைவைக் காட்டும் πρός உடன் வரும் διάκρισις என்பதன் வேறுபடுத்தி அறிதல் என்ற பொருளைச் சுருக்கமாக வழங்குகிறது.
- source_word: καλοῦ τε καὶ κακοῦ
  choice: நன்மையையும் தீமையையும்
  rationale: τε καὶ குறிக்கும் இணையான இரு கூறுகளையும் தமிழின் ‘-யும் ... -யும்’ அமைப்பால் இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: δέ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தின் பால்/குழந்தை கருத்துடன் உள்ள முரண்பாட்டைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: ஆவிக்குரிய வளர்ச்சிச் சூழலில் τελείων என்பதன் பொருள்
  choice: முதிர்ச்சியடைந்தவர்கள்
  alternative: பூரணமானவர்கள்
  rationale: சூழல் ஒழுக்கரீதியாகக் குறையற்ற ஒரு பிரிவினரை அல்ல, பகுத்தறிவில் வளர்ந்தவர்களைக் குழந்தைகளுடன் ஒப்பிட்டு விவரிக்கிறது; ஆகவே உரை கோராத பூரணவாதக் கருத்தைச் சேர்க்காமல் வளர்ச்சியின் முதிர்ச்சியை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையானதும் சாதாரண வாசகர்களுக்குப் புரியக்கூடியதுமான நடை. மூலத்தின் உணவு உருவகமும், புலன்கள் குறித்த உருவகப் பயன்பாடும் காக்கப்பட்டுள்ளன.
