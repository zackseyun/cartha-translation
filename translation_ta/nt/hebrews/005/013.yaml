source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ μετέχων γάλακτος ἄπειρος λόγου δικαιοσύνης, νήπιος γάρ ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/013.yaml
  text: For everyone who partakes of milk is unskilled in the word of righteousness[b][a], for he is an infant.
translation:
  language: ta
  text: ஏனெனில், பால் அருந்துகிற ஒவ்வொருவரும் நீதியைப் பற்றிய செய்தியில்[a] தேர்ச்சியற்றவராக இருக்கிறார்; ஏனெனில், அவர் கைக்குழந்தையாக இருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீதியின் செய்தியில்” அல்லது “நீதியைப் பற்றிய வார்த்தையில்.”
    reason: λόγου δικαιοσύνης என்ற கிரேக்கத் தொடரில் λόγος ‘வார்த்தை’ அல்லது ‘செய்தி’ எனவும், δικαιοσύνης உடனான அதன் தொடர்பு ‘நீதியின்’ அல்லது ‘நீதியைப் பற்றிய’ எனவும் புரிந்துகொள்ளப்படலாம்.
lexical_decisions:
- source_word: πᾶς ... ὁ μετέχων
  choice: உட்கொள்கிற ஒவ்வொருவரும்
  rationale: பெயர்ச்சொல் செயல்பாட்டிலுள்ள பங்கேற்புவினையையும் பகிர்ந்தளிக்கும் πᾶς என்பதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; பால் அருந்தும் உருவகத்தையும் காக்கிறது.
- source_word: γάλακτος
  choice: பாலை
  rationale: சூழலில் ஏற்கெனவே நிலைநிறுத்தப்பட்ட கற்பித்தல் உருவகத்தை விளக்கவுரையாக்காமல் நேரடியாகத் தக்கவைக்கிறது.
- source_word: ἄπειρος
  choice: அனுபவமற்றவர்
  rationale: முற்றிலும் அறியாதவர் என்பதைக் காட்டிலும் அனுபவமும் தேர்ச்சியும் இல்லாத நிலையைக் குறிக்கும் கிரேக்கச் சொல்லின் நுட்பத்தைப் பாதுகாக்கிறது.
- source_word: λόγου δικαιοσύνης
  choice: நீதியைப் பற்றிய வார்த்தையில்
  rationale: λόγος என்பதை ‘வார்த்தை’ என்றும், மரபுத்தொடரின் தொடர்பை ‘பற்றிய’ என்றும் வழங்குவது தமிழில் புரியத்தக்கதாக இருந்து, செய்தி அல்லது போதனை என்ற பரப்பையும் திறந்தே வைக்கிறது.
- source_word: δικαιοσύνης
  choice: நீதியை
  rationale: தமிழில் ‘நீதி’ என்பது righteousness மற்றும் justice ஆகிய தொடர்புடைய கருத்துகளைச் சூழலுக்கு ஏற்ற dignified வடிவில் தாங்க முடியும்; கிரேக்கப் பதத்தின் பரப்பை தேவையின்றி குறுக்கவில்லை.
- source_word: νήπιος
  choice: கைக்குழந்தை
  rationale: பரந்த ‘குழந்தை’ என்பதைக் காட்டிலும் பாலுண்ணும் முதிர்ச்சியற்ற குழந்தை என்ற கூர்மையான உருவகத்தைத் தக்கவைக்கிறது.
- source_word: γάρ
  choice: ஏனெனில்
  rationale: இரண்டாவது γάρ முன்னைய கூற்றிற்கான காரணத்தைச் சொல்வதைத் தெளிவாகக் காட்டுகிறது; முதல் γάρ வசனத்திற்கு முந்தைய சூழலோடு உள்ள இணைப்பு என்பதால் தனிவசனத் தமிழில் வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை.
theological_decisions:
- issue: λόγου δικαιοσύνης என்பதன் தொடர்பு
  choice: நீதியைப் பற்றிய வார்த்தை
  alternative: நீதியின் வார்த்தை; நீதியைப் பற்றிய செய்தி
  rationale: கிரேக்க மரபுத்தொடர் ‘நீதியைப் பற்றிய சொல்/செய்தி’ அல்லது ‘நீதியின் வார்த்தை’ எனப் புரியக்கூடியது. முதன்மை உரை இயல்பான தமிழைத் தேர்ந்தெடுக்கிறது; அடிக்குறிப்பு உண்மையான மாற்றுவாய்ப்பைத் தக்கவைக்கிறது.
- issue: δικαιοσύνη என்பதன் பொருள்
  choice: நீதி
  alternative: நேர்மை; நீதியான நிலை
  rationale: இங்கு ஆன்மிக முதிர்ச்சியும் போதனையும் சார்ந்த சூழல் இருந்தாலும், சொல்லை ஒரு குறிப்பிட்ட இரட்சிப்பியல் கோட்பாட்டுக்குள் குறுக்காமல் ‘நீதி’ என வழங்கப்பட்டுள்ளது.
- issue: νήπιος ... ἐστιν என்பதில் பாலினக் குறிப்பு
  choice: அவர் கைக்குழந்தையாக இருக்கிறார்
  alternative: அத்தகையவர் கைக்குழந்தை
  rationale: கிரேக்க ஆண்பால் ஒருமை பொதுப்பொருளில் வருகிறது. தமிழ் ‘அவர்’ இயல்பாகவும் மரியாதையுடனும் இருந்து, தேவையற்ற ஆண்-பெண் வரையறையை இறக்குமதி செய்யாமல் தனிநபர் குறிப்பைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘கைக்குழந்தை’ பால் உருவகத்தையும் முதிர்ச்சியின்மையையும் இணைக்கிறது.
