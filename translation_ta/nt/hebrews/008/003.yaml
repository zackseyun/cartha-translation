revisions:
- from: ஏனெனில், ஒவ்வொரு தலைமைக் குருவும் காணிக்கைகளையும் பலிகளையும் செலுத்துவதற்காக நியமிக்கப்படுகிறார். ஆகவே, இவரும் செலுத்துவதற்கு ஏதாவது ஒன்றைக் கொண்டிருக்க வேண்டியது அவசியம்.[a]
  to: ஏனெனில், ஒவ்வொரு தலைமை ஆசாரியரும் காணிக்கைகளையும் பலிகளையும் செலுத்துவதற்காக நியமிக்கப்படுகிறார்; ஆகவே, இவரும் செலுத்துவதற்கு ஏதாவது ஒன்றைக் கொண்டிருக்க வேண்டியது அவசியம்.[a]
