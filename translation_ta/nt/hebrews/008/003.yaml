reference: Hebrews 8:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πᾶς γὰρ ἀρχιερεὺς εἰς τὸ προσφέρειν δῶρά τε καὶ θυσίας καθίσταται· ὅθεν ἀναγκαῖον ἔχειν τι καὶ τοῦτον ὃ προσενέγκῃ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/003.yaml
  text: For every high priest is appointed to offer both gifts and sacrifices[a]; therefore it is necessary for this one also to have something that he may offer.
translation:
  language: ta
  text: ஏனெனில், ஒவ்வொரு தலைமை ஆசாரியரும் காணிக்கைகளையும் பலிகளையும் செலுத்துவதற்காக நியமிக்கப்படுகிறார்; ஆகவே, இவரும் செலுத்துவதற்கு ஏதாவது ஒன்றைக் கொண்டிருக்க வேண்டியது அவசியம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆகவே, இவருக்கும் செலுத்துவதற்கு ஏதாவது ஒன்று இருப்பது அவசியம்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடர் இவரது அடையாளத்தை வெளிப்படையாகக் குறிப்பிடவில்லை; சூழலில் ‘இவர்’ என்பது தலைமை ஆசாரியராகிய இயேசுவைக் குறிக்கிறது.
    reason: சொற்றொடர் அமைப்பின் மாற்று மொழிபெயர்ப்பையும், சுட்டுப்பெயரின் சூழல்சார் பொருளையும் விளக்குகிறது.
lexical_decisions:
- source_word: πᾶς γὰρ ἀρχιερεὺς
  choice: ஏனெனில், ஒவ்வொரு தலைமைக் குருவும்
  rationale: πᾶς உடன் ஒருமை பெயர்ச்சொல் வருவதால் ‘ஒவ்வொரு’ என்ற பகிர்ந்தளிக்கும் பொருள் வெளிப்படுகிறது. γάρ முந்தைய வசனத்துடனான விளக்கத் தொடர்பைக் காட்ட ‘ஏனெனில்’ என மொழிபெயர்க்கப்பட்டது. ἀρχιερεύς என்பதற்கு எபிரெயர் கடிதத்தின் ஆசாரியச் சூழலில் ‘தலைமைக் குரு’ துல்லியமான இயல்பான சொல்.
- source_word: εἰς τὸ προσφέρειν
  choice: செலுத்துவதற்காக
  rationale: εἰς உடன் வரும் பெயராக்கப்பட்ட வினையெச்சம் நோக்கத்தைக் குறிக்கிறது; ‘செலுத்துவதற்காக’ அந்த நோக்கப் பொருளை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: δῶρά τε καὶ θυσίας
  choice: காணிக்கைகளையும் பலிகளையும்
  rationale: τε καὶ இணைப்பு இரு தனித்த வழிபாட்டுச் சொற்களையும் இணைக்கிறது. δῶρα என்பதற்கு ‘காணிக்கைகள்’, θυσίαι என்பதற்கு ‘பலிகள்’ என்று வேறுபாடு காக்கப்பட்டுள்ளது; ‘-யும் ... -யும்’ அமைப்பு இரண்டையும் உள்ளடக்குகிறது.
- source_word: καθίσταται
  choice: நியமிக்கப்படுகிறார்
  rationale: ஆசாரியப் பணிக்காக ஒருவரை பதவியில் அமர்த்துதல் அல்லது நியமித்தல் என்ற செயப்பாட்டு பொருளை ‘நியமிக்கப்படுகிறார்’ தெளிவாகத் தருகிறது.
- source_word: ὅθεν
  choice: ஆகவே
  rationale: முந்தைய கூற்றிலிருந்து வரும் முடிவை ὅθεν அறிமுகப்படுத்துகிறது; ‘ஆகவே’ அந்தத் தர்க்கத் தொடர்பைத் தெளிவாக்குகிறது.
- source_word: ἀναγκαῖον ἔχειν
  choice: கொண்டிருக்க வேண்டியது அவசியம்
  rationale: இந்தக் கட்டமைப்பு தேவையையோ கட்டாயத்தையையோ குறிக்கிறது. ‘கொண்டிருக்க வேண்டியது அவசியம்’ என்பது தமிழில் இயல்பாகவும் மூலத்தின் பொருளுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: τι
  choice: ஏதாவது ஒன்று
  rationale: குறிப்பிடப்படாத ஒரு பொருளை τι குறிக்கிறது; ‘ஏதாவது ஒன்று’ அதன் வரையறுக்கப்படாத தன்மையைப் பாதுகாக்கிறது.
- source_word: καὶ τοῦτον
  choice: இவரும்
  rationale: τοῦτον என்பதன் சுட்டுப்பொருளை ‘இவர்’ காக்கிறது; καί-இன் சேர்க்கைப் பொருளை ‘-உம்’ வெளிப்படுத்துகிறது. சூழலில் இது இயேசுவைக் குறித்தாலும், மூலத்தில் பெயர் வெளிப்படையாகச் சொல்லப்படாததால் மொழிபெயர்ப்பிலும் சேர்க்கப்படவில்லை.
- source_word: ὃ προσενέγκῃ
  choice: செலுத்துவதற்கு
  rationale: சார்புப்பெயருடன் வரும் இறந்தகாலத் தற்சார்பு வினை, செலுத்துவதற்காகக் கிடைக்கும் ஒன்றைச் சுட்டுகிறது. தமிழில் ‘செலுத்துவதற்கு ஏதாவது ஒன்று’ என்பது அந்த நோக்க அல்லது சாத்தியப் பொருளை இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: τοῦτον (‘இவர்’) என்பதன் சுட்டுப்பொருள்
  choice: முதன்மை உரையில் ‘இவர்’ என வைத்து, சூழலில் அது தலைமைக் குருவாகிய இயேசுவைக் குறிக்கிறது என்பதை அடிக்குறிப்பில் விளக்குதல்.
  alternative: முதன்மை உரையிலேயே ‘இயேசுவும்’ அல்லது ‘கிறிஸ்துவும்’ என்று வெளிப்படையாகச் சேர்த்தல்.
  rationale: உடனடிச் சூழல் இயேசுவையே சுட்டுகிறது; ஆனால் கிரேக்க உரை பெயரைச் சொல்லாமல் சுட்டுப்பெயரைப் பயன்படுத்துகிறது. ஆகவே மூலத்தின் மறைமுகத்தன்மையைப் பாதுகாத்து, வாசகருக்குத் தேவையான சூழல் விளக்கத்தை அடிக்குறிப்பில் தருவது பொருத்தமானது.
- issue: வழிபாட்டு பலி தொடர்பான δῶρα மற்றும் θυσίαι
  choice: ‘காணிக்கைகள்’ மற்றும் ‘பலிகள்’ என்று இரு தனித்த பிரிவுகளாக வைத்தல்.
  alternative: ‘பலிக்காணிக்கைகள்’ என்று ஒன்றிணைத்தல் அல்லது கிறிஸ்துவின் தம்மையே பலியாக அளித்தலை இவ்வசனத்திலேயே விளக்கிச் சேர்த்தல்.
  rationale: வசனம் பொதுவான தலைமைக் குருத்துவக் கோட்பாட்டைக் கூறுகிறது. இரண்டு கிரேக்கச் சொற்களின் வேறுபாட்டைப் பாதுகாப்பது உரையின் துல்லியத்தையும், இவ்விடத்தில் தேவையற்ற இறையியல் விரிவாக்கத்தைத் தவிர்ப்பதையும் உறுதிசெய்கிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘தலைமைக் குரு’, ‘காணிக்கைகள்’, ‘பலிகள்’ ஆகியவை சாதாரண வாசகர்களுக்குப் புரியும் வகையில் வழிபாட்டுச் சொற்களின் துல்லியத்தைப் பாதுகாக்கின்றன. சுட்டுப்பெயரின் மூலமொழி மறைமுகத்தன்மை முதன்மை உரையில் தக்கவைக்கப்பட்டுள்ளது.
