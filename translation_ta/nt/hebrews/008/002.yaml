  yaml_path: translation/nt/hebrews/008/002.yaml
  text: a minister of the holy places and of the true tabernacle[a], which the Lord set up[b], not man.
translation:
  language: ta
  text: பரிசுத்த இடங்களிலும்[a], ஆண்டவர் அமைத்த உண்மையான திருக்கூடாரத்திலும் திருப்பணி செய்கிறவர்; அதை மனிதன் அமைக்கவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்த ஸ்தலத்தில்.” கிரேக்கச் சொற்றொடர் பன்மை வடிவில் இருந்தாலும், பரிசுத்த இடம் முழுவதையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஆண்டவர் நிறுத்திய, மனிதன் அல்ல.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν ἁγίων
  choice: பரிசுத்த இடங்களில்
  rationale: பன்மையில் பெயர்ச்சொல்லாகப் பயன்படும் இந்தச் சொற்றொடர், எபிரெயர் நூலின் ஆசாரிய மற்றும் வழிபாட்டுச் சூழலில் பரலோகப் பரிசுத்த இடங்களைக் குறிக்கிறது; பரிசுத்த மக்களைக் குறிப்பதாக எடுத்துக்கொள்ளப்படவில்லை. மூலத்தின் பன்மையும் காக்கப்படுகிறது.
- source_word: λειτουργὸς
  choice: திருப்பணி செய்கிறவர்
  rationale: வழிபாடு சார்ந்த பணியைச் செய்பவரைக் குறிக்கும் சொல்லின் ஆசாரியத் தொனியை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: σκηνῆς
  choice: திருக்கூடாரம்
  rationale: பொதுவான கூடாரத்தை மட்டுமல்லாமல், மோசேயின் வழிபாட்டுக் கூடாரத்தையும் அதன் பரலோக நிறைவையும் நினைவூட்டும் வழிபாட்டுச் சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἀληθινῆς
  choice: உண்மையான
  rationale: பூமிக்குரிய நகலுக்கு எதிராக உள்ள நிறைவான, மெய்யான ஒன்றைக் குறிக்கும் பொருளை விரிவாக்காமல் காக்கிறது.
- source_word: ἔπηξεν
  choice: அமைத்த
  rationale: கூடாரத்தை நிலைநிறுத்துதல் அல்லது நாட்டுதல் என்ற படிமத்தை இயல்பான தமிழில் தருகிறது; சொற்படிமத்திற்கு நெருக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ὁ κύριος
  choice: ஆண்டவர்
  rationale: தெய்வீகச் செயலைச் செய்கிற தனித்த எழுவாயைத் தெளிவாகக் குறிக்கிறது.
- source_word: οὐκ ἄνθρωπος
  choice: மனிதன் அல்ல
  rationale: ஆண்டவரின் செயலுக்கும் மனிதச் செயலுக்கும் இடையிலான மூலத்தின் சுருக்கமான எதிர்மறை ஒப்பீட்டைக் காக்கிறது.
theological_decisions:
- issue: τῶν ἁγίων என்பதன் குறிப்பு மற்றும் பரலோகப் பரிசுத்த இடத்துடனான தொடர்பு
  choice: பரிசுத்த மக்களை அல்ல, வழிபாட்டுக்குரிய பரிசுத்த இடங்களைக் குறிக்கும் வாசிப்பு
  alternative: பரிசுத்த மக்கள்
  rationale: எபிரெயர் 8:1–5 பரலோகப் பரிசுத்த இடத்தில் மேசியா செய்யும் தலைமை ஆசாரியப் பணியை விவரிக்கிறது. இந்த மொழிபெயர்ப்பு அந்த வழிபாட்டுக் கட்டமைப்பைக் காக்கிறது.
- issue: ἄνθρωπος என்பதன் பொதுமைப் பொருள்
  choice: மனிதன் அல்ல
  alternative: ஒரு மனிதர் அல்ல / மனிதர்கள் அல்ல
  rationale: ஒரு குறிப்பிட்ட ஆணைக் குறிக்காமல், ஆண்டவர் செய்ததற்கும் மனிதர் செய்ததற்கும் இடையிலான பொதுவான முரண்பாட்டை மூலத்தின் ஒருமை வடிவுடன் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், வழிபாடு சார்ந்த கண்ணியமான நடையைப் பேணுகிறது. வசனம் முந்தைய வசனத்தின் இலக்கணத் தொடர்ச்சியாக இருப்பதால், முடிவுற்ற தனிவாக்கியமாக மாற்றப்படவில்லை.
