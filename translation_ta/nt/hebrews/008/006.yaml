id: HEB.8.6
reference: Hebrews 8:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀νυνὶ δὲ διαφορωτέρας τέτυχεν λειτουργίας, ὅσῳ καὶ κρείττονός ἐστιν διαθήκης μεσίτης, ἥτις ἐπὶ κρείττοσιν ἐπαγγελίαις νενομοθέτηται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/006.yaml
  text: But as it is[a], he has obtained a more excellent ministry, by as much as he is also the mediator of a better covenant[c][b], which has been enacted on better promises.
translation:
  language: ta
  text: ஆனால் இப்பொழுது, அவர் மேம்பட்ட உடன்படிக்கையின்[a] நடுவராக இருப்பதற்கு ஏற்ப மேன்மையான ஊழியத்தைப் பெற்றிருக்கிறார். அந்த உடன்படிக்கை மேன்மையான வாக்குறுதிகளின் அடிப்படையில் சட்டரீதியாக நிறுவப்பட்டுள்ளது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கச் சொல் சில சூழல்களில் ‘ஏற்பாட்டுப் பத்திரம்’ என்றும் பொருள்படலாம்; இங்கு அடுத்த வசனங்களில் மேற்கோளிடப்படும் எரேமியாவின் புதிய உடன்படிக்கை வாக்குறுதியால் ‘உடன்படிக்கை’ என்பதே சூழலுக்குப் பொருந்துகிறது.
    reason: alternative_reading
  - marker: b
    text: ‘சட்டரீதியாக நிறுவப்பட்டுள்ளது’ என்பதற்குப் பதிலாக, ‘நிறுவப்பட்டுள்ளது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: ஆனால் இப்போதோ
  rationale: முன்னர் கூறப்பட்ட பூமிக்குரிய ஆசாரிய ஊழியத்துடன் நிகழ்கால முரண்பாட்டை இயல்பான தமிழில் காட்டுகிறது.
- source_word: διαφορωτέρας
  choice: மேன்மையான
  rationale: தரத்திலான ஒப்பீட்டு உயர்வைக் குறிக்கிறது; எபிரெயரின் உயர்ந்த நடைக்கும் அடுத்துவரும் ஒப்பீட்டு வாதத்திற்கும் பொருந்துகிறது.
- source_word: τέτυχεν
  choice: பெற்றிருக்கிறார்
  rationale: நிறைவேறிய செயலில் இருந்து தொடரும் தற்போதைய நிலையை கிரேக்க நிறைவுக்கால வினை வெளிப்படுத்துவதால், பெற்றதும் இப்போது உடையவராக இருப்பதும் இதில் அடங்குகின்றன.
- source_word: λειτουργίας
  choice: ஊழியத்தை
  rationale: சூழலில் கிறிஸ்துவின் பரிசுத்த ஆசாரியப் பணியைக் குறிக்கிறது; 'ஊழியம்' அதை இயல்பாகவும் தேவையற்ற விளக்கச் சேர்க்கையின்றியும் தெரிவிக்கிறது.
- source_word: ὅσῳ καὶ
  choice: ஏனெனில் ... ஆகவும்
  rationale: கிறிஸ்துவின் ஊழிய மேன்மையை அவர் நடுவராக உள்ள உடன்படிக்கையின் மேன்மையோடு இணைக்கிறது. கிரேக்கத்தின் அளவுக்கேற்ற ஒப்பீட்டு அமைப்பு தமிழில் சொற்சொல்லாக இயல்பாக அமையாததால், அதன் தர்க்கத் தொடர்பு காரணவிளக்க அமைப்பில் பாதுகாக்கப்படுகிறது.
- source_word: κρείττονός ... διαθήκης
  choice: மேம்பட்ட உடன்படிக்கையின்
  rationale: κρείττων குறிக்கும் ஒப்பீட்டு மேன்மையைத் தெளிவாகக் காட்டுகிறது; διαθήκη இச்சூழலில் எரேமியாவின் புதிய உடன்படிக்கையைச் சுட்டுகிறது.
- source_word: μεσίτης
  choice: நடுவராக
  rationale: இரு தரப்புகளுக்கிடையே உடன்படிக்கை உறவை நிறைவேற்றுபவரைக் குறிக்கும் சட்ட மற்றும் இறையியல் நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: ἥτις
  choice: உடன்படிக்கையின் ... ஏற்படுத்தப்பட்ட
  rationale: முன்னுள்ள உடன்படிக்கையை விவரிக்கும் சார்பு வாக்கியத்தைத் தமிழில் இயல்பான பெயரெச்ச அமைப்பாக அளிக்கிறது.
- source_word: ἐπὶ κρείττοσιν ἐπαγγελίαις
  choice: மேன்மையான வாக்குறுதிகளின் அடிப்படையில்
  rationale: ἐπί இங்கு அடித்தளம் அல்லது ஆதாரத்தைச் சுட்டுவதால், உடன்படிக்கை அந்த வாக்குறுதிகளை அடிப்படையாகக் கொண்டிருப்பதைத் தெளிவுபடுத்துகிறது.
- source_word: νενομοθέτηται
  choice: சட்டப்படி ஏற்படுத்தப்பட்ட
  rationale: உடன்படிக்கை அதிகாரபூர்வமாக நிறுவப்பட்டதையும் அதன் தொடரும் செல்லுபடித் தன்மையையும் கிரேக்க நிறைவுக்காலச் செயப்பாட்டு வடிவத்திற்கு ஏற்றவாறு வெளிப்படுத்துகிறது.
theological_decisions:
- issue: எபிரெயர் 8:6-இல் διαθήκη என்பதன் மொழிபெயர்ப்பு
  choice: உடன்படிக்கை
  alternative: ஏற்பாட்டுப் பத்திரம்
  rationale: அடுத்த வசனங்களில் மேற்கோளிடப்படும் எரேமியாவின் புதிய உடன்படிக்கை வாக்குறுதியும் ஆசாரிய நடுவர் சூழலும் 'உடன்படிக்கை' என்பதையே கோருகின்றன; வேறு சூழல்களில் 'ஏற்பாட்டுப் பத்திரம்' என்ற பொருள் சாத்தியமானாலும் இங்கு அது பழைய ஏற்பாட்டு பின்னணியை மறைக்கும்.
- issue: ὅσῳ καὶ என்பதன் ஒப்பீட்டு-காரணத் தொடர்பு
  choice: ஏனெனில் அவர் ... ஆகவும் இருக்கிறார்
  alternative: எந்த அளவுக்கு அவர் ... ஆக இருக்கிறாரோ, அந்த அளவுக்கு
  rationale: மாற்று வடிவம் கிரேக்க அமைப்பை இன்னும் வெளிப்படையாகப் பிரதிபலித்தாலும் தமிழில் கனமாகவும் முழுமையற்ற ஒப்பீட்டைப் போலவும் ஒலிக்கலாம். தேர்ந்த வடிவம் ஊழியத்தின் மேன்மை உடன்படிக்கை நடுவர் நிலையின் மேன்மையோடு தொடர்புடையது என்ற வாதத்தை இயல்பாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘மேன்மையான ஊழியம்’ மற்றும் ‘மேம்பட்ட உடன்படிக்கை’ என்ற சொல் வேறுபாடு கிரேக்கத்தில் உள்ள διάφορος/κρείττων வேறுபாட்டை ஓரளவு பிரதிபலிக்கிறது. சட்ட நுணுக்கம் தெளிவாக இருக்க ‘சட்டப்படி ஏற்படுத்தப்பட்ட’ என வழங்கப்பட்டுள்ளது.
