source:
  edition: SBLGNT
  text: ἐν τῷ λέγειν Καινὴν πεπαλαίωκεν τὴν πρώτην, τὸ δὲ παλαιούμενον καὶ γηράσκον ἐγγὺς ἀφανισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/013.yaml
  text: By saying[a], “new,” he has made the first obsolete[c][b]. And what is becoming obsolete and growing old is near to disappearing.
translation:
  language: ta
  text: “புதியது” என்று சொல்வதன் மூலம்[a][b], முதலாவதைப் பழையதாக்கிவிட்டார். பழையதாகி முதிர்ந்துவருவது மறைந்துபோவதற்கு அருகில் உள்ளது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்று சொல்லும்போது” அல்லது “என்று சொல்வதில்.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்க உரையில் “புதியது” என்ற சொல் மட்டுமே மேற்கோளாக வருகிறது; இது முன்பு மேற்கோள் காட்டப்பட்ட எரேமியா 31:31-இலுள்ள “புதிய உடன்படிக்கை” என்ற சொற்றொடரை எதிரொலிக்கிறது.
    reason: cross_reference
  - marker: c
    text: அல்லது, “மறைந்தொழிவதற்கு அருகில் உள்ளது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ λέγειν
  choice: என்று சொல்வதன் மூலம்
  rationale: ἐν உடன் வரும் வினையெச்ச அமைப்பு சூழ்நிலையையோ வழிமுறையையோ குறிக்கலாம். இங்கு ‘சொல்வதன் மூலம்’ என்பது கருவிப்பொருளை இயல்பான தமிழில் வெளிப்படுத்தி, முந்தைய மேற்கோளுடன் உள்ள தொடர்பையும் காக்கிறது.
- source_word: Καινὴν
  choice: “புதியது”
  rationale: கிரேக்கத்தில் ‘உடன்படிக்கை’ என்ற பெயர்ச்சொல் இவ்வசனத்தில் மீண்டும் வராமல், முந்தைய எரேமியா மேற்கோளிலுள்ள ‘புதிய உடன்படிக்கை’ என்பதைக் குறிப்பாக எதிரொலிக்கிறது. ஆகவே பெயர்ச்சொல்லைச் சேர்க்காமல் மேற்கோள் குறிகளுடன் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: πεπαλαίωκεν
  choice: பழையதாக்கிவிட்டார்
  rationale: நிறைவுற்ற செயலும் அதன் தற்போதைய விளைவும் கிரேக்க perfect வடிவத்தில் உள்ளன. ‘பழையதாக்கிவிட்டார்’ என்பது மூலச்சொல்லின் உருவகத்தையும் அடுத்துவரும் παλαιούμενον உடனான சொல் தொடர்பையும் காக்கிறது; சூழலில் அது பயன்பாட்டை இழந்த நிலையைச் சுட்டுகிறது.
- source_word: τὴν πρώτην
  choice: முதலாவதை
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் பெயரடை இது; சூழலில் முதல் உடன்படிக்கையைக் குறிக்கிறது. மூலத்தில் இல்லாத ‘உடன்படிக்கை’ என்பதைக் பிரதான உரையில் சேர்க்காமல் அதன் சுருக்கத்தைப் பேணுகிறது.
- source_word: τὸ ... παλαιούμενον
  choice: பழையதாகிக்கொண்டும் இருப்பது
  rationale: நிகழ்காலப் பங்கேற்புவினை தொடர்ந்துகொண்டிருக்கும் ஒரு செயல்முறையைக் காட்டுகிறது. இந்தத் தேர்வு அந்த வளர்நிலையையும் πεπαλαίωκεν உடனான சொல்வேர்த் தொடர்பையும் காக்கிறது.
- source_word: γηράσκον
  choice: முதிர்ந்துகொண்டும்
  rationale: வயதாகும் உருவகத்தைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; முந்தைய பங்கேற்புவினையுடன் இணையான தொடர்ச்சியான செயலைக் காக்கிறது.
- source_word: ἐγγὺς
  choice: நிலையை நெருங்கிவிட்டது
  rationale: ‘அருகில்’ என்ற அடிப்படைப் பொருளை இயல்பான தமிழ் வாக்கிய அமைப்பில் தருகிறது. இது அருகாமையைத் தெரிவிக்கிறது; மறைவு ஏற்கெனவே நிகழ்ந்துவிட்டதாகக் கூறவில்லை.
- source_word: ἀφανισμοῦ
  choice: மறைந்துபோகும்
  rationale: இந்தப் பெயர்ச்சொல் காணாமற்போதல் அல்லது மறைந்தொழிதலைக் குறிக்கிறது. ‘மறைந்துபோகும்’ என்பது அழிவு என்ற வலுவான கருத்தைத் தேவையின்றி சேர்க்காமல், பொதுவாசகருக்கு இயல்பாக உள்ளது.
theological_decisions:
- issue: ‘புதியது’ என்று சொல்பவரின் மறைமுக எழுவாய்
  choice: தமிழ் வினைமுற்றின் மூலம் ‘அவர்’ என்ற பொருள் வெளிப்படுகிறது; கடவுள் அல்லது வேதவாக்கியம் என்று தனியே குறிப்பிடப்படவில்லை.
  alternative: ‘கடவுள் சொல்வதன் மூலம்’ அல்லது ‘வேதவாக்கியம் சொல்வதன் மூலம்’
  rationale: கிரேக்கத்தில் எழுவாய் வெளிப்படையாக இல்லை; அது எரேமியா மேற்கோளில் பேசுபவரைத் திரும்பச் சுட்டுகிறது. தமிழில் ‘பழையதாக்கிவிட்டார்’ என்ற வினைமுற்று அந்த மறைமுக எழுவாயை இயல்பாகக் காத்து, தேவையற்ற விளக்கத்தைத் தவிர்க்கிறது.
- issue: முதல் உடன்படிக்கையின் நிலை
  choice: ‘முதலாவதைப் பழையதாக்கிவிட்டார்’
  alternative: ‘முதலாவதைக் காலாவதியானதாக்கிவிட்டார்’
  rationale: சூழல் புதிய உடன்படிக்கையுடன் முதலாவதை வேறுபடுத்தி, அதன் முந்தைய நிலை கடந்துவிட்டதை வலியுறுத்துகிறது. ‘பழையதாக்கிவிட்டார்’ என்பது மூலத்தின் சொல்வேர்த் தொடர்பை வெளிப்படையாகக் காப்பதுடன், நியாயப்பிரமாணம் குறித்த கூடுதல் கோட்பாட்டுத் தீர்மானங்களை உரைக்குள் இறக்குமதி செய்யாது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகருக்குப் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘புதியது’, ‘முதலாவது’ என்ற கிரேக்கத்தின் சுருக்கமான சொல்லாட்சியும், ‘பழையதாக்குதல்/பழையதாகுதல்/முதிர்தல்’ என்ற உருவகத் தொடர்ச்சியும் இயன்றவரை காக்கப்பட்டுள்ளன.
