reference: Hebrews 8:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ οὐ μὴ διδάξωσιν ἕκαστος τὸν πολίτην αὐτοῦ καὶ ἕκαστος τὸν ἀδελφὸν αὐτοῦ, λέγων· Γνῶθι τὸν κύριον, ὅτι πάντες εἰδήσουσίν με ἀπὸ ⸀μικροῦ ἕως μεγάλου αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/011.yaml
  text: And they will certainly not teach[a], each one his fellow citizen and each one his brother, saying, ‘Know the Lord,’ because they will all know me, from the least of them to the greatest.
translation:
  language: ta
  text: ஒவ்வொருவனும் தன் சக குடிமகனுக்குக் கற்பித்து, ஒவ்வொருவனும் தன் சகோதரனுக்குக் கற்பித்து, ‘ஆண்டவரை அறிந்துகொள்’ என்று சொல்லவே மாட்டார்கள். ஏனெனில், அவர்களில் சிறியவர் முதல் பெரியவர் வரை எல்லாரும் என்னை அறிவார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ μὴ διδάξωσιν
  choice: கற்பிக்கவே மாட்டார்கள்
  rationale: οὐ μή உடன் வரும் aorist subjunctive வலியுறுத்தப்பட்ட மறுப்பைக் குறிக்கிறது. ‘கற்பிக்கவே மாட்டார்கள்’ என்பது அந்த வலிமையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἕκαστος
  choice: ஒவ்வொருவனும்
  rationale: உடன்படிக்கைச் சமூகத்தின் தனித்தனி உறுப்பினர்களைச் சுட்டும் பகிர்வுப் பொருளை வெளிப்படையாகப் பேணுகிறது.
- source_word: πολίτην
  choice: சக குடிமகன்
  rationale: எபிரெயர் கிரேக்க உரை ‘அயலான்’ என்பதற்குப் பதிலாக குடிமகனைக் குறிக்கும் πολίτης என்ற சொல்லைப் பயன்படுத்துகிறது; எனவே மூல உரையின் சொல் தனித்தன்மை பேணப்படுகிறது.
- source_word: ἀδελφόν
  choice: சகோதரன்
  rationale: கிரேக்கத்தில் ஆண்பால் ஒருமையாக உள்ள குடும்ப உறவுச் சொல்லை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: Γνῶθι
  choice: அறிந்துகொள்
  rationale: இது ஒருமை aorist imperative. ‘அறிந்துகொள்’ கட்டளையின் நேரடியான வலிமையையும் தமிழின் இயல்பையும் பேணுகிறது.
- source_word: κύριον
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான நிலையான, கண்ணியமான தமிழ்ச் சமயப் பயன்பாடு; எரேமியா மேற்கோளின் உடன்படிக்கைச் சூழலுக்கும் பொருந்துகிறது.
- source_word: εἰδήσουσίν με
  choice: எல்லாரும் என்னை அறிந்திருப்பார்கள்
  rationale: πάντες என்பதையும் வெளிப்படையான ‘என்னை’ என்ற பொருளையும் பேணுகிறது. எதிர்காலத்தில் நிலைபெற்ற அறிவை ‘அறிந்திருப்பார்கள்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου αὐτῶν
  choice: அவர்களில் சிறியவன்முதல் பெரியவன்வரை
  rationale: குழுவிலுள்ள முழு வரம்பையும் குறிக்கும் மரபுத்தொடரைத் தமிழில் சுருக்கமாகப் பேணுகிறது; வயது அல்லது சமூக நிலை என்ற ஒரே பொருளுக்குள் அதைச் சுருக்கவில்லை.
theological_decisions:
- issue: எரேமியா 31:34-ஐ எதிரொலிக்கும் மேற்கோளில் πολίτην என்பதன் மொழிபெயர்ப்பு
  choice: சக குடிமகன்
  alternative: அயலான்
  rationale: எபிரெயரின் தற்போதுள்ள கிரேக்க உரையில் πολίτην (‘குடிமகன்’) உள்ளது. ஆகவே மூலமொழிக்கு முன்னுரிமை கொடுத்து முதன்மை உரையில் அதையே மொழிபெயர்த்து, எரேமியா வசனத்தால் பரிச்சயமான மாற்றை அடிக்குறிப்பில் தருகிறோம்.
- issue: ἀδελφόν என்பதிலுள்ள பாலினம் குறித்த குடும்ப மொழி
  choice: சகோதரன்
  alternative: சகோதரன் அல்லது சகோதரி
  rationale: மூலச்சொல் ஆண்பால் ஒருமை என்பதால் அதன் வடிவத்தையும் உடன்படிக்கைச் சமூகத்தைக் குடும்பமாகச் சித்தரிக்கும் மொழியையும் பேணுகிறோம்; வாக்குறுதியின் விரிந்த பயன்பாட்டை மொழிபெயர்ப்பிலேயே விளக்கிச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் கண்ணியமான, பொதுவாசகருக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. வலியுறுத்தப்பட்ட மறுப்பு ‘கற்பிக்கவே மாட்டார்கள்’ எனத் தரப்பட்டுள்ளது. ‘சக குடிமகன்’ சற்று இலக்கியத் தொனியுடையதாயினும் மூல கிரேக்கத்தின் குறிப்பான சொல்லைத் துல்லியமாகப் பேணுகிறது.
