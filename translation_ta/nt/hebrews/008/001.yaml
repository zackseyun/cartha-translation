  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Κεφάλαιον δὲ ἐπὶ τοῖς λεγομένοις, τοιοῦτον ἔχομεν ἀρχιερέα, ὃς ἐκάθισεν ἐν δεξιᾷ τοῦ θρόνου τῆς μεγαλωσύνης ἐν τοῖς οὐρανοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/001.yaml
  text: 'The main point in what is being said is this: we have such a high priest[a], who sat down at the right hand of the throne of the Majesty in the heavens[b],'
translation:
  language: ta
  text: 'கூறப்பட்டு வருகிறவற்றில் தலைக்கருத்து இதுதான்: வானங்களில்[b] மகத்துவத்தின் அரியணையின் வலப்பக்கத்தில் அமர்ந்த இத்தகைய தலைமைக் குரு[a] நமக்கு இருக்கிறார்,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சாரம்’ அல்லது ‘முதன்மைக் கருத்து’.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘வானத்தில்’; கிரேக்கத்தில் பன்மையாக ‘வானங்களில்’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κεφάλαιον
  choice: தலைக்கருத்து
  rationale: இங்கு இது ‘அத்தியாயம்’ என்ற நேரடிப் பொருளில் அல்லாமல், விவாதத்தின் முதன்மையான கருத்தையோ சாரத்தையோ குறிக்கிறது. ‘தலைக்கருத்து’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: δὲ
  choice: தனி வார்த்தையாக மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு δέ வலுவான முரண்பாட்டைக் காட்டாமல் உரையின் மென்மையான திருப்பத்தைக் குறிக்கிறது. தமிழில் வாக்கிய அமைப்பே அந்த மாற்றத்தை இயல்பாகக் காட்டுவதால், காலப் பொருளைத் தோற்றுவிக்கக்கூடிய ‘இப்போது’ சேர்க்கப்படவில்லை.
- source_word: ἐπὶ τοῖς λεγομένοις
  choice: சொல்லப்பட்டு வருகிறவற்றைப் பற்றிய
  rationale: நடந்து கொண்டிருக்கும் சொல்லுதலைக் காட்டும் நிகழ்காலச் செயப்பாட்டு வடிவத்தையும், விவாதிக்கப்படும் பொருள்களைக் குறிக்கும் தொடர்பையும் காக்கிறது.
- source_word: τοιοῦτον
  choice: இத்தகைய
  rationale: முன்பு விவரிக்கப்பட்ட வகையான தலைமைக் குருவைச் சுட்டுகிறது.
- source_word: ἔχομεν
  choice: நமக்கு இருக்கிறார்
  rationale: தமிழில் ஒருவரை உடையவர்களாக இருப்பதைக் கூறும் இயல்பான மரியாதைமிக்க கட்டமைப்பு; கிரேக்கத்தின் எளிய நிகழ்காலப் பொருளைத் தருகிறது.
- source_word: ἀρχιερέα
  choice: தலைமைக் குரு
  rationale: ஆலய வழிபாட்டில் உயர்ந்த குருத்துவப் பதவியைக் குறிக்கும் தெளிவான, நவீன தமிழ் இணை.
- source_word: ἐκάθισεν
  choice: அமர்ந்த
  rationale: அவர் இருக்கையில் அமர்ந்த நிறைவுற்ற செயலை நேரடியாகக் கூறுகிறது; அதன் இறையியல் விளைவை மொழிபெயர்ப்பில் விரிவாக்கவில்லை.
- source_word: ἐν δεξιᾷ
  choice: வலப்பக்கத்தில்
  rationale: மரியாதை மற்றும் அதிகாரத்தின் இடத்தைக் குறிக்கும் மூல மொழி உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: τοῦ θρόνου
  choice: அரியணையின்
  rationale: அரசாட்சியின் உருவகத்தைத் துல்லியமாகப் பாதுகாக்கிறது.
- source_word: τῆς μεγαλωσύνης
  choice: மாட்சிமைமிக்கவருடைய
  rationale: இது தேவனை நேரடியாகப் பெயரிடாமல் மரியாதையுடன் சுட்டும் சுற்றுப்பெயர். ‘மாட்சிமைமிக்கவர்’ தமிழில் இயல்பாக இருந்து அந்த மறைமுகக் குறிப்பைப் பாதுகாக்கிறது.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: வானங்களில்
  rationale: கிரேக்கத்தில் உள்ள பன்மை வடிவத்தைத் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: τῆς μεγαλωσύνης என்பதன் குறிக்கப்படுபவரை ‘தேவன்’ என்று வெளிப்படையாக்கலாமா?
  choice: ‘மாட்சிமைமிக்கவர்’ என்ற மரியாதைமிக்க மறைமுகக் குறிப்பை வைத்திருத்தல்
  alternative: ‘தேவனுடைய அரியணை’
  rationale: மூலத்தில் θεός என்ற நேரடிப் பெயர் வரவில்லை. ஆகவே குறிக்கப்படுபவரைத் தெளிவாகப் பெயரிடாமல், மூலத்தின் உயர்ந்த மறைமுக நடையைப் பேணுகிறது.
- issue: ἐκάθισεν என்பதில் நிறைவேறிய குருத்துவப் பணியின் கருத்தை மொழிபெயர்ப்பிலேயே விரிவாக்கலாமா?
  choice: ‘அமர்ந்த’ என்று மட்டும் மொழிபெயர்த்தல்
  alternative: ‘தம் பணியை நிறைவேற்றி வெற்றியுடன் அமர்ந்த’
  rationale: எபிரெயர் நூலின் சூழல் அந்த இறையியல் கருத்தை வளர்த்தாலும், இச்சொல் நேரடியாகக் கூறாத விளக்கத்தை வசனத்தில் சேர்க்காமல் விடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் உரையின் உயர்ந்த, மரியாதைமிக்க நடையைப் பேணும் வகையிலும் வடிவமைக்கப்பட்டது. வசனம் அடுத்த வாக்கியத்துடன் தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
