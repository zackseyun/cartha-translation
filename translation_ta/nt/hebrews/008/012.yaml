  to: ஏனெனில், அவர்களுடைய அநீதிகளுக்கு நான் இரக்கம் காட்டுவேன்[a]; அவர்களுடைய பாவங்களை இனி ஒருபோதும் நினைவுகூர மாட்டேன்[b].
