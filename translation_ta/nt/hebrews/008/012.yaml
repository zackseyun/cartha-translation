source:
  edition: SBLGNT
  text: ὅτι ἵλεως ἔσομαι ταῖς ἀδικίαις αὐτῶν, καὶ τῶν ἁμαρτιῶν ⸀αὐτῶν οὐ μὴ μνησθῶ ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/012.yaml
  text: For I will be merciful toward their unrighteousness[b][a], and I will remember their sins no more.
translation:
  language: ta
  text: ஏனெனில், அவர்களுடைய அநீதிகளுக்கு நான் இரக்கம் காட்டுவேன்[a]; அவர்களுடைய பாவங்களை இனி ஒருபோதும் நினைவுகூர மாட்டேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்களுடைய அநீதிச் செயல்களுக்கு நான் இரக்கம் காட்டுவேன்’ என்றும் மொழிபெயர்க்கலாம். ἀδικίαις என்பது அநீதி, தவறு, அல்லது அநீதியான செயல்களைக் குறிக்கலாம்; இங்குள்ள பன்மை குறிப்பிட்ட தவறான செயல்களையும் சுட்டலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘அவர்களுடைய பாவங்களை இனி நிச்சயமாக நினைவுகூர மாட்டேன்.’ இது முழுமையான மன்னிப்பைக் குறிக்கும் உடன்படிக்கைச் சொல்லாட்சி; தேவன் அவற்றை அறியாமல் போகிறார் என்பதைக் குறிக்காது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய உடன்படிக்கை வாக்குறுதிக்கான விளக்கத்தையோ காரணத்தையோ அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: ἵλεως ἔσομαι
  choice: நான் இரக்கமுள்ளவராக இருப்பேன்
  rationale: ἵλεως என்பதில் உள்ள இரக்கம், சாதகமான மனப்பாங்கு, மன்னிக்கும் தயவு ஆகியவற்றைத் தொழில்நுட்பமான பரிகாரச் சொல்லாக்கமின்றி வெளிப்படுத்துகிறது; ἔσομαι என்பதன் எதிர்காலத்தையும் காக்கிறது.
- source_word: ταῖς ἀδικίαις αὐτῶν
  choice: அவர்களுடைய அநீதிச் செயல்களைக் குறித்து
  rationale: பன்மையான ἀδικίαις இங்கு தனித்தனி தவறான அல்லது அநீதியான செயல்களைக் குறிக்கக்கூடும். ‘அநீதிச் செயல்கள்’ அதன் ஒழுக்கப் பொருளையும் பன்மையையும் தெளிவாக்குகிறது; ‘குறித்து’ என்பது ἵλεως உடன் வரும் வேற்றுமை உறவை இயல்பான தமிழில் காட்டுகிறது.
- source_word: καὶ
  choice: ;
  rationale: கிரேக்கத்தின் இணைப்பை தமிழில் தெளிவான சமநிலை வாக்கியங்களாக அமைக்க அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது; இரண்டு வாக்குறுதிகளின் நெருங்கிய தொடர்பு தொடர்கிறது.
- source_word: τῶν ἁμαρτιῶν αὐτῶν
  choice: அவர்களுடைய பாவங்களை
  rationale: ἁμαρτία என்பதற்கான வழக்கமான, தெளிவான தமிழ் இணை ‘பாவம்’; பன்மை இயல்பாகக் காக்கப்பட்டுள்ளது.
- source_word: οὐ μὴ μνησθῶ ἔτι
  choice: இனி ஒருபோதும் நினைவுகூர மாட்டேன்
  rationale: οὐ μή என்பதன் வலுவான மறுப்பையும் ἔτι என்பதன் ‘இனிமேல் இல்லை’ என்ற கருத்தையும் இயல்பான தமிழில் வலியுறுத்துகிறது.
theological_decisions:
- issue: தேவன் பாவங்களை இனி நினைவுகூராததன் பொருள்
  choice: ‘நினைவுகூர மாட்டேன்’ என்ற வேதாகம உடன்படிக்கைச் சொல்லாட்சியை அப்படியே வைத்தல்
  alternative: தேவன் அவற்றை அறிவிலிருந்து மறந்துவிடுகிறார் என்று நேரடியாக விளக்குதல்; அல்லது ‘அவற்றை அவர்களுக்கு எதிராகக் கணக்கிட மாட்டேன்’ என்று பொருளை மட்டும் மொழிபெயர்த்தல்
  rationale: இச்சொல்லாட்சி முழுமையான மன்னிப்பையும் பாவங்களை இனி எதிராக எடுத்துக்கொள்ளாமையையும் தெரிவிக்கிறது. ஆனால் மூலத்தின் உருவகத்தையும் இறையியல் அழுத்தத்தையும் பிரதான உரை விளக்கமாக மாற்றாமல் காக்கிறது.
- issue: ἵλεως என்பதிலுள்ள மன்னிப்பு சார்ந்த இரக்கம்
  choice: ‘இரக்கமுள்ளவராக இருப்பேன்’ என்று மனப்பாங்கை நேரடியாகக் காக்குதல்
  alternative: ‘மன்னிப்பேன்’ என்று விளைவைக் குறிப்பாக மொழிபெயர்த்தல்
  rationale: சூழல் மன்னிப்பைக் குறிப்பதாக இருந்தாலும், மூலச்சொல் நேரடியாக இரக்கமான அல்லது சாதகமான மனப்பாங்கைச் சொல்கிறது. ஆகவே அதன் பரப்பைச் சுருக்காமல் காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இரக்கமுள்ளவராக இருப்பேன்’ என்பது சற்றே முறையானதாக இருந்தாலும் மூலத்தின் சொற்பொருளையும் உடன்படிக்கைத் தொனியையும் காக்கிறது. வலுவான οὐ μή மறுப்பை ‘இனி ஒருபோதும் ... மாட்டேன்’ இயல்பாக வெளிப்படுத்துகிறது.
