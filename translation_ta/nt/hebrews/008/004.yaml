id: HEB.8.4
reference: Hebrews 8:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ μὲν ⸀οὖν ἦν ἐπὶ γῆς, οὐδ’ ἂν ἦν ἱερεύς, ⸀ὄντων τῶν προσφερόντων κατὰ ⸀νόμον τὰ δῶρα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/004.yaml
  text: If he were on earth[a], he would not even be a priest, since there are those who offer the gifts according to the law.
translation:
  language: ta
  text: ஆகவே, அவர் பூமியில் இருந்திருந்தால், ஆசாரியராகக்கூட இருக்கமாட்டார்; ஏனெனில், சட்டத்தின்படி காணிக்கைகளை[a]ப் படைப்பவர்கள் இருக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கச் சொல்லை நேரடியாக ‘கொடைகள்’ என்றும் மொழிபெயர்க்கலாம்; இச்சூழலில் அது பலியர்ப்பணக் காணிக்கைகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὲν οὖν
  choice: ஆகவே, … இருந்தால்
  rationale: οὖν குறிக்கும் தர்க்கத் தொடர்ச்சியை ‘ஆகவே’ என்பதும், εἰ குறிக்கும் நிபந்தனையை ‘இருந்தால்’ என்பதும் இயல்பான தமிழில் வெளிப்படுத்துகின்றன; μὲν தனியே மொழிபெயர்க்கப்படாமல் வாக்கிய அமைப்பில் பிரதிபலிக்கப்படுகிறது.
- source_word: ἦν ἐπὶ γῆς
  choice: அவர் பூமியில் இருந்தால்
  rationale: ἐπὶ γῆς என்பது சூழலில் பரலோகத்துக்கு எதிரான பூமிக்குரிய இருப்பிடத்தைக் குறிக்கிறது. கிரேக்கத்தில் மறைந்துள்ள எழுவாய் உடனடியான சூழலின்படி ‘அவர்’ என்று வெளிப்படுத்தப்படுகிறது.
- source_word: οὐδ’ ἂν ἦν ἱερεύς
  choice: ஆசாரியராகக்கூட இருக்கமாட்டார்
  rationale: οὐδέ தரும் வலியுறுத்தப்பட்ட மறுப்பை ‘கூட … மாட்டார்’ தெளிவாகக் காட்டுகிறது; ἄν உடன் வரும் நிபந்தனை விளைவு தமிழின் ‘இருக்கமாட்டார்’ வடிவில் இயல்பாகத் தரப்படுகிறது.
- source_word: ὄντων τῶν προσφερόντων
  choice: செலுத்துகிறவர்கள் இருக்கிறார்கள்
  rationale: இந்த genitive absolute முந்தைய கூற்றுக்கான காரணச் சூழலைக் காட்டுகிறது. ‘ஏனெனில்’ உடன் இவ்வடிவு அதைப் புரியக்கூடிய நவீன தமிழில் வழங்குகிறது.
- source_word: κατὰ νόμον
  choice: திருச்சட்டத்தின்படி
  rationale: இங்கு νόμος ஆசாரியப் பணியையும் காணிக்கைகளையும் ஒழுங்குபடுத்தும் மோசேயின் சட்ட அமைப்பைக் குறிக்கிறது. பழமையான ‘நியாயப்பிரமாணம்’ என்பதற்குப் பதில் ‘திருச்சட்டம்’ தெளிவான, மரியாதையான நவீனச் சொல்.
- source_word: τὰ δῶρα
  choice: காணிக்கைகள்
  rationale: δῶρα என்பதன் அடிப்படைப் பொருள் ‘கொடைகள்’ என்றாலும், இச்சடங்குச் சூழலில் ‘காணிக்கைகள்’ அதன் பலியர்ப்பணப் பயன்பாட்டை இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: நிபந்தனை வாக்கியத்தின் மறைந்துள்ள எழுவாய்
  choice: உடனடியான சூழலைப் பின்பற்றி ‘அவர்’ என்று வெளிப்படுத்தப்பட்டது.
  alternative: எழுவாயை வெளிப்படுத்தாமல் விடுதல்
  rationale: தமிழில் எழுவாயை மறைக்க இயன்றாலும், இங்கு ‘அவர்’ என்று கூறுவது முந்தைய வசனங்களில் பேசப்படும் இயேசுவைத் தெளிவாகச் சுட்டுகிறது; மூலத்தில் இல்லாத புதிய கோட்பாட்டுக் கூற்றைச் சேர்ப்பதில்லை.
- issue: நிபந்தனையின் எதிர்நிலைத் தன்மை
  choice: ‘அவர் பூமியில் இருந்தால், … இருக்கமாட்டார்’ என்ற நிபந்தனை–விளைவு அமைப்பு பயன்படுத்தப்பட்டது.
  alternative: ‘அவர் பூமியில் இருந்திருந்தால், … இருந்திருக்கமாட்டார்’
  rationale: கிரேக்க εἰ + imperfect … ἄν + imperfect அமைப்பு உண்மைக்கு மாறான நிபந்தனையைக் குறிக்கிறது. ஆனால் தமிழ் இறந்தகால எதிர்நிலை வடிவம் கருத்தை தேவையின்றி கடந்தகாலத்துக்குள் கட்டுப்படுத்தக்கூடும்; தேர்ந்த வடிவு சூழலில் தற்போதைய எதிர்நிலைப் பொருளை இயல்பாகத் தக்கவைக்கிறது.
- issue: பூமியிலுள்ள ஆசாரியர்கள் பற்றிய காரணவுரை
  choice: திருச்சட்டத்தின்படி காணிக்கைகளைச் செலுத்துகிறவர்கள் இருப்பதே காரணமாக நேரடியாகக் கூறப்பட்டது.
  alternative: இந்த ஆசாரியர்களை குறிப்பிட்ட ஒரு ஆசாரிய மரபின் பெயரால் அடையாளப்படுத்துதல்
  rationale: மூலவசனம் அவர்களின் மரபுப் பெயரை இங்கு குறிப்பிடவில்லை; எனவே மொழிபெயர்ப்பு அதைச் சேர்க்காமல் உரையின் பதற்றத்தையும் வரம்பையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான வேதாகம நடையில் வடிவமைக்கப்பட்டது. ‘நியாயப்பிரமாணம்’ போன்ற பழமையான சொல்லுக்குப் பதில் ‘திருச்சட்டம்’ பயன்படுத்தப்பட்டது. அடிக்குறிப்பு குறி அது விளக்கும் ‘காணிக்கைகள்’ என்ற சொல்லுக்குப் பிந்தைய வாக்கிய முடிவில் வைக்கப்பட்டுள்ளது.
