reference: Hebrews 8:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι αὕτη ἡ διαθήκη ἣν διαθήσομαι τῷ οἴκῳ Ἰσραὴλ μετὰ τὰς ἡμέρας ἐκείνας, λέγει κύριος, διδοὺς νόμους μου εἰς τὴν διάνοιαν αὐτῶν, καὶ ἐπὶ καρδίας αὐτῶν ἐπιγράψω αὐτούς, καὶ ἔσομαι αὐτοῖς εἰς θεόν καὶ αὐτοὶ ἔσονταί μοι εἰς λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/010.yaml
  text: 'For this is the covenant that I will make with the house of Israel after those days[a], says the Lord: putting my laws into their minds, and I will write them on their hearts; and I will be their God, and they will be my people.'
translation:
  language: ta
  text: '“ஏனெனில், அந்த நாட்களுக்குப் பிறகு இஸ்ரவேல் வீட்டாரோடு நான் செய்யும் உடன்படிக்கை இதுவே,” என்று ஆண்டவர் கூறுகிறார்: “என் சட்டங்களை அவர்களுடைய மனங்களில் வைத்து, அவற்றை அவர்களுடைய இதயங்களின்மேல் எழுதுவேன். நான் அவர்களுடைய கடவுளாயிருப்பேன்; அவர்கள் என் மக்களாயிருப்பார்கள்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαθήκη
  choice: உடன்படிக்கை
  rationale: எரேமியா 31-ன் பின்னணியிலுள்ள இறை–மக்கள் உடன்படிக்கையைத் தெளிவாகக் குறிக்கிறது; ‘ஏற்பாடு’ அல்லது ‘உயில்’ என்பவை இச்சூழலில் பொருந்தாது.
- source_word: διαθήσομαι
  choice: நான் செய்யும்
  rationale: எதிர்கால உறுதியைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ‘உடன்படிக்கையைச் செய்வேன்’ என்பதன் காலப்பொருள், ‘இதுவே’ என்ற கட்டமைப்போடு ‘நான் செய்யும் உடன்படிக்கை’ எனத் தெளிவாகிறது.
- source_word: οἴκῳ Ἰσραήλ
  choice: இஸ்ரவேல் வீட்டாரோடு
  rationale: தீர்க்கதரிசன நூலின் கூட்டு, உடன்படிக்கை சார்ந்த சொல்லாட்சியைப் பாதுகாக்கிறது; வெறுமனே ‘இஸ்ரவேலோடு’ என்று சுருக்கவில்லை.
- source_word: μετὰ τὰς ἡμέρας ἐκείνας
  choice: அந்த நாட்களுக்குப் பிறகு
  rationale: கிரேக்கத்தின் காலக் குறிப்பையும் தீர்க்கதரிசன நடையையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: புதிய ஏற்பாட்டின் κύριος என்பதற்கான இயல்பான, மரியாதைமிக்க தமிழ் இணைச்சொல்.
- source_word: διδοὺς
  choice: வைப்பவனாய்
  rationale: கிரேக்கத்தில் உள்ள நிகழ்காலப் பங்கேற்புவினை வடிவத்தை முற்றிலும் இரண்டு எதிர்கால வினைகளாக மாற்றாமல் வெளிப்படுத்துகிறது; மென்மையான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: νόμους
  choice: சட்டங்களை
  rationale: கிரேக்கத்தில் உள்ள பன்மையைப் பாதுகாக்கிறது; ‘போதனைகள்’ என்று பொருளை விரிவுபடுத்தவில்லை.
- source_word: διάνοιαν
  choice: சிந்தைகளில்
  rationale: அறிதல், சிந்தித்தல் ஆகிய உள்ளார்ந்த மனத்திறனை தற்போதைய தமிழில் புரியத்தக்க விதத்தில் குறிக்கிறது; αὐτῶν என்பதற்கேற்ப தமிழில் பன்மை பயன்படுத்தப்படுகிறது.
- source_word: ἐπὶ καρδίας αὐτῶν
  choice: அவர்களுடைய இதயங்களின்மேல்
  rationale: எழுதுதல் என்ற உருவகத்துடன் பொருந்துமாறு ἐπί-யின் ‘மேல்’ என்ற உறவைப் பாதுகாக்கிறது.
- source_word: ἐπιγράψω
  choice: எழுதுவேன்
  rationale: பொறித்தல் என்ற உருவகத்தை மிகைப்படுத்தாமல், தெளிவாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: ἔσομαι αὐτοῖς εἰς θεόν
  choice: நான் அவர்களுடைய கடவுளாயிருப்பேன்
  rationale: வழக்கமான உடன்படிக்கைச் சூத்திரத்தின் உறவுசார் பொருளைப் பாதுகாக்கிறது.
- source_word: αὐτοὶ ἔσονταί μοι εἰς λαόν
  choice: அவர்கள் என் மக்களாயிருப்பார்கள்
  rationale: கடவுளுக்கும் மக்களுக்கும் இடையிலான உடன்படிக்கை உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: எரேமியா 31-ன் உடன்படிக்கை மொழியுடனான தொடர்பு
  choice: ‘இஸ்ரவேல் வீட்டார்,’ ‘என் சட்டங்கள்,’ ‘அவர்களுடைய இதயங்கள்,’ ‘அவர்களுடைய கடவுள்,’ ‘என் மக்கள்’ ஆகிய உடன்படிக்கைச் சொற்றொடர்கள் பாதுகாக்கப்பட்டன.
  alternative: தீர்க்கதரிசன எதிரொலிகளைக் குறைக்கும் சுதந்திரமான தற்காலப் பொழிப்புரை.
  rationale: மேற்கோளின் இறையியல் வலிமை பழைய ஏற்பாட்டின் உடன்படிக்கை மொழியுடனான தெளிவான தொடர்ச்சியில் உள்ளது.
- issue: διδοὺς என்ற பங்கேற்புவினையையும் ἐπιγράψω என்ற எதிர்கால வினையையும் எவ்வாறு மொழிபெயர்ப்பது
  choice: ‘வைப்பவனாய் ... எழுதுவேன்’ என்று மூலத்தின் கலப்பு வினைக் கட்டமைப்பு முதன்மை உரையில் பாதுகாக்கப்பட்டது.
  alternative: ‘வைப்பேன்; ... எழுதுவேன்’ என்று இரண்டையும் எதிர்கால முற்றுவினைகளாக்குதல்.
  rationale: கிரேக்கத்தின் இலக்கணத் தனித்தன்மையையும் அதன் சாத்தியமான வலியுறுத்தலையும் மறைக்காமல் வைத்திருக்கிறது; அதிக இயல்பான தமிழ் வடிவம் அடிக்குறிப்பில் வழங்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதைமிக்க வேதாகம நடையுடன் மொழிபெயர்க்கப்பட்டது. தீர்க்கதரிசன மேற்கோளின் முறையான உடன்படிக்கைச் சொற்றொடர்கள் பாதுகாக்கப்பட்டுள்ளன; அதேவேளை சாதாரண வாசகர்களுக்குப் புரியாத பழமையான சொற்கள் தவிர்க்கப்பட்டன.
