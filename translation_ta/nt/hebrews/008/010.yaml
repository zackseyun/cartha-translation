  rationale: தொடக்கக் காரணத் தொடர்பு சேர்க்கப்பட்டது. இயல்பற்ற ‘வைப்பவனாய்’ என்பதற்குப் பதிலாக ‘வைத்து’ பயன்படுத்தப்பட்டுள்ளது; இது கிரேக்கப் பங்கேற்புவினைத் தொடர்பை முடிந்தவரை காக்கிறது, ஆனால் தமிழில் செய்பவரைக் குறிக்கும் தவறான உணர்வைத் தவிர்க்கிறது. இதனால் முதன்மை உரைக்கு அடிக்குறிப்பு அவசியமில்லை; சீராக்கப்பட்ட இரு-எதிர்கால மாற்று உரை மொழிபெயர்ப்பு குறிப்பாக வழங்கப்படுகிறது.
