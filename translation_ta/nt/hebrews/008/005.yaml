revisions:
- from: இவர்கள் பரலோகத்துக்குரியவற்றின் மாதிரியிலும் நிழலிலும் இறைப்பணி செய்கிறார்கள். மோசே திருக்கூடாரத்தை அமைத்து முடிக்கவிருந்தபோது, கடவுளால் அறிவுறுத்தப்பட்டதுபோலவே[a] இது இருக்கிறது. ஏனெனில் அவர், “மலையில் உனக்குக் காட்டப்பட்ட வடிவத்தின்படியே எல்லாவற்றையும் செய்யும்படி பார்த்துக்கொள்” என்று சொல்கிறார்[b].
  to: இவர்கள் பரலோகத்துக்குரியவற்றின் மாதிரியாகவும் நிழலாகவும் உள்ள திருக்கூடாரத்தில் இறைப்பணி செய்கிறார்கள்; மோசே திருக்கூடாரத்தை அமைத்து முடிக்கவிருந்தபோது[b] கடவுளால் அறிவுறுத்தப்பட்டதுபோலவே[a] செய்கிறார்கள். ஏனெனில் அவர், “மலையில் உனக்குக் காட்டப்பட்ட வடிவத்தின்படியே எல்லாவற்றையும் செய்யும்படி பார்த்துக்கொள்” என்று சொல்கிறார்.
  rationale: The revision renders the earthly sanctuary as that which is a copy and shadow of heavenly things, clarifies the comparative relation to Moses’s divine instruction, and moves footnote b to its proper lexical anchor. It retains the draft’s cautious rendering of ἐπιτελεῖν as “அமைத்து முடிக்க” and preserves the warning/instruction ambiguity in footnote a.
