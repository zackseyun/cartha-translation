source:
  edition: SBLGNT
  text: (οἵτινες ὑποδείγματι καὶ σκιᾷ λατρεύουσιν τῶν ἐπουρανίων, καθὼς κεχρημάτισται Μωϋσῆς μέλλων ἐπιτελεῖν τὴν σκηνήν, Ὅρα γάρ, φησίν, ποιήσεις πάντα κατὰ τὸν τύπον τὸν δειχθέντα σοι ἐν τῷ ὄρει)·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/005.yaml
  text: who serve a copy and shadow of the heavenly things[a], just as Moses was divinely instructed when he was about to erect the tabernacle; for he says[b], “See that you make everything according to the pattern shown to you on the mountain.”
translation:
  language: ta
  text: இவர்கள் பரலோகத்துக்குரியவற்றின் மாதிரியாகவும் நிழலாகவும் உள்ள திருக்கூடாரத்தில் இறைப்பணி செய்கிறார்கள்; மோசே திருக்கூடாரத்தை அமைத்து முடிக்கவிருந்தபோது[b] கடவுளால் அறிவுறுத்தப்பட்டதுபோலவே[a] செய்கிறார்கள். ஏனெனில் அவர், “மலையில் உனக்குக் காட்டப்பட்ட வடிவத்தின்படியே எல்லாவற்றையும் செய்யும்படி பார்த்துக்கொள்” என்று சொல்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளால் எச்சரிக்கப்பட்டதுபோலவே”; கிரேக்க வினைச்சொல் தெய்வீக எச்சரிப்பு அல்லது அறிவுறுத்தலைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அமைத்து முடிக்க” என்பதை “அமைக்க” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: இவர்கள்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட ஆசாரியர்களைச் சுட்டுகிறது; தமிழில் தனித்து நிற்கும் வசனத்திலும் குறிப்பு தெளிவாக இருக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: ὑποδείγματι καὶ σκιᾷ
  choice: மாதிரியிலும் நிழலிலும்
  rationale: பூமிக்குரிய வழிபாட்டு அமைப்பு பரலோகத்துக்குரியவற்றுடன் ஒத்திருந்தாலும் அவற்றைவிடத் தாழ்ந்தது என்ற இரட்டை உருவகத்தைத் தக்கவைக்கிறது.
- source_word: λατρεύουσιν
  choice: இறைப்பணி செய்கிறார்கள்
  rationale: வழிபாட்டுடன் தொடர்புடைய புனிதச் சேவையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: τῶν ἐπουρανίων
  choice: பரலோகத்துக்குரியவற்றின்
  rationale: குறிப்பிடப்படுவது பரலோக இடமா, பொருட்களா, மெய்மைகளா என்பதை தேவையின்றிக் குறுக்காமல் கிரேக்கத்தின் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: κεχρημάτισται
  choice: கடவுளால் அறிவுறுத்தப்பட்ட
  rationale: தெய்வீகத் தகவலும் வழிகாட்டுதலும் இதில் உள்ளன என்பதை வெளிப்படுத்துகிறது; எச்சரிப்பு என்ற சாத்தியமான நுண்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐπιτελεῖν τὴν σκηνήν
  choice: திருக்கூடாரத்தை அமைத்து முடிக்க
  rationale: ἐπιτελεῖν என்பதிலுள்ள நிறைவேற்றுதல் அல்லது முடித்தல் என்ற பொருளையும், சூழலில் உள்ள கட்டுமானச் செயலையும் இணைத்துக் காட்டுகிறது.
- source_word: Ὅρα ... ποιήσεις πάντα
  choice: எல்லாவற்றையும் செய்யும்படி பார்த்துக்கொள்
  rationale: Ὅρα என்ற கட்டளையின் எச்சரிக்கையான நேரடித் தன்மையையும், கட்டளைப் பொருளில் வரும் எதிர்கால வினையின் செயல்பாட்டையும் இயல்பான தமிழில் தருகிறது.
- source_word: τύπον
  choice: வடிவம்
  rationale: மலையில் காட்டப்பட்ட கட்டமைப்பு மாதிரியைச் சுட்டும் வகையில், மிகையாக விளக்காமல் பொதுவாகப் புரியும் சொல்லைத் தேர்ந்தெடுக்கிறது.
theological_decisions:
- issue: பூமிக்குரிய திருப்பணிக்கும் பரலோகத்துக்குரியவற்றுக்கும் உள்ள உறவு
  choice: “பரலோகத்துக்குரியவற்றின் மாதிரியிலும் நிழலிலும்”
  alternative: “பரலோக மெய்மைகளின் நகலிலும் நிழலிலும்”
  rationale: பூமிக்குரியது பரலோகத்துக்குரியதுடன் உண்மையான தொடர்புடையது, ஆனால் அதற்கு ஈடான முழுமை அல்ல என்ற பதற்றத்தைத் தக்கவைக்கிறது; ‘மெய்மைகள்’ என்று பொருளை அதிகமாக நிர்ணயிக்கவில்லை.
- issue: κεχρημάτισται என்பதன் வலிமை
  choice: “கடவுளால் அறிவுறுத்தப்பட்ட”
  alternative: “கடவுளால் எச்சரிக்கப்பட்ட”
  rationale: தெய்வீக வெளிப்பாடும் வழிகாட்டுதலும் முதன்மையாகத் தெரிவிக்கப்படுகின்றன; மேற்கோளில் உள்ள எச்சரிக்கை நுண்பொருள் மாற்று வாசிப்பாக அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. வழிபாட்டு சூழலைத் தெளிவாக்க ‘இறைப்பணி’ என்றும், மோசேயின் புனிதக் கூடாரத்தைக் குறிக்க ‘திருக்கூடாரம்’ என்றும் பயன்படுத்தப்பட்டது. மேற்கோள் இயல்பான தமிழ் கட்டளை வடிவில் தரப்பட்டுள்ளது.
