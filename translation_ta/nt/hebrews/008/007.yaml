id: HEB.8.7
reference: Hebrews 8:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Εἰ γὰρ ἡ πρώτη ἐκείνη ἦν ἄμεμπτος, οὐκ ἂν δευτέρας ἐζητεῖτο τόπος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/007.yaml
  text: For if that first covenant had been faultless[b][a], no place would have been sought for a second.
translation:
  language: ta
  text: ஏனெனில், அந்த முதலாவது உடன்படிக்கை[a] குறையற்றதாக இருந்திருந்தால், இரண்டாவதற்கு இடம்[b] தேடப்பட்டிருக்காது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் சொல்லுக்குச் சொல், ‘அந்த முதலாவது’; ‘உடன்படிக்கை’ என்பது சூழலிலிருந்து சேர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘இரண்டாவதற்கு வாய்ப்பு/சந்தர்ப்பம் தேடப்பட்டிருக்காது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ γὰρ
  choice: ஏனெனில், ... இருந்திருந்தால்
  rationale: γάρ முந்தைய வாதத்திற்கான விளக்கத் தொடர்பைக் காட்டுவதால் ‘ஏனெனில்’ என்றும், Εἰ நிபந்தனையைக் காட்டுவதால் ‘இருந்திருந்தால்’ என்றும் மொழிபெயர்க்கப்பட்டது.
- source_word: ἡ πρώτη ἐκείνη
  choice: அந்த முதலாவது உடன்படிக்கை
  rationale: பெண்பால் பெயரடைத் தொடர் சூழலில் குறிப்பிடப்பட்ட உடன்படிக்கையையே குறிக்கிறது. தமிழில் பொருள் தெளிவாக இருக்க ‘உடன்படிக்கை’ சேர்க்கப்பட்டுள்ளது; இது கிரேக்கத்தில் வெளிப்படையாக இல்லை என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: ἦν ἄμεμπτος
  choice: குறையற்றதாக இருந்திருந்தால்
  rationale: ἄμεμπτος என்பது குறை அல்லது பழி சுமத்துவதற்கான அடிப்படை இல்லாத நிலையைச் சுட்டுகிறது. எதிர்நிகழ்வு நிபந்தனையின் வலிமையை ‘இருந்திருந்தால்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οὐκ ἂν
  choice: தேடப்பட்டிருக்காது
  rationale: οὐκ உடன் ἄν எதிர்நிகழ்வு நிபந்தனையின் விளைவைக் குறிக்கிறது; தமிழின் எதிர்மறை இறந்தகால நிபந்தனை வடிவம் அதைப் பாதுகாக்கிறது.
- source_word: δευτέρας
  choice: இரண்டாவதற்கு
  rationale: இங்கு ‘இரண்டாவது உடன்படிக்கை’ என்பது சூழலால் புரிகிறது. கிரேக்கத்தின் சுருக்கத்தைப் பேண தமிழிலும் பெயர்ச்சொல் மீண்டும் சேர்க்கப்படவில்லை.
- source_word: ἐζητεῖτο τόπος
  choice: இடம் தேடப்பட்டிருக்காது
  rationale: சொல்லமைப்புக்கு நெருக்கமாக ‘இடம் தேடப்படுதல்’ எனக் கொடுக்கப்பட்டுள்ளது; இத்தொடர் ‘வாய்ப்பு அல்லது சந்தர்ப்பம் தேடப்படுதல்’ என்றும் பொருள்படலாம் என்பதைக் அடிக்குறிப்பு காட்டுகிறது.
theological_decisions:
- issue: கிரேக்கத்தில் மீண்டும் சொல்லப்படாத ‘உடன்படிக்கை’ என்பதை வெளிப்படையாகச் சேர்த்தல்
  choice: ‘அந்த முதலாவது உடன்படிக்கை’ என்று கொடுக்கப்பட்டது.
  alternative: ‘அந்த முதலாவது’ அல்லது ‘முதலாவது’
  rationale: உடனடியான சூழல் முதலாவது மற்றும் இரண்டாவது உடன்படிக்கைகளை ஒப்பிடுகிறது. ‘உடன்படிக்கை’ என்பதைச் சேர்ப்பது புதிய இறையியல் கருத்தைச் சேர்க்காமல் மறைந்துள்ள சுட்டுப்பொருளைத் தெளிவாக்குகிறது.
- issue: முதலாவது உடன்படிக்கையில் இருந்த குறையின் தன்மை
  choice: ‘குறையற்றதாக’ என்று மட்டும் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘குற்றமற்றதாக’ அல்லது ‘பழியற்றதாக’
  rationale: குறை உடன்படிக்கையிலா, அதன் நடைமுறையிலா, அதனோடு தொடர்புடைய மக்களிலா என்பதை இந்த வசனம் தனியாக விளக்கவில்லை. ஆகவே அந்த இறையியல் பதற்றம் விரிவுரை இன்றி பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘இருந்திருந்தால் ... தேடப்பட்டிருக்காது’ என்ற கட்டமைப்பு கிரேக்கத்தின் எதிர்நிகழ்வு நிபந்தனையை இயல்பாக எடுத்துரைக்கிறது.
