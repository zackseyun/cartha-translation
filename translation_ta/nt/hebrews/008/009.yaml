source:
  edition: SBLGNT
  text: οὐ κατὰ τὴν διαθήκην ἣν ἐποίησα τοῖς πατράσιν αὐτῶν ἐν ἡμέρᾳ ἐπιλαβομένου μου τῆς χειρὸς αὐτῶν ἐξαγαγεῖν αὐτοὺς ἐκ γῆς Αἰγύπτου, ὅτι αὐτοὶ οὐκ ἐνέμειναν ἐν τῇ διαθήκῃ μου, κἀγὼ ἠμέλησα αὐτῶν, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/009.yaml
  text: not like the covenant that I made with their fathers on the day when I took hold of their hand to bring them out of the land of Egypt[a], because they did not continue in my covenant, and I disregarded them[b], says the Lord.
translation:
  language: ta
  text: அவர்களது முற்பிதாக்களுடன் நான் செய்த உடன்படிக்கையைப் போன்ற உடன்படிக்கை அல்ல இது. அவர்களது கையைப் பிடித்து[a], அவர்களை எகிப்து நாட்டிலிருந்து வெளியே கொண்டுவந்த நாளில் அந்த உடன்படிக்கையைச் செய்தேன். ஏனெனில், அவர்கள் என் உடன்படிக்கையில் நிலைத்திருக்கவில்லை; நானும் அவர்களைப் புறக்கணித்தேன்[b] என்று ஆண்டவர் சொல்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் மரபுத்தொடராக, “அவர்களைக் கைப்பிடித்து” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயர் நிருபத்தில் காணப்படும் கிரேக்க மேற்கோள், “அவர்களைப் புறக்கணித்தேன்” என்று கூறுகிறது. ஆனால் எரேமியா 31:32-ன் எபிரேய உரை வேறுபட்ட பொருளைக் கொண்டுள்ளது; அது பெரும்பாலும் “நான் அவர்களுடைய கணவனாக இருந்தபோதிலும்” அல்லது “நான் அவர்களுடைய எஜமானனாக இருந்தபோதிலும்” என்று மொழிபெயர்க்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: διαθήκην
  choice: உடன்படிக்கை
  rationale: எபிரெயரில் கடவுளுக்கும் அவரது மக்களுக்கும் இடையிலான உடன்படிக்கை உறவைக் குறிக்கும் சூழலுக்கு இது துல்லியமான, வழக்கமான தமிழ் சொல்.
- source_word: πατράσιν
  choice: தந்தையர்
  rationale: கிரேக்கச் சொல் ஆண்பால் பன்மையில் இருந்து இஸ்ரவேலின் முற்பிதாக்களைக் குறிக்கிறது; மூலத்தின் பாலினக் குறிப்பைத் தக்கவைக்கிறது.
- source_word: ἐν ἡμέρᾳ
  choice: நாளில்
  rationale: விடுதலை நிகழ்ந்த வரலாற்றுத் தருணத்தைத் தெளிவாகக் குறிக்கும் காலச்சொற்றொடர்.
- source_word: ἐπιλαβομένου μου τῆς χειρὸς αὐτῶν
  choice: அவர்களுடைய கையைப் பிடித்து
  rationale: ஒருமை வடிவிலுள்ள ‘கை’ என்ற உருவகத்தையும், கடவுள் தனிப்பட்ட முறையில் வழிநடத்திய காட்சியையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἐξαγαγεῖν
  choice: வெளியே கொண்டுவர
  rationale: ἐξάγω என்பதன் வெளியே அழைத்தல் அல்லது கொண்டுவருதல் என்ற பொருளை, கைப்பிடித்து நடத்தும் முன்சொற்றொடருடன் இயல்பாக இணைக்கிறது.
- source_word: γῆς Αἰγύπτου
  choice: எகிப்து நாடு
  rationale: γῆς என்பதையும் விடாமல் முழுச் சொற்றொடரையும் தமிழில் பிரதிபலிக்கிறது.
- source_word: ἐνέμειναν
  choice: நிலைத்திருக்கவில்லை
  rationale: உடன்படிக்கைக்குள் தொடர்ந்து உண்மையுடன் இருப்பதைச் சுட்டும் ἐμμένω என்பதன் பொருளை இயல்பாகத் தருகிறது.
- source_word: κἀγὼ
  choice: நானும்
  rationale: விளைவுக் குறிப்பு சூழலில் இருந்தாலும், கிரேக்கத்தின் எளிய ‘நானும்/நானும் அதன்பின்’ என்ற இணைப்பை மிகைப்படுத்தாமல் காக்கிறது.
- source_word: ἠμέλησα αὐτῶν
  choice: அவர்களைப் புறக்கணித்தேன்
  rationale: கவனியாமல் விடுதல் அல்லது பொருட்படுத்தாமல் இருத்தல் என்ற கிரேக்கப் பொருளை, ‘கைவிட்டேன்’ போன்ற வலுவான கூடுதல் கருத்தைச் சேர்க்காமல் தருகிறது.
- source_word: λέγει κύριος
  choice: ஆண்டவர் சொல்கிறார்
  rationale: மேற்கோள் அறிமுகத்தின் நிகழ்காலத்தையும் κύριος என்பதற்கான மரபான, இயல்பான தமிழ் வடிவத்தையும் காக்கிறது.
theological_decisions:
- issue: எரேமியா 31:32-ன் எபிரெய உரைக்கும் எபிரெயர் 8:9-ன் கிரேக்க மேற்கோளுக்கும் இடையிலான ἠμέλησα αὐτῶν குறித்த வேறுபாடு
  choice: நானும் அவர்களைப் புறக்கணித்தேன்
  alternative: நான் அவர்களுடைய கணவனாக/எஜமானனாக இருந்தபோதிலும்
  rationale: எபிரெயர் நிருபத்தின் கிரேக்க உரை தெளிவாக ‘அவர்களைப் புறக்கணித்தேன்’ என்ற பொருளைத் தருகிறது. ஆகவே மொழிபெயர்ப்பு அதைப் பின்பற்றுகிறது; எபிரெயப் பழைய ஏற்பாட்டு உரையின் வேறுபட்ட பொருள் முக்கியமான இடைநூல் பதற்றமாக அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியம் தமிழ் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டாலும், காரணத் தொடர்பும் மேற்கோள் அமைப்பும் காக்கப்பட்டுள்ளன.
