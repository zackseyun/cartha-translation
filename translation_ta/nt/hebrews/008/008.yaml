id: HEB.8.8
reference: Hebrews 8:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μεμφόμενος γὰρ ⸀αὐτοὺς λέγει· Ἰδοὺ ἡμέραι ἔρχονται, λέγει κύριος, καὶ συντελέσω ἐπὶ τὸν οἶκον Ἰσραὴλ καὶ ἐπὶ τὸν οἶκον Ἰούδα διαθήκην καινήν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/008.yaml
  text: For in finding fault with them he says, “Look, days are coming, says the Lord, when I will establish a new covenant with the house of Israel and with the house of Judah,”
translation:
  language: ta
  text: 'ஏனெனில், அவர்களிடம் குறை கண்டு அவர் கூறுகிறார்: “இதோ, நாட்கள் வருகின்றன என்று ஆண்டவர் கூறுகிறார்; அப்போது இஸ்ரவேல் வீட்டாரோடும் யூதா வீட்டாரோடும் ஒரு புதிய உடன்படிக்கையை ஏற்படுத்துவேன்,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεμφόμενος ... αὐτοὺς
  choice: அவர்களிடம் குறைகண்டு
  rationale: குறை காணுதல் அல்லது குற்றம் சாட்டுதல் என்ற பொருளைத் தரும் தொடரையும், அதன் பன்மைச் சுட்டுப்பெயரையும் இயல்பான தமிழில் காக்கிறது.
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: வரவிருக்கும் அறிவிப்பின்மீது கவனத்தை ஈர்க்கும் மூலமொழியின் உரையாடல் வலிமையைத் தக்கவைக்கிறது.
- source_word: συντελέσω
  choice: ஏற்படுத்துவேன்
  rationale: ஒரு உடன்படிக்கையை நிறைவேற்றி நிறுவுதல் என்ற சூழல்சார் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: διαθήκην καινήν
  choice: ஒரு புதிய உடன்படிக்கையை
  rationale: διαθήκη என்பதற்கான வேதாகமச் சூழலுக்கு ஏற்ற பொதுவான தமிழ் சொல் ‘உடன்படிக்கை’; καινήν என்பதின் புதுமையை நேரடியாகக் காக்கிறது.
- source_word: οἶκον Ἰσραὴλ ... οἶκον Ἰούδα
  choice: இஸ்ரவேல் வீட்டாரோடும் யூதா வீட்டாரோடும்
  rationale: ‘வீடு’ என்பது இங்கு கட்டிடத்தைவிட மக்கள்/வம்சக் குழுவைக் குறிப்பதால், உருவகத்தை இயல்பாக உணர்த்த ‘வீட்டார்’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: μεμφόμενος என்பதின் பொருள் யார்மீது செல்கிறது
  choice: அவர்களிடம் குறைகண்டு
  alternative: அதில் குறைகண்டு / உடன்படிக்கையில் குறைகண்டு
  rationale: SBLGNT வாசகத்தில் αὐτούς (‘அவர்கள்’) இருப்பதால், குறை மக்களிடம் காணப்படுவதாக மொழிபெயர்க்கப்பட்டது; இது உடன்படிக்கையையே குறையுள்ளதாக மாற்றிப் பொருள் கூறுவதைத் தவிர்க்கிறது.
- issue: சங்கீத/தீர்க்கதரிசன மேற்கோளில் κύριος
  choice: ஆண்டவர்
  alternative: கர்த்தர் / யாவே
  rationale: கிரேக்க மூலத்தின் κύριος என்பதைக் நேரடியாகவும், நவீன மரியாதைமிக்க பொதுத் தமிழிலும் தருகிறது; எபிரெயப் பின்னணியை அடிப்படையாகக் கொண்டு தனிப்பட்ட பெயரை உரைக்குள் சேர்க்கவில்லை.
- issue: சினாய் உடன்படிக்கையுடனான புதிய உடன்படிக்கையின் உறவு
  choice: ஒரு புதிய உடன்படிக்கை
  alternative: புதுப்பிக்கப்பட்ட உடன்படிக்கை
  rationale: καινήν என்பதைக் ‘புதிய’ என்று நேரடியாகத் தருகிறது; தொடர்ச்சியா மாற்றீடா என்ற இறையியல் கேள்வியை மொழிபெயர்ப்பில் முன்கூட்டியே தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதைமிக்க, தெளிவான வேதாகம நடை. மேற்கோளின் அறிவிப்புத் தன்மையை ‘இதோ’ காக்கிறது. ‘வீட்டார்’ என்பது இங்கு வம்ச/மக்கள் சமூகத்தை இயல்பாகக் குறிக்கிறது.
