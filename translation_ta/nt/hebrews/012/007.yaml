id: HEB.12.7
reference: Hebrews 12:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰς παιδείαν ὑπομένετε· ὡς υἱοῖς ὑμῖν προσφέρεται ὁ θεός· τίς ⸀γὰρ υἱὸς ὃν οὐ παιδεύει πατήρ;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/007.yaml
  text: Endure for discipline[a]; God is dealing with you as with sons[b]. For what son is there whom a father does not discipline?
translation:
  language: ta
  text: ஒழுக்கப் பயிற்சிக்காகச் சகித்துக்கொள்ளுங்கள்[a]. கடவுள் உங்களை மகன்களாகக் கருதி நடத்துகிறார்[b]. ஏனெனில், தந்தை ஒழுக்கப்படுத்தாத மகன் யார்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இதை ஒழுக்கப் பயிற்சியாக எண்ணிச் சகித்துக்கொள்ளுங்கள்.’ கிரேக்கச் சொற்றொடரை, ஒழுக்கப் பயிற்சியின் பொருட்டுச் சகித்துக்கொள்ளுங்கள் என்றோ, சகித்துக்கொள்ளப்படுவதை ஒழுக்கப் பயிற்சியாகக் கருதுங்கள் என்றோ புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: கிரேக்கில் ‘மகன்கள்.’ இச்சொல் தந்தை–மகன் ஒப்புமையைத் தொடர்கிறது; ஆனால் இதன் பயன்பாடு ஆண்களுக்கு மட்டும் வரையறுக்கப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς παιδείαν
  choice: ஒழுக்கப் பயிற்சிக்காக
  rationale: παιδεία என்பது வெறும் தண்டனையை அல்ல, திருத்தி வளர்க்கும் பயிற்சியையும் உள்ளடக்குகிறது. εἰς என்பதன் நோக்கம் அல்லது விளைவு சார்ந்த பொருளை ‘-க்காக’ இயல்பாக வெளிப்படுத்துகிறது; ‘ஒழுக்கப் பயிற்சியாக’ என்பதும் சாத்தியம் என்பதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ὑπομένετε
  choice: சகித்துக்கொள்ளுங்கள்
  rationale: இவ்வடிவம் இலக்கணரீதியாகக் கூற்றாகவோ கட்டளையாகவோ அமையக்கூடியது; இச்சூழலில் அறிவுறுத்தலாக எடுத்துக்கொள்வது இயல்பானது. கிரேக்கத்தில் இல்லாத குறிப்பிட்ட செயப்படுபொருளை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: ὡς υἱοῖς
  choice: உங்களை மகன்களாக
  rationale: தகப்பன்–மகன் ஒப்புமையைத் தெளிவாகவும் இயல்பான தமிழிலும் காக்கிறது. ‘பிள்ளைகளாக’ என்பது பயன்பாட்டின் பரப்பைத் தெளிவாக்கினாலும், மூலத்தின் ஆண்பால் குடும்பப் படிமத்தை மறைத்துவிடும்.
- source_word: προσφέρεται
  choice: நடத்துகிறார்
  rationale: இங்கு இது ‘ஒருவரிடம் ஒரு குறிப்பிட்ட முறையில் நடந்துகொள்’ என்ற உறவுசார் பொருளைத் தருகிறது. சொல்லுக்குச் சொல் ‘முன்வைக்கப்படுகிறார்’ என மொழிபெயர்ப்பது இச்சூழலில் தவறாக வழிநடத்தும்.
- source_word: τίς γὰρ υἱὸς ὃν οὐ παιδεύει πατήρ
  choice: ஏனெனில், தகப்பன் ஒழுக்கப்படுத்தாத மகன் யார்?
  rationale: தகப்பன் பொதுவாகத் தன் மகனைத் திருத்திப் பயிற்றுவிப்பார் என்ற வாதத்தை வலியுறுத்தும் வினாவாக மொழிபெயர்க்கப்பட்டுள்ளது. παιδεία–παιδεύει ஆகியவற்றின் சொற்பொருள் தொடர்பை ‘ஒழுக்கப் பயிற்சி–ஒழுக்கப்படுத்து’ என்பவை காக்கின்றன.
theological_decisions:
- issue: தகப்பன்–மகன் ஒப்புமையிலுள்ள ஆண்பால் குடும்ப மொழி
  choice: முதன்மை உரையில் ‘மகன்களாக’ என்பதை வைத்தல்
  alternative: ‘பிள்ளைகளாக’
  rationale: வசனத்தின் வாதம் வெளிப்படையாகத் தகப்பன்–மகன் ஒப்புமையைப் பயன்படுத்துகிறது. ஆகவே மூலத்தின் படிமம் காக்கப்படுகிறது; அதேவேளை இது ஆண்களுக்கு மட்டும் பொருந்துவது அல்ல என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
- issue: துன்பத்தை ஒழுக்கப் பயிற்சியுடன் தொடர்புபடுத்தும் விதம்
  choice: ‘ஒழுக்கப் பயிற்சிக்காகச் சகித்துக்கொள்ளுங்கள்’ என்ற அறிவுறுத்தல்
  alternative: ‘இதை ஒழுக்கப் பயிற்சியாக எண்ணிச் சகித்துக்கொள்ளுங்கள்’
  rationale: εἰς παιδείαν என்ற சொற்றொடர் நோக்கம்/விளைவைச் சுட்டலாம்; அனுபவிக்கப்படுவதை ஒழுக்கப் பயிற்சியாகக் கருதுமாறும் புரிந்துகொள்ளலாம். ஒரு பொருளை மட்டும் இறுதியானதாக ஆக்காமல் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. ‘ஒழுக்கப் பயிற்சி’ என்பது தண்டனை என்ற குறுகிய பொருளைத் தவிர்த்து, திருத்தி வளர்க்கும் παιδεία என்பதன் பரப்பை வெளிப்படுத்துகிறது.
