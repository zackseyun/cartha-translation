id: HEB.12.12
reference: Hebrews 12:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Διὸ τὰς παρειμένας χεῖρας καὶ τὰ παραλελυμένα γόνατα ἀνορθώσατε,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/012.yaml
  text: Therefore[a], strengthen your drooping hands and your weakened knees,
translation:
  language: ta
  text: ஆகையால்[a], தளர்ந்து தொங்கும் கைகளையும் வலுவிழந்த முழங்கால்களையும் நிமிர்த்துங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் சொற்சார்பாக, “தொங்கிப்போன கைகளையும் வலுவிழந்த முழங்கால்களையும் நிமிர்த்துங்கள்” என்றும் மொழிபெயர்க்கலாம். இந்தச் சொற்கள் கிரேக்க மொழிபெயர்ப்பு மரபிலுள்ள ஏசாயா 35:3-ஐ எதிரொலித்து, புதுப்பிக்கப்பட்ட துணிவையும் சகிப்புத்தன்மையையும் உடல்சார் உருவகத்தால் தெரிவிக்கின்றன.
    reason: cross_reference
lexical_decisions:
- source_word: Διὸ
  choice: ஆகையால்
  rationale: முந்தைய பகுதியில் கூறப்பட்ட ஒழுக்கப் பயிற்சி, சகிப்புத்தன்மை ஆகியவற்றிலிருந்து இந்த அறிவுரை முடிவாக வருவதைத் தெளிவாகக் காட்டும் இயல்பான காரணவிளைவுச் சொல்.
- source_word: παρειμένας χεῖρας
  choice: தளர்ந்து தொங்கும் கைகள்
  rationale: παρίημι என்பதன் பங்கேற்புவடிவம் தளர விடப்பட்டு கீழே தொங்கும் நிலையைச் சித்தரிக்கிறது. ‘தளர்ந்து தொங்கும்’ என்பது அந்த உடல்சார் உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: παραλελυμένα γόνατα
  choice: வலுவிழந்த முழங்கால்கள்
  rationale: παραλύω என்பதன் நிறைவுநிலைப் பங்கேற்புவடிவம் பலவீனமடைந்த அல்லது செயல்திறன் குன்றிய முழங்கால்களைக் குறிக்கிறது. இங்கு மருத்துவ ரீதியான முடக்குவாதம் பொருளல்ல என்பதால் ‘வலுவிழந்த’ என்பது உருவகத்தையும் சூழலையும் காக்கிறது.
- source_word: ἀνορθώσατε
  choice: நிமிர்த்துங்கள்
  rationale: இந்த இறந்தகாலக் கட்டளைவினை தீர்மானமான செயலை வலியுறுத்துகிறது. ἀνορθόω என்பதன் ‘நிமிரச் செய்/நேராக்கு’ என்ற உடல்சார் படிமத்தை ‘நிமிர்த்துங்கள்’ நேரடியாகக் காக்கிறது; சூழலில் அது புதுப்பிக்கப்பட்ட துணிவையும் விடாமுயற்சியையும் உணர்த்துகிறது.
theological_decisions:
- issue: உடல் பலவீனத்தைச் சித்தரிக்கும் உருவக அறிவுரை
  choice: உடல்சார் படிமத்தை ‘தளர்ந்து தொங்கும் கைகள்’, ‘வலுவிழந்த முழங்கால்கள்’, ‘நிமிர்த்துங்கள்’ என்று காத்து, புதுப்பிக்கப்பட்ட துணிவும் நிலைத்திருத்தலும் சூழலிலிருந்து வெளிப்படுமாறு மொழிபெயர்த்தல்
  alternative: உருவகத்தின் பொருளை நேரடியாக விளக்கி, ‘உங்களை வலுப்படுத்திக்கொள்ளுங்கள்’ என்று மொழிபெயர்த்தல்
  rationale: எபிரெயர் 12-ன் உடனடிச் சூழல் சகிப்புத்தன்மை, ஒழுக்கப் பயிற்சி, விடாமுயற்சி ஆகியவற்றைப் பற்றியது; அதே நேரத்தில் வசனம் ஏசாயா 35:3-ன் கிரேக்க மரபை எதிரொலிக்கும் தெளிவான உடல்சார் உருவகத்தைப் பயன்படுத்துகிறது. ஆகவே உருவகத்தை விளக்கமாக மாற்றாமல் காப்பது பொருளையும் இலக்கியத் தொடர்பையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘நிமிர்த்துங்கள்’ என்ற சொல் மூலத்தின் உடல்சார் படிமத்தைப் பாதுகாக்கிறது; ‘வலுவிழந்த’ என்பது தேவையற்ற மருத்துவப் பொருளைத் தவிர்க்கிறது. வாசகர்களை நேரடியாக நோக்கும் பன்மை மரியாதைக் கட்டளை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
