source:
  edition: SBLGNT
  text: ἴστε γὰρ ὅτι καὶ μετέπειτα θέλων κληρονομῆσαι τὴν εὐλογίαν ἀπεδοκιμάσθη, μετανοίας γὰρ τόπον οὐχ εὗρεν, καίπερ μετὰ δακρύων ἐκζητήσας αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/017.yaml
  text: For you know that afterward[a], when he wanted to inherit the blessing, he was rejected, for he found no opportunity for repentance[b], though he sought it with tears.
translation:
  language: ta
  text: ஏனெனில், பின்புகூட அவன் அந்த ஆசீர்வாதத்தை மரபுரிமையாகப் பெற விரும்பியபோது நிராகரிக்கப்பட்டான் என்பது உங்களுக்குத் தெரியும். மனந்திரும்புவதற்கான வாய்ப்பு அவனுக்குக் கிடைக்கவில்லை[a]; கண்ணீரோடு அதைத் தேடியபோதிலும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனமாற்றத்திற்கு அவன் இடம் காணவில்லை.” இதன் பொருள், நடந்ததன் விளைவை மாற்ற அவனுக்கு வாய்ப்பு கிடைக்கவில்லை என்பதாகவோ, ஈசாக்கின் மனதை மாற்ற அவனால் முடியவில்லை என்பதாகவோ இருக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: “அதை” என்பது “ஆசீர்வாதத்தை” அல்லது—சாத்தியம் குறைவாக—“மனந்திரும்புதலை/அதற்கான வாய்ப்பை” குறிக்கலாம்; கிரேக்கத்தில் எதைக் குறிக்கிறது என்பது தெளிவாக இல்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴστε
  choice: உங்களுக்குத் தெரியும்
  rationale: οἶδα-வின் நிறைவுவடிவம் நிகழ்காலப் பொருளில் உள்ளது; வாசகர்கள் ஏற்கெனவே அறிந்திருப்பதை ஆசிரியர் சுட்டுகிறார்.
- source_word: μετέπειτα
  choice: பின்பு
  rationale: பின்னர் நிகழ்ந்த காலத்தைக் குறிக்கும் இயல்பான, சுருக்கமான தமிழ் சொல்.
- source_word: θέλων
  choice: விரும்பியபோது
  rationale: பங்கேற்புவினையை இயல்பான காலத் துணைவாக்கியமாக வழங்கி, அவனுடைய விருப்பத்தைப் பாதுகாக்கிறது.
- source_word: κληρονομῆσαι
  choice: சுதந்தரித்துக்கொள்ள
  rationale: κληρονομέω என்பதன் மரபுரிமையாகப் பெறுதல் என்ற பொருளையும் ஆதியாகமப் பின்னணியையும் காக்கிறது.
- source_word: τὴν εὐλογίαν
  choice: அந்த ஆசீர்வாதத்தை
  rationale: குறிப்பிட்ட தந்தைவழி ஆசீர்வாதத்தைச் சுட்டும் வரையறைச் சுட்டை தமிழில் ‘அந்த’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀπεδοκιμάσθη
  choice: நிராகரிக்கப்பட்டான்
  rationale: ஆய்ந்து ஏற்காமல் தள்ளப்பட்டதைக் குறிக்கும் செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது; இரட்சிப்பியல் தொழில்நுட்பப் பொருளைத் திணிக்கவில்லை.
- source_word: μετανοίας ... τόπον
  choice: மனந்திரும்புவதற்கு ... இடம்
  rationale: கிரேக்கத்தின் ‘இடம் காணவில்லை’ என்ற உருவகத்தைப் பாதுகாப்பதால் வாய்ப்பு இல்லாமை, விளைவை மாற்ற முடியாமை, அல்லது ஈசாக்கின் மனமாற்றத்தைப் பெற முடியாமை ஆகிய சாத்தியங்கள் திறந்தே உள்ளன.
- source_word: μετὰ δακρύων
  choice: கண்ணீரோடு
  rationale: தேடலின் முறையையும் தீவிரத்தையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐκζητήσας
  choice: தேடியும்
  rationale: ἐκζητέω-வின் தீவிரம் சூழலிலுள்ள ‘கண்ணீரோடு’ என்பதால் வெளிப்படுகிறது; தேவையற்ற விளக்கச் சொல்லைச் சேர்க்கவில்லை.
- source_word: αὐτήν
  choice: அதை
  rationale: பெண்பால் ஒருமைச் சுட்டுப்பெயர் ‘ஆசீர்வாதம்’ அல்லது ‘மனந்திரும்புதல்/அதற்கான இடம்’ ஆகியவற்றில் எதைக் குறிக்கிறது என்ற கிரேக்கத் தெளிவின்மையைத் தமிழிலும் காக்கிறது.
theological_decisions:
- issue: αὐτήν (‘அதை’) என்பதன் முன்னிலைச் சொல் மற்றும் ‘மனந்திரும்புவதற்கு இடம் காணவில்லை’ என்ற சொற்றொடரின் பொருள்
  choice: முதன்மை உரையில் ‘அதை’ என்று வைத்து முன்னிலைச் சொல்லைத் தீர்மானிக்காமல், ‘மனந்திரும்புவதற்கு இடம்’ என்ற உருவகத்தையும் காத்தல்
  alternative: ‘அதை’ என்பது ஆசீர்வாதத்தைக் குறிக்கிறது என்று வெளிப்படையாக மொழிபெயர்த்தல்; அல்லது ஈசாக்கின் மனதை மாற்ற வாய்ப்பு கிடைக்கவில்லை என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: εὐλογίαν, μετανοίας ஆகிய இரண்டும் பெண்பால் பெயர்ச்சொற்கள்; αὐτήν எதைக் குறிக்கிறது என்பது இலக்கணத்தால் முழுமையாகத் தீர்மானிக்கப்படவில்லை. மேலும் ‘மனந்திரும்புவதற்கு இடம்’ என்பது ஏசாவின் மனந்திரும்புதல், விளைவை மாற்றுதல், அல்லது ஈசாக்கின் மனமாற்றம் எனப் புரிந்துகொள்ளப்பட்டிருக்கிறது. ஆகவே இறையியல் பதற்றத்தை முதன்மை உரை தீர்த்துவிடவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. ‘சுதந்தரித்துக்கொள்ள’ என்பது வேதாகம மரபுரிமைப் பின்னணியைப் பாதுகாக்கிறது; ‘இடம் காணவில்லை’ என்பது மூல உருவகத்தையும் அதன் உண்மையான பொருள் தெளிவின்மையையும் காக்கிறது. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
