id: HEB.12.21
reference: Hebrews 12:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καί, οὕτω φοβερὸν ἦν τὸ φανταζόμενον, Μωϋσῆς εἶπεν· Ἔκφοβός εἰμι καὶ ἔντρομος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/021.yaml
  text: And so terrifying was the sight that Moses said[b][a], “I am fearful and trembling.”
translation:
  language: ta
  text: அந்தக் காட்சி அவ்வளவு பயங்கரமாக இருந்ததால், மோசே, “நான் மிகவும் அஞ்சுகிறேன்; நடுங்குகிறேன்” என்று சொன்னார்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அந்தக் காட்சி” என்பதற்கு “தோன்றியது” அல்லது “கண்முன் தெரிந்த காட்சி” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடர் சீனாயில் காணப்பட்ட வெளிப்பாட்டைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இவை பழைய ஏற்பாட்டிலிருந்து சொற்சொல்லாக எடுத்த மேற்கோள் அல்ல; சீனாய் நிகழ்வுடன் தொடர்புடைய மோசேயின் அச்சத்தைப் பிரதிபலிக்கின்றன. உபாகமம் 9:19-ஐ ஒப்பிடுக.
    reason: cross_reference
lexical_decisions:
- source_word: καί
  choice: அந்தக் காட்சி
  rationale: முந்தைய வசனத்தின் சீனாய் நிகழ்வுகளுடன் இயல்பாகத் தொடர்கிறது; தமிழில் தனியாக ‘மேலும்’ சேர்ப்பதைவிட காரணவிளைவு வாக்கிய அமைப்பு ஓட்டத்தைத் தெளிவாக்குகிறது.
- source_word: οὕτω φοβερὸν ἦν
  choice: அவ்வளவு பயங்கரமாக இருந்ததால்
  rationale: οὕτω வலியுறுத்தும் அளவையும் φοβερόν தரும் கடும் அச்ச உணர்வையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὸ φανταζόμενον
  choice: அந்தக் காட்சி
  rationale: சீனாயில் கண்முன் தோன்றிய வெளிப்பாட்டைக் குறிக்கும் பெயராக்கப்பட்ட பங்கேற்புச் சொல்லுக்கு இயல்பான தமிழ்; ‘தோன்றியது’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: Μωϋσῆς εἶπεν
  choice: மோசே ... என்று சொன்னார்
  rationale: பெயரையும் எளிய உரைவினையையும் வழக்கமான தமிழில் நேரடியாக வழங்குகிறது.
- source_word: Ἔκφοβός εἰμι
  choice: நான் மிகவும் அஞ்சுகிறேன்
  rationale: ἔκφοβος குறிக்கும் தீவிர அச்சத்தை ‘மிகவும்’ என்பதன் மூலம் காக்கிறது; அடுத்துள்ள நடுக்கத்துடன் ஒன்றாக்காமல் தனியே வைத்துள்ளது.
- source_word: καὶ ἔντρομος
  choice: நடுங்குகிறேன்
  rationale: ἔντρομος குறிக்கும் நடுக்கத்தைத் தனித்த கூறாகப் பாதுகாக்கிறது; கிரேக்கத்தில் உள்ள ‘அஞ்சுதல்’ மற்றும் ‘நடுங்குதல்’ என்ற இரு வெளிப்பாடுகளும் தமிழில் கேட்கின்றன.
theological_decisions:
- issue: இந்தக் கூற்றுக்கும் பழைய ஏற்பாட்டிலுள்ள சீனாய் நிகழ்வுக்கும் உள்ள தொடர்பு
  choice: மோசே அச்சத்துடன் கூறிய பதிலாக முதன்மை உரையில் நேரடியாக வழங்குதல்
  alternative: இதை உபாகமம் 9:19-ன் சொற்சொல்லான மேற்கோள் அல்லது சீனாய் மரபுகளின் சுதந்திரச் சுருக்கம் என்று முதன்மை உரையிலேயே விளக்குதல்
  rationale: கிரேக்க உரை மோசே இப்படிச் சொன்னதாக நேரடியாகக் கூறுகிறது. அதன் சரியான பழைய ஏற்பாட்டு மூலத்தை முதன்மை உரையில் ஒத்திசைக்காமல், இடைஉரைத் தொடர்பை அடிக்குறிப்பில் குறிப்பிடுவது உரையின் இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘மிகவும் அஞ்சுகிறேன்; நடுங்குகிறேன்’ என்று இரண்டு கிரேக்கப் பண்புகளையும் வேறுபடுத்திப் பாதுகாத்துள்ளது. அடிக்குறிப்பு குறிகள் அனைத்தும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
