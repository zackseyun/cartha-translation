id: HEB.12.5
reference: Hebrews 12:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐκλέλησθε τῆς παρακλήσεως, ἥτις ὑμῖν ὡς υἱοῖς διαλέγεται, Υἱέ μου, μὴ ὀλιγώρει παιδείας κυρίου, μηδὲ ἐκλύου ὑπ’ αὐτοῦ ἐλεγχόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/005.yaml
  text: 'And you have forgotten the exhortation that addresses you as sons: “My son[a], do not regard lightly the Lord’s discipline[c][b], nor lose heart when you are reproved by him.”'
translation:
  language: ta
  text: 'மேலும், உங்களை மகன்களாகக் கருதி உங்களிடம் பேசும் இந்த அறிவுரையை நீங்கள் மறந்துவிட்டீர்கள்:


    “என் மகனே[a], ஆண்டவரின் ஒழுக்கப் பயிற்சியை[b][c] அற்பமாக எண்ணாதே;

    அவர் உன்னைக் கண்டிக்கும்போது மனந்தளராதே.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் பிள்ளையே.” கிரேக்கத்தில் “மகனே” என்று உள்ளது; இது நீதிமொழிகளின் சொற்களையும் இப்பகுதியின் பிரதிநிதித்துவ மகன்தன்மை மொழியையும் எதிரொலிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “ஒழுக்கப் பயிற்சி” என்பது தண்டனையை மட்டும் குறிக்காமல், பயிற்றுவித்தல், போதித்தல், திருத்துதல் ஆகியவற்றையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: நீதிமொழிகள் 3:11-இலிருந்து மேற்கோள்.
    reason: cross_reference
lexical_decisions:
- source_word: ἐκλέλησθε
  choice: மறந்துவிட்டீர்கள்
  rationale: நிகழ்ந்த மறதியின் விளைவாகத் தொடரும் தற்போதைய நிலையை கிரேக்க நிறைவுக்காலம் காட்டுகிறது; ‘மறந்துவிட்டீர்கள்’ என்பது இதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: παρακλήσεως
  choice: அறிவுரையை
  rationale: இந்தச் சூழலில் ஊக்கமளிப்பதோடு எச்சரித்து வழிநடத்தும் பொருள் முதன்மையாக உள்ளது. ‘அறிவுரை’ அந்த இரு கூறுகளையும் இயல்பாகத் தாங்குகிறது.
- source_word: ἥτις ὑμῖν ὡς υἱοῖς διαλέγεται
  choice: மகன்களிடம் பேசுவதுபோல் உங்களிடம் பேசும்
  rationale: வேதவாக்கு வாசகர்களை நேரடியாக மகன்கள் என்ற நிலையில் அணுகிப் பேசுவதைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: Υἱέ μου
  choice: என் மகனே
  rationale: ஒருமை விளிவடிவிலுள்ள ‘மகன்’ என்ற சொல்லைத் தக்கவைத்து, நீதிமொழிகள் மேற்கோளுடனான சொல் தொடர்பைப் பாதுகாக்கிறது.
- source_word: ὀλιγώρει
  choice: அற்பமாக எண்ணாதே
  rationale: முக்கியமற்றதாகக் கருதுதல் அல்லது அலட்சியம் செய்தல் என்பதே வினையின் மையப் பொருள்; ‘வெறுக்காதே’ என்பதைவிட இது துல்லியமானது.
- source_word: παιδείας
  choice: ஒழுக்கப் பயிற்சியை
  rationale: παιδεία என்பது தண்டனையை மட்டும் அல்லாமல் உருவாக்கும் பயிற்சி, போதனை, திருத்தம் ஆகியவற்றையும் உள்ளடக்குகிறது. ‘ஒழுக்கப் பயிற்சி’ அதன் பரந்த வளர்ப்பு சார்ந்த பொருளைப் பாதுகாக்கிறது.
- source_word: κυρίου
  choice: ஆண்டவரின்
  rationale: உடைமை உறவை இயல்பான தமிழில் வெளிப்படுத்தி, κύριος என்பதைக் ‘ஆண்டவர்’ என்று வழங்குகிறது.
- source_word: ἐκλύου
  choice: மனந்தளராதே
  rationale: திருத்தத்தை எதிர்கொள்ளும்போது உள்ளார்ந்த உறுதியை இழந்து சோர்ந்துபோவதை இந்த வினை குறிக்கிறது.
- source_word: ἐλεγχόμενος
  choice: கண்டித்துத் திருத்தும்போது
  rationale: ἐλέγχω என்பதில் தவற்றைச் சுட்டிக்காட்டி கடிந்துகொள்வதும் திருத்துவதும் அடங்குகின்றன; பெற்றோருக்குரிய ஒழுக்கப் பயிற்சிச் சூழலில் இந்த இணைச்சொல் பொருளைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: மகன் என்ற பாலினம் குறிக்கப்பட்ட உறவுமொழி
  choice: முதன்மை உரையில் ‘மகன்களிடம்’ / ‘என் மகனே’ என்று வழங்குதல்
  alternative: ‘பிள்ளைகளிடம்’ / ‘என் பிள்ளையே’
  rationale: கிரேக்க உரை ஆண்பால் மகன் மொழியை வெளிப்படையாகப் பயன்படுத்துகிறது; அது நீதிமொழிகள் மேற்கோளையும் எபிரெயர் நூலின் சுற்றியுள்ள மகன்தன்மை வாதத்தையும் எதிரொலிக்கிறது. அதேவேளை, இது வாசகர் சமூகத்தைப் பிரதிநிதித்துவ முறையில் அணுகுவதை அடிக்குறிப்பு விளக்குகிறது.
- issue: இறைவனின் παιδεία என்பதன் பொருள்
  choice: ‘ஒழுக்கப் பயிற்சி’ என்று வழங்குதல்
  alternative: ‘தண்டனை’, ‘பயிற்சி’, அல்லது ‘போதனை’
  rationale: இந்தச் சொல் வளர்க்கும் பயிற்சியையும் தவற்றைத் திருத்தும் கண்டிப்பையும் உள்ளடக்குகிறது. ஒரே கூறாகக் குறுக்காமல் இரண்டுக்குமிடையிலான பொருள் அழுத்தத்தை இந்தத் தேர்வு தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மேற்கோளில் ஒருமை அழைப்பும் கட்டளைகளும் தக்கவைக்கப்பட்டுள்ளன; ‘மனந்தளராதே’ இயல்பான சமகாலச் சொல்லாக்கமாகும்.
