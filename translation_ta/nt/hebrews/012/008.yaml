id: HEB.12.8
reference: Hebrews 12:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἰ δὲ χωρίς ἐστε παιδείας ἧς μέτοχοι γεγόνασι πάντες, ἄρα νόθοι ⸂καὶ οὐχ υἱοί ἐστε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/008.yaml
  text: But if you are without discipline, of which all have become sharers, then you are illegitimate children and not sons.
translation:
  language: ta
  text: ஆனால், எல்லாரும் பங்குபெற்றிருக்கிற ஒழுக்கப் பயிற்சி உங்களுக்கு இல்லையென்றால், நீங்கள் திருமண உறவுக்கு வெளியே பிறந்த பிள்ளைகள்; மகன்கள் அல்ல.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδείας
  choice: கண்டித்துப் பயிற்றுவித்தல்
  rationale: சூழலில் தந்தை தன் பிள்ளையைத் திருத்துதல், கண்டித்தல், பயிற்றுவித்தல் ஆகியவற்றை உள்ளடக்கும் சொல்லாக இருப்பதால், வெறும் ‘ஒழுக்கம்’ என்பதைவிட மூலச்சொல்லின் செயற்பாட்டைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: μέτοχοι γεγόνασι
  choice: பங்குபெற்ற
  rationale: μέτοχος என்பதன் பங்காளித்தன்மையை இயல்பான தமிழில் தருகிறது; perfect வடிவம் உருவான நிலையைச் சுட்டினாலும், தமிழில் ‘பங்குபெற்ற’ என்பதே சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: νόθοι
  choice: முறைகேடாகப் பிறந்த பிள்ளைகள்
  rationale: சட்டப்பூர்வ திருமண உறவுக்கு வெளியே பிறந்தவர் என்ற முதல் நூற்றாண்டு சமூக-உரிமைச் சூழலைத் தருகிறது; இன்றைய தமிழில் காரணமின்றி இழிவுபடுத்தும் சொல்லைத் தவிர்க்கிறது.
- source_word: υἱοί
  choice: மகன்கள்
  rationale: மூலத்தின் பாலினக் குறியீட்டைத் தக்கவைத்து, குடும்பத்திற்குரிய அங்கீகாரமும் வாரிசுரிமையும் சார்ந்த எதிர்மறை ஒப்புமையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘அனைவரும்’ என்பதன் எல்லை
  choice: அனைவரும்
  alternative: எல்லா தேவபிள்ளைகளும்
  rationale: πάντες என்பதற்கு உரையில் தரப்படாத விளக்க வரம்பைச் சேர்க்காமல், அதன் உண்மையான சூழல் சார்ந்த தெளிவின்மையைப் பாதுகாக்கிறது.
- issue: νόθοι மற்றும் υἱοί இடையிலான குடும்ப/வாரிசுரிமை எதிர்மறை
  choice: முறைகேடாகப் பிறந்த பிள்ளைகளே, மகன்கள் அல்ல
  alternative: சட்டப்பூர்வமற்ற பிள்ளைகள்; உண்மையான பிள்ளைகள் அல்ல
  rationale: உயிரியல் உண்மைத்தன்மை பற்றிய கூற்றாக மாற்றாமல், அக்கால குடும்ப அங்கீகாரம் மற்றும் உரிமை சார்ந்த கடுமையான உருவகத்தைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான, நேரடியான நடை. வசனத்தின் கடுமையான குடும்ப உருவகம் மென்மையாக்கப்படாமல், அதே நேரத்தில் தேவையற்ற இழிவுச் சொல் தவிர்க்கப்பட்டுள்ளது.
