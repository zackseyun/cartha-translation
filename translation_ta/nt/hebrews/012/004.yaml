base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/004.yaml
  text: You have not yet resisted to the point of shedding blood in your struggle against sin,[a]
translation:
  language: ta
  text: பாவத்தை எதிர்த்துப் போராடுவதில், இரத்தம் சிந்தும் அளவுக்கு நீங்கள் இன்னும் எதிர்த்து நிற்கவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரத்தம் வரை நீங்கள் இன்னும் எதிர்த்து நிற்கவில்லை.” கிரேக்கத்தில் சொற்சொல்லாக இவ்வாறு உள்ளது; இரத்தம் சிந்தும் அளவுக்கு எதிர்ப்பதைக் குறிக்கும் மரபுத்தொடர் இது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔπω
  choice: இன்னும் ... இல்லை
  rationale: விவரிக்கப்படும் எல்லை இதுவரை எட்டப்படவில்லை என்பதைக் குறிக்கும் கால வினையடை; நவீன தமிழில் இயல்பாக இவ்வாறு வருகிறது.
- source_word: μέχρις αἵματος
  choice: இரத்தம் சிந்தும் அளவுக்கு
  rationale: ‘இரத்தம் வரை’ என்ற சொற்சொல் வடிவத்தைவிட, காயமோ மரணமோ ஏற்படும் அளவிலான எதிர்ப்பைக் குறிக்கும் கிரேக்க மரபுத்தொடரின் பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀντικατέστητε
  choice: எதிர்த்து நிற்கவில்லை
  rationale: இரண்டாம் நபர் பன்மை இறந்தகால வினை; எதிர்ப்பையும் உறுதியுடன் நிலைத்து நிற்பதையும் தமிழில் வெளிப்படுத்துகிறது.
- source_word: πρὸς τὴν ἁμαρτίαν
  choice: பாவத்தை எதிர்த்து
  rationale: πρός இங்கு எதிர்ப்பைக் குறிக்கிறது. ‘பாவம்’ எதைக் குறிப்பதாகும் என்பதைத் தேவையின்றிக் குறுக்காமல் பொதுவாகவே வைக்கிறது.
- source_word: ἀνταγωνιζόμενοι
  choice: போராடுவதில்
  rationale: தொடர்ந்து நடைபெறும் போட்டி அல்லது மோதல் சார்ந்த போராட்டப் படிமத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: ‘பாவம்’ என்பதன் சூழல்சார் குறிப்பு
  choice: ‘பாவம்’ என்று பொதுவாகவே மொழிபெயர்க்கப்பட்டது.
  alternative: துன்புறுத்துவோரின் பாவமான எதிர்ப்பு; பொதுவான பாவம்; விசுவாசத்தைக் கைவிடத் தூண்டும் சோதனை
  rationale: உடனடிச் சூழல் பகைமையைச் சகித்தல் மற்றும் பாவத்தை விலக்குதல் ஆகிய இரண்டையும் உள்ளடக்குகிறது; இவ்வசனம் அதன் குறிப்பைத் துல்லியமாக வரையறுக்காததால் அந்தத் தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியக்கூடிய, இயல்பான, கண்ணியமான நடை. கிரேக்கத்தின் போராட்டப் படிமமும் ‘பாவம்’ என்பதன் பரந்த குறிப்பும் பாதுகாக்கப்பட்டுள்ளன.
