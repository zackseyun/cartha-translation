  text: καὶ ἐκκλησίᾳ πρωτοτόκων ⸂ἀπογεγραμμένων ἐν οὐρανοῖς⸃, καὶ κριτῇ θεῷ πάντων, καὶ πνεύμασι δικαίων τετελειωμένων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/023.yaml
  text: and to the assembly of the firstborn who are enrolled in the heavens[a], and to God, the judge of all, and to the spirits of righteous people made perfect,
translation:
  language: ta
  text: வானங்களில் பதிவுசெய்யப்பட்டுள்ள முதற்பேறானவர்களின் கூட்டத்திடமும்[a], அனைவருக்கும் நீதிபதியான கடவுளிடமும், நிறைவாக்கப்பட்ட நீதிமான்களின் ஆவிகளிடமும் வந்திருக்கிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வானத்தில் பதிவுசெய்யப்பட்டுள்ள.’ கிரேக்க மூலத்தில் ‘வானங்களில்’ என்று பன்மையில் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: கூடுகை
  rationale: பரலோகச் சீயோன் சூழலில் கூடியிருக்கும் மக்களைக் குறிக்கும் அடிப்படைப் பொருளைப் பேணுகிறது; பிற்கால நிறுவனப் பொருளைத் தேவையின்றி ஏற்றாது.
- source_word: πρωτοτόκων
  choice: முதற்பேறானவர்கள்
  rationale: பன்மை வடிவத்தைப் பேணி, முதற்பேற்றின் நிலை அல்லது உரிமையைப் பகிரும் மக்களைக் கூட்டாகக் குறிக்கிறது; மூலத்தில் இல்லாத ‘மகன்கள்’ என்பதைச் சேர்க்கவில்லை.
- source_word: ἀπογεγραμμένων
  choice: பதிவுசெய்யப்பட்டுள்ள
  rationale: நிறைவேறிய பதிவின் தொடரும் விளைவை உணர்த்தும் perfect passive participle-ஐ இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν οὐρανοῖς
  choice: வானங்களில்
  rationale: கிரேக்க மூலத்தின் பன்மை வடிவத்தை நேரடியாகப் பேணுகிறது; இயல்பான ஒருமை மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: κριτῇ θεῷ πάντων
  choice: அனைவருக்கும் நீதிபதியான கடவுள்
  rationale: கடவுளின் அடையாளத்தையும் நீதிபதி என்ற பங்கையும் இயல்பான தமிழ் தொடர்பெயர் அமைப்பில் வெளிப்படுத்துகிறது; πάντων என்பதை மனிதர்களைக் குறிக்கும் ‘அனைவருக்கும்’ என்று சூழலுக்கேற்ப வழங்குகிறது.
- source_word: πνεύμασι
  choice: ஆவிகள்
  rationale: சொல்லின் நேரடியான பொருளைப் பேணுகிறது; பிரதான உரையில் அவற்றின் நிலையைப் பற்றிய மேலதிகக் கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: δικαίων
  choice: நீதிமான்கள்
  rationale: மனிதர்களைக் குறிக்கும் பன்மை பெயரடைப் பயன்பாட்டை பாலின வரையறையின்றி இயல்பாகத் தருகிறது.
- source_word: τετελειωμένων
  choice: நிறைவாக்கப்பட்ட
  rationale: τελειόω என்பதிலுள்ள நிறைவு அல்லது பூரணநிலைக்குக் கொண்டுவருதல் என்ற எபிரெயர் நூலின் கருத்தைத் தக்கவைத்து, passive பொருளையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘முதற்பேறானவர்கள்’ என்போரின் அடையாளம்
  choice: முதற்பேற்றின் நிலை அல்லது சுதந்தர உரிமையைப் பகிரும் கடவுளுடைய மக்களைக் குறிக்கும் கூட்டுப் பெயர்
  alternative: கிறிஸ்துவை மட்டும் ‘முதற்பேறானவர்’ என்று குறிப்பிட்டு, கூடுகை அவருக்குரியது என்று புரிந்துகொள்வது
  rationale: πρωτοτόκων என்பது பன்மையாக இருப்பதால் கூட்டான மனிதக் குழுவே இயல்பான குறிப்பு. மொழிபெயர்ப்பு இதைத் தெளிவுபடுத்தினாலும், மூலத்தில் இல்லாத விரிவான கோட்பாட்டைச் சேர்க்கவில்லை.
- issue: ‘நிறைவாக்கப்பட்ட நீதிமான்களின் ஆவிகள்’ என்பதன் குறிப்பு
  choice: கடவுளுடைய முன்னிலையில் நிறைவாக்கப்பட்ட நீதிமான்களின் ஆவிகள்
  alternative: உடலோடு இருப்பவர்களையும் உடலின்றி இருப்பவர்களையும் உள்ளடக்கிய எல்லா நீதிமான்களும்
  rationale: ‘நீதிமான்களின் ஆவிகள்’ என்பது மனிதர்களை அவர்களுடைய ஆவிக்குரிய நிலையில் குறிப்பிடுவது இயல்பானது. எனினும் இடைநிலை பற்றிய மேலதிக விவரங்களை வசனம் கூறாததால் மொழிபெயர்ப்பும் அவற்றைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. முந்தைய வசனத்திலிருந்து தொடரும் தத்திவ் பட்டியலைத் தமிழில் நிறைவான வாக்கியமாக்க ‘வந்திருக்கிறீர்கள்’ இறுதியில் சேர்க்கப்பட்டுள்ளது. அடிக்குறிப்பு குறி [a] பிரதான உரையில் இடம்பெற்றுள்ளது.
