source:
  edition: SBLGNT
  text: οὗ ἡ φωνὴ τὴν γῆν ἐσάλευσεν τότε, νῦν δὲ ἐπήγγελται λέγων· Ἔτι ἅπαξ ἐγὼ ⸀σείσω οὐ μόνον τὴν γῆν ἀλλὰ καὶ τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/026.yaml
  text: whose voice shook the earth then[a], but now he has promised, saying[b], “Yet once more I will shake not only the earth but also the heaven.”
translation:
  language: ta
  text: அப்போது அவருடைய குரல் பூமியை அசைத்தது. ஆனால் இப்போதோ அவர், “இன்னும் ஒருமுறை நான் பூமியை மட்டுமல்ல, வானத்தையும் அசைப்பேன்” என்று வாக்குறுதி அளித்திருக்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஆகாய் 2:6-இலிருந்து மேற்கோள்.
    reason: cross_reference
lexical_decisions:
- source_word: οὗ ἡ φωνὴ
  choice: அவருடைய குரல்
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட கடவுளையே உறவுப்பெயர் சுட்டுகிறது. தமிழில் ‘அவருடைய குரல்’ என்பது உடைமைத் தொடர்பை இயல்பாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: ἐσάλευσεν
  choice: அசைத்தது
  rationale: சீனாய் நிகழ்வில் பூமி குலுக்கப்பட்டதைச் சுட்டும் வலிமையைத் தக்கவைக்கும் இயல்பான தமிழ் வினைச்சொல்.
- source_word: τὴν γῆν
  choice: பூமியை
  rationale: ‘வானம்’ என்பதற்கு எதிரிணையாக வருவதால், உள்ளூர் நிலப்பகுதியை அல்லாமல் பூமி என்னும் பரந்த பொருளைக் குறிக்கிறது.
- source_word: τότε ... νῦν δὲ
  choice: அப்போது ... ஆனால் இப்போதோ
  rationale: கடந்த நிகழ்வுக்கும் இப்போது நிலைத்திருக்கும் வாக்குறுதிக்கும் இடையிலான கால மற்றும் கருத்து வேறுபாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐπήγγελται
  choice: வாக்குறுதி அளித்திருக்கிறார்
  rationale: நிறைவேற்றப்பட்ட வினைவடிவம், முன்பு அளிக்கப்பட்ட வாக்குறுதி இப்போதும் செல்லுபடியாக இருப்பதை உணர்த்துகிறது.
- source_word: Ἔτι ἅπαξ
  choice: இன்னும் ஒருமுறை
  rationale: எதிர்காலத்தில் மேலும் ஒரே முறை நிகழவிருப்பதைக் குறிக்கும் கிரேக்கச் சொற்றொடரின் வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
- source_word: σείσω
  choice: அசைப்பேன்
  rationale: வரவிருக்கும் பரந்த படைப்புலகக் குலுக்கலைக் குறிக்கும் எதிர்கால வினையின் உருவக வலிமையைப் பேணுகிறது.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: மட்டுமல்ல ... -த்தையும்
  rationale: இரண்டு பரப்புகளையும் உள்ளடக்கும் கிரேக்க இணைப்புக் கட்டமைப்பைச் சுருக்கமான, இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὸν οὐρανόν
  choice: வானத்தை
  rationale: ஒருமை வடிவிலுள்ள οὐρανός என்பதையும் பூமி–வானம் என்ற படைப்புலக இணைப்பையும் ‘வானம்’ இயல்பாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: உறவுப்பெயர் மற்றும் வாக்குறுதியின் மறைமுக எழுவாய் யாரைக் குறிக்கின்றன
  choice: கடவுளைக் குறிக்கும் மரியாதைப் பெயர்ச்சுட்டாக ‘அவர்’ பயன்படுத்தப்பட்டது.
  alternative: தெய்வீக எழுவாயைத் தெளிவுபடுத்தாமல் ஆளற்ற வாக்கியமாக மொழிபெயர்த்தல்
  rationale: உடனடி முந்தைய சூழலும் ஆகாய் மேற்கோளும் குரல் எழுப்பியவரும் வாக்குறுதி அளித்தவரும் கடவுளே என்பதைக் காட்டுகின்றன; இதற்கு மேல் எந்தக் கோட்பாட்டு விளக்கமும் சேர்க்கப்படவில்லை.
- issue: பூமி மற்றும் வானம் என்ற மொழியின் பரப்பு
  choice: ‘பூமி’ மற்றும் ‘வானம்’ எனப் பரந்த படைப்புலகப் பொருளில் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘நிலம்’ மற்றும் ‘ஆகாயம்’ என்று உள்ளூர் அல்லது இயற்பரப்புக்குக் குறுக்குதல்
  rationale: மேற்கோளின் இணை அமைப்பு படைக்கப்பட்ட ஒழுங்கின் விரிவான பரப்பைக் காட்டுகிறது; நிகழ்வின் செயல்முறையைத் தேவையின்றி வரையறுக்காமல் அந்தப் பரப்பை மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. கிரேக்கத் தொடரமைப்பை அப்படியே இறுக்கமாகப் பின்பற்றாமல், அதன் உடைமைத் தொடர்பு, கால வேறுபாடு, வாக்குறுதியின் நிலைத்தன்மை, பூமி–வானம் இணைப்பு ஆகியவை இயல்பான தமிழ் வாக்கியத்தில் பாதுகாக்கப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையில் தவறான இடத்தில் தோன்றும் ‘heaven’ மாற்றுக் குறிப்பைத் தமிழில் சேர்க்கவில்லை; ‘வானம்’ கிரேக்க ஒருமை வடிவை இயல்பாகவே தருகிறது.
