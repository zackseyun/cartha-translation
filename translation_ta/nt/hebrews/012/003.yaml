source:
  edition: SBLGNT
  text: Ἀναλογίσασθε γὰρ τὸν τοιαύτην ὑπομεμενηκότα ὑπὸ τῶν ἁμαρτωλῶν εἰς ⸀ἑαυτοὺς ἀντιλογίαν, ἵνα μὴ κάμητε ταῖς ψυχαῖς ὑμῶν ἐκλυόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/003.yaml
  text: For consider the one who endured such opposition from sinners against himself[a], so that you may not grow weary[b], becoming discouraged in your souls.
translation:
  language: ta
  text: பாவிகள் தங்களுக்கே எதிராகக் காட்டிய இத்தகைய எதிர்ப்பைச் சகித்தவரை கவனமாக எண்ணிப்பாருங்கள்[a]; அப்போது நீங்கள் உங்கள் உள்ளங்களில் களைப்படையாமலும் தளர்ந்துபோகாமலும் இருப்பீர்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: SBLGNT உரை ‘தங்களுக்கே எதிராக’ என்று வாசிக்கிறது. சில கையெழுத்துப் பிரதிகள் ‘அவருக்கு எதிராக’ என்று வாசிக்கின்றன. சூழலில், இந்த எதிர்ப்பைச் சகித்தவர் இயேசு.
    reason: textual_variant
  - marker: b
    text: நெருக்கமாக, ‘உங்கள் உள்ளங்களில் களைப்படையாமலும் தளர்ந்துபோகாமலும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναλογίσασθε
  choice: எண்ணிப்பாருங்கள்
  rationale: கவனமாகச் சிந்தித்து மதிப்பிடும்படி அழைக்கும் இறந்தகாலக் கட்டளை வடிவத்தின் வலிமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: τοιαύτην
  choice: இத்தகைய
  rationale: எதிர்ப்பின் தன்மையையும் தீவிரத்தையும் குறிப்பிட்ட ஓர் அளவுக்குள் சுருக்காமல், கிரேக்கச் சொல்லின் பரந்த வலியுறுத்தலைப் பேணுகிறது.
- source_word: ὑπομεμενηκότα
  choice: சகித்துக்கொண்டவரை
  rationale: ὑπομένω என்ற வினையின் நிலைத்து நின்று தாங்குதல் என்ற பொருளையும், நிறைவுற்ற செயல் தொடர்ந்த முக்கியத்துவம் உடையது என்ற perfect participle நுணுக்கத்தையும் தெரிவிக்கிறது.
- source_word: ἁμαρτωλῶν
  choice: பாவிகள்
  rationale: ஒழுக்கநிலையை நேரடியாகக் குறிக்கும் substantival adjective-ஐ மரபானதும் இன்றும் தெளிவானதுமான தமிழில் தருகிறது.
- source_word: ἀντιλογίαν
  choice: எதிர்ப்பை
  rationale: மறுப்பு, முரண்பாடு, பகைமையான எதிர்நிற்றல் ஆகிய அர்த்தப் பரப்பை இச்சூழலில் இயல்பாக உள்ளடக்கும் சொல்.
- source_word: εἰς ἑαυτοὺς
  choice: தங்களுக்கு எதிராகவே
  rationale: SBLGNT-யில் உள்ள பன்மை reflexive pronoun-ஐ முதன்மை உரையில் நேரடியாகப் பேணுகிறது; அதன் கடினமான வாசகத்தையும் வேறுபட்ட கையெழுத்துப் பிரதிகளின் வாசகத்தையும் அடிக்குறிப்பு விளக்குகிறது.
- source_word: κάμητε
  choice: களைப்படையமாட்டீர்கள்
  rationale: சோர்வு அல்லது களைப்பு அடைதலைக் குறிக்கும் வினையைத் தெளிவான நவீனத் தமிழில் தருகிறது; ἵνα μή கூறும் நோக்கம் அல்லது எதிர்பார்க்கப்படும் விளைவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ταῖς ψυχαῖς ὑμῶν
  choice: உங்கள் உள்ளங்களில்
  rationale: ψυχή இங்கு உடலிலிருந்து பிரிந்த ஓர் அங்கத்தை மட்டும் அல்லாமல் அக வாழ்வைக் குறிக்கிறது; ‘உள்ளங்களில்’ என்பது மூல உருவகத்தை அளவோடு பேணும் இயல்பான தமிழ்.
- source_word: ἐκλυόμενοι
  choice: தளர்ந்துபோய்
  rationale: உள்ளார்ந்த வலிமையை இழத்தல், மனந்தளர்தல் என்ற பொருளைத் தருகிறது; இதை κάμητε-க்கு முன் வரும் உடனிகழும் நிலையாகக் காட்டுகிறது.
theological_decisions:
- issue: ‘சகித்துக்கொண்டவர்’ யாரைக் குறிக்கிறார்
  choice: பெயரை மீண்டும் சேர்க்காமல், சூழலின்படி இயேசுவைக் குறிக்கும் வகையில் ‘சகித்துக்கொண்டவர்’ என்று மொழிபெயர்த்தல்
  alternative: ‘இயேசுவை எண்ணிப்பாருங்கள்’ என்று பெயரை வெளிப்படையாகச் சேர்த்தல்
  rationale: எபிரெயர் 12:2 உடனடியான முன்னணியில் இயேசுவை அடையாளப்படுத்துகிறது; ஆனால் இவ்வசனத்தின் கிரேக்க உரை பெயரை மீண்டும் சொல்லாததால், அதே மறைமுகச் சுட்டுதலைப் பேணுவது கூடுதல் சொற்களை இறக்குமதி செய்யாமல் சூழலைத் தெளிவாக வைத்திருக்கிறது.
- issue: εἰς ἑαυτούς என்ற பன்மை வாசகத்தின் பொருள்
  choice: SBLGNT வாசகத்தின்படி ‘பாவிகள் தங்களுக்கு எதிராகவே காட்டிய’ என்பதை முதன்மை உரையில் வைத்தல்
  alternative: வேறுபட்ட வாசகமான ἑαυτόν அடிப்படையில் ‘பாவிகள் அவருக்கு எதிராகக் காட்டிய’ என்று மொழிபெயர்த்தல்
  rationale: மூலமாகக் கொடுக்கப்பட்ட SBLGNT உரை பன்மையை வாசிக்கிறது; அதன் பொருள் சூழலில் கடினமாக இருந்தாலும் அதை அமைதியாக ஒருமையாக மாற்றாமல் பேணுவது உரைவேறுபாட்டையும் பொருள் இழுபறியையும் நேர்மையாக வெளிப்படுத்துகிறது. சூழலில் எதிர்ப்பு இயேசுவால் சகிக்கப்பட்டது என்பது தெளிவாகவே உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குத் தெளிவாகவும் மதிப்புமிக்க தொனியுடனும் வடிவமைக்கப்பட்டது. ‘எண்ணிப்பாருங்கள்’, ‘தளர்ந்துபோய்’, ‘களைப்படையமாட்டீர்கள்’ ஆகியவை இயல்பான அறிவுறுத்தல் மொழியை வழங்குகின்றன. SBLGNT-யின் கடினமான பன்மை reflexive வாசகம் முதன்மை உரையில் பேணப்பட்டு, உரைவேறுபாடு அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது.
