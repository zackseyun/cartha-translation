id: HEB.12.10
reference: Hebrews 12:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἱ μὲν γὰρ πρὸς ὀλίγας ἡμέρας κατὰ τὸ δοκοῦν αὐτοῖς ἐπαίδευον, ὁ δὲ ἐπὶ τὸ συμφέρον εἰς τὸ μεταλαβεῖν τῆς ἁγιότητος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/010.yaml
  text: For they disciplined us for a few days as seemed best to them[a], but he does so for our benefit[b], so that we may share in his holiness.
translation:
  language: ta
  text: அவர்கள் சில நாட்களுக்குத் தங்களுக்கு நல்லதென்று தோன்றியபடி[b] நமக்கு ஒழுக்கப் பயிற்சி அளித்தார்கள்[a]. ஆனால் அவரோ, நாம் அவருடைய பரிசுத்தத்தில் பங்குபெறும்படி, நமது நன்மைக்காக அப்படிச் செய்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சில நாட்களுக்கு’ என்பதை ‘குறுகிய காலத்திற்கு’ என்றும் மொழிபெயர்க்கலாம். பூமிக்குரிய தந்தையரின் ஒழுக்கப் பயிற்சிக்கான காலம் வரையறுக்கப்பட்டது என்பதை கிரேக்கச் சொற்றொடர் வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘தங்களுக்கு சரியென்று தோன்றியபடி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς ὀλίγας ἡμέρας
  choice: சில நாட்களுக்கு
  rationale: பூமிக்குரிய தந்தையரின் ஒழுக்கப் பயிற்சி நீடிக்கும் வரையறுக்கப்பட்ட காலத்தை இயல்பான தமிழில் தெரிவிக்கிறது; ‘குறுகிய காலத்திற்கு’ என்ற இடியோமப் பொருளும் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: κατὰ τὸ δοκοῦν αὐτοῖς
  choice: தங்களுக்கு நல்லதென்று தோன்றியபடி
  rationale: அவர்கள் சரியென்று மதிப்பிட்டதையே குறிக்கிறது; அவர்களின் முடிவு தவறாதது என்று கூறாமல், அதன் தனிப்பட்ட மதிப்பீட்டுத் தன்மையைப் பாதுகாக்கிறது.
- source_word: ἐπαίδευον
  choice: ஒழுக்கப் பயிற்சி அளித்தார்கள்
  rationale: இச்சூழலில் உள்ள பெற்றோருக்குரிய பயிற்சி, திருத்தம், கட்டுப்பாடு ஆகிய பரந்த பொருளை வெளிப்படுத்துகிறது; வெறும் தண்டனை என்ற குறுகிய பொருளைத் தவிர்க்கிறது.
- source_word: ὁ δὲ
  choice: ஆனால் அவரோ ... அப்படிச் செய்கிறார்
  rationale: கிரேக்கத்தில் விடுபட்டுள்ள வினையைத் தமிழில் இயல்பாக நிறைவு செய்கிறது; சூழலில் அந்த ஒருமை எழுவாய் கடவுளைக் குறித்தாலும், மூலத்தின் மறைமுகக் குறிப்பைத் தக்கவைக்கிறது.
- source_word: ἐπὶ τὸ συμφέρον
  choice: நமது நன்மைக்காக
  rationale: ஒழுக்கப் பயிற்சியின் பயனுள்ள நோக்கத்தைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: εἰς τὸ μεταλαβεῖν
  choice: பங்குபெறும்படி
  rationale: நோக்கம் அல்லது விளைவை உணர்த்தும் கட்டமைப்பையும், ஒன்றில் பங்குகொள்ளுதல் என்ற வினையின் பொருளையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: τῆς ἁγιότητος αὐτοῦ
  choice: அவருடைய பரிசுத்தத்தில்
  rationale: பரிசுத்தம் கடவுளுக்குரிய பண்பாக இருப்பதையும் அதில் மனிதர்கள் பங்குபெறுவதையும் கூறுகிறது; குறிப்பிட்ட பரிசுத்தமாக்கல் கோட்பாட்டைத் திணிக்கவில்லை.
theological_decisions:
- issue: ὁ δὲ என்ற எதிர்மறை ஒப்பீட்டில் வரும் ஒருமை எழுவாயின் குறிப்பு
  choice: சூழலில் கடவுளைக் குறிக்கும் ‘அவரோ’ என்று பிரதிப்பெயரால் மொழிபெயர்த்தல்
  alternative: தெளிவுக்காக ‘கடவுளோ’ என்று பெயரை வெளிப்படையாகச் சேர்த்தல்
  rationale: எபிரெயர் 12:5–11 இன் சூழல் பூமிக்குரிய தந்தையரையும் கடவுளையும் ஒப்பிடுகிறது. ஆயினும் கிரேக்கத்தில் பெயர் வெளிப்படையாக இல்லாததால், பிரதிப்பெயர் மூலத்தின் மறைமுகத்தன்மையைப் பாதுகாக்கிறது.
- issue: ‘அவருடைய பரிசுத்தத்தில் பங்குபெறுதல்’ என்பதன் இறையியல் பொருள்
  choice: கடவுளின் பரிசுத்தத்தில் பங்குபெறுதல் என்ற கூற்றை விளக்கமாகக் குறுக்காமல் அப்படியே வைத்தல்
  alternative: இதை நிலைசார் பரிசுத்தம் மட்டுமாகவோ படிப்படியான பரிசுத்தமாக்கல் மட்டுமாகவோ விளக்குதல்
  rationale: தெய்வீக ஒழுக்கப் பயிற்சியின் நோக்கத்தை வசனம் கூறுகிறது; அந்தப் பங்கேற்பு நிகழும் முறையை வரையறுப்பதில்லை. எனவே உண்மையான இறையியல் விரிவும் பதற்றமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘ஒழுக்கப் பயிற்சி’ என்பது தண்டனை மட்டும் அல்லாமல் பெற்றோருக்குரிய திருத்தம் மற்றும் பயிற்சியையும் உள்ளடக்குகிறது. ‘பரிசுத்தம்’ என்ற நிலைபெற்ற வேதாகமச் சொல் இறையியல் ஆழத்தைத் தக்கவைக்கிறது.
