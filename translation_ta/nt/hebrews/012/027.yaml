revisions:
- from: “இன்னும் ஒருமுறை” என்ற இந்தச் சொற்றொடர், அசைக்கப்படுகிறவை உண்டாக்கப்பட்டவையாக இருப்பதால் அவை அகற்றப்படுவதைக் குறிக்கிறது; அப்போது அசைக்கப்படாதவை[a] நிலைத்திருக்கும்.
  to: “இன்னும் ஒருமுறை” என்ற இந்தச் சொற்றொடர், உண்டாக்கப்பட்டவைகளாகிய அசைக்கப்படுகிறவை அகற்றப்படுவதைக் குறிக்கிறது; அசைக்கப்படாதவை[a] நிலைத்திருப்பதற்காக.
  rationale: The revision removes the unwarranted causal force from the phrase describing made things and renders ἵνα with ‘நிலைத்திருப்பதற்காக,’ preserving the Greek purpose/result relation. It retains the source’s deliberate participial contrast between what is being shaken and what is not being shaken.
