id: HEB.12.27
reference: Hebrews 12:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τὸ δὲ Ἔτι ἅπαξ δηλοῖ ⸂τῶν σαλευομένων⸃ μετάθεσιν ὡς πεποιημένων, ἵνα μείνῃ τὰ μὴ σαλευόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/027.yaml
  text: This phrase, “Yet once more,” indicates the removal of the things being shaken—as things that have been made—so that the things not being shaken may remain.
translation:
  language: ta
  text: “இன்னும் ஒருமுறை” என்ற இந்தச் சொற்றொடர், உண்டாக்கப்பட்டவைகளாகிய அசைக்கப்படுகிறவை அகற்றப்படுவதைக் குறிக்கிறது; அசைக்கப்படாதவை[a] நிலைத்திருப்பதற்காக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அசைக்க முடியாதவை” / “அசைக்கப்பட இயலாதவை.”
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ δὲ Ἔτι ἅπαξ
  choice: “இன்னும் ஒருமுறை” என்ற இந்தச் சொற்றொடர்
  rationale: τὸ மேற்கோள் சொற்றொடரைப் பெயர்ச்சொல்லாக்குகிறது. δέ இங்கு மென்மையான தொடர்புச் சொல்; தமிழில் தனியாகச் சேர்க்காமல் வாக்கிய ஓட்டத்தில் வெளிப்படுத்துவது இயல்பானது.
- source_word: δηλοῖ
  choice: குறிக்கிறது
  rationale: மேற்கோள் சொற்களிலிருந்து ஆசிரியர் விளக்கும் பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τῶν σαλευομένων
  choice: அசைக்கப்படுகிறவை
  rationale: நிகழ்காலச் செயப்பாட்டு பங்கேற்பெயரின் தொடரும் அல்லது இயல்புசார் தன்மையைப் பேணுகிறது.
- source_word: μετάθεσιν
  choice: அவை அகற்றப்படுவது
  rationale: சூழலில் வெறும் மாற்றத்தையல்ல, அசைக்கப்படும் படைக்கப்பட்டவற்றை நீக்குவதைக் குறிக்கிறது.
- source_word: ὡς πεποιημένων
  choice: உண்டாக்கப்பட்டவையாக இருப்பதால்
  rationale: πεποιημένων என்பதன் நிறைவு செயப்பாட்டு கருத்தைத் தக்கவைக்கிறது; ὡς இங்கு அவை அகற்றப்படுவதற்கான அவற்றின் படைக்கப்பட்ட நிலையைச் சுட்டுகிறது. காரணத் தொனி சாத்தியமானதாக இருந்தாலும், சொற்றொடரின் வகைப்படுத்தும் நுணுக்கமும் இதில் உள்ளது.
- source_word: ἵνα μείνῃ
  choice: அப்போது ... நிலைத்திருக்கும்
  rationale: நீக்கத்தின் நோக்கம் அல்லது விளைவைக் காட்டும் ἵνα அமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὰ μὴ σαλευόμενα
  choice: அசைக்கப்படாதவை
  rationale: மூலத்தின் எதிர்மறைப் பங்கேற்பெயரை நேரடியாகப் பேணி, அடுத்த வசனத்தின் ‘அசைக்க முடியாத’ கருத்தை முன்கூட்டியே இறக்குமதி செய்வதைத் தவிர்க்கிறது.
theological_decisions:
- issue: τὰ μὴ σαλευόμενα என்பதை இயலாமையாகவா அல்லது நேரடி எதிர்மறைப் பங்கேற்பெயராகவா மொழிபெயர்ப்பது
  choice: அசைக்கப்படாதவை
  alternative: அசைக்க முடியாதவை / அசைக்கப்பட இயலாதவை
  rationale: கிரேக்கம் ‘அசைக்கப்படுகிறவை’ என்பதற்கு இணையாக ‘அசைக்கப்படாதவை’ என்று கூறுகிறது; வெளிப்படையாக இயலாமையைக் குறிக்கும் சொல்லைச் சேர்க்கவில்லை. ஆகவே மூலத்தின் இறையியல் பதற்றமும் அடுத்த வசனத்துடனான முன்னேற்றமும் பாதுகாக்கப்படுகின்றன.
- issue: ὡς πεποιημένων என்பதன் தொடர்பு
  choice: உண்டாக்கப்பட்டவையாக இருப்பதால்
  alternative: உண்டாக்கப்பட்டவையாக / படைக்கப்பட்டவையாக
  rationale: ὡς உடன் வரும் நிறைவு செயப்பாட்டு பங்கேற்பெயர், அசைக்கப்படுகிறவை உண்டாக்கப்பட்டவற்றின் வகையைச் சேர்ந்தவை என்பதைச் சுட்டுகிறது. தமிழில் காரணத் தொடர்பு இயல்பாக வெளிப்பட்டாலும், அது தனிப்பட்ட படைப்பியல் விளக்கத்தைச் சேர்க்காமல் மூலத்தின் கருத்தைத் தருகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘உண்டாக்கப்பட்டவை’ என்பது ποιέω என்பதன் பரந்த பொருளைத் தக்கவைக்கிறது; ‘படைக்கப்பட்டவை’ என்பதும் சூழல்சார் மாற்றாகும். மேற்கோள் சொற்றொடர் தெளிவாகக் குறியிடப்பட்டுள்ளது.
