id: HEB.12.28
reference: Hebrews 12:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διὸ βασιλείαν ἀσάλευτον παραλαμβάνοντες ἔχωμεν χάριν, δι’ ἧς ⸀λατρεύωμεν εὐαρέστως τῷ θεῷ μετὰ ⸂εὐλαβείας καὶ δέους⸃,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/028.yaml
  text: Therefore[a], since we are receiving an unshakable kingdom, let us have grace, through which we may serve God acceptably with reverence and awe,
translation:
  language: ta
  text: ஆகையால், அசைக்க முடியாத ஓர் அரசாட்சியைப் பெறுகிற நாம், கிருபையைக் கொண்டிருப்போமாக[a]; அதன் மூலம் பயபக்தியுடனும் ஆழ்ந்த அச்சத்துடனும் கடவுளுக்கு ஏற்றவாறு சேவை செய்வோமாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நன்றியுணர்வைக் கொண்டிருப்போமாக.” கிரேக்கச் சொற்றொடரை “கிருபையைக் கொண்டிருப்போமாக” என்றும், வழக்குப்பொருளில் “நன்றியுணர்வைக் கொண்டிருப்போமாக” என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: ஆகையால்
  rationale: முந்தைய வசனங்களில் அசைக்கப்படுபவை அகற்றப்படுவதைக் குறித்த வாதத்திலிருந்து வரும் முடிவை இயல்பான தமிழில் காட்டுகிறது.
- source_word: βασιλείαν ἀσάλευτον
  choice: அசைக்க முடியாத ஓர் அரசு
  rationale: βασιλείαν என்பதன் ‘அரசு/அரசாட்சி’ பொருளையும், ἀσάλευτον என்பதன் அசைக்கப்படாத தன்மையையும் தெளிவாகப் பாதுகாக்கிறது; முந்தைய சூழலில் அசைக்கப்படுபவற்றுடன் உள்ள முரண்பாடும் தொடர்கிறது.
- source_word: παραλαμβάνοντες
  choice: பெற்றுக்கொண்டிருக்கும் நாம்
  rationale: நிகழ்காலப் பங்கேற்புவினையின் தொடரும் அல்லது நிகழும் தன்மையையும், அதைத் தொடர்ந்து வரும் அறிவுறுத்தலுக்கான சூழ்நிலையையும் காட்டுகிறது.
- source_word: ἔχωμεν χάριν
  choice: கிருபையை உடையவர்களாய் இருப்போமாக
  rationale: χάριν என்பதன் முதன்மையான ‘கிருபை’ பொருளையும் ἔχωμεν என்பதன் அறிவுறுத்தல் வடிவத்தையும் பாதுகாக்கிறது. ‘நன்றியுள்ளவர்களாய் இருப்போமாக’ என்ற சாத்தியமான வழக்குப்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: δι’ ἧς
  choice: அதன் மூலம்
  rationale: பெண்பால் சார்புப்பெயர் χάριν என்பதைச் சுட்டுவதையும், διά கூறும் கருவிப்பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: λατρεύωμεν
  choice: பணி செய்வோமாக
  rationale: கடவுளுக்குச் செய்யப்படும் சமயச் சேவை அல்லது வழிபாட்டுப் பணியைச் சுட்டும் வினையின் அகலமான பொருளைப் பாதுகாக்கிறது; சூழல் இதை சாதாரண மனிதச் சேவையாகப் புரிந்துகொள்வதைத் தடுக்கிறது.
- source_word: εὐαρέστως τῷ θεῷ
  choice: கடவுளுக்கு ஏற்றவாறு
  rationale: கடவுளுக்குப் பிரியமான அல்லது ஏற்றுக்கொள்ளத்தக்க முறையில் சேவை செய்வதைக் குறிக்கும் வினையடைப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: μετὰ εὐλαβείας καὶ δέους
  choice: பயபக்தியுடனும் ஆழ்ந்த அச்சத்துடனும்
  rationale: εὐλάβεια கூறும் பக்தி கலந்த எச்சரிக்கையான மரியாதையையும், δέος கூறும் கடவுளின் மகத்துவத்துக்கு முன்பான ஆழ்ந்த அச்சத்தையும் தனித்தனியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: ἔχωμεν χάριν என்பதில் χάριν என்பதன் பொருள்
  choice: கிருபையை உடையவர்களாய் இருப்போமாக
  alternative: நன்றியுள்ளவர்களாய் இருப்போமாக
  rationale: அடுத்து வரும் δι’ ἧς (‘அதன் மூலம்’) என்பது χάριν என்பதைக் குறிப்பதாக இயல்பாகப் புரிகிறது; இதனால் கடவுளுக்கேற்ற பணி செய்ய உதவும் கிருபை என்ற வாசிப்பு தொடர்கிறது. அதேவேளை, இச்சொற்றொடரை நன்றியுணர்வைக் குறிக்கும் மரபுச் சொற்றொடராகப் புரிந்துகொள்வதும் சாத்தியம் என்பதால் அந்தத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. ‘கிருபை’ என்பது கிறிஸ்தவத் தமிழில் பரவலாகப் புரிந்துகொள்ளப்படும் சொல்லாக இருப்பதாலும் மூலத்தின் சொல்லியல் மற்றும் இறையியல் இருபொருள் வாய்ப்பைப் பாதுகாப்பதாலும் வைக்கப்பட்டுள்ளது. ‘பயபக்தி’ மற்றும் ‘ஆழ்ந்த அச்சம்’ ஆகியவை இரண்டு வேறு கிரேக்கச் சொற்களின் வேறுபாட்டைத் தக்கவைக்கின்றன.
