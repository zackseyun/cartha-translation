revisions:
- from: ஆகையால், அசைக்க முடியாத ஓர் அரசைப் பெற்றுக்கொண்டிருக்கும் நாம், கிருபையை உடையவர்களாய் இருப்போமாக[a]. அதன் மூலம் பயபக்தியுடனும் ஆழ்ந்த அச்சத்துடனும் கடவுளுக்கு ஏற்றவாறு பணி செய்வோமாக.
  to: ஆகையால், அசைக்க முடியாத ஓர் அரசாட்சியைப் பெறுகிற நாம், கிருபையைக் கொண்டிருப்போமாக[a]; அதன் மூலம் பயபக்தியுடனும் ஆழ்ந்த அச்சத்துடனும் கடவுளுக்கு ஏற்றவாறு சேவை செய்வோமாக.
  rationale: The revision clarifies βασιλεία as அரசாட்சி rather than a modern political government, improves the idiomatic rendering of ἔχωμεν χάριν without deciding the grace/gratitude ambiguity, and retains the instrumental connection by which grace enables acceptable service to God. No change is made to the source-level theological tension.
