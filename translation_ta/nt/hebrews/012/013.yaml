source:
  edition: SBLGNT
  text: καὶ τροχιὰς ὀρθὰς ⸀ποιεῖτε τοῖς ποσὶν ὑμῶν, ἵνα μὴ τὸ χωλὸν ἐκτραπῇ, ἰαθῇ δὲ μᾶλλον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/013.yaml
  text: and make straight paths for your feet[a], so that the lame may not be turned aside[b], but rather be healed.
translation:
  language: ta
  text: உங்கள் கால்களுக்கு நேரான பாதைகளை அமைத்திடுங்கள்[a]. அப்போது நொண்டியானது வழிவிலகாமல்[b], மாறாகக் குணமடையும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்தச் சொற்றொடர் நீதிமொழிகள் 4:26-ஐ எதிரொலித்து, ஒழுக்கமுள்ள நடையின் உருவகத்தைத் தொடர்கிறது.
    reason: cross_reference
  - marker: b
    text: ‘வழிவிலகாமல்’ என்பதற்கான கிரேக்க வினைச்சொல்லை, உடல் உருவகத்திற்கு ஏற்றபடி ‘மூட்டு பிசகாமல்’ அல்லது ‘மூட்டு விலகாமல்’ என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τροχιὰς
  choice: பாதைகளை
  rationale: இச்சொல் சக்கரத் தடம் அல்லது நடந்துசெல்லும் தடத்தைக் குறிக்கலாம். அறிவுறுத்தல் சூழலில், வாழ்க்கை நடையின் உருவகத்தையும் இயல்பான தமிழையும் காக்கும் சொல் ‘பாதைகள்’.
- source_word: ὀρθὰς
  choice: நேரான
  rationale: ஒழுங்காகவும் சரியான திசையிலும் அமைந்த பாதையைக் குறிக்கிறது; நீதிமொழிகள் 4:26-இன் எதிரொலிக்கும் நடை உருவகத்துக்கும் பொருந்துகிறது.
- source_word: ποιεῖτε
  choice: அமைத்துக்கொள்ளுங்கள்
  rationale: நிகழ்காலக் கட்டளை தொடர்ந்து மேற்கொள்ள வேண்டிய செயலைக் காட்டுகிறது. ‘அமைத்துக்கொள்ளுங்கள்’ என்பது வெறும் உருவாக்கத்தைவிட, தங்கள் நடைக்கான பாதையைச் செம்மைப்படுத்தும் கருத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τοῖς ποσὶν ὑμῶν
  choice: உங்கள் கால்களுக்காக
  rationale: இங்குள்ள வேற்றுமை அமைப்பு கால்களின் நலன் அல்லது பயன்பாட்டுக்காகப் பாதைகள் அமைக்கப்படுவதைச் சுட்டுகிறது; ‘கால்களால்’ என்று கருவிப்பொருளாக மாற்றவில்லை.
- source_word: τὸ χωλὸν
  choice: நொண்டியிருப்பது
  rationale: நபுஞ்சக ஒருமை அடைமொழி பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது. ‘நொண்டியிருப்பது’ என்பது மனிதரையோ பலவீனமுற்ற உறுப்பையோ மட்டும் என்று தீர்மானிக்காமல், மூலத்தின் பொதுமையையும் உடல் உருவகத்தையும் காக்கிறது.
- source_word: ἐκτραπῇ
  choice: வழிவிலகிப் போகாமல்
  rationale: வினைச்சொல்லுக்கு பாதையிலிருந்து விலகுதல் என்ற பொருளும், உடல் உருவகத்தில் மூட்டு பிசகுதல் என்ற மருத்துவ நிழற்பொருளும் இருக்கலாம். முதன்மை உரை நடை உருவகத்தைத் தொடர்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἰαθῇ
  choice: குணமடையும்
  rationale: ἰάομαι என்பதன் வழக்கமான பொருள் குணமடைதல். இது உடல் உருவகத்தையும் மீட்டெடுக்கும் நோக்கத்தையும் காக்கிறது.
- source_word: μᾶλλον
  choice: மாறாக
  rationale: முந்தைய எதிர்மறையான விளைவுக்கு மாறான விரும்பத்தக்க விளைவை இச்சொல் அறிமுகப்படுத்துகிறது.
theological_decisions:
- issue: உடல் சார்ந்த மொழி நேர்ப்பொருளா அல்லது ஆவிக்குரிய உருவகமா
  choice: உடல் சார்ந்த சொற்களை முதன்மை உரையில் அப்படியே வைத்திருந்து, அவை உடல் பலவீனத்தையா, ஆவிக்குரிய பலவீனத்தையா, சமூகத்தில் பாதிக்கப்படக்கூடியவர்களையா குறிக்கின்றன என்று தீர்மானிக்கவில்லை.
  alternative: ‘நொண்டியிருப்பது’ என்பதை ஆவிக்குரிய நிலையில் பலவீனமான விசுவாசிகள் என்று வெளிப்படையாக மொழிபெயர்ப்பது.
  rationale: அறிவுறுத்தல் சூழலில் வரும் இவ்வசனம் உடல் உருவகத்தையும் ஞான இலக்கியத்தின் நடைப் படிமத்தையும் இணைக்கிறது. கிரேக்க உரை குறிப்பிடாத குறுகிய இறையியல் விளக்கத்தை மொழிபெயர்ப்பில் புகுத்தாமல் அதன் பதற்றத்தைக் காப்பது பொருத்தமானது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘நொண்டியிருப்பது’ என்ற நடுநிலை வடிவம் மூலத்தின் திட்டமிட்ட பொதுமையைக் காக்கிறது; மருத்துவ நிழற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
