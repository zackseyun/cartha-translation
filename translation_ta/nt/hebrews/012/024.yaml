source:
  edition: SBLGNT
  text: καὶ διαθήκης νέας μεσίτῃ Ἰησοῦ, καὶ αἵματι ῥαντισμοῦ κρεῖττον λαλοῦντι παρὰ τὸν Ἅβελ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/024.yaml
  text: and to Jesus[a], the mediator of a new covenant[b], and to the sprinkled blood that speaks better than Abel.
translation:
  language: ta
  text: புதிய உடன்படிக்கையின் நடுவரான இயேசுவிடமும், ஆபேலைவிட மேலாகப் பேசுகிற[a] தெளிக்கப்பட்ட இரத்தத்திடமும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆபேலின் இரத்தத்தைவிட மேலாகப் பேசுகிற.” கிரேக்கத்தில் சொல்லுக்குச் சொல் “ஆபேலைவிட” என்றே உள்ளது; இது நிலத்திலிருந்து ஆபேலின் இரத்தம் கூப்பிட்டதைச் சுட்டிக்காட்டலாம் (ஆதி 4:10).
    reason: alternative_reading
  - marker: b
    text: “தெளிக்கப்பட்ட இரத்தம்” என்பது சடங்குமுறையில் தெளிக்கப்படும் இரத்தத்தைக் குறிக்கிறது; இது உடன்படிக்கையை உறுதிப்படுத்துதல் மற்றும் தூய்மைப்படுத்துதல் ஆகிய உருவகங்களை நினைவூட்டுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: διαθήκης νέας
  choice: புதிய உடன்படிக்கையின்
  rationale: διαθήκη என்பதன் எபிரெயர் நிருபச் சூழலிலுள்ள உடன்படிக்கை சார்ந்த பொருளைத் தக்கவைக்கிறது. கிரேக்கத்தில் சுட்டுச்சொல் இல்லாவிட்டாலும், தமிழில் இயல்பான பெயர்த்தொடர் தெளிவற்ற தன்மையைத் தேவையின்றி நீக்குவதில்லை.
- source_word: μεσίτῃ
  choice: நடுவரான
  rationale: இரு தரப்பினருக்கிடையில் நின்று உடன்படிக்கை உறவை ஏற்படுத்துபவரைக் குறிக்கும் சட்ட மற்றும் இறையியல் வலிமையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: Ἰησοῦ
  choice: இயேசு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவம்.
- source_word: αἵματι ῥαντισμοῦ
  choice: தெளிக்கப்பட்ட இரத்தத்திடமும்
  rationale: சடங்குமுறையில் தெளிக்கப்படும் இரத்தத்தைக் குறிக்கும் உருவகத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; உடன்படிக்கை உறுதிப்படுத்துதல் மற்றும் தூய்மைப்படுத்துதல் ஆகிய பின்னணிகளை விரிவாக்காமல் தக்கவைக்கிறது.
- source_word: κρεῖττον
  choice: மேலான விதத்தில்
  rationale: இங்கு λαλοῦντι என்பதோடு இணைந்து, அந்த இரத்தம் பேசும் விதம் ஆபேலுடன் ஒப்பிடப்படுவதைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: λαλοῦντι
  choice: பேசுகிற
  rationale: நிகழ்காலப் பங்கேற்புவினையின் தொடரும் செயற்பாட்டை இயல்பான தமிழ் பெயரெச்ச வடிவில் காக்கிறது.
- source_word: παρὰ τὸν Ἅβελ
  choice: ஆபேலைவிட
  rationale: கிரேக்கத்தில் வெளிப்படையாக ‘ஆபேலின் இரத்தத்தைவிட’ என்று இல்லாமல் ‘ஆபேலைவிட’ என்றே இருப்பதால், அதன் சுருக்கமான ஒப்பீட்டையும் உண்மையான விளக்கத் திறப்பையும் தக்கவைக்கிறது.
theological_decisions:
- issue: ஆபேலுடன் செய்யப்படும் ஒப்பீட்டின் குறிப்பு
  choice: முதன்மை உரையில் ‘ஆபேலைவிட’ என்ற கிரேக்கத்தின் சுருக்கமான ஒப்பீடு தக்கவைக்கப்பட்டது.
  alternative: ‘ஆபேலின் இரத்தத்தைவிட’ அல்லது ‘ஆபேலின் இரத்தம் வேண்டியதைவிட மேலானவற்றைப் பேசுகிற’
  rationale: ஆதியாகமம் 4:10 மற்றும் எபிரெயர் 11:4 ஆகியவற்றின் பின்னணியில் ஆபேலின் இரத்தத்தைக் குறிக்கும் சாத்தியம் வலுவானது. ஆயினும், இவ்வசனத்தின் கிரேக்கம் ஆபேலையே நேரடியாகக் குறிப்பிடுவதால், முதன்மை உரையில் விரிவாக்காமல் அடிக்குறிப்பில் விளக்குவது இறையியல் பதற்றத்தையும் மொழியியல் சுருக்கத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டது. இவ்வசனம் முந்தைய வாக்கியத்திலிருந்து தொடரும் பட்டியலின் ஒரு பகுதி என்பதால், மூலத்தில் இல்லாத முதன்மை வினைச்சொல் சேர்க்கப்படவில்லை; ‘-இடமும்’ என்ற இணைவேற்றுமை அந்தத் தொடர்ச்சியைத் தக்கவைக்கிறது.
