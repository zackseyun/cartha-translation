source:
  edition: SBLGNT
  text: Εἰρήνην διώκετε μετὰ πάντων, καὶ τὸν ἁγιασμόν, οὗ χωρὶς οὐδεὶς ὄψεται τὸν κύριον,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/014.yaml
  text: Pursue peace with everyone[a], and the holiness without which no one will see the Lord.
translation:
  language: ta
  text: அனைவருடனும் சமாதானத்தையும் பரிசுத்தத்தையும்[a] நாடுங்கள்; பரிசுத்தம் இல்லாமல் ஒருவரும் ஆண்டவரைக் காணமாட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பரிசுத்தமாக்கப்படுதலை.’ கிரேக்கச் சொல் பரிசுத்தமான வாழ்க்கைப் பண்பையோ நிலையையோ, பரிசுத்தமாக்கப்படும் நிகழ்முறையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰρήνην
  choice: சமாதானமாக வாழ்வது
  rationale: இங்கு εἰρήνη என்பது உள்ளார்ந்த அமைதியை மட்டும் அல்லாமல், ‘அனைவருடனும்’ என்ற தொடருக்கு ஏற்ற உறவுசார் சமாதானத்தைக் குறிக்கிறது. தமிழில் ‘சமாதானமாக வாழ்வது’ அந்தப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: διώκετε
  choice: நாடித் தொடருங்கள்
  rationale: διώκω தீவிரமாகப் பின்தொடர்ந்து முயல்வதைக் குறிக்கிறது. ‘நாடித் தொடருங்கள்’ என்பது வெறும் விருப்பத்தைவிட விடாமுயற்சியுடன் செயல்பட வேண்டிய கட்டளையைத் தெரிவிக்கிறது.
- source_word: μετὰ πάντων
  choice: அனைவருடனும்
  rationale: இந்தச் சொற்றொடர் எல்லா மனிதர்களையும் உள்ளடக்கும் பொதுவான பரப்பைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: τὸν ἁγιασμόν
  choice: பரிசுத்தமாக்கப்படுதல்
  rationale: ἁγιασμός என்பது பரிசுத்த நிலை, பரிசுத்த வாழ்வு, அல்லது பரிசுத்தமாக்கப்படும் நிகழ்முறை ஆகிய நெருங்கிய கருத்துகளைக் கொண்டிருக்கலாம். ‘பரிசுத்தமாக்கப்படுதல்’ அதன் நிகழ்முறை/நிலை சார்ந்த பொருளைத் தக்கவைக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: οὗ χωρὶς
  choice: அது இல்லாமல்
  rationale: οὗ என்பது ஒருமை ஆண்பால் வடிவில் ἁγιασμόν என்பதையே இயல்பாகச் சுட்டுகிறது. ‘அது இல்லாமல்’ இந்தத் தொடர்பைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: οὐδεὶς
  choice: ஒருவரும் … காணமாட்டார்
  rationale: οὐδείς என்பதன் முழுமையான மறுப்பைத் தமிழின் இயல்பான எதிர்மறை அமைப்பான ‘ஒருவரும் … காணமாட்டார்’ துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: ὄψεται
  choice: காணமாட்டார்
  rationale: ὄψεται என்பது எதிர்காலத்தில் ‘காண்பார்’ என்ற நேரடியான பொருளைக் கொண்டது; எதிர்மறை வாக்கியத்தில் ‘காணமாட்டார்’ என்பது இயல்பான தமிழ்.
- source_word: τὸν κύριον
  choice: ஆண்டவரை
  rationale: κύριος என்ற பட்டத்தை ‘ஆண்டவர்’ என்று மொழிபெயர்ப்பது தமிழ் வேதாகம நடையில் தெளிவும் கண்ணியமும் உடையது; அது யாரைக் குறிக்கிறது என்பதை மொழிபெயர்ப்பு தேவையின்றி வரையறுப்பதில்லை.
theological_decisions:
- issue: அறிவுறுத்தல் சூழலில் ἁγιασμός என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘பரிசுத்தமாக்கப்படுதல்’ என்று வழங்கப்பட்டது.
  alternative: பரிசுத்தம்; பரிசுத்த வாழ்வு
  rationale: கிரேக்கச் சொல் பரிசுத்தத்தின் நிலை அல்லது வாழ்க்கைப் பண்பையும், பரிசுத்தமாக்கப்படும் நிகழ்முறையையும் குறிக்க முடியும். ஒரே பொருளாகச் சுருக்காமல், முதன்மைத் தேர்வுடன் மாற்றுப் பொருளை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: ‘ஆண்டவர்’ யாரைக் குறிக்கிறது
  choice: ‘ஆண்டவர்’ என்ற பட்டம் அப்படியே வைக்கப்பட்டது.
  alternative: தேவன்; ஆண்டவராகிய இயேசு
  rationale: கிரேக்க மூலத்தில் τὸν κύριον என்று மட்டுமே உள்ளது. அது பிதாவாகிய தேவனையா அல்லது இயேசு கிறிஸ்துவையா குறிக்கிறது என்பதை மொழிபெயர்ப்பில் தீர்மானிக்காமல், மூலத்தின் திறந்த தன்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘நாடித் தொடருங்கள்’ என்பது கட்டளையின் தீவிரத்தையும் விடாமுயற்சியையும் காட்டுகிறது; ‘அனைவருடனும் சமாதானமாக வாழ்வது’ உறவுசார் பொருளை இயல்பாக்குகிறது.
