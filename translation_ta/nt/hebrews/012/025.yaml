id: HEB.12.25
reference: Hebrews 12:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Βλέπετε μὴ παραιτήσησθε τὸν λαλοῦντα· εἰ γὰρ ἐκεῖνοι οὐκ ⸀ἐξέφυγον ⸂ἐπὶ γῆς παραιτησάμενοι τὸν⸃ χρηματίζοντα, ⸀πολὺ μᾶλλον ἡμεῖς οἱ τὸν ἀπ’ οὐρανῶν ἀποστρεφόμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/025.yaml
  text: See to it that you do not refuse the one who is speaking[a]. For if those did not escape when they refused the one who warned them on earth[b], much less will we if we turn away from the one who warns from heaven.
translation:
  language: ta
  text: பேசிக்கொண்டிருப்பவரை மறுக்காதபடி கவனமாக இருங்கள். ஏனெனில், பூமியில் எச்சரித்தவரை[a] மறுத்த அவர்கள் தப்பவில்லை என்றால், பரலோகத்திலிருந்து பேசுகிறவரை விட்டு விலகும் நாம் எவ்வளவு அதிகமாகத் தப்பமாட்டோம்! [b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பூமியில் இறை அறிவுரை கொடுத்தவரை.’ கிரேக்க வினை இறையதிகாரத்துடன் வழங்கப்படும் அறிவுரையையோ எச்சரிப்பையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘மிகவும் அதிகமாக நாம், பரலோகத்திலிருந்து இருப்பவரை விட்டு விலகுகிறவர்கள்.’ ‘தப்பமாட்டோம்’ என்ற வினை முந்தைய கூறிலிருந்து புரிந்துகொள்ளப்படுகிறது; வாசிப்புத் தெளிவுக்காக உரையில் சேர்க்கப்பட்டுள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε
  choice: கவனமாக இருங்கள்
  rationale: பன்மை கட்டளை இங்கு எச்சரிக்கையுடன் கூடிய அறிவுறுத்தலாக உள்ளது; வெறும் ‘பாருங்கள்’ என்பதைக் காட்டிலும் தமிழில் இயல்பாக அதன் செயல்பாட்டைத் தெரிவிக்கிறது.
- source_word: μὴ παραιτήσησθε / παραιτησάμενοι
  choice: மறுக்காதபடி / மறுத்த
  rationale: ஒரே கிரேக்க வினையின் மறுபயன்பாட்டை தமிழிலும் ‘மறு’ என்ற ஒரே வேரால் காத்து, சொல்லப்படுவதை ஏற்க மறுக்கும் கருத்தைத் தெளிவாக்குகிறது.
- source_word: τὸν λαλοῦντα
  choice: பேசிக்கொண்டிருப்பவரை
  rationale: நிகழ்காலப் பங்கேற்புவினை காட்டும் தொடர்ந்து நடைபெறும் அல்லது தற்போதைய பேச்சின் நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: ἐξέφυγον
  choice: தப்பவில்லை
  rationale: தீர்ப்பின் விளைவிலிருந்து தப்பாததைக் குறிக்கும் சூழலில் எளிய, நேரடியான தமிழ் இணைச்சொல்.
- source_word: ἐπὶ γῆς
  choice: பூமியில்
  rationale: ἀπ’ οὐρανῶν என்பதுடனான பூமி–பரலோகம் எதிர்மறை ஒப்பீட்டைப் பாதுகாத்து, சீனாய் மலையை வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: χρηματίζοντα
  choice: இறை எச்சரிப்பு கொடுத்தவரை
  rationale: இந்த வினை இறையதிகாரம் பெற்ற அறிவுறுத்தல் அல்லது எச்சரிப்பைக் குறிக்கலாம். எச்சரிக்கைச் சூழலை முதன்மைப்படுத்தியபோதும், அதன் இறைத் தொடர்பை ‘இறை எச்சரிப்பு’ வெளிப்படுத்துகிறது.
- source_word: πολὺ μᾶλλον
  choice: இன்னும் அதிக நிச்சயம்
  rationale: எதிர்மறையான சிறியதிலிருந்து பெரியதற்கான வாதத்தை இயல்பான தமிழில் தெரிவிக்கிறது; ‘மிகவும் அதிகமாக நாம் தப்பமாட்டோம்’ என்ற செயற்கையான சொல்லமைப்பைத் தவிர்க்கிறது.
- source_word: ἀποστρεφόμενοι
  choice: விட்டு விலகும்
  rationale: வெறுமனே கேட்க மறுப்பதைவிட தீவிரமான பின்வாங்குதல் அல்லது திரும்பிச் செல்லுதல் என்ற பொருளை அளிக்கிறது; அதேவேளை விசுவாசத் துறப்பு போன்ற விளக்கச் சொல்லைச் சேர்க்கவில்லை.
- source_word: τὸν ἀπ’ οὐρανῶν
  choice: பரலோகங்களிலிருந்து எச்சரிப்பவரை
  rationale: கிரேக்கப் பன்மை வடிவமான οὐρανῶν-ஐ ‘பரலோகங்கள்’ என்று காத்து, முந்தைய எச்சரிப்புச் செயலை ஒப்பீட்டின் மூலம் இங்கு இயல்பாக நிரப்புகிறது.
theological_decisions:
- issue: பேசுகிறவர் அல்லது எச்சரிப்பவரின் அடையாளம்
  choice: ‘பேசிக்கொண்டிருப்பவர்’ மற்றும் ‘எச்சரிப்பவர்’ என்று பொதுவாகவே குறிப்பிடுதல்
  alternative: அவரை வெளிப்படையாக ‘தேவன்’ அல்லது ‘கிறிஸ்து’ என்று அடையாளப்படுத்துதல்
  rationale: சூழல் இறைப் பேச்சைக் காட்டினாலும், வசனம் தனிப்பெயர் அல்லது பட்டத்தைப் பயன்படுத்தவில்லை. ஆகவே வாசகர் சூழலிலிருந்து அடையாளத்தை உணர இடமளிக்கப்படுகிறது.
- issue: இரண்டாம் கூறில் விடுபட்டுள்ள வினை
  choice: ‘நாம் தப்பமாட்டோம்’ என்று வெளிப்படையாக நிரப்புதல்
  alternative: ‘பரலோகங்களிலிருந்து வருகிறவரை விட்டு விலகும் நாம் இன்னும் அதிகமாக’ என்று கிரேக்க நீக்கத்தை அப்படியே விடுதல்
  rationale: கிரேக்கத்தில் ‘தப்புதல்’ என்ற வினை முந்தைய கூறிலிருந்து புரிந்துகொள்ளப்படுகிறது. வாசிக்கத்தக்க நவீன தமிழுக்காக அதை நிரப்புவது கருத்தை மாற்றாது.
- issue: χρηματίζοντα என்பதிலுள்ள இறைத் தொடர்பு
  choice: ‘இறை எச்சரிப்பு கொடுத்தவர்’
  alternative: ‘எச்சரித்தவர்’ அல்லது ‘இறை அறிவுரை கொடுத்தவர்’
  rationale: சொல்லின் இறையதிகாரம் பெற்ற தொடர்பு என்ற நுணுக்கத்தையும், இச்சூழலின் எச்சரிக்கை வலிமையையும் ஒன்றாகக் காக்கிறது; பேச்சாளரின் துல்லிய அடையாளத்தைத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வழிபாட்டு வாசிப்புக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘பரலோகங்கள்’ என்பது மூலத்தின் பன்மையைப் பாதுகாக்கிறது. ஒரே கிரேக்க வினையின் இருமுறை பயன்பாடு ‘மறுக்காதபடி / மறுத்த’ எனத் தமிழிலும் இணைக்கப்பட்டுள்ளது.
