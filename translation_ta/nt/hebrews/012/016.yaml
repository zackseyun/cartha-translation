review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents πόρνος, βέβηλος, Esau, and the exchange of the birthright for one meal. However, ‘தலைமகன் உரிமை’ is not the clearest modern-standard expression for τὰ πρωτοτόκια, the rights/status belonging to him as firstborn. ‘விற்றுப்போட்டான்’ adds a dismissive nuance beyond the neutral ἀπέδετο (‘sold’).
  naturalness: The sentence is clear and suitable for public reading. ‘முதற்பேறுக்குரிய உரிமை’ is more immediately intelligible and precise in modern Tamil than ‘தலைமகன் உரிமை.’
  terminology: ‘புனிதமானவற்றை மதிக்காதவன்’ appropriately conveys βέβηλος without importing the potentially narrower claim of atheism in ‘இறையற்றவன்.’ ‘பாலியல் ஒழுக்கக்கேடுள்ளவன்’ is a clear modern rendering of πόρνος. ‘முதற்பேறுக்குரிய உரிமை’ accurately conveys the birthright.
  issues:
  - severity: medium
    issue: ‘தலைமகன் உரிமை’ is potentially unclear or nonstandard for ‘birthright.’
    rationale: τὰ πρωτοτόκια denotes the entitlement/status of the firstborn, not merely an unspecified right of a ‘head/elder son.’ ‘முதற்பேறுக்குரிய உரிமை’ states this meaning directly.
  - severity: low
    issue: ‘விற்றுப்போட்டான்’ is more evaluative than the Greek verb.
    rationale: ἀπέδετο means ‘sold.’ The seriousness of the act is already supplied by the object and the exchange for one meal; ‘விற்றான்’ preserves the source wording without added rhetorical coloring.
  revised_text: ஒருவனும் பாலியல் ஒழுக்கக்கேடுள்ளவனாகவோ, ஏசாவைப் போலப் புனிதமானவற்றை மதிக்காதவனாகவோ இருக்காதபடி பார்த்துக்கொள்ளுங்கள். அவன் ஒரே வேளை உணவுக்காகத் தன் முதற்பேறுக்குரிய உரிமையை விற்றான்.
