id: HEB.12.16
reference: Hebrews 12:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μή τις πόρνος ἢ βέβηλος ὡς Ἠσαῦ, ὃς ἀντὶ βρώσεως μιᾶς ἀπέδετο τὰ πρωτοτόκια ⸀ἑαυτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/016.yaml
  text: that no one be sexually immoral or godless like Esau, who sold his own birthright for a single meal.
translation:
  language: ta
  text: ஒருவனும் பாலியல் ஒழுக்கக்கேடுள்ளவனாகவோ, ஏசாவைப் போலப் புனிதமானவற்றை மதிக்காதவனாகவோ இருக்காதபடி பார்த்துக்கொள்ளுங்கள். அவன் ஒரே வேளை உணவுக்காகத் தன் முதற்பேறுக்குரிய உரிமையை விற்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόρνος
  choice: பாலியல் ஒழுக்கக்கேடுள்ளவன்
  rationale: பாலியல் ஒழுக்கக்கேட்டில் ஈடுபடுகிற ஒருவரைக் குறிக்கும் கிரேக்கச் சொல்லின் பொருளை நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: βέβηλος
  choice: புனிதமானவற்றை மதிக்காதவன்
  rationale: இச்சொல் அடிப்படையில் புனிதத்திற்கு எதிரான, சாதாரணமாக அல்லது அவமதிப்பாக நடத்தும் ஒருவரைக் குறிக்கிறது. ‘இறையற்றவன்’ என்பது கடவுள் நம்பிக்கையே இல்லாதவன் என்ற கூடுதல் பொருளைச் சேர்க்கக்கூடும்; எனவே மூலத்தின் புனிதம்–பொதுமை எதிர்மறையை விளக்கமாகப் பாதுகாக்கிறது.
- source_word: βρώσεως μιᾶς
  choice: ஒரே வேளை உணவு
  rationale: ஒரே முறை உண்ணும் உணவைக் குறிக்கும் சொற்றொடரை இயல்பான தமிழில் தருகிறது.
- source_word: τὰ πρωτοτόκια
  choice: தலைமகன் உரிமை
  rationale: முதற்பேறான மகனுக்குரிய சிறப்பு உரிமையையும் பங்கையும் குறிக்கிறது; தமிழ் வாசகர்களுக்கு எளிதில் புரியும் வழக்கமான வடிவம்.
- source_word: ἀπέδετο
  choice: விற்றுப்போட்டான்
  rationale: விற்றான் என்ற பொருளைத் தருவதோடு, மதிப்புமிக்க உரிமையை அற்பமான மாற்றீட்டுக்காக விட்டுவிட்ட செயலை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: βέβηλος என்பதன் இறையியல் நுணுக்கம்
  choice: புனிதமானவற்றை மதிக்காதவன்
  alternative: இறையற்றவன் / அசுத்தமானவன்
  rationale: ‘இறையற்றவன்’ நாத்திகத்தையோ தேவபக்தியின்மையையோ முன்கூட்டியே வலுப்படுத்தும்; ‘அசுத்தமானவன்’ சடங்கு அசுத்தத்தைச் சுட்டக்கூடும். தேர்ந்த வடிவம் புனிதமானதை உலகியலானதாகக் கருதி அலட்சியம் செய்வது என்ற மூல நுணுக்கத்தைப் பாதுகாக்கிறது.
- issue: ὡς Ἠσαῦ என்பது இரண்டு குற்றங்களுடனும் தொடர்புடையதா?
  choice: தமிழ் வாக்கிய அமைப்பு ஏசாவை குறிப்பாக βέβηλος என்பதோடு நெருக்கமாக இணைக்கிறது; ஆனால் முதல் குற்றத்துடனான இலக்கணத் தொடர்பை வெளிப்படையாக மறுக்கவில்லை.
  alternative: ‘ஏசாவைப் போலப் பாலியல் ஒழுக்கக்கேடுள்ளவனாகவோ புனிதமற்றவனாகவோ’ என்று இரண்டுடனும் தெளிவாக இணைத்தல்
  rationale: ஆதியாகமத்தில் ஏசாவைப் பாலியல் ஒழுக்கக்கேடுடையவன் என்று வெளிப்படையாகக் கூறாததால், மூலத்தின் தொடரமைப்பில் உள்ள தெளிவின்மையைத் தீர்மானமாக ஒருபக்கம் சாய்க்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சபை வாசிப்புக்கு ஏற்ற கண்ணியமான, பொதுமக்களுக்கு புரியும் நடை. ‘பார்த்துக்கொள்ளுங்கள்’ என்பது முன் வசனங்களில் தொடரும் மேற்பார்வைச் சொல்லாட்சியை இயல்பாக நிறைவு செய்கிறது.
