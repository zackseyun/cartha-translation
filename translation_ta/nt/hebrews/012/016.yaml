revisions:
- from: ஒருவனும் பாலியல் ஒழுக்கக்கேடுள்ளவனாகவோ, ஏசாவைப் போலப் புனிதமானவற்றை மதிக்காதவனாகவோ இருக்காதபடி பார்த்துக்கொள்ளுங்கள். அவன் ஒரே வேளை உணவுக்காகத் தன் தலைமகன் உரிமையை விற்றுப்போட்டான்.
  to: ஒருவனும் பாலியல் ஒழுக்கக்கேடுள்ளவனாகவோ, ஏசாவைப் போலப் புனிதமானவற்றை மதிக்காதவனாகவோ இருக்காதபடி பார்த்துக்கொள்ளுங்கள். அவன் ஒரே வேளை உணவுக்காகத் தன் முதற்பேறுக்குரிய உரிமையை விற்றான்.
  rationale: The revision retains the draft’s careful, non-doctrinal rendering of βέβηλος and its restrained handling of the syntax involving Esau. It replaces an unclear birthright term with a precise modern Tamil expression and removes evaluative force not explicit in ἀπέδετο.
