base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/020.yaml
  text: 'For they could not endure what was being commanded: “If even an animal touches the mountain[a], it will be stoned.”'
translation:
  language: ta
  text: 'ஏனெனில், கட்டளையிடப்பட்டதை அவர்களால் தாங்கிக்கொள்ள முடியவில்லை: “ஒரு விலங்குகூட அந்த மலையைத் தொட்டால்[a], அது கல்லெறிந்து கொல்லப்படும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகள், யாத்திராகமம் 19:12–13-ஐ எதிரொலிக்கும் வகையில், “அல்லது அம்பினால் எய்யப்பட வேண்டும்” என்று கூடுதலாகச் சேர்க்கின்றன.
    reason: textual_variant
lexical_decisions:
- source_word: οὐκ ἔφερον
  choice: அவர்களால் தாங்கிக்கொள்ள முடியவில்லை
  rationale: எதிர்மறையுடன் வரும் φέρω இச்சூழலில் ‘சகித்தல்/தாங்குதல்’ எனப் பொருள்படுகிறது. இயலாமையையும் கட்டளையின் கடுமையைத் தாங்க முடியாத நிலையையும் இயல்பான நவீன தமிழில் இது தெரிவிக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத்தை γάρ அறிமுகப்படுத்துகிறது; ‘ஏனெனில்’ அந்த இணைப்பைத் தெளிவாகக் காக்கிறது.
- source_word: τὸ διαστελλόμενον
  choice: கட்டளையிடப்பட்டதை
  rationale: διαστέλλω என்பதன் நிகழ்காலச் செயப்பாட்டு வினையெச்சம் அதிகாரபூர்வமாக விதிக்கப்பட்ட கட்டளையைக் குறிக்கிறது. பெயர்ச்சொல்லாக மட்டும் மாற்றாமல், அதன் வாய்மொழிக் கட்டளைத் தன்மையை இத்தேர்வு காக்கிறது.
- source_word: Κἂν
  choice: ஒரு …கூட … தொட்டால்
  rationale: κἄν நிபந்தனையுடன் வலியுறுத்தும் ‘கூட’ என்ற நுணுக்கத்தைக் கொண்டது. தமிழ் வாக்கிய அமைப்பில் ‘ஒரு விலங்குகூட … தொட்டால்’ என்பது அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: θηρίον
  choice: ஒரு விலங்கு
  rationale: θηρίον என்பது மிருகம் அல்லது விலங்கு எனப் பொருள்படலாம். இங்கு காட்டுவிலங்கு மட்டும் என்று வரம்பிடாத பொதுவான ‘விலங்கு’ பொருத்தமானது.
- source_word: θίγῃ
  choice: தொட்டால்
  rationale: நிபந்தனை வாக்கியத்திலுள்ள aorist subjunctive தமிழில் இயல்பாக ‘தொட்டால்’ என்று வழங்கப்படுகிறது.
- source_word: τοῦ ὄρους
  choice: அந்த மலையை
  rationale: ὄρος என்பது ‘மலை’. சுற்றியுள்ள சூழலில் ஏற்கெனவே அடையாளம் காணப்பட்ட மலையைக் குறிக்கும் கிரேக்க definite article-ன் உரையாடல் இயல்பைத் தமிழில் ‘அந்த’ வெளிப்படுத்துகிறது; ‘சீனாய்’ என்ற பெயர் மூலத்தில் இல்லாததால் சேர்க்கப்படவில்லை.
- source_word: λιθοβοληθήσεται
  choice: அது கல்லெறிந்து கொல்லப்பட வேண்டும்
  rationale: λιθοβολέω என்பது வெறுமனே கல் எறிவதல்ல, கல்லெறிந்து மரணதண்டனை நிறைவேற்றுவதைக் குறிக்கிறது. எதிர்காலச் செயப்பாட்டு வடிவம் மேற்கோள் காட்டப்படும் கட்டளையில் விதிக்கப்பட்ட விளைவைச் சுட்டுவதால், தமிழில் ‘கொல்லப்பட வேண்டும்’ கட்டளை வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சீனாய் கட்டளையுடனான மேற்கோளின் உறவு
  choice: கொடுக்கப்பட்ட SBLGNT உரையில் உள்ள ‘அது கல்லெறிந்து கொல்லப்பட வேண்டும்’ என்பதுடன் மேற்கோள் முடிக்கப்படுகிறது.
  alternative: யாத்திராகமம் 19:12–13-ஐ ஒட்டி ‘அல்லது அம்பினால் எய்யப்பட வேண்டும்’ என்பதை முதன்மை உரையில் சேர்த்தல்.
  rationale: சில கிரேக்கக் கையெழுத்துப் பிரதிகளில் விரிவான வாசகம் இருந்தாலும், கொடுக்கப்பட்ட SBLGNT மூல உரையில் அது இல்லை. ஆகவே வேறு உரைமரபுடன் ஒத்திசைக்காமல் மூல உரை மொழிபெயர்க்கப்பட்டு, வேறுபாடு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழ்; தெளிவான, கண்ணியமான நடை. ‘கல்லெறிந்து கொல்லப்பட வேண்டும்’ என்பது நீதித்தீர்ப்புச் சார்ந்த செயப்பாட்டையும் கட்டளையின் வலிமையையும் காக்கிறது. அடிக்குறிப்பு குறியீடு தொடர்புடைய ‘மலையைத் தொட்டால்’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
