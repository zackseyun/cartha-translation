revisions:
- from: ஆனால், நீங்கள் சீயோன் மலையிடமும், வாழும் கடவுளின் நகரமாகிய பரலோக எருசலேமிடமும், விழாக்கூட்டமாகத் திரண்டுள்ள எண்ணற்ற வானதூதர்களிடமும்[a][b] வந்திருக்கிறீர்கள்.
