  text: ἀλλὰ προσεληλύθατε Σιὼν ὄρει καὶ πόλει θεοῦ ζῶντος, Ἰερουσαλὴμ ἐπουρανίῳ, καὶ μυριάσιν ἀγγέλων, πανηγύρει
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/022.yaml
  text: But you have come to Mount Zion and to the city of the living God[a], the heavenly Jerusalem, and to myriads of angels in festal gathering[b],
translation:
  language: ta
  text: ஆனால், நீங்கள் சீயோன் மலைக்கும், வாழும் கடவுளின் நகரமான பரலோக எருசலேமுக்கும், விழாக்கூட்டமாகக் கூடியிருக்கும் எண்ணற்ற வானதூதர்களுக்கும்[a][b] வந்திருக்கிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எண்ணற்ற வானதூதர்களுக்கும், விழாக்கூட்டத்திற்கும்’ என்றும் மொழிபெயர்க்கலாம். ‘விழாக்கூட்டம்’ என்பதை வானதூதர்களோடு இணைத்தோ, பட்டியலின் தனி உறுப்பாக எடுத்தோ புரிந்துகொள்ளக் கிரேக்கத் தொடரியல் இடமளிக்கிறது.
    reason: alternative_reading
  - marker: b
    text: ‘எண்ணற்ற’ என மொழிபெயர்க்கப்பட்ட கிரேக்கச் சொல் சொற்பொருளில் ‘பதினாயிரங்கள்’ என்றும், பொதுவாக எண்ணிலடங்காத பெருந்திரள் என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய பகுதியில் விவரிக்கப்பட்ட சீனாய் மலை அனுபவத்துடன் வலுவான முரண்பாட்டைக் காட்டும் இயல்பான தமிழ் இணைப்புச்சொல்.
- source_word: προσεληλύθατε
  choice: வந்திருக்கிறீர்கள்
  rationale: நெருங்கிவந்த செயலும் அதன் விளைவாக இப்போது நிலவும் நிலையுமாகிய கிரேக்க நிறைவுக்காலத்தின் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Σιὼν ὄρει
  choice: சீயோன் மலையிடமும்
  rationale: மலையின் உருவகத்தையும் சீயோன் என்ற பெயரையும் காத்து, προσέρχομαι என்பதுடன் வரும் இலக்கை ‘-இடமும்’ எனக் காட்டுகிறது.
- source_word: πόλει θεοῦ ζῶντος
  choice: வாழும் கடவுளின் நகரமாகிய
  rationale: θεοῦ என்பதன் உடைமை உறவையும் ζῶντος என்பதன் இறையியல் முக்கியத்துவமுள்ள ‘வாழும்’ என்ற வருணனையையும் நேரடியாகக் காக்கிறது.
- source_word: Ἰερουσαλὴμ ἐπουρανίῳ
  choice: பரலோக எருசலேம்
  rationale: இது ‘வாழும் கடவுளின் நகரம்’ என்பதற்கு விளக்கமாக இணைந்து நிற்பதை ‘நகரமாகிய’ என்ற அமைப்பு தெளிவாக்குகிறது; ἐπουράνιος என்பதையும் இயல்பாக மொழிபெயர்க்கிறது.
- source_word: μυριάσιν ἀγγέλων
  choice: எண்ணற்ற வானதூதர்களிடமும்
  rationale: μυριάς என்பது சொற்பொருளில் பதினாயிரங்களைக் குறிக்கக்கூடியதாயினும், இங்கு அளவிட முடியாத பெருந்திரளையும் குறிக்கலாம். ‘எண்ணற்ற’ என்பது சூழலுக்கேற்ற இயல்பான தமிழ்; எண்ணியல் நிழற்பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: πανηγύρει
  choice: விழாக்கூட்டமாகத் திரண்டுள்ள
  rationale: πανήγυρις குறிக்கும் மகிழ்ச்சியான பொதுவிழாக் கூடுகையை வெளிப்படுத்தி, முதன்மை வாசிப்பில் அதை உடனே முந்திய வானதூதர் திரளோடு இணைக்கிறது.
theological_decisions:
- issue: πανηγύρει என்பதன் தொடரியல் தொடர்பு
  choice: ‘விழாக்கூட்டமாகத் திரண்டுள்ள எண்ணற்ற வானதூதர்கள்’ என்று வானதூதர் திரளோடு இணைத்தல்
  alternative: ‘எண்ணற்ற வானதூதர்களிடமும், விழாக்கூட்டத்திடமும்’ என்று பட்டியலின் தனி உறுப்பாக எடுத்தல்; அல்லது 12:23-இல் தொடரும் ‘சபை/கூட்டம்’ என்பதோடு இணைத்தல்
  rationale: வேற்றுமை அமைப்பு ஒன்றுக்கு மேற்பட்ட தொடர்புகளை அனுமதிக்கிறது. உடனே முந்திய ‘வானதூதர்கள்’ என்பதோடு இணைப்பது தெளிவான பொருளைத் தருகிறது; இருப்பினும் கிரேக்கத்தின் உண்மையான தொடரியல் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் உயர்ந்த நடையும் காக்கப்பட்டுள்ளன. நீண்ட கிரேக்கப் பட்டியல் தமிழிலும் ஒரே வாக்கிய ஓட்டத்தில் வைக்கப்பட்டுள்ளது; ‘நகரமாகிய’ என்பது எருசலேமை முந்திய சொற்றொடரின் விளக்கப் பெயராகத் தெளிவாக்குகிறது. இரு அடிக்குறிப்பு குறியீடுகளும் தொடர்புடைய வானதூதர்–விழாக்கூட்டச் சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளன.
