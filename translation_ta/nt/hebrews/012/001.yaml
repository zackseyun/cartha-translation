id: HEB.12.1
reference: Hebrews 12:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τοιγαροῦν καὶ ἡμεῖς, τοσοῦτον ἔχοντες περικείμενον ἡμῖν νέφος μαρτύρων, ὄγκον ἀποθέμενοι πάντα καὶ τὴν εὐπερίστατον ἁμαρτίαν, δι’ ὑπομονῆς τρέχωμεν τὸν προκείμενον ἡμῖν ἀγῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/001.yaml
  text: Therefore[a], since we also have so great a cloud of witnesses surrounding us, laying aside every weight and the sin that so easily entangles, let us run with endurance the race set before us,
translation:
  language: ta
  text: ஆகவே, நம்மைச் சூழ்ந்திருக்கும் இவ்வளவு பெரிய சாட்சிகளின் மேகம் நமக்கு இருப்பதால், எல்லாப் பாரத்தையும் எளிதில் நம்மைச் சிக்கவைக்கும் பாவத்தையும்[a] அகற்றிவிட்டு, நமக்கு முன் வைக்கப்பட்டுள்ள ஓட்டப்பந்தயத்தைப் பொறுமையோடு ஓடுவோமாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம்மை நெருக்கமாகப் பற்றிக்கொள்ளும் பாவம்” அல்லது “எளிதில் கண்ணியில் சிக்கவைக்கும் பாவம்.” இங்குள்ள கிரேக்கப் பெயரடை அரிதானது; அது சிக்கவைத்தல், கண்ணியில் அகப்படுத்துதல் அல்லது நெருக்கமாகப் பற்றிக்கொள்ளுதல் ஆகியவற்றில் எதை வலியுறுத்துகிறது என்பது உறுதியல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοιγαροῦν
  choice: ஆகவே
  rationale: முந்தைய வாதத்திலிருந்து, குறிப்பாக எபிரெயர் 11-இலிருந்து, முடிவை எடுத்துரைக்கும் இணைப்புச் சொல்லின் தர்க்க வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: τοσοῦτον ... νέφος μαρτύρων
  choice: இவ்வளவு பெரிய சாட்சிகளின் மேகம்
  rationale: சாட்சிகளின் பெருந்திரளைச் சித்தரிக்கும் ‘மேகம்’ என்ற உருவகத்தையும் τοσοῦτον என்பதன் வலியுறுத்தலையும் காக்கிறது.
- source_word: περικείμενον ἡμῖν
  choice: நம்மைச் சூழ்ந்திருக்கும்
  rationale: எல்லாப் பக்கங்களிலும் அமைந்திருப்பதைக் குறிக்கும் பங்கேற்பு வினையின் இடவியல் உருவகத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μαρτύρων
  choice: சாட்சிகள்
  rationale: சான்றுரைப்பவர்களைக் குறிக்கும் சொல்லை நேரடியாகக் காக்கிறது; அவர்கள் ஓட்டத்தைப் பார்க்கும் பார்வையாளர்கள் மட்டுமே என்ற விளக்கத்தை மொழிபெயர்ப்பு திணிப்பதில்லை.
- source_word: ὄγκον πάντα
  choice: எல்லாப் பாரத்தையும்
  rationale: ஓடுபவரை மெதுவாக்கும் எடை அல்லது இடையூறு என்ற விளையாட்டு உருவகத்தைச் சுருக்கமாகக் காக்கிறது.
- source_word: ἀποθέμενοι
  choice: அகற்றிவிட்டு
  rationale: முதன்மை அறிவுறுத்தலுக்கு முன்னதாக அல்லது அதனுடன் நிகழும் தீர்மானமான நீக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: εὐπερίστατον
  choice: எளிதில் நம்மைச் சிக்கவைக்கும்
  rationale: ஓட்ட உருவகத்தில் தடுக்கும் ஆபத்தைத் தெளிவாக எடுத்துரைக்கிறது. அரிதான இந்தக் கிரேக்கச் சொல்லின் ‘நெருக்கமாகப் பற்றிக்கொள்ளும்’ அல்லது ‘எளிதில் கண்ணியில் சிக்கவைக்கும்’ என்ற மாற்றுப் பொருள்கள் அடிக்குறிப்பில் காக்கப்பட்டுள்ளன.
- source_word: ἁμαρτίαν
  choice: பாவத்தை
  rationale: கிரேக்க உரையின் குறிப்பிட்ட சொல்லாட்சியைப் பிரதிபலிக்கிறது; அதே நேரத்தில் இது பெயரிடப்பட்ட ஒரு தனிப்பட்ட பாவம் என்று கூடுதலாகத் தீர்மானிப்பதில்லை.
- source_word: δι’ ὑπομονῆς
  choice: விடாமுயற்சியோடு
  rationale: இடரின் மத்தியிலும் தொடர்ந்து நிலைத்திருக்கும் மனப்பாங்கை நவீன, இயல்பான தமிழில் தெரிவித்து ஓட்ட உருவகத்துக்கும் பொருந்துகிறது.
- source_word: τρέχωμεν
  choice: ஓடுவோமாக
  rationale: முதல் நபர் பன்மை அறிவுறுத்தல் வினையின் ‘நாம் ஓடுவோம்’ என்ற கூட்டு அழைப்பை dignified Tamil-இல் காக்கிறது.
- source_word: τὸν προκείμενον ἡμῖν ἀγῶνα
  choice: நமக்கு முன் வைக்கப்பட்டுள்ள ஓட்டப்பந்தயத்தை
  rationale: ἀγών என்பதற்கு போட்டி அல்லது போராட்டம் என்ற பொருள்களும் இருந்தாலும், τρέχωμεν என்ற ‘ஓடுதல்’ சூழலில் ‘ஓட்டப்பந்தயம்’ பொருத்தமானது; προκείμενον என்பதன் முன் வைக்கப்பட்ட பாதை என்ற எண்ணமும் காக்கப்படுகிறது.
theological_decisions:
- issue: எபிரெயர் 11-ஐச் சார்ந்த ‘சாட்சிகள்’ என்பதன் பொருள்
  choice: தங்கள் விசுவாச வாழ்வால் சான்றுரைப்பவர்கள்; அவர்களைச் சூழ்ந்திருக்கும் மேகம் என்ற உருவகம் அறிவுறுத்தலை வலுப்படுத்துகிறது
  alternative: விசுவாசிகள் ஓடுவதைப் பரலோகத்திலிருந்து பார்த்துக்கொண்டிருக்கும் பார்வையாளர்கள் என்பது முதன்மைப் பொருள்
  rationale: உடனடியான சூழல் எபிரெயர் 11-இன் விசுவாச முன்மாதிரிகளைச் சுட்டுகிறது. ‘சாட்சிகள்’ என்ற சொல்லை அப்படியே வைத்திருப்பதால், அவர்கள் செயலில் பார்வையாளர்களாக இருக்கிறார்கள் என்ற வலுவான விளக்கத்தை மொழிபெயர்ப்பு திணிக்காமல் உரையின் விளக்கத் திறப்பைக் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘சாட்சிகளின் மேகம்,’ ‘பாரம்,’ ‘ஓட்டப்பந்தயம்’ ஆகிய பரஸ்பரம் தொடர்புடைய உருவகங்கள் காக்கப்பட்டுள்ளன; அரிதான εὐπερίστατον சொல்லின் உண்மையான தெளிவின்மை அடிக்குறிப்பில் தரப்பட்டுள்ளது.
