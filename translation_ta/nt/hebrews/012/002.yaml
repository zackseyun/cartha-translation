source:
  edition: SBLGNT
  text: ἀφορῶντες εἰς τὸν τῆς πίστεως ἀρχηγὸν καὶ τελειωτὴν Ἰησοῦν, ὃς ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς ὑπέμεινεν σταυρὸν αἰσχύνης καταφρονήσας, ἐν δεξιᾷ τε τοῦ θρόνου τοῦ θεοῦ κεκάθικεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/002.yaml
  text: fixing our eyes on Jesus[a], the pioneer and perfecter of faith, who for the joy set before him endured the cross, despising the shame[b], and has sat down at the right hand of the throne of God.
translation:
  language: ta
  text: நம்பிக்கையின் முன்னோடியும் நிறைவுசெய்கிறவருமான இயேசுவின்மேல் நம் பார்வையைப் பதிப்போம்.[a] அவர் தமக்கு முன் வைக்கப்பட்டிருந்த மகிழ்ச்சியை முன்னிட்டு, அவமானத்தைப் பொருட்படுத்தாமல் சிலுவையைச் சகித்தார்; மேலும் கடவுளுடைய அரியணையின் வலப்பக்கத்தில் அமர்ந்திருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விசுவாசத்தன்மையின் முன்னோடியும் நிறைவுசெய்கிறவருமான இயேசுவின்மேல்”; அல்லது, “நமது நம்பிக்கையின் முன்னோடியும் நிறைவுசெய்கிறவருமான இயேசுவின்மேல்.” கிரேக்கத் தொடர் சுருக்கமானது; πίστις என்பது “விசுவாசத்தன்மை” என்றும், குறிப்பாக விசுவாசிகளின் நம்பிக்கையைக் குறிப்பதாகவும் புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀφορῶντες
  choice: நம் பார்வையைப் பதிப்போம்
  rationale: வேறு கவனச்சிதறல்களிலிருந்து பார்வையைத் திருப்பி ஒருவர்மேல் நிலையாகச் செலுத்தும் பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது. சூழலிலுள்ள அறிவுறுத்தலுடன் பொருந்துமாறு வினையெச்சம் முதன்மை வினையாக வழங்கப்பட்டுள்ளது.
- source_word: ἀρχηγὸν
  choice: தொடங்கி வழிநடத்துகிறவர்
  rationale: தொடக்கத்தை ஏற்படுத்துபவர், முன்னோடியாக வழிநடத்துபவர் ஆகிய இரு நுண்பொருள்களையும் காக்கிறது; ‘ஆசிரியர்’ என்பது இச்சூழலின் பாதை திறக்கும் உருவகத்தைத் தெளிவாகத் தராது.
- source_word: τελειωτὴν
  choice: நிறைவுசெய்கிறவர்
  rationale: ஒன்றை அதன் நோக்கத்திற்குரிய முழுமைக்குக் கொண்டுவருபவர் என்ற பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: τῆς πίστεως
  choice: நம்பிக்கையை
  rationale: கிரேக்கத்தின் சுருக்கமான தொடரை தேவையின்றி ‘நமது’ என்று விரிவாக்காமல் πίστις என்பதன் முதன்மைப் பொருளைக் காக்கிறது; இலக்கு மொழியின் இயல்புக்காக வேற்றுமை உருபு மாற்றப்பட்டுள்ளது.
- source_word: ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς
  choice: தமக்கு முன் வைக்கப்பட்டிருந்த மகிழ்ச்சியை முன்னிட்டு
  rationale: எதிரே வைக்கப்பட்டிருந்த மகிழ்ச்சி சிலுவையைச் சகிப்பதற்கான நோக்குவிசையாக இருந்தது என்ற சூழல்சார் பொருளைக் காட்டுகிறது; ‘மகிழ்ச்சிக்குப் பதிலாக’ என்ற சாத்தியத்தைத் தேவையின்றி முதன்மைப்படுத்தவில்லை.
- source_word: ὑπέμεινεν σταυρὸν
  choice: சிலுவையைச் சகித்தார்
  rationale: துன்பத்தின் கீழ் உறுதியாக நிலைத்திருத்தல் என்ற வினையின் வலிமையையும் இயேசுவின் குறிப்பிட்ட சிலுவை மரணத்தையும் சுருக்கமாகத் தருகிறது.
- source_word: αἰσχύνης καταφρονήσας
  choice: அவமானத்தைப் பொருட்படுத்தாமல்
  rationale: அவமானத்தைத் தீர்மானிக்கும் சக்தியுடையதாகக் கருதாமல் சிறிதாக மதித்தார் என்ற பொருளை இயல்பாகத் தருகிறது; அவமானமே நல்லது என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: ἐν δεξιᾷ ... τοῦ θρόνου τοῦ θεοῦ
  choice: கடவுளுடைய அரியணையின் வலப்பக்கத்தில்
  rationale: உயர்ந்த மரியாதை மற்றும் அதிகாரத்தின் இடத்தைக் குறிக்கும் உருவகத்தையும் கிரேக்க உறவுத்தொடரையும் காக்கிறது.
- source_word: κεκάθικεν
  choice: அமர்ந்திருக்கிறார்
  rationale: முடிவுற்ற செயலும் தொடர்ந்து நிலவும் அதன் விளைவும் ஆகிய கிரேக்க நிறைவுக்கால நுண்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: τῆς πίστεως என்பதன் பொருள்
  choice: இயேசு நம்பிக்கையைத் தொடங்கி வழிநடத்தி நிறைவுசெய்கிறவர்
  alternative: இயேசு உண்மைத்தன்மையின் முன்னோடியும் நிறைவுசெய்கிறவரும்; அல்லது நமது நம்பிக்கையைத் தொடங்கி நிறைவுசெய்கிறவர்
  rationale: கிரேக்கத் தொடர் சுருக்கமானதும் ஒன்றுக்கு மேற்பட்ட தொடர்புகளை அனுமதிப்பதும் ஆகும். மூலத்தில் இல்லாத ‘நமது’ என்பதை முதன்மை உரையில் சேர்க்காமல், ‘உண்மைத்தன்மை’ என்ற சாத்தியத்தையும் அடிக்குறிப்பில் காக்கிறது.
- issue: ἀντὶ என்பதன் தொடர்பு
  choice: முன் வைக்கப்பட்ட மகிழ்ச்சியை நோக்குவிசையாகக் கொண்டு சிலுவையைச் சகித்தார்
  alternative: தமக்கு முன் இருந்த மகிழ்ச்சியை ஏற்றுக்கொள்வதற்குப் பதிலாக சிலுவையைச் சகித்தார்
  rationale: சகிப்புடன் முன் வைக்கப்பட்ட இலக்கை நோக்கும் அத்தியாயச் சூழல், வரவிருக்கும் மகிழ்ச்சியை முன்னிட்டு துன்பத்தைச் சகித்தார் என்ற வாசிப்பை வலுப்படுத்துகிறது; மாற்று வாசிப்பு இலக்கண ரீதியாகச் சாத்தியமானாலும் சூழலில் குறைவாகப் பொருந்துகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. ‘முன்னோடி’ என்ற பெயர்ச்சொல் மட்டும் ἀρχηγός என்பதன் தொடக்குவிப்பையும் வழிநடத்தலையும் முழுமையாக வெளிப்படுத்தாததால், ‘தொடங்கி வழிநடத்துகிறவர்’ என வினைத்தொடர் பயன்படுத்தப்பட்டது. வசனம் முந்தைய வாக்கியத்தோடு இலக்கண ரீதியாக இணைந்திருந்தாலும் தனி வசனமாக வாசிக்கத் தெளிவாக ‘பதிப்போம்’ என அறிவுறுத்தல் வடிவம் பயன்படுத்தப்பட்டது.
