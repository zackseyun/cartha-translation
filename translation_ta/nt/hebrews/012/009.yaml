reference: Hebrews 12:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἶτα τοὺς μὲν τῆς σαρκὸς ἡμῶν πατέρας εἴχομεν παιδευτὰς καὶ ἐνετρεπόμεθα· οὐ ⸀πολὺ μᾶλλον ὑποταγησόμεθα τῷ πατρὶ τῶν πνευμάτων καὶ ζήσομεν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/009.yaml
  text: Furthermore[a], we had our earthly fathers as disciplinarians, and we respected them[c][b]. Shall we not much more submit to the Father of spirits and live?
translation:
  language: ta
  text: மேலும், நமது மனிதத் தந்தைகள்[a] நம்மை ஒழுக்கப்படுத்துபவர்களாக[b] இருந்தார்கள்; அவர்களுக்கு நாம் மரியாதை செலுத்தினோம். அப்படியானால், ஆவிகளின் தந்தைக்கு[c] மிக அதிகமாகக் கீழ்ப்படிந்து வாழ்வோமல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘நமது மாம்சத்தின் தந்தைகள்.’'
    reason: lexical_alternative
  - marker: b
    text: 'வேறு வகையில்: ‘நம்மை ஒழுக்கப்படுத்தியவர்கள்.’'
    reason: lexical_alternative
  - marker: c
    text: ‘ஆவிகளின் தந்தை’ என்பது, மனிதத் தந்தைகளுக்கு மாறாக, குறிப்பாக ‘நமது ஆவிகளின் தந்தை’ என்று பொருள்படலாம்; ஆனால் கிரேக்கச் சொற்றொடர் இதைவிட விரிவானதாக உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶτα
  choice: மேலும்
  rationale: இது வெறும் காலவரிசையைக் குறிக்காமல், குறைவான ஒன்றிலிருந்து மேலான ஒன்றை வலியுறுத்தும் அடுத்த காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: τῆς σαρκὸς ἡμῶν πατέρας
  choice: நமது மனிதத் தந்தைகள்
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘நமது மாம்சத்தின் தந்தைகள்.’ இங்கு σάρξ பாவ இயல்பைக் குறிக்காமல், உடல்சார்ந்த மனிதப் பிறப்பையும் தந்தையரையும் குறிக்கிறது; ‘மனிதத் தந்தைகள்’ என்பது இயல்பான தமிழில் அந்தப் பொருளைத் தருகிறது.
- source_word: παιδευτὰς
  choice: நம்மை ஒழுக்கப்படுத்துபவர்களாக
  rationale: பெற்றோர் அளிக்கும் கண்டிப்பு, திருத்தம், பயிற்சி ஆகியவற்றை உள்ளடக்கும் παιδεία சொற்குடும்பத்தின் பொருளை ‘ஒழுக்கப்படுத்துதல்’ தெளிவாகக் காட்டுகிறது.
- source_word: ἐνετρεπόμεθα
  choice: நாம் அவர்களை மதித்து நடந்தோம்
  rationale: இச்சூழலில் தந்தையரின் ஒழுக்கப்படுத்துதலுக்கு அவர்கள் காட்டிய மரியாதையான அணுகுமுறையைக் குறிக்கிறது; பயம் அல்லது பிரமிப்பு என்ற வலுவான பொருளைத் தேவையின்றி சேர்க்கவில்லை.
- source_word: οὐ πολὺ μᾶλλον
  choice: இன்னும் எவ்வளவோ அதிகமாக ... வாழ்வோமல்லவா?
  rationale: குறைவான எடுத்துக்காட்டிலிருந்து மேலான முடிவுக்கு அழைக்கும் வலியுறுத்தலையும் கிரேக்க வினாவாக்கத்தின் எதிர்பார்க்கப்படும் உடன்பாட்டு விடையையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: ὑποταγησόμεθα
  choice: கீழ்ப்படிந்து
  rationale: இங்குள்ள எதிர்காலச் செயல்பாட்டு கருத்தை இயல்பான தமிழில் விருப்பத்துடன் அதிகாரத்துக்கு உட்படுவதாக வெளிப்படுத்துகிறது.
- source_word: τῷ πατρὶ τῶν πνευμάτων
  choice: ஆவிகளின் தந்தைக்கு
  rationale: ‘நமது ஆவிகளின் தந்தை’ என்று குறுக்காமல், கிரேக்கத்தின் விரிவான உடைமைத் தொடர்பையும் மனிதத் தந்தைகளுடனான எதிர்மறை ஒப்பீட்டையும் தக்கவைக்கிறது.
- source_word: ζήσομεν
  choice: வாழ்வோமல்லவா?
  rationale: எதிர்கால/விளைவு உணர்வையும் வினாவின் வலியுறுத்தலையும் சுருக்கமாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘ஆவிகளின் தந்தை’ என்பதன் பரப்பு
  choice: தேவனை ‘ஆவிகளின் தந்தை’ என்று கிரேக்கத்தில் உள்ளபடியே விரிவாகக் குறிப்பிடுதல்
  alternative: குறிப்பாக ‘நமது ஆவிகளின் தந்தை’ அல்லது பொதுவாக ‘ஆவிக்குரிய உயிர்களின் தந்தை’ என்று விளக்குதல்
  rationale: உடனடிச் சூழல் மனிதத் தந்தைகளையும் தேவனையும் வேறுபடுத்தினாலும், ‘ஆவிகளின்’ என்ற சொற்றொடர் யாருடைய ஆவிகள் என்பதைத் தெளிவாகக் குறுக்கவில்லை. ஆகவே அதன் உண்மையான இறையியல் பரப்பு தீர்மானிக்கப்படாமல் பாதுகாக்கப்படுகிறது.
- issue: கீழ்ப்படிதலுக்கும் வாழ்வுக்கும் உள்ள தொடர்பு
  choice: ‘கீழ்ப்படிந்து வாழ்வோமல்லவா?’ என்று இரு வினைகளையும் இணைத்தல்
  alternative: ‘கீழ்ப்படிந்தால் வாழ்வோம்’ என்று வெளிப்படையான நிபந்தனை–விளைவு உறவாக மாற்றுதல்
  rationale: கிரேக்கம் இரண்டு வினைகளையும் ‘மற்றும்’ என இணைக்கிறது; நிபந்தனைச் சொல்லைச் சேர்க்காமல், கீழ்ப்படிதலுக்கும் வாழ்வுக்கும் உள்ள நெருங்கிய தொடர்பைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘சிட்சை’ போன்ற பழமையான சமயச் சொற்களைத் தவிர்த்து, சூழலின் கண்டிப்பு–பயிற்சி உணர்வை ‘ஒழுக்கப்படுத்துதல்’ மூலம் தெரிவித்துள்ளது. வலியுறுத்தும் வினாவை ‘வாழ்வோமல்லவா?’ என இயல்பாக வடிவமைத்துள்ளது.
