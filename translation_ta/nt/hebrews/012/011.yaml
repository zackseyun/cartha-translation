source:
  edition: SBLGNT
  text: πᾶσα ⸀δὲ παιδεία πρὸς μὲν τὸ παρὸν οὐ δοκεῖ χαρᾶς εἶναι ἀλλὰ λύπης, ὕστερον δὲ καρπὸν εἰρηνικὸν τοῖς δι’ αὐτῆς γεγυμνασμένοις ἀποδίδωσιν δικαιοσύνης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/011.yaml
  text: All discipline seems for the present to be not joy but sorrow[a]; yet later it yields the peaceful fruit of righteousness to those who have been trained by it.
translation:
  language: ta
  text: எல்லா ஒழுக்கப் பயிற்சியும் தற்போதைக்கு மகிழ்ச்சிக்குரியதாக அல்ல, துயரத்துக்குரியதாகவே தோன்றுகிறது. ஆனால் பின்னர், அதன் மூலம் பயிற்சி பெற்றவர்களுக்கு நீதியின்[a] அமைதியான கனியை அது அளிக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீதி.” கிரேக்கச் சொல் ‘நீதி’ அல்லது ‘நேர்மையான நிலை’ என்பதைக் குறிக்கலாம்; இங்கு தேவனுடைய ஒழுக்கப் பயிற்சியால் உருவாகும் நேர்மையான நிலையை இது பெரும்பாலும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεία
  choice: ஒழுக்கப் பயிற்சி
  rationale: எபிரெயர் 12-ன் பெற்றோர்–பிள்ளைச் சூழலில், திருத்துதல், கண்டித்தல், பயிற்றுவித்தல் ஆகியவற்றை உள்ளடக்கும் வளர்ச்சிநோக்குடைய செயலையே இச்சொல் குறிக்கிறது; வெறும் தண்டனை என்று சுருக்கவில்லை.
- source_word: πρὸς μὲν τὸ παρὸν
  choice: தற்போதைக்கு
  rationale: இப்போதைய அனுபவத்தைப் பின்னர் கிடைக்கும் விளைவோடு எதிரெதிராக நிறுத்தும் காலப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: οὐ δοκεῖ
  choice: தோன்றுகிறது
  rationale: அது உண்மையில் என்ன என்பதைக் காட்டிலும், அதை அனுபவிப்பவரின் அப்போதைய பார்வையைச் சுட்டும் மூலமொழிப் பொருளைப் பேணுகிறது.
- source_word: χαρᾶς ... ἀλλὰ λύπης
  choice: மகிழ்ச்சிக்குரியதாக அல்ல, துயரத்துக்குரியதாகவே
  rationale: மூலத்தில் உள்ள ‘மகிழ்ச்சி’ மற்றும் ‘துயரம்’ என்னும் பெயர்ச்சொற்களின் எதிர்மறை அமைப்பைப் பேணியபடி தமிழில் இயல்பாக அமைக்கிறது.
- source_word: ὕστερον
  choice: பின்னர்
  rationale: தற்கால அனுபவத்துக்குப் பிறகு வரும் விளைவைத் தெளிவாகக் குறிக்கிறது.
- source_word: καρπὸν εἰρηνικὸν
  choice: அமைதியான கனி
  rationale: ‘அமைதிக்குரிய/அமைதி நிறைந்த’ தன்மை நேரடியாகக் ‘கனி’யை விவரிப்பதைப் பேணுகிறது; ‘அமைதியை உண்டாக்கும்’ என்று காரணப் பொருளை கூடுதலாகச் சேர்க்கவில்லை.
- source_word: γεγυμνασμένοις
  choice: பயிற்சி பெற்றவர்களுக்கு
  rationale: தொடர்ச்சியான செயல்முறையால் வடிவமைக்கப்பட்டவர்களைக் குறிக்கும் நிறைவுற்ற செயப்பாட்டு வடிவத்தையும், γυμνάζω சொல்லின் பயிற்சி உருவகத்தையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἀποδίδωσιν
  choice: அளிக்கிறது
