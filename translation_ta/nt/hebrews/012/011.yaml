- source_word: δικαιοσύνης
  choice: நீதிநிலையின்
  rationale: இங்கு தேவனுடைய ஒழுக்கப் பயிற்சியால் உருவாகும் நேர்மையான வாழ்வு அல்லது சரியான நிலையை ‘நீதிநிலை’ தெளிவாகக் காட்டுகிறது; ‘நீதி’ என்ற மாற்று பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: விசுவாசிகளிடம் தேவன் செயல்படும் சூழலில் παιδεία என்பதன் பொருள்
  choice: திருத்துதலையும் பயிற்றுவித்தலையும் உள்ளடக்கும் வளர்ச்சிநோக்குடைய ஒழுக்கப் பயிற்சி
  alternative: தண்டனை மட்டும்; போதனை மட்டும்
  rationale: எபிரெயர் 12:5–10 இதைத் தந்தை பிள்ளையை வளர்க்கும் சூழலில் அமைக்கிறது. ஆகவே அன்பான திருத்துதலுக்கும் வளர்ச்சிக்கான பயிற்சிக்கும் இடமளிக்கிறது; வெறும் பழிவாங்கும் தண்டனையாக மாற்றவில்லை.
- issue: δικαιοσύνης என்பதன் பொருள்
  choice: நீதிநிலை
  alternative: நீதி
  rationale: இவ்வசனத்தில் ஒழுக்கப் பயிற்சியால் விளையும் நேர்மையான நிலை அல்லது வாழ்வு முதன்மையாகத் தெரிகிறது. இருந்தாலும் ‘நீதி’ என்ற பொருளையும் அடிக்குறிப்பில் திறந்துவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஒழுக்கப் பயிற்சி’ என்பது தண்டனை என்ற குறுகிய பொருளைத் தவிர்த்து, திருத்துதல் மற்றும் பயிற்றுவித்தல் ஆகிய இரண்டையும் உள்ளடக்குகிறது. மூலத்தில் இல்லாத தொடக்கக் காலச் சொல்லோ உரையாடல் இணைப்போ சேர்க்கப்படவில்லை.
