id: HEB.12.15
reference: Hebrews 12:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐπισκοποῦντες μή τις ὑστερῶν ἀπὸ τῆς χάριτος τοῦ θεοῦ, μή τις ῥίζα πικρίας ἄνω φύουσα ἐνοχλῇ καὶ ⸂δι’ αὐτῆς⸃ μιανθῶσιν ⸀πολλοί,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/015.yaml
  text: watching carefully lest anyone fall short of the grace of God[a], lest any root of bitterness springing up cause trouble, and through it many be defiled[b],
translation:
  language: ta
  text: எவரும் கடவுளுடைய கிருபையைப் பெறத் தவறிவிடாதபடியும்[a], கசப்பின் வேர் ஒன்று முளைத்தெழுந்து தொல்லை விளைவிக்காதபடியும், அதன் மூலம் பலர் தீட்டுப்படாதபடியும் கவனமாகப் பார்த்துக்கொள்ளுங்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளுடைய கிருபையை அடையத் தவறாதபடி.” கிரேக்கச் சொற்றொடர், வழங்கப்படுவதைப் பெறாமல் போதலையும் அதற்குக் குறைவுபடுதலையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “கசப்பின் வேர்” என்பது உபாகமம் 29:18-ஐ எதிரொலிப்பதாக இருக்கலாம். அங்கு நச்சான வேர், உடன்படிக்கைக்கு உண்மையற்ற நிலை சமூகத்திற்குள் பரவுவதைக் குறிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισκοποῦντες
  choice: கவனமாகப் பார்த்துக்கொள்ளுங்கள்
  rationale: தொடர்ந்து விழிப்புடன் கண்காணிக்கும் பங்கேற்புச் செயலை இயல்பான தமிழ் கட்டளை வடிவில் வெளிப்படுத்துகிறது; சூழலில் உள்ள சமூகப் பொறுப்பையும் காக்கிறது.
- source_word: μή τις ὑστερῶν ἀπὸ τῆς χάριτος τοῦ θεοῦ
  choice: ஒருவரும் கடவுளுடைய கிருபையை அடையத் தவறாதபடி
  rationale: ὑστερέω ἀπό என்பதன் ‘வழங்கப்பட்டதை அடையாமல் போதல்’ அல்லது ‘குறைவுபடுதல்’ என்ற சாத்தியங்களை கருத்தில் கொண்டு, எச்சரிக்கையின் வலிமையைத் தக்கவைக்கிறது; மாற்றுச் சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: χάριτος
  choice: கிருபை
  rationale: தமிழ் வேதாகம வழக்கில் பரவலாக அறியப்படும் சொல்லாக இருந்து, இங்கு உள்ள இறையியல் மற்றும் உடன்படிக்கை சார்ந்த ஒலிப்பைத் தக்கவைக்கிறது.
- source_word: ῥίζα πικρίας
  choice: கசப்பின் வேர்
  rationale: கிரேக்க உரையின் உரியுடைமைத் தொடரை நெருக்கமாகக் காத்து, உபாகமம் 29:18-ன் உருவக ஒலிப்பையும் பாதுகாக்கிறது.
- source_word: ἄνω φύουσα
  choice: முளைத்தெழுந்து
  rationale: மேலெழுந்து வளரத் தொடங்கும் வேரின் உயிருள்ள உருவகத்தை இயல்பான தமிழில் தருகிறது.
- source_word: ἐνοχλῇ
  choice: தொல்லை உண்டாக்கு
  rationale: தனிநபரையும் சமூகத்தையும் கலக்கி இடையூறு விளைவிக்கும் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: δι’ αὐτῆς
  choice: அதன் மூலம்
  rationale: பெண்பால் சுட்டுப்பெயர் மிக இயல்பாக ‘வேர்’ என்பதைக் குறிப்பதால், διά-வின் கருவிப் பொருளைத் தக்கவைக்கிறது.
- source_word: μιανθῶσιν πολλοί
  choice: பலர் தீட்டுப்படாதபடி
  rationale: μιαίνω என்பதன் ஒழுக்க மற்றும் சடங்கு சார்ந்த தீட்டின் வலிமையை மெலிதாக்காமல், பலருக்கு பரவும் விளைவைத் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘கடவுளுடைய கிருபையை அடையத் தவறுதல்’ என்பது இரட்சிப்பை இழத்தல், கிருபையைப் பெறத் தவறுதல், அல்லது சமூகத்திலிருந்து விலகுதல் ஆகியவற்றில் எதைக் குறிக்கிறது?
  choice: கிருபையை அடையத் தவறாதபடி
  alternative: கிருபையிலிருந்து குறைவுபடாதபடி
  rationale: கிரேக்கச் சொற்றொடர் அடையாமல் போதலையும் குறைவுபடுதலையும் அனுமதிக்கிறது. வசனம் தீர்மானிக்காத பிற்கால கோட்பாட்டு விவாதத்தை மொழிபெயர்ப்பு தீர்த்து வைக்காமல், எச்சரிக்கையையும் தெளிவையும் காக்கிறது.
- issue: μιαίνω என்பதைக் வெறும் சமூகத் தொல்லையாக மென்மைப்படுத்தலாமா?
  choice: தீட்டுப்படுதல்
  alternative: கெடுக்கப்படுதல்
  rationale: இந்த வினை ஒழுக்க அல்லது சடங்கு சார்ந்த மாசுபாட்டைக் குறிக்கும் வலுவான வேதாகம மொழியைக் கொண்டது; ‘தீட்டுப்படுதல்’ அந்தத் தீவிரத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘கிருபை’, ‘தீட்டுப்படுதல்’ போன்ற பரிச்சயமான வேதாகமச் சொற்கள் மூலத்தின் இறையியல் தீவிரத்தைப் பாதுகாக்கப் பயன்படுத்தப்பட்டுள்ளன; வாக்கியத்தின் மூன்று எச்சரிக்கைகளும் தெளிவாக இணைக்கப்பட்டுள்ளன.
