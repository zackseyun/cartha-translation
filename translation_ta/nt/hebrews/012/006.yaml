source:
  edition: SBLGNT
  text: ὃν γὰρ ἀγαπᾷ κύριος παιδεύει, μαστιγοῖ δὲ πάντα υἱὸν ὃν παραδέχεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/006.yaml
  text: For the Lord disciplines the one he loves[b][a], and he scourges every son whom he receives.
translation:
  language: ta
  text: ஏனெனில், ஆண்டவர் தாம் அன்புகூருகிறவனை ஒழுக்கப்படுத்துகிறார்; தாம் ஏற்றுக்கொள்ளும் ஒவ்வொரு மகனையும்[b] சாட்டையால் அடிக்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கசையால் அடிக்கிறார்” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினை வலுவானது; அது கடுமையான ஒழுக்கப்படுத்துதலைச் சித்தரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “ஒவ்வொரு மகனையும்” என்பது கிரேக்கச் சொற்றொடரைப் பிரதிபலிக்கிறது; இச்சூழலில் அது கடவுள் தமது பிள்ளைகளாக அங்கீகரிக்கும் அனைவரையும் பிரதிநிதித்துவமாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: தாம் அன்புகூருகிறவனை / தாம் ஏற்றுக்கொள்ளும்
  rationale: இரு இடங்களிலும் வரும் உறவுப்பெயரின் ஒருமைத் தனிப்பட்ட குறிப்பை இயல்பான தமிழில் காக்கிறது; முதலாவது இடத்தில் வினையின் செயப்படுபொருளாகவும், இரண்டாவது இடத்தில் ‘மகன்’ என்பதை விளக்கும் உறவுத்தொடராகவும் அமைக்கப்பட்டுள்ளது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் விளக்க வலிமையைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἀγαπᾷ
  choice: அன்புகூருகிற
  rationale: ἀγαπάω என்பதன் இயல்பான, கண்ணியமான நவீனத் தமிழ் இணை; தொடரும் ஒழுக்கப்படுத்துதலோடு அன்பின் தொடர்பைக் காக்கிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: κύριος என்ற பட்டத்துக்கான வழக்கமான, கண்ணியமான தமிழ் மொழிபெயர்ப்பு.
- source_word: παιδεύει
  choice: ஒழுக்கப்படுத்துகிறார்
  rationale: வெறும் தண்டனையை மட்டும் அல்லாமல், திருத்தி உருவாக்கும் பயிற்சியையும் உள்ளடக்கும் παιδεύω என்பதன் பொருளைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: μαστιγοῖ
  choice: சாட்டையால் அடிக்கிறார்
  rationale: சாட்டையால் அடித்தல் அல்லது கசையடித்தல் என்ற வலுவான உருவகத்தை மென்மையாக்காமல், இன்றைய வாசகருக்குத் தெளிவாகத் தருகிறது.
- source_word: δὲ
  choice: ;
  rationale: தமிழில் இரண்டாவது இணை வாக்கியத்தை அரைப்புள்ளியால் தொடர்வது இயல்பாக உள்ளது; கிரேக்க δέ இங்கு வலுவான எதிர்மறையைக் காட்டாமல் தொடர்ச்சியை அளிக்கிறது.
- source_word: πάντα υἱὸν
  choice: ஒவ்வொரு மகனையும்
  rationale: கிரேக்கத்தின் ஒருமை ஆண்பால் வடிவத்தையும், எபிரெயர் 12-இல் மையமான மகனுறவு உருவகத்தையும் காக்கிறது; அதன் பிரதிநிதித்துவப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: παραδέχεται
  choice: ஏற்றுக்கொள்ளும்
  rationale: ஒருவரை அங்கீகரித்து உறவுக்குள் ஏற்றுக்கொள்ளும் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தெய்வீக ஒழுக்கப்படுத்துதலின் சூழலில் υἱός என்ற மகனுறவுச் சொல்லை மொழிபெயர்த்தல்
  choice: ஒவ்வொரு மகனையும்
  alternative: ஒவ்வொரு பிள்ளையையும்
  rationale: மூலத்தில் உள்ள ஆண்பால் ஒருமையையும் சூழலின் மகனுறவு உருவகத்தையும் முதன்மை உரை காக்கிறது. இது கடவுளுடைய பிள்ளைகள் அனைவரையும் பிரதிநிதித்துவமாகக் குறிக்கும் என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: அன்பும் கடுமையான ஒழுக்கப்படுத்துதலும் இடையிலான பதற்றத்தில் μαστιγοῖ என்பதன் வலிமை
  choice: சாட்டையால் அடிக்கிறார்
  alternative: கடுமையாக ஒழுக்கப்படுத்துகிறார்
  rationale: மூலத்தின் கடுமையான வினையை மென்மையாக்காமல் அதன் உருவகத்தை நேரடியாகக் காக்கிறது; ஆண்டவரின் அன்புக்கும் வேதனையளிக்கும் ஒழுக்கப்படுத்துதலுக்கும் இடையிலான இறையியல் பதற்றத்தைத் தீர்த்து விடாமல் அப்படியே நிறுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘ஒழுக்கப்படுத்துகிறார்’ என்பது வளர்க்கும் திருத்தத்தை வெளிப்படுத்துகிறது; ‘சாட்டையால் அடிக்கிறார்’ என்பது மூலத்தின் கடுமையை மறைக்காமல் தெளிவாகக் காக்கிறது. ‘மகன்’ என்ற சொல் சூழலின் மகனுறவு உருவகத்துக்காகப் பாதுகாக்கப்பட்டு, அதன் உள்ளடக்கமான பிரதிநிதித்துவப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
