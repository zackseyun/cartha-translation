id: HEB.12.19
reference: Hebrews 12:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ σάλπιγγος ἤχῳ καὶ φωνῇ ῥημάτων, ἧς οἱ ἀκούσαντες παρῃτήσαντο ⸀μὴ προστεθῆναι αὐτοῖς λόγον·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/019.yaml
  text: and to the sound of a trumpet and to a voice of words[b][a], whose hearers begged that no further word be spoken to them.
translation:
  language: ta
  text: எக்காளத்தின் ஒலிக்கும், வார்த்தைகள் பேசப்பட்ட குரலுக்கும்[a][b] நீங்கள் வரவில்லை. அந்தக் குரலைக் கேட்டவர்கள், தங்களிடம் இனி மேலும் எந்த வார்த்தையும் பேசப்படக் கூடாது என்று வேண்டிக்கொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதைக் கேட்டவர்கள், தங்களிடம் இனி எந்த வார்த்தையும் பேசப்படக் கூடாது என்று வேண்டிக்கொண்டார்கள்.” இங்கு உறவுப்பெயர் குறிப்பாக ‘குரலை’ மட்டுமல்லாமல், சினாய் மலையில் நிகழ்ந்த முழு வெளிப்பாட்டையும் குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: கடவுளின் குரலை இனி நேரடியாகக் கேட்க வேண்டாம் என்று இஸ்ரயேலர் வேண்டியதைப் பற்றி யாத்திராகமம் 20:18–19; உபாகமம் 5:23–27 ஆகியவற்றைப் பார்க்கவும்.
    reason: cross_reference
lexical_decisions:
- source_word: σάλπιγγος ἤχῳ
  choice: எக்காளத்தின் ஒலி
  rationale: ἦχος குறிக்கும் கேட்கக்கூடிய ஒலியை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; ஒலியின் தீவிரத்தைத் தேவையின்றி மிகைப்படுத்தவில்லை.
- source_word: φωνῇ ῥημάτων
  choice: சொற்களை உரைத்த குரல்
  rationale: வெறும் சத்தமல்ல, புரிந்துகொள்ளத்தக்க சொற்களைக் கொண்ட பேச்சுக் குரல் என்பதைக் காட்டுகிறது. கிரேக்கத்தின் வழக்கத்திற்கு மாறான சொற்றொடரை முற்றிலும் சமப்படுத்தாமல், இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἧς
  choice: அந்தக் குரலை
  rationale: பெண்பால் ஒருமை உறவுப்பெயர் மிக அருகிலுள்ள φωνῇ என்பதையே முதன்மையாகச் சுட்டுகிறது. தமிழில் தொடர்பைத் தெளிவாகக் காட்ட பெயர்ச்சொல் மீண்டும் பயன்படுத்தப்பட்டுள்ளது; பரந்த சினாய் நிகழ்வைக் குறிக்கும் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: οἱ ἀκούσαντες
  choice: கேட்டவர்கள்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் இறந்தகாலப் பங்கேற்புவினையின் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: παρῃτήσαντο
  choice: கெஞ்சினார்கள்
  rationale: மேலும் நேரடியாகப் பேசப்படுவதிலிருந்து தங்களை விலக்கும்படி இஸ்ரயேலர் தீவிரமாக வேண்டிய சூழலை வெளிப்படுத்துகிறது; வெறுமனே ‘மறுத்தார்கள்’ என்ற பொருளில் குறுக்கவில்லை.
- source_word: μὴ προστεθῆναι αὐτοῖς λόγον
  choice: தங்களிடம் இனி எந்த வார்த்தையும் பேசப்படக் கூடாது
  rationale: προστεθῆναι என்பதிலுள்ள ‘மேலும் தொடர்தல்’ என்ற கருத்தையும், λόγον என்பதிலுள்ள ‘வார்த்தை’ என்ற பொருளையும், செயலப்பாட்டு அமைப்பையும் தெளிவான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: ἧς என்ற உறவுப்பெயரின் சுட்டுப்பொருள்
  choice: முதன்மையாக ‘சொற்களை உரைத்த குரல்’ என்பதைக் குறிக்கிறது.
  alternative: எக்காள ஒலியும் குரலும் உட்பட சினாய் மலையின் முழு அச்சமூட்டும் வெளிப்பாட்டைக் குறிக்கலாம்.
  rationale: இலக்கணப்படி அருகிலுள்ள பெண்பால் ஒருமைச் சொல் φωνῇ இயல்பான முன்னிடைச் சொல். ஆயினும், சூழலில் மக்கள் முழு சினாய் வெளிப்பாட்டிலிருந்தும் பின்வாங்கியதால் பரந்த சுட்டுப்பொருள் சாத்தியத்தை அடிக்குறிப்பு பதிவு செய்கிறது.
translation_notes:
  register: மொழிநடை நவீன, தரமான, பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க தமிழாக உள்ளது. வசனம் முந்தைய வசனத்தின் ‘நீங்கள் வரவில்லை’ என்ற வினையுடன் இலக்கண ரீதியாகத் தொடர்வதால், தமிழில் முழுமையான வாக்கியமாக அமைய அந்த வினை இங்கு வெளிப்படையாக மீட்டுரைக்கப்பட்டுள்ளது.
