revisions:
- from: எக்காளத்தின் ஒலிக்கும், சொற்களை உரைத்த குரலுக்கும்[a][b] நீங்கள் வரவில்லை. அந்தக் குரலைக் கேட்டவர்கள், தங்களிடம் இனி எந்த வார்த்தையும் பேசப்படக் கூடாது என்று கெஞ்சினார்கள்.
  to: எக்காளத்தின் ஒலிக்கும், வார்த்தைகள் பேசப்பட்ட குரலுக்கும்[a][b] நீங்கள் வரவில்லை. அந்தக் குரலைக் கேட்டவர்கள், தங்களிடம் இனி மேலும் எந்த வார்த்தையும் பேசப்படக் கூடாது என்று வேண்டிக்கொண்டார்கள்.
