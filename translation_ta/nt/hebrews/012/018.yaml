source:
  edition: SBLGNT
  text: Οὐ γὰρ προσεληλύθατε ⸀ψηλαφωμένῳ καὶ κεκαυμένῳ πυρὶ καὶ γνόφῳ καὶ ⸀ζόφῳ καὶ θυέλλῃ
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/018.yaml
  text: For you have not come to what can be touched[a], and to a blazing fire, and to darkness and gloom and storm[b],
translation:
  language: ta
  text: ஏனெனில், தொட்டுணரக்கூடியதற்கும்[a], கொழுந்துவிட்டு எரியும் நெருப்புக்கும், இருளுக்கும் காரிருளுக்கும் புயலுக்கும் நீங்கள் வந்து சேரவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தொட்டுணரக்கூடிய ஒரு மலைக்கும்.’ சுற்றியுள்ள சூழலில் சீனாய் மலையே குறிக்கப்படுகிறது; ஆனால் இவ்வசனத்தின் கிரேக்க உரையில் ‘மலை’ என்ற சொல் வெளிப்படையாக இல்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐ γὰρ
  choice: ஏனெனில் ... இல்லை
  rationale: γάρ முந்தைய கருத்தை விளக்கும் இணைப்பாக இருப்பதால் ‘ஏனெனில்’ எனவும், Οὐ வினையை மறுப்பதால் ‘இல்லை’ எனவும் மொழிபெயர்க்கப்பட்டது.
- source_word: προσεληλύθατε
  choice: நீங்கள் வந்து சேரவில்லை
  rationale: நெருங்கி வந்ததன் விளைவாக ஏற்பட்டுள்ள தற்போதைய நிலையை நிறைவுக்கால வடிவம் சுட்டுகிறது; ‘வந்து சேரவில்லை’ என்பது அந்த அணுகுதல் மற்றும் வருகை உருவகத்தை இயல்பான தமிழில் தருகிறது.
- source_word: ψηλαφωμένῳ
  choice: தொட்டுணரக்கூடியதற்கு
  rationale: இச்சொல் ‘தொடக்கூடியது’ அல்லது ‘தொட்டுணரக்கூடியது’ என்று பொருள்படும். இவ்வசனத்தின் கிரேக்கத்தில் ‘மலை’ என்ற பெயர்ச்சொல் இல்லாததால் அது முதன்மை உரையில் சேர்க்கப்படவில்லை.
- source_word: κεκαυμένῳ πυρί
  choice: கொழுந்துவிட்டு எரியும் நெருப்பு
  rationale: எரிந்துகொண்டிருக்கும் நிலையை நிறைவுப் பெயரெச்சம் தெரிவிக்கிறது; ‘கொழுந்துவிட்டு எரியும் நெருப்பு’ அதன் தீவிரத்தையும் தொடரும் எரிநிலையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: γνόφῳ
  choice: காரிருள்
  rationale: γνόφος அடர்ந்த இருளைக் குறிக்கிறது. அடுத்துள்ள ζόφος என்பதிலிருந்து வேறுபடுத்தவும், சொற்களின் திரட்சியைப் பேணவும் ‘காரிருள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: ζόφῳ
  choice: இருட்டு
  rationale: ζόφος மங்கலான, அச்சமூட்டும் இருட்டைக் குறிக்கிறது. γνόφος என்பதற்கு வழங்கப்பட்ட ‘காரிருள்’ என்பதுடன் பொருள் நெருக்கத்தையும் சொல் வேறுபாட்டையும் இது காக்கிறது.
- source_word: θυέλλῃ
  choice: புயல்
  rationale: θύελλα கடுமையான புயலைக் குறிக்கிறது; ‘புயல்’ என்பது தெளிவான, இன்றைய தமிழ்ச் சொல்.
theological_decisions:
- issue: அணுகப்பட்டதாகக் கூறப்படும் பொருளை ‘மலை’ என்று வெளிப்படையாகச் சேர்ப்பதா
  choice: முதன்மை உரையில் ‘மலை’ என்பதைச் சேர்க்காமல், குறிப்பிடப்படாத தொட்டுணரக்கூடிய ஒன்றாக மொழிபெயர்த்தல்
  alternative: ‘தொட்டுணரக்கூடிய ஒரு மலைக்கு நீங்கள் வந்து சேரவில்லை’
  rationale: சுற்றியுள்ள சூழலில் சீனாய் மலை குறிக்கப்படுவது தெளிவாக இருந்தாலும், இவ்வசனத்தின் கிரேக்க உரையில் ὄρει (‘மலை’) இடம்பெறவில்லை. எனவே மூலமொழியின் தெளிவின்மையை முதன்மை உரை காக்கிறது; சூழல்சார்ந்த அடையாளம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் தொடர்ச்சியான καί இணைப்புகள் ‘-க்கும்’ என்ற ஒரேநிலைப் பட்டியலால் காக்கப்பட்டுள்ளன. ‘மலை’ முதன்மை உரையில் சேர்க்கப்படாமல் மூலத்தின் இலக்கணத் தெளிவின்மை பேணப்பட்டுள்ளது.
