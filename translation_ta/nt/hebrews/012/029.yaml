  text: καὶ γὰρ ὁ θεὸς ἡμῶν πῦρ καταναλίσκον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/029.yaml
  text: For our God is a consuming fire[a][b].
translation:
  language: ta
  text: ஏனெனில் நம் கடவுள் எரித்தழிக்கும் நெருப்பு[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இது உபாகமம் 4:24-ஐ எதிரொலிக்கிறது; அங்கே கடவுள் “எரித்தழிக்கும் நெருப்பு” என்று விவரிக்கப்படுகிறார்.
    reason: cross_reference
  - marker: b
    text: அல்லது, “எரித்து அழிக்கும் நெருப்பு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: ஏனெனில்
  rationale: γὰρ முந்தைய வசனத்தின் எச்சரிக்கைக்கான காரணத்தை விளக்குகிறது. καὶ தனியாக மொழிபெயர்க்கப்படாமல், இயல்பான தமிழில் விளக்கத் தொடர்புக்குள் உள்ளடக்கப்பட்டுள்ளது.
- source_word: ὁ θεὸς ἡμῶν
  choice: நம் கடவுள்
  rationale: கிரேக்கத்தின் உடைமை மற்றும் சமூகச் சார்பை இயல்பான, சுருக்கமான தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: πῦρ
  choice: நெருப்பு
  rationale: உருவகத்தை விளக்கமாக மாற்றாமல் நேரடியாகத் தக்கவைக்கிறது; உபாகமம் 4:24-இன் எதிரொலியையும் பாதுகாக்கிறது.
- source_word: καταναλίσκον
  choice: அழித்துவிடும்
  rationale: இந்த நிகழ்காலச் செயப்பெயரெச்சம் நெருப்பு முற்றிலும் விழுங்கி அழிக்கும் செயலைக் குறிக்கிறது. 'அழித்துவிடும்' என்பது அதன் தீவிரத்தையும் இயல்பான நவீன தமிழையும் காக்கிறது; மாற்று இலக்கண வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: கடவுளை நெருப்பாகக் கூறும் உருவகம்
  choice: “நம் கடவுள் அழித்துவிடும் நெருப்பு” என்று உருவகத்தை நேரடியாகத் தக்கவைத்தல்
  alternative: “நம் கடவுள் அழித்துவிடும் நெருப்பைப் போன்றவர்” அல்லது “நம் கடவுள் அழிக்கும் ஒரு நெருப்பு”
  rationale: கிரேக்கத்தில் ஒப்புமையைக் குறிக்கும் சொல் இல்லை; ஆகவே உருவகத்தை உவமையாக மென்மைப்படுத்தவில்லை. நேரடியான சமன்பாட்டுக் கூற்று எச்சரிக்கையின் வலிமையையும் உபாகமம் 4:24 உடனான தொடர்பையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமானதும் கண்ணியமானதும் எச்சரிக்கைத் தொனியுடையதுமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் நேரடி உருவகமும் அதன் தீவிரமும் தக்கவைக்கப்பட்டுள்ளன.
