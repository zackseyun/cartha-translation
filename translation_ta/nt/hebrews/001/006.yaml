source:
  edition: SBLGNT
  text: ὅταν δὲ πάλιν εἰσαγάγῃ τὸν πρωτότοκον εἰς τὴν οἰκουμένην, λέγει· Καὶ προσκυνησάτωσαν αὐτῷ πάντες ἄγγελοι θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/006.yaml
  text: And when he again brings the Firstborn into the world[a], he says[b], “And let all God’s angels worship him.”
translation:
  language: ta
  text: மேலும், அவர் முதற்பேறானவரை மீண்டும் உலகத்திற்குள் கொண்டுவரும்போது[a], “தேவனுடைய தூதர்கள் அனைவரும்[b] அவரை வழிபடட்டும்” என்று சொல்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “மேலும், அவர் முதற்பேறானவரை உலகத்திற்குள் கொண்டுவரும்போது, ‘தேவனுடைய தூதர்கள் அனைவரும் அவரை வழிபடட்டும்’ என்று மீண்டும் சொல்கிறார்.” கிரேக்கத்தில் ‘மீண்டும்’ என்ற சொல் ‘கொண்டுவரும்போது’ என்பதையோ ‘சொல்கிறார்’ என்பதையோ சார்ந்து நிற்கலாம்.'
    reason: alternative_reading
  - marker: b
    text: அல்லது, “தேவனுடைய எல்லாத் தூதர்களும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: கொண்டுவரும்போது
  rationale: குறிப்பிட்ட ஒரு நிகழ்வைச் சுட்டும் காலத் துணைவாக்கியமாக இருப்பதால், ‘எப்போது எல்லாம்’ என்பதற்குப் பதிலாக இயல்பான ‘-ும்போது’ அமைப்பு பயன்படுத்தப்பட்டது.
- source_word: δὲ
  choice: மேலும்
  rationale: இது வலுவான எதிர்மறையை அல்ல, வாதத்தைத் தொடர்ந்து முன்னெடுக்கும் மென்மையான இணைப்பைக் குறிக்கிறது.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: முதன்மை உரையில் இது ‘கொண்டுவருகிறார்’ என்ற செயலோடு இணைக்கப்பட்டுள்ளது. ஆனால் இது ‘சொல்கிறார்’ என்பதோடும் இணையக்கூடிய உண்மையான இலக்கண இருபொருளை அடிக்குறிப்பு காக்கிறது.
- source_word: εἰσαγάγῃ
  choice: உலகத்திற்குள் கொண்டுவரும்போது
  rationale: ‘உள்ளே கொண்டுவருதல்’ என்ற அடிப்படைப் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὸν πρωτότοκον
  choice: முதற்பேறானவரை
  rationale: மகனைக் குறிக்கும் பட்டப்பெயரின் தன்மையையும், ‘முதற்பேறு’ என்பதிலுள்ள உறவு மற்றும் முதன்மை சார்ந்த பொருள் எதிரொலியையும் காக்கிறது.
- source_word: εἰς τὴν οἰκουμένην
  choice: உலகத்திற்குள்
  rationale: οἰκουμένη என்பதன் ‘குடியிருக்கும் உலகம்’ என்ற பரந்த பொருளை, தேவையற்ற சொல்லாக்கச் சுமையின்றி இயல்பாக அளிக்கிறது.
- source_word: λέγει
  choice: என்று சொல்கிறார்
  rationale: கிரேக்கத்தில் எழுவாய் வெளிப்படையாகக் குறிப்பிடப்படாதபோதும், சுற்றுப்பின்னணியில் அது தேவனைக் குறிக்கிறது; ‘வேதத்தில்’ போன்ற விளக்கச் சொற்கள் சேர்க்கப்படவில்லை.
- source_word: προσκυνησάτωσαν
  choice: வழிபடட்டும்
  rationale: கட்டளை அல்லது விருப்பக் கட்டளையின் வலிமையைத் தெளிவாகக் காட்டுகிறது. எபிரெயர் 1-ன் சூழலில் இது வெறும் மரியாதை செலுத்துவதைவிட ‘வழிபடுதல்’ என்று மொழிபெயர்ப்பதற்கு ஏற்றது.
- source_word: αὐτῷ
  choice: அவரை
  rationale: προσκυνέω வினையுடன் வரும் மறைமுக வேற்றுமையைத் தமிழில் இயல்பான நேரடிச் செயப்படுபொருளாக அளிக்கிறது.
- source_word: πάντες ἄγγελοι θεοῦ
  choice: தேவனுடைய தேவதூதர்கள் அனைவரும்
  rationale: தேவனோடு உள்ள உரிமை/சார்பு உறவையும் ‘அனைவரும்’ என்ற முழுமையையும் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: πάλιν என்பதன் இலக்கணத் தொடர்பு
  choice: ‘மீண்டும் கொண்டுவரும்போது’—πάλιν என்பது ‘கொண்டுவருகிறார்’ என்பதை மாற்றியமைக்கிறது.
  alternative: ‘மேலும் ... சொல்கிறார்’—πάλιν என்பது மேற்கோளை அறிமுகப்படுத்தும் ‘சொல்கிறார்’ என்பதை மாற்றியமைக்கிறது.
  rationale: கிரேக்கச் சொல் வரிசை இரு வாசிப்புகளுக்கும் இடமளிக்கிறது. முதன்மை உரை ‘கொண்டுவருகிறார்’ என்ற வாசிப்பை ஏற்றாலும், வேறுபட்ட மேற்கோள் அமைப்பை உருவாக்கும் மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- issue: மகனை நோக்கிய προσκυνέω என்பதன் வலிமை
  choice: வழிபடட்டும்
  alternative: வணங்கட்டும் / பணிந்து மரியாதை செலுத்தட்டும்
  rationale: மகன் தேவதூதர்களைவிட உயர்ந்தவர் என்று வலியுறுத்தும் இவ்வதிகாரத்தின் சூழலிலும், தேவனுடைய எல்லா தேவதூதர்களுக்கும் கொடுக்கப்படும் கட்டளையிலும், ‘வழிபடுதல்’ என்பதே வினையின் வலிமையைச் சிறப்பாக வெளிப்படுத்துகிறது; அதே நேரத்தில் உரையில் இல்லாத மேலதிக கோட்பாட்டு விளக்கங்கள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. தமிழின் இயல்பான மேற்கோள் அமைப்பிற்காக λέγει வாக்கியத்தின் முடிவில் தரப்பட்டுள்ளது. ‘முதற்பேறானவர்’ கிறிஸ்துவைக் குறிக்கும் பட்டப்பெயராகச் செயல்படுகிறது; தமிழில் பெரிய எழுத்து வேறுபாடு இல்லாததால் மரியாதைப் பன்மை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
