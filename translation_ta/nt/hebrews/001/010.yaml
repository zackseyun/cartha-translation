source:
  edition: SBLGNT
  text: καί· Σὺ κατ’ ἀρχάς, κύριε, τὴν γῆν ἐθεμελίωσας, καὶ ἔργα τῶν χειρῶν σού εἰσιν οἱ οὐρανοί·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/010.yaml
  text: And[a], “You, Lord, in the beginning laid the foundation of the earth, and the heavens are the works of your hands.”
translation:
  language: ta
  text: மேலும், “ஆண்டவரே, ஆதியில்[a] நீரே பூமிக்கு அடித்தளம் அமைத்தீர்; வானங்கள் உமது கைகளின் படைப்புகள்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தொடக்கத்தில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καί
  choice: மேலும்
  rationale: முந்தைய மேற்கோள்களுடன் இன்னொரு மேற்கோளை இணைப்பதை இயல்பான தமிழில் காட்டுகிறது; இதற்கு மேலான விளக்கத்தைத் திணிக்கவில்லை.
- source_word: Σὺ
  choice: நீரே
  rationale: கிரேக்கத்தில் வெளிப்படையாக இடம்பெறும் வலியுறுத்தப்பட்ட முன்னிலைப்படர்க்கைப் பெயரை மரியாதையான ஒருமை வடிவத்துடன் ‘-ஏ’ சேர்த்துப் பாதுகாக்கிறது.
- source_word: κατ’ ἀρχάς
  choice: ஆதியில்
  rationale: படைப்பின் தொடக்கத்தைக் குறிக்கும் காலச் சொற்றொடரைச் சுருக்கமாகவும் கண்ணியமாகவும் தருகிறது; ‘தொடக்கத்தில்’ என்ற இயல்பான மாற்றும் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: κύριε
  choice: ஆண்டவரே
  rationale: κύριος என்பதன் விளி வேற்றுமையையும் நேரடி அழைப்பையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: τὴν γῆν
  choice: பூமிக்கு
  rationale: ‘வானங்கள்’ என்பதுடன் இணையும் படைப்புச் சூழலில் γῆ என்பது ஒரு குறிப்பிட்ட நிலப்பகுதியை அல்ல, பூமியையே குறிக்கிறது.
- source_word: ἐθεμελίωσας
  choice: அடித்தளம் இட்டீர்
  rationale: θεμελιόω என்பதிலுள்ள கட்டட அடித்தள உருவகத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἔργα τῶν χειρῶν σού
  choice: உமது கைகளின் படைப்புகள்
  rationale: கைகளால் செய்யப்பட்டவை என்ற மனித உருவக மொழியைப் பாதுகாத்தபடியே நவீன தமிழில் இயல்பாக ஒலிக்கிறது.
- source_word: οἱ οὐρανοί
  choice: வானங்கள்
  rationale: கிரேக்கப் பன்மையைப் பாதுகாத்து, ‘பூமி’ என்பதற்கு இணையான படைப்புச் சொல்லாட்சியை வழங்குகிறது.
theological_decisions:
- issue: சங்கீதம் 102-இல் ஆண்டவரை நோக்கிச் சொல்லப்பட்ட மொழி எபிரெயர் 1-இல் மகனுக்குப் பயன்படுத்தப்படுதல்
  choice: ‘ஆண்டவரே ... நீரே’ என்ற நேரடி அழைப்பை வலுவிழக்கச் செய்யாமல் வைத்தல்
  alternative: மேற்கோளின் கிறிஸ்துவைச் சார்ந்த வலிமையைத் தவிர்க்கும் வகையில் நடுநிலைப்படுத்துதல்
  rationale: கிரேக்க உரையில் κύριε நேரடி அழைப்பாக உள்ளது; அதை மகனைப் பற்றிய தொடர்ச்சியான சூழலில் ஆசிரியர் மேற்கோள் காட்டுகிறார். மொழிபெயர்ப்பு இதை விளக்கமாக விரிவாக்காமலும் பலவீனப்படுத்தாமலும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. இறைவனை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘நீர்/உமது’ பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் உருவகமும் நேரடி அழைப்பும் காக்கப்பட்டுள்ளன.
