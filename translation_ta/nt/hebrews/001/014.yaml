id: HEB.1.14
reference: Hebrews 1:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐχὶ πάντες εἰσὶν λειτουργικὰ πνεύματα εἰς διακονίαν ἀποστελλόμενα διὰ τοὺς μέλλοντας κληρονομεῖν σωτηρίαν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/014.yaml
  text: Are they not all ministering spirits, being sent out for service for the sake of those who are about to inherit salvation?[a]
translation:
  language: ta
  text: அவர்கள் அனைவரும் ஊழியம் புரியும் ஆவிகள்தானே? இரட்சிப்பைச் சுதந்தரிக்கவிருப்பவர்களுக்காகச் சேவை செய்ய அவர்கள் அனுப்பப்படுகிறார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரட்சிப்பைச் சுதந்தரிக்கப்போகிறவர்கள்.” கிரேக்கச் சொற்றொடர் எதிர்காலத்தை நோக்கிய பொருளைக் கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχὶ
  choice: ஆவிகள்தானே ...?
  rationale: உறுதியான ஆம் என்ற பதிலை எதிர்பார்க்கும் கிரேக்க மறுப்புக் கேள்வியை இயல்பான தமிழ் ‘-தானே?’ அமைப்பில் வழங்குகிறது.
- source_word: πάντες
  choice: அவர்கள் அனைவரும்
  rationale: தேவதூதர்கள் அனைவரையும் உள்ளடக்கும் பன்மையின் முழுமையான பரப்பைத் தக்கவைக்கிறது.
- source_word: λειτουργικὰ πνεύματα
  choice: ஊழியம் செய்யும் ஆவிகள்
  rationale: λειτουργικός என்பதிலுள்ள சேவை சார்ந்த பொருளையும், πνεύματα என்பதிலுள்ள ஆவிக்குரிய உயிர்கள் என்ற குறிப்பையும் தெளிவாக வழங்குகிறது; திருச்சபைப் பதவியைத் தேவையின்றி சுட்டவில்லை.
- source_word: εἰς διακονίαν
  choice: பணிபுரிய
  rationale: நோக்கத்தைக் குறிக்கும் சொற்றொடரை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; λειτουργικά என்பதுடன் உள்ள சொற்பொருள் வேறுபாட்டை ‘ஊழியம்’/‘பணி’ என ஓரளவு காக்கிறது.
- source_word: ἀποστελλόμενα
  choice: அனுப்பப்படுகிற
  rationale: நிகழ்காலச் செயலற்ற பங்கேற்புச் சொல்லின் விவரிப்பு வலிமையைத் தக்கவைத்து, அவர்கள் அனுப்பப்படும் ஆவிகள் என்பதை வெளிப்படுத்துகிறது.
- source_word: διὰ
  choice: …க்காக
  rationale: இங்கு குறிக்கப்படும் நன்மைபெறுவோருக்காக அனுப்பப்படுதல் என்ற பயன்நோக்குப் பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: τοὺς μέλλοντας
  choice: …விருப்பவர்கள்
  rationale: எதிர்காலத்தை நோக்கிய μέλλω என்பதன் கருத்தைத் தக்கவைக்கிறது; உடனடி நிகழ்வை மட்டுமே உணர்த்தக்கூடிய ‘போகிறவர்கள்’ என்பதைத் தவிர்க்கிறது.
- source_word: κληρονομεῖν
  choice: சுதந்தரிக்க
  rationale: வாரிசுரிமையாகப் பெறுதல் என்ற எபிரெயர் நூலின் முக்கிய உருவகத்தைச் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: σωτηρίαν
  choice: இரட்சிப்பை
  rationale: σωτηρία என்பதற்கான நிலைபெற்ற வேதாகமத் தமிழ்ச் சொல்லாக இருந்து, அதன் மீட்பு மற்றும் இறுதிக்காலப் பரிமாணங்களைத் திறந்தவையாக வைத்திருக்கிறது.
theological_decisions:
- issue: μέλλοντας κληρονομεῖν σωτηρίαν என்பதன் வலிமை
  choice: ‘இரட்சிப்பைச் சுதந்தரிக்கவிருப்பவர்கள்’ என்று எதிர்கால நோக்குடன் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘இரட்சிப்பைச் சுதந்தரிக்கப்போகிறவர்கள்’ அல்லது ‘இரட்சிப்பைச் சுதந்தரிப்பவர்கள்’
  rationale: இது μέλλω என்பதன் எதிர்கால/எதிர்நோக்கு வலிமையையும் சுதந்தர உருவகத்தையும் காக்கிறது; முன்நியமனம், நிச்சயம், அல்லது காலத்தின் உடனடித்தன்மை பற்றிய குறிப்பிட்ட கோட்பாட்டை உரைக்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியக்கூடிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘ஊழியம் செய்யும் ஆவிகள்’ என்பது உயர்ந்த வேதாகமப் பதிவைத் தக்கவைக்கிறது; ‘பணிபுரிய’ என்பது திருச்சபைப் பதவிசார் மேலதிகப் பொருளைத் தவிர்க்கிறது. மறுப்புக் கேள்வி தமிழ் இயல்புக்கு ஏற்ப ‘-தானே?’ வடிவில் அமைக்கப்பட்டது.
