id: HEB.1.12
reference: Hebrews 1:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὡσεὶ περιβόλαιον ἑλίξεις αὐτούς, ⸂ὡς ἱμάτιον⸃ καὶ ἀλλαγήσονται· σὺ δὲ ὁ αὐτὸς εἶ, καὶ τὰ ἔτη σου οὐκ ἐκλείψουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/012.yaml
  text: and like a cloak you will roll them up[a]; like a garment they will be changed. But you are the same[b], and your years will not fail.
translation:
  language: ta
  text: அவற்றை மேலாடையைப் போலச் சுருட்டுவீர்[a]; உடையைப் போல அவை மாற்றப்படும். ஆனால் நீரோ மாறாமல் இருக்கிறீர்; உமது ஆண்டுகளுக்கு முடிவே இருக்காது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சுருட்டுவீர்” என்பதை “மடிப்பீர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “உமது ஆண்டுகளுக்கு முடிவே இருக்காது” என்பதை “உமது ஆண்டுகள் ஒழிந்துபோகாது” அல்லது “உமது ஆண்டுகள் தீர்ந்துபோகாது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσεὶ περιβόλαιον
  choice: ஒரு மேலாடையைப் போல
  rationale: ὡσεὶ அறிமுகப்படுத்தும் ஒப்புமையையும், உடலைச் சுற்றிப் போர்த்தப்படும் வெளிப்புற ஆடை என்ற περιβόλαιον என்பதன் படிமத்தையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: ἑλίξεις
  choice: சுருட்டுவீர்
  rationale: ἑλίσσω என்பதன் சுருட்டுதல் அல்லது மடித்தல் என்ற பொருள் வரம்பில், படைப்பை ஓர் ஆடையைப் போலச் சுருட்டும் கவித்துவப் படிமத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: αὐτούς
  choice: அவற்றை
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட படைக்கப்பட்டவற்றைச் சுட்டும் பன்மைப் பெயர்ப்பதிலியாகத் தமிழில் இயல்பாக வருகிறது.
- source_word: ὡς ἱμάτιον
  choice: ஓர் உடையைப் போல
  rationale: ἱμάτιον என்பதன் பொதுவான ஆடைப் பொருளையும், முந்தைய மேலாடை ஒப்புமையுடனான கவித்துவ இணைப்பையும் காக்கிறது.
- source_word: ἀλλαγήσονται
  choice: அவை மாற்றப்படும்
  rationale: எதிர்காலச் செயப்பாட்டு வடிவை அப்படியே காத்து, படைக்கப்பட்டவை மாற்றத்துக்கு உட்படுகின்றன என்ற கருத்தைத் தெளிவாகத் தருகிறது.
- source_word: σὺ δὲ ὁ αὐτὸς εἶ
  choice: ஆனால் நீரோ அதேவராக இருக்கிறீர்
  rationale: δὲ காட்டும் முரண்பாட்டையும் ὁ αὐτός கூறும் தொடர்ந்த ஒரே தன்மையையும், பிற்கால இறையியல் தொழில்நுட்பச் சொல்லைச் சேர்க்காமல் நெருக்கமாகக் காக்கிறது.
- source_word: τὰ ἔτη σου
  choice: உமது ஆண்டுகள்
  rationale: நீடித்த இருப்பைக் குறிக்கும் மூலத்தின் காலப் படிமத்தை நேரடியாகக் காக்கிறது.
- source_word: οὐκ ἐκλείψουσιν
  choice: முடிவுறாது
  rationale: ἐκλείπω என்பதன் முடிதல், ஒழிதல், தீர்ந்துபோதல் என்ற பொருள் வரம்பில், முடிவில்லாத தொடர்ச்சியை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கிறிஸ்துவை நோக்கிப் பயன்படுத்தப்படும் மேற்கோளில் மாறாத தன்மையை மொழிபெயர்த்தல்
  choice: ஆனால் நீரோ அதேவராக இருக்கிறீர்
  alternative: ஆனால் நீர் மாறாமல் இருக்கிறீர்
  rationale: படைப்பின் மாற்றத்துக்கு எதிராக அழைக்கப்படுபவரின் தொடர்ந்த ஒரே தன்மையை வசனம் நிறுத்துகிறது. “அதேவராக” என்பது ὁ αὐτός என்பதற்கு நெருக்கமாக இருந்து, “மாறாதவர்” போன்ற பின்னாளைய தொழில்நுட்ப இறையியல் சொல்லாக்கத்தை உரைக்குள் சேர்க்காமல் உட்கருத்தைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவித்துவமும் மரியாதையும் உள்ள நடையைப் பயன்படுத்துகிறது. “நீரோ,” “உமது,” “இருக்கிறீர்” ஆகிய வடிவங்கள் தெய்வத்தை நோக்கிய உயர்வான ஒருமை மரியாதையைத் தருகின்றன; மொழி தேவையற்ற பழமையாக்கமின்றி பொதுவாசகருக்குப் புரியும் வகையில் உள்ளது.
