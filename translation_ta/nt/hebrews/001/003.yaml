translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமும் பொதுவாசகத் தெளிவும் பேணப்பட்டுள்ளன. நீண்ட கிரேக்க வாக்கியம் வாசிப்புக்கு ஏற்ற மூன்று தமிழ் வாக்கியங்களாக அமைக்கப்பட்டாலும், பங்கேற்புச் செயல்களின் தொடர்பும் இறுதிச் செயல் நோக்கிய நகர்வும் காக்கப்பட்டுள்ளன. ‘கடவுள்’ என்பது இவ்வசனத்தில் αὐτοῦ குறிக்கும் முன் உரைச் சார்பைத் தெளிவுபடுத்த மட்டுமே சேர்க்கப்பட்டுள்ளது.
