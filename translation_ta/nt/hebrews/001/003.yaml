  terminology: ‘ஒளிவீச்சு,’ ‘மெய்ம்மை,’ ‘துல்லியமான முத்திரைப் பதிப்பு,’ ‘பாவங்களுக்கான தூய்மைப்படுத்துதல்,’ மற்றும் ‘தம்மூலமாக’ ஆகிய தேர்வுகள் மூலத்தின் உருவகம், இருப்பியல் வலிமை, பலிசார் நுணுக்கம், மற்றும் கொடுக்கப்பட்ட SBLGNT வாசகத்தைப் பாதுகாக்கின்றன. ‘மகத்துவம்’ என்பதை ஆள்சுட்டாக்காமல் வைத்தல் சிறந்தது.
