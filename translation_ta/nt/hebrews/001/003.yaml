  source_fidelity: 'மூல கிரேக்கத்தின் முக்கிய கூறுகள் அனைத்தும் வரைவில் உள்ளன: ἀπαύγασμα, χαρακτήρ, ὑπόστασις, φέρων, δι’ αὑτοῦ, καθαρισμός, மற்றும் வலப்பக்கத்தில் அமர்தல் ஆகியவை பொருளோடு தரப்பட்டுள்ளன. ஆனால் தொடர்ச்சியான பங்கேற்பு அமைப்பை மூன்று தனி வாக்கியங்களாகப் பிரித்ததால், நிகழ்கால ‘இருக்கிறார்/நடத்துகிறார்’ என்பதிலிருந்து இறந்தகால ‘அமர்ந்தார்’ என மாறும் இலக்கண-காலத் தொடர்பு சற்றுக் குழம்புகிறது. τῆς μεγαλωσύνης என்பது மறைமுகமான பெயர்ச்சொல்; ‘மகத்துவமானவர்’ என்பது மூலத்தின் அமூர்த்தமான குறிப்பை தேவையின்றி ஆள்சுட்டாக்குகிறது.'
