source:
  edition: SBLGNT
  text: ὃς ὢν ἀπαύγασμα τῆς δόξης καὶ χαρακτὴρ τῆς ὑποστάσεως αὐτοῦ, φέρων τε τὰ πάντα τῷ ῥήματι τῆς δυνάμεως, ⸂δι’ αὑτοῦ⸃ καθαρισμὸν ⸂τῶν ἁμαρτιῶν ποιησάμενος⸃ ἐκάθισεν ἐν δεξιᾷ τῆς μεγαλωσύνης ἐν ὑψηλοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/003.yaml
  text: He[a], being the radiance of his glory and the exact imprint of his being, and sustaining all things by the word of his power, after making purification for sins through himself[b], sat down at the right hand of the Majesty on high[c],
translation:
  language: ta
  text: அவர், அவருடைய மகிமையின் ஒளிவீச்சாகவும் அவருடைய மெய்ம்மையின் துல்லியமான முத்திரைப் பதிப்பாகவும் இருந்து[a], தமது வல்லமையின் வார்த்தையால் எல்லாவற்றையும் தாங்கி நடத்தி, தம்மூலமாக[b] பாவங்களுக்கான தூய்மைப்படுத்துதலைச் செய்தபின், உன்னதத்தில் உள்ள மகத்துவத்தின் வலப்பக்கத்தில் அமர்ந்தார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய இயல்பின்/சாரத்தின் துல்லியமான வெளிப்பாடு.”
    reason: lexical_alternative
  - marker: b
    text: சில கையெழுத்துப் பிரதிகளில் “தம்மூலமாக” என்பது இல்லை. இங்கு SBLGNT உரை பின்பற்றப்பட்டுள்ளது; வேறு உரைமரபில் இதை “தாமே” என்றும் மொழிபெயர்க்கலாம்.
    reason: textual_variant
  - marker: c
    text: 'சொல்லுக்குச் சொல்: “உன்னதங்களில்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαύγασμα
  choice: ஒளிவீச்சு
  rationale: மகிமையிலிருந்து வெளிப்படும் பிரகாசம் என்ற உருவகத்தை இயல்பான நவீன தமிழில் தருகிறது; வெறும் பிரதிபலிப்பு என்ற பலவீனமான பொருளைத் தவிர்க்கிறது.
- source_word: χαρακτήρ
  choice: துல்லியமான முத்திரைப் பதிப்பு
  rationale: முத்திரையால் பதிக்கப்படும் சரியான வடிவம் என்ற கிரேக்கச் சொல்லின் தெளிவான உருவகத்தையும் துல்லியமான ஒத்திசைவையும் காக்கிறது.
- source_word: ὑπόστασις
  choice: மெய்ம்மை
  rationale: கடவுளுடைய அடிப்படை நிஜத்தைக் குறிக்கிறது; பிற்கால மெய்யியல் கலைச்சொற்களை வசனத்திற்குள் நேரடியாகத் திணிக்காமல் அதன் இருப்பியல் வலிமையைப் பாதுகாக்கிறது.
- source_word: φέρων
  choice: தாங்கி நடத்துகிறார்
  rationale: எல்லாவற்றையும் தொடர்ச்சியாகத் தாங்கிப் பேணும் செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὰ πάντα
  choice: எல்லாவற்றையும்
  rationale: கிரேக்கத்தின் முழுமையான பரப்பை உடல் சார்ந்த பிரபஞ்சத்துக்கு மட்டும் சுருக்காமல் காக்கிறது.
- source_word: τῷ ῥήματι τῆς δυνάμεως
  choice: தமது வல்லமையுள்ள வார்த்தையால்
  rationale: சொல்லின் கருவிசார் வல்லமையைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; ‘கட்டளை’ என்று பொருளைச் சுருக்கவில்லை.
- source_word: δι’ αὑτοῦ
  choice: தம்மூலமாக
  rationale: διά என்பதன் வழக்கமான ‘மூலமாக’ என்ற பொருளையும் αὑτοῦ என்பதன் தற்சுட்டுப் பொருளையும் காக்கிறது.
- source_word: καθαρισμὸν τῶν ἁμαρτιῶν
  choice: பாவங்களுக்கான தூய்மைப்படுத்துதல்
  rationale: பாவங்களைக் கையாளும் பலிசார் தூய்மைப்படுத்துதலைத் தெரிவிக்கிறது; பாவங்களே தூய்மையாக்கப்படுகின்றன என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: ποιησάμενος
  choice: நிறைவேற்றிய பின்பு
  rationale: முதன்மை வினையான ‘அமர்ந்தார்’ என்பதற்கு முன் முடிக்கப்பட்ட செயலை அஓரிஸ்ட் பங்கேற்பு காட்டுவதைத் தெளிவுபடுத்துகிறது.
- source_word: ἐν δεξιᾷ
  choice: வலப்பக்கத்தில்
  rationale: அதிகாரமும் கௌரவமும் குறிக்கும் இட உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: τῆς μεγαλωσύνης
  choice: மகத்துவமானவர்
  rationale: ‘மகத்துவம்’ எனும் மறைமுக இறைக் குறிப்பை தமிழில் புரியத்தக்க ஆள்சுட்டாகத் தருகிறது; பெயரைச் சேர்த்து விளக்கவில்லை.
- source_word: ἐν ὑψηλοῖς
  choice: உன்னதத்தில்
  rationale: விண்ணக உயர்விடத்தைக் குறிக்கும் சொற்றொடரை இயல்பான, கண்ணியமான தமிழில் வழங்குகிறது.
