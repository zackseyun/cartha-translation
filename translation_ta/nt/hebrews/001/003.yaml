- from: இவர் கடவுளுடைய மகிமையின் ஒளிவீச்சாகவும், அவருடைய மெய்ம்மையின் துல்லியமான முத்திரைப் பதிப்பாகவும்[a] இருக்கிறார். தமது வல்லமையுள்ள வார்த்தையால் எல்லாவற்றையும் தாங்கி நடத்துகிறார். தம்மூலமாக[b] பாவங்களுக்கான தூய்மைப்படுத்துதலை நிறைவேற்றிய பின்பு, உன்னதத்தில்[c] மகத்துவமானவரின் வலப்பக்கத்தில் அமர்ந்தார்.
  to: அவர், அவருடைய மகிமையின் ஒளிவீச்சாகவும் அவருடைய மெய்ம்மையின் துல்லியமான முத்திரைப் பதிப்பாகவும் இருந்து[a], தமது வல்லமையின் வார்த்தையால் எல்லாவற்றையும் தாங்கி நடத்தி, தம்மூலமாக[b] பாவங்களுக்கான தூய்மைப்படுத்துதலைச் செய்தபின், உன்னதத்தில் உள்ள மகத்துவத்தின் வலப்பக்கத்தில் அமர்ந்தார்[c].
