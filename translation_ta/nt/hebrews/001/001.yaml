revisions:
- from: முற்காலத்தில்[a] கடவுள் இறைவாக்கினர்கள் வழியாக[b] தந்தையரிடம்[c] பல பகுதிகளாகவும் பல விதங்களிலும் பேசினார்.
  to: நெடுங்காலத்திற்கு முன்பு[a], கடவுள் இறைவாக்கினர்கள் வழியாக[b] தந்தையரிடம்[c] பல பகுதிகளாகவும் பல வழிகளிலும் பேசினார்.
  rationale: The revision preserves the source’s paired distinction between portions and modes, while using more natural modern Tamil for πάλαι and πολυτρόπως. It retains ‘தந்தையரிடம்’ in the text because the Greek explicitly says ‘the fathers’; the broader ‘முன்னோர்’ remains appropriately confined to a footnote alternative. The finite Tamil verb remains a defensible verse-level rendering of the participial construction that continues into 1:2.
