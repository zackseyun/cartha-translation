  yaml_path: translation/nt/hebrews/001/001.yaml
  text: Long ago[c][b][a], God spoke to the fathers in many parts and in many ways by the prophets.
translation:
  language: ta
  text: நெடுங்காலத்திற்கு முன்பு[a], கடவுள் இறைவாக்கினர்கள் வழியாக[b] தந்தையரிடம்[c] பல பகுதிகளாகவும் பல வழிகளிலும் பேசினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முற்காலத்தில்.”
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு நெருக்கமாக, “இறைவாக்கினர்களில்”; “இறைவாக்கினர்கள் மூலமாக” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “முன்னோர்களிடம்”; கிரேக்கத்தில், “தந்தையரிடம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολυμερῶς
  choice: பல பகுதிகளாக
  rationale: முந்தைய வெளிப்பாடு பல பகுதிகளாக வழங்கப்பட்டதை உணர்த்துகிறது; அடுத்து வரும் πολυτρόπως என்பதிலுள்ள பல்வேறு முறைகள் என்ற கருத்திலிருந்து இதை வேறுபடுத்திக் காட்டுகிறது.
- source_word: πολυτρόπως
  choice: பல விதங்களில்
  rationale: பேசப்பட்ட பல்வேறு முறைகளையும் வடிவங்களையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: πάλαι
  choice: முற்காலத்தில்
  rationale: கடந்த காலத்தையும் கால இடைவெளியையும் கண்ணியமான, இயல்பான தமிழில் குறிக்கிறது.
- source_word: ὁ θεὸς
  choice: கடவுள்
  rationale: கிரேக்க மூலத்தின் எழுவாயை நேரடியாகவும் பொதுவாகப் புரியும் தமிழிலும் தருகிறது.
- source_word: λαλήσας
  choice: பேசினார்
  rationale: இது கிரேக்கத்தில் இறந்தகால வினையெச்சமாக இருந்து 1:2-இன் முதன்மை வினையுடன் இணைகிறது. தனி வசனமாக வாசிக்கத் தெளிவாக முற்றுவினை பயன்படுத்தப்பட்டாலும், அடுத்த வசனத்துடனான கால முரண் பாதுகாக்கப்படுகிறது.
- source_word: τοῖς πατράσιν
  choice: தந்தையரிடம்
  rationale: ‘முன்னோர்’ என விளக்கமாக மாற்றாமல், மூலத்தின் பாலினக் குறியீடும் உடன்படிக்கை-வரலாற்றுச் சொல்லாட்சியும் பாதுகாக்கப்படுகின்றன.
- source_word: ἐν τοῖς προφήταις
  choice: இறைவாக்கினர்கள் வழியாக
  rationale: ἐν என்பதன் கருவிப் பொருளை இயல்பான தமிழில் காட்டுகிறது; கடவுளே பேசுபவர், இறைவாக்கினர்கள் அவரது வாயில்கள் என்ற தொடரமைப்பைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: எபிரெயர் 1:2 உடன் தொடர்புடைய வினையெச்சக் கட்டமைப்பு
  choice: 1:1-இல் ‘கடவுள் ... பேசினார்’ என்று முற்றுவினையாக்கி, முற்காலப் பேச்சுக்கும் 1:2-இன் பேச்சுக்கும் உள்ள கால முரணைப் பாதுகாத்தல்.
  alternative: ‘கடவுள் ... பேசிய பின்பு’ அல்லது ‘பேசியவராய்’ என வினையெச்சத்தை முறையாகத் தக்கவைத்தல்.
  rationale: கிரேக்க λαλήσας 1:2-இன் முதன்மை வினையால் நிறைவுறுகிறது. ஆயினும் தனி வசனத் தமிழில் மிக நேரடியான வினையெச்ச வடிவம் முழுமையற்றதாக ஒலிக்கலாம்; முற்றுவினை பொருளைத் தெளிவாக்குகிறது, அதேவேளையில் குமாரனில் நிகழ்ந்த பேச்சைப் பற்றிய அடுத்த வசனத்தின் உச்சநிலையை முன்கூட்டியே விளக்குவதில்லை.
translation_notes:
  register: நவீன பொதுத் தமிழில் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘பல பகுதிகளாகவும் பல விதங்களிலும்’ என்ற இணை அமைப்பு இரண்டு கிரேக்க வினையடைகளின் தனித்தனி நுட்பங்களைப் பாதுகாக்கிறது. வசனம் 1:2-இல் தொடரும் கிரேக்க வாக்கியத்தின் ஒரு பகுதி என்றாலும், தனியாகவும் தெளிவாக வாசிக்கும்படி அமைக்கப்பட்டுள்ளது.
