reference: Hebrews 1:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πρὸς τίνα δὲ τῶν ἀγγέλων εἴρηκέν ποτε· Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ὑποπόδιον τῶν ποδῶν σου;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/013.yaml
  text: But to which of the angels has he ever said[a], ‘Sit at my right hand until I make your enemies a footstool for your feet’?”
translation:
  language: ta
  text: 'ஆனால், தேவதூதர்களில் எவரிடமாவது அவர் எப்போதாவது இவ்வாறு கூறியிருக்கிறாரா?


    “நான் உன் பகைவர்களை

    உன் கால்களுக்குக் கால்வைப்பீடமாக ஆக்கும்வரை

    என் வலப்பக்கத்தில் அமர்ந்திரு.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρὸς τίνα δὲ τῶν ἀγγέλων
  choice: ஆனால் தேவதூதர்களில் யாரிடம்
  rationale: πρός உடன் τίνα என்பது பேசப்படுபவரைக் குறிக்கும் ‘யாரிடம்’ என்ற பொருளைத் தருகிறது. δέ, முன் வசனங்களுடன் உள்ள முரண்பாட்டைக் காட்டுவதால் ‘ஆனால்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: εἴρηκέν ποτε
  choice: எப்போதாவது ... கூறியிருக்கிறார்
  rationale: Perfect வினைவடிவத்தின் நீடிக்கும் தாக்கத்தை ‘கூறியிருக்கிறார்’ இயல்பாக வெளிப்படுத்துகிறது; ποτέ என்பதன் ‘எப்போதாவது’ என்ற வலியுறுத்தலும் காக்கப்படுகிறது.
- source_word: Κάθου
  choice: அமர்ந்திரு
  rationale: நேரடியான கட்டளை வடிவத்தையும் அரசருக்குரிய அரியணையேற்றச் சூழலின் கண்ணியத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἐκ δεξιῶν μου
  choice: என் வலப்பக்கத்தில்
  rationale: இது மரியாதைக்கும் அதிகாரத்திற்குமான இடத்தைக் குறிக்கும் நிலையான வேதாகமச் சொற்றொடர்; தமிழில் ‘வலப்பக்கத்தில்’ என்பது தெளிவான இடப்பொருளைத் தருகிறது.
- source_word: ἕως ἂν θῶ
  choice: நான் ... ஆக்கும்வரை
  rationale: எதிர்கால எல்லையைக் குறிக்கும் ἕως ἂν அமைப்பை ‘வரை’ காட்டுகிறது; τίθημι இங்கு ὑποπόδιον உடன் ஒரு நிலைக்கு ஆக்குவதைச் சொல்வதால் ‘ஆக்கும்வரை’ இயல்பானது.
- source_word: τοὺς ἐχθρούς σου
  choice: உன் பகைவர்களை
  rationale: பன்மை நேரடி செயப்படுபொருளைத் துல்லியமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὑποπόδιον τῶν ποδῶν σου
  choice: உன் கால்களுக்குக் கால்மணை
  rationale: முழுமையான கீழ்ப்படுத்துதலைச் சித்தரிக்கும் மூல உருவகத்தை விளக்கவுரையாக மாற்றாமல் காக்கிறது; ‘கால்மணை’ என்பது நவீன தமிழில் சுருக்கமான, புரியத்தக்க சொல்.
theological_decisions:
- issue: சங்கீதம் 110:1 மேற்கோளின் கிறிஸ்துவியல் வலிமையை மிகைவிளக்கமின்றிக் காத்தல்
  choice: குமாரனைத் தனித்துவமாக நோக்கிச் சொல்லப்படும் அரியணையேற்ற உரையாக நேரடி மேற்கோளையும், வலப்பக்கத்தில் அமர்தல் மற்றும் பகைவர்களைக் கால்மணையாக்குதல் ஆகிய உருவகங்களையும் அப்படியே காத்தல்.
  alternative: ‘உன் பகைவர்களை நான் முற்றிலும் தோற்கடிக்கும்வரை’ என்று உருவகத்தை விளக்கிப் பொழிப்புரை செய்தல்.
  rationale: எபிரெயர் நூலின் வாதம் மேற்கோளின் துல்லியமான சொற்களையும் குமாரனுக்கும் தேவதூதர்களுக்கும் இடையிலான வேறுபாட்டையும் சார்ந்துள்ளது. ஆகவே அரச அதிகாரம் மற்றும் கீழ்ப்படுத்துதல் குறித்த உருவகங்கள் விளக்கமாகத் தட்டையாக்கப்படவில்லை.
- issue: ‘வரை’ என்பதன் கால எல்லை
  choice: ἕως ἂν என்பதற்கு ‘வரை’ என்று நேரடியாக மொழிபெயர்த்து, அதன் பின் அமர்ந்திருத்தல் முடிவடையும் எனச் சேர்க்காமல் விடுதல்.
  alternative: பகைவர்கள் கீழ்ப்படுத்தப்பட்ட பின் குமாரன் வலப்பக்கத்தில் அமர்ந்திருக்கமாட்டார் என்று வெளிப்படையாகப் பொருள் கூறுதல்.
  rationale: மூல வாக்கியம் குறித்த நிகழ்வு நிறைவேறும் காலத்தை மட்டும் வரையறுக்கிறது; அதற்குப் பிந்தைய நிலையைத் தெளிவாகச் சொல்லவில்லை. அந்த உண்மையான பொருள் திறப்பை மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் அமைக்கப்பட்டது. கவிதை மேற்கோளின் வரியமைப்பும் கேள்வியின் வாதநடையும் காக்கப்பட்டுள்ளன; இறையியல் விளக்கங்கள் மூல உரையில் சேர்க்கப்படவில்லை.
