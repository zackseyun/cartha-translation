  to: 'ஆனால், தேவதூதர்களில் எவரிடமாவது அவர் எப்போதாவது இவ்வாறு கூறியிருக்கிறாரா?


    “நான் உன் பகைவர்களை

    உன் கால்களுக்குக் கால்வைப்பீடமாக ஆக்கும்வரை

    என் வலப்பக்கத்தில் அமர்ந்திரு.”'
  rationale: The revision replaces the unclear «கால்மணை» with «கால்வைப்பீடம்», a transparent modern Tamil rendering of ‘footstool,’ and lightly regularizes the rhetorical-question syntax. It does not explain away the royal enthronement or subjugation imagery, and it preserves the temporal openness of «வரை».
