lexical_decisions:
- source_word: αὐτοὶ
  choice: அவையோ
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட வானங்களையும் பூமியையும் சுட்டுகிறது. ‘-ஓ’ என்பது அவற்றுக்கும் ‘நீர்’ என்பவருக்கும் இடையிலான அழுத்தமான முரண்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀπολοῦνται
  choice: அழிந்துபோகும்
  rationale: வருங்காலத்தில் முடிவுக்கு வருதல் அல்லது இல்லாமற்போதல் என்ற வலுவான பொருளைப் பாதுகாக்கிறது; வெளிப்புற அழிப்பவரைத் தேவையின்றி முன்வைப்பதில்லை.
- source_word: σὺ δὲ
  choice: நீரோ
  rationale: படைப்புக்கும் நேரடியாக விளிக்கப்படுகிறவருக்கும் உள்ள வலுவான முரண்பாட்டைப் பாதுகாக்கிறது. ‘நீர்’ என்பது ஒருமை மரியாதை வடிவமாக இயல்பான, கண்ணியமான தமிழை வழங்குகிறது.
- source_word: διαμένεις
  choice: தொடர்ந்து நிலைத்திருக்கிறீர்
  rationale: தொடர்ந்து இருத்தல், மாறாமல் நீடித்தல் ஆகிய இரு நுணுக்கங்களையும் வெளிப்படுத்தி, படைப்பின் அழிவுடன் உள்ள முரண்பாட்டைத் தெளிவாக்குகிறது.
- source_word: πάντες
  choice: அவையெல்லாம்
  rationale: முன் குறிப்பிடப்பட்ட படைக்கப்பட்ட அனைத்தையும் கூட்டாகச் சுட்டி, ‘எல்லாம்’ என்ற முழுமையான விரிவைப் பாதுகாக்கிறது.
- source_word: ὡς ἱμάτιον
  choice: ஓர் ஆடையைப்போல்
  rationale: ἱμάτιον என்பதன் பொதுவான ‘ஆடை’ என்ற பொருளை வைத்துக்கொண்டு, குறிப்பிட்ட ஓர் ஆடை வகையாக தேவையின்றிக் குறுக்கவில்லை.
- source_word: παλαιωθήσονται
  choice: நைந்துபோகும்
  rationale: வயதாகி பழமையடைதல் அல்லது தேய்ந்து பயன்படாத நிலைக்கு வருதல் என்ற பொருளை, ஆடை உருவகத்துக்கு ஏற்ற இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: விளிக்கப்படுகிறவர் மற்றும் கிறிஸ்துவியல் வலிமை
  choice: ‘நீரோ தொடர்ந்து நிலைத்திருக்கிறீர்’ என்று குமாரனுக்கான நேரடி விளிப்பாக மொழிபெயர்க்கப்பட்டது.
  alternative: விளிக்கப்படுகிறவரை விளக்கக் குறிப்பால் வெளிப்படையாக ‘குமாரன்’ என்று உரைக்குள் சேர்த்தல்.
  rationale: எபிரெயர் 1-ன் சூழல் சங்கீத மொழியை குமாரனுக்குப் பயன்படுத்துகிறது. இரண்டாம் நபர் நேரடி விளிப்பைப் பாதுகாப்பது அந்த வலிமையைத் தக்கவைக்கிறது; ஆனால் மூலத்தில் இவ்வசனத்திற்குள் இல்லாத பெயரையோ கோட்பாட்டு விளக்கத்தையோ சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. நேரடி விளிப்பில் ஒருமை மரியாதை வடிவமான ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது; இது தெய்வீக விளிப்புக்கு ஏற்ற மரியாதையை வழங்கினாலும், மூலத்தின் நேரடி இரண்டாம் நபர் உரையை மாற்றுவதில்லை. ‘நைந்துபோகும்’ என்பது ஆடை உருவகத்தை உயிரோட்டமாகப் பாதுகாக்கிறது.
