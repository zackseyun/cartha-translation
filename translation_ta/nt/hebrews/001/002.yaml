  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐπ’ ἐσχάτου τῶν ἡμερῶν τούτων ἐλάλησεν ἡμῖν ἐν υἱῷ, ὃν ἔθηκεν κληρονόμον πάντων, δι’ οὗ καὶ ⸂ἐποίησεν τοὺς αἰῶνας⸃·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/002.yaml
  text: in these last days he has spoken to us in a Son[a], whom he appointed heir of all things[b], through whom he also made the ages.
translation:
  language: ta
  text: இந்தக் கடைசி நாட்களில் அவர் ஒரு மகன் மூலமாக[a] நம்மிடம் பேசியிருக்கிறார். அந்த மகனை எல்லாவற்றுக்கும் வாரிசாக நியமித்தார்; அந்த மகன் மூலமாக யுகங்களையும்[b] உண்டாக்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மகனில்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் சொற்சொல்லாக ‘மகனில்’ என்ற அமைப்பு உள்ளது; ‘மகன்’ என்பதற்கு முன் நிர்ணயக் கட்டுரை இல்லை. இது கடவுள் பேசிய விதத்தையும், அவரது வெளிப்பாட்டின் உச்சநிலையையும் வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘பிரபஞ்சத்தையும்’ அல்லது ‘உலகங்களையும்’ என்றும் மொழிபெயர்க்கலாம். ‘யுகங்கள்’ எனும் கிரேக்கச் சொல் யுகங்களையே குறிக்கலாம்; விரிவான பொருளில் படைக்கப்பட்ட முழு ஒழுங்கையும் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπ’ ἐσχάτου τῶν ἡμερῶν τούτων
  choice: இந்தக் கடைசி நாட்களில்
  rationale: இது காலத்தைக் குறிக்கும் கிரேக்க மரபுத்தொடரை இயல்பான நவீனத் தமிழில் தருகிறது; அதேவேளையில் இறுதிக்கால முக்கியத்துவத்தையும் காக்கிறது.
- source_word: ἐλάλησεν
  choice: பேசியிருக்கிறார்
  rationale: கிரேக்க இறந்தகால வினை முடிவுற்ற நிகழ்வைக் குறிக்கிறது. அதன் இன்றைய தொடர்பையும், முந்தைய வசனத்திலுள்ள முற்காலப் பேச்சுடனான வேறுபாட்டையும் தமிழில் இயல்பாக வெளிப்படுத்த இந்த வடிவம் ஏற்றது.
- source_word: ἐν υἱῷ
  choice: ஒரு மகன் மூலமாக
  rationale: ἐν என்பதன் வழிமுறை சார்ந்த பொருளை இயல்பான தமிழில் ‘மூலமாக’ வெளிப்படுத்துகிறது. கிரேக்கத்தில் ‘மகன்’ என்பதற்கு முன் சுட்டுச்சொல் இல்லாததை ‘ஒரு’ ஓரளவு வெளிப்படுத்துகிறது; இதன் நுணுக்கம் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ὃν ἔθηκεν
  choice: அந்த மகனை ... நியமித்தார்
  rationale: τίθημι இங்கு ஒருவரை ஒரு நிலை அல்லது பொறுப்பில் ஏற்படுத்துவதைச் சுட்டுவதால் ‘நியமித்தார்’ என்பது தெளிவான இயல்பான தெரிவாகும். தொடர்புப்பெயரின் குறிப்பு தமிழில் தெளிவாக இருக்க ‘அந்த மகனை’ எனத் தரப்பட்டுள்ளது.
- source_word: κληρονόμον πάντων
  choice: எல்லாவற்றுக்கும் வாரிசாக
  rationale: πάντων என்பதன் பரந்த அளவையும் κληρονόμος என்பதன் வாரிசுரிமைப் பொருளையும் நேரடியாகக் காக்கிறது.
- source_word: δι’ οὗ
  choice: அவர் மூலமாக
  rationale: διά + உரிமை வேற்றுமை இடைநிலைக் கருவி அல்லது செயலாற்றுபவரைக் குறிக்கிறது; ‘மூலமாக’ அதனை இயல்பாகத் தருகிறது.
- source_word: ἐποίησεν
  choice: உண்டாக்கினார்
  rationale: ποιέω என்பதன் பொதுவான ‘செய்தல்/உண்டாக்குதல்’ பொருளைத் தக்கவைத்து, κτίζω என்பதற்குரிய மிகக் குறிப்பான ‘படைத்தல்’ என்ற சொல்லைத் தேவையின்றி இறக்குமதி செய்யாமல் இருக்கிறது.
- source_word: τοὺς αἰῶνας
  choice: யுகங்களையும்
  rationale: αἰῶνες என்பதன் காலம்சார் அடிப்படைப் பொருளைத் தக்கவைக்கிறது; அது படைக்கப்பட்ட முழு ஒழுங்கையும் குறிக்கக்கூடிய விரிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: ἐν υἱῷ என்பதன் கிறிஸ்துவியல் வலிமை
  choice: ‘ஒரு மகன் மூலமாக’ என்று மொழிபெயர்த்து, சுட்டுச்சொல் இல்லாத கிரேக்க அமைப்பையும் வெளிப்பாட்டின் வழிமுறையையும் காட்டுதல்
  alternative: ‘மகனில்’; ‘தமது மகன் மூலமாக’; ‘மகன் வழியாக’
  rationale: கிரேக்கச் சொற்றொடர் வழக்கத்திற்கு மாறானதும் வலியுறுத்தல் கொண்டதும் ஆகும். ‘தமது மகன்’ என்பது மூலத்தில் இல்லாத உடைமைச் சுட்டைச் சேர்க்கும்; ‘மகனில்’ தமிழில் இயல்பற்றதாகவும் குழப்பமாகவும் இருக்கும். தேர்ந்த வடிவம் கிரேக்கத்தின் கட்டுரையற்ற அமைப்பை ஓரளவு காத்து, தமிழில் புரியத்தக்கதாக உள்ளது.
- issue: τοὺς αἰῶνας என்பதன் படைப்புசார் பரப்பு
  choice: முதன்மை உரையில் ‘யுகங்கள்’ என்றும், அடிக்குறிப்பில் ‘பிரபஞ்சம்/உலகங்கள்’ என்ற விரிவான பொருளையும் தருதல்
  alternative: ‘பிரபஞ்சம்’; ‘உலகங்கள்’; ‘உலகம்’
  rationale: αἰῶνες கால யுகங்களைக் குறிக்கலாம்; சூழலின்படி முழுப் படைக்கப்பட்ட ஒழுங்கையும் குறிக்கலாம். ‘யுகங்கள்’ மூலச்சொல்லின் கால-பிரபஞ்ச அகலத்தைச் சுருக்காமல் காக்கிறது; அடிக்குறிப்பு பொதுவான படைப்புசார் புரிதலைத் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய மரியாதையான நடையில் வடிவமைக்கப்பட்டது. ‘ஒரு மகன் மூலமாக’ என்பது தமிழில் சற்றே குறியிடப்பட்ட அமைப்பாக இருந்தாலும் மூலத்தின் கட்டுரையற்ற கிறிஸ்துவியல் சொற்றொடரை மறைக்காமல் காக்கிறது. ‘யுகங்கள்’ காலம்சார் மற்றும் பிரபஞ்சம்சார் இரு சாத்தியங்களுக்கும் இடமளிக்கிறது.
