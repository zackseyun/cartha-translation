source:
  edition: SBLGNT
  text: ἠγάπησας δικαιοσύνην καὶ ἐμίσησας ἀνομίαν· διὰ τοῦτο ἔχρισέν σε ὁ θεός, ὁ θεός σου, ἔλαιον ἀγαλλιάσεως παρὰ τοὺς μετόχους σου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/009.yaml
  text: You have loved righteousness and hated lawlessness; therefore God[a], your God, has anointed you with the oil of gladness beyond your companions.
translation:
  language: ta
  text: நீ நீதியை[a] நேசித்தாய், நெறிகேட்டை வெறுத்தாய்; ஆகையால் கடவுள்—உன் கடவுள்—உன் தோழர்களைவிட மேலாக மகிழ்ச்சியின் எண்ணெயால் உன்னை அபிஷேகம் செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நீதி’ என மொழிபெயர்க்கப்பட்ட கிரேக்கச் சொல் நெறிசார் நேர்மையையோ நீதியையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγάπησας
  choice: நேசித்து
  rationale: இறந்தகால வினையெச்சமாக அமைத்து, அடுத்துள்ள ‘வெறுத்தாய்’ என்பதோடு இயல்பான தமிழ்ச் சமநிலையை உருவாக்குகிறது; கிரேக்க இறந்தகாலச் செயலைப் பாதுகாக்கிறது.
- source_word: δικαιοσύνην
  choice: நீதியை
  rationale: நெறிசார் நேர்மையையும் நீதியையும் உள்ளடக்கக்கூடிய இயல்பான தமிழ்ச் சொல்; கிரேக்கச் சொல்லின் பொருள் விரிவை தேவையின்றிக் குறுக்கவில்லை.
- source_word: ἐμίσησας
  choice: வெறுத்தாய்
  rationale: ‘நேசித்து’ என்பதற்கு எதிரான வலுவான நெறிசார் மாறுபாட்டை நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἀνομίαν
  choice: நெறிகேட்டை
  rationale: சட்டத்தையும் ஒழுக்க நெறியையும் மீறும் தன்மையைத் தெளிவாகக் காட்டுகிறது; ‘அக்கிரமம்’ என்பதைவிட இன்றைய வாசகருக்கு வெளிப்படையானது.
- source_word: διὰ τοῦτο
  choice: ஆகையால்
  rationale: முன்னுள்ள நேசித்தல்–வெறுத்தல் காரணமாகத் தொடர்ந்து வரும் அபிஷேகம் நிகழ்வதைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: ἔχρισέν
  choice: அபிஷேகம் செய்தார்
  rationale: அரசருக்குரிய மற்றும் மேசியாவுக்குரிய எண்ணெய் பூசும் உருவகத்தைப் பாதுகாக்கும், தமிழ் கிறிஸ்தவ வாசகர்களுக்கு நன்கு புரியும் சொற்றொடர்.
- source_word: ὁ θεός, ὁ θεός σου
  choice: கடவுள்—உன் கடவுள்—
  rationale: ‘கடவுள்’ என்ற மீளுரைப்பையும் உறவுசார் குறிப்பையும் அப்படியே வைத்திருந்து, அதன் கிறிஸ்தியல் பதற்றத்தை விளக்கிச் சமப்படுத்தவில்லை.
- source_word: ἔλαιον ἀγαλλιάσεως
  choice: மகிழ்ச்சியின் எண்ணெயால்
  rationale: திருப்பாடல் மேற்கோளின் கொண்டாட்ட மற்றும் அர்ப்பணிப்பு உருவகத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: παρὰ τοὺς μετόχους σου
  choice: உன் தோழர்களைவிட மேலாக
  rationale: παρά குறிக்கும் ஒப்பீட்டு மேன்மையையும் μέτοχοι குறிக்கும் உடனிருப்போர் அல்லது பங்குபெறுவோர் உறவையும் வாசிக்க எளிய தமிழில் தருகிறது.
theological_decisions:
- issue: δικαιοσύνην என்பதன் நெறிசார் நீதி மற்றும் சமூக நீதி சார்ந்த பொருள் விரிவு
  choice: நீதி
  alternative: நேர்மை; நீதிநெறி
  rationale: ‘நீதி’ இரு நுணுக்கங்களையும் தமிழில் தாங்கக்கூடியது. கிரேக்கச் சொல்லின் பொருள் விரிவை அடிக்குறிப்பு வெளிப்படையாகக் குறிப்பிடுகிறது.
- issue: குமாரனைப் பற்றிய சூழலில் ‘கடவுள்—உன் கடவுள்’ என்ற சொற்றொடர்
  choice: மீளுரைப்பையும் உறவுசார் வேறுபாட்டையும் அப்படியே வைத்தல்
  alternative: திரித்துவ உறவை விளக்கும் விரிவுரை
  rationale: மூலவசனத்தின் உயர்ந்த கிறிஸ்தியல் மொழியையும் ‘உன் கடவுள்’ என்ற குறிப்பையும் ஒன்றாகப் பாதுகாத்து, மொழிபெயர்ப்பில் கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
- issue: அபிஷேகத்தின் ஒப்பீட்டு அளவு
  choice: உன் தோழர்களைவிட மேலாக
  alternative: உன் தோழர்களுக்கு மேலாக; உன் பங்காளிகளைவிட அதிகமாக
  rationale: மூலத்தில் உள்ள ஒப்பீட்டு மேன்மையைப் பாதுகாக்கிறது; அது தோழர்களுக்கு அபிஷேகம் இல்லை என்று அவசியமாகக் கூறுவதில்லை.
translation_notes:
  register: நவீனத் தரத்தமிழில், மரியாதையும் வேதாகம மேற்கோளுக்குரிய உயர்வும் காக்கப்பட்டுள்ளன. ‘அபிஷேகம்’ பரவலாக அறியப்படும் சமயச் சொல் என்பதால் பயன்படுத்தப்பட்டுள்ளது. இடைக்கோடுகள் ‘கடவுள்—உன் கடவுள்’ என்ற மூல மீளுரைப்பைத் தெளிவாக வைத்திருக்கின்றன.
