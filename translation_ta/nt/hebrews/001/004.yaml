  yaml_path: translation/nt/hebrews/001/004.yaml
  text: having become as much superior to the angels as the name he has inherited is more excellent than theirs.
translation:
  language: ta
  text: அவர் மரபுரிமையாகப் பெற்ற பெயர் அவர்களுடைய பெயரைவிட எவ்வளவு மேன்மையானதோ, அவ்வளவு அவர் வானதூதர்களைவிட மேலானவரானார்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “வானதூதர்களைவிடச் சிறந்தவரானார் … அவர்களுடையதைவிட மிகச் சிறப்பானது.”'
    reason: lexical_alternative
  - marker: b
    text: இங்கு கூறப்படும் “பெயர்” அடுத்து வரும் சூழலில் மகனுடைய பட்டத்தையும் நிலையையும் சுட்டுவதாகத் தெளிவாகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: τοσούτῳ ... ὅσῳ
  choice: எவ்வளவு ... அவ்வளவு
  rationale: இணைஒப்பீட்டின் அளவுவிகிதத்தை இயல்பான தமிழ் வரிசையில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: κρείττων
  choice: உயர்ந்தவர்
  rationale: இங்கு அறநன்மையை அல்ல, வானதூதர்களுக்கு மேலான நிலை மற்றும் மேன்மையைக் குறிக்கிறது.
- source_word: γενόμενος
  choice: ஆனார்
  rationale: கிரேக்க வினையின் ‘ஆகுதல்’ என்ற பொருளை நேரடியாக வைத்திருக்கிறது; ‘உருவாக்கப்பட்டார்’ என்ற தேவையற்ற படைப்பு சார்ந்த உட்பொருளைத் தவிர்க்கிறது.
- source_word: τῶν ἀγγέλων
  choice: வானதூதர்களைவிட
  rationale: ஒப்பீட்டு அமைப்புக்கேற்ற இயல்பான தமிழாக்கம்.
- source_word: διαφορώτερον
  choice: மேன்மையானது
  rationale: பெயரின் மிகுந்த சிறப்பு மற்றும் மேம்பட்ட தன்மையைச் சுட்டுகிறது; வெறும் ‘வேறுபட்டது’ என்பதைவிட ஒப்பீட்டு வலிமையைப் பாதுகாக்கிறது.
- source_word: παρ’ αὐτοὺς
  choice: அவர்களுடைய பெயரைவிட
  rationale: ஒப்பிடப்படுவது பெயர் என்பதைத் தமிழில் தெளிவாக்கத் ‘பெயர்’ மீண்டும் வழங்கப்பட்டுள்ளது.
- source_word: κεκληρονόμηκεν
  choice: பெற்றுக்கொண்ட
  rationale: perfect காலத்தின் விளைவுநிலையை இயல்பான தமிழில் தெரிவிக்கிறது; ‘சுதந்தரித்த’ என்பதன் இன்றைய வாசகத் தெளிவின்மையைத் தவிர்க்கிறது.
- source_word: ὄνομα
  choice: பெயர்
  rationale: அடுத்துள்ள சூழல் அதன் மகனுக்குரிய பெயர்/நிலையை விளக்க அனுமதிக்கும் வகையில் மூலத்தின் சொற்பொருள் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: γενόμενος என்பதன் கிறிஸ்துவியல் உட்பொருள்
  choice: ‘உயர்ந்தவரானார்’ என்று ஆகுதல் சார்ந்த வினையை நேராக மொழிபெயர்த்தல்
  alternative: ‘உயர்ந்தவராக உருவாக்கப்பட்டார்’ என்று மொழிபெயர்த்தல்
  rationale: மூல வினையின் இயக்கத்தைப் பாதுகாத்தபடியே, மகன் படைக்கப்பட்டவர் என்ற பொருளைத் தமிழாக்கம் தேவையின்றி புகுத்தாமல் இருக்கிறது; சூழல் அவரது உயர்த்தப்பட்ட நிலையை வானதூதர்களுடன் ஒப்பிடுகிறது.
- issue: ‘பெயர்’ என்பதன் பொருள்
  choice: வசனத்தில் ‘பெயர்’ என்றே வைத்து, அடுத்த சூழல் அதை விளக்க அனுமதித்தல்
  alternative: ‘மகன் என்ற பட்டம்’ என்று வெளிப்படையாக விரித்துரைத்தல்
  rationale: மூலம் இவ்வசனத்தில் ‘பெயர்’ என்று மட்டுமே கூறுகிறது; அடுத்த வசனங்கள் அதன் மகனுக்குரிய அடையாளம்/நிலையை வெளிப்படுத்துகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிதான நடையைப் பயன்படுத்துகிறது. கிரேக்கத்தின் விகித ஒப்பீட்டைத் தமிழுக்கேற்ற ‘எவ்வளவு … அவ்வளவு’ வரிசையில் அமைத்துள்ளது; ‘பெயர்’ என்ற இலக்கியத் திறப்பை முன்னதாக விளக்கிப் பூட்டவில்லை.
