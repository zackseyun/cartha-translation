source:
  edition: SBLGNT
  text: πρὸς δὲ τὸν υἱόν· Ὁ θρόνος σου ὁ θεὸς εἰς τὸν αἰῶνα τοῦ αἰῶνος, ⸂καὶ ἡ ῥάβδος τῆς εὐθύτητος⸃ ῥάβδος τῆς βασιλείας ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/008.yaml
  text: But of the Son he says[a], “Your throne, O God, is forever and ever[b], and the scepter of uprightness is the scepter of your kingdom.”
translation:
  language: ta
  text: 'ஆனால் மகனைப் பற்றி அவர் கூறுவது: “தேவனே, உமது அரியணை என்றென்றும் உள்ளது[a]; நேர்மையின் செங்கோலே உமது ஆட்சியின் செங்கோல்[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, சாத்தியம் குறைவாக: “தேவன் உமது அரியணை என்றென்றும் இருக்கிறார்.” கிரேக்கத் தொடரின் இலக்கணம் குறித்து விவாதம் உள்ளது; எனினும், “தேவனே, உமது அரியணை” என்ற நேரடி அழைப்பு சூழலுக்கும் மேற்கோளின் வலிமைக்கும் சிறப்பாகப் பொருந்துகிறது.'
    reason: alternative_reading
  - marker: b
    text: அல்லது, “நீதியின் செங்கோல்.” கிரேக்கச் சொல் நேர்மை, செம்மை அல்லது நீதி என்ற பொருளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τὸν υἱόν
  choice: மகனைக் குறித்தோ அவர் கூறுவது
  rationale: πρός என்பதன் குறிப்புறுத்தும் பொருளையும், முன் கூறப்பட்ட தூதர்களுடனான மாறுபாட்டையும் இயல்பான தமிழில் காட்டுகிறது; கிரேக்கத்தில் மறைந்துள்ள ‘கூறுகிறார்’ என்ற வினை தமிழில் வெளிப்படையாக வழங்கப்படுகிறது.
- source_word: υἱόν
  choice: மகன்
  rationale: இங்கு இது குறிப்பிட்ட பட்டப்பெயராக வந்து, எபிரெயர் 1-இல் உள்ள கிறிஸ்துவைக் குறிக்கிறது.
- source_word: Ὁ θρόνος σου ὁ θεὸς
  choice: தேவனே, உமது அரியணை
  rationale: ὁ θεός என்பதை நேரடி அழைப்பாகப் புரிந்துகொள்வது மேற்கோளின் சூழலுக்கும் அதன் வலிமைக்கும் சிறப்பாகப் பொருந்துகிறது. இலக்கண ரீதியில் சாத்தியமான மற்றொரு புரிதல் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: εἰς τὸν αἰῶνα τοῦ αἰῶνος
  choice: என்றென்றும் நிலைத்திருக்கும்
  rationale: முடிவில்லாத காலத்தைச் சுட்டும் கிரேக்க மரபுத்தொடரை இயல்பாகவும் கண்ணியமாகவும் தெரிவிக்கிறது; தமிழில் முழுமையான வாக்கியமாக அமைய ‘நிலைத்திருக்கும்’ சேர்க்கப்பட்டுள்ளது.
- source_word: ῥάβδος
  choice: செங்கோல்
  rationale: அரச அதிகாரத்தின் அடையாளமான ஆட்சிக்கோலைக் குறிக்கும் இச்சூழலில் ‘செங்கோல்’ துல்லியமான, இயல்பான தமிழ்ச் சொல்.
- source_word: τῆς εὐθύτητος
  choice: நேர்மையின்
  rationale: εὐθύτης என்பதன் நேர்மை, செம்மை என்ற அடிப்படை உணர்வைத் தருகிறது. ‘நீதியின்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ῥάβδος τῆς βασιλείας σου
  choice: உமது ஆட்சியின் செங்கோல்
  rationale: βασιλεία இங்கு அரசாட்சி அல்லது ஆளுகையைக் குறிக்கிறது. ‘ஆட்சி’ என்பது தற்போதைய வாசகருக்கு இயல்பாக இருந்து அரச அதிகாரத்தின் பொருளைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: ὁ θεός என்பது மகனை ‘தேவனே’ என்று நேரடியாக அழைக்கிறதா, அல்லது ‘தேவன் உமது அரியணை’ என்று பயனிலையாக அமைகிறதா?
  choice: ‘தேவனே, உமது அரியணை’ என்ற நேரடி அழைப்பு
  alternative: ‘தேவனே உமது அரியணை’ அல்லது ‘தேவன் உமது அரியணையாக இருக்கிறார்’
  rationale: எபிரெயர் 1-இன் வாத ஓட்டத்திலும் சங்கீத மேற்கோளின் வலிமையிலும் நேரடி அழைப்பு சிறப்பாகப் பொருந்துகிறது. எனினும், கிரேக்கத் தொடரின் இலக்கணம் குறித்து விவாதம் உள்ளதால் மாற்றுப் புரிதல் மறைக்கப்படாமல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பேணுகிறது. ‘உமது’, ‘அரியணை’, ‘செங்கோல்’ ஆகியவை அரசருக்குரிய மேற்கோளின் உயர்ந்த நடையைத் தக்கவைக்கின்றன; ‘ஆட்சி’ என்பது ‘ராஜ்யம்’ என்பதைக் காட்டிலும் இன்றைய சாதாரண வாசகருக்கு நேரடியாகப் புரியும் சொலாகத் தேர்ந்தெடுக்கப்பட்டுள்ளது.
