id: HEB.1.7
reference: Hebrews 1:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ πρὸς μὲν τοὺς ἀγγέλους λέγει· Ὁ ποιῶν τοὺς ἀγγέλους αὐτοῦ πνεύματα, καὶ τοὺς λειτουργοὺς αὐτοῦ πυρὸς φλόγα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/007.yaml
  text: And about the angels he says[a], “He makes his angels winds, and his ministers a flame of fire.”
translation:
  language: ta
  text: 'தேவதூதர்களைக் குறித்து அவர் கூறுகிறார்:


    “அவர் தமது தூதர்களைக் காற்றுகளாகவும்[a]


    தமது பணியாளர்களை நெருப்புச் சுடராகவும் ஆக்குகிறார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆவிகளாக.” கிரேக்கச் சொல் “காற்றுகள்” அல்லது “ஆவிகள்” என இருவிதமாகவும் பொருள்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς μὲν τοὺς ἀγγέλους
  choice: தேவதூதர்களைப் பற்றியோ
  rationale: இங்கு πρός என்பது நேரடியாகத் தேவதூதர்களிடம் பேசுவதைக் காட்டாமல், அவர்களைப் பற்றிச் சொல்லப்படுவதைக் குறிக்கிறது. μὲν அடுத்த வசனத்தில் குமாரனைப் பற்றிய மாறுபாட்டை எதிர்நோக்குவதால், ‘-ஓ’ அந்த ஒப்பீட்டு அமைப்பை இயல்பாகக் காட்டுகிறது.
- source_word: λέγει
  choice: அவர் சொல்வது
  rationale: வேதவாக்கு இப்போதும் பேசுகிறது என்ற மேற்கோள் நிகழ்காலத் தன்மையைத் தமிழில் இயல்பாகத் தக்கவைக்கிறது.
- source_word: Ὁ ποιῶν
  choice: ஆக்குகிறார்
  rationale: செயற்பாட்டு அர்த்தத்தையும் நிகழ்காலத்தையும் காக்கும் இயல்பான தமிழ் வடிவம்; ‘நியமிக்கிறார்’ என்று பொருளைச் சுருக்கவில்லை.
- source_word: ἀγγέλους
  choice: தூதர்களை
  rationale: மேற்கோளுக்குள் ‘தூதர்கள்’ என்பது இயல்பாக உள்ளது; வசனத்தின் அறிமுகத்தில் வரும் ‘தேவதூதர்கள்’ இதை விண்ணுலகத் தூதர்கள் எனத் தெளிவுபடுத்துகிறது.
- source_word: πνεύματα
  choice: காற்றுகளாக
  rationale: சங்கீதம் 104:4-ன் எபிரெயப் பின்னணிக்கும் ‘நெருப்புச் சுடர்’ என்ற இணை உருவகத்திற்கும் ‘காற்றுகள்’ நன்கு பொருந்துகிறது. ‘ஆவிகள்’ என்ற உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: λειτουργοὺς
  choice: பணியாளர்களை
  rationale: சேவை செய்பவர்களைக் குறிக்கும் சொல்லை இயல்பான, கண்ணியமான தமிழில் தருகிறது; பிற்காலத் திருச்சபைப் பதவிப் பொருளை தேவையின்றி இறக்குமதி செய்யாது.
- source_word: πυρὸς φλόγα
  choice: நெருப்புச் சுடராக
  rationale: கிரேக்கத்தின் ஒருமை வடிவத்தையும் கவித்துவ உருவகத்தையும் காக்கிறது.
- source_word: αὐτοῦ
  choice: தமது
  rationale: மேற்கோளில் செய்பவராகிய தேவனையே உடைமையாளராகத் தெளிவாகச் சுட்டும் மரியாதைமிக்க தற்சுட்டுப் பெயரடை.
theological_decisions:
- issue: சங்கீதம் 104:4 மேற்கோளில் πνεύματα என்பதன் பொருள்
  choice: காற்றுகள்
  alternative: ஆவிகள்
  rationale: இச்சொல் கிரேக்கத்தில் இரு பொருள்களையும் கொள்ளக்கூடியது. எபிரெயப் பின்னணியும் நெருப்புச் சுடருடன் அமைந்த கவித்துவ இணையும் ‘காற்றுகள்’ என்பதற்கு ஆதரவளிக்கின்றன; எனினும் இறையியல் முக்கியத்துவமுள்ள தெளிவின்மையை அடிக்குறிப்பு மூலம் தக்கவைக்கிறோம்.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. மேற்கோளின் கவித்துவ இணை அமைப்பு தக்கவைக்கப்பட்டுள்ளது; ‘தேவதூதர்கள்’ மற்றும் ‘தூதர்கள்’ என்ற வேறுபாடு சூழல் தெளிவையும் மேற்கோளின் சொல்வடிவத்தையும் சமநிலைப்படுத்துகிறது.
