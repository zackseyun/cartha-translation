reference: Hebrews 1:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Τίνι γὰρ εἶπέν ποτε τῶν ἀγγέλων· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε, καὶ πάλιν· Ἐγὼ ἔσομαι αὐτῷ εἰς πατέρα, καὶ αὐτὸς ἔσται μοι εἰς υἱόν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/005.yaml
  text: For to which of the angels did he ever say[a], “You are my Son; today I have begotten you”? And again, “I will be to him a father[c][b], and he will be to me a son”?
translation:
  language: ta
  text: 'ஏனெனில், தேவதூதர்களில் யாரிடமாவது அவர் எப்போதாவது[a],


    “நீர் என் மகன்;

    இன்று நான் உம்மைப் பிறப்பித்தேன்”[b]


    என்று, மேலும்,


    “நான் அவருக்குத் தந்தையாக இருப்பேன்;

    அவர் எனக்கு மகனாக இருப்பார்”[c]


    என்று சொன்னாரா?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் நேரடியாக, “எப்போதாவது சொன்னார்.”
    reason: lexical_alternative
  - marker: b
    text: இது சங்கீதம் 2:7-ஐ எதிரொலிக்கிறது. “இன்று நான் உம்மைப் பிறப்பித்தேன்” என்ற சொற்றொடர் அரச முடிசூட்டல், உயிர்த்தெழுதல் அல்லது மகனுக்கும் பிதாவுக்கும் இடையிலான நித்திய உறவு ஆகியவற்றோடு தொடர்புபடுத்திப் புரிந்துகொள்ளப்பட்டுள்ளது; மொழிபெயர்ப்பு இவற்றில் ஒன்றைத் தீர்மானிக்காமல் மூலச் சொல்லாட்சியைப் பாதுகாக்கிறது.
    reason: cross_reference
  - marker: c
    text: 2 சாமுவேல் 7:14-இலிருந்து மேற்கோள். இன்னும் வழக்கமான தமிழில், “நான் அவருடைய தந்தையாக இருப்பேன்; அவர் என்னுடைய மகனாக இருப்பார்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Τίνι ... τῶν ἀγγέλων
  choice: தேவதூதர்களில் யாரிடமாவது
  rationale: வினாவுக்குரிய வேற்றுமையையும், தேவதூதர்களின் தொகுதியில் ஒருவரைக்கூடக் குறிக்க முடியாது என்ற சொல்லாட்சியின் வலிமையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தின் வாதத்திற்கான விளக்கத்தை இவ்வசனம் தருகிறது என்பதைத் தெளிவாக இணைக்கிறது.
- source_word: εἶπέν ποτε
  choice: எப்போதாவது ... சொன்னாரா
  rationale: எந்த ஒரு சமயத்திலாவது இப்படிச் சொன்னதுண்டா என்ற மறுப்பை எதிர்பார்க்கும் வினாவின் வலிமையைப் பாதுகாக்கிறது.
- source_word: ἀγγέλων
  choice: தேவதூதர்கள்
  rationale: எபிரெயர் 1-ன் சூழலில் மனிதத் தூதர்கள் அல்ல, வானுலகத் தேவதூதர்களே குறிக்கப்படுகின்றனர்.
- source_word: Υἱός μου εἶ σύ
  choice: நீர் என் மகன்
  rationale: நேரடி அழைப்பையும் மகன் என்ற உறவுப்பெயரையும், மரியாதையானதும் இயல்பானதுமான நவீன தமிழில் தருகிறது.
- source_word: σήμερον
  choice: இன்று
  rationale: காலத்தைக் குறிக்கும் சொல்லை விளக்கவுரை இன்றியே நேரடியாக மொழிபெயர்க்கிறது.
- source_word: γεγέννηκά σε
  choice: நான் உம்மைப் பிறப்பித்தேன்
  rationale: γεννάω என்பதன் பிறப்பித்தல்/தந்தையாகுதல் உருவகத்தைப் பாதுகாத்து, முடிசூட்டல், உயிர்த்தெழுதல் அல்லது நித்திய உறவு ஆகிய எந்த விளக்கத்தையும் மொழிபெயர்ப்பிலேயே தீர்மானிக்கவில்லை.
- source_word: καὶ πάλιν
  choice: மேலும்
  rationale: மற்றொரு வேதமேற்கோள் வாதத்துடன் சேர்க்கப்படுவதை இயல்பான தமிழில் காட்டுகிறது.
- source_word: Ἐγὼ ἔσομαι αὐτῷ εἰς πατέρα
  choice: நான் அவருக்குத் தந்தையாக இருப்பேன்
  rationale: εἰς + பெயர்ச்சொல் அமைப்பின் உடன்படிக்கை சார்ந்த முறையான தொனியையும் உறவின் பரஸ்பர அமைப்பையும் காக்கிறது.
- source_word: καὶ αὐτὸς ἔσται μοι εἰς υἱόν
  choice: அவர் எனக்கு மகனாக இருப்பார்
  rationale: முந்தைய அடியுடன் உள்ள இணை அமைப்பைப் பாதுகாத்து, இயல்பான தமிழில் உறவை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இரண்டு பழைய ஏற்பாட்டு மேற்கோள்களிலும் வரும் மகன் மொழி
  choice: இரண்டிலும் ‘மகன்’ என்று மொழிபெயர்த்து, சூழலில் இரு மேற்கோள்களும் மகனுக்குப் பயன்படுத்தப்படுவதை வாசகர் காணுமாறு விடப்பட்டுள்ளது.
  alternative: முதல் இடத்தில் தனித்த கிறிஸ்தவப் பட்டமாகவும் இரண்டாவது இடத்தில் உடன்படிக்கை உறவாகவும் வேறுபடுத்திக் காட்டுதல்.
  rationale: கிரேக்கத்தின் பெரிய/சிறிய எழுத்து வேறுபாட்டைத் தமிழ் இயல்பாக வெளிப்படுத்தாது. ஆகவே தமிழில் செயற்கையான வேறுபாட்டைச் சேர்க்காமல், இலக்கிய மற்றும் கிறிஸ்துவியல் தொடர்பைச் சூழலே காட்ட அனுமதிக்கப்படுகிறது.
- issue: ‘நான் உம்மைப் பிறப்பித்தேன்’ என்பதன் பொருள்
  choice: மேற்கோளின் பிறப்பித்தல் மொழி அப்படியே பாதுகாக்கப்பட்டுள்ளது.
  alternative: அதை அரச முடிசூட்டல், உயிர்த்தெழுதல், மனிதப் பிறப்பு அல்லது பிதாவுடனான நித்திய உறவு என்று வெளிப்படையாகப் பொருளுரைத்தல்.
  rationale: சங்கீதம் 2:7-ன் மொழியை எபிரெயர் ஆசிரியர் கிறிஸ்துவைப் பற்றிய வாதத்தில் பயன்படுத்துகிறார்; ஆனால் இந்த வசனம் மட்டுமே அந்தச் சொற்றொடரின் எல்லா இறையியல் தொடர்புகளிலும் ஒன்றைத் தேர்ந்தெடுத்து மற்றவற்றை நீக்கவில்லை.
translation_notes:
  register: மரியாதைமிக்க நேரடி அழைப்புக்கு ‘நீர்/உம்மை’ பயன்படுத்தப்பட்டுள்ளது; தேவனைச் சுட்டும் மூன்றாம் நபர் வடிவத்தில் நவீன நிலையான தமிழுக்கேற்ற ‘அவர்’ கையாளப்பட்டுள்ளது. கவிதை மேற்கோள்களின் இணை அமைப்பு வரிப் பிரிப்பால் தெளிவாக்கப்பட்டுள்ளது. ‘குமாரன்’ என்பதற்குப் பதிலாக பொதுவாகப் புரியும் ‘மகன்’ தேர்ந்தெடுக்கப்பட்டாலும், வசனத்தின் உயர்ந்த மற்றும் இறையியல் தொனி காக்கப்பட்டுள்ளது.
