id: HEB.6.15
reference: Hebrews 6:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ οὕτως μακροθυμήσας ἐπέτυχεν τῆς ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/015.yaml
  text: And so[a], after waiting patiently, he obtained the promise.
translation:
  language: ta
  text: இவ்வாறு, பொறுமையுடன் காத்திருந்தபின், அவர் வாக்குத்தத்தத்தைப் பெற்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வாக்குத்தத்தம் செய்யப்பட்டதைப் பெற்றார்.’ கிரேக்க மொழியில் இன்னும் நேரடியாக, ‘வாக்குத்தத்தத்தைப் பெற்றார்’ என்று உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ οὕτως
  choice: இவ்வாறு
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட ஆணையுடனான வாக்குறுதியைத் தொடர்ந்து, முறையையும் விளைவையும் இணைக்கும் இயல்பான தமிழ் தொடர்.
- source_word: μακροθυμήσας
  choice: பொறுமையுடன் காத்திருந்தபின்
  rationale: நீண்ட காலம் பொறுமையோடு நிலைத்திருப்பதைச் சுட்டும் இறந்தகாலப் பங்கேற்பு வடிவத்தை, சூழலுக்கேற்ற காலத் தொடர்புடன் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐπέτυχεν
  choice: பெற்றார்
  rationale: எட்டிப்பெறுதல் அல்லது அடைதல் என்ற பொருளைத் தருகிறது; தமிழில் வாக்குத்தத்தத்துடன் இயல்பாக இணைகிறது.
- source_word: τῆς ἐπαγγελίας
  choice: வாக்குத்தத்தத்தை
  rationale: குறிப்பிட்ட இறை வாக்கைக் குறிக்கும் பெயர்ச்சொல்லை அப்படியே தக்கவைத்து, அதன் நிறைவேற்றம் முழுமையாகப் பெற்றதாக உரை கூறுவதைவிட அதிகமாக விளக்குவதைத் தவிர்க்கிறது.
theological_decisions:
- issue: ἐπέτυχεν τῆς ἐπαγγελίας என்பது வாக்குத்தத்தத்தையே பெற்றதா அல்லது வாக்குத்தத்தம் செய்ததைப் பெற்றதா?
  choice: வாக்குத்தத்தத்தைப் பெற்றார்
  alternative: வாக்குத்தத்தம் செய்யப்பட்டதைப் பெற்றார்
  rationale: கிரேக்க உரை நேரடியாக ‘வாக்குத்தத்தத்தை’ என்கிறது. எபிரெயர் நூலில் உள்ள நிறைவேற்றம் குறித்த பதற்றத்தைத் தீர்மானித்து விடாமல், மூலத்தின் சொற்றொடரையும் இறையியல் தெளிவின்மையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘வாக்குத்தத்தம்’ என்ற பரவலாக அறியப்பட்ட இறையியல் சொல், சுற்றியுள்ள பகுதியுடனான சொல் தொடர்பைப் பாதுகாக்கிறது.
