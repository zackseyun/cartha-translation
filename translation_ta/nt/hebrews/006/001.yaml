  source_fidelity: 'மூலத்தின் முக்கியக் கூறுகள் தக்கவைக்கப்பட்டுள்ளன: inferential Διὸ, தொடக்க/அடிப்படைப் போதனையிலிருந்து முன்னேறுதல், τελειότης-இன் ‘முதிர்ச்சி’ உணர்வு, φερώμεθα-வின் செயப்பாட்டு நுணுக்கு, மற்றும் ‘இறந்த செயல்கள்’ என்ற திறந்த உருவகம். ஆனால் μὴ ... καταβαλλόμενοι என்பது ‘கொண்டுசெல்லப்படுவோமாக’ என்ற முதன்மை அறிவுறுத்தலுடன் இணைந்த மறுப்புப் பங்கேற்பாக உள்ளது. வரைவு அதைத் தனி எதிர்மறை கட்டளையாகப் பிரிக்கிறது; இதனால் வாக்கியத் தொடர்பு சிறிது தளர்கிறது.'
