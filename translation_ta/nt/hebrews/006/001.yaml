source:
  edition: SBLGNT
  text: Διὸ ἀφέντες τὸν τῆς ἀρχῆς τοῦ Χριστοῦ λόγον ἐπὶ τὴν τελειότητα φερώμεθα, μὴ πάλιν θεμέλιον καταβαλλόμενοι μετανοίας ἀπὸ νεκρῶν ἔργων, καὶ πίστεως ἐπὶ θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/001.yaml
  text: Therefore[a], leaving the elementary message about the Messiah, let us be carried on to maturity, not laying again a foundation of repentance from dead works and of faith toward God[d][c][b],
translation:
  language: ta
  text: ஆகவே, மேசியாவைப் பற்றிய தொடக்கநிலைப் போதனையை விட்டுவிட்டு[a], முதிர்ச்சியை நோக்கி நாம் முன்னே கொண்டுசெல்லப்படுவோமாக[b][c], இறந்த செயல்களிலிருந்து மனந்திரும்புதல் மற்றும் கடவுளை நோக்கிய விசுவாசம்[d] ஆகியவற்றின் அடித்தளத்தை மீண்டும் அமைக்காமல்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மேசியாவைப் பற்றிய ஆரம்பச் செய்தி’ அல்லது ‘மேசியாவைப் பற்றிய அடிப்படைப் போதனை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘நிறைவை நோக்கி’ அல்லது ‘பரிபூரணத்தை நோக்கி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘நாம் முன்னேறுவோமாக’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கத்தில் இன்னும் சொல்லுக்குச் சொல் வடிவில், ‘நாம் கொண்டுசெல்லப்படுவோமாக’ என்ற செயப்பாட்டு உணர்வு உள்ளது.
    reason: lexical_alternative
  - marker: d
    text: ‘கடவுள்மேல் விசுவாசம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Διὸ
  choice: ஆகவே
  rationale: முந்தைய கருத்துகளிலிருந்து வரும் முடிவையும் அதனைத் தொடரும் அறிவுறுத்தலையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: ἀφέντες
  choice: விட்டுவிட்டு
  rationale: அடிப்படைப் போதனையை நிராகரிப்பதை அல்ல, அதைத் தற்போதைய கவனமாக வைத்திராமல் அடுத்த நிலைக்குச் செல்வதைக் குறிக்கும் பங்கேற்புவினையின் முன்னிலைச் செயலைத் தெரிவிக்கிறது.
- source_word: τὸν τῆς ἀρχῆς τοῦ Χριστοῦ λόγον
  choice: மேசியாவைப் பற்றிய தொடக்கநிலைப் போதனை
  rationale: சிக்கலான உருபுத்தொடரை தமிழில் புரியும்படி அளிக்கிறது; λόγος என்பதற்கு இச்சூழலில் ‘போதனை’ பொருத்தமானது, τῆς ἀρχῆς ஆரம்ப அல்லது அடிப்படை நிலையைக் குறிக்கிறது.
- source_word: Χριστοῦ
  choice: மேசியா
  rationale: Χριστός இங்கு பெயராக மட்டும் அல்லாமல் பட்டப்பெயர் உணர்வுடன் வருவதால் ‘மேசியா’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ἐπὶ τὴν τελειότητα
  choice: முதிர்ச்சியை நோக்கி
  rationale: அடிப்படைப் போதனையிலிருந்து முழு வளர்ச்சிக்குச் செல்லும் சூழலைத் தெளிவாக்குகிறது; பாவமற்ற பரிபூரண நிலை என்ற தேவையற்ற உட்பொருளைத் தவிர்க்கிறது.
- source_word: φερώμεθα
  choice: நாம் கொண்டுசெல்லப்படுவோமாக
  rationale: கிரேக்க வினையின் நிகழ்காலச் செயப்பாட்டு உடன்பாட்டு உணர்வைப் பாதுகாக்கிறது; முன்னேற்றத்தை வெறும் சுயமுயற்சியாக மாற்றவில்லை.
- source_word: θεμέλιον καταβαλλόμενοι
  choice: அடித்தளத்தை மீண்டும் அமைக்க வேண்டாம்
  rationale: கட்டுமான உருவகத்தை இயல்பான தமிழில் காக்கிறது; μὴ மற்றும் பங்கேற்புவினை இணைந்த அறிவுறுத்தல் வடிவை வாசிக்க எளிதாக அளிக்கிறது.
- source_word: μετανοίας ἀπὸ νεκρῶν ἔργων
  choice: இறந்த செயல்களிலிருந்து மனந்திரும்புதல்
  rationale: μετάνοια என்பதன் நிலையான சூழற்பொருளை ‘மனந்திரும்புதல்’ எனவும், νεκρῶν ἔργων என்பதன் திட்டமிட்ட உருவகத் தெளிவின்மையை ‘இறந்த செயல்கள்’ எனவும் பாதுகாக்கிறது.
- source_word: πίστεως ἐπὶ θεόν
  choice: கடவுளை நோக்கிய விசுவாசம்
  rationale: ἐπί + வேற்றுமை உருபின் திசைநோக்கிய நுணுக்கத்தைத் தக்கவைக்கிறது; ‘கடவுள்மேல் விசுவாசம்’ என்பது இயல்பான மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: தொடக்கநிலைப் போதனையை ‘விட்டுவிடுதல்’ என்பது அதை நிராகரிப்பதா அல்லது அதிலிருந்து முன்னேறுவதா?
  choice: அதை நிராகரிக்காமல், அதையே மீண்டும் அடித்தளமாக அமைத்துக்கொண்டிராமல் முதிர்ச்சிக்குச் செல்லுதல்
  alternative: மேசியாவைப் பற்றிய அடிப்படைச் செய்தியையே முற்றிலும் கைவிடுதல்
  rationale: அடுத்ததாக வரும் ‘அடித்தளத்தை மீண்டும் அமைக்க வேண்டாம்’ என்ற சொற்றொடர், நிராகரிப்பை விட முன்னேற்றத்தையே சுட்டுகிறது.
- issue: τελειότης என்பது பரிபூரணமா, நிறைவா, முதிர்ச்சியா?
  choice: முதிர்ச்சி
  alternative: பரிபூரணம் அல்லது நிறைவு
  rationale: அடித்தளக் கற்பித்தலுடன் ஒப்பிடப்படும் வளர்ந்த நிலையை இச்சூழலில் ‘முதிர்ச்சி’ தெளிவாகக் காட்டுகிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- issue: φερώμεθα என்ற செயப்பாட்டு வடிவத்தைச் செயல்வினையாக மாற்றலாமா?
  choice: செயப்பாட்டு நுணுக்கத்துடன் ‘நாம் கொண்டுசெல்லப்படுவோமாக’
  alternative: ‘நாம் முன்னேறுவோமாக’
  rationale: மூலமொழியின் செயப்பாட்டு வடிவத்தைத் தக்கவைத்து, ஆன்மீக முன்னேற்றம் முற்றிலும் மனிதரின் சுய இயக்கம் என்ற கருத்தை மொழிபெயர்ப்பு தானாகச் சேர்ப்பதைத் தவிர்க்கிறது.
- issue: νεκρῶν ἔργων என்பதன் துல்லிய உட்பொருள்
  choice: விளக்கமின்றி ‘இறந்த செயல்கள்’ என்ற உருவகத்தைப் பாதுகாத்தல்
  alternative: ‘உயிரற்ற செயல்கள்’ அல்லது ‘மரணத்திற்கு வழிவகுக்கும் செயல்கள்’
  rationale: இந்தச் சொற்றொடர் பயனற்ற, ஆன்மீக உயிரற்ற, அல்லது மரணத்துடன் தொடர்புடைய செயல்களைச் சுட்டலாம்; ஒரு விளக்கத்தை மட்டும் முதன்மை உரையில் கட்டாயப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘கிரியைகள்’, ‘பூரணத்துவம்’ போன்ற பழைய அல்லது தொழில்நுட்பச் சொற்களுக்கு பதிலாக ‘செயல்கள்’, ‘முதிர்ச்சி’ பயன்படுத்தப்பட்டன. அதேவேளை மூலத்தின் கட்டுமான உருவகமும், செயப்பாட்டு வினையும், ‘இறந்த செயல்கள்’ என்ற இறையியல் பதற்றமும் பாதுகாக்கப்பட்டன.
