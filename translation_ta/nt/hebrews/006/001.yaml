  rationale: முதன்மை உரையில் பொருள்மாற்றம் எதுவும் செய்யப்படவில்லை. மூலத்தின் μὴ ... καταβαλλόμενοι பங்கேற்புத் தொடரைத் தனி கட்டளையாக்காமல், ‘கொண்டுசெல்லப்படுவோமாக’ என்பதோடு இணைத்துள்ளோம். ‘முன்னே’ என்பது φερώμεθα-வின் தொடர்ச்சியான முன்னேற்றக் கருத்தை இயல்பாக வெளிப்படுத்துகிறது; செயப்பாட்டு வடிவமும் பாதுகாக்கப்படுகிறது. அடிக்குறிப்பு அடையாளங்களும் அவற்றின் இடங்களும் பொருத்தமாக உள்ளன.
