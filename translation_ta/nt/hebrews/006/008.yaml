  text: ἐκφέρουσα δὲ ἀκάνθας καὶ τριβόλους ἀδόκιμος καὶ κατάρας ἐγγύς, ἧς τὸ τέλος εἰς καῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/008.yaml
  text: But if it bears thorns and thistles[a], it is worthless and near to being cursed, and its end is for burning.
translation:
  language: ta
  text: ஆனால் அது முட்களையும் நெருஞ்சிகளையும் விளைவித்தால், அது பயனற்றது[a], சாபத்திற்கு அருகில் உள்ளது; அதன் முடிவோ எரிக்கப்படுவதுதான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிராகரிக்கப்பட்டது.”
    reason: ἀδόκιμος என்பதற்கு ‘பயனற்றது’ என்பதோடு, சோதனையில் ஏற்கப்படாதது அல்லது நிராகரிக்கப்பட்டது என்ற பொருளும் உண்டு.
lexical_decisions:
- source_word: ἐκφέρουσα
  choice: விளைவித்தால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட நிலத்தையே பெண்பால் ஒருமை நிகழ்காலப் பெயரெச்சம் குறிக்கிறது. வேளாண்மை உருவகத்தில் நிலம் ஒன்றை உற்பத்தி செய்வதை இயல்பான தமிழில் தெரிவிக்கிறது; δὲ தரும் எதிர்மறை மாறுபாட்டுடன் நிபந்தனைத் தொடராக அமைக்கப்பட்டுள்ளது.
- source_word: δὲ
  choice: ஆனால்
  rationale: எபிரெயர் 6:7-இல் பயனுள்ள பயிரை விளைவிக்கும் நிலத்துடன் இவ்வசனத்தைத் தெளிவாக முரண்படுத்துகிறது.
- source_word: ἀκάνθας καὶ τριβόλους
  choice: முட்களையும் முட்பூண்டுகளையும்
  rationale: இருவகையான பயனற்ற, குத்தும் தாவரங்களைச் சுட்டும் வேளாண்மைச் சொல்லிணையை இயல்பான நவீனத் தமிழில் வேறுபடுத்திக் காட்டுகிறது.
- source_word: ἀδόκιμος
  choice: பயனற்றது
  rationale: சோதனையில் ஏற்றதாக அமையாத நிலத்தின் மதிப்பின்மையை உடனடி வேளாண்மைச் சூழலில் இயல்பாகத் தெரிவிக்கிறது. ‘நிராகரிக்கப்பட்டது’ என்ற வலுவான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: κατάρας ἐγγύς
  choice: சாபத்திற்கு அருகில் உள்ளது
  rationale: ἐγγύς உடன் வரும் பெயர்ச்சொல் அமைப்பைத் தக்கவைத்து, அதை ‘சபிக்கப்படவிருக்கிறது’ என்ற வினை வடிவமாக அதிகமாக விளக்காமல் விடுகிறது.
- source_word: ἧς τὸ τέλος
  choice: அதன் முடிவு
  rationale: முந்தைய வசனத்திலிருந்து தொடரும் நிலத்தைக் குறிக்கிறது; τέλος என்பதன் முடிவு அல்லது இறுதி விளைவு என்ற திறந்த பொருளையும் காக்கிறது.
- source_word: εἰς καῦσιν
  choice: எரிக்கப்படுவதுதான்
  rationale: நோக்கம் அல்லது இறுதி விளைவைத் தெரிவிக்கும் சொற்றொடரைத் தமிழில் இயல்பாகக் கொடுத்து, நெருப்பால் நிகழும் இறுதி நியாயத்தீர்ப்பு என்று உரையில் கூடுதலாக விளக்கவில்லை.
theological_decisions:
- issue: முந்தைய வசனத்திலுள்ள ‘நிலம்’ என்ற கருப்பொருளை இவ்வசனத்தில் மீண்டும் வெளிப்படையாகச் சேர்ப்பதா
  choice: ‘அது’ என்று குறிப்பிடுதல்
  alternative: ‘அந்த நிலம்’ அல்லது ‘நிலம்’ என்று மீண்டும் கூறுதல்
  rationale: கிரேக்கப் பெண்பால் பெயரெச்சம் முந்தைய வசனத்தின் நிலத்தைத் தெளிவாகத் தொடர்கிறது; ஆனால் இவ்வசனத்தில் அந்தப் பெயர்ச்சொல் மீண்டும் வராததால், தமிழில் சுட்டுப்பெயரால் தொடர்வது மூலத்தின் அமைப்பையும் உருவகத் தொடர்ச்சியையும் காக்கிறது.
- issue: ἀδόκιμος என்பதற்கு வலுவான இறையியல் நுணுக்கமுள்ள சொல்லைப் பயன்படுத்துவதா
  choice: முதன்மை உரையில் ‘பயனற்றது’; அடிக்குறிப்பில் ‘நிராகரிக்கப்பட்டது’
  alternative: முதன்மை உரையிலேயே ‘நிராகரிக்கப்பட்டது’ அல்லது ‘தகுதியற்றது’
  rationale: உடனடி வேளாண்மை உருவகத்தில் பயன் தராத நிலமே முன்னிலையில் உள்ளது. அதேவேளை, சோதனையில் ஏற்கப்படாதது என்ற வலுவான பொருளையும் அடிக்குறிப்பு வெளிப்படுத்துகிறது.
- issue: εἰς καῦσιν என்பதை இறுதி நியாயத்தீர்ப்பு அல்லது நரகம் என்று வெளிப்படையாக்குவதா
  choice: ‘எரிக்கப்படுவதுதான்’ என்ற உருவகத்தை மட்டும் தக்கவைத்தல்
  alternative: ‘நெருப்பினால் நியாயந்தீர்க்கப்படுவது’ அல்லது ‘நரகத்தில் எரிக்கப்படுவது’
  rationale: மூலம் வேளாண்மை உருவகத்தையே தருகிறது; அதன் முழுமையான இறையியல் குறிப்பு என்ன என்பதை இவ்வசனமே வெளிப்படையாகக் குறிப்பிடவில்லை. ஆகவே அந்தத் த tension-ஐ தீர்மானிக்காமல் உருவகம் பாதுகாக்கப்படுகிறது.
- issue: κατάρας ἐγγύς என்பதை நிகழவிருக்கும் சாபமாக மாற்றிக் கூறுவதா
  choice: ‘சாபத்திற்கு அருகில் உள்ளது’
  alternative: ‘சபிக்கப்படுவதற்கு அருகில் உள்ளது’ அல்லது ‘விரைவில் சபிக்கப்படும்’
  rationale: கிரேக்கத்தில் ‘சாபம்’ என்பது பெயர்ச்சொல்லாக உள்ளது. தேர்ந்த மொழிபெயர்ப்பு அந்த வடிவத்தையும், சாபம் ஏற்கெனவே நிகழ்ந்ததா அல்லது நெருங்குகிறதா என்ற நுணுக்கத்தையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. வேளாண்மை உருவகம், பெயர்ச்சொல் வடிவிலுள்ள ‘சாபம்,’ மற்றும் ‘எரித்தல்’ குறித்த இறையியல் திறந்தநிலை பாதுகாக்கப்பட்டுள்ளன.
