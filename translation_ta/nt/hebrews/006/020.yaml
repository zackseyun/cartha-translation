  text: ὅπου πρόδρομος ὑπὲρ ἡμῶν εἰσῆλθεν Ἰησοῦς, κατὰ τὴν τάξιν Μελχισέδεκ ἀρχιερεὺς γενόμενος εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/020.yaml
  text: where Jesus has entered as a forerunner on our behalf[b][a], having become a high priest forever according to the order of Melchizedek.
translation:
  language: ta
  text: அங்கு இயேசு நமக்காக[a] முன்னோடியாக நுழைந்தார்; அவர் மெல்கிசேதேக்கின் வரிசையின்படி[b] என்றென்றும் தலைமை ஆசாரியராக ஆனார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நமது சார்பாக’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடர் பிறருடைய நன்மைக்காகச் செய்யப்படும் செயலையும் பிரதிநிதித்துவத்தையும் குறிக்கலாம்; இங்கு இயேசு நம்மைச் சார்ந்து நுழைந்ததை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘மெல்கிசேதேக்கின் ஒழுங்கின்படி’ என்றும் மொழிபெயர்க்கலாம். இது சங்கீதம் 110:4-ஐ எதிரொலிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: ὅπου
  choice: அங்கு
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட திரைக்குப் பின்னுள்ள உட்பகுதியைச் சுட்டுகிறது; இடப்பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: πρόδρομος
  choice: முன்னோடியாக
  rationale: பிறர் பின்தொடர வழி திறக்கும் வகையில் முன்னே செல்பவர் என்ற உருவகத்தைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: ὑπὲρ ἡμῶν
  choice: நமக்காக
  rationale: நமது நன்மைக்காகவும் நமது சார்பாகவும் இயேசு நுழைந்தார் என்ற பிரதிநிதித்துவப் பொருளைக் கொண்டுள்ளது; ‘நமக்குப் பதிலாக’ என்ற குறுகிய பொருளைத் திணிக்கவில்லை.
- source_word: εἰσῆλθεν
  choice: நுழைந்தார்
  rationale: குறிப்பிட்ட இடத்திற்குள் சென்ற செயலை இயல்பாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: Ἰησοῦς
  choice: இயேசு
  rationale: தமிழில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: κατὰ τὴν τάξιν Μελχισέδεκ
  choice: மெல்கிசேதேக்கின் முறைப்படி
  rationale: சங்கீதம் 110:4-ன் எதிரொலியையும், மெல்கிசேதேக்கோடு ஒத்த அமைப்பு அல்லது நியமன முறையையும் காக்கிறது; கட்டாயமான வம்சத் தொடர்ச்சி என்ற எண்ணத்தை ஏற்படுத்தாது.
- source_word: ἀρχιερεὺς
  choice: தலைமைக் குரு
  rationale: வழிபாட்டு அமைப்பின் உயரிய குருத்துவப் பதவியை நவீன வாசகர்களுக்குப் புரியும் தமிழில் துல்லியமாகக் குறிக்கிறது.
- source_word: γενόμενος
  choice: ஆனார்
  rationale: இயேசு தலைமைக் குருவின் பதவியையும் பங்கையும் ஏற்றதைச் சொல்கிறது; அவருடைய இருப்பின் தொடக்கத்தையோ இயல்பின் மாற்றத்தையோ குறிக்கவில்லை.
- source_word: εἰς τὸν αἰῶνα
  choice: என்றென்றும்
  rationale: நிலைத்த நிரந்தரத்தைக் குறிக்கும் கிரேக்க மரபுத்தொடருக்கான தெளிவான, இயல்பான தமிழ் இணை.
theological_decisions:
- issue: γενόμενος என்பதற்கும் கிறிஸ்துவின் இயல்புக்கும் உள்ள தொடர்பு
  choice: ‘தலைமைக் குருவாக ஆனார்’ என்று பதவியும் பணியும் சார்ந்த கூற்றாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘தலைமைக் குருவாக நியமிக்கப்பட்டார்’
  rationale: கிரேக்க வினையெச்சத்தின் ‘ஆதல்’ என்ற கூறு மறைக்கப்படவில்லை; அதேவேளை, இயேசு அப்போதுதான் இருப்புக்கு வந்தார் அல்லது அவரது அடிப்படை இயல்பு மாறியது என்று மொழிபெயர்ப்பு கூறுவதில்லை.
- issue: ὑπὲρ ἡμῶν என்பதன் பொருள்
  choice: ‘நமக்காக’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘நமது சார்பாக’ அல்லது ‘நமக்குப் பதிலாக’
  rationale: இயேசு விசுவாசிகளுக்கு முன்னதாக, அவர்களின் நன்மைக்காகவும் அவர்களைப் பிரதிநிதித்துவப்படுத்தியும் நுழைந்தார் என்ற சூழலை இது காக்கிறது; இந்த வசனம் வெளிப்படையாகச் சொல்லாத குறிப்பிட்ட பரிகாரக் கோட்பாட்டுக்குள் பொருளைக் குறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளை கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘பிரதான ஆசாரியர்’ என்பதற்குப் பதிலாக இயல்பான ‘தலைமைக் குரு’ பயன்படுத்தப்பட்டது. மூலத்தின் இடச்சுட்டு, முன்னோடி உருவகம், பிரதிநிதித்துவத் திறன், மெல்கிசேதேக்கு தொடர்பு, நிரந்தர குருத்துவம் ஆகியவை காக்கப்பட்டுள்ளன.
