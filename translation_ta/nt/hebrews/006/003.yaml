  edition: SBLGNT
  text: καὶ τοῦτο ⸀ποιήσομεν ἐάνπερ ἐπιτρέπῃ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/003.yaml
  text: And this we will do[a], if indeed God permits.
translation:
  language: ta
  text: கடவுள் அனுமதிப்பாரேயானால், இதையும் நாம் செய்வோம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கடவுள் அனுமதித்தால்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் உள்ள வலியுறுத்தும் துகள் நிபந்தனைக்கு அழுத்தம் சேர்க்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: -உம் (இதையும்)
  rationale: முந்தைய அறிவுறுத்தலோடு இவ்வாக்கியத்தை இணைக்கும் தொடர்பைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: τοῦτο
  choice: இதை
  rationale: ஒருமைச் சுட்டுப்பெயராக இருந்து, முன்பு குறிப்பிடப்பட்ட செயலை அல்லது கற்பித்தலின் போக்கைச் சுட்டுகிறது.
- source_word: ποιήσομεν
  choice: நாம் செய்வோம்
  rationale: ποιέω என்பதன் எதிர்காலச் செயப்பாட்டு வடிவத்தை நேரடியாகப் பிரதிபலிக்கிறது; சூழலில் முன்னேறிச் செல்வதையும் உட்குறிப்பாகக் கொண்டிருக்கிறது.
- source_word: ἐάνπερ
  choice: உண்மையாகவே ... -த்தால்
  rationale: நிபந்தனையை வலியுறுத்தும் περ கூறை விடாமல், தமிழில் இயல்பான நிபந்தனை அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: ἐπιτρέπῃ
  choice: அனுமதித்தால்
  rationale: ἐπιτρέπω என்பதன் ‘அனுமதி அளித்தல்’ என்ற பொருளையும், நிபந்தனைக்குரிய வினைநிலையையும் தெளிவாகக் காட்டுகிறது.
- source_word: ὁ θεός
  choice: கடவுள்
  rationale: வாக்கியத்தின் எழுவாயான தெய்வீகக் குறிப்பை நவீன பொதுத்தமிழில் இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: தெய்வீக அனுமதியைச் சார்ந்த நிபந்தனை
  choice: எழுத்தாளர் தாம் செய்யவிருப்பதைத் தெரிவிக்கிறார்; அதேவேளையில் அது கடவுளின் அனுமதிக்கு உட்பட்டது என்பதைத் தெளிவாகக் கூறுகிறார்.
  alternative: ‘கடவுளுக்குச் சித்தமானால்’ என்ற பலவீனமான வழக்குச் சொற்றொடராக மாற்றுவது, அல்லது தெய்வீகக் காரணத்தைக் குறித்து மூலத்தில் இருப்பதைவிட அதிகமான தீர்மானவாதப் பொருளைச் சேர்ப்பது.
  rationale: ἐάνπερ உண்மையான, வலியுறுத்தப்பட்ட நிபந்தனையை வெளிப்படுத்துகிறது. மனித நோக்கத்துக்கும் கடவுளின் அனுமதிக்கும் இடையிலான இறையியல் அழுத்தத்தை எந்தக் கோட்பாட்டு முடிவுக்கும் இட்டுச் செல்லாமல் காக்க வேண்டும்.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. கிரேக்கச் சொல்வரிசையை அப்படியே பின்பற்றாமல், நிபந்தனை முதலில் வரும் இயல்பான தமிழ் அமைப்பு தேர்ந்தெடுக்கப்பட்டுள்ளது; ‘இதையும்’ என்பது முந்தைய வசனத்துடனான இணைப்பைக் காக்கிறது.
