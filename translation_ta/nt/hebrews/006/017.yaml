    text: இன்னும் நேர்ச்சொல்லாக, “ஒரு சத்தியத்தின் மூலம் இடையிட்டார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: ஆகவே
  rationale: முந்தைய வசனத்தில் ஆபிரகாமுக்குக் கொடுக்கப்பட்ட வாக்குத்தத்தத்தையும் ஆணையையும் சுட்டும் தொடர்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: περισσότερον
  choice: இன்னும் தெளிவாக
  rationale: ἐπιδεῖξαι என்பதோடு இணைந்து, கடவுள் தமது தீர்மானத்தின் உறுதியை மேலதிகமாகத் தெளிவுபடுத்தியதை உணர்த்துகிறது.
- source_word: βουλόμενος
  choice: விரும்பி
  rationale: வெறும் ஆசையை அல்ல, கடவுளின் நோக்கமுள்ள மனவிருப்பத்தைச் சூழல் காட்டுவதால், தமிழில் இயல்பாக இவ்வாறு தரப்பட்டுள்ளது.
- source_word: ἐπιδεῖξαι
  choice: காட்ட
  rationale: ‘வெளிப்படுத்திக் காட்டுதல்’ என்ற பொருளை எளிமையாகவும் நேரடியாகவும் தருகிறது.
- source_word: τοῖς κληρονόμοις τῆς ἐπαγγελίας
  choice: வாக்குத்தத்தத்தின் வாரிசுகளுக்கு
  rationale: உரிமையாகப் பெற நியமிக்கப்பட்டவர்களைக் குறிக்கும் κληρονόμοις என்பதையும், குறிப்பிட்ட தெய்வீக வாக்குத்தத்தத்தையும் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: τὸ ἀμετάθετον τῆς βουλῆς αὐτοῦ
  choice: தமது தீர்மானம் மாறாதது என்பதை
  rationale: கடவுளின் திட்டமிட்ட தீர்மானத்தை மாற்ற முடியாது என்ற கருத்தைத் தொழில்நுட்பச் சொற்கள் இன்றி தெளிவாகக் கூறுகிறது.
- source_word: ἐμεσίτευσεν
  choice: அதற்கு உத்தரவாதம் அளித்தார்
  rationale: ஆணையைப் பயன்படுத்தி உறுதியளித்தல் என்ற சூழல்சார் செயல்பாட்டுப் பொருளை நவீனத் தமிழில் தெளிவாகத் தருகிறது; நேர்ச்சொல் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: ὅρκῳ
  choice: ஓர் ஆணையின் மூலம்
  rationale: கருவிப் பொருளுடைய வேற்றுமையை வெளிப்படுத்தி, சத்திய ஆணையே உறுதியளிக்கும் வழிமுறை என்பதைத் தெரிவிக்கிறது.
theological_decisions:
- issue: கடவுளின் βουλή மாறாதது என்பதைப் பிற்கால மெய்யியல் சொற்களைச் சேர்க்காமல் மொழிபெயர்த்தல்
  choice: தமது தீர்மானம் மாறாதது
  alternative: தமது ஆலோசனையின் மாறாத்தன்மை
  rationale: மூலவசனம் வலியுறுத்தும் மாற்றமுடியாத தன்மையைப் பாதுகாத்து, ‘மாறாத்தன்மை’ போன்ற கடினமான கருத்துப்பெயர் நடையை முதன்மை உரையில் தவிர்க்கிறது.
- issue: ἐμεσίτευσεν என்பதற்கும் கடவுளின் ஆணைக்கும் உள்ள தொடர்பு
  choice: ஓர் ஆணையின் மூலம் அதற்கு உத்தரவாதம் அளித்தார்
  alternative: ஓர் ஆணையுடன் இடையில் நின்றார்
  rationale: வாக்குத்தத்தத்தின் வாரிசுகளுக்குக் கூடுதல் உறுதி அளிப்பதே சூழலின் கருத்து. முதன்மை மொழிபெயர்ப்பு அந்தச் செயல்பாட்டைத் தெளிவுபடுத்துகிறது; வினைச்சொல்லின் இடைநிலையாளர் சார்ந்த உருவகம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வாக்குத்தத்தம்’, ‘வாரிசுகள்’, ‘ஆணை’ ஆகியவை வேதாகமச் சூழலுக்கு ஏற்றுப் பரவலாக அறியப்படும் சொற்கள். மூலத்தின் இறையியல் வலிமையைப் பாதுகாத்தபடியே கடினமான கருத்துப்பெயர் நடைகள் முதன்மை உரையில் குறைக்கப்பட்டுள்ளன.
