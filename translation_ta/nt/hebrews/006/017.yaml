  text: So when God desired to show more clearly to the heirs of the promise the unchangeable character of his purpose[a], he guaranteed it with an oath[b],
translation:
  language: ta
  text: இதனால், கடவுள் தமது தீர்மானத்தின் மாறாத தன்மையை வாக்குத்தத்தத்தின் வாரிசுகளுக்கு இன்னும் தெளிவாகக் காட்ட விரும்பி, ஒரு சத்தியத்தின் மூலம் அதற்கு உத்தரவாதம் அளித்தார்.[a]
  philosophy: optimal-equivalence
