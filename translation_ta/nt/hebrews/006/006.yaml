reference: Hebrews 6:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ παραπεσόντας, πάλιν ἀνακαινίζειν εἰς μετάνοιαν, ἀνασταυροῦντας ἑαυτοῖς τὸν υἱὸν τοῦ θεοῦ καὶ παραδειγματίζοντας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/006.yaml
  text: and having fallen away[a], to renew them again to repentance[b], since they are crucifying again for themselves the Son of God and exposing him to public shame.
translation:
  language: ta
  text: மேலும், வழிவிலகிப் போனவர்களை[a] மனந்திரும்பும்படி மீண்டும் புதுப்பிப்பதும்[b] இயலாதது; ஏனெனில் அவர்கள் தங்களுக்காக தேவனுடைய குமாரனை மீண்டும் சிலுவையில் அறைந்து, அவரைப் பொதுவில் அவமானப்படுத்துகிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விசுவாசத்தைக் கைவிட்டவர்களை.” கிரேக்க வினைச்சொல் கடுமையான விலகுதலைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்கள் தங்களுக்காக தேவனுடைய குமாரனை மீண்டும் சிலுவையில் அறைந்து, அவரைப் பொதுவில் அவமானப்படுத்திக்கொண்டிருக்கும்போது, அவர்களை மனந்திரும்பும்படி மீண்டும் புதுப்பிப்பதும்.” கிரேக்கப் பங்கேற்புவினைகள் விளக்கக் காரணத்தைக் குறிப்பதோடு, அதே நேரத்தில் நிகழும் செயல்களாகவும் புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: παραπεσόντας
  choice: வழிவிலகிப் போனவர்களை
  rationale: இந்த வினைச்சொல் சூழலில் கடுமையான விலகுதலைக் குறிக்கிறது. ‘வழிவிலகிப் போனவர்கள்’ அதன் எச்சரிக்கையின் தீவிரத்தைத் தக்கவைக்கிறது; அதேவேளை பிற்கால இறையியல் தொழில்நுட்பச் சொல்லை முதன்மை உரையில் திணிப்பதில்லை.
- source_word: πάλιν ἀνακαινίζειν
  choice: மீண்டும் புதுப்பிப்பதும்
  rationale: πάλιν என்பது ἀνακαινίζειν என்பதோடு இயல்பாக இணைந்து, முந்தைய நிலைக்குத் திரும்பப் புதுப்பிப்பதைக் குறிக்கிறது.
- source_word: εἰς μετάνοιαν
  choice: மனந்திரும்பும்படி
  rationale: εἰς இங்கு இலக்கு அல்லது விளைவைக் காட்டுகிறது. ‘மனந்திரும்பும்படி’ என்பது தமிழில் இயல்பாகவும், μετάνοια என்பதன் அறநெறி மற்றும் மனப்போக்கு மாற்றத்தின் பொருளைச் சுருக்காமல் வெளிப்படுத்துவதாகவும் உள்ளது.
- source_word: ἀνασταυροῦντας
  choice: மீண்டும் சிலுவையில் அறைந்து
  rationale: ἀνά- என்ற முன்னொட்டின் மறுபடியும் நிகழும் பொருளையும், நிகழ்காலப் பங்கேற்புவினையின் தொடரும் செயல்நிலையையும் சூழலுக்கேற்றவாறு வெளிப்படுத்துகிறது.
- source_word: ἑαυτοῖς
  choice: தங்களுக்காகவே
  rationale: தற்சுட்டு நான்காம் வேற்றுமையின் ‘தங்களுக்காக/தங்களைப் பொறுத்தவரை’ என்ற தொடர்பை நேரடியாகத் தக்கவைக்கிறது; அதன் துல்லியமான நுண்பொருளை அதிகமாக விளக்கித் தீர்மானிப்பதில்லை.
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: தேவனுடைய குமாரனை
  rationale: கிறிஸ்துவைக் குறிக்கும் பட்டத்தை நேரடியாகவும் மரியாதையான வேதாகம நடையிலும் வழங்குகிறது.
- source_word: παραδειγματίζοντας
  choice: அவரைப் பொதுவில் அவமானப்படுத்துகிறார்கள்
  rationale: ஒருவரைப் பொதுமக்கள் முன்னிலையில் இகழ்ச்சிக்கும் அவமானத்துக்கும் உட்படுத்துதல் என்ற வினையின் சமூகப் பொருளைத் தெளிவாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: முந்தைய வசனத்திலுள்ள ἀδύνατον (‘இயலாதது’) என்பதை இவ்வசனத்தில் வெளிப்படையாக மீளக் கூறுவதா
  choice: தமிழில் வாக்கியம் புரியும்படி ‘இயலாதது’ சேர்க்கப்பட்டது; ‘மேலும்’ என்பதால் முந்தைய வசனத்துடனான தொடர்ச்சி தக்கவைக்கப்பட்டது.
  alternative: வினைமுற்றை மீளக் கூறாமல், ‘மேலும் ... புதுப்பிப்பதும்’ என்று முந்தைய வசனத்தை முழுமையாகச் சார்ந்த தொடராக விடுதல்.
  rationale: கிரேக்கத்தில் இவ்வசனம் 6:4-இல் தொடங்கும் வாக்கியத்தைச் சார்ந்துள்ளது. வசனத்தைத் தனியாக வாசிக்கும் தமிழருக்குத் தொடரின் இலக்கண உறவைத் தெளிவாக்குவதற்காக முன்சூழலின் வினையடை மீள வழங்கப்படுகிறது; இது புதிய இறையியல் கருத்தைச் சேர்ப்பதில்லை.
- issue: வழிவிலகுதலின் இறையியல் இயல்பு
  choice: ‘வழிவிலகிப் போனவர்கள்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘விசுவாசத்தை முற்றிலும் கைவிட்டவர்கள்’ அல்லது ‘விசுவாசதுரோகம் செய்தவர்கள்.’
  rationale: இந்த எச்சரிக்கை இரட்சிப்பை இழத்தல், வெளித்தோற்ற விசுவாசம், அல்லது வேறு வகையான உடன்படிக்கைத் துரோகம் ஆகிய பிற்காலக் கோட்பாட்டு விளக்கங்களில் எதையும் தனியாகத் தீர்மானிக்காது. ஆகவே தீவிரம் தக்கவைக்கப்பட்டாலும் ஒரு குறிப்பிட்ட பிரிவின் முடிவு முதன்மை உரையில் சேர்க்கப்படவில்லை.
- issue: ἀνασταυροῦντας மற்றும் παραδειγματίζοντας ஆகிய பங்கேற்புவினைகளின் தொடர்பு
  choice: ‘ஏனெனில்’ என்பதன் மூலம் விளக்கக் காரணமாக வழங்கப்பட்டது.
  alternative: ‘அவர்கள் ... அறைந்து ... அவமானப்படுத்திக்கொண்டிருக்கும்போது’ என்று ஒரேகாலச் சூழ்நிலையாக வாசித்தல்.
  rationale: இந்தப் பங்கேற்புவினைகள் புதுப்பித்தல் இயலாமைக்கான காரணத்தை விளக்குவதாகப் புரிந்துகொள்ளலாம்; எனினும் அவை ஒரேகாலச் செயலைக் குறிக்கவும் முடியும். மாற்று சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. ‘மனந்திரும்புதல்,’ ‘தேவனுடைய குமாரன்,’ ‘சிலுவையில் அறைதல்’ போன்ற பரவலாக அறியப்பட்ட கிறிஸ்தவச் சொற்கள் தெளிவிற்காகத் தக்கவைக்கப்பட்டுள்ளன. கிரேக்கத்தின் நீண்ட தொடரை வாசிக்கத்தக்க தமிழாக்கமாக்கினாலும், முந்தைய வசனத்துடனான சார்பும் இறையியல் பதற்றமும் பாதுகாக்கப்பட்டுள்ளன.
