source:
  edition: SBLGNT
  text: Πεπείσμεθα δὲ περὶ ὑμῶν, ἀγαπητοί, τὰ κρείσσονα καὶ ἐχόμενα σωτηρίας, εἰ καὶ οὕτως λαλοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/009.yaml
  text: But we are convinced of better things concerning you[a], beloved—things that belong to salvation—even though we speak in this way.
translation:
  language: ta
  text: ஆனால் அன்புக்குரியவர்களே, நாங்கள் இவ்வாறு பேசினாலும், உங்களைக் குறித்து சிறந்தவைகளும் மீட்புடன் தொடர்புடையவைகளும் இருப்பதாக உறுதியாக நம்புகிறோம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πεπείσμεθα
  choice: உறுதியாக இருக்கிறோம்
  rationale: Perfect வடிவம் நிலைபெற்ற நம்பிக்கையையோ உறுதியையோ குறிக்கிறது; இயல்பான நவீனத் தமிழில் இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: ஆனால்
  rationale: முந்தைய கடுமையான எச்சரிக்கையிலிருந்து ஆறுதலான மதிப்பீட்டுக்கு வரும் முரண்பாட்டுத் திருப்பத்தை வெளிப்படுத்துகிறது.
- source_word: περὶ ὑμῶν
  choice: உங்களைப் பொறுத்தவரை
  rationale: περί + genitive என்பதன் ‘உங்களைக் குறித்து/உங்களைப் பொறுத்தவரை’ என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἀγαπητοί
  choice: அன்புக்குரியவர்களே
  rationale: அன்பும் மரியாதையும் கொண்ட நேரடி அழைப்பை, அளவுக்கு மீறிய சமய மரபுச் சாயலின்றி காக்கிறது.
- source_word: τὰ κρείσσονα
  choice: இதையேவிட மேலானவற்றை
  rationale: ஒப்பீட்டுப் பொருளைத் தக்கவைக்கிறது; சூழலில் முன் கூறப்பட்ட நிலையைவிட மேலானவற்றைக் குறிக்கிறது.
- source_word: ἐχόμενα σωτηρίας
  choice: மீட்புடன் தொடர்புடையவற்றை
  rationale: ἐχόμενα + genitive குறிக்கும் சேர்ந்திருத்தல் அல்லது தொடர்பு என்ற விரிவான பொருளை வைத்திருக்கிறது; அவை மீட்பின் சான்றுகளா, விளைவுகளா, உடனிகழ்வுகளா என்பதைத் தீர்மானிப்பதில்லை.
- source_word: εἰ καὶ
  choice: இவ்வாறு பேசினாலும்
  rationale: Concessive அமைப்பை இயல்பான தமிழ் வாக்கிய வடிவில் வெளிப்படுத்துகிறது.
- source_word: οὕτως
  choice: இவ்வாறு
  rationale: முந்தைய எச்சரிக்கையின் விதத்தையும் உள்ளடக்கத்தையும் சுட்டுகிறது.
- source_word: λαλοῦμεν
  choice: பேசினாலும்
  rationale: நிகழ்கால ‘நாங்கள் பேசுகிறோம்’ என்பதைக் concessive தொடருடன் இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: எச்சரிக்கைப் பகுதியின் சூழலில் ἐχόμενα என்பதற்கும் σωτηρίας என்பதற்கும் உள்ள உறவு
  choice: “மீட்புடன் தொடர்புடையவை” என்று மொழிபெயர்த்து, அதன் உறவின் தன்மையைத் திறந்தவாறே வைத்தல்
  alternative: “மீட்புடன் கூட வருபவை”
  rationale: இந்தக் கேட்போரிடம் மீட்போடு முறையாக இணைந்த நன்மைகள் இருப்பதாக ஆசிரியர் நம்புகிறார். ஆனால் அவை மீட்பின் சான்றுகளா, உடனிகழ்வுகளா, விளைவுகளா அல்லது அதற்கு வழிநடத்துபவையா என்று கிரேக்கம் துல்லியமாக வரையறுக்கவில்லை; எனவே பிற்கால கோட்பாட்டு விவாதத்தை மொழிபெயர்ப்பு தீர்த்துவிடாமல் இருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. “அன்புக்குரியவர்களே” அன்பான அழைப்பைத் தக்கவைக்கிறது; “மீட்பு” என்பது σωτηρία-வின் சமய மற்றும் விரிவான விடுதலைப் பொருளுக்கு ஏற்றது. வாக்கிய ஒழுங்கு இயல்பான தமிழுக்காக மாற்றப்பட்டாலும், முரண்பாடு, உறுதி, ஒப்பீடு, concessive கூறு ஆகியவை காக்கப்பட்டுள்ளன.
