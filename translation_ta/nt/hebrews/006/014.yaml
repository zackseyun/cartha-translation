translation:
  language: ta
  text: “நிச்சயமாக நான் உன்னை ஆசீர்வதிப்பேன்; மேலும் நிச்சயமாக உன்னைப் பெருகச் செய்வேன்” என்று கூறி,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'கிரேக்கத்தில் இரு வினைகளும் வலியுறுத்தும் இரட்டிப்பு வடிவில் உள்ளன: “ஆசீர்வதித்து ஆசீர்வதிப்பேன்; பெருக்கிப் பெருக்குவேன்.” இது ஆதியாகமம் 22:17-ஐ எதிரொலிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: என்று கூறினார்
  rationale: இது தேவனுடைய ஆணையின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் நிகழ்கால வினையெச்சம். முந்தைய வசனத்துடன் தொடரும் கிரேக்க அமைப்பை, தனி வசனமாகவும் இயல்பாக வாசிக்கத்தக்க தமிழில் இறந்தகால வினைமுற்றாக வழங்குகிறது.
- source_word: Εἰ μὴν
  choice: நிச்சயமாக
  rationale: இது நிபந்தனையைக் குறிக்காமல், ஆணையுடன் கூடிய உறுதியான வலியுறுத்தலைக் குறிக்கிறது; ‘நிச்சயமாக’ அந்த வலிமையைத் தெளிவான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: εὐλογῶν εὐλογήσω
  choice: நிச்சயமாக நான் உன்னை ஆசீர்வதிப்பேன்
  rationale: வினையெச்சமும் வினைமுற்றும் மீண்டும் வரும் செமித்திய வலியுறுத்தலை இயல்பான தமிழில் ‘நிச்சயமாக’ என்பதன் மூலம் வெளிப்படுத்துகிறது; சொற்சொறான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: σε
  choice: உன்னை
  rationale: ஆபிரகாமைக் குறிக்கும் இரண்டாம் நபர் ஒருமை நேரடி செயப்படுபொருள்.
- source_word: καὶ
  choice: ;
  rationale: இரண்டு இணையான வாக்குறுதிகளைத் தமிழில் தெளிவாக இணைக்க அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது; கிரேக்கத்தில் உள்ள இணைப்பு மற்றும் தொடர்ச்சி இதனால் காக்கப்படுகின்றன.
- source_word: πληθύνων πληθυνῶ σε
  choice: நிச்சயமாக உன்னைப் பெருகச் செய்வேன்
  rationale: இரண்டாவது வாக்குறுதியிலும் உள்ள வினைச்சொல் இரட்டிப்பின் வலியுறுத்தலை மீண்டும் ‘நிச்சயமாக’ என வெளிப்படுத்துகிறது. ‘பெருகச் செய்வேன்’ என்பது ஆபிரகாமின் சந்ததியைப் பலுகச் செய்யும் வாக்குறுதியை அளவுக்கு மீறி விளக்காமல் இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: ஆபிரகாமுக்குக் கொடுக்கப்பட்ட வாக்குறுதியில் உள்ள ஆணைமொழி மற்றும் இரட்டை வினை வலியுறுத்தலை மொழிபெயர்த்தல்
  choice: இரண்டு வாக்குறுதிகளிலும் ‘நிச்சயமாக’ என்பதைப் பயன்படுத்தி, இயல்பான தமிழில் இணையான வலியுறுத்தலைக் காத்தல்
  alternative: ‘ஆசீர்வதித்து ஆசீர்வதிப்பேன்; பெருகச் செய்து பெருகச் செய்வேன்’ என்று சொற்சொறாக மொழிபெயர்த்தல்
  rationale: ஆதியாகமம் 22:17-ஐ எதிரொலிக்கும் கிரேக்க இரட்டிப்பு ஆணையின் உறுதியை வலியுறுத்துகிறது. பிரதான உரையில் தெளிவான தமிழ் பயன்படுத்தப்பட்டு, மூல அமைப்பு அடிக்குறிப்பில் பதிவு செய்யப்படுகிறது; இதனால் எந்தக் கோட்பாட்டு விளக்கமும் கூடுதலாகச் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ஆணைமொழியின் வலிமையைச் சீரான இணை அமைப்பால் வெளிப்படுத்துகிறது; மூலத்தின் அசாதாரண இரட்டிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
