reference: Hebrews 6:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: γῆ γὰρ ἡ πιοῦσα τὸν ἐπ’ αὐτῆς ⸂ἐρχόμενον πολλάκις⸃ ὑετόν, καὶ τίκτουσα βοτάνην εὔθετον ἐκείνοις δι’ οὓς καὶ γεωργεῖται, μεταλαμβάνει εὐλογίας ἀπὸ τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/007.yaml
  text: For land that drinks the rain that often comes upon it and produces vegetation useful to those for whose sake it is also cultivated receives blessing from God[a][b].
translation:
  language: ta
  text: ஏனெனில், தன் மேல் அடிக்கடி பெய்யும் மழையைக் குடித்து, யாருக்காக அது பயிரிடப்படுகிறதோ[b] அவர்களுக்குப் பயனுள்ள தாவரங்களை[a] விளைவிக்கும் நிலம், கடவுளிடமிருந்து ஆசீர்வாதம் பெறுகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தாவரங்கள்” என்பதற்குப் பதிலாக “பசுந்தழை” அல்லது “பயிர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “யாருக்காக அது பயிரிடப்படுகிறதோ” என்பதற்குப் பதிலாக, “யாரின் காரணமாக அது பயிரிடப்படுகிறதோ” என்றும் புரிந்துகொள்ளலாம்; ஆயினும் இங்கு διά என்பதுடன் accusative வந்திருப்பதால், இச்சூழலில் “யாருக்காக” என்பது பொருத்தமாகும்.
    reason: alternative_reading
lexical_decisions:
- source_word: γῆ
  choice: நிலம்
  rationale: வேளாண்மை உருவகத்தில் பயிரிடப்படும் நிலப்பரப்பை இயல்பாகக் குறிக்கிறது.
- source_word: πιοῦσα
  choice: குடித்து
  rationale: நிலம் மழையைப் பெறுவதை உயிரோட்டமுள்ள உருவகமாகவே தக்கவைக்கிறது.
- source_word: τὸν ἐπ’ αὐτῆς ἐρχόμενον πολλάκις ὑετόν
  choice: தன் மேல் அடிக்கடி பெய்யும் மழையை
  rationale: ἐπ’ αὐτῆς, πολλάκις ஆகிய கூறுகளை இயல்பான நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τίκτουσα
  choice: விளைவிக்கும்
  rationale: நிலம் தாவர வளர்ச்சியையோ விளைச்சலையோ உண்டாக்குவதைக் குறிக்கும் இயல்பான வேளாண்மைச் சொல்.
- source_word: βοτάνην
  choice: தாவரங்களை
  rationale: குறிப்பிட்ட ஒரு பயிராக வரையறுக்காமல், தாவர வளர்ச்சி என்ற சொல்லின் பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: εὔθετον
  choice: பயனுள்ள
  rationale: இச்சூழலில் பொருத்தமும் நடைமுறைப் பயனும் கொண்டது என்ற கருத்தைத் தெளிவாகத் தருகிறது.
- source_word: ἐκείνοις δι’ οὓς καὶ γεωργεῖται
  choice: யாருக்காக அது பயிரிடப்படுகிறதோ அவர்களுக்கு
  rationale: διά + குற்றுவேற்றுமை இங்கு காரணம் அல்லது நோக்கத்தைக் குறிக்கும் சாத்தியத்தை முன்னிலைப்படுத்துகிறது; செய்பவர்களைக் கட்டாயமாகக் குறிக்கவில்லை.
- source_word: γεωργεῖται
  choice: பயிரிடப்படுகிறது
  rationale: நிலத்தில் செய்யப்படும் வேளாண்மைப் பணியைப் பொதுவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: μεταλαμβάνει
  choice: பெறுகிறது
  rationale: இச்சூழலில் கடவுளிடமிருந்து ஆசீர்வாதத்தை அடைவதைத் தெளிவாகவும் இயல்பாகவும் சொல்கிறது.
- source_word: εὐλογίας ἀπὸ τοῦ θεοῦ
  choice: கடவுளிடமிருந்து ஆசீர்வாதம்
  rationale: மூலத்தின் பொதுவான, பழமொழி போன்ற கூற்றை மிகைப்படுத்தாமல் பாதுகாக்கிறது.
theological_decisions:
- issue: எச்சரிக்கைப் பகுதியில் வரும் வேளாண்மை உருவகம்
  choice: உருவகத்தை நேரடியாகத் தக்கவைத்து, விசுவாசத்தில் நிலைத்திருத்தல் அல்லது விசுவாசத் துரோகம் குறித்த ஒரு குறிப்பிட்ட கோட்பாட்டு முடிவை வசனத்துக்குள் சேர்க்கவில்லை.
  alternative: உண்மையான விசுவாசிகள், பொய்யான விசுவாசிகள் அல்லது கனிதரும் விசுவாசிகளுக்கான இறை அங்கீகாரம் என்று விளக்கத்தை மொழிபெயர்ப்பிலேயே வெளிப்படுத்துதல்.
  rationale: இந்த வசனம் வேளாண்மை ஒப்புமையின் நேர்மறைப் பகுதியை மட்டும் கூறுகிறது; விவாதத்திற்குரிய இறையியல் முடிவுகளை மூல உரை கூறுவதைவிடத் தெளிவாக நிர்ணயிக்கக் கூடாது.
- issue: δι’ οὓς என்பதன் தொடர்பு
  choice: “யாருக்காக” என்று நோக்கம் அல்லது நலன் சார்ந்த பொருளை முதன்மைப்படுத்தியது.
  alternative: “யாரால் அது பயிரிடப்படுகிறதோ” என்று செய்பவர்களைக் குறித்தல்.
  rationale: διά என்பதுடன் குற்றுவேற்றுமை வந்துள்ளதால் “அவர்களுக்காக/அவர்களுடைய நலனுக்காக” என்பது இலக்கணரீதியாக வலுவான வாசிப்பு; இருப்பினும் மாற்று புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. “மழையைக் குடித்து” என்ற உருவக மொழி தக்கவைக்கப்பட்டது. [a], [b] குறியீடுகள் தொடர்புடைய சொற்றொடர்களுக்குப் பின்னர் பிரதான உரையில் இடப்பட்டுள்ளன.
