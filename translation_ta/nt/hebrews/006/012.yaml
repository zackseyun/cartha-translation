  text: ἵνα μὴ νωθροὶ γένησθε, μιμηταὶ δὲ τῶν διὰ πίστεως καὶ μακροθυμίας κληρονομούντων τὰς ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/012.yaml
  text: so that you may not become sluggish[a], but imitators of those who through faith and patience inherit the promises.
translation:
  language: ta
  text: நீங்கள் மந்தமானவர்களாக ஆகாமல், விசுவாசத்தினாலும்[a] நீடிய பொறுமையினாலும் வாக்குறுதிகளைச் சுதந்தரித்துக்கொள்கிறவர்களைப் பின்பற்றுபவர்களாக ஆகும்படி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விசுவாசத்தினாலும்’ என்பதற்கு, ‘நம்பிக்கையினாலும்’ அல்லது சில சூழல்களில் ‘விசுவாசமுள்ள தன்மையினாலும்’ என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: νωθροὶ
  choice: மந்தமானவர்கள்
  rationale: முயற்சியிலும் மறுமொழியிலும் சுறுசுறுப்பின்றி மந்தமாக இருப்பதைக் குறிக்கிறது; உடனடியான சூழலில் வரும் ஊக்கத்திற்கும் முயற்சிக்கும் இயல்பாகப் பொருந்துகிறது.
- source_word: γένησθε
  choice: ஆகாமல் / ஆகும்படி
  rationale: γίνομαι என்பதன் இங்குள்ள உட்புகும் பொருளை, ஒரு நிலைக்கு ‘ஆகுதல்’ என்று காக்கிறது.
- source_word: μιμηταὶ
  choice: பின்பற்றுகிறவர்கள்
  rationale: பிறரை முன்மாதிரியாகக் கொண்டு அவர்களைப் போல நடப்பதைக் கூறும் இயல்பான நவீனத் தமிழ்; ‘போலச் செய்கிறவர்கள்’ என்பதைவிட கண்ணியமான நடை.
- source_word: διὰ πίστεως
  choice: விசுவாசத்தினால்
  rationale: πίστις என்பதன் பரந்த பொருளையும் எபிரெயர் நூலின் இறையியல் சொற்பயன்பாட்டையும் காக்கிறது; நம்பிக்கை அல்லது உண்மைத்தன்மை என்ற நுண்பொருளை அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: μακροθυμίας
  choice: நீடிய பொறுமையினால்
  rationale: காலம் நீளும்போதும் பொறுமையுடன் நிலைத்திருப்பதை μακροθυμία குறிக்கிறது; வெறும் ‘பொறுமை’ என்பதைவிட காலநீட்டத்தின் நுண்பொருளைத் தெளிவாக்குகிறது.
- source_word: κληρονομούντων
  choice: சுதந்தரித்துக்கொள்கிறவர்கள்
  rationale: வாக்குறுதிகளைச் சுதந்தரமாகப் பெறுவோரைக் குறிக்கும் நிகழ்காலப் பங்கேற்பு வடிவத்தின் குணவிளக்கத் தன்மையைக் காக்கிறது.
- source_word: τὰς ἐπαγγελίας
  choice: வாக்குறுதிகளை
  rationale: மூலத்தின் பன்மையை நேரடியாகக் காத்து, கடவுள் அளித்த வாக்குறுதிகளோடு உள்ள தொடர்பையும் வெளிப்படுத்துகிறது.
- source_word: ἵνα μὴ
  choice: ஆகாமல் ... ஆகும்படி
  rationale: முந்தைய அறிவுறுத்தலோடு இணையும் நோக்கப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: πίστις என்பதன் பொருள்
  choice: விசுவாசம்
  alternative: நம்பிக்கை அல்லது உண்மைத்தன்மை
  rationale: இங்கு கடவுள்மீது சார்ந்த நம்பிக்கை முதன்மையாகத் தோன்றினாலும், கிரேக்கச் சொல் சில சூழல்களில் நம்பகத்தன்மை அல்லது உண்மைத்தன்மையையும் குறிக்கலாம்; முதன்மை உரை பரந்த மரபுச் சொல்லைக் காக்கிறது, மாற்று நுண்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: வாக்குறுதிகளைச் சுதந்தரித்தல் நிகழ்காலமா அல்லது நிறைவேறிய நிலையா
  choice: சுதந்தரித்துக்கொள்கிறவர்கள்
  alternative: சுதந்தரிக்கிறவர்கள் / பெற்றுக்கொள்கிறவர்கள்
  rationale: நிகழ்காலப் பங்கேற்பு வடிவத்தை மிகை விளக்கமின்றிக் காத்து, இவர்களின் அடையாளமான தொடர்ந்த அனுபவத்தைக் காட்டுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாகப் புரியக்கூடிய நடை பயன்படுத்தப்பட்டுள்ளது. ‘மந்தமானவர்கள்’ என்பது பழமையான அல்லது மிகக் குற்றஞ்சாட்டும் சொற்களைத் தவிர்க்கிறது. ‘நீடிய பொறுமை’ காலம் தாழ்ந்தாலும் பொறுத்திருக்கும் μακροθυμία-வின் நுண்பொருளைக் காக்கிறது. அடிக்குறிப்பு குறியீடு தொடர்புடைய ‘விசுவாசம்’ என்ற சொல்லுக்குப் பின் வருமாறு முதன்மை உரையில் அமைக்கப்பட வேண்டும்.
