id: HEB.6.16
reference: Hebrews 6:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀ἄνθρωποι γὰρ κατὰ τοῦ μείζονος ὀμνύουσιν, καὶ πάσης αὐτοῖς ἀντιλογίας πέρας εἰς βεβαίωσιν ὁ ὅρκος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/016.yaml
  text: For people swear by one greater than themselves[b][a], and for them an oath is the end of every dispute for confirmation.
translation:
  language: ta
  text: மனிதர்கள் தங்களைவிட உயர்ந்தவரின் பெயரில் ஆணையிடுகிறார்கள்; அவர்களுக்கு ஒவ்வொரு வாதத்தையும் உறுதிப்படுத்தி முடிவுக்குக் கொண்டுவருவது ஆணையே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வாதம்” என்பதற்கு “எதிர்ப்பு,” “சர்ச்சை,” அல்லது “தகராறு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωποι
  choice: மனிதர்கள்
  rationale: பொதுவாக மனிதர்களைக் குறிக்கும் பன்மை; ஆண்களை மட்டும் குறிக்கவில்லை. சூழலில் கடவுளுக்கும் மனிதர்களுக்கும் உள்ள வேறுபாட்டையும் தெளிவாக வைத்திருக்கிறது.
- source_word: κατὰ τοῦ μείζονος
  choice: தங்களைவிடப் பெரியவர்மேல்
  rationale: ஆணையிடும் சூத்திரத்தில் κατά + பிறப்புவேற்றுமை உயர்ந்த ஒருவரைச் சாட்சியாக அல்லது அதிகாரமாகக் கொண்டு ஆணையிடுவதைக் குறிக்கிறது; ஒப்பீட்டுப் பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὀμνύουσιν
  choice: ஆணையிடுகிறார்கள்
  rationale: சத்தியப்பிரமாணம் செய்வதைக் குறிக்கும் நேரடியான, தற்போதைய பொதுநடைத் தமிழ்.
- source_word: πάσης ... ἀντιλογίας
  choice: ஒவ்வொரு சர்ச்சைக்கும்
  rationale: இங்கு வெறும் தர்க்க முரண்பாட்டை விட எதிர்ப்பு, வாதம் அல்லது தகராறு என்ற பரந்த பொருள் உள்ளது; ‘சர்ச்சை’ அந்தப் பொருள் விரிவைத் தக்கவைக்கிறது.
- source_word: πέρας
  choice: முடிவாக
  rationale: அடிப்படைப் பொருளான ‘முடிவு’ என்பதைப் பாதுகாத்து, ஆணை சர்ச்சையை முடிவுக்குக் கொண்டுவருகிறது என்ற கருத்தைத் தெளிவாக்குகிறது.
- source_word: εἰς βεβαίωσιν
  choice: உறுதிப்படுத்துவதற்காகச் செய்யப்படும்
  rationale: εἰς + குற்றுவேற்றுமையின் நோக்கம்/விளைவு உணர்வையும் βεβαίωσις என்பதன் உறுதிப்படுத்தல் பொருளையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: ὁ ὅρκος
  choice: அந்த ஆணை
  rationale: கிரேக்கச் சுட்டுறுப்பை மதித்து, முன் கூறப்பட்ட ஆணையிடும் செயலைத் திரும்பச் சுட்டுகிறது; தமிழில் தேவையற்ற மீளுரையைத் தவிர்க்கிறது.
theological_decisions:
- issue: மனிதகுலத்தைக் குறிக்கும் பொதுப்பெயர்
  choice: மனிதர்கள்
  alternative: ஆண்கள்
  rationale: ἄνθρωποι இங்கு பாலினக் குறிப்பின்றி மனிதர்களின் பொதுவான நடைமுறையைச் சொல்கிறது; ‘மனிதர்கள்’ மூலத்தின் பொதுப்பொருளைத் துல்லியமாகத் தருகிறது.
- issue: ஆணையின் சமூகச் செயல்பாடு
  choice: சர்ச்சைக்கு முடிவாகவும் உறுதிப்படுத்துவதற்காகவும் இருப்பது
  alternative: எல்லா எதிர்ப்பையும் முற்றிலும் மறுப்பது
  rationale: வசனம் ஆணை ஒரு விவகாரத்தை உறுதிசெய்து சர்ச்சையை முடிக்கிறது என்று கூறுகிறது; அது ஒவ்வொரு சாத்தியமான எதிர்ப்பும் உண்மையற்றது எனக் கோட்பாட்டளவில் தீர்ப்பதாக மொழிபெயர்க்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் dignified, வாசிக்க எளிய நடையைப் பயன்படுத்துகிறது. ‘ஆணையிடுதல்’ என்பது சத்தியப்பிரமாணச் சூழலை இயல்பாகக் காட்டுகிறது. மூலத்தின் பொதுவான கூற்று, ஒப்பீட்டு வலிமை, மற்றும் உறுதிப்படுத்தல்–முடிவு தொடர்பு பாதுகாக்கப்பட்டுள்ளன.
