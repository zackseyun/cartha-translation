source:
  edition: SBLGNT
  text: Τῷ γὰρ Ἀβραὰμ ἐπαγγειλάμενος ὁ θεός, ἐπεὶ κατ’ οὐδενὸς εἶχεν μείζονος ὀμόσαι, ὤμοσεν καθ’ ἑαυτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/013.yaml
  text: For when God made the promise to Abraham[a], since he could swear by no one greater, he swore by himself[b],
translation:
  language: ta
  text: ஏனெனில், கடவுள் ஆபிரகாமுக்கு வாக்குறுதி அளித்தபோது[a], தம்மைவிடப் பெரிய எவரைக் கொண்டும் சத்தியம் செய்ய அவரால் முடியாததால், தம்மைக் கொண்டே சத்தியம் செய்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் எளிமையாக, “கடவுள் ஆபிரகாமுக்கு வாக்களித்தபோது.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “சத்தியம் செய்வதற்குத் தம்மைவிடப் பெரிய எவரும் அவருக்கு இல்லாததால், தம்மைக் கொண்டே சத்தியம் செய்தார்.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἐπαγγειλάμενος
  choice: வாக்குறுதி அளித்தபோது
  rationale: இறந்தகால நடுவினைப் பங்கேற்புச் சொல்லின் காலத் தொடர்பையும், ஆபிரகாம் வாக்குறுதியைப் பெற்றவர் என்பதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது. ‘வாக்களித்தபோது’ என்பதும் சாத்தியம்.
- source_word: ἐπεὶ
  choice: …முடியாததால்
  rationale: இங்கு ἐπεί காரணத்தை அறிமுகப்படுத்துகிறது; கடவுள் ஏன் தம்மீதே ஆணையிட்டார் என்பதைத் தமிழில் தெளிவாக இணைக்கிறது.
- source_word: κατ’ οὐδενὸς … μείζονος
  choice: தம்மைவிடப் பெரியவர் யார்மீதும்
  rationale: ஆணையிடும் சூழலில் οὐδενός தனிப்பட்ட ஒருவரைக் குறிப்பதாக இயல்பாகப் புரிகிறது. ஒப்பீட்டின் பொருளைத் தமிழில் தெளிவாக்க ‘தம்மைவிட’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ὀμόσαι
  choice: ஆணையிட
  rationale: சத்தியம் செய்வதைச் சுட்டும் கிரேக்க வினையின் பொருளை வழங்குவதோடு, அடுத்து வரும் ὤμοσεν உடனான சொல்லியல் மறுபயன்பாட்டையும் காக்கிறது.
- source_word: ὤμοσεν
  choice: ஆணையிட்டார்
  rationale: இறந்தகால வினையை நேரடியாகவும் கண்ணியமான நடையிலும் தருகிறது; ὀμόσαι உடனான சொல்லியல் தொடர்பையும் பாதுகாக்கிறது.
- source_word: καθ’ ἑαυτοῦ
  choice: தம்மீதே
  rationale: ஆணைச் சூத்திரத்தில் κατά உடன் வரும் தற்சுட்டுப் பெயர், ஒருவர் தம்மையே ஆணையின் உறுதிப்படுத்தும் ஆதாரமாகக் கொள்வதைக் குறிக்கிறது. ‘-ஏ’ வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய கருத்துக்கான விளக்கமாக இவ்வசனம் வருவதை வெளிப்படையாகக் காட்டுகிறது.
- source_word: Τῷ … Ἀβραὰμ
  choice: ஆபிரகாமுக்கு
  rationale: வேற்றுமை வடிவம் வாக்குறுதியைப் பெற்றவரைக் குறிக்கிறது; தமிழின் நான்காம் வேற்றுமை இதை இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: கடவுளின் ஆணையின் தன்மை
  choice: தம்மைவிடப் பெரியவர் யார்மீதும் ஆணையிட முடியாததால் கடவுள் தம்மீதே ஆணையிட்டார்.
  alternative: ஆணையிடுவதற்குத் தம்மைவிடப் பெரியவர் யாரும் அவருக்கு இல்லாததால், அவர் தம்மீதே ஆணையிட்டார்.
  rationale: கடவுளைவிடப் பெரியவர் எவரும் இல்லை என்ற வசனத்தின் கருத்தையும், அவர் தம்மையே ஆணையின் ஆதாரமாகக் கொண்டதையும் பாதுகாக்கிறது; இதற்கு அப்பாற்பட்ட பிற்காலக் கோட்பாட்டு விளக்கங்கள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளைக் குறிக்கும் தற்சுட்டு மற்றும் வினை வடிவங்களில் மரியாதைப் பன்மை கையாளப்பட்டுள்ளது; கிரேக்கத்தில் உள்ள ‘ஆணையிட/ஆணையிட்டார்’ என்ற சொல்லியல் மறுபயன்பாடும் தக்கவைக்கப்பட்டுள்ளது.
