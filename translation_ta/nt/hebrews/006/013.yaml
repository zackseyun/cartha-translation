review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly conveys the causal sequence: God promised Abraham, had no one greater by whom to swear, and therefore swore by himself. However, the repeated wording “ஆணையிட” is liable in modern Tamil to mean “to command,” obscuring the oath-taking sense of both ὀμόσαι and ὤμοσεν.'
  naturalness: “தம்மைவிடப் பெரியவர் யார்மீதும் ஆணையிட” is awkward and can be misconstrued as directing a command at someone. “எவரைக் கொண்டும் சத்தியம் செய்ய” and “தம்மைக் கொண்டே சத்தியம் செய்தார்” are clear, idiomatic modern-standard Tamil oath language.
  terminology: “கடவுள்,” “ஆபிரகாம்,” and respectful divine forms are suitable. “சத்தியம் செய்ய/சத்தியம் செய்தார்” preserves the Greek verbal repetition and accurately represents oath-taking without introducing theological interpretation.
  issues:
  - severity: medium
    issue: The phrase “யார்மீதும் ஆணையிட” does not naturally express swearing by a person in contemporary Tamil.
    rationale: The Greek construction κατ’ οὐδενὸς ... ὀμόσαι means to swear by no one greater. In Tamil, “ஆணையிட” can ordinarily mean to issue an order, whereas “எவரைக் கொண்டும் சத்தியம் செய்ய” explicitly conveys invoking someone in an oath.
  - severity: medium
    issue: The rendering “தம்மீதே ஆணையிட்டார்” is potentially ambiguous as an order directed at himself.
    rationale: καθ’ ἑαυτοῦ is oath-formula language, “by himself.” “தம்மைக் கொண்டே சத்தியம் செய்தார்” gives this sense naturally and precisely.
  revised_text: ஏனெனில், கடவுள் ஆபிரகாமுக்கு வாக்குறுதி அளித்தபோது[a], தம்மைவிடப் பெரிய எவரைக் கொண்டும் சத்தியம் செய்ய அவரால் முடியாததால், தம்மைக் கொண்டே சத்தியம் செய்தார்[b].
