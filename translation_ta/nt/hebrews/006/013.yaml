- from: ஏனெனில், கடவுள் ஆபிரகாமுக்கு வாக்குறுதி அளித்தபோது[a], தம்மைவிடப் பெரியவர் யார்மீதும் ஆணையிட அவரால் முடியாததால், தம்மீதே ஆணையிட்டார்[b].
