source:
  edition: SBLGNT
  text: οὐ γὰρ ἄδικος ὁ θεὸς ἐπιλαθέσθαι τοῦ ἔργου ὑμῶν ⸀καὶ τῆς ἀγάπης ἧς ἐνεδείξασθε εἰς τὸ ὄνομα αὐτοῦ, διακονήσαντες τοῖς ἁγίοις καὶ διακονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/010.yaml
  text: For God is not unjust so as to forget your work and the love that you showed for his name in having served the saints and in continuing to serve them[a][b][c].
translation:
  language: ta
  text: ஏனெனில், நீங்கள் பரிசுத்தவான்களுக்குப் பணிவிடை செய்ததிலும் தொடர்ந்து அவர்களுக்குப் பணிவிடை செய்வதிலும், உங்கள் செயலையும் அவருடைய பெயருக்காக[a] நீங்கள் காட்டிய அன்பையும் மறந்துவிடுவதற்குக் கடவுள் அநீதியுள்ளவர் அல்ல. [b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவருடைய பெயரின் நிமித்தம்.’
    reason: lexical_alternative
  - marker: b
    text: ‘பரிசுத்தவான்கள்’ என்பது இங்கு கடவுளுக்குரிய சக விசுவாசிகளைக் குறிக்கிறது; பிற்காலத்தில் அதிகாரபூர்வமாகப் புனிதர் என அறிவிக்கப்பட்ட ஒரு தனிப்பிரிவைக் குறிக்கவில்லை.
    reason: cultural_note
  - marker: c
    text: இதனை, ‘பரிசுத்தவான்களுக்குப் பணிவிடை செய்ததன் மூலமும் தொடர்ந்து அவர்களுக்குப் பணிவிடை செய்வதன் மூலமும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: previous_rendering
lexical_decisions:
- source_word: ἄδικος
  choice: அநீதியுள்ளவர்
  rationale: கடவுள் அவர்களுடைய உண்மையுள்ள செயல்களை மறப்பது நீதிக்கு மாறானதாக இருக்கும் என்ற பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἐπιλαθέσθαι
  choice: மறந்துவிடுவதற்கு
  rationale: வினைச்சொல்லின் நேரடிப் பொருளான ‘மறத்தல்’ என்பதைக் காக்கிறது; சூழலில், அவர்களுடைய செயலைக் கணக்கில் கொள்ளாமல் விடமாட்டார் என்பதும் உட்பொருளாக உள்ளது.
- source_word: ἔργου
  choice: செயலை
  rationale: ஒருமையில் கூட்டுப்பொருளைக் கொண்ட ἔργον என்பதற்கு இயல்பான தமிழ்; அடுத்துவரும் பணிவிடையால் வெளிப்பட்ட அன்புடன் நன்றாக இணைகிறது.
- source_word: ἀγάπης
  choice: அன்பையும்
  rationale: ἀγάπη என்பதற்கான வழக்கமான, தெளிவான தமிழ்; இங்கு நடைமுறையான சேவையில் வெளிப்பட்ட அன்பைக் குறிக்கிறது.
- source_word: ἐνεδείξασθε
  choice: காட்டிய
  rationale: அன்பை வெளிப்படுத்துதல் அல்லது நிரூபித்தல் என்ற கருத்தை எளிய நவீன தமிழில் தெரிவிக்கிறது.
- source_word: εἰς τὸ ὄνομα αὐτοῦ
  choice: அவருடைய பெயருக்காக
  rationale: கடவுளின் பெயரின் நிமித்தமும் அவருக்கான பற்றுறுதியாலும் செய்யப்பட்ட செயல் என்ற பொருளைத் தருகிறது; ‘பெயர்’ என்ற வேதாகமச் சொல்லையும் காக்கிறது.
- source_word: διακονήσαντες
  choice: பணிவிடை செய்ததிலும்
  rationale: இறந்தகாலச் சேவையைச் சுட்டும் aorist participle-ன் முன்னைய செயல் அம்சத்தை வெளிப்படுத்துகிறது.
- source_word: τοῖς ἁγίοις
  choice: பரிசுத்தவான்களுக்கு
  rationale: புதிய ஏற்பாட்டில் கடவுளுக்குரிய விசுவாசிகளைக் குறிக்கும் வழக்கமான சொல்லைத் தக்கவைக்கிறது; பிற்கால புனிதர் பட்டத்தை இங்கு புகுத்தவில்லை.
- source_word: διακονοῦντες
  choice: தொடர்ந்து பணிவிடை செய்வதிலும்
  rationale: நிகழ்கால participle காட்டும் தொடர்ச்சியான சேவையைத் தெளிவாக வெளிப்படுத்துகிறது; முந்தைய aorist participle உடனான காலவகை வேறுபாடும் காக்கப்படுகிறது.
theological_decisions:
- issue: இந்த வசனம் மனிதச் செயல்கள் கடவுளிடம் இரட்சிப்புக்கான தகுதியைச் சம்பாதிக்கின்றனவா, அல்லது விசுவாசிகளின் செயலைக் கடவுள் நீதியுடன் நினைவுகூருகிறார் என்பதையா கூறுகிறது?
  choice: அவர்களுடைய செயலையும் அன்பையும் கடவுள் மறக்கமாட்டார் என்ற நீதிசார்ந்த கூற்றை மட்டும் உரை வெளிப்படுத்துகிறது.
  alternative: மனிதச் செயல்களுக்காக கடவுள் இரட்சிப்பையோ வெகுமதியையோ கடன்பட்டிருக்கிறார் என்ற வலுவான தகுதி சார்ந்த வாசிப்பு.
  rationale: கிரேக்க உரை கடவுள் அவர்களுடைய செயலையும் அன்பையும் மறப்பதற்கு அநீதியுள்ளவர் அல்ல என்று கூறுகிறது. இரட்சிப்பைச் செயல்கள் சம்பாதிக்கின்றன என்று உரையில் இல்லாத கருத்தை மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. இறந்தகாலப் பணிவிடைக்கும் தொடர்ந்து நடைபெறும் பணிவிடைக்கும் இடையிலான கிரேக்க வினையம்ச வேறுபாடு வெளிப்படையாகக் காக்கப்பட்டுள்ளது. ‘பரிசுத்தவான்கள்’ என்ற வேதாகமச் சொல் விளக்கக் குறிப்புடன் தக்கவைக்கப்பட்டுள்ளது.
