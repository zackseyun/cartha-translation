translation:
  language: ta
  text: தேவனுடைய நல்ல வார்த்தையையும் வரவிருக்கும் யுகத்தின் வல்லமைகளையும்[a] சுவைத்தவர்களாகவும்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அற்புதங்கள்’ அல்லது ‘வல்ல செயல்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: நல்ல
  rationale: ῥῆμα என்பதை இயல்பாக வருணித்து, நன்மைமிக்க அல்லது சிறந்தது என்ற மதிப்பீட்டு வலிமையை மிகைப்படுத்தாமல் காக்கிறது.
- source_word: γευσαμένους
  choice: சுவைத்தவர்களாகவும்
  rationale: முந்தைய வசனத்திலிருந்து தொடரும் பன்மை வினையெச்ச அமைப்பைத் தக்கவைத்து, அனுபவத்தின் ஆழம் குறித்த விவாதத்தைத் தீர்க்காமல் γεύομαι என்பதன் உருவகத்தையும் காக்கிறது.
- source_word: θεοῦ ῥῆμα
  choice: தேவனுடைய ... வார்த்தையை
  rationale: ῥῆμα என்பது சொல் அல்லது உரைப்பு எனப் பொருள்படலாம்; இங்கு தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்கும் மரபான சொற்றொடர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: δυνάμεις
  choice: வல்லமைகளை
  rationale: அற்புதங்கள் அல்லது வல்ல செயல்கள் என்று பொருள் குறுக்காமல், ஆற்றல்களையோ அவற்றின் வெளிப்பாடுகளையோ குறிக்கக்கூடிய பன்மையின் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: τε
  choice: -ஆகவும்
  rationale: முந்தைய பொருளுடன் δυνάμεις-ஐ இணைக்கும் தொடர்ச்சியைத் தமிழின் இணைப்பு விகுதி இயல்பாக வெளிப்படுத்துகிறது.
- source_word: μέλλοντος αἰῶνος
  choice: வரவிருக்கும் யுகத்தின்
  rationale: எதிர்கால நோக்குடைய இறுதிக்காலப் பொருளை இயல்பான நவீனத் தமிழில் காக்கிறது.
theological_decisions:
- issue: எச்சரிக்கைப் பகுதியில் ‘சுவைத்தல்’ என்பதன் பொருள்
  choice: ‘சுவைத்தவர்களாகவும்’ என்ற உருவகத்தை அப்படியே வைத்தல்
  alternative: ‘அனுபவித்தவர்களாகவும்’ அல்லது ‘சிறிதளவு மட்டும் சுவைத்தவர்களாகவும்’
  rationale: பங்கேற்பின் ஆழத்தை முழுமையான அனுபவமாகவோ மேலோட்டமான மாதிரியாகவோ மொழிபெயர்ப்பு தீர்மானிக்காமல், மூலத்தின் இறையியல் பதற்றத்தைத் தக்கவைக்கிறது.
- issue: இறுதிக்காலச் சூழலில் δυνάμεις என்பதன் வலிமை
  choice: ‘வல்லமைகள்’
  alternative: ‘அற்புதங்கள்’ அல்லது ‘வல்ல செயல்கள்’
  rationale: வருங்கால யுகத்தோடு தொடர்புடைய அற்புத வெளிப்பாடுகள் குறிக்கப்படலாம்; எனினும் விரிவான தெய்வீக வல்லமைகளும் சாத்தியம் என்பதால் பொருளைச் சுருக்கவில்லை.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ். இது எபிரெயர் 6:4–6 இன் தொடர்ச்சியான வாக்கியத் துணுக்கு என்பதால் வினையெச்ச வடிவமும் இறுதி காற்புள்ளியும் வைக்கப்பட்டுள்ளன. ‘சுவைத்தவர்களாகவும்’ என்பதை இரண்டாவது முறையாக வெளிப்படையாகக் கூறுவது தமிழில் இரு கருமங்களுடனும் வினையின் தொடர்பைத் தெளிவாக்குகிறது; கிரேக்கத்தில் அந்த வினையெச்சம் இரண்டிற்கும் பொதுவாக உள்ளது.
