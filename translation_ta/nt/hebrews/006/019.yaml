    text: 'அல்லது: “திரையின் உட்புறத்திற்குள்” அல்லது “திரைக்குப் பின்னால்.”'
    reason: τοῦ καταπετάσματος என்ற இறைவேற்றுமைத் தொடரின் இடப்பொருளைத் தமிழில் ஒன்றுக்கு மேற்பட்ட இயல்பான முறைகளில் வெளிப்படுத்தலாம்.
lexical_decisions:
- source_word: ἣν
  choice: இந்த நம்பிக்கையை
  rationale: பெண்பால் சார்புப்பெயர் முந்தைய வசனத்தில் குறிப்பிடப்பட்ட நம்பிக்கையைச் சுட்டுகிறது. தமிழில் அதன் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் காட்ட, சுட்டப்படும் பெயர்ச்சொல் வெளிப்படையாகச் சேர்க்கப்பட்டது.
- source_word: ὡς ἄγκυραν
  choice: நங்கூரமாக
  rationale: ὡς அறிமுகப்படுத்தும் ஒப்புமையைத் தமிழில் இயல்பான உருவகமாகத் தருகிறது.
- source_word: ἔχομεν
  choice: கொண்டிருக்கிறோம்
  rationale: நிகழ்காலத்தில் நீடிக்கும் உடைமையைக் காட்டும் இயல்பான தமிழ் வினைமுறை.
- source_word: τῆς ψυχῆς
  choice: நம் ஆன்மாவின்
  rationale: ψυχή என்பதன் பரந்த பொருளைத் தக்கவைத்து, அதை வெறும் மனநிலை அல்லது உணர்வாகக் குறுக்காமல் நங்கூர உருவகத்துடன் இணைக்கிறது. தமிழில் உறவை இயல்பாக்க ‘நம்’ சேர்க்கப்பட்டது.
- source_word: ἀσφαλῆ
  choice: பாதுகாப்பானதும்
  rationale: நங்கூரம் அளிக்கும் பாதுகாப்பையும் நம்பகத்தன்மையையும் வெளிப்படுத்துகிறது; அடுத்த பெயரடையுடன் பொருளை ஒன்றாக்கவில்லை.
- source_word: βεβαίαν
  choice: உறுதியானதும்
  rationale: நிலைத்தன்மை மற்றும் நம்பகமான உறுதி ஆகியவற்றைக் குறிக்கிறது; ἀσφαλής என்பதிலிருந்து உள்ள நுண்ணிய வேறுபாட்டைப் பேணுகிறது.
- source_word: τε καὶ
  choice: …ஆனதும் …ஆனதும்
  rationale: இரு இணையான பண்புகளையும் தமிழில் சமநிலையுடன் வலியுறுத்துகிறது.
- source_word: εἰσερχομένην
  choice: நுழைவதுமாக இருக்கிறது
  rationale: ‘நங்கூரம்’ என்பதையே தொடர்ந்து விவரிக்கும் நிகழ்காலப் பங்கேற்பு வடிவத்தின் ஓட்டத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: εἰς τὸ ἐσώτερον
  choice: உட்பகுதிக்குள்
  rationale: ஆலயத்தின் உள்ளான இடத்தைக் குறிக்கிறது; ‘மகா பரிசுத்த இடம்’ என்று மூலத்தில் இல்லாத குறிப்பை முன்கூட்டியே சேர்ப்பதில்லை.
- source_word: τοῦ καταπετάσματος
  choice: திரைக்குப் பின்னுள்ள
  rationale: ஆசரிப்புக்கூடம் அல்லது ஆலயத்தின் தடுப்புத் திரையை நவீன வாசகருக்குத் தெளிவாகக் காட்டுகிறது. கிரேக்க இறைவேற்றுமையின் சூழல்சார் இடப்பொருள் தமிழில் வெளிப்படையாகத் தரப்பட்டுள்ளது.
theological_decisions:
- issue: பரலோகப் பரிசுத்த இடத்தைச் சார்ந்த வழிபாட்டு உருவகம்
  choice: ‘திரைக்குப் பின்னுள்ள உட்பகுதி’ என்று மொழிபெயர்த்து, ஆலயம் அல்லது ஆசரிப்புக்கூடத்தின் தடுப்புத் திரை உருவகத்தைப் பேணுதல்
  alternative: ‘திரையின் உட்புறம்’ அல்லது ‘திரைக்குப் பின்னால்’
  rationale: எபிரெயர் நிருபத்தின் சுற்றியுள்ள பகுதிகளில் விரிவாக்கப்படும் பரிசுத்த இட உருவகத்தைத் தெளிவாக வைத்திருக்கிறது; அதே நேரத்தில் குறிப்பிட்ட அறையின் பெயரை இவ்வசனத்துக்குள் சேர்த்து மிகையாக விளக்குவதில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நங்கூரம்’ மற்றும் ‘திரை’ என்ற மைய உருவகங்கள் அப்படியே பேணப்பட்டுள்ளன; பழமையான அல்லது தனிப்பிரிவுச் சார்ந்த வழிபாட்டுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
