  text: இந்த நம்பிக்கையை நம் ஆன்மாவின் பாதுகாப்பானதும் உறுதியானதும், திரைக்குப் பின்னுள்ள உட்பகுதிக்குள் நுழைவதுமான நங்கூரமாகக் கொண்டிருக்கிறோம்.[a]
  philosophy: optimal-equivalence
  footnotes:
