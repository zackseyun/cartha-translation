  text: βαπτισμῶν ⸀διδαχὴν ἐπιθέσεώς τε χειρῶν, ἀναστάσεώς ⸀τε νεκρῶν καὶ κρίματος αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/002.yaml
  text: instruction about washings[a], the laying on of hands, the resurrection of the dead, and eternal judgment.
translation:
  language: ta
  text: சடங்குமுறை கழுவுதல்களைப் பற்றிய போதனை, கைகளை வைத்தல், இறந்தோரின் உயிர்த்தெழுதல், நித்தியத் தீர்ப்பு ஆகியவற்றைப் பற்றியும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαπτισμῶν
  choice: தூய்மைச் சடங்குகள்
  rationale: பன்மை வடிவம் யூதச் சடங்கு சார்ந்த பலவகை கழுவுதல்களைக் குறிக்கக்கூடும். வெறும் ‘திருமுழுக்குகள்’ என்று மொழிபெயர்த்தால் மீண்டும் மீண்டும் செய்யப்படும் கிறிஸ்தவத் திருமுழுக்கையே குறிப்பதாகத் தவறாகப் புரிந்துகொள்ள வாய்ப்புள்ளது.
- source_word: διδαχὴν
  choice: போதனை
  rationale: முந்தைய வசனத்தில் தொடங்கிய அடிப்படை அம்சங்களின் பட்டியலைத் தொடரும் இயல்பான, நவீனத் தமிழ்ச் சொல். பட்டியலிலுள்ள எல்லா அம்சங்களையும் இது சார்ந்ததாகத் தமிழில் தெளிவுபடுத்தப்பட்டுள்ளது.
- source_word: ἐπιθέσεώς τε χειρῶν
  choice: கைகளை வைப்பது
  rationale: கிரேக்கப் பெயர்ச்சொல் தொடரின் பொருளை இயல்பான தமிழில், குறிப்பிட்ட சடங்கின் நோக்கத்தை மேலதிகமாக வரையறுக்காமல் வழங்குகிறது.
- source_word: ἀναστάσεώς τε νεκρῶν
  choice: இறந்தோரின் உயிர்த்தெழுதல்
  rationale: νεκρῶν என்பதன் பன்மைக் கூட்டுப்பொருளையும் ἀνάστασις என்பதன் நிலையான பொருளையும் இயல்பாகக் காக்கிறது.
- source_word: κρίματος αἰωνίου
  choice: நித்தியத் தீர்ப்பு
  rationale: κρίμα என்பது தீர்ப்பைக் குறிக்கிறது; தண்டனையை மட்டும் அல்ல. αἰώνιος இச்சூழலில் நித்தியமானது என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: τε ... τε καὶ
  choice: … ஆகியவற்றையும்
  rationale: பட்டியலின் இணைப்பு அமைப்பை இயல்பான தமிழில் காட்டுகிறது; கிரேக்கத் துகள்கள் ஒவ்வொன்றையும் சொற்சொல்லாகப் பிரதிபலிக்கவில்லை.
theological_decisions:
- issue: βαπτισμῶν என்பதன் பொருள்
  choice: தூய்மைச் சடங்குகள்
  alternative: திருமுழுக்குகள்
  rationale: பன்மை வடிவமும் சொல் பயன்பாடும் பொதுவான அல்லது யூதச் சடங்கு சார்ந்த கழுவுதல்களைக் குறிக்க இடமளிக்கின்றன. ஆயினும் ‘திருமுழுக்குகள்’ என்ற வாசிப்பும் சாத்தியம் என்பதால் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- issue: κρίματος αἰωνίου என்பதன் வரம்பு
  choice: நித்தியத் தீர்ப்பு
  alternative: நித்தியத் தண்டனை
  rationale: மூலத்தில் ‘தீர்ப்பு’ என்றே உள்ளது; அதன் முடிவைத் தண்டனைக்கு மட்டும் குறுக்காமல் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், வழிபாட்டு மரியாதையுடன் சாதாரண வாசகருக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘தூய்மைச் சடங்குகள்’ என்பது தமிழில் இயல்பாக இருக்கவும், மூலத்தின் பரந்த பொருளைக் காக்கவும் தேர்ந்தெடுக்கப்பட்டது. கிரேக்கத்தில் ‘போதனை’ முதலில் வெளிப்படையாக வந்தாலும், தமிழில் அதன் ஆளுகை பட்டியல் முழுவதற்கும் தெளிவாக இருக்க இறுதியில் மீண்டும் கூறப்பட்டுள்ளது.
