revisions:
- from: தூய்மைச் சடங்குகளைப் பற்றிய போதனை[a], கைகளை வைப்பது, இறந்தோரின் உயிர்த்தெழுதல், நித்தியத் தீர்ப்பு ஆகியவற்றையும் பற்றிய போதனை.
  to: சடங்குமுறை கழுவுதல்களைப் பற்றிய போதனை, கைகளை வைத்தல், இறந்தோரின் உயிர்த்தெழுதல், நித்தியத் தீர்ப்பு ஆகியவற்றைப் பற்றியும்.
  rationale: βαπτισμῶν என்பதன் மையமான ‘கழுவுதல்கள்’ என்ற பொருளைத் தெளிவாகக் காக்க ‘சடங்குமுறை கழுவுதல்கள்’ பயன்படுத்தப்பட்டுள்ளது; இதனால் கிறிஸ்தவத் திருமுழுக்கை மட்டுமே குறிக்கும் வாசிப்பை முதன்மைப்படுத்தாமலும், ‘தூய்மைச் சடங்குகள்’ என்ற பரந்த பொருளைத் தவிர்த்தும் உள்ளது. ஒருமுறை மட்டுமே வரும் διδαχήν-இன் ஆளுகையை இயல்பான தமிழ்ச் சொற்றொடரால் பட்டியல் முழுவதற்கும் வைத்திருக்கிறது.
