source:
  edition: SBLGNT
  text: ἵνα διὰ δύο πραγμάτων ἀμεταθέτων, ἐν οἷς ἀδύνατον ψεύσασθαι ⸀θεόν, ἰσχυρὰν παράκλησιν ἔχωμεν οἱ καταφυγόντες κρατῆσαι τῆς προκειμένης ἐλπίδος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/018.yaml
  text: so that through two unchangeable things[a], in which it is impossible for God to lie[b], we who have fled for refuge might have strong encouragement to take hold of the hope set before us.
translation:
  language: ta
  text: இது, மாற்ற முடியாத இரண்டு காரியங்களின் மூலம்—அந்த இரண்டிலும் கடவுள் பொய் சொல்வது இயலாதது—அடைக்கலம் தேடி ஓடிவந்த நாம், நமக்கு முன்வைக்கப்பட்டுள்ள நம்பிக்கையைப் பற்றிக்கொள்ள வலிமையான ஊக்கத்தைப் பெறுவதற்காகவே.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: பெறுவதற்காகவே
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட செயலின் நோக்கத்தையும் விளைவையும் சுட்டும் ἵνα என்பதன் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: διὰ δύο πραγμάτων ἀμεταθέτων
  choice: மாற்ற முடியாத இரண்டு காரியங்களின் மூலம்
  rationale: πράγματα என்பது பொதுவாக ‘காரியங்கள்’ எனப் பொருள்படும்; ἀμετάθετος அவற்றை மாற்றவோ செல்லாததாக்கவோ முடியாது என்பதைக் காட்டுகிறது. சூழலில் இவை கடவுளின் வாக்குறுதியையும் ஆணையையும் குறிக்கின்றன; அவற்றை நேரடியாக உரையில் சேர்க்கவில்லை.
- source_word: ἐν οἷς
  choice: அந்த இரண்டிலும்
  rationale: முன்னர் குறிப்பிடப்பட்ட இரண்டு காரியங்களுடனான தொடர்பைத் தெளிவாகக் காக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: ἀδύνατον ψεύσασθαι θεόν
  choice: கடவுள் பொய் சொல்வது இயலாதது
  rationale: கிரேக்கத்தின் ஆளற்ற இலக்கண அமைப்பையும் அதன் அழுத்தத்தையும் காக்கிறது; ‘கடவுளால் பொய் சொல்ல முடியாது’ என்ற சுருக்கத்தைவிட மூல வடிவுக்கு நெருக்கமானது.
- source_word: ἰσχυρὰν παράκλησιν
  choice: மிகுந்த ஊக்கம்
  rationale: παράκλησις இச்சூழலில் ஆறுதல், ஊக்கம், உற்சாகமூட்டல் ஆகிய பொருள் நிழல்களைக் கொண்டது. ‘மிகுந்த ஊக்கம்’ என்பது உறுதிப்படுத்தும் வலிமையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἔχωμεν
  choice: பெற
  rationale: தமிழில் ‘ஊக்கம் பெற’ என்பது இயல்பான இணைச்சொல்; ἵνα உடன் சேர்ந்த நோக்கம்/விளைவு அமைப்புக்குள் துணைவினை வடிவில் கொடுக்கப்பட்டுள்ளது.
- source_word: οἱ καταφυγόντες
  choice: அடைக்கலம் தேடி ஓடிவந்திருக்கிற நாம்
  rationale: பாதுகாப்புக்காக ஓடிவரும் இயக்கத்தையும் அடைக்கலம் புகும் நோக்கத்தையும் இரண்டையும் காக்கிறது; இதை வெறும் ‘அடைக்கலம் அடைந்த நாம்’ என்று கருத்துச் சுருக்கமாக்கவில்லை.
- source_word: κρατῆσαι
  choice: பற்றிக்கொள்ள
  rationale: κρατέω என்பதிலுள்ள பிடித்தல் மற்றும் விடாமல் பற்றியிருத்தல் ஆகிய இரு பொருள் நிழல்களையும் தமிழ் வினை இயல்பாகத் தாங்குகிறது.
- source_word: τῆς προκειμένης ἐλπίδος
  choice: நமக்கு முன்வைக்கப்பட்டுள்ள நம்பிக்கையை
  rationale: நம்பிக்கை மக்களுக்கு முன் வைக்கப்பட்டு அணுகத்தக்கதாக இருப்பதை πρόκειμαι குறிக்கிறது. ‘நமக்கு’ என்பது கிரேக்கத்தில் உள்ளடங்கிய தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: அடைக்கலம் மற்றும் நம்பிக்கை ஆகிய உருவகங்களின் தொடர்பு
  choice: ‘அடைக்கலம் தேடி ஓடிவந்திருக்கிற’ என்றும் ‘நம்பிக்கையைப் பற்றிக்கொள்ள’ என்றும் இரு உயிரோட்டமான உருவகங்களும் காக்கப்பட்டன.
  alternative: ‘அடைக்கலம் அடைந்த நாம், நம்பிக்கையில் உறுதியாக இருக்க’ என்று கருத்தைச் சுருக்குதல்.
  rationale: மூலம் பாதுகாப்பை நாடி ஓடுவதையும் முன்வைக்கப்பட்ட நம்பிக்கையைச் செயற்பாட்டுடன் பற்றிக்கொள்வதையும் இணைக்கிறது; அதை வெறும் கோட்பாட்டு உறுதிப்பாடாக மாற்றக்கூடாது.
- issue: கடவுளின் உண்மைத்தன்மை
  choice: ‘கடவுள் பொய் சொல்வது இயலாதது’ என்று நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘கடவுள் எப்போதும் உண்மையுள்ளவர்’ என்று விளக்கமாக மாற்றுதல்.
  rationale: மூலத்தின் வலுவான எதிர்மறைக் கூற்றை அப்படியே காக்கிறது; கடவுளின் இயல்பைப் பற்றிய மேலதிக தத்துவ விளக்கத்தை உரைக்குள் சேர்க்கவில்லை.
- issue: மாற்ற முடியாத இரண்டு காரியங்களின் அடையாளம்
  choice: உரையில் அவற்றை ‘இரண்டு காரியங்கள்’ என்றே வைத்துள்ளது.
  alternative: ‘வாக்குறுதி மற்றும் ஆணை’ என்று வெளிப்படையாகப் பெயரிடுதல்.
  rationale: முந்தைய சூழல் அவற்றை வாக்குறுதியும் ஆணையும் என்று உணர்த்தினாலும், இவ்வசனத்தின் பொதுவான πράγματα என்ற சொல்லை விளக்க உரையாக விரிவாக்காமல் அதன் குறிப்புத் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் வேதவாக்கியத்துக்குரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. வசனம் முந்தைய கருத்தை நோக்கம்/விளைவுடன் தொடர்வதால் ‘இது ... பெறுவதற்காகவே’ என்ற இணைப்புக் கட்டமைப்பு பயன்படுத்தப்பட்டது. செம்மொழிச் சுமை மிகுந்த சொற்களும் குறிப்பிட்ட சமயப்பிரிவின் தொழில்நுட்ப மொழியும் தவிர்க்கப்பட்டன.
