  to: இது, மாற்ற முடியாத இரண்டு காரியங்களின் மூலம்—அந்த இரண்டிலும் கடவுள் பொய் சொல்வது இயலாதது—அடைக்கலம் தேடி ஓடிவந்த நாம், நமக்கு முன்வைக்கப்பட்டுள்ள நம்பிக்கையைப் பற்றிக்கொள்ள வலிமையான ஊக்கத்தைப் பெறுவதற்காகவே.
  rationale: சிறிய நடை மற்றும் சொல்-வலிமைத் திருத்தங்கள் மட்டுமே செய்யப்பட்டுள்ளன. மூலத்தின் நோக்கத் தொடர்ச்சி, இரண்டு உருவகங்கள், மற்றும் கடவுள் பொய் சொல்ல இயலாமை பற்றிய நேரடியான கூற்று அனைத்தும் மாற்றமின்றிக் காக்கப்பட்டுள்ளன.
