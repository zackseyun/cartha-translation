source:
  edition: SBLGNT
  text: Ἀδύνατον γὰρ τοὺς ἅπαξ φωτισθέντας γευσαμένους τε τῆς δωρεᾶς τῆς ἐπουρανίου καὶ μετόχους γενηθέντας πνεύματος ἁγίου
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/004.yaml
  text: For it is impossible[a], in the case of those who were once enlightened, and who tasted the heavenly gift, and became partakers of the Holy Spirit[c][b],
translation:
  language: ta
  text: ஏனெனில், ஒருமுறை ஒளியூட்டப்பட்டு[a], பரலோக ஈவைச் சுவைத்து[b], பரிசுத்த ஆவியில் பங்குபெற்றவர்களாகி[c] இருப்பவர்களைப் பொறுத்தவரை, இயலாதது—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஒளியூட்டப்பட்டு’ என்பது ஆன்மீக ஒளி அல்லது போதனையைப் பெற்றதைப் பொதுவாகக் குறிக்கலாம்; சிலர் இதை மனமாற்றம் அல்லது திருமுழுக்குடன் குறிப்பாக இணைத்துப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘பரலோக ஈவை அனுபவித்து.’ மூல வினைச்சொல்லின் நேரடிப் பொருள் ‘சுவைத்து’; அது வெறும் சிறிதளவு மாதிரி பார்த்ததை மட்டுமல்லாமல் உண்மையான அனுபவத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘பரிசுத்த ஆவியைப் பகிர்ந்துகொண்டவர்களாக’ அல்லது ‘பரிசுத்த ஆவியில் பங்கேற்றவர்களாக.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδύνατον
  choice: அது இயலாதது
  rationale: வாக்கியத்தின் தொடக்கத்தில் வலியுறுத்தப்பட்டுள்ள பயனிலைப் பெயரடையின் பொருளைத் தெளிவாகக் காக்கிறது. எது இயலாதது என்பது அடுத்த வசனத்தில் நிறைவுபெறுவதால், ‘அது’ என்பது தமிழ் இலக்கணத்திற்காகச் சேர்க்கப்பட்டுள்ளது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய எச்சரிப்புக்கான விளக்கத் தொடர்பை இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: ἅπαξ φωτισθέντας
  choice: ஒருமுறை ஒளியூட்டப்பட்டு
  rationale: ‘ஒருமுறை’ என்பதையும் ஒளி குறித்த உருவகத்தையும் காக்கிறது; மனமாற்றம் அல்லது திருமுழுக்கு என்று பொருளைச் சுருக்கவில்லை.
- source_word: γευσαμένους
  choice: சுவைத்து
  rationale: மூலச் சொல்லின் நேரடியான சுவை உருவகத்தைக் காக்கிறது; அது வெறும் சிறிதளவு சோதித்தல் என்று தீர்மானிக்கவில்லை.
- source_word: τῆς δωρεᾶς τῆς ἐπουρανίου
  choice: பரலோக ஈவை
  rationale: ஈவின் அடையாளத்தை விளக்கிச் சேர்க்காமல், மூலத்தின் சுருக்கமான பண்புத்தொடரைப் பாதுகாக்கிறது.
- source_word: μετόχους γενηθέντας πνεύματος ἁγίου
  choice: பரிசுத்த ஆவியில் பங்குபெற்றவர்களாக ஆன
  rationale: γίνομαι குறிக்கும் ஒரு நிலைக்கு வந்ததையும் μέτοχος குறிக்கும் உண்மையான பங்கையும் வெளிப்படுத்துகிறது; அந்தப் பங்கின் இரட்சிப்பியல் தன்மையை முன்கூட்டியே வரையறுக்கவில்லை.
theological_decisions:
- issue: φωτισθέντας என்பது மனமாற்றத்தையா திருமுழுக்கையா குறிப்பதாக மொழிபெயர்க்க வேண்டுமா?
  choice: ஒளியூட்டப்பட்டு
  alternative: மனமாற்றமடைந்து / திருமுழுக்குப் பெற்று
  rationale: கிரேக்கம் ஒளியூட்டுதல் என்ற விரிவான உருவகத்தையே பயன்படுத்துகிறது. குறிப்பிட்ட திருச்சபை மரபின் விளக்கத்தை வசனத்திற்குள் கொண்டுவராமல் அதன் திறந்த பொருளை வைத்திருக்கிறது.
- issue: γευσαμένους என்பது மேலோட்டமாகச் சுவைத்ததா அல்லது உண்மையாக அனுபவித்ததா?
  choice: சுவைத்து
  alternative: அனுபவித்து / சிறிதளவு சுவைத்துப் பார்த்து
  rationale: ‘சுவைத்தல்’ உண்மையான அனுபவத்தையும் குறிக்கக்கூடும். அனுபவத்தின் ஆழத்தை மொழிபெயர்ப்பிலேயே தீர்மானிக்காமல் விடுகிறது.
- issue: பரிசுத்த ஆவியில் பங்குபெறுதல் முழுமையான இரட்சிப்புப் பங்கையா குறிக்கிறது?
  choice: பரிசுத்த ஆவியில் பங்குபெற்றவர்களாக ஆன
  alternative: பரிசுத்த ஆவியைப் பெற்றவர்கள் / பரிசுத்த ஆவியோடு தொடர்புடையவர்கள்
  rationale: மூலத்தின் வலிமையான பங்கேற்புச் சொல்லை வைத்துக்கொண்டு, விசுவாசத்திலிருந்து விலகுதல் மற்றும் நிலைத்திருத்தல் பற்றிய விவாதத்தைத் தனியாகத் தீர்க்கவில்லை.
- issue: வசனம் 4 தனியே முழுமையான வாக்கியமல்ல
  choice: இறுதியில் நீள்கோடு வைத்து தொடரும் அமைப்பாக வழங்குதல்
  alternative: அடுத்த வசனத்தின் ‘மீண்டும் மனந்திரும்பும்படி புதுப்பிப்பது’ என்ற சொற்களை இவ்வசனத்தில் சேர்த்தல்
  rationale: கிரேக்க வாக்கியம் அடுத்த வசனங்கள் வரை தொடர்கிறது. மூல வசன எல்லையை மீறிச் சொற்களைச் சேர்க்காமல், முழுமையடையாத தொடரை வாசகருக்குக் காட்டுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘ஈவு’ சுருக்கமானதும் புரிந்துகொள்ளத்தக்கதுமான சமயச் சொல்; ‘பங்குபெற்றவர்களாக ஆன’ என்பது பாரம்பரியத் தொனியையும் இயல்பான தமிழ் தொடரையும் சமநிலைப்படுத்துகிறது. வசனம் அடுத்த வசனத்தில் இலக்கணரீதியாகத் தொடர்வதை நீள்கோடு உணர்த்துகிறது.
