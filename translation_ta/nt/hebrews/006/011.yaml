source:
  edition: SBLGNT
  text: ἐπιθυμοῦμεν δὲ ἕκαστον ὑμῶν τὴν αὐτὴν ἐνδείκνυσθαι σπουδὴν πρὸς τὴν πληροφορίαν τῆς ἐλπίδος ἄχρι τέλους,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/011.yaml
  text: And we desire each one of you to show the same diligence for the full assurance of hope until the end[b][a],
translation:
  language: ta
  text: மேலும், உங்களில் ஒவ்வொருவரும் நம்பிக்கையின் முழு உறுதிக்காக முடிவுவரை[b] அதே முனைப்பைக் காட்ட வேண்டும் என்று நாங்கள் விரும்புகிறோம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நம்பிக்கையின் முழுமையான நிச்சயம்.’ கிரேக்கச் சொல் நிறைவான நிச்சயத்தையோ முழு உறுதியையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘இறுதிவரை.’ இந்தச் சொற்றொடர் நிறைவு எட்டப்படும் வரையிலும் விடாமுயற்சியுடன் தொடர்வதை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμοῦμεν
  choice: நாங்கள் விரும்புகிறோம்
  rationale: இந்த வினைச்சொல் வலுவான விருப்பத்தையோ ஏக்கத்தையோ குறிக்கலாம். இங்கு மேய்ப்புப் பணிக்குரிய கனிவான அறிவுரை இடம்பெறுவதால், ‘விரும்புகிறோம்’ என்பது அதன் தீவிரத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: δὲ
  choice: மேலும்
  rationale: முந்தைய உறுதியளிப்பிலிருந்து தொடர்ந்து வரும் அறிவுரைக்கு δέ மென்மையான இடைமாற்றத்தைத் தருகிறது. அதிகமான முரண்பாட்டை உணர்த்தாமல் தொடர்ச்சியைச் சுட்ட ‘மேலும்’ பொருத்தமானது.
- source_word: ἕκαστον ὑμῶν
  choice: உங்களில் ஒவ்வொருவரும்
  rationale: குழுவிலுள்ள ஒவ்வொரு நபருக்கும் அறிவுரை தனித்தனியாகப் பொருந்துவதை இந்தச் சொற்றொடர் வலியுறுத்துகிறது.
- source_word: τὴν αὐτὴν
  choice: அதே
  rationale: முந்தைய வசனத்தில் அன்பிலும் பணிவிடையிலும் வெளிப்பட்ட முனைப்பை இது பின்னோக்கிச் சுட்டுகிறது.
- source_word: ἐνδείκνυσθαι
  choice: காட்ட வேண்டும்
  rationale: ஒரு பண்பைச் செயலில் வெளிப்படுத்துதல் என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: σπουδὴν
  choice: முனைப்பு
  rationale: σπουδή குறிக்கும் அக்கறையுடனான தொடர்ந்த செயற்பாட்டையும் தீவிரத்தையும் ‘முனைப்பு’ நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πρὸς
  choice: அடைவதற்காக
  rationale: இங்கு πρός இலக்கையோ நோக்கத்தையோ சுட்டுகிறது. தமிழில் வாக்கியத்தின் இயல்புக்காக அந்தத் திசைநோக்கிய பொருள் நோக்கவினை வடிவில் தரப்பட்டுள்ளது.
- source_word: πληροφορίαν
  choice: முழு உறுதி
  rationale: முழுமையான நிச்சயம் அல்லது நிறைவான உறுதி ஆகிய பொருட்களை இச்சொல் கொண்டுள்ளது. ‘முழு உறுதி’ அவற்றைச் சுருக்கமாகவும் தெளிவாகவும் தக்கவைக்கிறது.
- source_word: ἐλπίδος
  choice: நம்பிக்கையின்
  rationale: இது வெறும் ஆசையை அல்ல, தேவனுடைய வாக்குறுதியைச் சார்ந்த எதிர்பார்ப்பைக் குறிக்கிறது. கிரேக்க மொழியின் வேற்றுமைத் தொடர்பைத் திறந்த நிலையில் வைக்க உரிமைத் தொடர்பு வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἄχρι τέλους
  choice: முடிவுவரை
  rationale: குறித்த நிறைவு எட்டப்படும் வரையிலான தொடர்ச்சியையும் நிலைத்திருத்தலையும் நேரடியாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘நம்பிக்கையின் முழு உறுதி’ என்பதற்கும் முடிவுவரை நிலைத்திருப்பதற்கும் உள்ள தொடர்பு
  choice: நம்பிக்கை முழு உறுதியை அடைவதையும் அது முடிவுவரை தொடர வேண்டியதையும் வெளிப்படுத்தும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: இதை இரட்சிப்பைப் பற்றிய முழுமையான உள்ளார்ந்த நிச்சயம் என்று மட்டும் கொள்ளலாம்; அல்லது நம்பப்பட்ட வாக்குறுதி முழுமையாக நிறைவேறுதல் என்று மட்டும் கொள்ளலாம்.
  rationale: கிரேக்கச் சொற்றொடர் தனிப்பட்ட உள்ளார்ந்த உறுதியையும் கிறிஸ்தவ நம்பிக்கையோடு இணைந்த நிலையான நிச்சயத்தையும் ஒருங்கே சுட்டக்கூடும். எனவே பிற்காலக் கோட்பாட்டு அமைப்பு ஒன்றுக்குள் அதன் பொருளைச் சுருக்காமல் அந்த இறையியல் அழுத்தம் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு விளங்கும் அதேவேளையில் கண்ணியமான அறிவுரைத் தொனி பயன்படுத்தப்பட்டுள்ளது. ‘முனைப்பு’ செயலில் வெளிப்படும் தொடர்ந்த அக்கறையைச் சுட்டுகிறது; ‘நம்பிக்கையின் முழு உறுதி’ என்பது மூலத்தின் பொருள் பரப்பைச் சுருக்காமல் வைக்கிறது.
