  source_fidelity: The Tamil preserves the inferential force of Διό ('ஆகவே'), the citation formula καθὼς λέγει ('பரிசுத்த ஆவியானவர் கூறுவதுபோல'), and the direct attribution to the Holy Spirit. The conditional opening of the Psalm citation, 'இன்று நீங்கள் அவருடைய குரலைக் கேட்டால்,' accurately represents Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε without adding the idea of obedience.
  naturalness: The wording is clear, idiomatic modern standard Tamil, with an appropriately dignified biblical register. The colon and the comma inside the opening quotation suitably indicate that the cited sentence continues in the following verse.
  terminology: ‘பரிசுத்த ஆவியானவர்’ is established Tamil Christian usage for τὸ πνεῦμα τὸ ἅγιον. ‘அவருடைய குரல்’ correctly retains the personal reference and does not over-interpret ‘hear’ as ‘obey.’
