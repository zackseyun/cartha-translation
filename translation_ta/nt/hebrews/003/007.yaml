id: HEB.3.7
reference: Hebrews 3:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Διό, καθὼς λέγει τὸ πνεῦμα τὸ ἅγιον· Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/007.yaml
  text: 'Therefore, just as the Holy Spirit says: “Today, if you hear his voice,”'
translation:
  language: ta
  text: 'ஆகவே, பரிசுத்த ஆவியானவர் கூறுவதுபோல: “இன்று நீங்கள் அவருடைய குரலைக் கேட்டால்,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διό
  choice: ஆகவே
  rationale: முந்தைய கருத்திலிருந்து வரும் முடிவைச் சுட்டும் இணைப்பை இயல்பான நவீனத் தமிழில் தெளிவாகப் பேணுகிறது.
- source_word: καθὼς
  choice: கூறுவதுபோல
  rationale: மேற்கோள் அறிமுகப்படுத்தும் ஒப்புமைத் தொடர்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; λέγει என்பதையும் இதனுடன் சேர்த்து சரளமாக மொழிபெயர்க்கிறது.
- source_word: λέγει
  choice: கூறுகிறார்
  rationale: கிரேக்க நிகழ்காலத்தைப் பேணி, வேதவாக்கின் தொடர்ந்துரைக்கும் தன்மையை அளவுக்கு மீறி விளக்காமல் வெளிப்படுத்துகிறது.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: பரிசுத்த ஆவியானவர்
  rationale: தமிழ் கிறிஸ்தவப் பயன்பாட்டில் நிலைபெற்ற, கண்ணியமான நேரடி இணை; கிரேக்கத்தில் இல்லாத கூடுதல் வலியுறுத்தல் சேர்க்கப்படவில்லை.
- source_word: Σήμερον
  choice: இன்று
  rationale: சங்கீத மேற்கோளின் காலக் குறிப்பு நேரடியாகவும் இயல்பாகவும் வழங்கப்படுகிறது.
- source_word: ἐὰν
  choice: என்றால்
  rationale: நிபந்தனையைத் தமிழில் இயல்பாகக் காட்டுகிறது; தனியே மொழிபெயர்க்காமல் கேட்டால் என்ற வினை வடிவில் இணைக்கப்பட்டுள்ளது.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: அவருடைய குரலை
  rationale: ἀκούω உடனான உருபுச் சார்பைத் தமிழில் நேரடி செயப்படுபொருளாக மாற்றி, தனிப்பட்ட குரல் என்ற பொருளைப் பேணுகிறது.
- source_word: ἀκούσητε
  choice: நீங்கள் ... கேட்டால்
  rationale: ἐὰν உடனான இறந்தகாலத் தோற்றமுள்ள துணைவினை நிபந்தனையை இயல்பான தமிழில் வழங்குகிறது; ‘கீழ்ப்படிந்தால்’ எனப் பொருளை விரிவாக்கவில்லை.
theological_decisions:
- issue: சங்கீத மேற்கோளின் பேச்சாளர் யார் என்பது
  choice: மேற்கோளைப் பரிசுத்த ஆவியானவர் கூறுவதாக நேரடியாக அறிமுகப்படுத்துதல்
  alternative: பரிசுத்த ஆவியானவர் வேதவாக்கின் வழியாக அல்லது சங்கீதக்காரர் வழியாகக் கூறுகிறார் என விரிவாக்குதல்
  rationale: கிரேக்க உரை வெளிப்படையாக ‘பரிசுத்த ஆவியானவர் கூறுகிறார்’ என்கிறது. அகத்தூண்டுதலைப் பற்றிய மேலதிக கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல் அந்த நேரடி attribution-ஐ மொழிபெயர்ப்பு பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடை. மேற்கோள் அடுத்த வசனத்தில் தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
