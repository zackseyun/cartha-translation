source:
  edition: SBLGNT
  text: πιστὸν ὄντα τῷ ποιήσαντι αὐτὸν ὡς καὶ Μωϋσῆς ⸀ἐν τῷ οἴκῳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/002.yaml
  text: who was faithful to the one who appointed him[b][a], just as Moses also was in all his house.
translation:
  language: ta
  text: தம்மை நியமித்தவருக்கு[a] அவர் உண்மையுள்ளவராக இருந்தார்; அதுபோலவே மோசேயும் அவருடைய வீட்டில்[b] உண்மையுள்ளவராக இருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தம்மை உருவாக்கியவருக்கு.’ கிரேக்க வினைச்சொல்லுக்கு ‘உருவாக்கு’ என்ற பொருளும் உண்டு; இச்சூழலில் அது ‘நியமித்தார்’ அல்லது ‘பணி ஒப்படைத்தார்’ என்ற பொருளைக் கொண்டிருக்க வாய்ப்பு அதிகம்.
    reason: lexical_alternative
  - marker: b
    text: சில கையெழுத்துப் பிரதிகளில், ‘அவருடைய வீடு முழுவதிலும்’ என்று உள்ளது; இது எண்ணாகமம் 12:7-ஐ நெருக்கமாக எதிரொலிக்கிறது. இங்கு ‘வீடு’ என்பது பெரும்பாலும் கடவுளுடைய வீட்டைக் குறிக்கிறது.
    reason: textual_variant
lexical_decisions:
- source_word: πιστὸν ὄντα
  choice: அவர் உண்மையுள்ளவராக இருந்தார்
  rationale: இந்த வினையெச்சத் தொடர் முந்தைய வசனத்தில் குறிப்பிடப்பட்ட இயேசுவை விளக்குகிறது. தமிழில் இயல்பான முழு வாக்கியமாக அமைத்தாலும், ‘உண்மையுள்ளவர்’ என்பது நம்பகத்தன்மையையும் கடமையில் உண்மையையும் குறிக்கும் மூலச்சொல்லின் பொருளைப் பேணுகிறது.
- source_word: τῷ ποιήσαντι αὐτὸν
  choice: தம்மை நியமித்தவருக்கு
  rationale: ποιέω என்பதற்கு பொதுவாக ‘செய்/உருவாக்கு’ என்ற பொருள் இருந்தாலும், இங்கு மோசேயோடு செய்யப்படும் ஒப்பீடும் பொறுப்பு ஒப்படைக்கப்பட்ட பணியைப் பற்றிய சூழலும் ‘நியமித்தவர்’ என்ற பொருளை ஆதரிக்கின்றன. மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ὡς καὶ
  choice: அதுபோலவே ... மோசேயும்
  rationale: இயேசுவின் உண்மைத்தன்மையையும் மோசேயின் உண்மைத்தன்மையையும் ஒப்பிடும் தொடரை நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: Μωϋσῆς
  choice: மோசே
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: ἐν τῷ οἴκῳ αὐτοῦ
  choice: அவருடைய வீட்டில்
  rationale: SBLGNT முதன்மை உரையில் உள்ள சொற்களைப் பின்பற்றி ‘முழுவதிலும்’ என்பதைச் சேர்க்கவில்லை. அடுத்த வசனங்களில் வளர்க்கப்படும் ‘வீடு’ உருவகத்தையும், αὐτοῦ என்ற சுட்டுப்பெயரின் இயல்பான தெளிவின்மையையும் இந்த மொழிபெயர்ப்பு பேணுகிறது.
theological_decisions:
- issue: குமாரனைச் சார்ந்த ποιήσαντι என்பதன் பொருள்
  choice: நியமித்தவருக்கு
  alternative: உருவாக்கியவருக்கு / உண்டாக்கியவருக்கு
  rationale: ‘உருவாக்கினார்’ என்பது சொல்லளவில் சாத்தியமானது; ஆனால் இச்சூழலில் அது குமாரன் படைக்கப்பட்டவர் என்ற தேவையற்ற முடிவைத் தூண்டக்கூடும். மோசேயோடு ஒப்பிடப்படும் ஒப்படைக்கப்பட்ட பணி என்ற சூழலில் ‘நியமித்தார்’ பொருத்தமானது; சொல்லின் மாற்றுப் பொருள் மறைக்கப்படாமல் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- issue: ‘அவருடைய வீடு’ என்பதில் αὐτοῦ யாரைக் குறிக்கிறது
  choice: சுட்டுப்பெயரை ‘அவருடைய’ என்றே வைத்தல்; சூழலில் அது பெரும்பாலும் கடவுளுடைய வீட்டைக் குறிக்கிறது
  alternative: மோசேயின் வீடு என்று வெளிப்படையாகக் கூறுதல்
  rationale: எண்ணாகமம் 12:7-ன் பின்னணியும், நியமித்தவரைப் பற்றிய உடனடி சூழலும் கடவுளுடைய வீட்டைச் சுட்டுகின்றன. எனினும் மூலத்தின் சுட்டுப்பெயரை விரிவாக்காமல் வைத்திருப்பது அதன் வடிவத்தையும் சிறு அளவிலான தெளிவின்மையையும் பேணுகிறது.
- issue: ‘அனைத்து/முழு வீட்டில்’ என்ற வாசக வேறுபாடு
  choice: முதன்மை உரைப்படி ‘அவருடைய வீட்டில்’
  alternative: ‘அவருடைய வீடு முழுவதிலும்’
  rationale: வழங்கப்பட்ட SBLGNT உரையில் πάντι அல்லது ὅλῳ இல்லை. சில கையெழுத்துப் பிரதிகளின் விரிவான வாசகம் எண்ணாகமம் 12:7-ஐ இன்னும் நெருக்கமாக எதிரொலிக்கிறது; அது அடிக்குறிப்பில் பதிவு செய்யப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘வீடு’ என்ற சொல் அடுத்த வசனங்களின் உருவகத் தொடரைத் தக்கவைக்கிறது; ‘குடும்பம்’ அல்லது ‘வீட்டார்’ என்று விளக்கமாக மாற்றப்படவில்லை. ‘அவர்’ என்ற மரியாதை ஒருமை இயேசுவுக்கும், ‘அவருடைய’ என்பது மூலத்தின் சுட்டுப்பெயருக்கும் பயன்படுத்தப்பட்டுள்ளது.
