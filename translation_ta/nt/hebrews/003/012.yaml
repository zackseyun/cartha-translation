source:
  edition: SBLGNT
  text: βλέπετε, ἀδελφοί, μήποτε ἔσται ἔν τινι ὑμῶν καρδία πονηρὰ ἀπιστίας ἐν τῷ ἀποστῆναι ἀπὸ θεοῦ ζῶντος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/012.yaml
  text: Watch out[a], brothers[c][b], lest there be in any of you an evil heart of unbelief in turning away from the living God.
translation:
  language: ta
  text: சகோதரர்களே[a], உங்களில் எவரிடமாவது உயிருள்ள கடவுளைவிட்டு விலகுவதில்[c] அவிசுவாசம் நிறைந்த தீய இதயம்[b] இருந்துவிடாதபடி எச்சரிக்கையாயிருங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சகோதரர்களே’ என்பது ஆண்பால் பன்மையான ἀδελφοί என்பதன் மொழிபெயர்ப்பு; இச்சொல் ஆண்களும் பெண்களும் அடங்கிய சக விசுவாசிகள் குழுவை அழைக்கவும் பயன்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘விசுவாசமற்ற தீய இதயம்.’
    reason: alternative_reading
  - marker: c
    text: அல்லது, ‘உயிருள்ள கடவுளைவிட்டுப் பிரிந்துபோகுவதில்’ அல்லது ‘உயிருள்ள கடவுளைவிட்டு விலகிச் செல்வதில்.’
    reason: alternative_reading
lexical_decisions:
- source_word: βλέπετε
  choice: எச்சரிக்கையாயிருங்கள்
  rationale: நிகழ்காலக் கட்டளை வடிவின் தொடர்ந்த விழிப்புணர்வையும் எச்சரிக்கையின் வலிமையையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்களே
  rationale: அழைப்புவடிவிலுள்ள ஆண்பால் பன்மையை நேரடியாகப் பாதுகாக்கிறது; இது சக விசுவாசிகள் அடங்கிய கலப்புக் குழுவையும் குறிக்கக்கூடும் என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: μήποτε ἔσται ἔν τινι ὑμῶν
  choice: உங்களில் எவரிடமாவது ... இருந்துவிடாதபடி
  rationale: கேடான நிலை யாரிடமாவது உருவாகக்கூடிய அபாயத்தை எச்சரிக்கும் கிரேக்கத் தொடரின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: καρδία
  choice: இதயம்
  rationale: சிந்தனை, விருப்பம், பற்றுதல் ஆகியவற்றின் உள்மையத்தைக் குறிக்கும் வேதாகம உருவகத்தையும் அதன் இறையியல் ஒலியையும் தக்கவைக்கிறது.
- source_word: πονηρὰ
  choice: தீய
  rationale: வெறும் குறைபாட்டை அல்ல, ஒழுக்கரீதியான தீமையைக் குறிக்கும் சொல்லின் வலிமையைப் பாதுகாக்கிறது.
- source_word: ἀπιστίας
  choice: அவிசுவாசமுள்ள
  rationale: எபிரெயர் 3-இன் உடனடிச் சூழலில் கடவுளுடைய வார்த்தையை நம்பத் தவறுவதே முன்னிலையாக இருப்பதால் இத்தேர்வு பொருத்தமானது; ‘விசுவாசமற்ற’ என்ற பொருளும் சாத்தியம்.
- source_word: ἐν τῷ ἀποστῆναι / ἀποστῆναι
  choice: விலகிச் செல்லும்
  rationale: புறப்படுதல் அல்லது விலகுதல் என்ற வினையின் நேரடியான தீவிரத்தைத் தருகிறது; ‘விசுவாசத்தை முற்றிலும் துறத்தல்’ போன்ற பிற்காலத் தொழில்நுட்ப இறையியல் சொல்லைத் திணிக்கவில்லை. தமிழின் இயல்புக்காக இதயத்தை விளக்கும் வினையெச்சத் தொடராக அமைக்கப்பட்டுள்ளது.
- source_word: ἀπὸ θεοῦ ζῶντος
  choice: உயிருள்ள கடவுளைவிட்டு
  rationale: கிரேக்கத்தின் அங்கீகரிக்கப்பட்ட வேதாகமச் சொல்லாட்சியையும் ἀπό குறிக்கும் பிரிதல் அல்லது விலகுதலையும் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: ἀπιστίας என்பது ‘அவிசுவாசம்’ எனவா, ‘விசுவாசமின்மை/உண்மையின்மை’ எனவா மொழிபெயர்க்கப்பட வேண்டும்?
  choice: அவிசுவாசமுள்ள
  alternative: விசுவாசமற்ற
  rationale: சுற்றியுள்ள பகுதியில் கடவுளுடைய குரலைக் கேட்டு நம்ப மறுத்த இஸ்ரவேலரின் எடுத்துக்காட்டு மையமாக உள்ளது. ஆகவே ‘அவிசுவாசம்’ சூழலுக்கு ஏற்றது; எனினும் உண்மைத்தவறின் அறநெறிப் பரிமாணத்தை அடிக்குறிப்பில் திறந்துவைக்கிறது.
- issue: ἀποστῆναι என்பதற்கு தொழில்நுட்ப இறையியல் பொருளான ‘விசுவாசத்தைத் துறத்தல்’ கொடுக்க வேண்டுமா?
  choice: விலகிச் செல்லும்
  alternative: பிரிந்துபோகும் / விசுவாசத்தைத் துறக்கும்
  rationale: மூலவினை விலகுதல், பிரிதல் ஆகியவற்றைக் குறிக்கிறது. பிரதான உரை எச்சரிக்கையின் தீவிரத்தைப் பாதுகாக்கிறது; ஆனால் பின்னாளில் உருவான ஒரு குறிப்பிட்ட கோட்பாட்டு வகையைத் திணிக்காமல் உண்மையான பொருள் அகலத்தை வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான எச்சரிக்கை நடையைப் பயன்படுத்துகிறது. ‘இதயம்’, ‘உயிருள்ள கடவுள்’ ஆகிய வேதாகம உருவகச் சொல்லாட்சிகள் தக்கவைக்கப்பட்டுள்ளன; வாக்கிய அமைப்பு தமிழில் இயல்பாக இருக்கச் சிறிது மறுவரிசைப்படுத்தப்பட்டுள்ளது.
