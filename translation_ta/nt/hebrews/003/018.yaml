id: HEB.3.18
reference: Hebrews 3:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τίσιν δὲ ὤμοσεν μὴ εἰσελεύσεσθαι εἰς τὴν κατάπαυσιν αὐτοῦ εἰ μὴ τοῖς ἀπειθήσασιν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/018.yaml
  text: And to whom did he swear that they would not enter his rest[a], if not to those who disobeyed?
translation:
  language: ta
  text: மேலும், கீழ்ப்படியாதவர்களைத் தவிர வேறு யாரைக் குறித்து, “அவர்கள் தமது இளைப்பாறுதலுக்குள் நுழையமாட்டார்கள்” என்று அவர் சத்தியம் செய்தார்?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίσιν
  choice: வேறு யாரிடம்
  rationale: இது மனிதர்களைக் குறிக்கும் பன்மை வேற்றுமை வினாப்பெயர். εἰ μή உடன் வரும் எதிர்பார்க்கப்பட்ட பதிலைத் தமிழில் இயல்பான வினாவாக வெளிப்படுத்துகிறது.
- source_word: δὲ
  choice: மேலும்
  rationale: முந்தைய வசனத்தின் தொடர்ச்சியான வினாவுடன் இவ்வசனத்தை இணைக்கிறது; தேவையற்ற எதிர்மறை முரண்பாட்டை உருவாக்காது.
- source_word: ὤμοσεν
  choice: ஆணையிட்டார்
  rationale: ὀμνύω என்பதன் சத்தியம் செய்தல் அல்லது உறுதிமொழியுடன் அறிவித்தல் என்ற வலிமையைச் சுருக்கமாகவும் கண்ணியமாகவும் தருகிறது.
- source_word: μὴ εἰσελεύσεσθαι
  choice: அவர்கள் ... நுழையமாட்டார்கள் என்று
  rationale: ஆணையின் உள்ளடக்கத்தைத் தெரிவிக்கும் இறந்தகால infinitive அமைப்பைத் தமிழில் இயல்பான மேற்கோள்சார் வாக்கியமாக வழங்குகிறது.
- source_word: εἰς τὴν κατάπαυσιν αὐτοῦ
  choice: தமது இளைப்பாறுதலுக்குள்
  rationale: κατάπαυσις எபிரெயர் நூலில் தேவனுடைய இளைப்பாறுதல் என்னும் மையக் கருத்தைக் கொண்டுள்ளது; εἰς குறிக்கும் உள்நுழைவு திசையும் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது. ‘தமது’ என்பது வாக்கியத்தின் கர்த்தராகிய தேவனைக் குறிக்கிறது.
- source_word: εἰ μὴ
  choice: …க்கே அன்றி வேறு
  rationale: எதிர்பார்க்கப்பட்ட ஒரே பதிலை வலியுறுத்தும் கிரேக்க வினா அமைப்பை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: τοῖς ἀπειθήσασιν
  choice: தமக்குக் கீழ்ப்படியாதவர்களுக்கு
  rationale: ἀπειθέω இங்கு கீழ்ப்படியாமையை நேரடியாகக் குறிக்கிறது. அடுத்த வசனத்தில் வரும் அவநம்பிக்கையுடன் உள்ள தொடர்பை மறுக்காமல், இரு சொற்களையும் ஒன்றாகக் கலக்காமல் வைத்திருக்கிறது.
theological_decisions:
- issue: எச்சரிக்கைப் பகுதியில் ἀπειθήσασιν என்பதன் பொருள்
  choice: தமக்குக் கீழ்ப்படியாதவர்கள்
  alternative: நம்பாதவர்கள்; கீழ்ப்படிய மறுத்தவர்கள்
  rationale: உடனடிச் சூழலில் அவநம்பிக்கையும் கீழ்ப்படியாமையும் நெருக்கமாக இணைந்திருந்தாலும், இவ்வசனம் ἀπιστέω அல்ல, ἀπειθέω சார்ந்த சொல்லையே பயன்படுத்துகிறது. ஆகவே சொற்பொருள் வேறுபாடும் இறையியல் இழுபறியும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாக வாசிக்கக்கூடிய, அதேவேளையில் ஆணையின் solemn force-ஐ காக்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. தொடர்ச்சியான சொல்லாட்சியில் ‘தமது’ தேவனைக் குறிக்கிறது; ‘அவர்கள்’ கீழ்ப்படியாதவர்களைக் குறிக்கிறது.
