revisions:
- from: 'இவ்வாறு சொல்லப்படும்போது: “இன்று நீங்கள் அவருடைய குரலைக் கேட்டால், கலகத்தின்போது[a] செய்ததுபோல் உங்கள் இதயங்களைக் கடினப்படுத்தாதீர்கள்.”'
  to: 'இவ்வாறு சொல்லப்படுகையில்: “இன்று நீங்கள் அவருடைய குரலைக் கேட்டால், கலகத்தின்போல்[a] உங்கள் இதயங்களைக் கடினப்படுத்தாதீர்கள்.”'
  rationale: The revision preserves the Greek’s ongoing citation frame and removes the unsupported generic verb from the final comparison. It keeps ‘கலகம்’ as the clear modern rendering of παραπικρασμός while retaining the traditional ‘provocation’ sense in a grammatically parallel footnote.
