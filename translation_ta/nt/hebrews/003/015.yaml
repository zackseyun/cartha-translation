id: HEB.3.15
reference: Hebrews 3:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐν τῷ λέγεσθαι· Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε, Μὴ σκληρύνητε τὰς καρδίας ὑμῶν ὡς ἐν τῷ παραπικρασμῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/015.yaml
  text: while it is being said[a], “Today, if you hear his voice, do not harden your hearts as in the rebellion.”
translation:
  language: ta
  text: 'இவ்வாறு சொல்லப்படுகையில்: “இன்று நீங்கள் அவருடைய குரலைக் கேட்டால், கலகத்தின்போல்[a] உங்கள் இதயங்களைக் கடினப்படுத்தாதீர்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கோபமூட்டுதலின் போது.” இது சங்கீதம் 95 மேற்கோளின் மரபுவழி மொழிபெயர்ப்பை எதிரொலிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ λέγεσθαι
  choice: இவ்வாறு சொல்லப்படும்போது
  rationale: ἐν உடன் வரும் நிகழ்காலச் செயப்பாட்டு infinitive காலச் சூழலைக் குறிக்கிறது. தொடர்ந்து சொல்லப்பட்டு வரும் வேதமேற்கோளின் பொருத்தத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: Σήμερον
  choice: இன்று
  rationale: மேற்கோளின் உடனடி அவசரத்தையும் காலக் குறிப்பையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἐὰν ... ἀκούσητε
  choice: நீங்கள் ... கேட்டால்
  rationale: நிபந்தனை அமைப்பை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது; இங்கு கேட்பது குரலுக்குச் செவிசாய்ப்பதையும் உள்ளடக்கக்கூடும் என்றாலும், மூலத்தின் பொதுவான வினைச்சொல் பாதுகாக்கப்படுகிறது.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: அவருடைய குரலை
  rationale: தனிப்பட்ட இறை அழைப்பைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்தும் உரிமைத் தொடர்பு.
- source_word: Μὴ σκληρύνητε τὰς καρδίας ὑμῶν
  choice: உங்கள் இதயங்களைக் கடினப்படுத்தாதீர்கள்
  rationale: தடையுத்தரவையும் வேதாகமத்தில் ‘இதயம்’ குறிக்கும் உள்ளார்ந்த மனிதனையும் பாதுகாக்கிறது.
- source_word: ὡς ἐν τῷ παραπικρασμῷ
  choice: கலகத்தின்போது செய்ததுபோல்
  rationale: வனாந்தரத்தில் இஸ்ரவேலர் கடவுளுக்கு எதிராகக் கலகம் செய்த நிகழ்வை நவீன வாசகர்களுக்குத் தெளிவாக உணர்த்துகிறது. ‘செய்ததுபோல்’ என்பது தமிழில் ஒப்புமையை இயல்பாக்கும் சூழல்சார் நிறைவு.
theological_decisions:
- issue: சங்கீதம் 95 மேற்கோளில் παραπικρασμός என்பதன் மொழிபெயர்ப்பு
  choice: கலகம்
  alternative: கோபமூட்டுதல்
  rationale: இச்சொல் வனாந்தரத்தில் கடவுளுக்கு எதிராக நடந்த உடன்படிக்கை மீறிய எதிர்ப்பைக் குறிக்கிறது. ‘கலகம்’ அதன் ஒழுக்க மற்றும் உறவு சார்ந்த தீவிரத்தை நவீன தமிழில் தெளிவாகத் தெரிவிக்கிறது; கடவுளைக் ‘கோபமூட்டுதல்’ என்ற சொற்பொருள் சார்ந்த மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. மூலவாக்கியம் முந்தைய கருத்துடன் இணையும் காலவினைத் துணைவாக்கியமாக இருப்பதால், ‘சொல்லப்படும்போது’ என்ற அதன் தொடர்புத் தன்மை தீர்க்கப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
