    text: அல்லது, “விசுவாசமின்மையினால்.” கிரேக்கச் சொல் வெறுமனே நம்பிக்கை இல்லாமையை மட்டுமல்ல, நம்பிச் சார மறுக்கும் விசுவாசமற்ற தன்மையையும் குறிக்கலாம்.
    reason: lexical_alternative
  revision_rationale: The revision replaces a potentially broader Tamil term for distrust with “நம்பாமை,” which directly reflects the contextual sense of ἀπιστία as unbelief/refusal to trust. It also uses “முடியவில்லை” to preserve the explicit inability in οὐκ ἠδυνήθησαν. The alternative “விசுவாசமின்மை” and its covenantal/faithfulness-related nuance remain available in the footnote without resolving the lexical range beyond the Greek.
