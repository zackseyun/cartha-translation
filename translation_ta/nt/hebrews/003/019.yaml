  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ βλέπομεν ὅτι οὐκ ἠδυνήθησαν εἰσελθεῖν δι’ ἀπιστίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/019.yaml
  text: And we see that they were not able to enter because of unbelief[a].
translation:
  language: ta
  text: அவர்கள் நம்பாமையினால்[a] நுழைய முடியவில்லை என்பதை நாம் காண்கிறோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விசுவாசமின்மையினால்.” கிரேக்கச் சொல் வெறுமனே நம்பிக்கை இல்லாமையை மட்டுமல்ல, நம்பிச் சார மறுக்கும் விசுவாசமற்ற தன்மையையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: —
  rationale: இங்கு καὶ முந்தைய வாதத்தின் முடிவைத் தொடரும் இணைப்புச்சொல். தமிழில் தனியாக ‘மேலும்’ என்று மொழிபெயர்ப்பது இயல்பற்றதாகவும், கூடுதல் கருத்து சேர்ப்பதாகவும் இருக்கக்கூடும்; வாக்கியத் தொடர்ச்சியிலேயே அதன் பணி வெளிப்படுகிறது.
- source_word: βλέπομεν
  choice: நாம் காண்கிறோம்
  rationale: முதலாம் நபர் பன்மை நிகழ்கால வினையை நேரடியாகவும் இயல்பாகவும் தக்கவைக்கிறது.
- source_word: ὅτι
  choice: என்பதை
  rationale: காணப்படுகிற கருத்தை அறிமுகப்படுத்தும் ὅτι-உட்பிரிவை இயல்பான தமிழ்ச் சொல்லமைப்பில் வெளிப்படுத்துகிறது.
- source_word: οὐκ ἠδυνήθησαν
  choice: முடியாமல் போனார்கள்
  rationale: அவர்களால் நுழைய இயலவில்லை என்ற திறனின்மையை நவீனத் தமிழில் இயல்பாகத் தெரிவிக்கிறது; கிரேக்க இறந்தகாலக் குறிப்பும் காக்கப்படுகிறது.
- source_word: εἰσελθεῖν
  choice: நுழைய
  rationale: வாக்கியத்தில் பொருள் வெளிப்படையாகச் சொல்லப்படாதபடியே, வாக்குப்பண்ணப்பட்ட இடம் அல்லது இளைப்பாறுதலுக்குள் செல்வதைக் குறிக்கும் பொதுவான வினையாக உள்ளது.
- source_word: δι’
  choice: -இனால்
  rationale: அக்கூசட்டிவுடன் வரும் διά இங்கு காரணத்தைக் குறிக்கிறது; தமிழில் காரண வேற்றுமை உருபு அதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἀπιστίαν
  choice: அவநம்பிக்கை
  rationale: நம்பாமை அல்லது நம்ப மறுக்கும் நிலையை இயல்பான தமிழில் தெரிவிக்கிறது. விசுவாசமின்மை என்ற விசுவாசத் துரோக நிழற்பொருளையும் சொல் கொண்டிருக்கலாம் என்பதால் அடிக்குறிப்பு தரப்படுகிறது.
theological_decisions:
- issue: ἀπιστία என்பதன் நம்பாமை மற்றும் விசுவாசமின்மை சார்ந்த பொருள் நிழல்கள்
  choice: அவநம்பிக்கை
  alternative: விசுவாசமின்மை
  rationale: உடனடிச் சூழல் கடவுளுடைய வாக்கை அவர்கள் நம்பாததையும் அவரை நம்பிச் சார மறுத்ததையும் வலியுறுத்துவதால் ‘அவநம்பிக்கை’ முதன்மை உரையில் தெளிவாக உள்ளது. அதே நேரத்தில், விசுவாசமற்ற மறுப்பு அல்லது உண்மையற்ற நிலை என்ற உடன்படிக்கைச் சார்ந்த நிழற்பொருளை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான நடை. மூலத்தின் முதலாம் நபர் பன்மையும் காரணத் தொடர்பும் காக்கப்பட்டுள்ளன; ‘நுழைய’ என்பதன் இலக்கு மூலத்தைப் போலவே வெளிப்படையாகச் சேர்க்கப்படவில்லை.
