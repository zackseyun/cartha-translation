id: HEB.3.4
reference: Hebrews 3:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πᾶς γὰρ οἶκος κατασκευάζεται ὑπό τινος, ὁ ⸀δὲ πάντα κατασκευάσας θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/004.yaml
  text: For every house is built by someone[a], but God is the one who built all things.
translation:
  language: ta
  text: ஏனெனில் ஒவ்வொரு வீடும் ஒருவரால் கட்டப்படுகிறது; ஆனால் அனைத்தையும் கட்டியவர் கடவுள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς
  choice: ஒவ்வொரு
  rationale: ஒருமை வடிவிலுள்ள οἶκος என்பதுடன் πᾶς பகிர்வுப் பொருளில் வருவதால், ‘ஒவ்வொரு’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: γὰρ
  choice: (வாக்கியத் தொடர்பில் விளக்கக் காரணமாகப் புரிந்துகொள்ளப்படுகிறது)
  rationale: γάρ முந்தைய கூற்றுக்கான விளக்கத்தை அறிமுகப்படுத்துகிறது. தனியாக ‘ஏனெனில்’ என்று சேர்ப்பது இவ்வசனத்தைத் தனித்து வாசிக்கும்போது தமிழில் கனமாக இருப்பதால், அதன் விளக்கத் தொடர்பு வாக்கிய ஓட்டத்தில் வெளிப்படுகிறது.
- source_word: οἶκος
  choice: வீடு
  rationale: உடனடி சூழலில் கட்டிடமாகிய ‘வீடு’ என்ற நேரடியான படிமமும், விரிவான உருவகப் பயன்பாடும் ஒன்றோடொன்று தொடர்புடையவை; ‘குடும்பம்’ என்பது இங்கு உருவகத்தை முன்கூட்டியே விளக்கிவிடும்.
- source_word: κατασκευάζεται
  choice: கட்டப்படுகிறது
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவம் ஒரு வீட்டை யாரோ ஒருவர் கட்டுகிறார் என்ற பொதுவான உண்மையைச் சொல்கிறது; கட்டிடப் படிமத்திற்கு ‘கட்டப்படுகிறது’ இயல்பானது.
- source_word: ὑπό τινος
  choice: யாரோ ஒருவரால்
  rationale: ὑπό உடன் வரும் உருபு செய்பவரைக் குறிக்கிறது; τις குறிப்பிடப்படாத ஒருவரைச் சுட்டுவதால் ‘யாரோ ஒருவரால்’ பொருத்தமானது.
- source_word: ὁ δὲ
  choice: ஆனால் …வர்
  rationale: δέ பொதுக் கூற்றிலிருந்து உச்சமான இறையியல் அடையாளப்படுத்தலுக்குச் செல்லும் மென்மையான மாறுபாட்டைக் காட்டுகிறது; பெயர்ச்சொல்லாக்கப்பட்ட பங்கேற்பு தமிழில் ‘…வர்’ என இயல்பாக வருகிறது.
- source_word: πάντα
  choice: அனைத்தையும்
  rationale: πάντα விரிவான, உள்ளடக்கமான பொருளைக் கொண்டது; ‘அனைத்தையும்’ அதன் பரப்பைச் சுருக்காமல் காக்கிறது.
- source_word: κατασκευάσας
  choice: கட்டியவர்
  rationale: முந்தைய κατασκευάζεται உடனான சொல் ஒற்றுமையையும் வீடு கட்டும் ஒப்புமையையும் ‘கட்டியவர்’ காக்கிறது.
- source_word: θεός
  choice: கடவுள்
  rationale: இங்கு θεός அனைத்தையும் கட்டியவர் யார் என்பதைத் தெளிவாக அடையாளப்படுத்துகிறது; நவீன பொதுத் தமிழில் ‘கடவுள்’ நேரடியான வடிவம்.
theological_decisions:
- issue: இறுதிக் கூறில் அனைத்தையும் கட்டியவர் கடவுள் என்ற அடையாளப்படுத்தலை எவ்வாறு காப்பது
  choice: அனைத்தையும் கட்டியவர் கடவுள்
  alternative: கடவுளே அனைத்தையும் கட்டியவர்
  rationale: கிரேக்கச் சொல் வரிசையையும் அதன் உச்சக் கூற்றையும் முதல் வடிவம் நெருக்கமாகக் காக்கிறது; அதேவேளையில், கடவுளே அனைத்திற்கும் கட்டியவர் என்ற வெளிப்படையான கூற்றை எந்த மேலதிக மெய்யியல் விளக்கமும் இன்றி தெரிவிக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் சுருக்கமான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வீடு—கட்டுதல்’ என்ற படிமமும், முதல் கூறிலிருந்து கடவுளைப் பற்றிய இரண்டாம் கூறுக்குச் செல்லும் வாத ஓட்டமும் காக்கப்பட்டுள்ளன.
