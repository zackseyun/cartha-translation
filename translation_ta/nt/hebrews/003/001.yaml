    text: இங்கே ‘சகோதரர்கள்’ என்பது பெண்களும் உட்பட்ட முழு விசுவாசச் சமூகத்தையும் நோக்கிய அழைப்பு.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘பரலோகத்திலிருந்து வரும் அழைப்பில் பங்குள்ளவர்களே.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘நாம் அறிக்கையிடுகிறவரான இயேசுவை—அப்போஸ்தலரும் தலைமை ஆசாரியருமான அவரைக்—கூர்ந்து சிந்தியுங்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅθεν
  choice: ஆகவே
  rationale: முந்தைய வாதத்திலிருந்து, குறிப்பாக 2:17–18 இலிருந்து, முடிவை வருவிக்கும் இணைப்புச் சொல்லின் தர்க்க வலிமையை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: ἀδελφοὶ ἅγιοι
  choice: பரிசுத்த சகோதரர்களே
  rationale: அழைப்புமுறையையும் கிரேக்கத்தின் ஆண்பால் பன்மை வடிவத்தையும் காக்கிறது. இது பெண்களும் உட்பட்ட முழு விசுவாசச் சமூகத்தைக் குறிக்கக்கூடும் என்பது அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: κλήσεως ἐπουρανίου μέτοχοι
  choice: பரலோக அழைப்பில் பங்குபெற்றவர்களே
  rationale: μέτοχοι என்பதன் பங்கேற்புப் பொருளையும் κλήσεως ἐπουρανίου என்பதன் தெய்வீக அழைப்புக் கருத்தையும் இயல்பான தமிழில் தருகிறது; ‘பரலோக’ என்பது அழைப்பின் மூலத்தையோ தன்மையையோ குறிக்கலாம்.
- source_word: κατανοήσατε
  choice: கூர்ந்து சிந்தியுங்கள்
  rationale: கவனம் செலுத்தி ஆராய்ந்து எண்ணும்படி கோரும் கட்டளையின் வலிமையை, வெறும் ‘நினையுங்கள்’ என்பதைக் காட்டிலும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἀπόστολον
  choice: அப்போஸ்தலர்
  rationale: இயேசுவுக்கு நேரடியாக வழங்கப்படும் தனித்துவமான பட்டத்தைத் தக்கவைக்கிறது; ‘அனுப்பப்பட்டவர்’ என்ற விளக்கப் பொருளை மொழிபெயர்ப்புக்குள் மாற்றிப் பதிக்கவில்லை.
- source_word: ἀρχιερέα
  choice: தலைமைக் குரு
  rationale: யூத வழிபாட்டு அமைப்பின் உயர்குரு பணியையும் எபிரெயர் நூலின் முக்கிய கருப்பொருளையும் நவீன வாசகர்களுக்குப் புரியும் தமிழில் குறிக்கிறது.
- source_word: τῆς ὁμολογίας ἡμῶν
  choice: நமது அறிக்கையின்
  rationale: ὁμολογία என்பதன் பொதுவான, வாய்மொழியான அறிக்கையிடுதலைக் காக்கிறது; அதை ‘விசுவாசம்’ என்று மட்டும் குறுக்கவில்லை. இத்தொடர் இரு பட்டங்களுடனும் தொடர்புடையதாக வாசிக்கப்படுகிறது.
- source_word: Ἰησοῦν
  choice: இயேசு
  rationale: பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
theological_decisions:
- issue: ἀδελφοὶ என்ற பாலினக் குறியுள்ள அழைப்பு
  choice: முதன்மை உரையில் ‘சகோதரர்களே’ என்று வைத்து, அதன் உள்ளடக்கும் சமூகப் பொருளை அடிக்குறிப்பில் குறிப்பிடுதல்.
  alternative: ‘சகோதர சகோதரிகளே’ அல்லது ‘உடன்பிறந்தவர்களே’
  rationale: கிரேக்கத்தின் ஆண்பால் பன்மை வடிவத்தை மறைக்காமல் காக்கிறது; அதேவேளையில் இவ்வழைப்பு பெண்கள் உட்பட்ட முழு விசுவாசச் சமூகத்தையும் நோக்கியது என்பதைத் தெளிவுபடுத்துகிறது.
- issue: இயேசுவுக்குப் பயன்படுத்தப்பட்ட ἀπόστολον என்பதன் வலிமை
  choice: ‘அப்போஸ்தலர்’ என்ற பட்டத்தைத் தக்கவைத்தல்.
  alternative: ‘அனுப்பப்பட்டவர்’ அல்லது ‘தூதர்’
  rationale: வசனம் இயேசுவுக்கே இப்பட்டத்தை வழங்குவதால் அதன் இலக்கிய மற்றும் இறையியல் வலிமை பாதுகாக்கப்படுகிறது; பின்னாளைய திருச்சபைப் பதவி வேறுபாடுகள் உரைக்குள் இறக்குமதி செய்யப்படவில்லை.
- issue: τῆς ὁμολογίας ἡμῶν என்பதன் தொடர்பு
  choice: ‘நமது அறிக்கையின் அப்போஸ்தலரும் தலைமைக் குருவுமான இயேசு’ என்று இரு பட்டங்களுடனும் தொடர்புபடுத்துதல்.
  alternative: ‘நாம் அறிக்கையிடுகிறவரான இயேசு—அப்போஸ்தலரும் தலைமைக் குருவுமானவர்’
  rationale: இலக்கண ரீதியாக இயல்பான பெயரெச்சத் தொடர்பை முதன்மை உரையில் காக்கிறது; இயேசுவையே அறிக்கையின் பொருளாகப் புரியும் மாற்று வாசிப்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வேதாகம உரைக்கேற்ற கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘அப்போஸ்தலர்’ என்ற நிலைபெற்ற இறையியல் சொல் பாதுகாக்கப்பட்டாலும், தேவையற்ற பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன. அழைப்புமுறை இயல்பாகத் தோன்ற ‘பங்குபெற்றவர்களே’ பயன்படுத்தப்பட்டுள்ளது.
