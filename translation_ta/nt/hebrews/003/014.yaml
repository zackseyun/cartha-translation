- from: ஏனெனில், நமது தொடக்ககால உறுதிநம்பிக்கையை முடிவுவரை உறுதியாகப் பற்றிக்கொண்டிருந்தால், நாம் மெசியாவில் பங்குபெற்றவர்களாக ஆகியிருக்கிறோம்.[a][b]
  to: ஏனெனில், நாம் மெசியாவில் பங்குபெற்றவர்களாகியிருக்கிறோம்[a]; உண்மையாகவே, நாம் தொடக்கத்தில் கொண்டிருந்த உறுதிநம்பிக்கையை[b] முடிவுவரை உறுதியாகப் பற்றிக்கொண்டால்.
  rationale: திருத்தம் திறந்த நிபந்தனையைத் துல்லியமாகக் காக்கிறது; தேவையற்ற இரட்டிப்பை நீக்கி நவீனத் தரத் தமிழில் இயல்பான ஓட்டத்தை அளிக்கிறது; மேலும் அடிக்குறிப்புகளை அவை விளக்கும் சொற்களோடு இணைக்கிறது. நிபந்தனையிலுள்ள நிலைத்திருத்தத்தின் இறையியல் விளக்கத்தை வசனம் தீர்மானிப்பதில்லை என்பதால், எந்தக் கோட்பாட்டுச் முடிவும் சேர்க்கப்படவில்லை.
