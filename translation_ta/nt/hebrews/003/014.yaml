  text: μέτοχοι γὰρ ⸂τοῦ Χριστοῦ γεγόναμεν⸃, ἐάνπερ τὴν ἀρχὴν τῆς ὑποστάσεως μέχρι τέλους βεβαίαν κατάσχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/014.yaml
  text: For we have become sharers in the Messiah, if indeed we hold the beginning of our assurance firm to the end.
translation:
  language: ta
  text: ஏனெனில், நாம் மெசியாவில் பங்குபெற்றவர்களாகியிருக்கிறோம்[a]; உண்மையாகவே, நாம் தொடக்கத்தில் கொண்டிருந்த உறுதிநம்பிக்கையை[b] முடிவுவரை உறுதியாகப் பற்றிக்கொண்டால்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மெசியாவில் பங்காளிகளாக” அல்லது “மெசியாவில் பங்குடையவர்களாக” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “நம்பிக்கை” அல்லது “உறுதி” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் சில சூழல்களில் “சாரம்” அல்லது “மெய்நிலை” என்றும் பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέτοχοι
  choice: பங்குபெற்றவர்கள்
  rationale: கிறிஸ்துவில் பங்கு அல்லது தொடர்புடையவர்களாக இருப்பதைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான காரணத்தை அல்லது விளக்கத்தை அறிமுகப்படுத்தும் இணைப்பை வெளிப்படுத்துகிறது.
- source_word: τοῦ Χριστοῦ
  choice: மெசியாவில்
  rationale: Χριστός இங்கு பட்டப்பெயராகச் செயல்படுகிறது. μέτοχοι உடனான மரபுத்தொடரில் வரும் பிறப்புவேற்றுமையைத் தமிழில் இயல்பாக ‘மெசியாவில் பங்குபெற்றவர்கள்’ என்று தருகிறது.
- source_word: γεγόναμεν
  choice: ஆகியிருக்கிறோம்
  rationale: கடந்த காலத்தில் ஏற்பட்டதன் தற்போதைய விளைவுநிலையை நிறைவேற்றுக்கால வடிவுக்கு ஏற்ப காக்கிறது.
- source_word: ἐάνπερ
  choice: …இருந்தால்
  rationale: உண்மையான நிபந்தனையைத் தெளிவாக வைக்கிறது; கிரேக்கச் சொல்லின் வலியுறுத்தல் வாக்கியத்தின் நிபந்தனை அமைப்பில் வெளிப்படுகிறது.
- source_word: τὴν ἀρχὴν τῆς ὑποστάσεως
  choice: நமது தொடக்ககால உறுதிநம்பிக்கையை
  rationale: ἀρχή என்பதை ஆரம்பகட்டம் எனவும், இச்சூழலில் ὑπόστασις என்பதை உறுதியான நம்பிக்கை எனவும் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: μέχρι τέλους
  choice: முடிவுவரை
  rationale: முழுக் காலப்போக்கிலும் தொடர்ந்திருப்பதைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: βεβαίαν κατάσχωμεν
  choice: உறுதியாகப் பற்றிக்கொண்டிருந்தால்
  rationale: நிலையாகத் தக்கவைத்திருத்தல் என்ற பொருளை நிபந்தனைத் தொடருக்கேற்ற இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: நிபந்தனைத் தொடரும் நிலைத்திருத்தலும்
  choice: ‘முடிவுவரை … பற்றிக்கொண்டிருந்தால்’ என்ற உண்மையான நிபந்தனையாக மொழிபெயர்க்கப்பட்டது.
  alternative: நிலைத்திருத்தல் ஏற்கெனவே பெற்ற பங்கின் சான்று என்றோ, அந்தப் பங்கைத் தொடர்ந்து காக்கும் காரணம் என்றோ வெளிப்படையாக விளக்குதல்.
  rationale: கிரேக்க வசனம் நிபந்தனையைக் கூறுகிறது; ஆனால் நிலைத்திருத்தல் மற்றும் விசுவாசவிலகல் குறித்த பிற்கால கோட்பாட்டு விவாதங்களைத் தானாகத் தீர்ப்பதில்லை. ஆகவே அந்த இறையியல் இழுவிசை காக்கப்படுகிறது.
- issue: ὑπόστασις என்பதன் பொருள்
  choice: உறுதிநம்பிக்கை
  alternative: தன்னம்பிக்கை; உறுதி; சாரம்; மெய்நிலை
  rationale: இச்சூழலில் தொடக்கத்தில் கொண்டிருந்த உறுதியான நம்பிக்கையைக் குறிப்பதே மிகப் பொருத்தம்; சொல்லின் பரந்த பொருள் வாய்ப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘மெசியா’ பட்டப்பெயராக வைக்கப்பட்டுள்ளது. நிபந்தனைத் தொடரின் இறையியல் தெளிவின்மை தீர்க்கப்படாமல் காக்கப்பட்டுள்ளது; ‘தொடக்ககால உறுதிநம்பிக்கை’ என்பது இயல்பான தமிழ் ஓட்டத்திற்காகத் தேர்ந்தெடுக்கப்பட்டது.
