id: HEB.3.8
reference: Hebrews 3:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μὴ σκληρύνητε τὰς καρδίας ὑμῶν ὡς ἐν τῷ παραπικρασμῷ, κατὰ τὴν ἡμέραν τοῦ πειρασμοῦ ἐν τῇ ἐρήμῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/008.yaml
  text: do not harden your hearts as in the rebellion[a], as on the day of testing in the wilderness,
translation:
  language: ta
  text: கலகத்தின் போதும், வனாந்தரத்தில் சோதனை நடந்த நாளிலும் இருந்ததுபோல உங்கள் இதயங்களைக் கடினப்படுத்தாதீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, சங்கீதம் 95:8-க்குப் பின்னணியான எபிரெய இடப்பெயர்களைப் பின்பற்றி: “மெரிபாவில் இருந்ததுபோலவும், வனாந்தரத்தில் மாசா நாளில் இருந்ததுபோலவும்.”'
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ σκληρύνητε
  choice: கடினப்படுத்தாதீர்கள்
  rationale: μή உடன் வரும் இறந்தகாலச் செயப்படுபொருள் குன்றா வினையின் துணைவினை வடிவம் நேரடியான தடையாக அமைகிறது; செயல்வினை, கேட்போரின் பொறுப்புள்ள செயலையே காட்டுகிறது.
- source_word: τὰς καρδίας ὑμῶν
  choice: உங்கள் இதயங்களை
  rationale: சமூகத்திற்கான இரண்டாம் நபர் பன்மை நேரடி அழைப்பைப் பேணுகிறது; ‘இதயம்’ உணர்ச்சியை மட்டும் அல்லாமல் சிந்தனை, விருப்பம், மனப்பாங்கு ஆகியவற்றை உள்ளடக்கும் வேதாகமச் சொல்லாகும்.
- source_word: ὡς ἐν τῷ παραπικρασμῷ
  choice: கலகம் செய்தபோது இருந்ததுபோலவும்
  rationale: παραπικρασμός என்பது கடவுளுக்கு எதிரான தூண்டுதல் அல்லது கலகத்தைக் குறிக்கிறது. தமிழில் இயல்பாக நிகழ்வையும் அதன் ஒழுக்க வலிமையையும் தெரிவிக்க வினைமயமாக மொழிபெயர்க்கப்பட்டது.
- source_word: κατὰ τὴν ἡμέραν τοῦ πειρασμοῦ
  choice: சோதித்த நாளில் இருந்ததுபோலவும்
  rationale: κατά ஒப்புமைத் தொடரை முன்னைய ὡς உடன் இணைக்கிறது. πειρασμός இங்கு அகத் தூண்டுதலைவிட வனாந்தர வரலாற்றில் கடவுளைச் சோதித்த நிகழ்வைக் குறிக்கிறது; எனவே ‘சோதித்த நாள்’ என வழங்கப்பட்டுள்ளது.
- source_word: ἐν τῇ ἐρήμῳ
  choice: வனாந்தரத்தில்
  rationale: இஸ்ரவேலின் அலைந்து திரிந்த காலத்தைச் சுட்டும் வேதாகம வரலாற்று ஒலியை ‘வனாந்தரம்’ தெளிவாகப் பேணுகிறது.
theological_decisions:
- issue: சங்கீதம் 95-இன் வரலாற்றுக் குறிப்பை வழங்குதல்
  choice: கிரேக்கத்தில் உள்ள நிகழ்வுப் பெயர்களை விளக்கமாக ‘கலகம் செய்தபோது’ என்றும் ‘சோதித்த நாள்’ என்றும் முதன்மைப் பாடத்தில் மொழிபெயர்த்தல்
  alternative: ‘வனாந்தரத்தில் மெரிபாவில் நடந்ததுபோலவும், மாசா நாளில் நடந்ததுபோலவும்’
  rationale: எபிரெயர் கடிதம் மேற்கோள் காட்டும் கிரேக்க எழுத்தில் எபிரெய இடப்பெயர்கள் விளக்கப் பெயர்களாக வழங்கப்பட்டுள்ளன. ஆகவே முதன்மைப் பாடம் கிரேக்கச் சான்றைப் பின்பற்றுகிறது; எபிரெயப் பின்னணி அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் நேரடியான பன்மைத் தடை வடிவம் பயன்படுத்தப்பட்டுள்ளது. வேதாகம வரலாற்றுச் சூழலைப் பேண ‘வனாந்தரம்’ தேர்ந்தெடுக்கப்பட்டது. கிரேக்கத்தின் இணையான ஒப்புமை அமைப்பு இருமுறை ‘இருந்ததுபோலவும்’ என்பதால் வெளிப்படுத்தப்பட்டுள்ளது; அடிக்குறிப்பு குறி முதன்மைப் பாடத்தில் சேர்க்கப்பட்டுள்ளது.
