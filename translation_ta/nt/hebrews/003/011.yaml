  register: நவீனத் தரமான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘இளைப்பாறுதல்’ என்ற முக்கியக் கருத்து எபிரெயர் நிருபத்தின் தொடர்ச்சிக்காக நிலைநிறுத்தப்பட்டது; மூலத்தின் ஆணைமொழி அடிக்குறிப்பில் விளக்கப்பட்டது.
