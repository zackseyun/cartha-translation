  text: as I swore in my wrath[a], ‘They shall never enter my rest.’
translation:
  language: ta
  text: 'நான் என் கோபத்தில் சத்தியம் செய்தபடியே:


    “அவர்கள் என் இளைப்பாறுதலில் நுழையவே மாட்டார்கள்.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் சொற்சொல்லாக, “அவர்கள் என் இளைப்பாறுதலில் நுழைவார்களாயின்” என்று உள்ளது. இது ஒரு உறுதிமொழி வடிவம்; இதன் பொருள், “அவர்கள் என் இளைப்பாறுதலில் நிச்சயமாக நுழையவே மாட்டார்கள்” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: எனவே … ஆணையிட்டதுபோல
  rationale: ὡς முந்தைய மேற்கோளின் தொடர்ச்சியில் விளைவைக் காட்டும் மேற்கோள் அமைப்பின் ஒரு பகுதியாக வருகிறது. தமிழில் இயல்பாகவும் சூழலுடன் இணைந்தும் இருக்க ‘எனவே … ஆணையிட்டதுபோல’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ὤμοσα
  choice: நான் ஆணையிட்டேன்
  rationale: ὀμνύω என்பதன் இறந்தகால வடிவம் உறுதியான ஆணையைக் குறிக்கிறது. ‘ஆணையிட்டேன்’ என்பது நவீனத் தமிழில் நேரடியான, கண்ணியமான தெரிவு.
- source_word: ἐν τῇ ὀργῇ μου
  choice: என் கோபத்தில்
  rationale: ὀργή கடுமையான கோபத்தையும் நீதித்தீர்ப்பின் தீவிரத்தையும் குறிக்கலாம். ‘என் கோபத்தில்’ என்பது இயல்பான தமிழில் அந்த வலிமையைத் தக்கவைக்கிறது.
- source_word: Εἰ εἰσελεύσονται
  choice: அவர்கள் ஒருபோதும் … நுழையமாட்டார்கள்
  rationale: εἰ + எதிர்கால வினை என்பது இங்கு செமித்திய ஆணைமொழி; சொற்சொல்லாக ‘அவர்கள் நுழைந்தால்’ என்றிருந்தாலும், அதன் பொருள் உறுதியான மறுப்பு. ஆகவே தமிழில் அதன் செயல்பாட்டு வலிமை வெளிப்படையாகத் தரப்படுகிறது.
- source_word: εἰς τὴν κατάπαυσίν μου
  choice: என் இளைப்பாறுதலுக்குள்
  rationale: κατάπαυσις என்பது எபிரெயர் நிருபத்தில் வளர்க்கப்படும் ‘இளைப்பாறுதல்’ என்ற கருத்தைக் குறிக்கிறது. ‘இளைப்பாறுதலுக்குள்’ என்பது εἰς என்பதன் நுழைவு உணர்வையும் இறையியல் கருத்தின் திறந்த பரப்பையும் காக்கிறது.
theological_decisions:
- issue: Εἰ εἰσελεύσονται என்ற ஆணைமொழியின் மொழிபெயர்ப்பு
  choice: ‘அவர்கள் ஒருபோதும் … நுழையமாட்டார்கள்’ என்ற வெளிப்படையான மறுப்பு
  alternative: ‘அவர்கள் … நுழைந்தால்’ என்ற சொற்சொல்லான நிபந்தனை வடிவம்
  rationale: மூலத்தின் நிபந்தனை போன்ற வடிவம் உண்மையில் நிறைவேறாத நிபந்தனையை முன்வைக்கும் ஆணைமொழியாக இருந்து உறுதியான மறுப்பைத் தெரிவிக்கிறது. தமிழில் சொற்சொல்லாக வைத்தால் சாதாரண நிபந்தனையாகத் தவறாகப் புரியலாம்; வெளிப்படையான மறுப்பு அதன் உண்மையான வலிமையைப் பாதுகாக்கிறது.
- issue: κατάπαυσις என்பதன் பொருள்
  choice: இளைப்பாறுதல்
  alternative: இளைப்பாறும் இடம்
  rationale: எபிரெயர் நிருபத்தில் இந்தச் சொல் வாக்குத்தத்த நாடு, தேவனுடைய சொந்த இளைப்பாறுதல், எதிர்கால நிறைவு ஆகியவற்றுடன் தொடர்புடைய விரிவான கருத்தாக வளர்கிறது. ‘இளைப்பாறுதல்’ அந்த இறையியல் பதற்றத்தை முன்கூட்டியே குறுக்காமல் காக்கிறது.
