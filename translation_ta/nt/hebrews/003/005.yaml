    rationale: This limits οἶκος to individual family members, whereas ‘household’ can denote the entire household/sphere and the context intentionally sustains the ‘house’ metaphor. The alternative should retain ‘குடும்பம்/வீட்டார்’ without specifying only persons.
  - severity: low
    issue: The wording ‘அவருடைய வீடு முழுவதிலும்’ is somewhat less idiomatic than ‘அவருடைய முழு வீட்டிலும்.’
    rationale: The revision reads more naturally in Tamil and conveys the same scope without resolving the metaphor.
