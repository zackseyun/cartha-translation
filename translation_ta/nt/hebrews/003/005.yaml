  yaml_path: translation/nt/hebrews/003/005.yaml
  text: And Moses indeed was faithful in all his house as a servant[a], for a testimony of the things that would be spoken later[b],
translation:
  language: ta
  text: மோசேயோ, அவருடைய முழு வீட்டிலும், பின்னர் சொல்லப்படவிருந்தவற்றுக்குச் சாட்சியாக, பணிவிடை செய்பவராக உண்மையுள்ளவராய் இருந்தார்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய முழு குடும்பத்தில்.” கிரேக்க மூலம், அடுத்த வசனங்களிலும் தொடரும் “வீடு” என்ற உருவகத்தை இங்கே வைத்திருக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “பின்னர் சொல்லப்படவிருந்தவை” என்பது அக்காலத்திற்குப் பிறகு உரைக்கப்படவிருந்தவற்றைச் சுட்டுகிறது; அவற்றைப் பேசுபவர் யார் என்பதை இவ்வசனத்தின் சொற்றொடர் வெளிப்படையாகக் கூறவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ ... μὲν
  choice: மோசேயோ
  rationale: καὶ தொடர்ச்சியையும், μὲν அடுத்த வசனத்தின் δέ-யுடன் உருவாக்கும் எதிரிணையையும் தமிழின் இயல்பான ‘-ஓ’ அமைப்பு வெளிப்படுத்துகிறது.
- source_word: πιστὸς
  choice: உண்மையுள்ளவராய்
  rationale: கடவுளுடைய வீட்டில் மோசே நம்பிக்கைக்குரிய விதத்தில் கடமையாற்றியதை இயல்பாகவும் மரியாதையுடனும் தெரிவிக்கிறது.
- source_word: ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ
  choice: அவருடைய வீடு முழுவதிலும்
  rationale: எண்ணாகமம் 12:7-இன் பின்னணியையும் எபிரெயர் 3-இல் தொடரும் ‘வீடு’ உருவகத்தையும் காக்கிறது. αὐτοῦ என்பதன் சுட்டுப்பொருளை விளக்கிச் சேர்க்காமல் ‘அவருடைய’ என்று விடுகிறது.
- source_word: ὡς θεράπων
  choice: பணிவிடை செய்பவராக
  rationale: θεράπων குறிக்கும் மரியாதைக்குரிய சேவைப் பங்கை வெளிப்படுத்துகிறது; δοῦλος என்பதற்குரிய அடிமை நுணுக்கத்தை இறக்குமதி செய்யவில்லை.
- source_word: εἰς μαρτύριον
  choice: சாட்சியாக
  rationale: மோசேயின் உண்மையான பணிவிடை சாட்சியாகச் செயல்பட்டதைக் காட்டும் நோக்கம் அல்லது விளைவு இரண்டையும் இயல்பாக உள்ளடக்குகிறது.
- source_word: τῶν λαληθησομένων
  choice: பின்னர் சொல்லப்படவிருந்தவற்றுக்கு
  rationale: எதிர்காலச் செயல்பாட்டைக் குறிக்கும் இறந்தகாலச் சூழலிலான எதிர்கால வினையெச்சத்தின் பொருளைத் தெளிவாகக் காக்கிறது; பேசுபவர் யார் அல்லது அதன் முழு உள்ளடக்கம் என்ன என்பதை உரையில் சேர்க்கவில்லை.
theological_decisions:
- issue: ‘அவருடைய வீடு’ என்பது யாரையும் எதையும் குறிக்கிறது
  choice: ‘வீடு’ என்ற வேதாகம உருவகமும் ‘அவருடைய’ என்ற சுட்டுப்பெயரின் வடிவமும் தக்கவைக்கப்பட்டன.
  alternative: ‘கடவுளுடைய குடும்பம்’ என்று வெளிப்படையாக விளக்குதல்.
  rationale: உடனடிச் சூழல் இதைக் கடவுளுடைய மக்களோடு தொடர்புபடுத்தினாலும், மூலவசனத்தின் உருவகத்தையும் இலக்கண வடிவத்தையும் மொழிபெயர்ப்பே தீர்த்துவிடாமல் காக்க வேண்டும்.
- issue: θεράπων என்பதன் சேவை நிலை
  choice: ‘பணிவிடை செய்பவர்’
  alternative: ‘பணியாளர்’ அல்லது ‘ஊழியர்’
  rationale: இச்சொல்லின் மரியாதைக்குரிய சேவை நுணுக்கத்தையும் அடுத்த வசனத்தில் மகனோடு செய்யப்படும் வேறுபாட்டையும் காக்கிறது; ‘அடிமை’ என்ற வலுவான பொருளைத் தவிர்க்கிறது.
- issue: τῶν λαληθησομένων குறிக்கும் பிற்காலப் பேச்சு
  choice: பேசப்படவிருந்தவற்றை பொதுவாகவே விட்டுள்ளது.
  alternative: மகன் வழியாகக் கடவுள் பின்னர் வெளிப்படுத்தியவை என்று விளக்குதல்.
  rationale: சூழல் பிற்காலத் தெய்வீக வெளிப்பாட்டை நோக்கினாலும், இந்தச் சொற்றொடர் பேசுபவரையோ உள்ளடக்கத்தையோ வெளிப்படையாகப் பெயரிடவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதாகப் புரியுமாறும், வேதாகம உரைக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘மோசேயோ’ என்பது அடுத்த வசனத்தில் வரும் மகனைச் சார்ந்த எதிரிணையை இயல்பாக முன்னறிவிக்கிறது; ‘வீடு’ உருவகம் திட்டமிட்டு தக்கவைக்கப்பட்டுள்ளது.
