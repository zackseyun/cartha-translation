reference: Hebrews 3:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Χριστὸς δὲ ὡς υἱὸς ἐπὶ τὸν οἶκον αὐτοῦ· ⸀ὃς οἶκός ἐσμεν ἡμεῖς, ⸀ἐὰν τὴν παρρησίαν καὶ τὸ καύχημα τῆς ⸀ἐλπίδος κατάσχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/006.yaml
  text: But the Messiah was faithful as a Son over his house[a], whose house we are[c][b], if we hold fast our boldness and the boast of our hope.
translation:
  language: ta
  text: ஆனால் மேசியாவோ[a] அவருடைய வீட்டின்மேல் அதிகாரம் கொண்ட மகனாக உண்மையுள்ளவராயிருந்தார். அவருடைய வீடு நாமே—நமது துணிவையும்[b] நம்பிக்கையைக் குறித்த பெருமிதத்தையும்[c] உறுதியாகப் பற்றிக்கொண்டிருந்தால்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிறிஸ்துவோ.” Χριστός என்ற கிரேக்கச் சொல் “மேசியா” என்ற பட்டமாகவும் “கிறிஸ்து” என்ற பெயர்போன்ற குறிப்பாகவும் செயல்படலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “உறுதியான நம்பிக்கையையும்.” παρρησία என்பது வெளிப்படைத்தன்மை, அச்சமின்மை அல்லது உறுதியான துணிவு ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “நம்பிக்கையினால் வரும் பெருமிதத்தையும்” அல்லது “நம்பிக்கையில் களிகூருதலையும்.” καύχημα என்பது பெருமை, பெருமைப்படுவதற்கான காரணம் அல்லது களிகூரும் உறுதி ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: மேசியா
  rationale: மோசேயுடன் செய்யப்படும் ஒப்பீட்டில் இது அபிஷேகம் பெற்றவர் என்ற பட்டப்பொருளைத் தாங்குகிறது; மாற்றாகப் பெயர்போல் ‘கிறிஸ்து’ என்றும் புரிந்துகொள்ளலாம்.
- source_word: δὲ
  choice: ஆனால் ... -வோ
  rationale: முந்தைய வசனத்தில் மோசேயைப் பற்றிச் சொல்லப்பட்டதற்கு மாறான ஒப்பீட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὡς υἱὸς
  choice: மகனாக
  rationale: ὡς என்பதன் ஒப்பீட்டுத் தன்மையையும் υἱός என்பதையும் தேவையற்ற விளக்கமின்றி நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἐπὶ τὸν οἶκον αὐτοῦ
  choice: அவருடைய வீட்டின்மேல்
  rationale: ἐπί இங்கு மேற்பார்வை அல்லது அதிகாரத்தைக் குறிக்கிறது; ‘வீடு’ என்ற சொல் தேவமக்களைக் குறிக்கும் உருவகத்தைப் பாதுகாக்கிறது. ‘அவருடைய’ என்பதன் தொடர்பு யாரைச் சுட்டுகிறது என்பதை மொழிபெயர்ப்பு தீர்மானிக்காமல் விடுகிறது.
- source_word: ὃς οἶκός ἐσμεν ἡμεῖς
  choice: அந்த வீடு நாமே
  rationale: மூலத்தின் வீட்டு உருவகத்தைத் தெளிவான, இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: ἐὰν
  choice: '... இருந்தால்'
  rationale: இது உண்மையான நிபந்தனையைத் தெரிவிக்கிறது; நிலைத்திருத்தல் அல்லது விசுவாசத்திலிருந்து விலகுதல் குறித்த எந்தக் கோட்பாட்டு முடிவையும் மொழிபெயர்ப்பில் சேர்க்கவில்லை.
- source_word: παρρησίαν
  choice: துணிவு
  rationale: வெளிப்படையாகவும் அச்சமின்றியும் நிற்கும் தைரியமான நம்பிக்கையைச் சுருக்கமாகக் குறிக்கிறது.
- source_word: καύχημα
  choice: பெருமிதம்
  rationale: ஒருவர் பெருமைப்படுவது அல்லது மகிழ்ந்து மேன்மையாகக் கருதுவது என்ற சொல்லின் வலிமையைப் பாதுகாக்கிறது; வெறும் ‘நம்பிக்கை’ என்று மென்மைப்படுத்தவில்லை.
- source_word: τῆς ἐλπίδος
  choice: நம்பிக்கையைக் குறித்த
  rationale: ἐλπίς இங்கு எதிர்பார்ப்புடன் கூடிய நம்பிக்கையைக் குறிக்கிறது; பிறப்புவேற்றுமையின் துல்லிய உறவை ஒரே விளக்கமாக முடிவுசெய்யாமல் ‘குறித்த’ என வழங்குகிறது.
- source_word: κατάσχωμεν
  choice: உறுதியாகப் பற்றிக்கொண்டிருந்தால்
  rationale: விடாமல் தொடர்ந்து தக்கவைத்துக்கொள்வது என்ற பொருளையும் நிபந்தனையின் வலிமையையும் இயல்பான தமிழில் எடுத்துரைக்கிறது.
theological_decisions:
- issue: Χριστός என்பதைப் பட்டமாகவா பெயர்போன்ற வடிவமாகவா மொழிபெயர்ப்பது
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: மோசேயுக்கும் தேவனுடைய மகனுக்கும் இடையிலான இரட்சிப்பு-வரலாற்று ஒப்பீட்டில் பட்டப்பொருள் முன்நிற்கிறது; மாற்று சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἐὰν ... κατάσχωμεν என்ற நிபந்தனையின் வலிமை
  choice: நாம் உறுதியாகப் பற்றிக்கொண்டிருந்தால்
  alternative: நாம் உறுதியாகப் பற்றிக்கொள்ளும் பட்சத்தில்
  rationale: மூலம் நிலைத்திருப்பதை உண்மையான நிபந்தனையாக முன்வைக்கிறது. அது இரட்சிப்பின் இழப்பு, நிலைத்திருத்தல் அல்லது விசுவாச உறுதி குறித்து எந்தச் சமயப்பிரிவின் விளக்கத்தையும் தானாகத் தீர்மானிப்பதில்லை.
- issue: αὐτοῦ (‘அவருடைய’) யாரைக் குறிக்கிறது
  choice: அவருடைய என்ற சுட்டுப்பெயரைத் தெளிவுபடுத்தாமல் வைத்தல்
  alternative: தேவனுடைய வீடு / மகனுடைய வீடு
  rationale: உடனடி தொடரமைப்பு ஒன்றுக்கு மேற்பட்ட தொடர்பை அனுமதிக்கிறது; ‘அவருடைய’ என்று வைப்பது மூலத்தின் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
- issue: வசனத்தில் வெளிப்படையாக இல்லாத ‘உண்மையுள்ளவர்’ என்ற கருத்தை வழங்குதல்
  choice: உண்மையுள்ளவர்
  alternative: மகனாக வீட்டின்மேல் இருக்கிறார்
  rationale: வசனம் 5-இல் உள்ள ‘உண்மையுள்ளவன்’ என்ற இணை ஒப்பீடு வசனம் 6-இல் இலக்கண ரீதியாகத் தொடர்கிறது. தமிழில் முழுமையான வாக்கியமாக்க இதை வெளிப்படுத்துவது சூழலால் ஆதரிக்கப்படும் மறைசொல்லை நிரப்புவதாகும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. ‘வீடு’ என்ற மைய உருவகமும் ‘மகன்’ என்ற குடும்ப உறவுச் சொல்லும் மாற்றப்படவில்லை. ‘அவருடைய’ என்ற சுட்டுப்பெயரின் தொடர்பும் நிபந்தனை வாக்கியத்தின் இறையியல் பதற்றமும் விளக்கி முடிக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
