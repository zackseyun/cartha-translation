  text: οὗ ⸀ἐπείρασαν οἱ πατέρες ὑμῶν ⸂ἐν δοκιμασίᾳ⸃ καὶ εἶδον τὰ ἔργα μου
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/009.yaml
  text: where your fathers tested me by trial and saw my works[b][a],
translation:
  language: ta
  text: அங்கே உங்கள் முன்னோர்கள் சோதனையின் மூலம் என்னைச் சோதித்தார்கள்[a]; என் செயல்களையும் கண்டார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சோதனையில் என்னைச் சோதித்தார்கள்,” “சோதித்துப் பார்த்தார்கள்,” அல்லது “என்னைச் சோதனைக்கு உட்படுத்தினார்கள்” என்றும் மொழிபெயர்க்கலாம். ἐν δοκιμασίᾳ என்ற கிரேக்கச் சொற்றொடர் கடினமானது; அது சோதித்த முறையையோ அதற்குப் பயன்படுத்தப்பட்ட வழியையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சூழலின் அடிப்படையில், “என் செயல்களைக் கண்டபோதிலும்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் நேரடியாக இருப்பது “கண்டார்கள்” என்பதே.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: அங்கே
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட வனாந்தர இடத்தைச் சுட்டும் இடவினையடை; ‘எப்போது’ என்பதைக் காட்டிலும் கிரேக்கத்தின் இடப்பொருளை நேரடியாகக் காக்கிறது.
- source_word: ἐπείρασαν
  choice: என்னைச் சோதித்தார்கள்
  rationale: கடவுளைத் தூண்டுகிற எதிர்மறையான பொருளில் சோதித்தலைக் குறிக்கிறது. செயப்படுபொருளான ‘என்னை’ கிரேக்கத்தில் வெளிப்படையாக இல்லாவிட்டாலும், சங்கீத மேற்கோளின் சூழலில் அது தெளிவாகப் புரிகிறது.
- source_word: οἱ πατέρες ὑμῶν
  choice: உங்கள் முன்னோர்கள்
  rationale: இங்கு வரலாற்றில் முந்திய தலைமுறையினரைக் குறிக்கும் இயல்பான நவீனத் தமிழ்; ‘உங்கள் தந்தையர்’ என்று சொன்னால் உடனடி உயிரியல் தந்தையரை மட்டும் குறிக்கும் தவறான எண்ணம் ஏற்படலாம்.
- source_word: ἐν δοκιμασίᾳ
  choice: சோதனையின் மூலம்
  rationale: ἐν என்பதன் கருவிப்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; இக்கடினமான சொற்றொடரின் முறை அல்லது வழிமுறை சார்ந்த வேறு புரிதல்கள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
- source_word: καὶ εἶδον
  choice: கண்டார்கள்
  rationale: கிரேக்கத்தில் உள்ள எளிய இணைப்பைத் தொடர்கிறது; சூழலால் உணரப்படக்கூடிய ‘கண்டபோதிலும்’ என்ற விட்டுக்கொடுப்பு உறவை முதன்மை உரைக்குள் சேர்க்கவில்லை.
- source_word: τὰ ἔργα μου
  choice: என் செயல்கள்
  rationale: வனாந்தரத்தில் கடவுள் செய்தவற்றைக் குறிக்கும் ἔργα என்பதற்கான இயல்பான, பொருளுக்கு நெருக்கமான தமிழ்.
theological_decisions:
- issue: சோதிக்கப்பட்டவரின் அடையாளம்
  choice: என்னைச் சோதித்தார்கள்
  alternative: சோதித்தார்கள்
  rationale: SBLGNT இக்கூற்றில் ‘என்னை’ என்ற செயப்படுபொருளை வெளிப்படையாகக் கொண்டிருக்கவில்லை. இருப்பினும் சங்கீதம் 95 மேற்கோளின் பேச்சாளரும் வாக்கியச் சூழலும் கடவுளையே புரிந்துகொள்ளப்பட்ட செயப்படுபொருளாகக் காட்டுவதால், தமிழின் தெளிவுக்காக ‘என்னை’ சேர்க்கப்பட்டது.
- issue: செயல்களைக் கண்டதற்கும் சோதித்ததற்கும் இடையிலான உறவு
  choice: என் செயல்களையும் கண்டார்கள்
  alternative: என் செயல்களைக் கண்டபோதிலும்
  rationale: சூழல் விட்டுக்கொடுப்பு உறவை உணர்த்தக்கூடும்; ஆனால் கிரேக்கத்தில் καί என்பது வெறுமனே ‘மற்றும்/உம்’ என்ற இணைப்பாக இருப்பதால் அந்தத் தெளிவின்மை முதன்மை உரையில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு இயல்பாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டுள்ளது. ‘முன்னோர்கள்’ என்பது வரலாற்றுத் தலைமுறையைத் தெளிவாகக் குறிக்கிறது. மூலத்தின் கடினமான ἐν δοκιμασίᾳ சொற்றொடரை முற்றிலும் வழுவழுப்பாக்காமல், வாசிக்கத்தக்க முதன்மை உரையுடனும் மாற்றுப் பொருள்களைப் பாதுகாக்கும் அடிக்குறிப்புடனும் வழங்கப்பட்டுள்ளது.
