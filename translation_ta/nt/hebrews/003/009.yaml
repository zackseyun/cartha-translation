  source_fidelity: மூலத்தின் οὗ என்பதன் இடப்பொருளை “அங்கே” எனத் தக்கவைத்துள்ளது. புரிந்துகொள்ளப்படும் செயப்படுபொருளான “என்னை” சங்கீத மேற்கோள் சூழலுக்கு ஏற்பத் தெளிவாக்கப்பட்டுள்ளது. ἐν δοκιμασίᾳ என்பதன் கடினமான கருவி/முறை நுணுக்கம் “சோதனையின் மூலம்” மற்றும் அடிக்குறிப்பின் வழியாகப் பாதுகாக்கப்பட்டுள்ளது. καὶ εἶδον-ஐ விட்டுக்கொடுப்பு உறவாக மாற்றாமல் “கண்டார்கள்” என இணைப்பாகவே வழங்கியுள்ளது.
  naturalness: “அங்கே உங்கள் முன்னோர்கள் சோதனையின் மூலம் என்னைச் சோதித்தார்கள்; என் செயல்களையும் கண்டார்கள்” என்பது நவீன நிலையான தமிழில் தெளிவாகவும் மரியாதைமிக்க வேதாகம நடையிலும் உள்ளது. மூலத்தில் உள்ள சோதித்தல் தொடர்பான மீளுருவாக்கம் தமிழிலும் ஓரளவு உணரப்படுவது மூலத்தின் கடினத்தன்மைக்கு நேர்மையானது.
  terminology: “முன்னோர்கள்” வரலாற்று-உடன்படிக்கைச் சூழலில் இயல்பானது. “சோதித்தார்கள்,” “சோதனை,” மற்றும் “செயல்கள்” ஆகியவை மூலத்தின் சொல் மற்றும் கருத்துப் பரப்புக்கு ஏற்றவை. அடிக்குறிப்புகள் மாற்று வாசிப்புகளை எந்தக் கோட்பாட்டுத் தீர்மானமும் இன்றி சரியாகக் காக்கின்றன.
