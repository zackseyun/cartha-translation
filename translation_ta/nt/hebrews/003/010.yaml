source:
  edition: SBLGNT
  text: τεσσεράκοντα ἔτη· διὸ προσώχθισα τῇ γενεᾷ ⸀ταύτῃ καὶ εἶπον· Ἀεὶ πλανῶνται τῇ καρδίᾳ· αὐτοὶ δὲ οὐκ ἔγνωσαν τὰς ὁδούς μου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/010.yaml
  text: For forty years[a], therefore, I was provoked with this generation, and said, ‘They always go astray in their hearts[b], but they have not known my ways.’
translation:
  language: ta
  text: ஆகையால், நாற்பது ஆண்டுகள் இத்தலைமுறையின்மேல் சினங்கொண்டேன்; ‘அவர்கள் எப்போதும் தங்கள் உள்ளத்தில் வழிதவறுகிறார்கள்; ஆனால் அவர்கள் என் வழிகளை அறியவில்லை’ என்று சொன்னேன்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நாற்பது ஆண்டுகள் இத்தலைமுறையின்மேல் கடும் அதிருப்தியடைந்தேன்’ என்றும் மொழிபெயர்க்கலாம்; இங்குள்ள கிரேக்க வினைச்சொல் வலுவான அதிருப்தியையும், சில சூழல்களில் அருவருப்பையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் ‘உள்ளம்’ ஒருமையில் உள்ளது; இத்தலைமுறை முழுவதையும் ஒரே கூட்டாகக் கருதி இவ்வாறு கூறியிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τεσσεράκοντα ἔτη
  choice: நாற்பது ஆண்டுகளாக
  rationale: கால அளவைக் குறிக்கும் வேற்றுமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; சங்கீத மேற்கோளின் தொடர்ச்சியையும் தக்கவைக்கிறது.
- source_word: διὸ
  choice: ஆகவே
  rationale: முந்தைய கூற்றிலிருந்து வரும் விளைவு அல்லது முடிவைத் தெளிவாகக் குறிக்கிறது.
- source_word: προσώχθισα
  choice: கடும் வெறுப்படைந்தேன்
  rationale: இந்த வினைச்சொல் சாதாரண கோபத்தைவிட வலுவான அதிருப்தியையும் அருவருப்பையும் குறிக்கக்கூடும். ‘கடும் வெறுப்படைந்தேன்’ அதன் தீவிரத்தைத் தக்கவைத்து, ‘அருவருத்தேன்’ என்பதுபோல் அளவுக்கு மீறி ஒரே நுண்பொருளில் முடக்குவதில்லை.
- source_word: τῇ γενεᾷ ταύτῃ
  choice: இத்தலைமுறையின்மீது
  rationale: வினைச்சொல்லுடன் வரும் தத்திவின் தொடர்பை தமிழில் இயல்பாக வெளிப்படுத்துகிறது; குறிப்பிட்ட வனாந்தரத் தலைமுறையையே சுட்டுகிறது.
- source_word: καὶ εἶπον
  choice: என்று சொன்னேன்
  rationale: நேர்க் கூற்றைத் தொடர்ந்து வரும் கிரேக்க அமைப்பை தமிழுக்குரிய மேற்கோள் முடிவு அமைப்பில் இயல்பாகத் தருகிறது.
- source_word: Ἀεὶ πλανῶνται
  choice: எப்போதும் ... வழிதவறிச் செல்கிறார்கள்
  rationale: தொடர்ந்து நிகழும் ஒழுக்க-ஆவிக்குரிய விலகலை எளிய, தெளிவான தமிழில் தெரிவிக்கிறது.
- source_word: τῇ καρδίᾳ
  choice: தங்கள் உள்ளத்தில்
  rationale: கிரேக்கத்தின் ஒருமையைப் பேணி, தலைமுறையை ஒரு கூட்டுத் தொகுதியாகக் காட்டுகிறது; ‘உள்ளம்’ இங்கு சிந்தனை, விருப்பம், மனப்போக்கு ஆகியவற்றின் மையத்தைக் குறிக்கிறது.
- source_word: αὐτοὶ δὲ
  choice: என் வழிகளையோ இவர்கள்
  rationale: ‘-ஓ’ மற்றும் மீண்டும் வரும் ‘இவர்கள்’ ஆகியவை δέ-யின் முரண்பாட்டையும் αὐτοί-யின் வலியுறுத்தலையும் இயல்பான தமிழில் எடுத்துக்காட்டுகின்றன.
- source_word: οὐκ ἔγνωσαν
  choice: அறிந்துகொள்ளவில்லை
  rationale: வெறும் தகவல் அறிவை மட்டும் அல்லாமல், கடவுளுடைய வழிகளை உணர்ந்து ஏற்றுக்கொள்ளத் தவறியதையும் தெரிவிக்கிறது; இறந்தகால நிகழ்வைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: τὰς ὁδούς μου
  choice: என் வழிகள்
  rationale: கடவுளின் செயல்முறைகளையும் அவர் காட்டும் வாழ்க்கைப் பாதையையும் குறிக்கும் வேதாகம உருவகத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: προσώχθισα என்பதில் வெளிப்படும் இறை அதிருப்தி
  choice: கடும் வெறுப்படைந்தேன்
  alternative: கோபமடைந்தேன் / அருவருத்தேன்
  rationale: கிரேக்கச் சொல் வலுவான அதிருப்தி முதல் அருவருப்பு வரையிலான பொருளைக் கொண்டுள்ளது. தேர்ந்த மொழிபெயர்ப்பு அதன் தீவிரத்தை மெலிதாக்காமலும், ஒரு குறிப்பிட்ட இறையியல் விளக்கத்துக்குள் அதை முடக்காமலும் வைத்திருக்கிறது.
- issue: τῇ καρδίᾳ என்பதன் கூட்டொருமை
  choice: தங்கள் உள்ளத்தில்
  alternative: தங்கள் உள்ளங்களில்
  rationale: மூலத்தில் ‘உள்ளம்’ ஒருமையில் இருப்பதால், தலைமுறை முழுவதையும் கூட்டாகக் குறிப்பிடும் சாத்தியத்தை மொழிபெயர்ப்பு பாதுகாக்கிறது.
- issue: οὐκ ἔγνωσαν என்பதிலுள்ள ‘அறிதல்’
  choice: அறிந்துகொள்ளவில்லை
  alternative: புரிந்துகொள்ளவில்லை / அறியவில்லை
  rationale: இது அறிவுசார் புரிதலை மட்டும் குறிக்காமல், கடவுளின் வழிகளை அனுபவப்பூர்வமாக உணர்ந்து ஏற்காததையும் உள்ளடக்கலாம்; அந்த இறையியல் நெருக்கடியைத் தீர்மானமாகச் சுருக்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதாகப் புரியும், ஆனால் மறைநூல் மேற்கோளுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கச் சொல் வரிசையை அப்படியே பின்பற்றாமல், நேர்க் கூற்றை முதலில் வைத்து ‘என்று சொன்னேன்’ எனத் தமிழுக்குரிய இயல்பான அமைப்பு தரப்பட்டுள்ளது. ‘இதயம்’ என்பதற்குப் பதிலாக பொதுவாகச் சிந்தனை மற்றும் மனப்போக்கைக் குறிக்கும் ‘உள்ளம்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
