  rationale: διὸ-வை அதன் கிரேக்கத் தொடர்புக்கேற்ப ‘சினங்கொண்டேன்’ என்பதற்கு முன் வைத்துள்ளோம். προσώχθισா-வுக்கு இயல்பான, வலுவான, ஆனால் மிகைப்படுத்தாத ‘சினங்கொண்டேன்’ தேர்ந்தெடுக்கப்பட்டது. οὐκ ἔγνωσαν என்பதற்கு மூலத்துக்கு நெருக்கமான ‘அறியவில்லை’ பயன்படுத்தப்பட்டது. அடிக்குறிப்பு அடையாளங்கள் இரண்டும் பாதுகாக்கப்பட்டுள்ளன; அவற்றின் உரை திருத்தப்பட்ட வாசகத்துடன் ஒத்திசைக்கப்பட்டுள்ளது.
