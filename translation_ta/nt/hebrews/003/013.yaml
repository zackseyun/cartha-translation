reference: Hebrews 3:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλὰ παρακαλεῖτε ἑαυτοὺς καθ’ ἑκάστην ἡμέραν, ἄχρις οὗ τὸ Σήμερον καλεῖται, ἵνα μὴ σκληρυνθῇ ⸂τις ἐξ ὑμῶν⸃ ἀπάτῃ τῆς ἁμαρτίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/013.yaml
  text: But encourage one another every day[b][a], as long as it is called “Today,” so that none of you may be hardened by the deceitfulness of sin.
translation:
  language: ta
  text: ஆனால், “இன்று”[a] என்று அழைக்கப்படும் வரையில், பாவத்தின் வஞ்சகத்தால் உங்களில் எவரும் கடினமடைந்து போகாதபடி, ஒவ்வொரு நாளும் ஒருவரையொருவர் ஊக்கப்படுத்துங்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இன்று” என்பது சங்கீதம் 95-ஐ எதிரொலிக்கிறது; கடவுளின் அழைப்புக்கு பதிலளிக்க வேண்டிய தற்போதைய காலத்தை இது குறிக்கிறது.
    reason: cross_reference
  - marker: b
    text: அல்லது, “ஒருவரையொருவர் அறிவுறுத்துங்கள்.” கிரேக்க வினைச்சொல் சூழலுக்கேற்ப ஊக்கப்படுத்துதல், அறிவுறுத்துதல், வலியுறுத்துதல் அல்லது ஆறுதலளித்தல் ஆகிய பொருள்களைக் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய எச்சரிக்கைக்கு எதிர்மாறான, நடைமுறையான கட்டளையை அறிமுகப்படுத்தும் இயல்பான இணைப்புச் சொல்.
- source_word: παρακαλεῖτε
  choice: ஊக்கப்படுத்துங்கள்
  rationale: இச்சூழலில் நம்பிக்கையில் நிலைத்திருக்க ஒருவருக்கொருவர் தொடர்ந்து வலிமையூட்டுவதைக் குறிக்கிறது; வினையின் அறிவுறுத்துதல்/வலியுறுத்துதல் என்ற பரப்பை அடிக்குறிப்பு சுட்டுகிறது.
- source_word: ἑαυτοὺς
  choice: ஒருவரையொருவர்
  rationale: பன்மை ஏவலுடன் வரும் பிரதிப்பெயர் இங்கு பரஸ்பரச் செயலைக் குறிக்கிறது.
- source_word: καθ’ ἑκάστην ἡμέραν
  choice: ஒவ்வொரு நாளும்
  rationale: தினந்தோறும் தொடர வேண்டிய செயலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἄχρις οὗ τὸ Σήμερον καλεῖται
  choice: “இன்று” என்று அழைக்கப்படும் காலம் இருக்கும் வரையில்
  rationale: தற்போதைய வாய்ப்பு நீடிக்கும் காலமெங்கும் என்ற தொடர்ச்சியான பொருளையும் சங்கீதம் 95-ன் எதிரொலியையும் தக்கவைக்கிறது.
- source_word: ἵνα μὴ σκληρυνθῇ τις ἐξ ὑμῶν
  choice: உங்களில் எவரும் கடினப்பட்டுப் போகாதபடி
  rationale: எதிர்மறை நோக்கத்தையும் எச்சரிக்கையின் சமூகமுழுவதற்குமான பரப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; மூலத்தின் இறைப்பாட்டு வடிவையும் தேவையற்ற வகையில் செயப்பாட்டாக மாற்றவில்லை.
- source_word: ἀπάτῃ τῆς ἁμαρτίας
  choice: பாவத்தின் வஞ்சகத்தால்
  rationale: கடினப்படுதலுக்கான கருவி அல்லது வழிமுறையாகப் பாவத்தின் ஏமாற்றும் தன்மையைச் சுருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: பரஸ்பர அறிவுறுத்தலின் சமூகத் தன்மை
  choice: ஒருவரையொருவர்
  alternative: உங்களையே
  rationale: ἑαυτούς வடிவத்தில் பிரதிப்பொருள் கொண்டிருந்தாலும், பன்மை ஏவல் சூழலில் பரஸ்பரப் பொருளே இயல்பானது; தனிநபர் சார்ந்த தவறான எண்ணத்தைத் தவிர்க்கிறது.
- issue: τὸ Σήμερον என்பதன் வேதவசன எதிரொலி
  choice: மேற்கோள் குறிகளுடன் “இன்று”
  alternative: சாதாரண காலக்குறிப்பாக இன்று
  rationale: எபிரெயர் 3-ல் சங்கீதம் 95-ஐ எதிரொலிக்கும், கடவுளின் அழைப்புக்கு இப்போதே பதிலளிக்க வேண்டிய காலத்தை இது குறிக்கிறது; முதன்மை உரையில் அளவுக்கு மீறி விளக்காமல் அந்தத் தனித்துவத்தை மேற்கோள் குறிகள் காட்டுகின்றன.
- issue: கடினப்படுதலின் காரணச் செயல்பாடு
  choice: பாவத்தின் வஞ்சகத்தால்
  alternative: பாவத்தின் வஞ்சகத்தினால் தங்களைத் தாங்களே கடினப்படுத்துதல்
  rationale: σκληρυνθῇ என்பதன் இறைப்பாட்டு வடிவத்தையும் ἀπάτῃ என்பதன் கருவிப் பொருளையும் காக்கிறது; மனிதச் செயற்பாடு அல்லது தெய்வீகச் செயற்பாடு குறித்து மூலத்தில் இல்லாத தீர்மானத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. “வஞ்சகம்,” “கடினப்பட்டுப் போதல்” போன்ற சொற்கள் மூலத்தின் உருவகத் தீவிரத்தைத் தக்கவைக்கின்றன; வாக்கிய அமைப்பு தமிழின் இயல்புக்கேற்ப நோக்கத் துணைவாக்கியத்தை ஏவலுக்கு முன் வைக்கிறது.
