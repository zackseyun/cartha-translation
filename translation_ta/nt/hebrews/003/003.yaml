source:
  edition: SBLGNT
  text: πλείονος γὰρ ⸂οὗτος δόξης⸃ παρὰ Μωϋσῆν ἠξίωται καθ’ ὅσον πλείονα τιμὴν ἔχει τοῦ οἴκου ὁ κατασκευάσας αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/003.yaml
  text: For this one has been counted worthy of more glory than Moses, just as the one who built the house has greater honor than the house.
translation:
  language: ta
  text: ஏனெனில், வீட்டைக் கட்டியவருக்கு அந்த வீட்டைவிட அதிக மதிப்பு இருப்பதால், இவர் மோசேயைவிட அதிக மகிமைக்குத் தகுதியானவராகக் கருதப்பட்டிருக்கிறார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: இவர்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட இயேசுவை மரியாதையுடன் சுட்டுகிறது; மூலத்தின் சுட்டுப்பெயர் தன்மையையும் காக்கிறது.
- source_word: δόξης
  choice: மகிமை
  rationale: δόξα என்பதன் இச்சூழலுக்குரிய வேதாகம மற்றும் இறையியல் நிறையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ἠξίωται
  choice: தகுதியானவராகக் கருதப்பட்டிருக்கிறார்
  rationale: நிறைவேற்றப்பட்டு தொடரும் நிலையை உணர்த்தும் perfect passive வடிவத்தையும், ‘worthy’ என்ற மதிப்பீட்டையும் வெளிப்படுத்துகிறது.
- source_word: καθ’ ὅσον
  choice: இருப்பதுபோல
  rationale: வீட்டைக் கட்டியவருக்கும் வீட்டுக்கும் இடையிலான ஒப்புமையை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: τιμὴν
  choice: மதிப்பு
  rationale: δόξα என்பதற்குப் பயன்படுத்திய ‘மகிமை’யிலிருந்து சொல்வேறுபாட்டைக் காத்து, கட்டியவருக்குரிய honor-ஐ இயல்பாகச் சொல்கிறது.
- source_word: ὁ κατασκευάσας
  choice: கட்டியவர்
  rationale: οἶκος உடன் இணையும் போது ‘வீட்டைக் கட்டியவர்’ என்பது நேரடியும் இயல்புமான பொருள்; இவ்வசனத்திலேயே படைப்பாளர் என்ற விரிவான பொருளைத் திணிக்கவில்லை.
- source_word: οἴκου
  choice: வீடு
  rationale: மூலத்தின் உருவகத்தை அப்படியே காக்கிறது; குடும்பம் அல்லது இல்லத்தார் என்ற சாத்தியமான பரந்த கருத்தை சூழல் தீர்மானிக்க விடுகிறது.
theological_decisions:
- issue: ‘இவர்’ யாரைக் குறிக்கிறார்
  choice: சுட்டுப்பெயரை ‘இவர்’ எனத் தக்கவைத்தல்
  alternative: ‘இயேசு’ அல்லது ‘கிறிஸ்து’ என்று பெயரை வெளிப்படையாகச் சேர்த்தல்
  rationale: சூழலில் குறிப்பு இயேசுவை நோக்கியிருந்தாலும், மூலத்தில் உள்ள οὗτος என்ற சுட்டுப்பெயரை விரிவாக்காமல் மொழிபெயர்ப்பது மூல வடிவத்தை காக்கிறது.
- issue: வீட்டைக் கட்டியவரின் அடையாளம்
  choice: ‘அதைக் கட்டியவர்’ என ஒப்புமையை மட்டும் வழங்குதல்
  alternative: இங்கேயே அவரை கடவுள் அல்லது கிறிஸ்து என்று வெளிப்படையாக அடையாளப்படுத்துதல்
  rationale: இவ்வசனம் ஒப்புமையை முன்வைக்கிறது; அடுத்த வசனத்தின் விளக்கத்தை முன்கூட்டியே இங்கு சேர்க்காமல் இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; மரியாதைமிக்க ‘இவர்’ பயன்படுத்தப்பட்டுள்ளது. வாக்கியம் மூலத்தின் காரணவியல் மற்றும் ஒப்புமை அமைப்பைத் தக்கவைத்தபோதும் சாதாரண வாசகர்களுக்குத் தெளிவாக அமைக்கப்பட்டுள்ளது.
