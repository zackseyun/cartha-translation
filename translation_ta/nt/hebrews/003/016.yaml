source:
  edition: SBLGNT
  text: τίνες γὰρ ἀκούσαντες παρεπίκραναν; ἀλλ’ οὐ πάντες οἱ ἐξελθόντες ἐξ Αἰγύπτου διὰ Μωϋσέως;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/016.yaml
  text: For who[a], when they heard, rebelled? Was it not all those who came out of Egypt through Moses?
translation:
  language: ta
  text: ஏனெனில், கேட்டு கலகம் செய்தவர்கள் யார்?[a] மோசே மூலமாக எகிப்திலிருந்து புறப்பட்டுவந்த அனைவரும்தானே?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கேட்டு கடவுளைக் கோபமூட்டியவர்கள்” அல்லது “கேட்டு அவருக்குக் கசப்பூட்டியவர்கள்.” கிரேக்க வினைச்சொல்லை இன்னும் சொற்பொருளுக்கு நெருக்கமாக இவ்வாறு மொழிபெயர்க்கலாம்; இங்கு அது வனாந்தரத்தில் இஸ்ரவேலர் கடவுளுக்கு எதிராகக் கலகம் செய்து அவரைத் தூண்டியதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνες
  choice: யார்
  rationale: கலகம் செய்தவர்களின் அடையாளத்தை வினவும் பன்மைச் சொல்லாக இருந்தாலும், நவீனத் தமிழில் ‘யார்’ என்பதே இயல்பாகவும் தெளிவாகவும் அந்த வினாவை வெளிப்படுத்துகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முந்திய வசனத்தின் எச்சரிக்கைக்கு ஆதாரமாக வரும் விளக்கத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἀκούσαντες
  choice: கேட்டபின்பும்
  rationale: முதலில் கேட்டுவிட்டு அதன்பின்னரும் கலகம் செய்தனர் என்ற காலத் தொடர்பையும், எதிர்பார்ப்புக்கு மாறான செயலையும் இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: παρεπίκραναν
  choice: கலகம் செய்தவர்கள்
  rationale: வனாந்தரச் சூழலில் கீழ்ப்படியாமல் கடவுளைத் தூண்டிய இஸ்ரவேலரின் எதிர்ப்புச் செயலை நவீன வாசகர்களுக்குத் தெளிவாகத் தெரிவிக்கிறது; சொற்பொருளுக்கு நெருக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀλλ’ οὐ πάντες
  choice: அனைவரும்தானே?
  rationale: எதிர்பார்க்கப்படும் உறுதியான பதிலை உள்ளடக்கிய கிரேக்க மறுப்புவினாவின் வலிமையை இயல்பான தமிழ் வினா அமைப்பில் காக்கிறது.
- source_word: οἱ ἐξελθόντες ἐξ Αἰγύπτου
  choice: எகிப்திலிருந்து புறப்பட்டுவந்த
  rationale: எகிப்தைவிட்டு வெளியேறிய வரலாற்றுச் சம்பவத்தைக் குறிக்கும் மூலத்தின் இடவியல் மற்றும் செயற்பொருளை இயல்பாகப் பாதுகாக்கிறது.
- source_word: διὰ Μωϋσέως
  choice: மோசே மூலமாக
  rationale: διά + உரிமை வேற்றுமையின் வழிமுறை அல்லது முகமைப் பொருளைப் பாதுகாக்கிறது; ‘மோசேயின் தலைமையில்’ என்று விளக்கமாக விரிவாக்குவதைத் தவிர்க்கிறது.
theological_decisions:
- issue: வனாந்தரத் தலைமுறையின் செயலுக்கான παραπικραίνω என்பதன் பொருள்
  choice: கலகம் செய்தவர்கள்
  alternative: கோபமூட்டியவர்கள் / மனங்கசக்கச் செய்தவர்கள்
  rationale: இங்கு கடவுளுக்குக் கீழ்ப்படியாமல் அவருக்கு எதிராகச் செயல்பட்டதையே சூழல் குறிக்கிறது. ‘கலகம் செய்தவர்கள்’ என்பது அந்த இறையியல் மற்றும் கதைச்சூழல் வலிமையைத் தெளிவாகத் தருகிறது; இருப்பினும் கிரேக்க வினையின் சொற்பொருளுக்கு நெருக்கமான மாற்றுகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- issue: πάντες என்பதன் முழுமையான பொதுமைப்படுத்தல்
  choice: அனைவரும்
  alternative: அவர்களில் பலர் / கலகம் செய்த அனைவரும்
  rationale: மூலத்தில் உள்ள வலுவான மறுப்புவினையையும் ‘அனைவரும்’ என்ற சொலையும் அப்படியே காக்கிறது; பிற வசனங்களின் அடிப்படையில் விதிவிலக்குகளை இவ்வசனத்துக்குள் சேர்த்து வெளிப்படையான பதற்றத்தைத் தீர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. முதல் வினாவின் உரையாடல் வலிமையும் இரண்டாம் மறுப்புவினாவின் எதிர்பார்க்கப்பட்ட பதிலும் பாதுகாக்கப்பட்டுள்ளன; ‘மோசே மூலமாக’ என்பது மூலத்தின் முகமைப் பொருளை விளக்கவுரை இன்றிக் காக்கிறது.
