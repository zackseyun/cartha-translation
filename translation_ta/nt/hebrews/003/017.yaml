  source_fidelity: முதல் வினா மூலத்திற்கு நெருக்கமாக உள்ளது. ஆனால் இரண்டாம் வினாவில் மூலத்தின் ‘பாவம் செய்தவர்கள், அவர்களுடைய உடல்கள் வனாந்தரத்தில் விழுந்தன’ என்ற ஒருங்கிணைந்த வினாவியல் அமைப்பு, தனி அறிவிப்புவாக்கியமாகப் பிரிந்துள்ளது. மேலும் ἐρήμῳ என்பதன் இஸ்ரவேல் வனாந்தரச் சூழலை ‘வனாந்தரம்’ என்பதே மிகத் துல்லியமாகக் காக்கிறது.
