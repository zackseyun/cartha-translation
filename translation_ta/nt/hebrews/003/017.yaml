source:
  edition: SBLGNT
  text: τίσιν δὲ προσώχθισεν τεσσεράκοντα ἔτη; οὐχὶ τοῖς ἁμαρτήσασιν, ὧν τὰ κῶλα ἔπεσεν ἐν τῇ ἐρήμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/017.yaml
  text: And with whom was he angry for forty years? Was it not with those who sinned[a], whose bodies fell in the wilderness?
translation:
  language: ta
  text: அவர் யார்மீது நாற்பது ஆண்டுகள் கோபமாயிருந்தார்? வனாந்தரத்தில் உடல்கள்[a] விழுந்த பாவம் செய்தவர்கள்மீதல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பிணங்கள்.’
    reason: κῶλα என்ற சொல் இச்சூழலில் இறந்து கிடக்கும் உடல்களைக் கடுமையாகக் குறிக்கக்கூடும்; அந்த மாற்றுப் பொருளைத் தக்கவைக்கிறது.
lexical_decisions:
- source_word: προσώχθισεν
  choice: கோபமாயிருந்தார்
  rationale: குறிப்பிட்டவர்கள்மீது கடும் அதிருப்தி அல்லது கோபம் கொண்டிருப்பதை இவ்வினைச்சொல் குறிக்கிறது. சூழலின் இறைமரியாதையையும் நவீன இயல்பான தமிழையும் இது காக்கிறது.
- source_word: τεσσεράκοντα ἔτη
  choice: நாற்பது ஆண்டுகள்
  rationale: கால அளவைக் குறிக்கும் கிரேக்க வேற்றுமையைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: ἁμαρτήσασιν
  choice: பாவம் செய்தவர்கள்
  rationale: வனாந்தரத் தலைமுறையினரின் பாவச் செயலை நேரடியாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: κῶλα
  choice: உடல்கள்
  rationale: சொல்லின் அடிப்படைப் பொருள் உடல் உறுப்புகள் என்றாலும், இச்சூழலில் இறந்து விழுந்தவர்களின் உடல்களைக் குறிக்கிறது. ‘உடல்கள்’ என்பது இயல்பானதும் மரணத்தைத் தேவையின்றி விளக்கிச் சேர்க்காததும் ஆகும்; சொல்லின் கடுமையான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἔπεσεν
  choice: விழுந்தன
  rationale: மூலத்தின் விழுதல் என்ற படிமத்தைப் பாதுகாத்து, மரணத்தை வெளிப்படையாகச் சேர்க்காமல் சூழலால் உணர்த்துகிறது.
- source_word: ἐν τῇ ἐρήμῳ
  choice: பாலைநிலத்தில்
  rationale: இஸ்ரவேலரின் வனாந்தரப் பயணச் சூழலை நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
theological_decisions:
- issue: προσώχθισεν என்பதன் மறைமுக எழுவாய்
  choice: அவர் = கடவுள்
  alternative: எழுவாயைக் குறிப்பிடாமல் விடுதல்
  rationale: சுற்றியுள்ள வசனங்களில் மறைமுக எழுவாய் கடவுளைக் குறிக்கிறது. தமிழில் கேள்வி இயல்பாகவும் தெளிவாகவும் அமைய ‘அவர்’ வெளிப்படையாக இடப்பட்டுள்ளது; இது புதிய இறையியல் கருத்தைச் சேர்ப்பதல்ல.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இரு வினாக்களாக அமைத்து கிரேக்கச் சொல்லாட்சியின் வினாவியல் அழுத்தம் பாதுகாக்கப்பட்டுள்ளது.
