    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்கு நெருக்கமாக: “தமது மகிமையின் முன்பாக.” இதை “தமது மகிமையான முன்னிலையில்” என்றும் பொருளுணர்ந்து கூறலாம்.'
    reason: alternative_reading
  - marker: c
    text: 'அல்லது: “பழுதற்றவர்களாய்.” ἀμώμους என்ற கிரேக்கச் சொல் குற்றமின்மையோடு, களங்கம் அல்லது பழுது இல்லாத நிலையையும் நினைவூட்டலாம்.'
