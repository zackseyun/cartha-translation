- source_word: δὲ
  choice: தனியே மொழிபெயர்க்கப்படவில்லை
  rationale: இங்கு இது வலுவான எதிர்மறையைக் காட்டாமல் நிறைவுத் துதிக்கான மென்மையான மாறுதலைக் குறிக்கிறது. தமிழில் தனியே ‘இப்போது’ அல்லது ‘ஆனால்’ என்று சேர்ப்பது இல்லாத கால அல்லது எதிர்மறை நுட்பத்தை உருவாக்கக்கூடும்.
- source_word: φυλάξαι
  choice: காக்கவும்
  rationale: φυλάσσω என்பதன் காத்தல், பாதுகாத்தல் என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὑμᾶς
  choice: உங்களை
  rationale: இரண்டாம் நபர் பன்மை நேர்செயப்படுபொருளைத் தெளிவாகக் குறிக்கிறது.
- source_word: ἀπταίστους
  choice: இடறிவிடாதபடி
  rationale: இடறுதல் என்ற மூல உருவகத்தைப் பாதுகாக்கிறது; அன்றாடப் பாவம் அல்லது இறுதி விசுவாசவிலகல் என்று பொருளைச் சுருக்கி நிர்ணயிக்கவில்லை.
- source_word: καὶ στῆσαι
  choice: நிறுத்தவும்
  rationale: ἵστημι என்பதன் ‘நிற்கச் செய்தல்’ என்ற காரணவினைப் பொருளைத் தமிழில் இயல்பாகத் தருகிறது; மகிமைக்கு முன்பாகக் கொண்டுவந்து நிறுத்துதல் என்ற முன்னிறுத்தல் நுட்பமும் சூழலில் வெளிப்படுகிறது.
- source_word: κατενώπιον
