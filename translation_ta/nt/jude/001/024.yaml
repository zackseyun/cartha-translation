  source_fidelity: 'The draft accurately reflects the two infinitives governed by δυναμένῳ: keeping the plural readers from stumbling and causing them to stand. It also retains δόξα as “மகிமை,” rather than introducing “presence,” and appropriately leaves the scope of ἀπταίστους open. However, “தமது மகிமைக்கு முன்பாக” uses a dative form that is not the natural Tamil construction for ‘before his glory’; the genitive construction is required.'
