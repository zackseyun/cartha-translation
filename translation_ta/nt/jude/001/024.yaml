- source_word: τῆς δόξης αὐτοῦ
  choice: தமது மகிமை
  rationale: கிரேக்கம் நேரடியாக ‘அவருடைய மகிமை’ என்கிறது. ‘மகிமையான பிரசன்னம்’ போன்ற விளக்க விரிவாக்கத்தைத் தவிர்த்து மூலத்தின் இறையியல் செறிவைப் பேணுகிறது. எழுவாயைக் குறிக்கும் தமிழின் மரியாதைத் தற்சுட்டுப் பெயராக ‘தமது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἀμώμους
  choice: குற்றமற்றவர்களாய்
  rationale: அறநெறிசார் குற்றமின்மையை எளிய நவீன தமிழில் தெரிவிக்கிறது; சொல்லில் இருக்கக்கூடிய பலியியல் ‘பழுதற்ற’ நுட்பம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐν ἀγαλλιάσει
  choice: மகிழ்ச்சியுடன்
  rationale: களிகூரும் மகிழ்ச்சியைக் குறிக்கும் பெயர்ச்சொல்லை இயல்பான தமிழில் தருகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘மிகுந்த’ என்பதைச் சேர்க்கவில்லை.
theological_decisions:
- issue: τῆς δόξης αὐτοῦ என்பதை நேரடியாக மொழிபெயர்ப்பதா அல்லது ‘அவருடைய மகிமையான பிரசன்னம்’ என்று விரிப்பதா
  choice: தமது மகிமைக்கு முன்பாக
  alternative: தமது மகிமையான பிரசன்னத்தில்
  rationale: மூலத்தில் δόξα, ‘மகிமை’ என்ற பெயர்ச்சொல்லே உள்ளது; παρουσία, ‘பிரசன்னம்/வருகை’ இல்லை. நேரடி வடிவம் மறைமுகமாக உள்ள தெய்வீக முன்னிலையை வாசகர் உணர இடமளிக்கிறது; விளக்கத்தை மூலத்திற்குள் சேர்ப்பதில்லை.
- issue: ἀπταίστους என்பது பொதுவான இடறுதலையா அல்லது இறுதி வீழ்ச்சியையா குறிக்கிறது
  choice: இடறிவிடாதபடி
  alternative: விழுந்துவிடாதபடி
  rationale: இடறுதல் என்ற அடிப்படை உருவகத்தையும் அதன் இறையியல் திறந்த தன்மையையும் காக்கிறது; அன்றாடத் தவறு, பாவம், அல்லது இறுதி விசுவாசவிலகல் ஆகியவற்றில் ஒன்றாக மட்டும் பொருளை நிர்ணயிக்கவில்லை.
- issue: ἀμώμους என்பதில் அறநெறிசார் குற்றமின்மையா அல்லது பலியியல் பழுதின்மையா முன்னிலைப்பட வேண்டும்
  choice: குற்றமற்றவர்களாய்
  alternative: பழுதற்றவர்களாய்
  rationale: சூழலில் மனிதர்கள் தேவனுடைய மகிமைக்கு முன் நிறுத்தப்படுவதால் ‘குற்றமற்ற’ என்பது இயல்பாகப் புரிகிறது; அதேவேளை ‘பழுதற்ற’ என்ற பலியியல் எதிரொலி அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நிறைவுத் துதி நடை பயன்படுத்தப்பட்டுள்ளது. இது 25ஆம் வசனத்தில் நிறைவுபெறும் ஒரே வாக்கியத்தின் தொடக்கம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. ‘இப்போது’ போன்ற வெளிப்படையான காலச் சொல்லைச் சேர்க்காமல், δέ-யின் மென்மையான உரைமாற்றம் சூழலுக்கே விடப்பட்டுள்ளது.
