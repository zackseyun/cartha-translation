  text: இடறிவிடாதபடி[a] உங்களைக் காக்கவும், தமது மகிமையின் முன்பாக[b] உங்களைக் குற்றமற்றவர்களாய்[c] மகிழ்ச்சியுடன் நிறுத்தவும் வல்லவருக்கு,
  philosophy: optimal-equivalence
