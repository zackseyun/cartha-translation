source:
  edition: SBLGNT
  text: ὁ δὲ Μιχαὴλ ὁ ἀρχάγγελος, ὅτε τῷ διαβόλῳ διακρινόμενος διελέγετο περὶ τοῦ Μωϋσέως σώματος, οὐκ ἐτόλμησεν κρίσιν ἐπενεγκεῖν βλασφημίας, ἀλλὰ εἶπεν· Ἐπιτιμήσαι σοι κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/009.yaml
  text: But Michael the archangel[a], when he was disputing with the devil and arguing about Moses' body, did not dare to bring a slanderous judgment against him, but said[b], “May the Lord rebuke you.”
translation:
  language: ta
  text: ஆனால், தலைமைத் தூதனாகிய மிகாவேல் பிசாசுடன் சர்ச்சையில் ஈடுபட்டு, மோசேயின் உடலைக் குறித்து வாதிட்டபோது, அவனுக்கு எதிராகப் பழிதூற்றும் தீர்ப்பை வழங்கத் துணியவில்லை[a]. மாறாக, “ஆண்டவர் உன்னைக் கண்டிப்பாராக”[b] என்று சொன்னான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, மரபான முறையில், “அவனுக்கு எதிராக இழிவுபடுத்தும் குற்றச்சாட்டைச் சுமத்தத் துணியவில்லை.”
    reason: lexical_alternative
  - marker: b
    text: இந்தச் சொற்கள் சகரியா 3:2-ஐ எதிரொலிக்கின்றன; அங்கே ஆண்டவர் சாத்தானைக் கண்டிக்கிறார்.
    reason: cross_reference
lexical_decisions:
- source_word: ἀρχάγγελος
  choice: தலைமைத் தூதன்
  rationale: ‘தூதர்களில் முதன்மையானவர்’ என்ற பட்டத்தின் பொருளை இயல்பான நவீனத் தமிழில் தெளிவாகக் கொடுக்கிறது.
- source_word: διαβόλῳ
  choice: பிசாசு
  rationale: இங்கு தனிப்பட்ட அமானுஷ்ய எதிரியைக் குறிக்கும் வழக்கமான தமிழ்ப் பெயர்.
- source_word: διακρινόμενος
  choice: சர்ச்சையில் ஈடுபட்டு
  rationale: மோதலுடனான கருத்துவேறுபாடு அல்லது தகராறு என்ற நுணுக்கத்தைத் தருகிறது; அடுத்து வரும் வாதிடுதலிலிருந்து முற்றிலும் ஒன்றாக்கப்படவில்லை.
- source_word: διελέγετο
  choice: வாதிட்டபோது
  rationale: தொடர்ந்து நடைபெற்ற எதிர்நிலை வாய்மொழிப் பரிமாற்றத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: περὶ τοῦ Μωϋσέως σώματος
  choice: மோசேயின் உடலைக் குறித்து
  rationale: கிரேக்கத் தொடரின் உறவையும் குறிப்பான உடல் என்ற பொருளையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: οὐκ ἐτόλμησεν
  choice: துணியவில்லை
  rationale: தானாகச் செய்யத் துணிதல் அல்லது முனைதல் என்ற வினையின் நேரடியான பொருளைத் தருகிறது.
- source_word: κρίσιν ἐπενεγκεῖν βλασφημίας
  choice: அவனுக்கு எதிராகப் பழிதூற்றும் தீர்ப்பைக் கொண்டுவர
  rationale: கடினமான கிரேக்கத் தொடரிலுள்ள நீதித்துறைச் சாயலையும் பழிப்புரையின் தன்மையையும் பாதுகாக்கிறது; மிகாவேல் தேவனைத் தூஷித்தான் என்ற தவறான புரிதலைத் தவிர்க்கிறது.
- source_word: Ἐπιτιμήσαι σοι κύριος
  choice: ஆண்டவர் உன்னைக் கண்டிப்பாராக
  rationale: ஆசை அல்லது வேண்டுதலைக் குறிக்கும் optative வடிவின் வலிமையை நவீனத் தமிழில் வெளிப்படையாகக் காட்டுகிறது.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான நிலையான, கண்ணியமான தமிழாக்கம்.
theological_decisions:
- issue: பிசாசை அணுகுவதில் மிகாவேல் காட்டிய கட்டுப்பாட்டின் தன்மை
  choice: மிகாவேல் தன் சார்பாகக் கண்டனத் தீர்ப்பு வழங்காமல், ஆண்டவரின் கண்டிப்பை வேண்டுகிறான்.
  alternative: மிகாவேல் தூஷணமான தீர்ப்பையோ இழிவுபடுத்தும் குற்றச்சாட்டையோ கூறுவதைத் தவிர்க்கிறான்.
  rationale: κρίσιν ... βλασφημίας என்ற கிரேக்கத் தொடர் பலவாறு புரிந்துகொள்ளப்படலாம். மொழிபெயர்ப்பு விரிவான தேவதூதர் கோட்பாட்டைச் சேர்க்காமல், மிகாவேல் தானே தீர்ப்பளிக்காமல் ஆண்டவரின் அதிகாரத்தை நாடுகிறான் என்ற தெளிவான முரண்பாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிக்கப்பட்டுள்ளது. ‘சர்ச்சையில் ஈடுபட்டு ... வாதிட்டபோது’ என்பது இரண்டு தொடர்புடைய கிரேக்க வினைகளையும் வேறுபடுத்திப் பாதுகாக்கிறது. கடினமான κρίσιν ... βλασφημίας தொடர் முதன்மை உரையில் பொருள் தெளிவாகவும், அதன் மரபான மாற்று அடிக்குறிப்பிலும் தரப்பட்டுள்ளது.
