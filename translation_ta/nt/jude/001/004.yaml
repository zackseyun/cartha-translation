- from: ஏனெனில், சில மனிதர்கள் யாருக்கும் தெரியாமல் உள்ளே நுழைந்திருக்கிறார்கள்[a]. இறைப்பற்றில்லாத இவர்கள் இந்தத் தீர்ப்புக்காக நெடுங்காலத்திற்கு முன்பே எழுதப்பட்டவர்கள்[b]. இவர்கள் நம் கடவுளின் அருளை வெட்கங்கெட்ட சிற்றின்ப வாழ்க்கைக்கான வாய்ப்பாக மாற்றி[c], நமது ஒரே எஜமானரும் ஆண்டவருமான இயேசு மெசியாவை மறுதலிக்கிறார்கள்.
  to: ஏனெனில், சிலர் யாருக்கும் தெரியாமல் ஊடுருவி நுழைந்திருக்கிறார்கள்[a]. அவர்கள் இறைப்பற்றில்லாதவர்கள்; இந்தத் தீர்ப்பைக் குறித்து நெடுங்காலத்துக்கு முன்பே எழுதிக் குறிப்பிடப்பட்டவர்கள்[b]. அவர்கள் நம் கடவுளின் அருளை வெட்கங்கெட்ட ஒழுக்கக்கேடாக மாற்றி[c], நமது ஒரே எஜமானரும் ஆண்டவருமான இயேசு மெசியாவை மறுதலிக்கிறார்கள்.
