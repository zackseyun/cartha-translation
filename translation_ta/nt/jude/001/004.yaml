reference: Jude 1:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: παρεισέδυσαν γάρ τινες ἄνθρωποι, οἱ πάλαι προγεγραμμένοι εἰς τοῦτο τὸ κρίμα, ἀσεβεῖς, τὴν τοῦ θεοῦ ἡμῶν χάριτα μετατιθέντες εἰς ἀσέλγειαν καὶ τὸν μόνον ⸀δεσπότην καὶ κύριον ἡμῶν Ἰησοῦν Χριστὸν ἀρνούμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/004.yaml
  text: For certain men have slipped in unnoticed[a], who long ago were designated for this judgment, ungodly men who turn the grace of our God into sensuality and deny our only Master and Lord[d][c][b], Jesus the Messiah.
translation:
  language: ta
  text: ஏனெனில், சிலர் யாருக்கும் தெரியாமல் ஊடுருவி நுழைந்திருக்கிறார்கள்[a]. அவர்கள் இறைப்பற்றில்லாதவர்கள்; இந்தத் தீர்ப்பைக் குறித்து நெடுங்காலத்துக்கு முன்பே எழுதிக் குறிப்பிடப்பட்டவர்கள்[b]. அவர்கள் நம் கடவுளின் அருளை வெட்கங்கெட்ட ஒழுக்கக்கேடாக மாற்றி[c], நமது ஒரே எஜமானரும் ஆண்டவருமான இயேசு மெசியாவை மறுதலிக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கவனிக்கப்படாமல் ஊடுருவி நுழைந்திருக்கிறார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: “எழுதிக் குறிப்பிடப்பட்டவர்கள்” என்பது, “இந்தத் தீர்ப்புக்காக முன்பே குறிக்கப்பட்டவர்கள்” என்றும் பொருள்படலாம்.
    reason: source_ambiguity
  - marker: c
    text: அல்லது, “கட்டுப்பாடற்ற ஒழுக்கக்கேடு” அல்லது “சிற்றின்ப வெறி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεισέδυσαν
  choice: யாருக்கும் தெரியாமல் உள்ளே நுழைந்திருக்கிறார்கள்
  rationale: மறைவாக ஊடுருவி நுழைந்ததையும் அதன் தற்போதைய விளைவையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: πάλαι προγεγραμμένοι
  choice: நெடுங்காலத்திற்கு முன்பே எழுதப்பட்டவர்கள்
  rationale: προγράφω என்பதன் ‘முன்பே எழுதுதல்’ என்ற அடிப்படைப் பொருளைப் பேணி, முன்நியமனம் என்று மட்டும் தீர்மானித்துவிடாமல் உள்ள தெளிவின்மையைத் தக்கவைக்கிறது.
- source_word: κρίμα
  choice: தீர்ப்பு
  rationale: நீதித்தீர்ப்பு அல்லது கண்டனத் தீர்ப்பு ஆகிய இரு சாத்திய நுட்பங்களையும் உள்ளடக்கும் பரந்த சொல்.
- source_word: ἀσεβεῖς
  choice: இறைப்பற்றில்லாதவர்கள்
  rationale: கடவுளை மதியாத தன்மையை நவீன, புரிந்துகொள்ளத்தக்க தமிழில் தெரிவிக்கிறது.
- source_word: χάριτα
  choice: அருள்
  rationale: இச்சூழலில் கடவுளின் அருள்மிகு தயவைக் குறிக்கும் நிலைபெற்ற இறையியல் சொல்.
- source_word: μετατιθέντες εἰς ἀσέλγειαν
  choice: வெட்கங்கெட்ட சிற்றின்ப வாழ்க்கைக்கான வாய்ப்பாக மாற்றி
  rationale: அருளை ஒழுக்கக்கேட்டுக்கான அனுமதியாக மாற்றும் கருத்தை இயல்பாகக் கூறுகிறது; ἀσέλγεια என்பதின் வெட்கமற்ற தன்னிச்சையையும் உணர்த்துகிறது.
- source_word: μόνον δεσπότην καὶ κύριον
  choice: ஒரே எஜமானரும் ஆண்டவருமான
  rationale: δεσπότης, κύριος ஆகிய இரு வேறுபட்ட அதிகாரப் பட்டங்களையும் தனித்தனியாகப் பிரதிபலிக்கிறது.
- source_word: Ἰησοῦν Χριστόν
  choice: இயேசு மெசியா
  rationale: Χριστός என்பதை இங்கு பெயரின் ஓர் அங்கமாக மட்டும் அல்லாமல் பட்டமாகக் காட்டுகிறது.
- source_word: ἀρνούμενοι
  choice: மறுதலிக்கிறார்கள்
  rationale: நம்பிக்கையிலும் நடத்தையிலும் அவரை ஏற்க மறுப்பதைத் தெளிவாகக் குறிக்கிறது.
theological_decisions:
- issue: προγεγραμμένοι εἰς τοῦτο τὸ κρίμα என்பதன் பொருள்
  choice: இந்தத் தீர்ப்பைக் குறித்து நெடுங்காலத்திற்கு முன்பே எழுதப்பட்டவர்கள்
  alternative: இந்தத் தீர்ப்புக்காக முன்குறிக்கப்பட்டவர்கள்
  rationale: முன்னறிவிப்பு அல்லது முந்தைய வேதப்பதிவு என்ற சாத்தியத்தையும் முன்குறித்தல் என்ற சாத்தியத்தையும் அடிக்குறிப்பில் வெளிப்படுத்தி, தனிநபர் முன்நியமனம் குறித்த முடிவை மூலவாக்கியத்தைவிட வலுப்படுத்தாமல் இருக்கிறது.
- issue: ‘ஒரே எஜமானரும் ஆண்டவரும்’ என்ற இரு பட்டங்களின் குறிப்பு
  choice: இரு பட்டங்களும் இயேசு மெசியாவையே குறிக்கின்றன
  alternative: ‘எஜமானர்’ கடவுள் தந்தையையும் ‘ஆண்டவர்’ இயேசு மெசியாவையும் தனித்தனியாகக் குறிக்கின்றன
  rationale: கிரேக்கத் தொடரின் இயல்பான இலக்கண அமைப்பு இரு பட்டங்களையும் தொடர்ந்து வரும் இயேசு மெசியாவுடன் இணைக்கிறது; மாற்றுப் புரிதலை வலுக்கட்டாயமாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இறைப்பற்றில்லாத’, ‘அருள்’, ‘ஆண்டவர்’, ‘மெசியா’ போன்ற சொற்கள் வேதாகமச் செறிவைத் தக்கவைக்கின்றன. மூலத்தின் நீண்ட வாக்கியம் தமிழில் வாசிப்புத் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; காரணத் தொடர்பும் குற்றச்சாட்டுகளின் வரிசையும் பேணப்பட்டுள்ளன.
