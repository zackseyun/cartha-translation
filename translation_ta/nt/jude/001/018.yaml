source:
  edition: SBLGNT
  text: ὅτι ἔλεγον ⸀ὑμῖν· ⸂Ἐπ’ ἐσχάτου χρόνου⸃ ἔσονται ἐμπαῖκται κατὰ τὰς ἑαυτῶν ἐπιθυμίας πορευόμενοι τῶν ἀσεβειῶν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/018.yaml
  text: that they were saying to you[a], “In the last time there will be mockers[b], going according to their own ungodly desires.”
translation:
  language: ta
  text: “கடைசிக் காலத்தில்[a], தங்களுடைய இறைபக்தியற்ற ஆசைகளின்படி நடந்து கொள்கிற கேலி செய்பவர்கள்[b] இருப்பார்கள்” என்று அவர்கள் உங்களிடம் சொல்லிவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முடிவுக் காலத்தில்” அல்லது “காலத்தின் முடிவில்.” கிரேக்கத்தில் “காலம்” என்பது ஒருமையில் உள்ளது; “நாட்கள்” அல்ல.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஏளனம் செய்பவர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: சொல்லிவந்தார்கள்
  rationale: முற்றுப்பெறாத இறந்தகால வினை, கடந்த காலத்தில் தொடர்ந்து அல்லது திரும்பத் திரும்பச் சொன்னதைக் காட்டுகிறது; ‘சொன்னார்கள்’ என்பதைவிட ‘சொல்லிவந்தார்கள்’ இந்த அம்சத்தை இயல்பாகக் காக்கிறது.
- source_word: Ἐπ’ ἐσχάτου χρόνου
  choice: கடைசிக் காலத்தில்
  rationale: χρόνου என்பது ஒருமை; ஆகவே பரிச்சயமான ‘கடைசி நாட்களில்’ என்ற சொற்றொடரைப் புகுத்தாமல், மூலத்தின் முடிவுக்காலப் பொருளையும் ஒருமையையும் காக்கிறது.
- source_word: ἐμπαῖκται
  choice: கேலி செய்பவர்கள்
  rationale: இகழ்ச்சியுடன் கேலி செய்து எதிர்ப்பவர்களைக் குறிக்கிறது; நவீனத் தமிழில் எளிதாகப் புரியும் இயல்பான சொற்றொடர்.
- source_word: κατὰ τὰς ἑαυτῶν ἐπιθυμίας
  choice: தங்களுடைய ... ஆசைகளின்படி
  rationale: κατά இங்கு ஒன்றுக்கு ஏற்ப நடத்தலைக் குறிக்கிறது. ἐπιθυμίαι பொதுவாக ஆசைகளைக் குறிக்கக்கூடும் என்பதால், அதை பாலியல் இச்சைகளாக மட்டும் குறுக்காமல் ‘ஆசைகள்’ என்று தரப்பட்டுள்ளது.
- source_word: πορευόμενοι
  choice: நடக்கும்
  rationale: நேரடியாகச் செல்லுதல் அல்லது நடத்தல் என்ற உருவகத்தைத் தக்கவைத்து, இங்கு வாழ்க்கை நடத்தையைக் குறிக்கும் இயல்பான தமிழாக அமைகிறது.
- source_word: τῶν ἀσεβειῶν
  choice: இறைபக்தியற்ற
  rationale: இந்தப் பன்மை மரபுப்பெயர் ஆசைகளின் தன்மையை வரையறுக்கிறது. ‘இறைபக்தியற்ற ஆசைகள்’ என்பது அதன் சமய-அறநெறி மதிப்பீட்டைக் காக்கிறது; ஆசைகளை ஒரு குறிப்பிட்ட வகைக்கு மட்டும் சுருக்குவதில்லை.
theological_decisions:
- issue: முடிவுக்காலச் சொற்றொடர்
  choice: கடைசிக் காலத்தில்
  alternative: கடைசி நாட்களில்; முடிவுக் காலத்தில்; காலத்தின் முடிவில்
  rationale: மூலத்தில் χρόνος ஒருமையில் இருப்பதைப் பாதுகாத்து, வேறு வேதாகம இடங்களிலுள்ள பரிச்சயமான பன்மைச் சொற்றொடருடன் ஒத்திசைக்கவில்லை; அதேவேளையில் முடிவுக்கால நோக்கையும் காக்கிறது.
- issue: ஆசைகளின் அறநெறித் தன்மை
  choice: இறைபக்தியற்ற ஆசைகள்
  alternative: இறைபக்தியின்மையின் ஆசைகள்; கடவுளற்ற ஆசைகள்
  rationale: மூலத்தின் எதிர்மறையான சமய-அறநெறி மதிப்பீடு தெளிவாகக் காக்கப்படுகிறது. ἐπιθυμίαι என்பதைக் காம இச்சைகளாக மட்டும் புரிந்துகொள்ளும் வகையில் குறுக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தமிழின் இயல்பான மேற்கோள் அமைப்புக்கேற்ப ὅτι அறிமுகப்படுத்தும் கூற்று முதலில் வைக்கப்பட்டு, ‘என்று அவர்கள் ... சொல்லிவந்தார்கள்’ என முடிக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறியீடுகளும் உரையில் உரிய சொற்றொடருக்குப் பின் இடப்பட்டுள்ளன.
