  verdict: revise
  source_fidelity: The draft accurately represents the imperfect ἔλεγον (‘சொல்லிவந்தார்கள்’), the singular χρόνος in ‘கடைசிக் காலத்தில்,’ the future assertion, and the genitive characterization ‘இறைபக்தியற்ற ஆசைகள்.’ The participle πορευόμενοι is best made explicit as a manner-of-life modifier of ‘கேலி செய்பவர்கள்.’
  naturalness: The current ‘ஆசைகளின்படி நடக்கும் கேலி செய்பவர்கள்’ is understandable, but it can momentarily suggest that the act of mocking itself occurs according to the desires. ‘ஆசைகளின்படி நடந்து கொள்கிற கேலி செய்பவர்கள்’ more naturally and unambiguously modifies the people, while retaining the conduct metaphor.
  terminology: ‘கடைசிக் காலம்,’ ‘கேலி செய்பவர்கள்,’ and ‘இறைபக்தியற்ற ஆசைகள்’ are suitable modern-standard Tamil renderings. The footnotes correctly preserve the singular-time observation and the lexical alternative for ἐμπαῖκται.
