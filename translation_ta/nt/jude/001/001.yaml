id: JUD.1.1
reference: Jude 1:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἰούδας Ἰησοῦ Χριστοῦ δοῦλος, ἀδελφὸς δὲ Ἰακώβου, τοῖς ἐν θεῷ πατρὶ ⸀ἠγαπημένοις καὶ Ἰησοῦ Χριστῷ τετηρημένοις κλητοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/001.yaml
  text: 'Jude[a], a servant of Jesus the Messiah and brother of James, to those who are loved in God the Father and kept for Jesus the Messiah[c][b], called:'
translation:
  language: ta
  text: 'இயேசு மெசியாவின் அடிமையும் யாக்கோபின் சகோதரனுமாகிய யூதா, தந்தையாகிய கடவுளில் அன்புகூரப்பட்டு[b], இயேசு மெசியாவுக்காகக் காக்கப்பட்டு[a], அழைக்கப்பட்டவர்களுக்கு:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இயேசு மெசியாவால் காக்கப்பட்டு.” கிரேக்க dative வடிவம் “அவரால்” என்ற முகமைப் பொருளையோ, “அவருக்காக” என்ற நோக்கம் அல்லது நன்மைப் பொருளையோ தரக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: சில கையெழுத்துப் பிரதிகளில் “தந்தையாகிய கடவுளில் அன்புகூரப்பட்டு” என்பதற்குப் பதிலாக “தந்தையாகிய கடவுளில் பரிசுத்தமாக்கப்பட்டு” என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: Ἰούδας
  choice: யூதா
  rationale: புதிய ஏற்பாட்டுத் தமிழ் வழக்கில் இப்பெயருக்கான இயல்பான ஒலிபெயர்ப்பு; பெயரை வேறு நபரிடமிருந்து செயற்கையாக வேறுபடுத்தவில்லை.
- source_word: Ἰησοῦ Χριστοῦ δοῦλος
  choice: இயேசு மெசியாவின் அடிமை
  rationale: δοῦλος என்பதன் கட்டுப்பட்ட உரிமை மற்றும் முழு கீழ்ப்படிதல் சார்ந்த வலிமையை ‘அடிமை’ நேரடியாகக் காக்கிறது; Χριστός பெயர் மட்டுமல்ல, ‘மெசியா’ என்னும் பட்டம்.
- source_word: ἀδελφὸς δὲ Ἰακώβου
  choice: யாக்கோபின் சகோதரன்
  rationale: δέ இங்கு மென்மையான இணைப்பாக உள்ளது; தமிழில் ‘-உம்’ இணைப்பு இயல்பாக அதைப் பிரதிபலிக்கிறது. Ἰάκωβος என்பதற்கு மூலத்துக்கு நெருக்கமான ‘யாக்கோபு’ பயன்படுத்தப்பட்டது.
- source_word: ἐν θεῷ πατρὶ ἠγαπημένοις
  choice: தந்தையாகிய கடவுளுக்குள் அன்புகூரப்பட்டு
  rationale: ἐν என்பதன் உறவு/வட்டாரப் பொருளை ‘க்குள்’ காக்கிறது; perfect passive participle முடிவுற்ற செயலால் தொடரும் நிலையைச் சுட்டுவதால் ‘அன்புகூரப்பட்டு’ பொருத்தமானது.
- source_word: Ἰησοῦ Χριστῷ τετηρημένοις
  choice: இயேசு மெசியாவுக்காகக் காக்கப்பட்டு
  rationale: τετηρημένοις பாதுகாக்கப்பட்ட தொடர்நிலையைக் குறிக்கிறது. dative வடிவத்திற்கு நோக்கம்/நன்மை என்ற பொருளில் ‘-க்காக’ முதன்மை உரையில் தரப்பட்டுள்ளது; முகமைப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: κλητοῖς
  choice: அழைக்கப்பட்டவர்கள்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் adjective-ஐ இயல்பான தமிழில் பெறுநர்களைக் குறிக்கும் பன்மை வடிவமாகத் தந்துள்ளது; முந்தைய இரண்டு passive விளக்கங்களுடனான கருத்து இணைப்பும் காக்கப்படுகிறது.
theological_decisions:
- issue: τετηρημένοις உடன் Ἰησοῦ Χριστῷ என்பதன் உறவு
  choice: இயேசு மெசியாவுக்காகக் காக்கப்பட்டு
  alternative: இயேசு மெசியாவால் காக்கப்பட்டு
  rationale: கிரேக்க dative நோக்கம்/நன்மையையோ முகமையையோ குறிக்கக்கூடும். முதன்மை உரை ‘மெசியாவுக்காக’ என்பதைத் தேர்ந்தெடுக்கிறது; உண்மையான இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் விடப்பட்டுள்ளது.
- issue: ἠγαπημένοις என்பதற்கான உரைவேறுபாடு
  choice: அன்புகூரப்பட்டு
  alternative: பரிசுத்தமாக்கப்பட்டு
  rationale: SBLGNT மூல உரையிலுள்ள ἠγαπημένοις பின்பற்றப்படுகிறது; சில கையெழுத்துப் பிரதிகளின் ἡγιασμένοις வாசகம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, வாசிக்க எளிதான கடிதத் தொடக்கம். ‘அடிமை’ மூலச்சொல்லின் வலிமையைத் தணிக்காமல் தருகிறது. ‘கிறிஸ்து’ என்ற மரபுச் சொற்குப் பதிலாக பட்டத்தின் பொருளை வெளிப்படுத்த ‘மெசியா’ பயன்படுத்தப்பட்டுள்ளது. கிரேக்கப் பெறுநர் அமைப்பைத் தமிழில் இயல்பாக்க ‘...அழைக்கப்பட்டவர்களுக்கு எழுதுவது’ என அமைக்கப்பட்டுள்ளது.
