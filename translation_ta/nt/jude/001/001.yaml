revisions:
- from: இயேசு மெசியாவின் அடிமையும் யாக்கோபின் சகோதரனுமாகிய யூதா, தந்தையாகிய கடவுளுக்குள் அன்புகூரப்பட்டு, இயேசு மெசியாவுக்காகக் காக்கப்பட்டு,[a] அழைக்கப்பட்டவர்களுக்கு எழுதுவது:[b]
  to: 'இயேசு மெசியாவின் அடிமையும் யாக்கோபின் சகோதரனுமாகிய யூதா, தந்தையாகிய கடவுளில் அன்புகூரப்பட்டு[b], இயேசு மெசியாவுக்காகக் காக்கப்பட்டு[a], அழைக்கப்பட்டவர்களுக்கு:'
