id: JUD.1.15
reference: Jude 1:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ποιῆσαι κρίσιν κατὰ πάντων καὶ ἐλέγξαι ⸂πάντας τοὺς ἀσεβεῖς⸃ περὶ πάντων τῶν ἔργων ἀσεβείας αὐτῶν ὧν ἠσέβησαν καὶ περὶ πάντων τῶν σκληρῶν ὧν ἐλάλησαν κατ’ αὐτοῦ ἁμαρτωλοὶ ἀσεβεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/015.yaml
  text: to execute judgment against all and to convict all the ungodly concerning all their ungodly deeds that they committed in ungodliness[c][b][a], and concerning all the harsh things that ungodly sinners have spoken against him.
translation:
  language: ta
  text: அனைவருக்கும் எதிராகத் தீர்ப்பை நிறைவேற்றவும், இறைப்பற்றற்ற அனைவரையும் அவர்கள் இறைப்பற்றின்றிச் செய்த அவர்களுடைய இறைப்பற்றற்ற செயல்கள் அனைத்தைக் குறித்தும், இறைப்பற்றற்ற பாவிகள் அவருக்கு[b] எதிராகப் பேசிய கடுமையான சொற்கள்[c] அனைத்தைக் குறித்தும் குற்றவாளிகள் என்று நிரூபிக்கவும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘அவர்’ என்பது சூழலின்படி முந்தைய வசனத்தில் குறிப்பிடப்பட்ட ஆண்டவரைக் குறிக்கிறது.
    reason: cross_reference
  - marker: c
    text: ‘கடினமான சொற்கள்’ என்றும் மொழிபெயர்க்கலாம். இங்கு கிரேக்கச் சொல் அவருக்கு எதிராகப் பேசப்பட்ட கடுமையான, எதிர்ப்புமிக்க அல்லது துணிகரமான சொற்களைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῆσαι κρίσιν
  choice: தீர்ப்பை நிறைவேற்றவும்
  rationale: இது வெறுமனே ஒரு முடிவை அறிவிப்பதை அல்ல, நீதித்தீர்ப்பைச் செயல்படுத்துவதைக் குறிக்கிறது. தமிழில் நீதித்துறைப் பொருளை இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: κατὰ πάντων
  choice: எல்லாருக்கும் எதிராக
  rationale: κατά + மரபுவேற்றுமை இங்கு எதிரான நீதித்தீர்ப்பைக் குறிக்கிறது. முதல் πάντων என்பதன் பரந்த குறிப்பைச் சுருக்காமல் ‘எல்லாரும்’ எனப் பாதுகாக்கிறது.
- source_word: ἐλέγξαι
  choice: குற்றவாளிகள் என்று நிரூபிக்கவும்
  rationale: κρίσιν என்ற நீதித்தீர்ப்புச் சூழலில், தவற்றைச் சுட்டிக்காட்டுவது மட்டுமல்லாமல் குற்றத்தை வெளிப்படுத்தி நிறுவுவதையும் இந்த வினை குறிக்கிறது.
- source_word: πάντας τοὺς ἀσεβεῖς
  choice: இறைப்பற்றற்றவர்கள் அனைவரும்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் பன்மைத் தொடரைத் தெளிவாகத் தருகிறது; மேலும் இவ்வசனத்தில் மீண்டும் மீண்டும் வரும் ἀσεβ- சொற்குடும்பத்தோடு தொடர்பை வைத்திருக்கிறது.
- source_word: περὶ πάντων τῶν ἔργων ἀσεβείας αὐτῶν
  choice: அவர்களுடைய இறைப்பற்றற்ற செயல்கள் அனைத்தைக் குறித்தும்
  rationale: ‘இறைப்பற்றின்மையின் செயல்கள்’ என்ற சொற்சொல் மொழிபெயர்ப்பைவிட நவீன தமிழில் இயல்பாக உள்ளது; அதேவேளை ἀσεβείας என்பதன் பண்பைத் தக்கவைக்கிறது.
- source_word: ὧν ἠσέβησαν
  choice: இறைப்பற்றின்றிச் செய்த
  rationale: ἀσέβεια/ἀσεβέω என்ற ஒரே சொற்குடும்பத்தின் திட்டமிட்ட மறுபயன்பாட்டை ‘இறைப்பற்றற்ற ... இறைப்பற்றின்றி’ என்று முடிந்தவரைத் தக்கவைக்கிறது.
- source_word: σκληρῶν
  choice: கடுமையான சொற்கள்
  rationale: சொல்லாடல் சூழலில் σκληρός என்பது சொற்களின் கடுமை, எதிர்ப்பு அல்லது துணிகர அவமதிப்பைக் குறிக்கலாம். ‘கடுமையான சொற்கள்’ அந்தப் பொருள் பரப்பைச் சுருக்காமல் இயல்பாகத் தருகிறது.
- source_word: ἐλάλησαν κατ’ αὐτοῦ
  choice: அவருக்கு எதிராகப் பேசிய
  rationale: κατά என்பதன் எதிர்நிலையைத் தெளிவாகக் காட்டுகிறது; இறந்தகாலச் செயலைத் தமிழில் இயல்பான தொடர்பெயர் அமைப்பில் தருகிறது.
- source_word: αὐτοῦ
  choice: அவருக்கு
  rationale: மூலத்தின் பதிலிடுபெயரை வெளிப்படையான ‘ஆண்டவர்’ அல்லது ‘கடவுள்’ என்று விரிவாக்காமல் வைத்திருக்கிறது.
- source_word: ἁμαρτωλοὶ ἀσεβεῖς
  choice: இறைப்பற்றற்ற பாவிகள்
  rationale: இரு வலியுறுத்தும் அடைமொழிகளையும் காத்து, வசனமெங்கும் வரும் ἀσεβ- கருத்தை முன்னிலைப்படுத்துகிறது.
theological_decisions:
- issue: ‘அவருக்கு எதிராக’ என்பதிலுள்ள αὐτοῦ என்ற பதிலிடுபெயரின் குறிப்பு
  choice: முதன்மை உரையில் ‘அவருக்கு’ என்ற பதிலிடுபெயரையே வைத்தல்
  alternative: ‘ஆண்டவருக்கு எதிராக’ அல்லது ‘கடவுளுக்கு எதிராக’ என்று விரிவாக்குதல்
  rationale: முந்தைய வசனத்தின் சூழலில் இது ஆண்டவரைக் குறிக்கிறது. ஆனால் கிரேக்கம் பதிலிடுபெயரையே பயன்படுத்துவதால், தேவையற்ற விளக்கத்தை முதன்மை உரைக்குள் சேர்க்காமல் மூலத்தின் வடிவத்தையும் உள்ள தெளிவின்மையின் அளவையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடையைக் கொண்டுள்ளது. நீதித்துறைத் தொனிக்காக ‘தீர்ப்பை நிறைவேற்றுதல்’, ‘குற்றவாளிகள் என்று நிரூபித்தல்’ ஆகிய சொற்றொடர்கள் பயன்படுத்தப்பட்டுள்ளன. ἀσεβ- சொற்குடும்பத்தின் வலியுறுத்தலை ‘இறைப்பற்றற்ற/இறைப்பற்றின்றி’ என்ற மறுபயன்பாட்டால் இயன்றவரைத் தக்கவைத்துள்ளோம்; பழமையான ‘அவபக்தி’ தவிர்க்கப்பட்டுள்ளது.
