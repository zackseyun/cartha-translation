id: JUD.1.16
reference: Jude 1:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν γογγυσταί, μεμψίμοιροι, κατὰ τὰς ἐπιθυμίας ⸀αὐτῶν πορευόμενοι, καὶ τὸ στόμα αὐτῶν λαλεῖ ὑπέρογκα, θαυμάζοντες πρόσωπα ὠφελείας χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/016.yaml
  text: These are grumblers[a], malcontents, walking according to their own desires, and their mouth speaks arrogant things[c][b], showing favoritism for the sake of gain.
translation:
  language: ta
  text: இவர்கள் முணுமுணுப்பவர்கள், தங்கள் நிலையைப் பற்றிக் குறைகூறுபவர்கள், தங்களுடைய ஆசைகளின்படி வாழ்கிறவர்கள்[a]. இவர்களுடைய வாய் ஆணவமான சொற்களைப் பேசுகிறது[b]; ஆதாயத்திற்காக ஆட்களிடம் பாரபட்சம் காட்டுகிறவர்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்களுடைய இச்சைகளைப் பின்பற்றி நடக்கிறவர்கள்.”
    reason: alternative_reading
  - marker: b
    text: அல்லது, “இவர்களுடைய வாய் வீம்பான சொற்களைப் பேசுகிறது.”
    reason: lexical_alternative
  - marker: c
    text: சொற்சொல்லாக, “ஆதாயத்திற்காக முகங்களை வியக்கிறவர்கள்”; இது ஆட்களை முகஸ்துதி செய்வதையோ அவர்களுக்குச் சாதகமாகப் பாரபட்சம் காட்டுவதையோ குறிக்கும் மரபுத்தொடர்.
    reason: idiom_explanation
lexical_decisions:
- source_word: γογγυσταί
  choice: முணுமுணுப்பவர்கள்
  rationale: மனநிறைவின்மையால் தொடர்ந்து தாழ்ந்த குரலில் குறைகூறும் தன்மையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: μεμψίμοιροι
  choice: தங்கள் நிலையைப் பற்றிக் குறைகூறுபவர்கள்
  rationale: தங்களுக்கு அமைந்த நிலை அல்லது வாழ்க்கைப் பங்கு குறித்து அதிருப்தியுடன் புகார் கூறுவோர் என்பதே இந்த அரிய சொல்லின் குறிப்பான பொருள்; முந்தைய சொல்லுடன் உள்ள நுண்ணிய வேறுபாட்டையும் இது காக்கிறது.
- source_word: κατὰ τὰς ἐπιθυμίας αὐτῶν πορευόμενοι
  choice: தங்களுடைய ஆசைகளின்படி வாழ்கிறவர்கள்
  rationale: πορεύομαι இங்கு வாழ்க்கை நடத்தையைச் சுட்டுகிறது; ஆகவே சொற்சொல்லான ‘நடக்கிறவர்கள்’ என்பதற்குப் பதில் தெளிவான ‘வாழ்கிறவர்கள்’ பயன்படுத்தப்பட்டது. ἐπιθυμίαι என்பதன் பரந்த பொருளை ‘ஆசைகள்’ காக்கிறது.
- source_word: τὸ στόμα αὐτῶν λαλεῖ ὑπέρογκα
  choice: இவர்களுடைய வாய் ஆணவமானவற்றைப் பேசுகிறது
  rationale: கிரேக்கத்தில் உள்ள ஒருமை ‘வாய்’ உருவகத்தைத் தக்கவைத்து, ὑπέρογκα குறிக்கும் வீங்கிய, செருக்கான பேச்சை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: θαυμάζοντες πρόσωπα
  choice: ஆட்களிடம் பாரபட்சம் காட்டுகிறவர்கள்
  rationale: சொற்சொல்லாக ‘முகங்களை வியக்கிறவர்கள்’ என்றாலும், இந்த மரபுத்தொடர் தனிப்பட்ட ஆதாயத்திற்காக சிலருக்குச் சாதகமாக நடந்துகொள்வதைச் சுட்டுகிறது; ‘பாரபட்சம் காட்டுதல்’ அதன் நெறியியல் குற்றச்சாட்டைத் தெளிவாக்குகிறது.
- source_word: ὠφελείας χάριν
  choice: ஆதாயத்திற்காக
  rationale: செயலின் சுயநல நோக்கமாகிய நன்மை, இலாபம் அல்லது சாதகத்தைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: οὗτοί εἰσιν
  choice: இவர்கள்
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்டவர்களை நேரடியாக அடையாளப்படுத்தும் கிரேக்கத்தின் சுருக்கத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: ἐπιθυμίαι என்பதன் ஒழுக்கநெறிசார் வலிமை
  choice: முதன்மை உரையில் ‘ஆசைகள்’; எதிர்மறையான ஒழுக்கப் பொருளைச் சூழல் வழங்குகிறது
  alternative: இச்சைகள் / தீய வேட்கைகள்
  rationale: இந்தச் சொல் பொதுவாக வலுவான விருப்பங்களைக் குறிக்க முடியும்; இங்கு அவை சுயநலமானவை என்பது தெளிவு. ‘தீய வேட்கைகள்’ என மொழிபெயர்ப்பது பாலியல் அல்லது இன்னும் குறுகிய பொருளைத் தேவையின்றி சேர்க்கக்கூடும்.
- issue: θαυμάζοντες πρόσωπα என்ற மரபுத்தொடரின் பொருள்
  choice: ஆட்களிடம் பாரபட்சம் காட்டுதல்
  alternative: ஆட்களை முகஸ்துதி செய்தல் / முகங்களை வியத்தல்
  rationale: ஆதாய நோக்கத்துடன் நபர்களுக்குச் சாதகமாக நடந்துகொள்ளுதலே இங்கு மையம். ‘முகஸ்துதி’ சூழலுக்கு ஏற்ற சாத்தியமான நிழற்பொருள் என்றாலும், கிரேக்கம் அதை மட்டும் கட்டாயப்படுத்தாததால் பரந்த பொருள் முதன்மை உரையில் வைக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில் dignified ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டது. ‘முணுமுணுப்பவர்கள்’ மற்றும் ‘தங்கள் நிலையைப் பற்றிக் குறைகூறுபவர்கள்’ என்ற இணைச்சொற்கள் கிரேக்கத்தின் இரு வேறுபட்ட குற்றச்சாட்டுகளையும் காக்கின்றன. அரைப்புள்ளிகள் பட்டியலின் ஓட்டத்தையும் தொடர்புடைய கூறுகளின் அமைப்பையும் தெளிவாக்குகின்றன.
