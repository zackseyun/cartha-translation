id: JUD.1.11
reference: Jude 1:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐαὶ αὐτοῖς, ὅτι τῇ ὁδῷ τοῦ Κάϊν ἐπορεύθησαν, καὶ τῇ πλάνῃ τοῦ Βαλαὰμ μισθοῦ ἐξεχύθησαν, καὶ τῇ ἀντιλογίᾳ τοῦ Κόρε ἀπώλοντο.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/011.yaml
  text: Woe to them[a], because they have walked in the way of Cain, and have poured themselves out for pay into Balaam’s error, and have perished in Korah’s rebellion.
translation:
  language: ta
  text: அவர்களுக்கு ஐயோ! ஏனெனில் அவர்கள் காயீனின் வழியில் நடந்தார்கள்; ஆதாயத்திற்காக பிலேயாமின் வழிதவறுதலுக்குள் தம்மைத் தலைகுப்புறத் தள்ளிவிட்டார்கள்[a]; கோராவின் கலகத்தில் அழிந்துபோனார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பிலேயாமின் வழிதவறுதலுக்காகக் கூலியின் பேரில் தம்மை ஒப்படைத்தார்கள்.”
    reason: ἐξεχύθησαν என்ற கடினமான உருவக வினைக்கு இயல்பான பொருள்வழி மாற்றையும் μισθοῦ என்பதன் ‘கூலி’ என்ற நேரடிப் பொருளையும் காட்டுகிறது.
lexical_decisions:
- source_word: οὐαὶ αὐτοῖς
  choice: அவர்களுக்கு ஐயோ!
  rationale: தீர்ப்பை அறிவிக்கும் தீர்க்கதரிசனத் தொனியைத் தக்கவைக்கிறது; வெறும் இரக்கத்தைக் குறிக்கும் மென்மையான சொல்லாக்கத்தைத் தவிர்க்கிறது.
- source_word: τῇ ὁδῷ τοῦ Κάϊν ἐπορεύθησαν
  choice: காயீனின் வழியில் நடந்தார்கள்
  rationale: ὁδός என்பதன் நடத்தையைக் குறிக்கும் உருவகத்தையும் ἐπορεύθησαν என்பதன் நகர்வு சார்ந்த பொருளையும் இயல்பான தமிழில் ஒன்றாகத் தக்கவைக்கிறது.
- source_word: τῇ πλάνῃ τοῦ Βαλαὰμ
  choice: பிலேயாமின் வழிதவறுதலுக்குள்
  rationale: πλάνη குறிக்கக்கூடிய தவறு, வழிதவறல் ஆகிய பொருள்களில் உருவக நகர்வுக்கு ஏற்ற ‘வழிதவறுதல்’ தேர்ந்தெடுக்கப்பட்டது; ‘-க்குள்’ என்பது ἐξεχύθησαν உடன் உணரப்படும் திசைநகர்வைப் பிரதிபலிக்கிறது.
- source_word: μισθοῦ
  choice: கூலிக்காக
  rationale: ஊதியம் அல்லது பிரதிபலன் என்ற பொருளைத் தருவதோடு, பண ஆதாயத்திற்காகச் செயல்படும் நோக்கத்தையும் தெளிவாகக் காட்டுகிறது.
- source_word: ἐξεχύθησαν
  choice: தங்களையே ஊற்றிவிட்டார்கள்
  rationale: வினையின் ‘ஊற்றப்படுதல்/ஊற்றிவிடுதல்’ என்ற தெளிவான உருவகத்தைப் பாதுகாக்கிறது; கட்டுப்பாடின்றி தம்மை ஒப்புக்கொடுத்த உணர்வையும் கொண்டுள்ளது. இயல்பான பொருள்வழி மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τῇ ἀντιλογίᾳ τοῦ Κόρε
  choice: கோராகின் கலகத்தில்
  rationale: எண்ணாகமம் 16-ஐச் சுட்டும் பின்னணியில் ἀντιλογία என்பது வெறும் வாய்மொழி முரண்பாட்டை விட அதிகாரத்திற்கு எதிரான கலகத்தைக் குறிக்கிறது.
- source_word: ἀπώλοντο
  choice: அழிந்துபோனார்கள்
  rationale: அழிவு அல்லது கேடு அடைதல் என்ற முடிவுறு பொருளை இயல்பான, கடுமையான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Κάϊν / Βαλαὰμ / Κόρε
  choice: காயீன் / பிலேயாம் / கோராகு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவங்கள்; உருபேற்கும் இடங்களில் காயீனின், பிலேயாமின், கோராகின் என இயல்பாக அமைக்கப்பட்டன.
theological_decisions:
- issue: καὶ τῇ πλάνῃ τοῦ Βαλαὰμ μισθοῦ ἐξεχύθησαν என்ற சுருக்கமான உருவகத் தொடரை எவ்வாறு மொழிபெயர்ப்பது
  choice: கூலிக்காக பிலேயாமின் வழிதவறுதலுக்குள் தங்களையே ஊற்றிவிட்டார்கள்
  alternative: ஆதாயத்திற்காக பிலேயாமின் வழிதவறுதலுக்குள் தலைகுப்புறப் பாய்ந்தார்கள்
  rationale: முதன்மை வாசகம் ἐξεχύθησαν என்பதிலுள்ள ‘ஊற்றுதல்’ உருவகத்தையும் μισθοῦ காட்டும் கூலி நோக்கத்தையும் பாதுகாக்கிறது. கிரேக்கத் தொடரின் கடினத்தன்மையை ஒரே விளக்கத்தால் தீர்த்துவிடாமல், அதிக இயல்பான பொருள்வழி வாசகம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான தீர்க்கதரிசனத் தொனி பயன்படுத்தப்பட்டுள்ளது. மூன்று பழைய ஏற்பாட்டு எடுத்துக்காட்டுகளின் இணை அமைப்பு அரைப்புள்ளிகளால் தெளிவாக்கப்பட்டுள்ளது; கடினமான பிலேயாம் தொடர் திட்டமிட்டு உருவகத்தோடு வைக்கப்பட்டுள்ளது.
