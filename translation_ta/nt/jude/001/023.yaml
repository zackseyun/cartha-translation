id: JUD.1.23
reference: Jude 1:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὓς δὲ σῴζετε ἐκ πυρὸς ἁρπάζοντες, οὓς δὲ ἐλεᾶτε ἐν φόβῳ⸃, μισοῦντες καὶ τὸν ἀπὸ τῆς σαρκὸς ἐσπιλωμένον χιτῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/023.yaml
  text: save others by snatching them out of the fire[a]; and have mercy on others with fear[d][c][b], hating even the tunic stained by the flesh.
translation:
  language: ta
  text: வேறு சிலரை நெருப்பிலிருந்து பிடுங்கிக் காப்பாற்றுங்கள்[a]. மாம்சத்தால் கறைபட்ட ஆடையைக்கூட வெறுத்துக்கொண்டே, வேறு சிலருக்குப் பயத்தோடு இரக்கம் காட்டுங்கள்[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வேறு சிலரை நெருப்பிலிருந்து பிடுங்கி மீட்குங்கள்.” இங்குள்ள நெருப்பு வரவிருக்கும் நியாயத்தீர்ப்பையோ கடுமையான ஆன்மிக ஆபத்தையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: “பயத்தோடு” என்பது தேவனுக்கு முன்பான பயபக்தியையோ, தாங்களும் தீட்டுப்படாதிருக்க வேண்டிய எச்சரிக்கையான அச்சத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “மாம்சம்” என்பது இங்கு பாவத்தோடு தொடர்புடைய மனித இயல்பைக் குறிக்கலாம். “ஆடை” என்பதற்கான கிரேக்கச் சொல் உடலோடு அணியும் உள் ஆடையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: σῴζετε
  choice: காப்பாற்றுங்கள்
  rationale: கட்டளைப் பொருளையும் இரட்சித்தல்/ஆபத்திலிருந்து மீட்டல் என்ற பரந்த வலிமையையும் தக்கவைக்கிறது; நெருப்பிலிருந்து பிடுங்கும் உருவகத்துக்கும் இயல்பாகப் பொருந்துகிறது.
- source_word: ἐκ πυρὸς ἁρπάζοντες
  choice: நெருப்பிலிருந்து பிடுங்கி
  rationale: ἁρπάζω என்பதிலுள்ள வலுக்கட்டாயமான, அவசரமான மீட்புச் செயலை ‘பிடுங்கி’ தெளிவாக வெளிப்படுத்துகிறது; ἐκ என்பதன் ‘உள்ளிருந்து வெளியே’ என்ற இயக்கமும் தக்கவைக்கப்படுகிறது.
- source_word: ἐλεᾶτε
  choice: இரக்கம் காட்டுங்கள்
  rationale: இன்றைய தரநிலைத் தமிழில் இயல்பான கட்டளை வடிவம்; இரக்கத்துடன் நடத்துதல் என்ற செயற்பொருளை நேரடியாகத் தருகிறது.
- source_word: ἐν φόβῳ
  choice: பயத்தோடு
  rationale: தேவனைப் பற்றிய பயபக்தியா அல்லது தானும் தீட்டுப்படாதிருக்க வேண்டிய எச்சரிக்கையான அச்சமா என்பதைத் தீர்மானிக்காமல் கிரேக்கத்தின் சுருக்கத்தையும் இருபொருள் வாய்ப்பையும் காக்கிறது.
- source_word: μισοῦντες
  choice: வெறுங்கள்
  rationale: இரக்கம் காட்டும்போதும் பாவத் தீட்டை உறுதியாக நிராகரிக்க வேண்டும் என்ற கிரேக்கத்தின் கூர்மையான எதிர்மறை அணுகுமுறையைத் தக்கவைக்கிறது.
- source_word: χιτῶνα
  choice: உடை
  rationale: χιτών குறிப்பாக உடலோடு அணியும் உள் ஆடையைக் குறித்தாலும், ‘உடை’ என்பது சாதாரண வாசகருக்கு இயல்பாக இருந்து கறைபடும் ஆடை என்ற உருவகத்தைத் தெளிவாகக் காக்கிறது; குறிப்பான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐσπιλωμένον
  choice: கறைபட்ட
  rationale: ஆடையின் நேரடி கறையையும் ஒழுக்கத் தீட்டின் உருவகத்தையும் ஒரே நேரத்தில் வெளிப்படுத்துகிறது; முடிவுற்று நிலைத்திருக்கும் நிலையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: σάρξ
  choice: மாம்சம்
  rationale: ஒழுக்கச் சீரழிவைச் சுட்டும் உருவகப் பயன்பாடு என்றாலும், ‘பாவ இயல்பு’ என்று விளக்கி முடிவுசெய்யாமல் மூலத்தின் உடல்/மாம்ச உருவகத்தையும் அதன் இறையியல் அழுத்தத்தையும் காக்கிறது.
theological_decisions:
- issue: ‘நெருப்பு’ உருவகத்தின் குறிப்பு
  choice: முதன்மை உரையில் ‘நெருப்பு’ என்று வரையறுக்காமல் வைத்தல்
  alternative: வரவிருக்கும் நியாயத்தீர்ப்பு அல்லது தற்போதைய கடுமையான ஆன்மிக ஆபத்து என்று வெளிப்படையாக விளக்குதல்
  rationale: உருவகம் தீவிரமான ஆபத்தையும் அவசர மீட்பையும் உணர்த்துகிறது; ஆனால் அதன் குறிப்பு என்ன என்பதை வசனம் தானே முடிவுசெய்யவில்லை.
- issue: ἐν φόβῳ என்பதன் இறையியல் நுணுக்கம்
  choice: ‘பயத்தோடு’ என்று இருபொருள் வாய்ப்பைத் தக்கவைத்தல்
  alternative: ‘தேவபயத்தோடு’ அல்லது ‘எச்சரிக்கையோடு’
  rationale: தேவனுக்கு முன்பான பயபக்தியும் தீட்டிலிருந்து தன்னைக் காத்துக்கொள்ளும் எச்சரிக்கையும் இரண்டும் சூழலில் சாத்தியம்; ஒன்றை மட்டும் முதன்மை உரையில் தேர்ந்தெடுப்பது அளவுக்கு மீறிய விளக்கமாகும்.
- issue: σάρξ என்பதன் பொருள்
  choice: ‘மாம்சம்’ என்ற மூல உருவகத்தை வைத்தல்
  alternative: ‘பாவ இயல்பு’
  rationale: இங்கு ஒழுக்கத் தீட்டு நோக்கப்பட்டாலும், ‘பாவ இயல்பு’ என்பது விளக்கமான இறையியல் சொல்; ‘மாம்சம்’ மூலத்தின் நெருக்கத்தையும் உண்மையான பொருள் இழுப்பையும் காக்கிறது.
- issue: இரக்கம் மற்றும் வெறுப்பு இடையிலான தொடர்பு
  choice: மனிதருக்கு இரக்கம் காட்டிக்கொண்டே அவர்களைத் தீட்டும் பாவத்தை வெறுக்கும் இணைந்த நிலைப்பாடாக மொழிபெயர்த்தல்
  alternative: இரண்டு தொடர்பற்ற தனிக் கட்டளைகளாக அமைத்தல்
  rationale: μισοῦντες என்ற நிகழ்காலப் பங்கேற்புவினை ἐλεᾶτε என்ற கட்டளையுடன் இணைந்து, இரக்கம் காட்டும் முறையோடு பாவத் தீட்டின் மீதான வெறுப்பையும் சேர்த்துக் காட்டுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகருக்கு எளிதாகவும் வேதவாக்கியத்திற்குரிய கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘பிடுங்கி’ அவசரத்தையும், ‘மாம்சம்’ மூல உருவகத்தையும் காக்கின்றன. கிரேக்கப் பங்கேற்புவினையின் தொடர்பை இயல்பான தமிழில் காட்ட ‘அப்படிச் செய்யும்போது’ பயன்படுத்தப்பட்டுள்ளது.
