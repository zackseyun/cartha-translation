id: JUD.1.21
reference: Jude 1:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἑαυτοὺς ἐν ἀγάπῃ θεοῦ τηρήσατε προσδεχόμενοι τὸ ἔλεος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/021.yaml
  text: keep yourselves in the love of God[c][b][a], waiting for the mercy of our Lord Jesus the Messiah unto eternal life.
translation:
  language: ta
  text: தேவனுடைய அன்பில்[a] உங்களைக் காத்துக்கொள்ளுங்கள்; நித்திய வாழ்வை நோக்கி[c], நம் ஆண்டவராகிய இயேசு மெசியாவின்[b] இரக்கத்தை எதிர்நோக்கியிருங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தேவனுடைய அன்பில்’ என்பது தேவன் காட்டும் அன்பைக் குறிக்கலாம்; ‘தேவன்மீது கொண்ட அன்பில்’ என்றும் கிரேக்கத்தைப் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: கிரேக்கத்தில் ‘இயேசு கிறிஸ்து’; Χριστός ஒரு பட்டமாகக் கருதப்படுவதால் இங்கு ‘இயேசு மெசியா’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: ‘நித்திய வாழ்வுக்காக’ அல்லது ‘நித்திய வாழ்வுக்குள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρήσατε
  choice: உங்களைக் காத்துக்கொள்ளுங்கள்
  rationale: இது இரண்டாம் நபர் பன்மை நேரடிக் கட்டளை. செயப்படுபொருள் ‘உங்களையே’ என்பதையும், தொடர்ந்து அந்த நிலையில் நிலைத்திருக்க வேண்டிய அழைப்பையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐν ἀγάπῃ θεοῦ
  choice: தேவனுடைய அன்பில்
  rationale: ἀγάπη என்பதற்கு ‘அன்பு’ இயல்பான இணை. θεοῦ என்ற உரிமை வேற்றுமை தேவன் காட்டும் அன்பையோ, தேவனை நோக்கிய அன்பையோ குறிக்கக்கூடும்; ‘தேவனுடைய அன்பில்’ அந்தத் தெளிவின்மையைத் தக்கவைக்கிறது.
- source_word: προσδεχόμενοι
  choice: எதிர்நோக்கியிருங்கள்
  rationale: நிகழ்காலப் பங்கேற்புவினை, பிரதான கட்டளையுடன் தொடரும் எதிர்பார்ப்பைச் சுட்டுகிறது. தமிழில் கட்டளை வடிவில் இணைப்பது இயல்பான வாக்கிய ஓட்டத்தையும் தொடர்ச்சியான மனநிலையையும் தருகிறது.
- source_word: ἔλεος
  choice: இரக்கம்
  rationale: துன்பப்படுவோர்மீது காட்டப்படும் கருணையையும் அருளுள்ள தயவையும் குறிக்கும் வழக்கமான, இயல்பான தமிழ் சொல்.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: புதிய ஏற்பாட்டு κύριος என்பதன் அதிகாரத்தையும் மரியாதையையும் இயல்பாக வெளிப்படுத்தும் நிலையான தமிழ் இணை.
- source_word: Ἰησοῦ Χριστοῦ
  choice: மெசியா இயேசு
  rationale: Χριστός இங்கு பெயராக மட்டும் அல்லாமல் பட்டமாகவும் செயல்படுவதால் அதன் பட்டப்பொருளை ‘மெசியா’ என வெளிப்படுத்துகிறது; தமிழில் பட்டம் பெயருக்கு முன் வருவது இயல்பானது.
- source_word: εἰς ζωὴν αἰώνιον
  choice: நித்திய வாழ்வை நோக்கி
  rationale: εἰς குறிக்கும் இலக்கு அல்லது முடிவை அதிக விளக்கச் சேர்க்கையின்றி வெளிப்படுத்துகிறது. ζωὴ αἰώνιος என்பதற்கு ‘நித்திய வாழ்வு’ தெளிவான, மரியாதையான இணை.
theological_decisions:
- issue: ἀγάπῃ θεοῦ என்பதில் உள்ள உரிமை வேற்றுமையின் பொருள்
  choice: ‘தேவனுடைய அன்பில்’ என்று இருபொருள் வாய்ப்பையும் தக்கவைத்தல்
  alternative: ‘தேவன் உங்கள்மீது வைத்துள்ள அன்பில்’ அல்லது ‘தேவன்மீது நீங்கள் கொண்ட அன்பில்’ என்று ஒரு பொருளைத் தீர்மானித்தல்
  rationale: கிரேக்கத் தொடர் இரு தொடர்புகளுக்கும் இடமளிக்கிறது; உடனடிச் சூழல் ஒன்றை மட்டும் கட்டாயப்படுத்தாததால் மூலத்தின் இறையியல் பதற்றம் தீர்க்கப்படாமல் வைக்கப்படுகிறது.
- issue: Χριστοῦ என்பதன் பட்டத்தன்மை
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: Χριστός என்பதன் பட்டப்பொருளை வாசகருக்குத் தெரிவிக்க ‘மெசியா’ பயன்படுத்தப்படுகிறது; அடிக்குறிப்பு பாரம்பரிய ‘கிறிஸ்து’ வடிவையும் மூலச் சொல்லையும் பதிவு செய்கிறது.
- issue: εἰς ζωὴν αἰώνιον என்பதன் தொடர்பு
  choice: நித்திய வாழ்வை நோக்கி
  alternative: நித்திய வாழ்வுக்காக அல்லது நித்திய வாழ்வுக்குள்
  rationale: εἰς இலக்கு, முடிவு, பயன் ஆகிய நெருங்கிய பொருட்களை ஏற்கக்கூடும். ‘நோக்கி’ அதன் முன்னோக்கிய இயக்கத்தைப் பாதுகாத்து காரணவிளக்கத்தைச் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் மரியாதையான நடை பயன்படுத்தப்பட்டுள்ளது. பிரதான கிரேக்கக் கட்டளையையும் அதனுடன் வரும் தொடர்ச்சியான எதிர்பார்ப்பையும் இரண்டு இணைந்த கட்டளை வடிவங்களால் இயல்பாக்கியுள்ளது. மூலத்தில் உள்ள உரிமை வேற்றுமை மற்றும் εἰς தொடர்பின் தெளிவின்மை அடிக்குறிப்புகளுடன் பாதுகாக்கப்பட்டுள்ளது.
