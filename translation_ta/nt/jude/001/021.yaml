  source_fidelity: முதன்மைக் கட்டளையான τηρήσατε, தெளிவின்மையுள்ள ἐν ἀγάπῃ θεοῦ, உடன்வரும் προσδεχόμενοι, மற்றும் εἰς ζωὴν αἰώνιον ஆகியவை வரைவு உரையில் மொத்தத்தில் உண்மையுடன் வெளிப்பட்டுள்ளன. ஆனால் Ἰησοῦ Χριστοῦ என்பதற்கான ‘மெசியா இயேசு’ என்ற சொல் வரிசை தமிழில் பெயரை விட பட்டத்தை முன்னிறுத்தி, மூலத்தின் ‘இயேசு ... மெசியா’ என்ற பெயர்-பட்ட இணைப்பைத் தேவையின்றி மாற்றுகிறது.
