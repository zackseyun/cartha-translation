id: JUD.1.6
reference: Jude 1:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀγγέλους τε τοὺς μὴ τηρήσαντας τὴν ἑαυτῶν ἀρχὴν ἀλλὰ ἀπολιπόντας τὸ ἴδιον οἰκητήριον εἰς κρίσιν μεγάλης ἡμέρας δεσμοῖς ἀϊδίοις ὑπὸ ζόφον τετήρηκεν·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/006.yaml
  text: And the angels who did not keep their own domain[a], but abandoned their proper dwelling[c][b], he has kept in eternal chains under gloom for the judgment of the great day.
translation:
  language: ta
  text: தங்களுக்குரிய நிலையைக்[a] காத்துக்கொள்ளாமல், தங்களுக்கே உரிய உறைவிடத்தை[b] விட்டுவிட்ட தூதர்களையும் அவர் மாபெரும் நாளின் நியாயத்தீர்ப்புக்காக நித்தியச் சங்கிலிகளில் காரிருளின் கீழ்[c] காத்துவைத்திருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தங்களுக்குரிய அதிகார நிலையை’; அல்லது, ‘தங்களுக்குரிய ஆட்சியை.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தங்களுடைய சொந்த வாழ்விடத்தை.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘ஆழ்ந்த இருளின் கீழ்.’ கிரேக்கச் சொல் அடர்ந்த இருளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλους
  choice: தூதர்கள்
  rationale: இந்த நியாயத்தீர்ப்புச் சூழலில் இது மனிதத் தூதுவர்களை அல்ல, வானுலக ஆவிக்குரிய உயிர்களைக் குறிக்கிறது.
- source_word: τηρήσαντας / τετήρηκεν
  choice: காத்துக்கொள்ளாமல் / காத்துவைத்திருக்கிறார்
  rationale: 'ஒரே கிரேக்க வினைச்சொல்லின் மீளுரைப்பையும் முரணையும் முடிந்தவரை பேணுகிறது: அவர்கள் தங்களுக்குரிய நிலையை காத்துக்கொள்ளவில்லை; ஆகவே அவர் அவர்களை நியாயத்தீர்ப்புக்காக காத்துவைத்திருக்கிறார்.'
- source_word: τὴν ἑαυτῶν ἀρχὴν
  choice: தங்களுக்குரிய அதிகார நிலை
  rationale: ἀρχή என்பது அதிகாரம், பதவி அல்லது ஒதுக்கப்பட்ட செயல்பாட்டுக் களம் ஆகியவற்றைக் குறிக்கக்கூடும். ‘அதிகார நிலை’ அதன் அதிகார மற்றும் நிலை சார்ந்த பொருள்களைப் பேணுகிறது; ‘தொடக்கம்’ என்ற இச்சூழலுக்குப் பொருந்தாத வாசிப்பைத் தவிர்க்கிறது.
- source_word: ἀπολιπόντας
  choice: விட்டுவிட்ட
  rationale: அவர்கள் தங்களுக்குரிய உறைவிடத்திலிருந்து பொறுப்புடன் விலகிய செயலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: τὸ ἴδιον οἰκητήριον
  choice: தங்களுக்கே உரிய உறைவிடம்
  rationale: ἴδιον என்பதிலுள்ள தனிப்பட்ட உரிமை அல்லது பொருத்தத்தை ‘தங்களுக்கே உரிய’ என்பதும், οἰκητήριον என்பதிலுள்ள வசிப்பிடப் பொருளை ‘உறைவிடம்’ என்பதும் வெளிப்படுத்துகின்றன.
- source_word: εἰς κρίσιν μεγάλης ἡμέρας
  choice: மாபெரும் நாளின் நியாயத்தீர்ப்புக்காக
  rationale: εἰς என்பதின் நோக்கு அல்லது நோக்கப் பொருளைப் பேணி, இறுதி நியாயத்தீர்ப்பைச் சுட்டும் மரபுத்தொடரை இயல்பான தமிழில் தருகிறது; ‘வரை’ என்று கால எல்லையை மட்டும் பொருளாக்கவில்லை.
- source_word: δεσμοῖς ἀϊδίοις
  choice: நித்தியச் சங்கிலிகளில்
  rationale: δεσμοῖς என்பதின் கட்டுப்படுத்தும் உருவகத்தை ‘சங்கிலிகள்’ தெளிவாகக் காட்டுகிறது; ἀϊδίοις என்பதின் நிலையான நீடிப்பை ‘நித்திய’ தெரிவிக்கிறது.
- source_word: ὑπὸ ζόφον
  choice: காரிருளின்கீழ்
  rationale: ζόφος சாதாரண இருளைவிட ஆழ்ந்த, அச்சமூட்டும் இருளைக் குறிக்கிறது. ‘காரிருள்’ அந்த வலிமையைத் தருகிறது; ‘கீழ்’ ὑπό என்ற முன்னிடைச்சொல்லின் உருவகத்தைப் பேணுகிறது.
- source_word: τε
  choice: -ஐயும்
  rationale: முந்தைய நியாயத்தீர்ப்பு எடுத்துக்காட்டுடன் இதையும் இணைக்கும் τε-யின் தொடர்ச்சிப் பொருளைத் தமிழின் இணைப்பு வேற்றுமை உருபு இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தூதர்களின் மீறுதலின் தன்மை
  choice: தூதர்கள் தங்களுக்குரிய அதிகார நிலையைக் காத்துக்கொள்ளாமல், தங்களுக்கே உரிய உறைவிடத்தை விட்டுவிட்டதாக மட்டும் மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: இது ஆதியாகமம் 6 மரபைக் குறிப்பதாகவோ, பொதுவான ஆதிகாலத் தூதர் வீழ்ச்சியைக் குறிப்பதாகவோ வெளிப்படையாக விளக்குதல்.
  rationale: யூதா வாசகர்களுக்குத் தெரிந்த ஒரு யூத மரபை நினைவூட்டியிருக்கலாம்; ஆனால் இவ்வசனத்தின் கிரேக்க உரை அந்தப் பின்னணியை விரிவாக வரையறுக்கவில்லை. ஆகவே மொழிபெயர்ப்பு அந்தத் தெளிவின்மையையும் இறையியல் இழுவிசையையும் பேணுகிறது.
- issue: ἀΐδιος என்பதின் வலிமை
  choice: நித்திய
  alternative: என்றென்றுமுள்ள; நிரந்தரமான
  rationale: இச்சொல் முடிவில்லாத அல்லது நிலையாக நீடிக்கும் தன்மையைத் தெரிவிக்கிறது. ‘நித்திய’ என்பது தெளிவான, வழக்கமான தமிழ் இணை; சங்கிலிகளின் தன்மை குறித்து உரைக்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: τετήρηκεν என்பதின் மறைமுக எழுவாய்
  choice: அவர்
  alternative: கடவுள்
  rationale: கிரேக்கத்தில் வினையின் எழுவாய் வெளிப்படையாக மீண்டும் சொல்லப்படவில்லை. ‘அவர்’ என்று தருவது முந்தைய சூழலின் எழுவாயைத் தொடரச் செய்து, இவ்வசனத்திற்குள் ‘கடவுள்’ என்ற பெயரை விளக்கமாகச் சேர்ப்பதைத் தவிர்க்கிறது.
