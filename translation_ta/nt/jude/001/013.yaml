base_translation:
  language: en
  yaml_path: translation/nt/jude/001/013.yaml
  text: wild waves of the sea[a], foaming up their own shames; wandering stars[b], for whom the gloom of darkness has been reserved forever.
translation:
  language: ta
  text: அடங்காத கடல் அலைகள், தங்கள் அவமானங்களை நுரைத்தெழச் செய்கின்றவை; அலைந்து திரியும் நட்சத்திரங்கள்; இவர்களுக்காக இருளின் காரிருள் என்றென்றைக்கும் ஒதுக்கிவைக்கப்பட்டுள்ளது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘இருளின் கருமை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύματα ἄγρια θαλάσσης
  choice: கடலின் கொந்தளிப்பான அலைகள்
  rationale: ἄγρια என்பது அடங்காத, மூர்க்கமான தன்மையை உணர்த்துகிறது. நவீனத் தமிழில் இயல்பாகவும் உருவகத்தின் தீவிரத்தைத் தக்கவைக்கவும் ‘கொந்தளிப்பான’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ἐπαφρίζοντα τὰς ἑαυτῶν αἰσχύνας
  choice: தங்களுடைய அவமானங்களை நுரையாகப் பொங்கவிடுகிறவர்கள்
  rationale: ἐπαφρίζοντα என்பதன் நுரை எழச்செய்யும் செயற்பாட்டையும், ἑαυτῶν என்பதன் தன்வலியுறுத்தலையும், αἰσχύνας என்பதன் குறிப்பிடத்தக்க பன்மையையும் பாதுகாக்கிறது. ‘அவமானங்கள்’ என்பது இழிவையும் அவமானகரமான செயல்களையும் குறிக்கக்கூடிய மூலத்தின் பொருள் விரிவைத் திறந்தே வைக்கிறது.
- source_word: ἀστέρες πλανῆται
  choice: வழிதவறி அலையும் நட்சத்திரங்கள்
  rationale: πλανῆται என்பதில் அலைதல் மற்றும் நெறிதவறுதல் ஆகிய இரு நிழற்பொருள்களும் உள்ளன. ‘கோள்கள்’ என்ற நவீன வானியல் துல்லியத்தைத் திணிக்காமல் மனிதர்களைக் குறிக்கும் உருவகத்தை இது தெளிவாக்குகிறது.
- source_word: ὁ ζόφος τοῦ σκότους
  choice: இருளின் காரிருள்
  rationale: ζόφος மற்றும் σκότος இணைந்து தரும் அடர்ந்த, அச்சமூட்டும் இருளின் தீவிரத்தைத் தக்கவைக்கிறது; மூலத்தின் பெயர்ச்சொல் உறவையும் பிரதிபலிக்கிறது.
- source_word: εἰς αἰῶνα
  choice: என்றென்றைக்கும்
  rationale: இந்த நியாயத்தீர்ப்பு சூழலில் நீடித்த, முடிவற்ற காலத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τετήρηται
  choice: ஒதுக்கிவைக்கப்பட்டுள்ளது
  rationale: நிறைவுற்ற செயலில் விளைந்த தற்போதைய நிலையைச் சுட்டும் perfect passive வடிவத்தை வெளிப்படுத்துகிறது; இங்கு தண்டனை குறிப்பிட்டவர்களுக்காகச் சேமித்து வைக்கப்பட்டிருப்பதையும் இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: εἰς αἰῶνα என்பதில் இறுதித் தீர்ப்பின் காலநீளம்
  choice: என்றென்றைக்கும்
  alternative: யுகத்திற்காக
  rationale: இந்தத் தீர்ப்பு உருவகத்தின் சூழலில் இச்சொற்றொடர் இயல்பாக முடிவற்ற நீடிப்பைக் குறிக்கிறது. அதற்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல் எச்சரிக்கையின் வலிமை பாதுகாக்கப்படுகிறது.
- issue: αἰσχύνας என்பது அவமான நிலையா அல்லது அவமானகரமான செயல்களா
  choice: அவமானங்களை
  alternative: அவமானகரமான செயல்களை
  rationale: மூலத்தின் பன்மையைப் பாதுகாத்து, இழிவு மற்றும் அதை வெளிப்படுத்தும் செயல்கள் ஆகிய இரு சாத்தியங்களையும் தீர்மானிக்காமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவித்துவமும் தீர்ப்பின் கடுமையும் காக்கப்பட்டுள்ளன. இது முந்தைய வசனத்திலிருந்து தொடரும் பெயர்ச்சொல் உருவகத் தொடராக இருப்பதால் முதல் பகுதியில் முழுமையான வினைமுற்று சேர்க்கப்படவில்லை; பங்கேற்புச் சொல்லின் மனிதக் குறிப்பு மட்டும் ‘கிறவர்கள்’ மூலம் தெளிவாக்கப்பட்டுள்ளது.
