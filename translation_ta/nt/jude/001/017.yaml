id: JUD.1.17
reference: Jude 1:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὑμεῖς δέ, ἀγαπητοί, μνήσθητε τῶν ῥημάτων τῶν προειρημένων ὑπὸ τῶν ἀποστόλων τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/017.yaml
  text: But you[a], beloved, remember the words spoken beforehand by the apostles of our Lord Jesus the Messiah.
translation:
  language: ta
  text: ஆனால், அன்புக்குரியவர்களே, நீங்கள் நம்முடைய ஆண்டவராகிய இயேசு மேசியாவின் அப்போஸ்தலர்கள் முன்பே சொன்ன வார்த்தைகளை நினைவுகூருங்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς δέ
  choice: ஆனால் … நீங்கள் (வினைமுற்றில் வெளிப்படும்)
  rationale: δέ-யின் எதிர்மறை மாற்றத்தையும், Ὑμεῖς தரும் வலியுறுத்தலையும் இயல்பான தமிழ் அழைப்புத் தொடரால் காட்டுகிறது; முந்தைய வசனங்களில் கூறப்பட்டவர்களிலிருந்து வாசகர்களை வேறுபடுத்துகிறது.
- source_word: ἀγαπητοί
  choice: அன்புக்குரியவர்களே
  rationale: அன்பும் மரியாதையும் கொண்ட பன்மை விளிப்பை, இன்றைய வாசகர்களுக்குப் புரியும் கண்ணியமான தமிழில் தருகிறது.
- source_word: μνήσθητε
  choice: நினைவுகூருங்கள்
  rationale: முன்பு கற்பிக்கப்பட்டதை மீண்டும் மனத்தில் கொண்டுவரும்படி சொல்லும் கட்டளையின் நேரடியான பொருளைப் பாதுகாக்கிறது.
- source_word: τῶν ῥημάτων
  choice: வார்த்தைகளை
  rationale: இங்கு ῥήματα என்பது வாய்மொழியாகச் சொல்லப்பட்ட கூற்றுகளைக் குறிக்கிறது; தொடர்ந்து வரும் ‘சொன்ன’ என்பதுடன் இயல்பாக இணைகிறது.
- source_word: τῶν προειρημένων
  choice: முன்பே சொன்ன
  rationale: προλέγω என்பதன் கால முன்னுரிமையைத் தெளிவாகக் காட்டுகிறது; ‘முன்னறிவித்த’ என்று மொழிபெயர்த்து தீர்க்கதரிசன முன்னறிவிப்பு என்ற பொருளைத் தேவையின்றி மிகைப்படுத்தவில்லை.
- source_word: ὑπὸ τῶν ἀποστόλων
  choice: அப்போஸ்தலர்கள்
  rationale: செயப்பாட்டு கிரேக்கத் தொடரை இயல்பான தமிழ் செய்வினைத் தொடராக மாற்றுகிறது; ἀπόστολοι என்பதற்கான பரவலாக அறியப்பட்ட வேதாகமச் சொல்லைப் பயன்படுத்துகிறது.
- source_word: τοῦ κυρίου ἡμῶν
  choice: நம்முடைய ஆண்டவராகிய
  rationale: κύριος என்பதன் அதிகாரம் மற்றும் மரியாதையை ‘ஆண்டவர்’ பாதுகாக்கிறது; தமிழ் பெயர்த் தொடரில் உறவை இயல்பாக இணைக்க ‘ஆகிய’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: மேசியா இயேசு
  rationale: Χριστός என்பதன் அபிஷேகம் பெற்ற அரசர் என்ற பட்டப்பொருளை ‘மேசியா’ வெளிப்படுத்துகிறது; தமிழில் இயல்பான பட்டம்–பெயர் வரிசையில் அமைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ என்பதில் Χριστοῦ-வை மொழிபெயர்த்தல்
  choice: மேசியா இயேசு
  alternative: இயேசு கிறிஸ்து
  rationale: Χριστός இங்கு இயேசுவின் மேசியாப் பட்டத்தைத் தாங்குவதால் அதன் பொருளை ‘மேசியா’ என்று வெளிப்படுத்துகிறது. தமிழ்க் கிறிஸ்தவ வழக்கில் நிலைபெற்ற ‘கிறிஸ்து’ வடிவமும் சாத்தியமானதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. கிரேக்கத்தின் செயப்பாட்டு அமைப்பு இயல்பான தமிழ் செய்வினை அமைப்பாக மாற்றப்பட்டுள்ளது; ஆனால் கருத்துறவு மற்றும் கால முன்னுரிமை காக்கப்பட்டுள்ளன. ‘அப்போஸ்தலர்கள்’ என்பது சமயச் சூழலில் பரவலாக அறியப்பட்ட தொழில்நுட்பச் சொல் என்பதால் தக்கவைக்கப்பட்டுள்ளது.
