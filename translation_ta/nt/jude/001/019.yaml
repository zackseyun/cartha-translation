    issue: “உலகப்போக்கானவர்கள்” for ψυχικοί is semantically narrower and potentially misleading.
    rationale: ψυχικοί refers to people characterized by merely natural life, in contrast to possessing the Spirit; it does not itself use the Greek vocabulary for ‘world’ or ‘worldliness.’
  - severity: low
    issue: “தூய ஆவி” is less standard than “பரிசுத்த ஆவி” in Tamil biblical register.
    rationale: The contextual identification of πνεῦμα as the Holy Spirit is defensible, and the conventional term improves consistency and reader recognition while the note retains the source-level ambiguity.
