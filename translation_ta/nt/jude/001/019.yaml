source:
  edition: SBLGNT
  text: οὗτοί εἰσιν οἱ ἀποδιορίζοντες, ψυχικοί, πνεῦμα μὴ ἔχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/019.yaml
  text: These are the ones who cause divisions[a], worldly people[c][b], not having the Spirit.
translation:
  language: ta
  text: இவர்கள்தான் பிரிவுகளை உண்டாக்குகிறவர்கள்[a]; இயற்கை மனப்போக்குடையவர்கள்[b], பரிசுத்த ஆவியைக் கொண்டிராதவர்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்களைத் தனியே பிரித்துக்கொள்கிறவர்கள்” அல்லது “பிரிவுகளை ஏற்படுத்துகிறவர்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உலகப்போக்கானவர்கள்” அல்லது “ஆவிக்குரியவர்களல்லாதவர்கள்.”
    reason: lexical_alternative
  - marker: c
    text: மூலமொழியில் “ஆவி” என்று உள்ளது. சூழலில் இது பெரும்பாலும் பரிசுத்த ஆவியைக் குறிக்கிறது; மனித ஆவியைக் குறிக்கும் வாய்ப்பும் சொல்லளவில் உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοί
  choice: இவர்கள்தான்
  rationale: முந்தைய வசனங்களில் குறிப்பிடப்பட்ட நபர்களைச் சுட்டுகிறது; வலியுறுத்தும் கிரேக்க அமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οἱ ἀποδιορίζοντες
  choice: பிரிவுகளை உண்டாக்குகிறவர்கள்
  rationale: இவர்கள் தங்களைத் தனியே பிரித்துக்கொள்கிறார்கள் என்றும் மற்றவர்களிடையே பிளவை ஏற்படுத்துகிறார்கள் என்றும் பொருள்கொள்ளக்கூடிய சொல். சூழலில் அவர்களுடைய பிளவுண்டாக்கும் செயலே முதன்மையாகத் தெரிகிறது.
- source_word: ψυχικοί
  choice: உலகப்போக்கானவர்கள்
  rationale: தூய ஆவியால் வழிநடத்தப்படாமல் இயற்கையான மனித உந்துதல்களுக்கு உட்பட்டவர்களைக் குறிக்கும் சொல்லைச் சாதாரண வாசகர்கள் புரிந்துகொள்ளும் வகையில் தருகிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: πνεῦμα
  choice: தூய ஆவி
  rationale: ψυχικοί என்பதுடனான உடனடி முரண்பாடும் யூதாவின் சூழலும் இங்கு தூய ஆவியைக் குறிப்பதே மிகச் சாத்தியம் எனக் காட்டுகின்றன. மூலத்தில் 'தூய' என்ற அடைமொழி இல்லாததால் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: μὴ ἔχοντες
  choice: பெற்றிராதவர்கள்
  rationale: ‘கொண்டிராதவர்கள்’ என்ற நேரடியான வடிவத்தைவிட, தூய ஆவியை உடையவர்களாக இருப்பதை இயல்பான நவீன தமிழில் தெளிவாகச் சொல்கிறது.
theological_decisions:
- issue: πνεῦμα என்பதன் குறிப்பு
  choice: தூய ஆவி
  alternative: ஆவி; மனித ஆவி
  rationale: இயற்கை மனித நிலையைக் குறிக்கும் ψυχικοί என்பதற்கு எதிராக வருவதால் தூய ஆவியே முதன்மையான பொருள். ஆயினும், கிரேக்கத்தில் πνεῦμα என்பது அடைமொழியும் சுட்டுச் சொல்லும் இன்றி வருவதால் அதன் சொல் மட்டத்திலான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. கிரேக்கத்தின் அடுக்கான மூன்று வருணனைகளையும் தமிழில் தெளிவாகப் பிரித்துக் காட்ட இரண்டு வாக்கியங்களும் அரைப்புள்ளியும் பயன்படுத்தப்பட்டுள்ளன. “உலகப்போக்கானவர்கள்” என்பது அணுகத்தக்க மொழி; அதன் முக்கிய மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
