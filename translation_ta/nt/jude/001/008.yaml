revisions:
- from: இருப்பினும், இவர்களும் அதேபோலக் கனவுகளைச் சார்ந்துகொண்டு[a], மாம்சத்தைத் தீட்டுப்படுத்துகிறார்கள்; அதிகாரத்தை நிராகரிக்கிறார்கள்; மகிமைக்குரியவர்களை[b] பழித்துப் பேசுகிறார்கள்.
  to: இருப்பினும், இவர்களும் அதேபோலக் கனவுகளைச் சார்ந்துகொண்டு[a], மாம்சத்தைத் தீட்டுப்படுத்துகிறார்கள்; அதிகாரத்தை நிராகரிக்கிறார்கள்; மகிமைமிக்கவர்களை[b] பழித்துப் பேசுகிறார்கள்.
