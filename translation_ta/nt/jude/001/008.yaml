id: JUD.1.8
reference: Jude 1:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὁμοίως μέντοι καὶ οὗτοι ἐνυπνιαζόμενοι σάρκα μὲν μιαίνουσιν, κυριότητα δὲ ἀθετοῦσιν, δόξας δὲ βλασφημοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/008.yaml
  text: Yet in the same way, these people also, relying on dreams, defile the flesh, reject authority, and slander glorious ones.
translation:
  language: ta
  text: இருப்பினும், இவர்களும் அதேபோலக் கனவுகளைச் சார்ந்துகொண்டு[a], மாம்சத்தைத் தீட்டுப்படுத்துகிறார்கள்; அதிகாரத்தை நிராகரிக்கிறார்கள்; மகிமைமிக்கவர்களை[b] பழித்துப் பேசுகிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கனவு கண்டுகொண்டு.” கிரேக்கப் பங்கேற்புவினையை இவ்வாறு இன்னும் நேரடியாக மொழிபெயர்க்கலாம்; ஆனால் தங்கள் நடத்தைக்கு ஆதாரமாக அவர்கள் கனவுகளை முன்வைப்பதை இங்கு குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: '“மகிமைமிக்கவர்கள்” என்பது உயர்ந்த வானுலக உயிர்களைக், ஒருவேளை தூதர்களைக், குறிக்கலாம். கிரேக்கத்தில் சொல்லுக்குச் சொல்: “மகிமைகள்.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁμοίως μέντοι
  choice: இருப்பினும், ... அதேபோல
  rationale: ὁμοίως என்பதன் ஒப்பீட்டுப் பொருளையும் μέντοι என்பதன் மென்மையான எதிர்மறைத் திருப்பத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: οὗτοι
  choice: இவர்கள்
  rationale: சூழலில் ஏற்கெனவே குறிப்பிடப்பட்டுள்ள ஊடுருவியவர்களைச் சுட்டுகிறது; கிரேக்கத்தில் இல்லாத ஆண்பால் குறிப்பைச் சேர்ப்பதில்லை.
- source_word: ἐνυπνιαζόμενοι
  choice: கனவுகளைச் சார்ந்துகொண்டு
  rationale: அவர்களுடைய செயல்களுக்கு கனவுகள் அடிப்படையாக இருப்பதைக் குறிக்கக்கூடிய பங்கேற்புவினையின் சூழல்சார் பொருளைத் தெரிவிக்கிறது; நேரடியான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: σάρκα
  choice: மாம்சத்தை
  rationale: இதை வெறும் உடலாகவோ ஒரு குறிப்பிட்ட இறையியல் தொழில்நுட்பச் சொல்லாகவோ தீர்மானிக்காமல், கிரேக்கச் சொல்லின் உருவக மற்றும் அறநெறி சார்ந்த அகலத்தைப் பாதுகாக்கிறது.
- source_word: μιαίνουσιν
  choice: தீட்டுப்படுத்துகிறார்கள்
  rationale: அறநெறி மற்றும் சடங்கு மாசு ஆகிய இரு நிழற்பொருள்களுக்கும் ஏற்ற, யூதாவின் கண்டனத் தொனியைத் தக்கவைக்கும் சொல்.
- source_word: κυριότητα
  choice: அதிகாரத்தை
  rationale: தெய்வீக ஆண்டுகை, வானுலக அதிகாரம் அல்லது பொதுவான அதிகாரம் ஆகிய சாத்தியமான குறிப்புகளை முன்கூட்டியே முடிவுசெய்யாத பரந்த மொழிபெயர்ப்பு.
- source_word: ἀθετοῦσιν
  choice: நிராகரிக்கிறார்கள்
  rationale: அங்கீகரிக்க வேண்டிய ஒன்றை ஒதுக்கித் தள்ளுதல் அல்லது மறுத்தல் என்ற வலுவான பொருளைத் தெளிவாகத் தருகிறது.
- source_word: δόξας
  choice: மகிமைக்குரியவர்களை
  rationale: சொல்லின் பன்மையையும் ஆள்களைக் குறிக்கும் சாத்தியத்தையும் காக்கிறது; பிரதான உரையில் அவர்களைத் திட்டவட்டமாகத் தூதர்கள் என்று அடையாளப்படுத்தவில்லை.
- source_word: βλασφημοῦσιν
  choice: பழித்துப் பேசுகிறார்கள்
  rationale: இங்கு தேவனை மட்டுமே குறித்துப் பேசுவதாகத் தவறாகக் கட்டுப்படுத்தாமல், இழிவாகவும் அவதூறாகவும் பேசும் செயலின் தீவிரத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: δόξας என்பதன் குறிப்பு
  choice: மகிமை பெற்ற அல்லது உயர்ந்தவர்களைக் குறிக்கும் பரந்த வெளிப்பாடு
  alternative: தூதர்கள்; வானுலக மாட்சிமைக்குரியவர்கள்; அருவமான மகிமைகள்
  rationale: அடுத்த வசனத்தின் சூழல் வானுலக உயிர்களைக் குறிப்பதாகச் சுட்டினாலும், இச்சொல் தனியாக அவ்வளவு திட்டவட்டமானதல்ல. ஆகவே பிரதான உரை அதன் அகலத்தைப் பாதுகாக்கிறது; சாத்தியமான குறிப்பை அடிக்குறிப்பு விளக்குகிறது.
- issue: ἐνυπνιαζόμενοι என்பதன் விசை
  choice: அவர்களுடைய நடத்தை கனவுகளைச் சார்ந்திருப்பதோடு தொடர்புடையது
  alternative: கனவு காண்கிறவர்கள்; கனவு கண்டுகொண்டிருக்கையில்
  rationale: பங்கேற்புவினை அவர்களுடைய செயல்களின் அடிப்படை அல்லது முறையைக் குறிக்கலாம். பிரதான உரை இந்தச் சூழல்சார் பொருளைத் தருகிறது; அதிக நேரடியான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கண்டனத் தொனி பயன்படுத்தப்பட்டுள்ளது. மூன்று இணை வினைச்செயல்களும் அரைப்புள்ளிகளால் தெளிவுபடுத்தப்பட்டுள்ளன. “மாம்சம்,” “அதிகாரம்,” “மகிமைக்குரியவர்கள்” ஆகிய சொற்களில் மூலத்தின் இறையியல் மற்றும் குறிப்பியல் தெளிவின்மை திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளது.
