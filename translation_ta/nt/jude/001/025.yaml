  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀μόνῳ θεῷ σωτῆρι ἡμῶν ⸂διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν⸃ ⸀δόξα μεγαλωσύνη κράτος καὶ ἐξουσία ⸂πρὸ παντὸς τοῦ αἰῶνος⸃ καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/025.yaml
  text: to the only God our Savior[a], through Jesus the Messiah our Lord, be glory, majesty, dominion, and authority, before all time and now and forever[b]. Amen.
translation:
  language: ta
  text: ஒரே இறைவனாகிய நம் மீட்பருக்கு, நம் ஆண்டவராகிய இயேசு மேசியாவின்[a] வழியாக, எல்லாக் காலத்திற்கும் முன்பும், இப்போதும், என்றென்றும்[b] மகிமையும் மாட்சிமையும் ஆட்சிவல்லமையும் அதிகாரமும் உண்டாவதாக. ஆமென்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இயேசு கிறிஸ்து.” கிரேக்கப் பட்டப்பெயரான Χριστός இங்கு அதன் பொருளைத் தக்கவைக்க ‘மேசியா’ என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: சொற்படியாக, “ஒவ்வொரு யுகத்திற்கும் முன்பும் ... எல்லா யுகங்களுக்கும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνῳ θεῷ σωτῆρι ἡμῶν
  choice: ஒரே இறைவனும் நம் மீட்பருமானவருக்கு
  rationale: μόνῳ என்பது இறைவனின் ஒப்பற்ற தன்மையை வலியுறுத்துகிறது. σωτήρ என்பதற்கு இயல்பான தமிழில் ‘மீட்பர்’ என்று வழங்கி, மறைநூல் சூழலிலுள்ள இரட்சிப்பு மற்றும் விடுவிப்பு சார்ந்த பொருளைப் பாதுகாக்கிறது.
- source_word: διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν
  choice: நம் ஆண்டவராகிய இயேசு மேசியாவின் வழியாக
  rationale: Genitive-உடன் வரும் διά, வழிமுறை அல்லது இடைநிலையைச் சுட்டுவதால் ‘வழியாக’ என மொழிபெயர்க்கப்பட்டது. Χριστός இங்கு பட்டமாக இருப்பதால் அதன் பொருளை வெளிப்படுத்தும் ‘மேசியா’ பயன்படுத்தப்பட்டது; τοῦ κυρίου ἡμῶν அதனுடன் இயல்பாக இணைக்கப்பட்டது.
- source_word: δόξα
  choice: மகிமை
  rationale: இறைவனைப் போற்றும் மொழிநடையில் δόξα என்பதற்குரிய வழக்கமான, புரிந்துகொள்ள எளிய தமிழ் இணைச்சொல்.
- source_word: μεγαλωσύνη
  choice: மாட்சி
  rationale: இச்சொல் உயர்ந்த பெருமையையும் மகத்துவத்தையும் குறிக்கிறது; போற்றுரையின் கண்ணியமான நடைக்கு ‘மாட்சி’ பொருந்துகிறது.
- source_word: κράτος
  choice: ஆட்சிவல்லமை
  rationale: κράτος வெளிப்படும் வல்லமையையும் ஆளும் ஆற்றலையும் குறிக்கலாம். அடுத்து வரும் ἐξουσία என்பதிலிருந்து வேறுபாட்டைத் தக்கவைக்க ‘ஆட்சிவல்லமை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἐξουσία
  choice: அதிகாரம்
  rationale: உரிமையுள்ள ஆளுகை அல்லது அதிகாரத்தைக் குறிக்கும் சொல்லாக ἐξουσία இங்கு பயன்படுத்தப்பட்டுள்ளது.
- source_word: πρὸ παντὸς τοῦ αἰῶνος καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας
  choice: எல்லாக் காலத்திற்கும் முன்பும், இப்போதும், என்றென்றும்
  rationale: கடந்த காலத்திற்கு முந்திய நிலை, நிகழ்காலம், முடிவில்லாத வருங்காலம் ஆகிய முக்கால விரிவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; αἰών என்பதன் சொற்படியான ‘யுகம்’ சார்ந்த வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: போற்றுரை யாரை நோக்குகிறது; διὰ என்ற இடைநிலைச் சொற்றொடர் எதனுடன் இணைகிறது
  choice: போற்றுரை ஒரே இறைவனும் நம் மீட்பருமானவரை நோக்குகிறது; மகிமை முதலியவை இயேசு மேசியாவின் வழியாக அவருக்கு உரித்தாக்கப்படுகின்றன.
  alternative: இயேசுவைக் குறிக்கும் சொற்றொடரைப் போற்றுரையுடன் தளர்வாக இணைத்துப் புரிந்துகொள்ளலாம்; இருந்தாலும் διά இடைநிலையைச் சுட்டுகிறது.
  rationale: கிரேக்கத் தொடரமைப்பில் dative வடிவிலுள்ள μόνῳ θεῷ σωτῆρι ἡμῶν போற்றுரையின் பெறுநரைச் சுட்டுகிறது; διὰ Ἰησοῦ Χριστοῦ இயேசுவின் இடைநிலைப் பங்கை வெளிப்படுத்துகிறது. இதனால் உரையில் உள்ள ஒரே இறைவன் என்ற வலியுறுத்தலும் இயேசுவின் இடைநிலைப் பங்கும் கலக்கப்படாமல் நிலைக்கின்றன.
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு Χριστός வெறும் பெயரின் பகுதியாக மட்டுமல்லாமல் பட்டமாகவும் செயல்படுகிறது. எனவே அதன் ‘அபிஷேகம் செய்யப்பட்டவர்’ என்ற மேசியானிய பொருளை வெளிப்படுத்த ‘மேசியா’ பயன்படுத்தப்பட்டது; வழக்கமான ‘கிறிஸ்து’ வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான போற்றுரை நடையைப் பயன்படுத்துகிறது. ‘உண்டாவதாக’ என்ற நிறைவு, கிரேக்கத்தில் வெளிப்படையாக இல்லாத வினைச்சொல்லை தமிழில் இயல்பாக நிரப்புகிறது. δόξα, μεγαλωσύνη, κράτος, ἐξουσία ஆகிய நான்கு தனித்த கருத்துகளையும் ஒன்றாக்காமல் இணைச்சொற்களாகப் பாதுகாக்கிறது.
