revisions:
- from: ஆனால் அன்புக்குரியவர்களே, நீங்கள் உங்களுடைய மிகப் பரிசுத்தமான விசுவாசத்தில்[a][c] உங்களையே கட்டியெழுப்பிக்கொண்டும், பரிசுத்த ஆவியில்[b] வேண்டிக்கொண்டும்,
