source:
  edition: SBLGNT
  text: ὑμεῖς δέ, ἀγαπητοί, ⸂ἐποικοδομοῦντες ἑαυτοὺς τῇ ἁγιωτάτῃ ὑμῶν πίστει⸃, ἐν πνεύματι ἁγίῳ προσευχόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/020.yaml
  text: But you[a], beloved, building yourselves up in your most holy faith and praying in the Holy Spirit[c][b],
translation:
  language: ta
  text: ஆனால், அன்புக்குரியவர்களே, நீங்கள் உங்களுடைய மிகப் பரிசுத்தமான விசுவாசத்தில்[a][c] உங்களை நீங்களே கட்டியெழுப்பிக்கொண்டும், பரிசுத்த ஆவியில்[b] ஜெபித்துக்கொண்டும்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உங்களுடைய மிகப் பரிசுத்தமான விசுவாசத்தின்மேல்.’ கிரேக்கத் தொடர், விசுவாசத்தை அடித்தளமாகக் கொண்டு கட்டுவதையோ, விசுவாசத்தோடு தொடர்புபடுத்திக் கட்டியெழுப்புவதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பரிசுத்த ஆவியினால்.’ இத்தொடர் ஜெபம் நடைபெறும் சூழலை (‘ஆவியில்’) அல்லது ஜெபிக்க ஆவி அளிக்கும் ஆற்றலை (‘ஆவியினால்’) வலியுறுத்தலாம்.
    reason: alternative_reading
  - marker: c
    text: ‘விசுவாசம்’ என்பதை இங்கே ‘நம்புதல்’ அல்லது ‘உண்மைத்தன்மை’ என்றும் புரிந்துகொள்ளலாம்; ஆயினும் யூதாவின் சூழலில், சமூகத்தினர் பகிர்ந்துகொள்ளும் கிறிஸ்தவ விசுவாசத்தைக் குறிப்பதே அதிகச் சாத்தியம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: ஆனால் ... நீங்கள்
  rationale: δέ முந்தைய வசனங்களில் குறிப்பிடப்பட்டவர்களோடு வேறுபாட்டைக் காட்டுகிறது; வெளிப்படையாக இடம்பெறும் ὑμεῖς வலியுறுத்தலைக் கொண்டிருப்பதால் ‘நீங்கள்’ தக்கவைக்கப்பட்டது.
- source_word: ἀγαπητοί
  choice: அன்புக்குரியவர்களே
  rationale: பன்மை விளிப்பின் பாசத்தையும் கண்ணியத்தையும் நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐποικοδομοῦντες ἑαυτούς
  choice: உங்களையே கட்டியெழுப்பிக்கொண்டும்
  rationale: கட்டிட உருவகத்தையும் ἑαυτούς என்பதன் தற்சுட்டுப் பொருளையும் காக்கிறது; பன்மை வடிவம் சமூகமுழுவதையும் குறிக்க இடமளிக்கிறது.
- source_word: τῇ ἁγιωτάτῃ ὑμῶν πίστει
  choice: உங்களுடைய மிகப் பரிசுத்தமான விசுவாசத்தில்
  rationale: ἁγιωτάτῃ என்பதன் மிகைநிலையை ‘மிகப் பரிசுத்தமான’ எனக் காக்கிறது. வேற்றுமை உருபின் பொருள் செயலின் தளமாகவோ கட்டப்படும் அடித்தளமாகவோ அமையக்கூடும் என்பதால் மாற்று அடிக்குறிப்பில் தரப்பட்டது.
- source_word: πίστει
  choice: விசுவாசம்
  rationale: இச்சூழலில் சமூகத்தினர் ஏற்றுக்கொண்ட கிறிஸ்தவ விசுவாசத்தைக் குறிப்பது மிகச் சாத்தியம்; இருப்பினும் ‘நம்பிக்கை’ அல்லது ‘உண்மைத்தன்மை’ என்ற சொற்பொருள் வாய்ப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: பரிசுத்த ஆவியில்
  rationale: ἐν என்பதன் அடிப்படை இடம்/சூழல் சார்ந்த பொருளைக் காக்கிறது; அபிஷேகச் செயலாற்றலை வலியுறுத்தும் ‘ஆவியினால்’ என்பது மாற்றாகக் குறிப்பிடப்படுகிறது.
- source_word: προσευχόμενοι
  choice: வேண்டிக்கொண்டும்
  rationale: நிகழ்காலப் பங்கேற்புவினையின் தொடர்ச்சியான செயற்பாட்டையும் அடுத்த வசனத்துக்குத் தொடரும் வாக்கிய ஓட்டத்தையும் தமிழில் காக்கிறது.
theological_decisions:
- issue: ἐν πνεύματι ἁγίῳ என்பதில் πνεῦμα யாரைக் குறிக்கிறது?
  choice: தெய்வீகப் பரிசுத்த ஆவியைக் குறிக்கிறது
  alternative: ‘பரிசுத்தமான ஆவிநிலையில்’ என்ற மனித உள்ளநிலையைக் குறிக்கலாம்
  rationale: யூதாவின் அறிவுறுத்தல் சூழலிலும் தொடக்கக் கிறிஸ்தவப் பயன்பாட்டிலும் இது பரிசுத்த ஆவியின் சூழலிலும் செல்வாக்கிலும் செய்யப்படும் வேண்டுதலைக் குறிப்பதே இயல்பானது; மூலத்தில் இல்லாத கூடுதல் கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
- issue: πίστις என்பதன் பொருள்
  choice: சமூகத்தினர் ஏற்றுக்கொண்ட விசுவாசம்
  alternative: தனிப்பட்ட நம்புதல் அல்லது உண்மைத்தன்மை
  rationale: யூதாவில் ‘விசுவாசம்’ என்பது ஒப்படைக்கப்பட்ட பொதுவான கிறிஸ்தவ விசுவாசத்தைச் சுட்டும் பின்னணியைக் கொண்டுள்ளது. இருப்பினும் ‘விசுவாசம்’ என்ற மொழிபெயர்ப்பு சொற்பொருளின் பரப்பைத் திறந்தவாறே வைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டது. பங்கேற்புவினைகள் அடுத்த வசனத்துக்குத் தொடரும் கிரேக்க வாக்கிய அமைப்பை உணர்த்த ‘-க்கொண்டும்’ வடிவில் வைக்கப்பட்டன. ‘கட்டியெழுப்புதல்’ என்ற உருவகம் திட்டமிட்டே பாதுகாக்கப்பட்டது.
