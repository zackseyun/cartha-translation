source:
  edition: SBLGNT
  text: Ὑπομνῆσαι δὲ ὑμᾶς βούλομαι, εἰδότας ⸂ὑμᾶς ἅπαξ⸃ ⸀πάντα, ὅτι ⸀Ἰησοῦς λαὸν ἐκ γῆς Αἰγύπτου σώσας τὸ δεύτερον τοὺς μὴ πιστεύσαντας ἀπώλεσεν,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/005.yaml
  text: I want to remind you[a], though you know all things once for all, that Jesus, having saved a people out of the land of Egypt, afterward destroyed those who did not believe.
translation:
  language: ta
  text: 'நீங்கள் இவை அனைத்தையும் ஒருமுறைக்குமாக அறிந்திருந்தாலும், நான் உங்களுக்கு நினைவூட்ட விரும்புகிறேன்: இயேசு[a] எகிப்து நாட்டிலிருந்து ஒரு மக்களைக் காப்பாற்றிய பின்பு, நம்பாதவர்களை அழித்தார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “இயேசு” என்பதற்குப் பதிலாக “ஆண்டவர்” அல்லது “கடவுள்” என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: Ὑπομνῆσαι
  choice: நினைவூட்ட
  rationale: ஏற்கெனவே அறிந்ததை மீண்டும் மனத்திற்குக் கொண்டுவருதல் என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: βούλομαι
  choice: விரும்புகிறேன்
  rationale: முதலாம் நபரின் விருப்பத்தை நேரடியாகவும் மரியாதையான நடையிலும் வெளிப்படுத்துகிறது.
- source_word: εἰδότας ὑμᾶς ἅπαξ πάντα
  choice: எல்லாவற்றையும் நீங்கள் ஒரே முறையாக அறிந்திருந்தாலும்
  rationale: பங்கேற்புவினையின் விட்டுக்கொடுக்கும் பொருளையும், πάντα என்பதன் விரிவையும், ἅπαξ என்பதன் ‘ஒரே முறையாக/ஒருமுறைக்குமாக’ என்ற வலியுறுத்தலையும் இயன்றவரை காக்கிறது.
- source_word: Ἰησοῦς
  choice: இயேசு
  rationale: கொடுக்கப்பட்ட SBLGNT மூலப்பாடத்தில் உள்ள பெயரை நேரடியாக மொழிபெயர்த்து, யாத்திராகம நிகழ்வில் இயேசுவைச் செயல்படும் பொருளாகக் காட்டும் கிறிஸ்துவியல் வலிமையைப் பாதுகாக்கிறது.
- source_word: λαὸν
  choice: ஒரு மக்களை
  rationale: குறிப்புச் சுட்டில்லாத பெயர்ச்சொல்லின் கூட்டு மக்களைக் குறிக்கும் பொருளை அளிக்கிறது; இங்கு வேற்றுமை இணைப்பால் ‘ஒரு மக்களைக்’ என உரையில் வருகிறது.
- source_word: ἐκ γῆς Αἰγύπτου
  choice: எகிப்து நாட்டிலிருந்து
  rationale: ‘எகிப்து தேசத்திலிருந்து’ என்ற வேதாகம ஒலியை நவீன, இயல்பான தமிழில் காக்கிறது.
- source_word: σώσας
  choice: காப்பாற்றிய பின்பு
  rationale: முதலில் நிகழ்ந்த மீட்பையும் அதற்குப் பின்வந்த தீர்ப்பையும் தெளிவான காலவரிசையில் காட்டுகிறது.
- source_word: τὸ δεύτερον
  choice: பின்பு
  rationale: சொல்லுக்குச் சொல் ‘இரண்டாவதாக’ என்பதற்குப் பதிலாக, இங்குள்ள தொடர்ச்சியான பிந்தைய செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τοὺς μὴ πιστεύσαντας
  choice: நம்பாதவர்களை
  rationale: நம்பத் தவறிய குழுவைச் சுருக்கமாகவும் தெளிவாகவும் அடையாளப்படுத்துகிறது.
- source_word: ἀπώλεσεν
  choice: அழித்தார்
  rationale: தெய்வீகத் தீர்ப்பின் கடுமையைத் தணிக்காமல் நேரடியாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: யாத்திராகமச் செயலில் எழுவாயாக இருப்பவர்
  choice: முதன்மைப் பாடத்தில் “இயேசு”
  alternative: “ஆண்டவர்” அல்லது “கடவுள்”
  rationale: வழங்கப்பட்ட கிரேக்க மூலப்பாடம் Ἰησοῦς என்று வாசிக்கிறது. ஆகவே அதன் வலுவான கிறிஸ்துவியல் கூற்றை மென்மைப்படுத்தாமல் முதன்மைப் பாடத்தில் காக்கப்படுகிறது; முக்கியமான மாற்றுப் பாடங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் இயல்பானதும் கண்ணியமானதும். மூலத்தில் இல்லாத தொடக்கக் காலச்சுட்டுச் சொல் சேர்க்கப்படவில்லை. எச்சரிக்கையின் கடுமையும் கிறிஸ்துவியல் பதற்றமும் தணிக்கப்படவில்லை.
