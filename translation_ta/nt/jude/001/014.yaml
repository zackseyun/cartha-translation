id: JUD.1.14
reference: Jude 1:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Προεφήτευσεν δὲ καὶ τούτοις ἕβδομος ἀπὸ Ἀδὰμ Ἑνὼχ λέγων· Ἰδοὺ ἦλθεν κύριος ἐν ἁγίαις μυριάσιν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/014.yaml
  text: And Enoch[a], the seventh from Adam, also prophesied to these, saying, “Behold[c][b], the Lord came with his holy myriads,”
translation:
  language: ta
  text: 'ஆதாமிலிருந்து ஏழாமவரான ஏனோக்கும் இவர்களைக் குறித்து[a] இறைவாக்குரைத்தார்: “இதோ,[c] ஆண்டவர் தமது பரிசுத்தமான பல்லாயிரக்கணக்கானோருடன்[b] வந்தார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இவர்களுக்கு” அல்லது “இவர்களுக்கு எதிராக” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல்லின் வேற்றுமை வடிவம், இறைவாக்கு யாரிடம் கூறப்பட்டது அல்லது யாரைக் குறித்து கூறப்பட்டது என்பதைக் குறிக்கக்கூடும்; இங்கு அது சூழலில் கூறப்பட்ட இறைப்பற்றற்றவர்களைச் சுட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தமது பரிசுத்தர்களான பதினாயிரக்கணக்கானோருடன்.” இங்குள்ள கிரேக்கச் சொல் ‘பல்லாயிரங்கள்’ அல்லது ‘பதினாயிரக்கணக்கானோர்’ என்று பொருள்பட்டு, மிகப் பெரும் பரிசுத்தக் கூட்டத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: இந்த மேற்கோள் 1 ஏனோக்கு 1:9-ஐ எதிரொலிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: Προεφήτευσεν
  choice: இறைவாக்குரைத்தார்
  rationale: προφητεύω குறிக்கும் தீர்க்கதரிசன உரைச் செயலைத் தக்கவைக்கிறது; இதை வெறும் எதிர்கால முன்னறிவிப்பாகக் குறுக்கவில்லை.
- source_word: δὲ καὶ
  choice: ஏனோக்கும்
  rationale: δέ இங்குள்ள மென்மையான தொடர்ச்சியையும் καί இன் கூடுதல் வலியுறுத்தலையும் இயல்பான தமிழில் பெயருடன் இணைந்த ‘-உம்’ வெளிப்படுத்துகிறது.
- source_word: τούτοις
  choice: இவர்களைக் குறித்து
  rationale: προφητεύω உடன் வரும் வேற்றுமை உருபு, தீர்க்கதரிசனம் யாரைக் குறித்தது என்பதைக் காட்டலாம். சூழலில் முன்பு குறிப்பிடப்பட்ட இறைப்பற்றற்ற ஊடுருவலாளர்களையே சுட்டுகிறது; இருப்பினும் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: ἕβδομος ἀπὸ Ἀδὰμ
  choice: ஆதாமிலிருந்து ஏழாமவரான
  rationale: வம்சவரிசைக் குறிப்பை ‘தலைமுறை’ என்ற சொல்லை மூலத்தில் இல்லாமல் சேர்க்காமல், சுருக்கமாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: Ἑνὼχ
  choice: ஏனோக்கு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவம்.
- source_word: λέγων
  choice: 'இறைவாக்குரைத்தார்:'
  rationale: தமிழில் மேற்கோளை இரட்டிப்பின்றி இயல்பாக அறிமுகப்படுத்த, பிரதான வினையுடன் மேற்கோள் குறி பயன்படுத்தப்பட்டுள்ளது; ‘சொல்லி’ என்ற தேவையற்ற மறுமொழி தவிர்க்கப்படுகிறது.
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் தீர்க்கதரிசனத் தொனியையும் கண்ணியத்தையும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: ἦλθεν
  choice: வந்தார்
  rationale: கிரேக்க இறந்தகால வடிவத்தை இறந்தகாலமாகவே காக்கிறது; இதை விளக்கத்தின் அடிப்படையில் ‘வருவார்’ என எதிர்காலமாக மாற்றவில்லை.
- source_word: κύριος
  choice: ஆண்டவர்
  rationale: κύριος என்பதற்கான நிலையான கண்ணியமான தமிழ் இணை; யாரைக் குறிக்கிறது என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- source_word: ἐν ἁγίαις μυριάσιν αὐτοῦ
  choice: தமது பரிசுத்தமான பல்லாயிரக்கணக்கானோருடன்
  rationale: ἐν என்பதின் உடனிருப்பு பொருளை ‘உடன்’ என்றும், μυριάσιν என்பதின் மிகப் பெரும் எண்ணிக்கையையும் ἁγίαις என்பதின் பரிசுத்தத் தன்மையையும் காக்கிறது; ‘தேவதூதர்கள்’ என்று மூலத்தில் இல்லாத அடையாளத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: ஏனோக்கின் மேற்கோளில் ‘ஆண்டவர்’ யாரைக் குறிக்கிறது?
  choice: ‘ஆண்டவர்’ என்று மட்டும் மொழிபெயர்த்து, அது பொதுவாகக் கடவுளையா அல்லது இயேசுவையா குறிக்கிறது என்பதைத் தீர்மானிக்காமல் விடுதல்.
  alternative: ஏனோக்கு மரபின் சூழலில் கடவுளைக் குறிப்பதாகவோ, யூதாவின் பயன்பாட்டில் இயேசுவுக்குப் பொருத்தப்பட்டதாகவோ வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: கிரேக்க உரையில் κύριος மட்டுமே உள்ளது. ஆகவே உரையிலுள்ள இறையியல் அழுத்தத்தையும் தெளிவின்மையையும் மொழிபெயர்ப்பு பாதுகாக்கிறது.
- issue: 1 ஏனோக்கு நூலுடனான மேற்கோளின் தன்மை
  choice: யூதா கூறுவது போல இதை ஏனோக்கின் இறைவாக்காக முதன்மை உரையில் வழங்கி, இலக்கிய எதிரொலியை அடிக்குறிப்பில் மட்டும் குறிப்பிடுதல்.
  alternative: முதன்மை உரையிலேயே 1 ஏனோக்கு நூலிலிருந்து நேரடி மேற்கோள் என்று அடையாளப்படுத்துதல்.
  rationale: முதன்மை உரை மேற்கோளின் மறைநூல் நிலையைப் பற்றிய தீர்ப்பைச் சேர்க்கக் கூடாது; இலக்கியத் தொடர்பை அறிய விரும்புவோருக்கு அடிக்குறிப்பு போதுமானது.
- issue: பரிசுத்தமான பல்லாயிரக்கணக்கானோர் யார்?
  choice: ‘பரிசுத்தமான பல்லாயிரக்கணக்கானோர்’ என்று மொழிபெயர்த்து அவர்களைத் தேவதூதர்கள் என வெளிப்படையாக அடையாளப்படுத்தாமல் விடுதல்.
  alternative: ‘பல்லாயிரக்கணக்கான பரிசுத்த தேவதூதர்கள்’ என்று மொழிபெயர்த்தல்.
  rationale: கிரேக்க உரை மிகப் பெரிய பரிசுத்தக் கூட்டத்தைக் குறிப்பிடுகிறது; ‘தேவதூதர்கள்’ என்ற பெயரை வெளிப்படையாகக் கூறவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான தீர்க்கதரிசனத் தொனி பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ மற்றும் ‘ஆண்டவர்’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் காக்கப்பட்டுள்ளன; அதே நேரத்தில் தேவையற்ற பழமையான தொடரமைப்பு தவிர்க்கப்பட்டுள்ளது.
