  text: καὶ οὓς μὲν ⸀ἐλεᾶτε ⸂διακρινομένους,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/022.yaml
  text: And have mercy on those who are doubting,[a]
translation:
  language: ta
  text: மேலும், சந்தேகப்படுகிறவர்கள்மீது இரக்கம் காட்டுங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஊசலாடுகிறவர்கள்மீது இரக்கம் காட்டுங்கள்’; ‘வாதிடுகிறவர்கள்மீது இரக்கம் காட்டுங்கள்’ என்றும் இருக்கலாம். இச்சூழலில் கிரேக்க வினையெச்சம் ஒன்றுக்கு மேற்பட்ட நுண்பொருள்களைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: '[தனி மொழிபெயர்ப்பு இல்லை]'
  rationale: இது முந்தைய அறிவுரைகளுடன் இவ்வாக்கியத்தை இணைக்கும் எளிய இணைப்புச்சொல். தமிழில் வசனத்தைத் தனியாக வாசிக்கும்போது தொடக்கத்தில் ‘மேலும்’ அல்லது ‘மற்றும்’ சேர்ப்பது இயல்பற்றதாக இருப்பதால், அறிவுரைகளின் தொடர்ச்சியை வாக்கிய அமைப்பே உணர்த்துமாறு விடப்பட்டுள்ளது.
- source_word: οὓς μὲν
  choice: …கிறவர்கள்மீது
  rationale: μέν அடுத்த குழுவுடன் ஒப்பிடப்படும் முதல் குழுவை அறிமுகப்படுத்துகிறது. தமிழில் ‘ஒருபுறம் உள்ளவர்களை’ என்று சொல்வது செயற்கையாக இருப்பதால், தொடர்புப் பெயரெச்ச அமைப்பில் இயல்பாகத் தரப்பட்டுள்ளது; தொடரும் வசனங்கள் குழுவாக்கத்தை நிறைவு செய்கின்றன.
- source_word: ἐλεᾶτε
  choice: இரக்கம் காட்டுங்கள்
  rationale: ἐλεάω என்பதன் இரக்கம் அல்லது கருணை காட்டுதல் என்ற கட்டளைப் பொருளைத் தெளிவான, கண்ணியமான நவீன தமிழில் தருகிறது.
- source_word: διακρινομένους
  choice: சந்தேகப்படுகிறவர்கள்
  rationale: இச்சூழலில் ஆன்மீக நிச்சயமின்மை அல்லது ஐயத்தைக் குறிக்க வாய்ப்புள்ளதால் முதன்மை உரையில் ‘சந்தேகப்படுகிறவர்கள்’ எனத் தரப்பட்டுள்ளது. ஊசலாடுதல் அல்லது வாதிடுதல் என்ற சாத்தியமான நுண்பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
theological_decisions:
- issue: διακρινομένους என்பதன் மேய்ப்புப்பணி சார்ந்த சூழற்பொருள்
  choice: சந்தேகப்படுகிறவர்கள்
  alternative: ஊசலாடுகிறவர்கள்; வாதிடுகிறவர்கள்
  rationale: இரக்கம் காட்டும்படி சொல்லப்படுகிற இக்குழுவினர் பொய்ப்போதனையால் உறுதியிழந்தவர்கள் எனப் புரிந்துகொள்ள ‘சந்தேகப்படுகிறவர்கள்’ ஏற்றதாக உள்ளது. எனினும் கிரேக்கச் சொல்லின் பன்முகப் பொருளைத் தீர்மானமாகச் சுருக்காமல் மாற்று வாசிப்புகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
translation_notes:
  register: நவீன தரமான தமிழில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இரக்கம் காட்டுங்கள்’ என்பது இயல்பான பொதுத் தமிழ்; மூலத்தின் உண்மையான சொற்பொருள் ஐயம் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
