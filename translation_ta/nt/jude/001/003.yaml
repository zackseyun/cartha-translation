reference: Jude 1:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἀγαπητοί, πᾶσαν σπουδὴν ποιούμενος γράφειν ὑμῖν περὶ τῆς κοινῆς ⸀ἡμῶν σωτηρίας ἀνάγκην ἔσχον γράψαι ὑμῖν παρακαλῶν ἐπαγωνίζεσθαι τῇ ἅπαξ παραδοθείσῃ τοῖς ἁγίοις πίστει.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/003.yaml
  text: Beloved[a], although I was making every effort to write to you about our common salvation, I found it necessary to write[d][c][b], urging you to contend earnestly for the faith once for all delivered to the saints.
translation:
  language: ta
  text: அன்புக்குரியவர்களே, நாம் பகிர்ந்துகொள்ளும் மீட்பைப் பற்றி உங்களுக்கு எழுத எல்லா முயற்சியும் செய்துகொண்டிருந்தபோதிலும், பரிசுத்த மக்களிடம் ஒரே முறை ஒப்படைக்கப்பட்ட விசுவாசத்திற்காக நீங்கள் தீவிரமாகப் போராட வேண்டும் என்று வலியுறுத்தி எழுதுவது அவசியம் எனக் கண்டேன்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “விசுவாசம்” என்பது இங்கு ஒருவர் நம்பும் செயலை மட்டும் அல்லாமல், விசுவாசிகளிடம் ஒப்படைக்கப்பட்ட கிறிஸ்தவ போதனையையும் குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: “ஒப்படைக்கப்பட்ட” என்பதற்கு “வழங்கப்பட்ட” அல்லது “மரபாகக் கையளிக்கப்பட்ட” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: அன்புக்குரியவர்களே
  rationale: அன்பும் மேய்ப்புப் பரிவும் நிறைந்த பன்மை விளிப்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: πᾶσαν σπουδὴν ποιούμενος
  choice: மிகுந்த ஆர்வத்துடன் இருந்தபோதிலும்
  rationale: σπουδή என்பதன் ஆர்வம் மற்றும் அக்கறையைப் பாதுகாத்து, சூழலில் பங்கேற்பெயரின் விட்டுக்கொடுக்கும் எதிர்மறைத் தொடர்பையும் வெளிப்படுத்துகிறது.
- source_word: περὶ τῆς κοινῆς ἡμῶν σωτηρίας
  choice: நாம் பகிர்ந்துகொள்ளும் மீட்பைப் பற்றி
  rationale: κοινῆς என்பதன் பொதுவான அல்லது பகிரப்பட்ட தன்மையை இயல்பாகச் சொல்கிறது; σωτηρία என்பதற்கு புரிந்துகொள்ள எளிதான ‘மீட்பு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἀνάγκην ἔσχον
  choice: எழுதுவது அவசியம் எனக் கண்டேன்
  rationale: சூழ்நிலையால் எழுந்த அவசியத்தைத் தெரிவிக்கிறது; கட்டாயப்படுத்தப்பட்டேன் என்று தேவைக்கு அதிகமான வலிமையைச் சேர்ப்பதில்லை.
- source_word: παρακαλῶν
  choice: வலியுறுத்தி
  rationale: இந்த இடத்தில் உள்ள தீவிரமான வேண்டுகோள் மற்றும் அறிவுறுத்தல் சார்ந்த பொருளை நடப்புத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ἐπαγωνίζεσθαι
  choice: தீவிரமாகப் போராட வேண்டும்
  rationale: வினையின் தீவிரப்படுத்தப்பட்ட போராட்டப் பொருளைக் காக்கிறது; ஆயுதப் போரை மட்டும் குறிக்காமல் ஒரு நோக்கத்திற்காக உறுதியாகப் போராடுவதை உணர்த்துகிறது.
- source_word: τῇ ... πίστει
  choice: விசுவாசத்திற்காக
  rationale: இங்கு தனிநபரின் நம்பும் செயலைவிட விசுவாசிகளிடம் ஒப்படைக்கப்பட்ட கிறிஸ்தவ போதனையின் தொகுப்பே அதிகம் சாத்தியம்; ‘விசுவாசம்’ என்ற சொல் மூலத்தின் சுருக்கத்தையும் சாத்தியமான பொருள் பரப்பையும் காக்கிறது.
- source_word: ἅπαξ
  choice: ஒரே முறையாக
  rationale: ஒப்படைப்பு ஒருமுறை நிகழ்ந்ததையும் அதன் தீர்மானமான தன்மையையும் வெளிப்படுத்துகிறது; ‘ஒரே முறையாக’ என்பது தமிழில் இயல்பானது.
- source_word: παραδοθείσῃ
  choice: ஒப்படைக்கப்பட்ட
  rationale: παραδίδωμι என்பதன் கையளித்தல் அல்லது மரபாக வழங்குதல் ஆகிய பொருள்களைச் சுமக்கக்கூடிய இயல்பான தமிழ்; போதனை விசுவாசிகளிடம் பொறுப்பாகக் கொடுக்கப்பட்டதையும் உணர்த்துகிறது.
- source_word: τοῖς ἁγίοις
  choice: பரிசுத்த மக்களிடம்
  rationale: ‘பரிசுத்தவான்கள்’ என்பதன் இன்றைய சாத்தியமான சிறப்பு-பட்டப் பொருளைத் தவிர்த்து, கடவுளுக்குரிய விசுவாசிகள் என்ற ஆரம்பக் கிறிஸ்தவப் பயன்பாட்டைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: πίστις என்பதன் பொருள்
  choice: விசுவாசிகளிடம் ஒப்படைக்கப்பட்ட கிறிஸ்தவ விசுவாசத்தின் போதனை சார்ந்த உள்ளடக்கம்
  alternative: விசுவாசிகள் தனிப்பட்ட முறையில் செலுத்தும் நம்பிக்கை
  rationale: ‘ஒரே முறையாக ஒப்படைக்கப்பட்ட’ என்ற விளக்கம், நம்பும் செயலைவிட ஒரு போதனை அல்லது அறிக்கைத் தொகுப்பை வலுவாகச் சுட்டுகிறது. இருப்பினும் ‘விசுவாசம்’ என்றே மொழிபெயர்த்து மூலச் சொல்லின் இயல்பான இறையியல் அடர்த்தி காக்கப்பட்டுள்ளது.
- issue: ἅπαξ παραδοθείσῃ என்பதன் வலிமை
  choice: தீர்மானமான ஒருமுறை ஒப்படைப்பு
  alternative: இறுதி அல்லது மீளாத தன்மையை வலியுறுத்தாமல் வெறுமனே ‘ஒருமுறை’
  rationale: ἅπαξ இச்சூழலில் ஒருமுறை நிகழ்ந்த தீர்மானமான ஒப்படைப்பைக் குறிக்கிறது; ஆனால் பின்னாளைய குறிப்பிட்ட கோட்பாட்டு அமைப்புகள் உரையில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில் கண்ணியமான, சாதாரண வாசகர்களுக்குப் புரியும் நடையைக் கடைப்பிடிக்கிறது. நீளமான கிரேக்க வாக்கியத்தின் தொடர்புகள் காக்கப்பட்டுள்ளன; தமிழில் இயல்பான சொல் வரிசை பயன்படுத்தப்பட்டுள்ளது. ‘பரிசுத்த மக்கள்’ என்பது திருச்சபைச் சிறப்பு பட்டமாகத் தவறாகப் புரிந்துகொள்ளப்படுவதைத் தவிர்த்து, அனைத்து விசுவாசிகளையும் குறிக்கும் சூழற்பொருளை வெளிப்படுத்துகிறது.
