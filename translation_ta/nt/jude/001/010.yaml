id: JUD.1.10
reference: Jude 1:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὗτοι δὲ ὅσα μὲν οὐκ οἴδασιν βλασφημοῦσιν, ὅσα δὲ φυσικῶς ὡς τὰ ἄλογα ζῷα ἐπίστανται, ἐν τούτοις φθείρονται.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/010.yaml
  text: But these people slander whatever they do not understand[a], and whatever they understand naturally, like irrational animals[c][b], by these things they are corrupted.
translation:
  language: ta
  text: ஆனால் இவர்கள், தங்களுக்குப் புரியாதவற்றைப் பழித்துப் பேசுகிறார்கள்[a]; பகுத்தறிவற்ற விலங்குகளைப் போல இயல்பாக அறிந்துகொள்கிற காரியங்களிலேயே[b] சீரழிகிறார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்களுக்குத் தெரியாதவற்றைத் தூஷிக்கிறார்கள்” அல்லது “இழிவுபடுத்துகிறார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பகுத்தறிவற்ற விலங்குகளைப் போல இயல்புணர்வால் அறிந்துகொள்கிற காரியங்களினாலேயே.”
    reason: lexical_and_syntactic_alternative
  - marker: c
    text: அல்லது, “அழிந்துபோகிறார்கள்” அல்லது “கெட்டுப்போகிறார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: இவர்கள்
  rationale: முந்தைய சூழலில் கண்டிக்கப்படும் நபர்களை இயல்பான தமிழில் சுட்டுகிறது; மூலத்தில் இல்லாத ஆண்பால் குறிப்பைச் சேர்ப்பதில்லை.
- source_word: βλασφημοῦσιν
  choice: பழித்துப் பேசுகிறார்கள்
  rationale: ஒருவரையோ புனிதமானவற்றையோ இழிவாகப் பேசுதல் என்ற பரந்த பொருளைத் தருகிறது; இங்கு பொருள் கடவுள் என்று வெளிப்படையாகக் கூறப்படாததால் ‘தூஷிக்கிறார்கள்’ என்ற குறுகிய சமயப் பொருளைத் தவிர்க்கிறது.
- source_word: ὅσα μὲν οὐκ οἴδασιν
  choice: தங்களுக்குப் புரியாதவற்றை
  rationale: அடுத்த பகுதியில் வரும் இயல்பான அறிவோடு உள்ள வேறுபாட்டை ‘புரியாத’ என்பது தெளிவாக வெளிப்படுத்துகிறது.
- source_word: φυσικῶς
  choice: இயல்பாக
  rationale: பகுத்தறிவின் மூலம் அல்லாமல் இயற்கையாக அல்லது உள்ளுணர்வாக அறிதல் என்ற பொருளை நேரடியாகவும் இயல்பான தமிழிலும் தருகிறது.
- source_word: ἄλογα ζῷα
  choice: பகுத்தறிவற்ற விலங்குகள்
  rationale: ἄλογα என்பதிலுள்ள பகுத்தறிவின்மை என்ற கருத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἐπίστανται
  choice: அறிந்துகொள்கிற
  rationale: அவர்கள் இயல்பாகப் பெற்றிருக்கும் வரையறுக்கப்பட்ட அறிவைக் குறிக்கிறது; முதல் பகுதிக்குரிய ‘புரிதல்’ என்பதிலிருந்து உள்ள நுண்ணிய வேறுபாட்டையும் வைத்திருக்கிறது.
- source_word: ἐν τούτοις
  choice: அறிந்துகொள்கிறவற்றினாலேயே
  rationale: ἐν என்பதற்குச் சாத்தியமான கருவிப்பொருளை வெளிப்படுத்தி, அவர்கள் இயல்பாக அறியும் அதே காரியங்கள் அவர்களின் சீரழிவுக்குக் காரணமாகின்றன என்ற கருத்தைத் தருகிறது.
- source_word: φθείρονται
  choice: சீரழிகிறார்கள்
  rationale: தார்மீகக் கேடும் இறுதி அழிவை நோக்கிய சிதைவும் ஒன்றோடொன்று கலந்துள்ள மூலச்சொல்லின் பரப்பை, வெறும் ‘கெட்டுப்போகிறார்கள்’ அல்லது ‘அழிக்கப்படுகிறார்கள்’ என்று ஒருபக்கம் மட்டும் தீர்மானிக்காமல் பாதுகாக்கிறது.
theological_decisions:
- issue: βλασφημέω என்பதன் பொருள், அதன் பொருள் நேரடியாகத் தெய்வீகமானது என்று கூறப்படாத இடத்தில்
  choice: பழித்துப் பேசுகிறார்கள்
  alternative: தூஷிக்கிறார்கள்
  rationale: அவர்களுக்குப் புரியாதவற்றைக் குறித்து இழிவாகப் பேசுவதே இங்கு நேரடியாகக் கண்டிக்கப்படுகிறது. கடவுளுக்கு எதிரான தூஷணம் என்று வசனம் வெளிப்படையாக வரையறுக்காததால் அந்தக் குறுகிய கருத்தை மொழிபெயர்ப்பில் புகுத்தவில்லை.
- issue: φθείρονται என்பதில் தார்மீகச் சீர்கேடும் அழிவும் கொண்டுள்ள உறவு
  choice: சீரழிகிறார்கள்
  alternative: அழிந்துபோகிறார்கள்
  rationale: நிகழ்கால வடிவம் காட்டும் தொடரும் சீரழிவையும், யூதாவின் நியாயத்தீர்ப்புச் சூழலில் அதன் அழிவூட்டும் முடிவையும் திறந்த நிலையில் வைக்கிறது; தார்மீகக் கேடு அல்லது இறுதி அழிவு என்ற ஒரே பொருளாகச் சுருக்கவில்லை.
- issue: ἐν τούτοις என்பதன் இடப்பொருள் அல்லது கருவிப்பொருள்
  choice: அவற்றினாலேயே என்ற கருவிப்பொருள்
  alternative: அவற்றிலேயே என்ற இடப்பொருள்
  rationale: அவர்கள் பின்பற்றும் இயல்பான அறிவே அவர்களுடைய சீரழிவின் வழியாகிறது என்ற தொடர்பு சூழலுக்கு ஏற்றது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. μὲν…δέ அமைப்பின் முரண்பாடு அரைப்புள்ளி மூலம் காட்டப்பட்டுள்ளது. ‘பகுத்தறிவற்ற விலங்குகள்’ என்பது கடுமையான மூல உவமையை மென்மையாக்காமல் இயல்பான தமிழில் தருகிறது.
