- from: ஆனால் இவர்கள், தங்களுக்குப் புரியாதவற்றைப் பழித்துப் பேசுகிறார்கள்[a]; பகுத்தறிவற்ற விலங்குகளைப் போல இயல்பாக அறிந்துகொள்கிறவற்றினாலேயே[b] சீரழிகிறார்கள்[c].
  to: ஆனால் இவர்கள், தங்களுக்குப் புரியாதவற்றைப் பழித்துப் பேசுகிறார்கள்[a]; பகுத்தறிவற்ற விலங்குகளைப் போல இயல்பாக அறிந்துகொள்கிற காரியங்களிலேயே[b] சீரழிகிறார்கள்[c].
