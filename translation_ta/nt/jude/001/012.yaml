reference: Jude 1:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν ⸀οἱ ἐν ταῖς ἀγάπαις ὑμῶν σπιλάδες συνευωχούμενοι, ἀφόβως ἑαυτοὺς ποιμαίνοντες, νεφέλαι ἄνυδροι ὑπὸ ἀνέμων παραφερόμεναι, δένδρα φθινοπωρινὰ ἄκαρπα δὶς ἀποθανόντα ἐκριζωθέντα,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/012.yaml
  text: These are hidden reefs at your love feasts[a], feasting together without fear, shepherding themselves; waterless clouds carried along by winds; autumn trees without fruit, twice dead[c][b], uprooted.
translation:
  language: ta
  text: இவர்கள் உங்கள் அன்பு விருந்துகளில்[a] அச்சமின்றி ஒன்றாக விருந்துண்டு, தங்களையே மேய்த்துக்கொள்பவர்களான மறைந்திருக்கும் பாறைகள்; காற்றுகளால் அடித்துச் செல்லப்படும் நீரற்ற மேகங்கள்; கனியற்ற இலையுதிர்கால மரங்கள்—இருமுறை இறந்தவை, வேரோடு பிடுங்கப்பட்டவை.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் அன்பு விருந்துகளில் உள்ள கறைகள்” அல்லது “மாசுகள்.” கிரேக்கச் சொல் ஒழுக்கக் கறையைக் குறிக்கக்கூடும்; மறைந்திருக்கும் ஆபத்தான பாறைகளையும் குறிக்கக்கூடும். இங்கு தொடரும் தெளிவான உருவகங்களுடன் பிந்தைய பொருள் நன்கு பொருந்துகிறது.
    reason: alternative_reading
  - marker: b
    text: “தங்களையே மேய்த்துக்கொள்பவர்கள்” என்பதை “தங்களுக்கே உணவளித்துக்கொள்பவர்கள்” என்றும் மொழிபெயர்க்கலாம். தங்கள் மந்தையை அல்ல, தங்களையே பேணும் தலைவர்களைப் பற்றிய உருவகத்திற்கு எசேக்கியேல் 34-ஐ ஒப்பிடுக.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: σπιλάδες
  choice: மறைந்திருக்கும் பாறைகள்
  rationale: இந்தச் சொல் கறைகள் அல்லது மாசுகள் என்றும் பொருள்படக்கூடும்; ஆனால் இங்கு தொடர்ச்சியாக வரும் இயற்கை உருவகங்களுக்கும், சமூகத்துக்குள் மறைந்திருக்கும் ஆபத்து என்ற கருத்துக்கும் ‘மறைந்திருக்கும் பாறைகள்’ நன்கு பொருந்துகிறது.
- source_word: ἀγάπαις
  choice: அன்பு விருந்துகள்
  rationale: பன்மையில் வரும் ἀγάπαις, கிறிஸ்தவர்களின் அன்பை வெளிப்படுத்திய பொதுவிருந்து உணவுகளைக் குறிக்கிறது; ‘அன்பு விருந்துகள்’ மூலச்சொல்லுடனான தொடர்பையும் சூழலையும் காக்கிறது.
- source_word: συνευωχούμενοι
  choice: உங்களோடு விருந்துண்ணும்
  rationale: ஒன்றாக விருந்தில் பங்குகொள்வதைத் தெரிவிக்கிறது; தமிழில் இயல்பாக இருக்கவும், அன்பு விருந்தின் சமூகச் சூழலைத் தெளிவாக்கவும் இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἀφόβως
  choice: அச்சமின்றி
  rationale: கட்டுப்பாடற்ற துணிவையோ பயபக்தியின்மையையோ குறிக்கக்கூடிய மூலத்தின் தெளிவின்மையை இது பாதுகாக்கிறது.
- source_word: ἑαυτοὺς ποιμαίνοντες
  choice: தங்களையே மேய்த்துக்கொள்கிறவர்கள்
  rationale: ποιμαίνω என்பதன் மேய்ப்பர் உருவகத்தைத் தக்கவைக்கிறது; அதேவேளையில் அவர்கள் பிறரைப் பராமரிக்காமல் தங்கள் நலனையே நாடுகிறார்கள் என்ற உட்பொருளையும் உணர்த்துகிறது.
- source_word: νεφέλαι ἄνυδροι
  choice: நீரற்ற மேகங்கள்
  rationale: எதிர்பார்ப்பை ஏற்படுத்தியும் பயன் அளிக்காத நிலையைச் சித்தரிக்கும் சுருக்கமான, நேரடியான உருவகம்.
- source_word: ὑπὸ ἀνέμων παραφερόμεναι
  choice: காற்றுகளால் அடித்துச் செல்லப்படும்
  rationale: வெளிப்புற சக்திகளால் கட்டுப்பாடின்றி கொண்டு செல்லப்படுவதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: δένδρα φθινοπωρινὰ ἄκαρπα
  choice: கனியற்ற இலையுதிர்கால மரங்கள்
  rationale: கனி எதிர்பார்க்கப்படும் காலத்திலேயே கனியில்லாத நிலையை மூல உருவகத்துக்கு நெருக்கமாக வெளிப்படுத்துகிறது.
- source_word: δὶς ἀποθανόντα
  choice: இருமுறை செத்தவை
  rationale: இறையியல் விளக்கத்தால் ஒற்றைப் பொருளாகச் சுருக்காமல், மூலத்தின் வலிமையான மற்றும் புதிரான சொல்லாட்சியை நேரடியாகக் காக்கிறது.
- source_word: ἐκριζωθέντα
  choice: வேரோடு பிடுங்கப்பட்டவை
  rationale: உயிரற்றதும் மீண்டும் வளர இயலாததுமான நிலையைத் தெளிவான தமிழ்ப் படிமமாகத் தருகிறது.
theological_decisions:
- issue: σπιλάδες என்பது மறைந்த ஆபத்தான பாறைகளையா அல்லது ஒழுக்கக் கறைகளையா குறிக்கிறது?
  choice: சமூகத்தின் அன்பு விருந்துகளுக்குள் மறைந்திருக்கும் ஆபத்தைக் குறிக்கும் பாறைகள்
  alternative: அன்பு விருந்துகளில் உள்ள கறைகள் அல்லது மாசுகள்
  rationale: யூதாவின் தொடர்ச்சியான உயிரோட்டமுள்ள இயற்கை உருவகங்களுடன் ‘மறைந்திருக்கும் பாறைகள்’ நன்கு பொருந்துகிறது; இருப்பினும் சொல் தரக்கூடிய ஒழுக்கப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἑαυτοὺς ποιμαίνοντες என்பதில் ποιμαίνω-வின் உருவக வலிமை
  choice: மேய்ப்பர் உருவகத்தைத் தக்கவைத்து ‘தங்களையே மேய்த்துக்கொள்கிறவர்கள்’
  alternative: தங்களுக்கே உணவளிக்கிறவர்கள்
  rationale: மூல வினைச்சொல் பொதுவாக மேய்ப்பதைக் குறிக்கிறது; இதைத் தக்கவைப்பது எசேக்கியேல் 34-இல் வரும் தன்னலம் நாடும் மேய்ப்பர்களுடனான ஒத்திசைவையும் பாதுகாக்கிறது.
- issue: ‘இருமுறை செத்தவை’ என்பதன் இறையியல் விளக்கம்
  choice: விளக்கமின்றி வலிமையான மூலச் சொல்லாட்சியைப் பாதுகாத்தல்
  alternative: முற்றிலும் செத்தவை
  rationale: δὶς என்பதைக் ‘முற்றிலும்’ என்று விளக்குவது சாத்தியமானாலும், மூலத்தில் உள்ள ‘இருமுறை’ என்ற திட்டமிட்ட பதற்றத்தையும் பலவாய்ப்பையும் மொழிபெயர்ப்பு தீர்த்துவிடக் கூடாது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. யூதாவின் வேகமான உருவகத் தொடரை அரைப்புள்ளிகளாலும் நீள்கோட்டாலும் பாதுகாத்துள்ளோம். ‘இருமுறை செத்தவை’ என்ற அசாதாரணமான மூலப் பதற்றம் விளக்கிச் சமப்படுத்தப்படாமல் விடப்பட்டுள்ளது.
