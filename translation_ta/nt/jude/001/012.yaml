    text: அல்லது, “உங்கள் அன்பு விருந்துகளில் உள்ள கறைகள்” அல்லது “மாசுகள்.” கிரேக்கச் சொல் ஒழுக்கக் கறையைக் குறிக்கக்கூடும்; மறைந்திருக்கும் ஆபத்தான பாறைகளையும் குறிக்கக்கூடும். இங்கு தொடரும் தெளிவான உருவகங்களுடன் பிந்தைய பொருள் நன்கு பொருந்துகிறது.
