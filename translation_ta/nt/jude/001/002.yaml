  text: ἔλεος ὑμῖν καὶ εἰρήνη καὶ ἀγάπη πληθυνθείη.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/002.yaml
  text: May mercy and peace and love be multiplied to you[a].
translation:
  language: ta
  text: இரக்கமும் சமாதானமும் அன்பும் உங்களுக்கு மிகுதியாகப் பெருகட்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மிகுதியாகப் பெருகட்டும்’ என்பதற்கு ‘அதிகரிக்கட்டும்’ அல்லது ‘நிரம்பி வழியட்டும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεος
  choice: இரக்கம்
  rationale: கடவுளின் கருணையையும் பரிவையும் உள்ளடக்கும் இயல்பான, நிலையான தமிழ் சொல்.
- source_word: ὑμῖν
  choice: உங்களுக்கு
  rationale: ஆசீர்வாத வாழ்த்தின் திசையைச் சுட்டும் மூன்றாம் வேற்றுமை பன்மைப் பெயர்ப்பதிலியின் இயல்பான தமிழ் வடிவம்.
- source_word: εἰρήνη
  choice: சமாதானம்
  rationale: தனிப்பட்ட அமைதியையும் கடவுளுடனும் பிறருடனும் உள்ள நல்வுறவையும் உணர்த்தும் பரவலாக அறியப்பட்ட வேதாகமத் தமிழ் சொல்.
- source_word: ἀγάπη
  choice: அன்பு
  rationale: நவீன தமிழில் தெளிவானதும் ἀγάπη என்பதன் விரிந்த பொருளை தேவையின்றிக் குறுக்காததும் ஆகும்.
- source_word: πληθυνθείη
  choice: மிகுதியாகப் பெருகட்டும்
  rationale: இறைவேண்டல் சார்ந்த விருப்பத்தை ‘-ட்டும்’ வடிவம் இயல்பாக வெளிப்படுத்துகிறது; ‘பெருகு’ மூலத்தின் அதிகரிப்பு உருவகத்தைப் பாதுகாக்கிறது. ‘மிகுதியாக’ என்பது πληθύνω-வின் நிறைவான அதிகரிப்பு வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: καὶ ... καὶ ... καὶ
  choice: -உம் ... -உம் ... -உம்
  rationale: மும்முறை வரும் καί-இன் ஒழுங்கையும் கம்பீரமான திரட்சியையும் தமிழின் இணைப்பும்மை இயல்பாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: விருப்பவினை ஆசீர்வாத வாழ்த்தை மொழிபெயர்த்தல்
  choice: இரக்கமும் சமாதானமும் அன்பும் உங்களுக்கு மிகுதியாகப் பெருகட்டும்.
  alternative: இரக்கமும் சமாதானமும் அன்பும் உங்களுக்குப் பெருகுவதாக.
  rationale: ‘பெருகட்டும்’ என்பது aorist passive optative-இன் ஆசீர்வாத விருப்ப வலிமையை நவீன தமிழில் தெளிவாகக் காட்டுகிறது; செயப்படுபொருள் அமைப்பைத் தமிழில் வலுக்கட்டாயமாகப் பிரதிபலிக்காமல் மூலத்தின் அதிகரிப்பு உருவகத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ். மூன்று பெயர்ச்சொற்களிலும் இணைப்பும்மை பயன்படுத்தப்பட்டதால் கிரேக்க மூலத்தின் மீளுருவாக்கமும் ஓசைநயமும் தக்கவைக்கப்பட்டுள்ளன.
