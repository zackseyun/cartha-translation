  source_fidelity: திருத்தம் தேவை. τὸν ὅμοιον τρόπον τούτοις என்பதிலுள்ள சுட்டு விவாதத்திற்குரியது; முதன்மை உரையின் ‘இவர்களைப் போலவே’ மனிதர்களையே சுட்டும் வகையில் ஒலித்து, முன்வந்த எடுத்துக்காட்டுகளையும் உள்ளடக்கக்கூடிய கிரேக்கத் தெளிவின்மையை ஓரளவு குறுக்குகிறது. மேலும், δίκην ὑπέχουσαι என்பது πρόκεινται-யுடன் இணைந்த நிகழ்காலப் பங்கேற்பாக உள்ளது. ‘அனுபவித்து ... முன்வைக்கப்பட்டுள்ளன’ என்ற வடிவம் தண்டனை முதலில் முடிந்து, பின்னர் எடுத்துக்காட்டாக வைக்கப்பட்டன என்ற தொடர்முறையை உருவாக்குகிறது.
  naturalness: ‘வேறான மாம்சம்’ புரிந்துகொள்ளத்தக்கது; ஆனால் நவீன பொதுநடையில் ‘வேறுபட்ட மாம்சம்’ இயல்பானது. ‘எடுத்துக்காட்டாக முன்வைக்கப்பட்டுள்ளன’ என்பதற்குப் பதில் ‘எடுத்துக்காட்டாக நிற்கின்றன’ பொது வெளியில் எச்சரிக்கை எடுத்துக்காட்டாக இருக்கின்றன என்ற πρόκεινται-யின் விளைவை இயல்பாகத் தருகிறது.
  terminology: ‘பாலியல் ஒழுக்கக்கேடு,’ ‘மாம்சம்,’ ‘நித்திய நெருப்பு,’ ‘தண்டனை’ ஆகியவை பொருத்தமானவை. ‘மாம்சம்’ என்பதை விளக்கமாகக் குறுக்காமல் வைத்திருப்பது σαρκὸς ἑτέρας-இன் விவாதத்திற்குரிய பொருளை பாதுகாக்கிறது.
