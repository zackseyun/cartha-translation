  revision_rationale: திருத்தம் τούτοις-இன் விவாதத்திற்குரிய முன்னிலைச் சுட்டை நடுநிலையாக வைத்திருக்கிறது. δίκην ὑπέχουσαι-யை நிகழ்காலத் தொடர்நிலையாக மொழிபெயர்ப்பதன் மூலம், நகரங்கள் நித்திய நெருப்பின் தண்டனையை அனுபவித்துக்கொண்டே எச்சரிக்கை எடுத்துக்காட்டாக இருக்கின்றன என்ற மூல வாக்கிய அமைப்பு பாதுகாக்கப்படுகிறது. எந்தக் குறிப்பிட்ட பாலியல் அல்லது இறையியல் விளக்கமும் சேர்க்கப்படவில்லை.
