id: JUD.1.7
reference: Jude 1:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὡς Σόδομα καὶ Γόμορρα καὶ αἱ περὶ αὐτὰς πόλεις, τὸν ὅμοιον ⸂τρόπον τούτοις⸃ ἐκπορνεύσασαι καὶ ἀπελθοῦσαι ὀπίσω σαρκὸς ἑτέρας, πρόκεινται δεῖγμα πυρὸς αἰωνίου δίκην ὑπέχουσαι.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/007.yaml
  text: just as Sodom and Gomorrah and the cities around them[a], having in like manner committed sexual immorality and gone after other flesh, are set forth as an example[b], undergoing the punishment of eternal fire.
translation:
  language: ta
  text: சோதோமும் கொமோராவும் அவற்றைச் சுற்றியிருந்த நகரங்களும், அவற்றைப் போலவே[a] பாலியல் ஒழுக்கக்கேட்டில் ஈடுபட்டு, வேறுபட்ட மாம்சத்தை[b] நாடிச் சென்றன; அவை நித்திய நெருப்பின் தண்டனையை அனுபவித்துக்கொண்டு ஓர் எடுத்துக்காட்டாக நிற்கின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவற்றைப் போலவே’ என்பதில் ‘அவை’ என்பது முந்தைய வசனத்தில் கூறப்பட்ட தூதர்களைக் குறிக்கலாம்; அல்லது இதற்கு முன் சொல்லப்பட்ட கலகமும் தீர்ப்பும் பற்றிய எடுத்துக்காட்டுகளைப் பொதுவாகக் குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘வேறான மாம்சத்தை’; பாரம்பரியமாக, ‘அந்நிய மாம்சத்தை.’ இந்தச் சொற்றொடர் ஒரு குறிப்பிட்ட விளக்கத்துக்குள் குறுக்கப்படாமல் நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: அவ்வாறே
  rationale: முந்தைய எடுத்துக்காட்டுகளுடன் சோதோம், கொமோரா ஆகியவற்றை ஒப்பிடும் சொல்லாக இருப்பதால், ஒப்புமையின் தொடர்ச்சியை இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: Σόδομα καὶ Γόμορρα
  choice: சோதோமும் கொமோராவும்
  rationale: தமிழில் வழக்கிலுள்ள வேதாகம இடப்பெயர் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
- source_word: αἱ περὶ αὐτὰς πόλεις
  choice: அவற்றைச் சுற்றியிருந்த நகரங்கள்
  rationale: περί என்பதன் புவியியல் பொருளான ‘சுற்றியுள்ள’ என்பதைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: τὸν ὅμοιον τρόπον τούτοις
  choice: இவர்களைப் போலவே
  rationale: ‘இவர்களைப் போன்ற முறையில்’ என்ற ஒப்புமையைப் பாதுகாக்கிறது; τούτοις யாரைக் குறிக்கிறது என்பதை அடிக்குறிப்பில் திறந்தவாறு வைக்கிறது.
- source_word: ἐκπορνεύσασαι
  choice: பாலியல் ஒழுக்கக்கேட்டில் ஈடுபட்டு
  rationale: வினைச்சொல்லின் பாலியல் முறைகேடு சார்ந்த பொருளை மறைமுகமாக்காமல், நவீனத் தமிழில் கண்ணியமாகத் தெரிவிக்கிறது.
- source_word: ἀπελθοῦσαι ὀπίσω
  choice: நாடிச் சென்றன
  rationale: ஒரு பொருளைப் பின்தொடர்ந்து தேடிச் செல்லுதல் என்ற கிரேக்க மரபுத்தொடரின் இயக்கத்தையும் நோக்கத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: σαρκὸς ἑτέρας
  choice: வேறான மாம்சத்தை
  rationale: σάρξ என்பதற்கு ‘மாம்சம்’ என்றும் ἕτερος என்பதற்கு ‘வேறான’ என்றும் நேரடியாக மொழிபெயர்த்து, குறிப்பிட்ட ஒரு விளக்கமாகப் பொருளைக் குறுக்கவில்லை.
- source_word: πρόκεινται
  choice: முன்வைக்கப்பட்டுள்ளன
  rationale: பிறர் காணும்படி எடுத்துக்காட்டாக வைக்கப்பட்டிருக்கும் நிலையைத் தெரிவிக்கிறது.
- source_word: δεῖγμα
  choice: ஓர் எடுத்துக்காட்டு
  rationale: காண்பிக்கப்படும் மாதிரி அல்லது எச்சரிக்கும் எடுத்துக்காட்டு என்ற அடிப்படைப் பொருளை, சூழல் தானாக அதன் எச்சரிக்கைத் தன்மையை வெளிப்படுத்தும் வகையில் தருகிறது.
- source_word: πυρὸς αἰωνίου
  choice: நித்திய நெருப்பின்
  rationale: கிரேக்கச் சொற்றொடரின் வலிமையை மென்மைப்படுத்தாமலும் விரிவான கோட்பாட்டு விளக்கத்தைச் சேர்க்காமலும் நேரடியாகத் தருகிறது.
- source_word: δίκην ὑπέχουσαι
  choice: தண்டனையை அனுபவித்து
  rationale: தீர்ப்புக்குரிய தண்டனைக்கு உட்படுதல் என்ற நீதித்துறை சார்ந்த பொருளையும் பங்கேற்பு வினையின் நிலையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: τούτοις என்பதன் சுட்டுப்பொருள்
  choice: முதன்மை உரையில் ‘இவர்களைப் போலவே’ என்று ஒப்புமையை வெளிப்படையாக வைத்துக் கொண்டு, சுட்டுப்பொருளைத் தீர்மானிக்காமல் விடுதல்
  alternative: ‘முந்தைய வசனத்தில் கூறப்பட்ட தூதர்களைப் போலவே’ என்று குறிப்பாக்குதல்; அல்லது முந்தைய எல்லாக் கலக மற்றும் தீர்ப்பு எடுத்துக்காட்டுகளையும் குறிப்பதாகக் கொள்ளுதல்
  rationale: கிரேக்கத்தில் ஒப்புமை தெளிவாக இருந்தாலும், τούτοις என்பதன் சரியான முன்னிலைச் சுட்டு விவாதத்திற்குரியது. மொழிபெயர்ப்பு அந்த இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
- issue: σαρκὸς ἑτέρας என்பதன் பொருள்
  choice: ‘வேறான மாம்சம்’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘அந்நிய மாம்சம்’ என்று மொழிபெயர்த்தல்; அல்லது குறிப்பிட்ட பாலியல் நடைமுறையையோ மனிதர்–தூதர் எல்லைமீறலையோ விளக்கமாகச் சேர்த்தல்
  rationale: இந்தச் சொற்றொடரின் துல்லியமான சுட்டுப்பொருள் விவாதத்திற்குரியது. கிரேக்க உரை கூறுவதைவிடக் குறுகிய ஒரு கோட்பாட்டு முடிவை மொழிபெயர்ப்பில் சேர்க்காமல், அதன் இயல்பான தெளிவின்மையைப் பாதுகாக்கிறது.
- issue: πυρὸς αἰωνίου என்பதன் வலிமை
  choice: ‘நித்திய நெருப்பு’ என்று உரையின் சொந்த வெளிப்பாட்டைத் தக்கவைத்தல்
  alternative: ‘என்றென்றைக்கும் எரியும் நெருப்பு’ என்று விரிவாக்குதல்
  rationale: தீர்ப்பின் தீவிரத்தை மென்மைப்படுத்தாமலும், இவ்வசனம் கூறுவதற்கு அப்பாற்பட்ட முழுமையான மறுமைத் தண்டனைக் கோட்பாட்டைச் சேர்க்காமலும் உள்ளது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, கண்ணியமான பொதுநடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியம் தமிழில் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், காரணம், தண்டனை, எடுத்துக்காட்டு ஆகிய கருத்துத் தொடர்புகள் பாதுகாக்கப்பட்டுள்ளன. ‘மாம்சம்’ என்பது இங்கு திட்டமிட்டே நேரடி மொழிபெயர்ப்பாக வைக்கப்பட்டுள்ளது.
