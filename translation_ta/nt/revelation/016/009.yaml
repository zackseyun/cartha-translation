reference: Revelation 16:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐκαυματίσθησαν οἱ ἄνθρωποι καῦμα μέγα· καὶ ⸀ἐβλασφήμησαν τὸ ὄνομα τοῦ θεοῦ τοῦ ἔχοντος ⸀τὴν ἐξουσίαν ἐπὶ τὰς πληγὰς ταύτας, καὶ οὐ μετενόησαν δοῦναι αὐτῷ δόξαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/009.yaml
  text: And the people were scorched with great heat[a], and they blasphemed the name of God, who has authority over these plagues[b], and they did not repent to give him glory.
translation:
  language: ta
  text: மனிதர்கள்[a] கடும் வெப்பத்தால் சுட்டெரிக்கப்பட்டார்கள். இந்த வாதைகள்மேல் அதிகாரம் கொண்ட கடவுளின் பெயரை அவர்கள் தூஷித்தார்கள்; அவருக்கு மகிமை செலுத்துமாறு மனந்திரும்பவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்குள்ள கிரேக்கச் சொல் ஆண்பால் வடிவில் இருந்தாலும், ஆண்களை மட்டும் அல்லாமல் மக்களைப் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκαυματίσθησαν
  choice: சுட்டெரிக்கப்பட்டார்கள்
  rationale: இச்செயப்பாட்டு வினை, வெப்பத்தால் கடுமையாக எரிக்கப்பட்டதைத் தெரிவிக்கிறது. ‘சுட்டெரிக்கப்பட்டார்கள்’ என்பது வாதையின் சூழலில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: οἱ ἄνθρωποι
  choice: மனிதர்கள்
  rationale: இங்கு ஆண்களை மட்டும் அல்லாமல் மனிதர்களைப் பொதுவாகக் குறிக்கிறது; எனவே பாலின வரம்பைத் தவறாக ஏற்படுத்தாத பொதுப்பொருள் தேர்ந்தெடுக்கப்பட்டது.
- source_word: καῦμα μέγα
  choice: கடும் வெப்பத்தால்
  rationale: μέγα இங்கு அளவைவிட வெப்பத்தின் தீவிரத்தைச் சுட்டுகிறது; கருவி அல்லது காரணப் பொருளையும் தமிழ் வேற்றுமை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐβλασφήμησαν
  choice: தூஷித்தார்கள்
  rationale: கடவுளின் பெயரைக் குறித்த இழிவான, அவமதிப்பான பேச்சை மதச்சார்ந்த வலிமையுடன் வெளிப்படுத்துகிறது.
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: கடவுளின் பெயரை
  rationale: கடவுளின் வெளிப்பட்ட அடையாளத்தையும் மாண்பையும் குறிக்கும் வேதாகமச் சொல்லாட்சியை நேரடியாகப் பாதுகாக்கிறது.
- source_word: τοῦ ἔχοντος τὴν ἐξουσίαν ἐπὶ τὰς πληγὰς ταύτας
  choice: இந்த வாதைகள்மேல் அதிகாரம் கொண்ட
  rationale: நிகழ்காலப் பங்கேற்புச் சொல்லின் தொடரும் தன்மையையும், ἐξουσία என்பதன் அதிகாரப் பொருளையும் தெளிவாகக் காக்கிறது.
- source_word: πληγὰς
  choice: வாதைகள்
  rationale: வெளிப்படுத்தின விசேஷத்திலும் யாத்திராகமப் பின்னணியிலும் தெய்வீகத் தீர்ப்பாக வரும் plagues என்பதற்கான நிலைபெற்ற, பொருத்தமான தமிழ் சொல்.
- source_word: οὐ μετενόησαν
  choice: மனந்திரும்பவில்லை
  rationale: தீர்ப்பின் சூழலில் வெறும் கருத்துமாற்றத்தை அல்லாமல் ஒழுக்க மற்றும் ஆன்மீகத் திரும்புதலைக் குறிக்கிறது.
- source_word: δοῦναι αὐτῷ δόξαν
  choice: அவருக்கு மகிமை செலுத்துமாறு
  rationale: மனந்திரும்புதலுடன் தொடர்புடைய எதிர்பார்க்கப்பட்ட விளைவை இயல்பான தமிழில் காட்டி, கடவுளுக்கு மகிமை கொடுக்கும் வேதாகமக் கருத்தை நிலைநிறுத்துகிறது.
theological_decisions:
- issue: οἱ ἄνθρωποι என்ற ஆண்பால் பன்மையின் வரம்பு
  choice: மனிதகுலத்தைப் பொதுவாகக் குறிக்கும் ‘மனிதர்கள்’
  alternative: ஆண்கள்
  rationale: சூழல் ஆண்களை மட்டும் தனிப்படுத்தவில்லை; தீர்ப்புக்குள்ளான மக்களைப் பொதுவாகக் குறிக்கிறது.
- issue: வாதைகள்மேல் கடவுளுக்குள்ள அதிகாரம்
  choice: கடவுள் இந்த வாதைகள்மேல் அதிகாரம் கொண்டவர் என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: கடவுள் வாதைகளுடன் தொடர்புடையவர் என்று மென்மைப்படுத்துதல்
  rationale: மூலவாக்கியம் கடவுளுக்கு வாதைகள்மேல் ἐξουσία இருப்பதாக வெளிப்படையாகக் கூறுகிறது; அதை விரிவாக்காமலும் மென்மைப்படுத்தாமலும் காக்கிறது.
- issue: δοῦναι αὐτῷ δόξαν என்பதற்கும் மனந்திரும்புதலுக்கும் உள்ள தொடர்பு
  choice: ‘அவருக்கு மகிமை செலுத்துமாறு மனந்திரும்பவில்லை’
  alternative: ‘மனந்திரும்பவும் அவருக்கு மகிமை செலுத்தவும் இல்லை’
  rationale: மூலத்தில் இரு இணை வினைகள் இல்லை; மகிமை செலுத்துதல் மனந்திரும்புதலோடு சார்ந்த இலக்கு அல்லது விளைவாக வைக்கப்பட்டுள்ளது. தமிழ் மொழிபெயர்ப்பு அந்தத் தொடர்பைத் திறந்தவாறே காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சுட்டெரிக்கப்பட்டார்கள்,’ ‘தூஷித்தார்கள்,’ ‘மனந்திரும்பவில்லை’ ஆகியவை மூலத்தின் தீவிரத்தையும் வேதாகமத் தொனியையும் காக்கின்றன; தேவையற்ற சமயப்பிரிவு சார்ந்த விளக்கங்கள் சேர்க்கப்படவில்லை.
