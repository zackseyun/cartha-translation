id: REV.16.3
reference: Revelation 16:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ὁ ⸀δεύτερος ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τὴν θάλασσαν· καὶ ἐγένετο αἷμα ὡς νεκροῦ, καὶ πᾶσα ψυχὴ ⸀ζωῆς ἀπέθανεν ⸀τὰ ἐν τῇ θαλάσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/003.yaml
  text: And the second poured out his bowl into the sea[a], and it became blood like that of a dead man, and every living creature in the sea died.
translation:
  language: ta
  text: இரண்டாமவர் தமது கிண்ணத்தைக் கடலுக்குள் ஊற்றினார். கடல் இறந்த மனிதனின் இரத்தம்போல்[a] இரத்தமாகியது; கடலில் இருந்த எல்லா உயிரினங்களும் இறந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பிணத்திலிருந்து வந்த இரத்தம்போல்’; கிரேக்கத்தில் சொற்சொல்லாக, ‘இறந்த மனிதனுடையதைப்போன்ற இரத்தம்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: இரண்டாமவர்
  rationale: உடனடியான சூழலில் இது இரண்டாவது தூதரைக் குறிக்கிறது; ஆனால் இவ்வசனத்தில் ‘தூதர்’ என்ற பெயர்ச்சொல் வெளிப்படையாக இல்லாததால், கிரேக்கத்தின் சுருக்கமான அமைப்பைத் தமிழிலும் காக்கிறது.
- source_word: ἐξέχεεν
  choice: ஊற்றினார்
  rationale: கிண்ணத்தின் உள்ளடக்கத்தைக் கொட்டும் செயலை இயல்பாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: φιάλην
  choice: கிண்ணம்
  rationale: φιάλη என்பது அகன்ற, ஆழம் குறைந்த பாத்திரத்தைக் குறிக்கிறது; தமிழில் ‘கிண்ணம்’ அந்தக் காட்சியைத் தெளிவாக வழங்குகிறது.
- source_word: εἰς τὴν θάλασσαν
  choice: கடலுக்குள்
  rationale: εἰς குறிக்கும் உட்புறத்தை நோக்கிய இயக்கத்தைப் பாதுகாக்கிறது.
- source_word: ἐγένετο αἷμα
  choice: இரத்தமாகியது
  rationale: ‘இரத்தமாக மாறியது’ என்ற கருத்தைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்தி, வெறும் தோற்றமாக மென்மைப்படுத்தாமல் காக்கிறது.
- source_word: ὡς νεκροῦ
  choice: இறந்த ஒருவரின் இரத்தத்தைப்போல
  rationale: νεκροῦ என்பதன் ஒருமையையும், ஒப்பிடப்படுவது இறந்தவருக்குரிய இரத்தம் என்பதையும் தெளிவுபடுத்துகிறது; ‘பிணம்’ என்பதைவிட மூலத்தின் மனிதக் குறிப்பை நேரடியாகப் பேணுகிறது.
- source_word: πᾶσα ψυχὴ ζωῆς
  choice: உயிருள்ள படைப்புகள் அனைத்தும்
  rationale: கடல்வாழ் உயிரினங்களைக் குறிக்கும் செமித்தியத் தன்மையுள்ள சொற்றொடரை நவீன தமிழில் இயல்பாகத் தருகிறது; இங்கு தவறாகப் புரிந்துகொள்ளக்கூடிய ‘ஆத்துமா’ என்பதைத் தவிர்க்கிறது.
- source_word: ἀπέθανεν
  choice: இறந்தன
  rationale: வினையின் எளிய, நேரடியான பொருளைத் தருகிறது.
- source_word: τὰ ἐν τῇ θαλάσσῃ
  choice: கடலில் இருந்த
  rationale: முன்னர் கூறப்பட்ட உயிருள்ள படைப்புகளை இடவியல் அடைமொழியாக இயல்பான தமிழில் வரையறுக்கிறது.
theological_decisions:
- issue: வாதையின் காட்சியில் கடல் இரத்தமாதல்
  choice: கடல் இரத்தமாகியது என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: அது இரத்தத்தைப்போல் தோன்றியது என்று மொழிபெயர்த்தல்
  rationale: கிரேக்கம் ‘இரத்தமாகியது’ என்று கூறி, அந்த இரத்தத்தின் தன்மையையே இறந்த ஒருவரின் இரத்தத்தோடு ஒப்பிடுகிறது. ஆகவே தரிசனத்தின் கடுமையான நியாயத்தீர்ப்புக் காட்சியை வெறும் தோற்றமாகத் தணிக்காமல் காக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இரண்டாமவர்’ என்பது மூலத்தில் இல்லாத ‘தூதர்’ என்ற சொல்லைச் சேர்க்காமல் சூழல் குறிப்பைக் காக்கிறது. அடிக்குறி குறியீடு [a] உரையில் இடம்பெற்றுள்ளது.
