id: REV.16.19
reference: Revelation 16:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἡ πόλις ἡ μεγάλη εἰς τρία μέρη, καὶ αἱ πόλεις τῶν ἐθνῶν ἔπεσαν· καὶ Βαβυλὼν ἡ μεγάλη ἐμνήσθη ἐνώπιον τοῦ θεοῦ δοῦναι αὐτῇ τὸ ποτήριον τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/019.yaml
  text: And the great city was split into three parts[a], and the cities of the nations fell. And Babylon the great was remembered before God, to give her the cup of the wine of the fury of his wrath.
translation:
  language: ta
  text: அந்தப் பெரிய நகரம் மூன்று பகுதிகளாகப் பிளவுண்டது; நாடுகளின் நகரங்கள் விழுந்தன. பெரும் பாபிலோன் கடவுளின் முன்னிலையில் நினைவுகூரப்பட்டது[a]; அவருடைய கோபத்தின் சீற்றத் திராட்சரசக் கிண்ணத்தை அவளுக்குக் கொடுப்பதற்காக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல் எனில், “கடவுளின் முன்னிலையில் நினைவுக்கு வந்தது.” நியாயத்தீர்ப்பிற்காக ஒருவர் கடவுளின் கவனத்துக்கு வந்ததைக் குறிக்கும் வேதாகம மரபுத்தொடர் இது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ... εἰς τρία μέρη
  choice: மூன்று பகுதிகளாகப் பிளவுண்டது
  rationale: சொல்லுக்குச் சொல் எனில் ‘மூன்று பகுதிகளானது.’ இங்கு εἰς உடன் வரும் அமைப்பு விளைவாக ஏற்பட்ட பிரிவைக் குறிப்பதால், இயல்பான தமிழில் ‘பிளவுண்டது’ என்று தரப்பட்டுள்ளது.
- source_word: ἡ πόλις ἡ μεγάλη
  choice: அந்தப் பெரிய நகரம்
  rationale: முன்னரே காட்சியில் உள்ள குறிப்பிட்ட நகரத்தைக் குறிக்கும் இரட்டைத் திட்டவட்டச் சுட்டை இயல்பான தமிழில் ‘அந்த’ என்பதன் மூலம் உணர்த்துகிறது.
- source_word: αἱ πόλεις τῶν ἐθνῶν
  choice: நாடுகளின் நகரங்கள்
  rationale: ἔθνη என்பதற்கு இவ்வுலகளாவிய நியாயத்தீர்ப்புச் சூழலில் ‘நாடுகள்’ என்பது இயல்பானதும் தேவையற்ற சமய இனப்பிரிவைத் தவிர்ப்பதும் ஆகும்.
- source_word: ἔπεσαν
  choice: விழுந்தன
  rationale: மூலத்தின் சுருக்கமான, தீவிரமான வெளிப்பாட்டைப் பாதுகாக்கிறது; ‘இடிந்து விழுந்தன’ என்று விளக்கமாக்கவில்லை.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: மகா பாபிலோன்
  rationale: வெளிப்படுத்தலில் மீண்டும் வரும் அடைமொழிப் பெயரைத் தெளிவாகவும் மேன்மையான நடையிலும் தருகிறது.
- source_word: ἐμνήσθη ἐνώπιον τοῦ θεοῦ
  choice: கடவுளின் முன்னிலையில் நினைவுகூரப்பட்டது
  rationale: நியாயத்தீர்ப்பிற்காகக் கடவுளின் கவனத்துக்கு வருவதைக் குறிக்கும் வேதாகம மரபுத்தொடரை விளக்கவுரையாக மாற்றாமல் பாதுகாக்கிறது.
- source_word: δοῦναι αὐτῇ
  choice: அவளுக்குக் ... கொடுப்பதற்காக
  rationale: இறுதியில் வரும் வினையெச்சத்தின் நோக்கப் பொருளைத் தமிழில் தெளிவுபடுத்துகிறது; பாபிலோன் பெண்ணாக உருவகிக்கப்படுவதை ‘அவளுக்கு’ பாதுகாக்கிறது.
- source_word: τὸ ποτήριον τοῦ οἴνου
  choice: திராட்சரசம் நிறைந்த கிண்ணம்
  rationale: கிரேக்க மரபுத்தொடரின் உருவகத்தைத் தக்கவைத்தபடி, தமிழில் இயல்பற்ற பல உருபுச் சங்கிலியைத் தவிர்த்து அதன் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: τοῦ θυμοῦ τῆς ὀργῆς αὐτοῦ
  choice: தமது கடுங்கோபத்தின் சீற்றம்
  rationale: θυμός மற்றும் ὀργή ஆகிய இரு தொடர்புடைய சொற்களையும் முறையே ‘சீற்றம்,’ ‘கடுங்கோபம்’ என வேறுபடுத்தி, மூலத்தின் தீவிரப்படுத்தலைப் பாதுகாக்கிறது. கடவுளைக் குறிக்கும் பதிலிடுபெயராக மரியாதை ஒருமையான ‘தமது’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: ἐμνήσθη ἐνώπιον τοῦ θεοῦ என்ற நியாயத்தீர்ப்பு மரபுத்தொடர்
  choice: கடவுளின் முன்னிலையில் நினைவுகூரப்பட்டது
  alternative: நியாயத்தீர்ப்பிற்காகக் கடவுளின் கவனத்துக்கு வந்தது
  rationale: மாற்று வடிவம் சூழல்பொருளை வெளிப்படையாக விளக்கினாலும், அது மூலத்தில் மறைமுகமாக இருக்கும் நியாயத்தீர்ப்புக் கருத்தை மொழிபெயர்ப்பிலேயே தீர்மானித்துவிடும். தேர்ந்த வடிவம் மரபுத்தொடரையும் அதன் இறையியல் அழுத்தத்தையும் பாதுகாக்கிறது.
- issue: θυμός மற்றும் ὀργή ஆகிய இரு கோபச் சொற்களின் தொடர்பு
  choice: கடுங்கோபத்தின் சீற்றம்
  alternative: உக்கிரமான கோபம்
  rationale: இரு கிரேக்கச் சொற்களையும் ஒரே தமிழ்ச் சொல்லாகச் சுருக்காமல், ஒன்றுக்குள் ஒன்று அமைந்த தீவிரப்படுத்தலாகத் தருகிறது.
- issue: பாபிலோனைப் பெண்ணாக உருவகித்தல்
  choice: அவளுக்கு
  alternative: அதற்கு
  rationale: αὐτῇ என்ற பெண்பால் வடிவத்தையும் வெளிப்படுத்தலில் பாபிலோன் பெண்ணாக உருவகிக்கப்படும் இலக்கிய அம்சத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் இயல்பாகவும், வெளிப்படுத்தலின் கம்பீரமான நியாயத்தீர்ப்பு நடையைப் பாதுகாக்கும் வகையிலும் அமைக்கப்பட்டுள்ளது. ‘மகா பாபிலோன்,’ ‘கிண்ணம்,’ ‘சீற்றம்,’ ‘கடுங்கோபம்’ ஆகியவை அபோகலிப்திய உருவகங்களையும் முக்கியச் சொல் வேறுபாடுகளையும் தக்கவைக்கின்றன.
