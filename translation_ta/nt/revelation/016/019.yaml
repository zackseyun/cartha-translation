revisions:
- from: அந்தப் பெரிய நகரம் மூன்று பகுதிகளாகப் பிளவுண்டது; நாடுகளின் நகரங்கள் விழுந்தன. மகா பாபிலோன் கடவுளின் முன்னிலையில் நினைவுகூரப்பட்டது[a]; அவளுக்குத் தமது கடுங்கோபத்தின் சீற்றமாகிய திராட்சரசம் நிறைந்த கிண்ணத்தைக் கொடுப்பதற்காகவே இவ்வாறு நிகழ்ந்தது.
  to: அந்தப் பெரிய நகரம் மூன்று பகுதிகளாகப் பிளவுண்டது; நாடுகளின் நகரங்கள் விழுந்தன. பெரும் பாபிலோன் கடவுளின் முன்னிலையில் நினைவுகூரப்பட்டது[a]; அவருடைய கோபத்தின் சீற்றத் திராட்சரசக் கிண்ணத்தை அவளுக்குக் கொடுப்பதற்காக.
  rationale: The revision removes unsupported explanatory material, preserves the Greek purpose infinitive, and renders the cup-and-wine genitive chain without introducing “filled with.” It also maintains the distinct force of θυμός (“சீற்றம்”) and ὀργή (“கோபம்”), as well as Babylon's feminine personification.
