id: REV.16.7
reference: Revelation 16:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἤκουσα τοῦ θυσιαστηρίου λέγοντος· Ναί, κύριε, ὁ θεός, ὁ παντοκράτωρ, ἀληθιναὶ καὶ δίκαιαι αἱ κρίσεις σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/007.yaml
  text: And I heard the altar saying[a], “Yes, Lord God, the Almighty, true and just are your judgments.”
translation:
  language: ta
  text: 'மேலும், பலிபீடம் பேசுவதை நான் கேட்டேன்[a]: “ஆம், ஆண்டவரே, இறைவனே, எல்லாம் வல்லவரே, உமது தீர்ப்புகள் உண்மையானவையும் நீதியானவையும் ஆகும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பலிபீடத்திலிருந்து பேசுவதைக் கேட்டேன்.” யோவான் கேட்டது எங்கிருந்து வந்தது என்பதை கிரேக்க வேற்றுமை வடிவம் குறிக்கக்கூடும்; எனினும், பலிபீடமே பேசுவதாகச் சொற்கள் அமைந்திருப்பதே மிகவும் இயல்பான வாசிப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσα
  choice: நான் கேட்டேன்
  rationale: ἀκούω என்பதன் இறந்தகால நிகழ்வை இயல்பாகக் குறிக்கிறது; வேண்டுமென்றே கவனித்துக் கேட்டதாக உரையில் இல்லாத கருத்தைச் சேர்ப்பதில்லை.
- source_word: τοῦ θυσιαστηρίου λέγοντος
  choice: பலிபீடம் சொல்வதை
  rationale: பலிபீடத்தையே பேசுபவையாகக் காட்டும் வெளிப்படுத்தின விசேஷத்தின் உயிரோட்டமான உருவகத்தைப் பாதுகாக்கிறது; மூலத்தில் இல்லாத ‘குரல்’ என்ற சொல்லைச் சேர்ப்பதில்லை.
- source_word: Ναί
  choice: ஆம்
  rationale: உறுதியான உடன்பாட்டையும் பதிலளிக்கும் தன்மையையும் தெளிவாக வெளிப்படுத்தும் இயல்பான தமிழ் சொல்.
- source_word: κύριε, ὁ θεός, ὁ παντοκράτωρ
  choice: ஆண்டவராகிய இறைவனே, எல்லாம் வல்லவரே
  rationale: நேரடி அழைப்பில் வரும் மூன்று இறைப்பட்டங்களையும் இயல்பான, கண்ணியமான தமிழில் பாதுகாக்கிறது.
- source_word: ἀληθιναὶ καὶ δίκαιαι
  choice: உண்மையானவையும் நீதியானவையும்
  rationale: தீர்ப்புகள் நம்பத்தக்க உண்மைக்கு ஒத்தவையாகவும் நீதிக்கு ஏற்றவையாகவும் இருப்பதைப் predicate adjectives ஆகப் பாதுகாக்கிறது.
- source_word: αἱ κρίσεις σου
  choice: உமது தீர்ப்புகள்
  rationale: κρίσεις என்பதன் நீதித்துறைச் சார்ந்த பொருளைச் சுருக்கமாகவும் மரியாதையான இரண்டாம் நபர் வடிவிலும் தருகிறது.
theological_decisions:
- issue: பலிபீடம் பேசுவதாக உருவகப்படுத்துதல்
  choice: பலிபீடம் சொல்வதை நான் கேட்டேன்
  alternative: பலிபீடத்திலிருந்து சொல்லப்படுவதை நான் கேட்டேன்
  rationale: τοῦ θυσιαστηρίου என்பது கேட்டதன் மூலத்தைக் குறிக்கக்கூடிய வேற்றுமை வடிவமாக இருந்தாலும், λέγοντος உடன் சேர்ந்து பலிபீடத்தையே பேசுபவையாகக் காட்டுவது மிகவும் இயல்பான வாசிப்பு. மாற்று வாய்ப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: நேரடி அழைப்பிலுள்ள இறைப்பட்டங்கள்
  choice: ஆண்டவராகிய இறைவனே, எல்லாம் வல்லவரே
  alternative: ஆண்டவரே, இறைவனே, எல்லாம் வல்லவரே
  rationale: κύριε, ὁ θεός, ὁ παντοκράτωρ என்ற மூன்று கூறுகளையும் விடாமல், தமிழில் அவற்றின் ஒரே நபரைக் குறிக்கும் இணைப்பை இயல்பாக வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘உமது’ என்பது இறைவனிடம் பேசும் சூழலுக்கேற்ற மரியாதை வடிவம். வெளிப்படுத்தின விசேஷத்தின் உருவக மொழி எளிமைப்படுத்தப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
