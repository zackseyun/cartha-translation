revisions:
- from: 'மேலும், பலிபீடம் சொல்வதை நான் கேட்டேன்[a]: “ஆம், ஆண்டவராகிய இறைவனே, எல்லாம் வல்லவரே, உமது தீர்ப்புகள் உண்மையானவையும் நீதியானவையும் ஆகும்.”'
  to: 'மேலும், பலிபீடம் பேசுவதை நான் கேட்டேன்[a]: “ஆம், ஆண்டவரே, இறைவனே, எல்லாம் வல்லவரே, உமது தீர்ப்புகள் உண்மையானவையும் நீதியானவையும் ஆகும்.”'
  rationale: The revision makes the personified speech idiomatic in modern Tamil, presents all three divine titles explicitly in direct address, and refines the footnote alternative so that it represents the Greek genitive's possible source nuance without introducing an impersonal passive sense.
