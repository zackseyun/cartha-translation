- source_word: τὰ ἱμάτια αὐτοῦ
  choice: தன் ஆடைகளை
  rationale: உடை என்ற concrete image-ஐத் தக்கவைத்து, வெளிப்படுத்தலில் இருக்கக்கூடிய குறியீட்டு ஒலிப்பையும் விளக்கமாக விரித்துரைக்காமல் விடுகிறது.
- source_word: ἵνα μὴ
  choice: '... நடமாடாமலும் ... காணாமலும் இருப்பதற்காக'
