  rationale: எதிர்பாராத வருகையைச் சுட்டும் உவமையைத் தக்கவைக்கிறது; வருகிறவரை ஒழுக்க ரீதியில் திருடனோடு ஒப்பிடுவதாகப் பொருள் கூட்டவில்லை.
- source_word: μακάριος
  choice: ஆசீர்வதிக்கப்பட்டவன்
  rationale: பேறுபெற்ற நிலையைச் சுட்டும் வாழ்த்துரையின் இறையியல் நிறையைத் தக்கவைக்கிறது; வெறும் மனமகிழ்ச்சியாகக் குறுக்கவில்லை.
- source_word: ὁ γρηγορῶν
  choice: விழித்திருந்து
  rationale: சொல்லின் நேரடியான விழிப்புநிலையையும் அதன் சூழல்சார் விழிப்புணர்வு பொருளையும் ஒருங்கே எடுத்துரைக்கிறது.
