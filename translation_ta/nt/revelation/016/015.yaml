base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/015.yaml
  text: Behold[a], I am coming like a thief. Blessed is the one who stays awake and keeps his garments[b], so that he may not walk about naked and they see his shame—
translation:
  language: ta
  text: இதோ, நான் திருடனைப்போல் வருகிறேன். விழித்திருந்து[a] தன் ஆடைகளைப் பாதுகாத்துக்கொள்கிறவன் பேறுபெற்றவன்; அவன் நிர்வாணமாக நடமாடவும், அவனுடைய வெட்கக்கேட்டை[b] அவர்கள் காணவும் நேராதபடிக்கு—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘விழிப்புடன் இருப்பவன்’ / ‘காவல் காப்பவன்’.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவமானத்தை’; கிரேக்கச் சொல் வெட்கக்கேடான வெளிப்பாட்டையும் குறிக்கலாம்.
    reason: lexical_alternative
