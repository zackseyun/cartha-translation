  rationale: நிர்வாணமாகச் சுற்றி நடக்கும் தெளிவான காட்சியை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: βλέπωσιν
  choice: அவர்கள் காணாமலும்
  rationale: மூலத்தில் வெளிப்படையாக அடையாளப்படுத்தப்படாத மூன்றாம் நபர் பன்மை எழுவாயை ‘அவர்கள்’ என்று குறிப்பிடாமல் விடாமல், அதே சமயம் அது யாரைக் குறிக்கிறது என்று தீர்மானிக்காமல் தக்கவைக்கிறது.
- source_word: ἀσχημοσύνην αὐτοῦ
  choice: அவனுடைய அவமானத்தை
  rationale: வெட்கக்கேடான வெளிப்பாடும் அதனால் உண்டாகும் மானக்கேடும் ஆகிய பொருள் பரப்பை இயல்பான தமிழில் எடுத்துரைக்கிறது; நிர்வாணம் என்ற முந்தைய சொல்லை அப்படியே மீண்டும் கூறுவதில்லை.
theological_decisions:
- issue: வெளிப்படுத்தல் சூழலில் ஆடைகள், நிர்வாணம் ஆகியவற்றின் உருவகப் பொருள்
  choice: ‘ஆடைகள்’, ‘நிர்வாணமாக’, ‘அவமானம்’ என்ற நேரடியான காட்சிமொழியை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ஆடைகளை ஒழுக்க ஆயத்தம் அல்லது நீதியான செயல்கள் என்றும், நிர்வாணத்தை இறுதிக்கால அவமானம் என்றும் மொழிபெயர்ப்பிலேயே விளக்குதல்
  rationale: இந்தக் காட்சிக்கு நூலின் சூழலில் குறியீட்டுப் பொருள் இருக்கலாம்; ஆனால் கிரேக்க உரை அதை நேரடியான காட்சியாகவே வழங்குகிறது. ஆகவே உருவகத்தை விளக்கி முடிவுசெய்யாமல் அதன் இறையியல் அழுத்தத்தையும் திறந்த தன்மையையும் தக்கவைக்கிறது.
- issue: ஆண்பால் ஒருமை பிரதிநிதித்துவக் குறிப்பு
  choice: ‘கிறவன்’, ‘அவன்’, ‘அவனுடைய’ என்ற ஒருமை ஆண்பால் வடிவங்களைத் தக்கவைத்தல்
  alternative: பன்மையாக மாற்றுதல் அல்லது பாலினம் குறிப்பிடாத வகையில் மறுகட்டமைத்தல்
  rationale: கிரேக்கப் பங்கேற்பு வடிவம் இலக்கண ரீதியில் ஆண்பால் ஒருமையாக இருந்து பிரதிநிதித்துவப் பொருள் தருகிறது; தமிழிலும் அந்த வடிவத்தைத் துல்லியமாகத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வெளிப்படுத்தல் நூலின் கம்பீரமான எச்சரிக்கைத் தொனியைத் தக்கவைக்கும் நடை. ‘திருடனைப்போல்’ என்பது இயல்பான உவமை; ‘ஆசீர்வதிக்கப்பட்டவன்’ வாழ்த்துரை நடையைப் பாதுகாக்கிறது. இறுதியில் உள்ள நீண்ட கோடு, மூல உரையில் கூற்று தொடர்வதை அல்லது திடீரென இடைநிற்பதைப் பிரதிபலிக்கத் தக்கவைக்கப்பட்டுள்ளது.
