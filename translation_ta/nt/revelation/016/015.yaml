  rationale: கவனத்தை ஈர்க்கும் இடைச்சொல்லின் வலிமையையும் வெளிப்படுத்தல் நூலுக்குரிய கம்பீரமான எச்சரிக்கைத் தொனியையும் இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: ἔρχομαι
  choice: நான் ... வருகிறேன்
  rationale: நிகழ்கால வடிவத்தின் உயிரோட்டத்தையும் அண்மையில் நிகழவிருக்கும் வருகையின் உணர்வையும் தக்கவைக்கிறது.
- source_word: ὡς κλέπτης
