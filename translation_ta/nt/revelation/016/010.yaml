id: REV.16.10
reference: Revelation 16:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ὁ πέμπτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν θρόνον τοῦ θηρίου· καὶ ἐγένετο ἡ βασιλεία αὐτοῦ ἐσκοτωμένη, καὶ ἐμασῶντο τὰς γλώσσας αὐτῶν ἐκ τοῦ πόνου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/010.yaml
  text: And the fifth poured out his bowl on the throne of the beast[a], and its kingdom became darkened, and they were gnawing their tongues because of the pain[b],
translation:
  language: ta
  text: ஐந்தாமவர் தமது கிண்ணத்தை மிருகத்தின் அரியணைமேல் ஊற்றினார். அப்போது அதன் இராச்சியம் இருளடைந்தது[a]. அவர்கள் வலியின் காரணமாகத் தங்கள் நாவுகளை மென்றுகொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இருளால் மூடப்பட்டது.”
    reason: ἐσκοτωμένη என்ற செயப்பாட்டு வடிவத்தின் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: ὁ πέμπτος
  choice: ஐந்தாமவர்
  rationale: கிரேக்கத்தில் ‘ஐந்தாவது’ என்ற வரிசை எண்ணே பெயர்ச்சொல் போல வந்துள்ளது; ‘தேவதூதர்’ என்பது சூழலில் புரிந்தாலும் இவ்வசனத்தில் வெளிப்படையாக இல்லை. தமிழில் நபரைக் குறிக்கும் இயல்பான வடிவமாக ‘ஐந்தாமவர்’ பயன்படுத்தப்பட்டது.
- source_word: ἐξέχεεν τὴν φιάλην αὐτοῦ
  choice: தமது கிண்ணத்தை ஊற்றினார்
  rationale: ἐκχέω என்பதன் வழக்கமான பொருளை ‘ஊற்றினார்’ என்றும், φιάλη குறிக்கும் அகன்ற பாத்திரத்தை நவீன தமிழில் தெளிவாக ‘கிண்ணம்’ என்றும் மொழிபெயர்க்கிறது.
- source_word: ἐπὶ τὸν θρόνον τοῦ θηρίου
  choice: மிருகத்தின் அரியணைமேல்
  rationale: ἐπί உடன் வரும் திசை/இடப் பொருளை ‘மேல்’ நேரடியாகத் தருகிறது; வெளிப்படுத்தின விசேஷத்தின் தரிசன உருவகத்தை ‘மிருகம்’ காக்கிறது.
- source_word: ἡ βασιλεία αὐτοῦ
  choice: அதன் அரசு
  rationale: βασιλεία இங்கு மிருகத்தின் ஆட்சி அல்லது ஆளுகைக்குட்பட்ட அரசைக் குறிக்கிறது. ‘அதன்’ என்பது θηρίον என்ற முன்னோடியை இயல்பாகச் சுட்டுகிறது; தமிழில் இலக்கணப் பாலினச் சிக்கலை ஏற்படுத்தாது.
- source_word: ἐσκοτωμένη
  choice: இருளடைந்தது
  rationale: முன்னர் நிகழ்ந்த செயலின் விளைவாக இருண்ட நிலையில் ஆனதை இந்த இயல்பான தமிழ் வினை வெளிப்படுத்துகிறது; கிரேக்கத்தில் இல்லாத கூடுதல் உருவகத்தைச் சேர்ப்பதில்லை.
- source_word: ἐμασῶντο τὰς γλώσσας αὐτῶν
  choice: தங்கள் நாவுகளைக் கடித்துக்கொண்டிருந்தார்கள்
  rationale: இறந்தகாலத்தில் தொடர்ந்து நடந்த செயலை கிரேக்க முற்றா இறந்தகாலம் காட்டுகிறது. ‘கடித்துக்கொண்டிருந்தார்கள்’ அந்த நீடித்த செயலையும் கடும் வேதனையின் இயல்பான தமிழ் வெளிப்பாட்டையும் தருகிறது.
- source_word: ἐκ τοῦ πόνου
  choice: வலியின் காரணமாக
  rationale: ἐκ இங்கு காரணத்தைக் குறிப்பதால், தெளிவான நவீன தமிழில் காரண உறவு வெளிப்படையாகத் தரப்பட்டது.
theological_decisions:
- issue: மிருகத்துக்கும் அரசுக்கும் உள்ள உடைமை உறவு
  choice: அதன் அரசு
  alternative: மிருகத்தின் அரசு
  rationale: கிரேக்க αὐτοῦ முன்னர் வந்த மிருகத்தையே சுட்டுகிறது. ‘அதன்’ இதைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது; மிருகத்தை மனித ஆளாகத் தனியே விளக்குவதில்லை.
- issue: இருள் தீர்ப்பின் சொல்லாக்கத் தீவிரம்
  choice: இருளடைந்தது
  alternative: இருளால் மூடப்பட்டது
  rationale: கிரேக்கப் பங்கேற்பு வினை ஏற்பட்ட இருண்ட நிலையைச் சொல்கிறது. ‘இருளடைந்தது’ அதைப் பெருக்கமின்றிக் காக்கிறது; மாற்று வடிவம் செயப்பாட்டு நுணுக்கத்தை அதிகம் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், தரிசன உரைக்கு ஏற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டது. மூலத்தில் இல்லாத ‘தேவதூதர்’ சேர்க்கப்படவில்லை. ‘மக்கள்’ என்பது பன்மை வினையின் வெளிப்படாத எழுவாயை தமிழில் இயல்பாகத் தெளிவுபடுத்துகிறது.
