id: REV.16.4
reference: Revelation 16:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ὁ τρίτος ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τοὺς ποταμοὺς ⸀καὶ τὰς πηγὰς τῶν ὑδάτων· καὶ ἐγένετο αἷμα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/004.yaml
  text: And the third poured out his bowl into the rivers and the springs of water[a], and it became blood.
translation:
  language: ta
  text: மூன்றாமவர் தமது கிண்ணத்தை ஆறுகளிலும் நீரூற்றுகளிலும் ஊற்றினார்; தண்ணீர் இரத்தமானது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “அது இரத்தமானது.” ஒருமை வினை, ஆறுகளிலும் நீரூற்றுகளிலும் உள்ள தண்ணீரை மொத்தமாகக் குறிக்கிறது.'
    reason: கிரேக்கத்தின் ஒருமை வடிவத்தையும் அதன் தொகுப்புப் பொருளையும் பதிவு செய்யும் இலக்கண மாற்று.
lexical_decisions:
- source_word: ὁ τρίτος
  choice: மூன்றாமவர்
  rationale: கிரேக்கத்தில் பெயர்ச்சொல் குறிப்பிடப்படாமல், வரிசை எண்ணே பெயர்ச்சொல்லாக வருகிறது. முந்தைய சூழலிலிருந்து தூதர் என்பது விளங்குவதால், முதன்மை உரையில் ‘தூதர்’ என்பதைச் சேர்க்காமல் தமிழிலும் அந்த விடுபாட்டைப் பேணுகிறது.
- source_word: ἐξέχεεν
  choice: ஊற்றினார்
  rationale: ἐκχέω என்பதன் அடிப்படைப் பொருள் ஒரு பாத்திரத்திலிருந்து திரவத்தை ஊற்றுவது. கிண்ணத்தோடு இயல்பாக இணையும் நவீனத் தமிழ் வினை இது.
- source_word: φιάλην
  choice: கிண்ணத்தை
  rationale: φιάλη என்பது அகன்ற, ஆழம் குறைந்த பாத்திரத்தைக் குறிக்கிறது. பழைய வழக்கிலுள்ள ‘குப்பி’ போன்ற சொற்களைவிட ‘கிண்ணம்’ துல்லியமும் தெளிவும் உடையது.
- source_word: εἰς τοὺς ποταμοὺς καὶ τὰς πηγὰς τῶν ὑδάτων
  choice: ஆறுகளிலும் நீரூற்றுகளிலும்
  rationale: εἰς இங்கு ஊற்றப்பட்டதன் இலக்கைச் சுட்டுகிறது. தமிழில் ‘ஆறுகளிலும் நீரூற்றுகளிலும் ஊற்றினார்’ என்பது ‘அவற்றுக்குள் ஊற்றினார்’ என்ற பொருளை இயல்பாகத் தருகிறது; πηγήக்கு ‘நீரூற்று’ தெளிவான நவீன இணைச்சொல்.
- source_word: ἐγένετο αἷμα
  choice: தண்ணீர் இரத்தமானது
  rationale: கிரேக்க வினை ஒருமையில் உள்ளது; உடனுள்ள சூழலில் அதன் மறைமுக எழுவாய் ஆறுகளிலும் ஊற்றுகளிலும் உள்ள தண்ணீராகும். தமிழில் அந்த எழுவாயை வெளிப்படுத்துவது மாற்றத்தின் பொருளைத் தெளிவாக்குகிறது; ஒருமையையும் பேணுகிறது.
theological_decisions:
- issue: ἐγένετο என்பதன் மறைமுக எழுவாய்
  choice: ஆறுகளிலும் நீரூற்றுகளிலும் உள்ள தண்ணீர் இரத்தமானது
  alternative: ஆறுகளும் நீரூற்றுகளும் இரத்தமாயின
  rationale: கிரேக்கத்தில் வினை ஒருமையில் இருப்பதால், பல நீர்நிலைகளைப் பன்மை எழுவாயாக மாற்றாமல், அவற்றின் தண்ணீரைத் தொகுதியாகக் குறிப்பது இலக்கண வடிவத்தையும் நியாயத்தீர்ப்பின் பரப்பையும் பேணுகிறது. இது கோட்பாட்டுச் சேர்க்கை அல்ல; சூழலில் மறைந்துள்ள எழுவாயைத் தமிழில் இயல்பாக வெளிப்படுத்துவதாகும்.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘மூன்றாமவர்’ என்பது சூழலில் விளங்கும் ‘தூதர்’ என்ற பெயர்ச்சொல்லைச் சேர்க்காமல் கிரேக்க விடுபாட்டைப் பேணுகிறது. ‘தமது’ மரியாதைத் தொடர்ச்சிக்காகவும், ‘நீரூற்று’ உடனடியாகப் புரியும் இயற்கையான சொல்லாகவும் தேர்ந்தெடுக்கப்பட்டன.
