  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕκτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ποταμὸν τὸν μέγαν ⸀τὸν Εὐφράτην· καὶ ἐξηράνθη τὸ ὕδωρ αὐτοῦ, ἵνα ἑτοιμασθῇ ἡ ὁδὸς τῶν βασιλέων τῶν ἀπὸ ἀνατολῆς ἡλίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/012.yaml
  text: And the sixth poured out his bowl on the great river Euphrates[a], and its water was dried up, so that the way of the kings from the rising of the sun might be prepared.
translation:
  language: ta
  text: ஆறாவதானவன் தனது கிண்ணத்தைப் பெரிய நதியாகிய யூபிராத்தின் மீது ஊற்றினான். அதன் தண்ணீர் வற்றிப்போனது; சூரியன் உதிக்கும் திசையிலிருந்து வரும் அரசர்களின் வழி ஆயத்தமாகும்படி.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, எளிமையாக, ‘கிழக்கிலிருந்து வரும்.’ சொல்லுக்குச் சொல், ‘சூரியன் உதிக்கும் திசையிலிருந்து வரும்.’
    reason: ἀπὸ ἀνατολῆς ἡλίου என்பதன் எளிய திசைப்பொருளையும், மூலத்தில் உள்ள ‘சூரியன் உதித்தல்’ என்ற உருவகமான சொல்லாட்சியையும் காட்டுகிறது.
lexical_decisions:
- source_word: ὁ ἕκτος
  choice: ஆறாவது தூதன்
  rationale: கிரேக்கத்தில் ‘ஆறாவது’ என்று மட்டும் இருந்தாலும், தமிழில் தனியாக வரும் வரிசை எண்ணுப் பெயர் தெளிவற்றதாக இருக்கும். உடனடிச் சூழல் கிண்ணங்களை ஊற்றுகிறவர்கள் தூதர்கள் என்பதை வெளிப்படையாகக் காட்டுவதால், இயல்பான தமிழுக்காக ‘தூதன்’ சேர்க்கப்பட்டது.
- source_word: ἐξέχεεν
  choice: ஊற்றினான்
  rationale: ἐκχέω என்பதன் வழக்கமான பொருளையும், வெளிப்படுத்தின விசேஷத்தில் வரும் நியாயத்தீர்ப்புக் கிண்ணங்களின் உருவகத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: φιάλην
  choice: கிண்ணத்தை
  rationale: φιάλη என்பது அகன்ற பாத்திரத்தைக் குறிக்கிறது. இன்றைய வாசகருக்கு ‘கிண்ணம்’ தெளிவானதும் இயல்பானதும்; சிறிய புட்டியை உணர்த்தும் சொற்கள் தவிர்க்கப்பட்டன.
- source_word: ἐπὶ τὸν ποταμὸν τὸν μέγαν τὸν Εὐφράτην
  choice: பெரிய நதியாகிய யூபிராத்தின் மீது
  rationale: பெயரடை மற்றும் பெயரின் விளக்க உறவை இயல்பான தமிழ் அமைப்பில் தருகிறது; ἐπί குறிக்கும் ஊற்றப்பட்ட இலக்கு ‘மீது’ எனக் காக்கப்படுகிறது.
- source_word: ἐξηράνθη
  choice: வற்றிப்போனது
  rationale: நீர் முழுமையாக உலர்ந்த நிகழ்வையும் அதன் விளைவையும் இயல்பாக வெளிப்படுத்துகிறது. கிரேக்கச் செயப்பாட்டு வடிவத்தின் பொருள் தமிழில் இயல்பான தன்வினை வடிவில் அளிக்கப்படுகிறது.
- source_word: τὸ ὕδωρ αὐτοῦ
  choice: அந்த நதியின் தண்ணீர்
  rationale: αὐτοῦ எதைக் குறிக்கிறது என்பதைத் தமிழில் தெளிவுபடுத்துகிறது; ‘அதன் தண்ணீர்’ என்பதைக் காட்டிலும் இங்கு இயல்பாக உள்ளது.
- source_word: ἵνα ἑτοιμασθῇ
  choice: ஆயத்தமாகும்படி
  rationale: ἵνα உடன் வரும் நோக்கப் பொருளையும் passive கருத்தையும் சுருக்கமான, dignified தமிழில் காக்கிறது.
- source_word: ἡ ὁδὸς τῶν βασιλέων
  choice: அரசர்களின் வழி
  rationale: ‘வழி’ என்பது நேரடியான பாதையையும் வெளிப்படுத்தின விசேஷத்துக்குரிய விரிவான உருவகச் சாத்தியத்தையும் திறந்துவைக்கிறது; மரபுத்தொடரின் உருபு உறவும் காக்கப்படுகிறது.
- source_word: τῶν ἀπὸ ἀνατολῆς ἡλίου
  choice: சூரியன் உதிக்கும் இடத்திலிருந்து வரும்
  rationale: மூலத்தின் உயிரோட்டமான ‘சூரிய உதயம்’ என்ற சொல்லாட்சியை இயல்பான தமிழில் காக்கிறது. ‘கிழக்கிலிருந்து’ என்பது செல்லத்தக்க எளிய மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: ‘ஆறாவது’ என்பது ஒரு தூதன் என்பதை வெளிப்படையாகச் சொல்வதா
  choice: தமிழின் தெளிவுக்காக ‘ஆறாவது தூதன்’ என்று கொடுக்கப்பட்டது.
  alternative: ‘ஆறாவது ஒருவன்’ அல்லது ‘ஆறாவது’ என்று மட்டும் கொடுத்தல்.
  rationale: பெயர்ச்சொல் கிரேக்கத்தில் விடுபட்டிருந்தாலும், முன்சூழலில் அது தூதனைத் தெளிவாகக் குறிக்கிறது. தமிழில் அந்த விடுபாட்டை அப்படியே வைத்தால் தேவையற்ற தெளிவின்மை அல்லது இயல்பற்ற நடை உண்டாகும்; எனவே இது சூழலால் உறுதிப்படுத்தப்பட்ட குறைந்தபட்ச நிரப்பல்.
- issue: யூபிராத்து வற்றுவதையும் அரசர்கள் வருவதையும் குறியீடாக விளக்குவதா
  choice: உருவகம் விளக்கப்படாமல், வசனம் கூறும் காட்சியே நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: படையெடுப்பு அல்லது இறுதிக்கால ஒன்றுகூடல் என்று விளக்கி உரைத்தல்.
  rationale: இந்த வசனம் காட்சியின் முழுப் பொருளைத் தானே விளக்கவில்லை. ஆகவே இறையியல் பதற்றமும் வெளிப்படுத்தின விசேஷத்தின் பல்பொருள் வாய்ப்பும் மொழிபெயர்ப்பில் திறந்தவண்ணம் வைக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் dignified நடை பயன்படுத்தப்பட்டது. ‘ஆயத்தம்,’ ‘யூபிராத்து’ போன்ற வேதாகமச் சூழலுக்கு ஏற்ற சொற்கள் வைக்கப்பட்டாலும் வாக்கிய அமைப்பு இயல்பாக்கப்பட்டது. அடிக்குறி [a] அது விளக்கும் ‘சூரியன் உதிக்கும் இடம்’ என்ற தொடருக்குப் பின்னர், வாக்கிய முடிவில் இணைக்கப்பட்டுள்ளது.
