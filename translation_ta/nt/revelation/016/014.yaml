source:
  edition: SBLGNT
  text: εἰσὶν γὰρ πνεύματα δαιμονίων ποιοῦντα σημεῖα, ἃ ἐκπορεύεται ἐπὶ τοὺς βασιλεῖς τῆς οἰκουμένης ὅλης, συναγαγεῖν αὐτοὺς εἰς τὸν πόλεμον τῆς ⸀ἡμέρας τῆς μεγάλης τοῦ θεοῦ τοῦ παντοκράτορος—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/014.yaml
  text: For they are spirits of demons[a], performing signs, which go out to the kings of the whole world[b], to gather them for the battle of the great day of God the Almighty—
translation:
  language: ta
  text: ஏனெனில், அவை அடையாளங்களை நிகழ்த்தும் பேய்களின் ஆவிகள்[a]. அவை சர்வவல்லமையுள்ள கடவுளின் மகத்தான நாளின் போருக்காக உலகம் முழுவதிலுமுள்ள[b] அரசர்களை ஒன்றுகூட்ட அவர்களிடம் புறப்பட்டுச் செல்கின்றன—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பேய்த்தன்மையுள்ள ஆவிகள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மனிதர் குடியிருக்கும் முழு உலகம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεύματα δαιμονίων
  choice: பேய்களின் ஆவிகள்
  rationale: கிரேக்க மரபுத்தொடரின் உறவை நேரடியாகப் பேணுகிறது; இதை வெறுமனே ‘தீய ஆவிகள்’ என்று பொதுமைப்படுத்தவில்லை.
- source_word: ποιοῦντα σημεῖα
  choice: அடையாளங்களை நிகழ்த்துகிற
  rationale: σημεῖα என்பதன் ‘அடையாளங்கள்’ என்ற பொருளைப் பேணுவதோடு, அவற்றின் இயங்குமுறை அல்லது அவை தெய்வீக அற்புதங்களுக்கு இணையானவையா என்பதைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: ἃ ἐκπορεύεται
  choice: அவை ... புறப்பட்டுச் செல்கின்றன
  rationale: கிரேக்கத்தில் வினை ஒருமை வடிவில் இருந்தாலும், தொடர்புச் சொல் பன்மையாக இருந்து முன்வரும் ஆவிகளையே குறிக்கிறது; தமிழில் இயல்பாகப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐπὶ τοὺς βασιλεῖς
  choice: அரசர்களை ... அவர்களிடம்
  rationale: இயக்கத்தைக் குறிக்கும் சூழலில் ἐπί அரசர்களை நோக்கிச் செல்வதைக் காட்டுகிறது; அவர்களுக்கு எதிராகச் செல்வதாகப் பொருள் தீர்மானிக்கப்படவில்லை.
- source_word: τῆς οἰκουμένης ὅλης
  choice: உலகம் முழுவதிலுமுள்ள
  rationale: மனிதர்கள் குடியிருக்கும் முழு உலகையும், குறிப்பாக அதன் அரசியல் ஆட்சிப் பரப்பையும், இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: συναγαγεῖν
  choice: ஒன்றுகூட்டும்படி
  rationale: ஆவிகள் புறப்பட்டுச் செல்வதன் நோக்கத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: εἰς τὸν πόλεμον
  choice: போருக்காக
  rationale: அரசர்கள் குறிப்பிட்ட இறுதிப் போருக்காகக் கூட்டப்படுகிறார்கள் என்ற நோக்கப் பொருளை இயல்பாகத் தருகிறது.
- source_word: τῆς ἡμέρας τῆς μεγάλης
  choice: மகத்தான நாளில் நடைபெறும்
  rationale: போர் அந்த மகத்தான நாளுக்குரியது என்ற தொடர்பைத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: τοῦ θεοῦ τοῦ παντοκράτορος
  choice: சர்வவல்லமையுள்ள கடவுளின்
  rationale: παντοκράτωρ என்ற தெய்வீகப் பட்டத்தை மரியாதைமிக்க, பரவலாகப் புரிந்துகொள்ளப்படும் தமிழில் வழங்குகிறது.
theological_decisions:
- issue: ஆவிகள் நிகழ்த்தும் அடையாளங்களின் இயல்பு
  choice: பேய்களின் ஆவிகள் உண்மையில் ‘அடையாளங்களை நிகழ்த்துகின்றன’ என்று உரை கூறுவதுபோலவே மொழிபெயர்க்கப்பட்டுள்ளது; அவற்றின் இயங்குமுறை குறிப்பிடப்படவில்லை.
  alternative: அவை வெறும் கண்கட்டு வித்தைகள் என்றோ, தெய்வீக அற்புதங்களுக்கு முற்றிலும் இணையான இயற்கைக்கு அப்பாற்பட்ட செயல்கள் என்றோ விளக்குவது.
  rationale: σημεῖα என்பது நேரடியாக ‘அடையாளங்கள்’ என மொழிபெயர்க்கப்படுகிறது. அவை போலியானவையா, உண்மையான இயற்கைக்கு அப்பாற்பட்ட செயல்களா, அல்லது இரண்டும் கலந்தவையா என்பதை வசனம் தீர்மானிக்காததால் மொழிபெயர்ப்பும் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய மரியாதைமிக்க வெளிப்பாடு பயன்படுத்தப்பட்டுள்ளது. மூல வசனம் அடுத்த வசனத்துடன் தொடர்வதை இறுதியிலுள்ள நீண்ட கோடு பேணுகிறது.
