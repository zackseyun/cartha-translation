  source_fidelity: 'மூலத்தின் முக்கியக் கூறுகள் காக்கப்பட்டுள்ளன: பேய்களோடு தொடர்புடைய ஆவிகள், அவை நிகழ்த்தும் அடையாளங்கள், உலகளாவிய அரசர்களிடம் செல்வது, அவர்களைப் போருக்காகக் கூட்டுவது, மற்றும் சர்வவல்லமையுள்ள கடவுளின் மகத்தான நாள் ஆகியவை அனைத்தும் உள்ளன. ஆனால் “மகத்தான நாளில் நடைபெறும் போர்” என்பது τῆς ἡμέρας τῆς μεγάλης என்பதன் உடைமை/தொடர்புப் பிணைப்பை காலச் சூழலாகச் சற்று விளக்குகிறது. “மகத்தான நாளின் போர்” என்பது மூலத் தொடர்பை நேரடியாகப் பேணுகிறது.'
