source:
  edition: SBLGNT
  text: καὶ ἤκουσα τοῦ ἀγγέλου τῶν ὑδάτων λέγοντος· Δίκαιος εἶ, ὁ ὢν καὶ ὁ ἦν, ⸀ὁ ὅσιος, ὅτι ταῦτα ἔκρινας,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/005.yaml
  text: And I heard the angel of the waters saying[a], “Righteous are you, the one who is and who was, the Holy One[c][b], because you have judged these things.”
translation:
  language: ta
  text: '‘நீர்நிலைகளின் தூதர்[c] இவ்வாறு சொல்வதை நான் கேட்டேன்: “இருக்கிறவரும் இருந்தவருமான பரிசுத்தரே[a], நீர் நீதியுள்ளவர்[b]; ஏனெனில் இவற்றுக்கு நீர் தீர்ப்பளித்தீர்.”’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “இருக்கிறவரும் இருந்தவரும் வருகிறவரும்” என்பது போன்ற விரிவான பட்டம் காணப்படுகிறது; இது வெளிப்படுத்தலின் பிற இடங்களிலுள்ள ஒத்த சொற்றொடர்களுக்கு ஏற்ப மாற்றப்பட்டிருக்கலாம். இங்கு பின்பற்றப்பட்டுள்ள கிரேக்க வாசகம், “இருக்கிறவரும் இருந்தவருமான பரிசுத்தர்” என்பதாகும்.
    reason: textual_variant
  - marker: b
    text: அல்லது, “நீர் நியாயமானவர்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “நீர்நிலைகளுக்குப் பொறுப்பான தூதர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ ἀγγέλου τῶν ὑδάτων
  choice: நீர்நிலைகளின் தூதர்
  rationale: கிரேக்க மரபுத்தொடரின் ‘நீர்களின் தூதர்’ என்ற அடிப்படைப் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது. சூழலில் நீருடன் தொடர்புடைய அல்லது நீருக்குப் பொறுப்பான தூதரைக் குறிக்கலாம்; அந்தத் தெளிவின்மை அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: Δίκαιος
  choice: நீதியுள்ளவர்
  rationale: இறைவனுடைய தீர்ப்பில் வெளிப்படும் ஒழுக்க மற்றும் நீதி நேர்மையைச் சுட்டுகிறது. ‘நியாயமானவர்’ என்பதும் சாத்தியம்; ஆனால் ‘நீதியுள்ளவர்’ வழிபாட்டுப் பாங்கையும் விரிந்த பொருளையும் காக்கிறது.
- source_word: ὁ ὢν καὶ ὁ ἦν
  choice: இருக்கிறவரும் இருந்தவருமான
  rationale: வெளிப்படுத்தலில் வரும் இறைப்பட்டத்தை அதன் நிகழ்கால, கடந்தகால வடிவங்களோடு நெருக்கமாகக் காக்கிறது.
- source_word: ὁ ὅσιος
  choice: பரிசுத்தர்
  rationale: ὅσιος இங்கு இறைவனுடைய தூய்மையையும் ஒழுக்கப் பரிசுத்தத்தையும் பட்டமாகக் குறிக்கிறது. தமிழில் இயல்பான இறைப்பட்டமாக ‘பரிசுத்தர்’ பொருந்துகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: இறைவன் நீதியுள்ளவர் என்ற அறிவிப்புக்கான காரணத்தை வெளிப்படையாக அறிமுகப்படுத்துகிறது.
- source_word: ταῦτα
  choice: இவற்றைக் குறித்து
  rationale: கிரேக்கத்தின் பொதுவான ‘இவற்றை/இவைகளை’ என்ற சுட்டுப்பெயரை ‘இந்தத் தீர்ப்புகள்’ என்று விளக்கி விரிவுபடுத்தாமல் காக்கிறது; ‘தீர்ப்பளித்தல்’ என்பதுடன் இயல்பான தமிழுக்காக ‘குறித்து’ பயன்படுத்தப்படுகிறது.
- source_word: ἔκρινας
  choice: தீர்ப்பளித்தீர்
  rationale: முடிவுற்ற நீதித்தீர்ப்புச் செயலை மரியாதை ஒருமையில் இயல்பாகத் தருகிறது; அதன் தற்போதைய விளைவு சூழலால் தெளிவாகிறது.
theological_decisions:
- issue: எதிர்காலக் கூறு இல்லாத இறைப்பட்டம்
  choice: இருக்கிறவரும் இருந்தவருமான பரிசுத்தர்
  alternative: இருக்கிறவரும் இருந்தவரும் வருகிறவரும்
  rationale: SBLGNT வாசகம் ὁ ὢν καὶ ὁ ἦν, ὁ ὅσιος என்று உள்ளது; வெளிப்படுத்தலின் பிற இடங்களில் காணப்படும் ‘வருகிறவர்’ என்ற கூறை இங்கே சேர்க்கவில்லை. ஆகவே அச்சிடப்பட்ட கிரேக்க வாசகமே மூலவுரையில் பின்பற்றப்பட்டு, விரிவான வேறுபாட்டு வாசகம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: Δίκαιος என்பதன் நீதி சார்ந்த பொருள்
  choice: நீதியுள்ளவர்
  alternative: நியாயமானவர்
  rationale: இவ்விடத்தில் சொல் இறைவனுடைய தீர்ப்புகளின் நேர்மையைப் புகழ்கிறது. ‘நீதியுள்ளவர்’ என்பது நீதித்துறை நியாயம் மட்டும் அல்லாமல் விரிந்த ஒழுக்க நேர்மையையும் தக்கவைக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுக்குரிய கண்ணியமான நடையும் சாதாரண வாசகருக்குப் புரியும் சொற்களும் பயன்படுத்தப்பட்டுள்ளன. இறைவனை நோக்கும் உரையில் மரியாதை ஒருமை காக்கப்பட்டுள்ளது. கிரேக்கத்தில் உள்ள பட்டங்களின் வரிசையும் உரையின் இறையியல் இறுக்கமும் தேவையற்ற விளக்கமின்றிப் பாதுகாக்கப்பட்டுள்ளன.
