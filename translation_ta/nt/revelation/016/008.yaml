reference: Revelation 16:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ὁ ⸀τέταρτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ἥλιον· καὶ ἐδόθη αὐτῷ καυματίσαι ⸂τοὺς ἀνθρώπους ἐν πυρί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/008.yaml
  text: And the fourth poured out his bowl on the sun[a], and it was given to it to scorch the people with fire.
translation:
  language: ta
  text: நான்காமவர் தமது கிண்ணத்தைச் சூரியன் மீது ஊற்றினார்; மக்களை நெருப்பால் சுட்டெரிக்க அதற்கு அனுமதி அளிக்கப்பட்டது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அதற்கு’ என்பது பெரும்பாலும் சூரியனைக் குறிக்கிறது. கடைசிப் பகுதியை இன்னும் சொற்சொல்லாக, ‘மக்களை நெருப்பில் சுட்டெரிக்க அதற்கு அனுமதி அளிக்கப்பட்டது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: சுட்டுப்பெயரின் குறிப்பு மற்றும் ἐν πυρί என்பதன் சொற்சொல்லான மாற்று
lexical_decisions:
- source_word: ὁ τέταρτος
  choice: நான்காமவர்
  rationale: கிரேக்கத்தில் ‘தூதர்’ என்பது வெளிப்படையாக இல்லை; முந்தைய சூழலிலிருந்து அது புரிகிறது. ஆகவே மூலத்தின் சுருக்கத்தைப் பேணுகிறது.
- source_word: ἐξέχεεν
  choice: ஊற்றினார்
  rationale: கிண்ணத் தீர்ப்புகளின் சூழலில் இயல்பானதும் தெளிவானதுமான வினைச்சொல்.
- source_word: φιάλην
  choice: கிண்ணத்தை
  rationale: அகன்ற பாத்திரத்தைக் குறிக்கும் φιάλη என்பதற்கு நவீனத் தமிழில் இயல்பான இணைச்சொல்.
- source_word: ἐπὶ τὸν ἥλιον
  choice: சூரியன்மேல்
  rationale: ἐπί + வேற்றுமை இங்கு ஊற்றப்பட்டதன் இலக்கைச் சுட்டுகிறது.
- source_word: ἐδόθη αὐτῷ
  choice: அதற்குக் கொடுக்கப்பட்டது
  rationale: கொடுப்பவரைப் பெயரிடாத கிரேக்கச் செயப்பாட்டு அமைப்பையும், αὐτῷ என்பதன் இடைநிலைச் சுட்டையும் பேணுகிறது; ‘அதிகாரம்’ அல்லது ‘வல்லமை’ என்று மூலத்தில் இல்லாத பெயர்ச்சொல் சேர்க்கப்படவில்லை.
- source_word: καυματίσαι
  choice: சுட்டெரிக்கும்படி
  rationale: கடும் வெப்பத்தால் எரியச் செய்வதைக் குறிக்கும் வினையின் வலிமையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τοὺς ἀνθρώπους
  choice: மக்களை
  rationale: ஆண்களை மட்டும் அல்லாமல் பொதுவாக மனிதர்களைக் குறிக்கும் சொல்லின் உள்ளடக்கத்தை இயல்பாகத் தருகிறது.
- source_word: ἐν πυρί
  choice: நெருப்பால்
  rationale: இங்கு நெருப்பு கருவி அல்லது முறையாகச் செயல்படுவதைத் தமிழில் இயல்பாகக் காட்டுகிறது; ‘நெருப்பில்’ என்பது சொற்சொல்லான மாற்று.
theological_decisions:
- issue: ἐδόθη என்பதில் மறைமுகமாக உள்ள தெய்வீகச் செயற்பாடு
  choice: ‘கொடுக்கப்பட்டது’ என்ற செயப்பாட்டு வடிவத்தை வைத்துக் கொடுப்பவரைப் பெயரிடாமல் விடுதல்
  alternative: ‘கடவுள் கொடுத்தார்’ அல்லது ‘அனுமதிக்கப்பட்டது’
  rationale: வெளிப்படுத்தலில் காணப்படும் இத்தகைய செயப்பாட்டு வடிவம் கடவுளின் ஆளுகையை மறைமுகமாக உணர்த்தினாலும், இவ்வாக்கியம் அவரை நேரடியாகப் பெயரிடவில்லை.
- issue: αὐτῷ என்பதன் குறிப்பு
  choice: ‘அதற்கு’ என்று மொழிபெயர்த்து, அது பெரும்பாலும் சூரியனைக் குறிப்பதாகப் புரியவைத்தல்
  alternative: நான்காமவருக்கு என்று வெளிப்படையாகக் கூறுதல்
  rationale: அருகிலுள்ள இலக்கண முன்னிலைச் சொல் ‘சூரியன்’; மக்களைச் சுட்டெரிக்கும் செயலும் அதற்கு நன்றாகப் பொருந்துகிறது. ஆயினும் மூலத்தில் பெயர் மீண்டும் சொல்லப்படாததால் சுட்டுப்பெயர் பேணப்படுகிறது.
- issue: ἀνθρώπους என்பதன் பொதுப்பாலினக் குறிப்பு
  choice: மக்களை
  alternative: ஆண்களை அல்லது மனிதகுலத்தை
  rationale: இங்கு சொல் பாலின வேறுபாடின்றி மனிதர்களைப் பொதுவாகக் குறிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் காட்சியின் தீவிரமும் குன்றாத வகையில் அமைக்கப்பட்டது. ‘நான்காமவர்’ என்பது சூழலில் தேவதூதரைக் குறித்தாலும், மூலத்தில் இல்லாத ‘தூதர்’ என்ற சொல்லைச் சேர்க்காமல் காக்கிறது.
