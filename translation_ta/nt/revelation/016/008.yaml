revisions:
- from: நான்காமவர் தமது கிண்ணத்தைச் சூரியன்மேல் ஊற்றினார். மக்களை நெருப்பால் சுட்டெரிக்கும்படி அதற்குக் கொடுக்கப்பட்டது.[a]
  to: நான்காமவர் தமது கிண்ணத்தைச் சூரியன் மீது ஊற்றினார்; மக்களை நெருப்பால் சுட்டெரிக்க அதற்கு அனுமதி அளிக்கப்பட்டது.[a]
  rationale: The revision resolves the unnatural elliptical passive by using an idiomatic Tamil permission construction that conveys the Greek divine passive without naming the giver. It also regularizes the expression for the sun as the target of the pouring. The pronoun remains impersonal and ambiguous in the main text, while the note gives its likely antecedent without treating that inference as certain.
  reviewer_model: gpt-5.6-terra
