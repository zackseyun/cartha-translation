id: REV.16.18
reference: Revelation 16:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐγένοντο ἀστραπαὶ καὶ ⸂φωναὶ καὶ βρονταί⸃, καὶ σεισμὸς ⸀ἐγένετο μέγας, οἷος οὐκ ἐγένετο ἀφ’ οὗ ⸂ἄνθρωποι ἐγένοντο⸃ ἐπὶ τῆς γῆς τηλικοῦτος σεισμὸς οὕτω μέγας,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/018.yaml
  text: And there were flashes of lightning and sounds and peals of thunder, and there was a great earthquake, such as had not happened since men came to be on the earth—so great was that earthquake.
translation:
  language: ta
  text: மின்னல் வெட்டுகளும், ஓசைகளும்[a], இடிமுழக்கங்களும் உண்டாயின. பெரும் நிலநடுக்கம் ஏற்பட்டது. பூமியில் மனிதர்கள் தோன்றியதுமுதல் அப்படிப்பட்ட நிலநடுக்கம் ஏற்பட்டதே இல்லை—அவ்வளவு பெரிதாயிருந்தது அந்த நிலநடுக்கம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குரல்களும்.”
    reason: φωναὶ என்பதற்கு ‘ஓசைகள்’ என்றும் ‘குரல்கள்’ என்றும் பொருள் கொள்ள வாய்ப்புள்ளது.
lexical_decisions:
- source_word: ἀστραπαὶ
  choice: மின்னல் வெட்டுகள்
  rationale: பன்மை வடிவம் மீண்டும் மீண்டும் தோன்றும் மின்னல் ஒளிப்புகளைச் சுட்டுகிறது; நவீன தமிழில் இயல்பாகவும் காட்சித் தெளிவுடனும் உள்ளது.
- source_word: φωναὶ
  choice: ஓசைகள்
  rationale: இச்சொல் ‘குரல்கள்’ அல்லது ‘ஓசைகள்’ எனப் பொருள்படலாம். மின்னல் மற்றும் இடிமுழக்கத்துடன் வரும் இச்சூழலில் ‘ஓசைகள்’ இயல்பானது; இருப்பினும் மூலத்தின் இருபொருள் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: βρονταί
  choice: இடிமுழக்கங்கள்
  rationale: பன்மையைத் தக்கவைத்து, தொடர்ச்சியான அல்லது பலத்த இடியொலிகளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: σεισμὸς
  choice: நிலநடுக்கம்
  rationale: இச்சூழலில் நில அதிர்வைக் குறிக்கும் தெளிவான, வழக்கமான தமிழ்ச் சொல்.
- source_word: μέγας
  choice: பெரும் / பெரிது
  rationale: முதல் இடத்தில் பெயரடைத் தொடருக்கு ‘பெரும்’ என்றும், இறுதி வலியுறுத்தலில் இயல்பான தமிழுக்காக ‘பெரிது’ என்றும் வழங்கப்பட்டுள்ளது.
- source_word: οἷος οὐκ ἐγένετο
  choice: அப்படிப்பட்ட ... ஏற்பட்டதே இல்லை
  rationale: முன்னெப்போதும் இல்லாத அளவைக் கூறும் ஒப்பீட்டையும் வலியுறுத்தலையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἀφ’ οὗ
  choice: '...முதல்'
  rationale: குறிப்பிட்ட காலத்திலிருந்து இதுவரையிலான ஒப்பீட்டைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἄνθρωποι ἐγένοντο ἐπὶ τῆς γῆς
  choice: பூமியில் மனிதர்கள் தோன்றியதுமுதல்
  rationale: ἄνθρωποι இங்கு ஆண்களை மட்டும் அல்லாது மனிதகுலத்தைப் பொதுவாகக் குறிக்கிறது; ‘தோன்றியதுமுதல்’ என்பது ἐγένοντο என்பதன் ‘இருப்புக்கு வந்தனர்’ என்ற இயக்கத்தை இயல்பான தமிழில் பிரதிபலிக்கிறது.
- source_word: τηλικοῦτος ... οὕτω μέγας
  choice: அவ்வளவு பெரிதாயிருந்தது
  rationale: நிலநடுக்கத்தின் அசாதாரண அளவை வலியுறுத்தும் கிரேக்கச் சொல்லமைப்பை இயல்பான, உயர்ந்த தமிழில் தக்கவைக்கிறது.
theological_decisions:
- issue: வெளிப்படுத்தல் நூலின் தீர்ப்புக் காட்சியில் φωναὶ என்பதன் பொருள்
  choice: ஓசைகள்
  alternative: குரல்கள்
  rationale: சூழல் இயற்கை அல்லது வானக நிகழ்வுகளின் ஓசைகளை ஆதரிக்கிறது; ஆனால் பேசும் குரல்கள் என்ற சாத்தியத்தை உரை முற்றிலும் நீக்காததால் அடிக்குறிப்பில் மாற்றுப் பொருள் தரப்படுகிறது.
- issue: ἄνθρωποι என்பதன் பொதுமனிதக் குறிப்பு
  choice: மனிதர்கள்
  alternative: மனிதகுலம்
  rationale: இந்த ஒப்பீடு ஆண்களை மட்டும் அல்லாது பூமியில் மனிதர்கள் இருந்த முழுக் காலத்தையும் குறிக்கிறது. ‘மனிதர்கள்’ என்பது மூலத்தின் பன்மையையும் உள்ளடக்கமான பொருளையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வெளிப்படுத்தல் நூலுக்குரிய கம்பீரத்தையும் பேரழிவுக் காட்சியின் தீவிரத்தையும் காக்கும் நடை. கிரேக்க உரையின் திரும்பக்கூறல் இறுதி வாக்கியத்தில் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளது.
