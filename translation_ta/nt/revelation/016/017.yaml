id: REV.16.17
reference: Revelation 16:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕβδομος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ἀέρα— καὶ ἐξῆλθεν φωνὴ μεγάλη ⸀ἐκ τοῦ ⸀ναοῦ ἀπὸ τοῦ θρόνου λέγουσα· Γέγονεν—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/017.yaml
  text: And the seventh poured out his bowl into the air[a], and a loud voice came out from the sanctuary, from the throne, saying[b], “It has come to pass.”
translation:
  language: ta
  text: ஏழாவது தூதர் தன் கிண்ணத்தைக் காற்றில் ஊற்றினார். அப்போது பரிசுத்த இடத்திலிருந்தும் அரியணையிலிருந்தும், “நடந்துவிட்டது” என்று சொல்லும் உரத்த குரல் வெளியே வந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “முடிந்தது” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἕβδομος
  choice: ஏழாவது தூதர்
  rationale: கிரேக்கத்தில் ‘ஏழாவது’ என்று மட்டும் இருந்தாலும், தமிழில் தனித்து வரும் வரிசை எண்ணுப் பெயர் இயல்பற்றதாகவும் தெளிவற்றதாகவும் இருக்கும். முந்தைய கிண்ணத் தொடரால் குறிக்கப்படுவது தூதர் என்பது வெளிப்படுவதால், ‘தூதர்’ சூழலிலிருந்து நிரப்பப்பட்டுள்ளது.
- source_word: ἐξέχεεν
  choice: ஊற்றினார்
  rationale: ἐκχέω என்பதன் அடிப்படைச் செயலை இயல்பான தமிழில் காட்டுகிறது; அதிகாரம் முழுவதிலும் வரும் கிண்ணம் ஊற்றும் சூத்திரத்திற்கும் ஏற்றது.
- source_word: φιάλην
  choice: கிண்ணம்
  rationale: φιάλη என்பது ஆழமற்ற பாத்திரம் அல்லது கிண்ணத்தைக் குறிக்கும்; பழமையான அல்லது தவறாக வழிநடத்தக்கூடிய ‘குப்பி’ போன்ற சொல்லைத் தவிர்க்கிறது.
- source_word: ἐπὶ τὸν ἀέρα
  choice: காற்றில்
  rationale: இயக்கத்தைக் குறிக்கும் இச்சூழலில் ‘into the air’ என்ற பொருளை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐξῆλθεν φωνὴ μεγάλη
  choice: உரத்த குரல் எழுந்தது
  rationale: சொல்லுக்கு சொல் ‘பெரிய குரல் வெளியே வந்தது’ என்பதற்குப் பதிலாக, குரலின் வலிமையையும் அதன் மூலத்திலிருந்து புறப்படுதலையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἐκ τοῦ ναοῦ
  choice: பரிசுத்த இடத்திலிருந்து
  rationale: ναός முழுக் கோவில் வளாகத்தைவிட அதன் உட்புறப் பரிசுத்த இருப்பிடத்தைக் குறிப்பதால், அந்தக் குறிப்புத்தன்மையைப் பாதுகாக்கிறது.
- source_word: ἀπὸ τοῦ θρόνου
  choice: அரியணையிலிருந்து
  rationale: குரலின் இரட்டைப் பிறப்பிட விவரிப்பைச் சுருக்காமல் அப்படியே வைத்திருக்கிறது.
- source_word: Γέγονεν
  choice: நிறைவேறிவிட்டது
  rationale: γίνομαι என்பதன் perfect வடிவம் முடிவுற்ற நிகழ்வையும் அதன் தற்போதைய விளைவையும் காட்டுகிறது. ‘நடந்துவிட்டது’ என்பதும் சாத்தியம்; இக்கிளைமாக்ஸ் சூழலில் ‘நிறைவேறிவிட்டது’ இயல்பாகவும் கம்பீரமாகவும் உள்ளது.
theological_decisions:
- issue: வெளிப்படுத்தலில் ναός குறிக்கும் பரலோக ஆலயப் படிமம்
  choice: பரிசுத்த இடம்
  alternative: ஆலயம்
  rationale: இது கோட்பாட்டுச் சேர்க்கை அல்ல; ναός மற்றும் விரிவான ஆலய வளாகம் ஆகியவற்றுக்கிடையிலான சொற்பொருள் வேறுபாட்டைப் பாதுகாக்கும் தேர்வு.
- issue: Γέγονεν என்பதன் நிறைவு அறிவிப்பு
  choice: நிறைவேறிவிட்டது
  alternative: நடந்துவிட்டது; முடிந்தது
  rationale: முடிவுற்று விளைவுடன் நிலைக்கும் perfect பொருளை வெளிப்படுத்துகிறது; எது குறிப்பாக நிறைவேறியது என்பதை உரையில் இல்லாத விளக்கத்தால் நிரப்பவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பான, கண்ணியமான நடையைக் கொண்டது. கிரேக்கத்தின் இரட்டை மூலவிவரம் (‘பரிசுத்த இடத்திலிருந்து, அரியணையிலிருந்து’) பாதுகாக்கப்பட்டுள்ளது. தமிழின் தெளிவுக்காக சூழலில் வெளிப்படையாக உள்ள ‘தூதர்’ சேர்க்கப்பட்டுள்ளது.
