id: REV.16.11
reference: Revelation 16:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐβλασφήμησαν τὸν θεὸν τοῦ οὐρανοῦ ἐκ τῶν πόνων αὐτῶν καὶ ἐκ τῶν ἑλκῶν αὐτῶν, καὶ οὐ μετενόησαν ἐκ τῶν ἔργων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/011.yaml
  text: And they blasphemed the God of heaven because of their pains and their sores[c][b][a], and they did not repent of their deeds.
translation:
  language: ta
  text: தங்களுடைய வேதனைகளினாலும் தங்களுடைய புண்களினாலும் அவர்கள் பரலோகத்தின் தேவனை நிந்தித்தார்கள்[a]; தங்களுடைய செயல்களைவிட்டு அவர்கள் மனந்திரும்பவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரலோகத்தின் தேவனைப் பழித்தார்கள்” அல்லது “அவருக்கு எதிராகத் தீமையாகப் பேசினார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: சொற்சொல்லாக, “தங்களுடைய செயல்களிலிருந்து மனந்திரும்பவில்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβλασφήμησαν
  choice: நிந்தித்தார்கள்
  rationale: தேவனுக்கு எதிராக அவதூறாகவும் அவமதிப்பாகவும் பேசுதல் என்ற βλασφημέω-வின் சமயச் சூழலுக்குரிய வலிமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὸν θεὸν τοῦ οὐρανοῦ
  choice: பரலோகத்தின் தேவனை
  rationale: மூலத்தின் மரியாதைக்குரிய வேதாகமப் பட்டத்தை நேரடியாகவும் வெளிப்படுத்தல் நூலின் கம்பீரமான தொனியுடனும் காக்கிறது.
- source_word: ἐκ τῶν πόνων αὐτῶν
  choice: தங்களுடைய வேதனைகளினாலும்
  rationale: இங்கு ἐκ காரணப் பொருளில் வருகிறது; πόνος கடும் வலி அல்லது வேதனையைக் குறிக்கிறது. தொடரும் இணையான சொற்றொடருடன் இயல்பாக அமைய ‘-இனால்’ பயன்படுத்தப்பட்டது.
- source_word: ἑλκῶν
  choice: புண்களினாலும்
  rationale: ἕλκος என்பது புண் அல்லது புண்ணழற்சியைக் குறிக்கலாம். ‘புண்கள்’ தெளிவான, பொதுவான தமிழ்; தேவையற்ற மருத்துவத் துல்லியத்தைச் சேர்ப்பதில்லை.
- source_word: μετενόησαν
  choice: மனந்திரும்பவில்லை
  rationale: வெளிப்படுத்தலில் μετανοέω வெறும் கருத்துமாற்றத்தை அல்ல, ஒழுக்க மற்றும் இறைநெறிசார் மனந்திரும்புதலைக் குறிக்கிறது.
- source_word: ἐκ τῶν ἔργων αὐτῶν
  choice: தங்களுடைய செயல்களைவிட்டு
  rationale: μετανοέω உடன் வரும் ἐκ, முந்தைய செயல்களிலிருந்து விலகித் திரும்புவதைக் குறிக்கிறது. ‘செயல்களைவிட்டு’ அந்தப் பிரிதல் நுணுக்கத்தைத் தமிழில் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: மீண்டும் வரும் ἐκ சொற்றொடர்களின் பொருள்
  choice: வேதனைகளும் புண்களும் காரணமாக அவர்கள் தேவனை நிந்தித்தார்கள்; தங்கள் செயல்களைவிட்டு மனந்திரும்பவில்லை.
  alternative: வேதனைகளிலிருந்தும் புண்களிலிருந்தும் அவர்கள் தேவனை நிந்தித்தார்கள் என்ற சொற்சொல் சார்ந்த இடவியல் மொழிபெயர்ப்பு.
  rationale: முதல் இரு இடங்களில் ἐκ காரணத்தையும், μετανοέω உடன் வரும் கடைசி இடத்தில் விலகுதலையும் குறிக்கிறது. இதனால் நியாயத்தீர்ப்பின் வேதனை மனந்திரும்புதலுக்கு மாறாக நிந்தனைக்கு வழிவகுக்கும் பதற்றம் விளக்கவுரை சேர்க்காமல் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், வெளிப்படுத்தல் நூலுக்கேற்ற கம்பீரத்துடனும் அமைக்கப்பட்டது. மூலத்தில் உள்ள இரண்டு காரணச் சொற்றொடர்களின் இணை அமைப்பும், இறுதியில் செயல்களிலிருந்து திரும்ப மறுக்கும் கருத்தும் காக்கப்பட்டுள்ளன.
