id: REV.16.21
reference: Revelation 16:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ χάλαζα μεγάλη ὡς ταλαντιαία καταβαίνει ἐκ τοῦ οὐρανοῦ ἐπὶ τοὺς ἀνθρώπους· καὶ ἐβλασφήμησαν οἱ ἄνθρωποι τὸν θεὸν ἐκ τῆς πληγῆς τῆς χαλάζης, ὅτι μεγάλη ἐστὶν ἡ πληγὴ αὐτῆς σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/021.yaml
  text: And great hail[a], about a talent in weight, comes down from heaven upon the people; and the people blasphemed God because of the plague of the hail[b], because its plague is exceedingly severe.
translation:
  language: ta
  text: சுமார் ஒரு தாலந்து எடையுள்ள மிகப் பெரிய ஆலங்கட்டிகள்[a] வானத்திலிருந்து மனிதர்கள்மேல் விழுகின்றன. ஆலங்கட்டி வாதையின் காரணமாக மனிதர்கள் கடவுளை நிந்தித்தார்கள்; ஏனெனில் அதன் வாதை மிகவும் கடுமையானது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு தாலந்து எடையுள்ளதுபோன்றவை.” அதாவது, ஒவ்வொன்றும் ஏறக்குறைய ஒரு தாலந்து எடையுள்ளவை; கிரேக்கச் சொற்றொடர் துல்லியமான அளவை அல்ல, ஒப்பீட்டைத் தெரிவிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஏனெனில் அதன் வாதை மிகவும் பெரியது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χάλαζα μεγάλη
  choice: மிகப் பெரிய ஆலங்கட்டிகள்
  rationale: கிரேக்கத்தில் ஒருமைத் தொகுப்புப் பெயராக இருந்தாலும், தமிழில் தனித்தனியாக விழும் கட்டிகளை இயல்பாகவும் தெளிவாகவும் குறிக்கப் பன்மை பயன்படுத்தப்பட்டது; μεγάλη என்பதன் அளவு வலியுறுத்தப்படுகிறது.
- source_word: ὡς ταλαντιαία
  choice: ஒரு தாலந்து எடையுள்ளவை போன்ற
  rationale: ὡς தரும் ஒப்பீட்டுத் தன்மையைப் பேணி, இது துல்லியமான அளவீடு அல்ல என்பதை வெளிப்படுத்துகிறது. ‘தாலந்து’ இங்கு எடை அலகு.
- source_word: καταβαίνει
  choice: விழுகின்றன
  rationale: ஆலங்கட்டிகளுக்கான இயல்பான தமிழ்ச் சொல்லாட்சியாகவும், கிரேக்கத்தின் நிகழ்காலக் காட்சித் தீவிரத்தைப் பேணவும் நிகழ்காலம் பயன்படுத்தப்பட்டது.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: வானத்திலிருந்து
  rationale: οὐρανός என்பதன் ‘வானம்/பரலோகம்’ என்ற பரப்பை முற்றிலும் இறுக்காமல், ஆலங்கட்டி விழும் நேரடிக் காட்சிக்கு ஏற்ற ‘வானம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἐπὶ τοὺς ἀνθρώπους
  choice: மனிதர்கள்மேல்
  rationale: ἄνθρωποι பாலினப் பொதுப்பொருளில் வருவதால், ஆண்களை மட்டும் குறிக்காத ‘மனிதர்கள்’ பயன்படுத்தப்பட்டது.
- source_word: ἐβλασφήμησαν
  choice: பழித்துரைத்தார்கள்
  rationale: கடவுளுக்கு எதிரான அவதூறான, அவமதிப்பான பேச்சை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; வெறும் ‘சபித்தார்கள்’ என்பதைக் காட்டிலும் βλασφημέω-வின் கருத்துக்கு நெருக்கமானது.
- source_word: ἐκ τῆς πληγῆς τῆς χαλάζης
  choice: ஆலங்கட்டி வாதையினால்
  rationale: ἐκ காரணத்தைக் குறிக்கிறது. வெளிப்படுத்தலில் πληγή தெய்வீகத் தீர்ப்பாக வரும் ‘வாதை’ என்ற தொடர்ச்சியான கருத்தைத் தக்கவைக்கிறது.
- source_word: ὅτι μεγάλη ἐστὶν ἡ πληγὴ αὐτῆς σφόδρα
  choice: ஏனெனில் அதன் வாதை மிகக் கொடியதாக இருந்தது
  rationale: μεγάλη ... σφόδρα என்பதன் மிகுதியையும் தாக்கத்தின் கடுமையையும் இயல்பான தமிழில் தெரிவிக்கிறது; αὐτῆς ஆலங்கட்டியைச் சுட்டுகிறது.
theological_decisions:
- issue: οὐρανός என்பதன் பொருள்
  choice: வானத்திலிருந்து
  alternative: பரலோகத்திலிருந்து
  rationale: சூழலில் ஆலங்கட்டி மேலிருந்து விழும் காட்சி முன்னிலையில் உள்ளது; அதேவேளை ‘வானம்’ வெளிப்படுத்தலின் மேலுலகத் தீர்ப்பு நிழலையும் முற்றிலும் நீக்குவதில்லை.
- issue: ἄνθρωποι என்பதன் பொதுப்பாலினக் குறிப்பு
  choice: மனிதர்கள்
  alternative: மக்கள்
  rationale: இது ஆண்களை மட்டும் அல்லாது மனிதர்களைப் பொதுவாகக் குறிக்கிறது; ‘மனிதர்கள்’ மூலச் சொல்லைத் தெளிவாகப் பிரதிபலிக்கிறது.
- issue: πληγή என்பதன் தீர்ப்புசார் பொருள்
  choice: வாதை
  alternative: பேரடி / துன்பம்
  rationale: வெளிப்படுத்தல் நூலில் ஏற்படும் தீர்ப்புச் சம்பவங்களோடு சொல்லியல் தொடர்பைப் பேணுகிறது; வெறும் உடல் தாக்கமாக மட்டும் பொருளைக் குறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான வெளிப்படுத்தல் நூல் நடையைப் பேணிய மொழிபெயர்ப்பு. அரிதான எடை அலகான ‘தாலந்து’ அடிக்குறிப்பால் விளக்கப்படுகிறது; நிகழ்காலம் காட்சியின் உயிரோட்டத்திற்காகவும், இறந்தகாலம் மனிதர்களின் எதிர்வினைக்கும் விளக்கக் கூற்றிற்கும் மூலத்தின் காலமாற்றத்துக்கு ஏற்பவும் வைக்கப்பட்டுள்ளது.
