id: REV.16.6
reference: Revelation 16:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι αἷμα ἁγίων καὶ προφητῶν ἐξέχεαν, καὶ αἷμα αὐτοῖς ⸀δέδωκας πιεῖν· ἄξιοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/006.yaml
  text: because they poured out the blood of saints and prophets[a], and you have given them blood to drink[b]; they are worthy.
translation:
  language: ta
  text: ஏனெனில், அவர்கள் பரிசுத்த மக்களினதும் இறைவாக்கினர்களினதும் இரத்தத்தை ஊற்றினார்கள்[a]; நீர் அவர்களுக்கு இரத்தத்தைக் குடிக்கக் கொடுத்தீர். அவர்கள் இதற்கு உரியவர்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பரிசுத்த மக்களினதும் இறைவாக்கினர்களினதும் இரத்தத்தைச் சிந்தினார்கள்.’ கிரேக்க வினைச்சொல்லின் நேரடிப் பொருள் ‘ஊற்றினார்கள்’; இது சுற்றியுள்ள பகுதியில் நீதித்தீர்ப்பின் கிண்ணங்கள் ஊற்றப்படுவதையும் எதிரொலிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘இதற்கு உரியவர்கள்’ என்பது, இந்த நீதித்தீர்ப்பை அடைவதற்கு அவர்கள் உரியவர்கள் என்று பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட தீர்ப்பிற்கான காரணத்தை அறிமுகப்படுத்தும் காரண இணைப்பாக இயல்பாக அமைகிறது.
- source_word: αἷμα
  choice: இரத்தம்
  rationale: இரண்டு இடங்களிலும் நேரடிப் பொருளைத் தக்கவைத்து, இரத்தம் சிந்தியவர்களுக்கு இரத்தமே குடிக்க வழங்கப்படும் அளவொத்த நீதித்தீர்ப்பை வெளிப்படுத்துகிறது.
- source_word: ἁγίων
  choice: பரிசுத்த மக்கள்
  rationale: வெளிப்படுத்தின விசேஷத்தில் கடவுளுக்குரிய மக்களைக் குறிக்கும் பரந்த வேதாகமப் பொருளைத் தருகிறது; பிற்காலத்தில் அதிகாரபூர்வமாகப் புனிதர் என அறிவிக்கப்பட்ட ஒரு தனி வகுப்பைக் குறிக்கவில்லை.
- source_word: προφητῶν
  choice: இறைவாக்கினர்கள்
  rationale: கடவுளிடமிருந்து செய்தியை அறிவிப்பவர்களைக் குறிக்கும் நவீன, தெளிவான தமிழ் சொல்.
- source_word: ἐξέχεαν
  choice: ஊற்றினார்கள்
  rationale: ἐκχέω என்பதன் அடிப்படைப் படிமத்தைப் பாதுகாப்பதோடு, சுற்றியுள்ள கிண்ணங்கள் ஊற்றப்படும் நியாயத்தீர்ப்புக் காட்சியுடனான சொல்லொலித் தொடர்பையும் தக்கவைக்கிறது.
- source_word: αὐτοῖς
  choice: அவர்களுக்கு
  rationale: இரத்தத்தை ஊற்றியவர்களையே மறுபடியும் சுட்டும் பன்மை மறைமுகச் செயப்படுபொருளை இயல்பாகக் காட்டுகிறது.
- source_word: δέδωκας
  choice: கொடுத்தீர்
  rationale: நிறைவேறிய தெய்வீகச் செயலைத் தமிழ் இறந்தகாலம் இயல்பாக வெளிப்படுத்துகிறது; கடவுளை நோக்கிய மரியாதை ஒருமை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: πιεῖν
  choice: குடிக்க
  rationale: ‘கொடுத்தீர்’ என்பதன் நோக்கத்தைத் தெரிவிக்கும் வினையெச்சமாக நேரடியாகவும் இயல்பாகவும் அமைகிறது.
- source_word: ἄξιοί εἰσιν
  choice: அவர்கள் அதற்குத் தகுதியானவர்களே
  rationale: ‘தகுதியானவர்கள்’ என்ற மதிப்பீட்டு மொழியைத் தக்கவைக்கிறது; தமிழில் வாக்கியம் தெளிவாக அமைய ‘அதற்கு’ சேர்க்கப்பட்டுள்ளது, அது சூழலில் உள்ள நீதித்தீர்ப்பையே சுட்டுகிறது.
theological_decisions:
- issue: பழிவினைக்கேற்ற நீதியின் கடுமையான மொழி
  choice: ‘நீர் அவர்களுக்கு இரத்தத்தைக் குடிக்கக் கொடுத்தீர்’ என்ற நேரடியான உருவகத்தை மென்மைப்படுத்தாமல் வைத்தல்
  alternative: ‘அவர்களுடைய செயலுக்கேற்ற தண்டனையை அளித்தீர்’ என்று பொதுமைப்படுத்துதல்
  rationale: கிரேக்க உரை இரத்தத்திற்கு இரத்தம் என்ற அளவொத்த தெய்வீக நீதித்தீர்ப்பைத் திட்டவட்டமாகக் காட்டுகிறது; பொதுவான தண்டனை மொழி அந்தக் கடுமையையும் படிமத்தையும் இழக்கச் செய்யும்.
- issue: ἄξιοί εἰσιν என்பதன் மதிப்பீடு
  choice: ‘அவர்கள் அதற்குத் தகுதியானவர்களே’
  alternative: ‘அவர்கள் நல்ல தகுதியுடையவர்கள்’ அல்லது ‘அவர்கள் இதற்குப் பாத்திரமானவர்கள்’
  rationale: இங்கு ‘தகுதி’ என்பது அறநன்மைக்கான பாராட்டு அல்ல; அவர்கள் பெற்ற நீதித்தீர்ப்புக்கு உரியவர்கள் என்பதே பொருள். அடிக்குறிப்பு இந்தச் சூழற்பொருளைத் தெளிவாக்குகிறது.
- issue: ‘பரிசுத்த மக்கள்’ என்பதன் குறிப்பு
  choice: கடவுளுக்குரிய மக்களைப் பரந்த வேதாகமப் பொருளில் குறித்தல்
  alternative: பிற்காலத் திருச்சபை முறையில் அதிகாரபூர்வமாகப் புனிதர் என அறிவிக்கப்பட்டவர்களாகக் குறுக்குதல்
  rationale: ἅγιοι என்பது வெளிப்படுத்தின விசேஷத்தில் பொதுவாகக் கடவுளுடைய பரிசுத்த மக்களைக் குறிக்கிறது; மொழிபெயர்ப்பு பிற்காலச் சமய வகைப்பாட்டை இறக்குமதி செய்யக்கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. கடவுளை நேரடியாக அழைக்கும் இடத்தில் ‘நீர்/கொடுத்தீர்’ என்ற மரியாதை ஒருமை பயன்படுத்தப்பட்டது. ‘ஊற்றினார்கள்’ சற்றுக் கூர்மையான சொல்லாக்கமாக இருந்தாலும், மூலத்தின் படிமத்தையும் கிண்ணத் தீர்ப்புகளுடனான தொடர்பையும் நோக்கமுடன் பாதுகாக்கிறது.
