revisions:
- from: ஏனெனில், அவர்கள் பரிசுத்த மக்களுடையவும் இறைவாக்கினர்களுடையவும் இரத்தத்தை ஊற்றினார்கள்[a]. நீர் அவர்களுக்கு இரத்தத்தைக் குடிக்கக் கொடுத்தீர்; அவர்கள் அதற்குத் தகுதியானவர்களே[b].
  to: ஏனெனில், அவர்கள் பரிசுத்த மக்களினதும் இறைவாக்கினர்களினதும் இரத்தத்தை ஊற்றினார்கள்[a]; நீர் அவர்களுக்கு இரத்தத்தைக் குடிக்கக் கொடுத்தீர். அவர்கள் இதற்கு உரியவர்கள்[b].
  rationale: மூலத்தின் உருவகத்தையும் கடுமையான நீதித்தீர்ப்பு மொழியையும் மாற்றாமல், உடைமைத் தொடரை இயல்பாக்கி, இறுதி மதிப்பீட்டில் உள்ள தேவையற்ற வலியுறுத்தலை நீக்கியுள்ளேன். ‘இதற்கு’ என்பது தமிழில் மதிப்பீட்டின் சூழல்-குறிப்பைத் தெளிவாக்குகிறது; நீதித்தீர்ப்பின் பொருளைத் திணிப்பதல்ல, உடனடி சூழலில் அது ஏற்கெனவே வெளிப்படையாக உள்ளது.
