source:
  edition: SBLGNT
  text: Καὶ ἤκουσα ⸂μεγάλης φωνῆς⸃ ἐκ τοῦ ναοῦ λεγούσης τοῖς ἑπτὰ ἀγγέλοις· Ὑπάγετε καὶ ⸀ἐκχέετε τὰς ἑπτὰ φιάλας τοῦ θυμοῦ τοῦ θεοῦ εἰς τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/001.yaml
  text: And I heard a loud voice from the sanctuary saying to the seven angels[b][a], “Go and pour out the seven bowls of the wrath of God onto the earth.”
translation:
  language: ta
  text: ஆலயத்திலுள்ள பரிசுத்த இடத்திலிருந்து[a] ஒரு உரத்த குரல் ஏழு தூதர்களிடம், “நீங்கள் போய், கடவுளுடைய கடுங்கோபத்தின் ஏழு கிண்ணங்களையும் பூமியின்மேல் ஊற்றுங்கள்” என்று சொல்வதைக் கேட்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆலயத்திலிருந்து.” கிரேக்கச் சொல் ναός பொதுவாக ஆலய வளாகம் முழுவதையும் விட அதன் உட்புறப் பரிசுத்த இடத்தைக் குறிப்பாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλης φωνῆς
  choice: உரத்த குரல்
  rationale: φωνή என்பதுடன் μέγας வரும்போது குரலின் பெருமையைவிட அதன் ஒலியளவையே குறிக்கிறது; ‘உரத்த குரல்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: ναοῦ
  choice: ஆலயத்தின் பரிசுத்த இடம்
  rationale: ναός பொதுவாக ஆலய வளாகம் முழுவதையும் அல்லாமல் அதன் உட்புறப் பரிசுத்த இடத்தைக் குறிக்கிறது; இச்சொற்றொடர் அந்த நுணுக்கத்தைத் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: λεγούσης
  choice: சொல்வது
  rationale: இந்நிகழ்காலப் பெயரெச்சம் ‘குரல்’ என்பதுடன் இலக்கண ரீதியாக இணைகிறது; ‘என்று சொல்வதைக் கேட்டேன்’ என்பது தமிழில் இயல்பாக அந்த உறவை வெளிப்படுத்துகிறது.
- source_word: Ὑπάγετε
  choice: நீங்கள் போய்
  rationale: தூதர்கள் புறப்பட்டுச் சென்று கட்டளையை நிறைவேற்ற வேண்டும் என்ற நேரடியான ஏவலைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐκχέετε
  choice: ஊற்றுங்கள்
  rationale: பாத்திரங்களிலுள்ளவை முழுமையாக வெளியே ஊற்றப்படுகின்ற காட்சிப்படிமத்தைப் பாதுகாக்கிறது.
- source_word: φιάλας
  choice: கிண்ணங்கள்
  rationale: φιάλη என்பது சிறு குப்பியைக் காட்டிலும் அகன்ற, ஆழம் குறைந்த பாத்திரத்தைக் குறிக்கிறது; ‘கிண்ணங்கள்’ அதற்குப் பொருத்தமான நவீனத் தமிழ்.
- source_word: θυμοῦ
  choice: கடுங்கோபம்
  rationale: இங்கு கடவுளின் தீவிரமான நியாயத்தீர்ப்புக் கோபம் குறிக்கப்படுகிறது; ‘கடுங்கோபம்’ அதன் வலிமையையும் கடுமையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἰς τὴν γῆν
  choice: பூமியின்மேல்
  rationale: ἐκχέω என்பதுடன் εἰς சேர்ந்து ஒரு பரப்பின்மேல் ஊற்றப்படும் திசையைக் காட்டுகிறது; சூழல் உலகளாவிய தீர்ப்பைப் பற்றியது என்பதால் ‘பூமி’ பொருத்தமானது.
theological_decisions:
- issue: வெளிப்படுத்துதலின் பரலோகக் காட்சியில் ναός என்பதன் பொருள்
  choice: ஆலயத்தின் பரிசுத்த இடம்
  alternative: ஆலயம்
  rationale: இந்தத் தேர்வு ஆலய வளாகம் முழுவதைக் காட்டிலும் உட்புறத் திருப்பகுதியை ναός குறிக்கும் நுணுக்கத்தைப் பாதுகாக்கிறது; உரையில் இல்லாத தனிப்பட்ட கோட்பாட்டைச் சேர்ப்பதில்லை.
- issue: θυμός τοῦ θεοῦ என்பதன் மொழிபெயர்ப்பு
  choice: கடவுளுடைய கடுங்கோபம்
  alternative: கடவுளுடைய கோபம்
  rationale: இச்சொற்றொடர் தீமைக்கு எதிரான கடவுளின் தீவிரமான நியாயத்தீர்ப்பைக் குறிக்கிறது; ‘கடுங்கோபம்’ மூலச்சொல்லின் வலிமையைப் பாதுகாக்கிறது, ஆனால் அதற்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், சாதாரண வாசகர்களுக்குப் புரியுமாறும் வெளிப்படுத்துதலின் கம்பீரமான தீர்ப்புக் காட்சிக்கு ஏற்ற நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நீங்கள்’ என்பது தமிழில் பன்மைக் கட்டளையைத் தெளிவாக்குகிறது; ‘அனைத்தும்’ என்ற கூடுதல் சொல்லைச் சேர்க்காமல், ஏழு கிண்ணங்களையும் என்ற இரண்டாம் வேற்றுமை வடிவமே முழுமையைத் தெரிவிக்கிறது.
