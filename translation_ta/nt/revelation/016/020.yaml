  text: καὶ πᾶσα νῆσος ἔφυγεν, καὶ ὄρη οὐχ εὑρέθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/020.yaml
  text: And every island fled[a], and mountains were not found.
translation:
  language: ta
  text: ஒவ்வொரு தீவும் தப்பி ஓடியது[a]; மலைகள் காணப்படவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மறைந்தது.’ கிரேக்க வினைச்சொல்லின் நேரடிப் பொருள் ‘தப்பி ஓடியது’; இது வசனத்தின் உயிரூட்டும் காட்சித்தன்மையைப் பாதுகாக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα
  choice: ஒவ்வொரு
  rationale: ஒருமையான νῆσος என்பதுடன் வரும் πᾶσα, ஒவ்வொரு தீவையும் தனித்தனியாகக் குறிக்கும் பகிர்வுப் பொருளைக் கொண்டது.
- source_word: νῆσος
  choice: தீவு
  rationale: இச்சொல் நேரடியாக ‘தீவு’ என்பதைக் குறிக்கிறது; தமிழில் ‘ஒவ்வொரு தீவும்’ என்பது இயல்பான ஒருமைக் கட்டமைப்பு.
- source_word: ἔφυγεν
  choice: தப்பி ஓடியது
  rationale: φεύγω என்பதன் அடிப்படைப் பொருளான ‘தப்பி ஓடு’ என்பதைத் தக்கவைத்து, வெளிப்படுத்தின விசேஷத்தின் உயிரூட்டப்பட்ட காட்சித்தன்மையைப் பாதுகாக்கிறது.
- source_word: ὄρη
  choice: மலைகள்
  rationale: பன்மையான ὄρη என்பதற்கான நேரடியான, இயல்பான தமிழ் இணை.
- source_word: οὐχ εὑρέθησαν
  choice: காணப்படவில்லை
  rationale: εὑρίσκω என்பதன் இறந்தகாலச் செயலப்பாட்டு வடிவத்தையும் οὐχ மறுப்பையும் சுருக்கமாகவும் நேரடியாகவும் பிரதிபலிக்கிறது; ‘இனி’ போன்ற கூடுதல் கருத்தைச் சேர்க்கவில்லை.
- source_word: καὶ ... καὶ
  choice: …; …
  rationale: முதல் καί முந்தைய வசனத்துடனான தொடர்ச்சியைச் சுட்டுகிறது; ஒரே வசனத்தில் உள்ள இரு இணைநிலைப் பகுதிகளை தமிழில் அரைப்புள்ளி இயல்பாக இணைக்கிறது. இரண்டாம் καί-யின் இணைப்புச் செயல்பாடு இதனால் தக்கவைக்கப்படுகிறது.
theological_decisions:
- issue: தீவுகள் தப்பி ஓடுவதும் மலைகள் காணப்படாமற்போவதும் நேரடியான நிகழ்வா அல்லது குறியீட்டு மொழியா என்பதை மொழிபெயர்ப்பிலேயே தீர்மானித்தல்
  choice: கிரேக்கத்தின் உறுதியான பேரழிவுக் காட்சியையும் உயிரூட்டலையும் அப்படியே தக்கவைத்தல்
  alternative: ‘ஒவ்வொரு தீவும் மறைந்தது’ என்று விளக்கப் பொருளில் மொழிபெயர்த்தல்
  rationale: மூலவாக்கியம் ‘தப்பி ஓடியது’ என்ற உயிரூட்டப்பட்ட காட்சியை முன்வைக்கிறது. அது நேரடியானதா குறியீட்டானதா என்பதை மொழிபெயர்ப்பு தீர்மானிக்காமல், வாசகரின் விளக்கத்திற்கு விடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘தப்பி ஓடியது’ என்பது ‘ஓடிப்போனது’ என்பதைவிட மூல வினையின் flee/escape நுணுக்கத்தைத் தெளிவாகத் தக்கவைக்கிறது; ‘காணப்படவில்லை’ செயலப்பாட்டு அமைப்பை இயல்பாகப் பிரதிபலிக்கிறது.
