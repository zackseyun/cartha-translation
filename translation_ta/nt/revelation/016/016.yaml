source:
  edition: SBLGNT
  text: καὶ συνήγαγεν αὐτοὺς εἰς τὸν τόπον τὸν καλούμενον Ἑβραϊστὶ Ἁρμαγεδών.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/016.yaml
  text: And he gathered them to the place that in Hebrew is called Armageddon[a][b].
translation:
  language: ta
  text: அவன் அவர்களை எபிரேய மொழியில் “அர்மகெதோன்” என்று அழைக்கப்படும் இடத்திற்கு ஒன்றுகூட்டினான்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில், “அவன்/அது அவர்களை ஒன்றுகூட்டியது.” வினைச்சொல் ஒருமையில் உள்ளது; ஆனால் 13–14ஆம் வசனங்களில் அரசர்களை ஒன்றுகூட்டப் புறப்படும் அசுத்த ஆவிகளைத் தொடர்ந்து வருவதால், “அவர்கள் ஒன்றுகூட்டினார்கள்” என்றும் பொருள் கொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “எபிரேய/அரமேய மொழியில்.” வெளிப்படுத்தல் நூலில் “எபிரேய மொழியில்” என்பது எபிரேயம் மற்றும் அரமேயம் ஆகியவற்றுக்கிடையே கண்டிப்பான வேறுபாட்டை வலியுறுத்தாமல், அந்தப் பெயரின் செமித்திய மொழி வடிவத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγεν
  choice: அவன் ... ஒன்றுகூட்டினான்
  rationale: கிரேக்க வினைச்சொல் மூன்றாம் நபர் ஒருமையில் இருப்பதை முதன்மை உரை நேரடியாகப் பிரதிபலிக்கிறது. முன் வசனங்களில் அசுத்த ஆவிகள் கூட்டிச் சேர்க்கச் செல்வதால் பன்மை முகவரைக் கொள்ளும் வாய்ப்பு அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: αὐτοὺς
  choice: அவர்களை
  rationale: சூழலில் ஒன்றுகூட்டப்படும் அரசர்களைக் குறிக்கும் ஆண்பால்/மனிதப் பன்மை செயப்படுபொருள் சுட்டுப்பெயர்.
- source_word: τὸν τόπον
  choice: இடத்தில்
  rationale: τόπος என்பதன் இயல்பான நவீனத் தமிழ் இணை; εἰς உடன் வரும் இலக்கு உணர்வு, ஒன்றுகூட்டுதல் நிகழும் இலக்கிடமாகத் தமிழில் இயல்பாக வெளிப்படுகிறது.
- source_word: τὸν καλούμενον
  choice: என்று அழைக்கப்படும்
  rationale: இடத்தை விவரிக்கும் நிகழ்காலச் செயப்பாட்டு எச்சத்தின் பொருளையும் பெயரிடப்படுதல் என்ற உணர்வையும் காக்கிறது.
- source_word: Ἑβραϊστὶ
  choice: எபிரேய மொழியில்
  rationale: வெளிப்படுத்தலில் வரும் சொல்லின் வழக்கமான, உரைத் தெளிவுள்ள மொழிபெயர்ப்பு. இது எபிரேயம் அல்லது விரிந்த செமித்திய மொழிவழக்கைக் குறிக்கக்கூடும் என்ற நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: Ἁρμαγεδών
  choice: அர்மகெதோன்
  rationale: மூலப் பெயரின் ஒலிப்பெயர்ப்பு; தமிழில் புரிந்துகொள்ளத்தக்க, வேதாகம நடைக்கு ஏற்ற வடிவம்.
theological_decisions:
- issue: ஒன்றுகூட்டும் முகவர்
  choice: 'ஒருமை முகவர்: “அவன் ... ஒன்றுகூட்டினான்”'
  alternative: “அவர்கள் ... ஒன்றுகூட்டினார்கள்” அல்லது “அது ... ஒன்றுகூட்டியது”
  rationale: συνήγαγεν இலக்கண ரீதியில் ஒருமை; ஆகவே முதன்மை உரையில் அதை மாற்றாமல் காக்கப்படுகிறது. ஆனால் அந்த ஒருமை முகவர் யார் என்பதை வசனம் வெளிப்படையாகச் சொல்லவில்லை; மேலும் 13–14ஆம் வசனங்களின் அசுத்த ஆவிகள் பன்மை முகவராகப் புரிந்துகொள்ளப்படலாம். இந்த இறையியல் மற்றும் இலக்கியத் திறந்தநிலை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. “ஒன்றுகூட்டினான்” என்பது வெறும் அருகருகே கொண்டுவருதல் அல்லாமல் குறிப்பிட்ட இடத்தில் திரட்டுதல் என்ற συνάγω-வின் உணர்வை வழங்குகிறது. மூலத்தில் முகவரின் பாலினம் வெளிப்படையாகக் குறிக்கப்படாதபோதும், தமிழின் இறந்தகால ஒருமை வினைமுற்று பாலினத் தேர்வை வேண்டுவதால் “அவன்” பயன்படுத்தப்பட்டு, “அது” என்ற வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
