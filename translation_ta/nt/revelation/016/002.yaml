id: REV.16.2
reference: Revelation 16:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἀπῆλθεν ὁ πρῶτος καὶ ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τὴν γῆν· καὶ ἐγένετο ἕλκος κακὸν καὶ πονηρὸν ἐπὶ τοὺς ἀνθρώπους τοὺς ἔχοντας τὸ χάραγμα τοῦ θηρίου καὶ τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/002.yaml
  text: And the first went and poured out his bowl onto the earth[a], and a harmful and grievous sore came upon the people who had the mark of the beast and who worshiped its image.
translation:
  language: ta
  text: முதலாவது தூதன் போய், தன் கிண்ணத்தைப் பூமியின் மேல் ஊற்றினான். அப்போது, மிருகத்தின் முத்திரையை உடையவர்களாகவும் அதன் உருவச்சிலையை வழிபடுகிறவர்களாகவும் இருந்த மக்கள்மீது தீங்கு விளைவிக்கும், கொடிய புண் உண்டாயிற்று.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தீங்கு விளைவிக்கும், கொடிய புண்’ என்பதற்கு ‘அருவருப்பான, தீய புண்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் κακόν, πονηρόν என்ற இரண்டு வலுவான பெயரடைகள் பேரிடரின் கடுமையை வலியுறுத்துகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πρῶτος
  choice: முதலாவது தூதன்
  rationale: கிரேக்கத்தில் பெயர்ச்சொல் வெளிப்படையாக இல்லாமல் ‘முதலாவது’ என்று மட்டும் இருந்தாலும், முந்தைய வசனச் சூழலில் ஏழு தூதர்களில் முதலாமவனே குறிக்கப்படுகிறான். தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க ‘தூதன்’ சேர்க்கப்பட்டது.
- source_word: ἀπῆλθεν
  choice: போய்
  rationale: கதைத் தொடரில் நிகழும் நகர்வை எளிய, இயல்பான தமிழில் தெரிவிக்கிறது; தேவையற்ற ‘புறப்பட்டுச் சென்றான்’ போன்ற வலியுறுத்தல் சேர்க்கப்படவில்லை.
- source_word: ἐξέχεεν
  choice: ஊற்றினான்
  rationale: கிண்ணத்திலுள்ளதை வெளியே ஊற்றும் செயலை இயல்பாகக் குறிக்கிறது; தமிழில் ‘ஊற்றிவிட்டான்’ என்பது தேவையற்ற நிறைவு வலியுறுத்தலைச் சேர்க்கக்கூடும்.
- source_word: φιάλην
  choice: கிண்ணத்தை
  rationale: φιάλη என்பது திரவம் தாங்கும் அகன்ற பாத்திரம். ‘கிண்ணம்’ நவீன வாசகர்களுக்கு எளிதில் புரியும்; ‘குப்பி’ என்பது தவறாகச் சிறிய பாட்டிலை நினைவூட்டும்.
- source_word: εἰς τὴν γῆν
  choice: பூமியின்மேல்
  rationale: கிண்ணம் ஊற்றப்பட்ட இலக்கைத் தெரிவிக்கிறது. வெளிப்படுத்தின விசேஷத்தின் உலகளாவிய பேரிடர் சூழலில் γῆ-க்கு ‘பூமி’ பொருத்தமானது; ‘நிலம்’ என்பதும் சொற்பொருளில் சாத்தியம்.
- source_word: ἐγένετο
  choice: உண்டாயிற்று
  rationale: ஊற்றப்பட்டதன் விளைவாகப் புண் தோன்றியதைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: ἕλκος
  choice: புண்
  rationale: புண்ணாகிய அல்லது சீழ்ப்பிடித்த தோல் காயத்தைக் குறிக்கும் பரந்த, எளிதில் புரியும் சொல்; ‘கொப்புளம்’ அல்லது மருத்துவத் தன்மையுள்ள ‘புண்ணழற்சி’ ஆகியவை மிகக் குறிப்பானவை.
- source_word: κακὸν καὶ πονηρὸν
  choice: தீங்கான, கொடிய
  rationale: இரண்டு வலுவான எதிர்மறைப் பெயரடைகளையும் தனித்தனியாகக் காத்து, புண்ணின் தீங்கையும் கடுமையையும் தெரிவிக்கிறது; புண்ணுக்கு ஒழுக்கரீதியான ‘தீமை’ இருப்பதாகப் பொருள் கொள்ளாமல் தவிர்க்கிறது.
- source_word: ἐπὶ τοὺς ἀνθρώπους
  choice: அவர்கள்மீதும்
  rationale: ἄνθρωποι ஆண் பாலினரை மட்டும் அல்லாமல் மனிதர்களைப் பொதுவாகக் குறிக்கிறது. பின்னரும் வரும் இரு குழு வருணனைகளோடு ‘-மீதும்’ அமைப்பு இயல்பாக இணைகிறது.
- source_word: τοὺς ἔχοντας τὸ χάραγμα τοῦ θηρίου
  choice: மிருகத்தின் முத்திரையைப் பெற்றிருந்தவர்கள்
  rationale: χάραγμα என்பது பொறிக்கப்பட்ட அடையாளம் அல்லது முத்திரை. வெளிப்படுத்தின விசேஷத்தின் நிலையான கருத்தை ‘முத்திரை’ தெளிவாகத் தருகிறது; ‘பெற்றிருந்த’ என்பது அந்த அடையாளம் அவர்களிடம் இருந்த நிலையை இயல்பாகக் கூறுகிறது.
- source_word: τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ
  choice: அதன் உருவச்சிலையை வழிபட்டவர்கள்
  rationale: προσκυνέω இச்சூழலில் மத வழிபாட்டைக் குறிக்கிறது. εἰκών என்பது மிருகத்தைப் பிரதிநிதித்துவப்படுத்தும் வழிபாட்டு உருவம் என்பதால் ‘உருவச்சிலை’ வாசகருக்குத் தெளிவாக உள்ளது.
theological_decisions:
- issue: κακὸν καὶ πονηρὸν என்ற இரட்டை பெயரடைகளின் பொருள்
  choice: ‘தீங்கான, கொடிய புண்’ என்று மொழிபெயர்த்தல்
  alternative: ‘அருவருப்பான, தீய புண்’ அல்லது ‘தீங்கான, வேதனைமிக்க புண்’
  rationale: மூலம் இரண்டு நெருங்கிய எதிர்மறைச் சொற்களை அடுக்கி பேரிடரின் கடுமையை வலுப்படுத்துகிறது. தேர்ந்த மொழிபெயர்ப்பு இரண்டையும் காத்து, புண்ணுக்கு ஒழுக்கத் தீமை இருப்பதாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- issue: தண்டனைக்கு உள்ளானவர்களின் வரம்பு
  choice: மிருகத்தின் முத்திரையைப் பெற்றிருந்தவர்களும் அதன் உருவச்சிலையை வழிபட்டவர்களும் என்று குறிப்பாக வைத்தல்
  alternative: மக்கள் அனைவர்மீதும் பேரிடர் வந்ததாகப் பொதுமைப்படுத்தல்
  rationale: கிரேக்க உரை மிருகத்தோடு அடையாளப்படுத்தப்பட்டவர்களையே வெளிப்படையாக வரையறுக்கிறது. அந்த வரம்பு விரிவாக்கமின்றி பாதுகாக்கப்பட்டது.
- issue: αὐτοῦ என்பதன் இலக்கணப் பால் மற்றும் தமிழ் சுட்டுப்பெயர்
  choice: மிருகத்தைக் குறிக்க ‘அதன்’ பயன்படுத்தப்பட்டது
  alternative: தனிநபர்போல் ‘அவனுடைய’ பயன்படுத்துதல்
  rationale: θηρίον கிரேக்கத்தில் நடுநிலைப் பெயர்ச்சொல்; உரை மிருகத்தை மனித ஆளாகத் தீர்மானிக்கவில்லை. ‘அதன்’ அந்த உருவகத் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வாசிக்க எளிதானதாயும் மரியாதைக்குரியதாயும் அமைக்கப்பட்டது. தொடர்ச்சியான இரண்டு பங்கேற்பு அமைப்புகள் தமிழில் இணையான ‘-வர்கள்மீதும் ... -வர்கள்மீதும்’ வடிவில் தரப்பட்டுள்ளன. ‘உருவச்சிலை’ என்பது வழிபாட்டுக்குரிய εἰκών-ஐத் தெளிவுபடுத்துகிறது; ‘விக்கிரகம்’ போன்ற சமயமரபுச் சுமையுள்ள சொல்லைத் தவிர்க்கிறது.
