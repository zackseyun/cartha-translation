id: REV.16.13
reference: Revelation 16:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἶδον ἐκ τοῦ στόματος τοῦ δράκοντος καὶ ἐκ τοῦ στόματος τοῦ θηρίου καὶ ἐκ τοῦ στόματος τοῦ ψευδοπροφήτου πνεύματα ⸂τρία ἀκάθαρτα⸃ ὡς βάτραχοι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/013.yaml
  text: And I saw three unclean spirits like frogs coming out of the mouth of the dragon[a], out of the mouth of the beast, and out of the mouth of the false prophet.
translation:
  language: ta
  text: நான் வலுசர்ப்பத்தின் வாயிலிருந்தும், மிருகத்தின் வாயிலிருந்தும், பொய்த் தீர்க்கதரிசியின் வாயிலிருந்தும் தவளைகளைப் போன்ற மூன்று அசுத்த ஆவிகள் வருவதை கண்டேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வலுசர்ப்பத்தின் வாயிலிருந்தும், மிருகத்தின் வாயிலிருந்தும், பொய்த் தீர்க்கதரிசியின் வாயிலிருந்தும் தவளைகளைப் போன்ற மூன்று அசுத்த ஆவிகளை நான் கண்டேன்.” கிரேக்கத்தில், மூலத்தைக் குறிக்கும் மீளும் சொற்றொடர்கள் “மூன்று அசுத்த ஆவிகள்” என்பதற்கு முன் வருகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: நான் கண்டேன்
  rationale: ὁράω என்பதன் இறந்தகாலக் காட்சி-அறிக்கை வடிவத்தை இயல்பான, நேரடியான தமிழில் தெரிவிக்கிறது.
- source_word: ἐκ ... τοῦ στόματος
  choice: வாயிலிருந்து ... வருவதை
  rationale: ἐκ குறிக்கும் மூலத்தையும் வெளியே வரும் இயக்கத்தையும் இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது; கிரேக்கத்தில் தனி இயக்கவினை இல்லாததால் அந்த அமைப்பு அடிக்குறிப்பில் சுட்டப்படுகிறது.
- source_word: δράκοντος
  choice: வலுசர்ப்பம்
  rationale: வெளிப்படுத்தலில் நிலைபெற்றுள்ள பேருருவமிக்க பாம்பு/dragon குறியீட்டைத் தமிழில் மரபாகவும் தெளிவாகவும் காக்கிறது.
- source_word: θηρίου
  choice: மிருகம்
  rationale: வெளிப்படுத்தலின் குறியீட்டு θηρίον உருவத்தை மென்மைப்படுத்தாமல் தக்கவைக்கிறது.
- source_word: ψευδοπροφήτου
  choice: பொய்த்தீர்க்கதரிசி
  rationale: பொய்யான தீர்க்கதரிசி என்ற பொருளையும், இங்கு காணப்படும் அடையாளப் பெயர்போன்ற தன்மையையும் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: πνεύματα
  choice: ஆவிகள்
  rationale: இங்கு காற்று அல்லது மனப்பாங்கு அல்லாமல் ஆவிக்குரிய உயிர்களைக் குறிக்கும் பன்மையைத் தெரிவிக்கிறது.
- source_word: τρία ἀκάθαρτα
  choice: மூன்று அசுத்த ஆவிகள்
  rationale: ἀκάθαρτα என்பதிலுள்ள சமய, ஒழுக்க, ஆவிக்குரிய அசுத்தத்தின் நிழற்பொருளை ‘அசுத்த’ காக்கிறது.
- source_word: ὡς βάτραχοι
  choice: தவளைகளைப் போன்ற
  rationale: ὡς அடையாளப்படுத்தலை அல்ல, ஒப்புமையைக் குறிக்கிறது; தமிழில் இயல்பான உவமை அமைப்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: πνεύματα ἀκάθαρτα என்ற வெளிப்படுத்தல்-காட்சி உருவகத்தின் இயல்பு
  choice: ‘தவளைகளைப் போன்ற மூன்று அசுத்த ஆவிகள்’ என்று மட்டும் மொழிபெயர்த்தல்
  alternative: ‘தவளைகளைப் போன்ற மூன்று பேய் ஆவிகள்’
  rationale: அடுத்த வசனம் அவற்றின் பேய்த்தன்மையை விளக்கினாலும், இவ்வசனத்தின் கிரேக்கம் ‘அசுத்த ஆவிகள்’ என்றே கூறுகிறது. ஆகவே அடுத்த வசனத்தின் விளக்கத்தை முன்கூட்டியே இங்கு சேர்க்காமல் காட்சியின் இறையியல் அழுத்தம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரமான தமிழ்; கண்ணியமான வேதாகம நடை. கிரேக்கச் சொல் வரிசை அடிக்குறிப்பில் பாதுகாக்கப்பட்டு, முதன்மை உரையில் இயல்பான தமிழ் வாக்கிய அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
