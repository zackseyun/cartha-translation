source:
  edition: SBLGNT
  text: καὶ εἶδον ἄλλον ἄγγελον ἀναβαίνοντα ἀπὸ ἀνατολῆς ἡλίου, ἔχοντα σφραγῖδα θεοῦ ζῶντος, καὶ ἔκραξεν φωνῇ μεγάλῃ τοῖς τέσσαρσιν ἀγγέλοις οἷς ἐδόθη αὐτοῖς ἀδικῆσαι τὴν γῆν καὶ τὴν θάλασσαν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/002.yaml
  text: And I saw another angel coming up from the east[a], having the seal of the living God, and he cried out with a loud voice to the four angels to whom it had been given to harm the earth and the sea,
translation:
  language: ta
  text: மேலும், சூரியன் உதிக்கும் திசையிலிருந்து[a] மேலே வந்துகொண்டிருந்த வேறொரு தூதனை நான் பார்த்தேன். அவர் உயிருள்ள கடவுளின் முத்திரையை வைத்திருந்தார். நிலத்திற்கும் கடலுக்கும் தீங்கு செய்ய அனுமதி அளிக்கப்பட்டிருந்த அந்த நான்கு தூதர்களிடம் அவர் உரத்த குரலில் கூவி,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, கிழக்கிலிருந்து.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλον ἄγγελον
  choice: வேறொரு தூதனை
  rationale: ἄλλον என்பது முன்பு குறிப்பிடப்பட்ட நான்கு தூதர்களிலிருந்து வேறான, கூடுதலான ஒரு தூதரைக் குறிக்கிறது; ‘வேறொரு தூதன்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: ἀναβαίνοντα
  choice: மேலே வந்துகொண்டிருந்த
  rationale: இந்த நிகழ்காலப் பங்கேற்புவினை மேல்நோக்கிய இயக்கத்தையும் காட்சியின் தொடர்நிலையையும் குறிக்கிறது.
- source_word: ἀπὸ ἀνατολῆς ἡλίου
  choice: சூரியன் உதிக்கும் திசையிலிருந்து
  rationale: இது ‘கிழக்கிலிருந்து’ என்ற திசைப்பொருளைக் கொண்டிருந்தாலும், மூலத்தின் சூரிய உதயப் படிமத்தைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἔχοντα σφραγῖδα
  choice: முத்திரையை வைத்திருந்தார்
  rationale: ἔχω என்பதன் பொதுவான ‘வைத்திருத்தல்/கொண்டிருத்தல்’ பொருளையும் σφραγίς என்பதன் திடமான முத்திரைப் படிமத்தையும் காக்கிறது.
- source_word: θεοῦ ζῶντος
  choice: உயிருள்ள கடவுளின்
  rationale: மூலத்தின் வழக்கமான வேதாகமப் பெயரடைத் தொடரைச் சுருக்கமாகவும் இறையியல் வலிமையுடனும் தருகிறது.
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: உரத்த குரலில் அழைத்து
  rationale: κράζω-வின் வலிமையான குரலெழுப்புதலையும் φωνῇ μεγάλῃ-யின் உரத்த தன்மையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; வசனம் அடுத்த வசனத்துக்குள் தொடர்வதால் ‘அழைத்து’ பொருத்தமானது.
- source_word: τοῖς τέσσαρσιν ἀγγέλοις
  choice: அந்த நான்கு தூதர்களையும்
  rationale: முந்தைய வசனத்தில் அறிமுகமான குறிப்பிட்ட நான்கு தூதர்களைச் சுட்டுவதால் கிரேக்க உருபின் குறிப்புத்தன்மையை ‘அந்த’ வெளிப்படுத்துகிறது.
- source_word: οἷς ἐδόθη αὐτοῖς
  choice: அனுமதி அளிக்கப்பட்டிருந்த
  rationale: செயப்பாட்டு வடிவம் அதிகாரம் அல்லது அனுமதி வழங்கப்பட்டதைக் குறிக்கிறது; மூலத்தில் இல்லாத ‘வல்லமை’ என்பதைக் கூட்டாமல் தமிழில் முழுமையான பொருளைத் தருகிறது.
- source_word: ἀδικῆσαι
  choice: தீங்கு செய்ய
  rationale: இந்த வெளிப்படுத்தல் காட்சியில் படைப்புலகிற்குச் சேதம் விளைவிப்பதே சூழல்பொருள்; ‘தீங்கு செய்ய’ என்பது தெளிவானதும் பரந்ததுமான மொழிபெயர்ப்பு.
- source_word: τὴν γῆν καὶ τὴν θάλασσαν
  choice: நிலத்திற்கும் கடலுக்கும்
  rationale: γῆ இங்கு கடலுடன் இணையாக வரும் படைப்புலகின் நிலப்பகுதியைக் குறிக்கிறது; ‘நிலம்’ தமிழில் இந்த இணையைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: ἐδόθη என்பதில் வழங்கப்பட்ட அதிகாரம் அல்லது அனுமதி
  choice: ‘அனுமதி அளிக்கப்பட்டிருந்த’ என்று மொழிபெயர்க்கப்பட்டது
  alternative: ‘வல்லமை கொடுக்கப்பட்டிருந்த’
  rationale: மூலம் வழங்கியவர் யார் என்பதையோ ‘வல்லமை’ என்ற மறைந்த பெயர்ச்சொல்லையோ வெளிப்படையாகச் சொல்லவில்லை. ‘அனுமதி அளிக்கப்பட்டிருந்த’ என்பது தெய்வீகக் கட்டுப்பாட்டின் சாத்தியத்தை மறுக்காமல், மூலத்தின் செயப்பாட்டு அமைப்பையும் குறிப்பிடப்படாத வழங்குபவரையும் காக்கிறது.
- issue: ἀπὸ ἀνατολῆς ἡλίου என்ற திசை மற்றும் படிமம்
  choice: ‘சூரியன் உதிக்கும் திசையிலிருந்து’ என்று முதன்மை உரையில் மொழிபெயர்க்கப்பட்டது
  alternative: ‘கிழக்கிலிருந்து’
  rationale: திசைப்பொருள் தெளிவாக இருக்கும்போதே மூலத்தின் ‘சூரிய உதயம்’ என்ற இலக்கியப் படிமத்தையும் இயல்பான தமிழில் பாதுகாக்கிறது; அடிக்குறிப்பு சுருக்கமான மாற்றைத் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடையைப் பயன்படுத்துகிறது. நீண்ட கிரேக்க வாக்கியத்தை வாசிப்பிற்கு ஏற்ற மூன்று தமிழ் வாக்கியங்களாகப் பிரித்தாலும், இறுதியிலுள்ள காற்புள்ளியும் ‘அழைத்து’ என்ற வினையெச்சமும் 7:3-க்கு தொடரும் வாக்கிய அமைப்பைப் பாதுகாக்கின்றன.
