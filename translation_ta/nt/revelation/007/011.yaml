id: REV.7.11
reference: Revelation 7:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ πάντες οἱ ἄγγελοι εἱστήκεισαν κύκλῳ τοῦ θρόνου καὶ τῶν πρεσβυτέρων καὶ τῶν τεσσάρων ζῴων, καὶ ἔπεσαν ἐνώπιον τοῦ θρόνου ἐπὶ τὰ πρόσωπα αὐτῶν καὶ προσεκύνησαν τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/011.yaml
  text: And all the angels were standing around the throne and the elders and the four living creatures[a], and they fell before the throne on their faces and worshiped God,
translation:
  language: ta
  text: எல்லா வானதூதர்களும் அரியணையையும் மூப்பர்களையும் நான்கு உயிரினங்களையும்[a] சுற்றி நின்றுகொண்டிருந்தார்கள். அவர்கள் அரியணைக்கு முன்பாகத் தங்கள் முகங்களின்மேல் விழுந்து கடவுளை வழிபட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான்கு உயிருள்ள படைப்புகள்.”
    reason: ζῷα என்பதற்கான பொருத்தமான மாற்றுச் சொல்லாக்கத்தைப் பதிவு செய்கிறது.
lexical_decisions:
- source_word: πάντες οἱ ἄγγελοι
  choice: எல்லா வானதூதர்களும்
  rationale: πάντες என்பதன் முழுமையையும் ἄγγελοι என்பதன் சூழலுக்கேற்ற பொருளையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: εἱστήκεισαν
  choice: நின்றுகொண்டிருந்தார்கள்
  rationale: இவ்வடிவம் வெறுமனே நின்ற நிகழ்வை அல்ல, அப்போது தொடர்ந்திருந்த நிற்கும் நிலையைக் குறிக்கிறது.
- source_word: κύκλῳ
  choice: சுற்றி
  rationale: அரியணை, மூப்பர்கள், நான்கு உயிரினங்கள் ஆகியவற்றைச் சூழ்ந்திருந்த இடநிலையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τοῦ θρόνου
  choice: அரியணை
  rationale: வெளிப்படுத்தலில் உள்ள அரசாட்சியையும் விண்ணுலக மாட்சியையும் காக்கும் வழக்கமான தமிழ்ச் சொல்.
- source_word: τῶν πρεσβυτέρων
  choice: மூப்பர்கள்
  rationale: வெளிப்படுத்தலில் அடையாளம் காணப்படும் இந்தக் குழுவைக் குறிக்க நிலைபெற்ற, சூழலுக்கேற்ற சொல்.
- source_word: τῶν τεσσάρων ζῴων
  choice: நான்கு உயிரினங்கள்[a]
  rationale: இவர்களை விலங்குகள் என்று குறுக்காமல், உயிருள்ள அரியணைச் சூழ் படைப்புகளாகக் காட்டும் மூலச்சொல்லின் பரப்பை காக்கிறது.
- source_word: ἔπεσαν
  choice: விழுந்து
  rationale: அடுத்து வரும் முகங்குப்புற என்ற சொல்லுடன் சேர்ந்து பணிந்து விழும் செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐνώπιον τοῦ θρόνου
  choice: அரியணைக்கு முன்பாக
  rationale: இங்கு ἐνώπιον குறிக்கும் இடநிலையை இயல்பான, மரியாதையான தமிழில் தருகிறது.
- source_word: ἐπὶ τὰ πρόσωπα αὐτῶν
  choice: முகங்குப்புற
  rationale: முழுமையாகப் பணிந்து முகம் கீழ்நோக்கி விழுந்த உடல்நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: προσεκύνησαν
  choice: வழிபட்டார்கள்
  rationale: உடலால் பணிந்த செயல் ஏற்கெனவே கூறப்பட்டிருப்பதாலும் இதன் நேரடி இலக்கு கடவுள் என்பதாலும், இங்கு வழிபாடு என்ற முழுப் பொருள் பொருத்தமானது.
- source_word: τῷ θεῷ
  choice: கடவுளை
  rationale: προσκυνέω வினையின் நேரடி இலக்கைத் தெளிவாகவும் பொதுவான நவீனத் தமிழிலும் தருகிறது.
theological_decisions:
- issue: ζῷα எனப்படும் அரியணைச் சூழ் உயிர்களின் பெயர்ப்பு
  choice: உயிரினங்கள்
  alternative: உயிருள்ள படைப்புகள்
  rationale: அவற்றை வெறும் விலங்குகள் எனக் குறுக்காமலும் அவற்றின் அடையாளத்தை விளக்கவுரை மூலம் நிர்ணயிக்காமலும் வெளிப்படுத்தலின் தரிசனப் படிமத்தைப் பாதுகாக்கிறது.
- issue: கடவுளை இலக்காகக் கொண்ட προσκυνέω என்பதன் வலிமை
  choice: கடவுளை வழிபட்டார்கள்
  alternative: கடவுளுக்கு முன்பாகப் பணிந்தார்கள்
  rationale: முந்தைய சொற்றொடர் உடலால் முகங்குப்புற விழுந்ததை ஏற்கெனவே கூறுகிறது; ஆகவே இங்கு வினையின் வழிபாட்டு பொருளை வெளிப்படையாகத் தருவது மறுபடியும் அதே உடல் செயலை மட்டும் கூறுவதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு அணுக்கமான, பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய மரியாதைமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. ‘நின்றுகொண்டிருந்தார்கள்’ நிலைத்திருந்த உடல்நிலையையும், ‘முகங்குப்புற’ முழுப் பணிவையும் இயல்பாக வெளிப்படுத்துகின்றன.
