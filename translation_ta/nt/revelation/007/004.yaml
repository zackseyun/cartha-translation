id: REV.7.4
reference: Revelation 7:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα τὸν ἀριθμὸν τῶν ἐσφραγισμένων, ⸀ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες, ⸀ἐσφραγισμένοι ἐκ πάσης φυλῆς υἱῶν Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/004.yaml
  text: 'And I heard the number of those who had been sealed: one hundred forty-four thousand[a], sealed from every tribe of the sons of Israel.'
translation:
  language: ta
  text: 'முத்திரையிடப்பட்டவர்களின் எண்ணிக்கையை நான் கேட்டேன்: ஒரு இலட்சத்து நாற்பத்து நான்காயிரம் பேர்—இஸ்ரவேலின் மகன்களின்[a] ஒவ்வொரு கோத்திரத்திலிருந்தும் முத்திரையிடப்பட்டவர்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலின் பிள்ளைகளின்.” கிரேக்க மூலத்தில் “இஸ்ரவேலின் மகன்கள்” என்று உள்ளது; இது ஆண்பால் மரபுவழிச் சொல்லாட்சியைக் காக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσα
  choice: நான் கேட்டேன்
  rationale: ἀκούω என்பதன் இறந்தகாலக் குறிப்பை இயல்பான தமிழ் நிகழ்வுரை நடையில் நேரடியாகத் தருகிறது.
- source_word: ἀριθμὸν
  choice: எண்ணிக்கையை
  rationale: எண்ணப்பட்ட குழுவின் மொத்தத் தொகையைக் குறிக்கும் ἀριθμός என்பதற்கான இயல்பான தமிழ் இணை.
- source_word: τῶν ἐσφραγισμένων / ἐσφραγισμένοι
  choice: முத்திரையிடப்பட்டவர்களின் / முத்திரையிடப்பட்டவர்கள்
  rationale: σφραγίζω என்பதன் செயப்பாட்டு வடிவத்தையும், நிறைவேறிய செயலில் விளைந்துள்ள நிலையையும் தமிழின் பெயரெச்ச அமைப்பு இயல்பாக வெளிப்படுத்துகிறது; மூலத்தில் வரும் மறுபயன்பாடும் காக்கப்படுகிறது.
- source_word: ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: ஒரு இலட்சத்து நாற்பத்து நான்காயிரம் பேர்
  rationale: 144,000 என்ற எண்ணை நவீனத் தமிழில் வழக்கமான முறையில் கூறுகிறது; மனிதர்களின் எண்ணிக்கை என்பதால் ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἐκ
  choice: இலிருந்தும்
  rationale: தோற்றுவாய் அல்லது எடுக்கப்படும் குழுவைக் குறிக்கும் ἐκ என்பதையும், ஒவ்வொரு கோத்திரத்திலிருந்தும் வருவதைச் சுட்டும் பகிர்வுப் பொருளையும் தருகிறது.
- source_word: πάσης φυλῆς
  choice: ஒவ்வொரு கோத்திரத்திலிருந்தும்
  rationale: ἐκ உடன் வரும் πᾶς + ஒருமை அமைப்பின் பகிர்வுப் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: υἱῶν Ἰσραήλ
  choice: இஸ்ரவேலின் மகன்களுடைய
  rationale: υἱῶν என்ற ஆண்பால் மரபுவழிச் சொல்லையும் கோத்திர வம்சப் பின்னணியையும் காக்கிறது; தமிழில் இயல்பான உடைமைத் தொடர்பாக அமைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: கோத்திரப் பட்டியல் சூழலில் υἱῶν Ἰσραήλ என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலின் பிள்ளைகள்
  rationale: கிரேக்க மூலம் ஆண்பால் υἱοί என்ற சொல்லைப் பயன்படுத்துவதால் மரபுவழி மொழிநடையை முதன்மை உரை காக்கிறது. அதேவேளை, ‘பிள்ளைகள்’ என்பது தமிழில் நிலைபெற்ற வேதாகம வழக்கும் சாத்தியமான மாற்றுமொழிபெயர்ப்பும் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது; எந்தக் குறிப்பிட்ட இறுதிக்காலக் கோட்பாடும் உரைக்குள் புகுத்தப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் எண்ணிக்கை-முதல் அமைப்பும் ‘முத்திரையிடப்பட்ட’ என்ற சொல்லின் மறுபயன்பாடும் அரைப்புள்ளி வழியாகக் காக்கப்பட்டுள்ளன.
