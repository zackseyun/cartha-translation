  to: 'முத்திரையிடப்பட்டவர்களின் எண்ணிக்கையை நான் கேட்டேன்: ஒரு இலட்சத்து நாற்பத்து நான்காயிரம் பேர்—இஸ்ரவேலின் மகன்களின்[a] ஒவ்வொரு கோத்திரத்திலிருந்தும் முத்திரையிடப்பட்டவர்கள்.'
