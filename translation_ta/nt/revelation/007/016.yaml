id: REV.7.16
reference: Revelation 7:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐ πεινάσουσιν ἔτι ⸀οὐδὲ διψήσουσιν ἔτι, οὐδὲ μὴ πέσῃ ἐπ’ αὐτοὺς ὁ ἥλιος οὐδὲ πᾶν καῦμα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/016.yaml
  text: They will hunger no more[a], nor thirst anymore; the sun will not strike them, nor any scorching heat.
translation:
  language: ta
  text: அவர்கள் இனிப் பசியடையவும் தாகமடையவும் மாட்டார்கள்; சூரியனோ, கொளுத்தும் எந்த வெப்பமோ அவர்கள்மேல் ஒருபோதும் படாது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்களைத் தாக்கவே தாக்காது’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் οὐδὲ μὴ πέσῃ என்ற வலியுறுத்தப்பட்ட மறுப்பு அமைப்பு உள்ளது.
    reason: மூலத்தின் ‘படுதல்/விழுதல்’ படிமத்தை முதன்மை உரையில் காத்துக்கொண்டு, சூழல்சார் ‘தாக்குதல்’ என்ற மாற்று மொழிபெயர்ப்பையும் வலியுறுத்தப்பட்ட மறுப்பையும் விளக்குகிறது.
lexical_decisions:
- source_word: πεινάσουσιν
  choice: பசியடையவும் மாட்டார்கள்
  rationale: எதிர்கால வினைச்சொல்லின் பொருளை நேரடியாகத் தக்கவைத்து, தொடர்ந்து வரும் ‘தாகமடையவும் மாட்டார்கள்’ என்பதோடு இணையான அமைப்பை உருவாக்குகிறது.
- source_word: ἔτι
  choice: இனி
  rationale: மறுப்புடன் வரும் இச்சொல், இந்நிலைகள் இனிமேல் தொடராது என்ற முடிவான நிறுத்தத்தைக் குறிக்கிறது.
- source_word: διψήσουσιν
  choice: தாகமடையவும் மாட்டார்கள்
  rationale: மூலத்தின் எதிர்கால வினை வடிவையும் பசி–தாகம் இணைநிலையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: οὐδὲ μὴ πέσῃ ἐπ’ αὐτούς
  choice: அவர்களைத் தாக்கவே தாக்காது
  rationale: οὐ μή அமைப்பின் வலியுறுத்தப்பட்ட எதிர்கால மறுப்பை ‘தாக்கவே தாக்காது’ எனத் தெளிவாக வெளிப்படுத்துகிறது; πέσῃ ἐπ’ αὐτούς என்பதன் சூழல்சார் தாக்கத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: ὁ ἥλιος
  choice: சூரியன்
  rationale: மூலச்சொல்லின் நேரடியான பொருளைத் தக்கவைக்கிறது.
- source_word: πᾶν καῦμα
  choice: கொளுத்தும் எந்த வெப்பமும்
  rationale: καῦμα குறிக்கும் எரிக்கும் அல்லது கொளுத்தும் வெப்பத்தையும், மறுப்பு வாக்கியத்தில் πᾶν கொண்டுள்ள ‘எந்த ஒன்றும் இல்லை’ என்ற முழுமையையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ஏசாயா 49:10-ஐ நினைவூட்டும் இறுதிக்கால மீட்பு மொழி
  choice: பசி, தாகம், சூரியன், கொளுத்தும் வெப்பம் ஆகிய உருவகப் படிமங்களை அவற்றின் தெளிவான, உணரக்கூடிய வடிவிலேயே வைத்தல்
  alternative: பசி மற்றும் தாகத்தை ஆன்மீக ஏக்கத்திற்கு மட்டும் உரிய உருவகங்களாக மொழிபெயர்த்தல்
  rationale: வெளிப்படுத்தின விசேஷத்தின் உடனடிச் சூழல் துன்பத்திற்குப் பிந்தைய ஆறுதலைக் கூறுகிறது; மொழி ஏசாயாவின் மீட்பு வாக்குறுதியையும் எதிரொலிக்கிறது. குறிப்பிட்ட ஒரு ஆன்மீக விளக்கத்தை மொழிபெயர்ப்பில் திணிக்காமல், மூலப் படிமங்களையும் அவற்றின் இறையியல் ஒலிப்பையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகமப் பாங்கும் குன்றாமல் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பசியடையவும்… தாகமடையவும்’ என்ற இணை அமைப்பு மூலத்தின் சமச்சீரைக் காக்கிறது; ‘தாக்கவே தாக்காது’ என்பது emphatic negation-ஐ இயல்பான தமிழில் வலியுறுத்துகிறது.
