id: REV.7.8
reference: Revelation 7:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐκ φυλῆς Ζαβουλὼν δώδεκα χιλιάδες, ἐκ φυλῆς Ἰωσὴφ δώδεκα χιλιάδες, ἐκ φυλῆς Βενιαμὶν δώδεκα χιλιάδες ⸀ἐσφραγισμένοι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/008.yaml
  text: from the tribe of Zebulun[a], twelve thousand; from the tribe of Joseph, twelve thousand; from the tribe of Benjamin, twelve thousand, having been sealed.
translation:
  language: ta
  text: செபுலோன் கோத்திரத்திலிருந்து பன்னிரண்டாயிரம் பேர்; யோசேப்பு கோத்திரத்திலிருந்து பன்னிரண்டாயிரம் பேர்; பென்யமீன் கோத்திரத்திலிருந்து பன்னிரண்டாயிரம் பேர்—முத்திரையிடப்பட்டவர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முத்திரையிடப்பட்டிருந்தார்கள்.” கிரேக்கத்தில் பட்டியலின் இறுதியில் வரும் வினையெச்சம், பட்டியலிடப்பட்ட எல்லாக் குழுக்களையும் தொகுத்துக் குறிப்பிடுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ φυλῆς
  choice: கோத்திரத்திலிருந்து
  rationale: ἐκ என்பது தோற்றம் அல்லது மூலத்தைச் சுட்டுகிறது; φυλή இஸ்ரவேலின் கோத்திரப் பிரிவைக் குறிக்கிறது. மீண்டும் மீண்டும் வரும் கிரேக்கப் பட்டியல் அமைப்பை இந்தத் தொடர் இயல்பான தமிழில் காக்கிறது.
- source_word: Ζαβουλών
  choice: செபுலோன்
  rationale: வேதாகமத் தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவத்தைப் பயன்படுத்தி, மூலப் பெயரை ஒலிபெயர்க்கிறது.
- source_word: δώδεκα χιλιάδες
  choice: பன்னிரண்டாயிரம் பேர்
  rationale: எண்ணிக்கையை நேரடியாகக் காக்கிறது; எண்ணப்படுபவர்கள் மனிதர்கள் என்பதால் இயல்பான தமிழுக்காக ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: Ἰωσήφ
  choice: யோசேப்பு
  rationale: மூல உரை எப்பிராயீம் அல்லது மனாசே என்று அல்லாமல் யோசேப்பு என்றே கூறுவதால் அதையே மாற்றமின்றி ஒலிபெயர்க்கிறது.
- source_word: Βενιαμίν
  choice: பென்யமீன்
  rationale: நவீனத் தமிழில் அறியப்பட்ட வேதாகமப் பெயர்வடிவத்தைக் கொண்டு மூலப் பெயரை ஒலிபெயர்க்கிறது.
- source_word: ἐσφραγισμένοι
  choice: முத்திரையிடப்பட்டிருந்தார்கள்
  rationale: இது நிறைவேற்றப்பட்ட செயலும் அதன் தொடரும் விளைவும் கொண்ட perfect passive participle. ‘முத்திரையிடப்பட்டிருந்தார்கள்’ என்பது செயப்பாட்டு நிலையையும் விளைவுநிலையையும் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இறுதியில் வரும் ἐσφραγισμένοι என்பதன் தொடர்பும் வலிமையும்
  choice: மூன்று கோத்திரக் குழுக்களையும் தொகுத்துச் சுட்டும் இறுதி கூற்றாக ‘இவர்கள் முத்திரையிடப்பட்டிருந்தார்கள்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘முத்திரையிடப்பட்டவர்கள்’ என்று வினையாலணையும் பெயரால் சுருக்கமாக மொழிபெயர்க்கலாம்.
  rationale: கிரேக்க வினையெச்சம் பட்டியலின் இறுதியில் வந்து, பட்டியலிடப்பட்டவர்களை ஒட்டுமொத்தமாக விவரிக்கிறது. ‘இவர்கள்’ என்பது தமிழில் அதன் பரந்த தொடர்பைத் தெளிவாக்குகிறது; முத்திரையின் தன்மை அல்லது இறையியல் பொருள் குறித்து உரையில் இல்லாத விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் சாதாரண வாசகர்களுக்குப் புரியும் பட்டியல் நடையைப் பயன்படுத்துகிறது. அரைப்புள்ளிகள் மூலத்தின் மீளுருவ அமைப்பைக் காட்டுகின்றன; இறுதி நீள்கோடு, கடைசி வினையெச்சம் முழுப் பட்டியலையும் சுருக்குவதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
