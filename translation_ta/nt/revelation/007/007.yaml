  source_fidelity: மூலக் கிரேக்கத்தின் மும்முறை மீளும் பட்டியல் அமைப்பும் ἐκ φυλῆς ... δώδεκα χιλιάδες என்ற பொருளும் துல்லியமாகக் காக்கப்பட்டுள்ளன. ‘பேர்’ என்பது கிரேக்கத்தில் வெளிப்படையாக இல்லாவிட்டாலும், உடனடி சூழலில் முத்திரையிடப்பட்ட மனிதர்களின் எண்ணிக்கையைக் குறிக்கும் இயல்பான தமிழ்ச் சேர்க்கையாகும்; பொருளை மாற்றவில்லை.
  naturalness: ‘சிமியோன் கோத்திரத்திலிருந்து பன்னிரண்டாயிரம் பேர்’ என்ற தொடர் நவீனத் தரத் தமிழில் தெளிவாகவும் பட்டியல் நடைக்கு ஏற்றதாகவும் உள்ளது. அரைப்புள்ளிகள் மூன்று இணையான உறுப்புகளின் முறையான கணக்கீட்டு ஓசையை நன்றாகக் காட்டுகின்றன.
  terminology: ‘கோத்திரம்’ இஸ்ரவேலின் φυλή என்னும் பழங்குடி/வம்சப் பிரிவுக்கு நிலைபெற்ற, துல்லியமான தமிழ் வேதாகமச் சொல்லாகும். சிமியோன், லேவி, இசக்கார் ஆகிய பெயர்வடிவங்களும் மரபான தமிழ்ப் பயன்பாட்டுடன் ஒத்துள்ளன. ஆங்கில அடிக்குறிப்பு வெறும் ‘from/out of’ என்ற ஆங்கில நடையியல் மாற்றைக் குறிக்கிறது; தமிழில் தனி அடிக்குறிப்பு தேவையில்லை.
