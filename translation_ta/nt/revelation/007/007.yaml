id: REV.7.7
reference: Revelation 7:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐκ φυλῆς Συμεὼν δώδεκα χιλιάδες, ἐκ φυλῆς Λευὶ δώδεκα χιλιάδες, ἐκ φυλῆς Ἰσσαχὰρ δώδεκα χιλιάδες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/007.yaml
  text: from the tribe of Simeon[a], twelve thousand; from the tribe of Levi, twelve thousand; from the tribe of Issachar, twelve thousand.
translation:
  language: ta
  text: சிமியோன் கோத்திரத்திலிருந்து பன்னிரண்டாயிரம் பேர்; லேவி கோத்திரத்திலிருந்து பன்னிரண்டாயிரம் பேர்; இசக்கார் கோத்திரத்திலிருந்து பன்னிரண்டாயிரம் பேர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ
  choice: -இலிருந்து
  rationale: மூலம் அல்லது தோற்றத்தைக் குறிக்கும் ἐκ என்பதற்கு இயல்பான தமிழ் இணை; பட்டியலின் திரும்பத் திரும்ப வரும் அமைப்பையும் காக்கிறது.
- source_word: φυλῆς
  choice: கோத்திரம்
  rationale: இஸ்ரவேலின் வம்சவழித் tribal division-ஐக் குறிக்கும் இச்சூழலில், தமிழ் வேதாகம மொழிநடையிலும் பொதுப் பயன்பாட்டிலும் துல்லியமாகப் புரியும் சொல்.
- source_word: Συμεὼν
  choice: சிமியோன்
  rationale: தமிழில் பரவலாக அறியப்பட்ட மரபான பெயர்வடிவம்.
- source_word: δώδεκα χιλιάδες
  choice: பன்னிரண்டாயிரம் பேர்
  rationale: எண்ணிக்கையைச் சொற்களில் வழங்குகிறது; கிரேக்கத்தில் வெளிப்படையாக இல்லாத மனிதர் எண்ணிக்கையைத் தமிழில் இயல்பாக உணர்த்த ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: Λευὶ
  choice: லேவி
  rationale: தமிழில் நிலைபெற்ற பெயர்வடிவம்; பட்டியலில் லேவி இடம்பெறுவதை விளக்கவுரையின்றி அப்படியே காக்கிறது.
- source_word: Ἰσσαχὰρ
  choice: இசக்கார்
  rationale: தமிழில் பரவலாக அறியப்பட்ட மரபான பெயர்வடிவம்.
theological_decisions:
- issue: கோத்திரப் பட்டியலின் திரும்ப வரும் வாக்கிய அமைப்பு
  choice: ஒவ்வொரு கோத்திரத்திற்கும் ‘கோத்திரத்திலிருந்து பன்னிரண்டாயிரம் பேர்’ என்ற அமைப்பைத் திரும்ப வழங்குதல்
  alternative: ‘சிமியோன், லேவி, இசக்கார் கோத்திரங்களிலிருந்து தலா பன்னிரண்டாயிரம் பேர்’ என்று சுருக்குதல்
  rationale: கிரேக்க மூலத்தின் மும்முறைத் திரும்பும் ஓசையையும் வெளிப்படுத்தல் நூலுக்குரிய முறையான கணக்கீட்டு நடையையும் காக்கிறது.
- issue: கோத்திரப் பட்டியலில் லேவி இடம்பெறுதல்
  choice: முதன்மை உரையில் விளக்கம் சேர்க்காமல் லேவியை நேரடியாக மொழிபெயர்த்தல்
  alternative: லேவியின் வழக்கத்திற்கு மாறான இடம்பெறுதலை விளக்கும் சொற்களைச் சேர்த்தல்
  rationale: மூலவசனம் லேவியை வெறுமனே பட்டியலிடுகிறது; கூடுதல் விளக்கம் உரைக்கு அப்பாற்பட்ட பொருளை இறக்குமதி செய்யும்.
- issue: முத்திரையிடப்பட்ட மனிதர்களைக் குறிக்கும் மறைமுக எண்ணிக்கை
  choice: தமிழின் இயல்புக்காக எண்ணிக்கைக்குப் பின் ‘பேர்’ சேர்த்தல்
  alternative: ‘பன்னிரண்டாயிரம்’ என்று மட்டும் வழங்குதல்
  rationale: முந்தைய சூழலில் எண்ணப்படுவது மனிதர்கள் என்பது தெளிவு; ‘பேர்’ தமிழில் இயல்பையும் தெளிவையும் தருகிறது, ஆனால் எண்ணிக்கையின் பொருளை மாற்றுவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட பட்டியல் நடை. ‘கோத்திரம்’ மற்றும் மரபான பெயர்வடிவங்கள் பொதுவான தமிழ் வேதாகமப் பயன்பாட்டோடு ஒத்துப்போகின்றன. கிரேக்கத்தின் மறுமொழி அமைப்பு சுருக்கப்படாமல் காக்கப்பட்டுள்ளது.
