id: REV.7.12
reference: Revelation 7:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγοντες· Ἀμήν· ἡ εὐλογία καὶ ἡ δόξα καὶ ἡ σοφία καὶ ἡ εὐχαριστία καὶ ἡ τιμὴ καὶ ἡ δύναμις καὶ ἡ ἰσχὺς τῷ θεῷ ἡμῶν εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/012.yaml
  text: saying[a], “Amen! The blessing and the glory and the wisdom and the thanksgiving and the honor and the power and the might be to our God forever and ever. Amen.”
translation:
  language: ta
  text: 'அவர்கள் கூறினார்கள்: “ஆமென்! ஆசீர்வாதமும் மகிமையும் ஞானமும் நன்றி செலுத்துதலும் மரியாதையும் வல்லமையும் பலமும் நம் கடவுளுக்கு என்றென்றும் உரியனவாகட்டும்[a]. ஆமென்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “யுகங்களின் யுகங்கள்வரை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: அவர்கள் சொன்னார்கள்
  rationale: இது பன்மை நிகழ்கால வினையெச்சமாக இருந்து, துதிமொழியை அறிமுகப்படுத்துகிறது. தமிழில் தனித்து வாசிக்கும்போது இயல்பாகவும் தெளிவாகவும் அமைய, அதன் தொடர்ச்சிப் பொருள் இறந்தகால வினைமுற்றாக வெளிப்படுத்தப்பட்டது; ‘உரத்த குரலில்’ என்ற பொருள் மூலத்தில் இல்லாததால் சேர்க்கப்படவில்லை.
- source_word: Ἀμήν / ἀμήν
  choice: ஆமென்
  rationale: வழிபாட்டு மற்றும் துதிமொழிச் சூழலில் வழக்கமான ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது. இருமுறை வருவது துதிமொழிக்கு ஒரு சட்டகம்போல் அமைவதால் இரண்டும் தக்கவைக்கப்பட்டன.
- source_word: ἡ εὐλογία
  choice: ஆசீர்வாதம்
  rationale: கடவுளை நோக்கி உரைக்கப்படும் ஏழு கூறுகளைக் கொண்ட துதிப்பட்டியலின் முதல் கூறு. சொல்லின் அடிப்படைப் பொருளையும் துதிமொழியின் வடிவத்தையும் காக்கிறது.
- source_word: ἡ δόξα
  choice: மகிமை
  rationale: துதிமொழிகளில் δόξα என்பதற்கான இயல்பான, நிலைபெற்ற தமிழ் இணைச்சொல்.
- source_word: ἡ σοφία
  choice: ஞானம்
  rationale: σοφία என்பதன் வழக்கமான பொருளை நேரடியாகக் காக்கிறது.
- source_word: ἡ εὐχαριστία
  choice: நன்றிசெலுத்துதல்
  rationale: வெறும் மனநிலையைக் காட்டும் ‘நன்றி’ என்பதைக் காட்டிலும், கடவுளை நோக்கி நன்றி செலுத்தும் வழிபாட்டுச் செயலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἡ τιμή
  choice: மரியாதை
  rationale: இங்கு பொருளாதார மதிப்பு அல்ல, கடவுளுக்குச் செலுத்தப்படும் கனம் அல்லது மரியாதை குறிக்கப்படுகிறது. ‘மரியாதை’ நவீனத் தமிழில் தெளிவாகப் புரிகிறது.
- source_word: ἡ δύναμις
  choice: வல்லமை
  rationale: செயலாற்றும் ஆற்றல் அல்லது அதிகாரமிக்க சக்தி என்ற பொருளை வெளிப்படுத்தி, அடுத்து வரும் ἰσχύς என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: ἡ ἰσχὺς
  choice: பலம்
  rationale: δύναμις உடன் பொருள் ஒட்டியிருந்தாலும் தனி துதிக்கூறாக வருவதால், ‘வல்லமை ... பலம்’ என இரு வேறு தமிழ் சொற்கள் பயன்படுத்தப்பட்டன.
- source_word: τῷ θεῷ ἡμῶν
  choice: நம் கடவுளுக்கு
  rationale: இது துதிக்கூறுகள் யாருக்கு உரியவை என்பதைச் சுட்டும் நான்காம் வேற்றுமை அமைப்பு. ‘நம் கடவுளுக்கு’ என்பது இயல்பான தமிழில் அதன் அர்ப்பணிப்பு அல்லது சார்புப்பொருளைக் காக்கிறது.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: என்றென்றும்
  rationale: முடிவில்லாத காலத்தைக் குறிக்கும் கிரேக்கச் சொற்றொடரின் இயல்பான தமிழ் இணை. அதன் சொற்சொல் வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: வினைச்சொல் இல்லாத துதிமொழியில் பொருத்தமான வினைப்பொருளை நிரப்புதல்
  choice: நம் கடவுளுக்கு ... உரியனவாகுக
  alternative: நம் கடவுளுக்குச் சொந்தமானவை
  rationale: கிரேக்கத்தில் பெயர்ச்சொற்களின் பட்டியலுக்குப் பின் வெளிப்படையான வினைச்சொல் இல்லை. ‘உரியனவாகுக’ என்பது இதை கடவுளுக்கு அர்ப்பணிக்கும் துதியாக வெளிப்படுத்துகிறது; ஏற்கெனவே அவரிடம் உள்ள பண்புகளைப் பற்றிய வெறும் உரிமைக் கூற்றாக மட்டும் மாற்றுவதில்லை.
- issue: δύναμις மற்றும் ἰσχύς ஆகிய நெருங்கிய பொருளுள்ள சொற்களை வேறுபடுத்துதல்
  choice: வல்லமை ... பலம்
  alternative: வல்லமை ... வலிமை
  rationale: மூலம் துதியில் நெருங்கிய பொருளுள்ள இரு சொற்களையும் திட்டமிட்டு அடுக்குகிறது. அவற்றை ஒரே தமிழ்ச் சொல்லில் சுருக்காமல், சொற்பொழிவு நிறைவைப் பாதுகாக்க இரண்டு தனித்த சொற்கள் பயன்படுத்தப்பட்டன.
translation_notes:
  register: நவீனத் தரமான, எளிதில் புரியும், அதே நேரத்தில் வழிபாட்டுக்குரிய கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ஏழு கூறுகளின் ஒத்திசைவைக் காக்க ஒவ்வொன்றும் ‘-மும்’ இணைப்புடன் அமைக்கப்பட்டுள்ளது. கிரேக்கத்தில் ஒவ்வொரு பெயர்ச்சொல்லுடனும் வரும் குறிப்புச்சுட்டின் வலியுறுத்தலை, தமிழில் இயற்கையற்ற மீளுருவாக்கமாக மாற்றாமல் பட்டியலின் ஓசை மற்றும் முழுமை வழியாக வெளிப்படுத்தப்பட்டுள்ளது.
