id: REV.7.17
reference: Revelation 7:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι τὸ ἀρνίον τὸ ἀνὰ μέσον τοῦ θρόνου ⸀ποιμανεῖ αὐτούς, καὶ ⸀ὁδηγήσει αὐτοὺς ἐπὶ ζωῆς πηγὰς ὑδάτων· καὶ ἐξαλείψει ὁ θεὸς πᾶν δάκρυον ἐκ τῶν ὀφθαλμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/017.yaml
  text: because the Lamb in the midst of the throne will shepherd them[a], and he will guide them to springs of the water of life[c][b], and God will wipe away every tear from their eyes.
translation:
  language: ta
  text: ஏனெனில், அரியணையின் நடுவில் இருக்கும் ஆட்டுக்குட்டியானவர்[a] அவர்களை மேய்ப்பார்; அவர்களை வாழ்வு தரும் நீரூற்றுகளிடம்[c] வழிநடத்துவார்[b]; கடவுள் அவர்களுடைய கண்களிலிருந்து ஒவ்வொரு கண்ணீர்த்துளியையும் துடைத்துவிடுவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அரியணையின் மையத்தில் இருக்கும்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘வழிகாட்டுவார்.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘வாழ்வின் நீர் ஊற்றுகளிடம்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρνίον
  choice: ஆட்டுக்குட்டியானவர்
  rationale: வெளிப்படுத்தலில் கிறிஸ்துவைக் குறிக்கும் நிலையான உருவகப் பட்டத்தைத் தக்கவைக்கிறது; மரியாதைப் பன்மை இந்த நபரைக் குறிக்கும் பயன்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀνὰ μέσον τοῦ θρόνου
  choice: அரியணையின் நடுவில்
  rationale: அரியணையுடன் தொடர்புடைய மைய இடத்தை நேரடியாகவும் காட்சித்தன்மையுடனும் வெளிப்படுத்துகிறது; ‘மையத்தில்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ποιμανεῖ
  choice: மேய்ப்பார்
  rationale: ποιμαίνω என்பதன் மேய்ப்பர் செயலை நேரடியாகத் தக்கவைத்து, ஆட்டுக்குட்டியே மேய்ப்பராக இருப்பதன் நோக்கமுள்ள முரண்பாட்டை மறைக்காமல் காட்டுகிறது.
- source_word: ὁδηγήσει
  choice: வழிநடத்துவார்
  rationale: வழிகாட்டி நடத்திச் செல்வதைக் குறிக்கிறது; முந்தைய ‘மேய்ப்பார்’ என்பதுடன் ஒன்றாக்காமல் தனித்த செயலைத் தக்கவைக்கிறது.
- source_word: ἐπὶ ζωῆς πηγὰς ὑδάτων
  choice: வாழ்வின் நீரூற்றுகளிடம்
  rationale: ζωῆς–ὑδάτων தொடர்பை ‘வாழ்வின் நீர்’ என்ற இயல்பான தமிழ்ச் சேர்க்கையில் வெளிப்படுத்தி, πηγάς என்பதைக் ‘நீரூற்றுகள்’ என்றும், இயக்கத்தைக் ‘-இடம்’ என்றும் தருகிறது.
- source_word: ἐξαλείψει
  choice: துடைத்துவிடுவார்
  rationale: ஆறுதலளிக்கும் இச்சூழலில் கண்ணீரை முற்றிலும் அகற்றும் செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: πᾶν δάκρυον
  choice: ஒவ்வொரு கண்ணீர்த்துளியையும்
  rationale: ஒருமை வடிவத்தோடு வரும் πᾶν என்பதின் முழுமையையும் தனித்தனியான கண்ணீர்த்துளி என்ற உயிரோட்டமான படிமத்தையும் காக்கிறது.
- source_word: ἐκ τῶν ὀφθαλμῶν αὐτῶν
  choice: அவர்களுடைய கண்களிலிருந்து
  rationale: ἐκ குறிக்கும் மூல இடத்தையும் கிரேக்கப் படிமத்தையும் இயல்பான தமிழில் துல்லியமாக வழங்குகிறது.
theological_decisions:
- issue: ஆட்டுக்குட்டியானவர் மேய்ப்பராக இருப்பதன் கிறிஸ்துவியல் முரண்பாடு
  choice: ‘ஆட்டுக்குட்டியானவர் ... அவர்களை மேய்ப்பார்’ என்று நேரடியாகத் தக்கவைக்கப்பட்டது.
  alternative: ‘ஆட்டுக்குட்டியானவர் ... அவர்களைப் பராமரிப்பார்’ அல்லது ‘அவர்களை ஆள்வார்.’
  rationale: மேய்ப்பர் உருவகமும் ஆட்டுக்குட்டி உருவகமும் ஒரே நபரில் வேண்டுமென்றே இணைக்கப்படுகின்றன; அதை மென்மையாக்குவது வெளிப்படுத்தலின் தனித்துவமான இறையியல் வலிமையைக் குறைக்கும்.
- issue: இறுதி வாக்கியத்தில் கடவுளுக்கும் ஆட்டுக்குட்டியானவருக்கும் உள்ள இலக்கண வேறுபாடு
  choice: ‘கடவுள்’ என்பது புதிய, வெளிப்படையான எழுவாயாகத் தக்கவைக்கப்பட்டது.
  alternative: ஆட்டுக்குட்டியானவரே தொடர்ந்து எழுவாய் என மறைமுகமாகக் கொள்ளுதல்.
  rationale: கிரேக்கம் ὁ θεός என்பதை ἐξαλείψει என்பதன் வெளிப்படையான எழுவாயாகக் குறிப்பிடுகிறது; ஆகவே காட்சியில் உள்ள வேறுபாட்டை மொழிபெயர்ப்பு அழிக்கக்கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையும் வெளிப்படுத்தலுக்குரிய காட்சித்தன்மையும் பேணப்பட்டுள்ளன. ‘ஆட்டுக்குட்டியானவர்’ என்ற வடிவம் பட்டத்திற்குரிய மரியாதையைக் காட்டுகிறது; ‘மேய்ப்பார்’ என்பது திட்டமிட்ட உருவக முரண்பாட்டை நேரடியாக வைத்திருக்கிறது. அடிக்குறி குறியீடுகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்பே வைக்கப்பட்டுள்ளன.
