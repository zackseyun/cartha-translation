revisions:
- from: அவன், “எங்கள் கடவுளின் அடிமைகளுடைய[a] நெற்றிகளில் நாங்கள் முத்திரையிடும்வரை பூமிக்கோ கடலுக்கோ மரங்களுக்கோ தீங்கு செய்யாதீர்கள்” என்று சொன்னான்.
  to: அவர், “எங்கள் கடவுளின் அடிமைகளின் நெற்றிகளில் நாங்கள் முத்திரையிடும்வரை பூமிக்கோ, கடலுக்கோ, மரங்களுக்கோ தீங்கு செய்யாதீர்கள்” என்று கூறினார்.
