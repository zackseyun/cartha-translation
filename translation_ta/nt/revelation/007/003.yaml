id: REV.7.3
reference: Revelation 7:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγων· Μὴ ἀδικήσητε τὴν γῆν μήτε τὴν θάλασσαν μήτε τὰ δένδρα, ⸀ἄχρι σφραγίσωμεν τοὺς δούλους τοῦ θεοῦ ἡμῶν ἐπὶ τῶν μετώπων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/003.yaml
  text: saying[a], “Do not harm the earth or the sea or the trees until we have sealed the servants of our God on their foreheads.”
translation:
  language: ta
  text: அவர், “எங்கள் கடவுளின் அடிமைகளின் நெற்றிகளில் நாங்கள் முத்திரையிடும்வரை பூமிக்கோ, கடலுக்கோ, மரங்களுக்கோ தீங்கு செய்யாதீர்கள்” என்று கூறினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων
  choice: என்று சொன்னான்
  rationale: இது முந்தைய வசனத்தில் குறிப்பிடப்பட்ட தூதனின் பேச்சைத் தொடரும் நிகழ்கால வினையெச்சம். தனி வசனமாகத் தமிழில் இயல்பாக வாசிக்க, எழுவாயைச் சுட்டும் ‘அவன்’ என்பதுடன் இறந்தகால வினையாக அமைக்கப்பட்டது.
- source_word: ἀδικήσητε
  choice: தீங்கு செய்யாதீர்கள்
  rationale: பூமி, கடல், மரங்கள் ஆகியவை செயப்படுபொருள்களாக இருப்பதால், இங்கு ஒழுக்க அநீதியைவிட சேதம் விளைவித்தல் என்ற பொருளே சூழலுக்குப் பொருந்துகிறது.
- source_word: τὴν γῆν
  choice: பூமி
  rationale: கடல் மற்றும் மரங்களுடன் வரும் உலகளாவிய நியாயத்தீர்ப்புக் காட்சியில் ‘நிலம்’ என்பதைவிட ‘பூமி’ பொருத்தமானது.
- source_word: τὴν θάλασσαν
  choice: கடல்
  rationale: மூலச்சொல்லின் நேரான, இயல்பான தமிழ் இணைச்சொல்.
- source_word: τὰ δένδρα
  choice: மரங்கள்
  rationale: பன்மையைத் துல்லியமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἄχρι
  choice: முத்திரையிடும்வரை
  rationale: தீங்கு செய்யக்கூடாத காலவரம்பைத் தெளிவாகக் குறிக்கிறது.
- source_word: σφραγίσωμεν
  choice: நாங்கள் முத்திரையிடு-
  rationale: முதல் நபர் பன்மையைப் பாதுகாத்து, அடுத்த நடவடிக்கைக்கு முன் நடைபெற வேண்டிய முத்திரையிடும் செயலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τοὺς δούλους
  choice: அடிமைகள்
  rationale: δοῦλος என்பது எஜமானுக்குச் சொந்தமானவரைக் குறிக்கக்கூடும். இங்கு முத்திரை கடவுளுக்குரிய சொந்தத்தையும் பற்றுறுதியையும் காட்டுவதால், ‘அடிமைகள்’ அந்த வலிமையைப் பாதுகாக்கிறது.
- source_word: τοῦ θεοῦ ἡμῶν
  choice: எங்கள் கடவுளின்
  rationale: சொந்த உறவைக் காட்டும் பிறப்புவேற்றுமையையும் ‘எங்கள்’ என்ற முதல் நபர் பன்மையையும் நேராகப் பாதுகாக்கிறது.
- source_word: ἐπὶ τῶν μετώπων αὐτῶν
  choice: அவர்களுடைய நெற்றிகளில்
  rationale: முத்திரையின் இருப்பிடத்தை நவீனத் தமிழில் துல்லியமாகவும் இயல்பாகவும் கூறுகிறது.
theological_decisions:
- issue: கடவுளுக்குரியவர்களைக் குறிக்கும் δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: அடிமைகள்
  alternative: பணியாளர்கள்; ஊழியர்கள்
  rationale: இந்தக் காட்சியில் முத்திரையிடப்படுவோர் கடவுளுக்குச் சொந்தமானவர்கள் என்ற கருத்து முக்கியமானது. ‘அடிமைகள்’ அந்த உரிமை மற்றும் முழுமையான கட்டுப்பாட்டின் வலிமையைத் தக்கவைக்கிறது; மென்மையான பாரம்பரிய மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. கட்டளையின் தீவிரம் ‘தீங்கு செய்யாதீர்கள்’ என்பதாலும், கடவுளுக்குரிய சொந்த உறவு ‘அடிமைகள்’ என்பதாலும் பாதுகாக்கப்பட்டுள்ளது. கிரேக்க வசனம் முந்தைய தொடரின் வினையெச்சமாக இருந்தாலும், தனி வசன வாசிப்புக்காக ‘அவன் ... என்று சொன்னான்’ எனத் தமிழில் முழு வாக்கியமாக்கப்பட்டுள்ளது.
