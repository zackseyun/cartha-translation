  source_fidelity: கிரேக்க மூலத்தின் நிகழ்கால முழக்கத்தையும் (κράζουσι), ‘உரத்த குரலில்’ என்ற முறையையும் (φωνῇ μεγάλῃ), மேற்கோளின் உள்ளடக்கத்தையும் துல்லியமாகத் தருகிறது. σωτηρία-வுடன் வரும் இரு dative-களின் உரிமையாக்க/புகழுரைக் கருத்து ‘மீட்பு உரியது’ என்பதன் மூலம் கடவுளுக்கும் ஆட்டுக்குட்டியானவருக்கும் இணையாகப் பொருந்துகிறது. அரியணையில் அமர்ந்திருப்பவர் எங்கள் கடவுள் என்பதும் சரியாக இணைக்கப்பட்டுள்ளது.
  naturalness: ‘அவர்கள் உரத்த குரலில் … என்று முழங்குகிறார்கள்’ என்பது நவீன நிலையான தமிழில் இயல்பாகவும் காட்சியின் உயிரோட்டத்தைத் தக்கவைத்தும் உள்ளது. ‘அரியணை,’ ‘முழங்குகிறார்கள்,’ மற்றும் மரியாதை வடிவிலான ‘ஆட்டுக்குட்டியானவர்’ ஆகியவை இவ்வழிபாட்டு/தரிசனச் சூழலுக்கு ஏற்ற கண்ணியமான நடையை வழங்குகின்றன.
  terminology: ‘கடவுள்,’ ‘அரியணை,’ ‘மீட்பு,’ ‘ஆட்டுக்குட்டியானவர்’ ஆகிய தேர்வுகள் மூலப் படிமத்தையும் வெளிப்படுத்தல் நூலில் நிலையாக வரும் ஆட்டுக்குட்டி பட்டத்தையும் பாதுகாக்கின்றன. ‘மீட்பு’ என்பது σωτηρία-க்கு நவீன பொதுத்தமிழில் பொருத்தமான சொல்; குறிப்பிட்ட பிரிவுசார் விளக்கத்தை ஏற்றுவதில்லை.
