reference: Revelation 7:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ κράζουσι φωνῇ μεγάλῃ λέγοντες· Ἡ σωτηρία τῷ θεῷ ἡμῶν τῷ καθημένῳ ἐπὶ τῷ θρόνῳ καὶ τῷ ἀρνίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/010.yaml
  text: And they cry out with a loud voice[a], saying, “Salvation belongs to our God, who sits on the throne, and to the Lamb!”
translation:
  language: ta
  text: அவர்கள் உரத்த குரலில், “அரியணையில் அமர்ந்திருக்கும் எங்கள் கடவுளுக்கும் ஆட்டுக்குட்டியானவருக்கும் மீட்பு உரியது!”[a] என்று முழங்குகிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லாக: “அரியணையில் அமர்ந்திருக்கும் எங்கள் கடவுளுக்கும் ஆட்டுக்குட்டியானவருக்கும் மீட்பு!”'
    reason: கிரேக்கத்தில் இவ்வாழ்த்துரை வெளிப்படையான வினைச்சொல் இல்லாமல் உள்ளது; ‘உரியது’ என்பது தமிழில் உறவைத் தெளிவாக்கச் சேர்க்கப்பட்டுள்ளது.
lexical_decisions:
- source_word: κράζουσι
  choice: முழங்குகிறார்கள்
  rationale: நிகழ்கால வினைச்சொல் காட்சியின் உயிரோட்டத்தையும் தொடரும் கூக்குரலையும் காட்டுகிறது. ‘முழங்குகிறார்கள்’ என்பது சாதாரணமாகச் சொல்வதைவிட κράζω என்பதன் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: φωνῇ μεγάλῃ
  choice: உரத்த குரலில்
  rationale: முறை அல்லது கருவியைக் குறிக்கும் இந்தச் சொற்றொடரை, குரலின் படிமத்தைத் தக்கவைக்கும் இயல்பான நவீன தமிழாக மொழிபெயர்க்கிறது.
- source_word: λέγοντες
  choice: “…” என்று
  rationale: பங்கேற்புவினை முழக்கத்தின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் மேற்கோளுக்குப் பின் வரும் ‘என்று’ இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Ἡ σωτηρία
  choice: மீட்பு உரியது
  rationale: வினைச்சொல் இல்லாத கிரேக்க வாழ்த்துரையில் மீட்பு கடவுளுக்கும் ஆட்டுக்குட்டியானவருக்கும் உரியதாகக் கூறப்படுகிறது. ‘உரியது’ இந்த attribution-ஐ தெளிவாக்குகிறது; ‘மீட்பு’ σωτηρία என்பதன் பொருளை நவீன பொதுத் தமிழில் தருகிறது.
- source_word: τῷ θεῷ ἡμῶν
  choice: எங்கள் கடவுளுக்கும்
  rationale: வேற்றுமை உருபு மீட்பு யாருக்கு உரியது என்பதைச் சுட்டுகிறது. ‘எங்கள் கடவுள்’ என்பது தெளிவான, சமயப் பிரிவுசார் தன்மை இல்லாத நவீன தமிழ்.
- source_word: τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: அரியணையில் அமர்ந்திருக்கும்
  rationale: இந்தப் பங்கேற்புச் சொற்றொடர் ‘எங்கள் கடவுள்’ என்பவரை அடையாளப்படுத்துகிறது. நிகழ்காலக் காட்சியையும் அரசாட்சிப் படிமத்தையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: τῷ ἀρνίῳ
  choice: ஆட்டுக்குட்டியானவருக்கும்
  rationale: வெளிப்படுத்தலில் இயேசுவுக்கான பட்டமாக வரும் ἀρνίον என்பதன் பலியையும் மேசியாவையும் குறிக்கும் படிமத்தை மொழிபெயர்த்துத் தக்கவைக்கிறது; மரியாதைப் பன்மை தமிழில் பட்டத்துக்கேற்ற கண்ணியத்தை அளிக்கிறது.
theological_decisions:
- issue: மீட்புக்கும் கடவுள் மற்றும் ஆட்டுக்குட்டியானவருக்கும் உள்ள தொடர்பு
  choice: ‘எங்கள் கடவுளுக்கும் ஆட்டுக்குட்டியானவருக்கும் மீட்பு உரியது’ என்று இருவரையும் இணைக்கும் வாழ்த்துரையாக மொழிபெயர்த்தல்
  alternative: ‘எங்கள் கடவுளுக்கும் ஆட்டுக்குட்டியானவருக்கும் மீட்பு’ என்று வினைச்சொல் இல்லாமல் சொற்சொல்லாக மொழிபெயர்த்தல்
  rationale: கிரேக்க வேற்றுமை அமைப்பு மீட்பைக் கடவுளுக்கும் ஆட்டுக்குட்டியானவருக்கும் ஒன்றாக உரித்தாக்குகிறது. இதைச் சுருக்கமான கோட்பாட்டு விளக்கமாக மாற்றாமல், மூலத்தின் இறையியல் அழுத்தத்தையும் வழிபாட்டு வலிமையையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வழிபாட்டு நடையைப் பயன்படுத்துகிறது. காட்சியின் நிகழ்கால உயிரோட்டத்திற்காக ‘முழங்குகிறார்கள்’ என்றும், θρόνος என்பதன் அரசாட்சிப் படிமத்திற்காக ‘அரியணை’ என்றும், சமயப் பிரிவுசார் சொல் தேர்வைத் தவிர்க்க ‘கடவுள்’ என்றும் வழங்கப்பட்டுள்ளது.
