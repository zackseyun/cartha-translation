id: REV.7.5
reference: Revelation 7:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐκ φυλῆς Ἰούδα δώδεκα χιλιάδες ⸀ἐσφραγισμένοι, ἐκ φυλῆς Ῥουβὴν δώδεκα χιλιάδες, ἐκ φυλῆς Γὰδ δώδεκα χιλιάδες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/005.yaml
  text: from the tribe of Judah[a], twelve thousand were sealed; from the tribe of Reuben, twelve thousand; from the tribe of Gad, twelve thousand.
translation:
  language: ta
  text: யூதா கோத்திரத்திலிருந்து[a] முத்திரையிடப்பட்டவர்கள் பன்னிரண்டாயிரம் பேர்; ரூபன் கோத்திரத்திலிருந்து பன்னிரண்டாயிரம் பேர்; காத் கோத்திரத்திலிருந்து பன்னிரண்டாயிரம் பேர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லான வரிசையில்: “யூதா கோத்திரத்திலிருந்து பன்னிரண்டாயிரம் பேர், முத்திரையிடப்பட்டவர்கள்.” கிரேக்கத்தில் “முத்திரையிடப்பட்டவர்கள்” என்ற செயப்பாட்டு வினையெச்சம் முதல் கோத்திரத்தின் எண்ணிக்கைக்குப் பின் வருகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: கோத்திரத்திலிருந்து
  rationale: மூலம் அல்லது சேர்ந்த இடத்தைக் குறிக்கும் ἐκ என்பதன் பொருளை இயல்பான தமிழில் தருகிறது; பட்டியலின் திரும்பவரும் அமைப்பையும் காக்கிறது.
- source_word: φυλῆς
  choice: கோத்திரம்
  rationale: இஸ்ரவேலின் மரபுவழிக் குழுக்களைக் குறிக்கும் நிலையான, பொதுவாகப் புரிந்துகொள்ளப்படும் சொல்; ‘குலம்’ என்பது இங்குள்ள பன்னிரு கோத்திர அமைப்பைத் தெளிவாகக் காட்டாது.
- source_word: Ἰούδα
  choice: யூதா
  rationale: இந்தப் பெயருக்கான நிலையான தமிழ் வேதாகம வடிவம்.
- source_word: δώδεκα χιλιάδες
  choice: பன்னிரண்டாயிரம் பேர்
  rationale: எண்ணிக்கையை நேரடியாகத் தருகிறது; தமிழில் மனிதர்களின் எண்ணிக்கை என்பதைத் தெளிவாக்க ‘பேர்’ இயல்பாகச் சேர்க்கப்படுகிறது.
- source_word: ἐσφραγισμένοι
  choice: முத்திரையிடப்பட்டவர்கள்
  rationale: செயப்பாட்டு வினையெச்சத்தின் பெயரடைச் செயல்பாட்டைக் காக்கிறது. முதல் கோத்திரத்தின் எண்ணிக்கைக்குப் பின் கிரேக்கத்தில் வரும் சொல்லை இயல்பான தமிழில் எண்ணப்பட்ட மக்களோடு இணைக்கிறது; அடுத்த இணை உறுப்புகளில் அது மறைமுகமாகத் தொடர்கிறது.
- source_word: Ῥουβὴν
  choice: ரூபன்
  rationale: இந்தக் கோத்திரப் பெயருக்கான நிலையான தமிழ் வடிவம்.
- source_word: Γὰδ
  choice: காத்
  rationale: இந்தக் கோத்திரப் பெயருக்கான நிலையான தமிழ் வடிவம்; இறுதி கிரேக்க மெய்யொலியைத் தமிழ் எழுத்துமுறையில் இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: கோத்திரப் பட்டியலில் ἐσφραγισμένοι என்பதன் வடிவமும் பொருள் விரிவும்
  choice: முதல் உறுப்பில் ‘முத்திரையிடப்பட்டவர்கள்’ என்று வெளிப்படையாகக் கொடுத்து, அடுத்த கோத்திர உறுப்புகளில் அதைக் கூறாமல் பொருளில் தொடரச் செய்தல்
  alternative: ‘பன்னிரண்டாயிரம் பேர் முத்திரையிடப்பட்டிருந்தார்கள்’ என்று முற்றுவினையாக மொழிபெயர்த்தல், அல்லது ஒவ்வொரு கோத்திரத்திற்குப் பின்னும் ‘முத்திரையிடப்பட்டவர்கள்’ என்று மீண்டும் கூறுதல்
  rationale: கிரேக்கத்தில் இது முதல் எண்ணிக்கைக்குப் பின் வரும் செயப்பாட்டு வினையெச்சம்; பட்டியலில் எண்ணப்பட்டவர்களை விவரிக்கிறது. பெயரடைத் தன்மையுள்ள தமிழ் வடிவம் மூல அமைப்பை நெருக்கமாகக் காக்கிறது. அடுத்த உறுப்புகளில் மீண்டும் சேர்க்காமல் இருப்பது மூலத்தின் விடுபாட்டையும் முழுப் பட்டியலுக்கான இயல்பான பொருள் விரிவையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கோத்திரம்’, ‘முத்திரையிடப்பட்டவர்கள்’ ஆகியவை வெளிப்படுத்துதல் நூலின் பட்டியல் மற்றும் முத்திரையிடுதல் சார்ந்த சொற்பிணைப்பைத் தக்கவைக்கின்றன; அரைப்புள்ளிகள் மூன்று இணை உறுப்புகளையும் தெளிவாகப் பிரிக்கின்றன.
