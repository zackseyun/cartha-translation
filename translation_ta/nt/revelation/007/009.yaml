id: REV.7.9
reference: Revelation 7:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον, καὶ ἰδοὺ ὄχλος πολύς, ὃν ἀριθμῆσαι ⸀αὐτὸν οὐδεὶς ἐδύνατο, ἐκ παντὸς ἔθνους καὶ φυλῶν καὶ λαῶν καὶ γλωσσῶν, ⸀ἑστῶτες ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τοῦ ἀρνίου, περιβεβλημένους στολὰς λευκάς, καὶ ⸀φοίνικες ἐν ταῖς χερσὶν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/009.yaml
  text: After these things I looked[a], and behold, a great multitude that no one was able to count, from every nation and tribe and people and language, standing before the throne and before the Lamb, clothed in white robes, with palm branches in their hands.
translation:
  language: ta
  text: இவற்றுக்குப் பின்பு நான் பார்த்தேன்; இதோ, யாராலும் எண்ண முடியாத ஒரு பெரும் மக்கள் திரள்! அவர்கள் ஒவ்வொரு தேசத்திலிருந்தும், கோத்திரங்களிலிருந்தும், மக்களிலிருந்தும், மொழிகளிலிருந்தும் சேர்ந்தவர்கள்[a]. அவர்கள் வெள்ளை அங்கிகளை அணிந்து, தங்கள் கைகளில் பனைக் கிளைகளை ஏந்திக்கொண்டு, அரியணைக்கு முன்பாகவும் ஆட்டுக்குட்டியானவருக்கு முன்பாகவும் நின்றுகொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'மென்மையாக: “எல்லா தேசங்கள், கோத்திரங்கள், மக்கள், மொழிகளிலிருந்தும் சேர்ந்தவர்கள்.” முதன்மை உரை கிரேக்க மூலத்தில் ‘தேசம்’ ஒருமையிலும், அதைத் தொடர்ந்து வரும் சொற்கள் பன்மையிலும் இருப்பதைப் பேணுகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: இவற்றுக்குப் பின்பு
  rationale: ταῦτα என்பதன் பன்மையைப் பேணுவதோடு, வெளிப்படுத்தின விசேஷத்தின் தொடர்ச்சியான தரிசன அமைப்பையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: εἶδον, καὶ ἰδοὺ
  choice: நான் பார்த்தேன்; இதோ
  rationale: தரிசனத்தில் கவனம் திரும்புவதை ‘பார்த்தேன்’ காட்டுகிறது; ἰδού என்பதன் கவன ஈர்ப்பு வலிமையை ‘இதோ’ நேரடியாகப் பேணுகிறது.
- source_word: ὄχλος πολύς
  choice: ஒரு பெரும் மக்கள் திரள்
  rationale: ‘மக்கள் திரள்’ என்பது ὄχλος-ஐ இயல்பான நவீன தமிழில் தெரிவிக்கிறது; ‘பெரும்’ என்பது அதன் மிகுதியையும் காட்சியின் மேன்மையான நடையையும் பேணுகிறது.
- source_word: ὃν ἀριθμῆσαι αὐτὸν οὐδεὶς ἐδύνατο
  choice: யாராலும் எண்ண முடியாத
  rationale: மக்கள் திரளை எண்ணுவதற்கான மனித இயலாமையைச் சுருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: ἐκ παντὸς ἔθνους καὶ φυλῶν καὶ λαῶν καὶ γλωσσῶν
  choice: சகல தேசத்திலிருந்தும் கோத்திரங்களிலிருந்தும் மக்களினங்களிலிருந்தும் மொழிகளிலிருந்தும்
  rationale: ἔθνος ஒருமையிலும், அதன்பின் வரும் φυλαί, λαοί, γλῶσσαι பன்மையிலும் இருப்பதை தமிழிலும் பேணுகிறது. வேறுபட்ட சமூக மற்றும் மொழி வகைகளை ஒன்றாகக் கலக்காமல் தெரிவிக்கிறது.
- source_word: ἑστῶτες
  choice: நின்றுகொண்டிருந்தார்கள்
  rationale: பெரும் மக்கள் திரளைக் கருத்தின் அடிப்படையில் பன்மையாகக் கொண்டு, காட்சியில் அவர்கள் தொடர்ந்து நிற்கும் நிலையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τοῦ ἀρνίου
  choice: அரியணைக்கு முன்பாகவும் ஆட்டுக்குட்டியானவருக்கு முன்பாகவும்
  rationale: ἐνώπιον இருமுறை வருவதைப் பேணுகிறது. ἀρνίον வெளிப்படுத்தின விசேஷத்தில் கிறிஸ்துவைக் குறிக்கும் நிலையான பட்டமாதலால், மரியாதையையும் நபரைக் குறிக்கும் தன்மையையும் தெளிவாக்க ‘ஆட்டுக்குட்டியானவர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: περιβεβλημένους στολὰς λευκάς
  choice: வெள்ளை அங்கிகளை அணிந்து
  rationale: στολαί குறிக்கும் நீண்ட சிறப்பு உடைகளை ‘அங்கிகள்’ தெளிவாகத் தெரிவிக்கிறது; περιβεβλημένους என்பதற்கு இயல்பான தமிழாக ‘அணிந்து’ அமைகிறது.
- source_word: φοίνικες ἐν ταῖς χερσὶν αὐτῶν
  choice: தங்கள் கைகளில் பனையோலைகளை ஏந்திக்கொண்டு
  rationale: இங்கு φοίνικες என்பது பனைமரங்களைக் காட்டிலும் பனையோலைகள் அல்லது பனைக் கிளைகளைக் குறிக்கிறது. கைகளில் வைத்திருக்கும் காட்சியை ‘ஏந்திக்கொண்டு’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἀρνίον என்பதை கிறிஸ்துவுக்குரிய பட்டமாக மொழிபெயர்த்தல்
  choice: ஆட்டுக்குட்டியானவர்
  alternative: ஆட்டுக்குட்டி
  rationale: ἀρνίον வடிவத்தில் சிறுமைப் பொருள் இருக்கக்கூடியதாயினும், வெளிப்படுத்தின விசேஷத்தில் அது கிறிஸ்துவுக்குரிய நிலையான பட்டமாகச் செயல்படுகிறது. ‘ஆட்டுக்குட்டியானவர்’ என்பது தேவையற்ற ‘சிறிய’ என்ற கருத்தைச் சேர்க்காமல், பட்டத்தின் மரியாதையையும் நபரைக் குறிக்கும் தன்மையையும் பேணுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான தரிசன நடையைப் பயன்படுத்துகிறது. ‘இதோ’ என்ற கவன ஈர்ப்புச் சொல்லும், ‘அரியணைக்கு முன்பாகவும் … முன்பாகவும்’ என்ற மீளுரையும் மூலத்தின் வலியுறுத்தலைப் பேணுகின்றன. நீண்ட கிரேக்க வாக்கியம் தமிழில் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; தகவல் தொடர்பும் காட்சியின் ஓட்டமும் காக்கப்பட்டுள்ளன.
