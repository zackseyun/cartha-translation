id: REV.7.15
reference: Revelation 7:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διὰ τοῦτό εἰσιν ἐνώπιον τοῦ θρόνου τοῦ θεοῦ, καὶ λατρεύουσιν αὐτῷ ἡμέρας καὶ νυκτὸς ἐν τῷ ναῷ αὐτοῦ, καὶ ὁ καθήμενος ἐπὶ ⸂τοῦ θρόνου⸃ σκηνώσει ἐπ’ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/015.yaml
  text: For this reason they are before the throne of God[a], and they serve him day and night in his temple, and the one seated on the throne will spread his tent over them.
translation:
  language: ta
  text: இதன் காரணமாக அவர்கள் கடவுளுடைய அரியணைக்கு முன்பாக இருக்கிறார்கள்; அவருடைய ஆலயத்தில் பகலும் இரவும் அவருக்குப் பணி செய்கிறார்கள். அரியணையில் அமர்ந்திருப்பவர் தமது கூடாரத்தை அவர்கள்மேல் விரிப்பார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள்மேல் குடியிருப்பார்” அல்லது “அவர்களுக்கு அடைக்கலமாயிருப்பார்.” இங்குள்ள கிரேக்க வினைச்சொல் “கூடாரம்” அல்லது “திருக்கூடாரம்” என்ற உருவகத்துடன் தொடர்புடையது.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτό
  choice: இதன் காரணமாக
  rationale: முந்தைய வசனத்தில் கொடுக்கப்பட்ட விளக்கத்தோடு இவ்வசனத்தை வெளிப்படையாகக் காரணத் தொடர்பில் இணைக்கிறது; சுருக்கமான ‘ஆகவே’ என்பதைவிட மூலத்தின் அமைப்பைத் தெளிவாகக் காக்கிறது.
- source_word: ἐνώπιον
  choice: முன்பாக
  rationale: கடவுளுடைய அரியணையின் முன்னிலையிலும் சந்நிதியிலும் அவர்கள் இருப்பதைக் குறிக்கும் இயல்பான, சுருக்கமான தமிழ் சொல்.
- source_word: λατρεύουσιν
  choice: பணிசெய்கிறார்கள்
  rationale: λατρεύω கடவுளுக்குச் செய்யப்படும் வழிபாடு சார்ந்த சேவையைக் குறிக்கிறது. ஆலயச் சூழல் அதன் வழிபாட்டுத் தன்மையைத் தெளிவாக்குவதால், ‘பணிசெய்கிறார்கள்’ என்பது அதை வாய்மொழி வழிபாட்டுக்கு மட்டும் குறுக்காமல் காக்கிறது.
- source_word: ἡμέρας καὶ νυκτός
  choice: பகலும் இரவும்
  rationale: இடைவிடாத சேவையை உணர்த்தும் மூல உருவகத்தை இயல்பான தமிழ் இணைச்சொற்றொடராகப் பாதுகாக்கிறது.
- source_word: ναῷ
  choice: ஆலயத்தில்
  rationale: ναός ஆலயத்தையோ அதன் புனித மையப்பகுதியையோ குறிக்கிறது. இங்கு வானுலகச் சூழல் அருகிலுள்ள உரையால் தெளிவாகிறது; ‘ஆலயம்’ பொதுவாகப் புரியும், கண்ணியமான சொல்.
- source_word: ὁ καθήμενος ἐπὶ τοῦ θρόνου
  choice: அரியணையில் அமர்ந்திருப்பவர்
  rationale: தொடர்ந்து அமர்ந்திருக்கும் நிலையையும் அடைமொழிப் பெயரின் தன்மையையும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: σκηνώσει ἐπ’ αὐτούς
  choice: தமது கூடாரத்தை அவர்கள்மேல் விரிப்பார்
  rationale: σκηνόω என்பதிலுள்ள கூடாரம் அல்லது வாசஸ்தல உருவகத்தையும் ἐπί காட்டும் ‘மேல்’ என்ற உறவையும் காக்கிறது. அதே நேரத்தில் கடவுளின் பாதுகாக்கும் பிரசன்னத்தை வாசகர் உணரக்கூடிய இயல்பான தமிழாக உள்ளது.
theological_decisions:
- issue: σκηνώσει என்பதில் உள்ள இறைப் பிரசன்னம் மற்றும் கூடார உருவகம்
  choice: தமது கூடாரத்தை அவர்கள்மேல் விரிப்பார்
  alternative: அவர்கள்மேல் குடியிருப்பார்; அவர்களுக்கு அடைக்கலமாயிருப்பார்
  rationale: தேர்ந்த மொழிபெயர்ப்பு கடவுளின் பாதுகாப்பளிக்கும், உடனிருக்கும் பிரசன்னத்தைச் சுட்டும் கூடார உருவகத்தைத் தக்கவைக்கிறது. ‘அடைக்கலமாயிருப்பார்’ என்பது அதன் பயனை மட்டும் கூறி உருவகத்தை இழக்கிறது; ‘குடியிருப்பார்’ என்பது உடனிருப்பைத் தரினும் பாதுகாப்பின் நிழலை மங்கச் செய்யலாம். எந்தக் கூடுதல் சமயக் கோட்பாட்டையும் புகுத்தாமல் மூலத்தின் அர்த்தச் செறிவை இது பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. ‘அரியணை’, ‘ஆலயம்’ ஆகியவை வெளிப்படுத்துதல் நூலின் உயர்ந்த காட்சிநடையைத் தக்கவைக்கின்றன. ‘பணிசெய்கிறார்கள்’ என்ற சொல் ஆலயச் சூழலில் வழிபாடு சார்ந்த சேவையை உணர்த்துகிறது; ‘தமது’ என்பது அரியணையில் அமர்ந்திருப்பவரை மரியாதையுடன் சுட்டுகிறது.
