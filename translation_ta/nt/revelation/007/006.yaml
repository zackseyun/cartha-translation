  text: ἐκ φυλῆς Ἀσὴρ δώδεκα χιλιάδες, ἐκ φυλῆς Νεφθαλὶμ δώδεκα χιλιάδες, ἐκ φυλῆς Μανασσῆ δώδεκα χιλιάδες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/006.yaml
  text: from the tribe of Asher[a], twelve thousand; from the tribe of Naphtali, twelve thousand; from the tribe of Manasseh, twelve thousand;
translation:
  language: ta
  text: ஆசேர் கோத்திரத்திலிருந்து பன்னிரண்டாயிரம் பேர்[a]; நப்தலி கோத்திரத்திலிருந்து பன்னிரண்டாயிரம் பேர்; மனாசே கோத்திரத்திலிருந்து பன்னிரண்டாயிரம் பேர்;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சூழலை இன்னும் வெளிப்படையாகக் காட்ட, “ஆசேர் கோத்திரத்திலிருந்து பன்னிரண்டாயிரம் பேர் முத்திரையிடப்பட்டார்கள்” என்றும், தொடர்ந்து வரும் கோத்திரங்களுக்கும் அவ்வாறே புரிந்துகொள்ளலாம். இவ்வசனத்தின் கிரேக்க உரையில் அந்த வினைச்சொல் மீண்டும் இடம்பெறவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ
  choice: -இலிருந்து
  rationale: இந்த முன்னிடைச்சொல் மூலத்தையோ தோற்றத்தையோ குறிக்கிறது; ஒவ்வொரு கோத்திரத்திலிருந்தும் எண்ணப்பட்டவர்களை இயல்பான தமிழில் காட்டுகிறது.
- source_word: φυλῆς
  choice: கோத்திரம்
  rationale: இஸ்ரவேலின் வம்சவழிப் பிரிவைக் குறிக்கும் இச்சூழலில், நவீன தமிழ் வேதாகம நடையில் துல்லியமாகவும் பரவலாகப் புரிந்துகொள்ளத்தக்கதாகவும் உள்ள சொல்.
- source_word: Ἀσὴρ
  choice: ஆசேர்
  rationale: கோத்திரத் தலைவரின் பெயருக்கான தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: δώδεκα χιλιάδες
  choice: பன்னிரண்டாயிரம் பேர்
  rationale: எண்ணிக்கையை நேரடியாகத் தருகிறது; மனிதர்களைக் குறிக்கும் பட்டியல் என்பதால் இயல்பான தமிழுக்காக ‘பேர்’ சேர்க்கப்பட்டுள்ளது. கிரேக்கத்தில் இல்லாத ‘முத்திரையிடப்பட்டார்கள்’ என்ற வினைச்சொல் சேர்க்கப்படவில்லை.
- source_word: Νεφθαλὶμ
  choice: நப்தலி
  rationale: இந்தக் கோத்திரப் பெயருக்கான தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பு.
- source_word: Μανασσῆ
  choice: மனாசே
  rationale: இந்தக் கோத்திரப் பெயருக்கான தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
theological_decisions:
- issue: சுற்றியுள்ள வசனங்களிலிருந்து ‘முத்திரையிடப்பட்டார்கள்’ என்ற மறைபொருள் வினையைச் சேர்ப்பதா
  choice: முதன்மை உரையில் அந்த வினையைச் சேர்க்காமல், கிரேக்கத்தின் வினையற்ற பட்டியல் அமைப்பைப் பேணுதல்.
  alternative: “ஆசேர் கோத்திரத்திலிருந்து பன்னிரண்டாயிரம் பேர் முத்திரையிடப்பட்டார்கள்”; தொடர்ந்து மற்ற கோத்திரங்களுக்கும் இதே வினையைப் பொருத்துதல்.
  rationale: முத்திரையிடுதல் என்ற ஆளும் கருத்து முந்தைய சூழலில் தெளிவாக இருந்தாலும், இவ்வசனத்தின் கிரேக்க உரையில் வினைச்சொல் மீண்டும் இடம்பெறவில்லை. ஆகவே மூலத்தின் சுருக்கத்தையும் அதன் இலக்கணத் திறப்பையும் முதன்மை உரை பேணுகிறது; சூழலால் நிரப்பக்கூடிய வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் பட்டியலின் சுருக்கமும் காக்கப்பட்டுள்ளன. ‘பேர்’ என்பது கிரேக்கத்தில் தனிச் சொல்லாக இல்லாவிட்டாலும், எண்ணப்படுபவர்கள் மனிதர்கள் என்பதை இயல்பான தமிழில் தெளிவாக்குகிறது. அரைப்புள்ளிகள் மூலத்தின் தொடர்ச்சியான கணக்கெடுப்புப் பட்டியல் ஓசையைப் பேணுகின்றன.
