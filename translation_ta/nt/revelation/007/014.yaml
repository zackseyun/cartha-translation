revisions:
- from: அதற்கு நான் அவரிடம், “என் தலைவரே, உமக்கே தெரியும்” என்றேன். அவர் என்னிடம், “இவர்கள் அந்த மாபெரும் உபத்திரவத்திலிருந்து[a] வெளியே வந்துகொண்டிருப்பவர்கள். இவர்கள் தங்கள் நீண்ட அங்கிகளைக் கழுவி, ஆட்டுக்குட்டியானவரின் இரத்தத்தில்[b] அவற்றை வெண்மையாக்கினார்கள்” என்றார்.
  to: அதற்கு நான் அவரிடம், “என் ஐயா, உமக்கே தெரியும்” என்றேன். அவர் என்னிடம், “இவர்கள் அந்த மாபெரும் உபத்திரவத்திலிருந்து[a] வெளியே வருகிறவர்கள். இவர்கள் தங்கள் நீண்ட அங்கிகளைக் கழுவி, ஆட்டுக்குட்டியானவரின் இரத்தத்தில்[b] அவற்றை வெண்மையாக்கினார்கள்” என்றார்.
  rationale: The revision makes two limited idiomatic corrections. It replaces an over-specific title with a natural honorific appropriate to John’s address to the elder, and it streamlines the present-participial expression without changing its aspect. No doctrinal interpretation is added, and the footnote anchors and contents remain correctly aligned.
