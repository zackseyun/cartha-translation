id: REV.7.14
reference: Revelation 7:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ⸀εἴρηκα αὐτῷ· Κύριέ μου, σὺ οἶδας. καὶ εἶπέν μοι· Οὗτοί εἰσιν οἱ ἐρχόμενοι ἐκ τῆς θλίψεως τῆς μεγάλης, καὶ ἔπλυναν τὰς στολὰς αὐτῶν καὶ ἐλεύκαναν ⸀αὐτὰς ἐν τῷ αἵματι τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/014.yaml
  text: And I said to him[a], “My lord, you know.” And he said to me, “These are the ones coming out of the great tribulation[b]. They washed their robes and made them white in the blood of the Lamb.”
translation:
  language: ta
  text: அதற்கு நான் அவரிடம், “என் ஐயா, உமக்கே தெரியும்” என்றேன். அவர் என்னிடம், “இவர்கள் அந்த மாபெரும் உபத்திரவத்திலிருந்து[a] வெளியே வருகிறவர்கள். இவர்கள் தங்கள் நீண்ட அங்கிகளைக் கழுவி, ஆட்டுக்குட்டியானவரின் இரத்தத்தில்[b] அவற்றை வெண்மையாக்கினார்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மாபெரும் துன்பத்திலிருந்து” அல்லது “மாபெரும் நெருக்கடியிலிருந்து” என்றும் மொழிபெயர்க்கலாம். θλῖψις என்ற கிரேக்கச் சொல் அழுத்தம், துன்பம், நெருக்கடி அல்லது உபத்திரவத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “ஆட்டுக்குட்டியானவரின் இரத்தத்தில்” என்ற சொற்றொடர் நோக்கத்துடன் அப்படியே வைக்கப்பட்டுள்ளது. கிரேக்கத்தை “இரத்தத்தால்” என்ற கருவிப்பொருளிலும் புரிந்துகொள்ளலாம்; ஆனால் இங்குள்ள மொழியாக்கம் வெளிப்படுத்தல் நூலின் முரணான தூய்மைப்படுத்தும் காட்சியைப் பாதுகாக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκα
  choice: என்றேன்
  rationale: வடிவத்தில் நிறைவுக்காலமாக இருந்தாலும், யோவானிய உரையாடல் நடையில் இது கடந்தகால உரையறிமுகமாகச் செயல்படுகிறது; இயல்பான தமிழில் “என்றேன்” பொருத்தமானது.
- source_word: Κύριέ μου
  choice: என் தலைவரே
  rationale: யோவான் இங்கு தேவனையோ மேசியாவையோ அல்ல, பரலோக மூப்பர்களில் ஒருவரை மரியாதையுடன் அழைக்கிறார். “என் தலைவரே” மரியாதையைப் பேணுவதோடு தெய்வீக அடையாளத்தைத் தேவையின்றி உணர்த்துவதில்லை.
- source_word: σὺ οἶδας
  choice: உமக்கே தெரியும்
  rationale: வெளிப்படையாக இடம்பெறும் σὺ தரும் மென்மையான வலியுறுத்தலை “உமக்கே” வெளிப்படுத்துகிறது; மூப்பருக்கான மரியாதையும் காக்கப்படுகிறது.
- source_word: οἱ ἐρχόμενοι
  choice: வெளியே வந்துகொண்டிருப்பவர்கள்
  rationale: நிகழ்காலப் பங்கேற்புவினையின் தொடரும் அல்லது பண்புரீதியான பொருளை எளிய இறந்தகாலமாக மாற்றாமல் காக்கிறது.
- source_word: ἐκ τῆς θλίψεως τῆς μεγάλης
  choice: அந்த மாபெரும் உபத்திரவத்திலிருந்து
  rationale: θλῖψις என்பதன் துன்பம், நெருக்கடி, உபத்திரவம் ஆகிய பொருள் பரப்பில் “உபத்திரவம்” வெளிப்படுத்தல் நூலின் சூழலிலும் தமிழ்க் கிறிஸ்தவ வாசிப்பிலும் அடையாளம் காணத்தக்கது. “அந்த” என்பது கிரேக்கச் சுட்டுத்தன்மையை இயல்பான தமிழில் பிரதிபலிக்கிறது.
- source_word: ἔπλυναν
  choice: கழுவி
  rationale: முடிவுற்ற செயலாக முன்வைக்கப்படும் கழுவுதலைத் தெளிவாகக் குறிக்கிறது; அடுத்த வினையுடன் இயல்பாக இணைகிறது.
- source_word: στολάς
  choice: நீண்ட அங்கிகள்
  rationale: στολή என்பது பொதுவான உடையைவிட நீண்ட, சிறப்புமிக்க மேலங்கியைக் குறிக்கிறது; “நீண்ட அங்கிகள்” அந்தக் காட்சியைத் தெளிவாக்குகிறது.
- source_word: ἐλεύκαναν
  choice: அவற்றை வெண்மையாக்கினார்கள்
  rationale: “வெண்மையாக்குதல்” வினையின் காரணவியல் பொருளை நேரடியாகவும் இயல்பாகவும் காக்கிறது.
- source_word: ἐν τῷ αἵματι
  choice: இரத்தத்தில்
  rationale: ἐν என்பதைக் “இரத்தத்தில்” என்று தக்கவைத்ததால், இரத்தத்தில் கழுவி வெண்மையாக்கும் வெளிப்படுத்தல் நூலின் நோக்கமுள்ள முரணுருவகம் பாதுகாக்கப்படுகிறது.
- source_word: τοῦ ἀρνίου
  choice: ஆட்டுக்குட்டியானவரின்
  rationale: வெளிப்படுத்தல் நூலில் ἀρνίον இயேசுவுக்கான பட்டப்பெயராகப் பயன்படுகிறது. “ஆட்டுக்குட்டியானவர்” அந்தப் பட்டப்பெயரையும் ஆளுமைக் குறிப்பையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: மூப்பரை நோக்கிய κύριος என்ற மரியாதை அழைப்பு
  choice: என் தலைவரே
  alternative: என் ஆண்டவரே; ஐயா
  rationale: “என் ஆண்டவரே” என்பது தேவனையோ கிறிஸ்துவையோ குறிக்கும் வலுவான உணர்வை ஏற்படுத்தலாம்; “ஐயா” உயர்ந்த காட்சியின் மரியாதைத் தொனியைத் தளர்த்தலாம். “என் தலைவரே” இரு சிக்கல்களையும் தவிர்க்கிறது.
- issue: ‘மாபெரும் உபத்திரவம்’ என்பதன் கால மற்றும் இறுதிக்கால அடையாளம்
  choice: அந்த மாபெரும் உபத்திரவம்
  alternative: அந்த மாபெரும் துன்பம்; அந்தப் பெரும் நெருக்கடி
  rationale: இது ஒரு குறிப்பிட்ட இறுதிக்கால நிகழ்வா, விசுவாசிகளின் பொதுவான துன்பமா, அல்லது இரண்டையும் உள்ளடக்குகிறதா என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை; மூலத்தின் இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
- issue: ஆட்டுக்குட்டியானவரின் இரத்தத்தில் வெண்மையாக்குதல்
  choice: இரத்தத்தில்
  alternative: இரத்தத்தால்
  rationale: ἐν என்பதற்கு கருவிப்பொருளில் “இரத்தத்தால்” என்று மொழிபெயர்க்க இயன்றாலும், “இரத்தத்தில்” என்பது மூலத்தின் அதிர்வூட்டும் முரணுருவகத்தை அப்படியே தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், உயர்ந்த காட்சிக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகருக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. மூப்பருக்கான உரையில் மரியாதைப் பன்மை காக்கப்பட்டுள்ளது; இறுதிக்காலக் கோட்பாடு எதுவும் வசனத்தின் மீது திணிக்கப்படவில்லை.
