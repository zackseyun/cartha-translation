id: REV.7.1
reference: Revelation 7:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀Μετὰ τοῦτο εἶδον τέσσαρας ἀγγέλους ἑστῶτας ἐπὶ τὰς τέσσαρας γωνίας τῆς γῆς, κρατοῦντας τοὺς τέσσαρας ἀνέμους τῆς γῆς, ἵνα μὴ πνέῃ ἄνεμος ἐπὶ τῆς γῆς μήτε ἐπὶ τῆς θαλάσσης μήτε ἐπὶ ⸀πᾶν δένδρον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/001.yaml
  text: After this I saw four angels standing at the four corners of the earth[b][a], holding back the four winds of the earth so that no wind might blow on the earth or on the sea or on any tree.
translation:
  language: ta
  text: இதற்குப் பிறகு[a], பூமியின் நான்கு மூலைகளிலும்[b] நின்றுகொண்டிருந்த நான்கு தூதர்களைக் கண்டேன். பூமியின்மீதோ கடலின்மீதோ எந்த மரத்தின்மீதோ காற்று வீசாதபடி, அவர்கள் பூமியின் நான்கு காற்றுகளையும் தடுத்து வைத்திருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் சொற்படியாக: ‘இவற்றுக்குப் பிறகு நான் கண்டேன்.’'
    reason: lexical_alternative
  - marker: b
    text: ‘பூமியின் நான்கு மூலைகள்’ என்பது பூமியின் கடைசி எல்லைகளையோ நான்கு திசைகளையோ குறிக்கும் மரபுவழிச் சொற்றொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: இதற்குப் பிறகு
  rationale: தரிசன நிகழ்வுகளின் தொடர்ச்சியைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொற்றொடர்; கிரேக்கத்தின் காலவரிசைப் பொருளைப் பாதுகாக்கிறது.
- source_word: εἶδον
  choice: கண்டேன்
  rationale: தரிசனத்தில் கண்டதை நேரடியாக அறிவிக்கும் வினை; கிரேக்கத்தில் இல்லாத ‘பார்த்தபோது’ போன்ற விரிவாக்கம் தவிர்க்கப்பட்டது.
- source_word: τέσσαρας ἀγγέλους
  choice: நான்கு தூதர்களை
  rationale: எண்ணும் பெயர்ச்சொல்லும் நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளன; வெளிப்படுத்தின விசேஷத்தின் சூழலில் ἄγγελος என்பதற்கு ‘தூதர்’ பொருத்தமானது.
- source_word: ἑστῶτας
  choice: நின்றுகொண்டிருந்த
  rationale: ἵστημι என்பதன் நிறைநிலைப் பங்கேற்புச் சொல், அவர்கள் நின்ற நிலையில் இருந்ததைச் சுட்டுகிறது; ‘நியமிக்கப்பட்டிருந்த’ என்பது தேவையற்ற விளக்கம்.
- source_word: ἐπὶ τὰς τέσσαρας γωνίας τῆς γῆς
  choice: பூமியின் நான்கு மூலைகளிலும்
  rationale: தரிசனத்தின் மரபுவழிப் படிமத்தைத் தக்கவைக்கிறது; தமிழ் இடவேற்றுமை உருபு இயல்பாகப் பயன்படுத்தப்பட்டுள்ளது.
- source_word: κρατοῦντας
  choice: தடுத்து வைத்திருந்தார்கள்
  rationale: காற்றுகள் வீசாமல் அடக்கிவைத்திருப்பதே சூழல்சார் பொருள்; ‘பிடித்திருந்தார்கள்’ என்பதைவிடத் தமிழில் நோக்கம் தெளிவாகிறது.
- source_word: τοὺς τέσσαρας ἀνέμους τῆς γῆς
  choice: பூமியின் நான்கு காற்றுகளையும்
  rationale: மூலத்தின் வெளிப்படுத்தல் படிமத்தை நேரடியாகத் தக்கவைக்கிறது; ‘நான்கு திசைகளிலிருந்து வரும் காற்றுகள்’ என விளக்கமாக விரிவாக்கப்படவில்லை.
- source_word: ἵνα μὴ πνέῃ ἄνεμος
  choice: காற்று வீசாதபடி
  rationale: ἵνα + subjunctive குறிக்கும் நோக்கம் அல்லது விளைவை இயல்பான தமிழில் தருகிறது; காற்று முற்றிலும் வீசாத நிலையைப் பொதுப்படையாகக் கூறுகிறது.
- source_word: ἐπὶ τῆς γῆς μήτε ἐπὶ τῆς θαλάσσης μήτε ἐπὶ πᾶν δένδρον
  choice: பூமியின்மீதோ கடலின்மீதோ எந்த மரத்தின்மீதோ
  rationale: மூன்று மறுக்கப்பட்ட இடங்களையும் இணையான தமிழ் அமைப்பில் தருகிறது; πᾶν δένδρον என்பதன் பகிர்வுப் பொருள் ‘எந்த மரத்தின்மீதோ’ என வெளிப்படுகிறது.
theological_decisions:
- issue: வெளிப்படுத்தல் தரிசனத்தில் γῆ என்பதன் பரப்பு
  choice: வசனம் முழுவதும் ‘பூமி’ என மொழிபெயர்க்கப்பட்டது.
  alternative: நிலம் / தேசம்
  rationale: நான்கு மூலைகள், நான்கு காற்றுகள், பூமி, கடல், மரங்கள் ஆகியவற்றை உள்ளடக்கிய விரிந்த தரிசனப் பின்னணி உள்ளது; ‘தேசம்’ என்பது பொருளைத் தேவையின்றிக் குறுக்கும்.
- issue: ‘பூமியின் நான்கு மூலைகள்’ என்ற அண்டவியல் மொழியின் தன்மை
  choice: மூலப் படிமம் அப்படியே பாதுகாக்கப்பட்டது.
  alternative: பூமியின் நான்கு எல்லைகள் / நான்கு திசைகள்
  rationale: இது பூமியின் எல்லைகளையோ நான்கு திசைகளையோ குறிக்கும் மரபுவழித் தரிசனச் சொற்றொடர். விளக்க உரையாக மாற்றாமல் படிமத்தைத் தக்கவைத்ததால், அது அறிவியல் வடிவவியல் கூற்றாகத் தவறாகத் தீர்மானிக்கப்படுவதும் தவிர்க்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் வகையிலும் வெளிப்படுத்தல் நூலின் கண்ணியமான தரிசன நடையைப் பாதுகாக்கும் வகையிலும் வடிவமைக்கப்பட்டது. ‘தூதர்கள்’, ‘நான்கு மூலைகள்’, ‘நான்கு காற்றுகள்’ போன்ற முக்கியப் படிமங்கள் விளக்கமாகக் கரைக்கப்படாமல் தக்கவைக்கப்பட்டுள்ளன.
