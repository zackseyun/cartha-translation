id: REV.7.13
reference: Revelation 7:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἀπεκρίθη εἷς ἐκ τῶν πρεσβυτέρων λέγων μοι· Οὗτοι οἱ περιβεβλημένοι τὰς στολὰς τὰς λευκὰς τίνες εἰσὶν καὶ πόθεν ἦλθον;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/013.yaml
  text: Then one of the elders answered[a], saying to me, “These who are clothed in the white robes—who are they, and where have they come from?”
translation:
  language: ta
  text: அப்போது மூப்பர்களில் ஒருவர் என்னிடம், “வெள்ளை அங்கிகளை அணிந்திருக்கும் இவர்கள் யார்? இவர்கள் எங்கிருந்து வந்தார்கள்[a]?” என்று மறுமொழி கூறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவர்கள் எங்கிருந்து வந்திருக்கிறார்கள்?”
    reason: ἦλθον என்ற கிரேக்க இறந்தகாலத்தைத் தரிசனக் காட்சியில் தற்போதைய தொடர்புடைய நிறைவுநிலையாகத் தமிழில் வெளிப்படுத்தும் மாற்று.
lexical_decisions:
- source_word: Καὶ
  choice: அப்போது
  rationale: தரிசன நிகழ்வின் தொடர்ச்சியை இயல்பான நவீன தமிழில் காட்டும் உரையாடல் இணைப்பாகத் தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἀπεκρίθη … λέγων μοι
  choice: என்னிடம் … என்று மறுமொழி கூறினார்
  rationale: உடனடியாக முன் கேள்வி இல்லாவிட்டாலும், கிரேக்கத்தில் உள்ள ‘மறுமொழி கூறுதல்’ என்ற வழக்கை நீக்காமல், λέγων μοι என்பதையும் இயல்பான தமிழ் நேரடிக் கூற்றுடன் இணைக்கிறது.
- source_word: εἷς ἐκ τῶν πρεσβυτέρων
  choice: மூப்பர்களில் ஒருவர்
  rationale: குழுவைச் சேர்ந்த ஒருவரைக் குறிக்கும் பகுதிப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: οἱ περιβεβλημένοι
  choice: அணிந்திருக்கும் இவர்கள்
  rationale: முன்பு அணிவிக்கப்பட்டதன் விளைவாகத் தற்போது அந்த ஆடையில் இருக்கும் நிலையைக் காட்டும் கிரேக்க நிறைவுநிலைப் பங்கேற்புச் சொல்லின் கருத்தைத் தக்கவைக்கிறது.
- source_word: τὰς στολὰς τὰς λευκάς
  choice: வெள்ளை அங்கிகளை
  rationale: στολή குறிக்கும் நீளமான மேலாடைக்கு ‘அங்கி’ என்பது dignified and familiar Tamil equivalent; வெளிப்படுத்துதல் நூலின் வெள்ளை ஆடை உருவகத்தையும் தெளிவாகக் காக்கிறது.
- source_word: τίνες εἰσὶν
  choice: யார்?
  rationale: முன்னரே ‘இவர்கள்’ என்று குறிப்பிடப்பட்டிருப்பதால், தமிழ் கேள்வி அமைப்பில் ‘யார்?’ என்பதே இயல்பானதும் முழுப் பொருளுடையதும் ஆகும்.
- source_word: πόθεν ἦλθον
  choice: இவர்கள் எங்கிருந்து வந்தார்கள்?
  rationale: πόθεν என்பதன் மூலஇடப் பொருளையும் ἦλθον என்பதன் இறந்தகால வடிவையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: ἦλθον என்பதன் காலம்/நிகழ்வுநிலை
  choice: எங்கிருந்து வந்தார்கள்?
  alternative: எங்கிருந்து வந்திருக்கிறார்கள்?
  rationale: கிரேக்க இறந்தகால வினையைத் தமிழ் எளிய இறந்தகாலமாக முதன்மை உரையில் தருகிறது. தரிசனக் காட்சியில் அந்த வருகையின் தற்போதைய விளைவை வலியுறுத்தும் நிறைவுநிலைத் தமிழும் சாத்தியம் என்பதால் அதை அடிக்குறிப்பில் காக்கிறது; இதில் கோட்பாட்டு முடிவு ஏதும் திணிக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் அதேவேளையில் மரியாதையும் தரிசன உரைக்குரிய கண்ணியமும் உள்ள நடை. ‘மறுமொழி கூறினார்’ என்பது கிரேக்கத்தின் சற்றே குறிப்பிடத்தக்க பதிலுரைப் பயன்பாட்டை அழிக்காமல் காக்கிறது.
