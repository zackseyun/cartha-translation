language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὡς κἀγὼ εἴληφα παρὰ τοῦ πατρός μου, καὶ δώσω αὐτῷ τὸν ἀστέρα τὸν πρωϊνόν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/028.yaml
  text: just as I also have received from my Father[a], and I will give him the morning star.
translation:
  language: ta
  text: என் தந்தையிடமிருந்து நானும் பெற்றிருக்கிறபடியே, அவனுக்குக் காலை நட்சத்திரத்தை[a] கொடுப்பேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விடிவெள்ளி.” இச்சொற்றொடர் மேசிய அரசத் தோற்றப்படிமத்தைச் சுட்டக்கூடும்; மேலும், வெளிப்படுத்தல் 22:16-இல் இயேசு தம்மை “ஒளிவீசும் காலை நட்சத்திரம்” என்று அழைப்பதோடு தொடர்புடையதாகவும் இருக்கலாம்.
    reason: சொல் மாற்றையும் சாத்தியமான வேதாகம உட்தொடர்பையும் குறிப்பிடுகிறது; ஆனால் உருவகத்தின் பொருளைத் தீர்மானித்து விடவில்லை.
lexical_decisions:
- source_word: ὡς κἀγὼ
  choice: நானும் … பெற்றிருப்பதுபோலவே
  rationale: ὡς என்பதன் ஒப்பீட்டையும் κἀγώ என்பதன் ‘நானும்’ என்ற சேர்க்கைப் பொருளையும் இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: εἴληφα
  choice: பெற்றிருக்கிறேன்
  rationale: முன்பு பெற்றதன் விளைவு தொடர்வதைக் குறிக்கும் கிரேக்க நிறைவுக்காலத்தின் நுணுக்கத்தைத் தமிழின் நிறைவுநிலை வடிவம் காக்கிறது; வாக்கிய அமைப்பில் இது ‘பெற்றிருப்பதுபோலவே’ என வருகிறது.
- source_word: παρὰ τοῦ πατρός μου
  choice: என் தந்தையிடமிருந்து
  rationale: παρά + பிறப்புவேற்றுமை குறிக்கும் மூலத்தை ‘இடமிருந்து’ இயல்பாகத் தெரிவிக்கிறது; ‘என் தந்தை’ என்ற உறவுமுறையை விளக்கவுரை சேர்க்காமல் காக்கிறது.
- source_word: καὶ δώσω αὐτῷ
  choice: அவனுக்குக் கொடுப்பேன்
  rationale: எதிர்கால வினையையும் முந்தைய வசனத்தில் வெற்றிபெறுகிறவனைக் குறிக்கும் ஒருமைச் சுட்டையும் நேரடியாகக் காக்கிறது.
- source_word: τὸν ἀστέρα τὸν πρωϊνόν
  choice: காலை நட்சத்திரம்
  rationale: ἀστήρ என்ற ‘நட்சத்திரம்’ என்னும் உருவகத்தையும் πρωϊνός என்ற காலைப்பொழுது சார்ந்த பண்பையும் வெளிப்படையாகக் காக்கும் இயல்பான மொழிபெயர்ப்பு. ‘விடிவெள்ளி’ என்பது செறிவான தமிழ் மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: ‘காலை நட்சத்திரம்’ என்பதன் அடையாளமும் பொருளும்
  choice: முதன்மை உரையில் உருவகத்தை விளக்காமல் ‘காலை நட்சத்திரம்’ என்றே வைத்தல்
  alternative: அரச/மேசிய வெற்றியின் சின்னம்; கிறிஸ்துவையே குறித்தல்; இறுதிக்கால மகிமை அல்லது பரிசைக் குறித்தல்
  rationale: இந்த வசனம் உருவகத்தைத் தானே வரையறுப்பதில்லை. வெளிப்படுத்தின விசேஷம் 22:16-இல் இயேசு தம்மைக் ‘ஒளிவீசும் காலை நட்சத்திரம்’ என அழைப்பது தொடர்புடையதாக இருக்கலாம்; எனினும் அந்த அடையாளத்தை இங்கே தீர்மானமாக உரைக்காமல் பொருள் நெருக்கடியைக் காக்க வேண்டும்.
- issue: ‘என் தந்தையிடமிருந்து’ என்பதில் கிறிஸ்துவுக்கும் தந்தைக்கும் உள்ள உறவு
  choice: கூடுதல் கோட்பாட்டு விளக்கமின்றி உறவையும் பெறுதலையும் நேரடியாக மொழிபெயர்த்தல்
  alternative: ஒப்படைக்கப்பட்ட அதிகாரம் என்று விரித்துரைத்தல்; மீட்புத் திட்டத்தின் உறவாக விளக்குதல்
  rationale: மூலவாசகம் வெளிப்படையாகச் சொல்வதை மட்டும் காத்து, பின்னைய கோட்பாட்டு விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிய புரிதலும் கொண்ட நடை. வசனம் முந்தைய வாக்குறுதியைத் தொடரும் சார்பு அமைப்பாக இருப்பதால் ‘…போலவே’ என்ற இணைப்பு காக்கப்பட்டுள்ளது. ‘அவனுக்கு’ என்பது முந்தைய சூழலிலுள்ள வெற்றிபெறுகிற ஒருமை நபரைத் தொடர்கிறது.
