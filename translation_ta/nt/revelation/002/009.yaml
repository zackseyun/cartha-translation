id: REV.2.9
reference: Revelation 2:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Οἶδά ⸀σου τὴν θλῖψιν καὶ τὴν πτωχείαν, ἀλλὰ πλούσιος εἶ, καὶ τὴν βλασφημίαν ἐκ τῶν λεγόντων Ἰουδαίους εἶναι ἑαυτούς, καὶ οὐκ εἰσίν, ἀλλὰ συναγωγὴ τοῦ Σατανᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/009.yaml
  text: I know your affliction and your poverty—but you are rich—and the slander of those who say that they are Jews and are not[b][a], but are a synagogue of Satan.
translation:
  language: ta
  text: உன் துன்பத்தையும் உன் வறுமையையும் நான் அறிவேன்—ஆனாலும் நீ செல்வந்தன்—தங்களை யூதர்கள் என்று சொல்லிக்கொள்கிறவர்களிடமிருந்து வரும் அவதூறையும் அறிவேன். ஆனால் அவர்கள் யூதர்கள் அல்ல; சாத்தானின் கூட்டம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சாத்தானின் கூட்டம்” என்பது மூலத்தின் நேரடியான, கடுமையான சொற்றொடர். இங்கு συναγωγή என்பதற்கு “கூட்டம்” அல்லது “கூடுகை” என்று பொருள் உண்டு; யூத வழிபாட்டுக் கூடம் என்னும் வரலாற்றுச் சூழலில் “ஜெபஆலயம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: θλῖψιν
  choice: துன்பம்
  rationale: அழுத்தம், இடர், ஒடுக்குதலால் நேரும் வேதனை ஆகியவற்றை இயல்பான நவீன தமிழில் எடுத்துரைக்கிறது; தேவையற்ற இறுதிக்காலத் தொழில்நுட்பப் பொருளைச் சேர்ப்பதில்லை.
- source_word: πτωχείαν
  choice: வறுமை
  rationale: பொருளாதார ஏழ்மையை நேரடியாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: πλούσιος
  choice: செல்வந்தன்
  rationale: வறுமையோடு உள்ள கூர்மையான முரண்பாட்டைக் காக்கிறது; அது ஆவிக்குரிய செல்வம் என்று மூலத்தில் இல்லாத விளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: βλασφημίαν
  choice: அவதூறு
  rationale: இங்கு விசுவாசிகளுக்கு எதிரான பகைமையான பழிப்புரையைக் குறிக்கிறது; நவீன தமிழில் ‘தூஷணம்’ என்பது கடவுளுக்கு எதிரான பேச்சாக மட்டுமே புரிந்துகொள்ளப்படும் அபாயத்தைத் தவிர்க்கிறது.
- source_word: ἐκ τῶν λεγόντων
  choice: சொல்லிக்கொள்கிறவர்களிடமிருந்து வரும்
  rationale: ἐκ குறிக்கும் மூலத்தையும், தங்களைப் பற்றி அவர்கள் முன்வைக்கும் கூற்றையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: Ἰουδαίους εἶναι ἑαυτούς
  choice: தாங்கள் யூதர்கள் என்று சொல்லிக்கொள்கிறவர்கள்
  rationale: Ἰουδαίους என்பதை நேரடியாக ‘யூதர்கள்’ என்று காத்து, ἑαυτούς என்பதன் தற்சுட்டுப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: συναγωγὴ τοῦ Σατανᾶ
  choice: சாத்தானின் ஜெபக்கூட்டத்தைச் சேர்ந்தவர்கள்
  rationale: συναγωγή என்பதன் வரலாற்றுச் சிறப்புடைய யூதக் கூடுகைச் சூழலை ‘ஜெபக்கூட்டம்’ மூலம் காக்கிறது; தமிழில் இயல்பான வாக்கியத்திற்காக அவர்கள் அதனைச் சேர்ந்தவர்கள் என அமைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘தாங்கள் யூதர்கள் என்று சொல்லிக்கொள்கிறவர்கள்; ஆனால் அவர்கள் யூதர்கள் அல்ல’ என்ற விவாதமிக்க கூற்றை எவ்வாறு மொழிபெயர்ப்பது
  choice: ‘யூதர்கள்’ என்பதை நேரடியாகக் காத்து, மூலத்திலுள்ள மறுப்பை அப்படியே விடுதல்
  alternative: ‘தாங்கள் கடவுளின் மக்கள் என்று கூறுகிறவர்கள்’ அல்லது ‘உண்மையான யூதர்கள் அல்ல’
  rationale: Ἰουδαίους என்பது வெளிப்படையாக ‘யூதர்கள்’ என்கிறது. ‘உண்மையான’ என்ற சொல்லையோ இன அடையாளத்தை மறுக்கும் விளக்கத்தையோ சேர்க்காமல், மூலத்தின் இறையியல் பதற்றத்தை மொழிபெயர்ப்பு காக்க வேண்டும்.
- issue: ‘நீ செல்வந்தன்’ என்பது ஆவிக்குரிய செல்வத்தைக் குறிக்கிறது என்பதை வெளிப்படையாக்க வேண்டுமா
  choice: ‘செல்வந்தன்’ என்பதை விளக்கச் சொல்லின்றி விடுதல்
  alternative: ‘ஆவிக்குரிய வகையில் நீ செல்வந்தன்’
  rationale: சூழல் பொருள்சாராத செல்வத்தைக் குறிப்பதாகத் தோன்றினாலும், கிரேக்கம் அதனை வெளிப்படையாகத் தகுதிப்படுத்தவில்லை.
- issue: ‘சாத்தானின் ஜெபக்கூட்டம்’ என்ற உருவகத்தை எவ்வாறு கையாள்வது
  choice: கூர்மையான மூலச் சொல்லைத் தணிக்காமல் காத்தல்
  alternative: ‘சாத்தானுக்குரிய கூட்டம்’
  rationale: τοῦ Σατανᾶ என்ற உடைமை/சார்பு வேற்றுமையின் கடுமையான விவாதத் தன்மையைக் காக்கிறது; அதேவேளை இதை மொழிபெயர்ப்பாளரின் பொதுவான இன அல்லது மதத் தீர்ப்பாக விரிவாக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதைமிக்கதாயினும் சாதாரண வாசகர்களுக்குப் புரியும் நடை. ஒருமை இரண்டாம் நபருக்கு ‘உன்/நீ’ பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்கத் தொடரை தமிழின் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரித்தும், ‘அறிவேன்’ என்பதன் ஆட்சியை இரண்டாவது பொருளுடன் மீண்டும் வெளிப்படுத்தியும் உள்ளோம். முதன்மை உரையிலுள்ள [a] குறி அடிக்குறிப்புடன் பொருந்துகிறது.
