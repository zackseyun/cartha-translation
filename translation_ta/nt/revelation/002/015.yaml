base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/015.yaml
  text: So you also have those who hold to the teaching of the Nicolaitans likewise[a].
translation:
  language: ta
  text: இவ்வாறே, நீயும்கூட நிக்கொலாயர்களின் போதனையைப் பற்றிக்கொண்டிருப்பவர்களை உன்னிடையே கொண்டிருக்கிறாய்; அதேபோல்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அதேபோல்’ என்பதை ‘அவ்வாறே’ அல்லது ‘ஒத்த விதத்தில்’ என்றும் மொழிபெயர்க்கலாம். முந்தைய வசனத்தில் குறிப்பிடப்பட்டவர்களைப் போல, இவர்கள் இந்தப் போதனையைப் பற்றிக்கொண்டிருக்கிறார்கள் என்பதை கிரேக்கச் சொல் வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: அப்படியே
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட நிலைமையுடன் ஒப்பிட்டு இந்தக் கண்டனத்தைத் தொடர்கிறது; நவீன தமிழில் இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: ἔχεις
  choice: உன்னிடையே கொண்டிருக்கிறாய்
  rationale: வினைச்சொல்லின் ‘கொண்டிருத்தல்’ என்ற நேரடிப் பொருளைத் தக்கவைத்தபடியே, இவர்கள் சபையாரின் நடுவில் இருக்கிறார்கள் என்ற சூழல்சார் பொருளைத் தெளிவாக்குகிறது.
- source_word: καὶ σὺ
  choice: நீயும்கூட
  rationale: ‘நீயும்’ என்ற ஒப்பீட்டையும் அதிலுள்ள வலியுறுத்தலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: κρατοῦντας
  choice: பற்றிக்கொண்டிருப்பவர்களை
  rationale: ஒரு போதனையை விடாமல் கடைப்பிடித்தல் அல்லது அதில் நிலைத்திருத்தல் என்ற கருத்தை வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத கூடுதல் தீவிரத்தைச் சேர்க்கவில்லை.
- source_word: διδαχὴν
  choice: போதனையை
  rationale: மதச்சூழலிலும் பொதுவழக்கிலும் புரியக்கூடிய இயல்பான சொல்; அளவுக்கு மீறிய தொழில்நுட்பத் தன்மையைத் தவிர்க்கிறது.
- source_word: Νικολαϊτῶν
  choice: நிக்கொலாயர்களின்
  rationale: குழுவின் பெயரை நவீன தமிழில் தெளிவாக ஒலிபெயர்த்து, கிரேக்க உரையின் உடைமைத் தொடர்பைத் தக்கவைக்கிறது.
- source_word: ὁμοίως
  choice: அதேபோல்
  rationale: ‘அவ்வாறே,’ ‘ஒத்த விதத்தில்’ என்ற ஒப்பீட்டுப் பொருளைத் தருகிறது; இது போதனையைப் பற்றிக்கொண்டிருக்கும் விதத்தையோ முந்தைய வசனத்துடனான விரிந்த ஒப்பீட்டையோ குறிக்கலாம்.
theological_decisions:
- issue: ὁμοίως (‘அதேபோல்’) எதனுடன் இலக்கண ரீதியாக இணைகிறது
  choice: ‘பற்றிக்கொண்டிருப்பவர்களை’ என்பதற்கு முன் ‘அதேபோல்’ என அமைத்து, அதே நேரத்தில் முந்தைய வசனத்துடனான ஒப்பீடும் கேட்கும்படி மொழிபெயர்த்தல்
  alternative: ‘அதேபோலவே, நீயும்கூட நிக்கொலாயர்களின் போதனையைப் பற்றிக்கொண்டிருப்பவர்களை உன்னிடையே கொண்டிருக்கிறாய்’
  rationale: கிரேக்கத்தில் இந்த வினையடை போதனையைப் பற்றிக்கொள்ளும் விதத்தை நேரடியாகக் குறிக்கிறதா, அல்லது முந்தைய வசனத்தில் கூறப்பட்ட நிலைமையுடன் முழு வாக்கியத்தையும் ஒப்பிடுகிறதா என்பது ஓரளவு தெளிவற்றது. முதன்மை உரையும் அடிக்குறிப்பும் இந்தத் தெளிவின்மையைத் தீர்த்துவிடாமல் பாதுகாக்கின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியான கண்டனத் தொனியும் மூலத்தின் ஒப்பீட்டு வலியுறுத்தலும் காக்கப்பட்டுள்ளன. ‘அப்படியே’ மற்றும் ‘அதேபோல்’ ஆகிய இரண்டும் கிரேக்கத்தில் உள்ள οὕτως மற்றும் ὁμοίως என்ற இரு ஒப்பீட்டுச் சொற்களையும் தனித்தனியாக பிரதிபலிக்கின்றன; சிறிய மீளுரைத்தல் மூலத்திலும் இருப்பதால் அது நீக்கப்படவில்லை.
