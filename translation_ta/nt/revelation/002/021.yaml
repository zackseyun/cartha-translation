source:
  edition: SBLGNT
  text: καὶ ἔδωκα αὐτῇ χρόνον ἵνα μετανοήσῃ, καὶ οὐ θέλει μετανοῆσαι ἐκ τῆς πορνείας αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/021.yaml
  text: And I gave her time to repent[a], but she is not willing to repent of her sexual immorality.
translation:
  language: ta
  text: அவள் மனந்திரும்புவதற்கு நான் அவளுக்குக் காலம் கொடுத்தேன்; ஆனால் அவள் தன் பாலியல் ஒழுக்கக்கேட்டிலிருந்து மனந்திரும்ப விரும்பவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, தமிழ் வழக்கில்: “தன் பாலியல் ஒழுக்கக்கேட்டுக்காக மனந்திரும்ப விரும்பவில்லை.” கிரேக்கத்தில் சொல்லர்த்தமாக “தன் பாலியல் ஒழுக்கக்கேட்டிலிருந்து மனந்திரும்ப” என்று உள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκα
  choice: கொடுத்தேன்
  rationale: இறந்தகாலச் செயலைக் குறிக்கும் கிரேக்க aorist வினையை இச்சூழலில் இயல்பான எளிய இறந்தகாலமாக வழங்குகிறது.
- source_word: αὐτῇ
  choice: அவளுக்கு
  rationale: முந்தைய சூழலில் யேசபேல் என்று அழைக்கப்படும் பெண்ணைக் குறிக்கும் பெண்பால் ஒருமை வேற்றுமையைத் தமிழில் இயல்பான மறைமுகச் செயப்படுபொருளாக வழங்குகிறது.
- source_word: χρόνον
  choice: காலம்
  rationale: மனந்திரும்புவதற்காக வழங்கப்பட்ட ஒரு கால அளவை இயல்பாகவும் துல்லியமாகவும் குறிக்கிறது.
- source_word: ἵνα μετανοήσῃ
  choice: மனந்திரும்புவதற்கு
  rationale: ἵνα உடன் வரும் subjunctive வெளிப்படுத்தும் நோக்கத்தை, ‘காலம் கொடுத்தேன்’ என்பதுடன் இயல்பான தமிழ் நோக்க அமைப்பாக இணைக்கிறது.
- source_word: οὐ θέλει
  choice: விரும்பவில்லை
  rationale: θέλω என்பதிலுள்ள மனவிருப்பமின்மையைத் தெளிவாகக் காட்டுகிறது; ‘மறுத்துவிட்டாள்’ என்று வலுப்படுத்தி விளக்குவதைத் தவிர்க்கிறது.
- source_word: μετανοῆσαι
  choice: மனந்திரும்ப
  rationale: θέλει என்பதுடன் இணையும் infinitive-ஐ வழங்கி, கிரேக்கத்தில் மீண்டும் வரும் ‘மனந்திரும்புதல்’ என்ற வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: ἐκ τῆς πορνείας αὐτῆς
  choice: தன் பாலியல் ஒழுக்கக்கேட்டிலிருந்து
  rationale: πορνεία என்பதன் பாலியல் சார்ந்த குறிப்பைத் தக்கவைக்கிறது; ἐκ என்பதன் ‘இலிருந்து/விட்டு விலகுதல்’ என்ற திசை உணர்வையும் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: வெளிப்படுத்தின விசேஷத்தின் கண்டனச் சூழலில் πορνεία என்பதன் பொருள்
  choice: பாலியல் ஒழுக்கக்கேடு
  alternative: ஒழுக்கக்கேடு; வேசித்தனம்; உருவகமாக விக்கிரக வழிபாட்டுத் துரோகம்
  rationale: இச்சொல்லின் அடிப்படை பாலியல் பொருளை முதன்மை உரையில் காக்கிறது; அதேவேளை தீர்க்கதரிசன/அபோகலிப்டிக் சூழல் தரக்கூடிய உருவக அல்லது விக்கிரக வழிபாட்டுச் சாயலை மொழிபெயர்ப்பே தீர்மானித்துவிடாமல் திறந்துவைக்கிறது.
- issue: μετανοέω உடன் ἐκ பயன்படுத்தப்பட்டிருப்பதன் நுணுக்கம்
  choice: ‘ஒழுக்கக்கேட்டிலிருந்து மனந்திரும்ப’ என்று திசை/விலகுதல் உணர்வைப் பாதுகாத்தல்
  alternative: ‘ஒழுக்கக்கேட்டுக்காக மனந்திரும்ப’ அல்லது ‘ஒழுக்கக்கேட்டைப் பற்றி மனந்திரும்ப’
  rationale: மனந்திரும்புதல் என்பது அந்த நடத்தையிலிருந்து விலகுவதையும் குறிக்கிறது என்ற மூலமொழி அமைப்பைத் தமிழில் இயல்பாகப் பிரதிபலிக்கிறது; மனவருத்தம் மட்டுமே என்ற குறுகிய பொருளைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் எளிமையான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘மனந்திரும்பு’ என்பது வேதாகமப் பயன்பாட்டில் பரிச்சயமானதும் μετάνοια சொல்லின் கருத்தைச் சுருக்கமாகத் தருவதுமாகும். ‘பாலியல் ஒழுக்கக்கேடு’ என்பது இன்றைய வாசகர்களுக்குப் புரியும் வகையில் πορνεία என்பதன் குறிப்பைத் தக்கவைக்கிறது.
