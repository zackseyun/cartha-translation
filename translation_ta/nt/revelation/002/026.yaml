  text: καὶ ὁ νικῶν καὶ ὁ τηρῶν ἄχρι τέλους τὰ ἔργα μου, δώσω αὐτῷ ἐξουσίαν ἐπὶ τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/026.yaml
  text: And to the one who conquers and keeps my works until the end[a], I will give authority over the nations[c][b],
translation:
  language: ta
  text: வெற்றிகொள்கிறவனும் முடிவுவரை என் செயல்களைக்[a] கடைப்பிடிக்கிறவனுமாகியவனுக்கு[b] தேசங்களின்மேல் அதிகாரம் கொடுப்பேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என் செயல்கள்’ என்பது இயேசுவுக்குரிய செயல்களையோ, அவருடைய நோக்கங்களுக்கு ஏற்ற செயல்களையோ, அவர் செய்யும்படி கோரும் செயல்களையோ குறிக்கலாம்; கிரேக்கத்தில் இந்தத் தொடர்பு இன்னும் துல்லியமாகக் குறிப்பிடப்படவில்லை.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் ‘வெற்றிகொள்கிறவன் ... அவனுக்குக் கொடுப்பேன்’ என ஒருமை ஆண்பால் வடிவங்கள் உள்ளன; இங்கு அவை பிரதிநிதித்துவப் பொருளில் பயன்படுத்தப்பட்டுள்ளன.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ νικῶν
  choice: வெற்றிபெற்று ... கடைப்பிடிக்கிறவன்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புவினை, தொடர்ந்து வெற்றிகொள்கிற தன்மையுடைய நபரைக் குறிக்கிறது. ‘வெற்றிபெற்று’ என்பது வெளிப்படுத்தின விசேஷத்தில் காணப்படும் போராட்டப் படிமத்தைத் தக்கவைக்கிறது.
- source_word: ὁ τηρῶν
  choice: கடைப்பிடிக்கிறவன்
  rationale: τηρέω என்பதன் காத்தல், கடைப்பிடித்தல், அனுசரித்தல் ஆகிய பொருள்களில், இங்கு உண்மையுடன் தொடர்ந்து செயல்படுவதை இயல்பான தமிழில் ‘கடைப்பிடிக்கிறவன்’ தெரிவிக்கிறது.
- source_word: ἄχρι τέλους
  choice: முடிவுவரை
  rationale: தொடர்ச்சியும் இறுதி எல்லையும் கொண்ட நேரக் குறிப்பைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: τὰ ἔργα μου
  choice: என் செயல்கள்
  rationale: கிரேக்கத்தின் உடைமைத் தொடர்பைத் திட்டவட்டமாக விரித்துரைக்காமல் தக்கவைக்கிறது; இது இயேசுவுக்குரிய செயல்களையோ, அவருடைய செயல்முறைக்கு ஏற்ற செயல்களையோ, அவர் கோரும் செயல்களையோ குறிக்கலாம்.
- source_word: δώσω αὐτῷ
  choice: அவனுக்கு ... கொடுப்பேன்
  rationale: கிரேக்கத்தில் உள்ள ஒருமை ஆண்பால் மறைமுகச் செயப்படுபொருளைத் தக்கவைக்கிறது; தமிழில் இயல்பான வாக்கிய ஒழுங்கில் முன்வைக்கப்பட்டுள்ளது.
- source_word: ἐξουσίαν
  choice: அதிகாரம்
  rationale: வெறும் வல்லமையைவிட ஆளும் உரிமையையும் ஒப்படைக்கப்பட்ட அதிகாரத்தையும் துல்லியமாகக் குறிக்கிறது.
- source_word: ἐπὶ τῶν ἐθνῶν
  choice: தேசங்கள்மேல்
  rationale: ἐπί + உரிமை வேற்றுமை இங்கு ஆட்சி அல்லது அதிகாரத்தின் பொருளைக் கொண்டுள்ளது; ἔθνη என்பது யூதரல்லாதவர்களை மட்டும் அல்லாமல் உலகத் தேசங்களைக் குறிக்கிறது.
theological_decisions:
- issue: ஒருமை ஆண்பால் பிரதிநிதித்துவ மொழி
  choice: ‘கடைப்பிடிக்கிறவனுக்கு’ என்ற ஒருமை ஆண்பால் வடிவத்தை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘கடைப்பிடிக்கும் நபருக்கு’ அல்லது பன்மை வடிவம்
  rationale: கிரேக்கம் ஒருமை ஆண்பால் பங்கேற்புவினைகளையும் αὐτῷ என்ற ஒருமை ஆண்பால் சுட்டுப்பெயரையும் பயன்படுத்துகிறது. இது ஆண்களுக்கு மட்டும் உரியதாக இல்லாமல் பிரதிநிதித்துவப் பயன்பாடாக இருந்தாலும், மூலத்தின் இலக்கண வடிவத்தைத் தக்கவைக்கிறது.
- issue: ‘என் செயல்கள்’ என்பதன் தொடர்பு
  choice: உடைமைத் தொடர்பை ‘என் செயல்கள்’ என்று திறந்த நிலையில் வைத்தல்
  alternative: ‘நான் கட்டளையிட்ட செயல்கள்’ அல்லது ‘எனக்காகச் செய்யும் செயல்கள்’
  rationale: மூலவாக்கியம் அந்தச் செயல்கள் இயேசுவுக்குரியவை என்பதற்கு அப்பால் தொடர்பைத் துல்லியப்படுத்தவில்லை. குறுகிய கோட்பாட்டு விளக்கத்தை உரைக்குள் சேர்க்காமல் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘ஜெயங்கொள்ளுகிறவன்’ போன்ற மரபுச் சபைநடைச் சொல்லுக்குப் பதிலாக பொதுவாகப் புரியும் ‘வெற்றிபெற்று’ தேர்ந்தெடுக்கப்பட்டது. ‘என் செயல்கள்’ என்ற திட்டமிட்ட திறந்த பொருள் தக்கவைக்கப்பட்டுள்ளது; வாக்கியம் தமிழில் இயல்பாக அமைய மறைமுகச் செயப்படுபொருள் முன்வைக்கப்பட்டுள்ளது.
