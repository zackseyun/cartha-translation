  text: καὶ ποιμανεῖ αὐτοὺς ἐν ῥάβδῳ σιδηρᾷ ὡς τὰ σκεύη τὰ κεραμικὰ ⸀συντρίβεται,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/027.yaml
  text: and he will shepherd them with an iron rod[a], as clay vessels are shattered[b],
translation:
  language: ta
  text: அவன் அவர்களை இரும்புக் கோலால் மேய்ப்பான்[a], மண்பாண்டங்கள் நொறுக்கப்படுவதுபோல்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் அவர்களை இரும்புக் கோலால் அரசாளுவான்.” இங்குள்ள வினைச்சொல் நேரடியாக “மேய்த்தல்” என்று பொருள்படும்; சங்கீதம் 2-ஐ நினைவூட்டும் இச்சூழலில் அரச அதிகாரத்தோடு ஆளுதல் என்ற பொருளையும் கொண்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: இது சங்கீதம் 2:9-ஐ நினைவூட்டுகிறது; அங்கே நாடுகள் மண்பாண்டங்களைப்போல் உடைக்கப்படுகின்றன.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: அவன்
  rationale: இவ்வசனம் முந்தைய வாக்கியத்தின் தொடர்ச்சி. தனியாக மேற்கோளிடப்படும்போது இயல்பான தமிழுக்காக எழுவாய் வெளிப்படையாகக் கொடுக்கப்பட்டுள்ளது; கிரேக்கத்தில் உள்ள இணைப்பை அரைப்புள்ளி வழியாக வாக்கியத் தொடர்ச்சி காட்டுகிறது.
- source_word: ποιμανεῖ
  choice: மேய்ப்பான்
  rationale: ποιμαίνω என்பதன் அடிப்படை மேய்ப்பர் உருவகத்தைப் பாதுகாக்கிறது. சங்கீதம் 2 சார்ந்த சூழலில் அரசாளுதல் மற்றும் அதிகாரம் என்ற பொருள்களும் உடனிருக்கின்றன.
- source_word: αὐτοὺς
  choice: அவர்களை
  rationale: மனிதர்களைக் குறிக்கும் பன்மை நேர்ச்செயப்படுபொருளுக்கு இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: இரும்புக் கோலால்
  rationale: கருவியைக் குறிக்கும் ἐν என்பதற்கு ‘-ஆல்’ இயல்பானது. கோல் என்பது மேய்ப்புக் கோல், அரசதிகாரக் கோல், தண்டிக்கும் கோல் ஆகிய ஒலிப்புகளைத் தக்கவைக்கிறது.
- source_word: ὡς τὰ σκεύη τὰ κεραμικὰ
  choice: குயவனின் மண்பாண்டங்கள் ... போல்
  rationale: κεραμικά என்பது குயவர் செய்த மண்/மட்பாண்டங்களைக் குறிக்கிறது. ‘மண்பாண்டங்கள்’ சாதாரண வாசகருக்கு தெளிவாகவும் உடையக்கூடிய தன்மையை வெளிப்படுத்துவதாகவும் உள்ளது.
- source_word: συντρίβεται
  choice: நொறுக்கப்படுவார்கள்
  rationale: சொல் வன்மையாகத் துண்டுதுண்டாக்கப்படுவதை உணர்த்துகிறது. நடுநிலைப் பன்மை எழுவாயுடன் ஒருமை வினை வரும் கிரேக்க மரபைத் தமிழில் இயல்பான பன்மையாகவும், உவமையின் பொருள் மக்களே என்பதை வெளிப்படுத்தவும் மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: ποιμανεῖ மற்றும் இரும்புக் கோல் உருவகத்தில் உள்ள மேய்த்தல்–அரசாளுதல் பதற்றம்
  choice: முதன்மை உரையில் ‘மேய்ப்பான்’ என்று உருவகத்தைப் பாதுகாத்தல்
  alternative: ‘அரசாளுவான்’ அல்லது ‘ஆளுவான்’
  rationale: கிரேக்கச் சொல் பொதுவான ‘ஆளுதல்’ வினை அல்ல; அது நேரடியாக மேய்த்தலைக் குறிக்கிறது. சங்கீதம் 2 ஒலிப்பினால் அரச மற்றும் நீதித்தீர்ப்பு அதிகாரமும் உள்ளது. ஆகவே இரு பரிமாணங்களையும் ஒன்றாக வைத்திருக்கிறது.
- issue: மண்பாண்டங்கள் நொறுக்கப்படுதல் யாருக்குப் பொருந்துகிறது
  choice: ‘அவர்கள் நொறுக்கப்படுவார்கள்’ என்று உவமையின் பயன்பாட்டை வெளிப்படுத்துதல்
  alternative: ‘மண்பாண்டங்கள் நொறுக்கப்படுவதுபோல்’ என்று மட்டும் முடித்து பொருளை மறைமுகமாக விடுதல்
  rationale: கிரேக்க வாக்கிய அமைப்பு மண்பாண்டங்களை இலக்கண எழுவாயாகக் கொண்டிருந்தாலும், ஒப்புமை αὐτούς எனும் மக்களின் நொறுக்கப்படுதலைத் தெரிவிக்கிறது. தமிழ் வாக்கியம் தனித்து நிற்கும்போது இதை வெளிப்படுத்துவது தெளிவையும் சங்கீதம் 2:9 சார்ந்த நீதித்தீர்ப்பு வலிமையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மேய்ப்பான்’ என்ற வேதாகம உருவகம் இயல்பாகத் தக்கவைக்கப்பட்டு, ‘இரும்புக் கோல்’ அதிகாரத்தையும் வன்மையான நீதித்தீர்ப்பையும் உணர்த்துகிறது. [a], [b] குறிகள் முதன்மை உரையில் இடம்பெற்றுள்ளன.
