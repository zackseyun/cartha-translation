revisions:
- from: 'ஆனால் தியத்தீராவில் உள்ள மற்றவர்களாகிய உங்களிடம்—இந்தப் போதனையை ஏற்றுக்கொள்ளாதவர்களும், அவர்கள் சொல்வதுபோல் சாத்தானின் ஆழமான காரியங்களை[a] அறியாதவர்களுமான அனைவரிடமும்—நான் சொல்கிறேன்: உங்கள் மேல் வேறு எந்தச் சுமையையும் நான் சுமத்தமாட்டேன்.'
  to: 'ஆனால் தியத்தீராவில் உள்ள உங்களில் மற்றவர்களிடம் நான் சொல்கிறேன்: இந்தப் போதனையை ஏற்றுக்கொள்ளாதவர்களும், அவர்கள் அழைப்பதுபோல் சாத்தானின் ஆழமான காரியங்களை[a] அறியாதவர்களுமான உங்கள்மேல் வேறு எந்தச் சுமையையும் நான் சுமத்தமாட்டேன்.'
  rationale: The revision removes redundant recipient phrasing, represents τοῖς λοιποῖς as ‘உங்களில் மற்றவர்கள்,’ and retains the descriptive scope of ὅσοι. It preserves the source’s reported/ironic ambiguity in ὡς λέγουσιν and revises the footnote so that it informs without settling a disputed interpretive question.
