id: REV.2.24
reference: Revelation 2:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὑμῖν δὲ λέγω τοῖς λοιποῖς τοῖς ἐν Θυατείροις, ὅσοι οὐκ ἔχουσιν τὴν διδαχὴν ταύτην, οἵτινες οὐκ ἔγνωσαν τὰ βαθέα τοῦ Σατανᾶ, ὡς λέγουσιν, οὐ βάλλω ἐφ’ ὑμᾶς ἄλλο βάρος·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/024.yaml
  text: 'But to the rest of you in Thyatira I say: all who do not hold this teaching[a], who have not known the deep things of Satan, as they call them—I am not laying any other burden on you.'
translation:
  language: ta
  text: 'ஆனால் தியத்தீராவில் உள்ள உங்களில் மற்றவர்களிடம் நான் சொல்கிறேன்: இந்தப் போதனையை ஏற்றுக்கொள்ளாதவர்களும், அவர்கள் அழைப்பதுபோல் சாத்தானின் ஆழமான காரியங்களை[a] அறியாதவர்களுமான உங்கள்மேல் வேறு எந்தச் சுமையையும் நான் சுமத்தமாட்டேன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சாத்தானின் ஆழங்கள்.” இந்தக் கிரேக்கச் சொற்றொடர், ‘ஆழமான’ ஆன்மிக அறிவு பற்றிய ஒரு கூற்றை எதிரொலிக்கக்கூடும்; ‘அவர்கள்’ யாரைக் குறிக்கிறது அல்லது முழுச் சொற்றொடரின் நையாண்டித் தன்மை எவ்வாறு புரிந்துகொள்ளப்பட வேண்டும் என்பது தெளிவாகத் தீர்மானிக்கப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς λοιποῖς
  choice: மற்றவர்களாகிய உங்களிடம்
  rationale: யேசபேலின் போதனையைப் பின்பற்றுவோரிலிருந்து வேறுபட்டுத் தியத்தீரா சபையில் மீதமுள்ளவர்களைக் குறிக்கிறது; தமிழில் உரையாடல் இயல்புடன் அந்த வேறுபாட்டைப் பேணுகிறது.
- source_word: ἐν Θυατείροις
  choice: தியத்தீராவில்
  rationale: இடப்பெயர் நவீனத் தமிழ் வேதாகம மரபுக்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἔχουσιν τὴν διδαχὴν ταύτην
  choice: இந்தப் போதனையை ஏற்றுக்கொள்ளாதவர்கள்
  rationale: ἔχω என்பது இங்கு ஒரு போதனையைத் தமதாக்கி அதில் நிலைத்திருப்பதைக் குறிக்கிறது. சொற்சொல் மொழிபெயர்ப்பான ‘வைத்திராதவர்கள்’ என்பதைவிட ‘ஏற்றுக்கொள்ளாதவர்கள்’ இந்தப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: οἵτινες οὐκ ἔγνωσαν
  choice: அறியாதவர்கள்
  rationale: குறிப்பிட்ட ஆழமான காரியங்களை அறிவிலோ அனுபவத்திலோ அறிந்திராத நிலையைச் சுருக்கமாகக் காட்டுகிறது; அனுபவித்தல் என்ற பொருளை மட்டும் திணிக்கவில்லை.
- source_word: τὰ βαθέα τοῦ Σατανᾶ
  choice: சாத்தானின் ஆழமான காரியங்கள்
  rationale: βαθέα என்பதன் ‘ஆழமானவை/ஆழங்கள்’ என்ற உருவகத்தைப் பேணி, ஆழ்ந்த ஆன்மிக அறிவு குறித்திருக்கக்கூடிய கூற்றின் நையாண்டித் தொனியையும் திறந்தவாறே வைக்கிறது.
- source_word: ὡς λέγουσιν
  choice: அவர்கள் சொல்வதுபோல்
  rationale: கிரேக்கத்தின் சுருக்கமான, தெளிவாகத் தீர்மானிக்க முடியாத மேற்கோள் தொனியைப் பேணுகிறது; யார் எந்தத் துல்லியமான சொற்றொடரைப் பயன்படுத்தினர் என்பதை உரை கடந்துத் தீர்மானிக்கவில்லை.
- source_word: οὐ βάλλω ἐφ’ ὑμᾶς ἄλλο βάρος
  choice: உங்கள் மேல் வேறு எந்தச் சுமையையும் நான் சுமத்தமாட்டேன்
  rationale: βάλλω ἐπί என்ற மரபுத்தொடரின் ‘மேல் சுமத்துதல்’ என்ற பொருளையும் βάρος என்பதன் ‘சுமை’ உருவகத்தையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: ‘அவர்கள் சொல்வதுபோல் சாத்தானின் ஆழமான காரியங்கள்’ என்பதன் சுட்டும் பொருளும் நையாண்டித் தன்மையும்
  choice: இதை அறிக்கையிடப்பட்ட அல்லது நையாண்டியான பெயரிடலாக நேரடியாக மொழிபெயர்த்து, துல்லியமான பேச்சாளர் நோக்கத்தைத் தீர்மானிக்காமல் விடுதல்
  alternative: பொய்ப் போதகர்கள் தங்கள் அறிவை ‘ஆழமான காரியங்கள்’ என்று அழைத்தார்கள்; யோவான் அவற்றின் உண்மையான மூலத்தைச் சாத்தான் என்று அடையாளப்படுத்துகிறார்; அல்லது முழுச் சொற்றொடருமே யோவானின் நையாண்டிப் பெயர்
  rationale: கிரேக்கம் சுருக்கமானதும் விவாதத் தொனி கொண்டதுமாக உள்ளது. மொழிபெயர்ப்பு ஒரு குறிப்பிட்ட விளக்கத்தைத் திணிக்காமல் அதன் இறையியல் பதற்றத்தையும் சொல்லாட்சியின் இருபொருள் வாய்ப்பையும் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீளமான கிரேக்க வாக்கியத்தின் இடைச்செருகலைக் கோடுகளால் தெளிவுபடுத்தி, இறுதியில் வரும் முதன்மைக் கூற்றின் வலிமை காக்கப்பட்டுள்ளது.
