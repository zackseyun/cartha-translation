reference: Revelation 2:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ τὰ τέκνα αὐτῆς ἀποκτενῶ ἐν θανάτῳ· καὶ γνώσονται πᾶσαι αἱ ἐκκλησίαι ὅτι ἐγώ εἰμι ὁ ἐραυνῶν νεφροὺς καὶ καρδίας, καὶ δώσω ὑμῖν ἑκάστῳ κατὰ τὰ ἔργα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/023.yaml
  text: And I will kill her children with death[a], and all the churches will know that I am the one who searches hearts and minds[b], and I will give to each of you according to your works.
translation:
  language: ta
  text: அவளுடைய பிள்ளைகளை மரணத்தால் கொல்வேன்[a]; உள்ளங்களையும் இதயங்களையும் ஆராய்கிறவர் நானே என்பதை எல்லாத் திருச்சபைகளும் அறிந்துகொள்ளும்[b]. உங்கள் ஒவ்வொருவருக்கும் உங்கள் செயல்களுக்கு ஏற்பக் கொடுப்பேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கொள்ளைநோயால்’. கிரேக்கத்தில் சொற்பட ‘மரணத்தால்’ என்று உள்ளது. இது தீர்ப்பின் கடுமையை வலியுறுத்தும் சொல்லாட்சியாகவோ, பழைய ஏற்பாட்டின் நியாயத்தீர்ப்பு மொழியின் எதிரொலியாகவோ இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொற்பட, ‘சிறுநீரகங்களையும் இதயங்களையும்’. இது நோக்கங்கள், சிந்தனைகள், விருப்பங்கள் உட்பட மனிதனின் உள்ளார்ந்த இயல்பைக் குறிக்கும் வேதாகமச் சொல்லாட்சி.
    reason: cultural_note
lexical_decisions:
- source_word: τέκνα
  choice: பிள்ளைகள்
  rationale: இச்சொல் இயல்பாகப் பிள்ளைகள் அல்லது சந்ததியினரைக் குறிக்கிறது. இங்கு நேரடியான பிள்ளைகளா, உருவகமாகப் பின்பற்றுகிறவர்களா என்பதைத் தீர்மானிக்காமல் ‘பிள்ளைகள்’ என வைத்துள்ளது.
- source_word: ἀποκτενῶ
  choice: கொன்றுபோடுவேன்
  rationale: கொல்லுதல் என்ற நேரடியான பொருளையும் வரவிருக்கும் நியாயத்தீர்ப்பின் கடுமையையும் இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ἐν θανάτῳ
  choice: மரணத்தால்
  rationale: கிரேக்கத்தின் ‘மரணத்தால்’ என்ற அசாதாரணமான சொல்லாட்சியையும் பழைய ஏற்பாட்டு நியாயத்தீர்ப்பு எதிரொலியையும் பாதுகாக்கிறது; ‘கொள்ளைநோயால்’ என்பது சாத்தியமான விளக்கம் மட்டுமே.
- source_word: γνώσονται
  choice: அறிந்துகொள்ளும்
  rationale: நியாயத்தீர்ப்பின் விளைவாக எல்லாத் திருச்சபைகளும் உணர்ந்து அறியும் என்ற வருங்காலப் பொருளை வெளிப்படுத்துகிறது.
- source_word: ἐκκλησίαι
  choice: திருச்சபைகள்
  rationale: வெளிப்படுத்தலில் முகவரியாக உள்ள கிறிஸ்தவச் சபைகளைக் குறிக்கும் நிலையான, கண்ணியமான தமிழ் சொல்.
- source_word: ὁ ἐραυνῶν
  choice: ஆராய்கிறவர்
  rationale: தொடர்ந்து உள்ளார்ந்தவற்றைத் துருவி ஆராயும் நீதிபதித் தன்மையைப் பெயரெச்ச வடிவில் பாதுகாக்கிறது.
- source_word: νεφροὺς
  choice: உள்ளங்கள்
  rationale: சொற்பொருள் ‘சிறுநீரகங்கள்’; வேதாகம வழக்கில் மறைந்த உணர்வுகள், நோக்கங்கள் உள்ளிட்ட உள்ளார்ந்த மனிதனைச் சுட்டுகிறது. நேரடிச் சொல் நவீன தமிழில் பொருளை மறைக்கும் என்பதால் ‘உள்ளங்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: καρδίας
  choice: இதயங்கள்
  rationale: சிந்தனை, விருப்பம், நோக்கம் ஆகியவற்றின் மையத்தைச் சுட்டும் வேதாகம உருவகத்தைப் பாதுகாக்கிறது.
- source_word: δώσω
  choice: கொடுப்பேன்
  rationale: கிரேக்கத்தின் அடிப்படைப் பொருளைத் தக்கவைத்து, ‘செயல்களுக்கு ஏற்ப’ என்ற தொடரே கைம்மாறு அல்லது தீர்ப்பின் கருத்தை வெளிப்படுத்த அனுமதிக்கிறது.
- source_word: ἑκάστῳ
  choice: உங்கள் ஒவ்வொருவருக்கும்
  rationale: ὑμῖν என்பதுடன் சேர்ந்த பகிர்ந்தளிக்கும் ஒருமைப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: κατὰ τὰ ἔργα ὑμῶν
  choice: உங்கள் செயல்களுக்கு ஏற்ப
  rationale: ἔργα என்பதன் செய்கைகள்/செயல்கள் என்ற பொருளையும் நியாயத்தீர்ப்பின் அளவுகோல் என்ற கருத்தையும் இயல்பான நவீன தமிழில் வழங்குகிறது.
theological_decisions:
- issue: உள்ளார்ந்த மனிதனை ஆராய்கிறவராகப் பேசுகிறவரின் அடையாளம்
  choice: ‘ஆராய்கிறவர் நானே’ என்ற முதலாம் நபர் சுயஅடையாளத்தை வலுவாகத் தக்கவைத்தல்
  alternative: பொதுவாக அறிந்திருப்பவர் அல்லது கவனிப்பவர் என்று மென்மைப்படுத்துதல்
  rationale: கிரேக்கம் உள்ளார்ந்த மனிதனை ஆராயும் நீதித்தீர்ப்பு அதிகாரத்தை உயிர்த்தெழுந்த இயேசுவின் வலுவான சுயஅடையாளமாக முன்வைக்கிறது; அதைத் தளர்த்தக்கூடாது.
- issue: ‘அவளுடைய பிள்ளைகள்’ என்பதன் பொருள்
  choice: நேரடியான அல்லது உருவகமான பொருள் இரண்டிற்கும் இடமளித்தல்
  alternative: உடல்சார்ந்த பிள்ளைகள் என்றோ, சீடர்கள்/பின்பற்றுகிறவர்கள் என்றோ வெளிப்படையாக விளக்குதல்
  rationale: சூழல் உருவகமாக அவளைப் பின்பற்றுகிறவர்களைச் சுட்டக்கூடும்; ஆனால் கிரேக்கச் சொல் அதைக் கட்டாயப்படுத்தாததால் தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘மரணத்தால்’ என்ற மூலத்தின் அசாதாரணமான சொல்லாட்சி பிரதான உரையில் பாதுகாக்கப்பட்டு, ‘கொள்ளைநோய்’ அடிக்குறிப்பில் தரப்பட்டுள்ளது. ‘சிறுநீரகங்கள்’ என்ற சொற்பொருள் பிரதான உரையில் குழப்பமளிப்பதால் ‘உள்ளங்கள்’ எனப் பொருள்வழி மொழிபெயர்க்கப்பட்டு, சொற்பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
