id: REV.2.17
reference: Revelation 2:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. τῷ νικῶντι δώσω ⸀αὐτῷ τοῦ μάννα τοῦ κεκρυμμένου, καὶ δώσω αὐτῷ ψῆφον λευκήν, καὶ ἐπὶ τὴν ψῆφον ὄνομα καινὸν γεγραμμένον ὃ οὐδεὶς οἶδεν εἰ μὴ ὁ λαμβάνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/017.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches. To the one who conquers I will give some of the hidden manna, and I will give him a white stone, and a new name written on it[c][b], which no one knows except the one who receives it.
translation:
  language: ta
  text: கேட்கக் காதுள்ளவர், ஆவியானவர் திருச்சபைகளுக்குச் சொல்வதைக் கேட்கட்டும். வெற்றிபெறுகிறவருக்கு மறைத்து வைக்கப்பட்டுள்ள மன்னாவிலிருந்து சிறிது கொடுப்பேன். அவருக்கு ஒரு வெள்ளைக் கல்[a] கொடுப்பேன்; அந்தக் கல்லின்மேல் ஒரு புதிய பெயர் எழுதப்பட்டிருக்கும். பெறுகிறவரைத் தவிர வேறு யாருக்கும் அந்தப் பெயர் தெரியாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வெள்ளைக் கல்’ என்பது வாக்களிக்கப் பயன்படுத்திய சிறுகல்லையோ, குற்றமற்றவர் எனத் தீர்ப்பளித்ததற்கான அடையாளத்தையோ, அனுமதி அல்லது நுழைவுக்கான அடையாளக் கல்லையோ நினைவூட்டலாம். எந்தப் பின்னணி நோக்கப்பட்டுள்ளது என்பதை வசனம் குறிப்பிடவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: கேட்கக் காதுள்ளவர்
  rationale: ஒருமை வடிவிலுள்ள கிரேக்க மரபுத்தொடரின் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; ‘கேட்க’ என்பது காதின் நோக்கத்தைத் தெளிவாக்குகிறது.
- source_word: ἀκουσάτω
  choice: கேட்கட்டும்
  rationale: மூன்றாம் நபர் ஒருமை கட்டளை வடிவின் அறிவுறுத்தல் வலிமையைத் தக்கவைக்கிறது.
- source_word: τὸ πνεῦμα
  choice: ஆவியானவர்
  rationale: இங்கு தெய்வீக ஆவியானவர் குறிக்கப்படுகிறார்; மூலத்தில் இல்லாத ‘பரிசுத்த’ என்ற சொல்லைச் சேர்க்காமல் தமிழில் மரியாதைக்குரிய ஆளுருவக் குறிப்பைப் பயன்படுத்துகிறது.
- source_word: ταῖς ἐκκλησίαις
  choice: திருச்சபைகளுக்கு
  rationale: வெளிப்படுத்தலில் முகவரியாக உள்ள விசுவாசக் கூட்டங்களைக் குறிக்கும் நிலைபெற்ற தமிழ் சொல்.
- source_word: τῷ νικῶντι
  choice: வெற்றிபெறுகிறவருக்கு
  rationale: νικάω என்பதன் வெற்றி/மேற்கொள்ளுதல் சார்ந்த உயிரோட்டமான பொருளையும் நிகழ்காலப் பங்கேற்புவினையின் தொடர்ச்சியான பண்பையும் வெளிப்படுத்துகிறது.
- source_word: τοῦ μάννα τοῦ κεκρυμμένου
  choice: மறைத்து வைக்கப்பட்டுள்ள மன்னாவிலிருந்து சிறிது
  rationale: பகுதிப்பொருள் தரும் பிறப்புவேற்றுமையை ‘இலிருந்து சிறிது’ எனத் தெளிவாகக் காட்டி, கெக்ரும்மெனு என்பதன் நீடிக்கும் மறைவுநிலையையும் தக்கவைக்கிறது.
- source_word: ψῆφον λευκήν
  choice: ஒரு வெள்ளைக் கல்
  rationale: ψῆφος என்பதன் குறிப்பிட்ட பண்பாட்டு பயன்பாட்டைத் தீர்மானிக்காமல், அதன் அடிப்படை உருவத்தை இயல்பாகத் தருகிறது.
- source_word: ἐπὶ τὴν ψῆφον
  choice: அந்தக் கல்லின்மேல்
  rationale: பெயர் பொறிக்கப்பட்டிருக்கும் இடத்தைத் தெளிவாகவும் இயல்பாகவும் குறிப்பிடுகிறது.
- source_word: ὄνομα καινὸν γεγραμμένον
  choice: ஒரு புதிய பெயர் எழுதப்பட்டிருக்கும்
  rationale: καινός என்பதற்கு ‘புதிய’ என்றும், முடிவுற்று நிலைத்திருக்கும் எழுத்தை உணர்த்தும் perfect participle-க்கு ‘எழுதப்பட்டிருக்கும்’ என்றும் தருகிறது.
- source_word: ὃ οὐδεὶς οἶδεν εἰ μὴ ὁ λαμβάνων
  choice: அதைப் பெறுகிறவரைத் தவிர வேறு யாருக்கும் அந்தப் பெயர் தெரியாது
  rationale: உறவுப்பெயரின் முன்னிலைச் சொல்லான ‘பெயர்’ என்பதைத் தெளிவாக்கி, பெறுபவருக்கு மட்டுமே அது தெரியும் என்ற கட்டுப்பாட்டை இயல்பான தமிழில் தக்கவைக்கிறது.
theological_decisions:
- issue: ஒருமை ஆண்பால் இலக்கண வடிவங்களின் பொதுவான பயன்பாடு
  choice: ‘காதுள்ளவர்’, ‘வெற்றிபெறுகிறவர்’, ‘பெறுகிறவர்’ என்ற பாலினத்தை முன்னிறுத்தாத மரியாதை ஒருமை வடிவங்கள்
  alternative: ‘அவன்’, ‘அவனுக்கு’ என்ற வெளிப்படையான ஆண்பால் வடிவங்கள்
  rationale: கிரேக்க ஆண்பால் ஒருமை பிரதிநிதித்துவமாகவும் பொதுவாகவும் செயல்படுகிறது. தமிழில் ‘வர்’ வடிவம் ஒருமையையும் பொதுவான மனிதக் குறிப்பையும் இயல்பாகப் பாதுகாக்கிறது; பொருளை பாலினத்திற்குள் மட்டுப்படுத்தாது.
- issue: ψῆφος λευκή என்ற அடையாளத்தின் விளக்கம்
  choice: ‘ஒரு வெள்ளைக் கல்’ என்று விளக்கமின்றி மொழிபெயர்த்தல்
  alternative: விடுதலைத் தீர்ப்புக் குறி, விருந்தில் நுழைவுச் சீட்டு, அல்லது வாக்குக் கல் என்று குறிப்பாக்குதல்
  rationale: மூல வசனம் எந்தப் பண்பாட்டுப் பின்னணியையும் தெளிவாக நிர்ணயிக்கவில்லை. ஆகவே சின்னத்தின் உண்மையான விளக்கத் திறப்பை மொழிபெயர்ப்பு பாதுகாக்கிறது.
- issue: புதிய பெயர் எதன்மேல் எழுதப்பட்டுள்ளது
  choice: அந்தக் கல்லின்மேல் பெயர் எழுதப்பட்டிருக்கும் என்று தெளிவாகக் கூறுதல்
  alternative: கிரேக்கச் சொல்வரிசையை அப்படியே பின்பற்றி ‘கல்லின்மேல் எழுதப்பட்ட ஒரு புதிய பெயர்’ என அமைத்தல்
  rationale: ἐπὶ τὴν ψῆφον என்பது கல்லின் மேற்பரப்பைக் குறிக்கிறது. இயல்பான தமிழ் வாக்கிய அமைப்பு தொடர்பைத் தெளிவாக்குகிறது; இறையியல் பொருளைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. வெளிப்படுத்தலின் மறைபொருள் சின்னங்களை மிகையாக விளக்காமல், மூலத்தின் ஒருமை அறிவுறுத்தலும் வாக்குறுதியும் பாதுகாக்கப்பட்டுள்ளன. Footnote marker [a] ‘வெள்ளைக் கல்’ தொடர்பான பிரதான உரைக் கூறின் முடிவில் வைக்கப்பட்டுள்ளது.
