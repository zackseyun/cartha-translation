reference: Revelation 2:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ ⸀τῆς ἐν Σμύρνῃ ἐκκλησίας γράψον· Τάδε λέγει ὁ πρῶτος καὶ ὁ ἔσχατος, ὃς ἐγένετο νεκρὸς καὶ ἔζησεν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/008.yaml
  text: 'And to the angel of the church in Smyrna write: These things says the First and the Last[b][a], who became dead and lived again:'
translation:
  language: ta
  text: 'சிமிர்னாவில் உள்ள திருச்சபையின் தூதனுக்கு[a] எழுது: முதலும் கடைசியுமானவர், இறந்து உயிர்பெற்றவர்[b] இவ்வாறு கூறுகிறார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சிமிர்னாவில் உள்ள திருச்சபையின் செய்தியாளனுக்கு’.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘இறந்தவராயிருந்து உயிர்பெற்றவர்’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: தூதனுக்கு
  rationale: வெளிப்படுத்தின விசேஷத்தின் திருக்காட்சிச் சூழலில் ‘தூதன்’ என்பது இயல்பான முதன்மைப் பொருள். மனிதச் செய்தியாளரையும் இச்சொல் குறிக்கக்கூடும் என்பதால் அந்த வாய்ப்பு அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: ἐκκλησίας
  choice: திருச்சபையின்
  rationale: இங்கு ஒரு பொதுக் கூட்டமல்ல, சிமிர்னாவில் கூடியிருந்த கிறிஸ்தவ விசுவாசச் சமூகமே குறிக்கப்படுகிறது; நவீனத் தமிழில் ‘திருச்சபை’ அந்தச் சமய-சமூகப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: Τάδε λέγει
  choice: கூறுவது இதுவே
  rationale: திரும்பத் திரும்ப வரும் தீர்க்கதரிசன அறிவிப்பு முறையின் கண்ணியத்தையும் நேரடித்தன்மையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ὁ πρῶτος καὶ ὁ ἔσχατος
  choice: முதல்வரும் கடைசியுமானவர்
  rationale: இது உயிர்த்தெழுந்த இயேசுவின் பட்டப்பெயராகச் செயல்படுகிறது. ‘முதல்வர்’ என்பது வெறும் வரிசையில் முதல் என்பதைக் கடந்த உயரிய பட்டப்பெயரின் தொனியையும் தமிழில் தருகிறது.
- source_word: ἐγένετο νεκρὸς
  choice: இறந்தவராகி
  rationale: ἐγένετο என்பதிலுள்ள நிகழ்வுத் தன்மையை—அவர் மரணத்திற்குள் சென்றதை—வெறும் ‘இறந்திருந்தவர்’ என்று நிலைமையாக மட்டும் மாற்றாமல் காக்கிறது.
- source_word: ἔζησεν
  choice: மீண்டும் உயிர்பெற்றவர்
  rationale: மரணத்துக்குப் பிந்தைய உயிரைச் சூழலில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; வெறும் ‘வாழ்ந்தவர்’ என்பது தமிழில் இங்கு தேவையான உயிர்த்தெழுதல் எதிர்மறையைப் போதுமான அளவு தராது.
theological_decisions:
- issue: கிறிஸ்துவுக்குரிய பட்டப்பெயரும் மரணம்–உயிர்த்தெழுதல் மொழியும்
  choice: ‘முதல்வரும் கடைசியுமானவர்’ என்பதைப் பட்டப்பெயராக வைத்து, ‘இறந்தவராகி மீண்டும் உயிர்பெற்றவர்’ என்று நிகழ்வுத் தன்மையுடன் மொழிபெயர்த்தல்
  alternative: ‘முதலும் முடிவுமானவர்; இறந்திருந்து உயிரடைந்தவர்’
  rationale: கிரேக்கத்தில் உள்ள உயரிய கிறிஸ்துவியல் சுயஅடையாளத்தையும் மரணம்–உயிர்த்தெழுதல் கூற்றையும் எந்தக் கூடுதல் கோட்பாட்டு விளக்கமும் சேர்க்காமல் பாதுகாக்கிறது. அதேவேளை ἐγένετο என்பதன் ‘ஆகுதல்’ நுணுக்கத்தையும் ἔζησεν என்பதன் உயிர்த்தெழுதல் எதிர்மறையையும் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டது. கிரேக்க வாக்கியத்தின் கட்டளை–மேற்கோள் அமைப்பும் தீர்க்கதரிசன அறிவிப்பு ஓசையும் காக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறியீடுகள் உரிய சொற்களுக்குப் பின்னர் முதன்மை உரையில் இடம்பெறுகின்றன.
