id: REV.2.11
reference: Revelation 2:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. ὁ νικῶν οὐ μὴ ἀδικηθῇ ἐκ τοῦ θανάτου τοῦ δευτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/011.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches[b]. The one who conquers will certainly not be harmed by the second death.
translation:
  language: ta
  text: காது உள்ளவன், ஆவியானவர் திருச்சபைகளுக்குச் சொல்வதைக் கேட்கட்டும். வெற்றி பெறுகிறவன்[a] இரண்டாம் மரணத்தால் எவ்விதத்திலும் தீங்கு அடைய மாட்டான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஜெயங்கொள்கிறவன்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இரண்டாம் மரணத்திலிருந்து எவ்விதத்திலும் தீங்கு அடைய மாட்டான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: காதுள்ளவன்
  rationale: ஒருமை பிரதிநிதித்துவ அமைப்பையும் ‘காது’ என்ற ஒருமையையும் சுருக்கமான, இயல்பான தமிழில் காக்கிறது.
- source_word: ἀκουσάτω
  choice: கேட்கட்டும்
  rationale: மூன்றாம் நபர் ஒருமை கட்டளை வடிவத்தின் அறிவுறுத்தல் மற்றும் அழைப்பு வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὸ πνεῦμα
  choice: ஆவியானவர்
  rationale: வெளிப்படுத்தின விசேஷத்தின் மீளும் செய்தி வாய்ப்பாட்டில் திருச்சபைகளிடம் பேசும் தெய்வீக நபரைக் குறிக்கும் இயல்பான தமிழ் கிறிஸ்தவப் பயன்பாடு.
- source_word: ταῖς ἐκκλησίαις
  choice: திருச்சபைகளுக்கு
  rationale: இங்கு முகவரிகளாகிய உள்ளூர் விசுவாசக் குழுக்களைத் தெளிவாகக் குறிக்கிறது.
- source_word: ὁ νικῶν
  choice: வெற்றி பெறுகிறவன்
  rationale: தொடர்ந்து வெல்வதனால் அடையாளப்படுத்தப்படும் நபரைக் குறிக்கும் நிகழ்காலப் பங்கேற்பு வடிவத்தை நவீன தமிழில் இயல்பாக வழங்குகிறது.
- source_word: οὐ μὴ
  choice: எவ்விதத்திலும் ... மாட்டான்
  rationale: கிரேக்கத்தின் வலியுறுத்தப்பட்ட மறுப்பை பழமையான நடையின்றி தெளிவாகத் தெரிவிக்கிறது.
- source_word: ἀδικηθῇ
  choice: தீங்கடைய
  rationale: இச்சூழலில் சட்டரீதியாக அநியாயம் செய்யப்படுவதைக் காட்டிலும் உண்மையான கேடு அல்லது பாதிப்பைச் சுட்டுகிறது.
- source_word: ἐκ τοῦ θανάτου τοῦ δευτέρου
  choice: இரண்டாம் மரணத்தால்
  rationale: ἐκ குறிக்கும் மூல அல்லது செயற்பாட்டுத் தொடர்பை இயல்பான தமிழ் கருவி வேற்றுமையில் வெளிப்படுத்துகிறது; முக்கியமான மறைவெளிப்பாட்டு சொற்றொடரை விளக்கிச் சுருக்காமல் காக்கிறது.
theological_decisions:
- issue: ‘ஆவி’ என்பதன் குறிப்பு
  choice: திருச்சபைகளிடம் பேசும் ஆவியானவர்
  alternative: பொதுவாகத் தீர்க்கதரிசன ஆவி
  rationale: வெளிப்படுத்தின விசேஷம் 2–3 அதிகாரங்களின் மீளும் வாய்ப்பாட்டில் ஆவி தெய்வீகப் பேச்சாளராகச் செயல்படுகிறார்; ‘ஆவியானவர்’ என்பது இதைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- issue: பிரதிநிதித்துவ ஒருமை ஆண்பால் வடிவங்கள்
  choice: ‘காதுள்ளவன்’, ‘வெற்றி பெறுகிறவன்’ என ஒருமை ஆண்பால் வடிவத்தைப் பேணுதல்
  alternative: பாலினம் குறிப்பிடாத பன்மை அல்லது மறுவாக்கியம்
  rationale: கிரேக்க இலக்கணத்தில் ஆண்பால் ஒருமை இருந்தாலும் அதன் பொருள் பிரதிநிதித்துவமானது; தமிழ் ஒருமை வாய்ப்பாடு மூலத்தின் சொல்லாட்சியையும் பொதுவான அழைப்பையும் காக்கிறது.
- issue: ‘இரண்டாம் மரணம்’ என்பதன் பொருள்
  choice: விளக்க விரிவாக்கமின்றி அச்சொற்றொடரைப் பேணுதல்
  alternative: இறுதி நியாயத்தீர்ப்பு அல்லது நித்தியத் தண்டனை என்று வெளிப்படையாக விளக்குதல்
  rationale: இந்த இறையியல் முக்கியத்துவமுள்ள உருவகம் வெளிப்படுத்தின விசேஷத்திலேயே பின்னர் விளக்கப்படுகிறது; இவ்வசனத்தில் குறிப்பிட்ட கோட்பாட்டு விளக்கத்தைச் சேர்க்கக்கூடாது.
translation_notes:
  register: நவீன, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘ஜெயங்கொள்ளுகிறவன்’ போன்ற மரபான ஆனால் இன்றைய பொதுநடையில் குறைவாகப் பயன்படும் வடிவத்துக்குப் பதிலாக ‘வெற்றி பெறுகிறவன்’ தேர்ந்தெடுக்கப்பட்டது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
