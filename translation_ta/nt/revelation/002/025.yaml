  terminology: ‘உறுதியாகப் பற்றிக்கொள்ளுங்கள்’ என்பது κρατήσατε-இன் உறுதியான நிலைத்திருத்தல்/பிடித்துக்கொள்ளுதல் என்ற வலிமையை நன்றாக வெளிப்படுத்துகிறது. பெயர்கள் அல்லது இறையியல் சொற்கள் தொடர்பான சிக்கல் இவ்வசனத்தில் இல்லை.
