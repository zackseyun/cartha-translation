  source_fidelity: மூல கிரேக்கத்தின் πλὴν-இன் எதிர்மறை/வரம்பிடும் இணைப்பு ‘ஆயினும்’ மூலம் பொருத்தமாகத் தரப்பட்டுள்ளது. ὃ ἔχετε, κρατήσατε, ἄχρι οὗ ἂν, ἥξω ஆகியவற்றின் பொருளும் கட்டளைத் தொனியும் கால எல்லையும் பாதுகாக்கப்பட்டுள்ளன. ‘நான் வரும்வரை’ என்பது வருகையின் தன்மையை விளக்கிச் சேர்க்காமல் மூலத்தின் திறந்த நிலையைக் காக்கிறது.
