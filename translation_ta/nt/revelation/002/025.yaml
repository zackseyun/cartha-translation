id: REV.2.25
reference: Revelation 2:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πλὴν ὃ ἔχετε κρατήσατε ἄχρι οὗ ἂν ἥξω.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/025.yaml
  text: Nevertheless[a], hold fast what you have until I come.
translation:
  language: ta
  text: ஆயினும்[a], நான் வரும்வரை உங்களிடம் இருப்பதை உறுதியாகப் பற்றிக்கொள்ளுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களிடம் இருப்பதை மட்டும் நான் வரும்வரை உறுதியாகப் பற்றிக்கொள்ளுங்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: ஆயினும்
  rationale: முந்தைய கருத்துக்குப் பின் வரும் விதிவிலக்கு அல்லது வரம்பிடும் எதிர்மறைத் தொடர்பை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது. ‘மட்டும்’ என்ற மாற்றுப் பொருளும் சாத்தியம் என்பதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ὃ ἔχετε
  choice: உங்களிடம் இருப்பதை
  rationale: நடுநிலை உறவுப்பெயருடன் வரும் ἔχετε, அவர்கள் தற்போது கொண்டிருப்பதைப் பொதுவாகக் குறிக்கிறது; இத்தமிழாக்கம் பொருளைத் தேவையின்றி குறிப்பிட்ட ஒன்றாகச் சுருக்கவில்லை.
- source_word: κρατήσατε
  choice: உறுதியாகப் பற்றிக்கொள்ளுங்கள்
  rationale: κρατέω என்பதன் கட்டளை வடிவம் தளராமல் வைத்திருப்பதையும் உறுதியான பற்றுதலையும் வலியுறுத்துகிறது; இச்சொற்றொடர் அந்த வலிமையை நவீன தமிழில் இயல்பாகத் தருகிறது.
- source_word: ἄχρι οὗ ἂν
  choice: வரும்வரை
  rationale: பேசுகிறவர் வருகிற எதிர்காலத் தருணம்வரை நீளும் கால எல்லையைத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: ἥξω
  choice: நான் வரும்வரை
  rationale: ἥκω வருதல் அல்லது வந்து சேருதல் என்பதைக் குறிக்கிறது. ‘நான் வரும்வரை’ என்பது வருகையின் தன்மையையோ காலத்தையோ கூடுதலாக விளக்காமல் மூலத்தின் திறந்த பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: இயேசுவின் இந்த ‘வருதல்’ இறுதி வருகையையா அல்லது இந்தச் சபையை நியாயந்தீர்க்க/சந்திக்க வரும் நிகழ்வையா குறிக்கிறது?
  choice: ‘நான் வரும்வரை’ என்று மட்டும் மொழிபெயர்த்து, வருகையின் விதத்தையோ காலத்தையோ குறிப்பிடவில்லை.
  alternative: ‘நான் நியாயந்தீர்க்க வரும்வரை’ அல்லது ‘என் இறுதி வருகைவரை’
  rationale: கிரேக்க வாசகம் இங்கு அந்த வருகையின் தன்மையை வெளிப்படையாக வரையறுக்கவில்லை. ஆகவே இறையியல் சார்ந்த பதற்றத்தையும் உண்மையான தெளிவின்மையையும் தீர்த்துவிடாமல் அப்படியே வைத்திருக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வெளிப்படுத்தல் நூலின் அறிவுறுத்தல் தொனிக்கேற்ற கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டுள்ளது. மரியாதைப் பன்மை வினைமுற்று சபை மக்களை நோக்கிய கட்டளையை இயல்பாக வெளிப்படுத்துகிறது.
