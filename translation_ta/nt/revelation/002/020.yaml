id: REV.2.20
reference: Revelation 2:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλὰ ἔχω κατὰ σοῦ ὅτι ἀφεῖς τὴν ⸀γυναῖκα Ἰεζάβελ, ἡ ⸀λέγουσα ἑαυτὴν προφῆτιν, καὶ διδάσκει καὶ πλανᾷ τοὺς ἐμοὺς δούλους πορνεῦσαι καὶ φαγεῖν εἰδωλόθυτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/020.yaml
  text: 'But I have this against you: you tolerate the woman Jezebel[c][b][a], who calls herself a prophetess and teaches and deceives my servants to commit sexual immorality and to eat food sacrificed to idols.'
translation:
  language: ta
  text: 'ஆனால், உனக்கு எதிராக எனக்கு இந்தக் குற்றச்சாட்டு உண்டு: தன்னை ஒரு பெண் தீர்க்கதரிசி என்று சொல்லிக்கொள்ளும்[b] யேசபேல் என்ற பெண்ணை[a] நீ சகித்துக்கொள்கிறாய். அவள் என் அடிமைகளுக்குப் போதித்து, அவர்களை வழிதவறச் செய்து[c], பாலியல் ஒழுக்கக்கேட்டில் ஈடுபடவும் சிலைகளுக்குப் பலியிடப்பட்ட உணவை உண்ணவும் செய்கிறாள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், ‘யேசபேல் என்ற பெண்ணை’ என்பதற்குப் பதிலாக ‘உன் மனைவி யேசபேலை’ என்று உள்ளது.
    reason: textual_variant
  - marker: b
    text: அல்லது, ‘தன்னை ஒரு பெண் தீர்க்கதரிசி என்று உரிமைகோருகிறாள்.’
    reason: lexical_alternative
  - marker: c
    text: ‘வழிதவறச் செய்து’ என்பதை ‘ஏமாற்றி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய பாராட்டுக்கு மாறாகக் கடுமையான குற்றச்சாட்டை அறிமுகப்படுத்தும் இயல்பான எதிர்மறை இணைப்புச்சொல்.
- source_word: ἔχω κατὰ σοῦ
  choice: உனக்கு எதிராக எனக்கு இது உண்டு
  rationale: கிரேக்க மொழியின் குற்றச்சாட்டு மரபுத்தொடரைத் தெளிவாகவும் அதன் நேரடி வலிமையைப் பேணியும் வழங்குகிறது.
- source_word: ἀφεῖς
  choice: நீ சகித்துக்கொள்கிறாய்
  rationale: தீங்கான செயலைத் தொடர்ந்து நடைபெற அனுமதிக்கும் குற்றமுள்ள பொறுமையைச் சூழல் குறிக்கிறது.
- source_word: τὴν γυναῖκα Ἰεζάβελ
  choice: யேசபேல் என்ற பெண்ணை
  rationale: SBLGNT முதன்மை வாசகமான ‘பெண் யேசபேல்’ என்பதைக் காக்கிறது; ‘உன் மனைவி’ என்ற வேறுபாட்டு வாசகத்தை மூல உரையில் சேர்க்கவில்லை.
- source_word: ἡ λέγουσα ἑαυτὴν προφῆτιν
  choice: தன்னை ஒரு பெண் தீர்க்கதரிசி என்று சொல்லிக்கொள்ளும்
  rationale: அவள் தனக்குத்தானே உரிமைகோரும் நிலையைச் சுட்டுகிறது; προφῆτιν என்பதிலுள்ள பெண்பாலையும் வெளிப்படையாகப் பேணுகிறது.
- source_word: διδάσκει
  choice: போதித்து
  rationale: தொடர்ந்து நடைபெறும் போதனைச் செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: πλανᾷ
  choice: வழிதவறச் செய்து
  rationale: உண்மையிலிருந்தும் சரியான நடத்தையிலிருந்தும் பிறரை விலகச் செய்வது என்ற இயக்கமிக்க பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: τοὺς ἐμοὺς δούλους
  choice: என் அடிமைகளை
  rationale: ‘என்’ என்ற உடைமைச் சுட்டுடன், கிறிஸ்துவுக்குச் சொந்தமானவர்கள் என்ற δοῦλος சொல்லின் கட்டுப்பட்ட உடைமைப் பொருளை வெளிப்படையாகப் பேணுகிறது.
- source_word: πορνεῦσαι
  choice: பாலியல் ஒழுக்கக்கேட்டில் ஈடுபடவும்
  rationale: தகாத பாலியல் நடத்தையில் ஈடுபடுதலை நவீன, கண்ணியமான தமிழில் தெரிவிக்கிறது.
- source_word: φαγεῖν εἰδωλόθυτα
  choice: சிலைகளுக்குப் பலியிடப்பட்ட உணவை உண்ணவும்
  rationale: சிலை வழிபாட்டுப் பலியோடு தொடர்புடைய உணவைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
theological_decisions:
- issue: ‘யேசபேல்’ என்பவரின் அடையாளம்
  choice: உரையில் உள்ள பெயரை அப்படியே வைத்தல்; அது இயற்பெயரா அல்லது பழைய ஏற்பாட்டு யேசபேலை நினைவூட்டும் குறியீட்டுப் பெயரா என்பதைத் தீர்மானிக்காமல் விடுதல்
  alternative: அவளுடைய இயற்பெயர் எனத் தீர்மானித்தல்; அல்லது இது முழுக்கக் குறியீட்டுப் பட்டப்பெயர் எனத் தீர்மானித்தல்
  rationale: இந்த வசனம் அந்தக் கேள்வியைத் தீர்ப்பதில்லை; ஆகவே உண்மையான விளக்கத் தெளிவின்மை பாதுகாக்கப்படுகிறது.
- issue: δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: என் அடிமைகள்
  alternative: என் ஊழியர்கள் / என் பணியாளர்கள்
  rationale: ‘என்’ என்ற சொல் கிறிஸ்துவுக்குரிய உடைமையையும் பற்றுறுதியையும் வலியுறுத்துவதால், கட்டுப்பட்ட சொந்தத்தன்மையை ‘அடிமைகள்’ வெளிப்படையாகக் காக்கிறது.
- issue: λέγουσα ἑαυτὴν என்பதிலுள்ள மதிப்பீடு
  choice: தன்னை ... என்று சொல்லிக்கொள்ளும்
  alternative: தான் ... என்று கூறும் / ... என்று உரிமைகோருகிறாள்
  rationale: அவளது சுயஅடையாளப்படுத்தலைக் காட்டுகிறது; அவளது கூற்று உண்மையா பொய்யா என்பதை மொழிபெயர்ப்பு தனியே தீர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியக்கூடிய, கண்ணியமான வேதாகம நடை. குற்றச்சாட்டின் நேரடித்தன்மை பேணப்பட்டுள்ளது. மூல உரையின் நீண்ட தொடரமைப்பு தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; எல்லா அடிக்குறிப்பு குறிகளும் உரையில் சேர்க்கப்பட்டுள்ளன.
