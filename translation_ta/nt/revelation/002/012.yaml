  to: '“பெர்கமுவில் உள்ள திருச்சபையின் தூதருக்கு[a] எழுது: கூர்மையான, இருபுறமும் வெட்டுக்கூர்மை கொண்ட வாளை வைத்திருப்பவர் இவ்வாறு கூறுகிறார்:”'
