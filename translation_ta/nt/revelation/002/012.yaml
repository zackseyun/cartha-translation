id: REV.2.12
reference: Revelation 2:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Περγάμῳ ἐκκλησίας γράψον· Τάδε λέγει ὁ ἔχων τὴν ῥομφαίαν τὴν δίστομον τὴν ὀξεῖαν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/012.yaml
  text: 'And to the angel of the church in Pergamum write: These things says the one who has the sharp, double-edged sword:[a]'
translation:
  language: ta
  text: '“பெர்கமுவில் உள்ள திருச்சபையின் தூதருக்கு[a] எழுது: கூர்மையான, இருபுறமும் வெட்டுக்கூர்மை கொண்ட வாளை வைத்திருப்பவர் இவ்வாறு கூறுகிறார்:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “செய்தியாளர்.” இங்கு குறிப்பிடப்படுபவர் விண்ணுலகத் தூதரா அல்லது திருச்சபையின் மனிதப் பிரதிநிதியா என்பதில் விளக்கவுரையாளர்களிடையே கருத்து வேறுபாடு உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: தூதருக்கு
  rationale: ἄγγελος என்பது விண்ணுலகத் தூதரையோ மனிதத் தூதரையோ குறிக்கலாம். ‘தூதர்’ இரு வாய்ப்புகளையும் இயன்றவரை திறந்தவாறே வைக்கிறது; குறிப்பிட்ட அடையாளத்தைத் திணிக்கவில்லை.
- source_word: ἐκκλησίας
  choice: திருச்சபையின்
  rationale: இங்கு கிறிஸ்தவ நம்பிக்கையாளர்களின் சமூகத்தைக் குறிக்கிறது. நவீனத் தமிழில் தெளிவாகவும் மரியாதைக்குரிய வழக்கிலும் உள்ள சொல்.
- source_word: γράψον
  choice: எழுது
  rationale: γράφω என்பதன் கட்டளை வடிவத்தை நேரடியாகவும் இயல்பாகவும் தருகிறது; தொடர்ந்து வரும் உரையே எழுத வேண்டிய உள்ளடக்கம்.
- source_word: Τάδε λέγει
  choice: கூறுவது இதுவே
  rationale: தீர்க்கதரிசன அல்லது அரச அறிவிப்பை அறிமுகப்படுத்தும் முறையான சூத்திரத்தின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: ὁ ἔχων
  choice: வைத்திருப்பவர்
  rationale: பெயரடைவினைப் பெயரின் பட்டப்பெயர் போன்ற தன்மையைத் தக்கவைத்து, வாளை உடையவரைக் குறிப்பிடுகிறது.
- source_word: ῥομφαίαν
  choice: வாளை
  rationale: ஒரு பெரிய அல்லது கனமான வாளைக் குறிக்கக்கூடிய சொல் என்றாலும், இங்கு ‘வாள்’ என்பது தெளிவான சமமான சொல்; தேவையற்ற வகைத் துல்லியத்தைச் சேர்ப்பதில்லை.
- source_word: δίστομον
  choice: இருபுறமும் கருக்குள்ள
  rationale: சொல்லளவில் ‘இரு வாயுடைய’ என்பதன் வாள் சார்ந்த பொருள் இரு புறங்களிலும் வெட்டும் கூர்மை உடையது என்பதாகும். இயல்பான தமிழில் அந்த உருவகப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: ὀξεῖαν
  choice: கூர்மையான
  rationale: வாளின் கூர்மையை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: Περγάμῳ
  choice: பெர்கமுவில்
  rationale: Πέργαμος என்ற இடப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பை இடவேற்றுமையுடன் தருகிறது.
theological_decisions:
- issue: திருச்சபையின் ‘தூதர்’ யார் என்பது
  choice: முதன்மை உரையில் ‘தூதர்’ என்று வைத்து, அவர் விண்ணுலக உயிரா மனிதப் பிரதிநிதியா என்பதை நிர்ணயிக்காமல் விடுதல்
  alternative: மனிதச் செய்தியாளர், திருச்சபைத் தலைவர், அல்லது விண்ணுலகப் பிரதிநிதி என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: ἄγγελος பல பொருள் வாய்ப்புகளை அனுமதிக்கிறது; இவ்வசனம் மட்டும் அந்த அடையாளத்தைத் தீர்மானிக்கவில்லை. ஆகவே மொழிபெயர்ப்பு இறையியல் அல்லது திருச்சபை ஆட்சிமுறை சார்ந்த ஒரு விளக்கத்தைத் திணிக்கக்கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான அறிவிப்பு நடையைப் பயன்படுத்துகிறது. ‘கூறுவது இதுவே’ என்பது மீண்டும் வரும் அறிவிப்புச் சூத்திரத்தைக் காக்கிறது. அடிக்குறிப்புக் குறி தெளிவின்மை உள்ள ‘தூதர்’ என்பதற்குப் பின்னரே வைக்கப்பட்டுள்ளது.
