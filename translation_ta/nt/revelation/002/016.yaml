id: REV.2.16
reference: Revelation 2:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μετανόησον οὖν· εἰ δὲ μή, ἔρχομαί σοι ταχύ, καὶ πολεμήσω μετ’ αὐτῶν ἐν τῇ ῥομφαίᾳ τοῦ στόματός μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/016.yaml
  text: Therefore repent[a]. But if not, I am coming to you quickly[b], and I will make war against them with the sword of my mouth.
translation:
  language: ta
  text: ஆகவே, மனந்திரும்பு. இல்லையென்றால், நான் உன்னிடம் விரைவில்[a] வந்து, என் வாயின் வாளால்[b] அவர்களுக்கு எதிராகப் போரிடுவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “விரைவில்” என்பதற்கு “விரைவாக” அல்லது “திடீரென” என்ற நிழற்பொருளும் இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “என் வாயின் வாள்” என்பது கிறிஸ்துவின் நியாயத்தீர்ப்பை அறிவிக்கும் வார்த்தையைச் சித்தரிக்கும் வெளிப்படுத்தல் நூலுக்குரிய உருவகம்.
    reason: cross_reference
lexical_decisions:
- source_word: μετανόησον
  choice: மனந்திரும்பு
  rationale: ஒருமுறைத் தீர்மானமாக மனமும் வழியும் மாறும்படி அழைக்கும் இறந்தகால வினை ஏவலை, தமிழில் நிலைபெற்றுள்ள வலிமையான ஆன்மிக-ஒழுக்கச் சொல்லால் தெரிவிக்கிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய கண்டிப்பிலிருந்து வரும் முடிவுறுத்தலைத் தெளிவாகவும் இயல்பாகவும் இணைக்கிறது.
- source_word: εἰ δὲ μή
  choice: இல்லையென்றால்
  rationale: மனந்திரும்பாத நிலைக்கு எதிராக வரும் நிபந்தனை எச்சரிக்கையைச் சுருக்கமாகவும் கூர்மையாகவும் தெரிவிக்கிறது.
- source_word: ἔρχομαί σοι
  choice: நான் உன்னிடம் ... வந்து
  rationale: சபையை ஒருமை வடிவில் நோக்கி வருவதைப் பாதுகாக்கிறது; பகைமைப் பொருளை இந்தச் சொற்றொடருக்குள் முன்கூட்டியே சேர்க்காமல், அடுத்துள்ள போரிடும் வினையில் வெளிப்படுத்துகிறது.
- source_word: ταχύ
  choice: விரைவில்
  rationale: வருகையின் நெருக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது; வேகமாக அல்லது திடீரென என்ற சாத்திய நிழற்பொருளை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: πολεμήσω μετ’ αὐτῶν
  choice: அவர்களுக்கு எதிராகப் போரிடுவேன்
  rationale: πολεμέω என்பதோடு வரும் μετά இங்கு கூட்டுச் சேர்வைக் குறிக்காமல் எதிர்த்துப் போரிடுவதைக் குறிக்கிறது; கடுமையான போரியல் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: ἐν τῇ ῥομφαίᾳ τοῦ στόματός μου
  choice: என் வாயின் வாளால்
  rationale: ἐν என்பதன் கருவிப்பொருளை “-ஆல்” மூலம் இயல்பாகக் காட்டி, வெளிப்படுத்தின நூலின் அபோகலிப்டிக் உருவகத்தை விளக்கவுரையாகத் தட்டையாக்காமல் அப்படியே வைத்திருக்கிறது.
theological_decisions:
- issue: சபையை நோக்கிய கிறிஸ்துவின் வருகையும் குறிப்பிட்டவர்களுக்கு எதிரான போரும்
  choice: “உன்னிடம்” என்ற ஒருமைச் சபை முகவரியையும் “அவர்களுக்கு எதிராக” என்ற குறிவைக்கப்பட்ட நியாயத்தீர்ப்பையும் வேறுபடுத்திப் பாதுகாத்தல்
  alternative: முழுச் சபையையும் வேறுபாடின்றி எதிர்த்து வருதல்; அல்லது சபையைத் தொடர்புபடுத்தாமல் பொய்ப் போதகர்களை மட்டும் எதிர்த்தல்
  rationale: கிரேக்கம் வருகையை ஒருமை முகவரியான “உன்னிடம்” என்றும், போரைக் “அவர்களுக்கு எதிராக” என்றும் அமைக்கிறது. உரையில் உள்ள கூட்டுப்பொறுப்புக்கும் குறிவைக்கப்பட்ட தீர்ப்புக்கும் இடையிலான பதற்றத்தை மொழிபெயர்ப்பு தீர்த்துவிடவில்லை.
- issue: நியாயத்தீர்ப்பின் கருவியாக வாயின் வாள்
  choice: உருவகத்தை “என் வாயின் வாள்” என்று அப்படியே வைத்தல்
  alternative: “என் வார்த்தை” அல்லது “என் பேச்சின் வல்லமை” என்று விளக்கிப் பெயர்த்தல்
  rationale: வெளிப்படுத்தின நூலில் நிலைபெற்றுள்ள நியாயத்தீர்ப்பு உருவகத்தை மூலத்தின் இலக்கிய மற்றும் இறையியல் வலிமையோடு பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் சுருக்கமான, கண்ணியமான எச்சரிக்கை நடையைப் பயன்படுத்துகிறது. “மனந்திரும்பு” என்ற நிலைபெற்ற வேதாகமச் சொல் தக்கவைக்கப்பட்டாலும், மற்ற வாக்கிய அமைப்பு சாதாரண வாசகர்களுக்கு இயல்பாக உள்ளது.
