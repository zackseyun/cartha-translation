id: REV.2.10
reference: Revelation 2:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀μηδὲν φοβοῦ ἃ μέλλεις ⸀πάσχειν. ⸀ἰδοὺ μέλλει ⸀βάλλειν ὁ διάβολος ἐξ ὑμῶν εἰς φυλακὴν ἵνα πειρασθῆτε, καὶ ⸀ἕξετε θλῖψιν ἡμερῶν δέκα. γίνου πιστὸς ἄχρι θανάτου, καὶ δώσω σοι τὸν στέφανον τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/010.yaml
  text: Do not fear what you are about to suffer[a]. Look, the devil is about to throw some of you into prison so that you may be tested, and you will have tribulation for ten days. Be faithful until death[c][b], and I will give you the crown of life.
translation:
  language: ta
  text: நீ அனுபவிக்கவிருப்பவற்றைக் குறித்து சிறிதும் அஞ்சாதே. இதோ, நீங்கள் சோதிக்கப்படும்படி[a] பிசாசு உங்களில் சிலரைச் சிறையில் தள்ளவிருக்கிறான்; பத்து நாட்களுக்கு உங்களுக்கு நெருக்கடி உண்டாகும். மரணம் வரையும்[b] உண்மையாயிரு; நான் உனக்கு வாழ்வின் வெற்றிமாலையைத் தருவேன்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சோதிக்கப்படும்படி’ என்பதற்கு ‘பரிசோதிக்கப்படும்படி’ அல்லது ‘தீமைக்கு இழுக்கப்படும்படி’ என்றும் பொருள் கொள்ளலாம்; கிரேக்க வினைச்சொல் சூழலுக்கேற்ப சோதனை, பரிசோதனை, அல்லது தூண்டுதல் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘மரணம் வரையும்’ என்பது ‘மரணத்தைச் சந்திக்க வேண்டியிருந்தாலும்’ அல்லது ‘மரணத்தின் எல்லைவரை’ என்றும் பொருள்படலாம்; தியாகமரணம் தேவைப்பட்டாலும் உண்மையுடன் இருக்க வேண்டும் என்பதையும் இது உட்படுத்துகிறது.
    reason: alternative_reading
  - marker: c
    text: ‘வெற்றிமாலை’ என மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொல் (stephanos), அரசரின் மகுடத்தை அல்ல; வெற்றியாளருக்குப் பரிசாக வழங்கப்பட்ட மாலையைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: μηδὲν φοβοῦ ἃ μέλλεις πάσχειν
  choice: நீ அனுபவிக்கவிருப்பவற்றைக் குறித்து சிறிதும் அஞ்சாதே
  rationale: μηδέν தரும் முழுமையான தடையை ‘சிறிதும் அஞ்சாதே’ இயல்பாக வெளிப்படுத்துகிறது; μέλλω + infinitive-இன் அண்மையான எதிர்காலப் பொருளை ‘அனுபவிக்கவிருப்பவை’ காக்கிறது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: அடுத்து சொல்லப்படுவதன் மீது கவனத்தை ஈர்க்கும் உரையாடல் இடைச்சொல்லின் வலிமையை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: μέλλει βάλλειν ὁ διάβολος ἐξ ὑμῶν εἰς φυλακήν
  choice: பிசாசு உங்களில் சிலரைச் சிறையில் தள்ளவிருக்கிறான்
  rationale: μέλλει என்பதன் உடனடியான எதிர்கால நுணுக்கத்தையும், βάλλειν என்பதன் வலுவான ‘தள்ளுதல்’ உருவகத்தையும், ἐξ ὑμῶν குறிக்கும் குழுவிலிருந்து சிலர் என்ற பொருளையும் காக்கிறது.
- source_word: ἵνα πειρασθῆτε
  choice: நீங்கள் சோதிக்கப்படும்படி
  rationale: πειράζω இங்கு சோதனை, பரிசோதித்தல், அல்லது தூண்டிச் சோதித்தல் ஆகிய பொருட்களைத் தரக்கூடும். துன்புறுத்தல் சூழலில் ‘சோதிக்கப்படுதல்’ முதன்மைப் பொருளாக இயல்பாக உள்ளது; மற்ற சாத்தியங்கள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
- source_word: ἕξετε θλῖψιν ἡμερῶν δέκα
  choice: பத்து நாட்கள் உங்களுக்கு நெருக்கடி உண்டாகும்
  rationale: θλῖψις குறிக்கும் அழுத்தமிக்க துன்பத்தை ‘நெருக்கடி’ தெரிவிக்கிறது; genitive of duration-ஐ ‘பத்து நாட்கள்’ என இயல்பாக வழங்குகிறது.
- source_word: γίνου πιστός
  choice: உண்மையுள்ளவனாக இரு
  rationale: தொடர்ந்து நம்பிக்கைக்குரியவராகவும் பற்றுறுதியுள்ளவராகவும் நிலைத்திருக்கும் கட்டளையைத் தெளிவாகக் கூறுகிறது.
- source_word: ἄχρι θανάτου
  choice: மரணம்வரை
  rationale: மரணம் வரையிலான நிலைத்தன்மையையும், மரணத்தைச் சந்திக்க வேண்டியிருந்தாலும் உண்மையுடன் இருப்பதையும் குறுக்காமல் நேரடியாகக் காக்கிறது.
- source_word: τὸν στέφανον τῆς ζωῆς
  choice: வாழ்வின் வெற்றிமாலை
  rationale: στέφανος என்பது அரச முடி அல்ல, வெற்றியாளருக்கு வழங்கப்படும் மாலை. ‘வாழ்வின்’ என்பது genitive உறவின் சுருக்கத்தையும் அதன் ஓரளவு திறந்த பொருளையும் காக்கிறது.
theological_decisions:
- issue: πειρασθῆτε என்பதன் பொருள்
  choice: சோதிக்கப்படும்படி
  alternative: சோதனைக்கு உட்படுத்தப்படும்படி; தீமைக்கு இழுக்கும்படி சோதிக்கப்படும்படி
  rationale: சிறை மற்றும் துன்புறுத்தல் விசுவாசத்தைச் சோதிக்கும் சூழலை உருவாக்குகின்றன. அதேவேளை, செய்பவராகப் பிசாசு குறிப்பிடப்படுவதால் ‘tempted’ என்ற நுணுக்கத்தை முற்றிலும் நீக்காமல் அடிக்குறிப்பில் காக்கிறது.
- issue: ἄχρι θανάτου என்பதன் வலிமை
  choice: மரணம்வரை
  alternative: மரணத்தைச் சந்திக்க வேண்டியிருந்தாலும்; மரணத்தின் எல்லைவரை
  rationale: கிரேக்கச் சொற்றொடரின் நேரடியான கால/எல்லைப் பொருளைக் காக்கிறது; இதை தியாகமரணத்துக்கு மட்டும் சுருக்காமல், அது உட்படக்கூடிய சாத்தியத்தை அடிக்குறிப்பில் தெரிவிக்கிறது.
- issue: τῆς ζωῆς என்ற genitive உறவு
  choice: வாழ்வின் வெற்றிமாலை
  alternative: வாழ்வாகிய வெற்றிமாலை; வாழ்வை அளிக்கும் வெற்றிமாலை
  rationale: Genitive-ஐ வாழ்வே பரிசு எனவோ, வாழ்வை அளிக்கும் மாலை எனவோ ஒரே விதமாக விளக்கித் தீர்க்காமல், மூலத்தின் செறிவையும் திறந்த தன்மையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை–பன்மை மாறுபாடுகளையும் (‘நீ’ / ‘நீங்கள்’) மூலத்தைப் போலவே காத்து, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘உபத்திரவம்’, ‘ஜீவகிரீடம்’ போன்ற மரபுவழி ஆனால் இன்றைய பொதுவாசகர்களுக்கு ஓரளவு மறைபொருளான சொற்களுக்கு பதிலாக ‘நெருக்கடி’, ‘வாழ்வின் வெற்றிமாலை’ பயன்படுத்தப்பட்டுள்ளன.
