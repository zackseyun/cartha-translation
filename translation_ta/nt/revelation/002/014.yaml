revisions:
- from: 'ஆனால் உனக்கு எதிராக எனக்குச் சில குறைகள் உள்ளன: பிலேயாமின் போதனையைப் பற்றிக்கொண்டிருக்கிற சிலர் அங்கே உன்னிடையே இருக்கிறார்கள். அந்தப் பிலேயாம், இஸ்ரவேலின் மகன்களுக்கு[a] முன்பாக இடறச் செய்யும் தடையை வைக்கவும், சிலைகளுக்குப் பலியிடப்பட்ட உணவை உண்ணவும், பாலியல் ஒழுக்கக்கேட்டில் ஈடுபடவும் பாலாக்குக்குக் கற்பித்துவந்தான்.'
  to: 'ஆனால் உனக்கு எதிராக எனக்குச் சில காரியங்கள் உள்ளன: அங்கே பிலேயாமின் போதனையைப் பற்றிக்கொண்டிருப்பவர்கள் சிலர் உன்னிடம் இருக்கிறார்கள். அந்தப் பிலேயாம், இஸ்ரவேலின் மகன்களுக்கு[a] முன்பாக இடறுதற்கான கல்லை வைக்கும்படி, அதனால் அவர்கள் சிலைகளுக்குப் பலியிடப்பட்ட உணவை உண்ணவும் பாலியல் ஒழுக்கக்கேட்டில் ஈடுபடவும் பாலாக்குக்குக் கற்பித்தான்.'
