id: REV.2.14
reference: Revelation 2:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλὰ ἔχω κατὰ σοῦ ὀλίγα, ὅτι ἔχεις ἐκεῖ κρατοῦντας τὴν διδαχὴν Βαλαάμ, ὃς ⸂ἐδίδασκεν τῷ⸃ Βαλὰκ βαλεῖν σκάνδαλον ἐνώπιον τῶν υἱῶν Ἰσραήλ, ⸀φαγεῖν εἰδωλόθυτα καὶ πορνεῦσαι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/014.yaml
  text: 'But I have a few things against you: you have there some who hold to the teaching of Balaam[a], who taught Balak to put a stumbling block before the sons of Israel, to eat food sacrificed to idols and to commit sexual immorality.'
translation:
  language: ta
  text: 'ஆனால் உனக்கு எதிராக எனக்குச் சில காரியங்கள் உள்ளன: அங்கே பிலேயாமின் போதனையைப் பற்றிக்கொண்டிருப்பவர்கள் சிலர் உன்னிடம் இருக்கிறார்கள். அந்தப் பிலேயாம், இஸ்ரவேலின் மகன்களுக்கு[a] முன்பாக இடறுதற்கான கல்லை வைக்கும்படி, அதனால் அவர்கள் சிலைகளுக்குப் பலியிடப்பட்ட உணவை உண்ணவும் பாலியல் ஒழுக்கக்கேட்டில் ஈடுபடவும் பாலாக்குக்குக் கற்பித்தான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலின் பிள்ளைகள்” அல்லது “இஸ்ரவேலர்.” கிரேக்கத்தில் நேரடியாக “இஸ்ரவேலின் மகன்கள்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλίγα
  choice: சில குறைகள்
  rationale: நடுநிலைப் பன்மைச் சொல் பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது. ‘உனக்கு எதிராக’ என்ற தொடருடன் இயல்பான தமிழில் குற்றச்சாட்டுகளைக் குறிக்க ‘சில குறைகள்’ என வழங்கப்பட்டுள்ளது.
- source_word: κρατοῦντας τὴν διδαχὴν
  choice: போதனையைப் பற்றிக்கொண்டிருக்கிற
  rationale: இங்கு κρατέω உடலால் பிடிப்பதை அல்ல, ஒரு போதனையைத் தொடர்ந்து ஏற்றுக்கொண்டு அதில் நிலைத்திருப்பதைக் குறிக்கிறது.
- source_word: Βαλαάμ / Βαλὰκ
  choice: பிலேயாம் / பாலாக்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நன்கு அறியப்பட்ட பெயர் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
- source_word: ἐδίδασκεν
  choice: கற்பித்துவந்தான்
  rationale: இறந்தகாலத்தில் தொடர்ந்த அல்லது வழக்கமான செயலைக் காட்டும் கிரேக்க முற்றுப்பெறா இறந்தகாலத்தின் இயல்பைத் தமிழில் பாதுகாக்கிறது.
- source_word: βαλεῖν σκάνδαλον
  choice: இடறச் செய்யும் தடையை வைக்க
  rationale: σκάνδαλον என்பதிலுள்ள விழச்செய்யும் அல்லது பாவத்துக்கு இட்டுச்செல்லும் உருவகத்தை விளக்கமாக்கி முற்றிலும் கலைத்துவிடாமல் பாதுகாக்கிறது.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: மூலத்தின் நேரடியான ஆண்பால் பன்மை வடிவத்தைப் பாதுகாக்கிறது; தமிழில் புரிந்துகொள்ளக்கூடிய மரபுத் தொடராகவும் உள்ளது.
- source_word: φαγεῖν εἰδωλόθυτα
  choice: சிலைகளுக்குப் பலியிடப்பட்ட உணவை உண்ண
  rationale: εἰδωλόθυτα என்பது சிலைகளுக்குப் படைக்கப்பட்ட உணவு அல்லது இறைச்சியைக் குறிக்கிறது; பொதுவான சொல்லான ‘உணவு’ அதன் பரப்பைச் சுருக்காது.
- source_word: πορνεῦσαι
  choice: பாலியல் ஒழுக்கக்கேட்டில் ஈடுபட
  rationale: சட்டவிரோத அல்லது ஒழுக்கமற்ற பாலியல் நடத்தையைக் குறிக்கும் சொல்லின் பரந்த பொருளைத் தேவையின்றி ஒரு குறிப்பிட்ட செயலாகச் சுருக்காமல் வழங்குகிறது.
theological_decisions:
- issue: τῶν υἱῶν Ἰσραήλ என்பதை ஆண்பால் வடிவிலா அல்லது பொதுப்பால் வடிவிலா மொழிபெயர்ப்பது
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலின் மக்கள் / இஸ்ரவேலர்
  rationale: கிரேக்க மூலத்தில் உள்ள ‘மகன்கள்’ என்ற வடிவம் முதன்மை உரையில் பாதுகாக்கப்பட்டுள்ளது; அதன் வழக்குச் சார்ந்த கூட்டுப்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: σκάνδαλον என்ற உருவகத்தை எவ்வளவு நேரடியாக வழங்குவது
  choice: இடறச் செய்யும் தடை
  alternative: கண்ணி / பாவத்தில் விழச் செய்யும் வாய்ப்பு
  rationale: மூலத்தின் இடறல் உருவகத்தையும் ஒழுக்க வீழ்ச்சிக்கான தூண்டுதல் என்ற பொருளையும் பாதுகாக்கிறது; ‘கண்ணி’ என்பது உருவகத்தை மாற்றும், ‘பாவத்தில் விழச் செய்யும் வாய்ப்பு’ என்பது அதை விளக்கமாகத் தீர்மானிக்கும்.
- issue: ἐδίδασκεν என்ற முற்றுப்பெறா இறந்தகாலத்தின் கூறுநிலை
  choice: கற்பித்துவந்தான்
  alternative: கற்பித்தான்
  rationale: தொடர்ந்த அல்லது பண்புரீதியான செயல் என்ற சாத்தியத்தைப் பாதுகாக்கிறது; சூழல் அதை ஒரு தனித்த முடிவுற்ற செயலாகக் கட்டாயப்படுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘போதனை,’ ‘இடறச் செய்யும் தடை,’ ‘பாலியல் ஒழுக்கக்கேடு’ ஆகியவை தேவையற்ற சமயக் குழுச் சொற்களையும் மிகப் பழமையான நடையையும் தவிர்த்து, மூலத்தின் கருத்து மற்றும் உருவகத்தைப் பாதுகாக்கின்றன.
