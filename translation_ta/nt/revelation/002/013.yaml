id: REV.2.13
reference: Revelation 2:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀Οἶδα ποῦ κατοικεῖς, ὅπου ὁ θρόνος τοῦ Σατανᾶ, καὶ κρατεῖς τὸ ὄνομά μου, καὶ οὐκ ἠρνήσω τὴν πίστιν μου ⸀καὶ ἐν ταῖς ⸀ἡμέραις Ἀντιπᾶς, ὁ μάρτυς μου, ὁ πιστός ⸀μου, ὃς ἀπεκτάνθη παρ’ ὑμῖν, ὅπου ὁ Σατανᾶς κατοικεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/013.yaml
  text: I know where you live—where Satan’s throne is[a]. Yet you hold fast my name, and you did not deny faith in me, even in the days of Antipas, my witness, my faithful one, who was killed among you[b], where Satan lives.
translation:
  language: ta
  text: நீ எங்கே குடியிருக்கிறாய் என்பதை நான் அறிவேன்—அங்கே சாத்தானின் அரியணை இருக்கிறது. ஆனாலும், நீ என் பெயரை உறுதியாகப் பற்றிக்கொண்டிருக்கிறாய்; என் விசுவாசத்தை[a] மறுதலிக்கவில்லை. உங்களிடையே கொல்லப்பட்ட என் சாட்சியும் என் உண்மையுள்ளவனுமாகிய அந்திப்பாவின் நாட்களிலும்கூட, சாத்தான் குடியிருக்கும் அந்த இடத்தில், நீ அதை மறுதலிக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என்மேல் உள்ள விசுவாசத்தை’ என்றும், ‘என் உண்மைத்தன்மையை’ என்றும் பொருள் கொள்ளலாம். ‘என் விசுவாசம்’ என்ற கிரேக்கச் சொற்றொடர் சுருக்கமானது; அது ஒன்றுக்கு மேற்பட்ட விதங்களில் புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Οἶδα
  choice: எனக்குத் தெரியும்
  rationale: கிரேக்க நிறைவுக்கால வடிவத்தின் நிகழ்காலப் பொருளை இயல்பான நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: κατοικεῖς / κατοικεῖ
  choice: குடியிருக்கிறாய் / குடியிருக்கிற
  rationale: ஒரு இடத்தில் நிலையாக வாழ்வதைக் குறிக்கும் வினையை இயல்பாகத் தருகிறது; வசனத்தின் தொடக்கத்திலும் முடிவிலும் உள்ள மீளுருவாக்கத்தையும் காக்கிறது.
- source_word: ὅπου ὁ θρόνος τοῦ Σατανᾶ
  choice: அங்கேதான் சாத்தானின் அரியணை இருக்கிறது
  rationale: வெளிப்படுத்தின விசேஷத்துக்குரிய கூர்மையான உருவகத்தை விளக்கிப் பரப்பாமல் அப்படியே காக்கிறது.
- source_word: κρατεῖς τὸ ὄνομά μου
  choice: நீ என் பெயரை உறுதியாகப் பற்றிக்கொண்டிருக்கிறாய்
  rationale: κρατέω குறிக்கும் விடாப்பிடியான பற்றுதலையும் தொடர்ந்து நிலைக்கும் விசுவாசத்தையும் வெளிப்படுத்துகிறது; ‘பெயர்’ என்ற மூல உருவகத்தை மாற்றவில்லை.
- source_word: οὐκ ἠρνήσω
  choice: நீ மறுதலிக்கவில்லை
  rationale: ἀρνέομαι என்பதன் நேரடியான பொருளைத் தருகிறது; ‘துறக்கவில்லை’ என்பதைக் காட்டிலும் மூலத்தின் ‘மறுத்தல்’ கருத்தை நெருக்கமாகக் காக்கிறது.
- source_word: τὴν πίστιν μου
  choice: என் விசுவாசத்தை
  rationale: மூலத்தின் சுருக்கமான உரிமைவேற்றுமை அமைப்பைக் காத்து, ‘என்மேலுள்ள விசுவாசம்’ அல்லது ‘என் உண்மைத்தன்மை’ என்ற பொருள் வாய்ப்புகளை அடிக்குறிப்பில் தருகிறது.
- source_word: ἐν ταῖς ἡμέραις Ἀντιπᾶς
  choice: அந்திப்பா கொல்லப்பட்ட நாட்களிலும்கூட
  rationale: தமிழில் இயல்பான வாக்கிய ஒழுங்குக்காக காலச்சொற்றொடரை அந்திப்பாவின் கொலையோடு இணைக்கிறது; καί என்பதன் வலியுறுத்தலை ‘-லும்கூட’ தருகிறது.
- source_word: ὁ μάρτυς μου
  choice: என் சாட்சி
  rationale: μάρτυς என்பதன் அடிப்படைப் பொருளான ‘சாட்சி’ என்பதைக் காக்கிறது; மரணச் சூழலில் சாத்தியமான ‘இரத்தசாட்சி’ பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ὁ πιστός μου
  choice: எனக்கு உண்மையுள்ளவன்
  rationale: πιστός என்பதைக் தனிப்பட்ட இணைப்புப் பெயராகக் காத்து, முந்தைய ‘சாட்சி’ என்பதோடு ஒன்றாக்காமல் மொழிபெயர்க்கிறது.
- source_word: ἀπεκτάνθη παρ’ ὑμῖν
  choice: உங்களிடையே ... கொல்லப்பட்ட
  rationale: செயப்பாட்டு வினையையும், παρά + இடவேற்றுமை குறிக்கும் ‘உங்களிடையே’ என்ற இடப்பொருளையும் காக்கிறது; சபையினரே கொன்றனர் என்ற தவறான உட்பொருளைத் தவிர்க்கிறது.
theological_decisions:
- issue: τὴν πίστιν μου என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘என் விசுவாசத்தை’ என்று மூலத்தின் சுருக்கமான அமைப்பு காக்கப்பட்டது.
  alternative: ‘என்மேலுள்ள விசுவாசத்தை’ அல்லது ‘என் உண்மைத்தன்மையை’
  rationale: μου என்பது பொருள்சார் உரிமைவேற்றுமையாகவோ எழுவாய்சார் உரிமைவேற்றுமையாகவோ புரிந்துகொள்ளப்படலாம். அந்த உண்மையான பொருள் இருமையை முதன்மை உரை தீர்த்துவிடாமல், மாற்றுப் புரிதல்களை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
- issue: மரணச் சூழலில் μάρτυς என்பதன் மொழிபெயர்ப்பு
  choice: ‘சாட்சி’
  alternative: ‘இரத்தசாட்சி’
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘சாட்சி’; அந்திப்பா கொல்லப்பட்டதாக வசனமே தெளிவாகச் சொல்கிறது. ஆகவே பிற்காலத் தொழில்நுட்பச் சொல்லை முதன்மை உரையில் கட்டாயப்படுத்தாமல், சூழலுக்கு ஏற்ற மாற்றுப் பொருளை அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ஒருமை ‘நீ’ என்பது பெர்கமுவிலுள்ள சபையின் தூதனை நோக்கிய கிரேக்க ஒருமையைப் பின்பற்றுகிறது; ‘உங்களிடையே’ என்பது அங்குள்ள சமூகத்தைச் சுட்டும் மூலப் பன்மையை காக்கிறது. வெளிப்படுத்தின விசேஷத்தின் உருவக வலிமையைப் பேண ‘சாத்தானின் அரியணை’ நேரடியாக வைக்கப்பட்டது.
