id: REV.2.2
reference: Revelation 2:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Οἶδα τὰ ἔργα σου, καὶ τὸν ⸀κόπον καὶ τὴν ὑπομονήν σου, καὶ ὅτι οὐ δύνῃ βαστάσαι κακούς, καὶ ἐπείρασας τοὺς λέγοντας ἑαυτοὺς ⸀ἀποστόλους, καὶ οὐκ εἰσίν, καὶ εὗρες αὐτοὺς ψευδεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/002.yaml
  text: I know your works[a], your labor, and your endurance, and that you cannot tolerate evil people. You tested those who call themselves apostles and are not[b], and you found them to be false.
translation:
  language: ta
  text: உன் செயல்களையும், உன் கடின உழைப்பையும், உன் விடாமுயற்சியையும் நான் அறிவேன். தீயவர்களை உன்னால் பொறுத்துக்கொள்ள முடியாது[a] என்பதையும் அறிவேன். தங்களை அப்போஸ்தலர்கள் என்று சொல்லிக்கொள்கிறவர்களை[b] நீ சோதித்தாய். அவர்கள் அப்போஸ்தலர்கள் அல்ல; அவர்கள் பொய்யானவர்கள் என்று கண்டறிந்தாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீயவர்களை நீ சகித்துக்கொள்வதில்லை.” கிரேக்கத்தில் சொல்லர்த்தமாக “தாங்க முடியாது”; இங்கு அவர்களைப் பொறுத்துக்கொள்ள மறுப்பது என்ற நுணுக்கமும் இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தாங்கள் அப்போஸ்தலர்கள் என்று கூறுகிறவர்களை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδα
  choice: நான் அறிவேன்
  rationale: நிகழ்நிலையான அறிவையும், சபையை மதிப்பிடுகிற கிறிஸ்துவின் நேரடியான உரையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὰ ἔργα σου
  choice: உன் செயல்களை
  rationale: ἔργα என்பதன் பரந்த பொருளான செயல்கள் அல்லது செய்கைகளை நவீன தமிழில் தெளிவாகக் கொடுக்கிறது.
- source_word: τὸν κόπον
  choice: கடின உழைப்பை
  rationale: κόπος குறிக்கும் களைப்பை உண்டாக்கும் தீவிர உழைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὴν ὑπομονήν
  choice: விடாமுயற்சியை
  rationale: நெருக்கடியிலும் தொடர்ந்து நிலைத்திருப்பதை உணர்த்துகிறது; வெறும் செயலற்ற பொறுமை என்ற எண்ணத்தைத் தவிர்க்கிறது.
- source_word: οὐ δύνῃ βαστάσαι
  choice: உன்னால் பொறுத்துக்கொள்ள முடியாது
  rationale: சொல்லர்த்திலுள்ள ‘தாங்க முடியாது’ என்பதையும், சூழலில் உள்ள ‘சகித்துக்கொள்ளாமல் இருத்தல்’ என்ற அறநெறிசார் வலிமையையும் இணைக்கிறது.
- source_word: κακούς
  choice: தீயவர்கள்
  rationale: ஆண்பால் பன்மை பெயரடையாக இருந்தாலும் இங்கு பொதுவாகத் தீய மனிதர்களைக் குறிப்பதால் பாலினத்தைத் தேவையின்றிக் குறுக்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἐπείρασας
  choice: சோதித்தாய்
  rationale: அவர்களின் உரிமைக்கூற்றை ஆராய்ந்து உண்மைத்தன்மையைப் பரிசோதித்த செயலை நேரடியாகக் குறிக்கிறது.
- source_word: λέγοντας ἑαυτοὺς ἀποστόλους
  choice: தங்களை அப்போஸ்தலர்கள் என்று சொல்லிக்கொள்கிறவர்கள்
  rationale: ἑαυτούς என்பதிலுள்ள தம்மைப் பற்றிய உரிமைக்கூற்றைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἀποστόλους
  choice: அப்போஸ்தலர்கள்
  rationale: இச்சபைச் சூழலில் பொதுவான ‘தூதர்கள்’ என்பதைவிட அதிகார உரிமை கோரும் அப்போஸ்தலர் என்ற சிறப்புப் பொருள் பொருத்தமானது.
- source_word: ψευδεῖς
  choice: பொய்யர்கள்
  rationale: அவர்கள் முன்வைத்த அடையாள உரிமை பொய்யானது என்பதை இயல்பான தமிழில் வலுவாகக் கூறுகிறது; வடிவரீதியான ‘பொய்யானவர்கள்’ என்பதைக் காட்டிலும் வாசிக்க எளிதானது.
theological_decisions:
- issue: ἀποστόλους என்பது சிறப்புப் பதவியா, பொதுவான தூதர்களா?
  choice: அப்போஸ்தலர்கள்
  alternative: தூதர்கள்
  rationale: சபைக்குள் அதிகாரம் கோரியவர்களின் உண்மைத்தன்மை சோதிக்கப்படுவதே சூழல். ஆகவே சிறப்புப் பொருளை வைத்திருப்பது உரையின் மையத் திணிவைப் பாதுகாக்கிறது; பின்னாளைய எந்த நிறுவனக் கோட்பாட்டையும் இதில் சேர்க்கவில்லை.
- issue: οὐ δύνῃ βαστάσαι என்பது இயலாமையா அல்லது சகிக்க மறுப்பதா?
  choice: உன்னால் பொறுத்துக்கொள்ள முடியாது
  alternative: நீ சகித்துக்கொள்வதில்லை
  rationale: கிரேக்கத்தின் திறன் சார்ந்த இலக்கண வடிவத்தை முதன்மையாக வைத்தபடியே, சூழலில் உள்ள அறநெறிசார் சகிப்பின்மையையும் தமிழ் சொற்றொடர் உணர்த்துகிறது. மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியும் கண்ணியமுமான ஒருமை முகவரி பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் σου மற்றும் வினைச்சொற்கள் ஒருமையில் இருப்பதால் ‘உன்/நீ’ காக்கப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியம் தமிழ் வாசிப்பின் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; கருத்துச் சம்பந்தம் மாற்றப்படவில்லை.
