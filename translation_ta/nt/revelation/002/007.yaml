id: REV.2.7
reference: Revelation 2:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. τῷ νικῶντι δώσω αὐτῷ φαγεῖν ἐκ τοῦ ξύλου τῆς ζωῆς, ὅ ἐστιν ἐν τῷ παραδείσῳ τοῦ ⸀θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/007.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches. To the one who conquers I will give to eat from the tree of life, which is in the paradise of God.
translation:
  language: ta
  text: கேட்கக் காதுள்ளவன், ஆவியானவர் சபைகளுக்குச் சொல்வதைக் கேட்கட்டும். வெற்றிபெறுகிறவனுக்கு[a] தேவனுடைய பரதீசில் இருக்கும் வாழ்வின் மரத்திலிருந்து உண்ணக் கொடுப்பேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெல்லுகிறவனுக்கு.”
    reason: νικάω என்பதற்கு வெற்றிபெறுதல், வெல்லுதல் ஆகிய நெருங்கிய பொருள் நிழல்கள் உள்ளன; மாற்று மொழிபெயர்ப்பு மரபான ‘overcomes’ சொல்லாட்சியைத் தெளிவாகப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: கேட்கக் காதுள்ளவன்
  rationale: கிரேக்கத்தில் ஒருமையில் உள்ள வழக்குச் சொற்றொடரைத் தமிழில் இயல்பாகவும் அதன் அழைப்புத் தன்மையைத் தெளிவாகவும் வெளிப்படுத்துகிறது; ‘கேட்க’ என்பது பொருளை விளக்கும் இயல்பான தமிழ்ச் சேர்க்கை.
- source_word: ἀκουσάτω
  choice: கேட்கட்டும்
  rationale: மூன்றாம் நபர் ஒருமை கட்டளை வடிவத்தின் அறிவுறுத்தும் வலிமையைத் தக்கவைக்கிறது.
- source_word: τὸ πνεῦμα
  choice: ஆவியானவர்
  rationale: வெளிப்படுத்தல் 2–3 இல் திரும்பத் திரும்ப வரும் இச்சூத்திரத்தில் குறிக்கப்படுவது பரிசுத்த ஆவியானவர்; தமிழில் மரியாதை ஒருமை இதை இயல்பாகக் குறிக்கிறது.
- source_word: λέγει ταῖς ἐκκλησίαις
  choice: சபைகளுக்குச் சொல்வதை
  rationale: நிகழ்கால வினையின் பொருளையும் பன்மை ἐκκλησίαις என்பதையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: τῷ νικῶντι
  choice: வெற்றிபெறுகிறவனுக்கு
  rationale: νικάω என்பதிலுள்ள வெற்றி/மேற்கொள்ளுதல் சார்ந்த உருவகத்தைத் தக்கவைத்து, நவீனத் தமிழில் தெளிவாக உள்ளது.
- source_word: δώσω αὐτῷ φαγεῖν
  choice: உண்ணக் கொடுப்பேன்
  rationale: தமிழில் பெறுநர் ஏற்கெனவே ‘வெற்றிபெறுகிறவனுக்கு’ எனக் குறிக்கப்பட்டதால், கிரேக்கத்தின் கொடுத்தல் மற்றும் உண்ணுதல் ஆகிய இரண்டையும் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐκ τοῦ ξύλου τῆς ζωῆς
  choice: வாழ்வின் மரத்திலிருந்து
  rationale: ἐκ என்பதன் மூலத்தைக் குறிக்கும் பொருளை ‘-இலிருந்து’ தக்கவைக்கிறது; ξύλον இச்சூழலில் மரத்தைக் குறிக்கிறது.
- source_word: παραδείσῳ
  choice: பரதீசில்
  rationale: சாதாரணத் தோட்டம் எனச் சமப்படுத்தாமல், இறுதிக்கால மற்றும் வேதாகம இடைஉரைத் தொடர்புடைய παράδεισος என்பதன் தனித்துவத்தைப் பாதுகாக்கிறது.
- source_word: τοῦ θεοῦ
  choice: தேவனுடைய
  rationale: உடைமை/சார்பு பொருளுள்ள கிரேக்கப் பிறப்புவேற்றுமையை இயல்பான தமிழில் அளிக்கிறது.
theological_decisions:
- issue: τὸ πνεῦμα என்பதன் குறிப்பு
  choice: ஆவியானவர்
  alternative: ஆவி
  rationale: சபைகளோடு தெய்வீகமாகப் பேசும் வெளிப்படுத்தல் 2–3 இன் தொடர்ச்சியான சூழல் பரிசுத்த ஆவியானவரைக் குறிக்கிறது; வசனத்தில் இல்லாத விளக்கப் பெயரைச் சேர்க்காமல் இதை வெளிப்படுத்துகிறது.
- issue: νικάω என்பதன் மொழிபெயர்ப்பு
  choice: வெற்றிபெறுகிறவன்
  alternative: மேற்கொள்ளுகிறவன்
  rationale: வெளிப்படுத்தலில் உள்ள போராட்டம் மற்றும் வெற்றி உருவகத்தைத் தெளிவாகத் தக்கவைக்கிறது; மற்றொரு மரபான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: பிரதிநிதித்துவ ஒருமை
  choice: காதுள்ளவன் / வெற்றிபெறுகிறவன்
  alternative: காதுள்ளவர் / வெற்றிபெறுகிறவர்
  rationale: கிரேக்க ஆண்பால் ஒருமை வடிவங்களைப் பிரதிநிதித்துவ ஒருமையாகத் தக்கவைக்கிறது; இதை ஆண்களுக்கு மட்டும் எனச் சுருக்கவில்லை.
- issue: வாழ்வின் மரத்தின் இருப்பிடம்
  choice: தேவனுடைய பரதீசில் இருக்கும்
  alternative: தேவனுடைய பரதீசின் நடுவில் இருக்கும்
  rationale: SBLGNT உரையில் ‘நடுவில்’ என்பதற்கான சொல் இல்லை; ஆகவே இருப்பிடத்தை மட்டும் மொழிபெயர்த்து, பிற்கால அல்லது மாற்று வாசகத்தை இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பானாலும் கண்ணியமான வேதாகம நடையைப் பேணுகிறது. ‘சபைகள்’, ‘ஆவியானவர்’, ‘பரதீசு’ ஆகியவை சூழலுக்கேற்ற நிலைபெற்ற சொற்களாகப் பயன்படுத்தப்பட்டுள்ளன.
