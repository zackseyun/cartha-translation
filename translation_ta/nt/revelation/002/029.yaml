  text: The one who has an ear, let him hear what the Spirit says to the churches.
translation:
  language: ta
  text: கேட்கக் காது உள்ளவன், ஆவியானவர் சபைகளுக்குச் சொல்வதைக் கேட்கட்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: கேட்கக் காதுள்ளவன்
  rationale: சொற்பொருளில் ‘காதுள்ளவன்’ என்ற ஒருமை உருவகத்தைப் பாதுகாத்து, தமிழில் அதன் நோக்கமான கவனித்துக் கேட்கும் திறனையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀκουσάτω
  choice: கேட்கட்டும்
  rationale: மூன்றாம் நபர் ஒருமை கட்டளை வடிவத்தின் அழைப்பையும், வெளிப்படுத்தின விசேஷத்தில் திரும்பத் திரும்ப வரும் உருக்கமான வாய்பாட்டையும் பாதுகாக்கிறது.
- source_word: τί
  choice: சொல்வதை
  rationale: ஆவியானவர் பேசுவதன் உள்ளடக்கத்தை இயல்பான தமிழில் குறிக்கிறது; ‘எதை’ என்று தனியாக மொழிபெயர்ப்பதைவிட இச்சார்பு வடிவம் தெளிவானது.
- source_word: τὸ πνεῦμα
  choice: ஆவியானவர்
  rationale: இச்சூழலில் சபைகளிடம் பேசும் தெய்வீக ஆவியைக் குறிக்கிறது. தமிழ்க் கிறிஸ்தவ வழக்கில் மரியாதையுடனும் நபர்த்தன்மையுடனும் இயல்பாக வழங்கும் சொல் இது.
- source_word: λέγει
  choice: சொல்கிறார்
  rationale: நிகழ்காலத்தின் தொடரும் அல்லது வழக்கமான பேச்சுச் செயலை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ταῖς ἐκκλησίαις
  choice: சபைகளுக்கு
  rationale: வெளிப்படுத்தின விசேஷம் 2–3 அதிகாரங்களில் முகவரிகளாக உள்ள விசுவாசிகளின் உள்ளூர் கூட்டங்களைக் குறிக்கும் நிறுவப்பட்ட, சூழலுக்குப் பொருத்தமான தமிழ் சொல்.
theological_decisions:
- issue: τὸ πνεῦμα என்பதன் குறிப்பு
  choice: சபைகளிடம் பேசும் பரிசுத்த ஆவியானவர்
  alternative: ஒரு மனித ஆவி அல்லது இயேசுவின் செய்தியின் ‘ஆவி’
  rationale: வெளிப்படுத்தின விசேஷம் 2–3 அதிகாரங்களின் திரும்பவரும் முடிவுரை, எல்லாச் சபைகளுக்கும் செய்திகளின் வழியாகப் பேசும் தெய்வீக ஆவியாக இவரை முன்வைக்கிறது. மூலவசனத்தில் இல்லாத ‘பரிசுத்த’ என்ற சொல்லை உரையில் சேர்க்காமல், ‘ஆவியானவர்’ என்பது அந்தக் குறிப்பை மரியாதையுடன் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு புரியும் வகையில், அதேவேளை வேதாகம அழைப்பின் கண்ணியமும் உருக்கமும் காக்கப்பட்டுள்ளன. கிரேக்கத்தின் ஒருமை அமைப்பும் கட்டளை வலிமையும் பாதுகாக்கப்பட்டுள்ளன.
