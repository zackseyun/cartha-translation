source:
  edition: SBLGNT
  text: ἰδοὺ βάλλω αὐτὴν εἰς κλίνην, καὶ τοὺς μοιχεύοντας μετ’ αὐτῆς εἰς θλῖψιν μεγάλην, ἐὰν μὴ ⸀μετανοήσωσιν ἐκ τῶν ἔργων αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/022.yaml
  text: Look[a], I am throwing her onto a bed, and those who commit adultery with her into great affliction[b], unless they repent of her works.
translation:
  language: ta
  text: இதோ, நான் அவளைப் படுக்கையில் தள்ளுகிறேன்[a]; அவளோடு விபசாரம் செய்கிறவர்களை, அவர்கள் அவளுடைய செயல்களிலிருந்து மனந்திரும்பாவிட்டால், கடும் துன்பத்தில் தள்ளுகிறேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு நோய்ப்படுக்கையில்.” கிரேக்கத்தில் நேரடியாக “ஒரு படுக்கையில்” என்று உள்ளது; தீர்ப்பின் இந்தச் சூழலில், இதைத் துன்பம் அல்லது நோயின் படுக்கை என்று பலர் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மிகுந்த உபத்திரவத்தில்.” இச்சொற்றொடர் கடுமையான துன்பம் அல்லது நெருக்கடியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் இயல்பான, கண்ணியமான தமிழ் இடைச்சொல்; தீர்ப்பின் உடனடித் தன்மையையும் எடுத்துக்காட்டுகிறது.
- source_word: βάλλω αὐτὴν εἰς κλίνην
  choice: நான் அவளை ஒரு படுக்கையில் தள்ளுகிறேன்
  rationale: βάλλω என்பதன் தீவிரமான நிகழ்காலத்தையும் κλίνη என்பதன் வெளிப்படையான ‘படுக்கை’ என்ற பொருளையும் காக்கிறது; ‘நோய்ப்படுக்கை’ என்ற சூழல்சார் விளக்கத்தை முதன்மை உரைக்குள் சேர்க்கவில்லை.
- source_word: τοὺς μοιχεύοντας μετ’ αὐτῆς
  choice: அவளோடு விபசாரம் செய்கிறவர்கள்
  rationale: μοιχεύω என்பதன் நேரடியான விபசாரப் பொருளைக் காக்கிறது; ஆன்மீகத் துரோகத்தை மட்டும் குறிக்கும் பொதுமைப்படுத்தலாக மாற்றவில்லை.
- source_word: εἰς θλῖψιν μεγάλην
  choice: கடும் உபத்திரவத்தில்
  rationale: θλῖψις குறிக்கும் தீவிரமான துன்பம், நெருக்கடி ஆகியவற்றை ‘கடும் உபத்திரவம்’ இயல்பாக வெளிப்படுத்துகிறது; ‘மிகுந்த துன்பம்’ என்பது மாற்றாகக் குறிப்பில் தரப்படுகிறது.
- source_word: ἐὰν μὴ μετανοήσωσιν ἐκ τῶν ἔργων αὐτῆς
  choice: அவளுடைய செயல்களைவிட்டு மனந்திரும்பாவிட்டால்
  rationale: ἐκ என்பதன் ‘விட்டு விலகுதல்’ என்ற இயக்கத்தை வெளிப்படையாகக் காட்டி, மனந்திரும்புதல் அவளுடைய செயல்களிலிருந்து திரும்புவதைச் சுட்டுகிறது.
theological_decisions:
- issue: κλίνη என்பதை வெளிப்படையாக ‘நோய்ப்படுக்கை’ என்று விளக்க வேண்டுமா
  choice: முதன்மை உரையில் ‘படுக்கை’ என்று வைத்தல்
  alternative: நோய்ப்படுக்கை
  rationale: சூழல் தீர்ப்பைக் குறித்தாலும், κλίνη என்ற சொல்லே நோயை வெளிப்படையாகக் கூறவில்லை. ஆகவே உண்மையான பொருள் நிச்சயமின்மையைப் பாதுகாத்து, விளக்க வாசிப்பை அடிக்குறிப்பில் தருகிறது.
- issue: μοιχεύοντας என்பது சொல்லர்த்தமான பாலியல் விபசாரமா அல்லது உருவகமான ஆன்மீகத் துரோகமா
  choice: ‘விபசாரம் செய்கிறவர்கள்’ என்ற சொல்லர்த்தத்தை வைத்தல்
  alternative: அவளோடு உண்மையற்றவர்களாய் இருப்பவர்கள்
  rationale: வெளிப்படுத்தின விசேஷத்தின் உருவகச் சூழல் ஆன்மீகப் பொருளையும் கொண்டிருக்கலாம்; இருந்தாலும் மொழிபெயர்ப்பு மூலத்தின் திடமான பாலியல் உருவகத்தைப் பொதுமைப்படுத்தாமல் காக்கிறது.
- issue: நிபந்தனைக்குரிய ‘அவர்கள்’ யாரைச் சுட்டுகிறது
  choice: அவளோடு விபசாரம் செய்கிறவர்களைச் சுட்டுமாறு இயல்பான தமிழ் தொடரமைப்பு
  alternative: அவளையும் அவர்களையும் சேர்த்துக் குறிக்கும் வாசிப்பு
  rationale: μετανοήσωσιν என்பது பன்மை; அருகிலுள்ள பன்மை எழுவாய் விபசாரம் செய்கிறவர்களே. தமிழ் உரை இதைத் தெளிவாக்கினாலும், அவர்கள் மனந்திரும்ப வேண்டியது ‘அவளுடைய செயல்களிலிருந்து’ என்பதைக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘இதோ’, ‘மனந்திரும்புதல்’, ‘உபத்திரவம்’ ஆகியவை வேதாகமப் பதிவைத் தக்கவைத்தாலும் இன்றைய வாசகனுக்குப் புரியக்கூடியவை. கிரேக்கத்தில் βάλλω ஒருமுறை மட்டுமே வந்தாலும், அது அவளுக்கும் அவளோடு விபசாரம் செய்கிறவர்களுக்கும் வேறு வேறு இலக்குகளை ஆள்கிறது; இயல்பான தமிழுக்காக இரண்டாவது இடத்தில் ‘தள்ளுவேன்’ மீண்டும் வழங்கப்பட்டுள்ளது.
