revisions:
- from: இதோ, நான் அவளை ஒரு படுக்கையில் தள்ளுகிறேன்[a]; அவளோடு விபசாரம் செய்கிறவர்களும் அவளுடைய செயல்களைவிட்டு மனந்திரும்பாவிட்டால், அவர்களைக் கடும் உபத்திரவத்தில் தள்ளுவேன்[b].
  to: இதோ, நான் அவளைப் படுக்கையில் தள்ளுகிறேன்[a]; அவளோடு விபசாரம் செய்கிறவர்களை, அவர்கள் அவளுடைய செயல்களிலிருந்து மனந்திரும்பாவிட்டால், கடும் துன்பத்தில் தள்ளுகிறேன்[b].
