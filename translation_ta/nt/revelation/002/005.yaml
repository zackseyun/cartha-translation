id: REV.2.5
reference: Revelation 2:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μνημόνευε οὖν πόθεν ⸀πέπτωκας, καὶ μετανόησον καὶ τὰ πρῶτα ἔργα ποίησον· εἰ δὲ μή, ἔρχομαί ⸀σοι, καὶ κινήσω τὴν λυχνίαν σου ἐκ τοῦ τόπου αὐτῆς, ἐὰν μὴ μετανοήσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/005.yaml
  text: Therefore remember from where you have fallen[a], and repent, and do the works you did at first. But if not, I am coming to you, and I will remove your lampstand from its place[b], unless you repent.
translation:
  language: ta
  text: ஆகவே, நீ எங்கிருந்து விழுந்திருக்கிறாய் என்பதை நினைவில் கொள்[a]; மனந்திரும்பி, முதலில் செய்த செயல்களைச் செய். ஆனால் நீ அவ்வாறு செய்யாவிட்டால், நான் உன்னிடம் வருகிறேன்; நீ மனந்திரும்பாவிட்டால், உன் விளக்குத்தண்டை அதன் இடத்திலிருந்து அகற்றிவிடுவேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எவ்வளவு உயரத்திலிருந்து விழுந்திருக்கிறாய்.’ கிரேக்க மூலம் நேரடியாக ‘எங்கிருந்து விழுந்திருக்கிறாய்’ என்கிறது; சிலர் இதில் உயரத்திலிருந்து விழும் உருவகம் மறைமுகமாக இருப்பதாகப் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
  - marker: b
    text: வெளிப்படுத்தல் 1:20-இல் ‘விளக்குத்தண்டு’ ஒரு சபையைக் குறிக்கும் உருவகமாகப் பயன்படுத்தப்படுகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: μνημόνευε
  choice: நினைவுகூர்ந்து
  rationale: நிகழ்காலக் கட்டளையின் தொடர்ச்சியான நினைவுகூர்தலைச் சுட்டுகிறது; அடுத்த கட்டளைகளுடன் இயல்பாக இணைவதற்காகத் தமிழ் வினையெச்ச வடிவம் பயன்படுத்தப்பட்டது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய கண்டனத்திலிருந்து வரும் முடிவுறுத்தலைத் தெளிவாகக் காட்டுகிறது.
- source_word: πόθεν
  choice: எங்கிருந்து
  rationale: கிரேக்கச் சொல்லின் நேரடியான பொருளைப் பாதுகாக்கிறது; உரையில் வெளிப்படையாக இல்லாத ‘எவ்வளவு உயரத்திலிருந்து’ என்ற விளக்கத்தை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: πέπτωκας
  choice: விழுந்திருக்கிறாய்
  rationale: நிறைவுக்காலத்தின், நிகழ்ந்து முடிந்த வீழ்ச்சியால் இப்போதும் நிலவும் விளைவைத் தமிழில் வெளிப்படுத்துகிறது; ‘விசுவாசத்தை விட்டு விலகினாய்’ போன்ற கூடுதல் இறையியல் பொருளைச் சேர்க்கவில்லை.
- source_word: μετανόησον / μετανοήσῃς
  choice: மனந்திரும்பு / மனந்திரும்பாவிட்டால்
  rationale: ஒழுக்க மற்றும் ஆவிக்குரிய சூழலில் மனப்போக்கையும் வழியையும் மாற்றித் திரும்புவதைக் குறிக்கும் இயல்பான, நிலைபெற்ற தமிழ் சொல்.
- source_word: τὰ πρῶτα ἔργα
  choice: முதலில் செய்த செயல்கள்
  rationale: சபையின் முந்தைய நிலையைக் குறிப்பதான காலப்பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ποίησον
  choice: செய்
  rationale: ποιέω என்பதன் பரந்த பொருளையும் கட்டளையின் சுருக்கத்தையும் நேரடியாகக் காக்கிறது.
- source_word: εἰ δὲ μή
  choice: இல்லையென்றால்
  rationale: எச்சரிக்கையை அறிமுகப்படுத்தும் நிபந்தனைத் திருப்பத்தைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἔρχομαί σοι
  choice: நான் உன்னிடம் வந்து
  rationale: கிரேக்க நிகழ்காலத்தின் நெருக்கமான எச்சரிக்கை உணர்வைத் தக்கவைத்தபடி, அடுத்த எதிர்கால வினையுடன் இயல்பான தமிழில் இணைக்கிறது; மூலத்தில் இல்லாத ‘உனக்கு எதிராக’ என்பதைச் சேர்க்கவில்லை.
- source_word: κινήσω
  choice: அகற்றிவிடுவேன்
  rationale: அதன் இடத்திலிருந்து நகர்த்துதல் என்ற சூழல் தரும் அகற்றும் தீர்ப்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: τὴν λυχνίαν σου
  choice: உன் விளக்குத்தண்டு
  rationale: இது விளக்கை அல்ல, விளக்கைத் தாங்கும் தண்டைக் குறிக்கிறது; வெளிப்படுத்தல் 1:20-இல் உள்ள உருவகத்தையும் பாதுகாக்கிறது.
- source_word: ἐκ τοῦ τόπου αὐτῆς
  choice: அதன் இடத்திலிருந்து
  rationale: மூலத்தின் இடத்தைக் குறிக்கும் சொற்றொடரை இயல்பான தமிழில் நேரடியாகத் தருகிறது.
theological_decisions:
- issue: விளக்குத்தண்டு அகற்றப்படும் என்ற எச்சரிக்கையின் தன்மை
  choice: சபையின் விளக்குத்தண்டு அகற்றப்படும் என்ற உருவகத்தை விளக்கித் தீர்க்காமல் அப்படியே வைத்தல்
  alternative: சபையின் சாட்சியை இழத்தல்; சபையின் இருப்பு அல்லது அங்கீகாரத்தின் மீதான தீர்ப்பு; தனிநபர் இரட்சிப்பை இழத்தல்
  rationale: வெளிப்படுத்தல் 1:20 விளக்குத்தண்டுகளைச் சபைகளாக அடையாளப்படுத்துகிறது. ஆனால் இவ்வசனம் தனிநபரின் இரட்சிப்பைப் பற்றிய முறைப்படுத்தப்பட்ட இறையியல் முடிவை வெளிப்படையாகக் கூறவில்லை. எனவே மொழிபெயர்ப்பு உருவகத்தையும் அதன் இறையியல் அழுத்தத்தையும் தீர்க்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் திருவெளிப்பாட்டுக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘கிரியைகள்’ என்பதற்குப் பதில் இயல்பான ‘செயல்கள்’ பயன்படுத்தப்பட்டது; ‘விளக்குத்தண்டு’ என்ற காட்சிப்படிமம் மாற்றமின்றி வைக்கப்பட்டது.
