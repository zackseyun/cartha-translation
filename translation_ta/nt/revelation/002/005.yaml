revisions:
- from: ஆகவே, நீ எங்கிருந்து விழுந்திருக்கிறாய் என்பதை நினைவுகூர்ந்து[a], மனந்திரும்பி, முதலில் செய்த செயல்களைச் செய். இல்லையென்றால், நீ மனந்திரும்பாவிட்டால், நான் உன்னிடம் வந்து, உன் விளக்குத்தண்டை அதன் இடத்திலிருந்து அகற்றிவிடுவேன்[b].
  to: ஆகவே, நீ எங்கிருந்து விழுந்திருக்கிறாய் என்பதை நினைவில் கொள்[a]; மனந்திரும்பி, முதலில் செய்த செயல்களைச் செய். ஆனால் நீ அவ்வாறு செய்யாவிட்டால், நான் உன்னிடம் வருகிறேன்; நீ மனந்திரும்பாவிட்டால், உன் விளக்குத்தண்டை அதன் இடத்திலிருந்து அகற்றிவிடுவேன்[b].
  rationale: 'The revision restores the source sequence: the initial “if not” concerns the preceding commands, and the final “unless you repent” qualifies the announced coming and lampstand removal. It also uses a direct, idiomatic imperative for the ongoing command to remember. No doctrinal interpretation of lampstand removal has been added.'
  reviewer_model: gpt-5.6-terra
