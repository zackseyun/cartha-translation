id: REV.2.4
reference: Revelation 2:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλὰ ἔχω κατὰ σοῦ ὅτι τὴν ἀγάπην σου τὴν πρώτην ἀφῆκες.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/004.yaml
  text: 'But I have this against you: you have abandoned your first love[a].'
translation:
  language: ta
  text: 'ஆனால், உனக்கு எதிராக எனக்கு ஒரு குறை உண்டு: உன் முதல் அன்பை நீ விட்டுவிட்டாய்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் முதல் அன்பை நீ கைவிட்டாய்.” இச்சொற்றொடர், அவர்கள் தொடக்கத்தில் கொண்டிருந்த அன்பைக் குறிக்கலாம்—அது ஆண்டவர்மீது கொண்ட அன்பாகவோ, ஒருவருக்கொருவர் கொண்ட அன்பாகவோ, அல்லது இரண்டுமாகவோ இருக்கலாம்.
    reason: ἀφῆκες என்பதற்கான இயல்பான மாற்று “கைவிட்டாய்” என்பதையும், “முதல் அன்பு” என்பதன் திறந்த குறிப்பையும் பதிவு செய்கிறது.
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய பாராட்டுக்கு நேர்மாறான கடுமையான திருப்பத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ் இணைப்புச்சொல்.
- source_word: ἔχω κατὰ σοῦ
  choice: உனக்கு எதிராக என்னிடம் ஒரு குறை உண்டு
  rationale: ஒருவர்மீது குற்றச்சாட்டு அல்லது புகார் இருப்பதைக் குறிக்கும் கிரேக்க மரபுத்தொடரின் கண்டிக்கும் வலிமையைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ὅτι
  choice: ':'
  rationale: குறையின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் சொல்லைத் தமிழில் முக்காற்புள்ளி இயல்பாக வெளிப்படுத்துகிறது; காரணப் பொருளை தேவையின்றி புகுத்துவதில்லை.
- source_word: ἀγάπην
  choice: அன்பை
  rationale: ἀγάπη என்பதற்கான நேரடியான, வழக்கமான தமிழ் இணைச்சொல்; சூழல் வேறு பொருளைக் கோரவில்லை.
- source_word: τὴν πρώτην
  choice: முதல்
  rationale: கிரேக்கத்தின் நேரடியான பொருளைப் பாதுகாக்கிறது; ‘முந்தைய’ அல்லது ‘தொடக்கத்தில் இருந்த’ என்று விளக்கி அதன் திறந்த பொருளைச் சுருக்குவதில்லை.
- source_word: ἀφῆκες
  choice: விட்டுவிட்டாய்
  rationale: இங்கு ἀφίημι என்பது விட்டுச் செல்லுதல் அல்லது கைவிடுதல் என்று பொருள்படும். ‘விட்டுவிட்டாய்’ என்பது இயல்பான நவீனத் தமிழில் செயலின் தீவிரத்தையும் நிறைவுற்ற தன்மையையும் தெரிவிக்கிறது; ‘கைவிட்டாய்’ என்பது சாத்தியமான மேலும் வலுவான மாற்று.
theological_decisions:
- issue: “உன் முதல் அன்பு” என்பதன் குறிப்பு
  choice: யார்மீதான அன்பு என்று குறிப்பிடாமல் “உன் முதல் அன்பு” என நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: ஆண்டவர்மீது தொடக்கத்தில் கொண்டிருந்த அன்பு; ஒருவர்மீது ஒருவர் தொடக்கத்தில் கொண்டிருந்த அன்பு; அல்லது இரண்டும்.
  rationale: கிரேக்கச் சொற்றொடர் சுருக்கமாகவும் பொருள் திறந்ததாகவும் உள்ளது. அது கிறிஸ்துவின்மீதான அன்பையா, சக விசுவாசிகளின்மீதான அன்பையா, இரண்டையுமா குறிக்கிறது என்பதை மொழிபெயர்ப்பு தீர்மானிக்காமல் மூலத்தின் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையான அதேவேளை கண்ணியமான கண்டிப்பு நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை இரண்டாம் நபர் வடிவங்கள் மூலத்தின் σοῦ மற்றும் ἀφῆκες ஆகியவற்றைப் பின்பற்றுகின்றன.
