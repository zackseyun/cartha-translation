id: REV.2.19
reference: Revelation 2:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Οἶδά σου τὰ ἔργα, καὶ τὴν ⸂ἀγάπην καὶ τὴν πίστιν⸃ καὶ τὴν διακονίαν καὶ τὴν ὑπομονήν σου, καὶ τὰ ἔργα σου τὰ ἔσχατα πλείονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/019.yaml
  text: I know your works[a], your love and faith and service and endurance, and that your last works are more than the first.
translation:
  language: ta
  text: உன் செயல்களையும், உன் அன்பையும், விசுவாசத்தையும்[a], சேவையையும், பொறுமையுடன் நிலைத்திருப்பதையும் நான் அறிவேன். உன் முந்தைய செயல்களைவிட உன் பிந்தைய செயல்கள் அதிகமானவை என்பதையும் அறிவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நம்பகத்தன்மை.’ இங்குள்ள கிரேக்கச் சொல் விசுவாசம் அல்லது நம்பகத்தன்மை ஆகிய இரண்டில் எதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδά
  choice: நான் அறிவேன்
  rationale: οἶδα இங்கு நிகழ்கால நிலைச் செயற்பொருளில் ‘அறிவேன்’ என்று பொருள்படுகிறது; திருச்சபைகளுக்கான செய்திகளில் திரும்ப வரும் சூத்திரத்தையும் இது இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἔργα
  choice: செயல்கள்
  rationale: ἔργα என்பது கண்கூடான செயல்களைக் குறிக்கிறது. ‘செயல்கள்’ என்பது நவீன தமிழில் இயல்பானது; வசனத்தில் சொல்லின் மறுபயன்பாட்டையும் காக்கிறது.
- source_word: ἀγάπην
  choice: அன்பு
  rationale: ἀγάπη இங்கு கிறிஸ்தவ நற்பண்பாகச் செயல்படும் அன்பைக் குறிக்கிறது.
- source_word: πίστιν
  choice: விசுவாசம்
  rationale: πίστις என்பதன் முதன்மைப் பொருளாக ‘விசுவாசம்’ வைக்கப்பட்டுள்ளது; இச்சூழலில் ‘உண்மைத்தன்மை’ என்ற பொருளும் சாத்தியமாதலால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: διακονίαν
  choice: சேவை
  rationale: διακονία இங்கு நடைமுறைச் சேவையைக் குறிக்கிறது. ‘சேவை’ என்பது எளிதில் புரியும் சொல்; ஒரு முறையான திருச்சபைப் பதவியைத் தேவையின்றி சுட்டாது.
- source_word: ὑπομονήν
  choice: பொறுமையுடன் நிலைத்திருத்தல்
  rationale: ὑπομονή என்பது அழுத்தம் அல்லது துன்பத்தின் கீழும் உறுதியாகத் தொடர்ந்து நிலைத்திருப்பதைக் குறிக்கிறது; இத்தமிழாக்கம் பொறுமை மற்றும் விடாப்பிடியான நிலைத்தன்மை ஆகிய இரண்டையும் வெளிப்படுத்துகிறது.
- source_word: τὰ ἔργα σου τὰ ἔσχατα
  choice: உன் பிந்தைய செயல்கள்
  rationale: ἔσχατα இங்கு கால ஒப்பீட்டில் முந்தைய செயல்களுக்கு எதிராகப் பிந்தைய செயல்களைக் குறிக்கிறது; ‘பிந்தைய’ என்பது தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: πλείονα τῶν πρώτων
  choice: உன் முந்தைய செயல்களைவிட ... அதிகமானவை
  rationale: πλείονα என்பது எண்ணிக்கை, அளவு அல்லது பரப்பு சார்ந்த ‘அதிகம்/மேல்’ என்ற ஒப்பீட்டைத் தரலாம். ‘அதிகமானவை’ அந்தத் திறந்த பொருள் வரம்பைத் தேவையின்றி குறுக்காமல் காக்கிறது.
theological_decisions:
- issue: நற்பண்புகளின் பட்டியலில் πίστις என்பதன் பொருள்
  choice: விசுவாசம்
  alternative: உண்மைத்தன்மை
  rationale: இங்கு πίστις என்பது கடவுள்மீதான விசுவாசத்தையோ நடத்தையில் வெளிப்படும் உண்மைத்தன்மையையோ குறிக்கக்கூடும். முதன்மை உரை ‘விசுவாசம்’ என்பதைக் கொண்டிருக்கிறது; உண்மையான பொருள் இருமை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. கிரேக்கச் சொற்களின் இணைப்பட்டியலைத் தமிழில் இயல்பாக அமைத்தபோதும், ‘செயல்கள்’ என்ற மறுபயன்பாடும் முந்தைய–பிந்தைய ஒப்பீடும் காக்கப்பட்டுள்ளன.
