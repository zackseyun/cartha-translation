id: REV.2.18
reference: Revelation 2:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ ⸀τῆς ἐν Θυατείροις ἐκκλησίας γράψον· Τάδε λέγει ὁ υἱὸς τοῦ θεοῦ, ὁ ἔχων τοὺς ὀφθαλμοὺς αὐτοῦ ὡς φλόγα πυρός, καὶ οἱ πόδες αὐτοῦ ὅμοιοι χαλκολιβάνῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/018.yaml
  text: 'And to the angel of the church in Thyatira write: These things says the Son of God[a], the one who has his eyes like a flame of fire[b], and his feet like burnished bronze:'
translation:
  language: ta
  text: 'தியத்தீராவில் உள்ள திருச்சபையின் தூதனுக்கு[a] எழுது: ‘நெருப்புச் சுடரைப் போன்ற கண்களையும் மெருகூட்டப்பட்ட வெண்கலத்தைப்[b] போன்ற பாதங்களையும் உடைய தேவனுடைய மகன் இவ்வாறு கூறுகிறார்:’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தூதன்’ என்பதற்குப் பதிலாக ‘செய்தியாளர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: b
    text: ‘மெருகூட்டப்பட்ட வெண்கலம்’ என்று மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொல் அரிதானது; அது பொதுவாகச் சுத்திகரிக்கப்பட்டு ஒளிரும் ஓர் உலோகத்தையோ உலோகக் கலவையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: தூதனுக்கு
  rationale: ἄγγελος என்பது ‘தேவதூதன்’ அல்லது ‘செய்தியாளர்’ என இருவகையில் புரிந்துகொள்ளப்படலாம். வெளிப்படுத்தின விசேஷத்தின் ஏழு திருச்சபைகளுக்கான தொடர் முகவரிச் சூத்திரத்தில் உள்ள மறைதரிசனச் சூழலைக் கருத்தில் கொண்டு, இரு பொருளுக்கும் இடமளிக்கும் ‘தூதன்’ தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐκκλησίας
  choice: திருச்சபை
  rationale: இங்கு கிறிஸ்தவ விசுவாசிகளின் அடையாளம் பெற்ற சமூகத்தைக் குறிப்பதால், நவீனத் தமிழில் இயல்பாகவும் நிறுவப்பட்ட பயன்பாடாகவும் உள்ள ‘திருச்சபை’ பயன்படுத்தப்பட்டது.
- source_word: Τάδε λέγει
  choice: கூறுவது இதுவே
  rationale: தீர்க்கதரிசன அறிவிப்புச் சூத்திரத்தின் வலிமையைப் பேணிக்கொண்டே, இயல்பான நவீனத் தமிழ் சொற்றொடராக அமைக்கப்பட்டது.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: தேவனுடைய மகன்
  rationale: மூலத்தில் உள்ள உறவுமுறையையும் தெய்வீகக் குறிப்பையும் சுருக்காமலும் விளக்கவுரையாக்காமலும் நேரடியாகத் தருகிறது.
- source_word: ὀφθαλμοὺς αὐτοῦ ὡς φλόγα πυρός
  choice: நெருப்புச் சுடரைப் போன்ற கண்கள்
  rationale: மூலத்தின் உவமையையும் தீவிரமான மறைதரிசனப் படிமத்தையும் நெருக்கமாகப் பேணுகிறது.
- source_word: πόδες αὐτοῦ ὅμοιοι χαλκολιβάνῳ
  choice: மெருகூட்டப்பட்ட வெண்கலத்தைப் போன்ற பாதங்கள்
  rationale: அரிய உலோகச் சொல்லான χαλκολίβανον குறிக்கும் ஒளிரும், சுத்திகரிக்கப்பட்ட உலோகப் படிமத்தைத் தெளிவான தமிழில் தருகிறது; அதன் துல்லியமான பொருள் உறுதியற்றது என்பது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
theological_decisions:
- issue: கிறிஸ்துவின் நேரடி சுயஅடையாளத்தில் வரும் பட்டம்
  choice: தேவனுடைய மகன்
  alternative: இறைமகன்
  rationale: ὁ υἱὸς τοῦ θεοῦ என்பதன் வெளிப்படையான சொல் அமைப்பையும் உறவுமுறை வலியுறுத்தலையும் முழுமையாகப் பேணுவதற்காக ‘தேவனுடைய மகன்’ தேர்ந்தெடுக்கப்பட்டது.
- issue: தியத்தீரா திருச்சபைக்கு உரையிடப்படும் ἀγγέλῳ என்பவரின் அடையாளம்
  choice: தூதன்
  alternative: செய்தியாளர்
  rationale: மறைதரிசனச் சூழலுக்கு ஏற்ற மரபான பொருளை முதன்மைப்படுத்தினாலும், இது ஒரு மனிதச் செய்தியாளரையும் குறிக்கக்கூடும் என்ற மூலமொழியின் உண்மையான தெளிவின்மையை அடிக்குறிப்பு வழியாகப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய அதே நேரத்தில் மறைதரிசன அறிவிப்பின் கண்ணியமும் செறிவும் பேணப்படும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘தியத்தீரா’ என்ற பெயருடன் ‘நகரிலுள்ள’ சேர்க்கப்பட்டிருப்பது தமிழில் இடப்பெயர் சார்ந்த தொடரை இயல்பாக்குகிறது; மூலத்தின் பொருளில் புதிய விளக்கம் சேர்ப்பதில்லை. அடிக்குறிப்பு குறியீடுகள் அவை விளக்கும் சொற்களின் பின்னரே வைக்கப்பட்டுள்ளன.
