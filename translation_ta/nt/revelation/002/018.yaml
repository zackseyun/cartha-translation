- from: '“தியத்தீரா நகரிலுள்ள திருச்சபையின் தூதனுக்கு[a] எழுது: ‘நெருப்புச் சுடரைப் போன்ற கண்களையும், மெருகூட்டப்பட்ட வெண்கலத்தைப்[b] போன்ற பாதங்களையும் உடைய தேவனுடைய மகன் கூறுவது இதுவே:’”'
