id: REV.2.6
reference: Revelation 2:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλὰ τοῦτο ἔχεις ὅτι μισεῖς τὰ ἔργα τῶν Νικολαϊτῶν, ἃ κἀγὼ μισῶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/006.yaml
  text: 'But this you have: you hate the works of the Nicolaitans[a], which I also hate.'
translation:
  language: ta
  text: 'ஆனால், உன்னிடம் இது இருக்கிறது: நிக்கொலாயர்களின் செயல்களை நீ வெறுக்கிறாய்[a]; நானும் அவற்றை வெறுக்கிறேன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘செயல்கள்’ என்பதற்குப் பதிலாக ‘செய்கைகள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் செயல்களையோ நடைமுறைகளையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனால்
  rationale: முந்தைய சூழலுடன் உள்ள முரண்பாட்டை இயல்பாகவும் சுருக்கமாகவும் குறிக்கிறது.
- source_word: τοῦτο ἔχεις
  choice: உன்னிடம் இந்த ஒன்று இருக்கிறது
  rationale: τοῦτο என்பதன் வலியுறுத்தலைக் காத்து, ‘இது உனக்குச் சாதகமானது’ என்ற விளக்கவுரையைச் சேர்க்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: ὅτι
  choice: ':'
  rationale: அவர்களிடம் இருப்பது என்ன என்பதை அறிமுகப்படுத்தும் உள்ளடக்கக் குறியீடாக இங்கு வருவதால், தமிழில் முக்காற்புள்ளி இயல்பாக அமைகிறது.
- source_word: μισεῖς
  choice: நீ வெறுக்கிறாய்
  rationale: μισέω என்பதன் நேரடியான வலிமையை மென்மைப்படுத்தாமல் தருகிறது; அடுத்த உட்பிரிவிலும் அதே வினைச்சொல் மீண்டும் பயன்படுத்தப்படுகிறது.
- source_word: τὰ ἔργα
  choice: செயல்களை
  rationale: ἔργα இங்கு அந்தக் குழுவினரின் செயல்கள் அல்லது நடைமுறைகளைக் குறிக்கிறது. நவீன தமிழில் ‘செயல்கள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: τῶν Νικολαϊτῶν
  choice: நிக்கொலாயர்களின்
  rationale: கிரேக்கக் குழுப்பெயரைத் தமிழில் ஒலிபெயர்த்து, பன்மை மனிதரைக் குறிக்கும் இயல்பான விகுதியுடன் தருகிறது.
- source_word: ἃ
  choice: அவற்றை
  rationale: நடுநிலைப் பன்மை உறவுப்பெயர் முன்வந்த ‘செயல்களை’ குறிக்கிறது; தமிழில் தனி உறவுத் தொடரைவிட ‘அவற்றை’ என மீண்டும் சுட்டுவது தெளிவாக உள்ளது.
- source_word: κἀγὼ
  choice: நானும்
  rationale: καὶ ἐγώ என்பதன் ‘நானும்’ என்ற பகிர்ந்த நிலைப்பாட்டைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: μισῶ
  choice: வெறுக்கிறேன்
  rationale: முன்னர் வந்த μισεῖς என்பதுடன் ஒரே தமிழ் வேர்ச்சொல்லைப் பயன்படுத்தி, மூலத்தின் மறுபயன்பாட்டைக் காக்கிறது.
theological_decisions:
- issue: வெறுப்பின் பொருள்
  choice: நிக்கொலாயர்களின் செயல்களே வெறுக்கப்படுகின்றன என்று வெளிப்படையாக மொழிபெயர்க்கப்பட்டது.
  alternative: நிக்கொலாயர்களையே வெறுப்பதாகத் தோன்றக்கூடிய தளர்வான மொழிபெயர்ப்பு.
  rationale: τὰ ἔργα என்பதே நேரடிச் செயப்படுபொருள். ஆகவே மனிதர்களைப் பற்றிய விரிவான கூற்றைச் சேர்க்காமல், அவர்களின் செயல்கள்மீதே கண்டனம் இருப்பதை மொழிபெயர்ப்பு காக்கிறது.
- issue: பேசுகிறவரும் சபையும் பகிரும் நிலைப்பாடு
  choice: ‘நானும் அவற்றை வெறுக்கிறேன்’ என்று தரப்பட்டது.
  alternative: ‘அவற்றை நானும்கூட வெறுக்கிறேன்.’
  rationale: κἀγὼ μισῶ உயிர்த்தெழுந்த இயேசு அந்தச் செயல்களை நிராகரிப்பதில் சபையுடன் ஒரே நிலைப்பாட்டில் இருப்பதை நேரடியாகத் தெரிவிக்கிறது; μισέω மென்மைப்படுத்தப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் நேரடியான வலிமையும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை இரண்டாம் நபரைக் காட்ட ‘உன்னிடம்/நீ’ பயன்படுத்தப்பட்டு, மூலத்தின் இலக்கண எண் காக்கப்பட்டுள்ளது. ‘வெறுக்கிறாய்/வெறுக்கிறேன்’ என்ற மறுபயன்பாடு மூலத்தின் சொல்லியல் இணைப்பைத் தக்கவைக்கிறது.
