source:
  edition: SBLGNT
  text: Τῷ ἀγγέλῳ ⸀τῆς ἐν Ἐφέσῳ ἐκκλησίας γράψον· Τάδε λέγει ὁ κρατῶν τοὺς ἑπτὰ ἀστέρας ἐν τῇ δεξιᾷ αὐτοῦ, ὁ περιπατῶν ἐν μέσῳ τῶν ἑπτὰ λυχνιῶν τῶν χρυσῶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/001.yaml
  text: 'To the angel of the church in Ephesus write: These things says the one who holds the seven stars in his right hand[a], who walks among the seven golden lampstands:'
translation:
  language: ta
  text: 'எபேசுவிலுள்ள திருச்சபையின் தேவதூதனுக்கு[a] எழுது: ஏழு நட்சத்திரங்களைத் தமது வலக்கையில் பிடித்திருப்பவரும், ஏழு பொன் விளக்குத்தண்டுகளின் நடுவே நடப்பவரும் கூறுவது இதுவே:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எபேசுவிலுள்ள திருச்சபையின் தூதுவருக்கு.”
    reason: ἀγγέλῳ என்பது தேவதூதனையோ மனிதத் தூதுவரையோ குறிக்கக்கூடும் என்பதால் மாற்றுப் பொருள் தரப்படுகிறது.
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: தேவதூதனுக்கு
  rationale: இச்சொல் விண்ணுலகத் தேவதூதனையோ மனிதத் தூதுவரையோ குறிக்கலாம். வெளிப்படுத்தின விசேஷத்தின் தரிசனச் சூழலில் ‘தேவதூதன்’ இயல்பான முதன்மைத் தெரிவாக உள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐκκλησίας
  choice: திருச்சபையின்
  rationale: கிறிஸ்தவ விசுவாசிகளின் சமூகத்தைக் குறிக்கும் இச்சூழலில், நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் புரியும் சொல்.
- source_word: γράψον
  choice: எழுது
  rationale: கிரேக்க இறந்தகாலக் கட்டளை வடிவத்தின் நேரடியான, இயல்பான ஒருமைக் கட்டளை.
- source_word: Τάδε λέγει
  choice: கூறுவது இதுவே
  rationale: தீர்க்கதரிசன அறிவிப்பின் கனத்த தொனியைத் தக்கவைத்தபடி, கிரேக்கச் சொல்லமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: κρατῶν
  choice: பிடித்திருப்பவர்
  rationale: உறுதியான உடைமை அல்லது கட்டுப்பாட்டைக் குறிக்கும் நிகழ்காலப் பெயரெச்சத்தின் படிமத்தைப் பாதுகாக்கிறது.
- source_word: ἐν τῇ δεξιᾷ αὐτοῦ
  choice: தமது வலக்கையில்
  rationale: மூலத்தின் உடற்கூறு படிமத்தையும், அதனுடன் தொடர்புடைய அதிகாரம் மற்றும் பாதுகாப்பு சார்ந்த சாத்தியமான குறியீட்டையும் விளக்கிச் சேர்க்காமல் பாதுகாக்கிறது.
- source_word: περιπατῶν ἐν μέσῳ
  choice: நடுவே நடப்பவர்
  rationale: விளக்குத்தண்டுகளின் மத்தியில் நிகழும் அசைவைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: λυχνιῶν
  choice: விளக்குத்தண்டுகளின்
  rationale: இது விளக்குகளை அல்ல, அவற்றைத் தாங்கும் தண்டுகளைக் குறிக்கிறது; வெளிப்படுத்தின விசேஷம் 1-ஆம் அதிகாரத்தின் படிமத்துடனும் ஒத்திருக்கிறது.
- source_word: χρυσῶν
  choice: பொன்
  rationale: பொருளையும் பண்பையும் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘திருச்சபையின் ἄγγελος’ என்பவரின் அடையாளம்
  choice: முதன்மை உரையில் ‘தேவதூதன்’
  alternative: ‘தூதுவர்’
  rationale: ἄγγελος என்ற கிரேக்கச் சொல் விண்ணுலகத் தேவதூதனையோ மனிதத் தூதுவரையோ குறிக்கக்கூடும். இந்நூலின் தரிசன மற்றும் விண்ணுலகச் சூழல் ‘தேவதூதன்’ என்பதை ஆதரித்தாலும், விவாதத்திற்குரிய மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. தீர்க்கதரிசன அறிவிப்பின் கனத்த தொனியும், ஏழு நட்சத்திரங்கள் மற்றும் பொன் விளக்குத்தண்டுகள் ஆகிய காட்சிப் படிமங்களும் பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறி அது விளக்கும் ‘தேவதூதன்’ என்பதற்குப் பின்னரே வைக்கப்பட்டுள்ளது.
