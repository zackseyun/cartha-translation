base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/003.yaml
  text: And you have endurance[a], and have borne up for my name[b], and have not grown weary.
translation:
  language: ta
  text: உனக்குப் பொறுமை உண்டு; என் பெயருக்காகத் தாங்கினாய்; களைப்படையவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: அல்லது, “களைப்படையவில்லை.” இந்தக் கூற்றை உழைப்புடன் தொடர்புபடுத்தி, “உழைத்துக் களைப்படையவில்லை” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονὴν ἔχεις
  choice: மனவுறுதியுடன் நிலைத்திருக்கிறாய்
  rationale: ὑπομονή என்பது சோதனையின் கீழ் உறுதியாகத் தொடர்ந்து நிற்பதைக் குறிக்கிறது. தமிழில் பெயர்ச்சொல் வடிவை இயல்பான வினைத்தொடராக மாற்றுவது பொருளையும் நேரடியான பாராட்டையும் காக்கிறது.
- source_word: ἐβάστασας
  choice: துன்பங்களைத் தாங்கியிருக்கிறாய்
  rationale: βαστάζω என்பதற்கு சுமத்தல், சுமத்திச் செல்லுதல், தாங்குதல் ஆகிய பொருள்கள் உண்டு. இங்கு இயேசுவின் பெயருக்காக எதிர்கொண்ட இன்னல்களைத் தாங்கியதைக் குறிக்கிறது; ‘துன்பங்களை’ என்பது தமிழில் மறைந்திருக்கும் பொருள்சார் நிரப்பியாக இயல்பாக அமைகிறது, ஆனால் துன்பத்தின் குறிப்பிட்ட வடிவத்தை நிர்ணயிப்பதில்லை.
- source_word: διὰ τὸ ὄνομά μου
  choice: என் பெயருக்காக
  rationale: διά + accusative காரணத்தையோ நோக்கத்தையோ குறிக்கலாம். ‘என் பெயருக்காக’ என்ற சொற்றொடர் அந்தச் சுருக்கமான வேதாகம வழக்கைத் தக்கவைத்து, காரணம் மற்றும் நிமித்தம் ஆகிய நுணுக்கங்களுக்கு இடமளிக்கிறது.
- source_word: οὐ κεκοπίακες
  choice: சோர்ந்துபோகவில்லை
  rationale: κοπιάω உழைத்தல் அல்லது களைப்படைதல் எனப் பொருள்படலாம். இச்சூழலில் மறுப்பும் நிலைத்திருப்பைப் பற்றிய இணை அமைப்பும் களைப்பால் தளர்ந்துவிடாத நிலையைச் சுட்டுகின்றன. நிறைவேற்றுக் காலத்தின் தொடரும் விளைவை ‘சோர்ந்துபோகவில்லை’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: நிலைத்திருத்தல் மற்றும் துன்பம் தாங்குதல் பற்றிய பாராட்டு
  choice: இயேசுவின் பெயருக்காக ஏற்பட்ட இன்னல்களை மனவுறுதியுடன் தாங்கி, சோர்ந்து விடாமல் இருந்ததாக வசனம் பாராட்டுகிறது.
  alternative: இறுதிக் கூற்றை ‘நீ உழைத்துக் களைப்படையவில்லை’ என்று உழைப்புடன் இன்னும் நெருக்கமாக இணைக்கலாம்.
  rationale: கிரேக்க உரை எந்தக் குறிப்பிட்ட துன்புறுத்தலையோ ஊழியப் பணியையோ குறிப்பிடவில்லை. எனவே அவற்றைச் சேர்க்காமல், அழுத்தத்தின் கீழ் நிலைத்திருந்தனர் என்ற இணை அமைப்பைப் பேணுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நேரடி உரை. கிரேக்கத்தின் மூன்று இணையான பாராட்டுக் கூறுகளும் அரைப்புள்ளிகளால் தெளிவுபடுத்தப்பட்டுள்ளன; தேவையற்ற சமயப்பிரிவு சார்ந்த விளக்கங்கள் தவிர்க்கப்பட்டுள்ளன.
