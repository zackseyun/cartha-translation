id: REV.8.1
reference: Revelation 8:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ⸀ὅταν ἤνοιξεν τὴν σφραγῖδα τὴν ἑβδόμην, ἐγένετο σιγὴ ἐν τῷ οὐρανῷ ὡς ἡμιώριον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/001.yaml
  text: And when he opened the seventh seal[b][a], there was silence in heaven for about half an hour.
translation:
  language: ta
  text: அவர் ஏழாவது முத்திரையைத் திறந்தபோது, பரலோகத்தில் ஏறக்குறைய அரை மணி நேரம் மௌனம் நிலவியது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: திறந்தபோது
  rationale: இது ஒருமுறை நிகழும் கதைச்சம்பவம் என்பதால், காலத்தைக் குறிக்கும் ‘போது’ இயல்பானது; ‘எப்போதெல்லாம்’ என்ற தொடர்நிகழ்வுப் பொருள் இங்கு பொருந்தாது.
- source_word: ἤνοιξεν
  choice: திறந்தார்
  rationale: ἀνοίγω என்பதன் நேரடிப் பொருள் ‘திறத்தல்’. ‘உடைத்துத் திறந்தார்’ என்பது மூலத்தில் இல்லாத செய்முறை விளக்கத்தைச் சேர்க்கும்.
- source_word: σφραγῖδα τὴν ἑβδόμην
  choice: ஏழாவது முத்திரையை
  rationale: σφραγίς என்பதற்கு ‘முத்திரை’ என்பது துல்லியமான, வழக்கிலுள்ள தமிழ் சொல்; வரிசை எண்ணும் இயல்பாகப் பாதுகாக்கப்படுகிறது.
- source_word: ἐγένετο σιγὴ
  choice: அமைதி நிலவியது
  rationale: அமைதி உண்டான நிலையைத் தமிழில் இயல்பாகவும் காட்சியின் ஆழ்ந்த தன்மையுடனும் தெரிவிக்கிறது; ‘அமைதி ஏற்பட்டது’ என்பதைக் காட்டிலும் நடை செம்மையானது.
- source_word: ἐν τῷ οὐρανῷ
  choice: பரலோகத்தில்
  rationale: இங்கு οὐρανός வானமண்டலத்தை அல்ல, தேவனுடைய பரலோக உலகைக் குறிக்கிறது.
- source_word: ὡς ἡμιώριον
  choice: ஏறக்குறைய அரை மணி நேரம்
  rationale: ὡς கால அளவுடன் வரும்போது தோராயத்தைக் குறிக்கிறது; ἡμιώριον என்பது அரை மணி நேரம்.
theological_decisions:
- issue: ἤνοιξεν வினைச்சொல்லின் மறைமுக எழுவாய்
  choice: ‘அவர்’ என்று மொழிபெயர்த்து, இந்த வசனத்திலேயே அவரை ‘ஆட்டுக்குட்டியானவர்’ என்று வெளிப்படையாக அடையாளப்படுத்தவில்லை.
  alternative: ‘ஆட்டுக்குட்டியானவர் ஏழாவது முத்திரையைத் திறந்தபோது’
  rationale: கிரேக்கத்தில் மூன்றாம் நபர் ஒருமை எழுவாய் வினைச்சொல்லில் மறைந்துள்ளது; முந்தைய சூழல் அதன் சுட்டுப்பொருளைத் தெளிவாக்குகிறது. ‘அவர்’ என்பது மூலத்தின் மறைமுகத்தன்மையைப் பாதுகாத்து, தேவையற்ற விளக்கத்தை வசனத்திற்குள் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ். சொற்சொல் இறுக்கத்தைத் தவிர்த்து, மூலத்தின் காலத் தொடர்பு, தோராயமான கால அளவு, நாடகமிக்க அமைதி ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
