id: REV.8.8
reference: Revelation 8:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ὁ δεύτερος ἄγγελος ἐσάλπισεν· καὶ ὡς ὄρος μέγα ⸀πυρὶ καιόμενον ἐβλήθη εἰς τὴν θάλασσαν· καὶ ἐγένετο τὸ τρίτον τῆς θαλάσσης αἷμα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/008.yaml
  text: And the second angel sounded the trumpet[a], and something like a great mountain burning with fire was thrown into the sea, and a third of the sea became blood.
translation:
  language: ta
  text: இரண்டாவது தூதர் எக்காளம் ஊதினார். அப்போது, நெருப்பால் எரிந்துகொண்டிருந்த பெரிய மலை போன்ற ஒன்று கடலுக்குள் எறியப்பட்டது[a]. கடலின் மூன்றில் ஒரு பங்கு இரத்தமாக மாறியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நெருப்பால் எரிந்துகொண்டிருந்த ஒரு பெரிய மலையைப்போல் அது கடலுக்குள் எறியப்பட்டது.” கிரேக்கச் சொல் ஒற்றுமையைக் குறிக்கிறது; அது உண்மையிலேயே ஒரு மலை என்று அவசியமாகக் கூறவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: எக்காளம் ஊதினார்
  rationale: σαλπίζω என்பது எக்காளத்தை ஊதுவதைக் குறிக்கிறது. வினையில் உட்கிடையாக உள்ள கருவியைத் தமிழில் வெளிப்படையாகச் சொல்வது இயல்பும் தெளிவும் தருகிறது.
- source_word: ὡς ὄρος μέγα
  choice: பெரிய மலை போன்ற ஒன்று
  rationale: ὡς ஒப்புமையைக் குறிக்கிறது; அது உண்மையிலேயே ஒரு மலை என்று அடையாளப்படுத்தாமல், தரிசனத்தில் கண்ட தோற்றத்தின் ஒற்றுமையை இந்த மொழிபெயர்ப்பு காக்கிறது.
- source_word: πυρὶ καιόμενον
  choice: நெருப்பால் எரிந்துகொண்டிருந்த
  rationale: πυρί உடன் வரும் καιόμενον தொடர்ச்சியாக எரியும் காட்சியைத் தருகிறது. அதன் இயல்பு எரிமலையா, விண்பொருளா, அடையாளமா என்று விளக்காமல் மூலப்படிமத்தைப் பாதுகாக்கிறது.
- source_word: ἐβλήθη
  choice: எறியப்பட்டது
  rationale: செயப்பாட்டு இறந்தகால வினை, அந்தப் பொருள் வேறொருவரால் எறியப்பட்டதைச் சொல்கிறது; செய்பவர் யார் என்பதை மூலத்தை மீறி குறிப்பிடவில்லை.
- source_word: εἰς τὴν θάλασσαν
  choice: கடலுக்குள்
  rationale: θάλασσα என்பதற்கான நேரடியான, இயல்பான தமிழ்ச் சொல் ‘கடல்’; εἰς இயக்கத்தையும் உள்ளே செல்வதையும் குறிக்கிறது.
- source_word: τὸ τρίτον τῆς θαλάσσης
  choice: கடலின் மூன்றில் ஒரு பங்கு
  rationale: இந்தப் பகுதிப்பொருள் அமைப்பை நவீன தமிழில் தெளிவாகவும் அளவுசார் தீர்ப்பின் படிமத்தைத் தக்கவைத்தும் தருகிறது.
- source_word: αἷμα
  choice: இரத்தம்
  rationale: αἷμα என்பதன் நேரடிப் பொருள் ‘இரத்தம்’; அடையாள விளக்கத்தை மொழிபெயர்ப்பில் சேர்க்காமல் மூலக் கூற்றை அப்படியே காக்கிறது.
theological_decisions:
- issue: மலை போன்ற பொருளின் இயல்பு
  choice: அதைப் பெரிய மலைக்கு ஒப்பான, அடையாளம் குறிப்பிடப்படாத ஒன்றாக மொழிபெயர்த்தல்
  alternative: அதை உண்மையான மலை, விண்கல் போன்ற பொருள், அல்லது தீர்ப்பின் அடையாளம் என்று குறிப்பாக அடையாளப்படுத்துதல்
  rationale: ὡς என்பது ஒற்றுமையைக் குறிக்கிறது. காட்சி நேரடியானதா, அடையாளமானதா, அல்லது இரண்டுமா என்ற பதற்றத்தைத் தீர்க்காமல் மொழிபெயர்ப்பு பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. தொடர்ச்சியான ‘καὶ’ இணைப்புகள் தமிழில் இயல்பாக அமைய வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளன; ‘அப்போது’ நிகழ்வுகளின் தொடர்ச்சியைத் தெளிவாக்குகிறது.
