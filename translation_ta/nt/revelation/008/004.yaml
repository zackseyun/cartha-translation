id: REV.8.4
reference: Revelation 8:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἀνέβη ὁ καπνὸς τῶν θυμιαμάτων ταῖς προσευχαῖς τῶν ἁγίων ἐκ χειρὸς τοῦ ἀγγέλου ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/004.yaml
  text: And the smoke of the incense went up with the prayers of the saints from the hand of the angel before God[a][b].
translation:
  language: ta
  text: தூபப்புகை, பரிசுத்த மக்களின் வேண்டுதல்களோடு, அந்தத் தூதரின் கையிலிருந்து கடவுளின் முன்னிலையில் மேலெழுந்தது[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மேலெழுந்தது’ என்பதற்கு ‘மேலே சென்றது’ அல்லது ‘மேலேறியது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில், ‘பரிசுத்த மக்களின் வேண்டுதல்களோடு’ என்று உள்ளது. தூபப்புகையையும் வேண்டுதல்களையும் இச்சொற்றொடர் தொடர்புபடுத்துகிறது; ஆனால் இவ்வசனத்தில் அவை இரண்டும் ஒன்றே என்று வெளிப்படையாகக் கூறவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέβη
  choice: மேலெழுந்தது
  rationale: மேல்நோக்கிய இயக்கத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; தரிசனத்தின் கண்முன் தோன்றும் காட்சியையும் காக்கிறது.
- source_word: ὁ καπνὸς τῶν θυμιαμάτων
  choice: தூபப்புகை
  rationale: கிரேக்கத்தில் தூபத்தைக் குறிக்கும் சொல் பன்மையில் இருந்தாலும், தமிழில் ‘தூபப்புகை’ என்பது இயல்பான தொகைச்சொல்; வழிபாட்டுச் சூழலையும் தெளிவாகத் தக்கவைக்கிறது.
- source_word: ταῖς προσευχαῖς
  choice: வேண்டுதல்களோடு
  rationale: இங்குள்ள வேற்றுமை உருபு புகைக்கும் வேண்டுதல்களுக்கும் இடையிலான தொடர்பைக் காட்டுகிறது. ‘-ஓடு’ அவை ஒன்றே என்று கூறாமலும், வேண்டுதல்களைப் புகை சுமந்து சென்றது என்று விளக்காமலும் அந்தத் தொடர்பைக் காக்கிறது.
- source_word: τῶν ἁγίων
  choice: பரிசுத்த மக்களின்
  rationale: கடவுளுக்கெனப் பிரித்தெடுக்கப்பட்ட மக்களைப் பொதுவாகக் குறிக்கிறது. ‘புனிதர்கள்’ என்று மொழிபெயர்த்து பின்னாளில் அதிகாரபூர்வமாகப் புனிதர் என அறிவிக்கப்பட்ட சிலரை மட்டும் குறிக்கும் பொருள் தோன்றுவதைத் தவிர்க்கிறது.
- source_word: ἐκ χειρὸς τοῦ ἀγγέλου
  choice: அந்தத் தூதரின் கையிலிருந்து
  rationale: ‘கையிலிருந்து’ என்ற காட்சிப்படிமத்தை நேரடியாகக் காக்கிறது. கிரேக்க வரையறைச் சுட்டை, முந்தைய வசனத்தில் குறிப்பிடப்பட்ட தூதரைக் குறிக்கும் இயல்பான தமிழான ‘அந்தத் தூதர்’ மூலம் வெளிப்படுத்துகிறது.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: கடவுளின் முன்னிலையில்
  rationale: கடவுளின் சந்நிதியில் நிகழ்வதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; ‘கடவுளுக்கு முன்பாக’ என்பதில் தமிழில் தோன்றக்கூடிய இடவரிசைத் தெளிவின்மையையும் தவிர்க்கிறது.
theological_decisions:
- issue: தூபத்துக்கும் பரிசுத்த மக்களின் வேண்டுதல்களுக்கும் உள்ள உறவு
  choice: ‘தூபப்புகை ... வேண்டுதல்களோடு ... மேலெழுந்தது’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: தூபப்புகையே வேண்டுதல்கள் என்று அடையாளப்படுத்துதல்; அல்லது வேண்டுதல்களுக்காகப் புகை எழுந்தது என்று கூறுதல்.
  rationale: கிரேக்க வாசகம் தூபப்புகையையும் வேண்டுதல்களையும் தொடர்புபடுத்துகிறது; ஆனால் இவ்வசனத்தில் அவை இரண்டும் ஒன்றே என்றோ, ஒன்று மற்றொன்றைச் சுமக்கிறது என்றோ வெளிப்படையாகக் கூறவில்லை. ஆகவே அந்தத் தெளிவின்மை பாதுகாக்கப்படுகிறது.
- issue: τῶν ἁγίων என்பதன் குறிப்பு
  choice: ‘பரிசுத்த மக்கள்’ என்பது கடவுளுக்குரிய மக்களைப் பரந்த பொருளில் குறிக்கிறது.
  alternative: ‘புனிதர்கள்’ அல்லது பின்னாளில் தனிப்பட்ட முறையில் புனிதர் எனக் கருதப்பட்டவர்கள்.
  rationale: வெளிப்படுத்தலில் இச்சொல் கடவுளுடைய பரிசுத்த மக்களைப் பொதுவாகக் குறிக்கிறது; எந்தப் பிற்காலச் சமய மரபின் குறுகிய வரையறையும் இங்கு சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவான வாசகர்களுக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘தூபப்புகை’, ‘வேண்டுதல்கள்’, ‘பரிசுத்த மக்கள்’ ஆகியவை வெளிப்படுத்தலின் வழிபாட்டு மற்றும் திருக்காட்சி நடையைத் தக்கவைக்கின்றன. இடைச் செருகல்களைக் காட்டும் காற்புள்ளிகள் நீண்ட வாக்கியத்தின் தொடர்புகளைத் தெளிவாக்குகின்றன.
