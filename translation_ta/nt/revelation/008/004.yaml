  terminology: “பரிசுத்த மக்கள்” appropriately conveys τῶν ἁγίων as God's holy people without importing a restricted later sense of “saints.” “தூதர்,” “தூபப்புகை,” and “வேண்டுதல்கள்” are consistent and suitable choices.
