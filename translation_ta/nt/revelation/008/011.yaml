id: REV.8.11
reference: Revelation 8:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ τὸ ὄνομα τοῦ ἀστέρος λέγεται· ⸀ὁ Ἄψινθος. καὶ ἐγένετο τὸ τρίτον τῶν ὑδάτων εἰς ἄψινθον, καὶ πολλοὶ τῶν ἀνθρώπων ἀπέθανον ἐκ τῶν ὑδάτων, ὅτι ἐπικράνθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/011.yaml
  text: And the name of the star is called Wormwood[a]. And a third of the waters became wormwood, and many of the people died from the waters[b], because they had been made bitter.
translation:
  language: ta
  text: அந்த நட்சத்திரத்தின் பெயர் “எட்டிப்பூண்டு” என்று அழைக்கப்படுகிறது[a]. நீரில் மூன்றில் ஒரு பங்கு எட்டிப்பூண்டாக மாறியது. மனிதர்களில் பலர் அந்த நீரினால்[b] இறந்தார்கள்; ஏனெனில் அந்த நீர் கசப்பாக்கப்பட்டிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எட்டிப்பூண்டு” என்பது கசப்பான ஒரு செடியைக் குறிக்கிறது. கிரேக்கத்தில் நட்சத்திரத்தின் பெயருக்கும் நீர் எட்டிப்பூண்டாக மாறியதற்கும் ஒரே சொல் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “அந்த நீரினால்” என்பது கிரேக்கத்தில் நேரடியாக “நீரிலிருந்து” என உள்ளது. அவர்கள் அதைக் குடித்தார்கள் என்பது சூழலில் உட்குறிப்பாக இருந்தாலும், மூலவாக்கியத்தில் வெளிப்படையாகக் கூறப்படவில்லை.
    reason: translation_clarity
lexical_decisions:
- source_word: ὄνομα
  choice: பெயர்
  rationale: நட்சத்திரத்துக்கு வழங்கப்பட்ட பெயரைக் குறிக்கும் இயல்பான, நேரடியான தமிழ்ச் சொல்.
- source_word: ἀστέρος
  choice: நட்சத்திரம்
  rationale: வெளிப்படுத்தின விசேஷத்தின் காட்சிமொழியில் ἀστήρ என்பதற்கான நேரடியான நவீனத் தமிழ் இணை.
- source_word: λέγεται
  choice: என்று அழைக்கப்படுகிறது
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: Ἄψινθος / ἄψινθον
  choice: எட்டி / எட்டி
  rationale: கசப்பான wormwood செடியைக் குறிக்கத் தமிழில் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட பெயர். நட்சத்திரத்தின் பெயருக்கும் தண்ணீர்களின் மாற்றத்துக்கும் இடையிலான ஒரேசொல் தொடர்பைத் தக்கவைக்க இரு இடங்களிலும் இதே சொல் பயன்படுத்தப்படுகிறது.
- source_word: ἐγένετο ... εἰς
  choice: '...ஆக மாறியது'
  rationale: மாற்றத்தையும் அதன் விளைவையும் குறிக்கும் கிரேக்க அமைப்பைத் தெளிவாகவும் உருவகத்தைத் தளர்த்தாமலும் தருகிறது.
- source_word: τὸ τρίτον τῶν ὑδάτων
  choice: தண்ணீர்களில் மூன்றில் ஒரு பங்கு
  rationale: பகுதிப்பொருளையும் துல்லியமான அளவையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: πολλοὶ τῶν ἀνθρώπων
  choice: மனிதர்களில் பலர்
  rationale: ஆண்களை மட்டும் அல்லாமல் மனிதர்களைப் பொதுவாகக் குறிக்கிறது; கிரேக்கப் பகுதிப்பொருளையும் தக்கவைக்கிறது.
- source_word: ἀπέθανον ἐκ τῶν ὑδάτων
  choice: அந்தத் தண்ணீர்களால் இறந்தார்கள்
  rationale: ἐκ குறிக்கும் காரணம் அல்லது மூலத்தைத் தெரிவிக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘குடித்ததால்’ என்பதைச் சேர்க்கவில்லை.
- source_word: ὅτι ἐπικράνθησαν
  choice: ஏனெனில் அவை கசப்பாக்கப்பட்டிருந்தன
  rationale: செயப்பாட்டு மற்றும் விளைவுநிலையைத் தக்கவைக்கிறது; ‘அவை’ என்பது அருகிலுள்ள பன்மை முன்னிலையான தண்ணீர்களைக் குறிக்கிறது.
theological_decisions:
- issue: ἐπικράνθησαν என்ற செயப்பாட்டு வினையின் குறிப்பு
  choice: ‘அவை’ என்பது தண்ணீர்களைக் குறிக்கிறது.
  alternative: மனிதர்கள் கசப்படைந்தார்கள் அல்லது நோயுற்றார்கள் என்று எடுத்துக்கொள்ளுதல்.
  rationale: இலக்கணப்படி அருகிலுள்ள பன்மை முன்னிலை ‘தண்ணீர்கள்’; சூழலிலும் தண்ணீர்கள் கசப்பாக்கப்பட்டதாலேயே இறப்புகள் நேரிடுகின்றன. ஆகவே தண்ணீர்களே இயல்பான குறிப்பு.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடையைப் பயன்படுத்துகிறது. ‘எட்டி’ என்ற பெயரைத் தமிழாக்காமல் வேறு நவீன பானப்பெயருடன் தொடர்புபடுத்தாமல், கசப்புச் செடியையும் அதன் உருவகத் தொடர்பையும் தக்கவைக்கிறது. ‘தண்ணீர்கள்’ என்ற பன்மை, கிரேக்கப் பன்மையையும் இறுதி வினையின் குறிப்பையும் தெளிவுபடுத்துகிறது.
