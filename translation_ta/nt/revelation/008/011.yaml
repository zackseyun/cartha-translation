  source_fidelity: 'கருத்து மற்றும் வாக்கிய உறவுகள் பெரும்பாலும் மூலத்துக்கு உண்மையாக உள்ளன: நீரின் மூன்றில் ஒரு பங்கு மாற்றமடைதல், நீரால் மனிதர் இறத்தல், இறுதி செயப்பாட்டு வினை நீரையே குறிப்பது ஆகியவை சரியாகப் புரிந்துகொள்ளப்பட்டுள்ளன. ஆனால் Ἄψινθος/ἄψινθον என்பதற்குப் பயன்படுத்தப்பட்டுள்ள “எட்டி” என்பது wormwood-க்கான நிலையானவும் தெளிவானவும் தமிழ் வேதாகமப் பெயரைப் போதுமான அளவு வெளிப்படுத்தவில்லை; “எட்டிப்பூண்டு” என இரு இடங்களிலும் தருவது சொல்-தொடர்பையும் தாவரக் குறிப்பையும் பாதுகாக்கும்.'
