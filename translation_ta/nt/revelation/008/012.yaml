id: REV.8.12
reference: Revelation 8:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ὁ τέταρτος ἄγγελος ἐσάλπισεν· καὶ ἐπλήγη τὸ τρίτον τοῦ ἡλίου καὶ τὸ τρίτον τῆς σελήνης καὶ τὸ τρίτον τῶν ἀστέρων, ἵνα σκοτισθῇ τὸ τρίτον αὐτῶν καὶ ⸂ἡ ἡμέρα μὴ φάνῃ τὸ τρίτον αὐτῆς⸃, καὶ ἡ νὺξ ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/012.yaml
  text: And the fourth angel sounded the trumpet[a], and a third of the sun and a third of the moon and a third of the stars was struck, so that a third of them was darkened, and the day did not shine for a third of it, and the night likewise.
translation:
  language: ta
  text: நான்காவது தூதர் எக்காளம் ஊதினார். அப்போது சூரியனில் மூன்றில் ஒரு பங்கும், நிலவில் மூன்றில் ஒரு பங்கும், நட்சத்திரங்களில் மூன்றில் ஒரு பங்கும் தாக்கப்பட்டன. அதனால் அவற்றில் மூன்றில் ஒரு பங்கு இருளாக்கப்பட்டது; பகல் தன் காலத்தின் மூன்றில் ஒரு பங்கு ஒளிவீசவில்லை[a]; இரவும் அவ்வாறே ஒளிவீசவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பகல் தன் காலத்தின் மூன்றில் ஒரு பங்கு ஒளிவீசாதபடி.” கிரேக்கத்தில் இங்கு உள்ள அமைப்பு விளைவைக் குறிக்கலாம்; நோக்கத்தின் நிழலையும் கொண்டிருக்கலாம்.
    reason: ἵνα அமைப்பின் விளைவு–நோக்கத் தெளிவின்மையைப் பாதுகாக்கும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: எக்காளம் ஊதினார்
  rationale: σαλπίζω என்பது எக்காளத்தை ஒலிக்கச் செய்வதைக் குறிக்கிறது. ‘எக்காளம் ஊதினார்’ என்பது இயல்பான நவீனத் தமிழிலும் பொருளைத் தெளிவாகவும் தருகிறது.
- source_word: ἐπλήγη
  choice: தாக்கப்பட்டன
  rationale: πλήσσω என்பதன் செயப்பாட்டு வடிவம் அடிக்கப்படுதல் அல்லது தாக்கப்படுதல் என்ற தீர்ப்புக் காட்சியைத் தருகிறது. மூன்று விண்பொருட்களின் பங்குகளையும் ஒருங்கிணைத்துக் குறிப்பிடுவதால் தமிழில் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: τὸ τρίτον
  choice: மூன்றில் ஒரு பங்கு
  rationale: அளவைக் குறிக்கும் இச்சொற்றொடரைத் துல்லியமாகவும் வழக்கமான தமிழிலும் காட்டுகிறது; வசனத்தில் வரும் மீளுரைப்பும் பாதுகாக்கப்படுகிறது.
- source_word: ἥλιος / σελήνη / ἀστέρες
  choice: சூரியன் / நிலவு / நட்சத்திரங்கள்
  rationale: விண்பொருட்களைக் குறிக்கும் நேரடியான, பொதுவாகப் புரியும் தமிழ்ச் சொற்கள்.
- source_word: ἵνα
  choice: இதனால்
  rationale: இங்கு ἵνα நோக்கம் அல்லது விளைவு ஆகிய இரண்டின் நிழலையும் கொண்டிருக்கலாம். முதன்மை உரையில் நிகழ்வின் விளைவை இயல்பாகக் காட்ட ‘இதனால்’ பயன்படுத்தப்பட்டுள்ளது; நோக்க நிழல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: σκοτισθῇ
  choice: இருளடைந்தது
  rationale: விண்பொருட்களின் ஒளி இருண்டுபோன விளைவை இயல்பான தமிழில் தெரிவிக்கிறது; அவற்றின்மீது நிகழ்ந்த பாதிப்பு என்ற செயப்பாட்டு கருத்தும் சூழலால் தெளிவாகிறது.
- source_word: αὐτῶν
  choice: அவற்றில்
  rationale: சூரியன், நிலவு, நட்சத்திரங்கள் ஆகியவற்றை மொத்தமாகச் சுட்டும் கிரேக்கப் பன்மையைப் பாதுகாக்கிறது.
- source_word: ἡ ἡμέρα μὴ φάνῃ
  choice: பகல் ... ஒளிவீசவில்லை
  rationale: φαίνω என்பதற்கு ‘தோன்றுதல்’ அல்லது ‘ஒளிவீசுதல்’ என்று பொருள் வரலாம். விண்ணொளிகள் இருளடையும் இச்சூழலில் ‘ஒளிவீசவில்லை’ காட்சியைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: τὸ τρίτον αὐτῆς
  choice: அதன் கால அளவில் மூன்றில் ஒரு பங்கு
  rationale: இது பகலின் பாதிக்கப்பட்ட அளவு அல்லது காலப்பகுதியைக் குறிக்கிறது. ‘கால அளவில்’ என்பது தமிழில் காலநீட்சியைத் தெளிவாக்குகிறது; அளவின் வரம்பையும் மாற்றவில்லை.
- source_word: ἡ νὺξ ὁμοίως
  choice: இரவும் அவ்வாறே இருந்தது
  rationale: இரவுக்கும் அதே அளவிலான விளைவு பொருந்துவதை இயல்பான தமிழில் தெரிவிக்கிறது; கிரேக்கத்தின் சுருக்கமான கூறலை விரிவாக விளக்காமல் பாதுகாக்கிறது.
theological_decisions:
- issue: விண்ணுலகத் தீர்ப்புக் காட்சியின் இயல்பு
  choice: விண்ணொளிகள் இருளடைவதை வெளிப்படுத்தின விசேஷத்துக்குரிய தீர்ப்புக் காட்சியாக நேரடியாக மொழிபெயர்த்து, அது சொற்பொருளானதா, அடையாளமானதா, அல்லது இரண்டுமா என்பதை நிர்ணயிக்காமல் விடுதல்
  alternative: அதை முழுவதும் சொற்பொருளான வானியல் நிகழ்வாகவோ முழுவதும் அடையாள அரசியல் அல்லது அண்டக் காட்சியாகவோ வெளிப்படையாக விளக்குதல்
  rationale: வசனம் விண்பொருட்களில் மூன்றில் ஒரு பங்கு தாக்கப்பட்டு, பகலும் இரவும் அதற்கேற்ப பாதிக்கப்படுவதாகக் கூறுகிறது. ஆனால் அந்தக் காட்சியின் செயல்முறையையோ விளக்க முறையையோ வரையறுப்பதில்லை; ஆகவே மொழிபெயர்ப்பு அந்தத் தத்துவப் பதற்றத்தைத் தீர்த்துவிடக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பானதும் கண்ணியமானதும். வெளிப்படுத்தின விசேஷத்தின் மீளுரைப்பும் தீர்ப்புக் காட்சியும் பாதுகாக்கப்பட்டுள்ளன. எந்த குறிப்பிட்ட சமயப் பிரிவின் விளக்கமும் சேர்க்கப்படவில்லை.
