id: REV.8.13
reference: Revelation 8:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἤκουσα ἑνὸς ἀετοῦ πετομένου ἐν μεσουρανήματι λέγοντος φωνῇ μεγάλῃ· Οὐαὶ οὐαὶ οὐαὶ ⸂τοὺς κατοικοῦντας⸃ ἐπὶ τῆς γῆς ἐκ τῶν λοιπῶν φωνῶν τῆς σάλπιγγος τῶν τριῶν ἀγγέλων τῶν μελλόντων σαλπίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/013.yaml
  text: And I saw[a], and I heard one eagle flying in midheaven, saying with a loud voice, “Woe, woe, woe to those who dwell on the earth[b], because of the remaining trumpet-blasts of the three angels who are about to sound!”
translation:
  language: ta
  text: நான் பார்த்தேன்; நடுவானில்[b] பறந்துகொண்டிருந்த ஒரு கழுகு[a] உரத்த குரலில், “பூமியில் குடியிருக்கிறவர்களுக்கு, எக்காளம் ஊதவிருக்கிற மூன்று தேவதூதர்களின் மீதமுள்ள எக்காள முழக்கங்களின் காரணமாக, ஐயோ, ஐயோ, ஐயோ!” என்று சொல்வதைக் கேட்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் “ஒரு கழுகு” என்பதற்குப் பதிலாக “ஒரு தேவதூதர்” என்று உள்ளது.
    reason: textual_variant
  - marker: b
    text: அல்லது, “வானத்தின் உச்சியில்”; கிரேக்கச் சொல் வானத்தின் மிக உயர்ந்த பகுதியையோ தலைக்குமேலுள்ள திறந்த வானையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀετοῦ
  choice: கழுகு
  rationale: இச்சொல் பொதுவாகக் கழுகைக் குறிக்கிறது. பிணந்தின்னிக் கழுகு எனக் குறிப்பதற்கான சூழல் இங்கு இல்லாததால், வெளிப்படுத்தின விசேஷத்தின் தரிசனக் காட்சிக்கு ஏற்ற பொதுவான சொல்லாக ‘கழுகு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: μεσουρανήματι
  choice: வானத்தின் உச்சியில்
  rationale: வானத்தின் மிக உயர்ந்த பகுதியையோ தலைக்குமேலுள்ள திறந்த வானையோ குறிக்கும் சொல்லின் உயர்ந்த, காட்சிசார் நடையை இது இயல்பான தமிழில் காக்கிறது.
- source_word: φωνῇ μεγάλῃ
  choice: உரத்த குரலில்
  rationale: அனைவரும் கேட்கும் வகையில் வலிமையாக அறிவிப்பதைக் குறிக்கும் இயல்பான தமிழ் சொற்றொடர்.
- source_word: Οὐαὶ οὐαὶ οὐαὶ
  choice: ஐயோ, ஐயோ, ஐயோ
  rationale: தீர்க்கதரிசன எச்சரிக்கையின் தீவிரத்தைத் தரும் மும்முறை கூறலை மாற்றாமல் காக்கிறது.
- source_word: τοὺς κατοικοῦντας ἐπὶ τῆς γῆς
  choice: பூமியில் குடியிருக்கிறவர்கள்
  rationale: வெளிப்படுத்தின விசேஷத்தில் திரும்பத் திரும்ப வரும் சொற்றொடரின் தொடர்ச்சியையும், வெறும் தற்காலிக வாழ்வை விட நிலையான குடியிருப்பைக் குறிக்கும் நுணுக்கத்தையும் காக்கிறது.
- source_word: ἐκ τῶν λοιπῶν φωνῶν τῆς σάλπιγγος
  choice: எஞ்சிய எக்காள முழக்கங்களால்
  rationale: ἐκ இங்கு காரணத்தைக் குறிக்கிறது; எக்காளத்தின் φωναί என்பதைச் சொற்சொல்லான ‘குரல்கள்’ என்பதற்குப் பதிலாக இயல்பாக ‘முழக்கங்கள்’ என வழங்குகிறது.
- source_word: τῶν τριῶν ἀγγέλων
  choice: மூன்று தேவதூதர்களின்
  rationale: இத்தரிசனச் சூழலில் ἄγγελος மனிதத் தூதரை அல்ல, தேவதூதரைக் குறிக்கிறது.
- source_word: τῶν μελλόντων σαλπίζειν
  choice: எக்காளம் ஊதவிருக்கிற
  rationale: μέλλω உடனடியாய் நிகழவிருப்பதைக் காட்டுகிறது; மறைந்துள்ள எக்காளத்தைத் தமிழில் வெளிப்படையாகக் கூறுவது இயல்பாக உள்ளது.
theological_decisions:
- issue: பறக்கும் அறிவிப்பாளரின் மூலபாட வாசகம்
  choice: ஒரு கழுகு
  alternative: ஒரு தேவதூதர்
  rationale: முதன்மைப் பாடம் SBLGNT-இன் ἀετοῦ (‘கழுகு’) என்ற வாசகத்தைப் பின்பற்றுகிறது. சில கையெழுத்துப் பிரதிகளில் உள்ள ‘தேவதூதர்’ என்ற மாற்று வாசகம் பாடத்தில் ஏற்கப்படாமல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. தரிசனத்தின் உயர்ந்த நடையும் மும்முறை வரும் தீர்ப்புச் சொல்லின் தீவிரமும் காக்கப்பட்டுள்ளன. அடிக்குறிப்பு [b] ஆங்கில ஆலோசனைப் பாடத்தில் இருந்த இடத்தைப் பின்பற்றாமல், அது விளக்கும் ‘வானத்தின் உச்சியில்’ என்ற சொற்றொடருக்குப் பின்னால் பொருத்தப்பட்டுள்ளது.
