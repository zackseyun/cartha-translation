source:
  edition: SBLGNT
  text: καὶ εἴληφεν ὁ ἄγγελος τὸν λιβανωτόν, καὶ ἐγέμισεν αὐτὸν ἐκ τοῦ πυρὸς τοῦ θυσιαστηρίου, καὶ ἔβαλεν εἰς τὴν γῆν· καὶ ἐγένοντο βρονταὶ καὶ φωναὶ καὶ ἀστραπαὶ καὶ σεισμός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/005.yaml
  text: And the angel took the censer[a], and filled it with fire from the altar, and threw it onto the earth; and there came peals of thunder and sounds and flashes of lightning and an earthquake.
translation:
  language: ta
  text: அந்தத் தூதன் தூபக்கலசத்தை எடுத்து, பலிபீடத்தின் நெருப்பால் அதை நிரப்பி, பூமியின்மேல் எறிந்தான். அப்போது இடிமுழக்கங்களும் ஒலிகளும்[a] மின்னல்களும் நிலநடுக்கமும் ஏற்பட்டன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குரல்களும்.” கிரேக்கச் சொல் பேசப்படும் குரல்களையோ பொதுவான ஒலிகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴληφεν
  choice: எடுத்து
  rationale: முற்றுவினை வடிவின் விளைவு தொடரும் நுணுக்கத்தை மறுக்காமல், தொடர்கதைச் சூழலில் அடுத்துவரும் இறந்தகால வினைகளோடு இயல்பாக அமையும் தமிழ் வினையெச்சம்.
- source_word: λιβανωτόν
  choice: தூபக்கலசம்
  rationale: தூபம் எரிக்கவும் பலிபீடத்திலிருந்து நெருப்பை ஏந்தவும் பயன்படும் வழிபாட்டுக் கலனைத் தெளிவாகக் குறிக்கிறது.
- source_word: ἐγέμισεν αὐτὸν ἐκ τοῦ πυρὸς τοῦ θυσιαστηρίου
  choice: பலிபீடத்தின் நெருப்பால் அதை நிரப்பி
  rationale: கலசம் பலிபீடத்திலிருந்து எடுக்கப்பட்ட நெருப்பைக் கொண்டு நிரப்பப்பட்டது என்ற மூலமொழியின் உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: θυσιαστηρίου
  choice: பலிபீடம்
  rationale: ஆலய மற்றும் பலிசார் உருவகத்தில் இச்சொல்லுக்குரிய நிலையான, புரிந்துகொள்ளத்தக்க தமிழ் இணை.
- source_word: ἔβαλεν εἰς τὴν γῆν
  choice: பூமியின்மேல் எறிந்தான்
  rationale: βάλλω என்பதன் வலிமையான செயலை ‘எறிந்தான்’ காக்கிறது; வெளிப்படுத்தின விசேஷத்தின் அண்டமளாவிய நியாயத்தீர்ப்புச் சூழலில் γῆ என்பதற்கு ‘பூமி’ பொருத்தமானது.
- source_word: ἐγένοντο
  choice: ஏற்பட்டன
  rationale: தொடர்ந்து பட்டியலிடப்படும் நிகழ்வுகள் திடீரென உண்டானதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: βρονταὶ
  choice: இடிமுழக்கங்கள்
  rationale: பன்மையில் உள்ள தொடர்ச்சியான அல்லது பல இடியொலிகளைத் தெளிவாகக் காட்டுகிறது.
- source_word: φωναὶ
  choice: ஒலிகள்
  rationale: பேசுபவர்கள் எவரும் குறிப்பிடப்படாததால், ‘குரல்கள்’ என்று வெளிப்படையான பேச்சை முன்கூட்டியே தீர்மானிக்காமல் செவிப்புல நிகழ்வின் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: ἀστραπαὶ
  choice: மின்னல்கள்
  rationale: பன்மையைச் சுருக்கமாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: σεισμός
  choice: நிலநடுக்கம்
  rationale: ஒற்றை எண்ணிலுள்ள σεισμός என்பதற்கான இயல்பான தமிழ் இணை.
theological_decisions:
- issue: வெளிப்படுத்தின விசேஷத்தின் நியாயத்தீர்ப்புச் சூழலில் γῆ என்பதன் பொருள்
  choice: பூமி
  alternative: தரை; நாடு
  rationale: இக்காட்சியின் பரந்த, அண்டமளாவிய நியாயத்தீர்ப்பு உருவகத்துக்கு ‘பூமி’ பொருந்துகிறது; ‘தரை’ பொருளை மிகக் குறுக்கும், ‘நாடு’ குறிப்பிட்ட பகுதியைக் குறிக்கும் எண்ணத்தை ஏற்படுத்தலாம்.
- issue: இறைத்தோற்ற நிகழ்வுகளின் பட்டியலில் φωναί என்பதன் பொருள்
  choice: ஒலிகள்
  alternative: குரல்கள்
  rationale: பேசுபவர்கள் அடையாளம் காட்டப்படாததால் ‘ஒலிகள்’ என்பது தனிப்பட்ட பேச்சை உரையில் சேர்க்காமல் மூலத்தின் பொருள் விரிவைப் பாதுகாக்கிறது; ‘குரல்கள்’ என்ற உண்மையான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் காட்சியின் தீவிரமும் காக்கப்பட்டுள்ளன. ‘தூபக்கலசம்,’ ‘பலிபீடம்’ போன்ற வழிபாட்டுச் சொற்கள் தெளிவுக்காகப் பயன்படுத்தப்பட்டுள்ளன; வாக்கிய ஓட்டம் சாதாரண வாசகர்களுக்கும் இயல்பாக இருக்குமாறு அமைக்கப்பட்டுள்ளது.
