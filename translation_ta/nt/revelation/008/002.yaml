id: REV.8.2
reference: Revelation 8:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἶδον τοὺς ἑπτὰ ἀγγέλους οἳ ἐνώπιον τοῦ θεοῦ ἑστήκασιν, καὶ ἐδόθησαν αὐτοῖς ἑπτὰ σάλπιγγες.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/002.yaml
  text: And I saw the seven angels who stand before God[a], and seven trumpets were given to them.
translation:
  language: ta
  text: கடவுளுக்கு முன்பாக நிற்கிற ஏழு தூதர்களை நான் கண்டேன்[a]. அவர்களுக்கு ஏழு எக்காளங்கள் கொடுக்கப்பட்டன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கடவுளுக்கு முன்பாக நின்றுகொண்டிருக்கிற’ அல்லது ‘கடவுளுக்கு முன்பாக நின்றிருக்கிற’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்க நிறைவுக்கால வினை, அவர்கள் நிற்பது தொடரும் நிலை என்பதை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: நான் கண்டேன்
  rationale: தரிசன நிகழ்வை விவரிக்கும் இறந்தகால வினையாக இது இயல்பாகவும் கண்ணியமாகவும் உள்ளது; ‘பார்த்தேன்’ என்பதைவிட தரிசனத்தின் வலிமையை நன்றாக வெளிப்படுத்துகிறது.
- source_word: τοὺς ἑπτὰ ἀγγέλους
  choice: ஏழு தூதர்களை
  rationale: கிரேக்கக் குறிப்புச் சுட்டு ஒரு குறிப்பிட்ட ஏழுபேர் கொண்ட குழுவைக் குறிக்கிறது. தமிழில் எண்ணுக்கு முன் தனிக் குறிப்புச் சொல் இல்லாமலேயே சூழல் அந்தக் குறிப்புத்தன்மையைத் தெளிவாக்குகிறது.
- source_word: ἀγγέλους
  choice: தூதர்கள்
  rationale: விண்ணுலக அரியணைச் சூழலில் மனிதச் செய்தியாளர்கள் அல்ல, தேவதூதர்களே குறிக்கப்படுகின்றனர்; ‘தூதர்கள்’ என்பது இயல்பான வேதாகமத் தமிழ் வழக்கு.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: கடவுளுக்கு முன்பாக
  rationale: இது கிரேக்கத்தின் இடம் மற்றும் உறவு சார்ந்த பொருளைப் பாதுகாத்து, நவீன தமிழில் இயல்பாக ஒலிக்கிறது.
- source_word: ἑστήκασιν
  choice: நிற்கிற
  rationale: நின்றதால் தொடரும் தற்போதைய நிலையை வலியுறுத்தும் கிரேக்க நிறைவுக்கால வினையின் நிலைத்தன்மையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐδόθησαν αὐτοῖς
  choice: அவர்களுக்கு ... கொடுக்கப்பட்டன
  rationale: கொடுப்பவர் யார் என்பதைச் சொல்லாமல் விடும் கிரேக்கச் செயப்பாட்டு அமைப்பைப் பாதுகாக்கிறது; ‘பெற்றுக்கொண்டார்கள்’ என மாற்றுவது பார்வைக்கோணத்தை மாற்றிவிடும்.
- source_word: σάλπιγγες
  choice: எக்காளங்கள்
  rationale: வெளிப்படுத்தின விசேஷத்தின் விண்ணுலக மற்றும் நியாயத்தீர்ப்பு உருவகத்தில் σάλπιγγες என்பதற்குப் பொருத்தமான, பரவலாகப் புரியக்கூடிய தமிழ் சொல்.
theological_decisions:
- issue: ஏழு தூதர்களின் அடையாளமும் நிலையும்
  choice: ‘கடவுளுக்கு முன்பாக நிற்கிற ஏழு தூதர்கள்’ என்று நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஏழு பிரதான தூதர்கள்’ அல்லது பிற்கால மரபில் பெயரிடப்பட்ட குறிப்பிட்ட தூதர்கள்
  rationale: கிரேக்க உரை அவர்களை ஒரு குறிப்பிட்ட ஏழு தூதர்களாகக் காட்டுகிறது; ஆனால் அவர்களுடைய பதவிநிலையை ‘பிரதான தூதர்கள்’ என்று வரையறுக்கவில்லை. ஆகவே பிற்கால மரபை உரைக்குள் சேர்க்காமல் மூலத்தின் தெளிவும் வரம்பும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன தரமான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘கடவுள்’, ‘தூதர்கள்’, ‘எக்காளங்கள்’ ஆகிய சொற்கள் இயல்பும் வேதாகமச் சூழலின் துல்லியமும் சமநிலைப்படுத்துகின்றன.
