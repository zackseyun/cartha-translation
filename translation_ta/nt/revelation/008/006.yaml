  text: Καὶ οἱ ἑπτὰ ἄγγελοι οἱ ἔχοντες τὰς ἑπτὰ σάλπιγγας ἡτοίμασαν ⸀αὑτοὺς ἵνα σαλπίσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/006.yaml
  text: And the seven angels who had the seven trumpets prepared themselves to sound them[a].
translation:
  language: ta
  text: ஏழு எக்காளங்களை வைத்திருந்த அந்த ஏழு தூதர்களும் அவற்றை ஊதத் தங்களை ஆயத்தப்படுத்தினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எக்காளங்களை முழக்குவதற்காக.’ கிரேக்க வினைச்சொல் ‘எக்காளம் ஊது/முழக்கு’ என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελοι
  choice: தூதர்கள்
  rationale: வெளிப்படுத்தின விசேஷத்தின் இந்த வானுலகக் காட்சியில் இச்சொல் மனிதச் செய்தியாளர்களை அல்ல, வானதூதர்களைக் குறிக்கிறது; ‘தூதர்கள்’ என்பது தமிழில் இயல்பான வேதாகமச் சொல்.
- source_word: ἔχοντες
  choice: வைத்திருந்த
  rationale: நிகழ்காலப் பெயரெச்சத்தை இயல்பான தமிழ் சார்பு அமைப்பில் கொடுத்து, அவர்கள் ஏழு எக்காளங்களையும் தங்களிடம் கொண்டிருந்ததைத் தெரிவிக்கிறது.
- source_word: σάλπιγγας
  choice: எக்காளங்கள்
  rationale: σάλπιγξ என்பதன் எக்காளம்/தாரை என்ற பொருளில், வெளிப்படுத்தின விசேஷத்தின் மரபான பேரொலி ஊதுகருவி உருவகத்துக்கு ‘எக்காளம்’ தெளிவாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: ἡτοίμασαν αὑτοὺς
  choice: தங்களை ஆயத்தப்படுத்தினார்கள்
  rationale: வினையுடன் வரும் தற்சுட்டுப் பெயர்ச்சொல்லை வெளிப்படையாகப் பேணி, அவர்கள் தாங்களே தயாரானார்கள் என்ற பொருளைத் தருகிறது.
- source_word: ἵνα σαλπίσωσιν
  choice: அவற்றை ஊத
  rationale: ἵνα கூறும் நோக்கத்தை தமிழில் இயல்பான நோக்க வினையெச்சமாகத் தருகிறது; ‘அவற்றை’ என்பது உடனுள்ள ஏழு எக்காளங்களைக் குறிக்கத் தெளிவுக்காகச் சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: வெளிப்படுத்தின விசேஷத்தின் சூழலில் ἄγγελοι யாரைக் குறிக்கிறது
  choice: வானதூதர்களைக் குறிக்கும் ‘தூதர்கள்’
  alternative: மனிதச் செய்தியாளர்கள்
  rationale: வானுலக வழிபாட்டுக் காட்சியும், முடிவுக்கால நிகழ்வுகளோடு தொடர்புடைய ஏழு எக்காளங்கள் இவர்களிடம் இருப்பதும், இவர்கள் வானதூதர்கள் என்பதையே வலுவாக ஆதரிக்கின்றன; மொழிபெயர்ப்பு இதற்கு மேல் எந்தக் கோட்பாட்டையும் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘தங்களை ஆயத்தப்படுத்தினார்கள்’ மூலத்தின் தற்சுட்டு வலிமையைப் பேணுகிறது; ‘அவற்றை ஊத’ என்பது நோக்கத்தைக் குறிக்கும் ἵνα அமைப்பைச் சுருக்கமான இயல்பான தமிழில் தருகிறது.
