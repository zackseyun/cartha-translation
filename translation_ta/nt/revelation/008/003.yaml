id: REV.8.3
reference: Revelation 8:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ἄγγελος ἦλθεν καὶ ἐστάθη ἐπὶ τοῦ θυσιαστηρίου ἔχων λιβανωτὸν χρυσοῦν, καὶ ἐδόθη αὐτῷ θυμιάματα πολλὰ ἵνα ⸀δώσει ταῖς προσευχαῖς τῶν ἁγίων πάντων ἐπὶ τὸ θυσιαστήριον τὸ χρυσοῦν τὸ ἐνώπιον τοῦ θρόνου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/003.yaml
  text: And another angel came and stood at the altar[a], holding a golden censer[b], and much incense was given to him so that he might offer it with the prayers of all the saints on the golden altar before the throne.
translation:
  language: ta
  text: இன்னொரு தேவதூதர் வந்து பலிபீடத்தருகே நின்றார். அவர் ஒரு பொன் தூபக்கலசத்தை[a] வைத்திருந்தார். பரிசுத்தவான்கள் அனைவருடைய வேண்டுதல்களோடு சேர்த்து, அரியணைக்கு முன்பாக இருந்த பொன் பலிபீடத்தின்மேல் செலுத்துவதற்காக[b] அவருக்கு மிகுந்த தூபப்பொருள் கொடுக்கப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தூபம் எரிக்கும் ஒரு பொற்கலன்.’
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘பரிசுத்தவான்கள் அனைவருடைய வேண்டுதல்களுக்கு அதை அவர் கொடுப்பதற்காக.’ இச்சூழலில், தூபம் அவர்களுடைய வேண்டுதல்களோடு சேர்த்துச் செலுத்தப்படுவதை இது குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: இன்னொரு தேவதூதர்
  rationale: ἄλλος என்பது வேறொரு வகையான உயிரை அல்ல, வரிசையில் கூடுதலாக வரும் ஒரு தூதரைக் குறிக்கிறது. இச்சூழலில் ἄγγελος என்பதற்கு நவீனத் தமிழில் ‘தேவதூதர்’ என்பது தெளிவான, இயல்பான இணை.
- source_word: ἐστάθη ἐπὶ τοῦ θυσιαστηρίου
  choice: பலிபீடத்தருகே நின்றார்
  rationale: ἐπί + genitive இங்கு பலிபீடத்தின் மேல் நின்றார் என்று அல்லாமல், அதன் அருகில் தமது இடத்தை எடுத்துக்கொண்டார் என்பதைக் குறிக்கிறது.
- source_word: λιβανωτὸν χρυσοῦν
  choice: ஒரு பொன் தூபக்கலசம்
  rationale: λιβανωτός என்பது தூபம் எரிக்கப் பயன்படும் பாத்திரம். ‘தூபக்கலசம்’ சுருக்கமாகவும் வழிபாட்டுச் சூழலுக்கு ஏற்றதாகவும் உள்ளது; பொதுவான மாற்றுச் சொற்றொடர் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἐδόθη αὐτῷ θυμιάματα πολλὰ
  choice: அவருக்கு மிகுந்த தூபப்பொருள் கொடுக்கப்பட்டது
  rationale: θυμιάματα என்பது தூபமாக எரிக்கப்படும் பொருளை அல்லது தூபப் படையலைக் குறிக்கலாம். ‘மிகுந்த தூபப்பொருள்’ அதன் அளவையும் பொருள்சார் தன்மையையும் இயல்பாக வெளிப்படுத்தி, மூலத்தின் செயப்பாட்டு வடிவத்தையும் காக்கிறது.
- source_word: ἵνα δώσει
  choice: செலுத்துவதற்காக
  rationale: δίδωμι என்பதன் அடிப்படைப் பொருள் ‘கொடு’ என்றாலும், தூபமும் பலிபீடமும் இடம்பெறும் வழிபாட்டுச் சூழலில் ‘செலுத்து’ என்பது நோக்கத்தை இயல்பாக வெளிப்படுத்துகிறது. எழுவாய்-பயனிலை உறவைத் தமிழில் தெளிவாக்க இவ்வினை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ταῖς προσευχαῖς τῶν ἁγίων πάντων
  choice: பரிசுத்தவான்கள் அனைவருடைய வேண்டுதல்களோடு சேர்த்து
  rationale: இங்குள்ள வேற்றுமைத் தொடர்பு சுருக்கமானதும் இலக்கண ரீதியாகக் கடினமானதும் ஆகும். தூபம் வேண்டுதல்களுடன் இணைந்து செலுத்தப்படுகிறது என்ற சூழல்சார் பொருளை ‘வேண்டுதல்களோடு சேர்த்து’ தெரிவிக்கிறது; மேலும் சொற்சார்ந்த வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: ἅγιοι
  choice: பரிசுத்தவான்கள்
  rationale: வெளிப்படுத்தலில் ἅγιοι என்பது கடவுளுக்கெனப் பிரித்தெடுக்கப்பட்ட மக்களைக் குறிக்கிறது. ‘பரிசுத்தவான்கள்’ என்பது நிலைபெற்ற, சுருக்கமான தமிழ் இணை.
- source_word: ἐπὶ τὸ θυσιαστήριον τὸ χρυσοῦν
  choice: பொன் பலிபீடத்தின்மேல்
  rationale: ἐπί + accusative இங்கு செலுத்தப்படும் தூபம் பலிபீடத்தின்மேல் வைக்கப்படுவதை அல்லது எரிக்கப்படுவதை நோக்கிய இயக்கத்தைக் குறிக்கிறது.
- source_word: τὸ ἐνώπιον τοῦ θρόνου
  choice: அரியணைக்கு முன்பாக இருந்த
  rationale: ἐνώπιον என்பது இடத்தொடர்பாக ‘முன்பாக’ அல்லது ‘முன்னிலையில்’ என்பதைக் குறிக்கிறது. ‘அரியணைக்கு முன்பாக’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
theological_decisions:
- issue: பரிசுத்தவான்களின் வேண்டுதல்களுக்கும் தூபத்திற்கும் இடையிலான தொடர்பு
  choice: தூபம் பரிசுத்தவான்கள் அனைவருடைய வேண்டுதல்களோடு சேர்த்துச் செலுத்தப்படுகிறது.
  alternative: தூபம் பரிசுத்தவான்களின் வேண்டுதல்களுக்குக் கொடுக்கப்படுகிறது என்று வேற்றுமை உருபை நேரடியாகப் புரிந்துகொள்வது.
  rationale: கிரேக்கத் தொடரமைப்பு சுருக்கமாக இருந்தாலும், ஆலய-வழிபாட்டு உருவகமும் உடனடிச் சூழலும் தூபம் வேண்டுதல்களோடு இணைந்து செலுத்தப்படுவதை ஆதரிக்கின்றன. தூதரின் இடைநிலைப் பணி குறித்து வசனம் கூறுவதற்கு மேல் ஒரு கோட்பாட்டை மொழிபெயர்ப்பு சேர்க்கவில்லை; சொற்சார்ந்த மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வெளிப்படுத்தலின் ஆலயக் காட்சிக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. நீண்ட கிரேக்க வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டது. ‘தூபக்கலசம்’, ‘பலிபீடம்’, ‘பரிசுத்தவான்கள்’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் காக்கப்பட்டுள்ளன; கடினமான வேற்றுமைத் தொடர்பு அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்பட்டுள்ளது.
