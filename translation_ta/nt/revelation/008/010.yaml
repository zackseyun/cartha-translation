id: REV.8.10
reference: Revelation 8:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ὁ τρίτος ἄγγελος ἐσάλπισεν· καὶ ἔπεσεν ἐκ τοῦ οὐρανοῦ ἀστὴρ μέγας καιόμενος ὡς λαμπάς, καὶ ἔπεσεν ἐπὶ τὸ τρίτον τῶν ποταμῶν καὶ ἐπὶ τὰς πηγὰς τῶν ὑδάτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/010.yaml
  text: And the third angel sounded his trumpet[a], and a great star fell from heaven, burning like a torch[c][b], and it fell on a third of the rivers and on the springs of the waters.
translation:
  language: ta
  text: மூன்றாவது வானதூதர் எக்காளம் ஊதினார். அப்போது வானத்திலிருந்து[a] தீப்பந்தத்தைப்போல்[b] எரிந்துகொண்டிருந்த ஒரு பெரிய நட்சத்திரம்[c] விழுந்தது. அது ஆறுகளில் மூன்றில் ஒரு பங்கின்மேலும் நீரூற்றுகளின்மேலும் விழுந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விண்ணுலகத்திலிருந்து’ என்றும் மொழிபெயர்க்கலாம். οὐρανός என்ற கிரேக்கச் சொல் வானத்தையோ விண்ணுலகத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘விளக்கைப்போல்’ என்றும் மொழிபெயர்க்கலாம். λαμπάς என்பது விளக்கையோ தீப்பந்தத்தையோ குறிக்கலாம்; இங்கே எரிந்துகொண்டு விழும் நட்சத்திரத்தின் காட்சிக்கு ‘தீப்பந்தம்’ நன்றாகப் பொருந்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘நட்சத்திரம்’ என்ற உருவகம் விளக்கம் சேர்க்காமல் அப்படியே வைக்கப்பட்டுள்ளது. அது வானதூதரான ஓர் உயிரையா, விண்கல் போன்ற பொருளையா, அல்லது அடையாளப் பொருளுடைய ஓர் அதிகாரத்தையா குறிக்கிறது என்பதில் விளக்கவுரையாளர்கள் வேறுபடுகின்றனர்.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ τρίτος ἄγγελος
  choice: மூன்றாவது வானதூதர்
  rationale: இக்காட்சிச் சூழலில் ἄγγελος ஒரு விண்ணுலகத் தூதரைக் குறிக்கிறது. ‘வானதூதர்’ என்பது நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: ἐσάλπισεν
  choice: எக்காளம் ஊதினார்
  rationale: σαλπίζω என்பது எக்காளத்தை ஊதுவதைக் குறிக்கிறது. தமிழில் வினைச்செயலை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்தும் சொற்றொடர் இது.
- source_word: ἀστὴρ μέγας
  choice: ஒரு பெரிய நட்சத்திரம்
  rationale: பெயர்–பெயரடை அமைப்பை நேரடியாகப் பேணுகிறது; ‘பெரிய’ என்பது அதன் அளவையோ பிரமாண்டத்தையோ குறிக்கக்கூடிய கிரேக்கச் சொல்லின் விரிவைச் சுருக்கவில்லை.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: வானத்திலிருந்து
  rationale: οὐρανός என்பதற்கு ‘வானம்’ அல்லது ‘விண்ணுலகம்’ என்ற பொருள் வரலாம். காட்சியின் உயர்ந்த நடையைப் பேணியபடியே இரு நுண்ணுணர்வுகளுக்கும் இடமளிக்க ‘வானம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: καιόμενος ὡς λαμπάς
  choice: தீப்பந்தத்தைப்போல் எரிந்துகொண்டிருந்த
  rationale: καιόμενος தொடர்ச்சியாக எரியும் நிலையையும் λαμπάς இங்கு கொழுந்துவிட்டு எரியும் தீப்பந்தத்தின் உருவகத்தையும் காட்டுகின்றன. உவமை தெளிவாகப் பேணப்பட்டுள்ளது.
- source_word: ἔπεσεν ... καὶ ἔπεσεν
  choice: விழுந்தது ... விழுந்தது
  rationale: முதலில் வானத்திலிருந்து கீழிறங்குவதையும் பின்னர் நீர்நிலைகளின்மீது விழுவதையும் வலியுறுத்தும் மூலத்தின் வினைமீளுருவாக்கம் தமிழிலும் பேணப்பட்டுள்ளது.
- source_word: ἐπὶ τὸ τρίτον τῶν ποταμῶν
  choice: ஆறுகளில் மூன்றிலொரு பகுதியின்மீது
  rationale: τὸ τρίτον என்பது வெளிப்படுத்தின விசேஷத்தின் இச்சூழலில் மொத்தத்தில் மூன்றில் ஒரு பங்கைக் குறிக்கிறது. தமிழில் அளவைக் குழப்பமின்றி தெரிவிக்கிறது.
- source_word: πηγὰς τῶν ὑδάτων
  choice: நீரூற்றுகள்
  rationale: πηγή என்பது இயற்கையாகப் பொங்கிவரும் ஊற்று. கிரேக்கப் பன்மையின் பொருளைச் சுருக்காமல் நவீனத் தமிழில் இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: விழும் நட்சத்திரம் எதைக் குறிக்கிறது?
  choice: ‘ஒரு பெரிய நட்சத்திரம்’ என்ற காட்சி அப்படியே மொழிபெயர்க்கப்பட்டது.
  alternative: வானதூதரான ஓர் உயிர், விண்கல் போன்ற பொருள், அல்லது அடையாளப் பொருளுடைய ஓர் அதிகாரம் என விளக்குதல்.
  rationale: இந்த வசனம் அந்த நட்சத்திரத்தின் அடையாளப் பொருளை வெளிப்படையாகத் தீர்மானிக்கவில்லை. ஆகவே எந்த ஒரு விளக்கத்தையும் மொழிபெயர்ப்புக்குள் புகுத்தாமல் மூலத்தின் தெளிவின்மையும் இறையியல் இழுவிசையும் பேணப்பட்டுள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழில், வெளிப்படுத்தின விசேஷத்தின் காட்சிநிறைந்த கண்ணியமான நடையைப் பேணும் வகையில் வடிவமைக்கப்பட்டது. அளவுக்கு அதிகமான சமயக்குழுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன; மூலத்தில் இருமுறை வரும் ‘விழுந்தது’ என்பதும் வலியுறுத்தலுக்காகப் பேணப்பட்டுள்ளது.
