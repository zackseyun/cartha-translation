id: REV.8.9
reference: Revelation 8:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἀπέθανε τὸ τρίτον ⸀τῶν κτισμάτων τῶν ἐν τῇ θαλάσσῃ, τὰ ἔχοντα ψυχάς, καὶ τὸ τρίτον τῶν πλοίων ⸀διεφθάρησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/009.yaml
  text: And a third of the creatures in the sea—the ones that have living souls—died[a], and a third of the ships were destroyed.
translation:
  language: ta
  text: கடலில் உள்ள உயிருள்ள படைப்பினங்களில் மூன்றில் ஒரு பங்கு இறந்தது[a]; கப்பல்களில் மூன்றில் ஒரு பங்கு அழிக்கப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு வகையில்: ‘உயிரைக் கொண்ட படைப்பினங்களில்’ அல்லது ‘உயிரினங்களில்.’ கிரேக்கத்தில்: ‘உயிர்களை/ஆத்துமாக்களைக் கொண்டவை.’'
    reason: ψυχάς என்பது இங்கு உயிர், வாழ்வு, அல்லது உயிருள்ள தன்மை எனப் பொருள்படலாம்; ‘ஆத்துமா’ என்ற நேரடி வடிவம் தேவையற்ற தொழில்நுட்பப் பொருளை உணர்த்தக்கூடும்.
lexical_decisions:
- source_word: ἀπέθανε
  choice: இறந்தது
  rationale: ἀποθνῄσκω என்பதன் நேரடியான பொருளைத் தருகிறது. எழுவாயான ‘மூன்றில் ஒரு பங்கு’ என்பதோடு ஒருமை வினை இயல்பாகப் பொருந்துகிறது.
- source_word: τὸ τρίτον
  choice: மூன்றில் ஒரு பங்கு
  rationale: அளவைக் குறிக்கும் கிரேக்கத் தொடரைத் தெளிவான, இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: κτισμάτων
  choice: படைப்பினங்கள்
  rationale: κτίσμα என்பது ‘படைக்கப்பட்டது’ அல்லது ‘படைப்புயிர்’ எனப் பொருள்படலாம். கடலில் இருந்து உயிரைக் கொண்டிருப்பவை என்ற சூழலில், உயிருள்ள படைப்புகளைக் குறிக்கும் ‘படைப்பினங்கள்’ பொருத்தமானது.
- source_word: τῶν ἐν τῇ θαλάσσῃ
  choice: கடலிலிருந்த
  rationale: கடலுக்குள் இருந்தவை என்ற இடப்பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: τὰ ἔχοντα ψυχάς
  choice: உயிரைக் கொண்டிருந்தவற்றில்
  rationale: இங்கு ψυχή உயிருள்ள நிலையைச் சுட்டுகிறது. ‘உயிரைக் கொண்டிருந்தவை’ என்பது தொழில்நுட்பமான ஆன்மவியல் கருத்தைத் திணிக்காமல் கிரேக்கத் தொடரின் தனித்துவத்தைக் காக்கிறது.
- source_word: πλοίων
  choice: கப்பல்கள்
  rationale: πλοῖον என்பதற்கான தெளிவான, வழக்கமான தமிழ்ச் சொல்.
- source_word: διεφθάρησαν
  choice: அழிக்கப்பட்டது
  rationale: இச்சூழலில் διαφθείρω ஒழுக்கக் கெடுதலை அல்ல, அழிவை அல்லது நாசத்தைச் சுட்டுகிறது; இறப்பிலிருந்து வேறுபட்ட அழிவைக் காட்டும் செயப்பாட்டு வடிவமும் காக்கப்படுகிறது.
theological_decisions:
- issue: கடல்வாழ் படைப்புகளை விவரிக்கும் இடத்தில் ψυχάς என்பதன் மொழிபெயர்ப்பு
  choice: முதன்மை உரையில் ‘உயிரைக் கொண்டிருந்தவை’ என்று மொழிபெயர்த்து, மாற்றுச் சொற்பொருள்களை அடிக்குறிப்பில் தருதல்
  alternative: ‘ஆத்துமாக்களைக் கொண்டிருந்தவை’ அல்லது வெறுமனே ‘உயிரினங்கள்’
  rationale: இவ்வசனம் விலங்குகளின் ஆத்துமாவைப் பற்றிய தொழில்நுட்பக் கோட்பாட்டை முன்வைப்பதில்லை. அதேவேளை, ψυχή என்ற சொல்லின் இருப்பை முற்றிலும் மறைக்காமல், தமிழில் இயல்பாக அதன் உயிர்/வாழ்வு சார்ந்த பொருளைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இடைச்செருகல் போன்ற கிரேக்க விளக்கத் தொடரை நீள்கோடுகள் காக்கின்றன; ‘படைப்பினங்கள்’ என்ற சொல் κτίσμα என்பதன் படைப்பு சார்ந்த நுணுக்கத்தையும் உயிருள்ள குறிப்பையும் இணைக்கிறது.
