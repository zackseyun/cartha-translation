id: REV.8.7
reference: Revelation 8:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ὁ πρῶτος ἐσάλπισεν· καὶ ἐγένετο χάλαζα καὶ πῦρ μεμιγμένα ἐν αἵματι, καὶ ἐβλήθη εἰς τὴν γῆν· καὶ τὸ τρίτον τῆς γῆς κατεκάη, καὶ τὸ τρίτον τῶν δένδρων κατεκάη, καὶ πᾶς χόρτος χλωρὸς κατεκάη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/007.yaml
  text: And the first sounded his trumpet[a], and there came hail and fire mixed with blood, and it was thrown onto the earth. And a third of the earth was burned up, and a third of the trees was burned up[b], and all the green grass was burned up.
translation:
  language: ta
  text: முதலாமவர் எக்காளம் ஊதினார். அப்போது இரத்தத்தோடு கலந்த கல்மழையும் நெருப்பும் உண்டாயின; அது பூமியின்மேல்[a] எறியப்பட்டது. பூமியின் மூன்றில் ஒரு பங்கு எரிந்து அழிந்தது; மரங்களில் மூன்றில் ஒரு பங்கு எரிந்து அழிந்தது; பசும்புல் அனைத்தும் எரிந்து அழிந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிலத்தின்மேல்.” γῆ என்ற கிரேக்கச் சொல் “பூமி” அல்லது “நிலம்” எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πρῶτος
  choice: முதலாமவர்
  rationale: மூலத்தில் ‘தூதர்’ என்னும் பெயர்ச்சொல் இங்கே மீண்டும் இடம்பெறவில்லை; முந்தைய சூழலிலிருந்து அது விளங்குகிறது. எனவே அந்த விடுபாட்டைப் பேணும் வகையில் ‘முதலாமவர்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ἐσάλπισεν
  choice: எக்காளம் ஊதினார்
  rationale: σαλπίζω என்பது எக்காளத்தை ஒலிக்கச் செய்வதைக் குறிக்கிறது. தமிழில் இயல்பாகவும் சூழலுக்கு ஏற்றவாறும் வினையின் பொருள் வெளிப்பட ‘எக்காளம்’ சேர்க்கப்பட்டது.
- source_word: χάλαζα καὶ πῦρ
  choice: கல்மழையும் நெருப்பும்
  rationale: அழிவை ஏற்படுத்தும் இரு கூறுகளையும் விளக்கம் சேர்க்காமல் தெளிவான, நேரடியான உருவகமாகப் பேணுகிறது.
- source_word: μεμιγμένα ἐν αἵματι
  choice: இரத்தத்தோடு கலந்த
  rationale: இரத்தமும் கல்மழை-நெருப்பும் கலந்திருந்த அதிர்ச்சியூட்டும் தரிசனக் காட்சியை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐβλήθη εἰς τὴν γῆν
  choice: அது பூமியின்மேல் எறியப்பட்டது
  rationale: ஒருமைச் செயலற்ற வினையான ἐβλήθη-ஐப் பேணி, கல்மழையும் நெருப்பும் சேர்ந்த நிகழ்வை ஒரே முழுமையாக ‘அது’ எனக் குறிப்பிடுகிறது; εἰς இங்குள்ள இயக்கத்தை ‘பூமியின்மேல்’ காட்டுகிறது.
- source_word: τὸ τρίτον
  choice: மூன்றில் ஒரு பங்கு
  rationale: ஒரு முழுமையின் மூன்றில் ஒரு பகுதியைக் குறிக்கும் கிரேக்கப் பங்கீட்டு வழக்கை இயல்பான தமிழில் தருகிறது.
- source_word: κατεκάη
  choice: எரிந்து அழிந்தது
  rationale: κατακαίω என்பதிலுள்ள தீவிரமான, அழிவை விளைவிக்கும் எரிதலை ‘எரிந்தது’ என்பதைக் காட்டிலும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: πᾶς χόρτος χλωρός
  choice: பசும்புல் அனைத்தும்
  rationale: χόρτος என்பதை இச்சூழலில் ‘புல்’ என்றும் χλωρός என்பதைச் செறிவாக ‘பசும்’ என்றும் வழங்கி, தெளிவான இயற்கைக் காட்சியைப் பேணுகிறது.
theological_decisions:
- issue: வெளிப்படுத்தின விசேஷத்தின் நியாயத்தீர்ப்புக் காட்சியில் γῆ என்பதன் பரப்பு
  choice: பூமி
  alternative: நிலம் / நிலப்பரப்பு
  rationale: γῆ என்பது ‘நிலம்’ என்றும் ‘பூமி’ என்றும் பொருள்பட முடியும். இங்குள்ள பரந்த அண்டளாவிய நியாயத்தீர்ப்புச் சூழல் ‘பூமி’ என்பதற்கு ஆதரவளிக்கிறது; இருப்பினும் ‘நிலம்’ என்ற சாத்தியத்தை அடிக்குறிப்பு பேணுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான தரிசன-விவரிப்பு நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் தொடர்ச்சியான ‘καὶ’ இணைப்புகள் தமிழில் இயல்பாக வாக்கியங்களாகவும் அரைப்புள்ளிகளாகவும் அமைக்கப்பட்டுள்ளன. ‘தூதர்’ என்பதை வெளிப்படையாகச் சேர்க்காமல் கிரேக்க மூலத்தின் சுருக்கம் பேணப்பட்டுள்ளது.
