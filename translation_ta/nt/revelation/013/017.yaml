id: REV.13.17
reference: Revelation 13:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἵνα μή τις ⸀δύνηται ἀγοράσαι ἢ πωλῆσαι εἰ μὴ ὁ ἔχων τὸ χάραγμα, τὸ ὄνομα τοῦ θηρίου ἢ τὸν ἀριθμὸν τοῦ ὀνόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/017.yaml
  text: so that no one can buy or sell unless he has the mark[b][a], the name of the beast or the number of its name.
translation:
  language: ta
  text: மேலும், அந்த அடையாளம், மிருகத்தின் பெயர் அல்லது அதன்[b] பெயரின் எண் இவற்றில் ஒன்றைக் கொண்டிருப்பவரை[a] தவிர வேறு யாரும் வாங்கவோ விற்கவோ முடியாதபடியும் செய்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கில், ‘கொண்டிருப்பவன்’; ஆண்பால் ஒருமை வடிவம் இங்கே பொதுவாக எந்த நபரையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அவனுடைய பெயரின் எண்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ ἵνα μή τις δύνηται
  choice: மேலும், ... வேறு யாரும் ... முடியாதபடியும் செய்கிறது
  rationale: καί தொடர்ச்சியையும், ἵνα நோக்கம் அல்லது விளைவையும், μή τις எவரும் இல்லை என்ற பொதுவான மறுப்பையும், δύνηται இயலாமையையும் குறிக்கிறது. முந்தைய வசனத்திலிருந்து ஆளும் வினையை இயல்பான தமிழில் தொடரச் செய்வதற்காக ‘செய்கிறது’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἀγοράσαι ἢ πωλῆσαι
  choice: வாங்கவோ விற்கவோ
  rationale: இரண்டு வினைகளும் அன்றாட வணிக நடவடிக்கைகளை நேரடியாகக் குறிக்கின்றன; இணையான தமிழ் அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
- source_word: εἰ μὴ ὁ ἔχων
  choice: கொண்டிருப்பவரைத் தவிர
  rationale: εἰ μή ஒரே விதிவிலக்கை அறிமுகப்படுத்துகிறது; substantival participle ὁ ἔχων தமிழில் இயல்பாக ‘கொண்டிருப்பவர்’ என வழங்கப்படுகிறது.
- source_word: τὸ χάραγμα
  choice: அந்த அடையாளம்
  rationale: χάραγμα பொறிக்கப்பட்ட அல்லது பதிக்கப்பட்ட குறியைக் குறிக்கலாம். வெளிப்படுத்தல் நூலின் சூழலில் ‘அடையாளம்’ தெளிவான, வழக்கமான தமிழ் இணையாகும்.
- source_word: τὸ ὄνομα τοῦ θηρίου
  choice: மிருகத்தின் பெயர்
  rationale: மூலத்தின் நேரடியான உடைமைத் தொடர்பையும் அடுத்த சொற்றொடருடனான இணை அமைப்பையும் காக்கிறது.
- source_word: θηρίου
  choice: மிருகம்
  rationale: வெளிப்படுத்தலில் θηρίον எதிரியான அபோகலிப்டிக் உருவத்திற்கான குறியீட்டுப் பட்டப்பெயராக வருகிறது; ‘மிருகம்’ அந்தப் பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: ἢ τὸν ἀριθμὸν τοῦ ὀνόματος αὐτοῦ
  choice: அல்லது அதன் பெயரின் எண்
  rationale: αὐτοῦ என்பதன் உடனடி முன்னிலைச் சொல் நடுநிலைப் பாலான θηρίον. ஆகவே ‘அதன்’ மூல இலக்கணத் தொடர்பைப் பாதுகாக்கிறது; ‘பெயரின் எண்’ மரபைச் சாராமல் genitive உறவைத் திறந்தவாறே வைக்கிறது.
theological_decisions:
- issue: ὁ ἔχων என்பதிலுள்ள இலக்கண ஆண்பாலும் பொதுப்பொருளும்
  choice: கொண்டிருப்பவர்
  alternative: அவன் கொண்டிருந்தால்
  rationale: கிரேக்க வடிவம் ஆண்பால் ஒருமையாக இருந்தாலும் இங்கே பொதுவாக எந்த நபரையும் குறிக்கிறது. தமிழ் ‘கொண்டிருப்பவர்’ அந்தப் பொதுப்பொருளை இயல்பாக வெளிப்படுத்தி, குறிப்பாக ஆண்களை மட்டுமே குறிக்கிறது என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது; அடிக்குறிப்பு மூல இலக்கணத்தைப் பதிவு செய்கிறது.
- issue: θηρίου-க்குப் பின்வரும் αὐτοῦ என்பதன் சுட்டுப்பெயர்
  choice: அதன் பெயர்
  alternative: அவனுடைய பெயர்
  rationale: θηρίον கிரேக்கத்தில் நடுநிலைப் பெயர்ச்சொல் என்பதால் ‘அதன்’ நேரடியான இணை. இருப்பினும் சூழலில் மிருகம் தனிப்பட்ட செயற்பாட்டுடன் சித்தரிக்கப்படுவதால் ‘அவனுடைய’ என்பதும் சாத்தியம்; அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: τὸ χάραγμα, τὸ ὄνομα ... ἢ τὸν ἀριθμόν ஆகியவற்றின் தொடர்பு
  choice: அடையாளம், மிருகத்தின் பெயர் அல்லது அதன் பெயரின் எண்
  alternative: அடையாளம், அதாவது மிருகத்தின் பெயர் அல்லது அதன் பெயரின் எண்
  rationale: கிரேக்கத்தின் அண்மித்த பெயர்ச்சொற்கள் விளக்கப் பொருத்தமாகவும் பட்டியலாகவும் புரிந்துகொள்ளப்படலாம். ‘அதாவது’ என்று சேர்க்காமல் காற்புள்ளி அமைப்பைப் பாதுகாப்பது, அடையாளம் பெயர் அல்லது எண் என்பதாகத் தீர்மானித்து விடாமல் மூலத்தின் சுருக்கத்தையும் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, எளிதில் புரியும் நடையைக் கொண்டுள்ளது. ‘வாங்கவோ விற்கவோ’ என்ற இயல்பான இணை வடிவம் பொருளாதாரத் தடையைத் தெளிவாகக் காட்டுகிறது. வசனம் முந்தைய வசனத்தின் வாக்கிய அமைப்பைத் தொடர்வதால் ‘மேலும் ... செய்கிறது’ என வழங்கப்பட்டுள்ளது. பெயர் மற்றும் எண்ணின் தொடர்பிலுள்ள கிரேக்கச் சுருக்கம் விளக்கச் சொல் சேர்க்காமல் பாதுகாக்கப்பட்டுள்ளது.
