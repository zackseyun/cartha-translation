revisions:
- from: அது தேவனுக்கு எதிராக நிந்தனைகளைப் பேசத் தன் வாயைத் திறந்தது—அவருடைய பெயரையும் அவருடைய உறைவிடத்தையும்[b]—பரலோகத்தில் குடியிருப்பவர்களையும்[a]—நிந்திப்பதற்காக.
  to: 'அது தன் வாயைத் திறந்தது: தேவனுக்கு எதிராக நிந்தனைச் சொற்களைப் பேசவும், அவருடைய பெயரையும் அவருடைய உறைவிடத்தையும்—பரலோகத்தில் குடியிருப்பவர்களையும்—நிந்திக்கவும்.'
  rationale: 'The revised wording moves the purpose infinitive into a natural coordinated Tamil structure: the mouth is opened both to speak blasphemous words against God and to blaspheme the specified objects. It retains the primary appositional presentation of the final phrase through dashes, without adding an explanatory phrase such as “அதாவது.” Footnote a continues to preserve the plausible coordinate-object reading, and footnote b preserves the lexical range of σκηνή.'
