id: REV.13.6
reference: Revelation 13:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἤνοιξε τὸ στόμα αὐτοῦ εἰς ⸀βλασφημίας πρὸς τὸν θεόν, βλασφημῆσαι τὸ ὄνομα αὐτοῦ καὶ τὴν σκηνὴν αὐτοῦ, τοὺς ἐν τῷ οὐρανῷ σκηνοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/006.yaml
  text: And it opened its mouth in blasphemies against God[a], to blaspheme his name and his dwelling[b], those dwelling in heaven.
translation:
  language: ta
  text: 'அது தன் வாயைத் திறந்தது: தேவனுக்கு எதிராக நிந்தனைச் சொற்களைப் பேசவும், அவருடைய பெயரையும் அவருடைய உறைவிடத்தையும்—பரலோகத்தில் குடியிருப்பவர்களையும்—நிந்திக்கவும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤνοιξε
  choice: திறந்தது
  rationale: இறந்தகால வினைச்சொல்லின் நேரடியான, இயல்பான தமிழ் வடிவம்; மூலத்தின் தெளிவான செயலை அப்படியே காக்கிறது.
- source_word: εἰς βλασφημίας
  choice: நிந்தனைகளைப் பேச
  rationale: பன்மையிலுள்ள βλασφημίας பல நிந்தனைச் சொற்கள் அல்லது தொடர்ச்சியான நிந்தனைகளைச் சுட்டக்கூடும். தமிழில் இயல்பாக இருக்க ‘பேச’ சேர்க்கப்பட்டது.
- source_word: πρὸς τὸν θεόν
  choice: தேவனுக்கு எதிராக
  rationale: பகைமையான பேச்சின் சூழலில் πρός என்பதன் எதிர்ப்புப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: βλασφημῆσαι
  choice: நிந்திப்பதற்காக
  rationale: வாயைத் திறந்ததன் நோக்கத்தைச் சுட்டும் இறந்தகால வினையெச்சத்தின் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: அவருடைய பெயர்
  rationale: தேவனுடைய வெளிப்படுத்தப்பட்ட அடையாளத்தையும் மாண்பையும் உள்ளடக்கும் வேதாகமச் சொல்லாட்சியை விரிவுபடுத்தாமல் காக்கிறது.
- source_word: τὴν σκηνὴν αὐτοῦ
  choice: அவருடைய உறைவிடம்
  rationale: σκηνή என்பதன் ‘கூடாரம்/வாசஸ்தலம்’ பொருளை நவீன வாசகர்களுக்கு இயல்பாகத் தருகிறது; சாத்தியமான மாற்றுச் சொற்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: τοὺς ἐν τῷ οὐρανῷ σκηνοῦντας
  choice: பரலோகத்தில் குடியிருப்பவர்கள்
  rationale: நிகழ்காலப் பெயரெச்சத்தின் தொடர்ந்திருக்கும் வசிப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது. முதன்மை உரையில் இது ‘உறைவிடம்’ என்பதற்கான விளக்க இணைப்பாக இடைக்கோடுகளுக்குள் வைக்கப்பட்டுள்ளது.
- source_word: αὐτοῦ
  choice: தன் / அவருடைய
  rationale: முதல் சுட்டுப்பெயர் மிருகத்தைக் குறிப்பதால் தமிழில் ‘தன்’ என்றும், பிந்தையவை தேவனைக் குறிப்பதால் மரியாதை வடிவமான ‘அவருடைய’ என்றும் மொழிபெயர்க்கப்பட்டன.
theological_decisions:
- issue: ‘அவருடைய உறைவிடம்’ என்பதற்கும் ‘பரலோகத்தில் குடியிருப்பவர்கள்’ என்பதற்கும் உள்ள இலக்கண உறவு
  choice: இறுதித் தொடரை ‘அவருடைய உறைவிடம்’ என்பதற்கான விளக்க இணைப்பாக இடைக்கோடுகளால் காட்டுதல்.
  alternative: ‘அவருடைய பெயர்’, ‘அவருடைய உறைவிடம்’ ஆகியவற்றுடன் இணைந்த மூன்றாவது நேரடிச் செயப்படுபொருளாக, ‘பரலோகத்தில் குடியிருப்பவர்களையும்’ என்று வாசித்தல்.
  rationale: கிரேக்கத் தொடரை விளக்க இணைப்பாகவும், மூன்றாவது இணைச் செயப்படுபொருளாகவும் புரிந்துகொள்ள முடியும். σκηνή மற்றும் σκηνοῦντας ஆகியவற்றின் சொற்பொருள் தொடர்பால் விளக்க இணைப்பு முதன்மை உரையில் காட்டப்படுகிறது; மற்ற வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் வெளிப்படுத்தின விசேஷத்தின் கண்ணியமான, தீவிரமான தொனியைத் தக்கவைக்கும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘தேவன்’, ‘நிந்தனை’, ‘பரலோகம்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் காக்கப்பட்டுள்ளன.
