- from: பெருமையானவற்றையும்[b] இறைநிந்தனைகளையும் பேசும் வாய் அதற்குக் கொடுக்கப்பட்டது[a]; நாற்பத்திரண்டு மாதங்கள் செயல்படுவதற்கான அதிகாரமும் அதற்குக் கொடுக்கப்பட்டது.
  to: பெரிய வார்த்தைகளையும்[b] இறைநிந்தனைகளையும் பேசும் வாய் அதற்குக் கொடுக்கப்பட்டது[a]; நாற்பத்திரண்டு மாதங்கள் செயல்பட அதிகாரமும் அதற்குக் கொடுக்கப்பட்டது.
  rationale: ‘பெருமையானவற்றை’ என்பதற்குப் பதிலாக ‘பெரிய வார்த்தைகளை’ பயன்படுத்துவது μεγάλα என்பதன் வெளிப்படையான, இன்னும் விரிவான பொருளைத் தக்கவைத்துக்கொண்டு நவீனத் தமிழில் நேர்மறையான ‘பெருமை’ பொருளைத் தவிர்க்கிறது. ‘செயல்பட அதிகாரம்’ என்பது ποιῆσαι-க்கு அதிகாரம் வழங்கப்பட்டது என்பதை நேரடியாகக் காட்டுகிறது; ‘தொடர்ந்து இருக்க’ என்ற வேறுபட்ட வாசகம் அடிக்குறிப்பில் மட்டுமே உள்ளது.
