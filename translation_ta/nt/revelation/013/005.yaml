id: REV.13.5
reference: Revelation 13:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἐδόθη αὐτῷ στόμα λαλοῦν μεγάλα καὶ ⸀βλασφημίας, καὶ ἐδόθη αὐτῷ ⸀ἐξουσία ποιῆσαι μῆνας ⸀τεσσεράκοντα δύο.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/005.yaml
  text: And a mouth was given to him[a], speaking great things and blasphemies[b], and authority was given to him to act for forty-two months.
translation:
  language: ta
  text: பெரிய வார்த்தைகளையும்[b] இறைநிந்தனைகளையும் பேசும் வாய் அதற்குக் கொடுக்கப்பட்டது[a]; நாற்பத்திரண்டு மாதங்கள் செயல்பட அதிகாரமும் அதற்குக் கொடுக்கப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப்பிரதிகளிலும் மொழிபெயர்ப்புகளிலும், ‘நாற்பத்திரண்டு மாதங்கள் தொடர்ந்து இருக்க அதற்கு அதிகாரம் கொடுக்கப்பட்டது’ என்று உள்ளது.
    reason: textual_variant
  - marker: b
    text: ‘பெரிய வார்த்தைகள்’ என்பது இச்சூழலில் ஆணவமான அல்லது தற்பெருமையான பேச்சைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη
  choice: கொடுக்கப்பட்டது
  rationale: விலங்கு இதைத் தன்னியல்பாகப் பெற்றிருக்கவில்லை, மாறாகப் பெற்றுக்கொள்கிறது என்பதைச் செயப்பாட்டு வடிவம் காட்டுகிறது. வசனத்தில் இருமுறை வரும் ஒரே அமைப்பையும் இது காக்கிறது.
- source_word: στόμα
  choice: வாய்
  rationale: வெளிப்படுத்தின விசேஷத்தின் காட்சியமைப்பைச் சுருக்கி வெறும் ‘பேச்சுத்திறன்’ என்று மாற்றாமல், மூலத்தின் தெளிவான உருவகத்தைப் பாதுகாக்கிறது.
- source_word: λαλοῦν
  choice: பேசும்
  rationale: ‘வாய்’ என்பதை விளக்கும் நிகழ்காலப் பெயரெச்சத்திற்கு இயல்பான தமிழாக்கம்.
- source_word: μεγάλα
  choice: பெருமையானவற்றை
  rationale: மூலத்தில் உள்ள விரிவான ‘பெரிய/பெருமையானவை’ என்ற பொருளை வைத்துக்கொண்டு, அதை நேரடியாக ‘தற்பெருமைப் பேச்சுகள்’ என்று குறுக்கவில்லை. தமிழில் பேச்சின் உள்ளடக்கத்தைக் குறிக்க ‘வற்றை’ பயன்படுத்தப்பட்டுள்ளது; சூழல்சார் ஆணவப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: βλασφημίας
  choice: இறைநிந்தனைகள்
  rationale: அடுத்த வசனத்தில் தேவனுக்கு எதிரான பேச்சு தெளிவாக இருப்பதால், மதரீதியான அவதூறு மற்றும் அவமதிப்பு என்ற பொருளைத் துல்லியமாக வெளிப்படுத்துகிறது; பன்மையும் காக்கப்படுகிறது.
- source_word: ἐξουσία
  choice: அதிகாரம்
  rationale: வெறும் வலிமையைவிட வழங்கப்பட்ட உரிமை அல்லது அனுமதி என்ற பொருளை இது நன்றாகக் காட்டுகிறது.
- source_word: ποιῆσαι
  choice: செயல்படுவதற்கு
  rationale: ποιέω என்பதன் விரிவான ‘செய்’ என்ற பொருளையும் கால அளவுடன் வரும் இவ்விடத்தின் தமிழ் இயல்பையும் இணைக்கிறது. ‘தொடர்ந்து இருக்க’ என்ற வேறுபட்ட பாடத்தை முதன்மை உரையில் புகுத்தவில்லை.
- source_word: μῆνας τεσσεράκοντα δύο
  choice: நாற்பத்திரண்டு மாதங்கள்
  rationale: கால நீட்சியைக் குறிக்கும் வேற்றுமையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; வெளிப்படுத்தின விசேஷத்தின் குறிப்பிட்ட கால அளவு அப்படியே காக்கப்படுகிறது.
- source_word: αὐτῷ
  choice: அதற்கு
  rationale: குறிக்கப்படுவது விலங்கு என்பதால் நவீனத் தமிழில் ‘அதற்கு’ இயல்பானது; கிரேக்கத்தின் ஆண்பால் வடிவம் இலக்கண/உருவக நபராக்கத்தைச் சார்ந்ததாக இருப்பதால் தமிழில் கட்டாயமாக ‘அவனுக்கு’ என்று மாற்றப்படவில்லை.
theological_decisions:
- issue: μεγάλα குறிக்கும் பேச்சின் தன்மை
  choice: ‘பெருமையானவை’ என்று விரிவான சொல்லாக்கம் வைக்கப்பட்டது.
  alternative: ‘தற்பெருமைப் பேச்சுகள்’ அல்லது ‘ஆணவ வார்த்தைகள்’
  rationale: சூழலில் ஆணவமும் தேவஎதிர்ப்பும் தெளிவாக இருந்தாலும், μεγάλα என்ற சொல் தனியாக ‘தற்பெருமைப் பேச்சுகள்’ என்று மட்டுப்படுத்துவதில்லை. அடுத்துள்ள ‘இறைநிந்தனைகள்’ அதன் தீய தன்மையைத் தெளிவாக்க அனுமதிக்கப்படுகிறது.
- issue: கால அளவுடன் வரும் ποιῆσαι என்பதன் பொருள்
  choice: SBLGNT பாடத்தின்படி ‘நாற்பத்திரண்டு மாதங்கள் செயல்படுவதற்கு’ என மொழிபெயர்க்கப்பட்டது.
  alternative: ‘நாற்பத்திரண்டு மாதங்கள் தொடர்ந்து இருக்க’
  rationale: முதன்மை உரை கொடுக்கப்பட்ட கிரேக்கப் பாடத்தைப் பின்பற்றுகிறது. ‘தொடர்ந்து இருக்க’ என்பது வேறுபட்ட கையெழுத்துப்பிரதிப் பாடம் மற்றும் அதனுடன் தொடர்புடைய மொழிபெயர்ப்பு மரபு என்பதால் அடிக்குறிப்பில் மட்டும் பாதுகாக்கப்படுகிறது.
- issue: ἐδόθη என்ற செயப்பாட்டு வடிவத்தின் இறையியல் விளைவு
  choice: ‘கொடுக்கப்பட்டது’ என்ற கூறு இருமுறையும் அப்படியே வைக்கப்பட்டது.
  alternative: ‘அது பெற்றது’ அல்லது ‘அதற்கு தேவன் கொடுத்தார்’
  rationale: கொடுப்பவர் யார் என்பதை வசனம் வெளிப்படையாகச் சொல்லவில்லை. அதிகாரம் வழங்கப்பட்டது என்ற வரம்பை வைத்துக்கொண்டு, கொடுப்பவரை மொழிபெயர்ப்பிலேயே பெயரிட்டு இறையியல் தெளிவாக்கம் செய்யவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘வாய் கொடுக்கப்பட்டது’ என்ற வெளிப்படுத்தின விசேஷத்துக்குரிய உயிருள்ள காட்சி பாதுகாக்கப்பட்டுள்ளது. நீண்ட கிரேக்க இணைப்பைத் தமிழில் தெளிவாக்க அரைப்புள்ளி பயன்படுத்தப்பட்டாலும், இரு கூறுகளின் இணைநிலை அமைப்பும் மீண்டும் வரும் ‘கொடுக்கப்பட்டது’ என்பதும் காக்கப்பட்டுள்ளன.
