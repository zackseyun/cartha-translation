source:
  edition: SBLGNT
  text: καὶ ποιεῖ σημεῖα μεγάλα, ⸂ἵνα καὶ πῦρ ποιῇ⸃ ἐκ τοῦ οὐρανοῦ ⸂καταβαίνειν εἰς⸃ τὴν γῆν ἐνώπιον τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/013.yaml
  text: And it performs great signs[b][a], even causing fire to come down from heaven to the earth before people.
translation:
  language: ta
  text: அது பெரிய அடையாளங்களைச் செய்கிறது[a]; மனிதர்களின் கண்முன்னே வானத்திலிருந்து பூமிக்கு நெருப்பைக்கூட இறங்கச் செய்கிறது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பெரிய அற்புதங்கள்’ அல்லது ‘பெரிய அதிசயங்கள்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கத்தில் ‘அடையாளங்கள்.’
    reason: lexical_alternative
  - marker: b
    text: ‘மனிதர்கள் முன்னிலையில்’ அல்லது ‘மனிதர்கள் காணும் விதத்தில்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖ
  choice: செய்கிறது
  rationale: σημεῖα என்பதுடன் வரும் ποιεῖ என்பதற்கு இயல்பான தமிழில் ‘அடையாளங்களைச் செய்கிறது’ என்று மொழிபெயர்ப்பது, அசாதாரண செயல்களை நிகழ்த்தும் பொருளைத் தக்கவைக்கிறது.
- source_word: σημεῖα μεγάλα
  choice: பெரிய அடையாளங்கள்
  rationale: σημεῖα என்பதிலுள்ள குறியீட்டு மற்றும் வஞ்சிக்கும் ஆற்றலுடைய செயல்கள் என்ற வெளிப்படுத்தின விசேஷப் பொருளை ‘அடையாளங்கள்’ காக்கிறது; μεγάλα என்பதற்கு ‘பெரிய’ நேரான இணை.
- source_word: ἵνα καὶ πῦρ ποιῇ
  choice: நெருப்பைக்கூட ... இறங்கச் செய்கிறது
  rationale: καὶ இங்குள்ள வலியுறுத்தலை ‘கூட’ காட்டுகிறது; இயல்பான தமிழுக்காக காரணவினை அமைப்பு பயன்படுத்தப்பட்டாலும், நோக்கம் அல்லது விளைவு குறித்த கிரேக்க ἵνα அமைப்பின் நுண்ணிய தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: πῦρ
  choice: நெருப்பு
  rationale: சூழலும் தீர்க்கதரிசனப் பின்னொலியும் சொற்பொருளான ‘நெருப்பு’ என்பதையே கோருகின்றன.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: வானத்திலிருந்து
  rationale: οὐρανός ‘வானம்’ அல்லது ‘பரலோகம்’ எனப் பொருள்படலாம். இங்கு கண்ணுக்குத் தென்படும் கீழிறங்கும் இயக்கத்தையும் மூலத்தின் தெளிவின்மையையும் இயல்பாகத் தக்கவைக்க ‘வானம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: καταβαίνειν εἰς τὴν γῆν
  choice: பூமிக்கு ... இறங்க
  rationale: கீழ்நோக்கிய இயக்கத்தையும் εἰς τὴν γῆν என்பதின் இலக்கையும் தெளிவாகக் காட்டுகிறது.
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: மனிதர்களின் கண்முன்னே
  rationale: ἐνώπιον இங்கு பொதுமக்கள் காணும் விதத்தில் நிகழ்வதை உணர்த்துகிறது; ἀνθρώπων பாலினப் பொதுப்பொருளில் ‘மனிதர்கள்’ என வழங்கப்படுகிறது.
theological_decisions:
- issue: அடையாளங்களின் இயல்பு
  choice: உண்மையாக அல்லது குறைந்தபட்சம் பொதுமக்கள் காணும் விதமாக நிகழும் அடையாளங்களாக விவரித்தல்; அவற்றின் செயல்முறை இயற்கைக்கு அப்பாற்பட்டதா அல்லது வஞ்சகமானதா என்று தீர்மானிக்காமல் விடுதல்
  alternative: ‘அற்புதங்கள்’ என்று மொழிபெயர்த்து இயற்கைக்கு அப்பாற்பட்ட தன்மையைத் திட்டவட்டமாக்குதல், அல்லது வெறும் மாயத்தோற்றம் எனக் காட்டுதல்
  rationale: வசனம் பெரிய அடையாளங்கள் நிகழ்வதையும் மக்கள் காண நெருப்பு இறங்குவதையும் கூறுகிறது; அவை எவ்வாறு நிகழ்கின்றன என்பதை இங்கே விளக்கவில்லை. ஆகவே மூலத்தின் இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
- issue: ἵνα கூறின் நோக்கம் அல்லது விளைவு
  choice: முதன்மை உரையில் இயல்பான காரணவினைத் தொடரைப் பயன்படுத்தி, நோக்கம்/விளைவு நுண்ணிய வேறுபாட்டை அடிக்குறிப்பில் சுட்டுதல்
  alternative: ‘நெருப்பு இறங்கும்படியாக’ என்று வெளிப்படையான நோக்கக் கூறாக மொழிபெயர்த்தல்
  rationale: ἵνα இச்சூழலில் நோக்கத்தையோ விளைவையோ சுட்டக்கூடும்; தமிழ் முதன்மை உரையில் ஒன்றை மட்டும் கட்டாயப்படுத்தாமல் வாசிப்புத்தன்மையைப் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. ‘அது’ என்பது முந்தைய சூழலில் வரும் மிருகத்தைக் குறிக்கிறது. ‘அடையாளங்கள்’ என்ற சொல் யோவானிய/வெளிப்படுத்தின இலக்கியத்தின் குறியீட்டு நுண்ணியத்தைப் பாதுகாக்கிறது.
