id: REV.13.11
reference: Revelation 13:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἄλλο θηρίον ἀναβαῖνον ἐκ τῆς γῆς, καὶ εἶχεν κέρατα δύο ὅμοια ἀρνίῳ, καὶ ἐλάλει ὡς δράκων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/011.yaml
  text: And I saw another beast coming up out of the earth[a], and it had two horns like a lamb, and it was speaking like a dragon.
translation:
  language: ta
  text: பின்பு, பூமியிலிருந்து[a] மேலெழுந்து வந்த வேறொரு மிருகத்தை நான் கண்டேன். அதற்கு ஆட்டுக்குட்டியைப் போன்ற இரண்டு கொம்புகள் இருந்தன; அது வலுசர்ப்பத்தைப் போலப் பேசிக்கொண்டிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நிலத்திலிருந்து.’ γῆ என்ற கிரேக்கச் சொல் ‘பூமி’ அல்லது ‘நிலம்’ என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο θηρίον
  choice: வேறொரு மிருகம்
  rationale: வெளிப்படுத்தின விசேஷத்தின் மறைக்காட்சி மொழியில் θηρίον பகைமை கொண்ட மிருகத்தன்மையான வல்லமையைக் குறிக்கும் நிலையான சொல்; ‘உயிரினம்’ என்பதைக் காட்டிலும் ‘மிருகம்’ அதன் குறியீட்டு வலிமையையும் முன்னைய மிருகத்துடனான தொடர்பையும் காக்கிறது.
- source_word: ἀναβαῖνον ἐκ τῆς γῆς
  choice: பூமியிலிருந்து மேலெழுந்து வந்த
  rationale: நிகழ்காலப் பெயரெச்சமான ἀναβαῖνον, மிருகம் வெளிப்பட்டு மேலே வரும் காட்சியை உயிரோட்டமாகச் சித்தரிக்கிறது. γῆ என்பதற்கு ‘பூமி’ அல்லது ‘நிலம்’ என இரு பொருள்களும் சாத்தியம்; கடலிலிருந்து எழுந்த மிருகத்துடனான காட்சிசார் எதிர்மறை ஒப்புமையைக் காக்க ‘பூமி’ முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டது.
- source_word: εἶχεν κέρατα δύο
  choice: அதற்கு இரண்டு கொம்புகள் இருந்தன
  rationale: இறந்தகாலத் தொடர்நிலை வடிவம் இங்கு மிருகத்தின் தோற்றத்தை விவரிக்கிறது; இயல்பான நவீனத் தமிழில் ‘இருந்தன’ அந்த விவரணப் பொருளைத் தெளிவாகக் கொடுக்கிறது.
- source_word: ὅμοια ἀρνίῳ
  choice: ஆட்டுக்குட்டியின் கொம்புகளைப் போன்ற
  rationale: ὅμοια என்பது பன்மையான ‘கொம்புகள்’ என்பதுடன் இலக்கண ஒத்திசைவு பெறுகிறது. தமிழில் ஒப்பீட்டின் துல்லியமான நோக்கம் கொம்புகளே என்பதை ‘ஆட்டுக்குட்டியின் கொம்புகளைப் போன்ற’ என்று இயல்பாக வெளிப்படுத்தலாம்; இது ஆட்டுக்குட்டியைப் பற்றிய வெளிப்படுத்தின விசேஷத்தின் பரந்த குறியீட்டு ஒலிப்பையும் காக்கிறது.
- source_word: ἐλάλει ὡς δράκων
  choice: வலுசர்ப்பத்தைப் போலப் பேசிக்கொண்டிருந்தது
  rationale: ἐλάλει என்ற இறந்தகாலத் தொடர்நிலை வடிவத்தின் நீடித்த அல்லது இயல்பான செயற்பாட்டை ‘பேசிக்கொண்டிருந்தது’ காட்டுகிறது. ὡς என்பது அடையாளப்படுத்தாமல் ஒப்பிடுவதால் ‘போல’ என மொழிபெயர்க்கப்பட்டது; δράκων என்பதற்கு வெளிப்படுத்தின விசேஷத்தின் நிலையான காட்சிசார் சொல்லாக ‘வலுசர்ப்பம்’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: ἀρνίον என்பது வெளிப்படுத்தின விசேஷத்தின் ‘ஆட்டுக்குட்டி’ உருவகத்தை எதிரொலிக்கக்கூடிய விதம்
  choice: ஆட்டுக்குட்டி
  alternative: குட்டியாடு / சிறிய ஆட்டுக்குட்டி
  rationale: இந்த மிருகத்தின் ஏமாற்றும் வெளித்தோற்றம் நூலின் பிற பகுதிகளில் வரும் உண்மையான ஆட்டுக்குட்டியை நினைவூட்டலாம்; ஆனால் இரண்டையும் ஒன்றாக அடையாளப்படுத்தவில்லை. ‘ஆட்டுக்குட்டி’ இந்தத் தொடர்பையும் பதற்றத்தையும் இயல்பான தமிழில் காக்கிறது; ‘சிறிய’ என்பது மூலத்தில் நோக்கப்படாத அளவுச் சிறுமையை வலியுறுத்தக்கூடும்.
- issue: γῆ என்பதன் பொருள்
  choice: பூமி
  alternative: நிலம்
  rationale: இரண்டும் சொற்பொருள் அடிப்படையில் சாத்தியம். இம்மறைக்காட்சியில் ‘பூமி’ என்பது கடலிலிருந்து எழுந்த மிருகத்துடனான பரந்த எதிர்மறை ஒப்புமையை காக்கிறது; இருப்பினும் ‘நிலம்’ என்ற உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ὡς δράκων என்பது ஒப்புமையா அடையாளமா
  choice: வலுசர்ப்பத்தைப் போல
  alternative: வலுசர்ப்பமாக
  rationale: ὡς இங்கு பேச்சின் தன்மையை ஒப்பிடுகிறது. மிருகமே வலுசர்ப்பம் என்று உரை நேரடியாக அடையாளப்படுத்தாததால், அந்த வேறுபாட்டை ‘போல’ காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடையில் வடிவமைக்கப்பட்டது. மறைக்காட்சியின் ‘மிருகம்,’ ‘கொம்புகள்,’ ‘ஆட்டுக்குட்டி,’ ‘வலுசர்ப்பம்’ ஆகிய முக்கிய உருவகங்கள் நேரடியாகப் பாதுகாக்கப்பட்டுள்ளன. தொடர்நிலைச் செயலை உணர்த்த ‘பேசிக்கொண்டிருந்தது’ பயன்படுத்தப்பட்டது; γῆ என்பதன் உண்மையான இரட்டைச் சாத்தியம் அடிக்குறிப்பில் வைக்கப்பட்டது.
