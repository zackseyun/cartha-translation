reference: Revelation 13:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐδόθη ⸀αὐτῷ ⸂δοῦναι πνεῦμα⸃ τῇ εἰκόνι τοῦ θηρίου, ἵνα καὶ λαλήσῃ ἡ εἰκὼν τοῦ θηρίου καὶ ποιήσῃ ⸀ἵνα ὅσοι ἐὰν μὴ προσκυνήσωσιν τῇ εἰκόνι τοῦ θηρίου ἀποκτανθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/015.yaml
  text: And it was given to him to give breath to the image of the beast[b][a], so that the image of the beast might even speak and cause those who would not worship the image of the beast to be killed.
translation:
  language: ta
  text: மிருகத்தின் உருவத்துக்கு மூச்சைக் கொடுக்க அவனுக்கு அளிக்கப்பட்டது[a], அதனால் மிருகத்தின் உருவம் பேசவும், மிருகத்தின் உருவத்தை வணங்காத அனைவரும் கொல்லப்படும்படி செய்யவும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மிருகத்தின் உருவத்துக்கு ஆவியைக் கொடுக்க” அல்லது “உயிரைக் கொடுக்க.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτῷ
  choice: அவனுக்கு அனுமதி அளிக்கப்பட்டது
  rationale: செயப்பாட்டு வடிவத்தையும், அனுமதி அல்லது அதிகாரத்தை அளித்தவர் யார் என்று கிரேக்கம் குறிப்பிடாமல் விடுவதையும் காக்கிறது. சூழலில் ‘அவன்’ இரண்டாவது மிருகத்தைக் குறிக்கிறது; அந்த அடையாளத்தை மொழிபெயர்ப்பிலேயே விளக்கிச் சேர்க்கவில்லை.
- source_word: δοῦναι πνεῦμα
  choice: மூச்சைக் கொடுக்க
  rationale: πνεῦμα என்பதற்கு ‘மூச்சு’, ‘ஆவி’, ‘உயிர்’ ஆகிய பொருள்கள் இருக்கலாம். உருவம் பேசத் தொடங்கும் இச்சூழலில் ‘மூச்சு’ என்பது காட்சியின் உயிரூட்டும் தன்மையை இயல்பாகத் தெரிவிப்பதோடு, அதற்கு உண்மையான உயிரோ தனிப்பட்ட ஆவியோ கொடுக்கப்பட்டது என்று தேவையின்றி தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: εἰκών
  choice: உருவம்
  rationale: சிலை என்ற ஒரு குறிப்பிட்ட வடிவத்துக்குள் பொருளைச் சுருக்காமல், வணக்கத்துக்குரிய பிரதிமை அல்லது உருவம் என்ற பரந்த பொருளைக் காக்கிறது.
- source_word: θηρίον
  choice: மிருகம்
  rationale: வெளிப்படுத்தின விசேஷத்தின் தரிசன மொழிக்கு ஏற்ற, நிலைபெற்ற மற்றும் நேரடியான சொல்.
- source_word: ἵνα καὶ λαλήσῃ
  choice: அதனால் ... பேசவும் ... முடிந்தது
  rationale: ἵνα கூறும் நோக்கம் அல்லது விளைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது. καί காட்டும் வியப்பூட்டும் கூடுதல் செயலான பேசுதலும் வாக்கிய அமைப்பில் தக்கவைக்கப்படுகிறது.
- source_word: ποιήσῃ ἵνα
  choice: கொல்லப்படும்படி செய்யவும்
  rationale: கிரேக்கத்தின் காரணப்படுத்தும் அமைப்பை இயல்பான தமிழில் தருகிறது; உருவமே பேசுவதோடு கொலை நடைபெறச் செய்கிறது என்ற இலக்கணத் தொடர்பையும் காக்கிறது.
- source_word: ὅσοι ἐὰν μὴ προσκυνήσωσιν
  choice: அதை வணங்காதவர்கள் அனைவரும்
  rationale: நிபந்தனைத் தன்மையுள்ள வரையறையற்ற தொடர்புச் சொல்லை தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது; வணங்க மறுப்பவர்கள் அல்லது வணங்காதவர்கள் அனைவரையும் உள்ளடக்குகிறது.
- source_word: προσκυνήσωσιν
  choice: வணங்க
  rationale: வெளிப்படுத்தின விசேஷத்தில் மிருகத்துக்கும் அதன் உருவத்துக்கும் செலுத்தப்படும் மத வழிபாட்டைக் குறிக்கும் சூழலுக்கு ஏற்ற சொல்.
- source_word: ἀποκτανθῶσιν
  choice: கொல்லப்படும்படி
  rationale: கிரேக்கத்தின் செயப்பாட்டு வடிவத்தைப் பாதுகாத்து, யார் நேரடியாகக் கொல்வார்கள் என்பதை மொழிபெயர்ப்பு சேர்க்காமல் விடுகிறது.
theological_decisions:
- issue: உருவத்துக்குக் கொடுக்கப்படும் πνεῦμα என்பதன் பொருள்
  choice: மூச்சு
  alternative: ஆவி; உயிர்
  rationale: உருவம் பேசுவதுடன் மூச்சு நேரடியாகப் பொருந்துகிறது; அதற்குத் தெய்வீக உயிரோ தனிப்பட்ட ஆவியோ குடிகொண்டதாக உரை கூறுகிறது என்று தீர்மானிக்காமல், படைப்பை ஒத்த அச்சமூட்டும் உயிரூட்டல் காட்சியைப் பாதுகாக்கிறது.
- issue: ἐδόθη என்ற செயப்பாட்டு வினையின் மறைந்துள்ள கொடுப்பவர்
  choice: கொடுப்பவர் யார் என்பதைச் சொல்லாமல், ‘அனுமதி அளிக்கப்பட்டது’ என்று மொழிபெயர்த்தல்
  alternative: கடவுள் அனுமதித்தார்; சாத்தான் அதிகாரம் கொடுத்தான்
  rationale: கிரேக்க உரை கொடுப்பவரை வெளிப்படையாக அடையாளப்படுத்தவில்லை. எனவே வாசகர் சூழலிலிருந்து புரிந்துகொள்ள வேண்டிய இறையியல் பதற்றத்தையும் மறைமுக அதிகாரத்தையும் மொழிபெயர்ப்பு தீர்த்து வைக்கவில்லை.
- issue: கொல்லப்படச் செய்வதில் யார் செயல்படுகிறார்
  choice: உருவமே பேசவும் கொல்லப்படும்படி செய்யவும் முடிந்தது என்ற இலக்கணத் தொடர்பைக் காத்தல்
  alternative: இரண்டாவது மிருகமே மக்களைக் கொல்லச் செய்தது என்று வெளிப்படையாகக் கூறுதல்
  rationale: அருகிலுள்ள எழுவாய் ἡ εἰκὼν τοῦ θηρίου என்பதால், உருவம் இரண்டு செயல்களுடனும் தொடர்புடையதாக வாசிக்க முடிகிறது. செயலாக்கத்தின் நடைமுறை முகவரை உரை குறிப்பிடாததால் அதைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் அமைக்கப்பட்டது. தரிசன மொழியின் தீவிரம் காக்கப்பட்டுள்ளது; ‘சிலை’ போன்ற மிகக் குறுகிய சொல்லும், கொடுப்பவர் அல்லது கொலையாளி யார் என்பதை விளக்கிச் சேர்ப்பதும் தவிர்க்கப்பட்டுள்ளன.
