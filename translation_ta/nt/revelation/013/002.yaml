id: REV.13.2
reference: Revelation 13:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ τὸ θηρίον ὃ εἶδον ἦν ὅμοιον παρδάλει, καὶ οἱ πόδες αὐτοῦ ὡς ἄρκου, καὶ τὸ στόμα αὐτοῦ ὡς στόμα λέοντος. καὶ ἔδωκεν αὐτῷ ὁ δράκων τὴν δύναμιν αὐτοῦ καὶ τὸν θρόνον αὐτοῦ καὶ ἐξουσίαν μεγάλην.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/002.yaml
  text: And the beast that I saw was like a leopard[a], and its feet were like a bear's, and its mouth was like a lion's mouth. And the dragon gave it his power and his throne and great authority.
translation:
  language: ta
  text: நான் கண்ட மிருகம் சிறுத்தையைப் போல இருந்தது[a]. அதன் கால்கள் கரடியின் கால்களைப் போலவும், அதன் வாய் சிங்கத்தின் வாயைப் போலவும் இருந்தன. அந்த வலுசர்ப்பம் தன் வல்லமையையும் தன் அரியணையையும் மிகுந்த அதிகாரத்தையும் அதற்குக் கொடுத்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சிறுத்தை, கரடி, சிங்கம் ஆகியவற்றின் உருவங்கள் தானியேல் 7-ல் வரும் மிருகங்களைப் பற்றிய தரிசனங்களை எதிரொலிக்கின்றன.
    reason: cross_reference
lexical_decisions:
- source_word: θηρίον
  choice: மிருகம்
  rationale: வெளிப்படுத்தலில் வரும் கொடூரமான வெளிப்பாட்டு அடையாளத்தின் பொருளையும் மரபாக அறியப்படும் குறியீட்டு வலிமையையும் ‘மிருகம்’ இயல்பாகத் தக்கவைக்கிறது.
- source_word: ὅμοιον παρδάλει
  choice: சிறுத்தையைப் போல
  rationale: ὅμοιος + வேற்றுமை வடிவம் ஒப்புமையைக் குறிக்கிறது; ‘சிறுத்தையைப் போல’ என்பது இயல்பான நவீனத் தமிழில் காட்சியின் ஒப்புமையை நேரடியாக வழங்குகிறது.
- source_word: πόδες
  choice: கால்கள்
  rationale: πούς என்பதன் வழக்கமான பொருள் கால்; விலங்கின் பாதங்கள் அல்லது पंजங்கள் என்று குறிப்பாக்காமல் மூலத்தின் பொதுச் சொல்லைத் தக்கவைக்கிறது.
- source_word: ὡς ἄρκου
  choice: கரடியின் கால்களைப் போல
  rationale: கிரேக்கத்தில் முன் வந்த ‘கால்கள்’ என்பதுடன் தொடர்புடைய சுருக்கப்பட்ட ஒப்புமை; தமிழில் தெளிவும் இயல்பும் பெற ‘கரடியின் கால்களைப் போல’ என விரித்துரைக்கப்படுகிறது.
- source_word: στόμα ... ὡς στόμα λέοντος
  choice: வாய் ... சிங்கத்தின் வாயைப் போல
  rationale: மூலத்தில் στόμα மீண்டும் வருவதால், காட்சியின் தெளிவையும் வாக்கியச் சமநிலையையும் காக்க ‘வாய்’ இருமுறையும் இடம்பெறுகிறது.
- source_word: δράκων
  choice: வலுசர்ப்பம்
  rationale: வெளிப்படுத்தல் நூலின் அபோகலிப்டிக் δράκων உருவத்தைக் குறிக்கும் நிலைபெற்ற, கண்ணியமான தமிழ் வேதாகமச் சொல்லாக ‘வலுசர்ப்பம்’ பயன்படுத்தப்படுகிறது; சாதாரண பாம்பை விட அச்சுறுத்தும் பெருஞ்சர்ப்ப உருவத்தை உணர்த்துகிறது.
- source_word: ἔδωκεν
  choice: கொடுத்தது
  rationale: δίδωμι என்பதன் நேரடியான பொருளை இயல்பான தமிழில் அளிக்கிறது.
- source_word: δύναμιν
  choice: வல்லமை
  rationale: செயலாற்றும் ஆற்றலைக் குறிக்கும் δύναμις என்பதையும் ஆட்சி உரிமையைக் குறிக்கும் ἐξουσία என்பதையும் தமிழில் வேறுபடுத்திக் காட்டுகிறது.
- source_word: θρόνον
  choice: அரியணை
  rationale: அரசாட்சி மற்றும் ஆளுகையின் வெளிப்படையான சின்னமாகிய θρόνος என்பதற்கான இயல்பான, கண்ணியமான தமிழ் இணை.
- source_word: ἐξουσίαν μεγάλην
  choice: மிகுந்த அதிகாரம்
  rationale: ἐξουσία என்பது ஆளுவதற்கான அதிகாரம் அல்லது உரிமையைக் குறிக்கிறது; μεγάλην என்பதைக் ‘மிகுந்த’ என வழங்குவது இயல்பான தமிழை உருவாக்குகிறது.
- source_word: αὐτοῦ
  choice: தன்
  rationale: வலுசர்ப்பமே தன்னுடைய வல்லமையையும் அரியணையையும் கொடுக்கிறது என்பதைத் தமிழின் தற்சுட்டுப் பெயரால் தெளிவாகவும் சுருக்கமாகவும் காட்டுகிறது.
theological_decisions:
- issue: வலுசர்ப்பத்துக்கும் மிருகத்துக்கும் இடையிலான உறவைப் பெயர்ச்சுட்டுகளில் வெளிப்படுத்துதல்
  choice: மிருகத்தை ‘அது/அதற்கு’ என்றும், வலுசர்ப்பத்தின் உடைமைகளை ‘தன்’ என்றும் குறிப்பிடுதல்
  alternative: இரண்டுக்கும் ‘அது/அதன்’ என்ற ஒரே வடிவைப் பயன்படுத்துதல்
  rationale: கிரேக்க αὐτός வடிவங்கள் சூழலால் தீர்மானிக்கப்படுகின்றன. தமிழில் ‘தன்’ என்பது கொடுப்பவன் வலுசர்ப்பம் என்றும், பெறுவது மிருகம் என்றும் தெளிவுபடுத்துகிறது; இதனால் உரையில் இல்லாத கூடுதல் கோட்பாடு சேர்க்கப்படுவதில்லை.
- issue: பல விலங்குகள் இணைந்த உருவகத்தைக் கருத்துவிளக்கமின்றி தக்கவைத்தல்
  choice: சிறுத்தை, கரடி, சிங்கம் ஆகிய ஒப்புமைகளை முதன்மை உரையில் நேரடியாக வழங்குதல்
  alternative: தானியேல் 7-ஐச் சுட்டும் விளக்கத்தை முதன்மை உரையிலேயே சேர்த்தல்
  rationale: இந்த உருவங்கள் தானியேல் 7-ஐ எதிரொலித்தாலும், கிரேக்க வசனம் அந்தத் தொடர்பை விளக்கவில்லை. ஆகவே உருவகத்தை உரையில் அப்படியே வைத்து, தொடர்பை அடிக்குறிப்பில் மட்டும் குறிப்பிடுவது மூலத்தின் மறைமுகத் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. காட்சியின் மீளுரைகளும் δύναμις/ἐξουσία இடையிலான வேறுபாடும் பாதுகாக்கப்பட்டுள்ளன; தானியேல் தொடர்பான விளக்கம் முதன்மை உரையில் சேர்க்கப்படவில்லை.
