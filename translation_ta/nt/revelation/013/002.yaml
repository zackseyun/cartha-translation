  terminology: மிருகம், சிறுத்தை, கரடி, சிங்கம், வலுசர்ப்பம், வல்லமை, அரியணை, and அதிகாரம் are suitable choices. In particular, வல்லமை and அதிகாரம் preserve the source distinction between δύναμις and ἐξουσία. The Daniel 7 allusion is confined to the footnote and does not overinterpret the main text.
