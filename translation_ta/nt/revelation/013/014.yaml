id: REV.13.14
reference: Revelation 13:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ πλανᾷ ⸀τοὺς κατοικοῦντας ἐπὶ τῆς γῆς διὰ τὰ σημεῖα ἃ ἐδόθη αὐτῷ ποιῆσαι ἐνώπιον τοῦ θηρίου, λέγων τοῖς κατοικοῦσιν ἐπὶ τῆς γῆς ποιῆσαι εἰκόνα τῷ θηρίῳ, ⸂ὃς ἔχει⸃ τὴν πληγὴν ⸂τῆς μαχαίρης καὶ ἔζησεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/014.yaml
  text: And it deceives those who dwell on the earth because of the signs that it was given to perform in the presence of the beast[c][b][a], telling those who dwell on the earth to make an image for the beast that had the wound of the sword and yet lived.
translation:
  language: ta
  text: அது மிருகத்தின் முன்னிலையில் செய்யும்படி அதற்குக் கொடுக்கப்பட்ட அடையாளங்களால், பூமியில் குடியிருக்கிறவர்களை ஏமாற்றுகிறது[a]. வாளால் உண்டான காயம் இருந்தும் உயிர்வாழ்ந்த[c] அந்த மிருகத்திற்காக ஓர் உருவத்தைச் செய்யும்படி[b] பூமியில் குடியிருக்கிறவர்களிடம் சொல்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: ‘பூமியில் குடியிருக்கிறவர்களை வழிதவறச் செய்கிறது.’'
    reason: lexical_alternative
  - marker: b
    text: 'அல்லது: ‘மிருகத்தின் உருவத்தைச் செய்யும்படி’; கிரேக்கத்தில் இன்னும் சொல்லுக்குச் சொல் முறையில், ‘மிருகத்திற்காக ஓர் உருவத்தை’ என்று உள்ளது.'
    reason: lexical_alternative
  - marker: c
    text: 'அல்லது: ‘வாளால் உண்டான காயம் பெற்று உயிர்பெற்ற.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλανᾷ
  choice: ஏமாற்றுகிறது
  rationale: நிகழ்காலச் செயப்பாட்டு வினையின் நேரடியான பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; வழிதவறச் செய்கிறது என்பதும் சாத்தியமான பொருள் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: κατοικοῦντας / κατοικοῦσιν ἐπὶ τῆς γῆς
  choice: பூமியில் குடியிருக்கிறவர்கள்
  rationale: வெளிப்படுத்தின விசேஷத்தில் மீண்டும் மீண்டும் வரும் கருப்பொருள் சார்ந்த தொடரின் வினைச்சொல் தன்மையைப் பாதுகாக்கிறது.
- source_word: διὰ τὰ σημεῖα
  choice: அடையாளங்களால்
  rationale: διά உடன் வரும் இத்தொடரின் கருவி அல்லது வழிமுறை சார்ந்த பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: σημεῖα
  choice: அடையாளங்கள்
  rationale: அற்புதமான செயல்கள் என்று விளக்கத்தைச் சேர்க்காமல், சொல்லின் அடிப்படைப் பொருளைத் தக்கவைக்கிறது.
- source_word: ἐδόθη αὐτῷ ποιῆσαι
  choice: செய்வதற்கு அதற்குக் கொடுக்கப்பட்ட
  rationale: கொடுப்பவர் யார் என்பதை வெளிப்படையாகச் சேர்க்காமல் மூலத்தின் செயப்பாட்டு அமைப்பையும் அனுமதி சார்ந்த மறைபொருளையும் பாதுகாக்கிறது.
- source_word: ἐνώπιον τοῦ θηρίου
  choice: மிருகத்தின் முன்னிலையில்
  rationale: இடம் மற்றும் உறவு ஆகிய இரண்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: λέγων
  choice: செய்யும்படி ... சொல்கிறது
  rationale: கட்டளையிடுகிறது என்று வலிமையை அதிகரிக்காமல், உரையின் சொல்லுதல் சார்ந்த பொருளை இயல்பாகத் தருகிறது.
- source_word: ποιῆσαι εἰκόνα τῷ θηρίῳ
  choice: மிருகத்திற்காக ஓர் உருவத்தைச் செய்யும்படி
  rationale: τῷ θηρίῳ என்பதன் வேற்றுமைப் பொருளை ‘மிருகத்திற்காக’ என்று பாதுகாக்கிறது; உருவம் யாருக்காக செய்யப்படுகிறது என்பதைக் காட்டுகிறது.
- source_word: εἰκόνα
  choice: உருவம்
  rationale: சிலை என்று பொருளைச் சுருக்காமல், வழிபாட்டுக்குரிய பிரதிநிதித்துவம் உட்பட சொல்லின் பரந்த பொருள் வரம்பைப் பாதுகாக்கிறது.
- source_word: τὴν πληγὴν τῆς μαχαίρης
  choice: வாளால் உண்டான காயம்
  rationale: மூலத்தின் ‘வாளின் காயம்’ என்ற உறவை இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: καὶ ἔζησεν
  choice: இருந்தும் உயிர்வாழ்ந்த
  rationale: காயத்துக்குப் பின்பும் உயிருடன் இருந்தது அல்லது மீண்டது என்ற சூழல் சார்ந்த எதிர்மறைத் திருப்பத்தைத் தருகிறது; உயிர்த்தெழுதல் என்ற வலுவான விளக்கத்தை கட்டாயப்படுத்தவில்லை.
theological_decisions:
- issue: ἐδόθη என்பதில் மறைந்துள்ள கொடுப்பவர்
  choice: ‘அதற்குக் கொடுக்கப்பட்ட’ என்று செயப்பாட்டு வடிவைத் தக்கவைத்து, கொடுப்பவரை வெளிப்படையாகக் குறிப்பிடவில்லை.
  alternative: ‘கடவுள் அதற்கு அதிகாரம் கொடுத்தார்’ அல்லது ‘அது அனுமதிக்கப்பட்டது’.
  rationale: வெளிப்படுத்தின விசேஷத்தின் தெய்வீக அனுமதி சார்ந்த உட்பொருளை மறுக்காமலும், மூலத்தில் இல்லாத வெளிப்படையான எழுவாயைச் சேர்க்காமலும் இருக்கிறது.
- issue: ἔζησεν என்பதன் வலிமை
  choice: ‘இருந்தும் உயிர்வாழ்ந்த’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘உயிர்பெற்றது’ அல்லது ‘மீண்டும் உயிரடைந்தது’.
  rationale: காயத்திற்குப் பிந்தைய உயிர்நிலையைச் சொல்கிறது; ஆனால் முழுமையான உயிர்த்தெழுதல் குறித்த விளக்கத்தை வசனத்திற்குள் திணிக்கவில்லை.
- issue: εἰκών மற்றும் மிருகத்துக்கான அதன் தொடர்பு
  choice: ‘மிருகத்திற்காக ஓர் உருவம்’ என்று தரப்பட்டது.
  alternative: ‘மிருகத்தின் உருவம்’.
  rationale: கிரேக்கத்தில் உடைமை வேற்றுமை அல்ல, நான்காம் வேற்றுமை இருப்பதால் அர்ப்பணிப்பு அல்லது தொடர்பு குறித்த உண்மையான நுணுக்கம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பூமியில் குடியிருக்கிறவர்கள்’ என்ற தொடர் நூலின் கருப்பொருள் சார்ந்த மீளுரையைப் பாதுகாக்கிறது. செயப்பாட்டு வடிவம், உருவம் யாருக்காக என்பது, காயத்திற்குப் பிந்தைய உயிர்நிலை ஆகியவற்றின் மூலமொழித் தெளிவின்மை மற்றும் இறையியல் பதற்றம் தீர்த்து வைக்கப்படவில்லை.
