id: REV.13.9
reference: Revelation 13:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Εἴ τις ἔχει οὖς ἀκουσάτω.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/009.yaml
  text: If anyone has an ear[a], let him hear.
translation:
  language: ta
  text: யாருக்காவது காது இருந்தால், அவர் கேட்கட்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἴ τις
  choice: யாருக்காவது … இருந்தால்
  rationale: நிபந்தனை வடிவத்தையும், அனைவரையும் உள்ளடக்கும் indefinite pronoun-இன் திறந்த பொருளையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: ἔχει οὖς
  choice: காது இருந்தால்
  rationale: மூலத்தில் உள்ள ஒருமை ‘காது’ என்பதைக் காத்து, கேட்டு ஏற்றுக்கொள்ளும் திறனைச் சுட்டும் பழமொழிப்பாங்கான சொல்லாட்சியை நேரடியாக வழங்குகிறது.
- source_word: ἀκουσάτω
  choice: அவர் கேட்கட்டும்
  rationale: மூன்றாம் நபர் ஒருமை கட்டளை வடிவத்தின் அழைப்புத் தன்மையைப் பாதுகாக்கிறது. ‘கேட்கட்டும்’ என்பது வெறும் ஒலி உணர்வை மட்டுமல்ல, கவனித்துக் கேட்டு ஏற்றுக்கொள்ளும் வேதாகமச் சொல்லாட்சியையும் தக்கவைக்கிறது; ‘அவர்’ நவீனத் தமிழில் பாலினம் குறிப்பிடாத ஒருமைச் சுட்டாக இயல்பாகச் செயல்படுகிறது.
theological_decisions:
- issue: ஒருமை வடிவத்தையும் பொதுவான அழைப்பையும் வெளிப்படுத்துதல்
  choice: அவர் கேட்கட்டும்
  alternative: அவர்கள் கேட்கட்டும்
  rationale: மூலத்தின் மூன்றாம் நபர் ஒருமையைத் தக்கவைத்தபடியே, பாலினத்தைக் குறிப்பிடாத பொதுவான அழைப்பைத் தமிழின் இயல்பான ‘அவர்’ மூலம் வெளிப்படுத்துகிறது.
- issue: கேட்கும் அழைப்பின் மரபுவழிப் பொருள்
  choice: கேட்கட்டும்
  alternative: புரிந்துகொள்ளட்டும் / கவனிக்கட்டும்
  rationale: மூலத்தின் ‘கேள்’ என்ற சொல்லையும் அதன் தீர்க்கதரிசன அழைப்பின் ஒலியையும் காக்கிறது; ‘புரிந்துகொள்ளட்டும்’ போன்ற விரிவாக்கம் பொருளைத் தேவையின்றி குறுக்கிவிடும்.
translation_notes:
  register: சுருக்கமான, கண்ணியமான, நவீன பொதுத்தமிழ். கிரேக்கத்தின் நிபந்தனை அமைப்பும் ஒருமை வடிவமும் காக்கப்பட்டுள்ளன; தமிழில் இயல்பில்லாத பாலினக் குறிப்பு சேர்க்கப்படவில்லை.
