id: REV.13.1
reference: Revelation 13:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἐκ τῆς θαλάσσης θηρίον ἀναβαῖνον, ἔχον κέρατα δέκα καὶ κεφαλὰς ἑπτά, καὶ ἐπὶ τῶν κεράτων αὐτοῦ δέκα διαδήματα, καὶ ἐπὶ τὰς κεφαλὰς αὐτοῦ ⸀ὀνόματα βλασφημίας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/001.yaml
  text: And I saw a beast coming up out of the sea[a], having ten horns and seven heads, and on its horns ten crowns[b], and on its heads names of blasphemy.
translation:
  language: ta
  text: கடலிலிருந்து ஒரு மிருகம் மேலே எழுந்துவருவதைக் கண்டேன். அதற்குப் பத்துக் கொம்புகளும் ஏழு தலைகளும் இருந்தன. அதன் கொம்புகளின்மேல் பத்து மணிமுடிகளும்[a], அதன் தலைகளின்மேல் தூஷணப் பெயர்களும்[b] இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரச மணிமுடிகள்.”
    reason: διάδημα என்பது குறிப்பாக அரசுரிமையைக் குறிக்கும் தலை அலங்காரத்தைக் குறிக்கிறது.
  - marker: b
    text: சொல்லுக்கு சொல், “பழிப்பின் பெயர்கள்.”
    reason: ὀνόματα βλασφημίας என்ற கிரேக்க மரபுத்தொடரின் வடிவத்தைப் பாதுகாக்கும் மாற்று மொழிபெயர்ப்பு; மூலத்தில் பழிப்பின் இலக்கு வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
lexical_decisions:
- source_word: εἶδον
  choice: கண்டேன்
  rationale: ὁράω என்பதன் இறந்தகாலக் கதை வடிவத்தை இயல்பான எளிய இறந்தகால வினையாகத் தருகிறது; ‘தரிசனத்தில்’ போன்ற விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: ἐκ τῆς θαλάσσης
  choice: கடலிலிருந்து
  rationale: ἐκ குறிக்கும் கடலின் உள்ளிருந்து வெளிப்படும் இயக்கத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: θηρίον
  choice: மிருகம்
  rationale: வெளிப்படுத்தின விசேஷத்தின் குறியீட்டு உருவகத்தை விளக்கமாக மாற்றாமல் நேரடியாகத் தக்கவைக்கிறது.
- source_word: ἀναβαῖνον
  choice: மேலே எழுந்துவருவதை
  rationale: நிகழ்ந்துகொண்டிருக்கும் மேல்நோக்கிய வெளிப்பாட்டைத் தமிழில் காட்சிப்பட இயல்பாகக் காட்டுகிறது.
- source_word: κέρατα δέκα καὶ κεφαλὰς ἑπτά
  choice: பத்துக் கொம்புகளும் ஏழு தலைகளும்
  rationale: கிரேக்க மூலத்தின் எண்ணிக்கைகளையும் குறியீட்டுப் படிமங்களையும் விளக்கமின்றி நேரடியாகப் பாதுகாக்கிறது.
- source_word: διαδήματα
  choice: மணிமுடிகள்
  rationale: διάδημα குறிக்கும் அரசாட்சிக்குரிய தலை அலங்காரத்தை பொதுவான ‘கிரீடம்’ என்பதைக் காட்டிலும் துல்லியமாகவும் புரியக்கூடிய தமிழிலும் தருகிறது.
- source_word: ὀνόματα βλασφημίας
  choice: கடவுளைப் பழிக்கும் பெயர்கள்
  rationale: βλασφημία என்பதன் இச்சூழலிலான கடவுளுக்கு எதிரான அவதூறு அல்லது பழிப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; கிரேக்க மரபுத்தொடரின் மாற்று வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: வெளிப்படுத்தல் நூலின் குறியீட்டுக் காட்சிகள்
  choice: ‘மிருகம்’, ‘கொம்புகள்’, ‘தலைகள்’, ‘மணிமுடிகள்’ ஆகிய உருவகங்களை அப்படியே வைத்தல்
  alternative: மிருகத்தை ஓர் அரசு, பேரரசு, ஆட்சியாளர் அல்லது சாத்தானிய முகவர் என்று முதன்மை உரையிலேயே அடையாளப்படுத்துதல்
  rationale: வசனம் காட்சியை முன்வைக்கிறது; அதன் குறியீடுகளுக்கான குறிப்பிட்ட இறுதிக்கால விளக்கத்தை மொழிபெயர்ப்புக்குள் புகுத்தாமல் இறையியல் பதற்றத்தையும் பன்முக வாசிப்பையும் பாதுகாக்கிறது.
- issue: ὀνόματα βλασφημίας என்ற மரபுத்தொடரின் பொருள்
  choice: கடவுளைப் பழிக்கும் பெயர்கள்
  alternative: பழிப்பின் பெயர்கள்
  rationale: தமிழில் ‘பழிப்பு’ மட்டும் யாருக்கு எதிரானது என்பது மங்கலாக இருக்கலாம். வெளிப்படுத்தல் நூலின் சூழலில் βλασφημία கடவுளுக்கு எதிரான பழிப்பைக் குறிப்பதால் அதனைத் தெளிவாக்குகிறது; அதேவேளை பெயர்களின் உள்ளடக்கத்தை மேலதிகமாக நிர்ணயிக்கவில்லை.
- issue: διάδηματα என்பதன் அரச அடையாளம்
  choice: மணிமுடிகள்
  alternative: கிரீடங்கள்; அரச மணிமுடிகள்
  rationale: அரசுரிமையைக் குறிக்கும் தலை அலங்காரம் என்ற சொல்லின் தனித்த நுணுக்கத்தைப் பாதுகாக்கிறது; குறியீட்டின் பொருளை விளக்கமாக மாற்றவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, தெளிவான நடையைப் பயன்படுத்துகிறது. நீண்ட கிரேக்க வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; விளக்கவுரைப் பொருள் சேர்க்கப்படவில்லை. ‘அதன்’ என்பது மிருகத்தைக் குறிக்கும் இயல்பான அஃறிணைச் சுட்டுப்பெயராகப் பயன்படுத்தப்பட்டுள்ளது.
