reference: Revelation 13:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ μίαν ἐκ τῶν κεφαλῶν αὐτοῦ ⸀ὡς ἐσφαγμένην εἰς θάνατον, καὶ ἡ πληγὴ τοῦ θανάτου αὐτοῦ ἐθεραπεύθη. καὶ ⸀ἐθαυμάσθη ⸂ὅλη ἡ γῆ⸃ ὀπίσω τοῦ θηρίου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/003.yaml
  text: And one of its heads was as if slaughtered to death[a], and its deadly wound was healed. And the whole earth marveled and followed after the beast[b],
translation:
  language: ta
  text: அதன் தலைகளில் ஒன்று சாகும்வரை அறுக்கப்பட்டதுபோல் இருந்தது[a]. அதன் மரணக் காயம் குணமடைந்தது. பூமி முழுவதும் வியந்து, அந்த மிருகத்தின் பின்னால் சென்றது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சாகும்வரை அறுக்கப்பட்டதாகத் தோன்றியது.’ கிரேக்கத்தில் ‘போல்’ என்ற ஒப்புமை இருப்பதால், இது நேரடியான உறுதிக்கூற்றைக் காட்டிலும் ஒரு தோற்றத்தையோ ஒற்றுமையையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘பூமி முழுவதும்’ என்பதற்குப் பதிலாக ‘நாடு முழுவதும்’ என்றும் மொழிபெயர்க்கலாம்; ஆனால் இந்த அபோகலிப்டிக் சூழலில் உலகளாவிய ‘பூமி’ என்ற பொருள் அதிகம் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: μίαν ἐκ τῶν κεφαλῶν αὐτοῦ
  choice: அதன் தலைகளில் ஒன்று
  rationale: μίαν ἐκ + பன்மை வேற்றுமைத் தொகை ஒரு பகுதியிலிருந்து ஒன்றைக் குறிக்கிறது; தமிழில் இயல்பான பகுதிப்பொருள் அமைப்பு இதுவே.
- source_word: ὡς ἐσφαγμένην εἰς θάνατον
  choice: சாகுமாறு வெட்டிக் கொல்லப்பட்டதுபோல் இருந்தது
  rationale: ὡς என்பதன் ஒப்புமை அல்லது தோற்ற நுட்பத்தை ‘போல்’ காக்கிறது; σφάζω என்பதன் வலிமையை ‘வெட்டிக் கொல்லப்பட்ட’ என்பதும், εἰς θάνατον என்பதன் மரண விளைவை ‘சாகுமாறு’ என்பதும் வெளிப்படுத்துகின்றன.
- source_word: ἡ πληγὴ τοῦ θανάτου αὐτοῦ
  choice: அதன் மரணக் காயம்
  rationale: மரணத்துக்குரிய அல்லது உயிரைப் பறிக்கும் காயம் என்ற செறிவான கிரேக்கத் தொடரை இயல்பான தமிழில் தருகிறது; காயத்தின் தன்மையைத் தீர்மானத்துக்கு அப்பாற்பட்டு வைக்கிறது.
- source_word: ἐθεραπεύθη
  choice: குணமடைந்தது
  rationale: செயப்பாட்டு கிரேக்க வினை காயம் குணப்படுத்தப்பட்ட அல்லது மீண்ட நிலையைச் சுட்டுகிறது; தமிழில் காயத்துடன் இயல்பாக வரும் வடிவம்.
- source_word: ἐθαυμάσθη
  choice: வியந்து
  rationale: ஆச்சரியம் மற்றும் பிரமிப்பைத் தெரிவிக்கிறது; அந்த எதிர்வினை நல்லதா கெட்டதா என்பதைச் சேர்த்து விளக்கவில்லை.
- source_word: ὅλη ἡ γῆ
  choice: பூமி முழுவதும்
  rationale: γῆ என்பதற்கு ‘நிலம்’ என்ற பொருளும் இருக்கலாம்; எனினும் வெளிப்படுத்தின விசேஷத்தின் உலகளாவிய அபோகலிப்டிக் சூழலில் ‘பூமி’ பொருத்தமானது.
- source_word: ὀπίσω τοῦ θηρίου
  choice: அந்த மிருகத்தின் பின்னால் சென்றது
  rationale: திசை சார்ந்த ‘பின்னால்’ என்ற படிமத்தையும், அதைப் பின்பற்றுதல் அல்லது அதனுடன் சார்ந்து செல்லுதல் என்ற பொருளையும் காக்கிறது.
- source_word: θηρίου
  choice: மிருகம்
  rationale: வெளிப்படுத்தின விசேஷத்தின் அபோகலிப்டிக் படிமத்தில் θηρίον என்பதற்கான தெளிவான, வழக்கமான தமிழ் இணை.
theological_decisions:
- issue: மிருகத்தின் தலை அடைந்த மரணமும் குணமடைதலும் எத்தகையவை?
  choice: ஒரு தலை மரணத்துக்குரிய விதத்தில் வெட்டிக் கொல்லப்பட்டதுபோல் தோன்றியதையும், அதன் மரணக் காயம் குணமடைந்ததையும் உரையின் படிமத்தின்படியே மொழிபெயர்த்தல்.
  alternative: இதை சொல்லர்த்தமான மரணமும் உயிர்த்தெழுதலும் என்றோ, ஓர் அரசின் அல்லது ஆட்சியாளரின் அரசியல் மீட்சி என்றோ, திட்டமிட்ட ஏமாற்றுத் தோற்றம் என்றோ வெளிப்படையாக விளக்குதல்.
  rationale: ὡς என்பது ‘போல்’ என்ற ஒப்புமையைத் தருகிறது. காயம் குணமடைந்ததாக உரை கூறினாலும், நிகழ்வின் இயல்பைத் தீர்மானிக்கவில்லை. ஆகவே மொழிபெயர்ப்பு அதன் இறையியல் பதற்றத்தையும் பொருள் தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘வெட்டிக் கொல்லப்பட்டதுபோல்’ என்பது வெளிப்படுத்தின விசேஷத்தின் தீவிரமான பலியிடல்/கொலைப் படிமத்தை காக்கிறது; ‘பின்னால் சென்றது’ என்பது இயக்கத்தையும் விசுவாசச் சார்பையும் முன்கூட்டியே ஒன்றாக மட்டும் தீர்மானிக்காமல் வைத்திருக்கிறது.
