- from: அதன் தலைகளில் ஒன்று சாகுமாறு வெட்டிக் கொல்லப்பட்டதுபோல் இருந்தது[a]. ஆனால் அதன் மரணக் காயம் குணமடைந்தது. பூமி முழுவதும் வியந்து, அந்த மிருகத்தின் பின்னால் சென்றது[b].
  to: அதன் தலைகளில் ஒன்று சாகும்வரை அறுக்கப்பட்டதுபோல் இருந்தது[a]. அதன் மரணக் காயம் குணமடைந்தது. பூமி முழுவதும் வியந்து, அந்த மிருகத்தின் பின்னால் சென்றது[b].
