reference: Revelation 13:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὧδε ἡ σοφία ἐστίν· ὁ ἔχων νοῦν ψηφισάτω τὸν ἀριθμὸν τοῦ θηρίου, ἀριθμὸς γὰρ ἀνθρώπου ἐστίν· καὶ ὁ ἀριθμὸς ⸀αὐτοῦ ⸂ἑξακόσιοι ἑξήκοντα ἕξ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/018.yaml
  text: 'Here is wisdom: let the one who has understanding calculate the number of the beast[a], for it is the number of a man[b], and its number is six hundred sixty-six.'
translation:
  language: ta
  text: 'இங்கே ஞானம் உள்ளது: பகுத்தறிவு உள்ளவன் மிருகத்தின் எண்ணைக் கணக்கிடட்டும்; ஏனெனில், அது ஒரு மனிதனின் எண்[a]; அதன் எண் அறுநூற்று அறுபத்தாறு[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அது மனிதருக்குரிய எண்.”
    reason: alternative_reading
  - marker: b
    text: சில கையெழுத்துப் பிரதிகளில் 666 என்பதற்குப் பதிலாக 616 என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: ὧδε ἡ σοφία ἐστίν
  choice: இதில்தான் ஞானம் உள்ளது
  rationale: ὧδε என்பதன் சுட்டும் வலிமையையும், இவ்விடத்தில் ஞானம் வெளிப்படுகிறது என்ற பொருளையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ὁ ἔχων νοῦν
  choice: பகுத்தறிவு உள்ளவன்
  rationale: νοῦς இங்கு வெறும் ‘மனம்’ அல்ல; புரிந்து வேறுபடுத்தி அறியும் திறனைக் குறிக்கிறது. கிரேக்கத்தின் ஒருமை வடிவமும் காக்கப்படுகிறது.
- source_word: ψηφισάτω
  choice: கணக்கிடட்டும்
  rationale: எண்ணை எண்ணிக் கணிக்கும் பொருளுடைய இறந்தகாலக் கட்டளை வடிவத்தைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: τὸν ἀριθμὸν τοῦ θηρίου
  choice: மிருகத்தின் எண்ணை
  rationale: வெளிப்படுத்தின விசேஷத்தின் அபோகலிப்டிக் சூழலில் θηρίον என்பதற்கான நேரடியான, வழக்கமான தமிழ் இணைச்சொல் ‘மிருகம்’ ஆகும்.
- source_word: ἀριθμὸς γὰρ ἀνθρώπου ἐστίν
  choice: ஏனெனில், அது ஒரு மனிதனுடைய எண்
  rationale: ἀνθρώπου என்ற ஒருமை உரிமைவேற்றுமையை நெருக்கமாகக் காக்கிறது. அது குறிப்பிட்ட ஒரு மனிதனைச் சுட்டுகிறதா அல்லது பொதுவாக மனிதருக்குரிய எண்ணைக் குறிக்கிறதா என்பதை உரை முழுமையாகத் தீர்மானிக்காததால் மாற்று நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: καὶ ὁ ἀριθμὸς αὐτοῦ
  choice: அதன் எண்
  rationale: αὐτοῦ என்பது நடுநிலைப் பெயர்ச்சொல்லான θηρίον-ஐச் சுட்டுவதால் ‘அதன்’ என்பது இலக்கணரீதியாகத் தெளிவானது.
- source_word: ἑξακόσιοι ἑξήκοντα ἕξ
  choice: அறுநூற்று அறுபத்தாறு
  rationale: கிரேக்க எண்ணின் நேரடியான, இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: ἀριθμὸς γὰρ ἀνθρώπου ἐστίν என்பதில் ἀνθρώπου-ன் பொருள்
  choice: முதன்மை உரையில் ‘ஒரு மனிதனுடைய எண்’
  alternative: ‘மனிதருக்குரிய எண்’ அல்லது ‘மனித எண்’
  rationale: கிரேக்க ஒருமை ஒரு குறிப்பிட்ட மனிதனுடைய எண்ணாகவும், பொதுவாக மனிதத் தன்மைக்குரிய எண்ணாகவும் புரிந்துகொள்ள இடமளிக்கிறது. முதன்மை உரை ஒருமை உரிமைத் தொடர்பைக் காக்கிறது; அடிக்குறிப்பு பொதுவான மனிதப் பொருளையும் திறந்துவைக்கிறது.
- issue: எண்ணின் உரைவேறுபாடு
  choice: முதன்மை உரையில் 666
  alternative: '616'
  rationale: SBLGNT முதன்மை உரை 666-ஐக் கொண்டுள்ளது; ஆனால் பழமையான சில கையெழுத்துப் பிரதிகளில் உள்ள 616 என்ற முக்கிய உரைவேறுபாடு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதே நேரத்தில் மரியாதையும் இலக்கியச் செறிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘பகுத்தறிவு’, ‘கணக்கிடட்டும்’ ஆகிய சொற்கள் வசனத்தின் அறிவார்ந்த சவாலையும் கட்டளைத் தொனியையும் காக்கின்றன; விளக்கவுரைக் கருத்துகள் முதன்மை உரைக்குள் சேர்க்கப்படவில்லை.
