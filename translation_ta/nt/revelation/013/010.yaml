id: REV.13.10
reference: Revelation 13:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: εἴ τις ⸂εἰς αἰχμαλωσίαν, εἰς αἰχμαλωσίαν⸃ ὑπάγει· εἴ τις ἐν μαχαίρῃ ⸀ἀποκτανθῆναι αὐτὸν ἐν μαχαίρῃ ἀποκτανθῆναι. ὧδέ ἐστιν ἡ ὑπομονὴ καὶ ἡ πίστις τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/010.yaml
  text: If anyone is for captivity[a], into captivity he goes; if anyone is to be killed with the sword, with the sword he must be killed[c][b]. Here is the endurance and the faith of the saints.
translation:
  language: ta
  text: ஒருவன் சிறைபிடிக்கப்பட வேண்டியவன் என்றால்[a], சிறைபிடிக்கப்படுவதற்கே அவன் செல்கிறான்; ஒருவன் வாளால் கொல்லப்பட வேண்டியவன் என்றால், அவன் வாளால் கொல்லப்பட வேண்டும்[b]. இதில்தான் பரிசுத்தவான்களின் சகிப்புத்தன்மையும் விசுவாசம்[c] உள்ளது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒருவன் சிறைபிடிக்கப்படுவதற்குச் செல்கிறான் என்றால், சிறைபிடிக்கப்படுவதற்கே அவன் செல்கிறான்.” இந்த வரியை ஒரு கட்டளையாக அல்லாமல், நியமிக்கப்பட்ட முடிவைக் கூறுவதாகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: சில கையெழுத்துப் பிரதிகளிலும் வாசகங்களிலும் இக்கூறு வேறுபடுகிறது; அவற்றுள் சில, “ஒருவன் வாளால் கொன்றால், அவன் வாளால் கொல்லப்பட வேண்டும்” என்று வாசிக்கின்றன. இங்கு ஏற்றுக்கொள்ளப்பட்ட மூலவாசகமே பின்பற்றப்பட்டுள்ளது; எனினும், இந்த உரைவேறுபாடு பொருள்விளக்கத்திற்கு முக்கியமானது.
    reason: textual_variant
  - marker: c
    text: அல்லது, “பரிசுத்தவான்களின் விசுவாசத்தன்மை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τις
  choice: ஒருவன் ... என்றால்
  rationale: பொதுவான, வரையறுக்கப்படாத நிபந்தனையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: εἰς αἰχμαλωσίαν ... ὑπάγει
  choice: சிறையிருப்புக்குரியவன் ... சிறையிருப்புக்குள் அவன் செல்கிறான்
  rationale: மூலத்தில் உள்ள சுருக்கமான பழமொழி வடிவத்தையும் ‘சிறையிருப்பு’ என்ற சொல்லின் வலியுறுத்தும் மறுபடியும் வருதலையும் காக்கிறது; நியமிக்கப்பட்ட முடிவு என்ற பொருளையும் வெளிப்படுத்துகிறது.
- source_word: αἰχμαλωσία
  choice: சிறையிருப்பு
  rationale: சிறைப்பிடிக்கப்பட்ட நிலையில் இருப்பதைக் குறிக்கும்; ‘சிறைவாசம்’ என்பதைக் காட்டிலும் போரிலும் நியாயத்தீர்ப்பிலும் சிறைப்பிடிக்கப்படும் தொனியைப் பாதுகாக்கிறது.
- source_word: ἐν μαχαίρῃ
  choice: வாளால்
  rationale: கருவியைக் குறிக்கும் கிரேக்கத் தொடரைத் தெளிவாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது; வேதாகம நியாயத்தீர்ப்புத் தொனியையும் காக்கிறது.
- source_word: ἀποκτανθῆναι
  choice: கொல்லப்பட
  rationale: செயப்பாட்டு வினை வடிவத்தைத் தெளிவான தற்போதைய தமிழில் நேரடியாகத் தருகிறது.
- source_word: αὐτὸν
  choice: அவன் ... கொல்லப்பட வேண்டும்
  rationale: கிரேக்கத்தின் சற்றுக் கடினமான கட்டமைப்பை இயல்பான தமிழாக்கமாக்கி, செயப்பாட்டு நிலையையும் தவிர்க்க முடியாத முடிவையும் காக்கிறது.
- source_word: ὧδέ ἐστιν
  choice: இங்குதான் ... இருக்கின்றன
  rationale: அடுத்து சொல்லப்படுவதற்கு கவனத்தை ஈர்க்கும் சுட்டும் வலிமையை ‘தான்’ காக்கிறது.
- source_word: ὑπομονή
  choice: சகிப்புத்தன்மை
  rationale: துன்புறுத்தலின் கீழ் நிலைத்து நிற்கும் பொறுமையைக் குறிக்கும் இயல்பான, எளிதில் புரியும் தமிழ் சொல்.
- source_word: πίστις
  choice: விசுவாசம்
  rationale: அடிப்படைப் பொருளை பிரதான உரையில் காக்கிறது; இச்சூழலில் சாத்தியமான ‘விசுவாசத்தன்மை’ என்ற நுண்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τῶν ἁγίων
  choice: பரிசுத்தவான்களின்
  rationale: வெளிப்படுத்தலில் தேவனுக்குரிய பரிசுத்த மக்களைக் குறிக்கும் வழக்கமான, சுருக்கமான வேதாகமச் சொல்.
theological_decisions:
- issue: முதல் இரண்டு கூறுகள் விவரிக்கும் நியமிக்கப்பட்ட முடிவா, அல்லது கட்டளையா?
  choice: நியமிக்கப்பட்ட முடிவை அல்லது தவிர்க்க முடியாத தீர்ப்பை விவரிக்கும் கூற்றாக மொழிபெயர்த்தல்
  alternative: வன்முறையை எதிர்க்க வேண்டாம் என்ற கட்டளை; அல்லது சிறைப்பிடிப்பவரும் வாளால் கொல்பவரும் அதே விதமாகத் தண்டிக்கப்படுவர் என்ற பழிவாங்கும் நியதி
  rationale: ஏற்றுக்கொள்ளப்பட்ட கிரேக்க வாசகம் சுருக்கமாகவும் உரைவேறுபாடுகளுடனும் இருந்தாலும், சிறையிருப்புக்கும் வாளால் மரணத்திற்கும் நியமிக்கப்பட்டவர் அந்த முடிவுக்குச் செல்கிறார் என்ற பழமொழிப் போன்ற கூற்றாக இயல்பாகப் படுகிறது. வசனம் வெளிப்படையாகக் கூறாத அகிம்சை அல்லது பதிலடி பற்றிய முழுமையான நெறியை மொழிபெயர்ப்பில் புகுத்தவில்லை.
- issue: முடிவுக் கூறிலுள்ள πίστις என்பதன் பொருள்
  choice: விசுவாசம்
  alternative: விசுவாசத்தன்மை
  rationale: πίστις என்பதன் அடிப்படை மொழிபெயர்ப்பு ‘விசுவாசம்’. ஒடுக்குதலின் மத்தியில் நிலைத்திருக்கும் சூழலில் ‘விசுவாசத்தன்மை’ என்பதும் சாத்தியமானதால், அந்த நுண்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் பழமொழி போன்ற சுருக்கமும் ‘சிறையிருப்பு’ என்ற மறுபடியும் வருதலும் இயன்றவரை காக்கப்பட்டுள்ளன. உரைவேறுபாடும் πίστις என்பதன் பொருள் நுணுக்கமும் அடிக்குறிப்புகளில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன.
