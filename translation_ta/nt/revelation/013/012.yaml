id: REV.13.12
reference: Revelation 13:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ τὴν ἐξουσίαν τοῦ πρώτου θηρίου πᾶσαν ποιεῖ ἐνώπιον αὐτοῦ. καὶ ⸀ποιεῖ τὴν γῆν καὶ τοὺς ἐν αὐτῇ κατοικοῦντας ἵνα ⸀προσκυνήσουσιν τὸ θηρίον τὸ πρῶτον, οὗ ἐθεραπεύθη ἡ πληγὴ τοῦ θανάτου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/012.yaml
  text: And it exercises all the authority of the first beast in its presence[a]. And it causes the earth and those who dwell on it to worship the first beast[b], whose mortal wound was healed.
translation:
  language: ta
  text: அது முதல் மிருகத்தின் முழு அதிகாரத்தையும் முதல் மிருகத்தின் முன்னிலையில் செயல்படுத்துகிறது.[a] மரணத்துக்குரிய காயம் குணமாக்கப்பட்ட[b] அந்த முதல் மிருகத்தைப் பூமியும் அதில் குடியிருப்பவர்களும் வழிபடும்படி அது செய்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதற்கு முன்பாக.’ இரண்டாம் மிருகம் முதல் மிருகத்தின் பார்வைக்குள் அல்லது அதன் உடனடி முன்னிலையில் செயல்படுவதை இச்சொற்றொடர் வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், ‘அதன் மரணத்தின் காயம் குணமாக்கப்பட்டது’; அதாவது, ‘அதன் மரணத்துக்குரிய காயம் குணமாக்கப்பட்டது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: அதிகாரம்
  rationale: இச்சொல் வெறும் வலிமையைவிடச் செயல்படுத்தப்படும் அதிகாரம் அல்லது உரிமையைக் குறிக்கிறது.
- source_word: πᾶσαν
  choice: முழுவதையும்
  rationale: முதல் மிருகத்தின் அதிகாரத்தின் முழுமையையும் வலியுறுத்துகிறது.
- source_word: ποιεῖ (முதல் இடம்)
  choice: செயல்படுத்துகிறது
  rationale: ποιεῖ τὴν ἐξουσίαν என்ற சொல்லிணைப்பை இயல்பான தமிழில் அதிகாரத்தை நடைமுறையில் பயன்படுத்துவதாக வெளிப்படுத்துகிறது.
- source_word: ἐνώπιον αὐτοῦ
  choice: அதன் முன்னிலையில்
  rationale: முதல் மிருகத்தின் முன்பாக அல்லது அதன் பார்வைக்குள் இரண்டாம் மிருகம் செயல்படுவதைச் சுட்டுகிறது; இடம் மற்றும் உறவு சார்ந்த நுட்பத்தைப் பாதுகாக்கிறது.
- source_word: ποιεῖ (இரண்டாம் இடம்)
  choice: செய்கிறது
  rationale: ἵνα அமைப்புடன் காரணவினைப் பொருளைத் தருகிறது. வற்புறுத்தலின் அளவை கிரேக்கம் வெளிப்படையாகக் கூறாததால் ‘கட்டாயப்படுத்துகிறது’ என்று வலுப்படுத்தவில்லை.
- source_word: τὴν γῆν
  choice: பூமி
  rationale: வெளிப்படுத்தின விசேஷத்தில் வானம் மற்றும் கடலுக்கு எதிர்நிலையில் உலகளாவிய பொருளை வழக்கமாகக் குறிக்கிறது.
- source_word: τοὺς ἐν αὐτῇ κατοικοῦντας
  choice: அதில் குடியிருப்பவர்கள்
  rationale: வெளிப்படுத்தின விசேஷத்தில் திரும்பத் திரும்ப வரும் ‘பூமியில் குடியிருப்போர்’ என்ற கருப்பொருள் சார்ந்த வினைநயத்தைத் தக்கவைக்கிறது.
- source_word: ἵνα προσκυνήσουσιν
  choice: வழிபடும்படி
  rationale: காரணவினை அமைப்பை இயல்பான தமிழில் தெரிவிக்கிறது; நோக்கம் அல்லது விளைவு என்ற நுட்பத்தைத் திறந்தே வைக்கிறது.
- source_word: θηρίον
  choice: மிருகம்
  rationale: வெளிப்படுத்தல் இலக்கியச் சூழலில் θηρίον என்பதற்கான நேரடியும் நிலைபெற்றதுமான தமிழ் இணை.
- source_word: πρῶτον
  choice: முதல்
  rationale: உடனடி சூழலில் இரண்டாம் மிருகத்திலிருந்து இதை வேறுபடுத்துகிறது.
- source_word: ἐθεραπεύθη
  choice: குணமடைந்த
  rationale: செயப்பாட்டு θεραπεύω என்பதன் குணமாக்கப்படுதல் என்ற பொருளைத் தக்கவைக்கிறது.
- source_word: ἡ πληγὴ τοῦ θανάτου αὐτοῦ
  choice: மரணத்துக்குரிய காயம்
  rationale: சொல்லுக்கு சொல் ‘அதன் மரணத்தின் காயம்’ என்பதற்குப் பதிலாக, மரணத்தை விளைவிக்கத்தக்க காயம் என்ற பொருளை இயல்பாகத் தருகிறது; மூலத்தின் பெயர்ச்சொல் அமைப்பை அடிக்குறிப்பில் காட்டுகிறது.
theological_decisions:
- issue: பூமியில் குடியிருப்பவர்கள்மீது இரண்டாம் மிருகத்தின் செயலின் வலிமை
  choice: வழிபடும்படி அது செய்கிறது
  alternative: வழிபடும்படி அது கட்டாயப்படுத்துகிறது
  rationale: கிரேக்கக் காரணவினை அமைப்பு முதல் மிருகத்தின் வழிபாட்டை இரண்டாம் மிருகம் நிகழச் செய்வதைக் கூறுகிறது; ஆனால் இவ்வாக்கியமே கட்டாயத்தின் துல்லியமான அளவைக் குறிப்பிடவில்லை. ஆகவே அந்த இறையியல் பதற்றம் தீர்க்கப்படாமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அதிகாரத்தைச் செயல்படுத்துகிறது’ என்பது கிரேக்கச் சொல்லிணைப்பை இயல்பாக்குகிறது; ‘வழிபடும்படி ... செய்கிறது’ என்பது காரணவினையின் வலிமையை மிகைப்படுத்தாமல் காக்கிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
