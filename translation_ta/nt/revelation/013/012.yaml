  to: அது முதல் மிருகத்தின் முழு அதிகாரத்தையும் முதல் மிருகத்தின் முன்னிலையில் செயல்படுத்துகிறது.[a] மரணத்துக்குரிய காயம் குணமாக்கப்பட்ட[b] அந்த முதல் மிருகத்தைப் பூமியும் அதில் குடியிருப்பவர்களும் வழிபடும்படி அது செய்கிறது.
  rationale: 'திருத்தம் பொருளை மாற்றாமல் இரண்டு சிறு தெளிவாக்கங்களைச் செய்கிறது: ἐνώπιον αὐτοῦ என்பதன் முன்னிலைச் சுட்டான முதல் மிருகம் பெயரால் மீண்டும் குறிப்பிடப்படுகிறது; ἐθεραπεύθη என்பதன் செயப்பாட்டுப் பொருள் ‘குணமாக்கப்பட்ட’ என வெளிப்படுத்தப்படுகிறது. அடிக்குறிப்பு b அதன் பொருத்தமான சொல்லாட்சியோடு நேரடியாக இணைக்கப்பட்டுள்ளது.'
