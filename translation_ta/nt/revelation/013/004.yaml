id: REV.13.4
reference: Revelation 13:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ προσεκύνησαν τῷ δράκοντι ⸂ὅτι ἔδωκεν⸃ τὴν ἐξουσίαν τῷ θηρίῳ, καὶ προσεκύνησαν τῷ θηρίῳ λέγοντες· Τίς ὅμοιος τῷ θηρίῳ, καὶ τίς ⸀δύναται πολεμῆσαι μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/004.yaml
  text: And they worshiped the dragon because he had given authority to the beast[a], and they worshiped the beast, saying, “Who is like the beast[c][b], and who is able to make war with it?”
translation:
  language: ta
  text: அந்த அரக்கப்பாம்பு மிருகத்திற்கு அதிகாரத்தைக் கொடுத்திருந்ததால், மக்கள் அரக்கப்பாம்பை வணங்கினார்கள். அவர்கள் மிருகத்தையும் வணங்கி, “மிருகத்திற்கு ஒப்பானவர் யார்?[a][c] அதை எதிர்த்துப் போரிட வல்லவர் யார்?[b]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மிருகத்திற்கு நிகரானவர் யார்?”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அதனோடு போர்செய்ய வல்லவர் யார்?”
    reason: lexical_alternative
  - marker: c
    text: இந்தப் புகழுரை, தேவனுக்கு ஒப்பானவர் எவருமில்லை என்று கூறும் பழைய ஏற்பாட்டு மொழியை எதிரொலிப்பதாகத் தெரிகிறது (எடுத்துக்காட்டாக, யாத்திராகமம் 15:11; சங்கீதம் 35:10). இங்கு அந்த மொழி தேவனைப் பழிக்கும் வகையில் மிருகத்திற்குப் பயன்படுத்தப்படுகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: προσεκύνησαν
  choice: வணங்கினார்கள்
  rationale: வெளிப்படுத்தின விசேஷத்தில் இந்த வினை பொதுவாக மதரீதியான வழிபாட்டைக் குறிக்கிறது; வெறுமனே தலைவணங்குதல் அல்லது மரியாதை செலுத்துதல் என்பதைக் காட்டிலும் ‘வணங்கினார்கள்’ இங்குள்ள சிலைவழிபாட்டுத் தன்மையைத் தெளிவாகத் தருகிறது.
- source_word: δράκοντι
  choice: அரக்கப்பாம்பு
  rationale: வெளிப்படுத்தின விசேஷத்தின் பேரழிவும் அச்சமும் நிறைந்த பாம்பு போன்ற உருவகத்தை, விளக்கமாக மாற்றாமல், நவீனத் தமிழில் புரியும்படி நேரடியாகக் குறிக்கிறது.
- source_word: ὅτι ἔδωκεν
  choice: கொடுத்திருந்ததால்
  rationale: ὅτι இங்கு காரணத்தைக் காட்டுகிறது. அதிகாரம் கொடுக்கப்பட்டது மக்கள் வணங்குவதற்கு முன் நிகழ்ந்ததாக உள்ள தொடர்பைத் தமிழின் இறந்தகால நிறைவுவினை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐξουσίαν
  choice: அதிகாரத்தை
  rationale: இச்சொல் வெறும் வலிமையை அல்ல, வழங்கப்பட்ட ஆளும் அதிகாரத்தைச் சுட்டுகிறது.
- source_word: θηρίῳ
  choice: மிருகத்திற்கு / மிருகத்தை
  rationale: வெளிப்படுத்தின விசேஷத்தின் குறியீட்டு உருவத்தை விளக்கவுரையாக மாற்றாமல், θηρίον என்பதன் நேரடிப் பொருளைப் பாதுகாக்கிறது.
- source_word: Τίς ὅμοιος τῷ θηρίῳ
  choice: மிருகத்திற்கு ஒப்பானவர் யார்?
  rationale: மூலத்தின் சொல்லாட்சியையும் வினாவடிவச் சவாலையும், தேவனுடைய ஒப்பற்ற தன்மையைப் பற்றிய வேதாகம மொழியின் சாத்தியமான எதிரொலியையும் பாதுகாக்கிறது.
- source_word: δύναται πολεμῆσαι μετ’ αὐτοῦ
  choice: அதை எதிர்த்துப் போரிட வல்லவர் யார்?
  rationale: πολεμεῖν என்பதன் போர்செய்யும் வலிமையை ‘போரிட’ தக்கவைக்கிறது; hostile sense-ஐ ‘எதிர்த்து’ தெளிவாக்குகிறது. ‘அதை’ என்பது θηρίον என்னும் உயிரினக் குறியீட்டை தேவையின்றி மனித ஆண்பாலாக்காமல் குறிக்கிறது.
theological_decisions:
- issue: மிருகத்தைக் குறிக்கும் பதிலிப்பெயர்
  choice: ‘அதை’ என்று அஃறிணையில் குறிப்பிடுதல்
  alternative: மிருகத்தின் ஆளுமைமிக்க செயல்பாட்டை முன்னிறுத்தி ‘அவனை’ என்று குறிப்பிடுதல்
  rationale: αὐτοῦ என்பது நடுநிலைப் பாலிலுள்ள θηρίον என்பதைக் குறிக்கிறது. தமிழிலும் ‘அதை’ என்பது மிருக உருவகத்தைப் பாதுகாத்து, உரைக்கு அப்பாற்பட்ட தனிநபர் அடையாளத்தைத் திணிப்பதைத் தவிர்க்கிறது.
- issue: தேவனுடைய ஒப்பற்ற தன்மையைப் பற்றிய மொழியின் எதிரொலி
  choice: ‘மிருகத்திற்கு ஒப்பானவர் யார்?’ என்ற சொல்லாட்சியை விளக்கச் சேர்க்கையின்றி வைத்தல்
  alternative: இது தேவனைப் பழிக்கும் போலியான புகழுரை என்று முதன்மை உரையிலேயே வெளிப்படையாகக் கூறுதல்
  rationale: இந்தச் சொற்றொடர் தேவனுடைய ஒப்பற்ற தன்மையைப் போற்றும் பழைய ஏற்பாட்டு மொழியை மிருகத்திற்குப் பயன்படுத்துவதாகத் தோன்றுகிறது. அந்த இறையியல் பதற்றத்தை மொழிபெயர்ப்பு பாதுகாக்கிறது; விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாகப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அரக்கப்பாம்பு’ என்பது கிரேக்க δράκων உருவகத்தின் அச்சமூட்டும் பாம்புத் தன்மையை இயல்பான தமிழில் தருகிறது. மேற்கோளில் உள்ள இரு வினாக்களின் செறிவும் வழிபாட்டு முழக்கத்தின் தன்மையும் காக்கப்பட்டுள்ளன.
