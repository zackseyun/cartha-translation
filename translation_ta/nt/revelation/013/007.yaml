id: REV.13.7
reference: Revelation 13:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτῷ ποιῆσαι πόλεμον μετὰ τῶν ἁγίων καὶ νικῆσαι αὐτούς, καὶ ἐδόθη αὐτῷ ἐξουσία ἐπὶ πᾶσαν φυλὴν καὶ λαὸν καὶ γλῶσσαν καὶ ἔθνος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/007.yaml
  text: And it was given to him to make war against the saints and to conquer them[c][b][a], and authority was given to him over every tribe and people and language and nation.
translation:
  language: ta
  text: பரிசுத்தவான்களுக்கு எதிராகப்[a] போர் செய்யவும், அவர்களை வெல்லவும்[b] அவனுக்குக் கொடுக்கப்பட்டது. மேலும், ஒவ்வொரு குலத்தின்மேலும், மக்களின்மேலும், மொழியின்மேலும்[c], நாட்டின்மேலும் அவனுக்கு அதிகாரம் கொடுக்கப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பரிசுத்தவான்களோடு போர் செய்ய’ என்றும் மொழிபெயர்க்கலாம்; இங்கு அதன் பொருள் பகைமையானது, அதாவது ‘பரிசுத்தவான்களுக்கு எதிராக’ என்பதாகும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘அவர்களைத் தோற்கடிக்கவும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: 'மரபான மொழிபெயர்ப்பு: ‘நாவு’; இங்கு அது ‘மொழி’ என்ற பொருளில் வருகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτῷ
  choice: அதற்குக் கொடுக்கப்பட்டது / அதற்கு அதிகாரம் கொடுக்கப்பட்டது
  rationale: கொடுப்பவர் யார் என்பதை வெளிப்படையாகக் குறிப்பிடாத கிரேக்கச் செயப்பாட்டு வடிவத்தை இரு இடங்களிலும் காக்கிறது. ‘அனுமதிக்கப்பட்டது’ என்று விளக்கிப் பொருள் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: ποιῆσαι πόλεμον
  choice: போர் செய்ய
  rationale: கிரேக்கச் சொற்றொடரின் நேரடியான பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: μετὰ τῶν ἁγίων
  choice: பரிசுத்தவான்களுக்கு எதிராக
  rationale: μετά என்பதன் அடிப்படைப் பொருள் ‘உடன்’ என்றாலும், போர் செய்யும் இச்சொற்றொடரில் பகைமை நோக்கிய ‘எதிராக’ என்பதே சூழலுக்குப் பொருந்துகிறது. ἅγιοι என்பதற்கு வேதாகம வழக்கிலுள்ள ‘பரிசுத்தவான்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: νικῆσαι
  choice: வெற்றிகொள்ள
  rationale: வெளிப்படுத்தலில் மீண்டும் வரும் νικάω என்ற மையக் கருத்தின் ‘வெல்லுதல்/வெற்றிகொள்ளுதல்’ பொருளைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
- source_word: ἐξουσία
  choice: அதிகாரம்
  rationale: வெறும் வல்லமையைவிட, வழங்கப்பட்ட ஆட்சி உரிமை அல்லது அதிகார வரம்பைச் சுட்டுகிறது.
- source_word: ἐπὶ πᾶσαν φυλὴν καὶ λαὸν καὶ γλῶσσαν καὶ ἔθνος
  choice: ஒவ்வொரு குலத்தின்மீதும், மக்களின்மீதும், மொழியின்மீதும், நாட்டின்மீதும்
  rationale: நான்கு பிரிவுகளையும் தனித்தனியாக வைத்துப் பரந்த உலகளாவிய அதிகார வரம்பைத் தெளிவாகத் தருகிறது. πᾶσαν என்பதன் பகிர்ந்தளிக்கும் வலிமையை ‘ஒவ்வொரு’ காட்டுகிறது.
- source_word: φυλή
  choice: குலம்
  rationale: வம்ச அல்லது இன உறவால் அமைந்த மக்கள்குழுவைக் குறிக்கும் இயல்பான தமிழ் இணைச்சொல்.
- source_word: λαός
  choice: மக்கள்
  rationale: இப்பட்டியலில் ஒரு மக்கள்கூட்டத்தைக் குறிக்கும் எளிய, இயல்பான சொல்.
- source_word: γλῶσσα
  choice: மொழி
  rationale: உடல் உறுப்பான ‘நாவு’ என்ற சொல்லைவிட இங்கு குறிக்கப்படும் மொழியியல் பொருளை நவீனத் தமிழில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: ἔθνος
  choice: நாடு
  rationale: இந்த நான்கு கூறுகளுள்ள வழக்குச் சொற்றொடரில் தனித்த தேசிய மக்கள்கூட்டத்தைக் குறிக்கும் மரபான, புரிந்துகொள்ளத்தக்க மொழிபெயர்ப்பு.
theological_decisions:
- issue: இருமுறை வரும், கொடுப்பவர் பெயரிடப்படாத ἐδόθη என்ற செயப்பாட்டு வடிவம்
  choice: ‘அதற்குக் கொடுக்கப்பட்டது’ என்றும் ‘அதற்கு அதிகாரம் கொடுக்கப்பட்டது’ என்றும் செயப்பாட்டு வடிவத்தைப் பேணுதல்
  alternative: ‘அது அனுமதிக்கப்பட்டது’ என்று மறைமுகமான இறை அனுமதியை வெளிப்படுத்துதல்
  rationale: மூலம் கொடுப்பவரை நேரடியாகப் பெயரிடவில்லை. செயப்பாட்டு வடிவம் இறை இறையாண்மைக்கும் தீமைக்கு அளிக்கப்படும் இடத்திற்கும் இடையிலான இறையியல் பதற்றத்தை விளக்கித் தீர்க்காமல் அப்படியே காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான வேதாகம நடையில் வடிவமைக்கப்பட்டது. ‘பரிசுத்தவான்கள்’, ‘அதிகாரம்’ போன்ற நிலைபெற்ற சொற்கள் காக்கப்பட்டுள்ளன; கொடுப்பவரைப் பெயரிடாமல் மூலத்தின் இறையியல் கட்டுப்பாடும் பேணப்பட்டுள்ளது.
