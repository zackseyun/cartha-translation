id: REV.13.16
reference: Revelation 13:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ποιεῖ πάντας, τοὺς μικροὺς καὶ τοὺς μεγάλους, καὶ τοὺς πλουσίους καὶ τοὺς πτωχούς, καὶ τοὺς ἐλευθέρους καὶ τοὺς δούλους, ἵνα ⸀δῶσιν αὐτοῖς ⸀χάραγμα ἐπὶ τῆς χειρὸς αὐτῶν τῆς δεξιᾶς ἢ ἐπὶ τὸ μέτωπον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/016.yaml
  text: And it causes everyone—the small and the great[a], and the rich and the poor, and the free and the servants—to be given a mark on their right hand or on their forehead,
translation:
  language: ta
  text: அது சிறியவர்களும் பெரியவர்களும், செல்வந்தர்களும் ஏழைகளும், சுதந்திரமானவர்களும் அடிமைகளும் ஆகிய அனைவருக்கும் அவர்களுடைய வலது கையிலோ நெற்றியிலோ ஒரு குறி இடப்படும்படி செய்கிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்படியாக, “அவர்கள் அவர்களுக்கு ஒரு குறியைக் கொடுக்கும்படி.” கிரேக்க வாசகம் இலக்கண ரீதியாகக் கடினமானது; குறியைக் கொடுப்பவர்கள் யார் என்பது வெளிப்படையாகக் கூறப்படவில்லை. எனவே முதன்மை உரை பொருளுக்கு ஏற்ற இயல்பான செயப்பாட்டு வடிவில் தரப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖ
  choice: செய்கிறது
  rationale: ἵνα + துணைநிலை வினையுடன் வரும் ποιεῖ இங்கு ஒரு நிகழ்வை ஏற்படுத்துவதைச் சுட்டுகிறது. ‘இடப்படும்படி செய்கிறது’ என்பது வற்புறுத்தல் என்ற கருத்தைத் தேவையின்றி சேர்க்காமல் காரணச் செயல்பாட்டைத் தெரிவிக்கிறது.
- source_word: πάντας
  choice: அனைவரையும்
  rationale: தொடர்ந்து வரும் இணை எதிர்மறைச் சமூகப் பிரிவுகள், குறிப்பிடப்படும் மக்கள் அனைவரையும் உள்ளடக்குகின்றன.
- source_word: τοὺς μικροὺς καὶ τοὺς μεγάλους
  choice: சிறியோர், பெரியோர்
  rationale: சமூக நிலையில் தாழ்ந்தோர் முதல் உயர்ந்தோர் வரை அனைவரையும் குறிக்கும் சொல்லிணையின் உருவகத் திறனையும் வெளிப்படுத்துதல் ஓசையையும் இது காக்கிறது.
- source_word: τοὺς πλουσίους καὶ τοὺς πτωχούς
  choice: செல்வர், ஏழைகள்
  rationale: பொருளாதார நிலையின் வழக்கமான எதிரிணையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: τοὺς ἐλευθέρους καὶ τοὺς δούλους
  choice: சுதந்திரமானவர்கள், அடிமைகள்
  rationale: ἐλεύθεροι என்பதற்கு நேரெதிராக δούλοι வருவதால், பொதுவான பணியாளர்களை அல்லாமல் சட்ட மற்றும் சமூக அடிமைநிலையில் உள்ளவர்களையே இங்கு குறிக்கிறது.
- source_word: ἵνα δῶσιν αὐτοῖς χάραγμα
  choice: ஒரு குறி இடப்படும்படி
  rationale: கிரேக்கச் சொற்றொடர் சொற்படியாக ‘அவர்கள் அவர்களுக்கு ஒரு குறியைக் கொடுக்கும்படி’ என இருந்தாலும், செய்பவர் வெளிப்படையாகக் குறிப்பிடப்படவில்லை. தமிழில் செயப்பாட்டு வடிவம் நிகழ்வின் பொருளைத் தெளிவாகக் கூறி, மக்கள் தாமே குறியை இடுகிறார்கள் என்ற தவறான எண்ணத்தையும் தவிர்க்கிறது; சொற்படியான அமைப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: χάραγμα
  choice: குறி
  rationale: அடையாளப்படுத்தும் பொறிப்பு அல்லது முத்திரை போன்ற பரந்த பொருளைச் சுருக்கமாகக் கொண்டுவருகிறது; குறிப்பிட்ட முறையைத் தேவையின்றி நிர்ணயிப்பதில்லை.
- source_word: ἐπὶ τῆς χειρὸς αὐτῶν τῆς δεξιᾶς ἢ ἐπὶ τὸ μέτωπον αὐτῶν
  choice: அவர்களுடைய வலது கையின்மீதோ நெற்றியின்மீதோ
  rationale: குறி இடப்படும் இரு மாற்று இடங்களையும் கிரேக்கத்தின் பகிர்மான ஒருமைப் பயன்பாட்டுக்கு ஏற்ற இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: சமூக நிலை எதிரிணையில் δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: அடிமைகள்
  alternative: பணியாளர்கள்
  rationale: ‘சுதந்திரமானவர்கள்’ என்பதற்கு எதிராக வருவதால் கட்டுண்ட சட்ட மற்றும் சமூக நிலையே முன்னிலைப்படுகிறது; ‘பணியாளர்கள்’ என்பது அந்த வேறுபாட்டை மங்கச் செய்யும்.
- issue: ἵνα δῶσιν αὐτοῖς χάραγμα என்ற கடினமான சொற்றொடரின் வெளிப்பாடு
  choice: ஒரு குறி இடப்படும்படி
  alternative: அவர்கள் அவர்களுக்கு ஒரு குறியைக் கொடுக்கும்படி
  rationale: முதன்மை உரை இயல்பான தமிழில் நிகழ்வைக் கூறுகிறது; குறியை யார் கொடுக்கிறார்கள் என்பதை உரையில் இல்லாத வகையில் நிர்ணயிப்பதில்லை. கிரேக்கத்தின் இலக்கண ரீதியான நெருக்கமான வடிவம் அடிக்குறிப்பில் வழங்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வெளிப்படுத்தின விசேஷத்தின் பட்டியல் ஓசையைத் தக்கவைக்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சிறியோர், பெரியோர்’ என்பது சொற்படித் தன்மையையும் சமூகப் பரப்பையும் காக்கிறது; ‘குறி’ என்பது ‘முத்திரை’ போன்ற அதிகமாகக் குறிப்பாக்கும் சொல்லைத் தவிர்க்கிறது.
