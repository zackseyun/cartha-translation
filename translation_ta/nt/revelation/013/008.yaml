  source_fidelity: 'முதன்மை உரை கிரேக்கத்தின் முக்கிய கூறுகளைத் தக்கவைத்துள்ளது: பூமியில் குடியிருப்போர், அவனை வணங்குதல், வாழ்வுப் புத்தகம், ஆட்டுக்குட்டியானவர், மற்றும் பெயர் எழுதப்படாதோர். ஆனால் “பெயர் எழுதப்பட்டிராத அனைவரும்” என்பது தொடர்புடைய ஒவ்வொருவரின் பெயரைச் சுட்டும் οὗ ... τὸ ὄνομα αὐτοῦ அமைப்பைச் சற்றே மங்கலாக்குகிறது. அதைத் தெளிவான தொடர்புவாக்கியமாக மாற்றுவது பாதுகாப்பானது.'
  naturalness: “பூமியில் குடியிருப்பவர்களில், ... அனைவரும்” என்ற தொடக்கம் புரிந்துகொள்ளக்கூடியதே; இருப்பினும் “எவருடைய பெயர் ... எழுதப்பட்டிருக்கவில்லையோ, அவர்கள் அனைவரும்” என்பது நவீன பொதுத்தமிழில் இலக்கணரீதியாகத் தெளிவாகவும் ஓட்டமாகவும் உள்ளது. “எழுதப்பட்டிருக்கவில்லையோ” கிரேக்க நிறைவுக்காலத்தின் விளைவுநிலையையும் நன்றாகக் காட்டுகிறது.
  terminology: “வணங்குவார்கள்,” “பூமியில் குடியிருப்பவர்கள்,” “ஆட்டுக்குட்டியானவர்,” மற்றும் “வாழ்வுப் புத்தகம்” ஆகியவை இவ்வசனத்திற்கும் வெளிப்படுத்தின விசேஷத்தின் பயன்பாட்டிற்கும் பொருத்தமானவை. “கொல்லப்பட்ட” என்பது σφάζω-வின் பலிசார்ந்த வன்முறை உணர்வை அளவாகத் தருகிறது. காலத்தொடரின் சர்ச்சைக்குரிய இணைப்பு முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட வேண்டும்.
