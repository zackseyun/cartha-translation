revisions:
- from: பூமியில் குடியிருப்பவர்களில், உலகம் படைக்கப்பட்டதுமுதல் கொல்லப்பட்ட ஆட்டுக்குட்டியானவரின் வாழ்வுப் புத்தகத்தில் பெயர் எழுதப்பட்டிராத அனைவரும் அவனை வணங்குவார்கள்.[a]
  to: பூமியில் குடியிருப்பவர்களில் எவருடைய பெயர் உலகம் படைக்கப்பட்டதுமுதல் கொல்லப்பட்ட ஆட்டுக்குட்டியானவரின் வாழ்வுப் புத்தகத்தில் எழுதப்பட்டிருக்கவில்லையோ, அவர்கள் அனைவரும் அவனை வணங்குவார்கள்.[a]
  rationale: திருத்தம் பொருளை மாற்றாது. கிரேக்கத்தின் ஒருமைத் தொடர்பு அமைப்பையும் நிறைவுக்கால மறுப்பையும் தமிழில் தெளிவாகக் காட்டுகிறது. முதன்மை உரையில் ‘உலகம் படைக்கப்பட்டதுமுதல்’ என்பது அருகிலுள்ள ‘கொல்லப்பட்ட’ என்பதுடன் இணைந்திருக்கிறது; பெயர் எழுதப்படுவதுடன் இணைக்கும் உண்மையான மாற்று வாசிப்பு அடிக்குறிப்பில் முழுமையாகத் தக்கவைக்கப்பட்டுள்ளது.
