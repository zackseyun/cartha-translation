id: REV.13.8
reference: Revelation 13:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ προσκυνήσουσιν ⸀αὐτὸν πάντες οἱ κατοικοῦντες ἐπὶ τῆς γῆς, ⸀οὗ οὐ γέγραπται τὸ ὄνομα ⸀αὐτοῦ ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου τοῦ ἐσφαγμένου ἀπὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/008.yaml
  text: And all who dwell on the earth will worship him—everyone whose name has not been written in the book of life of the Lamb who was slain from the foundation of the world[a].
translation:
  language: ta
  text: பூமியில் குடியிருப்பவர்களில் எவருடைய பெயர் உலகம் படைக்கப்பட்டதுமுதல் கொல்லப்பட்ட ஆட்டுக்குட்டியானவரின் வாழ்வுப் புத்தகத்தில் எழுதப்பட்டிருக்கவில்லையோ, அவர்கள் அனைவரும் அவனை வணங்குவார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பூமியில் குடியிருப்பவர்களில் எவருடைய பெயர் உலகம் படைக்கப்பட்டதுமுதல் ஆட்டுக்குட்டியானவரின் வாழ்வுப் புத்தகத்தில் எழுதப்பட்டிருக்கவில்லையோ, அவர்கள் அனைவரும் அவனை வணங்குவார்கள்.” ‘உலகம் படைக்கப்பட்டதுமுதல்’ என்ற கிரேக்கத் தொடரை ‘கொல்லப்பட்ட’ என்பதுடனோ, ‘எழுதப்பட்டிருக்கவில்லையோ’ என்பதுடனோ இணைத்துப் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: προσκυνήσουσιν
  choice: வணங்குவார்கள்
  rationale: வெளிப்படுத்தின விசேஷத்தில் இந்த வினை பொதுவாக வழிபாட்டுக்குரிய பணிவையும் மரியாதையையும் குறிக்கிறது; மிருகத்துக்குச் செலுத்தப்படும் மதச்சார்பான வழிபாட்டின் வலிமையை இது இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: κατοικοῦντες ἐπὶ τῆς γῆς
  choice: பூமியில் குடியிருப்பவர்கள்
  rationale: வெளிப்படுத்தின விசேஷத்தில் மீண்டும் வரும் இந்தச் சொற்றொடரின் வினை வடிவத்தையும் அதன் தனித்துவமான பயன்பாட்டையும் காக்கிறது.
- source_word: οὗ ... τὸ ὄνομα αὐτοῦ
  choice: பெயர் ... அனைவரும்
  rationale: கிரேக்கத்தில் ஒருமை வடிவில் ஒவ்வொருவரின் பெயரும் சுட்டப்படுகிறது; தமிழில் இயல்பான தொடர்பெயர் அமைப்பால் அந்தத் தனிப்பட்ட அடையாளம் காக்கப்படுகிறது.
- source_word: γέγραπται
  choice: எழுதப்பட்டிராத
  rationale: முன்பு எழுதப்பட்டதன் விளைவாக இப்போதும் நிலவும் பதிவுநிலையை கிரேக்க நிறைவுக்காலம் காட்டுகிறது; ‘எழுதப்பட்டிராத’ என்பது அந்த நிலையைச் சுருக்கமாகக் காக்கிறது.
- source_word: βιβλίῳ τῆς ζωῆς
  choice: வாழ்வுப் புத்தகம்
  rationale: வெளிப்படுத்தின விசேஷத்தின் அறியப்பட்ட இறுதிக்கால உருவகத்தைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: τοῦ ἀρνίου
  choice: ஆட்டுக்குட்டியானவர்
  rationale: ἀρνίον இந்நூலில் கிறிஸ்துவைக் குறிக்கும் பட்டமாகவும் பலியுணர்வுடைய உருவகமாகவும் வருகிறது; மரியாதை ஒருமையுடன் மொழிபெயர்ப்பது தமிழில் அந்தப் பட்டப் பயன்பாட்டைத் தெளிவாக்குகிறது.
- source_word: τοῦ ἐσφαγμένου
  choice: கொல்லப்பட்ட
  rationale: σφάζω குறிக்கும் வன்முறையான, பலிசார்ந்த மரணத்தை பொதுவான நவீன தமிழில் தெரிவிக்கிறது; ‘வெட்டிக் கொல்லப்பட்ட’ என்பதைக் காட்டிலும் முதன்மை உரையில் அளவானதாக உள்ளது.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: உலகம் படைக்கப்பட்டதுமுதல்
  rationale: உலகத்தின் தொடக்கத்திலிருந்து என்ற காலப்பொருளை நவீன தமிழில் இயல்பாகத் தருகிறது; கிரேக்க ἀπό என்பதன் தொடக்கப்புள்ளி உணர்வும் காக்கப்படுகிறது.
theological_decisions:
- issue: ‘உலகம் படைக்கப்பட்டதுமுதல்’ என்ற காலத்தொடர் எதனுடன் இணைகிறது?
  choice: முதன்மை உரையில் ‘கொல்லப்பட்ட’ என்பதுடன் இணைக்கப்பட்டுள்ளது.
  alternative: '‘பெயர் எழுதப்பட்டிராத’ என்பதுடன் இணைக்கலாம்: பெயர் உலகம் படைக்கப்பட்டதுமுதல் வாழ்வுப் புத்தகத்தில் எழுதப்பட்டிராதவர்கள்.'
  rationale: கிரேக்கச் சொல் வரிசையில் காலத்தொடர் உடனடியாக முந்திய τοῦ ἐσφαγμένου (‘கொல்லப்பட்ட’) என்பதுடன் இயல்பாக இணையக்கூடும். ஆனால் வெளிப்படுத்தின விசேஷம் 17:8-இன் இணையான மொழிநடை, பெயர்கள் எழுதப்பட்ட காலத்துடன் அதை இணைப்பதற்கு வலுவான ஆதரவு தருகிறது. ஆகவே முதன்மை உரை அருகிலுள்ள இலக்கண இணைப்பைப் பின்பற்றுகிறது; உண்மையான இருபொருள் வாய்ப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நடை நவீன, கண்ணியமான பொதுத்தமிழாக வைக்கப்பட்டுள்ளது. ‘குடியிருப்பவர்கள்’, ‘வாழ்வுப் புத்தகம்’, ‘ஆட்டுக்குட்டியானவர்’ ஆகியவை வெளிப்படுத்தின விசேஷத்தின் மீளும் உருவகங்களையும் சொற்றொடர்களையும் தெளிவாகக் காக்கின்றன. சர்ச்சைக்குரிய காலத்தொடரின் இணைப்பு முதன்மை உரையில் தீர்மானிக்கப்பட்டாலும் மாற்று இலக்கண வாசிப்பு அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
