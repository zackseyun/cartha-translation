  to: இந்தத் தீர்க்கதரிசனத்தின் வார்த்தைகளைச் சத்தமாக வாசிக்கிறவர்[a] ஆசீர்வதிக்கப்பட்டவர்; அவற்றைக் கேட்பவர்களும், இதில் எழுதப்பட்டுள்ளவற்றைக் கடைப்பிடிக்கிறவர்களும் ஆசீர்வதிக்கப்பட்டவர்கள். ஏனெனில் காலம் அருகில் உள்ளது.[b]
