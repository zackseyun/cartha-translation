id: REV.1.3
reference: Revelation 1:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μακάριος ὁ ἀναγινώσκων καὶ οἱ ἀκούοντες τοὺς λόγους τῆς προφητείας καὶ τηροῦντες τὰ ἐν αὐτῇ γεγραμμένα, ὁ γὰρ καιρὸς ἐγγύς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/003.yaml
  text: Blessed is the one who reads aloud[a], and those who hear the words of this prophecy and keep what is written in it[b], for the time is near.
translation:
  language: ta
  text: இந்தத் தீர்க்கதரிசனத்தின் வார்த்தைகளைச் சத்தமாக வாசிக்கிறவர்[a] ஆசீர்வதிக்கப்பட்டவர்; அவற்றைக் கேட்பவர்களும், இதில் எழுதப்பட்டுள்ளவற்றைக் கடைப்பிடிக்கிறவர்களும் ஆசீர்வதிக்கப்பட்டவர்கள். ஏனெனில் காலம் அருகில் உள்ளது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வாசிக்கிறவர்.” ஒருமையில் வரும் வாசிப்பவரும் பன்மையில் வரும் கேட்பவர்களும் சபைக் கூட்டத்தில் சத்தமாக வாசிப்பதைக் குறித்திருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நியமிக்கப்பட்ட காலம் அருகில் உள்ளது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: ஆசீர்வதிக்கப்பட்டவர்
  rationale: புதிய ஏற்பாட்டின் பேறுபெற்ற நிலையைச் சுட்டும் மொழிநடையைப் பாதுகாக்கிறது; வெறும் மனமகிழ்ச்சி அல்லது அதிர்ஷ்டம் என்ற பொருளாகக் குறுக்கவில்லை.
- source_word: ὁ ἀναγινώσκων
  choice: சத்தமாக வாசிக்கிறவர்
  rationale: ஒருமையில் வரும் வாசிப்பவரும் பன்மையில் வரும் கேட்பவர்களும் சபைக் கூட்டத்தில் நடைபெறும் பொதுவாசிப்பை வலுவாகச் சுட்டுகின்றனர். ‘சத்தமாக’ என்பது அந்த வாய்மொழிச் சூழலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: οἱ ἀκούοντες
  choice: கேட்கிறவர்கள்
  rationale: பொதுவாசிப்பைக் கேட்டு ஏற்றுக்கொள்ளும் பொருளை நேரடியாகப் பாதுகாக்கிறது; அடுத்து வரும் கடைப்பிடித்தலுடன் இயல்பாக இணைகிறது.
- source_word: τοὺς λόγους τῆς προφητείας
  choice: இந்தத் தீர்க்கதரிசனத்தின் வார்த்தைகள்
  rationale: λόγους என்பதன் பன்மையையும் ‘வார்த்தைகள்’ என்று பாதுகாக்கிறது; சூழலில் இந்நூலில் உள்ள தீர்க்கதரிசனத்தையே குறிப்பிடுவதால் ‘இந்த’ சேர்க்கப்பட்டுள்ளது.
- source_word: τηροῦντες
  choice: கடைப்பிடிக்கிறவர்கள்
  rationale: எழுதப்பட்டவற்றை உண்மையுடன் ஏற்று அதன்படி நடப்பது என்ற τηρέω-வின் கருத்தை நவீனத் தமிழில் தெளிவாகத் தருகிறது; வெறும் பாதுகாத்துவைத்தல் என்ற பொருளுக்கு மட்டுப்படுத்தவில்லை.
- source_word: τὰ ἐν αὐτῇ γεγραμμένα
  choice: இதில் எழுதப்பட்டுள்ளவை
  rationale: கிரேக்கத்தின் நடுநிலைப் பன்மை வடிவத்தை இயல்பான தமிழ் தொகைச்சொல்லால் தருகிறது. ‘இதில்’ என்பது முன்கூறப்பட்ட தீர்க்கதரிசனத்தைக் குறிக்கிறது.
- source_word: ὁ γὰρ καιρὸς
  choice: ஏனெனில், காலம்
  rationale: καιρός ஒரு தீர்மானிக்கப்பட்ட அல்லது முக்கியமான காலத்தைக் குறிக்கக்கூடும்; ஆனால் மூலத்தின் விரிவான பொருள் மற்றும் இறுதிக்காலத் தெளிவின்மையைப் பாதுகாக்க ‘காலம்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: ἐγγύς
  choice: நெருங்கிவிட்டது
  rationale: காலரீதியான அண்மையைத் தெளிவான நவீனத் தமிழில் தருகிறது; அது எவ்வாறு அல்லது எப்போது நிறைவேறும் என்பதை விளக்கிச் சேர்ப்பதில்லை.
theological_decisions:
- issue: ஒருமை வாசிப்பவரும் பன்மை கேட்பவர்களும் உணர்த்தும் பொதுவாசிப்புச் சூழல்
  choice: ‘சத்தமாக வாசிக்கிறவர்’ என்று மொழிபெயர்த்து, சபைக் கூட்டத்தில் நிகழ்ந்திருக்கக்கூடிய வாய்மொழி வாசிப்பை வெளிப்படுத்துதல்.
  alternative: ‘வாசிக்கிறவர்’ என்று மட்டும் மொழிபெயர்த்து, வாய்மொழி நுணுக்கத்தை அடிக்குறிப்பில் குறிப்பிடுதல்.
  rationale: ஒருவர் வாசிக்க, பலர் கேட்பதாக அமைந்த இலக்கணம் பொதுவாசிப்பை வலுவாக உணர்த்துகிறது. இருப்பினும் ‘வாசிக்கிறவர்’ என்ற பரந்த பொருள் சாத்தியமுள்ளதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: καιρός ἐγγύς என்பதன் இறுதிக்கால வலிமை
  choice: ‘காலம் நெருங்கிவிட்டது’ என்று நேரடியாக மொழிபெயர்த்து, நிறைவேற்றத்தின் காலவரிசையைத் தீர்மானிக்காமல் விடுதல்.
  alternative: ‘நியமிக்கப்பட்ட காலம் நெருங்கிவிட்டது’ என்று மொழிபெயர்த்தல்.
  rationale: καιρός தீர்மானிக்கப்பட்ட தருணத்தை உணர்த்தக்கூடும்; ஆனால் இங்கு உரை விரிவான இறுதிக்காலத் திட்டத்தை வரையறுக்கவில்லை. மொழிபெயர்ப்பு அந்தத் தத்துவத் தளர்வையும் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: மொழிநடை நவீனத் தரத் தமிழிலும் வழிபாட்டு வாசிப்புக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. முதல் ஆசீர்வாதக் கூற்றின் வினைச்சொல் தமிழில் இரு குழுக்களுக்கும் தெளிவாகப் பொருந்துமாறு மீண்டும் சொல்லப்பட்டுள்ளது. ‘தீர்க்கதரிசனம்’, ‘ஆசீர்வதிக்கப்பட்டவர்’, ‘கடைப்பிடித்தல்’ ஆகியவை பொதுவாகப் புரியக்கூடிய வேதாகமத் தமிழ்ச் சொற்களாகத் தக்கவைக்கப்பட்டுள்ளன.
