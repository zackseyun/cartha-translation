id: REV.1.11
reference: Revelation 1:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λεγούσης· Ὃ βλέπεις γράψον εἰς βιβλίον καὶ πέμψον ταῖς ἑπτὰ ἐκκλησίαις, εἰς Ἔφεσον καὶ εἰς Σμύρναν καὶ εἰς Πέργαμον καὶ εἰς Θυάτειρα καὶ εἰς Σάρδεις καὶ εἰς Φιλαδέλφειαν καὶ εἰς Λαοδίκειαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/011.yaml
  text: 'saying[a], “What you see[b], write in a book and send it to the seven churches: to Ephesus and to Smyrna and to Pergamum and to Thyatira and to Sardis and to Philadelphia and to Laodicea.”'
translation:
  language: ta
  text: 'அந்தக் குரல் இவ்வாறு சொன்னது: “நீ காண்பதை ஒரு புத்தகத்தில்[a] எழுதி, அதை ஏழு திருச்சபைகளுக்கும் அனுப்பு: எபேசுவுக்கும், சிமிர்னாவுக்கும், பெர்கமுவுக்கும்[b], தியத்தீராவுக்கும், சர்தைக்கும், பிலதெல்பியாவுக்கும், லவோதிக்கேயாவுக்கும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஒரு சுருளில்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் புத்தகம், சுருள் அல்லது எழுதப்பட்ட ஆவணத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கப் பெயரை ‘பெர்கமோன்’ என்றும் ஒலிபெயர்க்கலாம்.
    reason: alternative_transliteration
lexical_decisions:
- source_word: λεγούσης
  choice: அந்தக் குரல் சொன்னது
  rationale: பெண்பால் ஒருமை நிகழ்காலப் பெயரெச்சம் முந்தைய வசனத்தில் குறிப்பிடப்பட்ட குரலின் செயலைத் தொடர்கிறது. தமிழில் மேற்கோளை இயல்பாக அறிமுகப்படுத்த, முந்தைய சூழலில் உள்ள ‘குரல்’ தெளிவாகக் குறிப்பிடப்பட்டது.
- source_word: Ὃ βλέπεις
  choice: நீ காண்பதை
  rationale: தரிசனத்தில் யோவான் காணும் அனைத்தையும் பொதுவாகக் குறிக்கும் தொடர்புச் சொற்றொடர்; ‘காண்பதை’ என்பது நிகழ்காலத் தன்மையையும் பரந்த பொருளையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: γράψον
  choice: எழுதி
  rationale: γράφω என்பதன் இறந்தகாலக் கட்டளை வடிவம். அடுத்த கட்டளையுடன் தமிழில் இயல்பாக இணைய ‘எழுதி … அனுப்பு’ என வழங்கப்பட்டது.
- source_word: εἰς βιβλίον
  choice: ஒரு புத்தகத்தில்
  rationale: βιβλίον என்பது புத்தகம், சுருள் அல்லது எழுதப்பட்ட ஆவணம் ஆகியவற்றைக் குறிக்கலாம். நவீன வாசகருக்கு இயல்பான ‘புத்தகம்’ முதன்மை உரையில் வைக்கப்பட்டு, ‘சுருள்’ அடிக்குறிப்பில் தரப்பட்டது.
- source_word: πέμψον
  choice: அதை … அனுப்பு
  rationale: தமிழில் கட்டளையின் செயப்படுபொருள் தெளிவாக இருக்க, எழுதப்பட்டதைச் சுட்டும் ‘அதை’ சூழலிலிருந்து சேர்க்கப்பட்டது.
- source_word: ταῖς ἑπτὰ ἐκκλησίαις
  choice: ஏழு திருச்சபைகளுக்கும்
  rationale: இங்கு ἐκκλησία ஆசியாவிலுள்ள குறிப்பிட்ட கிறிஸ்தவ விசுவாசக் கூட்டங்களைக் குறிக்கிறது. ‘திருச்சபை’ என்பது தமிழில் நிலைபெற்ற, மதப்பிரிவு சார்பற்ற வேதாகமப் பயன்பாடு.
- source_word: εἰς Ἔφεσον … εἰς Λαοδίκειαν
  choice: எபேசுவுக்கும் … லவோதிக்கேயாவுக்கும்
  rationale: ஒவ்வொரு நகரத்துக்கும் முன் திரும்பத் திரும்ப வரும் εἰς என்பதன் பகிர்ந்தளிக்கும் வலிமையை, தமிழ் இணைப்புவிகுதியான ‘-க்கும்’ ஒவ்வொரு பெயருடனும் மீண்டும் பயன்படுத்தி வெளிப்படுத்துகிறது.
- source_word: Πέργαμον
  choice: பெர்கமு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் இடப்பெயர் வடிவம் பயன்படுத்தப்பட்டது; கிரேக்கப் பெயருக்கு இன்னும் நெருக்கமான ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்பட்டது.
theological_decisions:
- issue: வெளிப்படுத்தல் 1:11-இல் ἐκκλησίαις என்பதன் பொருள்
  choice: திருச்சபைகள்
  alternative: சபைகள் / கூடுகைகள்
  rationale: இச்சொல் இயேசு யோவான் வழியாகச் செய்தி அனுப்பும் குறிப்பிட்ட கிறிஸ்தவ விசுவாசக் கூட்டங்களைக் குறிக்கிறது. ‘திருச்சபைகள்’ என்பது அந்தச் சபைசார் பொருளைத் தெளிவாகத் தெரிவிக்கிறது; எந்த மதப்பிரிவின் தனிப்பட்ட அமைப்புக் கோட்பாட்டையும் இதில் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. நகரப் பெயர்கள் தமிழ் வேதாகம வாசகர்களுக்கு அறிமுகமான வடிவங்களில் வைக்கப்பட்டுள்ளன; மூலத்தில் ஒவ்வொரு நகருக்கும் மீள வரும் இலக்கண அமைப்பு ‘-க்கும்’ என்ற தொடர்ச்சியால் பாதுகாக்கப்பட்டுள்ளது.
