id: REV.1.10
reference: Revelation 1:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐγενόμην ἐν πνεύματι ἐν τῇ κυριακῇ ἡμέρᾳ, καὶ ἤκουσα ⸂ὀπίσω μου φωνὴν⸃ μεγάλην ὡς σάλπιγγος
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/010.yaml
  text: I came to be in the Spirit on the Lord’s day[a], and I heard behind me a loud voice like a trumpet[b],
translation:
  language: ta
  text: கர்த்தருக்குரிய நாளில்[b] நான் ஆவிக்குள்ளானேன்[a]; என் பின்னால் எக்காளத்தைப் போன்ற ஓர் உரத்த குரலைக் கேட்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆவியில் இருந்தேன்.’ இது பரிசுத்த ஆவியின் தீர்க்கதரிசனத் தாக்கத்தைக் குறிக்கலாம்; ஆனால் ‘பரவசநிலை’ என்று மூலவாக்கியம் வெளிப்படையாகக் கூறவில்லை.
    reason: lexical_alternative
  - marker: b
    text: 'வாய்ப்புக் குறைந்த மாற்று: ‘கர்த்தரின் நாளில்.’ இங்குள்ள கிரேக்கச் சொற்றொடர் ‘கர்த்தருக்குரிய நாள்’ (κυριακῇ ἡμέρᾳ) என்பதாகும்; இறுதிக்கால ‘கர்த்தரின் நாள்’ என்பதற்கான வழக்கமான கிரேக்கச் சொற்றொடர் இதுவல்ல.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγενόμην
  choice: ஆவிக்குள்ளானேன்
  rationale: γίνομαι இங்கு ஒரு நிலைக்குள் வந்ததைச் சுட்டக்கூடும். ‘இருந்தேன்’ என்பதைவிட தமிழில் இயல்பாக அந்தத் தொடக்க நுணுக்கத்தை ஓரளவு காக்கிறது; அதே நேரத்தில் ‘பரவசநிலைக்குள்ளானேன்’ என்று மூலத்தில் இல்லாத விளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: ἐν πνεύματι
  choice: ஆவிக்குள்ளானேன்
  rationale: வெளிப்படுத்தின விசேஷத்தின் தரிசனச் சூழலில் இது பரிசுத்த ஆவியின் தீர்க்கதரிசனத் தாக்கத்தைக் குறிக்க வாய்ப்புள்ளது. எனினும் ‘பரவசநிலை’ என்று வெளிப்படையாகக் கூறாமல் கிரேக்கச் சொற்றொடரின் திறந்த தன்மையைப் பேணுகிறது.
- source_word: ἐν τῇ κυριακῇ ἡμέρᾳ
  choice: கர்த்தருக்குரிய நாளில்
  rationale: κυριακός என்பது ‘கர்த்தருக்குச் சொந்தமான/கர்த்தருக்குரிய’ என்று பொருள்படும் பெயரடை. ‘கர்த்தருக்குரிய நாள்’ என்பது அந்த இலக்கண வடிவைத் தெளிவாகக் காட்டி, இறுதிக்கால ‘கர்த்தரின் நாள்’ என்ற வழக்கமான சொற்றொடருடன் தேவையின்றிக் கலப்பதைத் தவிர்க்கிறது.
- source_word: ἤκουσα
  choice: கேட்டேன்
  rationale: இங்கு ἀκούω கவனித்துக் கேட்பதை அல்ல, செவியால் உணர்ந்ததை எளிமையாகக் குறிக்கிறது.
- source_word: ὀπίσω μου
  choice: என் பின்னால்
  rationale: சூழலில் இது கால வரிசையை அல்ல, குரல் வந்த இடத்தைச் சுட்டுகிறது.
- source_word: φωνὴν μεγάλην
  choice: ஓர் உரத்த குரல்
  rationale: φωνή என்பதுடன் μέγας வரும்போது குரலின் உரப்பையும் வலிமையையும் குறிக்கிறது; ‘உரத்த குரல்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: ὡς σάλπιγγος
  choice: எக்காளத்தைப் போன்ற
  rationale: குரலின் ஒலி எக்காளத்தோடு ஒப்பிடப்படுகிறது. ‘முழக்கம்’ போன்ற மூலத்தில் வெளிப்படையாக இல்லாத கூறைச் சேர்க்காமல் ஒப்புமையைப் பேணுகிறது.
theological_decisions:
- issue: ἐν πνεύματι என்பது பரிசுத்த ஆவியின் தாக்கத்தையா, மனித ஆவிநிலையையா, அல்லது பரவசநிலையையா குறிக்கிறது?
  choice: ஆவிக்குள்ளானேன்
  alternative: ஆவியில் இருந்தேன்; பரவசநிலைக்குள்ளானேன்
  rationale: சூழல் பரிசுத்த ஆவியின் தீர்க்கதரிசனத் தாக்கத்தை வலுவாக உணர்த்தினாலும், கிரேக்கம் ‘பரவசநிலை’ என்று நேரடியாகச் சொல்லவில்லை. ஆகவே இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் சொற்றொடர் சுருக்கமாக வைக்கப்பட்டது.
- issue: κυριακῇ ἡμέρᾳ என்பது வாராந்திர கர்த்தருக்குரிய நாளையா அல்லது இறுதிக்கால கர்த்தரின் நாளையா குறிக்கிறது?
  choice: கர்த்தருக்குரிய நாள்
  alternative: கர்த்தரின் நாள்
  rationale: κυριακός என்ற பெயரடை ‘கர்த்தருக்குரிய’ என்பதையே இயல்பாகத் தருகிறது. இறுதிக்கால ‘கர்த்தரின் நாள்’ என்பதற்குப் பொதுவாகப் பயன்படுத்தப்படும் கிரேக்க அமைப்பு இங்கு இல்லை; இருப்பினும் அந்த நாளை மேலும் அடையாளப்படுத்தி மொழிபெயர்ப்பில் முடிவு செய்யப்படவில்லை.
translation_notes:
  register: நவீன வாசகர்களுக்கு எளிதில் புரியும், ஆனால் வேதாகமப் பகுதிக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘கர்த்தருக்குரிய’ என்பது சற்றே முறையானதாயினும் மூலத்தின் பெயரடை அமைப்பைத் தெளிவாகக் காக்கிறது. ‘எக்காளம்,’ ‘உரத்த குரல்’ ஆகியவை பரவலாகப் புரியும் இயல்பான சொற்கள்.
