reference: Revelation 1:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἰωάννης ταῖς ἑπτὰ ἐκκλησίαις ταῖς ἐν τῇ Ἀσίᾳ· χάρις ὑμῖν καὶ εἰρήνη ⸀ἀπὸ ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος, καὶ ἀπὸ τῶν ἑπτὰ πνευμάτων ἃ ἐνώπιον τοῦ θρόνου αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/004.yaml
  text: 'John, to the seven churches in Asia: Grace to you and peace from him who is, and who was, and who is coming, and from the seven spirits who are before his throne,'
translation:
  language: ta
  text: 'யோவான், ஆசியாவில் உள்ள ஏழு திருச்சபைகளுக்கு: இருக்கிறவரும் இருந்தவரும் வருகிறவருமான அவரிடமிருந்தும்[a], அவருடைய அரியணைக்கு முன்பாக உள்ள ஏழு ஆவிகளிடமிருந்தும்[b] உங்களுக்கு அருளும் சமாதானமும் உண்டாகட்டும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'மரபான மொழிபெயர்ப்பு: “இருக்கிறவரும் இருந்தவரும் வரவிருக்கிறவருமான அவரிடமிருந்து.”'
    reason: lexical_alternative
  - marker: b
    text: “ஏழு ஆவிகள்” என்பது பரிசுத்த ஆவியின் முழுநிறைவைக் குறிக்கும் அடையாளமாக இருக்கலாம்; அல்லது ஏழு பரலோக ஆவிகளைக் குறிக்கலாம். கிரேக்க உரை நேரடியாக “ஏழு ஆவிகள்” என்றே கூறுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰωάννης
  choice: யோவான்
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் நிலைபெற்றுள்ள பெயர்வடிவம்.
- source_word: ταῖς ἑπτὰ ἐκκλησίαις
  choice: ஏழு திருச்சபைகளுக்கு
  rationale: ἐκκλησία என்பதற்கு ‘சபை/கூட்டம்’ என்ற பொருள் இருக்கலாம்; இங்குள்ள கிறிஸ்தவக் கடிதச் சூழலில் ‘திருச்சபை’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: ஆசியாவில் உள்ள
  rationale: கிரேக்கத்தின் எளிய இடப்பெயரைப் பாதுகாக்கிறது; இங்கு நவீன ஆசியக் கண்டம் அல்ல, ரோம மாகாணமான ஆசியா குறிக்கப்படுகிறது.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: உங்களுக்கு அருளும் சமாதானமும் உண்டாகட்டும்
  rationale: கிரேக்க வாழ்த்தின் ஆசீர்வாதத் தன்மையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; ὑμῖν என்பதையும் தெளிவாகக் காட்டுகிறது.
- source_word: ἀπὸ ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος
  choice: இருக்கிறவரும் இருந்தவரும் வந்துகொண்டிருக்கிறவருமான அவரிடமிருந்து
  rationale: கிரேக்கத்தில் நோக்கமுடன் காணப்படும் இலக்கண ஒழுங்கின்மையையும் தெய்வீகப் பட்டப்பெயரின் தன்மையையும் தேவையின்றிச் சீராக்காமல் காக்கிறது. ὁ ἐρχόμενος என்பதன் நிகழ்காலப் பங்கேற்பு வலிமையை ‘வந்துகொண்டிருக்கிறவர்’ வெளிப்படுத்துகிறது.
- source_word: τῶν ἑπτὰ πνευμάτων
  choice: ஏழு ஆவிகளிடமிருந்து
  rationale: கிரேக்கத்தில் உள்ள பன்மையை அப்படியே வைத்திருக்கிறது; ‘ஏழுமடங்கு ஆவி’ என்று மொழிபெயர்த்து விவாதத்திற்குரிய அடையாளப் பொருளை முதன்மை உரையில் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: ἃ ἐνώπιον τοῦ θρόνου αὐτοῦ
  choice: அவருடைய அரியணைக்கு முன்பாக இருக்கிற
  rationale: உறவுப்பெயரின் கருத்தை இயல்பான தமிழில் பெயரெச்சத் தொடராக அளிக்கிறது; πνεύματα என்பவற்றின் இயல்பை மொழிபெயர்ப்பிலேயே கூடுதலாக வரையறுக்கவில்லை.
theological_decisions:
- issue: ‘இருக்கிறவரும் இருந்தவரும் வந்துகொண்டிருக்கிறவருமானவர்’ என்பவரின் அடையாளமும் காலக் குறிப்பும்
  choice: இதை தேவனைக் குறிக்கும் தனிப்பட்ட தெய்வீகப் பட்டப்பெயராகவும், ὁ ἐρχόμενος என்பதைக் ‘வந்துகொண்டிருக்கிறவர்’ என்றும் மொழிபெயர்த்தல்.
  alternative: ‘இருக்கிறவரும் இருந்தவரும் வரவிருக்கிறவருமானவர்’
  rationale: முதன்மைத் தேர்வு நிகழ்காலப் பங்கேற்பின் இயக்கமுள்ள அர்த்தத்தை நெருக்கமாகக் காக்கிறது. மரபான மாற்று வடிவம் எதிர்காலக் கருத்தைத் தெளிவாக்கினாலும், கிரேக்கத்தின் நேரடி வினை வலிமையை ஓரளவு மென்மையாக்குகிறது.
- issue: ‘ஏழு ஆவிகள்’ என்பவற்றின் அடையாளம்
  choice: முதன்மை உரையில் ‘ஏழு ஆவிகள்’ என்ற பன்மையைப் பாதுகாத்தல்.
  alternative: பரிசுத்த ஆவியின் நிறைவைக் குறிக்கும் அடையாளம்; அல்லது தேவனுடைய அரியணைக்கு முன்புள்ள ஏழு பரலோக ஆவிகள்.
  rationale: அடையாளம் விவாதத்திற்குரியது; கிரேக்க உரை வெளிப்படையாக ‘ஏழு ஆவிகள்’ என்கிறது. ஆகவே மொழிபெயர்ப்பு எந்த ஒரு இறையியல் விளக்கத்தையும் உரைக்குள் திணிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் கடிதத் தொடக்கத்தின் மேன்மையும் காக்கப்பட்டுள்ளன. ‘எழுதுவது’ என்பது தமிழில் அனுப்புநர்–பெறுநர் தொடர்பைத் தெளிவாக்கச் சேர்க்கப்பட்ட இயல்பான கடிதச் சொற்றொடர். ‘அரியணை’ உயர்ந்த அரசாட்சி உருவகத்தைக் காக்கிறது. அனைத்து அடிக்குறிப்பு குறிகளும் உரையில் உரிய இடத்தில் இடம்பெற்றுள்ளன.
