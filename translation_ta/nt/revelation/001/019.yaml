id: REV.1.19
reference: Revelation 1:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: γράψον οὖν ἃ εἶδες καὶ ἃ εἰσὶν καὶ ἃ μέλλει ⸀γίνεσθαι μετὰ ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/019.yaml
  text: Therefore write what you have seen[a], and what is, and what is about to happen after these things.
translation:
  language: ta
  text: ஆகவே, நீ கண்டவற்றையும், இருப்பவற்றையும், இவற்றுக்குப் பிறகு நிகழவிருப்பவற்றையும்[a] எழுது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவற்றுக்குப் பிறகு நிகழும்வற்றையும்.” இந்த வினைச்சொல் சில சூழல்களில் சாதாரண எதிர்காலப் பொருளில் பயன்படலாம்; எனினும், பெரும்பாலும் விரைவில் நிகழவிருப்பதைக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: γράψον
  choice: எழுது
  rationale: இது ஒருமையில் இரண்டாம் நபருக்குக் கொடுக்கப்படும் நேரடியான கட்டளை. கூடுதல் விளக்கத்தைச் சேர்க்காமல் கிரேக்கச் சொல்லின் இயல்பான வலிமையைத் தக்கவைக்கிறது.
- source_word: οὖν
  choice: ஆகவே
  rationale: முந்தைய தரிசனத்தையும் இப்போது கொடுக்கப்படும் எழுதும் கட்டளையையும் இணைக்கும் முடிவுறுத்தும் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἃ εἶδες
  choice: நீ கண்டவற்றையும்
  rationale: ஏற்கெனவே யோவான் கண்ட தரிசனத்தின் உள்ளடக்கத்தைக் குறிக்கும் இறந்தகால வடிவத்தைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: ἃ εἰσὶν
  choice: இருப்பவற்றையும்
  rationale: கிரேக்கத்தின் நிகழ்காலத்தையும் பன்மைப் பொருளையும் காக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘இப்போது’ என்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: μέλλει γίνεσθαι
  choice: நிகழவிருப்பவற்றையும்
  rationale: μέλλω என்பதில் காணப்படும் விரைவில் அல்லது அண்மையில் நிகழவிருக்கும் பொருளைத் தக்கவைக்கிறது; அதை வெறும் எதிர்காலமாகத் தட்டையாக்கவில்லை.
- source_word: μετὰ ταῦτα
  choice: இவற்றுக்குப் பிறகு
  rationale: பன்மைச் சுட்டுப்பெயரையும் கால வரிசையையும் நேரடியாகப் பிரதிபலிக்கிறது; வெளிப்படுத்தலில் மீண்டும் வரும் சொற்றொடருடனும் இயல்பாக ஒத்துப்போகிறது.
theological_decisions:
- issue: வெளிப்படுத்தல் சார்ந்த சூழலில் μέλλει என்பதன் காலப் பொருள்
  choice: அண்மையில் நிகழவிருக்கும் பொருளுடன் ‘நிகழவிருப்பவை’ என்று மொழிபெயர்த்தல்
  alternative: சாதாரண எதிர்காலமாக ‘நிகழவுள்ளவை’ என்று மொழிபெயர்த்தல்
  rationale: μέλλω + வினையெச்சம் இயல்பாக எதிர்நோக்கப்படும் அல்லது நெருங்கிய நிகழ்வைக் குறிக்கக்கூடும். இந்தக் காலப் பதற்றத்தைத் தக்கவைத்தபடியே, பரந்த இறுதிக்காலக் கருத்துவேறுபாடுகளில் ஒன்றை மொழிபெயர்ப்பு தீர்மானித்துவிடாமல் விடுகிறது.
translation_notes:
  register: நவீனத் தரமான தமிழில், சுருக்கமானதும் கண்ணியமானதும் வாசிக்க எளிதானதுமான நடையைக் கொண்டுள்ளது. ‘கண்டவை—இருப்பவை—நிகழவிருப்பவை’ என்ற மூவகை இணை அமைப்பு பாதுகாக்கப்பட்டுள்ளது; தேவையற்ற விளக்கச் சொற்கள் சேர்க்கப்படவில்லை.
