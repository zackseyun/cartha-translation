id: REV.1.9
reference: Revelation 1:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἐγὼ Ἰωάννης, ὁ ἀδελφὸς ὑμῶν καὶ ⸀συγκοινωνὸς ἐν τῇ θλίψει καὶ βασιλείᾳ καὶ ὑπομονῇ ⸀ἐν Ἰησοῦ, ἐγενόμην ἐν τῇ νήσῳ τῇ καλουμένῃ Πάτμῳ διὰ τὸν λόγον τοῦ θεοῦ ⸀καὶ τὴν μαρτυρίαν ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/009.yaml
  text: I[a], John, your brother and fellow participant in the tribulation and kingdom and endurance in Jesus, was on the island called Patmos because of the word of God and the testimony of Jesus.
translation:
  language: ta
  text: உங்கள் சகோதரனும், இயேசுவில் உபத்திரவத்திலும் அரசாட்சியிலும் நிலைத்திருத்தலிலும் உங்களுடன் பங்குபெறுகிறவனுமான யோவானாகிய நான், கடவுளின் வார்த்தையின் காரணமாகவும் இயேசுவின் சாட்சியின் காரணமாகவும்[a] பத்மு எனப்படும் தீவில் இருந்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இயேசுவைப் பற்றிய சாட்சியின் காரணமாகவும்.” கிரேக்கத்தில் இது இயேசு அளித்த சாட்சியையோ இயேசுவைப் பற்றிய சாட்சியையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: συγκοινωνός
  choice: உங்களுடன் பங்குபெறுகிறவன்
  rationale: பிறருடன் ஒன்றில் பங்குகொள்ளுதலைத் தெளிவாகக் காட்டுகிறது; வணிகக் கூட்டாண்மை போன்ற தேவையற்ற பொருளையும் தவிர்க்கிறது.
- source_word: ἐν τῇ θλίψει καὶ βασιλείᾳ καὶ ὑπομονῇ
  choice: உபத்திரவம், அரசாட்சி, மனவுறுதி ஆகியவற்றில்
  rationale: மூன்று பெயர்ச்சொற்களையும் ஒரே பங்கேற்புத் தளமாக இணைக்கிறது. ‘உபத்திரவம்’ வெளிப்படுத்தின விசேஷத்தின் கடுமையான சூழலைக் காக்கிறது; ‘அரசாட்சி’ ஆட்சி செய்வதையும் ஆட்சிக்குட்பட்ட நிலையையும் உள்ளடக்குகிறது; ‘மனவுறுதி’ சோதனையில் நிலைத்து நிற்கும் ὑπομονή என்ற கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐν Ἰησοῦ
  choice: இயேசுவில்
  rationale: முந்திய மூன்று கூறுகளையும் இயேசுவுடன் தொடர்புபடுத்தும் சுருக்கமான மூலமொழி அமைப்பை விளக்கவுரை சேர்க்காமல் காக்கிறது.
- source_word: ἐγενόμην ἐν τῇ νήσῳ
  choice: தீவில் இருந்தேன்
  rationale: இங்கு γίνομαι இடத்தில் இருப்பதைக் குறிக்கும் இயல்பான வழக்காகப் பயன்படுகிறது; அவர் அங்கு எவ்வாறு வந்தார் என்று மூலத்தில் இல்லாத தகவலைச் சேர்க்கவில்லை.
- source_word: τῇ καλουμένῃ Πάτμῳ
  choice: பத்மு எனப்படும்
  rationale: καλουμένῃ என்பதன் பொருளை இயல்பாகத் தருகிறது; ‘பத்மு’ என்பது தமிழில் நிலைபெற்ற தீவுப் பெயர் வடிவம்.
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: கடவுளின் வார்த்தையின் காரணமாக
  rationale: குற்றஞ்சாட்டப்பட்டதா, அறிவித்ததா, அதற்கான பற்றுறுதியா என்பதை முடிவுசெய்யாமல், διά + accusative குறிக்கும் காரணத்தைத் திறந்தவாறே வைக்கிறது.
- source_word: τὴν μαρτυρίαν Ἰησοῦ
  choice: இயேசுவின் சாட்சி
  rationale: Ἰησοῦ என்ற மரபுவேற்றுமை இயேசு அளித்த சாட்சியையோ இயேசுவைப் பற்றிய சாட்சியையோ குறிக்கலாம். ‘இயேசுவின் சாட்சி’ அந்த இருபொருள் வாய்ப்பையும் பிரதான உரையில் காக்கிறது.
- source_word: ἀδελφὸς ὑμῶν
  choice: உங்கள் சகோதரன்
  rationale: யோவான் தன்னை வாசகர்களுடன் குடும்ப உறவிலும் ஒருமைப்பாட்டிலும் அடையாளப்படுத்துவதை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: μαρτυρίαν Ἰησοῦ என்பதில் உள்ள மரபுவேற்றுமையின் இருபொருள் வாய்ப்பு
  choice: பிரதான உரையில் ‘இயேசுவின் சாட்சி’ என்று மொழிபெயர்த்தல்
  alternative: ‘இயேசுவைப் பற்றிய சாட்சி’
  rationale: இது இயேசு அளிக்கும் சாட்சியா அல்லது இயேசுவைப் பற்றிய சாட்சியா என்பதை கிரேக்கம் இலக்கண ரீதியாகத் தீர்மானிப்பதில்லை. ஆகவே பிரதான உரை குழப்பத்தைத் தீர்க்காமல் காக்கிறது; மற்ற பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய மதிப்புமிக்க நடையைப் பயன்படுத்துகிறது. ‘உபத்திரவம்’ வெளிப்படுத்தின விசேஷச் சூழலின் தீவிரத்தைக் காக்கும் பரவலாக அறியப்பட்ட வேதாகமச் சொல்; மற்ற சொற்றொடர்கள் முடிந்தவரை இயல்பான நடையில் அமைக்கப்பட்டுள்ளன.
