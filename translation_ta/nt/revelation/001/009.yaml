revisions:
- from: உங்கள் சகோதரனும், இயேசுவில் உபத்திரவம், அரசாட்சி, மனவுறுதி ஆகியவற்றில் உங்களுடன் பங்குபெறுகிறவனுமான யோவான் ஆகிய நான், கடவுளின் வார்த்தையின் காரணமாகவும் இயேசுவின் சாட்சியின் காரணமாகவும்[a] பத்மு எனப்படும் தீவில் இருந்தேன்.
  to: உங்கள் சகோதரனும், இயேசுவில் உபத்திரவத்திலும் அரசாட்சியிலும் நிலைத்திருத்தலிலும் உங்களுடன் பங்குபெறுகிறவனுமான யோவானாகிய நான், கடவுளின் வார்த்தையின் காரணமாகவும் இயேசுவின் சாட்சியின் காரணமாகவும்[a] பத்மு எனப்படும் தீவில் இருந்தேன்.
  rationale: The revision replaces a term that can mean personal resolve with one that better represents enduring steadfastness, and it smooths the Tamil word order. It preserves the source’s shared-sphere construction, does not specify why John was on Patmos beyond the stated cause, and maintains the disputed genitive in ‘இயேசுவின் சாட்சி’ with its alternative sense in the footnote.
  reviewer_model: gpt-5.6-terra
