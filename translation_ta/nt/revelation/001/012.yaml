source:
  edition: SBLGNT
  text: ⸀Καὶ ἐπέστρεψα βλέπειν τὴν φωνὴν ἥτις ἐλάλει μετ’ ἐμοῦ· καὶ ἐπιστρέψας εἶδον ἑπτὰ λυχνίας χρυσᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/012.yaml
  text: And I turned to see the voice that was speaking with me[a], and when I turned, I saw seven golden lampstands,
translation:
  language: ta
  text: என்னோடு பேசிக்கொண்டிருந்த குரலைப் பார்க்க நான் திரும்பினேன்.[a] நான் திரும்பியபோது, ஏழு பொன் விளக்குத்தண்டுகளைக் கண்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என்னிடம் பேசிக்கொண்டிருந்த குரலை.’ கிரேக்க மொழியில் சொல்லுக்குச் சொல் ‘என்னோடு பேசிக்கொண்டிருந்த’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέστρεψα
  choice: நான் திரும்பினேன்
  rationale: இது உடலைத் திருப்பிய ஒரு நிகழ்வைக் குறிக்கும் இறந்தகால வினை. ‘திரும்பினேன்’ என்பது இயல்பாகவும் மூலத்தின் அளவுக்கேற்பவும் உள்ளது.
- source_word: βλέπειν
  choice: பார்க்க
  rationale: திரும்பியதன் நோக்கத்தைச் சொல்லும் வினையெச்சமாக உள்ளது. தமிழில் ‘குரலைப் பார்க்க’ என்ற அசாதாரணமான சொல்லிணைப்பைத் தக்கவைப்பது மூலத்தின் உயிர்ப்பான புலனுணர்வு மாற்றத்தைப் பாதுகாக்கிறது.
- source_word: τὴν φωνὴν
  choice: குரலை
  rationale: பேசிக்கொண்டிருந்தது எனத் தொடர்வதால் φωνή இங்கு ‘ஒலி’ என்பதைவிட ‘குரல்’ எனத் துல்லியமாகப் பொருள்படுகிறது.
- source_word: ἥτις ἐλάλει μετ’ ἐμοῦ
  choice: என்னோடு பேசிக்கொண்டிருந்த
  rationale: இறந்தகாலத்தில் தொடர்ந்து நடைபெற்ற செயலை ‘பேசிக்கொண்டிருந்த’ காட்டுகிறது. μετά + மரபுவேற்றுமையின் உடனிருப்பு நுணுக்கத்தை ‘என்னோடு’ தக்கவைக்கிறது; சூழலில் ‘என்னிடம்’ என்பதும் சாத்தியம்.
- source_word: ἐπιστρέψας
  choice: நான் திரும்பியபோது
  rationale: முதன்மை வினைக்கு முன்போ அதனுடன் தொடர்பாகவோ நிகழும் திரும்புதலை இயல்பான காலத் துணைவாக்கியமாக வழங்குகிறது.
- source_word: εἶδον
  choice: கண்டேன்
  rationale: ὁράω என்பதன் எளிய இறந்தகாலப் பொருளை இயல்பான தமிழில் நேரடியாகக் கொடுக்கிறது.
- source_word: ἑπτὰ λυχνίας χρυσᾶς
  choice: ஏழு பொன் விளக்குத்தண்டுகளை
  rationale: λυχνία என்பது விளக்கையே அல்ல, அதைத் தாங்கும் தண்டைக் குறிக்கிறது. χρυσᾶς பொருளைக் குறிக்கும் பெயரடையாக இருப்பதால் ‘பொன்’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
theological_decisions:
- issue: வெளிப்படுத்தின விசேஷத்தின் அடையாள மொழியில் λυχνίας என்பதன் மொழிபெயர்ப்பு
  choice: விளக்குத்தண்டுகள்
  alternative: விளக்குகள்
  rationale: 1:20-இல் இவை அடையாளமாக விளக்கப்படுவதால், விளக்குக்கும் அதைத் தாங்கும் தண்டுக்கும் உள்ள வேறுபாட்டைக் காப்பது முக்கியம். ‘விளக்குகள்’ என மொழிபெயர்த்தால் உருவகம் மங்கிவிடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘குரலைப் பார்க்க’ என்பது தமிழிலும் சற்றே அசாதாரணமாக இருந்தாலும், மூல கிரேக்கத்தின் திட்டமிட்ட சொல்லாட்சியைத் தக்கவைக்கிறது. ‘விளக்குத்தண்டு’ என்பது அடுத்துவரும் அடையாள விளக்கத்துடன் துல்லியமான தொடர்பைப் பேணுகிறது.
