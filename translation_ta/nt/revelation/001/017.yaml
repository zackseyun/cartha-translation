  text: Καὶ ὅτε εἶδον αὐτόν, ἔπεσα πρὸς τοὺς πόδας αὐτοῦ ὡς νεκρός· καὶ ἔθηκεν τὴν δεξιὰν αὐτοῦ ἐπ’ ἐμὲ λέγων· Μὴ φοβοῦ· ἐγώ εἰμι ὁ πρῶτος καὶ ὁ ἔσχατος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/017.yaml
  text: And when I saw him[a], I fell at his feet like a dead man. And he placed his right hand on me, saying, “Do not fear[b]. I am the First and the Last,”
translation:
  language: ta
  text: நான் அவரைக் கண்டபோது, இறந்த ஒருவனைப் போல[a] அவருடைய காலடியில் விழுந்தேன். அவர் தமது வலது கையை என்மேல் வைத்து, “அஞ்சாதே[b]. நானே முதலானவரும் கடைசியானவரும்,” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இறந்ததுபோல்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘பயப்படாதே’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ὅτε εἶδον αὐτόν
  choice: நான் அவரைக் கண்டபோது
  rationale: καί தொடரும் கதைநடையை இணைக்கிறது; தமிழில் வாக்கியத் தொடக்கத்தில் தனியாக ‘மேலும்’ சேர்ப்பதைவிட காலவினைத் தொடரால் அந்த ஓட்டம் இயல்பாக வெளிப்படுகிறது. εἶδον αὐτόν என்பது நேரடியாக ‘அவரைக் கண்டேன்’ எனப் பொருள்படும்.
- source_word: ἔπεσα πρὸς τοὺς πόδας αὐτοῦ
  choice: அவருடைய காலடியில் விழுந்தேன்
  rationale: πρός இங்கு ஒருவருக்கு முன்பாக, அவரது பாதங்களருகே விழுவதைக் குறிக்கிறது. ‘காலடியில் விழுந்தேன்’ என்பது தெளிவான, இயல்பான தமிழ்ச் சொற்றொடர்.
- source_word: ὡς νεκρός
  choice: இறந்த ஒருவனைப் போல
  rationale: ὡς வெளிப்படையான ஒப்புமையைக் குறிக்கிறது. யோவான் உண்மையில் இறந்தார் என்று கூறாமல், அவர் விழுந்த நிலையை உயிரிழந்த ஒருவரோடு ஒப்பிடுகிறது.
- source_word: ἔθηκεν τὴν δεξιὰν αὐτοῦ ἐπ’ ἐμέ
  choice: அவர் தமது வலது கையை என்மேல் வைத்து
  rationale: τίθημι என்பது இங்கு ‘வைத்தல்’; δεξιά ausdrücklich வலது கையைக் குறிக்கிறது. ‘தமது’ என்பது செய்பவரையே உரிமையாளராகத் தெளிவுபடுத்துகிறது.
- source_word: λέγων
  choice: என்றார்
  rationale: கிரேக்கப் பங்கேற்புவினை கை வைத்தபோது கூறியதைக் காட்டுகிறது. தமிழில் நேரடி உரையின் முடிவில் ‘என்றார்’ என்பது இயல்பான கதைநடை.
- source_word: Μὴ φοβοῦ
  choice: அஞ்சாதே
  rationale: φοβέομαι என்பதன் தடை வடிவம். ‘அஞ்சாதே’ என்பது சுருக்கமான, கண்ணியமான, இன்றும் தெளிவாகப் புரியும் கட்டளை.
- source_word: ἐγώ εἰμι ὁ πρῶτος καὶ ὁ ἔσχατος
  choice: முதலானவரும் கடைசியானவரும் நானே
  rationale: வெளிப்படையாக உள்ள ἐγώ வலியுறுத்துவதால் ‘நானே’ என மொழிபெயர்க்கப்பட்டது. பெயர்ச்சொல்லாகச் செயல்படும் இரண்டு அடைமொழிகளும் தனிப்பட்ட பட்டப்பெயர் போன்ற வடிவில் பாதுகாக்கப்பட்டுள்ளன.
theological_decisions:
- issue: ὁ πρῶτος καὶ ὁ ἔσχατος என்ற சுயஅடையாளத்தின் பட்டப்பெயர்த் தன்மை
  choice: முதலானவரும் கடைசியானவரும்
  alternative: முதலும் முடிவும்
  rationale: கிரேக்கத்தில் இரு அடைமொழிகளுக்கும் தனித்தனி உருபு இருப்பதால் அவை ஒருவரைக் குறிக்கும் பட்டப்பெயர்களாகச் செயல்படுகின்றன. ‘முதலும் முடிவும்’ என்பது கருத்தைச் சுருக்கினாலும், மூலத்தின் ஆளைக் குறிக்கும் வடிவத்தை மங்கச் செய்யலாம்.
- issue: ἐγώ εἰμι என்பதின் வலியுறுத்தல்
  choice: நானே
  alternative: நான் இருக்கிறேன்
  rationale: இங்கு ἐγώ εἰμι அடுத்து வரும் பட்டப்பெயர்களுடன் சுயஅடையாளமாகச் செயல்படுகிறது. தமிழில் ‘நானே’ வலியுறுத்தலை இயல்பாகக் காக்கிறது; ‘நான் இருக்கிறேன்’ என்பது இருப்பைக் குறிக்கும் தனி கூற்றாகத் தவறாகப் புரியக்கூடும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வெளிப்பாடு பயன்படுத்தப்பட்டுள்ளது. ‘காலடியில்’, ‘தமது வலது கை’, ‘அஞ்சாதே’ ஆகியவை எளிதில் புரியும் வகையிலும் வெளிப்படுத்தல் நூலின் மேன்மையான தொனியைத் தக்கவைக்கும் வகையிலும் உள்ளன. ஆங்கில ஆலோசனை உரையில் [a] குறியீடு ‘him’ என்பதற்குப் பின் இருந்தாலும், அதன் குறிப்புரை ὡς νεκρός என்பதற்குரியது; ஆகவே தமிழில் அது தொடர்புடைய ‘இறந்த ஒருவனைப் போல’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
