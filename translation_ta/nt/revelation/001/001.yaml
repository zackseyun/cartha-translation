id: REV.1.1
reference: Revelation 1:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἀποκάλυψις Ἰησοῦ Χριστοῦ, ἣν ἔδωκεν αὐτῷ ὁ θεὸς δεῖξαι τοῖς δούλοις αὐτοῦ, ἃ δεῖ γενέσθαι ἐν τάχει, καὶ ἐσήμανεν ἀποστείλας διὰ τοῦ ἀγγέλου αὐτοῦ τῷ δούλῳ αὐτοῦ Ἰωάννῃ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/001.yaml
  text: The revelation of Jesus the Messiah[a], which God gave him to show his servants what must happen soon, and he made it known by sending it through his angel to his servant John[d][c][b],
translation:
  language: ta
  text: இயேசு மெசியாவின் வெளிப்பாடு[a]. விரைவில் நிகழ வேண்டியவற்றைத் தம் அடிமைகளுக்குக் காட்டுவதற்காகக் கடவுள் இதை அவருக்குக் கொடுத்தார். அவர் தம் தூதனை அனுப்பி, அவன் வழியாகத் தம் அடிமையான யோவானுக்கு இதை அறிவித்தார்[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இயேசு மெசியாவிடமிருந்து வந்த வெளிப்பாடு’ அல்லது ‘இயேசு மெசியாவைப் பற்றிய வெளிப்பாடு’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடர் இந்த உறவைத் தனியாகத் தீர்மானிப்பதில்லை.
    reason: alternative_reading
  - marker: b
    text: ‘விரைவாக’ என்றும் பொருள் கொள்ளலாம். இந்த நிகழ்வுகள் விரைவில் தொடங்கும் என்பதையோ, தொடங்கியதும் வேகமாக நிகழும் என்பதையோ இச்சொற்றொடர் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘தெரியப்படுத்தினார்’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்க வினைச்சொல் அடையாளங்கள் மூலம் அறிவித்தல் என்ற நுணுக்கத்தையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκάλυψις
  choice: வெளிப்பாடு
  rationale: மறைந்திருந்ததை வெளிப்படுத்துதல் என்ற பொருளை இயல்பான, மரபில் நிலைபெற்ற தமிழில் தருகிறது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியாவைப் பற்றிய
  rationale: தமிழில் வெறும் ‘இயேசு மெசியாவின் வெளிப்பாடு’ என்பது உடைமை அல்லது மூலத்தை முதன்மையாக உணர்த்தக்கூடும். இங்கு ‘பற்றிய’ என்பதை முதன்மை உரையில் எடுத்தாலும், கிரேக்க வேற்றுமையின் ‘இயேசுவிடமிருந்து’ என்ற சாத்தியத்தை அடிக்குறிப்பில் காக்கிறது.
- source_word: ἣν ἔδωκεν αὐτῷ ὁ θεὸς
  choice: கடவுள் இதை அவருக்குக் கொடுத்தார்
  rationale: ‘அவர்’ என்பது இயேசு மெசியாவைக் குறிக்கிறது; கடவுளுக்கும் இயேசுவுக்கும் இடையிலான மூல உரையின் வேறுபாட்டை விளக்கச் சேர்க்காமல் காக்கிறது.
- source_word: δεῖξαι
  choice: காட்டுவதற்காக
  rationale: நோக்கத்தைக் குறிக்கும் infinitive-ஐத் தெளிவாகவும் தரிசனச் சூழலுக்கு ஏற்றவாறும் தருகிறது.
- source_word: τοῖς δούλοις αὐτοῦ / τῷ δούλῳ αὐτοῦ
  choice: தம் அடிமைகளுக்கு / தம் அடிமையான
  rationale: δοῦλος குறிக்கும் எஜமானுக்குச் சொந்தமான கட்டுப்பட்ட நிலையை ‘ஊழியர்’ என்பதைக் காட்டிலும் நேரடியாகக் காக்கிறது.
- source_word: ἃ δεῖ γενέσθαι
  choice: நிகழ வேண்டியவற்றை
  rationale: தேவையையும் வருங்கால நிகழ்வுகளையும் சுருக்கமான இயல்பான தமிழில் காக்கிறது.
- source_word: ἐν τάχει
  choice: விரைவில்
  rationale: கால நெருக்கத்தையும் வேகத்தையும் தமிழில் ஓரளவு திறந்தவாறே வைத்திருக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ἐσήμανεν
  choice: அடையாளங்களால் தெரியப்படுத்தினார்
  rationale: ‘தெரியப்படுத்தினார்’ என்ற பொதுப் பொருளுடன் σημαίνω-வில் இருக்கக்கூடிய அடையாளங்கள் வழியான தொடர்பின் நுணுக்கத்தையும் வெளிப்படுத்துகிறது.
- source_word: ἀποστείλας διὰ τοῦ ἀγγέλου αὐτοῦ
  choice: தம் தூதனை அனுப்பி, அவன் வழியாக
  rationale: ἀποστείλας-இன் வழிமுறைத் தொடர்பையும் διά-வின் இடைமுகச் செயல்பாட்டையும் தெளிவான தமிழில் தருகிறது.
- source_word: Ἰωάννῃ
  choice: யோவானுக்கு
  rationale: பெறுநரைக் குறிக்கும் dative-ஐ இயல்பாகத் தருகிறது.
theological_decisions:
- issue: Ἀποκάλυψις Ἰησοῦ Χριστοῦ என்பதிலுள்ள genitive உறவு
  choice: முதன்மை உரையில் ‘இயேசு மெசியாவைப் பற்றிய வெளிப்பாடு’
  alternative: ‘இயேசு மெசியாவிடமிருந்து வந்த வெளிப்பாடு’ அல்லது ‘இயேசு மெசியாவுக்குரிய வெளிப்பாடு’
  rationale: கிரேக்கம் மூலத்தையும் பொருளையும் உடைமை/தொடர்பையும் அனுமதிக்கிறது. தமிழில் அனைத்தையும் ஒரே சொற்றொடரில் இயல்பாகக் காக்க முடியாததால் ஒரு வாசிப்பு முதன்மை உரையில் தரப்பட்டு, மற்றவை அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- issue: δοῦλος என்பதன் சமூக-இறையியல் வலிமை
  choice: அடிமை
  alternative: ஊழியர் / பணியாளர்
  rationale: இங்கு கடவுள் அல்லது இயேசுவுக்குச் சொந்தமான நிலை முன்னிலைப்படுவதால், மென்மையாக்காமல் ‘அடிமை’ என்று தரப்பட்டது.
- issue: ἐσήμανεν என்பதிலுள்ள அடையாள நுணுக்கம்
  choice: அடையாளங்களால் தெரியப்படுத்தினார்
  alternative: தெரியப்படுத்தினார்
  rationale: வினைச்சொல்லின் பொதுவான ‘அறிவித்தல்’ பொருளையும் வெளிப்படுத்துதல் நூலின் குறியீட்டு இயல்புக்கு ஏற்ற அடையாள நுணுக்கத்தையும் ஒருங்கே காக்கிறது.
translation_notes:
  register: நவீன தரமான தமிழ்; மரியாதையானதும் பொதுவாசகர்களுக்கு தெளிவானதும். நீண்ட கிரேக்க வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று தமிழ்வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. ‘மெசியா’, ‘அடிமை’, ‘அடையாளங்களால் தெரியப்படுத்தினார்’ ஆகியவை மூலத்தின் பட்டம், உறவு, குறியீட்டு நுணுக்கம் ஆகியவற்றைக் காக்கத் தேர்ந்தெடுக்கப்பட்டன.
