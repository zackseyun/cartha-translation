id: REV.1.13
reference: Revelation 1:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐν μέσῳ ⸀τῶν λυχνιῶν ὅμοιον ⸀υἱὸν ἀνθρώπου, ἐνδεδυμένον ποδήρη καὶ περιεζωσμένον πρὸς τοῖς μαστοῖς ζώνην χρυσᾶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/013.yaml
  text: and in the midst of the lampstands[a], one like a son of man, clothed in a robe reaching to the feet and girded across the chest with a golden sash.
translation:
  language: ta
  text: விளக்குத்தண்டுகளின் நடுவில் மனிதகுமாரன் போன்ற ஒருவரைக் கண்டேன்.[a] அவர் பாதங்கள் வரை நீண்ட ஆடையை அணிந்திருந்தார்; மார்பின் குறுக்கே பொன்னாலான கச்சையைக் கட்டியிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனிதகுமாரன் போன்ற ஒருவர்.” இந்தக் கிரேக்கச் சொற்றொடர் தானியேல் 7:13-ஐ எதிரொலிக்கிறது; இங்கு அது மகிமைப்படுத்தப்பட்ட இயேசுவுக்குப் பயன்படுத்தப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν μέσῳ τῶν λυχνιῶν
  choice: அந்த விளக்குத்தண்டுகளின் நடுவில்
  rationale: ἐν μέσῳ என்பதன் இடவியல் பொருளை ‘நடுவில்’ இயல்பாகத் தருகிறது. λυχνία என்பது விளக்கையே அல்ல, அதைத் தாங்கும் தண்டைக் குறிக்கும் என்பதால் ‘விளக்குத்தண்டுகள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ὅμοιον υἱὸν ἀνθρώπου
  choice: மனிதகுமாரனைப் போன்ற ஒருவர்
  rationale: கிரேக்கத்தில் υἱὸν என்பதற்கு முன் சுட்டுச்சொல் இல்லாததையும் தானியேல் 7:13-ன் எதிரொலியையும் ஒருங்கே காக்கிறது. ‘மனிதகுமாரன்’ என்ற மரபான வேதாகமச் சொல் குறிப்பை உணர்த்தினாலும், ‘போன்ற ஒருவர்’ என்பது வாக்கியத்தின் ஒப்புமைத் தன்மையைத் தக்கவைக்கிறது.
- source_word: ἐνδεδυμένον ποδήρη
  choice: பாதங்கள்வரை நீண்ட அங்கியை அணிந்து
  rationale: ποδήρης என்பதன் ‘பாதங்கள்வரை எட்டும்’ பொருளைத் தெளிவாக வெளிப்படுத்துகிறது; ‘அங்கி’ காட்சியின் கண்ணியமான உடைநடையைப் பேணுகிறது.
- source_word: περιεζωσμένον πρὸς τοῖς μαστοῖς
  choice: மார்பைச் சுற்றி … கச்சையைக் கட்டியிருந்தார்
  rationale: கச்சை இடுப்பில் அல்லாமல் உடலின் மேற்பகுதியான மார்பில் கட்டப்பட்டிருந்த இடத்தைக் கிரேக்கத்திற்கு ஏற்ப தெளிவாகக் காட்டுகிறது.
- source_word: ζώνην χρυσᾶν
  choice: பொன்னாலான கச்சை
  rationale: ζώνη என்பது பட்டை அல்லது கச்சையைக் குறிக்கலாம்; மார்பைச் சுற்றிய நீளமான அலங்கார உடைப்பகுதிக்கு ‘கச்சை’ இயல்பாகப் பொருந்துகிறது. χρυσᾶν பொருளை ‘பொன்னாலான’ எனத் தருகிறது.
theological_decisions:
- issue: ὅμοιον υἱὸν ἀνθρώπου என்பதன் கிறிஸ்துவியல் வலிமை
  choice: முதன்மை உரையில் ‘மனிதகுமாரனைப் போன்ற ஒருவர்’
  alternative: ‘மனிதகுமாரனாகிய அவரைப் போன்ற ஒருவர்’ அல்லது தலைப்பாக இன்னும் வெளிப்படையாகப் புரிந்துகொள்ளுதல்
  rationale: முதன்மை உரை கிரேக்கத்தின் ஒப்புமை வடிவத்தையும் சுட்டுச்சொல் இல்லாமையையும் காக்கிறது; அதேவேளையில் தானியேல் 7:13-ன் எதிரொலியும் இக்காட்சி மகிமைப்படுத்தப்பட்ட இயேசுவுக்குப் பயன்படுத்தப்படுவதும் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பும் கண்ணியமும் இணைந்த காட்சிமொழி பயன்படுத்தப்பட்டுள்ளது. முந்தைய வசனத்தில் உள்ள ‘கண்டேன்’ என்ற வினை கிரேக்கத்தில் இவ்வசனத்திற்கும் தொடர்வதால், தமிழில் முழுமையான வாக்கியமாக அமைய அது இங்கு வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது. ‘கட்டியிருந்தார்’ என்பது நிறைவுற்ற நிலையில் காணப்பட்ட உடை அமைப்பை உணர்த்துகிறது.
