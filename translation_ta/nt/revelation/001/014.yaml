- from: அவருடைய தலையும் தலைமுடியும் வெண்மையாக இருந்தன[a]—வெள்ளைக் கம்பளியைப் போலவும் பனியைப் போலவும் இருந்தன; அவருடைய கண்கள் நெருப்புச் சுடரைப் போல இருந்தன[b].
