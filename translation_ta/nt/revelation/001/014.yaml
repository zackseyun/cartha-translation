  source_fidelity: The draft accurately retains the two coordinated subjects, the repeated whiteness imagery, both similes, and the fire-flame comparison. However, «கம்பளி» normally means a blanket in modern Tamil, whereas ἔριον means wool/fleece; this should be corrected to «ஆட்டுமயிர்».
