id: REV.1.14
reference: Revelation 1:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἡ δὲ κεφαλὴ αὐτοῦ καὶ αἱ τρίχες λευκαὶ ὡς ἔριον λευκόν, ὡς χιών, καὶ οἱ ὀφθαλμοὶ αὐτοῦ ὡς φλὸξ πυρός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/014.yaml
  text: His head and hair were white[a], like white wool, like snow, and his eyes were like a flame of fire[b],
translation:
  language: ta
  text: அவருடைய தலையும் தலைமுடியும் வெண்மையாக இருந்தன[a]—வெள்ளை நிற ஆட்டுமயிரைப் போலவும் பனியைப் போலவும்; அவருடைய கண்கள் நெருப்பின் சுடரைப் போல இருந்தன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய தலையும் தலைமுடியும் வெள்ளை நிற ஆட்டுமயிரைப் போலவும் பனியைப் போலவும் வெண்மையாக இருந்தன.”
    reason: கிரேக்கச் சொற்றொடரின் அமைப்பை இன்னும் நெருக்கமாகப் பிரதிபலிக்கும் மாற்று மொழிபெயர்ப்பு.
  - marker: b
    text: இந்தப் படிமம் தானியேல் 7:9-ஐ எதிரொலிக்கிறது; இது இவ்விவரிப்பின் தரிசனத் தன்மையை வலியுறுத்துகிறது.
    reason: வேதப்பகுதி தொடர்பும் தரிசனப் பின்னணியும்.
lexical_decisions:
- source_word: δὲ
  choice: தனி சொல்லாக மொழிபெயர்க்கப்படவில்லை
  rationale: இது இங்கு விளக்கத்தைத் தொடரும் மென்மையான இணைப்புச்சொல்; தமிழில் தனியாக ‘இப்போது’ அல்லது ‘ஆனால்’ என்று சேர்ப்பது இல்லாத கால அல்லது எதிர்மறை நுணுக்கத்தை உண்டாக்கும்.
- source_word: ἡ κεφαλὴ αὐτοῦ καὶ αἱ τρίχες
  choice: அவருடைய தலையும் தலைமுடியும்
  rationale: κεφαλή என்பதற்கு ‘தலை’ என்றும், பன்மையான τρίχες என்பதற்கு இயல்பான தமிழ்க் கூட்டுப்பெயரான ‘தலைமுடி’ என்றும் மொழிபெயர்க்கப்பட்டது.
- source_word: λευκαὶ
  choice: வெண்மையாக
  rationale: அடிப்படை நிறப்பொருளை அப்படியே காக்கிறது; ‘ஒளிவீசும்’ போன்ற விளக்க விரிவாக்கம் தவிர்க்கப்பட்டது.
- source_word: ὡς ἔριον λευκόν
  choice: வெள்ளைக் கம்பளியைப் போல
  rationale: ἔριον குறிக்கும் wool என்ற பொருளையும் வெளிப்படையான உவமையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ὡς χιών
  choice: பனியைப் போல
  rationale: வெண்மையை வலுப்படுத்தும் இரண்டாவது உவமையைச் சுருக்கமின்றி காக்கிறது.
- source_word: οἱ ὀφθαλμοὶ αὐτοῦ
  choice: அவருடைய கண்கள்
  rationale: உடலுறுப்பைக் குறிக்கும் சொல்லின் நேரான, இயல்பான மொழிபெயர்ப்பு.
- source_word: ὡς φλὸξ πυρός
  choice: நெருப்புச் சுடரைப் போல
  rationale: ‘நெருப்பின் சுடர்’ என்ற கிரேக்க அமைப்பின் தீவிரமான தரிசனப் படிமத்தை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: மகிமைப்படுத்தப்பட்ட மனுஷகுமாரனைப் பற்றிய அடையாளப் படிமம்
  choice: வெண்மை, பனி, நெருப்புச் சுடர் ஆகிய உவமைகள் விளக்கமின்றி நேரடியாக வைக்கப்பட்டன.
  alternative: இவை தூய்மை, நித்தியம் அல்லது நியாயத்தீர்ப்பைக் குறிக்கின்றன என்று முதன்மை உரையிலேயே விரித்துரைத்தல்.
  rationale: வசனம் தரிசன உவமைகளைத் தருகிறது; அவற்றின் இறையியல் பொருளை இங்கே வெளிப்படையாக நிர்ணயிப்பதில்லை. ஆகவே படிமமும் அதன் விளக்கத் திறந்தநிலையும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் தரிசன மொழியின் செறிவும் காக்கப்பட்டுள்ளன. ‘வெள்ளைக் கம்பளி’ மற்றும் ‘நெருப்புச் சுடர்’ ஆகியவை பொதுவாகப் புரியும் சொற்களாகத் தேர்ந்தெடுக்கப்பட்டன; படிமங்களுக்கு விளக்கப் பொருள் முதன்மை உரையில் சேர்க்கப்படவில்லை.
