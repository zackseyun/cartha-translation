source:
  edition: SBLGNT
  text: καὶ οἱ πόδες αὐτοῦ ὅμοιοι χαλκολιβάνῳ, ὡς ἐν καμίνῳ ⸀πεπυρωμένης, καὶ ἡ φωνὴ αὐτοῦ ὡς φωνὴ ὑδάτων πολλῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/015.yaml
  text: and his feet were like burnished bronze[a], as if refined in a furnace, and his voice was like the sound of many waters[b],
translation:
  language: ta
  text: அவருடைய பாதங்கள் உலையில் நெருப்பால் காய்ச்சப்பட்டதுபோல் ஒளிரும் வெண்கலத்தைப் போல இருந்தன[a]; அவருடைய குரல் திரளான நீரின் ஓசையைப் போல இருந்தது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஒளிரும் வெண்கலம்’ என்று மொழிபெயர்க்கப்பட்டுள்ள அரிய கிரேக்கச் சொல், மிகவும் தூய்மையாக்கப்பட்ட அல்லது தகதகக்கும் ஓர் உலோகக் கலவையைக் குறிக்கலாம்; ‘நுண்ணிய பித்தளை’ அல்லது ‘மெருகூட்டப்பட்ட வெண்கலம்’ என்பனவும் சாத்தியம்.
    reason: lexical_alternative
  - marker: b
    text: இன்னும் நேரடியாக, ‘திரளான நீரின் குரலைப் போல.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πόδες
  choice: பாதங்கள்
  rationale: πούς என்பதன் நேரடியான பொருள் ‘பாதம்’; தரிசனக் காட்சியில் உடலின் கீழ்ப்பகுதியைக் குறித்தாலும், மூலத்தின் குறிப்பிட்ட உடற்பாகத்தைப் பாதுகாக்க ‘பாதங்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: ὅμοιοι
  choice: போல இருந்தன
  rationale: ὅμοιος ஒப்புமையைக் குறிக்கிறது. தமிழில் இயல்பான முழு வாக்கிய அமைப்பிற்காக ‘போல இருந்தன’ என மொழிபெயர்க்கப்பட்டது.
- source_word: χαλκολιβάνῳ
  choice: ஒளிரும் வெண்கலம்
  rationale: இது துல்லியமான பொருள் உறுதியாகத் தெரியாத அரிய உலோகப் பெயர். பிரகாசமான, நன்கு பதப்படுத்தப்பட்ட செம்புக் கலவையைச் சுட்டுவதாகத் தோன்றுவதால், குறிப்பிட்ட உலோகவியலை அளவுக்கு மீறி உறுதிப்படுத்தாமல் ‘ஒளிரும் வெண்கலம்’ என வழங்கப்பட்டது.
- source_word: ὡς ἐν καμίνῳ πεπυρωμένης
  choice: உலையில் காய்ச்சித் தூய்மையாக்கப்பட்ட
  rationale: κάμινος என்பது உலை; πυρόομαι நெருப்பால் காய்ச்சப்படுதல், எரியவைக்கப்படுதல் அல்லது தூய்மையாக்கப்படுதல் ஆகிய கருத்துகளைத் தரலாம். உலோகக் காட்சியுடன் பொருந்தும் வகையில் இரு நுணுக்கங்களையும் இயல்பாக இணைக்கும் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: φωνή
  choice: குரல்
  rationale: முதல் இடத்தில் φωνή அவருக்குரிய தனிப்பட்ட குரலைக் குறிப்பதால் ‘குரல்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ὡς φωνὴ ὑδάτων πολλῶν
  choice: திரளான நீரின் ஓசையைப் போல
  rationale: இரண்டாவது φωνή ஒப்பிடப்படும் கேட்கத்தக்க ஓசையைக் குறிக்கிறது. ὕδατα πολλά என்ற வேதாகமப் படிமத்தை ஒரு குறிப்பிட்ட இயற்கை நிகழ்வாகக் குறுக்காமல் ‘திரளான நீர்’ என்று பாதுகாக்கப்பட்டது.
theological_decisions:
- issue: இறுதி ஒப்புமையில் மீண்டும் வரும் φωνή என்பதன் மொழிபெயர்ப்பு
  choice: அவருடைய குரல் திரளான நீரின் ஓசையைப் போல இருந்தது
  alternative: அவருடைய குரல் திரளான நீரின் குரலைப் போல இருந்தது
  rationale: முதல் φωνή-க்கு ‘குரல்’ என்றும், நீரைக் குறிக்கும் இரண்டாவது φωνή-க்கு இயல்பான தமிழில் ‘ஓசை’ என்றும் வழங்குவது உயர்த்தப்பட்ட மனுமகனின் மாட்சிமையான குரலைத் தெளிவாக எடுத்துரைக்கிறது. அதே வேளையில், மூலத்தில் ஒரே சொல் இருமுறை வருவது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் புரியக்கூடிய, அதே நேரத்தில் தரிசன இலக்கியத்திற்குரிய கண்ணியமும் வலிமையும் கொண்ட நடை பயன்படுத்தப்பட்டது. அரிய உலோகப் பெயரின் நிச்சயமின்மையும் φωνή என்ற சொல்லின் மீளுருவாக்கமும் அடிக்குறிப்புகளில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன.
