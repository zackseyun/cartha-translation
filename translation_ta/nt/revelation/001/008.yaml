id: REV.1.8
reference: Revelation 1:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι τὸ Ἄλφα καὶ τὸ Ὦ, λέγει κύριος, ὁ θεός, ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος, ὁ παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/008.yaml
  text: “I am the Alpha and the Omega,” says the Lord God[a], “the one who is and who was and who is coming, the Almighty.”
translation:
  language: ta
  text: “நானே அல்பாவும் ஒமேகாவும்,” என்று இருக்கிறவரும், இருந்தவரும், வருகிறவரும்[a], எல்லாம் வல்லவருமான ஆண்டவராகிய கடவுள் கூறுகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வரவிருக்கிறவர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: நானே
  rationale: வலியுறுத்தும் Ἐγώ என்பதைக் ‘நானே’ இயல்பாக வெளிப்படுத்துகிறது. தமிழில் பெயர்ப் பயனிலையுடன் நிகழ்கால ‘இருக்கிறேன்’ விடுபடுவது இயல்பானதால், அதைத் தனியே சேர்க்கவில்லை.
- source_word: τὸ Ἄλφα καὶ τὸ Ὦ
  choice: அல்பாவும் ஒமேகாவும்
  rationale: கிரேக்க எழுத்துகளின் பெயர்களைத் தமிழில் ஒலிபெயர்த்து, வெளிப்படுத்தல் நூலுக்குரிய குறியீட்டு வலிமையையும் மரபான சொற்றொடரையும் காக்கிறது.
- source_word: λέγει
  choice: கூறுகிறார்
  rationale: நிகழ்கால மேற்கோள் அறிமுகத்தை மரியாதையும் கண்ணியமும் கொண்ட இயல்பான தமிழில் தருகிறது.
- source_word: κύριος, ὁ θεός
  choice: ஆண்டவராகிய கடவுள்
  rationale: இரு தெய்வீகப் பட்டங்களையும் ஒன்றை மற்றொன்றுடன் இணைக்கும் இயல்பான தமிழ் அமைப்பில் காக்கிறது.
- source_word: ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος
  choice: இருக்கிறவரும் இருந்தவரும் வருகிறவரும்
  rationale: மூன்று பகுதிகளைக் கொண்ட தெய்வீகச் சுயவிளக்கத்தின் இணை அமைப்பைக் காக்கிறது; ἐρχόμενος என்பதின் நிகழ்கால, இயக்கமுள்ள பொருளை ‘வருகிறவர்’ நேரடியாக வெளிப்படுத்துகிறது.
- source_word: ὁ παντοκράτωρ
  choice: எல்லாம் வல்லவர்
  rationale: முழுமையான ஆட்சிவல்லமையைக் குறிக்கும் παντοκράτωρ என்பதற்கான தெளிவான, மரபான, இயல்பான தமிழ் இணை.
theological_decisions:
- issue: கடவுளின் நித்திய இருப்பையும் எதிர்கால வருகையையும் குறிக்கும் சுயவிளக்கத்தில் ὁ ἐρχόμενος என்பதன் மொழிபெயர்ப்பு
  choice: வருகிறவர்
  alternative: வரவிருக்கிறவர்
  rationale: கிரேக்க நிகழ்காலப் பெயரெச்சம் வருகை நடந்துகொண்டிருக்கும் அல்லது உறுதியாக அணுகிவரும் இயக்கத்தைத் தாங்குகிறது. ‘வரவிருக்கிறவர்’ என்பது எதிர்காலத்தைத் தெளிவுபடுத்தும் ஏற்ற மாற்று; ஆனால் மூலத்தின் இலக்கணத் தோற்றத்தைச் சற்றுக் கூடுதலாக விளக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு கண்ணியத்துடன் எளிதில் புரியக்கூடிய நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் நீண்ட பெயரடைத் தொடர் ஆண்டவராகிய கடவுளை விளக்கும் வகையில் காக்கப்பட்டுள்ளது; [a] குறிப்பு அது சார்ந்த ‘வருகிறவர்’ என்பதற்குப் பின்பே வைக்கப்பட்டுள்ளது.
