reference: Revelation 1:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἀπὸ Ἰησοῦ Χριστοῦ, ὁ μάρτυς ὁ πιστός, ὁ πρωτότοκος τῶν νεκρῶν καὶ ὁ ἄρχων τῶν βασιλέων τῆς γῆς. Τῷ ἀγαπῶντι ἡμᾶς καὶ ⸀λύσαντι ἡμᾶς ⸀ἐκ τῶν ἁμαρτιῶν ἡμῶν ἐν τῷ αἵματι αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/005.yaml
  text: and from Jesus the Messiah[a], the faithful witness, the firstborn of the dead, and the ruler of the kings of the earth[b]. To him who loves us and freed us from our sins by his blood—
translation:
  language: ta
  text: மேலும், உண்மையுள்ள சாட்சியும், இறந்தோரிலிருந்து முதற்பேறானவரும், பூமியின் அரசர்களை ஆளுகிறவருமான மேசியாவாகிய இயேசுவிடமிருந்தும்[a]. நம்மை நேசிக்கிறவரும், தமது இரத்தத்தினால் நம்முடைய பாவங்களிலிருந்து நம்மை விடுவித்தவருமான[b] அவருக்கு—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இயேசு கிறிஸ்து.” கிரேக்கச் சொல் ஒரு பட்டம்; அதன் பொருள் “மேசியா,” அதாவது “அபிஷேகம் பெற்றவர்.”
    reason: lexical_alternative
  - marker: b
    text: சில கையெழுத்துப் பிரதிகள் “தமது இரத்தத்தில் நம்முடைய பாவங்களிலிருந்து நம்மைக் கழுவியவர்” என்று வாசிக்கின்றன.
    reason: textual_variant
lexical_decisions:
- source_word: Ἰησοῦ Χριστοῦ
  choice: மேசியாவாகிய இயேசு
  rationale: Χριστός இங்கு பெயரின் ஒரு பகுதிபோல அல்லாமல் பட்டமாகச் செயல்படுகிறது. ‘மேசியாவாகிய இயேசு’ என்பது அந்தப் பட்டத்தன்மையைத் தெளிவாகவும் இயல்பான தமிழிலும் காட்டுகிறது.
- source_word: ὁ μάρτυς ὁ πιστός
  choice: உண்மையுள்ள சாட்சி
  rationale: μάρτυς என்பது இங்கு சான்றளிப்பவரைக் குறிக்கிறது; உயிர்துறந்த தியாகி என்ற பின்னாளைய பொருளை அல்ல. πιστός என்பதன் நம்பகத்தன்மை மற்றும் நிலைத்த உண்மை ஆகிய நிழற்பொருள்களை ‘உண்மையுள்ள’ தக்கவைக்கிறது.
- source_word: ὁ πρωτότοκος τῶν νεκρῶν
  choice: இறந்தோரிலிருந்து முதற்பேறானவர்
  rationale: πρωτότοκος என்பதன் வேதாகம உருவகத்தையும், இறந்தோரிடமிருந்து உயிர்த்தெழுந்த முதன்மை மற்றும் மேன்மை என்ற கருத்தையும் அளவுக்கு மீறி விளக்காமல் தக்கவைக்கிறது.
- source_word: ὁ ἄρχων τῶν βασιλέων τῆς γῆς
  choice: பூமியின் அரசர்களை ஆளுகிறவர்
  rationale: அரசர்கள்மேல் அவருக்குள்ள அதிகாரத்தை நவீன தமிழில் தெளிவாகச் சொல்கிறது; γῆ இங்கு வெளிப்படுத்துதலின் உலகளாவிய சூழலில் ‘பூமி’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: Τῷ ἀγαπῶντι ἡμᾶς
  choice: நம்மை நேசிக்கிறவருமான அவருக்கு
  rationale: நிகழ்காலப் பங்கேற்புவினை காட்டும் தொடர்ச்சியான அன்பை இயல்பான தமிழ் நிகழ்கால வடிவம் வெளிப்படுத்துகிறது; தத்திவேற்றுமை அடுத்த வசனத்துக்குத் தொடரும் புகழுரையின் பெறுநராக ‘அவருக்கு’ என வைக்கப்படுகிறது.
- source_word: λύσαντι ἡμᾶς ἐκ τῶν ἁμαρτιῶν ἡμῶν
  choice: நம்முடைய பாவங்களிலிருந்து நம்மை விடுவித்தவர்
  rationale: λύω என்பதன் அவிழ்த்தல் அல்லது விடுதலை செய்தல் என்ற படிமத்தை ‘விடுவித்தார்’ இயல்பாகத் தருகிறது; ἐκ காட்டும் பிரிவை ‘பாவங்களிலிருந்து’ தக்கவைக்கிறது.
- source_word: ἐν τῷ αἵματι αὐτοῦ
  choice: தமது இரத்தத்தினால்
  rationale: ἐν இங்கு கருவிப்பொருளில் வருவதாகப் புரிந்துகொண்டு, விடுதலையின் வழிமுறையை ‘இரத்தத்தினால்’ தெளிவாகக் காட்டுகிறது. ‘தமது’ என்பது இயேசுவையே திரும்பச் சுட்டுகிறது.
theological_decisions:
- issue: ‘நம்மை நேசிக்கிறவர்’ என்பதற்குப் பின்வரும் பங்கேற்புவினையின் பாடவேறுபாடு
  choice: λύσαντι — ‘விடுவித்தவர்’
  alternative: λούσαντι — ‘கழுவியவர்’
  rationale: கொடுக்கப்பட்ட SBLGNT மூலப்பாடம் λύσαντι என்று வாசிக்கிறது. நன்கு அறியப்பட்ட λούσαντι பாடவேறுபாடு பொருளில் முக்கியமானதால், முதன்மைப் பாடம் பிரதான உரையில் வைக்கப்பட்டு மாற்றுப் பாடம் அடிக்குறிப்பில் பதிவு செய்யப்படுகிறது.
- issue: Χριστός என்ற கிறிஸ்தியல் பட்டத்தை மொழிபெயர்த்தல்
  choice: மேசியாவாகிய இயேசு
  alternative: இயேசு கிறிஸ்து
  rationale: Χριστός இங்கு பட்டமாக உள்ளதால் ‘மேசியா’ என்பதைத் தெளிவாகப் பட்டமாகக் காட்டும் தமிழ் அமைப்பு தேர்ந்தெடுக்கப்பட்டது; பாரம்பரிய ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: τῶν νεκρῶν என்பதன் தொடர்பு
  choice: இறந்தோரிலிருந்து
  alternative: இறந்தோரின்
  rationale: கிரேக்க இறந்தோரின் என்ற உருபமைப்பு உடைமை அல்லது குழு-தொடர்பைத் திறந்துவைக்கிறது; உயிர்த்தெழுதல் சூழலில் இயல்பான தமிழுக்காக ‘இறந்தோரிலிருந்து’ தேர்ந்தெடுக்கப்படுகிறது, அதேவேளையில் ‘முதற்பேறானவர்’ என்ற உருவகம் விளக்கவுரையாக மாற்றப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வேதாகமக் கண்ணியமும் கொண்ட எளிதில் புரியும் நடை பயன்படுத்தப்பட்டது. மூலத்தின் வாக்கியத் தொடர்ச்சி அடுத்த வசனத்துக்குச் செல்கிறது என்பதைக் காட்ட இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது. பட்டியலிலுள்ள கிறிஸ்தியல் அடைமொழிகள் தமிழ் இலக்கணத்திற்கேற்ப இயேசுவுக்கு முன்னால் ஒருங்கிணைக்கப்பட்டுள்ளன.
