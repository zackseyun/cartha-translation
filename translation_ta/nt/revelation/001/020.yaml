id: REV.1.20
reference: Revelation 1:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τὸ μυστήριον τῶν ἑπτὰ ἀστέρων ⸀οὓς εἶδες ἐπὶ τῆς δεξιᾶς μου, καὶ τὰς ἑπτὰ λυχνίας τὰς χρυσᾶς· οἱ ἑπτὰ ἀστέρες ἄγγελοι τῶν ἑπτὰ ἐκκλησιῶν εἰσίν, καὶ αἱ λυχνίαι αἱ ἑπτὰ ἑπτὰ ἐκκλησίαι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/020.yaml
  text: 'As for the mystery of the seven stars that you saw in my right hand[a], and the seven golden lampstands: the seven stars are the angels of the seven churches, and the seven lampstands are the seven churches.'
translation:
  language: ta
  text: 'என் வலக்கையில் நீ கண்ட ஏழு நட்சத்திரங்களையும் ஏழு பொன் விளக்குத்தண்டுகளையும் பற்றிய மறைபொருள் இதுதான்: அந்த ஏழு நட்சத்திரங்கள் ஏழு சபைகளின் தேவதூதர்கள்[a]; அந்த ஏழு விளக்குத்தண்டுகள் ஏழு சபைகள்.


    [a] அல்லது, “ஏழு சபைகளின் மனிதத் தூதர்கள்.” கிரேக்கச் சொல் தேவதூதர்களையோ மனிதத் தூதர்களையோ குறிக்கலாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏழு சபைகளின் மனிதத் தூதர்கள்.” கிரேக்கச் சொல் தேவதூதர்களையோ மனிதத் தூதர்களையோ குறிக்கலாம்.
    reason: ἄγγελοι என்பதன் தேவதூதர் / மனிதத் தூதர் என்ற உண்மையான சொற்பொருள் தெளிவின்மையைப் பாதுகாக்கிறது; ‘செய்தியாளர்கள்’ என்ற சொல்லின் நவீன ‘journalists’ பொருள்சாயலைத் தவிர்க்கிறது.
lexical_decisions:
- source_word: μυστήριον
  choice: மறைபொருள்
  rationale: தரிசனத்தில் காணப்பட்ட அடையாளங்களின் வெளிப்படுத்தப்படும் பொருளைக் குறிக்கிறது; வெறும் ‘குறியீட்டு விளக்கம்’ என்று தட்டையாக்காமல் மறைந்திருந்து வெளிப்படும் பொருள் என்ற வேதாகமத் தொனியைத் தக்கவைக்கிறது.
- source_word: ἀστέρων / ἀστέρες
  choice: நட்சத்திரங்கள்
  rationale: தரிசனக் காட்சியின் உருவகத்தை நேரடியாகத் தக்கவைக்கிறது; அதன் குறிப்பு அடுத்த வாக்கியத்தில் விளக்கப்படுகிறது.
- source_word: οὓς εἶδες
  choice: நீ கண்ட
  rationale: நட்சத்திரங்களை விவரிக்கும் தொடர்புச் சொல்லை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἐπὶ τῆς δεξιᾶς μου
  choice: என் வலக்கையில்
  rationale: உடனடி தரிசனச் சூழலில் நட்சத்திரங்கள் அவருடைய வலக்கையில் இருப்பதாகக் காட்டும் இயல்பான தமிழ் நடை.
- source_word: λυχνίας
  choice: விளக்குத்தண்டுகள்
  rationale: இச்சொல் விளக்குகளையே அல்ல, அவற்றைத் தாங்கும் தண்டுகளை அல்லது நிலைகளைச் சுட்டுவதால் காட்சியின் துல்லியத்தைப் பேணுகிறது.
- source_word: χρυσᾶς
  choice: பொன்
  rationale: பொன்னாலானவை என்ற பெயரடைப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἄγγελοι
  choice: தேவதூதர்கள்
  rationale: வெளிப்படுத்தல் நூலில் பரவலாகக் காணப்படும் விண்ணுலகத் தூதர் பொருளை முதன்மை உரையில் தருகிறது; மனிதச் செய்தியாளர் என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐκκλησιῶν / ἐκκλησίαι
  choice: திருச்சபைகள்
  rationale: வெளிப்படுத்தல் நூல் முகவரியிடும் கிறிஸ்தவ விசுவாசக் குழுக்களுக்கான இயல்பான, பரவலாகப் புரிந்துகொள்ளப்படும் தமிழ் சொல்.
- source_word: τὸ μυστήριον ... καὶ ...
  choice: '…பற்றிய மறைபொருள் இதுதான்:'
  rationale: கிரேக்கத்தில் முதலில் முன்வைக்கப்படும் பொருளையும் பின்னர் வரும் அடையாள விளக்கத்தையும் இயல்பான தமிழில் இணைக்கிறது.
theological_decisions:
- issue: ἄγγελοι τῶν ἑπτὰ ἐκκλησιῶν என்பதன் குறிப்பு
  choice: ஏழு திருச்சபைகளின் தேவதூதர்கள்
  alternative: ஏழு திருச்சபைகளின் செய்தியாளர்கள்
  rationale: ἄγγελος என்பது விண்ணுலகத் தேவதூதரையோ மனிதத் தூதர் அல்லது செய்தியாளரையோ குறிக்கலாம். வெளிப்படுத்தல் நூலில் விண்ணுலகப் பொருள் பொதுவாக இருப்பதால் அது முதன்மை உரையில் வைக்கப்படுகிறது; மூல உரை மனிதக் குறிப்பை முற்றிலும் விலக்காததால் அந்த மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவான வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தரிசன உருவகங்களான ‘நட்சத்திரங்கள்’, ‘விளக்குத்தண்டுகள்’ ஆகியவை தெளிவுபடுத்தி மாற்றப்படாமல் தக்கவைக்கப்பட்டுள்ளன.
