id: REV.1.2
reference: Revelation 1:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὃς ἐμαρτύρησεν τὸν λόγον τοῦ θεοῦ καὶ τὴν μαρτυρίαν Ἰησοῦ Χριστοῦ, ὅσα εἶδεν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/002.yaml
  text: who testified to the word of God and to the testimony of Jesus the Messiah[a], all that he saw.
translation:
  language: ta
  text: கடவுளின் வார்த்தைக்கும், மெசியாவாகிய இயேசுவின் சாட்சிக்கும்[a], தாம் கண்ட அனைத்திற்கும் இவர் சாட்சி அளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மெசியாவாகிய இயேசு அளித்த சாட்சி’ அல்லது ‘மெசியாவாகிய இயேசுவைப் பற்றிய சாட்சி.’ கிரேக்கச் சொற்றொடரை இருவகையிலும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμαρτύρησεν
  choice: சாட்சி கூறினார்
  rationale: μαρτυρέω என்பதன் சாட்சி அளித்தல் என்ற பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; அடுத்துவரும் μαρτυρία என்பதுடனான சொல் தொடர்பையும் காக்கிறது.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: கடவுளின் வார்த்தை
  rationale: λόγος இங்கு கடவுள் வெளிப்படுத்திய வார்த்தை அல்லது செய்தியைக் குறிக்கிறது. ‘கடவுளின் வார்த்தை’ என்பது பொருளைத் தெளிவாகவும் நிலைபெற்ற வேதாகமச் சொல்லாட்சியுடனும் தருகிறது.
- source_word: τὴν μαρτυρίαν
  choice: சாட்சி
  rationale: μαρτυρία என்பதன் சாட்சி அல்லது சான்றுரை என்ற பொருளைச் சுருக்கமாகத் தருவதோடு ἐμαρτύρησεν என்பதுடனான சொல்லியல் தொடர்பையும் பேணுகிறது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: மெசியாவாகிய இயேசு
  rationale: Χριστός இங்கு பட்டப்பெயரின் வலிமையைத் தக்கவைத்திருப்பதால் ‘மெசியா’ என்று மொழிபெயர்க்கப்படுகிறது; ‘மெசியாவாகிய இயேசு’ என்பது இயல்பான தமிழ்ச் சொற்றொடர்.
- source_word: ὅσα εἶδεν
  choice: தாம் கண்ட அனைத்தும்
  rationale: ὅσα என்பதிலுள்ள முழுமையான விரிவை ‘அனைத்தும்’ காக்கிறது; மரியாதைமிக்க ஒருமை எழுவாயைக் குறிக்க ‘தாம்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: τὴν μαρτυρίαν Ἰησοῦ Χριστοῦ என்பதிலுள்ள உரிமை வேற்றுமையின் இருபொருள் சாத்தியம்
  choice: மெசியாவாகிய இயேசுவின் சாட்சி
  alternative: மெசியாவாகிய இயேசு அளித்த சாட்சி; அல்லது மெசியாவாகிய இயேசுவைப் பற்றிய சாட்சி
  rationale: கிரேக்க உரை, இயேசு சாட்சியின் மூலமா அல்லது சாட்சியின் பொருளா என்பதைத் தீர்மானிக்கவில்லை. தமிழிலுள்ள உரிமை வேற்றுமை வடிவம் இந்த உண்மையான இருபொருள் சாத்தியத்தை முதன்மை உரையில் காக்கிறது; விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: Χριστοῦ என்பதைப் பட்டப்பெயராக மொழிபெயர்த்தல்
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இந்த இடத்தில் Χριστός பட்டப்பெயராகச் செயல்படுவதால் அதன் பொருளை வெளிப்படுத்தும் ‘மெசியா’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வழிபாட்டு வாசிப்புக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘சாட்சி கூறினார் / சாட்சி’ என்ற தொடர்பு மூலத்தின் வினை–பெயர்ச்சொல் உறவைப் பேணுகிறது; தொடர் வேற்றுமை அமைப்பு கிரேக்க வாக்கியத்தின் இணைப்பு மற்றும் இறுதிச் சுருக்கத்தை இயன்றவரை காக்கிறது.
