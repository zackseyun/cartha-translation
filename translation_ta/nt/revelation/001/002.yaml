    reason: alternative_reading
  revision_rationale: The revision improves idiomatic flow by using “சாட்சி அளித்தார்” for μαρτυρέω. Its dative complements naturally encompass God’s word, Jesus the Messiah’s testimony, and everything he saw. The possessive expression “மெசியாவாகிய இயேசுவின் சாட்சி” and its anchored footnote continue to preserve the Greek genitive’s ambiguity.
