revisions:
- from: இவர் கடவுளின் வார்த்தைக்கும் மெசியாவாகிய இயேசுவின் சாட்சிக்கும்[a], தாம் கண்ட அனைத்துக்கும் சாட்சி கூறினார்.
  to: கடவுளின் வார்த்தைக்கும், மெசியாவாகிய இயேசுவின் சாட்சிக்கும்[a], தாம் கண்ட அனைத்திற்கும் இவர் சாட்சி அளித்தார்.
  rationale: The revision improves idiomatic flow by using “சாட்சி அளித்தார்” for μαρτυρέω. Its dative complements naturally encompass God’s word, Jesus the Messiah’s testimony, and everything he saw. The possessive expression “மெசியாவாகிய இயேசுவின் சாட்சி” and its anchored footnote continue to preserve the Greek genitive’s ambiguity.
