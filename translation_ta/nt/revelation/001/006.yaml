id: REV.1.6
reference: Revelation 1:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐποίησεν ἡμᾶς βασιλείαν, ἱερεῖς τῷ θεῷ καὶ πατρὶ αὐτοῦ— αὐτῷ ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας ⸂τῶν αἰώνων⸃· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/006.yaml
  text: and made us a kingdom[a], priests to his God and Father—to him be the glory and the dominion forever and ever[b]. Amen.
translation:
  language: ta
  text: நம்மை ஓர் அரசாகவும்[a], அவருடைய கடவுளும் தந்தையுமானவருக்கு ஆசாரியர்களாகவும் ஆக்கினார்—அவருக்கே மகிமையும் ஆட்சிவல்லமையும் என்றென்றும் உரியவை[b]. ஆமென்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில பிற்காலக் கையெழுத்துப் பிரதிகளில், ‘ஓர் அரசு, ஆசாரியர்கள்’ என்பதற்குப் பதிலாக, ‘அரசர்களும் ஆசாரியர்களும்’ என்று வாசிக்கப்படுகிறது. முதன்மை உரை இங்கு வழங்கப்பட்ட கிரேக்க வாசிப்பைப் பின்பற்றுகிறது.
    reason: textual_variant
  - marker: b
    text: இன்னும் சொற்சொல்லாக, ‘யுகங்களின் யுகங்கள்வரை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: ஆக்கினார்
  rationale: இறந்தகால வினையாக உள்ள கிரேக்கச் சொல்லை இயல்பான தமிழ் இறந்தகாலத்தில் தருகிறது; தொடர்ந்த விளைவை வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: βασιλείαν
  choice: ஓர் அரசு
  rationale: இது பன்மை ‘அரசர்கள்’ என்பதல்ல; மீட்கப்பட்டவர்களின் கூட்டு அரசுசார் அடையாளத்தைக் குறிக்கும் ஒருமைப் பெயர்ச்சொல். ‘அரசாட்சி’ என்ற பொருளையும் தாங்கும் வகையில் ‘அரசு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἱερεῖς
  choice: ஆசாரியர்கள்
  rationale: உடன்படிக்கை மற்றும் வழிபாட்டுப் பணியுடன் தொடர்புடைய அடையாளத்தை நேரடியாகப் பாதுகாக்கும், தமிழ் வேதாகம நடையில் புரிந்துகொள்ளத்தக்க சொல்.
- source_word: τῷ θεῷ καὶ πατρὶ αὐτοῦ
  choice: அவருடைய கடவுளும் தந்தையுமானவருக்கு
  rationale: ‘அவருடைய’ என்பது கடவுள், தந்தை ஆகிய இரண்டுடனும் தொடர்புடையதாக இருப்பதையும், ஆசாரியர்கள் அவருக்குரியவர்கள் என்பதையும் கிரேக்க தத்துவத்தின் வலிமையை மென்மைப்படுத்தாமல் தருகிறது.
- source_word: αὐτῷ
  choice: அவருக்கே
  rationale: புகழுரையின் திசையைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது; ‘-ஏ’ வலியுறுத்தல் கிரேக்க இடப்பொருள் வேற்றுமையின் புகழுரைச் செயல்பாட்டைத் தமிழில் பிரதிபலிக்கிறது.
- source_word: δόξα
  choice: மகிமை
  rationale: புகழுரைச் சூழலில் நிலைபெற்ற, இயல்பான தமிழ் இணைச்சொல்.
- source_word: κράτος
  choice: ஆட்சிவல்லமை
  rationale: வெறும் பொதுவான ‘வல்லமை’யை விட, இறையாண்மையுடன் செயல்படும் ஆளும் வல்லமையை வெளிப்படுத்துகிறது.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: என்றென்றும்
  rationale: முடிவற்ற காலத்தைக் குறிக்கும் கிரேக்க மரபுத்தொடரின் இயல்பான நவீனத் தமிழ் வடிவம்; சொற்சொல்லான வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἀμήν
  choice: ஆமென்
  rationale: வழிபாட்டு உறுதிப்பாடாக நிலைபெற்ற ஒலிபெயர்ப்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘அவருடைய கடவுளும் தந்தையும்’ என்பதன் சுட்டுப்பொருள்
  choice: சூழலில் ‘அவருடைய’ என்பது இயேசு மெசியாவைக் குறிக்கிறது; எனவே அவர் நம்மை அவருடைய கடவுளும் தந்தையுமானவருக்கு ஆசாரியர்களாக ஆக்கினார்.
  alternative: ‘தந்தையாகிய கடவுளுக்கு’ என்று உறவைப் பொதுமைப்படுத்துதல்.
  rationale: அருகிலுள்ள முன்சுட்டு இயேசு மெசியாவே. ஆட்களின் உறவுவேறுபாட்டைக் கோட்பாட்டுரீதியாகச் சீராக்காமல், கிரேக்கத்தின் கிறிஸ்துவியல் பதற்றத்தை மொழிபெயர்ப்பு அப்படியே பாதுகாக்கிறது.
- issue: சமூகத்தின் அரசுசார் நிலை
  choice: ‘ஓர் அரசு, ஆசாரியர்கள்’ என்ற வாசிப்பைப் பாதுகாத்தல்.
  alternative: ‘அரசர்களும் ஆசாரியர்களும்’ என்று மொழிபெயர்த்தல்.
  rationale: வழங்கப்பட்ட SBLGNT உரையில் βασιλείαν (‘அரசு’) என்ற ஒருமைப் பெயர்ச்சொல் உள்ளது; ‘அரசர்கள்’ என்பது பிற்காலச் சுவடிகளின் வேறுபட்ட வாசிப்பு. ஆகவே முதன்மை உரை சமூகத்தின் கூட்டான அடையாளத்தை வெளிப்படுத்துகிறது.
translation_notes:
  register: 'நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான புகழுரை நடை பயன்படுத்தப்பட்டுள்ளது. ‘அரசர்களும் ஆசாரியர்களும்’ என்ற பழக்கமான பிற்கால வாசிப்பு முதன்மை உரைக்குள் கொண்டுவரப்படவில்லை. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு உள்ளடக்கங்களுக்கும் குறியீடுகள் நிற்கும் இடங்களுக்கும் இடையே இருந்த மாற்றம் சரிசெய்யப்பட்டுள்ளது: [a] உரைவேறுபாட்டையும் [b] சொற்சொல்லான காலமரபுத் தொடரையும் குறிக்கின்றன.'
