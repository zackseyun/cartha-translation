id: REV.1.18
reference: Revelation 1:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὁ ζῶν— καὶ ἐγενόμην νεκρὸς καὶ ἰδοὺ ζῶν εἰμι εἰς τοὺς αἰῶνας τῶν ⸀αἰώνων— καὶ ἔχω τὰς κλεῖς τοῦ θανάτου καὶ τοῦ ᾅδου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/018.yaml
  text: and the Living One—I became dead[a], and behold[c][b], I am alive forever and ever—and I have the keys of death and of Hades.
translation:
  language: ta
  text: உயிருள்ளவரும் நானே—நான் மரணமடைந்தேன்[a]; இதோ, என்றென்றும் உயிருடன் இருக்கிறேன்[b]—மரணத்திற்கும் பாதாளத்திற்கும் உரிய சாவிகள் என்னிடம் உள்ளன[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல், ‘நான் இறந்தவனானேன்’ எனலாம்; கிரேக்கத்தில் ‘இறந்தவனாக ஆனேன்’ என்ற கருத்து இருந்து, மரணத்திற்குள் நிகழ்ந்த மாற்றத்தை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘காலங்களின் காலங்களுக்கும்’; இது முடிவில்லாத காலத்தைக் குறிக்கும் ஒரு மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: c
    text: ‘பாதாளம்’ என்பது இறந்தோரின் உலகத்தைக் குறிக்கிறது; இறுதித் தண்டனைக்குரிய நரகத்தை மட்டும் குறிப்பதல்ல.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ζῶν
  choice: உயிருள்ளவர்
  rationale: குறிப்பிட்ட ஒருவரைக் குறிக்கும் பெயர்ச்சொல் தன்மையுள்ள நிகழ்காலப் பங்கேற்புவினை; பட்டப்பெயரின் வலிமையையும் தெய்வீகத் தன்னறிவிப்பின் எதிரொலியையும் காக்கிறது.
- source_word: ἐγενόμην νεκρός
  choice: நான் இறந்தவனானேன்
  rationale: வெறுமனே ‘இறந்திருந்தேன்’ என்ற நிலையைக் காட்டாமல், மரணத்திற்குள் நிகழ்ந்த மாற்றத்தை γίνομαι வினை உணர்த்துவதால் அதைப் பாதுகாக்கிறது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் கிரேக்க இடைச்சொல்லின் உயிரோட்டத்தையும் வெளிப்படுத்தல் நூலுக்கேற்ற கண்ணியமான நடையையும் காக்கிறது.
- source_word: ζῶν εἰμι
  choice: உயிருடன் இருக்கிறேன்
  rationale: தற்போதைய உயிர்நிலையை இயல்பான தமிழில் கூறி, முந்தைய மரணத்துடன் உள்ள முரண்பாட்டைத் தெளிவாக்குகிறது.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: என்றென்றும்
  rationale: முடிவில்லாத காலத்தை உணர்த்தும் கிரேக்க மரபுத்தொடருக்கான இயல்பான, வலியுறுத்தலுள்ள நவீனத் தமிழ் இணை.
- source_word: κλεῖς
  choice: சாவிகள்
  rationale: நேரடியான சொற்பொருளைத் தருகிறது; சூழலில் அதிகாரத்தையும் கட்டுப்பாட்டையும் குறிக்கும் உருவகத்தை அப்படியே வைத்திருக்கிறது.
- source_word: τοῦ θανάτου
  choice: மரணத்திற்கு உரிய
  rationale: ‘சாவிகள்’ என்பதுடன் உள்ள உடைமை/தொடர்பு வேற்றுமையை இயல்பான தமிழில் வெளிப்படுத்தி, மரணத்தைத் தனிப்பட்ட ஆளாகத் தவறாக நிர்ணயிப்பதைத் தவிர்க்கிறது.
- source_word: τοῦ ᾅδου
  choice: பாதாளத்திற்கு உரிய
  rationale: இறுதி தண்டனைக்கான நரகத்தோடும் வெறும் கல்லறையோடும் ஒன்றாக்காமல், இறந்தோரின் உலகம் என்ற கருத்தைத் தக்கவைக்கும் வழக்கமான வேதாகமத் தமிழ் சொல்.
theological_decisions:
- issue: இறுதிக்காலச் சூழலில் ᾅδης என்பதன் மொழிபெயர்ப்பு
  choice: பாதாளம்
  alternative: கல்லறை / இறந்தோரின் உலகம் / நரகம்
  rationale: மரணத்தையும் ᾅδης-ஐயும் தொடர்புடைய ஆனால் ஒரே பொருளல்லாத இரு மெய்மைகளாக வசனம் குறிப்பிடுகிறது. ‘பாதாளம்’ என்பது இதை வெறும் புதைகுழையாகக் குறுக்காமலும் இறுதி தண்டனையான நரகமாகத் தீர்மானிக்காமலும் மூலத்தின் கருத்துவேறுபாட்டைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான வெளிப்படுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘உயிருள்ளவர்’ என்ற பட்டப்பெயர் காக்கப்பட்டுள்ளது; ‘இறந்தவனானேன்’ என்பது சற்றே உயர்ந்த நடையாக இருந்தாலும் மூலத்தின் மாற்றநிலைக் குறிப்பைத் துல்லியமாகப் பாதுகாக்கிறது. வாசிப்பின் இயல்புக்காக இரண்டாம் வாக்கியத்தில் ‘ஆனால்’ சேர்க்கப்பட்டுள்ளது; இது மரணத்துக்கும் இப்போதைய முடிவில்லா உயிருக்கும் இடையிலான வெளிப்படையான எதிர்மறைத் தொடர்பை மொழியில் வெளிக்கொணர்கிறது.
