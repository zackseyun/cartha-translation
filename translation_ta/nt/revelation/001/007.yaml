  terminology: ‘மேகங்களோடு,’ ‘குத்தியவர்கள்,’ ‘குலங்கள்,’ மற்றும் ‘ஆமென்’ ஆகிய சொற்கள் மூலத்தின் உருவக, இடைஉரை, மற்றும் வழிபாட்டு ஒலியைப் பாதுகாக்கின்றன. γῆ என்பதற்கு முதன்மை உரையில் ‘பூமி’ என்றும், சகரியா எதிரொலியை முன்னிட்டு ‘நாடு’ என்ற மாற்றுச் சாத்தியம் அடிக்குறிப்பிலும் தரப்பட்டுள்ளது; இது உரையில் உள்ள தெளிவின்மையைச் சரியாகப் பாதுகாக்கிறது.
