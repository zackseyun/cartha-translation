id: REV.1.7
reference: Revelation 1:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἰδοὺ ἔρχεται μετὰ τῶν νεφελῶν, καὶ ὄψεται αὐτὸν πᾶς ὀφθαλμὸς καὶ οἵτινες αὐτὸν ἐξεκέντησαν, καὶ κόψονται ἐπ’ αὐτὸν πᾶσαι αἱ φυλαὶ τῆς γῆς. ναί, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/007.yaml
  text: Look[a], he is coming with the clouds, and every eye will see him, even those who pierced him, and all the tribes of the earth will mourn over him. Yes, amen.
translation:
  language: ta
  text: இதோ, அவர் மேகங்களோடு வருகிறார். ஒவ்வொரு கண்ணும் அவரைக் காணும்; அவரைக் குத்தியவர்களும் காண்பார்கள். பூமியின்[a] எல்லாக் குலங்களும் அவரைக் குறித்துப் புலம்புவார்கள். ஆம், ஆமென்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாட்டின் எல்லாக் குலங்களும் அவரைக் குறித்துப் புலம்புவார்கள்.” இச்சொற்றொடர் சகரியா 12:10–12-ஐ எதிரொலிக்கலாம்; அங்கே “நாடு” என்பது சூழலுக்கேற்ற பொருளாக இருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: கவனத்தைத் தெளிவாகவும் உயிரோட்டமாகவும் ஈர்க்கும் கிரேக்க அழைப்பை, நவீனத் தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் தருகிறது.
- source_word: ἔρχεται
  choice: வருகிறார்
  rationale: எதிர்காலத்தை உயிரோட்டமாக முன்வைக்கும் கிரேக்க நிகழ்காலத்தைத் தமிழ் நிகழ்கால வடிவில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: μετὰ τῶν νεφελῶν
  choice: மேகங்களோடு
  rationale: தானியேல் 7:13-ஐ நினைவூட்டும் மேக உருவகத்தையும் μετά என்பதன் உடனிருப்பு பொருளையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: πᾶς ὀφθαλμὸς
  choice: ஒவ்வொரு கண்ணும்
  rationale: ‘எல்லாரும்’ என்று பொதுமைப்படுத்தாமல், கிரேக்கத்தின் பகிர்வுநிலை கொண்ட கண் உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: οἵτινες αὐτὸν ἐξεκέντησαν
  choice: அவரைக் குத்தியவர்களும்
  rationale: குறிப்பிட்ட ஒரு குழுவைச் சுட்டும் உறவுத்தொடரையும், சகரியா 12:10 மற்றும் யோவான் 19:37 உடனான ‘குத்துதல்’ தொடர்பையும் பாதுகாக்கிறது.
- source_word: κόψονται
  choice: புலம்புவார்கள்
  rationale: துக்கத்தில் மாரடித்தல் போன்ற ஒரு குறிப்பிட்ட உடல் செயலைத் தேவையின்றிச் சேர்க்காமல், துயருறுதல் மற்றும் ஒப்பாரியிடுதல் ஆகிய பொருள் வரம்பை இயல்பாகத் தருகிறது.
- source_word: ἐπ’ αὐτὸν
  choice: அவரைக் குறித்து
  rationale: ‘அவருக்காக’ அல்லது ‘அவரால்’ என்று காரணத்தையோ மனநிலையையோ மிகத் தெளிவாக நிர்ணயிக்காமல், அவரே புலம்பலின் மையம் என்பதைப் பாதுகாக்கிறது.
- source_word: πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: பூமியின் எல்லாக் குலங்களும்
  rationale: φυλαί என்பதன் ‘குலங்கள்’ என்ற குறிப்பான பொருளையும், இவ்வசனத்தின் உலகளாவிய தொனிக்கு ஏற்ற γῆ என்பதன் ‘பூமி’ பொருளையும் பிரதான உரையில் தருகிறது; ‘நாடு’ என்ற சாத்தியம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: ναί, ἀμήν
  choice: ஆம், ஆமென்
  rationale: இரட்டை உறுதிப்பாட்டையும் ‘ஆமென்’ என்பதன் வழிபாட்டு மற்றும் உரைநடை நிறையையும் பாதுகாக்கிறது.
theological_decisions:
- issue: πᾶσαι αἱ φυλαὶ τῆς γῆς என்பதில் τῆς γῆς குறிக்கும் பரப்பு
  choice: பிரதான உரையில் ‘பூமியின் எல்லாக் குலங்களும்’
  alternative: ‘நாட்டின் எல்லாக் குலங்களும்’
  rationale: ‘ஒவ்வொரு கண்ணும்’ காணும் வருகையும் தானியேல் சார்ந்த உலகளாவிய காட்சியும் ‘பூமி’ என்பதை ஆதரிக்கின்றன. ஆனால் சகரியா 12:10–12-ன் எதிரொலியில் ‘நாடு’ என்பதும் சூழலுக்கேற்ற சாத்தியம்; ஆகவே அந்தத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் மரியாதைமிக்க வெளிப்பாடு பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’, ‘ஒவ்வொரு கண்ணும்’, ‘ஆமென்’ ஆகியவை மூலத்தின் உயிரோட்டம், உருவகம், வழிபாட்டு நிறை ஆகியவற்றைத் தக்கவைக்கின்றன.
