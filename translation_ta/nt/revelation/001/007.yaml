  source_fidelity: மூல கிரேக்கத்தின் வலியுறுத்தும் அழைப்பு (Ἰδού), உயிரோட்டமான நிகழ்கால வருகை, ‘ஒவ்வொரு கண்ணும்’ என்ற பகிர்வுநிலை உருவகம், அவரைக் குத்தியவர்களைச் சேர்த்துக் கூறுதல், புலம்பல், மற்றும் இரட்டை உறுதிப்பாடு ஆகியவை நம்பகமாகத் தரப்பட்டுள்ளன. ‘அவரைக் குத்தியவர்களும் காண்பார்கள்’ என்பது கிரேக்கத்தில் முதல் வினையுடன் இணைந்துள்ள சுருக்கமான உறவுத்தொடரைத் தமிழில் தெளிவாக வெளிப்படுத்தும் ஏற்ற விரிவாக்கமாகும்.
