source:
  edition: SBLGNT
  text: καὶ ἔχων ἐν τῇ δεξιᾷ ⸂χειρὶ αὐτοῦ⸃ ἀστέρας ἑπτά, καὶ ἐκ τοῦ στόματος αὐτοῦ ῥομφαία δίστομος ὀξεῖα ἐκπορευομένη, καὶ ἡ ὄψις αὐτοῦ ὡς ὁ ἥλιος φαίνει ἐν τῇ δυνάμει αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/016.yaml
  text: And he had seven stars in his right hand[a], and from his mouth came a sharp two-edged sword[b], and his appearance was like the sun shining in its strength.
translation:
  language: ta
  text: அவர் தமது வலக்கையில் ஏழு நட்சத்திரங்களை வைத்திருந்தார். அவரது வாயிலிருந்து இரு விளிம்புகளும் கூர்மையான ஒரு வாள்[a] வெளிவந்துகொண்டிருந்தது. அவரது தோற்றம் அதன் முழு வலிமையில் ஒளிவீசும் சூரியனைப் போல இருந்தது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கூர்மையான இரு விளிம்புகள் கொண்ட வாள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “தன் முழு வலிமையில் ஒளிவீசும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχων
  choice: வைத்திருந்தார்
  rationale: சுற்றியுள்ள தரிசன வருணனையோடு இணைந்துள்ள நிகழ்காலப் பங்கேற்புவினையின் தொடர்ந்த நிலையை இயல்பான தமிழில் தெரிவிக்கிறது; ‘பிடித்திருந்தார்’ என்று மூலத்தைவிடக் குறுக்காமல், கையில் இருந்ததைச் சொல்கிறது.
- source_word: ἐν τῇ δεξιᾷ χειρὶ αὐτοῦ
  choice: தமது வலக்கையில்
  rationale: கிரேக்கத்தில் வெளிப்படையாக உள்ள ‘கை’ என்பதைக் காத்து, எழுவாயைக் குறிக்கும் மரியாதைத் தற்சுட்டான ‘தமது’ என்பதை இயல்பான தமிழுக்காகப் பயன்படுத்துகிறது.
- source_word: ἀστέρας ἑπτά
  choice: ஏழு நட்சத்திரங்களை
  rationale: எண்ணையும் பெயர்ச்சொல்லையும் தமிழின் இயல்பான வரிசையில் நேரடியாக வழங்குகிறது.
- source_word: ῥομφαία
  choice: வாள்
  rationale: இச்சொல் பெரிய வாளைக் குறிக்கக்கூடியதாயினும், காட்சிப் படிமத்தை மிகையாகக் குறிப்பாக்காமல் பொதுவாகவும் தெளிவாகவும் புரியும் தமிழ்ச் சொல்லைத் தேர்ந்தெடுக்கிறது.
- source_word: δίστομος ὀξεῖα
  choice: இருபுறமும் கூர்மையான
  rationale: சொல்லளவில் ‘இரு வாயுள்ள’ என்ற உருவகத்தை வாளுக்குரிய தமிழ்ப் பயன்பாட்டில் ‘இருபுறமும் கூர்மையான’ என்று இயல்பாக வெளிப்படுத்தி, இரு விளிம்புகளையும் கூர்மையையும் காக்கிறது.
- source_word: ἐκπορευομένη
  choice: வெளிவந்துகொண்டிருந்தது
  rationale: வாயிலிருந்து வாள் தொடர்ந்து புறப்பட்டுவரும் தரிசனக் காட்சியை, தொடர்நிலையை இழக்காமல் இயல்பான தமிழில் வழங்குகிறது.
- source_word: ἡ ὄψις αὐτοῦ
  choice: அவரது தோற்றம்
  rationale: ὄψις முகத்தை மட்டும் அல்லாமல் காணப்படும் மொத்தத் தோற்றத்தையும் குறிக்க முடிவதால், பொருளைச் சுருக்காத ‘தோற்றம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: ὡς ὁ ἥλιος φαίνει
  choice: ஒளிவீசும் சூரியனைப் போல
  rationale: நிகழ்கால ஒளிர்வையும் ஒப்புமையையும் தெளிவான, இயல்பான தமிழில் காக்கிறது.
- source_word: ἐν τῇ δυνάμει αὐτοῦ
  choice: தன் வலிமையோடு
  rationale: சூரியனின் ஒளியின் ஆற்றல் அல்லது தீவிரத்தைக் குறிக்கும் கிரேக்கத்தை நெருக்கமாகக் காக்கிறது; ‘முழு வலிமையோடு’ என்ற விளக்கமான வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: வாயிலிருந்து வெளிவரும் வாளின் தரிசனப் படிமம்
  choice: அதன் பொருளை விளக்கிச் சேர்க்காமல், தரிசன உருவகத்தை அப்படியே வைத்தல்
  alternative: அந்த வாளை கிறிஸ்துவின் நியாயத்தீர்ப்பு அளிக்கும் வார்த்தை அல்லது தேவவார்த்தை என்று உரையிலேயே வெளிப்படையாக அடையாளப்படுத்துதல்
  rationale: இவ்வசனம் அடையாளப் பொருள் கொண்ட வெளிப்படுத்தல் காட்சியை மட்டுமே முன்வைக்கிறது. பிற வேதாகமப் பகுதிகள் அதன் விளக்கத்துக்கு உதவினாலும், அந்த விளக்கத்தை மொழிபெயர்ப்பின் முதன்மை உரைக்குள் சேர்ப்பது வசனத்தின் திட்டமிட்ட உருவகத் தன்மையைத் தீர்த்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குத் தெளிவாகவும் வெளிப்படுத்தல் நூலின் கண்ணியமான தரிசன நடையைத் தக்கவைத்தும் வடிவமைக்கப்பட்டது. நீண்ட கிரேக்க ஒருங்கிணைப்பை மூன்று தமிழ் வாக்கியங்களாகப் பிரித்தது வாசிப்பை எளிதாக்குகிறது; காட்சிகளின் வரிசையும் தொடர்பும் மாறவில்லை.
