id: REV.4.11
reference: Revelation 4:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἄξιος εἶ, ὁ κύριος καὶ ὁ θεὸς ⸀ἡμῶν, λαβεῖν τὴν δόξαν καὶ τὴν τιμὴν καὶ τὴν δύναμιν, ὅτι σὺ ἔκτισας ⸀τὰ πάντα, καὶ διὰ τὸ θέλημά σου ἦσαν καὶ ἐκτίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/011.yaml
  text: You are worthy[a], our Lord and God, to receive the glory and the honor and the power, because you created all things[b], and by your will they existed and were created.
translation:
  language: ta
  text: '“எங்கள் ஆண்டவரும் கடவுளுமானவரே,

    மகிமையையும் மாண்பையும் வல்லமையையும்

    பெறத் தகுதியுள்ளவர் நீரே[a].

    ஏனெனில், நீரே எல்லாவற்றையும் படைத்தீர்;

    உமது திருவுளத்தின் காரணமாகவே[b]

    அவை இருந்தன, படைக்கப்பட்டன.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தகுதியுள்ளவர் நீர்.” கிரேக்கத்தில் “தகுதியுள்ளவர்” என்பது முதலில் வந்து வலியுறுத்தப்படுகிறது; தமிழில் அந்த வலியுறுத்தல் “நீரே” என்பதால் காட்டப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உமது திருவுளத்தினாலே.” διὰ τὸ θέλημά σου என்ற கிரேக்கச் சொற்றொடர் முதன்மையாகக் காரணத்தை (“திருவுளத்தின் காரணமாக”) குறிக்கலாம்; கருவி அல்லது வழிமுறையை (“திருவுளத்தினால்”) குறிக்கும் நுட்பமும் சாத்தியம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄξιος εἶ
  choice: தகுதியுள்ளவர் நீரே
  rationale: தகுதியைச் சுட்டும் ἄξιος என்பதையும் நேரடி அழைப்பையும் இயல்பான தமிழில் தருகிறது. இறுதியில் வரும் ‘நீரே’ கிரேக்கத்தில் முதலில் வைக்கப்பட்டுள்ள சொல்லின் வலியுறுத்தலைத் தமிழுக்கேற்ற முறையில் பாதுகாக்கிறது.
- source_word: ὁ κύριος καὶ ὁ θεὸς ἡμῶν
  choice: எங்கள் ஆண்டவரும் கடவுளுமானவரே
  rationale: இச்சூழலில் உருபுடன் வரும் இரு பெயர்களும் நேரடி அழைப்பாகச் செயல்படுகின்றன. ‘எங்கள்’ என்பது ἡμῶν என்பதைக் இரு பட்டங்களுடனும் இயல்பாக இணைக்கிறது.
- source_word: λαβεῖν
  choice: பெற
  rationale: வழிபாட்டில் கடவுளுக்கு உரியவை அளிக்கப்படுவதை ‘பெற’ தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: τὴν δόξαν καὶ τὴν τιμὴν καὶ τὴν δύναμιν
  choice: மகிமையையும் மாண்பையும் வல்லமையையும்
  rationale: மூன்று தனித்த கூறுகளையும் மீளும் இணைப்புகளுடன் காத்து, உயர்ந்த ஆனால் இன்றைய வாசகர்களுக்குப் புரியும் வழிபாட்டு நடையை அளிக்கிறது. τιμή என்பதற்கு ‘மாண்பு’ என்பது இங்கு செலுத்தப்படும் கௌரவத்தைச் சுட்டுகிறது.
- source_word: ὅτι σὺ ἔκτισας τὰ πάντα
  choice: ஏனெனில், நீரே எல்லாவற்றையும் படைத்தீர்
  rationale: ὅτι என்பதன் காரணப் பொருளையும் σὺ என்பதன் வெளிப்படையான வலியுறுத்தலையும் ‘நீரே’ மூலம் காக்கிறது; τὰ πάντα என்பதன் முழுமையான பரப்பை ‘எல்லாவற்றையும்’ தெரிவிக்கிறது.
- source_word: διὰ τὸ θέλημά σου
  choice: உமது திருவுளத்தின் காரணமாகவே
  rationale: διά + accusative இங்கு முதன்மையாகக் காரணத்தைக் குறிக்கிறது. ‘காரணமாகவே’ அந்தப் பொருளைத் தெளிவாக்குகிறது; ‘திருவுளம்’ கடவுளின் θέλημα என்பதற்கான இயல்பான, கண்ணியமான தமிழ்.
- source_word: ἦσαν καὶ ἐκτίσθησαν
  choice: அவை இருந்தன, படைக்கப்பட்டன
  rationale: இருத்தலைக் குறிக்கும் ἦσαν என்பதையும் படைப்புச் செயலைக் குறிக்கும் ἐκτίσθησαν என்பதையும் ஒன்றாகக் கலக்காமல் தனித்தனியே காக்கிறது. கிரேக்கத்தின் சிந்தனைத் திணறலை விளக்கிச் சீராக்காமல் அப்படியே விடுகிறது.
theological_decisions:
- issue: கடவுளுக்கான இரட்டைப் பட்டங்களின் அழைப்பு அமைப்பு
  choice: எங்கள் ஆண்டவரும் கடவுளுமானவரே
  alternative: ஆண்டவரே, எங்கள் கடவுளே
  rationale: மூலத்தில் உள்ள κύριος மற்றும் θεός ஆகிய இரு பட்டங்களையும் ஒரே நபருக்கான நேரடி அழைப்பாகக் காத்து, உரையில் இல்லாத கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
- issue: διὰ τὸ θέλημά σου என்பதில் திருவுளத்துக்கும் படைப்புக்கும் உள்ள தொடர்பு
  choice: உமது திருவுளத்தின் காரணமாகவே
  alternative: உமது திருவுளத்தினாலே
  rationale: διά + accusative என்பதன் வழக்கமான காரணப் பொருளுக்கு முன்னுரிமை தரப்படுகிறது. கருவி அல்லது வழிமுறைப் பொருளும் சாத்தியமுள்ளதால் அது அடிக்குறிப்பில் தரப்படுகிறது; படைப்பின் மேற்பொருளியல் குறித்து வசனம் கூறுவதைவிட அதிகமாக முடிவு செய்யப்படவில்லை.
- issue: ἦσαν καὶ ἐκτίσθησαν என்ற இரு வினைகளின் உறவு
  choice: அவை இருந்தன, படைக்கப்பட்டன
  alternative: அவை தோன்றின, படைக்கப்பட்டன
  rationale: ‘இருந்தன’ மற்றும் ‘படைக்கப்பட்டன’ என்ற இரு கூறுகளையும் அப்படியே வைத்திருப்பது, அவற்றுக்கிடையிலான கால அல்லது தர்க்க உறவை மொழிபெயர்ப்பே தீர்மானிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான வழிபாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. ‘நீர்/உமது’ என்ற மரியாதை ஒருமை நேரடி அழைப்பைத் தக்கவைக்கிறது. கவிதைநடை வரிப்பிரிப்பு கிரேக்கப் புகழுரையின் மும்மை ஒலியையும் காரணவாக்கியத்தின் நகர்வையும் வெளிப்படுத்துகிறது.
