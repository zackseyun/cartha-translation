id: REV.4.7
reference: Revelation 4:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ τὸ ζῷον τὸ πρῶτον ὅμοιον λέοντι, καὶ τὸ δεύτερον ζῷον ὅμοιον μόσχῳ, καὶ τὸ τρίτον ζῷον ⸀ἔχων ⸂τὸ πρόσωπον ὡς⸃ ἀνθρώπου, καὶ τὸ τέταρτον ζῷον ὅμοιον ἀετῷ πετομένῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/007.yaml
  text: And the first living creature was like a lion, and the second living creature like a calf, and the third living creature had a face like a man, and the fourth living creature was like an eagle in flight.
translation:
  language: ta
  text: முதலாம் உயிரினம் சிங்கத்தைப் போலவும், இரண்டாம் உயிரினம் கன்றைப் போலவும் இருந்தது. மூன்றாம் உயிரினத்துக்கு ஒரு மனிதனைப் போன்ற முகம்[a] இருந்தது. நான்காம் உயிரினம் பறக்கும் கழுகைப் போல இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனித முகம்.” கிரேக்கத்தில் சொல்லுக்கு சொல், “ஒரு மனிதனைப் போன்ற முகம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ζῷον
  choice: உயிரினம்
  rationale: அரியணையைச் சூழ்ந்துள்ள இந்த உயிருள்ள படைப்புகளை இயல்பான நவீன தமிழில் குறிக்கிறது; வெளிப்படுத்தலில் பின்னர் வரும் பகைமைமிக்க θηρίον என்பதற்குப் பயன்படுத்தக்கூடிய ‘மிருகம்’ என்ற சொல்லிலிருந்தும் இவற்றை வேறுபடுத்துகிறது.
- source_word: ὅμοιον
  choice: போல / போன்ற
  rationale: அடையாள ஒற்றுமையைக் கூறாமல், உருவ ஒப்புமையைக் காக்கிறது. தமிழின் இயல்பான வாக்கிய அமைப்புக்கேற்ப ‘போல’ என்றும் முகத்தை விவரிக்க ‘போன்ற’ என்றும் வழங்கப்பட்டுள்ளது.
- source_word: λέοντι
  choice: சிங்கம்
  rationale: விலங்கின் பெயரை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: μόσχῳ
  choice: கன்று
  rationale: μόσχος இங்கு இளம் மாட்டினத்தைக் குறிக்கக்கூடும்; ‘கன்று’ என்பது பாலினத்தையோ பலியிடும் பயன்பாட்டையோ தேவையின்றி குறிப்பாக்காமல் மூலத்தின் பொருளைக் காக்கிறது.
- source_word: ἔχων
  choice: இருந்தது
  rationale: கிரேக்கப் பெயரெச்சத் தொடரின் விளக்கத் தன்மையை, தமிழில் இயல்பான உடைமை அமைப்பான ‘உயிரினத்துக்கு ... முகம் இருந்தது’ என்று வழங்குகிறது.
- source_word: τὸ πρόσωπον ὡς ἀνθρώπου
  choice: ஒரு மனிதனைப் போன்ற முகம்
  rationale: πρόσωπον என்பதன் ‘முகம்’ என்ற பொருளையும், ὡς குறிக்கும் ஒப்புமையையும் வெளிப்படையாகப் பாதுகாக்கிறது. ἄνθρωπος இங்கு மனிதரைப் பொதுவாகக் குறிக்கக்கூடியதால், தமிழ் சொற்றொடர் தேவையற்ற பாலின வலியுறுத்தலைத் தவிர்க்கிறது.
- source_word: ἀετῷ
  choice: கழுகு
  rationale: ἀετός என்பதற்கான வழக்கமான பொருளைத் தருவதோடு, தரிசனத்தின் உயர்ந்த பறவைப் படிமத்திற்கும் பொருந்துகிறது.
- source_word: πετομένῳ
  choice: பறக்கும்
  rationale: கழுகு பறக்கும் நிலையில் இருப்பதை நிகழ்காலப் பெயரெச்சமாக நேரடியாகவும் இயல்பாகவும் காட்டுகிறது.
theological_decisions:
- issue: மூன்றாம் உயிரினத்தின் முகத்தை விவரிக்கும் ἀνθρώπου என்பதன் மொழிபெயர்ப்பு
  choice: ஒரு மனிதனைப் போன்ற முகம்
  alternative: மனித முகம்
  rationale: ἀνθρώπου மனித இனத்தைச் சேர்ந்த ஒருவரை பொதுவாகக் குறிக்கலாம்; ὡς வெளிப்படுத்தும் ஒப்புமையை முதன்மை உரை காக்கிறது. சுருக்கமான இயல்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது; எந்தக் குறிப்பிட்ட மனிதரையோ ஆண் பாலினத்தையோ உரை தேவையின்றி வலியுறுத்தவில்லை.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. ஒரே மாதிரியான நான்கு விளக்கங்களின் ஓசை காக்கப்பட்டாலும், மூன்றாவது உயிரினத்தைப் பற்றிய கிரேக்கத் தொடரின் வேறுபட்ட அமைப்பும் தமிழில் தெளிவாகப் பிரதிபலிக்கப்படுகிறது.
