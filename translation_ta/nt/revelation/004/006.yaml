id: REV.4.6
reference: Revelation 4:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐνώπιον τοῦ θρόνου ὡς θάλασσα ὑαλίνη ὁμοία κρυστάλλῳ. Καὶ ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου τέσσαρα ζῷα γέμοντα ὀφθαλμῶν ἔμπροσθεν καὶ ὄπισθεν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/006.yaml
  text: And before the throne was something like a sea of glass[a], like crystal. And in the midst of the throne and around the throne were four living creatures[c][b], full of eyes in front and behind.
translation:
  language: ta
  text: சிங்காசனத்திற்கு முன்பாக, கண்ணாடிக் கடலைப் போன்று, படிகத்தை ஒத்த ஒன்று இருந்தது[a]. சிங்காசனத்தின் நடுவிலும் சிங்காசனத்தைச் சுற்றிலும்[c], முன்னும் பின்னும் கண்கள் நிறைந்த நான்கு உயிரினங்கள்[b] இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கண்ணாடியைப் போன்ற கடல்.” கிரேக்கத்தில் இது நேரடி அடையாளப்படுத்தல் அல்ல; “கண்ணாடிக் கடலைப் போன்று” என்ற ஒப்புமையாகத் தரப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உயிருள்ள படைப்புகள்.” இங்குள்ள கிரேக்கச் சொல் வெளிப்படுத்தின விசேஷத்தின் பிற்காலப் பகுதிகளில் வரும் பகைமைமிக்க “மிருகங்களை” குறிக்கவில்லை.
    reason: lexical_alternative
  - marker: c
    text: “சிங்காசனத்தின் நடுவிலும் சிங்காசனத்தைச் சுற்றிலும்” என்ற சொற்றொடர் இடஞ்சார்ந்து புரிந்துகொள்ளக் கடினமானது. இது தரிசனப் பார்வையைப் பிரதிபலிக்கலாம்; எனவே மூலத்தின் வழக்கத்திற்கு மாறான அமைப்பு அப்படியே பாதுகாக்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνώπιον
  choice: முன்பாக
  rationale: சிங்காசனத்துடனான இடஞ்சார்ந்த உறவை இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ὡς
  choice: போன்ற ஒன்று
  rationale: இது நேரடி அடையாளப்படுத்தல் அல்ல, ஒப்புமை என்பதை வெளிப்படுத்துகிறது; தரிசனக் காட்சியின் தோராயத் தன்மையையும் காக்கிறது.
- source_word: θάλασσα ὑαλίνη
  choice: கண்ணாடிக் கடல்
  rationale: பெயர்ச்சொல்-பெயரடை உருவகத்தைச் சுருக்கமாகவும் காட்சித்தன்மையுடனும் தருகிறது; அது உண்மையான நீர்க்கடல் என்று வற்புறுத்துவதில்லை.
- source_word: ὁμοία κρυστάλλῳ
  choice: படிகத்தைப் போலிருந்த
  rationale: κρύσταλλος என்பதற்கான இயல்பான தமிழ் இணையாக ‘படிகம்’ பயன்படுத்தப்பட்டு, இரண்டாவது ஒப்புமை தெளிவாகக் காக்கப்படுகிறது.
- source_word: ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου
  choice: சிங்காசனத்தின் நடுவிலும் சிங்காசனத்தைச் சுற்றிலும்
  rationale: மூலத்தின் இடஞ்சார்ந்த சிக்கலை விளக்கித் தீர்க்காமல், அதன் இரு கூறுகளையும் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: ζῷα
  choice: உயிரினங்கள்
  rationale: உயிருள்ள வானுலகப் படைப்புகளைக் குறிக்கும் இயல்பான சொல்; பின்னர் வரும் பகைமைமிக்க ‘மிருகங்கள்’ என்ற எண்ணத்தை இங்கு புகுத்துவதில்லை.
- source_word: γέμοντα ὀφθαλμῶν
  choice: கண்கள் நிறைந்த
  rationale: மூலத்தின் பங்கேற்புவினை அமைப்பை இயல்பாகவும் நேரடியாகவும் பிரதிபலிக்கிறது.
- source_word: ἔμπροσθεν καὶ ὄπισθεν
  choice: முன்னும் பின்னும்
  rationale: உயிரினங்களின் இருபுறத் தோற்றத்தைத் தெரிவிக்கும் சுருக்கமான, இயல்பான தமிழ்ச் சொற்றொடர்.
theological_decisions:
- issue: பரலோகச் சிங்காசனக் காட்சியில் ζῷα என்பதன் மொழிபெயர்ப்பு
  choice: உயிரினங்கள்
  alternative: உயிருள்ளவர்கள்; மிருகங்கள்
  rationale: இச்சொல் தேவனுடைய சிங்காசனத்தைச் சூழ்ந்த உயிருள்ள படைப்புகளைக் குறிக்கிறது. ‘உயிரினங்கள்’ என்பது தரிசனத்தின் உயர்ந்த தன்மையைத் தக்கவைத்து, வெளிப்படுத்தின விசேஷத்தின் பிற்காலப் பகுதிகளில் வரும் பகைமைமிக்க மிருகங்களோடு தவறாக ஒன்றுபடுத்துவதைத் தவிர்க்கிறது.
- issue: ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου என்பதில் உள்ள இடஞ்சார்ந்த இழுவிசை
  choice: ‘சிங்காசனத்தின் நடுவிலும் சிங்காசனத்தைச் சுற்றிலும்’ என்ற மூலத்திற்கு நெருக்கமான அமைப்பைப் பாதுகாத்தல்
  alternative: ‘சிங்காசனத்தைச் சுற்றி, நடுப்பகுதியில்’; ‘சிங்காசனத்திற்கும் அதைச் சுற்றிய வட்டத்திற்கும் இடையில்’ என்று விளக்குதல்
  rationale: கிரேக்கச் சொற்றொடர் வழக்கத்திற்கு மாறான தரிசனப் பார்வையைத் தருகிறது. ஒரு குறிப்பிட்ட இடவியல் விளக்கத்தைத் திணிக்காமல் அதன் தெளிவின்மையும் இழுவிசையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான தரிசன நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘படிகம்’, ‘கண்ணாடிக் கடல்’, ‘உயிரினங்கள்’ ஆகியவை காட்சித்தன்மையையும் மூலத்தின் ஒப்புமைகளையும் காக்கின்றன; இடஞ்சார்ந்த சிக்கல் திட்டமிட்டு எளிமைப்படுத்தப்படவில்லை.
