revisions:
- from: சிங்காசனத்திற்கு முன்பாகப் படிகத்தைப் போலிருந்த கண்ணாடிக் கடலைப் போன்ற ஒன்று இருந்தது[a]. சிங்காசனத்தின் நடுவிலும் சிங்காசனத்தைச் சுற்றிலும்[c], முன்னும் பின்னும் கண்கள் நிறைந்த நான்கு உயிரினங்கள்[b] இருந்தன.
  to: சிங்காசனத்திற்கு முன்பாக, கண்ணாடிக் கடலைப் போன்று, படிகத்தை ஒத்த ஒன்று இருந்தது[a]. சிங்காசனத்தின் நடுவிலும் சிங்காசனத்தைச் சுற்றிலும்[c], முன்னும் பின்னும் கண்கள் நிறைந்த நான்கு உயிரினங்கள்[b] இருந்தன.
  rationale: முதல் வாக்கியம் கிரேக்கத்தின் இரண்டு ஒப்புமைகளையும்—‘கண்ணாடிக் கடலைப் போன்று’ மற்றும் ‘படிகத்தை ஒத்த’—தெளிவாகவும் இயல்பாகவும் தருமாறு மாற்றப்பட்டுள்ளது. இடஞ்சார்ந்த சிக்கல், உயிரினங்களின் அடையாளம், மற்றும் கண்கள் குறித்த விளக்கம் மாற்றப்படவில்லை. அடிக்குறிப்புகள் திருத்தப்பட்ட சொல்லாக்கத்தோடு ஒத்திசைக்கப்பட்டுள்ளன.
