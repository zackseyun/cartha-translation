base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/003.yaml
  text: And the one seated there was in appearance like jasper and sardius stone[b][a], and around the throne was a rainbow in appearance like emerald.
translation:
  language: ta
  text: அரியணையில் அமர்ந்திருப்பவர் பார்ப்பதற்கு யாஸ்பர் கல்லையும் செம்மணிக்கல்லையும் போல இருந்தார். அரியணையைச் சுற்றிலும் மரகதம்போல் தோன்றிய ஒரு வானவில் இருந்தது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘வானவில்’ என்பதற்கு ‘வானவில் போன்ற ஒளிவட்டம்’ என்றும் பொருள் கொள்ளலாம்; கிரேக்கச் சொல் இங்கு அரியணையைச் சூழ்ந்த வானவில் போன்ற ஒளிப்பொலிவைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καθήμενος
  choice: அரியணையில் அமர்ந்திருந்தவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புவினை, அரியணையில் தொடர்ந்து அமர்ந்திருக்கும் நபரைக் குறிக்கிறது. முந்தைய வசனத்தின் சூழலை இயல்பான தமிழில் வெளிப்படுத்த ‘அரியணையில்’ சேர்க்கப்பட்டுள்ளது.
- source_word: ὅμοιος ὁράσει
  choice: பார்ப்பதற்கு … போல
  rationale: ὁράσει என்பது தோற்றம் அல்லது பார்வையைப் பொறுத்த ஒப்புமையைக் குறிக்கிறது. இவ்வாக்கியம் பொருளால் ஆனவர் என்று கூறாமல், தரிசனத்தில் தோன்றிய ஒற்றுமையைப் பாதுகாக்கிறது.
- source_word: λίθῳ ἰάσπιδι
  choice: யாஸ்பர் கல்
  rationale: பண்டைக்கால ἴασπις எந்த நவீன கனிமத்தைக் குறித்தது என்பது முழுமையாக உறுதியில்லை. ஆகவே குறிப்பிட்ட நிறத்தையோ நவீன கனிம அடையாளத்தையோ திணிக்காமல், அறியப்பட்ட மணிக்கல் பெயர் ஒலிபெயர்க்கப்படுகிறது.
- source_word: σαρδίῳ
  choice: செம்மணிக்கல்
  rationale: சிவப்பு முதல் செம்பழுப்பு நிறமுள்ள சார்திய/கார்னீலியன் வகை மணிக்கல்லைக் குறிக்கும் சொல்லை சாதாரண வாசகருக்குப் புரியும் இயல்பான தமிழில் தருகிறது; மரபுப் பெயர் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἶρις
  choice: வானவில்
  rationale: இச்சூழலில் அரியணையைச் சுற்றிய வானவில் போன்ற ஒளிவட்டத்தை இயல்பாகக் குறிக்கிறது. ‘ஒளிவட்டம்’ என்பதும் சாத்தியம் என்பதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: κυκλόθεν τοῦ θρόνου
  choice: அரியணையைச் சுற்றிலும்
  rationale: அரியணையின் எல்லாப் பக்கங்களையும் சூழ்ந்திருக்கும் நிலையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ὅμοιος ὁράσει σμαραγδίνῳ
  choice: மரகதத்தைப் போன்ற தோற்றமுடைய
  rationale: மரகதமாகவே இருந்தது என்று கூறாமல், அதன் காட்சி மரகதத்தை ஒத்திருந்தது என்ற கிரேக்க ஒப்புமையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: அரியணையில் அமர்ந்திருப்பவரைப் பற்றிய விளக்கம் நேரடியான உடல் வருணனையா அல்லது தரிசன ஒப்புமையா
  choice: ‘பார்ப்பதற்கு … போல’ என்ற ஒப்புமை மொழியைத் தக்கவைத்தல்
  alternative: அவர் மணிக்கற்களால் ஆனவர் அல்லது அவற்றின் நிற ஒளியை வெளியிட்டார் என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: கிரேக்க மூலத்தில் தோற்றத்தைப் பொறுத்த ஒப்புமை இருமுறை வெளிப்படுகிறது. அதனால் மணிக்கற்களோடு உள்ள காட்சி ஒற்றுமை மட்டும் கூறப்பட்டு, அவரது இயல்பு அல்லது உடல் அமைப்பு குறித்து உரை கூறாததை மொழிபெயர்ப்பும் கூறாமல் விடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் தரிசன உரைக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. தொழில்நுட்பமான மணிக்கல் பெயர்கள் தேவையான இடத்தில் ஒலிபெயர்ப்பு மற்றும் அடிக்குறிப்பின் உதவியுடன் வழங்கப்பட்டுள்ளன.
