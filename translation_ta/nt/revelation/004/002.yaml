  text: ⸀εὐθέως ἐγενόμην ἐν πνεύματι· καὶ ἰδοὺ θρόνος ἔκειτο ἐν τῷ οὐρανῷ, καὶ ἐπὶ τὸν θρόνον καθήμενος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/002.yaml
  text: Immediately I was in the Spirit[a], and behold, a throne stood in heaven, and one seated on the throne,
translation:
  language: ta
  text: உடனே நான் ஆவியில் இருந்தேன்[a]; இதோ, பரலோகத்தில் ஒரு அரியணை அமைந்திருந்தது; அந்த அரியணையின்மேல் ஒருவர் அமர்ந்திருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆவிக்குரிய நிலையில்.” கிரேக்கத்தில் “ஆவி” என்பதற்கு முன் உறுப்புச்சொல் இல்லை; இது பரிசுத்த ஆவியிலிருப்பதையோ, ஆவிக்குரிய தரிசன நிலையையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως
  choice: உடனே
  rationale: நிகழ்ந்த மாற்றத்தின் உடனடித் தன்மையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ἐγενόμην
  choice: ஆவிக்குள்ளானேன்
  rationale: γίνομαι குறிக்கும் ஒரு நிலைக்குள் நுழையும் மாற்றத்தைத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; வெறுமனே நிலைத்திருப்பதைக் குறிக்கும் ‘இருந்தேன்’ என்பதைவிட இயக்கத்தைப் பாதுகாக்கிறது.
- source_word: ἐν πνεύματι
  choice: ஆவிக்குள்ளானேன்
  rationale: தீர்க்கதரிசனத் தரிசன நிலையையும் பரிசுத்த ஆவியின் செயலையும் சுட்டக்கூடிய கிரேக்கச் சொற்றொடரின் சுருக்கத்தைக் காக்கிறது. கிரேக்கத்தில் குறிப்புச் சுட்டு இல்லாததால் மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: தரிசனத்தில் புதிதாகத் தோன்றுவதை நோக்கிக் கவனத்தை ஈர்க்கும் உயர்ந்த, ஆனால் பொதுமக்களுக்கும் புரியும் தமிழ் நடை.
- source_word: θρόνος
  choice: ஒரு அரியணை
  rationale: தரிசனத்தில் முதன்முறையாக அறிமுகமாகும் அரச ஆட்சியாசனத்தை இயல்பாகக் குறிக்கிறது.
- source_word: ἔκειτο
  choice: வைக்கப்பட்டிருந்தது
  rationale: அரியணை அங்கே நிலைபெற்று அமைந்திருந்ததைக் குறிக்கும் κεῖμαι என்பதன் பொருளைத் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: ἐν τῷ οὐρανῷ
  choice: பரலோகத்தில்
  rationale: இங்கு வானமண்டலத்தை அல்ல, வெளிப்படுத்தின விசேஷத்தின் விண்ணுலகத் தளத்தைக் குறிக்கிறது.
- source_word: καθήμενος
  choice: ஒருவர் அமர்ந்திருந்தார்
  rationale: அரியணையில் இருப்பவரின் அடையாளத்தை வசனம் கூறுவதைவிட அதிகமாகத் தீர்மானிக்காமல், பெயர்ச்சொல் பணியில் வரும் பங்கேற்புவினையை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: ἐν πνεύματι என்பது பரிசுத்த ஆவியைக் குறிக்கிறதா, அல்லது ஆவிக்குரிய/தரிசன நிலையைக் குறிக்கிறதா?
  choice: ஆவிக்குள்ளானேன்
  alternative: என் ஆவியில் ஒரு தரிசன நிலைக்குள்ளானேன்
  rationale: வெளிப்படுத்தின விசேஷத்தில் இச்சொற்றொடர் தீர்க்கதரிசனத் தரிசனத்திற்குள் கொண்டுசெல்லப்படுவதைச் சுட்டுகிறது; அதேவேளை கிரேக்கத்தில் குறிப்புச் சுட்டு இல்லாததால் பரிசுத்த ஆவி என்ற பொருளையும் பொதுவான ஆவிக்குரிய நிலை என்ற பொருளையும் தமிழ் முதன்மை உரை முழுமையாகத் தீர்மானிக்காமல் விடுகிறது. மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ். ‘இதோ’ என்பது வெளிப்படுத்தல் இலக்கியத்தின் கவன ஈர்ப்பைத் தக்கவைக்கிறது. ‘அரியணை’ அரசாட்சிப் பொருளைத் தெளிவாக்குகிறது. மூலத்தின் தொடரும் தரிசன அமைப்பைப் பாதுகாத்தபோதும், தமிழில் முழுமையான வாக்கியமாக இயல்பாக்கப்பட்டுள்ளது.
