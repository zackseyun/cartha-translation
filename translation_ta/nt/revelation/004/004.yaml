id: REV.4.4
reference: Revelation 4:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ κυκλόθεν τοῦ θρόνου ⸀θρόνοι εἴκοσι τέσσαρες, καὶ ἐπὶ τοὺς ⸀θρόνους εἴκοσι τέσσαρας πρεσβυτέρους καθημένους περιβεβλημένους ⸀ἐν ἱματίοις λευκοῖς, καὶ ἐπὶ τὰς κεφαλὰς αὐτῶν στεφάνους χρυσοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/004.yaml
  text: And around the throne were twenty-four thrones[a], and on the thrones were seated twenty-four elders, clothed in white garments, and on their heads were golden crowns.
translation:
  language: ta
  text: அந்த அரியணையைச் சுற்றிலும் இருபத்து நான்கு அரியணைகள் இருந்தன. அந்த அரியணைகளில் வெள்ளை ஆடைகளை அணிந்த இருபத்து நான்கு மூப்பர்கள் அமர்ந்திருந்தார்கள்; அவர்களுடைய தலைகளில் பொன் கிரீடங்கள்[a] இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பொன் வெற்றி மாலைகள்.’ கிரேக்கச் சொல் அரச கிரீடத்தை மட்டுமல்லாமல், கௌரவம் அல்லது வெற்றிக்காக வழங்கப்படும் மாலை போன்ற கிரீடத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: κυκλόθεν
  choice: சுற்றிலும்
  rationale: அரியணையைச் சுற்றியுள்ள இட அமைப்பை இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: θρόνοι
  choice: அரியணைகள்
  rationale: மையிலுள்ள அரியணைக்கும் அதைச் சுற்றியுள்ள இருபத்து நான்கு இருக்கைகளுக்கும் கிரேக்கம் ஒரே சொல்லைப் பயன்படுத்துகிறது; அரச மற்றும் நீதித்துறை சார்ந்த காட்சியையும் இந்தத் தேர்வு காக்கிறது.
- source_word: πρεσβυτέρους
  choice: மூப்பர்கள்
  rationale: வெளிப்படுத்தலில் காணப்படும் இந்தக் குழுவுக்குரிய அடையாளப் பெயரைப் பாதுகாக்கிறது; அவர்களின் வயதையோ அடையாளத்தையோ விளக்கிச் சேர்ப்பதில்லை.
- source_word: καθημένους
  choice: அமர்ந்திருந்தார்கள்
  rationale: அவர்கள் அரியணைகளில் அமர்ந்திருந்த நிலையை இயல்பான தமிழ் வினை வடிவில் தெரிவிக்கிறது.
- source_word: περιβεβλημένους ἐν ἱματίοις λευκοῖς
  choice: வெள்ளை ஆடைகளை அணிந்த
  rationale: அவர்கள் வெள்ளை ஆடைகளால் உடுத்தப்பட்டிருந்த நிலையைத் தெரிவிக்கிறது; ἱμάτια என்பதை குறிப்பாக நீண்ட அங்கிகள் என மிகைப்படுத்தவில்லை.
- source_word: στεφάνους χρυσοῦς
  choice: பொன் கிரீடங்கள்
  rationale: பொன்னால் ஆன கௌரவ அல்லது வெற்றிக் கிரீடங்களைக் குறிக்கும் காட்சியைச் சுருக்கமாகவும் புரியத்தக்க வகையிலும் தருகிறது; στέφανος என்பதன் ‘வெற்றி மாலை’ நுட்பம் அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: சுற்றியுள்ள இருபத்து நான்கு θρόνοι என்பவற்றின் இயல்பு
  choice: ‘அரியணைகள்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘இருக்கைகள்’ என்று மொழிபெயர்த்தல்.
  rationale: மையிலுள்ள அரியணைக்கும் சுற்றியுள்ளவற்றுக்கும் மூல உரை θρόνος என்ற ஒரே சொல்லைப் பயன்படுத்துகிறது. ‘அரியணைகள்’ என்பது அந்தச் சொல் தொடர்பையும் அரச/நீதித்துறைப் படிமத்தையும் காக்கிறது; அதனால் அவை மைய அரியணைக்கு சமமானவை என்று முடிவு செய்யப்படுவதில்லை.
- issue: இருபத்து நான்கு மூப்பர்களின் அடையாளம்
  choice: விளக்கச் சேர்க்கையின்றி ‘மூப்பர்கள்’ என விடப்பட்டது.
  alternative: திருச்சபையின் பிரதிநிதிகள், தேவதூதர்கள், அல்லது இஸ்ரவேலும் அப்போஸ்தலர்களும் ஆகியோரின் பிரதிநிதிகள் என அடையாளப்படுத்துதல்.
  rationale: இந்த வசனம் அவர்களை πρεσβύτεροι என்று மட்டுமே அழைக்கிறது; அவர்களின் அடையாளத்தை விளக்குவதில்லை. ஆகவே மொழிபெயர்ப்பு எந்தக் கோட்பாட்டு விளக்கத்தையும் உட்புகுத்தவில்லை.
- issue: στέφανος என்பதன் இயல்பு
  choice: முதன்மை உரையில் ‘கிரீடங்கள்’ என்றும் அடிக்குறிப்பில் ‘வெற்றி மாலைகள்’ என்றும் தரப்பட்டது.
  alternative: முதன்மை உரையிலேயே ‘வெற்றி மாலைகள்’ என்று மொழிபெயர்த்தல்.
  rationale: இச்சொல் கௌரவம் அல்லது வெற்றிக்காக வழங்கப்படும் மாலை/கிரீடத்தைக் குறிக்கலாம்; ஆனால் இங்கே அதன் குறிப்பிட்ட வகை தீர்மானிக்கப்படவில்லை. பொதுவாகப் புரியும் சொல்லை உரையில் வைத்து, உண்மையான சொற்பொருள் வாய்ப்பை அடிக்குறிப்பு காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், காட்சியின் கண்ணியமான தொனியைப் பேணும் நடை. நீண்ட கிரேக்கத் தொடரை வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாக அமைத்துள்ளது; அரியணை, மூப்பர்கள், ஆடைகள், கிரீடங்கள் ஆகிய முக்கியப் படிமங்கள் நேரடியாகப் பாதுகாக்கப்பட்டுள்ளன.
