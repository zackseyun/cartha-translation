id: REV.4.1
reference: Revelation 4:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον, καὶ ἰδοὺ θύρα ἠνεῳγμένη ἐν τῷ οὐρανῷ, καὶ ἡ φωνὴ ἡ πρώτη ἣν ἤκουσα ὡς σάλπιγγος λαλούσης μετ’ ἐμοῦ, λέγων· Ἀνάβα ὧδε, καὶ δείξω σοι ἃ δεῖ γενέσθαι. μετὰ ταῦτα
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/001.yaml
  text: After these things I looked[a], and behold, a door standing open in heaven, and the first voice that I had heard, like a trumpet speaking with me, said, “Come up here[c][b], and I will show you what must take place after these things.”
translation:
  language: ta
  text: இவற்றுக்குப் பின்பு நான் பார்த்தேன்[a]. இதோ, பரலோகத்தில் ஒரு கதவு திறந்தே இருந்தது. நான் முதலில் கேட்டிருந்த, என்னோடு பேசுகிற எக்காளம்போன்ற அந்தக் குரல்[b], “இங்கே மேலே வா; இவற்றுக்குப் பின்பு நிகழ வேண்டியவற்றை நான் உனக்குக் காட்டுவேன்” என்றது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் வழக்கமான தமிழில், ‘இதற்குப் பின்பு … இதற்குப் பின்பு’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் ‘இவற்றுக்குப் பின்பு’ என்ற பன்மைத் தொடர் வசனத்தின் தொடக்கத்திலும் முடிவிலும் வருகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘முதலில் கேட்டிருந்த அந்தக் குரல்’ என்பது யோவான் முன்பு கேட்ட குரலைக் குறிக்கலாம்; வெளிப்படுத்தல் 1:10-ஐப் பார்க்கவும்.
    reason: cross_reference
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: இவற்றுக்குப் பின்பு
  rationale: கிரேக்கச் சொற்றொடரின் பன்மைச் சுட்டையும், வசனத்தின் தொடக்கத்திலும் முடிவிலும் அது திரும்ப வருவதையும் பாதுகாக்கிறது. ‘இதற்குப் பின்பு’ என்பது இயல்பான மாற்றாக இருந்தாலும் பன்மையை வெளிப்படையாகக் காட்டாது.
- source_word: εἶδον
  choice: நான் பார்த்தேன்
  rationale: ἰδού தொடர்ந்து வருவதால் ‘நான் கண்டேன்; இதோ’ என்பதைக் காட்டிலும் இன்றைய தமிழில் இயல்பாக உள்ளது; அதேவேளை தரிசனத்தில் பார்வையைத் திருப்பும் செயலைத் தெரிவிக்கிறது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: திடீரெனக் கவனத்தை ஈர்க்கும் தரிசன உரைச் சுட்டியாகவும், வெளிப்படுத்தின விசேஷத்தின் உயர்ந்த நடைக்கு ஏற்றதாகவும் உள்ளது.
- source_word: θύρα ἠνεῳγμένη
  choice: ஒரு கதவு திறந்தே இருந்தது
  rationale: முன்னர் திறக்கப்பட்டதன் விளைவாகத் தொடர்ந்து திறந்த நிலையில் இருப்பதை完形 passive participle குறிக்கிறது; ‘திறந்தே இருந்தது’ அந்த நிலையை இயல்பான தமிழில் தருகிறது.
- source_word: ἐν τῷ οὐρανῷ
  choice: பரலோகத்தில்
  rationale: இங்கு காணக்கூடிய வானத்தை அல்ல, பரலோக உலகைத் தரிசனச் சூழல் குறிக்கிறது.
- source_word: ἡ φωνὴ ἡ πρώτη ἣν ἤκουσα
  choice: நான் முதலில் கேட்டிருந்த அந்தக் குரல்
  rationale: முன்னர் கேட்ட குரலைத் திரும்பச் சுட்டுவதை இயல்பான தமிழில் காட்டுகிறது; ‘முதல்’ என்பதன் வரிசைத் தன்மையையும் அழிக்கவில்லை.
- source_word: ὡς σάλπιγγος
  choice: எக்காளம்போல்
  rationale: குரலும் எக்காளமும் ஒன்றே என்று கூறாமல், அவற்றுக்கிடையிலான உவமையைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: λαλούσης μετ’ ἐμοῦ
  choice: என்னோடு பேசி
  rationale: μετά + genitive என்பதன் ‘என்னோடு’ என்ற வடிவைத் தக்கவைக்கிறது. தமிழில் ‘என்னிடம் பேசி’ என்பதும் இயல்பான மாற்று.
- source_word: Ἀνάβα ὧδε
  choice: இங்கே மேலே வா
  rationale: பரலோகத்தில் இருக்கும் பேச்சாளரின் இடநோக்கிலிருந்து யோவானை மேலே வருமாறு அழைக்கும் கட்டளையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἃ δεῖ γενέσθαι
  choice: நிகழ வேண்டியவற்றை
  rationale: δεῖ குறிக்கும் அவசியத்தை ‘வேண்டிய’ என்பதாலும், γενέσθαι குறிக்கும் நிகழ்தலை ‘நிகழ’ என்பதாலும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: δείξω σοι
  choice: நான் உனக்குக் காட்டுவேன்
  rationale: எளிய எதிர்கால வாக்குறுதியைத் தெளிவான நவீன தமிழில் வழங்குகிறது.
theological_decisions:
- issue: மீண்டும் வரும் μετὰ ταῦτα என்பதன் காலத் தொடர்பு
  choice: இரு இடங்களிலும் ‘இவற்றுக்குப் பின்பு’ என்று ஒரேபோல் மொழிபெயர்க்கப்பட்டது.
  alternative: இரு இடங்களிலும் அல்லது ஒரு இடத்தில் ‘இதற்குப் பின்பு’ என்று மொழிபெயர்க்கலாம்.
  rationale: இந்தத் தொடர் இலக்கிய வரிசையையா, தரிசன வரிசையையா, இரட்சிப்பு வரலாற்றின் காலவரிசையையா குறிக்கிறது என்பதை உரை வெளிப்படையாகத் தீர்மானிக்கவில்லை. எனவே அதன் மறுபடியும் வருதலையும் கால மொழியையும் பாதுகாத்து, குறிப்பிட்ட இறுதிக்காலத் திட்டத்தை மொழிபெயர்ப்பில் புகுத்தவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் புரியக்கூடிய, அதேவேளை தரிசன உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘இதோ’, ‘பரலோகம்’, ‘எக்காளம்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டன; தேவையற்ற பழந்தமிழ் வினைமுற்றுகளும் குறிப்பிட்ட சமயப் பிரிவின் விளக்கங்களும் தவிர்க்கப்பட்டன.
