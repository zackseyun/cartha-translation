revisions:
- from: இவற்றுக்குப் பின்பு நான் பார்த்தேன்[a]. இதோ, பரலோகத்தில் ஒரு கதவு திறந்தே இருந்தது. நான் முதலில் கேட்டிருந்த அந்தக் குரல்[b], எக்காளம்போல் என்னோடு பேசி[c], “இங்கே மேலே வா; இவற்றுக்குப் பின்பு நிகழ வேண்டியவற்றை நான் உனக்குக் காட்டுவேன்” என்றது.
  to: இவற்றுக்குப் பின்பு நான் பார்த்தேன்[a]. இதோ, பரலோகத்தில் ஒரு கதவு திறந்தே இருந்தது. நான் முதலில் கேட்டிருந்த, என்னோடு பேசுகிற எக்காளம்போன்ற அந்தக் குரல்[b], “இங்கே மேலே வா; இவற்றுக்குப் பின்பு நிகழ வேண்டியவற்றை நான் உனக்குக் காட்டுவேன்” என்றது.
  rationale: மூல கிரேக்கத்தின் உருவகத் தொடரைத் தெளிவாகக் காட்ட «என்னோடு பேசுகிற» என்பதை «எக்காளம்போன்ற» என்பதுடன் இணைத்தேன். இதனால் குரல் எக்காளத்துடன் ஒப்பிடப்படுவதும், அந்த எக்காளம் யோவானோடு பேசுவதாக வரையும் மூலத்தின் இலக்கண உருவகமும் பாதுகாக்கப்படுகின்றன. உரையில் footnote c-க்கு தனி அடையாளம் தேவையில்லாததால் அதைச் சேர்க்கவில்லை; அதன் பொருள் மாற்றுக் குறிப்பாக வழங்கப்பட்டுள்ளது.
