source:
  edition: SBLGNT
  text: πεσοῦνται οἱ εἴκοσι τέσσαρες πρεσβύτεροι ἐνώπιον τοῦ καθημένου ἐπὶ τοῦ θρόνου, καὶ προσκυνήσουσιν τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων, καὶ βαλοῦσιν τοὺς στεφάνους αὐτῶν ἐνώπιον τοῦ θρόνου, λέγοντες·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/010.yaml
  text: 'the twenty-four elders will fall down before the one seated on the throne[a], and they will worship the one who lives forever and ever, and they will cast their crowns before the throne[b], saying:'
translation:
  language: ta
  text: 'இருபத்துநான்கு மூப்பர்கள் அரியணையில் அமர்ந்திருப்பவரின் முன்பாக விழுவார்கள்; என்றென்றும் வாழ்கிறவரை[a] வழிபடுவார்கள்; தங்கள் கிரீடங்களை[b] அரியணையின் முன்பாக எறிவார்கள்; இவ்வாறு சொல்வார்கள்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “யுகங்களின் யுகங்களுக்கும்.”
    reason: lexical_alternative
  - marker: b
    text: “கிரீடங்கள்” என்பதற்கான கிரேக்கச் சொல், கௌரவத்தின் அடையாளமாக வழங்கப்பட்ட வெற்றி மாலைகளையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
