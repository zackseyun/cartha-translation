  choice: விழுந்து
  rationale: வழிபாட்டுச் சூழலில் மரியாதையுடன் ஒருவருக்கு முன்பாக விழும் உடல் செயலை நேரடியாகக் காட்டுகிறது; முழுமையாகத் தரையில் சாஷ்டாங்கமாக விழுதல் என்று அளவுக்கு மீறி விளக்கவில்லை.
- source_word: πρεσβύτεροι
  choice: மூப்பர்கள்
  rationale: வெளிப்படுத்தின விசேஷத்தின் பரலோக அரசவைச் சூழலில் இயல்பாகவும் பொதுவாகவும் புரியும் தமிழ் சொல்.
- source_word: ἐνώπιον
  choice: முன்பாக
  rationale: இரு இடங்களிலும் முகாமுகமான முன்னிலையையும் இருப்பிடத் தொடர்பையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: அரியணையில் அமர்ந்திருப்பவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புவினையை, தொடர்ந்து அரியணையில் வீற்றிருக்கும் நிலையை உணர்த்தும் இயல்பான தமிழில் தருகிறது.
- source_word: προσκυνήσουσιν
  choice: வழிபடுவார்கள்
  rationale: தெய்வீகச் சூழலில் மதிப்பளிக்கும் உடல் செயலை மட்டுமல்லாமல் மத வழிபாட்டையும் தெளிவாகக் குறிக்கிறது.
- source_word: τῷ ζῶντι
  choice: வாழ்கிறவர்
  rationale: கடவுளுடைய நிலையான உயிருள்ள தன்மையை வெளிப்படுத்தும் பெயர்ச்சொல் தன்மையுள்ள பங்கேற்புவினையை இயல்பாகப் பாதுகாக்கிறது.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: என்றென்றும்
  rationale: முடிவில்லாத காலத்தைக் குறிக்கும் கிரேக்க மரபுத்தொடரின் இயல்பான நவீனத் தமிழ் இணை; சொற்சொல்லான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: βαλοῦσιν
  choice: எறிந்துவிட்டு
  rationale: வெறுமனே கீழே வைப்பதைக் காட்டிலும் βάλλω என்பதிலுள்ள தெளிவான, வலிமையான செயலைப் பாதுகாக்கிறது; அடுத்ததாக அவர்கள் சொல்வதுடன் இயல்பாக இணைகிறது.
- source_word: στεφάνους
  choice: கிரீடங்கள்
  rationale: அரசவையையும் கௌரவத்தையும் குறிக்கும் இக்காட்சியில் இயல்பான சொல்; வெற்றிக்காக அல்லது கௌரவத்திற்காக வழங்கப்பட்ட மாலை என்ற வரலாற்று நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: λέγοντες
  choice: இவ்வாறு சொல்வார்கள்
  rationale: அடுத்த வசனத்தில் வரும் உரையை அறிமுகப்படுத்தும் பங்கேற்புவினையைத் தமிழில் முழுமையான, இயல்பான வினையாகத் தருகிறது.
theological_decisions:
- issue: அரியணையில் அமர்ந்திருப்பவரும் என்றென்றும் வாழ்கிறவரும் யார் என்பது
  choice: “அரியணையில் அமர்ந்திருப்பவர்”, “என்றென்றும் வாழ்கிறவர்” என்ற விவரணப் பெயர்களையே பயன்படுத்துதல்
  alternative: மொழிபெயர்ப்பிலேயே அவரைக் ‘பிதாவாகிய கடவுள்’ என்று வெளிப்படையாக அடையாளப்படுத்துதல்
  rationale: சூழல் அரியணையில் இருப்பவர் கடவுள் என்பதை வலுவாகச் சுட்டினாலும், இந்த வசனத்தின் கிரேக்க உரை தனிப்பட்ட அடையாளப் பெயருக்குப் பதிலாக விவரணப் பெயர்களையே பயன்படுத்துகிறது. ஆகவே மொழிபெயர்ப்பு அந்த இறையியல் நுட்பத்தைத் தீர்மானித்து விடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வெளிப்படுத்தின விசேஷத்தின் கம்பீரமான வழிபாட்டு நடையைத் தக்கவைத்தும் மொழிபெயர்க்கப்பட்டது. எல்லா எதிர்கால வினைகளும் பாதுகாக்கப்பட்டுள்ளன; வசனம் அடுத்ததாக வரும் உரையை அறிமுகப்படுத்தும் முக்காற்புள்ளியுடன் முடிகிறது.
