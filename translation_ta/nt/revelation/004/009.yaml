id: REV.4.9
reference: Revelation 4:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὅταν ⸀δώσουσιν τὰ ζῷα δόξαν καὶ τιμὴν καὶ εὐχαριστίαν τῷ καθημένῳ ἐπὶ ⸂τῷ θρόνῳ⸃, τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/009.yaml
  text: And whenever the living creatures give glory and honor and thanksgiving to the one seated on the throne[a], to the one who lives forever and ever,
translation:
  language: ta
  text: அந்த உயிரினங்கள் அரியணையில் வீற்றிருப்பவராகிய, என்றென்றும் வாழ்கிறவருக்கு மகிமையையும் கனத்தையும் நன்றியையும் செலுத்தும்போதெல்லாம்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: செலுத்தும்போதெல்லாம்
  rationale: ὅταν இங்கு மீண்டும் மீண்டும் நிகழும் அல்லது காலம் குறிப்பில்லாத செயலை உணர்த்துகிறது. ‘போதெல்லாம்’ என்பது அந்தத் தொடர்ச்சியான பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: δώσουσιν
  choice: செலுத்தும்
  rationale: δίδωμι என்பதன் அடிப்படைப் பொருள் ‘கொடு’ என்றாலும், மகிமை, கனம், நன்றி ஆகியவற்றோடு ‘செலுத்து’ என்பது தமிழில் இயல்பாகவும் வழிபாட்டுச் சூழலுக்கு ஏற்றவாறும் உள்ளது; அது ‘துதி செய்’ என்று பொருளைச் சுருக்கவில்லை.
- source_word: τὰ ζῷα
  choice: அந்த உயிரினங்கள்
  rationale: வெளிப்படுத்தல் 4-ல் முன்பே அறிமுகப்படுத்தப்பட்ட அரியணைச் சூழலிலுள்ள உயிருள்ள படைப்புகளைக் குறிக்கிறது. இவ்வசனத்தில் ‘நான்கு’ மீண்டும் இடம்பெறாததால் அது சேர்க்கப்படவில்லை; முன்னைய குறிப்பைச் சுட்ட ‘அந்த’ பயன்படுத்தப்பட்டது.
- source_word: δόξαν
  choice: மகிமை
  rationale: வழிபாட்டுச் சூழலில் δόξα என்பதற்கான நேரான, நிலைபெற்ற தமிழ் இணை ‘மகிமை’; ‘துதி’ என்று மொழிபெயர்த்தால் பண்பிலிருந்து செயலுக்குப் பொருள் மாறும்.
- source_word: τιμήν
  choice: கனம்
  rationale: τιμή என்பது அளிக்கப்படும் மதிப்பையும் மரியாதையையும் குறிக்கிறது. ‘கனம் செலுத்துதல்’ என்பது கண்ணியமான, புரியக்கூடிய வேதாகமத் தமிழில் இந்த இணைப்பை நன்கு தக்கவைக்கிறது.
- source_word: εὐχαριστίαν
  choice: நன்றி
  rationale: εὐχαριστία வெளிப்படுத்தப்படும் நன்றியைச் சுட்டுகிறது. ‘நன்றி செலுத்துதல்’ என்பது நவீனத் தமிழில் இயல்பானது; பெயர்ச்சொல் மும்மையையும் காக்கிறது.
- source_word: τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: அரியணையில் வீற்றிருப்பவருக்கு
  rationale: καθημένῳ என்பதன் நிலைசார் அர்த்தத்தையும் அரியணைக் காட்சியின் கண்ணியத்தையும் ‘வீற்றிருப்பவர்’ இயல்பாகத் தருகிறது.
- source_word: τῷ ζῶντι
  choice: வாழ்கிறவருமானவருக்கு
  rationale: இரண்டாவது தத்திவுப் பங்கேற்புப் பெயரெச்சம் முதல் குறிப்புக்கே விளக்கமாக இணைகிறது. ‘-உமானவர்’ அமைப்பு இரண்டும் ஒரே நபரைக் குறிக்கும் appositional உறவைத் தெளிவாகக் காக்கிறது.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: என்றென்றும்
  rationale: இந்த கிரேக்க மரபுத்தொடர் முடிவில்லாத காலத்தை உணர்த்துகிறது. ‘என்றென்றும்’ என்பது அதன் தெளிவான, இயல்பான நவீனத் தமிழ் இணை.
theological_decisions:
- issue: அரியணையில் இருப்பவரை மூலத்தில் இல்லாத பெயரால் குறிப்பிடாமல் மொழிபெயர்த்தல்
  choice: அரியணையில் வீற்றிருப்பவரும் என்றென்றும் வாழ்கிறவருமானவருக்கு
  alternative: அரியணையில் வீற்றிருக்கும், என்றென்றும் வாழ்கிற அவருக்கு
  rationale: மூலம் ‘தேவன்’ என்ற சொல்லை இங்கு வெளிப்படையாகச் சேர்ப்பதில்லை. இரண்டு பங்கேற்புப் பெயரெச்சங்களையும் ஒரே நபருக்குரிய இணை விளக்கங்களாக வைத்ததால் அரியணையும் நித்திய வாழ்வும் சார்ந்த அடையாளம் காக்கப்படுகிறது; கூடுதல் இறையியல் விவரம் புகுத்தப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுக் காட்சிக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. வசனம் அடுத்த வசனத்திற்குத் தொடரும் சார்பு வாக்கியமாக இருப்பதால் இறுதியில் முடிவுப் புள்ளிக்கு பதிலாக காற்புள்ளி வைக்கப்பட்டுள்ளது. மூலத்தின் மும்மை—மகிமை, கனம், நன்றி—அதே வரிசையில் காக்கப்பட்டுள்ளது.
