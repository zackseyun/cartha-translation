revisions:
- from: அந்த உயிரினங்கள் அரியணையில் வீற்றிருப்பவரும் என்றென்றும் வாழ்கிறவருமானவருக்கு மகிமையையும் கனத்தையும் நன்றியையும் செலுத்தும்போதெல்லாம்,
  to: அந்த உயிரினங்கள் அரியணையில் வீற்றிருப்பவராகிய, என்றென்றும் வாழ்கிறவருக்கு மகிமையையும் கனத்தையும் நன்றியையும் செலுத்தும்போதெல்லாம்,
  rationale: The revision only smooths the appositional description of the recipient. ‘அரியணையில் வீற்றிருப்பவராகிய, என்றென்றும் வாழ்கிறவருக்கு’ identifies one and the same person, as do the two dative participles in Greek, and preserves the source’s omission of an explicit divine name. The comma is retained because the clause continues into the following verse.
