  source_fidelity: 'முக்கிய பொருள் தக்கவைக்கப்பட்டுள்ளது: நான்கு உயிரினங்கள், ஒவ்வொன்றுக்கும் ஆறு சிறகுகள், சுற்றிலும் உள்ளேயும் கண்கள், இரவும் பகலும் ஓய்வின்மை, மும்முறை பரிசுத்த அறிவிப்பு, மற்றும் நிகழ்நிலைத் தன்மையுடைய ‘வருகிறவர்’ ஆகியவை அனைத்தும் உள்ளன. ஆனால் ‘அந்த’ என்பது இவ்வசனத்தில் மூலத்தில் இல்லாத சுட்டுதலைச் சேர்க்கிறது; மேலும் ‘உள்ளேயும்’ என்பது எதன் உள்ளே என்பதில் தமிழில் சற்றே தொங்கலாக உள்ளது.'
  naturalness: நடை பொதுவாக நவீனத் தரத் தமிழுக்கு ஏற்றதும் வழிபாட்டு அறிவிப்புக்கு இயல்பானதுமாக உள்ளது. இருப்பினும் ‘ஒவ்வொன்றுக்கும்’ என்பதற்குப் பின் ‘இருந்தன’ எனப் பன்மையில் அமைப்பது தெளிவாக இருந்தாலும், ‘அவற்றில் ஒவ்வொன்றுக்கும்’ என்று கூறினால் பகிர்வுப் பொருள் நேரடியாகும். ‘வெளிப்புறத்திலும் உட்புறத்திலும்’ என்பது மூலத்தின் இரு இடப்பரிமாணங்களையும் தமிழில் தெளிவாகக் காட்டும்.
