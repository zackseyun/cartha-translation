revisions:
- from: 'அந்த நான்கு உயிரினங்களிலும் ஒவ்வொன்றுக்கும் ஆறு சிறகுகள் இருந்தன; அவை சுற்றிலும் உள்ளேயும் கண்களால் நிறைந்திருந்தன. அவை இரவும் பகலும் ஓய்வின்றி இவ்வாறு சொல்லிக்கொண்டிருந்தன: “இருந்தவரும் இருக்கிறவரும் வந்துகொண்டிருக்கிறவருமான சர்வவல்லமையுள்ள ஆண்டவராகிய கடவுள் பரிசுத்தர், பரிசுத்தர், பரிசுத்தர்.”[a]'
  to: 'நான்கு உயிரினங்களும், அவற்றில் ஒவ்வொன்றுக்கும் ஆறு சிறகுகள் இருந்து, வெளிப்புறத்திலும் உட்புறத்திலும் கண்களால் நிறைந்திருந்தன. அவை இரவும் பகலும் ஓய்வின்றி இவ்வாறு சொல்லிக்கொண்டிருந்தன: “இருந்தவரும் இருக்கிறவரும் வருகிறவருமான சர்வவல்லமையுள்ள ஆண்டவராகிய கடவுள் பரிசுத்தர், பரிசுத்தர், பரிசுத்தர்.”[a]'
  rationale: 'சிறிய ஆனால் பாதுகாப்பான திருத்தங்கள் செய்யப்பட்டுள்ளன: மூலத்தில் இல்லாத ‘அந்த’ நீக்கப்பட்டது; கண்கள் இருப்பதற்கான வெளி/உள் இடப்பரிமாணங்கள் தெளிவுபடுத்தப்பட்டன; இறுதிக் காலச்சூத்திரத்தில் நிகழ்காலப் பெயரெச்சத்தின் அம்சத்தைப் பாதுகாக்கும், ஆனால் தமிழில் கூடுதல் தொடர்ச்சிப் பொருளை ஏற்றாத ‘வருகிறவர்’ பயன்படுத்தப்பட்டது. அடிக்குறிப்பிலுள்ள மரபான மாற்று மொழிபெயர்ப்பு தக்கவைக்கப்பட்டுள்ளது.'
