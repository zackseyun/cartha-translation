id: REV.4.8
reference: Revelation 4:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ τὰ τέσσαρα ζῷα, ἓν ⸂καθ’ ἓν⸃ ⸀αὐτῶν ⸀ἔχων ἀνὰ πτέρυγας ἕξ, κυκλόθεν καὶ ἔσωθεν γέμουσιν ὀφθαλμῶν· καὶ ἀνάπαυσιν οὐκ ἔχουσιν ἡμέρας καὶ νυκτὸς λέγοντες· Ἅγιος ἅγιος ἅγιος κύριος, ὁ θεός, ὁ παντοκράτωρ, ὁ ἦν καὶ ὁ ὢν καὶ ὁ ἐρχόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/008.yaml
  text: 'And the four living creatures[a], each one of them having six wings, are full of eyes all around and within; and they have no rest day and night, saying: “Holy, holy, holy is the Lord God, the Almighty, who was and who is and who is coming.”'
translation:
  language: ta
  text: 'நான்கு உயிரினங்களும், அவற்றில் ஒவ்வொன்றுக்கும் ஆறு சிறகுகள் இருந்து, வெளிப்புறத்திலும் உட்புறத்திலும் கண்களால் நிறைந்திருந்தன. அவை இரவும் பகலும் ஓய்வின்றி இவ்வாறு சொல்லிக்கொண்டிருந்தன: “இருந்தவரும் இருக்கிறவரும் வருகிறவருமான சர்வவல்லமையுள்ள ஆண்டவராகிய கடவுள் பரிசுத்தர், பரிசுத்தர், பரிசுத்தர்.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, மரபான மொழிபெயர்ப்பில்: “இருந்தவரும் இருக்கிறவரும் வரவிருக்கிறவருமான.”'
    reason: ὁ ἐρχόμενος என்பதற்கான மரபான எதிர்கால நோக்குடைய மாற்று மொழிபெயர்ப்பைச் சுட்டுகிறது.
lexical_decisions:
- source_word: ζῷα
  choice: உயிரினங்கள்
  rationale: இது உயிருள்ள வானுலக உருவங்களைக் குறிக்கிறது; நவீன தமிழில் விலங்குகள் என்ற குறுகிய பொருளைத் தவிர்த்து, தரிசனத்தின் உருவகத்தை இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἓν καθ’ ἓν αὐτῶν
  choice: ஒவ்வொன்றுக்கும்
  rationale: ஒவ்வொரு உயிரினத்தையும் தனித்தனியாகக் குறிக்கும் பகிர்வுப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἔχων ἀνὰ πτέρυγας ἕξ
  choice: ஆறு சிறகுகள் இருந்தன
  rationale: ஒவ்வொரு உயிரினத்துக்கும் ஆறு சிறகுகள் இருந்தன என்ற கிரேக்கத் தொடரின் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: κυκλόθεν καὶ ἔσωθεν
  choice: சுற்றிலும் உள்ளேயும்
  rationale: வெளிப்புறச் சுற்றளவும் உட்புறமும் என்ற இரு இடப்பரிமாணங்களையும் பாதுகாக்கிறது.
- source_word: γέμουσιν ὀφθαλμῶν
  choice: கண்களால் நிறைந்திருந்தன
  rationale: γέμω என்பதன் ‘நிறைந்திருத்தல்’ என்ற நேரடியான பொருளையும் தரிசனத்தின் வலுவான காட்சியையும் தக்கவைக்கிறது.
- source_word: ἀνάπαυσιν οὐκ ἔχουσιν
  choice: ஓய்வின்றி
  rationale: ‘ஓய்வு இல்லை’ என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; வெறும் பேச்சு நிறுத்தமின்மை என்று குறுக்கவில்லை.
- source_word: ἡμέρας καὶ νυκτός
  choice: இரவும் பகலும்
  rationale: இடையறாத செயல்பாட்டைக் குறிக்கும் இயல்பான தமிழ் இணைச்சொல்.
- source_word: λέγοντες
  choice: இவ்வாறு சொல்லிக்கொண்டிருந்தன
  rationale: தொடர்ச்சியான அறிவிப்பை வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத கூக்குரல் போன்ற தீவிரத்தைச் சேர்ப்பதில்லை.
- source_word: Ἅγιος ἅγιος ἅγιος
  choice: பரிசுத்தர், பரிசுத்தர், பரிசுத்தர்
  rationale: மூன்று முறை வரும் வலியுறுத்தலையும் வழிபாட்டுத் தன்மையையும் அப்படியே பாதுகாக்கிறது; தமிழில் கடவுளைக் குறிக்கும் மரியாதை ஒருமை விகுதியைப் பயன்படுத்துகிறது.
- source_word: κύριος, ὁ θεός
  choice: ஆண்டவராகிய கடவுள்
  rationale: இரு தெய்வீகப் பட்டங்களையும் வேறுபடுத்திப் பாதுகாத்து, இயல்பான தமிழ்ச் சொல்லமைப்பில் இணைக்கிறது.
- source_word: ὁ παντοκράτωρ
  choice: சர்வவல்லமையுள்ள
  rationale: எல்லா வல்லமையும் உடையவர் என்ற தெய்வீகப் பட்டத்தின் பொருளைச் சுருக்கமாகவும் தமிழில் நிலைபெற்ற முறையிலும் தருகிறது.
theological_decisions:
- issue: ὁ ἦν καὶ ὁ ὢν καὶ ὁ ἐρχόμενος என்ற தெய்வீக காலச் சூத்திரத்தின் மொழிபெயர்ப்பு
  choice: இருந்தவரும் இருக்கிறவரும் வந்துகொண்டிருக்கிறவருமான
  alternative: இருந்தவரும் இருக்கிறவரும் வரவிருக்கிறவருமான
  rationale: இறுதி உறுப்பில் உள்ள நிகழ்காலப் பெயரெச்சமான ὁ ἐρχόμενος-இன் இயக்கத்தையும் நிகழ்நிலைத் தன்மையையும் ‘வந்துகொண்டிருக்கிறவர்’ பாதுகாக்கிறது. மரபான எதிர்காலப் பொருள் கொண்ட மாற்று வாசகம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: மும்முறை ἅγιος என்பதன் இலக்கண அமைப்பு
  choice: கடவுளைக் குறிக்கும் மரியாதை ஒருமையில் ‘பரிசுத்தர்’ என்பதை மும்முறை பயன்படுத்துதல்
  alternative: ‘பரிசுத்தம், பரிசுத்தம், பரிசுத்தம்’
  rationale: இங்கு பெயரடை இறைவனைப் பற்றிய பயனிலையாக நிற்பதால், நவீன தமிழில் ‘பரிசுத்தர்’ என்பது தெளிவாகவும் வழிபாட்டு மொழிக்கு ஏற்றதாகவும் உள்ளது; மூன்றுமுறை மீளுரைத்தல் முழுமையாகத் தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய dignified வழிபாட்டு நடையைப் பயன்படுத்துகிறது. நீண்ட கிரேக்க வாக்கியம் தமிழின் இயல்புக்கேற்ப இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது; தரிசன உருவகமும் மும்முறை பரிசுத்த அறிவிப்பும் பாதுகாக்கப்பட்டுள்ளன.
