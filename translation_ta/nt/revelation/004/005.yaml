  text: καὶ ἐκ τοῦ θρόνου ἐκπορεύονται ἀστραπαὶ καὶ φωναὶ καὶ βρονταί· καὶ ἑπτὰ λαμπάδες πυρὸς καιόμεναι ἐνώπιον τοῦ θρόνου, ⸀ἅ εἰσιν ⸀τὰ ἑπτὰ πνεύματα τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/005.yaml
  text: And from the throne come flashes of lightning and sounds and peals of thunder[a]; and before the throne were seven lamps of fire burning[c][b], which are the seven spirits of God.
translation:
  language: ta
  text: அரியணையிலிருந்து மின்னல் ஒளிவீச்சுகளும், ஒலிகளும்[a], இடிமுழக்கங்களும் புறப்பட்டு வருகின்றன. அரியணைக்கு முன்பாக ஏழு தீ விளக்குகள்[b] எரிந்துகொண்டிருக்கின்றன; அவையே தேவனுடைய ஏழு ஆவிகள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஒலிகள்’ என்பதற்குப் பதிலாக ‘குரல்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘ஏழு தீப்பந்தங்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘தேவனுடைய ஏழு ஆவிகள்’ என்பது ஒரே பரிசுத்த ஆவியின் முழுமையைக் குறிக்கும் உருவகச் சொல்லாக இருப்பதாகப் பலர் புரிந்துகொள்கிறார்கள்; ஆனால் கிரேக்க மூலவுரை ‘ஏழு ஆவிகள்’ என்றே கூறுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύονται
  choice: வெளிப்படுகின்றன
  rationale: அரியணையிலிருந்து இந்நிகழ்வுகள் தொடர்ந்து தோன்றி வெளிவருவதை நிகழ்காலத்தில் இயல்பாகக் காட்டுகிறது.
- source_word: ἀστραπαὶ
  choice: மின்னல் வெட்டுகள்
  rationale: பன்மையில் வரும் தொடர்ச்சியான மின்னல் நிகழ்வுகளை நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: φωναὶ
  choice: ஒலிகள்
  rationale: φωνή என்பதற்கு ‘குரல்கள்’ என்றும் ‘ஒலிகள்’ என்றும் பொருள் இருக்கலாம். மின்னல் மற்றும் இடிமுழக்கத்துடன் வரும் இச்சூழலில் ‘ஒலிகள்’ அதிகம் இயல்பானது; மற்ற வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: βρονταί
  choice: இடிமுழக்கங்கள்
  rationale: பன்மை வடிவத்தையும் மீண்டும் மீண்டும் கேட்கும் வலிமையான இடியொலியையும் இயல்பான தமிழில் தருகிறது.
- source_word: λαμπάδες πυρὸς
  choice: தீ விளக்குகள்
  rationale: சொற்றொடரின் ‘தீயின் விளக்குகள்’ என்ற உருவகத்தை நெருக்கமாகவும் தமிழில் இயல்பாகவும் தருகிறது; λαμπάς என்பதற்கான ‘தீப்பந்தம்’ என்ற வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: καιόμεναι
  choice: எரிந்துகொண்டிருந்தன
  rationale: விளக்குகள் தொடர்ந்து எரியும் நிலையைக் காட்டும் நிகழ்காலப் பங்கேற்புச் சொல்லின் தொடர்ச்சியான தன்மையை வெளிப்படுத்துகிறது.
- source_word: ἐνώπιον τοῦ θρόνου
  choice: அரியணைக்கு முன்பாக
  rationale: விண்ணரியணைக் காட்சியின் இடவியல் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἅ εἰσιν
  choice: அவையே
  rationale: முன்னர் கூறப்பட்ட ஏழு விளக்குகளைச் சுட்டி, அவற்றின் அடையாளத்தை வலியுறுத்தும் இயல்பான தமிழாக்கம்.
- source_word: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: தேவனுடைய ஏழு ஆவிகள்
  rationale: கிரேக்க மூலத்தின் வெளிப்படையான பன்மையை அப்படியே காத்து, உருவகத்தின் பொருளை மொழிபெயர்ப்பிலேயே தீர்மானிக்காமல் விடுகிறது.
theological_decisions:
- issue: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘தேவனுடைய ஏழு ஆவிகள்’ என்று பன்மையில் மொழிபெயர்த்தல்
  alternative: ‘தேவனுடைய ஏழுமடங்கு ஆவி’ அல்லது ஒரே பரிசுத்த ஆவியின் நிறைவைக் குறிக்கும் உருவகம்
  rationale: கிரேக்க உரை ‘ஏழு ஆவிகள்’ என்று தெளிவாகப் பன்மையில் கூறுகிறது. ஒருமையாக மாற்றுவது மொழிபெயர்ப்பைத் தாண்டிய விளக்கமாகிவிடும்; ஆகவே உரையின் இறையியல் பதற்றம் காக்கப்பட்டு, பொதுவான மாற்றுப் புரிதல் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அரியணை’, ‘இடிமுழக்கங்கள்’, ‘தீ விளக்குகள்’ ஆகியவை வெளிப்படுத்தின விசேஷத்தின் காட்சிச் செறிவைத் தக்கவைக்கின்றன; மூலத்தின் சொற்சார்ந்த தெளிவின்மை அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
