id: REV.22.10
reference: Revelation 22:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ λέγει μοι· Μὴ σφραγίσῃς τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου, ὁ καιρὸς γὰρ ἐγγύς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/010.yaml
  text: And he says to me[a], “Do not seal up the words of the prophecy of this book[c][b], for the time is near.”
translation:
  language: ta
  text: 'அவர் என்னிடம் சொல்கிறார்: “இந்தப் புத்தகத்திலுள்ள தீர்க்கதரிசன வார்த்தைகளை முத்திரையிட்டு மூடிவைக்காதே[a]; ஏனெனில் காலம் நெருங்கியிருக்கிறது[b][c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “முத்திரையிடாதே,” “மறைத்து வைக்காதே.” ஒரு வெளிப்பாடு மூடிவைக்கப்படுகிறதா அல்லது வெளிப்படையாக வைக்கப்படுகிறதா என்பதைக் குறிக்கும் தீர்க்கதரிசன மொழியை இந்தச் சொற்றொடர் எதிரொலிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “காலம்” என்பது “குறிக்கப்பட்ட காலம்” என்றும் பொருள்படலாம். கிரேக்கச் சொல் καιρός ஒரு தீர்மானமான அல்லது நியமிக்கப்பட்ட காலத்தைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: தானியேல் 12:4-ஐ ஒப்பிடுக. அங்கே தீர்க்கதரிசனத்தை முத்திரையிட்டு மூடிவைக்கும்படி சொல்லப்படுகிறது; இங்கே அதற்கு எதிரான கட்டளை கொடுக்கப்படுகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: λέγει μοι
  choice: அவர் என்னிடம் சொல்கிறார்
  rationale: கிரேக்கத்தில் நிகழ்காலம் பயன்படுத்தப்பட்டுள்ளதால், வெளிப்படுத்தின விசேஷத்தின் உயிரோட்டமுள்ள கதைநடையைத் தமிழிலும் நிகழ்காலமாகப் பேணுகிறது.
- source_word: Μὴ σφραγίσῃς
  choice: முத்திரையிட்டு மூடிவைக்காதே
  rationale: σφραγίζω என்பதன் நேரடி ‘முத்திரையிடு’ என்ற உருவகத்தையும், இச்சூழலில் வெளிப்பாட்டை மூடி மறைத்துவைக்காதிருத்தல் என்ற பொருளையும் இயல்பான தமிழில் ஒருங்கே தருகிறது.
- source_word: τοὺς λόγους
  choice: வார்த்தைகளை
  rationale: λόγοι என்பதன் பன்மை வடிவத்தைப் பேணி, பொதுவான ‘செய்தி’ என்று ஒருமைப்படுத்துவதைத் தவிர்க்கிறது.
- source_word: τῆς προφητείας τοῦ βιβλίου τούτου
  choice: இந்தப் புத்தகத்திலுள்ள தீர்க்கதரிசன வார்த்தைகளை
  rationale: தொடர்ச்சியான கிரேக்க உரிமைவேற்றுமை அமைப்பைச் சொற்சொல்லாகக் கடினப்படுத்தாமல், இவ்வார்த்தைகள் இந்தப் புத்தகத்தில் உள்ள தீர்க்கதரிசனத்துக்குரியவை என்பதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ὁ καιρὸς
  choice: காலம்
  rationale: καιρός குறிக்கும் தீர்மானமான அல்லது குறிக்கப்பட்ட காலத்தின் சாத்தியத்தை மூடாமல், விரிவுரை சேர்க்காத சுருக்கமான தமிழ் தேர்வு.
- source_word: ἐγγύς ἐστιν
  choice: நெருங்கியிருக்கிறது
  rationale: காலம் அருகில் உள்ளது என்ற நெருக்கத்தைத் தெளிவாகக் கூறி, குறிப்பிட்ட இறுதிக்கால அட்டவணையை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
theological_decisions:
- issue: அபோகலிப்திய சூழலில் காலத்தின் நெருக்கம்
  choice: ஏனெனில் காலம் நெருங்கியிருக்கிறது
  alternative: ஏனெனில் குறிக்கப்பட்ட காலம் நெருங்கியிருக்கிறது
  rationale: மூலவசனம் காலம் நெருங்கியதாக வலியுறுத்துகிறது; ஆனால் அது எவ்வாறு அல்லது எந்தக் கால அட்டவணைப்படி நிறைவேறும் என்று விளக்கவில்லை. அந்தத் தெய்வீகத் தத்துவப் பதற்றத்தைத் தீர்த்துவிடாமல் மொழிபெயர்ப்பு பேணுகிறது.
- issue: தீர்க்கதரிசனத்தை முத்திரையிடாத கட்டளை
  choice: முத்திரையிட்டு மூடிவைக்காதே
  alternative: இரகசியமாக வைத்திருக்காதே
  rationale: தானியேல் 12:4-இன் தீர்க்கதரிசன மொழிக்கான ஒலிப்பைத் தக்கவைத்து, வெறும் ‘இரகசியம்’ என்ற விளக்கப் பொருளுக்குள் உருவகத்தைச் சுருக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிய வாசிப்புத் தன்மையும் கொண்ட நடை. ‘முத்திரையிட்டு மூடிவைக்காதே’ என்பது மூல உருவகத்தையும் அதன் சூழல்சார் பொருளையும் சேர்த்துக் காட்டுகிறது. ஒருமை இரண்டாம் நபர் கட்டளைக்கு இயல்பான ‘-ஆதே’ வடிவம் பயன்படுத்தப்பட்டுள்ளது.
