- from: தங்கள் அங்கிகளைத் துவைப்பவர்கள்[a][b] பேறுபெற்றவர்கள். வாழ்வின் மரத்தை அணுகும் உரிமை அவர்களுக்குக் கிடைக்கவும், வாயில்கள் வழியாக[c] அவர்கள் நகரத்திற்குள் நுழையவும் அப்படியாகும்.
  to: தங்கள் அங்கிகளைத் துவைப்பவர்கள்[a][b] பேறுபெற்றவர்கள். அவர்களுக்கு வாழ்வின் மரத்தின்மேல் உரிமை உண்டாகவும், அவர்கள் வாயில்கள் வழியாக[c] நகரத்திற்குள் நுழையவும்.
  rationale: முதல் வாக்கியமும் முக்கியச் சொற்களும் தக்கவைக்கப்பட்டுள்ளன. ἵνα-வால் இணைக்கப்படும் இரு துணைக்கூறுகளின் நோக்கம்/விளைவு தொடர்பைத் தமிழில் தெளிவாகக் காட்டுவதற்காக இயல்பற்ற «அப்படியாகும்» நீக்கப்பட்டு «உண்டாகவும் ... நுழையவும்» என அமைக்கப்பட்டது. மாற்றுப் பாட அடிக்குறிப்பு ஆங்கில audit trail-இன் பொருளுக்கு நேரடியாக ஒழுங்குபடுத்தப்பட்டது. எந்த இறையியல் விளக்கமும் முதன்மை உரையில் சேர்க்கப்படவில்லை.
