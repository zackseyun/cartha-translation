id: REV.22.14
reference: Revelation 22:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Μακάριοι οἱ ⸂πλύνοντες τὰς στολὰς αὐτῶν⸃, ἵνα ἔσται ἡ ἐξουσία αὐτῶν ἐπὶ τὸ ξύλον τῆς ζωῆς καὶ τοῖς πυλῶσιν εἰσέλθωσιν εἰς τὴν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/014.yaml
  text: Blessed are those who wash their robes[c][b][a], so that they may have the right to the tree of life and may enter the city by the gates.
translation:
  language: ta
  text: தங்கள் அங்கிகளைத் துவைப்பவர்கள்[a][b] பேறுபெற்றவர்கள். அவர்களுக்கு வாழ்வின் மரத்தின்மேல் உரிமை உண்டாகவும், அவர்கள் வாயில்கள் வழியாக[c] நகரத்திற்குள் நுழையவும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், ‘தங்கள் அங்கிகளைத் துவைப்பவர்கள்’ என்பதற்குப் பதிலாக, ‘அவருடைய கட்டளைகளைக் கடைப்பிடிப்பவர்கள்’ என்று உள்ளது.
    reason: textual_variant
  - marker: b
    text: அங்கிகளைத் துவைக்கும் இந்த உருவகம் வெளிப்படுத்தல் 7:14-ஐ எதிரொலிக்கிறது; அங்கே அங்கிகள் ஆட்டுக்குட்டியானவரின் இரத்தத்தில் துவைக்கப்பட்டு வெண்மையாக்கப்படுகின்றன.
    reason: cross_reference
  - marker: c
    text: அல்லது, ‘வாயில்களின் வழியே.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: பேறுபெற்றவர்கள்
  rationale: வெறும் மனநிலையான ‘மகிழ்ச்சி’ என்பதைவிட, இறைவனால் அருளப்படும் நிறைவான நல்வாழ்வையும் இறுதிக்காலப் பேற்றையும் குறிக்கும் வாழ்த்துரையின் வலிமையை இது காக்கிறது.
- source_word: πλύνοντες
  choice: துவைப்பவர்கள்
  rationale: ஆடைகளைத் தண்ணீரில் கழுவுதல் என்ற உருவகத்தை நேரடியாகக் காக்கிறது; நிகழ்காலப் பங்கேற்புச் சொல்லின் அடையாளப்படுத்தும் தன்மையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: στολάς
  choice: அங்கிகளை
  rationale: வெளிப்படுத்தலில் காணப்படும் அடையாளமிக்க நீண்ட ஆடை உருவகத்துக்கு ஏற்ற, dignified ஆனாலும் பொதுவாகப் புரியும் தமிழ்ச் சொல்.
- source_word: ἵνα
  choice: கிடைக்கவும் ... நுழையவும் அப்படியாகும்
  rationale: நோக்கம் அல்லது விளைவு என்ற தொடர்பை இயல்பான தமிழில் வெளிப்படுத்தி, இரு இணை வினைக்கூறுகளையும் ஒன்றாக வைத்திருக்கிறது.
- source_word: ἐξουσία
  choice: உரிமை
  rationale: இங்கு ஆட்சியதிகாரத்தையோ வல்லமையையோ அல்லாமல், முறையான அணுகல் உரிமையைக் குறிப்பதால் ‘உரிமை’ பொருத்தமானது.
- source_word: ἐπὶ τὸ ξύλον τῆς ζωῆς
  choice: வாழ்வின் மரத்தை அணுகும்
  rationale: ἐξουσία உடன் வரும் ἐπί இச்சூழலில் மரத்தின்மேல் ஆட்சி செய்வதை அல்ல, அதை அணுகும் உரிமையைக் குறிக்கிறது; தவறான உடைமை அல்லது ஆதிக்கப் பொருளைத் தவிர்க்கிறது.
- source_word: τοῖς πυλῶσιν
  choice: வாயில்கள் வழியாக
  rationale: முன்னிடைச்சொல் இல்லாத பன்மை வேற்றுமை இங்கு நகருக்குள் செல்லும் வழி அல்லது முறையைக் குறிக்கிறது; இத்தமிழ் வடிவம் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: εἰσέλθωσιν εἰς τὴν πόλιν
  choice: அவர்கள் நகரத்திற்குள் நுழையவும்
  rationale: ἵνα-வுக்குப் பின் வரும் வினையின் நோக்கம்/விளைவு நயத்தைப் பாதுகாத்து, காட்சியின் உயர்ந்த நடைக்கு ஏற்ற இயல்பான தமிழைப் பயன்படுத்துகிறது.
theological_decisions:
- issue: முதல் கூறிலுள்ள பாட வேறுபாடு
  choice: SBLGNT-இன் ‘தங்கள் அங்கிகளைத் துவைப்பவர்கள்’ என்ற பாடத்தை முதன்மை உரையில் மொழிபெயர்த்தல்
  alternative: ‘அவருடைய கட்டளைகளைக் கடைப்பிடிப்பவர்கள்’ அல்லது ‘அவருடைய கட்டளைகளின்படி நடப்பவர்கள்’
  rationale: கொடுக்கப்பட்ட கிரேக்க மூல உரை πλύνοντες τὰς στολὰς αὐτῶν என்று வாசிக்கிறது. முக்கியமான மாற்றுப் பாடம் மொழிபெயர்ப்பு மரபிலும் இறையியல் விவாதத்திலும் செல்வாக்குடையதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது; ஆனால் அது முதன்மை உரைக்குள் கொண்டுவரப்படவில்லை.
- issue: அங்கிகளைத் துவைப்பதற்கும் வாழ்வின் மரத்தை அணுகுவதற்கும் உள்ள தொடர்பு
  choice: வசனம் கூறும் தொடர்பை மட்டும் வைத்திருந்து, அது எவ்வாறு செயல்படுகிறது என்ற கூடுதல் இறையியல் விளக்கத்தைச் சேர்க்காதிருத்தல்
  alternative: துவைப்பதைத் தகுதி ஈட்டும் மனிதச் செயலாக வெளிப்படையாக விளக்குதல், அல்லது வெளிப்படுத்தல் 7:14-இன்படி ஆட்டுக்குட்டியானவரின் இரத்தத்தில் துவைத்தல் என்பதை முதன்மை உரையில் சேர்த்தல்
  rationale: வசனம் அங்கிகளைத் துவைப்பவர்களையும் அவர்களுக்குக் கிடைக்கும் அணுகல் உரிமையையும் இணைக்கிறது; ஆனால் அந்த இணைப்பின் இறையியல் செயல்முறையை இங்கே விரிவாக வரையறுக்கவில்லை. ஆகவே உருவகம் விளக்கமின்றி பாதுகாக்கப்படுகிறது; தொடர்புடைய வேதப்பகுதி அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வெளிப்படுத்தலின் காட்சிமிக்க, மாண்பான நடையைப் பேணும் வகையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பேறுபெற்றவர்கள்,’ ‘அங்கிகள்,’ ‘வாழ்வின் மரம்’ ஆகியவை வேதாகமப் பொருள் அடர்த்தியைத் தக்கவைக்கின்றன; தேவையற்ற சமயப்பிரிவு சார்ந்த விளக்கங்கள் தவிர்க்கப்பட்டுள்ளன.
