  source_fidelity: முதன்மை வாசகம் SBLGNT-இன் «தங்கள் அங்கிகளைத் துவைப்பவர்கள்» என்பதைச் சரியாகப் பிரதிபலிக்கிறது; ‘வாழ்வின் மரம்’ மற்றும் நகர நுழைவு ஆகியவையும் பொருளுக்கு ஏற்ப உள்ளன. ஆனால் «அப்படியாகும்» என்பது ἵνα-வின் நோக்கம்/விளைவு இணைப்பைத் தெளிவற்றதாகவும் தமிழில் இயல்பற்றதாகவும் ஆக்குகிறது. «அவர்களுக்கு ... உரிமை உண்டாகவும் ... நுழையவும்» என்பது கிரேக்கத் தொடர்பை நேரடியாகக் காட்டும்.
  naturalness: «தங்கள் அங்கிகளைத் துவைப்பவர்கள் பேறுபெற்றவர்கள்» இயல்பான, மாண்பான நவீனத் தமிழ். இரண்டாம் வாக்கியத்தில் உள்ள «கிடைக்கவும் ... நுழையவும் அப்படியாகும்» என்ற கட்டமைப்பு மட்டும் வழுவழுப்பற்றது. அதை «அவர்களுக்கு வாழ்வின் மரத்தின்மேல் உரிமை உண்டாகவும், அவர்கள் வாயில்கள் வழியாக நகரத்திற்குள் நுழையவும்» என மாற்றுவது தெளிவாகவும் செம்மையாகவும் இருக்கும்.
  terminology: «பேறுபெற்றவர்கள்», «அங்கிகள்», «வாழ்வின் மரம்», «உரிமை», «வாயில்கள்» ஆகிய தேர்வுகள் பொருத்தமானவை. «வாழ்வின் மரத்தை அணுகும் உரிமை» பொருளில் ஏற்றதே; ஆயினும் ἐξουσία ἐπὶ என்ற அமைப்பின் சுருக்கமான நேரடித் தன்மையை «வாழ்வின் மரத்தின்மேல் உரிமை» நன்றாகக் காக்கிறது. அடிக்குறிப்பு a-வில் மாற்றுப் பாடமான «do his commandments» என்பதற்கு «அவருடைய கட்டளைகளைக் கடைப்பிடிப்பவர்கள்» போதுமானது; «கட்டளைகளின்படி நடப்பவர்கள்» என்பது சற்றே விளக்கவுரையாக உள்ளது.
