  source_fidelity: 'The draft accurately follows the SBLGNT reading: the conditional warning concerns removing something from the words of this prophetic book, and God''s reciprocal action removes the person''s share from the tree of life and the holy city. The final participial phrase is appropriately connected to both referents. The textual-variant footnote correctly preserves the significant alternative “book of life.”'
