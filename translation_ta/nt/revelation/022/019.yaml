id: REV.22.19
reference: Revelation 22:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ἀφέλῃ ἀπὸ τῶν λόγων τοῦ βιβλίου τῆς προφητείας ταύτης, ⸀ἀφελεῖ ὁ θεὸς τὸ μέρος αὐτοῦ ἀπὸ τοῦ ξύλου τῆς ζωῆς καὶ ἐκ τῆς πόλεως τῆς ἁγίας, τῶν γεγραμμένων ἐν τῷ βιβλίῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/019.yaml
  text: and if anyone takes away from the words of the book of this prophecy[a], God will take away his share from the tree of life and from the holy city, which are written in this book.
translation:
  language: ta
  text: இந்தத் தீர்க்கதரிசனப் புத்தகத்தின் வார்த்தைகளிலிருந்து யாராவது எதையாவது நீக்கினால், இந்தப் புத்தகத்தில் எழுதப்பட்டுள்ள வாழ்வின் மரத்திலும்[a] பரிசுத்த நகரத்திலும் அவருக்குரிய பங்கைத் தேவன் நீக்கிவிடுவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் ‘வாழ்வின் மரம்’ என்பதற்குப் பதிலாக ‘வாழ்வின் புத்தகம்’ என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: ἀφέλῃ / ἀφελεῖ
  choice: நீக்கினால் / நீக்கிவிடுவார்
  rationale: நிபந்தனை வாக்கியத்திலும் அதன் விளைவிலும் வரும் ஒரே வினைச்சொல்லின் திட்டமிட்ட எதிரொலியைத் தமிழிலும் காக்கிறது.
- source_word: λόγων
  choice: வார்த்தைகளிலிருந்து
  rationale: தீர்க்கதரிசனத்தின் மொழிவடிவ உள்ளடக்கத்தைக் குறிக்கும் நேரடியான, கண்ணியமான மொழிபெயர்ப்பு.
- source_word: βιβλίου τῆς προφητείας ταύτης
  choice: இந்தத் தீர்க்கதரிசனப் புத்தகத்தின்
  rationale: மூலத்தின் உறவுத்தொடரை இயல்பான நவீனத் தமிழில் தெளிவாக வழங்குகிறது.
- source_word: μέρος
  choice: பங்கு
  rationale: ஒருவருக்குரிய பங்கேற்பு அல்லது உரிமைப் பகுதியை இயல்பாக உணர்த்துகிறது.
- source_word: ξύλου τῆς ζωῆς
  choice: வாழ்வின் மரம்
  rationale: வெளிப்படுத்தல் 22-ன் உடனடிச் சூழலில் உள்ள உயிரளிக்கும் மரத்தைக் குறிக்கிறது; மரபான ‘ஜீவவிருட்சம்’ என்பதைக் காட்டிலும் இன்றைய வாசகருக்கு நேரடியாகப் புரியும்.
- source_word: πόλεως τῆς ἁγίας
  choice: பரிசுத்த நகரம்
  rationale: வேதாகமப் பயன்பாட்டில் நிலைபெற்றதும் நவீன வாசகருக்குப் புரியக்கூடியதுமான இணைச்சொல்.
- source_word: τῶν γεγραμμένων ἐν τῷ βιβλίῳ τούτῳ
  choice: இந்தப் புத்தகத்தில் எழுதப்பட்டுள்ள
  rationale: γεγραμμένων என்பதன் நிறைவேற்றப்பட்ட செயப்பாட்டு பொருளைக் காத்து, வாழ்வின் மரம் மற்றும் பரிசுத்த நகரம் ஆகிய இரண்டோடும் இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: ‘வாழ்வின் மரம்’ என்பதற்குப் பதிலாக ‘வாழ்வின் புத்தகம்’ என்று வாசிக்கும் பாடவேறுபாடு
  choice: வாழ்வின் மரம்
  alternative: வாழ்வின் புத்தகம்
  rationale: வழங்கப்பட்ட SBLGNT மூலத்தில் ξύλου τῆς ζωῆς உள்ளது; இது வெளிப்படுத்தல் 22-ன் உடனடிச் சூழலுக்கும் பொருந்துகிறது. குறிப்பிடத்தக்க மாற்றுப் பாடம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: τῶν γεγραμμένων என்ற பன்மைத் தொடரின் தொடர்பு
  choice: வாழ்வின் மரம் மற்றும் பரிசுத்த நகரம் ஆகிய இரண்டையும் குறிக்கும் வகையில் அமைத்தல்
  alternative: அருகிலுள்ள பரிசுத்த நகரத்தை மட்டும் குறித்தல்
  rationale: பன்மை வடிவமும் வாக்கிய அமைப்பும் இரு ஆசீர்வாதங்களையும் உள்ளடக்குவதற்கு ஆதரவாக உள்ளன; தமிழ் சொல்வரிசை இதைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமும் எளிய புரிதலும் இணைக்கப்பட்டுள்ளன. ‘யாராவது எதையாவது நீக்கினால்’ என்பது கிரேக்கத்தின் ἐάν τις ἀφέλῃ ἀπό என்ற நிபந்தனையை இயல்பாக வெளிப்படுத்துகிறது. ‘அவருக்குள்ள பங்கு’ என்பது பாலினப் பொதுமையைத் தமிழில் இயல்பாகக் காக்கிறது.
