  terminology: “தீர்க்கதரிசனப் புத்தகம்,” “வார்த்தைகள்,” “வாழ்வின் மரம்,” and “பரிசுத்த நகரம்” are appropriate, comprehensible renderings. The footnote wording accurately identifies the variant without privileging it over the SBLGNT reading.
