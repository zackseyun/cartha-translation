id: REV.22.5
reference: Revelation 22:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ νὺξ οὐκ ἔσται ⸀ἔτι, καὶ ⸂οὐκ ἔχουσιν χρείαν⸃ ⸀φωτὸς λύχνου καὶ ⸀φῶς ἡλίου, ὅτι κύριος ὁ θεὸς φωτίσει ⸀ἐπ’ αὐτούς, καὶ βασιλεύσουσιν εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/005.yaml
  text: And night will be no more[a], and they will have no need of lamplight or sunlight, because the Lord God will shine on them[b], and they will reign forever and ever.
translation:
  language: ta
  text: இரவு இனி இருக்காது. விளக்கின் ஒளியோ சூரியனின் ஒளியோ அவர்களுக்குத் தேவைப்படாது[a]. ஏனெனில் ஆண்டவராகிய கடவுள் அவர்கள்மேல் ஒளிவீசுவார். அவர்கள் என்றென்றும் அரசாளுவார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் சொல்லர்த்தமாக, ‘அவர்களுக்குத் தேவையில்லை’ என்று நிகழ்கால வடிவில் உள்ளது.
    reason: temporal_ambiguity
  - marker: b
    text: கிரேக்கத்தில் சொல்லர்த்தமாக, ‘காலங்களின் காலங்களுக்குள்’; இது முடிவில்லாத காலத்தைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: νὺξ
  choice: இரவு
  rationale: அடிப்படைப் பொருளான ‘இரவு’ என்பதை இயல்பான நவீனத் தமிழில் நேரடியாகக் கொடுக்கிறது.
- source_word: οὐκ ἔσται ἔτι
  choice: இனி இருக்காது
  rationale: இனி ஒருபோதும் அது இருக்காது என்ற முடிவுற்ற நிலையைச் சுருக்கமாகவும் மேன்மையான நடையிலும் வெளிப்படுத்துகிறது.
- source_word: οὐκ ἔχουσιν χρείαν
  choice: அவர்களுக்குத் தேவைப்படாது
  rationale: கிரேக்கத்தில் நிகழ்கால வடிவம் இருந்தாலும், சுற்றியுள்ள எதிர்கால வினைகளுடன் பொருந்தும் வகையில் தீர்க்கதரிசனக் காட்சியின் எதிர்காலப் பொருள் தமிழில் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது; மூல வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: φωτὸς λύχνου
  choice: விளக்கின் ஒளி
  rationale: மூலத்தின் உரிமைத் தொடர்பைத் தெளிவாகப் பாதுகாக்கும் இயல்பான தமிழ்.
- source_word: φῶς ἡλίου
  choice: சூரியனின் ஒளி
  rationale: விளக்கின் ஒளியுடன் உள்ள இணையான அமைப்பையும் மூலச் சொல்லாட்சியையும் பாதுகாக்கிறது.
- source_word: κύριος ὁ θεός
  choice: ஆண்டவராகிய கடவுள்
  rationale: κύριος என்பதற்கு ‘ஆண்டவர்’ என்றும் ὁ θεός என்பதற்கு ‘கடவுள்’ என்றும் வழங்கி, இரண்டையும் இயல்பான தமிழில் ஒரே அடையாளக் குறிப்பாக இணைக்கிறது.
- source_word: φωτίσει ἐπ’ αὐτούς
  choice: அவர்கள்மேல் ஒளிவீசுவார்
  rationale: ἐπί தரும் திசைசார்ந்த ‘மேல்’ என்ற படிமத்தையும் ஒளி வீசும் செயலையும் தெளிவாகக் காக்கிறது.
- source_word: βασιλεύσουσιν
  choice: அரசாளுவார்கள்
  rationale: அரசர்களாக ஆட்சி செய்வதை உணர்த்தும் வினையின் பொருளை, தேவையற்ற விளக்கமின்றி இயல்பான தமிழில் தருகிறது.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: என்றென்றும்
  rationale: முடிவில்லாத காலத்தைச் சுட்டும் கிரேக்க மரபுத்தொடரின் இயல்பான தமிழ் இணை; சொற்சொற் வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
theological_decisions:
- issue: எதிர்காலக் காட்சியில் οὐκ ἔχουσιν χρείαν என்பதன் காலக் குறிப்பு
  choice: ‘அவர்களுக்குத் தேவைப்படாது’ என்று எதிர்காலத்தில் மொழிபெயர்த்தல்
  alternative: ‘அவர்களுக்குத் தேவையில்லை’ என்று கிரேக்க நிகழ்கால வடிவை நெருக்கமாகப் பின்பற்றுதல்
  rationale: ἔχουσιν நிகழ்காலத்தில் இருந்தாலும், ἔσται, φωτίσει, βασιλεύσουσιν ஆகிய எதிர்கால வினைகளால் சூழப்பட்ட தீர்க்கதரிசனக் காட்சியில் இது எதிர்கால நிலையை உயிரோட்டமாக விவரிக்கிறது. தமிழில் எதிர்காலம் சூழலின் கால ஒத்திசைவைத் தெளிவாக்குகிறது; மூல வடிவின் நுணுக்கம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: κύριος ὁ θεός என்பதன் தொடர்பு
  choice: ‘ஆண்டவராகிய கடவுள்’
  alternative: ‘ஆண்டவர் கடவுள்’
  rationale: இரு பெயர்களையும் தனித்தனி நபர்களாகத் தோற்றுவிக்காமல், ஒரே நபரைக் குறிக்கும் கிரேக்க அமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- issue: βασιλεύσουσιν குறிக்கும் ஆட்சியின் தன்மை
  choice: ‘அரசாளுவார்கள்’ என்று மட்டும் வழங்குதல்
  alternative: ‘அரசர்களாக ஆட்சி செய்வார்கள்’
  rationale: வினையில் உள்ள அரச ஆட்சிப் பொருளைத் தக்கவைத்தபடியே, யார் மீது அல்லது எந்த நிர்வாக அமைப்பில் ஆட்சி செய்வார்கள் என்று மூலத்தில் இல்லாத விவரத்தைச் சேர்க்காமல் விடுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வெளிப்படுத்தின விசேஷத்தின் மேன்மையான தரிசன நடையைத் தக்கவைக்கும் சுருக்கமான உரை. ‘விளக்கின் ஒளி / சூரியனின் ஒளி’ என்ற இணை அமைப்பு மூலத்தின் சமச்சீரை காக்கிறது; ‘ஒளிவீசுவார்’ என்பது காட்சியின் ஒளிப் படிமத்தை இயல்பாகத் தொடர்கிறது.
