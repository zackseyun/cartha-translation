id: REV.22.4
reference: Revelation 22:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὄψονται τὸ πρόσωπον αὐτοῦ, καὶ τὸ ὄνομα αὐτοῦ ἐπὶ τῶν μετώπων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/004.yaml
  text: and they will see his face[b][a], and his name will be on their foreheads.
translation:
  language: ta
  text: அவர்கள் அவருடைய முகத்தைக் காண்பார்கள்[a]; அவருடைய பெயர் அவர்களுடைய நெற்றிகளில் இருக்கும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவருடைய முகத்தை நோக்கிக் காண்பார்கள்.’
    reason: lexical_alternative
  - marker: b
    text: ‘அவருடைய’ என்ற ஒருமைச் சொல் தேவனைக் குறிக்கலாம்; அல்லது உடனடி சூழலில் தேவனும் ஆட்டுக்குட்டியானவரும் பகிரும் தெய்வீக ஆட்சியைப் பிரதிபலிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ὄψονται
  choice: காண்பார்கள்
  rationale: ὁράω என்பதன் எதிர்கால வடிவம் இங்கு நேரடியான ‘காண்பார்கள்’ என்ற பொருளைத் தருகிறது. இது நவீனத் தமிழில் இயல்பாகவும், காட்சியின் நேரடி வலிமையைத் தக்கவைத்தும் உள்ளது.
- source_word: πρόσωπον
  choice: முகம்
  rationale: இச்சூழலில் நேரடிப் பொருளான ‘முகம்’ என்பதே பொருத்தமானது. ‘சந்நிதி’ அல்லது ‘முன்னிலை’ என விரிவுபடுத்துவது மூலத்தின் காட்சிசார் மற்றும் உறவுசார் வலிமையைக் குறைக்கும்.
- source_word: ὄνομα
  choice: பெயர்
  rationale: ὄνομα என்பதற்கான வழக்கமான நேரடி இணை. அடையாளம், உரிமை, குணம் போன்ற உட்பொருள்கள் இருக்கக்கூடியபோதும், அவற்றை மொழிபெயர்ப்பிலேயே விளக்கமாகச் சேர்க்காமல் ‘பெயர்’ எனத் தக்கவைக்கப்படுகிறது.
- source_word: ἐπὶ τῶν μετώπων αὐτῶν
  choice: அவர்களுடைய நெற்றிகளில்
  rationale: ἐπί + genitive இங்கு மேற்பரப்பில் இருப்பதைக் குறிக்கிறது. கிரேக்கப் பன்மையைத் தக்கவைத்து, இயல்பான தமிழில் ‘அவர்களுடைய நெற்றிகளில்’ என வழங்கப்படுகிறது.
- source_word: καὶ
  choice: ;
  rationale: இரண்டாவது καί இணைக்கும் இரு நெருங்கிய கூற்றுகள் தமிழில் அரைப்புள்ளியால் இயல்பாக இணைக்கப்படுகின்றன; அதன் சேர்க்கைத் தொடர்பு தக்கவைக்கப்படுகிறது. வசனத்தின் தொடக்க καί முந்தைய வசனத்துடனான தொடர்ச்சியைச் சுட்டினாலும், தனி வசனத் தமிழில் செயற்கையான தொடக்க ‘மேலும்’ தவிர்க்கப்பட்டுள்ளது.
- source_word: αὐτοῦ
  choice: அவருடைய
  rationale: கிரேக்க ஒருமை உரிமைப்பெயர் நேரடியாக ‘அவருடைய’ என மொழிபெயர்க்கப்படுகிறது. ‘தேவனுடைய’ அல்லது ‘ஆட்டுக்குட்டியானவருடைய’ என்று வெளிப்படையாக மாற்றாமல், மூலத்தின் சூழல்சார் தெளிவின்மையும் இறையியல் அழுத்தமும் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: ‘அவருடைய முகம்’ மற்றும் ‘அவருடைய பெயர்’ என்பவற்றிலுள்ள ஒருமை உரிமைப்பெயரின் குறிப்பு
  choice: யாரைக் குறிக்கிறது என்று பெயரிட்டு விளக்காமல் ‘அவருடைய’ என்ற ஒருமை உரிமைப்பெயரைத் தக்கவைத்தல்
  alternative: ‘தேவனுடைய’ என்று வெளிப்படுத்துதல்; அல்லது உடனடி சூழலில் தேவனும் ஆட்டுக்குட்டியானவரும் பகிரும் ஆட்சியை முன்னிறுத்தி இருவரையும் குறிப்பதாக விளக்குதல்
  rationale: வெளிப்படுத்தல் 22:3-இன் உடனடி சூழலில் தேவனும் ஆட்டுக்குட்டியானவரும் நெருக்கமாக இணைக்கப்படுகின்றனர்; ஆனால் 22:4 ஒருமை αὐτοῦ என்பதையே பயன்படுத்துகிறது. ஆகவே மொழிபெயர்ப்பு அந்தக் குறிப்பை மூலத்தைவிடக் குறுகலாகத் தீர்மானிக்காமல், உண்மையான இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையானதாயினும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘காண்பார்கள்’, ‘முகம்’, ‘பெயர்’, ‘நெற்றிகள்’ ஆகிய நேரடி சொற்கள் மூலத்தின் காட்சிசார் தெளிவைத் தக்கவைக்கின்றன. ‘அவருடைய’ என்பதன் குறிப்பு திட்டமிட்டு விளக்கித் தீர்க்கப்படவில்லை. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
