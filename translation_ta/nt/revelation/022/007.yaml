  source_fidelity: 'மூலக் கிரேக்கத்தின் எல்லா முக்கியக் கூறுகளும் துல்லியமாக உள்ளன: καὶ ἰδού என்பதன் கவனஈர்ப்பு ‘இதோ’வால், எதிர்கால நோக்கமுள்ள ἔρχομαι ‘நான் ... வருகிறேன்’ என்பதனால், ταχύ-வின் கால-அண்மை ‘விரைவில்’ என்பதனால், மற்றும் μακάριος/ὁ τηρῶν ஆகியவை ‘பேறுபெற்றவர்’/‘கடைப்பிடிக்கிறவர்’ என்பவற்றால் நன்றாக வழங்கப்பட்டுள்ளன. ‘இந்த நூலின் தீர்க்கதரிசன வார்த்தைகள்’ என்பது τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου என்ற தொடர்பைத் தக்கவைக்கிறது.'
