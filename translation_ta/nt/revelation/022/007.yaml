id: REV.22.7
reference: Revelation 22:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἔρχομαι ταχύ· μακάριος ὁ τηρῶν τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/007.yaml
  text: And behold[a], I am coming soon[b]. Blessed is the one who keeps the words of the prophecy of this book.
translation:
  language: ta
  text: “இதோ, நான் விரைவில்[a] வருகிறேன். இந்த நூலின்[b] தீர்க்கதரிசன வார்த்தைகளைக் கடைப்பிடிக்கிறவர் பேறுபெற்றவர்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வேகமாக’ அல்லது ‘திடீரென’ என்றும் பொருள்படலாம்; கிரேக்கச் சொல் கால நெருக்கத்தையோ வருகையின் வேகம் அல்லது திடீர்த்தன்மையையோ வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘இந்தச் சுருளின்.’
    reason: cultural_note
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் சுட்டும் வலிமையையும் வெளிப்பாட்டின் கம்பீரமான தொனியையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἔρχομαι
  choice: நான் வருகிறேன்
  rationale: நிகழ்கால வடிவத்தின் எதிர்கால நோக்கையும் வருகையின் அண்மைத்தன்மையையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ταχύ
  choice: விரைவில்
  rationale: இச்சூழலில் முதன்மையாக கால நெருக்கத்தைத் தெரிவிக்கிறது; அதேவேளையில் வேகமாக அல்லது திடீரென என்ற சாத்தியத்தையும் அடிக்குறிப்பில் காக்கிறது.
- source_word: μακάριος
  choice: பேறுபெற்றவர்
  rationale: வெறும் மனமகிழ்ச்சியைக் காட்டிலும் இறைவனால் கிடைக்கும் நல்வாழ்வையும் இறுதிக்காலப் பேற்றையும் உணர்த்துகிறது.
- source_word: ὁ τηρῶν
  choice: கடைப்பிடிக்கிறவர்
  rationale: வார்த்தைகளை மதித்துக் காத்து அவற்றின்படி நடப்பது என்ற கருத்தை இயல்பான நவீன தமிழில் தருகிறது; ‘கீழ்ப்படிகிறவர்’ என்பதைவிட மூலச்சொல்லின் பரப்பைச் சுருக்காமல் காக்கிறது.
- source_word: τοὺς λόγους τῆς προφητείας
  choice: தீர்க்கதரிசன வார்த்தைகளை
  rationale: λόγους என்பதன் பன்மையையும் προφητείας உடனான உறவையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: τοῦ βιβλίου τούτου
  choice: இந்த நூலின்
  rationale: வெளிப்படுத்தின விசேஷம் தன்னையே சுட்டும் விதத்தை இயல்பாகத் தருகிறது; பழங்காலச் சுருளைக் குறிக்கும் சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: ‘நான் விரைவில் வருகிறேன்’ என்று கூறுபவரின் அடையாளம்
  choice: மூலத்தில் உள்ள முதலாம் நபர் உரையை மட்டும் மொழிபெயர்த்து, பேசுபவரின் பெயரைச் சேர்க்கவில்லை.
  alternative: வசனத்திற்குள் ‘இயேசு’ என்ற பெயரை வெளிப்படையாகச் சேர்த்தல்.
  rationale: கிரேக்க உரையில் இங்கு பெயர் இல்லை; இலக்கியச் சூழலே பேசுபவரை அடையாளப்படுத்த அனுமதிக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், வெளிப்பாட்டு இலக்கியத்திற்கேற்ற கம்பீரத்துடன் வடிவமைக்கப்பட்டது. ‘இதோ’ என்ற கவன ஈர்ப்புச் சொல் காக்கப்பட்டது; வழக்கற்ற சமயச் சொல்லாடலைத் தவிர்த்து ‘பேறுபெற்றவர்’ மற்றும் ‘கடைப்பிடிக்கிறவர்’ பயன்படுத்தப்பட்டன.
