id: REV.22.13
reference: Revelation 22:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐγὼ τὸ Ἄλφα καὶ τὸ Ὦ, ὁ πρῶτος καὶ ὁ ἔσχατος, ⸀ἡ ἀρχὴ καὶ ⸀τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/013.yaml
  text: I am the Alpha and the Omega[a], the first and the last, the beginning and the end.
translation:
  language: ta
  text: “நானே அல்பாவும் ஒமேகாவும், முதலும் கடைசியும், தொடக்கமும் முடிவும்.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தோற்றுவாயும் இலக்கும்.”
    reason: ἀρχή மற்றும் τέλος ஆகிய சொற்கள் முறையே ‘தோற்றுவாய்’ மற்றும் ‘இலக்கு’ என்ற பொருள்களையும் தரக்கூடும்.
lexical_decisions:
- source_word: ἐγὼ
  choice: நானே
  rationale: கிரேக்கத்தில் வெளிப்படையாக இடம்பெறும் முதலாம் நபர் சுட்டுப்பெயரின் வலியுறுத்தலை இயல்பான தமிழில் ‘நானே’ என்று வெளிப்படுத்துகிறது.
- source_word: τὸ Ἄλφα
  choice: அல்பா
  rationale: கிரேக்க எழுத்துமுறையின் முதல் எழுத்தைக் குறிக்கும் வெளிப்படுத்தின விசேஷத்தின் நிலையான அடையாளப் பட்டத்தை ஒலிபெயர்த்து வைத்திருக்கிறது.
- source_word: τὸ Ὦ
  choice: ஒமேகா
  rationale: கிரேக்க எழுத்துமுறையின் கடைசி எழுத்தைக் குறிக்கும் நிலையான அடையாளப் பட்டத்தைப் பாதுகாக்கிறது; அதைத் தமிழின் கடைசி எழுத்தாக மாற்றவில்லை.
- source_word: ὁ πρῶτος
  choice: முதலானவர்
  rationale: ஒரு நபரைக் குறிக்கும் பட்டமாகச் செயல்படும் பெயரடை வடிவத்தை இயல்பான தமிழில் காட்டுகிறது; ‘கடைசியானவர்’ என்பதோடு இணையான அமைப்பையும் காக்கிறது.
- source_word: ὁ ἔσχατος
  choice: கடைசியானவர்
  rationale: πρῶτος என்பதற்கு நேரான எதிரிணையாகவும் பட்டமாகவும் இயங்கும் பொருளைப் பாதுகாக்கிறது.
- source_word: ἡ ἀρχὴ
  choice: தொடக்கம்
  rationale: ‘முடிவு’ என்பதுடன் உள்ள இலக்கிய இணைப்பையும் அனைத்தையும் உள்ளடக்கும் காலவெளிப் பொருளையும் தெளிவாகக் காக்கும் நவீனத் தமிழ் சொல்.
- source_word: τὸ τέλος
  choice: முடிவு
  rationale: ‘தொடக்கம்’ என்பதற்கான இயல்பான இணையாக இருந்து, சுருக்கமான பட்டத் தொடரின் சமநிலையைப் பாதுகாக்கிறது; ‘இலக்கு’ என்ற சாத்தியமான நுண்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: மூன்று இணைப் பட்டங்களையும் நித்தியத்தையும் முழுமையான இறையாட்சியையும் குறிக்கும் உயரிய சுயஅறிவிப்பாக மொழிபெயர்க்கும்போது அதன் மறைபொருளை அளவுக்கு மீறி விளக்காதிருத்தல்
  choice: நானே அல்பாவும் ஒமேகாவும், முதலானவரும் கடைசியானவரும், தொடக்கமும் முடிவும்.
  alternative: நானே அல்பாவும் ஒமேகாவும், முதலும் இறுதியும், தோற்றுவாயும் இலக்கும்.
  rationale: மூலத்தின் மூன்று இணைப்பட்ட பட்டங்களையும் அவற்றின் சமச்சீர் அமைப்பையும் மொழிபெயர்ப்பு காக்கிறது. ἀρχή மற்றும் τέλος என்பவற்றில் ‘தோற்றுவாய்’ மற்றும் ‘இலக்கு’ என்ற நுண்பொருள்கள் இருக்கக்கூடும்; அவற்றில் ஒன்றை மட்டும் முதன்மை உரையில் தேர்ந்தெடுத்து இறையியல் கருத்தைச் சுருக்காமல், இயல்பான ‘தொடக்கம்—முடிவு’ இணை முதன்மைப்படுத்தப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் வெளிப்படுத்தின விசேஷத்தின் கண்ணியமான, அறிவிப்புத் தொனியைப் பாதுகாக்கும் வகையிலும் அமைக்கப்பட்டுள்ளது. ‘அல்பா’, ‘ஒமேகா’ ஆகிய நிலையான அடையாளப் பெயர்கள் மொழிமாற்றமின்றி ஒலிபெயர்க்கப்பட்டுள்ளன.
