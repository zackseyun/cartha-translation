id: REV.22.11
reference: Revelation 22:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ ἀδικῶν ἀδικησάτω ἔτι, καὶ ὁ ῥυπαρὸς ⸀ῥυπαρευθήτω ἔτι, καὶ ὁ δίκαιος δικαιοσύνην ποιησάτω ἔτι, καὶ ὁ ἅγιος ἁγιασθήτω ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/011.yaml
  text: Let the one who does wrong still do wrong, and the filthy still be made filthy, and the righteous still practice righteousness, and the holy still be made holy.
translation:
  language: ta
  text: அநியாயம் செய்கிறவர் இன்னும் அநியாயம் செய்யட்டும்; அசுத்தமானவர் இன்னும் அசுத்தமாக்கப்படட்டும்[a]; நீதிமான் இன்னும் நீதியான நடத்தை செய்யட்டும்[b]; பரிசுத்தமானவர் இன்னும் பரிசுத்தமாக்கப்படட்டும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அசுத்தமானவர் இன்னும் அசுத்தமாகவே இருக்கட்டும்.’ கிரேக்க வினை செயப்பாட்டு வடிவில் உள்ளது; அதன் பொருளை இயல்பாகச் சொல்ல இவ்வாறும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நீதிமான் இன்னும் நீதியைச் செய்யட்டும்.’ δικαιοσύνη என்ற கிரேக்கச் சொல் ‘நீதியான நடத்தை’ என்றும் ‘நீதி’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘பரிசுத்தமானவர் இன்னும் பரிசுத்தப்படுத்தப்படட்டும்.’ கிரேக்க வினை ‘பரிசுத்தமாக்கப்படுதல்’ அல்லது ‘பரிசுத்தப்படுத்தப்படுதல்’ என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἀδικῶν / ἀδικησάτω
  choice: அநியாயம் செய்கிறவர் / அநியாயம் செய்யட்டும்
  rationale: பெயர்ச்சொல் போலச் செயல்படும் நிகழ்காலப் பங்கேற்புச் சொல்லின் வினைத் தன்மையையும், மூன்றாம் நபர் கட்டளை வடிவின் வலிமையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἔτι
  choice: இன்னும்
  rationale: நான்கு கூறுகளிலும் தொடர்ச்சி அல்லது நீடிப்பைக் குறிக்கும் மீள்வரும் வினையடையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ὁ ῥυπαρός / ῥυπαρευθήτω
  choice: அசுத்தமானவர் / அசுத்தமாக்கப்படட்டும்
  rationale: ῥυπαρός என்பதிலுள்ள ஒழுக்க மற்றும் தீட்டுக் கருத்துகளை ‘அசுத்தமானவர்’ எடுத்துரைக்கிறது; ῥυπαρευθήτω என்பதன் செயப்பாட்டு வடிவை ‘அசுத்தமாக்கப்படட்டும்’ காக்கிறது.
- source_word: ὁ δίκαιος / δικαιοσύνην ποιησάτω
  choice: நீதிமான் / நீதியைச் செய்யட்டும்
  rationale: δίκαιος என்பதற்கு வழக்கமான, கண்ணியமான தமிழ்ச் சொல்லைத் தேர்ந்தெடுத்து, δικαιοσύνην ποιεῖν என்ற செயற்பாட்டு சொற்றொடரை மூலத்திற்கு நெருக்கமாக வழங்குகிறது.
- source_word: ὁ ἅγιος / ἁγιασθήτω
  choice: பரிசுத்தமானவர் / பரிசுத்தமாக்கப்படட்டும்
  rationale: ἅγιος என்பதன் பரிசுத்தக் கருத்தையும் ἁγιασθήτω என்பதன் செயப்பாட்டு கட்டளை வடிவையும் வெளிப்படையாகக் காக்கிறது.
theological_decisions:
- issue: இறுதி ஒழுக்கநிலை பற்றிய சூழலில் கட்டளை வடிவின் பொருள்
  choice: நான்கு வினைகளையும் ‘…ட்டும்’ என்ற மூன்றாம் நபர் கட்டளைகளாக மொழிபெயர்த்தல்
  alternative: ‘தொடர்ந்து செய்வார்/ஆவார்’ என்ற முன்னறிவிப்பாக மொழிபெயர்த்தல்
  rationale: கிரேக்க வடிவங்கள் கட்டளைகள்; அவை தீமையை அங்கீகரிப்பதாக விளக்காமலும், வெறும் முன்னறிவிப்பாக மாற்றாமலும் உரையின் கடுமையான நீதித்தீர்ப்புத் தொனியையும் இறையியல் பதற்றத்தையும் காக்க வேண்டும்.
- issue: ῥυπαρευθήτω மற்றும் ἁγιασθήτω ஆகியவற்றின் செயப்பாட்டு வினை வடிவம்
  choice: ‘அசுத்தமாக்கப்படட்டும்’ மற்றும் ‘பரிசுத்தமாக்கப்படட்டும்’ என்று செயப்பாட்டு வடிவைக் காத்தல்
  alternative: ‘அசுத்தமாகவே இருக்கட்டும்’ மற்றும் ‘பரிசுத்தமாகவே இருக்கட்டும்’
  rationale: இரு கிரேக்க வினைகளும் செயப்பாட்டு வடிவில் உள்ளன. செயலைச் செய்பவர் யார் என்பதைத் தீர்மானிக்காமல் விட்டு, மூலத்தின் இலக்கண வடிவத்தையும் இறையியல் தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. நான்கு இணை கூறுகளின் அமைப்பும் மீள்வரும் ‘இன்னும்’ என்பதும் காக்கப்பட்டுள்ளன; செயப்பாட்டு வடிவங்கள் சற்றுக் கடினமாக இருந்தாலும் மூலத்தின் திட்டமிட்ட அதிர்ச்சியையும் மறைமுகச் செயற்பாட்டாளரையும் பாதுகாக்கின்றன.
