id: REV.22.8
reference: Revelation 22:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Κἀγὼ Ἰωάννης ὁ ἀκούων καὶ βλέπων ταῦτα. καὶ ὅτε ἤκουσα καὶ ἔβλεψα, ἔπεσα προσκυνῆσαι ἔμπροσθεν τῶν ποδῶν τοῦ ἀγγέλου τοῦ δεικνύοντός μοι ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/008.yaml
  text: And I[a], John, am the one hearing and seeing these things. And when I heard and saw, I fell down to worship before the feet of the angel who was showing me these things.
translation:
  language: ta
  text: மேலும், யோவானாகிய நானே இவற்றைக் கேட்டும் கண்டும் இருப்பவன். நான் இவற்றைக் கேட்டும் கண்டபோது, இவற்றை எனக்குக் காட்டுகிற தூதனின் கால்களுக்கு முன்பாக வழிபடுவதற்காக விழுந்தேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவனுக்கு முன்பாகப் பணிய’ அல்லது ‘அவனுக்கு மரியாதை செலுத்த.’ கிரேக்க வினை தரையில் பணிவதையோ ஆழ்ந்த மரியாதை செலுத்துவதையோ குறிக்கலாம். வெளிப்படுத்தல் நூலில் அது பொதுவாகக் கொண்டிருக்கும் பொருளாலும் அடுத்த வசனத்தில் வரும் கண்டிப்பாலும் இங்கே ‘வழிபட’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγὼ Ἰωάννης
  choice: யோவானாகிய நானே
  rationale: καί தரும் உரைத்தொடர்ச்சியை முந்தைய சூழல் இயல்பாகத் தாங்குகிறது; ἐγώ-வின் வலியுறுத்தலை ‘நானே’ வெளிப்படுத்துகிறது. பெயர் தமிழின் வழக்கமான வேதாகம வடிவில் தரப்படுகிறது.
- source_word: ὁ ἀκούων καὶ βλέπων ταῦτα
  choice: இவற்றைக் கேட்டு, பார்த்துக்கொண்டிருக்கிறவன்
  rationale: பெயர்ச்சொல் செயல்பாட்டிலுள்ள நிகழ்காலப் பங்கேற்பு வடிவங்களையும் அவற்றின் தொடர்நிலைத் தன்மையையும் முடிந்தவரை காக்கிறது.
- source_word: ὅτε ἤκουσα καὶ ἔβλεψα
  choice: நான் இவற்றைக் கேட்டுப் பார்த்தபோது
  rationale: ὅτε-ஐ ‘போது’ எனக் காலத் தொடர்புடன் தருகிறது; இறந்தகால வினைகளை இயல்பான தமிழில் இணைத்துக் காட்டுகிறது. இரண்டாவது ταῦτα தமிழில் தெளிவுக்காக வெளிப்படையாக மீண்டும் தரப்படுகிறது.
- source_word: ἔπεσα προσκυνῆσαι
  choice: விழுந்து அவனை வழிபட முயன்றேன்
  rationale: ἔπεσα உடல்செயலை ‘விழுந்து’ எனக் காக்கிறது. நோக்கத்தைக் குறிக்கும் இறந்தகால infinitive-ஐ, வழிபாடு நிறைவேறியதாகக் கூறாமல், ‘முயன்றேன்’ என இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἔμπροσθεν τῶν ποδῶν τοῦ ἀγγέλου
  choice: தூதனுடைய கால்களுக்கு முன்பாக
  rationale: ἔμπροσθεν மற்றும் ‘கால்கள்’ என்ற வெளிப்படையான கூறுகளைப் பாதுகாக்கிறது; ἄγγελος இச்சூழலில் வானதூதனைக் குறிப்பதால் ‘தூதன்’ பொருத்தமானது.
- source_word: τοῦ δεικνύοντός μοι ταῦτα
  choice: இவற்றை எனக்குக் காட்டிக்கொண்டிருந்த
  rationale: நிகழ்காலப் பங்கேற்பின் தொடர்நிலை அம்சத்தை, காட்சியின் கடந்தகாலச் சூழலுக்கேற்ற ‘காட்டிக்கொண்டிருந்த’ மூலம் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தூதனை நோக்கிய προσκυνέω என்பதன் இயல்பு
  choice: வழிபட
  alternative: வணங்க / முன்பாகப் பணிய
  rationale: προσκυνέω பணிதல் அல்லது மரியாதை செலுத்துதல் என்றும் வரலாம். ஆனால் வெளிப்படுத்தின விசேஷத்தில் அதன் வழக்கமான வலிமையும் அடுத்த வசனத்திலுள்ள கண்டிப்பும் காரணமாக ‘வழிபட’ எனத் தரப்படுகிறது; இதனால் யோவானின் செயலை முன்கூட்டியே மென்மைப்படுத்தாமல் இறையியல் பதற்றம் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘பார்த்துக்கொண்டிருக்கிறவன்’, ‘காட்டிக்கொண்டிருந்த’ ஆகியவை கிரேக்க நிகழ்காலப் பங்கேற்புகளின் தொடர்நிலையைத் தக்கவைக்கின்றன. அடிக்குறிப்பு குறியீடு தொடர்புடைய ‘வழிபட’ கூறுக்குப் பின் வைக்கப்பட்டுள்ளது.
