id: REV.22.17
reference: Revelation 22:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ τὸ πνεῦμα καὶ ἡ νύμφη λέγουσιν· Ἔρχου· καὶ ὁ ἀκούων εἰπάτω· Ἔρχου· καὶ ὁ διψῶν ἐρχέσθω, ὁ θέλων λαβέτω ὕδωρ ζωῆς δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/017.yaml
  text: And the Spirit and the bride say[a], “Come.” And let the one who hears say, “Come.” And let the one who is thirsty come[c][b]; let the one who desires take the water of life freely.
translation:
  language: ta
  text: ஆவியானவரும் மணமகளும், “வாரும்”[a] என்கிறார்கள். கேட்கிறவரும், “வாரும்” என்று சொல்லட்டும். தாகமாயிருக்கிறவர் வரட்டும்; விரும்புகிறவர் வாழ்வின் தண்ணீரை விலையின்றிப் பெற்றுக்கொள்ளட்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: முதல் இரண்டு “வாரும்” என்ற அழைப்புகளும் பொதுவாக ஆண்டவர் வரவேண்டும் என்ற வேண்டுகோளாகப் புரிந்துகொள்ளப்படுகின்றன. அதன்பின் வரும் வாக்கியங்கள், தாகமுள்ளவரும் விரும்புகிறவரும் வந்து வாழ்வைப் பெற்றுக்கொள்ளும்படி அழைக்கின்றன.
    reason: alternative_reading
  - marker: b
    text: அல்லது “இலவசமாக” அல்லது “கொடையாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: ஆவியானவர்
  rationale: இவ்விடத்தில் குறிப்பிட்டுச் சொல்லப்படும் πνεῦμα, வெளிப்படுத்தின விசேஷத்தின் சூழலில் பரிசுத்த ஆவியானவரைக் குறிக்கிறது. தமிழ் மரியாதை ஒருமை வடிவம் அந்தக் குறிப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἡ νύμφη
  choice: மணமகள்
  rationale: νύμφη என்பதன் உருவகத்தை விளக்கிப் பரப்பாமல் நேரடியாகத் தக்கவைக்கிறது; திருச்சபை, தேவமக்கள், புதிய எருசலேம் ஆகிய தொடர்புகளை வாசகச் சூழலே எடுத்துக்காட்ட அனுமதிக்கிறது.
- source_word: λέγουσιν
  choice: என்கிறார்கள்
  rationale: நிகழ்காலத்தின் தொடரும், உயிரோட்டமான அறிவிப்பை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: Ἔρχου
  choice: வாரும்
  rationale: இது இரண்டாம் நபர் ஒருமை கட்டளை. சாத்தியமாக ஆண்டவரை நோக்கிய அழைப்பு என்பதால், தமிழில் மரியாதையுடன் கூடிய ஒருமை அழைப்பான ‘வாரும்’ பொருத்தமானது; சொல்லப்படாத முகவரியை உரையில் சேர்க்கவில்லை.
- source_word: ὁ ἀκούων
  choice: கேட்கிறவர்
  rationale: பெயர்ச்சொல் தன்மையுள்ள நிகழ்காலப் பங்கேற்புவினையைச் சுருக்கமாகவும் பொதுப்படையாகவும் தருகிறது.
- source_word: εἰπάτω
  choice: சொல்லட்டும்
  rationale: மூன்றாம் நபர் கட்டளையின் அழைப்பு அல்லது வேண்டுகோள் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: ὁ διψῶν
  choice: தாகமாயிருக்கிறவர்
  rationale: தாகம் என்ற மூல உருவகத்தைத் தக்கவைத்து, தேவை மற்றும் ஏக்கத்தின் உட்பொருளை விளக்காமல் பாதுகாக்கிறது.
- source_word: ἐρχέσθω
  choice: வரட்டும்
  rationale: மூன்றாம் நபர் கட்டளையைச் சுருக்கமாகவும் அழைப்புத் தொனியுடனும் தருகிறது.
- source_word: ὁ θέλων
  choice: விரும்புகிறவர்
  rationale: θέλω என்பதிலுள்ள விருப்பம் அல்லது ஆசை என்ற பொருளை, கிரேக்கத்தில் இல்லாத நேரடி செயப்படுபொருளைச் சேர்க்காமல் தருகிறது.
- source_word: λαβέτω
  choice: பெற்றுக்கொள்ளட்டும்
  rationale: λαμβάνω என்பதன் ‘எடுத்துக்கொள்/பெற்றுக்கொள்’ என்ற பொருள்களில், கொடுக்கப்படும் வாழ்வின் தண்ணீரை ஏற்றுக்கொள்வதற்கு ‘பெற்றுக்கொள்’ இயல்பான தமிழாகும்.
- source_word: ὕδωρ ζωῆς
  choice: வாழ்வின் தண்ணீர்
  rationale: மூலத்தின் உரிமைவேற்றுமை அமைப்பைத் தக்கவைக்கிறது; அதை ‘உயிருள்ள தண்ணீர்’ என்று மாற்றி வேறொரு நுண்பொருளை உருவாக்கவில்லை.
- source_word: δωρεάν
  choice: விலையின்றி
  rationale: கட்டணம் அல்லது விலை இல்லாமல் கிடைப்பதைத் தெளிவாகக் கூறுகிறது; அதே சமயம் ‘கொடையாக’ என்ற நுண்பொருளையும் அடிக்குறிப்பில் பாதுகாக்கிறது.
theological_decisions:
- issue: “வாரும்” என்ற முதல் இரண்டு அழைப்புகளின் முகவரி
  choice: முகவரியை முதன்மை உரையில் வெளிப்படையாகச் சேர்க்காமல், இரு அழைப்புகளையும் ‘வாரும்’ என்று வைத்தல்
  alternative: இரண்டும் ஆண்டவர் இயேசுவின் வருகைக்கான வேண்டுகோள் என்று வெளிப்படையாக மொழிபெயர்த்தல்; அல்லது எல்லா அழைப்புகளும் தாகமுள்ளவருக்கே என்று எடுத்தல்
  rationale: கிரேக்கம் முதல் இரு இடங்களிலும் இரண்டாம் நபர் ஒருமை கட்டளையைப் பயன்படுத்தி, பின்னர் தாகமுள்ளவருக்கும் விரும்புகிறவருக்கும் மூன்றாம் நபர் கட்டளைகளுக்கு மாறுகிறது. இந்த அமைப்பு ஆண்டவரின் வருகைக்கான அழைப்பிலிருந்து உயிரைப் பெறுவதற்கான அழைப்புக்கு நகரும் அடுக்குப் பொருளைச் சாத்தியமாக்குகிறது; மொழிபெயர்ப்பு அதைத் தீர்மானித்து விடவில்லை.
- issue: “மணமகள்” என்பதன் உருவகக் குறிப்பு
  choice: ‘மணமகள்’ என்ற உருவகத்தை அப்படியே வைத்தல்
  alternative: ‘திருச்சபை’, ‘தேவமக்கள்’ அல்லது ‘புதிய எருசலேம்’ என்று விளக்கி மொழிபெயர்த்தல்
  rationale: வெளிப்படுத்தின விசேஷத்தில் இந்த உருவகம் பல தொடர்புகளை ஒருங்கே சுமக்கிறது. அவற்றுள் ஒன்றை மட்டும் முதன்மை உரையில் பதிலீடு செய்வது மூலத்தின் செறிவைக் குறைக்கும்.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகவும், வழிபாட்டு வாசிப்பிற்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘ஆவியானவர்’ மற்றும் ‘வாரும்’ ஆகிய மரியாதை வடிவங்கள் தமிழின் வழக்கான தெய்வக் குறிப்பைத் தருகின்றன; மூலத்தில் இல்லாத விளக்கப் பெயர்கள் முதன்மை உரையில் சேர்க்கப்படவில்லை.
