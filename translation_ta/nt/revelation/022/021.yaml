  source_fidelity: மிகச் சிறப்பு. SBLGNT-இன் Ἡ χάρις τοῦ κυρίου Ἰησοῦ μετὰ πάντων என்பதிலுள்ள ‘ஆண்டவர் இயேசுவின் அருள்,’ வெளிப்படையாக இல்லாத வாழ்த்து வினை, மற்றும் வரையறுக்கப்படாத πάντων ஆகியவை துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. ‘அனைவரோடும்’ என்பது மூலத்தில் இல்லாத ‘உங்கள்’ அல்லது ‘பரிசுத்தவான்கள்’ என்பதைச் சேர்க்கவில்லை.
  naturalness: ‘ஆண்டவர் இயேசுவின் அருள் அனைவரோடும் இருப்பதாக’ என்பது நவீன நிலையான தமிழில் இயல்பானதும், நிறைவாழ்த்துக்கேற்ற கண்ணியமானதுமான நடை. வாக்கியம் சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
  terminology: χάρις என்பதற்கு ‘அருள்,’ κύριος என்பதற்கு கிறிஸ்துவியல் பட்டமாக ‘ஆண்டவர்,’ Ἰησοῦ என்பதற்கு ‘இயேசு’ ஆகிய தேர்வுகள் நிலையானவை மற்றும் சூழலுக்கேற்றவை. எந்தக் கோட்பாட்டுச் சேர்க்கையும் இல்லை.
