language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἡ χάρις τοῦ κυρίου ⸀Ἰησοῦ μετὰ ⸀πάντων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/021.yaml
  text: The grace of the Lord Jesus be with all[a].
translation:
  language: ta
  text: ஆண்டவர் இயேசுவின் அருள் அனைவரோடும் இருப்பதாக[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “ஆண்டவர் இயேசுவின் அருள் பரிசுத்தவான்கள் அனைவரோடும் இருப்பதாக” என்றும், வேறு சிலவற்றில், “உங்கள் அனைவரோடும் இருப்பதாக” என்றும் உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: χάρις
  choice: அருள்
  rationale: நிறைவாழ்த்துச் சூழலில் உறவுசார் தயவையும் மீட்பளிக்கும் இறைநன்மையையும் இயல்பாகத் தாங்கும், புதிய ஏற்பாட்டில் நிலைபெற்ற தமிழ் சொல்.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: இங்கு இயேசுவுக்குரிய கிறிஸ்துவியல் பட்டமாக வரும் κύριος என்பதற்கு இயல்பான, கண்ணியமான நவீனத் தமிழ் இணை.
- source_word: Ἰησοῦ
  choice: இயேசு
  rationale: தனிப்பெயர் தமிழில் வழக்கமாக நிலைபெற்ற வடிவில் ஒலிபெயர்க்கப்படுகிறது.
- source_word: μετὰ
  choice: -ஓடும் இருப்பதாக
  rationale: கிரேக்கத்தில் வினைச்சொல் வெளிப்படையாக இல்லாவிட்டாலும், நிறைவாழ்த்தின் பொருளை இயல்பான தமிழில் தெரிவிக்க ‘இருப்பதாக’ சேர்க்கப்படுகிறது.
- source_word: πάντων
  choice: அனைவரோடும்
  rationale: SBLGNT வாசகத்தில் யாரைக் குறிக்கிறது என்பது வெளிப்படையாக வரையறுக்கப்படாததால், ‘உங்கள்’ அல்லது ‘பரிசுத்தவான்கள்’ என்பதைச் சேர்க்காமல் அதன் விரிவையும் தெளிவின்மையையும் காக்கிறது.
theological_decisions:
- issue: நிறைவாழ்த்தைப் பெறுவோர் யார் என்பதை வெளிப்படையாகக் குறிப்பிடுவதா
  choice: ‘அனைவரோடும்’ என்று குறிப்பிடப்பட்ட பொருளை வரையறுக்காமல் விடுதல்
  alternative: ‘உங்கள் அனைவரோடும்’ அல்லது ‘பரிசுத்தவான்கள் அனைவரோடும்’
  rationale: முதன்மை கிரேக்க வாசகம் πάντων (‘அனைவரும்/அனைவரோடும்’) என்று மட்டும் முடிகிறது. வேறு வாசக மரபுகளில் பெறுவோர் வெளிப்படையாகக் குறிப்பிடப்பட்டாலும், இங்கு மூலவாசகத்தின் பரந்த பொருளும் உண்மையான தெளிவின்மையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், வேதாகம நிறைவாழ்த்துக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘கர்த்தர்’ என்பதற்குப் பதிலாக பொதுத் தமிழில் இயல்பான ‘ஆண்டவர்’ தேர்ந்தெடுக்கப்பட்டுள்ளது; ‘அனைவரோடும்’ என்பது மூலத்தின் குறிப்பிடப்படாத பெறுவோரை அப்படியே காக்கிறது.
