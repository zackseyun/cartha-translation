revisions:
- from: 'வெளியே இருப்பவர்கள்: நாய்கள்[b], சூனியம் செய்பவர்கள், பாலியல் ஒழுக்கக்கேட்டில் ஈடுபடுபவர்கள், கொலைகாரர்கள், சிலைவழிபாட்டாளர்கள், மேலும் பொய்மையை விரும்பி அதன்படி நடக்கிற ஒவ்வொருவரும்.[a]'
  to: வெளியே நாய்களும்[b], சூனியம் செய்பவர்களும், பாலியல் ஒழுக்கக்கேட்டில் ஈடுபடுபவர்களும், கொலைகாரர்களும், சிலை வழிபாட்டாளர்களும், பொய்மையை விரும்பி அதைச் செய்கிற ஒவ்வொருவரும் இருக்கிறார்கள்.[a]
