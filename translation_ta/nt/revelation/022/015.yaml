id: REV.22.15
reference: Revelation 22:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἔξω οἱ κύνες καὶ οἱ φάρμακοι καὶ οἱ πόρνοι καὶ οἱ φονεῖς καὶ οἱ εἰδωλολάτραι καὶ πᾶς φιλῶν καὶ ποιῶν ψεῦδος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/015.yaml
  text: Outside are the dogs and the sorcerers and the sexually immoral and the murderers and the idolaters[b][a], and everyone who loves and practices falsehood.
translation:
  language: ta
  text: வெளியே நாய்களும்[b], சூனியம் செய்பவர்களும், பாலியல் ஒழுக்கக்கேட்டில் ஈடுபடுபவர்களும், கொலைகாரர்களும், சிலை வழிபாட்டாளர்களும், பொய்மையை விரும்பி அதைச் செய்கிற ஒவ்வொருவரும் இருக்கிறார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு பொய்யை விரும்பி அதைச் செய்கிற ஒவ்வொருவரும்.”
    reason: lexical_alternative
  - marker: b
    text: “நாய்கள்” என்பது இங்கே அநேகமாக உருவகமாகப் பயன்படுத்தப்பட்டு, விலக்கப்பட்டவர்களையும் ஒழுக்க அசுத்தமுள்ளவர்களையும் குறிக்கிறது; சிலர் இதை இன்னும் குறிப்பிட்ட ஒரு குழுவைக் குறிக்கும் சொல்லாகப் புரிந்துகொள்கிறார்கள்.
    reason: cultural_note
lexical_decisions:
- source_word: ἔξω
  choice: வெளியே இருப்பவர்கள்
  rationale: நகரத்திலிருந்து விலக்கப்பட்டிருப்பதைச் சூழல் காட்டுகிறது. வாக்கியத்தின் தொடக்கத்தில் ‘வெளியே’ என்பதை வைத்து கிரேக்கத்தின் அழுத்தம் காக்கப்படுகிறது; தமிழில் இயல்பான முழு வாக்கியத்திற்காக ‘இருப்பவர்கள்’ சேர்க்கப்படுகிறது.
- source_word: κύνες
  choice: நாய்கள்
  rationale: வெளியேற்றத்தையும் ஒழுக்க அசுத்தத்தையும் குறிக்கும் உருவகமாகத் தோன்றும் நேரடியான சொல்லை அப்படியே வைத்திருப்பதால் வெளிப்படுத்தின விசேஷத்தின் வலுவான படிமம் காக்கப்படுகிறது.
- source_word: φάρμακοι
  choice: சூனியம் செய்பவர்கள்
  rationale: இங்கு மருந்து அல்லது நஞ்சுடன் தொடர்புடையவர்களை அல்ல, மந்திரம் அல்லது சூனியச் செயல்களில் ஈடுபடுபவர்களைக் குறிக்கிறது. இன்றைய தமிழில் இது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: πόρνοι
  choice: பாலியல் ஒழுக்கக்கேட்டில் ஈடுபடுபவர்கள்
  rationale: பாலியல் முறைகேட்டில் தொடர்ந்து ஈடுபடுபவர்களைக் குறிக்கும் பரந்த சொல்; ஒரு குறிப்பிட்ட வகையான பாலியல் பாவமாக இதைச் சுருக்காமல் பொருளைப் பாதுகாக்கிறது.
- source_word: φονεῖς
  choice: கொலைகாரர்கள்
  rationale: கொலை செய்பவர்களைக் குறிக்கும் நேரடியான, வழக்கிலுள்ள தமிழ் சொல்.
- source_word: εἰδωλολάτραι
  choice: சிலைவழிபாட்டாளர்கள்
  rationale: விக்கிரகங்களை அல்லது சிலைகளை வழிபடுபவர்களைக் குறிக்கும் சுருக்கமான, புரிந்துகொள்ளத்தக்க தமிழ் வடிவம்; பட்டியலின் ஓட்டத்தையும் காக்கிறது.
- source_word: πᾶς φιλῶν καὶ ποιῶν ψεῦδος
  choice: பொய்மையை விரும்பி அதன்படி நடக்கிற ஒவ்வொருவரும்
  rationale: πᾶς உடன் வரும் நிகழ்காலப் பங்கேற்புச் சொற்கள் குணவியல்பான, தொடர்ச்சியான பற்றையும் நடைமுறையையும் குறிக்கின்றன. ‘அதன்படி நடக்கிற’ என்பது ποιῶν என்பதன் செயல்வழிப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ψεῦδος
  choice: பொய்மை
  rationale: தனிப்பட்ட ஒரு பொய்யை மட்டும் அல்லாமல், பொய்யானவற்றின் மீது கொண்ட பற்றையும் பொய்மையான நடத்தையையும் உள்ளடக்கும் பரந்த நெறிசார் வகையை இது வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘நாய்கள்’ என்பது குறிப்பிட்ட ஒரு குழுவைக் குறிக்கும் வகையில் விளக்கப்பட வேண்டுமா?
  choice: முதன்மை உரையில் ‘நாய்கள்’ என்ற நேரடி படிமத்தைத் தக்கவைத்தல்.
  alternative: ஒழுக்க அசுத்தமுள்ளவர்கள் அல்லது வெட்கமற்றவர்கள் என்று விளக்கிப் பெயர்த்தல்.
  rationale: κύνες என்ற தெளிவான உருவகத்தை உரை பயன்படுத்துகிறது. அதன் குறிப்பிட்ட அடையாளம் விவாதத்திற்குரியது என்பதால், ஒரு விளக்கத்தை மட்டும் முதன்மை உரையில் திணிக்காமல் படிமத்தையும் அதன் வலிமையையும் காக்கிறது.
- issue: ψεῦδος என்பது ‘ஒரு பொய்’ என்ற குறுகிய பொருளிலா அல்லது ‘பொய்மை’ என்ற பரந்த பொருளிலா தரப்பட வேண்டும்?
  choice: ‘பொய்மை’ என்று பரந்த பொருளில் மொழிபெயர்த்தல்.
  alternative: ‘ஒரு பொய்யை விரும்பி நடைமுறைப்படுத்துகிற’ என்று மொழிபெயர்த்தல்.
  rationale: ‘விரும்பி’ மற்றும் ‘செய்து’ என்ற தொடர்ச்சியான செயல்களைச் சுட்டும் சொற்களுடன் சேர்ந்து வருவதால், தனித்த பொய்யைக் காட்டிலும் பொய்யின் மீதான நிலையான பற்றையும் வாழ்க்கை நடைமுறையையும் குறிக்கலாம். இருப்பினும் ஒருமை வடிவின் சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வெளிப்படுத்தின விசேஷத்தின் கடுமையான பட்டியல் ஓட்டமும் காக்கப்பட்டுள்ளன. அரிதான சமயச் சொற்களுக்குப் பதிலாக ordinary வாசகர்களுக்குத் தெளிவான செயற்பாட்டு வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; விவாதத்திற்குரிய உருவகம் விளக்கிப் பெயர்க்கப்படாமல் தக்கவைக்கப்பட்டுள்ளது.
