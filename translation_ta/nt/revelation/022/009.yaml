- from: அவர் என்னிடம், “அப்படிச் செய்யாதே![a] நான் உனக்கும், இறைவாக்கினர்களான உன் சகோதரர்களுக்கும், இந்தப் புத்தகத்தின் வார்த்தைகளைக் கடைப்பிடிக்கிறவர்களுக்கும் சக அடிமைதான்.[b] கடவுளை வழிபடு” என்று சொல்கிறார்.[c]
