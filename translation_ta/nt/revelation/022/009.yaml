  text: καὶ λέγει μοι· Ὅρα μή· σύνδουλός σού εἰμι καὶ τῶν ἀδελφῶν σου τῶν προφητῶν καὶ τῶν τηρούντων τοὺς λόγους τοῦ βιβλίου τούτου· τῷ θεῷ προσκύνησον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/009.yaml
  text: And he says to me[a], “Do not do that! I am a fellow servant with you and with your brothers the prophets, and with those who keep the words of this book[c][b]. Worship God.”
translation:
  language: ta
  text: அவர் என்னிடம், “அப்படிச் செய்யாதே![a] நான் உன்னோடும், இறைவாக்கினர்களான உன் சகோதரர்களோடும், இந்தப் புத்தகத்தின் வார்த்தைகளைக் கடைப்பிடிப்பவர்களோடும் சக அடிமையாக இருக்கிறேன்.[b] கடவுளை வழிபடு” என்று சொல்கிறார்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் இத்தடை சொற்பட ‘பார், வேண்டாம்’ என்பதுபோல் சுருக்கமாக உள்ளது; யோவான் தூதரை வழிபட முயன்றதையே இது குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘சக அடிமை’ என்பது ஒரே எஜமானுக்குக் கீழ்ப்பட்ட அடிமைநிலையைப் பகிர்ந்துகொள்பவரைக் குறிக்கிறது; தூதரும் யோவானைப் போலக் கடவுளுக்குக் கீழ்ப்பட்டவர் என்பது இங்கு வலியுறுத்தப்படுகிறது.
    reason: lexical_alternative
  - marker: c
    text: 'ஒப்பிடுக: வெளிப்படுத்தின விசேஷம் 19:10; அங்கும் தூதர் இதே திருத்தத்தைச் செய்து, ‘கடவுளை வழிபடு’ என்கிறார்.'
    reason: cross_reference
lexical_decisions:
- source_word: Ὅρα μή
  choice: அப்படிச் செய்யாதே!
  rationale: இது கிரேக்கத்தில் சுருக்கமாகவும் திடீரெனவும் கூறப்படும் தடை. முந்தைய வசனத்தில் யோவான் தூதரை வழிபட முயன்ற செயலைக் குறிக்கும் மறைபொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: σύνδουλός
  choice: சக அடிமை
  rationale: ஒரே எஜமானுக்குக் கீழுள்ள பகிரப்பட்ட அடிமைநிலையைச் சொல் குறிக்கிறது. தூதரும் கடவுளுக்குக் கீழ்ப்பட்டவர் என்பதையும் அவர் வழிபாட்டுக்குரியவர் அல்ல என்பதையும் ‘சக அடிமை’ தெளிவாகக் காக்கிறது.
- source_word: ἀδελφῶν σου τῶν προφητῶν
  choice: இறைவாக்கினர்களான உன் சகோதரர்கள்
  rationale: τῶν προφητῶν என்பது ‘உன் சகோதரர்கள்’ யார் என்பதை விளக்கும் இணைப்புச் சொற்றொடராகப் புரிந்துகொள்ளப்பட்டுள்ளது. ஆண்பால் பன்மையை ‘சகோதரர்கள்’ என நேரடியாக வைத்திருக்கிறது.
- source_word: τηρούντων
  choice: கடைப்பிடிக்கிறவர்கள்
  rationale: τηρέω இங்கு வார்த்தைகளைப் பாதுகாப்பது மட்டுமல்லாமல் அவற்றுக்கு உண்மையாக இணங்கி நடப்பதையும் குறிக்கிறது. ‘கடைப்பிடி’ இந்த விரிந்த பொருளை இயல்பாகத் தருகிறது.
- source_word: λόγους τοῦ βιβλίου τούτου
  choice: இந்தப் புத்தகத்தின் வார்த்தைகள்
  rationale: λόγοι என்பதன் பன்மையையும் βιβλίον என்பதன் வழக்கமான குறியீட்டையும் நேரடியாகக் காக்கிறது; ‘செய்தி’ என்று ஒருமைப்படுத்தவில்லை.
- source_word: τῷ θεῷ προσκύνησον
  choice: கடவுளை வழிபடு
  rationale: προσκυνέω இங்கு தூதருக்குத் தவறாகச் செலுத்தப்பட்ட வழிபாட்டுக்கு மாறாக கடவுளுக்குச் செலுத்த வேண்டிய வழிபாட்டைக் குறிக்கிறது. ‘வழிபடு’ அதன் சமயச் சூழலுக்குப் பொருத்தமான இயல்பான தமிழ்.
theological_decisions:
- issue: σύνδουλος என்பதில் உள்ள அடிமைநிலை
  choice: ‘சக அடிமை’ என்று மொழிபெயர்த்தல்
  alternative: ‘சக ஊழியன்’ அல்லது ‘உடன் பணியாளர்’
  rationale: இந்த வசனத்தின் மைய வேறுபாடு, தூதர் வழிபாட்டைப் பெறும் ஆண்டவர் அல்ல; யோவானைப் போலவே கடவுளுக்குக் கீழ்ப்பட்டவர் என்பதாகும். ‘அடிமை’ மூலச்சொல்லின் கீழ்ப்பட்ட நிலையைக் காக்கிறது.
- issue: Ὅρα μή என்ற சுருக்கமான தடையில் மறைந்துள்ள செயல்
  choice: ‘அப்படிச் செய்யாதே!’ என்று சூழலிலிருந்து செயலை வெளிப்படுத்தல்
  alternative: ‘வேண்டாம்!’ அல்லது ‘பார், வேண்டாம்’
  rationale: கிரேக்கத்தில் செயல் வெளிப்படையாகச் சொல்லப்படாவிட்டாலும், முந்தைய வசனத்தில் யோவான் தூதரை வழிபட முயன்றதே அதன் தெளிவான குறிப்பு. இயல்பான தமிழுக்காக அந்தக் குறிப்பை வெளிப்படுத்துவது புதிய இறையியல் கருத்தைச் சேர்ப்பதில்லை.
- issue: τῷ θεῷ என்பதன் முன்னிலைப்படுத்தப்பட்ட வலியுறுத்தல்
  choice: ‘கடவுளை வழிபடு’ என்று நேரடியாக வழங்கல்
  alternative: ‘கடவுளையே வழிபடு’
  rationale: சூழலில் கடவுளுக்கும் தூதருக்கும் இடையிலான எதிர்மறைத் தொடர்பு தெளிவாக உள்ளது. எனினும் கிரேக்கத்தில் ‘மட்டும்’ என்பதற்குச் சமமான தனிச்சொல் இல்லாததால், ‘-ஏ’ சேர்த்து பிரத்தியேகத்தன்மையை அளவுக்கு மீறி வெளிப்படுத்தாமல் நேரடி வடிவம் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இறைவாக்கினர்’, ‘கடைப்பிடி’, ‘வழிபடு’ ஆகியவை பொதுவாசகர்களுக்குப் புரியும் சொற்கள். கிரேக்கத்தின் நிகழ்காலக் கதைநடையான λέγει ‘சொல்கிறார்’ எனக் காக்கப்பட்டுள்ளது; திடீர் தடையின் வலிமை வியப்புக்குறியால் வெளிப்படுத்தப்பட்டுள்ளது.
