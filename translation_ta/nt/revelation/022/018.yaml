id: REV.22.18
reference: Revelation 22:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Μαρτυρῶ ἐγὼ παντὶ τῷ ἀκούοντι τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου· ἐάν τις ἐπιθῇ ἐπ’ αὐτά, ⸀ἐπιθήσει ὁ θεὸς ἐπ’ αὐτὸν τὰς πληγὰς τὰς γεγραμμένας ἐν τῷ βιβλίῳ τούτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/018.yaml
  text: 'I testify to everyone who hears the words of the prophecy of this book: if anyone adds to them[b][a], God will add to him the plagues that are written in this book.'
translation:
  language: ta
  text: 'இந்தப் புத்தகத்தின்[a] தீர்க்கதரிசன வார்த்தைகளைக் கேட்கிற ஒவ்வொருவருக்கும் நான் சாட்சியமளிக்கிறேன்[b]: யாராவது அவற்றோடு எதையாவது சேர்த்தால், இந்தப் புத்தகத்தில் எழுதப்பட்டுள்ள வாதைகளைக் கடவுள் அவன்மேல் சேர்ப்பார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘புத்தகம்’ என்பதற்குப் பதிலாக ‘சுருள்’ என்றும் மொழிபெயர்க்கலாம்; βιβλίον என்பது பண்டைய கால எழுத்துச் சுருளைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நான் சாட்சி கூறுகிறேன்’; தொடக்க வினைச்சொல் வெறும் பொதுவான எச்சரிக்கையை அல்ல, சாட்சியுரையைச் சார்ந்த மொழியைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μαρτυρῶ
  choice: நான் சாட்சியமளிக்கிறேன்
  rationale: இந்த வினைச்சொல்லின் சாட்சி அல்லது சான்றுரை கூறும் தன்மையைப் பாதுகாக்கிறது; அதை வெறுமனே ‘எச்சரிக்கிறேன்’ என்று பொருள் சுருக்கவில்லை.
- source_word: παντὶ τῷ ἀκούοντι
  choice: கேட்கிற ஒவ்வொருவருக்கும்
  rationale: தொடர்ந்து அல்லது ஏற்றுக்கொள்ளும் விதத்தில் கேட்பதைக் குறிக்கும் நிகழ்காலப் பங்கேற்பு வடிவத்தை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: τοὺς λόγους τῆς προφητείας
  choice: தீர்க்கதரிசன வார்த்தைகளை
  rationale: λόγοι என்பதன் சொல் சார்ந்த தன்மையையும் προφητεία என்பதன் தீர்க்கதரிசன வகையையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: τοῦ βιβλίου τούτου / ἐν τῷ βιβλίῳ τούτῳ
  choice: இந்தப் புத்தகத்தின் / இந்தப் புத்தகத்தில்
  rationale: βιβλίον என்பதற்கு நவீன வாசகர்களுக்கு இயல்பான ‘புத்தகம்’ பயன்படுத்தப்பட்டு, வசனத்தின் இரு இடங்களிலும் ஒரே சொல்லாக்கம் பேணப்படுகிறது.
- source_word: ἐάν τις ἐπιθῇ ἐπ’ αὐτά
  choice: யாராவது அவற்றோடு எதையாவது சேர்த்தால்
  rationale: ἐπιτίθημι இங்கு ‘சேர்த்தல்’ என்ற பொருளைத் தருகிறது. தமிழில் வாக்கியம் முழுமையாகவும் இயல்பாகவும் இருக்க ‘எதையாவது’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: ἐπιθήσει ὁ θεὸς ἐπ’ αὐτὸν
  choice: கடவுள் அவன்மேல் சேர்ப்பார்
  rationale: முந்தைய நிபந்தனையிலும் இதே வினைச்சொல் இருப்பதால், ‘சேர்த்தால்—சேர்ப்பார்’ என்ற திட்டமிட்ட சொல் ஒத்திசைவு பாதுகாக்கப்படுகிறது.
- source_word: τὰς πληγὰς
  choice: வாதைகளை
  rationale: வெளிப்படுத்தின விசேஷத்தில் πληγή என்பது இறைத் தீர்ப்பாக வரும் வாதைகளைக் குறிக்கிறது; ‘வாதைகள்’ அதன் நூல்சார்ந்த ஒலித்தொடர்பைப் பேணுகிறது.
- source_word: τὰς γεγραμμένας
  choice: எழுதப்பட்டுள்ள
  rationale: எழுதப்பட்டு நிலைத்திருப்பதைக் காட்டும் நிறைவுற்ற செயப்பாட்டு வடிவத்தின் கருத்தைச் சுருக்கமாகத் தருகிறது.
theological_decisions:
- issue: இக்கூற்று எச்சரிக்கையா அல்லது சாட்சியுரையா?
  choice: ‘நான் சாட்சியமளிக்கிறேன்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘நான் எச்சரிக்கிறேன்’
  rationale: Μαρτυρῶ என்பது முதன்மையாகச் சாட்சிய மொழி. பின்னரும் வரும் நிபந்தனைத் தீர்ப்பு எச்சரிக்கையின் வலிமையைத் தெளிவாக்குவதால், தொடக்க வினையை விளக்கவுரையாக மாற்றத் தேவையில்லை.
- issue: மனிதன் சேர்ப்பதற்கும் கடவுள் சேர்ப்பதற்கும் இடையிலான சொல் ஒத்திசைவு
  choice: இரு இடங்களிலும் ‘சேர்’ என்ற ஒரே வேர்ச்சொல் பயன்படுத்தப்பட்டது.
  alternative: ‘சேர்த்தால், கடவுள் சுமத்துவார்’
  rationale: கிரேக்கத்தில் ἐπιτίθημι என்ற ஒரே வினைச்சொல் மீண்டும் வருவது, செயலும் அதற்கான தீர்ப்பும் இடையிலான திட்டமிட்ட சொல்லாட்சித் தொடர்பை உருவாக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘சாட்சியமளிக்கிறேன்’ என்ற முறைப்பாங்கான சொல் மூலத்தின் நீதிமன்ற அல்லது உடன்படிக்கைச் சாட்சித் தொனியைத் தக்கவைக்கிறது. ‘வாதைகள்’ என்பது வெளிப்படுத்தின விசேஷத்தின் தீர்ப்புச் சூழலுக்கு ஏற்ற, பரவலாக அறியப்பட்ட வேதாகமச் சொல்.
