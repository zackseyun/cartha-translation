source:
  edition: SBLGNT
  text: Λέγει ὁ μαρτυρῶν ταῦτα· Ναί· ἔρχομαι ταχύ. Ἀμήν· ⸀ἔρχου, κύριε Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/020.yaml
  text: The one who testifies to these things says[a], “Yes, I am coming soon.” Amen. Come, Lord Jesus.
translation:
  language: ta
  text: இவற்றைக் குறித்துச் சாட்சி அளிக்கிறவர், “ஆம், நான் விரைவில் வருகிறேன்[a]” என்று சொல்கிறார். ஆமென். வாரும், ஆண்டவராகிய இயேசுவே!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் வேகமாக வருகிறேன்.” கிரேக்க வினையடை, வருகை காலத்தில் நெருங்கியிருப்பதையோ, வருகை அல்லது செயல் வேகமாக நிகழ்வதையோ வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγει
  choice: சொல்கிறார்
  rationale: நிகழ்கால வினைச்சொல்லை இயல்பான தமிழ் உரையாடல் அறிமுகமாக வழங்குகிறது; மூலத்தில் இல்லாத கூடுதல் வலிமையைச் சேர்க்கவில்லை.
- source_word: ὁ μαρτυρῶν
  choice: சாட்சி அளிக்கிறவர்
  rationale: பெயர்ச்சொல் நிலையில் வரும் நிகழ்காலப் பங்கேற்புவினை, தொடர்ந்து சாட்சி அளிப்பவரை அடையாளப்படுத்துகிறது; μαρτυρέω என்பதன் சாட்சி சார்ந்த பொருளையும் காக்கிறது.
- source_word: ταῦτα
  choice: இவற்றைக் குறித்து
  rationale: பன்மைச் சுட்டுப்பெயர், இதற்கு முன் வழங்கப்பட்ட வெளிப்பாட்டின் செய்திகளைக் குறிக்கிறது; தமிழ் வாக்கியத்தில் இயல்பாக அமைகிறது.
- source_word: Ναί
  choice: ஆம்
  rationale: நேரடியான உறுதிப்பாட்டை எளிய, நவீன தமிழில் தருகிறது.
- source_word: ἔρχομαι
  choice: நான் ... வருகிறேன்
  rationale: எதிர்கால நோக்கமுள்ள நிகழ்கால வடிவத்தை, தமிழில் இயல்பான உறுதியான வருகை அறிவிப்பாக வழங்குகிறது.
- source_word: ταχύ
  choice: விரைவில்
  rationale: இங்கு காலநெருக்கத்தைக் குறிக்கும் இயல்பான தமிழ் சொல்; அதே கிரேக்கச் சொல் வருகையின் வேகத்தையும் குறிக்கக்கூடும் என்பதால் அந்த மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: Ἀμήν
  choice: ஆமென்
  rationale: வழிபாட்டு ஒப்புதலையும் வேண்டுதலுடனான சம்மதத்தையும் மரபான, பரவலாக அறியப்பட்ட வடிவில் காக்கிறது.
- source_word: ἔρχου
  choice: வாரும்
  rationale: இரண்டாம் நபர் ஒருமை கட்டளை/வேண்டுகோளை, மரியாதையும் ஏக்கமும் கொண்ட நேரடி தமிழ் அழைப்பாக வழங்குகிறது.
- source_word: κύριε
  choice: ஆண்டவராகிய
  rationale: இயேசுவை நேரடியாக அழைக்கும் κύριος பட்டத்தின் மரியாதையையும் புதிய ஏற்பாட்டு பயன்பாட்டையும் காக்கிறது.
- source_word: Ἰησοῦ
  choice: இயேசுவே
  rationale: பெயரை வழக்கமான தமிழ் வடிவில் தருவதுடன், நேரடி அழைப்பைக் குறிக்கும் விளிவேற்றுமையையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கிறிஸ்துவின் வருகை குறித்த வாக்குறுதியில் ταχύ என்பதன் பொருள்
  choice: விரைவில்
  alternative: வேகமாக / விரைவாக
  rationale: ταχύ என்பது காலத்தில் அண்மையை அல்லது நிகழும் செயலின் வேகத்தைச் சுட்டலாம். நிறைவு உரையாடலிலும் அதைத் தொடர்ந்து வரும் வேண்டுதலிலும் ‘விரைவில்’ இயல்பாகப் பொருந்துகிறது; இருப்பினும் இறுதிக்கால விளக்கத்தில் முக்கியமான மாற்றுப் பொருள் அடிக்குறிப்பில் வெளிப்படையாகக் காக்கப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வெளிப்படுத்தின நூலின் நிறைவு வேண்டுதலுக்கேற்ற கண்ணியமான தொனியிலும் வடிவமைக்கப்பட்டது. ‘வாரும்’ என்பது நேரடி வேண்டுதலின் மரியாதை மற்றும் ஏக்கத்தைத் தக்கவைக்கிறது.
