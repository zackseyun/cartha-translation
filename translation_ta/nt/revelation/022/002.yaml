source:
  edition: SBLGNT
  text: ἐν μέσῳ τῆς πλατείας αὐτῆς· καὶ τοῦ ποταμοῦ ἐντεῦθεν καὶ ἐκεῖθεν ξύλον ζωῆς ποιοῦν καρποὺς δώδεκα, κατὰ μῆνα ἕκαστον ⸀ἀποδιδοῦν τὸν καρπὸν αὐτοῦ, καὶ τὰ φύλλα τοῦ ξύλου εἰς θεραπείαν τῶν ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/002.yaml
  text: in the middle of its street[a], and on this side and on that side of the river, was the tree of life, bearing twelve fruits, yielding its fruit each month[c][b]. And the leaves of the tree are for the healing of the nations.
translation:
  language: ta
  text: அதன் அகன்ற தெருவின் நடுவிலும், ஆற்றின் இந்தப் பக்கத்திலும் அந்தப் பக்கத்திலும், வாழ்வின் மரம் இருந்தது.[a] அது பன்னிரண்டு கனிகளை விளைவித்து,[b] ஒவ்வொரு மாதமும் தன் கனியைக் கொடுத்தது.[c] அந்த மரத்தின் இலைகள் தேசங்களின் குணமடைதலுக்காக இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்க வாக்கிய அமைப்பு சுருக்கமானதும் இடவியல் ரீதியாகத் தெளிவற்றதுமாக உள்ளது. ‘ஆற்றின் இரு பக்கங்களிலும்’ என்றும் மொழிபெயர்க்கலாம்; ஒரே மரம் தெருவுக்கும் ஆற்றின் இரு பக்கங்களுக்கும் எவ்வாறு தொடர்புடையது என்பதை உரை விளக்கவில்லை.
    reason: lexical_alternative
  - marker: b
    text: ‘பன்னிரண்டு வகையான கனிகள்’ என்றும் புரிந்துகொள்ளலாம். கிரேக்கம் சொல்லுக்கு சொல் ‘பன்னிரண்டு கனிகள்’ என்கிறது; இது முழுமையான, தொடர்ந்து நிகழும் கனியளிப்பைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: இந்தக் காட்சி ஆதியாகமம் 2:9-இல் உள்ள வாழ்வின் மரத்தையும் எசேக்கியேல் 47:12-இல் மாதந்தோறும் கனிதந்து, இலைகள் குணமளிக்கும் மரங்களையும் நினைவூட்டுகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν μέσῳ τῆς πλατείας αὐτῆς
  choice: அதன் அகன்ற தெருவின் நடுவிலும்
  rationale: πλατεία என்பது அகன்ற தெருவையோ பொது வெளிச்சதுக்கத்தையோ குறிக்கலாம். நகரக் காட்சியில் ‘அகன்ற தெரு’ இயல்பாக உள்ளது; ἐν μέσῳ என்பதன் இடவியல் பொருளும் αὐτῆς என்பதன் உடைமைத் தொடர்பும் காக்கப்படுகின்றன.
- source_word: ἐντεῦθεν καὶ ἐκεῖθεν
  choice: இந்தப் பக்கத்திலும் அந்தப் பக்கத்திலும்
  rationale: மூலத்தின் பகிர்ந்த இடவியல் சொல்லாட்சியை விளக்கித் தீர்க்காமல் நேரடியாகக் காக்கிறது.
- source_word: ξύλον ζωῆς
  choice: வாழ்வின் மரம்
  rationale: ξύλον என்பதற்கு ‘மரம்’ அல்லது ‘மரப்பொருள்’ என்ற பொருள் இருக்கலாம்; ஆதியாகமம் மற்றும் வெளிப்படுத்தல் நூல்களின் தொடர்பால் இங்கு ‘மரம்’ பொருத்தமானது. நன்கு அறியப்பட்ட இந்த உருவகம் ஒருமையில் காக்கப்படுகிறது.
- source_word: ποιοῦν καρποὺς δώδεκα
  choice: பன்னிரண்டு கனிகளைக் கொடுத்து
  rationale: ποιοῦν என்பது இங்கு கனியைக் கொடுத்தல் அல்லது விளைவித்தல் எனப் பொருள்படும். கிரேக்கம் ‘வகைகள்’ என்று வெளிப்படையாகச் சொல்லாததால் அதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: κατὰ μῆνα ἕκαστον ἀποδιδοῦν τὸν καρπὸν αὐτοῦ
  choice: ஒவ்வொரு மாதமும் தன் கனியைக் கொடுத்தது
  rationale: மாதந்தோறும் தவறாமல் கனியளிக்கும் பகிர்வுப் பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἰς θεραπείαν τῶν ἐθνῶν
  choice: தேசங்களின் குணமடைதலுக்காக
  rationale: εἰς என்பதன் நோக்கப் பொருளையும் θεραπεία என்பதன் குணப்படுத்தல் அல்லது மீட்பு நுணுக்கத்தையும் காக்கிறது; ἔθνη என்பது இங்கு யூதரல்லாதவர்களை மட்டும் அல்லாமல் தேசங்களைப் பொதுவாகக் குறிக்கிறது.
theological_decisions:
- issue: தெரு, ஆறு, வாழ்வின் மரம் ஆகியவற்றின் இடவியல் தொடர்பிலுள்ள தொடரியல் இறுக்கம்
  choice: வாழ்வின் மரத்தை ஒருமையில் வைத்து, அது தெருவின் நடுவிலும் ஆற்றின் இந்தப் பக்கத்திலும் அந்தப் பக்கத்திலும் இருப்பதாக மூலத்தின் சுருக்கமான காட்சியை அப்படியே விடுதல்
  alternative: ‘ஆற்றின் இரு கரைகளிலும் வாழ்வின் மரங்கள் இருந்தன’ என்று பன்மையாக்கி இடவியலைத் தெளிவுபடுத்துதல்
  rationale: கிரேக்க உரை ஒருமையான ξύλον என்பதைப் பயன்படுத்துகிறது; அதேவேளையில் இருபக்க இடத்தையும் விவரிக்கிறது. தரிசனத்தின் புவியியலைச் செயற்கையாகத் தீர்மானிக்காமல் இந்த இறுக்கத்தைக் காப்பது மூலத்துக்கும் ஏதேன் தோட்டத் தொடர்புக்கும் உண்மையாக உள்ளது.
- issue: ‘பன்னிரண்டு கனிகள்’ என்பதன் பொருள்
  choice: ‘பன்னிரண்டு கனிகள்’ என்று மூலத்தின் எண்ணிக்கைக் கூற்றைக் காக்குதல்
  alternative: ‘பன்னிரண்டு வகையான கனிகள்’ அல்லது ‘பன்னிரண்டு கனிப்பருவங்கள்’ என்று விளக்குதல்
  rationale: καρποὺς δώδεκα என்பது ‘பன்னிரண்டு கனிகள்’ என்கிறது; வகைகளையோ விளைச்சல்களையோ குறிக்கக்கூடும் என்றாலும் அவற்றில் ஒன்றை முதன்மை உரையில் கட்டாயப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘அகன்ற தெரு,’ ‘வாழ்வின் மரம்,’ ‘தேசங்கள்’ ஆகியவை நகரக் காட்சி, வேதாகம இடைநூல் தொடர்பு, உலகளாவிய பரப்பு ஆகியவற்றைக் காக்கின்றன. தரிசனக் காட்சியின் உண்மையான இடவியல் தெளிவின்மை விளக்கித் தீர்க்கப்படவில்லை.
