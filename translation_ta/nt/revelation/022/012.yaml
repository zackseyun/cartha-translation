id: REV.22.12
reference: Revelation 22:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἰδοὺ ἔρχομαι ταχύ, καὶ ὁ μισθός μου μετ’ ἐμοῦ, ἀποδοῦναι ἑκάστῳ ὡς τὸ ἔργον ⸀ἐστὶν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/012.yaml
  text: Behold[a], I am coming soon, and my reward is with me, to repay each one according to what his work is.
translation:
  language: ta
  text: “இதோ, நான் விரைவில்[a] வருகிறேன். ஒவ்வொருவருக்கும் அவரவருடைய செயல் எப்படியிருக்கிறதோ அதற்கேற்பத் திருப்பிக் கொடுப்பதற்காக, என் கைம்மாறு என்னோடு இருக்கிறது.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் வேகமாக வருகிறேன்.” கிரேக்கச் சொல் கால நெருக்கத்தை (“விரைவில்”) அல்லது வருகையின் வேகத்தையும் திடீர்மையையும் (“வேகமாக”) குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: தீர்க்கதரிசன மற்றும் திருவெளிப்பாட்டு நடையில் கவனத்தை ஈர்க்கும் சொல்லாகவும், நவீனத் தமிழில் கண்ணியமும் இயல்பும் உடையதாகவும் உள்ளது.
- source_word: ἔρχομαι
  choice: நான் ... வருகிறேன்
  rationale: நிகழ்கால வடிவத்தின் எதிர்கால நோக்கையும் நெருங்கிய வருகையையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ταχύ
  choice: விரைவில்
  rationale: கால நெருக்கத்தை இயல்பாகக் குறிக்கிறது; வேகம் அல்லது திடீர்மை என்ற சாத்தியமான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ὁ μισθός μου
  choice: என் கைம்மாறு
  rationale: μισθός என்பதிலுள்ள கூலி, பலன், பிரதிபலன் ஆகிய நியாயத்தீர்ப்புச் சார்ந்த பொருள் வரம்பை, வெறும் நேர்மறையான ‘வெகுமதி’ என்பதைக் காட்டிலும் நன்றாகப் பாதுகாக்கிறது.
- source_word: μετ’ ἐμοῦ
  choice: என்னோடு இருக்கிறது
  rationale: கிரேக்கத்தில் மறைந்துள்ள இணைப்புவினையைத் தமிழில் தெளிவாக வழங்குகிறது.
- source_word: ἀποδοῦναι
  choice: திருப்பிக் கொடுப்பதற்கு
  rationale: ஒருவருடைய செயலுக்கு ஏற்ப உரியதை அளித்தல் என்ற எதிரீட்டுப் பொருளைப் பாதுகாக்கிறது.
- source_word: ἑκάστῳ
  choice: ஒவ்வொருவருக்கும்
  rationale: ஒவ்வொரு நபருக்கும் தனித்தனியாக அளிக்கப்படும் பொறுப்பையும் கைம்மாறையும் தெளிவாகக் காட்டுகிறது.
- source_word: ὡς
  choice: எப்படியிருக்கிறதோ அதற்கேற்ப
  rationale: செயலின் தன்மையே கைம்மாற்றின் அளவுகோல் என்பதை, ἐστὶν என்ற வினையையும் பாதுகாத்து இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τὸ ἔργον ἐστὶν αὐτοῦ
  choice: அவரவருடைய செயல் எப்படியிருக்கிறதோ
  rationale: ‘செயல்’ என்ற வெளிப்படையான பெயர்ச்சொல்லையும் ‘இருக்கிறது’ என்ற நிகழ்காலக் கருத்தையும் தக்கவைக்கிறது; தமிழின் பகிர்வுப் பயன்பாடான ‘அவரவர்’ மூலத்தின் ஒருமை ஆண்பால் வடிவத்தின் பொதுமனிதக் குறிப்பை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ἑκάστῳ ... αὐτοῦ என்பதிலுள்ள பாலினக் குறிப்பு
  choice: ஒவ்வொருவருக்கும் அவரவருடைய செயல்
  alternative: ஒவ்வொருவனுக்கும் அவனுடைய செயல்
  rationale: கிரேக்க ஆண்பால் ஒருமை இங்கு பொதுமனிதப் பிரதிநிதித்துவப் பயன்பாடு கொண்டது. ‘அவரவர்’ என்பது நவீனத் தமிழில் பாலினத்தைச் செயற்கையாகச் சேர்க்காமல் தனிநபர் பொறுப்பையும் பகிர்வுப் பொருளையும் பாதுகாக்கிறது.
- issue: μισθός மற்றும் ἀποδοῦναι ஆகியவற்றின் கைம்மாற்றுப் பொருள்
  choice: என் கைம்மாறு ... திருப்பிக் கொடுப்பதற்கு
  alternative: என் வெகுமதி ... கொடுப்பதற்கு
  rationale: வசனம் செயல்களுக்கு ஏற்ப நன்மையோ தீமையோ உடைய நியாயமான கைம்மாற்றைக் குறிக்கக்கூடும். ‘கைம்மாறு’ மற்றும் ‘திருப்பிக் கொடு’ அந்தத் திறந்த பொருள் வரம்பைப் பாதுகாக்கின்றன; இறுதி இரட்சிப்பின் அடிப்படை குறித்து வசனம் கூறுவதைக் கடந்து எந்தக் கோட்பாட்டு முடிவையும் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், திருவெளிப்பாட்டுக்குரிய கண்ணியமான அறிவிப்பு நடை பேணப்பட்டுள்ளது. ‘இதோ’ என்ற கவன ஈர்ப்புச் சொல் தக்கவைக்கப்பட்டது; மிகப் பழமையான அல்லது சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டன.
