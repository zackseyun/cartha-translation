  text: καὶ πᾶν κατάθεμα οὐκ ἔσται ἔτι. καὶ ὁ θρόνος τοῦ θεοῦ καὶ τοῦ ἀρνίου ἐν αὐτῇ ἔσται, καὶ οἱ δοῦλοι αὐτοῦ λατρεύσουσιν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/003.yaml
  text: And there will no longer be any curse[a]. And the throne of God and of the Lamb will be in it, and his servants will worship him[d][c][b],
translation:
  language: ta
  text: சாபம் எதுவும் இனி இருக்காது[a]. கடவுளுக்கும் ஆட்டுக்குட்டியானவருக்கும் உரிய அரியணை அந்த நகரத்தில் இருக்கும். அவருடைய அடிமைகள்[b] அவரை[d] வழிபடுவார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சபிக்கப்பட்டது எதுவும்” அல்லது “சாபத்துக்குரிய பொருள் எதுவும்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பணியாளர்கள்” அல்லது “ஊழியர்கள்.” கிரேக்கச் சொல் உடைமைக்கும் முழுமையான கீழ்ப்படிதலுக்கும் உட்பட்டவர்களைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அவருக்குச் சேவை செய்வார்கள்” அல்லது “அவருக்குப் புனிதப் பணி செய்வார்கள்.”
    reason: lexical_alternative
  - marker: d
    text: கிரேக்கத்தில் “அரியணை” ஒருமையில் உள்ளது; அது “கடவுளுக்கும் ஆட்டுக்குட்டியானவருக்கும்” உரியது. தொடர்ந்து வரும் “அவருடைய,” “அவரை” என்பவையும் ஒருமையிலேயே உள்ளன. இவ்வாறு கடவுளுக்கும் ஆட்டுக்குட்டியானவருக்கும் இடையிலான வேறுபாடும் அவர்களுடைய பகிர்ந்த ஆட்சியும் ஒன்றாகப் பாதுகாக்கப்படுகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶν κατάθεμα
  choice: சாபத்துக்குரியது எதுவும்
  rationale: κατάθεμα என்பதை உறுதியான பொருளில் ‘சாபத்துக்குரியது’ எனக் கொண்டு, πᾶν உடன் வரும் முழுமையான மறுப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘சாபம் எதுவும்’ என்ற நிலை/விளைவு சார்ந்த பொருளும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: οὐκ ἔσται ἔτι
  choice: இனி ... இருக்காது
  rationale: எதிர்கால இருப்பின்மையையும் ἔτι என்பதன் ‘இனிமேல்/இனி’ என்ற பொருளையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: ὁ θρόνος
  choice: அரியணை
  rationale: ஒருமையைத் தெளிவாகப் பாதுகாக்கும் வழக்கமான, மாண்புமிக்க தமிழ் சொல்.
- source_word: τοῦ θεοῦ καὶ τοῦ ἀρνίου
  choice: கடவுளுக்கும் ஆட்டுக்குட்டியானவருக்கும் உரிய
  rationale: கடவுளையும் ஆட்டுக்குட்டியானவரையும் வேறுபடுத்திக் காட்டியபடியே, இருவருக்கும் உரிய ஒரே அரியணை என்ற கிரேக்க அமைப்பைப் பாதுகாக்கிறது.
- source_word: ἐν αὐτῇ
  choice: அந்த நகரத்தில்
  rationale: பெண்பால் ஒருமைச் சுட்டுப்பெயரின் முன்னிலையான நகரத்தைத் தமிழில் வெளிப்படையாகக் கூறுவது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: οἱ δοῦλοι αὐτοῦ
  choice: அவருடைய அடிமைகள்
  rationale: δοῦλοι என்பதில் உள்ள முழுமையான உடைமைக்கும் கீழ்ப்படிதலுக்கும் உரிய வலிமையை ‘அடிமைகள்’ பாதுகாக்கிறது; αὐτοῦ என்பதன் ஒருமையும் தக்கவைக்கப்படுகிறது.
- source_word: λατρεύσουσιν αὐτῷ
  choice: அவரை வழிபடுவார்கள்
  rationale: அரியணைச் சூழலில் λατρεύω குறிக்கும் கடவுளுக்குரிய புனித சேவையை வாசகர்களுக்குத் தெளிவாக ‘வழிபடுவார்கள்’ எனத் தருகிறது; αὐτῷ என்பதன் ஒருமையை ‘அவரை’ பாதுகாக்கிறது.
theological_decisions:
- issue: கடவுளுக்கும் ஆட்டுக்குட்டியானவருக்கும் உரிய ஒரே அரியணையும் அதைத் தொடர்ந்து வரும் ஒருமைச் சுட்டுப்பெயர்களும்
  choice: ‘அரியணை’ என்பதையும் ‘அவருடைய ... அவரை’ என்பதையும் ஒருமையில் வைத்தல்
  alternative: ‘அவர்களுடைய அடியார்கள் அவர்களை வழிபடுவார்கள்’ என்று பன்மைப்படுத்துதல்
  rationale: கிரேக்கம் கடவுளையும் ஆட்டுக்குட்டியானவரையும் வேறுபடுத்திக் கூறினாலும், ஒரே அரியணையையும் ஒருமைச் சுட்டுப்பெயர்களையும் பயன்படுத்துகிறது. அந்த இறையியல் நெருக்கடியை விளக்கித் தீர்க்காமல் மொழிபெயர்ப்பு அப்படியே பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, மாண்புமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘ஆட்டுக்குட்டியானவர்’ வெளிப்படுத்தின விசேஷத்தில் உள்ள பலியிடப்பட்ட ஆட்டுக்குட்டி மற்றும் மேசியா சார்ந்த உருவகத்தை மரியாதை ஒருமையுடன் தக்கவைக்கிறது. ‘அந்த நகரத்தில்’ என்பது தமிழில் தெளிவுக்காக முன்னிலையை வெளிப்படையாக்குகிறது.
