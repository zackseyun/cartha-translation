id: REV.22.6
reference: Revelation 22:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ⸀εἶπέν μοι· Οὗτοι οἱ λόγοι πιστοὶ καὶ ἀληθινοί, καὶ ⸀ὁ κύριος, ὁ θεὸς τῶν πνευμάτων τῶν προφητῶν, ἀπέστειλεν τὸν ἄγγελον αὐτοῦ δεῖξαι τοῖς δούλοις αὐτοῦ ἃ δεῖ γενέσθαι ἐν τάχει·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/006.yaml
  text: And he said to me[a], “These words are trustworthy and true, and the Lord, the God of the spirits of the prophets[b], sent his angel to show his servants what must happen soon.”
translation:
  language: ta
  text: அவர் என்னிடம், “இந்த வார்த்தைகள் நம்பத்தகுந்தவையும் உண்மையானவையும் ஆகும். தீர்க்கதரிசிகளின் ஆவிகளுக்குக் கடவுளான ஆண்டவர், விரைவில்[a] நிகழ வேண்டியவற்றைத் தம் அடிமைகளுக்கு[b] காட்டுவதற்காகத் தமது வானதூதரை அனுப்பினார்” என்று சொன்னார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விரைவாக.” கிரேக்கச் சொற்றொடர் கால நெருக்கத்தையோ (“விரைவில்”), நிகழ்வுகள் நடைபெறும் வேகத்தையோ (“விரைவாக”) வலியுறுத்தலாம்.
    reason: alternative_reading
  - marker: b
    text: “அடிமைகள்” என்பதற்குப் பதிலாக “ஊழியர்கள்” அல்லது “பணியாளர்கள்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ஒருவருக்குச் சொந்தமானவராக இருந்து அவருக்குப் பணிபுரிவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστοὶ
  choice: நம்பத்தகுந்தவை
  rationale: வார்த்தைகளின் நம்பகத்தன்மையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; ‘உண்மையானவை’ என்பதுடன் வரும் தனித்த நுண்பொருளையும் காக்கிறது.
- source_word: ἀληθινοί
  choice: உண்மையானவை
  rationale: வார்த்தைகளின் மெய்ம்மையையும் உண்மைத்தன்மையையும் நேரடியாகக் குறிக்கிறது.
- source_word: ὁ κύριος
  choice: ஆண்டவர்
  rationale: இங்கு கடவுளைக் குறிக்கும் பட்டமாக இருப்பதால், தமிழின் வழக்கமான வேதாகமப் பயன்பாட்டையும் தெய்வீகப் பொருளையும் காக்கிறது.
- source_word: ὁ θεὸς τῶν πνευμάτων τῶν προφητῶν
  choice: தீர்க்கதரிசிகளின் ஆவிகளுடைய கடவுள்
  rationale: கிரேக்க மொழியின் உரிமைத் தொடர்பை இயன்றவரை வெளிப்படையாக வைத்திருந்து, இது ‘தீர்க்கதரிசிகளைத் தூண்டுகிற கடவுள்’ என்று விளக்கவுரையாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: ἄγγελον
  choice: வானதூதர்
  rationale: வெளிப்படுத்தின விசேஷத்தின் தரிசனச் சூழலில் இது மனிதத் தூதரைவிட வானுலகத் தூதரைக் குறிக்கிறது; தமிழில் அந்த வேறுபாட்டைத் தெளிவாக்குகிறது.
- source_word: δούλοις
  choice: அடிமைகள்
  rationale: δοῦλος என்பதில் உள்ள உரிமைப்பட்ட நிலை மற்றும் முழுமையான கீழ்ப்படிதலை ‘ஊழியர்கள்’ என்பதைவிடத் தெளிவாகக் காக்கிறது.
- source_word: δεῖξαι
  choice: காட்டுவதற்காக
  rationale: தரிசனச் சூழலுக்கு ஏற்றவாறு δείκνυμι என்பதன் நேரடியான பொருளை வழங்குகிறது.
- source_word: ἃ δεῖ γενέσθαι
  choice: நிகழ வேண்டியவை
  rationale: δεῖ என்பதிலுள்ள அவசியத்தையும் γενέσθαι என்பதிலுள்ள நிகழ்வையும் சுருக்கமான, இயல்பான தமிழில் காக்கிறது.
- source_word: ἐν τάχει
  choice: விரைவில்
  rationale: இச்சூழலில் கால நெருக்கத்தை இயல்பாகத் தெரிவிக்கிறது; நிகழ்வின் வேகத்தைக் குறிக்கும் சாத்தியம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: Καὶ εἶπέν μοι
  choice: அவர் என்னிடம் … என்று சொன்னார்
  rationale: καί தொடர்ச்சியைத் தமிழின் உரைநடையில் தனியாக வலியுறுத்தாமல், பேச்சு அறிமுகத்தை இயல்பாக அளிக்கிறது; ஆண்பால் ஒருமை எழுவாயையும் தீர்மானிக்காமல் ‘அவர்’ எனக் காக்கிறது.
theological_decisions:
- issue: ἐν τάχει என்பதன் இறுதிக்காலப் பொருள்
  choice: விரைவில்
  alternative: விரைவாக
  rationale: இந்தச் சொற்றொடர் கால நெருக்கத்தையோ, நிகழத் தொடங்கிய பின் வேகமாக நடைபெறுவதையோ குறிக்கலாம். முதன்மை உரை கால நெருக்கத்தைத் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: கடவுளுடைய மக்களைக் குறிக்கும் δοῦλοι என்பதன் வலிமை
  choice: அடிமைகள்
  alternative: ஊழியர்கள் / பணியாளர்கள்
  rationale: இங்கு கடவுளுக்குச் சொந்தமானவர்களாக இருப்பது கருத்தில் முக்கியமானது. ஆகவே மென்மையாக்காமல் ‘அடிமைகள்’ என மொழிபெயர்க்கப்படுகிறது; இயல்பான மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
- issue: தீர்க்கதரிசிகளின் ஆவிகளுக்கும் கடவுளுக்கும் உள்ள தொடர்பு
  choice: தீர்க்கதரிசிகளின் ஆவிகளுடைய கடவுள்
  alternative: தீர்க்கதரிசிகளைத் தூண்டுகிற கடவுள் / தீர்க்கதரிசன ஆவிகளின் கடவுள்
  rationale: மூலத்தின் தொடர் உரிமைவேற்றுமை அமைப்பு, ஆவிகள் தீர்க்கதரிசிகளின் ஆவிகளா அல்லது தீர்க்கதரிசனச் செயல்பாட்டைக் குறிக்கிறதா என்பதை முழுமையாகத் தீர்மானிப்பதில்லை. மொழிபெயர்ப்பு அந்தத் தெளிவின்மையைத் திறந்தவாறே வைக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் கண்ணியமான, வாசிக்க எளிய உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தீர்க்கதரிசிகளின் ஆவிகளுடைய கடவுள்’ என்ற சற்றே முறையான அமைப்பு, மூலத்தின் உண்மையான பொருள் தெளிவின்மையைப் பாதுகாப்பதற்காகத் தக்கவைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்களுக்குப் பின்பே வைக்கப்பட்டுள்ளன.
