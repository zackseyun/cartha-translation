id: REV.22.1
reference: Revelation 22:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἔδειξέν μοι ⸀ποταμὸν ὕδατος ζωῆς λαμπρὸν ὡς κρύσταλλον, ἐκπορευόμενον ἐκ τοῦ θρόνου τοῦ θεοῦ καὶ τοῦ ἀρνίου
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/001.yaml
  text: And he showed me a river of the water of life[a], bright as crystal[b], flowing out from the throne of God and of the Lamb.
translation:
  language: ta
  text: அவர், கடவுளுக்கும் ஆட்டுக்குட்டியானவருக்கும் உரிய அரியணையிலிருந்து வெளிப்பாயும், பளிங்கைப்போல் ஒளிவீசும் வாழ்வின் தண்ணீர் நதி ஒன்றை எனக்குக் காட்டினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδειξέν μοι
  choice: எனக்குக் காட்டினார்
  rationale: தரிசனக் காட்சியின் இயல்பை கூடுதல் விளக்கமின்றி இயல்பான தமிழில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: ποταμὸν ὕδατος ζωῆς
  choice: வாழ்வின் தண்ணீர் நதி ஒன்று
  rationale: ‘வாழ்வின் தண்ணீர்’ என்ற வேதாகமப் படிமத்தையும் ποταμός என்பதன் ‘நதி’ என்ற பொருளையும் காக்கிறது; ‘வாழ்வளிக்கும் தண்ணீர்’ என விளக்கிப் பொருளைச் சுருக்கவில்லை.
- source_word: λαμπρὸν ὡς κρύσταλλον
  choice: பளிங்கைப்போல் ஒளிவீசும்
  rationale: λαμπρός என்பதன் முதன்மையான ஒளிர்வு அல்லது பிரகாசம் என்ற பொருளையும் ὡς குறிக்கும் உவமையையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; ‘தெளிவான’ என்று மட்டும் மொழிபெயர்த்து வெளிப்படைத்தன்மையை முன்னிறுத்தவில்லை.
- source_word: ἐκπορευόμενον
  choice: பாய்ந்துவரும்
  rationale: நதியின் இயக்கத்தையும் அது அரியணையிலிருந்து தோன்றிவருவதையும் இயல்பாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: ἐκ τοῦ θρόνου τοῦ θεοῦ καὶ τοῦ ἀρνίου
  choice: கடவுளுக்கும் ஆட்டுக்குட்டியானவருக்கும் உரிய அரியணையிலிருந்து
  rationale: மூலத்தில் ‘அரியணை’ ஒருமையில் இருப்பதைக் காத்து, கடவுளோடும் ஆட்டுக்குட்டியானவரோடும் தொடர்புடைய ஒரே அரியணை என்ற இலக்கண அமைப்பை தமிழில் தெளிவாக்குகிறது.
- source_word: τοῦ ἀρνίου
  choice: ஆட்டுக்குட்டியானவர்
  rationale: வெளிப்படுத்தலில் கிறிஸ்துவைக் குறிக்கும் முக்கியப் பட்டத்தின் பலியிடுதல் சார்ந்த படிமத்தைக் காக்கிறது; நபரைக் குறிக்கும் மரியாதைத் தமிழுக்காக ‘ஆனவர்’ வடிவம் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: கடவுளுக்கும் ஆட்டுக்குட்டியானவருக்கும் தொடர்புடைய ஒரே அரியணை
  choice: ‘கடவுளுக்கும் ஆட்டுக்குட்டியானவருக்கும் உரிய அரியணை’ என்று ஒருமையில் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘கடவுளுடைய அரியணையிலிருந்தும் ஆட்டுக்குட்டியானவருடைய அரியணையிலிருந்தும்’ என இரண்டு அரியணைகளாக மொழிபெயர்த்தல்.
  rationale: கிரேக்கத்தில் θρόνου ஒருமையில் வந்து, ‘கடவுளின்’ மற்றும் ‘ஆட்டுக்குட்டியானவரின்’ என்ற இரு சார்புப்பெயர்களுடன் இணைகிறது. எனவே பகிரப்பட்ட ஒரே அரியணை என்ற காட்சியின் இறையியல் அழுத்தம் விளக்கவுரையால் விரிவாக்கப்படாமலும் பன்மையாக்கப்படாமலும் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான தரிசன நடையைப் பயன்படுத்துகிறது. ‘வாழ்வின் தண்ணீர்’ மற்றும் ‘ஆட்டுக்குட்டியானவர்’ ஆகிய முக்கிய வேதாகமப் படிமங்கள் விளக்கப் பொழிப்புரையாக மாற்றப்படாமல் காக்கப்பட்டுள்ளன.
