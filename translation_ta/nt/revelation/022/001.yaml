revisions:
- from: பின்பு அவர், கடவுளுக்கும் ஆட்டுக்குட்டியானவருக்கும் உரிய அரியணையிலிருந்து பாய்ந்துவரும், பளிங்கைப்போல் ஒளிவீசும் வாழ்வின் தண்ணீர் நதி ஒன்றை எனக்குக் காட்டினார்.
  to: அவர், கடவுளுக்கும் ஆட்டுக்குட்டியானவருக்கும் உரிய அரியணையிலிருந்து வெளிப்பாயும், பளிங்கைப்போல் ஒளிவீசும் வாழ்வின் தண்ணீர் நதி ஒன்றை எனக்குக் காட்டினார்.
  rationale: The revision removes the unsupported temporal addition «பின்பு» and replaces «பாய்ந்துவரும்» with «வெளிப்பாயும்» to represent ἐκπορευόμενον as flowing out from the throne. It preserves the Greek's singular «அரியணை» with coordinated possessors and retains the source imagery and formal biblical register.
