id: REV.22.16
reference: Revelation 22:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἐγὼ Ἰησοῦς ἔπεμψα τὸν ἄγγελόν μου μαρτυρῆσαι ὑμῖν ταῦτα ἐπὶ ταῖς ἐκκλησίαις. ἐγώ εἰμι ἡ ῥίζα καὶ τὸ γένος Δαυίδ, ὁ ἀστὴρ ὁ λαμπρός, ὁ πρωϊνός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/016.yaml
  text: I[a], Jesus, have sent my angel to testify to you these things for the churches[b]. I am the root and the descendant of David, the bright morning star.
translation:
  language: ta
  text: “இயேசுவாகிய நான், சபைகளுக்காக[a] இவற்றை உங்களுக்குச் சாட்சியாக அறிவிக்கும்படி என் தூதனை அனுப்பியிருக்கிறேன். நானே தாவீதின் வேரும் வழித்தோன்றலும்[b], ஒளிவீசும் விடிவெள்ளி நட்சத்திரமும் ஆவேன்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சபைகளில்’; அல்லது, ‘சபைகளைப் பற்றி.’ ἐπὶ ταῖς ἐκκλησίαις என்ற கிரேக்கச் சொற்றொடர் ஒன்றுக்கு மேற்பட்ட நுண்பொருள்களை அனுமதிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தாவீதின் சந்ததி.’
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγὼ Ἰησοῦς
  choice: இயேசுவாகிய நான்
  rationale: வலியுறுத்தப்பட்ட தன்மைப் பெயரையும் இயேசு என்ற பெயரையும் இயல்பான நவீனத் தமிழில் சுயஅடையாளமாக வெளிப்படுத்துகிறது; கிரேக்கத்தில் இல்லாத தனியான ‘இருக்கிறேன்’ வினையைச் சேர்க்கவில்லை.
- source_word: ἔπεμψα
  choice: அனுப்பியிருக்கிறேன்
  rationale: முடிவுற்றிருந்தாலும் தற்போதைய உரையுடன் தொடர்புடைய அனுப்புதலைத் தமிழின் நிறைவுநிலை வடிவில் இயல்பாகக் காட்டுகிறது.
- source_word: τὸν ἄγγελόν μου
  choice: என் தூதனை
  rationale: வெளிப்படுத்தின விசேஷத்தின் தரிசனச் சூழலில் ἄγγελος வானதூதரைக் குறிக்கிறது; ‘தூதன்’ தமிழில் இதற்கான வழக்கமான, தெளிவான சொல்.
- source_word: μαρτυρῆσαι ὑμῖν ταῦτα
  choice: இவற்றை உங்களுக்குச் சாட்சியாக அறிவிக்கும்படி
  rationale: நோக்கத்தைக் குறிக்கும் இறந்தகால வினையெச்சத்தின் செயலையும், μαρτυρέω என்பதிலுள்ள சாட்சி கூறும் பொருளையும், ταῦτα என்பதன் பன்மையையும் தெளிவாகப் பேணுகிறது.
- source_word: ἐπὶ ταῖς ἐκκλησίαις
  choice: சபைகளுக்காக
  rationale: சாட்சியின் நோக்கமும் அது சபைகளுக்குரியது என்பதையும் இயல்பான தமிழில் தெரிவிக்கிறது; கிரேக்க முன்னிடைச்சொல் அனுமதிக்கும் பிற நுண்பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: ἡ ῥίζα
  choice: வேர்
  rationale: மூலம் அல்லது தோற்றம் சார்ந்த உருவகத்தை விளக்கி மாற்றாமல் நேரடியாகப் பேணுகிறது.
- source_word: τὸ γένος Δαυίδ
  choice: தாவீதின் வழித்தோன்றல்
  rationale: γένος என்பதன் குடும்பவழி அல்லது சந்ததி என்ற பொருளை ஒருவரைக் குறிக்கும் இயல்பான தமிழில் தருகிறது.
- source_word: ὁ ἀστὴρ ὁ λαμπρός, ὁ πρωϊνός
  choice: ஒளிவீசும் விடிவெள்ளி நட்சத்திரம்
  rationale: λαμπρός மற்றும் πρωϊνός ஆகிய இரு விவரிப்புகளையும் இயல்பான தமிழ்ச் சொற்றொடரில் ஒன்றிணைத்து, நட்சத்திர உருவகத்தைத் தெளிவாக வைத்திருக்கிறது.
theological_decisions:
- issue: மேசியா தாவீதின் வேரும் வழித்தோன்றலும் எனும் சுயஅடையாளம்
  choice: ‘தாவீதின் வேரும் வழித்தோன்றலும்’ என்று இரு உருவகங்களையும் அப்படியே வைத்தல்
  alternative: ‘தாவீதின் மூலமும் சந்ததியும்’
  rationale: இயேசு தாவீதுக்கு முன்னான மூலமாகவும் அவரது வழியில் வந்தவராகவும் கூறப்படும் இறையியல் இழுவிசையை வசனம் விளக்கித் தீர்க்கவில்லை; மொழிபெயர்ப்பும் அதைத் தீர்க்காமல் பேணுகிறது.
- issue: ‘விடிவெள்ளி நட்சத்திரம்’ என்ற கிறிஸ்துவியல் பட்டம்
  choice: ‘ஒளிவீசும் விடிவெள்ளி நட்சத்திரம்’ என இயேசுவின் நேரடியான சுயவிளக்கமாக வைத்தல்
  alternative: ‘பிரகாசமான காலை நட்சத்திரம்’
  rationale: கிரேக்கத்தின் ஒளிமிக்க காலை நட்சத்திர உருவகத்தைப் பேணுகிறது; வசனத்திற்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வெளிப்பாடு பயன்படுத்தப்பட்டுள்ளது. ‘நானே’ இரண்டாவது வாக்கியத்தின் வலியுறுத்தலைப் பேணுகிறது; தொடர்ச்சியான பெயர்ப்பயனிலைகளை இயல்பாக்க இறுதியில் ‘ஆவேன்’ சேர்க்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறியீடுகளும் அவை விளக்கும் சொற்றொடர்களின் உடனேயே வைக்கப்பட்டுள்ளன.
