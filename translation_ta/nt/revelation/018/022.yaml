id: REV.18.22
reference: Revelation 18:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ φωνὴ κιθαρῳδῶν καὶ μουσικῶν καὶ αὐλητῶν καὶ σαλπιστῶν οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι, καὶ πᾶς τεχνίτης πάσης τέχνης οὐ μὴ εὑρεθῇ ἐν σοὶ ἔτι, καὶ φωνὴ μύλου οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/022.yaml
  text: And the sound of harpists and musicians and flute players and trumpeters will never be heard in you again[a], and no craftsman of any craft will ever be found in you again, and the sound of a mill will never be heard in you again[b],
translation:
  language: ta
  text: யாழ் வாசிப்பவர்களின், இசைக் கலைஞர்களின், குழல் ஊதுபவர்களின்[a], எக்காளம் ஊதுபவர்களின் ஓசை இனி ஒருபோதும் உன்னில் கேட்காது. எந்தக் கைத்தொழிலின் கைவினைஞரும் இனி ஒருபோதும் உன்னில் காணப்படமாட்டார். திரிகையின் ஓசையும் இனி ஒருபோதும் உன்னில் கேட்காது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘குழல் ஊதுபவர்கள்’ என்பதில் குறிப்பிடப்படும் கிரேக்க αὐλός, நவீன புல்லாங்குழலுடன் முற்றிலும் ஒன்றல்லாத பழங்காலக் காற்றிசைக் கருவி.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘திரிகைக்கல்லின் ஓசை’; கிரேக்கச் சொல் அரைக்கும் சாதனத்தை இன்னும் குறிப்பாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: ஓசை
  rationale: இங்கு பேசும் குரல் அல்ல, இசைக்கருவிகளாலும் திரிகையாலும் எழும் கேட்கக்கூடிய ஒலியைக் குறிக்கிறது. இரு இடங்களிலும் இயல்பாகப் பொருந்தி, நகர வாழ்வு மௌனமாவதைக் காட்டும் மறுபடியும் வரும் படிமத்தையும் காக்கிறது.
- source_word: κιθαρῳδῶν
  choice: யாழ் வாசிப்பவர்கள்
  rationale: கித்தாரா என்னும் பழங்கால நரம்பிசைக் கருவியுடன் தொடர்புடைய கலைஞர்களைக் குறிக்கிறது. கருவியின் துல்லியமான நவீன இணை இல்லாததால், தமிழில் புரிந்துகொள்ள எளிதான நரம்பிசைக் கருவிப் பெயராக ‘யாழ்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: μουσικῶν
  choice: இசைக் கலைஞர்கள்
  rationale: இசை நிகழ்த்துவோரைக் குறிக்கும் பொதுப்பெயராக இயல்பான, தற்போதைய தமிழை வழங்குகிறது.
- source_word: αὐλητῶν
  choice: குழல் ஊதுபவர்கள்
  rationale: αὐλός என்னும் பழங்காலக் காற்றிசைக் கருவியை வாசிப்போரைக் குறிக்கிறது. அது நவீன புல்லாங்குழலுடன் முற்றிலும் ஒன்றல்ல என்பதால் பொதுவான ‘குழல்’ என்பது பொருத்தமானது.
- source_word: σαλπιστῶν
  choice: எக்காளம் ஊதுபவர்கள்
  rationale: எக்காளம் போன்ற அறிவிப்பு அல்லது போர்க்காற்றிசைக் கருவியை ஊதுவோரைக் குறிக்கும் தெளிவான தமிழ் சொற்றொடர்.
- source_word: οὐ μὴ ἀκουσθῇ ... ἔτι
  choice: இனி ஒருபோதும் ... கேட்காது
  rationale: οὐ μή என்ற வலியுறுத்தப்பட்ட மறுப்பையும் ἔτι தரும் ‘இனிமேல் இல்லை’ என்ற இறுதித் தன்மையையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐν σοὶ
  choice: உன்னில்
  rationale: பாபிலோன் நகரம் ஒரு நபரைப்போல் நேரடியாக விளிக்கப்படுவதைப் பாதுகாக்கிறது.
- source_word: πᾶς τεχνίτης πάσης τέχνης
  choice: எந்தத் தொழிலையும் சேர்ந்த கைவினைஞர் எவரும்
  rationale: எல்லா வகையான திறன்சார் கைத்தொழிலாளர்களையும் உள்ளடக்கும் கிரேக்கச் சொற்றொடரின் முழுமையான பரப்பையும், இயல்பான தமிழ் மறுப்பு அமைப்பையும் காக்கிறது.
- source_word: οὐ μὴ εὑρεθῇ ... ἔτι
  choice: இனி ஒருபோதும் ... காணப்படமாட்டார்
  rationale: அத்தகைய கைவினைஞர் முற்றிலும் இல்லாமல் போவார் என்ற வலியுறுத்தப்பட்ட மறுப்பை இயல்பாகத் தருகிறது.
- source_word: μύλου
  choice: திரிகை
  rationale: தானியத்தை அரைக்கும் சாதனம் அல்லது அதன் அரைப்புச் செயல்பாட்டைக் குறிக்கும் படிமத்தைச் சுருக்கமாகத் தருகிறது; ‘திரிகைக்கல்’ என்ற குறிப்பான பொருளும் சாத்தியம்.
theological_decisions:
- issue: பாபிலோனின் நியாயத்தீர்ப்புப் படிமம்
  choice: கொண்டாட்ட இசை, திறன்சார் உழைப்பு, அன்றாட உணவுத் தயாரிப்பு ஆகிய அனைத்தும் தீர்ப்புக்குள்ளான நகரத்தில் முற்றிலும் நின்றுவிடும் என மூன்று முறை அறிவிக்கும் வகையில் மொழிபெயர்க்கப்பட்டது.
  alternative: இப்பட்டியலை எந்த அடையாளப் பொருளும் இல்லாத அலங்கார விவரங்களாக மட்டும் கருதுதல்.
  rationale: மீண்டும் வரும் οὐ μή ... ἔτι அமைப்பு முழுமையானதும் திரும்பமுடியாததுமான பாழாக்கலை வலியுறுத்துகிறது. எனினும் மொழிபெயர்ப்பு இவற்றை மிகையாக உருவகப்படுத்தாமல், மூலத்தின் தெளிவான காட்சிகளையே காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. தொடர்ச்சியான ‘மற்றும்’ இணைப்புகளை அப்படியே குவிக்காமல் மூன்று தெளிவான வாக்கியங்களாகப் பிரித்தாலும், மூலத்தின் பட்டியல் அமைப்பும் மூன்றுமுறை வரும் இறுதி மறுப்பும் பாதுகாக்கப்பட்டுள்ளன. ‘உன்னில்’ என்பது நகரமாக உருவகப்படுத்தப்பட்ட பாபிலோனை நோக்கிய ஒருமை நேரடி விளிப்பைத் தக்கவைக்கிறது.
