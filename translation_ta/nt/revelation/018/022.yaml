- from: யாழ் வாசிப்பவர்களும், இசைக் கலைஞர்களும், குழல் ஊதுபவர்களும், எக்காளம் ஊதுபவர்களும் எழுப்பும் ஓசை இனி ஒருபோதும் உன்னில் கேட்காது[a]. எந்தத் தொழிலையும் சேர்ந்த கைவினைஞர் எவரும் இனி ஒருபோதும் உன்னில் காணப்படமாட்டார். திரிகையின் ஓசையும் இனி ஒருபோதும் உன்னில் கேட்காது[b].
  to: யாழ் வாசிப்பவர்களின், இசைக் கலைஞர்களின், குழல் ஊதுபவர்களின்[a], எக்காளம் ஊதுபவர்களின் ஓசை இனி ஒருபோதும் உன்னில் கேட்காது. எந்தக் கைத்தொழிலின் கைவினைஞரும் இனி ஒருபோதும் உன்னில் காணப்படமாட்டார். திரிகையின் ஓசையும் இனி ஒருபோதும் உன்னில் கேட்காது[b].
