  to: 'இவ்வாறு கூறினார்கள்: “ஐயோ, ஐயோ![a] நுண்ணிய சணல் துணியையும் ஊதா நிற ஆடையையும் செந்நிற ஆடையையும் அணிந்திருந்த அந்த மாபெரும் நகரம்! தங்கத்தாலும் விலையுயர்ந்த கற்களாலும் முத்துகளாலும் அலங்கரிக்கப்பட்டிருந்ததே!”'
  rationale: நேரடி சம்போதனை மற்றும் இரண்டாம் நபர் வினை வடிவத்தை நீக்கி, கிரேக்கத்தின் பெயரெழுவாய் அமைப்புக்கு நெருக்கமான புலம்பல்-வியப்பு கூற்றாக மாற்றப்பட்டுள்ளது. மேலும் ‘மெல்லிய நார்த்துணி’ என்பதற்குப் பதிலாக ‘நுண்ணிய சணல் துணி’ பயன்படுத்தப்பட்டு fine linen-இன் பொருள் தெளிவாக்கப்பட்டுள்ளது. மற்ற ஆடம்பரப் பட்டியல், இரட்டைப் புலம்பல், மற்றும் மாற்று வாசிப்புக்கான அடிக்குறிப்பு காக்கப்பட்டுள்ளன.
