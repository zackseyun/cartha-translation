id: REV.18.16
reference: Revelation 18:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, ἡ περιβεβλημένη βύσσινον καὶ πορφυροῦν καὶ κόκκινον καὶ ⸀κεχρυσωμένη χρυσίῳ καὶ λίθῳ τιμίῳ καὶ ⸀μαργαρίτῃ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/016.yaml
  text: saying[a], “Woe, woe, the great city, clothed in fine linen and purple and scarlet, and adorned with gold and precious stones and pearls,”
translation:
  language: ta
  text: 'இவ்வாறு கூறினார்கள்: “ஐயோ, ஐயோ![a] நுண்ணிய சணல் துணியையும் ஊதா நிற ஆடையையும் செந்நிற ஆடையையும் அணிந்திருந்த அந்த மாபெரும் நகரம்! தங்கத்தாலும் விலையுயர்ந்த கற்களாலும் முத்துகளாலும் அலங்கரிக்கப்பட்டிருந்ததே!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்தோ, அந்தோ!”
    reason: οὐαί என்பது சூழலின்படி தீர்ப்புடன் கூடிய ‘ஐயோ’ என்ற கூக்குரலாகவும், ஆழ்ந்த துயரத்தை வலியுறுத்தும் ‘அந்தோ’ என்ற புலம்பலாகவும் வழங்கப்படலாம்.
lexical_decisions:
- source_word: λέγοντες
  choice: இவ்வாறு கூறினார்கள்
  rationale: பன்மை நிகழ்கால வினையெச்சம் முந்தைய வசனத்திலுள்ள பேசுபவர்களையும் அவர்களுடைய புலம்பலையும் தொடர்கிறது. தனித்த வசனமாகத் தமிழில் இயல்பாக வாசிக்க வினைமுற்று பயன்படுத்தப்பட்டுள்ளது.
- source_word: Οὐαὶ οὐαί
  choice: ஐயோ, ஐயோ
  rationale: துயரப் புலம்பலையும் தீர்ப்பின் கடுமையான தொனியையும் ஒருங்கே வெளிப்படுத்தும் இயல்பான தமிழ் இடைச்சொல்; இரட்டிப்பு அப்படியே காக்கப்பட்டுள்ளது.
- source_word: ἡ πόλις ἡ μεγάλη
  choice: மாபெரும் நகரமே
  rationale: கிரேக்கத்தின் வலியுறுத்தலை இயல்பான தமிழ் விளிவடிவில் வெளிப்படுத்துகிறது.
- source_word: περιβεβλημένη
  choice: அணிந்து
  rationale: நகரம் ஆடம்பர உடையில் காணப்படும் நிலையைச் சித்தரிக்கும் நிறைவு வினையெச்சத்தின் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: βύσσινον
  choice: மெல்லிய நார்த்துணி
  rationale: விலையுயர்ந்த நுண்ணிய linen வகைத் துணியைக் குறிக்கிறது; அதை பட்டு எனத் தவறாக அடையாளப்படுத்தாமல், பொதுவாசகருக்குப் புரியும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: πορφυροῦν καὶ κόκκινον
  choice: ஊதா நிற ஆடையையும் செந்நிற ஆடையையும்
  rationale: செல்வத்தையும் ஆடம்பரத்தையும் உணர்த்தும் இரு நிறங்களையும் தெளிவாக வேறுபடுத்தி, தமிழில் அணிதலோடு இயல்பாக இணைத்துள்ளது.
- source_word: κεχρυσωμένη
  choice: அலங்கரிக்கப்பட்டிருந்தாயே
  rationale: தங்கமிடுதல் என்ற குறுகிய பொருளுக்கு அப்பால், தொடர்ந்து வரும் தங்கம், விலைமதிப்புள்ள கற்கள், முத்துகள் அனைத்தையும் கொண்ட ஆடம்பர அலங்கார நிலையை வெளிப்படுத்துகிறது.
- source_word: χρυσίῳ καὶ λίθῳ τιμίῳ καὶ μαργαρίτῃ
  choice: தங்கத்தாலும் விலைமதிப்புள்ள கற்களாலும் முத்துகளாலும்
  rationale: அலங்காரப் பொருட்களின் பட்டியலை இயல்பான தமிழில் தருகிறது; கிரேக்க ஒருமைகள் இங்கு வகை அல்லது தொகுப்புப் பொருளில் வருவதால் கற்களும் முத்துகளும் தமிழில் பன்மையாக வழங்கப்பட்டுள்ளன.
theological_decisions:
- issue: பாபிலோனின் வீழ்ச்சியைப் பற்றிய புலம்பலின் தொனி
  choice: οὐαί என்பதை ‘ஐயோ’ என வழங்கி புலம்பலையும் தீர்ப்பின் தொனியையும் காத்தல்
  alternative: ‘அந்தோ’ என வழங்கி துயர உணர்வை அதிகமாக முன்னிறுத்தல்
  rationale: வெளிப்படுத்தின விசேஷத்தின் இந்தத் தீர்ப்பு உரையில் துயரமும் தண்டனை அறிவிப்பும் ஒன்றோடொன்று பின்னியுள்ளன. ‘ஐயோ’ இரண்டையும் தாங்குகிறது; வெறும் வருத்தமாக மட்டும் பொருளைக் குறுக்குவதில்லை.
- issue: நகரை நேரடியாக விளித்தல்
  choice: ‘மாபெரும் நகரமே … அலங்கரிக்கப்பட்டிருந்தாயே’ என்ற நேரடி விளி
  alternative: ‘மாபெரும் நகரம் … அலங்கரிக்கப்பட்டிருந்தது’ என்ற மூன்றாம் நபர் விளக்கம்
  rationale: கிரேக்கத்தில் ‘நகரம்’ இலக்கணரீதியாக எழுவாய் வடிவில் இருந்தாலும், οὐαί உடனான புலம்பல் அமைப்பு நேரடி விளியாக ஒலிக்கிறது. தமிழில் இந்தத் துயரக் கூக்குரலை இயல்பாகவும் உயிரோட்டமாகவும் காக்க விளிவடிவு தேர்ந்தெடுக்கப்பட்டுள்ளது; ‘உனக்கு’ போன்ற மூலத்தில் இல்லாத சொல் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் வெளிப்படுத்தின விசேஷத்துக்குரிய கண்ணியமான தீர்ப்பு-புலம்பல் தொனியுடனும் மொழியாக்கப்பட்டுள்ளது. ஆடை மற்றும் நகை அலங்காரப் படிமம் தெளிவாக இருக்க ‘ஆடை’ தேவையான இடங்களில் வெளிப்படுத்தப்பட்டுள்ளது; மூலத்தின் ஆடம்பரப் பட்டியல் மற்றும் இரட்டைப் புலம்பல் காக்கப்பட்டுள்ளன.
