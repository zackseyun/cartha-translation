source:
  edition: SBLGNT
  text: ὅτι μιᾷ ὥρᾳ ἠρημώθη ὁ τοσοῦτος πλοῦτος. Καὶ πᾶς κυβερνήτης καὶ πᾶς ὁ ἐπὶ τόπον πλέων, καὶ ναῦται καὶ ὅσοι τὴν θάλασσαν ἐργάζονται, ἀπὸ μακρόθεν ἔστησαν
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/017.yaml
  text: for in one hour such great wealth has been laid waste. And every shipmaster, and everyone sailing to a place, and sailors, and as many as work the sea, stood far off
translation:
  language: ta
  text: ஏனெனில், ஒரே மணி நேரத்தில் இவ்வளவு பெரும் செல்வம் பாழாக்கப்பட்டது. கப்பல் தலைவர்கள் அனைவரும், ஓரிடத்திற்குக் கடற்பயணம் செய்கிற அனைவரும்[a], மாலுமிகளும், கடலைத் தொழிலாகக் கொண்ட அனைவரும் தொலைவில் நின்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எங்காவது கடற்பயணம் செய்கிற அனைவரும்” அல்லது “ஒரு துறைமுகத்தை நோக்கிப் பயணம் செய்கிற அனைவரும்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடர் மரபுத்தொடராக அமைந்துள்ளதால், கடல் வழியாகப் பல இலக்குகளுக்குப் பயணம் செய்பவர்களைப் பொதுவாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய புலம்பலுக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் இணைப்புச் சொல்; கிரேக்கத்தின் விளக்க வலிமையை இயல்பாகக் காக்கிறது.
- source_word: μιᾷ ὥρᾳ
  choice: ஒரே மணி நேரத்தில்
  rationale: காலத்தைக் குறிக்கும் இந்தத் தொடரை நேரடியாக வழங்கி, அழிவு திடீரென நிகழ்ந்ததை உணர்த்துகிறது; கால அளவின் தன்மையை மேலதிகமாக விளக்கவில்லை.
- source_word: ἠρημώθη
  choice: பாழாக்கப்பட்டது
  rationale: முற்றிலும் சீரழிக்கப்பட்ட அல்லது பாழாக்கப்பட்ட நிலையைச் சுட்டும் இறைச்சொல்லின் செயப்பாட்டு வடிவத்தையும் அழிவின் வலிமையையும் காக்கிறது.
- source_word: ὁ τοσοῦτος πλοῦτος
  choice: இவ்வளவு பெரும் செல்வம்
  rationale: τοσοῦτος குறிக்கும் அளவின் மிகுதியையும் புலம்பல் தொனியையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: πᾶς κυβερνήτης
  choice: கப்பல் தலைவர்கள் அனைவரும்
  rationale: கப்பலைச் செலுத்தும் அல்லது அதன் பொறுப்பை வகிக்கும் நபர்களைக் குறிக்கிறது; பின்னர் வரும் மாலுமிகளிலிருந்து இக்குழுவை வேறுபடுத்துகிறது.
- source_word: πᾶς ὁ ἐπὶ τόπον πλέων
  choice: ஓரிடத்திற்குக் கடற்பயணம் செய்கிற அனைவரும்[a]
  rationale: இலக்கை நோக்கிக் கடலில் பயணம் செய்பவர்களைச் சுட்டும் கிரேக்கச் சொற்றொடரின் அமைப்பை நெருக்கமாகக் காக்கிறது. அதன் மரபுத்தொடர்சார் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ναῦται
  choice: மாலுமிகள்
  rationale: கப்பலில் பணிபுரியும் கடற்பயணத் தொழிலாளர்களுக்கான தெளிவான, இன்றைய நிலையான தமிழ்ச் சொல்.
- source_word: ὅσοι τὴν θάλασσαν ἐργάζονται
  choice: கடலில் தொழில் செய்கிற அனைவரும்
  rationale: மாலுமிகளை மட்டும் அல்லாமல் கடலைச் சார்ந்த உழைப்பு அல்லது வணிகத்தில் ஈடுபடும் பரந்த குழுவைக் குறிக்கும் கிரேக்கத்தின் வீச்சைக் காக்கிறது.
- source_word: ἀπὸ μακρόθεν ἔστησαν
  choice: தொலைவில் நின்றார்கள்
  rationale: அவர்கள் அழிவிடத்திலிருந்து விலகி நின்ற நிலையை எளிமையாகவும் நேரடியாகவும் வழங்குகிறது.
theological_decisions:
- issue: பாபிலோனின் வீழ்ச்சியால் பாதிக்கப்பட்ட கடல்சார் குழுக்களின் வரம்பும் வேறுபாடும்
  choice: கப்பல் தலைவர்கள், கடற்பயணம் செய்பவர்கள், மாலுமிகள், கடலில் தொழில் செய்பவர்கள் ஆகியோரைத் தனித்தனி குழுக்களாகக் காக்கப்பட்டது.
  alternative: அனைவரையும் பொதுவாக ‘கடலோடிகள்’ என்று ஒன்றிணைத்தல், அல்லது கடற்பயணம் செய்பவர்களை வணிகர்கள்/பயணிகள் என்று குறிப்பாக்குதல்.
  rationale: கிரேக்க உரை பல இணையான குழுக்களை வரிசைப்படுத்தி, பாபிலோனின் வீழ்ச்சியால் ஏற்பட்ட பொருளாதாரப் பாதிப்பின் பரப்பை வலியுறுத்துகிறது. குழுக்களை ஒன்றிணைப்பதும், உரையில் இல்லாத குறுகிய அடையாளத்தைச் சேர்ப்பதும் தவிர்க்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. கடல்சார் குழுக்களின் பட்டியல் தெளிவாகவும் வேறுபட்டும் வைக்கப்பட்டது; தெளிவற்ற கிரேக்க மரபுத்தொடர் முதன்மை உரையில் நெருக்கமாகவும் அடிக்குறிப்பில் மாற்று வாய்ப்புகளுடனும் வழங்கப்பட்டது.
