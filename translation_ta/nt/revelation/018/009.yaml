  text: Καὶ κλαύσουσιν καὶ κόψονται ἐπ’ αὐτὴν οἱ βασιλεῖς τῆς γῆς οἱ μετ’ αὐτῆς πορνεύσαντες καὶ στρηνιάσαντες, ὅταν βλέπωσιν τὸν καπνὸν τῆς πυρώσεως αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/009.yaml
  text: And the kings of the earth who committed sexual immorality and lived in luxury with her will weep and mourn over her when they see the smoke of her burning[b][a],
translation:
  language: ta
  text: அவளோடு பாலியல் ஒழுக்கக்கேட்டில் ஈடுபட்டு[b], ஆடம்பரமாக வாழ்ந்த பூமியின் அரசர்கள், அவள் எரிவதன் புகையைக் காணும்போது, அவளைக் குறித்து அழுது புலம்புவார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘புலம்புவார்கள்’ என்பதற்கு ‘மார்பில் அடித்துக்கொண்டு துக்கம் தெரிவிப்பார்கள்’ என்றும் பொருள் கொள்ளலாம்; கிரேக்க வினை வெளிப்படையாகச் செய்யப்படும் துக்கச் செயலை நினைவூட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அவளோடு பாலியல் ஒழுக்கக்கேட்டில் ஈடுபட்டு’ என்பது வெளிப்படுத்தலில் மீண்டும் வரும் உருவகத்தின் ஒரு பகுதியாக, சிலைவழிபாட்டுடனும் ஊழல்மிக்க கூட்டுறவுடனும் தொடர்புடையதாக இருக்கலாம்; அதேவேளையில் கிரேக்கத்தின் பாலியல் படிமமும் இங்கு தக்கவைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: κλαύσουσιν
  choice: அழுது
  rationale: κλαίω வெளிப்படையாக அழுவதையோ துயரத்துடன் கதறுவதையோ குறிக்கிறது; ‘அழுது’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: κόψονται
  choice: புலம்புவார்கள்
  rationale: இந்த இடத்தில் κόπτω என்பதன் இடைநிலை வடிவம் துக்கத்தை வெளிப்படுத்தும் புலம்பலைக் குறிக்கிறது; சொற்பொருள்படி உடலை அடிப்பதாக மொழிபெயர்த்தால் தவறாகப் புரியலாம்.
- source_word: ἐπ’ αὐτὴν
  choice: அவளுக்காக
  rationale: துக்கம் தெரிவிக்கும் வினைகளுடன் ἐπί + accusative, யாரைக் குறித்து அல்லது யாருக்காகப் புலம்புகிறார்கள் என்பதைக் காட்டுகிறது.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: பூமியின் அரசர்கள்
  rationale: வெளிப்படுத்தலில் உலகளாவிய ஆட்சியாளர்களைக் குறிக்கும் வழக்கமான இறுதிக்காலப் படிமத்தைத் தக்கவைக்கிறது.
- source_word: μετ’ αὐτῆς
  choice: அவளோடு
  rationale: μετά + genitive குறிக்கும் தொடர்பை நேரடியாகத் தருகிறது; கிரேக்கத்தில் இது ஒரே முறை வந்தாலும் இணைக்கப்பட்ட இரு வினைகளுடனும் இயல்பாகப் பொருந்துகிறது.
- source_word: πορνεύσαντες
  choice: பாலியல் ஒழுக்கக்கேட்டில் ஈடுபட்டு
  rationale: πορνεύω என்பதன் பாலியல் படிமத்தைத் தக்கவைத்து, அதன் உருவகப் பொருளை முதன்மை உரையிலேயே குறுக்கிவிடாமல் விடுகிறது.
- source_word: στρηνιάσαντες
  choice: ஆடம்பரமாக வாழ்ந்த
  rationale: στρηνιάω கட்டுப்பாடற்ற செல்வச்செழிப்பையும் சுயஇன்ப ஆடம்பர வாழ்வையும் குறிக்கிறது; ‘ஆடம்பரமாக வாழ்ந்த’ என்பது தெளிவான இயல்புத் தமிழ்.
- source_word: ὅταν βλέπωσιν
  choice: காணும்போது
  rationale: ὅταν + நிகழ்கால subjunctive இங்கு எதிர்கால நிகழ்வின் நேரத்தைச் சுட்டுகிறது; தமிழ் வாக்கியத்தில் ‘காணும்போது’ இயல்பாக அமைகிறது.
- source_word: τὸν καπνὸν
  choice: புகையை
  rationale: நேரடியான பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: τῆς πυρώσεως αὐτῆς
  choice: அவள் எரிவதன்
  rationale: πύρωσις எரிதல் அல்லது எரிக்கப்படுதல் என்ற படிமத்தைத் தருகிறது; அருகிலுள்ள வசனங்களின் கூடுதல் கருத்துகளை இங்கு புகுத்தாமல் உள்ளது.
theological_decisions:
- issue: பாபிலோனின் ‘பாலியல் ஒழுக்கக்கேடு’ என்ற படிமத்தின் தன்மை
  choice: பாலியல் சார்ந்த சொல்லாட்சியை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘ஒழுக்கக்கேடாக நடந்துகொண்டனர்’ அல்லது ‘அவளுடன் துரோகம் செய்தனர்’ என்று உருவகப் பொருளை மட்டும் வெளிப்படுத்துதல்
  rationale: வெளிப்படுத்தலில் இந்தப் படிமம் சிலைவழிபாடு மற்றும் ஊழல்மிக்க கூட்டுறவைக் குறிக்கக்கூடும்; ஆனால் பாலியல் சொல்லாட்சியை நீக்குவது மூலத்தின் திட்டமிட்ட உருவகத்தையும் அதன் பதற்றத்தையும் குறைத்துவிடும்.
- issue: κόψονται என்பதன் பொருள்
  choice: துக்கப் புலம்பலைக் குறிக்கும் ‘புலம்புவார்கள்’
  alternative: ‘மார்பில் அடித்துக்கொள்வார்கள்’ அல்லது சொற்பொருள்படி ‘தங்களை வெட்டிக்கொள்வார்கள்’
  rationale: இச்சூழலில் இது வெளிப்படையான துக்கச் சடங்கைக் குறிக்கும் மரபுத்தொடர்; உடல் காயப்படுத்துதலை மையப்படுத்தும் மொழிபெயர்ப்பு வாசகரைத் தவறாக வழிநடத்தலாம்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வெளிப்படுத்தலின் கண்ணியமான தீர்க்கதரிசன நடையைத் தக்கவைக்கும் வகையிலும் வடிவமைக்கப்பட்டது. இரு அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
