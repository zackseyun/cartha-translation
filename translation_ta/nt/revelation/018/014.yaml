  source_fidelity: ‘காணமாட்டார்கள்’ என்பது εὑρήσουσιν (‘கண்டடைவார்கள்/பெறுவார்கள்’) என்பதைக் காட்டிலும் ‘பார்ப்பார்கள்’ என்ற பொருளைத் தரக்கூடும். குறிப்பிடப்படாத மூன்றாம் நபர் பன்மை எழுவாயும், வலியுறுத்தப்பட்ட ‘இனி ஒருபோதும்’ மறுப்பும் காக்கப்பட வேண்டும்.
