id: REV.18.14
reference: Revelation 18:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἡ ὀπώρα ⸂σου τῆς ἐπιθυμίας τῆς ψυχῆς⸃ ἀπῆλθεν ἀπὸ σοῦ, καὶ πάντα τὰ λιπαρὰ καὶ τὰ λαμπρὰ ἀπώλετο ἀπὸ σοῦ, καὶ ⸀οὐκέτι ⸂οὐ μὴ αὐτὰ εὑρήσουσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/014.yaml
  text: And the fruit of your soul’s desire has gone away from you[a], and all the rich and splendid things have perished from you[b], and they will never be found again.
translation:
  language: ta
  text: உன் உள்ளம் ஏங்கிய கனி உன்னைவிட்டுப் போயிற்று; செழுமையானதும் மிளிர்வதுமான எல்லாப் பொருள்களும் உன்னைவிட்டு அழிந்துபோயின; அவற்றை இனி ஒருபோதும் கண்டடையமாட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவை இனி ஒருபோதும் கண்டடையப்படமாட்டா.” கிரேக்கத்தில் ‘கண்டடையமாட்டார்கள்’ என்பதற்கான எழுவாய் குறிப்பிடப்படவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: ἡ ὀπώρα
  choice: கனி
  rationale: இச்சொல் குறிப்பாகப் பழுத்த அல்லது பருவத்தின் பிற்பகுதியில் கிடைக்கும் கனியைக் குறிக்கலாம். ஒருமை வடிவத்தையும் விரும்பிய விளைபொருள் என்ற உருவகத்தையும் காக்க ‘கனி’ என மொழிபெயர்க்கப்பட்டது.
- source_word: σου τῆς ἐπιθυμίας τῆς ψυχῆς
  choice: உன் உள்ளம் ஏங்கிய
  rationale: கிரேக்கத்தின் தொடர் உரிமைவேற்றுமை அமைப்பைத் தமிழில் இயல்பாகத் தருகிறது; ψυχή குறிக்கும் ஆழ்ந்த உள்ளார்ந்த விருப்பத்தையும் ‘உள்ளம் ஏங்கிய’ என்பது வெளிப்படுத்துகிறது.
- source_word: ἀπῆλθεν ἀπὸ σοῦ
  choice: உன்னைவிட்டுப் போயிற்று
  rationale: பிரிந்து சென்றதையும் அதன் தற்போதைய இழப்பு நிலையையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: πάντα τὰ λιπαρὰ
  choice: ஆடம்பரமான பொருள்கள் அனைத்தும்
  rationale: λιπαρός இங்கு கொழுப்புள்ள உணவை மட்டும் அல்லாமல் செழுமையான, சொகுசான பொருள்களைக் குறிக்கிறது; வணிகச் சூழலில் ‘ஆடம்பரமான’ என்பது பொருத்தமானது.
- source_word: τὰ λαμπρὰ
  choice: பகட்டானவையுமான
  rationale: λαμπρός என்பதன் ஒளிமிக்க, கண்ணைக் கவரும் சிறப்பை ஆடம்பரச் சூழலில் ‘பகட்டான’ என்பது இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀπώλετο ἀπὸ σοῦ
  choice: உன்னைவிட்டு அழிந்துபோயின
  rationale: மீட்டுக்கொள்ள இயலாத இழப்பையும் அழிவையும் வலுவாகக் காட்டுகிறது; பன்மைப் பொருள்களுக்கு ஏற்ப தமிழில் பன்மை வினை பயன்படுத்தப்பட்டது.
- source_word: οὐκέτι οὐ μὴ
  choice: இனி ஒருபோதும்
  rationale: இரட்டையாக வலியுறுத்தப்பட்ட கிரேக்க மறுப்பின் இறுதியான தன்மையை இயல்பான தமிழில் தெளிவாகத் தருகிறது.
- source_word: αὐτὰ εὑρήσουσιν
  choice: அவற்றைக் காணமாட்டார்கள்
  rationale: கிரேக்கத்தில் வெளிப்படையாகக் குறிப்பிடப்படாத பன்மை எழுவாயைத் தமிழிலும் வரையறுக்காமல் வைத்திருந்து, செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: εὑρήσουσιν என்பதன் மறைந்துள்ள எழுவாய்
  choice: ‘அவற்றைக் காணமாட்டார்கள்’ என்ற குறிப்பிடப்படாத பன்மை எழுவாயுடன் மொழிபெயர்த்தல்
  alternative: ‘அவை காணப்படமாட்டா’ என்ற செயப்பாட்டு மொழிபெயர்ப்பு
  rationale: கிரேக்க வினை மூன்றாம் நபர் பன்மையில் இருந்தாலும் எழுவாய் குறிப்பிடப்படவில்லை. தமிழின் குறிப்பிடப்படாத ‘அவர்கள்’ பயன்பாடு அந்த இலக்கண வடிவத்தையும் தெளிவின்மையையும் காக்கிறது; அடிக்குறிப்பு இயல்பான செயப்பாட்டு புரிதலையும் தருகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், புலம்பலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘ஆத்துமா’ போன்ற சமயச் சிறப்புச் சொல்லுக்குப் பதிலாக இச்சூழலில் ஆழ்ந்த விருப்பத்தைக் காட்டும் இயல்பான ‘உள்ளம்’ பயன்படுத்தப்பட்டது; ஆடம்பர வணிகப் பின்னணியைத் தெளிவாக்க ‘பொருள்கள்’ வெளிப்படையாகச் சேர்க்கப்பட்டது.
