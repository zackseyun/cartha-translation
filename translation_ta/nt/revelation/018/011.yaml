id: REV.18.11
reference: Revelation 18:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ οἱ ἔμποροι τῆς γῆς ⸂κλαίουσιν καὶ πενθοῦσιν⸃ ἐπ’ ⸀αὐτήν, ὅτι τὸν γόμον αὐτῶν οὐδεὶς ἀγοράζει οὐκέτι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/011.yaml
  text: And the merchants of the earth weep and mourn over her[a], because no one buys their cargo anymore[b],
translation:
  language: ta
  text: பூமியின்[a] வணிகர்கள் அவளைக் குறித்து அழுது புலம்புகிறார்கள்; ஏனெனில் அவர்களுடைய சரக்கை[b] இனி யாரும் வாங்குவதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நிலத்தின்.’ கிரேக்கச் சொல் ‘பூமி’ அல்லது ‘நிலம்’ எனப் பொருள்படலாம்; வெளிப்படுத்தின விசேஷத்தில் இச்சொற்றொடர் பெரும்பாலும் பரந்த, உலகளாவிய பொருளைக் கொண்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘வாணிகப் பொருட்களை.’ கிரேக்கச் சொல் கப்பலில் ஏற்றப்பட்ட சுமையையோ விற்பனைப் பொருட்களையோ குறிக்கலாம்; இங்குள்ள வாணிகச் சூழலை ‘சரக்கு’ தெளிவாக எடுத்துக்காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔμποροι
  choice: வணிகர்கள்
  rationale: வாணிகத்தில் ஈடுபடும் வர்த்தகர்களைக் குறிக்கும் இயல்பான, பொதுவாகப் புரிந்துகொள்ளக்கூடிய நவீனத் தமிழ்ச் சொல்.
- source_word: τῆς γῆς
  choice: பூமியின்
  rationale: γῆ என்பதற்கு ‘பூமி’ அல்லது ‘நிலம்’ என்று பொருள் வரலாம்; வெளிப்படுத்தின விசேஷத்தின் உலகளாவிய நியாயத்தீர்ப்புச் சூழலில் ‘பூமியின்’ என்பது பரந்த நோக்கைச் சிறப்பாகக் காக்கிறது.
- source_word: κλαίουσιν καὶ πενθοῦσιν
  choice: அழுது புலம்புகிறார்கள்
  rationale: κλαίω மற்றும் πενθέω ஆகிய இரு வினைகளையும் தனித்தனியாகக் காத்து, துயரத்தின் தீவிரத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐπ’ αὐτήν
  choice: அவளைக் குறித்து
  rationale: புலம்பலின் பொருள் அவளே என்பதைத் தெளிவாக்குவதோடு, பாபிலோன் பெண்ணாக உருவகப்படுத்தப்பட்டுள்ளதையும் காக்கிறது.
- source_word: γόμον
  choice: சரக்கை
  rationale: γόμος என்பது கப்பலில் ஏற்றப்படும் சுமை அல்லது வாணிகப் பொருட்களின் தொகுப்பைக் குறிக்கிறது; இச்சூழலில் ‘சரக்கு’ துல்லியமும் இயல்பும் உடையது.
- source_word: οὐδεὶς ἀγοράζει οὐκέτι
  choice: இனி யாரும் வாங்குவதில்லை
  rationale: οὐκέτι குறிக்கும் முற்றுப்பெற்ற நிறுத்தத்தை இயல்பான தமிழில் தெரிவிக்கிறது; நிகழ்கால வினையின் தொடர்நிலையும் காக்கப்படுகிறது.
- source_word: αὐτῶν
  choice: அவர்களுடைய
  rationale: இந்த உடைமைச் சுட்டுப்பெயர் வணிகர்களின் சரக்கைக் குறிப்பதால், ‘அவர்களுடைய’ என்பது இயல்பான இணை.
theological_decisions:
- issue: பாபிலோனின் சுட்டுப்பெயரும் உருவகச் சித்தரிப்பும்
  choice: ‘அவள்’ என்ற பெண்பால் சுட்டு காக்கப்பட்டது.
  alternative: நகரம் அல்லது அமைப்பைக் குறிக்கும் நடுநிலைச் சுட்டாக ‘அது’ என்று மொழிபெயர்த்தல்.
  rationale: வெளிப்படுத்தின விசேஷம் பாபிலோனை ஒரு பெண்ணாகவும் நகரமாகவும் உருவகப்படுத்துகிறது. பெண்பால் சுட்டைக் காப்பது அந்த இலக்கிய-இறையியல் படிமத்தைப் பேணுகிறது; அதன் அடையாளத்தை மொழிபெயர்ப்பிலேயே தீர்மானிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வெளிப்படுத்தின விசேஷத்தின் கண்ணியமான புலம்பல் நடையைப் பேணுமாறும் மொழிபெயர்க்கப்பட்டது. ‘அழுது புலம்புகிறார்கள்’ என்ற இணைச்சொல் மூலத்தின் இரட்டை வினையையும் காக்கிறது; ‘அவளைக் குறித்து’ என்பது பெண்பால் உருவகத்தை இயல்பாகத் தொடர்கிறது.
