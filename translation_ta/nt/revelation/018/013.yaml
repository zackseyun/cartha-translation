id: REV.18.13
reference: Revelation 18:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ κιννάμωμον ⸂καὶ ἄμωμον⸃ καὶ θυμιάματα καὶ μύρον καὶ λίβανον καὶ οἶνον καὶ ἔλαιον καὶ σεμίδαλιν καὶ σῖτον καὶ ⸂κτήνη καὶ πρόβατα⸃, καὶ ἵππων καὶ ῥεδῶν καὶ σωμάτων, καὶ ψυχὰς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/013.yaml
  text: and cinnamon and spice and incense and perfume and frankincense and wine and olive oil and fine flour and wheat and cattle and sheep[a], and horses and chariots and servants, that is[b], human souls.
translation:
  language: ta
  text: இலவங்கப்பட்டை, நறுமணப் பொருள்[a], தூபப்பொருள்கள், வாசனைத் தைலம், குங்கிலியம், திராட்சரசம், ஒலிவ எண்ணெய், மெல்லிய மாவு, கோதுமை, மாடுகள், செம்மறியாடுகள், குதிரைகள், வண்டிகள், உடல்களும் மனித உயிர்களும் ஆகியவற்றையும் இனி யாரும் வாங்கமாட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அமோமம்’; விலையுயர்ந்த ஒரு நறுமணத் தாவரம் அல்லது மணப்பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: κιννάμωμον
  choice: இலவங்கப்பட்டை
  rationale: இறக்குமதி செய்யப்பட்ட இலவங்க நறுமணப் பொருளைக் குறிக்கும் வழக்கமான நவீனத் தமிழ் சொல்.
- source_word: ἄμωμον
  choice: நறுமணப் பொருள்
  rationale: துல்லியமான தாவர அடையாளம் உறுதியற்றதும் ‘அமோமம்’ பொதுவாசகருக்கு அரிதுமானதாலும், விலையுயர்ந்த மணப்பொருள் என்ற பொருளை இயல்பாகத் தருகிறது; மாற்றுப் பெயர் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: θυμιάματα
  choice: தூபப்பொருள்கள்
  rationale: வணிகப் பட்டியலில் தூபம் காட்டும் செயலை அல்ல, எரிக்கப்படும் மணப்பொருட்களையே குறிக்கிறது.
- source_word: μύρον
  choice: வாசனைத் தைலம்
  rationale: விலையுயர்ந்த மணமுள்ள தைலம் அல்லது களிம்பைக் குறிக்கும்; நவீனத் தமிழில் பொருளைத் தெளிவாகக் கூறுகிறது.
- source_word: λίβανον
  choice: சாம்பிராணி
  rationale: பொதுவான தூபப்பொருளிலிருந்து வேறுபட்ட frankincense பிசினைக் குறிக்கும் நிலைபெற்ற தமிழ் வழக்கு.
- source_word: ἔλαιον
  choice: ஒலிவ எண்ணெய்
  rationale: சூழலில் குறிக்கப்படுவது ஒலிவ எண்ணெய் என்பதைத் தெளிவாக்குகிறது.
- source_word: σεμίδαλιν
  choice: மெல்லிய மாவு
  rationale: உயர்தரமாக அரைக்கப்பட்ட மாவு என்ற பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: σῖτον
  choice: கோதுமை
  rationale: தானியம் எனப் பொதுவாக வரக்கூடியபோதும், இவ்வணிகப் பட்டியலில் கோதுமை என்பதே இயல்பான குறிப்பிட்ட பொருள்.
- source_word: κτήνη
  choice: மாடுகள்
  rationale: πρόβατα தனியே வருவதால், பெரிய வீட்டுவிலங்குகளைக் குறிக்கும் வகையில் வேறுபாட்டைப் பேணுகிறது.
- source_word: πρόβατα
  choice: செம்மறியாடுகள்
  rationale: செம்மறியாடுகளைத் தெளிவாகக் குறிக்கிறது.
- source_word: ῥεδῶν
  choice: தேர்கள்
  rationale: நான்கு சக்கர வாகனங்களைக் குறிக்கிறது; தமிழ் வேதாகம நடையில் புரியத்தக்க பொதுச் சொல், போர்த்தேர் எனக் கட்டுப்படுத்தாமல் வாகனப் பொருளைத் தருகிறது.
- source_word: σωμάτων
  choice: மனித உடல்கள்
  rationale: கிரேக்கத்தின் நேரடிப் பொருளான ‘உடல்கள்’ என்பதைப் பேணி, மனிதர்கள் வணிகப் பொருளாக்கப்பட்ட அதிர்ச்சியைத் தக்கவைக்கிறது; அடிமைகள் குறித்த வணிகப் பயன்பாடு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: ψυχὰς ἀνθρώπων
  choice: மனித உயிர்கள்
  rationale: சொல்லாட்சியின் உச்சக்கட்டமாக வரும் ‘மனிதர்களின் உயிர்கள்’ என்ற பொருளையும், மனித நபர்களையே விற்பதற்கான கண்டனத்தையும் பேணுகிறது.
theological_decisions:
- issue: σωμάτων καὶ ψυχὰς ἀνθρώπων என்பதன் தொடர்பு
  choice: மனித உடல்கள், மனித உயிர்கள்
  alternative: அடிமைகள், அதாவது மனித உயிர்கள்
  rationale: மூலத்தின் இணைப்பான வடிவத்தையும் அதன் உண்மையான பொருள்/இலக்கண நெருக்கடியையும் தீர்த்துவிடாமல் வைத்திருக்கிறது. ‘உடல்கள்’ என்பது அடிமைகளுக்கான வணிகச் சொல்லாக இருக்கலாம்; தொடர்ந்து வரும் ‘மனித உயிர்கள்’ மனிதரைப் பொருளாக்கும் கொடுமையை உச்சப்படுத்துகிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகருக்குப் புரியும் தமிழ். இது முந்தைய வசதியிலிருந்து தொடரும் சரக்குப் பட்டியல் என்பதால், தமிழில் முழுமையான வாக்கியமாக இயங்க ‘ஆகியவற்றையும் இனி யாரும் வாங்கமாட்டார்கள்’ என்ற சூழல் சார்ந்த முடிவு சேர்க்கப்பட்டுள்ளது. மூலத்தின் பட்டியல் ஓட்டமும், இறுதியில் மனிதர்களை வணிகப் பொருளாக்கும் அதிர்ச்சியும் பாதுகாக்கப்பட்டுள்ளன.
