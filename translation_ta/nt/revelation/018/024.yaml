  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. பாபிலோனின் பெண்பால் ஆளுருவகம், ‘இரத்தம்’ என்ற நீதித்தீர்ப்புச் சாயல், σφάζω என்பதின் வன்மையான வலிமை ஆகியவை தக்கவைக்கப்பட்டுள்ளன.
