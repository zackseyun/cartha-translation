  text: καὶ ἐν αὐτῇ ⸀αἷμα προφητῶν καὶ ἁγίων εὑρέθη καὶ πάντων τῶν ἐσφαγμένων ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/024.yaml
  text: And in her was found the blood of prophets and saints[c][b][a], and of all who have been slaughtered on the earth.
translation:
  language: ta
  text: அவளிடத்தில்[c] தீர்க்கதரிசிகள் மற்றும் பரிசுத்த மக்களின் இரத்தமும்[a], பூமியில் படுகொலை செய்யப்பட்ட அனைவரின் இரத்தமும்[b] காணப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பரிசுத்தமானவர்கள்’ அல்லது ‘கடவுளுடைய பரிசுத்த மக்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘பூமியில் கொல்லப்பட்ட அனைவரும்’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்க வினைச்சொல் பொதுவாகக் கொல்வதைக் காட்டிலும் வலுவானது; அது ‘படுகொலை செய்யப்படுதல்’ என்ற பொருளைக் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘அவள்’ என்பது சுற்றியுள்ள தரிசனத்தில் ஒரு பெண்ணாகச் சித்தரிக்கப்படும் பாபிலோனைக் குறிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν αὐτῇ
  choice: அவளிடத்தில்
  rationale: பெண்பால் சுட்டுப்பெயர், சுற்றியுள்ள தரிசனத்தில் ஒரு பெண்ணாக உருவகிக்கப்படும் பாபிலோனைச் சுட்டுகிறது. ஆகவே உயிரற்ற ‘அதில்’ என்பதற்குப் பதிலாக ஆளுருவகத்தைத் தக்கவைக்கும் ‘அவளிடத்தில்’ பயன்படுத்தப்பட்டது.
- source_word: αἷμα
  choice: இரத்தம்
  rationale: மூலச்சொல்லின் நேரடியான பொருளையும், சூழலில் உள்ள இரத்தப்பழி மற்றும் நீதித்தீர்ப்பின் சாயலையும் தக்கவைக்கிறது.
- source_word: προφητῶν
  choice: தீர்க்கதரிசிகள்
  rationale: προφήτης என்பதற்கான பரவலாக அறியப்பட்ட, இயல்பான தமிழ் வேதாகமச் சொல்.
- source_word: ἁγίων
  choice: பரிசுத்த மக்கள்
  rationale: வெளிப்படுத்தலில் இச்சொல் கடவுளுக்கெனப் பிரித்தெடுக்கப்பட்ட மக்களைக் குறிக்கிறது. ‘பரிசுத்த மக்கள்’ என்பது இன்றைய வாசகர்களுக்குத் தெளிவாகவும் எந்தக் குறிப்பிட்ட திருச்சபை மரபின் பட்டத்தையும் முன்வைக்காமலும் உள்ளது.
- source_word: εὑρέθη
  choice: காணப்பட்டது
  rationale: இறந்தகாலச் செயப்பாட்டு வடிவத்தை நேரடியாகப் பிரதிபலித்து, மறைந்திருந்த குற்றச்சான்று வெளிப்பட்டது போன்ற நீதித்துறைச் சாயலையும் தக்கவைக்கிறது.
- source_word: πάντων τῶν ἐσφαγμένων
  choice: படுகொலை செய்யப்பட்ட அனைவரும்
  rationale: σφάζω என்பது பொதுவான ‘கொல்லுதல்’ என்பதைவிட வன்முறையான வெட்டிக்கொல்லுதல் அல்லது படுகொலை செய்தல் என்ற வலுவான பொருளைக் கொண்டது. தமிழ் வாக்கியத்தில் உடைமை வடிவமாக ‘படுகொலை செய்யப்பட்ட அனைவருடைய இரத்தம்’ என அமைக்கப்பட்டது.
- source_word: ἐπὶ τῆς γῆς
  choice: பூமியில்
  rationale: வெளிப்படுத்தலின் உலகளாவிய, தரிசனம்சார் சூழலில் γῆ என்பதன் விரிவான ‘பூமி’ என்ற பொருள் பொருத்தமானது; ‘நாடு’ என்று குறுக்கப்படவில்லை.
theological_decisions:
- issue: பாபிலோனின் இரத்தப்பழியின் பரப்பும் பொறுப்பும்
  choice: தீர்க்கதரிசிகள், பரிசுத்த மக்கள், மேலும் பூமியில் படுகொலை செய்யப்பட்ட அனைவரின் இரத்தத்திற்கும் பாபிலோன் பொறுப்புடையவளாகக் கூறும் விரிவான தரிசனம்சார் குற்றச்சாட்டு அப்படியே தக்கவைக்கப்பட்டது.
  alternative: இது எல்லா நீதிமான்களின் இரத்தப்பழியையும் பிரதிநிதித்துவமாக பாபிலோன்மேல் சுமத்தும் மிகைப்படுத்திய தரிசன மொழியாகவோ, தரிசனத்தின் குறியீட்டு அமைப்புக்குள் உலகளாவிய நேரடிப் பொறுப்பாகவோ புரிந்துகொள்ளப்படலாம்.
  rationale: இந்த விரிவான குற்றச்சாட்டு வரலாற்றில் எவ்வாறு பொருந்துகிறது என்பதை கிரேக்க உரை இங்கே விளக்கவில்லை. எனவே மொழிபெயர்ப்பு அதன் பரப்பைக் குறுக்காமலும், இரு புரிதல்களில் ஒன்றைத் தீர்மானிக்காமலும் உள்ளது.
