id: REV.18.5
reference: Revelation 18:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι ἐκολλήθησαν αὐτῆς αἱ ἁμαρτίαι ἄχρι τοῦ οὐρανοῦ, καὶ ἐμνημόνευσεν ὁ θεὸς τὰ ἀδικήματα αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/005.yaml
  text: for her sins have piled up as high as heaven, and God has remembered her wrongdoings.
translation:
  language: ta
  text: ஏனெனில், அவளுடைய பாவங்கள் வானம்வரை குவிந்துள்ளன[a]; கடவுள் அவளுடைய அநீதிச் செயல்களை நினைவுகூர்ந்திருக்கிறார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வானம்வரை ஒன்றோடொன்று இணைக்கப்பட்டுள்ளன.” கிரேக்க வினை சொல்லளவில் “ஒட்டப்படுதல்/இணைக்கப்படுதல்” என்று பொருள்படும்; இங்கு பாவங்கள் பெருங்குவியலாகச் சேர்ந்திருப்பதைச் சித்தரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: 'இச்சூழலில் “நினைவுகூர்ந்திருக்கிறார்” என்பது நியாயத்தீர்ப்புக்குரிய வலிமையைக் கொண்டுள்ளது: கடவுள் அவளுடைய அநீதிச் செயல்களைக் கவனிக்காமல் விட்டுவிடவில்லை.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்திலுள்ள கட்டளைக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச்சொல்லின் காரணப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἐκολλήθησαν
  choice: குவிந்துள்ளன
  rationale: அடிப்படையில் ‘ஒட்டப்பட்டன/இணைக்கப்பட்டன’ என்று பொருள்படும் வினை இங்கு பாவங்கள் வானம்வரை பெருங்குவியலாகச் சேர்ந்திருப்பதைக் குறிக்கும் உருவகமாக உள்ளது. ‘குவிந்துள்ளன’ அந்த உருவக விளைவை இயல்பாக வெளிப்படுத்துகிறது; சொற்பொருள் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἁμαρτίαι
  choice: பாவங்கள்
  rationale: ἁμαρτία என்பதற்கான தெளிவான, வழக்கமான தமிழ் இணைச்சொல்.
- source_word: ἄχρι τοῦ οὐρανοῦ
  choice: வானம்வரை
  rationale: எல்லை அல்லது உயரத்தின் அளவைக் குறிக்கும் கிரேக்கத் தொடரை நெருக்கமாகவும் இயல்பாகவும் தருவதோடு, மேல்நோக்கிய உருவகத்தையும் காக்கிறது.
- source_word: ἐμνημόνευσεν
  choice: நினைவுகூர்ந்திருக்கிறார்
  rationale: வினையின் நேரடிப் பொருளான ‘நினைவுகூர்தல்’ என்பதைக் காக்கிறது. நிறைவேறிய செயல் தற்போதைய நியாயத்தீர்ப்புச் சூழலில் விளைவுடையதாக இருப்பதைத் தமிழ் நிறைவுநிலை வடிவம் உணர்த்துகிறது; ‘தண்டித்தார்’ போன்ற விளக்கத்தை மூலத்தில் சேர்க்கவில்லை.
- source_word: ὁ θεός
  choice: கடவுள்
  rationale: நவீன பொதுத்தமிழில் நேரடியான, மதிப்புமிக்க, பிரிவுசார்பற்ற மொழிபெயர்ப்பு.
- source_word: ἀδικήματα
  choice: அநீதிச் செயல்கள்
  rationale: தவறு அல்லது அநீதி விளைவிக்கும் செயல்கள் என்ற பொருளைத் தருகிறது; முன்னுள்ள ἁμαρτίαι என்பதற்கான ‘பாவங்கள்’ என்பதிலிருந்து மூலத்தின் சொல் வேறுபாட்டையும் காக்கிறது.
theological_decisions:
- issue: ἁμαρτίαι மற்றும் ἀδικήματα ஆகிய இரு தொடர்புடைய சொற்களின் வேறுபாடு
  choice: ‘பாவங்கள்’ என்றும் ‘அநீதிச் செயல்கள்’ என்றும் இரு வேறு சொற்றொடர்களால் மொழிபெயர்த்தல்
  alternative: இரண்டையும் ‘பாவங்கள்’ அல்லது ‘அக்கிரமங்கள்’ என்று ஒரே சொல்லால் மொழிபெயர்த்தல்
  rationale: கிரேக்கம் தொடர்புடைய ஆனால் வேறுபட்ட இரு சொற்களைப் பயன்படுத்துகிறது. அவற்றுக்கிடையே அளவுக்கு மீறிய கோட்பாட்டு வேறுபாட்டை உருவாக்காமல், மூலத்தின் சொல்லாட்சிச் செறிவை மொழிபெயர்ப்பு காக்கிறது.
- issue: கடவுள் ‘நினைவுகூர்ந்தார்’ என்பதன் நியாயத்தீர்ப்புச் சக்தி
  choice: நேரடி வினையை ‘நினைவுகூர்ந்திருக்கிறார்’ என்று வைத்தல்
  alternative: ‘கணக்குக் கேட்கத் தீர்மானித்தார்’ அல்லது ‘நியாயத்தீர்ப்புக்கு உட்படுத்தினார்’ என்று விரித்துரைத்தல்
  rationale: இச்சூழலில் கடவுளின் நினைவுகூர்தல் நடவடிக்கையையும் நியாயத்தீர்ப்பையும் உட்குறிக்கிறது. எனினும், மூல வினை ‘நினைவுகூர்தல்’ என்பதால் அந்த மறைபொருளை வெளிப்படையான தண்டனைச் சொல்லாக மாற்றாமல் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடியதாயும் வெளிப்படுத்தின நூலுக்கேற்ற மதிப்புமிக்க நடையுடனும் வடிவமைக்கப்பட்டது. ‘வானம்வரை’ என்ற செறிவான உருவகமும் ‘நினைவுகூர்ந்திருக்கிறார்’ என்ற வேதாகம நியாயத்தீர்ப்பு மொழியும் விளக்கிப் பரப்பாமல் காக்கப்பட்டுள்ளன.
