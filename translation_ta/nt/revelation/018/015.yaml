revisions:
- from: அவளிடமிருந்து செல்வந்தர்களான இந்தப் பொருட்களின் வணிகர்கள்[a], அவளுடைய வேதனைக்கு அஞ்சி, அழுது புலம்பிக்கொண்டு தொலைவில் நிற்பார்கள்.
  to: இந்தப் பொருட்களின் வணிகர்கள், அவளிடமிருந்து செல்வந்தர்களானவர்கள், அவளுடைய வேதனைக்கு அஞ்சி, தொலைவில் நின்று அழுதும் புலம்பியும் இருப்பார்கள்.
  rationale: 'The revision clarifies that “those who became rich from her” describes the merchants, not the goods, and retains the source sequence and sense: merchants of these things, enriched from her, stand far off because they fear her torment, weeping and mourning.'
