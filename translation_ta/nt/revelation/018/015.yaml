id: REV.18.15
reference: Revelation 18:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οἱ ἔμποροι τούτων, οἱ πλουτήσαντες ἀπ’ αὐτῆς, ἀπὸ μακρόθεν στήσονται διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς κλαίοντες καὶ πενθοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/015.yaml
  text: The merchants of these things[a], who became rich from her, will stand far off because of the fear of her torment, weeping and mourning,
translation:
  language: ta
  text: இந்தப் பொருட்களின் வணிகர்கள், அவளிடமிருந்து செல்வந்தர்களானவர்கள், அவளுடைய வேதனைக்கு அஞ்சி, தொலைவில் நின்று அழுதும் புலம்பியும் இருப்பார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔμποροι
  choice: வணிகர்கள்
  rationale: வணிகத்தில் ஈடுபடுவோரைக் குறிக்கும் இயல்பான, மதிப்புமிக்க நவீனத் தமிழ்ச் சொல்; இச்சூழலில் ‘வியாபாரிகள்’ என்பதைக் காட்டிலும் இலக்கிய நடைக்கு ஏற்றது.
- source_word: τούτων
  choice: இந்தப் பொருட்களின்
  rationale: முந்தைய வசனங்களில் பட்டியலிடப்பட்ட ஆடம்பரப் பொருட்களைச் சுட்டும் பின்னோக்கிய தொடர்பைத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது. மூலத்தில் ‘பொருட்கள்’ என்ற பெயர்ச்சொல் வெளிப்படையாக இல்லாததால் அதற்கான நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: πλουτήσαντες ἀπ’ αὐτῆς
  choice: அவளிடமிருந்து செல்வந்தர்களான
  rationale: பாபிலோன் அவர்களுடைய செல்வத்தின் மூலமாக இருந்ததை ἀπό குறிக்கிறது; செயப்பாட்டு அர்த்தத்தைத் தேவையின்றி சேர்க்காமல் அந்த மூலத் தொடர்பைப் பாதுகாக்கிறது.
- source_word: ἀπὸ μακρόθεν στήσονται
  choice: தொலைவில் நிற்பார்கள்
  rationale: அச்சத்தால் தூரத்தைப் பேணிக்கொண்டு நிற்கும் காட்சியைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς
  choice: அவளுடைய வேதனைக்கு அஞ்சி
  rationale: διά வெளிப்படுத்தும் காரணத்தையும் βασανισμός என்பதன் கடுமையான வேதனை என்ற பொருளையும் இயல்பான தமிழில் தருகிறது; அது வெறும் பொருளாதார இழப்பு அல்லது மனக்கலக்கம் என்று மென்மைப்படுத்தப்படவில்லை.
- source_word: κλαίοντες καὶ πενθοῦντες
  choice: அழுது புலம்பிக்கொண்டு
  rationale: முதல் வினை வெளிப்படையான அழுகையையும் இரண்டாவது துயரத்துடன் புலம்புவதையும் குறிக்கும் வேறுபாட்டைத் தமிழில் இரு வினைகளால் காக்கிறது.
theological_decisions:
- issue: வெளிப்படுத்தலில் βασανισμός குறிக்கும் நியாயத்தீர்ப்பின் தன்மை
  choice: வேதனை
  alternative: தண்டனை; துயரம்
  rationale: உடனடிச் சூழல் பாபிலோனின் கடுமையான நியாயத்தீர்ப்பைப் பற்றியது. ‘வேதனை’ அதன் தீவிரத்தைப் பாதுகாக்கிறது; அதே நேரத்தில் இறுதித் தண்டனையின் இயல்பைப் பற்றி வசனம் கூறாத விரிவான கோட்பாட்டைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வெளிப்பாடு பயன்படுத்தப்பட்டுள்ளது. ‘அவள்’ என்ற பெண்பால் சுட்டுப்பெயர் பாபிலோனை மனிதராக உருவகிக்கும் மூலத்தின் மொழியைப் பாதுகாக்கிறது. அழுதல், புலம்புதல் ஆகிய இரு செயல்களும் ஒன்றாகச் சுருக்கப்படாமல் தனித்தனியாக வைக்கப்பட்டுள்ளன.
