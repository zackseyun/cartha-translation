revisions:
- from: 'மேலும், வானத்திலிருந்து வேறொரு குரல் சொல்வதைக் கேட்டேன்: “என் மக்களே, நீங்கள் அவளுடைய[a] பாவங்களில் பங்குகொள்ளாதபடிக்கும், அவளுக்கு வரும் வாதைகளில் எதையும் பெறாதபடிக்கும், அவளைவிட்டு வெளியேறுங்கள்.”'
  to: 'வானத்திலிருந்து வந்த வேறொரு குரல் சொல்வதைக் கேட்டேன்: “என் மக்களே, நீங்கள் அவளுடைய[a] பாவங்களில் பங்குகொள்ளாதபடிக்கும், அவளுடைய வாதைகளில் எதையும் பெறாதபடிக்கும், அவளிடமிருந்து வெளியேறுங்கள்.”'
  rationale: The revision removes the added sense in ‘அவளுக்கு வரும்’ and restores the Greek possessive relationship directly as ‘அவளுடைய வாதைகள்.’ It also makes the heavenly origin and the command to leave more idiomatic in modern standard Tamil, while retaining the two parallel purpose/warning clauses and Babylon’s feminine personification.
