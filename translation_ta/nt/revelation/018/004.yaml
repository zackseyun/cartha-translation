id: REV.18.4
reference: Revelation 18:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα ἄλλην φωνὴν ἐκ τοῦ οὐρανοῦ λέγουσαν· ⸀Ἐξέλθατε, ⸂ὁ λαός μου, ἐξ αὐτῆς⸃, ἵνα μὴ συγκοινωνήσητε ταῖς ἁμαρτίαις αὐτῆς, καὶ ἐκ τῶν πληγῶν αὐτῆς ἵνα μὴ λάβητε·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/004.yaml
  text: And I heard another voice from heaven saying[a], “Come out of her, my people, so that you may not share in her sins[b], and so that you may not receive any of her plagues.”
translation:
  language: ta
  text: 'வானத்திலிருந்து வந்த வேறொரு குரல் சொல்வதைக் கேட்டேன்: “என் மக்களே, நீங்கள் அவளுடைய[a] பாவங்களில் பங்குகொள்ளாதபடிக்கும், அவளுடைய வாதைகளில் எதையும் பெறாதபடிக்கும், அவளிடமிருந்து வெளியேறுங்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவள்’ என்பது பாபிலோனை ஒரு பெண்ணாக உருவகப்படுத்தும் இந்நூலின் மொழியைத் தொடர்கிறது; நகரத்தையும் அது பிரதிநிதித்துவப்படுத்தும் அமைப்பையும் இது குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: ἄλλην φωνὴν
  choice: வேறொரு குரல்
  rationale: முன்பு கேட்ட குரலிலிருந்து வேறுபட்ட, கூடுதலான ஒரு குரலை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: வானத்திலிருந்து
  rationale: இங்கு οὐρανός என்பது வெறும் வானவெளியை அல்ல, பரலோகத் தளத்தைக் குறிக்கிறது; ‘வானத்திலிருந்து’ என்பது தமிழில் இயல்பாகவும் வேதாகமச் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: Ἐξέλθατε ... ἐξ αὐτῆς
  choice: அவளைவிட்டு வெளியேறுங்கள்
  rationale: பன்மை ஏவல் வடிவத்தின் நேரடியான அழைப்பையும், பாபிலோனைவிட்டு நீங்க வேண்டும் என்ற பொருளையும் தெளிவாகத் தருகிறது. கிரேக்க வினையில் தமிழின் ‘வாருங்கள்/போங்கள்’ போன்ற நோக்குநிலை வேறுபாடு கட்டாயமில்லை என்பதால் ‘வெளியேறுங்கள்’ தெரிவுசெய்யப்பட்டது.
- source_word: ὁ λαός μου
  choice: என் மக்களே
  rationale: உடன்படிக்கை உறவை உணர்த்தும் அழைப்பையும், கிரேக்கத்தின் விளிவேற்றுமைச் செயலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἵνα μὴ συγκοινωνήσητε ταῖς ἁμαρτίαις αὐτῆς
  choice: நீங்கள் அவளுடைய பாவங்களில் பங்குகொள்ளாதபடிக்கும்
  rationale: συγκοινωνέω குறிக்கும் உடன்பங்கேற்பு அல்லது கூட்டுப்பொறுப்பை ‘பங்குகொள்ளுதல்’ நேர்த்தியாக வெளிப்படுத்துகிறது; ἵνα μή-யின் நோக்கம்/எச்சரிக்கைச் சாயல் ‘-ஆதபடிக்கும்’ மூலம் காக்கப்படுகிறது.
- source_word: ἐκ τῶν πληγῶν αὐτῆς ἵνα μὴ λάβητε
  choice: அவளுக்கு வரும் வாதைகளில் எதையும் பெறாதபடிக்கும்
  rationale: ἐκ என்பதன் பகுதியொன்றைப் பெறுதல் என்ற நுணுக்கத்தை ‘எதையும்’ வெளிப்படுத்துகிறது. ‘அவளுக்கு வரும்’ என்பது இவ்வாதைகள் அவள் அனுபவிக்கும் தண்டனை வாதைகள் என்பதைத் தெளிவாக்குகிறது; அவள் ஏற்படுத்தும் வாதைகள் என்று தவறாகப் புரிந்துகொள்வதைத் தவிர்க்கிறது.
- source_word: πληγῶν
  choice: வாதைகள்
  rationale: வெளிப்படுத்தலில் வரும் தெய்வீக நியாயத்தீர்ப்புத் தாக்குதல்கள்/பேரிடர்களைக் குறிக்கும் சொல்லாக ‘வாதைகள்’ வழக்கமானதும் பொருத்தமானதும் ஆகும்.
theological_decisions:
- issue: αὐτῆς என்பதன் பெண்பால் உருவகம்
  choice: பாபிலோனை ‘அவள்’ என்று குறிப்பது
  alternative: நகரம் அல்லது அமைப்பு என்பதை முன்னிறுத்தி ‘அது’ என்று மொழிபெயர்ப்பது
  rationale: வெளிப்படுத்தல் நூல் பாபிலோனை ஒரு பெண்ணாக உருவகப்படுத்துகிறது. ‘அவள்’ என்று வைத்திருப்பது அந்த அபோகலிப்டிக் உருவகத்தையும் இலக்கியத் தொடர்ச்சியையும் காக்கிறது.
- issue: இரண்டு ἵνα μή கூறுகளின் தொடர்பு
  choice: இரண்டையும் வெளியேறுவதற்கான இணையான நோக்கம்/எச்சரிக்கைகளாக ‘-ஆதபடிக்கும் ... -ஆதபடிக்கும்’ என்று அமைத்தல்
  alternative: அவற்றை உறுதியான விளைவுகளாக ‘அப்போது ... மாட்டீர்கள்’ என்று அமைத்தல்
  rationale: மீண்டும் வரும் ἵνα μή + subjunctive அமைப்பு இரண்டு இணையான நோக்கம் அல்லது தவிர்க்க வேண்டிய விளைவுகளைக் குறிக்கிறது; உறுதியான வாக்குறுதியாக மட்டும் மாற்றாமல் கிரேக்கத்தின் திறந்த நுணுக்கம் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பானதாய் இருந்தாலும், தீர்க்கதரிசன அழைப்பின் கண்ணியமும் தீவிரமும் காக்கப்பட்டுள்ளன. கிரேக்கச் சொல் வரிசையை அப்படியே பின்பற்றாமல், இரண்டு நோக்கக் கூறுகளையும் முதன்மை ஏவலுக்கு முன் வைத்து தமிழில் தெளிவாக்கப்பட்டுள்ளது.
