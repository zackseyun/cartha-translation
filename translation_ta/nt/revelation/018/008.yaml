id: REV.18.8
reference: Revelation 18:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν μιᾷ ἡμέρᾳ ἥξουσιν αἱ πληγαὶ αὐτῆς, θάνατος καὶ πένθος καὶ λιμός, καὶ ἐν πυρὶ κατακαυθήσεται· ὅτι ἰσχυρὸς κύριος ὁ θεὸς ὁ κρίνας αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/008.yaml
  text: 'For this reason, in one day her plagues will come: death and mourning and famine, and she will be burned up with fire; because strong is the Lord God who judged her.'
translation:
  language: ta
  text: இதன் காரணமாக, ஒரே நாளில் அவளுடைய வாதைகள்—மரணமும் துக்கமும் பஞ்சமும்—வந்துசேரும்; அவள் நெருப்பில் முற்றிலும் எரிக்கப்படுவாள். ஏனெனில், அவளுக்குத் தீர்ப்பளித்த ஆண்டவராகிய கடவுள் வல்லமையுள்ளவர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: இதனால்தான்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட அவளுடைய செருக்கான கூற்றுகளின் விளைவைக் குறிக்கும் காரணத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: ἐν μιᾷ ἡμέρᾳ
  choice: ஒரே நாளில்
  rationale: திடீர்மையையும் குறுகிய காலத்தையும் குறிக்கும் கிரேக்கச் சொல்லமைப்பை நேரடியாகப் பாதுகாக்கிறது.
- source_word: πληγαί
  choice: வாதைகள்
  rationale: வெளிப்படுத்தின விசேஷத்தில் தெய்வீகத் தீர்ப்பாக வரும் பேரிடர்களைக் குறிக்கும் வழக்கமான, கண்ணியமான வேதாகமத் தமிழ் சொல்.
- source_word: πένθος
  choice: துக்கம்
  rationale: இழப்பால் உண்டாகும் புலம்பல் அல்லது துயரைக் குறிக்கும் இயல்பான பொதுத்தமிழ் சொல்.
- source_word: ἐν πυρὶ κατακαυθήσεται
  choice: நெருப்பால் முற்றிலும் எரிக்கப்படுவாள்
  rationale: κατακαίω என்பதிலுள்ள முழுமையாக எரித்தழிக்கும் வலிமையையும், எதிர்காலச் செயப்பாட்டு வடிவத்தையும் வெளிப்படுத்துகிறது.
- source_word: ἰσχυρός
  choice: வல்லமையுள்ளவர்
  rationale: இங்கு தீர்ப்பை நிறைவேற்றும் கடவுளின் வலிமையைச் சுட்டுகிறது; ‘வலிமையானவர்’ என்பதைக் காட்டிலும் இயல்பான, கண்ணியமான இறையியல் நடை.
- source_word: ὁ κρίνας αὐτήν
  choice: அவளுக்குத் தீர்ப்பளித்த
  rationale: இறந்தகாலப் பங்கேற்பு வடிவத்தின் தீர்ப்பு வழங்கிய செயலைப் பாதுகாக்கிறது; தண்டனையை மட்டும் முன்கூட்டியே சேர்க்கவில்லை.
theological_decisions:
- issue: கடவுளின் வலிமைக்கும் தீர்ப்புக்கும் இடையிலான காரணத் தொடர்பு
  choice: “ஏனெனில்” என்று ὅτι-யை காரணவாக்கியமாக மொழிபெயர்த்தல்
  alternative: “அவளுக்குத் தீர்ப்பளித்த ஆண்டவராகிய கடவுள் வல்லமையுள்ளவர்” என்பதை தனி உறுதிப்பாடாக அமைத்தல்
  rationale: சூழலில் அவளுடைய வாதைகள் நிச்சயமாக நிறைவேறுவதற்கான காரணம் தீர்ப்பளிக்கும் கடவுளின் வல்லமை என்பதால் காரணத் தொடர்பை வெளிப்படையாக வைத்திருக்கிறது.
- issue: κρίνας என்ற இறந்தகாலப் பங்கேற்பு
  choice: “தீர்ப்பளித்த” என்று நிறைவேறிய தீர்ப்பாகக் காட்டுதல்
  alternative: “தீர்ப்பளிக்கிற” அல்லது “தீர்ப்பிடுகிற”
  rationale: கிரேக்க aorist participle-இன் வடிவத்தை மதித்து, தரிசன மொழியில் தீர்ப்பு உறுதியாக வழங்கப்பட்டதாகப் பேசும் பதற்றத்தைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான தீர்க்கதரிசன நடை. பாபிலோன் நகரம் பெண்பால் உருவகமாகத் தொடரப்படுவதால் “அவள்” பாதுகாக்கப்பட்டுள்ளது. தேவையற்ற விளக்கச் சேர்க்கைகளும் பிரிவுசார் சொற்களும் தவிர்க்கப்பட்டுள்ளன.
