id: REV.18.21
reference: Revelation 18:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἦρεν εἷς ἄγγελος ἰσχυρὸς λίθον ὡς ⸀μύλινον μέγαν, καὶ ἔβαλεν εἰς τὴν θάλασσαν λέγων· Οὕτως ὁρμήματι βληθήσεται Βαβυλὼν ἡ μεγάλη πόλις, καὶ οὐ μὴ εὑρεθῇ ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/021.yaml
  text: And one mighty angel lifted up a stone like a great millstone and threw it into the sea[a], saying, “So will Babylon the great city be thrown down with violence, and it will never be found again.”
translation:
  language: ta
  text: ஒரு வலிமைமிக்க தூதன் பெரிய எந்திரக்கல்லைப் போன்ற ஒரு கல்லைத் தூக்கிக் கடலில் எறிந்து, “இவ்வாறே மாபெரும் நகரமான பாபிலோன் பெரும் வேகத்துடன்[a] எறியப்பட்டு வீழ்த்தப்படும்; அது இனி ஒருபோதும் காணப்படாது” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பெரும் பாய்ச்சலுடன்,” “பெரும் வலிமையுடன்,” அல்லது “வன்மையாக” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் திடீரென்ற, வலிமையான இயக்கத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦρεν
  choice: தூக்கி
  rationale: தூதன் அடையாளச் செயலைச் செய்வதற்காகக் கல்லை எடுத்துத் தூக்கும் உடல்சார்ந்த செயலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: εἷς ἄγγελος ἰσχυρὸς
  choice: வலிமைமிக்க ஒரு தூதன்
  rationale: εἷς குறிக்கும் ஒருமையையும் ἰσχυρός குறிக்கும் வலிமையையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: λίθον ὡς μύλινον μέγαν
  choice: பெரிய எந்திரக்கல்லைப் போன்ற ஒரு கல்
  rationale: ὡς என்பதன் ஒப்புமையைப் பாதுகாத்து, கல் உண்மையில் எந்திரக்கல்லே என்று அடையாளப்படுத்தாமல் அதன் மாபெரும் கனத்தைச் சித்தரிக்கிறது.
- source_word: ἔβαλεν εἰς τὴν θάλασσαν
  choice: கடலில் எறிந்து
  rationale: βάλλω குறிக்கும் வலிமையான எறிதலை இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: Οὕτως
  choice: இப்படியே
  rationale: தூதனின் அடையாளச் செயலுக்கும் அதைத் தொடர்ந்து வரும் பாபிலோனின் வீழ்ச்சிக்கும் உள்ள நேரடி ஒப்புமையை வெளிப்படுத்துகிறது.
- source_word: ὁρμήματι
  choice: பெரும் வேகத்துடன்
  rationale: திடீரென்ற, வலிமையான பாய்ச்சல் அல்லது உந்துதல் என்ற சொல்லின் இயக்கநிறைந்த பொருளைப் பாதுகாக்கிறது; ‘வன்முறையுடன்’ என்பதில் தோன்றக்கூடிய செயற்பாட்டாளர் சார்ந்த மேலதிக நுணுக்கத்தைத் தவிர்க்கிறது.
- source_word: βληθήσεται
  choice: வீழ்த்தப்படும்
  rationale: முன்னர் கல் எறியப்பட்ட செயலை எதிரொலிக்கச் செய்வதோடு, நகரத்தின் அழிவுநிறைந்த கீழ்நோக்கிய வீழ்ச்சியை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: Βαβυλὼν ἡ μεγάλη πόλις
  choice: பாபிலோன் என்னும் மாபெரும் நகரம்
  rationale: பாபிலோனையும் ‘மாபெரும் நகரம்’ என்ற அதன் விளக்கப் பெயரையும் தெளிவான தமிழ் அமைப்பில் இணைக்கிறது.
- source_word: οὐ μὴ εὑρεθῇ ἔτι
  choice: அது இனி ஒருபோதும் காணப்படாது
  rationale: οὐ μή என்பதன் வலியுறுத்தப்பட்ட மறுப்பையும் ἔτι என்பதன் ‘இனி’ என்ற இறுதித்தன்மையையும் ஒருங்கிணைக்கிறது.
theological_decisions:
- issue: பாபிலோனின் அழிவு உருவகத்தின் தன்மை
  choice: தீர்ப்பு வலிமையானதும் இறுதியானதும் என மொழிபெயர்க்கப்பட்டது; ‘பாபிலோன்’ நேரடியான நகரமா, அடையாளமா, இரண்டுமா என்பது தீர்மானிக்கப்படவில்லை.
  alternative: பாபிலோனைச் சொற்பொருளிலான நகரமாகவோ, தேவனுக்கு எதிரான உலக அமைப்பாகவோ, பல கூறுகள் இணைந்த வெளிப்பாட்டு அடையாளமாகவோ வெளிப்படையாக விளக்குதல்.
  rationale: வசனம் ஓர் அடையாளச் செயலையும் பேரழிவான வீழ்ச்சியின் அறிவிப்பையும் தருகிறது; குறிப்பிட்ட இறுதிக்காலக் கோட்பாட்டை மொழிபெயர்ப்புக்குள் சேர்க்காமல் அதன் திட்டவட்டத்தையும் மறைபொருள் திறப்பையும் பாதுகாப்பது பொருத்தமானது.
translation_notes:
  register: நவீனச் செந்தமிழை அடிப்படையாகக் கொண்ட, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. வெளிப்படுத்தின விசேஷத்தின் பேரழிவுக் காட்சிக்கேற்ற வலிமை காக்கப்பட்டுள்ளது; அரிதான அல்லது மிகப் பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
