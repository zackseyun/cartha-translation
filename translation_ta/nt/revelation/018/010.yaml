id: REV.18.10
reference: Revelation 18:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀπὸ μακρόθεν ἑστηκότες διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, Βαβυλὼν ἡ πόλις ἡ ἰσχυρά, ὅτι μιᾷ ὥρᾳ ἦλθεν ἡ κρίσις σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/010.yaml
  text: standing far off because of the fear of her torment[a], saying, ‘Woe, woe, the great city, Babylon[b], the strong city! For in one hour your judgment has come.’
translation:
  language: ta
  text: அவளுடைய வேதனைக்குப் பயந்து, தொலைவில் நின்றுகொண்டு, “ஐயோ, ஐயோ[a], மாபெரும் நகரமே, பாபிலோனே, வலிமைமிக்க[b] நகரமே! ஏனெனில், ஒரே மணி நேரத்தில் உன் தீர்ப்பு வந்துவிட்டது” என்று சொல்வார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அந்தோ, அந்தோ’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வியப்பிடைச்சொல் புலம்பலையும் அழிவின் அறிவிப்பையும் வெளிப்படுத்தக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘வல்லமைமிக்க’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் வலிமை, ஆற்றல் அல்லது வல்லமை ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ μακρόθεν ἑστηκότες
  choice: தொலைவில் நின்றுகொண்டு
  rationale: இது அவர்கள் பாபிலோனுக்கு உதவ முன்வராமல், தூரத்தில் நிலைகொண்டு இருப்பதைக் காட்டுகிறது. கிரேக்க நிறைவுநிலைப் பங்கேற்புவினையின் நிலைசார் பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς
  choice: அவளுக்கு நேரும் வேதனைக்குப் பயந்து
  rationale: διά + வேற்றுமை வடிவம் காரணத்தைச் சுட்டுகிறது. βασανισμός என்பதன் கடுமையை ‘வேதனை’ இயல்பாகத் தருகிறது; ‘அவளுடைய வேதனை’ என்ற தெளிவற்ற உடைமைத் தொடருக்குப் பதிலாக, அது அவளுக்கு நேரும் வேதனை என்பதைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: Οὐαὶ οὐαί
  choice: ஐயோ, ஐயோ
  rationale: இந்தத் தமிழ் வியப்பிடைச்சொல் புலம்பலையும் வரப்போகும் அல்லது வந்துவிட்ட அழிவின் கனத்தையும் ஒருங்கே வெளிப்படுத்த முடியும். இருமுறை வருவதை அப்படியே காக்கிறது.
- source_word: ἡ πόλις ἡ μεγάλη
  choice: மாபெரும் நகரமே
  rationale: ‘பெரிய நகரம்’ என்பதைவிட ‘மாபெரும் நகரம்’ இங்குள்ள உயர்த்திக் கூறும் வெளிப்பாட்டையும் அழைப்புமுறையையும் இயல்பாகத் தருகிறது.
- source_word: Βαβυλὼν
  choice: பாபிலோன்
  rationale: கிரேக்கப் பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- source_word: ἡ πόλις ἡ ἰσχυρά
  choice: வலிமைமிக்க நகரம்
  rationale: ἰσχυρά என்பதிலுள்ள வலிமை அல்லது ஆற்றல் என்ற பரப்பைத் தக்கவைத்து, நகரத்தைச் சுட்டும் இயல்பான நவீனத் தமிழ் தொடராக அமைகிறது.
- source_word: μιᾷ ὥρᾳ
  choice: ஒரே மணி நேரத்தில்
  rationale: நியாயத்தீர்ப்பு மிக விரைவாக வந்ததை வலியுறுத்தும் காலக் குறிப்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἦλθεν ἡ κρίσις σου
  choice: உன் தீர்ப்பு வந்துவிட்டது
  rationale: ἦλθεν குறிக்கும் நிறைவுற்ற வருகையையும் அதன் தற்போதைய விளைவையும் ‘வந்துவிட்டது’ இயல்பாக உணர்த்துகிறது. κρίσις என்பதைக் தண்டனை என்று மட்டும் சுருக்காமல் ‘தீர்ப்பு’ எனத் தருகிறது.
theological_decisions:
- issue: οὐαί என்பதிலுள்ள புலம்பல் மற்றும் அழிவறிவிப்பு
  choice: ஐயோ, ஐயோ
  alternative: அந்தோ, அந்தோ
  rationale: ‘ஐயோ’ என்பது தமிழில் உண்மையான புலம்பலாகவும் பேரழிவைக் குறிக்கும் கனமான கூக்குரலாகவும் இயங்குகிறது; ஒரு பொருளை மட்டும் கட்டாயப்படுத்தாமல் இரு நுணுக்கங்களையும் தக்கவைக்கிறது.
- issue: κρίσις என்பதன் பொருள்
  choice: தீர்ப்பு
  alternative: தண்டனை
  rationale: இங்கு தீர்ப்பின் விளைவாகத் தண்டனை உள்ளடங்கினாலும், கிரேக்கச் சொல் நியாயந்தீர்த்தல் அல்லது தீர்ப்பு என்ற பரந்த பொருளைக் கொண்டது. ஆகவே அதன் இறையியல் பரப்பைச் சுருக்கவில்லை.
- issue: ἦλθεν என்பதன் காலநிலைத் தாக்கம்
  choice: வந்துவிட்டது
  alternative: வந்தது
  rationale: நிகழ்ந்து முடிந்த தீர்ப்பு இப்போது எதிர்நிற்கிறது என்ற நேரடிப் பேச்சின் தாக்கத்தைத் தமிழில் இயல்பாகத் தருகிறது; இதனால் தனிப்பட்ட காலவரிசைக் கோட்பாடு எதுவும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், வெளிப்படுத்தின விசேஷத்திற்குரிய கனமான தீர்க்கதரிசனத் தொனியுடன் வடிவமைக்கப்பட்டது. அழைப்புமுறைக்கான ‘-ஏ’ விகுதி நேரடிப் புலம்பலை இயல்பாகக் காட்டுகிறது. மூலத்தில் தொடர்ச்சியான பங்கேற்புவினைகளாக உள்ள அமைப்பு, முந்தைய சூழலோடு வாசிக்க ஏற்றவாறு ‘நின்றுகொண்டு … சொல்வார்கள்’ எனத் தமிழில் நிறைவு செய்யப்பட்டுள்ளது.
