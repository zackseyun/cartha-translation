  to: 'அவன் வலிமைமிக்க குரலில் முழங்கினான்: “வீழ்ந்தது, வீழ்ந்தது மகா பாபிலோன்! அது பேய்களின் உறைவிடமாகவும், அசுத்தமான ஒவ்வோர் ஆவிக்கும் சிறையாகவும்[a], அசுத்தமான ஒவ்வொரு பறவைக்கும் சிறையாகவும், அசுத்தமும் வெறுக்கப்பட்டதுமான ஒவ்வொரு விலங்குக்கும் சிறையாகவும் மாறிவிட்டது[b].”'
