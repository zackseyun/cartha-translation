id: REV.18.2
reference: Revelation 18:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἔκραξεν ⸀ἐν ἰσχυρᾷ φωνῇ λέγων· Ἔπεσεν, ⸀ἔπεσεν Βαβυλὼν ἡ μεγάλη, καὶ ἐγένετο κατοικητήριον ⸀δαιμονίων καὶ φυλακὴ παντὸς πνεύματος ἀκαθάρτου καὶ φυλακὴ παντὸς ὀρνέου ἀκαθάρτου ⸂καὶ φυλακὴ παντὸς θηρίου ἀκαθάρτου⸃ καὶ μεμισημένου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/002.yaml
  text: And he cried out with a mighty voice[a], saying, “Fallen, fallen is Babylon the great! She has become a dwelling place of demons, a prison of every unclean spirit, a prison of every unclean bird[b], and a prison of every unclean and hated beast.”
translation:
  language: ta
  text: 'அவன் வலிமைமிக்க குரலில் முழங்கினான்: “வீழ்ந்தது, வீழ்ந்தது மகா பாபிலோன்! அது பேய்களின் உறைவிடமாகவும், அசுத்தமான ஒவ்வோர் ஆவிக்கும் சிறையாகவும்[a], அசுத்தமான ஒவ்வொரு பறவைக்கும் சிறையாகவும், அசுத்தமும் வெறுக்கப்பட்டதுமான ஒவ்வொரு விலங்குக்கும் சிறையாகவும் மாறிவிட்டது[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அசுத்தமான ஒவ்வோர் ஆவியும்… அசுத்தமான ஒவ்வொரு பறவையும்… அசுத்தமும் வெறுக்கப்பட்டதுமான ஒவ்வொரு விலங்கும் தங்கும் அல்லது அடிக்கடி வந்து செல்லும் இடமாகவும்.” ‘சிறை’ என்று மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொல், அவை தங்கும் அல்லது அடிக்கடி வந்து செல்லும் இடத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சில கையெழுத்துப் பிரதிகளில், “அசுத்தமும் வெறுக்கப்பட்டதுமான ஒவ்வொரு விலங்குக்கும் சிறையாகவும்” என்ற சொற்றொடர் இல்லை.
    reason: textual_variant
lexical_decisions:
- source_word: ἔκραξεν ἐν ἰσχυρᾷ φωνῇ
  choice: வலிமைமிக்க குரலில் முழங்கினான்
  rationale: κράζω குறிக்கும் உரத்த அறிவிப்பையும் ἰσχυρός குறிக்கும் வலிமையையும் இயல்பான, உயர்நடையுள்ள நவீனத் தமிழில் ஒருங்கிணைக்கிறது.
- source_word: Ἔπεσεν, ἔπεσεν
  choice: வீழ்ந்தது, வீழ்ந்தது
  rationale: இருமுறை கூறப்படும் இறந்தகால அறிவிப்பின் தீர்க்கதரிசனத் தொனியையும் ஏசாயா நூலுடனான எதிரொலியையும் காக்கிறது.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: மகா பாபிலோன்
  rationale: தலைப்புப் போன்ற கிரேக்கச் சொல்லமைப்பை தமிழில் வழக்கமான, கண்ணியமான வடிவில் தருகிறது.
- source_word: κατοικητήριον δαιμονίων
  choice: பேய்களின் உறைவிடம்
  rationale: κατοικητήριον என்பதன் குடியிருக்கும் இடம் என்ற பொருளைத் தெளிவாகவும் δαιμόνια என்பதைக் குறிப்பாகவும் வெளிப்படுத்துகிறது.
- source_word: φυλακή
  choice: சிறை
  rationale: காவல், அடைப்பு, வைக்கப்படும் இடம் ஆகிய பொருள் வட்டத்தைச் சேர்ந்த சொல்லாக இருப்பதால், இங்கு தீர்ப்பின் உருவகத்தில் ‘சிறை’ முதன்மைப் பொருளைத் தெளிவாகக் காட்டுகிறது; ‘வாழிடம்/நடமாடும் இடம்’ என்ற சூழல்சார் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: παντὸς πνεύματος ἀκαθάρτου
  choice: அசுத்தமான ஒவ்வோர் ஆவிக்கும்
  rationale: πᾶς என்பதன் முழுமையையும் ἀκάθαρτος என்பதன் வேதாகமத் தூய்மை சார்ந்த சொல்லாட்சியையும் காக்கிறது.
- source_word: παντὸς ὀρνέου ἀκαθάρτου
  choice: அசுத்தமான ஒவ்வொரு பறவைக்கும்
  rationale: ὄρνεον என்பதை ஊகமாகக் கழுகு அல்லது பிணந்தின்னிப் பறவை என்று குறுக்காமல் பொதுவான ‘பறவை’ என்றே தருகிறது.
- source_word: παντὸς θηρίου ἀκαθάρτου καὶ μεμισημένου
  choice: அசுத்தமும் வெறுக்கப்பட்டதுமான ஒவ்வொரு விலங்குக்கும்
  rationale: θηρίον இங்கு பொதுப்பெயராகப் பயன்படுத்தப்பட்டிருப்பதைக் காட்டுகிறது; μεμισημένου என்பதன் நிறைவுற்ற செயப்பாட்டு உணர்வை ‘வெறுக்கப்பட்ட’ என்பதால் காக்கிறது.
- source_word: ἐγένετο
  choice: மாறிவிட்டது
  rationale: வீழ்ச்சிக்குப் பின் ஏற்பட்டுள்ள தற்போதைய விளைவு நிலையைக் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: θηρίον என்பது வெளிப்படுத்துதலில் வரும் குறிப்பிட்ட ‘மிருகம்’ என்ற பட்டமா அல்லது பொதுவான விலங்கைக் குறிக்கிறதா?
  choice: பொதுப்பெயரான ‘விலங்கு’
  alternative: குறிப்பிட்ட அடையாளப் பட்டமாக ‘மிருகம்’
  rationale: παντός என்பதுடன் ஆவிகள், பறவைகள் ஆகியவற்றோடு வரிசைப்படுத்தப்பட்டிருப்பதால், இங்கு குறிப்பிட்ட ஒரே எதிரியை அல்லாமல் பொதுவாக விலங்குகளைச் சுட்டுகிறது.
- issue: φυλακή என்பதை இந்தத் தீர்ப்புக் காட்சியில் எவ்வாறு மொழிபெயர்ப்பது?
  choice: சிறை
  alternative: வாழிடம் அல்லது நடமாடும் இடம்
  rationale: சிறை, காவல், காக்கப்படும் இடம் ஆகிய அடிப்படைப் பொருள்களை முதன்மை உரையில் தெரியும் வகையில் வைத்திருக்கிறது; இச்சூழலில் சாத்தியமான ‘haunt’ பொருளை அடிக்குறிப்பு மூலம் மறைக்காமல் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வெளிப்படுத்துதல் நூலுக்கேற்ற உயர்ந்த அறிவிப்புத் தொனி காக்கப்பட்டுள்ளது. தேவையற்ற வடசொற்களையும் மிகப் பழமையான நடையையும் தவிர்த்து, ‘மகா பாபிலோன்’, ‘அசுத்தமான ஆவி’ போன்ற வேதாகம இடைநூல் தொடர்புடைய சொல்லாட்சிகள் தெளிவுக்காகப் பேணப்பட்டுள்ளன.
