  source_fidelity: 'முதன்மை உரை கிரேக்கத்தின் கூறுகளைத் துல்லியமாகக் காக்கிறது: உரத்த/வலிமையான அறிவிப்பு, இரட்டிப்பு வீழ்ச்சி அறிவிப்பு, பாபிலோனின் புதிய நிலை, மற்றும் அசுத்த ஆவி, பறவை, விலங்கு ஆகிய மூன்றுக்கும் மீளவரும் φυλακή ஆகியவை அனைத்தும் பொருத்தமாக உள்ளன. θηρίον பொதுப்பெயராக ‘விலங்கு’ எனத் தரப்பட்டிருப்பதும், μεμισημένου-ன் செயப்பாட்டு விளைவு ‘வெறுக்கப்பட்ட’ எனக் காக்கப்பட்டிருப்பதும் சரியானவை.'
  naturalness: ‘வலிமைமிக்க குரலில் முழங்கினான்,’ ‘வீழ்ந்தது, வீழ்ந்தது,’ ‘மாறிவிட்டது’ ஆகியவை நவீனத் தரத் தமிழில் தெளிவாகவும் வெளிப்படுத்துதல் நூலுக்கேற்ற அறிவிப்புத் தொனியுடனும் உள்ளன. ‘மகா பாபிலோன்’ என்பது நிலைபெற்ற வேதாகமப் பெயர்நடையாக ஏற்றது.
