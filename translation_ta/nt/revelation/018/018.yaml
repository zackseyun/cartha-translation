id: REV.18.18
reference: Revelation 18:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ⸀ἔκραξαν βλέποντες τὸν καπνὸν τῆς πυρώσεως αὐτῆς λέγοντες· Τίς ὁμοία τῇ πόλει τῇ μεγάλῃ;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/018.yaml
  text: And they cried out as they saw the smoke of her burning[a], saying, “What city is like the great city?”
translation:
  language: ta
  text: 'அவள் எரிவதால் உண்டான புகையை அவர்கள் பார்த்தபோது உரக்கக் கூவினார்கள்: “அந்தப் பெரிய நகரத்தைப் போன்ற நகரம் எது?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκραξαν
  choice: உரக்கக் கூவி
  rationale: κράζω என்பதன் உரத்த கூக்குரல் தன்மையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: βλέποντες
  choice: பார்த்தபோது
  rationale: முதன்மை வினையுடன் ஒரே நேரத்தில் நிகழும் செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: τὸν καπνὸν τῆς πυρώσεως αὐτῆς
  choice: அவள் எரிவதால் எழுந்த புகையை
  rationale: πύρωσις குறிக்கும் எரிதல் நிகழ்வையும், αὐτῆς வழியாக நகரத்திற்குக் கொடுக்கப்பட்ட பெண்பால் உருவகத்தையும் காக்கிறது; இயல்பான தமிழுக்காக காரணத் தொடர்பு வெளிப்படுத்தப்படுகிறது.
- source_word: λέγοντες
  choice: என்று சொன்னார்கள்
  rationale: நேர்கூற்றை அறிமுகப்படுத்தும் பங்கேற்புவினையை இயல்பான தமிழ் வாக்கிய அமைப்பில் தருகிறது.
- source_word: Τίς ὁμοία τῇ πόλει τῇ μεγάλῃ;
  choice: இந்த மாபெரும் நகரத்தைப் போன்ற நகரம் எது?
  rationale: கிரேக்கத்தில் விடுபட்டுள்ள ஒப்பீட்டின் பொருளைச் சூழலிலிருந்து ‘நகரம்’ என வெளிப்படுத்தி, வினைச்சொல் இல்லாத மூலத்தின் நிகழ்காலத்திற்கும் கடந்தகாலத்திற்கும் கட்டுப்படாத சொல்லாட்சியைப் பாதுகாக்கிறது.
theological_decisions:
- issue: பாபிலோன்/நகரத்தின் பெண் உருவகம்
  choice: ‘அவள்’ என்று பெண்பால் குறிப்பைத் தக்கவைத்தல்
  alternative: ‘அது’ என்று அஃறிணையில் குறிப்பிடுதல்
  rationale: வெளிப்படுத்தின விசேஷம் முழுவதிலும் நகரம் ஒரு பெண்ணாக உருவகப்படுத்தப்படுகிறது; ‘அவள்’ என்பது அந்த இலக்கிய மற்றும் இறையியல் உருவகத்தைத் தக்கவைக்கிறது.
- issue: ஒப்பீட்டுக் கேள்வியின் காலம்
  choice: தமிழில் வெளிப்படையான கால வினையைச் சேர்க்காமல் ‘போன்ற நகரம் எது?’ என மொழிபெயர்த்தல்
  alternative: ‘எந்த நகரம் ... போல இருந்தது?’ அல்லது ‘எந்த நகரம் ... போல இருக்கிறது?’
  rationale: Τίς ὁμοία என்ற கிரேக்கக் கூற்றில் வெளிப்படையான இணைப்புவினை இல்லை. காலத்தைத் தீர்மானிக்காமல் விடுவது மூலத்தின் சுருக்கத்தையும் உண்மையான இருபொருள் வாய்ப்பையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், கண்ணியமான நடையில், மூலத்தின் புலம்பல் சார்ந்த உரத்த தொனியும் நகரத்தின் பெண் உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
