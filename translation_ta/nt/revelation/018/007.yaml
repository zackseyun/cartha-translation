id: REV.18.7
reference: Revelation 18:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅσα ἐδόξασεν αὑτὴν καὶ ἐστρηνίασεν, τοσοῦτον δότε αὐτῇ βασανισμὸν καὶ πένθος. ὅτι ἐν τῇ καρδίᾳ αὐτῆς λέγει ὅτι Κάθημαι βασίλισσα, καὶ χήρα οὐκ εἰμί, καὶ πένθος οὐ μὴ ἴδω.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/007.yaml
  text: As much as she glorified herself and lived in luxury[a], give her that much torment and mourning. For she says in her heart, ‘I sit as a queen, and I am not a widow[b], and I will certainly never see mourning.’
translation:
  language: ta
  text: அவள் எந்த அளவுக்குத் தன்னை மகிமைப்படுத்திக்கொண்டு சுகபோகமாக வாழ்ந்தாளோ[a], அந்த அளவுக்கு அவளுக்கு வேதனையையும் துக்கத்தையும் கொடுங்கள். ஏனெனில் அவள் தன் உள்ளத்தில், ‘நான் அரசியாக வீற்றிருக்கிறேன்; நான் விதவை அல்ல; துக்கத்தை நான் ஒருபோதும் காணவே மாட்டேன்[b]’ என்று சொல்கிறாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தன்னின்பத்தில் திளைத்து வாழ்ந்தாளோ’ அல்லது ‘கட்டுப்பாடின்றி இன்பம் அனுபவித்து வாழ்ந்தாளோ.’ கிரேக்க வினை ஆடம்பரமான, கட்டுப்பாடற்ற சுகபோக வாழ்வைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘ஒருபோதும் காணவே மாட்டேன்’ என்பதில் கிரேக்க மொழியின் வலியுறுத்தப்பட்ட மறுப்பு பயன்படுத்தப்பட்டுள்ளது. துக்கம் தனக்கு ஒருபோதும் வராது என்ற அவளுடைய உறுதியான நம்பிக்கையை இது வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσα ... τοσοῦτον
  choice: எந்த அளவுக்கு ... அந்த அளவுக்கு
  rationale: கிரேக்கத்தின் ஒப்புமைத் தொடர்பையும், அவளுடைய நடத்தைக்கு ஏற்ற அளவில் வரும் தண்டனையையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: ἐδόξασεν αὑτὴν
  choice: தன்னை மகிமைப்படுத்திக்கொண்டு
  rationale: தன்னையே உயர்த்திக்கொள்ளும் செயலை வெளிப்படையாக வைத்திருக்கிறது; ‘மகிமை’ என்ற கருத்துத் தொடர்பையும் காக்கிறது.
- source_word: ἐστρηνίασεν
  choice: சுகபோகமாக வாழ்ந்தாள்
  rationale: ஆடம்பரமான, கட்டுப்பாடற்ற தன்னின்ப வாழ்வைக் குறிக்கும் வினையின் பரப்பைத் தக்கவைத்து, தேவையின்றி பாலியல் பொருளாகக் குறுக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: δότε αὐτῇ
  choice: அவளுக்கு ... கொடுங்கள்
  rationale: கட்டளை வடிவத்தையும் நீதித்தீர்ப்பின் நேரடியான தொனியையும் பாதுகாக்கிறது.
- source_word: βασανισμὸν
  choice: வேதனை
  rationale: நீதித்தீர்ப்பினால் வரும் கடுமையான துன்பத்தை வெளிப்படுத்துகிறது; அதை உடல்ரீதியான சித்திரவதையாக மட்டும் குறுக்கவில்லை.
- source_word: πένθος
  choice: துக்கம்
  rationale: இழப்பு அல்லது தீர்ப்பினால் உண்டாகும் ஆழ்ந்த துயரைக் குறிக்கிறது; வசனத்தில் வரும் இரு இடங்களிலும் ஒரே சொல்லைப் பயன்படுத்தி மறுபடிவத்தைப் பாதுகாக்கிறது.
- source_word: ἐν τῇ καρδίᾳ αὐτῆς λέγει
  choice: அவள் தன் உள்ளத்தில் ... என்று சொல்கிறாள்
  rationale: உள்ளார்ந்த தற்பேச்சையும் அகந்தையான தன்னம்பிக்கையையும் குறிக்கும் வேதாகமச் சொல்லாட்சியை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: Κάθημαι βασίλισσα
  choice: நான் அரசியாக வீற்றிருக்கிறேன்
  rationale: அரியணையில் பாதுகாப்புடன் அமர்ந்திருக்கும் அரசியின் உருவகத்தைத் தெளிவாகவும் கண்ணியமாகவும் தருகிறது.
- source_word: χήρα οὐκ εἰμί
  choice: நான் விதவை அல்ல
  rationale: இழப்போ கைவிடப்படுதலோ தனக்கு நேராது என்ற அவளுடைய பெருமிதத்தைத் தாங்கும் பெண் உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: οὐ μὴ ἴδω
  choice: ஒருபோதும் காணவே மாட்டேன்
  rationale: οὐ μή என்னும் வலியுறுத்தப்பட்ட மறுப்பை ‘ஒருபோதும்’ மற்றும் ‘வே மாட்டேன்’ என்பவற்றின் மூலம் வலுவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பாபிலோன் ஒரு பெண், அரசி, விதவை என உருவகப்படுத்தப்படுதல்
  choice: பெண்பால் உருவகத்தை ‘அவள்’, ‘அரசி’, ‘விதவை’ என்று முழுவதும் தக்கவைத்தல்
  alternative: நகரம் அல்லது பொருளாதார அமைப்பு என்று ஆளற்ற வடிவில் மாற்றுதல்
  rationale: கிரேக்க உரை பாபிலோனைத் தொடர்ந்து ஒரு பெண்ணாக உருவகப்படுத்துகிறது. அவளுடைய அகந்தை, பொய்யான பாதுகாப்புணர்வு, பின்னர் வரும் தீர்ப்பு ஆகியவற்றுக்கு இந்த உருவகம் மையமானது.
- issue: βασανισμός என்பதிலுள்ள நீதித்தீர்ப்பின் கடுமை
  choice: வேதனை
  alternative: சித்திரவதை; வலி
  rationale: தீர்ப்பின் கடுமையைப் பாதுகாக்கிறது; ஆனால் உரை குறிப்பிடாத குறிப்பிட்ட தண்டனை முறையை மொழிபெயர்ப்பில் புகுத்தவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வீற்றிருக்கிறேன்’ அரசியின் அரியணைப் பாதுகாப்பை இயல்பாகக் காட்டுகிறது; ‘சுகபோகம்’ பொருளாதார-அரச ஆடம்பரச் சூழலைத் தக்கவைக்கிறது. மேற்கோளுக்குள் உள்ள மூன்று தற்பெருமைக் கூற்றுகளும் அரைப்புள்ளிகளால் தெளிவாகப் பிரிக்கப்பட்டுள்ளன.
