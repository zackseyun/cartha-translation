id: REV.18.3
reference: Revelation 18:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι ἐκ τοῦ οἴνου τοῦ θυμοῦ τῆς πορνείας αὐτῆς ⸀πέπτωκαν πάντα τὰ ἔθνη, καὶ οἱ βασιλεῖς τῆς γῆς μετ’ αὐτῆς ἐπόρνευσαν, καὶ οἱ ἔμποροι τῆς γῆς ἐκ τῆς δυνάμεως τοῦ στρήνους αὐτῆς ἐπλούτησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/003.yaml
  text: For all the nations have drunk from the wine of the wrath of her sexual immorality[a], and the kings of the earth committed sexual immorality with her[c][b], and the merchants of the earth grew rich from the power of her luxury.
translation:
  language: ta
  text: ஏனெனில், அவளுடைய பாலியல் ஒழுக்கக்கேட்டின் கடுங்கோபத்தின் திராட்சரசத்தினால் எல்லா நாடுகளும் வீழ்ந்துவிட்டன[a]; பூமியின் அரசர்கள் அவளோடு பாலியல் ஒழுக்கக்கேட்டில் ஈடுபட்டார்கள்[b]; பூமியின் வணிகர்கள் அவளுடைய அளவுகடந்த ஆடம்பரத்தின் வல்லமையால் செல்வந்தர்களானார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில வாசிப்புகளில், “அவளுடைய பாலியல் ஒழுக்கக்கேட்டின் கடுங்கோபத்தின் திராட்சரசத்திலிருந்து எல்லா நாடுகளும் குடித்திருக்கின்றன” என்று உள்ளது (πέπωκαν, ‘குடித்திருக்கின்றன’); இங்கு வழங்கப்பட்ட கிரேக்க உரையில் πέπτωκαν, ‘வீழ்ந்துவிட்டன,’ என்று உள்ளது. θυμός என்பதற்கு சூழலுக்கு ஏற்ப ‘கடுங்கோபம்’ அல்லது ‘வெறியார்வம்’ என்று பொருள் கொள்ளலாம்; எனவே இச்சொற்றொடரை “அவளுடைய பாலியல் ஒழுக்கக்கேட்டின் வெறியார்வத்தின் திராட்சரசம்” என்றும் புரிந்துகொள்ளலாம்.
    reason: textual_and_lexical_alternative
  - marker: b
    text: இங்குள்ள பாலியல் ஒழுக்கக்கேடு என்ற மொழி, சிலைவழிபாடு சார்ந்த துரோகம், ஊழலான கூட்டணி, சுரண்டல் ஆகியவற்றை உருவகமாகச் சுட்டக்கூடும்; மொழிபெயர்ப்பு கிரேக்கத்தின் பாலியல் படிமத்தைத் தக்கவைக்கிறது.
    reason: alternative_reading
  - marker: c
    text: “அளவுகடந்த ஆடம்பரம்” என்பதற்கான கிரேக்கச் சொல் வெறும் பொருள் வசதியை அல்ல, தன்னிச்சையான, செருக்கான, அளவுகடந்த ஆடம்பரத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய அறிவிப்புக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் காரணப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἐκ τοῦ οἴνου
  choice: திராட்சரசத்தினால்
  rationale: ἐκ குறிக்கும் மூலத்தையும் காரணத் தொடர்பையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; திராட்சரச உருவகத்தையும் தக்கவைக்கிறது.
- source_word: θυμοῦ
  choice: கடுங்கோபம்
  rationale: θυμός என்பதன் தீர்ப்புச் சூழலுக்கேற்ற ‘கோபம்/சினம்’ பொருளை எடுத்துக்கொள்கிறது; ‘தீவிர வேட்கை’ என்ற சாத்தியம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: πορνείας
  choice: பாலியல் ஒழுக்கக்கேடு
  rationale: πορνεία-வின் பாலியல் உருவகத்தை நவீனத் தமிழில் தெளிவாகத் தக்கவைக்கிறது; அதை நேரடியாக ‘சிலைவழிபாடு’ என்று விளக்கி முடிவுசெய்யவில்லை.
- source_word: πέπτωκαν
  choice: வீழ்ந்துவிட்டன
  rationale: வழங்கப்பட்ட SBLGNT மூலத்தில் உள்ள πίπτω வினையின் நிறைவேற்ற நிலையைக் குறிக்கும் வடிவத்தை நேரடியாக மொழிபெயர்க்கிறது; ‘குடித்திருக்கின்றன’ என்ற வேறு வாசிப்பு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: πάντα τὰ ἔθνη
  choice: எல்லா நாடுகளும்
  rationale: பாபிலோனின் செல்வாக்குக்குட்பட்ட மக்களினங்களைத் தொகுப்பாகக் குறிக்கும் இயல்பான தமிழ்.
- source_word: μετ’ αὐτῆς ἐπόρνευσαν
  choice: அவளோடு பாலியல் ஒழுக்கக்கேட்டில் ஈடுபட்டார்கள்
  rationale: πορνεύω-வின் பாலியல் மொழிப்படிமத்தைத் தக்கவைத்து, தமிழில் இயல்பான வினைத்தொடராக அளிக்கிறது.
- source_word: ἔμποροι
  choice: வணிகர்கள்
  rationale: அதிகாரம் 18-ன் வர்த்தகச் சூழலுக்கு நேரான, பொதுவாகப் புரியும் சொல்.
- source_word: ἐκ τῆς δυνάμεως
  choice: வல்லமையால்
  rationale: δύναμις என்பதன் ஆற்றல் அல்லது வல்லமைப் பொருளைத் தக்கவைத்து, ஆடம்பரப் பெருக்கு செல்வம் உண்டாக்கிய ஆற்றலைக் குறிக்கிறது.
- source_word: στρήνους
  choice: ஆடம்பரப் பெருக்கு
  rationale: στρῆνος குறிக்கும் செருக்கான, தன்னிச்சையான, அளவுகடந்த ஆடம்பரத்தை வெறும் வசதி என்று மெலிதாக்காமல் தெரிவிக்கிறது.
- source_word: ἐπλούτησαν
  choice: செல்வந்தர்களானார்கள்
  rationale: வணிகர்கள் அதன் விளைவாகச் செல்வம் அடைந்ததைக் குறிக்கும் இயல்பான தமிழ்.
theological_decisions:
- issue: πορνεία/πορνεύω என்பதை நேரடியான பாலியல் மொழியாகவா, ‘சிலைவழிபாடு’ அல்லது ‘ஆவிக்குரிய விபசாரம்’ என்று விளக்கமாகவா மொழிபெயர்ப்பது
  choice: முதன்மை உரையில் ‘பாலியல் ஒழுக்கக்கேடு’ என்ற உருவக மொழியைத் தக்கவைத்தல்
  alternative: சிலைவழிபாடு; ஆவிக்குரிய விபசாரம்; ஊழலான கூட்டணி
  rationale: வெளிப்படுத்தின விசேஷம் பாலியல் ஒழுக்கக்கேட்டின் படிமத்தின் மூலம் சமய, அரசியல், பொருளாதாரத் துரோகங்களை ஒன்றாகச் சுட்டுகிறது. ஒரு விளக்கத்திற்குள் அதைச் சுருக்காமல் மூலத்தின் இறையியல் அழுத்தத்தையும் பலபொருள் சாத்தியத்தையும் காக்கிறது.
- issue: θυμός என்பதைக் ‘கடுங்கோபம்’ என்றா ‘தீவிர வேட்கை’ என்றா புரிந்துகொள்வது
  choice: தீர்ப்புச் சூழலை முன்னிட்டு ‘கடுங்கோபம்’
  alternative: தீவிர வேட்கை; வெறியார்வம்
  rationale: வெளிப்படுத்தின விசேஷத்தின் தீர்ப்புச் சொற்சூழலில் ‘கோபம்’ பொருத்தமானது; ஆயினும் தொடர்புச் சொற்களின் அமைப்பு பாலியல் ஒழுக்கக்கேட்டின் வெறியார்வம் என்ற புரிதலுக்கும் இடமளிப்பதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: πέπτωκαν என்ற வழங்கப்பட்ட வாசிப்புக்கும் ‘குடித்திருக்கின்றன’ என்று பொருள்படும் πέπωκαν வாசிப்புக்கும் இடையிலான வேறுபாடு
  choice: வழங்கப்பட்ட மூல உரையைப் பின்பற்றி ‘வீழ்ந்துவிட்டன’
  alternative: ‘திராட்சரசத்தைக் குடித்திருக்கின்றன’
  rationale: மொழிபெயர்ப்பின் முதன்மை ஆதாரம் வழங்கப்பட்ட கிரேக்க உரை என்பதால் πέπτωκαν என்பதன் பொருள் முதன்மை உரையில் தரப்படுகிறது; பரவலாக அறியப்படும் மாற்று வாசிப்பு அடிக்குறிப்பில் திறந்தவாறு தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வழிபாட்டு வாசிப்புக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பாலியல் ஒழுக்கக்கேடு’ தெளிவானதாயிருந்தும் தேவையற்ற கடுமையற்ற சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது. ‘ஆடம்பரப் பெருக்கு’ στρῆνος என்பதிலுள்ள அளவுகடந்த சுயநுகர்வை வெளிப்படுத்துகிறது. வழங்கப்பட்ட கிரேக்க வாசிப்புக்கும் பரவலான மாற்று வாசிப்புக்கும் இடையிலான உண்மையான உரைவேறுபாடு மறைக்கப்படவில்லை.
