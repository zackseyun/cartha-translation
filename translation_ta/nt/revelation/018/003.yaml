revisions:
- from: ஏனெனில், அவளுடைய பாலியல் ஒழுக்கக்கேட்டின் கடுங்கோபமாகிய திராட்சரசத்தினால் எல்லா நாடுகளும் வீழ்ந்துவிட்டன[a]; பூமியின் அரசர்கள் அவளோடு பாலியல் ஒழுக்கக்கேட்டில் ஈடுபட்டார்கள்[b]; பூமியின் வணிகர்கள் அவளுடைய ஆடம்பரப் பெருக்கின் வல்லமையால் செல்வந்தர்களானார்கள்[c].
  to: ஏனெனில், அவளுடைய பாலியல் ஒழுக்கக்கேட்டின் கடுங்கோபத்தின் திராட்சரசத்தினால் எல்லா நாடுகளும் வீழ்ந்துவிட்டன[a]; பூமியின் அரசர்கள் அவளோடு பாலியல் ஒழுக்கக்கேட்டில் ஈடுபட்டார்கள்[b]; பூமியின் வணிகர்கள் அவளுடைய அளவுகடந்த ஆடம்பரத்தின் வல்லமையால் செல்வந்தர்களானார்கள்[c].
  rationale: The revision follows the supplied SBLGNT text, rendering πέπτωκαν as ‘வீழ்ந்துவிட்டன,’ while explicitly preserving the well-known πέπωκαν (‘have drunk’) variant in the note. It also retains the Greek genitive-chain ambiguity more closely, improves modern Tamil idiom for στρῆνος, and keeps the sexual imagery and its metaphorical openness intact.
