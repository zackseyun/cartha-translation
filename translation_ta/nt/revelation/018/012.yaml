id: REV.18.12
reference: Revelation 18:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: γόμον χρυσοῦ καὶ ἀργύρου καὶ λίθου τιμίου καὶ ⸀μαργαριτῶν καὶ βυσσίνου καὶ ⸀πορφύρας καὶ σιρικοῦ καὶ κοκκίνου, καὶ πᾶν ξύλον θύϊνον καὶ πᾶν σκεῦος ἐλεφάντινον καὶ πᾶν σκεῦος ἐκ ξύλου τιμιωτάτου καὶ χαλκοῦ καὶ σιδήρου καὶ μαρμάρου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/012.yaml
  text: cargo of gold and silver and precious stones and pearls and fine linen and purple cloth and silk and scarlet cloth[a], and every kind of citron wood and every kind of ivory vessel and every kind of vessel made from very precious wood and bronze and iron and marble,
translation:
  language: ta
  text: தங்கம், வெள்ளி, விலையுயர்ந்த கற்கள், முத்துகள், மெல்லிய ஆளிநார் துணி, ஊதா நிறத் துணி, பட்டுத்துணி, செந்நிறத் துணி ஆகிய சரக்குகளையும், எல்லா வகையான நறுமணமுள்ள மரத்தையும்,[a] எல்லா வகையான தந்தப் பொருட்களையும், மிகவும் விலையுயர்ந்த மரத்தால் செய்யப்பட்ட எல்லா வகையான பொருட்களையும், வெண்கலத்தால் செய்யப்பட்டவற்றையும், இரும்பால் செய்யப்பட்டவற்றையும், பளிங்கால் செய்யப்பட்டவற்றையும்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எல்லா வகையான துயின் மரத்தையும்”; இது விலையுயர்ந்த நறுமணமுள்ள ஒரு மரத்துக்கான மரபுவழிப் பெயர்.
    reason: θύϊνος என்ற அரிய மரப்பெயரின் துல்லியமான தாவர அடையாளம் உறுதியற்றதால், பொதுவான மொழிபெயர்ப்புடன் ஒலிபெயர்ப்பு மாற்றாகத் தரப்படுகிறது.
lexical_decisions:
- source_word: γόμον
  choice: சரக்குகளையும்
  rationale: கப்பலில் ஏற்றப்படும் சரக்கு அல்லது வணிகப் பொதியை குறிக்கும் சொல்; பட்டியலின் பல பொருட்களை இயல்பாக உள்ளடக்கத் தமிழில் பன்மை பயன்படுத்தப்பட்டது.
- source_word: λίθου τιμίου
  choice: விலையுயர்ந்த கற்கள்
  rationale: கிரேக்கத்தில் ஒருமை வடிவம் பொருள் வகையைக் கூட்டாகக் குறிக்கிறது; தமிழில் இயல்பான வணிகப் பட்டியலுக்குப் பன்மை பொருத்தமானது.
- source_word: μαργαριτῶν
  choice: முத்துகள்
  rationale: மூலத்தின் பன்மை வடிவமும் வழக்கமான பொருளும் காக்கப்பட்டன.
- source_word: βυσσίνου
  choice: மெல்லிய நார்ப்பட்டு
  rationale: βύσσινος குறிக்கும் உயர்தர நுண்ணிய linen துணியை, தமிழில் பட்டு எனத் தவறாகப் புரிந்துகொள்ளாமல் இருக்க ‘நார்ப்பட்டு’ என்றும் அதன் நுட்பத்தை ‘மெல்லிய’ என்றும் வெளிப்படுத்துகிறது.
- source_word: πορφύρας
  choice: ஊதா நிறத் துணி
  rationale: சாயம், துணி அல்லது ஆடையைக் குறிக்கக்கூடிய சொல்லை இவ்வணிகப் பட்டியலில் துணியாக இயல்பாக எடுத்துரைக்கிறது.
- source_word: σιρικοῦ
  choice: பட்டுத்துணி
  rationale: கிழக்கத்திய silk அல்லது அதனால் செய்யப்பட்ட துணியை இங்கு வணிகப் பொருளாகத் தெளிவுபடுத்துகிறது.
- source_word: κοκκίνου
  choice: செந்நிறத் துணி
  rationale: கருஞ்சிவப்பு அல்லது scarlet நிறப் பொருளைக் குறிக்கும் சொல்; பட்டியல் சூழலில் துணி என வெளிப்படுத்தப்பட்டது.
- source_word: πᾶν ξύλον θύϊνον
  choice: எல்லா வகையான நறுமண மரங்கள்
  rationale: θύϊνος என்பது அடையாளம் முழுமையாக உறுதியாகாத, விலையுயர்ந்த மணமுள்ள மரவகையைக் குறிக்கிறது; குறிப்பிட்ட நவீன தாவரப் பெயரைத் திணிக்காமல் அதன் உறுதியான பண்பை மொழிபெயர்க்கிறது.
- source_word: πᾶν σκεῦος ἐλεφάντινον
  choice: எல்லா வகையான தந்தப் பொருட்கள்
  rationale: σκεῦος என்பது பாத்திரம் மட்டும் அல்லாமல் பலவகைப் பொருட்களையும் குறிக்கலாம்; ‘பொருட்கள்’ அதன் பரந்த பொருளை இயல்பாகக் காக்கிறது.
- source_word: πᾶν σκεῦος ἐκ ξύλου τιμιωτάτου
  choice: மிகவும் விலையுயர்ந்த மரத்தால் செய்யப்பட்ட எல்லா வகையான பொருட்கள்
  rationale: τιμιωτάτου என்ற உயர்படிநிலையை ‘மிகவும் விலையுயர்ந்த’ என்று இயல்பான தமிழில் வெளிப்படுத்தி, ἐκ என்பதை ‘செய்யப்பட்ட’ எனக் காட்டுகிறது.
- source_word: χαλκοῦ
  choice: வெண்கலம்
  rationale: χαλκός செம்பையோ வெண்கலத்தையோ குறிக்கலாம்; பண்டைய உலோகப் பொருட்களின் சூழலில் வெண்கலம் பொருத்தமானது.
- source_word: σιδήρου
  choice: இரும்பு
  rationale: மூலச்சொல்லின் நேரான, வழக்கமான பொருள்.
- source_word: μαρμάρου
  choice: பளிங்கு
  rationale: மார்பிள் கல்லுக்கான தெளிவான, வழக்கமான தமிழ்ச் சொல்.
