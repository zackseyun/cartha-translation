translation_notes:
  register: நவீன நிலையான தமிழில், வணிகச் சரக்குப் பட்டியலின் தொடர்ச்சியைப் பேணும் கண்ணியமான நடை. இவ்வசனம் முந்தைய வசனத்திலிருந்து தொடரும் வாக்கியத் துணுக்கு என்பதால் முடிவில் காற்புள்ளி வைக்கப்பட்டுள்ளது; ‘பொருட்கள்’ என்பது σκεῦος என்பதன் பரந்த பொருளைக் காக்கிறது.
