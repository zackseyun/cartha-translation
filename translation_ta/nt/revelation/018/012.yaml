  source_fidelity: திருத்தம் தேவை. βυσσίνου என்பது நுண்ணிய ஆளிநார்/லினன் துணியைக் குறிக்கிறது; «மெல்லிய நார்ப்பட்டு» என்பது ‘பட்டு’ என்பதால் silk-உடன் குழப்பம் ஏற்படுத்துகிறது. மேலும், ἐκ ξύλου τιμιωτάτου καὶ χαλκοῦ καὶ σιδήρου καὶ μαρμάρου என்பதில் வரிசையாகக் கூறப்படும் ஒவ்வொரு மூலப்பொருளாலும் செய்யப்பட்ட பொருட்கள் உள்ளன. தற்போதைய «மரம், வெண்கலம், இரும்பு, பளிங்கு ஆகியவற்றால் செய்யப்பட்ட» என்ற கூட்டு வடிவம் அவை அனைத்தும் கலந்து செய்யப்பட்டவை எனத் தவறாக உணர்த்தலாம்.
  naturalness: பட்டியல் நடை நவீனத் தமிழில் இயல்பாக உள்ளது. ஆனால் «நறுமண மரங்கள்» வளர்ந்த மரங்களைக் குறிக்கக்கூடும்; இங்கு வணிகச் சரக்காகிய மரப்பொருளைக் காட்ட «நறுமணமுள்ள மரம்» பொருத்தமானது. இறுதிப் பொருட்பட்டியலில் ஒவ்வொரு பொருளுக்கும் «செய்யப்பட்ட» என்பதை மீட்டுரைப்பது தெளிவையும் இயல்பையும் தருகிறது.
  terminology: «ஆளிநார் துணி» βύσσινος-ன் லினன் பொருளைத் தெளிவாகக் காக்கிறது; «பட்டுத்துணி» σιρικοῦ-க்கே ஒதுக்கப்படுகிறது. «தந்தப் பொருட்கள்», «வெண்கலம்», «பளிங்கு» ஆகியவை பொருத்தமானவை. θύϊνον-ன் துல்லியத் தாவர அடையாளம் உறுதியற்றதால் பொதுவான பண்பு அடிப்படையிலான மொழிபெயர்ப்பும் ஒலிபெயர்ப்பு அடிக்குறிப்பும் பாதுகாப்பானவை.
