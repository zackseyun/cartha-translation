source:
  edition: SBLGNT
  text: καὶ φῶς λύχνου οὐ μὴ φάνῃ ἐν σοὶ ἔτι, καὶ φωνὴ νυμφίου καὶ νύμφης οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι· ὅτι οἱ ἔμποροί σου ἦσαν οἱ μεγιστᾶνες τῆς γῆς, ὅτι ἐν τῇ φαρμακείᾳ σου ἐπλανήθησαν πάντα τὰ ἔθνη,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/023.yaml
  text: And the light of a lamp will never shine in you again[a], and the voice of bridegroom and bride will never be heard in you again; for your merchants were the great ones of the earth[b], because by your sorcery all the nations were led astray.
translation:
  language: ta
  text: விளக்கின் ஒளி இனி ஒருபோதும் உன்னில் ஒளிராது; மணமகனினதும் மணமகளினதும் குரல் இனி ஒருபோதும் உன்னில் கேட்காது. ஏனெனில், உன் வணிகர்கள் பூமியின் பெரும் பிரமுகர்களாக இருந்தார்கள்[b]; உன் சூனியத்தால்[a] எல்லா நாடுகளும் வழிதவறச் செய்யப்பட்டன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உன் மந்திரக் கலைகளால்’ அல்லது ‘உன் மாந்திரீகத்தால்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் φαρμακεία சூனியம் அல்லது மந்திரச் செயல்களால் நிகழும் ஏமாற்றத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘பூமியின் வல்லமைமிக்கவர்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் மிகுந்த முக்கியத்துவம் அல்லது அதிகாரம் பெற்றவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς λύχνου
  choice: விளக்கின் ஒளி
  rationale: கிரேக்க உரையின் இயல்பான உரிமைத் தொடர்பைப் பாதுகாக்கும், நவீன தமிழில் தெளிவான சொற்றொடர்.
- source_word: οὐ μὴ φάνῃ ... ἔτι
  choice: இனி ஒருபோதும் ... ஒளிராது
  rationale: οὐ μή என்பதன் வலியுறுத்தப்பட்ட மறுப்பையும் ἔτι குறிக்கும் முற்றுப்புள்ளியான நிறுத்தத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐν σοὶ
  choice: உன்னில்
  rationale: பாபிலோன் நகரம் ஒரு நபராக நேரடியாக அழைக்கப்படுவதைத் தக்கவைக்கிறது.
- source_word: φωνὴ νυμφίου καὶ νύμφης
  choice: மணமகன், மணமகளின் குரல்
  rationale: φωνή என்பதைக் ‘குரல்’ என்றும், திருமணச் சூழலிலுள்ள இருவரையும் சுருக்கமாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: οὐ μὴ ἀκουσθῇ ... ἔτι
  choice: இனி ஒருபோதும் ... கேட்காது
  rationale: வலியுறுத்தப்பட்ட எதிர்கால மறுப்பையும் கிரேக்கச் செயலப்பாட்டு பொருளையும் தமிழில் இயல்பாகக் கொண்டுவருகிறது.
- source_word: οἱ ἔμποροί σου
  choice: உன் வணிகர்கள்
  rationale: அத்தியாயத்தின் வாணிகச் சூழலுக்கும் ἔμποροι என்பதன் பொருளுக்கும் நேரான இணை.
- source_word: οἱ μεγιστᾶνες τῆς γῆς
  choice: பூமியின் பெரும் பிரமுகர்கள்
  rationale: அரசியல் பதவி அல்லது செல்வம் என்று அளவுக்கு மீறிக் குறுக்காமல், உயர்ந்த செல்வாக்கும் முக்கியத்துவமும் உடையவர்களைக் குறிக்கிறது.
- source_word: ἐν τῇ φαρμακείᾳ σου
  choice: உன் சூனியத்தால்
  rationale: φαρμακεία குறிக்கும் மந்திரச் செயல் அல்லது சூனியத்தை வெளிப்படுத்துகிறது; இதை நவீன மருந்துப் பயன்பாடு என்று தவறாகக் குறுக்கவில்லை.
- source_word: ἐπλανήθησαν
  choice: வழிதவறச் செய்யப்பட்டன
  rationale: πλανάω என்பதன் ‘வழிதவறச் செய்’ என்ற கருத்தையும் கிரேக்கத்தின் செயலப்பாட்டு வடிவையும் பாதுகாக்கிறது.
- source_word: πάντα τὰ ἔθνη
  choice: எல்லா நாடுகளும்
  rationale: வெளிப்படுத்தின விசேஷத்தில் உலக மக்களினங்களைக் கூட்டாகக் குறிக்கும் ἔθνη என்பதற்கான வாசிக்க எளிய தமிழ் வடிவம்.
theological_decisions:
- issue: அபோகலிப்டிக் நியாயத்தீர்ப்புச் சூழலில் φαρμακεία என்பதன் பொருள்
  choice: சூனியம்
  alternative: மந்திரக் கலைகள் / மாந்திரீகம்
  rationale: மந்திரம், சூனியம், ஏமாற்றும் மறைமுறைச் செயல்கள் ஆகிய பரப்பைச் சுட்டுகிறது; இதை மருந்துகளோடு மட்டும் இணைக்கும் நவீன வாசிப்பைத் தவிர்க்கிறது.
- issue: மீண்டும் வரும் οὐ μή வாக்கியங்களின் வலிமை
  choice: இனி ஒருபோதும் ... இல்லை/ஆது
  alternative: இனி ... இல்லை; நிச்சயமாக ... இல்லை
  rationale: பாபிலோன்மீது வரும் தீர்ப்பின் திரும்பமுடியாத இறுதித்தன்மையை இயல்பான தமிழில் வலியுறுத்துகிறது.
- issue: ἐπλανήθησαν என்பதில் செயப்படுபொருள் நிலை
  choice: வழிதவறச் செய்யப்பட்டன
  alternative: வழிதவறின / ஏமாற்றப்பட்டன
  rationale: நாடுகள் தாமாக மட்டும் வழிதவறின என்று கூறாமல், பாபிலோனின் சூனியம் அவற்றை வழிதவறச் செய்தது என்ற கிரேக்க வாக்கியத்தின் காரணத் தொடர்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வெளிப்படுத்தின விசேஷத்தின் தீர்க்கதரிசனத் தீர்ப்புத் தொனியைத் தக்கவைக்கும் கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. ‘உன்னில்’ என்ற நேரடி ஒருமை அழைப்பு நகரம் நபராக்கப்படுவதைப் பாதுகாக்கிறது. அடிக்குறி குறியீடுகள் அவை விளக்கும் சொற்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
