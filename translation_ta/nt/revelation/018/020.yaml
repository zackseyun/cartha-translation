id: REV.18.20
reference: Revelation 18:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Εὐφραίνου ἐπ’ αὐτῇ, οὐρανέ, καὶ οἱ ἅγιοι καὶ οἱ ἀπόστολοι καὶ οἱ προφῆται, ὅτι ἔκρινεν ὁ θεὸς τὸ κρίμα ὑμῶν ἐξ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/020.yaml
  text: Rejoice over her[a], O heaven, and you saints and apostles and prophets, because God has judged your judgment from her.
translation:
  language: ta
  text: வானமே, அவளைக் குறித்து மகிழ்வாயாக! பரிசுத்தவான்களே, அப்போஸ்தலர்களே, இறைவாக்கினர்களே, நீங்களும் மகிழுங்கள்! ஏனெனில், உங்களுக்காக அவளுக்கு எதிராகக் கடவுள் தீர்ப்பளித்திருக்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, பொருளைச் சற்று விளக்கி, “உங்களுக்காக அவளைத் தண்டித்திருக்கிறார்” அல்லது “அவளிடம் உங்களுக்காகப் பழிவாங்கியிருக்கிறார்.” கிரேக்கத் தொடர் சுருக்கமானது; சொல்லுக்குச் சொல், “கடவுள் அவளிடமிருந்து உங்கள் தீர்ப்பைத் தீர்த்தார்.”
    reason: கிரேக்க κρίνω/κρίμα தொடரின் சுருக்கமான, விவாதத்துக்குரிய அமைப்பையும், அதிலிருந்து வரும் சாத்தியமான விளக்க வாசிப்புகளையும் காட்டுகிறது.
lexical_decisions:
- source_word: Εὐφραίνου
  choice: மகிழ்வாயாக
  rationale: இது ஒருமை இரண்டாம் நபரை நோக்கிய கட்டளை; வானத்தை நேரடியாக அழைக்கும் உயர்ந்த நடையை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: ἐπ’ αὐτῇ
  choice: அவளைக் குறித்து
  rationale: மகிழ்ச்சிக்குரிய பொருள் அல்லது நிகழ்வை ἐπί + dative குறிக்கிறது. ‘அவளைக் குறித்து’ என்பது பாபிலோனின் வீழ்ச்சியை முன்னிட்டு மகிழ்வதைக் காட்டுகிறது; பழிவாங்கும் மகிழ்ச்சி எனத் தேவையின்றி தீவிரப்படுத்தவில்லை.
- source_word: οὐρανέ
  choice: வானமே
  rationale: ஒருமை விளிவேற்றுமையிலுள்ள நேரடி அழைப்பை இயல்பாகவும் கண்ணியமாகவும் தருகிறது.
- source_word: οἱ ἅγιοι
  choice: பரிசுத்தவான்கள்
  rationale: வெளிப்படுத்தலில் கடவுளுக்குரிய பரிசுத்த மக்களைக் குறிக்கும் நிலையான, சுருக்கமான சொல்.
- source_word: οἱ ἀπόστολοι
  choice: அப்போஸ்தலர்கள்
  rationale: இறைவாக்கினர்களுடன் சேர்ந்து வருவதால், பொதுவான ‘தூதர்கள்’ என்பதைவிட இயேசுவின் அப்போஸ்தலர்களைக் குறிக்கும் தொழில்நுட்பப் பொருள் பொருத்தமானது.
- source_word: οἱ προφῆται
  choice: இறைவாக்கினர்கள்
  rationale: προφῆται என்பதன் பொருளை நவீன நிலையான தமிழில் தெளிவாகத் தருகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: மகிழும்படி விடுக்கப்பட்ட அழைப்புக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: ἔκρινεν
  choice: வழங்கியிருக்கிறார்
  rationale: κρίνω என்பதன் நீதித்துறைச் செயலை ‘நியாயத்தீர்ப்பு’ என்ற பெயர்ச்சொல்லோடு இயல்பான தமிழில் வெளிப்படுத்துகிறது; முடிவுற்ற தெய்வீகச் செயலின் தற்போதைய விளைவையும் உணர்த்துகிறது.
- source_word: τὸ κρίμα ὑμῶν
  choice: உங்களுக்குரிய நியாயத்தீர்ப்பை
  rationale: சுருக்கமாக அமைந்துள்ள கிரேக்கத் தொடரில் தீர்ப்பு அவர்களைச் சார்ந்தது என்பதைப் பாதுகாக்கிறது; ‘உங்களைப் பழிவாங்கினார்’ என்று விளக்கி முடிவுசெய்யவில்லை.
- source_word: ἐξ αὐτῆς
  choice: அவளிடமிருந்து
  rationale: ἐξ என்பதன் அடிப்படைத் திசைப் பொருளைக் காத்து, கடினமான கிரேக்கத் தொடரின் சுருக்கத்தையும் உண்மையான தெளிவின்மையையும் பிரதான உரையில் விடுகிறது.
theological_decisions:
- issue: பரிசுத்த மக்களின் சார்பில் பாபிலோனுக்கு எதிராகக் கடவுள் செய்த நீதித்துறைச் செயலை எவ்வளவு வெளிப்படையாக விளக்குவது
  choice: ‘உங்களுக்குரிய நியாயத்தீர்ப்பை அவளிடமிருந்து கடவுள் வழங்கியிருக்கிறார்’ என்ற சுருக்கமான நீதித்துறை மொழியைத் தக்கவைத்தல்
  alternative: ‘உங்களுக்காக அவளைத் தண்டித்திருக்கிறார்’ அல்லது ‘அவளிடம் உங்களுக்காகப் பழிவாங்கியிருக்கிறார்’
  rationale: மூலத்தில் பழிவாங்குதலை நேரடியாகக் குறிக்கும் வினைச்சொல் இல்லாமல் κρίνω/κρίμα என்ற ஒரே சொல்லினத்தைச் சேர்ந்த நீதித்துறைச் சொற்கள் உள்ளன. ஆகவே நியாயப்படுத்துதல் அல்லது பழிவாங்குதல் என்ற சாத்தியமான உட்பொருளை பிரதான உரையில் முழுமையாகத் தீர்மானிக்காமல், அடிக்குறிப்பில் விளக்குவது மூலத்தின் இறுக்கத்தையும் இறையியல் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘வானமே’ மற்றும் ‘மகிழ்வாயாக’ என்பவை நேரடி அழைப்பின் உயர்ந்த நடையைக் காக்கின்றன. பட்டியலிலுள்ள மனிதக் குழுக்களுக்கு ‘நீங்களும் மகிழுங்கள்’ என வினை வெளிப்படையாக மீண்டும் தரப்பட்டிருப்பது தமிழில் அழைப்பைத் தெளிவாக்குகிறது. கடினமான இறுதி கிரேக்கத் தொடர் பிரதான உரையில் திட்டமிட்டு சுருக்கமாக வைக்கப்பட்டு, விளக்கமான வாசிப்புகள் அடிக்குறிப்பில் வழங்கப்பட்டுள்ளன.
