  to: வானமே, அவளைக் குறித்து மகிழ்வாயாக! பரிசுத்தவான்களே, அப்போஸ்தலர்களே, இறைவாக்கினர்களே, நீங்களும் மகிழுங்கள்! ஏனெனில், உங்களுக்காக அவளுக்கு எதிராகக் கடவுள் தீர்ப்பளித்திருக்கிறார்.[a]
