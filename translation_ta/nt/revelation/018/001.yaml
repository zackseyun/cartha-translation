id: REV.18.1
reference: Revelation 18:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον ἄλλον ἄγγελον καταβαίνοντα ἐκ τοῦ οὐρανοῦ, ἔχοντα ἐξουσίαν μεγάλην, καὶ ἡ γῆ ἐφωτίσθη ἐκ τῆς δόξης αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/001.yaml
  text: After these things I saw another angel coming down out of heaven[a], having great authority[b], and the earth was illuminated by his glory.
translation:
  language: ta
  text: இவற்றுக்குப் பிறகு, மிகுந்த அதிகாரம் கொண்ட, பரலோகத்திலிருந்து இறங்கிக்கொண்டிருந்த வேறொரு தூதனை நான் கண்டேன்[a]. அவனுடைய மகிமையால் பூமி ஒளியூட்டப்பட்டது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரலோகத்திலிருந்து இறங்கி வந்த.”
    reason: lexical_alternative
  - marker: b
    text: மேலும் நேரடியாக, “அவனுடைய மகிமையிலிருந்து பூமி ஒளியூட்டப்பட்டது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: இவற்றுக்குப் பிறகு
  rationale: தரிசனங்களின் தொடர்ச்சியைக் குறிக்கும் வழக்கமான காலத் தொடர். ταῦτα என்பதன் பன்மையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: εἶδον
  choice: நான் கண்டேன்
  rationale: அடுத்த தரிசனக் காட்சியை அறிமுகப்படுத்தும் எளிய இறந்தகால வினை; மூலத்தில் இல்லாத கூடுதல் நுணுக்கத்தைச் சேர்க்கவில்லை.
- source_word: ἄλλον ἄγγελον
  choice: வேறொரு தூதனை
  rationale: தரிசனத் தொடரில் இன்னொரு தூதனைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: பரலோகத்திலிருந்து இறங்கி வந்துகொண்டிருந்த
  rationale: καταβαίνοντα என்ற நிகழ்காலப் பங்கேற்புவினை, யோவான் கண்டபோது நடைபெற்றுக்கொண்டிருந்த செயலைக் காட்டுகிறது; ἐκ என்பதன் மூலப்பொருளை ‘பரலோகத்திலிருந்து’ வெளிப்படுத்துகிறது.
- source_word: ἔχοντα ἐξουσίαν μεγάλην
  choice: மிகுந்த அதிகாரம் கொண்டிருந்தான்
  rationale: ἐξουσία என்பது வெறும் வலிமையைவிட அதிகாரம் அல்லது உரிமையைக் குறிக்கிறது. தமிழ் வாக்கிய ஓட்டத்திற்காக பங்கேற்புவினை தனி உடன்பாட்டு வாக்கியமாக வழங்கப்பட்டுள்ளது.
- source_word: ἡ γῆ
  choice: பூமி
  rationale: இங்குள்ள ஒளியூட்டும் காட்சி உள்ளூர் நிலப்பகுதியைவிட பரந்த உலகளாவிய பொருளைச் சுட்டுவதால் ‘பூமி’ பொருத்தமானது.
- source_word: ἐφωτίσθη
  choice: ஒளியூட்டப்பட்டது
  rationale: φωτίζω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவத்தைக் காக்கிறது; காட்சியின் மேன்மைக்கும் ஏற்ற dignified Tamil expression.
- source_word: ἐκ τῆς δόξης αὐτοῦ
  choice: அவனுடைய மகிமையால்
  rationale: ἐκ இங்கு ஒளியின் மூலம் அல்லது காரணத்தைக் குறிக்கிறது. ‘மகிமையால்’ என்பது தமிழில் இயல்பாக அதைக் கூறுகிறது; அதிக நேரடியான வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: தூதனுடைய ஒளிவீச்சும் அதிகாரமும்
  choice: தூதனுக்கு மிகுந்த அதிகாரமும் ‘அவனுடைய மகிமை’ என்றும் உரை கூறுவதைச் சுருக்காமல் அப்படியே காக்கிறது; ஆனால் அவனைத் தெய்வீகமானவர் என்று மொழிபெயர்ப்பு அடையாளப்படுத்தவில்லை.
  alternative: பூமியே அவனுடைய மகிமையால் ஒளியூட்டப்படுவதால், தூதனுடைய மகிமையை மிக உயர்ந்த பொருளில் வாசிக்கலாம்.
  rationale: கிரேக்க உரை தூதனுக்கு அதிகாரத்தையும் மகிமையையும் வெளிப்படையாகக் கூறுகிறது; எனினும் அவன் தெய்வீகமானவன் என்று சொல்லவில்லை. ஆகவே உரையின் உயர்ந்த காட்சியையும் இறையியல் பதற்றத்தையும் தீர்த்துவிடாமல் மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வெளிப்படுத்தல் நூலின் காட்சிசார் மேன்மையைத் தக்கவைக்கும் கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. நீண்ட கிரேக்கப் பங்கேற்புவினை அமைப்பு தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டது.
