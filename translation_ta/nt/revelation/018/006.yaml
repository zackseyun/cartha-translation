revisions:
- from: அவள் எப்படித் திருப்பிக் கொடுத்தாளோ, அப்படியே அவளுக்குத் திருப்பிக் கொடுங்கள்; அவளுடைய செயல்களுக்கு ஏற்ப அவளுக்கு இரட்டிப்பாகத் திருப்பிக் கொடுங்கள்.[a] அவள் கலந்து வைத்த கிண்ணத்திலேயே[b] அவளுக்காக இரட்டிப்பாகக் கலந்து கொடுங்கள்.
  to: அவள் தானே திருப்பிச் செலுத்தியதுபோல, அவளுக்கும் திருப்பிச் செலுத்துங்கள்; அவளுடைய செயல்களுக்கு ஏற்ப அவளுக்கு இரட்டிப்பாகச் செலுத்துங்கள்.[a] அவள் கலந்து வைத்த கிண்ணத்தில்[b] அவளுக்காக இரட்டிப்பு அளவு கலக்குங்கள்.
  rationale: The revision explicitly conveys the emphatic "she herself," keeps the judicial sense of ἀποδίδωμι through repeated "திருப்பிச் செலுத்துங்கள்," and renders the final κεράσατε as mixing a double measure rather than supplying an additional act of giving. The alternative-rendering note retains the Greek expression's compressed, rhetorically intensified ambiguity.
