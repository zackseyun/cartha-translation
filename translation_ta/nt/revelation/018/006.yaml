reference: Revelation 18:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀπόδοτε αὐτῇ ὡς καὶ αὐτὴ ἀπέδωκεν, καὶ ⸀διπλώσατε ⸀τὰ διπλᾶ κατὰ τὰ ἔργα αὐτῆς· ἐν τῷ ποτηρίῳ ᾧ ἐκέρασεν κεράσατε αὐτῇ διπλοῦν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/006.yaml
  text: Pay her back as she herself has paid back[a], and repay her double according to her works; in the cup that she mixed[b], mix a double portion for her.
translation:
  language: ta
  text: அவள் தானே திருப்பிச் செலுத்தியதுபோல, அவளுக்கும் திருப்பிச் செலுத்துங்கள்; அவளுடைய செயல்களுக்கு ஏற்ப அவளுக்கு இரட்டிப்பாகச் செலுத்துங்கள்.[a] அவள் கலந்து வைத்த கிண்ணத்தில்[b] அவளுக்காக இரட்டிப்பு அளவு கலக்குங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவளுக்கான இரட்டிப்பானவற்றை இரட்டிப்பாக்குங்கள்.” கிரேக்கச் சொற்றொடர் சுருக்கமாகவும் வலிமையாகவும் உள்ளது; அது தீவிரப்படுத்தப்பட்ட கைம்மாற்றை வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, அவள் பானத்தைக் கலந்து ஆயத்தப்படுத்திய கிண்ணம்; இந்தப் படிமம் ஆயத்தப்படுத்தப்பட்ட தீர்ப்புப் பானத்தைக் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπόδοτε
  choice: திருப்பிக் கொடுங்கள்
  rationale: பதிலளிக்கும் அல்லது தண்டனையாகத் திருப்பிச் செலுத்தும் பொருளைத் தக்கவைக்கிறது; நவீன தமிழிலும் இயல்பாக உள்ளது.
- source_word: ὡς καὶ αὐτὴ ἀπέδωκεν
  choice: அவள் எப்படித் திருப்பிக் கொடுத்தாளோ, அப்படியே
  rationale: αὐτή என்பதிலுள்ள அவள் தானே செய்தாள் என்ற வலியுறுத்தலையும், அவளுடைய முந்தைய செயலே இத்தீர்ப்பின் அளவுகோல் என்பதையும் வெளிப்படுத்துகிறது.
- source_word: διπλώσατε τὰ διπλᾶ
  choice: அவளுக்கு இரட்டிப்பாகத் திருப்பிக் கொடுங்கள்
  rationale: கிரேக்கத்தின் சுருக்கமான, வலிமையான இரட்டிப்பு மொழியை வாசிக்க இயல்பான தமிழில் தருகிறது; அதன் சொல்லாட்சிசார் தீவிரத்தை அடிக்குறிப்பு சுட்டுகிறது.
- source_word: κατὰ τὰ ἔργα αὐτῆς
  choice: அவளுடைய செயல்களுக்கு ஏற்ப
  rationale: ἔργα என்பதன் செயல்கள்/செய்கைகள் என்ற நீதித்தீர்ப்புச் சார்ந்த பொருளையும், அதற்கேற்ற கைம்மாறு என்ற அளவையும் காக்கிறது.
- source_word: ποτηρίῳ
  choice: கிண்ணம்
  rationale: வெளிப்படுத்தின விசேஷத்திலும் தீர்க்கதரிசன இலக்கியத்திலும் வரும் குறியீட்டுப் பாத்திரப் படிமத்தைத் தக்கவைக்கும் இயல்பான தமிழ் சொல்.
- source_word: ἐκέρασεν
  choice: கலந்து வைத்த
  rationale: குடிப்பதற்கான பானத்தை கலந்து ஆயத்தப்படுத்துதல் என்ற κεράννυμι வினையின் படிமத்தைத் தக்கவைக்கிறது.
- source_word: κεράσατε αὐτῇ διπλοῦν
  choice: அவளுக்காக இரட்டிப்பாகக் கலந்து கொடுங்கள்
  rationale: முந்தைய 'கலத்தல்' படிமத்தை மீண்டும் வெளிப்படுத்தி, தண்டனையின் இரட்டிப்பு அளவையும் இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: இரட்டிப்பான கைம்மாறு கட்டளையின் தன்மை
  choice: குறியீட்டு நீதித்தீர்ப்பாகவும் தீவிரப்படுத்தப்பட்ட கைம்மாறாகவும் மொழிபெயர்த்தல்; அதன் கடுமையைத் தணிக்காமல், அதை ஒரு கண்டிப்பான கணித அளவாகவும் நிர்ணயிக்காமல் இருத்தல்.
  alternative: ‘இரட்டிப்பு’ என்பதைத் துல்லியமான அளவியல் தண்டனையாக எடுத்தல், அல்லது இரட்டிப்பு படிமத்தை நீக்கி பொதுவான நீதி எனப் பொழிப்புரை செய்தல்.
  rationale: வெளிப்படுத்தின விசேஷத்தின் பேரழிவுத் தீர்ப்பு மொழியில் பாபிலோனுக்கு அவளுடைய செயல்களுக்கு ஏற்ற, தீவிரமான கைம்மாறு சித்தரிக்கப்படுகிறது. மொழிபெயர்ப்பு இரட்டிப்பும் தீர்ப்புக் கிண்ணமும் ஆகிய படிமங்களைத் தக்கவைத்து, அது கணிதரீதியானதா அல்லது சொல்லாட்சிசார் வலியுறுத்தலா என்பதைத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியக்கூடியதுமான நடை. ‘திருப்பிக் கொடுங்கள்’ என்ற மீளுருவாக்கம் மூலத்தின் ἀποδίδωμι தொடர்பை வெளிப்படுத்துகிறது; ‘கலந்து வைத்த / கலந்து கொடுங்கள்’ என்பது மூலத்திலுள்ள ஒரே வினைவேர் சார்ந்த படிமத்தைப் பாதுகாக்கிறது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் சேர்க்கப்பட்டுள்ளன.
