review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the commands, the doubled-recompense imagery, the measure "according to her works," and the repeated mixing/cup image. However, its opening clause does not clearly express the emphatic αὐτή ("she herself"). The final command is better rendered without adding "give" (கொடுங்கள்), since κεράσατε specifically commands mixing/preparing a double measure for her.
  naturalness: The Tamil is generally clear and suitably dignified. "திருப்பிச் செலுத்துங்கள்" gives the judicial recompense sense more naturally and precisely than the more general "திருப்பிக் கொடுங்கள்" here. "இரட்டிப்பு அளவு கலக்குங்கள்" is idiomatic and retains the concrete cup imagery.
  terminology: '"கிண்ணம்," "செயல்கள்," and "தீர்ப்பு" are appropriate in modern standard Tamil. The revised wording preserves the repeated recompense and mixing motifs without imposing an interpretation of the precise mathematical force of the doubling.'
  issues:
  - severity: medium
    issue: The emphatic αὐτή is not explicitly represented in the first clause.
    rationale: '"அவள் எப்படித் ..." identifies the subject but does not communicate the source''s stress, "she herself." Adding "அவள் தானே" preserves this emphasis.'
  - severity: low
    issue: The final phrase adds a giving action not stated in the Greek.
    rationale: '"கலந்து கொடுங்கள்" is understandable, but κεράσατε means "mix/prepare." "இரட்டிப்பு அளவு கலக்குங்கள்" more closely preserves the imperative and the cup image.'
  revised_text: அவள் தானே திருப்பிச் செலுத்தியதுபோல, அவளுக்கும் திருப்பிச் செலுத்துங்கள்; அவளுடைய செயல்களுக்கு ஏற்ப அவளுக்கு இரட்டிப்பாகச் செலுத்துங்கள்.[a] அவள் கலந்து வைத்த கிண்ணத்தில்[b] அவளுக்காக இரட்டிப்பு அளவு கலக்குங்கள்.
