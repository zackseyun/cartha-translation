id: REV.18.19
reference: Revelation 18:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἔβαλον χοῦν ἐπὶ τὰς κεφαλὰς αὐτῶν καὶ ⸀ἔκραξαν κλαίοντες καὶ ⸀πενθοῦντες λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, ἐν ᾗ ἐπλούτησαν πάντες οἱ ἔχοντες τὰ πλοῖα ἐν τῇ θαλάσσῃ ἐκ τῆς τιμιότητος αὐτῆς, ὅτι μιᾷ ὥρᾳ ἠρημώθη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/019.yaml
  text: And they threw dust on their heads and cried out[a], weeping and mourning, saying, “Woe, woe, the great city, in which all who had ships on the sea became rich from her wealth[b], because in one hour she has been laid waste.”
translation:
  language: ta
  text: 'அவர்கள் தங்கள் தலைகள்மேல் புழுதியைப் போட்டார்கள்; அழுதும் புலம்பியும் உரக்கக் கூக்குரலிட்டுச் சொன்னார்கள்: “ஐயோ! ஐயோ![a] மாபெரும் நகரமே! உன்னில், கடலில் கப்பல்களைக் கொண்டிருந்த அனைவரும் உன் விலையுயர்ந்த செழுமையால்[b] செல்வந்தர்களானார்களே! ஒரே மணி நேரத்தில் நீ பாழாக்கப்பட்டாயே!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அந்தோ! அந்தோ!” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் துயரப் புலம்பலையும் நியாயத்தீர்ப்பின் கனத்தையும் வெளிப்படுத்தக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “உன் விலையுயர்ந்த ஆடம்பரத்தால்” அல்லது “உன் மகத்துவத்தால்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் விலைமதிப்பு, ஒளிவளம் அல்லது செழுமையைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλον χοῦν ἐπὶ τὰς κεφαλὰς αὐτῶν
  choice: தங்கள் தலைகள்மேல் புழுதியை வாரிப் போட்டுக்கொண்டு
  rationale: துக்கத்தின் அடையாளமாகத் தலைமீது புழுதி போடும் மூலப்படிமத்தை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: ἔκραξαν κλαίοντες καὶ πενθοῦντες
  choice: அழுது புலம்பியபடி உரக்கக் கூக்குரலிட்டுச் சொன்னார்கள்
  rationale: ἔκραξαν என்பதன் உரத்த அழைப்பையும், κλαίοντες மற்றும் πενθοῦντες குறிக்கும் அழுகை–துக்கப் புலம்பல் என்ற தொடர்புடைய இரு செயல்களையும் வேறுபடுத்திக் காட்டுகிறது.
- source_word: Οὐαὶ οὐαί
  choice: ஐயோ! ஐயோ!
  rationale: துக்கக் கூக்குரலாக இயல்பாக ஒலிக்கிறது; மீளுரைப்பின் தீவிரத்தையும் நியாயத்தீர்ப்புச் சூழலின் கனத்தையும் காக்கிறது.
- source_word: ἡ πόλις ἡ μεγάλη
  choice: மாபெரும் நகரமே
  rationale: விளிப்புத் தொடரைச் செறிவாகவும் கண்ணியமான தமிழிலும் தருகிறது.
- source_word: ἐν ᾗ
  choice: உன்னில்
  rationale: மூலத்தின் இடப்பொருள் சார்ந்த உறவைத் தெளிவாக வைத்திருக்கிறது; அதை முழுமையாகக் கருவிப்பொருளாக மாற்றவில்லை.
- source_word: οἱ ἔχοντες τὰ πλοῖα ἐν τῇ θαλάσσῃ
  choice: கடலில் கப்பல்களைக் கொண்டிருந்த அனைவரும்
  rationale: ἔχοντες என்பதை கட்டாயமாகச் சட்டபூர்வ உரிமை என மிகைப்படுத்தாமல், கப்பல்களைக் கொண்டிருந்தவர்கள் என்று இயல்பாக மொழிபெயர்க்கிறது.
- source_word: ἐκ τῆς τιμιότητος αὐτῆς
  choice: உன் விலையுயர்ந்த செழுமையால்
  rationale: τιμιότης என்பதிலுள்ள விலைமதிப்பு, ஆடம்பரம், மகத்துவம், பொருளாதார வளம் ஆகிய நிழற்பொருள்களை ‘விலையுயர்ந்த செழுமை’ ஒருங்கிணைக்கிறது.
- source_word: ὅτι μιᾷ ὥρᾳ ἠρημώθη
  choice: ஒரே மணி நேரத்தில் நீ பாழாக்கப்பட்டாயே
  rationale: அழிவின் திடீர்தன்மையையும் வினையின் செயப்பாட்டு வடிவத்தையும், புலம்பலுக்குரிய தமிழ் இறுதியுடன் காக்கிறது.
theological_decisions:
- issue: அபோகலிப்திய நியாயத்தீர்ப்புச் சூழலில் Οὐαὶ οὐαί என்ற புலம்பல் வாய்பாட்டை மொழிபெயர்த்தல்
  choice: ஐயோ! ஐயோ!
  alternative: அந்தோ! அந்தோ! / கேடு! கேடு!
  rationale: ‘ஐயோ’ என்பது நவீனத் தமிழில் உண்மையான துயரக் கூக்குரலாக விளங்குகிறது; இருமுறை கூறப்படுவதும் சுற்றியுள்ள அழிவுச் செய்தியும் தீர்ப்பின் கனத்தைத் தக்கவைக்கின்றன. ‘கேடு’ என்பது புலம்பலை முன்னறிவிப்பாக மட்டும் மாற்றிவிடக்கூடும்.
- issue: ἐν ᾗ என்பதன் இடப்பொருள்–கருவிப்பொருள் பதற்றம்
  choice: உன்னில்
  alternative: உன்னால் / உன் மூலமாக
  rationale: மூலத்தில் வெளிப்படையாக உள்ள ἐν என்ற இடப்பொருளை காக்கிறது; பின்னுள்ள ‘உன் விலையுயர்ந்த செழுமையால்’ என்ற தொடர் செல்வந்தரான வழிமுறையைத் தனியே தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான அபோகலிப்திய புலம்பல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘உன்னில்’ என்ற வடிவம் மூலத்தின் உறவை வெளிப்படையாகக் காக்கிறது; விளிப்பின் உணர்வைத் தொடர ‘உன்/நீ’ என்ற இரண்டாம் நபர் வடிவங்கள் இயல்பாகப் பயன்படுத்தப்பட்டுள்ளன.
