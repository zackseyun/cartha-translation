  to: 'அவர்கள் தங்கள் தலைகள்மேல் புழுதியைப் போட்டார்கள்; அழுதும் புலம்பியும் உரக்கக் கூக்குரலிட்டுச் சொன்னார்கள்: “ஐயோ! ஐயோ![a] மாபெரும் நகரமே! உன்னில், கடலில் கப்பல்களைக் கொண்டிருந்த அனைவரும் உன் விலையுயர்ந்த செழுமையால்[b] செல்வந்தர்களானார்களே! ஒரே மணி நேரத்தில் நீ பாழாக்கப்பட்டாயே!”'
  rationale: The revision makes the completed dust-throwing action explicit without adding the potentially excessive nuance of “வாரி.” It retains the source order and the simultaneous sense of weeping and mourning during the cry. The second footnote has been made semantically more neutral while preserving the stated alternatives for τιμιότης.
