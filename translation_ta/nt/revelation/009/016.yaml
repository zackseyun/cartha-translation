  source_fidelity: 'The main text accurately conveys ἀριθμός, the military collective denoted by στρατευμάτων τοῦ ἱππικοῦ, the computed total of 200,000,000, and John''s statement that he heard the number. “குதிரைப்படை வீரர்கள்” is a clear, contextually appropriate Tamil expression for the cavalry troops. The footnote, however, should represent the Greek construction more directly: δισμυριάδες μυριάδων is literally “two myriads of myriads,” rather than an idiomatic phrase of “twice ten thousand times ten thousand.”'
