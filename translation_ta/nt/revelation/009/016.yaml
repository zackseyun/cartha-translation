  - marker: a
    text: கிரேக்கத்தில் சொற்படியாக, “பதினாயிரங்களின் இரண்டு பதினாயிரங்கள்”; அதாவது, இருபது கோடி.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀριθμὸς
  choice: எண்ணிக்கை
  rationale: ‘எண்ணிக்கை, மொத்தம்’ என்ற இயல்பான பொருளைத் தருகிறது; கிரேக்கத்தில் வரும் மறுபயன்பாட்டையும் தமிழில் காக்கிறது.
- source_word: στρατευμάτων τοῦ ἱππικοῦ
  choice: குதிரைப்படை வீரர்கள்
  rationale: இந்தச் சொற்றொடர் குதிரைகளில் போரிடும் படைப்பிரிவுகளைக் குறிக்கிறது. இயல்பான நவீன தமிழில் ‘குதிரைப்படை வீரர்கள்’ என்பது இராணுவப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: δισμυριάδες μυριάδων
  choice: இருபது கோடி
  rationale: இரண்டு மடங்கு பதினாயிரம் முறை பதினாயிரம் என்பது 200,000,000; தமிழில் அதன் வழக்கமான எண்ணுப்பெயர் ‘இருபது கோடி’. மூலத்தின் சொற்படையான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἤκουσα
  choice: நான் கேட்டேன்
  rationale: எளிய இறந்தகால நிகழ்வைக் குறிக்கும் நேரடியான, இயல்பான மொழிபெயர்ப்பு.
- source_word: αὐτῶν
  choice: அவர்களுடைய
  rationale: முன்னர் குறிப்பிடப்பட்ட குதிரைப்படை வீரர்களைக் குறிக்கும் பன்மை உரிமை வடிவம்.
