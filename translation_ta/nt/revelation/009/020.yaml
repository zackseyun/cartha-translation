source:
  edition: SBLGNT
  text: Καὶ οἱ λοιποὶ τῶν ἀνθρώπων, οἳ οὐκ ἀπεκτάνθησαν ἐν ταῖς πληγαῖς ταύταις, ⸀οὐδὲ μετενόησαν ἐκ τῶν ἔργων τῶν χειρῶν αὐτῶν, ἵνα μὴ ⸀προσκυνήσουσιν τὰ δαιμόνια καὶ τὰ εἴδωλα τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ καὶ τὰ χαλκᾶ καὶ τὰ λίθινα καὶ τὰ ξύλινα, ἃ οὔτε βλέπειν ⸀δύνανται οὔτε ἀκούειν οὔτε περιπατεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/020.yaml
  text: And the rest of humanity[a], who were not killed by these plagues, did not even repent of the works of their hands, so as not to worship demons and the idols of gold and silver and bronze and stone and wood[c][b], which can neither see nor hear nor walk.
translation:
  language: ta
  text: இந்த வாதைகளால் கொல்லப்படாத மீதமிருந்த மனிதர்கள்[a], தீய ஆவிகளையும், பார்க்கவோ கேட்கவோ நடக்கவோ இயலாத பொன், வெள்ளி, வெண்கலம், கல், மரம் ஆகியவற்றால் செய்யப்பட்ட சிலைகளையும் வணங்காதிருக்கும்படி[c], தங்கள் கைகளின் செயல்களிலிருந்து மனந்திரும்பவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மீதமிருந்த மனிதர்கள்’ என்பது ஆண்களை மட்டும் அல்ல, உயிரோடிருந்த மற்ற எல்லா மனிதர்களையும் குறிக்கும் பொதுவான சொற்றொடர்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘தங்கள் கைகளின் செயல்களிலிருந்து மனந்திரும்பவில்லை.’ இங்கு அந்தச் சொற்றொடர், குறிப்பாக அவர்கள் செய்து வழிபட்ட சிலைகளைக் குறிக்கிறது.'
    reason: lexical_alternative
  - marker: c
    text: ‘அவர்கள் வணங்காதிருப்பதற்காக’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத் தொடர் நோக்கத்தையோ எதிர்பார்க்கப்பட்ட விளைவையோ குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ λοιποὶ τῶν ἀνθρώπων
  choice: மற்ற மனிதர்களும்
  rationale: λοιποί என்பதன் ‘மீதியானவர்கள்/மற்றவர்கள்’ என்ற பொருளையும், ἀνθρώπων என்பதன் பாலினம் சாராத பொதுவான மனிதக் குறிப்பையும் இயல்பான நவீனத் தமிழில் தருகிறது. οὐδέ-யின் தொடர்ச்சிப் பொருளை ‘-உம்’ சுட்டுகிறது.
- source_word: ἀπεκτάνθησαν
  choice: கொல்லப்படாத
  rationale: ἀποκτείνω என்ற வினையின் இறந்தகாலச் செயப்பாட்டு வடிவத்தை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: πληγαῖς
  choice: வாதைகளால்
  rationale: வெளிப்படுத்தின விசேஷத்தின் நியாயத்தீர்ப்பு சார்ந்த சூழலில் πληγή என்பது பேரிடர் போன்ற தெய்வீகத் தண்டனை வாதைகளைக் குறிக்கிறது; ‘வாதைகள்’ தமிழ்ப் பைபிள் நடையில் அறிந்ததும் புரியத்தக்கதும் ஆகும்.
- source_word: οὐδὲ μετενόησαν
  choice: மனந்திரும்பவில்லை
  rationale: μετανοέω-வின் மனமும் நடத்தையும் மாற்றித் திரும்புதல் என்ற வேதாகமப் பொருளை ‘மனந்திரும்புதல்’ தெளிவாகத் தருகிறது; முன் கூறியவர்களோடு தொடரும் மறுப்பை எழுவாயின் ‘-உம்’ தாங்குகிறது.
- source_word: ἐκ τῶν ἔργων τῶν χειρῶν αὐτῶν
  choice: தங்கள் கைகளின் செயல்களைவிட்டு
  rationale: ἐκ என்பதன் விலகுதலை ‘-விட்டு’ காக்கிறது; ‘கைகளின் செயல்கள்’ என்ற உருவகத்தையும் அடுத்துவரும் மனிதனால் செய்யப்பட்ட சிலைகளுடனான தொடர்பையும் பாதுகாக்கிறது.
- source_word: ἵνα μὴ προσκυνήσουσιν
  choice: வணங்காதிருக்கும்படி
  rationale: ἵνα μή கூறும் நோக்கம் அல்லது எதிர்பார்க்கப்பட்ட விளைவு என்ற நுணுக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; மனந்திரும்புதல் விக்கிரக வழிபாட்டிலிருந்து விலகுதலை உட்படுத்துவதாக வாக்கியத் தொடர்பைக் காக்கிறது.
- source_word: τὰ δαιμόνια
  choice: பேய்களை
  rationale: புதிய ஏற்பாட்டில் δαιμόνια குறிக்கும் தீய ஆவிக்குரிய உயிர்களுக்கு பொதுவாகவும் தெளிவாகவும் புரியும் தமிழ்ச் சொல்.
- source_word: τὰ εἴδωλα
  choice: சிலைகளை
  rationale: இங்கு வழிபாட்டுக்குரிய உருவங்களைக் குறிக்கும் εἴδωλα-வின் பொருளைச் சூழல் தெளிவாக்குவதால் ‘சிலைகள்’ இயல்பானது; வணங்குதல் என்ற வினை அதன் விக்கிரகத் தன்மையை வெளிப்படுத்துகிறது.
- source_word: τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ καὶ τὰ χαλκᾶ καὶ τὰ λίθινα καὶ τὰ ξύλινα
  choice: பொன், வெள்ளி, வெண்கலம், கல், மரம் ஆகியவற்றால் செய்யப்பட்ட
  rationale: சிலைகள் செய்யப்பட்ட பொருட்களின் தொடர் பட்டியலைத் தெளிவான தமிழில் காக்கிறது; மீளும் καί-யின் சேர்த்துக் குவிக்கும் தாக்கம் பட்டியலில் நிலைக்கிறது.
- source_word: ἃ οὔτε βλέπειν δύνανται οὔτε ἀκούειν οὔτε περιπατεῖν
  choice: பார்க்கவோ கேட்கவோ நடக்கவோ இயலாத
  rationale: சிலைகளின் இயலாமையை ஏளனமாகச் சுட்டும் மூன்று வினைகளையும் அவற்றின் வரிசையையும் காக்கிறது; περιπατεῖν என்பதற்கு நேரான ‘நடக்க’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: ἀνθρώπων என்பதன் பொதுவான மனிதக் குறிப்பு
  choice: மனிதர்கள்
  alternative: மனுக்குலத்தில் மீதியானவர்கள்
  rationale: இச்சொல் ஆண்களை மட்டும் அல்ல, மனிதர்களைப் பொதுவாகக் குறிக்கிறது. ‘மனிதர்கள்’ இந்த வரம்பைத் தெளிவாகக் காக்கிறது.
- issue: மனந்திரும்புதலுக்கும் சிலை வழிபாட்டை நிறுத்துவதற்கும் உள்ள ἵνα μή உறவு
  choice: வணங்காதிருக்கும்படி
  alternative: வணங்குவதை நிறுத்தும் விளைவாக
  rationale: கிரேக்கத் தொடர் நோக்கத்தையோ எதிர்பார்க்கப்பட்ட விளைவையோ குறிக்கக்கூடும். முதன்மை உரை நோக்க நுணுக்கத்தை இயல்பாகத் தருகிறது; அடிக்குறிப்பு மற்ற சாத்தியத்தைத் திறந்துவைக்கிறது.
- issue: ‘கைகளின் செயல்கள்’ என்பதன் பரப்பு
  choice: உருவகத்தை அப்படியே காத்தல்
  alternative: தாங்கள் செய்த சிலைகளிலிருந்து மனந்திரும்புதல்
  rationale: சூழல் குறிப்பாக மனிதனால் செய்யப்பட்ட சிலைகளை நோக்கினாலும், கிரேக்கச் சொற்றொடர் சற்றுப் பரந்த ‘செயல்கள்’ என்ற சொல்லைப் பயன்படுத்துகிறது. முதன்மை உரை அந்தப் பரப்பையும் உருவகத்தையும் குறுக்காமல் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுமக்களுக்கு விளங்கும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘மனந்திரும்புதல்’, ‘வாதைகள்’ போன்ற பரவலாக அறியப்பட்ட சொற்கள் தக்கவைக்கப்பட்டுள்ளன; மிகப் பழமையான ‘கிரியைகள்’, ‘விக்கிரகங்கள்’ என்பவற்றுக்கு மாற்றாக இயல்பான ‘செயல்கள்’, ‘சிலைகள்’ பயன்படுத்தப்பட்டுள்ளன. கிரேக்க வாக்கியத்தின் நோக்கம்/விளைவு தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
