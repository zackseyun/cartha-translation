  text: ἀπὸ τῶν τριῶν πληγῶν τούτων ἀπεκτάνθησαν τὸ τρίτον τῶν ἀνθρώπων, ⸀ἐκ τοῦ πυρὸς καὶ τοῦ καπνοῦ καὶ τοῦ θείου τοῦ ἐκπορευομένου ἐκ τῶν στομάτων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/018.yaml
  text: By these three plagues a third of mankind was killed—by the fire and the smoke and the sulfur coming out of their mouths[a][b].
translation:
  language: ta
  text: இந்த மூன்று வாதைகளால் மனிதர்களில் மூன்றில் ஒரு பகுதியினர்[a] கொல்லப்பட்டார்கள்—அதாவது, அந்தக் குதிரைகளின் வாய்களிலிருந்து வெளிவரும் நெருப்பாலும் புகையாலும் கந்தகத்தாலும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கச் சொல் ஆண்களை மட்டும் குறிக்காமல், மனிதர்களைப் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: பாரம்பரியமாக, “எரிகந்தகம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ
  choice: …ஆல்
  rationale: இங்கு ἀπό இடத்திலிருந்து பிரிவதை அல்ல, மரணத்திற்கான காரணம் அல்லது கருவியைச் சுட்டுகிறது; தமிழில் கருவிப்பொருளைத் தெரிவிக்கும் ‘…ஆல்’ இயல்பானது.
- source_word: τῶν τριῶν πληγῶν τούτων
  choice: இந்த மூன்று வாதைகளால்
  rationale: τούτων என்பதன் சுட்டுப்பொருளை ‘இந்த’ பாதுகாக்கிறது. வெளிப்படுத்தின விசேஷத்தின் நியாயத்தீர்ப்புச் சூழலில் πληγή என்பதற்கு ‘வாதை’ என்பது பொருத்தமான, வழக்கிலுள்ள வேதாகமத் தமிழ்.
- source_word: ἀπεκτάνθησαν
  choice: கொல்லப்பட்டார்கள்
  rationale: இறந்தகாலச் செயப்பாட்டு வினையின் பொருளை நேரடியாகப் பாதுகாக்கிறது; செய்பவர் யார் என்பதை மூலவசனம் வெளிப்படையாகக் கூறாததையும் இது தக்கவைக்கிறது.
- source_word: τὸ τρίτον τῶν ἀνθρώπων
  choice: மனிதர்களில் மூன்றில் ஒரு பகுதியினர்
  rationale: பகுதிப்பொருளான ‘மூன்றில் ஒரு பங்கு’ என்பதைத் தெளிவாகக் கூறுகிறது. ἀνθρώπων மனிதர்களைப் பொதுவாகக் குறிக்கிறது; ஆண்களை மட்டும் அல்ல.
- source_word: ἐκ τοῦ πυρὸς καὶ τοῦ καπνοῦ καὶ τοῦ θείου
  choice: நெருப்பினாலும் புகையினாலும் கந்தகத்தினாலும்
  rationale: மூலத்தில் ஒவ்வொரு பெயர்ச்சொல்லோடும் வரும் இணைப்பின் வலியுறுத்தலைத் தமிழின் திரும்பத் திரும்ப வரும் ‘…இனாலும்’ வடிவம் பாதுகாக்கிறது. θεῖον என்பதற்கான நவீனத் தெளிவான சொல் ‘கந்தகம்’.
- source_word: τοῦ ἐκπορευομένου ἐκ τῶν στομάτων αὐτῶν
  choice: அவற்றின் வாய்களிலிருந்து வெளிவந்த
  rationale: வாய்களிலிருந்து அவை புறப்பட்டு வருகிற காட்சியை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; பன்மையான ‘வாய்கள்’ மற்றும் பின்னோக்கிய சுட்டுப்பெயரும் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: அபோகலிப்டிக் நியாயத்தீர்ப்புச் சூழலில் ἀνθρώπων என்பதன் எல்லை
  choice: மனிதர்கள்
  alternative: மனிதகுலம்
  rationale: இது மனிதர்களைப் பொதுவாகக் குறிக்கிறது; ஆண்களை மட்டும் குறிக்கவில்லை. ‘மனிதர்கள்’ என்பது கிரேக்கப் பன்மையை இயல்பாகப் பாதுகாப்பதோடு தேவையற்ற கோட்பாட்டு விளக்கத்தையும் சேர்க்காது.
- issue: கொன்ற செய்பவரை வெளிப்படையாக அடையாளப்படுத்துதல்
  choice: செயப்பாட்டு வடிவமான ‘கொல்லப்பட்டார்கள்’
  alternative: ‘தேவன் அவர்களைக் கொன்றார்’ என்று செய்பவரை வெளிப்படுத்துதல்
  rationale: மூலவசனம் செய்பவரை இலக்கணரீதியாக வெளிப்படையாகக் குறிப்பிடவில்லை. செயப்பாட்டு வடிவம் அந்தத் திறந்த நிலையையும் நியாயத்தீர்ப்பின் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வெளிப்படுத்தின விசேஷத்தின் மேன்மையான நியாயத்தீர்ப்புத் தொனியைத் தக்கவைக்கும் வகையிலும் மொழிநடை அமைக்கப்பட்டுள்ளது. மூலத்தின் மூன்று கூறுகளுக்கான இணைநிலை வலியுறுத்தல் ‘நெருப்பினாலும் புகையினாலும் கந்தகத்தினாலும்’ எனப் பாதுகாக்கப்பட்டுள்ளது.
