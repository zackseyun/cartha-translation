source:
  edition: SBLGNT
  text: καὶ οὕτως εἶδον τοὺς ἵππους ἐν τῇ ὁράσει καὶ τοὺς καθημένους ἐπ’ αὐτῶν, ἔχοντας θώρακας πυρίνους καὶ ὑακινθίνους καὶ θειώδεις· καὶ αἱ κεφαλαὶ τῶν ἵππων ὡς κεφαλαὶ λεόντων, καὶ ἐκ τῶν στομάτων αὐτῶν ἐκπορεύεται πῦρ καὶ καπνὸς καὶ θεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/017.yaml
  text: And this is how I saw the horses in the vision, and those sitting on them[a]—they had breastplates fiery red and hyacinth-blue and sulfur-yellow; and the heads of the horses were like lions’ heads[b], and out of their mouths come fire and smoke and sulfur.
translation:
  language: ta
  text: 'அந்தத் தரிசனத்தில் குதிரைகளையும் அவற்றின்மேல் அமர்ந்திருந்தவர்களையும் நான் இவ்வாறு கண்டேன்: அவர்கள் நெருப்புச் சிவப்பு, கருநீலம், கந்தக மஞ்சள் ஆகிய நிறங்களுடைய மார்புக் கவசங்களை அணிந்திருந்தார்கள்.[a] குதிரைகளின் தலைகள் சிங்கங்களின் தலைகளைப் போல இருந்தன; அவற்றின் வாய்களிலிருந்து நெருப்பும் புகையும் கந்தகமும் வெளியேறுகின்றன.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இவற்றை இன்னும் சொற்சொல்லாக, “நெருப்பு போன்றதும், பதுமராக நிறமுடையதும், கந்தகம் போன்றதும் ஆன மார்புக் கவசங்கள்” என்றும் மொழிபெயர்க்கலாம். “கருநீலம்” என்பதற்கான கிரேக்கச் சொல் பதுமராகம் அல்லது ஹயசிந்த் எனப்படும் பொருளோடு தொடர்புடைய ஆழ்ந்த நீல அல்லது நீல-ஊதா நிறத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: இவ்வாறு
  rationale: காட்சியின் தோற்றத்தைத் தொடர்ந்து விளக்கும் விதத்தை இயல்பான தமிழில் சுட்டுகிறது.
- source_word: ἐν τῇ ὁράσει
  choice: அந்தத் தரிசனத்தில்
  rationale: வெறும் பார்வை அல்லது தோற்றம் அல்லாமல், வெளிப்படுத்தின விசேஷ தரிசன அனுபவத்தைக் குறிக்கிறது.
- source_word: καθημένους ἐπ’ αὐτῶν
  choice: அவற்றின்மேல் அமர்ந்திருந்தவர்கள்
  rationale: ‘குதிரைவீரர்கள்’ என்று சுருக்காமல், கிரேக்கத்தின் பங்கேற்பு வினை அமைப்பையும் காட்சியையும் வெளிப்படையாக வைத்திருக்கிறது.
- source_word: θώρακας
  choice: மார்புக் கவசங்கள்
  rationale: உடலின் மார்புப் பகுதியைப் பாதுகாக்கும் குறிப்பிட்ட கவசத்தைத் தெளிவாகக் குறிக்கிறது.
- source_word: πυρίνους καὶ ὑακινθίνους καὶ θειώδεις
  choice: நெருப்புச் சிவப்பு, கருநீலம், கந்தக மஞ்சள் ஆகிய நிறங்களுடைய
  rationale: தரிசனத்தின் காட்சிசார் சூழலில் மூன்று பெயரடைகளையும் நிற விளக்கங்களாக இயல்பான தமிழில் தருகிறது; அவை பொருள் அல்லது தன்மையைக் குறிக்கக்கூடிய மொழியியல் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ὡς κεφαλαὶ λεόντων
  choice: சிங்கங்களின் தலைகளைப் போல
  rationale: ὡς என்பதன் ஒப்புமையையும் பன்மை வடிவத்தையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: ἐκπορεύεται
  choice: வெளியேறுகின்றன
  rationale: கிரேக்க நிகழ்காலத்தின் தரிசன உயிரோட்டத்தைத் தக்கவைக்கிறது; தொடர்ச்சியான மூன்று எழுவாய்களுக்கு தமிழ் பன்மை வினை இயல்பானது.
- source_word: θεῖον
  choice: கந்தகம்
  rationale: பழைய அல்லது மறைமுகச் சொல்லுக்கு மாற்றாக, இன்றைய வாசகர்களுக்குப் புரியும் பொருள்பெயரைப் பயன்படுத்துகிறது.
theological_decisions:
- issue: மார்புக் கவசங்களை விவரிக்கும் மூன்று வெளிப்படுத்தினப் பெயரடைகளின் பொருள்
  choice: அவற்றை நெருப்புச் சிவப்பு, கருநீலம், கந்தக மஞ்சள் என்ற காட்சிசார் நிறங்களாக முதன்மை உரையில் வழங்குதல்
  alternative: ‘நெருப்பு போன்ற, பதுமராகம் போன்ற, கந்தகம் போன்ற’ அல்லது ‘நெருப்பான, பதுமராக நிறமான, கந்தகத் தன்மையான’ என்று நிறங்களைத் தெளிவுபடுத்தாமல் வழங்குதல்
  rationale: ஒருங்கிணைக்கப்பட்ட மூன்று பெயரடைகளும் தரிசனத்தில் கவசங்களின் காட்சித் தோற்றத்தை விவரிப்பதால் நிறப் பொருள் வலுவானது. இருப்பினும் கிரேக்கம் அவற்றை ‘சிவப்பு’ மற்றும் ‘மஞ்சள்’ என்று நேரடியாகச் சொல்லாததால், அந்தத் திறந்த தன்மை அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியம் தமிழில் தெளிவுக்காக இரு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; நிகழ்காலக் காட்சி வினை பாதுகாக்கப்பட்டுள்ளது.
