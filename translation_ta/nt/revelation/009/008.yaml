id: REV.9.8
reference: Revelation 9:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἶχον τρίχας ὡς τρίχας γυναικῶν, καὶ οἱ ὀδόντες αὐτῶν ὡς λεόντων ἦσαν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/008.yaml
  text: And they had hair like women’s hair[a], and their teeth were like lions’ teeth,
translation:
  language: ta
  text: அவற்றுக்கு பெண்களின் கூந்தலைப் போன்ற முடி இருந்தது; அவற்றின் பற்கள் சிங்கங்களின் பற்களைப் போல் இருந்தன.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶχον
  choice: இருந்தது
  rationale: தரிசனக் காட்சியை விவரிக்கும் ἔχω என்பதன் இறந்தகாலத் தொடர்நிலை வடிவம்; தமிழில் இயல்பான கடந்தகால விவரிப்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: τρίχας
  choice: கூந்தல்
  rationale: கிரேக்கத்தில் பன்மையாக இருந்தாலும், தலை முடியை இயல்பாகக் குறிக்கத் தமிழில் ஒருமைத் திரள்பெயரான ‘கூந்தல்’ பொருத்தமானது.
- source_word: ὡς τρίχας γυναικῶν
  choice: பெண்களின் கூந்தலைப் போன்ற கூந்தல்
  rationale: ὡς குறிக்கும் உவமையை வெளிப்படையாகப் பேணுகிறது; மூலத்தின் ‘பெண்களின்’ என்ற பன்மையையும் காக்கிறது.
- source_word: οἱ ὀδόντες αὐτῶν
  choice: அவற்றின் பற்கள்
  rationale: உடைமைத் தொடர்பை இயல்பான தமிழ் வடிவில் வழங்குகிறது; முந்தைய வசனங்களிலுள்ள உயிரினங்களைக் குறிக்க ‘அவற்றின்’ பயன்படுத்தப்பட்டது.
- source_word: ὡς λεόντων
  choice: சிங்கங்களின் பற்களைப் போல்
  rationale: ‘பற்கள்’ என்பதே ஒப்பீட்டில் மறைந்துள்ள பெயர்ச்சொல் என்பதைத் தமிழில் தெளிவாக்கி, λεόντων என்பதன் பன்மையைப் பேணுகிறது.
- source_word: ἦσαν
  choice: இருந்தன
  rationale: εἰμί என்பதன் இறந்தகாலத் தொடர்நிலை வடிவத்தை, பன்மை எழுவாயான ‘பற்கள்’ என்பதோடு இயல்பாகப் பொருந்தும் கடந்தகால வடிவில் தருகிறது.
theological_decisions:
- issue: வெளிப்படுத்தல் தரிசனத்தின் உருவகக் காட்சியை மொழிபெயர்த்தல்
  choice: ‘பெண்களின் கூந்தல்’, ‘சிங்கங்களின் பற்கள்’ என்ற உவமைகளை விளக்கமின்றி அப்படியே பேணுதல்
  alternative: அவற்றின் குறியீட்டுப் பொருளை மொழிபெயர்ப்பிலேயே விளக்குதல்
  rationale: கிரேக்க மூலம் உவமைகளை மட்டும் முன்வைத்து அவற்றின் குறியீட்டுப் பொருளை விளக்கவில்லை. ஆகவே மொழிபெயர்ப்பு எந்தத் தனிப்பட்ட இறையியல் விளக்கத்தையும் சேர்க்காமல் காட்சியின் தெளிவின்மையையும் வலிமையையும் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘முடி’ என்பதைக் காட்டிலும் பெண்களின் தலை முடியைச் சுட்டும் ‘கூந்தல்’ இங்கு இயல்பானது. ‘அவை’ என்ற அஃறிணைச் சுட்டு, தரிசனத்தில் வர்ணிக்கப்படும் வெட்டுக்கிளி போன்ற உயிரினங்களுக்குப் பொருந்துகிறது.
