source:
  edition: SBLGNT
  text: καὶ ἔχουσιν οὐρὰς ὁμοίας σκορπίοις καὶ κέντρα, καὶ ἐν ταῖς οὐραῖς αὐτῶν ⸂ἡ ἐξουσία αὐτῶν⸃ ἀδικῆσαι τοὺς ἀνθρώπους μῆνας πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/010.yaml
  text: And they have tails like scorpions[a], and stingers; and in their tails is their power to harm people for five months.
translation:
  language: ta
  text: அவற்றுக்குத் தேள்களைப் போன்ற வால்களும் கொடுக்குகளும் உள்ளன. மனிதர்களுக்குத் தீங்கு செய்ய ஐந்து மாதங்களுக்கு அவற்றின் வால்களில் அவற்றின் வல்லமை உள்ளது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் “அவற்றின் வல்லமை” என்ற சொற்கள் இல்லை.
    reason: textual_variant
lexical_decisions:
- source_word: οὐρὰς
  choice: வால்கள்
  rationale: காட்சியின் உடற்கூறு உருவகத்தை நேரடியாகவும் பன்மையிலும் தக்கவைக்கிறது.
- source_word: ὁμοίας σκορπίοις
  choice: தேள்களைப் போன்ற
  rationale: ὅμοιος என்பதுடன் வரும் வேற்றுமை உருபு காட்டும் ஒப்புமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; வால்கள் குறிப்பாகத் தேள்களின் வால்களைப் போன்றவை என்று மூலத்தில் இல்லாத தெளிவைச் சேர்க்கவில்லை.
- source_word: κέντρα
  choice: கொடுக்குகள்
  rationale: κέντρον என்பது கூர்முனை அல்லது கொட்டும் உறுப்பைக் குறிக்கலாம்; தேள் உருவகத்தில் ‘கொடுக்குகள்’ என்பது இயல்பான, தெளிவான உடற்கூற்றுச் சொல்.
- source_word: ἐξουσία
  choice: வல்லமை
  rationale: இங்கு சட்டபூர்வ அதிகாரத்தைவிடத் தீங்கு விளைவிக்கும் செயல்திறன் முன்னிலையில் உள்ளது; அதேவேளை அனுமதிக்கப்பட்ட ஆற்றல் என்ற உட்பொருளையும் ‘வல்லமை’ தடுக்கவில்லை.
- source_word: ἀδικῆσαι
  choice: தீங்கு செய்யும்
  rationale: இந்தத் தண்டனைக்காட்சியில் அநீதி செய்வது என்ற அறநெறிசார் பொருளைவிடக் கேடு அல்லது காயம் விளைவிப்பதே சூழலுக்குப் பொருத்தமானது.
- source_word: τοὺς ἀνθρώπους
  choice: மனிதர்களுக்கு
  rationale: ἄνθρωποι இங்கு மனிதகுலத்தைப் பொதுவாகக் குறிக்கிறது; நவீனத் தமிழில் பாலின வரம்பைத் தேவையின்றி ஏற்படுத்தாத துல்லியமான சொல்.
- source_word: μῆνας πέντε
  choice: ஐந்து மாதங்கள்
  rationale: காலநீட்டத்தைக் குறிக்கும் நேரடி தமிழாக்கம்; ‘தீங்கு செய்யும்’ என்பதுடன் இணைந்து அந்த வல்லமை செயல்படும் காலத்தை இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: வெளிப்படுத்தின விசேஷத்தின் தண்டனைக்காட்சியில் ἐξουσία என்பதன் பொருள்
  choice: ‘வல்லமை’ என்று மொழிபெயர்க்கப்பட்டது
  alternative: ‘அதிகாரம்’
  rationale: இந்த வசனம் வால்கள் வழியாகத் தீங்கு செய்யும் திறனை விவரிக்கிறது. ‘வல்லமை’ செயலாற்றும் ஆற்றலை முன்னிறுத்துகிறது; அந்த ஆற்றல் காட்சிக்குள் அனுமதிக்கப்பட்டது என்ற சாத்தியத்தை மறுப்பதில்லை.
- issue: τοὺς ἀνθρώπους என்பதன் பொதுவான குறிப்பு
  choice: ‘மனிதர்களுக்கு’ என்று மொழிபெயர்க்கப்பட்டது
  alternative: ‘ஆண்களுக்கு’
  rationale: இங்குள்ள ἄνθρωποι குறிப்பாக ஆண்களை மட்டும் அல்லாமல் மனிதர்களைப் பொதுவாகக் குறிக்கிறது; ஆகவே பாலினம் சாராத தமிழ் வடிவம் மூலத்தின் குறிப்பைத் துல்லியமாக வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரிவதுமான நடை பயன்படுத்தப்பட்டது. முதல் வாக்கியம் காட்சியின் உடற்கூறு விவரத்தையும், இரண்டாவது வாக்கியம் வால்களில் உள்ள தீங்கு செய்யும் வல்லமையையும் தெளிவாகப் பிரிக்கிறது. மூலத்தின் நிகழ்கால வடிவம் ‘உள்ளன/உள்ளது’ எனத் தக்கவைக்கப்பட்டது.
