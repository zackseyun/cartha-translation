id: REV.9.19
reference: Revelation 9:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἡ γὰρ ἐξουσία τῶν ἵππων ἐν τῷ στόματι αὐτῶν ἐστιν καὶ ἐν ταῖς οὐραῖς αὐτῶν· αἱ γὰρ οὐραὶ αὐτῶν ὅμοιαι ⸀ὄφεσιν, ἔχουσαι κεφαλάς, καὶ ἐν αὐταῖς ἀδικοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/019.yaml
  text: For the power of the horses is in their mouths and in their tails[a]; for their tails are like serpents, having heads[b], and with them they do harm.
translation:
  language: ta
  text: ஏனெனில், அந்தக் குதிரைகளின் வல்லமை அவற்றின் வாய்களிலும் வால்களிலும் இருக்கிறது; ஏனெனில், அவற்றின் வால்கள் பாம்புகளைப் போன்றவை; தலைகளைக் கொண்ட அந்த வால்கள் அவற்றினாலேயே தீங்கு செய்கின்றன.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξουσία
  choice: வல்லமை
  rationale: இத்தரிசனச் சூழலில், சட்டபூர்வ அதிகாரத்தைவிடத் தீங்கு விளைவிக்கும் ஆற்றலையே இச்சொல் குறிக்கிறது; ‘வல்லமை’ அந்தப் பொருளையும் கண்ணியமான நடையையும் தக்கவைக்கிறது.
- source_word: στόματι
  choice: வாய்களிலும்
  rationale: கிரேக்கத்தில் ஒருமையாக இருந்தாலும், பன்மையான குதிரைகள் ஒவ்வொன்றுக்கும் உரிய வாயைக் குறிக்கும் பகிர்வுப் பயன்பாடு என்பதால் தமிழில் பன்மை இயல்பானது.
- source_word: οὐραῖς / οὐραὶ
  choice: வால்களிலும் / வால்கள்
  rationale: காட்சியின் முக்கிய உருவகத்தை நேரடியாகவும் தெளிவாகவும் தரும் வழக்கமான பொருள்.
- source_word: ὅμοιαι ὄφεσιν
  choice: பாம்புகளைப் போன்றவை
  rationale: ὄφις என்பதற்கான இயல்பான நவீனத் தமிழ்ச் சொல் ‘பாம்பு’; தரிசன உருவகத்திற்கு தேவையற்ற விளக்கம் சேர்க்கப்படவில்லை.
- source_word: ἔχουσαι κεφαλάς
  choice: அவற்றுக்குத் தலைகள் உள்ளன
  rationale: வால்களுக்கு தலைகள் இருப்பதாகத் தொடரும் கிரேக்கக் காட்சியை இயல்பான தமிழில் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἀδικοῦσιν
  choice: தீங்கு செய்கின்றன
  rationale: இங்கு அறநெறி சார்ந்த ‘அநியாயம் செய்தல்’ என்பதற்குப் பதிலாகக் காயப்படுத்துதல் அல்லது சேதம் விளைவித்தல் என்ற சூழல்சார் பொருள் முதன்மையானது.
- source_word: ἐν αὐταῖς
  choice: அவற்றால்
  rationale: ἐν இங்கு கருவிப்பொருளில் வருகிறது; பெண்பால் பன்மையான αὐταῖς இலக்கணப்படி வால்களைக் குறிக்கிறது. தமிழில் ‘அவற்றால்’ என்பது அந்த வால்கள் தீங்கு விளைவிக்கும் கருவிகளாக இருப்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: γὰρ
  choice: ஏனெனில்
  rationale: முதல் γάρ முந்தைய வசனத்தை விளக்கும் தொடர்பைக் காட்டுகிறது. இரண்டாவது γάρ தமிழ் வாக்கிய ஓட்டத்தில் தனியே மீண்டும் மொழிபெயர்க்கப்படாமல், அடுத்த விளக்க வாக்கியத்தின் தொடர்பால் இயல்பாக வெளிப்படுகிறது.
theological_decisions:
- issue: குதிரைகளின் வால்களும் அவற்றிலுள்ள தலைகளும் பற்றிய வெளிப்படுத்தின விசேஷத் தரிசன உருவகம்
  choice: கிரேக்கத்தில் உள்ள காட்சியை நேரடியாக மொழிபெயர்த்து, அதற்கு அடையாளவியல் விளக்கம் சேர்க்காமல் விடுதல்
  alternative: வால்களைப் பொய்ப்போதனை, பிசாசின் செயல்பாடு அல்லது வேறு குறிப்பிட்ட ஒன்றின் அடையாளமாக மொழிபெயர்த்தல்
  rationale: மூலவசனம் தரிசனக் காட்சியை விவரிக்கிறது; அதன் பொருள் குறித்த குறிப்பிட்ட சமய விளக்கம் எதையும் மொழிபெயர்ப்புக்குள் புகுத்தவில்லை.
- issue: ἀδικοῦσιν என்பதன் இலக்கண எழுவாய்
  choice: ‘தீங்கு செய்கின்றன’ என எழுவாயை மீண்டும் வெளிப்படையாகச் சொல்லாமல் மொழிபெயர்த்தல்
  alternative: ‘அந்த வால்கள் தீங்கு செய்கின்றன’ அல்லது ‘குதிரைகள் அவற்றால் தீங்கு செய்கின்றன’ என்று எழுவாயைத் திட்டவட்டமாக்குதல்
  rationale: கிரேக்கத்தில் அருகிலுள்ள ‘வால்கள்’ இலக்கண எழுவாயாகத் தொடர வாய்ப்பு உள்ளது; அதேவேளை மொத்தக் காட்சியில் குதிரைகள் வால்களால் தீங்கு செய்வதாகவும் புரிந்துகொள்ளலாம். தமிழ் விடுபட்ட எழுவாய் இந்தச் சிறிய தெளிவின்மையை இயல்பாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் தரப்பட்டுள்ளது. ‘அந்தக் குதிரைகள்’ முந்தைய சூழலில் ஏற்கெனவே கூறப்பட்ட குதிரைகளைச் சுட்டுகிறது. தேவையற்ற தொழில்நுட்பச் சொற்களும் அடையாளவியல் விளக்கங்களும் தவிர்க்கப்பட்டுள்ளன.
