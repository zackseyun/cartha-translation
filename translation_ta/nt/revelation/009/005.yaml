id: REV.9.5
reference: Revelation 9:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐδόθη ⸀αὐτοῖς ἵνα μὴ ἀποκτείνωσιν αὐτούς, ἀλλ’ ἵνα ⸀βασανισθήσονται μῆνας πέντε· καὶ ὁ βασανισμὸς αὐτῶν ὡς βασανισμὸς σκορπίου, ὅταν παίσῃ ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/005.yaml
  text: And it was given to them that they should not kill them[a], but that they should be tormented for five months[b]; and their torment was like the torment of a scorpion when it strikes a man.
translation:
  language: ta
  text: அவர்களைக் கொல்லாமல், ஐந்து மாதங்கள் வேதனைப்படுத்துவதற்கு அவற்றுக்கு அதிகாரம் கொடுக்கப்பட்டது; அவை உண்டாக்கும் வேதனை, தேள் ஒரு மனிதனைக் கொட்டும்போது உண்டாகும் வேதனையைப் போன்றிருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கொட்டும்போது’ என்பதற்குக் கிரேக்கத்தில் நேரடியாக ‘அடிக்கும்போது’ அல்லது ‘தாக்கும்போது’ என்று பொருள்; தேளைப் பற்றிய இச்சூழலில் ‘கொட்டும்போது’ என்பது குறிப்பான பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτοῖς
  choice: அவற்றுக்கு அதிகாரம் கொடுக்கப்பட்டது
  rationale: எழுவாயை வெளிப்படுத்தாத கிரேக்கச் செயப்பாட்டு வடிவத்தைத் தக்கவைத்து, முன்சூழலில் உள்ள வெட்டுக்கிளி போன்ற உயிரினங்களைக் குறிக்கும் பன்மையை தமிழில் அஃறிணையாக இயல்பாகக் காட்டுகிறது. ‘அதிகாரம்’ என்பது அனுமதி/வல்லமை அளிக்கப்பட்ட கருத்தைத் தெளிவாக்குகிறது; கொடுத்தவர் யார் என்பதை உரை வெளிப்படையாகச் சொல்லாத நிலையும் காக்கப்படுகிறது.
- source_word: ἵνα μὴ ἀποκτείνωσιν αὐτούς
  choice: அவர்களைக் கொல்லாமல்
  rationale: ἵνα கட்டமைப்பின் நோக்கம் அல்லது அளிக்கப்பட்ட அதிகாரத்தின் உள்ளடக்கத்தை இயல்பான தமிழில் எதிர்மறை வினையெச்சமாக வெளிப்படுத்துகிறது.
- source_word: ἀλλ’ ἵνα βασανισθήσονται μῆνας πέντε
  choice: ஐந்து மாதங்கள் வேதனைப்படுத்துவதற்கு
  rationale: வழக்கத்திற்கு மாறான ἵνα + எதிர்காலச் செயப்பாட்டு வடிவத்தின் நோக்கம்/விளைவு சார்ந்த வலிமையைத் தீர்மானமாகச் சீராக்காமல் தமிழில் நோக்கக் கட்டமைப்பாகக் காட்டுகிறது; கால நீட்சியும் தெளிவாக உள்ளது.
- source_word: βασανισθήσονται / βασανισμός
  choice: வேதனைப்படுத்துவதற்கு / வேதனை
  rationale: βασαν- சொற்குடும்பத்தின் மீளுருவாக்கத்தை முடிந்தவரை காத்து, நீதித்துறைச் சித்திரவதை என்று தேவையின்றிக் குறுக்காமல் கடுமையான துன்பத்தைத் தெரிவிக்கிறது.
- source_word: ὁ βασανισμὸς αὐτῶν
  choice: அவை உண்டாக்கும் வேதனை
  rationale: αὐτῶν என்பதன் உறவை தமிழில் புரியும்படி, அந்த உயிரினங்கள் ஏற்படுத்தும் வேதனையாகச் சூழலுக்கேற்ப வெளிப்படுத்துகிறது.
- source_word: ὡς βασανισμὸς σκορπίου
  choice: தேள் ... உண்டாகும் வேதனையைப் போன்றிருந்தது
  rationale: ὡς என்பதன் ஒப்பீட்டை இயல்பான தமிழில் தருகிறது; ‘வேதனை’ என்ற சொல்லின் மீளுருவாக்கத்தையும் காக்கிறது.
- source_word: ὅταν παίσῃ ἄνθρωπον
  choice: ஒரு மனிதனைக் கொட்டும்போது
  rationale: παίω அடிப்படையில் ‘அடித்தல்/தாக்குதல்’ என்றாலும், தேளை எழுவாயாகக் கொண்ட இச்சூழலில் நவீன தமிழின் துல்லியமான இயற்கைச் சொல் ‘கொட்டுதல்’. ἄνθρωπος இங்கு பொதுமனிதரைக் குறிப்பதால் ‘ஒரு மனிதன்’ என்று மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: வெளிப்படுத்தலில் தெய்வீகச் செயப்பாட்டு வடிவம்
  choice: ‘அவற்றுக்கு அதிகாரம் கொடுக்கப்பட்டது’ என்று கொடுத்தவரைப் பெயரிடாமல் வைத்தல்
  alternative: ‘கடவுள் அவற்றுக்கு அதிகாரம் கொடுத்தார்’ அல்லது ‘அவற்றுக்கு அனுமதி அளிக்கப்பட்டது’
  rationale: கிரேக்கம் கொடுத்தவரை வெளிப்படையாகக் குறிப்பிடவில்லை. கடவுளைப் பெயரிட்டு சேர்ப்பது உரைக்கு அப்பாற்பட்ட விளக்கமாகும்; செயப்பாட்டு வடிவம் தெய்வ இறையாண்மைக்கும் இடைமுகத் தீர்ப்பிற்கும் இடையிலான பதற்றத்தைப் பாதுகாக்கிறது.
- issue: ἵνα μὴ ... ἀλλ’ ἵνα என்பதன் நோக்கம்/விளைவு
  choice: கொல்லாமல், வேதனைப்படுத்துவதற்கு
  alternative: அவர்கள் கொல்லக்கூடாது, ஆனால் அவர்கள் வேதனைப்பட வேண்டும்
  rationale: இரு ἵνα கூறுகளின் மாறுபாட்டையும் அதிகாரத்தின் வரம்பையும் தமிழில் ஒரே கட்டமைப்புக்குள் காட்டுகிறது; வேதனைக்கு உட்படுவோரையே செய்பவர்களாகத் தவறாக உணர்த்துவதைத் தவிர்க்கிறது.
- issue: பொதுப்பொருளுடைய ἄνθρωπον
  choice: ஒரு மனிதன்
  alternative: ஒருவரை
  rationale: சொல்லின் ஒருமை வடிவத்தையும் மனிதரைக் குறிக்கும் பொதுப்பொருளையும் காக்கிறது; இங்கு ஆண்களை மட்டும் குறிக்கும் கட்டுப்பாட்டை ஏற்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், உயர்வும் எளிமையும் இணைந்த நடையில் அமைக்கப்பட்டது. முன்சூழலிலுள்ள வெட்டுக்கிளி போன்ற உயிரினங்களுக்கு ‘அவை/அவற்றுக்கு’ என்றும், வேதனைக்கு உட்படும் மனிதர்களுக்கு ‘அவர்கள்’ என்றும் வேறுபடுத்தப்பட்டுள்ளது. மூலத்தில் உள்ள நீளமான இணை வாக்கியம் தமிழின் இயல்புக்கேற்ப அரைப்புள்ளியால் பிரிக்கப்பட்டுள்ளது.
