  to: அந்த நாட்களில் மனிதர்கள் மரணத்தைத் தேடுவார்கள்; அதைக் கண்டடையவே மாட்டார்கள். அவர்கள் இறக்க ஏங்குவார்கள்; மரணமோ அவர்களிடமிருந்து தப்பி ஓடுகிறது.
