id: REV.9.6
reference: Revelation 9:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐν ταῖς ἡμέραις ἐκείναις ζητήσουσιν οἱ ἄνθρωποι τὸν θάνατον καὶ οὐ μὴ εὑρήσουσιν αὐτόν, καὶ ἐπιθυμήσουσιν ἀποθανεῖν καὶ ⸀φεύγει ⸂ὁ θάνατος ἀπ’ αὐτῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/006.yaml
  text: And in those days people will seek death and will certainly not find it[a], and they will long to die, but death flees from them.
translation:
  language: ta
  text: அந்த நாட்களில் மனிதர்கள் மரணத்தைத் தேடுவார்கள்; அதைக் கண்டடையவே மாட்டார்கள். அவர்கள் இறக்க ஏங்குவார்கள்; மரணமோ அவர்களிடமிருந்து தப்பி ஓடுகிறது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: அந்த நாட்களில்
  rationale: காலத்தைக் குறிக்கும் கிரேக்கத் தொடரின் சுட்டுப்பொருளை இயல்பான நவீன தமிழில் நேரடியாகப் பாதுகாக்கிறது.
- source_word: οἱ ἄνθρωποι
  choice: மனிதர்கள்
  rationale: இங்கு ἄνθρωποι ஆண்களை மட்டும் அல்லாமல் பொதுவாக மனிதர்களைக் குறிக்கிறது; ‘மனிதர்கள்’ என்பது அந்த விரிவான பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: ζητήσουσιν τὸν θάνατον
  choice: மரணத்தைத் தேடுவார்கள்
  rationale: ζητέω என்பதிலுள்ள நோக்கமுள்ள தேடுதலையும், θάνατος என்பதன் நேரடிப் பொருளையும் காக்கிறது.
- source_word: οὐ μὴ εὑρήσουσιν αὐτόν
  choice: அதைக் கண்டடையவே மாட்டார்கள்
  rationale: οὐ μή உடன் வரும் வலியுறுத்தப்பட்ட மறுப்பை ‘-வே மாட்டார்கள்’ என்ற இயல்பான தமிழ் அமைப்பு வெளிப்படுத்துகிறது.
- source_word: ἐπιθυμήσουσιν ἀποθανεῖν
  choice: இறக்க ஏங்குவார்கள்
  rationale: ἐπιθυμέω குறிக்கும் தீவிர விருப்பத்தை ‘ஏங்குவார்கள்’ இயல்பாகவும் செறிவாகவும் தருகிறது.
- source_word: φεύγει ὁ θάνατος ἀπ’ αὐτῶν
  choice: மரணமோ அவர்களிடமிருந்து தப்பி ஓடுகிறது
  rationale: மரணத்தைச் செயல்படும் ஒன்றாக உருவகப்படுத்தும் கிரேக்கப் படிமத்தையும், φεύγει என்ற நிகழ்காலத்தின் காட்சித் தீவிரத்தையும் காக்கிறது.
theological_decisions:
- issue: நியாயத்தீர்ப்பின் சூழலில் மரணத்தின் உருவகப்படுத்தல்
  choice: ‘மரணமோ அவர்களிடமிருந்து தப்பி ஓடுகிறது’ என்று உருவகத்தை நேரடியாக வைத்தல்
  alternative: ‘அவர்களால் இறக்க முடியாது’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: கிரேக்கத்தில் மரணமே φεύγει என்ற வினையின் எழுவாயாக உள்ளது. அதை இயலாமை பற்றிய உரையாக மாற்றாமல், வெளிப்படுத்தின விசேஷத்தின் அபோகலிப்டிக் படிமத்தையும் அதன் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
- issue: οἱ ἄνθρωποι என்பதன் பொதுவான மனிதகுலக் குறிப்பு
  choice: ‘மனிதர்கள்’
  alternative: ‘ஆண்கள்’
  rationale: சூழலில் இந்தச் சொல் ஆண் பாலினத்தவரை மட்டும் தனிப்படுத்தாமல், தீர்ப்புக்குள்ளாகும் மக்களைப் பொதுவாகக் குறிக்கிறது. நவீன தமிழில் ‘மனிதர்கள்’ அதைப் பிழையின்றி வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘மரணமோ’ என்ற வலியுறுத்தல் மரணத்தின் உருவகச் செயற்பாட்டைத் தெளிவாக்குகிறது; இறுதி வினையின் நிகழ்காலம் கிரேக்கத்தின் காட்சிமிக்க நிகழ்காலத்தைப் பாதுகாக்கிறது.
