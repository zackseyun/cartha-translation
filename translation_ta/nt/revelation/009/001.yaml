revisions:
- from: ஐந்தாவது தூதர் எக்காளம் ஊதினார். அப்போது வானத்திலிருந்து பூமிக்கு விழுந்திருந்த ஒரு நட்சத்திரத்தை நான் கண்டேன்.[a][b] பாதாள ஆழத்தின் கிணற்றுக்கான திறவுகோல் அதற்குக் கொடுக்கப்பட்டது.[c]
  to: ஐந்தாவது தூதர் எக்காளம் ஊதினார். அப்போது வானத்திலிருந்து பூமிக்கு விழுந்திருந்த ஒரு நட்சத்திரத்தை நான் கண்டேன்.[a][b] பாதாளத்தின் கிணற்றின் திறவுகோல் அவருக்குக் கொடுக்கப்பட்டது.[c]
  rationale: The revision preserves the star image and does not identify its referent, but it reflects the source’s masculine pronoun with respectful personal Tamil reference. It also renders the two-part expression φρέαρ τῆς ἀβύσσου more directly as “பாதாளத்தின் கிணறு,” preserving the shaft/well–abyss distinction and the passive “கொடுக்கப்பட்டது.”
