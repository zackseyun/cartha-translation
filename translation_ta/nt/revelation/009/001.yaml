id: REV.9.1
reference: Revelation 9:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ὁ πέμπτος ἄγγελος ἐσάλπισεν· καὶ εἶδον ἀστέρα ἐκ τοῦ οὐρανοῦ πεπτωκότα εἰς τὴν γῆν, καὶ ἐδόθη αὐτῷ ἡ κλεὶς τοῦ φρέατος τῆς ἀβύσσου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/001.yaml
  text: And the fifth angel sounded the trumpet[a], and I saw a star that had fallen from heaven to the earth[c][b], and the key to the shaft of the abyss was given to him.
translation:
  language: ta
  text: ஐந்தாவது தூதர் எக்காளம் ஊதினார். அப்போது வானத்திலிருந்து பூமிக்கு விழுந்திருந்த ஒரு நட்சத்திரத்தை நான் கண்டேன்.[a][b] பாதாளத்தின் கிணற்றின் திறவுகோல் அவருக்குக் கொடுக்கப்பட்டது.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பூமிக்கு விழுந்த நட்சத்திரம்’ என்றும் சுருக்கமாக மொழிபெயர்க்கலாம். கிரேக்க வினையெச்சம், யோவான் அதைக் கண்டபோது அதன் விழுதல் ஏற்கெனவே நிகழ்ந்திருந்ததைச் சுட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: பின்பு திறவுகோல் அவருக்குக் கொடுக்கப்பட்டதாகச் சொல்லப்படுவதால், இந்த ‘நட்சத்திரம்’ ஓர் ஆளைக் குறிக்கும் குறியீடாக இருக்கலாம்; வசனம் அந்த ஆள் யார் என்பதை இங்கே குறிப்பிடவில்லை.
    reason: alternative_reading
  - marker: c
    text: ‘பாதாளத்தின் குழி’ அல்லது மரபுவழியாக ‘அடிப்பில்லாத குழி’ என்றும் மொழிபெயர்க்கப்படுகிறது. கிரேக்கத்தில் கிணறு அல்லது செங்குத்துக் குழி, பாதாளத்தோடு உடைமைத் தொடர்பில் கூறப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: எக்காளம் ஊதினார்
  rationale: σαλπίζω என்பது எக்காளத்தை ஊதுவதைக் குறிக்கிறது. தமிழில் இயல்பாகவும் வெளிப்படையாகவும் அந்த இசைக்கருவியின் படிமத்தைத் தக்கவைக்கிறது.
- source_word: ἀστέρα
  choice: ஒரு நட்சத்திரம்
  rationale: ἀστήρ என்பதன் நேரடிப் பொருள் ‘நட்சத்திரம்.’ வெளிப்படுத்தின விசேஷத்தின் குறியீட்டு சூழலில் இது ஓர் ஆளைக் குறிக்கக்கூடும் என்றாலும், மூல உரையின் படிமத்தை விளக்கமாக மாற்றாமல் தக்கவைக்கப்படுகிறது.
- source_word: πεπτωκότα
  choice: விழுந்திருந்த
  rationale: நிறைவுற்ற செயப்பாட்டு எச்சம், யோவான் அதைக் கண்டபோது விழுதல் ஏற்கெனவே நிகழ்ந்து அதன் விளைவு தொடர்ந்திருந்ததைக் காட்டுகிறது.
- source_word: ἐκ τοῦ οὐρανοῦ ... εἰς τὴν γῆν
  choice: வானத்திலிருந்து பூமிக்கு
  rationale: வெளிப்படுத்தின விசேஷத்தின் தரிசனச் சூழலுக்கும் வானம்–பூமி என்ற பரந்த எதிரிணைக்கும் ஏற்ற இயல்பான தமிழ்.
- source_word: ἐδόθη αὐτῷ
  choice: அதற்குக் கொடுக்கப்பட்டது
  rationale: கொடுப்பவரை மூல உரை குறிப்பிடாததால், செயப்பாட்டு வடிவம் காக்கப்படுகிறது. ‘நட்சத்திரம்’ என்பதோடு இலக்கண ரீதியாக ஒத்துவர ‘அதற்கு’ பயன்படுத்தப்படுகிறது; அதன் குறியீட்டு அடையாளம் தீர்மானிக்கப்படவில்லை.
- source_word: ἡ κλεὶς
  choice: திறவுகோல்
  rationale: உறுதியான சுட்டுடன் வரும் பெயர்ச்சொல்லின் குறிப்பிட்ட தன்மையை தமிழில் சூழல் இயல்பாக உணர்த்துகிறது.
- source_word: τοῦ φρέατος τῆς ἀβύσσου
  choice: பாதாள ஆழத்தின் கிணறு
  rationale: φρέαρ என்பதற்கு கிணறு அல்லது செங்குத்துக் குழி என்றும், ἄβυσσος என்பதற்கு ஆழம் அல்லது பாதாள ஆழம் என்றும் பொருள். ‘பாதாள ஆழத்தின் கிணறு’ என்ற சொற்றொடர், நுழைவுக் குழியையும் ஆழத்தையும் ஒன்றாகக் கலக்காமல் உடைமைத் தொடர்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘நட்சத்திரம்’ என்பது தேவதூதரா அல்லது சாத்தானா என்று பிரதான உரையிலேயே அடையாளப்படுத்துவதா
  choice: ‘நட்சத்திரம்’ என்ற படிமத்தை அடையாள விளக்கமின்றித் தக்கவைத்தல்
  alternative: ‘தேவதூதர்’ அல்லது ‘சாத்தானிய ஆள்’ என்று மொழிபெயர்த்தல்
  rationale: வசனம் அந்த உருவத்தை நட்சத்திரமாகவே முன்வைக்கிறது; திறவுகோல் கொடுக்கப்படுவது ஓர் ஆளைக் குறிக்கும் வாய்ப்பைத் தரினும், அதன் அடையாளத்தை வெளிப்படையாகக் கூறவில்லை.
- issue: ἐδόθη என்ற செயப்பாட்டு வடிவத்தில் கொடுப்பவர் கடவுள் என்று வெளிப்படையாகச் சேர்ப்பதா
  choice: கொடுப்பவரைக் குறிப்பிடாமல் ‘கொடுக்கப்பட்டது’ என்று வைத்தல்
  alternative: ‘கடவுள் அதற்குத் திறவுகோலைக் கொடுத்தார்’
  rationale: இங்கு செயலைச் செய்தவர் கிரேக்க உரையில் சொல்லப்படவில்லை. தெய்வீக அனுமதி உட்குறிப்பாக இருக்கக்கூடும்; ஆனால் அதை வெளிப்படையான கூற்றாக மாற்றாமல் உரையின் கட்டுப்பாடு காக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வழிபாட்டு வாசிப்புக்கும் தனிப்பட்ட வாசிப்புக்கும் ஏற்ற கண்ணியமான நடை. ‘எக்காளம்,’ ‘திறவுகோல்,’ ‘பாதாள ஆழம்’ போன்ற பரவலாகப் புரியும் வேதாகமச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன; குறியீட்டு அடையாளமும் கொடுப்பவரின் அடையாளமும் விளக்கிச் சேர்க்கப்படவில்லை.
