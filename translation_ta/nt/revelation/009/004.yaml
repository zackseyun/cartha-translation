id: REV.9.4
reference: Revelation 9:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐρρέθη αὐταῖς ἵνα μὴ ⸀ἀδικήσουσιν τὸν χόρτον τῆς γῆς οὐδὲ πᾶν χλωρὸν οὐδὲ πᾶν δένδρον, εἰ μὴ τοὺς ἀνθρώπους οἵτινες οὐκ ἔχουσι τὴν σφραγῖδα τοῦ θεοῦ ἐπὶ τῶν ⸀μετώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/004.yaml
  text: And they were told not to harm the grass of the earth[a], or any green thing, or any tree, but only the people who do not have the seal of God on their foreheads.
translation:
  language: ta
  text: பூமியின் புல்லையோ, பசுமையான எதையுமோ, எந்த மரத்தையுமோ சேதப்படுத்தக் கூடாது என்றும், தங்கள் நெற்றிகளில் கடவுளின் முத்திரையைக் கொண்டிராத மக்களை மட்டுமே சேதப்படுத்த வேண்டும் என்றும் அவற்றுக்குச் சொல்லப்பட்டது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρρέθη αὐταῖς
  choice: அவற்றுக்குச் சொல்லப்பட்டது
  rationale: செயப்பாட்டு வினையையும், கூறியவர் யார் என்பதை மூலமொழி வெளிப்படையாகக் குறிப்பிடாத நிலையையும் காக்கிறது; αὐταῖς என்பது முன்சூழலில் உள்ள வெட்டுக்கிளிகளைக் குறிக்கும் உயிரற்ற பன்மையாக இயல்பாக மொழிபெயர்க்கப்படுகிறது.
- source_word: ἵνα μὴ ἀδικήσουσιν
  choice: சேதப்படுத்தாமல்
  rationale: இந்த நியாயத்தீர்ப்புக் காட்சியில் ἀδικέω என்பது உடல் சார்ந்த தீங்கு அல்லது சேதத்தைச் சுட்டுகிறது; தமிழில் தாவரங்களுக்கும் மக்களுக்கும் பொருந்தும் ஒரே வினையாக இது இயல்பாக உள்ளது.
- source_word: τὸν χόρτον τῆς γῆς
  choice: பூமியின் புல்லை
  rationale: χόρτος என்பதன் வழக்கமான பொருளான ‘புல்’ என்பதையும், τῆς γῆς என்ற உரிமைத் தொடர்பையும் நேரடியாகக் காக்கிறது.
- source_word: οὐδὲ πᾶν χλωρόν
  choice: பசுமையான எதையும்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட χλωρόν என்பதன் ‘பசுமையானது எதுவும்’ என்ற பரந்த, ஓரளவு தெளிவுறாத பொருளைக் காக்கிறது; ‘செடி’ என்று தேவையின்றி குறுக்கவில்லை.
- source_word: οὐδὲ πᾶν δένδρον
  choice: எந்த மரத்தையும்
  rationale: δένδρον என்பதற்கு நேரான, இயல்பான தமிழ் இணை.
- source_word: εἰ μὴ
  choice: மட்டுமே
  rationale: சேதப்படுத்த அனுமதிக்கப்பட்ட ஒரே இலக்கைத் தெளிவாகக் குறிக்கும் விதிவிலக்குக் கட்டமைப்பு.
- source_word: τοὺς ἀνθρώπους
  choice: மக்களை
  rationale: ἄνθρωποι இங்கு ஆண்களை மட்டும் அல்ல, மனிதர்களை பொதுவாகக் குறிக்கிறது; ‘மக்கள்’ பாலின வரம்பைச் சேர்க்காது.
- source_word: οἵτινες οὐκ ἔχουσι
  choice: பெற்றிராத
  rationale: தமிழில் முத்திரை குறித்த சூழலில் ‘முத்திரையைப் பெற்றிருத்தல்’ இயல்பானது; இல்லாமையைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: τὴν σφραγῖδα τοῦ θεοῦ
  choice: கடவுளின் முத்திரையை
  rationale: σφραγίς என்பதன் வெளிப்படுத்தல் நூல் சார்ந்த அடையாளம், உரிமை மற்றும் பாதுகாப்பு நுணுக்கங்களைத் திறந்தவாறே வைத்திருக்கும் மரபான தமிழ் சொல்.
- source_word: ἐπὶ τῶν μετώπων
  choice: தங்கள் நெற்றிகளில்
  rationale: பன்மைத் தொடர்பைத் தெளிவாக்கி, முத்திரை இருக்கும் இடத்தை இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: ἀνθρώπους என்பதன் வரம்பு
  choice: ஆண்களை மட்டும் அல்லாமல் மனிதர்களை பொதுவாகக் குறிக்கும் ‘மக்கள்’
  alternative: ஆண்கள்
  rationale: தாவரங்களுக்கும் கடவுளின் முத்திரை உள்ள அல்லது இல்லாத மனிதர்களுக்கும் இடையேதான் சூழல் வேறுபாடு காட்டுகிறது; ஆண் பாலுக்கு மட்டும் வரம்பிட ஆதாரம் இல்லை.
- issue: செயப்பாட்டு அறிவுறுத்தலின் வலிமையும் மூலமும்
  choice: கூறியவர் யார் என்று குறிப்பிடாமல் அதிகாரமுள்ள அறிவுறுத்தலாக ‘சொல்லப்பட்டது’
  alternative: கடவுள் அவற்றுக்குக் கட்டளையிட்டார்
  rationale: ἐρρέθη என்பது செயப்பாட்டு வடிவம்; பேசுபவரை வசனம் வெளிப்படையாகச் சொல்லவில்லை. ஆகவே கடவுளை நேரடி எழுவாயாகச் சேர்ப்பதோ, ‘கட்டளை’ என வலிமையை அதிகரிப்பதோ தவிர்க்கப்படுகிறது.
- issue: χλωρόν என்பதன் பொருள் வரம்பு
  choice: பசுமையான எதையும்
  alternative: எந்தப் பசுமையான செடியையும்
  rationale: மூலத்தில் இது பெயர்ச்சொல்லாக்கப்பட்ட பெயரடை; தாவரச் சூழல் தெளிவாக இருந்தாலும், ‘செடி’ என்று குறிப்பாக்காமல் மூலத்தின் பரந்த வெளிப்பாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பானதும் கண்ணியமானதும். கிரேக்க வாக்கியத்தின் செயப்பாட்டு அமைப்பும் சொல்லாத எழுவாயும் பாதுகாக்கப்பட்டுள்ளன. ‘அவற்றுக்கு’ என்பது முந்தைய வசனங்களில் வரும் வெட்டுக்கிளிகளைத் தொடர்ச்சியாகக் குறிக்கிறது.
