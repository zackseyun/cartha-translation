revisions:
- from: பூமியின் புல்லையோ, பசுமையான எதையுமோ, எந்த மரத்தையுமோ சேதப்படுத்தாமல், தங்கள் நெற்றிகளில் கடவுளின் முத்திரையைப் பெற்றிராத மக்களை மட்டுமே சேதப்படுத்தும்படி அவற்றுக்குச் சொல்லப்பட்டது.
  to: பூமியின் புல்லையோ, பசுமையான எதையுமோ, எந்த மரத்தையுமோ சேதப்படுத்தக் கூடாது என்றும், தங்கள் நெற்றிகளில் கடவுளின் முத்திரையைக் கொண்டிராத மக்களை மட்டுமே சேதப்படுத்த வேண்டும் என்றும் அவற்றுக்குச் சொல்லப்பட்டது.
  rationale: The revision retains every source-language element and its scope while using an idiomatic Tamil structure for the two coordinated parts of the instruction. It also renders the Greek ‘have’ with ‘கொண்டிராத,’ avoiding an unnecessary implication of having received the seal.
