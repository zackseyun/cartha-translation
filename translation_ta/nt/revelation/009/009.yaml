source:
  edition: SBLGNT
  text: καὶ εἶχον θώρακας ὡς θώρακας σιδηροῦς, καὶ ἡ φωνὴ τῶν πτερύγων αὐτῶν ὡς φωνὴ ἁρμάτων ἵππων πολλῶν τρεχόντων εἰς πόλεμον·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/009.yaml
  text: And they had breastplates like iron breastplates[a], and the sound of their wings was like the sound of many chariots with horses rushing into battle.
translation:
  language: ta
  text: அவை இரும்புக் கவசங்களைப் போன்ற மார்புக் கவசங்களை அணிந்திருந்தன; அவற்றின் சிறகுகளின் ஓசை, போருக்கு விரைந்தோடும் பல குதிரைகளின் தேர்களின் ஓசையைப் போல் இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லாக: “போருக்கு ஓடும் பல குதிரைகளின் தேர்களின் ஓசையைப் போல்.”'
    reason: ἁρμάτων ἵππων πολλῶν τρεχόντων εἰς πόλεμον என்ற அடர்த்தியான கிரேக்கத் தொடரின் சொற்சொல் அமைப்பை வெளிப்படுத்துகிறது; குதிரைகளுக்கும் தேர்களுக்கும் இடையிலான உறவை விளக்கவுரையாகத் தீர்மானிப்பதில்லை.
lexical_decisions:
- source_word: θώρακας ὡς θώρακας σιδηροῦς
  choice: இரும்புக் கவசங்களைப் போன்ற மார்புக் கவசங்கள்
  rationale: θώραξ மார்பு அல்லது உடற்பகுதியைப் பாதுகாக்கும் கவசத்தைக் குறிக்கிறது; மீண்டும் வரும் சொல்லையும் ὡς குறிக்கும் உவமையையும் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: φωνὴ τῶν πτερύγων αὐτῶν
  choice: அவற்றின் சிறகுகளின் ஓசை
  rationale: இங்கு φωνή குரலை அல்ல, கேட்கப்படும் ஒலியைக் குறிக்கிறது; πτέρυξ என்பதற்கு இயல்பான தமிழ் ‘சிறகு’.
- source_word: ἁρμάτων ἵππων πολλῶν
  choice: பல குதிரைகளின் தேர்கள்
  rationale: கிரேக்கத்தின் ‘பல குதிரைகளின் தேர்கள்’ என்ற சொல் உறவை வெளிப்படையாக வைத்திருக்கிறது; ‘குதிரை பூட்டிய தேர்கள்’ என உறவை ஒரே வகையில் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: τρεχόντων εἰς πόλεμον
  choice: போருக்குள் விரைந்தோடும்
  rationale: τρέχω என்பதன் வேகமான இயக்கத்தையும் εἰς πόλεμον என்பதன் போர்நோக்கிய நகர்வையும் உயிரோட்டமான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: யோவானின் தரிசனக் காட்சியின் இயல்பு
  choice: ὡς குறிக்கும் உவமைகளை நேரடியாகப் பாதுகாத்து, காட்சியில் உள்ள உயிரினங்களை வேறு எந்தப் பொருளுடனும் அடையாளப்படுத்தாமல் மொழிபெயர்த்தல்
  alternative: அவற்றை நேரடியான இராணுவப் படை, இயந்திரம், பேய் அல்லது குறிப்பிட்ட அடையாளச் சின்னம் என்று விளக்குதல்
  rationale: மூலவசனம் ஒப்புமைகளையே தருகிறது; விவாதத்திற்குரிய வெளிப்படுத்தல் நூல் அடையாளத்தை மொழிபெயர்ப்பே தீர்மானிக்கக் கூடாது.
translation_notes:
  register: நவீன தரமான, கண்ணியமான தமிழ். வெளிப்படுத்தல் நூலின் உயிரோட்டமான ஒலி உவமை பாதுகாக்கப்பட்டுள்ளது; தேவையற்ற விளக்கவுரை சேர்க்கப்படவில்லை.
