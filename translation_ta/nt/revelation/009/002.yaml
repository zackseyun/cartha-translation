id: REV.9.2
reference: Revelation 9:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἤνοιξεν τὸ φρέαρ τῆς ἀβύσσου, καὶ ἀνέβη καπνὸς ἐκ τοῦ φρέατος ὡς καπνὸς καμίνου ⸀μεγάλης, καὶ ⸀ἐσκοτώθη ὁ ἥλιος καὶ ὁ ἀὴρ ἐκ τοῦ καπνοῦ τοῦ φρέατος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/002.yaml
  text: And he opened the shaft of the abyss[a], and smoke went up from the shaft like the smoke of a great furnace, and the sun and the air were darkened by the smoke from the shaft.
translation:
  language: ta
  text: அவன் ஆழ்குழியின் துவாரத்தை[a] திறந்தான். அந்தத் துவாரத்திலிருந்து, ஒரு பெரும் உலையின் புகையைப் போன்ற புகை மேலெழுந்தது. துவாரத்திலிருந்து வந்த புகையால் சூரியனும் காற்றுமண்டலமும் இருண்டன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆழ்குழியின் செங்குத்துப் பாதை’; மரபுவழியாக, ‘அடிப்பகுதியில்லாத குழி.’
    reason: φρέαρ என்பது குழி, கிணறு, அல்லது ஆழத்திற்குச் செல்லும் செங்குத்துத் திறப்பைக் குறிக்கலாம்; மரபுவழி மொழிபெயர்ப்பு ἄβυσσος என்பதைக் கூடுதல் விளக்கத்துடன் வழங்குகிறது.
lexical_decisions:
- source_word: ἤνοιξεν
  choice: திறந்தான்
  rationale: ἀνοίγω என்பதன் இறந்தகாலச் செயலை நேரடியாகக் காட்டுகிறது; ‘பூட்டைத் திறந்தான்’ என்பது மூலத்தில் இல்லாத முறையைச் சேர்த்துவிடும்.
- source_word: φρέαρ
  choice: துவாரம்
  rationale: ஆழ்குழியையும் அதற்கான திறப்பையும் ஒன்றாகக் கலக்காமல், அதற்குள் செல்லும் திறப்பு அல்லது செங்குத்துப் பாதை என்ற படிமத்தை இயல்பான தமிழில் தருகிறது.
- source_word: ἀβύσσου
  choice: ஆழ்குழியின்
  rationale: ἄβυσσος குறிக்கும் அளவிட முடியாத ஆழத்தின் படிமத்தைப் பேணுகிறது; மரபுவழி விளக்கமான ‘அடிப்பகுதியில்லாத குழி’ என்பதை முதன்மை உரையில் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: ἀνέβη
  choice: மேலெழுந்தது
  rationale: புகையின் மேல்நோக்கிய இயக்கத்தை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: καπνὸς
  choice: புகை
  rationale: நேரான சொற்பொருள்; வசனம் முழுவதும் ஒரே சொல்லாகப் பேணப்பட்டுள்ளது.
- source_word: ὡς καπνὸς καμίνου μεγάλης
  choice: ஒரு பெரும் உலையின் புகையைப் போன்ற
  rationale: ὡς குறிக்கும் ஒப்புமையையும் κάμινος குறிக்கும் உலைப் படிமத்தையும், μεγάλης என்பதன் பெருமையையும் பேணுகிறது.
- source_word: ἐσκοτώθη
  choice: இருண்டன
  rationale: சூரியன், காற்றுமண்டலம் ஆகிய கூட்டெழுவாய்க்கு இயல்பான தமிழ்ப் பன்மையைப் பயன்படுத்தி, அவை புகையால் இருளாக்கப்பட்டன என்ற செயல்பாட்டு விளைவைக் காக்கிறது.
- source_word: ὁ ἀὴρ
  choice: காற்றுமண்டலம்
  rationale: ἀήρ குறிக்கும் காற்று அல்லது வளிமண்டலத்தைத் தருகிறது; ‘வானம்’ என்று மொழிபெயர்த்து காணக்கூடிய வானத்துக்கு மட்டும் பொருளை மாற்றவில்லை.
- source_word: ἐκ τοῦ καπνοῦ τοῦ φρέατος
  choice: துவாரத்திலிருந்து வந்த புகையால்
  rationale: ἐκ என்பதிலுள்ள மூலத்தையும் காரணத்தையும் இயல்பான தமிழில் ஒருங்கே வெளிப்படுத்துகிறது.
theological_decisions:
- issue: வெளிப்படுத்தின விசேஷத்தின் தரிசன மொழியில் வரும் இடப்பெயர்ச்சொற்களை மரபுவழி விளக்கத்தைச் சேர்க்காமல் மொழிபெயர்த்தல்
  choice: ἄβυσσος என்பதற்கு ‘ஆழ்குழி’ என்றும் φρέαρ என்பதற்கு ‘துவாரம்’ என்றும் மொழிபெயர்த்து, ‘ஆழ்குழியின் துவாரம்’ என வழங்கப்பட்டது.
  alternative: ‘அடிப்பகுதியில்லாத குழி’ அல்லது ‘ஆழ்குழியின் செங்குத்துப் பாதை’
  rationale: இது ஆழ்குழியையும் அதற்கான திறப்பையும் வேறுபடுத்திக் காட்டுகிறது. மேலும், ἄβυσσος என்ற சொல்லின் நேரடிப் படிமத்தைத் தாண்டிச் செல்லும் மரபுவழி ‘அடிப்பகுதியில்லாத குழி’ என்ற விளக்கத்தை முதன்மை உரையில் திணிக்காமல் உண்மையான படிமத் திறப்பைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான தரிசனநடை பயன்படுத்தப்பட்டுள்ளது. ‘துவாரம்,’ ‘ஆழ்குழி,’ ‘காற்றுமண்டலம்’ ஆகிய சொற்கள் மூலத்தின் இடவியல் மற்றும் வளிமண்டலப் படிமங்களைத் தெளிவாகப் பேணுகின்றன.
