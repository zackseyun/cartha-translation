id: REV.9.11
reference: Revelation 9:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸂ἔχουσιν ἐπ’ αὐτῶν βασιλέα τὸν⸃ ἄγγελον τῆς ἀβύσσου· ὄνομα αὐτῷ Ἑβραϊστὶ Ἀβαδδών ⸂καὶ ἐν⸃ τῇ Ἑλληνικῇ ὄνομα ἔχει Ἀπολλύων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/011.yaml
  text: They have over them as king the angel of the abyss[a]. His name in Hebrew is Abaddon[c][b], and in Greek he has the name Apollyon.
translation:
  language: ta
  text: அவை தங்கள்மேல் அரசனாக ஆழ்குழியின் தேவதூதனைக்[a] கொண்டிருக்கின்றன. எபிரெய மொழியில் அவனுடைய பெயர் அபத்தோன்[b]; கிரேக்க மொழியில் அவனுக்கு அப்பொல்லியோன்[c] என்ற பெயர் உண்டு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அடித்தளமற்ற குழியின் தேவதூதன்.”
    reason: alternative_reading
  - marker: b
    text: “அபத்தோன்” என்பது அழிவுடன் தொடர்புடைய எபிரெயப் பெயர்.
    reason: lexical_alternative
  - marker: c
    text: “அப்பொல்லியோன்” என்ற கிரேக்கப் பெயருக்கு “அழிப்பவன்” என்று பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχουσιν ἐπ’ αὐτῶν βασιλέα
  choice: அவை தங்கள்மேல் அரசனாக ... கொண்டிருக்கின்றன
  rationale: ‘அவை கொண்டிருக்கின்றன’ என்ற கிரேக்க வினையமைப்பையும், ἐπί என்பதன் ‘தங்கள்மேல்’ என்ற ஆட்சிப் பொருளையும் காக்கிறது. முந்தைய சூழலில் கூறப்பட்ட வெட்டுக்கிளி போன்ற உயிரினங்களே எழுவாய்.
- source_word: τὸν ἄγγελον τῆς ἀβύσσου
  choice: ஆழ்குழியின் தூதன்
  rationale: ἄγγελος இங்கு மனிதத் தூதுவரைக் காட்டிலும் வானுலகத் தூதனைக் குறிக்கிறது. ἄβυσσος என்பதற்கு ‘ஆழ்குழி’ நேரடியான, இயல்பான தமிழாக்கம்; ‘அடிப்பகுதி இல்லாத குழி’ என்பது விளக்கமான மாற்று.
- source_word: Ἑβραϊστὶ
  choice: எபிரெய மொழியில்
  rationale: ‘எபிரெய மொழியில்’ என்று பொருள்படும் வினையடைத் தொடரைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: Ἀβαδδών
  choice: அபத்தோன்
  rationale: இது இங்கு பெயராகச் செயல்படுவதால் மொழிபெயர்க்காமல் தமிழில் ஒலிபெயர்க்கப்படுகிறது; அதன் ‘அழிவு’ சார்ந்த பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: καὶ ἐν τῇ Ἑλληνικῇ
  choice: கிரேக்க மொழியில்
  rationale: எபிரெயப் பெயருக்கும் கிரேக்கப் பெயருக்கும் உள்ள வெளிப்படையான மொழி வேறுபாட்டை இயல்பான தமிழில் காக்கிறது.
- source_word: ὄνομα ἔχει Ἀπολλύων
  choice: அவனுக்கு அப்பொல்லியோன் என்ற பெயர் உண்டு
  rationale: கிரேக்கத்தின் ‘பெயர் உண்டு’ என்ற மீளுரைப்பை இயல்பான தமிழில் பாதுகாக்கிறது; பெயர் ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: Ἀβαδδών, Ἀπολλύων ஆகியவற்றைப் பெயர்களாக ஒலிபெயர்ப்பதா அல்லது அவற்றின் பொருளை மொழிபெயர்ப்பதா
  choice: முதன்மை உரையில் ‘அபத்தோன்’, ‘அப்பொல்லியோன்’ என்று ஒலிபெயர்த்தல்
  alternative: ‘அழிவு’, ‘அழிப்பவன்’ என்று மொழிபெயர்த்தல்
  rationale: இரு சொற்களும் அந்தத் தூதனுக்கு வழங்கப்பட்ட பெயர்களாக இலக்கணத்தில் செயல்படுகின்றன. அதேவேளையில், அவற்றின் சொற்பொருள் வசனத்தின் நோக்கத்திற்கு முக்கியமானதால் அடிக்குறிப்புகளில் காக்கப்படுகிறது.
- issue: ἀβύσσου என்பதன் உருவகம்
  choice: ஆழ்குழி
  alternative: அடிப்பகுதி இல்லாத குழி
  rationale: ‘ஆழ்குழி’ மூலச்சொல்லின் உருவகத்தைச் சுருக்கமாகவும் நேரடியாகவும் தருகிறது; பாரம்பரிய மாற்று அதிக விளக்கமுடையது, ஆனால் கிரேக்கத்தில் ‘அடிப்பகுதி இல்லாத’ என்பது வெளிப்படையாக இல்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. கிரேக்க வாக்கியத்தின் ‘அவை ... கொண்டிருக்கின்றன’ என்ற அமைப்பும், எபிரெயம்–கிரேக்கம் என்ற இணை அமைப்பும் இயன்றவரை காக்கப்பட்டுள்ளன. பெயர்களுக்கு தமிழ் கிறிஸ்தவ வாசகர்களிடையே அறிமுகமான ‘அபத்தோன்’, ‘அப்பொல்லியோன்’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
