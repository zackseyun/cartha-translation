id: REV.9.13
reference: Revelation 9:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕκτος ἄγγελος ἐσάλπισεν· καὶ ἤκουσα φωνὴν μίαν ἐκ ⸀τῶν κεράτων τοῦ θυσιαστηρίου τοῦ χρυσοῦ τοῦ ἐνώπιον τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/013.yaml
  text: And the sixth angel blew his trumpet[a], and I heard one voice from the horns of the golden altar that is before God,
translation:
  language: ta
  text: ஆறாம் தேவதூதர் எக்காளம் ஊதினார்; தேவனுக்கு முன்பாக உள்ள பொன் பலிபீடத்தின் கொம்புகளிலிருந்து ஒரு குரலைக் கேட்டேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரே குரல்.’ கிரேக்கத்தில் குரல் ஒன்றே எனக் குறிப்பிடப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: எக்காளம் ஊதினார்
  rationale: σαλπίζω என்பது எக்காளத்தை ஊதுவதைக் குறிக்கிறது. தமிழில் பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்க ‘எக்காளம் ஊதினார்’ என வெளிப்படையாக மொழிபெயர்க்கப்பட்டது.
- source_word: φωνὴν μίαν
  choice: ஒரே குரலை
  rationale: μίαν தரும் ஒருமை அழுத்தத்தை ‘ஒரே’ என்பது காக்கிறது; குரல் யாருடையது என்பதை உரை கூறாததால் அது குறிப்பிடப்படவில்லை.
- source_word: ἐκ τῶν κεράτων
  choice: கொம்புகளிலிருந்து
  rationale: ἐκ மூலத்தையோ தோற்ற இடத்தையோ குறிக்கிறது; κέρατα பலிபீடத்தின் கொம்பு போன்ற நீட்சிகளைக் குறிக்கிறது.
- source_word: θυσιαστηρίου τοῦ χρυσοῦ
  choice: பொன் பலிபீடத்தின்
  rationale: வானகப் பரிசுத்த இடத்தின் காட்சியைக் காத்தபடி, இந்தத் தொடரை இயல்பான தமிழில் ‘பொன் பலிபீடம்’ என வழங்குகிறது.
- source_word: τοῦ ἐνώπιον τοῦ θεοῦ
  choice: தேவனுக்கு முன்பாக இருக்கும்
  rationale: ἐνώπιον என்பது ஒருவருக்கு முன்பாக அல்லது அவரது முன்னிலையில் இருக்கும் நிலையைக் குறிக்கிறது; இங்கு இடநிலையைத் தெளிவாகக் காக்கிறது.
- source_word: ἄγγελος
  choice: தூதர்
  rationale: வெளிப்படுத்தின விசேஷத்தின் தரிசனச் சூழலில் இது மனிதத் தூதரை அல்ல, வானதூதரைக் குறிக்கிறது; தமிழில் வழக்கமான வேதாகமச் சொல்லான ‘தூதர்’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: குரலின் அடையாளம்
  choice: ‘ஒரே குரல்’ என்று மட்டும் கூறி அதன் உரிமையாளரைத் தீர்மானிக்காமல் விடுதல்
  alternative: தேவனுடைய குரல்; ஒரு தூதரின் குரல்; பலிபீடத்துடன் தொடர்புடைய குரல்
  rationale: கிரேக்க உரை பொன் பலிபீடத்தின் கொம்புகளிலிருந்து வந்த ‘ஒரே குரல்’ என்று மட்டுமே கூறுகிறது. அது யாருடைய குரல் என்பதை மொழிபெயர்ப்பில் சேர்ப்பது உரையின் உண்மையான தெளிவின்மையை நீக்கிவிடும்.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘ஒரே குரல்’ என்பது மூலத்தின் ஒருமை அழுத்தத்தைக் காக்கிறது; வாக்கியத்தின் காட்சிசார் மற்றும் வழிபாட்டிட உருவகங்கள் சுருக்கப்படவில்லை.
