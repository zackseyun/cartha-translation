- source_word: τοὺς δεδεμένους
  choice: கட்டப்பட்ட நிலையில் இருக்கும்
  rationale: முன்பு கட்டப்பட்டதன் விளைவாக இப்போதும் நீடிக்கும் கட்டுப்பட்ட நிலையை உணர்த்தும் கிரேக்க நிறைவு காலச் செயப்பாட்டு பெயரெச்சத்தின் வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: ἐπὶ τῷ ποταμῷ
  choice: நதியருகே
