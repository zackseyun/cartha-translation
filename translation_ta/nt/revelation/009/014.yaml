  text: ⸀λέγοντα τῷ ἕκτῳ ἀγγέλῳ, ὁ ἔχων τὴν σάλπιγγα· Λῦσον τοὺς τέσσαρας ἀγγέλους τοὺς δεδεμένους ἐπὶ τῷ ποταμῷ τῷ μεγάλῳ Εὐφράτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/014.yaml
  text: saying to the sixth angel[a], the one who had the trumpet, “Release the four angels who are bound at the great river Euphrates.”
translation:
  language: ta
  text: எக்காளத்தை வைத்திருந்த ஆறாவது தூதனிடம், “பெரிய யூபிராத்து நதியருகே கட்டப்பட்ட நிலையில் இருக்கும் நான்கு தூதர்களை விடுவி” என்று அது சொன்னது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கட்டப்பட்டிருக்கிற’ அல்லது ‘கட்டப்பட்டவர்களாகிய’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்க நிறைவு காலப் பெயரெச்சம், முன்பு கட்டப்பட்டதன் விளைவாக அவர்கள் தொடர்ந்து கட்டுப்பட்ட நிலையில் இருப்பதை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντα
  choice: என்று அது சொன்னது
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட பலிபீடத்திலிருந்து வந்த குரலே பேசுகிறது என்பதைத் தமிழில் தெளிவாக இணைக்கிறது; கிரேக்க நிகழ்காலப் பெயரெச்சத்தின் தொடர்ச்சியான பேச்சுச் செயலை இயல்பான தமிழ் வாக்கிய அமைப்பில் தருகிறது.
- source_word: τῷ ἕκτῳ ἀγγέλῳ
  choice: ஆறாவது தூதனிடம்
  rationale: வேற்றுமை உருபுடைய மறைமுகச் செயப்படுபொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ὁ ἔχων τὴν σάλπιγγα
  choice: எக்காளத்தை வைத்திருந்த
  rationale: குறிப்பிடப்படும் ஆறாவது தூதனை அடையாளப்படுத்தும் பெயரெச்சத் தொடரின் பொருளைப் பாதுகாக்கிறது; இச்சூழலில் உடைமை அல்லது தன்னிடம் கொண்டிருத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Λῦσον
  choice: அவிழ்த்துவிடு
  rationale: λύω என்ற வினையின் கட்டை நீக்கி விடுவிக்கும் பொருளையும் ஒருமை ஏவல் வடிவையும் தெளிவாகக் காட்டுகிறது.
- source_word: τοὺς τέσσαρας ἀγγέλους
