- source_word: τῷ μεγάλῳ Εὐφράτῃ
  choice: பெரிய நதியாகிய யூபிராத்து
  rationale: நதிக்கான ‘பெரிய’ என்ற அடைமொழியையும் யூபிராத்து என்ற இயற்பெயரையும் கிரேக்க இணைப்புக்கு ஏற்ப பாதுகாக்கிறது.
theological_decisions:
- issue: நான்கு தூதர்களின் அடையாளமும் ஒழுக்க நிலையும்
  choice: ‘நான்கு தூதர்கள்’ என்று மட்டும் மொழிபெயர்த்து, அவர்கள் பரிசுத்த தூதர்களா அல்லது விழுந்த தூதர்களா என்பதைச் சேர்க்கவில்லை.
  alternative: ‘விழுந்த நான்கு தூதர்கள்’ அல்லது ‘நியாயத்தீர்ப்புக்காக நியமிக்கப்பட்ட நான்கு தூதர்கள்’
  rationale: இவ்வசனம் அவர்களைக் யூபிராத்து நதியருகே கட்டப்பட்டுள்ள தூதர்கள் என்று மட்டுமே அடையாளப்படுத்துகிறது. கூடுதல் அடைமொழி உரையில் வெளிப்படையாக இல்லாத இறையியல் முடிவைத் திணிக்கும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் dignified ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘எக்காளம்’, ‘தூதன்’, ‘யூபிராத்து’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறி [a] முதன்மை உரையில் இடப்பட்டுள்ளது.
