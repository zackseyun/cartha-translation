revisions:
- from: எக்காளத்தை வைத்திருந்த ஆறாவது தூதனிடம், “பெரிய நதியாகிய யூபிராத்து நதியருகே கட்டப்பட்ட நிலையில் இருக்கும் நான்கு தூதர்களை அவிழ்த்துவிடு” என்று அது சொன்னது.[a]
  to: எக்காளத்தை வைத்திருந்த ஆறாவது தூதனிடம், “பெரிய யூபிராத்து நதியருகே கட்டப்பட்ட நிலையில் இருக்கும் நான்கு தூதர்களை விடுவி” என்று அது சொன்னது.[a]
  rationale: 'The revision makes two limited idiomatic adjustments: it uses ‘விடுவி’ for the command to release and streamlines the Euphrates locative phrase. It does not identify the angels’ moral status or alter the perfect participle’s ongoing-result sense.'
