source:
  edition: SBLGNT
  text: καὶ ἐλύθησαν οἱ τέσσαρες ἄγγελοι οἱ ἡτοιμασμένοι εἰς τὴν ὥραν ⸀καὶ ἡμέραν καὶ μῆνα καὶ ἐνιαυτόν, ἵνα ἀποκτείνωσιν τὸ τρίτον τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/015.yaml
  text: And the four angels who had been prepared for the hour and day and month and year were released[b][a], so that they might kill a third of humanity.
translation:
  language: ta
  text: அந்த மணிநேரத்திற்கும் நாளுக்கும் மாதத்திற்கும் ஆண்டிற்குமாக ஆயத்தப்படுத்தப்பட்டிருந்த அந்த நான்கு வானதூதர்கள், மனிதர்களில் மூன்றில் ஒரு பகுதியினரைக் கொல்வதற்காக விடுவிக்கப்பட்டார்கள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதனை, ‘இந்த மணிநேரத்திற்கும் நாளுக்கும் மாதத்திற்கும் ஆண்டிற்குமாக’ என்றும் மொழிபெயர்க்கலாம். இந்தக் காலத் தொடர், துல்லியமாக நிர்ணயிக்கப்பட்ட ஒரு தருணத்தை வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'வேறு மொழிபெயர்ப்பு: ‘மனுக்குலத்தில் மூன்றில் ஒரு பகுதியினரை.’ கிரேக்கச் சொல் ஆண்களை மட்டும் அல்ல, மனிதர்களைப் பொதுவாகக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλύθησαν
  choice: விடுவிக்கப்பட்டார்கள்
  rationale: λύω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவம். முந்தைய வசனத்தில் கட்டப்பட்டிருந்த வானதூதர்களைக் குறிப்பதால், செயப்பாட்டு பொருளையும் இயல்பான நவீனத் தமிழையும் இது காக்கிறது.
- source_word: ἄγγελοι
  choice: வானதூதர்கள்
  rationale: வெளிப்படுத்தின விசேஷத்தின் தரிசனச் சூழலில் மனிதத் தூதர்கள் அல்ல, இயற்கைக்கு அப்பாற்பட்டவர்களே குறிக்கப்படுகிறார்கள்.
- source_word: ἡτοιμασμένοι
  choice: ஆயத்தப்படுத்தப்பட்டிருந்த
  rationale: முன்பே நிகழ்ந்த ஆயத்தத்தின் விளைவாக அவர்கள் தொடர்ந்து தயார் நிலையில் இருந்ததை நிறைவு செயப்பாட்டு எச்சவடிவம் உணர்த்துகிறது.
- source_word: εἰς τὴν ὥραν καὶ ἡμέραν καὶ μῆνα καὶ ἐνιαυτόν
  choice: அந்த மணி நேரத்திற்கும் நாளுக்கும் மாதத்திற்கும் ஆண்டிற்குமாக
  rationale: கிரேக்கச் சொற்களின் வரிசையையும் காலக் குறிப்புகளின் படிப்படியான துல்லியத்தையும் காக்கிறது; அவை ஒரு கால அளவின் கூட்டுத்தொகையா அல்லது துல்லியமாகக் குறிக்கப்பட்ட தருணமா என்பதை மொழிபெயர்ப்பே தீர்மானித்துவிடவில்லை.
- source_word: ἵνα ἀποκτείνωσιν
  choice: அவர்கள் ... கொல்வதற்காகவே
  rationale: ἵνα அறிமுகப்படுத்தும் நோக்கப் பொருளைத் தெளிவாகக் காட்டுகிறது; ἀποκτείνωσιν என்பதற்கு இன்றைய தமிழில் நேரடியான ‘கொல்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: τὸ τρίτον τῶν ἀνθρώπων
  choice: மனிதர்களில் மூன்றில் ஒரு பகுதியினரை
  rationale: பகுதிப்பொருளான τὸ τρίτον என்பதை இயல்பாக வெளிப்படுத்துகிறது. ἀνθρώπων என்பது ஆண்களை மட்டும் அல்லாமல் மனிதர்களைப் பொதுவாகக் குறிக்கிறது.
theological_decisions:
- issue: ‘மணி நேரம், நாள், மாதம், ஆண்டு’ என்ற காலத் தொடரின் பொருளும் வலிமையும்
  choice: தெய்வீகமாகத் துல்லியமாகக் குறிக்கப்பட்ட நேரத்தைச் சுட்டும் தொடராக மொழிபெயர்க்கப்பட்டது; ஆனால் ‘நியமிக்கப்பட்ட’ என்ற விளக்கச் சொல் மூலவாக்கியத்தில் சேர்க்கப்படவில்லை.
  alternative: ஓர் ஆண்டு, ஒரு மாதம், ஒரு நாள், ஒரு மணி நேரம் சேர்ந்த கால அளவு; அல்லது தெய்வீக நேர நிர்ணயத்தைப் பற்றிய பொதுவான கூற்று.
  rationale: ஒரே குறிப்புச் சுட்டின் கீழ் வரும் கால அலகுகள் துல்லியமான நேரத்தை இயல்பாக வலியுறுத்துகின்றன. ஆயினும், வெளிப்படுத்தல் நூலின் காலக்கணக்கை மொழிபெயர்ப்பில் முடிவுசெய்யாமல் மூலத்தின் பதற்றமும் சாத்தியமான தெளிவின்மையும் காக்கப்படுகின்றன.
- issue: ἀνθρώπων என்பதன் வரம்பு
  choice: மனிதர்கள்
  alternative: மனுக்குலம்; மக்கள்; ஆண்கள்
  rationale: இங்கு இச்சொல் ஆண்களை மட்டும் அல்லாமல் மனிதர்களைப் பொதுவாகக் குறிக்கிறது. ‘மனிதர்கள்’ என்பது அந்தப் பொதுவான வரம்பைத் துல்லியமாகவும் இயல்பாகவும் தருகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் தரிசன உரைக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வானதூதர்கள்’, ‘ஆயத்தப்படுத்தப்பட்டிருந்த’, ‘விடுவிக்கப்பட்டார்கள்’ ஆகியவை மூலத்தின் இயற்கைக்கு அப்பாற்பட்ட சூழல், முந்தைய ஆயத்த நிலை, செயப்பாட்டு வினை ஆகியவற்றை முறையே காக்கின்றன.
