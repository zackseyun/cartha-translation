  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ οὐ μετενόησαν ἐκ τῶν φόνων αὐτῶν οὔτε ἐκ τῶν ⸀φαρμάκων αὐτῶν οὔτε ἐκ τῆς πορνείας αὐτῶν οὔτε ἐκ τῶν κλεμμάτων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/021.yaml
  text: And they did not repent of their murders[a], or of their sorceries, or of their sexual immorality, or of their thefts.
translation:
  language: ta
  text: அவர்கள் தங்கள் கொலைகளிலிருந்தும், சூனியச் செயல்களிலிருந்தும்[a], பாலியல் ஒழுக்கக்கேட்டிலிருந்தும், திருட்டுகளிலிருந்தும் மனந்திரும்பவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘மந்திரச் செயல்கள்’; கிரேக்கச் சொல் மருந்துக் கலவைகள் அல்லது நஞ்சூட்டல்களோடும் தொடர்புடையதாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετενόησαν
  choice: மனந்திரும்பவில்லை
  rationale: இந்த அறநெறிச் சூழலில் μετανοέω என்பது வெறும் மனமாற்றத்தை அல்ல, பாவத்தை விட்டு மனந்திரும்புவதைக் குறிக்கிறது. தொடரும் ἐκ சொற்றொடர்களோடு இயல்பாக இணைவதற்காக ‘விட்டு மனந்திரும்பவில்லை’ என வழங்கப்பட்டுள்ளது.
- source_word: ἐκ
  choice: விட்டு
  rationale: மீண்டும் மீண்டும் வரும் ἐκ, குறிப்பிட்ட தீச்செயல்களிலிருந்து விலகுதலைக் குறிக்கிறது. தமிழில் ‘விட்டு மனந்திரும்புதல்’ இயல்பாகவும் பொருள் தெளிவாகவும் உள்ளது.
- source_word: φόνων
  choice: கொலைகள்
  rationale: φόνος என்பது பொதுவாகக் கொலை அல்லது உயிரைப் பறிக்கும் செயலைக் குறிக்கிறது; இங்குள்ள தீச்செயல் பட்டியலில் ‘கொலைகள்’ அதன் அறநெறி மற்றும் குற்றவியல் வலிமையைத் தக்கவைக்கிறது.
- source_word: φαρμάκων
  choice: சூனியச் செயல்கள்
  rationale: φάρμακον என்பதன் பொருள் மருந்துக் கலவைகள், நஞ்சுகள் அல்லது அவற்றோடு தொடர்புடைய மந்திர நடைமுறைகள் வரை விரியலாம். வெளிப்படுத்தின விசேஷத்தின் சூழலில் மறைமந்திர நடைமுறைகளே முதன்மையான பொருளாகத் தோன்றுவதால் ‘சூனியச் செயல்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: πορνείας
  choice: பாலியல் ஒழுக்கக்கேடு
  rationale: πορνεία பரந்த வகையான ஒழுக்கமற்ற பாலியல் நடத்தையைக் குறிக்க முடியும். ‘பாலியல் ஒழுக்கக்கேடு’ என்பது நவீன தமிழில் தெளிவானதும் தேவையின்றி பொருளைக் குறுக்காததும் ஆகும்.
- source_word: κλεμμάτων
  choice: திருட்டுகள்
  rationale: κλέμμα திருடப்பட்ட பொருளையோ திருடும் செயலையோ குறிக்கலாம்; தீச்செயல் பட்டியலில் பன்மையான ‘திருட்டுகள்’ இயல்பான தேர்வாகும்.
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: -ஐயோ ... -ஐயோ ... -ஐயோ
  rationale: தொடக்க மறுப்புக்குப் பின் வரும் ஒவ்வொரு மாற்றையும் தமிழில் ‘-ஐயோ’ என்ற இணை அமைப்பு இயல்பாகக் குறிக்கிறது; கிரேக்கத்தின் தொடர்ச்சியான மறுப்புப் பட்டியலும் காக்கப்படுகிறது.
theological_decisions:
- issue: வெளிப்படுத்தின விசேஷத்தின் தீச்செயல் பட்டியலில் φαρμάκων என்பதன் பொருள் வரம்பு
  choice: சூனியச் செயல்கள்
  alternative: மந்திரச் செயல்கள்; மருந்துக் கலவைகள்; நஞ்சூட்டல்கள்
  rationale: இந்த நூலில் தொடர்புடைய சொற்கள் பொதுவாகச் சூனியம் அல்லது மந்திர நடைமுறைகளைக் குறிக்கின்றன. அதேவேளையில், மூலச்சொல்லின் மருந்துக் கலவை அல்லது நஞ்சு சார்ந்த பொருள் சாத்தியத்தை அமைதியாக நீக்காமல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியக்கூடிய, மரியாதைமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. αὐτῶν என்பதன் மீளுரைப்பை தமிழில் சொற்சொல்லாக ஒவ்வொரு உறுப்பிலும் மீளாமல், ‘தாங்கள் செய்த’ என்பது முழுப் பட்டியலுக்கும் பொருந்துமாறு அமைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறி அதற்குரிய ‘சூனியச் செயல்கள்’ என்பதன் பின்னரே இடப்பட்டுள்ளது.
