id: REV.9.3
reference: Revelation 9:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐκ τοῦ καπνοῦ ἐξῆλθον ἀκρίδες εἰς τὴν γῆν, καὶ ἐδόθη αὐταῖς ἐξουσία ὡς ἔχουσιν ἐξουσίαν οἱ σκορπίοι τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/003.yaml
  text: And out of the smoke came locusts onto the earth[a], and authority was given to them, as the scorpions of the earth have authority.
translation:
  language: ta
  text: புகையிலிருந்து வெட்டுக்கிளிகள் வெளியேறிப் பூமியின்மேல் வந்தன. பூமியிலுள்ள தேள்களுக்கு அதிகாரம் இருப்பதுபோல, அவற்றுக்கும் அதிகாரம்[a] கொடுக்கப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வல்லமை’. கிரேக்கச் சொல் அதிகாரம், உரிமை, அல்லது வல்லமை ஆகியவற்றைக் குறிக்கலாம். இங்கு அது கொடுக்கப்பட்டதாகச் சொல்லப்படுவதால் ‘அதிகாரம்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ καπνοῦ
  choice: புகையிலிருந்து
  rationale: ἐκ என்பது உள்ளிருந்து வெளியே வரும் இயக்கத்தைக் குறிக்கிறது; தமிழில் ‘புகையிலிருந்து’ இயல்பாகவும் தெளிவாகவும் அந்தத் தோற்றத்தை வெளிப்படுத்துகிறது.
- source_word: ἐξῆλθον
  choice: வெளியேறி ... வந்தன
  rationale: ἐξέρχομαι என்பதன் வெளியே வரும் இயக்கத்தைத் தெளிவாகக் காக்கிறது; புகையிலிருந்து வெளிப்பட்டு பூமியின்மேல் வந்த நிகழ்வை இயல்பான தமிழில் அளிக்கிறது.
- source_word: ἀκρίδες
  choice: வெட்டுக்கிளிகள்
  rationale: இச்சொல் பொதுவாகப் பயிர்களை அழிக்கும் கூட்டமாக வரும் locusts-ஐக் குறிக்கிறது; நவீனத் தமிழில் இதற்கான வழக்கமான சொல் ‘வெட்டுக்கிளிகள்’.
- source_word: εἰς τὴν γῆν
  choice: பூமியின்மேல்
  rationale: εἰς காட்டும் திசைநோக்கிய இயக்கத்தையும், வெளிப்படுத்தலில் γῆ என்பதற்குள்ள பரந்த ‘பூமி’ என்ற பொருளையும் காக்கிறது.
- source_word: ἐδόθη αὐταῖς ἐξουσία
  choice: அவற்றுக்கும் அதிகாரம் கொடுக்கப்பட்டது
  rationale: ἐξουσία என்பதன் அனுமதிக்கப்பட்ட அதிகாரம் அல்லது உரிமை சார்ந்த நுணுக்கத்தை ‘அதிகாரம்’ காக்கிறது. செயப்பாட்டு வடிவம் கொடுத்தவர் யார் என்பதை உரையில் சேர்க்காமல் விடுகிறது.
- source_word: ὡς ἔχουσιν ἐξουσίαν
  choice: அதிகாரம் இருப்பதுபோல
  rationale: ὡς அறிமுகப்படுத்தும் ஒப்பீட்டையும், கிரேக்கத்தில் ἐξουσία மீண்டும் வருவதையும் தமிழில் நேரடியாகப் பாதுகாக்கிறது.
- source_word: οἱ σκορπίοι τῆς γῆς
  choice: பூமியிலுள்ள தேள்கள்
  rationale: சொல்லுக்குச் சொல் ‘பூமியின் தேள்கள்’ என்பது தமிழில் செயற்கையாக ஒலிக்கும்; ‘பூமியிலுள்ள தேள்கள்’ மூலத்தின் தொடர்பை இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: வெட்டுக்கிளிகளுக்குக் கொடுக்கப்பட்ட திறனின் இயல்பு
  choice: ἐξουσία என்பதை ‘அதிகாரம்’ என்று மொழிபெயர்த்து, ‘கொடுக்கப்பட்டது’ என்ற செயப்பாட்டு வடிவத்தைக் காத்தல்
  alternative: ‘வல்லமை’ அல்லது ‘சக்தி’ என்று மொழிபெயர்த்தல்; அல்லது கொடுத்தவர் யார் என்பதை வெளிப்படையாகச் சேர்த்தல்
  rationale: மூலச்சொல் வெறும் உடல் வலிமையை மட்டும் அல்லாமல் அளிக்கப்பட்ட உரிமை அல்லது அனுமதியையும் குறிக்கலாம். செயப்பாட்டு வடிவம் அவற்றின் செயல் தன்னிச்சையானது அல்ல என்ற சாயலைக் காக்கிறது; அதேவேளையில் கொடுத்தவரை மொழிபெயர்ப்பில் அடையாளப்படுத்துவதில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘தேள்களுக்கு அதிகாரம்’ என்பது தமிழில் ஓரளவு அசாதாரணமாகத் தோன்றினாலும், மூலத்தில் இருமுறை வரும் ἐξουσία மற்றும் அதன் வெளிப்படுத்தல் நூலுக்குரிய இறையியல் பதற்றம் மறையாமல் வைக்கப்பட்டுள்ளது.
