id: REV.9.7
reference: Revelation 9:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ τὰ ὁμοιώματα τῶν ἀκρίδων ὅμοια ἵπποις ἡτοιμασμένοις εἰς πόλεμον, καὶ ἐπὶ τὰς κεφαλὰς αὐτῶν ὡς στέφανοι ⸂ὅμοιοι χρυσῷ⸃, καὶ τὰ πρόσωπα αὐτῶν ὡς πρόσωπα ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/007.yaml
  text: And the appearance of the locusts was like horses prepared for battle[a], and on their heads were what seemed to be crowns like gold, and their faces were like human faces[b],
translation:
  language: ta
  text: வெட்டுக்கிளிகளின் தோற்றம் போருக்குத் தயாராக்கப்பட்ட குதிரைகளைப் போல இருந்தது. அவற்றின் தலைகளின்மேல் கிரீடங்களைப் போலவும் தங்கத்தைப் போலவும் இருந்தவை காணப்பட்டன[a]. அவற்றின் முகங்கள் மனித முகங்களைப் போல இருந்தன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வெற்றி மாலைகள்.’ στέφανοι என்ற கிரேக்கச் சொல் மரியாதை அல்லது வெற்றியுடன் தொடர்புடைய மாலை வடிவ கிரீடங்களையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில், ‘மனிதர்களின் முகங்கள்’; இந்தச் சொற்றொடர் ஆண்களை மட்டும் அல்ல, மனிதர்களைப் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ὁμοιώματα τῶν ἀκρίδων
  choice: அந்த வெட்டுக்கிளிகள் பார்ப்பதற்கு
  rationale: ὁμοίωμα என்பது வடிவம், தோற்றம் அல்லது ஒப்புமையைக் குறிக்கலாம். தமிழில் ‘தோற்றங்கள்’ என்று பன்மையில் கூறுவது செயற்கையாக இருப்பதால், காட்சியில் அவை எப்படித் தோன்றின என்பதை இயல்பாக வெளிப்படுத்த ‘பார்ப்பதற்கு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ἀκρίδων
  choice: வெட்டுக்கிளிகள்
  rationale: ἀκρίς என்பதற்கான வழக்கமான, தெளிவான தமிழ் இணைச்சொல்; வெளிப்படுத்தின விசேஷக் காட்சி அதன் அடிப்படைப் பொருளை மாற்றுவதில்லை.
- source_word: ὅμοια ἵπποις ἡτοιμασμένοις εἰς πόλεμον
  choice: போருக்குத் தயாராக்கப்பட்ட குதிரைகளைப் போல
  rationale: ὅμοια குறிக்கும் ஒப்புமையையும், ἡτοιμασμένοις குறிக்கும் தயாரான நிலையையும், போர்சார் காட்சியையும் பாதுகாக்கிறது.
- source_word: ἐπὶ τὰς κεφαλὰς αὐτῶν
  choice: அவற்றின் தலைகளின்மேல்
  rationale: ἐπί என்பதன் இடம்சார் பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὡς στέφανοι ὅμοιοι χρυσῷ
  choice: தங்கத்தைப் போன்ற கிரீடங்கள் இருப்பதுபோல் தோன்றியது
  rationale: ὡς மற்றும் ὅμοιοι ஆகிய இரு ஒப்புமைக் குறிகளையும் பாதுகாத்து, அவை உண்மையாகத் தங்கத்தால் செய்யப்பட்டவை அல்லது உண்மையான கிரீடங்களே என்று உரை கூறுவதைத் தவிர்க்கிறது.
- source_word: στέφανοι
  choice: கிரீடங்கள்
  rationale: στέφανος கிரீடத்தையோ மரியாதை அல்லது வெற்றியுடன் தொடர்புடைய மாலை வடிவ முடியையோ குறிக்கலாம். பொதுவாகப் புரியும் ‘கிரீடங்கள்’ முதன்மை உரையில் வைக்கப்பட்டு, குறிப்பான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τὰ πρόσωπα αὐτῶν ὡς πρόσωπα ἀνθρώπων
  choice: அவற்றின் முகங்கள் மனித முகங்களைப் போல
  rationale: πρόσωπα என்பதன் தெளிவான காட்சிப் பொருளையும், ἄνθρωποι என்பதன் பாலினப் பொதுமையையும், ὡς குறிக்கும் ஒப்புமையையும் பாதுகாக்கிறது.
theological_decisions:
- issue: வெளிப்படுத்தின விசேஷக் காட்சியின் ஒப்புமை மொழி
  choice: 'ஒவ்வொரு காட்சிக் கூறும் ஒப்புமையாகவே மொழிபெயர்க்கப்பட்டது: ‘போல’, ‘இருப்பதுபோல் தோன்றியது’, ‘போன்ற’.'
  alternative: குதிரைகள், தங்கக் கிரீடங்கள், மனித முகங்கள் என நேரடியான அடையாளக் கூற்றுகளாக மொழிபெயர்த்தல்.
  rationale: மூலத்தில் ὅμοια, ὡς, ὅμοιοι, ὡς என மீண்டும் மீண்டும் வரும் ஒப்புமைக் குறிகள், காட்சியில் காணப்பட்ட ஒற்றுமையைச் சொல்கின்றன; அவற்றின் இயல்பு உண்மையில் அதுவே என்று முடிவுசெய்வதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. கிரேக்கத்தின் தொடர்ச்சியான ‘καί’ இணைப்புகளை அப்படியே நீண்ட ஒரே வாக்கியமாக்காமல், காட்சியின் மூன்று கூறுகளாகப் பிரித்தது தமிழ் வாசிப்பின் இயல்புக்காகும். அடிக்குறிப்பு [a] அது விளக்கும் στέφανοι என்பதற்குப் பின் வைக்கப்பட்டது.
