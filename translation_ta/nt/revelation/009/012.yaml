  text: The first woe has passed[a]. Behold[b], two woes are still coming after these things.
translation:
  language: ta
  text: முதல் ஐயோ கடந்துபோயிற்று[a]. இதோ, இவற்றுக்குப் பிறகு இன்னும் இரண்டு ஐயோக்கள் வருகின்றன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அந்த ஓர் ஐயோ கடந்துபோயிற்று’; கிரேக்கத்தில் சொல்லுக்கு நெருக்கமாக ‘அந்த ஓர் ஐயோ’ என்று உள்ளது; சூழலில் இது ஒரு வரிசையின் முதலாவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘இதற்குப் பிறகு இன்னும் இரண்டு ஐயோக்கள் வருகின்றன.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαί
  choice: ஐயோ
  rationale: வரவிருக்கும் பேரழிவைக் குறித்த தீர்ப்பின் ஆழ்ந்த எச்சரிப்பாகவும் புலம்பல் முழக்கமாகவும் வரும் வெளிப்படுத்தின விசேஷத்தின் தொடர்ச்சியான சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: ἡ μία
  choice: முதலாம்
  rationale: சொல்லுக்கு நெருக்கமாக ‘ஒன்று’ என்றாலும், முன்பு அறிவிக்கப்பட்ட மூன்று ஐயோக்களில் வரிசையின் முதலாவதைக் குறிக்கிறது.
- source_word: ἀπῆλθεν
  choice: கடந்துபோயிற்று
  rationale: முதலாம் ஐயோ முடிவடைந்துவிட்டது என்பதைக் காட்டும் நிறைவுற்ற நிகழ்வை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἰδού
  choice: இதோ
  rationale: அடுத்து வருவதற்கு வாசகரின் கவனத்தை உடனடியாக ஈர்க்கும் தீர்க்கதரிசன உரைநடையின் அழுத்தத்தைப் பாதுகாக்கிறது.
- source_word: ἔρχεται
  choice: வரவிருக்கின்றன
  rationale: கிரேக்கத்தில் பன்மை எழுவாயுடன் ஒருமை வினை வந்தாலும், இரண்டு ஐயோக்கள் இனி வர உள்ளன என்ற பொருளை இயல்பான தமிழ் பன்மையில் தருகிறது.
- source_word: ἔτι
  choice: இன்னும்
  rationale: முதலாம் ஐயோவுக்குப் பின் மேலும் இரண்டு மீதமுள்ளன என்ற தொடர்ச்சியைக் காட்டுகிறது.
- source_word: μετὰ ταῦτα
  choice: இவற்றுக்குப் பிறகு
  rationale: பன்மைச் சுட்டுப்பெயரையும் நிகழ்வுகளின் காலவரிசையையும் வெளிப்படையாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: மூன்று ஐயோக்களின் வெளிப்படுத்தல் சார்ந்த வரிசை
  choice: அறிவிக்கப்பட்ட முதலாவது ஐயோ முடிந்ததையும் மேலும் இரண்டு ஐயோக்கள் வரவிருப்பதையும் வரிசையாகக் காட்டுதல்
  alternative: ‘ஐயோ’ என்பதை வெறுமனே ‘தீர்ப்பு’ அல்லது ‘பேரழிவு’ என்று விளக்கமாக மாற்றுதல்
  rationale: மூலத்தின் மீளும் ‘ஐயோ’ முழக்கமும் எண்ணிடப்பட்ட வரிசையும் தீவிரமடையும் தீர்ப்புகளின் இலக்கிய மற்றும் இறையியல் கட்டமைப்பை உருவாக்குகின்றன; கூடுதல் கோட்பாட்டு விளக்கம் சேர்க்காமல் அதைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘ஐயோ’ என்பது அன்றாட வியப்புச் சொல்லாக மட்டும் அல்லாமல், இங்கு தீர்ப்பையும் பேரிடரையும் அறிவிக்கும் உயர்ந்த புலம்பல் முழக்கமாகப் பயன்படுத்தப்பட்டுள்ளது; ‘இதோ’ வெளிப்படுத்தல் நூலின் தீர்க்கதரிசனத் தொனியைத் தக்கவைக்கிறது.
