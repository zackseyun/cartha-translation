revisions:
- from: ஏனெனில், ‘நான் செல்வந்தன்; செல்வம் சேர்த்துவிட்டேன்; எனக்கு எதுவும் தேவையில்லை’ என்று நீ சொல்கிறாய். ஆனால் நீதான் அவலமானவனும், பரிதாபத்துக்குரியவனும், ஏழையும், குருடனும், ஆடையற்றவனுமாய் இருக்கிறாய் என்பதை நீ அறியவில்லை.
  to: ஏனெனில், ‘நான் செல்வந்தன்; செல்வம் சேர்த்துவிட்டேன்; எனக்கு எதுவும் தேவையில்லை’ என்று நீ சொல்கிறாய். மேலும், நீதான் அவலநிலையிலிருப்பவனும், பரிதாபத்துக்குரியவனும், ஏழையும், குருடனும், ஆடையற்றவனுமாய் இருக்கிறாய் என்பதை நீ அறியவில்லை.
  rationale: The revision removes the unsupported adversative “ஆனால்” and uses “மேலும்” to represent the Greek connective naturally without overstating its force. It also refines the first descriptor to express the wretched condition denoted by ταλαίπωρος, while retaining the distinct pity-worthiness of ἐλεεινός and leaving the poverty, blindness, and nakedness unqualified as in the source.
