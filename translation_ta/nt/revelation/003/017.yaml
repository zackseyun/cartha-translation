id: REV.3.17
reference: Revelation 3:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι λέγεις ⸀ὅτι Πλούσιός εἰμι καὶ πεπλούτηκα καὶ ⸀οὐδὲν χρείαν ἔχω, καὶ οὐκ οἶδας ὅτι σὺ εἶ ὁ ταλαίπωρος ⸀καὶ ἐλεεινὸς καὶ πτωχὸς καὶ τυφλὸς καὶ γυμνός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/017.yaml
  text: because you say[a], ‘I am rich, and I have become wealthy[b], and I have need of nothing,’ and you do not know that you are wretched and pitiable and poor and blind and naked.
translation:
  language: ta
  text: ஏனெனில், ‘நான் செல்வந்தன்; செல்வம் சேர்த்துவிட்டேன்; எனக்கு எதுவும் தேவையில்லை’ என்று நீ சொல்கிறாய். மேலும், நீதான் அவலநிலையிலிருப்பவனும், பரிதாபத்துக்குரியவனும், ஏழையும், குருடனும், ஆடையற்றவனுமாய் இருக்கிறாய் என்பதை நீ அறியவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι λέγεις ὅτι
  choice: ஏனெனில் ... என்று நீ சொல்கிறாய்
  rationale: முதல் ὅτι சூழலில் காரணத்தைக் குறிக்கிறது; இரண்டாவது ὅτι நேரடிக் கூற்றை அறிமுகப்படுத்துகிறது.
- source_word: Πλούσιός εἰμι
  choice: நான் செல்வந்தன்
  rationale: சபை தன்னைப் பற்றி கூறும் பொருளாதாரத் தன்னிறைவை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: πεπλούτηκα
  choice: செல்வம் சேர்த்துவிட்டேன்
  rationale: செல்வத்தைப் பெற்ற செயலையும் அதன் நீடிக்கும் விளைவையும் கிரேக்க நிறைவுக்கால வினைக்கேற்ப வெளிப்படுத்துகிறது; முந்தைய ‘செல்வந்தன்’ என்பதை வெறுமனே திரும்பச் சொல்லாமல் வேறுபாட்டையும் காக்கிறது.
- source_word: οὐδὲν χρείαν ἔχω
  choice: எனக்கு எதுவும் தேவையில்லை
  rationale: வலியுறுத்தப்பட்ட οὐδέν என்பதையும் தேவையின்மை என்ற இயல்பான தமிழ் பொருளையும் தெளிவாகக் காக்கிறது.
- source_word: οὐκ οἶδας
  choice: நீ அறியவில்லை
  rationale: அறிதலைக் குறிக்கும் வினையை விளக்கவுரையின்றி நேரடியாக மொழிபெயர்க்கிறது.
- source_word: σὺ εἶ
  choice: நீதான் ... இருக்கிறாய்
  rationale: வெளிப்படையாக உள்ள σὺ தரும் அழுத்தத்தைத் தமிழின் ‘தான்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὁ ταλαίπωρος
  choice: அவலமானவன்
  rationale: துன்பகரமான உண்மை நிலையைக் குறிக்கிறது; கிரேக்கச் சுட்டுக் கட்டுரையின் கூர்மையான அழுத்தம் ‘நீதான்’ என்பதாலும் பட்டியலின் தொடக்க இடத்தாலும் வெளிப்படுகிறது.
- source_word: ἐλεεινός
  choice: பரிதாபத்துக்குரியவன்
  rationale: இரக்கத்திற்குரிய நிலையைச் சுட்டி, ταλαίπωρος என்பதிலிருந்து பொருள் வேறுபாட்டைக் காக்கிறது.
- source_word: πτωχός
  choice: ஏழை
  rationale: செல்வந்தன் என்ற தற்கூற்றுக்கு எதிரான நேரடியான முரண்பாட்டைக் காக்கிறது.
- source_word: τυφλός
  choice: குருடன்
  rationale: உருவகப் பொருளை விளக்கிச் சேர்க்காமல் மூலத்தின் நேரடியான உருவத்தைப் பாதுகாக்கிறது.
- source_word: γυμνός
  choice: ஆடையற்றவன்
  rationale: நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் நிர்வாண நிலையைக் குறிக்கிறது.
theological_decisions:
- issue: செல்வம், ஏழ்மை, குருட்டுத்தன்மை, ஆடையின்மை ஆகியவை ஆன்மீக உருவகங்கள் என்று வெளிப்படையாகச் சேர்க்க வேண்டுமா
  choice: மூலத்தில் உள்ள உருவங்களை எந்த விளக்கச் சொல்லும் சேர்க்காமல் அப்படியே வைத்தல்
  alternative: ‘ஆன்மீகமாக ஏழை’ அல்லது ‘ஆன்மீகக் குருடன்’ என்று மொழிபெயர்த்தல்
  rationale: வசனமே தற்கூற்றுக்கும் உண்மை நிலைக்கும் இடையிலான முரண்பாட்டை உருவாக்குகிறது; ‘ஆன்மீகமாக’ என்று சேர்ப்பது மூலத்தில் வெளிப்படையாக இல்லாத விளக்கத்தை உரைக்குள் புகுத்தும்.
- issue: ὁ ταλαίπωρος என்பதில் உள்ள சுட்டுக் கட்டுரையின் அழுத்தம்
  choice: ‘நீதான் அவலமானவன்’ என்ற வாக்கிய அழுத்தத்தின் மூலம் இயல்பான தமிழில் பிரதிபலித்தல்
  alternative: ‘அந்த அவலமான ஒருவன்’ போன்ற சொற்சொல்லான வடிவம்
  rationale: சொற்சொல்லான வடிவம் தமிழில் செயற்கையாகவும் வேறொருவரைச் சுட்டுவது போலவும் ஒலிக்கும்; ‘நீதான்’ மூலத்தின் குற்றஞ்சாட்டும் கூர்மையை காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குத் தெளிவானதும் மரியாதைமிக்கதுமான நடை. தற்கூற்றை அரைப்புள்ளிகளால் பிரித்து கிரேக்கப் பட்டியலின் படிநிலையைத் தெளிவாக்கியுள்ளது; கண்டனத்தின் நேர்மையும் உருவகங்களின் தீவிரமும் மென்மையாக்கப்படவில்லை.
