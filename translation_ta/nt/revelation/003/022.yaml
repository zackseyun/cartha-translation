  text: The one who has an ear[b][a], let him hear what the Spirit says to the churches.
translation:
  language: ta
  text: கேட்கக் காது உள்ளவர், ஆவியானவர் திருச்சபைகளுக்குச் சொல்வதைக் கேட்கட்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων
  choice: உள்ளவர்
  rationale: கிரேக்கக் கட்டுரையுடன் வரும் நிகழ்காலப் பங்கேற்புவினை இங்கு பெயர்ச்சொல்லாகச் செயல்பட்டு, ஒருவரை பொதுவாகக் குறிக்கிறது. தமிழில் மரியாதை ஒருமையான ‘உள்ளவர்’ இயல்பாகவும் பிரதிநிதித்துவப் பொருளுடனும் அமைகிறது.
- source_word: οὖς
  choice: காது
  rationale: மூலத்தில் ஒருமையாக உள்ள ‘காது’ என்பதையும், இந்தத் திரும்பத் திரும்ப வரும் அறிவுறுத்தலின் உருவகத் தன்மையையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἀκουσάτω
  choice: கேட்கட்டும்
  rationale: மூன்றாம் நபர் ஒருமை கட்டளை வடிவத்தின் அறிவுறுத்தல் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘கேட்க வேண்டும்’ என்று கடமையாகவோ ‘கேட்கலாம்’ என்று மெலிதாகவோ மாற்றவில்லை.
- source_word: τί
  choice: சொல்வதை
  rationale: ‘எதை ... சொல்கிறதோ/சொல்கிறாரோ அதை’ என்ற உள்ளடக்க உறவைத் தமிழில் இயல்பாக ஒருங்கிணைக்கிறது.
- source_word: τὸ πνεῦμα
  choice: ஆவி
  rationale: கிரேக்கத்தின் நேரடியான பொருளைத் தக்கவைக்கிறது. இந்தத் திருச்சபைச் செய்திகளின் சூழலில் பரிசுத்த ஆவியே குறிக்கப்படுகிறார் என்பதை அடிக்குறிப்பு விளக்குகிறது; முதன்மை உரையில் மூலத்தைவிட வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: λέγει
  choice: சொல்வதை
  rationale: நிகழ்காலத்தில் ஆவி உரைக்கும் செய்தியை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ταῖς ἐκκλησίαις
  choice: திருச்சபைகளுக்கு
  rationale: பன்மைத் தத்தி வேற்றுமையின் பெறுநர்களைத் தெளிவாகக் காட்டுகிறது; வெளிப்படுத்தின விசேஷம் 2–3 அதிகாரங்களில் குறிப்பிடப்படும் உள்ளூர் விசுவாசக் கூட்டங்களுக்கு வழக்கமான தமிழ் வேதாகமச் சொல்லைப் பயன்படுத்துகிறது.
theological_decisions:
- issue: அறிவுறுத்தலில் பிரதிநிதித்துவ ஒருமை
  choice: காது உள்ளவர் ... கேட்கட்டும்
  alternative: காதுகள் உள்ளவர்கள் ... கேட்கட்டும்
  rationale: மூலத்தின் இலக்கண ஒருமையையும் அனைவருக்கும் பொருந்தும் பிரதிநிதித்துவ வலிமையையும் பாதுகாக்கிறது. தமிழின் ‘வர்’ விகுதி பாலினத்தைத் தேவையின்றிக் குறிப்பதில்லை.
- issue: τὸ πνεῦμα என்பதன் குறிப்பு
  choice: ஆவி
  alternative: பரிசுத்த ஆவியானவர்
  rationale: சூழலில் பரிசுத்த ஆவியே குறிக்கப்படுகிறார். ஆயினும் ‘பரிசுத்த’ என்ற சொல் இந்த வசனத்தின் கிரேக்க உரையில் இல்லை; ஆகவே முதன்மை உரை மூலச் சொல்லைப் பாதுகாத்து, சூழல்சார் அடையாளத்தை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் சுருக்கமான, கண்ணியமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘காது’ என்ற ஒருமை உருவகம், ‘கேட்கட்டும்’ என்ற கட்டளை வலிமை, ‘திருச்சபைகள்’ என்ற சூழலுக்குரிய சொல் ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
