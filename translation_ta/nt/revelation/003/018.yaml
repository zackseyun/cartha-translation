id: REV.3.18
reference: Revelation 3:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: συμβουλεύω σοι ἀγοράσαι ⸂παρ’ ἐμοῦ χρυσίον⸃ πεπυρωμένον ἐκ πυρὸς ἵνα πλουτήσῃς, καὶ ἱμάτια λευκὰ ἵνα περιβάλῃ καὶ μὴ φανερωθῇ ἡ αἰσχύνη τῆς γυμνότητός σου, καὶ κολλούριον ⸀ἐγχρῖσαι τοὺς ὀφθαλμούς σου ἵνα βλέπῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/018.yaml
  text: I counsel you to buy from me gold refined by fire so that you may become rich[a], and white garments so that you may clothe yourself and the shame of your nakedness may not be exposed[c][b], and eye salve to anoint your eyes so that you may see.
translation:
  language: ta
  text: நீ செல்வந்தனாகும்படி, நெருப்பினால் புடமிடப்பட்ட தங்கத்தை என்னிடமிருந்து வாங்கிக்கொள்ளவும்; நீ உடுத்திக்கொள்ளவும், உன் நிர்வாணத்தின் அவமானம் வெளிப்படாமல் இருக்கவும் வெள்ளை ஆடைகளை வாங்கிக்கொள்ளவும்; நீ பார்க்கும்படி, உன் கண்களுக்குப் பூசிக்கொள்ளக் கண் மருந்தை வாங்கிக்கொள்ளவும் நான் உனக்கு ஆலோசனை கூறுகிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “புடமிடப்பட்ட” என்பதற்கு “நெருப்பால் தூய்மைப்படுத்தப்பட்ட” அல்லது “நெருப்பில் சோதிக்கப்பட்ட” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: συμβουλεύω σοι
  choice: நான் உனக்கு ஆலோசனை கூறுகிறேன்
  rationale: நிகழ்கால முதலாம் நபர் வினையின் அதிகாரமுள்ள அறிவுரைத்தன்மையை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: ἀγοράσαι παρ’ ἐμοῦ
  choice: என்னிடமிருந்து வாங்கிக்கொள்ளவும்
  rationale: παρά + genitive குறிக்கும் மூலத்தையும், மூன்று பொருட்களுக்கும் பொருந்தும் வாங்குதல் உருவகத்தையும் நேரடியாகக் காக்கிறது.
- source_word: χρυσίον πεπυρωμένον ἐκ πυρός
  choice: நெருப்பினால் புடமிடப்பட்ட தங்கம்
  rationale: உலோகத்தை நெருப்பால் தூய்மைப்படுத்தும் உருவகத்தைத் துல்லியமாகவும் தமிழில் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἵνα πλουτήσῃς
  choice: நீ செல்வந்தனாகும்படி
  rationale: செல்வநிலைக்குள் வருவதைக் குறிக்கும் aorist subjunctive-இன் விளைவு நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: ἱμάτια λευκά
  choice: வெள்ளை ஆடைகள்
  rationale: ἱμάτια என்பது பொதுவான உடைச்சொல்; குறிப்பாக மேலங்கிகள் என்று தேவையின்றிக் குறுக்காமல் உள்ளது.
- source_word: ἵνα περιβάλῃ
  choice: நீ உடுத்திக்கொண்டு
  rationale: நடுநிலை வினையின் தன்முகச் செயற்பாட்டை இயல்பான தமிழில் காட்டுகிறது.
- source_word: μὴ φανερωθῇ ἡ αἰσχύνη τῆς γυμνότητός σου
  choice: உன் நிர்வாணத்தின் அவமானம் வெளிப்படாதபடி
  rationale: செயப்பாட்டு வினையையும், நிர்வாணத்தோடு தொடர்புடைய அவமானம் வெளித்தெரியும் படிமத்தையும் நேரடியாகக் காக்கிறது.
- source_word: κολλούριον ἐγχρῖσαι τοὺς ὀφθαλμούς σου
  choice: உன் கண்களில் பூசிக்கொள்ளக் கண் மருந்து
  rationale: கண்ணில் தடவப்படும் மருத்துவத் தயாரிப்பைக் குறிக்கும் கொல்லூரியோன் என்ற சொல்லையும், பூசி பயன்படுத்தும் செயலைக் குறிக்கும் வினையையும் தெளிவாக வழங்குகிறது.
- source_word: ἵνα βλέπῃς
  choice: நீ பார்வை பெறும்படி
  rationale: சூழலின் உருவக ஆற்றலை முன்கூட்டியே விளக்காமல், காணும் திறன் பெறுதல் என்ற நோக்கத்தை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: தங்கம், வெள்ளை ஆடைகள், கண் மருந்து ஆகியவற்றின் அடையாளப் பொருள்
  choice: உருவகப் பொருட்களை மூலத்தில் உள்ளபடியே வைத்தல்
  alternative: அவற்றை முறையே ஆன்மிகச் செல்வம், நீதி அல்லது தூய்மை, ஆன்மிகப் பார்வை என்று மொழிபெயர்ப்பிலேயே விளக்குதல்
  rationale: இவ்வசனம் அவற்றின் ஆன்மிக ஒப்புமைகளைத் தானாக விரித்துரைக்கவில்லை; ஆகவே மொழிபெயர்ப்பு உருவகத்தைப் பாதுகாத்து விளக்கத்தை வாசகச் சூழலுக்கு விடுகிறது.
- issue: ἐγχρῖσαι என்பதன் சாத்தியமான சமயச் சடங்கு ஒலிப்பு
  choice: மருந்தை கண்களில் ‘பூசிக்கொள்ள’ என்று மருத்துவச் செயலைத் தெளிவுபடுத்துதல்
  alternative: ‘அபிஷேகம் செய்ய’ என்று வழங்குதல்
  rationale: இங்கு நேரடியான படிமம் கண் மருந்தைப் பூசுவது. ‘அபிஷேகம்’ என்பது தமிழில் சடங்குசார் பொருளைத் தேவையின்றி இறக்குமதி செய்யக்கூடும்.
- issue: ἀγοράσαι என்ற ஒரே infinitive-ன் மூன்று பொருட்களுடனான தொடர்பு
  choice: தமிழ்த் தெளிவுக்காக ஒவ்வொரு பொருளுடனும் ‘வாங்கிக்கொள்ளவும்’ என்பதை வெளிப்படையாக மீட்டுரைத்தல்
  alternative: முதல் பொருளுடன் மட்டும் ‘வாங்க’ என்று வைத்து, பின்வருவனவற்றில் வினையை மறைமுகமாகப் புரியவைத்தல்
  rationale: கிரேக்கத்தில் ஒரே வாங்குதல் வினை மூன்று பொருட்களையும் ஆள்கிறது. தமிழில் மீட்டுரை பொருளை மாற்றாமல் நீண்ட வாக்கியத்தின் அமைப்பைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; மரியாதை பன்மையை விட மூலத்தின் ஒருமை இரண்டாம் நபரை ‘நீ/உன்’ எனக் காக்கிறது. கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடையைப் பயன்படுத்தி, வெளிப்படுத்தப்படாத அடையாள விளக்கங்களை முதன்மை உரைக்குள் சேர்க்கவில்லை. அடிக்குறி குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
