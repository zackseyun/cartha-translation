id: REV.3.2
reference: Revelation 3:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: γίνου γρηγορῶν, καὶ στήρισον τὰ λοιπὰ ἃ ⸂ἔμελλον ἀποθανεῖν⸃, οὐ γὰρ εὕρηκά σου ⸀τὰ ἔργα πεπληρωμένα ἐνώπιον τοῦ θεοῦ μου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/002.yaml
  text: Wake up, and strengthen what remains, which was about to die, for I have not found your works completed in the sight of my God.
translation:
  language: ta
  text: விழித்தெழு; சாகவிருந்த எஞ்சியவற்றை உறுதிப்படுத்து. ஏனெனில், என் தேவனின் முன்னிலையில் உன் செயல்கள் நிறைவுபெற்றவையாக இருப்பதை நான் காணவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γίνου γρηγορῶν
  choice: விழித்தெழு
  rationale: சொல்லடியாக ‘விழிப்புடன் இரு’ எனப் பொருள்படலாம்; ஆனால் சார்தீசின் மந்தநிலையை நோக்கிய கட்டளையின் செயற்பாட்டுத் தீவிரத்தை இயல்பான தமிழில் ‘விழித்தெழு’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: στήρισον
  choice: உறுதிப்படுத்து
  rationale: எஞ்சியவற்றை நிலைநிறுத்தி வலுப்படுத்த வேண்டும் என்ற பொருளைத் தருகிறது.
- source_word: τὰ λοιπὰ
  choice: எஞ்சியவற்றை
  rationale: இலக்கணப்படி நடுநிலைப் பன்மையாக இருப்பதால், மனிதர்களை மட்டும் குறிக்காமல் ‘மீதமுள்ளவை’ என்ற பரப்பைத் தக்கவைக்கிறது.
- source_word: ἔμελλον ἀποθανεῖν
  choice: சாகவிருந்த
  rationale: இறப்பின் விளிம்பில் அல்லது விரைவில் சாகும் நிலையிலிருந்ததைக் குறிக்கும் இயல்பான சுருக்கமான தமிழ்.
- source_word: πεπληρωμένα
  choice: நிறைவுபெற்றவையாக
  rationale: செயல்கள் தேவையான நிறைவை அடையவில்லை என்ற perfect passive கருத்தைத் தக்கவைக்கிறது.
- source_word: ἐνώπιον τοῦ θεοῦ μου
  choice: என் தேவனின் முன்னிலையில்
  rationale: தெய்வீக மதிப்பீட்டின் முன்னிலையில் என்பதையும் ‘என் தேவன்’ என்ற மூலத்தின் நேரடி உரையையும் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘எஞ்சியவை’ என்பது மனிதர்களையா, செயல்களையா, ஆன்மிக நன்மைகளையா குறிக்கிறது?
  choice: எஞ்சியவற்றை
  alternative: எஞ்சியவர்களை
  rationale: τὰ λοιπὰ நடுநிலைப் பன்மை; அதன் குறிப்பை உரை திட்டவட்டமாக நிர்ணயிக்காததால் தமிழிலும் அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
- issue: ‘செயல்கள் நிறைவுபெறவில்லை’ என்பதன் தரநிலை
  choice: என் தேவனின் முன்னிலையில்
  alternative: என் தேவனுக்கு முன்பாக
  rationale: செயல்களின் மதிப்பீடு மனிதக் கணிப்பால் அல்ல, தேவனின் பார்வையில் நிகழ்கிறது என்ற உரைநிலையைத் தக்கவைக்கிறது; குறிப்பிட்ட இறையியல் முறையைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சுருக்கமான, நேரடியான, எச்சரிப்புத் தொனியுள்ள கண்ணியமான நடை. கிரேக்கத்தின் தெளிவின்மைகள் தேவையின்றி விளக்கித் தீர்க்கப்படவில்லை.
