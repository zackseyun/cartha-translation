id: REV.3.7
reference: Revelation 3:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Φιλαδελφείᾳ ἐκκλησίας γράψον· Τάδε λέγει ὁ ἅγιος, ὁ ἀληθινός, ὁ ἔχων τὴν κλεῖν ⸀Δαυίδ, ὁ ἀνοίγων καὶ οὐδεὶς κλείσει, ⸂καὶ κλείων⸃ καὶ οὐδεὶς ⸀ἀνοίγει·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/007.yaml
  text: 'And write to the angel of the church in Philadelphia: These things says the Holy One[a], the True One, the one who has the key of David, who opens and no one will shut[b], and who shuts and no one opens:'
translation:
  language: ta
  text: 'பிலதெல்பியாவிலுள்ள திருச்சபையின் தூதருக்கு[a] எழுது: பரிசுத்தரும் மெய்யானவரும், தாவீதின் திறவுகோலை உடையவரும்[b], திறக்கிறவரும்—அவர் திறந்தால் யாரும் பூட்டமாட்டார்கள்—பூட்டுகிறவரும்—அவர் பூட்டினால் யாரும் திறப்பதில்லை—ஆகியவர் இவ்வாறு கூறுகிறார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தூதர்” என்பதற்கு “செய்தியாளர்” என்றும் பொருள் கொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: “தாவீதின் திறவுகோல்” என்பது ஏசாயா 22:22-ஐ நினைவூட்டுவதாக இருக்கலாம்; திறக்கவும் பூட்டவும் உள்ள அரச அதிகாரத்தை அது உருவகமாகக் காட்டுகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: தூதர்
  rationale: கிரேக்கச் சொல் விண்ணுலகத் தூதரையோ மனிதச் செய்தியாளரையோ குறிக்கலாம். ‘தூதர்’ இரு சாத்தியங்களையும் இயன்றவரை திறந்தவையாக வைத்திருந்து, வெளிப்படுத்தலில் மீண்டும் வரும் முகவுரையோடும் இயல்பாகப் பொருந்துகிறது.
- source_word: ἐκκλησίας
  choice: திருச்சபை
  rationale: இங்கு இச்சொல் பிலதெல்பியாவில் கூடியிருந்த கிறிஸ்தவ விசுவாசிகளின் சமூகத்தைக் குறிக்கிறது. நவீனத் தமிழில் ‘திருச்சபை’ தெளிவானதும் பரவலாக அறியப்பட்டதுமான இணைச்சொல்.
- source_word: Τάδε λέγει
  choice: கூறுவது இதுவே
  rationale: தீர்க்கதரிசன அறிவிப்பின் முறைமையான தொனியையும் τάδε என்பதன் சுட்டுப்பொருளையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ὁ ἅγιος
  choice: பரிசுத்தர்
  rationale: கட்டுரைச்சொல்லுடன் பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்டுள்ள பெயரடை இங்கு பட்டமாகச் செயல்படுகிறது. ‘பரிசுத்தர்’ அந்தப் பட்டத்தன்மையைச் சுருக்கமாகவும் மாண்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ὁ ἀληθινός
  choice: உண்மையானவர்
  rationale: இது வெறுமனே பொய் பேசாதவர் என்பதைவிட உண்மையான, மெய்யானவர் என்ற விரிந்த யோவானிய நுண்பொருளைத் தக்கவைக்கிறது.
- source_word: κλεῖν Δαυίδ
  choice: தாவீதின் திறவுகோல்
  rationale: ஏசாயா 22:22-ஐ நினைவூட்டும் அரச அதிகார உருவகத்தை விளக்கவுரையாக மாற்றாமல் அப்படியே பாதுகாக்கிறது.
- source_word: ἀνοίγων
  choice: திறக்கிறவர்
  rationale: நிகழ்காலப் பங்கேற்புவினையைப் பேச்சாளருக்குரிய தொடர்ச்சியான விளக்கப் பட்டமாகத் தக்கவைக்கிறது.
- source_word: κλείσει
  choice: பூட்டமாட்டார்கள்
  rationale: கிரேக்க எதிர்கால வினையின் கால வேறுபாட்டைத் தக்கவைத்து, அவர் திறந்ததை இனி எவரும் பூட்ட முடியாது என்ற பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: κλείων
  choice: பூட்டுகிறவர்
  rationale: ἀνοίγων என்பதற்கு இணையான நிகழ்கால விளக்கப் பட்டமாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἀνοίγει
  choice: திறப்பதில்லை
  rationale: கிரேக்க நிகழ்காலத்தைப் பொதுவான மறுப்பாகத் தக்கவைத்து, முந்தைய எதிர்கால வினையுடன் உள்ள திட்டமிட்ட கால வேறுபாட்டை அழிக்கவில்லை.
theological_decisions:
- issue: ὁ ἅγιος, ὁ ἀληθινός ஆகிய கிறிஸ்துவியல் பட்டங்கள்
  choice: உயிர்த்தெழுந்த இயேசுவுக்குரிய நேரடியான பட்டங்களாக ‘பரிசுத்தரும் உண்மையானவரும்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: பட்டத்தன்மையைக் குறைத்து ‘பரிசுத்தமான, உண்மையான ஒருவர்’ என்று பெயரடைகளாக மொழிபெயர்த்தல்.
  rationale: கட்டுரைச்சொல்லுடன் வரும் இப்பெயரடைகள் செய்தியை உரைப்பவருக்குரிய மாண்பான பட்டங்களாகச் செயல்படுகின்றன. இது உரையின் உயர்ந்த கிறிஸ்துவியலைப் பாதுகாக்கிறது; அதற்கு அப்பாற்பட்ட கோட்பாட்டு விரிவாக்கத்தைச் சேர்ப்பதில்லை.
- issue: ‘தாவீதின் திறவுகோல்’ என்பதிலுள்ள ஏசாயா–தாவீதிய குறிப்பு
  choice: அரச அதிகாரத்தைச் சுட்டும் வேதாகம உருவகம் முதன்மை உரையில் அப்படியே வைக்கப்பட்டது.
  alternative: ‘தாவீதின் அரசாட்சிமேல் அதிகாரம்’ என விளக்கமாக விரித்துரைத்தல்.
  rationale: இச்சொற்றொடர் ஏசாயா 22:22-ஐக் குறிப்பிடக்கூடும்; எனினும் மொழிபெயர்ப்பு அதன் உருவகத்தையும் மறைமுகக் குறிப்பையும் மாற்றாமல் பாதுகாக்க வேண்டும். தொடர்பு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மாண்பான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. தீர்க்கதரிசன அறிவிப்பின் தொனிக்காக ‘கூறுவது இதுவே’ பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தில் உள்ள நிகழ்கால–எதிர்கால வேறுபாடு இயன்றவரை பாதுகாக்கப்பட்டுள்ளது; ‘தூதர்’ என்பதின் பொருள் திட்டமிட்டு அடிக்குறிப்பில் திறந்தவையாக வைக்கப்பட்டுள்ளது.
