revisions:
- from: '“பிலதெல்பியாவில் உள்ள திருச்சபையின் தூதருக்கு[a] எழுது: ‘பரிசுத்தரும் உண்மையானவரும், தாவீதின் திறவுகோலை வைத்திருப்பவரும்[b], திறக்கிறவரும்—அவர் திறந்ததை யாரும் பூட்டமாட்டார்கள்—பூட்டுகிறவரும்—அவர் பூட்டியதை யாரும் திறப்பதில்லை—கூறுவது இதுவே:’”'
  to: 'பிலதெல்பியாவிலுள்ள திருச்சபையின் தூதருக்கு[a] எழுது: பரிசுத்தரும் மெய்யானவரும், தாவீதின் திறவுகோலை உடையவரும்[b], திறக்கிறவரும்—அவர் திறந்தால் யாரும் பூட்டமாட்டார்கள்—பூட்டுகிறவரும்—அவர் பூட்டினால் யாரும் திறப்பதில்லை—ஆகியவர் இவ்வாறு கூறுகிறார்:'
  rationale: The revision preserves all source elements and the asymmetric verbal tenses while making the Tamil prophetic introduction syntactically natural. It avoids treating the Greek’s implied object as an explicit added noun and retains both footnote anchors at their relevant terms.
