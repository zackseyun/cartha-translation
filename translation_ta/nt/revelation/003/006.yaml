  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/006.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches.
translation:
  language: ta
  text: காதுள்ளவர்[a], ஆவியானவர் திருச்சபைகளுக்குச் சொல்வதைக் கேட்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கில் சொல்லர்த்தமாக, “காது உள்ளவர் கேட்கட்டும்.” ‘காது’ ஒருமையில் உள்ளது; இந்த அறிவுறுத்தல் கேட்கும் எவரையும் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: காதுள்ளவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் ஒருமை நிகழ்காலப் பெயரெச்சத்தையும் ‘காது’ என்ற ஒருமை உருவத்தையும் சுருக்கமான தமிழ் மரபுத்தொடராக வெளிப்படுத்துகிறது. ‘வர்’ என்பது இங்கு மரியாதை/பொதுமைப் பயன்பாடு; ஆண்களை மட்டும் குறிக்காது.
- source_word: ἀκουσάτω
  choice: கேட்கட்டும்
  rationale: மூன்றாம் நபர் ஒருமை கட்டளை வடிவத்தின் அறிவுறுத்தல் வலிமையை இயல்பான தமிழில் காக்கிறது; ‘கேட்க வேண்டும்’ என்பதைவிட மூலத்தின் வடிவத்துக்கு நெருக்கமானது.
- source_word: τί
  choice: சொல்வதை
  rationale: ஆவியானவர் கூறும் செய்தியின் உள்ளடக்கத்தைத் தமிழில் இயல்பான தொடர்பெயர் அமைப்பால் காட்டுகிறது.
- source_word: τὸ πνεῦμα
  choice: ஆவியானவர்
  rationale: வெளிப்படுத்தல் 2–3 அதிகாரங்களில் திருச்சபைகளிடம் பேசுபவர் பரிசுத்த ஆவியானவர் என்பதைக் சூழல் வலுவாகக் காட்டுகிறது. தமிழில் வழக்கமான உயர்திணை வடிவம் பயன்படுத்தப்படுகிறது.
- source_word: λέγει
  choice: சொல்கிறார்
  rationale: நிகழ்காலத்தின் தொடரும் அல்லது இயல்பான செயற்பாட்டை இயல்பான தமிழில் தருகிறது; வாக்கியத்தில் ‘சொல்வதை’ எனத் தொடர்பெயர் வடிவம் பெற்றுள்ளது.
- source_word: ταῖς ἐκκλησίαις
  choice: திருச்சபைகளுக்கு
  rationale: பன்மை மறையாமல், வெளிப்படுத்தலில் குறிப்பிடப்படும் கிறிஸ்தவச் சபைகளைக் குறிக்கும் நிலைபெற்ற தமிழ் சொல்லைத் தேர்ந்தெடுக்கிறது.
theological_decisions:
- issue: ‘ஆவி’ என்பதன் குறிப்பு
  choice: பரிசுத்த ஆவியானவரைக் குறிக்கும் ‘ஆவியானவர்’
  alternative: ஒரு ஆவி / பொதுவான ஆவி
  rationale: வெளிப்படுத்தல் 2–3 அதிகாரங்களில் மீண்டும் மீண்டும் வரும் இந்த வாக்கியச் சூத்திரத்தின் சூழல், திருச்சபைகளுக்குத் தீர்க்கதரிசனச் செய்தி கூறும் பரிசுத்த ஆவியானவரையே சுட்டுகிறது.
- issue: அறிவுறுத்தலில் வரும் பொதுமைப் பொருளுடைய ஒருமை
  choice: காதுள்ளவர் … கேட்கட்டும்
  alternative: காதுள்ளவர்கள் … கேட்கட்டும் / காதுள்ளவன் … கேட்கட்டும்
  rationale: கிரேக்கத்தின் ஒருமை அறிவுறுத்தல் காக்கப்படுகிறது. ‘வர்’ என்ற தமிழ் வடிவம் ஒருவரை மரியாதையாகவும் பாலின வரம்பின்றியும் குறிக்க இயல்வதால், இந்த அழைப்பு ஆண்களுக்கு மட்டும் உரியது என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. வெளிப்படுத்தல் 2–3 அதிகாரங்களில் மீண்டும் வரும் refrain-இன் நினைவூட்டும் சுருக்கமும் ஒருமை அமைப்பும் காக்கப்பட்டுள்ளன.
