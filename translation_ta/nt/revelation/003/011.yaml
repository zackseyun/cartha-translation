id: REV.3.11
reference: Revelation 3:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἔρχομαι ταχύ· κράτει ὃ ἔχεις, ἵνα μηδεὶς λάβῃ τὸν στέφανόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/011.yaml
  text: I am coming soon[a]; hold fast what you have[b], so that no one may take your crown.
translation:
  language: ta
  text: நான் விரைவில் வருகிறேன்[a]. உன்னிடம் இருப்பதை உறுதியாகப் பற்றிக்கொள்; யாரும் உன் கிரீடத்தை[b] எடுத்துக்கொள்ளாதபடி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விரைவாக.” இந்தக் கிரேக்க வினையடை காலத்தில் நெருக்கத்தையோ செயலின் வேகத்தையோ வலியுறுத்தக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: இங்கே “கிரீடம்” என்பதற்கான கிரேக்கச் சொல், குறிப்பாக அரசரின் மணிமுடியைக் குறிக்காமல், வெற்றி பெற்றவருக்கு அல்லது கௌரவிக்கப்படுபவருக்கு வழங்கப்படும் மாலை போன்ற கிரீடத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχομαι
  choice: நான் வருகிறேன்
  rationale: நிகழ்கால வடிவம் இச்சூழலில் நெருங்கிவரும் வருகையைக் குறிக்கிறது. தமிழில் இயல்பான நிகழ்காலத்தையே வைத்து அதன் எதிர்நோக்கப்பட்ட வருகை உணர்வு பாதுகாக்கப்படுகிறது.
- source_word: ταχύ
  choice: விரைவில்
  rationale: கால நெருக்கத்தை இயல்பாக வெளிப்படுத்துகிறது; செயலின் வேகம் என்ற சாத்தியமான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: κράτει
  choice: உறுதியாகப் பற்றிக்கொள்
  rationale: கைவிடாமல் வலுவாகப் பிடித்திருத்தல் அல்லது நிலைத்திருத்தல் என்ற கட்டளையின் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: ὃ ἔχεις
  choice: உன்னிடம் இருப்பதை
  rationale: மூலத்தில் பொருள் எதுவென்று குறிப்பிடப்படாததை அப்படியே விடுகிறது; சூழலிலிருந்து அதை அறிய இடமளிக்கிறது.
- source_word: ἵνα μηδεὶς λάβῃ
  choice: யாரும் … எடுத்துக்கொள்ளாதபடி
  rationale: தடுக்கப்பட வேண்டிய விளைவைச் சுட்டும் நோக்கக் கூற்றைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: στέφανόν
  choice: கிரீடத்தை
  rationale: பொதுவாகப் புரியக்கூடிய சொல்; இது அரச மணிமுடியைக் காட்டிலும் வெற்றி அல்லது கௌரவத்திற்கான மாலை என்ற குறிப்பான நுண்பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: கிறிஸ்துவின் வருகையைப் பற்றிய ταχύ என்பதன் நுண்பொருள்
  choice: விரைவில்
  alternative: விரைவாக
  rationale: இச்சொல் கால நெருக்கத்தையோ செயலின் வேகத்தையோ வலியுறுத்தக்கூடும். முதன்மை உரை நெருங்கிய வருகை என்ற இயல்பான வாசிப்பைத் தருகிறது; மற்ற சாத்தியம் அடிக்குறிப்பில் வைக்கப்பட்டதால் மூலத்தின் தெளிவின்மை தீர்த்துவைக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஒருமை இரண்டாம் நபர் அழைப்பையும் கட்டளையின் தீவிரத்தையும் காத்து, சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் நோக்கக் கட்டமைப்பைத் தெளிவாக்க “அப்படிச் செய்” சேர்க்கப்பட்டுள்ளது; இது புதிய கருத்தைச் சேர்க்காமல் முன்னுள்ள கட்டளையுடன் “எடுத்துக்கொள்ளாதபடி” என்ற பகுதியை இயல்பாக இணைக்கிறது.
