  verdict: revise
  source_fidelity: The principal clauses accurately render ἔρχομαι ταχύ, κράτει ὃ ἔχεις, and ἵνα μηδεὶς λάβῃ τὸν στέφανόν σου. However, “அப்படிச் செய்” adds a further imperative not present in the Greek and makes the purpose clause less direct.
  naturalness: “உறுதியாகப் பற்றிக்கொள்” is natural modern Tamil for the imperative. Removing the added “அப்படிச் செய்” yields a more idiomatic and concise purpose construction.
  terminology: “கிரீடம்” is an accessible rendering of στέφανος, and the footnote appropriately distinguishes it from a royal diadem. The footnote on “விரைவில்” preserves the viable alternative sense “விரைவாக.”
  issues:
  - severity: medium
    issue: The phrase “அப்படிச் செய்” has been added after the purpose clause.
    rationale: Greek has only the command “hold fast what you have” followed by a purpose clause, “so that no one may take your crown.” The added imperative is not required for Tamil grammar and introduces wording absent from the source.
