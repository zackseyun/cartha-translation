id: REV.3.20
reference: Revelation 3:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἰδοὺ ἕστηκα ἐπὶ τὴν θύραν καὶ κρούω· ἐάν τις ἀκούσῃ τῆς φωνῆς μου καὶ ἀνοίξῃ τὴν θύραν, ⸀καὶ εἰσελεύσομαι πρὸς αὐτὸν καὶ δειπνήσω μετ’ αὐτοῦ καὶ αὐτὸς μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/020.yaml
  text: Look[a], I stand at the door and knock. If anyone hears my voice and opens the door, I will come in to him and dine with him[c][b], and he with me.
translation:
  language: ta
  text: இதோ[a], நான் கதவினருகே நின்று தட்டிக்கொண்டிருக்கிறேன். யாராவது என் குரலைக் கேட்டு கதவைத் திறந்தால், நான் அவரிடம் வந்து[b], அவரோடு உணவருந்துவேன்[c]; அவரும் என்னோடு உணவருந்துவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பார்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் கவனத்தை உடனடியாக ஈர்க்கிறது. “நின்று” என்பதற்கான கிரேக்க வினை நிறைவுவடிவில் இருந்து நிகழ்கால நிலையை உணர்த்துகிறது; “தட்டிக்கொண்டிருக்கிறேன்” என்பது தொடரும் நிகழ்காலச் செயல்.
    reason: lexical_alternative
  - marker: b
    text: “நான் உள்ளே நுழைவேன்” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள சொற்றொடர் ஓர் இடத்துக்குள் நுழைவதை மட்டும் அல்லாமல், அந்த நபரை நோக்கிய தனிப்பட்ட உறவையும் உணர்த்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: ஒன்றாக உணவருந்தும் உருவகம் நெருக்கமான, பரஸ்பர உடனுறவை வெளிப்படுத்துகிறது. இது குறிப்பாக ஆண்டவரின் இராப்போஜனத்தையா, மனமாற்றத்தையா, அல்லது மீட்டெடுக்கப்பட்ட உறவையா குறிக்கிறது என்பதில் விளக்கங்கள் வேறுபடுகின்றன; வசனமே அதைத் தெளிவாகத் தீர்மானிக்கவில்லை.
    reason: cross_reference
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை உடனடியாக ஈர்க்கும் இடைச்சொல்; நவீனத் தமிழிலும் இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: ἕστηκα
  choice: நின்று
  rationale: நிகழ்கால நிலையை உணர்த்தும் நிறைவுவினையின் பொருளை, தொடரும் தட்டும் செயற்பாட்டுடன் இயல்பாக இணைக்கிறது.
- source_word: ἐπὶ τὴν θύραν
  choice: கதவினருகே
  rationale: கதவுக்கு வெளியே அதனருகில் நிற்கும் இடநிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: κρούω
  choice: தட்டிக்கொண்டிருக்கிறேன்
  rationale: நிகழ்காலத்தில் தொடரும் தட்டும் செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐάν τις
  choice: யாராவது
  rationale: பாலின வரையறையற்ற திறந்த நிபந்தனையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἀκούσῃ τῆς φωνῆς μου
  choice: என் குரலைக் கேட்டு
  rationale: φωνή என்பதை வெறும் ஓசையாக அல்லாமல் குரலாகக் காட்டுகிறது; நிபந்தனைச் செயல்களின் தொடர்பையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἀνοίξῃ τὴν θύραν
  choice: கதவைத் திறந்தால்
  rationale: நிபந்தனை வாக்கியத்தில் உள்ள இறந்தகாலத் துணைவினை வடிவைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: καὶ εἰσελεύσομαι πρὸς αὐτόν
  choice: நான் அவரிடம் உள்ளே வந்து
  rationale: εἰσέρχομαι என்பதின் உள்ளே நுழைதலையும் πρὸς αὐτόν என்பதின் தனிப்பட்ட உறவுநோக்கையும் ஒன்றாகப் பாதுகாக்கிறது.
- source_word: δειπνήσω
  choice: உணவருந்துவேன்
  rationale: முக்கிய உணவைப் பகிர்ந்து கொள்வதைக் கண்ணியமான, பண்பாட்டளவில் குறுகாத தமிழில் தெரிவிக்கிறது.
- source_word: μετ’ αὐτοῦ καὶ αὐτὸς μετ’ ἐμοῦ
  choice: அவரோடு உணவருந்துவேன்; அவரும் என்னோடு உணவருந்துவார்
  rationale: கிரேக்கத்தின் இருதரப்பு வலியுறுத்தலைத் தமிழில் தெளிவாக்க, இரண்டாம் பகுதியில் விடுபட்ட வினை மீண்டும் வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: உணவு உடனுறவின் உருவகம்
  choice: தனிப்பட்ட, பரஸ்பர உணவு உடனுறவாக நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: இது குறிப்பாக ஆண்டவரின் இராப்போஜனம், மனமாற்றம், அல்லது விசுவாசியோ திருச்சபையோடு மீட்கப்பட்ட உறவு என்று விளக்குவது.
  rationale: வசனம் நெருக்கமான பரஸ்பர உறவைத் தெளிவாகக் காட்டினாலும், அந்த உணவின் குறிப்பிட்ட இறையியல் அடையாளத்தைத் தீர்மானிப்பதில்லை; எனவே உருவகத்தின் திறந்த தன்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடை. “இதோ,” “உணவருந்துவேன்” ஆகியவை வேதாகமச் செறிவைத் தக்கவைத்தும் பழமையான நடையைத் தவிர்த்தும் உள்ளன. பாலின வரையறையற்ற “யாராவது” மற்றும் மரியாதை ஒருமை “அவர்” பயன்படுத்தப்பட்டுள்ளன.
