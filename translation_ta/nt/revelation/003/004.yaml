id: REV.3.4
reference: Revelation 3:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλὰ ⸂ἔχεις ὀλίγα⸃ ὀνόματα ἐν Σάρδεσιν ἃ οὐκ ἐμόλυναν τὰ ἱμάτια αὐτῶν, καὶ περιπατήσουσιν μετ’ ἐμοῦ ἐν λευκοῖς, ὅτι ἄξιοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/004.yaml
  text: But you have a few names in Sardis who have not soiled their garments[a], and they will walk with me in white[c][b], because they are worthy.
translation:
  language: ta
  text: ஆனாலும், சர்தை நகரில் தங்கள் ஆடைகளைக் கறைப்படுத்தாத சில பெயர்கள்[a] உன்னிடம் இருக்கின்றன. அவர்கள் வெண்ணிற ஆடைகளில்[b] என்னோடு நடப்பார்கள்; ஏனெனில் அவர்கள் தகுதியுள்ளவர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சிலர்.” கிரேக்கத்தில் நேரடியாக “சில பெயர்கள்” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் சுருக்கமாக “வெண்ணிறத்தில்” என்று உள்ளது; இங்கே வெண்ணிற ஆடைகள் குறிக்கப்படுவது சாத்தியம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ஆனாலும்
  rationale: முந்தைய கண்டனத்துக்கு மாறாக இப்போது கூறப்படும் விதிவிலக்கை இயல்பாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: ἔχεις ὀλίγα ὀνόματα
  choice: சில பெயர்கள் உன்னிடம் இருக்கின்றன
  rationale: ὀνόματα என்பதன் நேரடியான ‘பெயர்கள்’ என்ற உருவகப் பயன்பாட்டைப் பாதுகாக்கிறது; அது சில நபர்களைக் குறிக்கும் என்பது தொடரிலிருந்து தெளிவாகிறது.
- source_word: ἐν Σάρδεσιν
  choice: சர்தை நகரில்
  rationale: நகரைக் குறிக்கும் இடப்பொருளை நவீன தமிழில் தெளிவாக வழங்குகிறது.
- source_word: οὐκ ἐμόλυναν τὰ ἱμάτια αὐτῶν
  choice: தங்கள் ஆடைகளைக் கறைப்படுத்திக்கொள்ளாத
  rationale: μολύνω என்பதிலுள்ள கறைபடுத்துதல்/தீட்டுப்படுத்துதல் என்ற ஆடை உருவகத்தை இயல்பான தமிழில் காக்கிறது; வினை நிகழ்ந்ததன் விளைவு தொடர்வதையும் வடிவம் உணர்த்துகிறது.
- source_word: περιπατήσουσιν μετ’ ἐμοῦ
  choice: என்னோடு நடப்பார்கள்
  rationale: நேரடியான நடப்பது என்ற படிமத்தையும் உடனிருப்பு மற்றும் ஐக்கியத்தின் உட்பொருளையும் விரிவாக்கமின்றிப் பாதுகாக்கிறது.
- source_word: ἐν λευκοῖς
  choice: வெண்ணிற ஆடைகளுடன்
  rationale: கிரேக்கத்தில் மறைந்திருக்கும் ஆடைப் பொருளை முந்தைய ἱμάτια சூழலின் அடிப்படையில் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὅτι ἄξιοί εἰσιν
  choice: ஏனெனில் அவர்கள் தகுதியுள்ளவர்கள்
  rationale: காரணத் தொடர்பையும் ἄξιος என்பதன் தகுதி/பாத்திரம் என்ற நேரடியான கருத்தையும் கோட்பாட்டு விளக்கமின்றிக் காக்கிறது.
theological_decisions:
- issue: ὀνόματα என்பதை ‘மக்கள்’ எனப் பொருளாக்குவதா, ‘பெயர்கள்’ என வைத்திருப்பதா
  choice: முதன்மை உரையில் ‘சில பெயர்கள்’ என்று வைத்தல்
  alternative: சிலர்; சில மனிதர்கள்
  rationale: கிரேக்கத்தின் குறிப்பிடத்தக்க சொல்லாட்சியையும் கிறிஸ்துவுக்கு முன் தனித்தனியாக அறியப்படும் நபர்கள் என்ற சாத்தியமான நுண்ணுணர்வையும் பாதுகாக்கிறது; அடிக்குறிப்பு வழக்குப் பொருளைத் தெளிவுபடுத்துகிறது.
- issue: μολύνω என்பதன் ஒழுக்க/தூய்மை உருவகத்தை எவ்வாறு வழங்குவது
  choice: ‘ஆடைகளைக் கறைப்படுத்திக்கொள்ளாத’
  alternative: ஆடைகளைத் தீட்டுப்படுத்தாத
  rationale: ஆடை உருவகத்தை எளிதில் புரியும் தமிழில் காக்கிறது; ‘தீட்டுப்படுத்துதல்’ என்ற வலுவான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἐν λευκοῖς என்பதிலுள்ள விடுபட்ட பெயர்ச்சொல்
  choice: ‘வெண்ணிற ஆடைகளுடன்’ என்று வெளிப்படுத்தல்
  alternative: வெண்ணிறத்தில்
  rationale: கிரேக்க சொற்றொடர் சுருக்கமானதாக இருந்தாலும் முந்தைய ஆடைக் குறிப்பால் ஆடைகளே இயல்பாகப் புரிகின்றன; தமிழில் ‘வெண்ணிறத்தில்’ மட்டும் தெளிவற்றதாக இருப்பதால் ஆடைப் பொருள் வெளிப்படுத்தப்படுகிறது.
- issue: ἄξιοί εἰσιν என்பதை தகுதி அல்லது இரட்சிப்புக்கான சம்பாத்தியம் என விளக்குவது
  choice: ‘அவர்கள் தகுதியுள்ளவர்கள்’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: அவர்கள் பாத்திரமானவர்கள்
  rationale: வசனத்தின் இறையியல் அழுத்தத்தை மெலிதாக்காமலும், இரட்சிப்புத் தகுதி குறித்த விரிவான கோட்பாட்டை அதில் புகுத்தாமலும் மூலத்தின் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வெளிப்படுத்தின விசேஷத்திற்கேற்ற கண்ணியமான படிம மொழி பயன்படுத்தப்பட்டுள்ளது. ‘பெயர்கள்’ என்ற அசாதாரண மூல உருவகம் திட்டமிட்டே காக்கப்பட்டுள்ளது; ‘சர்தை’ என்ற பரவலான தமிழ் இடப்பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது. ‘தகுதியுள்ளவர்கள்’ என்பது இறையியல் விளக்கம் சேர்க்காமல் மூலக் கூற்றை நேரடியாக வழங்குகிறது.
