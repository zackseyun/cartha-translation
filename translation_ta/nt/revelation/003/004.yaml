  naturalness: «சர்தை நகரில்», «சில பெயர்கள் உன்னிடம் இருக்கின்றன», «என்னோடு நடப்பார்கள்», «தகுதியுள்ளவர்கள்» ஆகியவை நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமான வெளிப்படுத்தின விசேஷ நடைக்குப் பொருத்தமாகவும் உள்ளன. திருத்தப்பட்ட வினைச்சொல் மற்றும் இடவேற்றுமை வடிவம் இன்னும் இயல்பாக அமையும்.
