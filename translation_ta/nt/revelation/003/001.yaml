id: REV.3.1
reference: Revelation 3:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Σάρδεσιν ἐκκλησίας γράψον· Τάδε λέγει ὁ ἔχων τὰ ἑπτὰ πνεύματα τοῦ θεοῦ καὶ τοὺς ἑπτὰ ἀστέρας· Οἶδά σου τὰ ἔργα, ὅτι ὄνομα ἔχεις ὅτι ζῇς, καὶ νεκρὸς εἶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/001.yaml
  text: 'And write to the angel of the church in Sardis: These things says the one who has the seven spirits of God and the seven stars: I know your works[a]; you have a name that you are alive[d][c][b], but you are dead.'
translation:
  language: ta
  text: '“சர்தையிலுள்ள திருச்சபையின் தூதனுக்கு[a] எழுது: தேவனுடைய ஏழு ஆவிகளையும்[b] ஏழு நட்சத்திரங்களையும் உடையவர் கூறுவது இதுவே: உன் செயல்களை நான் அறிவேன்; நீ உயிருடன் இருக்கிறாய் என்று பெயர் பெற்றிருக்கிறாய், ஆனால் நீ இறந்தவனாய் இருக்கிறாய்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தூதன்” என்பது வானதூதரையோ செய்தியாளரையோ குறிக்கலாம். கிரேக்கச் சொல் ἄγγελος இவ்விரு பொருள்களிலும் பயன்படுகிறது; வெளிப்படுத்தல் நூலின் காட்சிமிக்க சூழலில் “வானதூதன்” என்பது இயல்பான புரிதலாக இருக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: “தேவனுடைய ஏழு ஆவிகள்” என்பது கிரேக்கத்தின் பன்மை வடிவத்தை அப்படியே தக்கவைக்கிறது. இது பரிசுத்த ஆவியின் முழுமையை அடையாளமாகக் குறிக்கலாம்; வேறு சிலர் இதை ஏழு வானுலக ஆவிகள் என்று புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: தூதனுக்கு
  rationale: ἄγγελος என்பதன் அடிப்படைப் பொருள் தூதன்; அது வானதூதரையோ செய்தியாளரையோ குறிக்கலாம். வெளிப்படுத்தின விசேஷத்தின் சூழலில் இந்தத் தமிழ்ச் சொல் இரு சாத்தியங்களையும் அளவுக்கு மீறித் தீர்மானிக்காமல் வைத்திருக்கிறது.
- source_word: ἐκκλησίας
  choice: திருச்சபையின்
  rationale: சர்தையிலுள்ள கிறிஸ்தவ விசுவாசிகளின் கூடுகையைக் குறிக்கும் நிலைபெற்ற, இயல்பான தமிழ் வேதாகமச் சொல்.
- source_word: Τάδε λέγει
  choice: கூறுவது இதுவே
  rationale: தீர்க்கதரிசன அறிவிப்பின் முறையான தொனியைத் தக்கவைத்துக்கொண்டு, கிரேக்கப் பன்மைச் சுட்டுப்பெயரின் கருத்தை இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: ὁ ἔχων
  choice: உடையவர்
  rationale: பெயர்ச்சொல் தன்மையுடன் வரும் நிகழ்காலப் பங்கேற்புச் சொல்லைச் சுருக்கமாகவும் மரியாதையான நடையிலும் பிரதிபலிக்கிறது.
- source_word: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: தேவனுடைய ஏழு ஆவிகள்
  rationale: விவாதத்திற்குரிய அடையாளப் பொருளைத் தீர்மானிக்காமல், கிரேக்கப் பன்மையை நேரடியாகத் தக்கவைக்கிறது.
- source_word: τοὺς ἑπτὰ ἀστέρας
  choice: ஏழு நட்சத்திரங்கள்
  rationale: எளிய நேரடி மொழிபெயர்ப்பு; இவ்வசனத்துக்குள் அதன் அடையாளப் பொருளைச் சேர்க்கவில்லை.
- source_word: Οἶδά σου τὰ ἔργα
  choice: உன் செயல்களை நான் அறிவேன்
  rationale: சொல் வரிசையை இயல்பான தமிழுக்கு ஏற்றவாறு மாற்றி, οἶδα மற்றும் ἔργα ஆகியவற்றின் நேரடியான பொருளைப் பாதுகாக்கிறது.
- source_word: ὄνομα ἔχεις ὅτι ζῇς
  choice: நீ உயிருள்ளவன் என்று பெயர் பெற்றிருக்கிறாய்
  rationale: ‘பெயர் உடையவன்’ என்ற கிரேக்க மரபுத்தொடரின் பொது நற்பெயர் அல்லது புகழ் என்ற கருத்தைத் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது; உயிர்–இறப்பு முரணையும் தக்கவைக்கிறது.
- source_word: νεκρὸς εἶ
  choice: நீ இறந்தவனாய் இருக்கிறாய்
  rationale: உருவக ஆன்மீகத் தீர்ப்பின் கடுமையை மென்மைப்படுத்தாமல் நேரடியாக வழங்குகிறது.
theological_decisions:
- issue: ‘தேவனுடைய ஏழு ஆவிகள்’ என்பதன் பொருள்
  choice: மூலத்தின் பன்மை வடிவத்தை ‘தேவனுடைய ஏழு ஆவிகள்’ என்று முதன்மை உரையில் தக்கவைத்தல்
  alternative: பரிசுத்த ஆவியின் முழுமையைக் குறிக்கும் ‘ஏழுவகையான தேவ ஆவி’; அல்லது தேவனுக்கு முன்பாக இருக்கும் ஏழு வானுலக ஆவிகள்
  rationale: கிரேக்க உரை பன்மையில் உள்ளது; அதன் அடையாளப் பொருள் விவாதிக்கப்படுவதால் மொழிபெயர்ப்பு அதைத் தனியாகத் தீர்மானிக்கக் கூடாது.
- issue: திருச்சபையின் ἄγγελος யார் என்பது
  choice: பொருள் வரம்பைத் திறந்துவைக்கும் ‘தூதன்’
  alternative: வானதூதன்; மனிதச் செய்தியாளர் அல்லது திருச்சபைப் பிரதிநிதி
  rationale: சொல் வானுலகத் தூதரையும் மனிதச் செய்தியாளரையும் குறிக்கக்கூடும். வெளிப்படுத்தின விசேஷத்தின் பேருருவக் காட்சி சூழல் வானதூதர் என்ற வாசிப்புக்கு ஆதரவளித்தாலும், வசனம் குறிப்பிட்ட அடையாளத்தைத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘திருச்சபை’, ‘தேவன்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. தீர்க்கதரிசன அறிவிப்பின் முறையான தொனியும், ‘உயிருள்ளவன்’—‘இறந்தவன்’ என்ற கூர்மையான முரணும் பாதுகாக்கப்பட்டுள்ளன. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
