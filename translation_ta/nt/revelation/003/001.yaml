revisions:
- from: '“சர்தை நகரிலுள்ள திருச்சபையின் தூதனுக்கு எழுத வேண்டியது: ‘தேவனுடைய ஏழு ஆவிகளையும் ஏழு நட்சத்திரங்களையும் உடையவர் கூறுவது இதுவே: உன் செயல்களை நான் அறிவேன். நீ உயிருள்ளவன் என்று பெயர் பெற்றிருக்கிறாய்; ஆனால் நீ இறந்தவனாய் இருக்கிறாய்.’”[a][b]'
  to: '“சர்தையிலுள்ள திருச்சபையின் தூதனுக்கு[a] எழுது: தேவனுடைய ஏழு ஆவிகளையும்[b] ஏழு நட்சத்திரங்களையும் உடையவர் கூறுவது இதுவே: உன் செயல்களை நான் அறிவேன்; நீ உயிருடன் இருக்கிறாய் என்று பெயர் பெற்றிருக்கிறாய், ஆனால் நீ இறந்தவனாய் இருக்கிறாய்.”'
  rationale: திருத்தம் மூலத்தின் கட்டளை வடிவத்தை மீட்டமைத்து, அடிக்குறிப்பு அடையாளங்களை அவை குறிக்கும் சொற்களோடு இணைக்கிறது. ‘ஏழு ஆவிகள்’ மற்றும் ‘தூதன்’ குறித்த விளக்கங்கள் எந்த ஒரு இறையியல் விளக்கத்தையும் முதன்மை உரையில் திணிக்காமல், மூலத்தின் திறந்த தன்மையைப் பாதுகாக்கின்றன.
