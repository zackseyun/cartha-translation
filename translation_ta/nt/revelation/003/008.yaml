id: REV.3.8
reference: Revelation 3:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Οἶδά σου τὰ ἔργα— ἰδοὺ δέδωκα ἐνώπιόν σου θύραν ἠνεῳγμένην, ἣν οὐδεὶς δύναται κλεῖσαι αὐτήν— ὅτι μικρὰν ἔχεις δύναμιν, καὶ ἐτήρησάς μου τὸν λόγον, καὶ οὐκ ἠρνήσω τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/008.yaml
  text: I know your works. Look[a], I have set before you an open door, which no one is able to shut, because you have little strength, and you have kept my word, and have not denied my name.
translation:
  language: ta
  text: உன் செயல்களை நான் அறிவேன். இதோ, உனக்கு முன்பாக ஒரு திறக்கப்பட்ட கதவை[a] வைத்திருக்கிறேன்; அதை யாராலும் மூட முடியாது. ஏனெனில் உனக்கு வலிமை குறைவாகவே உள்ளது; நீ என் வார்த்தையைக் கடைப்பிடித்தாய், என் பெயரை மறுதலிக்கவும் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘திறக்கப்பட்ட ஒரு கதவு’ என்பதற்குப் பதிலாக ‘திறந்த ஒரு கதவு’ அல்லது ‘திறந்தே நிற்கும் ஒரு கதவு’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கப் பெயரெச்சம் அந்தக் கதவு திறக்கப்பட்டு திறந்த நிலையில் இருப்பதைச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδά σου τὰ ἔργα
  choice: உன் செயல்களை நான் அறிவேன்
  rationale: οἶδα வடிவில் நிறைவுக்காலமாக இருந்தாலும் நிகழ்காலப் பொருள் தருகிறது. ἔργα என்பதன் பன்மையையும் வெளிப்படுத்தும் இயல்பான நவீனத் தமிழ் இது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் கிரேக்க உரையாடல் குறியைச் சுருக்கமாகவும் மரியாதைமிக்க தமிழிலும் தக்கவைக்கிறது.
- source_word: δέδωκα ἐνώπιόν σου
  choice: உனக்கு முன்பாக ... வைத்திருக்கிறேன்
  rationale: δέδωκα என்பதன் நிறைவுற்ற செயலும் அதன் தற்போதைய விளைவும் தமிழின் ‘வைத்திருக்கிறேன்’ என்ற அமைப்பில் இயல்பாக வெளிப்படுகின்றன.
- source_word: θύραν ἠνεῳγμένην
  choice: திறக்கப்பட்ட ஒரு கதவு
  rationale: ἠνεῳγμένην என்பது கதவு திறக்கப்பட்டு அந்த நிலையிலேயே இருப்பதைக் குறிக்கும் நிறைவுக்காலப் பெயரெச்சம்; வெறும் ‘திறந்த கதவு’ என்பதைக் காட்டிலும் வினைச்செயலின் கூறை இது காக்கிறது.
- source_word: ἣν οὐδεὶς δύναται κλεῖσαι αὐτήν
  choice: அதை யாராலும் மூட முடியாது
  rationale: δύναται என்பதிலுள்ள இயலாமை/திறன் கருத்தைத் தமிழில் இயல்பான எதிர்மறை ஆற்றல்வினை அமைப்பால் தெரிவிக்கிறது.
- source_word: ὅτι μικρὰν ἔχεις δύναμιν
  choice: ஏனெனில், உனக்கு வலிமை சிறிதே இருந்தாலும்
  rationale: ὅτι காரணத் தொடர்பை அறிமுகப்படுத்துகிறது. μικρὰν δύναμιν என்பது குறைந்த திறன் அல்லது ஆற்றலைக் குறிக்கிறது; ‘வலிமை சிறிதே’ அதை அரசியல் அல்லது அற்புத ஆற்றலாகக் குறுக்காமல் காக்கிறது. சூழலில் அடுத்த இரு விசுவாசச் செயல்களோடு இயல்பாக இணைய ‘இருந்தாலும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐτήρησάς μου τὸν λόγον
  choice: நீ என் வார்த்தையைக் கடைப்பிடித்து
  rationale: τηρέω என்பதில் காத்தல், பற்றிக்கொள்ளுதல், கீழ்ப்படிதல் ஆகிய நுணுக்கங்கள் உள்ளன; ‘கடைப்பிடித்து’ இச்சூழலில் விசுவாசமான அனுசரிப்பை இயல்பாகத் தெரிவிக்கிறது, λόγος என்பதற்கு ‘வார்த்தை’ தக்கவைக்கப்படுகிறது.
- source_word: οὐκ ἠρνήσω τὸ ὄνομά μου
  choice: என் பெயரை மறுதலிக்கவில்லை
  rationale: ἀρνέομαι என்பதன் மறுத்தல் அல்லது உறவை நிராகரித்தல் என்ற வலிமையை ‘மறுதலிக்கவில்லை’ காக்கிறது; ‘பெயர்’ என்ற பிரதிநிதித்துவமிக்க உருவகமும் மாற்றப்படவில்லை.
theological_decisions:
- issue: ‘திறக்கப்பட்ட கதவு’ என்ற உருவகத்தின் பொருள்
  choice: உருவகத்தை விளக்காமல் அப்படியே தக்கவைத்தல்
  alternative: நற்செய்திப் பணிக்கான வாய்ப்பு, இரட்சிப்பு/அரசுக்குள் நுழைவு, அல்லது பொதுவான இறை அருள் வாய்ப்பு என வெளிப்படையாக விளக்குதல்
  rationale: இந்த வசனம் கதவின் குறிப்பிட்ட பொருளைத் தீர்மானிப்பதில்லை. ஆகவே மொழிபெயர்ப்பு அதன் இறையியல் பல்வாய்ப்பையும் பதற்றத்தையும் திறந்தவாறே வைக்கிறது.
- issue: ὅτι மற்றும் μικρὰν ἔχεις δύναμιν ஆகியவற்றின் தொடர்பு
  choice: ‘ஏனெனில், உனக்கு வலிமை சிறிதே இருந்தாலும்’
  alternative: ‘ஏனெனில் உனக்கு கொஞ்சம் வலிமை இருக்கிறது’ அல்லது ‘உனக்கு வலிமை சிறிது இருப்பதை நான் அறிவேன்’
  rationale: ὅτι காரணத்தைக் காட்டுவது தெளிவு; μικράν என்பது ‘சிறிதளவு உள்ளது’ அல்லது ‘மிகக் குறைவு’ என்ற இரு நிழல்களையும் அனுமதிக்கிறது. தமிழில் ‘சிறிதே இருந்தாலும்’ குறைந்த வலிமையிலும் நிலைத்த விசுவாசம் காணப்பட்ட முரணை வெளிப்படுத்துகிறது; கதவின் பயனைத் தனியே விளக்கவில்லை.
- issue: கிரேக்க நிறைவுக்கால வடிவங்களின் வலிமை
  choice: கிறிஸ்துவின் செயலில் ‘வைத்திருக்கிறேன்’; சபையின் விசுவாசத்தில் இயல்பான தமிழ் இறந்தகால நிறைவு அமைப்பு
  alternative: எல்லாவற்றையும் சொற்சொல்லாக ஒரே மாதிரியான நிறைவுக்கால வடிவில் அமைத்தல்
  rationale: δέδωκα மற்றும் ἠνεῳγμένην ஆகியவற்றின் தொடரும் விளைவு தமிழில் வெளிப்படையாகக் காக்கப்படுகிறது. ἐτήρησας, ἠρνήσω ஆகியவை கிரேக்கத்தில் aorist வடிவங்கள்; ஆகவே அவற்றை நிறைவுக்காலங்கள் எனக் கட்டாயப்படுத்தாமல் ‘கடைப்பிடித்து... மறுதலிக்கவில்லை’ என மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை இரண்டாம் நபர் வடிவங்களுடன் மரியாதைமிக்க வேதாகம நடையைப் பேணுகிறது. மூலத்தின் நீண்ட தொடரை வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரித்தாலும், காரணத் தொடர்பும் இணை அமைப்பும் காக்கப்பட்டுள்ளன.
