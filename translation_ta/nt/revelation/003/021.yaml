id: REV.3.21
reference: Revelation 3:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ νικῶν δώσω αὐτῷ καθίσαι μετ’ ἐμοῦ ἐν τῷ θρόνῳ μου, ὡς κἀγὼ ἐνίκησα καὶ ἐκάθισα μετὰ τοῦ πατρός μου ἐν τῷ θρόνῳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/021.yaml
  text: The one who conquers—I will grant him to sit with me on my throne[b][a], just as I also conquered and sat down with my Father on his throne.
translation:
  language: ta
  text: வெற்றி பெறுகிறவனுக்கு[a][b], நான் என் அரியணையில் என்னோடு அமரும் உரிமையை அளிப்பேன்; நானும் வெற்றி பெற்றேன், என் தந்தையோடு அவருடைய அரியணையில் அமர்ந்தேன்; அதுபோலவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஜெயங்கொள்ளுகிறவன்’ என்றும் மொழிபெயர்க்கலாம். இந்த வசனத்தில் νικάω என்ற கிரேக்க வினை இருமுறை வருகிறது; வெற்றி என்ற மையக்கருத்தையும் இரு இடங்களிலுள்ள சொல்லிணைப்பையும் காக்க ‘வெற்றி பெறுகிறவன் / வெற்றி பெற்றேன்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘வெற்றி பெறுகிறவன்’ என்ற ஆண்பால் ஒருமை இங்கு பிரதிநிதித்துவப் பொருளுடையது; வெற்றி பெறும் ஒவ்வொரு விசுவாசிக்கும் இந்த வாக்குறுதி உரியது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: வெற்றி பெறுகிறவன்
  rationale: நிகழ்காலப் பெயரெச்சம் பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்டுள்ளதையும், வெளிப்படுத்தின விசேஷத்தில் திரும்பத் திரும்ப வரும் வெற்றி என்ற மையக்கருத்தையும் காக்கிறது.
- source_word: δώσω αὐτῷ καθίσαι
  choice: அவனுக்கு … அமரும் உரிமையை அளிப்பேன்
  rationale: δίδωμι உடன் வரும் வினையெச்சத் தொடர் இங்கு ஒரு சிறப்புரிமையை வழங்குவதைக் குறிக்கிறது. ‘உரிமையை அளிப்பேன்’ என்பது வெறும் அனுமதி அல்லது காரணப்படுத்துதல் என்ற பொருளைத் தவிர்த்து, தமிழில் இயல்பாக அந்த நுணுக்கத்தைத் தருகிறது.
- source_word: μετ’ ἐμοῦ ἐν τῷ θρόνῳ μου
  choice: என் அரியணையில் என்னோடு
  rationale: μετά கூறும் உடனிருப்பையும், அரியணையில் அமர்தல் என்ற ஆட்சிப் படிமத்தையும் இயல்பான தமிழ் சொல்வரிசையில் காக்கிறது.
- source_word: ὡς κἀγὼ
  choice: நானும் … போலவே
  rationale: ὡς என்பதன் ஒப்பீட்டையும் κἀγώ என்பதிலுள்ள ‘நானும்’ என்ற சேர்க்கைப் பொருளையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐνίκησα
  choice: வெற்றி பெற்று
  rationale: முதல் νικάω வடிவத்துடன் ஒரே சொல்லாட்சித் தொடர்பைக் காத்து, வசனத்தின் வெற்றி மையக்கருத்தைத் தொடர்கிறது.
- source_word: ἐκάθισα μετὰ τοῦ πατρός μου ἐν τῷ θρόνῳ αὐτοῦ
  choice: என் தந்தையோடு அவருடைய அரியணையில் அமர்ந்தது
  rationale: முடிவுற்ற வெற்றிக்குப் பின்வரும் அரியணை அமர்வை இயல்பாக மொழிபெயர்த்து, தந்தையுடனான உறவையும் இணை அமர்வையும் விரிவாக்கமின்றிக் காக்கிறது.
theological_decisions:
- issue: வெற்றி பெறுகிறவருக்கான வாக்குறுதியில் வரும் ஆண்பால் ஒருமை
  choice: ‘வெற்றி பெறுகிறவனுக்கு’ என்ற ஆண்பால் ஒருமையை முதன்மை உரையில் வைத்தல்
  alternative: ‘வெற்றி பெறுகிறவருக்கு’ அல்லது ‘வெற்றி பெறும் ஒவ்வொருவருக்கும்’
  rationale: கிரேக்க மூலத்தில் ஆண்பால் ஒருமைப் பெயரெச்சமும் அதனுடன் ஒத்த ஒருமைப் பதிலிடுபெயரும் உள்ளன; அதேவேளையில் அது பிரதிநிதித்துவப் பொருளில் எல்லா விசுவாசிகளையும் உள்ளடக்குகிறது. அந்த வடிவத்தையும் அதன் பரந்த பொருளையும் முறையே முதன்மை உரை மற்றும் அடிக்குறிப்பில் காக்கிறது.
- issue: விசுவாசி கிறிஸ்துவின் அரியணையில் அவரோடு அமர்வதற்கும், கிறிஸ்து தந்தையின் அரியணையில் அவரோடு அமர்வதற்கும் இடையிலான ஒப்புமை
  choice: மூலத்தின் வலுவான இணை ஒப்புமையை மென்மையாக்காமலும் விளக்கிச் சேர்க்காமலும் நேரடியாக மொழிபெயர்த்தல்
  alternative: அமர்வை வெறும் அடையாளமாக விளக்குதல் அல்லது நபர்களுக்கிடையிலான வேறுபாட்டை மொழிபெயர்ப்பிலேயே விரிவாகச் சேர்த்தல்
  rationale: வசனம் வாக்குறுதியளிக்கப்பட்ட பங்கேற்புக்கும் இயேசுவின் வெற்றிகரமான அரியணை அமர்வுக்கும் தெளிவான ஒப்புமையை அமைக்கிறது. அந்த இறையியல் அழுத்தத்தை மொழிபெயர்ப்பு அப்படியே காக்க வேண்டும்; அதன் தன்மையைத் தனியாகத் தீர்மானிக்கக் கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘அரியணை’ வெளிப்படுத்தின விசேஷத்தின் அரசாட்சி படிமத்தைக் காக்கிறது. ‘அமரும் உரிமையை அளிப்பேன்’ என்பது மூலத்திலுள்ள வழங்கப்பட்ட சிறப்புரிமையைத் தெளிவாகவும் அதிக விளக்கமின்றியும் தெரிவிக்கிறது.
