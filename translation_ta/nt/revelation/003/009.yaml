revisions:
- from: இதோ, சாத்தானுடைய ஜெபக்கூடத்தைச் சேர்ந்த சிலரை நான் உன்னிடம் ஒப்புக்கொடுக்கிறேன்[a]—தங்களை யூதர்கள் என்று சொல்லிக்கொள்கிறார்கள்; ஆனால் அவர்கள் யூதர்கள் அல்ல, பொய் சொல்கிறார்கள். இதோ, அவர்களை உன்னிடம் வரவும், உன் கால்களுக்கு முன்பாகத் தலைவணங்கவும்[b] செய்வேன். நான் உன்னை அன்புகூர்ந்தேன் என்பதை அவர்கள் அறிந்துகொள்வார்கள்.
  to: இதோ, சாத்தானுடைய ஜெபக்கூடத்தைச் சேர்ந்த—தங்களை யூதர்கள் என்று சொல்லிக்கொள்கிற, ஆனால் யூதர்கள் அல்லாதவர்களும் பொய் சொல்கிறவர்களுமான—சிலரை நான் கொடுக்கிறேன்[a]. இதோ, அவர்கள் வந்து உன் கால்களுக்கு முன்பாகத் தலைவணங்கும்படி செய்வேன்[b]; நான் உன்னை அன்புகூர்ந்தேன் என்பதை அவர்கள் அறிந்துகொள்வார்கள்.
  rationale: The revision removes unsupported ‘to you’ language and the interpretively stronger ‘hand over,’ while retaining the Greek’s present tense and partitive expression. It also keeps the contested/polemical statement about claimed Jewish identity close to the source, uses ‘bow down’ rather than divine-worship terminology, and preserves the footnote anchors and their functions.
