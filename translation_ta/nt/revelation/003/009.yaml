source:
  edition: SBLGNT
  text: ἰδοὺ ⸀διδῶ ἐκ τῆς συναγωγῆς τοῦ Σατανᾶ, τῶν λεγόντων ἑαυτοὺς Ἰουδαίους εἶναι, καὶ οὐκ εἰσὶν ἀλλὰ ψεύδονται— ἰδοὺ ποιήσω αὐτοὺς ἵνα ⸂ἥξουσιν καὶ προσκυνήσουσιν⸃ ἐνώπιον τῶν ποδῶν σου, καὶ γνῶσιν ὅτι ⸀ἐγὼ ἠγάπησά σε.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/009.yaml
  text: Look[a], I am giving some from the synagogue of Satan—those who call themselves Jews and are not, but are lying—look, I will make them come and bow down before your feet[b], and they will know that I have loved you.
translation:
  language: ta
  text: இதோ, சாத்தானுடைய ஜெபக்கூடத்தைச் சேர்ந்த—தங்களை யூதர்கள் என்று சொல்லிக்கொள்கிற, ஆனால் யூதர்கள் அல்லாதவர்களும் பொய் சொல்கிறவர்களுமான—சிலரை நான் கொடுக்கிறேன்[a]. இதோ, அவர்கள் வந்து உன் கால்களுக்கு முன்பாகத் தலைவணங்கும்படி செய்வேன்[b]; நான் உன்னை அன்புகூர்ந்தேன் என்பதை அவர்கள் அறிந்துகொள்வார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, “சாத்தானுடைய ஜெபக்கூடத்திலிருந்து கொடுக்கிறேன்.” மூலத்தில் “கொடுக்கிறேன்” என்பதற்கு வெளிப்படையான செயப்படுபொருள் இல்லை; இது அந்தக் குழுவைச் சேர்ந்த சிலரைக் குறிக்கலாம்.
    reason: மூலத்தில் διδῶ என்பதற்கான வெளிப்படையான செயப்படுபொருள் இல்லை; ἐκ என்பதன் பகுதி சார்ந்த பொருளும் வாக்கியத்தின் சுருக்கமும் வாசகருக்குத் தெரிவிக்கப்படுகிறது.
  - marker: b
    text: அல்லது, “உன் கால்களுக்கு முன்பாக வந்து பணிந்துகொள்ளும்படி.” கிரேக்க வினைச்சொல் “தலைவணங்கு” அல்லது “வழிபடு” என்று பொருள்படலாம்; இங்கு மனிதரின் கால்களுக்கு முன் செய்யப்படும் செயல் என்பதால் “தலைவணங்க” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: προσκυνέω என்பதன் சொற்பொருள் வரம்பையும், தெய்வ வழிபாடு என்ற தவறான உட்பொருளைத் தவிர்த்த மொழிபெயர்ப்புத் தீர்மானத்தையும் பதிவு செய்கிறது.
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் இடைச்சொல்லாகவும், இருமுறை வரும் மூலத்தின் வலியுறுத்தலைப் பேணவும் இயல்பான நவீனத் தமிழில் ‘இதோ’ பயன்படுத்தப்பட்டது.
- source_word: διδῶ
  choice: நான் உன்னிடம் ஒப்புக்கொடுக்கிறேன்
  rationale: நிகழ்கால வடிவம் பேணப்படுகிறது. தமிழில் வெறும் ‘கொடுக்கிறேன்’ என்பது தெளிவற்றிருப்பதால், ஒருவரின் முன் கொண்டுவருதல் அல்லது அவரிடம் ஒப்படைத்தல் என்ற சூழல்சார் பொருளை ‘ஒப்புக்கொடுக்கிறேன்’ தெளிவாக்குகிறது; ‘சிலரை’ என்பது ἐκ என்பதன் பகுதி சார்ந்த பொருளிலிருந்து நிரப்பப்பட்டுள்ளது.
- source_word: ἐκ τῆς συναγωγῆς τοῦ Σατανᾶ
  choice: சாத்தானுடைய ஜெபக்கூடத்தைச் சேர்ந்த சிலரை
  rationale: ἐκ என்பதன் ‘அந்தக் குழுவிலிருந்து’ என்ற பகுதி சார்ந்த வலிமையை ‘சேர்ந்த சிலரை’ வெளிப்படுத்துகிறது. συναγωγή என்பதற்கு யூத வழிபாட்டுச் சூழலைக் குறிக்கும் நிலைபெற்ற தமிழ் சொல் ‘ஜெபக்கூடம்’ பயன்படுத்தப்பட்டது.
- source_word: τῶν λεγόντων ἑαυτοὺς Ἰουδαίους εἶναι
  choice: தங்களை யூதர்கள் என்று சொல்லிக்கொள்கிறார்கள்
  rationale: தற்சுட்டுப் பொருளையும் அவர்களுடைய சொந்த உரிமைகோரலையும் இயல்பான தமிழில் நேரடியாகப் பேணுகிறது.
- source_word: καὶ οὐκ εἰσὶν ἀλλὰ ψεύδονται
  choice: ஆனால் அவர்கள் யூதர்கள் அல்ல, பொய் சொல்கிறார்கள்
  rationale: தமிழில் விடுபட்ட நிரப்புப்பெயரால் ஏற்படக்கூடிய குழப்பத்தைத் தவிர்க்க ‘யூதர்கள்’ மீண்டும் சொல்லப்பட்டுள்ளது; மூலத்தின் கூர்மையான எதிர்மறைத் தீர்ப்பும் நிகழ்காலச் செயலும் பேணப்படுகின்றன.
- source_word: ποιήσω αὐτοὺς ἵνα ἥξουσιν καὶ προσκυνήσουσιν
  choice: அவர்களை உன்னிடம் வரவும், உன் கால்களுக்கு முன்பாகத் தலைவணங்கவும் செய்வேன்
  rationale: ποιήσω என்பதன் காரணவினை வலிமை ‘செய்வேன்’ என்பதால் வெளிப்படுகிறது. προσκυνέω இங்கு மனிதரின் கால்களுக்கு முன் நிகழ்வதால், தெய்வ வழிபாட்டைத் தவறாக உணர்த்தாத ‘தலைவணங்க’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἐνώπιον τῶν ποδῶν σου
  choice: உன் கால்களுக்கு முன்பாக
  rationale: ‘உன் காலடியில்’ என்ற இயல்பான மாற்றுக்கு மாறாக, ἐνώπιον என்பதன் ‘முன்பாக’ என்ற வெளிப்பாட்டை நெருக்கமாகப் பேணுகிறது.
- source_word: γνῶσιν ὅτι ἐγὼ ἠγάπησά σε
  choice: நான் உன்னை அன்புகூர்ந்தேன் என்பதை அவர்கள் அறிந்துகொள்வார்கள்
  rationale: ἠγάπησα என்பதன் இறந்தகால வலிமையை ‘அன்புகூர்ந்தேன்’ பேணுகிறது; γνῶσιν நோக்கமோ விளைவோ ஆகிய இரண்டையும் அனுமதிக்கும் வகையில் இயல்பான எதிர்காலமாக மொழிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: ‘தங்களை யூதர்கள் என்று சொல்லிக்கொள்கிறார்கள்; ஆனால் அவர்கள் யூதர்கள் அல்ல’ என்பதன் பொருள்
  choice: மூலத்தில் உள்ள கூர்மையான உடன்படிக்கை சார்ந்த அல்லது உண்மைத்தன்மை சார்ந்த தீர்ப்பு அப்படியே மொழிபெயர்க்கப்படுகிறது; இன அடையாளம் பற்றிய விரிவான மறுப்பாக விளக்கப்படவில்லை.
  alternative: ‘உண்மையான யூதர்கள் அல்ல’ அல்லது ‘ஆவிக்குரிய யூதர்கள் அல்ல’ என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: மூலம் எந்த அர்த்தத்தில் ‘அல்ல’ என்று இவ்வசனத்திலேயே விளக்கவில்லை. ஆகவே இறையியல் பதற்றத்தையும் தெளிவின்மையையும் பேணி, யூதர்களுக்கு எதிரான விரிவாக்கத்தைச் சேர்க்காமல் நேரடியாக மொழிபெயர்க்கப்பட்டது.
- issue: விசுவாசியின் கால்களுக்கு முன் προσκυνέω செய்வதன் வலிமை
  choice: ‘தலைவணங்க’ என மொழிபெயர்த்து, பணிவு அல்லது கீழ்ப்படிதலின் உடல் செயலைக் குறித்தல்.
  alternative: ‘வழிபட’ என மொழிபெயர்த்தல்.
  rationale: ‘வழிபட’ என்பது விசுவாசிக்குத் தெய்வ வழிபாடு செலுத்தப்படுவதாகத் தமிழில் தவறாக உணர்த்தலாம். ‘தலைவணங்க’ என்பது சொல்லின் பரந்த பொருள் வரம்பையும் இச்சூழலையும் காக்கிறது.
- issue: γνῶσιν உடன் வரும் ἵνα கட்டமைப்பின் நோக்கம் அல்லது விளைவு
  choice: ‘அவர்கள் அறிந்துகொள்வார்கள்’ என்று விளைவை இயல்பாகக் கூறுதல்.
  alternative: ‘அவர்கள் அறிந்துகொள்ளும்படியாக’ என்று வெளிப்படையான நோக்கவாக்கியமாக்குதல்.
  rationale: ἵνα இங்கு நோக்கத்தையும் எதிர்பார்க்கப்பட்ட விளைவையும் சுமக்கலாம். தமிழ் உரை ஒன்றை மட்டும் வற்புறுத்தாமல் நிகழ்வுகளின் தொடர்ச்சியாக அமைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் வெளிப்படுத்தல் நூலின் கண்ணியமான, தீர்க்கதரிசனத் தொனியைப் பேணும் வகையிலும் மொழிநடை அமைக்கப்பட்டது. ‘இதோ’ என்ற மறுமொழி, இரண்டாம் நபர் ஒருமை, நிகழ்கால ‘ஒப்புக்கொடுக்கிறேன்,’ இறந்தகால ‘அன்புகூர்ந்தேன்’ ஆகியவை மூலத்தின் இலக்கண வலியுறுத்தல்களை இயன்றவரை காக்கின்றன.
