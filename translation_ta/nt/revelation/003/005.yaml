  source_fidelity: மூலத்தின் எதிர்கால வாக்குறுதிகள், οὕτως-ன் தொடர்புப்பொருள், οὐ μή-யின் வலியுறுத்தப்பட்ட மறுப்பு, ‘வாழ்வின் புத்தகம்,’ மற்றும் பிதாவுக்கும் அவருடைய தூதர்களுக்கும் முன்பாக நிகழும் அங்கீகாரம் ஆகியவை நன்றாகப் பாதுகாக்கப்பட்டுள்ளன. ஆனால் ‘வெண்ணிற ஆடைகளை அணிவிக்கப்படுவான்’ என்பதில் ‘ஆடைகளை’ என்ற நேர்முக வேற்றுமை, செயப்பாட்டு ‘அணிவிக்கப்படுவான்’ உடன் இயல்பாக இணைவதில்லை. περιβαλεῖται-யின் நடுநிலைப் பொருளை இயல்பாகத் தரும் ‘அணிந்துகொள்வான்’ எனத் திருத்துவது பாதுகாப்பானது.
  naturalness: ‘வெற்றி பெறுகிறவன்’ எனப் பிரித்து எழுதுவது நவீன தரமான தமிழில் இயல்பானது. ‘அவனுடைய பெயரை வெளிப்படையாக அங்கீகரிப்பேன்’ என்பது ὁμολογήσω-ன் பொது அங்கீகாரப் பொருளைத் தெளிவாகவும், ‘ஒப்புக்கொள்’ என்பதன் சாத்தியமான குற்றஒப்புதல் நிழற்பொருளின்றியும் தெரிவிக்கிறது.
