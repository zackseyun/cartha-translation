id: REV.3.5
reference: Revelation 3:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ νικῶν ⸀οὕτως περιβαλεῖται ἐν ἱματίοις λευκοῖς, καὶ οὐ μὴ ἐξαλείψω τὸ ὄνομα αὐτοῦ ἐκ τῆς βίβλου τῆς ζωῆς, καὶ ὁμολογήσω τὸ ὄνομα αὐτοῦ ἐνώπιον τοῦ πατρός μου καὶ ἐνώπιον τῶν ἀγγέλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/005.yaml
  text: The one who conquers will thus be clothed in white garments[a], and I will certainly not erase his name from the book of life[d][c][b], and I will confess his name before my Father and before his angels.
translation:
  language: ta
  text: வெற்றி பெறுகிறவன் இவ்வாறே வெண்ணிற ஆடைகளை அணிந்துகொள்வான்[a]. அவனுடைய பெயரை வாழ்வின் புத்தகத்திலிருந்து நான் ஒருபோதும் அழிக்கமாட்டேன்[b][c]; என் பிதாவின் முன்னிலையிலும் அவருடைய தூதர்களின் முன்னிலையிலும் அவனுடைய பெயரை வெளிப்படையாக அங்கீகரிப்பேன்[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஜெயங்கொள்கிறவன்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவனுடைய பெயரை வாழ்வின் புத்தகத்திலிருந்து நிச்சயமாக அழிக்கமாட்டேன்.” கிரேக்கத்தில் வலியுறுத்தப்பட்ட மறுப்பு பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: “வாழ்வின் புத்தகம்” என்பது கடவுளுக்குரியவர்களாக இருந்து வாழ்வைச் சுதந்தரிப்பவர்களின் பரலோகப் பதிவேட்டைக் குறிக்கும் உருவகம்.
    reason: cultural_note
  - marker: d
    text: அல்லது, “அவனுடைய பெயரை அங்கீகரிப்பேன்.” மத்தேயு 10:32-ஐ ஒப்பிடுக.
    reason: cross_reference
lexical_decisions:
- source_word: ὁ νικῶν
  choice: வெற்றிபெறுகிறவன்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட நிகழ்காலப் பங்கேற்புவினையின் தொடர்ச்சியான, குணாதிசயமான வெற்றி எண்ணத்தையும் வெளிப்படுத்துதலின் வெற்றி மையக்கருத்தையும் காக்கிறது.
- source_word: οὕτως
  choice: இவ்வாறே
  rationale: முந்தைய சூழலிலுள்ள வாக்குறுதியுடன் உள்ள தொடர்பையும் ஒப்புமையையும் விளக்கச் சேர்க்காமல் காக்கிறது.
- source_word: περιβαλεῖται
  choice: அணிவிக்கப்படுவான்
  rationale: எதிர்கால நடு/செயப்பாட்டு வடிவத்தை இச்சூழலில் வாக்குறுதியான அணிவித்தலாக இயல்பாகக் காட்டுகிறது; தானே அணிந்துகொள்வான் என்று தேவையின்றித் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: ἱματίοις λευκοῖς
  choice: வெண்ணிற ஆடைகளை
  rationale: ἱμάτια என்பதன் பொதுவான 'ஆடைகள்' பொருளைக் காக்கிறது; குறிப்பாக நீண்ட அங்கிகள் என்று இறுக்கவில்லை. வெண்மை குறியீடு நேரடியாகப் பாதுகாக்கப்படுகிறது.
- source_word: οὐ μὴ ἐξαλείψω
  choice: நான் ஒருபோதும் அழிக்கமாட்டேன்
  rationale: οὐ μή உடனான வலியுறுத்தப்பட்ட மறுப்பைத் தெளிவான நவீன தமிழில் தெரிவிக்கிறது; புத்தகப் பதிவிலிருந்து பெயரை அழிக்கும் உருவகத்துக்கும் பொருந்துகிறது.
- source_word: ἐκ τῆς βίβλου τῆς ζωῆς
  choice: வாழ்வின் புத்தகத்திலிருந்து
  rationale: βίβλος என்பதற்கான இயல்பான வேதாகமச் சொல்லாட்சியையும் பரலோகப் பதிவேட்டின் உருவகத்தையும் காக்கிறது.
- source_word: ὁμολογήσω
  choice: வெளிப்படையாக ஏற்றுக்கொள்வேன்
  rationale: பொதுவில் அறிக்கையிட்டு அங்கீகரிக்கும் பொருளைக் காட்டுகிறது. தமிழில் 'அறிக்கையிடுவேன்' அல்லது 'ஒப்புக்கொள்வேன்' என்பவற்றால் ஏற்படக்கூடிய குழப்பத்தைத் தவிர்க்கிறது.
- source_word: ἐνώπιον
  choice: முன்னிலையில்
  rationale: இரு இடங்களிலும் 'சந்நிதியில்/முன்பாக' என்ற நேரடியான உறவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τοῦ πατρός μου
  choice: என் பிதாவின்
  rationale: இயேசுவின் தனித்துவமான பிதா-மகன் உறவை நேரடியாகக் காக்கும், வேதாகமத் தமிழில் பரவலாகப் புரியப்படும் மரியாதையான வடிவம்.
- source_word: τῶν ἀγγέλων αὐτοῦ
  choice: அவருடைய தூதர்களின்
  rationale: அருகிலுள்ள 'என் பிதா' என்பதையே αὐτοῦ இயல்பாகச் சுட்டுவதைக் காக்கிறது; 'அவருடைய' மரியாதை ஒருமை தமிழில் தெளிவளிக்கிறது.
theological_decisions:
- issue: வாழ்வின் புத்தகத்திலிருந்து பெயரை அழிக்கமாட்டேன் என்ற வாக்குறுதியும் நிலைத்திருத்தல்/விசுவாசத் துறப்பு விவாதமும்
  choice: வெற்றிபெறுகிறவனுக்கான உறுதியான வாக்குறுதியாக நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: இது பரிசுத்தவான்களின் இறுதி நிலைத்திருத்தலை நிரூபிக்கிறது என்றோ, இரட்சிப்பை இழப்பதற்கான வாய்ப்பை நிரூபிக்கிறது என்றோ வெளிப்படையாக விளக்குதல்.
  rationale: வசனம் வலியுறுத்தப்பட்ட மறுப்போடு வாக்குறுதி அளிக்கிறது; ஆனால் விரிவான கோட்பாட்டு விவாதத்தை இந்தச் சொல்லாட்சி மட்டும் சந்தேகமின்றித் தீர்ப்பதில்லை. ஆகவே அதன் உறுதியும் இறையியல் பதற்றமும் இரண்டும் காக்கப்பட்டன.
- issue: ஆண்பால் ஒருமை அமைப்பின் மொழிபெயர்ப்பு
  choice: வெற்றிபெறுகிறவன்; அவனுடைய பெயர்
  alternative: வெற்றிபெறுகிறவர்; அவர்களுடைய பெயர்
  rationale: மூலத்தின் ஆண்பால் ஒருமை இலக்கணத்தையும் பிரதிநிதித்துவப் பொதுப்பொருளையும் காக்கிறது; பன்மை பாலினநடுநிலையாக்கம் மூல வடிவத்தை மாற்றும்.
- issue: ὁμολογήσω என்பதன் அறிக்கை/அங்கீகாரப் பொருள்
  choice: அவனுடைய பெயரை வெளிப்படையாக ஏற்றுக்கொள்வேன்
  alternative: அவனுடைய பெயரை அறிக்கையிடுவேன் அல்லது ஒப்புக்கொள்வேன்
  rationale: கிறிஸ்து பிதாவுக்கும் தூதர்களுக்கும் முன் அந்த நபரைப் பொதுவில் அங்கீகரிப்பதே கருத்து. தமிழில் குற்றத்தை ஒப்புக்கொள்ளுதல் என்ற தவறான நிழற்பொருளைத் தவிர்த்தபடியே பொது அறிவிப்பின் வலிமை காக்கப்படுகிறது.
translation_notes:
  register: நவீன தரமான தமிழில் இயல்பும் கண்ணியமும் கொண்ட வேதாகம நடை பயன்படுத்தப்பட்டது. 'பிதா' என்பது இங்கு இயேசுவின் உறவைத் துல்லியமாகக் காக்கிறது; மற்ற சொற்றொடர்கள் பொதுவாசகருக்குப் புரியும் வகையில் அமைக்கப்பட்டன. மூலத்தின் மூன்று எதிர்கால வாக்குறுதிகளும், வலியுறுத்தப்பட்ட மறுப்பும், ஆண்பால் ஒருமை பிரதிநிதித்துவ வடிவமும் பாதுகாக்கப்பட்டன.
