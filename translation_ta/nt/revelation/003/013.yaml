id: REV.3.13
reference: Revelation 3:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/013.yaml
  text: The one who has an ear[b][a], let him hear what the Spirit says to the churches.
translation:
  language: ta
  text: கேட்கக் காதுள்ளவர், ஆவியானவர் திருச்சபைகளுக்குச் சொல்வதைக் கேட்கட்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்குச் சொல்: “காதுள்ளவர், ஆவியானவர் திருச்சபைகளுக்குச் சொல்வதைக் கேட்கட்டும்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: கேட்கக் காதுள்ளவர்
  rationale: கிரேக்கத்தில் ஒருமையில் உள்ள ‘காதை உடையவர்’ என்ற பழமொழித் தன்மையுள்ள அழைப்பை, கவனித்துக் கேட்கும் பொருளுடன் இயல்பான நவீனத் தமிழில் வழங்குகிறது.
- source_word: ἀκουσάτω
  choice: கேட்கட்டும்
  rationale: மூன்றாம் நபர் ஒருமை கட்டளை வடிவத்தைப் பாதுகாக்கிறது; வெறுமனே ஒலி கேட்பதை மட்டுமல்லாமல் கவனித்து ஏற்றுக்கொள்வதையும் சூழலில் உணர்த்துகிறது.
- source_word: τί
  choice: சொல்வதை
  rationale: ஆவியானவர் பேசும் செய்தியின் உள்ளடக்கத்தை இயல்பான தமிழில் குறிக்கிறது.
- source_word: τὸ πνεῦμα
  choice: ஆவியானவர்
  rationale: வெளிப்படுத்தின விசேஷத்தின் திருச்சபைகளுக்கான மீளும் அறிவுறுத்தல் சூத்திரத்தில் இது பரிசுத்த ஆவியானவரைக் குறிக்கிறது; தமிழின் மரியாதைமிக்க நபர்ச் சுட்டலைப் பயன்படுத்துகிறது.
- source_word: λέγει
  choice: சொல்கிறார்
  rationale: நிகழ்காலப் பேச்சுச் செயலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ταῖς ἐκκλησίαις
  choice: திருச்சபைகளுக்கு
  rationale: ஆவியானவரின் உரையைப் பெறுவோரைக் குறிக்கும் பன்மைத் தந்தை வேற்றுமையைத் தெளிவாக வழங்குகிறது; வெளிப்படுத்தின விசேஷத்தின் ஏழு திருச்சபைகள் என்ற சூழலுக்கு ஏற்ற வழக்கமான சொல்.
theological_decisions:
- issue: τὸ πνεῦμα என்பதன் குறிப்பு
  choice: திருச்சபைகளிடம் பேசும் பரிசுத்த ஆவியானவர்
  alternative: மனித ஆவி அல்லது ஆள்தன்மையற்ற தீர்க்கதரிசன ஆவி
  rationale: திருச்சபைகளுக்கான செய்திகளின் இறுதியில் மீண்டும் வரும் இந்தச் சூத்திரத்தில் ‘ஆவியானவர்’ என்பது பரிசுத்த ஆவியானவரையே மிக இயல்பாகக் குறிக்கிறது; இது எந்தத் தனிப்பட்ட பிரிவுக் கோட்பாட்டையும் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் வேதாகம அறிவுறுத்தலுக்குரிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கேட்கக் காதுள்ளவர்’ என்பது தமிழில் இயல்பை மேம்படுத்தும் சிறிய வெளிப்படுத்தல்; சொல்லுக்குச் சொல் வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
