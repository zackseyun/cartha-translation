id: REV.3.15
reference: Revelation 3:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Οἶδά σου τὰ ἔργα, ὅτι οὔτε ψυχρὸς εἶ οὔτε ζεστός. ὄφελον ψυχρὸς ἦς ἢ ζεστός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/015.yaml
  text: 'I know your works: you are neither cold nor hot[a]. I wish that you were cold or hot.'
translation:
  language: ta
  text: 'உன் செயல்களை நான் அறிவேன்: நீ குளிராகவும் இல்லை, சூடாகவும் இல்லை. நீ குளிராகவோ சூடாகவோ இருந்தால் நன்றாயிருக்குமே![a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆ, நீ குளிராகவோ சூடாகவோ இருந்தால்!”
    reason: ὄφελον வெளிப்படுத்தும் தீவிரமான விருப்பத்தை ‘எவ்வளவு நன்றாயிருக்கும்’ என்ற முழுவாக்கிய வடிவத்துக்கு மாற்றாக, இயல்பான தமிழின் விருப்ப/ஏக்க வடிவில் காட்டுகிறது.
lexical_decisions:
- source_word: Οἶδά
  choice: நான் அறிவேன்
  rationale: οἶδα இங்கு நிகழ்கால நிலைப்பொருளில் வருகிறது; நேரடியான மதிப்பீட்டுத் தொனியை ‘நான் அறிவேன்’ இயல்பாகக் காக்கிறது.
- source_word: σου τὰ ἔργα
  choice: உன் செயல்களை
  rationale: ἔργα என்பதன் செயல் மற்றும் ஒழுக்க மதிப்பீட்டு வலிமையைத் தக்கவைத்து, நவீனத் தமிழில் இயல்பாக ஒலிக்கிறது.
- source_word: ψυχρὸς
  choice: குளிராக
  rationale: வெப்பநிலை உருவகத்தை விளக்காமல், ζεστός என்பதுடனான நேரெதிர் வேறுபாட்டை அப்படியே காக்கிறது.
- source_word: ζεστός
  choice: சூடாக
  rationale: அடிப்படை வெப்பநிலைச் சொல்லை இயல்பான தமிழில் தருகிறது; ‘கொதிப்பாக’ அல்லது ‘ஆர்வமாய்’ என்று உருவகத்தை மிகைப்படுத்தவோ விளக்கவோ இல்லை.
- source_word: ὄφελον
  choice: இருந்தால் நன்றாயிருக்குமே
  rationale: தற்போதைய உண்மைநிலைக்கு மாறான தீவிர விருப்பத்தை நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
- source_word: ἢ
  choice: -வோ ... -வோ
  rationale: இரு மாற்றுகளுக்கிடையிலான பிரிநிலையைத் தமிழின் இயல்பான இணை அமைப்பில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘குளிர்’ மற்றும் ‘சூடு’ என்ற வெப்பநிலை உருவகத்தின் பொருள்
  choice: உருவகத்தை விளக்காமல் ‘குளிராக’, ‘சூடாக’ என்று நேரடியாகத் தக்கவைத்தல்
  alternative: ‘குளிர்’ என்பது ஆவிக்குரிய அக்கறையின்மை என்றும் ‘சூடு’ என்பது ஆவிக்குரிய ஆர்வம் என்றும் விளக்குதல்; அல்லது இரண்டும் வெவ்வேறு விதத்தில் பயனளிப்பவை என்று விளக்குதல்
  rationale: இந்த வசனம் உருவகத்தின் குறியீட்டுப் பொருளைத் தெளிவாக விளக்கவில்லை. ஆகவே ஒரு குறிப்பிட்ட இறையியல் விளக்கத்தை மொழிபெயர்ப்புக்குள் புகுத்தாமல் அதன் உண்மையான தெளிவின்மையையும் இழுபறியையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நேரடி நடை. ஒருமை இரண்டாம் நபரான σου/εἶ/ἦς என்பவற்றை ‘உன்/நீ’ என்று காக்கிறது. வெப்பநிலை உருவகம் விளக்கமின்றித் தக்கவைக்கப்பட்டுள்ளது.
