id: REV.3.16
reference: Revelation 3:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὕτως, ὅτι χλιαρὸς εἶ καὶ ⸀οὔτε ζεστὸς οὔτε ψυχρός, μέλλω σε ἐμέσαι ἐκ τοῦ στόματός μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/016.yaml
  text: So[a], because you are lukewarm, and neither hot nor cold, I am about to vomit you out of my mouth.
translation:
  language: ta
  text: ஆகவே, நீ வெதுவெதுப்பாகவும், சூடாகவோ குளிராகவோ இல்லாமலும் இருப்பதால், உன்னை என் வாயிலிருந்து கக்கிவிடப் போகிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உன்னை என் வாயிலிருந்து வாந்தியெடுத்து வெளியேற்றப் போகிறேன்” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல்லின் நேரடிப் பொருள் “வாந்தியெடு”; இது “துப்பிவிடு” என்பதைவிடக் கடுமையான உருவகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: ஆகவே
  rationale: முந்தைய கூற்றிலிருந்து வரும் விளைவை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ὅτι
  choice: இருப்பதால்
  rationale: அறிவிக்கப்படும் தீர்ப்புக்கான காரணத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: χλιαρός
  choice: வெதுவெதுப்பாக
  rationale: சூடும் குளிரும் அல்லாத மிதமான வெப்பநிலையைத் துல்லியமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: οὔτε ζεστὸς οὔτε ψυχρός
  choice: சூடாகவோ குளிராகவோ இல்லாமல்
  rationale: மூலத்தின் இணை எதிர்மறை அமைப்பையும் வெப்பநிலை உருவகத்தையும் பாதுகாக்கிறது.
- source_word: μέλλω
  choice: போகிறேன்
  rationale: உடனடியாக நிகழவிருக்கும் செயலை இயல்பான தமிழில் உணர்த்துகிறது; வெறும் எதிர்கால வாக்கியமாகத் தட்டையாக்கவில்லை.
- source_word: ἐμέσαι
  choice: வாந்தியெடுக்க
  rationale: கிரேக்க வினையின் கடுமையான, அதிர்ச்சியூட்டும் உருவகத்தை மென்மைப்படுத்தாமல் நேரடியாக வழங்குகிறது.
- source_word: ἐκ τοῦ στόματός μου
  choice: என் வாயிலிருந்து
  rationale: வெளியேற்றப்படுதல் என்ற தெளிவான உடல் சார்ந்த உருவகத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ἐμέσαι என்பதிலுள்ள தீர்ப்பின் கடுமையான உருவகம்
  choice: வாந்தியெடுக்க
  alternative: துப்பிவிட / கக்கிவிட
  rationale: மூலத்தில் திட்டமிட்டு பயன்படுத்தப்பட்ட அதிர்ச்சியூட்டும் தெய்வீக நிராகரிப்பு உருவகத்தை மென்மைப்படுத்தாமல் பாதுகாக்கிறது.
- issue: μέλλω என்பதன் காலவியல் வலிமை
  choice: வாந்தியெடுக்கப் போகிறேன்
  alternative: வாந்தியெடுப்பேன்
  rationale: பொதுவான எதிர்காலத்தை மட்டும் அல்லாமல், நெருங்கி வரும் தீர்ப்பின் அவசரத்தையும் உணர்த்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் மூலத்தின் கடுமையான தீர்ப்பு உருவகத்தைத் தணிக்காமலும் வடிவமைக்கப்பட்டது. ‘சூடாகவோ குளிராகவோ’ என்ற இணை அமைப்பு இயல்பான தமிழ்ச் சொல்லோட்டத்திற்காக முன்வைக்கப்பட்டாலும், ‘வெதுவெதுப்பு’ என்ற மைய உருவகம் அப்படியே பாதுகாக்கப்பட்டுள்ளது.
