revisions:
- from: நான் யாரையெல்லாம் நேசிக்கிறேனோ[a], அவர்களைக் கண்டித்து, நல்வழிப்படுத்துகிறேன்[b]. ஆகவே, ஆர்வத்தோடு செயல்பட்டு[c] மனந்திரும்பு.
  to: நான் நேசிப்பவர்களையெல்லாம் கண்டித்து, திருத்திப் பயிற்றுவிக்கிறேன்[b]. ஆகவே, ஆர்வமாயிரு[c]; மனந்திரும்பு.
  rationale: The revision removes the added notion of “acting” from the command to be zealous and uses a more source-specific rendering for παιδεύω. Footnote a is retained as a valid lexical alternative although the main text has no corresponding marker, preserving the supplied footnote set and its content; markers b and c are anchored to their relevant terms.
