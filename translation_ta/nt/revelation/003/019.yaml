source:
  edition: SBLGNT
  text: ἐγὼ ὅσους ἐὰν φιλῶ ἐλέγχω καὶ παιδεύω· ⸀ζήλευε οὖν καὶ μετανόησον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/019.yaml
  text: Those whom I love[a], I rebuke and discipline[c][b]. Therefore be zealous and repent.
translation:
  language: ta
  text: நான் நேசிப்பவர்களையெல்லாம் கண்டித்து, திருத்திப் பயிற்றுவிக்கிறேன்[b]. ஆகவே, ஆர்வமாயிரு[c]; மனந்திரும்பு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “திருத்திப் பயிற்றுவிக்கிறேன்” என்பது வெறுமனே தண்டிப்பதை அல்ல, திருத்தும் நோக்குடைய பயிற்சியையும் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, “தீவிர அக்கறையுள்ளவனாயிரு” அல்லது “ஊக்கமாயிரு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: நான்
  rationale: கிரேக்கத்தில் வெளிப்படையாக உள்ள வலியுறுத்தப்பட்ட தனிப்பெயரைத் தமிழில் இயல்பான ‘நான்’ என்பதால் காட்டுகிறது; ‘நானோ’ என்பது இங்கு தேவையற்ற முரண்பாட்டுச் சாயலை உருவாக்கலாம்.
- source_word: ὅσους ἐὰν
  choice: யாரையெல்லாம் ... அவர்களை
  rationale: நிபந்தனைத் தன்மையுள்ள வரையறையற்ற உறவுத்தொடரின் ‘யாரெல்லாமோ / எத்தனை பேராயினும்’ என்ற விரிவை இயல்பான தமிழில் காக்கிறது.
- source_word: φιλῶ
  choice: நேசிக்கிறேனோ
  rationale: φιλέω குறிக்கும் உண்மையான அன்பையும் பாசத்தையும் குறைக்காமல், சமகாலத் தமிழில் கண்ணியமாகத் தெரிவிக்கிறது.
- source_word: ἐλέγχω
  choice: கண்டித்து
  rationale: தவறை உணர்த்தி திருத்தத்தை நோக்கும் கண்டனத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: παιδεύω
  choice: நல்வழிப்படுத்துகிறேன்
  rationale: வெறும் தண்டனை அல்லாமல், திருத்திப் பயிற்றுவிக்கும் நோக்கத்தை இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: ζήλευε
  choice: ஆர்வத்தோடு செயல்பட்டு
  rationale: தொடர்ச்சியான கட்டளையாக வரும் சொல் குறிக்கும் தீவிர அக்கறையையும் ஊக்கமான செயல்பாட்டையும் வெளிப்படுத்துகிறது; வெறும் உணர்ச்சியாகச் சுருக்கவில்லை.
- source_word: οὖν
  choice: ஆகவே
  rationale: அன்பினால் வரும் கண்டிப்புக்கும் அழைக்கப்படும் பதில்செயலுக்கும் இடையிலான முடிவுறு தொடர்பைக் காட்டுகிறது.
- source_word: μετανόησον
  choice: மனந்திரும்பு
  rationale: ஒழுக்க மற்றும் ஆன்மிகச் சூழலில் மனப்போக்கை மாற்றித் திரும்புவதைக் குறிக்கும் நிலைபெற்ற, இயல்பான தமிழ் சொல்.
theological_decisions:
- issue: φιλῶ குறிக்கும் அன்புக்கும் தெய்வீகத் திருத்தத்துக்கும் உள்ள உறவு
  choice: ‘நேசிக்கிறேன்’ என்று முழு அன்புச் சொல்லால் மொழிபெயர்த்தல்
  alternative: ‘பாசம் வைத்திருக்கிறேன்’
  rationale: கண்டிப்பும் நல்வழிப்படுத்துதலும் உண்மையான அன்பிலிருந்து வருகின்றன என்ற வசனத்தின் அழுத்தத்தைக் காக்கிறது; φιλέω, ἀγαπάω ஆகியவற்றுக்கிடையே இச்சூழல் கோராத தொழில்நுட்ப வேறுபாட்டை இறக்குமதி செய்யவில்லை.
- issue: παιδεύω என்பதன் இயல்பு
  choice: ‘நல்வழிப்படுத்துகிறேன்’
  alternative: ‘தண்டிக்கிறேன்’ அல்லது ‘பயிற்றுவிக்கிறேன்’
  rationale: திருத்தமும் உருவாக்கமும் சேர்ந்த பொருளைக் காக்கிறது; கடுமையான தண்டனை மட்டுமே என்றோ, மென்மையான கற்பித்தல் மட்டுமே என்றோ ஒருதலைப்பட்சமாக்கவில்லை.
- issue: ζήλευε என்பதிலுள்ள தீவிரம்
  choice: ‘ஆர்வத்தோடு செயல்பட்டு’
  alternative: ‘வைராக்கியமாயிரு’ அல்லது ‘ஊக்கமாயிரு’
  rationale: மனந்திரும்புதலுக்கு வழிவகுக்கும் தீவிர அக்கறையைக் காட்டுகிறது; பழமையான மதச்சார் சொற்சாயலைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை முன்னிலையில் இயேசு சபையை நோக்கிப் பேசும் கட்டளை வடிவம் காக்கப்பட்டுள்ளது. ‘நல்வழிப்படுத்து’ என்பது παιδεύω-வின் திருத்தி உருவாக்கும் பரப்பை இயல்பாகக் காட்டுகிறது; ‘வைராக்கியம்’ போன்ற இன்றைய வாசகருக்கு பழமையான அல்லது தனிச்சமயச் சாயலுள்ள சொல்லாட்சி தவிர்க்கப்பட்டுள்ளது.
