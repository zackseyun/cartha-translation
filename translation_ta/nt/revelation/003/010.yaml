id: REV.3.10
reference: Revelation 3:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι ἐτήρησας τὸν λόγον τῆς ὑπομονῆς μου, κἀγώ σε τηρήσω ἐκ τῆς ὥρας τοῦ πειρασμοῦ τῆς μελλούσης ἔρχεσθαι ἐπὶ τῆς οἰκουμένης ὅλης, πειράσαι τοὺς κατοικοῦντας ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/010.yaml
  text: Because you have kept my word of endurance[a], I also will keep you from the hour of testing that is about to come upon the whole inhabited world[b], to test those who dwell on the earth.
translation:
  language: ta
  text: நீ என் பொறுமையின் செய்தியைக் கடைப்பிடித்ததால்[a], நானும் மக்கள் வாழும் உலகம் முழுவதின்மேல் வரவிருக்கும் சோதனை நேரத்திலிருந்து உன்னைக் காப்பேன்[b]. பூமியில் குடியிருப்பவர்களைச் சோதிப்பதற்காக அந்த நேரம் வரவிருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் பொறுமையைப் பற்றிய செய்தி,” அல்லது “பொறுமையுடன் நிலைத்திருக்கும்படி நான் கொடுத்த செய்தி.” கிரேக்கத் தொடரை ஒன்றுக்கொன்று நெருங்கிய இப்பொருள்களில் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “சோதனை நேரத்தினூடே உன்னைப் பாதுகாப்பேன்,” அல்லது “சோதனை நேரத்துக்கு வெளியே உன்னை வைத்துக் காப்பேன்.” கிரேக்கத்தில் “...இலிருந்து காப்பேன்” என்று உள்ளது; இந்தக் காப்பு எவ்வாறு நிகழும் என்பது குறித்த பிற்கால இறுதிக்காலக் கருத்துவேறுபாடுகளை அந்தச் சொற்றொடர் மட்டும் தீர்மானிப்பதில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐτήρησας
  choice: கடைப்பிடித்ததால்
  rationale: இங்கு τηρέω என்பது இயேசுவின் செய்திக்குக் கீழ்ப்படிந்து அதைப் பற்றிக்கொண்டிருப்பதைக் குறிக்கிறது. காரணத்தைக் காட்டும் ὅτι என்பதையும் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: τὸν λόγον τῆς ὑπομονῆς μου
  choice: என் பொறுமையின் செய்தி
  rationale: λόγος என்பதற்கு இச்சூழலில் ‘செய்தி’ இயல்பானது. மரபுத்தொடரில் உள்ள உறவுவேற்றுமையின் பொருள் ஒன்றுக்கு மேற்பட்ட விதத்தில் புரிந்துகொள்ளக்கூடியதால், அதை முழுமையாகத் தீர்மானிக்காமல் வைத்திருக்கிறது.
- source_word: κἀγώ
  choice: நானும்
  rationale: அவர்கள் கடைப்பிடித்ததற்குப் பதிலாக அவரும் காப்பார் என்ற வலியுறுத்தலுடனான இணைப்பைத் தக்கவைக்கிறது.
- source_word: τηρήσω ἐκ
  choice: உன்னைக் காப்பேன் … நேரத்திலிருந்து
  rationale: τηρέω + ἐκ என்பதன் நேரடியான அமைப்பைப் பின்பற்றி, அந்தக் காப்பு அகற்றுவதாலா, சோதனையினூடே பாதுகாப்பதாலா, அல்லது அதன் தாக்கத்திலிருந்து விலக்குவதாலா நிகழும் என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- source_word: ὥρας
  choice: நேரம்
  rationale: ὥρα என்பதன் நேரப்பகுதியைக் குறிக்கும் பொருளை இயல்பான நவீன தமிழில் தருகிறது; இங்கு அறுபது நிமிட ‘மணி’ என்பது நோக்கமல்ல.
- source_word: πειρασμοῦ / πειράσαι
  choice: சோதனை / சோதிப்பதற்காக
  rationale: பெயர்ச்சொல்லுக்கும் வினைச்சொல்லுக்கும் உள்ள கிரேக்கச் சொல் தொடர்பைத் தமிழிலும் காக்கிறது. இச்சூழலில் ‘சோதனை’ என்பது ‘தூண்டுதல்’ அல்லது ‘சோதித்து அறிதல்’ என்பவற்றைவிட பரந்ததும் பொருத்தமானதும்.
- source_word: τῆς μελλούσης ἔρχεσθαι
  choice: வரவிருக்கும் / வரவிருக்கிறது
  rationale: μέλλω + வினையெச்சத்தின் எதிர்நோக்கிய, நெருங்கிவரும் தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐπὶ τῆς οἰκουμένης ὅλης
  choice: மக்கள் வாழும் உலகம் முழுவதின்மேல்
  rationale: οἰκουμένη என்பது வெறுமனே பிரபஞ்சத்தையல்ல, மனிதர்கள் குடியிருக்கும் உலகத்தைக் குறிக்கும் நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: τοὺς κατοικοῦντας ἐπὶ τῆς γῆς
  choice: பூமியில் குடியிருப்பவர்கள்
  rationale: வெளிப்படுத்தின விசேஷத்தில் மீண்டும் வரும் இந்தச் சொற்றொடரின் வினை வடிவத்தையும் பூமியைச் சுட்டும் பரந்த பொருளையும் காக்கிறது.
theological_decisions:
- issue: இறுதிக்காலச் சூழலில் τηρήσω ἐκ என்பதன் பொருள்
  choice: சோதனை நேரத்திலிருந்து உன்னைக் காப்பேன்
  alternative: சோதனை நேரத்தினூடே உன்னைப் பாதுகாப்பேன்; சோதனை நேரத்துக்கு வெளியே உன்னை வைத்துக் காப்பேன்
  rationale: கிரேக்கத் தொடர் பாதுகாப்பை உறுதியளிக்கிறது; ஆனால் அது முன்கூட்டிய அகற்றலா, சோதனையினூடான பாதுகாப்பா, அல்லது அதன் தாக்கத்திலிருந்து விலக்கலா என்பதைத் தனியாகத் தீர்மானிப்பதில்லை. ஆகவே விவாதிக்கப்படும் இறுதிக்காலக் கோட்பாட்டை உரைக்குள் இறக்குமதி செய்யவில்லை.
- issue: τὸν λόγον τῆς ὑπομονῆς μου என்ற தொடரிலுள்ள உறவுவேற்றுமை
  choice: என் பொறுமையின் செய்தி
  alternative: என் பொறுமையைப் பற்றிய செய்தி; பொறுமையுடன் நிலைத்திருக்கும்படி நான் கொடுத்த செய்தி
  rationale: இந்தக் கிரேக்க அமைப்பு இயேசுவின் பொறுமையைப் பற்றிய செய்தி, பொறுமைக்கு அழைக்கும் அவரது செய்தி, அல்லது பொறுமையால் அடையாளப்படுத்தப்படும் செய்தி என நெருங்கிய பல பொருள்களை அனுமதிக்கிறது. பிரதான உரை அவற்றில் ஒன்றை மட்டும் இறுதியாகத் தேர்ந்தெடுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மணி’ என்பதற்குப் பதிலாக காலப்பகுதியைக் குறிக்கும் ‘நேரம்’ பயன்படுத்தப்பட்டது. நீளமான கிரேக்க வாக்கியம் தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், நோக்கம் மற்றும் தொடர்புகள் மாற்றப்படவில்லை.
