  source_fidelity: மூலக் கிரேக்கத்தின் காரணத் தொடர்பு (ὅτι), பதில்சார் வலியுறுத்தல் (κἀγώ), ‘பொறுமையின் செய்தி’ என்ற உறவுவேற்றுமையின் திறந்த தன்மை, τηρήσω ἐκ-இன் விவாதத்திற்குரிய ஆனால் தீர்மானிக்கப்படாத பாதுகாப்புப் பொருள், உலகளாவிய சோதனை, அதன் நோக்கமான ‘பூமியில் குடியிருப்பவர்களைச் சோதித்தல்’ ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. இரண்டு வாக்கியங்களாகப் பிரித்திருப்பது கிரேக்க நோக்கத் தொடர்பை மாற்றவில்லை.
