id: REV.3.14
reference: Revelation 3:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Λαοδικείᾳ ἐκκλησίας γράψον· Τάδε λέγει ὁ Ἀμήν, ὁ μάρτυς ὁ πιστὸς ⸀καὶ ἀληθινός, ἡ ἀρχὴ τῆς κτίσεως τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/014.yaml
  text: 'And write to the angel of the church in Laodicea: These things says the Amen[a], the faithful and true witness[b], the beginning of the creation of God.'
translation:
  language: ta
  text: 'லவோதிக்கேயாவில் உள்ள திருச்சபையின் தூதருக்கு[a] எழுது: ‘ஆமென்’ என்பவரும், நம்பத்தகுந்தவரும் உண்மையானவருமான சாட்சியும், கடவுளுடைய படைப்பின் தொடக்கமுமானவர் இவ்வாறு கூறுகிறார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தூதர்’ என்பது வானதூதரையோ, செய்தியைக் கொண்டுசெல்லும் மனிதத் தூதரையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: தூதருக்கு
  rationale: ἀγγελος என்பது வானதூதரையோ மனிதத் தூதரையோ குறிக்கலாம். ‘தூதர்’ என்ற சொல் இந்த இரு சாத்தியங்களையும் இயன்றவரை திறந்தே வைத்துக்கொண்டு, ஏழு திருச்சபைகளுக்கான திரும்பத் திரும்ப வரும் முகவரிச் சூத்திரத்தில் இயல்பாக அமைகிறது.
- source_word: Τάδε λέγει
  choice: கூறுவது இதுவே
  rationale: தீர்க்கதரிசன அறிவிப்புச் சூத்திரத்தின் வலிமையைத் தக்கவைத்தபடி, நவீனத் தமிழில் இயல்பாக வாசிக்கப்படுகிறது.
- source_word: ὁ Ἀμήν
  choice: ‘ஆமென்’ என்பவர்
  rationale: இது கிறிஸ்துவுக்குரிய தனித்துவமான பட்டமாகச் செயல்படுவதாலும், உறுதி மற்றும் உண்மை குறித்த எபிரேய வழிபாட்டுச் சொல்லின் எதிரொலியைத் தக்கவைப்பதாலும் ‘ஆமென்’ மொழிபெயர்க்கப்படாமல் வைக்கப்பட்டுள்ளது.
- source_word: μάρτυς
  choice: சாட்சி
  rationale: சட்டரீதியான சான்றளித்தல், வெளிப்படுத்துதல் ஆகிய இரு நுண்பொருள்களையும் தக்கவைக்கும் இயல்பான தமிழ் சொல்.
- source_word: πιστὸς
  choice: உண்மையுள்ளவர்
  rationale: நம்பத்தகுந்த தன்மையையும் உறுதியான பற்றையும் குறிக்கும் பட்டமாக நவீனத் தமிழில் இயல்பாக உள்ளது.
- source_word: ἀληθινός
  choice: மெய்யானவர்
  rationale: πιστός என்பதிலிருந்து வேறுபடுத்தி, உண்மையானதும் போலியல்லாததுமான இயல்பை வெளிப்படுத்துகிறது.
- source_word: ἀρχὴ
  choice: தொடக்கம்
  rationale: ἀρχή என்பதன் நேரடியான பொருளைத் தக்கவைத்து, ‘மூலம்’ அல்லது ‘ஆளுநர்’ என்று சர்ச்சைக்குரிய கிறிஸ்தியல் பொருளை முதன்மை உரையிலேயே தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: κτίσεως
  choice: படைப்பின்
  rationale: κτίσις என்பதற்கான நேரடியான, இயல்பான தமிழ் இணைச்சொல்.
- source_word: τοῦ θεοῦ
  choice: கடவுளுடைய
  rationale: கிரேக்க உடைமை வேற்றுமையை எளிமையாகவும் தெளிவாகவும் எடுத்துரைக்கிறது.
theological_decisions:
- issue: ἡ ἀρχὴ τῆς κτίσεως τοῦ θεοῦ என்ற கிறிஸ்தியல் பட்டத்தின் பொருள்
  choice: கடவுளுடைய படைப்பின் தொடக்கம்
  alternative: கடவுளுடைய படைப்பின் மூலம்/தோற்றுவாய்; கடவுளுடைய படைப்பை ஆளுகிறவர்
  rationale: ἀρχή பல பொருள்களைக் கொண்டிருப்பதாலும் இந்தச் சொற்றொடர் இறையியல் விவாதத்திற்குரியதாலும், முதன்மை உரை அதன் நேரடியான ‘தொடக்கம்’ என்ற பொருளை வைத்திருக்கிறது. கிறிஸ்து படைக்கப்பட்டவர் என்றோ, படைப்பின் மூலமானவர் அல்லது ஆளுநர் என்றோ மொழிபெயர்ப்பே முடிவுசெய்யாமல், உண்மையான பொருள் சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், திருச்சபை வாசிப்பிற்கு ஏற்ற கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. கிரேக்க மூலத்தின் பட்டியல் அமைப்பும் தீர்க்கதரிசன அறிவிப்புச் சூத்திரமும் இயல்பான தமிழ்ச் சொற்றொடராக மாற்றப்பட்டுள்ளன; அதேவேளை ἀγγελος மற்றும் ἀρχή ஆகியவற்றின் உண்மையான பொருள் தெளிவின்மை அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
