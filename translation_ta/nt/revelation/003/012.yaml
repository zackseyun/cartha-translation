id: REV.3.12
reference: Revelation 3:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ νικῶν ποιήσω αὐτὸν στῦλον ἐν τῷ ναῷ τοῦ θεοῦ μου, καὶ ἔξω οὐ μὴ ἐξέλθῃ ἔτι, καὶ γράψω ἐπ’ αὐτὸν τὸ ὄνομα τοῦ θεοῦ μου καὶ τὸ ὄνομα τῆς πόλεως τοῦ θεοῦ μου, τῆς καινῆς Ἰερουσαλήμ, ἡ ⸀καταβαίνουσα ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ μου, καὶ τὸ ὄνομά μου τὸ καινόν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/012.yaml
  text: The one who conquers—I will make him a pillar in the temple of my God[a], and he will never go out from it anymore. And I will write on him the name of my God, and the name of the city of my God, the new Jerusalem, which comes down out of heaven from my God[c][b], and my own new name.
translation:
  language: ta
  text: வெற்றிபெறுகிறவனை என் கடவுளுடைய ஆலயத்தில் ஒரு தூணாக ஆக்குவேன்; அவன் இனி ஒருபோதும் அதைவிட்டு வெளியே போகவே மாட்டான்.[a] அவன்மேல் என் கடவுளுடைய பெயரையும், என் கடவுளுடைய நகரத்தின் பெயரையும்—அதாவது, வானத்திலிருந்து, என் கடவுளிடமிருந்து இறங்கி வருகிற புதிய எருசலேமின் பெயரையும்—என் புதிய பெயரையும் எழுதுவேன்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இனி வெளியே போகவே மாட்டான்” என்பது கிரேக்கத்தில் மிகவும் வலியுறுத்தப்பட்ட மறுப்பு.
    reason: lexical_alternative
  - marker: b
    text: “என் புதிய பெயர்” என்ற கிரேக்கச் சொற்றொடர் வலியுறுத்தப்பட்ட அமைப்பில் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: வெற்றிபெறுகிறவனை
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் நிகழ்காலப் பங்கேற்புவினையின் தொடர்ச்சியான, பிரதிநிதித்துவமான பொருளையும் வெளிப்படுத்தல் நூலில் மீண்டும் வரும் νικάω என்ற வெற்றி மையக்கருத்தையும் காக்கிறது.
- source_word: ποιήσω αὐτὸν στῦλον
  choice: அவனை ... ஒரு தூணாக ஆக்குவேன்
  rationale: ποιέω உடன் வரும் பயனிலை வேற்றுமையான στῦλον என்பதன் மாற்றம் அல்லது நியமிப்பைக் காட்டும் அமைப்பையும் தூண் என்ற முக்கிய உருவகத்தையும் நேரடியாகக் காக்கிறது.
- source_word: ἐν τῷ ναῷ τοῦ θεοῦ μου
  choice: என் கடவுளுடைய ஆலயத்தில்
  rationale: ναός என்பது விரிந்த கோவில் வளாகத்தைவிட ஆலயம் அல்லது பரிசுத்த இடத்தைக் குறிக்கிறது; ‘ஆலயம்’ இயல்பாகவும் கண்ணியமாகவும் உள்ளது. ‘என் கடவுள்’ என்ற மீளுரையும் அப்படியே பாதுகாக்கப்படுகிறது.
- source_word: ἔξω οὐ μὴ ἐξέλθῃ ἔτι
  choice: அவன் இனி ஒருபோதும் அதைவிட்டு வெளியே போகவே மாட்டான்
  rationale: οὐ μή என்ற வலியுறுத்தப்பட்ட மறுப்பை ‘ஒருபோதும் ... போகவே மாட்டான்’ என வெளிப்படுத்துகிறது; ‘அதைவிட்டு’ என்பது ஆலயத்தைச் சுட்டும் மறைமுகப் பொருளை தமிழில் தெளிவாக்குகிறது.
- source_word: γράψω ἐπ’ αὐτὸν
  choice: அவன்மேல் ... எழுதுவேன்
  rationale: γράφω + ἐπί என்பதன் மேலே எழுதுதல் அல்லது பொறித்தல் என்ற படிமத்தை மிகைப்படுத்தாமல் நேரடியாகத் தருகிறது.
- source_word: τὸ ὄνομα τῆς πόλεως τοῦ θεοῦ μου, τῆς καινῆς Ἰερουσαλήμ
  choice: என் கடவுளுடைய நகரத்தின் பெயரையும்—... புதிய எருசலேமின் பெயரையும்—
  rationale: ‘பெயர்’ தொடர்களின் இணை அமைப்பைக் காக்கிறது; apposition-ஐ தமிழில் இடைக்கோடுகளால் தெளிவாக்குகிறது.
- source_word: ἡ καταβαίνουσα ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ μου
  choice: என் கடவுளிடமிருந்து வானத்திலிருந்து இறங்கி வருகிற
  rationale: ἀπό குறிக்கும் கடவுளிடமிருந்தான மூலத்தையும் ἐκ குறிக்கும் வானத்திலிருந்தான புறப்பாட்டையும் இரண்டையும் பாதுகாக்கிறது; தமிழ் இலக்கணத்திற்கேற்ற வரிசையில் தரப்படுகிறது.
- source_word: τὸ ὄνομά μου τὸ καινόν
  choice: என் புதிய பெயரையும்
  rationale: இருமுறை வரும் article உருவாக்கும் வலியுறுத்தலை இயல்பற்ற கூடுதல் சொல் இன்றி தமிழ்ச் சொல்லமைப்பும் இறுதி இடமும் சுமக்கின்றன; பொருள் ஊகிக்கப்படவில்லை.
theological_decisions:
- issue: வாக்குறுதி சூத்திரத்தில் ஆண்பால் ஒருமை
  choice: ‘வெற்றிபெறுகிறவனை’, ‘அவன்’, ‘அவன்மேல்’ என்று ஒருமை ஆண்பால் வடிவத்தைப் பாதுகாத்தல்
  alternative: ‘வெற்றிபெறுகிறவர்’, ‘அவர்கள்’ அல்லது பாலினப் பொதுமைப்படுத்தல்
  rationale: கிரேக்கத்தில் பங்கேற்புவினையும் சுட்டுப்பெயரும் ஆண்பால் ஒருமையில் இருந்தாலும் பொருள் பிரதிநிதித்துவமானது. மூல வடிவத்தை தமிழில் இயல்பாகக் காத்து, அதன் பயன்பாட்டைச் சுருக்கவோ விரிவாக்கவோ செய்யவில்லை.
- issue: உயர்த்தப்பட்ட இயேசுவின் உரையில் ‘என் கடவுள்’ என்ற மீளுரை
  choice: மூலத்தில் உள்ள மூன்று வெளிப்படையான நிகழ்வுகளையும் அப்படியே பாதுகாத்தல்
  alternative: நடைக்காக சில நிகழ்வுகளை விடுதல் அல்லது ஒன்றிணைத்தல்
  rationale: SBLGNT வசனத்தில் τοῦ θεοῦ μου மூன்று முறை வருகிறது. இந்தத் தெய்வியல் முக்கியத்துவமுள்ள மீளுரையை மென்மைப்படுத்தாமல், மூலத்தின் பதற்றத்தையும் மொழியையும் காக்கிறது.
- issue: இறுதி பெயர்த் தொடரின் வலியுறுத்தலும் மர்மமும்
  choice: ‘என் புதிய பெயர்’
  alternative: ‘எனக்கே உரிய புதிய பெயர்’
  rationale: τὸ ὄνομά μου τὸ καινόν வலியுறுத்தப்பட்ட அமைப்பு. தமிழில் அளவுக்கு மீறிய விளக்கமின்றி possessive மற்றும் இறுதி நிலை வலியுறுத்தலைத் தருகின்றன; பெயரின் உள்ளடக்கம் குறித்து ஊகம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘தூண்’, ‘ஆலயம்’, ‘பெயர்’ ஆகிய மூலப் படிமங்களும் இணை அமைப்புகளும் பாதுகாக்கப்பட்டுள்ளன. இடைக்கோடுகள் ‘புதிய எருசலேம்’ என்பது ‘என் கடவுளுடைய நகரம்’ என்பதற்கான விளக்க இணைப்பாக இருப்பதைத் தெளிவாக்குகின்றன.
