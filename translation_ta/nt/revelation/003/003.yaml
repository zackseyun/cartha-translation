id: REV.3.3
reference: Revelation 3:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μνημόνευε οὖν πῶς εἴληφας καὶ ἤκουσας καὶ τήρει, καὶ μετανόησον· ἐὰν οὖν μὴ γρηγορήσῃς, ⸀ἥξω ὡς κλέπτης, καὶ οὐ μὴ ⸀γνῷς ποίαν ὥραν ἥξω ἐπὶ σέ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/003.yaml
  text: Therefore remember how you have received and heard[a]; keep it, and repent. So if you do not stay awake, I will come like a thief[c][b], and you will certainly not know at what hour I will come upon you.
translation:
  language: ta
  text: ஆகவே, நீ எவ்வாறு பெற்றுக்கொண்டாய், கேட்டாய் என்பதை நினைவில் கொள்[a]; அதைக் கடைப்பிடி; மனந்திரும்பு. ஆகவே, நீ விழித்திருக்காவிட்டால்[b], நான் திருடனைப்போல் வருவேன்[c]; எந்த நேரத்தில் உன்மேல் வருவேன் என்பதை நீ நிச்சயமாக அறியமாட்டாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நீ பெற்றுக்கொண்டு கேட்டதை நினைவில் கொள்.’ கிரேக்கத்தில் ‘எவ்வாறு’ என்று உள்ளது; அது அவர்கள் பெற்றுக்கொண்ட முறையை வலியுறுத்தலாம். சிலர் அதைச் செய்தியையே குறிக்கும் வகையில் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: b
    text: ‘விழித்திரு’ என்பதை ‘விழிப்புடன் இரு’ அல்லது ‘எச்சரிக்கையாக இரு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘நான் திருடனைப்போல் வருவேன்’ என்ற எச்சரிக்கை திடீரான, எதிர்பாராத வருகையைப் பற்றிய வேறு வேதாகம மொழிநடையை எதிரொலிக்கிறது. இது இறுதி நியாயத்தீர்ப்பையா அல்லது உடனடியான சீர்திருத்தும் நடவடிக்கையையா குறிக்கிறது என்பதை இந்த வசனம் குறிப்பிடவில்லை.
    reason: cross_reference
lexical_decisions:
- source_word: μνημόνευε
  choice: நினைவில் கொள்
  rationale: நிகழ்காலக் கட்டளை தொடர்ந்து நினைவுகூருவதைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் வலிமையாகவும் உள்ளது.
- source_word: πῶς
  choice: எவ்வாறு
  rationale: பெற்றுக்கொண்டதும் கேட்டதும் நடந்த முறையை முதன்மையாகச் சுட்டுகிறது; ‘எதை’ என்று மாற்றி பொருளைச் சுருக்காமல் கிரேக்கத்தின் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: εἴληφας
  choice: பெற்றுக்கொண்டாய்
  rationale: முன்னர் பெற்றதன் தொடரும் பொருத்தத்தை நிறைவுக்கால வடிவம் உணர்த்துகிறது; தமிழில் சூழலோடு அந்தத் தொடர்பு வெளிப்படுகிறது.
- source_word: τήρει
  choice: அதைக் கடைப்பிடித்து
  rationale: τηρέω என்பதில் காத்தல், பற்றிக்கொள்ளுதல், கீழ்ப்படிதல் ஆகிய நிழற்பொருள்கள் உள்ளன; இங்கு அறிவுரையை நடைமுறையில் பின்பற்றுவதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: μετανόησον
  choice: மனந்திரும்பு
  rationale: பாவத்திலிருந்து திரும்புவதற்கான புதிய ஏற்பாட்டின் வழக்கமான கட்டளையைச் சுருக்கமாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: γρηγορήσῃς
  choice: விழித்திருக்காவிட்டால்
  rationale: விழிப்புடனிருத்தல் என்ற உருவகத்தைத் தக்கவைத்து, தொடர்ந்து வரும் திருடன் உருவகத்தோடு இயல்பாக இணைகிறது.
- source_word: ἥξω ὡς κλέπτης
  choice: நான் திருடனைப்போல் வருவேன்
  rationale: திடீரான, எதிர்பாராத வருகையைக் குறிக்கும் உவமையை நேரடியாகவும் இயல்பாகவும் பாதுகாக்கிறது.
- source_word: οὐ μὴ γνῷς
  choice: நீ நிச்சயமாக அறியமாட்டாய்
  rationale: οὐ μή எனும் வலியுறுத்தப்பட்ட மறுப்பை மிகைப்படுத்தாமல் தெளிவாகத் தெரிவிக்கிறது.
- source_word: ποίαν ὥραν
  choice: எந்த நேரத்தில்
  rationale: தமிழில் ‘எந்த மணிநேரத்தில்’ என்பதைக் காட்டிலும் இயல்பானது; அறியப்படாத குறிப்பிட்ட நேரம் என்ற கருத்தைப் பாதுகாக்கிறது.
- source_word: ἐπὶ σέ
  choice: உன்மேல்
  rationale: முகமாக அல்லது எதிராக வரும் கடுமையான வருகையின் தொனியைத் தக்கவைக்கிறது; அது இறுதித் தீர்ப்பா உடனடி தண்டனையா என்பதைத் தீர்மானிக்கவில்லை.
theological_decisions:
- issue: πῶς εἴληφας καὶ ἤκουσας என்ற அறிவுரையின் பொருள்
  choice: ‘நீ எவ்வாறு பெற்றுக்கொண்டாய், கேட்டாய்’ என்று முறையைச் சுட்டுமாறு மொழிபெயர்க்கப்பட்டது.
  alternative: ‘நீ எதைப் பெற்றுக்கொண்டு கேட்டாயோ அதை நினைவில் கொள்.’
  rationale: மூலத்தில் πῶς (‘எவ்வாறு’) உள்ளது. அது ஆரம்பத்தில் ஏற்றுக்கொண்ட விதத்தை வலியுறுத்தலாம்; செய்தியின் உள்ளடக்கத்தையும் செயல்பாட்டில் குறிக்கலாம். முதன்மை உரை மூலவடிவத்தைப் பாதுகாக்கிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ‘நான் திருடனைப்போல் வருவேன்’ என்ற எச்சரிக்கையின் தன்மை
  choice: எதிர்பாராத வருகை என்ற எச்சரிக்கையாகத் திறந்த நிலையில் வைக்கப்பட்டது.
  alternative: இரண்டாம் வருகையை மட்டும் குறிப்பதாகவோ, உள்ளூர் வரலாற்றுத் தண்டனையை மட்டும் குறிப்பதாகவோ வெளிப்படையாக விளக்குதல்.
  rationale: இந்த வசனம் வருகையின் எல்லையைத் தானாகத் தீர்மானிக்கவில்லை. ஆகவே இறுதித் தீர்ப்பு, உடனடியான நியாயத்தீர்ப்பு, ஒழுக்கத் தண்டனை ஆகியவற்றில் ஒன்றை மொழிபெயர்ப்பு திணிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான ஒருமை நேர்முக அழைப்பு பயன்படுத்தப்பட்டது. ‘மனந்திரும்பு,’ ‘விழித்திரு,’ ‘திருடனைப்போல்’ போன்ற பரிச்சயமான வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; பழமையான வினைமுற்றுகளும் தேவையற்ற சமயப் பிரிவுச் சொற்களும் தவிர்க்கப்பட்டன. அனைத்து அடிக்குறிப்பு குறிகளும் உரையில் அவை விளக்கும் இடங்களிலேயே சேர்க்கப்பட்டுள்ளன.
