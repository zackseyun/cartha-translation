id: REV.12.17
reference: Revelation 12:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὠργίσθη ὁ δράκων ἐπὶ τῇ γυναικί, καὶ ἀπῆλθεν ποιῆσαι πόλεμον μετὰ τῶν λοιπῶν τοῦ σπέρματος αὐτῆς, τῶν τηρούντων τὰς ἐντολὰς τοῦ θεοῦ καὶ ἐχόντων τὴν μαρτυρίαν Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/017.yaml
  text: And the dragon became enraged with the woman[a], and went away to make war with the rest of her offspring, those who keep the commandments of God and hold to the testimony of Jesus.
translation:
  language: ta
  text: டிராகன் அந்தப் பெண்ணின்மீது கடுங்கோபமடைந்தது. அவளுடைய சந்ததியாரில் மீதியானவர்களோடு, அதாவது தேவனுடைய கட்டளைகளைக் கடைப்பிடித்து இயேசுவின் சாட்சியை[a] கொண்டிருப்பவர்களோடு, போர் செய்ய அது புறப்பட்டுச் சென்றது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இயேசுவைக் குறித்த சாட்சி’ என்றும் பொருள் கொள்ளலாம்; அல்லது ‘இயேசு அளித்த சாட்சி’ என்றும் பொருள் கொள்ளலாம். கிரேக்கத்தில் உள்ள உடைமை வேற்றுமை வடிவம் ஒன்றுக்கு மேற்பட்ட விதத்தில் புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ὠργίσθη
  choice: கடுங்கோபமடைந்தது
  rationale: கோபமடைவதைக் குறிக்கும் வினையை வெளிப்படுத்துவதோடு, வெளிப்படுத்தின விசேஷத்தின் பகைமை நிறைந்த சூழலில் அதன் தீவிரத்தையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: ὁ δράκων
  choice: அரக்கப்பாம்பு
  rationale: வெறும் ‘பாம்பு’ என்று பொருளைக் குறுக்காமல், δράκων என்பதன் அச்சமூட்டும் புராணவகை மாபெரும் பாம்பு உருவகத்தைத் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἐπὶ τῇ γυναικί
  choice: அந்தப் பெண்ணின்மீது
  rationale: ஏற்கெனவே அறிமுகப்படுத்தப்பட்ட குறிப்பிட்ட பெண்ணைக் குறிக்கும் உருபையும், அவள்மீது திரும்பிய கோபத்தையும் நேரடியாகத் தருகிறது.
- source_word: ἀπῆλθεν
  choice: புறப்பட்டுச் சென்றது
  rationale: அங்கிருந்து வேறொரு நடவடிக்கைக்காகச் சென்ற கதைநகர்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ποιῆσαι πόλεμον
  choice: போர் செய்ய
  rationale: கிரேக்கச் சொற்றொடரின் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: μετὰ τῶν λοιπῶν
  choice: மீதியானவர்களோடு
  rationale: μετά + genitive என்பதன் ‘உடன்/ஓடு’ வடிவத்தைப் பாதுகாக்கிறது; ‘போர் செய்ய’ என்ற சூழல் எதிர்த்துப் போரிடும் பொருளைத் தெளிவாக்குகிறது.
- source_word: τοῦ σπέρματος αὐτῆς
  choice: அவளுடைய சந்ததியில்
  rationale: σπέρμα என்பதன் குடும்பத் தொடர்ச்சி அல்லது வழித்தோன்றல் பொருளை, பழமையான ‘வித்து’ என்பதைத் தவிர்த்து, வாசிக்க எளிதான தமிழில் தருகிறது.
- source_word: τηρούντων τὰς ἐντολὰς τοῦ θεοῦ
  choice: தேவனுடைய கட்டளைகளைக் கடைப்பிடித்து
  rationale: τηρέω இங்குக் குறிக்கும் உண்மையுள்ள கீழ்ப்படிதல் அல்லது அனுசரிப்பை நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐχόντων τὴν μαρτυρίαν Ἰησοῦ
  choice: இயேசுவின் சாட்சியைப் பற்றிக்கொண்டிருப்பவர்கள்
  rationale: ἔχω என்பதன் உடைமை/தொடர்புப் பொருளையும், விசுவாசமான பற்றுறுதியையும் தெரிவிக்கிறது; Ἰησοῦ என்ற genitive-இன் பொருள் பிரதான உரையில் தீர்மானிக்கப்படாமல் ‘இயேசுவின்’ எனப் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: τὴν μαρτυρίαν Ἰησοῦ என்பதில் Ἰησοῦ என்ற genitive-இன் தொடர்பு
  choice: இயேசுவின் சாட்சி
  alternative: இயேசுவைக் குறித்த சாட்சி; அல்லது இயேசு அளித்த சாட்சி
  rationale: இது இயேசுவைப் பற்றிய சாட்சியையோ, இயேசுவே அளிக்கும்/அளித்த சாட்சியையோ குறிக்கலாம். பிரதான உரை இந்த உண்மையான தெளிவின்மையைத் தீர்க்காமல் வைத்திருக்கிறது; அடிக்குறிப்பு இரு முக்கிய வாய்ப்புகளையும் தெரிவிக்கிறது.
translation_notes:
  register: நவீன, தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. விளக்கப்பகுதியைச் சுட்டிக்காட்ட இடைக்கோடுகள் பயன்படுத்தப்பட்டுள்ளன; ‘அரக்கப்பாம்பு’ என்பது δράκων உருவகத்தின் அச்சமூட்டும் தன்மையைப் பாதுகாத்தபடி பொதுவாசகருக்குப் புரியும் சொல்.
