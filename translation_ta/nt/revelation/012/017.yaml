  to: டிராகன் அந்தப் பெண்ணின்மீது கடுங்கோபமடைந்தது. அவளுடைய சந்ததியாரில் மீதியானவர்களோடு, அதாவது தேவனுடைய கட்டளைகளைக் கடைப்பிடித்து இயேசுவின் சாட்சியை[a] கொண்டிருப்பவர்களோடு, போர் செய்ய அது புறப்பட்டுச் சென்றது.
