    rationale: δράκων என்பது இவ்விடத்தில் ‘dragon’; அது அச்சமூட்டும் உருவகமாக இருந்தாலும், ‘அரக்கன்’ என்ற தனிப்பட்ட வகைப்படுத்தலை மூலச் சொல் வெளிப்படையாகக் கூறவில்லை. ‘டிராகன்’ மூல உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
