  source_fidelity: 'கருத்து முழுவதும் மூலக் கிரேக்கத்துக்கு நெருக்கமாக உள்ளது: கோபமடைதல், பெண்ணுக்கு எதிரான பகை, அவளுடைய சந்ததியாரில் மீதியானவர்களுக்கு எதிராகப் போர் செய்யச் செல்லுதல், கட்டளைகளைக் காத்தல், இயேசுவின் சாட்சி ஆகியவை அனைத்தும் இடம்பெற்றுள்ளன. ஆனால் δράκων என்பதற்கு ‘அரக்கப்பாம்பு’ என்பது மூலத்தில் இல்லாத ‘அரக்க’ என்ற குறிப்பைச் சேர்க்கிறது. மேலும் அடிக்குறிப்புக் குறி, அது விளக்கும் ‘இயேசுவின் சாட்சி’ என்ற சொல்லோடு நேரடியாக இணைக்கப்பட வேண்டும்.'
  naturalness: வரைவு பொதுவாக நவீனத் தமிழில் தெளிவாக உள்ளது. இருப்பினும் இடைக்கோடுகளுக்குள் நீளும் தொடர்புவினையெச்ச அமைப்பு சற்று கனமாக உள்ளது. ‘அவளுடைய சந்ததியாரில் மீதியானவர்களோடு, அதாவது … அவர்களோடு’ என்ற அமைப்பு கிரேக்கத்தின் இணைநிலைக் குறிப்பை இயல்பாகத் தருகிறது.
  terminology: ‘தேவனுடைய கட்டளைகள்’ மற்றும் ‘இயேசுவின் சாட்சி’ பொருத்தமானவை. ‘இயேசுவின் சாட்சி’ genitive-இன் தெளிவின்மையைப் பாதுகாக்கிறது. δράκων என்பதற்கு நவீனப் பொதுப்பயன்பாட்டில் ‘டிராகன்’ என்பது அரக்கத் தன்மை போன்ற கூடுதல் விளக்கத்தை ஏற்றாமல் உருவகத்தைப் பாதுகாக்கிறது.
  issues:
