id: REV.12.14
reference: Revelation 12:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐδόθησαν τῇ γυναικὶ ⸀αἱ δύο πτέρυγες τοῦ ἀετοῦ τοῦ μεγάλου, ἵνα πέτηται εἰς τὴν ἔρημον εἰς τὸν τόπον αὐτῆς, ⸂ὅπου τρέφεται⸃ ἐκεῖ καιρὸν καὶ καιροὺς καὶ ἥμισυ καιροῦ ἀπὸ προσώπου τοῦ ὄφεως.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/014.yaml
  text: And the woman was given the two wings of the great eagle, so that she might fly into the wilderness to her place, where she is nourished there for a time and times and half a time, away from the presence of the serpent.
translation:
  language: ta
  text: அந்தப் பெண்ணுக்கு மாபெரும் கழுகின் இரண்டு சிறகுகள் கொடுக்கப்பட்டன; அவள் பாம்பின் முன்னிலையிலிருந்து விலகி, பாலைநிலத்தில் தனக்குரிய இடத்திற்குப் பறந்து செல்லும்படியாக அவை கொடுக்கப்பட்டன. அங்கே அவள் ஒரு காலம், காலங்கள், அரைக் காலம் போஷிக்கப்படுகிறாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ γυνή
  choice: அந்தப் பெண்
  rationale: தரிசனத்தில் ஏற்கெனவே குறிப்பிடப்பட்ட பெண்ணை இயல்பான நவீனத் தமிழில் சுட்டுகிறது.
- source_word: αἱ δύο πτέρυγες τοῦ ἀετοῦ τοῦ μεγάλου
  choice: பெரிய கழுகின் இரண்டு சிறகுகள்
  rationale: கிரேக்கத்தின் சொல் வரிசையையும் குறியீட்டுப் படிமத்தையும் தெளிவாகப் பேணுகிறது.
- source_word: ἔρημος
  choice: பாலைநிலம்
  rationale: மக்கள் இல்லாத வனாந்தரப் பகுதியைக் குறிக்கும் இச்சொல், சூழலுக்கு ஏற்ற இயல்பான தமிழாக்கம்.
- source_word: τρέφεται
  choice: போஷிக்கப்படும்படியாக
  rationale: நிகழ்காலச் செயப்பாட்டு வடிவத்தையும் உணவு அளித்து பராமரிக்கப்படுதல் என்ற பொருளையும் வெளிப்படுத்துகிறது.
- source_word: καιρὸν καὶ καιροὺς καὶ ἥμισυ καιροῦ
  choice: ஒரு காலமும், காலங்களும், அரைக் காலமும்
  rationale: குறியீட்டுத் தன்மையையும் எண்ணிக்கை குறித்த மூலத்தின் திட்டமிட்ட தெளிவின்மையையும் தீர்க்காமல் அப்படியே பேணுகிறது.
- source_word: ἀπὸ προσώπου τοῦ ὄφεως
  choice: பாம்பின் முன்னிலையிலிருந்து விலகி
  rationale: மூலத்தின் உருவகமான ‘முகம்/முன்னிலை’ மொழியைத் தக்கவைத்தபடி, பாதுகாப்பான தூரம் என்ற உறவையும் இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘ஒரு காலமும், காலங்களும், அரைக் காலமும்’ என்பதன் கால அளவு
  choice: குறியீட்டு சொற்றொடரை விளக்கமின்றி அப்படியே வைத்தல்
  alternative: ‘மூன்றரை ஆண்டுகள்’ என்று பொருள் விளக்குதல்
  rationale: மூலம் நேரடியாக ஆண்டுகள் என்று கூறவில்லை; குறிப்பிட்ட காலக்கணக்கை மொழிபெயர்ப்பில் திணிக்காமல் வெளிப்படுத்தப்பட்ட வடிவத்தையும் தானியேல் நூலுடனான எதிரொலியையும் பேணுகிறது.
- issue: கழுகின் சிறகுகளின் அடையாளப் பொருள்
  choice: ‘பெரிய கழுகின் இரண்டு சிறகுகள்’ என்று மட்டும் மொழிபெயர்த்தல்
  alternative: தெய்வீக பாதுகாப்பு அல்லது குறிப்பிட்ட வரலாற்றுச் சக்தி என விளக்குதல்
  rationale: வசனம் படிமத்தின் அடையாளத்தை நேரடியாக விளக்காததால், எந்தத் தனிப்பட்ட இறையியல் விளக்கத்தையும் உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பானதும் கண்ணியமானதும். வெளிப்படுத்தின விசேஷத்தின் தரிசனப் படிமங்களும் மூலத்தின் காலக் குறிப்பு சார்ந்த தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
