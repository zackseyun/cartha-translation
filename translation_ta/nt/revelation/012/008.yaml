  text: καὶ οὐκ ⸀ἴσχυσεν, οὐδὲ τόπος εὑρέθη ⸀αὐτῶν ἔτι ἐν τῷ οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/008.yaml
  text: But he was not strong enough[a], nor was any place found for them any longer in heaven.
translation:
  language: ta
  text: ஆனால், அவன் வலிமை போதவில்லை[a]; அவர்களுக்கு இனி பரலோகத்தில் எந்த இடமும் காணப்படவும் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவன் வெற்றி பெறவில்லை.’ கிரேக்க வினை வலிமையுடன் இருப்பது, இயலுவது, அல்லது வெற்றி பெறுவது ஆகிய பொருள்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட போரின் முடிவை எதிர்மறைத் திருப்பமாக அறிமுகப்படுத்துவதால், தொடர்ச்சியைக் குறிக்கும் ‘மேலும்’ என்பதற்குப் பதிலாக சூழலுக்கேற்ற ‘ஆனால்’ பயன்படுத்தப்பட்டது.
- source_word: οὐκ ἴσχυσεν
  choice: அவன் வலிமை போதவில்லை
  rationale: ἰσχύω என்பது வலிமையாயிருத்தல், திறனுடையிருத்தல், மேலோங்குதல் ஆகிய பொருள்களைக் கொண்டது. போர் சூழலில் வலிமை போதாமையை நேரடியாக வெளிப்படுத்துகிறது; ஒருமை வினை முந்தைய வசனத்திலுள்ள வலுசர்ப்பத்தைக் குறிக்கிறது.
- source_word: οὐδὲ
  choice: …எந்த இடமும் … இல்லை
  rationale: முந்தைய எதிர்மறைக் கூற்றுடன் இரண்டாவது எதிர்மறைக் கூற்றை இயல்பான தமிழில் இணைக்கிறது.
- source_word: τόπος
  choice: இடம்
  rationale: வானுலகில் அவர்களுக்கு உரிய அல்லது கிடைக்கக்கூடிய இடத்தைக் குறிக்கும் நேரடியான பொதுத் தமிழ் சொல்.
- source_word: εὑρέθη
  choice: காணப்படவில்லை
  rationale: εὑρίσκω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது; ‘இடம் இருக்கவில்லை’ என்று சுருக்காமல், கிரேக்கத்தின் ‘காணப்படுதல்’ அமைப்பைத் தக்கவைக்கிறது.
- source_word: αὐτῶν
  choice: அவர்களுக்கு
  rationale: சொல்லமைப்பில் இது பன்மை உருபாக இருந்தாலும், ‘அவர்களுக்கான இடம்’ என்ற பொருளை இயல்பான தமிழில் வேற்றுமை உருபுடன் தருகிறது; வலுசர்ப்பத்தையும் அதன் தூதர்களையும் கூட்டாகக் குறிக்கிறது.
- source_word: ἔτι
  choice: இனி
  rationale: எதிர்மறைச் சூழலில், அந்தப் போருக்குப் பிறகு அவர்களுக்கு அங்கு இடம் தொடரவில்லை என்பதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐν τῷ οὐρανῷ
  choice: பரலோகத்தில்
  rationale: இங்கு οὐρανός காணக்கூடிய வானத்தை அல்ல, பரலோக மண்டலத்தைக் குறிக்கிறது.
theological_decisions:
- issue: ἴσχυσεν என்ற ஒருமை வினையின் எழுவாய்
  choice: ‘அவன்’ என்பது முந்தைய வசனத்திலுள்ள வலுசர்ப்பத்தைக் குறிக்கிறது; ‘அவர்களுக்கு’ என்பது வலுசர்ப்பத்தையும் அதன் தூதர்களையும் குறிக்கிறது.
  alternative: முதல் கூற்றையும் பன்மையாக்கி, ‘அவர்கள் வலிமை போதவில்லை’ என்று மொழிபெயர்த்தல்.
  rationale: கிரேக்க வினை ஒருமையில் இருப்பதால், முந்தைய வசனத்தின் ஒருமை எழுவாயான வலுசர்ப்பத்தைத் தொடர்ந்து குறிக்கிறது. அடுத்த கூற்றின் பன்மைப் பெயர்ச்சொல் முழுக் குழுவையும் உள்ளடக்குகிறது; இந்த வேறுபாட்டை மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘காணப்படவில்லை’ என்பது மூலத்தின் செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது; ‘வலிமை போதவில்லை’ என்பது போர்ச் சூழலையும் கிரேக்கச் சொல்லின் பரந்த பொருளையும் தக்கவைக்கிறது.
