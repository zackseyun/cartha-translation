reference: Revelation 12:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο πόλεμος ἐν τῷ οὐρανῷ, ὁ Μιχαὴλ καὶ οἱ ἄγγελοι αὐτοῦ ⸀τοῦ πολεμῆσαι μετὰ τοῦ δράκοντος. καὶ ὁ δράκων ἐπολέμησεν καὶ οἱ ἄγγελοι αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/007.yaml
  text: 'And war broke out in heaven: Michael and his angels fought against the dragon[a]. And the dragon and his angels fought back[c][b],'
translation:
  language: ta
  text: பரலோகத்தில் போர் மூண்டது:[a] மிகாவேலும் அவருடைய தூதர்களும் அந்த வலுசர்ப்பத்திற்கு எதிராகப் போரிட்டார்கள்.[b] வலுசர்ப்பமும் அதன் தூதர்களும் எதிர்த்துப் போரிட்டார்கள்,[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரலோகத்தில் போர் ஏற்பட்டது” அல்லது “பரலோகத்தில் போர் உண்டாயிற்று.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, மேலும் முறையான அமைப்பில், “மிகாவேலும் அவருடைய தூதர்களும் அந்த வலுசர்ப்பத்திற்கு எதிராகப் போரிடுவதற்காக.” கிரேக்கத்தில் பெயர்ச்சொல்லாக்கப்பட்ட வினைவடிவம் செயலை அல்லது நோக்கத்தைச் சுருக்கமாக வெளிப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது எளிமையாக, “வலுசர்ப்பம் போரிட்டது; அதன் தூதர்களும் போரிட்டார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο πόλεμος
  choice: போர் மூண்டது
  rationale: γίνομαι + பெயர்ச்சொல் அமைப்பு ஓர் நிகழ்வு உருவாவதையோ தொடங்குவதையோ குறிக்கிறது. ‘போர் மூண்டது’ என்பது அந்தத் தொடக்க உணர்வை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: ἐν τῷ οὐρανῷ
  choice: பரலோகத்தில்
  rationale: இங்கு οὐρανός காணக்கூடிய வானத்தைவிடப் பரலோக மண்டலத்தைக் குறிக்கிறது; ‘பரலோகம்’ அந்தப் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: Μιχαὴλ
  choice: மிகாவேல்
  rationale: தமிழ் வேதாகம மரபில் பரவலாக அறியப்படும் பெயர்வடிவம் பயன்படுத்தப்படுகிறது; எந்த விளக்கப் பட்டமும் சேர்க்கப்படவில்லை.
- source_word: ἄγγελοι αὐτοῦ
  choice: அவருடைய தூதர்கள் / அதன் தூதர்கள்
  rationale: உடைமைத் தொடர்பை நேரடியாகக் காக்கிறது. மிகாவேலைக் குறிக்க மரியாதைச் சுட்டும் ‘அவருடைய’ என்றும், வலுசர்ப்பத்தைக் குறிக்க ‘அதன்’ என்றும் இயல்பான தமிழில் வேறுபடுத்தப்பட்டுள்ளது.
- source_word: τοῦ πολεμῆσαι μετὰ τοῦ δράκοντος
  choice: அந்த வலுசர்ப்பத்தோடு போரிட்டார்கள்
  rationale: குறிப்பிட்ட வினையெச்சப் பெயரமைப்பின் சுருக்கமான கிரேக்க நடையை இயல்பான தமிழ் வினைமுற்றாக வழங்குகிறது. சூழல் பகைமையைத் தெளிவாக்குவதால் ‘-ஓடு போரிடுதல்’ எதிர்த்துப் போரிடும் பொருளைக் கொண்டுள்ளது.
- source_word: δράκοντος / δράκων
  choice: வலுசர்ப்பம்
  rationale: வெளிப்படுத்தின விசேஷத்தின் அபோகலிப்டிக் உருவகத்தையும் தமிழ் வேதாகம வாசகர்களுக்கு அறிமுகமான சொல்லாட்சியையும் காக்கிறது.
- source_word: ἐπολέμησεν
  choice: எதிர்த்துப் போரிட்டார்கள்
  rationale: இரண்டாம் தரப்பின் மறுமொழியான போராட்டத்தை இயல்பாக வெளிப்படுத்துகிறது. பன்மை வினை, தொடர்ந்து வரும் ‘அதன் தூதர்களும்’ என்பதையும் இணைந்த எழுவாயாக எடுத்துரைக்கிறது.
- source_word: καὶ οἱ ἄγγελοι αὐτοῦ
  choice: அதன் தூதர்களும்
  rationale: மிகாவேலும் அவருடைய தூதர்களும் என்ற முதல் அமைப்புடன் இணையான வடிவத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: மிகாவேலின் அடையாளமும் நிலையும்
  choice: ‘மிகாவேல்’ என்ற பெயரை மட்டும் வழங்குதல்
  alternative: ‘பிரதான தூதன் மிகாவேல்’ என விரிவாக்குதல் அல்லது அவரைக் கிறிஸ்துவோடு அடையாளப்படுத்துதல்
  rationale: இந்த வசனம் மிகாவேலின் பெயரை மட்டுமே கூறுகிறது; அவரது பதவியையோ கிறிஸ்துவுடனான அடையாளத்தையோ இங்கு குறிப்பிடவில்லை. ஆகவே உரையில் இல்லாத சமயவியல் விளக்கம் சேர்க்கப்படவில்லை.
- issue: வலுசர்ப்பத்தின் பாலினச் சுட்டு
  choice: ‘அதன்’ என உயிரினத்தைக் குறிக்கும் நடுநிலை உடைமைச் சுட்டைப் பயன்படுத்துதல்
  alternative: ‘அவனுடைய’ என ஆண்பால் ஆளுமைச் சுட்டைப் பயன்படுத்துதல்
  rationale: δράκων இலக்கண ஆண்பாலாக இருந்தாலும், இவ்வசனத்தின் உருவக உயிரினப் பெயரைத் தமிழில் இயல்பாகச் சுட்ட ‘அதன்’ பயன்படுத்தப்படுகிறது; இதனால் பின்னணியில் உள்ள ஆளுமையை மறுப்பதாகவோ உறுதிப்படுத்துவதாகவோ கூடுதல் விளக்கம் திணிக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான உரை. ‘போர் மூண்டது’ நிகழ்வின் தொடக்கத்தைத் தருகிறது; ‘வலுசர்ப்பம்’ அபோகலிப்டிக் உருவகத்தையும் தமிழ் வேதாகமச் சொல்லாட்சியுடனான தொடர்ச்சியையும் காக்கிறது. வசனம் அடுத்த வசனத்துடன் தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
