source:
  edition: SBLGNT
  text: καὶ ἐβοήθησεν ἡ γῆ τῇ γυναικί, καὶ ἤνοιξεν ἡ γῆ τὸ στόμα αὐτῆς καὶ κατέπιεν τὸν ποταμὸν ὃν ἔβαλεν ὁ δράκων ἐκ τοῦ στόματος αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/016.yaml
  text: And the earth helped the woman[b][a], and the earth opened its mouth and swallowed the river that the dragon had thrown from his mouth.
translation:
  language: ta
  text: பூமி அந்தப் பெண்ணுக்கு உதவியது[a]. பூமி தன் வாயைத் திறந்து, டிராகன் தன் வாயிலிருந்து வீசியெறிந்த[b] ஆற்றை விழுங்கியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பூமி’ என்பதற்குப் பதிலாக ‘நிலம்’ அல்லது ‘தரை’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க γῆ என்ற சொல் இம்மூன்று பொருள்களிலும் வரலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘வீசியெறிந்த’ என்பதற்குப் பதிலாக ‘தன் வாயிலிருந்து வெளியே அனுப்பிய’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβοήθησεν
  choice: உதவியது
  rationale: βοηθέω என்பதன் எளிய கதைநடைப் பொருளான ‘உதவி செய்தல்’ என்பதை இயல்பான நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: ἡ γῆ
  choice: பூமி
  rationale: γῆ என்பதற்கு ‘பூமி,’ ‘நிலம்,’ ‘தரை’ ஆகிய பொருள்கள் உண்டு. இங்குள்ள வெளிப்படுத்தல் நூலின் பிரபஞ்ச அளவிலான உருவகத்துக்கும், செயல்படும் பொருளாக அது இருமுறை வருவதற்கும் ‘பூமி’ நன்றாகப் பொருந்துகிறது; மற்ற சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: τῇ γυναικί
  choice: அந்தப் பெண்ணுக்கு
  rationale: கிரேக்கச் சொல்லின் குறிப்பிட்ட வடிவத்தையும், முன்பே அறிமுகப்படுத்தப்பட்ட அடையாளப் பாத்திரத்தையும் விளக்கவுரை சேர்க்காமல் காக்கிறது.
- source_word: ἤνοιξεν ἡ γῆ τὸ στόμα αὐτῆς
  choice: பூமி தன் வாயைத் திறந்து
  rationale: பூமியை மனிதரைப்போல் செயல்படுவதாகக் காட்டும் மூல உருவகத்தை இயல்பான தமிழில் அப்படியே வைத்திருக்கிறது.
- source_word: κατέπιεν
  choice: விழுங்கியது
  rationale: καταπίνω என்பதன் நேரடியான பொருளைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: τὸν ποταμόν
  choice: ஆற்றை
  rationale: ποταμός என்பதன் வழக்கமான பொருள் ‘ஆறு.’ சூழலில் வெள்ளப்பெருக்கு போன்ற தோற்றம் இருந்தாலும், ‘வெள்ளம்’ என்று விளக்கமாக மாற்றாமல் மூலச் சொல்லைத் தொடர்கிறது.
- source_word: ὃν ἔβαλεν
  choice: வீசியெறிந்த
  rationale: βάλλω என்பதில் உள்ள வலிமையான வெளியேற்றும் செயலைக் காக்கிறது. தமிழில் ஆற்றை ‘எறிதல்’ இயல்பற்றதாகத் தோன்றக்கூடும் என்றாலும், இங்குள்ள அபோகலிப்டிக் உருவகத்தின் தீவிரத்தை ‘வீசியெறிந்த’ வெளிப்படுத்துகிறது; மென்மையான மாற்று அடிக்குறிப்பில் உள்ளது.
- source_word: ὁ δράκων
  choice: அரக்கப் பாம்பு
  rationale: δράκων குறிக்கும் பேருருவமும் பாம்பைப் போன்ற பயங்கர உயிரினமும் நவீனத் தமிழ் வாசகருக்குப் புரியுமாறு தரப்படுகிறது; அடையாளப் பாத்திரத்துக்கு மேலதிக விளக்கம் சேர்க்கப்படவில்லை.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: தன் வாயிலிருந்து
  rationale: மூலத்தின் முன்னிடைச்சொல் தொடரை இயல்பான தமிழில் நேரடியாகக் காட்டுகிறது; ‘தன்’ என்பது செய்பவரான அரக்கப் பாம்பையே தெளிவாகச் சுட்டுகிறது.
theological_decisions:
- issue: வெளிப்படுத்தல் நூலின் காட்சியில் பூமி மனிதரைப்போல் செயல்படுதல்
  choice: பூமி உதவி செய்து, தன் வாயைத் திறந்து, ஆற்றை விழுங்குவதாக வரும் உருவகத்தை அப்படியே வைத்தல்
  alternative: பூமி என்பது ஒரு மக்கள் கூட்டத்தையோ, நிலப்பரப்பையோ, இறைமீட்பின் வழிமுறையையோ குறிக்கிறது என்று மொழிபெயர்ப்பிலேயே விளக்குதல்
  rationale: மூல வசனம் உருவகத்தின் பொருளை இங்கே தீர்மானிக்கவில்லை. ஆகவே அதன் இறையியல் மற்றும் அடையாளத் தெளிவின்மையை மொழிபெயர்ப்பு தீர்த்து வைக்காமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பூமி தன் வாயைத் திறந்து’ என்ற உயிரூட்டப்பட்ட அபோகலிப்டிக் உருவகம் மென்மையாக்கப்படவில்லை. ‘அரக்கப் பாம்பு’ என்பது பழமையான ‘வலுசர்ப்பம்’ என்பதைக் காட்டிலும் பொதுவாசகருக்கு உடனடியாகப் புரியக்கூடிய தேர்வாகப் பயன்படுத்தப்பட்டுள்ளது.
