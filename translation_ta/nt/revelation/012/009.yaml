id: REV.12.9
reference: Revelation 12:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐβλήθη ὁ δράκων ὁ μέγας, ὁ ὄφις ὁ ἀρχαῖος, ὁ καλούμενος Διάβολος καὶ ⸀ὁ Σατανᾶς, ὁ πλανῶν τὴν οἰκουμένην ὅλην— ἐβλήθη εἰς τὴν γῆν, καὶ οἱ ἄγγελοι αὐτοῦ μετ’ αὐτοῦ ἐβλήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/009.yaml
  text: And the great dragon was thrown down—the ancient serpent[a], the one called the Devil and Satan, who deceives the whole world. He was thrown down to the earth[b], and his angels were thrown down with him.
translation:
  language: ta
  text: அந்தப் பெரிய அரக்கப்பாம்பு கீழே எறியப்பட்டது—அதாவது, அந்தப் பழைய பாம்பு[b], பிசாசு என்றும் சாத்தான் என்றும் அழைக்கப்படுகிறவன், உலகம் முழுவதையும் வழிதவறச் செய்கிறவன்[a]. அவன் பூமிக்குத் எறியப்பட்டான்; அவனுடைய தூதர்களும் அவனோடு எறியப்பட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உலகம் முழுவதையும் வழிதவறச் செய்கிறவன்” என்பதை “குடியிருக்கும் உலகம் முழுவதையும் ஏமாற்றுகிறவன்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “பழைய பாம்பு” என்பது ஆதியாகமம் 3-ல் வரும் பாம்பின் படிமத்தை எதிரொலிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: ἐβλήθη / ἐβλήθησαν
  choice: கீழே எறியப்பட்டது / எறியப்பட்டான் / எறியப்பட்டார்கள்
  rationale: செயப்பாட்டு வடிவிலுள்ள βάλλω வலுக்கட்டாயமாகக் கீழே அகற்றப்படுவதைக் குறிக்கிறது. மூலத்தில் மூன்று முறை வரும் வினைச்சொல்லின் அழுத்தத்தைத் தமிழிலும் மீளுரைப்பதன் மூலம் காத்திருக்கிறது.
- source_word: δράκων ὁ μέγας
  choice: அந்தப் பெரிய அரக்கப்பாம்பு
  rationale: வெளிப்படுத்தலில் வரும் பேருருவமுள்ள பாம்பு போன்ற அரக்க உயிரினத்தை இயல்பான நவீன தமிழில் எடுத்துரைத்து, அதன் திருக்காட்சிசார் குறியீட்டு வலிமையைக் காக்கிறது.
- source_word: ὁ ὄφις ὁ ἀρχαῖος
  choice: அந்தப் பழைய பாம்பு
  rationale: ὄφις என்பதற்கு இயல்பான ‘பாம்பு’ பயன்படுத்தப்பட்டுள்ளது; ἀρχαῖος இங்கு மிகப் பழங்காலத்திலிருந்தது என்ற பொருளைத் தருவதால் ‘பழைய’ என மொழிபெயர்க்கப்பட்டுள்ளது. ஆதியாகமம் 3-ன் பாம்புப் படிமத்துடனான தொடர்பு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: ὁ καλούμενος
  choice: என்றும் ... என்றும் அழைக்கப்படுகிறவன்
  rationale: முன் குறிப்பிடப்பட்ட உருவத்தை இரண்டு அறியப்பட்ட பெயர்களால் அடையாளப்படுத்தும் பங்கேற்புவினையின் பொருளை இயல்பான தமிழில் வழங்குகிறது.
- source_word: Διάβολος
  choice: பிசாசு
  rationale: சொற்பிறப்பில் ‘அவதூறு கூறுகிறவன்’ என்ற பொருள் இருந்தாலும், இச்சூழலில் இது அறியப்பட்ட பெயர் அல்லது பட்டமாகப் பயன்படுகிறது; ‘பிசாசு’ என்பது தமிழில் நிலைபெற்ற பொதுவான இணைச்சொல்.
- source_word: Σατανᾶς
  choice: சாத்தான்
  rationale: பெயர்/பட்டம் தமிழின் நிலைபெற்ற ஒலிபெயர்ப்பு மரபின்படி வழங்கப்பட்டுள்ளது; ‘எதிரி’ என்று பொருளாக்கி உரையின் அடையாளப்படுத்தலை மாற்றவில்லை.
- source_word: ὁ πλανῶν
  choice: வழிதவறச் செய்கிறவன்
  rationale: πλανάω என்பதிலுள்ள வழிகெடுக்குதல் அல்லது நெறிதவறச் செய்தல் என்ற இயக்கமுள்ள பொருளைத் தெளிவாகக் காட்டுகிறது; ‘ஏமாற்றுகிறவன்’ என்பது சாத்தியமான மாற்று.
- source_word: τὴν οἰκουμένην ὅλην
  choice: உலகம் முழுவதையும்
  rationale: οἰκουμένη என்பது குடியிருக்கும் உலகைக் குறிக்கக்கூடும்; இங்கு திருக்காட்சிசார் உலகளாவிய பரப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: εἰς τὴν γῆν
  choice: பூமிக்குக் கீழே
  rationale: வானிலிருந்து பூமிக்கான கீழ்நோக்கிய வெளியேற்றமே சூழலில் முதன்மை. γῆ-யை ‘நிலம்’ என்று குறுக்காமல் ‘பூமி’ என வழங்குகிறது.
- source_word: οἱ ἄγγελοι αὐτοῦ
  choice: அவனுடைய தூதர்கள்
  rationale: திருக்காட்சிசார் சூழலில் இவர்கள் அரக்கப்பாம்போடு சேர்ந்த வானுலகத் தூதர்கள்; தமிழில் ‘தூதர்கள்’ என்ற நிலைபெற்ற சொல் இயல்பாக உள்ளது.
- source_word: μετ’ αὐτοῦ
  choice: அவனோடு
  rationale: உடனிருப்பையும் ஒரே வெளியேற்றத்தில் பங்குபெறுவதையும் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: Διάβολος மற்றும் Σατανᾶς ஆகியவை ஒரே உருவத்துக்கான இணை அடையாளங்களாக வருதல்
  choice: பிசாசு என்றும் சாத்தான் என்றும் அழைக்கப்படுகிறவன்
  alternative: அவதூறுக்காரன் என்றும் எதிரி என்றும் அழைக்கப்படுகிறவன்
  rationale: கிரேக்கம் அரக்கப்பாம்பை பல இணை விளக்கங்களால் அடையாளப்படுத்துகிறது. தமிழில் பரவலாக அறியப்பட்ட பெயர்களை வைத்திருப்பது, கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல் அந்த அடையாளத்தைப் பாதுகாக்கிறது.
- issue: οἰκουμένη என்பதன் பரப்பு
  choice: உலகம் முழுவதையும்
  alternative: குடியிருக்கும் உலகம் முழுவதையும்
  rationale: இவ்வசனத்தின் திருக்காட்சிசார் உலகளாவிய பரப்பை இயல்பாகக் காட்டுகிறது; ‘குடியிருக்கும்’ என்ற சொல் மூலச்சொல்லில் சாத்தியமான நுணுக்கமாயினும், முதன்மை உரையில் தேவையற்ற சுமையை ஏற்படுத்தும்.
- issue: ὁ ὄφις ὁ ἀρχαῖος என்பதன் ஆதியாகமத் தொடர்பு
  choice: முதன்மை உரையில் ‘அந்தப் பழைய பாம்பு’; தொடர்பு அடிக்குறிப்பில்
  alternative: ஆதியில் இருந்த பாம்பு
  rationale: உரை தானாக ஆதியாகமம் 3 என்று வெளிப்படையாகச் சொல்லவில்லை. ‘பழைய’ என்பது ἀρχαῖος-ன் பொருளைக் காத்து, மறைமுகத் தொடர்பை விளக்கமாக மாற்றாமல் விடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. நீண்ட கிரேக்க வாக்கியத்தின் இணை அடையாளங்களும், ‘எறியப்பட்டது’ என்ற மீளுரைப்பும் பாதுகாக்கப்பட்டுள்ளன. [a] தொடர்புடைய ‘பழைய பாம்பு’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது; [b] முழு மாற்று வாசகத்துடன் தொடர்புபட வசன முடிவில் வைக்கப்பட்டுள்ளது.
