  text: And she was pregnant[a], and she cries out[c][b], suffering birth pains and being tormented to give birth.
translation:
  language: ta
  text: அவள் கர்ப்பமாக இருந்தாள்[a]. பிரசவ வேதனையில் தவித்து, குழந்தையைப் பெற்றெடுக்கக் கடும் துன்பத்துக்குள்ளாகி, அவள் கதறிக்கொண்டிருந்தாள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, ‘கருப்பையில் கொண்டிருந்தாள்’; அல்லது, ‘கருவுற்றிருந்தாள்.’
    reason: lexical_alternative
  - marker: b
    text: ‘கதறிக்கொண்டிருந்தாள்’ என்பதற்கு ‘உரக்கக் கூக்குரலிட்டுக்கொண்டிருந்தாள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν γαστρὶ ἔχουσα
  choice: அவள் கர்ப்பமாக இருந்தாள்
  rationale: ‘கருப்பையில் கொண்டிருந்தவள்’ என்பது சொற்சொல் வடிவம்; ‘கர்ப்பமாக இருந்தாள்’ என்பது அதே பொருளை இயல்பான நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: κράζει
  choice: அவள் கதறிக்கொண்டிருந்தாள்
  rationale: நிகழ்கால வினைச்சொல்லின் தொடர்ச்சியையும் காட்சியின் தீவிரத்தையும் இவ்வடிவம் வெளிப்படுத்துகிறது; சாதாரணமாக ‘கூப்பிட்டாள்’ என்பதைக் காட்டிலும் பிரசவத் துன்பச் சூழலுக்கு இது பொருத்தமானது.
- source_word: ὠδίνουσα
  choice: பிரசவ வேதனைப்பட்டு
  rationale: பிரசவ வலியை அனுபவிப்பதைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: βασανιζομένη
  choice: கடும் துன்பத்துக்குள்ளாகி
  rationale: செயப்பாட்டு வடிவத்தையும் கிரேக்கச் சொல்லின் தீவிரத்தையும் காக்கிறது; இதை வெறும் ‘வலியுற்று’ என்று மென்மையாக்கவில்லை.
- source_word: τεκεῖν
  choice: குழந்தையைப் பெற்றெடுக்க
  rationale: பிள்ளைப்பேற்றை நவீன தமிழில் இயல்பாகக் குறிக்கிறது; கிரேக்கத்தில் பொருள் வெளிப்படையாகச் சொல்லப்படாவிட்டாலும் தமிழில் ‘குழந்தையை’ சேர்ப்பது இயல்பான தெளிவை அளிக்கிறது.
- source_word: καὶ ... καὶ
  choice: -ப்பட்டு ... -உள்ளாகி
  rationale: கிரேக்கத்தின் தொடர்ச்சியான கூறுகள் தமிழின் இயல்பான வினையெச்சத் தொடரால் இணைக்கப்பட்டுள்ளன; ஒவ்வொரு καί-யையும் ‘மற்றும்’ என இயந்திரமாக மொழிபெயர்ப்பது தவிர்க்கப்பட்டது.
theological_decisions:
- issue: தரிசனத்திலுள்ள பெண்ணின் துன்பத்தின் தீவிரமும் தன்மையும்
  choice: βασανιζομένη என்பதைக் ‘கடும் துன்பத்துக்குள்ளாகி’ என்று வலிமையாக மொழிபெயர்த்து, பெண்ணின் அடையாளத்தை விளக்காமல் விடுதல்
  alternative: ‘வேதனையடைந்து’ அல்லது ‘வலியுற்று’ என்று மென்மையாக மொழிபெயர்த்தல்
  rationale: மூலவசனம் அவளுடைய துன்பத்தைத் தீவிரமாகச் சித்தரிக்கிறது; ஆனால் அவள் யாரைக் குறிக்கிறாள் என்பதை இவ்வசனத்திலேயே தீர்மானிக்கவில்லை. ஆகவே குறியீட்டு அடையாளம் குறித்த எந்தத் தனிப்பட்ட இறையியல் விளக்கமும் உரைக்குள் சேர்க்கப்படவில்லை.
translation_notes:
  register: இயல்பான, நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. தரிசனக் காட்சியின் தீவிரம் ‘கதறிக்கொண்டிருந்தாள்’ மற்றும் ‘கடும் துன்பத்துக்குள்ளாகி’ என்பவற்றால் காக்கப்பட்டுள்ளது; பெண்ணின் குறியீட்டு அடையாளம் விளக்கமாகச் சேர்க்கப்படவில்லை.
