id: REV.12.13
reference: Revelation 12:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ὅτε εἶδεν ὁ δράκων ὅτι ἐβλήθη εἰς τὴν γῆν, ἐδίωξεν τὴν γυναῖκα ἥτις ἔτεκεν τὸν ἄρσενα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/013.yaml
  text: And when the dragon saw that he had been thrown down to the earth[b][a], he pursued the woman who had given birth to the male child.
translation:
  language: ta
  text: அந்த வலுசர்ப்பம் தான் பூமிக்குத் தள்ளப்பட்டதைப் பார்த்ததும், ஆண் குழந்தையைப்[b] பெற்றெடுத்த பெண்ணைத் துரத்தியது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பெண்ணைத் துன்புறுத்தியது.’ கிரேக்க வினைச்சொல் ‘துரத்துதல்’ என்றும் ‘துன்புறுத்துதல்’ என்றும் பொருள்படலாம்; இங்கு பகைமையுடன் துரத்துதல், துன்புறுத்துதல் ஆகிய இரண்டும் உள்ளடங்கியிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘ஆணைப்.’ இயல்பான தமிழுக்காக ‘குழந்தை’ என்பது சேர்க்கப்பட்டுள்ளது; சுற்றியுள்ள வசனங்களின் சொல்லாட்சியையும் ஒப்பிடுக.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δράκων
  choice: வலுசர்ப்பம்
  rationale: வெளிப்படுத்தின விசேஷத்தின் தரிசன மொழியில் வரும் ‘dragon’ உருவகத்தைத் தக்கவைக்கிறது; இதனை வெறுமனே ‘பாம்பு’ என்று மாற்றி வேறு வசனங்களோடு ஒத்திசைக்கவில்லை.
- source_word: ἐβλήθη εἰς τὴν γῆν
  choice: பூமிக்குத் தள்ளப்பட்டது
  rationale: வலுக்கட்டாயமாகக் கீழே அகற்றப்பட்டதைக் குறிக்கும் செயல்பாட்டு உணர்வையும், பரலோகத்துக்கு எதிரான ‘பூமி’ என்ற அண்டவியல் சூழலையும் காக்கிறது.
- source_word: ἐδίωξεν
  choice: துரத்தியது
  rationale: διώκω என்பதன் நேரடியான பின்தொடர்தல் அல்லது விரட்டுதல் என்ற பொருளை இயல்பான தமிழில் தருகிறது; துன்புறுத்துதல் என்ற உட்பொருளும் சூழலில் நிலைத்திருக்கிறது.
- source_word: γυναῖκα
  choice: பெண்ணை
  rationale: அந்தப் பெண்ணின் அடையாளத்தை விளக்கவுரையாகத் தீர்மானிக்காமல், கிரேக்கச் சொல்லை நேரடியாக வழங்குகிறது.
- source_word: ἔτεκεν
  choice: பெற்றெடுத்த
  rationale: குழந்தையைப் பெற்றெடுத்தல் என்ற τίκτω வினையின் பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: τὸν ἄρσενα
  choice: ஆண் குழந்தையை
  rationale: கிரேக்கத்தில் பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட ‘ஆண்’ என்பதைக் தமிழில் இயல்பாகத் தெளிவுபடுத்த ‘குழந்தை’ சேர்க்கப்பட்டுள்ளது; ஆண்பால் மீதான குறிக்கப்பட்ட வலியுறுத்தல் தக்கவைக்கப்படுகிறது.
theological_decisions:
- issue: பெண்ணும் ஆண் குழந்தையும் குறிக்கும் அடையாளம்
  choice: ‘பெண்’, ‘ஆண் குழந்தை’ என்ற தரிசன உருவகங்களை விளக்க விரிவாக்கமின்றித் தக்கவைத்தல்
  alternative: பெண்ணை மரியா, இஸ்ரவேல் அல்லது தேவமக்கள்/திருச்சபை என்றும், குழந்தையை ஒரு குறிப்பிட்ட விளக்கத்தின்படி அடையாளப்படுத்தியும் மொழிபெயர்த்தல்
  rationale: இந்த உருவகங்களின் துல்லியமான அடையாளம் குறித்து ஒன்றுக்கு மேற்பட்ட விளக்கங்கள் உள்ளன; கிரேக்க உரை இவ்வசனத்தில் சொல்வதைத் தாண்டி மொழிபெயர்ப்பு அந்த விவாதத்தைத் தீர்மானிக்கக் கூடாது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘பார்த்ததும்’ என்பது நிகழ்வுகளின் காலத் தொடர்பை இயல்பாகக் காட்டுகிறது. வெளிப்படுத்தின விசேஷத்தின் தரிசனச் சொல்லாட்சியில் நிலைபெற்ற ‘வலுசர்ப்பம்’ தேர்ந்தெடுக்கப்பட்டு, சாதாரண ‘பாம்பு’ என்பதுடன் ஒத்திசைக்கப்படவில்லை.
