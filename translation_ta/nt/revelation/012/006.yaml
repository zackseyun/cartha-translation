id: REV.12.6
reference: Revelation 12:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἡ γυνὴ ἔφυγεν εἰς τὴν ἔρημον, ὅπου ἔχει ἐκεῖ τόπον ἡτοιμασμένον ⸀ἀπὸ τοῦ θεοῦ, ἵνα ἐκεῖ ⸀τρέφωσιν αὐτὴν ἡμέρας χιλίας διακοσίας ἑξήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/006.yaml
  text: And the woman fled into the wilderness[a], where she has there a place prepared by God, so that there they might nourish her for one thousand two hundred sixty days.
translation:
  language: ta
  text: அந்தப் பெண் வனாந்தரத்திற்குத் தப்பியோடினாள். அங்கே அவர்கள் அவளை ஆயிரத்து இருநூற்று அறுபது நாட்கள் பேணும்படியாக, கடவுளால் ஆயத்தம் செய்யப்பட்ட ஓர் இடம் அவளுக்கு அங்கே இருக்கிறது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφυγεν
  choice: தப்பியோடினாள்
  rationale: φεύγω குறிக்கும் ஆபத்திலிருந்து விலகிச் செல்லும் அவசரமான ஓட்டத்தையும் தப்பிச் செல்லுதலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἔρημον
  choice: வனாந்தரம்
  rationale: ἔρημος என்பது மணற்பாலை மட்டுமல்லாமல் மக்கள் நடமாட்டமற்ற பாழான தனிமையான இடத்தையும் குறிக்கலாம்; ‘வனாந்தரம்’ அந்தப் பரந்த வேதாகமப் பொருளைத் தக்கவைக்கிறது.
- source_word: τόπον
  choice: ஓர் இடம்
  rationale: τόπος என்பதன் நேரடியான, வரையறுக்கப்படாத பொருளை இயல்பாக வழங்குகிறது.
- source_word: ἡτοιμασμένον ἀπὸ τοῦ θεοῦ
  choice: கடவுளால் ஆயத்தம் செய்யப்பட்ட
  rationale: முன்பே தயார் நிலையில் வைக்கப்பட்ட இடம் என்ற நிறைவேற்றப்பட்ட செயப்பாட்டு வினையெச்சத்தின் பொருளையும், செய்பவர் கடவுள் என்பதையும் தக்கவைக்கிறது.
- source_word: ἔχει ἐκεῖ
  choice: அங்கே ... அவளுக்கு இருக்கிறது
  rationale: கிரேக்கத்தின் நிகழ்காலத்தையும் இடத்திற்குக் கொடுக்கப்பட்ட வலியுறுத்தலையும் காக்கிறது; தேவையற்ற தமிழ் மறுபடியுரைத்தலைத் தவிர்க்க சொல் வரிசை இயல்பாக்கப்பட்டுள்ளது.
- source_word: ἵνα
  choice: …படியாக
  rationale: நோக்கம் அல்லது விளைவை அறிமுகப்படுத்தும் ἵνα-வின் விசையை இயல்பான தமிழ் நோக்கக் கட்டமைப்பில் தருகிறது.
- source_word: τρέφωσιν αὐτὴν
  choice: அவர்கள் அவளை … பேணும்படியாக
  rationale: τρέφω உணவளித்தல், வளர்த்தல், தொடர்ந்து பராமரித்தல் ஆகிய நிழற்பொருள்களைக் கொண்டது. ‘பேணுதல்’ நீடித்த கவனிப்பைச் சுருக்கமாகக் குறிக்கிறது; வெளிப்படாத மூன்றாம் நபர் பன்மை எழுவாயை ‘அவர்கள்’ என்று தீர்மானிக்காமல் தக்கவைக்கிறது.
- source_word: ἡμέρας χιλίας διακοσίας ἑξήκοντα
  choice: ஆயிரத்து இருநூற்று அறுபது நாட்கள்
  rationale: கால அளவைக் குறிக்கும் வேற்றுமைப் பொருளைத் தெளிவாகவும், எண்ணை ஓடும் உரைநடைக்கு ஏற்றவாறும் வழங்குகிறது.
theological_decisions:
- issue: τρέφωσιν என்பதன் குறிப்பிடப்படாத எழுவாய்
  choice: ‘அவர்கள் அவளைப் பேணும்படியாக’ என்று மூன்றாம் நபர் பன்மை செயப்பாட்டு வடிவத்தைத் தக்கவைத்தல்
  alternative: ‘அவள் அங்கே பேணப்படும்படியாக’ என்ற செயப்படுபாட்டு வடிவம்
  rationale: கிரேக்க வினை மூன்றாம் நபர் பன்மையில் இருந்தாலும் எழுவாய் குறிப்பிடப்படவில்லை. ‘கடவுள்’ அல்லது வேறு முகவரைச் சேர்ப்பது உரையைத் தாண்டிய விளக்கமாகிவிடும்; ஆகவே அதன் உண்மையான தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, வாசிக்க எளிதான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வனாந்தரம்’, ‘ஆயத்தம்’, ‘பேணுதல்’ ஆகியவை வேதாகமச் சூழலின் ஒலியைத் தக்கவைத்தாலும் பொதுவாசகர்களுக்குப் புரியக்கூடிய சொற்களாக உள்ளன. கிரேக்கத்தின் இடவலியுறுத்தல் காக்கப்பட்டுள்ளது; ஆனால் தமிழில் இயல்பற்ற தேவையற்ற மறுபடியுரை தவிர்க்கப்பட்டுள்ளது.
