id: REV.12.4
reference: Revelation 12:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἡ οὐρὰ αὐτοῦ σύρει τὸ τρίτον τῶν ἀστέρων τοῦ οὐρανοῦ, καὶ ἔβαλεν αὐτοὺς εἰς τὴν γῆν. καὶ ὁ δράκων ἕστηκεν ἐνώπιον τῆς γυναικὸς τῆς μελλούσης τεκεῖν, ἵνα ὅταν τέκῃ τὸ τέκνον αὐτῆς καταφάγῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/004.yaml
  text: And his tail sweeps away a third of the stars of heaven and threw them to the earth. And the dragon stood before the woman who was about to give birth, so that when she gave birth, he might devour her child.
translation:
  language: ta
  text: அதன் வால் வானத்தின் நட்சத்திரங்களில் மூன்றில் ஒரு பங்கை இழுத்துச் செல்கிறது; அவற்றைப் பூமியின்மேல் எறிந்தது. குழந்தை பெறவிருந்த பெண்ணுக்கு முன்பாக அந்த டிராகன் நின்றுகொண்டிருக்கிறது; அவளுக்குக் குழந்தை பிறந்தவுடன், அவளுடைய குழந்தையைத் தின்றுவிடுவதற்காக அது அங்கே நின்றுகொண்டிருக்கிறது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δράκων
  choice: பெரும்பாம்பு
  rationale: வெளிப்படுத்தல் நூலின் காட்சிமொழியில் வரும் மிகப்பெரிய பாம்புபோன்ற கொடிய உயிரினத்தை இயல்பான தமிழில் உணர்த்துகிறது; நவீன கற்பனைக்கதைகளின் ‘டிராகன்’ உருவத்தைத் தேவையின்றி இறக்குமதி செய்யவில்லை.
- source_word: σύρει
  choice: இழுத்துச் சென்று
  rationale: நிகழ்கால வடிவத்தின் காட்சித் தீவிரத்தையும், வால் நட்சத்திரங்களை இழுத்துச் செல்லும் செயலையும் வெளிப்படுத்துகிறது.
- source_word: τὸ τρίτον
  choice: மூன்றில் ஒரு பங்கை
  rationale: மொத்த நட்சத்திரங்களில் ஒரு மூன்றாம் பங்கு என்ற அளவைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது.
- source_word: καταφάγῃ
  choice: விழுங்கிவிடுவதற்காக
  rationale: முழுமையாகத் தின்றுவிடுதல் என்ற வன்மையான பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: வானத்தின் நட்சத்திரங்களின் அடையாளம்
  choice: ‘நட்சத்திரங்கள்’ என்ற காட்சிப்படிமம் விளக்கமின்றி பாதுகாக்கப்பட்டது.
  alternative: அவற்றைத் தேவதூதர்கள் அல்லது வேறு ஆன்மிக உயிர்கள் என்று நேரடியாக அடையாளப்படுத்துதல்.
  rationale: இந்த வசனம் தானாகவே அவற்றின் அடையாளத்தை விளக்கவில்லை; எனவே குறிப்பிட்ட விளக்க மரபை மொழிபெயர்ப்பில் புகுத்தவில்லை.
- issue: σύρει என்ற நிகழ்காலத்துக்கும் ἔβαλεν என்ற இறந்தகாலத்துக்கும் இடையிலான காலமாற்றம்
  choice: ‘இழுத்துச் சென்று ... எறிந்தது’ என்று மூலத்தின் காலநிலை மாறுபாடு இயன்றவரை பாதுகாக்கப்பட்டது.
  alternative: இரு வினைகளையும் ஒரே நிகழ்காலத்திலோ ஒரே இறந்தகாலத்திலோ ஒத்திசைத்தல்.
  rationale: மூல கிரேக்க உரையின் திடீர் காலமாற்றம் காட்சிநடையின் அம்சமாக இருக்கலாம்; அதை அமைதியாகச் சீராக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகருக்குப் புரியும் வகையில் இயல்பான, கண்ணியமான காட்சிமொழி பயன்படுத்தப்பட்டுள்ளது. மூல உரையின் உருவகங்களும் இறையியல் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
