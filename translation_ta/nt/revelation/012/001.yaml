id: REV.12.1
reference: Revelation 12:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ σημεῖον μέγα ὤφθη ἐν τῷ οὐρανῷ, γυνὴ περιβεβλημένη τὸν ἥλιον, καὶ ἡ σελήνη ὑποκάτω τῶν ποδῶν αὐτῆς, καὶ ἐπὶ τῆς κεφαλῆς αὐτῆς στέφανος ἀστέρων δώδεκα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/001.yaml
  text: 'And a great sign appeared in heaven: a woman clothed with the sun[a], and the moon under her feet, and on her head a crown of twelve stars,'
translation:
  language: ta
  text: 'வானத்தில் ஒரு பெரிய அடையாளம் தோன்றியது: சூரியனை ஆடையாக அணிந்திருந்த ஒரு பெண்; அவளுடைய கால்களுக்குக் கீழே சந்திரன் இருந்தது; அவளுடைய தலையின்மேல் பன்னிரண்டு நட்சத்திரங்களைக் கொண்ட ஒரு கிரீடம்[a] இருந்தது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மாலை’ அல்லது ‘வெற்றியாளரின் கிரீடம்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ஸ்தெஃபனோஸ்; இது அரச மணிமுடியைக் குறிக்கும் சொல்லிலிருந்து வேறுபட்டது.
    reason: στέφανος என்பதன் வெற்றி மாலை சார்ந்த நுண்பொருளையும் அரச மணிமுடியிலிருந்து அதன் வேறுபாட்டையும் தெளிவுபடுத்துகிறது.
lexical_decisions:
- source_word: σημεῖον
  choice: அடையாளம்
  rationale: வெளிப்படுத்தின விசேஷத்தின் தரிசனச் சூழலில் இது வெறும் அற்புதத்தை அல்ல, குறியீட்டுப் பொருளுடைய காட்சியைச் சுட்டுகிறது; ‘அடையாளம்’ அந்தப் பொருளை மிகைப்படுத்தாமல் காக்கிறது.
- source_word: μέγα
  choice: பெரிய
  rationale: அளவையும் முக்கியத்துவத்தையும் இயல்பாக வெளிப்படுத்தும் பொதுவான தமிழ் சொல்.
- source_word: ὤφθη
  choice: தோன்றியது
  rationale: இலக்கண வடிவில் ‘காணப்பட்டது’ என்றாலும், தரிசனத்தில் ஒன்று புலப்பட்டதை நவீன தமிழில் ‘தோன்றியது’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἐν τῷ οὐρανῷ
  choice: வானத்தில்
  rationale: οὐρανός என்பதன் ‘வானம்/பரலோகம்’ என்ற பொருள் நெகிழ்வைத் தமிழின் ‘வானம்’ ஓரளவு காக்கிறது; இத்தரிசனத்தின் காட்சிக் களத்திற்கும் இது இயல்பானது.
- source_word: γυνή
  choice: ஒரு பெண்
  rationale: இங்கு மனைவி என்று குறிப்பாகக் கூறப்படாமல், அடையாளக் காட்சியிலுள்ள ஒரு பெண் அறிமுகப்படுத்தப்படுகிறாள்.
- source_word: περιβεβλημένη τὸν ἥλιον
  choice: சூரியனை ஆடையாக அணிந்திருந்த
  rationale: περιβάλλω என்பதிலுள்ள உடுத்தியிருத்தல் அல்லது சூழப்பட்டிருத்தல் என்ற உருவகத்தைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἡ σελήνη ὑποκάτω τῶν ποδῶν αὐτῆς
  choice: அவளுடைய கால்களுக்குக் கீழே சந்திரன்
  rationale: இடஞ்சார்ந்த காட்சியை விளக்கவுரை சேர்க்காமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: στέφανος
  choice: கிரீடம்
  rationale: முதன்மை உரையில் எளிதில் புரியும் சொல் தேர்ந்தெடுக்கப்பட்டுள்ளது; வெற்றி மாலை போன்ற அதன் குறிப்பான நுண்பொருளும் அரச மணிமுடியிலிருந்து உள்ள வேறுபாடும் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: ἀστέρων δώδεκα
  choice: பன்னிரண்டு நட்சத்திரங்களாலான
  rationale: கிரீடத்திற்கும் நட்சத்திரங்களுக்கும் உள்ள தொடர்பை இயல்பான தமிழில் காட்டுகிறது; அவை எவ்வாறு அமைந்திருந்தன என்ற கூடுதல் விளக்கத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: பெண்ணின் அடையாளக் குறியீட்டு அடையாளம்
  choice: அந்தப் பெண் யார் என்று மொழிபெயர்ப்பில் அடையாளப்படுத்தாமல், தரிசனக் காட்சியாக மட்டும் விவரித்தல்
  alternative: இஸ்ரவேல், மரியா, தேவனுடைய மக்கள், அல்லது திருச்சபை என்று அடையாளப்படுத்துதல்
  rationale: இந்த வசனமே அந்தப் பெண்ணை வெளிப்படையாக அடையாளப்படுத்தவில்லை. ஆகவே ஒரு குறிப்பிட்ட இறையியல் அல்லது சமயப்பிரிவு விளக்கத்தை உரைக்குள் கொண்டுவராமல் அதன் தெளிவின்மையும் இறையியல் பதற்றமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வெளிப்படுத்தின விசேஷத்தின் உயர்ந்த தரிசன நடையைத் தக்கவைக்கும் வகையிலும் மொழிநடை அமைக்கப்பட்டுள்ளது. பெண்ணின் குறியீட்டு அடையாளம் விளக்கப்படாமல் விடப்பட்டுள்ளது; அரைப்புள்ளி காட்சியின் மூன்று கூறுகளையும் தெளிவாக இணைக்கிறது.
