translation:
  language: ta
  text: மேலும், அவன் கடலின் மணல்மேல் நின்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “மேலும், நான் கடலின் மணல்மேல் நின்றேன்” என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: அப்போது
  rationale: முந்தைய நிகழ்வுடன் இக்காட்சியை இணைக்கும் καὶ என்பதைக் காலத் தொடர்ச்சியை இயல்பாக உணர்த்தும் தமிழ்ச் சொல்லால் மொழிபெயர்க்கிறது.
- source_word: ἐστάθη
  choice: அவன் நின்றான்
  rationale: ἵστημι என்பதன் இறந்தகால, செயப்பாட்டு வடிவம் இங்கு தன்வினைப் பொருளில் ‘நின்றான்’ என்று வருகிறது. அச்சிடப்பட்ட மூலப்பாடம் மூன்றாம் நபர் ஒருமையில் இருப்பதாலும், முந்தைய வசனத்திலுள்ள வலுசர்ப்பமே இயல்பான முன்னிலையாதலாலும் ‘அவன்’ பயன்படுத்தப்படுகிறது.
- source_word: ἐπὶ
  choice: மேல்
  rationale: இங்கு ἐπί, நிற்பதன் விளைவான இடத்தைக் குறிக்கிறது; ‘மேல்’ என்பது தமிழில் அந்த இட உறவைத் தெளிவாகத் தருகிறது.
- source_word: τὴν ἄμμον
  choice: மணற்பரப்பு
  rationale: ἄμμος என்பதன் அடிப்படைப் பொருள் ‘மணல்’. கடலோரத்தில் ஒருவர் நிற்கும் இடத்தை இயல்பான தமிழில் குறிக்க ‘மணற்பரப்பு’ எனத் தரப்படுகிறது; ‘கரை’ என்று மட்டும் மொழிபெயர்த்து மணல் என்ற காட்சியை இழக்கவில்லை.
- source_word: τῆς θαλάσσης
  choice: கடலின்
  rationale: ‘மணல்’ என்பதை வரையறுக்கும் மூலத்தின் உரிமை வேற்றுமைத் தொடர்பை ‘கடலின்’ நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: வினைச்சொல்லின் நபர் மற்றும் எழுவாய் அடையாளம்
  choice: முதன்மைப் பாடத்தில் மூன்றாம் நபர் வாசகத்தைப் பின்பற்றி, ‘அவன் ... நின்றான்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘நான் கடலின் மணற்பரப்பின்மேல் நின்றேன்.’
  rationale: SBLGNT மூலப்பாடத்தில் ἐστάθη (‘அவன் நின்றான்’) உள்ளது; சூழலில் அது முந்தைய வசனத்தின் வலுசர்ப்பத்தைக் குறிப்பதாக இயல்பாகத் தெரிகிறது. ஆயினும் ἐστάθην (‘நான் நின்றேன்’) என்ற முக்கியமான மாற்றுப் பாடம் இருப்பதால் அதை அடிக்குறிப்பில் பாதுகாக்கிறோம்.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘மணற்பரப்பு’ என்பது ‘கடலின் மணல்’ என்ற மூலக் காட்சியைப் பாதுகாத்தபடியே இயல்பான தமிழ்நடையை வழங்குகிறது.
