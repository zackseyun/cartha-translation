  text: διὰ τοῦτο εὐφραίνεσθε, ⸀οἱ οὐρανοὶ καὶ οἱ ἐν αὐτοῖς σκηνοῦντες. οὐαὶ ⸂τὴν γῆν καὶ τὴν θάλασσαν⸃, ὅτι κατέβη ὁ διάβολος πρὸς ὑμᾶς, ἔχων θυμὸν μέγαν, εἰδὼς ὅτι ὀλίγον καιρὸν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/012.yaml
  text: Therefore rejoice[a], O heavens, and you who dwell in them. Woe to the earth and the sea, because the devil has come down to you with great fury[c][b], knowing that he has only a little time.
translation:
  language: ta
  text: ஆகையால், வானங்களே, அவற்றில் குடியிருக்கிறவர்களே, மகிழுங்கள்! பூமியே[a], கடலே, உங்களுக்கு ஐயோ! ஏனெனில் பிசாசு மிகுந்த சீற்றத்துடன்[b] உங்களிடம் இறங்கி வந்திருக்கிறான்; தனக்குக் கொஞ்சக் காலமே இருக்கிறது[c] என்பதை அவன் அறிந்திருக்கிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நிலமே.’ கிரேக்கச் சொல் γῆ என்பது ‘பூமி’ அல்லது ‘நிலம்’ என்று பொருள்படலாம்; இங்கு சூழல் பிரபஞ்ச அளவிலானதாக இருப்பதால் ‘பூமி’ என்பது தேர்ந்தெடுக்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மிகுந்த கோபத்துடன்.’
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்குச் சொல், ‘அவனுக்குக் கொஞ்சக் காலம் இருக்கிறது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ஆகையால்
  rationale: முந்தைய பரலோக வெற்றியிலிருந்து வரும் முடிவை இயல்பாகவும் சுருக்கமாகவும் காட்டுகிறது.
- source_word: εὐφραίνεσθε
  choice: மகிழுங்கள்
  rationale: கட்டளைத் தன்மையையும் மகிழ்ச்சியான மறுமொழியையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: οἱ οὐρανοὶ
  choice: வானங்களே
  rationale: பன்மையையும் நேரடி அழைப்பின் விளிவேற்றுமையையும் பாதுகாக்கிறது.
- source_word: οἱ ἐν αὐτοῖς σκηνοῦντες
  choice: அவற்றில் குடியிருக்கிறவர்களே
  rationale: σκηνόω என்பதன் இங்குள்ள வசித்தல் என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது; கூடாரம் அமைத்தல் என்ற சொற்பொருள் இவ்விடத்தில் தெளிவற்றதாக இருக்கும்.
- source_word: οὐαὶ
  choice: ஐயோ
  rationale: தீர்க்கதரிசன எச்சரிக்கை மற்றும் பேராபத்தின் உணர்வைத் தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: τὴν γῆν καὶ τὴν θάλασσαν
  choice: பூமிக்கும் கடலுக்கும்
  rationale: γῆ என்பதற்குப் பூமி அல்லது நிலம் என்று பொருள் இருக்கலாம்; இங்குள்ள பிரபஞ்ச அளவிலான வானம்–பூமி எதிர்மறை அமைப்பில் ‘பூமி’ பொருத்தமானது.
- source_word: κατέβη
  choice: இறங்கி வந்திருக்கிறான்
  rationale: முடிந்த செயலும் அதன் தற்போதைய விளைவும் ஒன்றாகத் தெரிவதுடன் தமிழில் இயல்பாக உள்ளது.
- source_word: ὁ διάβολος
  choice: பிசாசு
  rationale: இச்சூழலில் சாத்தானைக் குறிக்கும் நிலைபெற்ற பட்டப்பெயருக்கு வழக்கமான தெளிவான தமிழ் இணை.
- source_word: πρὸς ὑμᾶς
  choice: உங்களிடம்
  rationale: பூமிக்குரிய வட்டாரத்தை நோக்கி வந்தடைதலைக் காட்டுகிறது; கிரேக்க முன்னிடைச்சொல்லில் இல்லாத ‘எதிராக’ என்ற கருத்தைச் சேர்க்கவில்லை.
- source_word: ἔχων θυμὸν μέγαν
  choice: மிகுந்த சீற்றத்துடன்
  rationale: θυμός குறிக்கும் கடுமையான கோபத்தை வலிமையாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: εἰδὼς
  choice: அறிந்திருக்கிறான்
  rationale: பிசாசின் தற்போதைய அறிவைத் தெளிவாகக் காட்டுகிறது; தமிழின் இயல்புக்காக இறுதி வினையாக அமைக்கப்பட்டுள்ளது.
- source_word: ὀλίγον καιρὸν ἔχει
  choice: தனக்குக் கொஞ்சக் காலமே இருக்கிறது
  rationale: மீதமுள்ள காலத்தின் குறுகிய அளவை ‘-மே’ வலியுறுத்தலால் தெரிவித்து, மூலத்தின் வடிவத்தையும் கருத்தையும் நெருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘உங்களிடம்’ என்பதன் குறிப்பு
  choice: இது உடனடியாக முன் சொல்லப்பட்ட பூமி மற்றும் கடல் எனும் கீழுலக வட்டாரத்தைக் குறிக்கிறது.
  alternative: இது வானங்களையும் அவற்றில் குடியிருப்பவர்களையும் தொடர்ந்து குறிக்கும் நேரடி அழைப்பாக இருக்கலாம்.
  rationale: ‘பூமிக்கும் கடலுக்கும் ஐயோ; ஏனெனில் பிசாசு உங்களிடம் இறங்கி வந்திருக்கிறான்’ என்ற அண்மைத் தொடர்பு, வானத்தின் மகிழ்ச்சிக்கும் பூமியின் ஆபத்துக்கும் இடையிலான நாடகத் தன்மையுள்ள முரண்பாட்டை இயல்பாகப் பாதுகாக்கிறது; ஆனால் உரையில் இல்லாத ‘குடியிருப்பவர்கள்’ என்ற விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், வெளிப்படுத்தின விசேஷத்தின் உயர்ந்த தீர்க்கதரிசனத் தொனியைப் பேணும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘வானங்களே’ என்ற பன்மையும் நேரடி அழைப்பும் பாதுகாக்கப்பட்டுள்ளன. வாக்கிய ஓட்டத்திற்காக εἰδὼς என்ற பங்கேற்பு இறுதி வினை அமைப்பாக இயல்பாக்கப்பட்டுள்ளது; காரணத் தொடர்பு ‘ஏனெனில்’ மூலம் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
