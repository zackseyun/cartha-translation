source:
  edition: SBLGNT
  text: καὶ ἔτεκεν υἱόν, ⸀ἄρσεν, ὃς μέλλει ποιμαίνειν πάντα τὰ ἔθνη ἐν ῥάβδῳ σιδηρᾷ· καὶ ἡρπάσθη τὸ τέκνον αὐτῆς πρὸς τὸν θεὸν καὶ πρὸς τὸν θρόνον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/005.yaml
  text: And she gave birth to a son, a male child, who is about to shepherd all the nations with an iron rod; and her child was snatched up to God and to his throne.
translation:
  language: ta
  text: அவள் ஒரு மகனை—ஓர் ஆண் குழந்தையை—பெற்றெடுத்தாள். அவன் இரும்புக் கோலால் எல்லா நாடுகளையும் மேய்க்கவிருக்கிறவன்.[a] அவளுடைய குழந்தை கடவுளிடத்திற்கும் அவருடைய அரியணைக்கும் திடீரெனப் பறித்தெடுக்கப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரும்புக் கோலால் எல்லா நாடுகளையும் ஆளவிருக்கிறவன்.” கிரேக்க வினைச்சொல்லின் நேரடிப் பொருள் “மேய்த்தல்”; இச்சூழலில் அது சங்கீதம் 2-ஐ எதிரொலித்து அரச அதிகாரத்தையும் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτεκεν
  choice: பெற்றெடுத்தாள்
  rationale: τίκτω என்பதன் நேரடியான மகப்பேற்று உருவகத்தை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: υἱόν, ἄρσεν
  choice: ஓர் ஆண் குழந்தையை—ஒரு மகனை—
  rationale: υἱός மற்றும் ἄρσεν ஆகிய இரு சொற்களையும் வெளிப்படுத்தி, மூலத்தின் வலியுறுத்தலைத் தமிழில் இயல்பாகக் காக்கிறது.
- source_word: μέλλει ποιμαίνειν
  choice: மேய்க்கவிருக்கிறவன்
  rationale: μέλλει என்பதிலுள்ள எதிர்நோக்கிய அல்லது விதிக்கப்பட்ட செயல் என்ற நுணுக்கத்தை வெறும் எளிய எதிர்காலமாகச் சுருக்காமல் தெரிவிக்கிறது.
- source_word: ποιμαίνειν
  choice: மேய்க்க
  rationale: ποιμαίνω என்பதன் மேய்ப்பர் உருவகத்தைப் பிரதான உரையில் காக்கிறது; சங்கீதம் 2 சார்ந்த அரச அதிகாரப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: πάντα τὰ ἔθνη
  choice: எல்லா நாடுகளையும்
  rationale: உலகின் எல்லா மக்களினங்களையும் அரசியல் சமூகங்களையும் குறிக்கும் பரந்த பொருளை இச்சூழலில் தெளிவாகத் தருகிறது.
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: இரும்புக் கோலால்
  rationale: ἐν என்பதன் கருவிப்பொருளையும் சங்கீதம் 2-இன் வலிமையான அரச உருவகத்தையும் சுருக்கமாகக் காக்கிறது.
- source_word: ἡρπάσθη
  choice: திடீரெனப் பறித்தெடுக்கப்பட்டது
  rationale: ἁρπάζω-வின் வலுவான, திடீரான அகற்றுதலையும் கடவுளை நோக்கிய மேலெடுத்துச் செல்லப்படுதலையும் வெளிப்படுத்துகிறது.
- source_word: τὸ τέκνον αὐτῆς
  choice: அவளுடைய குழந்தை
  rationale: υἱός என்பதிலிருந்து பொதுவான τέκνον என்ற சொல்லுக்கு மூலத்தில் ஏற்படும் மாற்றத்தைத் தமிழிலும் காக்கிறது.
- source_word: πρὸς τὸν θεὸν καὶ πρὸς τὸν θρόνον αὐτοῦ
  choice: கடவுளிடமும் அவரது அரியணையிடமும்
  rationale: இருமுறை வரும் πρὸς-ஐ இரு இலக்குகளையும் நோக்கிய இயக்கமாக இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ποιμαίνειν ... ἐν ῥάβδῳ σιδηρᾷ என்பதில் சங்கீதம் 2 சார்ந்த மெசியா குறிப்பு
  choice: பிரதான உரையில் “மேய்க்க” என்ற உருவகத்தை வைத்திருந்து, அரசாளுதல் என்ற பொருளை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: “இரும்புக் கோலால் எல்லா நாடுகளையும் ஆளவிருக்கிறவன்”
  rationale: இங்கு மெசியாவின் அரச அதிகாரம் வலுவாகக் குறிக்கப்பட்டாலும், கிரேக்க வினைச்சொல் நேரடியாக “மேய்த்தல்” எனப் பொருள்படும். ஆகவே உருவகத்தை உரையில் காப்பது மூலத்துக்கு நெருக்கமானது.
- issue: μέλλει என்பதன் வலிமை
  choice: “மேய்க்கவிருக்கிறவன்”
  alternative: “மேய்ப்பான்” அல்லது “மேய்க்க நியமிக்கப்பட்டவன்”
  rationale: இது வரவிருக்கும் செயலைத் தெரிவிக்கிறது; அதேவேளை உடனடித் தன்மையையோ தெய்வீக நியமனத்தையோ தேவையின்றி மிகைப்படுத்தாது, எதிர்நோக்கம் மற்றும் விதிக்கப்பட்ட எதிர்காலம் ஆகிய இரு சாத்தியங்களையும் திறந்துவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பும் கண்ணியமும் காக்கப்பட்டுள்ளன. “மேய்க்கவிருக்கிறவன்” என்பது அபோகலிப்டிக் எதிர்கால நோக்கை இயல்பாகத் தருகிறது. வாக்கியத்தின் அடுக்கு தெளிவுக்காக முதல் கிரேக்க இணைப்புச் சங்கிலி தமிழில் இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது.
