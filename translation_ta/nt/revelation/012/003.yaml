id: REV.12.3
reference: Revelation 12:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὤφθη ἄλλο σημεῖον ἐν τῷ οὐρανῷ, καὶ ἰδοὺ δράκων ⸂μέγας πυρρός⸃, ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα καὶ ἐπὶ τὰς κεφαλὰς αὐτοῦ ἑπτὰ διαδήματα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/003.yaml
  text: And another sign appeared in heaven[a], and behold, a great red dragon, having seven heads and ten horns, and on his heads seven diadems[b],
translation:
  language: ta
  text: வானத்தில் வேறொரு அடையாளம் தோன்றியது; இதோ, நெருப்புச் சிவப்பான ஒரு பெரிய வலுசர்ப்பம், அதற்கு ஏழு தலைகளும் பத்துக் கொம்புகளும் இருந்தன; அதன் தலைகளின்மேல் ஏழு அரசக் கிரீடங்கள்[a] இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரசத் தலைப்பட்டைகள்.” கிரேக்கச் சொல் வெற்றிமாலையைக் குறிக்காமல், அரசுரிமையைக் குறிக்கும் தலைஅணியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤφθη
  choice: தோன்றியது
  rationale: தரிசன விவரிப்பில் இந்தச் செயலப்பாட்டு வடிவம் இயல்பாக ‘தோன்றியது’ என்ற பொருளைத் தருகிறது; ‘காணப்பட்டது’ என்பதைவிட இது தமிழில் இயல்பானது.
- source_word: ἄλλο σημεῖον
  choice: வேறொரு அடையாளம்
  rationale: வெளிப்படுத்தலில் σημεῖον என்பது குறியீட்டுப் பொருளுள்ள தரிசன அடையாளத்தைக் குறிக்கிறது; பொருளை முன்கூட்டியே விளக்காமல் ‘அடையாளம்’ அதைத் தக்கவைக்கிறது.
- source_word: ἐν τῷ οὐρανῷ
  choice: வானத்தில்
  rationale: οὐρανός என்பதன் ‘வானம்/பரலோகம்’ என்ற பொருள் விரிவைத் தமிழின் ‘வானம்’ இயல்பாகத் தக்கவைக்கிறது; தரிசனம் நிகழும் இடத்தையும் தெளிவாகக் காட்டுகிறது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: தரிசனத்தில் திடீரெனத் தோன்றுவதை நோக்கிக் கவனத்தை ஈர்க்கும் உயர்ந்ததும் இயல்பானதுமான தமிழ் உரையாடல் குறி.
- source_word: δράκων
  choice: வலுசர்ப்பம்
  rationale: δράκων குறிக்கும் மாபெரும் பாம்பு போன்ற பயங்கர உயிரினத்தைத் தமிழ்ப் வேதாகம நடைக்கு ஏற்றவாறு ‘வலுசர்ப்பம்’ வெளிப்படுத்துகிறது; சாதாரண ‘பாம்பு’ என்று குறுக்கவில்லை.
- source_word: μέγας πυρρός
  choice: நெருப்பு நிறமான ஒரு பெரிய
  rationale: μέγας அளவையும் பேருருவத்தையும் காட்டுகிறது; πυρρός நெருப்பைப் போன்ற சிவப்பு நிறத்தைக் குறிக்கிறது. ‘நெருப்பு நிறமான’ என்பது வெறும் ‘சிவப்பு’ என்பதைக் காட்டிலும் அந்தப் படிமத்தைத் தக்கவைக்கிறது.
- source_word: κεφαλὰς ἑπτὰ καὶ κέρατα δέκα
  choice: ஏழு தலைகளும் பத்துக் கொம்புகளும்
  rationale: தரிசனத்தின் உருவக விவரங்களை விளக்கமின்றி நேரடியாகத் தக்கவைக்கும் மொழிபெயர்ப்பு.
- source_word: διαδήματα
  choice: அரச மணிமுடிகள்
  rationale: διάδημα என்பது வெற்றிமாலையான στέφανος அல்ல, அரசுரிமையைக் குறிக்கும் தலைஅணி. ‘அரச மணிமுடிகள்’ அந்த வேறுபாட்டை சாதாரண வாசகருக்குத் தெளிவாக்குகிறது.
theological_decisions:
- issue: πυρρός என்ற நிறச் சொல்லின் மொழிபெயர்ப்பு
  choice: நெருப்பு நிறமான
  alternative: சிவப்பான
  rationale: இச்சொல் நெருப்பைப் போன்ற சிவப்பைக் குறிக்கிறது. ‘நெருப்பு நிறமான’ என்பது நிறத்தின் தீவிரத்தையும் மூலச்சொல்லின் படிமத்தையும் தக்கவைக்கிறது; வலுசர்ப்பத்தின் இயல்பைப் பற்றிய கூடுதல் விளக்கத்தைச் சேர்க்கவில்லை.
- issue: δράκων-ஐச் சுட்டும் αὐτοῦ என்பதன் தமிழ் வடிவம்
  choice: அதன்
  alternative: அவனுடைய
  rationale: தமிழில் ஓர் உயிரின உருவத்தை இவ்வசனம் அறிமுகப்படுத்தும் இடத்தில் ‘அதன்’ இயல்பானது. பின்னர் வரும் அடையாளப்படுத்தலை இவ்வசனத்திற்குள் முன்கூட்டியே கொண்டு வராமல், மூலத்தின் உடைமைத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- issue: διάδημα மற்றும் பொதுவான ‘கிரீடம்’ ஆகியவற்றின் வேறுபாடு
  choice: அரச மணிமுடிகள்
  alternative: கிரீடங்கள்
  rationale: அரசுரிமையைக் குறிக்கும் தனிப்பட்ட தலைஅணி என்ற மூலச்சொல்லின் பொருளைத் தக்கவைக்கிறது; குறியீட்டின் இறையியல் பொருளை மொழிபெயர்ப்பிலேயே தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், தரிசனத்திற்குரிய கண்ணியமும் விறுவிறுப்பும் தக்கவைக்கப்பட்டுள்ளன. நீண்ட கிரேக்க வாக்கியத்தின் விவரிப்பு ஓட்டத்தைத் தமிழில் இயல்பாக்க அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்பதற்குப் பின் ஆச்சரியக்குறி வைத்து காட்சியின் திடீர்த் தாக்கம் வெளிப்படுத்தப்பட்டுள்ளது.
