id: REV.12.11
reference: Revelation 12:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ἐνίκησαν αὐτὸν διὰ τὸ αἷμα τοῦ ἀρνίου καὶ διὰ τὸν λόγον τῆς μαρτυρίας αὐτῶν, καὶ οὐκ ἠγάπησαν τὴν ψυχὴν αὐτῶν ἄχρι θανάτου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/011.yaml
  text: And they conquered him by the blood of the Lamb and by the word of their testimony[b][a], and they did not love their life even unto death.
translation:
  language: ta
  text: அவர்கள் ஆட்டுக்குட்டியானவரின் இரத்தத்தினாலும், தங்கள் சாட்சியின் செய்தியினாலும் அவனை வென்றார்கள்.[a] மரணம் வரையிலும் அவர்கள் தங்கள் உயிரை நேசிக்கவில்லை.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனைத் தோற்கடித்தார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தங்கள் ஆன்மாவை.” கிரேக்கச் சொல் ‘உயிர்,’ ‘சுயம்,’ அல்லது ‘ஆன்மா’ எனப் பொருள்படலாம். இங்கு மரணத்தை எதிர்கொள்ளும் சூழலில் ‘உயிர்’ என்பது பொருத்தமானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνίκησαν
  choice: வென்றார்கள்
  rationale: போர் மற்றும் வெற்றி உருவகத்தை இயல்பான நவீனத் தமிழில் நேரடியாகக் காக்கிறது; ‘மேற்கொண்டார்கள்’ என்பதைவிட இங்கு ‘வென்றார்கள்’ தெளிவானது.
- source_word: διὰ τὸ αἷμα
  choice: இரத்தத்தினாலும்
  rationale: διά + accusative இங்கு வழிமுறை அல்லது காரணத்தைச் சுட்டலாம். ‘-இனால்’ என்ற வடிவம் வெற்றி ஆட்டுக்குட்டியானவரின் இரத்தத்தின் வாயிலாக ஏற்பட்டது என்பதைத் தெரிவிக்கிறது; விரிவான கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: τοῦ ἀρνίου
  choice: ஆட்டுக்குட்டியானவரின்
  rationale: வெளிப்படுத்தின விசேஷத்தில் கிறிஸ்துவைக் குறிக்கும் தனிப்பட்ட பட்டமாக இருப்பதையும், பலியுடன் தொடர்புடைய உருவகத்தையும் காக்கிறது.
- source_word: τὸν λόγον τῆς μαρτυρίας αὐτῶν
  choice: தாங்கள் அளித்த சாட்சியின் செய்தியினாலும்
  rationale: λόγος என்பதைச் சூழலுக்கேற்ற ‘செய்தி’ என்றும் μαρτυρία என்பதை ‘சாட்சி’ என்றும் வெளிப்படுத்துகிறது. சொல்லுக்குச் சொல் அமைப்பின் இயல்பற்ற தன்மையைத் தவிர்த்து, அவர்கள் அறிவித்த சாட்சிச் செய்தி என்ற பொருளைக் காக்கிறது.
- source_word: οὐκ ἠγάπησαν
  choice: நேசிக்கவில்லை
  rationale: ἀγαπάω என்பதன் நேரடியான பொருளையும், உயிரைக் காப்பதைவிட உண்மைத்தன்மையைத் தேர்ந்தெடுத்தார்கள் என்ற வசனத்தின் தீவிரத்தையும் காக்கிறது.
- source_word: τὴν ψυχὴν αὐτῶν
  choice: தங்கள் உயிரை
  rationale: ψυχή என்பது உயிர், சுயம், ஆன்மா எனப் பொருள்படலாம். மரணத்தை எதிர்கொள்ளும் சூழலில் பூமிக்குரிய உயிரே கருத்தாக இருப்பதால் ‘உயிரை’ என்பது பொருத்தமானது; கிரேக்க ஒருமை பகிர்ந்தளிக்கும் பொருளில் இருப்பதையும் தமிழில் இயல்பாகக் காக்கிறது.
- source_word: ἄχρι θανάτου
  choice: சாவைச் சந்திக்க வேண்டியிருந்தபோதிலும்
  rationale: மரணமடையும் எல்லைவரை சென்ற அவர்களது பற்றுறுதியை நவீனத் தமிழில் தெளிவாகத் தெரிவிக்கிறது; வெறுமனே ஒரு கால எல்லையாகப் புரிந்துகொள்ளப்படுவதைத் தவிர்க்கிறது.
theological_decisions:
- issue: ‘ஆட்டுக்குட்டியானவரின் இரத்தத்தினால்’ கிடைத்த வெற்றியின் பொருள்
  choice: இரத்தத்தை வெற்றிக்கான வழிமுறையாக வெளிப்படுத்தும் வகையில் மொழிபெயர்க்கப்பட்டது; வசனம் கூறாத விரிவான பாவநிவாரணக் கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
  alternative: ‘ஆட்டுக்குட்டியானவரின் இரத்தத்தின் காரணமாக’ என்று காரணப் பொருளில் மொழிபெயர்த்தல்.
  rationale: διά + accusative வழிமுறை அல்லது காரணம் ஆகிய இரண்டையும் ஏற்கலாம். உடனடிச் சூழலில் வழிமுறைப் பொருள் வலுவாக இருந்தாலும், தமிழின் ‘-இனால்’ காரண நிழலையும் முற்றிலும் நீக்குவதில்லை.
- issue: இரத்தசாட்சி சூழலில் ψυχή என்பதன் பொருள்
  choice: ‘ஆன்மா’ என்பதற்குப் பதிலாக ‘உயிர்’ என மொழிபெயர்க்கப்பட்டது.
  alternative: ‘தங்கள் ஆன்மாவை’ என மொழிபெயர்த்தல்.
  rationale: இங்கு உடல்–ஆன்மா வேறுபாடு பேசப்படவில்லை; மரணத்தை ஏற்கத் தயாராக இருந்ததே சூழல். ஆகவே ‘உயிர்’ என்பது தேவையற்ற மனித இயல்பியல் முடிவைத் திணிக்காமல் கருத்தைத் தெளிவாகக் கொடுக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘ஆட்டுக்குட்டியானவர்’ என்பது வெளிப்படுத்தின விசேஷத்தின் கிறிஸ்துவியல் பட்டமாகக் காக்கப்பட்டது. ‘சாட்சியின் செய்தி’ என்ற அமைப்பு λόγος மற்றும் μαρτυρία இரண்டையும் இயல்பான தமிழில் பிரதிபலிக்கிறது.
