id: REV.12.10
reference: Revelation 12:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα φωνὴν μεγάλην ἐν τῷ οὐρανῷ λέγουσαν· Ἄρτι ἐγένετο ἡ σωτηρία καὶ ἡ δύναμις καὶ ἡ βασιλεία τοῦ θεοῦ ἡμῶν καὶ ἡ ἐξουσία τοῦ χριστοῦ αὐτοῦ, ὅτι ἐβλήθη ὁ ⸀κατήγωρ τῶν ἀδελφῶν ἡμῶν, ὁ κατηγορῶν ⸀αὐτοὺς ἐνώπιον τοῦ θεοῦ ἡμῶν ἡμέρας καὶ νυκτός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/010.yaml
  text: And I heard a loud voice in heaven saying[a], “Now have come the salvation and the power and the kingdom of our God, and the authority of his Messiah, because the accuser of our brothers has been thrown down[b], the one who accuses them before our God day and night.”
translation:
  language: ta
  text: 'நான் பரலோகத்தில் உரத்த குரல் ஒன்று இப்படிச் சொல்வதைக் கேட்டேன்: “இப்போது நம் கடவுளின் மீட்பும் வல்லமையும் அரசாட்சியும், அவருடைய மெசியாவின்[a] அதிகாரமும் வந்துவிட்டன. ஏனெனில், நம் சகோதரர்கள்மேல்[b] குற்றஞ்சாட்டுகிறவன் கீழே எறியப்பட்டான்; அவனே இரவும் பகலும் நம் கடவுளின் முன்னிலையில் அவர்கள்மேல் குற்றஞ்சாட்டுகிறவன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மெசியா’ என்பதற்கு ‘கிறிஸ்து’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் Χριστός (கிறிஸ்தோஸ்); இது கடவுளால் அபிஷேகம் செய்யப்பட்டவர் என்ற பட்டம்.
    reason: alternative_reading
  - marker: b
    text: ‘சகோதரர்கள்’ என்பது இங்கு ஆண்களையும் பெண்களையும் உள்ளடக்கிய சக விசுவாசிகளை கூட்டாகக் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: φωνὴν μεγάλην
  choice: உரத்த குரல்
  rationale: φωνή உடன் μέγας குரலின் ஒலி அளவைக் குறிக்கிறது; இயல்பான நவீனத் தமிழில் ‘உரத்த குரல்’ தெளிவாக உள்ளது.
- source_word: Ἄρτι ἐγένετο
  choice: இப்போது ... வந்துவிட்டன
  rationale: Ἄρτι தீர்மானமான தற்போதைய தருணத்தையும், ἐγένετο நிகழ்ந்து நிலைபெற்ற விளைவையும் சுட்டுகிறது; கூட்டு எழுவாய்க்கேற்ப தமிழில் பன்மை வினை இயல்பாகிறது.
- source_word: ἡ σωτηρία
  choice: மீட்பு
  rationale: இச்சூழலில் σωτηρία கடவுளுடைய வெற்றியால் நிகழும் விடுதலை/இரட்சிப்பைக் குறிக்கிறது; ‘மீட்பு’ பொதுவாசகருக்கு இயல்பாகவும் பரந்த பொருளைத் தக்கவைத்தும் உள்ளது.
- source_word: ἡ δύναμις
  choice: வல்லமை
  rationale: வெற்றியில் வெளிப்படும் கடவுளின் செயலாற்றும் சக்தியைச் சுட்டுகிறது; தொடர்ந்து வரும் ἐξουσία என்பதிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: ἡ βασιλεία τοῦ θεοῦ ἡμῶν
  choice: நம் கடவுளின் அரசாட்சி
  rationale: βασιλεία இடத்தைக் காட்டிலும் அரசரின் ஆட்சி அல்லது ஆளுகையை இங்கு முன்னிறுத்துகிறது; ‘அரசாட்சி’ அந்த இயக்கமுள்ள பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἡ ἐξουσία
  choice: அதிகாரம்
  rationale: δύναμις என்ற வல்லமையிலிருந்து வேறுபட்டு, உரிமையுள்ள ஆளுகை அதிகாரத்தை நேரடியாகக் குறிக்கிறது.
- source_word: τοῦ χριστοῦ αὐτοῦ
  choice: அவருடைய மெசியாவின்
  rationale: Χριστός இங்கு கடவுளால் அபிஷேகம் செய்யப்பட்ட ஆட்சியாளர் என்ற பட்டமாகச் செயல்படுகிறது; ‘மெசியா’ அந்தப் பட்டத்தையும் அதன் யூதப் பின்னணியையும் காக்கிறது.
- source_word: κατήγωρ / κατηγορῶν
  choice: குற்றம் சுமத்துகிறவன் / குற்றம் சுமத்திக்கொண்டிருந்தவன்
  rationale: நீதிமன்றத் தொனியுள்ள ‘குற்றஞ்சாட்டுபவன்’ என்ற பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; பெயர்ச்சொல் மற்றும் தொடர்புடைய வினைச்சொல் இடையிலான மீளுரைப்பையும் காக்கிறது.
- source_word: ἐβλήθη
  choice: கீழே எறியப்பட்டான்
  rationale: செயப்பாட்டு வடிவத்தையும் வலுக்கட்டாயமான வீழ்த்துதலையும் காக்கிறது; அதிகாரத்தின் இடத்திலிருந்து அகற்றப்பட்டதோடு கீழ்நோக்கிய இயக்கத்தையும் சூழல் உணர்த்துகிறது.
- source_word: ἡμέρας καὶ νυκτός
  choice: இரவும் பகலும்
  rationale: இடைவிடாத செயலைக் குறிக்கும் இயல்பான தமிழ் மரபுத்தொடர்; கிரேக்கத்தின் ‘பகலும் இரவும்’ என்ற வரிசை தமிழின் வழக்கமான ஓட்டத்திற்காக மாற்றப்பட்டுள்ளது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு சொல் தனிப்பெயராக அல்ல, கடவுளுடைய அபிஷேகம் பெற்ற ஆட்சியாளரின் பட்டமாக உள்ளது. ‘மெசியா’ பட்டத்தின் பொருள் மற்றும் எதிர்பார்ப்பைத் தக்கவைக்கிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἀδελφῶν என்பதன் பாலின மற்றும் சமூக வரம்பு
  choice: சகோதரர்கள்
  alternative: சகோதர சகோதரிகள் / சக விசுவாசிகள்
  rationale: கிரேக்க ஆண்பால் பன்மை வடிவத்துடன் நெருக்கமாக ‘சகோதரர்கள்’ வைக்கப்படுகிறது; ஆனால் சூழலில் அது பெண்களும் ஆண்களும் அடங்கிய சக விசுவாசிகளைக் கூட்டாகக் குறிக்கக்கூடும் என்பதால் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- issue: ἐγένετο என்பதன் காலநிலை மற்றும் நிறைவு
  choice: வந்துவிட்டன
  alternative: வந்தன / ஏற்பட்டன
  rationale: பரலோக அறிவிப்பில் தீர்மானமான வெற்றி நிகழ்ந்து அதன் விளைவு நிலவுகிறது என்ற நுணுக்கத்தை ‘வந்துவிட்டன’ வெளிப்படுத்துகிறது; முழுமையான இறுதிநிறைவை அதற்கு மேல் விளக்கிச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், வெளிப்படுத்தின விசேஷத்தின் பரலோக அறிவிப்பு மற்றும் நீதிமன்றத் தொனியைத் தக்கவைக்கும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘மீட்பு—வல்லமை—அரசாட்சி—அதிகாரம்’ என்ற சொல்லடுக்கின் வேறுபாடுகள் பாதுகாக்கப்பட்டுள்ளன; நீண்ட கிரேக்க வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாக அமைக்கப்பட்டுள்ளது.
