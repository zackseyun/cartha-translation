source:
  edition: SBLGNT
  text: καὶ ἔβαλεν ὁ ὄφις ἐκ τοῦ στόματος αὐτοῦ ὀπίσω τῆς γυναικὸς ὕδωρ ὡς ποταμόν, ἵνα αὐτὴν ποταμοφόρητον ποιήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/015.yaml
  text: And the serpent hurled water like a river out of his mouth after the woman[b][a], so that he might cause her to be swept away by the river.
translation:
  language: ta
  text: 'பாம்பு தன் வாயிலிருந்து ஆற்றைப் போன்ற தண்ணீரை அந்தப் பெண்ணைத் துரத்தி[a] வீசியது; அவளை ஆறு அடித்துக்கொண்டு போகச் செய்யும்படி[b].


    [a] அல்லது, “அந்தப் பெண்ணுக்குப் பின்னால்.” கிரேக்கச் சொற்றொடர் ஓர் இடத்தைக் குறிப்பதாகவோ, அவளைப் பின்தொடர்ந்து தாக்குவதைக் குறிப்பதாகவோ இருக்கலாம்.


    [b] நேரடியாக, “அவளை ஆற்றால் எடுத்துச் செல்லப்படுகிறவளாக்கும்படி.” அதாவது, அவளை ஆறு அடித்துக்கொண்டு போகச் செய்வதற்காக.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்தப் பெண்ணுக்குப் பின்னால்.” கிரேக்கச் சொற்றொடர் ஓர் இடத்தைக் குறிப்பதாகவோ, அவளைப் பின்தொடர்ந்து தாக்குவதைக் குறிப்பதாகவோ இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “அவளை ஆற்றால் எடுத்துச் செல்லப்படுகிறவளாக்கும்படி.” அதாவது, அவளை ஆறு அடித்துக்கொண்டு போகச் செய்வதற்காக.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλεν
  choice: வீசியது
  rationale: βάλλω என்பதன் ‘எறிதல்/வீசுதல்’ என்ற வலிமையான செயலைக் காக்கிறது; பாம்பின் பகைமையான தாக்குதலுக்கும் பொருந்துகிறது.
- source_word: ὁ ὄφις
  choice: பாம்பு
  rationale: ὄφις என்பதற்கான இயல்பான தமிழ் சொல்; வேதாகமச் சூழலிலுள்ள குறியீட்டு ஒலிவையும் தக்கவைக்கிறது.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: தன் வாயிலிருந்து
  rationale: கிரேக்க முன்னிடைச் சொற்றொடரைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ὀπίσω τῆς γυναικός
  choice: அவளைப் பின்தொடர்ந்து
  rationale: ὀπίσω + மரபுவேற்றுமை இடவகையில் ‘பின்னால்’ என்றும், பின்தொடர்தல் என்ற இயக்கப் பொருளிலும் வரலாம். தாக்குதல் சூழலில் பின்தொடர்தல் இயல்பானது; இடவகை மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ὕδωρ ὡς ποταμόν
  choice: ஆற்றைப் போன்ற தண்ணீர்
  rationale: ὡς குறிக்கும் உவமையையும் ποταμός குறிக்கும் ஆறு என்ற படிமத்தையும் நேரடியாகக் காக்கிறது; ‘வெள்ளம்’ என்று விளக்கமாக மாற்றவில்லை.
- source_word: ἵνα
  choice: —படி
  rationale: நோக்கம் அல்லது எதிர்பார்க்கப்பட்ட விளைவைச் சுட்டும் ἵνα தொடரை இயல்பான தமிழில் நோக்கவினை அமைப்பாகத் தருகிறது.
- source_word: ποταμοφόρητον ποιήσῃ
  choice: ஆறு அடித்துக்கொண்டு போகும்படி
  rationale: அரிதான ποταμοφόρητος என்ற சொல்லின் ‘ஆற்றால் கொண்டுசெல்லப்படுதல்’ என்னும் பொருளையும் ποιέωவின் காரணவினைப் பொருளையும் இயல்பான தமிழில் காக்கிறது; ‘மூழ்கடித்தல்’ அல்லது ‘கொல்லுதல்’ என்று மிகைப்படுத்தவில்லை.
theological_decisions:
- issue: பாம்பின் தாக்குதலைக் குறிக்கும் வெளிப்படுத்தின விசேஷத்தின் குறியீட்டுப் படிமம்
  choice: ‘ஆற்றைப் போன்ற தண்ணீர்’ என்றும் ‘ஆறு அடித்துக்கொண்டு போகும்படி’ என்றும் மூலப் படிமத்தையே வைத்திருத்தல்
  alternative: தண்ணீரை படைகள், துன்புறுத்தல், பொய்கள் அல்லது குழப்பம் என்று முதன்மை உரையிலேயே விளக்குதல்
  rationale: மூலவசனம் குறியீட்டுப் படிமத்தைத் தருகிறது; அதன் குறிப்பிட்ட விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்ப்பது உண்மையான விளக்கத் திறப்பைக் குறைக்கும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. வெளிப்படுத்தின விசேஷத்தின் உயிரோட்டமான படிமம் காக்கப்பட்டுள்ளது; அரிதான கிரேக்கக் கூட்டுச்சொல்லின் மரப்பான நேரடி வடிவம் முதன்மை உரையில் தவிர்க்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
