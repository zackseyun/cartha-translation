review_pass:
  verdict: revise
  source_fidelity: The draft retains the principal images and the causative force of ποταμοφόρητον ποιήσῃ. However, its initial word order foregrounds the purpose clause and makes the action sequence unnecessarily difficult; moreover, ‘அவளைப் பின்தொடர்ந்து’ can grammatically describe the serpent rather than the water. The revision makes the directed/pursuit sense explicit while retaining the spatial alternative in a footnote.
  naturalness: 'The revised sentence follows natural modern Tamil order: subject, source, object, action, then purpose. ‘அவளை ஆறு அடித்துக்கொண்டு போகச் செய்யும்படி’ is clear and preserves the intended causative sense more naturally than ‘ஆறு அடித்துக்கொண்டு போகும்படி.’'
  terminology: ‘பாம்பு,’ ‘தன் வாயிலிருந்து,’ and ‘ஆற்றைப் போன்ற தண்ணீர்’ are suitable, dignified modern Tamil equivalents. The rare river-carried expression is represented idiomatically in the text and explained without adding an interpretation of the apocalyptic imagery.
  issues:
  - severity: medium
    issue: The main clause begins with the purpose clause and leaves the agent/action until later.
    rationale: This is grammatically possible but markedly less natural in modern Tamil and initially obscures who acts and what is hurled.
  - severity: medium
    issue: ‘அவளைப் பின்தொடர்ந்து’ is syntactically capable of modifying ‘பாம்பு’ rather than the hurled water.
    rationale: The Greek phrase is associated with the water being cast after/behind the woman. ‘அந்தப் பெண்ணைத் துரத்தி’ communicates the contextual directional sense clearly; the spatial reading remains in the footnote.
  - severity: medium
    issue: ‘ஆறு அடித்துக்கொண்டு போகும்படி’ does not explicitly express ποιήσῃ, “make/cause.”
    rationale: Adding ‘செய்யும்படி’ preserves the Greek causative construction while remaining idiomatic.
