  text: καὶ ἐκράτησεν τὸν δράκοντα, ⸂ὁ ὄφις ὁ ἀρχαῖος⸃, ὅς ἐστιν Διάβολος καὶ ὁ ⸀Σατανᾶς, καὶ ἔδησεν αὐτὸν χίλια ἔτη,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/002.yaml
  text: And he seized the dragon—that ancient serpent[a], who is the Devil and Satan—and bound him for a thousand years,
translation:
  language: ta
  text: அவன் அந்த வலுசர்ப்பத்தை—பிசாசும் சாத்தானுமான அந்த ஆதிகாலத்துப் பாம்பை[a]—பிடித்து, அவனை ஆயிரம் ஆண்டுகளுக்குக் கட்டிவைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அந்தப் பழங்காலத்துப் பாம்பை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκράτησεν
  choice: பிடித்து
  rationale: இங்கு κρατέω வலுவாகப் பற்றிக்கொள்ளுதல் அல்லது கைப்பற்றுதல் என்ற தீர்மானமான செயலைக் குறிக்கிறது. ‘பிடித்து’ என்பது இயல்பான தமிழில் அந்தச் செயலின் வலிமையைத் தக்கவைக்கிறது.
- source_word: δράκοντα
  choice: வலுசர்ப்பத்தை
  rationale: வெளிப்படுத்தின விசேஷத்தின் பேரழிவுத் தன்மையுள்ள δράκων உருவகத்தையும் நூலுக்குள் அதன் தொடர்ச்சியையும் காக்கும் மரபுநிலையான, புரிந்துகொள்ளத்தக்க தமிழ்ச் சொல்.
- source_word: ὁ ὄφις ὁ ἀρχαῖος
  choice: அந்த ஆதிகாலத்துப் பாம்பை
  rationale: இது வலுசர்ப்பத்தை விளக்கும் இணைப்பெயர். ἀρχαῖος என்பதன் தொன்மை/ஆதிகாலத் தொடர்பை ‘ஆதிகாலத்து’ தெளிவாகக் காட்டுகிறது; ‘அந்த’ என்பது முன்பே அறியப்பட்ட பாம்பைச் சுட்டும் கட்டுரைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Διάβολος
  choice: பிசாசு
  rationale: Διάβολος என்பதற்கான வழக்கமான தமிழ்ப் பெயர்; இங்கு சாத்தானுடன் ஒரே நபரை அடையாளப்படுத்தும் விதத்தில் தரப்பட்டுள்ளது.
- source_word: Σατανᾶς
  choice: சாத்தான்
  rationale: தனிப்பெயர்/பட்டத்தின் நிலையான தமிழ் ஒலிபெயர்ப்பு.
- source_word: ἔδησεν
  choice: கட்டிவைத்தான்
  rationale: δέω என்பதன் நேரடியான கட்டுதல் உருவகத்தைத் தக்கவைக்கிறது; கட்டுப்பாட்டின் தன்மையை மேலதிகமாக விளக்காமல் விடுகிறது.
- source_word: χίλια ἔτη
  choice: ஆயிரம் ஆண்டுகளுக்கு
  rationale: கால நீட்சியைக் குறிக்கும் குற்றுவேற்றுமையை இயல்பான தமிழில் தருகிறது; காலம் சொல்லப்பட்டபடியே வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: ஆயிரம் ஆண்டுகளின் இயல்பு
  choice: ‘ஆயிரம் ஆண்டுகள்’ என்று நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: அதைச் சொற்பொருளான காலமாகவோ அடையாளக் காலமாகவோ மொழிபெயர்ப்பிலேயே விளக்குவது.
  rationale: இக்காலம் சொற்பொருளா, அடையாளமா என்ற ஆயிரமாண்டு ஆட்சியைச் சார்ந்த விவாதத்தை மொழிபெயர்ப்பு தீர்மானிக்காமல், மூலத்தின் சொல்லையும் இறையியல் பதற்றத்தையும் காக்கிறது.
- issue: வலுசர்ப்பத்தின் அடையாளம்
  choice: வலுசர்ப்பம், ஆதிகாலத்துப் பாம்பு, பிசாசு, சாத்தான் என்ற முழு அடையாளச் சங்கிலி தக்கவைக்கப்பட்டது.
  alternative: அனைத்தையும் ‘சாத்தான்’ என்ற ஒரே பெயராகச் சுருக்குவது.
  rationale: வசனமே இவ்வெல்லாப் பெயர்களாலும் ஒரே நபரை வெளிப்படையாக அடையாளப்படுத்துவதால் எந்தப் பெயரும் நீக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. இடைச்செருகல் அடையாளத்தைத் தெளிவுபடுத்த நீண்ட கோடுகள் பயன்படுத்தப்பட்டுள்ளன; ‘பிசாசும் சாத்தானுமான’ என்பது இரு பட்டங்களும் ஒரே நபரைக் குறிப்பதை இயல்பாகக் காட்டுகிறது.
