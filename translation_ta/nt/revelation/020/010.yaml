id: REV.20.10
reference: Revelation 20:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὁ διάβολος ὁ πλανῶν αὐτοὺς ἐβλήθη εἰς τὴν λίμνην τοῦ πυρὸς καὶ θείου, ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης, καὶ βασανισθήσονται ἡμέρας καὶ νυκτὸς εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/010.yaml
  text: And the devil[a], who was deceiving them, was thrown into the lake of fire and sulfur, where also the beast and the false prophet are[b], and they will be tormented day and night forever and ever.
translation:
  language: ta
  text: அவர்களை ஏமாற்றிக்கொண்டிருந்த பிசாசு, நெருப்பும் கந்தகமும் உள்ள ஏரியில்[a] எறியப்பட்டான்; அங்கே மிருகமும் பொய்த்தீர்க்கதரிசியும் இருக்கிறார்கள். பிசாசும் மிருகமும் பொய்த்தீர்க்கதரிசியும் பகலும் இரவும் என்றென்றைக்கும்[b] வேதனைக்குள்ளாக்கப்படுவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்குச் சொல்லாக: ‘நெருப்பு மற்றும் கந்தகத்தின் ஏரி.’'
    reason: lexical_alternative
  - marker: b
    text: 'கிரேக்கத்தில்: ‘காலங்களின் காலங்கள்வரை’; முடிவில்லாத காலநீட்சியைக் குறிக்கும் மரபுத்தொடர்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διάβολος
  choice: பிசாசு
  rationale: வெளிப்படுத்தின விசேஷத்தில் இது சாத்தானைக் குறிக்கும் நிலைபெற்ற தனிப்பெயர்போன்ற அடையாளமாக வருகிறது; நவீனத் தமிழில் தெளிவான, வழக்கமான இணைச்சொல்.
- source_word: ὁ πλανῶν αὐτοὺς
  choice: அவர்களை ஏமாற்றிக்கொண்டிருந்த
  rationale: பெயர்ச்சொல்லாக்கப்பட்ட நிகழ்காலப் பங்கேற்புவினையின் தொடர்ச்சியான செயலை, கதை நிகழ்வின் காலநிலையோடு இணைத்து வெளிப்படுத்துகிறது.
- source_word: ἐβλήθη
  choice: எறியப்பட்டான்
  rationale: பலவந்தமாகத் தண்டனைக்குரிய இடத்தில் வீசப்பட்டதைக் குறிக்கும் இறந்தகாலச் செயப்பாட்டு வடிவத்தை இயல்பான தமிழில் தருகிறது.
- source_word: λίμνην τοῦ πυρὸς καὶ θείου
  choice: நெருப்பும் கந்தகமும் உள்ள ஏரி
  rationale: πῦρ மற்றும் θεῖον ஆகியவற்றை முறையே ‘நெருப்பு’, ‘கந்தகம்’ என்று நேரடியாகக் கொடுத்து, உருவகக் காட்சியைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης
  choice: அங்கே மிருகமும் பொய்த்தீர்க்கதரிசியும் இருக்கிறார்கள்
  rationale: கிரேக்கத்தில் வினைச்சொல் வெளிப்படையாக இல்லாததால் தமிழில் இயல்புக்காக ‘இருக்கிறார்கள்’ சேர்க்கப்பட்டுள்ளது; முந்தைய சூழலில் தொடங்கிய அவர்களுடைய தொடர்ந்திருக்கும் நிலையையும் இது பிரதிபலிக்கிறது.
- source_word: βασανισθήσονται
  choice: வேதனைக்குள்ளாக்கப்படுவார்கள்
  rationale: கடுமையான வேதனையைச் சுட்டும் எதிர்காலச் செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது; வேதனை அளிக்கப்படும் முறையைத் தேவையின்றி குறிப்பாக்கவில்லை.
- source_word: ἡμέρας καὶ νυκτός
  choice: பகலும் இரவும்
  rationale: இடைவிடாத தொடர்ச்சியைக் குறிக்கும் இயல்பான தமிழ் மரபுத்தொடர்.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: என்றென்றைக்கும்
  rationale: முடிவில்லாத காலநீட்சியை வலியுறுத்தும் கிரேக்க மரபுத்தொடரின் இயல்பான, வலுவான தமிழ் இணை.
theological_decisions:
- issue: εἰς τοὺς αἰῶνας τῶν αἰώνων கூறும் இறுதித் தண்டனையின் காலநீட்சி
  choice: என்றென்றைக்கும்
  alternative: காலங்களின் காலங்கள்வரை
  rationale: கிரேக்கச் சொற்றொடரின் வலியுறுத்தப்பட்ட, முடிவில்லாத காலநீட்சியை இயல்பான தமிழில் தருகிறது; இவ்வசனத்திற்கு அப்பாற்பட்ட கோட்பாட்டு விவாதங்களைத் தீர்மானிக்க முயலவில்லை.
- issue: ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης என்பதில் வெளிப்படையாக இல்லாத வினைச்சொல்
  choice: இருக்கிறார்கள்
  alternative: இருந்தார்கள்
  rationale: கிரேக்கத்தில் வினைச்சொல் விடுபட்டுள்ளது. வெளிப்படுத்தின விசேஷம் 19:20-ன் உடனடி இலக்கியச் சூழலின்படி அவர்கள் அங்கே தொடர்ந்து இருப்பதைக் காட்ட நிகழ்காலம் பொருத்தமானது; இது இலக்கண நிறைவேற்றமே அன்றி கூடுதல் கோட்பாட்டுக் கூற்று அல்ல.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் வெளிப்படுத்தின விசேஷத்தின் கம்பீரமான நியாயத்தீர்ப்புத் தொனியைப் பாதுகாக்கும் வகையிலும் மொழியாக்கப்பட்டுள்ளது. கிரேக்கத்தின் நீண்ட வாக்கியம் தமிழில் தெளிவுக்காக அரைப்புள்ளி மற்றும் முற்றுப்புள்ளியால் ஒழுங்குபடுத்தப்பட்டுள்ளது.
