source:
  edition: SBLGNT
  text: καὶ ὁ θάνατος καὶ ὁ ᾅδης ἐβλήθησαν εἰς τὴν λίμνην τοῦ πυρός. οὗτος ὁ ⸂θάνατος ὁ δεύτερός⸃ ἐστιν, ἡ λίμνη τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/014.yaml
  text: And Death and Hades were thrown into the lake of fire. This is the second death[a], the lake of fire.
translation:
  language: ta
  text: மரணமும் பாதாளமும்[a] நெருப்பு ஏரிக்குள் எறியப்பட்டன. இதுவே இரண்டாம் மரணம்—நெருப்பு ஏரி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கச் சொல் ‘ஹாதேஸ்’; இது இறந்தோரின் உலகைக் குறிக்கிறது. ‘இறந்தோர் உலகம்’ அல்லது சில சூழல்களில் ‘கல்லறை’ என்றும் மொழிபெயர்க்கப்படுகிறது. இங்கே இது ‘நெருப்பு ஏரி’ என்பதிலிருந்து வேறுபடுத்தப்படுவதால், ‘நரகம்’ என்பது தவறாகப் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: θάνατος
  choice: மரணம்
  rationale: முதல் வாக்கியத்தில் பாதாளத்துடன் இணைந்து ஓர் ஆளுருவாக்கப்பட்ட சக்திபோல் சித்தரிக்கப்படுவதையும், பின்னர் ‘இரண்டாம் மரணம்’ என்ற வெளிப்பாட்டில் தீர்ப்பின் பெயராக வருவதையும் ஒரே இயல்பான தமிழ்ச் சொல்லால் தக்கவைக்கிறது. தமிழில் பெரிய எழுத்து வேறுபாடு இல்லாததால் ஆளுருவாக்கம் சூழலால் வெளிப்படுகிறது.
- source_word: ᾅδης
  choice: பாதாளம்
  rationale: இறந்தோரின் உலகைக் குறிக்கும் கிரேக்கச் சொல்லை, இங்கே அதிலிருந்து வேறுபடுத்தப்படும் ‘நெருப்பு ஏரி’ என்பதுடன் ஒன்றாக்காமல் வழங்குகிறது. ‘நரகம்’ என்பது இறுதித் தண்டனையுடன் தவறாகக் கலக்கக்கூடும்.
- source_word: ἐβλήθησαν
  choice: எறியப்பட்டன
  rationale: βάλλω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவத்தையும் வலுக்கட்டாயமாக வீசப்படுதல் என்ற படிமத்தையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: λίμνη τοῦ πυρός
  choice: நெருப்பு ஏரி
  rationale: மூலத்தின் உரிமைத் தொடர்புடைய சொற்றொடரைச் சுருக்காமல், வெளிப்படுத்தல் நூலின் நிலையான படிமமாகத் தெளிவாகத் தருகிறது.
- source_word: οὗτος
  choice: இதுவே
  rationale: சுட்டுப்பெயரையும் அடையாளப்படுத்தும் வலியுறுத்தலையும் காக்கிறது; ‘இதன் பொருள்’ என்று விளக்கவுரையாக்கவில்லை.
- source_word: θάνατος ὁ δεύτερος
  choice: இரண்டாம் மரணம்
  rationale: வெளிப்படுத்தல் நூலில் வரும் குறிப்பிட்ட முடிவுக்கால வெளிப்பாட்டை இயல்பான தமிழ் வரிசையில் தக்கவைக்கிறது.
- source_word: ἡ λίμνη τοῦ πυρός
  choice: நெருப்பு ஏரி
  rationale: மூலத்தில் மீண்டும் வரும் சொற்றொடரை மீண்டும் வழங்கி, அது ‘இரண்டாம் மரணம்’ என்பதற்கு விளக்க இணைப்பாக நிற்பதைப் பாதுகாக்கிறது.
theological_decisions:
- issue: முடிவுக்காலத் தீர்ப்பின் சூழலில் ᾅδης என்பதன் மொழிபெயர்ப்பு
  choice: பாதாளம்
  alternative: நரகம்; இறந்தோர் உலகம்; கல்லறை
  rationale: இவ்வசனம் பாதாளத்தையும் நெருப்பு ஏரியையும் தனித்தனியாகக் குறிப்பிடுகிறது. ‘நரகம்’ என்று மொழிபெயர்த்தால் அந்த இரு படிமங்களும் ஒன்றாகக் கலந்துவிடக்கூடும்; ‘பாதாளம்’ வேறுபாட்டையும் மூலத்தின் கருத்துத் திறப்பையும் காக்கிறது.
- issue: θάνατος என்பதன் ஆளுருவாக்கம்
  choice: முதல் வாக்கியத்தில் சூழல் வழியாக ஆளுருவாக்கத்தை வெளிப்படுத்தி, இரண்டாவது வாக்கியத்தில் ‘இரண்டாம் மரணம்’ என வழங்குதல்
  alternative: ‘மரணன்’ என்று வெளிப்படையாக ஆளுருவாக்குதல்; இரு இடங்களிலும் வெறும் நிலையாக மட்டும் வாசித்தல்
  rationale: முதல் இடத்தில் மரணமும் பாதாளமும் எறியப்படும் கூறுகளாக வருகின்றன; ஆனால் ‘மரணன்’ என்பது மூலத்தில் இல்லாத பாலின/தெய்வ உருவகத்தைச் சேர்க்கும். தமிழில் எழுத்தின் பெரிதாக்கத்தால் வேறுபடுத்த இயலாததால், சூழல் இலக்கிய ஆளுருவாக்கத்தைத் தாங்குகிறது.
- issue: இரண்டாம் மரணத்துக்கும் நெருப்பு ஏரிக்கும் இடையிலான தொடர்பு
  choice: ‘இதுவே இரண்டாம் மரணம்—நெருப்பு ஏரி’ என்ற விளக்க இணைப்பு
  alternative: ‘நெருப்பு ஏரியே இரண்டாம் மரணம்’; ‘இதன் பொருள் இரண்டாம் மரணம்’
  rationale: கிரேக்கத்தில் வரும் சமன்பாட்டு வாக்கியத்தையும் பின்னர் வரும் பெயரிணை விளக்கத்தையும் தக்கவைக்கிறது; காரணவியல் அல்லது விரிவான கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘நெருப்பு ஏரி’ என்ற வெளிப்படுத்தல் நூலின் படிமம் மாற்றமின்றி வைக்கப்பட்டுள்ளது. இறுதி சொற்றொடரின் பெயரிணை விளக்க உறவை நீண்ட கோடு தெளிவாக்குகிறது; மூலத்தில் இல்லாத கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
