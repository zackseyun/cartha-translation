id: REV.20.11
reference: Revelation 20:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ εἶδον θρόνον μέγαν λευκὸν καὶ τὸν καθήμενον ⸂ἐπ’ αὐτοῦ⸃, οὗ ἀπὸ ⸀τοῦ προσώπου ἔφυγεν ἡ γῆ καὶ ὁ οὐρανός, καὶ τόπος οὐχ εὑρέθη αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/011.yaml
  text: And I saw a great white throne and the one seated on it[a], from whose presence the earth and heaven fled, and no place was found for them.
translation:
  language: ta
  text: நான் ஒரு பெரிய வெள்ளைச் சிங்காசனத்தையும், அதன்மேல் அமர்ந்திருப்பவரையும் கண்டேன். அவருடைய முன்னிலையிலிருந்து[a] பூமியும் வானமும் தப்பியோடின; அவற்றுக்கு இடமே காணப்படவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, நேரடியாக, ‘அவருடைய முகத்திலிருந்து.’
    reason: πρόσωπον என்பதன் நேரடிப் பொருள் ‘முகம்’; ஆனால் ἀπὸ τοῦ προσώπου என்னும் இத்தொடர் இச்சூழலில் ஒருவருடைய முன்னிலையிலிருந்து விலகுதலைக் குறிக்கிறது.
lexical_decisions:
- source_word: θρόνον μέγαν λευκὸν
  choice: பெரிய வெள்ளைச் சிங்காசனம்
  rationale: கிரேக்கப் பெயரடைத் தொடரின் பொருளை இயல்பான தமிழ் வரிசையில் தருகிறது; μέγαν என்பதன் அளவும் மேன்மையும் ‘பெரிய’ என்பதில் தக்கவைக்கப்படுகின்றன.
- source_word: τὸν καθήμενον ἐπ’ αὐτοῦ
  choice: அதன்மேல் அமர்ந்திருந்தவர்
  rationale: சிங்காசன உருவகத்துக்கு ஏற்ற இயல்பான மரியாதைத் தமிழ்; அமர்ந்திருப்பவரின் அடையாளத்தை வசனம் கூறாதபடியே குறிப்பிடுகிறது.
- source_word: ἀπὸ τοῦ προσώπου
  choice: அவருடைய திருமுகத்திலிருந்து
  rationale: πρόσωπον என்பதன் நேரடிப் பொருளான ‘முகம்’ என்பதைப் பாதுகாத்து, சிங்காசனத்தில் அமர்ந்திருப்பவருக்குரிய மரியாதையை ‘திருமுகம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἔφυγεν
  choice: தப்பியோடின
  rationale: φεύγω என்பதன் உயிரோட்டமுள்ள ஓடிப்போதல்/தப்பிச் செல்லுதல் உருவகத்தை ‘மறைந்தன’ என்று விளக்கிவிடாமல் காக்கிறது.
- source_word: ἡ γῆ καὶ ὁ οὐρανός
  choice: பூமியும் வானமும்
  rationale: இரு ஒருமைப் பெயர்களையும் தமிழின் இணைப்பும்மை அமைப்பில் இயல்பாகவும் துல்லியமாகவும் வழங்குகிறது.
- source_word: τόπος οὐχ εὑρέθη αὐτοῖς
  choice: அவற்றுக்கு இடமே காணப்படவில்லை
  rationale: கிரேக்கத்தின் செயப்பாட்டு அமைப்பைத் தக்கவைக்கிறது; ‘இடமே’ என்பது மறுப்பின் முழுமையை இயல்பான தமிழில் வலியுறுத்துகிறது.
theological_decisions:
- issue: சிங்காசனத்தில் அமர்ந்திருப்பவரின் அடையாளம்
  choice: ‘அதன்மேல் அமர்ந்திருந்தவர்’ என்று அடையாளத்தை மறைமுகமாகவே வைத்தல்
  alternative: அவரை தேவன், பிதா அல்லது மேசியா என்று வெளிப்படையாக அடையாளப்படுத்துதல்
  rationale: இவ்வசனம் அமர்ந்திருப்பவரைப் பெயரிட்டு அடையாளப்படுத்தவில்லை; ஆகவே மூலத்தின் இறையியல் இடைவெளியும் பதற்றமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வெளிப்பாடு. ‘சிங்காசனம்’, ‘திருமுகம்’ ஆகியவை வெளிப்படுத்தல் நூலின் பேரரசர்சார் மற்றும் தரிசனத் தொனியைப் பேணுகின்றன; வாக்கியத்தைத் தமிழில் தெளிவாக்க இரண்டு வாக்கியங்களாக அமைத்துள்ளோம்.
