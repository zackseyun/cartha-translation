reference: Revelation 20:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἄγγελον καταβαίνοντα ἐκ τοῦ οὐρανοῦ, ἔχοντα τὴν κλεῖν τῆς ἀβύσσου καὶ ἅλυσιν μεγάλην ἐπὶ τὴν χεῖρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/001.yaml
  text: And I saw an angel coming down from heaven[a], holding the key to the abyss and a great chain in his hand.
translation:
  language: ta
  text: மேலும், வானத்திலிருந்து இறங்கி வந்த ஒரு தேவதூதனை நான் கண்டேன். அவன் ஆழ்குழியின்[a] திறவுகோலையும் ஒரு பெரிய சங்கிலியையும் தன் கையில் வைத்திருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அடித்தளமற்ற குழி.” கிரேக்கத்தில், “ஆழ்குழி.”
    reason: ἄβυσσος என்பதற்கான பாரம்பரிய விளக்கமளிக்கும் மாற்று மொழிபெயர்ப்பைக் காட்டுவதற்காக; முதன்மை உரை கிரேக்கச் சொல்லின் ஆழம் சார்ந்த உருவகத்தை நேரடியாகக் காக்கிறது.
lexical_decisions:
- source_word: Καὶ
  choice: பின்பு
  rationale: தரிசனக் காட்சியின் அடுத்த நிகழ்வை இயல்பான தமிழில் இணைக்கிறது; கிரேக்க இணைப்புச் சொல்லின் தொடர்ச்சியையும் காக்கிறது.
- source_word: εἶδον
  choice: நான் கண்டேன்
  rationale: தரிசன விவரிப்பில் ὁράω என்பதன் இறந்தகால வடிவத்தை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἄγγελον
  choice: ஒரு தூதனை
  rationale: இச்சூழலில் விண்ணுலகத் தூதரையே குறிக்கிறது; பொதுவான செய்தியாளர் என்ற பொருள் இங்கு பொருந்தாது.
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: வானத்திலிருந்து இறங்கி வந்த
  rationale: இறங்கும் இயக்கத்தையும் அதன் தொடக்க இடத்தையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἔχοντα
  choice: வைத்திருந்தான்
  rationale: திறவுகோலும் சங்கிலியும் அவன் கையில் இருந்த காட்சியைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: τὴν κλεῖν τῆς ἀβύσσου
  choice: பாதாளத்தின் திறவுகோலை
  rationale: கிரேக்க உரையின் உடைமைத் தொடர்பைத் தக்கவைக்கிறது; ἄβυσσος குறிக்கும் ஆழ்ந்த அடைக்கப்பட்ட கீழுலக இடத்தைச் சுருக்கமாக அளிக்கிறது.
- source_word: ἅλυσιν μεγάλην
  choice: ஒரு பெரிய சங்கிலியை
  rationale: சங்கிலியின் பெருமை அல்லது அளவை மேலதிக விளக்கமின்றி நேரடியாகத் தருகிறது.
- source_word: ἐπὶ τὴν χεῖρα αὐτοῦ
  choice: தன் கையில்
  rationale: சொல்லுக்கு சொல் 'கையின்மேல்' என்பதைக் காட்டிலும் பொருளுக்கேற்ற இயல்பான தமிழ்; தூதன் அதைத் தாங்கியிருந்ததை உணர்த்துகிறது.
theological_decisions:
- issue: வெளிப்படுத்தின விசேஷத்தின் காட்சிச் சூழலில் ἄβυσσος என்பதன் மொழிபெயர்ப்பு
  choice: பாதாளம்
  alternative: அளவில்லா ஆழ்குழி
  rationale: ἄβυσσος என்பதன் ஆழமான கீழுலக இடம் என்ற கருத்தை நவீன வாசகர்களுக்குப் புரியும் தமிழில் தருகிறது. அதேவேளை கிரேக்கச் சொல்லில் வெளிப்படையாக இல்லாத 'அடிப்பகுதியற்றது' என்ற உருவகத்தை முதன்மை உரையில் கட்டாயப்படுத்தாமல், மாற்றை அடிக்குறிப்பில் வழங்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; தரிசன உரைக்கு ஏற்ற கண்ணியமான, எளிதில் புரியும் நடை. கிரேக்கத்தின் நீண்ட பங்கேற்பு அமைப்பு தமிழின் இயல்புக்கேற்ப இரண்டு வாக்கியங்களாக மாற்றப்பட்டுள்ளது.
