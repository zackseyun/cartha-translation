  text: ⸀οἱ λοιποὶ τῶν νεκρῶν οὐκ ἔζησαν ἄχρι τελεσθῇ τὰ χίλια ἔτη. αὕτη ἡ ἀνάστασις ἡ πρώτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/005.yaml
  text: The rest of the dead did not come to life until the thousand years were finished[a]. This is the first resurrection.
translation:
  language: ta
  text: இறந்தவர்களில் மற்றவர்கள், அந்த ஆயிரம் ஆண்டுகள் நிறைவடையும்வரை உயிர்பெறவில்லை.[a] இதுவே முதலாவது உயிர்த்தெழுதல்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த ஆயிரம் ஆண்டுகள் நிறைவடையும்வரை வாழவில்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ λοιποὶ τῶν νεκρῶν
  choice: இறந்தவர்களில் மீதியானவர்கள்
  rationale: முன்பு குறிப்பிடப்பட்ட குழுவுக்கு மாறாக எஞ்சிய இறந்தவர்களைக் குறிக்கும் தொடரின் கூட்டுப் பொருளையும் வேறுபாட்டையும் இயல்பான தமிழில் காக்கிறது.
- source_word: οὐκ ἔζησαν
  choice: உயிர்பெறவில்லை
  rationale: உயிர்த்தெழுதல் பற்றிய உடனடிச் சூழலில் ζάω வினையின் தொடக்கநிலைப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது; வெறுமனே ‘வாழவில்லை’ என்பதைக் காட்டிலும் உயிருக்கு வருதலைத் தெளிவாக்குகிறது.
- source_word: ἄχρι τελεσθῇ
  choice: நிறைவடையும்வரை
  rationale: ἄχρι குறிக்கும் கால எல்லையையும் τελεσθῇ என்பதன் நிறைவு அடையும் பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: τὰ χίλια ἔτη
  choice: அந்த ஆயிரம் ஆண்டுகள்
  rationale: ஏற்கெனவே சூழலில் குறிப்பிடப்பட்ட குறிப்பிட்ட ஆயிரம் ஆண்டுகளைக் கிரேக்க உரையின் சுட்டுத்தன்மைக்கு ஏற்பக் காட்டுகிறது.
- source_word: αὕτη
  choice: இதுவே
  rationale: முந்தைய சூழலில் விவரிக்கப்பட்ட நிகழ்வைச் சுட்டுகிறது; ‘வே’ என்பது தமிழ் வாக்கியத்தில் அடையாளப்படுத்தும் வலியுறுத்தலை இயல்பாகத் தருகிறது.
- source_word: ἡ ἀνάστασις ἡ πρώτη
  choice: முதலாவது உயிர்த்தெழுதல்
  rationale: ἀνάστασις என்பதற்கான நிலையான தமிழ் வேதாகமச் சொல்லையும் πρώτη குறிக்கும் வரிசையையும் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: ‘இதுவே முதலாவது உயிர்த்தெழுதல்’ என்பதன் சுட்டுப்பொருள்
  choice: ‘இதுவே’ என்ற பரந்த சுட்டை அப்படியே வைத்து, சூழலில் விவரிக்கப்பட்ட உயிர்த்தெழுதல் நிகழ்வைச் சுட்டுவதாக மொழிபெயர்க்கப்பட்டது.
  alternative: இது வசனம் 4-இன் உயிர்த்தியாகிகளை மட்டும் குறிக்கிறது; அல்லது நீதிமான்களான இறந்த அனைவரையும் குறிக்கிறது; அல்லது ஆவிக்குரிய உயிர்த்தெழுதலைக் குறிக்கிறது என்று வெளிப்படையாக விளக்குதல்.
  rationale: கிரேக்க உரை எந்த ஓர் ஆயிரமாண்டு காலக் கோட்பாட்டையும் வெளிப்படையாகத் தீர்மானிக்காமல் ‘இதுவே முதலாவது உயிர்த்தெழுதல்’ என்று கூறுகிறது; ஆகவே அதன் இறையியல் பதற்றமும் சுட்டின் பரப்பிலுள்ள தெளிவின்மையும் பாதுகாக்கப்படுகின்றன.
- issue: οὐκ ἔζησαν என்பதன் சூழல்சார் வலிமை
  choice: உயிர்த்தெழுதல் சூழலுக்கு ஏற்ப ‘உயிர்பெறவில்லை’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘வாழவில்லை’ அல்லது ‘ஆவிக்குரிய விதத்தில் உயிர்பெறவில்லை’.
  rationale: உடனடிச் சூழல் மரணத்திற்குப் பிந்தைய உயிர்த்தெழுதலைப் பற்றியது; இருப்பினும் வசனம் கூறுவதற்கு அப்பால் ஒரு விரிவான கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடிய அதேவேளையில் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘உயிர்பெறவில்லை’ முதன்மை வாசகமாகவும், ζάω என்பதன் நேரடியான ‘வாழவில்லை’ என்ற மாற்று அடிக்குறிப்பிலும் தரப்பட்டுள்ளது. அடிக்குறிப்பு குறி முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
