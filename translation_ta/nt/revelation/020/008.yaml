revisions:
- from: அவன் புறப்பட்டுச் சென்று, பூமியின் நான்கு திசைகளிலும் உள்ள தேசங்களை—கோகு, மாகோகு என்பவர்களை[b]—ஏமாற்றி[a], அவர்களைப் போருக்காக[c] ஒன்றுகூட்டுவான். அவர்களுடைய எண்ணிக்கை கடல் மணலைப்போல் இருக்கும்.
  to: அவன் பூமியின் நான்கு திசைகளிலும் இருக்கும் தேசங்களாகிய கோகு, மாகோகுவை[b] ஏமாற்றவும்[a], அவர்களைப் போருக்காக[c] ஒன்றுகூட்டவும் புறப்பட்டுச் செல்வான். அவர்களின் எண்ணிக்கை கடலின் மணலைப்போல் இருக்கும்.
  rationale: The revision removes the personalizing “என்பவர்களை” and renders Gog and Magog appositionally with the nations, preserving the text’s ambiguity about the names’ precise referent. It also makes both actions dependent on “புறப்பட்டுச் செல்வான்,” reflecting the Greek’s coordinated infinitives (“to deceive” and “to gather”). Footnote markers remain attached to their corresponding expressions.
