base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/008.yaml
  text: and he will go out to deceive the nations at the four corners of the earth—Gog and Magog—and to gather them for war[c][b][a], whose number is like the sand of the sea.
translation:
  language: ta
  text: அவன் பூமியின் நான்கு திசைகளிலும் இருக்கும் தேசங்களாகிய கோகு, மாகோகுவை[b] ஏமாற்றவும்[a], அவர்களைப் போருக்காக[c] ஒன்றுகூட்டவும் புறப்பட்டுச் செல்வான். அவர்களின் எண்ணிக்கை கடலின் மணலைப்போல் இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வழிதவறச் செய்து.”
    reason: lexical_alternative
  - marker: b
    text: “கோகு, மாகோகு” என்பது எசேக்கியேல் 38–39-ஐ எதிரொலிக்கிறது; இறுதிக் கலகத்திற்காக ஒன்றுகூடும் தேசங்களுக்கான முன்மாதிரி அடையாளமாக இப்பெயர்கள் செயல்படலாம்.
    reason: cross_reference
  - marker: c
    text: அல்லது, “போராட்டத்திற்காக.” கிரேக்கச் சொல் ‘போர்/போராட்டம்’ என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελεύσεται
  choice: புறப்பட்டுச் சென்று
  rationale: முந்தைய வசனத்தில் விடுவிக்கப்படும் சாத்தானின் வெளியே செல்லும் இயக்கத்தை இயல்பான தமிழில் உணர்த்துகிறது; எழுவாய் சூழலிலிருந்து பெறப்படுகிறது.
- source_word: πλανῆσαι
  choice: ஏமாற்றி
  rationale: πλανάω என்பதன் ‘ஏமாற்றுதல்/வழிதவறச் செய்தல்’ என்ற பொருள் வரம்பில், இச்சூழலில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τὰ ἔθνη
  choice: தேசங்களை
  rationale: வெளிப்படுத்தின விசேஷத்தில் கூட்டாகக் குறிக்கப்படும் nations/peoples என்ற பொருளைத் தருகிறது; ‘புறவினத்தார்’ என்ற யூதர்–யூதரல்லாதவர் வேறுபாட்டைத் தேவையின்றி புகுத்தவில்லை.
- source_word: τὰ ἐν ταῖς τέσσαρσι γωνίαις τῆς γῆς
  choice: பூமியின் நான்கு திசைகளிலும் உள்ள
  rationale: ‘பூமியின் நான்கு மூலைகள்’ என்ற மூல உருவகத்தின் உலகளாவிய எல்லைப் பொருளை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τὸν Γὼγ καὶ Μαγώγ
  choice: கோகு, மாகோகு என்பவர்களை
  rationale: பெயர்களை ஒலிபெயர்த்து, அவை தேசங்களுக்கு இணைப்பெயராக நிற்பதைத் தெளிவாக்குகிறது; அவற்றின் இறுதிக்கால அடையாளத்தை மொழிபெயர்ப்பிலேயே தீர்மானிக்கவில்லை.
- source_word: συναγαγεῖν
  choice: ஒன்றுகூட்டுவான்
  rationale: தேசங்களைப் போருக்காகத் திரட்டும் நோக்கத்தைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: εἰς τὸν πόλεμον
  choice: போருக்காக
  rationale: πόλεμος என்பதன் ‘போர்/போராட்டம்’ என்ற பரப்பை வைத்திருக்கிறது; ஒரு குறிப்பிட்ட தனிப்போரைத் தேவையின்றி நிர்ணயிப்பதில்லை.
- source_word: ὧν ὁ ἀριθμὸς αὐτῶν
  choice: அவர்களுடைய எண்ணிக்கை
  rationale: ஒன்றுகூட்டப்பட்ட தேசங்களையும் மக்களையும் சுட்டும் உறவுநிலை அமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: ὡς ἡ ἄμμος τῆς θαλάσσης
  choice: கடல் மணலைப்போல் இருக்கும்
  rationale: எண்ணிலடங்காத பெருந்தொகையைக் குறிக்கும் வேதாகம உருவகத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘புறப்பட்டுச் செல்வான்’ என்பதன் மறைமுக எழுவாய்
  choice: முந்தைய வசனத்திலிருந்து தொடரும் சாத்தானைக் குறிக்கும் வகையில் ‘அவன்’
  alternative: இவ்வசனத்தில் எழுவாயை வெளிப்படையாகச் சேர்க்காமல் விடுதல்
  rationale: கிரேக்கத்தில் எழுவாய் மறைந்திருந்தாலும், வெளிப்படுத்தின விசேஷம் 20:7-இன் உடனடி இலக்கணத் தொடர்ச்சி சாத்தானையே குறிக்கிறது; ‘அவன்’ என்பது பெயரை மீண்டும் புகுத்தாமல் அந்தத் தொடர்ச்சியைப் பாதுகாக்கிறது.
- issue: ‘கோகு, மாகோகு’ என்பதன் செயல்பாடு
  choice: ஏமாற்றப்படும் தேசங்களுக்கு இணைப்பெயரான அடையாளம்
  alternative: எசேக்கியேலில் வரும் கோகையும் மாகோகு நாட்டையும் நேரடியாகவும் கண்டிப்பாகவும் அடையாளப்படுத்துதல்
  rationale: கிரேக்கச் சொற்றொடர் இப்பெயர்களை தேசங்களோடு இணைக்கிறது; அவை குறியீடா, முன்மாதிரி அடையாளமா, புவியியல் பெயர்களா என்பதை மொழிபெயர்ப்பு முடிவு செய்யாமல் விடுகிறது.
- issue: πόλεμος என்பதன் அளவு
  choice: போர்
  alternative: குறிப்பிட்ட ‘அந்தப் போர்’ அல்லது ‘போராட்டம்’
  rationale: மூலச்சொல்லின் போர்/போராட்டம் என்ற அர்த்த வரம்பை வைத்துக்கொண்டு, அடுத்த வசனத்தின் நிகழ்வை இங்கே அதிகமாக முன்கூட்டியே விளக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘நான்கு திசைகள்’ என்பது மூலத்தின் ‘நான்கு மூலைகள்’ என்ற மரபுத்தொடரின் பொருளை இயல்பாகத் தருகிறது. அடிக்குறிப்பு குறியீடுகள் அனைத்தும் தொடர்புடைய சொற்களுக்குப் பின் முதன்மை உரையில் இடப்பட்டுள்ளன.
