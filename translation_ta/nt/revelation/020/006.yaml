id: REV.20.6
reference: Revelation 20:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: μακάριος καὶ ἅγιος ὁ ἔχων μέρος ἐν τῇ ἀναστάσει τῇ πρώτῃ· ἐπὶ τούτων ὁ δεύτερος θάνατος οὐκ ἔχει ἐξουσίαν, ἀλλ’ ἔσονται ἱερεῖς τοῦ θεοῦ καὶ τοῦ χριστοῦ, καὶ βασιλεύσουσιν μετ’ αὐτοῦ ⸀χίλια ἔτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/006.yaml
  text: Blessed and holy is the one who has a share in the first resurrection. Over these the second death has no authority[a], but they will be priests of God and of Messiah, and they will reign with him for a thousand years.
translation:
  language: ta
  text: முதலாம் உயிர்த்தெழுதலில் பங்கு உள்ளவர் பேறுபெற்றவரும் பரிசுத்தருமாவார். இவர்கள்மேல் இரண்டாம் மரணத்திற்கு அதிகாரம் இல்லை. மாறாக, அவர்கள் கடவுளுக்கும் மேசியாவுக்கும் உரிய அர்ச்சகர்களாக இருப்பார்கள்; அவரோடு ஆயிரம் ஆண்டுகள் அரசாளுவார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος
  choice: பேறுபெற்றவர்
  rationale: வேதாகம வாழ்த்துரைகளின் ஆழத்தையும் இறுதிக்கால நற்பேற்றையும் வெளிப்படுத்துகிறது; வெறும் மனநிலையைக் குறிக்கும் ‘மகிழ்ச்சியானவர்’ என்பதைக் காட்டிலும் பொருத்தமானது.
- source_word: ἅγιος
  choice: பரிசுத்தர்
  rationale: கடவுளுக்கெனப் பிரித்தெடுக்கப்பட்ட நிலையையும் தூய்மையையும் உள்ளடக்கும் நிலையான வேதாகமச் சொல்.
- source_word: ὁ ἔχων μέρος
  choice: பங்குபெறுகிறவர்
  rationale: முதலாம் உயிர்த்தெழுதலில் ஒருவருக்குப் பங்கு இருப்பதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; கிரேக்க ஒருமை வடிவமும் காக்கப்படுகிறது.
- source_word: ἐν τῇ ἀναστάσει τῇ πρώτῃ
  choice: முதலாம் உயிர்த்தெழுதலில்
  rationale: வரிசையைக் குறிக்கும் πρώτῃ என்பதையும் உயிர்த்தெழுதல் என்ற வேதாகமக் கருத்தையும் நேரடியாகக் காக்கிறது.
- source_word: ἐπὶ τούτων
  choice: இப்படிப்பட்டவர்கள்மேல்
  rationale: முதலாம் உயிர்த்தெழுதலில் பங்குபெறுவோரைக் குறிக்கும் பன்மையைத் தெளிவாக்கி, அவர்கள்மேல் அதிகாரம் செலுத்துதல் என்ற தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: ὁ δεύτερος θάνατος
  choice: இரண்டாம் மரணம்
  rationale: வெளிப்படுத்தலில் வரும் நிலையான இறுதிக்காலச் சொல்லாட்சியை நேரடியாகப் பாதுகாக்கிறது.
- source_word: οὐκ ἔχει ἐξουσίαν
  choice: அதிகாரம் இல்லை
  rationale: ἐξουσία என்பது வெறும் ஆற்றலைவிட அதிகாரம் அல்லது ஆளுகை உரிமையைக் குறிக்கிறது.
- source_word: ἱερεῖς
  choice: அர்ச்சகர்கள்
  rationale: வழிபாட்டு ஊழியத்தைக் குறிக்கும் கிரேக்கப் பெயர்ச்சொல்லை நேரடியாகக் காட்டுகிறது; பொதுவான ஊழியர்கள் என்று மங்கலாக்கவில்லை.
- source_word: τοῦ θεοῦ καὶ τοῦ χριστοῦ
  choice: கடவுளுக்கும் மேசியாவுக்கும் உரிய
  rationale: இருவரோடும் அர்ச்சகர்களுக்குள்ள உரிய தொடர்பைத் தமிழில் தெளிவாகக் காட்டுகிறது; Χριστός இங்கு பட்டப்பெயராக இருப்பதால் ‘மேசியா’ என வழங்கப்படுகிறது.
- source_word: βασιλεύσουσιν
  choice: அரசாளுவார்கள்
  rationale: அரசருக்குரிய ஆட்சியில் பங்கேற்பதை இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: μετ’ αὐτοῦ χίλια ἔτη
  choice: அவரோடு ஆயிரம் ஆண்டுகள்
  rationale: உடனிருந்து அரசாளுதலையும் வெளிப்படையாகக் கூறப்பட்ட கால அளவையும் எந்த இறுதிக்காலக் கோட்பாட்டையும் சேர்க்காமல் காக்கிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு θεός என்பதோடு இணைந்த பட்டப்பெயராக Χριστός நிற்பதால் ‘மேசியா’ அதன் அபிஷேகம் பெற்றவர் என்ற பட்டப்பொருளை வெளிப்படுத்துகிறது.
- issue: ஆயிரம் ஆண்டுகளின் தன்மை
  choice: ஆயிரம் ஆண்டுகள்
  alternative: ஆயிரமாண்டுக் காலம்
  rationale: கிரேக்க உரை கூறும் கால அளவை மட்டும் மொழிபெயர்த்து, அது சொற்பொருளா அல்லது குறியீட்டுப் பொருளா என்ற இறுதிக்கால விவாதத்தை வசனம் தீர்ப்பதாகக் காட்டவில்லை.
- issue: முதலாம் உயிர்த்தெழுதலின் பொருள்
  choice: முதலாம் உயிர்த்தெழுதல்
  alternative: முதல் உயிர்ப்பு
  rationale: உரையின் வரிசைச் சொல்லையும் உயிர்த்தெழுதல் என்ற கருத்தையும் அப்படியே காக்கிறது; அதன் இயல்பை விளக்கவோ ஒரு குறிப்பிட்ட விளக்கத்துடன் அடையாளப்படுத்தவோ இல்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான வேதாகம நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பேறுபெற்றவர்’, ‘பரிசுத்தர்’, ‘அர்ச்சகர்கள்’, ‘அரசாளுவார்கள்’ ஆகிய சொற்கள் வசனத்தின் வாழ்த்துரை, வழிபாடு, அரசாட்சி சார்ந்த உயர்ந்த நடையைத் தக்கவைக்கின்றன.
