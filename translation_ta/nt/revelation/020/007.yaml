source:
  edition: SBLGNT
  text: Καὶ ὅταν τελεσθῇ τὰ χίλια ἔτη, λυθήσεται ὁ Σατανᾶς ἐκ τῆς φυλακῆς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/007.yaml
  text: And when the thousand years are completed, Satan will be released from his prison,
translation:
  language: ta
  text: அந்த ஆயிரம் ஆண்டுகள் நிறைவடையும்போது, சாத்தான் தன் சிறையிலிருந்து விடுவிக்கப்படுவான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: நிறைவடையும்போது
  rationale: எதிர்காலத்தில் நிகழும் ஒரு குறிப்பிட்ட காலநிலையைச் சுட்டும் ὅταν என்பதன் பொருளை ‘-போது’ இயல்பாக வெளிப்படுத்துகிறது; ‘பிறகு’ என்று மொழிபெயர்த்து வரிசையை மட்டும் வலியுறுத்தாமல், மூலத்தின் காலத் தொடர்பைப் பேணுகிறது.
- source_word: τελεσθῇ
  choice: நிறைவடைய
  rationale: τελέω என்பதன் இறந்தகாலச் செயலப்பாட்டு துணைவினை வடிவம், வரையறுக்கப்பட்ட காலப்பகுதி முழுமை அடைவதைச் சொல்கிறது. தமிழில் ‘நிறைவடைய’ இயல்பாகவும் பொருள் நெருக்கமாகவும் உள்ளது.
- source_word: τὰ χίλια ἔτη
  choice: அந்த ஆயிரம் ஆண்டுகள்
  rationale: கிரேக்க வரையறைச் சுட்டு, முன்பு குறிப்பிடப்பட்ட ஆயிரம் ஆண்டுகளைக் குறிக்கிறது. தமிழில் ‘அந்த’ என்பது இந்த முன்சுட்டுத் திட்டவட்டத்தைக் தெளிவாகக் காக்கிறது.
- source_word: λυθήσεται
  choice: விடுவிக்கப்படுவான்
  rationale: எதிர்காலச் செயலப்பாட்டு வடிவத்தைத் தெளிவாகக் காக்கிறது. ‘கட்டவிழ்க்கப்படுவான்’ இச்சூழலில் இயல்பற்றது; ‘விடுதலை செய்யப்படுவான்’ தேவையற்ற நேர்மறை நுண்ணுணர்வைத் தரக்கூடும்.
- source_word: ὁ Σατανᾶς
  choice: சாத்தான்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டிலும் பொதுக் கிறிஸ்தவ வழக்கிலும் நிலைபெற்ற பெயரெழுத்தாக்கம்.
- source_word: ἐκ τῆς φυλακῆς αὐτοῦ
  choice: தன் சிறையிலிருந்து
  rationale: இச்சூழலில் φυλακή என்பது காவல் அல்லது காவல் நேரம் அல்ல, அடைத்துவைக்கப்பட்ட சிறையைக் குறிக்கிறது. αὐτοῦ-வின் பின்னோக்குச் சுட்டைத் தமிழில் ‘தன்’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ஆயிரம் ஆண்டுகளின் இயல்பு
  choice: ‘அந்த ஆயிரம் ஆண்டுகள்’ என்று நேரடியாக மொழிபெயர்த்து, அவை சொல்லாட்சிப்படியான காலமா அல்லது குறியீட்டு காலமா என்பதைத் தீர்மானிக்காமல் விடுதல்.
  alternative: சொல்லாட்சிப்படியான ஆயிரமாண்டு ஆட்சி அல்லது நீண்ட குறியீட்டு காலம் என்று விளக்குதல்.
  rationale: இந்த வசனம் ஒரு வரையறுக்கப்பட்ட காலத்தைக் குறிப்பிடுகிறது; ஆனால் ஆயிரமாண்டைப் பற்றிய பல்வேறு இறையியல் முறைகளில் எதையும் இங்கே தீர்மானிக்கவில்லை. ஆகவே மூலத்தின் இறையியல் திறந்தநிலை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியக்கூடிய, கண்ணியமான நடை. கிரேக்க வாக்கியத்தின் காலத் தொடர்பும் எதிர்காலச் செயலப்பாட்டு அமைப்பும் இயல்பான தமிழில் பாதுகாக்கப்பட்டுள்ளன.
