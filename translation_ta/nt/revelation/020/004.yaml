id: REV.20.4
reference: Revelation 20:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ εἶδον θρόνους, καὶ ἐκάθισαν ἐπ’ αὐτούς, καὶ κρίμα ἐδόθη αὐτοῖς, καὶ τὰς ψυχὰς τῶν πεπελεκισμένων διὰ τὴν μαρτυρίαν Ἰησοῦ καὶ διὰ τὸν λόγον τοῦ θεοῦ, καὶ οἵτινες οὐ προσεκύνησαν τὸ θηρίον οὐδὲ τὴν εἰκόνα αὐτοῦ καὶ οὐκ ἔλαβον τὸ χάραγμα ἐπὶ τὸ μέτωπον καὶ ἐπὶ τὴν χεῖρα αὐτῶν· καὶ ἔζησαν καὶ ἐβασίλευσαν μετὰ τοῦ χριστοῦ ⸀χίλια ἔτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/004.yaml
  text: And I saw thrones[a], and they sat on them, and judgment was given to them, and the souls of those who had been beheaded because of the testimony of Jesus and because of the word of God, and those who had not worshiped the beast or its image and had not received the mark on their forehead and on their hand[b]; and they came to life and reigned with the Messiah for a thousand years.
translation:
  language: ta
  text: நான் அரியணைகளைக் கண்டேன். அவர்கள் அவற்றின்மேல் அமர்ந்தார்கள்; தீர்ப்பு அவர்களுக்குக் கொடுக்கப்பட்டது. இயேசுவின் சாட்சியின் காரணமாகவும்[a] கடவுளுடைய வார்த்தையின் காரணமாகவும் தலை வெட்டப்பட்டவர்களின் ஆன்மாக்களையும், மிருகத்தையோ அதன் உருவத்தையோ வணங்காமல், தங்கள் நெற்றியிலும் கையிலும் அதன் முத்திரையைப் பெற்றுக்கொள்ளாமல் இருந்தவர்களையும் கண்டேன். அவர்கள் உயிர்பெற்று, மெசியாவுடன்[b] ஆயிரம் ஆண்டுகள் அரசாண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இயேசுவைப் பற்றிய அவர்களுடைய சாட்சியின் காரணமாக.’ ‘இயேசுவின் சாட்சி’ என்ற கிரேக்கச் சொற்றொடர் இயேசு அளித்த சாட்சியையோ இயேசுவைப் பற்றிய சாட்சியையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘கிறிஸ்துவுடன்.’ Χριστός இங்கு ஒரு பட்டமாகச் செயல்படுவதால் முதன்மை உரையில் ‘மெசியா’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: θρόνους
  choice: அரியணைகளை
  rationale: அரச அதிகாரத்தைக் குறிக்கும் தெளிவான, நேரடியான மொழிபெயர்ப்பு; வெளிப்படுத்தின விசேஷத்தின் தரிசன நடைக்கும் பொருந்துகிறது.
- source_word: ἐκάθισαν ἐπ’ αὐτούς
  choice: அவற்றின்மேல் அவர்கள் அமர்ந்தார்கள்
  rationale: கிரேக்கத்தில் செய்பவர் பெயரிடப்படாமல் பன்மையில் உள்ளது. அவர்களைத் தியாகிகள், பரிசுத்தவான்கள் அல்லது விண்ணுலக நீதிமன்றத்தார் என்று அடையாளப்படுத்தாமல் அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: κρίμα ἐδόθη αὐτοῖς
  choice: தீர்ப்பு அவர்களுக்குக் கொடுக்கப்பட்டது
  rationale: κρίμα என்பது தீர்ப்பு, தீர்ப்பளிக்கும் செயல் அல்லது நீதியதிகாரம் ஆகிய நுணுக்கங்களைக் கொண்டிருக்கலாம். விளக்க விரிவாக்கமின்றி மூலத்தின் திறந்த பொருளைப் பாதுகாக்கிறது.
- source_word: ψυχὰς
  choice: ஆன்மாக்களை
  rationale: தரிசனச் சூழலில் காணப்படும் மரணத்திற்குப் பிந்தைய தனித்துவமான காட்சியை மறைக்காமல் நேரடியாகத் தருகிறது.
- source_word: πεπελεκισμένων
  choice: தலை வெட்டப்பட்டவர்களின்
  rationale: மரணதண்டனையாகத் தலை வெட்டப்பட்டதைக் குறிக்கும் வினைச்சொல்லின் குறிப்பான பொருளை இயல்பான தமிழில் தருகிறது; கோடரி என்ற கருவியை தேவையின்றிச் சேர்க்கவில்லை.
- source_word: διὰ τὴν μαρτυρίαν Ἰησοῦ
  choice: இயேசுவின் சாட்சியின் காரணமாக
  rationale: 'διά என்பதன் காரணப் பொருளையும் Ἰησοῦ என்ற உடைமை வேற்றுமையின் இருபொருள் வாய்ப்பையும் பாதுகாக்கிறது: இயேசு அளித்த சாட்சி அல்லது இயேசுவைப் பற்றிய சாட்சி.'
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: கடவுளுடைய வார்த்தையின் காரணமாக
  rationale: காரணப் பொருளைத் தெளிவாகத் தருவதோடு λόγος என்பதைக் காலத்தால் நிலைபெற்ற ‘வார்த்தை’ என்ற சொல்லால் மொழிபெயர்க்கிறது.
- source_word: προσεκύνησαν
  choice: வணங்காமல்
  rationale: உடல் வணக்கத்தை மட்டும் அல்லாமல் இச்சூழலில் உள்ள சமய வழிபாட்டு விசுவாசத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: θηρίον
  choice: மிருகம்
  rationale: வெளிப்படுத்தின விசேஷத்தின் அபோகலிப்திய உருவகத்திற்கான நேரடியும் நிலைபெற்றதுமான சொல்.
- source_word: εἰκόνα
  choice: உருவம்
  rationale: ‘சிலை’ என்று விளக்கமாகக் குறுக்காமல், உருவம் அல்லது பிரதிநிதிப் படிமம் என்ற மூலச் சொல்லின் பரப்பைப் பாதுகாக்கிறது.
- source_word: χάραγμα
  choice: முத்திரை
  rationale: உடலில் இடப்படும் அடையாளத்தைக் குறிக்கும் வகையில் இச்சூழலில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: ἔζησαν
  choice: உயிர்பெற்று
  rationale: இச்சூழலின் நிகழ்வுத் தன்மையைத் தருகிறது; உயிர்த்தெழுதலின் இயல்பைச் சார்ந்த ஒரு குறிப்பிட்ட ஆயிரமாண்டுக் கோட்பாட்டைச் சேர்க்கவில்லை.
- source_word: χριστοῦ
  choice: மெசியாவுடன்
  rationale: Χριστός இங்கு ஒரு பட்டமாகச் செயல்படுவதால் அதன் பொருளை ‘மெசியா’ என்று வெளிப்படையாகத் தருகிறது.
theological_decisions:
- issue: ἐκάθισαν என்பதன் மறைந்த எழுவாயும் தீர்ப்பைப் பெறுபவர்களின் அடையாளமும்
  choice: ‘அவர்கள்’ மற்றும் ‘அவர்களுக்கு’ என்று அடையாளம் குறிப்பிடாமல் வைக்கப்பட்டது.
  alternative: தியாகிகள், எல்லாப் பரிசுத்தவான்கள், அப்போஸ்தலர்கள் அல்லது விண்ணுலக நீதிமன்றத்தார் என்று பெயரிடுதல்.
  rationale: கிரேக்க வசனம் எழுவாயை வெளிப்படையாக அடையாளப்படுத்தவில்லை; குறிப்பிட்ட குழுவைச் சேர்ப்பது மொழிபெயர்ப்பைக் கடந்து விளக்கமாகிவிடும்.
- issue: διὰ τὴν μαρτυρίαν Ἰησοῦ என்பதிலுள்ள உடைமை வேற்றுமையின் பொருள்
  choice: முதன்மை உரையில் ‘இயேசுவின் சாட்சியின் காரணமாக’ என்று இருபொருள் வாய்ப்பு பாதுகாக்கப்பட்டது.
  alternative: ‘இயேசுவைப் பற்றிய அவர்களுடைய சாட்சியின் காரணமாக’ அல்லது ‘இயேசு அளித்த சாட்சியின் காரணமாக’.
  rationale: இது இயேசு அளித்த சாட்சியையோ இயேசுவைப் பற்றிய விசுவாசிகளின் சாட்சியையோ குறிக்கலாம்; மூலமொழி ஒன்றை மட்டும் கட்டாயப்படுத்தவில்லை.
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு இச்சொல் பெயரைப்போல அல்லாமல் அபிஷேகம் பெற்ற அரசருக்கான பட்டமாகச் செயல்படுகிறது; மாற்று வழக்குச் சொல் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἔζησαν என்பதன் பொருள்
  choice: உயிர்பெற்று
  alternative: வாழ்ந்தார்கள் அல்லது மீண்டும் உயிரடைந்தார்கள்
  rationale: நிகழ்வுத் தன்மையைப் பாதுகாத்தாலும், உயிர்த்தெழுதலின் சரியான இயல்பு அல்லது ஆயிரமாண்டுக் காலத்தின் வரிசை குறித்து வசனத்தைவிட அதிகமாக வரையறுக்கவில்லை.
- issue: தலை வெட்டப்பட்டவர்களுக்கும் மிருகத்தை வணங்காதவர்களுக்கும் இடையிலான தொடர்பு
  choice: இரு விளக்கங்களையும் இணைத் தொடர்களாக வைத்தும், அவை முற்றிலும் வேறான குழுக்கள் என்று வெளிப்படையாகக் கூறாமலும் மொழிபெயர்க்கப்பட்டது.
  alternative: இரண்டாவது தொடரை முதல் குழுவை மட்டும் விளக்கும் தொடராகவோ, முற்றிலும் தனியான இரண்டாவது குழுவாகவோ வெளிப்படையாக அமைத்தல்.
  rationale: καὶ οἵτινες என்ற அமைப்பு தொடர்பைப் பற்றிய சில இலக்கணத் திறந்தநிலையை விடுகிறது; மொழிபெயர்ப்பு அதைத் தேவையின்றி முடிவு செய்யக்கூடாது.
translation_notes:
  register: நவீன பொதுத் தமிழில், கண்ணியமான தரிசன நடையுடன் மொழிபெயர்க்கப்பட்டது. பெயரிடப்படாத ‘அவர்கள்’ என்ற எழுவாய் அப்படியே பாதுகாக்கப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியம் தமிழில் வாசிக்க எளிதாக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; தொடரின் பொருளைத் தெளிவாக்க இரண்டாவது ‘கண்டேன்’ இயல்பாக மீளுரைக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் பொருந்தும் சொற்றொடர்களின் உடனேயே வைக்கப்பட்டுள்ளன.
