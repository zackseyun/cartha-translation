- from: பின்பு நான் அரியணைகளைக் கண்டேன். அவற்றின்மேல் அவர்கள் அமர்ந்தார்கள்; தீர்ப்பு அவர்களுக்குக் கொடுக்கப்பட்டது. இயேசுவின் சாட்சியின் காரணமாகவும்[a] கடவுளுடைய வார்த்தையின் காரணமாகவும் தலை வெட்டப்பட்டவர்களின் ஆன்மாக்களையும், மிருகத்தையோ அதன் உருவத்தையோ வணங்காமல், தங்கள் நெற்றியிலும் கையிலும் அதன் முத்திரையைப் பெற்றுக்கொள்ளாமல் இருந்தவர்களையும் கண்டேன். அவர்கள் உயிர்பெற்று, மெசியாவுடன்[b] ஆயிரம் ஆண்டுகள் அரசாண்டார்கள்.
