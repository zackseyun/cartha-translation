id: REV.20.9
reference: Revelation 20:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἀνέβησαν ἐπὶ τὸ πλάτος τῆς γῆς, καὶ ⸀ἐκύκλευσαν τὴν παρεμβολὴν τῶν ἁγίων καὶ τὴν πόλιν τὴν ἠγαπημένην. καὶ κατέβη πῦρ ⸂ἐκ τοῦ οὐρανοῦ⸃ καὶ κατέφαγεν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/009.yaml
  text: And they came up over the breadth of the earth and surrounded the camp of the saints and the beloved city[c][b][a]. And fire came down from heaven and consumed them.
translation:
  language: ta
  text: அவர்கள் பூமியின் அகன்ற பரப்பின்மேல் ஏறிவந்து, பரிசுத்தவான்களின் முகாமையும் அன்புக்குரிய நகரத்தையும்[a] சுற்றிவளைத்தார்கள். அப்போது வானத்திலிருந்து நெருப்பு இறங்கி வந்து அவர்களை விழுங்கியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அன்புக்குரிய நகரம்’ எது என்று இவ்வசனம் வெளிப்படையாகச் சொல்லவில்லை; பொதுவாக அது எருசலேம் அல்லது, விரிவான பொருளில், தேவனுடைய நகரம் என்று புரிந்துகொள்ளப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέβησαν
  choice: முன்னேறி வந்து
  rationale: ἀναβαίνω என்பதன் மேலே செல்லுதல்/எழுந்து வருதல் என்ற இயக்கத்தை இச்சூழலில் படையெடுத்து முன்னேறும் கருத்துடன் இயல்பான தமிழில் வெளிப்படுத்துகிறது; குறிப்பிட்ட நிலவியலைக் கட்டாயப்படுத்தவில்லை.
- source_word: ἐπὶ τὸ πλάτος τῆς γῆς
  choice: பூமியின் அகன்ற பரப்பெங்கும்
  rationale: πλάτος என்பதன் ‘அகலம், அகன்ற பரப்பு’ என்ற பொருளை ‘சமவெளி’ எனக் கூடுதலாக விளக்காமல், விரிந்த பரப்பின் காட்சியை இயல்பான தமிழில் தருகிறது.
- source_word: ἐκύκλευσαν
  choice: சுற்றிவளைத்தார்கள்
  rationale: சுற்றிலும் வளைத்தல் என்ற வினையின் பொருளையும் முற்றுகைச் சூழலையும் தெளிவாகக் காட்டுகிறது.
- source_word: παρεμβολὴν
  choice: முகாம்
  rationale: இராணுவத் தொனி இருக்கக்கூடிய ‘camp/encampment’ என்பதற்கான சுருக்கமான, இயல்பான தமிழ்; ‘படைமுகாம்’ என்று உரையில் இல்லாததை வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: τῶν ἁγίων
  choice: பரிசுத்தவான்களின்
  rationale: வெளிப்படுத்தின விசேஷத்திலும் புதிய ஏற்பாட்டிலும் ἅγιοι என்பதற்குப் பயன்படும் மரபான இறையியல் சொல்லாட்சியைத் தொடர்கிறது.
- source_word: τὴν πόλιν τὴν ἠγαπημένην
  choice: அன்புக்குரிய நகரத்தை
  rationale: ἠγαπημένην என்பதன் அன்பு பெற்ற நிலையை இயல்பாகத் தருகிறது; யார் அன்புகூர்கிறார் என்பதையோ நகரத்தின் பெயரையோ உரை சொல்லாதபோது சேர்க்கவில்லை.
- source_word: κατέβη πῦρ ἐκ τοῦ οὐρανοῦ
  choice: வானத்திலிருந்து நெருப்பு இறங்கி வந்து
  rationale: மூலத்தின் கீழிறங்கும் இயக்கத்தையும் வானத்திலிருந்து வரும் தோற்றத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: κατέφαγεν αὐτούς
  choice: அவர்களை விழுங்கியது
  rationale: κατεσθίω என்பதன் வலுவான ‘விழுங்கு/முற்றிலும் அழி’ உருவகத்தை, நெருப்புக்குப் பொருத்தமான இயல்பான தமிழில் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘அன்புக்குரிய நகரம்’ என்பதன் அடையாளம்
  choice: முதன்மை உரையில் நகரத்தைப் பெயரிடாமல் ‘அன்புக்குரிய நகரம்’ என்று பொதுவாக வைத்தல்
  alternative: எருசலேம் அல்லது இறுதிக்கால தேவநகரம்/தேவமக்கள் என்று வெளிப்படையாக அடையாளப்படுத்துதல்
  rationale: கிரேக்க உரை இவ்வசனத்தில் நகரத்தின் பெயரைச் சொல்லவில்லை. குறிப்பிட்ட அடையாளத்தை மொழிபெயர்ப்பில் சேர்ப்பது உரையில் தீர்க்கப்படாமல் உள்ள இறையியல் விளக்கத் தளத்தை முன்கூட்டியே முடிவுசெய்துவிடும்.
translation_notes:
  register: நவீன செந்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. கிரேக்கத்தின் அகன்ற பரப்பு, சுற்றிவளைத்தல், முகாம், வானத்திலிருந்து இறங்கும் நெருப்பு ஆகிய காட்சிகள் பாதுகாக்கப்பட்டுள்ளன; நகரத்தின் அடையாளம் விளக்கமாகத் திணிக்கப்படவில்லை.
