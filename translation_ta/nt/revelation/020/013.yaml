id: REV.20.13
reference: Revelation 20:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἔδωκεν ἡ θάλασσα τοὺς νεκροὺς τοὺς ἐν αὐτῇ, καὶ ὁ θάνατος καὶ ὁ ᾅδης ἔδωκαν τοὺς νεκροὺς τοὺς ἐν αὐτοῖς, καὶ ἐκρίθησαν ἕκαστος κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/013.yaml
  text: And the sea gave up the dead who were in it[a], and Death and Hades gave up the dead who were in them, and each one was judged according to their deeds.
translation:
  language: ta
  text: கடல் தன்னில் இருந்த இறந்தவர்களை ஒப்புவித்தது; மரணமும் பாதாளமும்[a] தங்களில் இருந்த இறந்தவர்களை ஒப்புவித்தன. ஒவ்வொருவரும் அவரவருடைய செயல்களின்படி நியாயந்தீர்க்கப்பட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பாதாளம்’ என்பதற்கு ‘இறந்தோரின் உலகம்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ᾅδης; இது பொதுவாக ‘நரகம்’ என்று மொழிபெயர்க்கப்படும் சொற்களிலிருந்து வேறுபட்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν / ἔδωκαν
  choice: ஒப்புவித்தது / ஒப்புவித்தன
  rationale: δίδωμι என்பதன் அடிப்படைப் பொருள் ‘கொடுத்தல்’ என்றாலும், இங்கு கடல், மரணம், பாதாளம் ஆகியவை இறந்தவர்களைத் தீர்ப்புக்காக வெளியே ஒப்படைப்பதைக் குறிக்கிறது. ‘ஒப்புவித்தது/ஒப்புவித்தன’ என்பது அந்தச் சூழற்பொருளை இயல்பாகத் தருகிறது.
- source_word: ἡ θάλασσα
  choice: கடல்
  rationale: θάλασσα என்பதற்கான நேரான, இயல்பான தமிழ் இணை; கிரேக்கத்தின் குறிப்பிட்ட தன்மை சூழலிலேயே தெளிவாகிறது.
- source_word: τοὺς νεκρούς
  choice: இறந்தவர்களை
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட νεκρούς என்பதை நவீன தமிழில் இயல்பாகவும் மனிதர்களைக் குறிப்பதாகவும் மொழிபெயர்க்கிறது.
- source_word: τοὺς ἐν αὐτῇ / τοὺς ἐν αὐτοῖς
  choice: தன்னில் இருந்த / தங்களில் இருந்த
  rationale: கடலுக்கான ஒருமையையும், மரணம் மற்றும் பாதாளம் ஆகியவற்றுக்கான பன்மையையும் பாதுகாத்து, இறந்தவர்களின் இருப்பிடத்தைத் தெளிவுபடுத்துகிறது.
- source_word: ὁ θάνατος
  choice: மரணம்
  rationale: வெளிப்படுத்தின விசேஷத்தின் உருவகப்படுத்தப்பட்ட சக்தியைத் தமிழில் இயல்பாகக் காட்டுகிறது; தமிழ் எழுத்தில் பெரிய எழுத்து வேறுபாடு இல்லாததால் சூழல் உருவகப்படுத்தலை வெளிப்படுத்துகிறது.
- source_word: ὁ ᾅδης
  choice: பாதாளம்
  rationale: ᾅδης என்பதை இறந்தோரின் உலகம்/இருப்பிடம் என்ற பொருளில் வழங்கும் வழக்கமான, கண்ணியமான தமிழ் சொல். இதனை இறுதி தண்டனையைக் குறிக்கும் ‘நரகம்’ என்று மொழிபெயர்ப்பதைத் தவிர்க்கிறது.
- source_word: ἐκρίθησαν ἕκαστος
  choice: ஒவ்வொருவரும் ... தீர்ப்பளிக்கப்பட்டார்கள்
  rationale: பன்மை வினையையும் ἕκαστος என்பதன் பகிர்ந்தளிக்கும் தனிப்பட்ட வலியுறுத்தலையும் இயல்பான தமிழில் ஒன்றாகப் பாதுகாக்கிறது.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: அவரவருடைய செயல்களின்படி
  rationale: ἔργα என்பதன் ‘செயல்கள்/செய்கைகள்’ பொருளையும், ஒவ்வொருவருக்குமான தனிப்பட்ட மதிப்பீட்டையும் இயல்பாக வெளிப்படுத்துகிறது; தீர்ப்பின் அடிப்படையை விளக்கிச் சேர்க்கவில்லை.
theological_decisions:
- issue: இறுதிக்காலத் தீர்ப்புச் சூழலில் ᾅδης என்பதன் மொழிபெயர்ப்பு
  choice: பாதாளம்
  alternative: இறந்தோரின் உலகம்; நரகம்
  rationale: ‘பாதாளம்’ என்பது இங்கு இறந்தோர் இருக்கும் இடத்தைக் குறிக்கும் ᾅδης-ஐ, உடனடியான சூழலில் வரும் அக்கினிக் கடல் அல்லது இறுதி தண்டனையோடு கலக்காமல் பாதுகாக்கிறது. ‘நரகம்’ தேவையற்ற பிற்காலத் தத்துவ இணைப்பை இறக்குமதி செய்யக்கூடும்.
- issue: θάνατος என்பதன் உருவகப்படுத்தல்
  choice: மரணம்
  alternative: சாவு
  rationale: கடலும் பாதாளமும் போல இறந்தவர்களை ஒப்புவிக்கும் ஓர் ஆற்றலாக மரணம் சித்தரிக்கப்படுவதை கண்ணியமான நடையில் பாதுகாக்கிறது; தனிப்பட்ட ஒரு உயிரினம் என்று மேலதிகமாக விளக்கவில்லை.
- issue: தீர்ப்பு செயல்களின்படி வழங்கப்படுதல்
  choice: அவரவருடைய செயல்களின்படி
  alternative: அவர்கள் செய்தவற்றின் அடிப்படையில்
  rationale: κατά + ἔργα என்ற நேரடியான தீர்ப்பு மொழியைப் பாதுகாத்து, விசுவாசம்-செயல்கள் குறித்த எந்த ஒரு சமயப்பிரிவின் விளக்கத்தையும் வசனத்துக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. மூலத்தின் மூன்று இணை வாக்கிய அமைப்பும், கடல்/மரணம்/பாதாளம் ஆகியவற்றின் உருவகப்படுத்தலும், ஒவ்வொருவருக்குமான தீர்ப்பும் பாதுகாக்கப்பட்டுள்ளன. அடிக்குறி [a] ‘பாதாளம்’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது; அது விளக்கும் சொல்லோடு நேரடியாக இணைகிறது.
