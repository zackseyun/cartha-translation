source:
  edition: SBLGNT
  text: καὶ εἴ τις οὐχ εὑρέθη ἐν ⸂τῇ βίβλῳ⸃ τῆς ζωῆς γεγραμμένος, ἐβλήθη εἰς τὴν λίμνην τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/015.yaml
  text: And if anyone was not found written in the book of life[b][a], he was thrown into the lake of fire.
translation:
  language: ta
  text: மேலும், வாழ்வின் புத்தகத்தில்[a] எழுதப்பட்டவராக எவராவது காணப்படவில்லை என்றால், அவர்[b] நெருப்பு ஏரிக்குள் எறியப்பட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வாழ்வின் சுருளில்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ஒரு புத்தகத்தையோ சுருளையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘அந்த நபர்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கத்தில் இங்கு பொதுப்பிரதிநிதியாகப் பயன்படுத்தப்பட்ட இலக்கண ஆண்பால் ஒருமை வடிவம் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἴ τις
  choice: மேலும், எவராவது ... என்றால்
  rationale: καί தொடர்ச்சியைச் சுட்டுவதால் ‘மேலும்’ என்றும், εἴ τις பொதுவான நிபந்தனையை அறிமுகப்படுத்துவதால் ‘எவராவது ... என்றால்’ என்றும் மொழிபெயர்க்கப்பட்டது.
- source_word: οὐχ εὑρέθη
  choice: காணப்படவில்லை
  rationale: εὑρίσκω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவத்தையும், நியாயத்தீர்ப்பின் சூழலில் வெளிப்படும் முடிவையும் நேரடியாகப் பேணுகிறது.
- source_word: ἐν τῇ βίβλῳ τῆς ζωῆς
  choice: வாழ்வின் புத்தகத்தில்
  rationale: βίβλος என்பது புத்தகத்தையோ சுருளையோ குறிக்கலாம். இங்கு ‘வாழ்வின் புத்தகம்’ தெளிவாகவும் வெளிப்படுத்தின விசேஷத்தின் வழக்கமான உருவகத்துக்கு ஏற்றதாகவும் உள்ளது.
- source_word: γεγραμμένος
  choice: எழுதப்பட்டவராக
  rationale: γράφω என்பதன் நிறைவுற்ற செயப்பாட்டுப் பெயரெச்சத்தின் நிலைத்த முடிவை இயல்பான தமிழில் தருகிறது; மூலத்தில் இல்லாத ‘பெயர்’ என்ற சொல்லை முதன்மைப் பிரதியில் சேர்க்கவில்லை.
- source_word: ἐβλήθη
  choice: எறியப்பட்டார்
  rationale: βάλλω என்பதன் செயப்பாட்டு வடிவத்தையும் வலுக்கட்டாயமாக உள்ளே போடப்படும் கருத்தையும், தேவையின்றி தீவிரப்படுத்தாமல் வெளிப்படுத்துகிறது.
- source_word: εἰς τὴν λίμνην τοῦ πυρός
  choice: நெருப்பு ஏரிக்குள்
  rationale: மூலத்தின் வெளிப்படுத்தல் சார்ந்த நியாயத்தீர்ப்பு உருவகத்தை விளக்கவுரையின்றி நேரடியாகப் பேணுகிறது.
theological_decisions:
- issue: இறுதி நியாயத்தீர்ப்பின் உருவகம்
  choice: நெருப்பு ஏரி
  alternative: தீயான ஏரி
  rationale: மூலம் கூறும் உருவகத்தை அப்படியே வைத்துள்ளது; இறுதித் தண்டனையின் இயல்பைப் பற்றிய எந்தப் பிரிவுசார் விளக்கமும் சேர்க்கப்படவில்லை.
- issue: பொதுப்பிரதிநிதியான ஒருமை
  choice: அவர்
  alternative: அந்த நபர்
  rationale: τις மற்றும் அதனுடன் தொடர்புடைய வடிவங்கள் ஒருமையில் உள்ளன. தமிழின் ‘அவர்’ ஒருமையை இயல்பாகப் பேணுகிறது; மூலத்தின் இலக்கண ஆண்பால் வடிவம் எல்லா மனிதரையும் பிரதிநிதித்துவப்படுத்தி வருவதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘எவராவது ... என்றால்’ என்ற அமைப்பு கிரேக்க நிபந்தனையைப் பேணுகிறது; ‘பெயர்’ போன்ற விளக்கச் சொல் முதன்மைப் பிரதியில் சேர்க்கப்படவில்லை.
