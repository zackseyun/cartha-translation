  terminology: ‘வாழ்வின் புத்தகம்’ and ‘நெருப்பு ஏரி’ are clear, established Tamil renderings and preserve the apocalyptic imagery without interpretive expansion. ‘எறியப்பட்டார்’ appropriately retains the passive and force of ἐβλήθη.
