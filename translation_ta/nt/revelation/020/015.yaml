  source_fidelity: The draft accurately represents the conditional indefinite expression, the passive judicial finding, the perfect-passive sense of being written, and the passive casting into the lake of fire. ‘வாழ்வின் புத்தகம்’ is a sound rendering of τῇ βίβλῳ τῆς ζωῆς. A small adjustment makes the Tamil conditional construction more natural while retaining the singular representative reference.
