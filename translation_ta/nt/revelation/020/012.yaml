id: REV.20.12
reference: Revelation 20:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἶδον τοὺς νεκρούς, τοὺς μεγάλους καὶ τοὺς μικρούς, ἑστῶτας ἐνώπιον τοῦ θρόνου, καὶ βιβλία ἠνοίχθησαν· καὶ ἄλλο βιβλίον ἠνοίχθη, ὅ ἐστιν τῆς ζωῆς· καὶ ἐκρίθησαν οἱ νεκροὶ ἐκ τῶν γεγραμμένων ἐν τοῖς βιβλίοις κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/012.yaml
  text: And I saw the dead[a], the great and the small, standing before the throne, and books were opened. And another book was opened, which is the book of life. And the dead were judged from what had been written in the books[b], according to their works.
translation:
  language: ta
  text: இறந்தவர்களாகிய பெரியோரும் சிறியோரும் அரியணைக்கு முன்பாக நிற்பதைக் கண்டேன். புத்தகங்கள்[a] திறக்கப்பட்டன. வேறொரு புத்தகமும் திறக்கப்பட்டது; அது வாழ்வின் புத்தகம். அந்தப் புத்தகங்களில் எழுதப்பட்டிருந்தவற்றின் அடிப்படையில், இறந்தவர்கள் தங்கள் செயல்களுக்கு ஏற்பத் தீர்ப்பளிக்கப்பட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘புத்தகங்கள்’ என்பதைப் பண்டைய கால எழுத்து ஊடகத்தைப் பிரதிபலிக்கும் வகையில் ‘சுருள்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: νεκρούς / νεκροὶ
  choice: இறந்தவர்கள்
  rationale: இறந்த மனிதர்களை ஒரு குழுவாகக் குறிக்கும் பெயர்ச்சொல் பயன்பாடு. இன்றைய தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: τοὺς μεγάλους καὶ τοὺς μικρούς
  choice: பெரியோரும் சிறியோரும்
  rationale: சமூக நிலையிலும் முக்கியத்துவத்திலும் எல்லாத் தரப்பினரையும் உள்ளடக்கும் இணைச்சொற்றொடரை, அதன் திட்டமிட்ட இருமுனை அமைப்புடன் பாதுகாக்கிறது.
- source_word: ἑστῶτας ἐνώπιον τοῦ θρόνου
  choice: அரியணைக்கு முன்பாக நிற்பதை
  rationale: Perfect participle குறிக்கும் நின்றுகொண்டிருக்கும் நிலையை இயல்பான தமிழில் தருகிறது; θρόνος என்பதற்கு விளக்கவுரையான ‘நியாயாசனம்’ என்பதைச் சேர்க்காமல் ‘அரியணை’ என நேரடியாக மொழிபெயர்க்கிறது.
- source_word: βιβλία
  choice: புத்தகங்கள்
  rationale: βιβλίον என்பதன் பொதுவான பொருளைத் தருகிறது. பண்டைய எழுத்துச் சுருள்களையும் இச்சொல் குறிக்கக்கூடும் என்பதால் அதனை அடிக்குறிப்பில் குறிப்பிடுகிறது.
- source_word: ἠνοίχθησαν / ἠνοίχθη
  choice: திறக்கப்பட்டன / திறக்கப்பட்டது
  rationale: செயப்பாட்டு வடிவத்தையும், திறக்கப்பட்ட செயலை மட்டுமே கூறும் வினையின் பொதுப் பொருளையும் காக்கிறது; ‘முத்திரை உடைக்கப்பட்டது’ என்ற கூடுதல் கருத்தைச் சேர்க்கவில்லை.
- source_word: ἄλλο βιβλίον
  choice: வேறொரு புத்தகம்
  rationale: முன்னர் கூறப்பட்ட புத்தகங்களிலிருந்து தனித்த, கூடுதலான ஒரு புத்தகத்தை இயல்பாகக் குறிக்கிறது.
- source_word: ὅ ἐστιν τῆς ζωῆς
  choice: அது வாழ்வின் புத்தகம்
  rationale: கிரேக்கத்தில் புரிந்துகொள்ளப்பட்டுள்ள βιβλίον என்பதைத் தமிழில் தெளிவுக்காக வெளிப்படையாகக் கூறுகிறது; ‘வாழ்வின் புத்தகம்’ என்பது பொருளையும் மரியாதையான நடையையும் காக்கிறது.
- source_word: ἐκρίθησαν
  choice: தீர்ப்பளிக்கப்பட்டார்கள்
  rationale: நீதித்துறைச் சூழலைத் தெளிவாக வெளிப்படுத்துகிறது; தீர்ப்பின் முடிவு கண்டனமா விடுதலையா என்பதை முன்கூட்டியே நிர்ணயிக்கவில்லை.
- source_word: ἐκ τῶν γεγραμμένων ἐν τοῖς βιβλίοις
  choice: அந்தப் புத்தகங்களில் எழுதப்பட்டிருந்தவற்றின் அடிப்படையில்
  rationale: தீர்ப்புக்கான பதிவு செய்யப்பட்ட அடிப்படையைத் தெளிவாக்குகிறது; perfect participle குறிக்கும் முன்பே எழுதி வைக்கப்பட்டிருந்த நிலையையும் காட்டுகிறது.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: தங்கள் செயல்களுக்கு ஏற்ப
  rationale: ἔργα என்பதன் செயல்கள்/செய்கைகள் என்ற பரந்த பொருளை நவீன, இயல்பான தமிழில் தருகிறது; வசனத்தின் தீர்ப்பு-செயல்கள் தொடர்பை மென்மையாக்கவில்லை.
theological_decisions:
- issue: செயல்களுக்கு ஏற்ப வழங்கப்படும் தீர்ப்பு
  choice: ‘தங்கள் செயல்களுக்கு ஏற்ப’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘தாங்கள் செய்தவற்றுக்கு ஏற்ப’
  rationale: வசனம் தீர்ப்பு அவர்களுடைய செயல்களுக்கு ஏற்ப அமைவதாக வெளிப்படையாகக் கூறுகிறது. வேறு கோட்பாட்டு விளக்கத்தைச் சேர்க்காமலும் இந்த இறையியல் பதற்றத்தைத் தணிக்காமலும் மூலத்தின் கூற்றை அப்படியே பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான வெளிப்பாடு பயன்படுத்தப்பட்டுள்ளது. ‘அரியணை,’ ‘வாழ்வின் புத்தகம்,’ ‘தீர்ப்பளிக்கப்பட்டார்கள்’ ஆகியவை வெளிப்படுத்தின விசேஷத்தின் காட்சிசார் மற்றும் நீதித்துறைச் செறிவைக் காக்கின்றன. வழங்கப்பட்ட ஆங்கில அடுக்கில் [a] குறியீடும் அதற்குரிய அடிக்குறிப்பும் ஒன்றுக்கொன்று பொருந்தாததால், மூல கிரேக்கத்தில் ஆதாரமில்லாத அந்த அடிக்குறிப்பு சேர்க்கப்படவில்லை; சுருள் குறித்த பொருத்தமான குறிப்பே [a] என இணைக்கப்பட்டுள்ளது.
