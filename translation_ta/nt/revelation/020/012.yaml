  source_fidelity: 'மூல கிரேக்கத்தின் முக்கிய கூறுகள் அனைத்தும் துல்லியமாகக் காக்கப்பட்டுள்ளன: இறந்தவர்கள், பெரியோரும் சிறியோரும், அரியணைக்கு முன்பாக நிற்றல், புத்தகங்கள் திறக்கப்படுதல், வாழ்வின் புத்தகம், புத்தகங்களில் எழுதப்பட்டவற்றின் அடிப்படையில் தீர்ப்பு, செயல்களுக்கு ஏற்ப தீர்ப்பு. தீர்ப்பின் முடிவைப் பற்றிய கூடுதல் விளக்கம் எதுவும் சேர்க்கப்படவில்லை.'
