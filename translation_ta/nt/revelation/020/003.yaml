id: REV.20.3
reference: Revelation 20:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν αὐτὸν εἰς τὴν ἄβυσσον, καὶ ἔκλεισεν καὶ ἐσφράγισεν ἐπάνω αὐτοῦ, ἵνα μὴ ⸀πλανήσῃ ἔτι τὰ ἔθνη, ἄχρι τελεσθῇ τὰ χίλια ἔτη· ⸀μετὰ ταῦτα δεῖ ⸂λυθῆναι αὐτὸν⸃ μικρὸν χρόνον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/003.yaml
  text: And he threw him into the abyss[a], and shut it and sealed it over him, so that he might no longer deceive the nations until the thousand years were finished[c][b]. After these things he must be released for a short time.
translation:
  language: ta
  text: அவன் அவனைப் பாதாளக் குழிக்குள்[a] எறிந்து, அதை மூடி, அதன் மேல் முத்திரையிட்டான். ஆயிரம் ஆண்டுகள் நிறைவடையும்வரை அவன் இனி தேசங்களை ஏமாற்றாதபடி[b] இப்படிச் செய்தான். இவற்றுக்குப் பிறகு, அவன் சிறிது காலத்திற்கு விடுவிக்கப்பட வேண்டும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அடித்தளமற்ற குழி.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவன் இனி தேசங்களை வழிதவறச் செய்யாதபடி.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘அவன் சிறிது நேரம் கட்டவிழ்க்கப்பட வேண்டும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλεν
  choice: எறிந்து
  rationale: வலுக்கட்டாயமாக ஓர் இடத்துக்குள் செலுத்தும் βάλλω என்பதன் வலிமையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἄβυσσον
  choice: பாதாளக் குழி
  rationale: வெளிப்படுத்தலில் வரும் பேராழமான அடைப்பு இடத்தைக் குறிக்கும் அபோகலிப்டிக் சொல்லாக இயல்பாகப் புரிகிறது; ‘அடிப்பகுதியற்ற குழி’ என்ற விளக்கமான மாற்றை அடிக்குறிப்பில் தருகிறது.
- source_word: ἔκλεισεν
  choice: மூடி
  rationale: κλείω என்பதன் ‘மூடு’ என்ற பொதுவான பொருளைப் பாதுகாக்கிறது; மூலத்தில் இல்லாத பூட்டுதல் என்ற விவரத்தைச் சேர்க்கவில்லை.
- source_word: ἐσφράγισεν ἐπάνω αὐτοῦ
  choice: அவனுக்கு மேலாக முத்திரையிட்டான்
  rationale: முத்திரையிட்டு உறுதிப்படுத்திய செயலும், ἐπάνω αὐτοῦ என்பதன் இடவியல் உறவும் பாதுகாக்கப்படுகின்றன.
- source_word: ἵνα μὴ πλανήσῃ ἔτι τὰ ἔθνη
  choice: அவன் இனி தேசங்களை ஏமாற்றாதபடி
  rationale: πλανάω என்பதற்கு இச்சூழலில் இயல்பான ‘ஏமாற்று’ என்பதைத் தேர்ந்தெடுத்து, ἔτι என்பதன் ‘இனி’ என்ற கால வலியுறுத்தலைக் காக்கிறது.
- source_word: ἄχρι τελεσθῇ τὰ χίλια ἔτη
  choice: ஆயிரம் ஆண்டுகள் நிறைவடையும்வரை
  rationale: τελέω என்பதன் நிறைவு அடைதல் என்ற கருத்தையும் ἄχρι குறிக்கும் கால எல்லையையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: μετὰ ταῦτα
  choice: இவற்றுக்குப் பிறகு
  rationale: பன்மைச் சுட்டைத் தக்கவைத்து, வெளிப்படுத்தலின் முறையான கதைநடைக்கு ஏற்ற temporal transition ஆக அமைகிறது.
- source_word: δεῖ
  choice: வேண்டும்
  rationale: தேவையைத் தெளிவாகக் காட்டுகிறது; அது தெய்வீகத் தீர்மானமா அல்லது கதைநடைத் தேவையா என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- source_word: λυθῆναι αὐτὸν
  choice: அவன் விடுவிக்கப்பட
  rationale: கட்டுப்பாட்டிலிருந்து விடுதலை செய்யப்படுதல் என்ற passive பொருளை நவீன தமிழில் இயல்பாகக் கூறுகிறது.
- source_word: μικρὸν χρόνον
  choice: சிறிது காலத்திற்கு
  rationale: குறுகிய கால அளவைக் குறிக்கும் accusative of duration-ஐத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘ஆயிரம் ஆண்டுகள்’ என்பதன் இயல்பு
  choice: ‘ஆயிரம் ஆண்டுகள்’ என்று நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: சொற்பொருளான ஆயிரமாண்டு காலம்; அல்லது அடையாளமான நீண்ட காலம்.
  rationale: இந்த வசனம் காலத்தின் குறியீட்டு அல்லது சொற்பொருள் இயல்பை விளக்காததால், ஆயிரமாண்டுக் கருத்து வேறுபாடுகளை மொழிபெயர்ப்பு தீர்ப்பதில்லை.
- issue: அபோகலிப்டிக் சூழலில் δεῖ என்பதன் வலிமை
  choice: ‘விடுவிக்கப்பட வேண்டும்’ என்று தேவையைப் பாதுகாத்தல்.
  alternative: தெய்வீகத் தீர்மானம் என்று வெளிப்படையாகக் கூறுதல்; அல்லது வெறும் கதைநடை நிகழ்வு என்று மெலிதாக்குதல்.
  rationale: மூலம் தேவையைத் தெரிவிக்கிறது; ஆனால் அதன் இயந்திரத்தையோ காரணத்தையோ விளக்கவில்லை. ‘வேண்டும்’ அந்த இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், வெளிப்படுத்தலுக்குரிய கண்ணியமான காட்சிநடையைப் பேணும் optimal-equivalence மொழிபெயர்ப்பு. தொடர்ச்சியான கிரேக்க வினைகளை தமிழில் தெளிவான வாக்கியங்களாகப் பிரித்துள்ளது; ஆனால் நிகழ்வுகளின் வரிசை, இடவியல் உறவு, கால எல்லை, மற்றும் தேவையின் வலிமை பாதுகாக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
