id: REV.10.2
reference: Revelation 10:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἔχων ἐν τῇ χειρὶ αὐτοῦ ⸀βιβλαρίδιον ἠνεῳγμένον. καὶ ἔθηκεν τὸν πόδα αὐτοῦ τὸν δεξιὸν ἐπὶ τῆς θαλάσσης, τὸν δὲ εὐώνυμον ἐπὶ τῆς γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/002.yaml
  text: and having in his hand a little scroll that had been opened[a]. And he placed his right foot on the sea, and his left on the land[b],
translation:
  language: ta
  text: மேலும், அவர் தமது கையில் திறக்கப்பட்டிருந்த ஒரு சிறிய சுருளை[a] வைத்துக்கொண்டு, தமது வலது பாதத்தைக் கடல்மீதும் இடது பாதத்தை நிலத்தின்மீதும்[b] வைத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரு சிறிய நூல்.’ βιβλαρίδιον என்பது சிறிய சுருளையோ சிறு நூலையோ குறிக்கக்கூடிய சிறுமைப்பொருள் சொல்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பூமியின்மீதும்.’ γῆ என்பதற்கு ‘நிலம்’ அல்லது ‘பூமி’ என்று பொருள் கொள்ளலாம்; இங்கு கடலுடனான வேறுபாட்டைக் காட்ட ‘நிலம்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχων
  choice: வைத்துக்கொண்டு
  rationale: நிகழ்காலப் பெயரெச்சம் முந்தைய வசனத்தில் குறிப்பிடப்பட்ட வல்லமையுள்ள தூதரைச் சார்ந்து, அடுத்த செயல் நிகழும்போது சுருள் அவரது கையில் இருப்பதைக் காட்டுகிறது. தமிழில் ‘வைத்துக்கொண்டு’ இந்தத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἐν τῇ χειρὶ αὐτοῦ
  choice: தமது கையில்
  rationale: χείρ என்பதன் ஒருமையையும், எழுவாயோடு தொடர்புடைய உடைமையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: βιβλαρίδιον
  choice: ஒரு சிறிய சுருள்
  rationale: இச்சிறுமைப்பொருள் வடிவம் சிறிய சுருள் அல்லது சிறு நூலைக் குறிக்கலாம். வெளிப்படுத்துதலின் காட்சிச் சூழலில் ‘சுருள்’ பொருத்தமானது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἠνεῳγμένον
  choice: திறக்கப்பட்டிருந்த
  rationale: நிறைவுற்ற செயப்பாட்டு பெயரெச்சம், முன்னரே திறக்கப்பட்டு தொடர்ந்து திறந்த நிலையில் இருந்ததை உணர்த்துகிறது.
- source_word: ἔθηκεν
  choice: வைத்தார்
  rationale: τίθημι இங்கு பாதங்களை நோக்கமுடன் ஓரிடத்தில் வைப்பதைக் குறிக்கிறது; ‘வைத்தார்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: τὸν πόδα αὐτοῦ τὸν δεξιόν
  choice: தமது வலது பாதத்தை
  rationale: ஒருமை, வலது பக்கம், எழுவாயோடு உள்ள உடைமை ஆகியவற்றை நேரடியாகக் காக்கிறது.
- source_word: ἐπὶ τῆς θαλάσσης
  choice: கடல்மீது
  rationale: ἐπί உடன் வரும் மரபுத்தொடரின் இடப்பொருளையும் θάλασσα என்பதன் வழக்கமான பொருளையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: τὸν δὲ εὐώνυμον
  choice: இடது பாதத்தை
  rationale: இணை அமைப்பில் மறைந்திருக்கும் ‘பாதம்’ என்பதைத் தமிழில் தெளிவுக்காக மீண்டும் கூறுகிறது; εὐώνυμος இங்கு ‘இடது’ என்பதே பொருள்.
- source_word: ἐπὶ τῆς γῆς
  choice: நிலத்தின்மீது
  rationale: γῆ என்பதற்கு ‘நிலம்’ அல்லது ‘பூமி’ எனப் பொருள் கொள்ளலாம். கடலோடு நேரடியாக முரண்படுத்தப்படுவதால் இங்கு ‘நிலம்’ இயல்பான தேர்வு.
theological_decisions:
- issue: θάλασσα என்பதற்கு எதிராக γῆ என்பதன் பொருள்
  choice: நிலம்
  alternative: பூமி
  rationale: ஒரு பாதம் கடல்மீதும் மற்றொன்று உலர் நிலத்தின்மீதும் இருப்பதாகக் காட்சி அமைகிறது. ‘நிலம்’ உடனடி இட வேறுபாட்டைக் காக்கிறது; ‘பூமி’ என்ற விரிந்த அண்டவியல் கருத்தைத் தேவையின்றி வலியுறுத்துவதில்லை. இருப்பினும் மூலச்சொல்லின் உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் காட்சியின் செறிவும் காக்கப்பட்டுள்ளன. முந்தைய வசனத்தோடு உள்ள பெயரெச்சத் தொடர்பு ‘வைத்துக்கொண்டு’ என இயல்பாக்கப்பட்டுள்ளது. கிரேக்கத்தின் இணை அமைப்பைத் தெளிவாக்க ‘பாதத்தை’ இருமுறையும் கூறப்பட்டுள்ளது. வழங்கப்பட்ட ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறிகள் அவற்றின் குறிப்புகளோடு இடமாறியிருந்ததால், மூலச்சொற்களுக்குரிய இடங்களில் [a], [b] எனச் சரிசெய்யப்பட்டுள்ளன.
