id: REV.10.8
reference: Revelation 10:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἡ φωνὴ ἣν ἤκουσα ἐκ τοῦ οὐρανοῦ, πάλιν ⸀λαλοῦσαν μετ’ ἐμοῦ καὶ ⸀λέγουσαν· Ὕπαγε λάβε τὸ ⸀βιβλίον τὸ ἠνεῳγμένον ἐν τῇ χειρὶ τοῦ ἀγγέλου τοῦ ἑστῶτος ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/008.yaml
  text: And the voice that I heard from heaven spoke to me again and said[a], “Go[b], take the scroll that is opened in the hand of the angel who is standing on the sea and on the land.”
translation:
  language: ta
  text: பரலோகத்திலிருந்து நான் கேட்ட அந்தக் குரல் மீண்டும் என்னோடு பேசி, “நீ போய், கடலின்மேலும் நிலத்தின்மேலும்[b] நின்றுகொண்டிருக்கிற தூதருடைய கையில் திறந்த நிலையில் இருக்கும் சுருளை[a] எடுத்துக்கொள்” என்று சொன்னது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “சிறு சுருள்.” அருகிலுள்ள வசனங்களில் சிறுமைப்பொருள் வடிவம் பயன்படுத்தப்படுகிறது; ஆனால் இவ்வசனத்தில் “சுருள்” என்று பொருள்படும் βιβλίον உள்ளது.
    reason: alternative_reading
  - marker: b
    text: “நிலம்” என்பதற்குப் பதிலாக “பூமி” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: குரல்
  rationale: இங்கு பரலோகத்திலிருந்து வார்த்தைகளால் பேசும் குரலைக் குறிக்கிறது; வெறும் ஓசை அல்ல.
- source_word: πάλιν
  choice: மீண்டும்
  rationale: அந்தப் பரலோகக் குரல் யோவானிடம் மறுபடியும் பேசுவதைக் குறிக்கிறது.
- source_word: λαλοῦσαν μετ’ ἐμοῦ
  choice: என்னோடு பேசி
  rationale: μετά + பிறப்புவேற்றுமை தரும் ‘என்னோடு’ என்ற தொடர்புணர்வை இயல்பான தமிழில் காக்கிறது.
- source_word: Ὕπαγε λάβε
  choice: நீ போய் … எடுத்துக்கொள்
  rationale: தொடர்ந்து வரும் இரண்டு நேரடிக் கட்டளைகளையும் இயல்பான தமிழ் கட்டளைத் தொடராக வழங்குகிறது.
- source_word: βιβλίον
  choice: சுருள்
  rationale: இக்காட்சியின் பண்டைய எழுத்துப் பொருளை ‘புத்தகம்’ என்பதைக் காட்டிலும் துல்லியமாகக் குறிக்கிறது; இவ்வசனத்தில் சிறுமைப்பொருள் வடிவம் இல்லை.
- source_word: ἠνεῳγμένον
  choice: திறந்த நிலையில் இருக்கும்
  rationale: முன்பு திறக்கப்பட்டதால் இப்போது திறந்தே இருக்கும் நிலையை perfect passive participle குறிக்கிறது.
- source_word: ἐν τῇ χειρὶ
  choice: கையில்
  rationale: சுருள் தூதருடைய கையில் இருப்பதை ἐν நேரடியாகக் குறிக்கிறது; ‘கையிலிருந்து’ என்ற பொருளை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
- source_word: ἄγγελος
  choice: தூதர்
  rationale: வெளிப்படுத்தின விசேஷத்தின் தரிசனச் சூழலில் இது பரலோகத் தூதரைக் குறிக்கிறது.
- source_word: ἑστῶτος
  choice: நின்றுகொண்டிருக்கிற
  rationale: தூதர் தொடர்ந்து நிற்கும் தற்போதைய நிலையைக் காட்டுகிறது.
- source_word: ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς
  choice: கடலின்மேலும் நிலத்தின்மேலும்
  rationale: கடலுக்கும் அதன் தரைப்பகுதி எதிரிணைக்கும் இடையிலான காட்சிசார் வேறுபாட்டைத் தெளிவாகவும் கிரேக்கத்தின் மீளுருவாக்கத்தைப் பேணியும் தருகிறது.
theological_decisions:
- issue: அபோகலிப்திக் காட்சியில் γῆ என்பதன் பொருள்
  choice: நிலம்
  alternative: பூமி
  rationale: தூதர் கடலின்மேலும் அதற்கு எதிரான தரைப்பகுதியின்மேலும் நிற்பதே உடனடிக் காட்சி. தேவையற்ற பிரபஞ்சவியல் முடிவைச் சேர்க்காமல் ‘நிலம்’ இதை இயல்பாகக் காட்டுகிறது; ‘பூமி’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: சுற்றியுள்ள வசனங்களோடு தொடர்பில் βιβλίον என்பதன் மொழிபெயர்ப்பு
  choice: சுருள்
  alternative: சிறு சுருள்; புத்தகம்
  rationale: இவ்வசனத்தில் உள்ள βιβλίον என்பதை வரலாற்று-இலக்கியச் சூழலில் ‘சுருள்’ என மொழிபெயர்ப்பது பொருத்தம். அருகிலுள்ள வசனங்களில் சிறுமைப்பொருள் வடிவம் வந்தாலும், அதை இவ்வசனத்திற்குள் ஒத்திசைத்து சேர்க்காமல் மாற்று வாய்ப்பாக அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், தரிசன உரைக்கு ஏற்ற கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘என்னோடு பேசி … சொன்னது’ என்பது கிரேக்கத்தில் வரும் இரண்டு பேச்சுச் சொற்களையும் அழிக்காமல் தமிழில் வாசிக்கத்தக்கவாறு காக்கிறது. எல்லா அடிக்குறிப்பு அடையாளங்களும் அவை விளக்கும் சொற்களுக்குப் பின் வைக்கப்பட்டுள்ளன.
