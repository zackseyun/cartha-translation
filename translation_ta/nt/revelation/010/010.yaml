reference: Revelation 10:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἔλαβον τὸ ⸀βιβλαρίδιον ἐκ τῆς χειρὸς τοῦ ἀγγέλου καὶ κατέφαγον αὐτό, καὶ ἦν ἐν τῷ στόματί μου ὡς μέλι γλυκύ· καὶ ὅτε ἔφαγον αὐτό, ἐπικράνθη ἡ κοιλία μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/010.yaml
  text: And I took the little scroll from the hand of the angel and ate it, and in my mouth it was sweet like honey; and when I had eaten it, my stomach was made bitter.
translation:
  language: ta
  text: நான் அந்தச் சிறிய சுருளை[a] தூதரின் கையிலிருந்து எடுத்துத் தின்றேன். அது என் வாயில் தேனைப்போல் இனித்தது; அதைத் தின்றதும் என் வயிறு கசந்தது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சிறிய புத்தகம்.” இங்குள்ள கிரேக்கச் சொல் சிறிய எழுதப்பட்ட ஆவணத்தைக் குறிக்கலாம்; பண்டைய காலத்தில் அது சுருளாக இருந்திருக்க வாய்ப்புள்ளதால் “சிறிய சுருள்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் வயிற்றுப்பகுதி கசந்தது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βιβλαρίδιον
  choice: சிறிய சுருள்
  rationale: குறுஞ்சொல் வடிவம் சிறிய எழுதப்பட்ட ஆவணத்தைக் குறிக்கிறது; பண்டைய உலகின் சுருள் வடிவத்தையும் அதன் சிறுமையையும் இச்சொல் இயல்பாகக் காக்கிறது.
- source_word: ἐκ τῆς χειρὸς τοῦ ἀγγέλου
  choice: தூதரின் கையிலிருந்து வாங்கி
  rationale: மூலத்தில் உள்ள ‘தூதரின் கையிலிருந்து’ என்ற தெளிவான காட்சியைப் பாதுகாக்கிறது; தமிழில் பொருளைப் பெற்றுக்கொள்ளும் செயலை ‘வாங்கி’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: κατέφαγον
  choice: தின்றேன்
  rationale: செயலை நேரடியாகவும் இயல்பாகவும் கூறுகிறது; ‘விழுங்கினேன்’ போன்ற சொல் மூலத்தில் தேவையில்லாத தீவிரத்தைச் சேர்க்கக்கூடும்.
- source_word: ὡς μέλι γλυκύ
  choice: தேனைப்போல் இனித்தது
  rationale: ὡς என்ற ஒப்புமையையும் γλυκύ என்ற இனிமையையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὅτε ἔφαγον αὐτό
  choice: அதைத் தின்றதும்
  rationale: சுருளைத் தின்றதைத் தொடர்ந்து வயிறு கசந்த நிகழ்வின் வரிசையைச் சுருக்கமாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: ἐπικράνθη
  choice: கசந்தது
  rationale: செயப்பாட்டு வடிவம் இங்கு நிலைமாற்றத்தைக் குறிப்பிடலாம்; தமிழில் ‘வயிறு கசந்தது’ என்பது இயல்பாக இருந்து, கசப்பான நிலை ஏற்பட்டதை வெளிப்படுத்துகிறது.
- source_word: κοιλία
  choice: வயிறு
  rationale: உடலின் உள்பகுதியைக் குறிக்கும் இச்சூழலில் பொதுவாகப் புரியும் இயல்பான நவீன தமிழ்ச் சொல்.
theological_decisions:
- issue: சுருளைத் தின்னும் அடையாளச் செயல்
  choice: இனிமை மற்றும் கசப்பு என்னும் படிமங்களை விளக்கவுரை சேர்க்காமல் நேரடியாக மொழிபெயர்த்தல்
  alternative: இனிமையை மகிழ்ச்சியாகவும் கசப்பை நியாயத்தீர்ப்பு அல்லது துயரமாகவும் மொழிபெயர்ப்பிலேயே வெளிப்படையாக விளக்குதல்
  rationale: இந்த வசனம் அடையாளச் செயலைக் காட்டினாலும் அதன் எல்லா இறையியல் பொருள்களையும் இங்கே விளக்கவில்லை. ஆகவே அதன் திட்டமிட்ட படிமத்தையும் பொருள் சார்ந்த இறுக்கத்தையும் மொழிபெயர்ப்பு அப்படியே காக்கிறது.
- issue: ἐπικράνθη என்பதிலுள்ள செயப்பாட்டு வடிவம்
  choice: தமிழில் இயல்பான நிலைமாற்றமாக ‘என் வயிறு கசந்தது’ என்று வழங்குதல்
  alternative: ‘என் வயிறு கசப்பாக்கப்பட்டது’ என்று இலக்கண வடிவத்தை வெளிப்படையாகக் காட்டுதல்
  rationale: கிரேக்கச் செயப்பாட்டு வடிவம் இச்சூழலில் கசப்பான நிலை ஏற்பட்டதைக் குறிக்கிறது; செய்பவர் யார் என்று வசனம் கூறாததால், தமிழில் கட்டாயமாக வெளிப்புற செய்பவரை உணர்த்தாமல் இயல்பாக வழங்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான வேதாகம நடையுடன் வழங்கப்பட்டுள்ளது. ‘சுருள்,’ ‘தூதர்,’ ‘வயிறு’ ஆகியவை சாதாரண வாசகருக்கு தெளிவான சொற்கள். மூலத்தின் தொடர் ‘மற்றும்’ இணைப்புகளைத் தமிழில் இயல்பான வாக்கியப் பிரிவும் ‘ஆனால்’ என்ற மாறுபாட்டுக் குறிப்பும் கொண்டு வெளிப்படுத்தியுள்ளோம்; இனிமை–கசப்பு எதிர்மறைத் தொடர்பு பாதுகாக்கப்பட்டுள்ளது.
