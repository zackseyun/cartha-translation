revisions:
- from: ஆனால், ஏழாவது தூதன் எக்காளம் ஊதவிருக்கும்போது, அவனுடைய சத்தம் கேட்கும் நாட்களில், கடவுள் தமக்குச் சொந்தமான அடிமைகளாகிய[a] தீர்க்கதரிசிகளுக்கு நற்செய்தியாக அறிவித்தபடியே, கடவுளின் மறைதிட்டம் நிறைவேறும்.
  to: ஆனால், ஏழாவது தூதனுடைய குரல் ஒலிக்கும் நாட்களில், அவன் எக்காளம் ஊதவிருக்கும்போது, கடவுள் தமக்குச் சொந்தமான அடிமைகளாகிய தீர்க்கதரிசிகளுக்கு நற்செய்தியை அறிவித்தபடியே, கடவுளின் மறைபொருள் நிறைவேறும்.
  rationale: The revision preserves the Greek sequence and its future-oriented fulfillment while retaining the aorist’s completed-certainty sense through Tamil future usage. It replaces the interpretively narrowed “மறைதிட்டம்” with “மறைபொருள்,” keeps δοῦλοι as “அடிமைகள்,” and makes the good-news proclamation more direct. The footnote marker remains anchored immediately after “அடிமைகளாகிய.”
