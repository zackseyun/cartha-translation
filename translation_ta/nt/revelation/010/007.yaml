id: REV.10.7
reference: Revelation 10:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀλλ’ ἐν ταῖς ἡμέραις τῆς φωνῆς τοῦ ἑβδόμου ἀγγέλου, ὅταν μέλλῃ σαλπίζειν, καὶ ἐτελέσθη τὸ μυστήριον τοῦ θεοῦ, ὡς εὐηγγέλισεν τοὺς ⸂ἑαυτοῦ δούλους⸃ τοὺς προφήτας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/007.yaml
  text: but in the days of the voice of the seventh angel[a], when he is about to sound the trumpet, then the mystery of God is fulfilled, just as he proclaimed the good news to his own servants, the prophets.
translation:
  language: ta
  text: ஆனால், ஏழாவது தூதனுடைய குரல் ஒலிக்கும் நாட்களில், அவன் எக்காளம் ஊதவிருக்கும்போது, கடவுள் தமக்குச் சொந்தமான அடிமைகளாகிய தீர்க்கதரிசிகளுக்கு நற்செய்தியை அறிவித்தபடியே, கடவுளின் மறைபொருள் நிறைவேறும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλ’
  choice: ஆனால்
  rationale: முந்தைய கூற்றுடன் உள்ள எதிர்மறைத் தொடர்பை இயல்பாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐν ταῖς ἡμέραις τῆς φωνῆς τοῦ ἑβδόμου ἀγγέλου
  choice: ஏழாவது தூதனுடைய சத்தம் கேட்கும் நாட்களில்
  rationale: φωνή என்பதன் ‘சத்தம்/குரல்’ என்ற பொருளைத் தக்கவைத்தபடி, தமிழில் இயல்பற்ற ‘சத்தத்தின் நாட்களில்’ என்ற சொற்றொடரைத் தவிர்க்கிறது; இதை நேரடியாக எக்காள ஓசை என்று மட்டும் விளக்கிவிடவில்லை.
- source_word: ὅταν μέλλῃ σαλπίζειν
  choice: எக்காளம் ஊதவிருக்கும்போது
  rationale: μέλλῃ தரும் உடன்நிகழவிருக்கும் தன்மையையும், சூழலில் σαλπίζειν குறிக்கும் எக்காளம் ஊதுதலையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: καὶ ἐτελέσθη
  choice: நிறைவேறும்
  rationale: இறந்தகால வடிவமுள்ள கிரேக்க வினை, எதிர்காலத்தை நோக்கிய காலவாக்கியத்துக்குள் நிகழ்வின் உறுதியான நிறைவை முன்கூட்டியே காட்டுகிறது. தமிழில் ‘நிறைவேறும்’ என்பது காலச்சூழலுக்கு இயல்பாக இருந்து, வெறும் முடிவை விட நோக்கத்தின் நிறைவைத் தெரிவிக்கிறது.
- source_word: τὸ μυστήριον τοῦ θεοῦ
  choice: கடவுளின் மறைதிட்டம்
  rationale: μυστήριον இங்கு மறைந்திருந்த கடவுளுடைய நோக்கம் நிறைவேறுவதைக் குறிக்கிறது. ‘மறைதிட்டம்’ அந்தப் பொருளை சாதாரண வாசகருக்குத் தெளிவாகத் தருகிறது; குறிப்பிட்ட இறுதிக்காலக் கோட்பாட்டைச் சேர்ப்பதில்லை.
- source_word: ὡς εὐηγγέλισεν
  choice: நற்செய்தியாக அறிவித்தபடியே
  rationale: εὐαγγελίζω என்பதிலுள்ள நற்செய்தி அறிவித்தல் என்ற வலிமையை வினைத்தொடராகப் பாதுகாக்கிறது.
- source_word: τοὺς ἑαυτοῦ δούλους
  choice: தமக்குச் சொந்தமான அடிமைகளாகிய
  rationale: ἑαυτοῦ வலியுறுத்தும் கடவுளுக்குரிய சொந்தத்தையும், δοῦλος குறிக்கும் கட்டுப்பட்ட பணிநிலையையும் வெளிப்படுத்துகிறது. தமிழில் ‘பணியாளர்கள்’ என்ற மென்மையான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τοὺς προφήτας
  choice: தீர்க்கதரிசிகளுக்கு
  rationale: முன்னுள்ள அடிமைகள் யார் என்பதை விளக்கும் இணைப்பெயராகத் தெளிவாக மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: கடவுளுடைய தீர்க்கதரிசிகளைக் குறிக்கும் δοῦλος
  choice: அடிமைகள்
  alternative: பணியாளர்கள்
  rationale: ἑαυτοῦ உடன் வருவதால் கடவுளுக்குச் சொந்தமானவர்களாகவும் அவருடைய கட்டளைக்குக் கீழ்ப்பட்டவர்களாகவும் இருப்பது முன்னிலைப்படுகிறது. ‘அடிமைகள்’ இதைத் தக்கவைக்கிறது; நவீன தமிழில் இயல்பான மென்மையான மாற்று அடிக்குறிப்பில் கொடுக்கப்படுகிறது.
- issue: ἐτελέσθη என்பதன் காலமும் நிறைவு நுணுக்கமும்
  choice: நிறைவேறும்
  alternative: நிறைவேறியது / முடிவடையும்
  rationale: கிரேக்கத்தில் இறந்தகால வடிவம் இருந்தாலும், ὅταν μέλλῃ என்ற எதிர்கால நோக்குள்ள சூழலில் வரவிருக்கும் நிகழ்வின் உறுதியான நிறைவை அது சித்தரிக்கிறது. தமிழ் எதிர்காலம் காலத் தொடர்பைத் தெளிவாக்குகிறது; ‘நிறைவேறும்’ என்பது கடவுளின் நோக்கம் செயலாக்கப்படுவதைச் சொல்கிறது.
- issue: μυστήριον என்பதன் பொருள்
  choice: மறைதிட்டம்
  alternative: மறைபொருள் / இரகசியம்
  rationale: இங்கு கடவுள் தீர்க்கதரிசிகளுக்கு அறிவித்து, பின்னர் நிறைவேற்றும் மறைந்த நோக்கம் மையமாகிறது. ‘மறைதிட்டம்’ பொருளைத் தெளிவாக்கினாலும், அதன் விவரத்தை எந்த ஓர் இறுதிக்கால விளக்கத்துடனும் அடையாளப்படுத்துவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், வெளிப்படுத்தின விசேஷத்திற்கேற்ற கண்ணியமான தீர்க்கதரிசன நடையைப் பேணுகிறது. கிரேக்கச் சொற்றொடரின் அமைப்பை முற்றிலும் சொல்சொல்லாகப் பின்பற்றி இயல்பற்ற தமிழ் உருவாக்காமல், ‘சத்தம்’ மற்றும் ‘மறைதிட்டம்’ போன்ற முக்கிய கருத்துகளைத் தக்கவைக்கிறது.
