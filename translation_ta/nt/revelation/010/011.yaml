source:
  edition: SBLGNT
  text: Καὶ λέγουσίν μοι· Δεῖ σε πάλιν προφητεῦσαι ἐπὶ λαοῖς ⸀καὶ ἔθνεσιν καὶ γλώσσαις καὶ βασιλεῦσιν πολλοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/011.yaml
  text: And they say to me, “You must prophesy again about many peoples and nations and languages and kings.”
translation:
  language: ta
  text: அவர்கள் என்னிடம், “மக்கள், இனங்கள், மொழிகள், பல அரசர்கள் ஆகியவற்றைப் பற்றி நீ மீண்டும் தீர்க்கதரிசனம் சொல்ல வேண்டும்” என்று சொல்கிறார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν προφητεῦσαι
  choice: மீண்டும் தீர்க்கதரிசனம் உரைக்க
  rationale: πάλιν என்பதன் ‘மீண்டும்’ என்ற பொருளையும், προφητεύω என்பதன் இறைவாக்கை அறிவிக்கும் செயலையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐπὶ
  choice: குறித்து
  rationale: இங்கு தீர்க்கதரிசனத்தின் பொருள் அல்லது தொடர்பைக் குறிக்கும் சாத்தியத்தைப் பாதுகாக்கிறது; ‘எதிராக’ என்று ஒருதலைப்பட்சமாகக் குறுக்கவில்லை.
- source_word: λαοῖς καὶ ἔθνεσιν καὶ γλώσσαις καὶ βασιλεῦσιν πολλοῖς
  choice: பல மக்களையும் நாடுகளையும் மொழியினரையும் அரசர்களையும்
  rationale: பட்டியலின் நான்கு தனித்த வகைகளையும் காக்கிறது; πολλοῖς முழுப் பட்டியலுடனும் இயல்பாகத் தொடர்புபடும் வகையில் ‘பல’ முன்வைக்கப்பட்டுள்ளது.
- source_word: γλώσσαις
  choice: மொழியினரையும்
  rationale: வெறும் மொழிகள் அல்ல, மொழியால் அடையாளப்படுத்தப்படும் மனிதக் குழுக்கள் என்ற வெளிப்படுத்தல் நூலின் பட்டியல் பயன்பாட்டை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: ἐπὶ என்பதன் தொடர்பு
  choice: குறித்து
  alternative: எதிராக / முன்னிலையில்
  rationale: சூழலில் யோவான் பல குழுக்களுடன் தொடர்புடைய தீர்க்கதரிசனத்தை மீண்டும் உரைக்க வேண்டும் என்பதே தெளிவு; தீர்க்கதரிசனத்தின் தீர்ப்புத் தன்மையை மட்டும் முன்கூட்டியே நிர்ணயிக்காமல் மூலத்தின் பரந்த தொடர்பை வைத்திருக்கிறது.
- issue: λέγουσίν என்ற பன்மை எழுவாய்
  choice: அவர்கள் ... என்றார்கள்
  alternative: அவர் ... என்றார்
  rationale: மூல உரையின் பன்மை வினைச்சொல்லைத் தெளிவாகக் காக்கிறது; பேசுவோர் யார் என்பதை வசனம் குறிப்பிடாததால் குறிப்பிட்ட அடையாளம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்கவும் பொதுவாசகர்களுக்குப் புரியத்தக்கவாறும் வடிவமைக்கப்பட்டது. கிரேக்க நிகழ்கால வரலாற்று நடையை இயல்பான தமிழ் கதைநடைக்காக இறந்தகாலமாக மொழிபெயர்த்துள்ளது.
