id: REV.10.4
reference: Revelation 10:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὅτε ἐλάλησαν αἱ ἑπτὰ βρονταί, ἤμελλον γράφειν· καὶ ἤκουσα φωνὴν ἐκ τοῦ οὐρανοῦ λέγουσαν· Σφράγισον ἃ ἐλάλησαν αἱ ἑπτὰ βρονταί, καὶ μὴ αὐτὰ γράψῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/004.yaml
  text: And when the seven thunders spoke[a], I was about to write; and I heard a voice from heaven saying, “Seal up what the seven thunders spoke, and do not write them.”
translation:
  language: ta
  text: அந்த ஏழு இடிமுழக்கங்கள் பேசியபோது, நான் எழுதவிருந்தேன். அப்போது வானத்திலிருந்து ஒரு குரலைக் கேட்டேன். அது, “அந்த ஏழு இடிமுழக்கங்கள் பேசியவற்றை முத்திரையிட்டு வை; அவற்றை எழுதாதே” என்று சொன்னது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλάλησαν
  choice: பேசியபோது / பேசியவற்றை
  rationale: λαλέω என்பதன் பொதுவான பொருளான ‘பேசுதல்’ என்பதை இயல்பான நவீனத் தமிழில் தருகிறது; இடிமுழக்கங்கள் பேசும் வெளிப்படுத்தின விசேஷத்தின் ஆளுருவகத்தையும் காக்கிறது.
- source_word: αἱ ἑπτὰ βρονταί
  choice: அந்த ஏழு இடிமுழக்கங்கள்
  rationale: βροντή என்பது ‘இடி’ அல்லது ‘இடிமுழக்கம்.’ ‘இடிமுழக்கங்கள்’ என்பது ஒலி நிகழ்வுகளையும், இங்கு பேசும் செயலாளர்களாகக் காட்டப்படும் பன்மையையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἤμελλον γράφειν
  choice: நான் எழுதவிருந்தேன்
  rationale: μέλλω + வினையெச்சம் குறிக்கும் உடனடி நோக்கம் அல்லது நிகழவிருக்கும் செயலைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: φωνὴν ἐκ τοῦ οὐρανοῦ
  choice: வானத்திலிருந்து ஒரு குரல்
  rationale: குரலின் மூலத்தை மட்டும் குறிப்பிடும் கிரேக்கத்தைப் பின்பற்றுகிறது; பேசுபவர் யார் என்று உரை கூறாத நிலையில் அதை ஊகித்துச் சேர்க்கவில்லை.
- source_word: Σφράγισον
  choice: முத்திரையிட்டு வை
  rationale: வெளிப்படுத்தப்பட்ட செய்தியைப் பதிவு செய்யாமல் அடைத்து வைக்கும் கட்டளையைத் தருகிறது. ‘மறைத்து வை’ என்று விளக்கமாகச் சேர்க்காமல் முத்திரை உருவகத்தையே பாதுகாக்கிறது.
- source_word: ἃ ἐλάλησαν αἱ ἑπτὰ βρονταί
  choice: அந்த ஏழு இடிமுழக்கங்கள் பேசியவற்றை
  rationale: ἃ என்ற நடுநிலைப் பன்மை உறவுப்பெயர், இடிமுழக்கங்கள் பேசிய காரியங்களைக் குறிப்பதைத் தமிழில் பன்மையாகத் தெளிவாகக் காட்டுகிறது.
- source_word: μὴ αὐτὰ γράψῃς
  choice: அவற்றை எழுதாதே
  rationale: αὐτά என்பதன் பன்மையை நேரடியாகக் காக்கிறது. தமிழில் ‘அவற்றை’ இயல்பாக இருப்பதால் ஒருமைத் தொகுப்புப்பொருளாக மாற்றவோ அடிக்குறிப்பு சேர்க்கவோ தேவையில்லை.
theological_decisions:
- issue: வானத்திலிருந்து வந்த குரலின் அடையாளத்தை வெளிப்படையாகக் குறிப்பிடலாமா
  choice: வானத்திலிருந்து ஒரு குரல்
  alternative: வானத்திலிருந்து வந்த தேவனுடைய குரல்
  rationale: கிரேக்க உரை குரல் வானத்திலிருந்து வந்தது என்று மட்டுமே கூறுகிறது; அது தேவனுடைய குரல் என்று இவ்வசனம் வெளிப்படையாக அடையாளப்படுத்தவில்லை. ஆகவே அந்தத் தெளிவின்மையே பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வெளிப்படுத்தின விசேஷத்திற்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. கிரேக்கத்தின் நீண்ட இணைப்பு அமைப்பு தமிழில் இயல்பாக வாசிக்க இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. ‘அந்த’ என்பது முன்சூழலில் ஏற்கெனவே குறிப்பிடப்பட்ட குறிப்பிட்ட ஏழு இடிமுழக்கங்களைக் குறிக்கிறது.
