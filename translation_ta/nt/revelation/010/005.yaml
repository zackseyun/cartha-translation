id: REV.10.5
reference: Revelation 10:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὁ ἄγγελος, ὃν εἶδον ἑστῶτα ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς, ἦρεν τὴν χεῖρα αὐτοῦ τὴν δεξιὰν εἰς τὸν οὐρανόν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/005.yaml
  text: And the angel whom I saw standing on the sea and on the land raised his right hand to heaven[b][a],
translation:
  language: ta
  text: நான் கடலின்மேலும் நிலத்தின்மேலும் நிற்பதைக் கண்ட அந்தத் தூதன், தன் வலது கையை வானத்தை நோக்கி உயர்த்தினான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘வானத்தை நோக்கி’ என்பதற்குப் பதிலாக ‘வானத்துக்கு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος
  choice: தூதன்
  rationale: வெளிப்படுத்தின விசேஷத்தின் சூழலில் இது விண்ணுலகத் தூதனைக் குறிக்கிறது; இயல்பான தமிழ் வேதாகம நடையில் ‘தூதன்’ பொருத்தமானது.
- source_word: ἑστῶτα
  choice: நிற்கக் கண்ட
  rationale: நிறைவுவினைப் பங்கேற்பு தூதனின் அப்போதைய நிலையைச் சுட்டுகிறது; ‘நிற்கக் கண்ட’ என்பது தமிழில் இயல்பாக அந்தக் காட்சிநிலையைத் தருகிறது.
- source_word: ἐπὶ τῆς θαλάσσης
  choice: கடலின்மேல்
  rationale: ἐπί உடன் வரும் உருபின் இடப்பொருளையும் காட்சியின் வலிமையையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἐπὶ τῆς γῆς
  choice: நிலத்தின்மேல்
  rationale: கடலுக்கு எதிரான இடப்பரப்பாக γῆ இங்கு ‘நிலம்’ என்று இயல்பாகப் பொருள்படுகிறது; ‘பூமி’ என்பதும் சாத்தியம்.
- source_word: ἦρεν
  choice: உயர்த்தினான்
  rationale: αἴρω இங்கு சத்தியம் செய்யும் சைகையாகக் கையை மேலே உயர்த்துவதைக் குறிக்கிறது.
- source_word: τὴν χεῖρα αὐτοῦ τὴν δεξιὰν
  choice: தன் வலது கையை
  rationale: கிரேக்கத்தின் உடைமைத் தொடர்பையும் வலது கை என்ற குறிப்பையும் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: εἰς τὸν οὐρανόν
  choice: வானத்தை நோக்கி
  rationale: εἰς குறிக்கும் திசையைத் தெளிவாக வெளிப்படுத்துகிறது; இங்கு οὐρανός வெறும் புலப்படும் வானத்தை மட்டுமல்ல, பரலோகத் திசையையும் சுட்டக்கூடும்.
theological_decisions:
- issue: கடலுடன் மாறுபடுத்தப்படும் γῆ என்பதன் மொழிபெயர்ப்பு
  choice: நிலம்
  alternative: பூமி
  rationale: காட்சியில் தூதன் கடலின்மேலும் அதற்கு மாறான உலர்ந்த நிலத்தின்மேலும் நிற்கிறான். ‘நிலம்’ உடனடி இடவியல் மாறுபாட்டைத் தெளிவாகப் பாதுகாக்கிறது; பரந்த ‘பூமி’ என்ற பொருளும் மொழியியல் ரீதியில் சாத்தியம்.
- issue: οὐρανός என்பதன் மொழிபெயர்ப்பு
  choice: வானம்
  alternative: பரலோகம்
  rationale: தமிழில் கையை ‘வானத்தை நோக்கி’ உயர்த்துதல் இயல்பான திசைச்சொல்லாக்கம்; அடுத்த வசனத்தின் சத்தியச் சூழலால் பரலோகத் தளமும் மறுக்கப்படவில்லை. ‘பரலோகம்’ எனத் தெளிவுபடுத்துவது மூலத்தின் சாத்தியமான காட்சி ambiguity-ஐ குறைக்கும்.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘கடலின்மேலும் நிலத்தின்மேலும்’ என்ற இணை அமைப்பு மூலத்தின் காட்சியையும் சமச்சீரையும் காக்கிறது. அடிக்குறி குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின் இடப்பட்டுள்ளன.
