id: REV.10.6
reference: Revelation 10:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ⸀ὤμοσεν τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων, ὃς ἔκτισεν τὸν οὐρανὸν καὶ τὰ ἐν αὐτῷ καὶ τὴν γῆν καὶ τὰ ἐν αὐτῇ καὶ τὴν θάλασσαν καὶ τὰ ἐν αὐτῇ, ὅτι χρόνος οὐκέτι ἔσται·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/006.yaml
  text: and swore by the one who lives forever and ever[a], who created heaven and the things in it, and the earth and the things on it, and the sea and the things in it, that there will no longer be any delay.
translation:
  language: ta
  text: என்றென்றும் வாழ்கிறவரும், வானத்தையும் அதிலுள்ளவற்றையும், பூமியையும் அதிலுள்ளவற்றையும், கடலையும் அதிலுள்ளவற்றையும் படைத்தவருமானவரின் பேரில் அவர், “இனித் தாமதம் இருக்காது[a]” என்று சத்தியம் செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, நேரடியாகக் கூறினால், “காலம் இனி இருக்காது.” இங்கு கிரேக்கச் சொல்லான χρόνος, தேவனுடைய இறுதி நடவடிக்கைக்கு முன்பிருந்த காத்திருப்பு அல்லது தாமதத்தைக் குறிக்கிறது என்று சூழலின் அடிப்படையில் புரிந்துகொள்ளப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ὤμοσεν
  choice: ஆணையிட்டார்
  rationale: ὀμνύω என்பதன் இறந்தகால வடிவம் ஓர் ஆணையைச் செய்வதைக் குறிக்கிறது. ‘ஆணையிட்டார்’ என்பது இக்காட்சியின் solemn தன்மையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: என்றென்றும் வாழ்கிறவர்மேல்
  rationale: ὀμνύω-வைத் தொடர்ந்து வரும் dative, யார்மேல் ஆணையிடப்படுகிறது என்பதைக் காட்டுகிறது. ζῶντι பெயர்ச்சொல் தன்மையுடைய பங்கேற்புவினையாக உள்ளது; காலமுடிவற்ற வாழ்வை ‘என்றென்றும்’ இயல்பாகக் குறிக்கிறது.
- source_word: ἔκτισεν
  choice: படைத்தவர்
  rationale: κτίζω இங்குள்ள அண்டப் படைப்பு சூழலில் ‘படைத்தல்’ எனப் பொருள்படும். தொடர்புச் சொற்றொடரின் தமிழ்நடைக்கு ஏற்றவாறு பெயரெச்சப் பயனிலையில் தரப்பட்டுள்ளது.
- source_word: τὸν οὐρανὸν
  choice: வானத்தை
  rationale: ஒருமை οὐρανός இங்கு படைப்பின் மேல் மண்டலத்தைக் குறிக்கிறது. ‘வானம்’ என்பது நவீனத் தமிழில் இயல்பானதும் பரவலாகப் புரியக்கூடியதும் ஆகும்.
- source_word: τὰ ἐν αὐτῷ
  choice: அதிலுள்ளவற்றை
  rationale: ‘அதில் உள்ளவை’ என்ற கிரேக்க அமைப்பைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது; வானம், பூமி, கடல் ஆகிய மும்மை அமைப்பின் மீளுருவையும் பேணுகிறது.
- source_word: γῆν
  choice: பூமியை
  rationale: வானம்–பூமி–கடல் என்ற அண்டப் படைப்பு மும்மையில் γῆ என்பது உள்ளூர் நிலப்பகுதியை அல்ல, பூமியையே குறிக்கிறது.
- source_word: θάλασσαν
  choice: கடலை
  rationale: θάλασσα என்பதற்கான நேரான, இயல்பான தமிழ் இணை ‘கடல்’; கிரேக்க ஒருமையும் காக்கப்படுகிறது.
- source_word: ὅτι
  choice: ஆணையின் உள்ளடக்கத்தை நேரடி மேற்கோளாக அறிமுகப்படுத்தல்
  rationale: ஆணையிடும் வினைக்குப் பின் ὅτι காரணத்தை அல்ல, ஆணையின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது. தமிழில் நேரடி மேற்கோள் இதைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: χρόνος οὐκέτι ἔσται
  choice: இனி தாமதம் இருக்காது
  rationale: அடுத்த வசனத்தில் தேவனுடைய மறைதிட்டம் நிறைவேறுவது குறிப்பிடப்படுவதால், χρόνος இங்கு காலம் முற்றிலும் இல்லாமல் போவதைவிடக் காத்திருக்கும் காலம் அல்லது தாமதம் இனி இல்லை என்பதைக் குறிக்கும் வாய்ப்பு அதிகம்.
theological_decisions:
- issue: ஆணை யார்மேல் செய்யப்படுகிறது என்பதன் வெளிப்பாடு
  choice: என்றென்றும் வாழ்கிறவர்மேல் அவர் ஆணையிட்டார்
  alternative: என்றென்றும் வாழ்கிறவரை முன்னிட்டு அவர் ஆணையிட்டார்
  rationale: கிரேக்க dative-ன் oath formula பொருளை ‘மேல் ஆணையிடுதல்’ என்ற வழக்கமான தமிழ் அமைப்பு தெளிவாகக் காட்டுகிறது; படைப்பாளரே ஆணைக்குச் சாட்சியானவர் என்ற உறவையும் பேணுகிறது.
- issue: χρόνος என்பதன் பொருள்
  choice: தாமதம் அல்லது காத்திருக்கும் காலம் இனி இருக்காது
  alternative: காலம் இனி இருக்காது
  rationale: உடனடி சூழல், குறிப்பாக அடுத்த வசனத்தில் தேவனுடைய மறைதிட்டம் நிறைவேறும் அறிவிப்பு, இறுதி நடவடிக்கைக்கு முன் இருந்த தாமதம் முடிவடைகிறது என்ற பொருளை ஆதரிக்கிறது. எனினும் கிரேக்கத்தின் சொற்பொருள் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. வானம்–பூமி–கடல் மற்றும் அவற்றிலுள்ளவை என்ற மூன்று பகுதிகளின் இணை அமைப்பு காக்கப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியம் தமிழின் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டது; ஆணையின் உள்ளடக்கம் நேரடி மேற்கோளாகத் தரப்பட்டது.
