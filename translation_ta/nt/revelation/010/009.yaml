id: REV.10.9
reference: Revelation 10:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ⸀ἀπῆλθα πρὸς τὸν ἄγγελον λέγων αὐτῷ δοῦναί μοι τὸ ⸀βιβλαρίδιον. καὶ λέγει μοι· Λάβε καὶ κατάφαγε αὐτό, καὶ πικρανεῖ σου τὴν κοιλίαν, ἀλλ’ ἐν τῷ στόματί σου ἔσται γλυκὺ ὡς μέλι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/009.yaml
  text: So I went to the angel[a], telling him to give me the little scroll. And he says to me, “Take and eat it, and it will make your stomach bitter[c][b], but in your mouth it will be sweet like honey.”
translation:
  language: ta
  text: அதனால் நான் அந்தத் தூதரிடம் சென்று, அந்தச் சிறிய சுருளை[a] எனக்குக் கொடுக்கும்படி சொன்னேன். அவர் என்னிடம், “எடுத்துக்கொண்டு அதை முழுவதும் சாப்பிடு. அது உன் வயிற்றில் கசப்பை உண்டாக்கும்[b]; ஆனால் உன் வாயில் தேனைப்போல் இனிப்பாக இருக்கும்” என்று சொல்கிறார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சிறிய புத்தகம்.” கிரேக்கச் சொல் குறுமைப் பொருளுடையது; அது ஒரு சிறிய சுருளையையோ சிறு நூலையையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உன் வயிற்றைக் கசப்பாக்கும்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “சொன்னார்.” கிரேக்கத்தில் நிகழ்வை உயிரோட்டமாகக் காட்ட வரலாற்று நிகழ்காலம் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθα πρὸς τὸν ἄγγελον
  choice: நான் அந்தத் தூதரிடம் சென்று
  rationale: ἀπῆλθα என்பதன் நகர்வையும் πρὸς என்பதன் இலக்கையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; ‘விட்டுச் சென்றேன்’ என்பது சூழலில் தேவையற்ற பிரிவுணர்வைத் தரும்.
- source_word: λέγων αὐτῷ δοῦναί μοι
  choice: எனக்குத் தரும்படி சொன்னேன்
  rationale: உடனிகழும் பேச்சையும் இறைச்சொல் கட்டமைப்பையும் இயல்பாக வெளிப்படுத்துகிறது; ‘கேட்டேன்’ என்று மொழிபெயர்த்தால் மூலத்தில் வெளிப்படையாக இல்லாத பணிவான வேண்டுகோள் நிழலைச் சேர்க்கலாம்.
- source_word: βιβλαρίδιον
  choice: சிறிய சுருள்
  rationale: குறுமைப் பொருளையும், பண்டைய எழுத்துப் பொருளின் சுருள் வடிவத்தையும் காக்கிறது; ‘சிறிய புத்தகம்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: λέγει μοι
  choice: என்னிடம் ... சொல்கிறார்
  rationale: கிரேக்க வரலாற்று நிகழ்காலத்தின் உயிரோட்டத்தைத் தமிழிலும் நிகழ்காலத்தால் காக்கிறது.
- source_word: Λάβε
  choice: இதை வாங்கி
  rationale: λαμβάνω இங்குச் செயலுக்கான நேரடி கட்டளையாக உள்ளது. தமிழில் முன் குறிப்பிடப்பட்ட சுருளைச் சுட்ட ‘இதை’ சேர்ப்பது இயல்பானது.
- source_word: κατάφαγε αὐτό
  choice: முழுவதும் சாப்பிடு
  rationale: κατεσθίω என்ற கூட்டு வினையின் தீவிரத்தைக் ‘முழுவதும்’ இயல்பாகத் தெரிவிக்கிறது; ‘விழுங்கிவிடு’ என்பது அளவுக்கு மீறிய வன்மையை உணர்த்தலாம்.
- source_word: πικρανεῖ σου τὴν κοιλίαν
  choice: உன் வயிற்றைக் கசக்கச் செய்யும்
  rationale: உண்பதும் செரிப்பதும் சார்ந்த உடல் விளைவைத் தெளிவாகக் கூறுகிறது; πικραίνω-வின் அடிப்படை ‘கசப்பு’ நிழலைக் காக்க மாற்று வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: γλυκὺ ὡς μέλι
  choice: தேனைப்போல் இனிப்பாக இருக்கும்
  rationale: ஒப்புமையைத் துல்லியமாகவும் நவீனத் தமிழில் இயல்பாகவும் காக்கிறது.
theological_decisions:
- issue: சுருளை உண்ணும் அடையாளச் செயல்
  choice: “வாங்கி முழுவதும் சாப்பிடு” என்ற கண்கூடான கட்டளையை விளக்கமின்றி வைத்தல்
  alternative: இதை ‘தேவனுடைய செய்தியை உள்ளத்தில் ஏற்றுக்கொள்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: வசனம் அடையாளச் செயலை முன்வைக்கிறது; அதன் பொருளை மொழிபெயர்ப்பிலேயே தீர்மானித்துச் சேர்க்காமல், உருவகத்தின் இறையியல் அழுத்தத்தையும் திறந்த நிலையையும் காக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘தூதர்’, ‘சுருள்’, ‘வயிறு’ போன்ற வழக்கமான சொற்கள் பயன்படுத்தப்பட்டன; மூலத்தின் வரலாற்று நிகழ்காலமும் அடையாளச் செயலும் இயன்றவரை காக்கப்பட்டன.
