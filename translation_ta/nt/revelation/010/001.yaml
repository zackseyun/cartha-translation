id: REV.10.1
reference: Revelation 10:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἄλλον ἄγγελον ἰσχυρὸν καταβαίνοντα ἐκ τοῦ οὐρανοῦ, περιβεβλημένον νεφέλην, καὶ ἡ ἶρις ἐπὶ ⸂τὴν κεφαλὴν⸃ αὐτοῦ, καὶ τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος, καὶ οἱ πόδες αὐτοῦ ὡς στῦλοι πυρός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/001.yaml
  text: And I saw another mighty angel coming down from heaven[a], clothed with a cloud, with the rainbow over his head, and his face was like the sun[b], and his feet like pillars of fire.
translation:
  language: ta
  text: 'வெளிப்படுத்தல் 10:1


    மேலும், வானத்திலிருந்து இறங்கி வந்துகொண்டிருந்த வலிமைமிக்க மற்றொரு தேவதூதனை நான் கண்டேன். அவர் ஒரு மேகத்தை ஆடையாக உடுத்தியிருந்தார்; அவருடைய தலைக்கு மேலே ஒரு வானவில்[a] இருந்தது. அவருடைய முகம் சூரியனைப் போலவும், அவருடைய கால்கள் நெருப்புத் தூண்களைப் போலவும் இருந்தன.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கச் சொல் ஒளிவட்டத்தையும் குறிக்கக்கூடும்; ஆனால் “வானவில்” என்பதே அதன் வழக்கமான பொருள். இது வெளிப்படுத்தல் நூலின் உருவகத்துக்கும் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλον ἄγγελον ἰσχυρὸν
  choice: வலிமைமிக்க மற்றொரு தேவதூதன்
  rationale: ἄγγελος என்பதற்கு பொதுவாக ‘தூதன்’ என்றும் பொருள் வரலாம்; ஆனால் பரலோகத்திலிருந்து இறங்கும் இந்தத் தரிசனச் சூழலில் ‘தேவதூதன்’ என்பது இயல்பான குறிப்பு. ἰσχυρός குறிப்பிடும் அசாதாரண வலிமையை ‘வலிமைமிக்க’ தெளிவாகக் காட்டுகிறது.
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: வானத்திலிருந்து இறங்கி வந்துகொண்டிருந்த
  rationale: நிகழ்காலப் பங்கேற்புவினை, யோவான் பார்த்தபோது அந்தத் தேவதூதன் கீழே இறங்கி வந்துகொண்டிருந்த காட்சியைச் சுட்டுகிறது; தமிழ் தொடர்வினை வடிவம் அந்த இயக்கத்தைப் பாதுகாக்கிறது.
- source_word: περιβεβλημένον νεφέλην
  choice: ஒரு மேகத்தை ஆடையாக அணிந்திருந்தார்
  rationale: περιβάλλω என்பதன் நிறைவுற்ற பங்கேற்புவினை, மேகத்தால் சூழப்பட்டிருப்பதையும் அதை ஆடையாக அணிந்திருப்பதையும் குறிக்கிறது. இத்தேர்வு மூலத்தின் ஆடை உருவகத்தைத் தெளிவாக வைத்திருக்கிறது.
- source_word: ἡ ἶρις
  choice: வானவில்
  rationale: ἶρις என்பதன் வழக்கமான பொருள் ‘வானவில்.’ ஒளிவட்டம் என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது; வெளிப்படுத்தல் 4:3-இன் உருவகமும் ‘வானவில்’ என்ற தேர்வை ஆதரிக்கிறது.
- source_word: ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: அவருடைய தலைக்கு மேலே
  rationale: இங்கு ἐπί, தலைக்கு மேலுள்ள நிலையைக் குறிக்கிறது. ‘மேலே’ என்பது இயல்பான தமிழில் காட்சியின் இடத்தொடர்பைப் பாதுகாக்கிறது.
- source_word: τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος
  choice: அவருடைய முகம் சூரியனைப் போல
  rationale: πρόσωπον இங்கு கண்களுக்குத் தெரியும் முகத்தைக் குறிக்கிறது; ὡς காட்டும் நேரடி ஒப்புமையை கூடுதல் விளக்கம் இன்றி பாதுகாக்கிறது.
- source_word: οἱ πόδες αὐτοῦ ὡς στῦλοι πυρός
  choice: அவருடைய கால்கள் நெருப்புத் தூண்களைப் போல
  rationale: πούς என்பதற்கு இங்கு ‘கால்கள்’ என்பது இயல்பான தமிழ்; στῦλοι πυρός என்ற உறுதியான உருவகத்தை ‘நெருப்புத் தூண்கள்’ நேரடியாகவும் தெளிவாகவும் தருகிறது.
theological_decisions:
- issue: வலிமைமிக்க தேவதூதனின் அடையாளம்
  choice: அவரை ‘வலிமைமிக்க மற்றொரு தேவதூதன்’ என்று மட்டும் குறிப்பிடுதல்
  alternative: அவர் படைக்கப்பட்ட ஒரு தேவதூதர் என்று அல்லது கிறிஸ்துவின் வெளிப்பாடு என்று அடையாளப்படுத்துதல்
  rationale: கிரேக்க மூலவாக்கியம் அவரை ἄλλον ἄγγελον ἰσχυρόν என்று மட்டுமே அழைக்கிறது. அவருடைய அடையாளத்தைப் பற்றிய இறையியல் விவாதத்தை மொழிபெயர்ப்பு தீர்மானிக்காமல், மூலத்தின் தெளிவின்மையையும் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. தரிசனக் காட்சியின் இயக்கத்தையும் ஆடை, வானவில், சூரியன், நெருப்புத் தூண்கள் ஆகிய உருவகங்களையும் தெளிவாகப் பாதுகாக்கிறது. தேவதூதரைக் குறிக்க மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; இது அவருடைய இறையியல் அடையாளத்தைத் தீர்மானிப்பதற்காக அல்ல, கண்ணியமான தமிழ் நடைக்காக மட்டுமே.
