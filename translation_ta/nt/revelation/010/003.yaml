id: REV.10.3
reference: Revelation 10:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἔκραξεν φωνῇ μεγάλῃ ὥσπερ λέων μυκᾶται. καὶ ὅτε ἔκραξεν, ἐλάλησαν αἱ ἑπτὰ βρονταὶ τὰς ἑαυτῶν φωνάς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/003.yaml
  text: And he cried out with a loud voice[a], just as a lion roars. And when he cried out, the seven thunders spoke with their own voices.
translation:
  language: ta
  text: அவர் சிங்கம் கர்ஜிப்பதுபோல் உரத்த குரலில் கூக்குரலிட்டார். அவர் கூக்குரலிட்டபோது, ஏழு இடிமுழக்கங்களும் தத்தம் குரல்களில் பேசின.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏழு இடிமுழக்கங்களும் தத்தம் குரல்களை எழுப்பின.” கிரேக்கச் சொற்றொடர் குறிப்பிடத்தக்க வகையில் நேரடியானது; அது இடிமுழக்கங்களைப் பேசுபவையாக ஆளுருவாக்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκραξεν
  choice: கூக்குரலிட்டார்
  rationale: கράζω வலிமையான உரத்த குரலெழுப்புதலைக் குறிக்கிறது. ‘கூக்குரலிட்டார்’ என்பது துயரத்தை மட்டும் குறிக்காமல் அதன் தீவிரத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: φωνῇ μεγάλῃ
  choice: உரத்த குரலில்
  rationale: முறை அல்லது கருவியைக் குறிக்கும் வேற்றுமைத் தொடராக மொழிபெயர்க்கப்பட்டு, φωνή என்ற தெளிவான ‘குரல்’ என்னும் பெயர்ச்சொல் தக்கவைக்கப்படுகிறது.
- source_word: ὥσπερ λέων μυκᾶται
  choice: சிங்கம் கர்ஜிப்பதுபோல்
  rationale: ὥσπερ அறிமுகப்படுத்தும் உவமையையும், சிங்கத்தின் ஒலிக்குப் பொருத்தமான μυκᾶται என்பதன் பொருளையும் இயல்பாகக் காக்கிறது.
- source_word: ὅτε
  choice: போது
  rationale: நிகழ்வுகளின் காலத் தொடர்பை மட்டும் காட்டுகிறது; ‘பிறகு’ என்று வரிசையை மிகையாகத் துல்லியப்படுத்துவதில்லை.
- source_word: αἱ ἑπτὰ βρονταὶ
  choice: ஏழு இடிமுழக்கங்களும்
  rationale: வெறும் ‘இடிகள்’ என்பதைக் காட்டிலும் βρονταί குறிக்கும் முழக்க ஒலியைத் தெளிவாக வெளிப்படுத்துகிறது; எண்ணும் உருவகத் தன்மையும் காக்கப்படுகின்றன.
- source_word: ἐλάλησαν τὰς ἑαυτῶν φωνάς
  choice: தத்தம் குரல்களில் பேசின
  rationale: λαλέω என்பதன் ‘பேசு’ என்ற பொருளையும், ἑαυτῶν என்பதன் வலியுறுத்தலையும் காக்கிறது. ‘தத்தம்’ ஏழு இடிமுழக்கங்கள் ஒவ்வொன்றுக்கும் உரிய குரல் என்ற நுணுக்கத்தை அளிக்கிறது; தமிழில் இயல்புக்காக கருவிப் பொருளுடைய ‘குரல்களில்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: ஏழு இடிமுழக்கங்களின் ஆளுருவாக்கம்
  choice: ‘ஏழு இடிமுழக்கங்களும் தத்தம் குரல்களில் பேசின’ என்று ஆளுருவாக்கத்தைத் தக்கவைத்தல்
  alternative: ‘ஏழு இடிமுழக்கங்களும் முழங்கின’
  rationale: கிரேக்கம் இடிமுழக்கங்களுக்கு வெளிப்படையாகப் பேசும் செயலைக் கொடுக்கிறது (ἐλάλησαν ... φωνάς). வெளிப்படுத்தின விசேஷத்தின் தரிசனப் படிமத்தை வெறும் ஒலி நிகழ்வாகக் குறைக்காமல் தக்கவைக்க வேண்டும்.
translation_notes:
  register: நவீன தரமான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கூக்குரலிட்டார்’, ‘கர்ஜிப்பதுபோல்’ ஆகியவை காட்சியின் வலிமையைத் தருகின்றன; ‘தத்தம் குரல்களில் பேசின’ என்ற சற்றே அபூர்வமான வடிவம் மூலத்தின் திட்டமிட்ட ஆளுருவாக்கத்தைப் பாதுகாக்கிறது.
