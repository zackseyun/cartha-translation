id: REV.19.10
reference: Revelation 19:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἔπεσα ἔμπροσθεν τῶν ποδῶν αὐτοῦ προσκυνῆσαι αὐτῷ. καὶ λέγει μοι· Ὅρα μή· σύνδουλός σού εἰμι καὶ τῶν ἀδελφῶν σου τῶν ἐχόντων τὴν μαρτυρίαν Ἰησοῦ· τῷ θεῷ προσκύνησον· ἡ γὰρ ⸀μαρτυρία Ἰησοῦ ἐστιν τὸ πνεῦμα τῆς προφητείας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/010.yaml
  text: And I fell before his feet to worship him[a]. But he says to me, “See that you do not! I am a fellow servant with you and with your brothers who hold the testimony of Jesus. Worship God[c][b], for the testimony of Jesus is the spirit of prophecy.”
translation:
  language: ta
  text: நான் அவரை வழிபடுவதற்காக அவருடைய கால்களுக்கு முன் விழுந்தேன். ஆனால் அவர் என்னிடம், “அப்படிச் செய்யாதே! நானும் உன்னோடும், இயேசுவின் சாட்சியைக் கொண்டிருக்கும் உன் சகோதரர்களோடும் சேர்ந்து சக அடிமையாக இருக்கிறேன்.[b][c] கடவுளை வழிபடு! ஏனெனில் இயேசுவின் சாட்சியே தீர்க்கதரிசனத்தின் ஆவியாக இருக்கிறது” என்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இயேசுவைக் குறித்த சாட்சி” என்றும், “இயேசு அளித்த சாட்சி” என்றும் பொருள் கொள்ளலாம். இதே இருபொருள் வாய்ப்பு இவ்வசனத்தில் இத்தொடர் முதலில் வரும் இடத்துக்கும் பொருந்தும்.
    reason: alternative_reading
  - marker: b
    text: “சகோதர சகோதரிகள்” என்றும் பொருள் கொள்ளலாம்; இங்கு “சகோதரர்கள்” என்பது சக விசுவாசிகள் அனைவரையும் பிரதிநிதித்துவமாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது “சக ஊழியன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσα ἔμπροσθεν τῶν ποδῶν αὐτοῦ
  choice: அவருடைய கால்களுக்கு முன்பாக விழுந்தேன்
  rationale: ἔμπροσθεν என்பதன் ‘முன்பாக’ என்ற இடப்பொருளையும், உடல்நிலையைக் குறிக்கும் ‘விழுந்தேன்’ என்பதையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: προσκυνῆσαι αὐτῷ / προσκύνησον
  choice: அவரை வழிபடுவதற்காக / கடவுளை வழிபடு
  rationale: தூதன் அந்தச் செயலை மறுத்து அதை கடவுளை நோக்கித் திருப்புவதால், இங்கு προσκυνέω வெறும் வணக்கமோ தலைவணங்குதலோ அல்ல, சமய வழிபாட்டைக் குறிக்கிறது.
- source_word: Ὅρα μή
  choice: அப்படிச் செய்யாதே!
  rationale: கிரேக்கத் தொடரின் திடீர், வலுவான தடையை இயல்பான நவீனத் தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: σύνδουλός
  choice: சக அடிமை
  rationale: தூதனும் யோவானும் கடவுளுக்குக் கீழ்ப்பட்ட ஒரே அடிமைநிலையில் இருப்பதைச் சொல் வலியுறுத்துகிறது; ‘உடன் ஊழியன்’ என்பது அந்தக் கீழ்ப்பட்ட நிலையை மெலிதாக்கக்கூடும்.
- source_word: ἀδελφῶν σου
  choice: உன் சகோதரர்கள்
  rationale: மூலத்தின் ஆண்பால் பன்மையை நேரடியாகப் பாதுகாக்கிறது; சூழலில் இது சக விசுவாசிகளைப் பிரதிநிதித்துவமாகக் குறிக்கக்கூடும் என்பதைக் காலடிக்குறிப்பு விளக்குகிறது.
- source_word: τῶν ἐχόντων τὴν μαρτυρίαν Ἰησοῦ
  choice: இயேசுவினுடைய சாட்சியைப் பற்றிக்கொண்டிருக்கிற
  rationale: ἔχω என்பதிலுள்ள உடைமை/பற்றிக்கொள்ளுதல் கருத்தைத் தருகிறது; Ἰησοῦ என்ற வேற்றுமைத்தொடரின் இருபொருள் வாய்ப்பையும் தீர்மானிக்காமல் வைத்திருக்கிறது.
- source_word: μαρτυρία Ἰησοῦ
  choice: இயேசுவினுடைய சாட்சி
  rationale: இது இயேசுவைக் குறித்த சாட்சியா அல்லது இயேசு அளிக்கும் சாட்சியா என்பதை மூல கிரேக்கம் தீர்மானிக்காததால், தமிழ் உடைமைத்தொடர் அந்த மெய்யான தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: πνεῦμα τῆς προφητείας
  choice: தீர்க்கதரிசனத்தின் ஆவி
  rationale: πνεῦμα என்பதன் நேரடியானதும் இறையியல் முக்கியத்துவமுள்ளதுமான ‘ஆவி’ என்ற பொருளைப் பாதுகாக்கிறது; அதை ‘சாரம்’ என்று விளக்கி விடவில்லை.
theological_decisions:
- issue: ‘இயேசுவினுடைய சாட்சி’ என்பதில் Ἰησοῦ என்ற வேற்றுமைத்தொடரின் பொருள்
  choice: இருபொருள் வாய்ப்பையும் தக்கவைக்கும் ‘இயேசுவினுடைய சாட்சி’
  alternative: ‘இயேசுவைக் குறித்த சாட்சி’ அல்லது ‘இயேசு அளித்த சாட்சி’
  rationale: மூலத்தில் இது objective genitive ஆகவும் subjective genitive ஆகவும் புரிந்துகொள்ளப்படலாம். எந்த ஒரு பொருளையும் முதன்மை உரையில் கட்டாயப்படுத்தாமல், இரண்டையும் காலடிக்குறிப்பில் தருவது மூலத்தின் இறையியல் இழுபறியைப் பாதுகாக்கிறது.
- issue: σύνδουλος என்பதன் அடிமைநிலை
  choice: சக அடிமை
  alternative: சக ஊழியன்
  rationale: தூதன் வழிபாட்டுக்குரியவன் அல்ல; யோவானையும் மற்ற விசுவாசிகளையும் போலவே கடவுளுக்குக் கீழ்ப்பட்டவன் என்பதே இங்கு வலியுறுத்தப்படுகிறது. ஆகவே அடிமைநிலையை வெளிப்படையாகக் காட்டும் சொல் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. திடீர் தடைக்கு இயல்பான ‘அப்படிச் செய்யாதே!’ பயன்படுத்தப்பட்டது. ‘சக அடிமை’ சற்றுக் கடினமாகத் தோன்றினாலும், மூலத்தின் பகிரப்பட்ட அடிமைநிலையை மறைக்காமல் இருக்கத் திட்டமிட்டு வைக்கப்பட்டது; மென்மையான மாற்று காலடிக்குறிப்பில் தரப்பட்டுள்ளது.
