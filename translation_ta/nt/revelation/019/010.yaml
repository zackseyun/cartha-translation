revisions:
- from: நான் அவரை வழிபடுவதற்காக அவருடைய கால்களுக்கு முன்பாக விழுந்தேன். ஆனால் அவர் என்னிடம், “அப்படிச் செய்யாதே! நான் உனக்கும், இயேசுவினுடைய சாட்சியைப் பற்றிக்கொண்டிருக்கிற உன் சகோதரர்களுக்கும்[b] சக அடிமை[c]. கடவுளை வழிபடு! ஏனெனில் இயேசுவினுடைய சாட்சியே[a] தீர்க்கதரிசனத்தின் ஆவியாக இருக்கிறது” என்றார்.
  to: நான் அவரை வழிபடுவதற்காக அவருடைய கால்களுக்கு முன் விழுந்தேன். ஆனால் அவர் என்னிடம், “அப்படிச் செய்யாதே! நானும் உன்னோடும், இயேசுவின் சாட்சியைக் கொண்டிருக்கும் உன் சகோதரர்களோடும் சேர்ந்து சக அடிமையாக இருக்கிறேன்.[b][c] கடவுளை வழிபடு! ஏனெனில் இயேசுவின் சாட்சியே தீர்க்கதரிசனத்தின் ஆவியாக இருக்கிறது” என்றார்.[a]
