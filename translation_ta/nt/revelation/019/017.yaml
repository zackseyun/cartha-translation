  rationale: ἐν τῷ ἡλίῳ என்பதன் வியப்பூட்டும் நேரடிக் காட்சியை விளக்கவுரையால் பாதுகாப்பான உருவகமாக மாற்றாமல் அப்படியே வைக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. தரிசனத்தின் வியப்பூட்டும் காட்சி மென்மைப்படுத்தப்படவில்லை; தேவையற்ற சமயப்பிரிவு சார்ந்த விளக்கங்களும் சேர்க்கப்படவில்லை.
