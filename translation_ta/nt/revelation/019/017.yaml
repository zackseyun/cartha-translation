source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἕνα ἄγγελον ἑστῶτα ἐν τῷ ἡλίῳ, καὶ ⸀ἔκραξεν φωνῇ μεγάλῃ λέγων πᾶσι τοῖς ὀρνέοις τοῖς πετομένοις ἐν μεσουρανήματι· Δεῦτε συνάχθητε εἰς τὸ δεῖπνον τὸ μέγα τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/017.yaml
  text: And I saw one angel standing in the sun[a], and he cried out with a loud voice, saying to all the birds flying in midheaven, “Come, gather for the great supper of God,”
translation:
  language: ta
  text: மேலும், சூரியனில் நின்றுகொண்டிருந்த ஒரு தூதனை நான் கண்டேன். அவன் வானின் நடுவில்[a] பறந்துகொண்டிருந்த அனைத்துப் பறவைகளிடமும் உரத்த குரலில் கூவி, “வாருங்கள், கடவுளின் பெரிய விருந்துக்காக ஒன்றுகூடுங்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நடுவானில்” அல்லது “வானின் நடுப்பகுதியில்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் μεσουράνημα; இது வெளிப்படுத்துதல் நூலில் தனிச்சிறப்புடன் பயன்படுத்தப்படும் தரிசன மொழி.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕνα ἄγγελον
  choice: ஓர் தூதனை
  rationale: கிரேக்கத்தில் உள்ள ἕνα என்ற எண்ணுச் சொல்லை முற்றிலும் நீக்காமல் ‘ஓர்’ எனத் தக்கவைக்கிறது; அதேவேளை நவீன தமிழில் இயல்பாக ஒலிக்கிறது.
- source_word: ἑστῶτα ἐν τῷ ἡλίῳ
  choice: சூரியனில் நின்றுகொண்டிருந்த
  rationale: ἐν என்பதையும் வெளிப்படுத்துதலுக்குரிய வியப்பூட்டும் காட்சியையும் விளக்கி மென்மைப்படுத்தாமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: உரத்த குரலில் ... கூவினான்
  rationale: κράζω என்பதன் வலிமையையும் φωνῇ μεγάλῃ என்ற சொற்றொடரையும் தெளிவான, இயல்பான தமிழில் தருகிறது.
- source_word: πᾶσι τοῖς ὀρνέοις
  choice: எல்லாப் பறவைகளையும் நோக்கி
  rationale: ὄρνεον என்பது பொதுவாகப் ‘பறவை’ எனப் பொருள்படும்; இரைகொல்லிப் பறவைகள் அல்லது பிணந்தின்னிப் பறவைகள் என்ற சூழல்சார் பொருளைச் சொல்லுக்குள் இறக்குமதி செய்யவில்லை.
- source_word: τοῖς πετομένοις ἐν μεσουρανήματι
  choice: வானத்தின் நடுவில் பறந்துகொண்டிருந்த
  rationale: μεσουράνημα குறிக்கும் வானின் நடுப்பகுதி/உச்சிப்பகுதி என்ற வெளிப்படுத்துதல் நூலுக்குரிய காட்சியை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: Δεῦτε
  choice: வாருங்கள்
  rationale: நேரடியான அழைப்பையும் பன்மை ஏவலையும் மரியாதையான, இயல்பான தமிழில் தருகிறது.
- source_word: συνάχθητε
  choice: ஒன்றுகூடுங்கள்
  rationale: செயப்பாட்டு வடிவத்தைத் தமிழில் இயல்பான தன்னிலைச் செயற்பாடாகக் கொடுத்து, கூட்டமாகச் சேரும் காட்சியைப் பாதுகாக்கிறது.
- source_word: εἰς τὸ δεῖπνον τὸ μέγα τοῦ θεοῦ
  choice: கடவுளின் மாபெரும் விருந்துக்காக
  rationale: δεῖπνον என்பதைக் சூழலுக்கு ஏற்ற ‘விருந்து’ என வழங்கி, μέγα என்பதன் வலிமையையும் τοῦ θεοῦ என்ற உரிமைத் தொடர்பையும் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: வெளிப்படுத்துதலுக்குரிய இடவியல் காட்சி
  choice: சூரியனில் நின்றுகொண்டிருந்த
