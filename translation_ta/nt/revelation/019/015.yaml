id: REV.19.15
reference: Revelation 19:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐκ τοῦ στόματος αὐτοῦ ἐκπορεύεται ⸀ῥομφαία ὀξεῖα, ἵνα ἐν αὐτῇ πατάξῃ τὰ ἔθνη, καὶ αὐτὸς ποιμανεῖ αὐτοὺς ἐν ῥάβδῳ σιδηρᾷ· καὶ αὐτὸς πατεῖ τὴν ληνὸν τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς τοῦ θεοῦ τοῦ παντοκράτορος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/015.yaml
  text: And from his mouth comes a sharp sword[a], so that with it he may strike the nations, and he himself will shepherd them with an iron rod[b]; and he himself treads the winepress of the wine of the fury of the wrath of God the Almighty.
translation:
  language: ta
  text: அவருடைய வாயிலிருந்து கூர்மையான ஒரு வாள்[a] புறப்படுகிறது; அதனால் அவர் நாடுகளைத் தாக்குவதற்காக. அவரே அவர்களை இரும்புக் கோலால் மேய்ப்பார்[b]. எல்லாம் வல்ல தேவனுடைய கோபத்தின் சீற்றமாகிய திராட்சரசத்தின் ஆலையை அவரே மிதிக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு பயன்படுத்தப்பட்டுள்ள கிரேக்கச் சொல் பெரிய வாளைக் குறிக்கக்கூடும்.
    reason: lexical_nuance
  - marker: b
    text: அல்லது, “அவர்களை இரும்புக் கோலால் ஆள்வார்.” கிரேக்க வினைச்சொல்லின் நேரடிப் பொருள் “மேய்ப்பார்”; சங்கீதம் 2-ஐ எதிரொலிக்கும் இவ்விடத்தில் அது அரசாட்சி அதிகாரத்தையும் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύεται
  choice: புறப்படுகிறது
  rationale: வாயிலிருந்து தொடர்ந்து வெளிவரும் உயிரோட்டமான நிகழ்காலக் காட்சியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ῥομφαία ὀξεῖα
  choice: கூர்மையான ஒரு வாள்
  rationale: ῥομφαία பெரிய வகை வாளைக் குறிக்கக்கூடும்; ஆனால் குறிப்பிட்ட ஆயுத வடிவத்தை மிகையாக நிர்ணயிக்காமல், ὀξεῖα என்பதையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἵνα ἐν αὐτῇ πατάξῃ τὰ ἔθνη
  choice: அதைக் கொண்டு அவர் நாடுகளைத் தாக்கும்படியாக
  rationale: ἵνα நோக்கத்தைச் சுட்டுகிறது; ἐν αὐτῇ இங்கு கருவிப்பொருளில் ‘அதைக் கொண்டு’ என்றும், πατάξῃ கூடுதலாக ‘வீழ்த்த’ என்பதைக் சேர்க்காமல் ‘தாக்க’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ποιμανεῖ
  choice: மேய்ப்பார்
  rationale: சங்கீதம் 2-ஐ எதிரொலிக்கும் அரசாட்சி மற்றும் நியாயத்தீர்ப்புச் சூழலிலும், மூல வினைச்சொல்லின் மேய்ப்பர் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: இரும்புக் கோலால்
  rationale: ἐν என்பதன் கருவிப்பொருளையும், ῥάβδος σιδηρᾶ என்ற வலிமைமிக்க ஆட்சிக் குறியீட்டையும் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: πατεῖ τὴν ληνὸν
  choice: திராட்சரசத்தின் ஆலையை ... மிதிக்கிறார்
  rationale: தீர்க்கதரிசன நியாயத்தீர்ப்புக் காட்சியான திராட்சை ஆலையை மிதித்தலை, மூலத்தின் உயிரோட்டமான நிகழ்காலத்துடன் பாதுகாக்கிறது.
- source_word: τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς
  choice: கோபத்தின் சீற்றமாகிய திராட்சரசத்தின்
  rationale: θυμός மற்றும் ὀργή ஆகிய இரு தீவிரச் சொற்களையும் முறையே ‘சீற்றம்’, ‘கோபம்’ என்று வேறுபடுத்தி, அடுக்கப்பட்ட உருபுத்தொடரின் வலிமையைப் பாதுகாக்கிறது.
- source_word: τοῦ θεοῦ τοῦ παντοκράτορος
  choice: எல்லாம் வல்ல தேவனுடைய
  rationale: παντοκράτωρ என்ற இறைப்பட்டத்தைத் தெளிவான, வழக்கிலுள்ள தமிழ் வடிவில் தருகிறது.
theological_decisions:
- issue: நியாயத்தீர்ப்புச் சூழலிலும் சங்கீதம் 2 எதிரொலியிலும் ποιμανεῖ என்பதன் பொருள்
  choice: அவர்களை இரும்புக் கோலால் மேய்ப்பார்
  alternative: அவர்களை இரும்புக் கோலால் ஆள்வார்
  rationale: ‘மேய்ப்பார்’ என்பது மூல உருவகத்தைப் பாதுகாத்து, மேசியாவின் ஆட்சியிலுள்ள மேய்ப்புப் பணிக்கும் நியாயத்தீர்ப்பு அதிகாரத்திற்கும் இடையிலான பதற்றத்தைத் தீர்த்துவிடாமல் வைக்கிறது; ‘ஆள்வார்’ என்ற சூழல்சார் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: θυμοῦ τῆς ὀργῆς என்ற இரட்டைக் கோப வெளிப்பாடு
  choice: கோபத்தின் சீற்றம்
  alternative: கடுங்கோபம்
  rationale: ஒரே சொல்லாகச் சுருக்காமல், மூலத்தில் உள்ள இரண்டு நெருங்கிய ஆனால் தனித்த சொற்களின் தீவிரத்தையும் அடுக்கையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. மூலத்தின் உயிரோட்டமான நிகழ்காலம், மேய்ப்பர் உருவகம், நியாயத்தீர்ப்பின் தீவிரமான அடுக்குச் சொற்றொடர் ஆகியவை இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
