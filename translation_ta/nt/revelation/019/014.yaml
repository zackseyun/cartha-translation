source:
  edition: SBLGNT
  text: καὶ τὰ στρατεύματα ⸀τὰ ἐν τῷ οὐρανῷ ἠκολούθει αὐτῷ ἐφ’ ἵπποις λευκοῖς, ἐνδεδυμένοι βύσσινον λευκὸν καθαρόν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/014.yaml
  text: And the armies in heaven were following him on white horses[a], clothed in fine linen, white and clean.
translation:
  language: ta
  text: பரலோகத்தில் உள்ள படைகள்[a] வெள்ளைக் குதிரைகளின்மேல் அவரைப் பின்தொடர்ந்து கொண்டிருந்தன. அவை வெண்மையும் சுத்தமுமான மெல்லிய நாரிழைத் துணியாலான ஆடைகளை அணிந்திருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரலோகத்தின் படைகள்.” கிரேக்கத் தொடர் சொல்லுக்குச் சொல், “படைகள்—பரலோகத்தில் இருப்பவை” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατεύματα
  choice: படைகள்
  rationale: ஒழுங்கமைந்த இராணுவப் படைகளைக் குறிக்கும் பன்மைச் சொல்லை நவீன தமிழில் நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: τὰ ἐν τῷ οὐρανῷ
  choice: பரலோகத்தில் இருந்த
  rationale: இது படைகளின் இருப்பிடத்தைச் சுட்டும் தொடராக இருப்பதால், அவை பரலோகத்தில் இருப்பதைத் தெளிவாகக் கூறுகிறது; அவற்றின் அடையாளத்தை விளக்கிச் சேர்ப்பதில்லை.
- source_word: ἠκολούθει αὐτῷ
  choice: அவரைப் பின்தொடர்ந்து வந்தன
  rationale: காட்சியில் தொடர்ந்துகொண்டிருந்த செயலை இயல்பான தமிழில் வெளிப்படுத்தி, இறந்தகால முற்றுவினையாக மட்டும் சுருக்குவதைத் தவிர்க்கிறது.
- source_word: ἐφ’ ἵπποις λευκοῖς
  choice: வெள்ளைக் குதிரைகளின்மேல்
  rationale: படைகள் குதிரைகளில் ஏறிப் பின்தொடர்ந்ததையும் λευκός என்ற நிறச் சொல்லையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἐνδεδυμένοι
  choice: அணிந்திருந்தன
  rationale: படைகள் ஆடை அணிந்த நிலையில் இருந்ததை இயல்பான, கண்ணியமான தமிழில் தெரிவிக்கிறது.
- source_word: βύσσινον
  choice: மெல்லிய நார்த்துணி ஆடைகள்
  rationale: விலையுயர்ந்த, நேர்த்தியான linen வகைத் துணியைக் குறிக்கும் சொல்லை, பழமையான ‘வஸ்திரம்’ போன்ற சொல்லின்றி புரிந்துகொள்ளக்கூடிய தமிழில் தருகிறது.
- source_word: λευκὸν καθαρόν
  choice: வெள்ளையும் சுத்தமுமான
  rationale: இரு பெயரடைகளையும் தனித்தனியாகப் பாதுகாத்து, καθαρόν என்பதற்கு தேவையற்ற விதத்தில் ‘தூய்மையான’ என்ற இறையியல் பொருளை மட்டும் திணிக்காமல் காட்சி சார்ந்த சுத்தத்தையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பரலோகப் படைகளின் அடையாளம்
  choice: ‘பரலோகத்தில் இருந்த படைகள்’ என்று விளக்கவுரையின்றி மொழிபெயர்த்தல்
  alternative: அவற்றை தேவதூதர்கள், பரிசுத்தவான்கள், அல்லது இரு குழுக்களும் என்று குறிப்பாக அடையாளப்படுத்துதல்
  rationale: இவ்வசனம் அவற்றின் இருப்பிடத்தையும் தோற்றத்தையும் கூறுகிறதே தவிர, அவை யார் என்பதை வெளிப்படையாகத் தீர்மானிப்பதில்லை. ஆகவே மூலத்தில் உள்ள இறையியல் திறந்தநிலை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வெளிப்படுத்தின விசேஷத்தின் உயர்ந்த காட்சிநடைக்கு ஏற்ற கண்ணியமான மொழிநடை பயன்படுத்தப்பட்டுள்ளது. ‘பின்தொடர்ந்து வந்தன’ என்பது தொடர்ச்சியான காட்சி இயக்கத்தை இயல்பாகக் காட்டுகிறது; படைகளின் அடையாளம் விளக்கிச் சேர்க்கப்படவில்லை.
