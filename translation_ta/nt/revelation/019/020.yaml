id: REV.19.20
reference: Revelation 19:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐπιάσθη τὸ θηρίον καὶ ⸂μετ’ αὐτοῦ ὁ⸃ ψευδοπροφήτης ὁ ποιήσας τὰ σημεῖα ἐνώπιον αὐτοῦ, ἐν οἷς ἐπλάνησεν τοὺς λαβόντας τὸ χάραγμα τοῦ θηρίου καὶ τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ· ζῶντες ἐβλήθησαν οἱ δύο εἰς τὴν λίμνην τοῦ πυρὸς ⸂τῆς καιομένης⸃ ἐν θείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/020.yaml
  text: And the beast was captured[a], and with it the false prophet who had performed the signs in its presence, by which he deceived those who had received the mark of the beast and those who worshiped its image[b]. The two of them were thrown alive into the lake of fire that burns with sulfur.
translation:
  language: ta
  text: மிருகம் பிடிக்கப்பட்டது; அதனுடன், அதன் முன்னிலையில் அடையாளங்களைச் செய்த பொய்த்தீர்க்கதரிசியும் பிடிக்கப்பட்டான். அந்த அடையாளங்களால் அவன், மிருகத்தின் முத்திரையைப் பெற்றவர்களையும் அதன் உருவத்தை வழிபட்டவர்களையும் ஏமாற்றினான். மிருகமும் பொய்த்தீர்க்கதரிசியும் ஆகிய அந்த இருவரும் உயிரோடு, கந்தகத்தால் எரியும் நெருப்பு ஏரிக்குள் வீசப்பட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιάσθη
  choice: பிடிக்கப்பட்டது / பிடிக்கப்பட்டான்
  rationale: πιάζω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவம் கைது செய்தல் அல்லது கைப்பற்றுதல் என்ற பொருளைத் தருகிறது. தமிழில் இயல்பான செயப்பாட்டு நடையைப் பேணுகிறது; கிரேக்கத்தில் ஒரே வினை இரு எழுவாய்களுக்கும் பொருந்தினாலும், தமிழின் தெளிவுக்காக இரண்டாவது இடத்தில் மீண்டும் வழங்கப்பட்டுள்ளது.
- source_word: θηρίον
  choice: மிருகம்
  rationale: வெளிப்படுத்தின விசேஷத்தில் தொடர்ச்சியாக வரும் அபோகலிப்டிக் உருவகத்தையும் அடிப்படைச் சொல்லாட்சியையும் பேணுகிறது.
- source_word: ψευδοπροφήτης
  choice: பொய்த்தீர்க்கதரிசி
  rationale: கூட்டுச்சொல்லின் நேரடியான, தமிழ்க் கிறிஸ்தவ வாசகர்களுக்கு அறிமுகமான மொழிபெயர்ப்பு.
- source_word: ὁ ποιήσας τὰ σημεῖα
  choice: அடையாளங்களைச் செய்த
  rationale: σημεῖα என்பதில் வெறும் அற்புதச் செயலைவிட குறிப்புணர்த்தும் தன்மை முன்னிலையாக இருப்பதால் ‘அடையாளங்கள்’ என வழங்கப்பட்டுள்ளது. பெயரெச்சத் தொடர் பிரதான நிகழ்வுக்கு முந்திய செயலைச் சூழலிலேயே தெளிவாக்குகிறது.
- source_word: ἐνώπιον αὐτοῦ
  choice: அதன் முன்னிலையில்
  rationale: ἐνώπιον என்பதன் ‘முன்னிலையில்’ என்ற பொருளை இயல்பாக வெளிப்படுத்தி, αὐτοῦ மிருகத்தைக் குறிப்பதைத் தெளிவாக்குகிறது.
- source_word: ἐν οἷς
  choice: அந்த அடையாளங்களால்
  rationale: அடையாளங்களே ஏமாற்றுவதற்கான கருவிகளாக இருந்தன என்ற கருவிப்பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐπλάνησεν
  choice: ஏமாற்றினான்
  rationale: தவறாக வழிநடத்துதல் அல்லது வஞ்சித்தல் என்ற பொருளைச் சூழலுக்கு ஏற்ற இயல்பான தமிழில் தருகிறது.
- source_word: χάραγμα
  choice: முத்திரை
  rationale: பொறிக்கப்பட்ட அடையாளம் அல்லது உரிமைக் குறி என்ற கருத்தையும் வெளிப்படுத்தின விசேஷத்தில் நிலைபெற்ற சொல்லாட்சியையும் பேணுகிறது.
- source_word: προσκυνοῦντας
  choice: வழிபட்டவர்களை
  rationale: இங்கு உடல் வணக்கத்தை மட்டும் அல்லாமல் சமய வழிபாட்டைக் குறிக்கும் பொருள் சூழலுக்கு ஏற்றது.
- source_word: ζῶντες
  choice: உயிரோடு
  rationale: இருவரும் உயிருடன் இருந்த நிலையிலேயே வீசப்பட்டனர் என்ற வலியுறுத்தலைச் சுருக்கமாகவும் நேரடியாகவும் பேணுகிறது.
- source_word: λίμνην τοῦ πυρὸς τῆς καιομένης ἐν θείῳ
  choice: கந்தகத்தால் எரியும் நெருப்பு ஏரி
  rationale: தீர்ப்பின் அபோகலிப்டிக் உருவகத்தை விளக்கவுரையாக்காமல் அப்படியே பேணுகிறது; θεῖον என்பதற்கு நவீன அறிவியல் வழக்கிலுள்ள ‘கந்தகம்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: மிருகத்தைக் குறிக்கும் பதிலிப்பெயர்கள்
  choice: ‘அதன்’ என்று அஃறிணையில் குறிப்பிடுதல்
  alternative: ‘அவனுடைய’ என்று ஆள்மைப்படுத்திக் குறிப்பிடுதல்
  rationale: θηρίον கிரேக்கத்தில் நடுநிலைப் பாலினப் பெயர்ச்சொல். தமிழிலும் ‘மிருகம்’ இயல்பாக அஃறிணையில் குறிப்பிடப்படுவதால், வசனம் வெளிப்படையாகக் கூறுவதைவிட அதிகமாக அதை ஆள்மைப்படுத்துவது தவிர்க்கப்படுகிறது.
- issue: இறுதித் தீர்ப்பின் உருவகம்
  choice: ‘கந்தகத்தால் எரியும் நெருப்பு ஏரி’ என்று உருவகத்தை நேரடியாகப் பேணுதல்
  alternative: நரகம் அல்லது நித்திய வேதனை என்று விளக்கிப் பரிமாற்றுதல்
  rationale: வசனத்தின் தெளிவான அபோகலிப்டிக் படிமத்தைப் பேணி, இதில் நேரடியாகச் சொல்லப்படாத பிற்கால இறையியல் விளக்கங்களைச் சேர்க்கவில்லை.
- issue: இருவரும் உயிரோடு வீசப்படுதல்
  choice: ‘அவர்கள் இருவரும் உயிரோடு ... வீசப்பட்டார்கள்’
  alternative: இருவரும் கொல்லப்பட்ட பின் தண்டிக்கப்பட்டதாக விளக்குதல்
  rationale: ζῶντες என்ற சொல்லின் வெளிப்படையான பதற்றத்தையும் தீர்ப்புக் காட்சியின் தீவிரத்தையும் தீர்த்துவிடாமல் அப்படியே பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியம் தமிழின் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. ‘பொய்த்தீர்க்கதரிசி’, ‘முத்திரை’, ‘நெருப்பு ஏரி’ ஆகியவை அறிமுகமான வேதாகமச் சொற்களாக இருப்பதால் பேணப்பட்டுள்ளன; தேவையற்ற விளக்கச் சொற்கள் சேர்க்கப்படவில்லை.
