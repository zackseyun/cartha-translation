- source_word: ἐν τῷ οὐρανῷ
  choice: பரலோகத்தில்
  rationale: இங்கு οὐρανός வான்வெளியையல்ல, பரலோக மண்டலத்தைக் குறிக்கிறது.
- source_word: λεγόντων
  choice: அவர்கள் ... என்று சொன்னார்கள்
  rationale: பன்மை நிகழ்காலப் பங்கேற்புச் சொல்லின் கருத்தைத் தெளிவான தமிழ் வாக்கியமாக மாற்றி, குரல் கூட்டத்தினருடையது என்பதை வெளிப்படுத்துகிறது.
- source_word: Ἁλληλουϊά
  choice: அல்லேலூயா
  rationale: கிரேக்கத்தில் ஒலிபெயர்க்கப்பட்ட எபிரெய வழிபாட்டு முழக்கத்தை, தமிழ்க் கிறிஸ்தவ வழக்கில் அறியப்பட்ட வடிவில் ஒலிபெயர்க்கிறது; அதன் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἡ σωτηρία
  choice: மீட்பு
  rationale: σωτηρία குறிக்கும் காப்பாற்றும் விடுதலையை எளிய, தற்போதைய தமிழில் தெரிவிக்கிறது.
- source_word: ἡ δόξα
  choice: மகிமை
  rationale: வழிபாட்டு மற்றும் இறைச் சூழலில் δόξα என்பதற்கான இயல்பான தமிழ் இணைச்சொல்.
- source_word: ἡ δύναμις
  choice: வல்லமை
  rationale: இறைவனுடைய ஆற்றலையும் வலிமையையும் வழிபாட்டு நடைக்கு ஏற்ற கண்ணியமான தமிழில் தெரிவிக்கிறது.
- source_word: τοῦ θεοῦ ἡμῶν
  choice: நம் கடவுளுக்கே உரியவை
  rationale: கிரேக்க உரிமை/சார்பு வேற்றுமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘-க்கே’ என்பது இந்தப் புகழுரையின் வலியுறுத்தலைத் தருகிறது.
theological_decisions:
- issue: Ἁλληλουϊά என்ற பரலோக வழிபாட்டு முழக்கத்தின் மொழிபெயர்ப்பு
  choice: அல்லேலூயா
  alternative: “யாவைப் போற்றுங்கள்” அல்லது “ஆண்டவரைப் போற்றுங்கள்”
  rationale: ஒலிபெயர்ப்பு அதன் எபிரெய-கிரேக்க வழிபாட்டு அடையாளத்தையும் பரவலாக அறியப்பட்ட வடிவத்தையும் பாதுகாக்கிறது. பொருளை அடிக்குறிப்பில் தருவது வாசகருக்கு விளக்கத்தையும் வழங்குகிறது.
- issue: σωτηρία என்பதன் பொருள்
  choice: மீட்பு
  alternative: இரட்சிப்பு
  rationale: ‘மீட்பு’ என்பது கடவுள் அளிக்கும் காப்பாற்றும் விடுதலையைப் பொதுவாசகருக்குப் புரியும் நவீன தமிழில் தெரிவிக்கிறது; குறிப்பிட்ட சமயக்குழு வழக்குச் சொல்லைத் தேவையின்றி முன்னிறுத்தாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் வழிபாட்டுக் கண்ணியத்தைத் தக்கவைக்கும் வகையிலும் மொழிநடை அமைக்கப்பட்டுள்ளது. ὡς குறிக்கும் செவிப்புல ஒப்புமை ‘போன்றதைக்’ என்பதால் தீர்மானிக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
