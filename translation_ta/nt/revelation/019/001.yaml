  yaml_path: translation/nt/revelation/019/001.yaml
  text: After these things I heard what seemed to be the loud voice of a great multitude in heaven[a], saying, “Hallelujah! Salvation and glory and power belong to our God,”
translation:
  language: ta
  text: இவற்றுக்குப் பிறகு, விண்ணகத்தில் ஒரு பெருந்திரளான கூட்டத்தின் உரத்த குரல் போன்றதைக் கேட்டேன். அவர்கள், “அல்லேலூயா![a] மீட்பும் மகிமையும் வல்லமையும் நம் கடவுளுக்கு உரியவை” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “யாவைப் போற்றுங்கள்” அல்லது “ஆண்டவரைப் போற்றுங்கள்.”
    reason: Ἁλληλουϊά என்ற எபிரெய வழிபாட்டு முழக்கத்தின் சொற்பொருள் மாற்றுகளை வழங்குகிறது.
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: இவற்றுக்குப் பிறகு
  rationale: தரிசன நிகழ்வுகளின் தொடர்ச்சியைக் குறிக்கும் பன்மைச் சுட்டை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ἤκουσα
