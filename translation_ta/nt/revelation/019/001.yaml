  rationale: இறந்தகாலக் கதைநடையை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ὡς
  choice: போன்றதைக்
  rationale: யோவான் கேட்ட ஒலியைத் திட்டவட்டமாக அடையாளப்படுத்தாமல், அது எதைப் போலிருந்தது என்ற மூலத்தின் ஒப்புமைத் தன்மையைப் பாதுகாக்கிறது.
- source_word: φωνὴν μεγάλην ὄχλου πολλοῦ
  choice: பெருந்திரளான மக்கள் எழுப்பிய பேரொலி
