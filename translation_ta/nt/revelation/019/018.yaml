id: REV.19.18
reference: Revelation 19:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἵνα φάγητε σάρκας βασιλέων καὶ σάρκας χιλιάρχων καὶ σάρκας ἰσχυρῶν καὶ σάρκας ἵππων καὶ τῶν καθημένων ἐπ’ ⸀αὐτῶν, καὶ σάρκας πάντων ἐλευθέρων τε καὶ δούλων καὶ μικρῶν ⸀καὶ μεγάλων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/018.yaml
  text: so that you may eat the flesh of kings[a], the flesh of commanders, the flesh of the mighty, the flesh of horses and of those who sit on them, and the flesh of all, both free and servant, and small and great.
translation:
  language: ta
  text: நீங்கள் அரசர்களின் சதையையும், படைத்தலைவர்களின் சதையையும், வலிமைமிக்கவர்களின் சதையையும், குதிரைகளின் சதையையும், அவற்றின்மேல் அமர்ந்திருப்பவர்களின் சதையையும்[a], சுதந்திரமானவர்கள், அடிமைகள், சிறியோர், பெரியோர் ஆகிய அனைவரின் சதையையும் உண்பதற்காக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதைச் சுருக்கமாக, “குதிரை வீரர்களின் சதையையும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: τῶν καθημένων ἐπ’ αὐτῶν என்பது சொல்லுக்குச் சொல் ‘அவற்றின்மேல் அமர்ந்திருப்பவர்கள்’ என்றும், இயல்பான சுருக்கத்தில் குதிரை வீரர்கள் என்றும் பொருள்படும்.
lexical_decisions:
- source_word: ἵνα φάγητε
  choice: நீங்கள் ... உண்பதற்காக
  rationale: ἵνα-வால் அறிமுகப்படுத்தப்படும் நோக்கப் பொருளையும், இரண்டாம் நபர் பன்மை வினை வடிவையும் இயல்பான தமிழில் காக்கிறது; முந்தைய வசனத்தில் வரும் அழைப்பைச் சார்ந்த வாக்கியத் தொடராகவும் உள்ளது.
- source_word: σάρκας
  choice: சதையை
  rationale: இங்கு போர்த் தீர்ப்புக் காட்சியில் உடலின் மாம்சத்தை நேரடியாகக் குறிக்கிறது. கிரேக்கத்தில் மீண்டும் மீண்டும் வரும் சொல்லைத் தமிழிலும் மீட்டுரைத்து அதன் வலியுறுத்தலைப் பேணுகிறது.
- source_word: βασιλέων
  choice: அரசர்களின்
  rationale: குறிப்பாக அரசர்களைக் குறிக்கும் சொல்லை பொதுவான ‘ஆட்சியாளர்கள்’ என்று விரிவுபடுத்தாமல் தருகிறது.
- source_word: χιλιάρχων
  choice: படைத்தலைவர்களின்
  rationale: வரலாற்றில் ஆயிரம் வீரர்களுக்குத் தலைமை வகித்த ராணுவ அதிகாரியைச் சுட்டும் சொல். ‘படைத்தலைவர்கள்’ என்பது அதன் ராணுவப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἰσχυρῶν
  choice: வலிமைமிக்கவர்களின்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் பெயரடையை, உடல் அல்லது அதிகார வலிமை என்ற பரப்பை தேவையின்றி சுருக்காமல் மொழிபெயர்க்கிறது.
- source_word: ἵππων καὶ τῶν καθημένων ἐπ’ αὐτῶν
  choice: குதிரைகளின் ... அவற்றின்மேல் அமர்ந்திருப்பவர்களின்
  rationale: குதிரைகளையும் அவற்றின்மேல் அமர்ந்திருப்பவர்களையும் தனித்தனியாகக் குறிப்பிடும் மூலத்தின் காட்சியமைப்பைத் தக்கவைக்கிறது.
- source_word: πάντων
  choice: அனைவரின்
  rationale: பின்வரும் சமூக மற்றும் நிலை வேறுபாடுகள் அனைத்தையும் உள்ளடக்கும் தொகுப்புப் பொருளைத் தருகிறது.
- source_word: ἐλευθέρων τε καὶ δούλων
  choice: சுதந்திரமானவர்கள், அடிமைகள்
  rationale: சுதந்திர நிலையிலுள்ளவர்களுக்கும் அடிமைப்பட்ட நிலையிலுள்ளவர்களுக்கும் இடையிலான தெளிவான சமூக எதிரிணையைப் பேணுகிறது.
- source_word: μικρῶν καὶ μεγάλων
  choice: சிறியோர், பெரியோர்
  rationale: எல்லா நிலைகளையும் உள்ளடக்கும் மரபான எதிரிணையைச் சொற்சார்ந்த வகையில் பேணி, அதன் பரந்த பொருளை வாசகர் உணர இடமளிக்கிறது.
theological_decisions:
- issue: சமூக நிலை எதிரிணையில் δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: அடிமைகள்
  alternative: ஊழியர்கள் / பணியாளர்கள்
  rationale: ἐλεύθερος (‘சுதந்திரமானவர்’) என்பதற்கு எதிராக வருவதால், இங்கு கட்டுப்பட்ட சமூக நிலையையே δοῦλος தெளிவாகக் குறிக்கிறது. ஆகவே ‘அடிமைகள்’ என்பதே மூலத்தின் எதிரிணையைத் துல்லியமாகக் காக்கிறது.
- issue: μικρῶν καὶ μεγάλων என்ற இணையின் பொருள்
  choice: சிறியோர், பெரியோர்
  alternative: தாழ்ந்தோர், உயர்ந்தோர்
  rationale: இது சமூக நிலை அல்லது முக்கியத்துவத்தின் எல்லைகளைக் குறிக்கும் இணையாக இருக்கலாம்; ஆனால் மூலத்தில் உள்ள உருவகத் திறப்பை ‘தாழ்ந்தோர், உயர்ந்தோர்’ என்று மட்டும் தீர்மானிக்காமல், நேரடியான இணையைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வெளிப்படுத்தின விசேஷத்தின் கம்பீரமான தீர்ப்புக் காட்சிக்கு ஏற்ற நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘சதை’ என்ற சொல்லின் மீட்டுரை மூலத்தின் திட்டமிட்ட பட்டியல் அமைப்பையும் தீவிரத்தையும் பேணுகிறது. வசனம் முந்தைய அழைப்பை நிறைவு செய்யும் நோக்கத் தொடராக இருப்பதால், தமிழிலும் ‘உண்பதற்காக’ என்று முடியும் சார்பு அமைப்பு வைக்கப்பட்டுள்ளது.
