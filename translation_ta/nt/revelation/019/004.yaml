base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/004.yaml
  text: And the twenty-four elders and the four living creatures fell down and worshiped God[a], the one seated on the throne, saying, “Amen! Hallelujah!”
translation:
  language: ta
  text: இருபத்துநான்கு மூப்பர்களும் நான்கு உயிரினங்களும் கீழே விழுந்து, அரியணையில் அமர்ந்திருக்கும் கடவுளை வழிபட்டு, “ஆமென்! அல்லேலூயா![a]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, “யாவைப் புகழுங்கள்!”; அல்லது, “ஆண்டவரைப் புகழுங்கள்!” இது ஓர் எபிரெய வழிபாட்டு முழக்கம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσαν
  choice: கீழே விழுந்து
  rationale: இங்கு πίπτω வழிபாட்டின்போது தாழ விழும் செயலைக் குறிக்கிறது. ‘கீழே விழுந்து’ என்பது அந்த உடல் அசைவைக் இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: πρεσβύτεροι οἱ εἴκοσι τέσσαρες
  choice: இருபத்துநான்கு மூப்பர்கள்
  rationale: வெளிப்படுத்தலில் πρεσβύτεροι என்பதற்கான வழக்கமான, எளிதில் புரியும் தமிழ் இணை ‘மூப்பர்கள்’ ஆகும்.
- source_word: τὰ τέσσαρα ζῷα
  choice: நான்கு உயிரினங்கள்
  rationale: ζῷα என்பது அரியணையைச் சூழ்ந்துள்ள உயிருள்ள வானுலகப் படைப்புகளைக் குறிக்கிறது; ‘உயிரினங்கள்’ என்பது அவற்றைச் சாதாரண விலங்குகளாகக் குறுக்காமல் மூலத்தின் பொதுமையைப் பாதுகாக்கிறது.
- source_word: προσεκύνησαν
  choice: வழிபட்டு
  rationale: செயலின் பொருள் கடவுள் என்பதால், இங்கு வெறும் வணக்கம் அல்லது மரியாதை அல்ல, வழிபாடே குறிக்கப்படுகிறது.
- source_word: τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: அரியணையில் அமர்ந்திருக்கும்
  rationale: பெயரெச்சத் தொடர் கடவுளை அடையாளப்படுத்துகிறது; நிகழ்காலப் பொருளையும் வெளிப்படுத்தலின் அரியணைக் காட்சியையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: λέγοντες
  choice: என்றார்கள்
  rationale: தமிழில் தொடர்ச்சியான வினையெச்ச அமைப்புக்குப் பின் நேரடி உரையை முடிக்கும் இயல்பான வினையாக இது அமைகிறது; கிரேக்கப் பங்கேற்புச் சொல்லின் கருத்து காக்கப்படுகிறது.
- source_word: Ἀμήν
  choice: ஆமென்
  rationale: நிலைத்த வழிபாட்டு மறுமொழியாக உள்ளதால், பொருள் மொழிபெயர்ப்பதைவிட தமிழில் வழக்கமான ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- source_word: Ἁλληλουϊά
  choice: அல்லேலூயா
  rationale: கிரேக்கத்தில் இடம்பெற்றுள்ள எபிரெய வழிபாட்டு முழக்கத்தின் தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பு இது; அதன் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: கிரேக்க உரையில் ஒலிபெயர்க்கப்பட்ட எபிரெய வழிபாட்டு முழக்கமான Ἁλληλουϊά-வை வழங்குதல்
  choice: அல்லேலூயா
  alternative: யாவைப் புகழுங்கள் / ஆண்டவரைப் புகழுங்கள்
  rationale: இது சாதாரண கூற்றைவிட நிலைத்த வழிபாட்டு முழக்கமாகச் செயல்படுவதால் அதன் வழிபாட்டு வடிவம் ஒலிபெயர்ப்பில் பாதுகாக்கப்படுகிறது. அதற்குள் உள்ள தெய்வீகப் பெயரின் சுருக்க வடிவத்தையும் மாற்று மொழிபெயர்ப்பையும் அடிக்குறிப்பு விளக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வழிபாட்டு நடையைப் பயன்படுத்துகிறது. கிரேக்க வாக்கியத்தின் செயல் வரிசை—விழுதல், வழிபடுதல், முழங்குதல்—தமிழின் இயல்பான வினையெச்சத் தொடரில் பாதுகாக்கப்பட்டுள்ளது.
