id: REV.19.7
reference: Revelation 19:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: χαίρωμεν καὶ ⸀ἀγαλλιῶμεν, καὶ ⸀δώσομεν τὴν δόξαν αὐτῷ, ὅτι ἦλθεν ὁ γάμος τοῦ ἀρνίου, καὶ ἡ γυνὴ αὐτοῦ ἡτοίμασεν ἑαυτήν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/007.yaml
  text: Let us rejoice and exult[a], and let us give glory to him, because the marriage of the Lamb has come[b], and his bride has made herself ready.
translation:
  language: ta
  text: நாம் மகிழ்வோம், பேருவகை கொள்வோம்; அவருக்கு மகிமை செலுத்துவோம்.[a] ஏனெனில் ஆட்டுக்குட்டியானவரின் திருமணம் வந்துவிட்டது; அவருடைய மணமகள்[b] தன்னை ஆயத்தப்படுத்திக்கொண்டாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாம் அவருக்கு மகிமை செலுத்துவோம்.” கிரேக்க வினை வடிவம் எதிர்காலக் காலத்தில் உள்ளது; எனினும் இங்கே “நாம் மகிழ்வோம்,” “பேருவகை கொள்வோம்” என்பவற்றுடன் இணைந்து ஊக்குவிக்கும் பொருளைக் கொண்டிருக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “அவருடைய மனைவி.” கிரேக்க γυνή என்ற சொல் “பெண்,” “மனைவி,” அல்லது திருமணச் சூழலில் “மணமகள்” என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρωμεν
  choice: நாம் மகிழ்ந்து
  rationale: முதல் நபர் பன்மை நிகழ்காலத் துணைவினை வடிவின் ஊக்குவிக்கும் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀγαλλιῶμεν
  choice: பேருவகை கொள்வோம்
  rationale: χαίρωμεν என்பதைக் காட்டிலும் தீவிரமான, பொங்கும் மகிழ்ச்சியைத் தனித்துவமாகக் காக்கிறது.
- source_word: δώσομεν τὴν δόξαν αὐτῷ
  choice: அவருக்கு மகிமை செலுத்துவோம்
  rationale: வடிவம் எதிர்காலக் குறிப்புவினையாக இருந்தாலும், முந்தைய ஊக்குவிக்கும் வினைகளுடன் சேர்ந்துள்ள சூழலில் ஒருங்கிணைந்த புகழ்ச்சி அழைப்பாக இயல்பாகப் புரிகிறது; வடிவுசார் மாற்று அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
- source_word: δόξαν
  choice: மகிமை
  rationale: இறைத் துதிச் சூழலில் δόξα என்பதற்குரிய வழக்கமான, கருத்துச் செறிவுள்ள தமிழ் சொல்.
- source_word: ἦλθεν
  choice: வந்துவிட்டது
  rationale: நிறைவேறிய வருகையையும் அதன் தற்போதைய விளைவையும் தமிழில் இயல்பாக உணர்த்துகிறது.
- source_word: γάμος
  choice: திருமணம்
  rationale: திருமணம், திருமண நிகழ்வு, திருமண விருந்து ஆகிய பொருள்கள் சாத்தியமானாலும், அடுத்த வசனத்துக்கு முன்பே ‘விருந்து’ என்ற கருத்தைச் சேர்க்காமல் திருமண ஒன்றிப்பை வெளிப்படுத்துகிறது.
- source_word: ἀρνίου
  choice: ஆட்டுக்குட்டியானவர்
  rationale: வெளிப்படுத்தின விசேஷத்தில் கிறிஸ்துவைக் குறிக்கும் தலைப்பை மரியாதைத் தன்மையுடன் மொழிபெயர்க்கிறது.
- source_word: γυνὴ αὐτοῦ
  choice: அவருடைய மணமகள்
  rationale: γυνή என்பது பெண், மனைவி, மணமகள் எனப் பொருள்படலாம்; திருமணச் சூழலில் ‘மணமகள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: ἡτοίμασεν ἑαυτήν
  choice: தன்னை ஆயத்தப்படுத்திக்கொண்டாள்
  rationale: தற்சுட்டுப் பொருளைத் தெளிவாகக் காத்து, மணமகளின் தயாரிப்பை dignified modern Tamil-ல் இயல்பாகச் சொல்கிறது.
theological_decisions:
- issue: திருமண உருவகத்தில் γυνὴ αὐτοῦ என்பதன் மொழிபெயர்ப்பு
  choice: அவருடைய மணமகள்
  alternative: அவருடைய மனைவி
  rationale: இறுதிக்காலத் திருமணக் காட்சி ஆயத்தமாயிருப்பதை வலியுறுத்துவதால் ‘மணமகள்’ சூழலுக்கு மிகவும் பொருத்தமானது; அதே நேரத்தில் ‘மனைவி’ என்பது உண்மையான சொற்பொருள் வாய்ப்பாக அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: ஊக்குவிக்கும் தொடர்களுக்குள் δώσομεν என்பதன் வினை வலிமை
  choice: அவருக்கு மகிமை செலுத்துவோம்
  alternative: 'அவருக்கு மகிமை செலுத்துவோம் எனும் எதிர்கால உறுதிக்கூற்று: ‘நாம் அவருக்கு மகிமை செலுத்துவோம்’'
  rationale: χαίρωμεν, ἀγαλλιῶμεν ஆகியவற்றுடன் இணைந்த தொடர் ஒரே புகழ்ச்சி அழைப்பாக வாசிக்கப்படுகிறது. இருப்பினும் கிரேக்க வடிவம் முறையாக எதிர்காலக் குறிப்புவினை என்பதால் அந்தத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் பொதுவாசகர்களுக்குப் புரியும் வகையிலும், வழிபாட்டு அறிவிப்புக்குரிய கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. இணை வினைகளின் உயர்ந்து செல்லும் மகிழ்ச்சித் தொனி காக்கப்பட்டுள்ளது. மூலத் தரவில் அடிக்குறிப்பு குறிகள் உரையின் தவறான இடங்களில் இருந்ததால், அவற்றின் உண்மையான உள்ளடக்கத்துக்கு ஏற்ப [a] δώσομεν அருகிலும் [b] γυνή அருகிலும் வைக்கப்பட்டுள்ளன.
