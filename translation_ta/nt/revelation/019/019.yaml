source:
  edition: SBLGNT
  text: καὶ εἶδον τὸ θηρίον καὶ τοὺς βασιλεῖς τῆς γῆς καὶ τὰ στρατεύματα αὐτῶν συνηγμένα ποιῆσαι ⸀τὸν πόλεμον μετὰ τοῦ καθημένου ἐπὶ τοῦ ἵππου καὶ μετὰ τοῦ στρατεύματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/019.yaml
  text: And I saw the beast and the kings of the earth and their armies gathered to make war against the one seated on the horse and against his army[a][b].
translation:
  language: ta
  text: பின்பு, அந்த மிருகத்தையும் பூமியின் அரசர்களையும் அவர்களுடைய படைகளையும் கண்டேன். அவர்கள் குதிரையின்மேல் அமர்ந்திருப்பவருக்கும் அவருடைய படைக்கும் எதிராகப் போர் செய்ய ஒன்றுகூடியிருந்தார்கள்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திரட்டப்பட்டிருந்தார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்கு சொல்: “...உடன் போர் செய்ய”; இச்சூழலில் பகைமைப் பொருளில் “...எதிராகப் போர் செய்ய” என்று அர்த்தம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θηρίον
  choice: மிருகம்
  rationale: வெளிப்படுத்தலில் அச்சுறுத்தும் மறைவெளிப்பாட்டு அடையாளமாக வரும் சொல்லின் பொருளையும் மரபாக அறியப்படும் பெயரையும் ‘மிருகம்’ இயல்பாகத் தக்கவைக்கிறது.
- source_word: βασιλεῖς τῆς γῆς
  choice: பூமியின் அரசர்கள்
  rationale: இங்கு γῆ உலகளாவிய மறைவெளிப்பாட்டுச் சூழலில் வருவதால் ‘நாடு’ என்பதைவிட ‘பூமி’ பொருத்தமானது.
- source_word: στρατεύματα αὐτῶν
  choice: அவர்களுடைய படைகள்
  rationale: பன்மை வடிவத்தையும் போர்ச் சூழலையும் இயல்பான தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: συνηγμένα
  choice: ஒன்றுகூடியிருந்தார்கள்
  rationale: முன்பே ஒன்றுசேர்க்கப்பட்டு அந்நிலையில் இருந்ததைக் குறிக்கும் perfect passive participle-இன் நிலைநிறைவு சார்ந்த நுணுக்கத்தைத் தக்கவைக்கிறது; தமிழ் வாக்கியத்தில் மனிதத் தலைவர்களும் படைகளும் சேர்ந்த கூட்டத்தோடு இயல்பாகப் பொருந்துகிறது.
- source_word: ποιῆσαι τὸν πόλεμον
  choice: போர் செய்ய
  rationale: போரில் ஈடுபடுதல் என்ற கிரேக்க மரபுத்தொடரை நவீனத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் தருகிறது.
- source_word: μετὰ τοῦ καθημένου ἐπὶ τοῦ ἵππου
  choice: குதிரையின்மேல் அமர்ந்திருப்பவருக்கு எதிராக
  rationale: μετά பொதுவாக ‘உடன்’ என்றாலும், போர் செய்யும் சூழலில் பகைமை நோக்கம் தெளிவாக இருப்பதால் ‘எதிராக’ என மொழிபெயர்க்கப்படுகிறது; descriptive participle தனியே தக்கவைக்கப்படுகிறது.
- source_word: μετὰ τοῦ στρατεύματος αὐτοῦ
  choice: அவருடைய படைக்கு எதிராக
  rationale: முந்தைய μετά தொடரைப் போலவே போர்ச் சூழலில் எதிர்ப்புப் பொருள் தருகிறது; στρατεύματος ஒருமை என்பதால் ‘படை’ என வழங்கப்படுகிறது.
theological_decisions:
- issue: ‘குதிரையின்மேல் அமர்ந்திருப்பவர்’ என்பவரின் அடையாளம்
  choice: வசனத்திலுள்ள விளக்கச் சொற்றொடரே தக்கவைக்கப்பட்டது.
  alternative: ‘மேசியா’ அல்லது ‘கிறிஸ்து’ என்று வெளிப்படையாகப் பெயரிடுதல்.
  rationale: உடனடி இலக்கியச் சூழல் அவரை அடையாளப்படுத்தினாலும், இந்த வசனம் பெயரையோ பட்டத்தையோ பயன்படுத்தாமல் participial description-ஐப் பயன்படுத்துகிறது. அதைத் தக்கவைப்பது மூலத்தின் வடிவத்தையும் theological tension-ஐயும் பாதுகாக்கிறது.
- issue: μετά என்பதன் உறவுப்பொருள்
  choice: ‘எதிராக’ எனப் பகைமைப் பொருளில் வழங்கப்பட்டது.
  alternative: சொல்லுக்கு சொல் முறையில் ‘உடன்’ என வழங்குதல்.
  rationale: ποιῆσαι τὸν πόλεμον என்ற போரிடும் மரபுத்தொடருடன் வருவதால் இங்கே கூட்டுறவு அல்ல, எதிர்ப்பு குறிக்கப்படுகிறது. அடிக்குறிப்பு சொற்பொருள் வடிவத்தை வெளிப்படையாகக் குறிப்பிடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியம் தமிழ் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. ‘பின்பு’ தொடர்ச்சியை இயல்பாகக் காட்டுகிறது; ‘அந்த மிருகம்’ முன்பே அறிமுகமான குறிப்பிட்ட மறைவெளிப்பாட்டு உருவைக் குறிக்கிறது. அனைத்து அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் சேர்க்கப்பட்டுள்ளன.
