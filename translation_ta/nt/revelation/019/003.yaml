    issue: The footnote renders εἰς as “க்குள்” (within).
    rationale: The Greek phrase εἰς τοὺς αἰῶνας τῶν αἰώνων is literally ‘to/for the ages of ages,’ not ‘within the ages of ages.’ The explanatory sense of unending duration remains sound, but the literal wording should be accurate.
  revised_text: இரண்டாவது முறையாக அவர்கள், “அல்லேலூயா!” என்று சொன்னார்கள். அவளுடைய புகை மேலே என்றென்றைக்கும் எழுகிறது.[a]
