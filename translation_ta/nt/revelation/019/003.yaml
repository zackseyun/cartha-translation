id: REV.19.3
reference: Revelation 19:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ δεύτερον ⸀εἴρηκαν· Ἁλληλουϊά· καὶ ὁ καπνὸς αὐτῆς ἀναβαίνει εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/003.yaml
  text: And a second time they said[a], “Hallelujah!” And her smoke goes up forever and ever.
translation:
  language: ta
  text: இரண்டாவது முறையாக அவர்கள், “அல்லேலூயா!” என்று சொன்னார்கள். அவளுடைய புகை மேலே என்றென்றைக்கும் எழுகிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில், “யுகங்களின் யுகங்களுக்கு”; இது முடிவில்லாத காலநீட்சியைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεύτερον
  choice: இரண்டாவது முறையாக
  rationale: வினையடைப் பொருளில் வரும் இச்சொல், நிகழ்வு மீண்டும் நடப்பதோடு அதன் வரிசையையும் தெளிவாகக் காட்டுகிறது.
- source_word: εἴρηκαν
  choice: சொன்னார்கள்
  rationale: λέγω என்பதன் நிறைவுக்கால வடிவம். தமிழ் கதைநடையில் இயல்பான இறந்தகால வடிவம் பொருளை மிகைப்படுத்தாமல் உரையை வழங்குகிறது.
- source_word: Ἁλληλουϊά
  choice: அல்லேலூயா
  rationale: வழிபாட்டில் பரவலாக அறியப்பட்ட எபிரேய ஒலிபெயர்ப்பு வடிவம்; இப்பகுதியில் உள்ள தனித்துவமான துதிப்புகழ்ச்சிச் சூத்திரத்தைப் பாதுகாக்கிறது.
- source_word: ὁ καπνὸς αὐτῆς
  choice: அவளுடைய புகை
  rationale: αὐτῆς என்பது சூழலில் பெண்ணாக உருவகப்படுத்தப்பட்ட பாபிலோனைச் சுட்டுகிறது; பெண்பால் ஆளுருவாக்கத்தைத் தக்கவைக்கிறது.
- source_word: ἀναβαίνει
  choice: மேலே எழும்புகிறது
  rationale: நிகழ்காலத்தின் தொடரும், கண்முன் நிகழ்வதுபோன்ற காட்சித்தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: என்றென்றைக்கும்
  rationale: முடிவில்லாத காலநீட்சியைக் குறிக்கும் கிரேக்க மரபுத்தொடருக்கு இயல்பான தமிழ் இணை. சொல்லுக்குச் சொல் அமைப்பு அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: εἰς τοὺς αἰῶνας τῶν αἰώνων குறிக்கும் காலநீட்சி
  choice: என்றென்றைக்கும்
  alternative: காலங்களின் காலங்களுக்குள்
  rationale: இறுதித் தீர்ப்பைப் பற்றிய இச்சூழலில் கிரேக்க மரபுத்தொடர் முடிவில்லாத காலநீட்சியை இயல்பாகக் குறிக்கிறது. அதை மென்மைப்படுத்தாமல் தமிழில் தெரிவித்து, மூலத்தின் சொல்லமைப்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. “அல்லேலூயா” என்ற பரிச்சயமான வழிபாட்டு ஒலிபெயர்ப்பும், பாபிலோனின் பெண்பால் ஆளுருவாக்கத்தைப் பாதுகாக்க “அவளுடைய” என்பதும் தக்கவைக்கப்பட்டுள்ளன.
