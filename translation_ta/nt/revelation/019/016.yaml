source:
  edition: SBLGNT
  text: καὶ ἔχει ἐπὶ τὸ ἱμάτιον καὶ ἐπὶ τὸν μηρὸν αὐτοῦ ὄνομα γεγραμμένον· Βασιλεὺς βασιλέων καὶ κύριος κυρίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/016.yaml
  text: 'And he has a name written on his robe and on his thigh: King of kings and Lord of lords[a].'
translation:
  language: ta
  text: 'அவருடைய மேலங்கியிலும் அவருடைய தொடையிலும் ஒரு பெயர் எழுதப்பட்டிருக்கிறது: “அரசர்களின் அரசர், ஆண்டவர்களின் ஆண்டவர்.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு பெயர் பொறிக்கப்பட்டுள்ளது.” கிரேக்கத்தில் நேரடியாக, “எழுதப்பட்ட ஒரு பெயர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχει
  choice: வைத்திருக்கிறார்
  rationale: நிகழ்கால வினையையும், எழுதப்பட்ட பெயர் தொடர்ந்து அங்கே இருப்பதையும் இயல்பான தமிழில் தெரிவிக்கிறது; ‘அணிந்திருக்கிறார்’ என்பது மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்கும்.
- source_word: ἐπὶ τὸ ἱμάτιον
  choice: தமது மேலங்கியில்
  rationale: ἱμάτιον என்பதன் உடை/மேலங்கி பொருளை இச்சூழலில் இயல்பாகக் காட்டுகிறது; சுற்றியுள்ள தொடரிலிருந்து உடை அவருடையது என்பது தெளிவாகிறது.
- source_word: ἐπὶ τὸν μηρὸν αὐτοῦ
  choice: தமது தொடையில்
  rationale: μηρός என்பதற்கான நேரடியான தமிழ் இணை ‘தொடை’; இரண்டு இடங்களையும் வேறுபடுத்திக் கூறும் கிரேக்க அமைப்பு அப்படியே பாதுகாக்கப்படுகிறது.
- source_word: ὄνομα γεγραμμένον
  choice: பெயரை எழுதி வைத்திருக்கிறார்
  rationale: γεγραμμένον என்பதன் நிறைவேற்றப்பட்டு நிலைத்திருக்கும் உணர்வை இயல்பான தமிழில் தருகிறது; ‘பொறிக்கப்பட்ட’ என்பது எழுதும் முறையைத் தேவையின்றி குறிப்பாக்கும்.
- source_word: Βασιλεὺς βασιλέων
  choice: அரசர்களுக்கெல்லாம் அரசர்
  rationale: பன்மை உடைமைத் தொடரின் உயர்வுப் பொருளை நவீன தமிழில் தெளிவாகவும் கம்பீரமாகவும் வெளிப்படுத்துகிறது.
- source_word: κύριος κυρίων
  choice: ஆண்டவர்களுக்கெல்லாம் ஆண்டவர்
  rationale: κύριος என்பதற்கு இறையியல் ஒலிப்பைத் தக்கவைக்கும் ‘ஆண்டவர்’ பயன்படுத்தப்பட்டு, இணையான கிரேக்கத் தொடர் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: பட்டப்பெயர்களை விளக்கவுரையாக மாற்றுவதா அல்லது நேரடியாகத் தருவதா
  choice: “அரசர்களுக்கெல்லாம் அரசர், ஆண்டவர்களுக்கெல்லாம் ஆண்டவர்” என்ற அரச பட்டப்பெயர்களை நேரடியாகத் தக்கவைத்தல்
  alternative: “உன்னத அரசர், உன்னத ஆண்டவர்”
  rationale: மூலம் உயர்வுப் பொருளுள்ள உடைமைத் தொடர்களால் பெயர்/பட்டத்தை வெளிப்படையாகத் தருகிறது; நேரடி மொழிபெயர்ப்பு அதன் கிறிஸ்துவியல் வலிமையை விளக்கச் சேர்க்கையின்றி பாதுகாக்கிறது.
- issue: “மேலங்கியிலும் தொடையிலும்” என்ற இடக்குறிப்புகளின் தொடர்பு
  choice: இரண்டு இடங்களையும் தனித்தனியே நேரடியாக மொழிபெயர்த்தல்
  alternative: “தொடையை மூடிய மேலங்கிப் பகுதியில்” என்று ஒன்றிணைத்து விளக்குதல்
  rationale: கிரேக்கம் இரண்டு ἐπί தொடர்களைக் கொண்டுள்ளது. எழுத்து எவ்வாறு அமைந்துள்ளது என்பதை உரை விளக்காததால், மொழிபெயர்ப்பும் அந்தத் தெளிவின்மையைத் தீர்க்காமல் விடுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், வெளிப்படுத்தின நூலின் கம்பீரமான தரிசன நடையைத் தக்கவைத்தும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தமது’ மரியாதையையும் இரு இடங்களின் உடைமையுறவையும் தெளிவாக்குகிறது; மேற்கோள் குறிகள் எழுதப்பட்ட பெயர்/பட்டத்தின் எல்லையை காட்டுகின்றன.
