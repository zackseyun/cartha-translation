    text: அல்லது, “ஒரு பெயர் பொறிக்கப்பட்டுள்ளது.” கிரேக்கத்தில் நேரடியாக, “எழுதப்பட்ட ஒரு பெயர்.”
    reason: lexical_alternative
  revision_rationale: The revision removes the unsupported implication that the rider personally wrote or deposited the name, preserves the perfect-passive state of the inscription, retains the two spatial expressions without harmonizing them, and renders both titular genitive constructions directly in modern standard Tamil. The footnote is adjusted to match the revised passive syntax and remains anchored to the wording for the written name.
