  text: καὶ ἐδόθη αὐτῇ ἵνα περιβάληται βύσσινον ⸀λαμπρὸν καθαρόν, τὸ γὰρ βύσσινον τὰ δικαιώματα τῶν ἁγίων ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/008.yaml
  text: And it was given to her to clothe herself with fine linen[a], bright and clean, for the fine linen is the righteous deeds of the saints.
translation:
  language: ta
  text: ஒளிவீசும் தூய மெல்லிய நாராடையை அணிந்துகொள்ள அவளுக்கு அளிக்கப்பட்டது; ஏனெனில் அந்த மெல்லிய நாராடை பரிசுத்த மக்களின் நீதியான செயல்களாகும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நீதிக்குரிய செயல்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் வேறு சூழல்களில் ‘நீதியான கட்டளைகள்’ என்றும் பொருள்படலாம்; ஆனால் இங்கு அது பரிசுத்த மக்களின் நீதியான செயல்களையே மிகவும் இயல்பாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτῇ
  choice: அவளுக்கு அருளப்பட்டது
  rationale: செயப்பாட்டு வடிவத்தையும் கொடுப்பவர் வெளிப்படையாகக் குறிப்பிடப்படாததையும் காக்கிறது. இச்சூழலில் ‘அருளப்பட்டது’ என்பது அனுமதி/கொடை உணர்வை இயல்பாக வெளிப்படுத்துகிறது; கடவுளை நேரடியாக எழுவாயாக்கவில்லை.
- source_word: ἵνα περιβάληται
  choice: அணிந்துகொள்ள
  rationale: நோக்கம் அல்லது விளைவை உணர்த்தும் ἵνα கூறையும், தானே அணிந்துகொள்வதைக் காட்டும் நடுவினை நயத்தையும் இயல்பான தமிழில் பிரதிபலிக்கிறது.
- source_word: βύσσινον
  choice: மெல்லிய நார்ப்பட்டாடை
  rationale: βύσσινον குறிக்கும் உயர்தரமான fine linen துணியை சாதாரண வாசகர் புரிந்துகொள்ளும் வகையில் மொழிபெயர்க்கிறது; இரு இடங்களிலும் ஒரே சொல்லாக்கம் வைக்கப்பட்டுள்ளது.
- source_word: λαμπρὸν καθαρόν
  choice: ஒளிவீசும் தூய
  rationale: λαμπρός என்பதன் ஒளிரும் காட்சியையும் καθαρός என்பதன் கறையற்ற/சுத்தமான தன்மையையும் சுருக்கமாகக் காக்கிறது. இங்கு ‘தூய’ என்பது ஆடையின் தூய்மையை முதலில் குறிக்கிறது; அடுத்த கூறு அதன் அறநெறிசார் அடையாளத்தை விளக்குகிறது.
- source_word: τὸ γὰρ βύσσινον
  choice: ஏனெனில் அந்த மெல்லிய நார்ப்பட்டாடை
  rationale: γάρ தரும் விளக்கத் தொடர்பையும், கிரேக்கத்தில் βύσσινον மீண்டும் வருவதையும் வெளிப்படையாகக் காக்கிறது.
- source_word: τὰ δικαιώματα
  choice: நீதியான செயல்கள்
  rationale: இப்பன்மை வடிவம் இச்சின்னவியல் சூழலில் பரிசுத்த மக்களின் நீதியான செயல்களை மிக இயல்பாகக் குறிக்கிறது. ‘நீதிக்குரிய செயல்கள்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: τῶν ἁγίων
  choice: பரிசுத்த மக்களின்
  rationale: புதிய ஏற்பாட்டில் ἅγιοι என்பது கடவுளுக்குரிய மக்களைக் குறிக்கும் வழக்கமான பெயர். ‘பரிசுத்தவான்கள்’ என்பதைக் காட்டிலும் ‘பரிசுத்த மக்கள்’ நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: ἐστίν
  choice: குறிக்கிறது
  rationale: ஆடை மற்றும் செயல்கள் நேரடியாக ஒரே பொருள் என்று அல்லாமல், வெளிப்படுத்துதல் நூலின் சின்னவியல் அடையாள உறவை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: மணமகளின் ஆடையாகிய δικαιώματα என்பதன் பொருள்
  choice: அந்த ஆடை பரிசுத்த மக்களின் நீதியான செயல்களைக் குறிக்கிறது.
  alternative: அது பரிசுத்த மக்களுக்குரிய நீதியான கட்டளைகள் அல்லது அவர்களின் நீதிநிலை/நியாயநிறைவேற்றத்தைக் குறிக்கிறது.
  rationale: உடனடி சூழலிலும் பன்மை வடிவிலும் ‘செயல்கள்’ என்பதே மிகவும் இயல்பான பொருள். அதேவேளை, ஆடை அவளுக்கு ‘அருளப்பட்டது’ என்றும் உரை கூறுவதால், தெய்வீகக் கொடைக்கும் மக்களின் நீதியான நடத்தைக்கும் இடையிலான பதற்றம் விளக்கத்தால் நீக்கப்படவில்லை.
- issue: ἐδόθη என்ற செயப்பாட்டின் செய்பவர்
  choice: கொடுப்பவர் குறிப்பிடப்படாமல் ‘அவளுக்கு அருளப்பட்டது’ என வைக்கப்பட்டுள்ளது.
  alternative: ‘கடவுள் அவளுக்கு அருளினார்.’
  rationale: கொடுப்பவர் கடவுள் என்பது சூழலிலிருந்து புரியக்கூடியதாக இருந்தாலும், கிரேக்க உரை அவரை வெளிப்படையாக எழுவாயாகக் குறிப்பிடவில்லை. மொழிபெயர்ப்பு அந்தக் கட்டுப்பாட்டைக் காக்கிறது.
- issue: ἐστίν மூலம் வரும் சின்னவியல் அடையாளம்
  choice: ‘குறிக்கிறது’
  alternative: ‘ஆகும்’ அல்லது ‘அவையே’
  rationale: வெளிப்படுத்துதல் நூலின் ஆடைச் சின்னத்தைத் தமிழில் தவறான பொருளடையாளமாகப் புரிந்துகொள்ளாமல் தெளிவுபடுத்துகிறது; அதே சமயம் உரை கூறும் நேரடி விளக்க உறவைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் சாதாரண வாசகருக்குப் புரியக்கூடியதுமான நடையில் அமைக்கப்பட்டது. ‘பரிசுத்த மக்கள்’ என்பது மதப்பிரிவு சார்ந்த சிறப்பு பொருளைத் தவிர்க்கிறது. ‘மெல்லிய நார்ப்பட்டாடை’ என்பதன் மூலம் βύσσινον குறிக்கும் நுண்மையான உயர்தரத் துணி வேறுபடுத்தப்படுகிறது. அடிக்குறிப்பு குறியீடு விளக்கப்படுகிற சொல்லாக்கத்தின் பின்னர் பிரதான உரையில் சேர்க்கப்பட்டுள்ளது.
