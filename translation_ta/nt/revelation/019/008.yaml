- from: ஒளிவீசும் தூய மெல்லிய நார்ப்பட்டாடையை அணிந்துகொள்ள அவளுக்கு அருளப்பட்டது; ஏனெனில் அந்த மெல்லிய நார்ப்பட்டாடை பரிசுத்த மக்களின் நீதியான செயல்களைக் குறிக்கிறது.[a]
  to: ஒளிவீசும் தூய மெல்லிய நாராடையை அணிந்துகொள்ள அவளுக்கு அளிக்கப்பட்டது; ஏனெனில் அந்த மெல்லிய நாராடை பரிசுத்த மக்களின் நீதியான செயல்களாகும்.[a]
