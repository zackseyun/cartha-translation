revisions:
- from: மற்றவர்கள் குதிரையின்மேல் அமர்ந்திருந்தவருடைய வாயிலிருந்து புறப்பட்ட வாளால் கொல்லப்பட்டார்கள்[a]. பறவைகள் அனைத்தும் அவர்களுடைய சதையைத் தின்று வயிறார உண்டன[b].
  to: எஞ்சியவர்கள் குதிரையின்மேல் அமர்ந்திருந்தவருடைய வாயிலிருந்து புறப்பட்ட வாளால்[b] கொல்லப்பட்டார்கள்[a]. பறவைகள் அனைத்தும் அவர்களுடைய சதையை உண்டு திருப்தியடைந்தன.
  rationale: The revision corrects the misplaced cross-reference anchor, replaces an overly specific and potentially misleading lexical alternative, and makes the contextual sense of ‘the rest’ explicit. It preserves the source’s unresolved apocalyptic image of the sword and renders the birds’ satiation in natural modern Tamil without adding interpretive detail.
  reviewer_model: gpt-5.6-terra
