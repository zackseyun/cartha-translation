id: REV.19.21
reference: Revelation 19:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ οἱ λοιποὶ ἀπεκτάνθησαν ἐν τῇ ῥομφαίᾳ τοῦ καθημένου ἐπὶ τοῦ ἵππου τῇ ἐξελθούσῃ ἐκ τοῦ στόματος αὐτοῦ, καὶ πάντα τὰ ὄρνεα ἐχορτάσθησαν ἐκ τῶν σαρκῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/021.yaml
  text: And the rest were killed by the sword of the one seated on the horse[a], the sword that came out from his mouth[b], and all the birds were filled from their flesh.
translation:
  language: ta
  text: எஞ்சியவர்கள் குதிரையின்மேல் அமர்ந்திருந்தவருடைய வாயிலிருந்து புறப்பட்ட வாளால்[b] கொல்லப்பட்டார்கள்[a]. பறவைகள் அனைத்தும் அவர்களுடைய சதையை உண்டு திருப்தியடைந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சாய்க்கப்பட்டார்கள்.’
    reason: lexical_alternative
  - marker: b
    text: வாயிலிருந்து புறப்படும் ‘வாள்’ வெளிப்படுத்தல் நூலில் காணப்படும் தரிசன உருவகம்; 19:15-ஐ ஒப்பிடுக.
    reason: cross_reference
lexical_decisions:
- source_word: οἱ λοιποὶ
  choice: மற்றவர்கள்
  rationale: முந்தைய சூழலில் மிருகமும் பொய்த் தீர்க்கதரிசியும் அகற்றப்பட்டபின் எஞ்சியிருந்தவர்களைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்.
- source_word: ἀπεκτάνθησαν
  choice: கொல்லப்பட்டார்கள்
  rationale: இறந்தகாலச் செயப்பாட்டு வடிவத்தைத் தெளிவான நவீன தமிழில் காக்கிறது; ‘வெட்டிக் கொல்லப்பட்டார்கள்’ என்பது மூலத்தில் இல்லாத முறையைச் சேர்க்கும்.
- source_word: ἐν τῇ ῥομφαίᾳ
  choice: வாளால்
  rationale: ἐν உடன் வரும் வேற்றுமை இங்கு கருவிப்பொருளைக் காட்டுகிறது. ‘வாளால்’ என்பது இயல்பான தமிழிலும் மூலத்தின் உருவகத்தையும் காக்கிறது.
- source_word: τοῦ καθημένου ἐπὶ τοῦ ἵππου
  choice: குதிரையின்மேல் அமர்ந்திருந்தவருடைய
  rationale: பெயரெச்சத் தொடரை நெருக்கமாகவும் வாசிக்க இயல்பாகவும் தருகிறது.
- source_word: τῇ ἐξελθούσῃ ἐκ τοῦ στόματος αὐτοῦ
  choice: வாயிலிருந்து புறப்பட்ட
  rationale: வாளை விவரிக்கும் பெயரெச்சத் தொடரின் தொடர்பைத் தமிழில் தெளிவாக வைத்திருந்து, வெளிப்படுத்தின விசேஷத்தின் தரிசன உருவகத்தை விளக்கமாக மாற்றாமல் காக்கிறது.
- source_word: πάντα τὰ ὄρνεα
  choice: பறவைகள் அனைத்தும்
  rationale: மூலம் பொதுவாக ‘பறவைகள்’ என்றே கூறுகிறது; சூழல் பிணந்தின்னிப் பறவைகளைக் குறிப்பிட்டாலும் அதனை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: ἐχορτάσθησαν
  choice: வயிறார உண்டன
  rationale: χορτάζω என்பதன் நிறைவுற உண்டு திருப்தியடைதல் என்ற பொருளை இயல்பான தமிழில் தருகிறது. வெறும் ‘நிரம்பின’ என்பது தமிழில் இச்சூழலில் செயற்கையாக இருக்கும்.
- source_word: ἐκ τῶν σαρκῶν αὐτῶν
  choice: அவர்களுடைய சதையைத் தின்று
  rationale: ἐκ குறிக்கும் மூலப்பொருள்/உணவு ஆதார உறவைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; σάρξ இங்கு உடல்சதையைக் குறிக்கிறது.
theological_decisions:
- issue: குதிரைமேல் இருப்பவரின் வாயிலிருந்து புறப்படும் வாளின் இயல்பு
  choice: ‘வாயிலிருந்து புறப்பட்ட வாள்’ என்ற தரிசன உருவகத்தை முதன்மை உரையில் அப்படியே வைத்தல்
  alternative: அதை அவருடைய வார்த்தை அல்லது நியாயத்தீர்ப்பு என்று முதன்மை உரையிலேயே விளக்குதல்
  rationale: மூலம் உருவகத்தின் பொருளை இவ்வசனத்தில் நேரடியாகத் தீர்மானிப்பதில்லை. ஆகவே அதன் இறையியல் பதற்றத்தையும் வெளிப்படுத்தின விசேஷத்தின் உருவக மொழியையும் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, தெளிவான நடை. கிரேக்க வாக்கியத்தின் நீண்ட இணைப்பை வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரித்துள்ளது. ‘வயிறார உண்டன’ என்பது χορτάζω-வின் நிறைவு உணர்வை இயல்பாகத் தருகிறது; ‘சதை’ என்பது இங்கு σάρξ-ன் நேரடியான உடற்பொருளைத் தக்கவைக்கிறது.
