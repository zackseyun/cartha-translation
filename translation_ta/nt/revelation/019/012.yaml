  source_fidelity: 'மூலக் கிரேக்கத்தின் மூன்று காட்சிக் கூறுகளும் துல்லியமாகக் காக்கப்பட்டுள்ளன: கண்கள் நெருப்புச் சுடராக இருப்பது, தலையில் பல அரச மகுடங்கள் இருப்பது, அவரே மட்டுமே அறியும் எழுதப்பட்ட பெயர் இருப்பது. φλὸξ πυρός என்பதற்கு மூலத்தில் இல்லாத வெளிப்படையான ஒப்புமைச் சொல்லைச் சேர்க்காமல் உருவகமாகவே தருவது ஏற்றது. γεγραμμένον-இன் நிறைவுற்ற செயல்நிலையும், εἰ μὴ αὐτός-இன் தனித்துவ விதிவிலக்கும் பாதுகாக்கப்பட்டுள்ளன.'
