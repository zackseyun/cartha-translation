source:
  edition: SBLGNT
  text: οἱ δὲ ὀφθαλμοὶ ⸀αὐτοῦ φλὸξ πυρός, καὶ ἐπὶ τὴν κεφαλὴν αὐτοῦ διαδήματα πολλά, ⸀ἔχων ὄνομα γεγραμμένον ὃ οὐδεὶς οἶδεν εἰ μὴ αὐτός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/012.yaml
  text: His eyes were a flame of fire, and on his head were many crowns, and he had a name written that no one knows except himself.
translation:
  language: ta
  text: அவருடைய கண்கள் நெருப்புச் சுடராக இருந்தன. அவருடைய தலையில் பல மகுடங்கள்[a] இருந்தன. எழுதப்பட்டிருந்த ஒரு பெயர் அவருக்கு இருந்தது; அந்தப் பெயரை அவரைத் தவிர வேறு யாரும் அறியவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘மகுடங்கள்’ என்பதற்கான கிரேக்கச் சொல் குறிப்பாக அரச மகுடங்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... ὀφθαλμοὶ αὐτοῦ
  choice: அவருடைய கண்கள்
  rationale: உடைமைப் பொருளை இயல்பான நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: δὲ
  choice: —
  rationale: இங்கு இது மென்மையான தொடர்ச்சியைக் காட்டும் இடைச்சொல். தமிழில் தனியாக மொழிபெயர்க்காமல் வாக்கியத் தொடரால் அந்த உறவை இயல்பாக வெளிப்படுத்தலாம்.
- source_word: φλὸξ πυρός
  choice: நெருப்புச் சுடர்
  rationale: கிரேக்கத்தில் வெளிப்படையான ஒப்புமைச் சொல் இல்லாததால், ‘போன்ற’ என்பதைச் சேர்க்காமல் உருவகத்தின் வலிமையைப் பாதுகாக்கிறது.
- source_word: ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: அவருடைய தலையில்
  rationale: இடத்தைக் குறிக்கும் சொற்றொடரின் தெளிவான, இயல்பான தமிழ் வடிவம்.
- source_word: διαδήματα πολλά
  choice: பல மகுடங்கள்
  rationale: διάδημα என்பது அரச அதிகாரத்தைக் குறிக்கும் மகுடம். ‘மகுடங்கள்’ என்பது தமிழில் கண்ணியமானதும் புரிந்துகொள்ளத்தக்கதுமான துல்லியச் சொல்.
- source_word: ἔχων ὄνομα γεγραμμένον
  choice: எழுதப்பட்டிருந்த ஒரு பெயர் அவருக்கு இருந்தது
  rationale: ἔχων என்ற பங்கேற்பு வடிவத்தை இயல்பான தமிழ் வினைமுற்றாக மாற்றுகிறது; γεγραμμένον என்பதன் நிறைவுற்ற விளைவு நிலையை ‘எழுதப்பட்டிருந்த’ என்பது காக்கிறது. பெயர் எங்கு எழுதப்பட்டது என்பதை மூலவாக்கியம் குறிப்பிடாததால் மொழிபெயர்ப்பும் இடத்தைச் சேர்க்கவில்லை.
- source_word: ὃ οὐδεὶς οἶδεν εἰ μὴ αὐτός
  choice: அந்தப் பெயரை அவரைத் தவிர வேறு யாரும் அறியவில்லை
  rationale: விதிவிலக்கின் வலியுறுத்தலையும், அந்தப் பெயரை அவர் மட்டுமே அறிவார் என்ற பொருளையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: எழுதப்பட்ட பெயரை அறிபவர் யார்?
  choice: அந்தப் பெயரை அந்தக் குதிரைவீரரைத் தவிர வேறு யாரும் அறியவில்லை
  alternative: இது பெயரின் புரிந்துகொள்ள முடியாத மர்மத்தைப் பொதுவாக வலியுறுத்துகிறது என்று கொள்ளலாம்
  rationale: εἰ μὴ αὐτός என்பது ‘அவரைத் தவிர’ என்று வெளிப்படையாகக் கூறுகிறது. அதன் மேலான இறையியல் விளக்கத்தைச் சேர்க்காமல், தனித்துவமான அறிவையும் மர்மத்தையும் மொழிபெயர்ப்பு அப்படியே வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் இணைந்த நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் மூன்று காட்சிக் கூறுகள் தனித்தனி வாக்கியங்களாக அமைக்கப்பட்டுள்ளன. வெளிப்படையாக இல்லாத ‘போன்ற’ என்ற ஒப்புமைச் சொல்லும், பெயர் எழுதப்பட்ட இடமும் சேர்க்கப்படவில்லை.
