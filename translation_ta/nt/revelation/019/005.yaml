id: REV.19.5
reference: Revelation 19:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ φωνὴ ἀπὸ τοῦ θρόνου ἐξῆλθεν λέγουσα· Αἰνεῖτε ⸂τῷ θεῷ⸃ ἡμῶν, πάντες οἱ δοῦλοι αὐτοῦ, ⸀καὶ οἱ φοβούμενοι αὐτόν, οἱ μικροὶ καὶ οἱ μεγάλοι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/005.yaml
  text: And a voice came from the throne[a], saying, “Praise our God, all his servants, and those who fear him[b], the small and the great.”
translation:
  language: ta
  text: அரியணையிலிருந்து ஒரு குரல் வந்து, “நம் கடவுளைப் போற்றுங்கள்; அவருடைய அடிமைகளே, அவருக்கு அஞ்சுகிறவர்களே, சிறியோரும் பெரியோரும், நீங்கள் அனைவரும்” என்றது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φωνὴ
  choice: ஒரு குரல்
  rationale: λέγουσα (‘என்றது/சொன்னது’) என்பதுடன் வருவதால், இங்கு ஒலி என்பதைவிட பேசும் ‘குரல்’ என்பதே இயல்பான பொருள்.
- source_word: ἀπὸ τοῦ θρόνου ἐξῆλθεν
  choice: அரியணையிலிருந்து ... வந்து
  rationale: ἀπό மூலத்தைக் குறிக்கிறது; ἐξέρχομαι அங்கிருந்து வெளிப்படுவதைக் குறிக்கிறது. தமிழில் ‘அரியணையிலிருந்து ஒரு குரல் வந்து’ என்பது அந்த மூலப் படிமத்தை இயல்பாகப் பாதுகாக்கிறது.
- source_word: Αἰνεῖτε τῷ θεῷ ἡμῶν
  choice: நம் கடவுளைப் போற்றுங்கள்
  rationale: பன்மை ஏவலைத் தெளிவாகத் தருகிறது; αἰνέω என்பதற்கு ‘போற்று’ என்பது வழிபாட்டுச் சூழலில் இயல்பான, கண்ணியமான தமிழ்.
- source_word: πάντες οἱ δοῦλοι αὐτοῦ
  choice: அவருடைய அடிமைகள் அனைவரும்
  rationale: δοῦλοι என்பது வெறும் பணிசெய்பவர்களை மட்டுமல்ல, ஒருவருக்குச் சொந்தமான அடிமைகளையும் குறிக்கக்கூடும். கடவுளுக்குரியவர்கள் என்ற வலுவான சார்பையும் உடைமையுணர்வையும் ‘அடிமைகள்’ பாதுகாக்கிறது.
- source_word: οἱ φοβούμενοι αὐτόν
  choice: அவருக்கு அஞ்சுகிறவர்கள்
  rationale: கடவுளைப் பற்றிய பயபக்தி, வியப்பு, கீழ்ப்படிதல் ஆகியவற்றை உள்ளடக்கும் வேதாகமச் சொல்லாட்சியின் பதற்றத்தை ‘அஞ்சுகிறவர்கள்’ பாதுகாக்கிறது; ‘மதிக்கிறவர்கள்’ என்று மென்மையாக்கவில்லை.
- source_word: οἱ μικροὶ καὶ οἱ μεγάλοι
  choice: சிறியோரும் பெரியோரும்
  rationale: குறைந்த நிலையினரும் உயர்ந்த நிலையினரும் உட்பட அனைவரையும் குறிக்கும் கிரேக்க இணைப்பைச் சுருக்கமாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
theological_decisions:
- issue: δοῦλοι என்பதன் வழிபாட்டுச் சூழல் பொருள்
  choice: அடிமைகள்
  alternative: ஊழியர்கள் / பணியாளர்கள்
  rationale: இங்கு கடவுளுக்குச் சொந்தமாயிருத்தலும் முழு விசுவாசத்துடன் அவருக்குக் கீழ்ப்படிதலும் முன்வருகின்றன. ‘அடிமைகள்’ அந்த வலிமையைப் பாதுகாக்கிறது; மாற்றுச் சொற்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- issue: கடவுளுக்கு ‘அஞ்சுதல்’ என்பதன் பொருள்
  choice: அவருக்கு அஞ்சுகிறவர்கள்
  alternative: அவருக்குப் பயபக்தி காட்டுகிறவர்கள் / அவரை மதிக்கிறவர்கள்
  rationale: மூலத்தின் ‘அஞ்சுதல்’ என்ற வேதாகமச் சொல்லாட்சியைத் தக்கவைத்து, அதை வெறும் பயமாகவோ வெறும் மரியாதையாகவோ சுருக்கவில்லை.
- issue: ‘சிறியோரும் பெரியோரும்’ யாரை விளக்குகிறது
  choice: ‘அவருக்கு அஞ்சுகிறவர்கள்’ என்பதுடன் இடைச்செருகலாக இணைத்தல்
  alternative: அடிமைகளும் அஞ்சுகிறவர்களும் சேர்ந்த முழுக் குழுவைக் குறித்தல்
  rationale: கிரேக்கச் சொல் வரிசை இதை அஞ்சுகிறவர்களை மேலும் விளக்கும் இணைப்பாக வாசிக்க அனுமதிக்கிறது; கோடுகள் அந்தத் தொடர்பைக் காட்டுகின்றன, ஆனால் சமூக நிலை எதுவாயினும் அனைவரும் அழைக்கப்படுகிறார்கள் என்ற பரந்த பொருளையும் மறுப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வழிபாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. ஏவலுக்குரிய குழுக்கள் முதலில் வைக்கப்பட்டு, முடிவில் ‘போற்றுங்கள்’ வருவது தமிழில் இயல்பான வாக்கிய ஓட்டத்தை அளிக்கிறது. ‘சிறியோரும் பெரியோரும்’ என்பது வயதை அல்ல, நிலை அல்லது முக்கியத்துவ வேறுபாட்டைக் குறிக்கும் வகையில் திறந்தவையாக விடப்பட்டுள்ளது.
