revisions:
- from: அரியணையிலிருந்து ஒரு குரல் வந்து, “அவருடைய அடிமைகள்[a] அனைவரும், அவருக்கு அஞ்சுகிறவர்கள்[b] அனைவரும்—சிறியோரும் பெரியோரும்—நம் கடவுளைப் போற்றுங்கள்” என்றது.
  to: அரியணையிலிருந்து ஒரு குரல் வந்து, “நம் கடவுளைப் போற்றுங்கள்; அவருடைய அடிமைகளே, அவருக்கு அஞ்சுகிறவர்களே, சிறியோரும் பெரியோரும், நீங்கள் அனைவரும்” என்றது.
  rationale: The revision retains all key lexical choices while removing punctuation that over-specifies the relationship of “the small and the great” to only one preceding group. It also places the imperative first, followed by the addressed groups, while retaining an explicit “you all” for πάντες.
