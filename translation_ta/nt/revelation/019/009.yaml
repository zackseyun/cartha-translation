- from: 'அவர் என்னிடம், “எழுது: ஆட்டுக்குட்டியானவரின் திருமண விருந்துக்கு அழைக்கப்பட்டவர்கள்[a] பேறுபெற்றவர்கள்” என்றார். மேலும் அவர் என்னிடம், “இவை கடவுளின் உண்மையான வார்த்தைகள்[b]” என்றார்.'
  to: 'அவர் என்னிடம், “எழுது: ஆட்டுக்குட்டியானவரின் திருமண விருந்துக்கு[b] அழைக்கப்பட்டவர்கள்[a] பேறுபெற்றவர்கள்” என்றார். மேலும் அவர் என்னிடம், “இவை கடவுளின் உண்மையான வார்த்தைகள்[c]” என்றார்.'
  rationale: முதன்மை மொழிபெயர்ப்பின் பொருளை மாற்றாமல், κεκλημένοι-க்கான பொருளுள்ள மாற்றையும், δεῖπνον τοῦ γάμου-க்கான பாரம்பரிய மாற்றையும், ἀληθινοί-க்கான நம்பகத்தன்மை நிழலையும் தனித்தனி அடிக்குறிப்புகளால் தெளிவாகப் பதிவு செய்துள்ளேன். கடவுளின் genitive-ஐ முதன்மை உரையில் ‘கடவுளின்’ என்றே வைத்திருப்பதால் மூலத்தின் உறவு/உரிமை அமைப்பு பாதுகாக்கப்படுகிறது.
