id: REV.19.9
reference: Revelation 19:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ λέγει μοι· Γράψον· Μακάριοι οἱ εἰς τὸ δεῖπνον τοῦ γάμου τοῦ ἀρνίου κεκλημένοι. καὶ λέγει μοι· Οὗτοι οἱ λόγοι ἀληθινοὶ τοῦ θεοῦ εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/009.yaml
  text: 'And he says to me[a], “Write: Blessed are those who have been invited to the wedding supper of the Lamb.” And he says to me[c][b], “These are the true words of God.”'
translation:
  language: ta
  text: 'அவர் என்னிடம், “எழுது: ஆட்டுக்குட்டியானவரின் திருமண விருந்துக்கு[b] அழைக்கப்பட்டவர்கள்[a] பேறுபெற்றவர்கள்” என்றார். மேலும் அவர் என்னிடம், “இவை கடவுளின் உண்மையான வார்த்தைகள்[c]” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆட்டுக்குட்டியானவரின் திருமண விருந்துக்கு வரும்படி அழைக்கப்பட்டவர்கள்.”
    reason: lexical_alternative
  - marker: b
    text: 'பாரம்பரியமான மொழிபெயர்ப்பு: “ஆட்டுக்குட்டியானவரின் திருமண விருந்துணவு.”'
    reason: alternative_reading
  - marker: c
    text: அல்லது, “நம்பத்தகுந்த வார்த்தைகள்”; இச்சொற்றொடர் இந்தச் செய்தி உண்மையானது, நம்பிக்கைக்குரியது என்பதை உறுதிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γράψον
  choice: எழுது
  rationale: γράφω என்பதன் இறந்தகாலக் கட்டளை ஒருமை வடிவம்; கூடுதல் பொருளைச் சேர்க்காமல் நேரடியான கட்டளையாக மொழிபெயர்க்கப்படுகிறது.
- source_word: Μακάριοι
  choice: பேறுபெற்றவர்கள்
  rationale: வெறும் மனநிலையான மகிழ்ச்சியைக் காட்டிலும், கடவுளால் அருளப்பட்ட நல்வாழ்வையும் உயர்ந்த நிலையையும் சுட்டும் வாழ்த்துரையின் கண்ணியமான தமிழாக்கம்.
- source_word: οἱ εἰς τὸ δεῖπνον ... κεκλημένοι
  choice: விருந்துக்கு அழைக்கப்பட்டவர்கள்
  rationale: κεκλημένοι என்பது அழைக்கப்பட்ட நிலையில் இருப்பவர்களைக் குறிக்கும் நிறைவு செயல்பாட்டு வினையெச்சம். விருந்து என்ற சூழலில் ‘அழைக்கப்பட்டவர்கள்’ என்பது இயல்பான தமிழ்; ‘அழைக்கப்பட்டோர்’ என்ற இறையியல் ஒலிப்பைத் தேவையின்றி வலுப்படுத்தாது.
- source_word: δεῖπνον
  choice: விருந்து
  rationale: முக்கிய உணவையோ விழாக்கால விருந்தையோ குறிக்கிறது; திருமணச் சூழலில் ‘விருந்து’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: γάμου
  choice: திருமண
  rationale: δεῖπνον என்பதுடன் சேர்ந்திருப்பதால், திருமண நிகழ்வைச் சார்ந்த விருந்து என்ற உடனடிப் படிமத்தை இயல்பான தமிழில் தருகிறது.
- source_word: τοῦ ἀρνίου
  choice: ஆட்டுக்குட்டியானவரின்
  rationale: வெளிப்படுத்தலில் கிறிஸ்துவைக் குறிக்கும் முக்கிய அடையாளப் பட்டத்தைத் தக்கவைக்கிறது; தமிழ் இலக்கணத்திற்கும் நபரைக் குறிக்கும் பயன்பாட்டிற்கும் ஏற்றவாறு மரியாதை விகுதி சேர்க்கப்பட்டுள்ளது.
- source_word: Οὗτοι οἱ λόγοι
  choice: இவை ... வார்த்தைகள்
  rationale: சுட்டுப்பெயரும் பெயர்ச்சொல்லும் கொண்ட கிரேக்க அமைப்பை இயல்பான தமிழ் வாக்கியமாக வழங்குகிறது.
- source_word: ἀληθινοὶ
  choice: உண்மையான
  rationale: செய்தியின் உண்மையையும் நம்பகத்தன்மையையும் உறுதிப்படுத்தும் நேரடியான பொருள்; ‘நம்பத்தகுந்த’ என்பது சாத்தியமான விளக்க மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τοῦ θεοῦ
  choice: கடவுளின்
  rationale: மூலத்தின் உரிமை/தொடர்பு வேற்றுமையை நேரடியாகப் பாதுகாக்கிறது; ‘கடவுளிடமிருந்து வந்த’ என்று மூலத்தை மட்டும் தீர்மானிக்கவில்லை.
theological_decisions:
- issue: இறுதிக்கால இரட்சிப்பு விருந்துச் சூழலில் κεκλημένοι என்பதன் பொருள்
  choice: அழைக்கப்பட்டவர்கள்
  alternative: அழைக்கப்பட்டோர் / வரும்படி அழைக்கப்பட்டவர்கள்
  rationale: விருந்துச் சூழலில் ‘அழைக்கப்பட்டவர்கள்’ என்பது καλέω என்பதன் வழக்குப் பொருளைத் தெளிவாகத் தருகிறது. அதேவேளை, அழைப்பின் இறையியல் இயல்பை—குறிப்பாக அது தவறாத அழைப்பா என்பதை—மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- issue: δεῖπνον τοῦ γάμου என்ற சொற்றொடரின் மொழிபெயர்ப்பு
  choice: திருமண விருந்து
  alternative: திருமண விருந்துணவு
  rationale: ‘திருமண விருந்து’ என்பது நவீன தமிழில் இயல்பாகவும் விழாக்கால உணவுப் படிமத்தைத் தெளிவாகவும் வெளிப்படுத்துகிறது; மிகச் சொற்படியான நீளமான அமைப்பு தவிர்க்கப்படுகிறது.
- issue: ἀληθινοὶ τοῦ θεοῦ என்பதில் உண்மை மற்றும் நம்பகத்தன்மை
  choice: கடவுளின் உண்மையான வார்த்தைகள்
  alternative: கடவுளின் நம்பத்தகுந்த வார்த்தைகள்
  rationale: ‘உண்மையான’ என்பது ἀληθινοί என்பதன் நேரடி பொருளைத் தக்கவைக்கிறது. சூழலில் நம்பகத்தன்மையும் உட்பொருளாக இருந்தாலும், அதை முதன்மை உரையில் மட்டும் எனத் தீர்மானிக்காமல் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘பேறுபெற்றவர்கள்’ வாழ்த்துரையின் solemn தன்மையைப் பேணுகிறது. ‘ஆட்டுக்குட்டியானவர்’ வெளிப்படுத்தல் நூலின் கிறிஸ்துவியல் அடையாளப் பட்டத்தைத் தெளிவாக வைத்திருக்கிறது. இரு அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
