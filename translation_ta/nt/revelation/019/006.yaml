  register: நடை நவீன, பொதுவாகப் புரியக்கூடிய, அதேவேளை வெளிப்படுத்தல் நூலின் பிரமாண்டமான வழிபாட்டு மொழிக்கு ஏற்ற உயர்வுடைய தமிழாக அமைக்கப்பட்டுள்ளது. ‘சர்வவல்லவர்’ மற்றும் ‘அல்லேலூயா’ ஆகியவை தமிழ்க் கிறிஸ்தவ வாசகர்களுக்குப் பரிச்சயமான மரியாதைமிக்க வடிவங்களாக வைக்கப்பட்டுள்ளன.
