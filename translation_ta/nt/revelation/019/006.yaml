  text: καὶ ἤκουσα ὡς φωνὴν ὄχλου πολλοῦ καὶ ὡς φωνὴν ὑδάτων πολλῶν καὶ ὡς φωνὴν βροντῶν ἰσχυρῶν, ⸀λεγόντων· Ἁλληλουϊά, ὅτι ἐβασίλευσεν κύριος, ὁ ⸀θεός, ὁ παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/006.yaml
  text: And I heard what seemed to be the voice of a great multitude[a], and like the voice of many waters, and like the voice of mighty thunders, saying, “Hallelujah! For the Lord God, the Almighty[b], reigns.”
translation:
  language: ta
  text: பெருந்திரளான மக்களின் குரலைப் போன்றும், பெருந்திரளான நீரின் இரைச்சலைப் போன்றும், வலிமைமிக்க இடிமுழக்கங்களின் ஓசையைப் போன்றும் இருந்த ஒரு குரலைக் கேட்டேன். அவர்கள், “அல்லேலூயா! ஆண்டவராகிய தேவன், சர்வவல்லவர்[a], அரசாளுகிறார்[b]!” என்று முழங்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “சர்வவல்லவரான நமது தேவனாகிய ஆண்டவர்” என்று உள்ளது. இங்கு பின்பற்றப்பட்டுள்ள அச்சிடப்பட்ட கிரேக்க உரை சொல்லுக்குச் சொல், “ஆண்டவர், தேவன், சர்வவல்லவர்” என்று வாசிக்கிறது.
    reason: textual_variant
  - marker: b
    text: “அரசாண்டார்,” “அரசாளத் தொடங்கினார்,” அல்லது “அரசரானார்” என்றும் மொழிபெயர்க்கலாம். தேவனுடைய ஆட்சி தீர்மானமாக வெளிப்பட்டதைக் கொண்டாடுவதாக இங்குள்ள கிரேக்க வினைச்சொல்லைப் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσα
  choice: கேட்டேன்
  rationale: ἀκούω என்பதன் இறந்தகால நிகழ்வை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ὡς
  choice: போலவும்
  rationale: மூன்று முறை வரும் ὡς ஒப்புமையைக் குறிக்கிறது; அது அடையாளப்படுத்துவதாக இல்லாமல் காட்சியில் கேட்ட குரலின் தன்மையை வர்ணிக்கிறது.
- source_word: φωνὴν ὄχλου πολλοῦ
  choice: பெருந்திரளான மக்கள் எழுப்பும் குரலைப் போல
  rationale: ὄχλος πολύς என்பது மிகப் பெரிய மக்கள் கூட்டத்தைக் குறிக்கிறது; தமிழில் இயல்பான கூட்டுக் குரல் உணர்வை இது தருகிறது.
- source_word: φωνὴν ὑδάτων πολλῶν
  choice: பெருவெள்ளங்களின் பேரிரைச்சலைப் போல
  rationale: பல பெருநீர்ப்பரப்புகள் எழுப்பும் பிரமாண்டமான ஓசை என்ற வெளிப்படுத்தல் நூலின் உருவக வலிமையை இயல்பான தமிழில் எடுத்துரைக்கிறது; நீர் ஓடுவதாக மூலத்தில் இல்லாத விவரத்தைச் சேர்க்கவில்லை.
- source_word: φωνὴν βροντῶν ἰσχυρῶν
  choice: வலிமைமிக்க இடிமுழக்கங்களின் ஓசையைப் போல
  rationale: ἰσχυρός என்பதன் வலிமை அல்லது ஆற்றல் என்ற பொருளையும், பன்மையில் உள்ள βρονταί என்பதையும் காக்கிறது.
- source_word: λεγόντων
  choice: என்று முழங்கியது
  rationale: அறிவிப்பின் மிகுந்த ஒலியையும் தமிழின் இயல்பையும் தருகிறது. கிரேக்கத்தில் பன்மை வடிவம் இருந்தாலும், தமிழில் முன்வரும் கூட்டுக் குரலை ஒருமையாகக் குறிப்பது இயல்பானது.
- source_word: Ἁλληλουϊά
  choice: அல்லேலூயா
  rationale: புதிய ஏற்பாட்டின் வழிபாட்டு முழக்கத்துக்கான தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பு.
- source_word: κύριος, ὁ θεός, ὁ παντοκράτωρ
  choice: சர்வவல்லவரான ஆண்டவராகிய தேவன்
  rationale: அச்சிடப்பட்ட கிரேக்க உரையிலுள்ள ‘ஆண்டவர், தேவன், சர்வவல்லவர்’ என்ற மூன்று தெய்வீகப் பெயர்களையும் இயல்பான தமிழ் சொற்றொடரில் காக்கிறது; மூலத்தில் இல்லாத ‘நமது’ என்பதைச் சேர்க்கவில்லை.
- source_word: ἐβασίλευσεν
  choice: அரசாளுகிறார்
  rationale: இச்சூழலில் தேவனுடைய ஆட்சி வெற்றிகரமாக வெளிப்பட்டதைக் கொண்டாடும் கிரேக்க இறந்தகால வினையை தமிழில் இயல்பான புகழ்முழக்கமாக அளிக்கிறது; அதன் காலம் மற்றும் தொடக்கநிலை சார்ந்த மாற்றுப் புரிதல்கள் அடிக்குறிப்பில் வைக்கப்படுகின்றன.
theological_decisions:
- issue: ἐβασίλευσεν என்பது தேவனுடைய ஆட்சி தொடங்கியதைக் குறிக்கிறதா அல்லது அது தீர்மானமாக வெளிப்பட்டதைக் குறிக்கிறதா?
  choice: அரசாளுகிறார்
  alternative: அரசாளத் தொடங்கினார்; அரசாண்டார்; அரசரானார்
  rationale: எளிய நிகழ்காலம் புகழ்முழக்கத்தின் இயல்பைத் தருகிறது; தேவனுடைய இறையாண்மை இதற்கு முன் இல்லை என்ற பொருளைத் திணிக்காமல், கிரேக்க இறந்தகாலத்தின் சாத்தியமான நுழைவுநிலைப் பொருளை அடிக்குறிப்பில் வெளிப்படையாகக் காக்கிறது.
- issue: κύριος ὁ θεὸς என்பதில் ‘நமது’ என்ற உடைமைச்சொல்லைச் சேர்ப்பது
  choice: ஆண்டவராகிய தேவன்
  alternative: நமது தேவனாகிய ஆண்டவர்
  rationale: வழங்கப்பட்ட SBLGNT உரையில் ἡμῶν இல்லை. ஆகவே மூல உரைக்கு முன்னுரிமை கொடுத்து ‘நமது’ என்பதை முதன்மை உரையில் சேர்க்காமல், முக்கியமான கையெழுத்துப் பிரதி வேறுபாட்டை அடிக்குறிப்பில் குறிப்பிடுகிறது.
