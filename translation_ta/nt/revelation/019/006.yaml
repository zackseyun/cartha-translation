revisions:
- from: பின்பு, பெருந்திரளான மக்கள் எழுப்பும் குரலைப் போலவும், பெருவெள்ளங்களின் பேரிரைச்சலைப் போலவும், வலிமைமிக்க இடிமுழக்கங்களின் ஓசையைப் போலவும் ஒரு குரலைக் கேட்டேன். அது, “அல்லேலூயா! சர்வவல்லவரான ஆண்டவராகிய தேவன்[a] அரசாளுகிறார்[b]!” என்று முழங்கியது.
  to: பெருந்திரளான மக்களின் குரலைப் போன்றும், பெருந்திரளான நீரின் இரைச்சலைப் போன்றும், வலிமைமிக்க இடிமுழக்கங்களின் ஓசையைப் போன்றும் இருந்த ஒரு குரலைக் கேட்டேன். அவர்கள், “அல்லேலூயா! ஆண்டவராகிய தேவன், சர்வவல்லவர்[a], அரசாளுகிறார்[b]!” என்று முழங்கினார்கள்.
