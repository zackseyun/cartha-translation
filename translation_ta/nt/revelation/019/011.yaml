revisions:
- from: பின்பு வானம் திறந்திருக்கக் கண்டேன். இதோ, வெள்ளைக் குதிரை ஒன்று! அதன்மேல் அமர்ந்திருந்தவர் “நம்பிக்கைக்குரியவர், உண்மையானவர்” என்று அழைக்கப்படுகிறார். அவர் நீதியோடு[a] தீர்ப்பளித்துப் போரிடுகிறார்.
  to: நான் வானம் திறந்திருந்ததைக் கண்டேன்; இதோ, வெள்ளைக் குதிரை ஒன்று! அதன்மேல் அமர்ந்திருப்பவர் “நம்பிக்கைக்குரியவரும் உண்மையானவரும்” என்று அழைக்கப்படுகிறார். அவர் நீதியோடு[a] தீர்ப்பளித்துப் போரிடுகிறார்.
  rationale: The revision removes the unsupported temporal addition, makes the perfect passive sense of “heaven opened” explicit in idiomatic Tamil, and aligns the rider’s participial description with the Greek present participle. It retains the draft’s sound treatment of the titles and of δικαιοσύνη, including the lexical-alternative footnote.
