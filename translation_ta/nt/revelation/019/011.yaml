source:
  edition: SBLGNT
  text: Καὶ εἶδον τὸν οὐρανὸν ἠνεῳγμένον, καὶ ἰδοὺ ἵππος λευκός, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ⸂πιστὸς καλούμενος⸃ καὶ ἀληθινός, καὶ ἐν δικαιοσύνῃ κρίνει καὶ πολεμεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/011.yaml
  text: And I saw heaven opened[a], and behold, a white horse, and the one sitting on it is called Faithful and True, and in righteousness he judges and wages war.
translation:
  language: ta
  text: நான் வானம் திறந்திருந்ததைக் கண்டேன்; இதோ, வெள்ளைக் குதிரை ஒன்று! அதன்மேல் அமர்ந்திருப்பவர் “நம்பிக்கைக்குரியவரும் உண்மையானவரும்” என்று அழைக்கப்படுகிறார். அவர் நீதியோடு[a] தீர்ப்பளித்துப் போரிடுகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நியாயத்தோடு அவர் தீர்ப்பளித்துப் போரிடுகிறார்.”
    reason: δικαιοσύνη இங்கு ஒழுக்க நீதியையோ நீதியான நியாயத்தையோ வலியுறுத்தக்கூடும் என்பதால் பொருத்தமான சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: ἠνεῳγμένον
  choice: திறந்திருக்க
  rationale: ἀνοίγω என்பதன் நிறைவுற்ற செயப்பாட்டு வினையெச்சம், வானம் திறக்கப்பட்டதன் விளைவாகத் திறந்த நிலையில் இருப்பதைச் சுட்டுகிறது. “திறந்திருக்க” என்பது அந்த விளைவு நிலையையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: காட்சியின் திடீர்த் தோற்றத்தையும் வெளிப்படுத்தல் நூலுக்குரிய வலியுறுத்தலையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἵππος λευκός
  choice: வெள்ளைக் குதிரை ஒன்று
  rationale: கிரேக்கப் பெயர்த்தொடரை நேரடியாகவும், தமிழில் புதிய காட்சிப்பொருளை இயல்பாக அறிமுகப்படுத்தும் வகையிலும் தருகிறது.
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: அதன்மேல் அமர்ந்திருந்தவர்
  rationale: “சவாரி செய்பவர்” என்று விளக்கமாக்காமல், மூலத்தின் வினையெச்ச அமைப்பையும் காட்சியின் மரியாதைத் தொனியையும் காக்கிறது.
- source_word: πιστὸς καλούμενος καὶ ἀληθινός
  choice: “நம்பிக்கைக்குரியவர், உண்மையானவர்” என்று அழைக்கப்படுகிறார்
  rationale: καλούμενος என்ற பெயரிடும் மொழியைக் காத்து, இரு சொற்களையும் அந்த நபருக்கான பட்டப்பெயர்களாகத் தெளிவாக வழங்குகிறது.
- source_word: πιστός
  choice: நம்பிக்கைக்குரியவர்
  rationale: இங்கு ஒருவரின் நம்பத்தகுந்த தன்மையையும் உண்மைப் பற்றுறுதியையும் குறிக்கும் பட்டப்பெயர். “விசுவாசமுள்ளவர்” என்பதைக் காட்டிலும் பொதுவான நவீன தமிழில் பொருள் தெளிவாகிறது.
- source_word: ἀληθινός
  choice: உண்மையானவர்
  rationale: பொய்யற்றவர் என்பதோடு மெய்யானவர் என்ற பொருளையும் தாங்கி, πιστός உடன் இணையும் பட்டப்பெயராக இயல்பாக அமைகிறது.
- source_word: ἐν δικαιοσύνῃ
  choice: நீதியோடு
  rationale: தீர்ப்பளித்தலும் போரிடுதலும் நீதிக்கு ஏற்ப நடைபெறுகின்றன என்ற முறைசார் பொருளை இயல்பான தமிழில் தருகிறது. “நியாயத்தோடு” என்பதும் பொருத்தமான மாற்று என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: κρίνει
  choice: தீர்ப்பளித்து
  rationale: κρίνω இச்சூழலில் நீதித்தீர்ப்பு வழங்குவதைச் சுட்டுகிறது; அடுத்த வினையுடன் தமிழில் இயல்பாக இணைக்க வினையெச்சமாகத் தரப்பட்டுள்ளது.
- source_word: πολεμεῖ
  choice: போரிடுகிறார்
  rationale: πολεμέω என்பதன் இராணுவ வலிமையைச் சுருக்கமாகவும் இயல்பான நவீன தமிழிலும் காக்கிறது.
theological_decisions:
- issue: குதிரைமேல் அமர்ந்திருப்பவரின் பட்டப்பெயர்கள்
  choice: πιστός, ἀληθινός ஆகியவற்றை “நம்பிக்கைக்குரியவர், உண்மையானவர்” என்ற பட்டப்பெயர்களாக மேற்கோள் குறிகளுக்குள் வழங்குதல்
  alternative: அவற்றை வெறும் பண்புகளாக “நம்பிக்கைக்குரியவரும் உண்மையானவருமானவர்” என்று வழங்குதல்
  rationale: καλούμενος என்பது இவை அவருக்கு வழங்கப்படும் பெயர்கள் அல்லது பட்டங்கள் என்பதைக் காட்டுகிறது. மேற்கோள் குறிகள் அந்தச் செயல்பாட்டை வெளிப்படுத்துகின்றன; அதேவேளை அந்த நபரின் அடையாளத்தை வசனம் கூறுவதைக் கடந்துத் தனியாக விளக்கவில்லை.
- issue: δικαιοσύνη என்பதன் பொருள்
  choice: முதன்மை உரையில் “நீதி”
  alternative: “நியாயம்”
  rationale: இந்தச் சூழலில் இச்சொல் ஒழுக்க நேர்மையையும் நீதியான தீர்ப்பையும் ஒன்றாகத் தாங்குகிறது. “நீதி” அந்த விரிவைத் தக்கவைக்கிறது; நீதித்துறை சார்ந்த “நியாயம்” என்ற மாற்றும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வெளிப்படுத்தல்-காட்சித் தொனி காக்கப்பட்டுள்ளது. “இதோ” மற்றும் வியப்புக்குறி காட்சியின் திடீர்த் தன்மையை வெளிப்படுத்துகின்றன. பாரம்பரிய சமயச் சொற்களை இயந்திரமாகப் பயன்படுத்தாமல், மூலத்தின் பட்டப்பெயர் அமைப்பும் நீதித் தன்மையும் தெளிவாக வைக்கப்பட்டுள்ளன.
