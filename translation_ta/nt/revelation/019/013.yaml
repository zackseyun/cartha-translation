id: REV.19.13
reference: Revelation 19:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ περιβεβλημένος ἱμάτιον ⸀βεβαμμένον αἵματι, καὶ ⸀κέκληται τὸ ὄνομα αὐτοῦ ὁ Λόγος τοῦ Θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/013.yaml
  text: And he is clothed in a robe dipped in blood[a], and his name is called the Word of God.
translation:
  language: ta
  text: இரத்தத்தில் தோய்க்கப்பட்ட அங்கியை அவர் அணிந்திருந்தார்[a]; அவருடைய பெயர் “தேவனுடைய வார்த்தை” என்று அழைக்கப்படுகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரத்தக்கறை படிந்த.” கிரேக்க வினைச்சொல்லின் நேரடியான பொருள் “தோய்க்கப்பட்ட” அல்லது “சாயம் ஏற்றப்பட்ட” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβεβλημένος
  choice: அணிந்திருந்தார்
  rationale: περιβάλλω என்பதன் நிறைவேற்றுப் பங்கேற்பு வடிவம், அவர் அந்த ஆடையை அணிந்துள்ள தற்போதைய நிலையைச் சுட்டுகிறது. இயல்பான தமிழில் ‘அணிந்திருந்தார்’ அந்த நிலைப்பொருளைத் தருகிறது.
- source_word: ἱμάτιον
  choice: அங்கி
  rationale: ἱμάτιον பொதுவாக மேலாடையைக் குறிக்கிறது. தரிசனத்தின் அரச மற்றும் போர்வீரச் சூழலுக்கு ஏற்ற கண்ணியமான சொல்லாக ‘அங்கி’ உள்ளது; ஆடையின் வடிவத்தை அளவுக்கு மீறிக் குறிப்பதில்லை.
- source_word: βεβαμμένον αἵματι
  choice: இரத்தத்தில் தோய்க்கப்பட்ட
  rationale: βάπτω என்பதன் அடிப்படைப் பொருள் ‘தோய்த்தல்’ அல்லது ‘முக்குதல்.’ ‘இரத்தத்தில் தோய்க்கப்பட்ட’ என்பது கிரேக்கத்தின் வலுவான காட்சியைப் பாதுகாக்கிறது; ‘இரத்தக்கறை படிந்த’ என்பது சாத்தியமான பொருளாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: κέκληται
  choice: அழைக்கப்படுகிறது
  rationale: καλέω என்பதன் நிறைவேற்றுச் செயப்பாட்டு வடிவம் பெயரிடப்பட்டதன் தொடரும் விளைவைக் காட்டுகிறது. தமிழில் ‘அழைக்கப்படுகிறது’ என்பது பெயர் அல்லது பட்டப்பெயர் என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: அவருடைய பெயர்
  rationale: கிரேக்க உடைமைத் தொடரின் இயல்பான, மரியாதையான தமிழ் வடிவம்.
- source_word: ὁ Λόγος τοῦ Θεοῦ
  choice: தேவனுடைய வார்த்தை
  rationale: λόγος இங்கு வெறும் செய்தி அல்லது பேச்சு அல்லாமல், குதிரைமேல் இருப்பவருக்கான தனிப்பட்ட பட்டப்பெயராக வருகிறது. ‘தேவனுடைய வார்த்தை’ அந்தப் பட்டப்பெயரின் இறையியல் நிறையைக் காக்கிறது.
theological_decisions:
- issue: λόγος என்னும் கிறிஸ்துவியல் பட்டப்பெயர்
  choice: தேவனுடைய வார்த்தை
  alternative: தேவனுடைய செய்தி
  rationale: ὁ Λόγος τοῦ Θεοῦ என்பது இச்சூழலில் குதிரைமேல் இருப்பவரின் தனிப்பட்ட பட்டப்பெயராக முன்வைக்கப்படுகிறது. ‘வார்த்தை’ என்பது அந்தப் பட்டப்பெயரையும் யோவானிய ஒலிப்பையும் காக்கிறது; ‘செய்தி’ எனப் பொருளுரைப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், வெளிப்படுத்தின விசேஷத்தின் உயர்ந்த தரிசன நடைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘அங்கி’ அரச-போர்வீரச் சூழலை உணர்த்தினாலும், மூலத்தில் இல்லாத குறிப்பிட்ட ஆடை வடிவத்தைச் சேர்க்கவில்லை. அடிக்குறிப்பு குறி [a] பிரதான உரையில் இடம்பெற்றுள்ளது.
