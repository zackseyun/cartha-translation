id: REV.19.2
reference: Revelation 19:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι ἀληθιναὶ καὶ δίκαιαι αἱ κρίσεις αὐτοῦ· ὅτι ἔκρινεν τὴν πόρνην τὴν μεγάλην ἥτις ⸀ἔφθειρεν τὴν γῆν ἐν τῇ πορνείᾳ αὐτῆς, καὶ ἐξεδίκησεν τὸ αἷμα τῶν δούλων αὐτοῦ ἐκ χειρὸς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/002.yaml
  text: because his judgments are true and just; because he judged the great prostitute who corrupted the earth with her sexual immorality[a], and he avenged the blood of his servants from her hand.
translation:
  language: ta
  text: ஏனெனில், அவருடைய தீர்ப்புகள் உண்மையானவையும் நீதியானவையும் ஆகும்; ஏனெனில், தன் பாலியல் ஒழுக்கக்கேட்டால் பூமியைச் சீரழித்த அந்தப் பெரும் விபச்சாரியை அவர் நியாயந்தீர்த்தார்; அவளுடைய கையிலிருந்து தம் அடிமைகளின்[a] இரத்தத்திற்குப் பழிவாங்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஊழியர்களின்.” கிரேக்கச் சொல் δοῦλος, “அடிமை” அல்லது “ஊழியர்” எனப் பொருள்படலாம்; எஜமானுக்குரியவராக இருப்பதன் வலிமையான கருத்தைப் பாதுகாக்க இங்கே “அடிமைகள்” பயன்படுத்தப்பட்டுள்ளது.
    reason: δοῦλος என்பதன் பொருள் மற்றும் தமிழ் நடையில் எழும் வேறுபாட்டைத் தெரிவிக்கும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: ἀληθιναὶ καὶ δίκαιαι
  choice: உண்மையானவையும் நீதியானவையும்
  rationale: தீர்ப்புகள் மெய்ம்மைக்கு ஒத்தவையாகவும் ஒழுக்கரீதியாக நீதியுள்ளவையாகவும் இருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: κρίσεις
  choice: தீர்ப்புகள்
  rationale: நீதித்துறை சார்ந்த முடிவுகளையும் இறுதி நியாயத்தீர்ப்பின் செயல்களையும் உள்ளடக்கும் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: ἔκρινεν
  choice: நியாயந்தீர்த்தார்
  rationale: κρίνω என்பதன் பரந்த நீதித்துறைப் பொருளைத் தக்கவைக்கிறது; சூழலில் தண்டனைத் தீர்ப்பு உட்பொருளாக இருந்தாலும் அதை வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: πόρνην τὴν μεγάλην
  choice: அந்தப் பெரும் விபச்சாரியை
  rationale: πόρνη என்பதன் நேரடியான பொருளையும் வெளிப்படுத்தலின் உருவக வலிமையையும் கண்ணியமான, புரிந்துகொள்ளத்தக்க தமிழில் தருகிறது.
- source_word: ἔφθειρεν
  choice: சீரழித்த
  rationale: φθείρω என்பதில் உள்ள அழித்தல்/கெடுத்தல் என்ற பொருள் இருமையை ஓரளவு தக்கவைத்து, இங்கு ஒழுக்கச் சீர்கேட்டால் நிகழும் உலகளாவிய கேட்டை இயல்பாகச் சொல்கிறது.
- source_word: τὴν γῆν
  choice: பூமியை
  rationale: வெளிப்படுத்தலின் உலகளாவிய சூழலுக்கு ஏற்ற γῆ என்பதன் இயல்பான பொருள்.
- source_word: ἐν τῇ πορνείᾳ αὐτῆς
  choice: தன் பாலியல் ஒழுக்கக்கேட்டால்
  rationale: πορνεία என்பதன் பாலியல் பொருளைத் தெளிவாகத் தருகிறது; உருவகமான விக்கிரகாராதனை அல்லது விசுவாசத்துரோகத்தைத் தனியாக விளக்கி முடிவுசெய்யவில்லை.
- source_word: ἐξεδίκησεν
  choice: பழிவாங்கினார்
  rationale: மற்றொருவருக்காக நீதியான பழிவாங்கலை நிறைவேற்றுதல் என்ற வினையின் வலிமையைப் பாதுகாக்கிறது.
- source_word: τὸ αἷμα τῶν δούλων αὐτοῦ
  choice: தம் அடிமைகளின் இரத்தத்திற்காக
  rationale: δοῦλος என்பதில் உள்ள எஜமானுக்குச் சொந்தமான கட்டுப்பட்ட நிலையை 'அடிமைகள்' நேரடியாகப் பாதுகாக்கிறது; 'இரத்தத்திற்காக' என்பது கொல்லப்பட்டவர்களுக்காக நீதி செய்வதை இயல்பாகக் குறிக்கிறது.
- source_word: ἐκ χειρὸς αὐτῆς
  choice: அவளுடைய கையிலிருந்து
  rationale: அவளுடைய செயற்பாடு அல்லது பொறுப்பைக் குறிக்கும் மூலமொழியின் வேதாகம உருவகத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: தேவனுடைய மக்களைச் சுட்டும் δοῦλοι என்பதன் மொழிபெயர்ப்பு
  choice: அடிமைகள்
  alternative: ஊழியர்கள்
  rationale: இங்கு தேவனுக்குரிய முழுமையான சொந்தத்துவமும் கட்டுப்பட்ட நிலையும் முக்கியமானதால் வலிமையான நேரடிப் பொருள் தேர்ந்தெடுக்கப்பட்டது; வழக்கமான மரியாதைநடைக்காக மென்மையாக்கப்படவில்லை. வாசிப்பிற்கு உதவ மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: πορνεία என்பதன் நேரடி மற்றும் உருவகப் பொருள்
  choice: பாலியல் ஒழுக்கக்கேடு
  alternative: விபச்சாரம் / உருவகமான விசுவாசத்துரோகம்
  rationale: முதன்மை உரை சொல்லின் நேரடி பாலியல் மதிப்பைத் தக்கவைக்கிறது; வெளிப்படுத்தலில் உள்ள விக்கிரகாராதனை சார்ந்த உருவகத்தை ஒரே விளக்கமாக நிர்ணயிக்கவில்லை.
- issue: ἐκ χειρὸς αὐτῆς என்ற நீதித்துறை மொழிவழக்கு
  choice: அவளுடைய கையிலிருந்து
  alternative: அவளுடைய கையால் சிந்தப்பட்டதற்காக
  rationale: மூலத்தின் சுருக்கமான உருவகத்தையும் குற்றப்பொறுப்பையும் தக்கவைக்கிறது; வெளிப்படையாக இல்லாத 'சிந்தப்பட்ட' என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரமான, கண்ணியமான தமிழ். நீதித்துறைத் தொனியும் வெளிப்படுத்தலுக்குரிய வலிமையான உருவகங்களும் பாதுகாக்கப்பட்டுள்ளன. இரு ὅτι கூறுகளின் காரணவியல் அமைப்பு தமிழில் இயல்பாகப் பாய்வதற்காக முதல் வாக்கியத்திற்குப் பின் தொடர்ச்சியான தீர்ப்புச் செயல்கள் தரப்பட்டுள்ளன.
