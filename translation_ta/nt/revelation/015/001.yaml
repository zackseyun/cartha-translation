id: REV.15.1
reference: Revelation 15:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἄλλο σημεῖον ἐν τῷ οὐρανῷ μέγα καὶ θαυμαστόν, ἀγγέλους ἑπτὰ ἔχοντας πληγὰς ἑπτὰ τὰς ἐσχάτας, ὅτι ἐν αὐταῖς ἐτελέσθη ὁ θυμὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/001.yaml
  text: 'And I saw another sign in heaven[a], great and marvelous: seven angels having seven last plagues[b], because in them the wrath of God was finished.'
translation:
  language: ta
  text: 'மேலும், பரலோகத்தில் மகத்தானதும் வியப்பூட்டுவதுமான வேறொரு அடையாளத்தை நான் கண்டேன்: கடைசி ஏழு வாதைகளைக் கொண்டிருந்த ஏழு தூதர்களை; ஏனெனில், அவற்றில் கடவுளின் கடுங்கோபம் நிறைவடைந்தது.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நிறைவுபெற்றது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: அடையாளம்
  rationale: வெளிப்படுத்தலில் காணப்படும் காட்சிக்குரிய, குறியீட்டுத் தன்மையுள்ள நிகழ்வை இயல்பாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: ἐν τῷ οὐρανῷ
  choice: பரலோகத்தில்
  rationale: இச்சூழலில் காணக்கூடிய வானத்தைவிடப் பரலோக மண்டலமே குறிக்கப்படுகிறது.
- source_word: μέγα καὶ θαυμαστόν
  choice: பெரிதும் வியப்புக்குரியதுமான
  rationale: μέγα என்பதன் மேன்மையையும் θαυμαστόν என்பதன் வியப்பூட்டும் தன்மையையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: ἀγγέλους ἑπτὰ
  choice: ஏழு தூதர்கள்
  rationale: யோவான் கண்ட காட்சியின் உள்ளடக்கத்தை நேரடியாக வழங்குகிறது.
- source_word: ἔχοντας
  choice: கொண்டிருந்த
  rationale: தூதர்களோடு வாதைகள் தொடர்புடையிருப்பதைக் காட்டும் நிகழ்காலப் பங்கேற்புவினையின் உறவை, காட்சியின் இறந்தகால உரையோட்டத்திற்கு ஏற்ற தமிழில் தருகிறது.
- source_word: πληγὰς ἑπτὰ τὰς ἐσχάτας
  choice: கடைசியான ஏழு வாதைகள்
  rationale: தெய்வீகத் தீர்ப்பின் தாக்கங்களைக் குறிக்கும் πληγή என்பதற்கு வேதாகமத் தமிழில் புரிந்துகொள்ளத்தக்க 'வாதைகள்' என்பதையும், வரிசையின் இறுதியைக் குறிக்கும் ἐσχάτας என்பதற்கு 'கடைசியான' என்பதையும் பயன்படுத்துகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: இவை கடைசி வாதைகள் எனப்படுவதற்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: ἐν αὐταῖς
  choice: அவற்றில்
  rationale: வாதைகளிலேயே கடவுளின் கடுங்கோபம் நிறைவை அடைகிறது என்ற மூலத்தின் இடவியல்/கருவியியல் தெளிவின்மையை ஓரளவு பாதுகாக்கிறது.
- source_word: ἐτελέσθη
  choice: நிறைவடைந்தது
  rationale: வெறுமனே முடிவுக்கு வந்தது என்பதைக் காட்டிலும், குறிக்கப்பட்ட நிறைவை எட்டியது என்ற τελέω வினையின் பொருளைத் தக்கவைக்கிறது.
- source_word: ὁ θυμὸς τοῦ θεοῦ
  choice: கடவுளின் கடுங்கோபம்
  rationale: θυμός குறிக்கும் தீவிரமான தெய்வீகக் கோபத்தைச் சீரிய, இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: வெளிப்படுத்தலின் நியாயத்தீர்ப்புச் சூழலில் θυμός என்பதன் மொழிபெயர்ப்பு
  choice: கடவுளின் கடுங்கோபம்
  alternative: கடவுளின் கோபம்
  rationale: '''கடுங்கோபம்'' என்பது மூலச்சொல்லின் தீவிரத்தைப் பாதுகாக்கிறது; அதேவேளை உரை கூறுவதற்கு அப்பாற்பட்ட கோட்பாட்டைச் சேர்ப்பதில்லை.'
- issue: ἐτελέσθη என்பதன் நிறைவு சார்ந்த பொருள்
  choice: நிறைவடைந்தது
  alternative: முடிவடைந்தது
  rationale: இந்த ஏழு வாதைகளில் கடவுளின் கடுங்கோபம் குறிக்கப்பட்ட நிறைவை எட்டுகிறது என்ற பொருளைப் பாதுகாக்கிறது; இதற்கு அப்பாற்பட்ட எல்லா நியாயத்தீர்ப்பும் முடிந்துவிட்டதாக உரையை விரிவுபடுத்துவதில்லை.
- issue: ἐν αὐταῖς என்பதன் தொடர்பு
  choice: அவற்றில்
  alternative: அவற்றினால்
  rationale: ἐν என்பதன் நேரடியான வடிவத்தைத் தக்கவைத்து, வாதைகள் இடமாகவோ கருவியாகவோ புரிந்துகொள்ளப்படக்கூடிய நுண்ணிய தெளிவின்மையைத் தீர்மானித்துவிடாமல் விடுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் சீரிய வெளிப்படுத்தல் நடையைப் பேணுகிறது. நீண்ட கிரேக்க வாக்கியத்தை வாசிப்பிற்கு ஏற்றவாறு இரு வாக்கியங்களாகப் பிரித்தாலும், காரணத் தொடர்பும் காட்சியின் அமைப்பும் பாதுகாக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
