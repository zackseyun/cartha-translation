- from: 'பின்பு பரலோகத்தில் பெரிதும் வியப்புக்குரியதுமான வேறொரு அடையாளத்தைக் கண்டேன்: கடைசியான ஏழு வாதைகளைக் கொண்டிருந்த ஏழு தூதர்கள். ஏனெனில், அவற்றில் கடவுளின் கடுங்கோபம் நிறைவடைந்தது.[a]'
