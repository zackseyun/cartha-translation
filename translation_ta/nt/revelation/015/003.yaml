revisions:
- from: 'அவர்கள் தேவனுடைய அடியாரான மோசேயின் பாடலையும் ஆட்டுக்குட்டியானவரின் பாடலையும் பாடி, இவ்வாறு சொல்கிறார்கள்: “ஆண்டவரே, எல்லாம் வல்ல தேவனே, உமது செயல்கள் பெரியவையும் வியப்புக்குரியவையுமாய் இருக்கின்றன; காலங்களின் அரசரே[a], உமது வழிகள் நீதியானவையும் உண்மையானவையுமாய் இருக்கின்றன.”'
  to: 'அவர்கள் தேவனுடைய அடியாரான மோசேயின் பாடலையும் ஆட்டுக்குட்டியானவரின் பாடலையும் பாடுகிறார்கள்; இவ்வாறு பாடுகிறார்கள்: “ஆண்டவரே, தேவனே, எல்லாம் வல்லவரே, உமது செயல்கள் பெரியவையும் வியப்புக்குரியவையுமாய் இருக்கின்றன; காலங்களின் அரசரே[a], உமது வழிகள் நீதியானவையும் உண்மையானவையுமாய் இருக்கின்றன.”'
  rationale: The revision preserves the draft’s sound choices while making the quoted words explicitly the song being sung and retaining the three components of the Greek divine title as separate direct addresses. The textual-variant footnote remains correctly anchored to “காலங்களின் அரசரே.”
