id: REV.15.3
reference: Revelation 15:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν τὴν ᾠδὴν Μωϋσέως τοῦ δούλου τοῦ θεοῦ καὶ τὴν ᾠδὴν τοῦ ἀρνίου λέγοντες· Μεγάλα καὶ θαυμαστὰ τὰ ἔργα σου, κύριε, ὁ θεός, ὁ παντοκράτωρ· δίκαιαι καὶ ἀληθιναὶ αἱ ὁδοί σου, ὁ βασιλεὺς τῶν ⸀αἰώνων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/003.yaml
  text: 'And they sing the song of Moses[a], the servant of God, and the song of the Lamb, saying: “Great and marvelous are your works, Lord God, the Almighty; righteous and true are your ways, O King of the ages.”'
translation:
  language: ta
  text: 'அவர்கள் தேவனுடைய அடியாரான மோசேயின் பாடலையும் ஆட்டுக்குட்டியானவரின் பாடலையும் பாடுகிறார்கள்; இவ்வாறு பாடுகிறார்கள்: “ஆண்டவரே, தேவனே, எல்லாம் வல்லவரே, உமது செயல்கள் பெரியவையும் வியப்புக்குரியவையுமாய் இருக்கின்றன; காலங்களின் அரசரே[a], உமது வழிகள் நீதியானவையும் உண்மையானவையுமாய் இருக்கின்றன.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் ‘காலங்களின் அரசரே’ என்பதற்குப் பதிலாக ‘நாடுகளின் அரசரே’ என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: ᾄδουσιν
  choice: பாடி, இவ்வாறு சொல்கிறார்கள்
  rationale: நிகழ்காலப் பன்மையைத் தரிசனக் காட்சியின் உயிரோட்டமுள்ள நிகழ்காலமாகக் காட்டுகிறது; தொடர்ந்து வரும் λέγοντες என்பதையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: ᾠδὴν
  choice: பாடல்
  rationale: வழக்கமான பொருளை நேரடியாகத் தருகிறது; கிரேக்கம் கட்டாயப்படுத்தாத வழிபாட்டுச் சிறப்புப் பொருளைச் சேர்க்கவில்லை.
- source_word: δούλου
  choice: அடியாரான
  rationale: மோசே தேவனுக்குச் சொந்தமானவராகவும் அவருக்குப் பணிபுரிபவராகவும் இருப்பதை மதிப்புடன் உணர்த்துகிறது; நவீன தமிழில் ‘அடிமை’ ஏற்படுத்தக்கூடிய தேவையற்ற இழிவுப் பொருளைத் தவிர்த்தாலும் மூலச்சொல்லின் கீழ்ப்படிதல் மற்றும் உடைமைத் தொடர்பை முற்றிலும் மென்மைப்படுத்தவில்லை.
- source_word: ἀρνίου
  choice: ஆட்டுக்குட்டியானவர்
  rationale: வெளிப்படுத்தலில் கிறிஸ்துவைக் குறிக்கும் பட்டமாக இருப்பதால், பலியையும் மேசியாவையும் குறிக்கும் உருவகத்தைப் பாதுகாக்க மரியாதைப் பன்மையுடன் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἔργα
  choice: செயல்கள்
  rationale: தேவனுடைய வல்லமையான செய்கைகளைக் குறிக்கும் இயல்பான நவீன தமிழ்.
- source_word: Μεγάλα καὶ θαυμαστὰ
  choice: பெரியவையும் வியப்புக்குரியவையுமாய்
  rationale: செயல்களின் மேன்மையையும் அவை வியப்பை உண்டாக்குவதையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: κύριε, ὁ θεός, ὁ παντοκράτωρ
  choice: ஆண்டவரே, எல்லாம் வல்ல தேவனே
  rationale: κύριος, θεός, παντοκράτωρ ஆகிய மூன்று கூறுகளையும் இயல்பான தமிழ் விளிவடிவில் பாதுகாக்கிறது.
- source_word: δίκαιαι καὶ ἀληθιναὶ
  choice: நீதியானவையும் உண்மையானவையுமாய்
  rationale: தேவனுடைய வழிகளின் நீதித்தன்மையையும் நம்பத்தகுந்த உண்மைத்தன்மையையும் தனித்தனியாகத் தக்கவைக்கிறது.
- source_word: ὁ βασιλεὺς τῶν αἰώνων
  choice: காலங்களின் அரசரே
  rationale: வழங்கப்பட்ட SBLGNT வாசகமான αἰώνων என்பதன் பன்மையையும் காலங்களை ஆளும் அரசாட்சி என்ற திறந்த பொருளையும் பாதுகாக்கிறது.
theological_decisions:
- issue: மோசேக்கான δοῦλος பட்டப்பெயர்
  choice: தேவனுடைய அடியாரான மோசே
  alternative: தேவனுடைய அடிமையான மோசே
  rationale: ‘அடியார்’ என்பது தேவனுக்குரியவர், அவருக்குக் கீழ்ப்படிந்து பணிபுரிபவர் என்ற இரு கூறுகளையும் மதிப்பான தமிழில் தாங்குகிறது. ‘அடிமை’ மூலத்தின் வலிமையை மேலும் நேரடியாகக் காட்டினாலும், இச்சூழலில் தேவையற்ற இழிவுணர்வை உருவாக்கலாம்.
- issue: வசன முடிவிலுள்ள அரசப் பட்டத்தின் மூலபாட வேறுபாடு
  choice: காலங்களின் அரசர்
  alternative: நாடுகளின் அரசர்
  rationale: முதன்மை உரையாக வழங்கப்பட்ட SBLGNT-இன் αἰώνων (‘காலங்கள்’) பின்பற்றப்படுகிறது; முக்கியமான ἐθνῶν (‘நாடுகள்’) வாசகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் பாடலுக்குரிய உயர்வும் மரியாதையும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. நேரடி அழைப்புகளில் ‘ஆண்டவரே’, ‘தேவனே’, ‘அரசரே’ என்ற விளிவடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; இறையியல் தெளிவின்மைகளும் மூலபாட வேறுபாடும் மறைக்கப்படவில்லை.
