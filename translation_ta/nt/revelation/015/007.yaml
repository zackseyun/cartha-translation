source:
  edition: SBLGNT
  text: καὶ ἓν ἐκ τῶν τεσσάρων ζῴων ἔδωκεν τοῖς ἑπτὰ ἀγγέλοις ἑπτὰ φιάλας χρυσᾶς γεμούσας τοῦ θυμοῦ τοῦ θεοῦ τοῦ ζῶντος εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/007.yaml
  text: And one of the four living creatures gave to the seven angels seven golden bowls full of the wrath of God[b][a], who lives forever and ever.
translation:
  language: ta
  text: நான்கு உயிரினங்களில் ஒன்று, என்றென்றும்[b] வாழும் தேவனுடைய கடும் சினத்தால் நிறைந்த ஏழு பொற்கிண்ணங்களை[a] அந்த ஏழு தூதர்களுக்குக் கொடுத்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஏழு பொன் கலசங்களை’ அல்லது ‘ஏழு பொன் பாத்திரங்களை’; கிரேக்கச் சொல் அகன்ற, ஆழம் குறைந்த கிண்ணம் போன்ற ஒரு பாத்திரத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், ‘காலங்களின் காலங்கள்வரை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἓν ἐκ τῶν τεσσάρων ζῴων
  choice: நான்கு உயிரினங்களில் ஒன்று
  rationale: வெளிப்படுத்தலில் சிங்காசனத்தைச் சூழ்ந்துள்ள உயிருள்ள வானுலகப் படைப்புகளை ζῷα குறிக்கிறது. θηρίον என்பதற்குரிய ‘மிருகம்’ என்ற சொல்லோடு குழப்பம் ஏற்படாதபடி ‘உயிரினங்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἔδωκεν
  choice: கொடுத்தது
  rationale: δίδωμι என்பதன் இறந்தகாலச் செயலை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: τοῖς ἑπτὰ ἀγγέλοις
  choice: அந்த ஏழு தூதர்களிடம்
  rationale: வானுலகத் தூதர்களைக் குறிக்கும் ἄγγελοι என்பதற்கு ‘தூதர்கள்’ இயல்பான தமிழ் இணை. முன் சூழலில் அறிமுகமான குறிப்பிட்ட ஏழு தூதர்கள் என்பதால் ‘அந்த’ சேர்க்கப்பட்டுள்ளது.
- source_word: ἑπτὰ φιάλας χρυσᾶς
  choice: ஏழு பொற்கிண்ணங்களை
  rationale: φιάλη என்பது அகன்ற, ஆழம் குறைந்த கிண்ணம் போன்ற பாத்திரம்; ‘கிண்ணம்’ நவீன தமிழில் தெளிவானது. χρυσᾶς அதன் பொன் பொருளமைப்பை ‘பொற்கிண்ணங்கள்’ எனச் சுருக்கமாகத் தருகிறது.
- source_word: γεμούσας τοῦ θυμοῦ τοῦ θεοῦ
  choice: தேவனுடைய கடும் சினத்தால் நிறைந்த
  rationale: γέμω உடன் வரும் மரபுத்தொடர் முழுமையாக நிரம்பியிருப்பதைக் குறிக்கிறது. இங்கு θυμός இறுதி நியாயத்தீர்ப்பில் வெளிப்படும் தீவிரமான தெய்வீகச் சினத்தைக் குறிப்பதால் ‘கடும் சினம்’ அதன் வலிமையை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: τοῦ ζῶντος εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: என்றென்றும் வாழ்கிற
  rationale: ζῶντος என்பது தேவனை விளக்கும் நிகழ்காலப் பெயரெச்சம். εἰς τοὺς αἰῶνας τῶν αἰώνων முடிவற்ற காலத்தைச் சுட்டும் மரபுத்தொடர்; ‘என்றென்றும்’ தெளிவான இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: தெய்வீக θυμός என்பதன் மொழிபெயர்ப்பு
  choice: தேவனுடைய கடும் சினம்
  alternative: தேவனுடைய கோபம்; தேவனுடைய உக்கிரம்
  rationale: சூழல் இறுதி நியாயத்தீர்ப்பைப் பற்றியது. ‘கடும் சினம்’ தீவிரத்தையும் நீதித்தீர்ப்பின் கனத்தையும் காக்கிறது; அதேவேளை பழமையான அல்லது அளவுக்கு மீறிய சொல்லாட்சியைத் தவிர்க்கிறது.
- issue: தேவனுடைய வாழ்வும் நித்தியத்துவமும்
  choice: என்றென்றும் வாழ்கிற தேவன்
  alternative: என்றென்றும் உயிரோடிருக்கிற தேவன்; காலகாலங்களாக வாழ்கிற தேவன்
  rationale: கிரேக்கத்தில் ζῶντος என்பது தேவனைச் சுட்டுகிறது; அதைத் தொடர்ந்து வரும் கால மரபுத்தொடர் அவர் முடிவின்றி வாழ்வதைத் தெரிவிக்கிறது. தமிழ் வடிவம் இவ்விரண்டையும் இணைத்துக் காக்கிறது; கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டுள்ளது. ‘கடும் சினம்’ மூலத்தின் தீவிரத்தை காக்கிறது; ‘பொற்கிண்ணங்கள்’ பாத்திரத்தின் வடிவையும் பொருளையும் சுருக்கமாகத் தெரிவிக்கிறது. இரு அடிக்குறிப்புக் குறிகளும் அவை விளக்கும் சொற்றொடர்களின் அருகே வைக்கப்பட்டுள்ளன.
