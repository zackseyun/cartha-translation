  text: Καὶ μετὰ ταῦτα εἶδον, καὶ ἠνοίγη ὁ ναὸς τῆς σκηνῆς τοῦ μαρτυρίου ἐν τῷ οὐρανῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/005.yaml
  text: And after these things I saw[a], and the temple of the tabernacle of the testimony in heaven was opened[b],
translation:
  language: ta
  text: இவற்றுக்குப் பிறகு நான் கண்டேன்; பரலோகத்திலுள்ள சாட்சியின் திருக்கூடாரத்தின்[b] ஆலயம்[a] திறக்கப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆலயம்’ என்பதற்கான கிரேக்கச் சொல் ναός; இது ஆலய வளாகம் முழுவதையும்விட அதன் உள்ளார்ந்த பரிசுத்த இடத்தைக் குறிப்பாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘சாட்சியின் திருக்கூடாரம்’ என்பது வனாந்தரத்தில் இருந்த வழிபாட்டுக் கூடாரத்தையும், தேவனுடைய உடன்படிக்கைச் சாட்சியோடு அதற்கிருந்த தொடர்பையும் நினைவூட்டும் பழைய ஏற்பாட்டு மொழியாகும்.
    reason: cross_reference
lexical_decisions:
- source_word: Καὶ μετὰ ταῦτα
  choice: இவற்றுக்குப் பிறகு
  rationale: தரிசன நிகழ்வுகளின் தொடர்ச்சியைக் குறிக்கும் சொற்றொடர்; ταῦτα என்பதன் பன்மையைத் தமிழிலும் காக்கிறது. தமிழின் இயல்பான நடைக்காக தொடக்க Καὶ தனியே ‘மேலும்’ என மொழிபெயர்க்கப்படவில்லை.
- source_word: εἶδον
  choice: நான் கண்டேன்
  rationale: தரிசனத்தில் யோவான் உணர்ந்து கண்டதை நேரடியாகத் தெரிவிக்கிறது; ‘பார்த்தேன்’ என்பதைவிட தரிசன மொழிநடைக்கு ஏற்றது.
- source_word: ἠνοίγη
  choice: திறக்கப்பட்டது
  rationale: இறந்தகாலச் செயப்பாட்டு வடிவத்தின் பொருளை இயல்பான தமிழில் காக்கிறது; ஆலயம் திறந்த நிலையை அடைந்த நிகழ்வைச் சுட்டுகிறது.
- source_word: ὁ ναὸς
  choice: பரிசுத்த ஆலயம்
  rationale: ναός என்பது விரிந்த ஆலய வளாகத்தைவிட உள்ளார்ந்த பரிசுத்த இடத்தைக் குறிக்கக்கூடும். ‘பரிசுத்த ஆலயம்’ என்பது அந்த நுணுக்கத்தையும் வாசிப்பின் தெளிவையும் காக்கிறது.
- source_word: τῆς σκηνῆς
  choice: திருக்கூடாரமாகிய
  rationale: σκηνή இங்கு வனாந்தரத்தில் அமைக்கப்பட்ட வழிபாட்டுக் கூடாரத்தை நினைவூட்டுகிறது. ‘திருக்கூடாரம்’ என்பது நவீன தமிழில் புரியத்தக்கதாயும் வேதாகம வழிபாட்டுச் சூழலைத் தக்கவைத்தும் உள்ளது.
- source_word: τοῦ μαρτυρίου
  choice: சாட்சியின்
  rationale: μαρτύριον என்பதன் அடிப்படைச் ‘சாட்சி’ கருத்தைத் தக்கவைத்து, உடன்படிக்கையோடு தொடர்புடைய தேவ சாட்சியை நினைவூட்டுகிறது; அது எதைக் குறிப்பதாகும் என்பதை உரையிலேயே மிகையாக விளக்கவில்லை.
- source_word: ἐν τῷ οὐρανῷ
  choice: பரலோகத்தில் இருந்த
  rationale: ஆலயத்தைப் பரலோகத்தில் அமைந்ததாகத் தெளிவாகக் குறிப்பிடுகிறது. தமிழில் இடத் தொடர்பை இயல்பாகப் புரியவைக்க ‘இருந்த’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: பரலோகப் பரிசுத்த இடத்தையும் திருக்கூடாரத்தையும் இணைக்கும் வழிபாட்டு உருவகம்
  choice: ‘சாட்சியின் திருக்கூடாரமாகிய பரிசுத்த ஆலயம்’ என்று அடுக்கப்பட்ட உறவைத் தக்கவைத்தல்
  alternative: ‘பரலோகப் பரிசுத்த இடம்’ என்று சுருக்குதல்; அல்லது ‘பரலோகத்திலுள்ள ஆலயம், அதாவது சாட்சியின் திருக்கூடாரம்’ என்று விளக்குதல்
  rationale: கிரேக்க உரையின் தொடர்ச்சியான உடைமை வேற்றுமை அமைப்பு பழைய ஏற்பாட்டுத் திருக்கூடார மொழியையும் வெளிப்படுத்தலில் காணப்படும் பரலோக ஆலய உருவகத்தையும் ஒன்றோடொன்று இணைக்கிறது. ‘ஆகிய’ என்பது அவற்றின் உறவைத் தெளிவாக்கினாலும், ஒன்றை மற்றொன்றிலிருந்து முற்றிலும் பிரிப்பதையோ உருவகத்தைச் சுருக்குவதையோ தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘கோவில்’ என்பதற்குப் பதிலாக கிறிஸ்தவ வேதாகம வழக்கில் தெளிவான ‘ஆலயம்’ என்பதும், σκηνή என்பதன் வழிபாட்டு மற்றும் வனாந்தரப் பின்னணியை வெளிப்படுத்த ‘திருக்கூடாரம்’ என்பதும் தேர்ந்தெடுக்கப்பட்டன. மூலத்தின் வழிபாட்டு உருவக அடுக்கை அழிக்காமல், தமிழில் படிக்கத்தக்க வகையில் இருபுள்ளி மற்றும் ‘ஆகிய’ பயன்படுத்தப்பட்டுள்ளன.
