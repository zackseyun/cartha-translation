id: REV.15.4
reference: Revelation 15:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τίς οὐ μὴ ⸀φοβηθῇ, κύριε, καὶ ⸀δοξάσει τὸ ὄνομά σου, ὅτι μόνος ⸀ὅσιος; ὅτι πάντα τὰ ἔθνη ἥξουσιν καὶ προσκυνήσουσιν ἐνώπιόν σου, ὅτι τὰ δικαιώματά σου ἐφανερώθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/004.yaml
  text: Who will not fear[a], Lord, and glorify your name? For you alone are holy. For all the nations will come and worship before you, because your righteous acts have been revealed.
translation:
  language: ta
  text: ஆண்டவரே, உமக்கு அஞ்சாமலும் உமது பெயரை மகிமைப்படுத்தாமலும் இருப்பார் யார்? ஏனெனில் நீர் மட்டுமே பரிசுத்தர். எல்லா நாடுகளும் வந்து உமது முன்னிலையில் வழிபடும்; ஏனெனில் உமது நீதியான செயல்கள்[a] வெளிப்படுத்தப்பட்டுள்ளன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது நீதியான தீர்ப்புகள்.” கிரேக்கச் சொல் நீதித்துறைத் தீர்ப்புகளையோ கட்டளைகளையோ கூட குறிக்கலாம்; இங்கு வெளிப்படையாகத் தெரியவந்த கடவுளின் நீதியான செயல்களைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς οὐ μὴ φοβηθῇ
  choice: உமக்கு அஞ்சாமலும் ... இருப்பவர் யார்?
  rationale: οὐ μή கொண்ட வினாவிற்கு ‘ஒருவரும் இல்லை’ என்ற வலுவான எதிர்பார்ப்பு உள்ளது. தமிழில் எதிர்மறை வினாவாக அமைப்பது அந்தச் சொல்லாட்சியின் வலிமையையும் இயல்பையும் காக்கிறது.
- source_word: κύριε
  choice: ஆண்டவரே
  rationale: κύριος என்பதன் விளிவேற்றுமை வடிவை, தெய்வத்தை நேரடியாக அழைக்கும் மரியாதையான வழக்குத் தமிழில் தருகிறது.
- source_word: δοξάσει τὸ ὄνομά σου
  choice: உமது பெயரை மகிமைப்படுத்தாமலும்
  rationale: ‘பெயரை மகிமைப்படுத்துதல்’ என்ற வேதாகமச் சொல்லாட்சி, கடவுளின் வெளிப்படுத்தப்பட்ட குணத்தையும் புகழையும் கனப்படுத்துவதைத் தக்கவைக்கிறது.
- source_word: μόνος ὅσιος
  choice: நீர் ஒருவரே பரிசுத்தர்
  rationale: ὅσιος இங்கு கடவுளின் தனித்துவமான தூய்மையையும் நேர்மையையும் போற்றுகிறது. ‘பரிசுத்தர்’ வழிபாட்டுச் சூழலுக்குப் பொருத்தமான, பரவலாகப் புரியும் தமிழ்ச் சொல்.
- source_word: πάντα τὰ ἔθνη
  choice: எல்லா நாடுகளும்
  rationale: ἔθνη இங்கு இறுதிக்கால உலகளாவிய வழிபாட்டில் பங்குகொள்ளும் அனைத்து இன-தேசியக் கூட்டங்களையும் குறிக்கிறது; ‘நாடுகள்’ அந்தக் கூட்டுப் பொருளைத் தக்கவைக்கிறது.
- source_word: ἥξουσιν
  choice: வந்து
  rationale: ἥκω என்பதன் வருதல்/வந்தடைதல் என்ற பொருளை, அடுத்த வினையுடன் இயல்பான தமிழில் இணைக்கிறது; வாக்கியத்தின் எதிர்கால வினைமுற்று இரு செயல்களையும் ஆளுகிறது.
- source_word: προσκυνήσουσιν ἐνώπιόν σου
  choice: உமது முன்னிலையில் வழிபடும்
  rationale: προσκυνέωவின் சமய வழிபாட்டுப் பொருளையும் ἐνώπιόν σουவின் ‘உமக்கு முன்பாக’ என்ற இடைமுகப் பொருளையும் மிகைப்படுத்தாமல் காக்கிறது.
- source_word: τὰ δικαιώματά σου
  choice: உமது நீதியான செயல்கள்
  rationale: δικαίωμα நீதியான செயல், தீர்ப்பு, கட்டளை ஆகிய பொருட்களை ஏற்கக்கூடியது. இச்சூழலில் வெளிப்படையாகத் தெரியும் கடவுளின் நீதிச் செயல்களை இது குறிக்கிறது; சட்டரீதியான ஒரே பொருளுக்குள் அதைச் சுருக்கவில்லை.
- source_word: ἐφανερώθησαν
  choice: வெளிப்படுத்தப்பட்டுள்ளன
  rationale: இறந்தகால நிறைவேற்றத்திற்கும் அதன் தற்போதைய விளைவிற்கும் இடமளித்து, அசல் இறந்தகாலச் செயப்பாட்டு வடிவத்தின் வெளிப்படுத்துதல் என்ற கருத்தைத் தருகிறது.
theological_decisions:
- issue: தெய்வீகத் துதியில் ὅσιος என்பதன் மொழிபெயர்ப்பு
  choice: பரிசுத்தர்
  alternative: உண்மையுள்ளவர் / தூயவர்
  rationale: சூழல் கடவுளின் தனித்துவமான ஒழுக்க மற்றும் வழிபாட்டுத் தூய்மையைப் போற்றுகிறது. ‘பரிசுத்தர்’ அந்தப் பரப்பைத் தக்கவைத்து, இதை உடன்படிக்கை உண்மைத்தன்மை என்ற ஒரே கருத்தாகக் குறுக்கவில்லை.
- issue: நியாயத்தீர்ப்புச் சூழலில் δικαιώματα என்பதன் பொருள்
  choice: நீதியான செயல்கள்
  alternative: நீதியான தீர்ப்புகள் / கட்டளைகள்
  rationale: பாடல், நாடுகளுக்கு வெளிப்பட்ட கடவுளின் நீதியைப் போற்றுகிறது. ‘நீதியான செயல்கள்’ மூலச்சொல்லின் பரந்த பொருளைக் காக்கிறது; தீர்ப்புகளும் இதில் அடங்கலாம் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, மரியாதையும் வழிபாட்டுத் தன்மையும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நேரடியாக அழைக்கும் இடத்தில் ‘உமது/நீர்’ வடிவங்கள் ஒருமையாகவும் மரியாதையாகவும் வைக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறியீடு அது விளக்கும் δικαιώματα என்ற சொற்றொடருக்குப் பின்னரே இடப்பட்டுள்ளது.
