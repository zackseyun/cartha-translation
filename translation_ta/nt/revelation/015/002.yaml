revisions:
- from: நெருப்புடன் கலந்த கண்ணாடிக் கடல் போன்ற ஒன்றை நான் கண்டேன். மிருகத்தின்மேலும், அதன் உருவத்தின்மேலும், அதன் பெயருக்குரிய எண்ணின்மேலும் வெற்றிபெற்றவர்கள்[a] அந்தக் கண்ணாடிக் கடலின்மேல் நின்றுகொண்டு, தேவனுடைய யாழ்களை[b] வைத்திருந்தார்கள்.
