  rationale: திருத்தம் கிரேக்க வாக்கியத்தின் இரு நேரடிப் பொருள்களையும் தமிழில் ஒரே ‘நான் கண்டேன்’ வினையுடன் இணைக்கிறது. νικῶντας மற்றும் மூன்று ἐκ தொடர்களின் வெற்றி/விடுதலை சார்ந்த திறந்த நுணுக்கம் முதன்மை உரலிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்படுகிறது. ‘ஏந்தியபடி’ என்பது ἔχοντας-ஐ இயல்பாகத் தருகிறது; எந்தக் கூடுதல் இறையியல் அல்லது காட்சிவிளக்கத்தையும் சேர்ப்பதில்லை.
