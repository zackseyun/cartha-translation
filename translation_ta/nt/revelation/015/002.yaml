id: REV.15.2
reference: Revelation 15:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ εἶδον ὡς θάλασσαν ὑαλίνην μεμιγμένην πυρί, καὶ τοὺς νικῶντας ἐκ τοῦ θηρίου καὶ ἐκ τῆς εἰκόνος αὐτοῦ καὶ ἐκ τοῦ ἀριθμοῦ τοῦ ὀνόματος αὐτοῦ ἑστῶτας ἐπὶ τὴν θάλασσαν τὴν ὑαλίνην, ἔχοντας κιθάρας τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/002.yaml
  text: And I saw what appeared to be a sea of glass mixed with fire[a], and those who were victorious over the beast and over its image and over the number of its name, standing on the sea of glass[b], holding harps of God.
translation:
  language: ta
  text: நெருப்புடன் கலந்த கண்ணாடிக் கடல் போன்ற ஒன்றையும், மிருகத்தின்மேலும், அதன் உருவத்தின்மேலும், அதன் பெயரின் எண்ணின்மேலும் வெற்றிபெற்றவர்கள்[a] தேவனுடைய யாழ்களை[b] ஏந்தியபடி அந்தக் கண்ணாடிக் கடலின்மேல் நின்றவர்களையும் நான் கண்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மிருகத்தையும் அதன் உருவத்தையும் அதன் பெயரின் எண்ணையும் வென்றவர்கள்’ என்றும் மொழிபெயர்க்கலாம்; இன்னும் சொல்லுக்கு நெருக்கமாக, ‘மிருகத்திலிருந்து ... வெற்றிபெற்றவர்கள்’ என்று உள்ளது. கிரேக்கத் தொடர், மிருகத்தின்மேல் பெற்ற வெற்றியையோ அதன் அதிகாரத்திலிருந்து விடுபட்டு வந்ததையோ வலியுறுத்தக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: ‘தேவனுக்குரிய யாழ்கள்’ அல்லது ‘தேவன் கொடுத்த யாழ்கள்’ என்றும் பொருள்கொள்ளலாம். கிரேக்க உடைமைத் தொடர் உரிமை, மூலம் அல்லது அர்ப்பணிப்பைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς θάλασσαν ὑαλίνην
  choice: கண்ணாடிக் கடல் போன்ற ஒன்றை
  rationale: ὡς தரிசனத்தில் காணப்பட்ட ஒப்புமையைக் குறிக்கிறது; ‘போன்ற ஒன்று’ என்பது அதை நேரடியான அடையாளமாக மாற்றாமல் இயல்பான தமிழில் தருகிறது. ‘கண்ணாடிக் கடல்’ மீண்டும் வரும் உருவகத்தையும் காக்கிறது.
- source_word: μεμιγμένην πυρί
  choice: நெருப்புடன் கலந்த
  rationale: முற்றுப்பெற்ற பங்கேற்புவினையின் கலந்த நிலையில் காணப்பட்ட வியப்பூட்டும் காட்சியை விளக்கம் சேர்க்காமல் நேரடியாகத் தருகிறது.
- source_word: τοὺς νικῶντας
  choice: வெற்றிபெற்றவர்கள்
  rationale: வெளிப்படுத்தலில் νικάω குறிக்கும் மேற்கொள்ளுதல் அல்லது வெற்றிகொள்ளுதல் என்ற கருத்தை, தேவையற்ற இராணுவத் தொனி இல்லாமல் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐκ τοῦ θηρίου ... ἐκ τῆς εἰκόνος ... ἐκ τοῦ ἀριθμοῦ
  choice: மிருகத்தின்மேலும், அதன் உருவத்தின்மேலும், அதன் பெயருக்குரிய எண்ணின்மேலும்
  rationale: νικῶντας உடன் வரும் தொடரை இயல்பான தமிழில் வெற்றியின் எதிர்ப்பொருளாகக் காட்டுகிறது; மூன்று ἐκ சொற்றொடர்களின் இணை அமைப்பைத் தக்கவைக்க ‘மேலும்’ மீண்டும் வழங்கப்பட்டுள்ளது. ‘பெயருக்குரிய எண்’ என்பது τοῦ ὀνόματος என்பதன் உறவை இயல்பாகத் தருகிறது.
- source_word: ἑστῶτας ἐπὶ τὴν θάλασσαν τὴν ὑαλίνην
  choice: அந்தக் கண்ணாடிக் கடலின்மேல் நின்றுகொண்டு
  rationale: ἐπί உடன் குற்றுவேற்றுமை இங்கு தரும் வியப்பூட்டும் ‘மேல்’ காட்சியை மெலிதாக்காமல் காக்கிறது; ‘அந்த’ என்பது முன் குறிப்பிடப்பட்ட கடலைச் சுட்டுகிறது.
- source_word: κιθάρας τοῦ θεοῦ
  choice: தேவனுடைய யாழ்களை
  rationale: κιθάραவுக்கான இயல்பான, இலக்கியத் தமிழ்ச் சொல் ‘யாழ்’. τοῦ θεοῦ என்பதன் உரிமை, மூலம் அல்லது அர்ப்பணிப்பு சார்ந்த சாத்தியங்களை அடிக்குறிப்பில் திறந்துவைத்து, முதன்மை உரையில் இயல்பான உடைமைத் தொடராக வழங்குகிறது.
theological_decisions:
- issue: νικῶντας என்பதற்குப் பின் மீண்டும் வரும் ἐκ, வெற்றியையா அல்லது மிருகத்தின் அதிகாரத்திலிருந்து வெளியேறுதலையா குறிக்கிறது?
  choice: மிருகம், அதன் உருவம், அதன் பெயருக்குரிய எண் ஆகியவற்றின்மேல் அவர்கள் வெற்றிபெற்றவர்கள் என முதன்மை உரையில் வழங்கப்பட்டது.
  alternative: மிருகம், அதன் உருவம், அதன் பெயருக்குரிய எண் ஆகியவற்றின் அதிகாரத்திலிருந்து விடுபட்டு வந்தவர்கள்.
  rationale: νικάω உடன் தமிழில் ‘மேல் வெற்றிபெறு’ என்பது தெளிவும் இயல்பும் உடையது; ஆயினும் ἐκ என்பதன் ‘இருந்து/விட்டு’ நுணுக்கம் உண்மையான மாற்றுச் சாத்தியம் என்பதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: κιθάρας τοῦ θεοῦ என்பதில் உள்ள இறைச்சார்பு உரிமையா, மூலமா, அர்ப்பணிப்பா?
  choice: தேவனுடைய யாழ்கள்
  alternative: தேவன் கொடுத்த யாழ்கள்; தேவனுக்கென அர்ப்பணிக்கப்பட்ட யாழ்கள்.
  rationale: மூலமொழியின் உறவை ஒரு குறிப்பிட்ட இறையியல் விளக்கமாகச் சுருக்காமல், பொதுவான உடைமைத் தொடரும் அடிக்குறிப்பும் இணைந்து தெளிவின்மையைப் பாதுகாக்கின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. வெளிப்படுத்தலுக்குரிய வியப்பூட்டும் காட்சிமொழி விளக்கிச் சீராக்கப்படாமல் காக்கப்பட்டுள்ளது. ‘யாழ்’ என்பது இன்றைய பேச்சுவழக்கில் அரிதாயினும், வேதாகமக் காட்சிக்கு ஏற்ற, பரவலாக அறியப்பட்ட தமிழ்ச் இசைக்கருவிப் பெயராகத் தேர்ந்தெடுக்கப்பட்டது.
