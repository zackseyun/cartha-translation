id: REV.15.8
reference: Revelation 15:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐγεμίσθη ὁ ναὸς καπνοῦ ἐκ τῆς δόξης τοῦ θεοῦ καὶ ἐκ τῆς δυνάμεως αὐτοῦ, καὶ οὐδεὶς ἐδύνατο εἰσελθεῖν εἰς τὸν ναὸν ἄχρι τελεσθῶσιν αἱ ἑπτὰ πληγαὶ τῶν ἑπτὰ ἀγγέλων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/008.yaml
  text: And the sanctuary was filled with smoke from the glory of God and from his power[a], and no one was able to enter the sanctuary until the seven plagues of the seven angels were finished.
translation:
  language: ta
  text: கடவுளுடைய மகிமையிலிருந்தும் அவருடைய வல்லமையிலிருந்தும் வந்த புகையால் பரிசுத்த உறைவிடம்[a] நிறைந்தது. ஏழு தூதர்களின் ஏழு வாதைகளும் நிறைவேறும்வரை, யாராலும் அந்தப் பரிசுத்த உறைவிடத்துக்குள் நுழைய முடியவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பரிசுத்த உறைவிடம்’ என்பதற்குப் பதிலாக ‘ஆலயம்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ναός பொதுவாக ஆலய வளாகம் முழுவதையும்விட, கடவுள் உறையும் உட்புறப் பரிசுத்த இடத்தைக் குறிப்பாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὸς
  choice: பரிசுத்த உறைவிடம்
  rationale: ναός என்பது பொதுவாக ஆலய வளாகம் முழுவதையும் அல்லாமல், கடவுள் உறையும் உட்புறப் பரிசுத்த இடத்தைக் குறிக்கிறது. ‘பரிசுத்த உறைவிடம்’ அந்தச் சிறப்புப் பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐγεμίσθη
  choice: நிறைந்தது
  rationale: இறந்தகாலச் செயலப்பாட்டு வடிவத்தின் பொருளைத் தமிழில் இயல்பாகத் தருகிறது; புகையால் அந்த இடம் நிரம்பிய நிலையைச் சுட்டுகிறது.
- source_word: καπνοῦ
  choice: புகையால்
  rationale: γεμίζω என்பதுடன் வரும் மரபுவேற்றுமையைத் தமிழில் காரண/நிரப்புப் பொருளுடைய ‘-ஆல்’ வேற்றுமையால் இயல்பாக வழங்குகிறது. கடவுள் வெளிப்படும் காட்சிக்குப் ‘புகை’ பொருத்தமான நேரடிச் சொல்.
- source_word: ἐκ τῆς δόξης τοῦ θεοῦ
  choice: கடவுளுடைய மகிமையிலிருந்து வந்த
  rationale: ἐκ குறிக்கும் தோற்றுவாயைத் தெளிவாகப் பாதுகாக்கிறது; புகை கடவுளின் வெளிப்பட்ட மகிமையிலிருந்து வருவதாகிய காட்சியைச் சுருக்காமல் தருகிறது.
- source_word: ἐκ τῆς δυνάμεως αὐτοῦ
  choice: அவருடைய வல்லமையிலிருந்து வந்த
  rationale: δύναμις என்பதன் தெய்வீக வலிமை/ஆற்றல் பொருளை ‘வல்லமை’ என்ற கண்ணியமான, பரவலாகப் புரியும் சொல்லால் தருகிறது; இணையான இரு ἐκ தொடர்களையும் காக்கிறது.
- source_word: οὐδεὶς ἐδύνατο
  choice: யாராலும் ... முடியவில்லை
  rationale: ஒருவருக்குமே திறன் அல்லது வாய்ப்பு இல்லை என்ற தொடர்ச்சியான இயலாமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἰσελθεῖν εἰς τὸν ναὸν
  choice: அந்தப் பரிசுத்த உறைவிடத்துக்குள் நுழைய
  rationale: உள்ளே செல்வதைக் குறிக்கும் εἰσελθεῖν என்பதையும், முன்பு குறிப்பிடப்பட்ட அதே ναός என்பதையும் தெளிவாகவும் தொடர்ச்சியாகவும் தருகிறது.
- source_word: ἄχρι τελεσθῶσιν
  choice: நிறைவேறும்வரை
  rationale: குறிப்பிட்ட நிகழ்வுகள் முழுமையாக முடியும் கால எல்லையை வெளிப்படுத்துகிறது. ‘நிறைவேறு’ என்பது வாதைகள் நிறைவு பெறுவதையும் தீர்ப்பின் நோக்கம் நிறைவேறுவதையும் தேவையற்ற விளக்கமின்றி தாங்குகிறது.
- source_word: πληγαὶ
  choice: வாதைகள்
  rationale: வெளிப்படுத்தலில் கடவுளுடைய தீர்ப்பாக வரும் பேரிடர் போன்ற தாக்குதல்களைக் குறிக்கும் நிலைபெற்ற வேதாகமத் தமிழ்ச் சொல்; ‘நோய்கள்’ என்று பொருளைக் குறுக்குவதில்லை.
- source_word: τῶν ἑπτὰ ἀγγέλων
  choice: ஏழு தூதர்களின்
  rationale: இந்த வாதைகள் ஏழு தூதர்களோடு தொடர்புடையவை அல்லது அவர்களிடம் ஒப்படைக்கப்பட்டவை என்ற இயல்பான மரபுவேற்றுமைப் பொருளைத் திறந்தவாறே வைக்கிறது.
theological_decisions:
- issue: விண்ணக வழிபாட்டுக் காட்சியில் ναός என்பதன் மொழிபெயர்ப்பு
  choice: பரிசுத்த உறைவிடம்
  alternative: ஆலயம் / திருக்கோயில்
  rationale: இங்கு கடவுளுடைய வாசஸ்தலமாகிய உட்புறப் பரிசுத்த இடமே முன்னிலைப்படுகிறது. ‘ஆலயம்’ என்பது முழு ஆலய வளாகத்தையும் குறிக்கக்கூடும்; ‘பரிசுத்த உறைவிடம்’ குறிப்பான பொருளைக் காக்கிறது, அதேவேளை மகா பரிசுத்த இடம் என்று தேவையற்ற அளவில் குறுக்குவதில்லை.
- issue: ஏழு வாதைகள் ‘நிறைவேறுதல்’
  choice: வாதைகளும் நிறைவேறும்வரை
  alternative: வாதைகள் முடிவடையும்வரை
  rationale: τελεσθῶσιν என்பதன் செயலப்பாட்டு நிறைவு உணர்வைத் தக்கவைக்கிறது. இது அவை வெறுமனே நின்றுபோவதைவிட முழுமையாக நிறைவு பெறுவதைக் காட்டுகிறது; அவற்றின் இறையியல் நோக்கத்தை மேலதிகமாக வரையறுப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வெளிப்படுத்தலின் கண்ணியமான காட்சிநடையைத் தக்கவைக்கும் வகையிலும் மொழியாக்கப்பட்டுள்ளது. ‘கடவுள்’, ‘மகிமை’, ‘வல்லமை’, ‘வாதைகள்’ ஆகிய சொற்கள் தெளிவும் வேதாகமச் செறிவும் கொண்டவை. முதல் வாக்கியத்தில் இரு ἐκ தொடர்களின் இணை அமைப்பும், இரண்டாவது வாக்கியத்தில் கால எல்லியும் பாதுகாக்கப்பட்டுள்ளன.
