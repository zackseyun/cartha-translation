id: REV.15.6
reference: Revelation 15:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐξῆλθον οἱ ἑπτὰ ἄγγελοι οἱ ἔχοντες τὰς ἑπτὰ πληγὰς ἐκ τοῦ ναοῦ, ⸀ἐνδεδυμένοι ⸀λίνον καθαρὸν λαμπρὸν καὶ περιεζωσμένοι περὶ τὰ στήθη ζώνας χρυσᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/006.yaml
  text: And the seven angels who had the seven plagues came out from the sanctuary[a], clothed in clean, bright linen[c][b], and wrapped around the chest with golden sashes.
translation:
  language: ta
  text: ஏழு வாதைகளைக் கொண்டிருந்த அந்த ஏழு தேவதூதர்கள், தூய்மையான, ஒளிவீசும் லினன் துணியை உடுத்தியவர்களாகவும்[b], தங்கள் மார்புகளைச் சுற்றிப் பொற்கச்சைகளைக் கட்டியவர்களாகவும்[c], பரிசுத்த இடத்திலிருந்து[a] வெளியே வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆலயத்திலிருந்து.’ இங்குள்ள கிரேக்கச் சொல் ναός; இது முழு ஆலய வளாகத்தைவிடப் பரிசுத்த உட்பகுதியைக் குறிப்பாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தூய, பிரகாசமான லினன் துணியை உடுத்தியவர்களாகவும்.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘தங்கள் மார்புகளைச் சுற்றிப் பொன் பட்டைகளைக் கட்டியவர்களாகவும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: வெளியே வந்தார்கள்
  rationale: வெளிநோக்கிய நகர்வைக் குறிக்கும் இறந்தகால வினையை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: ἄγγελοι
  choice: தூதர்கள்
  rationale: வெளிப்படுத்தின விசேஷத்தின் பரலோகக் காட்சிச் சூழலில் இவர்கள் மனிதத் தூதர்கள் அல்ல, தேவதூதர்கள் என்பது தெளிவு; வழக்கமான வேதாகமத் தமிழ்ச் சொல்லான ‘தூதர்கள்’ பொருத்தமானது.
- source_word: πληγάς
  choice: வாதைகள்
  rationale: இந்நூலில் தேவனுடைய தீர்ப்பாக வரும் பேரிடர் போன்ற தாக்குதல்களைக் குறிக்கும் நிலைபெற்ற, புரியக்கூடிய தமிழாக்கம்.
- source_word: ναοῦ
  choice: பரிசுத்த இடம்
  rationale: முழு ஆலய வளாகத்தைக் காட்டிலும் உள் திருத்தலத்தைக் குறிக்கும் ναός என்பதன் குறிப்பான பொருளைப் பாதுகாக்கிறது.
- source_word: ἐνδεδυμένοι
  choice: அணிந்துகொண்டு
  rationale: ஆடை அணிந்த நிலையில் இருந்ததை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: λίνον
  choice: நார்ப்பட்டு ஆடைகள்
  rationale: லினன் அல்லது சணல்நூல் ஆடையைக் குறிக்கும் சொல்லை வாசகர்களுக்கு அறிமுகமான வேதாகமத் தமிழில் தருகிறது; ‘மெல்லிய’ என்ற மூலத்தில் இல்லாத பெயரடையைச் சேர்க்கவில்லை.
- source_word: καθαρὸν
  choice: தூய்மையான
  rationale: உடல் சுத்தத்தையும் சடங்கு அல்லது ஒழுக்கத் தூய்மையையும் உள்ளடக்கக்கூடிய மூலச்சொல்லின் பொருள் விரிவைப் பாதுகாக்கிறது.
- source_word: λαμπρὸν
  choice: ஒளிவீசும்
  rationale: வெறும் வெளிர்நிறத்தைக் காட்டாமல் பிரகாசத்தையும் ஒளிர்வையும் தெளிவாகக் காட்டுகிறது.
- source_word: περιεζωσμένοι
  choice: சுற்றிக் கட்டிக்கொண்டு
  rationale: ஒரு பட்டை அல்லது கச்சையை உடலைச் சுற்றிக் கட்டியிருக்கும் தோற்றத்தை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: περὶ τὰ στήθη
  choice: தங்கள் மார்புகளைச் சுற்றி
  rationale: கச்சைகள் இடுப்பில் அல்ல, மார்புப் பகுதியில் கட்டப்பட்டிருந்தன என்ற குறிப்பிடத்தக்க இடவிவரத்தைத் தக்கவைக்கிறது.
- source_word: ζώνας χρυσᾶς
  choice: பொற்கச்சைகள்
  rationale: ζώνη என்பதன் பட்டை அல்லது கச்சை என்ற பொருளையும், அவை மார்பைச் சுற்றியிருந்த காட்சியையும் சுருக்கமாகத் தருகிறது.
theological_decisions:
- issue: பரலோக ஆலயச் சூழலில் ναός என்பதன் மொழிபெயர்ப்பு
  choice: பரிசுத்த இடம்
  alternative: ஆலயம்
  rationale: தேவனுடைய பரலோக வாசஸ்தலத்தின் உள் திருத்தலத்திலிருந்து தூதர்கள் வருவதை இக்காட்சி காட்டுகிறது. ‘பரிசுத்த இடம்’ என்பது முழு ஆலய வளாகம் என்ற பொதுப்பொருளுக்கு மாற்றாமல், மூலச்சொல்லின் குறிப்பான புனித உட்பகுதி என்ற பொருளைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வெளிப்படுத்தின விசேஷத்தின் காட்சிமிக்க, கண்ணியமான நடையைத் தக்கவைத்தும் மொழிபெயர்க்கப்பட்டது. நீண்ட கிரேக்கப் பெயரெச்சத் தொடரை இயல்பான தமிழ் வினையெச்சங்களாக அமைத்துள்ளது; மூலத்தின் விவரங்களும் வரிசைத் தொடர்புகளும் பாதுகாக்கப்பட்டுள்ளன.
