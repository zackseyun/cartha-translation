id: REV.11.10
reference: Revelation 11:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ οἱ κατοικοῦντες ἐπὶ τῆς γῆς χαίρουσιν ἐπ’ αὐτοῖς καὶ ⸀εὐφραίνονται, καὶ δῶρα ⸀πέμψουσιν ἀλλήλοις, ὅτι οὗτοι οἱ δύο προφῆται ἐβασάνισαν τοὺς κατοικοῦντας ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/010.yaml
  text: And those who dwell on the earth rejoice over them and celebrate[a], and they will send gifts to one another[b], because these two prophets tormented those who dwell on the earth.
translation:
  language: ta
  text: பூமியில் குடியிருப்பவர்கள் அவர்களைக் குறித்து மகிழ்கிறார்கள், களிகூருகிறார்கள்; ஒருவருக்கொருவர் பரிசுகளை அனுப்புவார்கள். ஏனெனில், இந்த இரண்டு தீர்க்கதரிசிகளும் பூமியில் குடியிருப்பவர்களை வேதனைப்படுத்தினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ κατοικοῦντες ἐπὶ τῆς γῆς
  choice: பூமியில் குடியிருப்பவர்கள்
  rationale: வெளிப்படுத்தலில் மீண்டும் வரும் பங்கேற்புவினைத் தொடரின் வினைநிலையையும் அதன் தனித்துவமான சொற்பயன்பாட்டையும் இயல்பான தமிழில் காக்கிறது; வசனத்தின் இரு இடங்களிலும் ஒரேபோல மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: χαίρουσιν ἐπ’ αὐτοῖς
  choice: அவர்களைக் குறித்து மகிழ்ந்து
  rationale: ἐπ’ αὐτοῖς என்பது இங்கு அந்த இரண்டு தீர்க்கதரிசிகளின் நிலையை முன்னிட்டு மகிழ்வதைக் குறிக்கிறது. ‘அவர்களைக் குறித்து’ என்பது காரணத்தை மிகையாக விளக்காமல் தொடர்பைப் பாதுகாக்கிறது.
- source_word: εὐφραίνονται
  choice: கொண்டாடுவார்கள்
  rationale: χαίρουσιν என்பதிலிருந்து வேறுபட்ட, விழாக்கால மகிழ்ச்சியின் செயற்பாட்டை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: δῶρα πέμψουσιν ἀλλήλοις
  choice: ஒருவருக்கொருவர் பரிசுகளை அனுப்புவார்கள்
  rationale: δῶρα என்பதற்கு ‘பரிசுகள்’ இயல்பான இணை; எதிர்காலக் குறிப்பு மற்றும் ‘ஒருவருக்கொருவர்’ என்ற பரஸ்பரச் செயல் இரண்டும் தெளிவாகக் காக்கப்படுகின்றன.
- source_word: οὗτοι οἱ δύο προφῆται
  choice: இந்த இரண்டு தீர்க்கதரிசிகள்
  rationale: சுட்டுப்பெயரும் எண்ணிக்கையும் பெயர்ச்சொல்லும் இயல்பான தமிழ் வரிசையில் நேரடியாக வழங்கப்படுகின்றன.
- source_word: ἐβασάνισαν
  choice: வேதனைப்படுத்தினார்கள்
  rationale: βασανίζω என்பதன் தீவிரமான துன்புறுத்தல் அல்லது வேதனை ஏற்படுத்துதல் என்ற பொருளைக் காக்கிறது; ‘தொந்தரவு செய்தார்கள்’ போன்ற மென்மையான சொற்களைத் தவிர்க்கிறது.
theological_decisions:
- issue: வெளிப்படுத்தலில் தேவனுக்கு எதிரான உலகைக் குறிக்க அடிக்கடி வரும் தொடரின் மொழிபெயர்ப்பு
  choice: பூமியில் குடியிருப்பவர்கள்
  alternative: பூமியில் வாழ்கிறவர்கள் / பூமியின் குடிகள்
  rationale: இது வெறும் புவியியல் குறிப்பைக் கடந்த இறையியல் ஒலியைக் கொண்டிருக்கலாம்; ஆனால் அந்த விளக்கத்தை முதன்மை உரைக்குள் சேர்க்காமல், மூலத்தின் மீளும் வினைத் தொடரைப் பாதுகாக்கிறது.
- issue: இரண்டு சாட்சிகளால் உலகத்தாருக்கு ஏற்பட்ட தாக்கத்தின் தீவிரம்
  choice: வேதனைப்படுத்தினார்கள்
  alternative: துன்பப்படுத்தினார்கள் / வருத்தினார்கள்
  rationale: மூலவினையின் வலிமையை மென்மையாக்காமல் தருகிறது; அதேவேளை அந்த வேதனையின் துல்லிய வடிவத்தை உரையில் இல்லாதபடி விளக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், வெளிப்படுத்தல் நூலின் கண்ணியமான தீர்க்கதரிசனத் தொனியைத் தக்கவைத்தும் அமைக்கப்பட்டுள்ளது. கிரேக்க நிகழ்கால வினைகள் தரிசனச் சூழலில் எதிர்கால நிகழ்வை விவரிப்பதால், அடுத்துள்ள வெளிப்படையான எதிர்கால வினையுடன் தமிழில் ‘மகிழ்ந்து கொண்டாடுவார்கள்’ என ஒருங்கிணைக்கப்பட்டது.
