language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ οἱ εἴκοσι τέσσαρες πρεσβύτεροι οἱ ἐνώπιον τοῦ ⸂θεοῦ καθήμενοι⸃ ἐπὶ τοὺς θρόνους αὐτῶν ἔπεσαν ἐπὶ τὰ πρόσωπα αὐτῶν καὶ προσεκύνησαν τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/016.yaml
  text: And the twenty-four elders, who were seated before God on their thrones, fell on their faces and worshiped God,
translation:
  language: ta
  text: கடவுளுக்கு முன்பாகத் தங்கள் அரியணைகளில் அமர்ந்திருந்த இருபத்துநான்கு மூப்பர்களும் முகங்குப்புற விழுந்து கடவுளை வழிபட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ εἴκοσι τέσσαρες πρεσβύτεροι
  choice: இருபத்துநான்கு மூப்பர்கள்
  rationale: இது வெளிப்படுத்தலில் காணப்படும் பரலோக ஆலோசனைக் குழுவினரைக் குறிக்கிறது; ‘மூப்பர்கள்’ என்பது வயதான ஆண்கள் என்று மட்டும் சுருக்காமல், அவர்களின் நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: கடவுளுக்கு முன்பாக
  rationale: கடவுளின் முன்னிலையில் இருப்பதைக் குறிக்கும் இடம் மற்றும் உறவு சார்ந்த பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: καθήμενοι ἐπὶ τοὺς θρόνους αὐτῶν
  choice: தங்கள் அரியணைகளில் அமர்ந்திருந்த
  rationale: தொடர்ந்து நிலவிய அமர்ந்த நிலையைக் குறிக்கும் பங்கேற்பு வினையின் பொருளையும், அரியணைகளின்மேல் இருந்த நிலையையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἔπεσαν ἐπὶ τὰ πρόσωπα αὐτῶν
  choice: முகங்குப்புற விழுந்து
  rationale: வழிபாட்டுக்குரிய முழுமையான பணிவைக் காட்டும் உடல் நிலையைக் காட்சிப்படுத்தும் இயல்பான தமிழ் மரபுத்தொடர்.
- source_word: προσεκύνησαν τῷ θεῷ
  choice: கடவுளை வழிபட்டார்கள்
  rationale: செயலின் இலக்கு கடவுள் என்பதால், இங்கு வெறும் வணக்கம் அல்லது மரியாதை அல்ல, சமய வழிபாடே முதன்மையான பொருள்.
theological_decisions:
- issue: பரலோக வழிபாட்டுக் காட்சியில் προσκυνέω என்பதன் தன்மை
  choice: ‘கடவுளை வழிபட்டார்கள்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘கடவுளுக்கு முன்பாகப் பணிந்தார்கள்’
  rationale: செயல் வெளிப்படையாகக் கடவுளை நோக்கியதும், அரியணை அறைச் சூழலில் நிகழ்வதுமாக இருப்பதால், ‘வழிபட்டார்கள்’ என்பது சமயப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது; அதேவேளை கூடுதல் கோட்பாட்டுக் கருத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ். கிரேக்க வாக்கியத்தின் மைய வரிசையும் காட்சியின் மரியாதைமிக்க தொனியும் பாதுகாக்கப்பட்டுள்ளன.
