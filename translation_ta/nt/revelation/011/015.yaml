id: REV.11.15
reference: Revelation 11:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕβδομος ἄγγελος ἐσάλπισεν· καὶ ἐγένοντο φωναὶ μεγάλαι ἐν τῷ οὐρανῷ ⸀λέγοντες· Ἐγένετο ἡ βασιλεία τοῦ κόσμου τοῦ κυρίου ἡμῶν καὶ τοῦ χριστοῦ αὐτοῦ, καὶ βασιλεύσει εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/015.yaml
  text: And the seventh angel sounded his trumpet[a], and there were loud voices in heaven, saying, “The kingdom of the world has become that of our Lord and of his Messiah[c][b], and he will reign forever and ever.”
translation:
  language: ta
  text: ஏழாவது தூதர் எக்காளம் ஊதினார்[a]. அப்போது பரலோகத்தில் உரத்த குரல்கள் எழுந்து, “உலகத்தின் அரசாட்சி நம் ஆண்டவருக்கும் அவருடைய மெசியாவுக்கும்[b] உரியதாகிவிட்டது; அவர் என்றென்றும்[c] அரசாளுவார்” என்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், ‘உலகத்தின் அரசாட்சிகள் ... உரியவையாகிவிட்டன’ அல்லது ‘இந்த உலகத்தின் அரசாட்சி ... உரியதாகிவிட்டது’ என்று உள்ளது. SBLGNT உரை ஒருமையில், ‘உலகத்தின் அரசாட்சி ... உரியதாகிவிட்டது’ என்று வாசிக்கிறது.
    reason: textual_variant
  - marker: b
    text: அல்லது, ‘அவருடைய கிறிஸ்துவுக்கும்.’ Χριστός என்னும் கிரேக்கப் பட்டப்பெயர் இங்கு அதன் பட்டப்பெயர் சார்ந்த பொருளைக் காக்க ‘மெசியா’ என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: கிரேக்கத்தில் சொல்லுக்குச் சொல், ‘யுகங்களின் யுகங்களுக்குள்’; இது முடிவில்லாத காலத்தைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: எக்காளம் ஊதினார்
  rationale: σαλπίζω என்பது எக்காளத்தை ஒலிக்கச் செய்வதைக் குறிக்கிறது. தமிழில் இயல்பாக அமைய, வினையில் உட்பொதிந்துள்ள கருவி வெளிப்படையாகக் கூறப்பட்டுள்ளது.
- source_word: φωναὶ μεγάλαι
  choice: உரத்த குரல்கள்
  rationale: λέγοντες என்பதால் பொருளுள்ள சொற்களைப் பேசும் குரல்கள் குறிக்கப்படுகின்றன; μεγάλαι இச்சூழலில் ஒலியின் வலிமையைச் சுட்டுவதால் ‘உரத்த’ என்பது இயல்பான இணை.
- source_word: ἐν τῷ οὐρανῷ
  choice: பரலோகத்தில்
  rationale: வெளிப்படுத்தலில் இச்சூழல் வான்வெளியை அல்ல, பரலோக மண்டலத்தைக் குறிக்கிறது.
- source_word: λέγοντες
  choice: என்றன
  rationale: கிரேக்கத்தில் ‘சொல்லிக்கொண்டு’ என்ற பங்கேற்புவினை அமைப்பு உள்ளது. தமிழில் ‘குரல்கள் ... என்றன’ என வழங்குவது தெளிவாகவும் இயல்பாகவும் உள்ளது; கிரேக்கத்தின் இலக்கணப் பாலின முரண்பாட்டை செயற்கையாகப் பிரதிபலிக்கவில்லை.
- source_word: Ἐγένετο ἡ βασιλεία τοῦ κόσμου
  choice: உலகத்தின் அரசாட்சி ... உரியதாகிவிட்டது
  rationale: SBLGNT உரையில் βασιλεία ஒருமையில் உள்ளது. ἐγένετο இங்கு அறிவிக்கப்படும் நிறைவேறிய மாற்றத்தைச் சுட்டுவதால் ‘உரியதாகிவிட்டது’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: τοῦ κυρίου ἡμῶν καὶ τοῦ χριστοῦ αὐτοῦ
  choice: நம் ஆண்டவருக்கும் அவருடைய மெசியாவுக்கும்
  rationale: இரண்டு உரிமைத் தொடர்புகளையும் தமிழ் வேற்றுமையால் இயல்பாக வெளிப்படுத்துகிறது. Χριστός இங்கு பட்டப்பெயராகவும் கடவுளுடைய அபிஷேகம் பெற்றவரைக் குறிப்பதாகவும் இருப்பதால் ‘மெசியா’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: καὶ βασιλεύσει
  choice: அவர் ... அரசாளுவார்
  rationale: கிரேக்க வினை ஒருமையில் இருப்பதால் ‘அவர்’ என்ற ஒருமை எழுவாய் காக்கப்பட்டுள்ளது. அதன் முன்னிலையை உரை வெளிப்படையாகத் தீர்மானிக்காததால் தமிழிலும் கூடுதல் விளக்கம் சேர்க்கப்படவில்லை.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: என்றென்றும்
  rationale: ‘யுகங்களின் யுகங்களுக்குள்’ என்ற சொற்றொடர் முடிவில்லாத காலத்தைக் குறிக்கும் கிரேக்க மரபுத்தொடர்; ‘என்றென்றும்’ அதன் இயல்பான நவீனத் தமிழ் இணை.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு அது பெயரைப் போல் அல்லாமல் ‘அவருடைய’ என்பதுடன் வரும் பட்டப்பெயராகச் செயல்படுகிறது. ஆகவே அதன் பட்டப்பெயர் சார்ந்த பொருளை ‘மெசியா’ தெளிவாகக் காக்கிறது.
- issue: βασιλεύσει என்பதன் எழுவாய்
  choice: அவர் அரசாளுவார்
  alternative: அவர்கள் அரசாளுவார்கள் / ஆண்டவரும் அவருடைய மெசியாவும் அரசாளுவார்கள்
  rationale: கிரேக்க வினை ஒருமையில் உள்ளது. ‘ஆண்டவர்’ அல்லது ‘அவருடைய மெசியா’ என்று முன்னிலையைத் திட்டவட்டமாக்காமல், மூலத்தின் சுருக்கத்தையும் இறையியல் அழுத்தத்தையும் ‘அவர்’ காக்கிறது.
- issue: βασιλεία என்பதன் எண்
  choice: உலகத்தின் அரசாட்சி
  alternative: உலகத்தின் அரசாட்சிகள்
  rationale: SBLGNT மூல உரையில் பெயர்ச்சொல் ஒருமையில் உள்ளது; எனவே பன்மை மரபை முதன்மை உரைக்குள் கொண்டுவராமல், உரை வேறுபாடு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் அதேவேளையில் வெளிப்படுத்தல் நூலின் மேன்மையும் அறிவிப்பு நடையும் காக்கப்பட்டுள்ளன. ‘பரலோகம்,’ ‘ஆண்டவர்,’ ‘மெசியா,’ ‘அரசாளுதல்’ போன்ற சொற்கள் dignified biblical register-ஐத் தக்கவைக்கின்றன; பழமையான வினைமுற்றுகளும் பிரிவுசார் சொற்பயன்பாடுகளும் தவிர்க்கப்பட்டுள்ளன.
