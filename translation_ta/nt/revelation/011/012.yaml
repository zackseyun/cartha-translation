  source_fidelity: 'முக்கிய பொருள் நன்றாகப் பாதுகாக்கப்பட்டுள்ளது: வானத்திலிருந்து வந்த உரத்த குரல், பன்மைக் கட்டளை, வானத்திற்குள் ஏறிச் செல்லுதல், மேகம், பகைவர்களின் பார்வை ஆகியவை உள்ளன. ஆனால் மூலத்தில் இல்லாத “அப்போது” சேர்க்கப்பட்டுள்ளது; மேலும் ἐθεώρησαν என்ற அயோரிஸ்ட் வினைக்கு “பார்த்துக்கொண்டிருந்தார்கள்” என்ற தொடர்நிலை வடிவம் தேவையற்ற காலநீட்சியைச் சேர்க்கிறது.'
