  terminology: “வானம்,” “உரத்த குரல்,” “அந்த மேகம்,” “பகைவர்கள்” ஆகியவை பொருத்தமானவை. அடிக்குறிப்பில் கிரேக்கக் குறிப்புச்சுட்டை நேரடியாகத் தமிழின் “அந்த” எனச் சொல்வதைவிட, பெயர்ச்சொல்லுக்கு கிரேக்கத்தில் குறிப்புச் சுட்டு (article) உள்ளது எனக் கூறுவது துல்லியமானது. “நியாயநிறைவேற்றம்” என்பதற்குப் பதில் இச்சூழலின் vindication நுணுக்கத்தைத் தரும் “நீதி நிலைநாட்டப்படுதல்” பயன்படுத்தப்பட்டுள்ளது.
