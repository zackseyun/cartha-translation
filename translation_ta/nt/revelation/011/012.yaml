source:
  edition: SBLGNT
  text: καὶ ⸀ἤκουσαν ⸂φωνῆς μεγάλης⸃ ἐκ τοῦ οὐρανοῦ ⸀λεγούσης αὐτοῖς· ⸀Ἀνάβατε ὧδε, καὶ ἀνέβησαν εἰς τὸν οὐρανὸν ἐν τῇ νεφέλῃ, καὶ ἐθεώρησαν αὐτοὺς οἱ ἐχθροὶ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/012.yaml
  text: And they heard a loud voice from heaven saying to them, “Come up here,” and they went up to heaven in the cloud, and their enemies watched them.
translation:
  language: ta
  text: அவர்கள், “இங்கே மேலே வாருங்கள்” என்று அவர்களிடம் சொன்ன வானத்திலிருந்து வந்த உரத்த குரலைக் கேட்டார்கள். அவர்கள் அந்த மேகத்தில்[a] வானத்திற்குள் மேலே சென்றார்கள்; அவர்களின் பகைவர்கள் அவர்களைக் கவனித்துப் பார்த்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு மேகத்தில்.” கிரேக்கத்தில் “மேகம்” என்பதற்கு குறிப்புச் சுட்டு உள்ளது; இது தெய்வீகப் பிரசன்னம் மற்றும் நீதி நிலைநாட்டப்படுதலோடு தொடர்புடைய வேதாகமக் காட்சிகளை நினைவூட்டக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: கேட்டார்கள்
  rationale: இங்கு ἀκούω என்பதன் இறந்தகால நிகழ்வு வடிவம், வானத்திலிருந்து வந்த குரலைக் கேட்ட நிகழ்வைக் குறிக்கிறது; கவனித்துக் கேட்டார்கள் என்ற நீடித்த பொருள் அவசியமில்லை.
- source_word: φωνῆς μεγάλης
  choice: உரத்த குரலை
  rationale: μέγας இச்சூழலில் குரலின் வலிமையைக் குறிக்கிறது; நவீனத் தமிழில் ‘உரத்த குரல்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: வானத்திலிருந்து வந்த
  rationale: வெளிப்படுத்தின விசேஷத்தின் தரிசன மற்றும் தெய்வீகப் பேச்சுச் சூழலில் οὐρανός என்பது வெறும் ஆகாயத்தை அல்ல, வானத்தைக் குறிக்கிறது. தமிழில் தொடர்பைத் தெளிவாக்க ‘வந்த’ சேர்க்கப்பட்டுள்ளது.
- source_word: λεγούσης αὐτοῖς
  choice: தங்களிடம் சொன்ன
  rationale: பங்கேற்புவினை ‘குரல்’ என்பதைக் குறிக்கிறது; αὐτοῖς என்பதையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: Ἀνάβατε ὧδε
  choice: இங்கே மேலே வாருங்கள்
  rationale: இரண்டாம் நபர் பன்மை கட்டளை மற்றும் மேல்நோக்கிய இயக்கம் இரண்டும் இயல்பான தமிழில் பாதுகாக்கப்படுகின்றன.
- source_word: ἀνέβησαν εἰς τὸν οὐρανὸν
  choice: வானத்திற்குள் மேலே சென்றார்கள்
  rationale: εἰς குறிக்கும் இலக்கை நோக்கிய, உள்ளே செல்லும் இயக்கத்தையும் ἀναβαίνω குறிக்கும் மேல்நோக்கிய இயக்கத்தையும் இவ்வாசகம் வெளிப்படுத்துகிறது.
- source_word: ἐν τῇ νεφέλῃ
  choice: அந்த மேகத்தில்
  rationale: கிரேக்கத்தில் உள்ள குறிப்புச் சுட்டை ‘அந்த’ மூலம் பாதுகாக்கிறது; இது தெய்வீகப் பிரசன்னம் மற்றும் நியாயநிறைவேற்றத்தோடு தொடர்புடைய வேதாகம மேகக் காட்சிகளை நினைவூட்டக்கூடும்.
- source_word: ἐθεώρησαν
  choice: பார்த்துக்கொண்டிருந்தார்கள்
  rationale: θεωρέω வெறுமனே கண்டார்கள் என்பதைக் காட்டிலும் கவனித்துப் பார்த்ததைக் குறிக்கலாம்; தொடர்ச்சியான தமிழ் வடிவம் அந்த நுணுக்கத்தை இயல்பாகத் தருகிறது.
- source_word: οἱ ἐχθροὶ αὐτῶν
  choice: அவர்களுடைய பகைவர்கள்
  rationale: உடைமைத் தொடர்பையும் சாட்சிகளுக்கு எதிரானவர்களே இதைக் கண்டார்கள் என்ற வலியுறுத்தலையும் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘அந்த மேகம்’ என்பதில் இருக்கக்கூடிய வேதாகம மறைசுட்டு
  choice: முதன்மை உரையில் ‘அந்த மேகத்தில்’ என்று வைத்தல்
  alternative: ‘ஒரு மேகத்தில்’
  rationale: கிரேக்கத்தில் குறிப்புச் சுட்டு உள்ளது. அது தெய்வீகப் பிரசன்னம் மற்றும் நியாயநிறைவேற்றத்துடன் தொடர்புடைய அறியப்பட்ட மேகக் கருத்தை நினைவூட்டக்கூடும். மொழிபெயர்ப்பு அந்த வாய்ப்பை விளக்கமாகத் தீர்மானிக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அந்த மேகம்’ என்ற மூலத்தின் தெளிவின்மை அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
