base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/017.yaml
  text: saying[a], “We give thanks to you, Lord God Almighty, who is and who was[b], because you have taken your great power and begun to reign.”
translation:
  language: ta
  text: அவர்கள் இவ்வாறு கூறினார்கள்:[a] “இருக்கிறவரும் இருந்தவருமான ஆண்டவரே, எல்லாம் வல்ல இறைவனே, உமக்கு நாங்கள் நன்றி செலுத்துகிறோம். ஏனெனில், உமது மாபெரும் வல்லமையை நீர் எடுத்துக்கொண்டு அரசாளத் தொடங்கினீர்.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் கூறிக்கொண்டிருந்தார்கள்.” இச்சொல் முந்தைய வசனத்திலுள்ள மூப்பர்களின் பேச்சை அறிமுகப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: “அரசாண்டீர்” அல்லது “அரசராக ஆனீர்” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் அரசாட்சியைத் தொடங்குவதையோ அதைச் செயல்படுத்துவதையோ வலியுறுத்தலாம்; இங்கு இறைவனின் ஆட்சி வெளிப்படையாகச் செயல்படத் தொடங்குவதைச் சுட்டுவதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: அவர்கள் கூறியது
  rationale: இது முந்தைய வசனத்திலுள்ள மூப்பர்களைச் சுட்டும் நிகழ்காலச் செயவெச்சம். தமிழில் உரையை இயல்பாக அறிமுகப்படுத்த இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: Εὐχαριστοῦμέν σοι
  choice: உமக்கு நாங்கள் நன்றி செலுத்துகிறோம்
  rationale: நன்றியறிதலை வெளிப்படுத்தும் வழிபாட்டு மொழியின் கண்ணியத்தையும், பன்மை எழுவாயையும் காக்கிறது.
- source_word: κύριε, ὁ θεός, ὁ παντοκράτωρ
  choice: ஆண்டவரே, எல்லாம் வல்ல இறைவனே
  rationale: இறைவனை நேரடியாக அழைக்கும் விளிவடிவத்தையும் παντοκράτωρ என்ற தெய்வீகப் பட்டத்தின் முழு வல்லமைப் பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: ὁ ὢν καὶ ὁ ἦν
  choice: இருக்கிறவரும் இருந்தவருமான
  rationale: நிகழ்காலமும் கடந்தகாலமும் கொண்ட மூலமொழி வடிவத்தைப் பாதுகாக்கிறது; இங்கு இல்லாத ‘வருகிறவர்’ என்ற சொற்றொடர் சேர்க்கப்படவில்லை.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: நன்றி செலுத்துவதற்கான காரணத்தைத் தெளிவாகக் குறிக்கும் காரண இணைப்புச் சொல்.
- source_word: εἴληφας τὴν δύναμίν σου τὴν μεγάλην
  choice: உமது மாபெரும் வல்லமையை நீர் எடுத்துக்கொண்டு
  rationale: நிறைவேறிய செயலும் அதன் தொடரும் விளைவும் கொண்ட perfect வடிவத்தைப் பிரதிபலிக்கிறது; δύναμις என்பதற்கு ‘வல்லமை’ கண்ணியமானதும் இயல்பானதும் ஆகும்.
- source_word: ἐβασίλευσας
  choice: அரசாளத் தொடங்கினீர்
  rationale: இச்சூழலில் அரசாட்சி தீர்மானமாக வெளிப்பட்டு செயல்படத் தொடங்குவதைச் சுட்டும் தொடக்கநிலை நுணுக்கத்தைத் தருகிறது; இறைவன் இதற்கு முன் அரசரல்ல என்ற பொருளைத் தவிர்க்கிறது.
theological_decisions:
- issue: தெய்வீகப் பட்டத்தில் ‘வருகிறவர்’ என்ற வாசகத்தைச் சேர்ப்பதா
  choice: இருக்கிறவரும் இருந்தவருமான
  alternative: இருக்கிறவரும் இருந்தவரும் வருகிறவருமான
  rationale: SBLGNT இவ்வசனத்தில் ὁ ὢν καὶ ὁ ἦν என்பதையே கொண்டுள்ளது. வெளிப்படுத்தின விசேஷத்தின் பிற இடங்களோடு ஒத்திசைக்காமல் இங்குள்ள குறுகிய வாசகம் பாதுகாக்கப்பட்டது.
- issue: ἐβασίλευσας என்பதன் காலநிலை மற்றும் இறைவனின் அரசாட்சி
  choice: அரசாளத் தொடங்கினீர்
  alternative: அரசாண்டீர் / அரசராக ஆனீர்
  rationale: இச்சூழல் இறைவனின் அரசாட்சி வரலாற்றில் தீர்மானமாக வெளிப்படுவதைக் கொண்டாடுகிறது. ‘அரசராக ஆனீர்’ என்பது அவர் இதற்கு முன் அரசரல்ல என்ற தேவையற்ற பொருளைத் தரக்கூடும்; ‘அரசாளத் தொடங்கினீர்’ தொடக்கநிலை நுணுக்கத்தை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வழிபாட்டு நடை பயன்படுத்தப்பட்டது. இறைவனை நோக்கிய மரியாதைப் பன்மை வடிவங்கள் (‘உமக்கு’, ‘நீர்’, ‘தொடங்கினீர்’) தொடர்ந்து காக்கப்பட்டுள்ளன. முதன்மை உரையிலும் அடிக்குறிப்புகளிலும் உள்ள [a], [b] குறியீடுகள் ஒன்றோடொன்று பொருந்துகின்றன.
