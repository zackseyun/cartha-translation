reference: Revelation 11:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ὅταν τελέσωσιν τὴν μαρτυρίαν αὐτῶν, τὸ θηρίον τὸ ἀναβαῖνον ἐκ τῆς ἀβύσσου ποιήσει μετ’ αὐτῶν πόλεμον καὶ νικήσει αὐτοὺς καὶ ἀποκτενεῖ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/007.yaml
  text: And when they finish their testimony[a], the beast that comes up out of the abyss will make war with them and conquer them and kill them.
translation:
  language: ta
  text: அவர்கள் தங்கள் சாட்சியத்தை முடித்ததும், ஆழ்குழியிலிருந்து மேலேறி வரும் மிருகம் அவர்களோடு போர் செய்யும்[a]; அது அவர்களை வென்று, அவர்களைக் கொல்லும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுக்கு எதிராகப் போர் செய்யும்.”
    reason: ποιήσει μετ’ αὐτῶν πόλεμον என்பதில் μετά + genitive வடிவத்தை நெருக்கமாகக் காட்டும் மொழிபெயர்ப்புக்கும், சூழலில் உள்ள பகைமைப் பொருளை வெளிப்படையாகக் காட்டும் மொழிபெயர்ப்புக்கும் இடையிலான சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: τελέσωσιν
  choice: முடித்ததும்
  rationale: ὅταν என்பதற்குப் பின் வரும் இறந்தகாலத் துணைவினை வடிவம் எதிர்காலத்தில் நிகழவிருக்கும் ஒரு சந்தர்ப்பத்தைக் குறிக்கிறது. ‘முடித்ததும்’ என்பது சாட்சியப் பணி நிறைவடைவதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: μαρτυρίαν
  choice: சாட்சியத்தை
  rationale: இச்சொல் ‘சாட்சி’ அல்லது ‘சாட்சியளித்தல்’ என்ற பொருள்களைக் கொண்டது. இங்கு ‘தங்கள் சாட்சியத்தை முடித்ததும்’ என்பது மூலத்தின் பெயர்ச்சொல் அமைப்பையும் வெளிப்படுத்தி, தமிழிலும் தெளிவாக உள்ளது.
- source_word: θηρίον
  choice: மிருகம்
  rationale: வெளிப்படுத்தின விசேஷத்தின் தரிசன மொழியில் வரும் கொடிய விலங்கு உருவகத்திற்கு ‘மிருகம்’ தெளிவானதும் வழக்கமானதுமான தமிழ்ச் சொல்.
- source_word: ἀναβαῖνον
  choice: மேலேறி வரும்
  rationale: நிகழ்காலப் பெயரெச்சத்தின் உயிரோட்டத்தையும், ஆழ்குழியிலிருந்து மேல்நோக்கி வரும் இயக்கத்தையும் இச்சொற்றொடர் காக்கிறது.
- source_word: ἀβύσσου
  choice: ஆழ்குழியிலிருந்து
  rationale: ‘ஆழ்குழி’ என்பது ἄβυσσος குறிக்கும் அளவிட முடியாத ஆழத்தைத் தெரிவிக்கிறது; ‘அடித்தளமில்லாத குழி’ போன்ற விளக்கவுரையைத் தேவையின்றி சேர்ப்பதில்லை.
- source_word: ποιήσει μετ’ αὐτῶν πόλεμον
  choice: அவர்களோடு போர் செய்யும்
  rationale: μετά + genitive என்பதன் ‘அவர்களோடு’ என்ற வடிவத்தை நெருக்கமாகக் காக்கிறது. அடுத்து வரும் ‘வென்று’ மற்றும் ‘கொல்லும்’ என்பவை அதன் பகைமைப் பொருளைத் தெளிவாக்குகின்றன.
- source_word: νικήσει
  choice: வென்று
  rationale: νικάω என்பதன் மோதல் மற்றும் வெற்றி சார்ந்த பொருளை ‘வென்று’ நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: ἀποκτενεῖ
  choice: கொல்லும்
  rationale: இது செயலை நேரடியாகத் தெரிவிக்கும் இயல்பான நவீனத் தமிழ்; தேவையற்ற தொன்மையான அல்லது முறைசார்ந்த நடையைத் தவிர்க்கிறது.
theological_decisions:
- issue: ποιήσει μετ’ αὐτῶν πόλεμον என்பதில் பகைமை உறவை மொழிபெயர்த்தல்
  choice: அவர்களோடு போர் செய்யும்
  alternative: அவர்களுக்கு எதிராகப் போர் செய்யும்
  rationale: மூலத்தில் μετά + genitive இருப்பதால் ‘அவர்களோடு’ என்பது வடிவத்திற்கு நெருக்கமானது. தொடரும் ‘வென்று’ மற்றும் ‘கொல்லும்’ என்ற வினைகள் பகைமை உறவை ஐயமின்றித் தெரிவிக்கின்றன; மேலும் வெளிப்படையான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் தெளிவான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வெளிப்படுத்தின விசேஷத்தின் தரிசனச் சொற்களான ‘மிருகம்’ மற்றும் ‘ஆழ்குழி’ சுருக்கமாகவும் உருவக வலிமையுடனும் வைக்கப்பட்டுள்ளன. கிரேக்கத்தின் தொடர்ச்சியான மூன்று எதிர்காலச் செயல்கள் தமிழில் இயல்பாக அமைய, இரண்டாவது வாக்கியக்கூறில் ‘அது’ சேர்க்கப்பட்டு, ‘போர் செய்யும்; அது அவர்களை வென்று, அவர்களைக் கொல்லும்’ என அமைக்கப்பட்டுள்ளது.
