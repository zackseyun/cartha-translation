id: REV.11.11
reference: Revelation 11:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ μετὰ τὰς τρεῖς ἡμέρας καὶ ἥμισυ πνεῦμα ζωῆς ἐκ τοῦ θεοῦ εἰσῆλθεν ⸂ἐν αὐτοῖς⸃, καὶ ἔστησαν ἐπὶ τοὺς πόδας αὐτῶν, καὶ φόβος μέγας ⸀ἐπέπεσεν ἐπὶ τοὺς θεωροῦντας αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/011.yaml
  text: And after the three and a half days[a], a breath of life from God entered into them, and they stood on their feet, and great fear fell on those watching them.
translation:
  language: ta
  text: அந்த மூன்றரை நாட்களுக்குப் பிறகு, கடவுளிடமிருந்து வந்த உயிர்மூச்சு[a] அவர்களுக்குள் புகுந்தது. அவர்கள் தங்கள் கால்களில் நின்றார்கள்; அவர்களைப் பார்த்துக்கொண்டிருந்தவர்கள்மேல் பெரும் பயம் விழுந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளிடமிருந்து வந்த உயிரின் ஆவி”; ஒருவேளை, “கடவுளிடமிருந்து வந்த உயிரின் ஆவியானவர்.” கிரேக்க மொழியிலுள்ள πνεῦμα என்ற சொல்லுக்கு மூச்சு அல்லது ஆவி என்று பொருள் வரலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ τὰς τρεῖς ἡμέρας καὶ ἥμισυ
  choice: அந்த மூன்றரை நாட்களுக்குப் பிறகு
  rationale: μετά காலத் தொடர்ச்சியை ‘பிறகு’ எனக் குறிக்கிறது. கிரேக்க மொழியிலுள்ள குறிப்புச் சுட்டையும் வெளிப்படுத்த ‘அந்த’ பயன்படுத்தப்பட்டுள்ளது; ‘மூன்றரை நாட்கள்’ என்பது இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: πνεῦμα ζωῆς
  choice: உயிர்மூச்சு
  rationale: πνεῦμα என்பதற்கு மூச்சு, ஆவி ஆகிய இரு பொருள்களும் வரலாம். உயிரை மீட்டளிக்கும் இக்காட்சியிலும் எசேக்கியேல் 37-ன் பின்னணியிலும் ‘உயிர்மூச்சு’ இயல்பாகப் பொருந்துகிறது; ‘ஆவி’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: ἐκ τοῦ θεοῦ
  choice: கடவுளிடமிருந்து வந்த
  rationale: உயிர்மூச்சின் மூல ஆதாரம் கடவுள் என்பதைத் தெளிவாகவும் இயல்பான தமிழிலும் தெரிவிக்கிறது.
- source_word: εἰσῆλθεν ἐν αὐτοῖς
  choice: அவர்களுக்குள் புகுந்தது
  rationale: உள்ளே நுழைதல் என்ற கருத்தை ‘அவர்களுக்குள் புகுந்தது’ தெளிவாகத் தருகிறது.
- source_word: ἔστησαν ἐπὶ τοὺς πόδας αὐτῶν
  choice: அவர்கள் தங்கள் கால்களில் நின்றார்கள்
  rationale: கிரேக்க வாக்கியத்தின் நேரடியான பொருளைப் பாதுகாக்கிறது; ‘உயிர்த்தெழுந்தார்கள்’ என்று விளக்கமாக்கி மூலத்தில் இல்லாத வினையைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: φόβος μέγας
  choice: பெரும் பயம்
  rationale: φόβος மற்றும் μέγας ஆகியவற்றின் வலிமையை மிகைப்படுத்தாமல் நேரடியாகத் தருகிறது.
- source_word: ἐπέπεσεν ἐπὶ
  choice: மேல் ... விழுந்தது
  rationale: பயம் ஒருவர்மேல் விழுதல் என்ற கிரேக்க உருவகத்தைத் தமிழிலும் கண்ணியமான, புரிந்துகொள்ளக்கூடிய முறையில் பாதுகாக்கிறது.
- source_word: τοὺς θεωροῦντας αὐτούς
  choice: அவர்களைப் பார்த்துக்கொண்டிருந்தவர்கள்
  rationale: θεωρέω என்பதிலுள்ள தொடர்ந்து கவனித்துப் பார்க்கும் செயலை ‘பார்த்துக்கொண்டிருந்த’ என்ற வடிவம் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: πνεῦμα ζωῆς என்பது உயிரளிக்கும் மூச்சைக் குறிக்கிறதா அல்லது ஆவியைக் குறிக்கிறதா
  choice: முதன்மை உரையில் ‘உயிர்மூச்சு’
  alternative: ‘உயிரின் ஆவி’; ஒருவேளை கடவுளுடைய உயிரளிக்கும் ஆவி
  rationale: கிரேக்க πνεῦμα இரு பொருள்களையும் அனுமதிக்கிறது; அது இங்கே தூய ஆவியையே திட்டவட்டமாக அடையாளப்படுத்தவில்லை. உயிர்ப்பிக்கும் மூச்சு என்ற தீர்க்கதரிசனப் பின்னணிக்கேற்ப முதன்மை உரை அமைந்தாலும், உண்மையான இறையியல் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வெளிப்படுத்தின விசேஷத்தின் கண்ணியமான தரிசன நடைக்கு ஏற்ற வகையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கடவுள்,’ ‘உயிர்மூச்சு,’ ‘பெரும் பயம்’ போன்ற சொற்கள் சாதாரண வாசகர்களுக்குப் புரியும்படியும் மூலத்தின் செறிவைத் தக்கவைக்கும்படியும் தேர்ந்தெடுக்கப்பட்டுள்ளன.
