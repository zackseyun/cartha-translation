  source_fidelity: கிரேக்க ஒருமை τὸ πτῶμα ‘அவர்களுடைய பிணம்’ எனத் தக்கவைக்கப்பட்டுள்ளது; πλατείαக்கு ‘அகன்ற வீதி,’ τῆς πόλεως τῆς μεγάληςக்கு ‘பெரிய நகரம்,’ மற்றும் ἐσταυρώθηக்கு ‘சிலுவையில் அறையப்பட்டார்’ ஆகியவை பொருத்தமானவை. ஆனால் ὅπου καὶ-யில் உள்ள சேர்க்கைச் சொல்லான καί (‘also’) ‘அங்கேதான்’ என்பதில் தெளிவாகத் தெரிவதில்லை.
