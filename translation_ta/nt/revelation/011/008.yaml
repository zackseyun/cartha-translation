id: REV.11.8
reference: Revelation 11:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ τὸ πτῶμα αὐτῶν ἐπὶ τῆς πλατείας τῆς πόλεως τῆς μεγάλης, ἥτις καλεῖται πνευματικῶς Σόδομα καὶ Αἴγυπτος, ὅπου καὶ ὁ κύριος αὐτῶν ἐσταυρώθη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/008.yaml
  text: And their dead bodies lie in the street of the great city[a], which is spiritually called Sodom and Egypt[c][b], where also their Lord was crucified.
translation:
  language: ta
  text: 'அவர்களுடைய பிணம்[a] பெரிய நகரத்தின் அகன்ற வீதியில் கிடக்கும்; அந்த நகரம் ஆவிக்குரிய விதத்தில்[b] சோதோம் என்றும் எகிப்து என்றும் அழைக்கப்படுகிறது; அங்கே அவர்களுடைய ஆண்டவரும் சிலுவையில் அறையப்பட்டார்.[c]


    [a] இரண்டு சாட்சிகள் குறிக்கப்பட்டாலும், கிரேக்க மூலத்தில் “பிணம்” என்பது ஒருமையில் உள்ளது; அது இருவரையும் ஒரே அலகாகக் குறிப்பிடுவதாக இருக்கலாம்.


    [b] அல்லது, “உருவகமாக.”


    [c] “அவர்களுடைய ஆண்டவர் சிலுவையில் அறையப்பட்ட” இடம் என்ற சொற்றொடர் எருசலேமைக் குறிக்கிறது; ஆனாலும் மூலவசனம் “பெரிய நகரம்” என்ற அடையாள மொழியையே வைத்திருக்கிறது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இரண்டு சாட்சிகள் குறிக்கப்பட்டாலும், கிரேக்க மூலத்தில் “பிணம்” என்பது ஒருமையில் உள்ளது; அது இருவரையும் ஒரே அலகாகக் குறிப்பிடுவதாக இருக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “உருவகமாக.”
    reason: lexical_alternative
  - marker: c
    text: “அவர்களுடைய ஆண்டவர் சிலுவையில் அறையப்பட்ட” இடம் என்ற சொற்றொடர் எருசலேமைக் குறிக்கிறது; ஆனாலும் மூலவசனம் “பெரிய நகரம்” என்ற அடையாள மொழியையே வைத்திருக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: πτῶμα
  choice: பிணம்
  rationale: விழுந்து கிடக்கும் இறந்த உடலைக் குறிக்கும் சொல்லின் கடுமையையும் சுருக்கத்தையும் இயல்பான தமிழில் தருகிறது. கிரேக்க ஒருமையும் காக்கப்படுகிறது.
- source_word: ἐπὶ τῆς πλατείας
  choice: அகன்ற வீதியில்
  rationale: πλατεῖα என்பதன் அகன்ற தெரு அல்லது பொதுச் சதுக்கம் என்ற பொருள் வரம்பை கருத்தில் கொண்டு, நகரக் காட்சிக்கு ஏற்ற இயல்பான தெரிவாக உள்ளது.
- source_word: τῆς πόλεως τῆς μεγάλης
  choice: பெரிய நகரத்தின்
  rationale: வெளிப்படுத்தலில் முக்கியமான மறையுரைக் குறிப்பான “பெரிய நகரம்” என்பதை விளக்கிச் சொல்லாமல் நேரடியாகக் காக்கிறது.
- source_word: πνευματικῶς
  choice: ஆவிக்குரிய பொருளில்
  rationale: “ஆவிக்குரிய விதத்தில்” என்ற மூலப்பொருளை இயல்பான நவீன தமிழில் தருகிறது; “உருவகமாக” என்ற விளக்கத் தெரிவை அடிக்குறிப்பில் வைக்கிறது.
- source_word: Σόδομα καὶ Αἴγυπτος
  choice: சோதோம் என்றும் எகிப்து என்றும்
  rationale: இரு பெயர்களின் அடையாளப் பொருளை விரித்துரைக்காமல், அவற்றை முறையாக ஒலிபெயர்க்கிறது.
- source_word: ὁ κύριος αὐτῶν
  choice: அவர்களுடைய ஆண்டவர்
  rationale: κύριος என்பதன் இறையியல் நிறையையும் இரண்டு சாட்சிகளுடனான உடைமைத் தொடர்பையும் காக்கிறது.
- source_word: ἐσταυρώθη
  choice: சிலுவையில் அறையப்பட்டார்
  rationale: வரலாற்றுச் செயலையும் கிரேக்க வினையின் செயப்பாட்டு வடிவையும் வழக்கமான தமிழில் துல்லியமாகத் தருகிறது.
theological_decisions:
- issue: இரண்டு சாட்சிகளைக் குறிக்கும் αὐτῶν என்பதுடன் ஒருமை πτῶμα வருவது
  choice: “அவர்களுடைய பிணம்” என்று ஒருமையில் மொழிபெயர்த்தல்
  alternative: “அவர்களுடைய பிணங்கள்”
  rationale: மூலத்தின் ஒருமை, இரண்டு சாட்சிகளையும் ஒரே அலகாகக் காட்டும் சொல்லாட்சியாக இருக்கலாம். தமிழில் இந்த அமைப்பு புரிந்துகொள்ளத்தக்கதால் ஒருமை காக்கப்படுகிறது.
- issue: நகரம் பெயரிடப்படும் விதத்தில் πνευματικῶς என்பதன் பொருள்
  choice: “ஆவிக்குரிய பொருளில்”
  alternative: “உருவகமாக”
  rationale: மூலச்சொல்லின் நேரடியான ஆவிக்குரிய நுட்பத்தை முதன்மை உரையில் காக்கிறது; அதை வெறும் இலக்கிய உருவகமாகச் சுருக்கவில்லை.
- issue: “பெரிய நகரம்” எது என்பது
  choice: நகரத்தை முதன்மை உரையில் எருசலேம் என்று வெளிப்படையாக அடையாளப்படுத்தாமல் விடுதல்
  alternative: “எருசலேம்” என்று விளக்கிச் சேர்த்தல்
  rationale: ஆண்டவர் சிலுவையில் அறையப்பட்ட இடம் என்ற குறிப்பு எருசலேமைக் காட்டினாலும், யோவான் பயன்படுத்தும் அடையாள மொழியையும் அதன் இறையியல் அழுத்தத்தையும் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வெளிப்படுத்தல் நூலின் காட்சித் தீவிரமும் காக்கப்பட்டுள்ளன. “பிணம்,” “அகன்ற வீதி,” “ஆவிக்குரிய பொருளில்” ஆகியவை சாதாரண வாசகருக்குப் புரியும் வகையிலும் மூலத்துக்கு நெருக்கமாகவும் தேர்ந்தெடுக்கப்பட்டன.
