id: REV.11.3
reference: Revelation 11:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ δώσω τοῖς δυσὶν μάρτυσίν μου, καὶ προφητεύσουσιν ἡμέρας χιλίας διακοσίας ἑξήκοντα, ⸀περιβεβλημένοι σάκκους.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/003.yaml
  text: And I will grant to my two witnesses[a], and they will prophesy for one thousand two hundred sixty days[b], clothed in sackcloth.
translation:
  language: ta
  text: “என் சாட்சிகள் இருவருக்கும் நான் கொடுப்பேன்[a]; அவர்கள் சாக்குத்துணி உடுத்தியவர்களாய்[b] ஆயிரத்து இருநூற்று அறுபது நாட்கள் இறைவாக்கு உரைப்பார்கள்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு நெருக்கமாக, “என் சாட்சிகள் இருவருக்கும் நான் கொடுப்பேன்.” எது கொடுக்கப்படுகிறது என்பதை கிரேக்க உரை கூறவில்லை; இறைவாக்கு உரைப்பதற்கான அதிகாரம் அல்லது பணி குறிக்கப்பட்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சாக்குத்துணி துக்கம், மனந்திரும்புதல், தீர்க்கதரிசனப் புலம்பல் ஆகியவற்றோடு தொடர்புடையதாக இருந்தது.
    reason: cultural_note
lexical_decisions:
- source_word: δώσω
  choice: நான் கொடுப்பேன்
  rationale: கிரேக்க வினைச்சொல்லின் நேரடியான பொருள் ‘நான் கொடுப்பேன்’ என்பதாகும். எது கொடுக்கப்படுகிறது என்பது மூலத்தில் சொல்லப்படாததால், ‘அதிகாரம்’ அல்லது ‘பணி’ என்பதை முதன்மை உரையில் சேர்க்காமல் அந்தத் தெளிவின்மை பாதுகாக்கப்படுகிறது; அடிக்குறிப்பு சூழலுக்குரிய சாத்தியமான பொருளை விளக்குகிறது.
- source_word: τοῖς δυσὶν μάρτυσίν μου
  choice: என் சாட்சிகள் இருவருக்கும்
  rationale: μάρτυς என்பதன் சாட்சியமளிக்கும் பொருளை ‘சாட்சிகள்’ நேரடியாகத் தருகிறது; இயல்பான தமிழுக்காக எண்ணிக்கை மனிதர்களுக்குரிய ‘இருவர்’ வடிவில் பின்னால் வைக்கப்பட்டுள்ளது.
- source_word: προφητεύσουσιν
  choice: இறைவாக்கு உரைப்பார்கள்
  rationale: இது வெறும் எதிர்காலத்தை முன்னறிவிப்பது என்ற குறுகிய எண்ணத்தைத் தவிர்த்து, கடவுளிடமிருந்து பெற்ற செய்தியை அறிவிக்கும் προφητεύω என்பதன் பரந்த பொருளை நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: ἡμέρας χιλίας διακοσίας ἑξήκοντα
  choice: ஆயிரத்து இருநூற்று அறுபது நாட்கள்
  rationale: காலநீட்டைக் குறிக்கும் வேற்றுமையை தமிழில் இயல்பாக எண்ணிக்கையுடன் தருகிறது.
- source_word: περιβεβλημένοι σάκκους
  choice: சாக்குத்துணி உடுத்தியவர்களாய்
  rationale: முழுமையாக ஆடை அணிந்திருக்கும் நிலையைப் பங்கேற்புவினை காட்டுகிறது. ‘சாக்குத்துணி’ என்ற உருவகத்தை விளக்கமாக மாற்றாமல் அப்படியே பாதுகாக்கிறது.
theological_decisions:
- issue: δώσω என்பதன் சொல்லப்படாத நேர்செயப்படுபொருள்
  choice: ‘நான் கொடுப்பேன்’ என்று சொல்லப்படாத பொருளை முதன்மை உரையிலும் சொல்லாமல் விடுதல்
  alternative: ‘நான் அதிகாரம் அளிப்பேன்’ அல்லது ‘நான் பணியளிப்பேன்’
  rationale: அடுத்த வாக்கியக்கூறு அவர்கள் இறைவாக்கு உரைப்பார்கள் என்று கூறுவதால் அதிகாரம் அல்லது தீர்க்கதரிசனப் பணி குறிக்கப்படலாம். ஆனால் கிரேக்க உரை அதை வெளிப்படையாகக் கூறாததால், ஒரு குறிப்பிட்ட விளக்கத்தை மொழிபெயர்ப்பிலேயே உறுதிசெய்யாமல் மூலத்தின் நீள்வட்ட அமைப்பும் பொருள் நெருக்கடியும் பாதுகாக்கப்படுகின்றன.
- issue: சாக்குத்துணியின் அடையாளப் பொருள்
  choice: உருவகத்தை முதன்மை உரையில் அப்படியே வைத்தல்
  alternative: ‘துக்க ஆடை உடுத்தியவர்களாய்’
  rationale: சாக்குத்துணி துக்கம், மனந்திரும்புதல், தீர்க்கதரிசனப் புலம்பல் ஆகியவற்றோடு தொடர்புடையது; ஆனால் இவற்றுள் ஒன்றை மட்டும் இவ்வசனம் வெளிப்படையாகத் தீர்மானிக்கவில்லை. எனவே விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன, மரியாதைமிக்க பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘தீர்க்கதரிசனம் கூறுவார்கள்’ என்பதற்குப் பதிலாக, முன்னறிவிப்பு என்ற குறுகிய பொருளைத் தவிர்க்க ‘இறைவாக்கு உரைப்பார்கள்’ தேர்ந்தெடுக்கப்பட்டது. மூலத்தில் δώσω என்பதற்கான செயப்படுபொருள் விடுபட்டிருப்பது தமிழிலும் நோக்கத்துடன் பாதுகாக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
