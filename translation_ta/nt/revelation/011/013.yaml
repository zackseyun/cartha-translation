id: REV.11.13
reference: Revelation 11:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐν ἐκείνῃ τῇ ⸀ὥρᾳ ἐγένετο σεισμὸς μέγας, καὶ τὸ δέκατον τῆς πόλεως ἔπεσεν, καὶ ἀπεκτάνθησαν ἐν τῷ σεισμῷ ὀνόματα ἀνθρώπων χιλιάδες ἑπτά, καὶ οἱ λοιποὶ ἔμφοβοι ἐγένοντο καὶ ἔδωκαν δόξαν τῷ θεῷ τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/013.yaml
  text: And in that hour there was a great earthquake[a], and a tenth of the city fell, and seven thousand people were killed in the earthquake, and the rest became terrified and gave glory to the God of heaven.
translation:
  language: ta
  text: அந்த நேரத்தில் ஒரு பெரிய நிலநடுக்கம் ஏற்பட்டது; நகரத்தின் பத்தில் ஒரு பகுதி விழுந்தது. அந்த நிலநடுக்கத்தில் ஏழாயிரம் பேர்[a] கொல்லப்பட்டனர். எஞ்சியவர்கள் திகிலடைந்து, வானத்தின் கடவுளுக்கு மகிமை செலுத்தினர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: “மனிதர்களின் பெயர்கள்—ஏழாயிரம்”; இது இறந்தவர்களாக எண்ணப்பட்ட ஏழாயிரம் நபர்களைக் குறிக்கும் மரபுத்தொடர்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: அந்த நேரத்தில்
  rationale: காலக் குறிப்பின் உடனடித் தன்மையைப் பேணுவதோடு, நவீன தமிழில் இயல்பாகவும் உள்ளது.
- source_word: σεισμὸς μέγας
  choice: ஒரு பெரிய நிலநடுக்கம்
  rationale: σεισμός என்பதன் நேரடிப் பொருளையும் μέγας என்பதன் தீவிரத்தையும் தெளிவாகப் பேணுகிறது.
- source_word: τὸ δέκατον τῆς πόλεως
  choice: நகரத்தின் பத்தில் ஒரு பகுதி
  rationale: பகுதிப்பொருளையும் துல்லியமான எண்ணளவையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἔπεσεν
  choice: விழுந்தது
  rationale: மூலச்சொல்லின் நேரடிப் பொருளைப் பேணி, அது எவ்வாறு அழிந்தது என்பதை மொழிபெயர்ப்பில் கூடுதலாக நிர்ணயிக்கவில்லை.
- source_word: ἀπεκτάνθησαν
  choice: கொல்லப்பட்டனர்
  rationale: செயப்பாட்டு வினையின் பொருளைத் தெளிவாகவும் கண்ணியமான நடையிலும் வெளிப்படுத்துகிறது.
- source_word: ὀνόματα ἀνθρώπων
  choice: பேர்
  rationale: சொல்லுக்கு சொல் வகையில் ‘மனிதர்களின் பெயர்கள்’ என்றாலும், இங்கு எண்ணப்பட்ட நபர்களைக் குறிக்கும் மரபுத்தொடர்; தமிழில் ‘பேர்’ இயல்பாகப் பொருளைத் தருகிறது. நேரடி வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: χιλιάδες ἑπτά
  choice: ஏழாயிரம்
  rationale: எண்ணிக்கையை வழக்கமான தமிழ் எண்ணுச் சொல்லால் துல்லியமாகக் கொடுக்கிறது.
- source_word: οἱ λοιποὶ
  choice: எஞ்சியவர்கள்
  rationale: மற்றவர்களாக எஞ்சியிருந்தோரைக் குறிக்கிறது; அவர்களுடைய ஆன்மீக நிலையைப் பற்றி கூடுதலாக எதையும் சேர்க்கவில்லை.
- source_word: ἔμφοβοι ἐγένοντο
  choice: திகிலடைந்து
  rationale: ἐγένοντο தரும் நிலைமாற்றத்தையும் ἔμφοβοι தரும் கடுமையான அச்சத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἔδωκαν δόξαν
  choice: மகிமை செலுத்தினர்
  rationale: வேதாகமத்தில் நிலைபெற்றுள்ள ‘மகிமை கொடுத்தல்’ என்ற கருத்தை நவீன தமிழில் இயல்பாக வழங்குகிறது.
- source_word: τῷ θεῷ τοῦ οὐρανοῦ
  choice: வானத்தின் கடவுளுக்கு
  rationale: மூலத்திலுள்ள உறவுவேற்றுமைத் தலைப்பை நேரடியாகவும் தெளிவாகவும் பேணுகிறது.
theological_decisions:
- issue: எஞ்சியவர்கள் காட்டிய எதிர்வினை உண்மையான மனந்திரும்புதலா அல்லது அச்சத்தினால் ஏற்பட்ட ஒப்புக்கொள்ளுதலா
  choice: அவர்கள் ‘திகிலடைந்து, வானத்தின் கடவுளுக்கு மகிமை செலுத்தினர்’ என்று மட்டும் மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: அவர்கள் மனந்திரும்பினார்கள் என்று விளக்குவது; அல்லது வெறும் அச்சத்தால் கடவுளுடைய வல்லமையை ஒப்புக்கொண்டார்கள் என்று விளக்குவது.
  rationale: கிரேக்க உரை அச்சத்தையும் கடவுளுக்கு மகிமை செலுத்தியதையும் கூறுகிறது; ஆனால் அந்த எதிர்வினையின் உள்ளார்ந்த ஆன்மீகத் தன்மையைத் தெளிவாக வரையறுக்கவில்லை. ஆகவே அந்தத் தத்துவப் பதற்றம் தீர்க்கப்படாமல் பேணப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘விழுந்தது’ போன்ற நேரடி சொற்கள் மூலத்தின் திறந்த தன்மையைப் பேணுகின்றன; மனந்திரும்புதல் போன்ற விளக்கங்கள் உரைக்குள் சேர்க்கப்படவில்லை.
