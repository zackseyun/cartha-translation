id: REV.11.14
reference: Revelation 11:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ἡ οὐαὶ ἡ δευτέρα ἀπῆλθεν· ⸂ἰδοὺ ἡ οὐαὶ ἡ τρίτη⸃ ἔρχεται ταχύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/014.yaml
  text: The second woe has passed; behold[a], the third woe is coming quickly.
translation:
  language: ta
  text: இரண்டாவது ஐயோ கடந்துபோயிற்று. இதோ, மூன்றாவது ஐயோ விரைவாக[a] வருகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘விரைவில்.’ கிரேக்கச் சொல் காலத்தின் அண்மையையோ நிகழ்வின் வேகத்தையோ வலியுறுத்தலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐαί
  choice: ஐயோ
  rationale: வரவிருக்கும் பேரழிவைக் குறிக்கும் புலம்பல் சொல்லாகவும் பெயர்ச்சொல்லாகவும் இங்கு பயன்படுகிறது. வெளிப்படுத்துதலில் எண்ணிட்டு அழைக்கப்படும் ‘ஐயோ’களின் பேரழிவு நிறைந்த தீர்க்கதரிசனத் தொனியை இது காக்கிறது.
- source_word: δευτέρα
  choice: இரண்டாவது
  rationale: ‘ஐயோ’ என்பதை நேரடியாக வரிசைப்படுத்தும் எண்ணுப்பெயர்.
- source_word: ἀπῆλθεν
  choice: கடந்துபோயிற்று
  rationale: சொல்லடியாக ‘போயிற்று’ அல்லது ‘அகன்றது’ என்றாலும், இச்சூழலில் இரண்டாவது ஐயோ முடிவடைந்துவிட்டதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἰδού
  choice: இதோ
  rationale: வாசகரின் கவனத்தை உடனடியாக ஈர்க்கும் தீர்க்கதரிசன உரைச்சுட்டி; கிரேக்கத்தின் திடீர், விழிப்பூட்டும் வலியுறுத்தலை இயல்பான தமிழில் காக்கிறது.
- source_word: τρίτη
  choice: மூன்றாவது
  rationale: ‘ஐயோ’ என்பதை நேரடியாக வரிசைப்படுத்தும் எண்ணுப்பெயர்.
- source_word: ἔρχεται
  choice: வருகிறது
  rationale: கிரேக்க நிகழ்காலத்தின் உயிரோட்டத்தையும் வருகையின் நெருக்கம் குறித்த வெளிப்படைத்தன்மையையும் காக்கிறது; ‘வரவிருக்கிறது’ என்பதைவிட மூல வடிவத்துக்கு நெருக்கமானது.
- source_word: ταχύ
  choice: விரைவில்
  rationale: வருகை அண்மையில் நிகழ்வதையோ அது வேகமாக நிகழ்வதையோ குறிக்கக்கூடிய கிரேக்கச் சொல்லின் இருபொருள் வாய்ப்பையும் தமிழில் ஓரளவு திறந்தவாறு வைத்திருக்கிறது; அடிக்குறிப்பு மற்ற நுணுக்கத்தைத் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: முடிவுக்காலச் சூழலில் ταχύ என்பதன் பொருள்
  choice: விரைவில்
  alternative: வேகமாக / சீக்கிரமாக
  rationale: ταχύ கால அண்மையையும் நிகழ்வின் வேகம் அல்லது திடீர்மையையும் உணர்த்தக்கூடும். ‘விரைவில்’ அவசர உணர்வைக் காக்கிறது; அடிக்குறிப்பு, குறிப்பிட்ட முடிவுக்காலக் காலக்கணிப்பை மொழிபெயர்ப்பே தீர்மானித்துவிடாமல் மாற்று நுணுக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வெளிப்படுத்துதலுக்குரிய கண்ணியமான தீர்க்கதரிசனத் தொனி பேணப்பட்டுள்ளது. ‘ஐயோ’ என்பது வழக்கமான இடைச்சொல்லாக மட்டுமன்றி எண்ணிடப்பட்ட பேரழிவைக் குறிக்கும் பெயர்ச்சொல்லாக இங்கு வைக்கப்பட்டுள்ளது.
