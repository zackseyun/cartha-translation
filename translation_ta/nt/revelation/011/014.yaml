revisions:
- from: இரண்டாவது ஐயோ கடந்துபோயிற்று. இதோ, மூன்றாவது ஐயோ விரைவில்[a] வருகிறது.
  to: இரண்டாவது ஐயோ கடந்துபோயிற்று. இதோ, மூன்றாவது ஐயோ விரைவாக[a] வருகிறது.
  rationale: The revision aligns the Tamil primary rendering of ταχύ with the English POB's “quickly,” while the footnote preserves “soon” as a legitimate alternative. This retains the Greek ambiguity and avoids imposing a specific eschatological timetable.
