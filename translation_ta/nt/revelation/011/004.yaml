source:
  edition: SBLGNT
  text: Οὗτοί εἰσιν αἱ δύο ἐλαῖαι καὶ αἱ δύο λυχνίαι αἱ ἐνώπιον τοῦ κυρίου τῆς γῆς ⸀ἑστῶτες.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/004.yaml
  text: These are the two olive trees and the two lampstands standing before the Lord of the earth[a][b].
translation:
  language: ta
  text: பூமியின் ஆண்டவருக்கு முன்பாக நிற்பவர்களான இவர்களே இரண்டு ஒலிவ மரங்களும் இரண்டு விளக்குத்தண்டுகளும் ஆவர்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இது செக்கரியா 4-ஐ நினைவூட்டுகிறது; அங்கே ஒலிவ மரங்களும் விளக்குத்தண்டும், கடவுளால் நியமிக்கப்பட்டு அவருடைய ஆவியால் வல்லமையளிக்கப்படும் ஊழியர்களைச் சுட்டும் உருவகங்களாக வருகின்றன.
    reason: cross_reference
  - marker: b
    text: அல்லது, “இவர்கள் பூமியின் ஆண்டவருக்கு முன்பாக நிற்பவர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτοί
  choice: இவர்களே
  rationale: ஆண்பால் பன்மைச் சுட்டுப்பெயர் முந்தைய வசனத்தில் உள்ள இரு சாட்சிகளைக் குறிக்கிறது. அவர்களை இவ்வசனத்திலேயே மீண்டும் ‘சாட்சிகள்’ என்று விரித்துரைக்காமல், மனிதர்களைக் குறிக்கும் இயல்பான தமிழ்ச் சுட்டுப்பெயர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἐλαῖαι
  choice: ஒலிவ மரங்கள்
  rationale: செக்கரியா 4-ஐ நினைவூட்டும் உருவகச் சூழலில் இது ஒலிவ மரங்களைக் குறிக்கிறது; உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: λυχνίαι
  choice: விளக்குத்தண்டுகள்
  rationale: இச்சொல் விளக்கை அல்ல, விளக்கைத் தாங்கும் தண்டைக் குறிக்கிறது. வெளிப்படுத்தின விசேஷத்தில் தொடரும் முக்கிய உருவகத்தையும் இத்தேர்வு காக்கிறது.
- source_word: ἐνώπιον
  choice: முன்பாக
  rationale: ஒருவரின் முன்னிலையில் அல்லது அவருக்கு முன் இருப்பதைக் குறிக்கும் மூலத்தின் இடவியல் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: κύριος என்பதன் மரியாதையும் இறையியல் வலிமையும் கொண்ட வழக்கமான தமிழ் வேதாகமச் சொல்லாக்கம்.
- source_word: γῆς
  choice: பூமி
  rationale: வெளிப்படுத்தின விசேஷத்தின் பிரபஞ்ச அளவிலான சூழலில் ‘நாடு’ என்பதைவிட ‘பூமி’ பொருத்தமானது; உலகளாவிய ஆட்சியையும் உணர்த்துகிறது.
- source_word: ἑστῶτες
  choice: நிற்கிற
  rationale: ἵστημι என்பதன் நிறைவுக்காலச் செயப்பெயரெச்சம், நிலைபெற்று நிற்கும் தற்போதைய நிலையைக் குறிக்கிறது. ‘நிற்கிற’ என்பது அந்தத் தொடர்பைத் தமிழில் தெளிவாக வைத்திருக்கிறது.
theological_decisions:
- issue: செக்கரியா 4 உருவகத்துடனான தொடர்பும் இரு சாட்சிகளின் அடையாளமும்
  choice: ‘இரண்டு ஒலிவ மரங்களும் இரண்டு விளக்குத்தண்டுகளும்’ என்ற உருவக அடையாளப்படுத்தலை நேரடியாகத் தக்கவைத்தல்
  alternative: ‘இந்த இரு சாட்சிகளும் இரண்டு ஒலிவ மரங்களையும் இரண்டு விளக்குத்தண்டுகளையும் போன்றவர்கள்’ என்று விளக்கி விரித்தல்
  rationale: கிரேக்கம் ஒப்புமையாக அல்லாமல் நேரடி இறுதிக்காலக் காட்சி உருவகமாக அவர்களை அடையாளப்படுத்துகிறது. அதை விளக்கி முடிவுசெய்யாமல் வைத்திருப்பது உரையின் இறையியல் பதற்றத்தையும் செக்கரியா 4 உடனான தொடர்பையும் பாதுகாக்கிறது.
- issue: ἑστῶτες என்பதன் இலக்கணத் தொடர்பு
  choice: தமிழில் ‘இரண்டு ஒலிவ மரங்களும் இரண்டு விளக்குத்தண்டுகளும்’ ஆகிய இரு உருவகங்களோடும் ‘நிற்கிற’ என்பதை இயல்பாகத் தொடர்புபடுத்துதல்
  alternative: ‘இவர்கள் பூமியின் ஆண்டவருக்கு முன்பாக நிற்பவர்கள்’ என்று தனி உறவுப்பெயர் வாக்கியமாக மொழிபெயர்த்தல்
  rationale: கிரேக்கத்தில் ஆண்பால் பன்மையான ἑστῶτες, பொருளடிப்படையில் முந்தைய ஆண்பால் பன்மைச் சுட்டுப்பெயரான Οὗτοί உடன் தொடர்புபடலாம்; அதேவேளை அருகிலுள்ள இரு பெண்பால் உருவகப் பெயர்களுடன் இலக்கண ஒத்திசைவு இல்லை. தமிழ் வாக்கியம் இந்த உண்மையான தொடர்பு மயக்கத்தை ஓரளவு திறந்தவாறே வைக்கிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஒலிவ மரங்கள்’, ‘விளக்குத்தண்டுகள்’, ‘பூமியின் ஆண்டவர்’ ஆகியவை வெளிப்படுத்தின விசேஷத்தின் காட்சி உருவகத்தையும் வேதாகம இடையுரைத்தொடர்பையும் காக்கின்றன. எல்லா அடிக்குறிப்பு குறியீடுகளும் மூலவசனத்தில் இடம்பெற்றுள்ளன.
