id: REV.11.19
reference: Revelation 11:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἠνοίγη ὁ ναὸς τοῦ θεοῦ ⸀ὁ ἐν τῷ οὐρανῷ, καὶ ὤφθη ἡ κιβωτὸς τῆς διαθήκης ⸀αὐτοῦ ἐν τῷ ναῷ αὐτοῦ· καὶ ἐγένοντο ἀστραπαὶ καὶ φωναὶ καὶ βρονταὶ ⸂καὶ σεισμὸς⸃ καὶ χάλαζα μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/019.yaml
  text: And the temple of God in heaven was opened[a], and the ark of his covenant was seen in his temple[c][b]; and there were flashes of lightning and voices and peals of thunder and an earthquake and great hail.
translation:
  language: ta
  text: பரலோகத்தில் உள்ள கடவுளின் ஆலயம்[a] திறக்கப்பட்டது. அவருடைய ஆலயத்தில் அவருடைய உடன்படிக்கைப் பெட்டி[b] காணப்பட்டது. அப்போது மின்னல்களும், குரல்களும்[c], இடிமுழக்கங்களும், நிலநடுக்கமும், பெரும் ஆலங்கட்டி மழையும் உண்டாயின.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆலயம்’ என்பதற்குப் பதிலாக ‘திருத்தூயகம்’ அல்லது ‘பரிசுத்த இடம்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ναός, ஆலய வளாகம் முழுவதையும் விட அதன் உட்புறப் பரிசுத்த வாசஸ்தலத்தை வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘உடன்படிக்கைப் பெட்டி’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கத்தில் ‘அவருடைய உடன்படிக்கை’ என்று வெளிப்படையாக உள்ளது.
    reason: lexical_alternative
  - marker: c
    text: ‘குரல்கள்’ என்பதற்கு ‘ஒலிகள்’ அல்லது ‘உருமல்கள்’ என்றும் பொருள் கொள்ளலாம். வெளிப்படுத்தலில் கடவுளின் மாட்சியையும் நியாயத்தீர்ப்பையும் காட்டும் காட்சிகளில் இத்தகைய சொற்றொடர் அடிக்கடி வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὸς
  choice: ஆலயம்
  rationale: ναός என்பது ஆலய வளாகம் முழுவதையும் விட கடவுள் வாசம்பண்ணும் உட்புறப் பரிசுத்த இடத்தைக் குறிப்பாகச் சுட்டக்கூடும். இருப்பினும், இச்சூழலில் இயல்பாகவும் தெளிவாகவும் இருக்கும் ‘ஆலயம்’ முதன்மை உரையில் பயன்படுத்தப்பட்டு, குறிப்பான மாற்றுச் சொல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ὁ ἐν τῷ οὐρανῷ
  choice: பரலோகத்திலுள்ள
  rationale: இந்தத் தொடர் ναός என்பதை விளக்கும் அடைமொழியாக எடுத்துக்கொள்ளப்பட்டு, அதன் இடப்பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: ἠνοίγη
  choice: திறக்கப்பட்டது
  rationale: இறந்தகாலச் செயப்பாட்டு வடிவம் காக்கப்படுகிறது; செயலைச் செய்தவர் யார் என்று கிரேக்கம் வெளிப்படையாகக் கூறாததால் தமிழிலும் ஒரு செய்பவர் சேர்க்கப்படவில்லை.
- source_word: ὤφθη
  choice: காணப்பட்டது
  rationale: பெட்டி தானாகத் தோன்றியது என்று வலியுறுத்தாமல், அது பார்வைக்குத் தென்பட்டது என்ற கிரேக்கச் செயப்பாட்டுப் பொருளை நெருக்கமாகக் காக்கிறது.
- source_word: κιβωτὸς τῆς διαθήκης αὐτοῦ
  choice: அவருடைய உடன்படிக்கையின் பெட்டி
  rationale: αὐτοῦ என்பதிலுள்ள ‘அவருடைய’ என்பதை வெளிப்படையாகக் காத்து, διαθήκη என்பதற்கு நிலையான ‘உடன்படிக்கை’ என்ற சொல்லும் κιβωτός என்பதற்கு தெளிவான ‘பெட்டி’ என்ற சொல்லும் பயன்படுத்தப்பட்டுள்ளன.
- source_word: ἐν τῷ ναῷ αὐτοῦ
  choice: அவருடைய ஆலயத்தில்
  rationale: மீண்டும் வரும் ναός ஒரே சொல்லால் மொழிபெயர்க்கப்பட்டு, αὐτοῦ என்பதன் உடைமைப் பொருளும் காக்கப்பட்டுள்ளது.
- source_word: ἐγένοντο
  choice: உண்டாயின
  rationale: பின்வரும் பல நிகழ்வுகள் ஏற்பட்டதைத் தெளிவாகவும் இயல்பாகவும் கூறும் பன்மை வினை வடிவம்.
- source_word: ἀστραπαὶ
  choice: மின்னல்கள்
  rationale: கிரேக்கப் பன்மையைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: φωναὶ
  choice: குரல்கள்
  rationale: வெளிப்படுத்தலில் திரும்பத் திரும்ப வரும் தனித்துவமான இறைக்காட்சி மொழிநடையைச் சீராக்காமல், φωναί என்பதன் நேரடிப் பொருள் காக்கப்பட்டுள்ளது.
- source_word: βρονταὶ
  choice: இடிமுழக்கங்கள்
  rationale: பன்மையில் வரும் மீண்டும் மீண்டும் ஒலிக்கும் இடியை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: σεισμὸς
  choice: நிலநடுக்கம்
  rationale: σεισμός என்பதற்கான தெளிவான, நிலையான நவீனத் தமிழ்ச் சொல்.
- source_word: χάλαζα μεγάλη
  choice: பெருங்கல்மழை
  rationale: χάλαζα என்ற ஆலங்கட்டிமழையையும் μεγάλη என்ற அதன் பெருமையையும் உயர்ந்த இறுதிக்காலக் காட்சிநடைக்கு ஏற்ற சுருக்கமான தமிழில் தருகிறது.
theological_decisions:
- issue: பரலோக ναός என்பதன் இயல்பு
  choice: முதன்மை உரையில் ‘ஆலயம்’
  alternative: ‘திருத்தூயகம்’ அல்லது ‘பரிசுத்த இடம்’
  rationale: இந்த வசனம் கடவுளின் பரலோக வாசஸ்தலத்தையும் உடன்படிக்கைப் பெட்டி வெளிப்படுவதையும் சித்தரிக்கிறது. ‘ஆலயம்’ இயல்பாகப் புரியும் சொல்; அதேவேளை பரலோகக் கட்டமைப்பைப் பற்றி தேவையற்ற ஒரு குறுகிய முடிவை அது திணிப்பதில்லை. ναός என்பதன் இன்னும் குறிப்பான வாய்ப்பு அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
- issue: இறைக்காட்சி வரிசையில் φωναὶ என்பதன் பொருள்
  choice: ‘குரல்கள்’
  alternative: ‘ஒலிகள்’ அல்லது ‘முழக்கங்கள்’
  rationale: வெளிப்படுத்தலில் காணப்படும் ‘மின்னல்கள், குரல்கள், இடிமுழக்கங்கள்’ என்ற தனித்துவமான தொடர் காக்கப்படுகிறது. இது மனிதப் பேச்சுக் குரல்களை மட்டுமே குறிக்கிறது என்று முடிவுசெய்யாமல், இயற்கைச் சூழலில் ‘ஒலிகள்’ என்றும் புரிந்துகொள்ளக்கூடிய வாய்ப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளை வெளிப்படுத்தலின் கண்ணியமிக்க இறைக்காட்சி நடையைத் தக்கவைக்கும் மொழிநடை. கிரேக்கச் செயப்பாட்டு வடிவங்களும் நிகழ்வுகளின் பன்மை வரிசையும் காக்கப்பட்டுள்ளன; இயல்பான தமிழ் ஓட்டத்திற்காக வசனம் மூன்று வாக்கியங்களாக அமைக்கப்பட்டுள்ளது.
