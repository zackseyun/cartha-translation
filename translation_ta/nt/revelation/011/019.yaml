- from: பரலோகத்திலுள்ள கடவுளின் ஆலயம்[a] திறக்கப்பட்டது. அவருடைய ஆலயத்தில் அவருடைய உடன்படிக்கையின் பெட்டி[b] காணப்பட்டது. அப்போது மின்னல்களும், குரல்களும்[c], இடிமுழக்கங்களும், நிலநடுக்கமும், பெருங்கல்மழையும் உண்டாயின.
  to: பரலோகத்தில் உள்ள கடவுளின் ஆலயம்[a] திறக்கப்பட்டது. அவருடைய ஆலயத்தில் அவருடைய உடன்படிக்கைப் பெட்டி[b] காணப்பட்டது. அப்போது மின்னல்களும், குரல்களும்[c], இடிமுழக்கங்களும், நிலநடுக்கமும், பெரும் ஆலங்கட்டி மழையும் உண்டாயின.
  rationale: The revision makes only idiomatic and clarity-focused changes. It retains the Greek passives, the explicit possessives, the recurrence of ναός as ‘ஆலயம்,’ and the deliberately literal ‘குரல்கள்,’ while providing a more useful lexical alternative in the corresponding note.
