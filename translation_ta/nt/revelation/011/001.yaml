id: REV.11.1
reference: Revelation 11:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἐδόθη μοι κάλαμος ὅμοιος ῥάβδῳ, λέγων· ⸀Ἔγειρε καὶ μέτρησον τὸν ναὸν τοῦ θεοῦ καὶ τὸ θυσιαστήριον καὶ τοὺς προσκυνοῦντας ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/001.yaml
  text: And I was given a reed like a rod[a], saying, “Rise and measure the temple of God and the altar and those who worship in it.”
translation:
  language: ta
  text: 'கோலைப் போன்ற ஒரு நாணல் எனக்குக் கொடுக்கப்பட்டது. இவ்வாறு சொல்லப்பட்டது: “எழுந்து, தேவனுடைய ஆலயத்தையும்[a], பலிபீடத்தையும், அதில் வழிபடுகிறவர்களையும் அளவிடு.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேவனுடைய உள்ளகத் திருத்தலத்தையும்.” இங்கு பயன்படுத்தப்பட்டுள்ள கிரேக்கச் சொல் ஆலய வளாகம் முழுவதையும் அல்லாமல், குறிப்பாக அதன் உள்ளகத் திருத்தலத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη μοι
  choice: எனக்குக் கொடுக்கப்பட்டது
  rationale: δίδωμι என்பதன் செயலப்பாட்டு வடிவத்தையும், கொடுப்பவர் வெளிப்படையாகக் குறிப்பிடப்படாததையும் காக்கிறது.
- source_word: κάλαμος
  choice: நாணல்
  rationale: அடிப்படைப் பொருளைத் தருகிறது; அடுத்து வரும் கோலுடனான ஒப்பீட்டையும் தனியே காக்கிறது.
- source_word: ὅμοιος ῥάβδῳ
  choice: கோலைப் போன்ற
  rationale: ὅμοιος உடன் வரும் ஒப்பீட்டை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: λέγων
  choice: அப்போது சொல்லப்பட்டதாவது
  rationale: கிரேக்கத்தில் பேசுபவர் வெளிப்படையாக அடையாளப்படுத்தப்படாததைப் பாதுகாக்கிறது; தமிழில் நாணலே பேசுவதாகத் தவறாகப் புரியாத வகையில் இயல்பான இணைப்பை அளிக்கிறது.
- source_word: Ἔγειρε
  choice: எழுந்து
  rationale: அடுத்த கட்டளையுடன் இயல்பாக இணையும் சுருக்கமான கட்டளை வடிவம்.
- source_word: μέτρησον
  choice: அளவிடு
  rationale: அளத்தல் என்ற நேரடிப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: ναὸν τοῦ θεοῦ
  choice: தேவனுடைய ஆலயம்
  rationale: ναός என்பதற்கான இயல்பான தமிழ் மொழிபெயர்ப்பு; உள்ளகத் திருத்தலத்தைக் குறிக்கக்கூடிய நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: θυσιαστήριον
  choice: பலிபீடம்
  rationale: θυσιαστήριον என்பதற்கான வழக்கமான, சூழலுக்கு ஏற்ற சொல்; எந்த வகைப் பலிபீடம் என்று வசனம் குறிப்பிடாததால் அதைச் சேர்க்கவில்லை.
- source_word: τοὺς προσκυνοῦντας
  choice: வழிபடுகிறவர்கள்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் பங்கேற்பு வினையின் செயற்பாட்டுத் தன்மையை இயல்பான தமிழில் காக்கிறது.
- source_word: ἐν αὐτῷ
  choice: அதில்
  rationale: இப்பெயர்ப்புப் பதில் ஆலயத்தையே இயல்பாகச் சுட்டுகிறது; இடத்தைக் குறிக்கும் பொருளைச் சுருக்கமாகத் தருகிறது.
theological_decisions:
- issue: வெளிப்படுத்தல் தரிசனத்தில் ναός எதைக் குறிக்கிறது
  choice: தேவனுடைய ஆலயம்
  alternative: தேவனுடைய உள்ளகத் திருத்தலம்
  rationale: இது பூமிக்குரிய ஆலயமா, பரலோகத் திருத்தலமா, அல்லது தேவமக்களைக் குறிக்கும் அடையாளமா என்பதை இவ்வசனம் தீர்மானிக்கவில்லை. ஆகவே விளக்கத்தைப் புகுத்தாமல் பொதுவான சொல் வைக்கப்பட்டுள்ளது.
- issue: λέγων என்பதில் மறைமுகமாக உள்ள பேச்சாளரின் அடையாளம்
  choice: பேச்சாளரை அடையாளப்படுத்தாமல் ‘சொல்லப்பட்டதாவது’ என வைத்தல்
  alternative: ஒரு தூதன் சொன்னான் / ஒரு குரல் சொன்னது
  rationale: கிரேக்க உரை பேச்சாளரை வெளிப்படையாக அடையாளப்படுத்தவில்லை; ‘தூதன்’ அல்லது ‘குரல்’ என்று சேர்ப்பது மூலத்தை மீறிய விளக்கமாகிவிடும்.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகவும், வெளிப்படுத்தல் நூலுக்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. பேசுபவர் யார், ஆலயம் எதைக் குறிக்கிறது ஆகியவற்றை மொழிபெயர்ப்பு தீர்மானிக்காமல் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
