source:
  edition: SBLGNT
  text: καὶ βλέπουσιν ἐκ τῶν λαῶν καὶ φυλῶν καὶ γλωσσῶν καὶ ἐθνῶν τὸ πτῶμα αὐτῶν ἡμέρας τρεῖς ⸀καὶ ἥμισυ, καὶ τὰ πτώματα αὐτῶν οὐκ ⸀ἀφίουσιν τεθῆναι εἰς μνῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/009.yaml
  text: And some from the peoples and tribes and languages and nations look at their dead bodies for three and a half days[a], and they do not allow them to be laid in a tomb.
translation:
  language: ta
  text: பல்வேறு மக்களினங்கள், குலங்கள், மொழிகள், தேசங்கள் ஆகியவற்றிலிருந்து சிலர், அவர்களுடைய சடலத்தை மூன்றரை நாட்கள் பார்த்துக்கொண்டிருக்கிறார்கள்[a]; அவர்களுடைய சடலங்கள் கல்லறையில் வைக்கப்பட அந்தச் சிலர் அனுமதிப்பதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் முதலில் “அவர்களுடைய சடலம்” என்று ஒருமையிலும், பின்னர் “அவர்களுடைய சடலங்கள்” என்று பன்மையிலும் வருகிறது. ஒருமை, இரண்டு சாட்சிகளையும் ஒரே கூட்டுச் சாட்சியாக முன்வைத்துவிட்டு, பின்னர் அவர்களுடைய தனித்தனி சடலங்களைக் குறிப்பிடக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπουσιν
  choice: பார்த்துக்கொண்டிருப்பார்கள்
  rationale: நிகழ்கால வடிவத்தின் தொடர்ச்சியான, காட்சிமிக்க செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐκ τῶν λαῶν καὶ φυλῶν καὶ γλωσσῶν καὶ ἐθνῶν
  choice: மக்களினங்களிலும் குலங்களிலும் மொழியினர்களிலும் தேசங்களிலும் உள்ள சிலர்
  rationale: ἐκ என்பதன் பகுதியைக் குறிக்கும் பொருளை ‘உள்ள சிலர்’ தெளிவாகக் காட்டுகிறது; பட்டியலின் தனித்தனி குழுக்களையும் காக்கிறது.
- source_word: λαῶν
  choice: மக்களினங்கள்
  rationale: பல தனித்த கூட்டுமக்களைக் குறிக்கும் பன்மையைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: φυλῶν
  choice: குலங்கள்
  rationale: வெளிப்படுத்தின விசேஷத்தின் இனக்குழுப் பட்டியலில் φυλή குறிக்கும் பழங்குடி அல்லது மரபுவழிக் குழுவைச் சுருக்கமாகத் தருகிறது.
- source_word: γλωσσῶν
  choice: மொழியினர்
  rationale: இங்கு γλῶσσα என்பது உடல் உறுப்பைக் காட்டாமல், மொழியால் அடையாளப்படுத்தப்படும் மக்களைக் குறிக்கிறது.
- source_word: ἐθνῶν
  choice: தேசங்கள்
  rationale: வெளிப்படுத்தின விசேஷத்தில் மீண்டும் வரும் பட்டியல் மொழிக்கு ஏற்றவாறு, வெவ்வேறு தேச மக்களைக் குறிக்கிறது.
- source_word: τὸ πτῶμα αὐτῶν
  choice: அவர்களுடைய சடலத்தை
  rationale: இரு சாட்சிகள் குறிக்கப்பட்டாலும், முதல் குறிப்பில் உள்ள ஒருமை πτῶμα-வைப் பாதுகாக்கிறது.
- source_word: ἡμέρας τρεῖς καὶ ἥμισυ
  choice: மூன்றரை நாட்கள்
  rationale: காலநீட்டைக் குறிக்கும் சொற்றொடரின் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: τὰ πτώματα αὐτῶν
  choice: அவர்களுடைய சடலங்கள்
  rationale: இரண்டாம் குறிப்பில் கிரேக்கம் பன்மைக்கு மாறுவதை வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: οὐκ ἀφίουσιν
  choice: அனுமதிக்க மாட்டார்கள்
  rationale: இச்சூழலில் ἀφίημι என்பதன் ‘இடங்கொடு/அனுமதி அளி’ என்ற பொருளைத் தெளிவாகத் தருகிறது.
- source_word: τεθῆναι εἰς μνῆμα
  choice: கல்லறையில் வைக்கப்படுவதற்கு
  rationale: பொதுவான ‘அடக்கம் செய்யப்பட’ என்பதைக் காட்டிலும், அடக்க இடத்தில் வைக்கப்படுதல் என்ற கிரேக்கச் சொல்லமைப்பை நெருக்கமாகக் காக்கிறது.
theological_decisions:
- issue: முதல் குறிப்பில் ஒருமை πτῶμα; இரண்டாம் குறிப்பில் பன்மை πτώματα
  choice: முதலில் ‘அவர்களுடைய சடலத்தை’ என்றும் பின்னர் ‘அவர்களுடைய சடலங்கள்’ என்றும் வேறுபாட்டைப் பாதுகாத்தல்
  alternative: இரண்டு இடங்களிலும் ‘அவர்களுடைய சடலங்கள்’ என்று பன்மையாக்குதல்
  rationale: மூல உரையின் இலக்கண மாற்றம் இரண்டு சாட்சிகளையும் முதலில் ஒரே கூட்டு சாட்சியாகக் காட்டக்கூடும்; அதன் பொருளைத் தீர்மானித்து ஒற்றைப்படுத்தாமல், உரையிலுள்ள பதற்றத்தை மொழிபெயர்ப்பு வெளிப்படையாக வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியத்தக்கதுமான நடை. மூலத்தின் ஒருமை–பன்மை மாறுபாடு திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளது.
