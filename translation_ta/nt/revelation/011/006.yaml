id: REV.11.6
reference: Revelation 11:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὗτοι ἔχουσιν ⸂τὴν ἐξουσίαν κλεῖσαι τὸν οὐρανόν⸃, ἵνα μὴ ὑετὸς βρέχῃ τὰς ἡμέρας τῆς προφητείας αὐτῶν, καὶ ἐξουσίαν ἔχουσιν ἐπὶ τῶν ὑδάτων στρέφειν αὐτὰ εἰς αἷμα καὶ πατάξαι τὴν γῆν ⸂ἐν πάσῃ πληγῇ ὁσάκις ἐὰν θελήσωσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/006.yaml
  text: These have the authority to shut the sky so that no rain may fall during the days of their prophecy[a], and they have authority over the waters to turn them into blood and to strike the earth with every plague as often as they wish.
translation:
  language: ta
  text: இவர்கள் தங்கள் இறைவாக்கு உரைக்கும் நாட்களில் மழை பெய்யாதபடி வானத்தை மூட அதிகாரம் பெற்றிருக்கிறார்கள்[a]. நீர்களின்மேல் இவர்களுக்கு அதிகாரம் உண்டு; அவற்றை இரத்தமாக மாற்றவும், தாங்கள் விரும்பும்போதெல்லாம் ஒவ்வொரு வாதையாலும் பூமியைத் தாக்கவும் அதிகாரம் உண்டு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பரலோகத்தை மூட.’ கிரேக்கச் சொல் οὐρανός என்பது ‘வானம்’ அல்லது ‘பரலோகம்’ என இரு பொருள்களையும் தரலாம்; இங்கு மழையைப் பற்றிய சூழலால் ‘வானம்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: அதிகாரம்
  rationale: வெறும் ஆற்றலைவிட, அளிக்கப்பட்ட உரிமையையும் செயல்படும் அதிகார எல்லையையும் இச்சொல் இயல்பாகக் குறிக்கிறது.
- source_word: κλεῖσαι τὸν οὐρανόν
  choice: வானத்தை மூட
  rationale: மழையைத் தடுப்பதே உடனடிச் சூழல் என்பதால் οὐρανός என்பதற்கு ‘வானம்’ பொருத்தமானது; ‘பரலோகம்’ என்பதும் சொற்பொருள் வாய்ப்பாக அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: ἵνα μὴ ὑετὸς βρέχῃ
  choice: மழை பெய்யாதபடி
  rationale: நோக்கம் அல்லது விளைவை இயல்பான நவீனத் தமிழில் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: τὰς ἡμέρας τῆς προφητείας αὐτῶν
  choice: தாங்கள் இறைவாக்கு உரைக்கும் நாட்களில்
  rationale: προφητεία இங்கு அவர்களின் தீர்க்கதரிசனப் பணிக்காலத்தைக் குறிக்கிறது; ‘இறைவாக்கு உரைத்தல்’ நவீன வாசகருக்கு செயற்பொருளைத் தெளிவாக்குகிறது.
- source_word: ἐπὶ τῶν ὑδάτων
  choice: தண்ணீர்களை
  rationale: அதிகாரத்தின் ஆளுகைப் பொருளாக நீர்களைக் காட்டுகிறது; கிரேக்கப் பன்மை தமிழிலும் காக்கப்படுகிறது.
- source_word: στρέφειν αὐτὰ εἰς αἷμα
  choice: அவற்றை இரத்தமாக மாற்ற
  rationale: மாற்றத்தின் நேரடியான உருவகத்தை இயல்பாகப் பாதுகாக்கிறது; தமிழில் முன் வந்த ‘தண்ணீர்களை’ என்பதோடு இணைந்து பொருள் தெளிவாகிறது.
- source_word: πατάξαι τὴν γῆν
  choice: பூமியைத் தாக்க
  rationale: பழமையான சொல்லாட்சியைத் தவிர்த்து, வெளிப்படுத்தின விசேஷத்தின் உலகளாவிய படிமத்தை நேரடியாகக் காக்கிறது.
- source_word: ἐν πάσῃ πληγῇ
  choice: எல்லா வகையான வாதைகளாலும்
  rationale: ἐν என்பதன் கருவிப்பொருளை ‘-ஆல்’ காட்டுகிறது; πάσῃ πληγῇ என்பதன் பரந்த விநியோக உணர்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὁσάκις ἐὰν θελήσωσιν
  choice: தாங்கள் விரும்பும்போதெல்லாம்
  rationale: மீண்டும் மீண்டும் நிகழக்கூடிய நிபந்தனைச் சாயலை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: οὗτοι
  choice: இவர்கள்
  rationale: முந்தைய சூழலில் உள்ள இரு சாட்சிகளைக் குறித்தாலும், இவ்வசனத்தில் கிரேக்கம் ‘இருவர்’ என்று மீண்டும் சேர்க்காததால் அது மொழிபெயர்ப்பிலும் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: சாட்சிகளின் செயல்கள் எலியா மற்றும் மோசே தொடர்பான படிமங்களை நினைவூட்டுவது
  choice: அற்புதச் செயல்களை நேரடியான மொழியில் வைத்தல்; அவை சொற்பொருளா, குறியீட்டுப் பொருளா என்பதை மொழிபெயர்ப்பில் தீர்மானிக்காதிருத்தல்
  alternative: செயல்களை மொழிபெயர்ப்பிலேயே குறியீடுகளாக விளக்குதல்
  rationale: மூலவசனம் இச்செயல்களைச் சாட்சிகளுக்குக் கொடுக்கப்பட்ட அதிகாரமாக முன்வைக்கிறது. வெளிப்படுத்தின விசேஷத்தின் படிமத்தையும் அதன் உண்மையான இறையியல் பதற்றத்தையும் மொழிபெயர்ப்பு பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகருக்குப் புரியும் வகையில் இயல்பானதாயும், வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையுடனும் வடிவமைக்கப்பட்டது. ‘இறைவாக்கு உரைக்கும்’ என்பது செயலைத் தெளிவுபடுத்துகிறது; ‘வாதை’ என்பது வெளிப்படுத்தின விசேஷத்தின் பேரிடர்/தீர்ப்புச் சூழலுக்கு ஏற்ற மரபும் நவீனப் புரிதலும் கொண்ட சொல்.
