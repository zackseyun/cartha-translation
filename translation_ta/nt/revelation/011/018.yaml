id: REV.11.18
reference: Revelation 11:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ τὰ ἔθνη ὠργίσθησαν, καὶ ἦλθεν ἡ ὀργή σου καὶ ὁ καιρὸς τῶν νεκρῶν κριθῆναι καὶ δοῦναι τὸν μισθὸν τοῖς δούλοις σου τοῖς προφήταις καὶ τοῖς ἁγίοις καὶ τοῖς φοβουμένοις τὸ ὄνομά σου, ⸂τοὺς μικροὺς καὶ τοὺς μεγάλους⸃, καὶ διαφθεῖραι τοὺς διαφθείροντας τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/018.yaml
  text: And the nations became angry[a], and your wrath came, and the time for the dead to be judged, and to give the reward to your servants—the prophets, the saints, and those who fear your name[b], the small and the great—and to destroy those who destroy the earth.
translation:
  language: ta
  text: தேசங்கள் சினமடைந்தன; உமது கடுஞ்சினமும் வந்தது. இறந்தவர்கள் தீர்ப்பிடப்படவும், உமது ஊழியர்களான[a] தீர்க்கதரிசிகளுக்கும், பரிசுத்தவான்களுக்கும், உமது பெயருக்கு அஞ்சுகிற சிறியோருக்கும் பெரியோருக்கும் கைம்மாறை அளிக்கவும், பூமியை[b] அழிக்கிறவர்களை அழிக்கவும் காலம் வந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உமது அடிமைகளான’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் doulos சூழலுக்கேற்ப ஊழியரையோ அடிமையையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: ‘பூமி’ என்பதற்கான கிரேக்கச் சொல் gē, ‘நிலம்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνη
  choice: தேசங்கள்
  rationale: உலக மக்களினங்களைத் தொகுப்பாகக் குறிக்கும் இச்சூழலில், ‘புறவினத்தார்’ என்பதைவிட ‘தேசங்கள்’ இயல்பாகவும் பரந்த பொருளுடனும் அமைகிறது.
- source_word: ὠργίσθησαν
  choice: சினமடைந்தன
  rationale: கோபமடைதல் என்ற வினைச்செயலைத் தெளிவாகக் காட்டுகிறது; பின்னரும் வரும் தெய்வீக ὀργή-யுடன் உள்ள சொற்பொருள் தொடர்பையும் காக்கிறது.
- source_word: ὀργή
  choice: கடுஞ்சினம்
  rationale: சாதாரண கோபத்தைவிட தெய்வீக நியாயத்தீர்ப்பின் வலிமையைக் காட்டுகிறது; ‘சினம்’ என்ற தொடர்புடைய சொல்லால் மூலத்தின் சொல் விளையாட்டும் ஓரளவு நிலைக்கிறது.
- source_word: καιρός
  choice: காலம்
  rationale: தீர்மானிக்கப்பட்ட முக்கிய தருணத்தைக் குறிக்கிறது; சூழல் அதன் இறுதிக்காலத் தன்மையைத் தெளிவாக்குகிறது.
- source_word: τῶν νεκρῶν
  choice: இறந்தவர்கள்
  rationale: தமிழில் இயல்பான, நேரடியான தொகுப்புப் பெயராக்கம்.
- source_word: κριθῆναι
  choice: தீர்ப்பிடப்படுவதற்கு
  rationale: செயப்பாட்டு infinitive-இன் நீதித்துறைப் பொருளை நேரடியாகக் காக்கிறது.
- source_word: μισθός
  choice: கைம்மாறு
  rationale: இங்கு தேவன் தம் மக்களுக்கு அளிக்கும் பிரதிபலனைச் சுட்டுகிறது; பரிமாற்றக் கூலி என்ற குறுகிய உணர்வைத் தவிர்க்கிறது.
- source_word: δούλοις
  choice: ஊழியர்கள்
  rationale: இப்பட்டியலில் தேவனுக்குச் சேவைசெய்து அவருக்குரியவர்களாக இருப்பதே முன்னிலைப்படுகிறது. ‘அடிமைகள்’ என்ற நேரடி மாற்று அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: προφήταις
  choice: தீர்க்கதரிசிகள்
  rationale: அடையாளம் காணப்பட்ட குழுவைக் குறிக்கும் வழக்கமான தமிழ் வேதாகமச் சொல்.
- source_word: ἁγίοις
  choice: பரிசுத்தவான்கள்
  rationale: தேவனுக்கெனப் பிரித்தெடுக்கப்பட்ட மக்களைக் குறிக்கும் வெளிப்படுத்தின விசேஷத்தின் நிலையான, புரிந்துகொள்ளக்கூடிய சொல்.
- source_word: φοβουμένοις τὸ ὄνομά σου
  choice: உமது பெயருக்கு அஞ்சுகிறவர்கள்
  rationale: பயபக்தியைக் குறிக்கும் வேதாகமச் சொல்லாட்சியை விளக்கமாக மாற்றாமல் காக்கிறது.
- source_word: τοὺς μικροὺς καὶ τοὺς μεγάλους
  choice: சிறியோர் பெரியோர் அனைவரும்
  rationale: சமூக நிலை வேறுபாடின்றி முழுமையாக உள்ளடக்கப்படுவதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: διαφθεῖραι τοὺς διαφθείροντας
  choice: அழிக்கிறவர்களை அழிப்பது
  rationale: ஒரே கிரேக்க வேர் இருமுறை பயன்படுத்தப்பட்டிருப்பதை ஒரே தமிழ் வினையால் காத்து, நீதியான எதிரீட்டைத் தெளிவாக்குகிறது.
- source_word: γῆ
  choice: பூமி
  rationale: பிரபஞ்ச அளவிலான இறுதித் தீர்ப்புச் சூழலுக்கு ‘பூமி’ பொருத்தமானது; ‘நிலம்/நாடு’ என்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: தேவனுடைய மக்களுக்கான δοῦλος என்ற அடையாளச்சொல்
  choice: ஊழியர்கள்
  alternative: அடிமைகள்
  rationale: இங்கு கட்டுண்ட சமூக நிலையைக் காட்டுவதைக் காட்டிலும், தேவனுக்குரியவர்களாகச் சேவைசெய்து அவரிடமிருந்து கைம்மாறு பெறுவதே வாக்கியத்தின் மையம். எனினும், மூலச்சொல்லின் ‘அடிமை’ சாத்தியம் மறைக்கப்படாமல் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: γῆ என்பதன் பரப்பு
  choice: பூமி
  alternative: நிலம் அல்லது நாடு
  rationale: வெளிப்படுத்தின விசேஷத்தின் இப்பகுதியிலுள்ள உலகளாவிய இறுதித் தீர்ப்புச் சூழல் ‘பூமி’ என்பதற்கு ஆதரவளிக்கிறது; குறுகிய புவியியல் பொருள் மொழியியல் ரீதியில் சாத்தியமாதலால் அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: மூன்று infinitive தொடர்களும் ὁ καιρός என்பதோடு கொண்ட உறவு
  choice: தீர்ப்பிடுதல், கைம்மாறு அளித்தல், அழித்தல் ஆகிய மூன்றுக்கும் ‘காலம் வந்தது’ என்பதை வெளிப்படையாக இணைத்தல்
  alternative: மூலத்தின் நீண்ட ஒருங்கிணைந்த தொடரை அப்படியே வைத்தல்
  rationale: கிரேக்கத்தில் மூன்று infinitive-களும் வந்த காலத்தின் செயல்களாக ஒருங்கிணைகின்றன. தமிழில் தெளிவுக்காக ‘காலமும் வந்தது’ மீண்டும் வழங்கப்பட்டுள்ளது; பொருளில் புதிய காலவரிசை சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘தீர்க்கதரிசிகள்’, ‘பரிசுத்தவான்கள்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் காக்கப்பட்டுள்ளன. மூலத்தின் நீண்ட தொடரை வாசிப்புத் தெளிவுக்காகப் பிரித்தாலும், அதன் ஒருங்கிணைந்த இறுதிக்காலத் தீர்ப்புப் பொருள் காக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
