id: REV.11.2
reference: Revelation 11:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ τὴν αὐλὴν τὴν ἔξωθεν τοῦ ναοῦ ἔκβαλε ⸀ἔξωθεν, καὶ μὴ αὐτὴν μετρήσῃς, ὅτι ἐδόθη τοῖς ἔθνεσιν, καὶ τὴν πόλιν τὴν ἁγίαν πατήσουσιν μῆνας ⸀τεσσεράκοντα δύο.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/002.yaml
  text: But leave out the court outside the temple[a], and do not measure it, because it has been given to the nations[b], and they will trample the holy city for forty-two months.
translation:
  language: ta
  text: ஆனால், ஆலயத்திற்கு[a] வெளியே உள்ள முற்றத்தை விலக்கிவிடு; அதை அளக்காதே. ஏனெனில், அது நாடுகளுக்குக் கொடுக்கப்பட்டுள்ளது[b]; அந்த நாடுகள் பரிசுத்த நகரத்தை நாற்பத்திரண்டு மாதங்கள் மிதிக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆலயத்தின் பரிசுத்த உட்பகுதிக்கு வெளியே உள்ள முற்றம்.’ கிரேக்கச் சொல் ναός ஆலய வளாகம் முழுவதையும் அல்லாமல், குறிப்பாக அதன் பரிசுத்த உட்பகுதியைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அது பிற இனத்தாருக்குக் கொடுக்கப்பட்டுள்ளது.’ கிரேக்கச் சொல் ἔθνεσιν சூழலுக்கேற்ப ‘நாடுகள்’ அல்லது ‘பிற இனத்தார்’ என்று பொருள்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐλή
  choice: முற்றம்
  rationale: ஆலய வளாகத்திலுள்ள திறந்த முற்றப்பகுதியைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: ἔξωθεν τοῦ ναοῦ
  choice: ஆலயத்திற்கு வெளியே உள்ள
  rationale: இந்தச் சொற்றொடர் முற்றத்தை விவரித்து, அது ναός என்பதற்கு வெளியே இருப்பதைத் தெளிவுபடுத்துகிறது.
- source_word: ναός
  choice: ஆலயம்
  rationale: தமிழ் வேதாகம நடையில் இயல்பான சொல். கிரேக்கத்தில் இது குறிப்பாக ஆலயத்தின் பரிசுத்த உட்பகுதியைக் குறிக்கக்கூடும் என்பதால் அந்த நுட்பம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: ἔκβαλε ἔξωθεν
  choice: விட்டுவிடு
  rationale: அடுத்துவரும் ‘அளக்காதே’ என்பதோடு இணைந்து, அளவிடப்படுவதிலிருந்து அதை விலக்கிவிடு என்ற பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: μὴ αὐτὴν μετρήσῃς
  choice: அதை அளக்காதே
  rationale: இரண்டாம் நபர் ஒருமைத் தடைக் கட்டளையை நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἐδόθη
  choice: கொடுக்கப்பட்டுள்ளது
  rationale: செயப்படுபொருள் வடிவத்தைப் பாதுகாத்து, கொடுத்தவர் யார் என்பதை உரையில் வெளிப்படையாகச் சேர்க்காமல் விடுகிறது.
- source_word: τοῖς ἔθνεσιν
  choice: பிற இனத்தாருக்கு
  rationale: யூதரல்லாத மக்களைக் குறிக்கும் சாத்தியத்தையும் பல இனங்கள் என்ற கூட்டுப் பொருளையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ‘நாடுகள்’ என்பது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: πόλιν τὴν ἁγίαν
  choice: பரிசுத்த நகரம்
  rationale: பாரம்பரிய வேதாகமச் சொல்லாட்சியையும் மூலத்தின் அடைமொழியையும் பாதுகாக்கிறது; நகரத்தை பிரதான உரையில் எருசலேம் என்று விளக்கிச் சொல்லவில்லை.
- source_word: πατήσουσιν
  choice: மிதிப்பார்கள்
  rationale: பகைமையான அவமதிப்பு அல்லது ஆதிக்கத்தின் வலிமையான உருவகத்தைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: μῆνας τεσσεράκοντα δύο
  choice: நாற்பத்திரண்டு மாதங்கள்
  rationale: கால நீளத்தைக் குறிக்கும் மூலத்தின் வேற்றுமைப் பொருள் தமிழில் இயல்பாகவே தெளிவாகிறது.
theological_decisions:
- issue: வெளிப்படுத்தின விசேஷத்தின் ஆலயக் காட்சியில் ναός என்பதன் குறிப்பான பொருள்
  choice: பிரதான உரையில் ‘ஆலயம்’
  alternative: ‘பரிசுத்த இடம்’ அல்லது ஆலயத்தின் உட்பரிசுத்தப் பகுதி
  rationale: ‘ஆலயம்’ வாசகருக்கு இயல்பானது; ஆனால் முற்றத்திலிருந்து வேறுபடுத்தப்படும் ναός குறுகிய பொருளில் பரிசுத்த உட்பகுதியைக் குறிக்கலாம். இந்த விளக்க முக்கியத்துவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἔθνεσιν என்பதன் பொருள்
  choice: பிரதான உரையில் ‘பிற இனத்தார்’
  alternative: ‘நாடுகள்’
  rationale: இச்சொல் யூதரல்லாத மக்களையோ பொதுவாக நாடுகளையோ குறிக்கலாம். ‘பிற இனத்தார்’ தமிழில் மக்களைக் குறிக்கும் பன்மைச் செயப்பாட்டோடு இயல்பாக அமைகிறது; பரந்த அரசியல்-கூட்டுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் எளிதில் புரியக்கூடிய, அதேவேளை கண்ணியமான வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. குறுகிய கட்டளைகள் மூலத்தின் நேரடித் தன்மையைப் பாதுகாக்கின்றன; கிரேக்கத்தின் உண்மையான சொற்பொருள் தெளிவின்மைகள் அடிக்குறிப்புகளில் வைக்கப்பட்டுள்ளன.
