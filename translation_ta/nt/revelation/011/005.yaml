id: REV.11.5
reference: Revelation 11:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἴ τις αὐτοὺς θέλει ἀδικῆσαι, πῦρ ἐκπορεύεται ἐκ τοῦ στόματος αὐτῶν καὶ κατεσθίει τοὺς ἐχθροὺς αὐτῶν· καὶ εἴ τις ⸂θελήσῃ αὐτοὺς⸃ ἀδικῆσαι, οὕτως δεῖ αὐτὸν ἀποκτανθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/005.yaml
  text: And if anyone wants to harm them[a], fire comes out of their mouth and devours their enemies; and if anyone should want to harm them, in this way he must be killed.
translation:
  language: ta
  text: யாராவது அவர்களுக்குத் தீங்கு செய்ய விரும்பினால், அவர்களுடைய வாயிலிருந்து[a] நெருப்பு புறப்பட்டு, அவர்களுடைய பகைவர்களை விழுங்குகிறது; யாராவது அவர்களுக்குத் தீங்கு செய்ய விரும்பினால், அவர் இவ்வாறே கொல்லப்பட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய வாய்களிலிருந்து.” கிரேக்கத்தில் பன்மை உடைமையாளருடன் “வாய்” என்பது ஒருமையில் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῆσαι
  choice: தீங்கு செய்ய
  rationale: இச்சூழலில் இரண்டு சாட்சிகளுக்கு எதிராகச் செய்யப்படும் பகைமையான செயலைக் குறிக்கிறது. ‘தீங்கு செய்ய’ என்பது தாக்குதலின் முறையை அளவுக்கு மீறிக் குறிப்பாக்காமல் இயல்பாகப் பொருளைத் தருகிறது.
- source_word: πῦρ
  choice: நெருப்பு
  rationale: வெளிப்படுத்தின விசேஷத்தின் உயிரோட்டமான காட்சிமொழியை விளக்கமாக மாற்றாமல் நேரடியாகப் பேணுகிறது.
- source_word: ἐκπορεύεται ἐκ τοῦ στόματος αὐτῶν
  choice: அவர்களுடைய வாயிலிருந்து நெருப்பு புறப்பட்டு
  rationale: கிரேக்கத்தில் பன்மை உடைமையாளருடன் ஒருமை ‘வாய்’ இருப்பதைப் பேணுகிறது. ‘புறப்பட்டு’ என்பது ἐκπορεύεται என்பதையும் வாயிலிருந்து வெளிவரும் காட்சியையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: κατεσθίει
  choice: விழுங்குகிறது
  rationale: முற்றிலும் அழிக்கும் வலிமையான செயலை உயிரோட்டமாகத் தெரிவிக்கிறது.
- source_word: ἐχθροὺς
  choice: பகைவர்கள்
  rationale: சாட்சிகளுக்கு எதிராக நிற்பவர்களைக் குறிக்கும் தெளிவான, பொதுவான தமிழ் சொல்.
- source_word: θέλει / θελήσῃ
  choice: விரும்பினால்
  rationale: இரு நிபந்தனை வாக்கியங்களிலும் விருப்பம் அல்லது நோக்கத்தை இயல்பாகக் காட்டுகிறது. இரண்டாவது வடிவத்தின் நுட்பமான நிகழ்தகவை தமிழில் செயற்கையாக மிகைப்படுத்தாமல் நிபந்தனை அமைப்பு வெளிப்படுத்துகிறது.
- source_word: οὕτως
  choice: இவ்வாறே
  rationale: முன்பு சொல்லப்பட்ட நெருப்பால் அழிக்கப்படும் முறையைப் பின்னோக்கிச் சுட்டுகிறது; ‘ஏ’ விகுதி அந்த முறையையே வலியுறுத்துகிறது.
- source_word: δεῖ
  choice: வேண்டும்
  rationale: தேவை அல்லது தவிர்க்க முடியாத நிலையைச் சுருக்கமாகவும் வலிமையாகவும் தெரிவிக்கிறது; அதன் காரணத்தை மொழிபெயர்ப்பில் கூடுதலாக விளக்கவில்லை.
- source_word: ἀποκτανθῆναι
  choice: கொல்லப்பட
  rationale: செயப்பாட்டு infinitive-இன் பொருளை நேரடியாகவும் இன்றைய தமிழில் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: வாயிலிருந்து வெளிப்படும் நெருப்பை நேர்ப்பொருளாக மொழிபெயர்ப்பதா அல்லது நியாயத்தீர்ப்பைக் குறிக்கும் அடையாளமாக விளக்குவதா
  choice: ‘அவர்களுடைய வாயிலிருந்து நெருப்பு புறப்பட்டு’ என்ற மூலப் படிமத்தை அப்படியே பேணுதல்
  alternative: அவர்களுடைய வார்த்தைகள் அழிவான நியாயத்தீர்ப்பைக் கொண்டுவருகின்றன என்று விளக்கி மொழிபெயர்த்தல்
  rationale: இந்தக் காட்சி நேரடியானதா அடையாளமானதா என்பதை கிரேக்க உரை இவ்வசனத்தில் தீர்மானித்து விளக்கவில்லை. ஆகவே மொழிபெயர்ப்பு அந்தத் தெளிவின்மையையும் இறையியல் பதற்றத்தையும் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் இயல்பானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. வெளிப்படுத்தின விசேஷத்தின் தீவிரமான காட்சிமொழியும், ‘தீங்கு செய்ய’ என்ற மறுபடியும் வரும் சொற்றொடரும் பேணப்பட்டுள்ளன.
