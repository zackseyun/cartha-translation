source:
  edition: SBLGNT
  text: καὶ ἔβαλεν ὁ καθήμενος ἐπὶ ⸂τῆς νεφέλης⸃ τὸ δρέπανον αὐτοῦ ἐπὶ τὴν γῆν, καὶ ἐθερίσθη ἡ γῆ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/016.yaml
  text: And the one seated on the cloud cast his sickle upon the earth[c][b][a], and the earth was harvested.
translation:
  language: ta
  text: மேகத்தின்மேல் அமர்ந்திருப்பவர்[c] தமது அரிவாளைப் பூமியின்மீது வீசினார்[a]; பூமி அறுவடை செய்யப்பட்டது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தமது அரிவாளைப் பூமியின்மேல் செலுத்தினார்.” கிரேக்க வினைச்சொல்லின் நேரடிப் பொருள் “வீசினார்”; இங்கு அறுவடைச் சூழலில் அரிவாளை அறுப்பதற்காகச் செயல்படுத்தியதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பூமி அறுக்கப்பட்டது.”
    reason: lexical_alternative
  - marker: c
    text: முந்தைய சூழலின் அடிப்படையில் மேகத்தின்மேல் அமர்ந்திருப்பவர் மனுஷகுமாரன் என்று பொதுவாக அடையாளப்படுத்தப்படுகிறார்; ஆனால் இந்த வசனம் அவரை “மேகத்தின்மேல் அமர்ந்திருப்பவர்” என்று மட்டுமே குறிப்பிடுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔβαλεν
  choice: வீசினார்
  rationale: βάλλω என்பதன் அடிப்படைப் பொருளான ‘வீசுதல்’ என்பதைத் தக்கவைக்கிறது; அறுவடைச் சூழலில் அரிவாளை அறுக்கச் செலுத்திய செயலை இது குறிக்கிறது.
- source_word: ὁ καθήμενος ἐπὶ τῆς νεφέλης
  choice: மேகத்தின்மேல் அமர்ந்திருந்தவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் கிரேக்கப் பங்கேற்புவினையை இயல்பான தமிழில் தருகிறது; அந்த நபர் யார் என்பதை வசனம் கூறுவதற்கும் மேலாக அடையாளப்படுத்தவில்லை.
- source_word: τῆς νεφέλης
  choice: மேகம்
  rationale: கிரேக்கத்தில் உள்ள சுட்டுத்தன்மையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; முந்தைய வசனத்தில் குறிப்பிடப்பட்ட மேகத்தையே குறிக்கிறது.
- source_word: δρέπανον
  choice: அரிவாள்
  rationale: அறுவடைக்குப் பயன்படுத்தப்படும் வளைந்த கருவிக்கான தெளிவான, பொதுவான தமிழ் சொல்; அறுவடை மற்றும் நியாயத்தீர்ப்பு உருவகத்தைப் பேணுகிறது.
- source_word: ἐπὶ τὴν γῆν
  choice: பூமியின்மேல்
  rationale: ἐπί உடன் வரும் திசைநோக்கிய செயலை நெருக்கமாகப் பிரதிபலிக்கிறது; அரிவாள் பூமியை நோக்கிச் செலுத்தப்படுவதைத் தெரிவிக்கிறது.
- source_word: ἐθερίσθη
  choice: அறுவடை செய்யப்பட்டது
  rationale: θερίζω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவத்தை இயல்பான நவீன தமிழில் பாதுகாக்கிறது.
- source_word: ἡ γῆ
  choice: பூமி
  rationale: வெளிப்படுத்தின விசேஷத்தின் பிரபஞ்ச அளவிலான சூழலில் உள்ளூர் ‘நிலம்’ என்பதைக் காட்டிலும் ‘பூமி’ பொருத்தமானது; வசனத்திலுள்ள சொல்லின் மறுபயன்பாடும் பேணப்படுகிறது.
theological_decisions:
- issue: மேகத்தின்மேல் அமர்ந்திருக்கும் அறுவடை செய்பவரின் அடையாளம்
  choice: மூலவசனத்தைப் போலவே ‘மேகத்தின்மேல் அமர்ந்திருந்தவர்’ என்று விளக்கமாக மட்டும் மொழிபெயர்த்தல்
  alternative: முந்தைய சூழலின் அடிப்படையில் அவரை மனுஷகுமாரன்/மேசியா என்று நேரடியாக அடையாளப்படுத்துதல்; அல்லது தேவதூத முகவராகக் கருதுதல்
  rationale: இந்த வசனத்தின் கிரேக்கம் அந்த நபரை ‘மேகத்தின்மேல் அமர்ந்திருப்பவர்’ என்று மட்டுமே குறிப்பிடுகிறது. விளக்கவுரையில் வேறுபாடு இருப்பதால், மொழிபெயர்ப்பு எந்த ஓர் அடையாளத்தையும் உரைக்குள் சேர்க்காமல் இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. கிரேக்க வசனத்தின் இரு முதன்மை வாக்கியங்களும், ‘பூமி’ என்ற சொல்லின் மறுபயன்பாடும், செயப்பாட்டு வடிவமும் பேணப்பட்டுள்ளன.
