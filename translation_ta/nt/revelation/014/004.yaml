id: REV.14.4
reference: Revelation 14:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν οἳ μετὰ γυναικῶν οὐκ ἐμολύνθησαν, παρθένοι γάρ εἰσιν· ⸀οὗτοι οἱ ἀκολουθοῦντες τῷ ἀρνίῳ ὅπου ἂν ⸀ὑπάγῃ· ⸁οὗτοι ἠγοράσθησαν ἀπὸ τῶν ἀνθρώπων ἀπαρχὴ τῷ θεῷ καὶ τῷ ἀρνίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/004.yaml
  text: These are the ones who have not defiled themselves with women[a], for they are virgins. These are the ones who follow the Lamb wherever he goes. These were purchased from among mankind as firstfruits to God and to the Lamb[b],
translation:
  language: ta
  text: இவர்கள் பெண்களோடு தீட்டுப்படாதவர்கள்[a]; ஏனெனில் இவர்கள் கன்னிமையுள்ளவர்கள். ஆட்டுக்குட்டியானவர் எங்கு சென்றாலும் அவரைப் பின்பற்றுகிறவர்கள் இவர்களே. கடவுளுக்கும் ஆட்டுக்குட்டியானவருக்கும் முதற்பலனாக, மனிதர்களில் இருந்து[b] விலைகொடுத்து வாங்கப்பட்டவர்கள் இவர்களே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்தப் படிமம் பாலுறவிலிருந்து விலகியிருப்பதைப் பற்றிய நேரடிக் கூற்றாக மட்டும் இல்லாமல், ஆன்மிகத் தூய்மையையோ விக்கிரக வழிபாட்டினால் வரும் தீட்டிலிருந்து விடுபட்டிருப்பதையோ குறிக்கக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: அதாவது, மனிதகுலத்திலிருந்து அல்லது மக்களிடமிருந்து. கிரேக்கச் சொல் ஆண்களை மட்டும் அல்லாமல் மனிதர்களைப் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμολύνθησαν
  choice: தீட்டுப்படாதவர்கள்
  rationale: மூலத்தின் செயப்பாட்டு வடிவத்தையும், ஒழுக்க அல்லது வழிபாட்டுத் தீட்டு என்ற பொருள் நிழலையும் காக்கிறது; காரணத்தைத் தெளிவுபடுத்தி மூலத்தில் இல்லாத கருத்தைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: μετὰ γυναικῶν
  choice: பெண்களோடு
  rationale: μετά உடன் வரும் இயல்பான ‘உடன்/ஓடு’ பொருளைக் காக்கிறது. γυναικῶν என்பதை ‘மனைவிகளோடு’ எனக் குறுக்காமல் பொதுவாக ‘பெண்களோடு’ என வழங்குகிறது.
- source_word: παρθένοι
  choice: கன்னியர்கள்
  rationale: உருவகமாக மட்டுமே விளக்காமல், மூலத்தின் நேரடியான சொல்லையும் அதன் திட்டவட்டமான படிமத்தையும் காக்கிறது.
- source_word: ἀκολουθοῦντες
  choice: பின்பற்றுகிறவர்கள்
  rationale: தொடர்ச்சியான, இவர்களின் தன்மையை அடையாளப்படுத்தும் செயலை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἀρνίῳ
  choice: ஆட்டுக்குட்டியானவர்
  rationale: வெளிப்படுத்தலில் இயேசுவைக் குறிக்கும் பட்டப் படிமத்தைப் பாதுகாக்கிறது; மனிதரைக் குறிக்கும் மரியாதை ஒருமை தமிழில் இயல்பாக உள்ளது.
- source_word: ὅπου ἂν ὑπάγῃ
  choice: எங்கு சென்றாலும்
  rationale: ὅπου ἄν உடன் வரும் வரையறுக்கப்படாத ‘எங்கு சென்றாலும்’ என்ற பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: ἠγοράσθησαν
  choice: விலைகொடுத்து வாங்கப்பட்டவர்கள்
  rationale: வாங்குதல் என்ற வணிக உருவகத்தைத் தெளிவாக்குகிறது; பிரதான உரையில் விளக்கவுரையான ‘மீட்கப்பட்டவர்கள்’ என்பதைச் சேர்க்கவில்லை.
- source_word: ἀπὸ τῶν ἀνθρώπων
  choice: மனிதர்களிலிருந்து
  rationale: இது ஆண்களை மட்டும் அல்லாமல் மனிதர்களைப் பொதுவாகக் குறிக்கிறது. ‘-இலிருந்து’ என்பது ஒரு பெருந்தொகையிலிருந்து பிரித்தெடுக்கப்பட்டவர்கள் என்ற சூழற்பொருளை வழங்குகிறது.
- source_word: ἀπαρχὴ
  choice: முதற்பலனாக
  rationale: கடவுளுக்குச் செலுத்தப்படும் அறுவடையின் முதல் பகுதி என்ற வழிபாட்டு மற்றும் அறுவடைப் படிமத்தை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: பெண்களோடு தீட்டுப்படாமையும் கன்னியர்களாக இருப்பதும் நேரடிப் பொருளிலா அல்லது ஆன்மிகத் தூய்மைக்கான உருவகமாகவா எடுத்துக்கொள்ளப்பட வேண்டும்?
  choice: 'மூலத்தின் நேரடியான மொழி பிரதான உரையில் காக்கப்பட்டது: ‘பெண்களோடு தீட்டுப்படாதவர்கள்; ஏனெனில் இவர்கள் கன்னியர்கள்.’'
  alternative: இது ஆன்மிகத் தூய்மையை அல்லது விக்கிரக வழிபாட்டால் ஏற்படும் தீட்டிலிருந்து விலகியிருப்பதைச் சுட்டும் உருவகமாக இருக்கலாம்.
  rationale: வெளிப்படுத்தல் உருவக மொழியைப் பயன்படுத்தினாலும், இங்கு உள்ள உறுதியான சொற்களை மொழிபெயர்ப்பே விளக்கித் தீர்மானிக்கக் கூடாது. மாற்று உருவகப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதாகப் புரியும், அதேவேளை வெளிப்படுத்தலின் உயர்ந்த மற்றும் படிமமிக்க நடையைத் தக்கவைக்கும் மொழிநடை பயன்படுத்தப்பட்டது. ‘ஆட்டுக்குட்டியானவர்’ என்ற மரியாதை வடிவம் கிறிஸ்துவைக் குறிக்கும் பட்டத்தின் நபர்தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
