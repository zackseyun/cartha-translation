id: REV.14.1
reference: Revelation 14:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἰδοὺ τὸ ἀρνίον ⸀ἑστὸς ἐπὶ τὸ ὄρος Σιών, καὶ μετ’ ⸀αὐτοῦ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες ἔχουσαι τὸ ὄνομα αὐτοῦ καὶ τὸ ὄνομα τοῦ πατρὸς αὐτοῦ γεγραμμένον ἐπὶ τῶν μετώπων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/001.yaml
  text: Then I looked[a], and behold, the Lamb was standing on Mount Zion, and with him were one hundred forty-four thousand who had his name and his Father's name written on their foreheads.
translation:
  language: ta
  text: பின்பு நான் பார்த்தேன்; இதோ, சீயோன் மலையின்மேல் ஆட்டுக்குட்டியானவர் நின்றுகொண்டிருந்தார். அவருடன் ஓர் இலட்சத்து நாற்பத்து நான்காயிரம் பேர் இருந்தார்கள். அவருடைய பெயரும் அவருடைய தந்தையின் பெயரும் அவர்களுடைய நெற்றிகளில் எழுதப்பட்டிருந்தன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில், “அவருடைய தந்தையின் பெயர் அவர்களுடைய நெற்றிகளில் எழுதப்பட்டிருந்தது” என்று மட்டும் உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: Καὶ εἶδον
  choice: பின்பு நான் பார்த்தேன்
  rationale: καί உடன் வரும் εἶδον தரிசனத்தின் அடுத்த காட்சியை முன்னெடுப்பதால், இயல்பான தமிழ் கதைத் தொடராக மொழிபெயர்க்கப்பட்டது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தைத் தீவிரமாக ஈர்க்கும் வெளிப்படுத்தல் நூலுக்குரிய சுட்டுச் சொல்லின் வலிமையை இயல்பான உயர்நடைத் தமிழில் காக்கிறது.
- source_word: τὸ ἀρνίον
  choice: ஆட்டுக்குட்டியானவர்
  rationale: வெளிப்படுத்தலில் கிறிஸ்துவைக் குறிக்கும் பட்டப்பெயரை மரியாதையுடனும் வழக்கமான தமிழ் வேதாகம நடையுடனும் தருகிறது; மூலத்தில் இல்லாத பலியியல் விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: ἑστὸς
  choice: நின்றுகொண்டிருந்தார்
  rationale: ἵστημι என்பதன் நிறைவுநிலைப் பங்கேற்பு காட்டும் தொடரும் நிலையைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐπὶ τὸ ὄρος Σιών
  choice: சீயோன் மலையின்மேல்
  rationale: இடப்பெயரை ஒலிபெயர்த்து, ἐπί குறிக்கும் மேற்பரப்பு/இட உறவை நேரடியாகக் காக்கிறது.
- source_word: μετ’ αὐτοῦ
  choice: அவருடன் ... இருந்தார்கள்
  rationale: அடுத்து வரும் எண்ணிக்கைத் தொகுதிக்கான மறைந்துள்ள வினையை இயல்பான தமிழில் வெளிப்படையாக வழங்குகிறது.
- source_word: ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: ஓர் இலட்சத்து நாற்பத்து நான்காயிரம் பேர்
  rationale: 144,000 என்ற துல்லியமான எண்ணை நவீன தமிழில் பொதுவாகப் புரியும் எண்ணுருவில் தருகிறது; மனிதர்களைக் குறிப்பதால் ‘பேர்’ சேர்க்கப்பட்டது.
- source_word: ἔχουσαι ... γεγραμμένον
  choice: '... எழுதப்பட்டிருந்தன'
  rationale: பெயர்கள் ஏற்கெனவே எழுதப்பட்டு நிலைத்திருப்பதைக் காட்டும் நிறைவு செயப்பாட்டு உணர்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τὸ ὄνομα αὐτοῦ καὶ τὸ ὄνομα τοῦ πατρὸς αὐτοῦ
  choice: அவருடைய பெயரும் அவருடைய தந்தையின் பெயரும்
  rationale: ஆட்டுக்குட்டியானவரின் பெயரையும் அவருடைய தந்தையின் பெயரையும் தனித்தனியாக இணைக்கும் கிரேக்க அமைப்பைக் காக்கிறது.
- source_word: ἐπὶ τῶν μετώπων αὐτῶν
  choice: அவர்களுடைய நெற்றிகளில்
  rationale: பெயர்கள் எழுதப்பட்டுள்ள உடல் இடத்தை நேரடியாகவும் தெளிவாகவும் மொழிபெயர்க்கிறது.
theological_decisions:
- issue: τὸ ἀρνίον என்பவரின் அடையாளம்
  choice: கிறிஸ்துவுக்குரிய பட்டப்பெயராக ‘ஆட்டுக்குட்டியானவர்’
  alternative: ‘பலியிடப்பட்ட ஆட்டுக்குட்டியானவர்’
  rationale: சூழலில் இது உயர்த்தப்பட்ட கிறிஸ்துவைக் குறித்தாலும், இவ்வசனத்தில் வெளிப்படையாக இல்லாத ‘பலியிடப்பட்ட’ என்ற விளக்கத்தைச் சேர்க்காமல் பட்டப்பெயரை மட்டும் காக்கிறது.
- issue: இரண்டு பெயர்களுக்கிடையிலான உறவு
  choice: ‘அவருடைய பெயரும் அவருடைய தந்தையின் பெயரும்’ என்று இரண்டையும் இணைத்தும் வேறுபடுத்தியும் மொழிபெயர்த்தல்
  alternative: ‘அவருடைய பெயராகிய அவருடைய தந்தையின் பெயர்’
  rationale: கிரேக்கம் இரண்டு இணையான பொருட்களை καί மூலம் இணைக்கிறது; அவற்றை ஒரே பெயராக விளக்கி இறையியல் பதற்றத்தைத் தீர்த்துவிடவில்லை.
- issue: நெற்றியில் எழுதப்பட்ட பெயர் குறித்த பாடவேறுபாடு
  choice: SBLGNT-இன்படி ஆட்டுக்குட்டியானவரின் பெயரையும் அவருடைய தந்தையின் பெயரையும் முதன்மைப் பாடத்தில் சேர்த்தல்
  alternative: தந்தையின் பெயர் மட்டும்
  rationale: மூலப் பதிப்பின் முதன்மைப் பாடம் இரு பெயர்களையும் கொண்டுள்ளது; பொருளுள்ள மாற்றுப் பாடம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வெளிப்படுத்தல் நூல் நடை பயன்படுத்தப்பட்டது. ‘இதோ’ என்ற கவன ஈர்ப்புச் சொல் பாதுகாக்கப்பட்டுள்ளது; நீண்ட கிரேக்க வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டது.
