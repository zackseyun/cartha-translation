revisions:
- from: அந்தத் தூதன் தன் அரிவாளைப் பூமியின்மேல் வீசி, பூமியின் திராட்சைக்கொடியிலிருந்த திராட்சைக் குலைகளை அறுவடை செய்து, கடவுளுடைய கடுங்கோபத்தின் பெரிய திராட்சை ஆலையில் எறிந்தான்.
  to: அந்தத் தூதன் தன் அரிவாளைப் பூமியின்மேல் வீசி, பூமியின் திராட்சைக் கொடியை அறுவடை செய்து, அதை கடவுளுடைய கடுங்கோபத்தின் பெரிய திராட்சை ஆலையில் எறிந்தான்.
  rationale: The revision removes the added reference to grape clusters and restores the source’s singular “vine” as the object both harvested and thrown into the winepress. It otherwise retains the draft’s natural modern Tamil wording and its forceful judgment imagery.
  reviewer_model: gpt-5.6-terra
