id: REV.14.19
reference: Revelation 14:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν ὁ ἄγγελος τὸ δρέπανον αὐτοῦ εἰς τὴν γῆν, καὶ ἐτρύγησεν τὴν ἄμπελον τῆς γῆς, καὶ ἔβαλεν εἰς τὴν ληνὸν τοῦ θυμοῦ τοῦ θεοῦ τὸν μέγαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/019.yaml
  text: And the angel swung his sickle over the earth, and harvested the vine of the earth, and threw it into the great winepress of the wrath of God.
translation:
  language: ta
  text: அந்தத் தூதன் தன் அரிவாளைப் பூமியின்மேல் வீசி, பூமியின் திராட்சைக் கொடியை அறுவடை செய்து, அதை கடவுளுடைய கடுங்கோபத்தின் பெரிய திராட்சை ஆலையில் எறிந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔβαλεν ... τὸ δρέπανον ... εἰς τὴν γῆν
  choice: தன் அரிவாளைப் பூமியின்மேல் வீசி
  rationale: βάλλω என்பதன் அடிப்படைப் பொருளான ‘வீசுதல்’ என்பதையும், அறுவடைச் செயலில் அரிவாள் பூமியின் மேல் செலுத்தப்படுவதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘பூமிக்குள்’ என்று தவறாக உணர்த்துவதைத் தவிர்க்கிறது.
- source_word: ἐτρύγησεν
  choice: அறுவடை செய்து
  rationale: திராட்சைப் பழங்களைச் சேகரிக்கும் அறுவடைச் செயலைக் குறிக்கும் வினை; தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: τὴν ἄμπελον τῆς γῆς
  choice: பூமியின் திராட்சைக்கொடியிலிருந்த திராட்சைக் குலைகளை
  rationale: ἄμπελος நேரடியாக ‘திராட்சைக்கொடி’ என்றாலும், அடுத்ததாக அதை ஆலையில் எறிவது அதன் விளைச்சலையே குறிக்கிறது. மூல உருவகத்தை வைத்துக்கொண்டு செயப்படுபொருளை இயல்பாகத் தெளிவுபடுத்துகிறது.
- source_word: ληνὸν
  choice: திராட்சை ஆலை
  rationale: திராட்சைப் பழங்களை மிதித்துப் பிழியும் இடம் அல்லது தொட்டியைக் குறிக்கிறது; பொதுவாசகருக்கு புரியும் வழக்கமான சொற்றொடர்.
- source_word: θυμοῦ τοῦ θεοῦ
  choice: கடவுளுடைய கடுங்கோபத்தின்
  rationale: θυμός இங்கு தீவிரமான தெய்வீகக் கோபத்தைக் குறிக்கிறது; ‘கடுங்கோபம்’ அதன் வலிமையைப் பாதுகாக்கிறது.
- source_word: τὸν μέγαν
  choice: பெரிய
  rationale: இலக்கணப்படி ληνός என்பதையே வர்ணிக்கும் அடைமொழியாக இயல்பான இடத்தில் வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: திராட்சை அறுவடையும் கடவுளின் கோபமும் குறிக்கும் நியாயத்தீர்ப்பு உருவகம்
  choice: உருவகத்தை விளக்கவுரையாக மாற்றாமல் அப்படியே பாதுகாத்தல்
  alternative: இதை நேரடியாக ‘தீயவர்களைத் தண்டித்தான்’ என்று விளக்குதல்
  rationale: வசனம் திராட்சை அறுவடை மற்றும் ஆலையின் காட்சிமொழியிலேயே நியாயத்தீர்ப்பைச் சித்தரிக்கிறது; அதன் குறியீட்டுத் தன்மையை மொழிபெயர்ப்பு முன்கூட்டியே தீர்மானிக்கக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழ்; காட்சியின் தீவிரத்தையும் வெளிப்படுத்தும் கண்ணியமான நடை. ‘அரிவாள்’, ‘திராட்சை ஆலை’, ‘கடுங்கோபம்’ ஆகியவை பொதுவாசகருக்குப் புரியும் வகையில் தேர்ந்தெடுக்கப்பட்டன.
