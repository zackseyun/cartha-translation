id: REV.14.14
reference: Revelation 14:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἰδοὺ νεφέλη λευκή, καὶ ἐπὶ τὴν νεφέλην καθήμενον ὅμοιον ⸀υἱὸν ἀνθρώπου, ἔχων ἐπὶ τῆς κεφαλῆς αὐτοῦ στέφανον χρυσοῦν καὶ ἐν τῇ χειρὶ αὐτοῦ δρέπανον ὀξύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/014.yaml
  text: And I looked[a], and behold, a white cloud, and seated on the cloud was one like a son of man[b], having on his head a golden crown and in his hand a sharp sickle.
translation:
  language: ta
  text: நான் பார்த்தேன்; இதோ, வெண்மையான ஒரு மேகம்! அந்த மேகத்தின்மேல் மனித மகனைப் போன்ற ஒருவர்[a] அமர்ந்திருந்தார். அவர் தமது தலையில் பொன் கிரீடம்[b] சூடியிருந்தார்; தமது கையில் கூர்மையான அரிவாள் ஒன்றை வைத்திருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மனிதகுமாரனைப் போன்ற ஒருவர்’ என்றும் மொழிபெயர்க்கலாம். இச்சொற்றொடர் தானியேல் 7:13-ஐ எதிரொலிக்கிறது; இது மேசியாவைக் குறிக்கும் பட்டமாகப் பொதுவாகப் புரிந்துகொள்ளப்படுகிறது. எனினும், இங்குள்ள கிரேக்கத்தில் திட்டவட்டச் சுட்டுப்பெயர் இல்லாமல், சொல்லுக்கு சொல் ‘மனித மகனைப் போன்றவர்’ என்று உள்ளது.
    reason: alternative_reading
  - marker: b
    text: இங்கு ‘கிரீடம்’ என்று மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொல் στέφανος (ஸ்தெஃபானோஸ்); இது அரச மகுடத்தைவிட, வெற்றி பெற்றவருக்கு அணிவிக்கப்படும் மாலையைப் பல வேளைகளில் குறிக்கும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: இதோ
  rationale: யோவானின் தரிசனத்தில் திடீரெனக் கவனத்தை ஈர்க்கும் சொல்லின் சுட்டிக்காட்டும் வலிமையை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: νεφέλη λευκή
  choice: வெண்மையான ஒரு மேகம்
  rationale: λευκή என்பதன் நேரடிப் பொருளான ‘வெண்மை’யையும் வெளிப்படுத்தல் நூலிலுள்ள அதன் குறியீட்டு எதிரொலியையும் விளக்கச் சேர்க்கையின்றிப் பாதுகாக்கிறது.
- source_word: ἐπὶ τὴν νεφέλην καθήμενον
  choice: அந்த மேகத்தின்மேல் ... அமர்ந்திருந்தார்
  rationale: ஒருவர் மேகத்தின்மேல் அமர்ந்திருக்கும் தரிசனக் காட்சியைத் தெளிவாகவும் கண்ணியமாகவும் இயல்பான தமிழில் கூறுகிறது.
- source_word: ὅμοιον υἱὸν ἀνθρώπου
  choice: மனித மகனைப் போன்ற ஒருவர்
  rationale: ὅμοιον என்பதிலுள்ள ‘போன்ற’ என்ற ஒப்புமையையும், பெயர்ச்சுட்டு இல்லாத υἱὸν ἀνθρώπου என்ற சொற்றொடரையும் பாதுகாக்கிறது; அதேவேளையில் தானியேல் 7:13-இன் எதிரொலியை அழித்துவிடவில்லை.
- source_word: στέφανον χρυσοῦν
  choice: பொன் கிரீடம்
  rationale: காட்சியை சாதாரண வாசகருக்கு உடனடியாகப் புரியவைக்கும் இயல்பான மொழிபெயர்ப்பு. στέφανος என்பது அரச மகுடத்தைக் குறிக்கும் διάδημα என்பதிலிருந்து வேறுபட்டு வெற்றி மாலையையும் குறிக்கக்கூடும் என்பதால் அந்த நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: δρέπανον ὀξύ
  choice: கூர்மையான அரிவாள்
  rationale: அறுவடைக்குப் பயன்படும் வளைந்த வெட்டுக் கருவியைக் குறிக்கும் δρέπανον என்பதற்கு தெளிவான, வழக்கிலுள்ள தமிழ்ச் சொல்; ὀξύ என்பதன் ‘கூர்மையான’ பொருளையும் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: υἱὸν ἀνθρώπου என்பதை வெளிப்படையான கிறிஸ்துவியல் பட்டமாக மொழிபெயர்க்க வேண்டுமா?
  choice: முதன்மை உரையில் ‘மனித மகனைப் போன்ற ஒருவர்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘மனிதகுமாரனைப் போன்ற ஒருவர்’
  rationale: கிரேக்கத்தில் இச்சொற்றொடருக்கு முன் பெயர்ச்சுட்டு இல்லாததால், முதன்மை உரை அதை நிலையான பட்டமாக வலுப்படுத்தவில்லை. ஆனால் இது தானியேல் 7:13-ஐத் தெளிவாக எதிரொலிக்கிறது; சூழலில் மேசியாவைக் குறிப்பதாகப் பொதுவாகப் புரிந்துகொள்ளப்படுவதால் அந்த வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிதில் புரியும் வகையிலும், வெளிப்படுத்தல் நூலின் தரிசனத்திற்குரிய கண்ணியத்தையும் உயிரோட்டத்தையும் காக்கும் வகையிலும் மொழிநடை அமைக்கப்பட்டுள்ளது. ‘இதோ’ என்பதும் வியப்புக்குறியும் காட்சியின் திடீர் வெளிப்பாட்டைச் சுட்டுகின்றன; கடினமான இறையியல் அடையாளம் முதன்மை உரையில் தீர்மானிக்கப்படாமல் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
