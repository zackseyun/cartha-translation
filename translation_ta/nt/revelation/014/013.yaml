id: REV.14.13
reference: Revelation 14:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα φωνῆς ἐκ τοῦ οὐρανοῦ λεγούσης· Γράψον· Μακάριοι οἱ νεκροὶ οἱ ἐν κυρίῳ ἀποθνῄσκοντες ἀπ’ ἄρτι. ⸂ναί, λέγει⸃ τὸ πνεῦμα, ἵνα ⸀ἀναπαήσονται ἐκ τῶν κόπων αὐτῶν, τὰ ⸀γὰρ ἔργα αὐτῶν ἀκολουθεῖ μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/013.yaml
  text: 'And I heard a voice from heaven saying[a], “Write: Blessed are the dead who die in the Lord from now on.” “Yes,” says the Spirit, “so that they may rest from their labors[b], for their deeds follow with them.”'
translation:
  language: ta
  text: 'நான் பரலோகத்திலிருந்து ஒரு குரல் இவ்வாறு சொல்வதைக் கேட்டேன்: “எழுது: இதுமுதல் ஆண்டவருக்குள் மரிக்கிற இறந்தோர் பேறுபெற்றவர்கள்.” “ஆம்,” என்று ஆவியானவர் சொல்கிறார், “அவர்கள் தங்கள் உழைப்புகளிலிருந்து இளைப்பாறும்படியாக[a]; ஏனெனில், அவர்களுடைய செயல்கள் அவர்களோடு வருகின்றன[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் தங்கள் உழைப்புகளிலிருந்து இளைப்பாறுவார்கள்.” கிரேக்கத் தொடரை நோக்கமாகவோ விளைவாகவோ புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “அவர்களுடைய செயல்கள் அவர்களைப் பின்தொடர்கின்றன.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνῆς ἐκ τοῦ οὐρανοῦ λεγούσης
  choice: பரலோகத்திலிருந்து ஒரு குரல் இவ்வாறு சொல்வதை
  rationale: φωνή என்பதற்கு இயல்பான ‘குரல்’ என்பதும், ἐκ τοῦ οὐρανοῦ என்பதற்கு மூலத்தைக் குறிக்கும் ‘பரலோகத்திலிருந்து’ என்பதும் பயன்படுத்தப்பட்டுள்ளன; λεγούσης என்ற பங்கேற்புவினையின் உரையறிமுகச் செயலும் வெளிப்படையாகத் தக்கவைக்கப்பட்டுள்ளது.
- source_word: Γράψον
  choice: எழுது
  rationale: ஒருமை முன்னிலை ஏவல் வடிவத்தின் நேரடித் தன்மையை, கிரேக்கத்தில் இல்லாத செயப்படுபொருளைச் சேர்க்காமல் தருகிறது.
- source_word: Μακάριοι
  choice: பேறுபெற்றவர்கள்
  rationale: வெறும் மனமகிழ்ச்சியைக் காட்டிலும், இறைவனால் அருளப்பட்ட நல்வாய்ப்பும் நல்நிலையும் கொண்ட வாழ்த்துரையின் பொருளையும் கண்ணியமான தொனியையும் தருகிறது.
- source_word: οἱ νεκροὶ οἱ ἐν κυρίῳ ἀποθνῄσκοντες
  choice: ஆண்டவருக்குள் மரிக்கிற இறந்தவர்கள்
  rationale: ‘இறந்தவர்கள்’ என்ற பெயர்ச்சொல் சார்ந்த பயன்பாட்டையும், ἐν κυρίῳ என்ற விரிவான உறவுமொழியையும் விளக்கிப் பரப்பாமல் தக்கவைக்கிறது; நிகழ்காலப் பங்கேற்புவினை தமிழில் பண்புக்கூறாக இயல்பாக வருகிறது.
- source_word: ἀπ’ ἄρτι
  choice: இதுமுதல்
  rationale: குறிப்பிட்ட இத்தருணத்திலிருந்து தொடரும் காலப்பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: ναί, λέγει τὸ πνεῦμα
  choice: “ஆம்,” என்று ஆவியானவர் சொல்கிறார்
  rationale: ναί என்பதன் வலியுறுத்தும் உறுதிப்பாட்டையும், τὸ πνεῦμα என்ற வெளிப்படையான எழுவாயையும் பாதுகாக்கிறது.
- source_word: ἵνα ἀναπαήσονται
  choice: அவர்கள் … இளைப்பாறும்படியாக
  rationale: ἵνα தொடரின் நோக்கம்/விளைவு நிழலைத் தமிழில் இயல்பாகத் தக்கவைக்கிறது; எதிர்கால வினை வெளிப்படுத்தும் உறுதியை மறுக்காமல், தொடரின் இலக்கணத் தெளிவின்மையை மிகையாகத் தீர்மானிப்பதில்லை.
- source_word: ἐκ τῶν κόπων αὐτῶν
  choice: தங்கள் உழைப்புகளிலிருந்து
  rationale: κόπος குறிக்கும் களைப்பூட்டும் உழைப்பு அல்லது பாடுபாட்டை, மிகக் குறுகிய துன்பப் பொருளாக மாற்றாமல் வழங்குகிறது.
- source_word: τὰ ἔργα αὐτῶν
  choice: அவர்களுடைய செயல்கள்
  rationale: ἔργα என்பதன் செயல்/செய்கை சார்ந்த பரந்த பொருளை நவீனத் தமிழில் இயல்பாக வழங்குகிறது.
- source_word: ἀκολουθεῖ μετ’ αὐτῶν
  choice: அவர்களோடு வருகின்றன
  rationale: μετά குறிக்கும் உடன்செல்லுதலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ἀκολουθέωவின் பின்தொடர்தல் நிழல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: ‘ஆண்டவருக்குள்’ என்பதற்கும் இறந்தவர்களுக்கும் உள்ள உறவு
  choice: ‘ஆண்டவருக்குள் மரிக்கிற’ என்று விரிவாக்கமின்றி மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஆண்டவருக்கு உண்மையுள்ளவர்களாக மரிக்கிற’ அல்லது ‘ஆண்டவருக்குச் சொந்தமானவர்களாக மரிக்கிற’
  rationale: ἐν κυρίῳ என்பது ஒன்றிப்பு, சொந்தம், உண்மையுள்ள உறவு ஆகிய பல நிழல்களைத் தாங்கக்கூடும்; வசனம் அவற்றில் ஒன்றை மட்டும் கட்டாயப்படுத்தாததால் அகலமான மொழி பாதுகாக்கப்பட்டுள்ளது.
- issue: ἵνα ἀναπαήσονται தொடரின் வலிமை
  choice: நோக்கம்/விளைவு இரண்டிற்கும் இடமளிக்கும் ‘இளைப்பாறும்படியாக’ பயன்படுத்தப்பட்டது.
  alternative: உறுதியான விளைவாக ‘அவர்கள் இளைப்பாறுவார்கள்’ அல்லது வெளிப்படையான நோக்கமாக ‘அவர்கள் இளைப்பாறுவதற்காக’
  rationale: ἵνα உடன் வரும் எதிர்கால வடிவம் நோக்கம் அல்லது விளைவு சார்ந்த நிழலைக் கொண்டிருக்கலாம்; மொழிபெயர்ப்பு ஒரு வாய்ப்பை மட்டும் இறுதியாக்கவில்லை.
- issue: இறந்தவர்களோடு அவர்களுடைய செயல்களுக்கு உள்ள தொடர்பு
  choice: செயல்கள் ‘அவர்களோடு வருகின்றன’ என்று மட்டும் கூறப்பட்டுள்ளது.
  alternative: செயல்கள் அவர்களுடைய பேற்றைச் சம்பாதிக்கின்றன அல்லது மரணத்திற்குப் பின் வெறுமனே நினைவுகூரப்படுகின்றன
  rationale: மூலவசனம் செயல்கள் உடன்வருவதாகக் கூறுகிறது; அவை இரட்சிப்பைப் பெறும் தகுதியாகிறதா அல்லது வெறும் நினைவாகிறதா என்பதை வரையறுக்கவில்லை. ஆகவே எந்தக் கோட்பாட்டு விளக்கமும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழின் கண்ணியமான வெளிப்பாடு பயன்படுத்தப்பட்டுள்ளது. ‘பேறுபெற்றவர்கள்,’ ‘ஆண்டவருக்குள்,’ ‘ஆவியானவர்’ ஆகியவை வெளிப்படுத்தும் திருவெளிப்பாட்டு நயம் காக்கப்பட்டாலும், பழமையான ‘பிரயாசம்’ போன்ற சொற்கள் தவிர்க்கப்பட்டுள்ளன. அடிக்குறி [a] அது விளக்கும் ἵνα தொடரின் அருகிலும், [b] உடன்வருதல்/பின்தொடர்தல் வேறுபாட்டின் அருகிலும் வைக்கப்பட்டுள்ளன.
