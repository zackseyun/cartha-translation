revisions:
- from: 'பின்பு, பரலோகத்திலிருந்து ஒரு குரல் இவ்வாறு சொல்வதைக் கேட்டேன்: “எழுது: இதுமுதல் ஆண்டவருக்குள் மரிக்கிற இறந்தவர்கள் பேறுபெற்றவர்கள்.” “ஆம்,” என்று ஆவியானவர் சொல்கிறார், “அவர்கள் தங்கள் உழைப்புகளிலிருந்து இளைப்பாறும்படியாக[a]; ஏனெனில், அவர்களுடைய செயல்கள் அவர்களோடு வருகின்றன[b].”'
  to: 'நான் பரலோகத்திலிருந்து ஒரு குரல் இவ்வாறு சொல்வதைக் கேட்டேன்: “எழுது: இதுமுதல் ஆண்டவருக்குள் மரிக்கிற இறந்தோர் பேறுபெற்றவர்கள்.” “ஆம்,” என்று ஆவியானவர் சொல்கிறார், “அவர்கள் தங்கள் உழைப்புகளிலிருந்து இளைப்பாறும்படியாக[a]; ஏனெனில், அவர்களுடைய செயல்கள் அவர்களோடு வருகின்றன[b].”'
  rationale: The revision removes ‘பின்பு,’ which unnecessarily specifies temporal succession for Καί, and replaces ‘இறந்தவர்கள்’ with the more idiomatic solemn form ‘இறந்தோர்.’ The purpose/result ambiguity of ἵνα ἀναπαήσονται, the broad relational sense of ‘ஆண்டவருக்குள்,’ and the non-doctrinal statement that their works accompany them are retained. Footnote anchors remain adjacent to the clauses they explain.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:04:11Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the voice from heaven, the imperative ‘Write,’ the beatitude, ‘in the Lord,’ the temporal force of ἀπ’ ἄρτι, the Spirit’s affirmation, rest from labors, and the accompanying works. However, ‘பின்பு’ adds a sequential sense stronger than the Greek conjunction Καί requires. The source’s participial formulation concerning ‘the dead ... dying’ is necessarily somewhat marked in Tamil, but can be retained more idiomatically with ‘இறந்தோர்.’
  naturalness: The revised wording removes the unnecessary temporal transition and slightly streamlines the beatitude. ‘அவர்களோடு வருகின்றன’ is a natural Tamil expression for the accompanying sense of μετ’ αὐτῶν; the footnote appropriately records the more explicit ‘follow’ alternative.
  terminology: ‘பரலோகம்,’ ‘ஆண்டவருக்குள்,’ ‘ஆவியானவர்,’ ‘பேறுபெற்றவர்கள்,’ ‘உழைப்புகள்,’ and ‘செயல்கள்’ are suitable for modern standard Tamil and retain the passage’s solemn register without importing doctrinal explanation.
  issues:
  - severity: low
    issue: ‘பின்பு’ for Καί
    rationale: ‘பின்பு’ means ‘afterward/then’ and can impose a temporal sequence not explicitly expressed by the Greek connective. Omitting the conjunction is idiomatic Tamil and avoids this added nuance.
  - severity: low
    issue: ‘இறந்தவர்கள்’ in the beatitude
    rationale: The expression is source-faithful but somewhat heavy alongside ‘மரிக்கிற.’ ‘இறந்தோர்’ preserves οἱ νεκροί while reading more naturally in a solemn modern Tamil register.
  revised_text: 'நான் பரலோகத்திலிருந்து ஒரு குரல் இவ்வாறு சொல்வதைக் கேட்டேன்: “எழுது: இதுமுதல் ஆண்டவருக்குள் மரிக்கிற இறந்தோர் பேறுபெற்றவர்கள்.” “ஆம்,” என்று ஆவியானவர் சொல்கிறார், “அவர்கள் தங்கள் உழைப்புகளிலிருந்து இளைப்பாறும்படியாக[a]; ஏனெனில், அவர்களுடைய செயல்கள் அவர்களோடு வருகின்றன[b].”'
  revised_footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் தங்கள் உழைப்புகளிலிருந்து இளைப்பாறுவார்கள்.” கிரேக்கத் தொடரை நோக்கமாகவோ விளைவாகவோ புரிந்துகொள்ளலாம்.
