id: REV.14.5
reference: Revelation 14:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ⸂ἐν τῷ στόματι αὐτῶν οὐχ εὑρέθη⸃ ψεῦδος· ⸀ἄμωμοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/005.yaml
  text: And in their mouth no lie was found[a]; they are blameless.
translation:
  language: ta
  text: அவர்களுடைய வாயில் பொய் எதுவும் காணப்படவில்லை; அவர்கள் குற்றமற்றவர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘களங்கமற்றவர்கள்’ அல்லது ‘பழுதற்றவர்கள்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் ஒழுக்கரீதியான குற்றமின்மையோடு, பலிக்குரிய களங்கமின்மை என்ற உருவகத்தையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ στόματι αὐτῶν
  choice: அவர்களுடைய வாயில்
  rationale: கிரேக்கத்தில் ஒருமையாக உள்ள ‘வாய்’ கூட்டுப்பொருளில் பயன்படுத்தப்பட்டிருப்பதை நெருக்கமாகப் பாதுகாக்கிறது; அவர்களுடைய பேச்சில் வெளிப்படும் உள்ளடக்கத்தைக் குறிக்கிறது.
- source_word: οὐχ εὑρέθη
  choice: காணப்படவில்லை
  rationale: இறந்தகாலச் செயப்பாட்டு வடிவத்தைப் பாதுகாத்து, பொய் இல்லாதிருப்பதையே வலியுறுத்துகிறது.
- source_word: ψεῦδος
  choice: பொய் எதுவும்
  rationale: ‘பொய்’ என்பது நேரடியான, இயல்பான தமிழ்ச் சொல். எதிர்மறை வாக்கியத்தில் ‘எதுவும்’ சேர்ப்பது தமிழில் முழுமையான இல்லாமையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἄμωμοί
  choice: குற்றமற்றவர்கள்
  rationale: ஒழுக்கரீதியாகப் பழிசுமத்த முடியாத நிலையைக் கண்ணியமான நவீன தமிழில் தெரிவிக்கிறது; பலிக்குரிய பொருளின் ‘களங்கமின்மை’ என்ற நிழற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: καὶ
  choice: —
  rationale: தமிழில் முந்தைய வசனத்தின் தொடர்ச்சி சூழலாலும் வாக்கிய அமைப்பாலும் தெளிவாக இருப்பதால், தொடக்க இணைப்பைச் சொல்லாக்காமல் விடுவது இயல்பான நடையை அளிக்கிறது.
theological_decisions:
- issue: ἄμωμοί என்பதில் ஒழுக்கக் குற்றமின்மையும் பலிக்குரிய களங்கமின்மையும் இணைந்திருப்பது
  choice: குற்றமற்றவர்கள்
  alternative: களங்கமற்றவர்கள்; பழுதற்றவர்கள்
  rationale: முதன்மை உரை ஒழுக்கரீதியான பழியின்மையைத் தெளிவாகக் கூறுகிறது; அதேவேளை, முழுமையான பாவமின்மை என்ற பொருளைத் தேவையின்றி மிகைப்படுத்தாது. பலி மற்றும் தூய்மை சார்ந்த நிழற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘அவர்களுடைய வாயில்’ என்பது மூலத்தின் கூட்டுப்பொருளுள்ள ஒருமையைப் பாதுகாக்கிறது; ‘பொய் எதுவும் காணப்படவில்லை’ என்பது செயப்பாட்டு வலியுறுத்தலைத் தக்கவைக்கிறது.
