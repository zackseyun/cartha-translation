id: REV.14.10
reference: Revelation 14:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ αὐτὸς πίεται ἐκ τοῦ οἴνου τοῦ θυμοῦ τοῦ θεοῦ τοῦ κεκερασμένου ἀκράτου ἐν τῷ ποτηρίῳ τῆς ὀργῆς αὐτοῦ, καὶ βασανισθήσεται ἐν πυρὶ καὶ θείῳ ἐνώπιον ⸂ἀγγέλων ἁγίων⸃ καὶ ἐνώπιον τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/010.yaml
  text: he also will drink from the wine of God's wrath[a], mixed undiluted in the cup of his anger[b], and he will be tormented with fire and sulfur before the holy angels and before the Lamb.
translation:
  language: ta
  text: அவனும் கடவுளுடைய கடுஞ்சினத்தின் திராட்சரசத்தைக் குடிப்பான். அது அவருடைய கோபத்தின் கிண்ணத்தில் நீர்க்கப்படாமல் கலந்து ஆயத்தப்படுத்தப்பட்டிருக்கிறது.[a] பரிசுத்த தூதர்களின் முன்னிலையிலும் ஆட்டுக்குட்டியானவரின் முன்னிலையிலும் அவன் நெருப்பாலும் கந்தகத்தாலும் வேதனைப்படுத்தப்படுவான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கச் சொற்றொடர், திராட்சரசம் கலந்து ஆயத்தப்படுத்தப்பட்டிருந்தாலும் அது நீரால் நீர்க்கப்படவில்லை என்பதைக் கூறுகிறது; அதாவது, தீர்ப்பு அதன் முழு வலிமையுடன் உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘கந்தகம்’ என்பதற்கு பழைய மொழிபெயர்ப்புகளில் ‘எரிகந்தகம்’ என்றும் வழங்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτὸς
  choice: அவனும்
  rationale: καί என்பதன் சேர்க்கைப் பொருளையும், முந்தைய வசனத்தில் குறிப்பிடப்பட்ட தனிநபரை வலியுறுத்தும் αὐτός என்பதையும் இயல்பான தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: πίεται ἐκ τοῦ οἴνου
  choice: திராட்சரசத்தைக் குடிப்பான்
  rationale: எதிர்காலச் செயலைத் தெளிவாகக் காட்டுகிறது. தமிழில் ‘திராட்சரசத்திலிருந்து குடிப்பான்’ என்பது இயல்பற்றதால், ἐκ குறிக்கும் மூலப்பொருள் வேற்றுமை உருபால் இயல்பாக அடங்குகிறது.
- source_word: τοῦ θυμοῦ τοῦ θεοῦ
  choice: கடவுளுடைய கடுஞ்சினமாகிய
  rationale: θυμός குறிக்கும் தீவிரமான சினத்தை ‘கடுஞ்சினம்’ வெளிப்படுத்துகிறது; அடுத்துள்ள ὀργή என்பதிலிருந்து சொல்வேறுபாட்டையும் காக்கிறது.
- source_word: τοῦ κεκερασμένου ἀκράτου
  choice: நீர்க்காமல் கலந்து வைக்கப்பட்டிருக்கிறது
  rationale: κεράννυμι குறிக்கும் கலந்து ஆயத்தப்படுத்துதலையும் ἄκρατος குறிக்கும் நீர்க்கப்படாத முழு வலிமையையும், தமிழில் முரண்பாடாக ஒலிக்காமல் ஒன்றாகக் காக்கிறது.
- source_word: ἐν τῷ ποτηρίῳ τῆς ὀργῆς αὐτοῦ
  choice: அவருடைய கோபத்தின் கிண்ணத்தில்
  rationale: ἐν என்பதற்கு ‘கிண்ணத்தில்’ என்று நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது; ὀργή என்பதற்கு ‘கோபம்’ எனத் தேர்ந்தெடுத்து θυμός உடனான வேறுபாட்டைப் பேணுகிறது.
- source_word: βασανισθήσεται
  choice: வேதனைப்படுத்தப்படுவான்
  rationale: கடுமையான தண்டனைத் துயரைக் குறிக்கும் எதிர்காலச் செயப்பாட்டு வடிவத்தைத் தெளிவாகக் காக்கிறது.
- source_word: ἐν πυρὶ καὶ θείῳ
  choice: நெருப்பாலும் கந்தகத்தாலும்
  rationale: தண்டனை நிகழும் வழிமுறையை இயல்பான தமிழில் காட்டுகிறது; θείον என்பதற்கான தற்போதைய தெளிவான சொல் ‘கந்தகம்’.
- source_word: ἐνώπιον ἀγγέλων ἁγίων καὶ ἐνώπιον τοῦ ἀρνίου
  choice: பரிசுத்த தூதர்களின் முன்னிலையிலும் ஆட்டுக்குட்டியானவரின் முன்னிலையிலும்
  rationale: இருமுறை வரும் ἐνώπιον என்பதைக் காத்து வாக்கியத்தின் வலியுறுத்தலை வெளிப்படுத்துகிறது. ἀρνίον என்பது வெளிப்படுத்தின விசேஷத்தின் கிறிஸ்துவுக்குரிய பட்டமாக இருப்பதால் மரியாதை வடிவம் பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: θυμός மற்றும் ὀργή ஆகிய நெருங்கிய பொருளுடைய இரண்டு சொற்களின் வேறுபாடு
  choice: θυμός என்பதை ‘கடுஞ்சினம்’ என்றும் ὀργή என்பதை ‘கோபம்’ என்றும் மொழிபெயர்த்தல்
  alternative: இரண்டையும் ‘கோபம்’ அல்லது ‘சினம்’ என்று ஒரே சொல்லால் மொழிபெயர்த்தல்
  rationale: ஒரே வசனத்தில் மூலமொழி பயன்படுத்தும் இரு சொற்களையும் முற்றிலும் ஒன்றாக்காமல், தீர்ப்பின் தீவிரத்தையும் சொல் வேறுபாட்டையும் காக்கிறது.
- issue: κεκερασμένου ἀκράτου என்பதில் உள்ள ‘கலக்கப்பட்டும் நீர்க்கப்படாததும்’ என்ற பதற்றம்
  choice: ‘நீர்க்காமல் கலந்து வைக்கப்பட்டிருக்கிறது’ என்று முதன்மை உரையில் கூறுதல்
  alternative: ‘கலக்கப்பட்டும் கலக்கப்படாதது’ என்று சொற்சொல்லாக மொழிபெயர்த்தல்
  rationale: பண்டைய திராட்சரசம் ஆயத்தப்படுத்தப்பட்டாலும் நீரால் வலிமை குறைக்கப்படவில்லை என்பதே உருவகத்தின் மையம். தீர்ப்பின் முழு வலிமையை விளக்கவுரையாக விரிவுபடுத்தாமல் தமிழில் புரியவைக்கிறது.
- issue: ἀρνίον என்ற கிறிஸ்துவுக்குரிய உருவகப் பட்டம்
  choice: ‘ஆட்டுக்குட்டியானவர்’
  alternative: ‘ஆட்டுக்குட்டி’
  rationale: மூல உருவகத்தை அப்படியே காக்கும் போது, தமிழில் இது ஒருவரைக் குறிக்கும் பட்டம் என்பதையும் மரியாதையுடன் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் வெளிப்படுத்தின விசேஷத்தின் கண்ணியமான தீர்ப்பு மொழிநடையைப் பேணும் வகையிலும் வடிவமைக்கப்பட்டது. ‘கடுஞ்சினம்/கோபம்’ என்ற வேறுபாடு மூலத்தின் சொல் பதற்றத்தை காக்கிறது; ‘நீர்க்காமல் கலந்து’ என்பது பண்டைய திராட்சரச உருவகத்தை இயல்பான தமிழில் தருகிறது.
