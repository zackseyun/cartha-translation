id: REV.14.7
reference: Revelation 14:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγων ἐν φωνῇ μεγάλῃ· Φοβήθητε τὸν ⸀θεὸν καὶ δότε αὐτῷ δόξαν, ὅτι ἦλθεν ἡ ὥρα τῆς κρίσεως αὐτοῦ, καὶ προσκυνήσατε ⸂τῷ ποιήσαντι⸃ τὸν οὐρανὸν καὶ τὴν γῆν ⸀καὶ θάλασσαν καὶ πηγὰς ὑδάτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/007.yaml
  text: saying with a loud voice[a], “Fear God and give him glory, because the hour of his judgment has come[b], and worship the one who made heaven and earth and sea and springs of waters.”
translation:
  language: ta
  text: அவன் உரத்த குரலில், “கடவுளுக்குப் பயப்படுங்கள்[a]; அவருக்கு மகிமை செலுத்துங்கள். ஏனெனில், அவருடைய தீர்ப்பின் நேரம் வந்துவிட்டது. வானத்தையும் பூமியையும் கடலையும் நீரூற்றுகளையும்[b] படைத்தவரை வழிபடுங்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளைப் பயபக்தியுடன் போற்றுங்கள்.” கிரேக்க வினைச்சொல் நியாயத்தீர்ப்பை எதிர்கொள்ளும் அச்சத்தையும் மரியாதை கலந்த பயத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொற்படியாக, “நீர்களின் ஊற்றுகளையும்.” கிரேக்கத்தில் “நீர்கள்” என்பது பன்மையில் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων ἐν φωνῇ μεγάλῃ
  choice: அவன் உரத்த குரலில் ... என்றான்
  rationale: முந்தைய வசனத்துடன் தொடர்புடைய கிரேக்க நிகழ்காலப் பங்கேற்புச் சொல்லைத் தமிழில் இயல்பான தொடர்வாக்கியமாக்குகிறது; ἐν φωνῇ μεγάλῃ என்பதன் வலிமையை ‘உரத்த குரலில்’ தக்கவைக்கிறது.
- source_word: Φοβήθητε τὸν θεόν
  choice: கடவுளுக்குப் பயப்படுங்கள்
  rationale: நியாயத்தீர்ப்பு மற்றும் வழிபாட்டுச் சூழலில் உள்ள பயபக்தி–அச்சம் என்ற இரட்டை நுணுக்கத்தையும் ‘பயப்படுங்கள்’ தக்கவைக்கிறது; ‘மதியுங்கள்’ என்பது அதன் தீவிரத்தைக் குறைத்துவிடும்.
- source_word: δότε αὐτῷ δόξαν
  choice: அவருக்கு மகிமை செலுத்துங்கள்
  rationale: δόξα என்பதன் வேதாகமச் சொல்லாட்சியைத் தக்கவைத்து, தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைகிறது.
- source_word: ὅτι ἦλθεν ἡ ὥρα τῆς κρίσεως αὐτοῦ
  choice: ஏனெனில், அவருடைய தீர்ப்பின் நேரம் வந்துவிட்டது
  rationale: ὅτι-யின் காரணப் பொருளையும் ὥρα-வின் உடனடி கால உணர்வையும் வெளிப்படுத்துகிறது. ‘அவருடைய தீர்ப்பு’ என்பது கிரேக்க உரையின் சுருக்கத்தையும் நியாயத்தீர்ப்பு அவருக்குரியது/அவரிடமிருந்து வருவது என்ற பரப்பையும் தக்கவைக்கிறது.
- source_word: προσκυνήσατε τῷ ποιήσαντι
  choice: படைத்தவரை வழிபடுங்கள்
  rationale: προσκυνέω இங்கு மதவழிபாட்டைக் குறிக்கிறது; substantival participle-இன் செயற்பொருளை ‘படைத்தவர்’ நேரடியாக வெளிப்படுத்துகிறது.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν καὶ θάλασσαν καὶ πηγὰς ὑδάτων
  choice: வானத்தையும் பூமியையும் கடலையும் நீரூற்றுகளையும்
  rationale: படைப்புப் பட்டியலின் ஒத்திசைவையும் மீளும் இணைப்புகளையும் தக்கவைக்கிறது. ‘நீரூற்றுகள்’ நவீன தமிழில் இயல்பாக உள்ளது; கிரேக்கத்தின் சொற்படியான பன்மை அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: Φοβήθητε τὸν θεόν என்ற கட்டளையின் தன்மை
  choice: கடவுளுக்குப் பயப்படுங்கள்
  alternative: கடவுளைப் பயபக்தியுடன் போற்றுங்கள்
  rationale: வரவிருக்கும் தீர்ப்பின் சூழலில் இந்தச் சொல் பயபக்தியையும் அச்சத்தையும் உள்ளடக்கலாம். ‘பயப்படுங்கள்’ அந்த இறையியல் அழுத்தத்தைத் தணிக்காமல் தக்கவைக்கிறது; அடிக்குறிப்பு மரியாதை கலந்த பயம் என்ற நுணுக்கத்தைக் குறிப்பிடுகிறது.
- issue: τῆς κρίσεως αὐτοῦ என்ற தொடர்பின் பொருள்
  choice: அவருடைய தீர்ப்பின் நேரம்
  alternative: அவர் தீர்ப்பளிக்கும் நேரம்
  rationale: மாற்று வாசகம் இறைவனைத் தீர்ப்பளிப்பவராக வெளிப்படையாக அடையாளப்படுத்தும். முதன்மை வாசகம் கிரேக்க உடைமை வேற்றுமையின் சுருக்கத்தையும் அதன் இயல்பான இறையியல் பரப்பையும் தேவையின்றி விரித்துரைக்காமல் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாக வாசிக்கப்படும், அதேவேளையில் வெளிப்படுத்தின விசேஷத்தின் உயர்ந்த அறிவிப்பு நடையைத் தக்கவைக்கும் சொற்கள் தேர்ந்தெடுக்கப்பட்டன. இறைவனைக் குறிக்கும் பிரதிப்பெயர்களில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டது. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறிகள் இடமாற்றமாக இருந்ததால், அவை தொடர்புடைய சொற்களான ‘பயப்படுங்கள்’ மற்றும் ‘நீரூற்றுகளையும்’ என்பவற்றின் பின்னர் சரியாக வைக்கப்பட்டன.
