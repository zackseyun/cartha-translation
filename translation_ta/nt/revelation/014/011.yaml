id: REV.14.11
reference: Revelation 14:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὁ καπνὸς τοῦ βασανισμοῦ αὐτῶν εἰς αἰῶνας αἰώνων ἀναβαίνει, καὶ οὐκ ἔχουσιν ἀνάπαυσιν ἡμέρας καὶ νυκτός, οἱ προσκυνοῦντες τὸ θηρίον καὶ τὴν εἰκόνα αὐτοῦ, καὶ εἴ τις λαμβάνει τὸ χάραγμα τοῦ ὀνόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/011.yaml
  text: And the smoke of their torment goes up forever and ever[a], and they have no rest day and night, those who worship the beast and its image[b], and whoever receives the mark of its name.
translation:
  language: ta
  text: அவர்களுடைய வேதனையின் புகை என்றென்றைக்கும்[a] மேலெழும்புகிறது; மிருகத்தையும் அதன் உருவத்தையும் வழிபடுகிறவர்களுக்கும், அதன் பெயரின் முத்திரையை யாராவது பெற்றுக்கொண்டால் அவருக்கும்,[b] இரவும் பகலும் ஓய்வு இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “யுகங்களின் யுகங்களுக்கும்.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்க உரை, “மிருகத்தையும் அதன் உருவத்தையும் வழிபடுகிறவர்கள்” என்ற பன்மை அமைப்பிலிருந்து, “அதன் பெயரின் முத்திரையை யாராவது பெற்றுக்கொண்டால்” என்ற ஒருமை நிபந்தனை அமைப்புக்கு திடீரென மாறுகிறது. இது தீர்ப்புக்குள்ளானவர்களை மேலும் விவரிப்பதாகத் தெரிகிறது; சில மொழிபெயர்ப்புகள் இதை “முத்திரையைப் பெற்றுக்கொள்கிறவர்களுக்கும்” என்று சீராக்குகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: καπνὸς
  choice: புகை
  rationale: தீர்ப்பின் காட்சிப்படிமத்தை விரிவாக்கமின்றி நேரடியாகக் காக்கும் இயல்பான தமிழ் சொல்.
- source_word: βασανισμοῦ
  choice: வேதனை
  rationale: தண்டனை சார்ந்த கடும் துன்பத்தைச் சுட்டுகிறது; துன்புறுத்தும் முறையைத் தேவையின்றி குறிப்பாக்குவதில்லை.
- source_word: εἰς αἰῶνας αἰώνων
  choice: என்றென்றைக்கும்
  rationale: வெளிப்படுத்தலில் வரும் வலுவான தொடர்ச்சிக் காலச் சொற்றொடரின் இயல்பான தமிழ் இணை; சொற்சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀναβαίνει
  choice: மேலெழும்புகிறது
  rationale: புகை தொடர்ந்து மேலே எழும் நிகழ்காலக் காட்சியையும் வினையின் திசையையும் காக்கிறது.
- source_word: ἀνάπαυσιν
  choice: ஓய்வு
  rationale: மூலச்சொல்லின் நேரடியான பொருளைக் காக்கிறது; ‘நிவாரணம்’ என்று விளக்கமாக மாற்றவில்லை.
- source_word: ἡμέρας καὶ νυκτός
  choice: இரவும் பகலும்
  rationale: இடைவிடாத காலத்தைக் குறிக்கும் இயல்பான தமிழ் மரபுத்தொடர்.
- source_word: προσκυνοῦντες
  choice: வழிபடுகிறவர்கள்
  rationale: இச்சூழலில் மிருகத்திற்குச் செலுத்தப்படும் மதச்சார்ந்த வணக்கத்தையும் விசுவாசப் பற்றையும் தெளிவாகக் காட்டுகிறது.
- source_word: θηρίον
  choice: மிருகம்
  rationale: வெளிப்படுத்தல் நூலின் அபோகலிப்டிக் உருவகத்திற்கான நிலையான, நேரடியான மொழிபெயர்ப்பு.
- source_word: εἰκόνα
  choice: உருவம்
  rationale: சிலை என்று தேவையின்றி குறிப்பாக்காமல், பிரதிநிதித்துவ உருவம் என்ற பரந்த பொருளைக் காக்கிறது.
- source_word: εἴ τις λαμβάνει
  choice: யாராவது பெற்றுக்கொண்டால்
  rationale: பன்மை பங்கேற்பு வடிவத்திலிருந்து ஒருமை நிபந்தனை வடிவத்துக்கு மாறும் கிரேக்கத்தின் திடீர் தொடரமைப்பைக் காக்கிறது.
- source_word: χάραγμα
  choice: முத்திரை
  rationale: வெளிப்படுத்தலில் அடையாளமிடும் குறிக்கான நிலையான தமிழ் சொல்.
- source_word: τοῦ ὀνόματος αὐτοῦ
  choice: அதன் பெயரின்
  rationale: உரிமை வேற்றுமையை நேரடியாகக் காக்கிறது; ‘அதன் பெயரைத் தாங்கிய’ என விளக்கமாக விரிவாக்கவில்லை.
theological_decisions:
- issue: εἰς αἰῶνας αἰώνων கூறும் தீர்ப்பின் காலநீட்சி
  choice: என்றென்றைக்கும்
  alternative: யுகங்களின் யுகங்களுக்கும்
  rationale: வெளிப்படுத்தலில் இச்சொற்றொடர் கொண்டுள்ள மிக வலுவான தொடர்ச்சிக் காலப் பொருளை முதன்மை உரை காக்கிறது; சொற்சொல் அமைப்பு அடிக்குறிப்பில் தரப்படுவதால் மூலத்தின் வடிவமும் மறைக்கப்படவில்லை.
- issue: இறுதிக் கூறின் தொடர்பும் தொடரமைப்பும்
  choice: ‘வழிபடுகிறவர்களுக்கும், ... யாராவது பெற்றுக்கொண்டால் அவருக்கும்’ என்று பன்மையிலிருந்து ஒருமை நிபந்தனைக்கு மாறும் அமைப்பைக் காத்தல்
  alternative: ‘முத்திரையைப் பெற்றுக்கொள்கிறவர்களுக்கும்’ என்று ஒரே இலக்கண வடிவில் சீராக்குதல்
  rationale: கிரேக்கம் οἱ προσκυνοῦντες என்பதிலிருந்து εἴ τις λαμβάνει எனத் திடீரென மாறுகிறது. தமிழ் வாசிக்கத்தக்கதாக இருந்தாலும் அந்த மாறுதலை முற்றிலும் சீராக்காமல் வைத்துள்ளது; இதனால் இறுதிக் கூறின் துல்லியமான தொடரியல் உறவு தீர்மானிக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘என்றென்றைக்கும்’, ‘மிருகம்’, ‘உருவம்’, ‘முத்திரை’ ஆகிய பரிச்சயமான வேதாகமச் சொற்கள் காக்கப்பட்டுள்ளன. நீண்ட வாக்கியத்தின் தீர்ப்புக் கூறையும் இறுதி நிபந்தனைக் கூறையும் தெளிவுபடுத்த அரைப்புள்ளியும் நீள்கோடும் பயன்படுத்தப்பட்டுள்ளன; ஆனால் கிரேக்கத்தின் இலக்கணத் திடீர் மாற்றம் அழிக்கப்படவில்லை.
