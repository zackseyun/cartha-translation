id: REV.14.12
reference: Revelation 14:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Ὧδε ἡ ὑπομονὴ τῶν ἁγίων ἐστίν, οἱ τηροῦντες τὰς ἐντολὰς τοῦ θεοῦ καὶ τὴν πίστιν Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/012.yaml
  text: Here is the endurance of the saints[a], those who keep the commandments of God and the faith of Jesus.
translation:
  language: ta
  text: இங்கே தேவனுடைய கட்டளைகளையும் இயேசுவின் விசுவாசத்தையும்[a] கைக்கொள்கிற பரிசுத்தவான்களின் நிலைத்திருக்கும் பொறுமை உள்ளது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இயேசுவின் மேல் விசுவாசம்”; வேறொரு சாத்தியம், “இயேசுவின் விசுவாசத்தன்மை.” கிரேக்கத் தொடர் ஒன்றுக்கு மேற்பட்ட பொருள் கொள்ளத்தக்கது.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὧδε
  choice: இங்கே
  rationale: முன்னர் விவரிக்கப்பட்ட சூழலைச் சுட்டும் இடச்சுட்டு வினையடை; கிரேக்கத்தின் சொல்லாட்சிச் செறிவை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: ὑπομονὴ
  choice: நிலைத்த பொறுமை
  rationale: சோதனையின் கீழும் தளராமல் நிலைத்திருப்பதைச் சுட்டுகிறது. ‘பொறுமை’ மட்டும் தரக்கூடிய செயலற்ற காத்திருப்பு என்ற எண்ணத்தை ‘நிலைத்த’ தெளிவுபடுத்துகிறது.
- source_word: ἁγίων
  choice: பரிசுத்தவான்கள்
  rationale: தேவனுக்கெனப் பிரித்தெடுக்கப்பட்ட மக்களைக் குறிக்கும் புதிய ஏற்பாட்டின் வழக்கமான பதம்; தமிழ்க் கிறிஸ்தவச் சொல்லாட்சியில் பரவலாக அறியப்பட்டது.
- source_word: τηροῦντες
  choice: கைக்கொள்கிறவர்கள்
  rationale: கட்டளைகளை வெறுமனே அறிதல் அல்லது பாதுகாத்தல் அல்லாமல், அவற்றை உண்மையுடன் கடைப்பிடித்தல் என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: ἐντολὰς
  choice: கட்டளைகள்
  rationale: தேவன் அளிக்கும் அதிகாரமிக்க ஆணைகளைக் குறிக்கும் நேரான, தெளிவான தமிழ்ச் சொல்.
- source_word: πίστιν
  choice: விசுவாசம்
  rationale: πίστις என்பதற்கான அடிப்படை வேதாகமத் தமிழ்ப் பதம். ‘உண்மைத்தன்மை’ என்று பொருளை முன்கூட்டியே முடிவுசெய்யாமல் ambiguity-ஐத் தக்கவைக்கிறது.
- source_word: Ἰησοῦ
  choice: இயேசுவின்
  rationale: கிரேக்க உருபுடைமை வேற்றுமையை நேரடியாகப் பிரதிபலிக்கிறது. இது ‘இயேசுவின்மேல் விசுவாசம்’ அல்லது ‘இயேசுவின் உண்மைத்தன்மை’ என்ற இரு சாத்தியங்களையும் பிரதான உரையில் முடிவுசெய்யாமல் விடுகிறது.
theological_decisions:
- issue: τὴν πίστιν Ἰησοῦ என்பதன் பொருள்
  choice: இயேசுவின் விசுவாசம்
  alternative: இயேசுவின்மேல் விசுவாசம்; இயேசுவின் உண்மைத்தன்மை
  rationale: πίστις + Ἰησοῦ என்ற உருபுடைமைத் தொடர், இயேசுவை நோக்கிய விசுவாசத்தையோ இயேசுவுக்குரிய விசுவாசம்/உண்மைத்தன்மையையோ குறிக்கலாம். பிரதான உரை கிரேக்க அமைப்புக்கு நெருக்கமாக இருந்து இந்த இறையியல் பதற்றத்தைத் தக்கவைக்கிறது; விளக்கமான வாசிப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பேணுகிறது. கிரேக்கத்தின் appositional அமைப்பை தமிழில் தெளிவாக்க அரைப்புள்ளிக்குப் பின் ‘அவர்கள் ... கைக்கொள்கிறவர்கள்’ என வழங்கப்பட்டுள்ளது. ‘காணப்படுகிறது’ என்பது கிரேக்கத்தின் இயல்பற்ற நேரடி இருப்புவாக்கியத்தை தமிழில் இயல்பாகத் தருகிறது; புதிய கட்டாயம் அல்லது காரணப்பொருள் சேர்க்கப்படவில்லை.
