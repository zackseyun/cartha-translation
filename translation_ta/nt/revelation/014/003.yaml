id: REV.14.3
reference: Revelation 14:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν ⸀ὡς ᾠδὴν καινὴν ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τῶν τεσσάρων ζῴων καὶ τῶν πρεσβυτέρων· καὶ οὐδεὶς ἐδύνατο μαθεῖν τὴν ᾠδὴν εἰ μὴ αἱ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες, οἱ ἠγορασμένοι ἀπὸ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/003.yaml
  text: And they are singing what seemed to be a new song before the throne and before the four living creatures and the elders[a]. And no one was able to learn the song except the one hundred forty-four thousand[b], those who had been purchased from the earth.
translation:
  language: ta
  text: அவர்கள் அரியணையின் முன்பாகவும், நான்கு உயிரினங்களின் முன்பாகவும், மூப்பர்களின் முன்பாகவும் புதிய பாடல் ஒன்றைப் போலப் பாடிக்கொண்டிருக்கிறார்கள்.[a] பூமியிலிருந்து வாங்கப்பட்டவர்களான அந்த நூற்று நாற்பத்து நான்கு ஆயிரம் பேரைத் தவிர, வேறு யாராலும் அந்தப் பாடலைக் கற்றுக்கொள்ள முடியவில்லை.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு புதிய பாடலாக” / “ஒரு புதிய பாடலைப் போல.” கிரேக்க மூலவாக்கியம் வெளிப்படுத்தல் தரிசனங்களில் பொதுவாகக் காணப்படும் தோற்றம் அல்லது ஒப்புமையைக் குறிக்கும் சொல்லைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பூமியிலிருந்து மீட்கப்பட்டவர்கள்.” கிரேக்க வினைச்சொல்லின் நேரடிப் பொருள் “வாங்கப்பட்டவர்கள்” என்பதாகும்.
    reason: alternative_reading
lexical_decisions:
- source_word: ᾄδουσιν
  choice: பாடிக்கொண்டிருந்தார்கள்
  rationale: நிகழ்கால வினை வடிவம் வெளிப்படுத்தும் தரிசனக் காட்சியின் உயிரோட்டத்தை, இயல்பான தமிழ் கதைநடையில் தொடர்நிலை இறந்தகாலமாகக் காட்டுகிறது.
- source_word: ὡς ᾠδὴν καινὴν
  choice: புதிய பாடல் போலத் தோன்றிய ஒன்றை
  rationale: ὡς என்பதிலுள்ள காட்சித் தோற்றம் அல்லது ஒப்புமை சார்ந்த நுணுக்கத்தைப் பாதுகாக்கிறது; அது உண்மையில் புதிய பாடல் அல்ல என்று தீர்மானிப்பதில்லை.
- source_word: ἐνώπιον
  choice: முன்பாக
  rationale: அரியணையிலும் பரலோக உயிர்களிலும் முன்னிலையில் இருப்பதைக் குறிக்கும் இயல்பான, மரியாதையான தமிழ் சொல்.
- source_word: τῶν τεσσάρων ζῴων
  choice: நான்கு உயிரினங்கள்
  rationale: வெளிப்படுத்தலில் அரியணையைச் சூழ்ந்திருக்கும் உயிருள்ள பரலோகப் படைப்புகளைக் குறிக்கிறது; ‘மிருகங்கள்’ என்ற தவறான கருத்தைத் தவிர்க்கிறது.
- source_word: τῶν πρεσβυτέρων
  choice: மூப்பர்கள்
  rationale: பரலோக மன்றத்திலுள்ள அடையாளம் காணப்பட்ட குழுவுக்கான இயல்பான தமிழ் பதம்.
- source_word: οὐδεὶς ἐδύνατο μαθεῖν
  choice: வேறு யாராலும் ... கற்றுக்கொள்ள முடியவில்லை
  rationale: திறனின்மையைக் குறிக்கும் கிரேக்க அமைப்பை இயல்பான தமிழ் வாக்கியமாகப் பாதுகாக்கிறது.
- source_word: αἱ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: அந்த நூற்று நாற்பத்து நான்காயிரம் பேர்
  rationale: எண்ணையும் குறிப்பிட்ட குழுவைக் காட்டும் சுட்டுத்தன்மையையும் தெளிவான தமிழ் வடிவில் தருகிறது.
- source_word: οἱ ἠγορασμένοι ἀπὸ τῆς γῆς
  choice: பூமியிலிருந்து விலைகொடுத்து வாங்கப்பட்டவர்கள்
  rationale: ἀγοράζω என்பதன் வாங்குதல் சார்ந்த உருவகத்தை நேரடியாகப் பாதுகாக்கிறது; ‘மீட்கப்பட்டவர்கள்’ என்ற விளக்கமான இறையியல் சொல்லை முதன்மை உரையில் சேர்ப்பதில்லை.
theological_decisions:
- issue: தரிசன விவரிப்பில் ὡς என்பதன் வலிமை
  choice: புதிய பாடல் போலத் தோன்றிய ஒன்று
  alternative: புதிய பாடலாக / புதிய பாடலைப் போல
  rationale: தரிசனத்தில் உணரப்பட்ட தோற்றத்தை வெளிப்படுத்துகிறது; பாடல் உண்மையில் புதியதா இல்லையா என்பதைத் தேவையின்றித் தீர்மானிப்பதில்லை.
- issue: ἠγορασμένοι என்பதன் மொழிபெயர்ப்பு
  choice: விலைகொடுத்து வாங்கப்பட்டவர்கள்
  alternative: மீட்கப்பட்டவர்கள்
  rationale: மூலத்தில் உள்ள சந்தை சார்ந்த உருவகத்தை முதன்மை உரையில் வைத்திருக்கிறது; தொடர்புடைய இறையியல் பொருளை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடை. தரிசனக் காட்சியின் உயிரோட்டத்தையும் மூலத்தின் உருவக மொழியையும் காக்கிறது; தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
