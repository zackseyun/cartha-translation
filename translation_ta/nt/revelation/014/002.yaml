source:
  edition: SBLGNT
  text: καὶ ἤκουσα φωνὴν ἐκ τοῦ οὐρανοῦ ὡς φωνὴν ὑδάτων πολλῶν καὶ ὡς φωνὴν βροντῆς μεγάλης, καὶ ἡ φωνὴ ἣν ἤκουσα ὡς κιθαρῳδῶν κιθαριζόντων ἐν ταῖς κιθάραις αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/002.yaml
  text: And I heard a sound from heaven like the sound of many waters and like the sound of loud thunder[c][b][a], and the sound that I heard was like harpists playing on their harps.
translation:
  language: ta
  text: பரலோகத்திலிருந்து ஒரு ஒலியைக்[a] கேட்டேன். அது திரளான நீரின் முழக்கத்தைப்[b] போலவும், பெரும் இடிமுழக்கத்தைப் போலவும் இருந்தது. நான் கேட்ட அந்த ஒலி, யாழிசைப்பவர்கள் தங்கள் யாழ்களை[c] மீட்டும் ஒலியைப் போல இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஒலி’ என்பதற்குப் பதிலாக ‘குரல்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்க φωνή என்ற சொல் சூழலுக்கேற்ப இரண்டையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘திரளான நீர்’ என்பது மிகப் பெரிய, வல்லமையான முழக்கத்துக்கான வேதாகமப் படிமம்; எசேக்கியேல் 43:2-ஐ ஒப்பிடுக.
    reason: cross_reference
  - marker: c
    text: இங்குள்ள கிரேக்க κιθάρα என்பது பண்டைய நரம்பிசைக் கருவி; அது நவீன ‘ஹார்ப்’ கருவியைவிட ‘லைர்’ வகைக்கு நெருக்கமானது. இங்கு ‘யாழ்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: cultural_note
lexical_decisions:
- source_word: φωνή
  choice: ஒலி
  rationale: நீர், இடி, இசைக்கருவி ஆகியவற்றின் ஒலிகளோடு ஒப்பிடப்படுவதால், பேசும் நபரைக் குறிப்பதாகத் தீர்மானிக்காமல் இங்குள்ள கேள்விப்புல நிகழ்வை இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: பரலோகத்திலிருந்து
  rationale: வெளிப்படுத்தலில் οὐρανός பொதுவாக வெறும் வானத்தை அல்ல, பரலோக மண்டலத்தைக் குறிக்கிறது.
- source_word: ὡς
  choice: போல
  rationale: வசனத்தில் தொடர்ந்து வரும் உவமைகளை நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: ὑδάτων πολλῶν
  choice: திரளான நீர்
  rationale: பல அல்லது பெருந்திரளான நீரைக் குறிக்கும் மூலமொழிப் படிமத்தையும் அதன் வேதாகமத் தொடர்பையும் பாதுகாக்கிறது; குறிப்பிட்ட வகை நீரோட்டத்தைச் சேர்ப்பதில்லை.
- source_word: βροντῆς μεγάλης
  choice: பெரும் இடிமுழக்கம்
  rationale: μέγας தெரிவிக்கும் வலிமையையும் தீவிரத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: κιθαρῳδῶν
  choice: யாழ் இசைப்பவர்கள்
  rationale: κιθάρα என்னும் நரம்பிசைக் கருவியை இசைப்பவர்களைத் தெளிவாகவும் சுருக்கமாகவும் குறிக்கிறது; பாடுகிறார்கள் என்று சூழல் கூறாததால் அதைச் சேர்க்கவில்லை.
- source_word: κιθαριζόντων
  choice: இசைக்கும்
  rationale: இசைக்கருவியை வாசிக்கும் செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐν ταῖς κιθάραις αὐτῶν
  choice: தங்கள் யாழ்களை
  rationale: பண்டைய நரம்பிசைக் கருவியான κιத்தாராவுக்கு தமிழில் அறியப்பட்ட, சுருக்கமான இணையாக ‘யாழ்’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: பரலோகத்திலிருந்து கேட்டதன் இயல்பு
  choice: φωνή என்பதை வசனம் முழுவதும் ‘ஒலி’ என்று மொழிபெயர்த்தல்
  alternative: ‘குரல்’ என்று மொழிபெயர்த்தல் அல்லது ‘குரல்’, ‘ஒலி’ என்று மாறிமாறிப் பயன்படுத்துதல்
  rationale: மூலச்சொல் குரலையும் ஒலியையும் குறிக்கக்கூடும். இங்கு நீர், இடி, கருவியிசை ஆகியவற்றோடு ஒப்பிடப்படுவதால் ‘ஒலி’ பொருத்தமாக உள்ளது; அதேவேளையில் பேசும் தனிப்பட்ட ஒருவரை உரை குறிப்பிடுகிறது என்ற கருத்தைச் சேர்க்காமல் இருக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் மூன்று ஒலி ஒப்பீடுகளும் தக்கவைக்கப்பட்டுள்ளன; நீரின் படிமம் விளக்கவுரையாக மாற்றப்படவில்லை. ‘யாழ் இசைப்பவர்கள்’ மற்றும் ‘யாழ்களை இசைக்கும்’ என்ற சொற்கள் தமிழில் புரியும்படி அமைக்கப்பட்டாலும், கருவியின் துல்லியமான வரலாற்று வடிவம் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
