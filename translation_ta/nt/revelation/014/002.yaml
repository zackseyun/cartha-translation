    issue: Repetitive and somewhat unnatural wording for the string-instrument players and their action.
    rationale: ‘யாழ் இசைப்பவர்கள் தங்கள் யாழ்களை இசைக்கும்’ repeats the same root and is less fluent than the conventional ‘யாழிசைப்பவர்கள் தங்கள் யாழ்களை மீட்டும்,’ without altering the Greek sense.
