id: REV.14.20
reference: Revelation 14:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐπατήθη ἡ ληνὸς ἔξωθεν τῆς πόλεως, καὶ ἐξῆλθεν αἷμα ἐκ τῆς ληνοῦ ἄχρι τῶν χαλινῶν τῶν ἵππων ἀπὸ σταδίων χιλίων ἑξακοσίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/020.yaml
  text: And the winepress was trodden outside the city[b][a], and blood came out from the winepress up to the horses’ bridles for one thousand six hundred stadia.
translation:
  language: ta
  text: நகரத்திற்கு வெளியே திராட்சை மிதிக்கும் தொட்டி மிதிக்கப்பட்டது; அந்தத் தொட்டியிலிருந்து இரத்தம் வெளியே வந்து[b], குதிரைகளின் கடிவாளங்கள் வரை ஆயிரத்து அறுநூறு ஸ்தாதிய தூரத்துக்குப் பரவியது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஸ்தாதியம் என்பது பண்டைக்காலத் தூர அளவு. ஆயிரத்து அறுநூறு ஸ்தாதியம் என்பது ஏறக்குறைய 296 கிலோமீட்டர்.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘அந்தத் தொட்டியிலிருந்து இரத்தம் பாய்ந்தது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπατήθη
  choice: மிதிக்கப்பட்டது
  rationale: πατέω என்பதன் இறந்தகாலச் செயப்பாட்டு வடிவம். திராட்சைத் தொட்டியில் காலால் மிதிக்கும் காட்சியையும் மூலத்தின் செயப்பாட்டு அமைப்பையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ληνός / ληνοῦ
  choice: திராட்சை மிதிக்கும் தொட்டி / தொட்டி
  rationale: மது தயாரிப்பதற்காகத் திராட்சையை மிதித்துப் பிழியும் தொட்டியைக் குறிக்கிறது. ‘திராட்சை ஆலை’ என்ற இயந்திரமயமான எண்ணத்தைத் தவிர்த்து, வெளிப்படுத்தின விசேஷத்தின் அறுவடை–நியாயத்தீர்ப்புக் காட்சியைத் தெளிவாக வைத்திருக்கிறது.
- source_word: ἔξωθεν τῆς πόλεως
  choice: நகரத்திற்கு வெளியே
  rationale: இடத்தைக் குறிக்கும் கிரேக்கச் சொற்றொடரின் இயல்பான, நேரடியான தமிழ் வடிவம்.
- source_word: ἐξῆλθεν αἷμα
  choice: இரத்தம் வெளியே வந்து
  rationale: ἐξέρχομαι என்பதன் அடிப்படைப் பொருளான ‘வெளியே வருதல்’ என்பதைப் பாதுகாக்கிறது. சூழலுக்கேற்ற ‘பாய்ந்தது’ என்ற விளக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἄχρι τῶν χαλινῶν τῶν ἵππων
  choice: குதிரைகளின் கடிவாளங்கள் வரை உயர்ந்து
  rationale: இரத்தத்தின் செங்குத்தான அளவைத் தமிழில் தெளிவாக உணர்த்துகிறது. ‘உயர்ந்து’ என்பது காட்சியின் இயல்பான தொடர்பை வெளிப்படுத்தினாலும், கடிவாளங்கள் வரையிலான எல்லையை மாற்றுவதில்லை.
- source_word: ἀπὸ σταδίων χιλίων ἑξακοσίων
  choice: ஆயிரத்து அறுநூறு ஸ்தாதிய தூரத்திற்குப் பரவியது
  rationale: கிரேக்கத்தில் உள்ள பண்டைய அளவைக் காக்கிறது; ἀπό உடன் வரும் தூர அளவை இயல்பான தமிழில் பரவலின் தொலைவாக வெளிப்படுத்துகிறது. நவீன அளவு அடிக்குறிப்பில் மட்டும் தரப்படுகிறது.
theological_decisions:
- issue: இரத்தம், குதிரைகளின் கடிவாளங்கள், நீண்ட தூரம் ஆகியவற்றை மிகைப்படுத்தப்பட்ட வெளிப்படுத்தல் குறியீடாக விளக்க வேண்டுமா?
  choice: உரையின் தெளிவான, அதிர்ச்சியூட்டும் நியாயத்தீர்ப்புக் காட்சியை அப்படியே தக்கவைத்தல்
  alternative: ‘மிகப்பெரிய நியாயத்தீர்ப்பு ஏற்பட்டது’ என்று குறியீட்டின் பொருளை விளக்கிப் பொழிப்புரை செய்தல்
  rationale: மூலம் காட்சியின் குறியீட்டு அர்த்தத்தைத் தானாக விளக்கவில்லை. ஆகவே அதன் வெளிப்படுத்தல் இலக்கியத் தீவிரத்தையும் இறையியல் பதற்றத்தையும் மொழிபெயர்ப்பு தீர்மானித்து விடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஆனால் வெளிப்படுத்தல் நூலுக்கேற்ற கண்ணியமும் தீவிரமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘திராட்சை மிதிக்கும் தொட்டி’ பொதுவாசகர்களுக்குக் காட்சியைத் தெளிவாக்குகிறது; இரண்டாவது குறிப்பில் ‘அந்தத் தொட்டி’ எனச் சுருக்கி இயல்பான ஓட்டம் காக்கப்பட்டுள்ளது.
