source:
  edition: SBLGNT
  text: Καὶ ἄλλος ἄγγελος ἐξῆλθεν ἐκ τοῦ ναοῦ τοῦ ἐν τῷ οὐρανῷ, ἔχων καὶ αὐτὸς δρέπανον ὀξύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/017.yaml
  text: And another angel came out from the temple in heaven[a], also having a sharp sickle.
translation:
  language: ta
  text: பின்பு, மற்றொரு தூதர் பரலோகத்திலுள்ள ஆலயத்திலிருந்து[a] வெளியே வந்தார்; அவரிடமும் கூர்மையான அரிவாள் இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பரலோகத்திலுள்ள உட்பரிசுத்த இடத்திலிருந்து.’ கிரேக்கச் சொல் ஆலயத்தின் உட்பகுதியான பரிசுத்த இடத்தைக் குறிப்பாகக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: வேறொரு தூதர்
  rationale: ἄλλος என்பது இங்கு தொடரில் வரும் அதே வகையைச் சேர்ந்த இன்னொருவரைக் குறிக்கிறது. ‘வேறொரு தூதர்’ என்பது இயல்பான தமிழில் அந்தத் தொடர்ச்சியைத் தெளிவாகக் காட்டுகிறது.
- source_word: ἐξῆλθεν
  choice: வெளியே வந்தார்
  rationale: ἐξέρχομαι என்பதன் இறந்தகால வடிவம், உள்ளிருந்து புறப்படுவதைச் சுட்டுகிறது. ‘வெளியே வந்தார்’ இயக்கத்தின் திசையையும் இயல்பான தமிழ் நடையையும் காக்கிறது.
- source_word: ναοῦ
  choice: ஆலயம்
  rationale: ναός பொதுவாக ஆலயத்தை, மேலும் குறிப்பாக அதன் பரிசுத்த உட்பகுதியைக் குறிக்கக்கூடும். முதன்மை உரையில் வாசிக்க எளிய ‘ஆலயம்’ வைக்கப்பட்டு, ‘பரிசுத்த இடம்’ என்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τοῦ ἐν τῷ οὐρανῷ
  choice: பரலோகத்திலுள்ள
  rationale: இந்த அடைமொழித் தொடர் ஆலயம் பரலோகத்தில் இருப்பதாக அடையாளப்படுத்துகிறது. ‘பரலோகத்திலுள்ள’ என்பது சுருக்கமாகவும் துல்லியமாகவும் உள்ளது.
- source_word: ἔχων καὶ αὐτὸς
  choice: அவரிடமும் ... இருந்தது
  rationale: καὶ αὐτός, முந்தைய உருவத்தைப் போல இந்தத் தூதரிடமும் அரிவாள் இருந்ததை வலியுறுத்துகிறது. ‘அவரிடமும்’ அந்த ஒப்பீட்டு வலியுறுத்தலை இயல்பான தமிழில் காக்கிறது.
- source_word: δρέπανον
  choice: அரிவாள்
  rationale: δρέπανον அறுவடைக்குப் பயன்படுத்தப்படும் வளைந்த வெட்டுக் கருவியைக் குறிக்கிறது. ‘அரிவாள்’ தமிழில் தெளிவான, வழக்கமான இணைச்சொல்.
- source_word: ὀξύ
  choice: கூர்மையான
  rationale: ὀξύ அரிவாளின் கூர்மையை விவரிக்கிறது. ‘கூர்மையான’ நேரடியானதும் படிமத்தைத் தெளிவாகக் காப்பதும் ஆகும்.
theological_decisions:
- issue: பரலோக ஆலயப் படிமத்தின் இயல்பு
  choice: ναός என்பதை விளக்க விரிவாக்கமின்றி ‘ஆலயம்’ என்று மொழிபெயர்த்தல்.
  alternative: உட்பரிசுத்த இடத்தை வலியுறுத்த ‘பரிசுத்த இடம்’ என்று மொழிபெயர்த்தல்; அல்லது அதை அடையாளக் குறியீடான பரலோக வாசஸ்தலமாக விளக்கிப் பொழிப்புரை செய்தல்.
  rationale: வசனம் பரலோக ஆலயத்தை வெளிப்படுத்தல் இலக்கியப் படிமமாக முன்வைக்கிறது. அது கட்டடவியல், அடையாளம், அல்லது வழிபாட்டுச் சார்ந்த குறிப்பு என்பதைக் மொழிபெயர்ப்பு தீர்மானிக்காமல், மூலத்தின் இறையியல் திறந்தநிலையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கப் பங்கேற்புத் தொடரை தமிழில் இயல்பாக அமைக்க அரைப்புள்ளியால் இணைக்கப்பட்ட உடைமை வாக்கியமாக வழங்கியுள்ளோம்; ‘அவரிடமும்’ என்பதன் மூலம் καὶ αὐτός தரும் ஒப்பீட்டு வலியுறுத்தல் பாதுகாக்கப்பட்டுள்ளது.
