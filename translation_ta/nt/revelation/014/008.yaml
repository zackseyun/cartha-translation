id: REV.14.8
reference: Revelation 14:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ⸂δεύτερος ἄγγελος⸃ ἠκολούθησεν λέγων· Ἔπεσεν, ⸀ἔπεσεν Βαβυλὼν ἡ μεγάλη, ⸀ἣ ἐκ τοῦ οἴνου τοῦ θυμοῦ τῆς πορνείας αὐτῆς πεπότικεν πάντα τὰ ἔθνη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/008.yaml
  text: And another[a], a second angel, followed, saying, “Fallen, fallen is Babylon the great[c][b], she who has made all the nations drink from the wine of the passion of her sexual immorality.”
translation:
  language: ta
  text: வேறொரு தூதன்—இரண்டாம் தூதன்—பின்தொடர்ந்து வந்து, “விழுந்தாள், விழுந்தாள், மகா பாபிலோன்! தன் பாலியல் ஒழுக்கக்கேட்டின்[b] வெறி நிறைந்த திராட்சரசத்திலிருந்து[a] எல்லா தேசங்களையும் குடிக்கச் செய்தவள்[c] அவளே” என்று கூறினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சினம் நிறைந்த திராட்சரசத்திலிருந்து’ அல்லது ‘கடும் கோபத்தின் திராட்சரசத்திலிருந்து’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க θυμός என்பது சினம், சீற்றம், அல்லது தீவிரமான வெறி/வேட்கையைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: பாபிலோனின் ‘பாலியல் ஒழுக்கக்கேடு’ என்பது ஊழலூட்டும் செல்வாக்கு, சிலைவழிபாடு, மற்றும் உண்மையற்ற தன்மை ஆகியவற்றுக்கான உருவகமாக இருக்கலாம்; ஆனால் இவற்றில் ஒன்றை மட்டும் இவ்வசனம் குறிப்பிடவில்லை.
    reason: cultural_note
  - marker: c
    text: ‘எல்லா தேசங்களுக்கும் போதையூட்டியவள்’ என்றும் பொருள் கொள்ளலாம். கிரேக்கத்தில் சொல்லுக்கு நேரான வடிவம் ‘எல்லா தேசங்களையும் குடிக்கச் செய்தவள்’ என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος … δεύτερος ἄγγελος
  choice: வேறொரு தூதன்—இரண்டாம் தூதன்—
  rationale: ἄλλος (‘வேறொரு’) மற்றும் δεύτερος (‘இரண்டாம்’) ஆகிய இரண்டையும் விடாமல் வைத்திருக்கிறது; இடைச்செருகல் அமைப்பு நவீன தமிழில் தெளிவாக உள்ளது.
- source_word: ἠκολούθησεν λέγων
  choice: பின்தொடர்ந்து வந்து … என்று கூறினான்
  rationale: தரிசன நிகழ்வுகளின் வரிசையையும் λέγων என்ற பங்கேற்புவினையின் தொடர்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Ἔπεσεν, ἔπεσεν
  choice: விழுந்தாள், விழுந்தாள்
  rationale: இருமுறை கூறப்படும் தீர்ப்பறிவிப்பின் வலிமையைப் பாதுகாக்கிறது; பாபிலோன் பெண்ணாக உருவகப்படுத்தப்படுவதால் பெண்பால் வினை பயன்படுத்தப்படுகிறது.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: மகா பாபிலோன்
  rationale: பெயரை ஒலிபெயர்த்து, ἡ μεγάλη என்பதன் பட்டப்பெயர் போன்ற வலிமையைச் சுருக்கமாகவும் மரியாதையான நடையிலும் தருகிறது.
- source_word: ἣ
  choice: செய்தவள் … அவளே
  rationale: பெண்பால் ஒருமை உறவுப்பெயரின் மூலம் பாபிலோன் பெண்ணாக உருவகப்படுத்தப்படுவதைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἐκ τοῦ οἴνου
  choice: திராட்சரசத்திலிருந்து
  rationale: ἐκ என்பதன் மூலத்திலிருந்து குடித்தல் என்ற நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: τοῦ θυμοῦ
  choice: வெறி நிறைந்த
  rationale: θυμός குறிக்கும் தீவிர உணர்ச்சி, சீற்றம், கட்டுக்கடங்கா வேட்கை ஆகியவற்றில் ஒன்றை மட்டும் முடிவாகத் தேர்ந்தெடுக்காமல், தமிழில் ஓரளவு அதே இருபொருள் வாய்ப்பை வைத்திருக்கிறது.
- source_word: τῆς πορνείας αὐτῆς
  choice: தன் பாலியல் ஒழுக்கக்கேட்டின்
  rationale: πορνεία என்பதன் பாலியல் உருவகத்தை வெளிப்படையாக வைத்துக் கொண்டே, அதை விபசாரம் அல்லது சிலைவழிபாடு என்ற ஒரே விளக்கத்திற்குள் குறுக்கவில்லை.
- source_word: πεπότικεν
  choice: குடிக்கச் செய்தவள்
  rationale: ποτίζω என்பதன் காரணவினைப் பொருளையும், நிறைவுற்ற செயல் தொடரும் விளைவைக் கொண்டிருப்பதையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πάντα τὰ ἔθνη
  choice: எல்லா தேசங்களையும்
  rationale: இங்கு ἔθνη என்பது யூதரல்லாதோரை மட்டும் குறிக்காமல் உலகின் தேசங்களைப் பொதுவாகக் குறிக்கிறது.
theological_decisions:
- issue: பாபிலோனின் πορνεία என்ற உருவகத்தின் பொருள்
  choice: முதன்மை உரையில் ‘பாலியல் ஒழுக்கக்கேடு’ என்ற உருவகச் சொல்லை வைத்திருத்தல்
  alternative: சிலைவழிபாடு; ஆன்மீகத் துரோகம்; விபசாரம்
  rationale: இவ்வசனம் உருவகத்தைத் தானே ஒரே பொருளாக விளக்கவில்லை; ஆகவே அதன் பாலியல், சமய, அரசியல் ஊழல் சார்ந்த பல்வேறு ஒலிப்புகளைத் திறந்தவையாக வைத்திருக்கிறது.
- issue: ‘அவளுடைய πορνεία-வின் θυμός’ என்பதில் θυμός-ன் பொருள்
  choice: வெறி நிறைந்த
  alternative: சினம் நிறைந்த; கடும் கோபத்தின்; கட்டுக்கடங்கா வேட்கை நிறைந்த
  rationale: இச்சொல் சீற்றத்தையும் தீவிரமான உணர்ச்சி அல்லது வேட்கையையும் குறிக்க முடியும். சூழல் பாபிலோனின் ஒழுக்கக்கேட்டோடு அதை இணைப்பதால், ஒரே இறையியல் விளக்கமாகக் குறுக்காமல் இருபொருள் நுணுக்கத்தைப் பாதுகாக்கும் சொல் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. தீர்ப்பறிவிப்பின் கவித்துவமான இரட்டிப்பு காக்கப்பட்டுள்ளது. ‘விழுந்தாள்’ மற்றும் ‘அவளே’ என்பவை பாபிலோனைப் பெண்ணாகச் சித்தரிக்கும் மூலமொழி உருவகத்தை வெளிப்படுத்துகின்றன. அடிக்குறிக் குறிகள் அவை விளக்கும் சொற்றொடர்களின் அருகே வைக்கப்பட்டுள்ளதால் உரையில் [b], [a], [c] என்ற வரிசையில் தோன்றுகின்றன.
