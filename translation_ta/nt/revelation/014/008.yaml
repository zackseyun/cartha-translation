    rationale: ἣ ... πεπότικεν என்பது பாபிலோனை விளக்கும் பெண்பால் உறவுத்தொடர். தமிழில் ‘செய்தவள் அவளே’ தேவையற்ற வலியுறுத்தலைச் சேர்ப்பதோடு வாக்கியத்தைச் செயற்கையாக்குகிறது.
