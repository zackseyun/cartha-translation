id: REV.14.15
reference: Revelation 14:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἄλλος ἄγγελος ἐξῆλθεν ἐκ τοῦ ναοῦ κράζων ἐν φωνῇ μεγάλῃ τῷ καθημένῳ ἐπὶ τῆς νεφέλης· Πέμψον τὸ δρέπανόν σου καὶ θέρισον, ὅτι ἦλθεν ἡ ὥρα θερίσαι, ὅτι ἐξηράνθη ὁ θερισμὸς τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/015.yaml
  text: And another angel came out from the sanctuary, crying out with a loud voice to the one seated on the cloud, “Send your sickle and reap, because the hour to reap has come, because the harvest of the earth is ripe.”
translation:
  language: ta
  text: வேறொரு தூதன் பரிசுத்த இடத்திலிருந்து வெளியே வந்து, மேகத்தின்மேல் அமர்ந்திருந்தவரை நோக்கி உரத்த குரலில், “உமது அரிவாளைச் செலுத்தி அறுவடை செய்யுங்கள்; ஏனெனில் அறுவடை செய்வதற்கான நேரம் வந்துவிட்டது; பூமியின் விளைச்சல் முற்றிவிட்டது” என்று கூக்குரலிட்டான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ναός
  choice: பரிசுத்த இடம்
  rationale: இங்கு தேவாலய வளாகம் முழுவதையும் குறிக்கும் ἱερόν அல்ல, தேவனுடைய சந்நிதியுள்ள உள் பரிசுத்த இடத்தைக் குறிக்கும் ναός பயன்படுத்தப்பட்டுள்ளது.
- source_word: Πέμψον τὸ δρέπανόν σου
  choice: உமது அரிவாளை நீட்டி
  rationale: πέμπω என்பதன் அடிப்படைப் பொருள் ‘அனுப்பு’ என்றாலும், அரிவாளை அறுவடைக்குச் செலுத்தும் செயலை இயல்பான தமிழில் ‘நீட்டி’ என்பது தெளிவாக வெளிப்படுத்துகிறது.
- source_word: θέρισον
  choice: அறுவடை செய்யும்
  rationale: கிரேக்க கட்டளை வடிவத்தின் நேரடியான செயற்பொருளைத் தக்கவைக்கும் மரியாதை ஒருமை கட்டளை வடிவம்.
- source_word: ἐξηράνθη ὁ θερισμὸς τῆς γῆς
  choice: பூமியின் விளைச்சல் முற்றிவிட்டது
  rationale: ἐξηράνθη சொற்பட ‘உலர்ந்துவிட்டது’; அறுவடைச் சூழலில் அறுப்பதற்குத் தயாராக முதிர்ந்த நிலையைக் குறிக்கிறது. ‘முற்றிவிட்டது’ அந்த வேளாண் பொருளை இயல்பாகத் தருகிறது; ‘மிக முற்றிவிட்டது’ போன்ற தீவிரத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: மேகத்தின்மேல் அமர்ந்திருப்பவரிடம் தூதன் கட்டளையிடுவது போலத் தோன்றும் மொழி
  choice: “உமது அரிவாளை நீட்டி அறுவடை செய்யும்” என்ற நேரடி கட்டளை வடிவத்தைத் தக்கவைத்தல்
  alternative: வேண்டுகோளாக மென்மைப்படுத்துதல்
  rationale: மூலத்தில் Πέμψον மற்றும் θέρισον இரண்டும் கட்டளை வினைகள். அந்தக் காட்சியின் இறையியல் அழுத்தத்தை விளக்கி மென்மைப்படுத்தாமல் அப்படியே வைத்துள்ளது.
- issue: பூமியின் அறுவடை இரட்சிப்பையா நியாயத்தீர்ப்பையா குறிக்கிறது
  choice: நடுநிலையான ‘விளைச்சல்’ மற்றும் ‘அறுவடை’ உருவகங்களைத் தக்கவைத்தல்
  alternative: மக்களின் இரட்சிப்பு அல்லது தண்டனை என்று வெளிப்படையாக விளக்குதல்
  rationale: இந்த வசனம் உருவகத்தின் துல்லியமான இறையியல் குறியீட்டைத் தனியாகத் தீர்மானிக்கவில்லை; சூழல் தரும் பதற்றத்தை மொழிபெயர்ப்பு முன்கூட்டியே தீர்க்கக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், காட்சிநடையின் கண்ணியத்தையும் உரத்த அறிவிப்பின் வலிமையையும் காக்கும் நடை. ‘அமர்ந்திருந்தவரை நோக்கி’ என்பது τῷ καθημένῳ என்பதன் இலக்கை இயல்பாகத் தெரிவிக்கிறது. தேவையற்ற சமயப் பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
