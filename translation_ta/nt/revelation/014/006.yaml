id: REV.14.6
reference: Revelation 14:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἄλλον ἄγγελον πετόμενον ἐν μεσουρανήματι, ἔχοντα εὐαγγέλιον αἰώνιον εὐαγγελίσαι ⸀ἐπὶ τοὺς καθημένους ἐπὶ τῆς γῆς καὶ ἐπὶ πᾶν ἔθνος καὶ φυλὴν καὶ γλῶσσαν καὶ λαόν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/006.yaml
  text: And I saw another angel flying in midheaven[a], having an eternal gospel to proclaim to those who dwell on the earth, and to every nation and tribe and language and people[b],
translation:
  language: ta
  text: அப்போது நடுவானில்[a] பறந்துகொண்டிருந்த வேறொரு தூதனை நான் கண்டேன். பூமியில் குடியிருப்போருக்கும்[b], ஒவ்வொரு தேசத்தாருக்கும், குலத்தாருக்கும், மொழியினருக்கும், மக்களுக்கும் அறிவிப்பதற்காக நித்திய நற்செய்தியை உடையவனாக அவன் இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வானத்தின் நடுவில்’ அல்லது ‘நடுவான வெளியில்’; கிரேக்கச் சொல் வெளிப்படுத்தல் நூலுக்குரிய தனித்துவமான வெளிப்படுத்தல்-இலக்கியச் சொல்லாகும்.
    reason: lexical_alternative
  - marker: b
    text: சொற்படி, ‘பூமியில் அமர்ந்திருப்போருக்கும்’; வெளிப்படுத்தல் நூலில் இத்தொடர் பூமியின் குடிகளைக் குறிக்கும் மரபுத்தொடராகப் பயன்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλον ἄγγελον
  choice: வேறொரு தூதனை
  rationale: ἄλλος என்பதன் இயல்பான ‘வேறொரு’ என்ற பொருளையும், வெளிப்படுத்தின விசேஷத்தின் சூழலில் ἄγγελος குறிக்கும் வானதூதரையும் இயல்பான தமிழில் தருகிறது.
- source_word: πετόμενον
  choice: பறந்துகொண்டிருந்த
  rationale: நிகழ்காலப் பங்கேற்புவினை, தூதன் அப்போது தொடர்ந்து பறந்த நிலையில் காணப்பட்டதைச் சுட்டுகிறது.
- source_word: ἐν μεσουρανήματι
  choice: நடுவானில்
  rationale: μεσουράνημα என்பது வெளிப்படுத்தின விசேஷத்துக்குரிய தனித்துவமான வானவெளிப் படிமம். ‘நடுவானில்’ என்பது அதைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: ἔχοντα
  choice: அவனிடம் இருந்தது
  rationale: தமிழில் ‘நற்செய்தியை வைத்திருந்தான்’ என்பது பொருளாகிய செய்தியை கையில் பிடித்திருப்பதுபோல் தவறாக உணர்த்தலாம். ‘அவனிடம் இருந்தது’ என்பது உடைமையை மிகைப்படுத்தாமல் காட்டுகிறது.
- source_word: εὐαγγέλιον αἰώνιον
  choice: நித்திய நற்செய்தி
  rationale: εὐαγγέλιον என்பதன் நல்ல செய்தி என்ற பொருளையும் அதன் வேதாகமத் தொடர்பையும் ‘நற்செய்தி’ காக்கிறது; αἰώνιον என்பதற்கு ‘நித்திய’ என்பது தெளிவான, வழக்கமான இணை.
- source_word: εὐαγγελίσαι
  choice: அறிவிப்பதற்கான
  rationale: இறந்தகால முடிவிலி வினை நோக்கத்தைக் காட்டுகிறது. ‘நற்செய்தியை நற்செய்தியாக அறிவிக்க’ என்ற தேவையற்ற மறுசொல்லலைத் தவிர்த்து நோக்கத்தைத் தெளிவுபடுத்துகிறது.
- source_word: ἐπὶ τοὺς καθημένους ἐπὶ τῆς γῆς
  choice: பூமியில் குடியிருப்போருக்கும்
  rationale: καθημένους என்பதன் சொற்பொருள் ‘அமர்ந்திருப்போர்’ என்றாலும், இங்கு அது பூமியின் குடிகளைச் சுட்டும் வெளிப்படுத்தின விசேஷத்தின் மரபுத்தொடராகச் செயல்படுகிறது.
- source_word: πᾶν ἔθνος καὶ φυλὴν καὶ γλῶσσαν καὶ λαόν
  choice: ஒவ்வொரு தேசத்தினருக்கும், குலத்தினருக்கும், மொழியினருக்கும், மக்களினத்தாருக்கும்
  rationale: உலகளாவிய மனிதப் பரப்பை வலியுறுத்தும் நான்கு கூறுகளையும் அவற்றின் தொடர்ச்சியான ஓசையையும் காக்கிறது; மனிதர்களே அறிவிப்பைப் பெறுவோர் என்பதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: εὐαγγέλιον αἰώνιον என்பதைத் திருச்சபை வழக்குச் சொல்லால் மொழிபெயர்ப்பதா அல்லது பொதுவான சொல்லால் மொழிபெயர்ப்பதா
  choice: நித்திய நற்செய்தி
  alternative: என்றென்றும் நிலைக்கும் நல்ல செய்தி
  rationale: ‘நற்செய்தி’ மூலச்சொல்லின் பொருளையும் வேதாகம ஒத்திசைவையும் காக்கிறது; அதேவேளையில் இவ்வசனத்தில் இல்லாத குறிப்பிட்ட கோட்பாட்டு உள்ளடக்கத்தைச் சேர்ப்பதில்லை. கிரேக்கத்தில் சுட்டுச் சொல் இல்லாததைத் தமிழில் செயற்கையாக ‘ஒரு’ என்று வலியுறுத்தவில்லை.
- issue: τοὺς καθημένους ἐπὶ τῆς γῆς என்ற மரபுத்தொடரை எவ்வாறு தருவது
  choice: பூமியில் குடியிருப்போர்
  alternative: பூமியில் அமர்ந்திருப்போர்
  rationale: சொற்படியான மாற்று உடல் நிலையைக் குறிக்கிறதெனத் தவறாகப் புரியக்கூடும். தேர்ந்த வடிவம் வெளிப்படுத்தின விசேஷத்தில் வரும் பூமிவாசிகள் என்ற வகைப்பாட்டைக் காக்கிறது; அதைத் தத்துவ ரீதியாக மேலும் வரையறுக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. கிரேக்க வாக்கியத்தின் நீண்ட பங்கேற்புவினை அமைப்பு தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. பட்டியலின் நான்கு கூறுகளும் காக்கப்பட்டுள்ளன; பழமையான ‘பாஷை’, ‘ஜனம்’ போன்ற சொற்கள் தவிர்க்கப்பட்டுள்ளன.
