id: REV.14.9
reference: Revelation 14:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ἄγγελος τρίτος ἠκολούθησεν αὐτοῖς λέγων ἐν φωνῇ μεγάλῃ· Εἴ τις προσκυνεῖ τὸ θηρίον καὶ τὴν εἰκόνα αὐτοῦ, καὶ λαμβάνει χάραγμα ἐπὶ τοῦ μετώπου αὐτοῦ ἢ ἐπὶ τὴν χεῖρα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/009.yaml
  text: And another angel[a], a third, followed them, saying with a loud voice, “If anyone worships the beast and its image[b], and receives a mark on his forehead or on his hand,”
translation:
  language: ta
  text: 'வேறொரு தூதர், மூன்றாவது தூதர், அவர்களைப் பின்தொடர்ந்து வந்து, உரத்த குரலில் சொன்னார்: “யாராவது மிருகத்தையும் அதன் உருவத்தையும் வழிபட்டு[a], தன் நெற்றியிலோ தன் கையிலோ[b] ஒரு குறியைப் பெற்றுக்கொண்டால்,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மிருகத்தையும் அதன் உருவத்தையும் பணிந்து வணங்கி” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் தரையில் விழுந்து பணிவதைக் குறிக்கக்கூடும்; இங்கு அது வழிபாட்டுடன் கூடிய பற்றுறுதியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் சொற்சொல்லாக, “அவனுடைய நெற்றியின்மேல் அல்லது அவனுடைய கையின்மேல்.” ஒருமை ஆண்பால் பெயர்ச்சுட்டு, “யாராவது” என்பவரைப் பொதுவாகக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: ἄλλος ἄγγελος τρίτος
  choice: மூன்றாவதாக, வேறொரு தூதர்
  rationale: ἄλλος என்பதிலுள்ள ‘வேறொரு’ என்ற கருத்தையும் τρίτος என்பதிலுள்ள வரிசையையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: ἠκολούθησεν αὐτοῖς
  choice: அவர்களைப் பின்தொடர்ந்து வந்து
  rationale: காட்சியில் முந்திய தூதர்களுக்குப் பிறகு இவர் வருவதை இயல்பான நிகழ்வுத் தொடராக வெளிப்படுத்துகிறது.
- source_word: λέγων ἐν φωνῇ μεγάλῃ
  choice: உரத்த குரலில் சொன்னார்
  rationale: அறிவிப்பின் வெளிப்படையான, வலியுறுத்தப்பட்ட தன்மையைத் தெளிவாகக் காட்டுகிறது.
- source_word: Εἴ τις
  choice: யாராவது ... பெற்றுக்கொண்டால்
  rationale: எவரையும் உள்ளடக்கும் பொதுவான நிபந்தனையை இயல்பான தமிழ் வாக்கிய அமைப்பில் தருகிறது.
- source_word: προσκυνεῖ
  choice: வழிபட்டு
  rationale: இச்சூழலில் வெறும் உடல் வணக்கத்தைவிட, மிருகத்திற்குக் காட்டப்படும் வழிபாட்டையும் விசுவாசப் பற்றுறுதியையும் குறிக்கிறது.
- source_word: τὸ θηρίον
  choice: மிருகம்
  rationale: வெளிப்படுத்தல் நூலின் இவ்விறுதிக்காலக் காட்சிப் பாத்திரத்துக்கான நேரடியான, நிலையான தமிழ் சொல்.
- source_word: τὴν εἰκόνα αὐτοῦ
  choice: அதன் உருவம்
  rationale: θηρίον நடுநிலைப் பாலில் இருப்பதையும் εἰκών என்பது பிரதிநிதித்துவ உருவத்தைக் குறிப்பதையும் தேவையற்ற விளக்கமின்றி தக்கவைக்கிறது.
- source_word: λαμβάνει χάραγμα
  choice: ஒரு குறியைப் பெற்றுக்கொண்டு
  rationale: λαμβάνει என்பது இங்கு ஏற்றுக்கொள்வதைச் சுட்டுகிறது; χάραγμα என்பது முத்திரையிடும் கருவியைவிடப் பதிக்கப்பட்ட அடையாளக் குறியை முதன்மையாகக் குறிக்கிறது.
- source_word: ἐπὶ τοῦ μετώπου αὐτοῦ ἢ ἐπὶ τὴν χεῖρα αὐτοῦ
  choice: தன் நெற்றியிலோ தன் கையிலோ
  rationale: குறி இடப்படும் இரு இடங்களையும் ஒருமைத் தற்சுட்டுப் பெயரால் இயல்பாகவும் பாலினத்தைத் தேவையின்றி குறிப்பாக்காமலும் தருகிறது.
theological_decisions:
- issue: மிருகத்தை நோக்கிய προσκυνέω என்பதன் சமயப் பொருள்
  choice: வழிபட்டு
  alternative: பணிந்து வணங்கி
  rationale: வெளிப்படுத்தல் நூலின் சூழலில் இது உடல் நிலையை மட்டும் அல்லாமல் விக்கிரக வழிபாட்டுச் சார்ந்த பற்றுறுதியையும் குறிக்கிறது; ‘வழிபட்டு’ அந்தத் தீவிரத்தைத் தக்கவைக்கிறது.
- issue: τις என்பதோடு வரும் ஒருமை ஆண்பால் αὐτοῦ
  choice: தன் நெற்றியிலோ தன் கையிலோ
  alternative: அவனுடைய நெற்றியிலோ அவனுடைய கையிலோ
  rationale: மூலத்தில் இலக்கணப்படி ஒருமை ஆண்பால் வடிவம் இருந்தாலும், அது ‘யாராவது’ என்பவரைப் பொதுவாகச் சுட்டுகிறது. தமிழின் ‘தன்’ ஒருமையையும் பொதுப்பொருளையும் இயல்பாகப் பாதுகாக்கிறது; பாலின வரம்பைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. மூலத்தின் நிறைவுபெறாத நிபந்தனை வாக்கியம் அடுத்த வசனத்தில் தொடர்வதால் இறுதியில் காற்புள்ளி தக்கவைக்கப்பட்டது. ‘உருவம்’ என்பது εἰκών-ஐ விளக்கவுரை சேர்க்காமல் தருகிறது; ‘குறி’ என்பது χάραγμα-வை σφραγίς (‘முத்திரை’) என்பதிலிருந்து வேறுபடுத்துகிறது.
