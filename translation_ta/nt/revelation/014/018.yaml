id: REV.14.18
reference: Revelation 14:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἄλλος ⸀ἄγγελος ἐκ τοῦ θυσιαστηρίου, ⸀ὁ ἔχων ἐξουσίαν ἐπὶ τοῦ πυρός, καὶ ἐφώνησεν ⸀φωνῇ μεγάλῃ τῷ ἔχοντι τὸ δρέπανον τὸ ὀξὺ λέγων· Πέμψον σου τὸ δρέπανον τὸ ὀξὺ καὶ τρύγησον τοὺς βότρυας τῆς ἀμπέλου τῆς γῆς, ὅτι ἤκμασαν αἱ σταφυλαὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/018.yaml
  text: And another angel came out from the altar[a], the one who has authority over the fire, and he called out with a loud voice to the one who had the sharp sickle, saying, “Send out your sharp sickle and gather the clusters of the vine of the earth[b], because its grapes are ripe.”
translation:
  language: ta
  text: வேறொரு தூதன் பலிபீடத்திலிருந்து வெளியே வந்தான்; அவன் நெருப்பின்மேல் அதிகாரம் உடையவன். அவன் கூர்மையான அரிவாளை வைத்திருந்தவனை நோக்கி உரத்த குரலில் கூவி, “உன் கூர்மையான அரிவாளை அனுப்பு[a]; பூமியின் திராட்சைக்கொடியின் திராட்சைக் குலைகளைச் சேகரி; ஏனெனில் அதன் திராட்சைப்பழங்கள் பழுத்துவிட்டன” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் கூர்மையான அரிவாளை நீட்டு.” கிரேக்க வினைச்சொல்லின் நேரடிப் பொருள் “அனுப்பு”; அறுவடை உருவகத்தில் சிலர் அதை இயல்பாக “நீட்டு” என்று மொழிபெயர்க்கின்றனர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: வேறொரு தூதன்
  rationale: வெளிப்படுத்தின விசேஷத்தின் தரிசனச் சூழலில் ἄγγελος விண்ணுலகத் தூதரைக் குறிக்கிறது; ἄλλος என்பதன் தொடர்ச்சிப் பொருளையும் ‘வேறொரு’ காக்கிறது.
- source_word: ἐκ τοῦ θυσιαστηρίου
  choice: பலிபீடத்திலிருந்து புறப்பட்டு வந்தான்
  rationale: θυσιαστήριον என்பதற்கு ‘பலிபீடம்’ இயல்பான தமிழ் இணை; ἐκ என்பதிலுள்ள வெளியே வரும் இயக்கத்தை ‘புறப்பட்டு வந்தான்’ தெளிவாக்குகிறது.
- source_word: ὁ ἔχων ἐξουσίαν ἐπὶ τοῦ πυρός
  choice: அவன் நெருப்பின்மேல் அதிகாரம் உடையவன்
  rationale: பெயர்ச்சொல் தன்மையுள்ள பங்கேற்பு வடிவத்தை தனி விளக்க வாக்கியமாக இயல்பாகத் தருகிறது; நெருப்பின்மீதான அதிகாரத்தை விளக்காமல் அப்படியே காக்கிறது.
- source_word: ἐφώνησεν φωνῇ μεγάλῃ
  choice: உரத்த குரலில் ... சொன்னான்
  rationale: மூலத்தின் வெளிப்படையான φωνή என்ற பெயர்ச்சொல்லைக் ‘குரல்’ எனக் காத்து, தமிழில் இயல்பான உரத்த அழைப்பை வெளிப்படுத்துகிறது.
- source_word: τῷ ἔχοντι τὸ δρέπανον τὸ ὀξὺ
  choice: கூர்மையான அரிவாளை வைத்திருந்தவனை நோக்கி
  rationale: அழைக்கப்பட்ட நபரைத் தெளிவாக அடையாளப்படுத்துகிறது; δρέπανον என்பதற்கு அறுவடைக் கருவியான ‘அரிவாள்’ பயன்படுத்தப்படுகிறது.
- source_word: Πέμψον σου τὸ δρέπανον τὸ ὀξὺ
  choice: உன் கூர்மையான அரிவாளை நீட்டி
  rationale: πέμπω என்பதன் அடிப்படைப் பொருள் ‘அனுப்பு’; ஆனால் அரிவாளைப் பயன்படுத்தும் அறுவடைச் சூழலில் ‘நீட்டு’ தமிழில் புரிந்துகொள்ளத்தக்கதாகவும் மூல உருவகத்துக்கு நெருக்கமாகவும் உள்ளது. மாற்று நேரடி மொழிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τρύγησον τοὺς βότρυας
  choice: குலைகளை அறுவடை செய்
  rationale: τρυγάω திராட்சைப்பழங்களைச் சேகரிக்கும் அறுவடையைச் சிறப்பாகக் குறிக்கிறது; βότρυας என்பதன் திராட்சைக் குலைகள் சூழலால் தெளிவாக இருப்பதால் ‘குலைகள்’ போதுமானது.
- source_word: τῆς ἀμπέλου τῆς γῆς
  choice: பூமியின் திராட்சைக்கொடியிலுள்ள
  rationale: ‘பூமியின் திராட்சைக்கொடி’ என்ற அபோகலிப்திய உருவகத்தை விளக்கமாக மாற்றாமல் காக்கிறது; தமிழில் குலைகளுடனான தொடர்புக்காக ‘இலுள்ள’ பயன்படுத்தப்படுகிறது.
- source_word: ἤκμασαν αἱ σταφυλαὶ αὐτῆς
  choice: அதன் திராட்சைப்பழங்கள் பழுத்துவிட்டன
  rationale: ἤκμασαν என்பதன் முதிர்ந்து பழுத்த நிலையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; αὐτῆς என்பது உயிரற்ற திராட்சைக்கொடியைச் சுட்டுவதால் ‘அதன்’ எனப்படுகிறது.
theological_decisions:
- issue: τῆς ἀμπέλου τῆς γῆς என்ற அபோகலிப்திய உருவகத்தின் அடையாளம்
  choice: ‘பூமியின் திராட்சைக்கொடி’ என்ற உருவகம் முதன்மை உரையில் அப்படியே வைக்கப்பட்டது.
  alternative: அதை ‘பூமியிலுள்ள தீய மக்கள்’ அல்லது நியாயத்தீர்ப்புக்கு உட்படுகிற மனிதர்கள் என்று வெளிப்படையாக விளக்குவது.
  rationale: சுற்றியுள்ள பகுதி நியாயத்தீர்ப்பைச் சுட்டினாலும், இந்த வசனம் குறிப்பிடப்படும் மக்களை நேரடியாக அடையாளப்படுத்தவில்லை. ஆகவே உருவகத்திலுள்ள இறையியல் அழுத்தமும் தெளிவின்மையும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் தரிசன உரைக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘பலிபீடம்’, ‘அதிகாரம்’, ‘திராட்சைக்கொடி’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் காக்கப்பட்டுள்ளன; வாக்கிய அமைப்பு இயல்பான தமிழுக்காகப் பிரிக்கப்பட்டுள்ளது.
