id: REV.21.14
reference: Revelation 21:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ τὸ τεῖχος τῆς πόλεως ⸀ἔχων θεμελίους δώδεκα, καὶ ἐπ’ αὐτῶν δώδεκα ὀνόματα τῶν δώδεκα ἀποστόλων τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/014.yaml
  text: And the wall of the city had twelve foundations[a], and on them were the twelve names of the twelve apostles of the Lamb.
translation:
  language: ta
  text: அந்த நகரத்தின் மதிலுக்குப் பன்னிரண்டு அஸ்திவாரங்கள்[a] இருந்தன; அவற்றின்மேல் ஆட்டுக்குட்டியானவரின் பன்னிரண்டு அப்போஸ்தலர்களுடைய பன்னிரண்டு பெயர்கள் இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பன்னிரண்டு அஸ்திவாரக் கற்கள்.” கட்டடச் சூழலில் கிரேக்கச் சொல்லான θεμελίους என்பது அஸ்திவாரங்களையோ அஸ்திவாரக் கற்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τεῖχος
  choice: மதில்
  rationale: இது குறிப்பாக நகரத்தைச் சூழ்ந்த மதிலைக் குறிக்கிறது; ‘சுவர்’ என்பதைவிட ‘மதில்’ இச்சூழலில் துல்லியமும் இயல்பும் உடையது.
- source_word: πόλεως
  choice: நகரத்தின்
  rationale: உடைமை அல்லது தொடர்பைக் காட்டும் கிரேக்க வேற்றுமையைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: ἔχων
  choice: இருந்தன
  rationale: கிரேக்கத்தில் ‘கொண்டிருந்த’ என்ற நிகழ்காலப் பெயரெச்ச வடிவம் இருந்தாலும், தரிசனத்தின் விவரிப்பை இயல்பான தமிழில் இறந்தகால வினையாக அளிக்கிறது. எழுவாய் பன்மையான ‘பன்னிரண்டு அஸ்திவாரங்கள்’ என்பதால் ‘இருந்தன’ பயன்படுத்தப்பட்டது.
- source_word: θεμελίους δώδεκα
  choice: பன்னிரண்டு அஸ்திவாரங்கள்
  rationale: θεμέλιος என்பது அஸ்திவாரங்களையோ அஸ்திவாரக் கற்களையோ குறிக்கலாம். கட்டட உருவகத்தையும் சொல்லின் பரந்த பொருளையும் காக்க ‘அஸ்திவாரங்கள்’ முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டது.
- source_word: ἐπ’ αὐτῶν
  choice: அவற்றின்மேல்
  rationale: முன்னர் குறிப்பிடப்பட்ட பன்னிரண்டு அஸ்திவாரங்களின்மேல் பெயர்கள் இருந்த இடநிலையைச் சுருக்கமாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: ὀνόματα
  choice: பெயர்கள்
  rationale: மூலத்தில் ‘பெயர்கள்’ என்றே உள்ளது; ‘பெயர்ப் பொறிப்புகள்’ என உரையில் இல்லாத விவரத்தைச் சேர்க்கவில்லை.
- source_word: ἀποστόλων
  choice: அப்போஸ்தலர்களுடைய
  rationale: புதிய ஏற்பாட்டில் நிலைபெற்ற பதவிப் பொருளை ‘அப்போஸ்தலர்கள்’ தக்கவைக்கிறது; பொதுவான ‘தூதர்கள்’ என்பது இங்கு உள்ள சிறப்புப் பொருளை மங்கச் செய்யலாம்.
- source_word: τοῦ ἀρνίου
  choice: ஆட்டுக்குட்டியானவரின்
  rationale: வெளிப்படுத்தலில் இயேசுவைக் குறிக்கும் முக்கியமான கிறிஸ்துவியல் பட்டத்தை மரியாதைத் தமிழில் தக்கவைக்கிறது; உறவு/உடைமையைக் காட்டும் பிறப்புவேற்றுமையும் இயல்பாக வெளிப்படுகிறது.
theological_decisions:
- issue: கிறிஸ்துவியல் பட்டம் ἀρνίον
  choice: ஆட்டுக்குட்டியானவர்
  alternative: ஆட்டுக்குட்டி
  rationale: வெளிப்படுத்தலில் ἀρνίον உயர்த்தப்பட்ட இயேசுவுக்கான அடையாளப் பட்டமாகச் செயல்படுகிறது. ‘ஆட்டுக்குட்டியானவர்’ என்பது உருவகத்தை மாற்றாமல், தமிழில் நபருக்குரிய மரியாதையையும் பட்டத்தின் கிறிஸ்துவியல் வலிமையையும் இயல்பாக வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘மதில்,’ ‘அஸ்திவாரம்,’ ‘அப்போஸ்தலர்’ ஆகியவை வேதாகம மற்றும் கட்டடச் சூழல்களில் நிலைபெற்ற, இன்னும் பொதுவாகப் புரிந்துகொள்ளப்படும் சொற்களாகத் தேர்ந்தெடுக்கப்பட்டன. கிரேக்க வாக்கியத்தின் இரண்டு இணைந்த கூறுகளையும் தமிழில் அரைப்புள்ளியால் தெளிவுபடுத்தியுள்ளோம்.
