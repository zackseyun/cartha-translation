source:
  edition: SBLGNT
  text: ⸀οἱ θεμέλιοι τοῦ τείχους τῆς πόλεως παντὶ λίθῳ τιμίῳ κεκοσμημένοι· ὁ θεμέλιος ὁ πρῶτος ἴασπις, ὁ δεύτερος σάπφιρος, ὁ τρίτος χαλκηδών, ὁ τέταρτος σμάραγδος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/019.yaml
  text: 'The foundations of the wall of the city were adorned with every kind of precious stone: the first foundation was jasper[a], the second sapphire, the third chalcedony, the fourth emerald[b],'
translation:
  language: ta
  text: நகரத்தின் மதிலின் அஸ்திவாரங்கள் எல்லா வகையான விலையுயர்ந்த கற்களாலும் அலங்கரிக்கப்பட்டிருந்தன.[a] முதலாவது அஸ்திவாரக் கல் யஸ்பிஸ்; இரண்டாவது நீலமணி; மூன்றாவது கல்கேதோன்; நான்காவது மரகதம்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒவ்வொரு விலையுயர்ந்த கல்லாலும்.” கிரேக்கச் சொற்றொடரை வகைகளைக் குறிக்கும் விதத்தில் புரிந்துகொள்ளலாம்; அதனால் “எல்லா வகையான விலையுயர்ந்த கற்களாலும்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “கல்கேதோன்” என்பது கிரேக்கச் சொல்லின் மரபான ஒலிபெயர்ப்பு. பண்டைக்கால இரத்தினங்களில் சிலவற்றின் துல்லியமான அடையாளம் உறுதியாகத் தெரியவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: θεμέλιοι
  choice: அஸ்திவாரங்கள்
  rationale: மதிலின் அடித்தள அமைப்புகளைச் சுட்டும் பன்மைச் சொல்லை இயல்பாகவும் தெளிவாகவும் வழங்குகிறது.
- source_word: τείχους
  choice: மதில்
  rationale: நகரைச் சூழ்ந்த பாதுகாப்புச் சுவரைக் குறிக்கும் சூழலுக்கு ‘மதில்’ துல்லியமான, இயல்பான தமிழ் சொல்.
- source_word: πόλεως
  choice: நகரத்தின்
  rationale: வெளிப்படுத்தலில் வர்ணிக்கப்படும் மகத்தான இறுதிக்கால நகரத்துக்கு ஏற்ற வழக்கமான பொருள்.
- source_word: παντὶ λίθῳ τιμίῳ
  choice: எல்லா வகையான விலையுயர்ந்த கற்களாலும்
  rationale: அலங்கரிக்கப்பட்டதற்கான கருவியையும், கிரேக்கச் சொற்றொடரின் பகிர்ந்தளிக்கும் பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; நேரடியாக ‘ஒவ்வொரு விலையுயர்ந்த கல்லாலும்’ எனவும் கொள்ளலாம்.
- source_word: κεκοσμημένοι
  choice: அலங்கரிக்கப்பட்டிருந்தன
  rationale: நிறைவேற்றப்பட்ட அலங்காரத்தின் தொடரும் நிலையை உணர்த்தும் perfect passive participle-ஐ தமிழில் இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: ὁ θεμέλιος ὁ πρῶτος
  choice: முதலாவது அஸ்திவாரம்
  rationale: வரிசையில் குறிப்பிடப்படும் ஒவ்வொரு தனி அஸ்திவாரத்தையும் விளக்கமின்றி நேரடியாகக் காட்டுகிறது.
- source_word: ἴασπις
  choice: யஸ்பிஸ் கல்
  rationale: பண்டைய இரத்தினத்தின் துல்லிய அடையாளம் உறுதியற்றதால், வழக்கமான பெயரை ஒலிபெயர்த்து ‘கல்’ எனத் தெளிவுபடுத்துகிறது.
- source_word: σάπφιρος
  choice: நீலமணி
  rationale: சப்பைர் எனப்படும் இரத்தினத்திற்கான பரவலாகப் புரிந்துகொள்ளப்படும் இயல்பான தமிழ் பெயர்.
- source_word: χαλκηδών
  choice: கல்கேதோன் கல்
  rationale: பண்டைய கல்லின் துல்லிய அடையாளம் உறுதியற்றதால் கிரேக்கப் பெயருக்கு நெருக்கமான ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- source_word: σμάραγδος
  choice: மரகதம்
  rationale: இச்சொல்லுக்கான நிலைபெற்ற, பரவலாக அறியப்பட்ட தமிழ் இரத்தினப் பெயர்.
theological_decisions:
- issue: வெளிப்படுத்தல் தரிசனத்திலுள்ள இரத்தினப் பட்டியலின் குறியீட்டுப் பொருள்
  choice: கற்களின் பெயர்களை முதன்மை உரையில் குறியீட்டு விளக்கமின்றி நேரடியாக மொழிபெயர்த்தல்
  alternative: அவற்றை இஸ்ரவேலின் கோத்திரங்கள், அப்போஸ்தலர்கள் அல்லது ஆசாரிய ஆபரணங்களுடன் வெளிப்படையாக இணைத்தல்
  rationale: இந்த வசனம் கற்களை அலங்காரங்களாகப் பட்டியலிடுகிறதே தவிர அவற்றின் குறியீட்டுப் பொருளை விளக்கவில்லை; ஆகவே உரையில் இல்லாத ஒரு குறிப்பிட்ட இறையியல் திட்டம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், தரிசன வர்ணனைக்கு ஏற்ற கண்ணியமான நடையுடன் வடிவமைக்கப்பட்டது. ‘அஸ்திவாரம்’, ‘மதில்’, ‘மரகதம்’ போன்ற பரவலாகப் புரியும் சொற்கள் பயன்படுத்தப்பட்டன; உறுதியற்ற பண்டைய இரத்தினப் பெயர்கள் ஒலிபெயர்க்கப்பட்டன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
