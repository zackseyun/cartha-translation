source:
  edition: SBLGNT
  text: Καὶ ναὸν οὐκ εἶδον ἐν αὐτῇ, ὁ γὰρ κύριος, ὁ θεός, ὁ παντοκράτωρ, ναὸς αὐτῆς ἐστιν, καὶ τὸ ἀρνίον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/022.yaml
  text: And I saw no temple in it[a], for the Lord God, the Almighty[b], is its temple, and the Lamb.
translation:
  language: ta
  text: அதில் நான் ஒரு ஆலயத்தையும் காணவில்லை; ஏனெனில் எல்லாம் வல்ல ஆண்டவராகிய தேவனும் ஆட்டுக்குட்டியானவரும் அதன் ஆலயமாக இருக்கிறார்கள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘திருத்தலம்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ஆலயத்தின் புனித உட்பகுதியை அல்லது திருத்தலத்தைச் சிறப்பாகக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் ‘ஆலயம்’ என்பதுடன் வரும் வினை ஒருமையில் உள்ளது; பின்னர் ‘ஆட்டுக்குட்டியானவர்’ ‘மற்றும்’ என்று சேர்க்கப்படுகிறார். தமிழில் இருவரும் நகரத்தின் ஆலயமாக இருப்பதைக் தெளிவுபடுத்தப் பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
    reason: textual_syntax
lexical_decisions:
- source_word: ναὸν / ναὸς
  choice: ஆலயம்
  rationale: ναός என்பது பொதுவான வழிபாட்டுக் கட்டடத்தைவிட ஆலயத்தின் புனித உட்பகுதி அல்லது திருத்தலத்தைக் குறிப்பாகக் குறிக்கலாம். இங்கு காணக்கூடிய ஆலயம் இல்லாததையும், தேவனும் ஆட்டுக்குட்டியானவரும் நகரத்தின் ஆலயமாக இருப்பதையும் தெளிவாக எதிரெதிராக நிறுத்துவதற்கு ‘ஆலயம்’ இயல்பான தேர்வு.
- source_word: οὐκ εἶδον
  choice: எதையும் நான் காணவில்லை
  rationale: இறந்தகால வினையையும் மறுப்பையும் இயல்பான தமிழில் வெளிப்படுத்தி, ஆலயம் முற்றிலும் இல்லாததை வலியுறுத்துகிறது.
- source_word: ἐν αὐτῇ / αὐτῆς
  choice: அதில் / அதன்
  rationale: இரு பிரதிப்பெயர்களும் நகரத்தைக் குறிக்கின்றன. கிரேக்கத்தில் இலக்கணப் பெண்பால் இருந்தாலும், தமிழில் உயிரற்ற நகரத்தைக் குறிக்க ‘அதில்/அதன்’ என்பதே இயல்பானது.
- source_word: κύριος, ὁ θεός
  choice: ஆண்டவராகிய தேவன்
  rationale: இரு தெய்வீகப் பட்டங்களையும் காத்து, நவீனத் தமிழில் இயல்பாக ஒலிக்கும் இணைப்பாக வழங்குகிறது.
- source_word: παντοκράτωρ
  choice: எல்லாம் வல்ல
  rationale: παντοκράτωρ குறிக்கும் அனைத்தின்மேலும் அதிகாரமும் வல்லமையும் உடையவர் என்ற பொருளைச் சுருக்கமாகவும் மரியாதையாகவும் தெரிவிக்கிறது.
- source_word: τὸ ἀρνίον
  choice: ஆட்டுக்குட்டியானவர்
  rationale: வெளிப்படுத்தலில் கிறிஸ்துவைக் குறிக்கும் பட்டத்தின் உருவகத்தையும், அவரைக் குறிக்கும் மரியாதைமிக்க ஆள்பால் நடையையும் காக்கிறது.
theological_decisions:
- issue: ναὸς αὐτῆς ἐστιν, καὶ τὸ ἀρνίον என்பதில் தேவனுக்கும் ஆட்டுக்குட்டியானவருக்கும் உள்ள இலக்கண உறவு
  choice: தேவனையும் ஆட்டுக்குட்டியானவரையும் இணை எழுவாய்களாகக் கொண்டு, இருவரும் நகரத்தின் ஆலயமாக இருப்பதாகத் தமிழில் இயல்பாக வழங்கப்பட்டது.
  alternative: “எல்லாம் வல்ல ஆண்டவராகிய தேவனே அதன் ஆலயம்; ஆட்டுக்குட்டியானவரும்” என்று கிரேக்கத்தின் ஒருமை வினையையும் இறுதியில் சேர்க்கப்பட்ட καί தொடரையும் நெருக்கமாகப் பிரதிபலித்தல்.
  rationale: καὶ τὸ ἀρνίον ஆட்டுக்குட்டியானவரை தேவனுடன் இணைக்கிறது; தமிழில் பன்மை வினை இதைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது. அதேவேளையில் கிரேக்கத்தில் ἐστιν ஒருமையாக இருப்பதும், ‘ஆட்டுக்குட்டியானவர்’ பின்னர் சேர்க்கப்படுவதும் குறிப்பில் தெரிவிக்கப்பட்டு, உரையின் இலக்கணத் திணறல் மறைக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, மரியாதைமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆலயம்’ என்ற சொல்லின் மறுபயன்பாடு வசனத்தின் மைய எதிர்மறை-நிறைவு அமைப்பைக் காக்கிறது; தேவனும் ஆட்டுக்குட்டியானவரும் இணையாகக் குறிப்பிடப்படுவது தெளிவாக்கப்பட்டுள்ளது.
