revisions:
- from: அதில் ஆலயம்[a] எதையும் நான் காணவில்லை. ஏனெனில் எல்லாம் வல்ல ஆண்டவராகிய தேவனும் ஆட்டுக்குட்டியானவரும் அதன் ஆலயமாக இருக்கிறார்கள்.[b]
  to: அதில் நான் ஒரு ஆலயத்தையும் காணவில்லை; ஏனெனில் எல்லாம் வல்ல ஆண்டவராகிய தேவனும் ஆட்டுக்குட்டியானவரும் அதன் ஆலயமாக இருக்கிறார்கள்.[a][b]
  rationale: The revision corrects the Tamil negated-object construction and lightly improves punctuation. It retains the draft’s defensible reading that both the Lord God, the Almighty, and the Lamb are the city’s temple, without concealing the Greek singular verb and appended coordinate phrase; the revised syntax footnote records that feature accurately and neutrally.
