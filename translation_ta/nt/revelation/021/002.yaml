source:
  edition: SBLGNT
  text: καὶ τὴν πόλιν τὴν ἁγίαν Ἰερουσαλὴμ καινὴν εἶδον καταβαίνουσαν ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ, ἡτοιμασμένην ὡς νύμφην κεκοσμημένην τῷ ἀνδρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/002.yaml
  text: And I saw the holy city[a], new Jerusalem, coming down out of heaven from God[c][b], prepared like a bride adorned for her husband.
translation:
  language: ta
  text: பரிசுத்த நகரமான புதிய எருசலேம், வானத்திலிருந்து, கடவுளிடமிருந்து இறங்கி வருவதை நான் கண்டேன். அது தன் கணவனுக்காக அலங்கரிக்கப்பட்ட மணமகளைப் போல ஆயத்தப்படுத்தப்பட்டிருந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόλιν τὴν ἁγίαν
  choice: பரிசுத்த நகரம்
  rationale: நகரம் என்ற நேரடியான பொருளையும், ἁγίαν என்பதன் வேதாகமத் தெய்வீகத் தன்மையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: Ἰερουσαλὴμ καινὴν
  choice: புதிய எருசலேம்
  rationale: எருசலேம் என்ற பெயரை ஒலிபெயர்த்து, καινήν என்பதை விளக்கப் பெயரடையாக மொழிபெயர்க்கிறது; தனியான அதிகாரப்பூர்வ பட்டப்பெயர் என்று கூடுதலாகத் தீர்மானிக்கவில்லை.
- source_word: εἶδον
  choice: நான் கண்டேன்
  rationale: ὁράω என்பதன் இறந்தகால வடிவை விரிவாக்கமின்றி நேரடியாகத் தருகிறது.
- source_word: καταβαίνουσαν
  choice: இறங்கி வருவதை
  rationale: கீழ்நோக்கிய இயக்கத்தைத் தெளிவாகவும் இயல்பான நவீனத் தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ
  choice: கடவுளிடமிருந்து வானத்திலிருந்து
  rationale: ἀπό குறிக்கும் மூலத்தையும் ἐκ குறிக்கும் வெளியிலிருந்து வரும் இயக்கத்தையும் தனித்தனியே காக்கிறது; தமிழ் சொல்வரிசை தெய்வீக மூலத்தை முதலில் சுட்டுகிறது.
- source_word: ἡτοιμασμένην
  choice: ஆயத்தமாக்கப்பட்டிருந்தது
  rationale: நிறைவுற்ற செயப்பாட்டு எச்சத்தின் விளைவுநிலையை—அது ஆயத்தமான நிலையில் இருந்ததை—காக்கிறது.
- source_word: ὡς νύμφην
  choice: மணமகளைப் போல
  rationale: ὡς இங்கு அறிமுகப்படுத்தும் உவமையைத் தெளிவாகக் காட்டுகிறது; νύμφην என்பதை தொழில்நுட்பத் தெய்வீகப் பட்டமாக அல்லாமல் மணமகள் என வழங்குகிறது.
- source_word: κεκοσμημένην τῷ ἀνδρὶ αὐτῆς
  choice: தன் கணவனுக்காக அலங்கரிக்கப்பட்ட
  rationale: திருமணச் சூழலில் ἀνήρ என்பதற்கு கணவன் இயல்பான பொருள்; κοσμέω குறிக்கும் அலங்காரத்தை உயர்வான ஆனால் தற்போதைய தமிழில் தருகிறது.
theological_decisions:
- issue: ‘புதிய எருசலேம்’ என்பதை நிலையான இறுதிக்காலப் பட்டப்பெயராகக் காட்ட வேண்டுமா
  choice: விளக்கப் பெயரடை கொண்ட பெயராக ‘புதிய எருசலேம்’ என்று வழங்கப்பட்டது
  alternative: ஒரு சிறப்பு அதிகாரப்பூர்வ பட்டப்பெயராக அச்சியல் அல்லது நடைக் குறியீட்டால் வேறுபடுத்துதல்
  rationale: கிரேக்கத்தில் καινήν என்பது Ἰερουσαλήμ என்பதைக் குறிக்கும் பெயரடை. தமிழில் பெரிய/சிறிய எழுத்து வேறுபாடு இல்லாததால், மூலத்தில் இல்லாத பட்டப்பெயர்த் தீர்மானம் சேர்க்கப்படவில்லை.
- issue: மணமகள் உவமையைச் சபையைப் பற்றிய வெளிப்படையான அடையாளமாக விரிவாக்க வேண்டுமா
  choice: ‘மணமகளைப் போல’ என்ற உவமை மட்டும் காக்கப்பட்டது
  alternative: ‘ஆட்டுக்குட்டியானவரின் மணமகளாகிய சபையைப் போல’ என்று விளக்குதல்
  rationale: இவ்வசனம் நகரத்தை மணமகளோடு ஒப்பிடுகிறது; அதன் அடையாளத்தை மொழிபெயர்ப்பிலேயே தீர்மானிப்பது மூலத்தை மீறும் தெய்வீக விளக்கமாகிவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் வெளிப்படுத்தல் நூலின் உயர்வான காட்சிநடையைத் தக்கவைத்தும் மொழிபெயர்க்கப்பட்டது. ‘பரிசுத்த’, ‘ஆயத்தமாக்கப்பட்டிருந்தது’, ‘அலங்கரிக்கப்பட்ட’ ஆகிய சொற்கள் வேதாகமச் செறிவை காக்கின்றன; தேவையற்ற சமயப்பிரிவு சார்ந்த விளக்கங்கள் சேர்க்கப்படவில்லை.
