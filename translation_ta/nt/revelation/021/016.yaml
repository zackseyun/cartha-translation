    issue: Singular form used for a plural Greek measurement unit
    rationale: The phrase ἐπὶ σταδίους δώδεκα χιλιάδων contains the plural σταδίους. “பன்னிரண்டாயிரம் ஸ்தாதியங்கள்” preserves this more clearly than singular “ஸ்தாதியோன்.”
