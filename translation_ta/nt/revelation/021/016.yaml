source:
  edition: SBLGNT
  text: καὶ ἡ πόλις τετράγωνος κεῖται, καὶ τὸ μῆκος αὐτῆς ⸀ὅσον τὸ πλάτος. καὶ ἐμέτρησεν τὴν πόλιν τῷ καλάμῳ ἐπὶ ⸀σταδίους δώδεκα ⸀χιλιάδων· τὸ μῆκος καὶ τὸ πλάτος καὶ τὸ ὕψος αὐτῆς ἴσα ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/016.yaml
  text: 'And the city lies foursquare[a], and its length is as great as its width. And he measured the city with the measuring rod: twelve thousand stadia[c][b]. Its length and width and height are equal.'
translation:
  language: ta
  text: அந்த நகரம் சதுரமாக அமைந்துள்ளது; அதன் நீளம் அதன் அகலத்துக்குச் சமம். அவர் அளவுகோலால்[a] நகரத்தை அளந்தார்; அதன் அளவு பன்னிரண்டாயிரம் ஸ்தாதியங்கள்[b]. அதன் நீளம், அகலம், உயரம் மூன்றும் சமம்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அளவுகோல்’ என்பதற்கான கிரேக்கச் சொல் நேரடியாக ‘நாணல்’ என்றும் பொருள்படும்; இங்கு அது அளக்கும் கருவியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ஸ்தாதியம் என்பது பழங்காலத் தொலைவு அளவலகு. பன்னிரண்டாயிரம் ஸ்தாதியங்கள் என்பது, ஏற்றுக்கொள்ளப்படும் ஸ்தாதியத்தின் துல்லிய நீளத்தைப் பொறுத்து, தோராயமாக 2,220 கிலோமீட்டர் ஆகும்.
    reason: cultural_note
  - marker: c
    text: இதனை விளக்கமாக, ‘நகரம் ஒரு முழுமையான கனசதுரம்’ என்றும் கூறலாம். ஆனால் கிரேக்க உரை அதன் நீளம், அகலம், உயரம் சமம் என்றே நேரடியாகக் கூறுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: τετράγωνος
  choice: சதுரமாக
  rationale: நகரின் நான்கு பக்கங்களைக் கொண்ட சமச்சீரான தரைத்தள வடிவத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; மூன்று பரிமாணங்களும் சமம் என்ற பின்னைய கூற்றை முன்கூட்டியே ‘கனசதுரம்’ என்று விளக்கவில்லை.
- source_word: κεῖται
  choice: அமைந்துள்ளது
  rationale: நகரம் எவ்வாறு அமைந்திருக்கிறது என்பதைக் குறிக்கும் கிரேக்க நிகழ்காலச் சொல்லை இயல்பாகத் தருகிறது.
- source_word: τὸ μῆκος αὐτῆς ὅσον τὸ πλάτος
  choice: அதன் நீளம் அதன் அகலத்துக்குச் சமம்
  rationale: ὅσον குறிக்கும் அளவுச் சமத்துவத்தைத் தெளிவாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: ἐμέτρησεν
  choice: அளந்தார்
  rationale: சூழலில் முன்பு குறிப்பிடப்பட்ட தூதரே எழுவாய்; எளிய இறந்தகால நிகழ்வாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: τῷ καλάμῳ
  choice: அளவுகோலால்
  rationale: κάλαμος என்பதன் அடிப்படைப் பொருள் ‘நாணல்’ என்றாலும், இங்கு அளக்கும் கருவியாகப் பயன்படுத்தப்படுவதால் அதன் செயல்பாட்டைத் தெளிவுபடுத்துகிறது.
- source_word: ἐπὶ σταδίους δώδεκα χιλιάδων
  choice: பன்னிரண்டாயிரம் ஸ்தாதியோன் அளவு
  rationale: மூலத்தின் பழங்கால அளவலகையும் எண்ணையும் பிரதான உரையில் அப்படியே காக்கிறது; ἐπί குறிக்கும் முடிவான அளவு தமிழில் ‘அளவு’ என்பதால் இயல்பாக வெளிப்படுகிறது.
- source_word: τὸ μῆκος καὶ τὸ πλάτος καὶ τὸ ὕψος αὐτῆς ἴσα ἐστίν
  choice: அதன் நீளம், அகலம், உயரம் மூன்றும் சமம்
  rationale: மூன்று பரிமாணங்களின் சமத்துவத்தை மூலத்தில் உள்ளபடியே நேரடியாகக் கூறுகிறது; ‘கனசதுரம்’ என்ற விளக்கச் சொல்லை பிரதான உரையில் சேர்க்கவில்லை.
theological_decisions:
- issue: பழங்கால அளவலகை பிரதான உரையில் வைத்திருப்பதா அல்லது நவீன அளவாக மாற்றுவதா
  choice: ‘பன்னிரண்டாயிரம் ஸ்தாதியோன்’ என்று பழங்கால அளவலகை வைத்திருத்தல்
  alternative: சுமார் 2,220 கிலோமீட்டர் என்று பிரதான உரையிலேயே மாற்றுதல்
  rationale: ஸ்தாதியோனின் துல்லிய நீளம் குறித்த கணிப்புகள் மாறுபடுகின்றன; ஆகவே மூலத்தின் எண்ணையும் அளவலகையும் உரையில் காத்து, நவீன தோராய மதிப்பை அடிக்குறிப்பில் தருவது பொருத்தமானது.
- issue: சமமான மூன்று பரிமாணங்களை எவ்வளவு விளக்கமாக மொழிபெயர்ப்பது
  choice: நீளம், அகலம், உயரம் மூன்றும் சமம் என்று மூலக் கூற்றைப் பாதுகாத்தல்
  alternative: நகரம் ஒரு முழுமையான கனசதுரம் என்று கூறுதல்
  rationale: கனசதுர வடிவம் இக்கூற்றிலிருந்து பெறப்படும் இயல்பான முடிவு என்றாலும், கிரேக்கம் வடிவியல் பெயரைப் பயன்படுத்தாமல் பரிமாணங்களின் சமத்துவத்தையே நேரடியாகக் கூறுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வெளிப்படைத்தன்மையும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘சதுரம்’, ‘அளவுகோல்’, ‘நீளம், அகலம், உயரம்’ போன்ற பரவலாகப் புரியும் சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன. பழங்கால அளவலகான ‘ஸ்தாதியோன்’ ஒலிபெயர்ப்பாகப் பாதுகாக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
