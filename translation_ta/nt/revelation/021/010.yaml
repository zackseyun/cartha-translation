source:
  edition: SBLGNT
  text: καὶ ἀπήνεγκέν με ἐν πνεύματι ἐπὶ ὄρος μέγα καὶ ὑψηλόν, καὶ ἔδειξέν μοι τὴν ⸀πόλιν τὴν ἁγίαν Ἰερουσαλὴμ καταβαίνουσαν ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/010.yaml
  text: And he carried me away in the Spirit onto a great and high mountain[a], and showed me the holy city, Jerusalem, coming down out of heaven from God,
translation:
  language: ta
  text: அவன் என்னை ஆவியில் பெரியதும் உயரமானதுமான ஒரு மலைக்கு அழைத்துச் சென்று, கடவுளிடமிருந்து, வானத்திலிருந்து இறங்கிவந்துகொண்டிருந்த பரிசுத்த நகரமான எருசலேமை எனக்குக் காட்டினான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπήνεγκέν
  choice: கொண்டுபோய்
  rationale: தரிசனச் சூழலில் ஓர் இடத்திலிருந்து மற்றொரு காட்சிநிலைக்கு எடுத்துச் செல்வதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐν πνεύματι
  choice: ஆவியில்
  rationale: வெளிப்படுத்தலில் மீண்டும் வரும் தீர்க்கதரிசனத் தரிசனச் சொற்றொடரைச் சுருக்கமாகப் பாதுகாக்கிறது; பரிசுத்த ஆவியின் செயலா அல்லது ஆவிக்குரிய தரிசன நிலையா என்ற சாத்தியத்தை அடிக்குறிப்பு திறந்துவைக்கிறது.
- source_word: ἐπὶ ὄρος μέγα καὶ ὑψηλόν
  choice: பெரியதும் உயரமானதுமான ஒரு மலைக்கு
  rationale: மலையை நோக்கிய இயக்கத்தையும் μέγα, ὑψηλόν ஆகிய இரு தனித்த பண்புகளையும் தக்கவைக்கிறது.
- source_word: ἔδειξέν μοι
  choice: எனக்குக் காட்டினான்
  rationale: கூடுதல் விளக்கப் பொருளைச் சேர்க்காமல் δείκνυμι என்பதன் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: τὴν πόλιν τὴν ἁγίαν Ἰερουσαλήμ
  choice: பரிசுத்த நகரமாகிய எருசலேமை
  rationale: எருசலேமே அந்தப் பரிசுத்த நகரம் என்பதை இயல்பான தமிழ் இணைப்பால் தெளிவுபடுத்தி, மூலத்தின் பெயரடை மற்றும் இடப்பெயரைப் பாதுகாக்கிறது.
- source_word: καταβαίνουσαν
  choice: இறங்கி வந்துகொண்டிருந்த
  rationale: நகரம் இறங்கும் செயலில் இருந்ததை நிகழ்காலப் பங்கேற்புவினையின் தொடர்ச்சியுடன் வெளிப்படுத்துகிறது.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: வானத்திலிருந்து
  rationale: இறங்குதலின் தொடக்க இடம் வானம் என்பதைத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: ἀπὸ τοῦ θεοῦ
  choice: கடவுளிடமிருந்து
  rationale: நகரத்தின் மூலாதாரம் கடவுள் என்பதை ἀπό குறிக்கும் வகையில் நேரடியாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: ἐν πνεύματι என்பதில் ‘ஆவி’ யாரை அல்லது எதைச் சுட்டுகிறது?
  choice: முதன்மை உரையில் ‘ஆவியில்’
  alternative: ‘ஆவிக்குரிய தரிசன நிலையில்’ அல்லது ‘பரிசுத்த ஆவியால்’
  rationale: ‘பரிசுத்த ஆவியால்’ என்று விரிவாக்குவது குறிப்பைத் தீர்மானித்துவிடும்; ‘ஆவியில்’ என்பது கிரேக்கத்தின் சுருக்கத்தையும் பரிசுத்த ஆவியின் செயல்பாடு மற்றும் தரிசன நிலை ஆகிய பொருள் சாத்தியங்களையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘பரிசுத்த’ என்பது நிலைபெற்ற இறையியல் சொல்; வாக்கிய ஓட்டத்திற்காகப் பங்கேற்பு அமைப்பு இயல்பான தமிழில் மறுசீரமைக்கப்பட்டுள்ளது.
