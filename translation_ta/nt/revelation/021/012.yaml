id: REV.21.12
reference: Revelation 21:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἔχουσα τεῖχος μέγα καὶ ὑψηλόν, ἔχουσα πυλῶνας δώδεκα, καὶ ἐπὶ ⸂τοῖς πυλῶσιν⸃ ἀγγέλους δώδεκα, καὶ ὀνόματα ἐπιγεγραμμένα ἅ ⸀ἐστιν τῶν δώδεκα ⸀φυλῶν υἱῶν Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/012.yaml
  text: having a great and high wall, having twelve gates, and at the gates twelve angels, and names inscribed, which are those of the twelve tribes of the sons of Israel.
translation:
  language: ta
  text: அதற்குப் பெரியதும் உயரமானதுமான ஒரு மதில் இருந்தது. அதற்குப் பன்னிரண்டு வாயில்கள் இருந்தன; அந்த வாயில்களருகே பன்னிரண்டு தூதர்கள் இருந்தார்கள். அவற்றின்மேல் பெயர்கள் பொறிக்கப்பட்டிருந்தன; அவை இஸ்ரவேலின் மகன்களுடைய[a] பன்னிரண்டு கோத்திரங்களின் பெயர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, பாரம்பரியமாக, “இஸ்ரவேலின் பிள்ளைகளுடைய.”
    reason: υἱῶν என்பதற்கான நேரடி ‘மகன்கள்’ என்ற மொழிபெயர்ப்புடன், பாரம்பரியக் கூட்டுப்பொருள் மொழியாக்கத்தையும் வழங்குகிறது.
lexical_decisions:
- source_word: ἔχουσα
  choice: அதற்கு … இருந்தது / இருந்தன
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட நகரத்தை விவரிக்கும் பெண்பால் ஒருமை நிகழ்காலப் பெயரெச்சம். தமிழில் இயல்பாகவும் தெளிவாகவும் அமைய, நகரைக் குறிக்கும் ‘அதற்கு’ என்பதுடன் உடைமை வாக்கியங்களாக மொழிபெயர்க்கப்பட்டது.
- source_word: τεῖχος μέγα καὶ ὑψηλόν
  choice: பெரியதும் உயரமானதுமான ஒரு மதில்
  rationale: μέγα, ὑψηλόν ஆகிய இரு தனித்த பண்புகளையும் விடாமல் காக்கிறது; நகரைச் சூழும் கட்டுமானத்திற்கு ‘மதில்’ இயல்பான சொல்.
- source_word: πυλῶνας δώδεκα
  choice: பன்னிரண்டு வாயில்கள்
  rationale: நகரின் நுழைவிடங்களைக் குறிக்கும் வழக்கமான, எளிதில் புரியும் தமிழாக்கம்.
- source_word: ἐπὶ τοῖς πυλῶσιν
  choice: அந்த வாயில்களருகே
  rationale: ἐπί + dative இங்குக் குறிக்கும் இடப்பொருளை வெளிப்படுத்துகிறது; தூதர்கள் வாயில்களின் மேலேயே இருந்ததாகத் தேவையின்றி உணர்த்தாமல் ‘at the gates’ என்ற கருத்தைக் காக்கிறது.
- source_word: ἀγγέλους δώδεκα
  choice: பன்னிரண்டு தூதர்கள்
  rationale: ἀγγέλους என்பதற்கான நிலையான வேதாகமத் தமிழ்; எண்ணிக்கையும் நேரடியாகக் காக்கப்படுகிறது.
- source_word: ὀνόματα ἐπιγεγραμμένα
  choice: பெயர்கள் பொறிக்கப்பட்டிருந்தன
  rationale: ἐπιγεγραμμένα என்பது மேற்பரப்பில் எழுதப்பட்ட அல்லது பொறிக்கப்பட்ட நிலையைச் சுட்டுகிறது; நினைவுச்சின்னக் கட்டடச் சூழலில் ‘பொறிக்கப்பட்டிருந்தன’ பொருத்தமானது.
- source_word: ἅ ἐστιν
  choice: அவை … பெயர்கள்
  rationale: உறவுப்பெயர் வாக்கியம் எந்தப் பெயர்கள் என்பதை அடையாளப்படுத்துகிறது. தமிழில் மறைமுகமாக உள்ள ‘பெயர்கள்’ என்பதை மீண்டும் சொல்வது தெளிவும் இயல்பும் தருகிறது.
- source_word: φυλῶν
  choice: கோத்திரங்கள்
  rationale: இஸ்ரவேலின் பழங்குடிப் பிரிவுகளுக்கான நிலையான வேதாகமத் தமிழ் சொல்.
- source_word: υἱῶν Ἰσραήλ
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: υἱῶν என்ற ஆண்பால் குடும்ப உறவுச் சொல்லை நேரடியாகக் காக்கிறது; தமிழின் உடைமை அமைப்புக்காக உரையில் ‘மகன்களுடைய’ என வந்துள்ளது.
theological_decisions:
- issue: உடன்படிக்கை மக்களைக் குறிக்கும் நிலையான தொடரில் υἱῶν Ἰσραήλ என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலின் பிள்ளைகள்
  rationale: கிரேக்க மூலத்தில் υἱῶν என்பது குறிப்பாக ‘மகன்கள்’ என்று உள்ளது. ஆகவே முதன்மை உரை அதன் ஆண்பால் குடும்பச் சொல்லைக் காக்கிறது; பரவலாக அறியப்பட்ட கூட்டுப்பொருள் மொழியாக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், மரியாதைமிக்கவும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதாகவும் அமைக்கப்பட்டுள்ளது. நீண்ட கிரேக்கப் பெயரெச்சத் தொடரை மூன்று தொடர்புடைய தமிழ் வாக்கியங்களாகப் பிரித்து வாசிப்புத் தெளிவு பெறப்பட்டுள்ளது; நகரைப் பற்றிய விவரிப்பு, பன்னிரண்டு என்ற மீளுரைத்தல், பெயர்கள் பொறிக்கப்பட்டிருத்தல் ஆகியவை காக்கப்பட்டுள்ளன.
