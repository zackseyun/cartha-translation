source:
  edition: SBLGNT
  text: καὶ οἱ πυλῶνες αὐτῆς οὐ μὴ κλεισθῶσιν ἡμέρας, νὺξ γὰρ οὐκ ἔσται ἐκεῖ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/025.yaml
  text: And its gates will never be shut by day—for there will be no night there—[a][b]
translation:
  language: ta
  text: அதன் வாசல்கள் பகலில் ஒருபோதும் மூடப்படாது; ஏனெனில் அங்கே இரவு இருக்காது.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதிகச் சொற்சார்பாகக் கூறினால், “அதன் வாசல்கள் பகலில் நிச்சயமாக ஒருபோதும் மூடப்படாது.” கிரேக்கத்தில் வலியுறுத்தப்பட்ட மறுப்பு பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: வாசல்கள் மூடப்படாததற்குக் கொடுக்கப்படும் காரணம், “அங்கே இரவு இருக்காது” என்பதாகும்.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: மேலும் (தொடரிணைப்பாக மொழிபெயர்ப்பில் வெளிப்படையாகத் தனிச்சொல்லாக இடப்படவில்லை)
  rationale: καὶ முந்தைய வசனத்திலிருந்து நகரத்தைப் பற்றிய விளக்கத்தைத் தொடர்கிறது. தமிழில் வசனத் தொடர்ச்சியே இந்த இணைப்பை இயல்பாக உணர்த்துவதால், கட்டாயமாக ‘மேலும்’ என்று தொடங்காமல் இருப்பது நடப்பு உரைநடைக்கு ஏற்றது.
- source_word: οἱ πυλῶνες
  choice: வாசல்கள்
  rationale: நகரச் சூழலில் πυλῶνες என்பது நகரத்தின் வாசல்களையோ வாசல் அமைப்புகளையோ குறிக்கிறது. ‘வாசல்கள்’ என்பது புதிய எருசலேமின் உருவகத்துக்கு இயல்பான, தெளிவான தமிழ்ச் சொல்.
- source_word: αὐτῆς
  choice: அதன்
  rationale: இந்தப் பெண்பால் சுட்டுப்பெயர் இலக்கணப் பெண்பாலான நகரத்தைக் குறிக்கிறது. தமிழில் நகரத்தை இயல்பாகச் சுட்ட ‘அதன்’ பொருத்தமானது; தேவையற்ற ஆளுருவாக்கத்தை இது சேர்ப்பதில்லை.
- source_word: οὐ μὴ κλεισθῶσιν
  choice: ஒருபோதும் மூடப்படாது
  rationale: οὐ μή உடன் வரும் இறந்தகாலத் துணைவினை வடிவம் எதிர்காலத்தைப் பற்றிய வலியுறுத்தப்பட்ட மறுப்பைக் காட்டுகிறது. ‘ஒருபோதும்’ அந்த வலியுறுத்தலை இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: ἡμέρας
  choice: பகலில்
  rationale: இங்கு மரபுவேற்றுமை வடிவம் காலத்தைக் குறிக்கும் வினையடையாகச் செயல்படுகிறது. ‘பகலில்’ என்பது சுருக்கமாகவும் அடுத்து வரும் ‘இரவு’ என்பதுடன் நேரடியான முரண்பாட்டையும் காட்டுகிறது.
- source_word: νὺξ γὰρ οὐκ ἔσται ἐκεῖ
  choice: ஏனெனில் அங்கே இரவு இருக்காது
  rationale: γάρ காரணத்தை அறிமுகப்படுத்துகிறது; ἔσται இங்கு இருப்பைக் குறிக்கிறது. இந்த மொழிபெயர்ப்பு வாசல்கள் மூடப்படாததற்கான காரணத்தையும் அங்கே இரவு இல்லாமையையும் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: புதிய எருசலேமுக்கான ஆளுருவாக்கத்தின் அளவு
  choice: ‘அதன் வாசல்கள்’ என்று மொழிபெயர்த்தல்
  alternative: ‘அவளுடைய வாசல்கள்’
  rationale: கிரேக்கப் பெண்பால் சுட்டுப்பெயர் நகரத்தைக் குறிக்கும் சொல்லின் இலக்கணப் பாலுடன் ஒத்துள்ளது. இவ்வசனத்தில் மணமகள் உருவகம் முன்னிலைப்படுத்தப்படாமல், நகரத்தின் எப்போதும் திறந்த நிலையும் இரவு இல்லாமையும் கூறப்படுவதால் தமிழில் இயல்பான ‘அதன்’ தேர்ந்தெடுக்கப்பட்டது.
- issue: வாசல்கள் மூடப்படாததற்கும் இரவு இல்லாமைக்கும் உள்ள தொடர்பு
  choice: γάρ-ஐ ‘ஏனெனில்’ என்று காரண இணைப்பாக வெளிப்படையாக மொழிபெயர்த்தல்
  alternative: இரு கூற்றுகளையும் வெறும் இணைப்பாக அமைத்தல்
  rationale: மூலத்தில் γάρ இரவு இல்லாமையை முந்தைய கூற்றுக்கான காரணமாக வழங்குகிறது. அந்தத் தொடர்பைத் தெளிவாகப் பாதுகாப்பது இறையியல் விளக்கத்தைச் சேர்ப்பதல்ல; மூல வாக்கிய அமைப்பைப் பிரதிபலிப்பதாகும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வாசல்கள்’, ‘பகலில்’, ‘இரவு’ ஆகிய நேரடியான சொற்கள் நகரக் காட்சியையும் பகல்–இரவு முரண்பாட்டையும் பாதுகாக்கின்றன. உயிரற்ற பன்மை எழுவாயான ‘வாசல்கள்’ உடன் ஒருமை வினைமுற்றான ‘மூடப்படாது’ பயன்படுத்துவது இயல்பான தமிழ் இலக்கண வழக்காகும்.
