id: REV.21.13
reference: Revelation 21:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἀπὸ ⸀ἀνατολῆς πυλῶνες τρεῖς, καὶ ἀπὸ βορρᾶ πυλῶνες τρεῖς, καὶ ἀπὸ νότου πυλῶνες τρεῖς, καὶ ἀπὸ δυσμῶν πυλῶνες τρεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/013.yaml
  text: On the east[a], three gates; and on the north, three gates; and on the south, three gates; and on the west, three gates.
translation:
  language: ta
  text: கிழக்குப் பக்கத்தில்[a] மூன்று வாயில்களும், வடக்குப் பக்கத்தில் மூன்று வாயில்களும், தெற்குப் பக்கத்தில் மூன்று வாயில்களும், மேற்குப் பக்கத்தில் மூன்று வாயில்களும் இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல் மொழிபெயர்த்தால், ‘கிழக்கிலிருந்து … வடக்கிலிருந்து … தெற்கிலிருந்து … மேற்கிலிருந்து’ எனலாம்; இங்கு வாயில்கள் அமைந்துள்ள பக்கத்தைக் குறிக்க, இச்சொற்றொடர் இயல்பான தமிழில் மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ ἀνατολῆς
  choice: கிழக்குப் பக்கத்தில்
  rationale: ἀπό என்பதன் அடிப்படைப் பொருள் ‘இருந்து’ என்றாலும், இங்கு நகரத்தின் எந்தப் பக்கத்தில் வாயில்கள் அமைந்துள்ளன என்பதைச் சுட்டுகிறது. ‘கிழக்குப் பக்கத்தில்’ என்பது இயக்கம் அல்லது தோற்றுவாயைக் குறிக்காமல் இடஅமைப்பை இயல்பாகத் தெரிவிக்கிறது.
- source_word: πυλῶνες
  choice: வாயில்கள்
  rationale: πυλών என்பது வாயில் அல்லது பெரிய வாயில் அமைப்பைக் குறிக்கலாம். புதிய எருசலேமின் மதிலிலுள்ள நுழைவிடங்களை விவரிக்கும் இச்சூழலில் ‘வாயில்கள்’ தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: τρεῖς
  choice: மூன்று
  rationale: ஒவ்வொரு பக்கத்திற்கும் எண்ணிக்கை மீண்டும் சொல்லப்படுவதால், மூலத்தின் அளவான சமச்சீர் நடை பாதுகாக்கப்படுகிறது.
- source_word: ἀπὸ βορρᾶ / ἀπὸ νότου / ἀπὸ δυσμῶν
  choice: வடக்குப் பக்கத்தில் / தெற்குப் பக்கத்தில் / மேற்குப் பக்கத்தில்
  rationale: நான்கு திசைகளும் ஒரே இடவியல் அமைப்பில் இணையான முறையில் மொழிபெயர்க்கப்பட்டுள்ளன.
- source_word: καὶ ... καὶ ... καὶ ...
  choice: …உம், …உம், …உம், …உம்
  rationale: தமிழின் இணைப்பும்மையைப் பயன்படுத்தி, கிரேக்கத்தின் தொடர்ச்சியான எண்ணிப்பட்டியல் நடையும் சமச்சீரும் இயல்பாகப் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: புதிய எருசலேமின் வாயில்கள் குறித்த இடவியல் விளக்கம்
  choice: நகரத்தின் நான்கு பக்கங்களிலும் தலா மூன்று வாயில்கள் உள்ளன என்ற நேரடியான கட்டட அமைப்பு விளக்கம்
  alternative: இஸ்ரவேலின் கோத்திர அணிவகுப்பு அல்லது எசேக்கியேலின் ஆலய-நகரக் காட்சியுடன் உள்ள குறியீட்டுத் தொடர்பை மொழிபெயர்ப்பிலேயே வெளிப்படுத்துதல்
  rationale: வசனம் திசைவாரியாக வாயில்களை மட்டும் பட்டியலிடுகிறது. வேதாகம அளவில் குறியீட்டுத் தொடர்புகள் இருக்கக்கூடும்; ஆனால் அவற்றை முதன்மை உரைக்குள் சேர்க்காமல், உரையின் விளக்கத் திறந்தநிலையைப் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் காட்சியின் அளவான, கண்ணியமான, சமச்சீர் நடையைப் பேணும் மொழி பயன்படுத்தப்பட்டுள்ளது. தமிழில் முழுமையான வாக்கியமாக இயல்புற ‘இருந்தன’ சேர்க்கப்பட்டுள்ளது; இது சூழலில் உள்ள இருப்பை வெளிப்படுத்துகிறது, புதிய கருத்தைச் சேர்ப்பதில்லை.
