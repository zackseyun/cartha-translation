  source_fidelity: 'மொழிபெயர்ப்பு மூலக் கிரேக்கத்தின் முக்கிய கூறுகளைத் துல்லியமாகக் காக்கிறது: அரியணையில் அமர்ந்திருப்பவர், கவன ஈர்ப்புச் சொல், நிகழ்காலத்தில் அனைத்தையும் புதிதாக்குதல், நேரடிக் கட்டளை, மற்றும் எழுதுவதற்கான காரணம் ஆகியவை சரியாக உள்ளன. ஆனால் இறுதி நேரடி உரையில் εἰσιν (‘உள்ளன’) என்பதற்குரிய வினைச்சொல் வெளிப்படையாக இடம்பெற வேண்டும்.'
  naturalness: ‘சிங்காசனத்தில் அமர்ந்திருப்பவர்,’ மற்றும் ‘நான் அனைத்தையும் புதிதாக்குகிறேன்’ ஆகியவை இயல்பாகவும் கம்பீரமான நவீனத் தமிழாகவும் உள்ளன. ‘இந்த வார்த்தைகள் நம்பத்தக்கவையும் உண்மையானவையும்’ என்பது வினைச்சொல் இன்றி நிறைவுபெறாததாகத் தோன்றுகிறது; ‘உள்ளன’ சேர்த்தல் அவசியம். குறிப்பு (a) இல் உள்ள மாற்று மொழியாக்கமும் மேலும் இயல்பாக்கப்பட்டுள்ளது.
