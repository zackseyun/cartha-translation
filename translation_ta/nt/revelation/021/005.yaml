id: REV.21.5
reference: Revelation 21:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ εἶπεν ὁ καθήμενος ἐπὶ τῷ θρόνῳ· Ἰδοὺ ⸂καινὰ ποιῶ πάντα⸃. καὶ ⸀λέγει· Γράψον, ὅτι οὗτοι οἱ λόγοι ⸂πιστοὶ καὶ ἀληθινοί⸃ εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/005.yaml
  text: And the one seated on the throne said[a], “Behold, I am making all things new.” And he said, “Write[b], because these words are trustworthy and true.”
translation:
  language: ta
  text: சிங்காசனத்தில் அமர்ந்திருப்பவர், “இதோ, நான் அனைத்தையும் புதிதாக்குகிறேன்[a]” என்று கூறினார். மேலும் அவர், “எழுது; ஏனெனில் இந்த வார்த்தைகள் நம்பத்தக்கவையும் உண்மையானவையும்[b] உள்ளன” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நான் எல்லாவற்றையும் புதிதாக்குகிறேன்” என்றும் மொழிபெயர்க்கலாம். கிரேக்க நிகழ்காலம் தொடரும் செயலைக் குறிக்கலாம்; தமிழிலுள்ள “புதிதாக்குகிறேன்” என்பதும் அதைத் திறந்த நிலையில் வைக்கிறது.
    reason: lexical_and_aspectual_alternative
  - marker: b
    text: “நம்பிக்கைக்குரியவையும் உண்மையானவையும்” என்றும் மொழிபெயர்க்கலாம். πιστοί என்பது இங்கு இந்த வார்த்தைகள் நம்பத்தக்கவை, அவற்றை நம்பலாம் என்ற பொருளைத் தருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καθήμενος ἐπὶ τῷ θρόνῳ
  choice: சிங்காசனத்தில் அமர்ந்திருப்பவர்
  rationale: நிகழ்காலப் பங்கேற்புச் சொல்லின் தொடரும் வருணனைத் தன்மையையும், சிங்காசன அதிகாரப் படிமத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும், சூழலுக்கேற்ற கம்பீரமான உரையாடல் குறியாக உள்ளது.
- source_word: καινὰ ποιῶ πάντα
  choice: நான் அனைத்தையும் புதிதாக்குகிறேன்
  rationale: ποιέω என்பதற்கு இல்லாத ‘படைக்கிறேன்’ என்ற குறிப்பிட்ட நுணுக்கத்தைச் சேர்க்காமல், πάντα என்பதன் முழுமையான பரப்பையும் καινά என்பதன் புதுமையையும் காக்கிறது. நிகழ்கால வடிவமும் தமிழில் இயல்பாகப் பிரதிபலிக்கப்படுகிறது.
- source_word: Γράψον
  choice: எழுது
  rationale: மூலத்தில் வெளிப்படையாக இல்லாத செயப்படுபொருளைச் சேர்க்காமல் நேரடியான கட்டளையை வழங்குகிறது.
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: எழுதும்படி கூறுவதற்கான காரணத்தை அறிமுகப்படுத்தும் பயன்பாடாக இங்கு வாசிக்கப்படுகிறது.
- source_word: οὗτοι οἱ λόγοι
  choice: இந்த வார்த்தைகள்
  rationale: முன்னர் உரைக்கப்பட்ட வெளிப்பாட்டு மொழியைக் குறிக்கும் இயல்பான, பரந்த தமிழ் சொற்றொடர்.
- source_word: πιστοὶ καὶ ἀληθινοί
  choice: நம்பத்தக்கவையும் உண்மையானவையும்
  rationale: முதல் பெயரடை இந்த வார்த்தைகளைச் சார்ந்திருப்பதற்குரியவை எனவும், இரண்டாவது அவை உண்மையானவை எனவும் கூறும் இரட்டைக் கூற்றைத் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: καινὰ ποιῶ πάντα என்பதில் இறுதிக்காலப் புதுப்பித்தலின் இயல்பும் பரப்பும்
  choice: நான் அனைத்தையும் புதிதாக்குகிறேன்
  alternative: நான் எல்லாவற்றையும் புதியவையாக்குகிறேன்
  rationale: அனைத்தும் முற்றாக மாற்றீடு செய்யப்படுகிறதா அல்லது மாற்றிப் புதுப்பிக்கப்படுகிறதா என்பதைத் தீர்மானிக்காமல், மூலத்தில் உள்ள விரிவான பரப்பையும் கருத்தியல் இழுபறியையும் காக்கிறது.
- issue: சிங்காசனத்தில் இருப்பவரின் அடையாளப்படுத்தல்
  choice: சிங்காசனத்தில் அமர்ந்திருப்பவர்
  alternative: சிங்காசனத்தில் அமர்ந்திருக்கிறவர்
  rationale: வசனம் அளிக்கும் சிங்காசனப் படிமத்துக்கு அப்பால் பேச்சாளரை மேலதிக இறையியல் அடையாளங்களால் வரையறுக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வெளிப்படுத்தல் நூலின் கம்பீரத்தைக் காக்கும் வகையிலும் மொழியாக்கம் செய்யப்பட்டுள்ளது. நேரடி உரையின் வலிமை காக்கப்பட்டு, தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
