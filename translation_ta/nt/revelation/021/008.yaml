id: REV.21.8
reference: Revelation 21:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τοῖς δὲ δειλοῖς καὶ ⸀ἀπίστοις καὶ ἐβδελυγμένοις καὶ φονεῦσι καὶ πόρνοις καὶ φαρμάκοις καὶ εἰδωλολάτραις καὶ πᾶσι τοῖς ψευδέσιν τὸ μέρος αὐτῶν ἐν τῇ λίμνῃ τῇ καιομένῃ πυρὶ καὶ θείῳ, ὅ ἐστιν ὁ θάνατος ὁ δεύτερος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/008.yaml
  text: But for the cowardly and unbelieving and detestable and murderers and sexually immoral and sorcerers and idolaters and all liars[a], their portion will be in the lake burning with fire and sulfur[c][b], which is the second death.
translation:
  language: ta
  text: ஆனால், கோழைகளுக்கும், நம்பாதவர்களுக்கும்[a], அருவருப்பானவர்களுக்கும், கொலைகாரர்களுக்கும், பாலியல் ஒழுக்கக்கேட்டில் ஈடுபடுகிறவர்களுக்கும், மந்திரவாதிகளுக்கும், சிலைவழிபாட்டாளர்களுக்கும், பொய்யர்கள் அனைவருக்கும் உரிய பங்கு நெருப்பாலும் கந்தகத்தாலும் எரிகிற ஏரியில்தான் இருக்கும்[b]. அதுவே இரண்டாம் மரணம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “விசுவாசமற்றவர்கள்” அல்லது “உண்மையற்றவர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: மூலத்திலுள்ள ἄπιστος என்பது நம்பாமையையும் விசுவாசமின்மை அல்லது உண்மைத்தவறுதலையும் குறிக்கக்கூடும்.
  - marker: b
    text: “கந்தகம்” என்பதற்குப் பாரம்பரிய ஆங்கில மொழிபெயர்ப்பில் “brimstone” என்று உள்ளது.
    reason: θείῳ என்பதன் பொருள் கந்தகம்; பாரம்பரிய மொழிபெயர்ப்பு வழக்கைச் சுட்டுகிறது.
lexical_decisions:
- source_word: δειλοῖς
  choice: கோழைகளுக்கும்
  rationale: இச்சொல் சாதாரண பயத்தை அல்ல, கண்டனத்துக்குரிய கோழைத்தனத்தைச் சுட்டுகிறது; நவீன தமிழில் ‘கோழைகள்’ அதன் அறநெறி வலிமையைத் தெளிவாகத் தருகிறது.
- source_word: ἀπίστοις
  choice: நம்பாதவர்களுக்கும்
  rationale: இச்சூழலில் கடவுளை நம்பாதவர்களைக் குறிக்கும் வாசிப்பு நேரடியானது; ‘விசுவாசமற்றவர்கள்/உண்மையற்றவர்கள்’ என்ற சாத்தியப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐβδελυγμένοις
  choice: அருவருப்புக்குரியவர்களுக்கும்
  rationale: அருவருப்பான அல்லது தீட்டானவற்றால் அடையாளப்படுத்தப்பட்டவர்களை வலுவாகக் குறிக்கிறது; வெறும் ‘வெறுக்கப்படுகிறவர்கள்’ என்று பொருள்படாதவாறு இந்த வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: φονεῦσι
  choice: கொலைகாரர்களுக்கும்
  rationale: φονεύς என்பது பொதுவாகக் கொலை செய்பவரைக் குறிக்கிறது; எல்லாவகையான உயிர்க்கொலையையும் அளவுக்கு மீறி உள்ளடக்கும் சொல்லைத் தவிர்க்கிறது.
- source_word: πόρνοις
  choice: பாலியல் ஒழுக்கக்கேட்டில் ஈடுபடுகிறவர்களுக்கும்
  rationale: பாலியல் முறைகேட்டில் ஈடுபடுவோரை விரிவாகக் குறிக்கும்; குறுகிய அல்லது பழமையான தமிழ்ச் சொல்லைத் தவிர்த்து இயல்பாகத் தருகிறது.
- source_word: φαρμάκοις
  choice: மந்திரவாதிகளுக்கும்
  rationale: வெளிப்படுத்தின விசேஷத்தின் சூழலில் மந்திரம் அல்லது மறைமாந்திரீகச் செயல்களைப் புரிபவர்களைக் குறிக்கிறது; மருந்தாளர்கள் என்ற நவீன பொருள் இங்கு பொருந்தாது.
- source_word: εἰδωλολάτραις
  choice: சிலைவழிபாட்டாளர்களுக்கும்
  rationale: சிலைகள் அல்லது விக்கிரகங்களை வழிபடுவோரை நேரடியாகவும் பொதுவாகப் புரியும் தமிழிலும் குறிக்கிறது.
- source_word: πᾶσι τοῖς ψευδέσιν
  choice: பொய்யர்கள் அனைவருக்கும்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட ψευδής என்பதற்கு இப்பட்டியலில் ‘பொய்யர்கள்’ என்பது தெளிவான இயல்பான தமிழ்.
- source_word: τὸ μέρος αὐτῶν
  choice: அவர்களுக்கு உரிய பங்கு ... இருக்கும்
  rationale: μέρος இங்கு ஒதுக்கப்பட்ட பங்கு அல்லது இறுதி முடிவைக் குறிக்கிறது; வினைச்சொல்லற்ற கிரேக்க வாக்கியம் தமிழில் இயல்பாக இருக்க ‘இருக்கும்’ சேர்க்கப்பட்டது.
- source_word: ἐν τῇ λίμνῃ τῇ καιομένῃ πυρὶ καὶ θείῳ
  choice: நெருப்பும் கந்தகமும் கொண்டு எரிகிற ஏரியில்
  rationale: καιομένῃ ஏரியை விவரிக்கும் நிகழ்காலப் பெயரெச்சம்; θείον என்பதற்கு நவீன தமிழில் துல்லியமான ‘கந்தகம்’ பயன்படுத்தப்படுகிறது.
- source_word: ὅ ἐστιν ὁ θάνατος ὁ δεύτερος
  choice: இதுவே இரண்டாம் மரணம்
  rationale: முந்தைய ஏரி உருவகத்தை இரண்டாம் மரணம் என்று அடையாளப்படுத்தும் விளக்க வலிமையை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: தீர்ப்புப் பட்டியலில் ἄπιστος என்பதன் பொருள்
  choice: நம்பாதவர்கள்
  alternative: விசுவாசமற்றவர்கள் அல்லது உண்மையற்றவர்கள்
  rationale: புதிய படைப்புக்கு வெளியே தீர்ப்புக்குள்ளாவோரின் பட்டியலில் ‘நம்பாதவர்கள்’ என்பது நேரடியான வாசிப்பு. ஆயினும் இச்சொல் விசுவாசமின்மை அல்லது உண்மைத்தவறுதலையும் குறிக்கக்கூடும் என்பதால் அந்தப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: θείῳ என்பதன் மொழிபெயர்ப்பு
  choice: கந்தகம்
  alternative: பழைய மொழிபெயர்ப்பு மரபுகளில் காணப்படும் வேறு வழக்குச் சொற்கள்
  rationale: மூலச் சொல் sulfur-ஐக் குறிக்கிறது; ‘கந்தகம்’ நவீன நிலையான தமிழில் துல்லியமும் புரிதலும் உடையது.
- issue: ὅ என்ற சார்புப்பெயரின் முன்னிலை
  choice: எரியும் ஏரியை ‘இரண்டாம் மரணம்’ என்று அடையாளப்படுத்துதல்
  alternative: முழுத் தீர்ப்பு நிகழ்வையும் பொதுவாகக் குறித்தல்
  rationale: ὅ என்ற நடுநிலை ஒருமை சார்புப்பெயர் முந்தைய ஏரி உருவகத்தைத் தொகுத்துச் சுட்டுகிறது; தமிழ் வாக்கியத்தில் ‘இதுவே’ என்பது அந்த விளக்கத் தொடர்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டது. கிரேக்கத்தின் தொடர்ச்சியான καί பட்டியல் தமிழில் மீள்முறை ‘-க்கும்’ இணைப்பால் ஓரளவு பாதுகாக்கப்பட்டுள்ளது. ‘மந்திரவாதிகள்’, ‘சிலைவழிபாட்டாளர்கள்’, ‘இரண்டாம் மரணம்’ போன்ற சொற்கள் பொதுவாகப் புரியும் வேதாகமப் பதிவைத் தக்கவைக்கின்றன; தேவையற்ற பழமைநடை தவிர்க்கப்பட்டுள்ளது.
