  to: ஆனால், கோழைகளுக்கும், நம்பாதவர்களுக்கும்[a], அருவருப்பானவர்களுக்கும், கொலைகாரர்களுக்கும், பாலியல் ஒழுக்கக்கேட்டில் ஈடுபடுகிறவர்களுக்கும், மந்திரவாதிகளுக்கும், சிலைவழிபாட்டாளர்களுக்கும், பொய்யர்கள் அனைவருக்கும் உரிய பங்கு நெருப்பாலும் கந்தகத்தாலும் எரிகிற ஏரியில்தான் இருக்கும்[b]. அதுவே இரண்டாம் மரணம்.
