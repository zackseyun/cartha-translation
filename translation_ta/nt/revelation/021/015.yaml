reference: Revelation 21:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ὁ λαλῶν μετ’ ἐμοῦ εἶχεν μέτρον κάλαμον χρυσοῦν, ἵνα μετρήσῃ τὴν πόλιν καὶ τοὺς πυλῶνας αὐτῆς καὶ τὸ τεῖχος αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/015.yaml
  text: And the one speaking with me had a golden measuring rod[a], so that he might measure the city and its gates and its wall.
translation:
  language: ta
  text: என்னோடு பேசிக்கொண்டிருந்தவர், நகரத்தையும் அதன் வாயில்களையும் அதன் மதிலையும் அளப்பதற்காக, பொன்னாலான ஓர் அளவுகோலை[a] வைத்திருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பொன்னாலான அளவிடும் நாணல்.’ κάλαμος என்ற கிரேக்கச் சொல் நேரடியாக ‘நாணல்’ என்று பொருள்படும்; இங்கு அது அளப்பதற்குப் பயன்படுத்தப்படும் கோலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαλῶν μετ’ ἐμοῦ
  choice: என்னோடு பேசிக்கொண்டிருந்தவர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புவினை, நடந்துகொண்டிருந்த பேச்சை இயல்பான தமிழில் வெளிப்படுத்துகிறது. இவ்வசனத்தில் இல்லாத ‘தூதர்’ என்ற அடையாளம் சேர்க்கப்படவில்லை.
- source_word: εἶχεν
  choice: வைத்திருந்தார்
  rationale: ἔχω என்பதன் இறந்தகாலத் தொடர்நிலை வடிவம் உடைமையையோ கைவசம் இருப்பதையோ குறிக்கிறது. ‘வைத்திருந்தார்’ என்பது அவர் அளவுகோலைக் கொண்டிருந்தார் என்பதை இயல்பாகக் கூறுகிறது; ‘பிடித்திருந்தார்’ எனக் குறிப்பாகக் கையில் வைத்திருந்ததாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: μέτρον κάλαμον χρυσοῦν
  choice: பொன்னாலான ஓர் அளவுகோல்
  rationale: μέτρον மற்றும் κάλαμος இணைந்து அளப்பதற்கான கருவியைக் குறிக்கின்றன. ‘அளவுகோல்’ அதன் செயல்பாட்டைத் தெளிவாகச் சொல்கிறது; κάλαμος என்பதன் நேரடியான ‘நாணல்’ உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἵνα μετρήσῃ
  choice: அளப்பதற்காக
  rationale: ἵνα உடன் வரும் வினை வடிவம் நோக்கத்தைத் தெரிவிக்கிறது. ‘அளப்பதற்காக’ என்பது அந்த நோக்கத்தைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: τὴν πόλιν
  choice: நகரத்தை
  rationale: πόλις என்பதற்கான நேரான, சூழலுக்கேற்ற தமிழ் சொல். புதிய எருசலேம் என்று இவ்வசனத்தில் வெளிப்படையாக இல்லாத பெயர் சேர்க்கப்படவில்லை.
- source_word: τοὺς πυλῶνας αὐτῆς
  choice: அதன் வாயில்களை
  rationale: πυλών என்பது வாயில் அல்லது நுழைவாயிலைக் குறிக்கும். நகரக் கட்டமைப்பின் சூழலில் ‘வாயில்கள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: τὸ τεῖχος αὐτῆς
  choice: அதன் மதிலை
  rationale: τεῖχος என்பது நகரத்தைச் சூழும் பாதுகாப்புச் சுவரைக் குறிக்கிறது. நகரச் சூழலில் ‘மதில்’ துல்லியமான, வழக்கிலுள்ள தமிழ் சொல்.
theological_decisions:
- issue: பேசுகிறவரை வெளிப்படையாகத் தூதர் என்று அடையாளப்படுத்தலாமா
  choice: ‘என்னோடு பேசிக்கொண்டிருந்தவர்’ என்று மூலத்தின் விளக்கச் சொல்லாட்சியைத் தக்கவைத்தல்
  alternative: ‘என்னோடு பேசிக்கொண்டிருந்த தூதர்’
  rationale: விரிந்த சூழல் அவரைத் தூதர்களில் ஒருவராக அடையாளப்படுத்தினாலும், இவ்வசனம் ‘தூதர்’ என்ற பெயர்ச்சொல்லைப் பயன்படுத்தவில்லை. ஆகவே மூலத்தில் வெளிப்படையாக இல்லாத அடையாளம் உரைக்குள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன செந்தமிழ் நடை பயன்படுத்தப்பட்டுள்ளது. ‘பேசிக்கொண்டிருந்தவர்’ தொடர்ச்சியான செயலை இயல்பாக வெளிப்படுத்துகிறது; ‘மதில்’ நகரச் சுவரைக் குறிக்கும் dignified, பொதுவாகப் புரியக்கூடிய சொல். வாக்கிய வரிசை தமிழில் இயல்பாக இருக்கும்படி நோக்கக் கூறு முன்வைக்கப்பட்டுள்ளது; மூலத்தின் மூன்று அளவிடப்படும் கூறுகளும் தனித்தனியாகத் தக்கவைக்கப்பட்டுள்ளன.
