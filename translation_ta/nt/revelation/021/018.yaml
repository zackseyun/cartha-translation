source:
  edition: SBLGNT
  text: ⸀καὶ ἡ ἐνδώμησις τοῦ τείχους αὐτῆς ἴασπις, καὶ ἡ πόλις χρυσίον καθαρὸν ὅμοιον ὑάλῳ καθαρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/018.yaml
  text: And the material of its wall was jasper[a], and the city was pure gold[b], like pure glass.
translation:
  language: ta
  text: அதன் மதிலின் கட்டுமானப் பொருள் யாஸ்பர் கல்[a]; நகரமோ தூய தங்கத்தால் ஆனது—தூய கண்ணாடியைப் போன்றது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதன் மதிலின் கட்டுமானம் யாஸ்பர் கல்லால் ஆனது.” கிரேக்கச் சொல் கட்டும் பணியையோ, கட்டப்பட்டதன் பொருள் அல்லது அமைப்பையோ குறிக்கலாம். யாஸ்பர் எனப்படும் பண்டைய ரத்தினத்தின் நவீன கனிம அடையாளம் உறுதியானதல்ல.
    reason: lexical_alternative
  - marker: b
    text: “தூய கண்ணாடி” என்பது தெளிவான அல்லது ஒளியூடுருவும் கண்ணாடியையும் குறிக்கலாம்; இந்த ஒப்புமை நகரத்தின் ஒளிரும் தெளிவை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδώμησις
  choice: கட்டுமானப் பொருள்
  rationale: இந்தச் சொல் கட்டுமானத்தையோ கட்டப்பட்டதன் பொருள்/அமைப்பையோ குறிக்கலாம். ἴασπις என்ற பயனிலை மற்றும் நகரத்தின் பொருளைப் பற்றிய அடுத்த விளக்கம் ஆகியவற்றால், இங்கு ‘கட்டுமானப் பொருள்’ என்பது இயல்பாகவும் துல்லியமாகவும் பொருந்துகிறது.
- source_word: τεῖχος
  choice: மதில்
  rationale: இது குறிப்பாக நகரத்தைச் சுற்றிய பாதுகாப்புச் சுவரைக் குறிக்கிறது; தமிழில் ‘மதில்’ சுருக்கமாகவும் துல்லியமாகவும் உள்ளது.
- source_word: ἴασπις
  choice: படிகப்பச்சைக்கல்
  rationale: பண்டைய ἴασπις எந்த நவீன கனிமத்துடன் முற்றிலும் ஒத்தது என்பது உறுதியல்ல. தமிழில் வேதாகமப் பயன்பாட்டில் அறியப்படும் ரத்தினப்பெயரைப் பயன்படுத்தி, அந்தப் பழமையான பெயரின் தனித்தன்மை காக்கப்படுகிறது.
- source_word: χρυσίον καθαρόν
  choice: தூய தங்கம்
  rationale: χρυσίον பொருளாகிய தங்கத்தையும் καθαρόν அதன் கலப்பின்மையையும் குறிக்கின்றன.
- source_word: ὅμοιον
  choice: போன்றது
  rationale: ஒப்புமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὕαλῳ καθαρῷ
  choice: தூய கண்ணாடி
  rationale: ὕαλος கண்ணாடி அல்லது கண்ணாடிபோன்ற பொருளைக் குறிக்கிறது; καθαρός என்பதன் சொற்பொருளான ‘தூய’ என்பதைக் காத்து, அதன் தெளிவு/ஒளியூடுருவும் தன்மையை அடிக்குறிப்பில் விளக்குகிறது.
