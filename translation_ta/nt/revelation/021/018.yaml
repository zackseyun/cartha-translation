translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமும் வாசிப்பின் இயல்பும் காக்கப்பட்டுள்ளன. ‘மதில்’ நகரச் சுவரைத் துல்லியமாகக் குறிக்கிறது. மூலத்தின் இரு καθαρός பயன்பாடுகளையும் ‘தூய’ என்று ஒரேவிதமாக மொழிபெயர்த்து, கண்ணாடியைப் பற்றிய இடத்தில் உள்ள தெளிவு சார்ந்த நுண்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
