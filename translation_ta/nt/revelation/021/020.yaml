  naturalness: சுருக்கமான பட்டியல்-நடை நவீன நிலையான தமிழில் இயல்பாக உள்ளது. அரைப்புள்ளிகள் கிரேக்கப் பட்டியலின் பிரிக்கப்பட்ட, மீளும் ஓசையை நன்கு பேணுகின்றன. தொழில்நுட்ப இரத்தினப் பெயர்களுக்கான ஒலிபெயர்ப்புகள் இச்சூழலில் பொருத்தமானவை.
