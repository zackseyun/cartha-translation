source:
  edition: SBLGNT
  text: ὁ πέμπτος σαρδόνυξ, ὁ ἕκτος σάρδιον, ὁ ἕβδομος χρυσόλιθος, ὁ ὄγδοος βήρυλλος, ὁ ἔνατος τοπάζιον, ὁ δέκατος χρυσόπρασος, ὁ ἑνδέκατος ὑάκινθος, ὁ δωδέκατος ἀμέθυστος·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/020.yaml
  text: the fifth[a], sardonyx; the sixth, sardius; the seventh, chrysolite; the eighth, beryl; the ninth, topaz; the tenth[b], chrysoprase; the eleventh, jacinth; the twelfth, amethyst.
translation:
  language: ta
  text: ஐந்தாவது, சார்டோனிக்ஸ்; ஆறாவது, சார்டியஸ்[a]; ஏழாவது, கிரிசோலைட்; எட்டாவது, பெரில்; ஒன்பதாவது, டோபாஸ்; பத்தாவது, கிரிசோபிரேஸ்; பதினொன்றாவது, ஜெசிந்த்[b]; பன்னிரண்டாவது, அமெதிஸ்ட்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சார்டியஸ்’ என்பதற்கு ‘கார்னீலியன்’ என்றும் மொழிபெயர்க்கலாம்; பழங்காலத்தில் குறிக்கப்பட்ட துல்லியமான இரத்தினம் எது என்பது உறுதியல்ல.
    reason: lexical_alternative
  - marker: b
    text: ‘ஜெசிந்த்’ என்பதை ‘ஹயசிந்த்’ என்றும் வழங்கலாம்; கிரேக்கச் சொல் இங்கு மலரை அல்ல, ஓர் இரத்தினக் கல்லைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέμπτος … δωδέκατος
  choice: ஐந்தாவது … பன்னிரண்டாவது
  rationale: கிரேக்க மூலத்தின் வரிசை எண்களையும் பட்டியலின் திரும்பத் திரும்ப வரும் அமைப்பையும் இயல்பான தமிழில் நேரடியாகப் பேணுகிறது.
- source_word: σαρδόνυξ
  choice: சார்டோனிக்ஸ்
  rationale: பழங்கால இரத்தினத்தின் பெயரை, அதற்கான வழக்கமான நவீன கனிமப் பெயரின் தமிழ் ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: σάρδιον
  choice: சார்டியஸ்
  rationale: σαρδόνυξ என்பதிலிருந்து வேறுபாட்டைப் பேணுவதற்கும், பழங்காலக் கல்லின் துல்லியமான அடையாளம் உறுதியல்ல என்பதைக் கருத்தில் கொள்வதற்கும் பாரம்பரியப் பெயரின் ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- source_word: χρυσόλιθος
  choice: கிரிசோலைட்
  rationale: சொற்பிறப்பின்படி ‘பொற்கல்’ என்று மொழிபெயர்ப்பதைவிட, அறியப்பட்ட இரத்தினப் பெயரைப் பயன்படுத்துவது பட்டியலில் தெளிவாகவும் இயல்பாகவும் உள்ளது; பழங்கால அடையாளம் முழுமையாக உறுதியானது அல்ல.
- source_word: βήρυλλος
  choice: பெரில்
  rationale: இந்த இரத்தினத்துக்கான நிலைபெற்ற நவீன கனிமப் பெயரின் தமிழ் வடிவம்.
- source_word: τοπάζιον
  choice: டோபாஸ்
  rationale: கிரேக்க இரத்தினப் பெயருக்கான பரவலாக அறியப்பட்ட நவீன பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: χρυσόπρασος
  choice: கிரிசோபிரேஸ்
  rationale: சொற்பிறப்பை விளக்கமாக விரிப்பதற்குப் பதிலாக, நிலைபெற்ற இரத்தினப் பெயரை ஒலிபெயர்ப்பது துல்லியத்தையும் வாசிப்புத் தெளிவையும் பேணுகிறது.
- source_word: ὑάκινθος
  choice: ஜெசிந்த்
  rationale: இங்கு மலரை அல்ல, இரத்தினக் கல்லைக் குறிக்கும் பாரம்பரிய கனிமப் பெயரைக் கொண்டு மொழிபெயர்க்கப்படுகிறது; மாற்றுப் பெயர் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἀμέθυστος
  choice: அமெதிஸ்ட்
  rationale: இந்த இரத்தினத்துக்கான பரவலாகப் பயன்படும் நவீன பெயரின் தமிழ் ஒலிபெயர்ப்பு.
