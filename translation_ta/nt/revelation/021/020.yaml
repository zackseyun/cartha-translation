translation_notes:
  register: நவீன நிலையான தமிழில், கிரேக்கப் பட்டியலின் சுருக்கமான ஓசையையும் அரைப்புள்ளிகளால் பிரிக்கப்பட்ட வரிசை அமைப்பையும் பேணுகிறது. உறுதியாக அடையாளம் காண முடியாத பழங்கால இரத்தினங்களுக்கு ஊகமான பாரம்பரியத் தமிழ்ப் பெயர்களைத் திணிக்காமல், அடையாளம் காணக்கூடிய நவீன கனிமப் பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன.
