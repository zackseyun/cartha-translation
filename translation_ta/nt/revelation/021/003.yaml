  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἤκουσα φωνῆς μεγάλης ἐκ τοῦ ⸀θρόνου λεγούσης· Ἰδοὺ ἡ σκηνὴ τοῦ θεοῦ μετὰ τῶν ἀνθρώπων, καὶ σκηνώσει μετ’ αὐτῶν, καὶ αὐτοὶ ⸀λαοὶ αὐτοῦ ἔσονται, καὶ αὐτὸς ὁ θεὸς ⸂μετ’ αὐτῶν ἔσται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/003.yaml
  text: And I heard a loud voice from the throne saying[a], “Behold, the dwelling place of God is with humanity, and he will dwell with them, and they will be his peoples[d][c][b], and God himself will be with them.”
translation:
  language: ta
  text: 'சிங்காசனத்திலிருந்து வந்த உரத்த குரல் ஒன்று கூறுவதை நான் கேட்டேன்: “இதோ, கடவுளின் கூடாரம்[a] மனிதர்களோடு[b] இருக்கிறது. அவர் அவர்களோடு குடியிருப்பார்[c]. அவர்கள் அவருடைய பல்வேறு மக்களாக[d] இருப்பார்கள். கடவுள் தாமே அவர்களோடு இருப்பார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கூடாரம்’ என்பதற்கான கிரேக்கச் சொல் σκηνή; இது ‘உறைவிடம்’ என்றும் பொருள்படலாம், மேலும் இறைவனுடைய திருக்கூடாரத்தை நினைவூட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் ‘மனிதர்கள்’ என்று உள்ளது; இது ஆண்களை மட்டும் அல்லாமல் மனிதகுலத்தைப் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘குடியிருப்பார்’ என்பதற்கான கிரேக்க வினைச்சொல், ‘கூடாரம்’ என்பதற்கான சொல்லோடு தொடர்புடையது; இன்னும் சொற்பட, ‘அவர்களோடு கூடாரமிட்டுத் தங்குவார்.’
    reason: lexical_alternative
  - marker: d
    text: கிரேக்கத்தில் ‘மக்கள்’ என்பது பன்மையில் உள்ளது; பாரம்பரியமாக வரும் ஒருமையான ‘மக்கள்’ அல்ல.
    reason: alternative_reading
lexical_decisions:
- source_word: φωνῆς μεγάλης
  choice: உரத்த குரல்
  rationale: μέγας இங்கு குரலின் அளவை அல்ல, அதன் வலிமையையும் ஒலியளவையும் குறிக்கிறது; ‘உரத்த குரல்’ இயல்பான நவீனத் தமிழ்.
- source_word: ἐκ τοῦ θρόνου
  choice: சிங்காசனத்திலிருந்து வந்த
  rationale: ἐκ குரலின் மூலத்தைச் சுட்டுகிறது. வெளிப்படுத்தின விசேஷத்தின் சிங்காசனக் காட்சியையும் நேரடியாகத் தக்கவைக்கிறது.
- source_word: Ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் ἰδού என்பதன் உயர்ந்த, அறிவிப்புக்குரிய தொனியை ‘இதோ’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἡ σκηνὴ τοῦ θεοῦ
  choice: கடவுளின் கூடாரம்
  rationale: σκηνή என்பதன் நேரடியான கூடார உருவகத்தையும், கடவுள் மனிதர்களிடையே தங்கியிருக்கும் கருத்தையும் தக்கவைக்கிறது.
- source_word: μετὰ τῶν ἀνθρώπων
  choice: மனிதர்களோடு
  rationale: ἄνθρωποι இங்கு ஆண்களை மட்டும் அல்லாமல் மனிதர்களைப் பொதுவாகக் குறிக்கிறது.
- source_word: σκηνώσει
  choice: குடியிருப்பார்
  rationale: σκηνόω தங்குதல் அல்லது கூடாரமிட்டுத் தங்குதல் என்று பொருள்படும். ‘குடியிருப்பார்’ தெளிவான தமிழில் தொடர்ந்திருக்கும் உடனிருப்பை வெளிப்படுத்துகிறது; பெயர்ச்சொல்லுடனான உருவகத் தொடர்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: λαοὶ αὐτοῦ
  choice: அவருடைய மக்கள் கூட்டங்கள்
  rationale: λαοί பன்மை என்பதால் வழக்கமான ஒருமையான ‘மக்கள்’ என்று சமப்படுத்தாமல், பல மக்கள் சமூகங்களைக் குறிக்கும் பன்மையைத் தக்கவைக்கிறது.
- source_word: αὐτὸς ὁ θεός
  choice: கடவுள் தாமே
  rationale: αὐτός தரும் வலியுறுத்தலை மரியாதைமிக்க தமிழில் ‘தாமே’ தெளிவாகக் காட்டுகிறது.
- source_word: μετ’ αὐτῶν ἔσται
  choice: அவர்களோடு இருப்பார்
  rationale: எளிய எதிர்கால உடனிருப்பை இயல்பான தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: λαοὶ என்ற பன்மைக்கும் பாரம்பரிய ஒருமையான ‘மக்கள்’ என்பதற்கும் இடையிலான வேறுபாடு
  choice: அவர்கள் அவருடைய மக்கள் கூட்டங்களாக இருப்பார்கள்
  alternative: அவர்கள் அவருடைய மக்களாக இருப்பார்கள்
  rationale: SBLGNT உரையில் λαοί பன்மையில் உள்ளது. அதைத் தக்கவைப்பது பல மக்கள் சமூகங்கள் கடவுளுக்குரியவர்களாவதை உரை எவ்வாறு சொல்கிறதோ அவ்வாறே காட்டுகிறது; அவர்களுடைய ஒற்றுமை எவ்வாறு புரிந்துகொள்ளப்பட வேண்டும் என்பதை மொழிபெயர்ப்பு முன்கூட்டியே தீர்மானிப்பதில்லை.
- issue: σκηνή / σκηνόω என்பவற்றின் கூடார உருவகம்
  choice: கடவுளின் கூடாரம் ... குடியிருப்பார்
  alternative: கடவுளின் உறைவிடம் ... தங்குவார்
  rationale: பெயர்ச்சொல்லில் கூடார உருவகம் நேரடியாகத் தக்கவைக்கப்படுகிறது; வினைச்சொல் நவீனத் தமிழில் வாசிக்க இயலுமாறு வழங்கப்படுகிறது. இரண்டிற்குமுள்ள கிரேக்கச் சொல் தொடர்பு அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வெளிப்படுத்தின விசேஷத்தின் மேன்மையான அறிவிப்புத் தொனி குன்றாத வகையிலும் மொழியாக்கப்பட்டுள்ளது. ‘கடவுள்’, ‘இதோ’, ‘சிங்காசனம்’ ஆகிய சொற்கள் தெளிவையும் கண்ணியத்தையும் பேணுகின்றன; அரிதான சமயத் தொழில்நுட்பச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
