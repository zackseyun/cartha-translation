id: REV.21.11
reference: Revelation 21:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἔχουσαν τὴν δόξαν τοῦ θεοῦ· ὁ φωστὴρ αὐτῆς ὅμοιος λίθῳ τιμιωτάτῳ, ὡς λίθῳ ἰάσπιδι κρυσταλλίζοντι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/011.yaml
  text: having the glory of God[a]; its radiance was like a most precious stone, like a jasper stone[b], clear as crystal.
translation:
  language: ta
  text: கடவுளின் மகிமையைக் கொண்டிருந்தது; அதன் ஒளிவீச்சு மிகவும் விலையுயர்ந்த ஒரு கல்லைப் போலவும், படிகம்போல் ஒளிரும் யாஸ்பர் கல்லைப் போலவும்[a] இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கடைசிச் சொற்றொடரை “படிகம்போல் தெளிவான யாஸ்பர் கல்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχουσαν
  choice: கொண்டிருந்தது
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட நகரத்தை விளக்கும் நிகழ்காலப் பெயரெச்சத் தொடர்பைத் தமிழில் இயல்பாகத் தொடர்கிறது.
- source_word: τὴν δόξαν τοῦ θεοῦ
  choice: கடவுளின் மகிமை
  rationale: δόξα என்பதன் வேதாகம இறையியல் நிறையையும், கடவுளுடைய பிரசன்னத்தின் வெளிப்பாட்டையும் ‘மகிமை’ காக்கிறது.
- source_word: ὁ φωστὴρ αὐτῆς
  choice: அதன் ஒளிவீச்சு
  rationale: φωστήρ ஒளி தரும் பொருளையோ ஒளிரும் தன்மையையோ குறிக்கலாம்; நகரத்தின் தோற்றத்தை விவரிக்கும் சூழலில் ‘ஒளிவீச்சு’ இயல்பானதும் பொருத்தமானதும்.
- source_word: λίθῳ τιμιωτάτῳ
  choice: மிகவும் விலையுயர்ந்த ஒரு கல்
  rationale: τιμιωτάτῳ என்பதிலுள்ள மிகைநிலைப் பொருளையும் λίθος என்பதன் ‘கல்’ உருவகத்தையும் காக்கிறது.
- source_word: ὡς λίθῳ ἰάσπιδι
  choice: படிகக்கல்லைப் போல
  rationale: ἴασπις என்பதற்கு நவீனத் தமிழில் புரியக்கூடிய வழக்கமான பெயராக ‘படிகக்கல்’ பயன்படுத்தப்பட்டு, மீண்டும் வரும் λίθος என்பதும் காக்கப்படுகிறது.
- source_word: κρυσταλλίζοντι
  choice: பளிங்குபோல் மின்னும்
  rationale: இந்தப் பெயரெச்சம் பளிங்கு போன்ற தெளிவையோ ஒளிர்வையோ குறிக்கக்கூடியதால், ஒரே பொருளாகக் கட்டுப்படுத்தாமல் இயல்பான காட்சிமொழியாக வழங்கப்படுகிறது.
theological_decisions:
- issue: δόξα τοῦ θεοῦ என்ற இறையியல் நிறைந்த சொற்றொடர்
  choice: கடவுளின் மகிமை
  alternative: கடவுளின் பேரொளி
  rationale: ‘மகிமை’ என்பது வெறும் கண்ணுக்குத் தெரியும் பிரகாசத்தைத் தாண்டி, கடவுளின் பிரசன்னமும் மாட்சியும் வெளிப்படுவதைச் சுமக்கிறது.
- issue: ἴασπις கல்லின் அடையாளமும் தோற்றமும்
  choice: படிகக்கல்
  alternative: யாஸ்பர் கல்
  rationale: பண்டைய ἴασπις இன்றைய jasper கனிமத்தோடு துல்லியமாக ஒன்றா என்பது உறுதியில்லை; வாசிப்புக்கு எளிய பாரம்பரியச் சொல்லைத் தேர்ந்தெடுத்து, அடையாளத்தின் ஐயத்தை அடிக்குறிப்பில் காட்டுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வெளிப்படுத்தின விசேஷத்தின் காட்சிச் செறிவையும் கண்ணியமான தொனியையும் காக்கும் நடை. கிரேக்கத்தின் ஒப்புமை அமைப்பும் ‘கல்’ என்ற சொல்லின் மீளுரையும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
