revisions:
- from: கடவுளின் மகிமையைக் கொண்டிருந்தது; அதன் ஒளிவீச்சு மிகவும் விலையுயர்ந்த ஒரு கல்லைப் போலவும், பளிங்குபோல் மின்னும் படிகக்கல்லைப் போலவும்[a] இருந்தது.
  to: கடவுளின் மகிமையைக் கொண்டிருந்தது; அதன் ஒளிவீச்சு மிகவும் விலையுயர்ந்த ஒரு கல்லைப் போலவும், படிகம்போல் ஒளிரும் யாஸ்பர் கல்லைப் போலவும்[a] இருந்தது.
