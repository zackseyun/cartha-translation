  source_fidelity: மூலக் கிரேக்கத்தின் வலியுறுத்தப்பட்ட மறுப்பு (οὐ μή), நகரத்துக்குள் நுழைதல், ‘தீட்டான எதுவும்’ என்ற நடுநிலைப் பரப்பு, அருவருப்பானது/பொய் செய்வோரின் தனியான குறிப்பு, மற்றும் ஆட்டுக்குட்டியானவரின் வாழ்வுப் புத்தகத்தில் எழுதப்பட்டவர்களுக்கே உள்ள விதிவிலக்கு ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. இறுதி வாக்கியத்தின் ‘நுழைவார்கள்’ என்பது εἰ μή மூலம் வெளிப்படும் ஒரே விதிவிலக்கைத் தமிழில் இயல்பாக நிறைவு செய்கிறது; மூலத்தில் இல்லாத ‘பெயர்கள்’ சேர்க்கப்படவில்லை.
  naturalness: நவீன பொதுத்தமிழில் உரை தெளிவாகவும் கண்ணியமாகவும் உள்ளது. மூன்று வாக்கியங்களாகப் பிரித்திருப்பது கிரேக்கத்தின் விலக்கு–விதிவிலக்கு தர்க்கத்தை மாற்றாமல் வாசிப்பை எளிதாக்குகிறது. ‘அருவருப்பானதையோ பொய்யையோ செய்கிற எவரும்’ என்பது முழுமையான எதிர்மறைச் சூழலில் இரண்டில் எதனைக் செய்பவரையும் உள்ளடக்கும் இயல்பான தமிழ் அமைப்பாகும்.
