id: REV.21.27
reference: Revelation 21:27
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ οὐ μὴ εἰσέλθῃ εἰς αὐτὴν πᾶν κοινὸν καὶ ⸀ποιῶν βδέλυγμα καὶ ψεῦδος, εἰ μὴ οἱ γεγραμμένοι ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/027.yaml
  text: And nothing unclean will ever enter it[a], nor anyone who does what is detestable or false[b], but only those written in the Lamb’s book of life.
translation:
  language: ta
  text: தீட்டான எதுவும் அதற்குள் ஒருபோதும் நுழையாது[a]. அருவருப்பானதையோ பொய்யையோ செய்கிற எவரும் நுழையமாட்டார்[b]. ஆட்டுக்குட்டியானவரின் வாழ்வுப் புத்தகத்தில் எழுதப்பட்டவர்கள் மட்டுமே நுழைவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தீட்டான’ என்பதற்கு ‘தூய்மையற்ற’ அல்லது ‘புனிதப் பயன்பாட்டுக்குரியதல்லாத’ என்றும் மொழிபெயர்க்கலாம் (πᾶν κοινόν).
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘அருவருப்பையும் பொய்யையும் செய்கிறவர்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ εἰσέλθῃ
  choice: ஒருபோதும் நுழையாது / நுழையமாட்டார்
  rationale: οὐ μή உடன் வரும் aorist subjunctive வலியுறுத்தப்பட்ட மறுப்பைக் குறிக்கிறது. தமிழில் ‘ஒருபோதும்’ என்பதும் எதிர்மறை வினைமுற்றும் சேர்ந்து இந்த உறுதியான விலக்கை இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: αὐτὴν
  choice: அதற்குள்
  rationale: பெயர்ச்சொல் பாலினத்தைத் தமிழில் செயற்கையாகப் பிரதிபலிக்காமல், இங்கு புதிய எருசலேம் நகரத்தைக் குறிக்கும் இடப்பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: πᾶν κοινὸν
  choice: தீட்டான எதுவும்
  rationale: நடுநிலை ஒருமையான πᾶν விரிவான எதிர்மறைப் பொருளில் ‘எதுவும்’ என வருகிறது. κοινός இங்கு யூதத் தூய்மைச் சூழலில் பொதுவானது, தூய்மையற்றது அல்லது தீட்டுப்பட்டது என்ற பொருளைக் கொண்டிருக்கலாம்; ‘தீட்டான’ என்பது அதன் சமய-ஒழுக்க வலிமையைச் சுருக்கமாகக் காக்கிறது.
- source_word: ποιῶν βδέλυγμα καὶ ψεῦδος
  choice: அருவருப்பானதையோ பொய்யையோ செய்கிற எவரும்
  rationale: சார்புப் பெயரெச்சம் ஒருவரைக் குறிக்கிறது; அதன் இரு செயப்படுபொருள்களும் தமிழில் இயல்பாகத் தனித்தனி விலக்கப்பட்ட செயல்களாக ‘-ஓ ... -ஓ’ அமைப்பில் தரப்படுகின்றன. βδέλυγμα என்பதன் கடுமையான ஒழுக்க-வழிபாட்டு வெறுப்புணர்வை ‘அருவருப்பானது’ காக்கிறது; ψεῦδος ‘பொய்’ என நேரடியாக வருகிறது.
- source_word: εἰ μὴ
  choice: மட்டுமே
  rationale: முந்தைய முழுமையான விலக்கிற்கு ஒரே விதிவிலக்கை அறிமுகப்படுத்துவதால், தமிழ் வாக்கியத்தில் ‘மட்டுமே’ தெளிவான வரம்பைக் காட்டுகிறது.
- source_word: οἱ γεγραμμένοι
  choice: எழுதப்பட்டவர்கள்
  rationale: perfect passive participle ஏற்கெனவே பதிவு செய்யப்பட்டு அந்த நிலையில் இருப்பவர்களைக் குறிக்கிறது. மூலத்தில் இல்லாத ‘பெயர்கள்’ என்பதை முதன்மை உரையில் சேர்க்காமல் வைத்திருக்கிறது.
- source_word: ἐν τῷ βιβλίῳ τῆς ζωῆς
  choice: வாழ்வுப் புத்தகத்தில்
  rationale: ‘வாழ்வின் புத்தகம்’ என்பதும் சாத்தியம்; ஆனால் தமிழில் பெயரடைத் தொகையாக ‘வாழ்வுப் புத்தகம்’ இயல்பாகவும் சுருக்கமாகவும் இருந்து, நிலைபெற்ற வெளிப்பாட்டையும் காக்கிறது.
- source_word: τοῦ ἀρνίου
  choice: ஆட்டுக்குட்டியானவரின்
  rationale: வெளிப்படுத்தின விசேஷத்தில் கிறிஸ்துவுக்குரிய முக்கிய உருவகப் பட்டத்தைப் பாதுகாக்கிறது. ‘-ஆனவர்’ மரியாதையையும் இது ஒருவரைக் குறிக்கும் பட்டம் என்பதையும் தமிழில் தெளிவாக்குகிறது.
theological_decisions:
- issue: புதிய எருசலேமுக்குள் நுழைவதிலிருந்து விலக்கப்படுவோரின் பரப்பு
  choice: தீட்டான எதையும் தனியே குறிப்பிட்டு, அருவருப்பானதையோ பொய்யையோ செய்கிற மனிதர்களையும் தனியே குறிப்பிடுகிறது.
  alternative: முதல் கூறையும் மனிதர்களையே குறிக்கும் பொதுக் குறிப்பாக எடுத்தல்.
  rationale: கிரேக்கத்தில் நடுநிலை ‘πᾶν κοινόν’ என்பதற்குப் பின் ஒருவரைக் குறிக்கும் ‘ποιῶν’ வருகிறது. இவ்விரு இலக்கணப் பரிமாணங்களையும் ஒன்றாக்காமல் தமிழ் உரை காக்கிறது.
- issue: வாழ்வுப் புத்தகத்தில் ‘எழுதப்பட்டவர்கள்’ என்பதன் குறிப்பு
  choice: ‘எழுதப்பட்டவர்கள்’ என்று மட்டும் மொழிபெயர்த்து, ‘பெயர்கள்’ என்பதைச் சேர்க்கவில்லை.
  alternative: ‘பெயர்கள் எழுதப்பட்டவர்கள்’ அல்லது ‘பெயர்கள் எழுதப்பட்டுள்ளவர்கள்’.
  rationale: புத்தக உருவகம் பெயர்களைப் பதிவு செய்வதை உணர்த்தினாலும், இந்த வசனத்தின் கிரேக்க உரையில் ‘பெயர்கள்’ வெளிப்படையாக இல்லை; இணை வசனங்களின் சொற்களை இங்கே இறக்குமதி செய்யாமல் மூலத்தின் சுருக்கத்தைப் பாதுகாக்கிறது.
- issue: βδέλυγμα καὶ ψεῦδος ஆகியவற்றின் இணைப்பு
  choice: தமிழின் இயல்பான எதிர்மறை வரிசையில் ‘அருவருப்பானதையோ பொய்யையோ’ எனத் தரப்பட்டுள்ளது.
  alternative: சொல்லுக்குச் சொல் அமைப்பில் ‘அருவருப்பானதையும் பொய்யையும் செய்கிறவர்’.
  rationale: கிரேக்க καί இரு செயப்படுபொருள்களை இணைக்கிறது. ஆனால் முழு வாக்கியமும் நுழையத் தகாத செயல்களை விவரிப்பதால், தமிழ் ‘-ஓ ... -ஓ’ அமைப்பு எந்த ஒன்றைச் செய்பவரும் விலக்கப்படுவார் என்ற இயல்பான பொருளைத் தருகிறது; இரண்டையும் ஒரே நபர் கட்டாயம் சேர்த்துச் செய்ய வேண்டும் எனத் தவறாகச் சுருக்குவதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடையைப் பயன்படுத்துகிறது. கிரேக்கத்தின் நீண்ட ஒரே வாக்கியம் தமிழின் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், விலக்கு–விதிவிலக்கு தர்க்கம் மாறவில்லை. ‘ஆட்டுக்குட்டியானவர்’ என்பது உருவகப் பட்டத்தைத் தெளிவாகவும் மரியாதையாகவும் காக்கிறது; ‘வாழ்வுப் புத்தகம்’ பொதுவாசகருக்குப் புரியும் நிலையான சொற்றொடராக உள்ளது.
