  source_fidelity: 'மையப் பொருள் துல்லியமாக உள்ளது: நகரத்துக்கு சூரியனும் சந்திரனும் தேவையில்லை; கடவுளின் மகிமை அதனை ஒளியூட்டுகிறது; ஆட்டுக்குட்டியானவரே அதன் விளக்கு. ஆனால் ‘ஒளிவீசுவதற்குச்’ என்ற வினையெச்சத் தொடர் தமிழில் நகரமே ஒளிவீசுவதற்காகச் சூரியனும் சந்திரனும் தேவைப்படவில்லை என்ற தொடர்பைச் சற்றே ஏற்படுத்தலாம். கிரேக்கத்தின் αὐτῇ-யை வெளிப்படையாகக் குறிப்பது பாதுகாப்பானது.'
