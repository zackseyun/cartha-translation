id: REV.21.23
reference: Revelation 21:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἡ πόλις οὐ χρείαν ἔχει τοῦ ἡλίου οὐδὲ τῆς σελήνης, ἵνα φαίνωσιν αὐτῇ, ἡ γὰρ δόξα τοῦ θεοῦ ἐφώτισεν αὐτήν, καὶ ὁ λύχνος αὐτῆς τὸ ἀρνίον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/023.yaml
  text: And the city has no need of the sun or of the moon to shine on it[a], for the glory of God gave it light, and its lamp is the Lamb.
translation:
  language: ta
  text: அதன்மேல் ஒளிவீச சூரியனோ சந்திரனோ அந்த நகரத்துக்குத் தேவையில்லை[a]. ஏனெனில், கடவுளின் மகிமை அதற்கு ஒளியூட்டியது; அதன் விளக்கு ஆட்டுக்குட்டியானவரே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதற்கு ஒளியளிக்க.” கிரேக்கத்தில் சொல்லுக்குச் சொல், “அதற்காக/அதன்மேல் ஒளிவீச” என்று வருகிறது.
    reason: φαίνωσιν αὐτῇ என்பதில் φαίνω-வின் ‘ஒளிவீசு’ பொருளும் αὐτῇ-யின் ‘அதற்காக/அதன்மேல்’ தொடர்பும் மாற்று இயல்பான தமிழாக்கங்களை அனுமதிக்கின்றன.
lexical_decisions:
- source_word: πόλις
  choice: நகரம்
  rationale: புதிய எருசலேமைக் குறிக்கும் சூழலில் இயல்பான, நேரடியான தமிழ் சொல்.
- source_word: οὐ χρείαν ἔχει
  choice: தேவையில்லை
  rationale: ‘தேவை இல்லாதிருத்தல்’ என்ற கிரேக்க மரபுத்தொடரின் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: τοῦ ἡλίου οὐδὲ τῆς σελήνης
  choice: சூரியனோ சந்திரனோ
  rationale: οὐδέ இணைக்கும் இரு வானொளிகளையும் மாற்றுத் தொகையாகத் தெளிவாகவும் சுருக்கமாகவும் காட்டுகிறது.
- source_word: ἵνα φαίνωσιν αὐτῇ
  choice: ஒளிவீசுவதற்கு
  rationale: வானொளிகள் எழுவாயாக இருப்பதால் φαίνω என்பதன் நேரடியான ‘ஒளிவீசு’ பொருள் காக்கப்படுகிறது. αὐτῇ என்பதன் உறவு தமிழில் சூழலால் விளங்குகிறது; அதன் மாற்று வெளிப்பாடு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: δόξα
  choice: மகிமை
  rationale: வேதாகமத்திலும் வெளிப்படுத்தல் நூலின் இறையியல் சூழலிலும் நிலைபெற்ற, பொருள் செறிந்த இணைச்சொல்.
- source_word: ἐφώτισεν
  choice: ஒளியூட்டியது
  rationale: நகரத்தை வெளிச்சமடையச் செய்தது என்ற konkretaான பொருளைத் தருவதுடன், முன்வரும் ‘ஒளிவீசு’ என்பதிலிருந்து வினை வேறுபாட்டையும் காக்கிறது.
- source_word: λύχνος
  choice: விளக்கு
  rationale: பொதுவான ‘ஒளி’யையோ ‘விளக்குத்தண்டு’வையோ அல்லாமல், ஒளி தரும் விளக்கையே குறிக்கும் படிமத்தைத் துல்லியமாகக் காக்கிறது.
- source_word: ἀρνίον
  choice: ஆட்டுக்குட்டியானவர்
  rationale: வெளிப்படுத்தல் நூலில் இயேசுவைக் குறிக்கும் பட்டப்பெயராகப் பயன்படுவதால், தமிழில் மரியாதையையும் நபரைக் குறிக்கும் தன்மையையும் இயல்பாக வெளிப்படுத்தும் வடிவம்.
theological_decisions:
- issue: ‘அதன் விளக்கு ஆட்டுக்குட்டி’ என்ற உருவக உறவு
  choice: ‘ஆட்டுக்குட்டியானவரே அதன் விளக்கு’ என்று விளக்கு உருவகத்தை நேரடியாகக் காத்தல்
  alternative: ‘ஆட்டுக்குட்டியானவரே அதன் ஒளி’
  rationale: கிரேக்கத்தில் பொதுவான ‘ஒளி’ என்பதற்குப் பதிலாக λύχνος (‘விளக்கு’) உள்ளது. கடவுளின் மகிமை ஒளியூட்டுகிறது என்பதற்கும் ஆட்டுக்குட்டியானவர் நகரத்தின் விளக்காக இருக்கிறார் என்பதற்கும் இடையிலான படிம வேறுபாடு இதனால் காக்கப்படுகிறது.
- issue: தெய்வீக ஒளியூட்டலின் பொருள்
  choice: கடவுளின் மகிமை நகரத்துக்கு ஒளியூட்டியது என்று மட்டும் மொழிபெயர்த்தல்
  alternative: படைக்கப்பட்ட எல்லா ஒளிகளுக்கும் பதிலாகக் கடவுள் இருப்பதாக விளக்கிச் சேர்த்தல்
  rationale: மூலவசனம் கூறும் காரண உறவைப் பாதுகாத்து, அதற்கு அப்பாற்பட்ட இறுதிக்கால விளக்கங்களை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வெளிப்படுத்தல் நூலின் கண்ணியமான கவித்துவப் படிமம் குன்றாத வகையிலும் அமைக்கப்பட்டது. ‘ஆட்டுக்குட்டியானவர்’ என்பது பட்டப்பெயருக்குரிய மரியாதை வடிவமாகப் பயன்படுத்தப்பட்டுள்ளது; தனிப்பட்ட சமயப்பிரிவு விளக்கம் சேர்க்கப்படவில்லை.
