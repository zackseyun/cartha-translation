id: REV.21.21
reference: Revelation 21:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ οἱ δώδεκα πυλῶνες δώδεκα μαργαρῖται, ἀνὰ εἷς ἕκαστος τῶν πυλώνων ἦν ἐξ ἑνὸς μαργαρίτου· καὶ ἡ πλατεῖα τῆς πόλεως χρυσίον καθαρὸν ὡς ὕαλος διαυγής.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/021.yaml
  text: And the twelve gates were twelve pearls; each one of the gates was from a single pearl. And the street of the city was pure gold[a], like transparent glass.
translation:
  language: ta
  text: அந்தப் பன்னிரண்டு வாசல்களும் பன்னிரண்டு முத்துகளாக இருந்தன; ஒவ்வொரு வாசலும் ஒரே முத்தினால் ஆனது. நகரத்தின் தெரு தெளிவான கண்ணாடியைப் போன்ற தூய தங்கமாக இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நகரத்தின் அகன்ற தெரு”; அல்லது, “நகரத்தின் சதுக்கம்.”
    reason: πλατεῖα என்பதற்கு ‘அகன்ற தெரு’ அல்லது ‘சதுக்கம்’ என்றும் பொருள் கொள்ளலாம்.
lexical_decisions:
- source_word: πυλῶνες
  choice: வாசல்கள்
  rationale: புதிய எருசலேமின் கட்டட அமைப்பைக் குறிக்கும் இச்சூழலில், வாயில் அமைப்புகளை இயல்பாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: μαργαρῖται / μαργαρίτου
  choice: முத்துகள் / முத்து
  rationale: பன்மையையும் பின்னர் வரும் ஒருமையையும் காத்து, பன்னிரண்டு வாசல்களுக்கும் பன்னிரண்டு முத்துகளுக்கும் உள்ள நேரடி ஒப்புமையை வெளிப்படுத்துகிறது.
- source_word: ἀνὰ εἷς ἕκαστος
  choice: ஒவ்வொரு வாசலும் ஒரே
  rationale: ஒவ்வொன்றும் தனித்தனியாக ஒன்று என்ற பகிர்ந்தளிக்கும் வலியுறுத்தலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐξ ἑνὸς μαργαρίτου
  choice: ஒரே முத்தினால் ஆனது
  rationale: ἐξ என்பதன் பொருள் அல்லது மூலப்பொருள் சார்ந்த உறவைத் தமிழில் தெளிவாகக் காட்டுகிறது; ἑνός என்பதன் வலியுறுத்தலை ‘ஒரே’ காக்கிறது.
- source_word: πλατεῖα
  choice: தெரு
  rationale: அகன்ற பொதுவழி அல்லது திறந்த நகரப்பகுதி எனப் பொருள்படக்கூடிய சொல்லுக்கு இச்சூழலில் எளிமையான, இயல்பான முதன்மைத் தெரிவு; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: χρυσίον καθαρὸν
  choice: தூய தங்கம்
  rationale: தங்கத்தின் மாசற்ற தன்மையை இயல்பாகவும் மரியாதையான நடையிலும் தெரிவிக்கிறது.
- source_word: ὡς ὕαλος διαυγής
  choice: ஒளி ஊடுருவும் கண்ணாடியைப் போல
  rationale: διαυγής குறிக்கும் தெளிவு அல்லது ஒளி ஊடுருவும் தன்மையைப் பாதுகாத்து, அபோகலிப்டிக் உருவகத்தின் வியப்பையும் காக்கிறது.
theological_decisions:
- issue: πλατεῖα குறிக்கும் நகர அமைப்பு
  choice: நகரத்தின் ‘தெரு’ என்று ஒருமையில் மொழிபெயர்த்தல்
  alternative: ‘அகன்ற தெரு’ அல்லது ‘நகரச் சதுக்கம்’
  rationale: இது கோட்பாட்டுத் தீர்மானத்தைவிட சொற்பொருள் மற்றும் காட்சியமைப்பு சார்ந்தது. மூலத்தின் ஒருமையைக் காத்து, நவீன நகரத் திட்டக் கருத்தைத் திணிக்காமல் ‘தெரு’ பயன்படுத்தப்படுகிறது; உண்மையான சொற்பொருள் மாற்றுகள் அடிக்குறிப்பில் வைக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை. ‘ஒரே முத்தினால் ஆனது’ என்பது மூலப்பொருள் உறவைத் தெளிவாக்குகிறது; πλατεῖα என்பதிலுள்ள உண்மையான சொற்பொருள் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
