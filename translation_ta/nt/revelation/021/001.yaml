reference: Revelation 21:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ εἶδον οὐρανὸν καινὸν καὶ γῆν καινήν· ὁ γὰρ πρῶτος οὐρανὸς καὶ ἡ πρώτη γῆ ἀπῆλθαν, καὶ ἡ θάλασσα οὐκ ἔστιν ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/001.yaml
  text: And I saw a new heaven and a new earth[a], for the first heaven and the first earth had passed away[b], and the sea is no more.
translation:
  language: ta
  text: நான் புதிய வானத்தையும் புதிய பூமியையும் கண்டேன். ஏனெனில், முதல் வானமும் முதல் பூமியும் கடந்துபோயின[a]; கடல் இனி இல்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘முந்தைய வானமும் முந்தைய பூமியும்’ என்றும் பொருள் கொள்ளலாம். கிரேக்க மூலத்தில் ‘முதல் வானமும் முதல் பூமியும்’ என்று உள்ளது; இது புதிய ஒழுங்குக்கு முந்திய ஒழுங்கைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘கடல்’ என்பதை நேர்ப்பொருளில் வாசிக்கலாம். எனினும், வெளிப்படுத்துதல் நூலில் அது குழப்பம், ஆபத்து அல்லது பிரிவு ஆகியவற்றோடு தொடர்புடைய அடையாளப் பொருளையும் கொண்டிருக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ εἶδον
  choice: பின்பு நான் ... கண்டேன்
  rationale: தரிசனக் காட்சிகளின் தொடர்ச்சியில் καί இயல்பாகக் குறிக்கும் அடுத்த நிகழ்வை ‘பின்பு’ வெளிப்படுத்துகிறது; εἶδον என்பதன் எளிய இறந்தகால விவரிப்பை ‘கண்டேன்’ நேரடியாகத் தருகிறது.
- source_word: οὐρανὸν καινὸν καὶ γῆν καινήν
  choice: ஒரு புதிய வானத்தையும் ஒரு புதிய பூமியையும்
  rationale: இது படைக்கப்பட்ட முழு உலக ஒழுங்கைக் குறிக்கும் இணைச்சொல். καινός தரும் புதுமையை ‘புதிய’ என மொழிபெயர்ப்பது, முழுமையான மாற்றீடா அல்லது புதுப்பித்தலா என்பதை முன்கூட்டியே தீர்மானிப்பதில்லை.
- source_word: ὁ πρῶτος οὐρανὸς καὶ ἡ πρώτη γῆ
  choice: முதல் வானமும் முதல் பூமியும்
  rationale: πρῶτος என்பதன் நேரடியான பொருளான ‘முதல்’ என்பதைக் காத்து, புதிய ஒழுங்குக்கு முந்தியதைக் குறிக்கும் சாத்தியத்தையும் அடிக்குறிப்பில் தருகிறது.
- source_word: ἀπῆλθαν
  choice: மறைந்துபோயின
  rationale: இங்கு ἀπέρχομαι முந்தைய வானமும் பூமியும் இனி இல்லாமல் போனதைக் குறிக்கிறது. ‘மறைந்துபோயின’ என்பது தமிழில் இயல்பாகவும் காட்சியின் பொருளுக்கு ஏற்றவாறும் உள்ளது.
- source_word: ἡ θάλασσα
  choice: கடல்
  rationale: θάλασσα என்பதன் concrete பொருளை நேரடியாகக் காக்கிறது; அதன் சாத்தியமான அடையாளப் பொருளை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: οὐκ ἔστιν ἔτι
  choice: இனி இல்லை
  rationale: ἔτι உடன் வரும் மறுப்பைச் சுருக்கமாகவும் இயல்பான நவீனத் தமிழிலும் துல்லியமாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘புதிய வானம், புதிய பூமி’ என்பவற்றின் இயல்பு
  choice: ‘புதிய’ என்று மொழிபெயர்த்து, பழைய படைப்பு முழுமையாக மாற்றப்படுகிறதா அல்லது புதுப்பிக்கப்படுகிறதா என்பதைத் தீர்மானிக்காமல் விடப்பட்டது.
  alternative: முழுமையான மாற்றீடு; அல்லது தற்போதைய படைப்பின் புதுப்பித்தல்/உருமாற்றம்
  rationale: καινός புதுமையைக் குறித்தாலும், மாற்றீடு மற்றும் புதுப்பித்தல் ஆகிய இரண்டில் ஒன்றை இவ்வசனம் மட்டும் தெளிவாகத் தீர்மானிக்கவில்லை.
- issue: ‘கடலும் இனி இல்லை’ என்பதன் பொருள்
  choice: முதன்மை உரையில் கடல் என்ற நேரடியான உருவகம் அப்படியே வைக்கப்பட்டது.
  alternative: கடல் உண்மையில் இல்லாமற்போதல்; அல்லது குழப்பம், ஆபத்து, தீமை, பிரிவு ஆகியவற்றின் அடையாள நீக்கம்
  rationale: வெளிப்படுத்தின விசேஷத்தில் கடல் அடையாளத் தொடர்புகளைக் கொண்டிருக்கலாம்; ஆனால் அவற்றில் ஒன்றை மொழிபெயர்ப்புக்குள் புகுத்துவது உரையின் உண்மையான திறந்தநிலையைச் சுருக்கிவிடும்.
translation_notes:
  register: நவீன பொதுத்தமிழில், எளிதில் புரியக்கூடிய அதேவேளையில் தரிசன இலக்கியத்துக்குரிய கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘முதல்’ மற்றும் ‘கடல்’ போன்ற மூல உருவகங்கள் விளக்கவுரையாக மாற்றப்படாமல் காக்கப்பட்டுள்ளன.
