id: REV.21.17
reference: Revelation 21:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐμέτρησεν τὸ τεῖχος αὐτῆς ἑκατὸν τεσσεράκοντα τεσσάρων πηχῶν, μέτρον ἀνθρώπου, ὅ ἐστιν ἀγγέλου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/017.yaml
  text: And he measured its wall[a], 144 cubits by human measure, which is also an angel’s measure.
translation:
  language: ta
  text: அவன் அதன் மதிலை மனிதரின் அளவின்படி 144 முழம் அளந்தான்; அதுவே ஒரு தூதரின் அளவும் ஆகும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு மனிதனின் அளவின்படி—அதாவது, ஒரு தூதரின் அளவின்படி.” தூதர் மனிதர்கள் பயன்படுத்தும் அளவலகைப் பயன்படுத்தினார் என்பதையோ, மனிதரின் அளவும் தூதரின் அளவும் இங்கு ஒத்திருக்கின்றன என்பதையோ கிரேக்கத் தொடர் வலியுறுத்தலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμέτρησεν
  choice: அளந்தான்
  rationale: μετρέω என்பதன் இறந்தகாலச் செயலை இயல்பாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: τὸ τεῖχος αὐτῆς
  choice: அதன் மதிலை
  rationale: τεῖχος என்பது நகரின் சுற்று அல்லது பாதுகாப்பு மதிலைக் குறிக்கிறது; αὐτῆς என்பது முன் குறிப்பிடப்பட்ட நகரைக் குறிக்கும் என்பதால், தமிழில் இயல்பான ‘அதன்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἑκατὸν τεσσεράκοντα τεσσάρων πηχῶν
  choice: 144 முழம்
  rationale: பண்டைய அளவலகான πῆχυς என்பதற்கு தமிழில் வழக்கமான ‘முழம்’ பயன்படுத்தப்பட்டு, வாசிப்பின் தெளிவுக்காக எண் இலக்கங்களில் தரப்பட்டுள்ளது.
- source_word: μέτρον ἀνθρώπου
  choice: மனித அளவின்படி
  rationale: ἄνθρωπος இங்கு பாலினத்தைக் குறிப்பதல்ல, பொதுவாக மனிதரைக் குறிக்கிறது. ‘மனித அளவின்படி’ என்பது அளவிடும் தரநிலையைக் குறிக்கும் சுருக்கமான கிரேக்கத் தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: ὅ ἐστιν ἀγγέλου
  choice: அந்த அளவே தூதருடையதும் ஆகும்
  rationale: கிரேக்கத்தில் விடுபட்டுள்ள ‘அளவு’ என்பதை தமிழில் தெளிவுக்காக வெளிப்படுத்துகிறது; மனித அளவும் தூதரின் அளவும் இங்கு ஒத்திருக்கின்றன என்ற தொடர்பை ‘-உம்’ காக்கிறது.
theological_decisions:
- issue: μέτρον ἀνθρώπου, ὅ ἐστιν ἀγγέλου என்ற சுருக்கமான தொடரின் பொருள்
  choice: அளவு மனிதர்களுக்குப் புரியும் அளவுமுறையில் கூறப்படுகிறது; அதே அளவு தூதருடையதும் ஆகும்.
  alternative: ஒரு மனிதனின் அளவின்படி—அதாவது, அளந்த தூதரின் அளவின்படி—மதில் 144 முழம் இருந்தது.
  rationale: கிரேக்கத் தொடர் மனித அளவுக்கும் தூதரின் அளவுக்கும் உள்ள தொடர்பைத் தெளிவாக விளக்காமல் சுருக்கமாகக் கூறுகிறது. முதன்மை உரை அவை இங்கு ஒத்திருக்கின்றன என்பதை மட்டும் தெரிவிக்கிறது; தூதரின் உடல் அளவு அல்லது தனிப்பட்ட அளவுகோல் பற்றிய ஊகத்தைச் சேர்க்கவில்லை. மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன, தரமான, கண்ணியமான தமிழ் நடை பயன்படுத்தப்பட்டுள்ளது. ‘முழம்’ என்ற பழமையான அளவலகு மாற்றிக் கணக்கிடப்படாமல் தக்கவைக்கப்பட்டுள்ளது. சுருக்கமான கிரேக்கத் தொடரின் உண்மையான பொருள் தெளிவின்மை முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
