source:
  edition: SBLGNT
  text: καὶ περιπατήσουσιν τὰ ἔθνη διὰ τοῦ φωτὸς αὐτῆς· καὶ οἱ βασιλεῖς τῆς γῆς φέρουσιν ⸂τὴν δόξαν αὐτῶν⸃ εἰς αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/024.yaml
  text: And the nations will walk by its light[c][b][a], and the kings of the earth will bring their glory into it.
translation:
  language: ta
  text: நாடுகள் அதன் ஒளியால்[a] நடக்கும்; பூமியின் அரசர்கள் தங்களுடைய மகிமையை[b] அதற்குள் கொண்டுவருகிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அதன் ஒளியின் வழியாக’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘தங்களுடைய சிறப்பை’ அல்லது ‘தங்களுடைய மாண்பை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιπατήσουσιν
  choice: நடக்கும்
  rationale: ‘நடக்கும்’ என்பது வினையின் நேரடியான நடைபயணப் படிமத்தைப் பாதுகாக்கிறது; இங்கு ஒளியின் வழிகாட்டுதலில் நாடுகள் நகரும் காட்சியை வெறும் ‘வாழும்’ என்று பொதுமைப்படுத்தவில்லை.
- source_word: τὰ ἔθνη
  choice: நாடுகள்
  rationale: இறுதிக்காலக் காட்சியிலும் பழைய ஏற்பாட்டுத் தீர்க்கதரிசனப் பின்னணியிலும் உள்ள அரசியல்-மக்கள் கூட்டங்களைக் குறிக்கும் பொருளை ‘நாடுகள்’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: διὰ τοῦ φωτὸς αὐτῆς
  choice: அதன் ஒளியால்
  rationale: διά + எழுவாயல்லா வேற்றுமை இங்கு வழிமுறை அல்லது ஊடகத்தைக் குறிக்கிறது. ‘ஒளியால்’ என்பது அந்த நகரத்தின் ஒளியை நாடுகள் நடப்பதற்கான வழிகாட்டும் சாதனமாகச் சொல்கிறது; ‘ஒளியின் வழியாக’ என்பதும் சாத்தியம்.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: பூமியின் அரசர்கள்
  rationale: வெளிப்படுத்தின விசேஷத்தில் மீண்டும் வரும் உலகியலான ஆட்சியாளர்களைக் குறிக்கும் நிலையான வெளிப்பாட்டை இது காக்கிறது.
- source_word: φέρουσιν
  choice: கொண்டுவருகிறார்கள்
  rationale: மூலத்தில் இவ்வினை நிகழ்காலத்தில் உள்ளது. முந்தைய எதிர்கால வினையோடு அதை ஒரே எதிர்காலமாக மாற்றாமல், தரிசனத்தின் உயிரோட்டமான நிகழ்காலத்தைத் தமிழ் மொழிபெயர்ப்பு பாதுகாக்கிறது.
- source_word: τὴν δόξαν αὐτῶν
  choice: தங்களுடைய மகிமையை
  rationale: ‘மகிமை’ என்பது δόξα என்பதன் வேதாகம ஒலிப்பையும் ஏசாயா நூலுடனான பின்னணியையும் காக்கிறது; இங்கு அது அரசர்களின் சிறப்பு, பெருமை அல்லது மாண்பையும் உள்ளடக்கலாம்.
- source_word: εἰς αὐτήν
  choice: அதற்குள்
  rationale: சுட்டுப்பெயர் புதிய எருசலேம் நகரத்தைக் குறிக்கிறது; εἰς என்பதன் உள்ள்நோக்கிய இடப்பொருளை ‘அதற்குள்’ தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: புதிய எருசலேமைக் குறிக்கும் பெண்பால் சுட்டுப்பெயரின் பொருள்
  choice: நகரத்தைக் குறிக்கும் வகையில் ‘அதன்’ / ‘அதற்குள்’ என்று மொழிபெயர்த்தல்
  alternative: மணமகள் உருவகத்தை வலியுறுத்தும் தனிப்பட்ட பெண்பால் குறிப்பை வெளிப்படையாகச் சேர்த்தல்
  rationale: கிரேக்கத்தில் πόλις பெண்பால் சொல்லாக இருப்பதால் αὐτῆς மற்றும் αὐτήν பெண்பாலில் வருகின்றன. தமிழில் இலக்கணப் பாலைக் கட்டாயமாகப் பிரதிபலிக்க வேண்டியதில்லை; இவ்வசனத்தின் உடனடி நகர மற்றும் இடவியல் காட்சியைப் பாதுகாப்பது பொருத்தமானது. அதே நேரத்தில் நகரம் மணமகளாக உருவகிக்கப்படும் விரிந்த பின்னணியை மொழிபெயர்ப்பு மறுப்பதில்லை.
- issue: φέρουσιν என்பதிலுள்ள நிகழ்காலமும் περιπατήσουσιν என்பதிலுள்ள எதிர்காலமும்
  choice: ‘நடக்கும்’ என்ற எதிர்காலத்தையும் ‘கொண்டுவருகிறார்கள்’ என்ற தரிசன நிகழ்காலத்தையும் தனித்தனியாகப் பாதுகாத்தல்
  alternative: இரு வினைகளையும் எதிர்காலமாக்கி ‘கொண்டுவருவார்கள்’ என்று மொழிபெயர்த்தல்
  rationale: மூல உரையின் காலமாற்றத்தை ஒருமைப்படுத்தாமல் விடுவது தரிசன மொழியின் உயிரோட்டத்தையும் உண்மையான இலக்கணத் தளர்வையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நாடுகள் நடக்கும்’ என்ற கவித்துவமான கூட்டுப்பெயர் உருவகம் மூலத்தின் காட்சியைப் பாதுகாக்கிறது. கிரேக்கத்தின் எதிர்காலம்–நிகழ்காலம் மாறுபாடு திட்டமிட்டு நிலைநிறுத்தப்பட்டுள்ளது.
