id: REV.21.4
reference: Revelation 21:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐξαλείψει πᾶν δάκρυον ⸀ἐκ τῶν ὀφθαλμῶν αὐτῶν, καὶ ὁ θάνατος οὐκ ἔσται ἔτι· οὔτε πένθος οὔτε κραυγὴ οὔτε πόνος οὐκ ἔσται ⸀ἔτι. τὰ πρῶτα ἀπῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/004.yaml
  text: And he will wipe away every tear from their eyes[a], and death will be no more; neither mourning nor crying nor pain will be any more[c][b]. The former things have passed away.
translation:
  language: ta
  text: அவர் அவர்களுடைய கண்களிலிருந்து ஒவ்வொரு கண்ணீர்த்துளியையும் துடைத்துவிடுவார்[a]. இனி மரணம் இருக்காது; துக்கமோ அழுகையோ[b] வேதனையோ இனி இருக்காது. முந்தினவை[c] கடந்துபோயின.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கண்ணீர் அனைத்தையும்.” கிரேக்க ஒருமை பகிர்வுப் பொருளில் “ஒவ்வொரு கண்ணீரையும்” குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அழுகுரலோ.” கிரேக்கச் சொல் அழுகையையோ உரத்த கூக்குரலையையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “முதலானவை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαλείψει
  choice: துடைத்துவிடுவார்
  rationale: கண்ணீரை அகற்றுவதைத் தனிப்பட்ட ஆறுதலின் செயலாக இயல்பாகக் காட்டுகிறது; இச்சூழலில் ‘அழித்துவிடுவார்’ என்பது தேவையற்ற கடுமையையும் வேறுபட்ட படிமத்தையும் தரும்.
- source_word: πᾶν δάκρυον
  choice: ஒவ்வொரு கண்ணீர்த்துளியையும்
  rationale: ஒருமையுடன் வரும் πᾶν பகிர்வுப் பொருளில் ஒவ்வொரு கண்ணீரையும் குறிக்கிறது. எண்ணத்தக்க இயல்பான தமிழுக்காக ‘கண்ணீர்த்துளி’ பயன்படுத்தப்பட்டு, ஒவ்வொன்றையும் அகற்றும் வலியுறுத்தல் காக்கப்பட்டுள்ளது.
- source_word: ἐκ τῶν ὀφθαλμῶν αὐτῶν
  choice: அவர்களுடைய கண்களிலிருந்து
  rationale: ἐκ என்பதன் அகற்றப்படும் இடத்தைக் குறிக்கும் பொருளையும் αὐτῶν என்பதன் பன்மையையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ὁ θάνατος
  choice: மரணம்
  rationale: புதிய படைப்பில் முற்றிலும் ஒழிக்கப்படும் மரணத்தைப் பொதுமையான, முழுமையான பொருளில் இயல்பாகக் குறிக்கிறது.
- source_word: οὐκ ἔσται ἔτι
  choice: இனி ... இருக்காது
  rationale: முழுமையான முடிவையும் எதிர்காலத்தில் மீண்டும் இல்லாமையையும் சுருக்கமாகவும் உறுதியாகவும் தெரிவிக்கிறது; கிரேக்கத்தில் இருமுறை வரும் அமைப்பு தமிழிலும் காக்கப்பட்டுள்ளது.
- source_word: πένθος
  choice: துக்கம்
  rationale: இழப்பு மற்றும் மரணத்தோடு தொடர்புடைய ஆழ்ந்த வருத்தம் அல்லது புலம்பலை சாதாரண நவீன தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: κραυγή
  choice: அழுகை
  rationale: துக்கம் மற்றும் வேதனையுடன் இணையும் மனிதத் துயரத்தின் வெளிப்பாட்டை இயல்பாகக் காட்டுகிறது. உரத்த அழுகுரல் என்ற சாத்தியப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: πόνος
  choice: வேதனை
  rationale: உடல் வலி மட்டுமின்றி துன்பத்தையும் உள்ளடக்கக்கூடியதால், இவ்விரிவான இறுதிக்காலப் பட்டியலுக்கு ‘வேதனை’ பொருத்தமானது.
- source_word: τὰ πρῶτα
  choice: முந்தினவை
  rationale: முன்னிருந்த உலக ஒழுங்கைத் தனிப்பட்ட விளக்கத்தைச் சேர்க்காமல் இயல்பாகச் சுட்டுகிறது; ‘முதலானவை’ என்ற சொற்பொருள் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἀπῆλθαν
  choice: கடந்துபோயின
  rationale: முன்னிருந்தவை முடிவுற்று அகன்றுவிட்டன என்ற நிறைவான அறிவிப்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘துடைத்துவிடுவார்’ என்பதன் எழுவாய் இவ்வசனத்தில் பெயர்ச்சொல்லாக வெளிப்படையாகக் கூறப்படாமல் முந்தைய சூழலிலிருந்து பெறப்படுகிறது.
  choice: ‘அவர்’ என்று மொழிபெயர்த்து, ‘தேவன்’ என்ற பெயரை வசனத்துக்குள் சேர்க்கவில்லை.
  alternative: ‘தேவன் ... துடைத்துவிடுவார்’
  rationale: கிரேக்க வினை மூன்றாம் நபர் ஒருமை எழுவாயைக் கொண்டிருந்தாலும், அந்த எழுவாய் இவ்வசனத்தில் பெயரால் மீண்டும் சொல்லப்படவில்லை. முந்தைய வசனத்துடனான தொடர்பையும் மூலத்தின் மறைமுகத்தன்மையையும் ‘அவர்’ காக்கிறது.
- issue: புதிய படைப்பில் மரணம், துக்கம், அழுகை, வேதனை ஆகியவை இல்லாமற்போகும் அளவு.
  choice: ‘இனி ... இருக்காது’ என்ற நிபந்தனையற்ற முழுமையான மொழி பயன்படுத்தப்பட்டது.
  alternative: அவை குறையும் அல்லது கட்டுப்படுத்தப்படும் எனப் பொருள்படும் மொழி
  rationale: οὐκ ἔσται ἔτι என்பது குறைதலை அல்ல, முழுமையான இல்லாமையை அறிவிக்கிறது. ஆகவே விளக்கக் கட்டுப்பாடுகள் எதுவும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் வெளிப்படுத்தின விசேஷத்தின் கம்பீரமான அறிவிப்புத் தொனியைப் பேணும் நடை. ‘இனி ... இருக்காது’ என்ற மறுமொழி கிரேக்கத்தின் இறுதியான, ஆறுதலளிக்கும் வலியுறுத்தலைக் காக்கிறது.
