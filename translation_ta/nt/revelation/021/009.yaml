revisions:
- from: பின்பு, கடைசி ஏழு வாதைகள் நிறைந்திருந்த ஏழு கிண்ணங்களை வைத்திருந்த ஏழு தூதர்களில் ஒருவன் வந்து, என்னுடன் பேசினான்[a]. அவன், “இங்கே வா; மணமகளை—ஆட்டுக்குட்டியானவரின் மனைவியை—உனக்குக் காட்டுவேன்” என்றான்.
