id: REV.21.9
reference: Revelation 21:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ἦλθεν εἷς ἐκ τῶν ἑπτὰ ἀγγέλων τῶν ἐχόντων τὰς ἑπτὰ φιάλας, ⸂τῶν γεμόντων⸃ τῶν ἑπτὰ πληγῶν τῶν ἐσχάτων, καὶ ἐλάλησεν μετ’ ἐμοῦ λέγων· Δεῦρο, δείξω σοι τὴν ⸂νύμφην τὴν γυναῖκα⸃ τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/009.yaml
  text: Then one of the seven angels who had the seven bowls full of the seven last plagues came and spoke with me[a], saying, “Come, I will show you the bride[b], the wife of the Lamb.”
translation:
  language: ta
  text: பின்பு, கடைசி ஏழு வாதைகள் நிறைந்திருந்த ஏழு கிண்ணங்களை வைத்திருந்த ஏழு தூதர்களில் ஒருவன் வந்து, என்னுடன் பேசினான்[a]. அவன், “வா; மணமகளை—ஆட்டுக்குட்டியின் மனைவியை—உனக்குக் காட்டுவேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னிடம் பேசினான்.” கிரேக்கத்தில் நேரடியாக “என்னுடன் பேசினான்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: பின்பு
  rationale: கதையின் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் காட்டுகிறது; இணைப்புச் சொல்லின் முன்னேற்றத் தன்மையையும் காக்கிறது.
- source_word: ἦλθεν
  choice: வந்து
  rationale: ἔρχομαι என்ற வினையின் இறந்தகால நிகழ்வைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: εἷς ἐκ τῶν ἑπτὰ ἀγγέλων
  choice: ஏழு தூதர்களில் ஒருவன்
  rationale: ἐκ உடனான பகுதிப்பொருள் அமைப்புக்கு இயல்பான தமிழ் வடிவம்.
- source_word: τῶν ἐχόντων τὰς ἑπτὰ φιάλας
  choice: ஏழு கிண்ணங்களை வைத்திருந்த
  rationale: அந்தத் தூதர்களை அவர்களிடம் இருந்த கிண்ணங்களால் அடையாளப்படுத்துகிறது. φιάλη என்பதன் அகன்ற பாத்திர வடிவை ‘கிண்ணம்’ தெளிவாகக் குறிக்கிறது; நவீன வாசகருக்கு தெளிவில்லாத மரபுச் சொல்லைத் தவிர்க்கிறது.
- source_word: τῶν γεμόντων τῶν ἑπτὰ πληγῶν τῶν ἐσχάτων
  choice: கடைசி ஏழு வாதைகள் நிறைந்திருந்த
  rationale: γεμόντων என்பதன் ‘நிறைந்திருந்த’ என்ற பொருளையும், ἐσχάτων என்பதன் வரிசைமுறை சார்ந்த ‘கடைசி’ என்ற பொருளையும் காக்கிறது. வெளிப்படுத்தல் நூலின் சூழலில் πληγαί என்பதற்கு ‘வாதைகள்’ பொருத்தமானது.
- source_word: ἐλάλησεν μετ’ ἐμοῦ
  choice: என்னுடன் பேசினான்
  rationale: μετά + மரபுவேற்றுமையின் ‘என்னுடன்’ என்ற வடிவை நேரடியாகக் காக்கிறது; தமிழில் ‘என்னிடம் பேசினான்’ என்பதும் சூழலுக்கு இயலும் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: λέγων
  choice: அவன் … என்றான்
  rationale: கிரேக்கப் பங்கேற்புவினை அமைப்பை அப்படியே கடினமாக்காமல், இயல்பான தமிழ் நேர்க்கூற்று அமைப்பாக மாற்றுகிறது.
- source_word: Δεῦρο
  choice: இங்கே வா
  rationale: வருமாறு அழைக்கும் கட்டளையையும், பேச்சாளரிடம் அணுகும் இடநோக்கையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δείξω σοι
  choice: உனக்குக் காட்டுவேன்
  rationale: எதிர்கால வினையின் நேரடியான பொருளைத் தக்கவைக்கிறது.
- source_word: τὴν νύμφην
  choice: மணமகளை
  rationale: νύμφη என்பதன் திருமண உருவகத்தைத் தெளிவாகக் காக்கும் பொதுவான நவீனத் தமிழ் சொல்.
- source_word: τὴν γυναῖκα τοῦ ἀρνίου
  choice: ஆட்டுக்குட்டியானவரின் மனைவியை
  rationale: திருமணச் சூழலில் γυνή என்பதற்கு ‘மனைவி’ பொருத்தமானது. ἀρνίον என்பதை வெளிப்படுத்தல் நூலில் கிறிஸ்துவைக் குறிக்கும் பட்டப்பெயராக மரியாதைச் சொல்லமைப்புடன் மொழிபெயர்க்கிறது.
theological_decisions:
- issue: νύμφην மற்றும் γυναῖκα ஆகியவற்றின் தொடர்பு
  choice: ‘மணமகளை—ஆட்டுக்குட்டியானவரின் மனைவியை—’ என்று இரு பெயர்ச்சொற்களையும் வெளிப்படையாகத் தருதல்
  alternative: ‘ஆட்டுக்குட்டியானவரின் மணமகளை’ என்று ஒரே சொல்லாகச் சுருக்குதல்
  rationale: கிரேக்கத்தில் இரண்டு சொற்களும் விளக்கநிலையில் அருகருகே வருகின்றன. இரண்டையும் வைத்திருப்பது திருமண உருவகத்தின் முழு வலிமையைக் காக்கிறது; தேவையற்ற விளக்கத்தையும் தவிர்க்கிறது.
- issue: ἀρνίον என்பதைக் கிறிஸ்துவைக் குறிக்கும் பட்டப்பெயராக மொழிபெயர்த்தல்
  choice: ஆட்டுக்குட்டியானவர்
  alternative: ஆட்டுக்குட்டி
  rationale: அடிப்படை உருவகத்தை மொழிபெயர்த்தபடியே, தமிழில் ஆளைக் குறிக்கும் இந்தப் பட்டப்பெயருக்கு இயல்பான மரியாதை வடிவைப் பயன்படுத்துகிறது. வசனத்தில் இல்லாத கூடுதல் கிறிஸ்தவக் கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், எளிதில் புரியும் அதேவேளையில் வெளிப்படுத்தல் நூலின் மேன்மையான காட்சிமொழிக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட கிரேக்க அடைமொழித் தொடரின் தொடர்புகள் தமிழிலும் தெளிவாக இருக்குமாறு சொல்வரிசை அமைக்கப்பட்டுள்ளது; மணமகள் மற்றும் மனைவி என்ற இரட்டை உருவகம் கோடுகளால் விளக்கநிலையில் பாதுகாக்கப்பட்டுள்ளது.
