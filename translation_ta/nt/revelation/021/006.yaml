id: REV.21.6
reference: Revelation 21:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἶπέν μοι· ⸂Γέγοναν. ἐγὼ⸃ τὸ Ἄλφα καὶ τὸ Ὦ, ἡ ἀρχὴ καὶ τὸ τέλος. ἐγὼ τῷ διψῶντι δώσω ἐκ τῆς πηγῆς τοῦ ὕδατος τῆς ζωῆς δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/006.yaml
  text: And he said to me[a], “It is done. I am the Alpha and the Omega, the beginning and the end[b]. To the one who is thirsty I will give from the spring of the water of life freely.”
translation:
  language: ta
  text: 'அவர் என்னிடம் சொன்னார்: “இவை நிறைவேறிவிட்டன.[a] நானே அல்பாவும் ஒமேகாவும், தொடக்கமும் முடிவும். தாகமாயிருப்பவருக்கு வாழ்வின் நீரின் ஊற்றிலிருந்து இலவசமாகக் கொடுப்பேன்.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, பாரம்பரியமாக, “முடிந்தது.” கிரேக்க வினை பன்மையில் உள்ளது; நேரடியாக, “அவை நிகழ்ந்துவிட்டன” அல்லது “இவை நிறைவேறிவிட்டன.”
    reason: alternative_reading
  - marker: b
    text: அதாவது, “விலையின்றி” அல்லது “பரிசாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Γέγοναν
  choice: இவை நிறைவேறிவிட்டன
  rationale: γίνομαι என்பதன் பன்மை நிறைவுக்கால வடிவத்தைத் தமிழில் வெளிப்படையாகக் காக்கிறது; அறிவிக்கப்பட்ட புதிய படைப்பின் நிகழ்வுகள் நிறைவேறியுள்ளன என்ற பொருளையும் இயல்பாகத் தருகிறது.
- source_word: τὸ Ἄλφα καὶ τὸ Ὦ
  choice: அல்பாவும் ஒமேகாவும்
  rationale: வெளிப்படுத்தின விசேஷத்தில் நிலைபெற்றுள்ள கிரேக்க எழுத்துப் பெயர்களின் அடையாளத் தன்மையைப் பாதுகாக்கிறது; அடுத்து வரும் ‘தொடக்கமும் முடிவும்’ அதன் கருத்தை விளக்குகிறது.
- source_word: ἡ ἀρχὴ καὶ τὸ τέλος
  choice: தொடக்கமும் முடிவும்
  rationale: இணைச்சொற்களின் நேரடியான பொருளையும், காலம் மற்றும் நோக்குநிறைவு ஆகிய இரு எதிரொலிகளையும் மிகைவிளக்கமின்றிப் பாதுகாக்கும் இயல்பான தமிழ்.
- source_word: τῷ διψῶντι
  choice: தாகமாயிருப்பவருக்கு
  rationale: ஒருவரைச் சுட்டும் பெயர்ச்சொல் தன்மையுள்ள நிகழ்காலப் பங்கேற்புவினையை இயல்பான ஒருமைத் தமிழில் தருகிறது.
- source_word: δώσω
  choice: கொடுப்பேன்
  rationale: எளிய எதிர்கால வாக்குறுதியை நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: ἐκ τῆς πηγῆς
  choice: நீரூற்றிலிருந்து
  rationale: πηγή என்பதன் இயற்கையான ஊற்று அல்லது fountain என்ற படிமத்தைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: τοῦ ὕδατος τῆς ζωῆς
  choice: வாழ்வின் நீரூற்று
  rationale: ‘வாழ்வின் நீர்’ என்ற வேதாகமப் படிமத்தையும் அது பாயும் ஊற்றையும் தமிழில் சீராக ஒருங்கிணைக்கிறது; ‘உயிரளிக்கும் நீர்’ என்று விளக்கிப் பரப்பவில்லை.
- source_word: δωρεάν
  choice: இலவசமாக
  rationale: விலையோ செலவோ இன்றி வழங்கப்படுவதைத் தெளிவாகக் காட்டுகிறது; ‘பரிசாக’ என்ற தொடர்புடைய நுண்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: Γέγοναν என்ற இறை அறிவிப்பின் பன்மையை மொழிபெயர்த்தல்
  choice: இவை நிறைவேறிவிட்டன
  alternative: முடிந்தது
  rationale: கிரேக்க வினை பன்மையில் இருப்பதால், பல நிகழ்வுகள் அல்லது வாக்குறுதிகள் நிறைவேறியுள்ளதை மறைக்காமல் காட்டுகிறது. பாரம்பரிய ஒருமைச் சொற்றொடரை முதன்மை உரையில் ஏற்று அந்தப் பன்மையை ஒழிக்கவில்லை.
- issue: அல்பா/ஒமேகா அடையாளத்தை இறைப் பட்டமாகத் தக்கவைத்தல்
  choice: அல்பாவும் ஒமேகாவும்
  alternative: முதல் எழுத்தும் கடைசி எழுத்தும்
  rationale: வெளிப்படுத்தின விசேஷத்தின் தனித்துவமான கிரேக்க எழுத்துப் படிமத்தையும் அதன் நூலிடைத் தொடர்புகளையும் காக்கிறது; உடன்வரும் ‘தொடக்கமும் முடிவும்’ அதன் கருத்துப் பொருளைத் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘இவை நிறைவேறிவிட்டன’ என்பது மூலத்தின் பன்மையை வெளிப்படுத்துகிறது. ‘அல்பா’, ‘ஒமேகா’ என்ற நிலைபெற்ற வடிவங்கள் அடையாளத் தொடர்ச்சிக்காக வைக்கப்பட்டுள்ளன; அடிக்குறிப்பு குறிகள் அனைத்தும் உரையில் இடம்பெறுகின்றன.
