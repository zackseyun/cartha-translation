  text: ὁ νικῶν κληρονομήσει ταῦτα, καὶ ἔσομαι αὐτῷ θεὸς καὶ αὐτὸς ἔσται μοι υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/007.yaml
  text: The one who overcomes will inherit these things[a], and I will be his God[b], and he will be my son.
translation:
  language: ta
  text: வெற்றிகொள்கிறவர் இவற்றை வாரிசுரிமையாகப் பெறுவார்[a]. நான் அவருடைய கடவுளாக இருப்பேன்; அவர் எனக்கு மகனாக இருப்பார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெற்றிபெறுகிறவர்.” νικάω என்ற கிரேக்க வினைச்சொல், விசுவாசத்தில் நிலைத்து வெல்வதைக் குறிக்க வெளிப்படுத்துதல் நூலில் திரும்பத் திரும்ப வருகிறது.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில், “அவர் எனக்கு மகனாக இருப்பார்.” இங்குள்ள ஆண்பால் சொல் பிரதிநிதித்துவப் பொருளில் அனைவரையும் உள்ளடக்கக்கூடும்; எனினும் மூலத்தின் மகன் மற்றும் வாரிசுரிமைப் படிமம் உரையில் காக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: வெற்றிபெறுகிறவர்
  rationale: பெயர்ச்சொல் போலச் செயல்படும் நிகழ்காலப் பங்கேற்பு வடிவம், தொடர்ந்து வெற்றிகொள்வதனால் அடையாளப்படுத்தப்படும் ஒருவரைக் குறிக்கிறது. வெளிப்படுத்துதலில் திரும்பத் திரும்ப வரும் νικάω சொல்லின் கருத்தை இயல்பான நவீனத் தமிழில் இது காக்கிறது.
- source_word: κληρονομήσει
  choice: உரிமையாகப் பெறுவார்
  rationale: κληρονομέω என்பதன் பரம்பரை அல்லது குடும்ப உரிமையாகப் பெறுதல் என்ற பொருளையும், தொடர்ந்து வரும் தந்தை–மகன் உறவுச் சாயலையும் இச்சொற்றொடர் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ταῦτα
  choice: இவற்றை
  rationale: பன்மைச் சுட்டுப்பெயரான ταῦτα என்பதைக் குறுகியதும் இயல்பானதுமான தமிழில் நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: ἔσομαι αὐτῷ θεὸς
  choice: நான் அவருடைய கடவுளாக இருப்பேன்
  rationale: αὐτῷ என்ற வேற்றுமை வடிவத்தின் உறவுசார் பொருளை இயல்பான தமிழில் வழங்கி, உடன்படிக்கைச் சூத்திரத்தின் எதிரொலியைக் காக்கிறது.
- source_word: αὐτὸς ἔσται μοι υἱός
  choice: அவர் எனக்கு மகனாக இருப்பார்
  rationale: மூலத்தின் 'எனக்கு மகன்' என்ற அமைப்பையும் உறவுசார், தத்தெடுப்பு/வாரிசுரிமைச் சாயலையும் காக்கிறது.
- source_word: υἱός
  choice: மகன்
  rationale: மூலத்தில் உள்ள ஆண்பால் ஒருமை உறவுச்சொல்லையும், வாரிசுரிமை மற்றும் மகத்துவ உறவுப் படிமத்தையும் நடுநிலைப்படுத்தாமல் பாதுகாக்கிறது; அதன் பிரதிநிதித்துவப் பயன்பாடு அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: பொதுவான வாக்குறுதியில் வரும் ஆண்பால் மகன் மொழி
  choice: முதன்மை உரையில் ‘மகன்’ என்பதைக் காத்தல்
  alternative: பிள்ளை
  rationale: υἱός என்பது வெளிப்படையாக ‘மகன்’ என்று பொருள்படும்; இங்கு அது பிரதிநிதித்துவப் பொருளில் இருக்கக்கூடும் என்றாலும், வாரிசுரிமை மற்றும் தந்தை–மகன் படிமம் இறையியல் ரீதியாக முக்கியமானது. ஆகவே அதை முதன்மை உரையில் நடுநிலைப்படுத்தாமல், உள்ளடக்க விரிவை அடிக்குறிப்பில் குறிப்பிடுவது பொருத்தம்.
- issue: உடன்படிக்கைச் சூத்திரத்தின் எதிரொலி
  choice: ‘நான் அவருடைய கடவுளாக இருப்பேன்; அவர் எனக்கு மகனாக இருப்பார்’
  alternative: ‘நான் அவருக்குக் கடவுளாக இருப்பேன்; அவர் எனக்கு ஒரு மகனாக இருப்பார்’
  rationale: தேர்ந்தெடுக்கப்பட்ட வடிவம் உறவின் தனிப்பட்ட தன்மையை இயல்பான தமிழில் தெளிவுபடுத்துகிறது; அதே நேரத்தில் மூலத்தின் உடன்படிக்கை மற்றும் மகனாக்குதல் மொழியை கூடுதல் கோட்பாட்டு விளக்கமின்றிக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் dignified நடையில், வெளிப்படுத்துதல் நூலின் மீளும் வெற்றி மொழியும் உடன்படிக்கைத் தொடர்பும் காக்கப்பட்டுள்ளன. ‘தேவன்’ என்பதற்குப் பதில் பொதுநிலையான ‘கடவுள்’ பயன்படுத்தப்பட்டுள்ளது; ‘உரிமையாகப் பெறுதல்’ κληρονομέω-வின் வாரிசுரிமைச் சாயலை இயல்பாக வெளிப்படுத்துகிறது.
