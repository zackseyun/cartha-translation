  text: and they will bring the glory and the honor of the nations into it[a].
translation:
  language: ta
  text: அவர்கள் தேசங்களின் மகிமையையும் மரியாதையையும் அதற்குள் கொண்டுவருவார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவளுக்குள்’; கிரேக்கத்தில் நகரம் பெண்பாலாகச் சுட்டப்படுகிறது; மேலும், சூழலில் அது மணமகளாக ஆளுருவாக்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴσουσιν
  choice: கொண்டுவருவார்கள்
  rationale: φέρω என்பதன் எதிர்காலச் செயப்பாட்டு வடிவம். வெளியிலிருந்து நகரத்துக்குள் ஒன்றைக் கொண்டுவரும் இயக்கத்தை இயல்பான தமிழில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: δόξαν
  choice: மகிமை
  rationale: வெளிப்படுத்தின விசேஷத்தில் காணப்படும் ஒளிமிகு மேன்மை, பெருமை, புகழ் ஆகிய ஒலிப்புகளைத் தக்கவைக்கும் பரவலான வேதாகமச் சொல்.
- source_word: τιμὴν
  choice: கனம்
  rationale: δόξα என்பதுடன் இணைந்து மதிப்பு, மரியாதை, பெருமை ஆகிய பொருள்களைத் தருகிறது. ‘செல்வம்’ என்று குறுக்காமல் மூலத்தின் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: τῶν ἐθνῶν
  choice: தேசங்களின்
  rationale: மக்கள் இனங்களையும் தேசங்களையும் பரந்த அளவில் குறிக்கிறது; இங்கு முன்னிலைப்படுத்தப்படாத யூதர்–புறவினர் வேறுபாட்டைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: εἰς αὐτήν
  choice: அதற்குள்
  rationale: பெண்பால் சுட்டுப்பெயரின் முன்னிலைச் சொல் புதிய எருசலேம் என்னும் நகரம். நகரைக் குறிக்க நவீனத் தமிழில் ‘அதற்குள்’ என்பது இயல்பானது; பெண்பால் ஆளுருவாக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: καὶ
  choice: -உம் … -உம்
  rationale: தமிழில் இணைப்பை இயல்பாகக் காட்ட ‘மகிமையையும் கனத்தையும்’ என்ற இணை அமைப்பு பயன்படுத்தப்பட்டுள்ளது; வசனத்தின் முந்தைய சூழலுடனான தொடர்ச்சி வாக்கிய ஓட்டத்தில் நிலைக்கிறது.
theological_decisions:
- issue: αὐτήν என்பதன் சுட்டும் பொருளும் நகரத்தின் பெண்பால் ஆளுருவாக்கமும்
  choice: புதிய எருசலேம் என்னும் நகரத்தைச் சுட்டும் வகையில் ‘அதற்குள்’
  alternative: அவளுக்குள்
  rationale: πόλις என்பது கிரேக்கத்தில் பெண்பால் பெயர்ச்சொல்; சூழலில் நகரம் மணமகளாகவும் சித்தரிக்கப்படுகிறது. ஆனால் தமிழில் நகரை ‘அது’ எனச் சுட்டுவது இயல்பானது. ஆளுருவாக்கத்தின் சாத்தியமான நுட்பம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: தேசங்களின் ‘மகிமையும் கனமும்’ என்பதன் பொருள்
  choice: மூலத்தின் பரந்த பொருளை விளக்கமின்றி அப்படியே தக்கவைத்தல்
  alternative: தேசங்களின் செல்வம்; தேசங்களின் பண்பாட்டுச் சிறப்பு; தேசங்கள் செலுத்தும் மரியாதை
  rationale: இச்சொற்றொடர் காணிக்கை, செல்வம், பண்பாட்டு மேன்மை அல்லது மீட்கப்பட்ட தனிச்சிறப்பு ஆகியவற்றில் ஒன்றை மட்டும் உறுதியாகக் குறுக்கவில்லை. குறிப்பிட்ட இறுதிக்காலக் கோட்பாட்டை உரைக்குள் புகுத்தாமல் உருவகத்தின் திறந்த பொருளைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகவும், வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘மகிமை’ மற்றும் ‘கனம்’ என்ற இணை, மூலத்தின் honorific மற்றும் theological பரப்பைச் சுருக்காமல் காக்கிறது.
