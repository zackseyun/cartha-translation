id: REV.17.15
reference: Revelation 17:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ λέγει μοι· Τὰ ὕδατα ἃ εἶδες, οὗ ἡ πόρνη κάθηται, λαοὶ καὶ ὄχλοι εἰσὶν καὶ ἔθνη καὶ γλῶσσαι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/015.yaml
  text: And he says to me, “The waters that you saw, where the prostitute sits, are peoples and crowds and nations and languages.”
translation:
  language: ta
  text: அவர் என்னிடம், “நீ கண்ட நீர்நிலைகள், அந்த விபச்சாரி அமர்ந்திருக்கிறாளோ, அவை மக்களும் மக்கள் கூட்டங்களும் நாடுகளும் மொழிகளும் ஆகும்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὰ ὕδατα
  choice: தண்ணீர்கள்
  rationale: பன்மை உருவகத்தைத் தக்கவைத்து, தமிழில் இயல்பாகப் புரியும் சொல்லைப் பயன்படுத்துகிறது.
- source_word: ἡ πόρνη
  choice: அந்த விபச்சாரி
  rationale: வெளிப்படுத்தின விசேஷத்தின் உருவகப் பெண்ணைக் குறிக்கும் கிரேக்கச் சொல்லின் நேரடியான, தெளிவான பொருள்.
- source_word: λαοὶ καὶ ὄχλοι
  choice: மக்களையும், மக்கள் கூட்டங்களையும்
  rationale: இரு வேறு பன்மைப் பெயர்களையும் ஒன்றாக்காமல், λαοί என்பதற்கு ‘மக்கள்’, ὄχλοι என்பதற்கு ‘மக்கள் கூட்டங்கள்’ என வேறுபடுத்துகிறது.
- source_word: ἔθνη καὶ γλῶσσαι
  choice: நாடுகளையும், மொழியினரையும்
  rationale: ἔθνη என்பதன் அரசியல்/இனக்குழு சார்ந்த விரிவை ‘நாடுகள்’ என்றும், γλῶσσαι என்பதன் இங்கு குறிக்கப்படும் மொழி பேசும் மக்களைக் ‘மொழியினர்’ என்றும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: εἰσὶν
  choice: குறிக்கின்றன
  rationale: அடையாளக் காட்சியின் விளக்கச் சூழலில் ‘ஆகும்’ என்பதைவிட உருவக உறவை இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: தண்ணீர்களுக்கும் மனிதக் குழுக்களுக்கும் உள்ள உருவக உறவு
  choice: ‘குறிக்கின்றன’ என்று மொழிபெயர்த்தல்
  alternative: ‘ஆகும்’ / ‘இருக்கின்றன’
  rationale: இது காட்சியின் அடையாள விளக்கம் என்பதைத் தெளிவாக்குகிறது; அதற்கு அப்பாற்பட்ட இறையியல் அடையாளத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும் அதேவேளையில் கண்ணியமான வெளிப்பாடு. ‘அந்த விபச்சாரி அமர்ந்திருக்கிற இடத்திலுள்ளவை’ என்ற இடைச்செருகல் கிரேக்கத் தொடர்பைத் தெளிவாக வைத்திருக்கிறது.
