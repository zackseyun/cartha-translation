revisions:
- from: ஏனெனில், தேவன் தமது நோக்கத்தை நிறைவேற்றும் எண்ணத்தை அவர்களுடைய உள்ளங்களில் ஏற்படுத்தினார். அதனால் அவர்கள் ஒரே நோக்கத்துடன் செயல்பட்டு[a], தங்கள் அரசாட்சியை மிருகத்துக்குக் கொடுப்பார்கள்—தேவனுடைய வார்த்தைகள் நிறைவேறும்வரை[b].
  to: ஏனெனில், தேவனுடைய வார்த்தைகள் நிறைவேறும்வரை, தமது நோக்கத்தை நிறைவேற்றவும், ஒரே நோக்கத்துடன் செயல்படவும், தங்கள் அரசாட்சியை அந்த மிருகத்துக்குக் கொடுக்கவும் தேவன் அவர்களுடைய உள்ளங்களில் எண்ணத்தை ஏற்படுத்தினார்.[a]
  rationale: 'மூலத்தில் உள்ள தொடர்ச்சியான நோக்க அமைப்பைத் தமிழில் மீட்டமைத்துள்ளேன்: தேவன் அவர்களுடைய உள்ளங்களில் எண்ணத்தை ஏற்படுத்தினார்; அந்த எண்ணம் தமது நோக்கத்தை நிறைவேற்றுதல், ஒரே நோக்கத்துடன் செயல்படுதல், அரசாட்சியை மிருகத்துக்குக் கொடுத்தல் ஆகியவற்றை உள்ளடக்கியது. ‘வரை’ என்னும் கால வரம்பு வாக்கியத்தின் தொடக்கத்தில் வைக்கப்பட்டதால் முழு நடவடிக்கையின் எல்லையாக இயங்குகிறது. கட்டமைப்பு மாற்றம் காரணமாக முந்தைய [b] அடிக்குறிப்பு உரையில் தொடர்புடைய இடம் இல்லாமல் இருந்தது; நிறைவேற்றுதல் தொடர்பான மாற்றுச் சொல்லை தனி [b] அடிக்குறிப்பாகக் காக்க, உரையில் ‘நிறைவேறும்வரை’க்கு [b] குறியீடு சேர்க்கப்பட வேண்டும். முழு உரையின் சரியான குறியீட்டுப் பதிப்பு கீழே: “ஏனெனில், தேவனுடைய வார்த்தைகள் நிறைவேறும்வரை[b], தமது நோக்கத்தை நிறைவேற்றவும், ஒரே நோக்கத்துடன் செயல்படவும், தங்கள் அரசாட்சியை அந்த மிருகத்துக்குக் கொடுக்கவும் தேவன் அவர்களுடைய உள்ளங்களில் எண்ணத்தை ஏற்படுத்தினார்.[a]”'
