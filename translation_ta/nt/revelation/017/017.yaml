id: REV.17.17
reference: Revelation 17:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὁ γὰρ θεὸς ἔδωκεν εἰς τὰς καρδίας αὐτῶν ποιῆσαι τὴν γνώμην αὐτοῦ, καὶ ποιῆσαι ⸂μίαν γνώμην⸃ καὶ δοῦναι τὴν βασιλείαν αὐτῶν τῷ θηρίῳ, ἄχρι ⸀τελεσθήσονται οἱ λόγοι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/017.yaml
  text: For God put it into their hearts to carry out his purpose[a], and to act with one purpose and to give their kingdom to the beast[b], until the words of God are fulfilled.
translation:
  language: ta
  text: ஏனெனில், தேவனுடைய வார்த்தைகள் நிறைவேறும்வரை, தமது நோக்கத்தை நிறைவேற்றவும், ஒரே நோக்கத்துடன் செயல்படவும், தங்கள் அரசாட்சியை அந்த மிருகத்துக்குக் கொடுக்கவும் தேவன் அவர்களுடைய உள்ளங்களில் எண்ணத்தை ஏற்படுத்தினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரே மனமுள்ளவர்களாக இருக்கவும்’ அல்லது ‘ஒரே நோக்கத்தைக் கொள்ளவும்.’ கிரேக்கத்தில் சொற்சொல்லாக, ‘ஒரே நோக்கத்தைச் செய்யவும்’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν εἰς τὰς καρδίας αὐτῶν
  choice: அவர்களுடைய உள்ளங்களில் எண்ணத்தை ஏற்படுத்தினார்
  rationale: உடல் உறுப்பான இதயத்துக்குள் எதையோ கொடுத்தார் என்ற சொற்சொல் வடிவத்தைத் தவிர்த்து, உள்ளார்ந்த எண்ணத்தையும் தூண்டுதலையும் தேவன் உண்டாக்கினார் என்ற கிரேக்க மரபுத்தொடரின் பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; அதேவேளையில் தேவனுடைய செயற்பாட்டை வெறும் அனுமதியாக மெலிதாக்கவில்லை.
- source_word: ποιῆσαι τὴν γνώμην αὐτοῦ
  choice: தமது நோக்கத்தை நிறைவேற்றும்
  rationale: இங்கு γνώμη என்பது கருத்து அல்லது அபிப்பிராயம் என்பதைக் காட்டிலும் திட்டமிட்ட நோக்கம் அல்லது தீர்மானத்தைக் குறிக்கிறது. ποιῆσαι உடன் சேரும்போது அந்த நோக்கத்தைச் செயலாக்குவது என்ற பொருள் வருவதால் ‘நிறைவேற்றும்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ποιῆσαι μίαν γνώμην
  choice: ஒரே நோக்கத்துடன் செயல்பட்டு
  rationale: ‘ஒரே நோக்கத்தைச் செய்ய’ என்ற சுருக்கமான கிரேக்க அமைப்பு அரசர்களின் ஒன்றுபட்ட எண்ணத்தையும் அதன்படியான செயலையும் குறிக்கிறது. தமிழில் இயல்பாகவும் செயற்பாட்டு வலிமையுடனும் இருக்க இவ்வாறு தரப்பட்டது.
- source_word: δοῦναι τὴν βασιλείαν αὐτῶν
  choice: தங்கள் அரசாட்சியை ... கொடுப்பார்கள்
  rationale: βασιλεία என்பது இங்கு ராஜ்யம், ஆட்சி அல்லது அரச அதிகாரத்தைக் குறிக்கலாம். கிரேக்கத்திலுள்ள ஒருமையையும் ஆட்சியை ஒப்படைக்கும் கருத்தையும் காக்க ‘அரசாட்சி’ பயன்படுத்தப்பட்டது; δοῦναι என்பதற்கு நேரான ‘கொடு’ வினை வைக்கப்பட்டது.
- source_word: τῷ θηρίῳ
  choice: மிருகத்துக்கு
  rationale: வெளிப்படுத்தின விசேஷத்தின் தொடர்ச்சியான உருவகத்தையும் நூலுக்குள் உள்ள சொல்லிணக்கத்தையும் காக்க θηρίον ‘மிருகம்’ என வழங்கப்பட்டது.
- source_word: ἄχρι τελεσθήσονται οἱ λόγοι τοῦ θεοῦ
  choice: தேவனுடைய வார்த்தைகள் நிறைவேறும்வரை
  rationale: τελέω என்பதன் எதிர்காலச் செயப்பாட்டு வடிவம் முடிவை அடைதல் அல்லது நிறைவேறுதல் என்னும் பொருளைத் தருகிறது. தீர்க்கதரிசனச் சூழலில் ‘நிறைவேறு’ இயல்பாகப் பொருந்துகிறது; λόγοι என்பதன் பரந்த பொருளை ‘வார்த்தைகள்’ காக்கிறது.
theological_decisions:
- issue: அரசர்களின் செயல்களில் தேவ இறையாண்மையும் மனிதச் செயற்பாடும்
  choice: தேவன் அவர்களுடைய உள்ளங்களில் எண்ணத்தை ஏற்படுத்தினார் என்றும், அவர்கள் ஒன்றுபட்டுச் செயல்பட்டு அரசாட்சியைக் கொடுப்பார்கள் என்றும் இரண்டையும் தெளிவாகக் கூறுதல்
  alternative: தேவன் வெறுமனே ‘அனுமதித்தார்’ என்று மெலிதாக்குதல், அல்லது கிரேக்கத்தைவிட அதிகமான நிர்ணயவாத மொழியைச் சேர்த்தல்
  rationale: மூலவசனம் தேவனுடைய காரணச் செயலை நேரடியாகக் கூறுவதோடு, அரசர்களுடைய உண்மையான நோக்கமுள்ள செயலையும் கூறுகிறது. மொழிபெயர்ப்பு இந்த இறையியல் இழுவிசையைத் தீர்த்துவிடாமல் இரண்டையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. கிரேக்கத்தின் நீண்ட இறைவினைத் தொடரை தமிழின் இயல்புக்கேற்ப காரணம்–விளைவு அமைப்பாகப் பிரித்தாலும், தேவனுடைய நோக்கம், அரசர்களின் ஒருமித்த செயல், மிருகத்துக்குக் கொடுக்கப்படும் அரசாட்சி, தேவ வார்த்தைகளின் நிறைவேற்றம் ஆகிய தொடர்புகள் அனைத்தும் காக்கப்பட்டுள்ளன.
