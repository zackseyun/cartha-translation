id: REV.17.14
reference: Revelation 17:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὗτοι μετὰ τοῦ ἀρνίου πολεμήσουσιν, καὶ τὸ ἀρνίον νικήσει αὐτούς, ὅτι κύριος κυρίων ἐστὶν καὶ βασιλεὺς βασιλέων, καὶ οἱ μετ’ αὐτοῦ κλητοὶ καὶ ἐκλεκτοὶ καὶ πιστοί.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/014.yaml
  text: These will make war against the Lamb[a], and the Lamb will conquer them, because he is Lord of lords and King of kings, and those with him are called and chosen and faithful.
translation:
  language: ta
  text: இவர்கள் ஆட்டுக்குட்டிக்கு எதிராகப் போர் செய்வார்கள்[a]. ஆட்டுக்குட்டி அவர்களை வெல்வார்; ஏனெனில், அவர் ஆண்டவர்களுக்கெல்லாம் ஆண்டவரும் அரசர்களுக்கெல்லாம் அரசரும் ஆவார். அவரோடு இருப்பவர்கள் அழைக்கப்பட்டவர்களும் தேர்ந்தெடுக்கப்பட்டவர்களும் உண்மையுள்ளவர்களும் ஆவர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: கிரேக்கத்தில் நேரடியாக, “ஆட்டுக்குட்டியோடு போர் செய்வார்கள்”; இச்சூழலில் இது அவருக்கு எதிராகப் போர் செய்வதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: இவர்கள்
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட அரசர்களைச் சுட்டும் சுட்டுப்பெயரின் அண்மைச் சுட்டும் தன்மையைப் பேணுகிறது.
- source_word: μετὰ τοῦ ἀρνίου
  choice: ஆட்டுக்குட்டிக்கு எதிராக
  rationale: μετά உடன் வரும் சொற்றொடரின் நேரடிப் பொருள் ‘ஆட்டுக்குட்டியோடு’ என்றாலும், πολεμέω என்ற போர்ச் சூழலில் எதிர்த்துப் போர் செய்வதையே குறிக்கிறது; ‘எதிராக’ என்பது கூட்டணியென்ற தவறான புரிதலைத் தவிர்க்கிறது.
- source_word: ἀρνίον
  choice: ஆட்டுக்குட்டி
  rationale: வெளிப்படுத்தின விசேஷத்தில் கிறிஸ்துவைக் குறிக்கும் தனித்துவமான உருவகப் பட்டத்தை இயல்பாகவும் தொடர்ச்சியாகவும் வழங்குகிறது.
- source_word: πολεμήσουσιν
  choice: போர் செய்வார்கள்
  rationale: எதிர்கால வினையையும் பரந்த இராணுவப் பொருளையும் கண்ணியமான நடையில் பேணுகிறது.
- source_word: νικήσει
  choice: வெற்றிகொள்ளும்
  rationale: வெளிப்படுத்தின விசேஷத்தில் மீண்டும் மீண்டும் வரும் νικάω என்பதன் வெற்றி/மேற்கொள்ளுதல் கருத்தை இப்போர்ச் சூழலுக்கு ஏற்றவாறு தருகிறது.
- source_word: κύριος κυρίων
  choice: ஆண்டவர்களுக்கெல்லாம் ஆண்டவர்
  rationale: உயர்ந்த பரம அதிகாரத்தை வெளிப்படுத்தும் எபிரேய-கிரேக்க உயர்நிலைச் சொல்லமைப்பை இயல்பான தமிழில் பேணுகிறது.
- source_word: βασιλεὺς βασιλέων
  choice: அரசர்களுக்கெல்லாம் அரசர்
  rationale: அனைத்து அரசர்களுக்கும் மேலான அரசாட்சியைத் தெரிவிக்கும் பட்டத்தைத் தெளிவான நவீன தமிழில் வழங்குகிறது.
- source_word: κλητοὶ
  choice: அழைக்கப்பட்டவர்கள்
  rationale: அழைப்பு அழைப்பிதழா அல்லது செயல்திறன் மிக்க அழைப்பா என்பதைத் தீர்மானிக்காமல், κλητός என்பதன் இறையியல் ஒலிப்பைத் தக்கவைக்கிறது.
- source_word: ἐκλεκτοὶ
  choice: தேர்ந்தெடுக்கப்பட்டவர்கள்
  rationale: பிற்காலக் கோட்பாட்டு சொற்பயன்பாட்டைத் திணிக்காமல், தெரிவுசெய்யப்பட்ட நிலையை நேரடியாகக் குறிக்கிறது.
- source_word: πιστοί
  choice: உண்மையுள்ளவர்கள்
  rationale: நம்புதல் என்ற பொருளை மட்டும் அல்லாமல் நிலைத்த நம்பகத்தன்மை மற்றும் பற்றுறுதியையும் உள்ளடக்குகிறது.
theological_decisions:
- issue: ஆட்டுக்குட்டியின் பட்டமும் வெற்றி மொழியும்
  choice: ‘ஆட்டுக்குட்டி’ மற்றும் ‘வெற்றிகொள்ளும்’ என்று மொழிபெயர்த்தல்
  alternative: ‘செம்மறியாட்டுக்குட்டி’ மற்றும் ‘மேற்கொள்ளும்’
  rationale: வெளிப்படுத்தின விசேஷத்தின் தனித்துவமான கிறிஸ்துவியல் உருவகத்தையும் νικάω என்ற தொடர்ச்சியான வெற்றிக் கருப்பொருளையும் கூடுதல் கோட்பாட்டு விளக்கமின்றிப் பேணுகிறது.
- issue: κλητοὶ καὶ ἐκλεκτοὶ καὶ πιστοί என்ற மும்மை விளக்கம்
  choice: ‘அழைக்கப்பட்டவர்களும் தேர்ந்தெடுக்கப்பட்டவர்களும் உண்மையுள்ளவர்களும்’ என்று மூன்று விளக்கங்களையும் இணையாகப் பேணுதல்
  alternative: ‘அழைக்கப்பட்ட, தெரிந்துகொள்ளப்பட்ட, விசுவாசமுள்ளோர்’
  rationale: அழைப்பு, தேர்வு, விசுவாசம் ஆகியவற்றின் உறவையோ வரிசையையோ ஒரு குறிப்பிட்ட இரட்சிப்பியல் அமைப்புக்குள் தீர்மானிக்காமல், மூலத்தின் இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
- issue: οἱ μετ’ αὐτοῦ என்ற இறுதி சொற்றொடரின் வினையற்ற அமைப்பு
  choice: ‘அவரோடு இருப்பவர்கள் ... ஆவர்’ என அடையாளப்படுத்தும் பெயர்ப் பயனிலை வாக்கியமாக வழங்குதல்
  alternative: ‘அவரோடு இருக்கும் ... மக்களும் வெற்றிபெறுவார்கள்’ என்று முந்தைய வெற்றி வினையை நிரப்புதல்
  rationale: கிரேக்கத்தில் தோழர்களுக்காக தனி வெற்றி வினை வெளிப்படையாக இல்லை. ஆகவே அவர்கள் வெற்றியில் பங்குபெறுவதாகத் தெளிவாக்கிக் கூட்டாமல், அவர்களை அழைக்கப்பட்ட, தேர்ந்தெடுக்கப்பட்ட, உண்மையுள்ளவர்கள் என அடையாளப்படுத்தும் அமைப்பு மூலத்தின் சுருக்கத்தையும் தெளிவின்மையையும் பேணுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிதில் புரியும் அதேவேளையில் வெளிப்படுத்தின விசேஷத்தின் உயர்ந்த இறுதிக்காலப் போர்நடையைப் பேணும் கண்ணியமான நடை. ‘ஆண்டவர்களுக்கெல்லாம் ஆண்டவர்; அரசர்களுக்கெல்லாம் அரசர்’ என்ற அமைப்பு உச்ச அதிகாரத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
