id: REV.17.3
reference: Revelation 17:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἀπήνεγκέν με εἰς ἔρημον ἐν πνεύματι. καὶ εἶδον γυναῖκα καθημένην ἐπὶ θηρίον κόκκινον, ⸀γέμοντα ὀνόματα βλασφημίας, ⸀ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/003.yaml
  text: And he carried me away in the Spirit into a wilderness. And I saw a woman sitting on a scarlet beast[a], full of blasphemous names, having seven heads and ten horns.
translation:
  language: ta
  text: அவர் என்னை ஆவியில்[a] ஒரு பாழ்நிலத்திற்குக் கொண்டுபோனார். இறைநிந்தனைப் பெயர்கள் நிறைந்த செந்நிற மிருகத்தின்மேல் ஒரு பெண் உட்கார்ந்திருப்பதைக் கண்டேன். அந்த மிருகத்திற்கு ஏழு தலைகளும் பத்துக் கொம்புகளும் இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆவியில்.” இந்தச் சொற்றொடர் ஆவிக்குரிய தரிசன நிலையைக் குறிக்கலாம்; ஆவியானவரால் கொண்டுசெல்லப்பட்டதையும் குறிக்கலாம். வெளிப்படுத்தின விசேஷத்தில் இது பொதுவாக ஒரு தரிசன அனுபவத்தை அறிமுகப்படுத்துகிறது.
    reason: மூல கிரேக்கத்தின் திறந்த பொருளைத் தக்கவைத்து, மாற்றுப் புரிதலை நேரடியாகக் குறிப்பிடுகிறது.
lexical_decisions:
- source_word: ἀπήνεγκέν
  choice: கொண்டுபோனார்
  rationale: ஓரிடத்திலிருந்து வேறோரிடத்திற்குக் கொண்டுசெல்லப்படுவதை வினைச்சொல் குறிக்கிறது; தரிசன அனுபவத்தின் சூழலில் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: εἰς ἔρημον
  choice: ஒரு பாழ்நிலத்திற்கு
  rationale: ἔρημος என்பது பாலைவனம் மட்டுமல்லாமல் வெறுமையான அல்லது மனித நடமாட்டமற்ற இடத்தையும் குறிக்கலாம். பெயர்ச்சொல்லுக்கு முன் சுட்டுச்சொல் இல்லாததால், குறிப்பிட்ட ஓர் இடமாக வரையறுக்காமல் மொழிபெயர்க்கப்பட்டது.
- source_word: ἐν πνεύματι
  choice: ஆவியில்
  rationale: வெளிப்படுத்தின விசேஷத்தில் இச்சொற்றொடர் தீர்க்கதரிசனத் தரிசன நிலையை அறிமுகப்படுத்துகிறது. தமிழ் வடிவம் ஆவிக்குரிய நிலை மற்றும் ஆவியானவரின் செயல்பாடு ஆகிய இரு நுட்பங்களையும் தேவையின்றித் தீர்மானிக்காமல் வைத்திருக்கிறது.
- source_word: γυναῖκα καθημένην ἐπὶ θηρίον
  choice: மிருகத்தின்மேல் ஒரு பெண் உட்கார்ந்திருப்பதை
  rationale: பெண் மிருகத்தின்மேல் அமர்ந்திருந்த காட்சியை நேரடியாகவும் இயல்பாகவும் எடுத்துரைக்கிறது.
- source_word: θηρίον
  choice: மிருகம்
  rationale: வெளிப்படுத்தின விசேஷத்தின் அபோகலிப்டிக் படிமத்திற்குரிய நிலையான, புரிந்துகொள்ளத்தக்க தமிழ் சொல்.
- source_word: κόκκινον
  choice: செந்நிற
  rationale: கண்ணைக் கவரும் அடர்ந்த சிவப்பு அல்லது scarlet நிறத்தைச் சுருக்கமாகவும் இலக்கிய நயத்துடனும் குறிக்கிறது.
- source_word: γέμοντα ὀνόματα βλασφημίας
  choice: இறைநிந்தனைப் பெயர்களால் நிறைந்த
  rationale: γέμοντα என்பதன் ‘நிறைந்த’ என்ற பொருளையும், βλασφημίας என்பதன் கடவுளுக்கு எதிரான நிந்தனை நுட்பத்தையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα
  choice: அந்த மிருகத்திற்கு ஏழு தலைகளும் பத்துக் கொம்புகளும் இருந்தன
  rationale: கிரேக்கத்தின் விளக்கத் தொடரை தமிழில் குழப்பமின்றி வாசிக்க ஏற்ற தனி வாக்கியமாக்கி, எண்ணிக்கைகளையும் அபோகலிப்டிக் படிமத்தையும் அப்படியே பாதுகாக்கிறது.
theological_decisions:
- issue: ἐν πνεύματι என்பதன் பொருள்
  choice: ஆவியில்
  alternative: ஆவியானவரால்
  rationale: இந்தச் சொற்றொடர் ஒரு தரிசன அல்லது ஆவிக்குரிய நிலையைக் குறிக்கலாம்; அதேவேளையில் பரிசுத்த ஆவியானவரின் செயல்பாட்டையும் சுட்டலாம். மூலமொழியின் இந்தத் திறந்த நுட்பத்தை முதன்மை உரை பாதுகாக்கிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிதாகப் புரியும், அதேசமயம் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. ‘வனாந்தரம்’ போன்ற பழைய வழக்கிற்கு மாற்றாக ‘பாழ்நிலம்’ பயன்படுத்தப்பட்டது. நீண்ட கிரேக்கப் பெயரெச்சத் தொடரைத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாக அமைத்துள்ளோம்; எந்தக் குறியீட்டு விளக்கமும் உரைக்குள் சேர்க்கப்படவில்லை.
