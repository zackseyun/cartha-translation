id: REV.17.7
reference: Revelation 17:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἶπέν μοι ὁ ἄγγελος· Διὰ τί ἐθαύμασας; ἐγὼ ἐρῶ σοι τὸ μυστήριον τῆς γυναικὸς καὶ τοῦ θηρίου τοῦ βαστάζοντος αὐτήν, τοῦ ἔχοντος τὰς ἑπτὰ κεφαλὰς καὶ τὰ δέκα κέρατα·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/007.yaml
  text: And the angel said to me[a], “Why did you marvel? I will tell you the mystery of the woman and of the beast that carries her, which has the seven heads and the ten horns.”
translation:
  language: ta
  text: 'மேலும், தூதர் என்னிடம் கூறினார்: “நீ ஏன் வியப்படைந்தாய்? பெண்ணையும், அவளைச் சுமக்கிற[a]—ஏழு தலைகளும் பத்துக் கொம்புகளும் உடைய—மிருகத்தையும் பற்றிய மறைபொருளை நான் உனக்குச் சொல்வேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவளைத் தாங்குகிற.’
    reason: βαστάζοντος என்பது உடல் ரீதியாக ‘சுமக்கிற’ என்றும் ஆதரவாக ‘தாங்குகிற’ என்றும் பொருள்படக்கூடும்.
lexical_decisions:
- source_word: ἐθαύμασας
  choice: வியப்படைந்தாய்
  rationale: θαυμάζω இங்கு வெறும் ஆர்வத்தையல்ல, கண்ட காட்சியால் ஏற்பட்ட வியப்பைக் குறிக்கிறது; ‘வியப்படைந்தாய்’ என்பது நவீன தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: μυστήριον
  choice: மறைபொருள்
  rationale: இச்சொல் தீர்க்க வேண்டிய புதிரை மட்டும் குறிக்காமல், இதுவரை மறைந்திருந்து இப்போது வெளிப்படுத்தப்படும் உண்மையைக் குறிக்கிறது; வெளிப்படுத்தின விசேஷத்தின் தரிசனச் சூழலுக்கு ‘மறைபொருள்’ பொருந்துகிறது.
- source_word: γυναικός
  choice: பெண்
  rationale: γυνή என்பதற்கு ‘மனைவி’ என்ற பொருளும் இருக்கலாம்; ஆனால் இங்கு திருமண உறவு சுட்டப்படாமல் அடையாளக் காட்சியிலுள்ள பெண் குறிப்பிடப்படுவதால் ‘பெண்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: θηρίου
  choice: மிருகம்
  rationale: வெளிப்படுத்தின விசேஷத்தில் θηρίον பகைமைமிக்க தரிசன உருவத்தைக் குறிக்கும் நிலையான சொல்; ‘மிருகம்’ அந்த உருவகத்தையும் நூலுக்குள் உள்ள சொல் தொடர்ச்சியையும் காக்கிறது.
- source_word: βαστάζοντος
  choice: சுமக்கிற
  rationale: βαστάζω என்பது சுமத்தல், தாங்குதல் ஆகிய பொருட்களை ஏற்கலாம். பெண் மிருகத்தின் மேல் இருப்பதாகிய காட்சியை ‘சுமக்கிற’ நேரடியாகத் தெரிவிக்கிறது; வேறு சாத்தியம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἔχοντος
  choice: உடைய
  rationale: இப்பெயரெச்சம் மிருகத்தையே விளக்குகிறது. ‘ஏழு தலைகளும் பத்துக் கொம்புகளும் உடைய மிருகம்’ என்பது தமிழில் இயல்பாகவும் கிரேக்கத் தொடர்பைத் தெளிவாகவும் காட்டுகிறது.
- source_word: κεφαλάς
  choice: தலைகள்
  rationale: தரிசனத்தின் உடல்சார் அடையாளப் படிமத்தை நேரடியாகக் காக்கிறது.
- source_word: κέρατα
  choice: கொம்புகள்
  rationale: வெளிப்படுத்தின விசேஷம் முழுவதிலும் முக்கியமான அடையாளப் படிமமாக இருப்பதால் நேரடியாக மொழிபெயர்க்கப்பட்டது.
- source_word: Διὰ τί
  choice: ஏன்
  rationale: காரணம் கேட்கும் கிரேக்க வினாவுக்கு இயல்பான, சுருக்கமான தமிழ் வடிவம்.
- source_word: ἐρῶ σοι
  choice: நான் உனக்குச் சொல்வேன்
  rationale: தூதர் அடுத்து வெளிப்படுத்தவிருக்கும் விளக்கத்தை நேரடியாக அறிமுகப்படுத்தும் இயல்பான எதிர்கால வாக்கியம்.
theological_decisions:
- issue: ‘ஏழு தலைகளும் பத்துக் கொம்புகளும் உடையது’ என்ற விளக்கத்தின் தொடர்பு
  choice: அவ்விளக்கம் மிருகத்தோடு தெளிவாக இணைக்கப்பட்டது.
  alternative: பெண்ணையும் மிருகத்தையும் பற்றிய ஒருங்கிணைந்த மறைபொருளோடு இவ்விளக்கத்தைத் தளர்வாக இணைத்தல்.
  rationale: τοῦ βαστάζοντος மற்றும் τοῦ ἔχοντος ஆகிய ஆண்பால்/அஃறிணை ஒருமை வடிவங்கள் θηρίου என்பதோடு இலக்கண ரீதியாக ஒத்திருக்கின்றன; γυναικός என்பதோடு அல்ல. ஆகவே தலைகளும் கொம்புகளும் மிருகத்துக்குரியவை என்பதைத் தமிழ் தெளிவாகக் காட்டுகிறது.
- issue: ஒரே μυστήριον பெண்ணையும் மிருகத்தையும் உள்ளடக்குவது
  choice: இரு தொடர்புகளிலும் ‘மறைபொருள்’ எனத் தமிழில் மீளக் கூறி, அவை ஒரே வெளிப்படுத்தப்படுகிற மறைபொருளின் இணைந்த அம்சங்கள் என வாக்கிய அமைப்பில் வைத்திருக்கப்பட்டது.
  alternative: ‘பெண்ணையும் மிருகத்தையும் பற்றிய மறைபொருள்’ என்று ஒரே முறை கூறுதல்.
  rationale: கிரேக்கத்தில் μυστήριον ஒருமையில் இருந்தாலும், தமிழில் நீண்ட உரிமைத் தொடர்களைத் தெளிவுபடுத்த சொல்லை மீளக் கூறுவது இயல்பானது; இதனால் இரண்டு தனித்தனி மறைபொருள்கள் என்ற கோட்பாட்டு முடிவு கட்டாயப்படுத்தப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான தரிசன நடையில் மொழிபெயர்க்கப்பட்டது. நீளமான கிரேக்க உரிமைத் தொடர் தமிழில் இயல்பாக அமைய மறைபொருள் என்ற சொல் மீளக் கூறப்பட்டுள்ளது; மிருகத்தை விளக்கும் கூறுகள் அதனுடன் அருகில் வைக்கப்பட்டுள்ளன.
