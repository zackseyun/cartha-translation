- from: அப்போது அந்தத் தூதர் என்னிடம், “நீ ஏன் வியப்படைந்தாய்? அந்தப் பெண்ணுடைய மறைபொருளையும், அவளைச் சுமக்கிற[a], ஏழு தலைகளும் பத்துக் கொம்புகளும் உடைய மிருகத்தினுடைய மறைபொருளையும் நான் உனக்குச் சொல்வேன்” என்றார்.
