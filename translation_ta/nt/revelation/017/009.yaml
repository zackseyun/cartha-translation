source:
  edition: SBLGNT
  text: Ὧδε ὁ νοῦς ὁ ἔχων σοφίαν. αἱ ἑπτὰ κεφαλαὶ ἑπτὰ ὄρη εἰσίν, ὅπου ἡ γυνὴ κάθηται ἐπ’ αὐτῶν. καὶ βασιλεῖς ⸂ἑπτά εἰσιν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/009.yaml
  text: 'Here is the mind that has wisdom: the seven heads are seven mountains on which the woman sits[a], and they are seven kings.'
translation:
  language: ta
  text: 'இங்கே ஞானமுள்ள மனம் உள்ளது: அந்த ஏழு தலைகள், அந்தப் பெண் அமர்ந்திருக்கும் ஏழு மலைகள்[a]; அவை ஏழு அரசர்களும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஏழு குன்றுகள்.’ கிரேக்கச் சொல் மலைகளையோ குன்றுகளையோ குறிக்கலாம்; ‘மலைகள்’ என்பது அதன் நேரடியான மொழிபெயர்ப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὧδε ὁ νοῦς ὁ ἔχων σοφίαν
  choice: ஞானமுள்ள மனம் இதைப் புரிந்துகொள்ளட்டும்
  rationale: கிரேக்கச் சொற்றொடர் விளக்கத்தைப் புரிந்துகொள்ள ஞானமுள்ள மனம் தேவை என்பதைச் சுட்டுகிறது. சொற்சொல்லான தமிழைவிட இயல்பாகவும், அதன் விவேக அழைப்பைப் பாதுகாக்கும் வகையிலும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: αἱ ἑπτὰ κεφαλαὶ
  choice: அந்த ஏழு தலைகளும்
  rationale: வெளிப்படுத்தின விசேஷத்தின் குறியீட்டுச் சொல்லான ‘தலைகள்’ என்பதைக் கருத்துரையின்றி அப்படியே தக்கவைக்கிறது.
- source_word: ἑπτὰ ὄρη
  choice: ஏழு மலைகள்
  rationale: ὄρη என்பதன் நேரடியான பொருள் ‘மலைகள்’; ரோமின் ‘குன்றுகள்’ என்ற குறிப்பிட்ட விளக்கத்தை முதன்மை உரையில் புகுத்தவில்லை.
- source_word: ὅπου ἡ γυνὴ κάθηται ἐπ’ αὐτῶν
  choice: அந்தப் பெண் அமர்ந்திருக்கிற
  rationale: கிரேக்கத்தில் உள்ள இடத்தைக் குறிக்கும் தொடரையும் ‘அவற்றின்மேல்’ என்ற கருத்தையும் தமிழில் தேவையற்ற இரட்டிப்பின்றி இயல்பாக வெளிப்படுத்துகிறது; ‘மலைகள்’ என்பதே அவள் அமர்ந்திருக்கும் ஆதாரம் என்று சூழல் தெளிவாக்குகிறது.
- source_word: καὶ βασιλεῖς ἑπτά εἰσιν
  choice: அவை ஏழு அரசர்களும்கூட
  rationale: ‘அவை’ என்பது ஏழு தலைகளைச் சுட்டுவதாக வைத்து, தலைகள் மலைகளாகவும் அரசர்களாகவும் அடையாளப்படுத்தப்படும் இணைப்பைப் பாதுகாக்கிறது. ‘அரசர்கள்’ என்பது βασιλεῖς என்பதன் நேரடியான மொழிபெயர்ப்பு.
theological_decisions:
- issue: ஏழு தலைகளின் குறியீட்டு அடையாளம்
  choice: தலைகள் ஏழு மலைகளாகவும் ஏழு அரசர்களாகவும் கூறப்படும் இரு குறியீட்டு இணைப்புகளையும் மட்டும் மொழிபெயர்த்தல்
  alternative: மலைகளை ரோமின் ஏழு குன்றுகளாகவும், அரசர்களை குறிப்பிட்ட பேரரசர்கள் அல்லது அரசாட்சிகளாகவும் விளக்குதல்
  rationale: வசனம் வரலாற்றுக் குறிப்பைத் திட்டவட்டமாக நிர்ணயிக்கவில்லை. எனவே ரோம், பேரரசர்கள், அரசாட்சிகள் போன்ற எந்த விளக்கத்தையும் முதன்மை உரையில் திணிக்காமல் அதன் குறியீட்டு மற்றும் இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘ஞானமுள்ள மனம் இதைப் புரிந்துகொள்ளட்டும்’ என்பது அசல் மொழியின் விவேக அழைப்பைச் சொற்சொல்லான கடினத் தமிழின்றி எடுத்துரைக்கிறது. குறியீடுகள் விளக்கப்படாமல் தக்கவைக்கப்பட்டுள்ளன.
