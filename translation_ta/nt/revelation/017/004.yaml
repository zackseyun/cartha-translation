id: REV.17.4
reference: Revelation 17:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἡ γυνὴ ἦν περιβεβλημένη πορφυροῦν καὶ κόκκινον, ⸀καὶ κεχρυσωμένη ⸀χρυσίῳ καὶ λίθῳ τιμίῳ καὶ μαργαρίταις, ἔχουσα ποτήριον χρυσοῦν ἐν τῇ χειρὶ αὐτῆς γέμον βδελυγμάτων καὶ τὰ ἀκάθαρτα τῆς πορνείας αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/004.yaml
  text: And the woman was clothed in purple and scarlet[a], and adorned with gold and precious stones and pearls, holding in her hand a golden cup full of abominations and the unclean things of her sexual immorality.
translation:
  language: ta
  text: அந்தப் பெண் ஊதா நிறமும் செந்நிறமுமான ஆடைகளை அணிந்திருந்தாள். அவள் பொன்னாலும் விலையுயர்ந்த கற்களாலும் முத்துகளாலும் அலங்கரிக்கப்பட்டிருந்தாள். அருவருப்பானவற்றாலும், அவளுடைய பாலியல் ஒழுக்கக்கேட்டின்[a] அசுத்தங்களாலும் நிறைந்த ஒரு பொற்கிண்ணத்தைத் தன் கையில் வைத்திருந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பாலியல் ஒழுக்கக்கேடு” என்பதற்கு “விபசாரம்” அல்லது “வேசித்தனம்” என்றும் மொழிபெயர்க்கலாம். வெளிப்படுத்தலில் கிரேக்கச் சொல் நேரடியான பொருளையும் உருவகமான பொருளையும் கொண்டிருக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβεβλημένη
  choice: ஆடைகளை அணிந்திருந்தாள்
  rationale: ἦν உடன் வரும் நிறைவுநிலைப் பங்கேற்புச் சொல் அவளுடைய நிலையை விவரிக்கிறது; தமிழில் ‘அணிந்திருந்தாள்’ அதன் விளைவுநிலையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πορφυροῦν καὶ κόκκινον
  choice: ஊதா நிறமும் செந்நிறமுமான ஆடைகள்
  rationale: ஆடம்பரத்தையும் செல்வச் சிறப்பையும் குறிக்கும் இரு வண்ணங்களையும் தெளிவாகத் தக்கவைக்கிறது; ஆடை என்பது περιβεβλημένη என்பதில் உள்ளுறையாக இருப்பதை தமிழில் வெளிப்படுத்துவது இயல்பானது.
- source_word: κεχρυσωμένη
  choice: அலங்கரிக்கப்பட்டிருந்தாள்
  rationale: பொன் முதலியவற்றால் செழுமையாக ஒப்பனை செய்யப்பட்ட விளைவுநிலையைத் தெரிவிக்கிறது; ‘பொன் பூசப்பட்டாள்’ என்ற அளவுக்கு பொருளைச் சுருக்கவில்லை.
- source_word: χρυσίῳ καὶ λίθῳ τιμίῳ καὶ μαργαρίταις
  choice: பொன்னாலும் விலையுயர்ந்த கற்களாலும் முத்துகளாலும்
  rationale: அலங்காரத்திற்கான பொருட்களின் பட்டியலைத் தக்கவைக்கிறது. λίθῳ τιμίῳ ஒருமை வடிவில் இருந்தாலும் வகைப் பொருளில் வருவதால் தமிழில் இயல்பான பொதுப் பன்மை பயன்படுத்தப்பட்டது.
- source_word: ποτήριον χρυσοῦν
  choice: ஒரு பொற்கிண்ணம்
  rationale: கிண்ணத்தின் பொருளையும் வடிவத்தையும் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: γέμον
  choice: நிறைந்த
  rationale: கிண்ணத்தின் உள்ளடக்கத்தை விவரிக்கும் பங்கேற்புச் சொல்லை நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: βδελυγμάτων
  choice: அருவருப்பானவை
  rationale: வழிபாட்டு மற்றும் அறநெறி சார்ந்த கடும் வெறுப்புணர்வை நவீன தமிழில் புரியும்படி வெளிப்படுத்துகிறது.
- source_word: τὰ ἀκάθαρτα
  choice: அசுத்தமானவை
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட நடுநிலைப் பன்மையைப் பிரதிபலித்து, சடங்கு மற்றும் அறநெறி அசுத்தம் ஆகிய இரு சாயல்களையும் திறந்துவைக்கிறது.
- source_word: πορνείας
  choice: பாலியல் ஒழுக்கக்கேடு
  rationale: சொல்லின் பரந்த பாலியல் பொருளைத் தருகிறது; வெளிப்படுத்தலில் உள்ள உருவகமான விசுவாசத் துரோகச் சாயலையும் ஒரே குறுகிய பொருளுக்குள் அடைக்கவில்லை.
theological_decisions:
- issue: வெளிப்படுத்தலின் அடையாள மொழியில் πορνεία என்பதன் நேரடி பாலியல் மற்றும் உருவக ஆன்மீக விசுவாசத் துரோகப் பொருட்கள்
  choice: பாலியல் ஒழுக்கக்கேடு
  alternative: விபசாரம் / வேசித்தனம்
  rationale: ‘பாலியல் ஒழுக்கக்கேடு’ என்பது நேரடி பொருளின் அகலத்தைப் பாதுகாக்கிறது; அதேவேளை உருவகமான விக்கிரகாராதனை அல்லது விசுவாசத் துரோகப் பொருளை மொழிபெயர்ப்பிலேயே ஒருதலைப்பட்சமாகத் தீர்மானிப்பதில்லை. மாற்றுப் பொருட்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் எளிதில் புரியக்கூடிய, கண்ணியமான நடையைப் பயன்படுத்துகிறது. நீண்ட கிரேக்க வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டது; பட்டியல், காட்சி வரிசை, குறியீட்டு இறுக்கம் ஆகியவை பாதுகாக்கப்பட்டுள்ளன. அடிக்குறி [a] உரையில் தெளிவாக இணைக்கப்பட்டுள்ளது.
