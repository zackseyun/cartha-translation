id: REV.17.18
reference: Revelation 17:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἡ γυνὴ ἣν εἶδες ἔστιν ἡ πόλις ἡ μεγάλη ἡ ἔχουσα βασιλείαν ἐπὶ τῶν βασιλέων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/018.yaml
  text: And the woman whom you saw is the great city that has dominion over the kings of the earth[a].
translation:
  language: ta
  text: நீ பார்த்த அந்தப் பெண், பூமியின் அரசர்கள்மேல் ஆட்சி செலுத்துகிற அந்தப் பெரிய நகரமே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பூமியின் அரசர்கள்மேல் ராஜ்யத்தைக் கொண்டிருக்கிற.” கிரேக்கச் சொற்றொடர் சொல்லுக்கு சொல் “ராஜ்யத்தைக் கொண்டிருக்கிற” என்கிறது; இதை அரச ஆளுகை அல்லது அரச அதிகாரத்தைக் கொண்டிருப்பதாகவும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: பெண்
  rationale: இங்கு தரிசனத்தில் காணப்பட்ட அடையாளப் பெண்ணைக் குறிப்பதால், ‘பெண்’ என்பது இயல்பானதும் விளக்கத்தைத் திணிக்காததுமான மொழிபெயர்ப்பு.
- source_word: ἣν εἶδες
  choice: நீ பார்த்த
  rationale: யோவான் முன்பு தரிசனத்தில் கண்ட பெண்ணை நேரடியாக அடையாளப்படுத்தும் தொடர்புச் சொற்றொடரை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: πόλις ἡ μεγάλη
  choice: அந்தப் பெரிய நகரம்
  rationale: πόλις என்பதன் வழக்கமான பொருளான ‘நகரம்’ என்பதையும், கிரேக்கத்தில் மீண்டும் வரும் சுட்டுத் தன்மையையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἔχουσα βασιλείαν
  choice: ஆட்சி செலுத்துகிற
  rationale: சொல்லுக்கு சொல் ‘அரசாட்சியைக் கொண்டிருக்கிற’ என்றாலும், அரசர்கள்மேல் நிகழும் ஆளுகை அல்லது அரச அதிகாரமே இச்சூழலில் வலியுறுத்தப்படுகிறது; ‘ஆட்சி செலுத்துகிற’ என்பது இதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: βασιλεία
  choice: ஆட்சி
  rationale: βασιλεία என்பது ராஜ்யம், அரசாட்சி, ஆளுகை ஆகிய பொருள்களை உடையது. அரசர்கள்மேல் அதிகாரம் என்ற இச்சூழலில் ‘ஆட்சி’ பொருத்தமானது; ‘ராஜ்யம்’ என்ற நேரடி மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐπὶ τῶν βασιλέων
  choice: அரசர்கள்மேல்
  rationale: ἐπί + பிறப்புவேற்றுமை இங்கு மேலாதிக்கம் அல்லது அதிகாரத்தைக் குறிக்கிறது; ‘அரசர்கள்மேல்’ அந்த உறவைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: τῆς γῆς
  choice: பூமியின்
  rationale: வெளிப்படுத்தின விசேஷத்தின் பரந்த அபோகலிப்டிக் சூழலில் γῆ என்பதன் ‘பூமி’ என்ற பொருளைப் பாதுகாத்து, ஒரு குறிப்பிட்ட நாட்டுக்குள் பொருளைக் குறுக்காமல் விடுகிறது.
theological_decisions:
- issue: பெண்ணுக்கும் நகரத்துக்கும் இடையிலான அடையாளப்படுத்தலின் தன்மை
  choice: ‘அந்தப் பெண் ... அந்தப் பெரிய நகரமே’ என்ற நேரடி அடையாளப்படுத்தலைப் பாதுகாத்தல்.
  alternative: ‘அந்தப் பெண் பெரிய நகரத்தைக் குறிக்கிறாள்’ என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: கிரேக்கம் எளிய இணைப்புவினையான ἔστιν (‘ஆகும்/இருக்கிறது’) என்பதையே பயன்படுத்துகிறது. ‘நகரமே’ என்பது அந்த நேரடி அடையாளப்படுத்தலைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது; அடையாளத்தின் பொருளை மொழிபெயர்ப்பிலேயே விளக்கித் தீர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க வேதாகம நடையுடனும் அமைக்கப்பட்டது. ‘நகரமே’ நேரடி அடையாளப்படுத்தலை வலியுறுத்துகிறது; ‘ஆட்சி செலுத்துகிற’ என்பது ἔχουσα βασιλείαν என்பதன் சூழல்சார் பொருளை இயல்பாகத் தருகிறது.
