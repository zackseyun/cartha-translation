revisions:
- from: அவளோடு பூமியின் அரசர்கள் பாலியல் ஒழுக்கக்கேட்டில் ஈடுபட்டார்கள்[a]; பூமியில் குடியிருக்கிறவர்கள் அவளுடைய பாலியல் ஒழுக்கக்கேடு என்னும் திராட்சரசத்தால் போதையடைந்தார்கள்.[b]
  to: அவளோடு பூமியின் அரசர்கள் விபசாரம் செய்தார்கள்[a]; பூமியில் குடியிருப்பவர்கள் அவளுடைய விபசாரத்தின் திராட்சரசத்தால் போதையடைந்தார்கள்.[b]
