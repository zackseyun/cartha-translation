source:
  edition: SBLGNT
  text: μεθ’ ἧς ἐπόρνευσαν οἱ βασιλεῖς τῆς γῆς, καὶ ἐμεθύσθησαν οἱ κατοικοῦντες τὴν γῆν ἐκ τοῦ οἴνου τῆς πορνείας αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/002.yaml
  text: with whom the kings of the earth committed sexual immorality[d][c][b][a], and those who dwell on the earth became drunk from the wine of her sexual immorality.
translation:
  language: ta
  text: அவளோடு பூமியின் அரசர்கள் விபசாரம் செய்தார்கள்[a]; பூமியில் குடியிருப்பவர்கள் அவளுடைய விபசாரத்தின் திராட்சரசத்தால் போதையடைந்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பாலியல் ஒழுக்கக்கேட்டில் ஈடுபட்டார்கள்” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள “விபசாரம்” பாலியல் உருவகத்தின் வலிமையைத் தக்கவைத்தபடியே, சீர்கெட்ட சிலைவழிபாட்டு அல்லது விசுவாசமற்ற கூட்டணியைக் குறியீடாகச் சுட்டக்கூடும்.
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: “அவளுடைய விபசாரத்தின் திராட்சரசத்தைக் குடித்துப் போதையடைந்தார்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεθ’ ἧς
  choice: அவளோடு
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட பெண்ணையே தொடர்புப்படுத்துகிறது. தமிழில் இயல்பாகவும் கிரேக்க உறவைக் தெளிவாகவும் காட்டுகிறது.
- source_word: ἐπόρνευσαν
  choice: பாலியல் ஒழுக்கக்கேட்டில் ஈடுபட்டார்கள்
  rationale: பாலியல் உருவகத்தைத் தக்கவைத்து, வெளிப்படுத்தின விசேஷத்தில் உள்ள சிலைவழிபாட்டு மற்றும் அரசியல் விசுவாசமின்மை சார்ந்த மறைபொருளை முதன்மை உரையிலேயே குறுக்கிவிடாமல் விடுகிறது.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: பூமியின் அரசர்கள்
  rationale: வெளிப்படுத்தின விசேஷத்தில் திரும்பத் திரும்ப வரும் உலகளாவிய சொற்றொடருடன் ஒத்திசைகிறது.
- source_word: ἐμεθύσθησαν
  choice: போதையடைந்தார்கள்
  rationale: செயப்படுவினை வடிவத்தின் விளைவுநிலையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: οἱ κατοικοῦντες τὴν γῆν
  choice: பூமியில் குடியிருக்கிறவர்கள்
  rationale: பெயர்ச்சொல்லாகச் சுருக்காமல், கிரேக்கத்தின் வினைச்சொல் சார்ந்த வெளிப்பாட்டையும் வெளிப்படுத்தின விசேஷத்தின் வழக்குச் சொற்றொடரையும் தக்கவைக்கிறது.
- source_word: ἐκ τοῦ οἴνου
  choice: திராட்சரசத்தால்
  rationale: ἐκ இங்கு மூலத்தையும் காரணத்தையும் குறிக்கிறது; தமிழில் கருவி/காரண வேற்றுமை குடிப்பதால் ஏற்பட்ட போதையை இயல்பாகக் காட்டுகிறது.
- source_word: τῆς πορνείας αὐτῆς
  choice: அவளுடைய பாலியல் ஒழுக்கக்கேடு என்னும்
  rationale: திராட்சரசம் அவளுடைய πορνεία-வுடன் உருவகமாக அடையாளப்படுத்தப்படுவதைத் தெளிவாக்குகிறது; தொடர்புடைய வினையுடன் சொல் ஒற்றுமையையும் காக்கிறது.
theological_decisions:
- issue: πορνεύω/πορνεία என்பதைச் சிலைவழிபாடு அல்லது அரசியல்-மத விசுவாசமின்மை என்று முதன்மை உரையில் வெளிப்படையாக விளக்க வேண்டுமா?
  choice: பாலியல் ஒழுக்கக்கேடு என்ற உருவகத்தை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ஆவிக்குரிய விபசாரம் செய்தார்கள்; சிலைவழிபாட்டு கூட்டணியில் அவளோடு இணைந்தார்கள்
  rationale: இப்பகுதி பாலியல் உருவகத்தின் வழியாக மத, உடன்படிக்கை மற்றும் அரசியல் சீர்கேட்டைச் சுட்டுகிறது. ஒரே விளக்கமாகச் சுருக்காமல் உருவகத்தின் வலிமையையும் இறையியல் பதற்றத்தையும் காக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. பாலியல் உருவகம் மென்மையாக்கப்படாமலும் தேவையின்றி கடுமையாக்கப்படாமலும் வைக்கப்பட்டுள்ளது. வசனத்தின் இரு இணை வாக்கியங்களும் அரைப்புள்ளியால் இணைக்கப்பட்டுள்ளன.
