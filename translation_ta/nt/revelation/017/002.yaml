review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the principal Greek clauses, including the recurring Revelation expressions “kings of the earth” and “those dwelling on the earth.” However, “பாலியல் ஒழுக்கக்கேட்டில் ஈடுபட்டார்கள்” is a relatively abstract modern expression and weakens the deliberately concrete, cognate πορνεύω/πορνεία imagery. Using “விபசாரம்” in both clauses more closely preserves the source’s sexual/prostitution metaphor and its lexical linkage without forcing a particular symbolic interpretation.
  naturalness: The sentence is clear modern Tamil. The revision is more idiomatic and more vivid in this apocalyptic context; “அவளுடைய விபசாரத்தின் திராட்சரசத்தால்” also expresses the Greek genitive relation directly, without the somewhat explanatory “என்னும்.”
  terminology: “விபசாரம் செய்தார்கள்” / “விபசாரத்தின் திராட்சரசம்” consistently renders the cognate πορνεύω/πορνεία terms. The cultural note retains “பாலியல் ஒழுக்கக்கேடு” as a legitimate broader alternative and explains the likely symbolic force without reducing the main text to idolatry or political alliance.
  issues:
  - severity: medium
    issue: The main-text phrase “பாலியல் ஒழுக்கக்கேட்டில் ஈடுபட்டார்கள்” is abstract and does not preserve the cognate sexual/prostitution imagery as directly as the Greek.
    rationale: Revelation intentionally retains a concrete sexual metaphor. “விபசாரம் செய்தார்கள்” is natural Tamil, maintains the metaphorical tension, and links naturally with “விபசாரத்தின் திராட்சரசம்.”
  - severity: low
    issue: “அவளுடைய பாலியல் ஒழுக்கக்கேடு என்னும் திராட்சரசம்” is more explanatory than the Greek construction.
    rationale: “அவளுடைய விபசாரத்தின் திராட்சரசம்” closely represents τῆς πορνείας αὐτῆς while remaining understandable.
  revised_text: அவளோடு பூமியின் அரசர்கள் விபசாரம் செய்தார்கள்[a]; பூமியில் குடியிருப்பவர்கள் அவளுடைய விபசாரத்தின் திராட்சரசத்தால் போதையடைந்தார்கள்.[b]
