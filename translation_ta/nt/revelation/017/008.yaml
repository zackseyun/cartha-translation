source:
  edition: SBLGNT
  text: τὸ θηρίον ὃ εἶδες ἦν καὶ οὐκ ἔστιν, καὶ μέλλει ἀναβαίνειν ἐκ τῆς ἀβύσσου, καὶ εἰς ἀπώλειαν ⸀ὑπάγει· καὶ ⸀θαυμασθήσονται οἱ κατοικοῦντες ἐπὶ τῆς γῆς, ὧν οὐ γέγραπται ⸂τὸ ὄνομα⸃ ἐπὶ τὸ βιβλίον τῆς ζωῆς ἀπὸ καταβολῆς κόσμου, βλεπόντων ⸂τὸ θηρίον ὅτι ἦν⸃ καὶ οὐκ ἔστιν καὶ παρέσται.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/008.yaml
  text: The beast that you saw was[a], and is not, and is about to come up out of the abyss and go to destruction. And those who dwell on the earth, whose name has not been written in the book of life from the foundation of the world, will marvel when they see the beast[c][b], because it was and is not and will be present.
translation:
  language: ta
  text: நீ பார்த்த மிருகம் முன்பு இருந்தது; இப்போது இல்லை. அது ஆழ்குழியிலிருந்து மேலே வரவிருக்கிறது; பின்னர் அழிவுக்குச் செல்லும். உலகம் படைக்கப்பட்டதுமுதல் வாழ்வின் புத்தகத்தில் பெயர் எழுதப்படாத பூமியின் குடியிருப்போர், அந்த மிருகத்தைப் பார்க்கும்போது, ஏனெனில்[a] அது முன்பு இருந்தது, இப்போது இல்லை, இனி இருக்கும்[b] என்பதால் வியப்படைவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஏனெனில்’ என்பதற்குப் பதிலாக, கிரேக்கத்தை ‘அது முன்பு இருந்தது, இப்போது இல்லை, இனி இருக்கும் என்பதைப் பார்த்து’ என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: ‘இனி இருக்கும்’ என்பதை ‘இனி வரும்’ அல்லது ‘இனி தோன்றும்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் எதிர்கால வருகையையோ முன்னிலையில் இருப்பதையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: θηρίον
  choice: மிருகம்
  rationale: வெளிப்படுத்தலில் வரும் அடையாள மற்றும் அச்சமூட்டும் தன்மையை இயல்பான தமிழில் தக்கவைக்கிறது; வெறும் ‘விலங்கு’ என்பதைவிட பொருத்தமானது.
- source_word: ἦν καὶ οὐκ ἔστιν
  choice: முன்பு இருந்தது, இப்போது இல்லை
  rationale: கிரேக்கத்தின் கூர்மையான கால முரண்பாட்டைத் தெளிவான நவீன தமிழில் காக்கிறது.
- source_word: μέλλει ἀναβαίνειν
  choice: மேலே வரவிருக்கிறது
  rationale: μέλλει தரும் எதிர்நோக்கும் அல்லது நெருங்கிவரும் செயல் நுணுக்கத்தையும் ἀναβαίνειν தரும் மேல்நோக்கிய இயக்கத்தையும் தக்கவைக்கிறது.
- source_word: ἄβυσσος
  choice: ஆழ்குழி
  rationale: அளவற்ற ஆழத்தைக் குறிக்கும் வெளிப்படுத்தல் நூலின் சொல்லாட்சியைச் சுருக்கமாகவும் புரிந்துகொள்ளத்தக்க வகையிலும் தருகிறது; ‘அடிப்பகுதியற்ற குழி’ போன்ற விளக்கமிகு மொழியைத் தவிர்க்கிறது.
- source_word: εἰς ἀπώλειαν ὑπάγει
  choice: அழிவுக்குச் செல்லும்
  rationale: இறுதியான அழிவை நோக்கிய இயக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: θαυμασθήσονται
  choice: வியப்படைவார்கள்
  rationale: சாதாரண ஆச்சரியத்தையும் திகைப்பையும் உள்ளடக்கக்கூடிய இயல்பான எதிர்கால வினை; சூழல் தீர்மானிக்காத உணர்ச்சி நுணுக்கத்தை அளவுக்கு மீறி வரையறுக்கவில்லை.
- source_word: οἱ κατοικοῦντες ἐπὶ τῆς γῆς
  choice: பூமியின் குடியிருப்போர்
  rationale: வெளிப்படுத்தலில் திரும்பத் திரும்ப வரும் நிலையான குழுப் பெயரை கண்ணியமான, சுருக்கமான தமிழில் தக்கவைக்கிறது.
- source_word: ὧν οὐ γέγραπται τὸ ὄνομα
  choice: பெயர் எழுதப்படாத
  rationale: கிரேக்கத்தில் உள்ள ஒருமை ‘பெயர்’ என்பதைத் தக்கவைக்கிறது; தமிழில் இது ஒவ்வொருவரையும் குறிக்கும் பகிர்ந்த ஒருமையாக இயல்பாகப் புரிகிறது.
- source_word: ἐπὶ τὸ βιβλίον τῆς ζωῆς
  choice: வாழ்வின் புத்தகத்தில்
  rationale: கிரேக்க முன்னிடைச்சொல் சொற்படியாக ‘மேல்’ என இருந்தாலும், ஒரு பதிவேட்டில் பெயர் எழுதப்படுவதைத் தமிழில் இயல்பாக ‘புத்தகத்தில்’ என்று கூறுகிறோம்.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: உலகம் தோன்றியதுமுதல்
  rationale: உலகத்தின் தொடக்கத்திலிருந்து என்ற காலப்பொருளை இயல்பான தமிழில் தருகிறது; படைப்பின் செயல்முறையைப் பற்றி மூலவாக்கியம் கூறாத கூடுதல் விவரத்தைச் சேர்க்கவில்லை.
- source_word: βλεπόντων
  choice: பார்க்கும்போது
  rationale: வியப்புக்கும் மிருகத்தைப் பார்ப்பதற்கும் இடையிலுள்ள காலத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: παρέσται
  choice: இனி வந்து நிற்கும்
  rationale: πάρειμι என்பதன் வருகை மற்றும் இருப்பு ஆகிய இரு நுணுக்கங்களையும் முடிந்தவரை இணைக்கிறது; வெறும் ‘வரும்’ அல்லது ‘தோன்றும்’ என்று ஒன்றை மட்டும் உறுதிசெய்வதைத் தவிர்க்கிறது.
theological_decisions:
- issue: ‘உலகம் தோன்றியதுமுதல்’ என்ற சொற்றொடரின் தொடர்பு
  choice: அது ‘வாழ்வின் புத்தகத்தில் பெயர் எழுதப்படாத’ என்பதோடு இணைக்கப்பட்டுள்ளது.
  alternative: அருகிலுள்ள வேறு கருத்தோடு இணைத்துப் புரிந்துகொள்ளுதல்.
  rationale: இவ்வசனத்தின் கிரேக்கச் சொல் வரிசையும் இலக்கண ஓட்டமும் அந்தக் காலச் சொற்றொடரை பெயர் எழுதப்படாததோடு மிக இயல்பாக இணைக்கின்றன. இதற்கு அப்பால் எந்த முன்நியமனம் சார்ந்த கோட்பாட்டையும் மொழிபெயர்ப்பு சேர்க்கவில்லை.
- issue: ὅτι என்பதன் காரண அல்லது உள்ளடக்கப் பொருள்
  choice: முதன்மை உரையில் காரணப் பொருளாக ‘ஏனெனில்’ பயன்படுத்தப்பட்டுள்ளது.
  alternative: ‘அது முன்பு இருந்தது... என்பதைப் பார்த்து’ என்ற உள்ளடக்கப் பொருள்.
  rationale: வியப்புக்கான காரணத்தைச் சொல்வதாக வாசிப்பது சூழலில் இயல்பானது; எனினும் கிரேக்கம் உள்ளடக்கப் பொருளையும் அனுமதிப்பதால் அது அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- issue: παρέσται என்பதன் நுணுக்கம்
  choice: ‘இனி வந்து நிற்கும்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: ‘இனி வரும்’, ‘இனி தோன்றும்’, அல்லது ‘இனி இருக்கும்’.
  rationale: எதிர்கால πάρειμι வருகை அல்லது முன்னிலை ஆகியவற்றைக் குறிக்கலாம். தேர்ந்த வடிவம் இரு நுணுக்கங்களையும் பாதுகாக்கிறது; வெளிப்படையாகக் கூறப்படாத உயிர்த்தெழுதல் கருத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. வெளிப்படுத்தல் நூலுக்குரிய மறையுருவகத் தீவிரம் காக்கப்பட்டுள்ளது. நீண்ட கிரேக்க வாக்கியம் தமிழில் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டது; கருத்துத் தொடர்புகள் மாற்றப்படவில்லை.
