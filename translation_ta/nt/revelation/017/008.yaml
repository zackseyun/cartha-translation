revisions:
- from: நீ பார்த்த மிருகம் முன்பு இருந்தது, இப்போது இல்லை. அது ஆழ்குழியிலிருந்து மேலே வரவிருக்கிறது; பின்னர் அழிவுக்குச் செல்லும். உலகம் தோன்றியதுமுதல் வாழ்வின் புத்தகத்தில் பெயர் எழுதப்படாத பூமியின் குடியிருப்போர், அந்த மிருகத்தைப் பார்க்கும்போது வியப்படைவார்கள். ஏனெனில், அது முன்பு இருந்தது, இப்போது இல்லை, இனி வந்து நிற்கும்[a][b].
  to: நீ பார்த்த மிருகம் முன்பு இருந்தது; இப்போது இல்லை. அது ஆழ்குழியிலிருந்து மேலே வரவிருக்கிறது; பின்னர் அழிவுக்குச் செல்லும். உலகம் படைக்கப்பட்டதுமுதல் வாழ்வின் புத்தகத்தில் பெயர் எழுதப்படாத பூமியின் குடியிருப்போர், அந்த மிருகத்தைப் பார்க்கும்போது, ஏனெனில்[a] அது முன்பு இருந்தது, இப்போது இல்லை, இனி இருக்கும்[b] என்பதால் வியப்படைவார்கள்.
  rationale: The revision maintains the source's causal reading while making the sentence idiomatic in Tamil. It renders παρέσται with a non-overinterpreting future-presence expression, preserves the permitted content-reading ambiguity in a correctly located footnote, and uses a more direct modern Tamil expression for ‘from the foundation of the world.’
