revisions:
- from: ஐந்து பேர் வீழ்ந்துவிட்டார்கள்[a]; ஒருவர் இப்போது இருக்கிறார்; மற்றவர் இன்னும் வரவில்லை. அவர் வரும்போது, சிறிது காலம் நிலைத்திருக்க வேண்டியது அவசியம்.
  to: ஐவர் வீழ்ந்துவிட்டனர்[a]; ஒருவர் இருக்கிறார்; மற்றவர் இன்னும் வரவில்லை. அவர் வரும்போது, அவர் சிறிது காலம் நீடித்திருக்க வேண்டும்.
  rationale: The revision keeps the source’s deliberately compressed succession formula and does not identify the kings. It replaces the less formal ‘ஐந்து பேர்’ with ‘ஐவர்’ and, most importantly, makes the coming individual the explicit subject of the necessity clause, preserving αὐτόν δεῖ μεῖναι. ‘நீடித்திருக்க வேண்டும்’ expresses required continuance for a short duration without specifying the nature of that continuance as reign or rule.
