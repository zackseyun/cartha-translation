  text: οἱ πέντε ἔπεσαν, ὁ εἷς ἔστιν, ὁ ἄλλος οὔπω ἦλθεν, καὶ ὅταν ἔλθῃ ὀλίγον ⸂αὐτὸν δεῖ⸃ μεῖναι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/010.yaml
  text: Five have fallen[a], one is, the other has not yet come; and when he comes, he must remain for a little while.
translation:
  language: ta
  text: ஐவர் வீழ்ந்துவிட்டனர்[a]; ஒருவர் இருக்கிறார்; மற்றவர் இன்னும் வரவில்லை. அவர் வரும்போது, அவர் சிறிது காலம் நீடித்திருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சூழலை இன்னும் வெளிப்படையாகக் கூறினால்: “ஐந்து அரசர்கள் வீழ்ந்துவிட்டார்கள்; ஓர் அரசர் இருக்கிறார்; மற்ற அரசர் இன்னும் வரவில்லை.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πέντε
  choice: ஐந்து பேர்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட ஏழு அரசர்களில் ஐவரைக் குறிக்கிறது. தமிழில் மனிதர்களைக் குறிக்கும் ‘பேர்’ இயல்பாக உள்ளது; பிரதான உரையில் ‘அரசர்கள்’ என்று வெளிப்படையாகச் சேர்க்காமல் மூலத்தின் சுருக்கத்தையும் காக்கிறது.
- source_word: ἔπεσαν
  choice: வீழ்ந்துவிட்டார்கள்
  rationale: πίπτω என்பதன் ‘வீழ்தல்’ உருவகத்தைத் தக்கவைத்து, நிகழ்ந்து முடிந்த வீழ்ச்சியின் தற்போதைய விளைவை இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: ὁ εἷς ἔστιν
  choice: ஒருவர் இப்போது இருக்கிறார்
  rationale: மூலத்தின் சுருக்கமான ‘ஒருவர் இருக்கிறார்’ என்ற கூற்றைத் தக்கவைக்கிறது. காலத் தொடரைத் தெளிவாக்க ‘இப்போது’ சேர்க்கப்பட்டுள்ளது; ‘ஆட்சி செய்கிறார்’ என்று விளக்கி மொழிபெயர்க்கப்படவில்லை.
- source_word: ὁ ἄλλος
  choice: மற்றவர்
  rationale: முன்னர் கூறப்பட்ட ஐவருக்கும் தற்போது இருப்பவருக்கும் அடுத்ததாக வரும் ஒருவரை இயல்பாகக் குறிக்கிறது.
- source_word: οὔπω ἦλθεν
  choice: இன்னும் வரவில்லை
  rationale: எதிர்பார்க்கப்படும் வருகை இதுவரை நிகழவில்லை என்ற பொருளை நவீன தமிழில் நேரடியாகத் தருகிறது.
- source_word: ὅταν ἔλθῃ
  choice: அவர் வரும்போது
  rationale: எதிர்காலத்தில் நிகழவிருக்கும் வருகையை இயல்பாகக் காட்டுகிறது; ஆண்பால் ஒருமை அரசனைக் குறிக்கும் சூழலுடன் பொருந்துகிறது.
- source_word: ὀλίγον
  choice: சிறிது காலம்
  rationale: μεῖναι என்பதுடன் கால அளவைக் குறிக்கும் வினையடைப் பொருளில் வருகிறது; குறுகிய காலத்தைக் காட்டுகிறது, ஆனால் ‘மட்டுமே’ என்ற கூடுதல் வலியுறுத்தலைச் சேர்க்கவில்லை.
- source_word: αὐτὸν δεῖ μεῖναι
  choice: நிலைத்திருக்க வேண்டியது அவசியம்
  rationale: δεῖ என்பதிலுள்ள அவசியத்தையும் μεῖναι என்பதிலுள்ள தொடர்ந்திருத்தலையும் வெளிப்படையாகக் காக்கிறது; ‘தங்கியிருக்க வேண்டும்’ என்பதைக் காட்டிலும் அரசர்/ஆட்சித் தொடரின் சூழலில் ‘நிலைத்திருக்க’ பொருத்தமானது.
theological_decisions:
- issue: ஏழு அரசர்கள் என்ற உருவகத்தின் வரலாற்று அடையாளம்
  choice: அரசர்களை குறிப்பிட்ட பேரரசர்களாக அடையாளப்படுத்தாமல், வசனத்தின் சுருக்கமான தொடரைத் தக்கவைத்தல்
  alternative: பிரதான உரையிலேயே ‘ஐந்து அரசர்கள் வீழ்ந்தார்கள்; ஓர் அரசர் இருக்கிறார்...’ என்று விரிவுபடுத்துதல் அல்லது குறிப்பிட்ட ரோமப் பேரரசர்களுடன் இணைத்தல்
  rationale: உடனடி சூழல் இவர்கள் அரசர்கள் என்பதைத் தெளிவுபடுத்தினாலும், இவ்வசனத்தின் சுருக்கத்தையும் விவாதத்திற்குரிய வரலாற்று அடையாளங்களையும் மொழிபெயர்ப்பு தீர்மானித்துவிடக் கூடாது.
- issue: δεῖ குறிக்கும் அவசியம்
  choice: ‘வேண்டியது அவசியம்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  alternative: ‘சிறிது காலம் நிலைத்திருப்பார்’ என்று அவசியத்தின் கூறை மறைத்தல்
  rationale: மூலத்தில் உள்ள தெய்வீக அல்லது நிகழ்வியல் அவசியத்தைத் தக்கவைக்கிறது; அந்த அவசியத்தின் தன்மையை மேலதிகமாக விளக்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ். வெளிப்படுத்தின விசேஷத்தின் அபோகலிப்டிக் சுருக்கம் காக்கப்பட்டுள்ளது. மனித அரசர்களைக் குறிக்கும் மரியாதை ஒருமை/பன்மை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; பிரதான உரையில் வரலாற்று அடையாளங்கள் சேர்க்கப்படவில்லை.
