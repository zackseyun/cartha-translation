id: REV.17.11
reference: Revelation 17:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ τὸ θηρίον ὃ ἦν καὶ οὐκ ἔστιν. καὶ ⸀αὐτὸς ὄγδοός ἐστιν καὶ ἐκ τῶν ἑπτά ἐστιν, καὶ εἰς ἀπώλειαν ὑπάγει.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/011.yaml
  text: And the beast that was and is not is itself an eighth and is from the seven[b][a], and it goes to destruction.
translation:
  language: ta
  text: இருந்ததும் இப்போது இல்லாததுமான அந்த மிருகம், அதுவே எட்டாவதாக இருக்கிறது[a]; அது அந்த ஏழிலிருந்து வந்தது[b]; மேலும் அது அழிவை நோக்கிச் செல்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதுவே எட்டாவது அரசனாக இருக்கிறது.’ சூழலில் ‘அரசன்’ என்பது மறைமுகமாக உணரப்படுகிறது; ஆனால் கிரேக்கத்தில் அந்தப் பெயர்ச்சொல் இங்கே கூறப்படவில்லை.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘அது அந்த ஏழில் ஒன்று.’ கிரேக்கம் இன்னும் நேரடியாக ‘அந்த ஏழிலிருந்து’ என்கிறது; இது தோற்றம், உறுப்பினர் நிலை, அல்லது நெருங்கிய தொடர்பைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: θηρίον
  choice: மிருகம்
  rationale: வெளிப்படுத்தின விசேஷத்தில் கடவுளுக்கு எதிரான அரக்கத்தனமான அரசியல்-ஆவிக்குரிய வல்லமையைக் குறிக்கும் நிலைபெற்ற மறையுருவகச் சொல்லாக இருப்பதால், ‘மிருகம்’ அதன் குறியீட்டு வலிமையைத் தக்கவைக்கிறது.
- source_word: ὃ ἦν καὶ οὐκ ἔστιν
  choice: இருந்ததும் இப்போது இல்லாததுமான
  rationale: கிரேக்கத்தின் கூர்மையான ‘இருந்தது—இல்லை’ என்ற முரண்பாட்டையும், அதிகாரத்தில் மீண்டும் வரும் சொற்றொடரின் ஒலியையும் காக்கிறது. இயல்பான தமிழுக்காக ‘இப்போது’ சேர்க்கப்பட்டாலும், ‘இனி இல்லை’ என்று காலப்பொருளை மிகுதியாகத் தீர்மானிக்கவில்லை.
- source_word: αὐτὸς
  choice: அதுவே
  rationale: மிருகத்தையே வலியுறுத்தும் αὐτός என்பதன் அழுத்தத்தை இயல்பான தமிழில் காட்டுகிறது; ஆண்பால் நபராக அதைத் தேவையின்றி சித்தரிக்கவில்லை.
- source_word: ὄγδοός
  choice: எட்டாவதாக
  rationale: கிரேக்கத்தில் பெயர்ச்சொல் வெளிப்படையாக இல்லை. ‘அரசன்’ என்பதை முதன்மை உரையில் சேர்க்காமல், சூழலால் நிரப்பப்படக்கூடிய வகையை மறைமுகமாகவே வைக்கிறது.
- source_word: ἐκ τῶν ἑπτά
  choice: அந்த ஏழிலிருந்து வந்தது
  rationale: ἐκ என்பதின் ‘இலிருந்து’ என்ற அடிப்படைப் பொருளைத் தக்கவைத்து, இயல்பான தமிழுக்காக ‘வந்தது’ பயன்படுத்தப்படுகிறது. இது ‘அந்த ஏழில் ஒன்று’ என்று உறவை முற்றிலும் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: εἰς ἀπώλειαν
  choice: அழிவை நோக்கி
  rationale: இறுதித் தீர்ப்புக்குரிய அழிவு அல்லது கேட்டைத் தெளிவான, தற்போதைய தமிழில் தீவிரத்துடன் வெளிப்படுத்துகிறது.
- source_word: ὑπάγει
  choice: செல்கிறது
  rationale: கிரேக்க நிகழ்காலத்தின் உயிரோட்டத்தை எளிய, இயல்பான தமிழ் நிகழ்காலத்தில் காக்கிறது.
theological_decisions:
- issue: ὄγδοός என்பதோடு மறைந்துள்ள பெயர்ச்சொல்லாக ‘அரசன்’ என்பதைச் சேர்க்க வேண்டுமா?
  choice: முதன்மை உரையில் ‘எட்டாவதாக’ என்று மட்டும் வைத்து, ‘அரசன்’ என்பதைச் சேர்க்கவில்லை.
  alternative: எட்டாவது அரசனாக
  rationale: உடனடிச் சூழல் அரசர்களைப் பற்றிப் பேசுவதால் ‘எட்டாவது அரசன்’ என்பது சாத்தியம். ஆனால் இவ்வசனத்தின் கிரேக்கத்தில் βασιλεύς இல்லை; ஆகவே அதன் சுருக்கத்தையும் குறியீட்டு தெளிவின்மையையும் முதன்மை உரை காக்கிறது.
- issue: ἐκ τῶν ἑπτά என்பதை ‘அந்த ஏழில் ஒன்று’ என்று குறிப்பாக்க வேண்டுமா?
  choice: ‘அந்த ஏழிலிருந்து வந்தது’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: அந்த ஏழில் ஒன்று
  rationale: இச்சொற்றொடர் அந்த ஏழோடு தோற்றம், உறுப்பினர் நிலை, அல்லது நெருங்கிய தொடர்பைக் குறிக்கலாம். ‘அந்த ஏழில் ஒன்று’ என்பது சாத்தியமான விளக்கம் என்றாலும், அதையே கட்டாயப்படுத்தாமல் மூலத்தின் இறையியல் மற்றும் குறியீட்டு இழுபறி காக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத்தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அதுவே’ வலியுறுத்தலைக் காக்கிறது; ‘எட்டாவதாக’ என்பதில் கிரேக்கத்தில் விடப்பட்டுள்ள பெயர்ச்சொல் தமிழிலும் நிரப்பப்படவில்லை. அரிதான அல்லது சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
