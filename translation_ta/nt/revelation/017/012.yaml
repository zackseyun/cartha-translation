id: REV.17.12
reference: Revelation 17:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ τὰ δέκα κέρατα ἃ εἶδες δέκα βασιλεῖς εἰσιν, οἵτινες βασιλείαν οὔπω ἔλαβον, ἀλλὰ ἐξουσίαν ὡς βασιλεῖς μίαν ὥραν λαμβάνουσιν μετὰ τοῦ θηρίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/012.yaml
  text: And the ten horns that you saw are ten kings[a], who have not yet received a kingdom, but they receive authority as kings for one hour with the beast.
translation:
  language: ta
  text: நீ கண்ட பத்துக் கொம்புகள் பத்து அரசர்கள் ஆவர். அவர்கள் இன்னும் ஓர் அரசாட்சியைப் பெறவில்லை; ஆனால் மிருகத்தோடு சேர்ந்து அரசர்களாக ஒரு மணிநேரத்திற்கு[a] அதிகாரம் பெறுகிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சிறிது காலத்திற்கு.” வெளிப்படுத்தல் நூலின் படிம மொழியில் “ஒரு மணிநேரம்” என்பது குறுகிய, வரையறுக்கப்பட்ட ஒரு காலப்பகுதியைக் குறிக்கலாம்.
    reason: μίαν ὥραν என்ற சொற்றொடரின் நேரடிப் பொருளையும், அதன் சாத்தியமான உருவகப் பொருளையும் பாதுகாக்கும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: κέρατα
  choice: கொம்புகள்
  rationale: வெளிப்படுத்தின விசேஷத்தின் தரிசனப் படிமத்தை அப்படியே காக்க நேரடியாக மொழிபெயர்க்கப்பட்டது; அதன் குறியீட்டுப் பொருளை அடுத்து வரும் ‘பத்து அரசர்கள்’ என்ற அடையாளப்படுத்தல் விளக்குகிறது.
- source_word: βασιλεῖς
  choice: அரசர்கள்
  rationale: கிரேக்கச் சொல்லின் இயல்பான பொருளைத் தருகிறது. இவர்கள் குறியீட்டு அரசியல் ஆட்சியாளர்களாக இருக்கக்கூடிய வாய்ப்பை முதன்மை உரை தனியாகத் தீர்மானிக்கவில்லை.
- source_word: βασιλείαν
  choice: ஓர் அரசாட்சி
  rationale: இன்னும் பெறப்படாத ஆட்சிநிலை அல்லது ஆளுகையைக் குறிக்கிறது; பின்னர் வரும் ‘அதிகாரம்’ என்பதிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: οὔπω ἔλαβον
  choice: இன்னும் … பெறவில்லை
  rationale: தரிசனத்தின் காலநிலையிலிருந்து பார்க்கையில், அவர்கள் இதுவரை அரசாட்சியைப் பெறாதிருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐξουσίαν
  choice: அதிகாரம்
  rationale: வழங்கப்படும் ஆளும் அதிகாரத்தைத் தெளிவாகக் குறிக்கிறது; ‘அரசாட்சி’ என்ற முந்தைய சொல்லுடன் பொருளைக் கலக்கவில்லை.
- source_word: ὡς βασιλεῖς
  choice: அரசர்களாக
  rationale: அவர்கள் அதிகாரம் பெறும் நிலை அல்லது தகுதியை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: μίαν ὥραν
  choice: ஒரு மணிநேரத்திற்கு
  rationale: வெளிப்படுத்தல் நூலின் காலப் படிமத்தை முதன்மை உரையில் காக்கிறது; அது குறுகிய, வரையறுக்கப்பட்ட காலத்தைக் குறிக்கக்கூடும் என்பது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: λαμβάνουσιν
  choice: பெறுகிறார்கள்
  rationale: கிரேக்க நிகழ்காலத்தை வெளிப்படுத்தல் நூலின் உயிரோட்டமான தரிசன நடைக்கு ஏற்ற நிகழ்காலமாகவே தருகிறது.
- source_word: μετὰ τοῦ θηρίου
  choice: மிருகத்தோடு சேர்ந்து
  rationale: மிருகத்துடன் உள்ள கூட்டுறவு அல்லது இணைந்த செயல்பாட்டை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: θηρίου
  choice: மிருகம்
  rationale: வெளிப்படுத்தல் நூல் முழுவதிலும் தொடரும் குறியீட்டுப் படிமத்தைச் சுருக்கமோ விளக்கவுரையோ இன்றி காக்கிறது.
theological_decisions:
- issue: பத்து அரசர்கள் என்பது சொல்லாட்சிப்படியான மன்னர்களையா அல்லது குறியீட்டு ஆட்சியாளர்கள்/அதிகாரங்களையா குறிக்கிறது?
  choice: முதன்மை உரையில் ‘பத்து அரசர்கள்’ என்று கிரேக்கச் சொல்லின் நேரடிப் பொருள் காக்கப்பட்டது.
  alternative: பத்து குறியீட்டு ஆட்சியாளர்கள், அரசாட்சிகள் அல்லது அரசியல் வல்லமைகள்
  rationale: கிரேக்க உரை வெளிப்படையாக ‘பத்து அரசர்கள்’ என்று கூறுகிறது; அதேவேளை சூழல் குறியீட்டு வெளிப்படுத்தல் படிமமாக உள்ளது. மொழிபெயர்ப்பு இந்தப் பதற்றத்தை விளக்கவுரையால் தீர்த்துவிடாமல் காக்கிறது.
- issue: μίαν ὥραν என்பது சொல்லாட்சிப்படி ஒரு மணிநேரமா அல்லது குறுகிய காலத்தைக் குறிக்கும் படிமமா?
  choice: முதன்மை உரையில் ‘ஒரு மணிநேரத்திற்கு’ என்று வைத்து, அதன் உருவகப் பொருள் அடிக்குறிப்பில் தரப்பட்டது.
  alternative: சிறிது காலத்திற்கு; குறுகிய நேரத்திற்கு
  rationale: கிரேக்கச் சொற்றொடர் நேரடியாக ‘ஒரு மணிநேரம்’ என்கிறது; வெளிப்படுத்தல் படிமத்தில் அது குறுகிய காலத்தைக் குறிக்க வாய்ப்புள்ளது. இரு நிலைகளையும் மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரமான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கொம்புகள்,’ ‘அரசர்கள்,’ ‘மிருகம்’ ஆகிய வெளிப்படுத்தல் படிமங்கள் விளக்கிப் பரப்பப்படாமல் காக்கப்பட்டுள்ளன; ‘அரசாட்சி’ மற்றும் ‘அதிகாரம்’ என்ற இரு வேறு கருத்துகளும் தெளிவாக வேறுபடுத்தப்பட்டுள்ளன.
