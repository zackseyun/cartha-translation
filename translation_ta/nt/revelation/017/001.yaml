  source_fidelity: 'The core renderings accurately represent the Greek: one of the seven bowl-bearing angels comes, speaks with John, summons him, and promises to show the judgment of the great prostitute seated on many waters. However, the current text contains an intrusive negated quotation and repeats the speech, neither of which is present in the source.'
  naturalness: Apart from the corruption in the direct speech, the intended Tamil is modern and readable. The revised wording removes the interruption and places the lexical-alternative footnote marker directly on ‘விலைமகள்.’
  terminology: ‘கிண்ணங்கள்,’ ‘தூதர்கள்,’ ‘தீர்ப்பு,’ and ‘பெரும் விலைமகள்’ are suitable. ‘தீர்ப்பு’ appropriately preserves the breadth of κρίμα, and ‘விலைமகள்’ retains the polemical metaphor without using an unnecessarily coarse term.
