    rationale: This material is not in the Greek text and reverses the angel’s speech with ‘did not say.’ It substantially corrupts the verse and appears to have incorporated footnote content into the biblical text.
  - severity: medium
    issue: Footnote marker b is attached after the final sentence rather than to the term it explains.
    rationale: The marker should immediately follow ‘விலைமகள்,’ so readers can identify its lexical scope.
