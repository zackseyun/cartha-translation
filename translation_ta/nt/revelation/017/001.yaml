source:
  edition: SBLGNT
  text: Καὶ ἦλθεν εἷς ἐκ τῶν ἑπτὰ ἀγγέλων τῶν ἐχόντων τὰς ἑπτὰ φιάλας, καὶ ἐλάλησεν μετ’ ἐμοῦ λέγων· Δεῦρο, δείξω σοι τὸ κρίμα τῆς πόρνης τῆς μεγάλης τῆς καθημένης ἐπὶ ⸀ὑδάτων πολλῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/001.yaml
  text: Then one of the seven angels who had the seven bowls came and spoke with me[a], saying, “Come[b], I will show you the judgment of the great prostitute who sits on many waters,”
translation:
  language: ta
  text: பின்பு, ஏழு கிண்ணங்களை வைத்திருந்த ஏழு தூதர்களில் ஒருவன் வந்து என்னோடு பேசினான்; அவன், “இங்கே வா; பல நீர்ப்பரப்புகளின்மேல் அமர்ந்திருக்கும் பெரும் விலைமகளின்[b] தீர்ப்பை[a] உனக்குக் காட்டுவேன்” என்று கூறினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தீர்ப்பு’ என்பதைக் ‘கண்டனம்’ அல்லது ‘தண்டனை’ என்றும் பொருள்கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘விலைமகள்’ என்பதற்கு நேரடியான மற்றொரு மொழிபெயர்ப்பு ‘வேசி’.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: பின்பு
  rationale: கதையின் அடுத்த நிகழ்வை இயல்பான நவீன தமிழில் காட்டுகிறது; கிரேக்க இணைப்புச் சொல்லின் தொடர்ச்சி வலிமையையும் காக்கிறது.
- source_word: εἷς ἐκ τῶν ἑπτὰ ἀγγέλων τῶν ἐχόντων τὰς ἑπτὰ φιάλας
  choice: ஏழு கிண்ணங்களை வைத்திருந்த ஏழு தூதர்களில் ஒருவன்
  rationale: பகுதிப்பொருள் அமைப்பையும் எந்தத் தூதர்கள் குறிப்பிடப்படுகிறார்கள் என்பதையும் தெளிவாகக் காக்கிறது; φιάλας என்பதற்கு வெளிப்படுத்தலில் இயல்பான ‘கிண்ணங்கள்’ பயன்படுத்தப்பட்டது.
- source_word: ἐλάλησεν μετ’ ἐμοῦ λέγων
  choice: என்னோடு பேசினான் … என்று கூறினான்
  rationale: μετά உடன் வரும் ‘என்னோடு’ என்ற உறவையும், தொடர்ந்து வரும் நேரடிக் கூற்றையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Δεῦρο
  choice: இங்கே வா
  rationale: அருகே வரும்படி அழைக்கும் கட்டளையின் வலிமையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: δείξω σοι
  choice: உனக்குக் காட்டுவேன்
  rationale: எதிர்கால வினை வடிவை நேரடியாகப் பாதுகாக்கிறது.
- source_word: τὸ κρίμα
  choice: தீர்ப்பு
  rationale: நீதித்தீர்ப்பு, கண்டனம், அதனால் வரும் தண்டனை ஆகிய சாத்தியங்களை முன்கூட்டியே குறுக்காமல் உள்ளடக்கும் பரந்த சொல்.
- source_word: τῆς πόρνης τῆς μεγάλης
  choice: அந்தப் பெரும் விலைமகள்
  rationale: πόρνη என்பதன் பாலியல் மற்றும் தீர்க்கதரிசன உருவக வலிமையை நவீன, கண்ணியமான தமிழில் காக்கிறது; ‘பெரும்’ என்பது அவளது முக்கியத்துவத்தையும் அளவையும் திறந்த நிலையில் வைக்கிறது.
- source_word: τῆς καθημένης ἐπὶ ὑδάτων πολλῶν
  choice: திரளான நீர்ப்பரப்புகளின்மேல் அமர்ந்திருக்கும்
  rationale: ἐπί என்பதன் ‘மேல்’ என்ற காட்சியையும் பன்மையான நீர்களையும் காக்கிறது; பின்னர் வரும் குறியீட்டு விளக்கத்தை இங்கே முன்கூட்டியே பொருளுரைக்கவில்லை.
theological_decisions:
- issue: πόρνη என்ற பாபிலோனைச் சுட்டும் உருவகப் பெயர்
  choice: பெரும் விலைமகள்
  alternative: பெரும் வேசி
  rationale: பாலியல் ஒழுக்கக்கேடு, அரசியல்-சமய ஊழல் மற்றும் உண்மையின்மை ஆகிய தீர்க்கதரிசன உருவகத் தாக்கத்தைப் பாதுகாக்கிறது; பாபிலோனின் அடையாளத்தை எந்த ஒரு குறிப்பிட்ட சமய விளக்கத்திற்கும் கட்டுப்படுத்தவில்லை.
- issue: வெளிப்படுத்தல் சூழலில் κρίμα என்பதன் பொருள்
  choice: தீர்ப்பு
  alternative: கண்டனம் அல்லது தண்டனை
  rationale: நீதிமன்றத் தீர்ப்பையும் அதன் தண்டனை விளைவையும் உள்ளடக்கக்கூடிய கிரேக்கச் சொல்லின் பரப்பைத் திறந்த நிலையில் வைக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், வெளிப்படுத்தல் நூலின் கண்ணியமான தீர்க்கதரிசன நடையைத் தக்கவைத்தும் வடிவமைக்கப்பட்டது. குறியீட்டு ‘நீர்கள்’ பின்னர் விளக்கப்படுவதால் இங்கே அதன் உருவகம் வெளிப்படையாகத் தீர்க்கப்படவில்லை.
