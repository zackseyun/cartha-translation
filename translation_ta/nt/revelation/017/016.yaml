id: REV.17.16
reference: Revelation 17:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ τὰ δέκα κέρατα ἃ εἶδες καὶ τὸ θηρίον, οὗτοι μισήσουσι τὴν πόρνην, καὶ ἠρημωμένην ποιήσουσιν αὐτὴν καὶ ⸀γυμνήν, καὶ τὰς σάρκας αὐτῆς φάγονται, καὶ αὐτὴν κατακαύσουσιν ἐν πυρί·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/016.yaml
  text: And the ten horns that you saw[a], and the beast—these will hate the prostitute, and they will make her desolate and naked, and they will eat her flesh[b], and they will burn her up with fire.
translation:
  language: ta
  text: நீ பார்த்த பத்துக் கொம்புகளும் அந்த மிருகமும்—அவைகளே அந்த விலைமகளை வெறுப்பார்கள். அவளைப் பாழாக்கி நிர்வாணமாக்குவார்கள்[a]; அவளுடைய சதையைத் தின்பார்கள்[b]; அவளை நெருப்பினால் முற்றிலும் எரித்துவிடுவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆடைகளைக் களைந்து நிர்வாணமாக்குவார்கள்” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் நேரடியாக “நிர்வாணமான” என்று கூறுகிறது; பொதுமக்கள் முன் அவமானப்படுத்தி வெளிப்படுத்தும் கருத்தும் இதில் அடங்கியுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: இங்கு “சதை” என்பது நேரடியான சொல். வெளிப்படுத்தல் நூலின் அபோகலிப்டிக் உருவகத்தில், இந்தச் சொற்றொடர் முழுமையான வன்முறை அழிவைச் சித்தரிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: κέρατα
  choice: கொம்புகள்
  rationale: விளக்கத்தைப் பதிலாகச் சேர்க்காமல், வெளிப்படுத்தின விசேஷத்தின் அடையாள உருவகத்தை நேரடியாகப் பேணுகிறது.
- source_word: θηρίον
  choice: மிருகம்
  rationale: அபோகலிப்டிக் அடையாளத்தின் அச்சமூட்டும் தன்மையை இயல்பான தமிழில் பேணுகிறது.
- source_word: πόρνην
  choice: விலைமகள்
  rationale: பழமையான அல்லது தேவையற்ற இழிவுத்தன்மை கொண்ட சொற்களைத் தவிர்த்து, பெண் பாலியல் விற்பனையாளரைக் குறிக்கும் தெளிவான நவீனத் தமிழ் சொல்.
- source_word: μισήσουσι
  choice: வெறுப்பார்கள்
  rationale: எதிர்கால வினை வடிவத்தையும் μισέω என்பதன் நேரடிப் பொருளையும் தருகிறது.
- source_word: ἠρημωμένην ποιήσουσιν
  choice: பாழாக்குவார்கள்
  rationale: அவளைப் பாழடைந்த நிலைக்கு ஆக்குவார்கள் என்ற விளைவுசார் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: γυμνήν
  choice: நிர்வாணமாக்குவார்கள்
  rationale: γυμνός என்பதன் நேரடிப் பொருளான நிர்வாண நிலையைப் பேணுகிறது; பொதுமக்கள் முன் அவமானப்படுத்தும் உட்பொருள் அடிக்குறிப்பில் கூறப்படுகிறது.
- source_word: σάρκας
  choice: சதை
  rationale: வன்முறையான அபோகலிப்டிக் காட்சியை மென்மைப்படுத்தாமல், σάρξ என்பதன் உடல்சார் நேரடிப் பொருளைப் பேணுகிறது.
- source_word: φάγονται
  choice: தின்பார்கள்
  rationale: ἐσθίω என்பதன் நேரடிப் பொருளைத் தருவதோடு, இச்சூழலின் கொடூரத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: κατακαύσουσιν ἐν πυρί
  choice: நெருப்பினால் முற்றிலும் எரித்துவிடுவார்கள்
  rationale: κατακαίω என்பதிலுள்ள முழுமையாக எரிக்கும் வலிமையையும் ἐν πυρί என்பதையும் தெளிவாகத் தெரிவிக்கிறது.
- source_word: οὗτοι
  choice: இவர்களே
  rationale: முன்னர் கூறப்பட்ட பத்துக் கொம்புகளையும் மிருகத்தையும் வலியுறுத்தி மீண்டும் சுட்டும் பன்மைச் சுட்டுப்பெயரைப் பேணுகிறது.
theological_decisions:
- issue: “பத்துக் கொம்புகளும் மிருகமும்” என்பவற்றைத் தொடர்ந்து வரும் பன்மைச் சுட்டுப்பெயரும் வினைகளும்
  choice: கூட்டுப் பொருளை “இவர்களே” என்ற வலியுறுத்தப்பட்ட பன்மைச் சுட்டுப்பெயரால் மீண்டும் குறிப்பது
  alternative: மீள்சுட்டலை நீக்கி, “பத்துக் கொம்புகளும் மிருகமும் ... வெறுப்பார்கள்” என்று வழுவழுப்பாக்குவது
  rationale: கிரேக்கத்தில் οὗτοι என்ற வலியுறுத்தப்பட்ட பன்மை மீள்சுட்டல் உள்ளது. வாசிக்கத்தக்க தமிழில் இதைப் பேணுவது, விலைமகளுக்கு எதிராக ஒன்றிணைந்து செயல்படும் முகவர்களைத் தெளிவாக்குகிறது.
- issue: விலைமகளின் அழிவை விவரிக்கும் உருவகத்தின் தன்மை
  choice: மூலத்திலுள்ள அபோகலிப்டிக் உருவகத்தை மென்மைப்படுத்தாமலும் அதன் அடையாளத்தை மொழிபெயர்ப்பிலேயே தீர்மானிக்காமலும் பேணுவது
  alternative: விலைமகளை நேரடியாக ஒரு நகரம் அல்லது அமைப்பு என்று மொழிபெயர்ப்பது
  rationale: வசனம் அடையாளத் தீர்ப்புக் காட்சியை அதன் சொந்த உருவக மொழியிலேயே முன்வைக்கிறது; மொழிபெயர்ப்பு அந்த அடையாளத்தை ஓர் குறிப்பிட்ட விளக்கமாக மாற்றக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வெளிப்படுத்தின விசேஷத்தின் தீவிரமான அபோகலிப்டிக் நடையைத் தணிக்காமலும் மொழிபெயர்க்கப்பட்டது. “வேசி” போன்ற அதிக இழிவுத்தன்மை கொண்ட சொல்லையும், நீளமான விளக்கப் பரிமாற்றங்களையும் தவிர்த்து “விலைமகள்” பயன்படுத்தப்பட்டது.
