  source_fidelity: 'முதன்மை உரை கிரேக்கத்தின் வரிசையையும் முக்கிய உருவகங்களையும் துல்லியமாகப் பேணுகிறது: கொம்புகள், மிருகம், விலைமகள், பாழாக்குதல், நிர்வாணமாக்குதல், சதையைத் தின்னுதல், நெருப்பால் முழுமையாக எரித்தல் ஆகியவை அனைத்தும் உள்ளன. ஆனால் οὗτοι என்பதற்கான “இவர்களே” அருகாமை/மனிதர் சுட்டலாக ஒலிக்கிறது; உயிரற்ற அடையாளங்களான கொம்புகளும் மிருகமும் குறிக்கப்படும் இடத்தில் “அவைகளே” பொருத்தமானது.'
  naturalness: திருத்திய உரை நவீன நிலையான தமிழில் இயல்பாக உள்ளது. “அவைகளே” என்பது கொம்புகளையும் மிருகத்தையும் அவற்றின் அடையாள உருவக நிலையிலேயே மீள்சுட்டுகிறது. அடிக்குறிப்பு அ-வில் இருந்த “முற்றிலும் வெளிப்படுத்துவார்கள்” என்பது γυμνήν-க்கு நம்பகமான மாற்றல்ல; ஆடைகளை அகற்றி நிர்வாணமாக்கும் கருத்தாகத் திருத்தப்பட்டுள்ளது.
