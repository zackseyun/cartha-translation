reference: Revelation 17:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐπὶ τὸ μέτωπον αὐτῆς ὄνομα γεγραμμένον, μυστήριον, Βαβυλὼν ἡ μεγάλη, ἡ μήτηρ τῶν πορνῶν καὶ τῶν βδελυγμάτων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/005.yaml
  text: 'And on her forehead a name was written: Mystery[a], Babylon the Great, the mother of prostitutes and of the abominations of the earth.'
translation:
  language: ta
  text: 'அவளுடைய நெற்றியில் ஒரு பெயர் எழுதப்பட்டிருந்தது: “மறைபொருள்,[a] மகா பாபிலோன், பூமியின் விலைமகள்களுக்கும் அருவருப்புகளுக்கும் தாய்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, ‘ஒரு பெயர் எழுதப்பட்டிருந்தது—ஒரு மறைபொருள்: மகா பாபிலோன், பூமியின் விலைமகள்களுக்கும் அருவருப்புகளுக்கும் தாய்.’ இவ்வாசிப்பில், ‘மறைபொருள்’ கல்வெட்டின் பகுதியாக இல்லாமல், தொடர்ந்து வரும் பெயரின் குறியீட்டுப் பொருளை அறிமுகப்படுத்துவதாகக் கொள்ளப்படுகிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ τὸ μέτωπον αὐτῆς
  choice: அவளுடைய நெற்றியில்
  rationale: ἐπί உடன் வரும் இடத்தைக் குறிக்கும் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்தி, நெற்றியில் எழுதப்பட்ட அடையாளம் என்ற காட்சியைத் தெளிவாக வைத்திருக்கிறது.
- source_word: ὄνομα γεγραμμένον
  choice: ஒரு பெயர் எழுதப்பட்டிருந்தது
  rationale: γεγραμμένον என்பதன் செயப்பாட்டு மற்றும் விளைவுநிலை உணர்வை ‘எழுதப்பட்டிருந்தது’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: μυστήριον
  choice: மறைபொருள்
  rationale: வெறும் ரகசியத்தை அல்லாமல், வெளிப்படுத்தப்பட வேண்டிய மறைந்த அடையாளப் பொருளையும் வெளிப்படுத்தும் சொல்; முதன்மை வாசிப்பில் எழுதப்பட்ட பெயரின் ஒரு பகுதியாக வைக்கப்பட்டுள்ளது.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: மகா பாபிலோன்
  rationale: Βαβυλών என்ற இயற்பெயரை ஒலிபெயர்த்து, ἡ μεγάλη என்ற பட்டப்பெயரைத் தமிழில் இயல்பாகவும் வேதாகம நடையுடனும் வழங்குகிறது.
- source_word: ἡ μήτηρ
  choice: தாய்
  rationale: பின்வரும் இரண்டு தொகுதிகளுக்கும் மூலமாக இருப்பவள் என்ற உருவகப் பட்டத்தைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: τῶν πορνῶν
  choice: விலைமகள்களுக்கு
  rationale: πόρνη என்பதன் பெண்பால் பன்மையையும் விபசாரத் தொழில் சார்ந்த நேரடியான பொருளையும் ‘விலைமகள்கள்’ காக்கிறது; பொதுவான பாலியல் ஒழுக்கக்கேடாக விரிவாக்கவில்லை.
- source_word: τῶν βδελυγμάτων
  choice: அருவருப்புகளுக்கு
  rationale: βδέλυγμα குறிக்கும் மத மற்றும் ஒழுக்க ரீதியாக வெறுக்கத்தக்கவற்றை, வெளிப்படுத்தின விசேஷத்தின் வலுவான நடையைப் பாதுகாத்து வழங்குகிறது.
- source_word: τῆς γῆς
  choice: பூமியிலுள்ள
  rationale: வெளிப்படுத்தின விசேஷத்தின் உலகளாவிய சூழலில் γῆ என்பதை ‘பூமி’ என எடுத்துக்கொண்டு, தமிழில் இரு பெயர்த்தொகுதிகளுடனும் இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: μυστήριον என்பது நெற்றியில் எழுதப்பட்ட பெயரின் பகுதியா, அல்லது அதைத் தொடர்ந்து வரும் பெயரின் அடையாளப் பொருளை அறிமுகப்படுத்தும் விவரிப்பா?
  choice: 'முதன்மை உரையில் அது எழுதப்பட்ட பெயரின் பகுதியாகக் கொள்ளப்பட்டுள்ளது: ‘மறைபொருள், மகா பாபிலோன்...’'
  alternative: '‘ஒரு பெயர் எழுதப்பட்டிருந்தது; அதன் மறைபொருள்: மகா பாபிலோன்...’ என்று, μυστήριον அடுத்துவரும் பெயரின் அடையாளப் பொருளை அறிமுகப்படுத்துவதாகக் கொள்ளலாம்.'
  rationale: கிரேக்க மூலத்தின் சொல் வரிசை இரு நிறுத்தக்குறி விளக்கங்களையும் அனுமதிக்கிறது. முதன்மை வாசிப்பு வெளிப்படுத்தல் நூலின் மர்மமான கல்வெட்டு வலிமையைப் பாதுகாக்கிறது; மாற்று வாசிப்பும் சாத்தியமானதால் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், வெளிப்படுத்தல் நூலுக்குரிய கண்ணியமான தீர்க்கதரிசன நடையுடனும் அமைக்கப்பட்டுள்ளது. ‘மறைபொருள்’ மற்றும் ‘அருவருப்புகள்’ ஆகியவை அபோகலிப்டிக் மற்றும் வேதாகமத் தொனியைப் பேணுகின்றன; நிறுத்தக்குறியால் தீர்மானிக்கப்படும் மூலமொழியின் இருபொருள் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
