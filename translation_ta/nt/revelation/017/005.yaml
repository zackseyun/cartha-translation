  to: 'அவளுடைய நெற்றியில் ஒரு பெயர் எழுதப்பட்டிருந்தது: “மறைபொருள்,[a] மகா பாபிலோன், பூமியின் விலைமகள்களுக்கும் அருவருப்புகளுக்கும் தாய்.”'
