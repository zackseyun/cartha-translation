  source_fidelity: மூலக் கிரேக்கத்தின் οὗτοι, μίαν γνώμην ἔχουσιν, δύναμιν, ἐξουσίαν, τῷ θηρίῳ, διδόασιν ஆகிய அனைத்தும் துல்லியமாகவும் வரிசைமுறையாகவும் பிரதிபலிக்கப்படுகின்றன. ‘வல்லமை’ மற்றும் ‘அதிகாரம்’ தனித்தனியாக வைத்திருப்பது δύναμις/ἐξουσία வேறுபாட்டைக் காக்கிறது. நிகழ்காலமான ‘கொடுக்கிறார்கள்’ சரியானது.
  naturalness: ‘இவர்கள் ஒரே எண்ணமுள்ளவர்கள்; தங்கள் வல்லமையையும் அதிகாரத்தையும் அந்த மிருகத்திடம் கொடுக்கிறார்கள்’ என்பது நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமான வேதாகம நடையுடனும் உள்ளது. ‘அந்த மிருகத்திடம்’ என்பது பெறுநரைக் குறிக்கும் இயல்பான பயன்பாடாகும்.
  terminology: ‘மிருகம்,’ ‘வல்லமை,’ ‘அதிகாரம்’ ஆகியவை வெளிப்படுத்தல் நூலின் சூழலுக்கும் நிலையான தமிழ் வேதாகமப் பயன்பாட்டிற்கும் ஏற்றவை. ‘ஒரே எண்ணமுள்ளவர்கள்’ γνώμη என்ற சொல்லின் கருத்து/தீர்மானம்/நோக்கம் ஆகிய திறந்த பொருள் பரப்பை மிகைப்படுத்தாமல் காக்கிறது. அடிக்குறிப்பு மாற்று வாசிப்பைத் தெளிவாகவும் அளவாகவும் வழங்குகிறது.
