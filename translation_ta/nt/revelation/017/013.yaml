id: REV.17.13
reference: Revelation 17:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὗτοι μίαν ⸂γνώμην ἔχουσιν⸃, καὶ τὴν δύναμιν ⸀καὶ ἐξουσίαν αὐτῶν τῷ θηρίῳ διδόασιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/013.yaml
  text: These are of one mind[a], and they give their power and authority to the beast.
translation:
  language: ta
  text: இவர்கள் ஒரே எண்ணமுள்ளவர்கள்[a]; தங்கள் வல்லமையையும் அதிகாரத்தையும் அந்த மிருகத்திடம் கொடுக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரே நோக்கமுள்ளவர்கள்.” கிரேக்க மரபுத்தொடர் சொல்லுக்குச் சொல் “ஒரே எண்ணத்தைக் கொண்டிருக்கிறார்கள்” என்கிறது; இது அவர்களுடைய ஒருமித்த மனவுறுதியையோ நோக்கத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: இவர்கள்
  rationale: முன்னர் குறிப்பிடப்பட்ட பத்து அரசர்களைச் சுட்டுகிறது; நவீனத் தமிழில் இயல்பான சுட்டுப்பெயர்.
- source_word: μίαν γνώμην ἔχουσιν
  choice: ஒரே எண்ணமுள்ளவர்கள்
  rationale: ஒருமித்த கருத்து, மனவுறுதி அல்லது நோக்கம் ஆகிய நுண்பொருள்களை முற்றிலும் ஒன்றாகச் சுருக்காமல், கிரேக்க மரபுத்தொடரின் பரப்பைத் தக்கவைக்கிறது.
- source_word: δύναμιν
  choice: வல்லமை
  rationale: செயலாற்றும் ஆற்றல் அல்லது பலம் என்ற பொருளை வெளிப்படுத்துகிறது; அடுத்து வரும் அதிகாரம் என்பதிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: ἐξουσίαν
  choice: அதிகாரம்
  rationale: ஆளும் உரிமை அல்லது அதிகாரப்பூர்வச் செல்வாக்கைக் குறிக்கும் வழக்கமான, தெளிவான தமிழ் இணை.
- source_word: τῷ θηρίῳ
  choice: அந்த மிருகத்திடம்
  rationale: வெளிப்படுத்தலில் ஏற்கெனவே அடையாளம் காணப்பட்ட குறிப்பிட்ட அபோகலிப்டிக் உருவத்தைக் குறிக்கும் பெயர்ச்சொல்லின் குறிப்புத்தன்மையை ‘அந்த’ தக்கவைக்கிறது.
- source_word: διδόασιν
  choice: கொடுக்கிறார்கள்
  rationale: தரிசன விவரிப்பிலுள்ள நிகழ்காலத்தையும் நேரடியான ‘கொடு’ என்ற பொருளையும் இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: μίαν γνώμην ἔχουσιν என்ற மரபுத்தொடரின் பொருள்
  choice: ஒரே எண்ணமுள்ளவர்கள்
  alternative: ஒரே நோக்கமுள்ளவர்கள்
  rationale: சூழலில் பொதுவான அரசியல் நோக்கம் இருந்தாலும், சொற்றொடர் கருத்து, மனவுறுதி, நோக்கம் ஆகியவற்றில் ஒன்றை மட்டும் திட்டவட்டமாக்கவில்லை; எனவே அதன் உண்மையான பொருள் விரிவை முதன்மை உரை காக்கிறது.
- issue: δύναμις மற்றும் ἐξουσία ஆகியவற்றின் வேறுபாடு
  choice: வல்லமையும் அதிகாரமும்
  alternative: பலமும் ஆளும் உரிமையும்
  rationale: முதல் சொல் செயலாற்றும் ஆற்றலையும் இரண்டாவது சொல் ஆளும் அதிகாரத்தையும் சுட்டுவதால், தொடர்புடைய ஆனால் வேறுபட்ட இரு கருத்துகளாக மொழிபெயர்க்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘வல்லமை’ மற்றும் ‘அதிகாரம்’ தனித்தனியாக வைக்கப்பட்டுள்ளன; ‘ஒரே எண்ணம்’ என்ற சொற்றொடரின் பொருள் விரிவு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
