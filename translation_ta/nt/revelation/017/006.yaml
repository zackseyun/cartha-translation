source:
  edition: SBLGNT
  text: καὶ εἶδον τὴν γυναῖκα μεθύουσαν ἐκ τοῦ αἵματος τῶν ἁγίων ⸀καὶ ἐκ τοῦ αἵματος τῶν μαρτύρων Ἰησοῦ. Καὶ ἐθαύμασα ἰδὼν αὐτὴν θαῦμα μέγα·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/006.yaml
  text: And I saw the woman drunk with the blood of the saints and with the blood of the martyrs of Jesus. And seeing her[a], I marveled greatly.
translation:
  language: ta
  text: அந்தப் பெண் பரிசுத்த மக்களின் இரத்தத்தாலும், இயேசுவின் சாட்சிகளின்[a] இரத்தத்தாலும் போதையடைந்திருந்ததைக் கண்டேன். அவளைப் பார்த்தபோது நான் மிகவும் வியப்படைந்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இயேசுவுக்காக உயிர்த்தியாகம் செய்தவர்கள்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் ‘சாட்சிகள்’ அல்லது ‘உயிர்த்தியாகம் செய்தவர்கள்’ எனப் பொருள்படலாம்; இங்கு அவர்களுடைய இரத்தம் குறிப்பிடப்படுவதால் உயிர்த்தியாகம் என்ற பொருள் சிறப்பாகப் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεθύουσαν
  choice: போதைகொண்டிருந்ததை
  rationale: பெண்ணின் தொடர்ந்த நிலையையும், இரத்தத்தால் ஏற்பட்டதாகச் சித்தரிக்கப்படும் அதிர்ச்சியூட்டும் போதை உருவகத்தையும் இயல்பான தமிழில் காக்கிறது; அவள் உண்மையில் இரத்தத்தைக் குடித்தாள் என்று மூலத்தில் இல்லாத செயலைச் சேர்ப்பதில்லை.
- source_word: ἐκ τοῦ αἵματος
  choice: இரத்தத்தாலும்
  rationale: μεθύω என்பதுடன் வரும் ἐκ காரணம் அல்லது மூலத்தைக் காட்டுகிறது. தமிழில் ‘இரத்தத்தால் போதைகொண்டாள்’ என்பது அந்த உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: τῶν ἁγίων
  choice: தூய மக்கள்
  rationale: வெளிப்படுத்தின விசேஷத்தில் ἅγιοι என்பது கடவுளுக்கெனப் பிரித்தெடுக்கப்பட்ட மக்களைக் குறிக்கிறது. ‘தூய மக்கள்’ என்பது நவீன வாசகர்களுக்குத் தெளிவாகவும் சமயப் பட்டப்பெயர் என்ற தவறான எண்ணத்தைத் தவிர்ப்பதாகவும் உள்ளது.
- source_word: τῶν μαρτύρων Ἰησοῦ
  choice: இயேசுவின் சாட்சிகள்
  rationale: μάρτυς என்பதன் அடிப்படைப் பொருளான ‘சாட்சி’ என்பதையும், Ἰησοῦ என்ற உரிய வேற்றுமையின் சுருக்கமான பன்முகத் தொடர்பையும் காக்கிறது. இரத்தம் குறிப்பிடப்படுவதால் உயிர்த்தியாகம் சூழலில் தெளிவாக உள்ளது; அந்த மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐθαύμασα
  choice: மிகவும் வியப்படைந்தேன்
  rationale: θαυμάζω இங்குக் குறிக்கும் தீவிரமான வியப்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἰδὼν αὐτὴν
  choice: அவளைப் பார்த்தபோது
  rationale: இறந்தகாலப் பங்கேற்பு வினையின் காலத் தொடர்பை இயல்பான தமிழ்க் காலவாக்கியமாகத் தருகிறது.
- source_word: θαῦμα μέγα
  choice: மிகவும்
  rationale: வினையோடு ஒரே வேரைப் பகிரும் வலியுறுத்தும் பெயர்ச்சொல் அமைப்பை, தமிழில் இயல்பான வினையடை வலியுறுத்தலாகக் காட்டுகிறது.
theological_decisions:
- issue: துன்புறுத்தல் சூழலில் μάρτυρες என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘சாட்சிகள்’
  alternative: ‘இயேசுவுக்காக உயிர்த்தியாகம் செய்தவர்கள்’
  rationale: μάρτυς என்பதன் சாட்சி என்ற அடிப்படைப் பொருளையும் வெளிப்படுத்தின விசேஷத்தின் சாட்சியளித்தல் கருப்பொருளையும் முதன்மை உரை காக்கிறது. அவர்களுடைய இரத்தம் குறிப்பிடப்படுவதால் உயிர்த்தியாகம் செய்தோர் என்ற பொருளும் வலுவாக உள்ளது; ஆகவே அதை அடிக்குறிப்பில் வெளிப்படையாகக் கொடுக்கிறது.
- issue: Ἰησοῦ என்ற உரிய வேற்றுமையின் தொடர்பு
  choice: ‘இயேசுவின்’ என்று சுருக்கமாக வைத்தல்
  alternative: ‘இயேசுவைக் குறித்து சாட்சி சொன்ன’ அல்லது ‘இயேசுவுக்காகச் சாட்சி சொன்ன’
  rationale: கிரேக்க உருபு இவர்களை இயேசுவுக்குச் சொந்தமான சாட்சிகள், இயேசுவைக் குறித்துச் சாட்சி சொல்பவர்கள், அல்லது இயேசுவுக்காகச் சாட்சி சொல்பவர்கள் எனப் புரிந்துகொள்ள இடமளிக்கிறது. குறிப்பிட்ட ஒரு தொடர்பை மட்டும் தேர்ந்தெடுக்காமல் உண்மையான தெளிவின்மையைத் தமிழ் வடிவம் காக்கிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘போதைகொண்டிருந்ததை’ என்பது வெளிப்படுத்தின விசேஷத்தின் கடுமையான இரத்த உருவகத்தைத் தணிக்காமல், ‘இரத்தத்தைக் குடித்தாள்’ என்ற மூலத்தில் வெளிப்படையாக இல்லாத விவரத்தையும் சேர்க்காமல் வழங்குகிறது. ‘தூய மக்கள்’ என்பது பொதுவாசகர்களுக்குத் தெளிவான கூட்டுப்பெயராகத் தேர்ந்தெடுக்கப்பட்டது.
