revisions:
- from: அந்தப் பெண் தூய மக்களின் இரத்தத்தாலும், இயேசுவின் சாட்சிகளுடைய[a] இரத்தத்தாலும் போதைகொண்டிருந்ததைக் கண்டேன். அவளைப் பார்த்தபோது நான் மிகவும் வியப்படைந்தேன்.
  to: அந்தப் பெண் பரிசுத்த மக்களின் இரத்தத்தாலும், இயேசுவின் சாட்சிகளின்[a] இரத்தத்தாலும் போதையடைந்திருந்ததைக் கண்டேன். அவளைப் பார்த்தபோது நான் மிகவும் வியப்படைந்தேன்.
