id: REV.6.2
reference: Revelation 6:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ⸂εἶδον, καὶ⸃ ἰδοὺ ἵππος λευκός, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ἔχων τόξον, καὶ ἐδόθη αὐτῷ στέφανος, καὶ ἐξῆλθεν νικῶν καὶ ἵνα νικήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/002.yaml
  text: And I looked[a], and behold, a white horse, and the one sitting on it had a bow, and a crown was given to him[b], and he went out conquering and to conquer.
translation:
  language: ta
  text: நான் பார்த்தேன்; இதோ, ஒரு வெள்ளைக் குதிரை! அதன்மேல் அமர்ந்திருந்தவன்[b] ஒரு வில்லை வைத்திருந்தான். அவனுக்கு ஒரு கிரீடம் கொடுக்கப்பட்டது[a]. அவன் வென்றுகொண்டே மேலும் வெல்வதற்காகப் புறப்பட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வெற்றியாளருக்குரிய கிரீடம் அவனுக்குக் கொடுக்கப்பட்டது’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் στέφανος பொதுவாக அரசரின் மணிமுடியைக் காட்டிலும் வெற்றியுடன் தொடர்புடைய வெற்றிமாலையையோ கிரீடத்தையோ குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இந்தக் குதிரையின்மேல் அமர்ந்திருப்பவன் யார் என்று வசனம் கூறவில்லை; இதுகுறித்து பல்வேறு விளக்கங்கள் உள்ளன.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶδον
  choice: நான் பார்த்தேன்
  rationale: ὁράω என்பதன் இறந்தகால வடிவம் காட்சியில் நிகழ்ந்த பார்வையைச் சுட்டுகிறது; தொடர்ந்து வரும் ἰδού-வின் கவனஈர்ப்பு வலிமையுடன் இயல்பாக இணைவதால் ‘பார்த்தேன்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: திடீரெனக் காட்சிக்குக் கவனம் திருப்பும் வெளிப்படுத்தல் நூலுக்குரிய உயிரோட்டத்தை நவீனத் தமிழில் இயல்பாகத் தக்கவைக்கிறது.
- source_word: ἵππος λευκός
  choice: ஒரு வெள்ளைக் குதிரை
  rationale: காட்சியில் முதன்முறையாக அறிமுகமாகும் பெயர்ச்சொல் தொடரை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: அதன்மேல் அமர்ந்திருந்தவன்
  rationale: ‘அதன் குதிரைவீரன்’ என்று சுருக்காமல், மூலத்தின் பெயரெச்ச அமைப்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: ἔχων τόξον
  choice: ஒரு வில்லை வைத்திருந்தான்
  rationale: τόξον என்பது அம்பு எய்யும் வில்; ἔχων குறிக்கும் உடைமையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἐδόθη αὐτῷ στέφανος
  choice: அவனுக்கு ஒரு கிரீடம் கொடுக்கப்பட்டது
  rationale: செயப்பாட்டு அமைப்பைத் தக்கவைத்து, கொடுத்தவர் யார் என்பதை மூலத்தைவிடத் தெளிவுபடுத்தாமல் விடுகிறது; στέφανος-ன் குறிப்பான வெற்றிவளைய நுட்பம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐξῆλθεν
  choice: புறப்பட்டான்
  rationale: காட்சிக்குள் அவன் வெளியே சென்று செயல்படத் தொடங்குவதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: νικῶν
  choice: வென்றுகொண்டே
  rationale: நிகழ்காலப் பெயரெச்சத்தின் தொடர்ச்சியான செயற்பாட்டையும் வெற்றி/வெல்லுதல் என்ற பொருளையும் தக்கவைக்கிறது.
- source_word: ἵνα νικήσῃ
  choice: வெல்வதற்காக
  rationale: ἵνα உடன் வரும் வினைமுற்றின் நோக்கப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; வெற்றி உறுதியாக முடிந்துவிட்டதாகக் கூறாது.
theological_decisions:
- issue: வெள்ளைக் குதிரையின்மேல் அமர்ந்திருப்பவனின் அடையாளம்
  choice: அவனுடைய அடையாளத்தை மொழிபெயர்ப்பு குறிப்பிடாமல் விடுகிறது.
  alternative: கிறிஸ்து அல்லது கிறிஸ்துவைப் போன்ற உருவம்; வெற்றிகொள்ளும் அரசன் அல்லது பேரரசு; அந்திக்கிறிஸ்து அல்லது வஞ்சக வெற்றியாளன்
  rationale: கிரேக்க வசனம் அவனுடைய தோற்றம், ஆயுதம், பெற்ற கிரீடம், செயல் ஆகியவற்றை மட்டும் கூறுகிறது; அவன் யார் என்று அடையாளப்படுத்தவில்லை. ஆகவே மாறுபட்ட இறையியல் விளக்கங்களில் ஒன்றை மொழிபெயர்ப்பில் புகுத்தாமல் மூலத்தின் தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் மரியாதைமிக்க நடையில் மொழிபெயர்க்கப்பட்டது. ‘இதோ’ என்பது தரிசனக் காட்சியின் திடீர் உயிரோட்டத்தைப் பேணுகிறது. குறுகிய வாக்கியங்கள் மூலத்தின் தொடர்ச்சியான καί அமைப்பின் வேகத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகின்றன.
