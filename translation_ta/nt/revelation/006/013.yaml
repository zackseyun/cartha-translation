id: REV.6.13
reference: Revelation 6:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ οἱ ἀστέρες τοῦ οὐρανοῦ ἔπεσαν εἰς τὴν γῆν, ὡς συκῆ ⸀βάλλει τοὺς ὀλύνθους αὐτῆς ὑπὸ ἀνέμου μεγάλου σειομένη,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/013.yaml
  text: and the stars of heaven fell to the earth[a], as a fig tree drops its unripe figs when shaken by a strong wind,
translation:
  language: ta
  text: வானத்தின் விண்மீன்கள், பலத்த காற்றால் அசைக்கப்படும்போது அத்திமரம் தன் முதிராத அத்திப்பழங்களை உதிர்ப்பதுபோல, பூமியின்மேல் விழுந்தன.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀστέρες
  choice: விண்மீன்கள்
  rationale: சொல்லின் வழக்கமான பொருளையும் வெளிப்படுத்தல் நூலின் காட்சிப்படிமத்தையும் காக்கிறது; தேவதூதர்கள் அல்லது ஆட்சியாளர்கள் என்று விளக்கிப் பொருள் கொள்ளவில்லை.
- source_word: τοῦ οὐρανοῦ
  choice: வானத்தின்
  rationale: οὐρανός என்பதன் வானம்/பரலோகம் என்ற பொருள் விரிவை முற்றிலும் குறுக்காமல், விண்மீன்கள் இடம்பெறும் பேரண்டக் காட்சிக்கு இயல்பான தமிழை வழங்குகிறது.
- source_word: ἔπεσαν εἰς τὴν γῆν
  choice: பூமியின்மேல் விழுந்தன
  rationale: εἰς குறிக்கும் கீழ்நோக்கிய இயக்கத்தையும் பூமியை அடையும் காட்சியையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: συκῆ
  choice: அத்திமரம்
  rationale: இச்சொல்லுக்கான வழக்கமான, தெளிவான தமிழ்ப் பெயர்.
- source_word: βάλλει
  choice: உதிர்ப்பது
  rationale: βάλλω என்பதன் அடிப்படைப் பொருள் ‘எறிதல்’ என்றாலும், மரத்திலிருந்து காய்கள் விழும் இச்சூழலில் ‘உதிர்ப்பது’ என்பதே இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: ὀλύνθους
  choice: முதிராத அத்திப்பழங்கள்
  rationale: முழுமையாகப் பழுக்கும் முன் காற்றால் உதிர்க்கப்படும் அத்திப்பழங்களைத் தெளிவாகக் குறிக்கிறது; சொல்லின் அரிய மாற்றுப் பொருள்கள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
- source_word: ὑπὸ ἀνέμου μεγάλου
  choice: பலத்த காற்றால்
  rationale: μέγας இங்கு காற்றின் வலிமையைக் குறிப்பதால், நவீனத் தமிழில் இயல்பாக அதன் தாக்கத்தை வெளிப்படுத்துகிறது.
- source_word: σειομένη
  choice: அசைக்கப்படும்
  rationale: அத்திமரத்தை விளக்கும் நிகழ்காலச் செயப்பாட்டு வினையெச்சத்தின் பொருளையும் தொடரும் செயல் நிழலையும் காக்கிறது.
theological_decisions:
- issue: விண்மீன்கள் பூமியில் விழும் வெளிப்படுத்தல் காட்சி
  choice: ‘வானத்தின் விண்மீன்கள் பூமியின்மேல் விழுந்தன’ என்ற சொற்படிமம் அப்படியே காக்கப்பட்டது.
  alternative: ‘விண்மீன்கள்’ என்பதை தேவதூதர்கள் அல்லது ஆட்சியாளர்கள் என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: இந்தக் காட்சிக்கு அடையாளப் பொருள் இருக்கக்கூடும்; ஆனால் மூலவசனம் அந்தப் பொருளை இங்கே வெளிப்படையாகத் தீர்மானிக்கவில்லை. ஆகவே மொழிபெயர்ப்பு அதன் இறையியல் மற்றும் விளக்கவியல் திறந்தநிலையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வெளிப்படுத்தல் நூலுக்கேற்ற கண்ணியமான பேரண்டக் காட்சி நடை பயன்படுத்தப்பட்டுள்ளது. ஒப்புமை தெளிவாக இருக்க ‘அவை விழுந்தன’ என்பது தமிழில் மீண்டும் சொல்லப்பட்டுள்ளது; இது புதிய கருத்தைச் சேர்க்காமல் விண்மீன்களையே சுட்டுகிறது.
