revisions:
- from: அவர் நான்காவது முத்திரையைத் திறந்தபோது, நான்காவது உயிருள்ள படைப்பின் குரல், “வா”[a] என்று சொல்வதை நான் கேட்டேன்.
  to: அவர் நான்காவது முத்திரையைத் திறந்தபோது, “வா”[a] என்று சொல்லும் நான்காவது உயிருள்ள உயிரினத்தின் குரலை நான் கேட்டேன்.
  rationale: The revision retains every element of the Greek and preserves the unresolved addressee of the imperative. It replaces an imprecise designation for the living creature and smooths the Tamil syntax. The footnote continues to mark “Go forth” as an interpretive alternative rather than the primary rendering.
