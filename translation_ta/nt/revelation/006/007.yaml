id: REV.6.7
reference: Revelation 6:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξεν τὴν σφραγῖδα τὴν τετάρτην, ἤκουσα ⸀φωνὴν τοῦ τετάρτου ζῴου λέγοντος· ⸀Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/007.yaml
  text: And when he opened the fourth seal[a], I heard the voice of the fourth living creature saying, “Come.”
translation:
  language: ta
  text: அவர் நான்காவது முத்திரையைத் திறந்தபோது, “வா”[a] என்று சொல்லும் நான்காவது உயிருள்ள உயிரினத்தின் குரலை நான் கேட்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ஒருவேளை, “புறப்பட்டுச் செல்.” கிரேக்கத்தில் இன்னும் நேரடியாக, “வா” என்றே உள்ளது; இந்தக் கட்டளை யோவானை நோக்கிச் சொல்லப்பட்டதா, குதிரைவீரனை நோக்கிச் சொல்லப்பட்டதா என்பதில் விளக்குநர்கள் வேறுபடுகின்றனர்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἤνοιξεν
  choice: திறந்தார்
  rationale: ἀνοίγω என்பதன் இறந்தகாலச் செயலை இயல்பாகவும், முத்திரையைத் திறக்கும் தொடர்ச்சியான காட்சிக்குப் பொருத்தமாகவும் தெரிவிக்கிறது.
- source_word: σφραγῖδα
  choice: முத்திரை
  rationale: வெளிப்படுத்தல் 6-இல் சுருளை மூடியிருக்கும் முத்திரையைக் குறிக்கும் நிலையான, துல்லியமான தமிழ் சொல்.
- source_word: τετάρτην / τετάρτου
  choice: நான்காவது
  rationale: இரு இடங்களிலும் வரும் வரிசை எண்ணை ஒரேவிதமாகத் தெளிவாக மொழிபெயர்க்கிறது.
- source_word: φωνὴν
  choice: குரல்
  rationale: இங்கு ஒலிப்பவராக நான்காவது உயிருள்ள படைப்பு உடனே குறிப்பிடப்படுவதால், மனிதரல்லாத வானுலகப் படைப்புக்கும் இயல்பாகப் பொருந்தும் சொல்.
- source_word: ζῴου
  choice: உயிருள்ள படைப்பு
  rationale: அரியணையைச் சூழ்ந்துள்ள உயிருள்ள வானுலகப் படைப்பைக் குறிக்கிறது; θηρίον என்பதற்குரிய ‘மிருகம்’ என்ற பொருளுடன் குழப்பாமல் வேறுபாட்டைக் காக்கிறது.
- source_word: λέγοντος
  choice: சொல்வதை
  rationale: கேட்புச் செயலைத் தொடர்ந்து வரும் நிகழ்காலப் பங்கேற்பு வடிவத்தை இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: Ἔρχου
  choice: வா
  rationale: கிரேக்க ஒருமை கட்டளைச்சொல்லின் நேரடியான பொருள் ‘வா’; யாரிடம் சொல்லப்பட்டது என்பதை உரை வெளிப்படையாகக் குறிப்பிடாததால் அதைச் சேர்க்கவில்லை.
theological_decisions:
- issue: Ἔρχου என்ற கட்டளையின் பெறுநர்
  choice: பெறுநரைக் குறிப்பிடாமல் “வா” என்று மட்டும் மொழிபெயர்த்தல்
  alternative: “புறப்பட்டுப் போ” என்று குதிரைவீரனை நோக்கிய கட்டளையாக விளக்குதல், அல்லது யோவானை நோக்கியதாகக் கருதுதல்
  rationale: கிரேக்க உரை கட்டளையைப் பெறுபவர் யார் என்று சொல்லவில்லை. வெறும் கட்டளையை அப்படியே வைத்திருப்பது உரையின் திட்டமிட்டிருக்கக்கூடிய தெளிவின்மையையும் இறையியல் அழுத்தத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. “உயிருள்ள படைப்பு” என்பது வெளிப்படுத்தலில் வரும் அரியணைச் சூழ் உயிர்களை சாதாரண விலங்குகளிலிருந்தும் ‘மிருகம்’ என்பதிலிருந்தும் வேறுபடுத்துகிறது. மூலத்தின் சுருக்கமும் கட்டளையின் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
