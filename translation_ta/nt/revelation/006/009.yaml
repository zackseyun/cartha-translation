reference: Revelation 6:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξεν τὴν πέμπτην σφραγῖδα, εἶδον ὑποκάτω τοῦ θυσιαστηρίου τὰς ψυχὰς τῶν ἐσφαγμένων διὰ τὸν λόγον τοῦ θεοῦ καὶ διὰ τὴν ⸀μαρτυρίαν ἣν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/009.yaml
  text: And when he opened the fifth seal[b][a], I saw under the altar the souls of those who had been slaughtered because of the word of God and because of the testimony they had.
translation:
  language: ta
  text: அவர் ஐந்தாம் முத்திரையைத் திறந்தபோது, கடவுளின் வார்த்தையின் காரணமாகவும் தாங்கள் கொண்டிருந்த சாட்சியத்தின்[b] காரணமாகவும் வெட்டிக் கொல்லப்பட்டவர்களின்[a] ஆன்மாக்களைப் பலிபீடத்தின் கீழே கண்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கொல்லப்பட்டவர்களின்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினை வன்மையாக வெட்டிக் கொல்வதைக் குறிக்கிறது; வெளிப்படுத்துதல் நூலில் அது பலியிடுதலின் எதிரொலியையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘சாட்சி’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் கூறப்பட்ட சாட்சியத்தையோ சாட்சி பகர்வதையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνοιξεν
  choice: திறந்தபோது
  rationale: ἀνοίγω என்பதற்கான இயல்பான தமிழ் இணை; வெளிப்படுத்தின விசேஷத்தில் தொடர்ந்து வரும் முத்திரை திறக்கும் காட்சியையும் தெளிவாகக் காட்டுகிறது.
- source_word: σφραγῖδα
  choice: முத்திரையை
  rationale: σφραγίς என்பதன் திருக்காட்சி சார்ந்த உருவகத்தைத் துல்லியமாகப் பாதுகாக்கும் வழக்கமான தமிழ் சொல்.
- source_word: ὑποκάτω
  choice: கீழே
  rationale: எளிய இடத்தொடர்பை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: θυσιαστηρίου
  choice: பலிபீடத்தின்
  rationale: θυσιαστήριον என்பதன் பலி மற்றும் வழிபாட்டு உருவகத்தைப் பாதுகாக்கிறது; அது பரலோகத்ததா பூமிக்குரியதா என்பதைத் தேவையின்றி வரையறுக்கவில்லை.
- source_word: ψυχὰς
  choice: ஆன்மாக்களை
  rationale: தரிசனத்தில் இறந்தவர்கள் பலிபீடத்தின் கீழ் காணப்படுகிற காட்சித்தன்மையைப் பாதுகாக்கிறது; இதிலிருந்து விரிவான மனித இயல்பு பற்றிய கோட்பாட்டைத் திணிக்கவில்லை.
- source_word: ἐσφαγμένων
  choice: வெட்டிக் கொல்லப்பட்டவர்களின்
  rationale: σφάζω என்பதிலுள்ள வன்மையான கொலை மற்றும் பலியிடுதல் சார்ந்த எதிரொலியை, பொதுவான ‘கொல்லப்பட்ட’ என்பதைக் காட்டிலும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: கடவுளின் வார்த்தையின் காரணமாக
  rationale: διά + accusative இங்குக் காரணத்தைக் குறிக்கிறது; ‘காரணமாக’ என்பது அதைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: μαρτυρίαν
  choice: சாட்சியத்தின்
  rationale: μαρτυρία என்பது அளிக்கப்பட்ட சாட்சி அல்லது சாட்சியம் என்ற இரு தொடர்புடைய பொருட்களையும் கொள்ளலாம்; ‘சாட்சியம்’ இவ்விடத்தில் அவர்கள் கொண்டிருந்த ஒன்றாக இயல்பாக அமைகிறது.
- source_word: ἣν εἶχον
  choice: தாங்கள் கொண்டிருந்த
  rationale: ἔχω என்ற வினையின் இறந்தகாலத் தொடர்நிலையை இயல்பாகத் தருகிறது; ‘பற்றிக்கொண்டிருந்த’ அல்லது ‘நிலைநிறுத்தின’ போன்ற விளக்க விரிவைத் தவிர்க்கிறது.
theological_decisions:
- issue: தரிசனக் காட்சியில் ψυχὰς என்பதன் இயல்பு
  choice: முதன்மை உரையில் ‘ஆன்மாக்கள்’ என்று மொழிபெயர்த்தல்.
  alternative: உயிர்கள்; ஆட்கள்
  rationale: இது பலிபீடத்தின் கீழ் காணப்படும் கொல்லப்பட்டவர்களைப் பற்றிய தரிசனம். ‘ஆன்மாக்கள்’ என்பது காட்சியின் தனித்தன்மையைப் பாதுகாக்கிறது; அதேவேளை இந்த ஒரே காட்சியை வைத்து விரிவான மானிடவியல் முடிவைத் திணிக்காது.
- issue: ἐσφαγμένων என்பதன் வலிமையும் பலி சார்ந்த எதிரொலியும்
  choice: ‘வெட்டிக் கொல்லப்பட்டவர்கள்’ என்று மொழிபெயர்த்தல்.
  alternative: கொல்லப்பட்டவர்கள்; பலியிடப்பட்டவர்கள்
  rationale: ‘கொல்லப்பட்டவர்கள்’ என்பது மூலச்சொல்லின் வன்மையைத் தணிக்கலாம்; ‘பலியிடப்பட்டவர்கள்’ என்பது பலி என்ற கருத்தை நேரடியாகத் தீர்மானித்து விடலாம். தேர்ந்த சொற்றொடர் வன்மையையும் பலிபீடத்தோடு தொடர்புடைய பலி எதிரொலியையும் பாதுகாக்கிறது.
- issue: μαρτυρίαν என்பதிலுள்ள பொருள் பரப்பு
  choice: ‘சாட்சியம்’ என்று மொழிபெயர்த்து மாற்றுப் பொருளை அடிக்குறிப்பில் தருதல்.
  alternative: சாட்சி
  rationale: கிரேக்கச் சொல் சாட்சியமாகக் கூறப்பட்ட உள்ளடக்கத்தையோ சாட்சி பகர்ந்த செயலையோ குறிக்கலாம். முதன்மை உரை ஒன்றைத் தேர்ந்தாலும், அடிக்குறிப்பு உண்மையான சொற்பொருள் பரப்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பலிபீடம்’, ‘ஆன்மாக்கள்’, ‘முத்திரை’ ஆகிய சொற்கள் தரிசன மற்றும் பலி உருவகங்களைப் பாதுகாக்கின்றன. காரணத்தைக் காட்டும் இணை அமைப்பு கிரேக்கத்தின் இருமுறை வரும் διά தொடர்களைப் பிரதிபலிக்கிறது.
