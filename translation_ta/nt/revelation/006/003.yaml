id: REV.6.3
reference: Revelation 6:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξεν τὴν ⸂σφραγῖδα τὴν δευτέραν⸃, ἤκουσα τοῦ δευτέρου ζῴου λέγοντος· Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/003.yaml
  text: And when he opened the second seal[a], I heard the second living creature saying, “Come.”
translation:
  language: ta
  text: அவர் இரண்டாம் முத்திரையைத் திறந்தபோது, இரண்டாம் உயிரினம், “வா”[a] என்று சொல்வதை நான் கேட்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “போ” என்றும் மொழிபெயர்க்கலாம். இதை முன்னே வருவதற்கான அழைப்பாக அல்லாமல், குதிரைவீரனுக்குப் புறப்படச் சொல்லும் கட்டளையாகச் சிலர் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: (தனி இணைப்புச்சொல்லாக வெளிப்படுத்தப்படவில்லை)
  rationale: தமிழில் வாக்கியத் தொடக்கத்தில் ‘மேலும்’ என்று சேர்ப்பது இங்கு இயல்பற்றதாக இருக்கும்; தொடர்ச்சியான நிகழ்வை ‘திறந்தபோது’ என்ற அமைப்பே தெளிவாகக் காட்டுகிறது.
- source_word: ὅτε
  choice: திறந்தபோது
  rationale: நிகழ்வுகளின் காலத் தொடர்பை இயல்பான நவீன தமிழில் துல்லியமாகக் காட்டுகிறது.
- source_word: ἤνοιξεν
  choice: அவர் ... திறந்தபோது
  rationale: ἀνοίγω என்பதன் நேரடிப் பொருளான ‘திற’ என்பதையே வைத்துள்ளது; முத்திரையை ‘உடைத்தார்’ என்ற விளக்கத்தை உரைக்குள் சேர்க்கவில்லை.
- source_word: σφραγῖδα τὴν δευτέραν
  choice: இரண்டாம் முத்திரையை
  rationale: கிரேக்கச் சொல்லமைப்பின் வரிசை முக்கியத்துவத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: ἤκουσα
  choice: நான் கேட்டேன்
  rationale: ἀκούω வினையின் எளிய இறந்தகால நிகழ்வுரைப் பொருளை நேரடியாகத் தருகிறது.
- source_word: τοῦ δευτέρου ζῴου
  choice: இரண்டாம் உயிரினம்
  rationale: வெளிப்படுத்தலில் சிங்காசனத்தைச் சுற்றியுள்ள உயிருள்ள படைப்புகளில் இரண்டாவதைக் குறிக்கிறது. ‘மிருகம்’ என்பது சாதாரண விலங்கு அல்லது θηρίον என்பதோடு குழப்பத்தை ஏற்படுத்தலாம்; ‘ஜீவன்’ இன்றைய பொதுத் தமிழில் குறைவாக இயல்பாக உள்ளது.
- source_word: λέγοντος
  choice: என்று சொல்வதை
  rationale: ‘கேட்டேன்’ என்பதுடன் சார்ந்துள்ள நிகழ்காலப் பெயரெச்சத்தின் செயல்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: Ἔρχου
  choice: வா
  rationale: ἔρχομαι கட்டளை வடிவத்தின் நேரடிப் பொருள் ‘வா’. கட்டளை யாரை நோக்கியது என்பது சூழலில் தெளிவாக இல்லாததால் மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: முத்திரை திறக்கப்படும் காட்சியில் Ἔρχου என்பதன் பொருளும் கட்டளை பெறுபவரும்
  choice: வா
  alternative: போ
  rationale: கிரேக்க வினையின் இயல்பான சொற்பொருள் ‘வா’. இது யோவானை முன்னே வரும்படி அழைக்கிறதா அல்லது குதிரைவீரனைப் புறப்படச் சொல்கிறதா என்பதை மூலவாக்கியம் வெளிப்படையாகத் தீர்மானிக்கவில்லை; ஆகவே முதன்மைப் பொருள் உரையிலும் மாற்றுப் புரிதல் அடிக்குறிப்பிலும் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் எழுவாய் பெயரால் குறிப்பிடப்படாததால், முந்தைய சூழலில் முத்திரையைத் திறப்பவரைக் குறிக்கும் மரியாதை ஒருமை ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது. அடிக்குறி அதன் பொருள் சார்ந்த ‘வா’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
