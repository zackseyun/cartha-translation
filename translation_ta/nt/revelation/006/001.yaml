id: REV.6.1
reference: Revelation 6:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ὅτε ἤνοιξεν τὸ ἀρνίον μίαν ἐκ τῶν ἑπτὰ σφραγίδων, καὶ ἤκουσα ἑνὸς ἐκ τῶν τεσσάρων ζῴων λέγοντος ὡς φωνῇ βροντῆς· ⸀Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/001.yaml
  text: And I saw when the Lamb opened one of the seven seals[a], and I heard one of the four living creatures saying with a voice like thunder, “Come.”
translation:
  language: ta
  text: ஆட்டுக்குட்டியானவர் ஏழு முத்திரைகளில் ஒன்றைத் திறந்தபோது நான் கண்டேன். நான்கு உயிரினங்களில் ஒன்று இடிமுழக்கம் போன்ற குரலில், “வா”[a] என்று சொல்லக் கேட்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்தக் கட்டளை யோவானிடம் அல்லாமல் குதிரைவீரனிடம் சொல்லப்பட்டதாகப் புரிந்துகொண்டால், “புறப்பட்டுச் செல்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀρνίον
  choice: ஆட்டுக்குட்டியானவர்
  rationale: வெளிப்படுத்தலில் இது இயேசுவைக் குறிக்கும் கிறிஸ்துவியல் பட்டப்பெயராகச் செயல்படுகிறது. தமிழ் மரியாதை ஒருமையைப் பயன்படுத்துவது அந்த நபர்ச் சுட்டை இயல்பாக வெளிப்படுத்துகிறது; மூலத்தின் சிறுமைப் பொருளை தேவையின்றி வலியுறுத்தவில்லை.
- source_word: μίαν ἐκ τῶν ἑπτὰ σφραγίδων
  choice: ஏழு முத்திரைகளில் ஒன்று
  rationale: குறிப்பிட்ட ஏழு முத்திரைகளின் தொகுதியிலிருந்து ஒன்றைக் குறிக்கும் பகுதிப்பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ζῴων
  choice: உயிரினங்கள்
  rationale: சாதாரண விலங்குகள் என்று தவறாகப் புரிந்துகொள்ளாமல், அரியணையைச் சூழ்ந்துள்ள உயிருள்ள விண்ணகப் படைப்புகளைக் குறிக்க ஏற்ற, பரந்த தமிழ் சொல்.
- source_word: ὡς φωνῇ βροντῆς
  choice: இடிமுழக்கம் போன்ற குரலில்
  rationale: குரலுக்கும் இடிமுழக்கத்திற்கும் இடையிலான உவமையைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
- source_word: Ἔρχου
  choice: வா
  rationale: ἔρχομαι என்பதன் கட்டளை வடிவுக்கான மிக நேரடியான பொருள். யாரிடம் சொல்லப்படுகிறது என்பதை முதன்மை உரை குறிப்பிடாமல் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: ὅτε
  choice: திறந்தபோது
  rationale: ஆட்டுக்குட்டியானவர் முத்திரையைத் திறக்கும் நேரத்தில் யோவான் கண்டதைச் சுட்டும் காலத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: εἶδον
  choice: நான் கண்டேன்
  rationale: கூடுதல் செயலைச் சேர்க்காமல் இறந்தகாலக் கதை வினையை நேரடியாக வழங்குகிறது.
- source_word: ἤκουσα
  choice: கேட்டேன்
  rationale: ἀκούω என்பதன் இறந்தகாலக் கதைப் பயன்பாட்டை நேரடியாகத் தருகிறது.
- source_word: λέγοντος
  choice: சொல்வதை
  rationale: பேசும் செயலை மிகைப்படுத்தாமல், தமிழ் வாக்கிய அமைப்புக்கு ஏற்றவாறு பங்கேற்புவினையின் பொருளைத் தருகிறது.
theological_decisions:
- issue: Ἔρχου என்ற கட்டளையின் இலக்கும் வலிமையும்
  choice: யாரிடம் சொல்லப்படுகிறது என்று குறிப்பிடாமல் “வா” என மொழிபெயர்த்தல்
  alternative: அது குதிரை வீரனிடம் சொல்லப்பட்டதாகப் புரிந்துகொண்டால் “புறப்பட்டுப் போ” என மொழிபெயர்த்தல்
  rationale: கிரேக்கக் கட்டளை நேரடியாக “வா” எனப் பொருள்படும்; அதன் இலக்கு வெளிப்படையாகக் குறிப்பிடப்படவில்லை. முதன்மை உரையில் அந்தத் தெளிவின்மையை வைத்திருந்து, மாற்றுப் புரிதலை அடிக்குறிப்பில் தருவது மூலத்தின் இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டது. நீளமான கிரேக்க வாக்கியம் தமிழின் இயல்புக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது; “அப்போது” என்பது நிகழ்வுகளின் தொடர்ச்சியைத் தெளிவுபடுத்துகிறது. பட்டப்பெயராகிய “ஆட்டுக்குட்டியானவர்” மரியாதை ஒருமையில் வழங்கப்பட்டுள்ளது.
