id: REV.6.11
reference: Revelation 6:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτοῖς ἑκάστῳ στολὴ λευκή, καὶ ἐρρέθη αὐτοῖς ἵνα ⸀ἀναπαύσονται ἔτι χρόνον ⸀μικρόν, ἕως ⸀πληρωθῶσιν καὶ οἱ σύνδουλοι αὐτῶν καὶ οἱ ἀδελφοὶ ⸀αὐτῶν οἱ μέλλοντες ⸀ἀποκτέννεσθαι ὡς καὶ αὐτοί.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/011.yaml
  text: And a white robe was given to each of them[a], and they were told that they should rest a little longer, until their fellow servants and their brothers, who are about to be killed just as they were[c][b], should also be completed.
translation:
  language: ta
  text: அவர்கள் ஒவ்வொருவருக்கும் ஒரு வெள்ளை அங்கி கொடுக்கப்பட்டது. மேலும், அவர்களைப் போலவே கொல்லப்படவிருக்கும் அவர்களுடைய சக அடிமைகளும் சகோதரர்களும் நிறைவுபெறும்வரை[a], இன்னும் சிறிது காலம் இளைப்பாறும்படி அவர்களுக்குச் சொல்லப்பட்டது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நிறைவுபெறும்வரை’ என்பதற்கு, ‘நிறைவேற்றப்படும்வரை’ அல்லது சூழலின்படி ‘அவர்களுடைய முழு எண்ணிக்கை நிறைவடையும்வரை’ என்றும் பொருள் கொள்ளலாம். கிரேக்கத்தில் ‘எண்ணிக்கை’ என்ற சொல் வெளிப்படையாக இல்லை.
    reason: alternative_reading
  - marker: b
    text: ‘சகோதரர்கள்’ என்பது கிரேக்கத்தில் ஆண்பால் பன்மையாக உள்ளது; இங்கு அது பெண்களையும் உள்ளடக்கிய சக விசுவாசிகளை விரிவாகக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: στολὴ λευκή
  choice: ஒரு வெள்ளை அங்கி
  rationale: στολή என்பது நீண்ட மேலங்கியையோ அங்கியையோ குறிக்கிறது; ‘அங்கி’ இயல்பான, கண்ணியமான தமிழ்ச் சொல். λευκή என்பதற்கு நேரடியாக ‘வெள்ளை’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἑκάστῳ
  choice: அவர்கள் ஒவ்வொருவருக்கும்
  rationale: தனித்தனியாக வழங்கப்பட்டதைத் தெளிவாகக் காட்டும் பகிர்வுப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἐρρέθη αὐτοῖς
  choice: அவர்களுக்குச் சொல்லப்பட்டது
  rationale: கிரேக்கத்தின் செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது; சொன்னவர் குறிப்பிடப்படாத நிலையையும் அப்படியே விடுகிறது.
- source_word: ἀναπαύσονται ἔτι χρόνον μικρόν
  choice: இன்னும் சிறிது காலம் இளைப்பாறும்படி
  rationale: ἀναπαύω என்பதன் ஓய்வு அல்லது இளைப்பாறுதல் என்ற பொருளையும், ἔτι χρόνον μικρόν என்பதன் கால அளவையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πληρωθῶσιν
  choice: நிறைவுபெறும்வரை
  rationale: ‘எண்ணிக்கை’ என்ற சொல்லை மூலத்தில் இல்லாமல் சேர்க்காமல், ‘நிறைவு செய்யப்படுதல்/நிறைவடைதல்’ என்ற விரிவான செயப்பாட்டுப் பொருளைத் தமிழில் சுமுகமாகத் தருகிறது.
- source_word: σύνδουλοι
  choice: உடன் அடிமைகள்
  rationale: ஒரே எஜமானுக்குக் கீழ்ப்பட்ட அடிமைகள் என்ற σύνδουλος சொல்லின் உறவுப் பொருளையும் δοῦλος குடும்பச் சொல்லின் கட்டுப்பட்ட நிலையையும் காக்கிறது.
- source_word: ἀδελφοί
  choice: சகோதரர்கள்
  rationale: மூலத்தின் ஆண்பால் பன்மை வடிவத்தைப் பிரதான உரையில் பாதுகாக்கிறது; சூழலில் இது பெண் விசுவாசிகளையும் உள்ளடக்கக்கூடும் என்பது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: μέλλοντες ἀποκτέννεσθαι
  choice: கொல்லப்படவிருக்கும்
  rationale: வரவிருக்கும் நிகழ்வைச் சுட்டும் μέλλω என்பதையும் கொல்லப்படுதல் என்ற செயப்பாட்டு வடிவத்தையும், தேவையற்ற விதிநிர்ணயப் பொருள் சேர்க்காமல் தருகிறது.
- source_word: ὡς καὶ αὐτοί
  choice: அவர்களைப் போலவே
  rationale: முன்னர் கொல்லப்பட்ட பலிபீடத்தின்கீழுள்ளவர்களோடு செய்யப்படும் ஒப்பீட்டைச் சுருக்கமாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: πληρωθῶσιν என்பது சக அடிமைகளையும் சகோதரர்களையும் குறித்து எந்த வகையான நிறைவைச் சொல்கிறது?
  choice: ‘நிறைவுபெறும்வரை’ என்று பொதுவாக மொழிபெயர்த்தல்
  alternative: ‘அவர்களுடைய முழு எண்ணிக்கை நிறைவடையும்வரை’
  rationale: கிரேக்கத்தில் ‘எண்ணிக்கை’ என்பது வெளிப்படையாக இல்லை. குழு அல்லது எண்ணிக்கை நிறைவடைவது சூழலில் சாத்தியமானாலும், அதை பிரதான உரையில் கட்டாய விளக்கமாகச் சேர்க்காமல் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
- issue: ἀδελφοί என்பது கலப்புப் பாலின விசுவாசக் குழுவைக் குறிக்கக்கூடியது
  choice: பிரதான உரையில் ‘சகோதரர்கள்’; விரிவான பயன்பாட்டை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘சகோதர சகோதரிகள்’ அல்லது ‘உடன்பிறப்புகள்’
  rationale: மூலத்தின் ஆண்பால் பன்மையைப் பாதுகாத்தபடியே, ஆரம்பக் கிறிஸ்தவப் பயன்பாட்டில் பெண்களும் உட்பட சக விசுவாசிகளை இது குறிக்கக்கூடும் என்பதை மறைக்காமல் குறிப்பிடுகிறது.
- issue: σύνδουλοι என்ற δοῦλος குடும்பச் சொல்லின் சமூக மற்றும் இறையியல் வலிமை
  choice: ‘உடன் அடிமைகள்’
  alternative: ‘உடன் ஊழியர்கள்’
  rationale: ஒரே ஆண்டவருக்குச் சொந்தமான, அவருக்குக் கீழ்ப்பட்ட நிலையை ‘அடிமைகள்’ தெளிவாகக் காக்கிறது; மென்மைப்படுத்தி ‘ஊழியர்கள்’ என மாற்றவில்லை.
translation_notes:
  register: நவீன பொதுத் தமிழில் கண்ணியமான வேதாகம நடையைக் கடைப்பிடித்துள்ளது. நீண்ட கிரேக்க வாக்கியம் தமிழில் இரண்டு வாக்கியங்களாக அமைக்கப்பட்டாலும் அதன் தர்க்கத் தொடர்பு பாதுகாக்கப்பட்டுள்ளது. ‘இளைப்பாறுதல்,’ ‘அங்கி,’ ‘உடன் அடிமைகள்’ ஆகியவை புரியக்கூடியதும் மூலச் சொற்களின் வலிமையைத் தக்கவைத்ததும் ஆகும்.
