id: REV.6.6
reference: Revelation 6:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἤκουσα ⸀ὡς φωνὴν ἐν μέσῳ τῶν τεσσάρων ζῴων λέγουσαν· Χοῖνιξ σίτου δηναρίου, καὶ τρεῖς χοίνικες ⸀κριθῶν δηναρίου· καὶ τὸ ἔλαιον καὶ τὸν οἶνον μὴ ἀδικήσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/006.yaml
  text: And I heard what seemed to be a voice in the midst of the four living creatures[a], saying, “A quart of wheat for a denarius, and three quarts of barley for a denarius[c][b]; and do not harm the oil and the wine.”
translation:
  language: ta
  text: நான்கு உயிரினங்களின் நடுவிலிருந்து ஒரு குரல் போன்ற சத்தத்தை நான் கேட்டேன். அது, “ஒரு தினாரியத்திற்கு[a] ஒரு லிட்டர்[b] கோதுமை; ஒரு தினாரியத்திற்கு மூன்று லிட்டர் வாற்கோதுமை; எண்ணெயையும் திராட்சரசத்தையும் சேதப்படுத்தாதே[c]” என்று சொன்னது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஒரு தினாரியம் பொதுவாக ஒரு தொழிலாளியின் ஒரு நாள் கூலியாக இருந்தது; இங்கே கூறப்படும் விலைகள் கடுமையான உணவுப் பற்றாக்குறையைக் காட்டுகின்றன.
    reason: cultural_note
  - marker: b
    text: கிரேக்கத்தில் χοῖνιξ; சுமார் ஒரு லிட்டருக்கு இணையான உலர் அளவு. இது ஒருவருக்கான ஒரு நாள் தானியப் பங்காகப் பொதுவாகக் கருதப்படுகிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, “எண்ணெயுக்கும் திராட்சரசத்துக்கும் தீங்கு செய்யாதே.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς φωνὴν
  choice: ஒரு குரல் போன்ற ஒன்றை
  rationale: ὡς காட்டும் ஒப்புமையையும், பேசியவர் யார் என்பதைத் திட்டவட்டமாக்காமல் யோவான் கேட்ட அனுபவத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: ἐν μέσῳ τῶν τεσσάρων ζῴων
  choice: நான்கு உயிரினங்களின் நடுவிலிருந்து
  rationale: ἐν μέσῳ என்பதன் இடம்சார்ந்த பொருளைக் காக்கிறது. வெளிப்படுத்தலில் அரியணையைச் சூழ்ந்துள்ள தரிசன உயிர்களைக் குறிக்க ‘உயிரினங்கள்’ என்பது ‘மிருகங்கள்’ என்பதைவிடத் தெளிவானது.
- source_word: Χοῖνιξ
  choice: ஒரு லிட்டர்
  rationale: χοῖνιξ என்பது சுமார் ஒரு லிட்டர் கொள்ளளவுள்ள உலர் அளவைச் சுட்டுகிறது. நவீன தமிழ் வாசகருக்குப் புரியும் அண்மையான அளவு பயன்படுத்தப்பட்டு, துல்லியமும் அன்றாட உணவுப் பங்குடனான தொடர்பும் அடிக்குறிப்பில் விளக்கப்படுகின்றன.
- source_word: σίτου
  choice: கோதுமை
  rationale: κριθῶν என்ற வாற்கோதுமையுடன் உள்ள வேறுபாட்டைத் தெளிவாகக் காட்டும் வழக்கமான பொருள்.
- source_word: δηναρίου
  choice: ஒரு தினாரியத்திற்கு
  rationale: விலையைக் குறிக்கும் மரபுத்தொடரை இயல்பான தமிழில் தருகிறது; வரலாற்றுச் சிறப்புடைய நாணயத்தின் பெயர் ஒலிபெயர்க்கப்பட்டு அதன் மதிப்பு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: τρεῖς χοίνικες κριθῶν
  choice: மூன்று லிட்டர் வாற்கோதுமை
  rationale: அளவை ஒரேவிதமாக வழங்கி, வாற்கோதுமையின் ஒப்பீட்டு விலையையும் கடுமையான பற்றாக்குறையையும் தெரிவிக்கிறது.
- source_word: τὸ ἔλαιον
  choice: எண்ணெய்
  rationale: சூழலில் இது பொதுவாக ஒலிவ எண்ணெயைக் குறித்தாலும், மூலத்தின் பொதுவான சொல்லளவைப் பேணுகிறது.
- source_word: τὸν οἶνον
  choice: திராட்சரசம்
  rationale: οἶνος என்பதன் பொருளை இயல்பாகவும் தெளிவாகவும் வழங்குகிறது.
- source_word: μὴ ἀδικήσῃς
  choice: சேதப்படுத்தாதே
  rationale: பொருட்களான எண்ணெய், திராட்சரசம் ஆகியவற்றைப் பாதிக்காதிருப்பதைக் குறிக்கும் இச்சூழலில் ἀδικέω என்பதன் ‘சேதம் விளைவித்தல்’ என்ற பொருளைத் தெளிவாகத் தருகிறது; பரந்த ‘தீங்கு செய்யாதே’ என்பதும் சாத்தியம்.
theological_decisions:
- issue: வெளிப்படுத்தலின் அரியணைத் தரிசனத்தில் ζῴων என்பதன் மொழிபெயர்ப்பு
  choice: உயிரினங்கள்
  alternative: மிருகங்கள்; விலங்குகள்
  rationale: பின்னர் வரும் பகைமைமிக்க ‘மிருகங்களுடன்’ இவற்றைக் குழப்பாமல், அரியணையைச் சூழ்ந்துள்ள உயிருள்ள தரிசனப் படைப்புகளைக் குறிக்கிறது.
- issue: பண்டைய அளவையும் கூலிநாணயத்தையும் எவ்வளவு நவீனப்படுத்துவது
  choice: χοῖνιξ என்பதற்கு அண்மையான நவீன அளவான ‘லிட்டர்’; δηνάριον என்பதற்கு ஒலிபெயர்ப்பான ‘தினாரியம்’
  alternative: இரண்டையும் ஒலிபெயர்த்தல்; இரண்டையும் நவீன மதிப்புகளாக மாற்றுதல்
  rationale: லிட்டர் வாசகருக்கு அளவை உடனடியாகப் புரியவைக்கிறது; தினாரியம் வரலாற்று மற்றும் பொருளாதாரச் சூழலைக் காக்கிறது. அதன் கூலி மதிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: எண்ணெயும் திராட்சரசமும் ஏன் காக்கப்படுகின்றன என்பதன் விளக்கம்
  choice: கட்டளையை மட்டும் மொழிபெயர்த்து அதன் காரணத்தை விளக்காமல் விடுதல்
  alternative: இவை செல்வந்தரின் ஆடம்பரப் பொருட்கள் அல்லது பாதுகாக்கப்பட்ட பயிர்கள் என்று விளக்குதல்
  rationale: மூலவசனம் காரணத்தைச் சொல்லவில்லை. பல்வேறு விளக்கங்களில் ஒன்றை மொழிபெயர்ப்புக்குள் கொண்டு வந்து இறையியல் பதற்றத்தைத் தீர்க்காமல், மூலத்தின் தெளிவின்மையைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், தரிசனத்தின் கண்ணியமான தொனியைப் பேணும் நேரடியான நடை. ‘ஒரு குரல் போன்ற ஒன்று’ என்பது ὡς என்பதின் உண்மையான ஐயத்தை வைத்திருக்கிறது. கட்டளையின் ஒருமை ‘சேதப்படுத்தாதே’ என்று காக்கப்பட்டுள்ளது. பண்டைய அளவு வாசிப்பிற்கு எளிதாக லிட்டராக வழங்கப்பட்டாலும் அதன் அண்மைத் தன்மை அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது.
