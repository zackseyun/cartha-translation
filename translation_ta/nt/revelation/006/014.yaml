id: REV.6.14
reference: Revelation 6:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὁ οὐρανὸς ἀπεχωρίσθη ὡς βιβλίον ἑλισσόμενον, καὶ πᾶν ὄρος καὶ νῆσος ἐκ τῶν τόπων αὐτῶν ἐκινήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/014.yaml
  text: And the sky vanished like a scroll being rolled up[c][b][a], and every mountain and island was moved from its place.
translation:
  language: ta
  text: வானம்[a] சுருட்டப்படும் ஒரு சுருளைப்[b] போல விலகிப்போனது[c]. ஒவ்வொரு மலையும் ஒவ்வொரு தீவும் தத்தம் இடங்களிலிருந்து நகர்த்தப்பட்டன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வானம்’ என்பதற்கு ‘விண்ணகம்’ என்றும் மொழிபெயர்க்கலாம்; இங்கு காணக்கூடிய வான்வெளியே குறிப்பாகத் தோன்றுகிறது.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘சுருள்’ என்பது பழங்காலத்தில் எழுதப் பயன்படுத்தப்பட்டு சுருட்டி வைக்கப்பட்ட ஏடு; நவீனக் கட்டுப்புத்தகம் அல்ல.
    reason: cultural_note
  - marker: c
    text: ‘விலகிப்போனது’ என்பதற்கு ‘பிரிக்கப்பட்டது’ அல்லது ‘பிரிந்து அகன்றது’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் பிரிதல் அல்லது விலகுதல் ஆகிய பொருள்களைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐρανὸς
  choice: வானம்
  rationale: இந்த வெளிப்படுத்தல் காட்சியில் பூமிக்கு மேலே காணப்படும் வான்வெளியே முதன்மையான குறிப்பு. ‘வானம்’ என்பது நவீனத் தமிழில் இயல்பாகவும், கடவுளின் வாசஸ்தலம் குறித்த தேவையற்ற விளக்கத்தைத் தவிர்ப்பதாகவும் உள்ளது.
- source_word: ἀπεχωρίσθη
  choice: விலகிப்போனது
  rationale: இவ்வினைச்சொல் பிரிதல் அல்லது விலகுதல் என்ற பொருளைத் தருகிறது. சுருள் சுருட்டப்படும் உவமையோடு ‘விலகிப்போனது’ இயல்பாகப் பொருந்துகிறது; முற்றிலும் அழிந்தது என்று மிகைப்படுத்தாமல் மூலத்தின் நெகிழ்வையும் காக்கிறது.
- source_word: βιβλίον
  choice: சுருள்
  rationale: முதல் நூற்றாண்டுச் சூழலிலும் சுருட்டப்படும் காட்சியிலும் இது நவீனக் கட்டுப்புத்தகத்தை அல்ல, எழுதப்பட்ட சுருளைக் குறிக்கிறது.
- source_word: ἑλισσόμενον
  choice: சுருட்டப்படும்
  rationale: நிகழ்கால இடைநிலைப் பெயரெச்சத்தின் செயப்படுபொருள் வடிவத்தையும், சுருள் சுருட்டப்படுகிற காட்சியையும் தெளிவாகக் காட்டுகிறது.
- source_word: πᾶν ὄρος καὶ νῆσος
  choice: ஒவ்வொரு மலையும் ஒவ்வொரு தீவும்
  rationale: ஒருமை பெயர்ச்சொற்களுடன் வரும் πᾶν என்பதன் பகிர்ந்தளிக்கும் பொருளைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἐκ τῶν τόπων αὐτῶν
  choice: தத்தம் இடங்களிலிருந்து
  rationale: ‘அவற்றின் இடங்களிலிருந்து’ என்ற கிரேக்கப் பன்மையை இயல்பான தமிழில் காத்து, ஒவ்வொன்றும் தனக்குரிய இடத்திலிருந்து அகற்றப்பட்டதைச் சுட்டுகிறது.
- source_word: ἐκινήθησαν
  choice: நகர்த்தப்பட்டன
  rationale: வெறுமனே குலுங்கின என்பதைக் காட்டிலும், தங்கள் இடங்களிலிருந்து மாற்றப்பட்டன என்ற சூழல்சார் பொருளைச் செயப்பாட்டு வடிவத்தில் தருகிறது.
theological_decisions:
- issue: வெளிப்படுத்தல் காட்சியில் οὐρανός என்பதன் குறிப்பு
  choice: ‘வானம்’ என்று மொழிபெயர்த்தல்
  alternative: ‘விண்ணகம்’ அல்லது ‘பரலோகம்’
  rationale: காட்சியில் காணப்படும் அண்டவெளிக் கலக்கத்தையே முன்னிறுத்தி, கடவுளின் வாசஸ்தலம் மாற்றப்பட்டது என்ற தேவையற்ற கோட்பாட்டு முடிவைச் சேர்க்காமல் இருக்கிறது.
- issue: வானத்திற்கு நிகழும் செயல்
  choice: ἀπεχωρίσθη என்பதை ‘விலகிப்போனது’ என்று மொழிபெயர்த்தல்
  alternative: ‘பிரிக்கப்பட்டது’ அல்லது ‘பிரிந்து அகன்றது’
  rationale: மூல வினைச்சொல்லிலுள்ள பிரிதல்/விலகுதல் என்ற பொருள் வரம்பைக் காக்கிறது. ‘மறைந்துபோனது’ என்று கூறி முழு மறைவை உறுதிப்படுத்துவதையும், காட்சியின் இயங்குமுறையை அளவுக்கு மீறி விளக்குவதையும் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தத்தம் இடங்களிலிருந்து’ என்பது மூலத்தின் பன்மையையும் பகிர்ந்தளிக்கும் கருத்தையும் இயல்பாகக் காக்கிறது.
