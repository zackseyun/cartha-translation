id: REV.6.17
reference: Revelation 6:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὅτι ἦλθεν ἡ ἡμέρα ἡ μεγάλη τῆς ὀργῆς ⸀αὐτῶν, καὶ τίς δύναται σταθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/017.yaml
  text: because the great day of their wrath has come[a], and who is able to stand?
translation:
  language: ta
  text: ஏனெனில், அவர்களுடைய சினத்தின் மாபெரும் நாள் வந்துவிட்டது[a]; யாரால் நிலைநிற்க முடியும்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில விளக்கவுரை சார்ந்த மொழிபெயர்ப்புகளில் ‘அவருடைய சினம்’ என்று உள்ளது. ஆனால் கிரேக்க மூலத்தில் ‘அவர்களுடைய சினம்’ என்றே உள்ளது; இது அரியணையில் அமர்ந்திருப்பவரையும் ஆட்டுக்குட்டியானவரையும் சேர்த்துக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட அச்சத்திற்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்தும் இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: ἦλθεν
  choice: வந்துவிட்டது
  rationale: நிகழ்வு வந்து சேர்ந்துவிட்டதையும் அதன் விளைவு இப்போது நிலவுவதையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἡ ἡμέρα ἡ μεγάλη
  choice: மாபெரும் நாள்
  rationale: அந்த நாளின் தனிச்சிறப்பையும் இறுதித்தீர்ப்புக்குரிய பெருமுக்கியத்துவத்தையும் இயல்பான, கண்ணியமான தமிழில் தக்கவைக்கிறது.
- source_word: τῆς ὀργῆς
  choice: சினத்தின்
  rationale: சாதாரண எரிச்சலைவிட வலிமையான, தீர்ப்பைச் சார்ந்த கோபத்தை ‘சினம்’ சுருக்கமாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது; பழமையான ‘கோபாக்கினை’ தவிர்க்கப்படுகிறது.
- source_word: αὐτῶν
  choice: அவர்களுடைய
  rationale: கிரேக்க மூலத்தின் பன்மையைத் தக்கவைத்து, முந்தைய வசனத்தில் குறிப்பிடப்பட்ட அரியணையில் அமர்ந்திருப்பவரையும் ஆட்டுக்குட்டியானவரையும் சுட்டுகிறது.
- source_word: τίς
  choice: யாரால்
  rationale: திறனைப் பற்றிய வினாவைத் தமிழில் இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: δύναται
  choice: முடியும்
  rationale: ஒருவருக்கு அதற்கான ஆற்றல் அல்லது திறன் உள்ளதா என்ற பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: σταθῆναι
  choice: நிலைநிற்க
  rationale: அடிப்படைப் பொருளான ‘நிற்றல்’ என்பதையும், தீர்ப்பின் முன் தாங்கி நிற்றல் என்ற சூழல்சார் உட்பொருளையும் விரிவாக்கமின்றித் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘சினம்’ என்பதுடன் வரும் பன்மைப் பிரதிப்பெயர் அரியணையில் அமர்ந்திருப்பவரையும் ஆட்டுக்குட்டியானவரையும் குறிப்பது
  choice: ‘அவர்களுடைய சினம்’ என்ற பன்மை அமைப்பைத் தக்கவைத்தல்
  alternative: ஒருமைத் தெய்வீகச் செயலோடு ஒத்திசைத்து ‘அவருடைய சினம்’ என்று மொழிபெயர்த்தல்
  rationale: கிரேக்கத்தில் αὐτῶν என்பது வெளிப்படையாகப் பன்மையில் உள்ளது; அது முந்தைய வசனத்தின் இரு நபர்களையும் சுட்டுகிறது. இலக்கண மற்றும் இறையியல் இழுவிசையை மொழிபெயர்ப்பு தீர்த்துவிடாமல், மூலத்திலுள்ளபடியே பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘கோபாக்கினை’ போன்ற பழமையான சொல்லுக்குப் பதிலாக தீர்ப்பின் வலிமையைத் தக்கவைக்கும் ‘சினம்’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் சொல்லமைப்பை இயல்பான தமிழுக்கேற்ப அமைத்தாலும் அதன் பன்மை மற்றும் இறையியல் இழுவிசை பாதுகாக்கப்பட்டுள்ளது.
