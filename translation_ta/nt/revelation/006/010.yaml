id: REV.6.10
reference: Revelation 6:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἔκραξαν φωνῇ μεγάλῃ λέγοντες· Ἕως πότε, ὁ δεσπότης ὁ ἅγιος καὶ ἀληθινός, οὐ κρίνεις καὶ ἐκδικεῖς τὸ αἷμα ἡμῶν ἐκ τῶν κατοικούντων ἐπὶ τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/010.yaml
  text: And they cried out with a loud voice[a], saying, “How long, Master, holy and true[b], will you refrain from judging and avenging our blood on those who dwell on the earth?”
translation:
  language: ta
  text: அவர்கள் உரத்த குரலில் கூப்பிட்டு, “பரிசுத்தரும் உண்மையானவருமான எஜமானரே[a], எங்கள் இரத்தத்திற்காகப் பூமியில் குடியிருப்பவர்களை[b] நியாயந்தீர்த்து பழிவாங்காமல் இன்னும் எவ்வளவு காலம் இருப்பீர்?” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பேரதிகாரமுள்ள ஆண்டவரே” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்கப் பட்டம் δεσπότης (despotēs); அது முழுமையான அதிகாரத்தையும் உரிமையையும் வலியுறுத்துகிறது; மேலும் κύριος (kyrios, “ஆண்டவர்”) என்பதிலிருந்து வேறுபட்டது.
    reason: lexical_alternative
  - marker: b
    text: “பூமியில் குடியிருப்பவர்களுக்கு எதிராக” என்றும் பொருள் கொள்ளலாம். இங்குள்ள கிரேக்கத் தொடர் பழிவாங்கும் செயலின் இலக்கையையோ அதன் மூலத் தொடர்பையையோ குறிக்கக்கூடும்; “பூமியில் குடியிருப்பவர்கள்” என்பது வெளிப்படுத்தின விசேஷத்தில் மீண்டும் வரும் கருப்பொருள் சார்ந்த அடையாளமாகும்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔκραξαν φωνῇ μεγάλῃ
  choice: உரத்த குரலில் கூப்பிட்டு
  rationale: கூப்பிடுதலின் வலிமையையும் அவசரத்தையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; φωνῇ μεγάλῃ என்பதிலுள்ள குரல் உருவகத்தையும் தக்கவைக்கிறது.
- source_word: Ἕως πότε
  choice: இன்னும் எவ்வளவு காலம்
  rationale: தாமதமாகும் இறைநீதியை நோக்கிய புலம்பல் கலந்த வேண்டுகோளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: δεσπότης
  choice: எஜமானரே
  rationale: முழுமையான அதிகாரத்தையும் உரிமையையும் வலியுறுத்தும் δεσπότης என்பதை, κύριος என்பதற்குரிய வழக்கமான ‘ஆண்டவர்’ என்பதிலிருந்து வேறுபடுத்திக் காட்டுகிறது.
- source_word: ἅγιος καὶ ἀληθινός
  choice: பரிசுத்தரும் உண்மையுள்ளவருமான
  rationale: இரு பண்புகளையும் இறை அழைப்போடு இயல்பாக இணைத்து, பரிசுத்தத்தையும் நம்பத்தகுந்த உண்மைத் தன்மையையும் பாதுகாக்கிறது.
- source_word: οὐ κρίνεις καὶ ἐκδικεῖς
  choice: நியாயந்தீர்த்து … பழிவாங்காமல் இன்னும் எவ்வளவு காலம் இருப்பீர்?
  rationale: வடிவில் நிகழ்கால வினைகளாக இருந்தாலும், தாமதமாகும் செயலைக் குறித்த முறையீடாக அவை செயல்படுகின்றன. ‘பழிவாங்கு’ என்பது நீதிசார்ந்த பதிலீட்டின் கடுமையை மென்மைப்படுத்தாமல் தக்கவைக்கிறது.
- source_word: τὸ αἷμα ἡμῶν
  choice: எங்கள் இரத்தத்திற்காக
  rationale: வன்முறையான மரணத்தைக் குறிக்கும் வேதாகம இரத்த உருவகத்தைப் பாதுகாக்கிறது; தமிழில் பழிவாங்குதலுக்கான காரணத்தைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: τῶν κατοικούντων ἐπὶ τῆς γῆς
  choice: பூமியில் குடியிருப்பவர்களை
  rationale: வெளிப்படுத்தின விசேஷத்தில் மீண்டும் வரும் கருப்பொருள் சார்ந்த அடையாளச் சொல்லை சுருக்காமல் தக்கவைக்கிறது.
theological_decisions:
- issue: δεσπότης என்ற இறை அழைப்பை மொழிபெயர்த்தல்
  choice: எஜமானரே
  alternative: பேரதிகாரமுள்ள ஆண்டவரே / ஆண்டவரே
  rationale: மூலத்தில் κύριος அல்ல, δεσπότης பயன்படுத்தப்பட்டுள்ளது. எனவே அதன் உரிமை மற்றும் முழு அதிகார நுணுக்கத்தையும் சொல் வேறுபாட்டையும் பாதுகாக்க ‘எஜமானரே’ தேர்ந்தெடுக்கப்பட்டது.
- issue: இரத்தத்திற்காகப் பழிவாங்குமாறு இரத்தசாட்சிகள் விடுக்கும் வேண்டுகோள்
  choice: நியாயந்தீர்த்து, எங்கள் இரத்தத்திற்காக அவர்களைப் பழிவாங்காமல்
  alternative: நியாயந்தீர்த்து, எங்களுக்கு நீதி வழங்காமல்
  rationale: மூலம் நீதித்தீர்ப்பையும் பதிலீட்டையும் வெளிப்படையாகக் கோருகிறது. அந்த இறையியல் பதற்றத்தை மென்மைப்படுத்தாமல், இது கடவுளின் நீதிச் செயலுக்கான வேண்டுகோள் என்பதைக் கட்டமைப்பு காட்டுமாறு மொழிபெயர்க்கப்பட்டது.
- issue: ἐκ என்பதன் இலக்கண உறவு
  choice: பூமியில் குடியிருப்பவர்களை … அவர்களைப் பழிவாங்கு
  alternative: பூமியில் குடியிருப்பவர்களுக்கு எதிராக / அவர்களிடமிருந்து பழிவாங்கு
  rationale: ἐκ இங்கு பழிவாங்குதல் செலுத்தப்படும் நபர்களையோ அதற்கான மூலத் தொடர்பையோ சுட்டலாம். முதன்மை உரை இயல்பான தமிழில் அவர்களைச் செயலின் இலக்காகக் காட்டுகிறது; மாற்று இலக்கண நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வழிபாட்டு வாசிப்புக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘நியாயந்தீர்த்து’, ‘பரிசுத்தர்’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; வாக்கிய ஓட்டம் இயல்பாக இருக்க வினாக் கட்டமைப்பு தமிழ்முறைக்கேற்ப மாற்றப்பட்டுள்ளது.
