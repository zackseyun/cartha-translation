revisions:
- from: அவர்கள் உரத்த குரலில் கூப்பிட்டு, “பரிசுத்தரும் உண்மையுள்ளவருமான எஜமானரே[a], பூமியில் குடியிருப்பவர்களை[b] நியாயந்தீர்த்து, எங்கள் இரத்தத்திற்காக அவர்களைப் பழிவாங்காமல் இன்னும் எவ்வளவு காலம் இருப்பீர்?” என்றார்கள்.
  to: அவர்கள் உரத்த குரலில் கூப்பிட்டு, “பரிசுத்தரும் உண்மையானவருமான எஜமானரே[a], எங்கள் இரத்தத்திற்காகப் பூமியில் குடியிருப்பவர்களை[b] நியாயந்தீர்த்து பழிவாங்காமல் இன்னும் எவ்வளவு காலம் இருப்பீர்?” என்றார்கள்.
  rationale: 'The revision changes only two points: it renders ἀληθινός as “உண்மையானவர்” rather than the potentially ‘faithful’ sense of “உண்மையுள்ளவர்,” and it moves “எங்கள் இரத்தத்திற்காக” to govern the coordinated acts of judging and avenging. The verse’s force, ambiguity regarding ἐκ, register, and distinction between δεσπότης and κύριος are retained.'
