id: REV.6.4
reference: Revelation 6:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ἐξῆλθεν ἄλλος ἵππος πυρρός, καὶ τῷ καθημένῳ ἐπ’ αὐτὸν ἐδόθη αὐτῷ λαβεῖν τὴν εἰρήνην ἐκ τῆς γῆς ⸀καὶ ἵνα ἀλλήλους ⸀σφάξουσιν, καὶ ἐδόθη αὐτῷ μάχαιρα μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/004.yaml
  text: And another horse came out[a], fiery red; and to the one sitting on it, it was given to take peace from the earth, so that they would slaughter one another[c][b], and a great sword was given to him.
translation:
  language: ta
  text: வேறொரு நெருப்புப்போல் சிவந்த குதிரை புறப்பட்டு வந்தது[a]. அதன்மேல் அமர்ந்திருந்தவனுக்குப் பூமியிலிருந்து சமாதானத்தை அகற்றவும்[b], மக்கள் ஒருவரையொருவர் படுகொலை செய்யும்படியாகவும்[c] கொடுக்கப்பட்டது. மேலும், பெரிய வாள் ஒன்று அவனுக்குக் கொடுக்கப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சிவந்த குதிரை’ என்றும் மொழிபெயர்க்கலாம். πυρρός என்ற கிரேக்கச் சொல் குறிப்பாக நெருப்பைப் போன்ற சிவப்பு நிறத்தை உணர்த்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘பூமி’ என்பதற்குப் பதிலாக ‘நிலம்’ என்றும் மொழிபெயர்க்கலாம். γῆ என்ற கிரேக்கச் சொல் இரு பொருள்களையும் தரக்கூடும்; இங்கு வெளிப்படுத்துதல் நூலின் உலகளாவிய திருக்காட்சிச் சூழலுக்கு ‘பூமி’ என்பது பொருத்தமாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘படுகொலை செய்ய’ என்று மொழிபெயர்க்கப்பட்டுள்ள வினைச்சொல், பொதுவான ‘கொல்’ என்பதைவிட வலிமையானது; அது வன்முறையான இரத்தப்பொழிவை உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος
  choice: வேறொரு
  rationale: முந்தைய குதிரையிலிருந்து வேறுபட்ட, வரிசையில் அடுத்து வரும் குதிரையைக் குறிக்கிறது.
- source_word: ἵππος πυρρός
  choice: நெருப்புப்போல் சிவந்த குதிரை
  rationale: πυρρός என்பது வெறுமனே சிவப்பு என்பதைவிட நெருப்பைப் போன்ற செந்நிறத்தை உணர்த்துகிறது; இந்த உயிரோட்டமான நிறக்காட்சியை இயல்பான தமிழில் காக்கிறது.
- source_word: τῷ καθημένῳ ἐπ’ αὐτὸν
  choice: அதன்மேல் அமர்ந்திருந்தவனுக்கு
  rationale: ‘அதன்மேல் அமர்ந்திருப்பவன்’ என்ற பங்கேற்புவினை அமைப்பைத் தக்கவைத்து, விளக்கமளிக்கும் ‘குதிரைவீரன்’ போன்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: ἐδόθη αὐτῷ
  choice: அவனுக்கு அனுமதி அளிக்கப்பட்டது / அவனுக்குக் கொடுக்கப்பட்டது
  rationale: முதல் இடத்தில் தமிழின் இயல்புக்காக செயலைச் செய்வதற்கான அனுமதி என்ற உள்ளார்ந்த பொருள் வெளிப்படுத்தப்படுகிறது; இறுதியில் வாள் நேரடியாகக் கொடுக்கப்படுவதால் ‘கொடுக்கப்பட்டது’ பயன்படுத்தப்படுகிறது. இரண்டிலும் கொடுத்தவர் பெயரிடப்படாமல் செயப்பாட்டு வடிவம் காக்கப்படுகிறது.
- source_word: λαβεῖν τὴν εἰρήνην ἐκ τῆς γῆς
  choice: பூமியிலிருந்து சமாதானத்தை அகற்ற
  rationale: இங்கு λαμβάνω என்பது சமாதானத்தை நீக்குதல் என்ற பொருளில் வருகிறது. வெளிப்படுத்தின விசேஷத்தின் உலகளாவிய திருக்காட்சிச் சூழலுக்கு ‘பூமி’ பொருந்துகிறது; ஆயினும் γῆ என்பதற்கு ‘நிலம்’ என்றும் பொருள் இருக்கலாம்.
- source_word: ἵνα ἀλλήλους σφάξουσιν
  choice: ஒருவரையொருவர் வெட்டிக் கொல்லும்படி செய்ய
  rationale: σφάζω சாதாரணமாகக் ‘கொல்வது’ என்பதைக் காட்டிலும் வன்முறையான இரத்தப்பொழிவை உணர்த்துகிறது. ‘வெட்டிக் கொல்ல’ அந்த வலிமையை இயல்பான தமிழில் எடுத்துரைக்கிறது; ἵνα வெளிப்படுத்தும் நோக்கம் அல்லது விளைவு தீர்மானிக்கப்படாமல் ‘கொல்லும்படி’ என வழங்கப்படுகிறது.
- source_word: μάχαιρα μεγάλη
  choice: பெரிய வாள்
  rationale: μάχαιρα வாள் அல்லது பெரிய கத்தி/குறுவாளைக் குறிக்கலாம்; இந்தத் திருக்காட்சியில் ‘வாள்’ தெளிவான இயல்பான இணைச்சொல், μεγάλη என்பதையும் ‘பெரிய’ நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: இருமுறை வரும் ἐδόθη என்ற செயப்பாட்டு வடிவம்
  choice: கொடுப்பவர் யார் என்று பெயரிடாமல் செயப்பாட்டு வடிவத்தைத் தக்கவைத்தல்
  alternative: ‘கடவுள் அவனுக்குக் கொடுத்தார்’ அல்லது ‘அதிகாரம் கொடுக்கப்பட்டது’ என்று மொழிபெயர்த்தல்
  rationale: மூலவசனம் கொடுப்பவரைப் பெயரிடவில்லை. செயப்பாட்டு வடிவம் இறையாண்மையுள்ள அனுமதியை மறைமுகமாக உணர்த்தக்கூடும்; ஆனால் அதை வெளிப்படையாக ‘கடவுள்’ எனவோ, மூலத்தில் இல்லாத ‘அதிகாரம்’ எனும் பெயர்ச்சொல்லாலோ நிரப்பாமல் இருப்பது இலக்கிய மற்றும் இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
- issue: ἵνα கூறும் நோக்கம் அல்லது விளைவு
  choice: ‘ஒருவரையொருவர் வெட்டிக் கொல்லும்படி’ என்ற இரண்டுக்கும் இடமளிக்கும் அமைப்பு
  alternative: முழுமையாக ‘இதன் விளைவாக’ அல்லது ‘இந்த நோக்கத்திற்காக’ என்று தீர்மானித்தல்
  rationale: இச்சூழலில் ἵνα நோக்கத்தையும் விளைவையும் உணர்த்தக்கூடும். தமிழ் அமைப்பு அந்தத் தொடர்பைக் காட்டுகிறது; ஆனால் ஒரே விளக்கத்துக்குள் அதைச் சுருக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான திருவிவிலிய நடையில் வடிவமைக்கப்பட்டுள்ளது. ‘நெருப்புப்போல் சிவந்த’ என்பது காட்சியின் vivid தன்மையை இயல்பாகக் காக்கிறது. ‘அதன்மேல் அமர்ந்திருந்தவன்’ மூலத்தின் உருவாக்கத்தைத் தக்கவைக்கிறது. ‘அனுமதி அளிக்கப்பட்டது’ என்பது தமிழில் இயல்பாக இருக்கத் தேர்ந்தெடுக்கப்பட்டாலும் கொடுப்பவரை வெளிப்படையாக அடையாளப்படுத்தாது; இறுதி வாக்கியத்தில் ‘கொடுக்கப்பட்டது’ என்ற மீளுருவாக்கம் பாதுகாக்கப்பட்டுள்ளது.
