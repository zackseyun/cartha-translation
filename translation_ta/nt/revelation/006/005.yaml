id: REV.6.5
reference: Revelation 6:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξε τὴν σφραγῖδα τὴν τρίτην, ἤκουσα τοῦ τρίτου ζῴου λέγοντος· Ἔρχου. καὶ ⸀εἶδον, καὶ ἰδοὺ ἵππος μέλας, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ἔχων ζυγὸν ἐν τῇ χειρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/005.yaml
  text: And when he opened the third seal[a], I heard the third living creature saying, “Come.” And I looked, and behold, a black horse[b], and the one sitting on it had a pair of scales in his hand.
translation:
  language: ta
  text: அவர் மூன்றாம் முத்திரையைத் திறந்தபோது, மூன்றாவது உயிரினம், “வா”[a] என்று சொல்வதைக் கேட்டேன். நான் பார்த்தேன்; இதோ, ஒரு கறுப்புக் குதிரை! அதன்மேல் அமர்ந்திருந்தவன் தன் கையில் ஒரு தராசை[b] வைத்திருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இங்கே வா” என்றும் மொழிபெயர்க்கலாம். இந்தக் கட்டளை யோவானை நோக்கிச் சொல்லப்பட்டதா, அல்லது குதிரையையும் அதன்மேல் அமர்ந்திருப்பவனையும் வருமாறு அழைக்கிறதா என்பது தெளிவாக இல்லை.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “எடைத் துலாக்கோல்”; கிரேக்கச் சொல் “நுகத்தடி” என்றும் பொருள்படலாம். இச்சூழலில் உணவை அளவிட்டு வழங்கப் பயன்படும் தராசையே பெரும்பாலும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνοιξε
  choice: திறந்தபோது
  rationale: முத்திரையைத் திறப்பதைக் குறிக்கும் இயல்பான, நேரடியான தமிழ் சொல்லாக்கம்.
- source_word: σφραγῖδα τὴν τρίτην
  choice: மூன்றாம் முத்திரையை
  rationale: மூலத்தின் வரிசை எண்ணையும் பொருளையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ζῴου
  choice: உயிருள்ள படைப்பு
  rationale: வெளிப்படுத்தின விசேஷத்தின் அரியணைச் சூழலில் உள்ள உயிருள்ள வானுலகப் படைப்பைக் குறிக்கிறது; சாதாரண விலங்கு எனத் தவறாகப் புரியாமல் இருக்க இச்சொல்லாக்கம் உதவுகிறது.
- source_word: Ἔρχου
  choice: வா
  rationale: கிரேக்க ஒருமை ஏவலைச் சுருக்கமாகவும் வலிமையாகவும் தருகிறது; யாரை நோக்கிச் சொல்லப்படுகிறது என்பதை உரையில் நிர்ணயிக்கவில்லை.
- source_word: εἶδον, καὶ ἰδοὺ
  choice: நான் பார்த்தேன்; இதோ
  rationale: காட்சியின் திடீர் வெளிப்பாட்டையும் ἰδού என்பதன் கவன ஈர்ப்பையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: ἵππος μέλας
  choice: ஒரு கறுப்புக் குதிரை
  rationale: காட்சியில் முக்கியமான நிறக் குறியீட்டை நேரடியாக மொழிபெயர்க்கிறது.
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: அதன்மேல் அமர்ந்திருந்தவன்
  rationale: மூலத்தின் பெயரெச்சத் தொடரை ‘குதிரைவீரன்’ என்று சுருக்காமல் நெருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: ζυγὸν
  choice: ஒரு தராசை
  rationale: அடுத்த வசனத்தின் உணவு அளவீட்டுச் சூழலில் ζυγός என்பது நுகத்தடியைவிட எடைபோடும் தராசைக் குறிக்கிறது.
- source_word: ἐν τῇ χειρὶ αὐτοῦ
  choice: தன் கையில்
  rationale: பொருள் தெளிவான, இயல்பான தமிழ் பிரதிபெயர்ச்சொல் அமைப்பு.
theological_decisions:
- issue: Ἔρχου என்ற கட்டளையின் இலக்கு
  choice: யாரை நோக்கிச் சொல்லப்பட்டது என்பதைக் குறிப்பிடாமல் “வா” என மொழிபெயர்த்தல்
  alternative: யோவானை அருகே வருமாறு அழைத்தல்; அல்லது குதிரையையும் அதன்மேல் அமர்ந்திருப்பவனையும் புறப்பட்டு வருமாறு அழைத்தல்
  rationale: கிரேக்கத்தில் கட்டளையின் இலக்கு வெளிப்படையாகக் கூறப்படவில்லை; ஆகவே மொழிபெயர்ப்பு அந்த உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
- issue: ζυγός என்பதன் பொருள்
  choice: தராசு
  alternative: நுகத்தடி
  rationale: உடனடுத்த வசனத்தில் உணவுப் பொருட்கள் அளவிட்டு வழங்கப்படுவதால், இங்கு எடைபோடும் தராசு என்பதே சூழலுக்கு ஏற்ற பொருள்; மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. “இதோ” என்பது வெளிப்படுத்தல் காட்சியின் திடீர், உயிரோட்டமான தன்மையைத் தக்கவைக்கிறது; “அதன்மேல் அமர்ந்திருந்தவன்” என்பது மூலத்தின் வடிவத்துக்கு நெருக்கமானது.
