id: REV.6.16
reference: Revelation 6:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ λέγουσιν τοῖς ὄρεσιν καὶ ταῖς πέτραις· Πέσετε ἐφ’ ἡμᾶς καὶ κρύψατε ἡμᾶς ἀπὸ προσώπου τοῦ καθημένου ἐπὶ τοῦ θρόνου καὶ ἀπὸ τῆς ὀργῆς τοῦ ἀρνίου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/016.yaml
  text: and they say to the mountains and to the rocks[a], “Fall on us and hide us from the face of the One seated on the throne and from the wrath of the Lamb,”
translation:
  language: ta
  text: அவர்கள் மலைகளிடமும் பாறைகளிடமும், “எங்கள்மேல் விழுங்கள்; அரியணையில் அமர்ந்திருப்பவரின் முகத்திலிருந்தும்[a] ஆட்டுக்குட்டியானவரின் கோபத்திலிருந்தும் எங்களை மறைத்துவிடுங்கள்” என்று சொல்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அரியணையில் அமர்ந்திருப்பவரின் முன்னிலையிலிருந்தும்.’
    reason: πρόσωπον என்பதற்கு நேரடியாக ‘முகம்’ என்றும், இச்சூழலில் பொருள்சார்ந்து ‘முன்னிலை’ என்றும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: λέγουσιν
  choice: சொல்கிறார்கள்
  rationale: நிகழ்கால வினை வடிவத்தை வெளிப்படுத்தி, வெளிப்படுத்தின விசேஷத்தின் காட்சிக்கு உரிய உடனடித் தன்மையைப் பேணுகிறது.
- source_word: ὄρεσιν
  choice: மலைகளிடமும்
  rationale: ὄρος என்பதன் வழக்கமான பொருள் ‘மலை’; காட்சியின் வலிமையைக் குறைக்கும் ‘குன்றுகள்’ என்பதைக் காட்டிலும் இது துல்லியமானது.
- source_word: πέτραις
  choice: பாறைகளிடமும்
  rationale: πέτρα என்பது பெரிய பாறை அல்லது பாறைத் தொகுதியைக் குறிக்கிறது; ‘பாறைகள்’ என்பது இயல்பானதும் காட்சிக்கு ஏற்றதுமான சொல்லாகும்.
- source_word: Πέσετε ἐφ’ ἡμᾶς
  choice: எங்கள்மேல் விழுங்கள்
  rationale: பன்மை ஏவல் வடிவத்தின் நேரடியான, அவசரமான கட்டளையைத் தெளிவாகப் பேணுகிறது.
- source_word: κρύψατε ἡμᾶς
  choice: எங்களை மறைத்துவிடுங்கள்
  rationale: பன்மை ஏவலின் தீவிரத்தையும், தங்களை முற்றிலும் கண்ணுக்குப் புலப்படாமல் செய்யுமாறு கோரும் கருத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: ἀπὸ προσώπου
  choice: முகத்திலிருந்தும்
  rationale: πρόσωπον என்பதன் நேரடிப் பொருளான ‘முகம்’ என்பதைப் பேணி, தெய்வீக முகத்தை எதிர்கொள்ளும் உயிரோட்டமான படிமத்தைத் தக்கவைக்கிறது; ‘முன்னிலையிலிருந்து’ என்பது பொருள்சார் மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: அரியணையில் அமர்ந்திருப்பவரின்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்பு வடிவத்தையும், அவர் தொடர்ந்து அரியணையில் வீற்றிருக்கும் நிலையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὀργῆς
  choice: கடுங்கோபத்திலிருந்தும்
  rationale: இறுதித் தீர்ப்பின் சூழலில் ὀργή குறிக்கும் தீவிரமான நியாயத்தீர்ப்புக் கோபத்தை, சாதாரண ‘கோபம்’ என்பதைக் காட்டிலும் வலிமையாக வெளிப்படுத்துகிறது.
- source_word: τοῦ ἀρνίου
  choice: ஆட்டுக்குட்டியானவரின்
  rationale: வெளிப்படுத்தின விசேஷத்தில் கிறிஸ்துவைக் குறிக்கும் நிலையான உருவகப் பட்டத்தைப் பேணுவதோடு, தமிழில் ஒருவரைக் குறிக்கும் மரியாதையான தன்மையையும் தெளிவாக்குகிறது.
theological_decisions:
- issue: வெளிப்படுத்தல் காட்சியில் நியாயத்தீர்ப்புடன் தொடர்புடைய இரு ஆளுமைகளை மொழிபெயர்த்தல்
  choice: ‘அரியணையில் அமர்ந்திருப்பவர்’ மற்றும் ‘ஆட்டுக்குட்டியானவர்’ ஆகிய இருவரையும் வேறுபட்டவர்களாகவும், ஒருங்கிணைந்து அச்சத்திற்கும் நியாயத்தீர்ப்பிற்கும் காரணமானவர்களாகவும் வைத்திருத்தல்
  alternative: இரு குறிப்புகளையும் பொதுவாகக் கடவுளை மட்டும் குறிக்கும் ஒரே குறிப்பாகச் சுருக்குதல், அல்லது ‘ஆட்டுக்குட்டியானவரின் கடுங்கோபம்’ என்ற முரண்தோற்றத்தை மென்மைப்படுத்துதல்
  rationale: 'கிரேக்கத்தில் ἀπό என்பதற்குப் பின் இணைக்கப்பட்ட இரண்டு வேறுபட்ட மரபுத்தொடர்கள் உள்ளன: ஒன்று அரியணையில் அமர்ந்திருப்பவரையும் மற்றொன்று ஆட்டுக்குட்டியானவரையும் குறிக்கிறது. பலிக்குரிய மென்மையின் உருவகமாக இருக்கும் ஆட்டுக்குட்டியானவரே இறுதித் தீர்ப்பின் கடுங்கோபத்தையும் வெளிப்படுத்துகிறார் என்ற திட்டமிட்ட இறையியல் பதற்றத்தை மொழிபெயர்ப்பு தீர்த்துவிடாமல் பேணுகிறது.'
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வெளிப்படுத்தல் நூலின் கண்ணியமான, தீவிரமான காட்சிநடையைப் பேணும் வகையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. நேரடி அழைப்பையும் பன்மை ஏவல் வடிவங்களையும் தெளிவாக்க நிறுத்தக்குறிகள் பயன்படுத்தப்பட்டுள்ளன.
