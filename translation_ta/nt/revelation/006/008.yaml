id: REV.6.8
reference: Revelation 6:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ⸂εἶδον, καὶ⸃ ἰδοὺ ἵππος χλωρός, καὶ ὁ καθήμενος ἐπάνω αὐτοῦ ὄνομα αὐτῷ ὁ Θάνατος, καὶ ὁ ᾅδης ἠκολούθει ⸂μετ’ αὐτοῦ⸃, καὶ ἐδόθη ⸀αὐτοῖς ἐξουσία ἐπὶ τὸ τέταρτον τῆς γῆς, ἀποκτεῖναι ἐν ῥομφαίᾳ καὶ ἐν λιμῷ καὶ ἐν θανάτῳ καὶ ὑπὸ τῶν θηρίων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/008.yaml
  text: And I looked, and behold, a pale green horse, and the name of the one seated on it was Death, and Hades was following with him. And authority was given to them over a fourth of the earth, to kill with sword and with famine and with pestilence and by the wild beasts of the earth.
translation:
  language: ta
  text: நான் பார்த்தேன்; இதோ, வெளிறிய பச்சை நிறக் குதிரை![a] அதன்மேல் அமர்ந்திருந்தவனுடைய பெயர் “மரணம்”; இறந்தோர் உலகமும் அவனுடன் பின்தொடர்ந்து வந்தது. பூமியின் நான்கில் ஒரு பகுதியின்மேல் அதிகாரம் அவர்களுக்குக் கொடுக்கப்பட்டது—வாளாலும் பஞ்சத்தாலும் கொள்ளைநோயாலும்[b] பூமியின் காட்டு விலங்குகளாலும் கொல்லும்படி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “வெளிறிய ஒரு குதிரை.” χλωρός என்ற கிரேக்கச் சொல் பச்சை அல்லது பச்சை கலந்த வெளிறிய நிறத்தை நேரடியாகக் குறிக்கிறது; இங்கு அது நோயுற்ற உடலின் வெளிறிய தோற்றத்தையும் உணர்த்தலாம்.'
    reason: lexical_alternative
  - marker: b
    text: 'அல்லது: “மரணத்தாலும்.” இங்குள்ள θάνατος என்பதற்கு நேரடியாக “மரணம்” என்று பொருள். ஆனால் எசேக்கியேல் 14 போன்ற பழைய ஏற்பாட்டு நியாயத்தீர்ப்புப் பட்டியல்களின் பின்னணியில் இது கொள்ளைநோயைக் குறிக்கலாம்.'
    reason: alternative_reading
lexical_decisions:
- source_word: χλωρός
  choice: வெளிறிய பச்சை நிறமுள்ள
  rationale: இச்சொல்லின் பச்சை அல்லது பச்சை கலந்த வெளிறிய நிறம் என்ற அடிப்படைப் பொருளையும், இச்சூழலில் அது உணர்த்தும் நோயுற்ற உடலின் அச்சமூட்டும் வெளிறிய தோற்றத்தையும் தக்கவைக்கிறது.
- source_word: ὁ καθήμενος ἐπάνω αὐτοῦ
  choice: அதன்மேல் அமர்ந்திருந்தவன்
  rationale: கிரேக்கப் பங்கேற்புவினைத் தொடரை இயல்பான தமிழில் நேரடியாகப் பிரதிபலிக்கிறது; “குதிரைவீரன்” என்று மூலத்தில் இல்லாத பெயர்ச்சொல்லைச் சேர்ப்பதில்லை.
- source_word: ὄνομα αὐτῷ ὁ Θάνατος
  choice: அதன்மேல் அமர்ந்திருந்தவனுடைய பெயர் “மரணம்”
  rationale: பெயரிடும் கிரேக்க அமைப்பைத் தெளிவாகவும் தமிழில் இயல்பாகவும் தருகிறது; “மரணம்” இங்கு உருவகப்படுத்தப்பட்ட நபரின் பெயர் என்பதை மேற்கோள் குறிகள் காட்டுகின்றன.
- source_word: ᾅδης
  choice: இறந்தோர் உலகம்
  rationale: இச்சொல் இறந்தோரின் இருப்பிடத்தைக் குறிக்கிறது; இறுதித் தண்டனைக்குரிய நரகத்துடன் இதைக் கலக்காமல், பொதுவாசகருக்குப் புரியும் தமிழில் தருகிறது.
- source_word: μετ’ αὐτοῦ
  choice: அவனுடன்
  rationale: μετά + genitive என்பதன் அடிப்படைப் பொருளான “உடன்” என்பதைக் காக்கிறது; “பின்தொடர்ந்தது” என்ற வினை இயக்கத்தின் தொடர்பைத் தெளிவாக்குகிறது.
- source_word: ἐδόθη αὐτοῖς ἐξουσία
  choice: அதிகாரம் அவர்களுக்குக் கொடுக்கப்பட்டது
  rationale: ἐξουσία என்பதை வெறும் வல்லமை என்று அல்லாமல் ஒப்பளிக்கப்பட்ட அதிகாரமாகத் தருகிறது; கிரேக்கத்தின் மறைமுகச் செயப்பாட்டு வடிவத்தையும் காக்கிறது.
- source_word: ἐπὶ τὸ τέταρτον τῆς γῆς
  choice: பூமியின் நான்கில் ஒரு பகுதியின்மேல்
  rationale: அளவையும் அதிகாரத்தின் பரப்பையும் தெளிவாகக் கூறுகிறது; இக்காட்சியின் பரந்த நோக்கிற்கு “பூமி” பொருத்தமானது.
- source_word: ἀποκτεῖναι
  choice: கொல்லும்படி
  rationale: நோக்கத்தைக் காட்டும் infinitive வடிவத்தை இயல்பான தமிழ் நோக்கவினை அமைப்பில் தருகிறது.
- source_word: ἐν ῥομφαίᾳ
  choice: வாளால்
  rationale: கொல்லும் கருவி அல்லது வழிமுறையைச் சுருக்கமாகவும் தொடரின் இணை அமைப்புக்கு ஏற்றவாறும் தருகிறது.
- source_word: ἐν λιμῷ
  choice: பஞ்சத்தால்
  rationale: தனிப்பட்ட பசியை விடப் பரவலான உணவுப்பற்றாக்குறையைக் குறிக்கும் λιμός என்பதன் பொருளைத் துல்லியமாகக் காட்டுகிறது.
- source_word: ἐν θανάτῳ
  choice: கொள்ளைநோயால்
  rationale: எசேக்கியேல் 14 போன்ற பழைய ஏற்பாட்டு நியாயத்தீர்ப்புப் பட்டியல்களில் θάνατος கொள்ளைநோயைக் குறிக்கும் மரபுப் பயன்பாட்டைக் கொண்டுள்ளது; சொல்லுக்குச் சொல் மாற்றான “மரணத்தால்” அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ὑπὸ τῶν θηρίων τῆς γῆς
  choice: பூமியின் காட்டு விலங்குகளால்
  rationale: ὑπό இங்கு செய்பவரைக் குறிப்பதால் “ஆல்” உருபு பொருத்தமானது; θηρία என்பதை பொதுவாகவும் இயல்பாகவும் “காட்டு விலங்குகள்” எனத் தருகிறது.
theological_decisions:
- issue: ᾅδης என்பதன் மொழிபெயர்ப்பு
  choice: இறந்தோர் உலகம்
  alternative: பாதாளம்; நரகம்
  rationale: இவ்வசனம் உருவகப்படுத்தப்பட்ட “மரணம்” என்பவனிலிருந்து ᾅδης என்பதைக் வேறுபடுத்துகிறது. “நரகம்” என்பது இறுதி நியாயத்தீர்ப்பின் கருத்தை இங்கு தேவையின்றி புகுத்தக்கூடும்; “இறந்தோர் உலகம்” மூலத்தின் குறிப்பைத் தெளிவாகக் காக்கிறது.
- issue: நியாயத்தீர்ப்புப் பட்டியலில் ἐν θανάτῳ என்பதன் பொருள்
  choice: கொள்ளைநோயால்
  alternative: மரணத்தால்
  rationale: எசேக்கியேல் 14-ஐ எதிரொலிக்கும் மரபுப் பட்டியலில் “மரணம்” என்பது கொள்ளைநோயைக் குறிக்கக்கூடும். பட்டியலின் பொருள் ஒழுங்கையும் பழைய ஏற்பாட்டு எதிரொலியையும் முதன்மை உரை காக்கிறது; நேரடி மாற்று அடிக்குறிப்பில் வெளிப்படையாகத் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகருக்கு எளிதில் புரியும், அதேவேளையில் காட்சியின் கண்ணியமும் அச்சமூட்டும் தொனியும் காக்கப்பட்டுள்ளன. வாக்கியத் தொடக்கத்தின் காட்சிமிக்க “இதோ” தக்கவைக்கப்பட்டது. பட்டியலின் ஒத்திசைவுக்காக “வாளாலும்… பஞ்சத்தாலும்… கொள்ளைநோயாலும்… காட்டு விலங்குகளாலும்” என்ற இணை அமைப்பு பயன்படுத்தப்பட்டது.
