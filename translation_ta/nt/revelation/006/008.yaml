- from: நான் பார்த்தேன்; இதோ, வெளிறிய பச்சை நிறமுள்ள ஒரு குதிரை![a] அதன்மேல் அமர்ந்திருந்தவனுடைய பெயர் “மரணம்”; இறந்தோர் உலகம் அவனுடன் பின்தொடர்ந்தது. பூமியின் நான்கில் ஒரு பகுதியின்மேல் அதிகாரம் அவர்களுக்குக் கொடுக்கப்பட்டது—வாளாலும் பஞ்சத்தாலும் கொள்ளைநோயாலும்[b] பூமியின் காட்டு விலங்குகளாலும் கொல்லும்படி.
  to: நான் பார்த்தேன்; இதோ, வெளிறிய பச்சை நிறக் குதிரை![a] அதன்மேல் அமர்ந்திருந்தவனுடைய பெயர் “மரணம்”; இறந்தோர் உலகமும் அவனுடன் பின்தொடர்ந்து வந்தது. பூமியின் நான்கில் ஒரு பகுதியின்மேல் அதிகாரம் அவர்களுக்குக் கொடுக்கப்பட்டது—வாளாலும் பஞ்சத்தாலும் கொள்ளைநோயாலும்[b] பூமியின் காட்டு விலங்குகளாலும் கொல்லும்படி.
  rationale: 'The revision makes two limited stylistic corrections for idiomatic modern Tamil: it streamlines the colour phrase and clarifies the ongoing action of Hades following with Death. It retains all source-level distinctions, the personification, the delegated-authority passive, and both existing footnote anchors and contents.'
