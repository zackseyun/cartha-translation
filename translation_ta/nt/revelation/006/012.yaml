source:
  edition: SBLGNT
  text: Καὶ εἶδον ὅτε ἤνοιξεν τὴν σφραγῖδα τὴν ἕκτην, καὶ σεισμὸς μέγας ἐγένετο, καὶ ὁ ἥλιος ⸂ἐγένετο μέλας⸃ ὡς σάκκος τρίχινος, καὶ ἡ σελήνη ὅλη ἐγένετο ὡς αἷμα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/012.yaml
  text: And I saw when he opened the sixth seal[a], and there was a great earthquake, and the sun became black like sackcloth made of hair, and the whole moon became like blood,
translation:
  language: ta
  text: 'அவர் ஆறாவது முத்திரையைத் திறந்தபோது நான் பார்த்தேன்: ஒரு பெரிய நிலநடுக்கம் ஏற்பட்டது; சூரியன் மயிரால் செய்யப்பட்ட சாக்குத்துணியைப் போலக் கருப்பானது[a]; முழுச் சந்திரனும் இரத்தத்தைப் போல ஆனது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மயிர்ச் சாக்குத்துணியைப் போல.’ இது மயிரால் செய்யப்பட்ட முரட்டுச் சாக்குத்துணியைக் குறிக்கிறது; அத்தகைய துணி பாரம்பரியமாகத் துக்கத்துடன் தொடர்புடையது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: நான் பார்த்தேன்
  rationale: வெளிப்படுத்தலில் தரிசனக் காட்சியை அறிவிக்கும் ὁράω வினையின் இயல்பான, நேரடியான தமிழ் வடிவம்.
- source_word: ὅτε ἤνοιξεν τὴν σφραγῖδα τὴν ἕκτην
  choice: அவர் ஆறாவது முத்திரையைத் திறந்தபோது
  rationale: ὅτε என்பதன் காலத் தொடர்பையும், ἤνοιξεν என்பதன் எளிய நிகழ்வையும் இயல்பான தமிழில் காக்கிறது. கிரேக்கத்தில் வெளிப்படையாக இல்லாத எழுவாயை முந்தைய சூழலின் ஆண்பால் ஒருமை வினை சுட்டுவதால் ‘அவர்’ எனக் குறிப்பிடுகிறது.
- source_word: σεισμὸς μέγας ἐγένετο
  choice: ஒரு பெரிய நிலநடுக்கம் ஏற்பட்டது
  rationale: σεισμός இச்சூழலில் ‘நிலநடுக்கம்’ எனத் தெளிவாகப் பொருள்படுகிறது; ἐγένετο என்பதன் நிகழ்வுத் தன்மையை ‘ஏற்பட்டது’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ὁ ἥλιος ἐγένετο μέλας
  choice: சூரியன் … கருப்பானது
  rationale: μέλας என்பதன் குறிப்பான ‘கருப்பு’ என்ற பொருளைக் காக்கிறது; வெறுமனே ‘இருண்டது’ என்று தளர்த்தவில்லை.
- source_word: ὡς σάκκος τρίχινος
  choice: மயிரால் செய்யப்பட்ட சாக்குத்துணியைப் போல
  rationale: σάκκος என்பதை ‘சாக்குத்துணி’ என்றும் τρίχινος என்பதை ‘மயிரால் செய்யப்பட்ட’ என்றும் தெளிவாக வழங்கி, ὡς குறிக்கும் உவமையையும் காக்கிறது.
- source_word: ἡ σελήνη ὅλη
  choice: சந்திரன் முழுவதும்
  rationale: ὅλη தரும் முழுமை வலியுறுத்தலை வெளிப்படையாகக் காக்கும் இயல்பான தமிழ் அமைப்பு.
- source_word: ἐγένετο ὡς αἷμα
  choice: இரத்தத்தைப் போல ஆனது
  rationale: ὡς என்பது உவமையைக் குறிப்பதால், சந்திரன் உண்மையிலேயே இரத்தமாக மாறியது என்று கூறாமல் ‘இரத்தத்தைப் போல’ எனப் படிமத்தை அப்படியே காக்கிறது.
theological_decisions:
- issue: விண்ணுலக அடையாளங்களின் இயல்பு
  choice: இவற்றை தரிசன/வெளிப்பாட்டு இலக்கியப் படிமங்களாக நேரடியாக மொழிபெயர்த்து, அவை சொற்பொருளான வானியல் நிகழ்வுகளா, குறியீடுகளா, அல்லது இரண்டுமா என்பதைத் தீர்மானிக்காமல் விடுதல்.
  alternative: இவற்றை முற்றிலும் சொற்பொருளான இறுதிக்கால வானியல் பேரழிவாகவோ, முற்றிலும் குறியீட்டு நியாயத்தீர்ப்பாகவோ விளக்குதல்.
  rationale: கிரேக்க உரை ‘சாக்குத்துணியைப் போல’, ‘இரத்தத்தைப் போல’ என்ற உவமைகளை வழங்குகிறது; ஆனால் அவற்றின் பரந்த விளக்கத்தைத் தீர்மானிப்பதில்லை. ஆகவே மொழிபெயர்ப்பு அந்த இறையியல் பதற்றத்தைத் திறந்தவாறே வைக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வெளிப்படுத்தல் நூலுக்குரிய காட்சித் தீவிரமும் காக்கப்பட்டுள்ளன. தொடர்ச்சியான கிரேக்க இணைப்புகளை அப்படியே சுமத்தாமல், முக்காற்புள்ளிகள் மூலம் நிகழ்வுகளின் வரிசை தெளிவாக்கப்பட்டுள்ளது.
