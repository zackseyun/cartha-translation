id: REV.6.15
reference: Revelation 6:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ οἱ βασιλεῖς τῆς γῆς καὶ οἱ μεγιστᾶνες καὶ οἱ χιλίαρχοι καὶ οἱ πλούσιοι καὶ οἱ ἰσχυροὶ καὶ πᾶς δοῦλος καὶ ἐλεύθερος ἔκρυψαν ἑαυτοὺς εἰς τὰ σπήλαια καὶ εἰς τὰς πέτρας τῶν ὀρέων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/015.yaml
  text: And the kings of the earth[a], and the great men, and the commanders, and the rich, and the strong, and every servant and free person[b], hid themselves in the caves and among the rocks of the mountains.
translation:
  language: ta
  text: பூமியின் அரசர்களும், பெருமக்களும்[a], படைத்தலைவர்களும், செல்வந்தர்களும், வலிமைமிக்கவர்களும், அடிமைகளும் சுதந்திரமானவர்களும் ஆகிய அனைவரும்[b] மலைகளின் குகைகளிலும் பாறை இடுக்குகளிலும் தங்களை மறைத்துக்கொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பெருமக்கள்’ என்பதற்கு மாற்றாக ‘பிரபுக்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், ‘ஒவ்வோர் அடிமையும் சுதந்திரமானவரும்’; கிரேக்கத்தில் ஆண்பால் ஒருமை வடிவங்கள் பிரதிநிதித்துவப் பொருளில் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεῖς τῆς γῆς
  choice: பூமியின் அரசர்கள்
  rationale: γῆ என்பதற்கு ‘நிலம்’ என்றும் பொருள் இருக்கலாம்; ஆனால் வெளிப்படுத்தின விசேஷத்தில் வரும் உலகளாவிய நியாயத்தீர்ப்புச் சூழலில் ‘பூமி’ இயல்பாகப் பொருந்துகிறது.
- source_word: μεγιστᾶνες
  choice: பெருமக்கள்
  rationale: உயர் பதவியும் சமூகச் செல்வாக்கும் உடையவர்களைக் குறிக்கிறது. ‘பிரபுக்கள்’ என்பது மரபுவழி உயர்குடியினரை மட்டும் குறிப்பதாகப் புரியக்கூடும்; ‘பெருமக்கள்’ மூலச்சொல்லின் பரந்த பொருளைக் காக்கிறது.
- source_word: χιλίαρχοι
  choice: படைத்தலைவர்கள்
  rationale: சொல்லளவில் ஆயிரம் பேருக்குத் தலைமை வகிப்பவர்களைக் குறித்தாலும், இங்கு இராணுவ உயர் அதிகாரிகள் என்ற செயல்பாட்டு பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: πλούσιοι
  choice: செல்வந்தர்கள்
  rationale: செல்வம் உடையவர்கள் என்ற சமூகக் குழுவைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: ἰσχυροὶ
  choice: வலிமைமிக்கவர்கள்
  rationale: உடல் வலிமை அல்லது ஆற்றல் என்ற மூலச்சொல்லின் நெகிழ்வைத் தக்கவைக்கிறது; ‘அதிகாரமுள்ளவர்கள்’ என்று மொழிபெயர்த்து சமூகப் பதவியுடன் மட்டும் கட்டுப்படுத்தவில்லை.
- source_word: πᾶς δοῦλος καὶ ἐλεύθερος
  choice: அடிமைகள், சுதந்திரமானவர்கள் ஆகிய அனைவரும்
  rationale: அடிமை–சுதந்திரர் என்ற வெளிப்படையான சமூகநிலை எதிர்மறை இணையைப் பாதுகாக்கிறது. கிரேக்க ஆண்பால் ஒருமை வடிவங்கள் பிரதிநிதித்துவப் பொருளில் அனைவரையும் உள்ளடக்குவதால், தமிழில் இயல்பான பன்மை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: ἔκρυψαν ἑαυτοὺς
  choice: ஒளிந்துகொண்டார்கள்
  rationale: கிரேக்கத்தின் தற்சுட்டுப் பொருளை தமிழில் இயல்பான தன்வினை வடிவில் தருகிறது; ‘தங்களை ஒளித்துக்கொண்டார்கள்’ என்பதைவிட இது நடைமொழியில் செம்மையாக உள்ளது.
- source_word: εἰς τὰ σπήλαια καὶ εἰς τὰς πέτρας τῶν ὀρέων
  choice: மலைகளிலுள்ள குகைகளுக்குள்ளும் பாறைகளின் இடையிலும்
  rationale: εἰς காட்டும் உள்ளே செல்லும் இயக்கத்தை ‘குகைகளுக்குள்’ தக்கவைக்கிறது; பாறைகளுக்குள் மறைவதைச் சொற்சொல்லாகக் கூறாமல், மலைப்பாறைகளின் மறைவிடங்களில் ஒளிவதை ‘பாறைகளின் இடையில்’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: அடிமைகள்
  alternative: வேலைக்காரர்கள் / பணியாளர்கள்
  rationale: ἐλεύθερος (‘சுதந்திரமானவர்’) என்பதுடன் நேரடியாக எதிரிணையாக வருவதால், கட்டுப்பட்ட சமூகநிலை இங்கு முக்கியமானது; ஆகவே ‘அடிமை’ என்பதே மூலத்தின் வலிமையைப் பாதுகாக்கிறது.
- issue: δοῦλος καὶ ἐλεύθερος இணையின் பாலின வரம்பு
  choice: அடிமைகள், சுதந்திரமானவர்கள் ஆகிய அனைவரும்
  alternative: ஒவ்வோர் ஆண் அடிமையும் சுதந்திரமான ஆணும்
  rationale: கிரேக்கத்தில் ஆண்பால் ஒருமை இருந்தாலும், இந்த வழக்கமான சமூகநிலை இணை பிரதிநிதித்துவப் பொருளில் எல்லாரையும் குறிக்கிறது. தமிழாக்கம் பாலினத்தைத் தேவையின்றி ஆண்களுக்கு மட்டும் வரையறுக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வெளிப்படுத்தின விசேஷத்தின் கண்ணியமான தரிசன நடைக்கு ஏற்றவாறும் வடிவமைக்கப்பட்டது. பட்டியலின் தொடர்ச்சியை ‘-உம்’ இணைப்புகள் காக்கின்றன; இறுதிச் சமூக இணை தமிழில் இயல்பாக ‘ஆகிய அனைவரும்’ என்று தரப்பட்டுள்ளது.
