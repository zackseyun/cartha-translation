  source_fidelity: திருத்தம் தேவை. மூலத்தின் μυριάδες μυριάδων என்பது வெறுமனே ‘பல்லாயிரம் பல்லாயிரம்’ அல்ல; ‘பதினாயிரக்கணக்கான பதினாயிரங்கள்’ என்ற எண்ணியல்-மொழிவழக்கு வடிவத்தைத் தக்கவைத்தல் வேண்டும். ‘பின்பு’ என்பது மூலத்தில் இல்லாத காலத் தொடர்ச்சியைச் சிறிது சேர்க்கிறது; இணைப்பை நேரடியாகத் தரலாம். அரியணை, உயிரினங்கள், மூப்பர்கள் ஆகிய மூன்றையும் தூதர்கள் சுற்றியிருந்தனர் என்ற அமைப்பும் தெளிவாக்கப்பட்டுள்ளது.
