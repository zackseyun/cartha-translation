source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ⸀ἤκουσα φωνὴν ἀγγέλων πολλῶν κύκλῳ τοῦ θρόνου καὶ τῶν ζῴων καὶ τῶν πρεσβυτέρων, καὶ ἦν ὁ ἀριθμὸς αὐτῶν μυριάδες μυριάδων καὶ χιλιάδες χιλιάδων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/011.yaml
  text: And I looked[a], and I heard the voice of many angels around the throne and the living creatures and the elders, and their number was myriads of myriads and thousands of thousands[b],
translation:
  language: ta
  text: நான் பார்த்தேன்[a]; மேலும், அரியணையையும் உயிரினங்களையும் மூப்பர்களையும் சுற்றி இருந்த பல தூதர்களின் குரலைக் கேட்டேன். அவர்களுடைய எண்ணிக்கை பதினாயிரக்கணக்கான பதினாயிரங்களும் ஆயிரக்கணக்கான ஆயிரங்களுமாக இருந்தது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் கண்டேன்.”
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில், “பதினாயிரக்கணக்கான பதினாயிரங்களும் ஆயிரக்கணக்கான ஆயிரங்களும்.” இது மிகப் பெரும் திரளைக் குறிக்கும் மொழிவழக்காகவும் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: நான் பார்த்தேன்
  rationale: தரிசனத்தின் அடுத்த காட்சிக்குக் கவனம் திரும்புவதை இயல்பான தமிழில் காட்டுகிறது; ‘நான் கண்டேன்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ἤκουσα
  choice: கேட்டேன்
  rationale: ἀκούω என்பதன் இறந்தகாலக் கதைநடைப் பயன்பாட்டுக்கான நேரான தமிழ் இணை.
- source_word: φωνὴν ἀγγέλων πολλῶν
  choice: பல தூதர்களின் குரலை
  rationale: உடைமைத் தொடர்பைத் தெளிவாகப் பாதுகாக்கிறது; ஒருமை ‘குரல்’ பல தூதர்களின் ஒன்றிணைந்த முழக்கத்தையும் குறிக்கலாம்.
- source_word: κύκλῳ
  choice: சுற்றிலும் இருந்த
  rationale: அரியணை, உயிரினங்கள், மூப்பர்கள் ஆகியோரைச் சுற்றிய தூதர்களின் இடநிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ζῴων
  choice: உயிருள்ள உயிரினங்கள்
  rationale: வெளிப்படுத்தலில் காணப்படும் தனித்துவமான தரிசன உயிர்களைச் சாதாரண விலங்குகளாகக் குறுக்காமல், ζῷα என்பதன் ‘உயிருள்ளவை’ என்ற பொருளைப் பாதுகாக்கிறது.
- source_word: πρεσβυτέρων
  choice: மூப்பர்கள்
  rationale: வெளிப்படுத்தலின் அரியணைக் காட்சிகளில் πρεσβύτεροι என்பதற்கான இயல்பான, நிலையான தமிழ் சொல்.
- source_word: ἦν ὁ ἀριθμὸς αὐτῶν
  choice: அவர்களுடைய எண்ணிக்கை ... இருந்தது
  rationale: எண்ணிக்கையை வெளிப்படையாகக் குறிப்பிடும் கிரேக்க வாக்கிய அமைப்பைப் பொருள் மாறாமல் இயல்பான தமிழில் தருகிறது.
- source_word: μυριάδες μυριάδων
  choice: பல்லாயிரம் பல்லாயிரமாக
  rationale: μυριάς என்பதன் மிகப்பெரும் எண்ணிக்கை உணர்வையும் மீளுரைப்பையும் காக்கிறது; துல்லிய எண்ணாக ‘பதினாயிரம் பதினாயிரமாக’ என்றும் கொள்ளலாம்.
- source_word: χιλιάδες χιλιάδων
  choice: ஆயிரம் ஆயிரமாக
  rationale: கிரேக்கத்தின் மீளுரைக்கும் எண்ணியல் நடையைத் தமிழில் காக்கிறது; அளவற்ற பெருந்திரளைக் குறிக்கும் சூழலையும் தக்கவைக்கிறது.
theological_decisions:
- issue: ζῷα எனும் அரியணைக் காட்சி உயிர்களின் பெயர்ப்பு
  choice: உயிருள்ள உயிரினங்கள்
  alternative: உயிருள்ள ஜீவன்கள்; உயிரினங்கள்
  rationale: அவற்றைச் சாதாரண விலங்குகள் என்றோ உருவமற்ற ஆவிகள் என்றோ தீர்மானிக்காமல், மூலத்தின் உயிர்த்தன்மையையும் வெளிப்படுத்தலில் அவற்றின் தனித்துவ அடையாளத்தையும் பாதுகாக்கிறது.
- issue: μυριάδες μυριάδων என்பதன் எண்ணியல் வலிமை
  choice: பல்லாயிரம் பல்லாயிரமாக
  alternative: பதினாயிரம் பதினாயிரமாக
  rationale: சொற்றொடர் மிகப்பெரும் திரளைக் காட்டும் மொழிவழக்காக இருக்கக்கூடியதைப் பாதுகாக்கிறது; அதனைத் துல்லிய கணக்காகவோ ‘எண்ணிலடங்காத’ என்று விளக்கமாகவோ உரையில் முடிவுசெய்யவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்க மூலத்தின் ‘பார்த்தேன்—கேட்டேன்’ முன்னேற்றமும் எண்ணியல் மீளுரைப்பும் பாதுகாக்கப்பட்டுள்ளன; புரிதலுக்காகத் தேவையற்ற சமயவியல் விளக்கம் சேர்க்கப்படவில்லை.
