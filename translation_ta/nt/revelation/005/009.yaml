    issue: ἔθνους என்பதற்கு ‘நாடுகளிலிருந்தும்’
    rationale: ἔθνος இங்கு உலகின் இன/மக்கள்குழுக்களைக் குறிக்கும் நான்கடுக்குப் பட்டியலின் ஒரு கூறு. ‘நாடுகள்’ நவீன தமிழில் அரசியல் நாடுகளாகப் புரியலாம்; ‘இனங்களிலிருந்தும்’ துல்லியமானது.
