  source_fidelity: ‘நாடுகளிலிருந்தும்’ என்பது ἔθνους என்பதற்கு நவீன தமிழில் அரசியல் நாடுகளைக் குறிக்கும் வாய்ப்பை ஏற்படுத்துகிறது; இங்கு இன/மக்கள்குழு குறிப்பு தேவை. ‘மொழியினரிலிருந்தும்’ என்பது பொருளை விளக்கமாகக் குறுக்குகிறது; மூலத்தின் நான்கடுக்குப் பட்டியலை நேரடியாக ‘மொழிகளிலிருந்தும்’ எனக் காக்கலாம். செயப்படுபொருள் வெளிப்படையாக இல்லாததை ‘மனிதர்களை’ என வழங்கி அடிக்குறிப்பிடுதல் சூழலுக்கும் ஆங்கில audit trail-க்கும் பொருந்துகிறது.
  naturalness: திருத்தப்பட்ட உரை நவீன மரியாதை ஒருமையையும் பாடல் நடையையும் காக்கிறது. ‘ஒவ்வொரு குலத்திலிருந்தும், மொழியிலிருந்தும், மக்களிலிருந்தும், இனத்திலிருந்தும்’ என்பது நான்கடுக்குப் பட்டியலைச் செம்மையாகவும் தெளிவாகவும் வழங்குகிறது.
  terminology: ‘சுருள்’, ‘முத்திரைகள்’, ‘கொல்லப்பட்டீர்’, ‘உமது இரத்தத்தால்’, ‘விலைகொடுத்து வாங்கினீர்’ ஆகியவை பொருத்தமானவை. ἔθνος-க்கு ‘இனம்’ பயன்படுத்தப்பட்டுள்ளது; இது ‘நாடு’ என்பதன் அரசியல் பொருளைத் தவிர்க்கிறது. τῷ θεῷ-ன் தத்திவுத் திறந்தன்மையை முதன்மை உரையில் ‘கடவுளுக்கென்று’ என்றும் அடிக்குறிப்பில் ‘கடவுளுக்கு’ என்றும் காக்கிறது.
  issues:
