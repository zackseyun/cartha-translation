    rationale: τῷ θεῷ மற்றும் ἐν τῷ αἵματί σου ஆகியவற்றுக்கான மாற்றுகள் audit trail-இல் குறிக்கப்பட்டுள்ளன. அவற்றைத் தொடர்புடைய சொற்களில் நங்கூரமிட்டு வழங்குவது வாசகருக்குத் தெளிவானது. கையெழுத்து மாறுபாட்டுக் குறிப்பு, அதன் முழுப் பொருளுடன் தனி குறியாகத் தக்கவைக்கப்படுகிறது.
  revised_text: 'அவர்கள் ஒரு புதிய பாடலைப் பாடுகிறார்கள்:


    “சுருளை எடுத்துக்கொள்ளவும்

    அதன் முத்திரைகளைத் திறக்கவும்

    நீர் தகுதியுள்ளவர்;

    ஏனெனில் நீர் கொல்லப்பட்டீர்;

    உமது இரத்தத்தால்[b]

    ஒவ்வொரு குலத்திலிருந்தும், மொழியிலிருந்தும்,

    மக்களிலிருந்தும், இனத்திலிருந்தும்

    மனிதர்களை[a] கடவுளுக்கென்று[c]

    விலைகொடுத்து வாங்கினீர்.[d]”'
