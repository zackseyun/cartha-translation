id: REV.5.9
reference: Revelation 5:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν ᾠδὴν καινὴν λέγοντες· Ἄξιος εἶ λαβεῖν τὸ βιβλίον καὶ ἀνοῖξαι τὰς σφραγῖδας αὐτοῦ, ὅτι ἐσφάγης καὶ ἠγόρασας τῷ ⸀θεῷ ἐν τῷ αἵματί σου ἐκ πάσης φυλῆς καὶ γλώσσης καὶ λαοῦ καὶ ἔθνους,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/009.yaml
  text: And they sing a new song[a], saying, “You are worthy to take the scroll and to open its seals, because you were slain[c][b], and by your blood you purchased for God people from every tribe and language and people and nation,”
translation:
  language: ta
  text: 'அவர்கள் ஒரு புதிய பாடலைப் பாடுகிறார்கள்:


    “சுருளை எடுத்துக்கொள்ளவும்

    அதன் முத்திரைகளைத் திறக்கவும்

    நீர் தகுதியுள்ளவர்;

    ஏனெனில் நீர் கொல்லப்பட்டீர்;

    உமது இரத்தத்தால்[b]

    ஒவ்வொரு குலத்திலிருந்தும், மொழியிலிருந்தும்,

    மக்களிலிருந்தும், இனத்திலிருந்தும்

    மனிதர்களை[a] கடவுளுக்கென்று[c]

    விலைகொடுத்து வாங்கினீர்.[d]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மனிதர்களை’ என்பது தெளிவுக்காகச் சேர்க்கப்பட்டுள்ளது; கிரேக்க முதன்மை உரையில் ‘வாங்கினீர்’ என்பதற்கான செயப்படுபொருள் வெளிப்படையாகக் கூறப்படவில்லை.
    reason: supplied_word
  - marker: b
    text: அல்லது, ‘உமது இரத்தத்துடன்’.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘கடவுளுக்கு’. கிரேக்கத் தத்திவை இரு வகையிலும் வழங்கலாம்.
    reason: lexical_alternative
  - marker: d
    text: சில கையெழுத்துப் பிரதிகளில், ‘எங்களை எங்கள் கடவுளுக்கென்று விலைகொடுத்து வாங்கினீர்’ என்று வாசிக்கப்படுகிறது.
    reason: textual_variant
lexical_decisions:
- source_word: ᾄδουσιν
  choice: பாடுகிறார்கள்
  rationale: நிகழ்கால வினையை வெளிப்படுத்தும் இயல்பான நவீனத் தமிழ்; ‘துதித்துப் பாடுகிறார்கள்’ எனப் பொருளை விரிவாக்கவில்லை.
- source_word: ᾠδὴν καινὴν
  choice: ஒரு புதிய பாடல்
  rationale: வேதாகமத்தில் வரும் ‘புதிய பாடல்’ என்ற கருத்தை நேரடியாகவும் இயல்பாகவும் காக்கிறது.
- source_word: Ἄξιος εἶ
  choice: நீர் தகுதியுள்ளவர்
  rationale: நேரடி வாழ்த்துரையை மரியாதையான ஒருமையில், இயல்பான தமிழ் நடையில் தருகிறது.
- source_word: τὸ βιβλίον
  choice: சுருள்
  rationale: இங்கு முத்திரையிடப்பட்ட பண்டைய சுருள் ஆவணமே குறிக்கப்படுவதால் ‘புத்தகம்’ என்பதைவிடத் துல்லியமானது.
- source_word: ἀνοῖξαι τὰς σφραγῖδας αὐτοῦ
  choice: அதன் முத்திரைகளைத் திறக்க
  rationale: கிரேக்கத்தின் ‘முத்திரைகளைத் திறக்க’ என்ற சுருக்கமான சொல்லமைப்பைக் காக்கிறது; ‘முத்திரைகளை உடைக்க’ என்பது விளக்கமளிக்கும் மாற்றாகும்.
- source_word: ἐσφάγης
  choice: நீர் கொல்லப்பட்டீர்
  rationale: வன்முறையான கொலையையும் பலியிடப்பட்ட ஆட்டுக்குட்டியின் சூழலையும் தாங்கக்கூடிய தெளிவான நவீனத் தமிழ். ‘வெட்டிக் கொல்லப்பட்டீர்’ என்பது மூலத்தில் உள்ள வன்முறையை இன்னும் வெளிப்படையாகச் சொன்னாலும் தமிழ் வசனத்தில் தேவையற்ற அளவு குறிப்பாக்கும்.
- source_word: ἠγόρασας
  choice: விலைகொடுத்து வாங்கினீர்
  rationale: வினையின் அடிப்படையான வணிக உருவகத்தைத் தெளிவாகக் காக்கிறது; ‘மீட்டுக்கொண்டீர்’ என இறையியல் விளக்கத்தைச் சொல்லுக்குள் கொண்டு வரவில்லை.
- source_word: τῷ θεῷ
  choice: கடவுளுக்கென்று
  rationale: வாங்கப்பட்டவர்கள் கடவுளுக்குரியவர்கள் என்ற பயன்/பெறுநர் சார்ந்த தத்திவுப் பொருளை இயல்பான தமிழில் தருகிறது; ‘கடவுளுக்கு’ என்பதும் சாத்தியம்.
- source_word: ἐν τῷ αἵματί σου
  choice: உமது இரத்தத்தால்
  rationale: இங்கு ἐν வழிமுறை அல்லது கருவியைக் குறிக்கிறது; பலியுடன் தொடர்புடைய ‘இரத்தம்’ என்ற திடமான உருவகத்தை மாற்றாமல் காக்கிறது.
- source_word: ἐκ πάσης φυλῆς καὶ γλώσσης καὶ λαοῦ καὶ ἔθνους
  choice: எல்லாக் குலங்களிலிருந்தும் மொழியினரிலிருந்தும் மக்களினங்களிலிருந்தும் நாடுகளிலிருந்தும்
  rationale: நான்கு கூறுகளைக் கொண்ட உலகளாவிய வரம்பை இயல்பான தமிழ்ப் பன்மைகளுடன் காக்கிறது. மொழியே இடமாக இருப்பதுபோல் ஒலிக்காமல் இருக்க γλώσσης என்பது ‘மொழியினரிலிருந்தும்’ என வழங்கப்பட்டது.
theological_decisions:
- issue: ‘வாங்கினீர்’ என்பதற்கான நேரடிச் செயப்படுபொருள் கிரேக்க முதன்மை உரையில் வெளிப்படையாக இல்லை
  choice: வாக்கியத்தைத் தமிழில் புரிந்துகொள்ளத்தக்கதாக ஆக்க ‘மனிதர்களை’ என்று உட்கிடையான செயப்படுபொருளை வழங்கி அடிக்குறிப்பில் வெளிப்படுத்துதல்
  alternative: ‘எல்லாக் குலங்களிலிருந்தும்... கடவுளுக்கென்று விலைகொடுத்து வாங்கினீர்’ என்று செயப்படுபொருளைச் சொல்லாமல் விடுதல்; அல்லது சில கையெழுத்துப் பிரதிகளின்படி ‘எங்களை’ என்று வாசித்தல்
  rationale: தமிழில் செயப்படுபொருளை முற்றிலும் விடுவது தெளிவின்மையை உண்டாக்கும். சூழல் மனிதர்களையே குறிக்கிறது; ‘மனிதர்களை’ என்பது அவர்களை இன்னும் குறுகிய இறையியல் பிரிவாக வரையறுக்காமல் தேவையான இலக்கணத் தெளிவை அளிக்கிறது. சில பிரதிகளின் ‘எங்களை’ என்ற வாசகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ‘உமது இரத்தத்தால்’ என்ற பாவநிவாரண மொழி
  choice: மூலத்தின் இரத்தம் சார்ந்த பலியியல் மொழியை அப்படியே வைத்தல்
  alternative: ‘உமது மரணத்தால்’ என்று பொதுமைப்படுத்துதல்
  rationale: வாங்குதலுக்கான வழிமுறையாக ஆட்டுக்குட்டியின் இரத்தத்தையே வசனம் வெளிப்படையாகக் கூறுகிறது; அதை ஒரு விரிவான கோட்பாட்டு விளக்கமாகவும் மாற்றவில்லை, பொதுவான ‘மரணம்’ என்றும் மங்கச் செய்யவில்லை.
translation_notes:
  register: மரியாதையான ஒருமை (‘நீர்’, ‘உமது’) பயன்படுத்தப்பட்டுள்ளது. பாடலுக்கேற்ற வரி அமைப்பு வைக்கப்பட்டாலும் சொற்கள் நவீன, பொதுவாகப் புரியும் செந்தமிழ் நடையில் உள்ளன. ‘விலைகொடுத்து வாங்கினீர்’ என்பது வணிக உருவகத்தையும், ‘உமது இரத்தத்தால்’ என்பது பலியியல் பதற்றத்தையும் விளக்கவுரை இல்லாமல் காக்கின்றன.
