    reason: textual_variant
  revision_rationale: மூலத்தின் நான்கடுக்கான ‘குலம், மொழி, மக்கள், இனம்’ பட்டியல் துல்லியமாகவும் இயல்பான தமிழிலும் மீட்டமைக்கப்பட்டது. அரசியல் நிறமுடைய ‘நாடுகள்’ நீக்கப்பட்டு ‘இனங்கள்’ இடப்பட்டது. வெளிப்படையற்ற செயப்படுபொருளைத் தமிழின் இலக்கணத் தெளிவுக்காக வழங்கிய முடிவு பாதுகாக்கப்பட்டு அடிக்குறிப்பிடப்பட்டுள்ளது. ஆங்கில audit trail-இல் சுட்டப்படும் ‘கடவுளுக்கு’ மற்றும் ‘உமது இரத்தத்துடன்’ மாற்றுகளும் உரிய நங்கூரங்களுடன் சேர்க்கப்பட்டுள்ளன; மாறுபட்ட கையெழுத்து வாசகமும் அதன் முழு வடிவில் காக்கப்பட்டுள்ளது.
