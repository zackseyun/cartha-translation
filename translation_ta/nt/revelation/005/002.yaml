source:
  edition: SBLGNT
  text: καὶ εἶδον ἄγγελον ἰσχυρὸν κηρύσσοντα ἐν φωνῇ μεγάλῃ· Τίς ⸀ἄξιος ἀνοῖξαι τὸ βιβλίον καὶ λῦσαι τὰς σφραγῖδας αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/002.yaml
  text: And I saw a mighty angel proclaiming with a loud voice[a], “Who is worthy to open the scroll and break its seals?”
translation:
  language: ta
  text: பின்னர், வலிமைமிக்க ஒரு தூதர் உரத்த குரலில், “சுருளைத் திறந்து அதன் முத்திரைகளை உடைக்கத் தகுதியுள்ளவர் யார்?” என்று அறிவித்துக்கொண்டிருந்ததை நான் கண்டேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சுருள்’ என்பதற்கு ‘நூல்’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் βιβλίον பொதுவாக எழுதப்பட்ட ஓர் ஆவணத்தைக் குறிக்கக்கூடும்; ஆனால் இங்கு பல முத்திரைகள் இடப்பட்ட பொருளுக்கு ‘சுருள்’ என்பதே மிகவும் பொருத்தமானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελον ἰσχυρόν
  choice: வல்லமையுள்ள ஒரு தூதர்
  rationale: ἰσχυρός வலிமை அல்லது ஆற்றலைக் குறிக்கிறது. ‘வல்லமையுள்ள’ என்பது பரலோகத் தூதரின் ஆற்றலை இயல்பாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
- source_word: κηρύσσοντα
  choice: அறிவிப்பதை
  rationale: κηρύσσω என்பது பொதுவாகவும் அதிகாரப்பூர்வமாகவும் உரக்க அறிவிப்பதைக் குறிக்கிறது. இக்காட்சியின் ஆணித்தரமான பொது அறிவிப்புக்கு ‘அறிவிப்பதை’ பொருந்துகிறது.
- source_word: ἐν φωνῇ μεγάλῃ
  choice: உரத்த குரலில்
  rationale: இது வலிமையாகவும் கேட்கத்தக்க விதத்திலும் பேசுவதைச் சுட்டும் இயல்பான சொற்றொடர்; நவீன தமிழில் ‘உரத்த குரலில்’ தெளிவாக உள்ளது.
- source_word: Τίς ἄξιος
  choice: தகுதியுள்ளவர் யார்
  rationale: ἄξιος இங்கு இந்தச் சிறப்பான செயலைச் செய்வதற்கான மதிப்பும் தகுதியும் உள்ளவரைக் குறிக்கிறது. ‘தகுதியுள்ளவர்’ அந்தப் பொருளைத் தெளிவாகத் தக்கவைக்கிறது.
- source_word: ἀνοῖξαι τὸ βιβλίον
  choice: சுருளைத் திறந்து
  rationale: βιβλίον பொதுவாக எழுதப்பட்ட ஆவணம் அல்லது நூலைக் குறிக்கலாம்; பல முத்திரைகளால் மூடப்பட்டுள்ள இக்காட்சியில் ‘சுருள்’ வரலாற்றுச் சூழலுக்கும் உருவகத்திற்கும் நன்கு பொருந்துகிறது.
- source_word: λῦσαι τὰς σφραγῖδας αὐτοῦ
  choice: அதன் முத்திரைகளை உடைக்க
  rationale: λύω என்பதன் அடிப்படைப் பொருள் அவிழ்த்தல் அல்லது விடுவித்தல். முத்திரைகளைப் பொறுத்தவரை, சுருளைத் திறக்க அவற்றை உடைத்தல் அல்லது நீக்குதல் என்ற பொருள் வருகிறது; ‘உடைக்க’ உருவகத்தின் திடத்தன்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: அரியணைக் காட்சியில் βιβλίον என்பதன் மொழிபெயர்ப்பு
  choice: சுருள்
  alternative: நூல்
  rationale: பல முத்திரைகள் பொருத்தப்பட்ட எழுத்துப் பொருள் என்ற வெளிப்படுத்தின விசேஷத்தின் காட்சிக்கும் முதல் நூற்றாண்டின் பொருட்சூழலுக்கும் ‘சுருள்’ மிகவும் இயல்பாகப் பொருந்துகிறது. இது கோட்பாட்டைத் தீர்மானிப்பதல்ல; வாசகர் காட்சியை எவ்வாறு புரிந்துகொள்கிறார் என்பதைத் தெளிவாக்கும் சொற்பொருள் மற்றும் வரலாற்றுத் தேர்வு.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கிரேக்கச் சொல் வரிசையைச் செயற்கையாகப் பின்பற்றாமல், காட்சியின் வலிமை, பொது அறிவிப்பின் தன்மை, மற்றும் ‘தகுதி’ குறித்த இறையியல் அழுத்தம் பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறியீடு வசன முடிவில் இடப்பட்டுள்ளது.
