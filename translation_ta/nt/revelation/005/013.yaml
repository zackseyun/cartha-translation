id: REV.5.13
reference: Revelation 5:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ πᾶν κτίσμα ὃ ἐν τῷ οὐρανῷ καὶ ἐπὶ τῆς γῆς καὶ ὑποκάτω τῆς γῆς καὶ ἐπὶ τῆς ⸀θαλάσσης, καὶ τὰ ἐν αὐτοῖς ⸀πάντα, ἤκουσα λέγοντας· Τῷ καθημένῳ ἐπὶ ⸂τῷ θρόνῳ⸃ καὶ τῷ ἀρνίῳ ἡ εὐλογία καὶ ἡ τιμὴ καὶ ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας τῶν ⸀αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/013.yaml
  text: And I heard every creature in heaven and on the earth and under the earth and on the sea[a], and all that is in them, saying[b], “To the one seated on the throne and to the Lamb be blessing and honor and glory and dominion forever and ever.”
translation:
  language: ta
  text: பரலோகத்திலும் பூமியின்மேலும் பூமிக்குக் கீழும் கடலின்மேலும் உள்ள ஒவ்வொரு படைப்புயிரும்[a], அவற்றில் உள்ள அனைத்தும், “அரியணையில் அமர்ந்திருப்பவருக்கும் ஆட்டுக்குட்டியானவருக்கும் வாழ்த்தும் மாண்பும் மகிமையும் வல்லமையும் என்றென்றைக்கும்[b] உண்டாவதாக!” என்று சொல்வதை நான் கேட்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “படைக்கப்பட்ட ஒவ்வொன்றும்.”
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “காலங்களின் காலங்கள்வரை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν κτίσμα
  choice: ஒவ்வொரு படைப்புயிரும்
  rationale: κτίσμα என்பது படைக்கப்பட்ட உயிரையோ பொருளையோ குறிக்கலாம். இங்கு அவை குரலெழுப்பித் துதிப்பதால், தனித்தனியான படைப்புகளைக் குறிக்கும் πᾶν என்பதன் வலிமையையும் உயிருள்ள துதிப்போரின் காட்சியையும் ‘ஒவ்வொரு படைப்புயிரும்’ இயல்பாக வெளிப்படுத்துகிறது; விரிவான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: ὃ ἐν τῷ οὐρανῷ ... καὶ τὰ ἐν αὐτοῖς πάντα
  choice: பரலோகத்திலும் பூமியின்மேலும் பூமிக்குக் கீழும் கடலின்மேலும் உள்ள ... அவற்றில் உள்ள அனைத்தும்
  rationale: மூலத்தின் நான்கு அண்டவெளிப் பகுதிகளையும் அவற்றின் மொத்த உள்ளடக்கத்தையும் அடுத்தடுத்து வைத்துள்ள அமைப்பைப் பேணுகிறது. வெளிப்படுத்தலில் οὐρανός குறிக்கும் பரலோகச் சூழலை ‘பரலோகம்’ தெளிவாக்குகிறது.
- source_word: ἤκουσα λέγοντας
  choice: என்று சொல்வதை நான் கேட்டேன்
  rationale: கூட்டாகக் குறிப்பிடப்பட்ட படைப்புகள் பேசுவதை யோவான் கேட்டார் என்ற புலனுணர்வு நிகழ்வை இயல்பான தமிழ் தொடரில் தருகிறது.
- source_word: Τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: அரியணையில் அமர்ந்திருப்பவருக்கும்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புவினையை மரியாதையான, தற்போதைய தமிழில் வழங்குகிறது.
- source_word: τῷ ἀρνίῳ
  choice: ஆட்டுக்குட்டியானவருக்கும்
  rationale: வெளிப்படுத்தல் நூலில் ἀρνίον கிறிஸ்துவுக்கான நிலையான உருவகப் பட்டமாக உள்ளது. ‘ஆட்டுக்குட்டியானவர்’ பலியையும் உயர்த்தப்பட்ட நிலையையும் தக்கவைத்து, வெறும் விலங்கைக் குறிப்பதுபோல் ஒலிப்பதைத் தவிர்க்கிறது.
- source_word: ἡ εὐλογία
  choice: வாழ்த்து
  rationale: துதிப்பாடல் சூழலில் கடவுளுக்கு உரித்தாக்கப்படும் εὐλογία, அவரைப் போற்றி வாழ்த்துவதைச் சுட்டுகிறது. ‘வாழ்த்து’ என்பது இச்சூழலில் ‘ஆசீர்வாதம்’ என்பதைக் காட்டிலும் இயல்பான தமிழ்.
- source_word: ἡ τιμή
  choice: மாண்பு
  rationale: τιμή குறிக்கும் அளிக்கப்படும் மரியாதை மற்றும் கண்ணியத்தை வழிபாட்டு நடையில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἡ δόξα
  choice: மகிமை
  rationale: வழிபாட்டுச் சூழலில் δόξα என்பதற்கான நிலையான, பொருத்தமான தமிழ் இணை.
- source_word: τὸ κράτος
  choice: வல்லமை
  rationale: κράτος வெளிப்படும் பலத்தையும் ஆளும் வலிமையையும் குறிக்கிறது. ‘வல்லமை’ அதன் வலிமைப் பொருளைத் தக்கவைத்து, ‘அதிகாரம்’ என்று மட்டும் குறுக்குவதைக் தவிர்க்கிறது.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: என்றென்றைக்கும்
  rationale: முடிவில்லாத காலத்தைச் சுட்டும் கிரேக்க மரபுத்தொடருக்கு தெளிவான, இயல்பான தமிழ் இணை; சொற்சொல்லான வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: கடவுளுக்கும் ஆட்டுக்குட்டியானவருக்கும் கூட்டாகச் செலுத்தப்படும் துதி
  choice: ‘அரியணையில் அமர்ந்திருப்பவருக்கும் ஆட்டுக்குட்டியானவருக்கும் ... உண்டாவதாக’ என்று ஒரே துதிப்பிரகடனமாக வழங்கப்பட்டது.
  alternative: இருவருக்கும் தனித்தனியாக வினைச்சொல்லை மீண்டும் கூறுதல்.
  rationale: கிரேக்க உரை இருவரையும் ஒரே இலக்கண அமைப்பில் இணைத்து, ஒரே ஆசீர்வாதத் துதியைச் செலுத்துகிறது. தமிழும் அந்த இணைப்பையும் கிறிஸ்துவைப் பற்றிய உரையின் உயர்ந்த வலியுறுத்தலையும் விளக்கவுரை சேர்க்காமல் பேணுகிறது.
- issue: அண்டமெங்கும் துதிக்கும் κτίσμα என்பதன் குறிப்பு
  choice: குரலுடன் துதிக்கும் தனிப்பட்ட படைப்புகளை முன்னிறுத்த ‘ஒவ்வொரு படைப்புயிரும்’ பயன்படுத்தப்பட்டது.
  alternative: ‘படைப்பு அனைத்தும்’ அல்லது ‘படைக்கப்பட்ட ஒவ்வொன்றும்’.
  rationale: காட்சி பேசும் துதிப்போரைச் சித்தரிப்பதால் உயிர்மையுள்ள சொல் முதன்மை உரையில் இயல்பாக உள்ளது; இருப்பினும் κτίσμα உயிரற்ற படைக்கப்பட்ட பொருளையும் உள்ளடக்கக்கூடிய உண்மையான விரிவு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுமக்கள் எளிதில் புரிந்துகொள்ளக்கூடிய மரியாதையான வழிபாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. ‘அரியணை’, ‘மகிமை’, ‘வல்லமை’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; மிகப் பழமையான வினைமுற்றுகளும் பிரிவுசார் சொற்களும் தவிர்க்கப்பட்டுள்ளன. மூலத்தில் உள்ள அண்டவெளிப் பட்டியல் மற்றும் கடவுள்–ஆட்டுக்குட்டியானவர் இணைத் துதி விளக்கமாகத் தீர்க்கப்படாமல் பேணப்பட்டுள்ளன.
