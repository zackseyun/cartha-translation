id: REV.5.8
reference: Revelation 5:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ ὅτε ἔλαβεν τὸ βιβλίον, τὰ τέσσαρα ζῷα καὶ οἱ εἴκοσι τέσσαρες πρεσβύτεροι ἔπεσαν ἐνώπιον τοῦ ἀρνίου, ἔχοντες ἕκαστος κιθάραν καὶ φιάλας χρυσᾶς γεμούσας θυμιαμάτων, αἵ εἰσιν ⸀αἱ προσευχαὶ τῶν ἁγίων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/008.yaml
  text: And when he took the scroll[a], the four living creatures and the twenty-four elders fell down before the Lamb, each holding a harp and golden bowls full of incense[b], which are the prayers of the saints.
translation:
  language: ta
  text: 'அவர் அந்தச் சுருளை எடுத்தபோது, நான்கு உயிரினங்களும் இருபத்து நான்கு மூப்பர்களும் ஆட்டுக்குட்டியானவருக்கு முன்பாக விழுந்தார்கள். ஒவ்வொருவரும் ஒரு யாழையும்[a] தூபப்பொருள்களால் நிறைந்த பொற்கிண்ணங்களையும் வைத்திருந்தார்கள்; அவை தூயவர்களின்[b] இறைவேண்டல்கள் ஆகும்.


    [a] அல்லது, “வீணை.”


    [b] அல்லது, “பரிசுத்தவான்களின்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வீணை.”
    reason: κιθάρα குறிக்கும் பண்டைய நரம்பிசைக் கருவிக்கு ‘யாழ்’ என்பது பொருத்தமான மொழிபெயர்ப்பு; ‘வீணை’ ஒரு சாத்தியமான lexical மாற்றாகும்.
  - marker: b
    text: அல்லது, “பரிசுத்தவான்களின்.”
    reason: ἅγιοι என்பதற்கு ‘தூயவர்கள்’ மற்றும் மரபான ‘பரிசுத்தவான்கள்’ ஆகிய இரு மொழிபெயர்ப்புகளும் சாத்தியம்; இது அதிகாரபூர்வமாகப் புனிதர் பட்டம் பெற்றவர்களை மட்டும் குறிக்காது.
lexical_decisions:
- source_word: βιβλίον
  choice: சுருள்
  rationale: வெளிப்படுத்தின விசேஷத்தின் காட்சியில் இது நவீன நூல் வடிவத்தைவிடச் சுருட்டப்பட்ட எழுதுபொருளைக் குறிக்கிறது.
- source_word: ζῷα
  choice: உயிருள்ள படைப்புகள்
  rationale: சிங்காசனத்தைச் சூழ்ந்துள்ள பரலோக உயிர்களைக் குறிக்கிறது; இழிவான விலங்கு என்ற பொருளைத் தவிர்த்து, அவை படைக்கப்பட்ட உயிர்கள் என்பதையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: πρεσβύτεροι
  choice: மூப்பர்கள்
  rationale: மரியாதையும் பிரதிநிதித்துவ நிலையையும் காக்கிறது; பிற்காலத் திருச்சபைப் பதவிப்பெயரைத் திணிப்பதில்லை.
- source_word: ἐνώπιον
  choice: முன்பாக
  rationale: இடத்தையும் மரியாதைமிக்க அண்மையையும் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἀρνίου
  choice: ஆட்டுக்குட்டியானவர்
  rationale: வெளிப்படுத்தின விசேஷத்தில் கிறிஸ்துவைக் குறிக்கும் சிறப்புப் பெயரின் பொருளையும் பலிசார்ந்த ஒலிப்பையும் காக்க, மரியாதைப் பன்மை விகுதியுடன் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἔχοντες ἕκαστος
  choice: ஒவ்வொருவரும் ... வைத்திருந்தார்கள்
  rationale: பங்கீட்டுப் பொருளைத் தெளிவாகக் காத்து, நான்கு உயிருள்ள படைப்புகளையும் மூப்பர்களையும் இலக்கணப்படி உள்ளடக்குகிறது.
- source_word: κιθάραν
  choice: யாழ்
  rationale: பண்டைய நரம்பிசைக் கருவியைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்; துல்லியமான கருவிவகை உறுதியில்லாததால் ‘வீணை’ அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: φιάλας χρυσᾶς
  choice: பொற்கிண்ணங்கள்
  rationale: φιάλη ஆழமற்ற கிண்ணம் அல்லது பாத்திரத்தைக் குறிக்கிறது; நவீன வாசகருக்கு ‘குப்பி’ போன்ற தவறான வடிவக் கருத்தைத் தராது.
- source_word: γεμούσας θυμιαμάτων
  choice: தூபப்பொருள்களால் நிறைந்த
  rationale: θυμίαμα என்பதன் தூபப் பொருளை இயல்பான தமிழில் காட்டுகிறது; கிரேக்கப் பன்மையைத் தமிழில் பொருத்தமான கூட்டுப்பொருள் வடிவில் தருகிறது.
- source_word: προσευχαὶ
  choice: இறைவேண்டல்கள்
  rationale: வழிபாட்டுச் சூழலில் கடவுளை நோக்கிய வேண்டுதல்களை நவீன வாசகருக்குத் தெளிவாகக் குறிக்கிறது; குறிப்பிட்ட சமயக் குழுவுக்கே உரிய சொல்லாட்சியைத் தவிர்க்கிறது.
- source_word: τῶν ἁγίων
  choice: தூயவர்களின்
  rationale: கடவுளுக்கெனப் பரிசுத்தமாக்கப்பட்ட மக்களைக் குறிக்கும் ἅγιοι என்பதன் அடிப்படைப் பொருளைக் காக்கிறது; பிற்காலத்தில் அதிகாரபூர்வமாகப் புனிதர் என அறிவிக்கப்பட்ட சிலரை மட்டும் குறிக்கும் எண்ணத்தைத் தவிர்க்கிறது.
theological_decisions:
- issue: பொற்கிண்ணங்களுக்கும் இறைவேண்டல்களுக்கும் இடையிலான குறியீட்டு அடையாளம்
  choice: “அவை ... இறைவேண்டல்கள்” என்று நேரடியாக மொழிபெயர்க்கப்பட்டது; ‘அவை’ என்பது பொற்கிண்ணங்களைக் குறிக்கிறது.
  alternative: “அந்தத் தூபம் ... இறைவேண்டல்கள்” அல்லது “அவை ... இறைவேண்டல்களைக் குறிக்கின்றன.”
  rationale: αἵ என்பது பெண்பால் பன்மை; அது பெண்பால் பன்மையான φιάλας (‘கிண்ணங்கள்’) என்பதோடு இலக்கண ஒத்திசைவு பெறுகிறது, நடுநிலைப் பன்மையான θυμιαμάτων (‘தூபப்பொருள்கள்’) என்பதோடு அல்ல. மேலும் αἵ εἰσιν என்பது ‘அவை ... ஆகும்’ என்ற நேரடி அடையாளப்படுத்தல்; ‘குறிக்கின்றன’ என்று மெலிதாக்கப்படவில்லை.
- issue: ἅγιοι என்பதன் மக்கள் சார்ந்த பொருள்
  choice: “தூயவர்கள்”
  alternative: “பரிசுத்தவான்கள்” அல்லது “கடவுளுடைய மக்கள்”
  rationale: மூலத்தின் ‘தூய/பரிசுத்த மக்கள்’ என்ற பொருளைத் தக்கவைத்தபடி, பிற்காலத்தில் புனிதர் பட்டம் பெற்றவர்களுக்கு மட்டும் இதை வரையறுப்பதைத் தவிர்க்கிறது; விளக்கவுரையான ‘கடவுளுடைய மக்கள்’ என்று விரிவாக்கவும் இல்லை.
- issue: விழுதல் வழிபாடாக விளக்கப்பட வேண்டுமா
  choice: “முன்பாக விழுந்தார்கள்”
  alternative: “விழுந்து வணங்கினார்கள்”
  rationale: ἔπεσαν என்பது நேரடியாக ‘விழுந்தார்கள்’ என்பதே. சூழல் வழிபாட்டைக் காட்டினாலும், இவ்வசனத்தில் இல்லாத தனி வினைச்சொல்லைச் சேர்க்காமல் காட்சியின் பொருள் திறந்தவாறே வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நடை நவீனத் தரத் தமிழிலும் மரியாதைமிக்க தொனியிலும் அமைந்துள்ளது. ‘ஆட்டுக்குட்டியானவர்’ என்ற வடிவம் வெளிப்படுத்தின விசேஷத்தின் கிறிஸ்து சார்ந்த சிறப்புப் பெயரைத் தக்கவைக்கிறது. ‘ஜெபங்கள்’ போன்ற சமய வழக்குச் சொல்லுக்குப் பதிலாக பொதுவாகப் புரியும் ‘இறைவேண்டல்கள்’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் உள்ள நீண்ட பங்கேற்புத் தொடரை வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரித்தாலும், அதன் தர்க்கத் தொடர்பு காக்கப்பட்டுள்ளது.
