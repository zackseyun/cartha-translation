id: REV.5.6
reference: Revelation 5:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἐν μέσῳ τοῦ θρόνου καὶ τῶν τεσσάρων ζῴων καὶ ἐν μέσῳ τῶν πρεσβυτέρων ἀρνίον ⸀ἑστηκὸς ὡς ἐσφαγμένον, ⸀ἔχων κέρατα ἑπτὰ καὶ ὀφθαλμοὺς ἑπτά, ⸀οἵ εἰσιν τὰ ἑπτὰ πνεύματα τοῦ θεοῦ, ⸀ἀπεσταλμένοι εἰς πᾶσαν τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/006.yaml
  text: And I saw[a], in the midst of the throne and of the four living creatures, and in the midst of the elders, a Lamb standing as though it had been slain, having seven horns and seven eyes[b], which are the seven Spirits of God sent out into all the earth.
translation:
  language: ta
  text: அரியணைக்கும் நான்கு உயிரினங்களுக்கும் நடுவில், மூப்பர்களின் நடுவிலும், கொல்லப்பட்டதுபோல் நின்றுகொண்டிருந்த ஓர் ஆட்டுக்குட்டியைக் கண்டேன்.[a] அதற்கு ஏழு கொம்புகளும் ஏழு கண்களும் இருந்தன. அந்தக் கண்கள் பூமியெங்கும் அனுப்பப்பட்டுள்ள கடவுளின் ஏழு ஆவிகள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு வகையில்: “அறுக்கப்பட்டதுபோல்” அல்லது “வெட்டிக் கொல்லப்பட்டதுபோல்.”'
    reason: lexical_alternative
  - marker: b
    text: “கடவுளின் ஏழு ஆவிகள்” என்ற சொற்றொடர் மூலத்தில் உள்ளபடியே தக்கவைக்கப்பட்டுள்ளது; இது பரிசுத்த ஆவியின் ஏழுமடங்கு நிறைவைக் குறிக்கும் உருவகச் சொல்லாட்சி என்று சிலர் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν μέσῳ ... καὶ ... ἐν μέσῳ
  choice: நடுவிலும் ... நடுவிலும் ... நடுவிலும்
  rationale: கிரேக்கத்தில் மீண்டும் மீண்டும் வரும் இடவியல் சொல்லாட்சியை இயன்றவரைத் தக்கவைத்து, தரிசனக் காட்சியின் அடுக்கான அமைவிடத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ζῴων
  choice: உயிரினங்கள்
  rationale: இங்கு சாதாரண விலங்குகள் அல்ல, அரியணையைச் சூழ்ந்துள்ள உயிருள்ள வானுலக உருவங்கள் குறிக்கப்படுகின்றன; ‘உயிரினங்கள்’ இதை இயல்பாகவும் வேறுபடுத்தியும் காட்டுகிறது.
- source_word: πρεσβυτέρων
  choice: மூப்பர்கள்
  rationale: வெளிப்படுத்தின விசேஷத்தின் வானுலகக் காட்சியில் இது அங்கீகரிக்கப்பட்ட ஒரு குழுவின் பெயராகச் செயல்படுவதால், ‘மூப்பர்கள்’ பொருத்தமான நவீனத் தமிழ் வடிவம்.
- source_word: ἀρνίον
  choice: ஆட்டுக்குட்டி
  rationale: பலியையும் மேசியாவையும் சுட்டும் உருவகத்தைத் தக்கவைக்கும் இயல்பான தமிழ்; செயற்கையான சிறுமைப்படுத்தலைத் தவிர்க்கிறது.
- source_word: ἑστηκὸς
  choice: நின்றுகொண்டிருந்த
  rationale: நின்ற நிலையில் காணப்பட்டதைச் சுட்டும் கிரேக்க நிறைவுநிலைப் பங்கேற்புச் சொல்லை, காட்சியின் தொடர்நிலையை வெளிப்படுத்தும் இயல்பான தமிழில் தருகிறது.
- source_word: ὡς ἐσφαγμένον
  choice: கொல்லப்பட்டதுபோல்
  rationale: ὡς என்பதன் தோற்றம்/ஒப்பீட்டு நுணுக்கத்தையும், ஏற்கெனவே நிகழ்ந்த வன்முறை மரணத்தின் நீடித்த அடையாளத்தையும் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: ἔχων κέρατα ἑπτὰ καὶ ὀφθαλμοὺς ἑπτά
  choice: அதற்கு ஏழு கொம்புகளும் ஏழு கண்களும் இருந்தன
  rationale: கிரேக்கப் பங்கேற்புச் சொற்றொடரை இயல்பான தமிழ்ச் சொல்லாக்கமாக மாற்றியபோதும், இரு அபோகலிப்திக் உருவங்களையும் சொற்பொருளோடு தக்கவைக்கிறது.
- source_word: οἵ εἰσιν
  choice: அந்தக் கண்கள் ... ஆவிகள்
  rationale: அருகிலுள்ள முன்னிடையான ‘ஏழு கண்கள்’ என்பதோடு உறவைத் தெளிவாக்குகிறது; கிரேக்கத்தின் அடையாளப்படுத்தும் வாக்கியத்தைச் சிதைக்கவில்லை.
- source_word: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: கடவுளின் ஏழு ஆவிகள்
  rationale: விவாதத்துக்குரிய இறையியல் உருவகத்தை ‘ஏழுவகை பரிசுத்த ஆவி’ என விளக்கிப் பரிமாற்றாமல், கிரேக்கச் சொற்றொடரை அப்படியே தக்கவைக்கிறது.
- source_word: ἀπεσταλμένοι εἰς πᾶσαν τὴν γῆν
  choice: பூமியெங்கும் அனுப்பப்பட்டுள்ள
  rationale: செயப்பாட்டு பன்மையையும் அனுப்பப்பட்டதன் விளைவாக நிலவும் நிலையையும் காத்து, πᾶσαν τὴν γῆν என்பதைக் கச்சிதமான நவீனத் தமிழில் தருகிறது.
theological_decisions:
- issue: ‘கடவுளின் ஏழு ஆவிகள்’ என்பதைக் குறிக்கும் தொடர்புச் சொல்லின் முன்னிடை
  choice: அந்தச் சொற்றொடர் ஆட்டுக்குட்டியின் ஏழு கண்களை ‘கடவுளின் ஏழு ஆவிகள்’ என்று அடையாளப்படுத்துகிறது.
  alternative: கொம்புகளையும் கண்களையும் சேர்த்துக் குறிக்கிறது எனத் தளர்வாகப் புரிந்துகொள்ளலாம்.
  rationale: அருகிலுள்ளவும் கருத்தளவில் பொருத்தமானவும் முன்னிடை ‘ஏழு கண்கள்’ என்பதே. மொழிபெயர்ப்பு இந்தத் தொடர்பை வெளிப்படுத்துகிறது; ஆனால் அதற்கும் மேலான இறையியல் விளக்கத்தைச் சேர்க்கவில்லை.
- issue: ‘கடவுளின் ஏழு ஆவிகள்’ என்ற சொற்றொடரின் பொருள்
  choice: மூலத்தில் உள்ளபடியே ‘கடவுளின் ஏழு ஆவிகள்’ என்று தக்கவைக்கப்பட்டது.
  alternative: ‘கடவுளின் ஏழுவகை நிறைவுள்ள ஆவி’ அல்லது ‘ஏழுமடங்கு நிறைவுள்ள பரிசுத்த ஆவி’ என்று விளக்கிப் பெயர்க்கலாம்.
  rationale: கிரேக்க உரை பன்மையில் ‘ஏழு ஆவிகள்’ என்கிறது. இது பரிசுத்த ஆவியின் ஏழுமடங்கு நிறைவைக் குறிக்கலாம் என்ற புரிதல் இருந்தாலும், விவாதத்துக்குரிய அந்த விளக்கத்தை முதன்மை உரைக்குள் கொண்டு வந்து இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; தரிசன உரைக்கு ஏற்ற கண்ணியமான நடை. ‘அரியணை’, ‘உயிரினங்கள்’, ‘மூப்பர்கள்’, ‘ஆட்டுக்குட்டி’ ஆகிய சொற்கள் பொதுவாசகர்களுக்குப் புரியுமாறும் வெளிப்படுத்தின விசேஷத்தின் குறியீட்டு மொழியைத் தக்கவைக்குமாறும் தேர்ந்தெடுக்கப்பட்டன. மூலத்தின் நீண்ட வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டது; கருத்து உறவுகள் பாதுகாக்கப்பட்டன.
