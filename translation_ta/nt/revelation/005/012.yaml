  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: λέγοντες φωνῇ μεγάλῃ· Ἄξιόν ἐστιν τὸ ἀρνίον τὸ ἐσφαγμένον λαβεῖν τὴν δύναμιν ⸀καὶ πλοῦτον καὶ σοφίαν καὶ ἰσχὺν καὶ τιμὴν καὶ δόξαν καὶ εὐλογίαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/012.yaml
  text: saying with a loud voice[c][b][a], “Worthy is the Lamb who was slain to receive power and wealth and wisdom and might and honor and glory and blessing.”
translation:
  language: ta
  text: 'அவர்கள் உரத்த குரலில் கூறியது:


    “கொல்லப்பட்ட[a] ஆட்டுக்குட்டியானவர்

    வல்லமையையும் செல்வத்தையும்[b] ஞானத்தையும்

    வலிமையையும்[c] மாண்பையும் மகிமையையும் ஆசீர்வாதத்தையும்

    பெற்றுக்கொள்ளத் தகுதியுள்ளவர்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அறுக்கப்பட்ட” என்றும் மொழிபெயர்க்கலாம். கிரேக்க வினைச்சொல் விலங்கை வெட்டிக் கொல்லுதலையும் உட்படுத்தும், மேலும் தெளிவான வதைப் படிமத்தைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “செல்வ வளத்தையும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “பலத்தையும்” என்றும் மொழிபெயர்க்கலாம். இங்கு “வலிமை” என்பது முன்னதாக வரும் “வல்லமை” என்பதிலிருந்து இரு கிரேக்கச் சொற்களையும் வேறுபடுத்திக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: அவர்கள் ... இவ்வாறு கூறினார்கள்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட திரளோடு பங்கேற்பைத் தொடரச்செய்கிறது. தமிழில் தனித்து நிற்கும் வசனத் தொடக்கமாக இயல்பாக இருக்க, கிரேக்கப் பங்கேற்பு வினை முற்றுவினையாக மொழிபெயர்க்கப்பட்டது.
- source_word: φωνῇ μεγάλῃ
  choice: உரத்த குரலில்
  rationale: குரலின் வலிமையைத் தெளிவாகவும் இயல்பான நவீனத் தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: Ἄξιόν ἐστιν
  choice: தகுதியுள்ளவர்
  rationale: வழிபாட்டுக்குரிய உயர்ந்த நடையைத் தக்கவைத்தபடி, தமிழில் இயல்பான பயனிலை அமைப்பை வழங்குகிறது.
- source_word: τὸ ἀρνίον
  choice: ஆட்டுக்குட்டியானவர்
  rationale: வெளிப்படுத்தின விசேஷத்தில் இயேசுவைக் குறிக்கும் பட்டப்பெயரின் உருவகத்தைப் பாதுகாக்கிறது; ‘ஆனவர்’ என்பது அது ஒருவரைக் குறிக்கிறது என்பதை இயல்பாக உணர்த்துகிறது.
- source_word: τὸ ἐσφαγμένον
  choice: கொல்லப்பட்ட
  rationale: σφάζω குறிக்கும் வன்முறையான மரணத்தை மறைக்காமல், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான பொதுத் தமிழில் தருகிறது.
- source_word: λαβεῖν
  choice: பெற்றுக்கொள்ள
  rationale: இப்பாடலில் ஆட்டுக்குட்டியானவருக்கு வழங்கப்படும் ஏழு சிறப்புகளைக் குறிக்கிறது; ‘எடுத்துக்கொள்ள’ என்பதைக் காட்டிலும் இச்சூழலில் இயல்பானது.
- source_word: δύναμιν
  choice: வல்லமை
  rationale: δύναμις என்பதற்கான நிலையான பொருளைத் தருவதோடு, பின்னர் வரும் ἰσχύς என்பதிலிருந்தும் வேறுபடுத்துகிறது.
- source_word: πλοῦτον
  choice: செல்வம்
  rationale: வளமும் உடைமையும் குறிக்கும் பொருளை நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: σοφίαν
  choice: ஞானம்
  rationale: வழிபாட்டு மற்றும் வேதாகமச் சூழலில் இயல்பான, நேரடியான இணைச்சொல்.
- source_word: ἰσχὺν
  choice: வலிமை
  rationale: உறுதியான பலத்தைக் குறிக்கிறது; முன்னதாக வரும் δύναμις என்பதற்கு பயன்படுத்தப்பட்ட ‘வல்லமை’ என்பதோடு உள்ள சொல்வேறுபாட்டைக் காக்கிறது.
- source_word: τιμὴν
  choice: மாண்பு
  rationale: ஒருவருக்கு அளிக்கப்படும் உயர்ந்த மதிப்பையும் கௌரவத்தையும் வழிபாட்டுக்கேற்ற நடையில் வெளிப்படுத்துகிறது.
- source_word: δόξαν
  choice: மகிமை
  rationale: வழிபாட்டுச் சூழலில் δόξα என்பதன் நிலையான மற்றும் பொருத்தமான மொழிபெயர்ப்பு.
- source_word: εὐλογίαν
  choice: வாழ்த்து
  rationale: ஒருவரைப் புகழ்ந்து நன்மையாகப் பேசுதல் என்ற பொருளைத் தருகிறது; ‘ஆசீர்வாதம்’ என்பதால் தமிழில் எழக்கூடிய, ஆட்டுக்குட்டியானவர் பிறருக்கு அருள் வழங்குகிறார் என்ற எதிர்த்திசைப் பொருளைத் தவிர்க்கிறது.
theological_decisions:
- issue: கிறிஸ்துவைக் குறிக்கும் ஆட்டுக்குட்டி என்ற பட்டப்பெயர்
  choice: ஆட்டுக்குட்டியானவர்
  alternative: ஆட்டுக்குட்டி
  rationale: இச்சூழலில் ἀρνίον கொல்லப்பட்டும் உயர்த்தப்பட்டும் இருக்கும் இயேசுவைக் குறிக்கிறது. மரியாதை விகுதி தமிழில் நபரைக் குறிக்கும் இயல்பான வடிவம்; மூலத்தில் இல்லாத மேலதிக கோட்பாட்டைச் சேர்ப்பதில்லை.
- issue: ஆட்டுக்குட்டியின் மரணத்தை விவரிக்கும் மொழி
  choice: கொல்லப்பட்ட
  alternative: அறுக்கப்பட்ட
  rationale: மரணத்தின் வன்முறையையும் பலியிடும் பின்னணியையும் மறைக்காமல் வைக்கிறது; அதேவேளை ‘அறுக்கப்பட்ட’ என்பதன் மிகத் தெளிவான விலங்கு-வதைப் படிமத்தை முதன்மை உரையில் கட்டாயப்படுத்துவதில்லை.
- issue: εὐλογίαν என்பதன் வழிபாட்டு அர்த்தம்
  choice: வாழ்த்து
  alternative: ஆசீர்வாதம்
  rationale: கிரேக்கச் சொல் ‘ஆசீர்வாதம்’ அல்லது ‘வாழ்த்து/போற்றுதல்’ என்ற பரப்பைக் கொண்டிருக்கலாம். இங்கு ஆட்டுக்குட்டியானவர் பெற்றுக்கொள்வதாகச் சொல்லப்படுவதால், புகழ்ந்து வாழ்த்துதல் என்ற சூழல்சார் பொருள் தேர்ந்தெடுக்கப்பட்டது; சொலின் அடிப்படை நன்மொழி கூறும் கருத்து தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான வழிபாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தின் ஏழு உறுப்புகளைக் கொண்ட புகழ்ப்பட்டியல் வரி அமைப்பின் மூலம் தெளிவாக்கப்பட்டுள்ளது; எல்லா இணைப்புகளும் காக்கப்பட்டுள்ளன.
