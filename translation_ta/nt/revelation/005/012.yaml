  terminology: “ஆட்டுக்குட்டியானவர்,” “வல்லமை,” “ஞானம்,” “வலிமை,” “மாண்பு,” “மகிமை” ஆகியவை பொருத்தமானவை. δύναμις/ἰσχύς வேறுபாடு “வல்லமை/வலிமை” மூலம் பாதுகாக்கப்படுகிறது. εὐλογίαν-க்கு “ஆசீர்வாதம்” பயன்படுத்தப்பட்டுள்ளது; இது வழங்கப்படும் நன்மொழி, புகழ், ஆசீர்வாதம் ஆகிய பொருள் வெளிக்குள் இருந்து, குறிப்பிட்ட இறையியல் விளக்கத்தைச் சேர்ப்பதில்லை.
