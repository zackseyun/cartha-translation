  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς ἐδύνατο ἐν τῷ ⸀οὐρανῷ ⸂οὐδὲ ἐπὶ τῆς γῆς οὐδὲ⸃ ὑποκάτω τῆς γῆς ἀνοῖξαι τὸ βιβλίον οὔτε βλέπειν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/003.yaml
  text: And no one in heaven or on the earth or under the earth was able to open the scroll or to look at it[a].
translation:
  language: ta
  text: வானத்திலோ, பூமியிலோ, பூமிக்குக் கீழேயோ எவராலும் அந்தச் சுருளைத் திறக்கவோ அதைப் பார்க்கவோ முடியவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மாற்றாக, ‘அந்தப் புத்தகம்.’ கிரேக்கச் சொல் பொதுவாக எழுதப்பட்ட ஆவணத்தையும் குறிக்கலாம்; ஆனால் இந்தச் சூழலில் பழங்காலச் சுருள் என்ற படிமமே மிகவும் பொருத்தமானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: எவராலும் ... முடியவில்லை
  rationale: கிரேக்க எதிர்மறைச் சுட்டுப்பெயரை, தமிழில் இயல்பான இயலாமைக் கட்டமைப்புடன் இணைத்து ‘ஒருவராலும் முடியவில்லை’ என்ற பொருளில் வழங்குகிறது.
- source_word: ἐδύνατο
  choice: முடியவில்லை
  rationale: இறந்தகாலக் கதைச் சூழலில் உள்ள இயலாமையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: ἐν τῷ οὐρανῷ
  choice: வானத்தில்
  rationale: ஒருமை வடிவத்தையும் வெளிப்படுத்தல் நூலுக்குரிய இடவியல் மொழியையும் காக்கிறது.
- source_word: ἐπὶ τῆς γῆς
  choice: பூமியில்
  rationale: இடத்தைக் குறிக்கும் ἐπί + genitive என்பதற்கான இயல்பான தமிழ் வடிவம்; மூவடுக்குப் பிரபஞ்ச வரிசையையும் காக்கிறது.
- source_word: ὑποκάτω τῆς γῆς
  choice: பூமிக்குக் கீழே
  rationale: மூலத்தின் இடவியல் படிமத்தை நேரடியாகவும் தெளிவாகவும் தருகிறது.
- source_word: ἀνοῖξαι
  choice: திறக்க
  rationale: மூல வினையின் எளிய, நேரான பொருளைத் தக்கவைக்கிறது.
- source_word: τὸ βιβλίον
  choice: அந்தச் சுருள்
  rationale: தரிசனத்தின் பழங்காலப் பின்னணியில் βιβλίον என்பது சுருளைக் குறிப்பது மிக இயல்பு; குறிப்பிட்ட அந்தப் பொருளைக் குறிக்கும் கிரேக்க உருபை ‘அந்த’ வெளிப்படுத்துகிறது.
- source_word: οὔτε βλέπειν αὐτό
  choice: அதைப் பார்க்கவோ
  rationale: இரண்டாவது எதிர்மறை இணை வினையைத் தமிழின் ‘-வோ ... முடியவில்லை’ அமைப்பில் இயல்பாகக் காட்டுகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘கூட’ போன்ற வலியுறுத்தல் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: சுருளைத் திறக்க இயலாதவர்களின் பிரபஞ்சமளாவிய வரம்பு
  choice: ‘வானத்திலோ பூமியிலோ பூமிக்குக் கீழேயோ’ என்ற மூவடுக்கான இடவியல் மொழியைத் தக்கவைத்தல்
  alternative: ‘படைப்பில் எங்குமே’ போன்ற பொதுமைப்படுத்திய உரை
  rationale: மூன்று நிலைகளைக் கொண்ட பிரபஞ்சப் படிமம் அனைவரின் இயலாமையையும் வலியுறுத்துகிறது; அதைத் தக்கவைப்பது வெளிப்படுத்தல் நூலின் தரிசனத் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘-லோ ... -வோ ... முடியவில்லை’ என்ற கட்டமைப்பு மூலத்தின் தொடர்ச்சியான எதிர்மறை இணைப்புகளைத் தெளிவாக எடுத்துரைக்கிறது.
