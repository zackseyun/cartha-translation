  text: And he came and took it from the right hand of the one seated on the throne.
translation:
  language: ta
  text: அவர் வந்து, அரியணையில் அமர்ந்திருப்பவரின் வலக்கையிலிருந்து அதை[a] எடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அதை’ என்பது முன்னைய சூழலில் குறிப்பிடப்பட்ட சுருளைக் குறிக்கிறது; கிரேக்க மூலத்தில் செயப்படுபொருள் வெளிப்படையாகக் கூறப்படவில்லை.
    reason: தமிழில் வாக்கியத் தெளிவுக்காகச் சேர்க்கப்பட்ட மறைந்திருக்கும் செயப்படுபொருளை அடையாளப்படுத்துதல்.
lexical_decisions:
- source_word: ἦλθεν
  choice: வந்து
  rationale: ἔρχομαι என்பதன் இறந்தகால வினைவடிவம்; ஆட்டுக்குட்டியானவர் அரியணையில் அமர்ந்திருப்பவரை நோக்கி நகர்வதை எளிய காட்சிக் கதைநடையில் தெரிவிக்கிறது. ‘அணுகி’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத நுண்பொருளைச் சேர்க்கக்கூடும்.
- source_word: εἴληφεν
  choice: எடுத்தார்
  rationale: λαμβάνω என்பதன் நிறைவுநிலை வடிவம். தரிசனக் கதைத் தொடரில் நிகழ்ந்த செயலை இயல்பான தமிழில் ‘எடுத்தார்’ என்று கூறுவது பொருத்தம்; ‘பெற்றுக்கொண்டார்’ என்பது நேரடியான எடுத்தல் செயலை வலுவிழக்கச் செய்யலாம்.
- source_word: ἐκ
  choice: -இலிருந்து
  rationale: ஒரு பொருள் எங்கிருந்து எடுக்கப்பட்டது என்பதைக் குறிக்கும் மூலப்பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: τῆς δεξιᾶς
  choice: வலக்கை
  rationale: இக்கட்டமைப்பில் δεξιά என்பது வலப்பக்கத்தை மட்டுமல்ல, வலக்கையையே குறிக்கிறது; தரிசனத்தின் தெளிவான உருவகத்தைப் பாதுகாக்கிறது.
- source_word: τοῦ καθημένου
  choice: அமர்ந்திருந்தவரின்
  rationale: κάθημαι என்பதன் பெயர்ச்சொல் போன்று பயன்படும் நிகழ்காலப் பங்கேற்பு வடிவத்தை இயல்பான தமிழில் தருகிறது; ஆட்டுக்குட்டியானவரையும் அரியணையில் அமர்ந்திருப்பவரையும் வேறுபடுத்திக் காட்டுகிறது.
- source_word: ἐπὶ τοῦ θρόνου
  choice: அரியணையில்
  rationale: இடத்தைக் குறிக்கும் ἐπί என்பதற்கு இயல்பான நவீனத் தமிழ் இணை; ‘சிங்காசனம்’ என்பதைக் காட்டிலும் ‘அரியணை’ பொதுவாகப் புரியக்கூடிய செம்மையான சொல்.
theological_decisions:
- issue: εἴληφεν என்பதன் மறைந்திருக்கும் நேரடி செயப்படுபொருள்
  choice: முந்தைய சூழலில் உள்ள சுருளைக் குறிக்க ‘அதை’ சேர்க்கப்பட்டது.
  alternative: செயப்படுபொருளை வெளிப்படுத்தாமல், ‘வலக்கையிலிருந்து எடுத்தார்’ என்று மொழிபெயர்த்தல்.
  rationale: கிரேக்கத்தில் செயப்படுபொருள் முந்தைய சூழலால் தெளிவாக இருப்பதால் விடப்பட்டுள்ளது. தமிழில் ‘அதை’ சேர்ப்பது புதிய கருத்தைச் சேர்க்காமல் தெளிவையும் இயல்பையும் தருகிறது.
- issue: அரியணையில் இருப்பவரைக் குறிப்பிடுதல்
  choice: அரியணையில் அமர்ந்திருந்தவர்
  alternative: அரியணையில் உட்கார்ந்திருப்பவர்
  rationale: ஆட்டுக்குட்டியானவருக்கும் அரியணையில் அமர்ந்திருப்பவருக்கும் உள்ள உரை வேறுபாட்டைப் பாதுகாத்து, மேலதிக இறையியல் அடையாள விளக்கத்தைச் சேர்க்காமல் கண்ணியமான நவீனத் தமிழில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட தரிசனக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அரியணை,’ ‘வலக்கை’ ஆகிய சொற்கள் மூலத்தின் கண்கூடான காட்சியைப் பாதுகாக்கின்றன; தேவையற்ற பழமைநடை தவிர்க்கப்பட்டுள்ளது.
