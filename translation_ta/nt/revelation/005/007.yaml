  rationale: Ongoing enthronement is retained by changing ‘அமர்ந்திருந்தவரின்’ to ‘அமர்ந்திருப்பவரின்.’ The footnote is adjusted to refer accurately to the earlier discourse context in which the scroll is identified. All other wording faithfully and naturally represents the Greek text and its implied object.
