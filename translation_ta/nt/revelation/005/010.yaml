source:
  edition: SBLGNT
  text: καὶ ἐποίησας αὐτοὺς τῷ θεῷ ἡμῶν ⸀βασιλείαν καὶ ἱερεῖς, καὶ ⸀βασιλεύουσιν ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/010.yaml
  text: and you made them a kingdom and priests to our God[b][a], and they reign on the earth.
translation:
  language: ta
  text: எங்கள் தேவனுக்கென்று அவர்களை ஓர் அரசாகவும்[a] ஆசாரியர்களாகவும் ஆக்கினீர்; அவர்கள் பூமியின்மேல் ஆட்சி செய்கிறார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகளில் “ஓர் அரசாகவும் ஆசாரியர்களாகவும்” என்பதற்குப் பதிலாக “அரசர்களாகவும் ஆசாரியர்களாகவும்” என்று உள்ளது.
    reason: textual_variant
  - marker: b
    text: சில கையெழுத்துப் பிரதிகளில் “அவர்கள் பூமியின்மேல் ஆட்சி செய்கிறார்கள்” என்பதற்குப் பதிலாக “அவர்கள் பூமியின்மேல் ஆட்சி செய்வார்கள்” என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: ἐποίησας
  choice: ஆக்கினீர்
  rationale: இறந்தகால வினையாக உள்ள aorist வடிவை இயல்பான தமிழ் இறந்தகாலத்தில் தருகிறது; ஒருமை இரண்டாம் நபருக்கான மரியாதை விகுதி பாடலின் தேவனை நோக்கிய உரைக்கு ஏற்றது.
- source_word: αὐτοὺς
  choice: அவர்களை
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட மீட்கப்பட்ட மக்களைக் குறிக்கும் பன்மை நேர்செயப்படுபொருள்.
- source_word: τῷ θεῷ ἡμῶν
  choice: எங்கள் தேவனுக்கென்று
  rationale: இங்குள்ள dative உறவை, அவர்கள் தேவனுக்குரிய அரசாகவும் ஆசாரியர்களாகவும் அமைக்கப்பட்டனர் என்ற அர்ப்பணிப்பு சார்ந்த பொருளுடன் இயல்பான தமிழில் வெளிப்படுத்துகிறது; வெறும் பயனுறு பொருளாக மிகையாக விளக்கவில்லை.
- source_word: βασιλείαν
  choice: ஓர் அரசு
  rationale: 'ஒருமை பெயர்ச்சொல்லின் கூட்டு இயல்பைப் பாதுகாக்கிறது: மீட்கப்பட்டவர்கள் அரசர்களாகத் தனித்தனியே அழைக்கப்படாமல் ஓர் அரசாக அமைக்கப்படுகிறார்கள்.'
- source_word: ἱερεῖς
  choice: ஆசாரியர்கள்
  rationale: வழிபாட்டுப் பணியாளர்களைக் குறிக்கும் வழக்கமான, புரிந்துகொள்ளத்தக்க வேதாகமத் தமிழ் சொல்; யாத்திராகமம் 19:6 மற்றும் வெளிப்படுத்தல் 1:6 ஆகியவற்றின் பின்னணியையும் தக்கவைக்கிறது.
- source_word: βασιλεύουσιν
  choice: ஆட்சி செய்கிறார்கள்
  rationale: வழங்கப்பட்ட SBLGNT உரையில் இது நிகழ்கால மூன்றாம் நபர் பன்மை வடிவம்; ஆகவே எதிர்காலமாக மாற்றாமல் நிகழ்காலத்தில் மொழிபெயர்க்கப்படுகிறது.
- source_word: ἐπὶ τῆς γῆς
  choice: பூமியின்மேல்
  rationale: ἐπί + genitive என்பதன் இடவியல் பொருளை நேரடியாகத் தருகிறது; ‘பூமியை ஆளுகிறார்கள்’ என்று கூறி ஆளுகையின் பொருளை தேவையின்றி வலுப்படுத்தவில்லை.
theological_decisions:
- issue: 'மீட்கப்பட்டவர்களின் அடையாளம்: βασιλείαν'
  choice: ஓர் அரசு
  alternative: அரசர்கள்
  rationale: வழங்கப்பட்ட விமர்சன மூலவுரை βασιλείαν (‘அரசு’) என்று ஒருமையில் வாசிக்கிறது. வேறு கையெழுத்துப் பிரதிகளின் ‘அரசர்கள்’ என்ற வாசகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: அவர்களுடைய ஆட்சியின் காலம்
  choice: ஆட்சி செய்கிறார்கள்
  alternative: ஆட்சி செய்வார்கள்
  rationale: வழங்கப்பட்ட கிரேக்க வடிவமான βασιλεύουσιν நிகழ்காலம். ஆகவே காலமுடிவியல் கேள்வியை முன்கூட்டியே தீர்மானிக்காமல் நிகழ்கால வாசகம் முதன்மை உரையில் வைக்கப்பட்டு, எதிர்கால வாசகம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. தேவனை நோக்கிய ஒருமை இரண்டாம் நபருக்கு மரியாதை வடிவமான “ஆக்கினீர்” பயன்படுத்தப்பட்டுள்ளது. “ஓர் அரசு” என்பது ஒருமை கூட்டு உருவகத்தைத் தக்கவைக்கிறது; நிகழ்கால கிரேக்க வினை நிகழ்காலத்திலேயே தரப்பட்டுள்ளது.
