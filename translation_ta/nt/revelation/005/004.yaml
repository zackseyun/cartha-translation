  text: καὶ ⸀ἐγὼ ἔκλαιον πολὺ ὅτι οὐδεὶς ἄξιος εὑρέθη ἀνοῖξαι τὸ βιβλίον οὔτε βλέπειν αὐτό·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/004.yaml
  text: And I was weeping greatly because no one was found worthy to open the scroll or to look into it.
translation:
  language: ta
  text: மேலும், அந்தச் சுருளை[a]த் திறக்கவோ அதைப் பார்க்கவோ[b] தகுதியுள்ள எவரும் காணப்படாததால், நான் மிகவும் அழுதுகொண்டிருந்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்தப் புத்தகத்தை.” கிரேக்கச் சொல் βιβλίον என்பது சுருளையோ புத்தகத்தையோ குறிக்கலாம்; இங்குள்ள பண்டைய காட்சிக்கும் அதைத் திறக்கும் செயலுக்கும் “சுருள்” நன்றாகப் பொருந்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அதன் உள்ளடக்கத்தைப் பார்க்கவோ.” சூழலில், இவ்வாறு பொருள்கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐγώ
  choice: நான்
  rationale: வெளிப்படையாக வரும் ἐγώ யோவானை அனுபவிப்பவராக முன்னிறுத்துகிறது. தமிழில் இயல்பான வாக்கிய அமைப்பில் ‘நான்’ இதைத் தெளிவாகக் காட்டுகிறது; καί-யை தனியாக மொழிபெயர்க்காமல், தொடர்ச்சியைச் சூழல் வெளிப்படுத்த அனுமதிக்கிறது.
- source_word: ἔκλαιον
  choice: அழுதுகொண்டிருந்தேன்
  rationale: இறந்தகாலத்தில் தொடர்ந்த செயலைக் குறிக்கும் imperfect வினைவடிவத்தைத் தமிழின் தொடர்நிலை அமைப்பு இயல்பாகப் பாதுகாக்கிறது.
- source_word: πολὺ
  choice: மிகவும்
  rationale: அழுகையின் அளவை வலுப்படுத்துகிறது; ‘மிகவும்’ என்பது உரையில் இல்லாத ‘சத்தமாக’ அல்லது ‘மனங்கசந்து’ போன்ற கூடுதல் உணர்ச்சிநுட்பத்தைச் சேர்ப்பதில்லை.
- source_word: ὅτι
  choice: -ஆததால்
  rationale: யோவான் அழுததற்கான காரணத்தைத் தெளிவாகக் காட்டும் இயல்பான தமிழ் காரணவிகுதி.
- source_word: οὐδεὶς
  choice: எவரும் … காணப்படாததால்
  rationale: தகுதியுடைய எந்த நபரும் இல்லை என்ற முழுமையான எதிர்மறைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: ἄξιος
  choice: தகுதியுள்ளவர்
  rationale: வெறும் செயல் திறனை அல்லாமல், சுருளைத் திறப்பதற்கு உரிய தகுதி அல்லது பாத்திரத்தன்மையைத் தக்கவைக்கிறது; அதேவேளை சாதாரண வாசகருக்கும் தெளிவாக உள்ளது.
- source_word: εὑρέθη
  choice: காணப்படாததால்
  rationale: மூலத்தின் அகர்மப் passive வடிவத்தைப் பாதுகாத்து, தேடிக் கண்டுபிடித்தவர் யார் என்பதை உரை கூறாதபடியே விடுகிறது.
- source_word: ἀνοῖξαι
  choice: திறக்கவோ
  rationale: தகுதி தேவைப்படும் செயலைக் குறிக்கும் infinitive-ஐ நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: τὸ βιβλίον
  choice: அந்தச் சுருள்
  rationale: வெளிப்படுத்தின விசேஷம் 5-இன் பண்டைய அரியணைக் காட்சி மற்றும் திறக்கும் செயல் ஆகியவற்றுக்கு ‘சுருள்’ பொருந்துகிறது. Definite article-ஐ முன்பு குறிப்பிடப்பட்ட பொருளைக் குறிக்கும் ‘அந்த’ என இயல்பாகக் காட்டுகிறது.
- source_word: οὔτε βλέπειν αὐτό
  choice: அதைப் பார்க்கவோ
  rationale: βλέπειν என்பதன் அடிப்படைப் பொருளான ‘பார்க்க’ என்பதைப் பாதுகாக்கிறது; சுருளின் உள்ளடக்கத்தைப் பார்ப்பது என்ற சூழல்சார் சாத்தியத்தை முதன்மை உரையில் கட்டாயப்படுத்தாமல் அடிக்குறிப்பில் தெரிவிக்கிறது.
theological_decisions:
- issue: பரலோக அரியணைக் காட்சியில் ἄξιος என்பதன் வலிமை
  choice: ‘தகுதியுள்ளவர்’ என்று மொழிபெயர்த்து, தேவனுடைய நோக்கத்தை நிறைவேற்றுவதற்குரிய பாத்திரத்தன்மையைத் திறந்த நிலையில் வைத்தல்
  alternative: ‘திறமையுள்ளவர்’ அல்லது ‘செய்யக்கூடியவர்’
  rationale: இங்கு கேள்வி வெறும் செயல்திறனைப் பற்றியது அல்ல; சுருளைத் திறக்க உரியவராக இருப்பதைக் குறிக்கிறது. இருப்பினும் அந்தத் தகுதியின் இறையியல் இயல்பை வசனத்தில் விளக்கிச் சேர்க்கவில்லை.
- issue: வெளிப்படுத்தின விசேஷம் 5-இல் βιβλίον குறிக்கும் பொருள்
  choice: ‘சுருள்’
  alternative: ‘புத்தகம்’
  rationale: முத்திரைகள் இடப்பட்டு திறக்கப்படும் பண்டைய எழுத்துப் பொருளின் காட்சிக்கு ‘சுருள்’ மிகச் சரியாகப் பொருந்துகிறது; ‘புத்தகம்’ என்பதும் சொல்லியல் ரீதியாகச் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: βλέπειν αὐτό என்பது வெளிப்புறத்தைப் பார்ப்பதா அல்லது உள்ளடக்கத்தைப் பார்ப்பதா
  choice: முதன்மை உரையில் ‘அதைப் பார்க்க’ என்று ambiguity-ஐப் பாதுகாத்தல்
  alternative: ‘அதன் உள்ளடக்கத்தைப் பார்க்க’ அல்லது ‘அதற்குள் பார்க்க’
  rationale: βλέπειν αὐτό நேரடியாக ‘அதைப் பார்க்க’ என்று பொருள்படலாம்; சூழலில் சுருளின் உள்ளடக்கத்தை அணுகிப் பார்ப்பதும் கருத்தாக இருக்கலாம். முதன்மை உரை அந்த இரண்டில் ஒன்றைத் தேவையின்றி முடிவுசெய்யவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் அரியணைக் காட்சிக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. தொடரும் அழுகையை ‘அழுதுகொண்டிருந்தேன்’ என்றும், அளவின் தீவிரத்தை ‘மிகவும்’ என்றும் இயல்பாகக் காட்டுகிறது. சொல்லியல் மற்றும் சூழல்சார் இரு சாத்தியங்களும் உள்ள இடங்களில் அடிக்குறிப்புகள் மூலம் ambiguity பாதுகாக்கப்பட்டுள்ளது.
