source:
  edition: SBLGNT
  text: Καὶ εἶδον ἐπὶ τὴν δεξιὰν τοῦ καθημένου ἐπὶ τοῦ θρόνου βιβλίον γεγραμμένον ἔσωθεν καὶ ⸀ὄπισθεν, κατεσφραγισμένον σφραγῖσιν ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/001.yaml
  text: And I saw in the right hand of the one seated on the throne a scroll written within and on the back[b][a], sealed with seven seals.
translation:
  language: ta
  text: மேலும், அரியணையில் அமர்ந்திருந்தவருடைய வலக்கையில், உள்ளேயும் பின்புறத்திலும்[b] எழுதப்பட்டிருந்த ஒரு சுருளை[a] கண்டேன். அது ஏழு முத்திரைகளால் முத்திரையிடப்பட்டிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரு புத்தகத்தை.’ இச்சூழலில் βιβλίον என்ற கிரேக்கச் சொல், கோடெக்ஸ் வடிவப் புத்தகத்தைவிட ஒரு சுருளைக் குறிப்பதாக இருப்பதே அதிக சாத்தியம்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘உள்ளேயும் பின்புறத்திலும் எழுதப்பட்டிருந்த.’ சில மொழிபெயர்ப்புகள் இரண்டாம் பகுதியை ‘வெளிப்புறத்திலும்’ என்று பொதுவாக வழங்குகின்றன.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: கண்டேன்
  rationale: ὁράω என்பதன் இறந்தகாலக் கதைவடிவத்தை இயல்பான, சுருக்கமான தமிழில் தெரிவிக்கிறது.
- source_word: ἐπὶ τὴν δεξιὰν
  choice: வலக்கையில்
  rationale: ἐπί என்பதன் அடிப்படை இடப்பொருள் ‘மேல்’ என இருக்கக்கூடியதாயினும், இங்கு பொருள் ஒருவருடைய கையில் இருப்பதைக் காட்டுகிறது; ‘வலக்கையில்’ என்பது இயல்பான தமிழ்.
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: அரியணையில் அமர்ந்திருந்தவருடைய
  rationale: கிரேக்கத்தில் அந்த நபர் பெயரிடப்படாமல், அரியணையில் அமர்ந்திருப்பவர் என்று விவரிக்கப்படுகிறார்; தமிழும் அந்த இலக்கியத் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: βιβλίον
  choice: சுருள்
  rationale: முதல் நூற்றாண்டுச் சூழலிலும், இருபுறமும் எழுதப்பட்டு முத்திரையிடப்பட்டுள்ள இக்காட்சியிலும், குறியிடப்படுவது தாள் சுருளாக இருப்பதே பெரிதும் சாத்தியம்.
- source_word: γεγραμμένον
  choice: எழுதப்பட்டிருந்த
  rationale: முழுமை பெற்ற எழுத்து நிலையைக் காட்டும் perfect passive participle-ஐ இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: ἔσωθεν καὶ ὄπισθεν
  choice: உள்ளேயும் பின்புறத்திலும்
  rationale: ἔσωθεν என்பது உள்ளேயும், ὄπισθεν என்பது இங்கு சுருளின் மறுபக்கம் அல்லது பின்புறத்தையும் குறிக்கிறது; கிரேக்கத்தின் இடவியல் உருவகத்தை நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: κατεσφραγισμένον
  choice: முத்திரையிடப்பட்டிருந்தது
  rationale: முத்திரையிடுதல் முடிந்து, அந்த நிலையில் சுருள் இருப்பதை perfect passive participle காட்டுகிறது.
- source_word: σφραγῖσιν ἑπτά
  choice: ஏழு முத்திரைகளால்
  rationale: கருவியைக் குறிக்கும் dative வடிவத்தைத் தமிழில் ‘-ஆல்’ வேற்றுமையால் தெளிவாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: அரியணையில் அமர்ந்திருப்பவரின் அடையாளம்
  choice: அரியணையில் அமர்ந்திருந்தவர்
  alternative: தேவன்
  rationale: மூலவசனம் தெய்வீகப் பெயரை நேரடியாகச் சொல்லாமல் அந்த உருவத்தை விவரிப்பதன் மூலம் அடையாளப்படுத்துகிறது; மொழிபெயர்ப்பு அதைக் கூடுதலாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘அரியணை,’ ‘சுருள்,’ ‘முத்திரை’ ஆகிய சொற்கள் வெளிப்படுத்துதலின் காட்சி மற்றும் இலக்கியப் பாணியைத் தக்கவைக்கின்றன. மூலத்தின் நீண்ட பெயரெச்சத் தொடரைத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரித்துள்ளோம்.
