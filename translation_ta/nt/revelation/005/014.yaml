revisions:
- from: அந்த நான்கு உயிருள்ள படைப்புகளும், “ஆமென்” என்று சொல்லிக்கொண்டிருந்தன. மூப்பர்களும் கீழே விழுந்து வழிபட்டார்கள்.[a]
  to: அந்த நான்கு உயிருள்ள ஜீவிகளும், “ஆமென்” என்று சொல்லிக்கொண்டிருந்தன. மூப்பர்களும் கீழே விழுந்து வழிபட்டார்கள்.[a]
