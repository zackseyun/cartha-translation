base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/014.yaml
  text: And the four living creatures were saying[a], “Amen.” And the elders fell down and worshiped.
translation:
  language: ta
  text: அந்த நான்கு உயிருள்ள ஜீவிகளும், “ஆமென்” என்று சொல்லிக்கொண்டிருந்தன. மூப்பர்களும் கீழே விழுந்து வழிபட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில கையெழுத்துப் பிரதிகள் “வழிபட்டார்கள்” என்பதற்குப் பின், “என்றென்றும் உயிரோடிருக்கிறவரை” அல்லது “அவரை” போன்ற வெளிப்படையான செயப்படுபொருளைச் சேர்க்கின்றன. இங்குள்ள முதன்மை உரை SBLGNT-யின் சுருக்கமான வாசகத்தைப் பின்பற்றுகிறது; அதில் செயப்படுபொருள் சூழலிலிருந்து புரிந்துகொள்ளும்படி விடப்பட்டுள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: ζῷα
  choice: உயிருள்ள படைப்புகள்
  rationale: வெறும் விலங்குகள் என்ற எண்ணத்தைத் தவிர்த்து, சிங்காசனத்தைச் சுற்றியுள்ள உயர்ந்த பரலோக உயிர்களைக் குறிக்கிறது; எசேக்கியேலின் சிங்காசனத் தரிசனத்துடனான தொடர்பையும் காக்கிறது.
- source_word: ἔλεγον
  choice: சொல்லிக்கொண்டிருந்தன
  rationale: கிரேக்க இறந்தகாலத் தொடர்நிலை வடிவம் நீடித்த அல்லது திரும்பத் திரும்ப நிகழ்ந்த செயலைக் காட்டக்கூடும்; இந்தத் தமிழாக்கம் அந்த அம்சத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: Ἀμήν
  choice: ஆமென்
  rationale: வழிபாட்டில் பயன்படுத்தப்படும் அறியப்பட்ட ஒப்புதல் முழக்கமாக இருப்பதால், அதன் ஒலிபெயர்ப்பு தக்கவைக்கப்படுகிறது.
- source_word: πρεσβύτεροι
  choice: மூப்பர்கள்
  rationale: இங்கு வயதை மட்டும் குறிக்காமல், வெளிப்படுத்தலில் காணப்படும் அடையாளம் பெற்ற பரலோகக் குழுவின் பெயராகச் செயல்படுகிறது.
- source_word: ἔπεσαν
  choice: கீழே விழுந்து
  rationale: வழிபாட்டில் உடலைத் தாழ்த்தும் செயலைத் தமிழில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: προσεκύνησαν
  choice: வழிபட்டார்கள்
  rationale: பரலோகச் சிங்காசனச் சூழலில், இது வெறும் வணக்கச் சைகையை அல்லாமல் வழிபாட்டு மரியாதையைக் குறிக்கிறது.
theological_decisions:
- issue: வழிபாட்டின் செயப்படுபொருள் வெளிப்படையாகக் கூறப்படாதது
  choice: “வழிபட்டார்கள்” என்று மட்டும் வைத்து, செயப்படுபொருளைச் சேர்க்காமல் விடுதல்
  alternative: “அவரை வழிபட்டார்கள்”; “கடவுளை வழிபட்டார்கள்”; “என்றென்றும் உயிரோடிருக்கிறவரை வழிபட்டார்கள்”
  rationale: SBLGNT கிரேக்க உரை καὶ προσεκύνησαν என்று வெளிப்படையான செயப்படுபொருள் இல்லாமல் முடிகிறது. தமிழ் மொழியிலும் இதை இயல்பாகத் தக்கவைக்க முடியும்; செயப்படுபொருளைச் சேர்ப்பது இவ்வசனத்தின் உரையில் இல்லாததை வேறு பிரதிகளிலிருந்தோ பரந்த சூழலிலிருந்தோ கொண்டு வருவதாகும்.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியத்துடனும் மொழியாக்கப்பட்டுள்ளது. “சொல்லிக்கொண்டிருந்தன” தொடர்ச்சியான அம்சத்தையும், “வழிபட்டார்கள்” வெளிப்படையாகச் சொல்லப்படாத செயப்படுபொருளையும் தக்கவைக்கின்றன.
