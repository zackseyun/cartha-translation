id: REV.5.5
reference: Revelation 5:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ εἷς ἐκ τῶν πρεσβυτέρων λέγει μοι· Μὴ κλαῖε· ἰδοὺ ἐνίκησεν ὁ λέων ὁ ἐκ τῆς φυλῆς Ἰούδα, ἡ ῥίζα Δαυίδ, ⸀ἀνοῖξαι τὸ βιβλίον καὶ τὰς ἑπτὰ σφραγῖδας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/005.yaml
  text: And one of the elders says to me[a], “Do not weep. Behold, the Lion from the tribe of Judah, the Root of David, has conquered[c][b], to open the scroll and its seven seals.”
translation:
  language: ta
  text: 'மூப்பர்களில் ஒருவர் என்னிடம் சொல்கிறார்: “அழாதே. இதோ, யூதா கோத்திரத்தைச் சேர்ந்த சிங்கம், தாவீதின் வேர், சுருளையும் அதன் ஏழு முத்திரைகளையும் திறக்கும்படி வெற்றி பெற்றிருக்கிறார்[b].[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லான மொழிபெயர்ப்பு: “சுருளையும் அதன் ஏழு முத்திரைகளையும் திறக்க.” கிரேக்கத்தில் இது ஒரு infinitive வடிவமாகும்; இதை “திறக்கும்படி” என்றும் மொழிபெயர்க்கலாம்.'
    reason: ἀνοῖξαι என்ற கிரேக்க infinitive-இன் நேரடியான வடிவத்தையும், ἐνίκησεν என்பதோடு அதன் நோக்கம்/விளைவு உறவில் உள்ள மொழிபெயர்ப்பு வாய்ப்பையும் பாதுகாக்கிறது.
  - marker: b
    text: “ஜெயித்திருக்கிறார்” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள கிரேக்க வினைச்சொல் வெளிப்படுத்தலில் வெற்றியடைவதைக் குறிக்கும் முக்கியச் சொல்லாகும்.
    reason: νικάω என்பதின் ‘வெற்றி பெறு/ஜெயி’ என்ற சொற்பொருள் பரப்பைச் சுட்டுகிறது.
lexical_decisions:
- source_word: πρεσβυτέρων
  choice: மூப்பர்களில்
  rationale: வெளிப்படுத்தலில் இது வயதை மட்டும் குறிக்காமல், பரலோகக் குழுவின் அங்கீகரிக்கப்பட்ட பெயராகச் செயல்படுகிறது; ‘மூப்பர்கள்’ அந்தச் சூழலையும் மரியாதைநிலையையும் காக்கிறது.
- source_word: λέγει
  choice: சொல்கிறார்
  rationale: கிரேக்க நிகழ்காலத்தின் உயிரோட்டமுள்ள கதையுரைத் தன்மையைத் தமிழிலும் நிகழ்காலமாகப் பாதுகாக்கிறது.
- source_word: Μὴ κλαῖε
  choice: அழாதே
  rationale: இயல்பான நவீனத் தமிழில் κλαίω என்பதின் அழுதல்/கண்ணீர்விடுதல் பொருளையும் ஆறுதலளிக்கும் கட்டளையையும் தருகிறது.
- source_word: ἰδοὺ
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் கிரேக்க உரையாடல் குறியீட்டை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἐνίκησεν
  choice: வெற்றி பெற்றிருக்கிறார்
  rationale: νικάω என்பதின் வெற்றி/மேற்கொள்ளுதல் கருத்தையும், நிறைவேறிய வெற்றியின் தற்போதைய விளைவையும் காக்கிறது; வெளிப்படுத்தலில் மீண்டும் வரும் வெற்றி மையச்சொல்லாகவும் ஏற்றது.
- source_word: ὁ λέων ὁ ἐκ τῆς φυλῆς Ἰούδα
  choice: யூதா கோத்திரத்திலிருந்து வந்த சிங்கமானவர்
  rationale: ἐκ என்பதின் ‘இலிருந்து’ பொருளைத் தெளிவாகக் காத்து, இந்த உருவகம் ஒருவருக்கான மேசியப் பட்டம் என்பதை தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: ἡ ῥίζα Δαυίδ
  choice: தாவீதின் வேருமானவர்
  rationale: ஏசாயா மரபை எதிரொலிக்கும் மேசிய உருவகத்தை விளக்கமாக மாற்றாமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: ἀνοῖξαι
  choice: ஆகவே, அவரால் ... திறக்க முடியும்
  rationale: முடிவுற்ற வெற்றிக்கும் சுருளைத் திறக்கும் தகுதி/வல்லமைக்கும் இடையிலான தொடர்பை இயல்பான தமிழில் காட்டுகிறது; கிரேக்க இறந்தெச்சத்தின் நேரடி ‘திறக்க’ வடிவமும் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τὸ βιβλίον
  choice: சுருளை
  rationale: இச்சூழலில் βιβλίον என்பது தாள்சுருளைக் குறிக்கிறது; ‘புத்தகம்’ என்பதைவிட வரலாற்று மற்றும் காட்சிசார் சூழலுக்கு இது துல்லியமானது.
- source_word: σφραγῖδας
  choice: முத்திரைகளையும்
  rationale: சுருளை மூடி உறுதிப்படுத்தும் σφραγίς என்பதற்கான வழக்கமான, புரியத்தக்க தமிழ்ச் சொல்.
- source_word: αὐτοῦ
  choice: அதன்
  rationale: இப்பெயர்ப்புப்பெயர் சுருளைக் குறிக்கிறது; தமிழில் இயல்பான உடைமைத் தொடர்பைத் தருகிறது.
theological_decisions:
- issue: இயேசுவுக்குப் பயன்படுத்தப்படும் மேசிய அரசப் பட்டங்கள்
  choice: ‘யூதா கோத்திரத்திலிருந்து வந்த சிங்கமானவர்’ மற்றும் ‘தாவீதின் வேருமானவர்’ என்ற இரு அடையாளங்களையும் வெளிப்படையாக வைத்தல்
  alternative: ஒன்று அல்லது இரண்டையும் விளக்கவுரையாக மாற்றுதல்
  rationale: வசனம் இஸ்ரவேலின் வேதவாக்கியங்களை எதிரொலிக்கும் இரு அரச/மேசிய அடையாளங்களை நோக்கமுடன் இணைக்கிறது. கூடுதல் கோட்பாட்டு விளக்கம் சேர்க்காமல் அவற்றின் கிறிஸ்து சார்ந்த வலிமையைப் பாதுகாக்கிறது.
- issue: ἐνίκησεν என்பதற்குப் பின் வரும் ἀνοῖξαι என்பதின் தொடர்பு
  choice: ‘வெற்றி பெற்றிருக்கிறார்; ஆகவே, அவரால் ... திறக்க முடியும்’ என்று விளைவு/தகுதி உறவாக மொழிபெயர்த்தல்
  alternative: ‘... திறக்க வெற்றி பெற்றிருக்கிறார்’ என்று வடிவத்துக்கு நெருக்கமாக மொழிபெயர்த்தல்
  rationale: வெற்றியைத் திறக்கும் உரிமை அல்லது வல்லமையோடு வாக்கிய அமைப்பு இணைக்கிறது. ‘தகுதியானவர்’ என்ற இவ்வசனத்தில் இல்லாத சொல்லைச் சேர்க்காமல் அந்தத் தொடர்பைக் காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்கள் புரிந்துகொள்ளும் இயல்பான, கண்ணியமான நடையில், வெளிப்படுத்தலின் மேசிய உருவகங்களும் கதையுரை நிகழ்காலமும் பாதுகாக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
