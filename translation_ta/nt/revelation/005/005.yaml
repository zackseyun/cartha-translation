  terminology: ‘மூப்பர்கள்’, ‘யூதா’, ‘தாவீது’, ‘சுருள்’, ‘முத்திரைகள்’ ஆகியவை பொருத்தமானவை. அடிக்குறிப்பு அ-வில் ἀνοῖξαι-ஐ ‘இறந்தெச்சம்’ என்று கூறுவது தவறு; அது கிரேக்க infinitive. அடிக்குறிப்பு ப-வில் ‘மேற்கொண்டிருக்கிறார்’ நவீன தமிழில் νικάω-க்கு தெளிவற்றது; ‘ஜெயித்திருக்கிறார்’ பொருத்தமான மாற்றாகும்.
