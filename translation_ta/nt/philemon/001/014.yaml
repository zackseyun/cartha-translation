revisions:
- from: ஆனால், உங்கள் சம்மதமின்றி[a] எதையும் செய்ய நான் விரும்பவில்லை; உங்கள் நற்செயல்[b] கட்டாயத்தால் நிகழ்ந்ததுபோல் இல்லாமல், மனமுவந்து[c] செய்யப்பட வேண்டும் என்பதற்காகவே அப்படி விரும்பினேன்.
  to: ஆனால், உங்கள் சம்மதமின்றி[a] எதையும் செய்ய நான் விரும்பவில்லை; உங்கள் நற்செயல்[b] கட்டாயத்தால் நிகழ்ந்ததுபோல் இல்லாமல், மனமுவந்ததாக[c] இருக்கும்படியாகவே அப்படி விரும்பினேன்.
