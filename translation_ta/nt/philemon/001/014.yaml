source:
  edition: SBLGNT
  text: χωρὶς δὲ τῆς σῆς γνώμης οὐδὲν ἠθέλησα ποιῆσαι, ἵνα μὴ ὡς κατὰ ἀνάγκην τὸ ἀγαθόν σου ᾖ ἀλλὰ κατὰ ἑκούσιον·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/014.yaml
  text: But without your consent I wanted to do nothing[a], so that your good deed might not be as if by compulsion[c][b], but voluntary.
translation:
  language: ta
  text: ஆனால், உங்கள் சம்மதமின்றி[a] எதையும் செய்ய நான் விரும்பவில்லை; உங்கள் நற்செயல்[b] கட்டாயத்தால் நிகழ்ந்ததுபோல் இல்லாமல், மனமுவந்ததாக[c] இருக்கும்படியாகவே அப்படி விரும்பினேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உங்கள் ஒப்புதலின்றி’ அல்லது ‘உங்கள் கருத்தின்றி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘உங்கள் நன்மை’ அல்லது ‘உங்கள் தயவு’ என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் இச்சூழலில் பிலேமோன் செய்யும் நல்ல செயலையோ, பொதுவாக அவருடைய நற்குணத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அதாவது, ‘உங்கள் சொந்த விருப்பத்தின்படி.’
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς ... τῆς σῆς γνώμης
  choice: உங்கள் சம்மதமின்றி
  rationale: γνώμη என்பது கருத்து, தீர்மானம், ஒப்புதல் அல்லது சம்மதத்தைக் குறிக்கலாம். இச்சூழலில் பவுல் பிலேமோனின் விருப்பத்துக்கு மாறாகச் செயல்பட மறுப்பதால், ‘சம்மதம்’ இயல்பானதும் பொருத்தமானதும் ஆகும்.
- source_word: οὐδὲν ἠθέλησα ποιῆσαι
  choice: எதையும் செய்ய நான் விரும்பவில்லை
  rationale: θέλω இங்கு மனவிருப்பத்தைக் குறிக்கிறது. ‘விரும்பவில்லை’ என்பது அதைத் தீர்மானம் என்ற கடுமையான பொருளாக்காமல் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἵνα μὴ ... ἀλλὰ
  choice: '... இல்லாமல், ... வேண்டும் என்பதற்காகவே'
  rationale: ἵνα அறிமுகப்படுத்தும் நோக்கத்தையும், μὴ ... ἀλλὰ அமைப்பின் எதிர்மறை–நேர்மறை முரண்பாட்டையும் தெளிவாகக் காட்டுகிறது.
- source_word: ὡς κατὰ ἀνάγκην
  choice: கட்டாயத்தால் நிகழ்ந்ததுபோல்
  rationale: ἀνάγκη இங்கு வெறும் அவசியத்தைவிட நிர்ப்பந்தம் அல்லது கட்டாயத்தின் தன்மையைக் குறிக்கிறது; ‘போல்’ என்பது ὡς தரும் நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: τὸ ἀγαθόν σου
  choice: உங்கள் நற்செயல்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட τὸ ἀγαθόν, பிலேமோன் செய்யக்கூடிய ஒரு குறிப்பிட்ட நல்ல செயலை இங்கு பெரும்பாலும் சுட்டுகிறது. அதேவேளை ‘நன்மை’ என்ற விரிவான பொருளும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: κατὰ ἑκούσιον
  choice: மனமுவந்து
  rationale: ἑκούσιον என்பது கட்டாயமின்றி ஒருவரது சொந்த விருப்பத்தால் செய்யப்படுவதைக் குறிக்கிறது. ‘மனமுவந்து’ என்பது இதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: பிலேமோனின் பதிலின் தன்மை
  choice: அவருடைய நற்செயல் கட்டாயத்தால் அல்ல, மனமுவந்து செய்யப்பட வேண்டும் என்ற பவுலின் நோக்கமாக மொழிபெயர்க்கப்பட்டது.
  alternative: τὸ ἀγαθόν என்பதை ‘உங்கள் நன்மை’ அல்லது ‘உங்கள் தயவு’ என்று இன்னும் பொதுவாக மொழிபெயர்த்தல்.
  rationale: கிரேக்க உரை பிலேமோனின் செயல் சுதந்திரமான விருப்பத்திலிருந்து வர வேண்டும் என்பதை வலியுறுத்துகிறது; ஆனால் அந்தச் செயல் என்ன என்பதை இவ்வசனம் வெளிப்படையாகக் குறிப்பிடவில்லை. எனவே மொழிபெயர்ப்பு அதற்கு மேலான கோட்பாட்டு அல்லது ஒழுக்கவியல் விவரத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: மரியாதை ஒருமையை வெளிப்படுத்த ‘உங்கள்’ பயன்படுத்தப்பட்டுள்ளது. மொழிநடை நவீன, எளிதில் புரியக்கூடிய, அதேவேளை வேதாகம வெளியீட்டிற்கேற்ற கண்ணியமான தமிழாக வைக்கப்பட்டுள்ளது. ‘நற்செயல்’ மற்றும் ‘மனமுவந்து’ ஆகியவை மூலத்தின் சுருக்கத்தையும் எதிர்மறை–நேர்மறை மாறுபாட்டையும் இயல்பாகத் தக்கவைக்கின்றன.
