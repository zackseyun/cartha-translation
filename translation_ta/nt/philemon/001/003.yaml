id: PHM.1.3
reference: Philemon 1:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: ta
  text: நம் தந்தையாகிய கடவுளிடமிருந்தும் ஆண்டவராகிய இயேசு மெசியாவிடமிருந்தும் உங்களுக்கு அருளும் சமாதானமும் உண்டாவதாக.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “இயேசு கிறிஸ்து.” கிரேக்க Χριστός (கிறிஸ்தோஸ்) என்பது “மெசியா” என்ற பட்டப்பெயராகவும், சில சூழல்களில் பெயரின் ஒரு பகுதியைப் போலவும் செயல்படலாம்.'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: அருள்
  rationale: பவுலின் வாழ்த்துகளில் வழக்கமான வாழ்த்துச் சொல்லாகவும் இறையியல் செறிவுள்ள சொல்லாகவும் வரும் χάρις என்பதன் இரு பரிமாணங்களையும் ‘அருள்’ இயல்பாகத் தக்கவைக்கிறது.
- source_word: ὑμῖν
  choice: உங்களுக்கு
  rationale: வாழ்த்திலும் ஆசிமொழியிலும் வரும் கொடைபெறுநரைக் குறிக்கும் பன்மை முன்னிலை வேற்றுமையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: εἰρήνη
  choice: சமாதானம்
  rationale: வாழ்த்தின் பொருளையும் எபிரேய ‘ஷாலோம்’ சொல்லின் முழுநல வாழ்வு சார்ந்த எதிரொலியையும் தக்கவைக்கும் நிலைபெற்ற தமிழ் சொல்.
- source_word: ἀπὸ
  choice: இடமிருந்தும்
  rationale: அருளும் சமாதானமும் எங்கிருந்து வருகின்றன என்பதைக் காட்டும் மூலப்பொருளைத் தெளிவாக வெளிப்படுத்துகிறது; இணைக்கப்பட்ட இரு மூலங்களுக்கும் ‘-உம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: நம் தந்தையாகிய கடவுள்
  rationale: ‘கடவுள், அதாவது நம் தந்தை’ என்ற பொருத்தப்பாட்டு உறவை இயல்பான தமிழில் காட்டுகிறது; ‘நம் கடவுளும் தந்தையும்’ என்ற வேறு தொடரமைப்பைத் தவிர்க்கிறது.
- source_word: κυρίου
  choice: ஆண்டவர்
  rationale: κύριος என்பதன் மரியாதை, அதிகாரம், கிறிஸ்துவியல் வலிமை ஆகியவற்றைத் தக்கவைக்கும் வழக்கமான தமிழ் மொழிபெயர்ப்பு.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு மெசியா
  rationale: Ἰησοῦ என்பது பெயராக ஒலிபெயர்க்கப்படுகிறது; Χριστός இங்கு பட்டப்பெயரின் பொருளைத் தக்கவைக்க ‘மெசியா’ என வழங்கப்படுகிறது.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ தொடரில் Χριστοῦ என்பதன் நிலை
  choice: இயேசு மெசியா
  alternative: இயேசு கிறிஸ்து
  rationale: Χριστός ‘அபிஷேகம் செய்யப்பட்டவர்/மெசியா’ என்னும் பட்டப்பெயராகச் செயல்பட முடியும். இவ்வாழ்த்தில் அதன் பட்டப்பெயர் சார்ந்த பொருளை வெளிப்படையாகத் தக்கவைக்க ‘மெசியா’ தேர்ந்தெடுக்கப்பட்டுள்ளது; பெயரைப் போல் நிலைபெற்ற ‘கிறிஸ்து’ என்பதும் சாத்தியமான வாசிப்பு என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: தந்தையும் ஆண்டவர் இயேசுவும் அருள் மற்றும் சமாதானத்தின் மூலமாக இணைத்துக் கூறப்படுதல்
  choice: ஒரே ἀπὸ முன்னிடைச்சொல்லின் கீழ் இருவரையும் இணையாகத் தக்கவைத்தல்
  alternative: ஒவ்வொருவருக்கும் தனித்தனி மூலக் கட்டமைப்பு அமைத்தல்
  rationale: கிரேக்கத்தில் ἀπὸ ஒருமுறை மட்டுமே வந்து, கடவுளையும் ஆண்டவர் இயேசுவையும் καὶ மூலம் இணைக்கிறது. தமிழில் இருவருக்கும் ‘இடமிருந்தும்’ அமைப்பைப் பயன்படுத்துவது அந்த இணைப்பையும் இறையியல் விறைப்பையும் மாற்றாமல் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதையும் எளிமையும் கொண்ட ஆசிமொழி நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தில் வினைச்சொல் வெளிப்படையாக இல்லாவிட்டாலும், தமிழில் வாழ்த்தின் இயல்பான பொருளைத் தெரிவிக்க ‘உண்டாவதாக’ சேர்க்கப்பட்டுள்ளது. மூலமொழியின் ‘அருள் … சமாதானம்’ என்ற வரிசை தக்கவைக்கப்பட்டுள்ளது.
