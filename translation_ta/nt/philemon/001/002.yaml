id: PHM.1.2
reference: Philemon 1:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: καὶ Ἀπφίᾳ τῇ ⸀ἀδελφῇ καὶ Ἀρχίππῳ τῷ συστρατιώτῃ ἡμῶν καὶ τῇ κατ’ οἶκόν σου ἐκκλησίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/002.yaml
  text: 'and to Apphia our sister[a], and to Archippus our fellow soldier, and to the church in your house:'
translation:
  language: ta
  text: 'மேலும், சகோதரி அப்பியாவுக்கும், எங்கள் உடன்போர்வீரனாகிய அர்க்கிப்புவுக்கும், உன் வீட்டிலுள்ள திருச்சபைக்கும்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπφίᾳ
  choice: அப்பியா
  rationale: தனிப்பெயர், கிரேக்க உச்சரிப்பைத் தமிழில் இயல்பாக ஒலிபெயர்த்தது.
- source_word: ἀδελφῇ
  choice: சகோதரி
  rationale: மூல உரையில் உள்ள ‘சகோதரி’ என்ற கிறிஸ்தவ உறவுமுறைச் சொல்லை, இல்லாத ‘நம்’ என்ற உரிமைப்பெயரைச் சேர்க்காமல் வழங்குகிறது.
- source_word: Ἀρχίππῳ
  choice: அர்க்கிப்பு
  rationale: தனிப்பெயர், கிரேக்க வடிவைத் தமிழில் ஒலிபெயர்த்தது; வேற்றுமை உருபுடன் ‘அர்க்கிப்புவுக்கும்’ என வருகிறது.
- source_word: συστρατιώτῃ
  choice: உடன் போர்வீரன்
  rationale: பவுலின் உருவக இராணுவப் படிமத்தைத் தக்கவைத்தபடி, ஒரே போராட்டத்தில் பங்குகொள்பவரைக் குறிக்கிறது.
- source_word: ἐκκλησίᾳ
  choice: திருச்சபை
  rationale: இச்சூழலில் கூடிவரும் கிறிஸ்தவ சமூகத்தைக் குறிக்கும் தமிழில் நிலைபெற்ற, இயல்பான சொல்.
- source_word: κατ’ οἶκόν σου
  choice: உன் வீட்டிலுள்ள
  rationale: சொற்றொடரின் இடத்தொடர்பை நெருக்கமாகக் காக்கிறது; ‘கூடுகிற’ என்று வெளிப்படையாகச் சேர்த்து விளக்கவில்லை.
- source_word: καὶ
  choice: -க்கும்
  rationale: மீண்டும் வரும் இணைப்புகளைத் தமிழின் இயல்பான பட்டியல் அமைப்பில் தத்தம் பெயர்களோடு ‘-க்கும்’ எனக் காட்டுகிறது.
theological_decisions:
- issue: ἀδελφῇ என்பதோடு ‘நம்’ என்ற உரிமைப்பெயரைச் சேர்ப்பதா
  choice: சகோதரி
  alternative: நம் சகோதரி
  rationale: கொடுக்கப்பட்ட SBLGNT மூல உரையில் ἡμῶν (‘நம்’) இல்லை. ஆகவே பிரதான உரை அந்தச் சொல்லைச் சேர்க்கவில்லை; கையெழுத்துப் பிரதி வேறுபாடு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: சகோதரி என்பது உடன்பிறப்பையா அல்லது விசுவாச உறவையா குறிக்கிறது
  choice: சகோதரி
  alternative: விசுவாசச் சகோதரி
  rationale: கிரேக்கச் சொல் தாங்கும் உறவுமுறை உருவகத்தை விளக்கிச் சுருக்காமல், அதன் இயல்பான இறையியல் நெருக்கத்தையும் சாத்தியமான மொழிநயத்தையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கடித முகவரிப் பட்டியலின் தொடர்ச்சியை உணர்த்தும் வகையில் அமைக்கப்பட்டது. ‘திருச்சபை’ மற்றும் ‘உடன் போர்வீரன்’ ஆகியவை முறையே நிலைபெற்ற கிறிஸ்தவப் பயன்பாட்டையும் மூலத்தின் இராணுவ உருவகத்தையும் காக்கின்றன.
