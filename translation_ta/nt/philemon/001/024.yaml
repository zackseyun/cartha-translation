  text: Mark, Aristarchus, Demas, and Luke, my fellow workers.
translation:
  language: ta
  text: என் உடன் பணியாளர்களான மாற்கு, அரிஸ்தர்க்கு, தேமா, லூக்கா.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μᾶρκος
  choice: மாற்கு
  rationale: Μᾶρκος என்ற ஆள்பெயரின் தமிழில் நிலைபெற்ற வேதாகம ஒலிபெயர்ப்பு.
- source_word: Ἀρίσταρχος
  choice: அரிஸ்தர்க்கு
  rationale: Ἀρίσταρχος என்ற ஆள்பெயரை மூலமொழியின் ஒலியமைப்புக்கு நெருக்கமாகவும் தமிழில் வாசிக்க இயல்பாகவும் ஒலிபெயர்க்கிறது.
- source_word: Δημᾶς
  choice: தேமா
  rationale: Δημᾶς என்ற ஆள்பெயரின் மூல உச்சரிப்பை இயன்றவரை தக்கவைக்கும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: Λουκᾶς
  choice: லூக்கா
  rationale: Λουκᾶς என்ற ஆள்பெயரின் தமிழில் பரவலாக அறியப்படும் வேதாகம ஒலிபெயர்ப்பு.
- source_word: οἱ συνεργοί μου
  choice: என் உடன் ஊழியர்களான
  rationale: συνεργός என்பது ஒருவருடன் சேர்ந்து பணியாற்றுபவரைக் குறிக்கிறது. ‘உடன் ஊழியர்கள்’ என்பது ஒத்துழைத்துப் பணிபுரியும் பொருளைத் தெளிவாகத் தருகிறது; μου என்பதன் தொடர்புப் பொருளை ‘என்’ வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமானதும் பொதுவாசகர்களுக்கு இயல்பானதுமான நடை. இந்த வசனம் முந்தைய வசனத்தின் வாழ்த்துச் சொல்லைத் தொடர்ந்து பெயர்ப்பட்டியலாக அமைந்துள்ளதால், தமிழில் முழுமையான இயல்பான வாக்கியமாக ‘ஆகியோரும் வாழ்த்துகிறார்கள்’ என்பது வெளிப்படையாகச் சேர்க்கப்பட்டது.
