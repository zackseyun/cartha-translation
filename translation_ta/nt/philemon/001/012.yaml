  yaml_path: translation/nt/philemon/001/012.yaml
  text: I am sending him back to you—him[a], that is[b], my very heart.
translation:
  language: ta
  text: அவனை உம்மிடம் திருப்பி அனுப்புகிறேன்[a]—அவனையே, அதாவது, என் இதயத்தையே[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் வடிவநெருக்கமாக, “திருப்பி அனுப்பினேன்” அல்லது “திருப்பி அனுப்பியிருக்கிறேன்” என்றும் மொழிபெயர்க்கலாம். கிரேக்க ஏரிஸ்ட் வினை வடிவம் ஆங்கிலம் போன்ற மொழிகளில் பலவாறு வெளிப்படுத்தப்படலாம்; கடிதம் பிலேமோனைச் சென்றடையும் பார்வையில் இங்கு நிகழ்கால வடிவம் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “என் உள்ளுறுப்புகளையே”; இது ஆழ்ந்த பாசத்தையோ கனிவான இரக்கத்தையோ குறிக்கும் உருவகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: அவனை
  rationale: முன்னர் குறிப்பிடப்பட்ட ஒனேசிமுவைக் குறிக்கும் ஆண்பால் ஒருமைச் சார்புப்பெயர்; தமிழில் இயல்பாக ‘அவனை’ என வழங்கப்படுகிறது.
- source_word: ἀνέπεμψά
  choice: திருப்பி அனுப்புகிறேன்
  rationale: ἀναπέμπω என்பதன் இறந்தகால வினை வடிவம் ‘திருப்பி அனுப்பு’ என்று பொருள்படும். கடிதம் பிலேமோனைச் சென்றடையும் நோக்குநிலையைத் தமிழில் இயல்பாக வெளிப்படுத்த நிகழ்கால வடிவம் பயன்படுத்தப்பட்டுள்ளது; காலத்தின் மாற்று வெளிப்பாடுகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: σοι
  choice: உம்மிடமே
  rationale: இரண்டாம் நபர் ஒருமை வேற்றுமை வடிவம் அனுப்புதலின் பெறுநரைக் குறிக்கிறது. ‘உம்மிடம்’ என்பதுடன் ‘ஏ’ சேர்ப்பது மூலத்தின் சொற்பிரிப்பு மற்றும் வலியுறுத்தலை இயல்பான தமிழில் பிரதிபலிக்கிறது.
- source_word: αὐτόν
  choice: அவனை
  rationale: σοι என்பதற்குப் பின் மீண்டும் வரும் இச்சுட்டுப்பெயர் ஒனேசிமுவையே வலியுறுத்துகிறது; தமிழிலும் அதை மீண்டும் கூறுவது அந்த அழுத்தத்தைப் பாதுகாக்கிறது.
- source_word: τοῦτ’ ἔστιν
  choice: அதாவது
  rationale: முன்னர் கூறியதை விளக்கும் வழக்கமான சொற்றொடர்; நவீனத் தமிழில் சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
- source_word: τὰ ἐμὰ σπλάγχνα
  choice: என் உயிரையே
  rationale: σπλάγχνα என்பதன் நேரடிப் பொருள் ‘உள்ளுறுப்புகள்’; உருவகமாக ஆழ்ந்த பாசத்தின் உள்ளார்ந்த மையத்தைக் குறிக்கிறது. ‘என் உயிரையே’ என்பது பவுல் ஒனேசிமுவுடன் கொண்டுள்ள தீவிரமான அன்பையும் தனிப்பட்ட பிணைப்பையும் இயல்பான தமிழில் தெரிவிக்கிறது; நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: σπλάγχνα என்னும் மனித இயல்பு சார்ந்த உருவகம்
  choice: ‘என் உயிரையே’ என்று பொருள்வழியாக மொழிபெயர்த்தல்
  alternative: ‘என் உள்ளத்தையே’ அல்லது நேரடியாக ‘என் உள்ளுறுப்புகளையே’
  rationale: இது கோட்பாட்டுத் தீர்மானம் அல்ல; மொழிமரபு சார்ந்த தீர்மானம். கிரேக்கச் சொல் ஆழ்ந்த பாசத்தையும் கனிவையும் குறிக்கிறது. ‘என் உயிரையே’ என்பது பவுலின் உணர்ச்சித் தீவிரத்தை நவீனத் தமிழில் தெளிவாகக் கடத்துகிறது; உடற்கூறு சார்ந்த அடிப்படையான உருவகத்தை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ஒருமை இரண்டாம் நபருக்குப் பவுலின் மரியாதைமிக்க தனிப்பட்ட வேண்டுகோளுக்கு ஏற்றவாறு ‘உம்’ வடிவம் பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் αὐτόν மீண்டும் வருவதால் ‘அவனை’ என்ற வலியுறுத்திய மறுபடிச் சொல் பாதுகாக்கப்பட்டுள்ளது.
