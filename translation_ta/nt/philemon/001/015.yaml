source:
  edition: SBLGNT
  text: τάχα γὰρ διὰ τοῦτο ἐχωρίσθη πρὸς ὥραν ἵνα αἰώνιον αὐτὸν ἀπέχῃς,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/015.yaml
  text: For perhaps he was separated from you for a time so that you might have him back forever,[a]
translation:
  language: ta
  text: ஏனெனில், ஒருவேளை இதற்காகவே அவர் சிறிது காலம் உங்களைவிட்டுப் பிரிக்கப்பட்டாரோ; நீங்கள் அவரை என்றென்றும் திரும்பப் பெற்றுக்கொள்ளும்படியாக.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர் சிறிது காலம் உங்களைவிட்டுப் போனாரோ.’ கிரேக்கத்தில் ‘பிரிக்கப்பட்டார்’ என்று வரும் செயப்பாட்டு வடிவம் நேரடியாக யார்மீதும் பழி சுமத்துவதை நுட்பமாகத் தவிர்க்கலாம்; மேலும், மறைமுகமான தெய்வீக நோக்கம் இருந்திருக்கலாம் என்பதற்கும் இடமளிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: τάχα
  choice: ஒருவேளை
  rationale: பவுல் உறுதியாகக் கூறாமல் பணிவுடன் முன்வைக்கும் சாத்தியத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: γὰρ
  choice: — (விளக்கத் தொடர்பாக வாக்கியத்தில் உட்பொதிக்கப்பட்டது)
  rationale: முந்தைய கருத்துக்கான விளக்கத் தொடர்பு தமிழில் வாக்கிய ஓட்டத்தாலும் ‘இதற்காகத்தான்’ என்பதாலும் இயல்பாக வெளிப்படுகிறது; தனியாக ‘ஏனெனில்’ சேர்ப்பது இங்கு கனமாக இருக்கும்.
- source_word: διὰ τοῦτο
  choice: இதற்காகத்தான்
  rationale: காரணம் அல்லது நோக்கத்தைக் காட்டும் கிரேக்கத் தொடரின் வலியுறுத்தலைப் பேணுகிறது.
- source_word: ἐχωρίσθη
  choice: பிரிக்கப்பட்டாரோ
  rationale: செயப்பாட்டு வடிவத்தைப் பேணி, ஒநேசிமுவையோ கடவுளையோ நேரடி செய்பவராகக் குறிப்பிடாமல் மூலத்தின் நுட்பமான தெளிவின்மையைத் தக்கவைக்கிறது.
- source_word: πρὸς ὥραν
  choice: சிறிது காலம்
  rationale: சொல்லுக்கு சொல் ‘ஒரு மணிநேரம்’ அல்லாமல், வரையறுக்கப்பட்ட குறுகிய காலத்தைக் குறிக்கும் இயல்பான தமிழ்ச் சொற்றொடர்.
- source_word: ἵνα
  choice: …வதற்காக
  rationale: நோக்கம் அல்லது எதிர்பார்க்கப்பட்ட விளைவைக் குறிக்கும் ἵνα என்பதன் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: αἰώνιον
  choice: என்றென்றும்
  rationale: தற்காலிகப் பிரிவுக்கு எதிராக நீடித்த மீளிணைப்பைச் சுட்டுகிறது; கால அளவையும் ஆன்மீக நீடித்த தன்மையின் சாத்தியத்தையும் திறந்தவாறே வைக்கிறது.
- source_word: αὐτὸν
  choice: அவரை
  rationale: ஒநேசிமுவைக் குறிக்கும் நேரடிச் செயப்படுபொருளை மரியாதையான, இயல்பான தமிழில் தருகிறது.
- source_word: ἀπέχῃς
  choice: திரும்பப் பெற்றுக்கொள்வதற்காக
  rationale: சூழலில் ஒருவரை மீண்டும் பெற்றிருத்தல் அல்லது திரும்பப் பெறுதல் என்ற பொருளை இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: ἐχωρίσθη என்ற செயப்பாட்டு வினையின் மறைமுகச் செய்பவர்
  choice: ‘பிரிக்கப்பட்டாரோ’ என்ற செயப்பாட்டு வடிவத்தைத் தக்கவைத்தல்
  alternative: ‘அவர் உங்களைவிட்டுப் போனாரோ’ அல்லது ‘கடவுள் அவரைப் பிரித்தாரோ’
  rationale: பவுலின் சொல் ஒநேசிமுவின் பொறுப்பை மென்மையாக்குவதோடு, நேரடியாகக் கூறப்படாத தெய்வீக பராமரிப்புக்கும் இடமளிக்கலாம். மொழிபெயர்ப்பு எந்தச் செய்பவரையும் வெளிப்படையாகச் சேர்க்காமல் அந்த இறையியல் இழுபறியைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. பிலேமோனை நோக்கிய ஒருமை ‘நீங்கள்’ மரியாதை வடிவில் வழங்கப்பட்டுள்ளது. ‘ஒருவேளை…பிரிக்கப்பட்டாரோ’ என்பது மூலத்தின் தயக்கமுள்ள ஊகத் தொனியைப் பேணுகிறது.
