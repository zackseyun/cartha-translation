  text: ναί, ἀδελφέ, ἐγώ σου ὀναίμην ἐν κυρίῳ· ἀνάπαυσόν μου τὰ σπλάγχνα ἐν ⸀Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/020.yaml
  text: Yes[a], brother, let me have benefit from you in the Lord[c][b]; refresh my heart in Messiah.
translation:
  language: ta
  text: ஆம், சகோதரனே, ஆண்டவருக்குள் உன்னிடமிருந்து நான் பயன் அடையட்டும்[a]; மேசியாவுக்குள்[c] என் உள்ளத்திற்கு[b] ஓய்வளி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உன்னிடமிருந்து நான் நன்மை பெறட்டும்,’ அல்லது ‘உன்னிடமிருந்து எனக்கு மகிழ்ச்சி உண்டாகட்டும்.’ பவுல், ஒநேசிமுவின் பெயருக்கும் பயன் அல்லது பயன்பாடு என்ற கருத்துக்கும் இடையே சொல்விளையாட்டு செய்திருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: கிரேக்கத்தில் எழுத்துப்படி, ‘என் உள்ளுறுப்புகளை.’ இது ஆழ்ந்த பாச உணர்வுகளையோ ஒருவரின் அகநிலையையோ குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘கிறிஸ்துவுக்குள்.’ கிரேக்க Χριστός இங்கு அதன் பட்டப்பொருளைக் காக்க ‘மேசியா’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: ναί
  choice: ஆம்
  rationale: அன்போடும் உறுதியோடும் வேண்டுகோளைத் தொடங்கும் இயல்பான நவீனத் தமிழ் இணைச்சொல்.
- source_word: ἀδελφέ
  choice: சகோதரனே
  rationale: பிலேமோனை உடன் விசுவாசியான ஆண் சகோதரராக நேரடியாக அழைக்கும் ஒருமை விளி வடிவம்.
- source_word: ἐγώ σου ὀναίμην
  choice: உன்னால் நான் பயனடையட்டும்
  rationale: ὀναίμην என்பதன் ‘பயன் அடைதல்/நன்மை பெறுதல்’ என்ற பொருளையும் வேண்டுகோள் நயத்தையும் காக்கிறது; ஒநேசிமுவின் பெயருடன் இருக்கக்கூடிய சொல்விளையாட்டையும் ஓரளவு பிரதிபலிக்கிறது.
- source_word: ἐν κυρίῳ
  choice: ஆண்டவருக்குள்
  rationale: பவுலின் வழக்கமான உறவு அல்லது வாழ்வுத்தளத்தைக் குறிக்கும் சொற்றொடரைத் தமிழ் கிறிஸ்தவப் பயன்பாட்டில் இயல்பாக வழங்குகிறது.
- source_word: ἀνάπαυσόν
  choice: இளைப்பாறச் செய்
  rationale: ‘ஓய்வு அளி, இளைப்பாறச் செய்’ என்ற வினையின் நேரடியான பொருளைக் காத்து, பிலேமோன் 1:7 உடனான எதிரொலியையும் தக்கவைக்கிறது.
- source_word: μου τὰ σπλάγχνα
  choice: என் உள்ளத்தை
  rationale: சொல்லுக்குச் சொல் ‘என் உள்ளுறுப்புகளை’ என்றாலும், இங்கு ஆழ்ந்த உணர்வுகள் அல்லது அகநிலையைக் குறிக்கும் மரபுத்தொடர்; ‘என் உள்ளத்தை’ என்பது இயல்பான, கண்ணியமான தமிழ்.
- source_word: ἐν Χριστῷ
  choice: மேசியாவுக்குள்
  rationale: Χριστός என்பதன் அபிஷேகம் செய்யப்பட்டவர் என்ற பட்டப்பொருளைக் காக்கிறது; செயல் நிகழும் விசுவாச உறவுத்தளத்தையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: Χριστῷ என்பதன் மொழிபெயர்ப்பு
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இங்கு அது வெறும் பெயர்போல அல்லாமல் பட்டமாகச் செயல்படுவதால் ‘மேசியா’ அதன் பொருளை வெளிப்படையாகக் காக்கிறது; வழக்கமான ‘கிறிஸ்து’ என்பதும் சாத்தியமான மொழிபெயர்ப்பு.
- issue: κυρίῳ என்பதன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: எஜமான்
  rationale: இச்சூழலில் பவுல் பயன்படுத்தும் கிறிஸ்தவப் பட்டத்தையும் மரியாதையையும் ‘ஆண்டவர்’ இயல்பாகக் காக்கிறது; அடிமை–எஜமான் பொருளை தேவையின்றி முன்னிறுத்துவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், நேரடியானதாயும் அன்பான வேண்டுகோள் நயத்துடனும் அமைக்கப்பட்டுள்ளது. ‘பயனடையட்டும்’ என்பது மூலத்தின் சாத்தியமான சொல்விளையாட்டைக் காக்கிறது; ‘உள்ளம்’ மரபுத்தொடரின் இயல்பான தமிழ் இணையாகும். அரைப்புள்ளி இரண்டு இணைந்த வேண்டுகோள்களையும் தெளிவாகப் பிரிக்கிறது.
