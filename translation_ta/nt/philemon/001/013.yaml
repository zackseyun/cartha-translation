id: PHM.1.13
reference: Philemon 1:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ὃν ἐγὼ ἐβουλόμην πρὸς ἐμαυτὸν κατέχειν, ἵνα ὑπὲρ σοῦ ⸂μοι διακονῇ⸃ ἐν τοῖς δεσμοῖς τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/013.yaml
  text: I wanted to keep him with me[a], so that on your behalf he might serve me in the chains of the gospel,
translation:
  language: ta
  text: அவனை என்னிடமே வைத்துக்கொள்ள நான் விரும்பினேன்; நற்செய்தியின் கட்டுகளில் நான் இருக்கும்போது[a], உன் சார்பாக அவன் எனக்குச் சேவை செய்யும்படியாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, ‘நற்செய்தியின் கட்டுகளில்.’ இது நற்செய்தியோடு தொடர்புடைய கட்டுகளைக் குறிக்கிறது; பெரும்பாலும் நற்செய்தியின் காரணமாகப் பவுல் அனுபவித்த கட்டுகள் எனப் புரிந்துகொள்ளப்படுகிறது.
    reason: ‘நற்செய்தியின்’ என்ற கிரேக்க உரிமைவேற்றுமைத் தொடர் கட்டுகளுக்கும் நற்செய்திக்கும் உள்ள தொடர்பைச் சுருக்கமாகக் கூறுகிறது. காரணப்பொருள் சாத்தியமானது; ஆனால் முதன்மை உரையில் அதைத் தீர்மானிக்காமல் காக்கப்படுகிறது.
lexical_decisions:
- source_word: ὃν
  choice: அவனை
  rationale: இந்த ஆண்பால் ஒருமை உறவுப்பெயர் முந்தைய வசனத்தில் குறிப்பிடப்பட்ட ஒநேசிமுவைக் குறிக்கிறது; தமிழில் தொடரை இயல்பாகத் தொடங்க ‘அவனை’ பொருத்தமானது.
- source_word: ἐβουλόμην
  choice: நான் விரும்பினேன்
  rationale: இறந்தகாலத்தில் இருந்த பவுலின் விருப்பம் அல்லது நோக்கத்தை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; முற்றுப்பெறாத காலத்தின் நீடித்த நிழற்பொருளை அளவுக்கு மீறி வலியுறுத்தவில்லை.
- source_word: πρὸς ἐμαυτὸν κατέχειν
  choice: என்னுடனேயே வைத்துக்கொள்ள
  rationale: ஒநேசிமுவைத் தன் அருகில் தொடர்ந்து இருக்கச் செய்வதே சூழலின் பொருள். ‘என்னுடனேயே’ என்பதில் ἐμαυτόν தரும் தன்வலியுறுத்தலும் ஓரளவு வெளிப்படுகிறது.
- source_word: ἵνα
  choice: …படி
  rationale: பவுல் அவனை வைத்துக்கொள்ள விரும்பிய நோக்கத்தைத் தமிழில் இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: ὑπὲρ σοῦ
  choice: உன் சார்பாக
  rationale: ஒநேசிமுவின் பணி பிலேமோனுக்கு நன்மையாகவோ அவரது பிரதிநிதியாகவோ அமையும் கருத்தைத் தருகிறது; முழுமையான பதிலீட்டைத் தேவையின்றி வலியுறுத்தாது.
- source_word: μοι διακονῇ
  choice: அவன் எனக்குப் பணிசெய்யும்படி
  rationale: διακονέω குறிக்கும் உதவி அல்லது சேவையை சமயப் பதவிசார் நிழற்பொருள் இல்லாமல் பரந்த வகையில் தெரிவிக்கிறது. நோக்கவாக்கிய அமைப்பு கிரேக்க இறுதிநிலை வினையின் சாத்திய/நோக்க நுணுக்கத்தைக் காக்கிறது.
- source_word: ἐν τοῖς δεσμοῖς
  choice: நான் விலங்கிடப்பட்டிருக்கையில்
  rationale: δεσμοί என்பதன் சங்கிலி அல்லது கட்டு என்ற உருவகத்தை ‘விலங்கிடப்பட்டு’ காக்கிறது; அதேவேளை தமிழில் நிலைமையை இயல்பாகச் சொல்கிறது.
- source_word: τοῦ εὐαγγελίου
  choice: நற்செய்தியின் பொருட்டு
  rationale: பவுலின் விலங்குகள் நற்செய்தி அறிவிப்பின் காரணமாக வந்தவை என்பதே சூழலில் மிக இயல்பான பொருள். கிரேக்கத்தின் சுருக்கமான உரிமைவேற்றுமைத் தொடரை நேரடியாகத் தீர்மானிக்காமல் இருக்க அதன் சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: τοῦ εὐαγγελίου என்பது δεσμοῖς என்பதுடன் கொண்டுள்ள தொடர்பு
  choice: நற்செய்தியின் பொருட்டு நான் விலங்கிடப்பட்டிருக்கையில்
  alternative: ‘நற்செய்தியின் விலங்குகளில்’ என்ற சொற்சார்ந்த வடிவம்; அதாவது நற்செய்தியுடன் தொடர்புடைய விலங்குகள்
  rationale: இது நற்செய்தியை அறிவித்ததால் பவுல் அனுபவித்த சிறைக்கட்டைக் குறிப்பதாகச் சூழல் வலுவாகச் சுட்டுகிறது. வாசிக்கத்தக்க தமிழுக்காக காரணப்பொருள் முதன்மை உரையில் தரப்படுகிறது; கிரேக்க உரிமைவேற்றுமையின் சுருக்கமும் அதன் பரந்த தொடர்புப்பொருளும் அடிக்குறிப்பில் வெளிப்படையாகக் காக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் வடிவமைக்கப்பட்டது. ‘விலங்கிடப்பட்டிருக்கையில்’ என்பது ‘சிறையில் இருக்கையில்’ என்பதைவிட கிரேக்கத்தின் சங்கிலி/கட்டு உருவகத்தைச் சிறப்பாகக் காக்கிறது. நீண்ட கிரேக்க வாக்கியம் தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டாலும், இரண்டாவது வாக்கியத்தில் ‘அப்படிச் செய்ய’ என்பது முதல் வாக்கியத்தின் விருப்பத்துடன் நோக்கத்தைத் தெளிவாக இணைக்கிறது.
