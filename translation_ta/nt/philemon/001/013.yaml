- from: அவனை என்னுடனேயே வைத்துக்கொள்ள நான் விரும்பினேன். நற்செய்தியின் பொருட்டு நான் விலங்கிடப்பட்டிருக்கையில்[a], உன் சார்பாக அவன் எனக்குப் பணிசெய்யும்படி அப்படிச் செய்ய விரும்பினேன்.
  to: அவனை என்னிடமே வைத்துக்கொள்ள நான் விரும்பினேன்; நற்செய்தியின் கட்டுகளில் நான் இருக்கும்போது[a], உன் சார்பாக அவன் எனக்குச் சேவை செய்யும்படியாக.
