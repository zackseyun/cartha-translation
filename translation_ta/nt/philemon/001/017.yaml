  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Εἰ οὖν με ἔχεις κοινωνόν, προσλαβοῦ αὐτὸν ὡς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/017.yaml
  text: So if you consider me a partner[a], receive him as you would me.
translation:
  language: ta
  text: ஆகவே, நீங்கள் என்னைப் பங்காளியாகக் கருதினால், என்னை ஏற்றுக்கொள்வதுபோல அவனையும் ஏற்றுக்கொள்ளுங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனை வரவேற்றுக்கொள்ளுங்கள்.” இவ்வினைச்சொல் ஒருவரை அன்புடன் வரவேற்பது அல்லது அவரை உறவுக்குள் ஏற்றுக்கொள்வது என்ற பொருளையும் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ οὖν
  choice: ஆகவே, ... என்றால்
  rationale: οὖν என்பதன் முடிவுரைத் தொடர்பையும் εἰ என்பதன் நிபந்தனையையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: ἔχεις κοινωνόν
  choice: நீங்கள் என்னைப் பங்காளியாகக் கருதினால்
  rationale: κοινωνός என்பது ஒன்றில் உடன் பங்குபெறுகிறவரையோ பங்காளியையோ குறிக்கிறது. ‘பங்காளி’ பரஸ்பர உறவையும் சமமான ஏற்றுக்கொள்ளுதலையும் சுருக்கமாகக் காட்டுகிறது; ἔχεις என்ற சொல்லின் இச்சூழல் சார்ந்த இடியத்தை தமிழில் இயல்பாகத் தெரிவிக்க ‘கருதினால்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: προσλαβοῦ
  choice: ஏற்றுக்கொள்ளுங்கள்
  rationale: இடைநிலை ஏவல் வடிவமான προσλαβοῦ ஒருவரை சாதகமாக ஏற்றுக்கொள்ளுதல், வரவேற்றல், உறவுக்குள் சேர்த்துக்கொள்ளுதல் ஆகிய நிழற்பொருள்களைக் கொண்டது. ‘ஏற்றுக்கொள்ளுங்கள்’ இவற்றை அளவுக்கு மீறிக் குறுக்காமல் தக்கவைக்கிறது.
- source_word: αὐτὸν
  choice: அவனையும்
  rationale: சூழலில் ஒநேசிமுவைக் குறிக்கும் ஆண்பால் ஒருமைச் சுட்டுப்பெயர். ஒப்பீட்டின் இணைப்பைத் தெளிவாக்க ‘-உம்’ சேர்க்கப்பட்டுள்ளது.
- source_word: ὡς ἐμέ
  choice: என்னை ஏற்றுக்கொள்வதுபோல
  rationale: ὡς என்பதன் ஒப்பீட்டு வலிமையை இயல்பான தமிழில் வெளிப்படுத்த, கிரேக்கத்தில் மறைந்துள்ள வினை தமிழில் நிரப்பப்பட்டுள்ளது.
theological_decisions:
- issue: பவுலின் வேண்டுகோளில் κοινωνός என்பதன் உறவுசார் பொருள்
  choice: பங்காளி
  alternative: உடன் பங்குபெறுகிறவர்; தோழர்
  rationale: இச்சொல் பவுலுக்கும் பிலேமோனுக்கும் இடையிலான பகிர்ந்த பங்கேற்பையும் உறவையும் குறிக்கிறது. குறிப்பிட்ட திருச்சபை மரபின் தொழில்நுட்பப் பொருளை இறக்குமதி செய்யாமல், வேண்டுகோளின் சமூக மற்றும் விசுவாசக் குழுமச் சார்ந்த வலிமையை ‘பங்காளி’ தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் இயல்பான வாசிப்போட்டமும் காக்கப்பட்டுள்ளன. ஒருமை முகவரியின் மரியாதைத் தன்மையை வெளிப்படுத்த ‘நீங்கள்’ பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறி அது விளக்கும் ‘ஏற்றுக்கொள்ளுங்கள்’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
