  source_fidelity: மூலத்தின் தருக்கத் தொடர்பான Εἰ οὖν (“ஆகவே ... என்றால்”), ἔχεις κοινωνόν என்பதன் உறவுசார் பொருள், προσλαβοῦ-வின் ஏவல், மற்றும் ὡς ἐμέ-வின் ஒப்பீடு ஆகியவை துல்லியமாக வெளிப்படுத்தப்பட்டுள்ளன. ‘என்னை ஏற்றுக்கொள்வதுபோல’ என்பது கிரேக்கத்தில் உட்கிடையாக உள்ள வினையை இயல்பாக நிரப்புகிறது; பொருளைச் சேர்க்கவோ குறைக்கவோ இல்லை.
  naturalness: நவீன நிலையான தமிழில் மரியாதைமிக்க ஒருமை முகவரிக்காக ‘நீங்கள்/கொள்ளுங்கள்’ பயன்படுத்தப்படுவது இயல்பானது. ‘பங்காளி’ இங்கு பகிர்ந்த பங்கேற்பு அல்லது கூட்டுறவைக் குறிக்கும் வகையில் புரிந்துகொள்ளத்தக்கது; வசனத்தின் சுருக்கமான வேண்டுகோள் நடையும் நன்கு காக்கப்பட்டுள்ளது.
  terminology: ‘பங்காளி’ κοινωνός என்பதற்கான ஏற்ற, மதப்பிரிவுசார் தொழில்நுட்பப் பொருளைத் திணிக்காத தேர்வாகும். ‘ஏற்றுக்கொள்ளுங்கள்’ προσλαβοῦ என்பதன் வரவேற்பு, அங்கீகாரம், உறவுரீதியான ஏற்றுக்கொள்ளுதல் ஆகிய திறந்த நிழற்பொருள்களைத் தக்கவைக்கிறது. அடிக்குறிப்பு மாற்று வாசிப்பைச் சரியாகக் காட்டுகிறது.
