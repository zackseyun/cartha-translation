  source_fidelity: மூலத்தின் கால எதிரிணை (ποτέ—νυνὶ δέ), ‘உமக்கு’ என்ற தத்துவை, மற்றும் ‘உமக்கும் எனக்கும்’ என்ற இரட்டை உறவு அனைத்தும் துல்லியமாகக் காக்கப்பட்டுள்ளன. ‘பயனற்றவனாக—பயனுள்ளவனாக’ என்பது ἄχρηστον—εὔχρηστον என்ற திட்டமிட்ட எதிரிணையையும் நன்கு வெளிப்படுத்துகிறது.
  naturalness: ‘முன்பு உமக்குப் பயனற்றவனாக இருந்த அவன், இப்போதோ உமக்கும் எனக்கும் பயனுள்ளவனாக இருக்கிறான்’ என்பது நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதையான கடிதநடைக்கு ஏற்றதாகவும் உள்ளது. ‘இப்போதோ’ காலமாற்றத்தையும் எதிர்மறைத் திருப்பத்தையும் சுருக்கமாகத் தெளிவாக்குகிறது.
  terminology: ‘உமக்கு/உமக்கும்’ என்ற ஒருமை மரியாதை வடிவம் சூழலுக்கு ஏற்றது. ‘பயனற்றவன்—பயனுள்ளவன்’ என்ற சொற்கள் பெயருடனான சாத்தியமான சொல்விளையாட்டை விளக்கமின்றி முதன்மை உரையிலேயே பாதுகாக்கின்றன. அடிக்குறிப்பு அந்தச் சாத்தியத்தை அளவோடு விளக்குகிறது.
