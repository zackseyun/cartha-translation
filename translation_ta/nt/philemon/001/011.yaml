id: PHM.1.11
reference: Philemon 1:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: τόν ποτέ σοι ἄχρηστον νυνὶ ⸀δὲ σοὶ καὶ ἐμοὶ εὔχρηστον,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/011.yaml
  text: who once was useless to you[a], but now is useful both to you and to me,
translation:
  language: ta
  text: முன்பு உமக்குப் பயனற்றவனாக[a] இருந்த அவன், இப்போதோ உமக்கும் எனக்கும் பயனுள்ளவனாக இருக்கிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஒநேசிமு என்ற பெயர் ‘பயனுள்ளவன்’ அல்லது ‘நன்மை தருகிறவன்’ என்ற கருத்துடன் தொடர்புடையது; பவுல் இங்கே அந்தப் பெயரை வைத்து சொல்விளையாட்டு செய்திருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: τόν
  choice: அவன்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட ஒநேசிமுவையே சுட்டுகிறது. தனியாக வாசிக்கப்படும் தமிழ் வசனத்தில் இயல்பான தொடர்ச்சிக்காகச் சுட்டுப்பெயராக மொழிபெயர்க்கப்பட்டது.
- source_word: ποτέ
  choice: முன்பு
  rationale: கடந்த நிலையைக் குறித்து νυνὶ (‘இப்போது’) என்பதுடன் தெளிவான கால முரண்பாட்டை உருவாக்குகிறது.
- source_word: σοι
  choice: உமக்கு
  rationale: பிலேமோனை நோக்கிய ஒருமை மரியாதை வடிவம்; ἄχρηστον என்பதுடன் உள்ள தத்துவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: ἄχρηστον
  choice: பயனற்றவனாக
  rationale: ‘பயனில்லாதவர்’ என்ற நேரடியான பொருளைத் தருவதோடு, εὔχρηστον என்பதுடனான எதிரிணையையும் ஒநேசிமு என்ற பெயருடனான சாத்தியமான சொல்விளையாட்டையும் காக்கிறது.
- source_word: νυνὶ δὲ
  choice: இப்போதோ
  rationale: முந்தைய நிலையுடன் உள்ள வலுவான கால எதிர்மறையைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: σοὶ καὶ ἐμοὶ
  choice: உமக்கும் எனக்கும்
  rationale: இருவரையும் இணையாக வலியுறுத்தும் கிரேக்க அமைப்பைத் தமிழில் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: εὔχρηστον
  choice: பயனுள்ளவனாக
  rationale: ‘பயனுள்ள/உதவியான’ என்ற பொருளைத் தருகிறது; ἄχρηστον என்பதுடனான சொல்லமைப்பு சார்ந்த நேரடி எதிரிணையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ஒநேசிமுவின் பெயருடனான சாத்தியமான சொல்விளையாட்டும் அவரது மாறிய நிலையும்
  choice: முதன்மை உரையில் ‘பயனற்றவன்—பயனுள்ளவன்’ என்ற எளிய எதிரிணையைப் பேணுதல்
  alternative: ‘இப்போது உண்மையிலேயே பயனுள்ளவன்’ போன்ற விளக்கமான சொற்களைச் சேர்த்து சொல்விளையாட்டை முன்னிறுத்துதல்
  rationale: கிரேக்க உரையே இந்த எதிரிணையைத் தெளிவாகக் காட்டுகிறது. கூடுதல் விளக்கத்தை முதன்மை உரைக்குள் சேர்க்காமல் இலக்கிய விளைவைப் பாதுகாப்பது மூலத்துக்கு நெருக்கமானது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் இணைந்த நடை பயன்படுத்தப்பட்டுள்ளது. பிலேமோனை நோக்கிய ஒருமை மரியாதையைத் தக்கவைக்க ‘உமக்கு’ தேர்ந்தெடுக்கப்பட்டது. கிரேக்கத்தில் வெளிப்படையாக இல்லாத இணைப்புவினை, தனிவசனமாகத் தமிழில் இயல்பாகவும் முழுமையாகவும் வாசிக்க ‘இருக்கிறான்’ என வெளிப்படுத்தப்பட்டுள்ளது.
