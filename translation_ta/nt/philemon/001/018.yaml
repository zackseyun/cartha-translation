  text: εἰ δέ τι ἠδίκησέν σε ἢ ὀφείλει, τοῦτο ἐμοὶ ⸀ἐλλόγα·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/018.yaml
  text: But if he has wronged you in any way or owes you anything[a], charge this to me.
translation:
  language: ta
  text: ஆனால், அவன் உனக்கு ஏதாவது அநீதி செய்திருந்தால் அல்லது உனக்கு ஏதாவது கடன்பட்டிருந்தால், அதை என் கணக்கில் சேர்த்துக்கொள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதை எனக்குப் பொறுப்பாகக் கணக்கிடு.’ இங்கு வரும் வினைச்சொல், ஒரு தொகையையோ பொறுப்பையோ ஒருவருடைய கணக்கில் சேர்த்துக் கணக்கிடும் பொருளைக் கொண்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: ஆனால் ... இருந்தாலோ
  rationale: εἰ நிபந்தனையையும் δέ முந்தைய கருத்திலிருந்து மென்மையான மாறுபாட்டையும் தொடர்ச்சியையும் காட்டுகிறது. தமிழில் ‘ஆனால்’ மற்றும் நிபந்தனை வினைமுற்று இதை இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: τι
  choice: ஏதாவது
  rationale: குறிப்பிடப்படாத எந்தவொரு தவறு அல்லது பாதிப்பையும் உள்ளடக்கும் வகையில் τι என்பதன் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: ἠδίκησέν σε
  choice: அவன் உனக்கு ஏதாவது அநீதி செய்திருந்தாலோ
  rationale: ἀδικέω என்பது ஒருவருக்கு அநீதி செய்வது அல்லது தீங்கு இழைப்பது என்ற பரந்த பொருளுடையது. ‘அநீதி செய்திருந்தால்’ என்பது பொருளாதார இழப்பாக மட்டும் குறுக்காமல் ஒழுக்க மற்றும் தனிப்பட்ட தவறையும் உள்ளடக்குகிறது.
- source_word: ἢ ὀφείλει
  choice: உனக்கு ஏதாவது கடன்பட்டிருந்தாலோ
  rationale: ὀφείλω இங்கு கடன் அல்லது செலுத்த வேண்டிய பொறுப்பைக் குறிக்கிறது. சூழலிலிருந்து பெறப்படும் ‘உனக்கு’ என்பதை வெளிப்படையாகச் சொல்லி நிதி சார்ந்த நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: τοῦτο
  choice: அதை
  rationale: முன்னர் கூறப்பட்ட அநீதியையோ கடனையோ பின்னோக்கிச் சுட்டுகிறது; நவீன தமிழில் ‘அதை’ இயல்பான சுட்டுப்பெயர்.
- source_word: ἐμοὶ ἐλλόγα
  choice: என் கணக்கில் எழுதிவை
  rationale: ἐλλογέω கணக்கில் பதிவு செய்தல் அல்லது ஒருவரின் பொறுப்பாகக் கணித்தல் என்ற வணிகக் கணக்கியல் பொருளைக் கொண்டது. ‘என் கணக்கில் எழுதிவை’ அந்த உருவகத்தைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
theological_decisions:
- issue: கணக்கில் சேர்த்தல் என்ற சொல்லின் இறையியல் விரிவாக்கம்
  choice: வசனத்தில் உள்ள வணிகக் கணக்கியல் உருவகத்தை மட்டும் நேரடியாகப் பாதுகாத்தல்
  alternative: ‘என்மேல் சுமத்து’ அல்லது இறையியல் சார்ந்த ‘எனக்குக் கணித்துக்கொள்’ என்று மொழிபெயர்த்தல்
  rationale: இச்சூழலில் பவுல் ஒநேசிமுவின் தவறு அல்லது கடனைத் தானே ஏற்க முன்வருகிறார். இதிலிருந்து மேலதிகமான பரிகார அல்லது நீதிமானாக்குதல் கோட்பாட்டை மொழிபெயர்ப்புக்குள் சேர்ப்பது மூலத்தின் வெளிப்படையான கருத்தை மீறும்.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையுடனும் சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் அமைக்கப்பட்டது. ‘என் கணக்கில் எழுதிவை’ என்பது அன்றாடத் தெளிவையும் மூலத்தின் கணக்கியல் உருவகத்தையும் ஒருங்கே காக்கிறது.
