reference: Philemon 1:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: οὐκέτι ὡς δοῦλον ἀλλὰ ὑπὲρ δοῦλον, ἀδελφὸν ἀγαπητόν, μάλιστα ἐμοί, πόσῳ δὲ μᾶλλον σοὶ καὶ ἐν σαρκὶ καὶ ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/016.yaml
  text: no longer as a servant[a], but more than a servant, a beloved brother—especially to me, but how much more to you[b], both in the flesh and in the Lord.
translation:
  language: ta
  text: இனி அடிமையாக அல்ல, அடிமையைவிட மேலானவராக, அன்புக்குரிய சகோதரராக—எனக்குக் குறிப்பாக அப்படியானவர் என்றால், உனக்கு மாம்சத்திலும் ஆண்டவரிலும் எவ்வளவு அதிகமாக இருப்பார்!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκέτι
  choice: இனி ... அல்ல
  rationale: முந்தைய நிலையிலிருந்து ஏற்பட்ட மாற்றத்தைக் குறிக்கும் கால மறுப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: ὡς δοῦλον
  choice: அடிமையாக
  rationale: ஒநேசிமுவின் கட்டுண்ட சமூக நிலையைக் கருத்தில் கொண்டு δοῦλος என்பதன் வலிமையை ‘அடிமை’ நேரடியாகத் தக்கவைக்கிறது.
- source_word: ὑπὲρ δοῦλον
  choice: அடிமையைவிட மேலானவராக
  rationale: ὑπέρ இங்கு பதிலீட்டைக் குறிக்காமல், நிலை மற்றும் மதிப்பில் விஞ்சியிருப்பதைக் குறிக்கிறது.
- source_word: ἀδελφὸν ἀγαπητόν
  choice: அன்புக்குரிய சகோதரராக
  rationale: கிறிஸ்தவக் குடும்ப உறவைக் குறிக்கும் உருவகத்தையும் அன்பின் தன்மையையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: μάλιστα ἐμοί
  choice: குறிப்பாக எனக்கு
  rationale: பவுலுடனான உறவின் சிறப்பான அளவைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: πόσῳ δὲ μᾶλλον σοὶ
  choice: உனக்கோ ... எவ்வளவு அதிகமாக!
  rationale: பவுலிடமிருந்து பிலேமோனுக்குச் செல்லும் ஒப்பீட்டின் வலியுறுத்தலையும் வியப்பு நிறைந்த சொல்லாட்சியையும் தக்கவைக்கிறது.
- source_word: ἐν σαρκὶ
  choice: மாம்சத்திலும்
  rationale: பவுலின் சொற்றொடரிலுள்ள உடல், இவ்வுலக வாழ்க்கை, சமூக உறவு ஆகிய பொருள் சாத்தியங்களை ஒரே விளக்கமாகச் சுருக்காமல் பாதுகாக்கிறது; தவறான புரிதலை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: ἐν κυρίῳ
  choice: ஆண்டவரிலும்
  rationale: ஆண்டவரோடுள்ள ஒன்றிப்பிலும் கிறிஸ்தவ உறவிலும் இருப்பதைக் குறிக்கும் பவுலின் செறிவான சொல்லாட்சியை மிகைப்படுத்தாமல் தக்கவைக்கிறது.
theological_decisions:
- issue: ஒநேசிமுவின் சூழலில் δοῦλος என்பதன் மொழிபெயர்ப்பு
  choice: அடிமை
  alternative: பணியாள்; கட்டுண்ட பணியாளர்
  rationale: கடிதத்தின் சமூகச் சூழலில் ஒநேசிமுவின் கட்டுண்ட நிலை முக்கியமானது. ‘அடிமை’ என்பது அந்த வரலாற்று உண்மையையும் ‘அடிமையைவிட மேலானவர்’ என்ற முரணின் வலிமையையும் காக்கிறது.
- issue: ἐν σαρκὶ καὶ ἐν κυρίῳ என்பதன் பொருள்
  choice: மாம்சத்திலும் ஆண்டவரிலும்
  alternative: இவ்வுலக மனித உறவிலும் ஆண்டவரிலும்; நேரிலும் ஆண்டவரிலும்
  rationale: இது பிலேமோனுக்கும் ஒநேசிமுவுக்கும் இடையிலான மனித/சமூக உறவையும் ஆண்டவருக்குள் உள்ள ஆன்மிக உறவையும் இணைக்கலாம். மூலத்தின் செறிவையும் பொருள் விரிவையும் முதன்மை உரை காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் மூலவாக்கியத்தின் செறிவும் காக்கப்பட்டுள்ளன. முந்தைய வசனத்தைச் சார்ந்துள்ள கிரேக்க வாக்கிய அமைப்பு தேவையற்ற வினைச்சொல் சேர்க்காமல் தொடரப்பட்டுள்ளது. ‘மாம்சம்’ என்ற பவுலின் பலபொருள் சொல்லாட்சி முதன்மை உரையில் பாதுகாக்கப்பட்டு, சாதாரண வாசகர் தவறாகப் புரிந்துகொள்ளாதபடி அடிக்குறிப்பு வழங்கப்பட்டுள்ளது.
