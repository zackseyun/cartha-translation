id: PHM.1.8
reference: Philemon 1:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: Διό, πολλὴν ἐν Χριστῷ παρρησίαν ἔχων ἐπιτάσσειν σοι τὸ ἀνῆκον,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/008.yaml
  text: Therefore[a], though I have much boldness in Messiah to command you to do what is proper[b],
translation:
  language: ta
  text: ஆகவே, முறையானதைச் செய்யும்படி உனக்குக் கட்டளையிட மேசியாவுக்குள் எனக்கு மிகுந்த துணிவு இருந்தாலும்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διό
  choice: ஆகவே
  rationale: முந்தைய கருத்திலிருந்து வரும் முடிவை இயல்பான தமிழில் தெளிவாக இணைக்கிறது.
- source_word: πολλὴν ... παρρησίαν
  choice: மிகுந்த துணிவு
  rationale: παρρησία குறிக்கும் துணிவு, தன்னம்பிக்கை, வெளிப்படையாகப் பேசும் உரிமை ஆகிய நிழற்பொருள்களை மிகையாகக் குறுக்காமல், πολλήν என்பதன் வலிமையையும் காக்கிறது.
- source_word: ἐν Χριστῷ
  choice: மேசியாவுக்குள்
  rationale: Χριστός இங்கு பட்டமாகச் செயல்படுகிறது. ‘மேசியா’ அதன் பட்டத்தன்மையைத் தக்கவைக்கிறது; ἐν என்பதன் பவுலுக்குரிய உறவு அல்லது செயல்பாட்டு வட்டம் சார்ந்த விரிவை ‘-க்குள்’ குறுக்காமல் வெளிப்படுத்துகிறது.
- source_word: ἔχων
  choice: எனக்கு ... இருந்தாலும்
  rationale: அடுத்த வசனத்தில் வரும் வேண்டுகோளோடு உள்ள முரண்பாட்டை முன்னிறுத்தும் concessive participle என்பதால் ‘இருந்தாலும்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: ἐπιτάσσειν
  choice: கட்டளையிட
  rationale: ἐπιτάσσω என்பதிலுள்ள அதிகாரப்பூர்வமான ஆணையிடும் வலிமையை நேரடியாகத் தருகிறது.
- source_word: σοι
  choice: உனக்கு
  rationale: ஒருமை இரண்டாம் நபர் தத்திவைப் பாதுகாத்து, பிலேமோனை நேரடியாகச் சுட்டுகிறது.
- source_word: τὸ ἀνῆκον
  choice: உனக்குத் தகுந்ததைச் செய்யும்படி
  rationale: ἀνήκω குறிக்கும் பொருத்தமான அல்லது முறையான செயலை இயல்பான தமிழில் தருகிறது; ‘செய்யும்படி’ என்பது கட்டளையின் உள்ளடக்கத்தைத் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: Χριστῷ என்பதன் மொழியாக்கம்
  choice: மேசியா
  alternative: கிறிஸ்து
  rationale: இச்சொல் வெறும் பெயராக அல்லாமல் பட்டமாகப் பயன்படுகிறது. ‘மேசியா’ அதன் பட்டத்தன்மையைத் தெளிவாக வைத்திருக்கிறது; மாற்று மரபுவழி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ἔχων என்பதன் தர்க்க உறவு
  choice: இருந்தாலும்
  alternative: இருப்பதால்
  rationale: 9ஆம் வசனத்தில் அன்பின் அடிப்படையில் வேண்டிக்கொள்வதோடு இது முரண்படுத்தப்படுகிறது. ஆகவே சூழல் concessive பொருளை ஆதரிக்கிறது; காரணப் பொருளாக மாற்றப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் எளிமையும் இணைந்த நடை பயன்படுத்தப்பட்டுள்ளது. இது 9ஆம் வசனத்தில் நிறைவுபெறும் வாக்கியம் என்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. ஒருமை இரண்டாம் நபரான σοι என்பதற்கு இயல்பான ‘உனக்கு’ பயன்படுத்தப்பட்டுள்ளது; அவமரியாதை நிழல் இல்லை.
