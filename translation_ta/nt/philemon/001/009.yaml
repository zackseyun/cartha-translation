reference: Philemon 1:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: διὰ τὴν ἀγάπην μᾶλλον παρακαλῶ, τοιοῦτος ὢν ὡς Παῦλος πρεσβύτης νυνὶ δὲ καὶ δέσμιος ⸂Χριστοῦ Ἰησοῦ⸃—
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/009.yaml
  text: because of love I rather appeal[a], being such a one as Paul, an old man[c][b], and now also a prisoner of Messiah Jesus—
translation:
  language: ta
  text: அன்பின் காரணமாக, நான் மாறாக வேண்டிக்கொள்கிறேன்; பவுலாகிய நான் முதியவனும்[b], இப்போது மெசியா இயேசுவின் கைதியுமாக[c] இருக்கிறேன்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: அல்லது, “பவுல், ஒரு தூதுவர்”; ஆனால் கிரேக்கச் சொல் இயல்பாக “முதியவன்” என்றே பொருள்படும்.
    reason: alternative_reading
  - marker: c
    text: கிரேக்கத்தில், “கிறிஸ்து இயேசு”; Χριστός இங்கு பட்டமாகச் செயல்படுவதால் “மெசியா இயேசு” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τὴν ἀγάπην
  choice: அன்பின் காரணமாக
  rationale: διά + accusative இங்கு காரணத்தை வெளிப்படுத்துகிறது. இந்தத் தேர்வு ἀγάπη என்பதன் பொதுவான பொருளையும் தொடரின் காரணவியல் வலிமையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: μᾶλλον παρακαλῶ
  choice: நான் கட்டளையிடாமல் வேண்டிக்கொள்கிறேன்
  rationale: μᾶλλον முந்தைய வசனத்திலுள்ள கட்டளையிடும் வாய்ப்புக்கு மாறான பவுலின் தேர்வைக் காட்டுகிறது; தமிழில் ஒப்பீட்டின் மறைந்துள்ள எதிர்மறையை வெளிப்படுத்துவது இயல்பாகவும் தெளிவாகவும் உள்ளது. παρακαλῶ இங்கு உறவுசார் வேண்டுகோள்; வெறும் கேள்வியோ அதிகாரக் கட்டளையோ அல்ல.
- source_word: τοιοῦτος ὢν ὡς Παῦλος
  choice: பவுலாகிய நான் ... இருப்பதோடு
  rationale: கிரேக்கத் தொடர் சற்றே நீள்வட்டமான சுயவிவரிப்பு. சொற்சொல்லான அசட்டுத்தன்மையைத் தவிர்த்து, பின்வரும் இரு அடையாளங்களையும் இணைக்கும் இயல்பான தமிழாக்கம் தரப்பட்டுள்ளது.
- source_word: πρεσβύτης
  choice: முதியவன்
  rationale: இச்சொல்லின் இயல்பான பொருள் வயதான ஆண். சபை மூப்பர் என்ற பதவியையோ வேறொரு கிரேக்கச் சொல்லுடன் தொடர்புடைய தூதர் என்ற பொருளையோ இங்கு இறக்குமதி செய்யவில்லை.
- source_word: νυνὶ δὲ καὶ
  choice: இப்போது ... ஆகவும்
  rationale: νυνί என்பதன் கால வலியுறுத்தலையும் καί என்பதன் கூடுதல் அடையாளத்தையும் தமிழ் இணைப்பமைப்பு காக்கிறது.
- source_word: δέσμιος
  choice: கைதி
  rationale: சிறைப்படுத்தப்பட்ட ஒருவரை நேரடியாகக் குறிக்கிறது; சங்கிலியில் இருப்பவர் என்ற உருவக விரிவாக்கம் சேர்க்கப்படவில்லை.
- source_word: Χριστοῦ Ἰησοῦ
  choice: மெசியா இயேசுவின்
  rationale: Χριστός இங்கு இயேசுவின் பட்டமாக இன்னும் கேட்கப்படுவதால் ‘மெசியா’ என மொழிபெயர்க்கப்பட்டுள்ளது. Genitive பவுல் மெசியாவுக்குரிய அல்லது அவரினிமித்தம் சிறைப்பட்ட கைதி என்ற சுருக்கமான உறவைத் திறந்தே வைக்கிறது.
theological_decisions:
- issue: πρεσβύτης என்பதன் பொருள்
  choice: முதியவன்
  alternative: தூதுவர்; மூப்பர்
  rationale: உரையில் இருப்பது வயதைக் குறிக்கும் πρεσβύτης; ‘தூதுவர்’ என்பதற்குரிய πρεσβευτής அல்ல. சபைப் பதவியைக் குறிக்கும் சூழலும் இல்லை. மாற்று மரபு அடிக்குறிப்பில் பதிவு செய்யப்படுகிறது.
- issue: Χριστός என்பதன் மொழியாக்கம்
  choice: மெசியா
  alternative: கிறிஸ்து
  rationale: இங்கு அந்தச் சொல் வெறும் பெயர்போல் அல்லாமல் பட்டத்தின் வலிமையுடன் உள்ளது. ஆகவே ‘மெசியா’ தேர்ந்தெடுக்கப்பட்டது; பரவலான மரபுவழி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: δέσμιος Χριστοῦ Ἰησοῦ என்பதிலுள்ள genitive உறவு
  choice: மெசியா இயேசுவின் கைதி
  alternative: மெசியா இயேசுவினிமித்தம் கைதியானவன்
  rationale: கிரேக்கம் உரிமை, பற்றுறுதி அல்லது அவரினிமித்தமான சிறைவாசம் ஆகிய நுணுக்கங்களைச் சுருக்கமாகத் தாங்க முடியும். முதன்மை உரை அந்தத் தெய்வவியல் மற்றும் சொற்றொடரியல் செறிவைத் தீர்மானித்து விடாமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் தனிப்பட்ட வேண்டுகோளின் மென்மையும் காக்கப்பட்டுள்ளன. வசனம் கிரேக்கத்தில் அடுத்த வசனத்தை நோக்கி நீளுவதால் இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது. ‘கட்டளையிடாமல்’ என்பது முந்தைய வசனத்தின் தெளிவான எதிர்மறையை இயல்பான தமிழில் எடுத்துரைக்கிறது.
