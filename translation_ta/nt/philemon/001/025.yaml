  text: Ἡ χάρις τοῦ ⸀κυρίου Ἰησοῦ Χριστοῦ μετὰ τοῦ πνεύματος ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/025.yaml
  text: The grace of the Lord Jesus Christ be with your spirit[a][b].
translation:
  language: ta
  text: ஆண்டவராகிய இயேசு கிறிஸ்துவின் அருள் உங்கள் ஆவியோடு இருப்பதாக.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உங்கள்’ என்பது பன்மை. ஆகவே இந்த இறுதி ஆசிவாழ்த்து பிலேமோனை மட்டும் அல்லாமல், கடிதத்தைப் பெற்றுக் கூடியிருந்த மற்றவர்களையும் உள்ளடக்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: அருள்
  rationale: பவுலின் ஆசிவாழ்த்து மொழியில் கடவுளிடமிருந்து வரும் கிருபையான தயவையும் ஆசீர்வாதத்தையும் குறிக்கும் இயல்பான, நிலைபெற்ற தமிழ் சொல்.
- source_word: κυρίου
  choice: ஆண்டவராகிய
  rationale: இயேசுவுக்குரிய பட்டத்தின் புதிய ஏற்பாட்டு மற்றும் கிறிஸ்துவியல் வலிமையைத் தக்கவைக்கிறது; தமிழில் பெயருடன் இயல்பாக இணைகிறது.
- source_word: Ἰησοῦ Χριστοῦ
  choice: இயேசு கிறிஸ்துவின்
  rationale: Χριστός இங்கு இயேசுவின் மேசியாப் பட்டத்தைத் தாங்கினாலும், நவீனத் தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் ‘கிறிஸ்து’ அந்தப் பட்டத்தை இயல்பாகவும் தெளிவாகவும் சுமக்கிறது; அதை வெறும் குடும்பப்பெயராக விளக்கவில்லை.
- source_word: μετὰ
  choice: ஓடு இருப்பதாக
  rationale: வினையற்ற கிரேக்க ஆசிவாழ்த்தை இயல்பான தமிழில் வெளிப்படுத்த ‘இருப்பதாக’ சேர்க்கப்படுகிறது; μετὰ என்பதன் ‘உடன்’ பொருள் ‘ஓடு’ மூலம் தக்கவைக்கப்படுகிறது.
- source_word: πνεύματος
  choice: ஆவி
  rationale: உரிமைப் பெயர்ச்சொல்லுடன் வரும் இச்சொல் பெறுநர்களின் ஆவி அல்லது உள்ளார்ந்த மனிதரைச் சுட்டுகிறது; பரிசுத்த ஆவி என்று உரை வெளிப்படையாகக் கூறாததால் கூடுதல் விளக்கம் சேர்க்கப்படவில்லை.
- source_word: ὑμῶν
  choice: உங்கள்
  rationale: இரண்டாம் நபர் பன்மையைத் தமிழின் ‘உங்கள்’ நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; ஆசிவாழ்த்து பிலேமோனை மட்டும் அல்லாமல் கடிதத்தின் கூடியிருந்த பெறுநர்களையும் உள்ளடக்குகிறது.
theological_decisions:
- issue: Χριστοῦ என்பதைக் கடைசி ஆசிவாழ்த்தில் மொழிபெயர்த்தல்
  choice: கிறிஸ்து
  alternative: மேசியா
  rationale: Χριστός பட்டத்தன்மை கொண்டது. எனினும் ‘கிறிஸ்து’ நவீன நிலையான தமிழில் அந்தப் பட்டத்தின் அடையாளத்தையும் திருச்சபை வாசிப்பின் இயல்பையும் காக்கிறது; ‘மேசியா’ என்பது பொருளை வெளிப்படையாக்கும் மாற்று, ஆனால் இச்சூத்திரத்தில் தேவையற்ற நடையியல் மாற்றத்தை ஏற்படுத்தும்.
- issue: ‘உங்கள் ஆவி’ என்பதில் ஆவியின் குறிப்பு
  choice: பெறுநர்களின் மனித ஆவி / உள்ளார்ந்த மனிதர்
  alternative: பரிசுத்த ஆவி
  rationale: ὑμῶν என்ற பன்மை உரிமைப் பெயர் பெறுநர்களின் ஆவியையே முதன்மையாகச் சுட்டுகிறது. மூலத்தில் இல்லாத ‘பரிசுத்த’ என்ற சொல்லையோ பெரிய எழுத்து வழி விளக்கத்தையோ சேர்க்காமல் உரையின் அளவிலேயே மொழிபெயர்க்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசிப்புக்கும் தனிப்பட்ட வாசிப்புக்கும் ஏற்ற கண்ணியமான ஆசிவாழ்த்து நடை. மூலத்தின் வினையற்ற அமைப்பு தமிழில் முழுமையடைய ‘இருப்பதாக’ சேர்க்கப்பட்டது. ‘உங்கள்’ என்பதே பன்மையைத் தெளிவாகக் காட்டுவதால் அதைப் பிரதான உரையில் வைத்துப் பரப்பை அடிக்குறிப்பில் விளக்கியுள்ளோம்.
