  text: Εὐχαριστῶ τῷ θεῷ μου πάντοτε μνείαν σου ποιούμενος ἐπὶ τῶν προσευχῶν μου,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/004.yaml
  text: I always thank my God[a], making mention of you in my prayers,
translation:
  language: ta
  text: என் ஜெபங்களில் உன்னை நினைவுகூர்ந்து[a], நான் எப்போதும் என் கடவுளுக்கு நன்றி செலுத்துகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் ஜெபங்களில் உன்னைப் பற்றிக் குறிப்பிடும்போது.” கிரேக்க மொழியில் இன்னும் சொல்லுக்கு நெருக்கமாக, “உன்னைப் பற்றிக் குறிப்புச் செய்துகொண்டு” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: நன்றி செலுத்துகிறேன்
  rationale: நிகழ்காலச் செயப்பாட்டு வினையின் முதலாம் நபர் ஒருமையை இயல்பான, கண்ணியமான தமிழில் நேரடியாகத் தருகிறது.
- source_word: τῷ θεῷ μου
  choice: என் கடவுளுக்கு
  rationale: εὐχαριστέω என்பதுடன் வரும் வேற்றுமை வடிவம் நன்றி செலுத்தப்படுபவரைக் குறிக்கிறது; ‘என்’ என்ற தனிப்பட்ட உறவுச் சொல்லும் தக்கவைக்கப்படுகிறது.
- source_word: πάντοτε
  choice: எப்போதும்
  rationale: தொடர்ச்சியான வழக்கத்தையோ நிலையான முறையையோ குறிக்கும் இயல்பான நவீனத் தமிழ் இணைச்சொல்.
- source_word: μνείαν σου ποιούμενος
  choice: உன்னை நினைவுகூர்ந்து
  rationale: இச்சூழலில் இந்தக் கிரேக்க மரபுத்தொடர் ஜெபத்தில் ஒருவரைக் குறிப்பிட்டு நினைவுகூர்வதைக் குறிக்கிறது. தமிழில் ‘உன்னைப் பற்றிக் குறிப்பிடும்போது’ என்பது ஜெபச் சூழலில் இயல்புக் குறைவாக இருப்பதால், முதன்மை உரையில் இயல்பான பொருள் தரப்பட்டு, சொல்லுக்கு நெருக்கமான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: என் ஜெபங்களில்
  rationale: ἐπί + பிறப்புவேற்றுமை இங்கு ஜெபம் செய்யும் சந்தர்ப்பத்தைக் குறிக்கிறது; ‘என் ஜெபங்களில்’ என்பது சுருக்கமானதும் இயல்பானதும் ஆகும்.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. கிரேக்கச் சொல் வரிசையை அப்படியே பின்பற்றாமல் தமிழின் இயல்பான வாக்கிய அமைப்பு தேர்ந்தெடுக்கப்பட்டுள்ளது; அதேவேளை பங்கேற்பு வினைக்கும் முதன்மை வினைக்கும் இடையிலான தொடர்பு பாதுகாக்கப்பட்டுள்ளது.
