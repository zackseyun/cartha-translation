  text: Παῦλος δέσμιος Χριστοῦ Ἰησοῦ καὶ Τιμόθεος ὁ ἀδελφὸς Φιλήμονι τῷ ἀγαπητῷ καὶ συνεργῷ ἡμῶν
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/001.yaml
  text: Paul[a], a prisoner of Messiah Jesus, and Timothy our brother, to Philemon our beloved fellow worker[b],
translation:
  language: ta
  text: 'மெசியாவாகிய இயேசுவின் கைதியான பவுலும்,[a] நம் சகோதரரான தீமோத்தேயுவும், எங்கள் அன்புக்குரிய உடன் ஊழியரான பிலேமோனுக்கு:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மெசியாவாகிய இயேசுவுக்காகக் கைதியான பவுலும்” என்றும் பொருள் கொள்ளலாம். கிரேக்க வேற்றுமைத் தொடர் இயேசுவுடனான உறவையோ, அவருக்காகச் சிறைப்பட்டதற்கான காரணத்தையோ குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: δέσμιος
  choice: கைதி
  rationale: கட்டுண்ட அல்லது சிறையில் வைக்கப்பட்ட ஒருவரைக் குறிக்கும் பெயர்ச்சொல்; நவீனத் தமிழில் இயல்பானதும் நேரானதும் ‘கைதி’.
- source_word: Χριστοῦ Ἰησοῦ
  choice: கிறிஸ்துவாகிய இயேசுவின்
  rationale: Χριστός இங்கு பட்டப்பெயரின் பொருளைத் தக்கவைக்கிறது; ‘கிறிஸ்துவாகிய’ என்பது இயேசுவுடன் அதனை இயல்பாக இணைக்கிறது. எழுவாய் உறவின் சுருக்கத்தையும் ‘-இன்’ காக்கிறது.
- source_word: ὁ ἀδελφὸς
  choice: நம் சகோதரன்
  rationale: கிரேக்கத்தில் சொற்பட ‘அந்தச் சகோதரன்’ என்றிருந்தாலும், கிறிஸ்தவக் குடும்ப உறவை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்த ‘நம் சகோதரன்’ என வழங்கப்படுகிறது.
- source_word: ἀγαπητῷ
  choice: நமக்கு அன்பான
  rationale: அன்புக்குரியவர் என்ற உறவின் வெம்மையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: συνεργῷ
  choice: உடன் ஊழியர்
  rationale: சேர்ந்து உழைப்பவரைக் குறிக்கிறது; பவுலின் பணிச்சூழலில் உள்ள ஊழியத் தொடர்பையும் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: ἡμῶν
  choice: நமக்கு / நம்
  rationale: பவுல் மற்றும் தீமோத்தேயு என்ற இணை அனுப்புநர்களைக் குறிக்கும் பன்மையைத் தக்கவைக்கிறது.
- source_word: Φιλήμονι
  choice: பிலேமோனுக்கு
  rationale: கடித முகவரியைக் குறிக்கும் வேற்றுமையை தமிழின் ‘-க்கு’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: καὶ Τιμόθεος
  choice: தீமோத்தேயுவும்
  rationale: தீமோத்தேயுவை பவுலுடன் இணை அனுப்புநராக ‘-உம்’ இணைப்பால் காட்டுகிறது.
theological_decisions:
- issue: Χριστός என்பதன் மொழிபெயர்ப்பு
  choice: கிறிஸ்துவாகிய
  alternative: கிறிஸ்து / மெசியா
  rationale: இங்கு Χριστός வெறும் குடும்பப்பெயர்போல் அல்லாமல் பட்டப்பெயரின் வலிமையைக் கொண்டுள்ளது. தமிழ்ச் சூழலில் அறியப்பட்ட ‘கிறிஸ்து’ என்பதுடன் ‘ஆகிய’ சேர்ப்பது அந்தப் பட்டப்பெயர் தன்மையைத் தெளிவாக்குகிறது.
- issue: δέσμιος Χριστοῦ Ἰησοῦ என்ற எழுவாய் உறவு
  choice: கிறிஸ்துவாகிய இயேசுவின் கைதி
  alternative: கிறிஸ்துவாகிய இயேசுவுக்காகக் கைதியானவன்
  rationale: கிரேக்க எழுவாய் உறவு இயேசுவுக்குச் சொந்தமான கைதி என்ற உறவையோ, அவருக்காகச் சிறைப்பட்டவன் என்ற காரணத்தையோ சுட்டலாம். முதன்மை உரை சுருக்கமான உறவைத் தக்கவைத்து, மாற்றுப் பொருளை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான கடிதத் தொடக்க நடை பயன்படுத்தப்பட்டுள்ளது. கிரேக்கத்தில் வெளிப்படையாக இல்லாத ‘எழுதுவது’ தமிழில் முழுமையான முகவுரை அமையச் சேர்க்கப்பட்டுள்ளது. வசனம் அடுத்த முகவரிப் பட்டியலுக்குத் தொடர்வதால் இறுதியில் முக்காற்புள்ளி வைக்கப்பட்டுள்ளது.
