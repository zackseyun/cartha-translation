- from: கிறிஸ்துவாகிய இயேசுவின் கைதியாகிய பவுலும், நம் சகோதரனாகிய தீமோத்தேயுவும், நமக்கு அன்பான உடன் ஊழியரான பிலேமோனுக்கு எழுதுவது:[a]
