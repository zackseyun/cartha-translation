  rationale: The revision removes the unsupported added writing expression, uses a direct and natural Tamil epistolary salutation, moves the footnote anchor to the phrase it explains, and renders Χριστός as “மெசியா” to preserve the title sense specified in the POB audit trail. The ambiguous genitive relationship in “மெசியாவாகிய இயேசுவின் கைதியான” remains unexpanded in the main text and is responsibly noted as an alternative.
