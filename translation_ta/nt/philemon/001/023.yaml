  yaml_path: translation/nt/philemon/001/023.yaml
  text: Epaphras[a], my fellow prisoner in Messiah Jesus, greets you.
translation:
  language: ta
  text: மேசியாவாகிய இயேசுவுக்குள்[a] என் உடன்கைதியான எப்பாப்பிரா உனக்கு வாழ்த்துத் தெரிவிக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, பாரம்பரியமாக, “கிறிஸ்து இயேசுவுக்குள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεταί
  choice: வாழ்த்துச் சொல்கிறார்
  rationale: இச்சூழலில் ἀσπάζομαι என்பது ஒருவருக்கு வாழ்த்துத் தெரிவிப்பதைக் குறிக்கிறது; இத்தமிழாக்கம் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: σε
  choice: உனக்கு
  rationale: இது இரண்டாம் நபர் ஒருமை வடிவம்; பிலேமோனை நேரடியாகக் குறிக்கும் ஒருமையைத் தமிழில் வெளிப்படையாகப் பேணுகிறது.
- source_word: Ἐπαφρᾶς
  choice: எப்பாப்பிரா
  rationale: தனிப்பெயர் தமிழில் வழக்கமான ஒலிபெயர்ப்பு மரபின்படி வழங்கப்படுகிறது.
- source_word: ὁ συναιχμάλωτός μου
  choice: என் உடன்கைதியாக இருக்கும்
  rationale: συναιχμάλωτος என்பது மற்றொருவருடன் கைதியாக இருப்பவரைக் குறிக்கிறது. ‘உடன்கைதி’ மூலத்தின் கூட்டு உறவைச் சுருக்கமாகவும் இயல்பாகவும் பேணுகிறது.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: மேசியாவாகிய இயேசுவுக்குள்
  rationale: ἐν என்பதைக் ‘உக்குள்’ எனப் பேணி, பவுலின் மேசியாவுடனான ஒன்றிப்பைச் சுட்டும் தனித்துவமான மொழியை மங்கச் செய்யவில்லை. Χριστός இங்கு பட்டப்பெயரின் வலிமையைத் தக்கவைத்திருப்பதால் ‘மேசியா’ எனப் பொருளாக்கப்பட்டுள்ளது; Ἰησοῦ தனிப்பெயராக ‘இயேசு’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: ἐν Χριστῷ Ἰησοῦ என்ற பவுலின் தொடரில் Χριστῷ என்பதன் மொழிபெயர்ப்பு
  choice: மேசியாவாகிய இயேசுவுக்குள்
  alternative: கிறிஸ்து இயேசுவுக்குள்
  rationale: இவ்விடத்தில் Χριστός வெறும் தனிப்பெயராக மட்டுமல்லாமல் பட்டப்பெயரின் பொருளையும் தக்கவைத்துள்ளது. ஆகவே ‘மேசியா’ முதன்மை உரையில் இடம் பெறுகிறது; பாரம்பரியமான ‘கிறிஸ்து’ வடிவம் அடிக்குறிப்பில் தரப்படுகிறது. ἐν தரும் ஒன்றிப்பு மொழியும் அப்படியே பேணப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பிலேமோனை நோக்கிய ஒருமைச் சுட்டைத் தெளிவாகப் பேணும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘உடன்கைதி’ மூலச்சொல்லின் நெருக்கமான பொருளைச் சுருக்கமாகத் தருகிறது; வாக்கிய நடை மரியாதையுடனும் பொதுவாசகர்களுக்குப் புரியுமாறும் அமைந்துள்ளது.
