id: PHM.1.7
reference: Philemon 1:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ⸀χαρὰν γὰρ ⸂πολλὴν ἔσχον⸃ καὶ παράκλησιν ἐπὶ τῇ ἀγάπῃ σου, ὅτι τὰ σπλάγχνα τῶν ἁγίων ἀναπέπαυται διὰ σοῦ, ἀδελφέ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/007.yaml
  text: For I had much joy and encouragement because of your love[a], because the hearts of the saints have been refreshed through you, brother.
translation:
  language: ta
  text: ஏனெனில், உமது அன்பினால் எனக்கு மிகுந்த மகிழ்ச்சியும் ஊக்கமும் உண்டாயின; ஏனென்றால், உம்மூலமாகப் பரிசுத்தவான்களின் உள்ளங்கள்[a] புத்துணர்வு பெற்றுள்ளன, சகோதரரே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் நேரடியாக, ‘பரிசுத்தவான்களின் உள்ளார்ந்த பாச உணர்வுகள்.’
    reason: σπλάγχνα என்பதன் நேரடியான உடல்சார் உருவகத்தையும் ஆழ்ந்த உள்ளுணர்வு என்ற பொருளையும் பாதுகாக்கும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: χαρὰν
  choice: மகிழ்ச்சி
  rationale: χαρά என்பதன் இயல்பான நவீனத் தமிழ் இணை; பவுலின் உணர்ச்சிசார் மொழியைத் தெளிவாகக் காட்டுகிறது.
- source_word: πολλὴν ἔσχον
  choice: எனக்கு மிகுந்த ... உண்டாயின
  rationale: ἔσχον இங்கு அனுபவித்தல் அல்லது பெற்றிருத்தல் என்ற பொருளில் வருகிறது; தமிழில் இயல்பாகவும், πολλήν என்பதன் வலிமையைப் பேணியும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: παράκλησιν
  choice: ஊக்கம்
  rationale: ஆறுதல், தேற்றுதல், ஊக்கமளித்தல் ஆகிய பொருட்கள் சாத்தியம்; பிலேமோனின் அன்பு பவுலை வலுப்படுத்திய இச்சூழலில் ‘ஊக்கம்’ இயல்பாகப் பொருந்துகிறது.
- source_word: ἐπὶ τῇ ἀγάπῃ σου
  choice: உமது அன்பினால்
  rationale: ἐπί + வேற்றுமை இங்கு காரணத்தைச் சுட்டுகிறது; மகிழ்ச்சிக்கும் ஊக்கத்திற்கும் பிலேமோனின் அன்பே காரணம் என்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: σπλάγχνα
  choice: உள்ளங்கள்
  rationale: சொல்லுக்குச் சொல் பொருள் ‘உள் உறுப்புகள்’; ஆனால் கிரேக்க மரபுத்தொடரில் ஆழ்ந்த உள்ளுணர்வுகளையும் உள்ளார்ந்த வாழ்வையும் குறிக்கிறது. ‘உள்ளங்கள்’ தமிழில் இயல்பான ஒப்புமை; நேரடியான நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: τῶν ἁγίων
  choice: பரிசுத்தவான்களின்
  rationale: தேவனுக்கெனப் பிரிக்கப்பட்ட விசுவாசிகளைச் சுட்டும் பவுலின் வழக்கமான சமூகப் பெயரைப் பேணுகிறது; பிற்கால அதிகாரப்பூர்வ புனிதர் பட்டம் என்ற கருத்தை அவசியமாகக் குறிக்காது.
- source_word: ἀναπέπαυται
  choice: புத்துணர்வு பெற்றுள்ளன
  rationale: நிறைவுற்ற செயலில் இருந்து தொடரும் தற்போதைய நிலையை perfect வடிவம் காட்டுகிறது; இச்சூழலில் ஓய்வு, நிம்மதி, புதுப்பலம் ஆகிய நுணுக்கங்களை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: διὰ σοῦ
  choice: உம் மூலமாக
  rationale: διά + genitive காட்டும் வழிமுறை அல்லது செயற்பாட்டாளர் நுணுக்கத்தைப் பேணுகிறது.
- source_word: ἀδελφέ
  choice: சகோதரரே
  rationale: கிறிஸ்தவக் குடும்ப உறவைச் சுட்டும் நேரடி ஆண்பால் அழைப்பு; மூலத்தில் இல்லாத ‘அன்பான’ போன்ற அடைமொழி சேர்க்கப்படவில்லை.
theological_decisions:
- issue: ἅγιοι என்பதன் மொழிபெயர்ப்பு
  choice: பரிசுத்தவான்கள்
  alternative: தேவனுடைய மக்கள்; பரிசுத்த மக்கள்
  rationale: விசுவாசிகள் தேவனுக்கெனப் பிரிக்கப்பட்டவர்கள் என்ற பவுலின் சபைசார் மொழியை வெளிப்படையாகப் பேணுகிறது; தனிப்பட்ட பிற்கால புனிதராக்கக் கோட்பாட்டை உரைக்குள் சேர்ப்பதில்லை.
- issue: σπλάγχνα என்ற மனித உடல்சார் மரபுத்தொடர்
  choice: உள்ளங்கள்
  alternative: உள்ளார்ந்த உணர்வுகள்; அகமனங்கள்
  rationale: உடற்கூற்றைச் சொல்லுக்குச் சொல் கூறாமல், ஆழ்ந்த பாசம் மற்றும் உள்ளார்ந்த வாழ்வு என்ற கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது; அதன் நேரடியான உடல்சார் பின்னணி அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ἀναπέπαυται என்பதிலுள்ள ஓய்வு மற்றும் புதுப்பித்தல் நுணுக்கம்
  choice: புத்துணர்வு பெற்றுள்ளன
  alternative: இளைப்பாறியுள்ளன; நிம்மதி அடைந்துள்ளன
  rationale: பிலேமோனின் அன்பினால் விசுவாசிகளின் உள்ளார்ந்த நிலை புதுப்பிக்கப்பட்டு இப்போது அந்நிலையில் உள்ளது என்பதைத் தெரிவிக்கிறது; வெறும் உடல் ஓய்வாகக் குறுக்குவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை மரியாதை வடிவங்களான ‘உமது’, ‘உம்’ என்பவை பிலேமோனை நோக்கிய நேரடி உரையைத் தெளிவாக்குகின்றன. இரண்டு ὅτι கூறுகளின் காரணத் தொடர்பு தமிழில் தனித்த வாக்கியங்களாகத் தெளிவுபடுத்தப்பட்டாலும், இரண்டுமே பவுலின் மகிழ்ச்சிக்கும் ஊக்கத்திற்கும் அடிப்படையான விளக்கமாகத் தொடர்கின்றன.
