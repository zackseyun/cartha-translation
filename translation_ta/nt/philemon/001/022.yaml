id: PHM.1.22
reference: Philemon 1:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἅμα δὲ καὶ ἑτοίμαζέ μοι ξενίαν, ἐλπίζω γὰρ ὅτι διὰ τῶν προσευχῶν ὑμῶν χαρισθήσομαι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/022.yaml
  text: At the same time also prepare a guest room for me[b][a], for I hope that through your prayers I will be granted to you.
translation:
  language: ta
  text: அதே வேளையில், எனக்காக ஒரு தங்குமிடத்தையும் ஏற்பாடு செய்[a]. ஏனெனில், உங்கள் ஜெபங்களின் மூலம் நான் உங்களுக்கு அருளாகக் கொடுக்கப்படுவேன் என்று நம்புகிறேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விருந்தினர் தங்குமிடம்’ அல்லது ‘விருந்தோம்பல்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்கச் சொல் விருந்தோம்பலையோ, விருந்தினருக்காக ஆயத்தம் செய்யப்படும் தங்குமிடத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘நான் உங்களுக்குக் கொடுக்கப்படுவேன்’ என்றும் மொழிபெயர்க்கலாம்; கிரேக்க வினைச்சொல் கொடையாக அல்லது அருளாக வழங்கப்படுதலைக் குறிக்கிறது. இங்கு வழங்குபவர் கடவுள் என்பது உட்குறிப்பாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα δὲ καὶ
  choice: அதே சமயத்தில், … ஒன்றையும்
  rationale: முந்தைய வேண்டுகோளுடன் சேர்த்து இன்னொரு வேண்டுகோளை முன்வைக்கும் தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது; καί என்பதன் சேர்க்கைப் பொருளை ‘ஒன்றையும்’ காக்கிறது.
- source_word: ἑτοίμαζέ
  choice: ஆயத்தப்படுத்து
  rationale: நேரடியான நிகழ்காலக் கட்டளையின் நடைமுறைச் செயலைக் கண்ணியமான, புரிந்துகொள்ள எளிய தமிழில் தருகிறது.
- source_word: μοι
  choice: எனக்காக
  rationale: பவுலுக்குப் பயனாக அந்த இடத்தை ஏற்பாடு செய்ய வேண்டும் என்ற பயனாளிப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: ξενίαν
  choice: தங்கும் இடம் ஒன்று
  rationale: இச்சூழலில் விருந்தோம்பலைவிட விருந்தினர் தங்குவதற்கான இடம் என்ற உறுதியான பொருள் இயல்பானது; சொல்லின் விரிவான பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: ἐλπίζω γὰρ ὅτι
  choice: ஏனெனில், … என்று நம்புகிறேன்
  rationale: γάρ தரும் காரணத் தொடர்பையும், ὅτι அறிமுகப்படுத்தும் நம்பிக்கையின் உள்ளடக்கத்தையும் இயல்பான தமிழ் வாக்கிய அமைப்பில் காக்கிறது.
- source_word: διὰ τῶν προσευχῶν ὑμῶν
  choice: உங்கள் ஜெபங்களின் மூலம்
  rationale: διά + பிறப்புவேற்றுமை தரும் கருவி அல்லது வழிமுறைப் பொருளை நேரடியாக வெளிப்படுத்துகிறது; பன்மை ‘உங்கள்’ என்பதில் காக்கப்படுகிறது.
- source_word: χαρισθήσομαι
  choice: அருளப்படுவேன்
  rationale: χαρίζομαι என்பதிலுள்ள இலவசமாக அல்லது அருளாக வழங்கப்படும் நுணுக்கத்தையும் எதிர்காலச் செயப்பாட்டு வடிவத்தையும் காக்கிறது; செய்பவர் யார் என்பதை வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: ὑμῖν
  choice: உங்களுக்கு
  rationale: பெறுநர்களைக் குறிக்கும் பன்மை நான்காம் வேற்றுமைப் பொருளைத் துல்லியமாகக் காக்கிறது.
theological_decisions:
- issue: χαρισθήσομαι என்பது பவுலின் விடுதலை அல்லது திரும்பிவருதலை எவ்வாறு குறிக்கிறது
  choice: ‘நான் உங்களுக்கு அருளப்படுவேன்’ என்று மொழிபெயர்த்து, பவுலே பெறுநர்களுக்கு அருளாக வழங்கப்படுவார் என்ற செயப்பாட்டு வடிவத்தைக் காத்தல்
  alternative: ‘நான் விடுவிக்கப்பட்டு உங்களிடம் வருவேன்’ அல்லது ‘நான் உங்களுக்குக் கொடுக்கப்படுவேன்’
  rationale: இறைவனின் செயல் உட்குறிப்பாக இருக்கக்கூடும்; ஆனால் கிரேக்கம் செய்பவரையோ ‘விடுதலை’ அல்லது ‘திரும்புதல்’ என்பதையோ வெளிப்படையாகச் சொல்லவில்லை. ஆகவே அவற்றை உரைக்குள் சேர்க்காமல், அருள் சார்ந்த நுணுக்கத்தையும் இறையியல் அழுத்தத்தையும் காக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் கண்ணியமான, நேரடியான நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை கட்டளை ‘ஆயத்தப்படுத்து’ பிலேமோனை நோக்குகிறது; ‘உங்கள்/உங்களுக்கு’ என்பவை கிரேக்க மூலத்தின் பன்மையைப் பாதுகாக்கின்றன. ‘அருளப்படுவேன்’ என்பது தமிழில் சற்றே செறிவான அமைப்பாக இருந்தாலும், மூலத்தின் செயப்பாட்டு வடிவம், அருள் நுணுக்கம், மறைந்த செய்பவர் ஆகியவற்றைத் தீர்த்துவிடாமல் காக்கிறது.
