revisions:
- from: அதே சமயத்தில், எனக்காகத் தங்கும் இடம் ஒன்றையும் ஆயத்தப்படுத்து[a]. ஏனெனில், உங்கள் ஜெபங்களின் மூலம் நான் உங்களுக்கு அருளப்படுவேன்[b] என்று நம்புகிறேன்.
  to: அதே வேளையில், எனக்காக ஒரு தங்குமிடத்தையும் ஏற்பாடு செய்[a]. ஏனெனில், உங்கள் ஜெபங்களின் மூலம் நான் உங்களுக்கு அருளாகக் கொடுக்கப்படுவேன் என்று நம்புகிறேன்[b].
  rationale: The revision improves modern Tamil idiom and clarifies that Paul, not merely a blessing, is expected to be graciously given to the recipients. It preserves the Greek passive, future sense, implicit agency, and the lexical ambiguity of ξενία in the footnote. Footnote markers remain attached to their corresponding terms.
  reviewer_model: gpt-5.6-terra
