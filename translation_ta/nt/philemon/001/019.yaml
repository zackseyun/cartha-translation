  source_fidelity: முதன்மை உரை ἐγὼ Παῦλος என்ற வலியுறுத்தலையும், தன்கைப்பட எழுதும் உறுதியையும், ἀποτίσω என்ற எதிர்காலச் செலுத்துவாக்குறுதியையும் நன்றாகக் காக்கிறது. ஆனால் ἵνα μὴ λέγω σοι இங்குப் பயன்படுத்தும் நயமான ‘சொல்லாமலே/குறிப்பிடாமலே’ என்ற சொல்லாட்சிக்கு பதிலாக ‘சொல்ல வேண்டியதில்லை’ என்பது அவசியமின்மையைச் சுட்டுகிறது; ஆகவே பவுல் மறைமுகமாக நினைவூட்டும் வாதத்தின் நுணுக்கம் மங்குகிறது.
  naturalness: ‘நான் பவுல்’ என்ற கையொப்பத் தொடர் நவீனத் தமிழில் ‘பவுலாகிய நான்’ என்பதைக் காட்டிலும் இயல்பாகவும், மூலத்தின் தனிப்பட்ட உத்தரவாதத் தொனிக்கும் ஏற்றதாகவும் உள்ளது. ‘உன்னையே கூட’ என இடைவெளியுடன் எழுதுவது வாசிப்பைத் தெளிவாக்குகிறது.
