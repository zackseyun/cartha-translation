id: PHM.1.19
reference: Philemon 1:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: ἐγὼ Παῦλος ἔγραψα τῇ ἐμῇ χειρί, ἐγὼ ἀποτίσω· ἵνα μὴ λέγω σοι ὅτι καὶ σεαυτόν μοι προσοφείλεις.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/019.yaml
  text: 'I[a], Paul, write this with my own hand: I will repay it—not to mention to you that you owe me even your very self.'
translation:
  language: ta
  text: 'நான் பவுல், இதை என் சொந்தக் கையால் எழுதுகிறேன்[a]: நான் அதைத் திருப்பிச் செலுத்துவேன்—நீ உன்னையே கூட எனக்குக் கடன்பட்டிருக்கிறாய் என்று உனக்குச் சொல்லாமலே.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சார்பாக: “நான் பவுல், என் சொந்தக் கையால் எழுதினேன்; நான் அதைத் திருப்பிச் செலுத்துவேன்; நீ உன்னையே கூட எனக்குக் கடன்பட்டிருக்கிறாய் என்று உனக்குச் சொல்லாமல்.”'
    reason: ἔγραψα என்பதன் இறந்தகால வடிவத்தையும், ἵνα μὴ λέγω σοι என்பதன் நயமான ‘சொல்லாமல்’ என்ற சொல்லாட்சியையும் காட்டும் சொற்சார்ந்த மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: ἔγραψα
  choice: எழுதுகிறேன்
  rationale: இது இறந்தகால வினைவடிவமாக இருந்தாலும், கடிதம் வாசிக்கப்படும் தருணத்தில் பவுல் தாம் கைப்பட எழுதுவதைச் சுட்டிக்காட்டும் கடித வழக்கை இயல்பான நவீனத் தமிழில் நிகழ்காலமாகத் தருகிறது. ‘எழுதினேன்’ என்ற முறையான வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: τῇ ἐμῇ χειρί
  choice: என் சொந்தக் கையால்
  rationale: பவுலே கைப்பட எழுதி தனிப்பட்ட உத்தரவாதம் அளிப்பதன் அழுத்தத்தைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: ἀποτίσω
  choice: நான் அதைத் திருப்பிச் செலுத்துவேன்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட கடன் அல்லது இழப்பைத் தாமே ஈடுசெய்வதாக பவுல் அளிக்கும் எதிர்கால வாக்குறுதியைப் பாதுகாக்கிறது.
- source_word: ἵνα μὴ λέγω σοι
  choice: நான் உனக்குச் சொல்ல வேண்டியதில்லை
  rationale: இங்கு கண்டிப்பான நோக்கத்தைவிட நயமான சொல்லாட்சியும் மறைமுகமான நினைவூட்டலும் முன்னிலையில் உள்ளன; தமிழில் இந்தச் சொற்றொடர் அந்தப் பண்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: σεαυτόν
  choice: உன்னையேகூட
  rationale: καί தரும் வலியுறுத்தலோடு, பணக் கடனைத் தாண்டி பிலேமோன் தன் ஆளுமையிலேயே பவுலுக்குக் கடன்பட்டிருப்பதாகக் கூறும் வலிமையைப் பாதுகாக்கிறது.
- source_word: προσοφείλεις
  choice: எனக்குக் கடன்பட்டிருக்கிறாய்
  rationale: கூடுதலாகக் கடன்பட்டிருத்தல் என்ற வினையின் பொருளைத் தெளிவான தமிழில் தருகிறது; அதன் சேர்க்கைப் பொருள் ‘உன்னையேகூட’ என்பதால் சூழலில் வெளிப்படுகிறது.
theological_decisions:
- issue: ‘நீ உன்னையேகூட எனக்குக் கடன்பட்டிருக்கிறாய்’ என்பதில் பிலேமோன் பவுலுக்குக் கடன்பட்டிருப்பதன் இயல்பு
  choice: அந்தத் தனிப்பட்ட உருவகக் கடனை அதன் துல்லியமான காரணத்தை விளக்காமல் அப்படியே வைத்தல்
  alternative: இது பிலேமோனின் மனமாற்றம், மீட்பு, உடல் உயிர் அல்லது வேறொரு குறிப்பிட்ட உதவியைக் குறிக்கிறது என்று வெளிப்படையாகக் கூறுதல்
  rationale: கிரேக்க உரை கடன்பட்டிருப்பதை வலுவாகக் கூறினாலும், அதன் சரியான அடிப்படையை வரையறுக்கவில்லை. ஆகவே உரையில் இல்லாத வரலாற்று அல்லது கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல் அதன் பொருள் திறந்தவாறே வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், தனிப்பட்ட கடிதத்தின் நெருக்கத்தையும் பவுலின் நயமான ஆனால் வலுவான வற்புறுத்தலையும் காக்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது.
