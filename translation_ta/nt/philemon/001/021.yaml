reference: Philemon 1:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: SBLGNT
  text: πεποιθὼς τῇ ὑπακοῇ σου ἔγραψά σοι, εἰδὼς ὅτι καὶ ὑπὲρ ⸀ἃ λέγω ποιήσεις.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/021.yaml
  text: Confident of your obedience[a], I wrote to you, knowing that you will do even more than I say.
translation:
  language: ta
  text: உன் கீழ்ப்படிதலை நம்பி உனக்கு எழுதினேன்; நான் சொல்வதைவிடவும் அதிகமாக நீ செய்வாய் என்று அறிந்து.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் சொல்வதைத் தாண்டியும்.” பிலேமோன் பவுல் குறிப்பாகக் கேட்டதைக் காட்டிலும் அதிகமாகச் செய்வார் என்று பவுல் உட்குறிப்பாக உணர்த்தியிருக்கலாம்; ஆனால் அது என்ன என்பதை உரை துல்லியமாகக் கூறவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθὼς
  choice: நம்பிக்கையுள்ளவனாக
  rationale: Perfect participle காட்டும் நிலைத்த நம்பிக்கையையும், பவுல் எழுதுவதற்கான அடிப்படையாக அது இருப்பதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: τῇ ὑπακοῇ σου
  choice: உன் கீழ்ப்படிதலில்
  rationale: ὑπακοή என்பதிலுள்ள கீழ்ப்படிதல் மற்றும் அறிவுறுத்தலுக்குச் செவிசாய்த்தல் ஆகிய வலிமையை மென்மையாக்காமல் காக்கிறது.
- source_word: ἔγραψά σοι
  choice: உனக்கு எழுதினேன்
  rationale: Aorist indicative-ஐ இயல்பான எளிய இறந்தகாலமாக மொழிபெயர்க்கிறது.
- source_word: εἰδὼς
  choice: அறிந்திருக்கிறேன்
  rationale: Perfect participle உணர்த்தும் உறுதியான, தொடரும் அறிவுநிலையைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: καὶ ὑπὲρ ἃ λέγω
  choice: நான் சொல்வதற்கும் மேலாக
  rationale: ὑπέρ + accusative தரும் ‘சொல்லப்படுவதைத் தாண்டி/அதற்கும் மேலாக’ என்ற பொருளைக் காத்து, கூடுதல் செயல் என்ன என்பதைத் திறந்தே விடுகிறது.
- source_word: ποιήσεις
  choice: நீ செய்வாய்
  rationale: ποιέω என்ற பரந்த வினையின் திட்டமிட்ட தெளிவின்மையையும் future indicative-ன் உறுதியையும் காக்கிறது.
theological_decisions:
- issue: பவுலின் வேண்டுகோளுடன் தொடர்புடைய ὑπακοή என்பதன் வலிமை
  choice: கீழ்ப்படிதல்
  alternative: இணக்கம்; செவிசாய்த்துப் பதிலளித்தல்
  rationale: மூலச்சொல்லின் அதிகாரம் சார்ந்த உறவுநிலையை காக்கிறது; அதேவேளையில் உரையில் இல்லாத கட்டாயத்தைச் சேர்க்கவில்லை.
- issue: ‘நான் சொல்வதற்கும் மேலாக’ என்பதன் உட்குறிப்பு
  choice: எதிர்பார்க்கப்படும் கூடுதல் செயல் எதுவென்று குறிப்பிடாமல் விடுதல்
  alternative: ஒநேசிமுவை விடுதலை செய்வதற்கான குறிப்பு; அவரைத் தாராளமாக ஏற்றுக்கொள்வது மட்டுமே
  rationale: பவுலின் சொற்கள் ஓர் உட்குறிப்பைக் கொண்டிருந்தாலும், எதிர்பார்க்கும் செயலைத் தெளிவாகக் கூறவில்லை. ஆகவே அந்தத் தெய்வவியல் மற்றும் சொல்லாட்சித் திறந்தநிலை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், தனிப்பட்ட கடிதத்தின் ஒருமை நெருக்கத்தையும் கண்ணியத்தையும் காக்கும் நடை. ‘கீழ்ப்படிதல்’ மூலம் மூலத்தின் வலிமை பாதுகாக்கப்பட்டு, இறுதிக் கூறின் திட்டமிட்ட தெளிவின்மை விளக்கிச் சேர்க்கப்படாமல் விடப்பட்டுள்ளது.
