  text: ὅπως ἡ κοινωνία τῆς πίστεώς σου ἐνεργὴς γένηται ἐν ἐπιγνώσει παντὸς ἀγαθοῦ ⸀τοῦ ἐν ἡμῖν εἰς ⸀Χριστόν·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/006.yaml
  text: so that the fellowship of your faith may become effective in the knowledge of every good thing that is in us for the Messiah[a][b][c][d][e].
translation:
  language: ta
  text: நம்மில் உள்ள ஒவ்வொரு நன்மையையும் கிறிஸ்துவை நோக்கி முழுமையாக அறிந்துகொள்வதன் மூலம், உங்கள் விசுவாசத்தின் கூட்டுறவு செயல்திறன் மிக்கதாக ஆகும்படி[a][b][c][d][e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உங்கள் விசுவாசத்தைப் பகிர்ந்துகொள்ளுதல்,” “உங்கள் விசுவாசத்தின் ஐக்கியம்,” அல்லது “உங்கள் விசுவாசத்தின் கூட்டுப்பங்கு” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: “விசுவாசம்” என்பதற்கான கிரேக்கச் சொல் சில சூழல்களில் “நம்பகத்தன்மை” அல்லது “நம்பிக்கை” என்றும் பொருள்படும்.
    reason: alternative_reading
  - marker: c
    text: சில கையெழுத்துப் பிரதிகளில் “நம்மில்” என்பதற்குப் பதிலாக “உங்களில்” என்று உள்ளது.
    reason: textual_variant
  - marker: d
    text: “கிறிஸ்துவுக்காக” என்றும் மொழிபெயர்க்கலாம்; Χριστός என்பது “அபிஷேகம் பெற்றவர்” என்ற பட்டப்பெயர்.
    reason: lexical_alternative
  - marker: e
    text: “கிறிஸ்துவை நோக்கி” என்பது “நம்மில் உள்ள ஒவ்வொரு நன்மை” என்பதுடன் தொடர்புடையதாகவும், அல்லது முழுத் தொடரின் செயல்திறனுடன் தொடர்புடையதாகவும் புரிந்துகொள்ளப்படலாம்.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ὅπως
  choice: ஆகும்படி
  rationale: பவுலின் வேண்டுதல் அல்லது நோக்கத்தை இயல்பான தமிழில் குறிக்கிறது.
- source_word: κοινωνία
  choice: பங்கேற்பு
  rationale: பகிர்வு, ஐக்கியம், கூட்டுப்பங்கு ஆகிய நுணுக்கங்களைத் திறந்தவாறு வைத்திருக்கிறது; விசுவாசத்தை வெறுமனே வாய்மொழியாகப் பகிர்வதாகக் குறுக்கவில்லை.
- source_word: πίστεώς
  choice: விசுவாசத்தின்
  rationale: இங்கு பிலேமோனின் கிறிஸ்தவ விசுவாசத்தைக் குறிக்கும் வாய்ப்பு மிகுதி; நம்பகத்தன்மை என்ற சாத்திய நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ἐνεργὴς γένηται
  choice: செயல்திறனுள்ளதாக ஆகும்படி
  rationale: செயலில் ஆற்றலுடையதாக அல்லது பயனுள்ளதாக ஆவதைக் குறிக்கும் தொடரின் இயக்கத்தைக் காக்கிறது.
- source_word: ἐν ἐπιγνώσει
  choice: முழுமையாக அறிந்துகொள்வதில்
  rationale: ἐπίγνωσις என்பதிலுள்ள ஆழ்ந்த அல்லது முழுமையான அறிதல் நுணுக்கத்தையும், ἐν என்பதன் நேரடியான தொடர்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: παντὸς ἀγαθοῦ
  choice: ஒவ்வொரு நன்மையையும்
  rationale: நபுஞ்சக ஒருமை வடிவை இயல்பான தமிழில் பொதுவான ஒவ்வொரு நல்ல காரியமாக வழங்குகிறது; ‘வரம்’ என்று தேவையின்றிக் குறுக்கவில்லை.
- source_word: τοῦ ἐν ἡμῖν
  choice: நம்மில் உள்ள
  rationale: SBLGNT உரையின் ἡμῖν என்பதைத் தக்கவைத்து, அந்தச் சொற்றொடரை ‘ஒவ்வொரு நன்மை’ என்பதுடன் இணைக்கிறது.
- source_word: εἰς Χριστόν
  choice: கிறிஸ்துவை நோக்கிய
  rationale: εἰς என்பதன் திசை அல்லது இலக்கு சார்ந்த தெளிவற்ற உறவைத் தீர்மானித்து விடாமல் காக்கிறது; Χριστός என்பதற்குப் பழக்கமான தமிழ் பட்டப்பெயர் பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: κοινωνία τῆς πίστεώς σου என்பதன் பொருள்
  choice: உங்கள் விசுவாசத்தின் பங்கேற்பு
  alternative: உங்கள் விசுவாசத்தைப் பகிர்ந்துகொள்ளுதல்; உங்கள் விசுவாசத்தின் ஐக்கியம்; உங்கள் விசுவாசத்தால் உருவான கூட்டுப்பங்கு
  rationale: இந்தக் கடினமான சொற்றொடரின் சமூக, நடைமுறை, பகிர்வு சார்ந்த கூறுகளை ஒரே பொருளாக இறுக்காமல் ‘பங்கேற்பு’ காக்கிறது.
- issue: ἐν ἡμῖν என்பதன் குறிப்பு
  choice: பவுல், பிலேமோன் மற்றும் சக விசுவாசிகளை உள்ளடக்கும் ‘நம்மில்’
  alternative: சில கையெழுத்துப் பிரதிகளின்படி பிலேமோனைச் சுட்டும் ‘உங்களில்’
  rationale: அச்சிடப்பட்ட SBLGNT உரையைப் பின்பற்றி ἡμῖν தக்கவைக்கப்படுகிறது; உரை வேறுபாடு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: εἰς Χριστόν என்பதன் தொடரியல் உறவு
  choice: ‘நம்மில் உள்ள ஒவ்வொரு நன்மை’ கிறிஸ்துவை நோக்கியது
  alternative: விசுவாசத்தின் பங்கேற்பு கிறிஸ்துவுக்காகச் செயல்திறனுள்ளதாகிறது
  rationale: கிரேக்கத்தின் இறுதித் தொடர் இலக்கண ரீதியாகச் சுருக்கமானதும் பொருள் ரீதியாகத் தெளிவற்றதுமாக இருப்பதால், பிரதான உரை அருகிலுள்ள பெயர்த்தொடருடன் இணைத்தாலும் மாற்று சாத்தியத்தை அடிக்குறிப்பில் காக்கிறது.
