  register: நவீன செந்தமிழ் சார்ந்த, பொதுமக்கள் புரிந்துகொள்ளத்தக்க மரியாதையான நடை. ‘பங்கேற்பு’ மற்றும் ‘கிறிஸ்துவை நோக்கிய’ என்பவை மூலத்தின் உண்மையான பொருள் மற்றும் தொடரியல் தெளிவின்மையைத் திறந்தவாறு காக்கத் தேர்ந்தெடுக்கப்பட்டன.
