  yaml_path: translation/nt/philemon/001/010.yaml
  text: I appeal to you concerning my child[a], Onesimus, whom I fathered in my chains[b],
translation:
  language: ta
  text: என் பிள்ளையான ஒநேசிமுவுக்காக[a] உன்னிடம் வேண்டிக்கொள்கிறேன்; என் சங்கிலிகளில்[b] அவனைப் பிறப்பித்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பிள்ளை” என்பது இங்கு உடல்பிறப்பான பிள்ளையைக் குறிக்காமல், பவுலுக்கும் ஒநேசிமுவுக்கும் இடையிலான ஆன்மீக உறவைக் குறிக்கும் பிறப்பு உருவகம்.
    reason: lexical_alternative
  - marker: b
    text: “என் சங்கிலிகளில்” என்பதை “என் சிறையிருப்பில்” என்றும் புரிந்துகொள்ளலாம்; கிரேக்கத்தில் கட்டுகள் அல்லது சங்கிலிகள் என்ற நேரடியான சொல்லே உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλῶ
  choice: வேண்டிக்கொள்கிறேன்
  rationale: தனிப்பட்ட உறவின் அடிப்படையில் பவுல் முன்வைக்கும் மனமார்ந்த வேண்டுகோளை இது இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; கட்டளையிடும் வலிமையைத் தேவையின்றி சேர்ப்பதில்லை.
- source_word: περὶ τοῦ ἐμοῦ τέκνου
  choice: என் பிள்ளை … ஒநேசிமுவுக்காக
  rationale: περί உடன் வரும் ஆறாம் வேற்றுமை இங்கு வேண்டுகோளின் பொருளைக் குறிக்கிறது. தமிழில் “ஒநேசிமுவுக்காக” என்பது இயல்பாக உள்ளது; “என் பிள்ளை” ஆன்மீக உறவைக் குறிக்கும் உருவகத்தை விளக்கமாக மாற்றாமல் காக்கிறது.
- source_word: τέκνου
  choice: பிள்ளை
  rationale: τέκνον என்பதன் பாலினத்தைச் சுட்டாத, அன்பும் நெருக்கமும் கொண்ட பொருளை “பிள்ளை” காக்கிறது; “மகன்” என்பதைக் காட்டிலும் மூலச்சொல்லுக்கு நெருக்கமானது.
- source_word: ὃν ἐγέννησα
  choice: அவனை … பெற்றெடுத்தேன்
  rationale: γεννάω சொல்லிலுள்ள பிறப்பித்தல் உருவகத்தை நேரடியாகக் காக்கிறது. ஆன்மீகத் தந்தைத்துவம் அல்லது மனமாற்றம் என்று விளக்கிப் பதிலிடாமல், மூலத்தின் உருவகத் தீவிரத்தைத் தக்கவைக்கிறது.
- source_word: ἐν τοῖς δεσμοῖς
  choice: என் சங்கிலிகளில்
  rationale: δεσμοί என்பதன் நேரடியான சங்கிலி/கட்டு உருவகத்தைக் காக்கிறது; சூழலில் அது சிறையிருப்பைக் குறிக்கிறது. முதல் நபர் சூழலால் தமிழில் “என்” இயல்பாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: Ὀνήσιμον
  choice: ஒநேசிமு
  rationale: தனிப்பெயர் தமிழின் வழக்கமான வேதாகம ஒலிபெயர்ப்பு மரபுக்கு ஏற்ப வழங்கப்பட்டுள்ளது; வேற்றுமை உருபுக்கு முன் “ஒநேசிமு” என வருகிறது.
theological_decisions:
- issue: பவுலுக்கும் ஒநேசிமுவுக்கும் இடையிலான உறவின் தன்மை
  choice: “பிள்ளை” மற்றும் “பெற்றெடுத்தேன்” என்ற ஆன்மீகப் பிறப்பித்தல் உருவகத்தைத் தக்கவைத்தல்
  alternative: “சிறையில் அவனுக்கு நான் ஆன்மீகத் தந்தையானேன்” அல்லது “அவனை விசுவாசத்திற்கு நடத்தினேன்”
  rationale: ஒநேசிமு பவுலின் ஊழியத்தின் மூலம் விசுவாசியாகியிருக்கலாம் என்று வசனம் உணர்த்தினாலும், கிரேக்கம் அதை வெளிப்படையான மனமாற்றக் கூற்றாக அல்லாமல் பிறப்பித்தல் உருவகமாகவே கூறுகிறது. ஆகவே அந்த இறையியல் உட்பொருளை விளக்கமாகச் சேர்க்காமல் மூலத்தின் உருவகமும் உறவின் நெருக்கமும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத்தமிழில் எளிதாகப் புரியும், ஆனால் கடிதத்தின் கண்ணியமும் பவுலின் அன்பான வேண்டுகோள் தொனியும் காக்கப்படும் நடை. உறவின் உருவகத்தை இயல்பாக்கி மறைக்காமல், தேவையான விளக்கம் அடிக்குறிப்புகளில் வழங்கப்பட்டுள்ளது.
