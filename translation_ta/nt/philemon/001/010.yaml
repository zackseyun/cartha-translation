revisions:
- from: என் பிள்ளை[a] ஒநேசிமுவுக்காக உன்னிடம் வேண்டிக்கொள்கிறேன்; அவனை என் சங்கிலிகளில்[b] பெற்றெடுத்தேன்.
  to: என் பிள்ளையான ஒநேசிமுவுக்காக[a] உன்னிடம் வேண்டிக்கொள்கிறேன்; என் சங்கிலிகளில்[b] அவனைப் பிறப்பித்தேன்.
  rationale: The revision corrects the unintended maternal implication of ‘பெற்றெடுத்தேன்’ by using ‘பிறப்பித்தேன்,’ which preserves the Greek begetting/birth metaphor without explicitly importing conversion language. It also improves the appositional flow (‘my child, Onesimus’) and refines both footnotes while retaining their anchors and the source’s interpretive restraint.
