source:
  edition: SBLGNT
  text: ἀκούων σου τὴν ἀγάπην καὶ τὴν πίστιν ἣν ἔχεις ⸀πρὸς τὸν κύριον Ἰησοῦν καὶ εἰς πάντας τοὺς ἁγίους,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/005.yaml
  text: because I hear of your love and faith that you have toward the Lord Jesus and for all the saints[c][b][a],
translation:
  language: ta
  text: ஏனெனில், ஆண்டவராகிய இயேசுவிடமும் பரிசுத்தவான்கள் அனைவரிடமும் நீ கொண்டுள்ள அன்பையும் விசுவாசத்தையும் குறித்து நான் கேள்விப்படுகிறேன்.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'பொருளை இன்னும் வெளிப்படையாகக் கூறினால்: “ஆண்டவராகிய இயேசுவின்மேல் நீ கொண்டுள்ள விசுவாசத்தையும், பரிசுத்தவான்கள் அனைவரிடமும் நீ கொண்டுள்ள அன்பையும்.”'
    reason: alternative_reading
  - marker: b
    text: “நீ காட்டும் உண்மைத்தன்மை” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொல் விசுவாசம், நம்பிக்கை, அல்லது உண்மைத்தன்மையைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: 'அல்லது: “உன் அன்பையும், நீ கொண்டிருக்கும் விசுவாசத்தையும்.”'
    reason: previous_rendering
lexical_decisions:
- source_word: ἀκούων
  choice: நான் கேள்விப்படுகிறேன்
  rationale: முந்தைய வசனத்தின் நன்றிசெலுத்தும் தொடருடன் இணைந்துள்ள நிகழ்காலப் பங்கேற்புவினையைத் தமிழில் இயல்பான வினைமுற்றாக வழங்குகிறது; காரணத் தொடர்பை ‘ஏனெனில்’ வெளிப்படுத்துகிறது.
- source_word: ἀγάπην
  choice: அன்பு
  rationale: ἀγάπη என்பதற்கான நேரடியும் வழக்கமானதுமான தமிழ் இணைச்சொல்.
- source_word: πίστιν
  choice: விசுவாசம்
  rationale: πίστις என்பதன் வழக்கமான புதிய ஏற்பாட்டு மொழிபெயர்ப்பு; ‘நம்பிக்கை’ அல்லது ‘உண்மைத்தன்மை’ என்ற நுண்பொருள் சாத்தியத்தை அடிக்குறிப்பு காக்கிறது.
- source_word: πρὸς τὸν κύριον Ἰησοῦν
  choice: ஆண்டவராகிய இயேசுவிடம்
  rationale: πρός குறிக்கும் நபரை நோக்கிய உறவு அல்லது திசையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: κύριον
  choice: ஆண்டவர்
  rationale: கிறிஸ்துவுக்குரிய κύριος பட்டத்திற்கான நிறுவப்பட்ட, மரியாதைக்குரிய தமிழ் வழக்கு.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: பரிசுத்தவான்கள் அனைவரிடமும்
  rationale: εἰς குறிக்கும் உறவுநோக்கைத் தமிழில் இயல்பாகக் காட்டி, ἅγιοι என்பதன் சுருக்கமான சமூகப் பெயரையும் காக்கிறது.
- source_word: ἁγίους
  choice: பரிசுத்தவான்கள்
  rationale: பவுலின் கடிதங்களில் விசுவாசிகளைக் குறிக்கும் ἅγιοι என்பதற்கான நிலைபெற்ற தமிழ் வேதாகமச் சொல்.
theological_decisions:
- issue: ‘அன்பு’, ‘விசுவாசம்’ ஆகியவற்றைத் தொடர்ந்து வரும் இரு முன்னிடைச் சொற்றொடர்களுடன் எவ்வாறு தொடர்புபடுத்துவது
  choice: கிரேக்கத்தின் மேற்பரப்பு அமைப்பிலுள்ள தெளிவின்மையைப் பாதுகாக்கும் வகையில், அன்பும் விசுவாசமும் ஆண்டவர் இயேசுவிடமும் பரிசுத்தவான்கள் அனைவரிடமும் தொடர்புபடுத்தப்பட்டுள்ளன.
  alternative: ‘ஆண்டவர் இயேசுவின்மேல் நீ கொண்டுள்ள விசுவாசத்தையும், பரிசுத்தவான்கள் அனைவரிடமும் நீ கொண்டுள்ள அன்பையும்’ என்று பகிர்ந்திணைத்துப் பொருள் கூறுதல்.
  rationale: பகிர்ந்திணைத்த வாசிப்பு பவுலின் வழக்கத்துக்கும் 7ஆம் வசனத்துக்கும் நன்றாகப் பொருந்துகிறது. ஆயினும், கிரேக்க வாக்கியத்தில் இரண்டு பெயர்ச்சொற்களுக்குப் பின்பு இரண்டு முன்னிடைச் சொற்றொடர்கள் வருகின்றன; அவற்றைத் தனித்தனியே பகிர்ந்து இணைக்கும் வெளிப்படையான குறியீடு இல்லை. ஆகவே மூலத்தின் பதற்றம் முதன்மை உரையில் காக்கப்பட்டு, இயல்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: πίστις என்பதன் பொருள் நுணுக்கம்
  choice: விசுவாசம்
  alternative: உண்மைத்தன்மை / விசுவாசமுள்ள நடத்தை
  rationale: இங்கு ‘விசுவாசம்’ அடிப்படைப் பொருளாக ஏற்றது; இருப்பினும் நம்பிக்கையோடு உண்மைத்தன்மையும் இதில் ஒலிக்கக்கூடும் என்பதால் அந்த வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதைக்குரிய நடையைக் கடைப்பிடிக்கிறது. ‘ஆண்டவர்’, ‘விசுவாசம்’, ‘பரிசுத்தவான்கள்’ ஆகிய நிலைபெற்ற வேதாகமச் சொற்கள் பொதுவாசகர்களுக்குப் புரியுமாறு பயன்படுத்தப்பட்டுள்ளன. கிரேக்க இலக்கணத் தெளிவின்மையை முற்றிலும் தீர்த்துவிடாமல், தமிழில் வாசிக்கக்கூடிய வகையில் இரு உறவுகளையும் மீளுரைத்து வெளிப்படுத்தியுள்ளது.
