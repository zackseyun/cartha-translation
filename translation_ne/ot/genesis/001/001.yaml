  yaml_path: translation/ot/genesis/001/001.yaml
  text: In the beginning, when God created the heavens and the earth[a]—
translation:
  language: ne
  text: आदिमा, जब परमेश्वरले आकाश र पृथ्वी सृष्टि गर्नुभयो[a]—
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 'परम्परागत रूपमा यसलाई पूर्ण वाक्यका रूपमा अनुवाद गरिन्छ: ‘आदिमा परमेश्वरले आकाश र पृथ्वी सृष्टि गर्नुभयो।’ हिब्रूमा उपपदविहीन בְּרֵאשִׁית पछि सीमित क्रिया בָּרָא आएको संरचना उत्पत्ति २:४खसँग समानान्तर आश्रित कालवाचक उपवाक्यका रूपमा बढी स्वाभाविक देखिन्छ। मुख्य वाक्य पद ३ मा आउँछ: ‘परमेश्वरले भन्नुभयो, “उज्यालो होस्।”’'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּרֵאשִׁית
  choice: आदिमा, जब … सृष्टि गर्नुभयो
  rationale: उपपदविहीन בְּרֵאשִׁית पछि सीमित क्रिया בָּרָא आएको हुनाले यसलाई आश्रित कालवाचक उपवाक्यका रूपमा बुझ्नु स्वाभाविक छ। ‘आदिमा’ ले רֵאשִׁית को मूल अर्थ जोगाउँछ र ‘जब’ ले वाक्यांशको आश्रित सम्बन्ध देखाउँछ।
- source_word: בָּרָא
  choice: सृष्टि गर्नुभयो
  rationale: यो हिब्रू बाइबलमा परमेश्वरको सृजनात्मक कार्यका लागि प्रचलित क्रिया हो। आदरसूचक क्रियारूपले नेपालीमा परमेश्वरलाई जनाउने स्वाभाविक र मर्यादित प्रयोग दिन्छ।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: रूपले बहुवचनजस्तो भए पनि यहाँ यससँग एकवचन क्रिया בָּרָא प्रयोग भएको छ, त्यसैले एकवचन ‘परमेश्वर’ उपयुक्त छ।
- source_word: אֵת
  choice: '[प्रत्यक्ष अनुवाद नगरिएको; निश्चित कर्मको सूचक]'
  rationale: אֵת हिब्रूमा निश्चित प्रत्यक्ष कर्म चिनाउने व्याकरणिक सूचक हो; नेपालीमा यसको छुट्टै शब्दगत समकक्ष आवश्यक पर्दैन।
- source_word: הַשָּׁמַיִם
  choice: आकाशहरू
  rationale: हिब्रूको रूप बहुवचन छ। ‘आकाशहरू’ ले स्रोतको रूप जोगाउँछ र ‘आकाशहरू र पृथ्वी’ भन्ने समष्टिसूचक युग्मलाई स्पष्ट राख्छ।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: אָרֶץ को अर्थ ‘भूमि’ वा ‘पृथ्वी’ हुन सक्छ; तर ‘आकाशहरू’ सँगको विश्वव्यापी युग्ममा ‘पृथ्वी’ नै सन्दर्भअनुकूल छ।
theological_decisions:
- issue: आरम्भिक खण्डको वाक्यविन्यास
  choice: 'आश्रित कालवाचक उपवाक्य: ‘आदिमा, जब परमेश्वरले आकाशहरू र पृथ्वी सृष्टि गर्नुभयो—’'
  alternative: 'स्वतन्त्र पूर्ण वाक्य: ‘आदिमा परमेश्वरले आकाशहरू र पृथ्वी सृष्टि गर्नुभयो।’'
  rationale: उपपदविहीन בְּרֵאשִׁית, त्यसपछि आएको सीमित क्रिया בָּרָא, र उत्पत्ति २:४ख तथा होशे १:२ का समान कालवाचक आरम्भहरूले आश्रित उपवाक्यको पाठलाई समर्थन गर्छन्। तथापि परम्परागत स्वतन्त्र-वाक्य पाठ वास्तविक विकल्प भएकाले पादटिप्पणीमा सुरक्षित गरिएको छ; यस पदको वाक्यविन्यासद्वारा मात्र कुनै सृष्टिसम्बन्धी सिद्धान्त निर्णीत गरिएको छैन।
translation_notes:
  register: आधुनिक मानक नेपालीमा स्वाभाविक, मर्यादित र सर्वसाधारणले बुझ्ने शैली अपनाइएको छ। आश्रित उपवाक्य अझै जारी रहेको देखाउन अन्त्यमा दीर्घ ड्यास राखिएको छ। ‘आकाशहरू’ ले हिब्रू बहुवचनलाई औपचारिक रूपमा जोगाउँछ।
