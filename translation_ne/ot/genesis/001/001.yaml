- from: आदिमा, जब परमेश्वरले आकाशहरू र पृथ्वी सृष्टि गर्नुभयो[a]—
  to: आदिमा, जब परमेश्वरले आकाश र पृथ्वी सृष्टि गर्नुभयो[a]—
  rationale: ‘आकाश’ in the singular is the idiomatic Nepali collective expression in the fixed cosmic pair ‘आकाश र पृथ्वी’. This preserves the Hebrew merism and avoids an unnatural plural while leaving the selected dependent-clause syntax, its continuation dash, and the traditional alternative intact.
