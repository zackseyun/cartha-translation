  yaml_path: translation/ot/ecclesiastes/001/002.yaml
  text: Breath of breaths[a], says Qoheleth[b]; breath of breaths, all is mere breath.
translation:
  language: ne
  text: “सासहरूको सास[a],” कोहेलेत[b] भन्छन्, “सासहरूको सास! सबै कुरा सास मात्र हो।”
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: हिब्रू הֶבֶל (हेवेल) को शाब्दिक अर्थ ‘सास’ वा ‘वाफ’ हो। यस पुस्तकमा यस शब्दले सासझैँ छिट्टै बितेर जाने, समात्न नसकिने र अपेक्षा तथा वास्तविकताबीच नमिल्ने विडम्बनात्मक अवस्थालाई एकैसाथ सङ्केत गर्छ। कुनै एउटै नेपाली अमूर्त शब्दले यी सबै अर्थछाया समेट्दैन। ‘सासहरूको सास’ हिब्रूको चरमोत्कर्ष जनाउने संरचना हो, जस्तै ‘गीतहरूको गीत’।
    reason: ‘तुरुन्तै बितिजाने’ लाई व्याकरणसम्मत र स्वाभाविक ‘छिट्टै बितेर जाने’ मा सुधारिएको छ।
lexical_decisions:
- source_word: הֲבֵל / הָבֶל
  choice: सास / सास मात्र
  rationale: हिब्रू הֶבֶל को मूल ठोस चित्र ‘सास’ वा ‘वाफ’ हो। ‘सास’ ले क्षणभङ्गुर, पक्रन नसकिने र अपेक्षा तथा परिणामबीचको विडम्बनात्मक अन्तर—यी अर्थछायालाई खुला राख्छ। अन्तिम विधेयमा ‘मात्र’ ले पदार्थसम्बन्धी परिभाषा होइन, अवमूल्यनकारी निष्कर्ष व्यक्त गर्छ।
- source_word: הֲבֵל הֲבָלִים
  choice: सासहरूको सास
  rationale: सम्बन्धवाचक एकवचन–बहुवचन संरचनाले हिब्रूको चरमोत्कर्ष जनाउने ढाँचा (‘गीतहरूको गीत’, ‘पवित्रहरूको परमपवित्र’) जोगाउँछ र मूल ठोस चित्रलाई अमूर्त व्याख्याले प्रतिस्थापन गर्दैन।
- source_word: אָמַר
  choice: भन्छन्
  rationale: साहित्यिक कथनसूत्रलाई नेपालीमा जीवन्त वर्तमानकालमा स्वाभाविक रूपमा व्यक्त गरिएको छ। ‘भन्छन्’ ले कोहेलेतलाई सम्बोधन गर्दा मर्यादित नेपाली प्रयोग दिन्छ।
- source_word: קֹהֶלֶת
  choice: कोहेलेत
  rationale: हिब्रू पदवी/नामलाई लिप्यन्तरण गर्दा ‘शिक्षक’ वा ‘उपदेशक’ जस्ता अर्थलाई अगावै निश्चित गरिँदैन।
- source_word: הַכֹּל
  choice: सबै कुरा
  rationale: यसले हिब्रू पदको व्यापक र समग्र बललाई आधुनिक नेपालीमा स्वाभाविक रूपमा व्यक्त गर्छ।
theological_decisions:
- issue: कोहेलेतको मुख्य रूपक הֶבֶל को अर्थ
  choice: ठोस चित्रका रूपमा ‘सास’ राख्ने; अन्तिम विधेयमा ‘सास मात्र’ भन्ने
  alternative: व्यर्थता, निरर्थकता, क्षणभङ्गुरता, वाफ
  rationale: ‘निरर्थकता’ ले नास्तिकतामूलक वा शून्यवादी निष्कर्ष थप्न सक्छ, ‘व्यर्थता’ ले लक्ष्य असफल भएको पक्षमा मात्र अर्थ साँघुर्याउँछ, र ‘क्षणभङ्गुरता’ ले पक्रन नसकिने तथा विडम्बनात्मक पक्ष गुमाउँछ। ‘सास’ ले मूल रूपक र यसको बहुअर्थी तनाव जोगाउँछ।
- issue: קֹהֶלֶת लाई पदवीका रूपमा अनुवाद गर्ने कि लिप्यन्तरण गर्ने
  choice: ‘कोहेलेत’ भनेर लिप्यन्तरण गर्ने
  alternative: शिक्षक, उपदेशक, सभासञ्चालक
  rationale: शब्दको ठ्याक्कै भूमिका विवादित भएकाले लिप्यन्तरणले कुनै एक व्याख्यालाई पाठमै सिद्ध ठान्दैन।
translation_notes:
  register: भाषा आधुनिक, मर्यादित र काव्यात्मक छ। दोहोरिएको ‘सासहरूको सास’ जानाजानी असामान्य राखिएको छ, किनकि यसले हिब्रूको चरमोत्कर्ष संरचना र मूल रूपक दुवै जोगाउँछ। उद्धरणचिह्न र विस्मयादिबोधक चिन्हले नेपालीमा कथनको वक्तृतीय प्रहार स्पष्ट पार्छन्।
