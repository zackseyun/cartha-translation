  text: Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ θεὸς ἦν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/001.yaml
  text: In the beginning was the Word[a], and the Word was with God[b], and the Word was God.
translation:
  language: ne
  text: आदिमा[a] वचन हुनुहुन्थ्यो, वचन परमेश्वरसँग हुनुहुन्थ्यो, र वचन परमेश्वर[b] हुनुहुन्थ्यो।
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: ‘आदिमा’ भन्ने वाक्यांशले उत्पत्ति १:१ को प्रतिध्वनि दिँदै वचनलाई सृष्टिको आरम्भसँग जोड्छ।
    reason: cross_reference
  - marker: b
    text: अथवा, ‘वचन ईश्वरीय हुनुहुन्थ्यो’ वा ‘परमेश्वर जे हुनुहुन्थ्यो, वचन त्यही हुनुहुन्थ्यो।’ ग्रीकमा अन्तिम खण्डको ‘परमेश्वर’ले मुख्यतः वचनको गुण वा स्वभाव जनाउँछ। यसले वचन परमेश्वरकै स्वभावका हुनुहुन्थ्यो भन्ने पुष्टि गर्छ, तर अघिल्लो खण्डमा उल्लिखित परमेश्वरसँग वचनलाई एउटै व्यक्ति ठहराउँदैन।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν ἀρχῇ
  choice: आदिमा
  rationale: यसले उत्पत्ति १:१ को भाषिक र वैचारिक प्रतिध्वनि जोगाउँछ। ‘सुरुमा’ स्वाभाविक विकल्प भए पनि ‘आदिमा’ ले सृष्टिको आरम्भसँगको सम्बन्ध अझ स्पष्ट र संक्षिप्त रूपमा व्यक्त गर्छ।
- source_word: ἦν
  choice: हुनुहुन्थ्यो
  rationale: εἰμί को अपूर्ण भूतकाललाई सरल अस्तित्वसूचक क्रियाले व्यक्त गरिएको छ। ‘वचन’लाई यस प्रसङ्गमा व्यक्तिका रूपमा प्रस्तुत गरिएको हुनाले आधुनिक सम्मानसूचक नेपाली रूप स्वाभाविक छ; तीनै खण्डमा यसको पुनरावृत्तिले मूलको लय पनि जोगाउँछ।
- source_word: ὁ λόγος
  choice: वचन
  rationale: λόγος को अर्थक्षेत्र फराकिलो भए पनि यहाँ यो यूहन्नाको ख्रीष्टसम्बन्धी पदनाम हो। ‘वचन’ले परमेश्वरको अभिव्यक्ति र व्यक्तिगत पहिचान दुवैको सम्भावना जोगाउँछ; ‘सन्देश’ बढी व्याख्यात्मक र ‘लोगोस’ साधारण पाठकका लागि अपरिचित हुन्छ।
- source_word: πρὸς τὸν θεόν
  choice: परमेश्वरसँग
  rationale: πρός ले यहाँ निकट सम्बन्ध र आमनेसामने उन्मुखता संकेत गर्न सक्छ। ‘परमेश्वरसँग’ स्वाभाविक नेपाली हो र वचन तथा परमेश्वरबीचको सम्बन्धसँगै व्यक्तिगत भिन्नता पनि कायम राख्छ।
- source_word: τὸν θεόν
  choice: परमेश्वर
  rationale: निश्चित रूपमा उल्लिखित θεός लाई नेपालीको प्रचलित एकेश्वरवादी पद ‘परमेश्वर’ले स्वाभाविक र स्पष्ट रूपमा व्यक्त गर्छ।
- source_word: θεὸς ἦν ὁ λόγος
  choice: वचन परमेश्वर हुनुहुन्थ्यो
  rationale: क्रियाभन्दा अघि आएको लेखरहित θεός ले मुख्यतः वचनको गुण वा स्वभाव जनाउँछ। मुख्य पाठको यस संक्षिप्त रूपले कथनको पूर्ण बल र मूलको तनाव जोगाउँछ; गुणात्मक सूक्ष्मता पादटिप्पणीमा स्पष्ट गरिएको छ।
theological_decisions:
- issue: अन्तिम खण्डमा लेखरहित विधेय θεός को अनुवाद
  choice: वचन परमेश्वर हुनुहुन्थ्यो
  alternative: वचन ईश्वरीय हुनुहुन्थ्यो; अथवा, परमेश्वर जे हुनुहुन्थ्यो, वचन त्यही हुनुहुन्थ्यो
  rationale: 'ग्रीक वाक्यरचनामा θεός गुणात्मक बलमा छ: यसले वचन परमेश्वरकै स्वभावका हुनुहुन्थ्यो भन्ने पुष्टि गर्छ, तर अघिल्लो खण्डमा उल्लिखित परमेश्वर र वचनलाई एउटै व्यक्ति भनेर मिसाउँदैन। ‘ईश्वरीय’ले नेपालीमा कथनको बल घटाउन सक्छ, र ‘परमेश्वर जे हुनुहुन्थ्यो...’ अनुवादभन्दा बढी व्याख्या हो। त्यसैले मुख्य पाठमा सीधा रूप राखेर सूक्ष्मता पादटिप्पणीमा दिइएको छ।'
translation_notes:
  register: भाषा आधुनिक, मर्यादित र सार्वजनिक पाठका लागि सुबोध राखिएको छ। ‘आदिमा’ र ‘वचन’ जस्ता स्थापित बाइबलीय पदहरू सामान्य पाठकले बुझ्ने गरी कायम छन्। ‘हुनुहुन्थ्यो’ को सम्मानसूचक रूपले नेपालीमा व्यक्तिगत सन्दर्भ स्वाभाविक बनाउँछ, तर मूल पाठभन्दा बाहिर कुनै सम्प्रदायगत उपाधि थप्दैन।
