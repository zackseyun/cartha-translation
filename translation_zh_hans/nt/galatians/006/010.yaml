  text: ἄρα οὖν ὡς καιρὸν ⸀ἔχομεν, ἐργαζώμεθα τὸ ἀγαθὸν πρὸς πάντας, μάλιστα δὲ πρὸς τοὺς οἰκείους τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/010.yaml
  text: So then[a], as we have opportunity, let us do what is good toward everyone[c][b], and especially toward those who are of the household of faith.
translation:
  language: zh_hans
  text: 所以，只要有机会[a]，我们就当向所有人行善，尤其是向信仰家庭中的人[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“趁着还有时间”。希腊语καιρός强调合宜、可把握的时机，并非泛指时间。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“信仰大家庭中的人”或“信仰之家的成员”。原文用“家”的语言指属于信徒群体的人。
    reason: lexical_alternative
  - marker: c
    text: “信仰”也可理解为“所共同相信的信仰”，即信徒共同承认的信仰。
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρα οὖν
  choice: 所以
  rationale: 这两个推论性小词承接上文并引出结论；“所以”在现代汉语中自然、清楚，也保留了推论语气。
- source_word: ὡς καιρὸν ἔχομεν
  choice: 趁着有机会
  rationale: καιρός侧重合宜、可把握的时机，而不只是一般意义上的时间；“趁着有机会”既传达时机性，也符合现代汉语表达。
- source_word: ἐργαζώμεθα
  choice: 我们要……行
  rationale: 现在时虚拟语气在此用于劝勉，指向持续实行；“我们要……行善”自然地表达共同劝勉，而不生硬直译为“做工”。
- source_word: τὸ ἀγαθόν
  choice: 行善
  rationale: 带冠词的中性形容词在此作名词使用，意为“善事”或“美善的事”；“行善”是简洁自然的汉语搭配，并保留道德行动的含义。
- source_word: πρὸς πάντας
  choice: 向所有人
  rationale: πρός加宾格表示行动所指向的对象；“向所有人”明确保留普遍范围。
- source_word: μάλιστα δὲ
  choice: 尤其
  rationale: μάλιστα在普遍命令之内标明特别优先的对象，并不排除其他人；“尤其”准确保留这一层次。
- source_word: τοὺς οἰκείους τῆς πίστεως
  choice: 属信仰之家的人
  rationale: οἰκεῖοι带有同一家室、属于一个家的人之意；此译保留家庭隐喻，又不把它过度制度化为某种组织成员身份。
- source_word: πίστεως
  choice: 信仰
  rationale: πίστις在这里界定这个“家”；译作“信仰”保留其基本语义，同时不排除“共同所信之道”的理解。
theological_decisions:
- issue: 行善对象的普遍范围与信徒群体的特别优先性
  choice: 命令面向所有人，同时特别强调属信仰之家的人。
  alternative: 只向信徒行善；或不承认对信徒群体有任何特别责任。
  rationale: πρὸς πάντας明确给出普遍范围，μάλιστα则在其中标出特别优先次序；译文同时保留两者，不让任何一面吞没另一面。
- issue: τῆς πίστεως在“信仰之家”中的含义
  choice: 正文保留“信仰”，把它作为这个家的身份标志。
  alternative: 理解为带有共同信条意味的“所信之道”；或理解为“忠信”。
  rationale: 上下文支持以“信仰”标识信徒共同体，但并未要求译文把它限定成制度化或信条化的概念；脚注保留“所共同相信的信仰”这一可能理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“趁着有机会”自然表达καιρός的时机含义；“属信仰之家的人”略带书面色彩，以保留原文鲜明的家庭隐喻。
