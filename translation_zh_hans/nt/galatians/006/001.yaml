id: GAL.6.1
reference: Galatians 6:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἀδελφοί, ἐὰν καὶ προλημφθῇ ἄνθρωπος ἔν τινι παραπτώματι, ὑμεῖς οἱ πνευματικοὶ καταρτίζετε τὸν τοιοῦτον ἐν πνεύματι πραΰτητος, σκοπῶν σεαυτόν, μὴ καὶ σὺ πειρασθῇς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/001.yaml
  text: Brothers[a], even if a man is caught in some trespass, you who are spiritual should restore such a one in a spirit of gentleness, watching yourself[c][b], lest you also be tempted.
translation:
  language: zh_hans
  text: 弟兄们[a]，即使有人在某种过犯中被抓住[b]，你们属灵的人也要本着温柔的心[c]挽回这样的人。你也要留意自己，免得自己也受诱惑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”原文为阳性复数，在这里可以称呼包括女性在内的同信群体，也可译作“弟兄姊妹们”。
    reason: lexical_alternative
  - marker: b
    text: “被抓住”也可理解为“被过犯追上”“被过犯乘隙制伏”，或“在过犯中被发现”。
    reason: alternative_reading
  - marker: c
    text: “心”原文直译为“灵”。这句话可以指温柔的内在态度，也可能使人联想到圣灵所塑造的温柔。
    reason: theological_ambiguity
lexical_decisions:
- source_word: Ἀδελφοί
  choice: 弟兄们
  rationale: 保留呼格复数的传统、庄重表达；在本语境中可用于称呼包括女性在内的同信群体，故以脚注说明。
- source_word: ἐὰν καὶ
  choice: 即使
  rationale: 传达条件句所含的让步意味，符合现代汉语习惯。
- source_word: προλημφθῇ
  choice: 被抓住
  rationale: 保留被动形式及“被逮住”的基本意象，同时不在正文中断定是被人发现，还是被过犯追上、乘隙制伏；其他可能含义收入脚注。
- source_word: ἄνθρωπος
  choice: 有人
  rationale: ἄνθρωπος在此为单数泛指，现代汉语用“有人”既自然，也保留个体指向，并不限定性别。
- source_word: ἔν τινι παραπτώματι
  choice: 在某种过犯中
  rationale: “某种”对应不定代词τινι；“过犯”表达偏离正道和道德越界的严肃含义。
- source_word: οἱ πνευματικοὶ
  choice: 你们属灵的人
  rationale: 保留形容词实体化表达的宽度，不将其明确窄化为“成熟的人”或扩写成“受圣灵引导的人”。
- source_word: καταρτίζετε
  choice: 要……挽回
  rationale: 该动词表示使之恢复正常、修复、复原；“挽回”适合人的处境，并清楚表达命令语气。
- source_word: τὸν τοιοῦτον
  choice: 这样的人
  rationale: 自然地回指前述陷于过犯者，并保留单数焦点。
- source_word: ἐν πνεύματι πραΰτητος
  choice: 本着温柔的心
  rationale: 以自然现代汉语表达温柔的内在态度；脚注保留πνεῦμα可译“灵”以及可能令人联想到圣灵工作的空间。
- source_word: σκοπῶν σεαυτόν
  choice: 你也要留意自己
  rationale: 保留原文由复数“你们”转向单数“你”的变化，使警告直接落到每一位参与挽回者身上。
- source_word: μὴ καὶ σὺ πειρασθῇς
  choice: 免得自己也受诱惑
  rationale: 在道德过犯的语境中，πειράζω最自然地指诱惑；“也”保留共同软弱、同样可能跌倒的警告。
theological_decisions:
- issue: Ἀδελφοί所称呼群体的性别范围
  choice: 正文译作“弟兄们”，脚注说明可包括女性信徒。
  alternative: 弟兄姊妹们；众弟兄姊妹
  rationale: 既透明保留原文阳性复数形式，也不让现代读者误以为保罗只对男性说话。
- issue: προλημφθῇ的语义方向
  choice: 正文译作“被抓住”，脚注保留“被过犯追上或乘隙制伏”等可能。
  alternative: 被发现；被过犯所胜；猝然陷入
  rationale: 原词在此既可能描写人在过犯中被逮住，也可能强调过犯出其不意地追上人；不在正文中排除其中一种。
- issue: πνεύματι πραΰτητος中的“灵”
  choice: 正文译作“本着温柔的心”，脚注注明原文直译及圣灵关联的可能。
  alternative: 以温柔的灵；在温柔的灵里
  rationale: 短语可着重人的温柔态度，也可能与圣灵所塑造的生命相呼应；正文采用自然汉语，脚注保存神学张力。
- issue: πειρασθῇς是“受诱惑”还是“受试验”
  choice: 受诱惑
  alternative: 受试验
  rationale: 上下文聚焦过犯及挽回者同样跌倒的危险，因此“受诱惑”最符合语境，但没有把人的共同脆弱解释成某一特定罪。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“挽回”兼顾牧养语境与καταρτίζω的修复含义；保留原文从复数“你们”突然转为单数“你”的劝戒力度。
