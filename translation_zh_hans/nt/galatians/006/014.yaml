id: GAL.6.14
reference: Galatians 6:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐμοὶ δὲ μὴ γένοιτο καυχᾶσθαι εἰ μὴ ἐν τῷ σταυρῷ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ ἐμοὶ κόσμος ἐσταύρωται ⸀κἀγὼ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/014.yaml
  text: But far be it from me to boast except in the cross of our Lord Jesus the Messiah[a], through which the world has been crucified to me[b], and I to the world.
translation:
  language: zh_hans
  text: 但至于我，我绝不夸耀，只夸耀我们主耶稣弥赛亚[b]的十字架。借着这十字架[a]，世界对我已经钉在十字架上，我对世界也已经钉在十字架上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“借着他”；关系代词也可能指前面的主耶稣弥赛亚，而不是十字架。
    reason: alternative_reading
  - marker: b
    text: 希腊文Χριστός，意为“受膏者”，即“弥赛亚”，传统上常译作“基督”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοὶ δὲ μὴ γένοιτο
  choice: 但至于我，我绝不
  rationale: ἐμοὶ具有强调作用，μὴ γένοιτο是表达强烈拒绝的惯用语；“但至于我，我绝不”既保留个人强调，也符合现代汉语表达。
- source_word: καυχᾶσθαι
  choice: 夸耀
  rationale: 保留保罗语境中“以某事为荣耀、据此自夸”的含义，也与本章有关肉体和割礼的对比相呼应。
- source_word: εἰ μὴ
  choice: 只
  rationale: 在强烈否定之后表示唯一例外；汉语用“绝不……只……”自然清楚。
- source_word: σταυρῷ
  choice: 十字架
  rationale: 这是新约受难语境中σταυρός的通行且准确的现代汉语译法。
- source_word: Χριστοῦ
  choice: 弥赛亚
  rationale: 在完整称号Ἰησοῦ Χριστοῦ中保留Χριστός作为称号的语义，而不把它仅当作无意义的音译姓名。
- source_word: δι’ οὗ
  choice: 借着这十字架
  rationale: 关系代词最直接可回指紧邻的σταυρῷ，并表达凭借、借由之意；由于它也可能回指耶稣弥赛亚，另以脚注保留这一真实歧义。
- source_word: κόσμος
  choice: 世界
  rationale: 保留κόσμος宽广而有张力的含义，不在正文中把它收窄为某一种特定的世界体系。
- source_word: ἐσταύρωται
  choice: 已经钉在十字架上
  rationale: 希腊语完成时表达已经发生并持续有效的状态；“已经钉在十字架上”保留十字架隐喻及其结果性。
- source_word: κἀγὼ κόσμῳ
  choice: 我对世界也已经钉在十字架上
  rationale: 希腊文后半句省略了从前句承接的动词；汉语补出动词以免意义含混，同时保留“世界对我／我对世界”的对称结构。
theological_decisions:
- issue: δι’ οὗ的先行词
  choice: 正文按“十字架”理解，译作“借着这十字架”
  alternative: 按“主耶稣弥赛亚”理解，译作“借着他”
  rationale: σταυρῷ与关系代词在语法上相合，也是距离最近的可能先行词；但Ἰησοῦ Χριστοῦ同样可以成为回指对象，因此不在脚注中消除这一歧义。
- issue: Χριστοῦ是称号还是固定姓名成分
  choice: 译为“弥赛亚”
  alternative: 译为传统音译“基督”
  rationale: 此处位于“耶稣弥赛亚”的完整称号中，译出“受膏者／弥赛亚”的称号意义，更能让普通读者看见原词的语义；脚注同时注明传统译法。
- issue: 世界与保罗彼此被钉十字架的陈述
  choice: 保留双向、对称的十字架隐喻
  alternative: 解释性改写为“世界不再影响我，我也不再属于世界”
  rationale: 解释性改写会过早限定神学含义；直译其双向关系，保留保罗原有的张力和修辞力度。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“绝不……只……”传达强烈排拒和唯一例外；后半句补出省略的谓语，使普通读者容易理解，同时以平行句式保留原文的凝练和力度。
