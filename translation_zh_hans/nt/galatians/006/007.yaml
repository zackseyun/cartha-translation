  text: μὴ πλανᾶσθε, θεὸς οὐ μυκτηρίζεται· ὃ γὰρ ⸀ἐὰν σπείρῃ ἄνθρωπος, τοῦτο καὶ θερίσει·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/007.yaml
  text: 'Do not be deceived: God is not mocked[a], for whatever a man sows, this he will also reap.'
translation:
  language: zh_hans
  text: 不要受迷惑；上帝是不能被嘲弄的[a]。因为人种什么，也必收什么。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝是不容轻慢的。”原词可指嘲弄、嗤笑或轻蔑地对待。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: 不要自欺
  rationale: 原文是现在时被动命令式，可表示“不要受骗／不要被引入歧途”。结合本句警告人不可妄想逃避行为后果的语境，现代汉语“不要自欺”自然有力，也保留受迷惑的警告意味。
- source_word: θεὸς
  choice: 上帝
  rationale: 此处指独一的上帝；“上帝”是现代标准汉语中清楚、庄重的常用译法。
- source_word: οὐ μυκτηρίζεται
  choice: 是轻慢不得的
  rationale: μυκτηρίζω本义涉及嗤笑、蔑视或以轻蔑态度对待。此处并非仅指言语嘲笑，而是宣告人不能藐视上帝、以为可以无视他的秩序；“轻慢不得”兼顾原词的轻蔑意味和中文警句语气。
- source_word: ὃ γὰρ ἐὰν
  choice: 因为……的是什么
  rationale: 不定关系结构表达普遍条件；用“……的是什么”引出一般原则，符合自然汉语。
- source_word: σπείρῃ
  choice: 种
  rationale: 保留播种与收获的农业比喻。“种”在现代汉语中简洁自然，并与下文“收”构成鲜明对应。
- source_word: ἄνθρωπος
  choice: 人
  rationale: ἄνθρωπος在这里是代表全人类的一般性单数，并不专指男性。汉语“人”既准确保留其普遍所指，也无需加入原文没有的性别限定。
- source_word: τοῦτο καὶ θερίσει
  choice: 收的也是什么
  rationale: “也”对应καί，并以“种的是什么，收的也是什么”的平行结构体现τοῦτο所强调的对应关系：所收的正是所种的。
theological_decisions:
- issue: μὴ πλανᾶσθε的语态及责任意味
  choice: 不要自欺
  alternative: 不要受骗
  rationale: 被动形式可直译为“不要受骗”，但在此警告语境中，“自欺”体现人错误地以为可以轻慢上帝而不承担后果。此译法不排除“受迷惑”的语义，只以自然汉语突出本句的自我警醒作用。
- issue: 上帝不可被轻慢的陈述
  choice: 上帝是轻慢不得的
  alternative: 上帝是不能被嘲弄的
  rationale: 原句不是说人事实上从不嘲弄上帝，而是说这种轻蔑不能得逞、不会逃过后果。“轻慢不得”保存这一神学张力，同时避免把μυκτηρίζω缩窄为口头讥笑。
- issue: ἄνθρωπος的普遍所指
  choice: 人
  alternative: 一个男人
  rationale: 希腊词在此为一般性单数，原则适用于任何人。现代汉语“人”准确表达这种普遍范围，不引入男性专指。
translation_notes:
  register: 采用现代、庄重而易懂的警句体。分号保留劝诫与宣告之间的紧密联系；后一句使用“种……收……”的对称结构，使农业比喻及其因果力度在普通话中自然呈现。
