  text: Ἴδετε πηλίκοις ὑμῖν γράμμασιν ἔγραψα τῇ ἐμῇ χειρί.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/011.yaml
  text: See with what large letters I have written to you with my own hand[a].
translation:
  language: zh_hans
  text: 请看，我亲手写给你们的字是多么大！[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“请看，我亲手给你们写了多么长的一封信！”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἴδετε
  choice: 请看
  rationale: 这是复数命令式，在此用于唤起收信人的注意；“请看”直接、自然，又保留劝请语气。
- source_word: πηλίκοις
  choice: 多么大
  rationale: 该词表示大小或程度；与γράμμασιν连用时，最自然地指字迹的大小。
- source_word: γράμμασιν
  choice: 字
  rationale: 这里指书写出来的字母或字符；现代汉语用“字”比“字母”更自然，也能清楚表达字迹大小。
- source_word: ὑμῖν
  choice: 给你们
  rationale: 与ἔγραψα构成“写给你们”，明确加拉太众教会为收信人。
- source_word: ἔγραψα
  choice: 写
  rationale: 希腊文简单过去时在书信语境中指眼前已经写下的内容；汉语不必另加完成标记，依上下文即可表达。
- source_word: τῇ ἐμῇ χειρί
  choice: 我亲手
  rationale: 工具格短语强调保罗本人执笔；“亲手”自然表达ἐμῇ的强调意味。
theological_decisions:
- issue: πηλίκοις γράμμασιν的含义
  choice: 指所写之字的尺寸很大
  alternative: 指保罗亲手写了这么长的一封信
  rationale: γράμματα通常可指字母或字符，并且下文紧接“亲手”，因此主文采用“大字”的理解；但πηλίκος也可表达程度或篇幅，历史上确有“这么长的信”这一解释，故以脚注保留真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“请看”作为提示语自然直接；调整语序为“我亲手写给你们的字”，既符合汉语习惯，也保留原文对亲笔书写和字迹大小的强调。
