  source_fidelity: 译文准确传达了原文的概括性主语（ὅσοι）、其意愿、在“肉体”中的外在体面诉求、强迫受割礼，以及“仅仅为了”避免因弥赛亚的十字架受迫害这一动机。将 τῷ σταυρῷ 译为“因……十字架而”是有根据且自然的原因性处理；脚注也保留了其可作关联性理解的余地。
