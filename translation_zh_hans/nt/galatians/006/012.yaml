id: GAL.6.12
reference: Galatians 6:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅσοι θέλουσιν εὐπροσωπῆσαι ἐν σαρκί, οὗτοι ἀναγκάζουσιν ὑμᾶς περιτέμνεσθαι, μόνον ⸀ἵνα τῷ σταυρῷ τοῦ ⸀Χριστοῦ ⸀μὴ διώκωνται·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/012.yaml
  text: As many as want to make a good showing in the flesh[a], these are forcing you to be circumcised[c][b], only so that they may not be persecuted for the cross of the Messiah.
translation:
  language: zh_hans
  text: 凡想在肉体上显得体面的人，都在强迫你们受割礼；他们这样做，不过是为了不因弥赛亚的十字架而受迫害。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因弥赛亚的十字架而受迫害”也可译作“为弥赛亚的十字架受迫害”。
    reason: 保留 τῷ σταυρῷ 与“受迫害”之间可能是原因或关联的表达张力。
  - marker: b
    text: “弥赛亚”传统译作“基督”。
    reason: 保留 Χριστός 的传统音译式称号。
lexical_decisions:
- source_word: ὅσοι
  choice: 凡……的人
  rationale: 概括性地指所有属于这一类的人，既保留分配和周全的语气，也符合现代汉语表达。
- source_word: θέλουσιν
  choice: 想
  rationale: 直接表达意愿，简洁自然。
- source_word: εὐπροσωπῆσαι ἐν σαρκί
  choice: 在肉体上显得体面
  rationale: εὐπροσωπῆσαι 指使自己显得好看、体面；保留“肉体”以呈现保罗用语及其张力，而不把意义完全收窄为“外表”。
- source_word: οὗτοι
  choice: 都
  rationale: 汉语中以“凡……的人，都……”自然承接，并体现指示词强调这些人正是施压者。
- source_word: ἀναγκάζουσιν
  choice: 在强迫
  rationale: 表达持续施压和强制之意；“在”体现希腊文现在时的进行性语感。
- source_word: ὑμᾶς περιτέμνεσθαι
  choice: 你们受割礼
  rationale: 自然保留被动含义及本节所争论的具体宗教行为。
- source_word: μόνον ἵνα
  choice: 不过是为了
  rationale: 清楚传达保罗所指认的唯一动机以及目的关系。
- source_word: τῷ σταυρῷ
  choice: 因……十字架
  rationale: 此处与被动式“受迫害”相连，最自然地表达原因；同时不排除“为十字架的缘故”这一关系性理解。
- source_word: τοῦ Χριστοῦ
  choice: 弥赛亚的
  rationale: Χριστός 在这一属格结构中仍具有称号意义，译为“弥赛亚”能直接呈现其含义。
- source_word: μὴ διώκωνται
  choice: 不……受迫害
  rationale: 准确表达 ἵνα 后的被动虚拟式及逃避迫害的目的。
theological_decisions:
- issue: ἐν σαρκί 的含义
  choice: 在肉体上
  alternative: 在外表上；在外在的事上
  rationale: 保留保罗具有神学张力的“肉体”一词，同时上下文使读者可理解其涉及割礼这一身体标记及外在表现；不在正文中将其意义过早限定为单纯“外表”。
- issue: τῷ σταυρῷ 所表达的关系
  choice: 因……十字架而受迫害
  alternative: 为……十字架受迫害
  rationale: 与 διώκωνται 连用的与格可表达原因或关联；正文采用现代汉语较自然的因果表达，脚注保留较贴近形式且略具歧义的译法。
- issue: Χριστοῦ 作为称号或名称
  choice: 弥赛亚
  alternative: 基督
  rationale: 在“弥赛亚的十字架”这一结构中，称号含义仍清晰可辨；脚注保留传统译法“基督”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“凡……的人，都……”再现原句的概括与强调；“显得体面”比“作好看的人”自然，也带有保罗批评外在表现的语气。保留“肉体”与“弥赛亚”，避免抹平原文的神学用语。
