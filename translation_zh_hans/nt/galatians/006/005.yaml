  text: ἕκαστος γὰρ τὸ ἴδιον φορτίον βαστάσει.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/005.yaml
  text: For each one will carry his own load[a].
translation:
  language: zh_hans
  text: 因为各人都要背负自己的担子[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“各人都要承担自己的负荷。”这里的希腊词是 φορτίον（“担子、负荷”），不同于第2节的 βάρη（“重担”）。
    reason: 说明可行译法，并保留相邻经文中两个希腊名词的词汇区别。
lexical_decisions:
- source_word: ἕκαστος
  choice: 各人
  rationale: 这是分配性的单数，逐一指向每个人。“各人”在现代汉语中自然，也保留了逐个强调的意味。
- source_word: γὰρ
  choice: 因为
  rationale: 作为解释性连接词，承接上文并说明理由；“因为”清楚呈现这一逻辑关系。
- source_word: τὸ ἴδιον
  choice: 自己的
  rationale: ἴδιος 强调归于本人、而非他人的事物；“自己的”准确保留这种归属和个体责任意味。
- source_word: φορτίον
  choice: 担子
  rationale: φορτίον 指需要携带的负荷或担子。译作“担子”既具体自然，又可与第2节的 βάρη（通常译作“重担”）保持词语区别。
- source_word: βαστάσει
  choice: 要背负
  rationale: 这是将来时主动直陈式。“要背负”在现代汉语中自然地表达将来或必然承担之意，同时与“担子”搭配贴切，不额外限定为末世审判场景。
theological_decisions:
- issue: 本节与加拉太书6:2的关系
  choice: 以“担子”对应本节的 φορτίον，并以“重担”作为第2节 βάρη 的适当对应，从而保留原文的词汇区别和两节之间的张力。
  alternative: 两处都译作“重担”或“负担”；或把本节明确解释为末世审判时的个人交账。
  rationale: 保罗在相邻经文中使用了不同名词。本译文既不把二者等同，也不在正文中强行调和，更不把将来时限定为某一种神学解释；因此同时保留彼此担当与个人承担之间的张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“各人都”符合汉语分配表达；“背负自己的担子”保留原文的具体承载意象。正文不加入男性代词，因为汉语“各人／自己”已准确表达原文的泛指单数，也避免不必要的性别化。
