  text: εἰ γὰρ δοκεῖ τις εἶναί τι μηδὲν ὤν, ⸂φρεναπατᾷ ἑαυτόν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/003.yaml
  text: For if anyone thinks he is something when he is nothing[a], he deceives himself.
translation:
  language: zh_hans
  text: 因为人若自以为算得了什么，其实什么也不是，便是自欺[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “自欺”也可译作“迷惑自己”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: 因为，人若
  rationale: γάρ承接上文作解释，译作“因为”；εἰ保留条件关系，译作“若”。分开表达比生硬的“因为若”更符合现代汉语。
- source_word: δοκεῖ
  choice: 自以为
  rationale: 此处指人的自我判断，并非在别人眼中“似乎”如何；“自以为”也自然引出后面的身份评价。
- source_word: τις
  choice: 人
  rationale: τις在此为泛指单数；现代汉语用“人若”可自然涵盖任何人，无须添加性别。
- source_word: εἶναί τι
  choice: 算得了什么
  rationale: 保留“是某种人物、颇有分量”的习语意味，同时与后面的“什么也不是”形成简洁鲜明的对照。
- source_word: μηδὲν ὤν
  choice: 其实什么也不是
  rationale: ὤν为分词，说明其真实处境；“其实”自然呈现自我判断与事实之间的反差，而不把关系过度限定为时间或强让步。
- source_word: φρεναπατᾷ
  choice: 自欺
  rationale: 该动词表示在心思上欺骗、迷惑；与ἑαυτόν合译为惯用语“自欺”，简洁且准确。
- source_word: ἑαυτόν
  choice: 自
  rationale: 反身对象在汉语“自欺”中已明确表达，所指回到泛指的“人”。
theological_decisions:
- issue: “算得了什么”与“什么也不是”的张力
  choice: 保留保罗关于人自视有分量、实际却无可自夸的直接对照
  alternative: 释义为“自以为很重要，其实并不重要”
  rationale: 原文τι与μηδέν刻意形成“某物／无物”的尖锐对照；不将其弱化成仅仅社会地位或重要性的判断，也不额外界定这是在神面前还是在人面前。
- issue: 泛指单数的性别表达
  choice: 人／自
  alternative: 他／自己
  rationale: 希腊语τις在此虽搭配单数形式，却是泛指。汉语“人若……自欺”既保持单数代表性，也无需引入原文未强调的男性性别。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“算得了什么”是自然习语，保留原文τι与μηδέν的反差；“自欺”凝练表达动词与反身代词。脚注标记已置于正文相应位置。
