id: GAL.6.4
reference: Galatians 6:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τὸ δὲ ἔργον ἑαυτοῦ δοκιμαζέτω ἕκαστος, καὶ τότε εἰς ἑαυτὸν μόνον τὸ καύχημα ἕξει καὶ οὐκ εἰς τὸν ἕτερον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/004.yaml
  text: But let each one test his own work[a], and then he will have his reason for boasting in himself alone and not in the other person[b],
translation:
  language: zh_hans
  text: 但每个人都要察验自己的工作；那么，他夸口的根据[a]只在于自己，而不在于别人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “夸口的根据”也可译为“所夸的”或“夸口”。原文可指夸口的内容或根据。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“另一个”，指与自己相对的另一个人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔργον
  choice: 工作
  rationale: 保留该词宽泛的意义，指一个人所做的事或整体表现；结合上下文，可自然涵盖其行为，而不局限于某一件善行。
- source_word: δοκιμαζέτω
  choice: 要察验
  rationale: 表达命令语气以及检验、衡量品质的含义，同时不预设检验结果必然良好。
- source_word: ἕκαστος
  choice: 每个人
  rationale: 保留逐一分配的意味，也以现代汉语自然表达其泛指性。
- source_word: ἑαυτοῦ
  choice: 自己的
  rationale: 准确表达反身关系，强调各人察验自己的工作。
- source_word: καύχημα
  choice: 所夸的
  rationale: 汉语名词化表达可同时容纳“夸口之事”和“夸口的根据”两种相近含义，避免过早判定该词只指行为或只指依据。
- source_word: ἕξει
  choice: 就……有
  rationale: 借助“这样……就”自然表达将来结果；中文无需另译出一个生硬的“拥有”。
- source_word: εἰς ἑαυτὸν μόνον
  choice: 只在自己
  rationale: 保留介词结构的关系性与μόνον的限制作用，重点在依据自己受察验的工作，而非与别人比较。
- source_word: τὸν ἕτερον
  choice: 别人
  rationale: 明确指与自己相对的另一个人，在现代汉语中比直译“另一个”更自然。
- source_word: δέ
  choice: 但
  rationale: 承接上文并标示轻微转折：各人既要担当别人的重担，也要察验自己的工作。
theological_decisions:
- issue: καύχημα在保罗语境中的含义
  choice: 译为“所夸的”，保留夸口内容与夸口依据之间的语义张力。
  alternative: “可夸之处”或“夸口的根据”
  rationale: 原词可以指夸口本身，也可以指夸口的内容或根据。主文本不把它解释成现代意义上正面的“自豪”，也不判定这种夸口在道德上必然可取。
- issue: 泛指阳性单数的中文表达
  choice: 以“每个人”“自己的”“他”表达单数泛指。
  alternative: 全用无性别的重复名词，或改用复数“他们”
  rationale: “每个人”准确体现ἕκαστος的逐一性；后文用“他”保持单数照应，在现代汉语中可作通性泛指，并未把经文限定为男性。
- issue: 与别人比较的含义
  choice: 译作“不在别人”，不增译“比较”。
  alternative: “而不是靠跟别人比较”
  rationale: 上下文确有不以他人为参照的含义，但原文用的是εἰς结构，而未明说“比较”；主文本保留较开放的表达。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“察验”比“检查”更能表达审慎衡量品质的意味；分号呈现察验与其结果之间的逻辑关系。主文本中的“所夸的”刻意保留καύχημα可指夸口内容或夸口根据的歧义。
