id: GAL.6.8
reference: Galatians 6:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅτι ὁ σπείρων εἰς τὴν σάρκα ἑαυτοῦ ἐκ τῆς σαρκὸς θερίσει φθοράν, ὁ δὲ σπείρων εἰς τὸ πνεῦμα ἐκ τοῦ πνεύματος θερίσει ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/008.yaml
  text: For the one who sows to his own flesh will reap corruption from the flesh[c][b][a], but the one who sows to the Spirit will reap eternal life from the Spirit.
translation:
  language: zh_hans
  text: 因为顺着自己的肉体撒种的，必从肉体收割败坏[a][b]；顺着圣灵撒种的，必从圣灵收割永生。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肉体”也可理解为“自己属罪的本性”。这里并非单指身体，而是指保罗所说与圣灵相对的人性取向。
    reason: lexical_alternative
  - marker: b
    text: “败坏”也可译作“毁灭”或“朽坏”。原词可指腐朽、败亡或毁坏。
    reason: lexical_alternative
  - marker: c
    text: 希腊文作“灵”；这里按《加拉太书》中“肉体”与“灵”的对照译作“圣灵”，也有人译作“灵”。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 承接上文，为不可自欺及种收原则提供理由；“因为”自然保留解释性的连接作用。
- source_word: ὁ σπείρων
  choice: 撒种的
  rationale: 以名词化的“的”字结构表达带冠词的现在分词，保留普遍、格言式语气。
- source_word: εἰς τὴν σάρκα ἑαυτοῦ
  choice: 顺着自己的肉体撒种
  rationale: “顺着……撒种”在现代汉语中自然表达投向、迎合某一领域的含义；“自己的”保留反身代词的强调，“肉体”则保留保罗用语及其张力。
- source_word: ἐκ τῆς σαρκὸς
  choice: 从肉体
  rationale: “从”准确表达来源，并与后半句“从圣灵”形成平行。
- source_word: θερίσει
  choice: 必……收割
  rationale: “收割”与“撒种”保持农耕意象；“必”自然表达将来时在格言语境中的确定结果。
- source_word: φθοράν
  choice: 败坏
  rationale: “败坏”可涵盖腐朽、毁坏与终局性败亡，避免把词义限缩为单纯物质腐烂或消灭。
- source_word: ὁ δὲ σπείρων
  choice: 顺着……撒种的
  rationale: 重复前半句结构，保留原文均衡的对照；分号已清楚传达 δέ 的转折。
- source_word: εἰς τὸ πνεῦμα
  choice: 顺着圣灵撒种
  rationale: 加“圣”明确此处最可能指上帝的灵；加注说明希腊文形式及另一种理解，以保留可能的歧义。
- source_word: ἐκ τοῦ πνεύματος
  choice: 从圣灵
  rationale: 保留来源意义，并与“从肉体”严格平行。
- source_word: ζωὴν αἰώνιον
  choice: 永生
  rationale: 这是现代汉语圣经语境中准确、自然且广为理解的固定表达。
theological_decisions:
- issue: 保罗伦理对照中 σάρξ 的译法
  choice: 肉体
  alternative: 罪性；属肉体的本性
  rationale: “肉体”保留保罗的核心术语，也容纳身体性、受造有限性及背离圣灵的人性取向之间的语义张力；直接译作“罪性”会过早限定解释。
- issue: πνεῦμα 的所指
  choice: 圣灵
  alternative: 灵
  rationale: 《加拉太书》的肉体—灵对照通常指向上帝的灵，因此正文采用“圣灵”；但希腊文自身不以大小写区分，脚注保留“灵”的形式与解释空间。
- issue: φθορά 的终末含义
  choice: 败坏
  alternative: 毁灭；朽坏
  rationale: “败坏”不把结果限定为肉身腐朽，也不武断地解释为消灭，较能保留道德与终末性毁坏的复合含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“顺着……撒种／从……收割”呈现原文的方向与来源，并维持两句的对称。正文保留“肉体”“败坏”等神学张力较强的词，借脚注说明主要替代译法。
