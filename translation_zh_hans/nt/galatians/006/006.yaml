base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/006.yaml
  text: Let the one who is taught the word share in all good things with the one who teaches.
translation:
  language: zh_hans
  text: 接受这道教导的人，应当把一切美好的事物与教导他的人分享。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“应当在一切美好的事物上与教导他的人有分。”这里很可能包括物质上的供给。
    reason: 说明ἐν πᾶσιν ἀγαθοῖς与κοινωνέω的另一种较贴近原文结构的表达；同时指出其很可能包含实际、物质支持，但不将正文含义限缩为此。
lexical_decisions:
- source_word: Κοινωνείτω
  choice: 应当……分享
  rationale: 现在时主动命令语气要求持续实行；“分享”既能表达共同有分，也可包含实际或物质上的供给，避免把含义缩窄为金钱捐助。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ在此是轻微的承接或转折标记；中文直接进入劝勉更自然，也不会夸大其转折力度。
- source_word: ὁ κατηχούμενος τὸν λόγον
  choice: 领受这道教导的人
  rationale: 现在时被动分词表示正在接受教导的人；“这道”保留λόγος作为所传信息或教导的表达，同时避免使用带后期教会技术含义的称谓。
- source_word: τῷ κατηχοῦντι
  choice: 教导他的人
  rationale: 现在时主动分词指施教者；这一表达自然清楚，并与前面的“领受……教导的人”相呼应。
- source_word: ἐν πᾶσιν ἀγαθοῖς
  choice: 在一切美好的事物上
  rationale: 贴近希腊文介词结构，并保留“美好的事物”所涵盖范围的宽度；语境很可能包括物质和实际支持，但正文不将其限定于此。
theological_decisions:
- issue: 所命令之“分享”的性质
  choice: 保留宽泛表达，使其可涵盖物质与实际支持，也不排除其他美好事物上的共同有分
  alternative: 明确译为把一切财物供给教师，或仅理解为属灵相交
  rationale: κοινωνέω加与格对象及ἐν πᾶσιν ἀγαθοῖς，很可能涉及对教师的实际、物质支持，但原文措辞并未限定为金钱，也不宜缩窄为纯粹属灵相交。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“应当”自然传达命令语气；“这道”沿用基督教语境中可理解的λόγος表达，但整体句式避免术语化。
