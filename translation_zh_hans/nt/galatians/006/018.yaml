  text: Ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μετὰ τοῦ πνεύματος ὑμῶν, ἀδελφοί· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/018.yaml
  text: The grace of our Lord Jesus Christ be with your spirit[a], brothers[b]. Amen.
translation:
  language: zh_hans
  text: 愿我们主耶稣弥赛亚[a]的恩典与你们的灵同在，弟兄们[b]。阿们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”传统上也译作“基督”；希腊文Χριστός意为“受膏者”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“弟兄们”是对信徒群体的称呼，可以包括男女；也可译作“弟兄姊妹们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: 恩典
  rationale: 保留保罗书信祝福语的神学分量，也是现代中文基督教语境中自然、熟悉的表达。
- source_word: κυρίου
  choice: 主
  rationale: 准确表达κύριος在早期基督徒认信及祝福语中的尊称用法。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣弥赛亚
  rationale: Χριστός源于“受膏者”这一称号；译作“弥赛亚”可显明其称号含义，而非仅按传统音译处理。
- source_word: μετὰ τοῦ πνεύματος ὑμῶν
  choice: 与你们的灵同在
  rationale: 原文为省略动词的祝福公式；中文补出“同在”并以“愿”引出祈愿，同时保留复数“你们”与单数“灵”的原文结构。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留原文阳性复数呼格的称呼形式；其可包括整个信徒群体的语用范围在脚注中说明。
- source_word: ἀμήν
  choice: 阿们
  rationale: 采用中文通行的礼仪性音译，保留书信结尾的确认语气。
theological_decisions:
- issue: 保罗祝福语中Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处仍可辨识为称号，译出“弥赛亚”能保留“受膏者”的意义；传统而熟悉的“基督”列于脚注。
- issue: ἀδελφοί对信徒群体的指称范围
  choice: 弟兄们
  alternative: 弟兄姊妹们
  rationale: 正文保留希腊文阳性复数形式，不把解释直接并入译文；同时以脚注说明该称呼在此可涵盖男女信徒。
- issue: πνεύματος ὑμῶν的单复数张力
  choice: 你们的灵
  alternative: 你们
  rationale: 保留原文“你们”的复数领属与“灵”的单数形式，不将其简化为泛指代词，也不判定它专指个人内在生命还是群体共有的属灵生命。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，以“愿……同在”呈现书信结尾的祝福语气。保留“你们的灵”的原文结构与潜在含义张力；标点按现代中文习惯处理。
