  text: οὐδὲ γὰρ οἱ ⸀περιτεμνόμενοι αὐτοὶ νόμον φυλάσσουσιν, ἀλλὰ θέλουσιν ὑμᾶς περιτέμνεσθαι ἵνα ἐν τῇ ὑμετέρᾳ σαρκὶ καυχήσωνται.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/013.yaml
  text: For not even those who are circumcised themselves keep the law[a], but they want you to be circumcised so that they may boast in your flesh.
translation:
  language: zh_hans
  text: 因为连那些受割礼的人自己也不遵守律法；他们却想要你们受割礼，好在你们的肉体上夸口。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“受过割礼的人”或“那些受割礼的”。希腊文是作名词用的现在分词，可指“正在受割礼的人”或按群体称谓指“受割礼的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: 因为就连……也不
  rationale: “因为”保留γάρ承接上文的解释作用，“就连……也不”体现οὐδέ的强调否定。
- source_word: οἱ περιτεμνόμενοι
  choice: 那些受割礼的人
  rationale: 保留带冠词的现在分词之名词性用法，按受割礼这一状态或实践指称该群体，不扩译为“鼓吹割礼的人”。
- source_word: αὐτοὶ
  choice: 自己
  rationale: 突出主语本身，表达“连他们自己也不遵守”的反差。
- source_word: νόμον φυλάσσουσιν
  choice: 遵守律法
  rationale: 在保罗书信语境中自然表达对律法要求的持守和实行。
- source_word: ἀλλὰ θέλουσιν
  choice: 他们却想要
  rationale: “却”呈现ἀλλά的转折，“想要”直接保留意愿含义。
- source_word: ὑμᾶς περιτέμνεσθαι
  choice: 你们受割礼
  rationale: 简洁自然地体现被动意义，不添加原文没有的解释。
- source_word: ἵνα
  choice: 好
  rationale: 自然表达目的关系，相当于“为的是”。
- source_word: ἐν τῇ ὑμετέρᾳ σαρκὶ
  choice: 在你们的肉体上
  rationale: 保留σάρξ的字面身体含义，并以“上”自然指向割礼留下的身体记号。
- source_word: καυχήσωνται
  choice: 夸口
  rationale: “夸口”是保罗书信中καυχάομαι词族的稳妥对应，也保留此处负面的修辞意味。
theological_decisions:
- issue: 本节σάρξ的含义
  choice: 字面意义的“肉体”，指承受割礼的身体
  alternative: 比喻性的“罪性”或“属肉体的本性”
  rationale: 紧邻语境明确谈论割礼，因此这里是他人借加拉太信徒身体上的割礼记号夸口；译成“罪性”会引入本节无据的神学解释。
- issue: περιτεμνόμενοι分词的指称范围
  choice: 描述为“那些受割礼的人”
  alternative: 解释为“那些鼓吹割礼的人”或“那些叫自己受割礼的人”
  rationale: 原文以名词性分词按割礼来标识该群体；上下文虽显示他们提倡割礼，正文却不应把这层语境推论直接替换原词。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“遵守律法”“受割礼”“夸口”保持保罗书信的关键用语一致性；句中以“因为……却……”清楚呈现论证与转折。
