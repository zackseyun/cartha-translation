id: GAL.6.16
reference: Galatians 6:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ὅσοι τῷ κανόνι τούτῳ στοιχήσουσιν, εἰρήνη ἐπ’ αὐτοὺς καὶ ἔλεος, καὶ ἐπὶ τὸν Ἰσραὴλ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/016.yaml
  text: And as many as will walk by this rule—peace be upon them and mercy[c][b][a], and upon the Israel of God.
translation:
  language: zh_hans
  text: 凡照这准则而行的人[a]，愿平安和怜悯临到他们，也[c]临到神的以色列[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所有遵循这标准的人。”这里的动词含有照着某一准则行走、与之步调一致的意思。
    reason: lexical_alternative
  - marker: b
    text: “神的以色列”所指为何，历来有不同理解：可能指信主的犹太人、整个教会，或更广义的神的子民。正文保留希腊文的表达，不在翻译中判定。
    reason: alternative_reading
  - marker: c
    text: 这里的“也”既可能是添加另一群体，即“也临到神的以色列”；也可能是换一种说法重述前一群体，即“也就是神的以色列”。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσοι
  choice: 凡……的人
  rationale: 自然表达希腊文关系代词的概括和周延意味，涵盖所有符合条件的人，同时不显累赘。
- source_word: κανόνι
  choice: 准则
  rationale: κανών在此指规范行为的尺度或标准；“准则”既准确又符合现代汉语，比“规条”更少引入律法主义色彩。
- source_word: στοιχήσουσιν
  choice: 照……而行
  rationale: 保留στοιχέω按某一尺度列队前行、依循而行的隐喻意味，同时用现代汉语自然表达。
- source_word: εἰρήνη
  choice: 平安
  rationale: 这是εἰρήνη在祝福语境中的常用对应词，兼具安宁与完满福祉的含义。
- source_word: ἔλεος
  choice: 怜悯
  rationale: 准确表达ἔλεος所指向的慈怜与施恩，并与“平安”共同构成祝愿。
- source_word: ἐπ’ αὐτοὺς ... καὶ ἐπὶ
  choice: 临到他们，也临到
  rationale: 重复“临到”以反映希腊文两次使用ἐπί，并保持祝福降临于对象的语气。
- source_word: Ἰσραὴλ τοῦ θεοῦ
  choice: 神的以色列
  rationale: 直接保留属格结构及“以色列”这一称谓，不增添“民”“教会”等解释性词语，以免预先限定所指范围。
theological_decisions:
- issue: “神的以色列”所指为何
  choice: 正文直译为“神的以色列”，不具体说明其群体范围。
  alternative: 可理解为信主的犹太人、整个教会，或更广义的神的子民。
  rationale: 希腊文本身没有明确排除这些主要解释；保持原有称谓最能保存经文的神学张力。
- issue: 末一个καί的作用
  choice: 译为“也”，并以脚注说明它既可能添加另一群体，也可能换言重述同一群体。
  alternative: 若作解释性或同位性用法，可译为“也就是”；若作并列添加，可理解为“此外也”。
  rationale: 上下文不能无争议地决定καί是单纯并列还是解释性连接，正文不应替读者消除这一歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“凡……的人”适合概括性的劝勉；“愿……临到”保留祝福语气。正文刻意保留“神的以色列”及末一连接词的解释空间，不加入宗派性界定。
