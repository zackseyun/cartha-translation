  text: ἀλλήλων τὰ βάρη βαστάζετε, καὶ οὕτως ⸀ἀναπληρώσετε τὸν νόμον τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/002.yaml
  text: Carry one another’s burdens[a], and in this way you will fulfill the law of Messiah.
translation:
  language: zh_hans
  text: 你们要担当彼此的重担；这样，你们就会成全弥赛亚[a]的律法。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“基督”。
    reason: 保留Χριστός的传统中文译法；正文采用体现其称号含义的“弥赛亚”。
lexical_decisions:
- source_word: ἀλλήλων
  choice: 彼此
  rationale: 互相代词，表达群体成员之间相互承担的关系；“彼此”自然、简洁，并保留互惠含义。
- source_word: τὰ βάρη
  choice: 重担
  rationale: βάρος本指重量，此处比喻人所承受的艰难、压力或困境；“重担”既保留形象，也符合现代汉语伦理劝勉的语境。
- source_word: βαστάζετε
  choice: 要……担当
  rationale: 现在时命令语气复数，要求持续实行；“担当重担”是自然而庄重的搭配，并保留主动承受、帮助负担之意。
- source_word: οὕτως
  choice: 这样
  rationale: 指回前面的命令，说明成全律法的方式；“这样”清楚地保留方式与结果之间的联系。
- source_word: ἀναπληρώσετε
  choice: 就会成全
  rationale: 将来时直陈语气复数，在此表达遵行前述命令所产生的结果；“成全”与“律法”搭配自然，也保留达到完整要求的含义。
- source_word: τὸν νόμον
  choice: 律法
  rationale: νόμος通常指律法；保留这一用词，可呈现保罗论述中的伦理与盟约背景，不弱化为一般性的“原则”。
- source_word: τοῦ Χριστοῦ
  choice: 弥赛亚的
  rationale: Χριστός在此以属格修饰“律法”，具有称号性质；译作“弥赛亚”传达其受膏者称号的意义，同时以脚注保留传统译法“基督”。
theological_decisions:
- issue: Χριστοῦ的译法及属格关系
  choice: 弥赛亚的律法
  alternative: 基督的律法
  rationale: “弥赛亚”明确呈现Χριστός作为称号的意义；属格可表示这律法属于弥赛亚、由弥赛亚设立，或以弥赛亚为特征。正文不进一步限定属格类别，以保留原文的含义幅度。
translation_notes:
  register: 采用现代、简洁而庄重的劝勉语体。“彼此担当重担”保留原文的重量隐喻；“这样就会”自然表达命令与结果之间的联系。脚注标记紧接“弥赛亚”，避免原英文资料中脚注位置与内容不相符的问题。
