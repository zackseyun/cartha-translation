  text: Τοῦ λοιποῦ κόπους μοι μηδεὶς παρεχέτω, ἐγὼ γὰρ τὰ στίγματα ⸀τοῦ Ἰησοῦ ἐν τῷ σώματί μου βαστάζω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/017.yaml
  text: From now on let no one cause me trouble[a], for I bear the marks of Jesus on my body.
translation:
  language: zh_hans
  text: 从今以后，谁也不要再搅扰我，因为我身上带着耶稣的印记[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “印记”也可指“烙印”，即身体上用来表明归属或效忠关系的标记。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ λοιποῦ
  choice: 从今以后
  rationale: 这是表示时间的惯用语，意为“从现在起”或“此后”；“从今以后”自然、庄重，也符合书信结语的语气。
- source_word: κόπους μοι μηδεὶς παρεχέτω
  choice: 谁也不要再搅扰我
  rationale: κόπους παρέχειν 是“给人造成麻烦、困扰”的惯用表达。否定命令式译为“谁也不要”，加“再”与“从今以后”呼应，也自然传达停止搅扰的语气。
- source_word: τὰ στίγματα
  choice: 印记
  rationale: 该词指留在身体上的标记，也可特指表明归属或效忠关系的烙印。“印记”适合作为不作过度限定的正文译法，较“伤疤”更能保留原词的多重含义。
- source_word: τοῦ Ἰησοῦ
  choice: 耶稣的
  rationale: 保留希腊文属格的简洁和歧义，不在正文中限定为“属于耶稣”“为耶稣所受”或“与耶稣相同”。
- source_word: ἐν τῷ σώματί μου
  choice: 我身上
  rationale: “我身上”是现代汉语表达身体上可见标记的自然说法，比直译为“在我的身体里”更准确。
- source_word: βαστάζω
  choice: 带着
  rationale: βαστάζω 可指携带、承受；“身上带着……印记”符合汉语习惯，同时保留这些标记持续在保罗身体上的含义。
theological_decisions:
- issue: 保罗所说 στίγματα 的性质
  choice: 正文中性地译作“耶稣的印记”
  alternative: 明确译作因受迫害留下的伤疤；或表明归属耶稣的烙印；或使徒受苦及认同耶稣的比喻
  rationale: 原词很可能既令人想到保罗因受苦而留下的身体痕迹，也暗示他属于耶稣，但本节没有要求只取其中一种解释。中性译法保留这种神学和诠释张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“搅扰”比“给我劳苦”更准确地表达此处惯用语义；“印记”则避免把原文过早限定为单纯的伤疤或纯粹的象征。
