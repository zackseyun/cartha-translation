  text: τὸ δὲ καλὸν ποιοῦντες μὴ ⸀ἐγκακῶμεν, καιρῷ γὰρ ἰδίῳ θερίσομεν μὴ ἐκλυόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/009.yaml
  text: And let us not grow weary in doing good[a], for in due time we will reap[c][b], if we do not give up.
translation:
  language: zh_hans
  text: 行善时，我们不可灰心；到了适当的时候，我们必会收获，只要我们不放弃。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不放弃”也可译作“不疲乏”或“不丧志”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ καλὸν ποιοῦντες
  choice: 我们行善
  rationale: 中性冠词化形容词 τὸ καλόν 与 ποιέω 构成“行善、做美善之事”的表达；“行善”自然简洁，并保留伦理含义。
- source_word: μὴ ἐγκακῶμεν
  choice: 不可灰心
  rationale: ἐγκακέω 指因困难而失去勇气、厌倦退缩；“灰心”比单指身体疲倦的措辞更准确，也适合劝勉语境。
- source_word: καιρῷ ... ἰδίῳ
  choice: 到了适当的时候
  rationale: καιρός 表示合宜的时机或季节，ἴδιος 表示其特定、相称之时；此译不明确指定是谁所定，保留原文余地。
- source_word: θερίσομεν
  choice: 我们必有收成
  rationale: θερίζω 本义为收割；“有收成”在现代汉语中自然，并延续上下文播种与收割的农业意象。
- source_word: μὴ ἐκλυόμενοι
  choice: 只要不松懈
  rationale: 该分词可指疲乏、松弛、支撑不住；“只要”表达其语境中的条件意味，“不松懈”与前面的“不灰心”相关而不完全重复。
theological_decisions:
- issue: 两个坚持不懈用语（ἐγκακῶμεν／ἐκλυόμενοι）的关系
  choice: 分别译作“不可灰心”和“不松懈”
  alternative: “不要厌倦……若不疲乏”或“不要丧志……若不放弃”
  rationale: 原文使用两个意义相近而并不相同的动词；区别翻译既保留修辞层次，也不把末句过度解释成对救恩条件的系统性断言。
- issue: καιρῷ ἰδίῳ 所指时间的归属
  choice: 译作“适当的时候”
  alternative: “在它自己的时候”或“到了所定的时候”
  rationale: 原文未明说时间由谁设定；采用中性表达，保留“合宜／特定时节”的含义和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的劝勉语体。“行善—收成”保留农业隐喻；两个否定劝勉分别用“灰心”和“松懈”，避免重复并保留词义差别。
