id: GAL.6.15
reference: Galatians 6:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸂οὔτε γὰρ⸃ περιτομή τί ⸀ἐστιν οὔτε ἀκροβυστία, ἀλλὰ καινὴ κτίσις.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/015.yaml
  text: For neither circumcision counts for anything[a], nor uncircumcision[b], but a new creation.
translation:
  language: zh_hans
  text: 因为受割礼算不得什么，不受割礼也算不得什么；要紧的是新创造[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “新创造”也可译作“新造的人”，但在本节语境中可能性较小。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε γὰρ
  choice: 因为……不……也不……
  rationale: 以“因为”保留γάρ对上文的解释关系，并用现代汉语的“不……也不……”自然表达οὔτε…οὔτε的并列否定。
- source_word: περιτομή
  choice: 受割礼
  rationale: 既保留具体礼仪，也能承载保罗语境中由割礼所标示的身份含义；汉语用动宾结构比名词“割礼”单独作主语更自然。
- source_word: τί ἐστιν
  choice: 算不得什么
  rationale: 表达该短语在此处所指的无决定性分量或价值，同时保持原文简洁，不额外限定为某一种神学意义。
- source_word: οὔτε ἀκροβυστία
  choice: 不受割礼也算不得什么
  rationale: ἀκροβυστία在此与“受割礼”相对，指未受割礼的状态；重复谓语使省略结构在汉语中清楚自然。
- source_word: ἀλλὰ
  choice: 要紧的是
  rationale: 原文后半句为无动词的强烈对比；这样译出其隐含判断，使现代汉语完整，同时不把“新创造”的意义进一步具体化。
- source_word: καινὴ κτίσις
  choice: 新创造
  rationale: κτίσις既可指创造，也可指受造之物；“新创造”优先保留较宽广的含义及保罗式表达，避免直接收窄为“新造的人”。
theological_decisions:
- issue: 割礼、未受割礼与新创造之间的对比
  choice: 两种礼仪或身份状态都没有决定性的分量，真正要紧的是新创造。
  alternative: 只把两者理解为社会身份标记，或理解为两条同等有效的道路。
  rationale: 原文同时否定两种状态“算得什么”，再以ἀλλά转向“新创造”；译文保留这一强烈对比，却不自行补入“得救”“称义”或特定宗派术语。
- issue: καινὴ κτίσις所指的范围
  choice: 译作“新创造”，保留可指新的创造现实、状态或其个体体现的开放性。
  alternative: 译作“新造的人”，明确限定为个体受造者。
  rationale: κτίσις本身具有“创造”与“受造之物”的词义空间；本节的简略名词短语没有明说其范围，因此不宜在正文中消除这种含混。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“算不得什么”准确传达原文的简洁否定；分号凸显前后对比。“新创造”保留经文的神学张力和词义宽度，不使用生硬的直译句式，也不引入宗派性解释。
