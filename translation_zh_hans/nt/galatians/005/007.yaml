  text: Ἐτρέχετε καλῶς· τίς ὑμᾶς ἐνέκοψεν ⸀τῇ ἀληθείᾳ μὴ πείθεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/007.yaml
  text: You were running well[a]. Who hindered you from obeying the truth?
translation:
  language: zh_hans
  text: 你们跑得很好；谁拦阻了你们，使你们不顺从真理呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐτρέχετε
  choice: 你们向来跑
  rationale: 未完成时表达过去持续的行动；保留“跑”的竞技比喻，不把原文未明说的“赛程”添入正文。
- source_word: καλῶς
  choice: 很好
  rationale: 作副词修饰“跑”，现代汉语用“跑得很好”自然表达正确而良好的进展。
- source_word: τίς
  choice: 谁
  rationale: 原文为指人的疑问代词，询问造成拦阻者。
- source_word: ἐνέκοψεν
  choice: 拦阻了
  rationale: 该词表示阻断、妨碍，也可能让人联想到跑步时被截阻；“拦阻”既清楚又能与前面的竞技比喻呼应。
- source_word: τῇ ἀληθείᾳ
  choice: 真理
  rationale: 与πείθεσθαι相连，所指很可能是加拉太人已经领受的福音真理；汉语在此不必另译希腊语冠词。
- source_word: μὴ πείθεσθαι
  choice: 使你们不再顺从
  rationale: πείθομαι在此可表达对真理的顺服回应；结合已发生的拦阻和此前持续奔跑的语境，“不再”自然呈现停止原有回应的含义，但不排除“信服”的词义可能。
theological_decisions:
- issue: πείθεσθαι与ἀληθείᾳ连用时的含义
  choice: 顺从真理
  alternative: 被真理说服；信服真理
  rationale: 上下文既涉及对福音真理的接受，也涉及实际回应。“顺从”保留伦理和行动层面；脚注注明“信服”的可能，以保存原词在相信与顺服之间的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们向来跑得很好”保留保罗的竞技比喻；“拦阻”与该意象自然呼应。脚注明确保正文中的[a]标记完整对应。
