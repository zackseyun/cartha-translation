source:
  edition: SBLGNT
  text: φανερὰ δέ ἐστιν τὰ ἔργα τῆς σαρκός, ἅτινά ⸀ἐστιν πορνεία, ἀκαθαρσία, ἀσέλγεια,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/019.yaml
  text: 'The works of the flesh are evident: sexual immorality[a], impurity, sensuality,'
translation:
  language: zh_hans
  text: 肉体[a]的行为是显而易见的，就是淫乱、污秽、放荡，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肉体”在这里不是单指人的身体，也可理解为“罪性”，即堕落的人与圣灵相抗的欲望和取向。
    reason: 说明σάρξ的隐喻用法，并保留“罪性”这一解释性译法。
lexical_decisions:
- source_word: φανερὰ
  choice: 显而易见
  rationale: 表达清楚可见、显明的意思，符合现代汉语习惯，也保留原文强调这些行为明显可辨的语气。
- source_word: δέ
  choice: 不单独译出
  rationale: δέ在这里是轻微的承接或转折标记；本句在上下文中的转接关系用汉语不加连接词也很自然，若译作“但是”容易加重对比。
- source_word: τὰ ἔργα
  choice: 行为
  rationale: ἔργα在此指实际表现出来的所作所为。“行为”比直译“工作”自然，也适合随后列举的恶行；与下文“圣灵的果子”之间原有的行为—果子对照仍然清楚。
- source_word: τῆς σαρκός
  choice: 肉体
  rationale: 保留保罗具有神学张力的σάρξ隐喻，不把它直接收窄为某一种解释；此处不是单指身体，而是指与圣灵相抗的堕落欲望和取向，解释置于脚注。
- source_word: ἅτινά ἐστιν
  choice: 就是
  rationale: 自然引出后面的例举，并保留原文“这些是……”的说明功能；这份清单在后续经文继续展开。
- source_word: πορνεία
  choice: 淫乱
  rationale: 在现代中文圣经语境中可概括不合正当规范的性行为，简洁而不把词义局限为某一种具体行为。
- source_word: ἀκαθαρσία
  choice: 污秽
  rationale: 保留该词在此处的道德不洁含义，也与相邻的性伦理词汇自然衔接。
- source_word: ἀσέλγεια
  choice: 放荡
  rationale: 表达不知羞耻、毫无节制的纵欲行为，比“邪荡”更符合现代汉语，也比仅译“感官享乐”更能体现其越界和无节制的意味。
theological_decisions:
- issue: 保罗伦理语境中σάρξ的译法
  choice: 肉体
  alternative: 罪性
  rationale: “肉体”保留保罗在本段中“肉体”与“圣灵”相对的核心隐喻及其解释空间；“罪性”能说明这里并非单指身体，却容易把动态的欲望与取向实体化，并提前锁定解释，因此只列作脚注说明。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“显而易见”明确有力；“淫乱、污秽、放荡”保持并列、简洁的恶行清单形式。脚注标记紧随其实际解释的“肉体”，避免误附于“淫乱”。
