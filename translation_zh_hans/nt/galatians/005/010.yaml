  text: ἐγὼ πέποιθα εἰς ὑμᾶς ἐν κυρίῳ ὅτι οὐδὲν ἄλλο φρονήσετε· ὁ δὲ ταράσσων ὑμᾶς βαστάσει τὸ κρίμα, ὅστις ⸀ἐὰν ᾖ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/010.yaml
  text: I am confident in the Lord about you[a], that you will think nothing else; but the one who is troubling you will bear the judgment[b], whoever he may be.
translation:
  language: zh_hans
  text: 我在主里深信，你们不会持别的看法[a]；但那搅扰你们的人必承担审判，不论他是谁[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “持别的看法”也可译作“不作别的想法”或“不会有别的想法”。原文动词既可指一般的思想，也可指所持的心态或判断。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“无论他是谁”或“不管他是何人”。原文的不定关系结构强调此人的身份并不影响这句话所说的结果。
    reason: alternative_reading
lexical_decisions:
- source_word: πέποιθα εἰς ὑμᾶς
  choice: 对你们有信心
  rationale: πέποιθα是完成时形式，在这里表达已经形成并持续存在的确信；εἰς ὑμᾶς表明这信心所指向的对象。译为“对你们有信心”自然明晰，又不把它弱化为一般性的乐观。
- source_word: ἐν κυρίῳ
  choice: 在主里
  rationale: 保留保罗常用的关系与神学表达，说明这信心的领域或根据在于主，而非仅仅出于保罗个人的判断。
- source_word: οὐδὲν ἄλλο φρονήσετε
  choice: 你们不会有别的想法
  rationale: φρονέω可指思考、心态或所持看法；“有别的想法”在现代汉语中自然，并保留其语义幅度。
- source_word: ὁ δὲ ταράσσων ὑμᾶς
  choice: 但那搅扰你们的人
  rationale: 现在分词描写正在使加拉太信徒困惑、动荡的人；“搅扰”既保留持续动作，也符合本段语境。
- source_word: βαστάσει τὸ κρίμα
  choice: 必担当审判
  rationale: βαστάζω本义为承担、负荷；κρίμα可指审判、判决或其后果。“担当审判”保留承担的意象，也不提前限定审判的具体性质。
- source_word: ὅστις ἐὰν ᾖ
  choice: 不论他是谁
  rationale: 不定关系结构加ἐάν强调其身份无关紧要；“不论他是谁”准确表达这种让步兼不定的语气。
theological_decisions:
- issue: 保罗信心的性质
  choice: 保罗对加拉太信徒将持守正确看法抱有信心，而这信心明确是在主里。
  alternative: 把这句话理解为对所有人的结局作无条件保证，或仅视为保罗个人的乐观。
  rationale: 经文同时保留了保罗个人的确信、将来的期待以及“在主里”的根据；译文不将其中任何一面绝对化。
- issue: τὸ κρίμα所指的审判
  choice: 笼统保留为“审判”，不具体断定是永恒定罪、某种刑罚或教会惩戒。
  alternative: 明确译成“永刑”“定罪”或仅指群体纪律处分。
  rationale: κρίμα具有判决、审判及其后果等语义可能，而本节没有说明其具体形式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我在主里对你们有信心”保留原文关键短语及其关系；后接“相信”使汉语句法顺畅。“担当审判”略带书面色彩，以承载原文的承担意象和警告力度。
