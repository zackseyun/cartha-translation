  text: ὄφελον καὶ ἀποκόψονται οἱ ἀναστατοῦντες ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/012.yaml
  text: I wish those who are upsetting you would even mutilate themselves[a][b].
translation:
  language: zh_hans
  text: 但愿那些搅扰你们的人[b]索性把自己阉割了！[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “把自己阉割了”也可较字面译为“把自己割掉”或“把自己割除”。结合上下文的割礼之争，这句话很可能是尖锐地说，他们不如进一步自残或阉割；也有人理解为把自己从群体中割除。
    reason: lexical_alternative
  - marker: b
    text: “搅扰”也可译作“扰乱”或“使你们陷入混乱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄφελον
  choice: 但愿
  rationale: 表达强烈愿望，符合现代汉语书面语，也保留原文带有感叹色彩的愿望语气。
- source_word: καὶ
  choice: 索性……也
  rationale: 这里不是简单并列，而是加强语势，表示那些人既主张割礼，倒不如进一步把自己割掉；“索性……也”自然传达这种升级的讽刺。
- source_word: ἀποκόψονται
  choice: 把自己割掉
  rationale: 保留动词“切割、割除”的直观意象及中间语态的反身意味，并让上下文中的双关仍然可见；既可使人联想到超越割礼的自残或阉割，也没有在正文中完全排除“把自己割除”的字面可能。
- source_word: οἱ ἀναστατοῦντες
  choice: 那些扰乱……的人
  rationale: 该分词指在加拉太信徒中制造动荡、搅扰他们的人；“扰乱”兼具造成不安和破坏秩序的含义。
- source_word: ὑμᾶς
  choice: 你们
  rationale: 准确体现第二人称复数，指加拉太各信徒。
theological_decisions:
- issue: 保罗针对割礼鼓吹者所表达愿望的含义
  choice: 正文保留“把自己割掉”的切割意象，并借上下文暗示他们干脆从割礼进一步走向自残或阉割。
  alternative: 理解为保罗只希望他们把自己从信徒群体中隔绝，或泛指他们遭受毁灭。
  rationale: 本节紧接割礼之争，“割掉”最自然地构成尖锐的切割双关。不过原词也能产生“割除”的联想，因此不在正文中改成只有单一解释的术语，并在脚注中说明。
translation_notes:
  register: 采用现代、庄重而有力度的汉语。“但愿”保留愿望语气；“索性”体现保罗尖锐的讽刺和递进语势。正文避免使用过于临床化的“阉割”，以保留原词的双关与一定程度的歧义。
