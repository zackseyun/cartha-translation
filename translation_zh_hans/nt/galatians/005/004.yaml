source:
  edition: SBLGNT
  text: κατηργήθητε ⸀ἀπὸ Χριστοῦ οἵτινες ἐν νόμῳ δικαιοῦσθε, τῆς χάριτος ἐξεπέσατε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/004.yaml
  text: You who are seeking to be justified by law have been severed from the Messiah; you have fallen away from grace.
translation:
  language: zh_hans
  text: 你们这些想靠律法得称为义的人[b]，已经与基督[c]隔绝了[a]；你们已经从恩典中坠落了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“已经与基督疏远了”，或“已经从基督那里被割断了”。
    reason: κατηργήθητε在此可用不同的分离性措辞表达；各译法在力度和意象上略有差别。
  - marker: b
    text: 较直译：“你们这些在律法中被称为义的人。”希腊文是现在时被动语态；正文依保罗此处的论证，译出他们谋求以律法为称义根据的意思。
    reason: 保留δικαιοῦσθε的形式对应译法及其语境性处理。
  - marker: c
    text: “基督”意为“受膏者”，也可译作“弥赛亚”。
    reason: 说明Χριστός的称号含义及可行替代译法。
lexical_decisions:
- source_word: κατηργήθητε
  choice: 已经……隔绝了
  rationale: καταργέω与ἀπό连用，在这里表示与某者断开关系或失去关联。“隔绝”保留原文强烈的关系性措辞，又不像“彻底割断”那样额外断定其终局性。
- source_word: ἀπὸ Χριστοῦ
  choice: 与基督
  rationale: ἀπό表示分离；现代汉语以“与……隔绝”自然表达这一关系。Χριστός在中文圣经语域中通常译作“基督”，其称号含义另以脚注说明。
- source_word: οἵτινες
  choice: 你们这些……的人
  rationale: 既保留对加拉太受众的第二人称直接称呼，也表明保罗所指的是其中具有这一特征的人。
- source_word: ἐν νόμῳ
  choice: 靠律法
  rationale: ἐν在此可表达所凭借的范围或基础；“靠律法”自然传达以律法为称义依据的意思，同时不擅自限定为某一套系统神学解释。
- source_word: δικαιοῦσθε
  choice: 想……得称为义
  rationale: 该词为现在时被动语态，形式上可译为“被称为义”；结合论证语境，“想靠律法得称为义”表达受话者谋求以律法为称义根据，并避免让中文误解为保罗肯定他们确已借律法称义。形式上的另一译法保留在脚注中。
- source_word: τῆς χάριτος
  choice: 从恩典中
  rationale: ἐκπίπτω所带的属格表示从某种状态或关系中落出；“从恩典中”保留其分离方向。
- source_word: ἐξεπέσατε
  choice: 已经……坠落了
  rationale: 保留原文“落出、坠离”的鲜明隐喻和不定过去时所呈现的决定性警告；不把它弱化为单纯“忽视恩典”或解释成特定教义结论。
theological_decisions:
- issue: 本节是否直接裁定信徒失去救恩、或仅离开恩典原则的争论
  choice: 保留“与基督隔绝”“从恩典中坠落”的严厉关系性语言
  alternative: 弱化为“与基督疏远”或解释为“放弃恩典的道路”
  rationale: 原文措辞强烈，却没有在本句中展开其系统神学后果。译文因此既不削弱警告，也不替保罗补充关于救恩最终状态的宗派性结论。
- issue: δικαιοῦσθε是否应译为他们事实上正借律法称义
  choice: 正文译作“想靠律法得称为义”
  alternative: 直译为“在律法中被称为义”或“靠律法被称义”
  rationale: 被动形式应获承认，但上下文否定律法能够使人称义。正文用“想”显明所追求的根据，避免制造保罗认可借律法称义的表面矛盾；脚注保留较形式对应的译法。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“得称为义”沿用读者较熟悉的神学表达；“隔绝”和“坠落”保留原文的强烈警告与隐喻。脚注标记均置于对应正文成分之后。
