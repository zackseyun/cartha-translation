  text: μαρτύρομαι δὲ πάλιν παντὶ ἀνθρώπῳ περιτεμνομένῳ ὅτι ὀφειλέτης ἐστὶν ὅλον τὸν νόμον ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/003.yaml
  text: And I testify again to every man who receives circumcision that he is obligated to keep the whole law[a][b][c].
translation:
  language: zh_hans
  text: 我再次向每一个接受割礼的人[a]郑重声明：他有义务[b]遵行全部律法。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“正在受割礼的人”或“让自己受割礼的人”。希腊语分词容许这些相近译法；上下文更可能指在这场争议中选择接受割礼的人。
    reason: alternative_reading
  - marker: b
    text: 原文直译为“是欠债者”，意思是处在必须履行的义务之下。
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτύρομαι
  choice: 郑重声明
  rationale: 该词在这里表示带有郑重意味的亲自断言。“郑重声明”保留其严肃、正式的语气，又比“作证”更符合现代汉语在此处的表达习惯；“警告”虽符合语境效果，却加入了原词未明说的解释。
- source_word: δὲ πάλιν
  choice: 再次
  rationale: πάλιν明确表示重复或再次强调；δὲ是较弱的承接词。现代汉语用“再次”即可自然承接上文，不必生硬地另译一个连词。
- source_word: παντὶ ἀνθρώπῳ
  choice: 每一个……的人
  rationale: 该短语具有逐一涵盖的分配意义。汉语“每一个……的人”既保留单数式的逐人强调，也自然包含泛指意义，无须限定为男性。
- source_word: περιτεμνομένῳ
  choice: 接受割礼的人
  rationale: 现在时分词可指正在受割礼、让自己受割礼或选择接受割礼的人。结合加拉太书5:2的争议语境，“接受割礼”自然表达主动提交于这一做法，却不把动机写进正文。
- source_word: ὀφειλέτης
  choice: 有义务
  rationale: 该名词字面为“欠债者”，在这里表示处于必须履行某事的责任之下。“有义务”准确传达法律或宗教责任，避免现代读者误解为金钱债务。
- source_word: ὅλον τὸν νόμον
  choice: 全部律法
  rationale: ὅλον强调律法的整体性。“全部律法”简洁清楚，保留保罗所强调的不可只选择其中一部分。
- source_word: ποιῆσαι
  choice: 遵行
  rationale: ποιέω字面意为“做”，与“律法”连用时指实行、遵守律法。“遵行”是现代中文圣经语境中自然且准确的表达。
theological_decisions:
- issue: 保罗所说接受割礼者的范围
  choice: 正文指在加拉太争议中接受或提交于割礼的人，并说明这样的人负有遵行全部律法的义务。
  alternative: 也可宽泛理解为任何受过割礼的人，包括幼年受割礼的犹太男性。
  rationale: 上下文紧接5:2，针对正考虑以割礼作为宗教要求的人。译作“接受割礼”反映这一语境，同时没有把“为称义”之类原文此句未明说的动机加入正文。
- issue: “欠债者”比喻的处理
  choice: 正文译为“有义务”，直接表达其责任含义。
  alternative: 可按字面译为“欠债者”或“负债的人”。
  rationale: 这里的债务语言表达受约束、必须履行全部律法，并非经济欠债。脚注保留字面意象，避免掩盖原文措辞。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“郑重声明”传达使徒话语的严肃性；“接受割礼”“有义务”“遵行全部律法”自然清晰。正文不额外限定接受割礼的动机，并以脚注保留分词及债务比喻的词义空间。
