id: GAL.5.2
reference: Galatians 5:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἴδε ἐγὼ Παῦλος λέγω ὑμῖν ὅτι ἐὰν περιτέμνησθε Χριστὸς ὑμᾶς οὐδὲν ὠφελήσει.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/002.yaml
  text: 'Look: I[a], Paul, say to you that if you receive circumcision[b], Messiah will benefit you nothing.'
translation:
  language: zh_hans
  text: 请注意：我保罗告诉你们，你们若受割礼[a]，弥赛亚[b]就对你们毫无益处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“若让人给你们行割礼”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文为Christos，意为“受膏者”；传统常译作“基督”。此处译作“弥赛亚”，以体现其称号含义。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἴδε
  choice: 请注意
  rationale: 该词在此用来唤起听者注意，并加强随后警告的语气。“请注意”符合现代汉语表达，也保留其郑重、强调的功能。
- source_word: ἐγὼ Παῦλος
  choice: 我保罗
  rationale: 希腊文显式使用第一人称代词，并与名字并置，带有强调作用；“我保罗”保留了保罗亲自郑重声明的语气。
- source_word: λέγω ὑμῖν
  choice: 告诉你们
  rationale: 自然、直接地表达保罗向收信人作出郑重陈述；相比机械地译作“对你们说”，更符合现代汉语。
- source_word: ἐὰν περιτέμνησθε
  choice: 你们若受割礼
  rationale: περιτέμνησθε为现在时被动虚拟式，表示接受或经受割礼。“受割礼”简洁保留被动含义，不额外断定行为人的动机。
- source_word: Χριστὸς
  choice: 弥赛亚
  rationale: Χριστός本义为“受膏者”，此处仍具有称号功能；“弥赛亚”明确呈现这一称号含义。
- source_word: οὐδὲν ὠφελήσει
  choice: 就对你们毫无益处
  rationale: 忠实表达将来时所断言的完全无益，同时使用自然、庄重的现代汉语。
theological_decisions:
- issue: Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处该词指耶稣的弥赛亚身份，而非仅作为姓名的一部分；译作“弥赛亚”保留“受膏者”这一称号的意义。
- issue: 保罗对割礼警告的范围
  choice: 保持原文的条件句，不在正文中限定割礼的具体动机或用途
  alternative: 明说这是为了称义而接受割礼，或将其解释为对一切割礼的普遍谴责
  rationale: 上下文涉及将割礼视为律法义务的问题，但本节本身只说“若受割礼”。译文不把上下文解释增添进正文，也不把警告扩大为对医疗、民族或其他情境中割礼的全面定罪。
translation_notes:
  register: 采用现代、郑重而易懂的书面汉语。“请注意”传达开头的警示语气；“我保罗”保留原文自我指称的强调；整句结构紧凑，适合经文朗读。脚注标记已分别置于“受割礼”和“弥赛亚”之后，使其与脚注内容准确对应。
