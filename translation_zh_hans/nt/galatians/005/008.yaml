  yaml_path: translation/nt/galatians/005/008.yaml
  text: This persuasion is not from the one who calls you[a].
translation:
  language: zh_hans
  text: 这种劝说不是出于呼召你们的那一位。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这种影响不是出于呼召你们的那一位。”
    reason: πεισμονή是罕见名词，可指劝说本身，也可侧重劝说所产生的影响。
lexical_decisions:
- source_word: πεισμονὴ
  choice: 劝服
  rationale: 这是一个罕见的抽象名词，可指劝服、说服力或受劝服的状态与结果。上下文涉及加拉太人受煽动者言论影响；“劝服”既保留原文的抽象性，也不把含义过度解释为“想法”或“顺从”。
- source_word: ἐκ
  choice: 出于
  rationale: ἐκ在此表示来源或起源；“出于”自然地表达这种劝服并非源自后述的呼召者。
- source_word: τοῦ καλοῦντος ὑμᾶς
  choice: 那位呼召你们的
  rationale: 现在时分词καλοῦντος在此作名词用。“那位呼召你们的”保留了原文的表达和持续性语感，也没有直接补入原文未明说的“上帝”。
- source_word: οὐκ
  choice: 不是
  rationale: 直接保留否定，清楚表达保罗对这种劝服之来源的否认。
theological_decisions:
- issue: “那位呼召你们的”所指是谁
  choice: 正文保留为“那位呼召你们的”，不明确补作“上帝”
  alternative: 译作“呼召你们的上帝”
  rationale: 上下文极可能指上帝，但希腊文使用的是名词化分词，并未明说“上帝”。保留原有措辞，既让读者可从上下文判断所指，也避免在正文中消除原文保留的含蓄。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“这种劝服”承接前文语境，并保留罕见名词的抽象性质；脚注列出更偏重效果的译法。
