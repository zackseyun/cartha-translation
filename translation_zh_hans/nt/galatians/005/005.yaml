base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/005.yaml
  text: For through the Spirit[a], by faith[d][c][b], we eagerly await the hope of righteousness.
translation:
  language: zh_hans
  text: 因为我们靠着圣灵[a]，出于信心[b]，热切等候义的盼望[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在圣灵里”。原文的与格既可表示借着圣灵，也可表示处于圣灵的领域中。
    reason: lexical_alternative
  - marker: b
    text: “出于信心”也可译作“凭着信心”；原文直译为“从信心而出”。“信心”所译的原文词在某些语境中也可有“信实”或“信靠”的含义。
    reason: lexical_alternative
  - marker: c
    text: “义的盼望”也可理解为“所盼望的义”、由义产生的盼望，或与义有关的盼望。这里的“义”也可译作“公义”或“正义”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἡμεῖς
  choice: 我们
  rationale: 明示第一人称复数主语，并保留原文在论证中的对比意味；汉语无需另加“我们自己”。
- source_word: γὰρ
  choice: 因为
  rationale: 引出对上文的解释或依据；现代汉语中“因为”比句首“原来”更直接自然。
- source_word: πνεύματι
  choice: 靠着圣灵
  rationale: 与本章“肉体—圣灵”的对照相符，最可能指圣灵；与格既可表示凭借，也可表示所处领域，正文采用较自然的工具性表达。
- source_word: ἐκ πίστεως
  choice: 出于信心
  rationale: 保留ἐκ所表达的来源或依据，比单纯译作“凭信心”更贴近原文，同时不排除“信实／信靠”的词义范围。
- source_word: ἐλπίδα
  choice: 盼望
  rationale: 作为ἀπεκδεχόμεθα的宾语，指所期待的盼望；保留名词表达，不直接改写为“所盼望的事”。
- source_word: δικαιοσύνης
  choice: 义
  rationale: 在保罗书信语境中，δικαιοσύνη通常译为“义”；“公义／正义”仍是可能的语义色彩。
- source_word: ἀπεκδεχόμεθα
  choice: 热切等候
  rationale: 该动词含有持续而迫切期待的意味，“热切等候”兼顾期待性与未来指向。
theological_decisions:
- issue: πνεύματι的所指与句法功能
  choice: 圣灵；正文译作“靠着圣灵”
  alternative: 人的灵；或“在圣灵里”
  rationale: 加拉太书第五章的上下文强烈指向圣灵；但与格可作工具或领域理解，因此在脚注保留“在圣灵里”。
- issue: ἐλπίδα δικαιοσύνης的属格关系
  choice: 保留为“义的盼望”
  alternative: “所盼望的义”；“由义产生的盼望”；“与义有关的盼望”
  rationale: 原文可指将来所盼望的义，也可泛指与义相关或由义而来的盼望。正文保留紧凑而开放的属格结构，不把末世性与称义含义单一化。
- issue: πίστις的语义
  choice: 信心
  alternative: 信实；信靠
  rationale: 在此处“信心”最符合保罗关于律法与信的论证，但πίστις本身可涵盖信靠或信实，因此不把其语义范围绝对限定。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“靠着圣灵”“出于信心”保持保罗论证中的两个前置成分；“义的盼望”虽略显凝练，却有意保留原文属格关系的神学张力，具体可能含义由脚注说明。
