id: GAL.5.22
reference: Galatians 5:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ὁ δὲ καρπὸς τοῦ πνεύματός ἐστιν ἀγάπη, χαρά, εἰρήνη, μακροθυμία, χρηστότης, ἀγαθωσύνη, πίστις,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/022.yaml
  text: But the fruit of the Spirit is love[a], joy, peace, patience, kindness, goodness, faithfulness,
translation:
  language: zh_hans
  text: 但圣灵所结的果子，就是爱、喜乐、和平、忍耐、恩慈、良善、信心[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“信实”。希腊文πίστις可指信心、信靠或忠信；在这份品格清单中，“信实”也很可能。
    reason: 保留πίστις在本处可表示“信心”或“信实”的真实歧义。
lexical_decisions:
- source_word: δὲ
  choice: 但
  rationale: 承接并对比前文“肉体的行为”（5:19—21）；“但”以简洁自然的现代汉语保留转折作用。
- source_word: καρπὸς
  choice: 所结的果子
  rationale: 保留保罗的“果子”隐喻及原文单数形式；加入“所结的”使“圣灵的果子”在现代汉语中更自然，也清楚表达其来源。
- source_word: τοῦ πνεύματός
  choice: 圣灵
  rationale: 上下文将其与“肉体”相对，并谈到信徒顺着灵而行，因此这里最可能指上帝的圣灵；汉语以“圣灵”明确这一所指。
- source_word: ἀγάπη
  choice: 爱
  rationale: 现代汉语中最自然、涵盖面最广的对应词。
- source_word: χαρά
  choice: 喜乐
  rationale: 准确表达因灵而有的欢喜；“喜乐”庄重、通顺，也符合经文语域。
- source_word: εἰρήνη
  choice: 和平
  rationale: 保留该词可涉及人与人和睦及内在安宁的宽广含义，不在正文中缩窄其范围。
- source_word: μακροθυμία
  choice: 忍耐
  rationale: 表达长久承受、迟于发怒的品格，是普通现代读者容易理解的说法。
- source_word: χρηστότης
  choice: 恩慈
  rationale: 表达待人仁厚、亲切而有益的品格，并与下一项“良善”有所区分。
- source_word: ἀγαθωσύνη
  choice: 良善
  rationale: 概括道德上的善与积极行善的品质，适合德目清单。
- source_word: πίστις
  choice: 信心
  rationale: 该词可指信、信靠或信实；正文采用其常见核心义“信心”，同时以脚注保留本处德目语境中很可能的“信实”。
theological_decisions:
- issue: πνεῦμα的所指
  choice: 圣灵
  alternative: 人的灵
  rationale: 加拉太书5章的上下文把“灵”与“肉体”相对，并将这些品质描述为灵所产生的果子；这更支持所指为圣灵，但这一判断来自上下文而非该名词本身的字面形式。
- issue: 德目清单中πίστις的含义
  choice: 信心
  alternative: 信实
  rationale: πίστις本身可表达信、信靠或忠信。在这一系列品格中，“信实”非常合宜，但“信心”仍是该词常见且有依据的译法；正文保留“信心”，脚注呈现另一可能，避免消除原文的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留“果子”的单数整体意象，并以顿号呈现德目清单。句末用逗号，因为原句的清单在下一节继续。
source_grounding:
  english_pob_role: consult_only
