  text: ⸀φθόνοι, μέθαι, κῶμοι, καὶ τὰ ὅμοια τούτοις, ἃ προλέγω ὑμῖν ⸀καθὼς προεῖπον ὅτι οἱ τὰ τοιαῦτα πράσσοντες βασιλείαν θεοῦ οὐ κληρονομήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/021.yaml
  text: envy[a], drunkenness, carousing, and things like these, about which I warn you, just as I warned before, that those who practice such things will not inherit the kingdom of God.
translation:
  language: zh_hans
  text: 嫉妒、醉酒、狂欢作乐[a]，以及诸如此类的事。关于这些事，我预先警告你们，正如我从前警告过你们：惯常行这些事的人必不能承受上帝的国。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“荒宴”“放荡宴乐”。希腊词指喧闹、放纵的庆宴，常与饮酒有关，但不必专指性行为。
    reason: lexical_alternative
lexical_decisions:
- source_word: φθόνοι
  choice: 嫉妒
  rationale: 复数名词指因他人所得之好处而生的怨羡；汉语以类别性名词“嫉妒”自然表达，并与上文相关但不同的恶行保持区分。
- source_word: μέθαι
  choice: 醉酒
  rationale: 指醉酒或纵酒的情形；“醉酒”简明、常用，准确传达酒精致醉的含义。
- source_word: κῶμοι
  choice: 狂欢宴乐
  rationale: 指喧闹、放纵的节庆宴饮，往往与饮酒相连，但不必含有现代汉语“淫乱派对”之类的特定性含义；“狂欢宴乐”兼顾其群体宴饮和失度放纵的色彩。
- source_word: τὰ ὅμοια τούτοις
  choice: 诸如此类的事
  rationale: 保留概括性和开放性，表明所列恶行并非穷尽。
- source_word: ἃ προλέγω ὑμῖν
  choice: 我现在警告你们
  rationale: προλέγω本可指预先说或预先警告；在道德劝诫语境中译作“警告”较能体现语用力量，“现在”使其与随后“从前”形成自然对照。
- source_word: καθὼς προεῖπον
  choice: 正如我从前警告过你们
  rationale: 指此前已经发出的同类警告；重复“警告”保留原文同一动词的修辞呼应。
- source_word: οἱ τὰ τοιαῦτα πράσσοντες
  choice: 惯常行这些事的人
  rationale: 现在时分词在此最自然地表示具有特征性或持续性的行为。“惯常行”比单纯“行”更清楚地传达这种意味，同时不把它绝对化为毫无例外的持续状态。
- source_word: βασιλείαν θεοῦ
  choice: 上帝的国
  rationale: 采用现代汉语中庄重且通行的新约神学表达，保留“国度/统治领域”的核心意象。
- source_word: οὐ κληρονομήσουσιν
  choice: 必不能承受
  rationale: 保留未来时的确定警告和继承产业的意象；“承受……的国”是自然、庄重的圣经汉语表达。
theological_decisions:
- issue: 保罗的警告是针对孤立的一次行为，还是具有特征性的生活实践
  choice: 译作“惯常行这些事的人”
  alternative: “行这些事的人”或“不断行这些事的人”
  rationale: 现在时分词与πράσσω在恶行清单中最自然地指惯常、具有特征性的实践。“惯常”保留道德警告的严肃性，但不擅自断言每一次孤立的跌倒都完全等同于这里所说的生活模式。
- issue: “不能承受上帝的国”的末世性与继承意象
  choice: 保留“必不能承受上帝的国”
  alternative: “必不能进入上帝的国”或“在上帝的国里必没有份”
  rationale: 原文使用明确的继承动词，应保留产业继承的意象，而不将其简化为进入或有份，以免提前化解其神学张力。
translation_notes:
  register: 采用现代、庄重、易懂的标准普通话。“狂欢宴乐”避免过分口语化，也不将κῶμοι误限为性方面的“狂欢”。用冒号整理原文较长的句法关系，使反复警告与其内容在中文中清楚连贯。
