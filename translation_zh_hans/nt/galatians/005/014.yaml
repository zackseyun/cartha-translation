source:
  edition: SBLGNT
  text: ὁ γὰρ πᾶς νόμος ἐν ἑνὶ λόγῳ ⸀πεπλήρωται, ἐν τῷ· Ἀγαπήσεις τὸν πλησίον σου ὡς ⸀σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/014.yaml
  text: 'For the whole law is fulfilled in one statement: “You shall love your neighbor as yourself.”[a][b]'
translation:
  language: zh_hans
  text: 因为整部律法都在这一句话中得以成全：“要爱你的邻舍，如同爱自己。”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一句话”也可译作“一个话语”或“一项宣告”。希腊文直译为“在一个话语中”；这里指一条完整的话或命令，不是指单独的一个字。
    reason: lexical_alternative
  - marker: b
    text: “得以成全”也可译作“已经成全”；按解释也有人译作“概括”。希腊文动词更直接表示“成全”，也可指律法的旨意在这条命令中达到完满。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ γὰρ
  choice: 因为
  rationale: γάρ承接上文，为前面的劝勉提供理由；“因为”在现代汉语中自然、明确。
- source_word: πᾶς νόμος
  choice: 全部律法
  rationale: 定冠词加单数νόμος指作为整体的律法，πᾶς强调其完整范围；“全部律法”保留这一整体性。
- source_word: ἐν ἑνὶ λόγῳ
  choice: 在一句话中
  rationale: λόγος在此指一句话、话语或命令，而非单个字词；随后引出的经文命令适合译作“一句话”。
- source_word: πεπλήρωται
  choice: 得以成全
  rationale: 完成时被动语态表达已经成全而形成的现状；“得以成全”保留被动意味及律法在这条命令中达到完满的较强语义，不简化为“概括”。
- source_word: Ἀγαπήσεις
  choice: 要爱
  rationale: 引自利未记19:18的将来时形式具有命令功能；现代汉语用“要爱”既自然又保留诫命语气。
- source_word: τὸν πλησίον σου
  choice: 邻
  rationale: “爱邻如己”是简洁、庄重且广为理解的表达；“邻”在此指邻舍，即与人相处中的他人，并不限于住处相邻者。
- source_word: ὡς σεαυτόν
  choice: 如己
  rationale: 准确表达“像爱自己一样”的比较关系，并与“爱邻如己”的自然汉语成句相合。
theological_decisions:
- issue: 律法与爱邻命令的关系
  choice: 译为“全部律法都在一句话中得以成全”
  alternative: “全部律法都概括在一句话里”或“全部律法都由这一句话总结”
  rationale: πληρόω更直接表示“成全、使之完满”，不只是概括。译文保留保罗较强的措辞，同时不进一步断言律法被废除，也不把“律法”擅自限定为其中某一部分。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“爱邻如己”保留了汉语圣经传统中简洁有力的诫命表达；正文中的两个脚注标记均已对应列出。
