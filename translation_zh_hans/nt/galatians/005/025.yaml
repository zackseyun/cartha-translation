  text: εἰ ζῶμεν πνεύματι, πνεύματι καὶ στοιχῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/025.yaml
  text: If we live by the Spirit[a], let us also walk by the Spirit.
translation:
  language: zh_hans
  text: 我们若靠圣灵活着，也当顺着圣灵而行。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们若在圣灵里活着，也当与圣灵步调一致而行。”
    reason: 保留 πνεύματι 可作领域性理解，以及 στοιχῶμεν 所含“步调一致、列队而行”的词义。
lexical_decisions:
- source_word: εἰ
  choice: 若
  rationale: 保留希腊文的条件形式及劝勉逻辑；上下文虽可理解为“既然”，但译作“若”避免替原文预先确定语气。
- source_word: ζῶμεν
  choice: 活着
  rationale: 自然对应现在时动词 ζάω；结合上下文，指生命源于圣灵，而非仅指生理存活。
- source_word: πνεύματι
  choice: 靠圣灵
  rationale: 与格在此可表达凭借、来源或领域。“靠”较自然地体现生命由圣灵而来的意思；加脚注保留“在圣灵里”的可能理解。
- source_word: καὶ
  choice: 也
  rationale: 体现前后对应的递进关系：既有靠圣灵而活的现实，也应有与之相称的行为。
- source_word: στοιχῶμεν
  choice: 跟随圣灵的步伐而行
  rationale: 该词含按次序前进、与之步调一致之意；此译既保留行走的伦理隐喻，也比单译“行事”更充分传达其具体词义。
theological_decisions:
- issue: πνεύματι 的所指
  choice: 圣灵
  alternative: 人的灵
  rationale: 加拉太书5章的上下文持续将肉体与圣灵相对，因而这里最自然地指上帝的圣灵；中文用“圣灵”明确这一上下文判断。
- issue: 条件句 εἰ 的语气
  choice: 若
  alternative: 既然
  rationale: “既然”可能更贴近保罗预设信徒已有圣灵生命的语用效果，但原文仍采用条件结构，正文保留“若”以免消解这种劝勉张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“跟随圣灵的步伐而行”表达原文 στοιχέω 的步调与行进意象，同时避免生硬直译；脚注完整保留另一种合理的句法和词义表达。
