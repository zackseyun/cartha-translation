  text: gentleness[a], self-control[b]; against such things there is no law.
translation:
  language: zh_hans
  text: 温柔、自制；没有律法反对这样的事。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有律法反对这样的人。”不过，这里更可能是指前面所列的品格，而不是表现出这些品格的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: πραΰτης
  choice: 温柔
  rationale: 在这份品格清单中，指温和、谦和而不粗暴的性情。“温柔”是现代汉语中自然且庄重的表达，也保留了其道德内涵。
- source_word: ἐγκράτεια
  choice: 自制
  rationale: 指约束并驾驭自己的欲望和冲动。“自制”简明自然，比“节制”更清楚地体现对自我的管束，也不像“克己”那样容易带入额外的禁欲意味。
- source_word: κατὰ τῶν τοιούτων
  choice: 反对这样的事
  rationale: τοιούτων在语法上既可能指事物，也可能指人；结合上文所列圣灵的果子，这里更可能回指这些品格，因此译作“这样的事”，并以脚注保留指人的可能。
- source_word: νόμος
  choice: 律法
  rationale: νόμος没有冠词，语句可表达一般原则；“律法”既符合《加拉太书》的语境，也不在正文中强行限定为专指摩西律法。汉语不以冠词区分特指与泛指，因此保留其范围上的张力。
theological_decisions:
- issue: νόμος所指的范围
  choice: 译作“律法”，不添加“摩西的”或“任何”等限定语。
  alternative: 明确译作“摩西律法”，或译作“任何法律”。
  rationale: 本书语境确实涉及摩西律法，但原文无冠词，格言式表达也可具有较广的范围。保持简洁的“律法”，可同时保留具体语境与普遍陈述之间的张力。
- issue: τοιούτων指品格还是具备这些品格的人
  choice: 正文理解为“这样的事”，指前文所列的品格。
  alternative: 理解为“这样的人”。
  rationale: 紧接前文品格清单，回指这些品格最为顺畅；但该复数形式本身也容许指人，因此在脚注中保留另一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“温柔，自制”延续品格清单的简洁节奏；后半句用“没有律法反对……”自然表达κατά的敌对或禁止意味。脚注标记均置于其所说明的整句之后，避免打断正文朗读。
