base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/026.yaml
  text: Let us not become conceited[a], provoking one another, envying one another.
translation:
  language: zh_hans
  text: 我们不要变得贪图虚荣[a]，彼此挑衅，彼此嫉妒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“自负”。原文所用的词指追逐空洞的荣耀，或看重自己而其实没有根据。
    reason: 提供自然的词义替代，并说明κενόδοξοι所含“空洞荣耀”和无根据自大的意味。
lexical_decisions:
- source_word: μὴ γινώμεθα
  choice: 不要让我们变得
  rationale: μή与第一人称复数、现在时中态虚拟式构成劝戒性的禁止表达；“不要让我们变得”既保留共同劝勉的语气，也体现γίνομαι所含的“变成”意味。
- source_word: κενόδοξοι
  choice: 贪图虚荣
  rationale: κενόδοξος指追逐空洞的荣耀、怀有无根据的自大。“贪图虚荣”在现代汉语中自然，并保留该词所强调的空虚荣耀及其驱动力；“自负”虽简洁，却较少显出“空洞荣耀”的词义背景。
- source_word: ἀλλήλους / ἀλλήλοις
  choice: 彼此
  rationale: “彼此”是现代汉语中自然、庄重的相互代词，并在两个分句中保留原文重复形成的平行结构。
- source_word: προκαλούμενοι
  choice: 挑衅
  rationale: 该分词可指向别人发起挑战或招惹别人；“挑衅”保留人际争竞和激惹的广义色彩，不将意思缩窄为单纯使人恼怒。
- source_word: φθονοῦντες
  choice: 嫉妒
  rationale: φθονέω表示因别人所有或所得而心生嫉妒。“嫉妒”准确、通俗，并与前面的“挑衅”形成简洁平行。
theological_decisions:
- issue: 两个分词与主要劝戒之间的关系
  choice: 将“彼此挑衅，彼此嫉妒”作为伴随性描述，说明贪图虚荣所表现出的行为，同时不添加明确的因果连接词。
  alternative: 也可理解为近似命令式的扩展，或理解为借着彼此挑衅、嫉妒而变得贪图虚荣。
  rationale: 希腊文以κενόδοξοι作γινώμεθα的主要表语，两个现在分词随后描述相关行为。直译式并列最能保留其句法关系及逻辑关系上的一定开放性，避免擅自加入“因此”“借着”等解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不要让我们……”保留共同劝勉语气；重复“彼此”以重现原文的修辞平行。
