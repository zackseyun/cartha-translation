  text: Λέγω δέ, πνεύματι περιπατεῖτε καὶ ἐπιθυμίαν σαρκὸς οὐ μὴ τελέσητε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/016.yaml
  text: But I say[a], walk by the Spirit, and you will certainly not carry out the desire of the flesh.
translation:
  language: zh_hans
  text: 但我要说：你们要顺着圣灵而行，就绝不会去实现肉体的欲望。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肉体”在这里不只是指人的身体，而是指人背离上帝、与圣灵相对的倾向；也可译作“有罪的本性”。
    reason: 说明σάρξ在此处的比喻性、伦理性含义，并保留一种解释性译法。
lexical_decisions:
- source_word: Λέγω δέ
  choice: 但我要说
  rationale: δέ在这里表示温和的转折或话题推进；“但我要说”保留保罗劝勉中的修辞转折，又不过分强化对立。
- source_word: πνεύματι
  choice: 顺着圣灵
  rationale: 与περιπατεῖτε连用的与格可表达凭借或所处范畴；上下文指向圣灵。“顺着圣灵而行”在现代汉语中自然地表达受圣灵引导而生活，同时不把语法关系限定得过窄。
- source_word: περιπατεῖτε
  choice: 而行
  rationale: 保留保罗以“行走”指生活方式的常用隐喻；与“顺着圣灵”搭配，中文庄重且易懂。
- source_word: ἐπιθυμίαν
  choice: 欲望
  rationale: ἐπιθυμία本身可指正面或负面的愿望，此处因受“肉体”限定而具有负面意义；“欲望”比“情欲”范围更宽，也较少加入额外解释。
- source_word: σαρκὸς
  choice: 肉体
  rationale: 保留保罗的核心术语及其与圣灵之间的张力，不在正文中直接解释为“罪性”；脚注说明这里并非单指人的身体。
- source_word: οὐ μὴ τελέσητε
  choice: 就绝不会去实现
  rationale: οὐ μή加虚拟式构成强烈否定；“绝不会”传达其强调语气。τελέω在此指把欲望付诸实行，“去实现”较“成全”更符合现代汉语。
theological_decisions:
- issue: πνεύματι所指为何
  choice: 圣灵
  alternative: 人的灵；一般性的属灵原则
  rationale: 加拉太书第五章紧接着将“圣灵”与“肉体”相对，语境最自然地指上帝的圣灵；采用“圣灵”明确这一语境判断，但不增添经文以外的教义说明。
- issue: σάρξ的译法
  choice: 肉体
  alternative: 罪性；有罪的本性
  rationale: 这里确有与圣灵敌对的伦理和人性论含义，但直译“肉体”能保留保罗用语的广度和神学张力，避免把它完全等同于某一种系统化解释；具体含义在脚注交代。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“顺着圣灵而行”保留原文的行走隐喻；“绝不会”传达希腊文强烈否定。脚注标记置于它所说明的整句之后。
