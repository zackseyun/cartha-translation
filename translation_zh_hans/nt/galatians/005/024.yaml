base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/024.yaml
  text: Those who belong to Messiah have crucified the flesh along with its passions and desires[a][b].
translation:
  language: zh_hans
  text: 但属弥赛亚的人，已经把肉体及其邪情私欲钉在十字架上了[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但属基督的人。”
    reason: alternative_reading
  - marker: b
    text: 这里的“肉体”不是单指人的身体，而是指与圣灵相对、受罪败坏的人性；有些译本译作“罪性”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ τοῦ Χριστοῦ
  choice: 但属弥赛亚的人
  rationale: 属格结构表示这些人属于弥赛亚；“属……的人”自然简洁。δὲ 承接上文并带轻微对比，译作“但”。Χριστός 在此保留其称号意义，译作“弥赛亚”。
- source_word: τὴν σάρκα
  choice: 肉体
  rationale: 这里指与圣灵相对的人性倾向；保留保罗“肉体”的神学用语，不在正文中直接解释为“罪性”。
- source_word: ἐσταύρωσαν
  choice: 已经……钉在十字架上了
  rationale: 明确保留“钉十字架”的意象；“已经……了”表达不定过去时所述的决定性行动及其当前关联。
- source_word: σὺν τοῖς παθήμασιν καὶ ταῖς ἐπιθυμίαις
  choice: 连同肉体的邪情私欲
  rationale: σύν 表示一并、伴随。παθήματα 与 ἐπιθυμίαι 在此均处于伦理性的负面语境；汉语固定表达“邪情私欲”自然概括二者，而补出“肉体的”使其所属关系清楚。
theological_decisions:
- issue: Χριστοῦ 的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处可理解为耶稣的职分称号，因此正文用“弥赛亚”；但该词也可能具有近似专名的用法，脚注保留“基督”。
- issue: 保罗伦理语境中 σάρξ 的译法
  choice: 肉体
  alternative: 罪性
  rationale: 正文保留原文意象和保罗术语所具有的张力，避免把解释直接写进经文；脚注说明这里并非单指身体。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“邪情私欲”虽略带传统经文色彩，但在现代汉语中仍清楚自然，并能紧凑对应两个并列名词。
