id: GAL.5.17
reference: Galatians 5:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἡ γὰρ σὰρξ ἐπιθυμεῖ κατὰ τοῦ πνεύματος, τὸ δὲ πνεῦμα κατὰ τῆς σαρκός, ταῦτα ⸀γὰρ ⸂ἀλλήλοις ἀντίκειται⸃, ἵνα μὴ ἃ ⸀ἐὰν θέλητε ταῦτα ποιῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/017.yaml
  text: For the flesh desires what is against the Spirit[a], and the Spirit what is against the flesh; for these oppose each other[b], so that you do not do the things you want.
translation:
  language: zh_hans
  text: 因为肉体[a]所欲求的，是与圣灵[b]相敌的；圣灵所欲求的，是与肉体相敌的。这两者彼此对抗，使你们不能做自己想做的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肉体”在这里不只是指人的身体，也可理解为“罪性”或堕落人性的欲求倾向。希腊文是σάρξ（sarx）。
    reason: lexical_alternative
  - marker: b
    text: “圣灵”也可译作“灵”；若如此理解，可能指人的灵。希腊文本不以大小写作此区分。
    reason: alternative_reading
lexical_decisions:
- source_word: σὰρξ
  choice: 肉体
  rationale: 保留保罗的核心隐喻和神学用语，不将其缩减为单指身体，也不在正文中直接释作“罪性”。此处按伦理语境指向堕落人性的欲求倾向。
- source_word: ἐπιθυμεῖ
  choice: 所欲求的
  rationale: 表达强烈的意愿或欲望，同时避免“贪欲”可能带来的过窄或纯负面含义；与后面的“相敌”结合，清楚体现其敌对方向。
- source_word: κατὰ τοῦ πνεύματος / κατὰ τῆς σαρκός
  choice: 与圣灵相敌的／与肉体相敌的
  rationale: κατά加属格在这里具有敌对含义；“相敌”既自然庄重，又比单纯“反对”更能呈现持续冲突。
- source_word: πνεῦμα
  choice: 圣灵
  rationale: 加拉太书第五章上下文反复谈到信徒靠圣灵行事，最可能指上帝的圣灵；同时用脚注保留“人的灵”这一语法上可能的理解。
- source_word: ἀλλήλοις ἀντίκειται
  choice: 彼此对抗
  rationale: 准确呈现双方互相敌对、相互冲突的关系，不额外扩大为特定心理学解释。
- source_word: ἵνα μὴ
  choice: 使……不能
  rationale: 在中文中自然表达该结构所呈现的结果或作用，同时不强行断定其只能是主观目的。
- source_word: ἃ ἐὰν θέλητε ταῦτα ποιῆτε
  choice: 做自己想做的事
  rationale: 自然传达不定关系结构“无论你们想做什么”；不加入“总是”或“随意”等原文没有的限定。
theological_decisions:
- issue: 保罗伦理语境中σάρξ的含义
  choice: 正文保留“肉体”
  alternative: 罪性／有罪的本性
  rationale: “肉体”保存保罗有意使用的隐喻及其多层含义；“罪性”虽能说明本节的伦理指向，却可能把词义过早固定为一种系统化解释。
- issue: πνεῦμα的所指
  choice: 圣灵
  alternative: 人的灵
  rationale: 本章前后文以圣灵与肉体对照，并谈到靠圣灵行事，因此“圣灵”最符合语境；脚注说明另一种可能，以保留原文不以大小写区分所指的特点。
- issue: ἵνα μή从句的逻辑关系
  choice: 译作“使你们不能……”
  alternative: 为要不让你们……／结果你们不能……
  rationale: 希腊语ἵνα可表达目的或结果；正文采用兼具作用与结果色彩的自然中文，不进一步断言肉体与圣灵共同具有某一目的。
- issue: “不能做自己想做的事”中“想做”所指
  choice: 保持未限定
  alternative: 特指想行的善事／泛指任何愿望
  rationale: 原文没有明说所愿之事是善是恶；保留这种张力，避免根据某一神学解释擅自补入“善事”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“所欲求的……相敌”保留原句平行结构；“彼此对抗”清楚呈现两者的相互冲突。脚注标记均置于相关正文之后。
