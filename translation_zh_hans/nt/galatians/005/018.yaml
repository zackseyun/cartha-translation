  text: εἰ δὲ πνεύματι ἄγεσθε, οὐκ ἐστὲ ὑπὸ νόμον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/018.yaml
  text: But if you are led by the Spirit[b][a], you are not under the law.
translation:
  language: zh_hans
  text: 但你们若受圣灵引导[a]，就不在律法之下[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“若正受圣灵引导。”
    reason: 原文动词为现在时被动语态，可显明持续进行的意味；正文采用较自然且在体貌上较中性的汉语表达。
  - marker: b
    text: “在律法之下”指处于律法的权柄或管辖之下；参看加拉太书5:23。
    reason: 说明保罗这一惯用语的含义，并提供相关经文参照。
lexical_decisions:
- source_word: εἰ
  choice: 若
  rationale: 引出条件从句；“若”准确、简洁，也符合庄重而自然的现代书面语。
- source_word: δὲ
  choice: 但
  rationale: 承接上下文，并表达肉体与圣灵之间的轻度转折。
- source_word: πνεύματι
  choice: 圣灵
  rationale: 此处与上下文的“肉体”相对，指神的灵；汉语以“圣灵”明确这一所指，而不额外扩展经文含义。
- source_word: ἄγεσθε
  choice: 受……引导
  rationale: 保留现在时被动语态的核心意义，表明圣灵是引导者；汉语未强行限定持续体，相关可能性收入脚注。
- source_word: οὐκ ἐστὲ
  choice: 就不在
  rationale: 与前面的条件从句自然衔接，并准确表达否定的状态。
- source_word: ὑπὸ νόμον
  choice: 在律法之下
  rationale: 保留保罗具有空间隐喻色彩的惯用表达，指处于律法的权柄或管辖之下，而不在正文中将其解释性展开。
theological_decisions:
- issue: πνεύματι的所指
  choice: 圣灵
  alternative: 人的灵
  rationale: 加拉太书5章的直接语境反复将肉体与那位施行引导、使信徒结出果子的神之灵相对；译作“圣灵”符合该语境。
- issue: ὑπὸ νόμον的含义
  choice: 在律法之下
  alternative: 泛指处在任何法律之下
  rationale: 在加拉太书中，这一表达主要涉及处于摩西律法的管辖体制之下。正文保留原有隐喻和神学张力，不将其扩写成完整的教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“但……若……就……”清楚呈现转折、条件及结果关系；“受圣灵引导”和“在律法之下”兼顾自然表达与原文形式。
