  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ὑμεῖς γὰρ ἐπ’ ἐλευθερίᾳ ἐκλήθητε, ἀδελφοί· μόνον μὴ τὴν ἐλευθερίαν εἰς ἀφορμὴν τῇ σαρκί, ἀλλὰ διὰ τῆς ἀγάπης δουλεύετε ἀλλήλοις·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/013.yaml
  text: For you were called to freedom[a], brothers; only do not use your freedom as an opportunity for the flesh[d][c][b], but through love serve one another.
translation:
  language: zh_hans
  text: 弟兄们[a]，你们蒙召原是为了自由；只是不可把这自由当作肉体的机会[b][c]，反要借着爱彼此服事[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”译自希腊文阳性复数称呼；在本信中，这一称呼面向整个信徒群体，包括女性。
    reason: lexical_alternative
  - marker: b
    text: “当作……的机会”也可译作“给……留下可乘之机”或“作为……的据点”。
    reason: lexical_alternative
  - marker: c
    text: 这里的“肉体”不只是指身体，也涉及堕落人性中以自我为中心、违背神的欲望；有些译本译作“罪性”。
    reason: alternative_reading
  - marker: d
    text: 译作“服事”的动词与“奴仆”一词相关，含有像奴仆一样委身为别人效力的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: 你们
  rationale: 明确保留第二人称复数；汉语用“你们”即可自然承载其强调，不另加反身表达。
- source_word: γὰρ
  choice: 原是
  rationale: 本句承接并说明上文；“原是”在现代汉语中能自然体现解释性关联，避免生硬使用“因为”。
- source_word: ἐπ’ ἐλευθερίᾳ
  choice: 要得自由
  rationale: ἐπί加与格在此指向蒙召的目标或所进入的状态；“要得自由”自然表达这一目的，同时不把它收窄为政治或社会自由。
- source_word: ἐκλήθητε
  choice: 蒙召
  rationale: 保留神学语境中被动的“呼召”含义，又不额外规定某一宗派对呼召的系统解释。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊文阳性复数称呼；脚注说明在书信语境中它涵盖整个信徒群体，包括女性。
- source_word: μόνον
  choice: 只是
  rationale: 自然表达对前述自由的重要限制和转折。
- source_word: μὴ...εἰς ἀφορμὴν
  choice: 不可把……当作……的机会
  rationale: ἀφορμή可指起点、根据或可乘之机；此译法清楚表达不可让自由成为肉体活动的契机。
- source_word: σάρξ
  choice: 肉体
  rationale: 保留保罗具有神学张力的用语，不在正文中直接解释为“罪性”；脚注说明此处并非只指身体。
- source_word: διὰ τῆς ἀγάπης
  choice: 借着爱
  rationale: 保留διά加属格的工具或媒介意味，表达爱是彼此服事的途径。
- source_word: δουλεύετε
  choice: 服事
  rationale: 符合现代基督教汉语及庄重书面语，同时脚注保留该动词与“作奴仆”相关的较强语义。
- source_word: ἀλλήλοις
  choice: 彼此
  rationale: 简洁自然地表达相互关系。
theological_decisions:
- issue: ἀδελφοί对包含女性的混合群体的称呼
  choice: 弟兄们
  alternative: 弟兄姊妹；众弟兄姊妹
  rationale: 正文保留原文阳性复数形式，避免把解释直接写进正文；脚注交代其在本信中的群体性、包容性指向。
- issue: 保罗伦理语境中σάρξ的含义
  choice: 肉体
  alternative: 罪性；堕落本性
  rationale: “肉体”保留保罗用词的多义性及身体、旧人性与悖逆倾向之间的张力；“罪性”虽解释性更强，却可能过早固定其含义。
- issue: δουλεύετε的奴仆意象
  choice: 服事
  alternative: 作彼此的奴仆
  rationale: “服事”在劝勉语境中自然清楚；同时以脚注指出原词含有像奴仆一样委身服役的力度，避免完全弱化修辞反差。
- issue: ἐπ’ ἐλευθερίᾳ所表达的关系
  choice: 蒙召原是要得自由
  alternative: 蒙召是为了自由；在自由中蒙召
  rationale: 此译兼顾目标与进入自由状态的可能意味，不把介词结构严格限定为单一语法关系。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。正文力求顺畅，同时保留“自由—肉体—服事”之间的修辞张力。不过[a]应紧随“弟兄们”出现，正文现已以标记体现。
