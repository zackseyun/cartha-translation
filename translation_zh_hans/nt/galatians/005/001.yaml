  text: τῇ ἐλευθερίᾳ ⸂ἡμᾶς Χριστὸς ἠλευθέρωσεν· στήκετε οὖν⸃ καὶ μὴ πάλιν ζυγῷ δουλείας ἐνέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/001.yaml
  text: For freedom Messiah set us free[a]; therefore stand firm[b], and do not again be held by a yoke of slavery.
translation:
  language: zh_hans
  text: 为了自由，弥赛亚释放了我们[a]。所以，你们要站立得稳[b]，不要再受奴役的轭辖制。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“弥赛亚在自由中释放了我们。”句首的与格短语十分凝练，可以有几种彼此相近的理解。
    reason: alternative_reading
  - marker: b
    text: “站立得稳”含有持续坚定、不动摇的意思。下半句的动词也可译为“不要再陷入奴役的轭中”或“不要再受奴役的轭束缚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ ἐλευθερίᾳ
  choice: 为着自由
  rationale: 句首与格结构高度凝练，可表达目的或结果。“为着自由”保留其前置强调和修辞力度，同时不排除“在自由中”的相近理解。
- source_word: Χριστὸς
  choice: 弥赛亚
  rationale: Χριστός在此具有称号意义；译作“弥赛亚”既传达其本义，也保留犹太弥赛亚语境。
- source_word: ἠλευθέρωσεν
  choice: 释放了我们
  rationale: ἐλευθερόω意为使人自由、释放。“释放”是自然庄重的现代汉语，并与前面的“自由”形成原文同根词呼应。
- source_word: στήκετε
  choice: 站立得稳
  rationale: 现在时命令语气要求持续坚定。“站立得稳”保留站立意象和劝勉力度。
- source_word: οὖν
  choice: 所以
  rationale: 明确标示由前述宣告推出的结论，符合现代汉语表达。
- source_word: πάλιν
  choice: 再
  rationale: 直接表达回到先前状态的意思。
- source_word: ζυγῷ δουλείας
  choice: 奴役的轭
  rationale: 保留ζυγός“轭”的具体比喻，并以“奴役”表达δουλεία受奴役、失去自由的强烈含义。
- source_word: ἐνέχεσθε
  choice: 被……辖制
  rationale: 该动词在此可指受制于、被缠住或陷入某事物；“被……辖制”与负轭的比喻自然衔接，也保留被动意味。
theological_decisions:
- issue: Χριστός应译作称号还是沿用教会音译
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处按称号本义翻译，以显明其弥赛亚身份和犹太背景，而不把称号处理成姓名。
- issue: δουλεία的强度
  choice: 奴役
  alternative: 束缚
  rationale: 上下文将自由与其反面作鲜明对比；“奴役”比“束缚”更准确地表达被置于奴隶状态的强度。
- issue: 句首与格τῇ ἐλευθερίᾳ的功能
  choice: 为着自由
  alternative: 在自由中
  rationale: 采用目的或结果的理解，但以脚注保留此凝练结构可能表达状态或领域的真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“为着自由”略带书面色彩，用以保留原文句首强调；“站立得稳”和“奴役的轭”保留保罗的具体比喻与劝勉力度。
