  text: μικρὰ ζύμη ὅλον τὸ φύραμα ζυμοῖ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/009.yaml
  text: A little leaven leavens the whole batch of dough[a].
translation:
  language: zh_hans
  text: 一点面酵就能使整团面发起来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一点酵母就能使整个面团都发酵。”
    reason: 词汇替代译法；“酵母”“面团”“发酵”更贴近现代技术用语，但对古代面酵的涵盖较窄，谚语语感也较弱。
lexical_decisions:
- source_word: μικρὰ
  choice: 一点
  rationale: 这里表示少量，而不只是体积小；“一点”符合现代汉语的谚语式表达，也突出少量事物产生广泛影响。
- source_word: ζύμη
  choice: 面酵
  rationale: 指用于使面团发起的发酵物。“面酵”比现代工业语境中的“酵母”更能涵盖古代发酵面种，同时保留经文具体的面团意象。
- source_word: ὅλον
  choice: 整团
  rationale: “整”准确表达其作用遍及全部；与“团面”结合，在现代汉语中自然简洁。
- source_word: φύραμα
  choice: 团面
  rationale: 指揉合成的一团面或面团。译作“整团面”既保留具体意象，又比直译为“块”清楚自然。
- source_word: ζυμοῖ
  choice: 使……发起来
  rationale: 该动词意为使面团发酵。“使……发起来”是普通读者熟悉的面食用语，并保留原文的使动意义和简洁力度。
theological_decisions:
- issue: 谚语的隐喻作用
  choice: 保留面酵和面团的具体图像，不在正文中明说其所指。
  alternative: 译明为少许错误教导会影响整个群体。
  rationale: 本节本身陈述一句谚语；其上下文虽暗示一种扩散性的负面影响，原句却没有直接解释隐喻。保留图像可维护其修辞张力，避免把上下文解释写进正文。
- issue: 面酵在此处的价值色彩
  choice: 不在译文中增添“坏的”“败坏”等负面限定。
  alternative: 译为“一点坏酵就会败坏整团面”。
  rationale: ζύμη在本句中只是谚语图像，其负面含义由语境产生，并非这些词本身明说；不宜在正文中将隐含判断词汇化。
translation_notes:
  register: 采用现代、简洁而庄重的谚语式句法。“就能”自然凸显少量面酵与整体效果之间的反差；正文脚注标记[a]与脚注对应。
