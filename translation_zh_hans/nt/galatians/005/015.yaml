base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/015.yaml
  text: But if you bite and devour one another[a], watch out that you are not consumed by one another.
translation:
  language: zh_hans
  text: 但你们若彼此相咬相吞，就要当心，免得你们彼此吞灭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: 但……若
  rationale: εἰ引出条件，δέ承接上文并形成轻微转折；“但……若”自然保留这一关系。
- source_word: ἀλλήλους
  choice: 彼此
  rationale: 准确表达群体成员之间相互施加的行为，并使三处互惠关系清晰连贯。
- source_word: δάκνετε
  choice: 相咬
  rationale: 保留“咬”的字面动物性意象；“相咬”在中文中明确体现彼此攻击。
- source_word: κατεσθίετε
  choice: 相吞
  rationale: 保留强烈的吞吃意象，并与“相咬”构成简洁有力的递进。
- source_word: βλέπετε
  choice: 要当心
  rationale: 作为命令语，表达警觉和紧迫警告，符合现代汉语习惯。
- source_word: μὴ
  choice: 免得
  rationale: 与虚拟语气被动式结合，引出需要防范的可能后果；“免得”自然保留警戒语气。
- source_word: ὑπ’ ἀλλήλων
  choice: 彼此
  rationale: 在“彼此毁灭”中保留相互为施事者的含义，即双方导致对方灭亡。
- source_word: ἀναλωθῆτε
  choice: 毁灭
  rationale: 此处指被耗尽而归于毁灭；“毁灭”传达严重结局。由于前文“吞”已保留捕食意象，正文采用自然而有力度的结果表达，并以脚注列出更贴近意象的译法。
theological_decisions:
- issue: 基督徒群体内部冲突的动物性暴力比喻
  choice: 保留“相咬相吞”的具体意象，并将最终结果译为“彼此毁灭”
  alternative: 将全句弱化为“彼此伤害”；或将末句译为“被彼此吞灭”
  rationale: 保罗的修辞刻意强烈，描绘群体因互相攻击而走向自我毁灭。保留前两个动作的动物性意象，避免把经文泛化为普通分歧；正文“毁灭”也清楚传达ἀναλίσκω在此语境中的终极后果。
translation_notes:
  register: 采用现代、简洁而庄重的劝诫语体。“相咬相吞”保留原文鲜明的动物性比喻，“要当心，免得”传达命令和可能后果。脚注标记[a]已置于正文对应句末。
