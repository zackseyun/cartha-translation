    text: 或译“行巫术”。
    reason: lexical_alternative
  - marker: b
    text: 或译“党派”或“宗派”；在后期教会用语中也可指“异端”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδωλολατρία
  choice: 拜偶像
  rationale: 指敬拜或事奉偶像；“拜偶像”在现代汉语中自然、明确，并保留其宗教和道德含义。
- source_word: φαρμακεία
  choice: 行邪术
  rationale: 此处不是泛指用药，而是指与药物、咒术等相关的巫术实践；“行邪术”清楚表达其行为性质。
- source_word: ἔχθραι
  choice: 彼此敌对
  rationale: 复数形式指人与人之间的敌意及敌对表现；“彼此敌对”切合本段群体关系的语境。
- source_word: ἔρις
  choice: 争竞
  rationale: 表示争吵、争斗和好竞争胜；“争竞”简洁庄重，适合恶行清单。
- source_word: ζῆλος
  choice: 嫉妒
  rationale: 该词可有正面的“热心”之义，但在此负面清单中指嫉妒和争胜的热忱。
- source_word: θυμοί
  choice: 暴怒
  rationale: 复数形式侧重一再爆发的怒气；“暴怒”比单纯“愤怒”更能体现突然猛烈的发作。
- source_word: ἐριθεῖαι
  choice: 自私争胜
  rationale: 指为个人利益而争权夺利或结党竞争；“自私争胜”同时表达自利动机和竞争行为。
- source_word: διχοστασίαι
  choice: 分裂
  rationale: 指群体内部彼此对立、分开；“分裂”现代、清楚，并保留群体性的含义。
- source_word: αἱρέσεις
  choice: 结党
  rationale: 本语境主要指形成对立派系的行为；“结党”突出破坏群体合一的社会性含义，避免直接套用后期教会的技术术语。
theological_decisions:
- issue: αἱρέσεις的译法
  choice: 结党
  alternative: 派别；异端
  rationale: 上下文集中列举破坏人际和群体关系的恶行，因此这里首先指分党分派。“异端”是后期教会语境中的可能用法，若直接放入正文，容易把后来的教义分类带进本节。
translation_notes:
  register: 采用现代、庄重且适合连续恶行清单的表达。各项以顿号连接，并保留末尾逗号，以便与加拉太书5:19—21的完整句子衔接。
