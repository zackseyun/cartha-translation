base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/020.yaml
  text: idolatry[a], sorcery, hostilities, strife, jealousy, outbursts of anger, selfish ambition, divisions, factions[b],
translation:
  language: zh_hans
  text: 拜偶像、行邪术[a]、彼此敌对、纷争、嫉妒、暴怒、自私争胜、分裂、派别[b]，
  philosophy: optimal-equivalence
  footnotes:
