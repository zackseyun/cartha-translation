source:
  edition: SBLGNT
  text: ἐγὼ δέ, ἀδελφοί, εἰ περιτομὴν ἔτι κηρύσσω, τί ἔτι διώκομαι; ἄρα κατήργηται τὸ σκάνδαλον τοῦ σταυροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/011.yaml
  text: But I[a], brothers, if I am still preaching circumcision[b], why am I still being persecuted? Then the offense of the cross has been removed.
translation:
  language: zh_hans
  text: 弟兄们[a]，至于我，我若仍在传割礼，为什么还受迫害呢？若是这样，十字架所带来的冒犯就失去作用了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”也可译作“弟兄姊妹们”；希腊语“弟兄”可用来称呼包括男女在内的一群人。
    reason: lexical_alternative
  - marker: b
    text: “十字架所带来的冒犯”也可译作“十字架这块绊脚石”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 这是阳性复数呼格；“弟兄们”保留原文称呼形式。在书信语境中，该词可以涵盖会众中的男女，故以脚注说明。
- source_word: περιτομήν
  choice: 割礼
  rationale: “割礼”是现代汉语中对 περιτομή 的标准、直接译法；在本段语境中也涉及把割礼作为宗教要求来宣讲。
- source_word: ἔτι
  choice: 仍／还
  rationale: 原文两次使用 ἔτι。汉语分别用“仍”和“还”，自然地保留其持续意义及保罗论证中的对应关系。
- source_word: κηρύσσω
  choice: 传
  rationale: κῆρύσσω 表示公开宣讲；“传割礼”简明自然，并保留其宣扬某种信息或要求的语力。
- source_word: διώκομαι
  choice: 受迫害
  rationale: 这是现在时被动形式；“受迫害”准确表达持续遭受敌对逼迫的意思。
- source_word: ἄρα
  choice: 若是这样
  rationale: ἄρα 引出由前述假设所得的推论；“若是这样”在汉语中清楚衔接反事实意味浓厚的论证。
- source_word: κατήργηται
  choice: 就已经消除了
  rationale: 这是完成时被动形式，强调达到并持续处于失效或被消除的状态；结合汉语习惯，用“就已经消除了”表达推论及结果状态。
- source_word: σκάνδαλον
  choice: 所引起的冒犯
  rationale: σκάνδαλον 可指使人跌倒的障碍，也可指引发反感、拒绝之事。此处“所引起的冒犯”突出十字架令人反感并招致敌对的语境，同时用脚注保留“绊脚石”这一具体意象。
- source_word: σταυροῦ
  choice: 十字架
  rationale: 这是保罗书信语境中 σταυρός 的标准译法，不额外加入解释。
theological_decisions:
- issue: ἀδελφοί 用于可能包括男女的会众
  choice: 弟兄们
  alternative: 弟兄姊妹们
  rationale: 正文保留原文阳性复数称呼的形式，以脚注说明希腊语在此可以涵盖男女，既不把现代汉语的男性限定误加给原文，也不在正文中消解原词形式。
- issue: σκάνδαλον τοῦ σταυροῦ 的含义
  choice: 十字架所引起的冒犯
  alternative: 十字架这块绊脚石
  rationale: 上下文强调，若保罗仍宣讲割礼，他就不会因十字架的信息受迫害；“冒犯”表达十字架引发反感和拒绝的作用，而“绊脚石”作为同样成立且更具原文意象的译法列入脚注。
- issue: κατήργηται 的反事实推论力度
  choice: 就已经消除了
  alternative: 就失去作用了
  rationale: 保留完成时所表达的结果状态，同时不把经文改写成教义解释；“若是这样”明确指出这是从前述条件推出的结论。
translation_notes:
  register: 采用现代、庄重而易懂的书信论辩语体。“至于我，我”有意呈现 ἐγὼ δέ 中强调的第一人称与转折；问句保持保罗反问的力度。脚注标记均置于正文相应位置。
