source:
  edition: SBLGNT
  text: ἐν γὰρ Χριστῷ Ἰησοῦ οὔτε περιτομή τι ἰσχύει οὔτε ἀκροβυστία, ἀλλὰ πίστις δι’ ἀγάπης ἐνεργουμένη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/006.yaml
  text: For in Messiah Jesus neither circumcision nor uncircumcision counts for anything[c][b][a], but faith working through love.
translation:
  language: zh_hans
  text: 因为在弥赛亚耶稣里[a]，无论受割礼还是未受割礼，都没有什么效力；惟有借着爱发挥作用的信心[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚耶稣”也可译作“基督耶稣”。希腊语 Χριστός 是一个称号，意思是“受膏者”。
    reason: alternative_reading
  - marker: b
    text: “信心”也可译作“忠信”或“信靠”。
    reason: lexical_alternative
  - marker: c
    text: “借着爱发挥作用”也可译作“借着爱而活跃”“借着爱表现出来”或“借着爱产生效力”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: 在弥赛亚耶稣里
  rationale: 将 Χριστός 作为称号译为“弥赛亚”，并保留 ἐν 的“在……里”，以呈现保罗关于与弥赛亚联合的表达。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文，说明前述论点的理由；“因为”符合现代汉语的论证衔接方式。
- source_word: περιτομή / ἀκροβυστία
  choice: 受割礼 / 不受割礼
  rationale: 用平行的动宾结构自然表达两种身份状态，同时保留其字面及群体身份层面的含义。
- source_word: τι ἰσχύει
  choice: 不算什么
  rationale: 此处指不具有决定性的分量或效力，而非单指体力或能力；“不算什么”自然传达其无关紧要。
- source_word: πίστις
  choice: 信心
  rationale: 采用项目对 πίστις 的通常译法；“忠信”和“信靠”等可能含义收入脚注。
- source_word: δι’ ἀγάπης
  choice: 借着爱
  rationale: διά 加属格表示途径或媒介；“借着爱”保留信心与爱之间的关系，不将其改写成信心产生爱。
- source_word: ἐνεργουμένη
  choice: 发挥作用
  rationale: 该现在时中间/被动分词可指活跃、运行或产生效力；此译法保留其动态含义，又不强行判定为严格的中间语态或被动语态。
theological_decisions:
- issue: Χριστός 的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 在“Χριστῷ Ἰησοῦ”中将其按称号的意义翻译；传统音译“基督”作为备选保留。
- issue: πίστις 的语义
  choice: 信心
  alternative: 忠信；信靠
  rationale: 上下文可自然理解为借着爱发挥作用的信心，但该词本身仍有“忠信”或“信靠”的语义范围，故不在正文中排除其他可能。
- issue: ἐνεργουμένη 的语态与含义
  choice: 发挥作用
  alternative: 活跃着；表现出来；产生效力
  rationale: 希腊语形式容许中间或被动层面的理解；正文采用不明确指定施动关系的表达，以保留原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“受割礼或不受割礼”保持两种身份类别的对称；“不算什么……才算数”以自然汉语呈现原文的强烈对比。
