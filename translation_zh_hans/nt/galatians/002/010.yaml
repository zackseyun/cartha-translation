  text: μόνον τῶν πτωχῶν ἵνα μνημονεύωμεν, ὃ καὶ ἐσπούδασα αὐτὸ τοῦτο ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/010.yaml
  text: only that we should remember the poor, which was exactly what I was eager to do.
translation:
  language: zh_hans
  text: 只是要我们记念穷人；这也正是我曾竭力去做的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μόνον
  choice: 只是
  rationale: 标明这是协议中唯一附带提出的事项；“只是”在现代汉语中自然、准确。
- source_word: τῶν πτωχῶν
  choice: 穷人
  rationale: πτωχός通常指贫穷的人；“穷人”直接保留其社会经济含义，不弱化为笼统的“有需要的人”。
- source_word: ἵνα μνημονεύωμεν
  choice: 要我们记念
  rationale: ἵνα在μόνον之后引出所提事项的内容；“记念”既保留原文措辞，也可在语境中包含实际关怀，而不把行动方式过度具体化。
- source_word: ὃ
  choice: 这
  rationale: 中性关系代词回指前述“记念穷人”这整件事；汉语用“这”衔接更自然。
- source_word: ἐσπούδασα
  choice: 我一向热心
  rationale: σπουδάζω表达热切、认真并积极付诸行动；“热心”兼顾意愿与实践。“一向”在此表达不定过去时所概括的实际投入，但不限定为单次行动。
- source_word: αὐτὸ τοῦτο ποιῆσαι
  choice: 这也正是……去做的
  rationale: αὐτὸ τοῦτο强调“正是这件事”；将强调落在“正是”上，符合现代汉语表达，并保留ποιῆσαι的行动意味。
theological_decisions:
- issue: “记念穷人”是否明说为捐助或救济
  choice: 保留“记念”
  alternative: 译作“救济穷人”或“照顾穷人”
  rationale: 原文使用μνημονεύω，并未明说具体行动形式。语境虽暗示实际关怀，译文仍不应把这一暗示收窄为某一种行为。
- issue: “穷人”的具体所指
  choice: 不在正文限定其群体身份
  alternative: 译作“耶路撒冷的穷人”或“贫穷的圣徒”
  rationale: 本节原文本身只说“穷人”。可能的历史所指应由上下文和注释讨论，不宜补入正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“记念”略带经文语体，但在现代宗教及正式语境中仍清楚自然；分号体现后半句对前述要求的承接与强调。
