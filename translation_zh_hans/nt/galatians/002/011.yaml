id: GAL.2.11
reference: Galatians 2:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ὅτε δὲ ἦλθεν ⸀Κηφᾶς εἰς Ἀντιόχειαν, κατὰ πρόσωπον αὐτῷ ἀντέστην, ὅτι κατεγνωσμένος ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/011.yaml
  text: But when Cephas came to Antioch[a], I opposed him to his face[b], because he stood condemned.
translation:
  language: zh_hans
  text: 可是，矶法来到安提阿时[a]，我当面反对他，因为他已被定罪[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “矶法”是彼得的亚兰语名字。
    reason: cross_reference
  - marker: b
    text: 或译：“因为他显然做错了。”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ
  choice: 可是……时
  rationale: 以自然的现代汉语同时表达时间关系和 δέ 所带的轻微转折。
- source_word: Κηφᾶς
  choice: 矶法
  rationale: 保留希腊文本中的人名形式 Κηφᾶς，不直接替换为更为人熟悉的“彼得”；其身份在脚注中说明。
- source_word: ἦλθεν εἰς Ἀντιόχειαν
  choice: 来到安提阿
  rationale: 准确而自然地表达前往并抵达该城的意思。
- source_word: κατὰ πρόσωπον αὐτῷ
  choice: 当面
  rationale: 保留直接面对本人进行对抗的语义力度，同时符合现代汉语习惯。
- source_word: ἀντέστην
  choice: 我……反对他
  rationale: 表达公开抵制、与之对立的行动；“反对”比“抵挡”更适合此处人际冲突的语境。
- source_word: ὅτι
  choice: 因为
  rationale: 按最直接的因果意义理解，引出保罗当面反对矶法的理由。
- source_word: κατεγνωσμένος ἦν
  choice: 他已被定罪
  rationale: 保留完成时分词与未完成时系词构成的结果状态，并保留被动语态，不在正文中擅自指定定罪者。
theological_decisions:
- issue: Κηφᾶς 的人名形式及身份
  choice: 正文作“矶法”，脚注说明即彼得的亚兰语名字
  alternative: 正文直接作“彼得”
  rationale: 原文使用 Κηφᾶς，音译能更透明地反映文本形式；脚注则帮助普通读者确认其身份。
- issue: κατεγνωσμένος ἦν 的含义
  choice: 他已被定罪
  alternative: 他显然做错了
  rationale: 正文保留原文被动形式及其较强的审判性措辞，也保留“由谁定罪”的开放性；脚注提供较具解释性的语义可能，避免掩盖真实歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“可是”体现温和转折；“当面反对”简洁有力。正文保留“被定罪”的被动和神学张力，并以脚注呈现较解释性的另一译法。
