revisions:
- from: 但我是照着启示上去的[a]。我把我在外族人中所传的福音陈明给他们；不过，我是私下向那些有声望的人陈明的[b]，免得我现在或从前所奔跑的，竟是徒然[c]。
  to: 但因着启示，我上去了[a]，把我在外邦人中所传的福音陈明给他们；但我是私下向那些有声望的人陈明的[b]，免得我现在正在奔跑的，或从前已经奔跑过的，都是徒然[c]。
  rationale: 修订以“外邦人”准确呈现本处ἔθνη的保罗书信语境，并调整若干直译式表达，使现代标准汉语更自然。译文仍将“陈明”维持为中性措辞，不预设保罗是在寻求正式批准；“有声望的人”也保留τοῖς δοκοῦσιν的社会认定意味及其未决的语用张力。末句仅体现持续的当前奔跑与已完成的过去奔跑，未裁定保罗所忧虑的“徒然”具体为何。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:52:07Z'
review_pass:
  verdict: revise
  source_fidelity: 译文基本准确地保留了保罗因启示而上去、向人陈明在外邦人中所传福音、私下对有声望者陈明，以及避免徒然奔跑的意思。惟“外族人”不如“外邦人”准确地表达本处保罗语境中的ἔθνη；末句的“我现在或从前所奔跑的”中文搭配也不够自然。
  naturalness: “我是照着启示上去的”稍显生硬，“因着启示，我上去了”更合现代庄重书面语。“不过，我是私下向……陈明的”虽可理解，却因重复“陈明”及“我是”而略滞；改为“但我是私下向……陈明的”可更顺畅地保留插入式限定。
  terminology: “福音”“有声望的人”“徒然”均合适，并恰当地没有将ἀνατίθημι译成正式提交审批。“外邦人”是现代中文圣经语境中对本处非犹太人的通行且明确的表达；“外族人”较容易被理解为泛指外国族群。
  issues:
