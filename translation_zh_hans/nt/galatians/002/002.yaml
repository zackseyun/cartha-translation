id: GAL.2.2
reference: Galatians 2:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀνέβην δὲ κατὰ ἀποκάλυψιν· καὶ ἀνεθέμην αὐτοῖς τὸ εὐαγγέλιον ὃ κηρύσσω ἐν τοῖς ἔθνεσιν, κατ’ ἰδίαν δὲ τοῖς δοκοῦσιν, μή πως εἰς κενὸν τρέχω ἢ ἔδραμον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/002.yaml
  text: But I went up in response to a revelation[a], and I laid before them the gospel that I proclaim among the Gentiles—but privately before those of repute—lest somehow I should be running, or had run[c][b], in vain.
translation:
  language: zh_hans
  text: 但因着启示，我上去了[a]，把我在外邦人中所传的福音陈明给他们；但我是私下向那些有声望的人陈明的[b]，免得我现在正在奔跑的，或从前已经奔跑过的，都是徒然[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因着启示”也可译作“照着启示”或“根据启示”。
    reason: lexical_alternative
  - marker: b
    text: “那些有声望的人”也可译作“那些被认为重要的人”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“免得我正在奔跑，或已经奔跑过，竟是徒然。”希腊文动词分别为现在时和不定过去时。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβην
  choice: 上去
  rationale: 保留“上去”的基本空间意义；本节未明说目的地，因此不补入“耶路撒冷”。
- source_word: κατὰ ἀποκάλυψιν
  choice: 照着启示
  rationale: κατά在此可表示依据或促成此行的缘由。“照着启示”自然且保留“根据启示”与“因启示而去”之间的细微空间。
- source_word: ἀνεθέμην αὐτοῖς
  choice: 陈明给他们
  rationale: 表达把某事摆在别人面前说明、供其考虑，不暗示保罗将福音正式交由对方批准。
- source_word: τὸ εὐαγγέλιον
  choice: 福音
  rationale: “福音”是保罗书信语境中εὐαγγέλιον准确、通行而简洁的译法。
- source_word: ἐν τοῖς ἔθνεσιν
  choice: 在外族人中
  rationale: 此处ἔθνη指犹太人以外的各族。“外族人”比地缘政治意义的“列国”更贴合上下文，也较易为现代读者理解。
- source_word: κατ’ ἰδίαν
  choice: 私下
  rationale: 简洁表达与公开或较大范围场合相对的私下会面。
- source_word: τοῖς δοκοῦσιν
  choice: 那些有声望的人
  rationale: δοκέω的分词在此指被人看为重要、有地位的人；该译法保留其公认声望，同时不武断认定保罗是在肯定或讽刺他们。
- source_word: μή πως εἰς κενὸν τρέχω ἢ ἔδραμον
  choice: 免得我现在或从前所奔跑的，竟是徒然
  rationale: 以“现在或从前”体现τρέχω的现在时与ἔδραμον的不定过去时之对比，并保留“奔跑”这一事奉劳苦的比喻及“徒然”的结果含义。
theological_decisions:
- issue: 保罗私下陈明福音是否表示将福音提交使徒批准或纠正
  choice: 使用“陈明给他们”，保持中性，不暗示教义上的从属或正式求批。
  alternative: “提交给他们审核”或“只是告知他们”
  rationale: ἀνατίθημι说明把事情摆在对方面前，而经文所说“免得……徒然”显示此举并非毫无评议意味；但该动词本身也不足以支持正式求批的强义。
- issue: “那些有声望的人”是否含讽刺意味
  choice: 保留社会认定层面的表达，不明确判定赞许或讽刺。
  alternative: “那些公认的领袖”或“那些自以为了不起的人”
  rationale: τοῖς δοκοῦσιν具有可保留的语用张力；过度正面或负面的译法都会替正文消除歧义。
- issue: 保罗担心“徒然”是否意味着其福音可能错误
  choice: 保留“免得……徒然”，不说明徒然的具体机制。
  alternative: 明译为“免得我的福音传错了”或“免得事工因分裂而落空”
  rationale: 本节没有明说担忧来自信息错误、教会分裂、对方反对或其他原因，译文不应代为裁定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“陈明”适合书信论述语体，又避免“提交”所带来的制度性审批含义。用分号和“不过”清楚呈现κατ’ ἰδίαν δὲ所构成的插入式转折。所有脚注标记均已置于正文相应位置。
