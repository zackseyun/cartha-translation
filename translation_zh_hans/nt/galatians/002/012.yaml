id: GAL.2.12
reference: Galatians 2:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: πρὸ τοῦ γὰρ ἐλθεῖν τινας ἀπὸ Ἰακώβου μετὰ τῶν ἐθνῶν συνήσθιεν· ὅτε δὲ ⸀ἦλθον, ὑπέστελλεν καὶ ἀφώριζεν ἑαυτόν, φοβούμενος τοὺς ἐκ περιτομῆς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/012.yaml
  text: For before certain men came from James[a], he used to eat with the Gentiles; but when they came, he began to draw back and separate himself[c][b], fearing those of the circumcision.
translation:
  language: zh_hans
  text: 因为在有些人从雅各那里来之前，他一向和外邦人一同吃饭；可是他们一来，他就开始退缩，与外邦人隔开，因为害怕那些受割礼的人。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从雅各那里”也可理解为“从雅各那一边来”；希腊文本身没有说明他们是否由雅各正式差遣。
    reason: alternative_reading
  - marker: b
    text: “那些受割礼的人”或译“割礼派的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ τοῦ γὰρ ἐλθεῖν τινας
  choice: 因为在有些人……来之前
  rationale: 自然表达πρό加冠词不定式的时间关系，并以“有些人”保留τινας的不定指含义。
- source_word: ἀπὸ Ἰακώβου
  choice: 从雅各那里
  rationale: 保留ἀπό所表达的来源或关联，不额外断定这些人正式受雅各差遣。
- source_word: μετὰ τῶν ἐθνῶν
  choice: 和外族人一同
  rationale: 在保罗语境中指非犹太人；不擅自补入“信徒”。
- source_word: συνήσθιεν
  choice: 一向……一同吃饭
  rationale: 以“一向”体现未完成时所表示的惯常行为。
- source_word: ὑπέστελλεν
  choice: 开始退缩
  rationale: 传达退后、畏缩之意，并在语境中体现未完成时所呈现的渐进行动。
- source_word: ἀφώριζεν ἑαυτόν
  choice: 与他们分开
  rationale: 在中文中自然表达反身性的社交隔离；“他们”按上下文指外族人。
- source_word: φοβούμενος
  choice: 因为害怕
  rationale: 明确表达分词在此自然具有的原因含义。
- source_word: τοὺς ἐκ περιτομῆς
  choice: 那些属割礼的人
  rationale: 贴近希腊文按割礼界定该群体的表达，同时避免直接加入“派”这一较强的群体标签。
theological_decisions:
- issue: ἀπὸ Ἰακώβου是否表示雅各正式差遣或赞同这些人
  choice: 从雅各那里
  alternative: 雅各派来的人；雅各那一边的人
  rationale: 希腊文可表示来源或关联，却没有明确说明正式授权，因此正文保留这种张力。
- issue: τοὺς ἐκ περιτομῆς是否应译成一个明确派别
  choice: 那些属割礼的人
  alternative: 割礼派的人
  rationale: 原文以割礼描述这一群体，并未明说它是正式派别；正文不加入更强的社会学判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“外族人”清楚表达非犹太人的身份；“一向……一同吃饭”保留惯常动作，“开始退缩”则呈现逐渐抽身的动态。脚注标记集中置于相关句末，正文中均有对应标记。
