  text: οἷς οὐδὲ πρὸς ὥραν εἴξαμεν τῇ ὑποταγῇ, ἵνα ἡ ἀλήθεια τοῦ εὐαγγελίου διαμείνῃ πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/005.yaml
  text: To them we did not yield in submission even for a moment[b][a], so that the truth of the gospel might remain for you.
translation:
  language: zh_hans
  text: 对他们，我们连片刻[a]也没有让步而顺从，为要使福音的真理仍为你们存留[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译是“连一小时也没有”，意思是“连片刻也没有”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“仍与你们同在”；也可译作“仍在你们中间”。
    reason: alternative_reading
lexical_decisions:
- source_word: οἷς
  choice: 对他们
  rationale: 关系代词指向上一节刚提到的人；译作“对他们”自然地保留其指代作用。
- source_word: οὐδὲ πρὸς ὥραν
  choice: 连片刻也没有
  rationale: 直译是“连一小时也没有”，在此为习语，强调哪怕极短时间也不曾让步。
- source_word: εἴξαμεν τῇ ὑποταγῇ
  choice: 屈服顺从
  rationale: εἴξαμεν表示退让、屈服，τῇ ὑποταγῇ说明顺从的方式或状态；合译既避免重复生硬，也保留拒绝屈从的力度。
- source_word: ἵνα
  choice: 为要使
  rationale: 明确表达目的关系，而非仅仅表达结果。
- source_word: ἡ ἀλήθεια τοῦ εὐαγγελίου
  choice: 福音的真理
  rationale: 保留保罗这一重要表达，不将“福音”释义性改写为某种特定教义表述。
- source_word: διαμείνῃ
  choice: 存留
  rationale: 表达继续存在、得以保全之意，同时与目的从句的语气相称。
- source_word: πρὸς ὑμᾶς
  choice: 为你们
  rationale: πρός加宾格在此可表达关联或惠益，译文凸显福音真理为加拉太信徒得以保全；“在你们中间”也属可能。
theological_decisions:
- issue: 保罗拒绝让步的范围
  choice: 笼统保留他完全没有向那些人屈服顺从的陈述
  alternative: 限定为个人不服从，或限定为制度层面的不妥协
  rationale: 希腊文没有把拒绝让步限制在纯个人或纯制度层面，因此不额外加入宗派性或制度性的解释。
- issue: πρὸς ὑμᾶς所表达的关系
  choice: 为你们
  alternative: 在你们中间／与你们同在
  rationale: “为你们”可体现对收信人的惠益或关联，但原介词结构容许空间或伴随关系的理解，故以脚注保留另一种译法。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“屈服顺从”保留εἴξαμεν与ὑποταγή的双重语义；“存留”较书面但在经文语体中自然。脚注标记均置于所说明的词句之后。
