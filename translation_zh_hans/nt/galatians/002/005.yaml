  to: 对他们，我们连片刻[a]也没有让步而顺从，为要使福音的真理仍为你们存留[b]。
  rationale: 修订将时间习语的脚注标记移至其所说明的词语之后；以“让步而顺从”分别反映εἴξαμεν与τῇ ὑποταγῇ；并把目的从句调整为较自然的现代书面汉语。πρὸς ὑμᾶς的主译仍采用“为你们”，但脚注保留“与你们同在”及较空间性的理解，避免将有争议的介词关系定为单一含义。
