base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/019.yaml
  text: For through the law I died to the law, so that I might live to God. I have been crucified with Messiah.
translation:
  language: zh_hans
  text: 因为我借着律法，向律法死了，为要得以向上帝活。我已经与弥赛亚同钉十字架。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: 因为
  rationale: 承接并说明上文论证的根据；“因为”在现代汉语中清楚保留解释关系。
- source_word: διὰ νόμου
  choice: 借着律法
  rationale: διά加属格在此表达途径或媒介；“借着”既贴近原文，又不预先说明律法如何产生这一结果。
- source_word: νόμῳ
  choice: 向律法
  rationale: 保留与“向上帝”相呼应的与格结构，表达保罗所说与律法之关系的断绝，同时避免扩写为某一种解释。
- source_word: ἀπέθανον
  choice: 死了
  rationale: 以完成体“死了”表达不定过去时所指的决定性事件，符合自然现代汉语。
- source_word: ἵνα
  choice: 为要
  rationale: 明确表达目的，同时保持经文庄重而简洁的语体。
- source_word: θεῷ ζήσω
  choice: 向上帝活着
  rationale: 保留与格的关系性和方向性，也与前面的“向律法死了”形成原文中的鲜明对照。
- source_word: Χριστῷ
  choice: 与弥赛亚
  rationale: Χριστός在此保留其称号意义，译作“弥赛亚”；与格由“与”表达，连接共同受钉的含义。
- source_word: συνεσταύρωμαι
  choice: 已经……同钉十字架
  rationale: “已经”体现完成时所表达的既成事件及其持续结果；“同钉十字架”准确传达共同被钉的被动含义。
theological_decisions:
- issue: 是否解释“借着律法，向律法死了”的具体机制
  choice: 保留紧凑的“借着律法，向律法死了”
  alternative: 译作“因律法的定罪，我就脱离了律法”或“借着律法，我不再受律法约束”
  rationale: 希腊原文刻意简练，含有浓厚的神学张力；解释律法在其中具体如何发挥作用，会把某一种释义写入正文。
- issue: 如何表达“向上帝活着”
  choice: 向上帝活着
  alternative: 为上帝而活
  rationale: “为上帝而活”较容易把原文压缩为目的或服事功能；“向上帝活着”保留与格的方向和关系意味，并对应“向律法死了”。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“借着……向……死了”刻意保留原文的凝练与张力；两个分句间的对照清晰。“同钉十字架”为读者熟悉的圣经表达，同时准确保留完成时的持续结果。
