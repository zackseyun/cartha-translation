  text: εἰ γὰρ ἃ κατέλυσα ταῦτα πάλιν οἰκοδομῶ, παραβάτην ἐμαυτὸν ⸀συνιστάνω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/018.yaml
  text: For if I rebuild the things I tore down[b][a], I prove myself to be a transgressor.
translation:
  language: zh_hans
  text: 因为我若把我所拆毁的那些重新建造起来，就显明自己是个违犯者。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “显明自己是”也可译作“证明自己是”。
    reason: lexical_alternative
  - marker: b
    text: “拆毁”也可译作“毁坏”或“拆除”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: 因为，我若
  rationale: “因为”保留γάρ承接并解释上文的作用，“若”保留εἰ的条件意味；调整为合乎现代汉语的语序。
- source_word: ἃ ... ταῦτα
  choice: 自己所……的
  rationale: 希腊文关系代词与指示代词相呼应，指向同一组事物；汉语用“所”字结构自然表达，而上下文和动词第一人称可明确其为“我”先前拆毁之物。
- source_word: κατέλυσα
  choice: 拆毁
  rationale: 与后面的“建造”构成鲜明的建筑意象，也保留“毁坏、拆除”的语义范围，避免直接译为较具解释性的“废除”。
- source_word: πάλιν οἰκοδομῶ
  choice: 重新建造
  rationale: “重新”对应πάλιν，“建造”对应οἰκοδομῶ，并保留与“拆毁”相对的比喻。
- source_word: παραβάτην
  choice: 违犯者
  rationale: 保留παραβάτης越过规范或诫命界线的道德—法律意味，同时不把对象明确限定为“律法”，因为原句此处没有重复νόμος。
- source_word: ἐμαυτὸν συνιστάνω
  choice: 显明自己是
  rationale: συνιστάνω在此表示使某种身份得到显示或证实；“显明”保留这一语义，又不像“证明”那样过度强调形式论证。
theological_decisions:
- issue: “所拆毁的”具体指什么
  choice: 正文不补出具体宾语，仅译作“自己所拆毁的”
  alternative: 补译为“律法”“律法的规条”或“靠律法称义的制度”
  rationale: 希腊原文只说“那些我拆毁的事物”，其具体所指须由上下文判断；不在正文中补足可避免替读者预先解决其神学指向。
- issue: “违犯者”是否明确为“违犯律法的人”
  choice: 保留较宽的“违犯者”
  alternative: 译作“违法者”或“违犯律法的人”
  rationale: παραβάτης具有违越规范的意味，但本节没有明说其宾语；较宽的表达保留保罗论证中的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“拆毁—重新建造”保留原文建筑比喻；“违犯者”略带正式色彩，适合本段道德与法律语境。脚注标记均置于正文相关陈述之后。
