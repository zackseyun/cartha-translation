id: GAL.2.17
reference: Galatians 2:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰ δὲ ζητοῦντες δικαιωθῆναι ἐν Χριστῷ εὑρέθημεν καὶ αὐτοὶ ἁμαρτωλοί, ἆρα Χριστὸς ἁμαρτίας διάκονος; μὴ γένοιτο·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/017.yaml
  text: But if[a], while seeking to be justified in Messiah, we ourselves also were found to be sinners, is Messiah then a servant of sin? May it never be!
translation:
  language: zh_hans
  text: 但如果我们在弥赛亚里寻求被称为义时，我们自己也被发现是罪人，难道弥赛亚是罪的仆役吗？绝对不是！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζητοῦντες
  choice: 寻求
  rationale: 保留现在分词所表达的伴随情形；汉语中与“如果我们……”连用自然简洁。
- source_word: δικαιωθῆναι
  choice: 被称为义
  rationale: 保留保罗用语的法庭性和被动语态，比单说“成为义人”更少消解其含义。
- source_word: ἐν Χριστῷ
  choice: 在弥赛亚里
  rationale: 保留ἐν的联合或领域表达，并将Χριστός作为称号译为“弥赛亚”。
- source_word: εὑρέθημεν
  choice: 发现自己……还是
  rationale: 以自然汉语传达被发现、显明为某种状态的意思；“还是”对应καί在此处的附加意味，但不指定是谁作出判断。
- source_word: καὶ αὐτοὶ ἁμαρτωλοί
  choice: 自己也还是罪人
  rationale: “自己”体现αὐτοί的强调，“也”保留καί，“罪人”直接保留谓语名词意义。
- source_word: ἁμαρτίας διάκονος
  choice: 为罪效力
  rationale: διάκονος在此表示服事者或促成者；“为罪效力”比“罪的执事”更符合现代汉语，同时保留令人震惊的反问。
- source_word: μὴ γένοιτο
  choice: 绝对不是！
  rationale: 以现代、强烈而庄重的汉语表达保罗坚决否定的惯用语气。
theological_decisions:
- issue: 本句是否暗示弥赛亚导致或助长罪
  choice: 难道弥赛亚是为罪效力的吗？
  alternative: 难道弥赛亚是罪的仆役吗？
  rationale: 保留原文作为待否定之推论的修辞张力，不把它改写成教义解释，也不把“罪”拟人化得过强。
- issue: εὑρέθημεν所指的认定方式
  choice: 却发现自己也还是罪人
  alternative: 我们自己也被证明是罪人
  rationale: 原文没有说明由谁、以何种方式发现；正文避免补入审判、证明或主观自觉等特定解释。
translation_notes:
  register: 采用现代标准普通话，语气庄重但易懂。“被称为义”保留保罗术语的法庭色彩；“在弥赛亚里”保留原文关系表达；结尾用“绝对不是”自然传达强烈驳斥。
