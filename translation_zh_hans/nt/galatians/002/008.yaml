revisions:
- from: 因为，那位借着彼得施行工作，使他作受割礼之人的使徒[a]，也借着我施行工作，使我作外族人的使徒[b]。
  to: 因为那位借着彼得作工，使他向受割礼的人[a]作使徒，也借着我作工，使我向外邦人[b]作使徒。
  rationale: 修订以“作工”对应并重复ἐνεργέω，避免将其限定为“赐能力”或“有效工作”。“借着彼得／借着我”保留工具性与格的理解；“使他／使我向……作使徒”以自然汉语表达εἰς ἀποστολὴν所指向的使徒使命，并在后半句保留原文的平行意义。脚注锚点分别紧贴“受割礼的人”和“外邦人”，与所说明的原文词组一致。
