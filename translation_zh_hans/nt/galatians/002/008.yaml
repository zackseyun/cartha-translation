  naturalness: “借着……施行工作，使他作……”重复而生硬。“借着……作工，使他向……作使徒”在现代庄重书面语中更自然，同时保留原文前后对称的动词重复。
  terminology: 以“外邦人”对应此处与“受割礼的人”相对的τὰ ἔθνη，是现代汉语圣经及一般宗教语境中清楚、稳定的术语；“外族人”容易被理解为泛指外国族群。“使徒”保留为核心术语。
  issues:
  - severity: medium
    issue: “施行工作”搭配不自然，且全句结构显得累赘。
    rationale: 现代汉语通常说“作工”或“工作”，不说“施行工作”。在此以“作工”译两个同源动词，既自然又保留重复。
  - severity: low
    issue: 脚注a的“直译”不够准确。
    rationale: “使他承担”是对整句关系的解释性补足，并非短语τῆς περιτομῆς的直译。脚注宜直接说明该短语为“受割礼者的使徒职分”。
  - severity: low
    issue: “外族人”不如“外邦人”准确稳定。
    rationale: 在保罗书信中，τὰ ἔθνη与“割礼”相对，特指非犹太人；“外邦人”能清楚表达此语境。
