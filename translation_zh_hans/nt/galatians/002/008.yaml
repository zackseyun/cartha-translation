  text: ὁ γὰρ ἐνεργήσας Πέτρῳ εἰς ἀποστολὴν τῆς περιτομῆς ἐνήργησεν καὶ ἐμοὶ εἰς τὰ ἔθνη,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/008.yaml
  text: For the one who worked through Peter for apostleship to the circumcised also worked through me for the Gentiles[b][a],
translation:
  language: zh_hans
  text: 因为那位借着彼得作工，使他向受割礼的人[a]作使徒，也借着我作工，使我向外邦人[b]作使徒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“为受割礼者的使徒职分。”
    reason: lexical_alternative
  - marker: b
    text: 也可译作“列国的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεργήσας / ἐνήργησεν
  choice: 施行工作
  rationale: 用同一表达译出同源动词的重复，保留彼得与保罗两部分的平行结构；不译成“赐能力”或“使大有功效”，以免过度限定神如何行动。
- source_word: Πέτρῳ / ἐμοὶ
  choice: 借着彼得 / 借着我
  rationale: 按上下文将与格理解为工具用法，表示那一位借着彼得和保罗在各自的使徒职分中工作；“在……里面”仍是语法上可考虑的译法，但正文采用更符合事工语境的表达。
- source_word: εἰς ἀποστολὴν
  choice: 使他作……的使徒 / 使我作……的使徒
  rationale: 以自然现代汉语表达工作所指向的使徒职分。后半句依平行结构补出“使我作……的使徒”，没有改变希腊文省略结构所表达的意义。
- source_word: τῆς περιτομῆς
  choice: 受割礼之人
  rationale: 这里的“割礼”以转喻方式指受割礼的犹太人；译为“受割礼之人”既保留原文意象，也清楚呈现与外族人的对比。
- source_word: τὰ ἔθνη
  choice: 外族人
  rationale: 在本段与“受割礼之人”相对，指非犹太人；“外族人”比直译“列国”更准确地传达此处所指，同时避免使用较陈旧的称谓。
theological_decisions:
- issue: 是否把行动者明说为“神”
  choice: 那位
  alternative: 神
  rationale: 希腊文使用带冠词的分词，直译为“那位施行工作的”，并未在本节明说“神”。正文保留“那位”，让读者按上下文辨认其所指，不把隐含主语直接改成明说的名词。
- issue: 如何理解彼得和保罗所用与格
  choice: 借着彼得／借着我
  alternative: 在彼得里面／在我里面
  rationale: 上下文着重两人的使徒使命，工具性理解较为顺畅；但不把动词扩译为某种特定的内在恩赐或外在神迹，以免消除原文表达的宽度。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“施行工作”略带正式色彩，用来保留原文同一动词在前后两部分的刻意重复；“那位”保留原文未明说行动者名称的表达。
