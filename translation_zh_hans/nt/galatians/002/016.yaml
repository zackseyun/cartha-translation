id: GAL.2.16
reference: Galatians 2:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰδότες ⸀δὲ ὅτι οὐ δικαιοῦται ἄνθρωπος ἐξ ἔργων νόμου ἐὰν μὴ διὰ πίστεως ⸂Ἰησοῦ Χριστοῦ⸃, καὶ ἡμεῖς εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν, ἵνα δικαιωθῶμεν ἐκ πίστεως Χριστοῦ καὶ οὐκ ἐξ ἔργων νόμου, ⸂ὅτι ἐξ ἔργων νόμου οὐ δικαιωθήσεται⸃ πᾶσα σάρξ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/016.yaml
  text: Yet knowing that a person is not justified by works of the law except through faith in Jesus the Messiah[a], even we have believed in Messiah Jesus, so that we might be justified by faith in Messiah and not by works of the law[c][b], because by works of the law no flesh will be justified.
translation:
  language: zh_hans
  text: 然而，我们知道，人称义不是靠遵行律法，而是借着信耶稣基督[a]；我们也信了基督耶稣，为要因信基督[b]称义，不靠遵行律法称义，因为没有一个有血肉的人能靠遵行律法称义[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“借着耶稣基督的信实。”
    reason: alternative_reading
  - marker: b
    text: 或译：“因基督的信实。”
    reason: alternative_reading
  - marker: c
    text: 直译：“凡有血肉的，都不能靠遵行律法称义。”
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιοῦται / δικαιωθῶμεν / δικαιωθήσεται
  choice: 称义
  rationale: 以一致的传统司法性术语表达三个词形，保留保罗用语中“被判定为义”的法庭意味，同时避免扩写为解释性释义。
- source_word: ἄνθρωπος
  choice: 人
  rationale: 这里是泛指单数；现代汉语用“人”自然表达其代表性意义，无须加入性别限定。
- source_word: ἐξ ἔργων νόμου
  choice: 靠遵行律法
  rationale: ἔργα νόμου直译为“律法的行为”在现代汉语中较生硬且可能含混；“遵行律法”自然表达由律法所要求的行为，同时不泛化为一切善行。
- source_word: διὰ πίστεως Ἰησοῦ Χριστοῦ
  choice: 借着信耶稣基督
  rationale: 正文采用目的属格理解，即对耶稣基督的信；属格也可作主词性理解，故在脚注保留“耶稣基督的信实”。
- source_word: εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν
  choice: 我们也信了基督耶稣
  rationale: πιστεύω加εἰς在汉语中自然译作“信”；“信了”体现不定过去时所指的信靠行动。
- source_word: ἐκ πίστεως Χριστοῦ
  choice: 因信基督
  rationale: 与前一πίστις Χριστοῦ结构保持一致，在正文采用“信基督”，并以脚注保留“基督的信实”。
- source_word: Χριστοῦ / Χριστόν
  choice: 基督
  rationale: “基督”是现代中文圣经语域中Χριστός的通行称号，庄重而易懂，并保留其弥赛亚称号的传统含义。
- source_word: πᾶσα σάρξ
  choice: 没有一个有血肉的人
  rationale: 既保留σάρξ的“血肉”意象及其经文回声，也用“人”明确其在此泛指全人类；希腊语的否定由前置οὐ支配。
- source_word: εἰδότες δὲ
  choice: 然而，我们知道
  rationale: 用“然而”表达δέ在语境中的轻微转折，并将希腊语分词结构转换为自然的汉语陈述。
- source_word: ἐὰν μὴ
  choice: 而是借着
  rationale: 此处结构在语义上排除靠律法行为称义，并转向信；“不是……而是……”在现代汉语中清楚自然，同时不把争议性的πίστις属格解释藏起来。
theological_decisions:
- issue: πίστις Χριστοῦ / πίστεως Ἰησοῦ Χριστοῦ的属格意义
  choice: 正文作目的属格：“信耶稣基督”／“信基督”
  alternative: 主词属格：“耶稣基督的信实”／“基督的信实”
  rationale: 这两处结构在语法和保罗神学研究中确有争议。正文采用汉语中较通行的目的属格理解，但用脚注明确保留主词属格的可能性。
- issue: “称义”的含义
  choice: 保留“称义”这一司法性神学术语
  alternative: 被判为义／被算为义
  rationale: δικαιόω在本节重复三次，保留同一译词可呈现论证的连贯性，也避免正文预先限定为某一种解释性措辞。
- issue: ἐὰν μὴ的逻辑关系
  choice: “不是……而是……”
  alternative: “除非借着……”
  rationale: 在此将短语理解为与“靠遵行律法”相对的排除性转折，而不是暗示信基督属于“律法的行为”；这种表达也与随后“信了基督耶稣”的说明相呼应。
- issue: πᾶσα σάρξ的经文意象
  choice: 没有一个有血肉的人
  alternative: 凡有血气的／任何人
  rationale: 该措辞可能呼应诗篇143:2七十士译本。正文保留“血肉”意象而又使现代读者明确所指是人类。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。以“称义”保留保罗论述的核心术语；“靠遵行律法”比“出于律法的行为”更自然，同时严格限于律法所要求的行为。句式保留原文三次“称义”的修辞重复。所有脚注标记均置于对应争议点之后。
