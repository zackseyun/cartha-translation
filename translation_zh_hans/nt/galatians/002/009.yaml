source:
  edition: SBLGNT
  text: καὶ γνόντες τὴν χάριν τὴν δοθεῖσάν μοι, Ἰάκωβος καὶ Κηφᾶς καὶ Ἰωάννης, οἱ δοκοῦντες στῦλοι εἶναι, δεξιὰς ἔδωκαν ἐμοὶ καὶ Βαρναβᾷ κοινωνίας, ἵνα ⸀ἡμεῖς εἰς τὰ ἔθνη, αὐτοὶ δὲ εἰς τὴν περιτομήν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/009.yaml
  text: and recognizing the grace that had been given to me[a], James and Cephas and John, who were regarded as pillars, gave to Barnabas and me the right hands of fellowship[c][b], so that we would go to the Gentiles and they to the circumcised.
translation:
  language: zh_hans
  text: 雅各、矶法和约翰，就是那些被视为柱石的人，得知所赐给我的恩典后，便与我和巴拿巴握右手，表示彼此同工[a]，好让我们往外邦人[b]那里去，而他们往受割礼的人[c]那里去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“把相交的右手给了我和巴拿巴”；这是表示认可、联合与共同参与的举动。
    reason: 说明希腊语习语δεξιὰς κοινωνίας，并保留κοινωνία的语义范围。
  - marker: b
    text: 或译“列国”；这里指非犹太人。
    reason: 说明ἔθνη既可指列国，也可在此语境中指外邦人。
  - marker: c
    text: 直译“割礼”，这里指犹太人。
    reason: 说明περιτομήν的字面形式及其转喻用法。
lexical_decisions:
- source_word: γνόντες
  choice: 看出
  rationale: 该不定过去时分词说明随后行动的依据；“看出”自然表达他们对保罗所得恩典的辨认与认可。
- source_word: χάριν τὴν δοθεῖσάν μοι
  choice: 所赐给我的恩典
  rationale: 保留“恩典”的广义神学内涵，不把它收窄为职分或使命；被动表达也保留赐予者未明说的特点。
- source_word: Κηφᾶς
  choice: 矶法
  rationale: 原文使用Κηφᾶς而非Πέτρος，因此采用其通行中文音译，不以“彼得”替换。
- source_word: οἱ δοκοῦντες στῦλοι εἶναι
  choice: 那些被视为柱石的人
  rationale: 表达他们公认的地位，同时避免把δοκοῦντες译得带有不必要的讥讽或怀疑色彩。
- source_word: δεξιὰς ... κοινωνίας
  choice: 伸出右手，表示彼此同工
  rationale: δεξιὰς为复数，但中文以各人“伸出右手”自然体现复数场景；κοινωνία在此指借握手确认的共同参与和使命合作，“彼此同工”比单纯“团契”更贴合语境。
- source_word: ἔθνη
  choice: 外族人
  rationale: 这里与“受割礼的人”相对，指非犹太人；“外族人”保留族群对照，也比地缘意义的“列国”准确。
- source_word: περιτομήν
  choice: 受割礼的人
  rationale: 原文以“割礼”转喻犹太人；译出其所指的人群，同时由脚注说明字面形式。
theological_decisions:
- issue: χάρις是否具体化为使徒职分或宣教使命
  choice: 保留为“恩典”
  alternative: 所赐的使命／使徒职分
  rationale: 上下文虽涉及保罗的使命，但本节本身使用宽广的χάρις；不应在正文中把其含义限缩。
- issue: κοινωνία在握手语境中的含义
  choice: 表示彼此同工
  alternative: 表示彼此相交／团契
  rationale: 这里的行动确认双方共同参与福音工作及不同的工作对象；“同工”能传达合作关系，但不将其解释成彼此从属。
- issue: “我们……他们……”是否表示两种不同的福音
  choice: 按原文保留不同工作对象的并列
  alternative: 明确补写为同一福音下的分工
  rationale: 经文说明双方前往不同人群，并未在本句明说两种福音或详细界定分工性质，因此不作额外教义化补充。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“柱石”保留圣经意象；破折号帮助读者辨明同位说明。“好让”自然表达ἵνα所引出的安排或目的，同时不把双方关系解释为命令与服从。所有脚注标记均置于相应正文位置。
