  yaml_path: translation/nt/galatians/002/003.yaml
  text: But not even Titus[a], who was with me, though he was a Greek[b], was compelled to be circumcised.
translation:
  language: zh_hans
  text: 可是，连与我在一起的提多，虽是希腊人[a]，也没有被迫受割礼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“身为希腊人”。这里“希腊人”在当时语境中意味着提多没有受割礼；原文具体说的是“希腊人”，并非仅泛指“外邦人”。
    reason: 句法替代与文化说明
lexical_decisions:
- source_word: ἀλλ’
  choice: 可是
  rationale: 承接上文形成转折；“可是”简洁自然，适合现代汉语叙述。
- source_word: οὐδὲ
  choice: 连……也没有
  rationale: 保留强调性否定，突出连提多这样的个案也未被强迫。
- source_word: Τίτος
  choice: 提多
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: ὁ σὺν ἐμοί
  choice: 同我一起的
  rationale: 直接表达该限定性短语，说明提多当时与保罗同行，不额外引申为同工或伙伴。
- source_word: Ἕλλην ὤν
  choice: 虽然是希腊人
  rationale: 按语境将分词结构理解为让步背景，同时保留原文明确的“希腊人”，不泛化为“外邦人”。
- source_word: ἠναγκάσθη
  choice: 被迫
  rationale: 准确保留被动语态及外来强制、压力的含义。
- source_word: περιτμηθῆναι
  choice: 受割礼
  rationale: 采用清楚、庄重且通行的现代中文表达。
theological_decisions:
- issue: Ἕλλην应译作具体族群文化称谓，还是解释性的宗教身份统称
  choice: 希腊人
  alternative: 外邦人
  rationale: 原文具体说“希腊人”。在语境中这暗示提多未受割礼并属于外邦背景，但正文不应以较宽泛的解释性称谓取代原词。
- issue: Ἕλλην ὤν的分词关系
  choice: 虽然是希腊人
  alternative: 他是希腊人／身为希腊人
  rationale: 上下文支持让步关系：尽管提多是希腊人，他仍未被迫受割礼；脚注同时提示较少解释性的直陈表达，以保留句法可能性。
translation_notes:
  register: 采用现代、自然而庄重的书面汉语。“连……也没有”体现οὐδὲ的强调；保留“希腊人”这一具体称谓，并用脚注交代其文化含义及分词结构的另一种表达。
