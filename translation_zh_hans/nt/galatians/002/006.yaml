  text: ἀπὸ δὲ τῶν δοκούντων εἶναί τι— ὁποῖοί ποτε ἦσαν οὐδέν μοι διαφέρει· πρόσωπον ⸀θεὸς ἀνθρώπου οὐ λαμβάνει— ἐμοὶ γὰρ οἱ δοκοῦντες οὐδὲν προσανέθεντο,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/006.yaml
  text: But from those who were reputed to be something—whatever they once were makes no difference to me[a]; God shows no partiality—to me, indeed[c][b], those of reputation added nothing.
translation:
  language: zh_hans
  text: 至于那些被认为有地位的人——他们从前是什么样的人，对我并不重要；上帝不以貌取人[a]——因为那些被认为有地位的人并没有给我增添什么[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译是“上帝不接受人的脸面”，这是“不偏待人、不徇情面”的惯用说法。
    reason: cultural_note
  - marker: b
    text: 也可译作“并没有再对我提出什么要求”或“并没有给我补充什么”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν δοκούντων εἶναί τι / οἱ δοκοῦντες
  choice: 那些被认为有地位的人 / 那些有名望的人
  rationale: δοκέω在这里涉及公认的地位或声望。这样的译法保留保罗略带距离的语气，却不把它强化为对这些人的轻蔑。
- source_word: ὁποῖοί ποτε ἦσαν
  choice: 他们从前是什么样的人
  rationale: ποτε可自然表达为“从前”；整句强调他们以往的身份或地位不影响保罗的判断，而不必设定更强烈的今昔对比。
- source_word: οὐδέν μοι διαφέρει
  choice: 对我并不重要
  rationale: 自然传达该短语“对我没有影响、无关紧要”的意思，也明确保留μοι所指的“对我”。
- source_word: πρόσωπον θεὸς ἀνθρώπου οὐ λαμβάνει
  choice: 上帝不以貌取人
  rationale: 采用现代汉语中成熟而庄重的对应惯用语，准确表达“不偏待人”，同时保留原文“脸面”意象的痕迹。
- source_word: ἐμοὶ γὰρ
  choice: （由上下文中的“给我”体现）
  rationale: ἐμοί由“给我”明确表达；γάρ在破折号插入语之后主要承接并说明前述判断，汉语无需机械译出连接词。
- source_word: οὐδὲν προσανέθεντο
  choice: 并没有给我增添什么
  rationale: 保留προσανατίθημι“另外加上”的开放性，不预先限定为增加福音内容、赋予地位，或加添要求。
theological_decisions:
- issue: 保罗是在否定耶路撒冷领袖本身，还是仅否定其地位对福音真理的决定作用
  choice: 保留略带距离但克制的措辞，强调他们的声望没有决定保罗的信息或使命。
  alternative: 可译为“那些看似了不起的人”，语气更尖锐；也可译为“那些公认的领袖”，语气更肯定。
  rationale: 原文既承认这些人的公认地位，又以δοκούντων保持修辞距离；不应把它变成对其领导身份的全面否定，也不应抹去保罗的独立立场。
- issue: οὐδὲν προσανέθεντο具体指没有增添内容，还是没有加添要求
  choice: 正文译为“没有给我增添什么”，保留所指对象的含混。
  alternative: “没有再对我提出什么要求”或“没有给我的信息补充什么”。
  rationale: 动词在语境中可涉及补充、贡献或附加要求；原句并未明确宾语，因此不在正文中替保罗补足。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“有地位／有名望”兼顾可读性与保罗略带距离的修辞；破折号保留原句插入说明的结构。所有脚注标记均已置于正文对应位置。
