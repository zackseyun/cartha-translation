  text: Ἔπειτα διὰ δεκατεσσάρων ἐτῶν πάλιν ἀνέβην εἰς Ἱεροσόλυμα μετὰ Βαρναβᾶ συμπαραλαβὼν καὶ Τίτον·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/001.yaml
  text: Then after fourteen years I went up again to Jerusalem with Barnabas, also taking Titus along.
translation:
  language: zh_hans
  text: 后来，过了十四年，我又上耶路撒冷去，和巴拿巴同行，也带着提多。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔπειτα
  choice: 后来
  rationale: 承接保罗前文的叙事并标明后续次序；现代汉语中自然、庄重。
- source_word: διὰ δεκατεσσάρων ἐτῶν
  choice: 过了十四年
  rationale: διά加属格在此表示一段时间过去之后；译法符合现代汉语的时间表达，同时不擅自确定这十四年的起算点。
- source_word: πάλιν
  choice: 又
  rationale: 准确表达行程的再次发生，并与“上耶路撒冷去”自然搭配。
- source_word: ἀνέβην
  choice: 上……去
  rationale: 保留前往耶路撒冷常用的“上去”表达，既反映地理方向，也符合圣经叙事语感。
- source_word: εἰς Ἱεροσόλυμα
  choice: 耶路撒冷
  rationale: 作为“上……去”的目的地处理，采用通行中文专名。
- source_word: μετὰ Βαρναβᾶ
  choice: 和巴拿巴同行
  rationale: 清楚表达陪同关系；补出“同行”使中文句法流畅，不改变原意。
- source_word: συμπαραλαβὼν καὶ Τίτον
  choice: 也带着提多
  rationale: 分词表示与主动作同时发生的伴随行动；“也”体现καί的附加意味，即除巴拿巴外还带了提多。
theological_decisions:
- issue: 十四年的起算点
  choice: 不在正文中说明从哪一事件起算
  alternative: 明确译成“十四年后”，使读者可能理解为从紧邻前述事件起算
  rationale: 原文只说经过十四年，并未在本节明示起算事件；译文保留这一叙事上的开放性。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“后来，过了十四年”兼顾篇章衔接与时间间隔；“又上耶路撒冷去”保留原文行程措辞；整节不添加原文未明说的历史或神学辨认。
