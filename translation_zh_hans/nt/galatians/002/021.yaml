  text: οὐκ ἀθετῶ τὴν χάριν τοῦ θεοῦ· εἰ γὰρ διὰ νόμου δικαιοσύνη, ἄρα Χριστὸς δωρεὰν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/021.yaml
  text: I do not nullify the grace of God[a], for if righteousness comes through the law[c][b], then Messiah died for nothing.
translation:
  language: zh_hans
  text: 我不废掉上帝的恩典；因为如果义是借着律法而来的，那么弥赛亚就是白白死了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “白白”也可译作“徒然”或“无缘无故”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετῶ
  choice: 废掉
  rationale: 表达使某事失效、作废之意，贴合保罗的论证；比单纯的“拒绝”更准确，也符合现代中文表达。
- source_word: χάριν
  choice: 恩典
  rationale: “恩典”是保罗书信中 χάρις 的通行译法，既保留神学内涵，也自然易懂。
- source_word: διὰ νόμου
  choice: 借着律法而来的
  rationale: 原文省略系动词；补出“而来的”使中文完整自然，同时保留 διά 加属格所表达的途径意义。
- source_word: δικαιοσύνη
  choice: 义
  rationale: “义”简洁保留 δικαιοσύνη 在保罗语境中的宽度，可涵盖正直、公义以及在上帝面前被判为义，不把含义限定为某一种系统解释。
- source_word: Χριστὸς
  choice: 弥赛亚
  rationale: Χριστός 在此具有称号功能；“弥赛亚”直接传达“受膏者”的身份，而不将其仅作为姓名式标签。
- source_word: δωρεὰν
  choice: 白白
  rationale: 此处指毫无必要、徒然无益；“白白死了”在现代中文中有“毫无意义地死去”的自然语感，并保留原词可能涉及“无故”的语义范围。
theological_decisions:
- issue: δικαιοσύνη 与律法在保罗论证中的关系
  choice: 译为“如果义是借着律法而来的”，陈明假设而不补入“称义”“获得救恩”等解释性措辞。
  alternative: 可译为“如果公义是借着律法而来的”或“如果人能借着律法被称为义”。
  rationale: 原文 δικαιοσύνη 没有明说“人被称义”，宜保留其概念宽度；上下文虽关乎人在上帝面前为义，但不应在本节中把隐含论点扩写成明确教义公式。
- issue: δωρεὰν 对弥赛亚之死的含义
  choice: 译为“白白死了”，表达在前述假设成立时，其死便成为无必要、无效益之事。
  alternative: “徒然死了”或“无缘无故死了”。
  rationale: δωρεάν 可表达“无缘无故”或“徒然”；本段论证侧重其死将变得毫无必要，但原词的张力值得以脚注保留。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“我不废掉”保留第一人称论辩力度；分号和“因为……那么……”呈现原文紧密的因果与反事实推论。脚注标记置于正文相关句末。
