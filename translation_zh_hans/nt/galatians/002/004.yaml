id: GAL.2.4
reference: Galatians 2:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: διὰ δὲ τοὺς παρεισάκτους ψευδαδέλφους, οἵτινες παρεισῆλθον κατασκοπῆσαι τὴν ἐλευθερίαν ἡμῶν ἣν ἔχομεν ἐν Χριστῷ Ἰησοῦ, ἵνα ἡμᾶς ⸀καταδουλώσουσιν—
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/004.yaml
  text: But because of the false brothers secretly brought in[a], who slipped in to spy out our freedom that we have in Messiah Jesus[b], so that they might enslave us—
translation:
  language: zh_hans
  text: 可是，由于那些被暗中带进来的假弟兄[a]——他们潜入，是要窥探我们在弥赛亚耶稣[b]里所享有的自由，为要奴役我们——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “假弟兄”保留了保罗所用的家人称谓；这里指那些以信徒同伴身份出现的人。
    reason: cultural_note
  - marker: b
    text: 或译“基督耶稣”。
    reason: alternative_reading
lexical_decisions:
- source_word: παρεισάκτους
  choice: 被暗中带进来的
  rationale: 保留该词所表达的外来者被秘密引入之意，并与后面的 παρεισῆλθον（“潜入”）有所区别。
- source_word: ψευδαδέλφους
  choice: 假弟兄
  rationale: 保留保罗的家人称谓和尖锐的论战语气；这里指自称或被视为信徒同伴的人，并非泛指“不真实的信徒”。
- source_word: παρεισῆλθον
  choice: 潜入
  rationale: 自然、简洁地传达秘密混入的含义，也避免与前面的“被暗中带进来”重复。
- source_word: κατασκοπῆσαι
  choice: 窥探
  rationale: 表达带有敌意、秘密侦察的意味，比一般的“观察”更贴近原文。
- source_word: ἐλευθερίαν
  choice: 自由
  rationale: 是现代汉语中自然清楚的对应词，并保留该词在本段中的神学和社会含义。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: 在弥赛亚耶稣里
  rationale: “弥赛亚”显明 Χριστός 的称号意义，“在……里”则保留保罗原有的联合性表达，不将其解释性改写。
- source_word: καταδουλώσουσιν
  choice: 奴役
  rationale: 直接表达使人沦为奴隶、受辖制的强烈含义。
- source_word: ἵνα ... καταδουλώσουσιν
  choice: 好奴役我们
  rationale: 用自然汉语表达目的关系；原文在 ἵνα 后用了将来直陈式，但语境仍明显表示这些人的企图。
theological_decisions:
- issue: Χριστῷ 在此应译作称号还是近似专名
  choice: 弥赛亚耶稣
  alternative: 基督耶稣
  rationale: 此处 Χριστός 的称号意义仍可清楚表达，因此正文译作“弥赛亚”；脚注保留华人教会更熟悉的传统译法“基督”。
- issue: ψευδαδέλφους 的群体身份是否应在正文中判定
  choice: 假弟兄
  alternative: 假信徒
  rationale: 保留原文的亲属称谓及其张力，不在正文中进一步断定这些人的主观信仰状态；脚注只说明这一称呼的语用背景。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。本节在希腊文中是承接上下文的未完句，故保留开头的因果结构和结尾破折号，不擅自补出主句。两个近义词分别译作“被暗中带进来”和“潜入”，以呈现原文的重复与细微差别。
