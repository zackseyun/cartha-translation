  text: We are Jews by birth and not sinners from among the Gentiles[b][a],
translation:
  language: zh_hans
  text: 我们生来是犹太人，而不是外邦人中的罪人[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不是外邦罪人。”
    reason: lexical_alternative
  - marker: b
    text: “生来”直译为“按本性”，这里指天然的族裔出身。
    reason: cultural_note
lexical_decisions:
- source_word: Ἡμεῖς
  choice: 我们
  rationale: 保留明说的代词，传达轻微的强调，同时符合现代汉语表达。
- source_word: φύσει
  choice: 生来
  rationale: 此处指天然的族裔出身，而非内在的道德本性；“生来”简明自然。
- source_word: Ἰουδαῖοι
  choice: 犹太人
  rationale: 准确保留与外族人的族裔对照，也是现代汉语中的通行称呼。
- source_word: ἐξ ἐθνῶν
  choice: 外族中的
  rationale: 既保留ἐξ“出自、来自……之中”的结构，又在犹太人与其他民族的对照中自然表达ἔθνη。
- source_word: ἁμαρτωλοί
  choice: 罪人
  rationale: 保留该词直接而带张力的称谓，不将其弱化为“有罪的人”或扩展为解释性表述。
theological_decisions:
- issue: 本句是否宣称犹太人在道德本质上优于外族人
  choice: 照原文保留简短直接的族群对照，不在本节中加入缓和或限定语。
  alternative: 译作“并不像外族人那样被算为罪人”。
  rationale: 原文直接说“不是外族中的罪人”，但上下文随即说明犹太人与外族人同样需要因信称义。翻译本节不应提前代入后文解释，也不应把这里扩展成犹太人天生义的教义主张。
- issue: ἐξ ἐθνῶν ἁμαρτωλοί的句法关系
  choice: “外族中的罪人”——将ἐξ ἐθνῶν理解为说明这些“罪人”来自外族人之中。
  alternative: “外族罪人”——把整个短语压缩成一个复合称谓。
  rationale: 两种理解意义接近；正文保留介词结构所表达的“来自……之中”，脚注列出更凝练的可能译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“外族”比“列国”更清楚地呈现此处犹太人与非犹太人的族群对照；保留“罪人”的尖锐措辞及其神学张力。
