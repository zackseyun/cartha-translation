id: GAL.2.7
reference: Galatians 2:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀλλὰ τοὐναντίον ἰδόντες ὅτι πεπίστευμαι τὸ εὐαγγέλιον τῆς ἀκροβυστίας καθὼς Πέτρος τῆς περιτομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/007.yaml
  text: But on the contrary[a], when they saw that I had been entrusted with the gospel for the uncircumcised, just as Peter had been for the circumcised,
translation:
  language: zh_hans
  text: 恰恰相反，他们看出我已经受托把福音传给未受割礼的人，正如彼得受托把福音传给受割礼的人一样。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“未受割礼者的福音……受割礼者的福音”；这里指受托把福音传给这两个群体。
    reason: 说明原文属格结构及正文按语境所作的表达。
lexical_decisions:
- source_word: ἀλλὰ τοὐναντίον
  choice: 恰恰相反
  rationale: 两个词共同构成强烈的转折语气；合译为“恰恰相反”自然地保留了这种强调。
- source_word: ἰδόντες
  choice: 他们看出
  rationale: 不定过去时分词交代主句的背景情形；“看出”在现代汉语中可表达经过观察而认识到。
- source_word: πεπίστευμαι
  choice: 我已经受托
  rationale: πιστεύω 的完成时被动态在此表示某项使命已经托付给保罗，其结果仍然有效；“已经受托”兼顾完成体意味和委任含义。
- source_word: τὸ εὐαγγέλιον
  choice: 福音
  rationale: “福音”是现代汉语基督教语境中通行且准确的对应词，并保留保罗书信中的神学分量。
- source_word: τῆς ἀκροβυστίας
  choice: 传给未受割礼的人
  rationale: 属格短语按语境指明福音使命所面向的群体；此译比直译“未受割礼的福音”清楚，同时不直接改写为较宽泛的“外族人”。
- source_word: καθὼς
  choice: 正如……一样
  rationale: 清楚表达保罗与彼得所受托付之间的对应关系。
- source_word: Πέτρος
  choice: 彼得
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: τῆς περιτομῆς
  choice: 传给受割礼的人
  rationale: 与前句形成对称，并保留希腊文以割礼身份称呼群体的表达，没有直接释为“犹太人”。
- source_word: '[ellipsis after Πέτρος τῆς περιτομῆς]'
  choice: 彼得受托把福音传给
  rationale: 希腊文省略了可由前句补出的谓语和宾语；中文为表达完整、自然，按上下文补明，但没有增添新概念。
theological_decisions:
- issue: ἀκροβυστία 与 περιτομή 应译作族群名称，还是保留割礼这一盟约性标志
  choice: 译为“未受割礼的人”和“受割礼的人”
  alternative: “外族人”和“犹太人”；或“未受割礼”与“受割礼”
  rationale: 原文以是否受割礼来指称两类群体。保留这一表达既呈现保罗本人的措辞，也避免把它完全化约为族群标签。
- issue: “未受割礼者的福音”与“给未受割礼者的福音”是否暗示两种不同的福音
  choice: 正文按使命对象译为“把福音传给未受割礼的人”，并以彼得的对应使命平行表达
  alternative: 直译为“未受割礼的福音……受割礼的福音”
  rationale: 上下文的重点是同一福音使命分别面向不同群体，而不是两种内容不同的福音；脚注保留原文属格形式，避免掩盖其字面结构。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“恰恰相反”保留强转折；两处“受托把福音传给……”形成清晰对称。正文不用“外族人／犹太人”，以保留原文以割礼身份界定群体的措辞。
