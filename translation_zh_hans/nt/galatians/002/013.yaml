  text: καὶ συνυπεκρίθησαν αὐτῷ ⸀καὶ οἱ λοιποὶ Ἰουδαῖοι, ὥστε καὶ Βαρναβᾶς συναπήχθη αὐτῶν τῇ ὑποκρίσει.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/013.yaml
  text: And the rest of the Jews also joined him in hypocrisy[b][a], so that even Barnabas was carried away by their hypocrisy.
translation:
  language: zh_hans
  text: 其余的犹太人也同他一起虚伪行事[a]，以至于连巴拿巴也被他们的虚伪行为裹挟了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也和他一同装假”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“也被他们的虚伪行为带走了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνυπεκρίθησαν
  choice: 跟着他装假
  rationale: 该复合动词表达与某人一同参与虚假、表里不一的行为；“跟着他装假”既保留共同参与的意思，也符合现代汉语表达。
- source_word: αὐτῷ
  choice: 跟着他
  rationale: 与格在这里表示与彼得一同参与其行为；“跟着他”自然传达这种关联。
- source_word: λοιποὶ
  choice: 其余的
  rationale: 指除彼得以外、同一群体中剩下的人；“其余的”清楚保留上下文中的对比。
- source_word: Ἰουδαῖοι
  choice: 犹太人
  rationale: 此处指具有犹太民族和宗教身份的人，并非仅指犹太地区的居民。
- source_word: συναπήχθη
  choice: 被……带偏了
  rationale: 保留被动意义，表现巴拿巴受群体行为影响而偏离正当做法；措辞自然，并含有道德方向上的偏离。
- source_word: ὑποκρίσει
  choice: 虚假行为
  rationale: 指前文所说表里不一、掩饰真实立场的行为；用“虚假行为”避免汉语中重复“装假”显得生硬，同时保留指责力度。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“跟着他装假”呈现共同参与的含义；“甚至连”突出巴拿巴也受到影响这一出人意料之处。两个脚注标记均置于正文相应位置。
