  naturalness: 原文整体通顺，但“带偏”较口语化，并容易使读者着重理解为受错误教导误导；“被他们的虚伪行为裹挟”更贴近受群体行为牵引的被动语气，也保持庄重现代的经文语体。
  terminology: 将ὑπόκρισις前后统一为“虚伪行事／虚伪行为”，保留保罗重复该概念的强调，避免以“虚假”泛化其“假装、表里不一”的含义。人名“巴拿巴”和“犹太人”均正确。
