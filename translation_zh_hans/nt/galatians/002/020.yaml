id: GAL.2.20
reference: Galatians 2:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ζῶ δὲ οὐκέτι ἐγώ, ζῇ δὲ ἐν ἐμοὶ Χριστός· ὃ δὲ νῦν ζῶ ἐν σαρκί, ἐν πίστει ζῶ τῇ τοῦ ⸂υἱοῦ τοῦ θεοῦ⸃ τοῦ ἀγαπήσαντός με καὶ παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/020.yaml
  text: And it is no longer I who live[a], but Messiah lives in me. And the life that I now live in the flesh, I live by faith in the Son of God, who loved me and gave himself for me.
translation:
  language: zh_hans
  text: 如今活着的不再是我，而是弥赛亚在我里面活着。我如今在肉身中所活的生命，是靠着对上帝的儿子的信而活[a]；他爱我，为我舍了自己。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“是靠着上帝的儿子所具有的信实而活。”
    reason: 原文“信”与“上帝的儿子”之间的属格关系有歧义：可指人对上帝的儿子的信，也可指上帝的儿子所具有或表现的信实。
lexical_decisions:
- source_word: Χριστός
  choice: 弥赛亚
  rationale: Χριστός在这里是称号；译为“弥赛亚”，既显明其受膏君王的身份，也符合现代汉语基督教语境中的通行表达。
- source_word: ζῶ δὲ οὐκέτι ἐγώ
  choice: 如今活着的不再是我
  rationale: 保留“不再是我……而是……”的强烈对照，同时按自然汉语调整语序；“如今”也顺势衔接本节后半句的νῦν。
- source_word: ὃ δὲ νῦν ζῶ ἐν σαρκί
  choice: 我如今在肉身中活着
  rationale: 希腊语中性关系代词结构带有省略意味，汉语可自然表达为现今所过的肉身生命；不将σάρξ解释为“罪性”，以保留其在此处指现世、有身体之生存状态的含义。
- source_word: πίστει
  choice: 信
  rationale: 采用πίστις在此结构中的常见译法“信”，不扩写为某种特定的心理状态；与后接属格的另一种可能关系在脚注中说明。
- source_word: τῇ τοῦ υἱοῦ τοῦ θεοῦ
  choice: 对上帝儿子的信
  rationale: 正文采用宾语属格理解，即信的对象是上帝的儿子；希腊语结构本身也可作主语属格理解，因此保留脚注。
- source_word: παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ
  choice: 为我舍了自己
  rationale: “舍了自己”自然传达主动交付自己、代人牺牲的意味，并保留ὑπὲρ ἐμοῦ“为我”的个人性。
theological_decisions:
- issue: πίστις与“上帝的儿子”这一属格短语之间的关系
  choice: 靠着对上帝儿子的信而活
  alternative: 靠着上帝儿子的信实而活
  rationale: 该属格既可理解为信心所指向的对象，也可理解为上帝儿子所具有或表现的信实。正文采用较直观的宾语属格读法，但以脚注保留主语属格读法，不消除原文真实存在的神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“肉身”保留保罗用语的语义范围，但不暗示这里必然指“罪性”；分号呈现后半句中生活方式与爱及自我交付之间的紧密关系。
