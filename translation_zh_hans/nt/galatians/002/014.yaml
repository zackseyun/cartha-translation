revisions:
- from: 但我看见他们行得不正，与福音的真理不相符[a]，就当着众人的面对矶法说：“你本是犹太人，若生活得像外族人，不像犹太人，怎么还强迫外族人按犹太人的方式生活[b]呢？”
  to: 但我看见他们的行事不合乎福音的真理[a]，就当着众人的面，对矶法说：“你身为犹太人，却过着外邦人的生活，不按犹太人的方式生活，怎么强迫外邦人按犹太人的方式生活呢？”
  rationale: 修正正文的句法问题，删去原文未明说的“还”，并采用中文圣经语境中更准确的“外邦人”。将“行得不正”调整为自然的“行事不合乎”，同时借脚注保留ὀρθοποδοῦσιν“正路而行”的行走隐喻。脚注b保留“犹太化”这一传统术语及其释义，正文则避免将其技术化。
