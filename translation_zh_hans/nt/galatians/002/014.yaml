  text: ἀλλ’ ὅτε εἶδον ὅτι οὐκ ὀρθοποδοῦσιν πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου, εἶπον τῷ ⸀Κηφᾷ ἔμπροσθεν πάντων· Εἰ σὺ Ἰουδαῖος ὑπάρχων ἐθνικῶς ⸂καὶ ⸀οὐκ Ἰουδαϊκῶς ζῇς⸃, ⸀πῶς τὰ ἔθνη ἀναγκάζεις Ἰουδαΐζειν;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/014.yaml
  text: But when I saw that they were not walking in step with the truth of the gospel[a], I said to Cephas before them all, “If you, though a Jew, live like a Gentile and not like a Jew[b], how do you compel the Gentiles to live like Jews?”
translation:
  language: zh_hans
  text: 但我看见他们的行事不合乎福音的真理[a]，就当着众人的面，对矶法说：“你身为犹太人，却过着外邦人的生活，不按犹太人的方式生活，怎么强迫外邦人按犹太人的方式生活呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“没有按着福音真理的正路而行。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀρθοποδοῦσιν
  choice: 行得不正
  rationale: 保留原词“直行”的行走隐喻，同时在现代汉语中自然表达行为偏离正道；否定形式与希腊文一致。
- source_word: πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου
  choice: 与福音的真理不相符
  rationale: πρός在此与ὀρθοποδοῦσιν连用，表示行为是否符合、对准福音的真理，而不只是朝向某个方向。
- source_word: Κηφᾷ
  choice: 矶法
  rationale: 按本处希腊文本保留Κηφᾶς的音译名，不以彼得替换。
- source_word: ἐθνικῶς
  choice: 生活得像外族人
  rationale: 该副词描述生活方式；“外族人”在本语境中指非犹太人，并与下文“犹太人”形成清楚对照。
- source_word: Ἰουδαϊκῶς
  choice: 不像犹太人
  rationale: 与ἐθνικῶς保持平行，表达按犹太人的生活方式行事。
- source_word: ἀναγκάζεις
  choice: 强迫
  rationale: 准确保留该动词的强制、施压意味，不弱化为普通劝说。
- source_word: Ἰουδαΐζειν
  choice: 按犹太人的方式生活
  rationale: 清楚表达采纳犹太人特有生活方式的含义，并避免把后来的神学论争术语倒入经文。
- source_word: πῶς
  choice: 怎么还
  rationale: 按“如何、怎么”直译，并以“还”自然凸显彼得自身做法与其施压行为之间的矛盾，不译成关于能力的“怎么能”。
theological_decisions:
- issue: 如何翻译Ἰουδαΐζειν而不引入后世宗派性的神学含义
  choice: 按犹太人的方式生活
  alternative: 犹太化；遵行犹太习俗
  rationale: 上下文直接涉及共同进食及犹太人与外族人的生活界线。所选译法保留社会和宗教层面的张力，却不把它限定为后来的某套神学体系。
- issue: 是否把矶法明确替换为彼得
  choice: 保留“矶法”
  alternative: 彼得
  rationale: 原文此处使用Κηφᾶς。保留原名忠实反映保罗的措辞，不在正文中替作者统一名字。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“行得不正”保留行走隐喻，“与福音的真理不相符”补明其关系；“外族人”避免“外邦人”可能带有的旧式或贬抑语感。正文中的[a]、[b]均与脚注对应。
