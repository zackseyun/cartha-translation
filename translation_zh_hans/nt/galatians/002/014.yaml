    issue: “当着众人的面对矶法说”句法不顺
    rationale: “面对”容易被读作“面对矶法”，而“众人的面”与“对矶法”之间应有停顿和介词结构。改为“当着众人的面，对矶法说”可清楚对应ἔμπροσθεν πάντων与τῷ Κηφᾷ。
  - severity: low
    issue: “怎么还强迫”增添了“还”
    rationale: πῶς表达“怎么／如何”的反诘；上下文当然形成不一致，但“还”是译文额外强化。删去可更贴近原文并保留反诘张力。
  - severity: low
    issue: “外族人”不如“外邦人”准确明确
    rationale: ἔθνη在此特指相对于犹太人的非犹太人；“外邦人”是中文圣经中稳定的对应术语，“外族人”则可能泛指任何其他族群。
