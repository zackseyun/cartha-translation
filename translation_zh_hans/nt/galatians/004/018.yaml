  text: καλὸν ⸀δὲ ζηλοῦσθαι ἐν καλῷ πάντοτε, καὶ μὴ μόνον ἐν τῷ παρεῖναί με πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/018.yaml
  text: But it is good to be sought eagerly for a good purpose at all times[b][a], and not only when I am present with you.
translation:
  language: zh_hans
  text: 不过，无论何时，出于良善的目的[b]受到热切关注[a]都是好的，而不只是我和你们同在的时候才是这样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“热心”或“表现热忱”。希腊语 ζηλοῦσθαι 可以有不同理解；这里按被动意义翻译，因为它与上一节别人热心对待加拉太人的说法相呼应。
    reason: alternative_reading
  - marker: b
    text: 直译：“在善的事上。”这句话也可理解为怀着良善的动机、以良善的方式，或为着良善的目的。
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: 都是好的
  rationale: 该形容词作谓语，评价后面的不定式行为；汉语用“都是好的”自然表达其无人称判断。
- source_word: δὲ
  choice: 不过
  rationale: 承接第17节并形成转折：受到热心关注本身并非坏事，关键在于目的是否良善。
- source_word: ζηλοῦσθαι
  choice: 受到热切关注
  rationale: 按现在时被动不定式理解，与第17节别人热心对待、拉拢加拉太人的语境呼应；“热切”保留 ζηλόω 的热忱意味，“关注”则避免“追求”在现代汉语中过强的恋爱色彩。
- source_word: ἐν καλῷ
  choice: 出于良善的目的
  rationale: 原文直译近于“在善的事上”；此处与前节不良动机对照，译为目的层面的表达更符合现代汉语，同时以脚注保留原文较宽的语义。
- source_word: πάντοτε
  choice: 无论何时
  rationale: 清楚地与下文“不该只在……的时候”构成时间上的对比。
- source_word: καὶ μὴ μόνον
  choice: 不该只
  rationale: 在汉语中补出“该”使劝诫和限制关系自然；“只”准确表达 μόνον。
- source_word: ἐν τῷ παρεῖναί με πρὸς ὑμᾶς
  choice: 在我和你们同在的时候
  rationale: ἐν 加带冠词不定式在此表示时间；该译法自然保留保罗在场这一含义。
theological_decisions:
- issue: ζηλοῦσθαι 的语态与隐含对象
  choice: 按被动理解：加拉太人受到别人热切关注
  alternative: 按中间或主动意义理解：热心行善／表现热忱
  rationale: 第17节以同一词根描述别人热心对待加拉太人，因此被动读法最贴合紧邻语境；但希腊语形式和句法容许“热心”的理解，故在脚注中保留。
- issue: ἐν καλῷ 所指的是动机、目的还是善事
  choice: 译作“出于良善的目的”
  alternative: “在善事上”或“以良善的方式”
  rationale: 上下文强调热心拉拢人的动机，目的说较能显明对照；不过原文“在善中／在好事上”较为宽泛，脚注不将其他可能排除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“受到热切关注”保留被动结构及热忱色彩，又尽量避免“被追求”可能产生的恋爱联想。分号突出普遍原则与保罗在场时这一限制之间的对照。
