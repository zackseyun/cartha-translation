  text: ἤθελον δὲ παρεῖναι πρὸς ὑμᾶς ἄρτι, καὶ ἀλλάξαι τὴν φωνήν μου, ὅτι ἀποροῦμαι ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/020.yaml
  text: But I wish I could be with you right now and change my tone[a], because I am perplexed about you.
translation:
  language: zh_hans
  text: 但我真希望现在能和你们在一起，换一种语气[a]，因为我对你们感到困惑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“换一种声音”。希腊文直译为“改变我的声音”，这里很可能是指改变说话的语气或方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤθελον
  choice: 我真希望……能
  rationale: 未完成时在这里可表达当前尚未实现的愿望；“真希望……能”在现代汉语中自然传达保罗迫切却无法立即实现的心愿。
- source_word: δὲ
  choice: 但
  rationale: 承接上文并带有轻微转折，“但”简洁地保留这一语篇作用。
- source_word: παρεῖναι πρὸς ὑμᾶς
  choice: 和你们在一起
  rationale: παρεῖναι意为亲身在场，πρὸς ὑμᾶς表示与受信者同在；此译符合现代汉语习惯。
- source_word: ἄρτι
  choice: 现在
  rationale: 表达当下和即时性；与“真希望……能”连用，已自然体现此刻就想在场的迫切感。
- source_word: ἀλλάξαι τὴν φωνήν μου
  choice: 换一种语气
  rationale: φωνή字面为“声音”，但在当前书信和牧养语境中，很可能指说话的语气或方式；正文采用自然含义，并以脚注保留字面可能。
- source_word: ὅτι
  choice: 因为
  rationale: 清楚引出保罗希望亲身到场并改变说话方式的原因。
- source_word: ἀποροῦμαι
  choice: 感到困惑
  rationale: 传达无所适从、疑惑不解的状态，同时避免把保罗具体困惑的内容说得过满。
- source_word: ἐν ὑμῖν
  choice: 对你们
  rationale: 这里表示困惑所关涉的对象；“对你们感到困惑”是自然且不过度解释的现代汉语。
theological_decisions:
- issue: φωνή在本节中的含义
  choice: 正文译为“语气”，理解为保罗希望改变对他们说话的口吻或方式。
  alternative: 按字面译为“声音”，指实际发声的声音。
  rationale: 上下文涉及保罗对加拉太人的责备、劝说和牧养忧虑，因此指说话方式更合语境；脚注仍保留字面译法，以免消除原文表达的空间。
translation_notes:
  register: 采用现代、庄重而口语自然的标准普通话。“我真希望现在能”表达迫切而尚未实现的愿望；“感到困惑”保留保罗的不解，没有扩展为“拿你们怎么办”等更强的解释性说法。
