base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/006.yaml
  text: And because you are sons[a], God sent the Spirit of his Son into our hearts, crying, “Abba[c][b], Father.”
translation:
  language: zh_hans
  text: 你们既然是儿子[b]，上帝就差遣他儿子的灵进入我们的心中[a]，并呼喊：“阿爸，父啊！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“你们的心”。
    reason: textual_variant
  - marker: b
    text: “儿子”保留了保罗在这里关于儿子名分和承受产业的用语；所指包括所有信徒，并非只有男性。
    reason: cultural_note
lexical_decisions:
- source_word: ὅτι δέ
  choice: 既然
  rationale: ὅτι在此说明上帝差遣圣灵的根据，δέ带轻微承接意味；中文用“既然”自然表达因由，并与上文衔接。
- source_word: ἐστε
  choice: 你们是
  rationale: 现在时直陈语气说明加拉太信徒当前的身份状态，并非“成为”。
- source_word: υἱοί
  choice: 儿子
  rationale: 保留原文阳性复数以及本段关于儿子名分和承受产业的法律—神学意象；此处涵盖所有信徒，并非仅指男性。
- source_word: ἐξαπέστειλεν
  choice: 差遣
  rationale: 表达上帝主动派出其儿子的灵；“差遣”在现代中文中庄重自然，也保留该动词的使命意味。
- source_word: τὸ πνεῦμα τοῦ υἱοῦ αὐτοῦ
  choice: 他儿子的灵
  rationale: 直接保留属格关系及其神学分量，不将其改释为别的称谓。
- source_word: εἰς τὰς καρδίας ἡμῶν
  choice: 进入我们的心
  rationale: 按所给SBLGNT正文翻译ἡμῶν为“我们的”，并保留“心”这一圣经人观用语。
- source_word: κρᾶζον
  choice: 呼喊着
  rationale: 现在分词与中性单数πνεῦμα一致，明确是灵在呼喊；“呼喊着”兼顾其持续性与强烈语气。
- source_word: Αββα
  choice: 阿爸
  rationale: 将嵌入希腊文的亚兰语称呼音译为中文惯用形式，保留原文的双语称呼及亲密、恳切色彩。
- source_word: ὁ πατήρ
  choice: 父啊
  rationale: 虽有定冠词，语义上是与“阿爸”同位的直接呼语；“父啊”符合现代中文呼语表达。
theological_decisions:
- issue: 儿子名分与承受产业语境中υἱοί的译法
  choice: 儿子
  alternative: 儿女；孩子
  rationale: 保罗在加拉太书3—4章的论证以儿子名分和继承人为核心。译作“儿子”保留古代法律继承语境，同时用脚注说明此身份包括所有信徒。
- issue: “心”之前物主代词的文本异文
  choice: 我们的心
  alternative: 你们的心
  rationale: 所给SBLGNT正文采用ἡμῶν（我们的），故正文从之；“你们的”是重要异文，列入脚注。
- issue: 呼喊“阿爸，父”的主体
  choice: 灵在呼喊
  alternative: 信徒借着灵呼喊
  rationale: κρᾶζον在语法上与τὸ πνεῦμα一致，因此本句明确以灵为呼喊主体；这并不排除信徒借着灵发出儿女的呼求，但不在译文中将两者混同。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“既然……就……”清楚呈现逻辑关系；“差遣”“儿子的灵”“心”保留经文术语和意象。“阿爸！父啊！”以中文标点呈现强烈的直接呼求，同时保留原文亚兰语称呼及其希腊语解释。脚注标记均置于相关词语之后，并按正文出现顺序排列。
