id: GAL.4.5
reference: Galatians 4:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἵνα τοὺς ὑπὸ νόμον ἐξαγοράσῃ, ἵνα τὴν υἱοθεσίαν ἀπολάβωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/005.yaml
  text: so that he might redeem those under the law[a], so that we might receive adoption as sons.
translation:
  language: zh_hans
  text: 为要赎出律法之下的人，好使我们领受儿子的名分。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被立为儿子”。希腊语指取得儿子的完整身份和继承权；这里所指包括所有信徒，无论男女。
    reason: 说明υἱοθεσία的字面性别形式、法律与继承背景，以及其包容性的所指。
lexical_decisions:
- source_word: ἵνα … ἵνα
  choice: 为要……好使……
  rationale: 两个ἵνα都表达目的；用“为要”和“好使”保留两重目的关系，同时避免现代汉语中生硬的机械重复。
- source_word: τοὺς ὑπὸ νόμον
  choice: 律法之下的人
  rationale: 保留原文“在律法之下”的空间隐喻；结合《加拉太书》语境，“律法”主要指摩西律法。
- source_word: ἐξαγοράσῃ
  choice: 赎出
  rationale: 既保留赎买含义，也突出从律法之下获得释放；比单用“救出”更贴近该词的商业与解放色彩。
- source_word: τὴν υἱοθεσίαν
  choice: 儿子的名分
  rationale: 该词指被立为儿子、取得完整子嗣身份；“儿子的名分”保留原文的男性子嗣及继承背景，而脚注说明其所指包括所有信徒。
- source_word: ἀπολάβωμεν
  choice: 我们领受
  rationale: 此处表示接受或获得所赐的身份；“领受”自然庄重，也不强加“重新取回”的意思。
theological_decisions:
- issue: υἱοθεσία的性别形式与包容范围
  choice: 正文译作“儿子的名分”
  alternative: 译作“收养”“成为儿女”或“子嗣身份”
  rationale: “儿子的名分”保留保罗时代与继承权相关的男性子嗣表达；脚注说明这一身份赐给所有信徒，避免误解为只包括男性。
- issue: “律法之下的人”的所指
  choice: 保留“律法之下”的措辞，不在正文限定为犹太人
  alternative: 译作“受摩西律法管辖的人”
  rationale: 上下文主要指处于摩西律法之下的人，但原句本身没有明说“摩西”或“犹太人”；直译可保留其语境指向及可能的论证张力。
- issue: 两个ἵνα之间的逻辑关系
  choice: 译作两个相连的目的表达：“为要……好使……”
  alternative: 把第二个分句处理为纯结果：“结果我们……”
  rationale: 两个ἵνα都具有目的色彩；中文用不同但相应的连接语，既忠于结构，又保持流畅。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“赎出”“领受”“名分”保留经文的神学与法律色彩，但句法力求自然。
