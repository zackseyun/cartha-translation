  text: ἀλλ’ ὁ μὲν ἐκ τῆς παιδίσκης κατὰ σάρκα γεγέννηται, ὁ δὲ ἐκ τῆς ἐλευθέρας ⸀δι’ ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/023.yaml
  text: But the son by the slave woman was born according to the flesh[b][a], while the son by the free woman was born through promise.
translation:
  language: zh_hans
  text: 不过，女奴的儿子是按着肉体而生的[a]；自由女子的儿子却是借着应许而生的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“按通常的人类方式”，或“按人的办法”。希腊文直译为“按着肉体”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“凭着应许”。这句话表明，这次出生是由上帝的应许所成就的，并非仅仅出于通常的人类生育。
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίσκη
  choice: 婢女
  rationale: 该词指处于奴役身份的女子；“婢女”在现代中文中简洁自然，也保留了她与自由女子之间的社会身份对比。
- source_word: κατὰ σάρκα
  choice: 按着肉体
  rationale: 保留保罗的关键词“肉体”，同时由脚注说明此处是按通常的人类生育方式，并非指肉身本身有罪。
- source_word: γεγέννηται
  choice: 生的
  rationale: 希腊语为完成时被动态；在本句追述两个儿子的出生时，中文用“生的”自然清楚，无须生硬体现完成体。
- source_word: ἐλευθέρα
  choice: 自由女子
  rationale: 该形容词作名词使用，与“婢女”的受奴役身份形成明确对照。
- source_word: δι’ ἐπαγγελίας
  choice: 借着应许
  rationale: 保留 διά 所表达的媒介或成就途径，表明这次出生是上帝应许得以实现的结果，同时不擅自补入原文没有的冠词。
- source_word: ὁ μὲν ... ὁ δὲ
  choice: 那……儿子……，那……儿子却……
  rationale: 原文两个冠词结构都省略了上下文明确的“儿子”；中文补出“儿子”，使两相对照清楚，“却”体现 μέν…δέ 的对比。
theological_decisions:
- issue: κατὰ σάρκα 与 δι’ ἐπαγγελίας 的对比
  choice: 正文译为“按着肉体”与“借着应许”，保留保罗用语及其张力。
  alternative: 可意译为“按通常人的方式”与“由于上帝的应许”。
  rationale: 上下文所强调的是通常的人类生育与上帝应许所成就的出生之间的对比，不是在断言肉身或生育本身有罪。正文采取较形式对应的表达，脚注交代语境含义，避免过度诠释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“可是……却……”承接上文并突出两子的对照；保留“肉体”和“应许”这两个保罗论述中的关键术语。
