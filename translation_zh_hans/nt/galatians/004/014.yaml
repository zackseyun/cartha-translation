id: GAL.4.14
reference: Galatians 4:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ τὸν πειρασμὸν ⸀ὑμῶν ἐν τῇ σαρκί μου οὐκ ἐξουθενήσατε οὐδὲ ἐξεπτύσατε, ἀλλὰ ὡς ἄγγελον θεοῦ ἐδέξασθέ με, ὡς Χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/014.yaml
  text: And though my bodily condition was a trial to you[a], you did not treat me with contempt or disgust; rather, you welcomed me as an angel of God[c][b], as Messiah Jesus.
translation:
  language: zh_hans
  text: 虽然我身体的状况使你们经受考验[a]，你们却没有轻看我，也没有厌弃我[b]，反而接待我，如同接待上帝的天使，又如同接待弥赛亚耶稣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们在我肉身上所面对的考验。”原文在文本和句法上较难确定。
    reason: alternative_reading
  - marker: b
    text: “厌弃”原文直译为“吐出”，表示厌恶或排斥。
    reason: lexical_alternative
lexical_decisions:
- source_word: πειρασμὸν ὑμῶν ἐν τῇ σαρκί μου
  choice: 我身体的状况使你们经受考验
  rationale: 原文短语在文本与句法上均有困难。此译法将“考验”理解为加拉太人因保罗身体状况而面对的考验，同时以脚注保留更贴近字面的另一种分析。
- source_word: ἐν τῇ σαρκί μου
  choice: 我身体的状况
  rationale: 这里的“肉体”指保罗身体方面的软弱或病况，并非道德意义上的“罪性”；采用自然中文表达其具体身体含义。
- source_word: ἐξουθενήσατε
  choice: 轻看
  rationale: 表达轻蔑、看不起或视为无足轻重的意思，符合现代汉语且与下文构成递进。
- source_word: ἐξεπτύσατε
  choice: 厌弃
  rationale: 原词字面涉及“吐唾沫”，在此表达因厌恶而排斥；正文译出语用含义，字面形象收入脚注。
- source_word: ἐδέξασθέ
  choice: 接待
  rationale: 表示亲自接受并欢迎某人；“接待”能自然衔接后面的两个比较结构。
- source_word: ἄγγελον θεοῦ
  choice: 上帝的天使
  rationale: ἄγγελος虽可指使者，但此处与“弥赛亚耶稣”形成提升性的平行比较，译作“天使”较合适。
- source_word: Χριστὸν Ἰησοῦν
  choice: 弥赛亚耶稣
  rationale: Χριστός在这里具有称号功能，译作“弥赛亚”明确其“受膏者”身份，而不把它仅当作姓名的一部分。
theological_decisions:
- issue: “如同上帝的天使……如同弥赛亚耶稣”的比较意义
  choice: 描述加拉太人以极高的敬重接待保罗
  alternative: 把这句话理解为保罗在身份或本体上等同于天使或弥赛亚耶稣
  rationale: 两个ὡς短语说明他们接待保罗的方式和态度，并不把保罗与基督作本体上的认同；补出第二个“接待”可避免现代中文产生误解。
- issue: σάρξ的含义
  choice: 身体状况
  alternative: 罪性或犯罪倾向
  rationale: 上下文谈到保罗身体上的软弱及其给加拉太人造成的考验，道德意义的解释缺乏语境依据。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保留原文开头的句法张力，同时通过脚注说明另一种可能读法；两个“如同接待”明确比较的是接待方式，避免中文歧义。
