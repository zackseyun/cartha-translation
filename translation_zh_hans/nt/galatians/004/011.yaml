  text: φοβοῦμαι ὑμᾶς μή πως εἰκῇ κεκοπίακα εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/011.yaml
  text: I fear for you[a], that somehow I have labored over you in vain.
translation:
  language: zh_hans
  text: 我为你们担心，恐怕我在你们身上付出的辛劳白费了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我担心你们，恐怕我为你们所付出的辛劳白费了。”
    reason: “φοβοῦμαι ὑμᾶς”可译为“我担心你们”或“我为你们担心”；“εἰς ὑμᾶς”可按其投向译为“在你们身上”，也可译为“为你们”。两种译法都表达保罗为他们的处境忧虑，而非惧怕他们。
lexical_decisions:
- source_word: φοβοῦμαι ὑμᾶς
  choice: 我真为你们担心
  rationale: φοβοῦμαι为现在时，表达保罗眼下的忧虑；宾格ὑμᾶς在此是他所牵挂的对象，而不是他所惧怕的人。“为你们担心”符合现代汉语，也清楚传达牧者对他们处境的忧虑；“真”自然强化原句前置所带出的情感。
- source_word: μή πως
  choice: 恐怕
  rationale: 引出所担忧的可能结果，兼具忧惧和不确定意味；“恐怕”比逐字译作“免得不知怎么”更自然。
- source_word: εἰκῇ
  choice: 白费了
  rationale: 表示没有成果、徒然无功；与“辛劳”搭配自然，并保留工作可能归于徒然的严肃意味。
- source_word: κεκοπίακα
  choice: 所付出的辛劳
  rationale: κοπιάω强调辛苦劳作；完成时指已经付出且其结果关系到当下的劳动。名词化表达能与汉语的“白费了”自然衔接，又不把希腊语直陈语气改成潜在语气。
- source_word: εἰς ὑμᾶς
  choice: 在你们身上
  rationale: 表示辛劳投向这些人。“在你们身上”保留努力以他们为对象的方向性，同时避免重复使用“为你们”。
theological_decisions:
- issue: 保罗忧虑的性质
  choice: 译为保罗担心自己在加拉太人身上付出的辛劳可能归于徒然
  alternative: 仅表达一般性的个人焦虑
  rationale: φοβοῦμαι…μή πως…εἰκῇ κεκοπίακα的组合具体指向其劳作可能没有成果，而不只是笼统的不安；译文不进一步界定这种徒然在神学上的最终性质。
- issue: 辛劳是否已经确定无效
  choice: 以“恐怕……白费了”表达所担忧的可能性
  alternative: 译成已经确定“我的辛劳都白费了”
  rationale: κεκοπίακα本身是完成时直陈语气，但受μή πως引出的担忧内容支配；汉语用“恐怕”承载不确定性，同时保留已付出辛劳的事实。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“辛劳”保留κοπιάω的费力意味，“白费了”清楚易懂；正文中的脚注标记置于句末，以免打断短句的情感推进。
