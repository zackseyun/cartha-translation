id: GAL.4.10
reference: Galatians 4:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἡμέρας παρατηρεῖσθε καὶ μῆνας καὶ καιροὺς καὶ ἐνιαυτούς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/010.yaml
  text: You are carefully observing days and months and seasons and years.
translation:
  language: zh_hans
  text: 你们谨守日子、月份、节期和年份。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “节期”也可译作“指定的时期”。这组词所指的是按历法遵守的日子、月份、特定时期和年份。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας
  choice: 日子
  rationale: 直译复数名词，保留原文未加修饰的时间单位；其宗教历法含义由上下文体现。
- source_word: παρατηρεῖσθε
  choice: 谨守
  rationale: 该动词在此表示留意并遵守；“谨守”简洁传达持续、审慎遵行历法规定的意味，又不过度展开。
- source_word: μῆνας
  choice: 月份
  rationale: 直接对应历法中的“月”，作为复数类别用“月份”自然清楚。
- source_word: καιρούς
  choice: 节期
  rationale: καιρός可指特定或指定的时期；在这组历法项目中，“节期”自然，但比“时期”更具解释性，因此脚注保留较宽泛的译法。
- source_word: ἐνιαυτούς
  choice: 年份
  rationale: 直接对应“年”，并保持原文日、月、时期、年的递进排列。
- source_word: καὶ
  choice: 、／和
  rationale: 按现代汉语列举习惯，以顿号连接前项，并在末项前用“和”，保留累积列举关系。
theological_decisions:
- issue: 是否在正文中明说这些是犹太教或宗教历法的遵守
  choice: 不添加“犹太教的”“宗教的”等限定语
  alternative: 你们谨守宗教上的日子、月份、节期和年份。
  rationale: 原文只列出各类时间，并未直接加上身份或宗教限定；具体性质应由上下文判断，避免把解释写入正文。
- issue: καιρούς是否明确译作节期
  choice: 正文译作“节期”，脚注注明“指定的时期”这一较宽译法
  alternative: 时期／指定的时期
  rationale: 历法语境使“节期”在中文中最自然，但原词本身仍可较宽泛地指特定时期，故以脚注保存词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“谨守”比单纯“遵守”更能体现 παρατηρεῖσθε 的审慎留意意味；正文保持原文简短、有节奏的历法列举。
