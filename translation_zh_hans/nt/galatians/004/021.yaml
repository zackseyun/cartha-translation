  text: Λέγετέ μοι, οἱ ὑπὸ νόμον θέλοντες εἶναι, τὸν νόμον οὐκ ἀκούετε;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/021.yaml
  text: Tell me[a], you who want to be under the law, do you not listen to the law?
translation:
  language: zh_hans
  text: 你们这些想要在律法之下的人，请告诉我：难道你们没有听律法所说的吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“难道你们没有听见律法吗？”希腊语动词既可指“听见”，也可指留心听取；这里的“律法”很可能指摩西律法，尤其是保罗接下来引用的经文记载。
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγετέ μοι
  choice: 请告诉我
  rationale: 这里是现在时命令语气复数，用来直接质问听众。“请告诉我”符合现代汉语表达，也保留了命令和要求回应的语气。
- source_word: οἱ ὑπὸ νόμον θέλοντες εἶναι
  choice: 你们这些想要在律法之下的人
  rationale: 保留“在律法之下”这一保罗特有的法律与盟约性表达；“你们这些……的人”自然呈现带冠词分词所指的特定群体。
- source_word: νόμον / τὸν νόμον
  choice: 律法 / 律法
  rationale: 两处都译作“律法”，保留保罗在“处于律法之下”和“听律法所说”之间的文字呼应；上下文可指摩西律法，也可侧重作为经文的律法书。
- source_word: οὐκ ἀκούετε
  choice: 难道你们没有听……所说的吗
  rationale: ἀκούω既可指“听见”，也可指认真听取。汉语“听……所说”既自然地引出下一段所引用的经文，又不过度限定为“听从”。
theological_decisions:
- issue: “律法”的所指及双重用法
  choice: 两处统一译为“律法”，第二处用“听律法所说”表达律法作为经文发言的意味
  alternative: 第二处译为“难道你们没有听过律法吗”或“难道你们不听从律法吗”
  rationale: 本句既涉及人想处于摩西律法的权辖之下，也涉及随后要引用的律法书叙事。统一用词可保留这种修辞张力；“听律法所说”避免把意思过早收窄为单纯听觉或服从。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“难道……吗”呈现希腊语否定疑问句预期肯定回答的质问语气；正文加入“所说”是自然汉语所需的轻度明示，并与下文经文论证相连。
