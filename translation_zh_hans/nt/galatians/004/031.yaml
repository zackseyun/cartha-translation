  yaml_path: translation/nt/galatians/004/031.yaml
  text: Therefore[a], brothers, we are not children of the slave woman[b], but of the free woman.
translation:
  language: zh_hans
  text: 所以，弟兄们[a]，我们不是女奴[b]的儿女，而是自由妇人的儿女。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姊妹们”；希腊文直译为“弟兄们”，在这里可以代表性地称呼包括女性在内的群体。
    reason: lexical_alternative
  - marker: b
    text: 或译“使女”或“女仆”；希腊文指女性奴隶，也可指女仆。这里在保罗关于夏甲与撒拉的寓意中，与“自由妇人”相对（参4:21–31）。
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: 所以
  rationale: 承接前文对夏甲与撒拉的寓意阐释，引出推论；“所以”自然地保留了因而得出结论的逻辑作用。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 这是ἀδελφός的阳性复数呼格。正文保留原文的亲属称谓及其代表性用法，并用脚注说明所称呼的群体包括女性。
- source_word: οὐκ ἐσμὲν
  choice: 我们不是
  rationale: 准确表达现在时直陈语气的否定；原文没有“不再”的时间含义，也没有加强否定的成分。
- source_word: παιδίσκης
  choice: 使女
  rationale: 该词指女性奴仆；在本段夏甲与撒拉的对比中，其受奴役的身份至关重要。“使女”既符合现代中文圣经语体，也避免把她误解为普通女佣；脚注补明“女奴”这一词义。
- source_word: τέκνα
  choice: 儿女
  rationale: τέκνα泛指子女，不限男性；“儿女”在中文中自然、庄重，也保留群体身份和亲属关系的比喻。
- source_word: ἀλλὰ
  choice: 而是
  rationale: 与前面的“不是”组成自然的“不是……而是……”对举，清楚表达两种身份之间的鲜明对比。
- source_word: τῆς ἐλευθέρας
  choice: 自由妇人的儿女
  rationale: 阴性冠词加形容词作名词使用，回指撒拉。“自由妇人”明确其女性指称，并与“使女”的身份形成对照；补出第二个“儿女”符合汉语表达，并未增加新的语义。
theological_decisions:
- issue: 如何呈现夏甲与撒拉之间奴役和自由的寓意性对比
  choice: 正文译作“使女……自由妇人”
  alternative: “女奴……自由的妇人”或“婢女……自主妇人”
  rationale: 保罗在加拉太书4:21–31的论证以奴役和自由的身份对立为核心。该译法保留这一张力，并不进一步界定其教义含义。
- issue: 如何处理ἀδελφοί对混合性别群体的代表性称呼
  choice: 正文保留“弟兄们”，脚注说明也包括姊妹
  alternative: 正文译作“弟兄姊妹们”或“众弟兄姊妹”
  rationale: “弟兄们”保留了希腊文阳性亲属称谓的形式；脚注则避免现代读者误以为保罗只称呼男性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不是……而是……”清楚再现原文对举结构；“使女”与“自由妇人”保留本段的社会身份和神学张力。所有脚注标记均已置于正文相应位置。
