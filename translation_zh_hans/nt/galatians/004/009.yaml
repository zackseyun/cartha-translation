id: GAL.4.9
reference: Galatians 4:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: νῦν δὲ γνόντες θεόν, μᾶλλον δὲ γνωσθέντες ὑπὸ θεοῦ, πῶς ἐπιστρέφετε πάλιν ἐπὶ τὰ ἀσθενῆ καὶ πτωχὰ στοιχεῖα, οἷς πάλιν ἄνωθεν ⸀δουλεύειν θέλετε;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/009.yaml
  text: But now[a], having come to know God—or rather, having been known by God—how can you turn back again to the weak and poor elemental principles, to which you want to be enslaved all over again?
translation:
  language: zh_hans
  text: 但如今，你们既已认识神——不如说，是神认识了你们——你们怎么又转回那些软弱、贫乏的基本要素[a]，还想再一次从头受它们奴役呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基本要素”也可译为“元素灵”“基本原则”或“初级事物”。
    reason: στοιχεῖα在此含义有争议，可能指基本原则、初级事物，或宇宙性的灵界力量。
lexical_decisions:
- source_word: γνόντες θεόν
  choice: 认识了神
  rationale: 以完成性的“认识了”表达不定过去时分词在语境中的进入性含义，即他们已经进入对神的认识；“既然”自然呈现分词与主句的逻辑关系。
- source_word: μᾶλλον δὲ γνωσθέντες ὑπὸ θεοῦ
  choice: 不，更确切地说，是神认识了你们
  rationale: μᾶλλον δέ在此修正并深化前一句；译文明确保留神为施事者，也以“更确切地说”传达保罗的纠正语气，而不附加超出经文的教义推论。
- source_word: πῶς ἐπιστρέφετε πάλιν
  choice: 怎么又转回
  rationale: “怎么”在反问中自然表达惊讶和责备；“又转回”兼顾现在时所指的回转过程及πάλιν的重复意味。
- source_word: τὰ ἀσθενῆ καὶ πτωχὰ στοιχεῖα
  choice: 那些软弱贫乏的基本要素
  rationale: “软弱贫乏”直接表达两个形容词；στοιχεῖα含义有争议，“基本要素”保留其可指基础原则、构成要素或宇宙性力量的开放性，其他可能译法列入脚注。
- source_word: οἷς
  choice: 给它们
  rationale: 关系代词为中性复数，与στοιχεῖα一致；主文以非人格化的“它们”保留语法对应，同时不排除该词可能涉及灵界力量。
- source_word: πάλιν ἄνωθεν
  choice: 重新从头
  rationale: 两个副词合用，强调再次开始并重入先前状态；“重新从头”在现代汉语中自然保留这一加强意味。
- source_word: δουλεύειν θέλετε
  choice: 想……作奴隶
  rationale: θέλετε表达意愿；“作奴隶”保留δουλεύειν在《加拉太书》语境中的受奴役意象，比单译“服事”更有力度。
theological_decisions:
- issue: στοιχεῖα在加拉太书4:9中的含义
  choice: 基本要素
  alternative: 元素之灵、基本原则、初级事物
  rationale: 该词既可能指旧秩序下的基础宗教原则或初级事物，也可能涉及宇宙性灵界力量。主文采用较开放的“基本要素”，避免把争议预先限定为纯教育性或纯灵界性的解释，并在脚注保留主要译法。
- issue: “被神认识”的强调
  choice: 是神认识了你们
  alternative: 你们蒙神认识
  rationale: 译文保留μᾶλλον δέ的实际修正作用，突出神是“认识”的施事者；同时不把这种强调扩展为经文本身未明说的完整教义体系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不，更确切地说”再现保罗自我修正的语气；“怎么又……呢”保留反问中的惊讶与责备；“作奴隶”维持本段鲜明的奴役意象。
