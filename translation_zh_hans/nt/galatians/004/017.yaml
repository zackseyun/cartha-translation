id: GAL.4.17
reference: Galatians 4:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ζηλοῦσιν ὑμᾶς οὐ καλῶς, ἀλλὰ ἐκκλεῖσαι ὑμᾶς θέλουσιν, ἵνα αὐτοὺς ζηλοῦτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/017.yaml
  text: They are zealous for you[a], but not in a good way. Rather, they want to shut you out[b], so that you may be zealous for them.
translation:
  language: zh_hans
  text: 那些人热切争取你们[a]，却不是出于好意；他们想把你们排斥在外[b]，好叫你们也热切争取他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“热心对待你们，却动机不正。”这里的希腊语动词也可表示热切寻求、笼络或追求。
    reason: lexical_alternative
  - marker: b
    text: 或译：“把你们隔绝开来。”原文没有说明要使他们与谁或什么隔绝；按上下文，较可能是要使他们疏远保罗及其同工，从而转去寻求那些人。
    reason: alternative_reading
lexical_decisions:
- source_word: ζηλοῦσιν … ζηλοῦτε
  choice: 热切争取……也热切争取
  rationale: ζηλόω可表示热切关注、渴望得到或争取对方。以相同措辞译出两次出现，保留原文“他们争取你们，为要你们争取他们”的修辞对称，也显出对方争夺忠诚的意味，而不把词义限定为浪漫追求。
- source_word: οὐ καλῶς
  choice: 却不是出于好意
  rationale: 该短语对这种热心作负面评价，可涉及动机或方式。“不是出于好意”是自然的现代汉语，同时没有进一步断定具体恶意。
- source_word: ἀλλὰ
  choice: ；
  rationale: 原文以强转折引出对方真正的意图。汉语分号承接前句的否定评价，并自然进入解释；后句“他们想……”已清楚体现纠正和对照关系。
- source_word: ἐκκλεῖσαι ὑμᾶς
  choice: 把你们排斥在外
  rationale: ἐκκλείω意为关在外面、排除。“排斥在外”保留生动的关系性隔绝，同时不擅自补明究竟从谁或什么群体中排除。
- source_word: θέλουσιν
  choice: 他们想
  rationale: 用现代汉语直接表达意愿和企图。
- source_word: ἵνα
  choice: 好叫
  rationale: 明确表达目的关系，又符合庄重而自然的经文语体。
- source_word: αὐτούς
  choice: 他们
  rationale: 指前文那些试图影响加拉太信徒的人，不额外加上带评价色彩的称谓。
theological_decisions:
- issue: “把你们排斥在外”所指的隔绝对象
  choice: 正文不补明他们要使加拉太人同谁或什么隔绝
  alternative: 明确译作“使你们与保罗及其同工隔绝”或“把你们排除在教会／神的福分之外”
  rationale: 原文ἐκκλεῖσαι ὑμᾶς没有说明从何处或从谁那里排除。上下文较支持使他们疏远保罗、转向那些人，但正文保留原文的省略和可能的张力，解释放入脚注。
- issue: ζηλόω在本节中的关系性含义
  choice: 译作“热切争取”，并在两处保持一致
  alternative: “热心待”“笼络”“追求”或“讨好”
  rationale: “热切争取”兼顾热忱、寻求对方归附和争夺忠诚等含义，也保留两次ζηλόω的对应；避免把经文过度解释为浪漫追求，或直接断定第二处是讨好、依附。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“那些人”自然承接上下文中的对手；用“热切争取”重复呈现原文关键词和修辞对称。正文保留“排斥在外”的对象未明，不将上下文推断写成原文本身明说的内容。
