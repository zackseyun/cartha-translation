base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/016.yaml
  text: So then[a], have I become your enemy by telling you the truth?
translation:
  language: zh_hans
  text: 那么，我对你们说真话，反倒成了你们的仇敌吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “说真话”也可译为“以真实相待”或“诚实地对你们说话”。希腊语分词ἀληθεύων既可指说出真话，也可指真实、诚实地表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: 那么
  rationale: 承接上文并引出推论；“那么”在现代汉语中自然保留了这一推论性和反问语气。
- source_word: ἐχθρὸς ὑμῶν
  choice: 你们的仇敌
  rationale: ἐχθρός在此作名词性表语，指被视为敌对者；“你们的仇敌”准确、庄重且符合汉语习惯。
- source_word: γέγονα
  choice: 成了
  rationale: γίνομαι的完成时表达已经发生的转变及其当前结果；汉语“成了”结合反问语境可自然传达这一结果状态。
- source_word: ἀληθεύων ὑμῖν
  choice: 我对你们说真话
  rationale: 分词可表示原因、手段或伴随情形，动词既可指说真话，也可指以真实相待；正文采用语境中较自然的“对你们说真话”，同时用脚注保留另一种表达范围。
- source_word: ἀληθεύων
  choice: 反倒
  rationale: “反倒”并非该分词的独立词义，而是汉语为清楚呈现“说真话竟导致成为仇敌”这一反常结果所需的语用表达，强化原句反问中的张力而不改变命题内容。
theological_decisions:
- issue: ἀληθεύων在保罗劝诫语境中的含义
  choice: 保罗问，他对加拉太人说真话，是否反而使自己成了他们的仇敌。
  alternative: 保罗问，他以真实或诚实的态度对待他们，是否使自己成了他们的仇敌。
  rationale: 上下文涉及保罗对受众直接的劝诫和诉求，因此“说真话”最贴近其沟通行为；脚注保留动词可泛指真实、诚实表达的语义空间。
translation_notes:
  register: 采用现代、庄重而口语可懂的反问句。“反倒”自然体现说真话与被当作仇敌之间的反常关系；不额外限定是实际成为仇敌，还是被受众视为仇敌，从而保留原文的修辞张力。
