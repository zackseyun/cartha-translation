  text: οἴδατε δὲ ὅτι δι’ ἀσθένειαν τῆς σαρκὸς εὐηγγελισάμην ὑμῖν τὸ πρότερον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/013.yaml
  text: But you know that it was because of an illness of the flesh that I first proclaimed the good news to you,[a]
translation:
  language: zh_hans
  text: 但你们知道，我先前向你们传福音，是因为身体有病。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为身体软弱。”希腊原文直译为“因为肉身的软弱／疾病”。
    reason: 保留ἀσθένεια可表示“软弱”或“疾病”的词义范围，并呈现τῆς σαρκὸς较直译的表达。
lexical_decisions:
- source_word: οἴδατε
  choice: 你们知道
  rationale: οἶδα虽为完成时形式，在此具有现在时意义；“你们知道”自然地表达保罗诉诸加拉太人已有的共同记忆。
- source_word: δὲ
  choice: 但
  rationale: δέ在此表示温和的转折和话题推进；“但”承接上文并引出保罗对往事的提醒。
- source_word: ὅτι
  choice: （引出“知道”的内容）
  rationale: ὅτι引导οἴδατε的宾语从句；汉语无需另译连接词，直接说“你们知道，……”更自然。
- source_word: δι’ ἀσθένειαν τῆς σαρκὸς
  choice: 因为身体有病
  rationale: διά加宾格表示原因；ἀσθένεια可指软弱或疾病，结合τῆς σαρκὸς，此处很可能指身体方面的疾病。“身体有病”清楚自然，同时以脚注保留“身体软弱”的词义可能。
- source_word: εὐηγγελισάμην
  choice: 传福音
  rationale: 该动词指宣告好消息；“传福音”在现代汉语中简洁、通行，并保留其宣讲行动的含义。
- source_word: ὑμῖν
  choice: 向你们
  rationale: 与“传福音”搭配时，“向你们”自然表达与格所标明的宣告对象。
- source_word: τὸ πρότερον
  choice: 先前
  rationale: 该短语可指较早的时候或最初一次。上下文回顾保罗早先在他们中间传福音的经历；“先前”不强行断定是否涉及两次造访，并保留原文一定程度的时间含混。
theological_decisions:
- issue: ἀσθένειαν τῆς σαρκὸς中σάρξ的含义
  choice: 身体方面的疾病
  alternative: 身体软弱；一般性的软弱；属罪的本性
  rationale: 这里叙述保罗先前到加拉太人那里传福音时的处境，σάρξ指肉身或身体，而非道德意义上的“属罪本性”。正文采用较可能的“身体有病”，脚注保留ἀσθένεια也可译为“软弱”。
- issue: δι’ ἀσθένειαν所表达的逻辑关系
  choice: 原因：“因为”
  alternative: 伴随处境：“在身体软弱中”
  rationale: διά加宾格通常表示原因，因此译为“因为”；但原文没有说明疾病如何促成这次传福音，也不宜补入具体病症或行程细节。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“传福音”是现代中文读者普遍可理解的固定表达；“身体有病”避免生硬的“肉身的疾病”，脚注则保留原文措辞及其歧义。
