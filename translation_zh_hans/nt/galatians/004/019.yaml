  text: ⸀τέκνα μου, οὓς πάλιν ὠδίνω ⸀μέχρις οὗ μορφωθῇ Χριστὸς ἐν ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/019.yaml
  text: My children[a], for whom I am again suffering birth pains until Messiah is formed in you[c][b],
translation:
  language: zh_hans
  text: 我的孩子们啊，我为你们再次受分娩之苦[a]，直到弥赛亚[b]在你们里面[c]成形。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译为“我再次经历产痛”或“我再次受分娩之苦”。
    reason: 说明ὠδίνω所保留的分娩阵痛意象，并避免将其误解为实际完成分娩。
  - marker: b
    text: 或译“基督”。“弥赛亚”表达Χριστός作为称号的含义；“基督”是熟悉的传统译法。
    reason: 保留Χριστός的另一常用译法。
  - marker: c
    text: 或译“在你们中间”，强调这句话也可能具有群体性的含义。
    reason: 保留ἐν ὑμῖν的词义与解释空间。
lexical_decisions:
- source_word: τέκνα μου
  choice: 我的孩子们啊
  rationale: 这是带有亲切感的复数呼语；“孩子们”自然准确，“啊”体现直接而深切的呼唤，但不额外加入原文未明说的“幼小”之意。
- source_word: οὓς πάλιν ὠδίνω
  choice: 我为你们再受生产之苦
  rationale: ὠδίνω生动地描写分娩的阵痛；“受生产之苦”保留保罗以母亲分娩为喻的形象。πάλιν译为“再”，明确表达这种痛苦的重复。关系代词οὓς按汉语习惯处理为“为你们”。
- source_word: μέχρις οὗ
  choice: 直到
  rationale: 简洁表达原文的时间界限及所期待的目标，符合现代汉语习惯。
- source_word: μορφωθῇ
  choice: 成形
  rationale: 保留不定过去时被动虚拟式的被动含义，并与孕育、生产的比喻自然衔接；不把这一意象解释成某种特定的教义机制。
- source_word: Χριστός
  choice: 弥赛亚
  rationale: 此处将Χριστός作为称号来表达；“弥赛亚”传达“受膏者”的身份含义，同时以脚注保留读者熟悉的“基督”译法。
- source_word: ἐν ὑμῖν
  choice: 在你们里面
  rationale: 首先保留ἐν最直接的内在含义，也与“成形”的比喻相配；ὑμῖν为复数，因此并不排除群体层面的含义，另在脚注注明“在你们中间”的可能译法。
theological_decisions:
- issue: “弥赛亚在你们里面成形”的含义
  choice: 保留弥赛亚在加拉太信徒里面成形的牧养性比喻，不把它改写为某种技术性的教义陈述。
  alternative: 可侧重理解为弥赛亚在整个信徒群体中间成形，或主要指向归信、重生的意象。
  rationale: 原文既有内在塑造的自然含义，又因“你们”为复数而容许群体维度；正文与脚注共同保留这种张力。
- issue: Χριστός作为称号或习惯性名称
  choice: 正文译作“弥赛亚”。
  alternative: 译作“基督”。
  rationale: “弥赛亚”凸显原文称号“受膏者”的意义；“基督”是中文新约传统中熟悉且准确的对应词，故列作脚注中的可选译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“生产之苦”保留原文强烈的母性分娩意象；感叹号体现呼语的情感力度。“成形”简洁自然，并与整句的孕育比喻相呼应。
