base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/025.yaml
  text: Hagar is Mount Sinai in Arabia[a], and she corresponds to the present Jerusalem, for she is enslaved with her children.
translation:
  language: zh_hans
  text: 夏甲就是阿拉伯境内的西奈山[a]，她与现今的耶路撒冷相对应，因为她和她的儿女一同为奴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这位夏甲就是阿拉伯境内的西奈山。”希腊文在“夏甲”前有冠词，使这一分句的句法较难确定；有些译本更明确地把这个冠词表达出来。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δὲ Ἁγὰρ
  choice: 夏甲
  rationale: δέ在此作轻微承接；不另加“如今”，以免与后文具有时间意义的νῦν混淆。Ἁγὰρ前的中性冠词τὸ造成句法难点，正文采用自然汉语表达，并在脚注中保留较显明反映冠词的译法。
- source_word: Σινᾶ ὄρος
  choice: 西奈山
  rationale: 采用现代汉语通行地名，保留保罗寓意论述中的直接等同表达。
- source_word: ἐστὶν ἐν τῇ Ἀραβίᾳ
  choice: 就是阿拉伯境内的
  rationale: 简洁表达地点关系，不把“阿拉伯”过度限定为特定行政疆界；“就是”保留ἐστίν的直接判断语气。
- source_word: συστοιχεῖ
  choice: 相对应
  rationale: 该词表示处在同一列、属于相应的一方；“相对应”既清楚自然，也保留寓意比较中的配对关系。
- source_word: τῇ νῦν Ἰερουσαλήμ
  choice: 现今的耶路撒冷
  rationale: 明确表达νῦν的时间意义，并与下一节“在上的耶路撒冷”形成对照。
- source_word: δουλεύει
  choice: 为奴
  rationale: 保留本段奴役与自由的核心对比，不弱化为一般性的“服事”。
- source_word: μετὰ τῶν τέκνων αὐτῆς
  choice: 和她的儿女一同
  rationale: μετά加属格表示伴同；τέκνα在家庭及寓意语境中自然译作“儿女”。
theological_decisions:
- issue: 保罗把夏甲与西奈山及现今的耶路撒冷联系起来的寓意表达
  choice: 直接译作“夏甲就是……西奈山”，继而说她“与现今的耶路撒冷相对应”
  alternative: 解释性地译作“夏甲代表西奈山”
  rationale: 原文先用系词作直接等同判断，再用συστοιχεῖ表达对应关系。正文保留这种修辞力度，不额外解释或缓和保罗的寓意论证。
- issue: 耶路撒冷与其儿女的奴役状态
  choice: 她和她的儿女一同为奴
  alternative: 她连同她的儿女都处于奴役之中
  rationale: 采用简洁而有力度的奴役用语，保留拟人化的阴性主语和母子意象，也不具体增补奴役对象或性质。
translation_notes:
  register: 采用庄重、自然的现代标准汉语。“就是”保留直接判断的力度；“相对应”和“一同为奴”便于普通读者理解，同时维持本段的寓意结构及奴役—自由张力。脚注标记[a]已置于正文“西奈山”分句之后。
