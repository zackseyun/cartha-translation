  text: ὅτε δὲ ἦλθεν τὸ πλήρωμα τοῦ χρόνου, ἐξαπέστειλεν ὁ θεὸς τὸν υἱὸν αὐτοῦ, γενόμενον ἐκ γυναικός, γενόμενον ὑπὸ νόμον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/004.yaml
  text: But when the fullness of time had come[a], God sent out his Son, born of a woman, born under the law[d][c][b],
translation:
  language: zh_hans
  text: 但当时候满足时[a]，上帝差遣了他的儿子；他由女子所生[b]，也生在律法之下[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“时间到了圆满的时候”“期限满了的时候”。
    reason: lexical_alternative
  - marker: b
    text: 直译可作“由女子而来”；这里指他真实地由女子出生。
    reason: lexical_alternative
  - marker: c
    text: 即处在摩西律法的管辖之下。
    reason: cross_reference
lexical_decisions:
- source_word: ὅτε δὲ
  choice: 但到了
  rationale: 既表达时间推进，也保留δέ所带的轻微转折，与上文形成自然衔接。
- source_word: τὸ πλήρωμα τοῦ χρόνου
  choice: 所定的时期
  rationale: 在自然现代汉语中表达时间达到预定圆满、期限已到的含义，同时以脚注保留“时间的圆满”等较形式对应的译法。
- source_word: ἐξαπέστειλεν
  choice: 差遣……来
  rationale: 表达带使命的差派，并借“来”自然呈现从上帝那里被差出的方向感；不机械强化复合动词的前缀。
- source_word: τὸν υἱὸν αὐτοῦ
  choice: 他的儿子
  rationale: 直接、自然地对应宾语及所属关系；中文无需以大写标示身份。
- source_word: γενόμενον ἐκ γυναικός
  choice: 由女子所生
  rationale: 这里γίνομαι结合ἐκ γυναικός指真实的人类出生；“由女子所生”既自然又保留来源意味。
- source_word: γενόμενον ὑπὸ νόμον
  choice: 生在律法之下
  rationale: 重复“生”以反映两个平行分词，并保留保罗“在律法之下”的简洁表达。
- source_word: νόμον
  choice: 律法
  rationale: 《加拉太书》的语境主要指摩西律法；正文不扩写为“摩西律法”，以保留原文的凝练及语境张力。
theological_decisions:
- issue: γενόμενον ἐκ γυναικός所表达的基督真实人性
  choice: 译作“由女子所生”，明确真实的人类出生
  alternative: 成为女子所出的；从女子而来
  rationale: “上帝差遣他的儿子”暗含差遣前已有的身份，而“由女子所生”又肯定其真实出生；此译法保留两方面的张力，不将其系统化展开。
- issue: ὑπὸ νόμον中νόμος的所指
  choice: 正文译“律法”，脚注说明语境中指摩西律法的管辖
  alternative: 直接译作“摩西律法”；泛指任何法律或原则
  rationale: 《加拉太书》的上下文强烈指向摩西律法，但原文没有明说“摩西”；正文保留简洁说法，脚注提供语境说明。
- issue: τὸ πλήρωμα τοῦ χρόνου是否明确加入神所预定的观念
  choice: 译作“所定的时期”，但脚注保留较直译形式
  alternative: 时间的圆满；期限满了
  rationale: 该短语表示时间达到完整或指定终点；“所定”符合语境，但不在正文进一步明说由谁设定，以免过度阐释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“差遣”保留使命意味；分号清楚连接差遣与两个平行的出生描述。脚注标记均在正文相应位置出现。
