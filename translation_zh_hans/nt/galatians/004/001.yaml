  to: 我说，在继承人还是孩子的期间，他虽然是万有的主人，却与奴隶毫无分别[a]。
  rationale: 修订以“在……期间”准确表达持续性的时间短语，并以“孩子”贴近νήπιος的基本词义；脚注保留“未成年”的语境性理解。让步结构和“万有的主人”均保留原文所呈现的身份与暂时实际处境之间的张力。原有两枚脚注中，b并未对应具体词语或翻译变体，故将必要说明并入与νήπιος相关的a脚注，避免无明确锚点的脚注。
