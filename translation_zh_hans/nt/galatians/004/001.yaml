  text: Λέγω δέ, ἐφ’ ὅσον χρόνον ὁ κληρονόμος νήπιός ἐστιν, οὐδὲν διαφέρει δούλου κύριος πάντων ὤν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/001.yaml
  text: I say that as long as the heir is a child[a], he differs in nothing from a slave, though he is lord of all[b],
translation:
  language: zh_hans
  text: 我说，在继承人还是孩子的期间，他虽然是万有的主人，却与奴隶毫无分别[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“未成年”。希腊语νήπιος可指年幼的孩子；在本句继承产业的语境中，着重指尚未达到成年、不能自主支配产业的人。“毫无分别”指其未成年期间的实际处境，并非否认其继承人的身份。
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δέ
  choice: 我说
  rationale: λέγω引出进一步说明，δέ仅有轻微承接或转折作用；中文用“我说”自然衔接上下文，不额外强化对比。
- source_word: ἐφ’ ὅσον χρόνον
  choice: 只要还
  rationale: 该短语表示持续到某一界限的时段；与“未成年”搭配，简洁表达“在……期间”。
- source_word: ὁ κληρονόμος
  choice: 继承人
  rationale: 准确表达有权承受产业之人，也是现代汉语中自然、通行的法律及日常用语。
- source_word: νήπιός
  choice: 未成年
  rationale: νήπιος可指幼儿，也可泛指尚未成熟或未达法定年龄者；在继承权的比喻中，重点是继承人尚未达到可自主支配产业的年龄，因此译作“未成年”更清楚，同时以脚注保留“孩子”的词义可能。
- source_word: οὐδὲν διαφέρει
  choice: 毫无分别
  rationale: 保留原文“没有任何差别”的强调，且符合庄重、自然的现代汉语。
- source_word: δούλου
  choice: 奴隶
  rationale: δοῦλος在此突出受人支配、没有自主权的身份；“奴隶”比“仆人”更能保留保罗比喻的力度。
- source_word: κύριος πάντων ὤν
  choice: 即使是万有的主人
  rationale: κύριος在此指所有权或支配权，而非神圣称号；“即使”表达分词结构在语境中的让步意味，“万有”保留πάντων的广泛范围。
theological_decisions:
- issue: 继承人当前身份与实际处境之间的张力
  choice: 即使是万有的主人，也与奴隶毫无分别
  alternative: 虽然将来会成为万有的主人，却与奴隶没有分别
  rationale: 原文ὤν是“是”，并未说“将来会成为”；译文保留继承人已经具有主人身份、却暂时在实际处境上与奴隶无异的张力。
- issue: δοῦλος的身份力度
  choice: 奴隶
  alternative: 仆人
  rationale: 本句比较的关键是继承人在未成年期间缺乏自主权；“奴隶”准确保留受支配身份及修辞力度，不将其弱化为一般服侍者。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“未成年”清楚传达继承比喻中的法律和社会处境；句序将让步成分置于比较之前，使中文流畅，同时保留原文身份与处境的反差。
