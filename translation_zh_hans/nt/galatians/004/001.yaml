  terminology: “继承人”“奴隶”及“万有的主人”均恰当。“万有”保持较庄重的经文语体；κύριος在此不宜译作神圣称号。“孩子”比“未成年”更贴近νήπιος，同时脚注可说明本语境所含未达成年之意。
