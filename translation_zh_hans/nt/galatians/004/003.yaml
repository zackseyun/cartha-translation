  text: οὕτως καὶ ἡμεῖς, ὅτε ἦμεν νήπιοι, ὑπὸ τὰ στοιχεῖα τοῦ κόσμου ⸀ἤμεθα δεδουλωμένοι·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/003.yaml
  text: So also we[a], when we were children, were enslaved under the elemental principles of the world.
translation:
  language: zh_hans
  text: 同样，我们还是孩童的时候，也曾被世上的基本要素[a]奴役。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“世上的灵界势力”。希腊语所用的词既可指基本要素或初步原理，也可能指宇宙中的灵界权势。
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ
  choice: 同样……也
  rationale: 承接上文继承人在监护之下的比喻，保留类比和强调关系，中文表达自然。
- source_word: ἡμεῖς
  choice: 我们
  rationale: 明确保留原文带强调意味的第一人称复数。
- source_word: ὅτε ἦμεν νήπιοι
  choice: 我们还是孩童的时候
  rationale: νήπιοι在此延续未成年继承人的比喻，重在未成熟和受管束的身份；“孩童”比“婴孩”宽泛，也不如“未成年人”法律化。
- source_word: ὑπὸ τὰ στοιχεῖα τοῦ κόσμου
  choice: 受制于世上的基本要素
  rationale: ὑπό表示处在权势或管辖之下；στοιχεῖα含义有争议，“基本要素”保留其可指基本成分或初步原理的语义空间，不在正文中直接判定为有位格的灵界势力。
- source_word: ἤμεθα δεδουλωμένοι
  choice: 作了奴仆
  rationale: 保留原文强烈的奴役意象及被动受辖制之意，同时与本段关于继承人和奴仆的对比相呼应。
theological_decisions:
- issue: τὰ στοιχεῖα τοῦ κόσμου的含义
  choice: 正文译作“世上的基本要素”
  alternative: “世上的灵界势力”或“世界的基本原理”
  rationale: 该短语在保罗书信中的指向存在争议，可能是构成世界的基本要素、初步规条或宇宙性的灵界权势。正文采用较少限定的译法，脚注列出灵界势力这一重要可能，以保留原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“受制于……作了奴仆”既保留ὑπό的辖制关系，也传达δεδουλωμένοι的奴役力度；脚注明确呈现στοιχεῖα的词义歧义。
