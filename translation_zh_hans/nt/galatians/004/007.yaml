  text: ὥστε οὐκέτι εἶ δοῦλος ἀλλὰ υἱός· εἰ δὲ υἱός, καὶ κληρονόμος ⸂διὰ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/007.yaml
  text: So you are no longer a slave but a son[a]; and if a son[b], then also an heir through God.
translation:
  language: zh_hans
  text: 因此，你不再是奴隶，而是儿子[a]；如果是儿子，也就借着上帝成为继承人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“儿女”。原文作“儿子”，保留了本段有关收养和继承权的论证；保罗所说的这一身份适用于所有信徒。
    reason: lexical_alternative
  - marker: b
    text: 有些抄本作“借着基督成为上帝的继承人”（或“借着弥赛亚成为上帝的继承人”），而不是“借着上帝成为继承人”。
    reason: textual_variant
lexical_decisions:
- source_word: ὥστε
  choice: 这样
  rationale: 承接上文并引出推论，既保留推论关系，也符合现代汉语表达。
- source_word: οὐκέτι εἶ δοῦλος
  choice: 你不再是奴隶
  rationale: 直接保留第二人称单数和身份已经改变的时间含义；“奴隶”准确呈现受辖制的身份，并与儿子和继承人的身份形成鲜明对比。
- source_word: ἀλλὰ υἱός
  choice: 而是儿子
  rationale: “儿子”保留原文阳性单数及本段收养、承受产业的法律背景；其身份适用于所有信徒，另以脚注说明。
- source_word: εἰ δὲ υἱός
  choice: 既然是儿子
  rationale: 此处条件在论证中是已经成立的事实，汉语用“既然”自然地表达由已确立身份推出结果的关系。
- source_word: καὶ κληρονόμος
  choice: 也就……成为继承人
  rationale: “也就”显明儿子身份所带来的进一步结果；“继承人”是现代汉语中表达承受产业者的标准用语。
- source_word: διὰ θεοῦ
  choice: 借着上帝
  rationale: 按照SBLGNT正文直译介词短语，保留上帝是这一身份得以实现之中介或施行者的表述，不改写成异文中的“借着基督”。
theological_decisions:
- issue: υἱός的性别化亲属称谓
  choice: 儿子
  alternative: 儿女／孩子
  rationale: 本段论证涉及收养和继承权；“儿子”更完整地保留古代法律语境下的承嗣逻辑。脚注说明这身份并不限于男性，以免读者误解适用范围。
- issue: 末句的文本异文
  choice: 借着上帝成为继承人
  alternative: 借着基督作上帝的继承人／借着弥赛亚作上帝的继承人
  rationale: 主文遵循所给SBLGNT的διὰ θεοῦ；较显著的异文则放入脚注，不将其混入正文。
- issue: διὰ θεοῦ的语义表达
  choice: 借着上帝
  alternative: 由上帝使你成为继承人
  rationale: “借着上帝”较形式地保留διὰ加属格的措辞及原文可能具有的神学张力；意译为“由上帝”虽更明说施事关系，却会缩减原表达的开放性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“这样”承接上文推论；“既然……也就……”使论证层次清楚。保留“奴隶—儿子—继承人”的身份对照，并用脚注处理包容范围和文本异文。
