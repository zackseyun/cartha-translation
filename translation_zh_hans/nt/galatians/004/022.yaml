  text: γέγραπται γὰρ ὅτι Ἀβραὰμ δύο υἱοὺς ἔσχεν, ἕνα ἐκ τῆς παιδίσκης καὶ ἕνα ἐκ τῆς ἐλευθέρας·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/022.yaml
  text: For it is written that Abraham had two sons[a], one by the slave woman and one by the free woman.
translation:
  language: zh_hans
  text: 因为经上记着：亚伯拉罕有两个儿子，一个由为奴的女子所生，另一个由自由的女子所生。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται
  choice: 经上记着
  rationale: 这是引述或援引经文的固定表达；“经上记着”在现代中文中自然，并保留经文权威的意味。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文，为保罗先前的劝论提供根据。
- source_word: ὅτι
  choice: 冒号引出内容
  rationale: 中文以冒号自然引出“经上记着”的具体内容，无须机械译出“说”或“即”。
- source_word: Ἀβραὰμ
  choice: 亚伯拉罕
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: δύο υἱοὺς
  choice: 两个儿子
  rationale: υἱούς明确指儿子，不泛化为“孩子”。
- source_word: ἔσχεν
  choice: 有
  rationale: 忠实表达亲子关系，同时避免用“生了”把动作错误地直接归给亚伯拉罕。
- source_word: ἕνα ... καὶ ἕνα
  choice: 一个……另一个……
  rationale: 自然呈现希腊文平衡的对应结构。
- source_word: ἐκ
  choice: 所生的
  rationale: 在谱系和母子关系语境中，用“某女子所生”自然表达来源。
- source_word: παιδίσκης
  choice: 奴仆女子
  rationale: 该词指处于奴役或服役身份的年轻女子；“奴仆女子”既显明其非自由身份，又比“女奴”稍具尊严，并与下文“自由女子”形成明确对照。
- source_word: ἐλευθέρας
  choice: 自由女子
  rationale: 将作名词使用的形容词译为“自由女子”，准确保留法律和社会身份上的自由，并与“奴仆女子”平行。
theological_decisions:
- issue: 保罗论证中奴役与自由的社会身份对照
  choice: 译作“奴仆女子／自由女子”
  alternative: “使女／自主妇人”或“女奴／自由妇人”
  rationale: 上下文的论证依赖奴役与自由的对立，因此必须明确呈现身份差异；同时不把 παιδίσκη 的含义缩窄为现代雇佣意义的“女仆”，也不额外加入超出原文的教义解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“经上记着”保留经文引述语体；后半句以“所生的”补足中文表达所需信息，并维持两项之间整齐清楚的平行结构。
