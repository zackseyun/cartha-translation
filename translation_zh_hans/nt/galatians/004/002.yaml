  text: ἀλλὰ ὑπὸ ἐπιτρόπους ἐστὶ καὶ οἰκονόμους ἄχρι τῆς προθεσμίας τοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/002.yaml
  text: but he is under guardians and stewards until the time set by his father[a][b].
translation:
  language: zh_hans
  text: 而是受监护人和管家的管束，直到父亲所定的日期。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “管家”也可译作“产业管理人”；希腊语指管理家庭或产业事务的人。
    reason: lexical_alternative
  - marker: b
    text: “父亲所定的日期”也可译作“父亲所指定的时候”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: 反而
  rationale: 承接上一节的对比：继承人虽是全业的主人，幼年时实际处境却受人管束；“反而”自然呈现这种转折。
- source_word: ὑπὸ
  choice: 受……管束
  rationale: 这里表示处于他人的权柄或监管之下；译作“受……管束”既符合现代汉语，也保留从属意味。
- source_word: ἐπιτρόπους
  choice: 监护人
  rationale: 指受托照管未成年继承人的人；“监护人”准确表达对其人身与法律事务的监管。
- source_word: οἰκονόμους
  choice: 管家
  rationale: 指管理家庭或产业事务的人；“管家”保留古代家宅与产业管理的语境，并与“监护人”有所区分。
- source_word: ἄχρι τῆς προθεσμίας
  choice: 直到……所定的日期
  rationale: προθεσμία 指预先确定的时限或日期；此处“日期”简洁自然，并表达安排有明确终点。
- source_word: τοῦ πατρός
  choice: 父亲所定的
  rationale: 属格最自然地理解为父亲是确定该日期的人；汉语用主谓式定语清楚表达这一关系，同时不增加原文之外的神学含义。
theological_decisions:
- issue: τοῦ πατρός 中属格的理解
  choice: 译作“父亲所定的”，将父亲理解为确定日期者。
  alternative: 较为形式对应地译作“父亲的日期”或“父亲所指定的时候”。
  rationale: 在未成年继承人的比喻中，父亲设定结束监管的日期最合乎上下文。这是对家庭法律图景的句法理解，不借此预断后文的神学对应。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“监护人”和“管家”分别呈现照管未成年人及管理家产的职能；用“日期”表达预先确定的时限。
