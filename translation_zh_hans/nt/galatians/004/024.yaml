  text: ἅτινά ἐστιν ἀλληγορούμενα· αὗται γάρ εἰσιν δύο διαθῆκαι, μία μὲν ἀπὸ ὄρους Σινᾶ, εἰς δουλείαν γεννῶσα, ἥτις ἐστὶν Ἁγάρ,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/024.yaml
  text: 'These things are being interpreted allegorically[a], for these women are two covenants: one from Mount Sinai, bearing children for slavery[b]; she is Hagar.'
translation:
  language: zh_hans
  text: 这些事是按寓意来解说的[a]：这两个妇人就是两个约；其中一个约出自西奈山，生下儿女、使他们沦为奴隶[b]；这个约就是夏甲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这些事是按寓意解释的”，或“这些事是一个寓意”。希腊文表明，保罗正以寓意的方式运用前面的叙事。
    reason: lexical_alternative
  - marker: b
    text: 或译：“生下儿女归于奴役”，或“生下儿女受奴役”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅτινά
  choice: 这些事
  rationale: 中性复数关系代词回指上文有关夏甲和撒拉的叙事；译作“这些事”自然保留其回指作用。
- source_word: ἀλληγορούμενα
  choice: 含有寓意
  rationale: 该现在时被动分词与ἐστιν构成迂说结构，表明上文叙事正被赋予寓意性的解释或运用；“含有寓意”在现代汉语中自然，也不否认叙事的历史指向。
- source_word: αὗται
  choice: 这两个妇人
  rationale: 阴性复数指示代词指向刚提到的两个妇人；补出“妇人”可明确所指。
- source_word: διαθῆκαι
  choice: 两个约
  rationale: 西奈山及保罗论述的语境要求采用圣经中通行的“约”，而非“遗嘱”或一般性的“协议”。
- source_word: ἀπὸ ὄρους Σινᾶ
  choice: 出自西奈山
  rationale: ἀπό表示来源；“出自西奈山”简洁自然地表达该约的来源。
- source_word: εἰς δουλείαν
  choice: 成为奴隶
  rationale: εἰς具有趋向或结果意味，δουλεία指奴役状态；结合γεννῶσα译为“所生的儿女成为奴隶”，可清楚表达生产所导致的身份或处境。
- source_word: γεννῶσα
  choice: 所生的儿女
  rationale: 阴性单数现在时主动分词修饰以夏甲为代表的约；译文保留生育意象，并按汉语句法补出“儿女”。
- source_word: ἥτις ἐστὶν Ἁγάρ
  choice: 这个约就是夏甲
  rationale: 关系代词在语法上回指阴性单数的“约”；译作“这个约就是夏甲”明确保留寓意中的对应关系。
theological_decisions:
- issue: 保罗使用夏甲与撒拉叙事的性质
  choice: 译作“这些事含有寓意”，表达保罗对前述叙事所作的寓意性运用。
  alternative: 译作“这些事是寓言”，可能使人误以为保罗否定创世记叙事的历史指向；也可译作“这些事是按寓意解释的”。
  rationale: ἀλληγορούμενα描述一种寓意性的表达或解释方式。译文既不把它扁平化为虚构的“寓言”，也不超出原文裁定历史性问题。
- issue: δουλεία所表达的处境
  choice: 成为奴隶
  alternative: 受奴役；陷入奴役；为奴
  rationale: 这里强调该约所生者进入奴役处境。“成为奴隶”保留εἰς的结果或趋向意味，也保持保罗两约对比的力度。
- issue: 两个妇人与两个约的关系
  choice: 采用“代表”，说明寓意对应关系。
  alternative: 直译为“这两个妇人是两个约”。
  rationale: 汉语中的“代表”使比喻性等同更自然清楚，不把妇人与约理解为本体上的同一，同时不进一步规定这种对应的系统神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“含有寓意”避免把ἀλληγορούμενα误解为单纯虚构的“寓言”；主文以“代表”自然表达两个妇人与两个约的寓意对应。所有脚注标记均已置于主文相应位置。
