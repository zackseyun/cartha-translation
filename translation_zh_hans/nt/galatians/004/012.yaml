- from: 弟兄们[b]，我恳求你们：要成为像我一样的人[a]，因为我也像你们一样[c]。你们一点也没有亏负我。
  to: 弟兄们[b]，我恳求你们：要像我一样[a]，因为我也像你们一样[c]。你们并没有亏待我。
  rationale: 删除正文中原文未明示且汉语冗余的“人”，使Γίνεσθε ὡς ἐγώ译为更自然、直接的“要像我一样”。将“亏负我”改为“亏待我”，以更准确、现代的汉语表达οὐδέν με ἠδικήσατε所说的“你们没有不公地对待我”。保留κἀγὼ ὡς ὑμεῖς的省略性，另以脚注呈现按语境补作“成了”的可行理解。
