id: GAL.4.12
reference: Galatians 4:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Γίνεσθε ὡς ἐγώ, ὅτι κἀγὼ ὡς ὑμεῖς, ἀδελφοί, δέομαι ὑμῶν. οὐδέν με ἠδικήσατε·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/012.yaml
  text: Become as I am[a], because I also am as you are, brothers; I beg you[c][b], you did me no wrong.
translation:
  language: zh_hans
  text: 弟兄们[b]，我恳求你们：要像我一样[a]，因为我也像你们一样[c]。你们并没有亏待我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要成为像我一样。”
    reason: lexical_alternative
  - marker: b
    text: 这里的“弟兄们”是对信徒群体的称呼，很可能包括男性和女性。
    reason: cultural_note
  - marker: c
    text: 希腊文在这里省略了动词；也可理解为：“因为我也成了像你们一样的人。”
    reason: alternative_reading
lexical_decisions:
- source_word: Γίνεσθε
  choice: 要成为
  rationale: 保留 γίνομαι 所表达的进入或采取某种状态之意，也以“要”自然传达复数命令语气。
- source_word: ὡς ἐγώ
  choice: 像我一样的人
  rationale: 表达比较关系，并与“成为”自然衔接；脚注保留更简洁的译法。
- source_word: ὅτι
  choice: 因为
  rationale: 在此最自然地引出保罗劝求的理由，而不是引出所说的内容。
- source_word: κἀγὼ ὡς ὑμεῖς
  choice: 我也像你们一样
  rationale: 希腊文没有明说第二个限定动词；正文保留这种省略和状态上的比较，不擅自补成过去时“成了”。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 对应阳性复数呼格，同时用脚注说明这里很可能泛指整个信徒群体。
- source_word: δέομαι ὑμῶν
  choice: 我恳求你们
  rationale: 传达 δέομαι 所含的恳切请求，比“请求”更有感情色彩，又不显古奥。
- source_word: οὐδέν με ἠδικήσατε
  choice: 你们一点也没有亏负我
  rationale: “一点也没有”体现 οὐδέν 的全面否定；“亏负我”自然表达 ἀδικέω 对某人行不义或使其受亏损的含义。
theological_decisions:
- issue: ἀδελφοί 是否包括女性信徒
  choice: 正文译作“弟兄们”，脚注说明可能包括男女信徒
  alternative: 弟兄姊妹们；信徒同胞们
  rationale: 保留希腊文阳性复数称呼的形式，同时不掩盖其在群体称呼中的包容性。
- issue: κἀγὼ ὡς ὑμεῖς 中省略动词的理解
  choice: 我也像你们一样
  alternative: 我也成了像你们一样的人
  rationale: 原文没有重复限定动词，既可按当前状态理解，也可从前面的 Γίνεσθε 补出“成为”。正文不强行确定时态，脚注交代另一种合乎语境的补法。
translation_notes:
  register: 采用现代、庄重而口语可懂的普通话。“弟兄们，我恳求你们”前置，使汉语劝告结构自然清楚；正文保留第二分句的省略性，并以脚注呈现语境上可能的过去时理解。
