revisions:
- from: 但从前，你们不认识神的时候，曾受奴役，服事那些本性上并不是神的[a]。
  to: 但那时，你们还不认识神，曾受那些本性上不是神的[a]奴役。
  rationale: 修订将ἐδουλεύσατε统一译为“受……奴役”，既保留其受束缚、作奴仆的核心意义，也使汉语明确表示其所受奴役的对象。其余关键对照——不认识神、那些对象在本性上不是神——均予保留；脚注提供较贴近“作奴仆”的可行异译，且不预设这些对象的具体身份。
