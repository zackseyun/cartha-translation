  text: Ἀλλὰ τότε μὲν οὐκ εἰδότες θεὸν ἐδουλεύσατε τοῖς ⸂φύσει μὴ⸃ οὖσι θεοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/008.yaml
  text: But at that time[a], when you did not know God, you were enslaved to those that by nature are not gods.
translation:
  language: zh_hans
  text: 但那时，你们还不认识神，曾受那些本性上不是神的[a]奴役。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但从前，你们不认识神，曾作那些本性上并非神的奴仆。”
    reason: 保留τότε μέν译作“从前”、分词结构的紧凑表达，以及将δουλεύω译作“作……的奴仆”的可能。
lexical_decisions:
- source_word: Ἀλλὰ τότε μὲν
  choice: 但从前
  rationale: Ἀλλά承接上文形成转折；τότε μέν指向加拉太人过去的处境，并为下一节的今昔对比铺垫。“但从前”在现代汉语中自然简洁。
- source_word: οὐκ εἰδότες θεὸν
  choice: 你们不认识神的时候
  rationale: 将分词结构按时间关系表达；“认识神”既保留动词的基本含义，也容纳保罗语境中关系性的认识。
- source_word: ἐδουλεύσατε
  choice: 曾受奴役，服事
  rationale: δουλεύω既有作奴仆服事之义，也突出受辖制的状态。采用双层表达，既显明奴役主题，又使其与间接宾语的关系在汉语中清楚自然。
- source_word: τοῖς ... οὖσι θεοῖς
  choice: 那些……并不是神的
  rationale: 保留指称对象的开放性，不擅自解释为偶像或邪灵；末尾“的”将其名词化，符合现代汉语表达。
- source_word: φύσει μὴ
  choice: 本性上并不是
  rationale: φύσει说明这些对象实际、本质为何；“本性上”贴近原文，并保留其本体论否定。
- source_word: θεοῖς
  choice: 神
  rationale: 汉语“神”本身不标示单复数；在“那些……不是神的”结构中，复数所指已由“那些”表达，同时与前面的独一真神形成对照。
theological_decisions:
- issue: 从前受敬奉对象的性质
  choice: 译为“那些本性上并不是神的”
  alternative: “那些实际上并非神明的”或“那些被称为神、其实不是神的”
  rationale: 原文否定这些对象在本性上是神，却未明确说明它们究竟是偶像、邪灵或其他对象。因此正文保留泛指和神学张力，不加入原文没有的身份判定。
- issue: 奴役与服事的语义张力
  choice: 译为“曾受奴役，服事”
  alternative: “曾作……的奴仆”或“曾服事”
  rationale: 单译“服事”容易削弱《加拉太书》的奴役—自由主题；单译“受奴役于”在汉语中较生硬。合并表达兼顾语义力度与可读性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“但从前”简明承接上下文；“曾受奴役，服事”保留全书的重要奴役意象，同时避免生硬欧化句式。脚注标记已在正文出现。
