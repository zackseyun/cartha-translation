  source_fidelity: 原译准确呈现了“从前／那时”、不认识真神，以及这些对象“本性上不是神”的本体性否定；但“曾受奴役，服事”将同一动词的两种释义并列为正文谓语，造成关系不够清楚，且“受奴役”未明确由谁奴役。
  naturalness: “但那时，你们还不认识神，曾受……奴役”在现代标准汉语中更连贯自然，也清楚表达受奴役的对象。“还”在此自然标示与下一节现今状态的对比，并不增添原文没有的实质内容。
  terminology: 保留“神”作为对真神及复数θεοῖς的汉语对应，并借“那些”表达复数/泛指；保留“本性上不是神的”，不将对象限定为偶像或邪灵。以“受……奴役”保留δουλεύω在本段奴役—自由论证中的力度。
  issues:
