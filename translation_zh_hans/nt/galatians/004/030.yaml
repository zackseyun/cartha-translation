  text: ἀλλὰ τί λέγει ἡ γραφή; Ἔκβαλε τὴν παιδίσκην καὶ τὸν υἱὸν αὐτῆς, οὐ γὰρ μὴ ⸀κληρονομήσει ὁ υἱὸς τῆς παιδίσκης μετὰ τοῦ υἱοῦ τῆς ἐλευθέρας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/030.yaml
  text: But what does the Scripture say? “Cast out the slave woman and her son[c][b][a], for the son of the slave woman will certainly not inherit with the son of the free woman.”
translation:
  language: zh_hans
  text: 但经上怎么说呢？“把那女奴和她的儿子赶出去[a][b]！因为女奴的儿子绝不能与自由妇人的儿子一同承受产业[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “女奴”也可译作“使女”。希腊文指处于奴役身份的女性；本段以奴役和自由作对照。
    reason: lexical_alternative
  - marker: b
    text: 这段引文呼应《创世记》21:10。
    reason: cross_reference
  - marker: c
    text: 希腊文使用强调否定，可译作“绝不会承受产业”或“断不能承受产业”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: 但
  rationale: 承接上文形成鲜明转折，现代汉语中简洁自然。
- source_word: τί λέγει ἡ γραφή
  choice: 经上怎么说呢
  rationale: 保留现在时引述公式及圣经作为发言主体的表达；“经上”是现代中文圣经语体中清楚而庄重的说法。
- source_word: Ἔκβαλε
  choice: 赶出去
  rationale: 表达命令式和强制逐出的力度，较“打发走”更贴近ἐκβάλλω。
- source_word: παιδίσκην
  choice: 使女
  rationale: 指处于奴役身份的女性仆役；“使女”自然、庄重，并可由脚注说明其奴隶身份，从而保留本段奴役与自由的对照。
- source_word: υἱὸν αὐτῆς
  choice: 她的儿子
  rationale: 直接对应希腊文所有关系，不作增译。
- source_word: οὐ γὰρ μὴ κληρονομήσει
  choice: 因为……绝不能……承受产业
  rationale: “绝不能”传达οὐ μή加将来时所表达的强烈、断然否定。
- source_word: κληρονομήσει
  choice: 承受产业
  rationale: 在家庭与继承语境中，既表达作为继承人所得，也符合自然庄重的中文表达。
- source_word: μετὰ τοῦ υἱοῦ
  choice: 和……的儿子一同
  rationale: 明确表达共同参与继承的关联意义。
- source_word: τῆς ἐλευθέρας
  choice: 自由妇人
  rationale: 补出希腊文形容词名词化所隐含的“妇人”，并与“使女”的受奴役身份形成清楚对照。
theological_decisions:
- issue: παιδίσκη在撒拉与夏甲论述中的译法
  choice: 使女
  alternative: 女奴
  rationale: “使女”在庄重现代中文中较自然，同时脚注明确其受奴役身份，避免淡化本段奴役与自由的核心对照，也避免加入超出原文的宗派解释。
- issue: οὐ γὰρ μὴ κληρονομήσει的排除力度
  choice: 绝不能承受产业
  alternative: 绝不会承受产业／断不能承受产业
  rationale: 保留希腊文强调否定所表达的断然排除，不把该陈述进一步解释为特定神学体系中的结论。
translation_notes:
  register: 采用自然、庄重、普通现代读者易懂的简体中文。“经上怎么说呢”保留引述公式；“赶出去”保留命令的强烈语气；以“使女”配合脚注交代奴役身份，并用“自由妇人”维持上下文的神学张力。所有脚注标记均置于相关正文之后。
