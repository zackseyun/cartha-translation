  text: ⸂ὑμεῖς δέ, ἀδελφοί, κατὰ Ἰσαὰκ ἐπαγγελίας τέκνα ἐστέ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/028.yaml
  text: You[a], brothers, like Isaac, are children of promise.
translation:
  language: zh_hans
  text: 弟兄们[a]，你们却像以撒一样，是应许的儿女。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“弟兄们”采用原文的阳性复数称呼，是对全体会众的代表性称呼，很可能包括男性和女性。
    reason: 说明原文称呼的语法形式及其在会众语境中的包容范围。
lexical_decisions:
- source_word: ὑμεῖς
  choice: 你们
  rationale: 明确译出第二人称复数；汉语中置于称呼语之后自然清楚，也保留了原文对受信者的直接指称。
- source_word: δέ
  choice: 却
  rationale: 在上下文中标示温和的转折，将受信者与前述属使女的一方区别开来；“却”简洁自然，但不加入时间含义。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留原文阳性复数称呼的形式；这里是对会众的代表性称呼，所包含的男女范围在脚注中说明。
- source_word: κατὰ Ἰσαὰκ
  choice: 像以撒一样
  rationale: κατά在这里表达对应或模式，以撒是受信者作为“应许的儿女”的类比对象；此译法符合现代汉语习惯。
- source_word: ἐπαγγελίας
  choice: 应许的
  rationale: 保留属格结构及保罗“应许的儿女”这一凝练表达，不把它限定性地解释为“被应许的”或完全展开为“凭应许而生的”。
- source_word: τέκνα
  choice: 儿女
  rationale: τέκνα本身不限定性别；“儿女”在现代汉语中自然表达群体性的亲子身份，并与会众中男女皆包括的语境相合。
- source_word: ἐστέ
  choice: 是
  rationale: 直接表达第二人称复数现在时系词，将受信者与“应许的儿女”这一身份连接起来。
theological_decisions:
- issue: 受信者与以撒的关系及“应许的儿女”的身份
  choice: 译作“像以撒一样，是应许的儿女”
  alternative: 译作“像以撒一样，是凭应许而生的儿女”
  rationale: 原文以以撒为对应的模式，并以“应许的儿女”为谓语。正文保留属格短语的凝练与一定开放性，既呈现类比和应许所赋予的身份，又不把属格关系完全解释为出生方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“弟兄们”保留保罗书信中的直接称呼语气；“应许的儿女”保留原文神学表达的凝练性和属格关系的张力。
