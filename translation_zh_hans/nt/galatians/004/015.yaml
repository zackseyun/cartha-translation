  text: ⸀ποῦ ⸀οὖν ὁ μακαρισμὸς ὑμῶν; μαρτυρῶ γὰρ ὑμῖν ὅτι εἰ δυνατὸν τοὺς ὀφθαλμοὺς ὑμῶν ⸀ἐξορύξαντες ἐδώκατέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/015.yaml
  text: Where then is your blessedness? For I testify to you that[a], if possible[b], you would have torn out your eyes and given them to me.
translation:
  language: zh_hans
  text: 那么，你们当初的庆幸如今在哪里呢？[a] 我向你们作证：若有可能，你们当时甚至会把自己的眼睛挖出来给我。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “庆幸”也可译作“福气”或“有福”。希腊词可指蒙福的状态，也可指认定或宣称某人有福；这里指他们先前因接待保罗而以为自己有福的态度。
    reason: lexical_alternative
  - marker: b
    text: “把自己的眼睛挖出来”直译为“挖出、剜出你们的眼睛”。这很可能是夸张地形容他们先前的热忱；也有人认为这或许暗示保罗当时的身体状况。
    reason: lexical_alternative
lexical_decisions:
- source_word: ποῦ οὖν
  choice: 那么……如今在哪里呢
  rationale: 以反问表达 οὖν 的承接、推论意味；“如今”自然显出保罗追问他们先前态度后来如何，未将其扩写成明确断言。
- source_word: μακαρισμὸς ὑμῶν
  choice: 你们的福气
  rationale: μακαρισμός 可指蒙福的状态，也可指认定或宣称为有福；“福气”简洁自然，并以脚注保留另一层可能含义。
- source_word: μαρτυρῶ γὰρ ὑμῖν
  choice: 我可以向你们作证
  rationale: 保留 μαρτυρέω 郑重、见证式的语气；“向你们”将 ὑμῖν 理解为见证所面向的对象，同时避免汉语“为你们作证”可能被理解为替他们辩护。
- source_word: ὅτι
  choice: ：
  rationale: 用冒号自然引出见证的具体内容，功能上对应内容连接词 ὅτι。
- source_word: εἰ δυνατὸν
  choice: 若是可能
  rationale: 贴近希腊文简洁的条件表达，不把反事实意味强化为原文未明说的时态形式。
- source_word: τοὺς ὀφθαλμοὺς ὑμῶν ἐξορύξαντες
  choice: 把自己的眼睛挖出来
  rationale: ἐξορύσσω 的画面强烈，含有挖出、剜出之意；保留“眼睛”的具体形象，不泛化为“什么都肯给”。
- source_word: ἐδώκατέ μοι
  choice: 给我
  rationale: 依汉语习惯承接“把”字结构；所给之物由前面的“眼睛”清楚指明，无须另加代词。
theological_decisions:
- issue: 挖出眼睛的说法应按具体形象保留，还是弱化为一般性的慷慨
  choice: 正文保留“把自己的眼睛挖出来给我”
  alternative: 译为“你们什么都肯给我”
  rationale: 原文明确提到眼睛，并使用强烈的动作词。此话可能是夸张地描述加拉太人先前的热忱，也可能使人联想到保罗的身体状况；译文不替读者裁定。
- issue: μακαρισμός 指蒙福状态还是自认有福、庆幸的态度
  choice: 正文译作“福气”，脚注说明“庆幸”的可能
  alternative: 正文译作“你们当时的庆幸”
  rationale: “福气”较直接保留“有福”的词义核心；脚注则保存它也可指认定自己有福或庆幸的语用含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那么……如今在哪里呢”保留责问语气；“甚至”虽非独立对应某一希腊词，却自然传达挖眼这一极端假设的语势。脚注标记均已置于正文相应位置。
