  text: ἀλλ’ ὥσπερ τότε ὁ κατὰ σάρκα γεννηθεὶς ἐδίωκε τὸν κατὰ πνεῦμα, οὕτως καὶ νῦν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/029.yaml
  text: But just as then the one born according to the flesh persecuted the one born according to the Spirit[b][a], so also it is now.
translation:
  language: zh_hans
  text: 但是，正如当时那按肉身而生的[a]逼迫那按圣灵而生的[b]，如今也是这样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那按通常人的方式生的”；直译：“那按肉身而生的”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“那按圣灵的”；原文此处省略“生的”，译文从前半句补出，以显明两者的对照。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: 然而
  rationale: 承接上文并标明转折；“然而”简洁、庄重，也符合现代书面汉语。
- source_word: ὥσπερ τότε ... οὕτως καὶ νῦν
  choice: 当时……怎样……现在也是这样
  rationale: 保留希腊文“正如当时……现在也照样”的关联比较和今昔对照，同时采用自然的汉语句式。
- source_word: ὁ ... γεννηθεὶς
  choice: 那……生的
  rationale: 将带冠词的被动分词译成名词性结构，符合现代汉语表达；后半句补出“生的”，使对偶关系清楚。
- source_word: κατὰ σάρκα
  choice: 按着肉身
  rationale: 保留σάρξ的字面意象及其与“圣灵”的对照，不把本处过度解释为“罪性”；脚注说明其在语境中可指通常的人力生育。
- source_word: ἐδίωκε
  choice: 逼迫
  rationale: 准确表达διώκω在此处的敌对、压迫含义；希腊文未完成时在比较性叙述中不必机械译成持续体。
- source_word: τὸν κατὰ πνεῦμα
  choice: 那按着圣灵生的
  rationale: 原文后半句省略“生的”，由前句承接；正文补出以呈现清楚的平行关系，并用脚注保留原文省略现象。
- source_word: πνεῦμα
  choice: 圣灵
  rationale: 加拉太书的救赎历史及应许语境表明，这里最可能指神的灵，而非人的灵或抽象的属灵原则。
- source_word: νῦν
  choice: 现在
  rationale: 直接表达古时模式在保罗当下处境中的延续。
theological_decisions:
- issue: κατὰ σάρκα在以实玛利与以撒对比中的含义
  choice: 正文译为“按着肉身”，语境上指按通常的人力和生育方式出生
  alternative: 按着罪性出生；以属世的方式出生
  rationale: 加拉太书4:23、29把通常的生育与凭应许、按圣灵而生相对照；保留“肉身”既维持保罗的用词联系，又避免把本处限定为道德意义上的罪性。
- issue: πνεῦμα的所指
  choice: 圣灵
  alternative: 人的灵；属灵领域或原则
  rationale: 在撒拉与夏甲的比喻、应许之子及信徒身份的上下文中，神的灵是最合适的理解；译作“圣灵”明确这一判断。
- issue: 后半句是否补出“生的”
  choice: 正文补出“生的”
  alternative: 直译为“那按着圣灵的”
  rationale: 希腊文通过省略形成紧凑平行，“生的”可由前句自然补足；汉语正文补出后意思更明确，脚注则交代原文形式。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“按着肉身／按着圣灵”保留保罗刻意构成的神学对照；“逼迫”使用读者熟悉且准确的圣经语汇。脚注标记依其在正文相关短语后的自然次序排列。
