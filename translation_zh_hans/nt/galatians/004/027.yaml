language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: γέγραπται γάρ· Εὐφράνθητι, στεῖρα ἡ οὐ τίκτουσα, ῥῆξον καὶ βόησον, ἡ οὐκ ὠδίνουσα· ὅτι πολλὰ τὰ τέκνα τῆς ἐρήμου μᾶλλον ἢ τῆς ἐχούσης τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/027.yaml
  text: 'For it is written: “Rejoice[a], barren woman who is not bearing children; break forth and cry out, you who are not in labor[c][b]; because the children of the desolate woman are more numerous than those of the woman who has a husband.”'
translation:
  language: zh_hans
  text: 因为经上记着：“不能生育、没有生产的女子啊，要欢喜[a]！没有经历产痛的女子啊，要爆发出欢呼，大声呼喊[b]！因为荒凉的女子[c]，她的儿女比有丈夫的女子的儿女还多。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 引自《以赛亚书》54:1。
    reason: cross_reference
  - marker: b
    text: “要爆发出欢呼，大声呼喊”也可译作“要迸发欢声，放声高呼”。
    reason: lexical_alternative
  - marker: c
    text: “荒凉的女子”所译的词在此拟人化语境中也可表示“孤单的”或“被遗弃的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: 经上记着
  rationale: 这是引介圣经引文的完成时被动表达；“经上记着”既符合现代中文圣经语体，也保留经文写下后持续有效的意味。
- source_word: Εὐφράνθητι
  choice: 要欢喜
  rationale: 准确表达喜乐、欢欣的命令，并保持先知性引文庄重而有号召力的语气。
- source_word: στεῖρα ἡ οὐ τίκτουσα
  choice: 不能生育、没有生产过的女子
  rationale: στεῖρα是作名词用的形容词，指不能生育的女子；现在分词οὐ τίκτουσα进一步描写她没有生产。译文保留两层近义描写，而不将其合并删减。
- source_word: ῥῆξον καὶ βόησον
  choice: 要放声高呼
  rationale: 两词合用描写突然迸发并大声呼喊；中文以“放声高呼”自然表达这一组合动作，同时维持诗歌节奏。
- source_word: ἡ οὐκ ὠδίνουσα
  choice: 没有经历产痛的女子
  rationale: ὠδίνω特指生产时的阵痛；此译法明确保留母腹生产的比喻。
- source_word: πολλὰ τὰ τέκνα
  choice: 儿女……还多
  rationale: 按中文比较句式自然重组，保留儿女数目更多的断言。
- source_word: τῆς ἐρήμου
  choice: 被遗弃的女子
  rationale: ἔρημος在此拟人化语境中指孤单、被撇下或荒凉的女子；“被遗弃”凸显她与“有丈夫的女子”之间的对照。
- source_word: μᾶλλον ἢ
  choice: 比……还多
  rationale: 直接、自然地表达数量上的比较。
- source_word: τῆς ἐχούσης τὸν ἄνδρα
  choice: 有丈夫的女子
  rationale: 贴近希腊文结构，并明确ἀνήρ在此意为“丈夫”，不笼统改译为“已婚女子”。
theological_decisions:
- issue: 加拉太书4章寓意论证中的旧约引文
  choice: 按以赛亚书54:1的先知性意象直接翻译，不在引文本身加入撒拉、在上的耶路撒冷等解释性身份。
  alternative: 在译文中明确指出被遗弃的女子代表撒拉或在上的耶路撒冷。
  rationale: 本节明确引述经文；保留引文自身的意象和张力，让保罗在上下文中的论证说明其应用，避免把解释嵌入译文。
- issue: τῆς ἐρήμου所指女子的处境
  choice: 译作“被遗弃的女子”，同时以脚注保留“孤单”或“荒凉”的词义可能。
  alternative: 译作“荒凉的女子”或“孤单的女子”。
  rationale: 该词既可描述荒凉，也可在拟人语境中描述遭撇下或孤单；上下文与“有丈夫的女子”对照，但原词的语义幅度不应被完全抹去。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。引文保留先知诗歌的呼告、排比和生育意象；以两个感叹句呈现命令的力度，并避免使用“石女”“劬劳”等较陈旧或可能造成额外联想的词。
