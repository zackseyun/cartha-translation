  text: ἡ δὲ ἄνω Ἰερουσαλὴμ ἐλευθέρα ἐστίν, ἥτις ἐστὶν ⸀μήτηρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/026.yaml
  text: But the Jerusalem above is free[a], and she is our mother.
translation:
  language: zh_hans
  text: 然而，在上的耶路撒冷是自由的；她[a]就是我们的母亲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“这耶路撒冷就是我们的母亲。”希腊语用阴性关系代词承接“耶路撒冷”，并将她描写为母亲。
    reason: 说明关系代词的较形式对应及原文的拟人表达。
lexical_decisions:
- source_word: δὲ
  choice: 然而
  rationale: 承接上文“现今的耶路撒冷”，表达鲜明对比；“然而”在现代汉语中自然、庄重。
- source_word: ἄνω
  choice: 在上的
  rationale: 保留原文“上方、在上”的空间隐喻及其与地上耶路撒冷的对照，避免直接解释为“天上的”。
- source_word: Ἰερουσαλήμ
  choice: 耶路撒冷
  rationale: 采用现代中文圣经及一般中文通行的专名译法。
- source_word: ἐλευθέρα
  choice: 自由的
  rationale: 作为表语形容耶路撒冷的身份，与上下文“为奴—自由”的对比相连；不增添原文没有明说的“妇人”。
- source_word: ἥτις
  choice: 她……就是
  rationale: 该阴性关系代词承接“耶路撒冷”，并引出对其母亲身份的说明；用“她”自然保留拟人化，“就是”体现说明语气。
- source_word: μήτηρ
  choice: 母亲
  rationale: 直接保留保罗在夏甲、撒拉和两个耶路撒冷的比喻中核心的母亲意象。
- source_word: ἡμῶν
  choice: 我们的
  rationale: 准确表达第一人称复数属格，采用自然的现代汉语领属结构。
theological_decisions:
- issue: “在上的耶路撒冷”的所指及拟人表达
  choice: 译作“在上的耶路撒冷”，并以“她”作为母亲来指称。
  alternative: 译作“天上的耶路撒冷”，或不用人称代词而译作“这耶路撒冷就是我们的母亲”。
  rationale: “在上的”保留原文空间性表达及其超越性的张力，而不把它完全解释为“天上的”；阴性关系代词和“母亲”意象支持拟人化的“她”。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“在上的”略带经文语体，但可自然保留原文隐喻；分号清楚呈现“自由”与“我们的母亲”两个紧密相连的陈述。
