  text: Θαυμάζω ὅτι οὕτως ταχέως μετατίθεσθε ἀπὸ τοῦ καλέσαντος ὑμᾶς ἐν χάριτι Χριστοῦ εἰς ἕτερον εὐαγγέλιον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/006.yaml
  text: I am astonished that you are so quickly deserting the one who called you in the grace of Messiah for a different gospel[c][b][a],
translation:
  language: zh_hans
  text: 我很惊讶，你们竟这么快就背离那位在弥赛亚[b]的恩典中[a]呼召你们的，转向一个不同的福音。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“借着弥赛亚的恩典。”这里的介词既可表示所处的领域，也可表示所凭借的方式。
    reason: alternative_reading
  - marker: b
    text: 希腊文为“基督”；这里译作“弥赛亚”，因为该词在此具有称号的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: Θαυμάζω
  choice: 我很惊讶
  rationale: 以自然的现代汉语表达保罗震惊且不满的语气，不弱化为较中性的“我希奇”。
- source_word: οὕτως ταχέως
  choice: 竟这么快就
  rationale: “这么快”保留速度之快，“竟……就”在汉语中自然传达出乎意料和责备意味。
- source_word: μετατίθεσθε
  choice: 离弃了……转向
  rationale: 该动词在本语境中不只是改变观点，而是离开呼召他们的那一位、转向另一信息；拆译为“离弃……转向”可清楚表达关系上的背离及方向变化。
- source_word: τοῦ καλέσαντος ὑμᾶς
  choice: 那位……呼召你们的
  rationale: 保留原文未明说呼召者身份的表达，也体现呼召发生在先。
- source_word: ἐν χάριτι Χριστοῦ
  choice: 在弥赛亚的恩典中
  rationale: 较贴近地保留ἐν加与格的表达，不在正文中限定它究竟表示范围还是凭借；另一可能以脚注说明。
- source_word: Χριστοῦ
  choice: 弥赛亚
  rationale: Χριστός在此保有称号的语义；“弥赛亚”能直接呈现“受膏者”这一称号，而非仅作姓名处理。
- source_word: εἰς ἕτερον εὐαγγέλιον
  choice: 转向一个不同的福音
  rationale: “转向”呈现εἰς所表示的趋向；“不同的”体现ἕτερον在下文对比中所带的性质差异，同时脚注保留“另一个”的译法。
theological_decisions:
- issue: “呼召你们的那位”所指是谁
  choice: 正文不补出“上帝”或“基督”
  alternative: 译作“呼召你们的上帝”或“呼召你们的基督”
  rationale: 希腊文在本句中没有明说主语；保留含蓄表达，避免把解释性结论写入正文。
- issue: ἐν χάριτι Χριστοῦ中ἐν的语义
  choice: 在弥赛亚的恩典中
  alternative: 借着弥赛亚的恩典
  rationale: 介词可表达范围或凭借；正文采用较形式对应的“在……中”，并以脚注保留工具性理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“竟这么快就”自然传达保罗的惊愕和责备；句末用感叹号体现原句强烈语气。正文保留呼召者身份及介词含义上的开放性。
