  text: οὐδὲ ἀνῆλθον εἰς Ἱεροσόλυμα πρὸς τοὺς πρὸ ἐμοῦ ἀποστόλους, ἀλλὰ ἀπῆλθον εἰς Ἀραβίαν, καὶ πάλιν ὑπέστρεψα εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/017.yaml
  text: Nor did I go up to Jerusalem to those who were apostles before me, but I went away to Arabia, and returned again to Damascus.
translation:
  language: zh_hans
  text: 我也没有上耶路撒冷去见那些比我先作使徒的人，而是去了阿拉伯，又回到大马士革。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ
  choice: 也没有
  rationale: 承接上文的否定，并自然连接本句；现代汉语用“也没有”能保留其递进性的否定语篇功能。
- source_word: ἀνῆλθον
  choice: 上
  rationale: 保留前往耶路撒冷惯用的“上去”观念；在“上耶路撒冷”中简洁自然。
- source_word: Ἱεροσόλυμα
  choice: 耶路撒冷
  rationale: 该地名的现代汉语标准译名。
- source_word: πρὸς τοὺς πρὸ ἐμοῦ ἀποστόλους
  choice: 去见那些比我先作使徒的人
  rationale: πρός在人物宾语前结合旅行语境，可自然表达“去见”；“比我先作使徒”明确保留时间上的先后，而不暗示地位高低。
- source_word: ἀλλὰ
  choice: 而是
  rationale: 与前面的否定构成汉语自然的“不是……而是……”式对比。
- source_word: ἀπῆλθον
  choice: 去了
  rationale: 在目的地“阿拉伯”之前用“去了”最自然；上下文已体现其离开原处的意义，无须生硬译作“离去”。
- source_word: Ἀραβίαν
  choice: 阿拉伯
  rationale: 该地区名称的标准汉语译法；经文本身没有界定其确切历史范围。
- source_word: πάλιν
  choice: 又
  rationale: 与“回到”搭配，自然表达再次、返回的语义。
- source_word: ὑπέστρεψα
  choice: 回到
  rationale: 准确表达旅行语境中的返回，并与目的地“大马士革”自然搭配。
- source_word: Δαμασκόν
  choice: 大马士革
  rationale: 该城市名称的现代汉语标准译名。
theological_decisions:
- issue: “比我先”修饰使徒时所表达的关系
  choice: 指在保罗之前已经作使徒的人，即时间上的先后
  alternative: 指地位或权柄高于保罗的使徒
  rationale: πρὸ ἐμοῦ最自然地表示时间优先；译文以“比我先作使徒”保留这一点，不额外引入使徒之间的等级判断。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“上耶路撒冷”保留圣经旅行叙述中的惯用表达；“去见”使πρός所表达的趋向在汉语中清楚自然。
