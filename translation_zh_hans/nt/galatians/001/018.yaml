id: GAL.1.18
reference: Galatians 1:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἔπειτα μετὰ ⸂ἔτη τρία⸃ ἀνῆλθον εἰς Ἱεροσόλυμα ἱστορῆσαι ⸀Κηφᾶν, καὶ ἐπέμεινα πρὸς αὐτὸν ἡμέρας δεκαπέντε·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/018.yaml
  text: Then after three years I went up to Jerusalem to visit Cephas[b][a], and I stayed with him fifteen days.
translation:
  language: zh_hans
  text: 后来，过了三年，我上耶路撒冷去拜访矶法[a][b]，同他住了十五天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“去结识矶法”。这个希腊词也可含有通过亲自会面而认识某人的意思。
    reason: lexical_alternative
  - marker: b
    text: 矶法是彼得的亚兰语名字。
    reason: name_explanation
lexical_decisions:
- source_word: Ἔπειτα
  choice: 后来
  rationale: 表示保罗叙述中的下一件事；“后来”自然地承接上文，又不额外规定事件间隔的性质。
- source_word: μετὰ ἔτη τρία
  choice: 过了三年
  rationale: 直接表达时间经过，符合现代汉语习惯，并保留“三年”从何时起算在上下文中的一定开放性。
- source_word: ἀνῆλθον
  choice: 上……去
  rationale: 保留前往耶路撒冷时“上去”的方向性表达，这也符合圣经时代对赴耶路撒冷行程的通常说法。
- source_word: Ἱεροσόλυμα
  choice: 耶路撒冷
  rationale: 采用该地名通行的现代中文译名。
- source_word: ἱστορῆσαι
  choice: 拜访
  rationale: 此处指有目的地亲自会见矶法；“拜访”自然易懂，同时以脚注保留“结识、通过会面认识”的词义可能。
- source_word: Κηφᾶν
  choice: 矶法
  rationale: 保留保罗在本节所用的名字形式，不在正文中直接改写成“彼得”；“矶法”是中文圣经传统中通行的音译。
- source_word: ἐπέμεινα πρὸς αὐτὸν
  choice: 同他住了
  rationale: 自然表达保罗在矶法那里停留并与他相处一段时间，不额外断定具体住宿安排。
- source_word: ἡμέρας δεκαπέντε
  choice: 十五天
  rationale: 准确表达持续时间；汉语在“住了”之后无需另加介词即可清楚表示时长。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“后来，过了三年”保留原文叙事推进与时间表达；正文用“拜访”避免生硬，脚注则说明ἱστορῆσαι较少见的“亲自会面而认识”这一层含义。
