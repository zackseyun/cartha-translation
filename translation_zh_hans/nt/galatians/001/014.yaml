base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/014.yaml
  text: And I was advancing in Judaism beyond many of my contemporaries among my people[b][a], being far more zealous for the traditions of my fathers.
translation:
  language: zh_hans
  text: 我在犹太教[a]中比本族许多同龄人更有长进，对祖辈传下来的传统格外热心。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太教”也可译为“犹太人的宗教”或“犹太人的生活方式”，视上下文对Ἰουδαϊσμός所指范围的理解而定。
    reason: lexical_alternative
lexical_decisions:
- source_word: προέκοπτον
  choice: 不断长进
  rationale: 未完成时表示过去持续进行的进展；“不断长进”既保留过程性，也与后面的比较结构自然衔接。
- source_word: Ἰουδαϊσμῷ
  choice: 犹太教
  rationale: 这是现代汉语中简明、通行的对应词；脚注同时保留该词可能涵盖犹太信仰及生活方式的较广含义。
- source_word: ὑπὲρ πολλοὺς συνηλικιώτας
  choice: 超过……许多同龄人
  rationale: ὑπέρ在此表示比较，συνηλικιώτας特指年龄相仿的人；该译法准确而自然。
- source_word: ἐν τῷ γένει μου
  choice: 本族
  rationale: γένος在此指保罗所属的民族或族群；“本族”简洁保留族群关系，又避免现代“种族”一词可能造成的误解。
- source_word: περισσοτέρως ζηλωτὴς ὑπάρχων
  choice: 更是格外热心
  rationale: 保留περισσοτέρως的加强和比较意味，并以自然汉语表达ζηλωτής所指的强烈热忱，不赋予政治性“激进分子”的含义。
- source_word: τῶν πατρικῶν μου παραδόσεων
  choice: 对祖辈传下来的传统
  rationale: πατρικός指来自先祖、父辈的，παράδοσις指传承下来的传统；此译法清楚表达传统的祖传性质，且符合现代汉语。
theological_decisions:
- issue: Ἰουδαϊσμός的范围
  choice: 正文译作“犹太教”，并以脚注说明其较广含义
  alternative: 犹太人的信仰和生活方式
  rationale: 正文采用通行名称，不把该词限制为纯粹抽象的宗教体系；脚注保留其可能同时涉及群体生活方式的语义宽度。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“不断长进”呈现未完成时的持续性；“本族许多同龄人”保持原文族群与年龄两层限定；末句不补入因果关系，以保留希腊文分词结构与主句之间较开放的逻辑联系。
