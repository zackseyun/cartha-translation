base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/011.yaml
  text: For I make known to you[a], brothers[b], that the gospel proclaimed by me is not according to man.
translation:
  language: zh_hans
  text: 弟兄们，我要让你们知道：我所传讲的福音不是出于人的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 直译“不是按照人”；这句话也可理解为“不是按照人的标准”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζω ὑμῖν
  choice: 我告诉你们
  rationale: 该表达字面上有“使你们知道”之意，在这里用于引出郑重说明。译作“我告诉你们”既符合现代汉语，又保留其宣告意味。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ承接上文，说明保罗前述论断的理由；“因为”保留了这一解释性连接。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 原文为阳性复数称呼，在保罗书信中常指整个信徒群体。正文采用传统而准确的“弟兄们”，并以脚注说明可包括姊妹。
- source_word: εὐαγγέλιον
  choice: 福音
  rationale: “福音”是现代中文圣经语境中清楚、简洁且通行的对应词，适合此处保罗用语的特定含义。
- source_word: τὸ εὐαγγελισθὲν ὑπ’ ἐμοῦ
  choice: 我所传的
  rationale: 原文指由保罗宣讲的福音。“我所传的”自然简洁，并保留公开传扬的意思。
- source_word: κατὰ ἄνθρωπον
  choice: 出于人
  rationale: κατά加宾格在此可表达来源或衡量标准。下节否认这福音是从人领受或由人教导，因此正文采用更合上下文的来源义“出于人”，同时在脚注保留较贴近字面的表达及标准义。
theological_decisions:
- issue: κατὰ ἄνθρωπον表示人的来源，还是人的标准
  choice: 出于人
  alternative: 按照人；按照人的标准
  rationale: 加拉太书1:12紧接着说明保罗并非从人领受福音，也不是人教导他的，因此来源义在当前语境中较为突出。不过，原短语本身可有“按照人的标准”之意，故在脚注中保留这一真实歧义。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“我告诉你们”避免生硬的“我使你们知道”；“出于人”简洁呈现上下文所强调的来源，同时以脚注保存原文可能具有的标准义。
