  text: ἃ δὲ γράφω ὑμῖν, ἰδοὺ ἐνώπιον τοῦ θεοῦ ὅτι οὐ ψεύδομαι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/020.yaml
  text: What I am writing to you—behold[a], before God[b], I am not lying.
translation:
  language: zh_hans
  text: 我写给你们的这些话——看哪[a]，在上帝面前[b]，我没有撒谎。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看哪”译自一个表示郑重提示和强调的希腊语词。
    reason: lexical_alternative
  - marker: b
    text: “在上帝面前”也可理解为“在上帝的鉴察之下”，强调说话者要向上帝负责。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
  choice: ……的话
  rationale: 中性复数关系代词在这里概括保罗正在写下的内容；以“我写给你们的这些话”表达，符合现代汉语习惯，也保留其所指的复数内容感。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ在此是轻微的语篇推进词，并非强烈转折；汉语可由句序和破折号自然体现，无须硬加“但是”或“现在”。
- source_word: γράφω ὑμῖν
  choice: 我写给你们
  rationale: 保留现在时的书信语境以及ὑμῖν所标明的收信对象；现代汉语无需另加进行体标记。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留该提示词所带的郑重、强调作用；“看哪”虽有庄重色彩，但在经文语体中清楚而不晦涩。
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: 在上帝面前
  rationale: 直译其空间性表达，同时传达保罗自觉在上帝鉴察和问责之下所作的郑重申明。
- source_word: ὅτι
  choice: 不单独译出
  rationale: ὅτι引出郑重申明的内容；汉语可通过停顿直接连接，无须译成“即”。
- source_word: οὐ ψεύδομαι
  choice: 我没有撒谎
  rationale: 直接、自然地表达保罗对自己所写内容真实性的否认式保证；“没有撒谎”贴合当前陈述语境。
theological_decisions:
- issue: 保罗在上帝面前申明的力度
  choice: 译为“在上帝面前，我没有撒谎”，保留向上帝负责的郑重意味
  alternative: 明确扩写为“我指着上帝起誓”或弱化为一般性的“我说的是真的”
  rationale: 原文具有近似誓言的庄严和问责意味，却没有明确使用“起誓”一词；本译法既不削弱其力度，也不将其定性为正式誓言。
translation_notes:
  register: 采用现代、庄重而清楚的书信语体。“看哪”保留原文突出的郑重提示；破折号和逗号呈现保罗插入式、近似誓言的强调结构。
