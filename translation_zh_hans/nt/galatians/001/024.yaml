  text: And they glorified God because of me[a].
translation:
  language: zh_hans
  text: 他们因着我荣耀上帝[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或直译：“他们在我里面荣耀上帝。”
    reason: 保留ἐν ἐμοὶ较为字面的译法及其可能表达的含义。
lexical_decisions:
- source_word: καὶ
  choice: 就
  rationale: 承接前文所述犹太各教会听见保罗经历后的反应；“就”自然表达叙事上的承接与结果关系，而不把连接词过度直译为“并且”。
- source_word: ἐδόξαζον
  choice: 荣耀
  rationale: δοξάζω在此指把荣耀归给上帝。希腊文未完成时可表示持续或反复的行动；现代汉语用“荣耀”即可自然表达，时态体貌含义由上下文承载。
- source_word: ἐν ἐμοὶ
  choice: 因我
  rationale: ἐν字面为“在……里面”，但此处结合上文，最自然地表示这些教会因保罗身上发生的事而荣耀上帝。“因我”保留保罗作为缘由或关联对象的表达，同时在脚注中保留更直译的可能。
- source_word: τὸν θεόν
  choice: 上帝
  rationale: 作为ἐδόξαζον的宾语，采用现代标准普通话中庄重且通行的“上帝”。
theological_decisions:
- issue: ἐν ἐμοὶ的含义
  choice: 因我（因保罗及发生在他身上的事）
  alternative: 在我里面
  rationale: 上下文描述犹太各教会听见保罗从逼迫者转变为传道者后所作的回应，因此因果或关联义最符合现代汉语表达。不过，原文介词短语仍可直译为“在我里面”，可能突出上帝在保罗身上的作为，故以脚注保存这一张力。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准普通话。“他们”承接上文的犹太各教会；“就”使单节在上下文中衔接顺畅。脚注标记已置于相关短语之后。
