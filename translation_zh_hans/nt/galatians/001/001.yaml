id: GAL.1.1
reference: Galatians 1:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος, οὐκ ἀπ’ ἀνθρώπων οὐδὲ δι’ ἀνθρώπου ἀλλὰ διὰ Ἰησοῦ Χριστοῦ καὶ θεοῦ πατρὸς τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/001.yaml
  text: Paul[a], an apostle—not from men nor through a man, but through Jesus the Messiah and God the Father, who raised him from the dead,
translation:
  language: zh_hans
  text: 保罗，作使徒不是出于人，也不是借着某个人，而是借着耶稣弥赛亚[a]和那使他从死人中复活的父神。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶稣弥赛亚”也可译作“耶稣基督”。
    reason: Χριστός既可突出“弥赛亚”这一称号，也常按传统音义译为“基督”。
lexical_decisions:
- source_word: ἀπόστολος
  choice: 使徒
  rationale: 这是保罗自我表明受差遣身份的正式称谓；“使徒”既是现代中文读者熟悉的术语，也保留了该职分的分量。
- source_word: ἀπ’ ἀνθρώπων
  choice: 出于人
  rationale: ἀπό加属格表示来源。“出于人”自然表达其使徒身份并非源自人类，同时与下文表示中介的“借着某个人”形成对照。
- source_word: δι’ ἀνθρώπου
  choice: 借着某个人
  rationale: διά加属格在此表示中介或施行者；“某个人”明确保留希腊文单数，与前面的集合性“人”相对。
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: 借着耶稣弥赛亚
  rationale: 重复使用“借着”呈现διά所表达的中介或施行关系，并保留与前句的修辞平衡；将Χριστός作为称号译为“弥赛亚”。
- source_word: θεοῦ πατρὸς
  choice: 父上帝
  rationale: 这是指上帝为父的称谓。“父上帝”在现代中文中清楚、庄重，并与“耶稣弥赛亚”共同受“借着”支配。
- source_word: τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν
  choice: 使他从死人中复活的
  rationale: 将带冠词的分词短语直接用作“父上帝”的定语；“他”指耶稣，“从死人中复活”保留ἐκ νεκρῶν的群体背景及复活宣告。
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ中Χριστοῦ的译法
  choice: 耶稣弥赛亚
  alternative: 耶稣基督
  rationale: 此处Χριστός仍可听作“受膏者／弥赛亚”的称号，而不必视为固定姓名的一部分；正文保留称号含义，脚注提供传统译法。
- issue: 保罗使徒身份的来源与中介
  choice: 区分“出于人”与“借着某个人”
  alternative: 统一意译为“不是人所委派的”
  rationale: 原文分别使用ἀπό和διά，并刻意形成复数与单数、来源与中介的双重对照；译文不把这层张力压平。
- issue: 复活分句所修饰的对象
  choice: 将“使他从死人中复活的”限定“父上帝”
  alternative: 改写为独立分句“父上帝使他从死人中复活”
  rationale: 希腊文带冠词的分词在语法上修饰紧邻的“父上帝”；定语结构既保持此关系，也避免误解为耶稣和父共同作该分词的主语。
translation_notes:
  register: 采用现代、庄重而易懂的书信开篇语体。“作使徒不是出于人”避免生硬复制希腊文同位结构，同时不添加“蒙召”“委任”等原文未明说的概念；“某个人”使单数对照在中文中可见。
