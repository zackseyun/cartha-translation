  text: ὃ οὐκ ἔστιν ἄλλο· εἰ μή τινές εἰσιν οἱ ταράσσοντες ὑμᾶς καὶ θέλοντες μεταστρέψαι τὸ εὐαγγέλιον τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/007.yaml
  text: which is not another gospel[b][a]; except that there are some who are troubling you and wanting to distort the gospel of Messiah.
translation:
  language: zh_hans
  text: 那并不是另一个福音；不过，有些人正在搅扰你们，想要歪曲弥赛亚[a]的福音。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”或译“基督”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ οὐκ ἔστιν ἄλλο
  choice: 那并不是另一个福音
  rationale: ὃ承接上一节所说的“福音”；ἄλλο本身未重复名词，但其所指显然是“福音”。中文补出“福音”，既清楚又保留保罗否认另有真正福音的语气。
- source_word: εἰ μή
  choice: 不过
  rationale: 此处不是提出严格条件，而是转折性地说明实际情形；“不过”符合现代汉语，也保留对前句的限定和解释。
- source_word: ταράσσοντες
  choice: 正在搅扰
  rationale: 既表达持续发生的动作，也保留该词使人不安、混乱的语义，而不额外限定搅扰的具体方式。
- source_word: θέλοντες
  choice: 想要
  rationale: 直接表达这些人的意图，语气自然，不把意愿强化为已经得逞。
- source_word: μεταστρέψαι
  choice: 歪曲
  rationale: 该词指把事物改变成相反或败坏的样子；“歪曲”清楚表达对福音的扭曲，同时避免较生硬或可能引起别义的措辞。
- source_word: τὸ εὐαγγέλιον
  choice: 福音
  rationale: “福音”是现代中文基督教语境中通行且易懂的对应词，在保罗书信中也能保留其特定概念的连贯性。
- source_word: τοῦ Χριστοῦ
  choice: 弥赛亚的
  rationale: Χριστός在此仍带有称号性质；“弥赛亚”保留其犹太受膏者背景。属格结构译作“弥赛亚的”，不强行判定这是“关于弥赛亚”还是“属于弥赛亚”的福音。
theological_decisions:
- issue: Χριστοῦ应译为称号还是近似专名
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处可理解为耶稣的弥赛亚身份仍在起作用，因此正文采用“弥赛亚”；脚注列出中文传统译名“基督”，避免把可接受的词汇选择绝对化。
- issue: τοῦ Χριστοῦ属格的关系
  choice: 弥赛亚的福音
  alternative: 关于弥赛亚的福音
  rationale: 希腊文属格可能表达归属、来源或内容；采用对应的中文属格结构，保留这种语义张力，不把它单独限定为“关于”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那”承接上一节；分号保留前半句否定与后半句解释之间紧密而带转折的关系。
