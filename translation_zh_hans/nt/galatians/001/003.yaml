base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah,[a]
translation:
  language: zh_hans
  text: 愿恩典与平安从上帝我们的父和我们的主耶稣弥赛亚[a]临到你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”也常译作“基督”。
    reason: 保留Ἰησοῦ Χριστοῦ的传统中文译法，说明正文所译称号与“基督”相对应。
lexical_decisions:
- source_word: χάρις
  choice: 恩典
  rationale: 既保留书信问安语的祝福意味，也承载保罗用语中的神学内涵。
- source_word: ὑμῖν
  choice: 临到你们
  rationale: 与“愿……临到你们”的现代汉语祝福句式自然衔接，准确表达与格所指的领受者。
- source_word: εἰρήνη
  choice: 平安
  rationale: 保留其犹太问安背景，并涵盖和好、安宁与福祉等语义。
- source_word: ἀπό
  choice: 从
  rationale: 明确表示恩典和平安的来源。
- source_word: θεοῦ πατρὸς
  choice: 父上帝
  rationale: 按所给希腊文本的词序与结构，译作“父上帝”，避免把后置的ἡμῶν无依据地移接到πατρός。
- source_word: κυρίου ἡμῶν
  choice: 我们的主
  rationale: 所给文本中ἡμῶν紧随κυρίου，最自然地修饰“主”；这样也忠实保留该文本与常见词序之间的张力。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣弥赛亚
  rationale: 将Χριστός作为称号译出其“弥赛亚”之义，而不把它仅当作固定姓名；传统译法在脚注中保留。
theological_decisions:
- issue: Χριστός在此应译为称号“弥赛亚”，还是采用传统音译“基督”
  choice: 耶稣弥赛亚
  alternative: 耶稣基督
  rationale: 这里的Χριστός仍具有弥赛亚称号的含义；正文译明称号，脚注同时保留读者熟悉的传统表达。
- issue: ἡμῶν应修饰πατρός还是κυρίου
  choice: 我们的主
  alternative: 我们的父上帝和主耶稣弥赛亚
  rationale: 依用户提供的SBLGNT文本词序，ἡμῶν位于κυρίου之后，直接理解为“我们的主”最为自然；不借助常见的另一词序来改写当前所给文本。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“愿……临到你们”清楚呈现祝福语气；“父上帝”与“我们的主”按所给希腊词序处理。
