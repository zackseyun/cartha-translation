  text: μόνον δὲ ἀκούοντες ἦσαν ὅτι Ὁ διώκων ἡμᾶς ποτε νῦν εὐαγγελίζεται τὴν πίστιν ἥν ποτε ἐπόρθει,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/023.yaml
  text: They were only hearing[a], “The one who formerly persecuted us now proclaims the faith he once tried to destroy.”
translation:
  language: zh_hans
  text: 他们只是不住地听说：“那从前迫害我们的人，如今传扬这信仰[a]，就是他从前所破坏的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“福音信息”。希腊文为“这信仰”，这里很可能指保罗从前所攻击、如今所传扬的基督信仰或其信息。
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνον
  choice: 只是
  rationale: 表示限制：这些教会对保罗本人并不熟悉，只是听到有关他的消息。
- source_word: ἀκούοντες ἦσαν
  choice: 不断听人说
  rationale: 迂回未完成时可表达持续或反复听到传闻；“听人说”也自然引出后面的引语。
- source_word: ὁ διώκων ἡμᾶς ποτε
  choice: 那从前迫害我们的人
  rationale: 保留名词化分词的描述性身份表达，并以“从前”对应 ποτέ。
- source_word: νῦν εὐαγγελίζεται
  choice: 如今竟传扬
  rationale: “传扬”体现福音宣告的动作；“竟”自然呈现从迫害者到宣讲者的强烈反差，但不改变命题内容。
- source_word: τὴν πίστιν
  choice: 信仰
  rationale: 此处带冠词的 πίστις 主要指人所信的基督信仰或信仰信息，而非单指内在相信的行为。
- source_word: ἣν ποτε ἐπόρθει
  choice: 他一度企图摧毁的
  rationale: πορθέω 表示蹂躏、毁坏；在此以“企图摧毁”自然表达其过去针对这信仰及其群体的破坏行动。
theological_decisions:
- issue: τὴν πίστιν 的含义
  choice: “信仰”指保罗如今所传扬的基督信仰或其信息
  alternative: 理解为主观的“相信”，或按语境译作“福音”
  rationale: 冠词和“传扬……曾企图摧毁的”这一对比支持客观意义，即所信、所宣讲的信仰内容；脚注保留“福音信息”这一语境性表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不断听人说”体现未完成时的持续或反复意味；引语保持口头传闻的自然形式。“信仰”保留原文 πίστις 的措辞及其神学张力，并用脚注说明语境义。
