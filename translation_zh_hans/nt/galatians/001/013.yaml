id: GAL.1.13
reference: Galatians 1:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἠκούσατε γὰρ τὴν ἐμὴν ἀναστροφήν ποτε ἐν τῷ Ἰουδαϊσμῷ, ὅτι καθ’ ὑπερβολὴν ἐδίωκον τὴν ἐκκλησίαν τοῦ θεοῦ καὶ ἐπόρθουν αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/013.yaml
  text: For you have heard of my former way of life in Judaism[d][c][b][a], that I was persecuting the church of God beyond measure and was ravaging it.
translation:
  language: zh_hans
  text: 因为你们听说过我从前在犹太教中的行事为人[a]：我曾极力迫害上帝的教会，并摧残它[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从前的生活方式”或“从前的行为表现”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“并毁坏它”或“并企图毁灭它”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστροφήν
  choice: 生活方式
  rationale: 该词广义指一个人的行为表现和生活形态；“生活方式”自然、清楚，也不局限于个别行为。
- source_word: ποτε
  choice: 从前
  rationale: 在语境中指保罗蒙召以前的生活，与现在形成时间上的对照。
- source_word: Ἰουδαϊσμῷ
  choice: 犹太教中
  rationale: 此处指保罗从前所处的犹太宗教身份与实践；“在犹太教中”直接对应原文，又符合现代汉语表达。
- source_word: καθ’ ὑπερβολὴν
  choice: 极其猛烈地
  rationale: 这一短语强调迫害远超寻常的程度；与“迫害”搭配时，“极其猛烈地”既自然又保留强烈语气。
- source_word: ἐδίωκον
  choice: 曾……迫害
  rationale: 未完成过去时描写过去持续或反复进行的行动；汉语以“曾”结合上下文表达这一过去经历。
- source_word: ἐκκλησίαν τοῦ θεοῦ
  choice: 上帝的教会
  rationale: 此处指保罗所迫害的、归属于上帝的弥赛亚信徒群体；“教会”是现代汉语中清楚而惯用的对应词。
- source_word: ἐπόρθουν
  choice: 摧残
  rationale: 该动词含猛烈破坏、蹂躏之意。“摧残”保留其严重性，同时不强行判定行动已经彻底毁灭该群体。
theological_decisions:
- issue: ἐκκλησία应译为“教会”还是“会众”
  choice: 上帝的教会
  alternative: 上帝的会众
  rationale: 语境所指是保罗曾迫害的弥赛亚信徒群体。“教会”在现代汉语中最直接清楚，也未额外规定其组织形态。
- issue: ἐπόρθουν是否表示已经毁灭或企图毁灭
  choice: 摧残它
  alternative: 试图毁灭它
  rationale: 原文未完成时可描写持续实施破坏，不必断定已经达到彻底毁灭的结果；“摧残”保留强烈破坏含义及结果上的开放性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“极其猛烈地迫害”自然表达καθ’ ὑπερβολὴν的程度强化；“摧残”传达ἐπόρθουν的暴烈破坏意味，同时避免暗示教会已被实际消灭。
