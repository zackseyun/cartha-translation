  text: ἀποκαλύψαι τὸν υἱὸν αὐτοῦ ἐν ἐμοὶ ἵνα εὐαγγελίζωμαι αὐτὸν ἐν τοῖς ἔθνεσιν, εὐθέως οὐ προσανεθέμην σαρκὶ καὶ αἵματι,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/016.yaml
  text: to reveal his Son in me[a], so that I might proclaim him among the Gentiles, I did not immediately consult with flesh and blood[b],
translation:
  language: zh_hans
  text: 把他的儿子启示在我里面[a]，好让我在外邦人中宣扬他；我没有立刻同血肉之人商议[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“向我”或“借着我”。
    reason: alternative_reading
  - marker: b
    text: 原文直译为“血肉”；这是指人的习语。
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκαλύψαι
  choice: 启示
  rationale: 承接上节，表达上帝主动使人认识其儿子的行动；“启示”自然、庄重，也保留神圣显明的含义。
- source_word: τὸν υἱὸν αὐτοῦ
  choice: 他的儿子
  rationale: 忠实保留原文的亲子称谓及其基督论分量，不作解释性扩展。
- source_word: ἐν ἐμοὶ
  choice: 在我里面
  rationale: 按介词的基本意义直译，以保留内在启示、向保罗启示或借保罗显明等可能理解；其他译法列入脚注。
- source_word: ἵνα εὐαγγελίζωμαι αὐτὸν
  choice: 好让我……宣扬他
  rationale: εὐαγγελίζωμαι表示传扬好消息，而αὐτόν直接以儿子为宾语；“宣扬他”保留原文鲜明的人称宾语，避免改写成仅仅宣讲有关他的信息。
- source_word: ἐν τοῖς ἔθνεσιν
  choice: 在外族人中
  rationale: 在保罗书信语境中通常指犹太人以外的各族；“外族人”是现代中文中较清楚且不显陈旧的表达。
- source_word: εὐθέως
  choice: 当即
  rationale: 准确表达“立刻、马上”，语体简洁庄重，并与后面的否定自然结合。
- source_word: οὐ προσανεθέμην
  choice: 没有……商议
  rationale: 该中间语态动词在此指与别人磋商、请教；“同……商议”符合现代汉语搭配。
- source_word: σαρκὶ καὶ αἵματι
  choice: 同属血肉的人
  rationale: 既保留“血肉”的原文意象，又以“人”明确这个习语所指的是人类；脚注进一步说明。
theological_decisions:
- issue: ἐν ἐμοὶ所表达的启示与保罗之间的关系
  choice: 正文保留“在我里面”
  alternative: “向我”或“借着我”
  rationale: 原文可以侧重保罗内在所得的启示，也可能指向他而来或以他为显明的媒介。正文不替读者消除这种真实的释义张力，脚注列出主要译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“在我里面”的有意含混和“血肉”的原文意象；用“外族人”表达此处ἔθνη所指的非犹太各族。分号体现本节从使命目的转入保罗随后的即时反应。
