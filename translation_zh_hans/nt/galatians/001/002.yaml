  yaml_path: translation/nt/galatians/001/002.yaml
  text: 'and all the brothers with me[a], to the churches of Galatia:'
translation:
  language: zh_hans
  text: 以及所有同我在一起的弟兄[a]，致加拉太的各教会：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姊妹”。希腊原文直译为“弟兄”，但也可能包括男女信徒。
    reason: 保留ἀδελφοί在语法形式与可能包容性指称之间的差异。
lexical_decisions:
- source_word: καὶ
  choice: 以及
  rationale: 承接第1节所说的保罗，并把其他共同署名者包括进来；“以及”在现代汉语书信起首中自然，也保留了经文与上节的连续性。
- source_word: οἱ σὺν ἐμοὶ πάντες ἀδελφοί
  choice: 所有同我在一起的弟兄
  rationale: πάντες译为“所有”，σὺν ἐμοὶ译为“同我在一起”，保留共同署名者当时与保罗同在的意思。ἀδελφοί在语法上为阳性复数，正文译作“弟兄”；其在此也可能泛指男女信徒，因此以脚注保留包容性译法。
- source_word: ἐκκλησίαις
  choice: 各教会
  rationale: 复数形式指多个地方信徒群体；“各教会”是现代中文基督教语境中自然、明确的对应表达。
- source_word: τῆς Γαλατίας
  choice: 加拉太的
  rationale: 按属格结构译作“加拉太的”，与“各教会”搭配，既贴近原文，也可自然表达这些教会位于或属于加拉太地区。
- source_word: ταῖς ἐκκλησίαις
  choice: 致……各教会
  rationale: 希腊文以与格标示书信收信对象；中文用“致”简洁而自然地表达这一功能，不额外补入原文没有明说的完整谓语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而简洁的书信体。“致”标明收信对象，并保留本节与第1节在句法上的连续性；正文不把ἀδελφοί直接改写为包容性称谓，而以脚注呈现其真实语义范围。
