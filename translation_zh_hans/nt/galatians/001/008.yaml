revisions:
- from: 但即使是我们，或是从天上来的天使，若向你们传福音[a]，与我们先前向你们所传的相违[b]，他也该受咒诅[c]。
  to: 但哪怕我们或从天上来的天使，向你们传的福音[a]与我们先前传给你们的相违背[b]，他就当受咒诅[c]。
  rationale: 修订消除了中文条件结构的叠置，使“相违背”明确修饰所传的“福音”，并以“当受咒诅”自然而庄重地呈现原文的咒诅判语。脚注a、b保留原文词汇的相关替代译法；脚注c改为自然、语义准确的替代译法，且不加入教派性解释。
