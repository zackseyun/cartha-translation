  text: ἀλλὰ καὶ ἐὰν ἡμεῖς ἢ ἄγγελος ἐξ οὐρανοῦ ⸀εὐαγγελίζηται ⸀ὑμῖν παρ’ ὃ εὐηγγελισάμεθα ὑμῖν, ἀνάθεμα ἔστω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/008.yaml
  text: But even if we or an angel from heaven should proclaim good news to you contrary to what we proclaimed to you[c][b][a], let him be accursed.
translation:
  language: zh_hans
  text: 但哪怕我们或从天上来的天使，向你们传的福音[a]与我们先前传给你们的相违背[b]，他就当受咒诅[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“传好消息”。希腊文此处使用的动词意为“传好消息”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“不同于我们先前传给你们的”，或“超出我们先前传给你们的”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“他当受诅咒”；或保留音译：“他当受阿那提玛。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ ἐὰν
  choice: 但即使……若
  rationale: “但”承接上文并形成强烈转折，“即使……若”自然表达καί的强调和ἐάν的假设语气。
- source_word: ἡμεῖς ἢ ἄγγελος ἐξ οὐρανοῦ
  choice: 我们，或是从天上来的天使
  rationale: 保留保罗将自己一方也包括在内的强调，并准确呈现来自天上的使者这一递进情形。
- source_word: εὐαγγελίζηται
  choice: 传福音
  rationale: 现代汉语中“传福音”是自然、明确的动词表达；脚注说明希腊文原处使用意为“传好消息”的动词。
- source_word: παρ’ ὃ
  choice: 与……相违
  rationale: 在本节论战语境中表达偏离并抵触先前所传信息的意思，同时借脚注保留“不同于”或“超出”的可能措辞。
- source_word: εὐηγγελισάμεθα
  choice: 我们先前……所传的
  rationale: “先前”体现不定过去时所指的既有宣讲；省略重复的“福音”使汉语流畅，同时与前面的“传福音”保持语义联系。
- source_word: ἀνάθεμα ἔστω
  choice: 他也该受咒诅
  rationale: 传达庄严而真实的咒诅判语；“该”体现第三人称命令式的裁定语气，又不引入后期教会制度中的专门术语。
theological_decisions:
- issue: 保罗咒诅公式的含义
  choice: 将其译为对任何传违背使徒福音之信息者的真实咒诅判语：“他也该受咒诅。”
  alternative: 译作“他该成为可咒诅的”或“他该在咒诅之下”，也有人将其侧重理解为正式革除教籍。
  rationale: 原文语气强烈，具有司法性和咒诅性；本译文保留这种分量，却不把后世形成的特定教会处分含义带入经文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“相违”保留论战力度，但不把παρά的语义范围限制为逻辑矛盾；“受咒诅”清楚易懂，并维持原文严肃的判决语气。所有脚注标记均置于正文相应词语之后。
