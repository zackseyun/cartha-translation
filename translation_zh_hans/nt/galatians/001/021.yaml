lexical_decisions:
- source_word: ἔπειτα
  choice: 后来
  rationale: 表示保罗叙事中的时间先后；“后来”自然、清楚地承接上文。
- source_word: ἦλθον
  choice: 我去了
  rationale: 该动词字面可作“我来到”，但此处从叙述者此前所在地转往别处，现代汉语通常说“我去了”。
- source_word: εἰς
  choice: 去了
  rationale: 其方向意义已由汉语趋向表达“去了”自然体现；若另译为“进入”，容易过度强调跨越边界。
- source_word: κλίματα
  choice: 各地区
  rationale: 指地理区域或地带，而非某一座城市；复数用“各地区”既准确又符合现代汉语。
- source_word: Συρίας
  choice: 叙利亚
  rationale: 采用现代汉语中通行的地名译法。
- source_word: Κιλικίας
  choice: 基利家
  rationale: 采用中文圣经传统且仍通行的地名译法。
