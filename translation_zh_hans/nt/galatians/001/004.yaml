id: GAL.1.4
reference: Galatians 1:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τοῦ δόντος ἑαυτὸν ⸀ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν ὅπως ἐξέληται ἡμᾶς ἐκ τοῦ ⸂αἰῶνος τοῦ ἐνεστῶτος⸃ πονηροῦ κατὰ τὸ θέλημα τοῦ θεοῦ καὶ πατρὸς ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/004.yaml
  text: who gave himself for our sins so that he might rescue us from the present evil age[a], according to the will of our God and Father,
translation:
  language: zh_hans
  text: 他为我们的罪舍了自己，为要把我们从现今这个邪恶的世代中解救出来[a]；这一切都照着上帝——我们的父——的旨意。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从现今这个邪恶的世界中拯救出来”。
    reason: “世界”是αἰών在此处的传统性替代译法；“拯救出来”可对应ἐξαιρέω。正文的“世代”较好保留该词的时代性含义。
lexical_decisions:
- source_word: δόντος ἑαυτόν
  choice: 献上自己
  rationale: 既保留 δίδωμι“给出”的基本意义，也在自然中文中表达其主动、自愿的舍己意味；不进一步限定献祭机制。
- source_word: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: 为我们的罪
  rationale: 简洁对应原文，并保留代赎与关涉之意，不把 ὑπέρ 收窄为某一种完整的赎罪理论。
- source_word: ὅπως ἐξέληται ἡμᾶς
  choice: 为要把我们……解救出来
  rationale: ἐξαιρέω 表示从危险或辖制处境中救出；“解救出来”自然体现脱离的方向与目的。
- source_word: ἐκ τοῦ αἰῶνος τοῦ ἐνεστῶτος πονηροῦ
  choice: 从现今这个邪恶的世代中
  rationale: αἰών 首先指时代或世代，而非物质世界；“现今这个”自然对应定冠词结构及 ἐνεστῶτος，“邪恶”保留其道德性质。
- source_word: κατὰ τὸ θέλημα
  choice: 照着……的旨意
  rationale: 表达行动与上帝旨意相符，准确且符合现代中文经文语体。
- source_word: τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: 我们的上帝和父
  rationale: 保留一个冠词统摄“上帝”和“父”的单一所指，并尽量维持原文次序。
theological_decisions:
- issue: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν 是否应译得足以限定某种赎罪机制
  choice: 为我们的罪
  alternative: 因我们的罪；代替我们担当罪
  rationale: 原文具有救赎和代表性的分量，但本句没有完整界定赎罪机制；采用较宽而有力的表达，以保留神学张力。
- issue: αἰών 应译为“世代”还是“世界”
  choice: 现今这个邪恶的世代
  alternative: 现今这个邪恶的世界
  rationale: αἰών 的核心是时间—宇宙性的时代概念；“世代”较准确，“世界”则是可理解但较不精确的传统译法。
- issue: τοῦ θεοῦ καὶ πατρὸς ἡμῶν 的所指
  choice: 我们的上帝和父
  alternative: 上帝和我们的父
  rationale: 希腊语结构指同一位既是上帝又是父者；所选译法避免让读者误以为是两个所指。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“献上自己”比生硬的“给了自己”自然，并保留主动舍己意味；“解救出来”清楚呈现从辖制处境中被带出的动态。正文脚注标记与脚注完全对应。
