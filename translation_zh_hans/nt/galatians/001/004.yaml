  rationale: 修订仅消除“献上”所带入的额外献祭动作，并以中文同位语清楚表达“上帝和我们的父”为同一位。保留原文的目的关系、从邪恶现今世代中被救出的动态，以及“照着……旨意”的依据关系；脚注锚点和标记仍完全对应。
