id: GAL.1.22
reference: Galatians 1:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἤμην δὲ ἀγνοούμενος τῷ προσώπῳ ταῖς ἐκκλησίαις τῆς Ἰουδαίας ταῖς ἐν Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/022.yaml
  text: But I was personally unknown by face to the churches of Judea that are in Messiah[b][a],
translation:
  language: zh_hans
  text: 不过，犹太地区那些在弥赛亚[b]里的教会没有见过我本人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“按面貌不认识我”；也可译“与我素未谋面”或“不认识我的面貌”。
    reason: lexical_alternative
  - marker: b
    text: “弥赛亚”也可译作“基督”。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: 不过
  rationale: δὲ在这里表示轻微的转折或话题推进；“不过”自然承接上文，又不过度强化对立。
- source_word: ἤμην ἀγνοούμενος
  choice: 当时……并不认识我
  rationale: 这是未完成时的迂回结构，描述保罗在相关时期处于不被认识的状态。汉语改用主动表达更自然，而不改变各教会不认识他的含义。
- source_word: τῷ προσώπῳ
  choice: 我本人
  rationale: 该短语字面为“按相貌”，在此指亲眼见过或当面认识某人；“认识我本人”以自然汉语表达这种亲身相识的含义。
- source_word: ταῖς ἐκκλησίαις
  choice: 各教会
  rationale: 复数形式指多个信徒群体；“各教会”既保留复数，也符合现代汉语基督教语境中的通常表达。
- source_word: τῆς Ἰουδαίας
  choice: 犹太地区
  rationale: Ἰουδαία是地名；加“地区”可避免现代读者把它误解为单纯的族群形容词。
- source_word: ἐν Χριστῷ
  choice: 在弥赛亚里
  rationale: 保留保罗特有的“在……里”关系表达，并以“弥赛亚”传达Χριστός在此仍可听出的称号含义。
theological_decisions:
- issue: ἐν Χριστῷ中Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: Χριστός本义为“受膏者”，在这里以称号理解自然；“弥赛亚”较清楚地保留这一称号意义。脚注同时列出汉语传统译法“基督”，不把两者之间的译名选择提升为神学差异。
- issue: “在弥赛亚里”的关系含义
  choice: 保留“在……里”的开放表达
  alternative: 属于弥赛亚／与弥赛亚联合
  rationale: 原文ἐν Χριστῷ可涵盖归属、联合及群体身份等相关含义；直保留其介词结构，避免把丰富而有张力的保罗用语缩减为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“当时”自然表达希腊语未完成时的背景状态；逗号帮助较长的主语与谓语分界。
