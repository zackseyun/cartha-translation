  text: ἕτερον δὲ τῶν ἀποστόλων οὐκ εἶδον, εἰ μὴ Ἰάκωβον τὸν ἀδελφὸν τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/019.yaml
  text: But I saw none of the other apostles except James[a], the Lord’s brother.
translation:
  language: zh_hans
  text: 至于其他使徒，我一个也没有见到，只有主的兄弟雅各例外。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语“兄弟”不标明长幼。也有人把本句理解为：保罗没有见到其他使徒，只另外见了雅各；按这种理解，这句话未必把雅各列为使徒。
    reason: 说明“兄弟”一词不标明长幼，并保留εἰ μὴ结构是否将雅各归入使徒之列的另一种理解。
lexical_decisions:
- source_word: ἕτερον
  choice: 别的
  rationale: 与表示整体范围的“使徒”连用，指其中另一位或别的人；“别的使徒”符合现代汉语表达。
- source_word: δέ
  choice: 至于
  rationale: 此处承接上文并转入对其他使徒的说明，语气是轻微转折或推进；“至于”比强转折的“但是”更自然。
- source_word: ἀποστόλων
  choice: 使徒
  rationale: 保留保罗书信语境中这一公认称谓，不泛化为“使者”。
- source_word: οὐκ εἶδον
  choice: 我都没有见到
  rationale: 准确表达过去时否定，并与前置的范围“别的使徒”自然搭配。
- source_word: εἰ μὴ
  choice: 只见了
  rationale: 此处引出例外，等同于“除了……以外”；结合前句译作“只见了”简洁自然，同时保留雅各属于例外项的通常句法理解。
- source_word: Ἰάκωβον
  choice: 雅各
  rationale: 采用中文圣经传统中对Ἰάκωβος的通行译名。
- source_word: ἀδελφὸν
  choice: 弟弟
  rationale: ἀδελφός的直接亲属义为兄弟；就此人物与耶稣的关系，现代汉语通常明确表达为“弟弟”。脚注提示也可较宽泛地译作“兄弟”，避免掩盖词项本身不标明长幼这一点。
- source_word: τοῦ κυρίου
  choice: 主的
  rationale: κύριος作为称号译为“主”，属格用自然的汉语领属结构表达。
theological_decisions:
- issue: 雅各在此句中是否被列入“使徒”
  choice: 正文按最自然的句法，将雅各作为“没有见到别的使徒”这一否定陈述的例外，因此语面上把他包括在使徒之内。
  alternative: 也可把句意理解为：保罗没有见到彼得以外的使徒，只另外见了主的兄弟雅各，而未必称雅各为使徒。
  rationale: 希腊语εἰ μὴ通常直接引出前述范围的例外，但该结构在此存在历史悠久的另一种理解；正文保留通常句法，脚注说明歧义，不在正文中强行消解。
- issue: ἀδελφός所表达的亲属关系
  choice: 正文译作“弟弟”，采用此处人物关系在现代汉语中的通常表达。
  alternative: 可译作较不限定长幼的“兄弟”；也有人将其理解为较广义的亲属称谓。
  rationale: 希腊词本身表示男性兄弟而不标明长幼。为使现代读者自然理解，正文用“弟弟”，同时在脚注交代原词并不明确长幼，避免把译文的具体化误当成希腊语的明说。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“至于”承接上文而避免过强转折；“只见了”清楚呈现例外关系。正文不加入身份解释，相关句法与亲属称谓的歧义置于脚注。
