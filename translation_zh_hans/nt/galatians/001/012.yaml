id: GAL.1.12
reference: Galatians 1:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὐδὲ γὰρ ἐγὼ παρὰ ἀνθρώπου παρέλαβον αὐτό, ⸀οὔτε ἐδιδάχθην, ἀλλὰ δι’ ἀποκαλύψεως Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/012.yaml
  text: For I neither received it from a human source[a], nor was I taught it, but through a revelation of Jesus the Messiah.
translation:
  language: zh_hans
  text: 因为我并不是从人那里领受这福音，也不是别人教给我的，而是借着耶稣基督的启示[a]领受的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶稣基督的启示”也可理解为“耶稣基督所赐的启示”，或“关于耶稣基督的启示”。
    reason: 说明原文属格既可能表示启示的来源，也可能表示启示的内容。
lexical_decisions:
- source_word: παρὰ ἀνθρώπου
  choice: 从人那里
  rationale: ἄνθρωπος在此是泛指，强调福音并非来自任何人的传授；“从人那里”在现代汉语中自然，也保留了人的来源与神圣启示之间的对比。
- source_word: παρέλαβον αὐτό
  choice: 领受这福音
  rationale: παραλαμβάνω在传统传递的语境中有“领受”之意；αὐτό回指上文的福音，译明为“这福音”可避免中文代词指向不清。
- source_word: ἐδιδάχθην
  choice: 别人教给我的
  rationale: 原文是被动式“我被教导”；汉语用主动转换更自然，并清楚表达保罗否认自己曾从他人受教。
- source_word: δι’ ἀποκαλύψεως
  choice: 借着……的启示
  rationale: διά加属格在此表达途径或媒介；“借着”保留福音是经由启示而领受的意思。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣基督的
  rationale: 原文属格既可指耶稣基督是启示的赐予者，也可指他是启示的内容。“耶稣基督的启示”在中文正文中保留这种关系上的开放性，并由脚注说明。
theological_decisions:
- issue: ἀποκαλύψεως Ἰησοῦ Χριστοῦ中属格的含义
  choice: 正文采用“耶稣基督的启示”，不限定属格关系
  alternative: “耶稣基督所赐的启示”或“关于耶稣基督的启示”
  rationale: 希腊语既可理解为启示来自耶稣基督，也可理解为启示以耶稣基督为内容。正文保留原文的真实歧义，脚注列出两种主要理解，避免替读者作过度判定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“领受”适合福音传递与启示的语境；用“这福音”明确αὐτό的所指。句末补出“领受的”，使“借着……的启示”在汉语中结构完整，同时未添加新的实质内容。
