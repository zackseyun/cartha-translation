  yaml_path: translation/nt/galatians/001/005.yaml
  text: to whom be the glory forever and ever. Amen.
translation:
  language: zh_hans
  text: 愿荣耀归给他，直到永永远远。阿们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾧ
  choice: 归给他
  rationale: 关系代词为与格，承接上一节的“我们的父神”；中文颂赞语用“归给他”自然表达所指与归属关系。
- source_word: ἡ δόξα
  choice: 荣耀
  rationale: “荣耀”是现代汉语圣经颂赞语中准确、庄重且通行的对应词，也保留了原词在此处的神学分量。
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 直到永永远远
  rationale: 这是表示无穷久远的固定强化表达；“直到永永远远”既传达持续至无尽的含义，也保留颂赞文体的节奏。
- source_word: ἀμήν
  choice: 阿们
  rationale: 按现代汉语基督教通行形式音译，作为颂赞结尾的郑重确认。
theological_decisions:
- issue: 颂赞句中省略动词的表达
  choice: 愿荣耀归给他
  alternative: 荣耀是他的／荣耀归给他
  rationale: 希腊文没有明示限定动词。“愿……归给他”以自然庄重的汉语再现颂赞和祈愿语气，同时不把原文明确限定为单纯陈述；但原文在陈述归属与祈愿颂赞之间仍有语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的颂赞语体。“他”承接上一节的“我们的父神”。未加脚注，因为本节无必要向普通读者标示的文本异读或不可避免的歧义。
