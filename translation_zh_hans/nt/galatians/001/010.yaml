id: GAL.1.10
reference: Galatians 1:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἄρτι γὰρ ἀνθρώπους πείθω ἢ τὸν θεόν; ἢ ζητῶ ἀνθρώποις ἀρέσκειν; ⸀εἰ ἔτι ἀνθρώποις ἤρεσκον, Χριστοῦ δοῦλος οὐκ ἂν ἤμην.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/010.yaml
  text: For am I now persuading people[a], or God? Or am I seeking to please people? If I were still pleasing people[b], I would not be Messiah’s slave.
translation:
  language: zh_hans
  text: 我如今是在劝服人，还是劝服上帝呢？[a] 还是我在寻求取悦人呢？如果我仍旧取悦人，我就不会是弥赛亚的奴仆了。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我如今是在寻求得到人的认可，还是得到上帝的认可呢？”
    reason: πείθω可按语境理解为争取认可或赞同；此译法使其与下句“取悦人”的关系更清楚。
  - marker: b
    text: “奴仆”也可译作“奴隶”或“仆人”；原词强调属于主人并服从主人。
    reason: 说明δοῦλος的语义力度及中文译法范围。
lexical_decisions:
- source_word: Ἄρτι
  choice: 现在
  rationale: 直接表达保罗当前的处境和论证，并与过去的生活方式形成隐含对比。
- source_word: πείθω
  choice: 劝服
  rationale: 保留该动词“说服、劝服”的基本义，也保留“劝服上帝”这一修辞问句在原文中的张力；不在正文中径直改释为“寻求认可”。
- source_word: ἀνθρώπους
  choice: 人
  rationale: 泛指人类，不限于男性；中文“人”简洁自然。
- source_word: ζητῶ
  choice: 是在寻求
  rationale: 以进行性表达呈现时态和修辞问题的语气。
- source_word: ἀρέσκειν / ἤρεσκον
  choice: 讨……的喜欢
  rationale: 自然表达取悦、迎合以得到好感之意，并在前后分句保持词汇呼应。
- source_word: εἰ ἔτι
  choice: 如果我仍旧
  rationale: 保留条件句和“仍然、还”的含义，暗示这可能是过去的行为模式。
- source_word: Χριστοῦ
  choice: 弥赛亚的
  rationale: Χριστός在这里带有身份称号的意义；“弥赛亚”保留其受膏者称号的语义。
- source_word: δοῦλος
  choice: 奴仆
  rationale: “奴仆”在现代中文圣经语域中庄重可懂，同时传达归属、服从和受主人支配，较“仆人”更接近δοῦλος的力度，又避免“奴隶”可能造成的纯制度性联想。
theological_decisions:
- issue: πείθω用于人和上帝时的含义
  choice: 正文译为“劝服人，还是在劝服上帝”
  alternative: “寻求人的认可，还是上帝的认可”
  rationale: 原文同一个动词同时支配“人”和“上帝”，形成刻意而略显突兀的修辞张力；正文保留该结构，脚注提供语境性理解。
- issue: Χριστοῦ δοῦλος的表达
  choice: 弥赛亚的奴仆
  alternative: 基督的仆人／弥赛亚的奴隶
  rationale: “弥赛亚”保留称号意义；“奴仆”体现完全归属和忠诚，且符合庄重、可读的现代中文语域。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。保留原文两个修辞问句及“劝服上帝”的真实歧义；以“讨人的喜欢”维持ἀρέσκειν与ἤρεσκον的重复；“弥赛亚的奴仆”突出本节关于忠诚与归属的对比。
