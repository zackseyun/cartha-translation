  text: ὡς προειρήκαμεν, καὶ ἄρτι πάλιν λέγω, εἴ τις ὑμᾶς εὐαγγελίζεται παρ’ ὃ παρελάβετε, ἀνάθεμα ἔστω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/009.yaml
  text: 'As we have said before[a], so now I say again: if anyone is preaching a gospel to you contrary to what you received[b], let him be accursed.'
translation:
  language: zh_hans
  text: 正如我们从前说过的，现在我再说一遍：若有人传给你们的福音与​​你们所领受的相违[a]，他就当受咒诅[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“超出你们所领受的”；这个短语可以表示偏离已经领受的信息。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他就当处在咒诅之下”；希腊文：ἀνάθεμα ἔστω。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς προειρήκαμεν
  choice: 正如我们从前说过的
  rationale: προειρήκαμεν指先前已经说过的话；“从前说过”自然地表达完成时所含的既往陈述及其当前效力，ὡς则译为“正如”以保留承接关系。
- source_word: ἄρτι πάλιν λέγω
  choice: 现在我再说一遍
  rationale: “现在”对应ἄρτι所强调的当前时刻，“再说一遍”对应πάλιν及λέγω，现代汉语自然且保留重复申明的语气。
- source_word: εἴ τις ὑμᾶς εὐαγγελίζεται
  choice: 如果有人向你们传福音
  rationale: εὐαγγελίζεται是宣讲好消息的动词；在本段语境中特指福音信息，译作“传福音”既通顺，也保留其宣讲行动。
- source_word: παρ’ ὃ
  choice: 与……相违
  rationale: παρά与关系代词在此表示偏离既已领受的信息；“相违”传达上下文中的对立力度，同时以脚注保留“超出”的可能表达。
- source_word: παρελάβετε
  choice: 你们所领受的
  rationale: παραλαμβάνω在此指领受所传递的信息或传统；“领受”在现代中文宗教语境中庄重、明确，并保留接受既定信息的含义。
- source_word: ἀνάθεμα ἔστω
  choice: 他就该受咒诅
  rationale: ἀνάθεμα表示处于咒诅之下或被交付毁灭；“该受咒诅”保留祈使式的严厉判定，又不额外指定咒诅的施行者。
theological_decisions:
- issue: ἀνάθεμα ἔστω中定罪措辞的力度与主体
  choice: 他就该受咒诅
  alternative: 他就当处在咒诅之下
  rationale: 正文保留保罗警告的严厉和裁断语气，但不在原文之外明确添加“上帝的”，从而避免加入额外的神学限定。
- issue: παρ’ ὃ所表达的是正面冲突还是越出范围
  choice: 与……相违
  alternative: 超出……
  rationale: 上下文强调所传信息偏离使徒所传、加拉太人已经领受的福音，因此正文采用较有对立力度的“相违”；脚注保留介词短语可能具有的“超出”表达，不消除其语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“正如……现在……”保留原句的回顾与再次宣告；“传福音”“领受”“受咒诅”符合经文语域，但避免生僻音译和宗派化措辞。
