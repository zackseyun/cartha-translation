  yaml_path: translation/nt/galatians/001/015.yaml
  text: But when the one who set me apart from my mother’s womb and called me through his grace was pleased[a]
translation:
  language: zh_hans
  text: 但当那位从我母腹中[a]就把我分别出来、又借着他的恩典呼召我的神乐意时——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从出生时起”；可比较耶利米书1:5和以赛亚书49:1中先知蒙召的用语。
    reason: 说明“从我母腹中”的另一种自然译法，并指出其先知蒙召语境。
lexical_decisions:
- source_word: ὅτε δὲ
  choice: 但……既然
  rationale: ὅτε引出时间从句，δὲ带有轻微转折。因本节句意延续至下一节，中文以“但……既然”自然地保留转折和未完句式。
- source_word: εὐδόκησεν
  choice: 乐意
  rationale: 保留εὐδοκέω所表达的美意与欣然意愿，不将其弱化为单纯的“决定”。
- source_word: ὁ ἀφορίσας με
  choice: 那位……把我分别出来
  rationale: 按带冠词的分词结构译为指称上帝的“那位……的”；“分别出来”保留为特定使命而划分出来的含义，又避免直接引入“拣选”或“预定”等更强的体系化表述。
- source_word: ἐκ κοιλίας μητρός μου
  choice: 从我母腹中
  rationale: 保留希腊文具体的母腹意象及其先知蒙召语汇，与耶利米书1:5和以赛亚书49:1相呼应。
- source_word: καλέσας
  choice: 呼召
  rationale: “呼召”自然表达上帝的召唤，也保留保罗用语中使命与救恩层面的丰富含义。
- source_word: διὰ τῆς χάριτος αὐτοῦ
  choice: 借着他的恩典
  rationale: 准确体现διά加属格所表达的媒介或凭借，表明这呼召是借着上帝的恩典。
theological_decisions:
- issue: ἀφορίσας是否应译入特定的预定论或拣选论含义
  choice: 分别出来
  alternative: 拣选了我／预定了我／委派了我
  rationale: 原文表达上帝将保罗分别出来，且带有先知蒙召的背景，但并不要求在译文中将其体系化为某种特定教义；“分别出来”保留原文的神学张力。
- issue: εὐδόκησεν所表达的是单纯决定还是上帝的美意
  choice: 乐意
  alternative: 决定／愿意
  rationale: “乐意”既表达上帝主动的旨意，也保留“以此为美、欣然如此”的语义，不把它简化为冷静的决定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“从我母腹中”保留圣经意象；破折号表明本节语法和句意尚未结束，内容接续下一节。
