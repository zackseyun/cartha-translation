  naturalness: 原句的关系结构可理解，但以“那位……的”作主语再接“既然乐意”较为拗口，且“既然”不适合这里。将指称对象明确为“神”并使用“当……时”，符合现代庄重书面普通话，也使悬接下一节的句法清楚。
  terminology: “分别出来”可保留，避免把ἀφορίσας体系化为“预定”或“拣选”；“呼召”和“借着他的恩典”准确且合乎本段宗教语体。“乐意”可反映εὐδόκησεν的美意/欣然意愿。
