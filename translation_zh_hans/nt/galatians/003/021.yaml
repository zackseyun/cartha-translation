id: GAL.3.21
reference: Galatians 3:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ὁ οὖν νόμος κατὰ τῶν ἐπαγγελιῶν τοῦ θεοῦ; μὴ γένοιτο· εἰ γὰρ ἐδόθη νόμος ὁ δυνάμενος ζῳοποιῆσαι, ὄντως ⸂ἐκ νόμου ἂν⸃ ἦν ἡ δικαιοσύνη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/021.yaml
  text: Is the law then against the promises of God? May it never be! For if a law had been given that was able to give life[a], then righteousness really would have been from the law.
translation:
  language: zh_hans
  text: 那么，律法是与上帝的众应许相对立的吗？绝对不是！因为，若曾赐下一条能使人得生命的律法，义就确实会出于律法了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νόμος
  choice: 律法
  rationale: 既保留本段对摩西律法的明显呼应，也适用于后半句假设中作为类别来谈的“律法”；不加专名号，以免把概念范围限定得过窄。
- source_word: κατὰ
  choice: 与……相对立
  rationale: κατά加属格在此表达敌对或抵触关系；“相对立”准确传达修辞问句中的张力。
- source_word: ἐπαγγελιῶν
  choice: 众应许
  rationale: 保留希腊文复数，并自然指向上下文中上帝所赐的各项应许。
- source_word: μὴ γένοιτο
  choice: 绝对不是！
  rationale: 这是保罗强烈否定的惯用语；该译法在现代汉语中自然有力，又不引入额外含义。
- source_word: ἐδόθη
  choice: 所赐的
  rationale: 以被动定语形式保留“被赐下”的含义，并使汉语条件句简洁流畅。
- source_word: δυνάμενος
  choice: 能够
  rationale: 准确表达修饰“律法”的能力或可能性。
- source_word: ζῳοποιῆσαι
  choice: 赐予生命
  rationale: 体现使人得生命、使之活过来的含义；“赐予”也与律法被赐下的语境协调，但不预先界定生命的具体层面。
- source_word: ὄντως
  choice: 真的
  rationale: 自然表达结论中的强调语气。
- source_word: ἐκ νόμου
  choice: 出于律法
  rationale: 保留ἐκ所表达的来源关系，避免仅译为手段性的“靠律法”。
- source_word: δικαιοσύνη
  choice: 义
  rationale: “义”是现代中文圣经语境中简洁而有尊严的对应词，可涵盖正直、正义以及在上帝面前被判为正等相关维度；另一可能译法在脚注保留。
theological_decisions:
- issue: δικαιοσύνη在保罗论证中的含义
  choice: 义
  alternative: 正义
  rationale: 本节讨论义是否能够出于律法。“义”保留该词在保罗书信中可能涉及的正当状态、正直和上帝判定等多重意味，不把它缩减为单一教义解释；“正义”作为真实的词义可能性列入脚注。
- issue: 律法与上帝应许的关系
  choice: 以强烈否定保留修辞张力
  alternative: 解释为律法与应许彼此互补
  rationale: 原文只否定律法与应许相对立，并以不能赐生命的律法作为理由；译文不额外说明二者如何协调，以免替保罗完成未在本句明说的神学推论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那么”承接上文推论；“绝对不是”传达保罗强烈的否定；整体尽量保留希腊文的问答和条件句结构。
