  text: πάντες γὰρ υἱοὶ θεοῦ ἐστε διὰ τῆς πίστεως ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/026.yaml
  text: For you are all sons of God through faith in Messiah Jesus[a][b].
translation:
  language: zh_hans
  text: 因为你们众人借着信，在弥赛亚耶稣里都是上帝的儿子[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“上帝的儿女”。原文直译为“儿子”，含有儿子名分和承受产业的意味；这里的“你们众人”包括男女。
    reason: lexical_alternative
  - marker: b
    text: 传统译法：“基督耶稣”。“弥赛亚”和“基督”都指“受膏者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: 你们众人
  rationale: 与复数第二人称“你们是”相配，强调受信群体中的所有人；比单说“都”更清楚地呈现 πάντες。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文并说明理由，保留 γάρ 的论证连接作用。
- source_word: υἱοὶ θεοῦ
  choice: 上帝的儿子
  rationale: υἱοί 明确意为“儿子”；此处不仅涉及亲子身份，也带有保罗语境中的承受产业意味。脚注说明其所指范围包括所有信徒，以免现代读者误解为仅指男性。
- source_word: διὰ τῆς πίστεως
  choice: 借着信
  rationale: διά 加属格表示途径或媒介；“借着信”既自然，又保留原文的工具性表达。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: 在弥赛亚耶稣里
  rationale: 保留 ἐν 的“在……里”表达，以呈现保罗所强调的联合关系；将 Χριστός 作为称号译作“弥赛亚”，而非仅作音译性传统称谓“基督”。
theological_decisions:
- issue: 带性别的儿子名分用语
  choice: 上帝的儿子
  alternative: 上帝的儿女
  rationale: 原文使用 υἱοί，而非中性或泛指“孩子”的词。“儿子”保留儿子名分及承受产业的神学张力；脚注同时澄清这里的“你们众人”并不排除女性。
- issue: ἐν Χριστῷ Ἰησοῦ 的关系
  choice: 在弥赛亚耶稣里
  alternative: 信弥赛亚耶稣
  rationale: 不把 ἐν 静默改写成信心的对象，而保留其可能修饰“是上帝的儿子”的联合语义。中文语序使这一关系可读，同时没有否认信以弥赛亚耶稣为对象的语境理解。
- issue: Χριστός 的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: Χριστός 在此是称号；“弥赛亚”在现代中文中能较清楚地传达这一身份称号。传统译法列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们众人……都”保留全体性的强调；“在……里”沿用保罗书信中关系性、联合性的表达。主文中的脚注标记均与脚注对应。
