  text: ἀλλὰ συνέκλεισεν ἡ γραφὴ τὰ πάντα ὑπὸ ἁμαρτίαν ἵνα ἡ ἐπαγγελία ἐκ πίστεως Ἰησοῦ Χριστοῦ δοθῇ τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/022.yaml
  text: But the Scripture imprisoned everything under sin[b][a], so that the promise by faith in Jesus the Messiah might be given to those who believe.
translation:
  language: zh_hans
  text: 但圣经把万有都禁闭在罪之下[b]，为要使那因信靠耶稣弥赛亚而来的应许[a]得以赐给相信的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因耶稣弥赛亚的信实而来的应许。”
    reason: alternative_reading
  - marker: b
    text: 或译：“把一切都禁闭在罪之下。”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέκλεισεν
  choice: 禁闭
  rationale: 表达封闭并置于拘束之下的力度，也与上下文的看守、拘禁意象相称；现代汉语中简洁而庄重。
- source_word: ἡ γραφή
  choice: 圣经
  rationale: 在保罗书信中，单数带冠词的 ἡ γραφή 可将圣经拟人化为行动主体；汉语“圣经”自然保留这一统一见证的意味。
- source_word: τὰ πάντα
  choice: 万有
  rationale: 中性复数范围广泛，不宜缩限为“所有人”；“万有”既概括全面，也符合庄重的经文语体。
- source_word: ὑπὸ ἁμαρτίαν
  choice: 在罪之下
  rationale: 保留原文处于罪权势之下的空间和支配隐喻，而不在正文中增补“权势”或“辖制”等解释。
- source_word: ἡ ἐπαγγελία
  choice: 应许
  rationale: 直接对应原文名词，避免解释性地改为“所应许的福分”。
- source_word: ἐκ πίστεως Ἰησοῦ Χριστοῦ
  choice: 出于对耶稣弥赛亚之信
  rationale: 正文采用较常见的宾语属格理解，即信靠耶稣弥赛亚；“出于”保留 ἐκ 所表达的来源或依据关系，并以脚注保存主体属格的可能。
- source_word: Χριστοῦ
  choice: 弥赛亚
  rationale: 此处与“耶稣”连用，仍具有称号意味；“弥赛亚”清楚呈现其称号内涵。
- source_word: δοθῇ
  choice: 赐给
  rationale: 被动虚拟式置于 ἵνα 目的结构中；“为要使……赐给”在汉语中表达目的，并以“赐”契合应许由上帝给予的语境。
- source_word: τοῖς πιστεύουσιν
  choice: 相信的人
  rationale: 保留现在分词所描述的信之回应，不仅将其转化为固定身份标签。
theological_decisions:
- issue: πίστεως Ἰησοῦ Χριστοῦ 的属格关系
  choice: 宾语属格：“对耶稣弥赛亚之信”
  alternative: 主体属格：“耶稣弥赛亚的信实”
  rationale: 原文结构确有争议。正文采用常见的宾语属格理解，但以脚注保留主体属格读法，避免消除其真实的神学张力。
- issue: τὰ πάντα 的指涉范围
  choice: 万有
  alternative: 众人／一切人和事物
  rationale: 原文为中性复数且具有全面范围；不把它限定为仅指人，也不在正文中展开其可能包括的对象。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“禁闭”保留拘束意象，“在罪之下”保留原文隐喻；“万有”避免把中性复数过早限定为人。脚注标记均已置于正文相关短语之后。
