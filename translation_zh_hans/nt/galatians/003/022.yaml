  to: 但圣经把万有都禁闭在罪之下[b]，为要使那因信靠耶稣弥赛亚而来的应许[a]得以赐给相信的人。
  rationale: 修订仅解决汉语句法及被动目的结构的表达：以“得以赐给”对应δοθῇ，并将a脚注锚定在“应许”所由来的信心/信实短语上。保留“万有”以不把τὰ πάντα限定为仅指人，保留“禁闭”以传达συνέκλεισεν的拘禁意象。
