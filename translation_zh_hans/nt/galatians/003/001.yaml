  text: Ὦ ἀνόητοι Γαλάται, τίς ὑμᾶς ⸀ἐβάσκανεν, οἷς κατ’ ὀφθαλμοὺς Ἰησοῦς Χριστὸς ⸀προεγράφη ἐσταυρωμένος;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/001.yaml
  text: You foolish Galatians[a], who has bewitched you[c][b], before whose eyes Jesus the Messiah was publicly portrayed as crucified?
translation:
  language: zh_hans
  text: 愚昧的加拉太人哪！谁蛊惑了[a]你们？耶稣基督[c]曾被清楚地展示在你们眼前，是被钉十字架的那一位。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蛊惑”也可译作“迷惑”或“欺骗”；原词带有施术或邪眼迷人的鲜明意味。
    reason: lexical_alternative
  - marker: b
    text: “清楚地展示”也可译作“公开呈现”或“像告示一样张示”。原文没有明确展示所用的媒介。
    reason: lexical_alternative
  - marker: c
    text: “基督”意为“受膏者”，也就是“弥赛亚”。
    reason: lexical_clarification
lexical_decisions:
- source_word: ἀνόητοι
  choice: 愚昧的
  rationale: 表达缺乏领悟、没有思想明白的责备，保留保罗尖锐的语气，却不额外加上邪恶或不道德的判断。
- source_word: ἐβάσκανεν
  choice: 蛊惑了
  rationale: 保留动词所带有的施术、迷惑之鲜明意象；“欺骗”虽可能表达语境中的实际作用，却会削弱原文的修辞力度。
- source_word: οἷς κατ’ ὀφθαλμοὺς
  choice: 在你们眼前
  rationale: 以自然汉语表达亲眼可见、公开摆在面前的意味。
- source_word: Ἰησοῦς Χριστός
  choice: 耶稣基督
  rationale: 采用现代汉语中通行且庄重的名称—称号表达；“基督”在此仍是称号，其含义以脚注说明。
- source_word: προεγράφη
  choice: 原已清楚地展示
  rationale: 表达公开、鲜明地呈现于人前的核心意思，同时避免把具体媒介限定为书写、绘画或张贴告示。
- source_word: ἐσταυρωμένος
  choice: 被钉十字架
  rationale: 保留完成时被动分词所强调的状态：所展示的耶稣正是那位被钉十字架的。
theological_decisions:
- issue: Χριστός在“Ἰησοῦς Χριστός”中的称号含义
  choice: 正文译作“耶稣基督”，脚注说明“基督”意为受膏者、即弥赛亚
  alternative: 耶稣弥赛亚
  rationale: “基督”是汉语基督教传统中广为人知的标准称号；脚注使其称号意义不被当作姓氏，同时不在正文中采用较不常见的名称组合。
- issue: ἐβάσκανεν是否指字面施法
  choice: 保留“蛊惑”的形象，不断定确有巫术发生
  alternative: 欺骗了
  rationale: 原词可唤起邪眼或施术的意象，也可泛指受到恶意迷惑；译文保留这种张力，不把保罗的话扁平化为普通欺骗，也不教义化地断言巫术。
- issue: προεγράφη所指的展示方式
  choice: 译作“清楚地展示”而不指定媒介
  alternative: 公开张贴／描绘
  rationale: 该词可指公开张示或鲜明呈现；本节未明确说明是文字、图像还是宣讲，因此不把某一种解释写死。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“哪”强化直接呼告，“原已”凸显加拉太人先前已经清楚领受的事实。将希腊文一个连续的反问结构分成呼告与问句，使汉语自然，同时保留两部分紧密的逻辑关系。
