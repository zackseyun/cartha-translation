base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/003.yaml
  text: Are you so foolish? Having begun by the Spirit[c][b][a], are you now being perfected by the flesh?
translation:
  language: zh_hans
  text: 你们竟这样愚昧吗？既靠圣灵开始，如今反要靠肉体达到完全吗？[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “靠圣灵”也可译作“在圣灵里”；“靠肉体”也可理解为“靠人的努力”，或“靠罪性”。
    reason: lexical_alternative
  - marker: b
    text: “达到完全”也可译作“被成全”或“完成”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: 竟这样
  rationale: 在责问中表达程度，并以“竟”自然传达保罗的惊讶和责备语气。
- source_word: ἀνόητοί
  choice: 愚昧
  rationale: 指缺乏属灵理解和判断；语气直接而庄重，又不误译为智力低下。
- source_word: ἐναρξάμενοι
  choice: 既……开始
  rationale: 体现不定过去时分词相对于主句的先行动作，并使前后方式的反差清楚自然。
- source_word: πνεύματι
  choice: 靠圣灵
  rationale: 上下文指向信徒所领受的圣灵；与“靠肉体”对举时，工具或凭借义最为自然。
- source_word: νῦν
  choice: 如今
  rationale: 明确保留从起初到当前的时间反差。
- source_word: σαρκὶ
  choice: 靠肉体
  rationale: 保留保罗“圣灵—肉体”的原有对举及“肉体”的多层含义，不在正文中径直缩减为“人的努力”或“罪性”。
- source_word: ἐπιτελεῖσθε
  choice: 达到完全
  rationale: 表达从开始走向完成或成熟的过程，同时避免生硬的被动表达；原文中间或被动语态的可能差异以脚注保留。
theological_decisions:
- issue: πνεύματι 的所指
  choice: 圣灵
  alternative: 人的灵；属灵原则
  rationale: 加拉太书3章的近距上下文谈到领受圣灵及圣灵的工作，因此这里最自然地指圣灵。
- issue: σάρξ 与圣灵对举时的含义
  choice: 肉体
  alternative: 人的努力；罪性
  rationale: 保留保罗用语的神学张力；此处既涉及人的能力和手段，也可能带有堕落本性的意味，不宜在正文中只选一种解释。
- issue: ἐπιτελεῖσθε 的语态
  choice: 达到完全
  alternative: 被成全；完成
  rationale: 希腊文形式可作中间或被动理解；译文以自然汉语表达趋向完成的过程，不明确指定行动主体。
translation_notes:
  register: 采用现代、庄重而直接的普通话。“竟这样愚昧吗”保留强烈的反问责备；“靠圣灵／靠肉体”形成清晰对称。所有脚注标记均置于正文相关句末。
