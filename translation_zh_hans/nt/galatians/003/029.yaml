  text: εἰ δὲ ὑμεῖς Χριστοῦ, ἄρα τοῦ Ἀβραὰμ σπέρμα ἐστέ, ⸀κατ’ ἐπαγγελίαν κληρονόμοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/029.yaml
  text: And if you are Messiah’s[a], then you are Abraham’s seed[b], heirs according to promise.
translation:
  language: zh_hans
  text: 你们若属于弥赛亚[a]，就是亚伯拉罕的后裔[b]，也是照着应许承受产业的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“属于基督”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“种子”，在这里是单数的集合名词，也可译“子孙”；这呼应了保罗在本章前文所用的词。
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστοῦ
  choice: 属于弥赛亚
  rationale: Χριστός在这里是称号，译作“弥赛亚”；属格表示归属，用现代汉语自然地表达为“属于弥赛亚”。
- source_word: σπέρμα
  choice: 后裔
  rationale: 该词在原文中为单数，却具有集合意义；“后裔”既符合现代汉语，也能承接本章前文关于亚伯拉罕之“后裔”的论述。脚注保留其原文“种子”的字面意象及单数形式。
- source_word: κληρονόμοι
  choice: 承受产业的人
  rationale: 此译法自然表达家族与应许语境中的继承身份，同时避免现代汉语“继承人”可能过度偏向遗嘱法律用语。
- source_word: κατ’ ἐπαγγελίαν
  choice: 照着应许
  rationale: 保留介词短语在依据、准则或方式之间的语义宽度，不擅自限定为单一解释。
- source_word: εἰ δὲ ὑμεῖς ... ἄρα
  choice: 你们若……就是……也是……
  rationale: 清楚呈现条件与推论关系；δέ在此仅作轻微承接，汉语中不必机械译出。
theological_decisions:
- issue: σπέρμα应采用字面“种子”，还是采用自然的集合称谓。
  choice: 正文译“后裔”，脚注说明原文为单数的“种子”。
  alternative: 正文译“种子”或“子孙”。
  rationale: “后裔”在汉语中可作集合称谓，并能维持加拉太书第三章内部的词语联系；同时用脚注让读者看见保罗论证所依赖的单数形式和“种子”意象。
- issue: Χριστός应译为称号“弥赛亚”还是传统译名“基督”。
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处保留其称号性质，不将其处理成近似专名；脚注列出传统译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“属于弥赛亚”明确表达归属关系；“承受产业的人”保留圣经家族与应许语境，又避免生硬直译。
