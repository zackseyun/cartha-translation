  text: ἐλθούσης δὲ τῆς πίστεως οὐκέτι ὑπὸ παιδαγωγόν ἐσμεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/025.yaml
  text: But now that faith has come[b][a], we are no longer under a guardian.
translation:
  language: zh_hans
  text: 但如今，既然信已经来到[a]，我们就不再处在监护人的管束之下了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“既然这信仰已经来到。”
    reason: 保留τῆς πίστεως在上下文中可能指已经显明的信仰内容或信仰时代这一理解。
  - marker: b
    text: “监护人”所译的希腊词，指古代家庭中负责看管、约束未成年人的人，并非主要指课堂教师。
    reason: 说明古代文化背景，防止把παιδαγωγός误解为现代意义上的老师。
lexical_decisions:
- source_word: ἐλθούσης
  choice: 既然……已经来到
  rationale: 不定过去时分词构成属格独立结构，在这里表达时间背景并带有现今结果；译为“既然……已经来到”自然地保留了已经发生的转折。
- source_word: δὲ
  choice: 但
  rationale: 表示与上一节所述律法监管时期之间的温和转折。
- source_word: πίστεως
  choice: 信
  rationale: 按其在本段与律法相对的语境译作“信”，同时不在正文中强行限定为一套客观信仰内容；另一可能性见脚注。
- source_word: οὐκέτι
  choice: 不再
  rationale: 直接表达先前状态已经终止。
- source_word: ὑπὸ
  choice: 受……监管
  rationale: ὑπό与παιδαγωγός连用表示处在其权柄和照管之下；中文用“受……监管”比直译“在……之下”更清楚。
- source_word: παιδαγωγόν
  choice: 监护人
  rationale: 指古代家庭中负责看管、约束未成年人的人，并非主要指课堂教师；“监护人”最能在现代中文中传达这一角色。
- source_word: ἐσμεν
  choice: 我们……了
  rationale: 现在时系词与“不再”共同说明现今已不处于先前的监管状态；句末“了”使状态转变在中文中更自然。
theological_decisions:
- issue: “信来到”的含义
  choice: 正文译为“信已经来到”，保留保罗所描述的救恩历史转折，也允许“信”具有信靠这一层通常含义。
  alternative: 译为“这信仰已经来到”，强调弥赛亚所开启的信仰时代或已经显明的信仰内容。
  rationale: 原文πίστις在此无冠词，但由上下文明确限定，并与律法先前的监管时期形成时间对照。正文不把它过度具体化，脚注则保留其可能的客观或时代性含义。
- issue: 信徒与律法监管关系的终止
  choice: 译为“不再受监护人的监管”，陈述保罗比喻中的身份转变。
  alternative: 译为“不再在监护人之下”，更贴近原文形式，却可能令现代读者误解其具体角色。
  rationale: 此译法只呈现本句的比喻，不进一步断定律法在所有层面上的功能或效力，避免加入宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“既然……已经……”自然呈现属格独立结构的时间与结果关系；“受监护人的监管”清楚传达古代未成年人受约束的比喻。所有脚注标记均置于正文相关表达之后。
