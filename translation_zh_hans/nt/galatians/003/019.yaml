  text: Τί οὖν ὁ νόμος; τῶν παραβάσεων χάριν προσετέθη, ἄχρις ⸀οὗ ἔλθῃ τὸ σπέρμα ᾧ ἐπήγγελται, διαταγεὶς δι’ ἀγγέλων ἐν χειρὶ μεσίτου·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/019.yaml
  text: Why then the law? It was added because of transgressions until the seed should come to whom the promise had been made[c][b][a], having been ordained through angels by the hand of a mediator.
translation:
  language: zh_hans
  text: 那么，律法又是为何而设呢？它是因着过犯添上的[b]，直到那位承受应许的后裔来到[a]；它是借着天使、由一位中保经手而设立的[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后裔”原文直译为“种子”，也可译作“子孙”。
    reason: lexical_alternative
  - marker: b
    text: “因着过犯”可能指为处理、显明或约束过犯；原文没有作更具体的说明。
    reason: alternative_reading
  - marker: c
    text: “设立”也可译作“安排”或“颁定”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ὁ νόμος;
  choice: 那么，律法是为什么而有的呢？
  rationale: 将省略式问句按上下文理解为询问律法的用途，而非要求给律法下定义；中文补出“而有的”使问句自然清楚。
- source_word: τῶν παραβάσεων χάριν
  choice: 因过犯
  rationale: 保留 χάριν 可表达原因或目的的宽泛性，不在正文中限定律法究竟是为处理、显明还是约束过犯。
- source_word: προσετέθη
  choice: 加上的
  rationale: 直接表达律法后来被增添的被动含义，并保留其在论证中具有附加性质的意味。
- source_word: τὸ σπέρμα
  choice: 后裔
  rationale: 中文“后裔”既自然，又可作为集合名词或指特定的一位，能够承接亚伯拉罕应许的语境及本段的单数形式；脚注注明字面选项。
- source_word: ᾧ ἐπήγγελται
  choice: 那位蒙受应许的
  rationale: 将关系代词的与格关系自然地融入中文，并以“蒙受应许”表达完成时所指已经立定且持续有效的应许。
- source_word: διαταγεὶς
  choice: 安排的
  rationale: 表达 διατάσσω 在此所含的正式设立、部署之意，同时避免“颁布”过度收窄其语义。
- source_word: δι’ ἀγγέλων
  choice: 借着天使
  rationale: 保留 διά 加属格所表达的中介或工具作用。
- source_word: ἐν χειρὶ μεσίτου
  choice: 经一位中保的手
  rationale: 尽量保留原文“在……手中／借……之手”的具体表达，同时以“经”使现代中文可懂。
theological_decisions:
- issue: “因过犯”的具体含义
  choice: 正文宽泛译作“因过犯”，不说明律法对过犯所起的具体作用。
  alternative: 为约束过犯；为显明过犯；针对过犯
  rationale: 原文简洁，既可涉及原因也可涉及目的，并未进一步界定；翻译不替保罗消解这一神学张力。
- issue: σπέρμα 在保罗论证中的译法
  choice: 译作“后裔”，并以脚注保留“种子”的字面对应。
  alternative: 种子；子孙
  rationale: “后裔”在现代中文中自然，并能保持单复数上的弹性；脚注则保存它与亚伯拉罕应许用语之间的词汇联系。
- issue: 律法的中介性
  choice: 保留“借着天使、经一位中保的手”这两层中介表达。
  alternative: 由天使经中保颁布
  rationale: 原文强调律法被安排时的中介结构；不在翻译中确定天使或中保更具体的身份与角色。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“那么”承接上文论证；分号厘清“直到……”与后置分词“安排的”之间的结构。所有脚注标记均紧随相关词句。
