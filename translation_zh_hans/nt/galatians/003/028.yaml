id: GAL.3.28
reference: Galatians 3:28
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὐκ ἔνι Ἰουδαῖος οὐδὲ Ἕλλην, οὐκ ἔνι δοῦλος οὐδὲ ἐλεύθερος, οὐκ ἔνι ἄρσεν καὶ θῆλυ· ⸀πάντες γὰρ ὑμεῖς εἷς ἐστε ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/028.yaml
  text: There is no Jew or Greek[a], there is no slave or free, there is no male and female[b]; for you are all one in Messiah Jesus.
translation:
  language: zh_hans
  text: 没有犹太人，也没有希腊人；没有奴隶，也没有自由人；没有男和女[a]；因为你们在弥赛亚耶稣里[b]全都为一。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“男和女”，可能呼应《创世记》1:27；也可译作“没有男，也没有女”。
    reason: 说明原文连接词的特殊变化及可能的经文呼应。
  - marker: b
    text: 希腊文通常译作“在基督耶稣里”；这里译作“在弥赛亚耶稣里”，因为 Χριστός 在此是称号。
    reason: 说明称号 Χριστός 的译法。
lexical_decisions:
- source_word: οὐκ ἔνι
  choice: 没有
  rationale: 用现代汉语自然的存在否定表达，并在三个分句中重复，以保留原文的强调结构。
- source_word: Ἰουδαῖος
  choice: 犹太人
  rationale: 与“希腊人”相对时，主要指民族及宗教身份；“犹太人”最清楚、通行。
- source_word: Ἕλλην
  choice: 希腊人
  rationale: 原文具体说“希腊人”，没有泛化为所有外邦人。
- source_word: δοῦλος
  choice: 奴隶
  rationale: 这里与“自由人”构成社会身份上的鲜明对比，“奴隶”准确体现受奴役的身份。
- source_word: ἐλεύθερος
  choice: 自由人
  rationale: 与“奴隶”对应，既准确又符合现代汉语表达。
- source_word: ἄρσεν καὶ θῆλυ
  choice: 男和女
  rationale: 保留原文在第三组中使用“和”而非“也不”的变化，并传达其可能对《创世记》1:27“男和女”的呼应。
- source_word: πάντες ὑμεῖς
  choice: 你们……全都
  rationale: 同时保留第二人称复数和整体性的强调。
- source_word: εἷς ἐστε
  choice: 全都为一
  rationale: 保留单数谓语“一”所表达的群体合一，不扩写成“一人”或仅释义为“团结”。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: 在弥赛亚耶稣里
  rationale: 保留“在……里”的联合关系，并把 Χριστός 按其称号含义译作“弥赛亚”。
theological_decisions:
- issue: 如何处理第三组 ἄρσεν καὶ θῆλυ 中不同于前两组的连接词 καὶ
  choice: 没有男和女
  alternative: 不分男女／没有男，也没有女
  rationale: 直译“和”虽在汉语中略显突兀，却保留了原文措辞的变化及其可能对《创世记》1:27的呼应，避免把文本的张力抹平。
- issue: 是否解释性扩展 εἷς ἐστε
  choice: 你们……全都为一
  alternative: 你们都合而为一／你们都是一个人
  rationale: 原文宣告众人在弥赛亚里为一，却未具体说明这种合一如何作用于各类受造或社会差异，因此不作超出经文的解释。
- issue: Χριστός 在本节应译作称号还是沿用音译传统
  choice: 弥赛亚
  alternative: 基督／受膏者
  rationale: 此处 Χριστός 仍指耶稣的受膏君王身份；“弥赛亚”在现代中文中可清楚体现其称号性质。
translation_notes:
  register: 采用庄重而明白的现代标准汉语。三个“没有”分句保留保罗的排比与强调；第三组刻意保留略显反常的“男和女”，并以脚注帮助普通读者理解。末句用“全都为一”，避免过度解释，同时保持经文凝练的神学表达。
