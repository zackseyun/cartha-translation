  text: προϊδοῦσα δὲ ἡ γραφὴ ὅτι ἐκ πίστεως δικαιοῖ τὰ ἔθνη ὁ θεὸς προευηγγελίσατο τῷ Ἀβραὰμ ὅτι Ἐνευλογηθήσονται ἐν σοὶ πάντα τὰ ἔθνη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/008.yaml
  text: 'And the Scripture[a], foreseeing that God justifies the nations by faith[b], proclaimed the good news beforehand to Abraham: “In you all the nations will be blessed.”'
translation:
  language: zh_hans
  text: 圣经预先看明，上帝要使万国[a]因信称义，就预先向亚伯拉罕传了福音[b]：“万国都必因你得福。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “万国”也可译作“外邦人”；希腊语ἔθνη可指各国，也可指非犹太人。
    reason: lexical_alternative
  - marker: b
    text: “预先传了福音”也可译作“预先宣告了好消息”。
    reason: lexical_alternative
lexical_decisions:
- source_word: προϊδοῦσα
  choice: 预先看明
  rationale: 表达不定过去时分词所含的先行看见之意，又使拟人化的“圣经”作主语在现代汉语中自然清楚。
- source_word: ἡ γραφή
  choice: 圣经
  rationale: 这里是保罗惯用的、带拟人色彩的经书称谓，并非泛指某一篇文字；汉语无需另行表达希腊语定冠词。
- source_word: ἐκ πίστεως
  choice: 因信
  rationale: 简洁表达信是称义的根据或途径，同时避免把介词短语过度细化为单一哲学范畴。
- source_word: δικαιοῖ
  choice: 使……称义
  rationale: 保留保罗论述中 δικαιόω 的法庭性及关系性用语；“称义”是简明且通行的汉语圣经术语。
- source_word: τὰ ἔθνη ... πάντα τὰ ἔθνη
  choice: 万国……万国
  rationale: 两处用同一译法，保留保罗陈述与亚伯拉罕应许之间的词语呼应；脚注说明也可理解为“外族人”。
- source_word: προευηγγελίσατο
  choice: 预先……传了福音
  rationale: 同时保留 προ- 的“预先”以及 εὐαγγελ- 的“福音/好消息”含义，句式符合现代汉语。
- source_word: τῷ Ἀβραὰμ
  choice: 向亚伯拉罕
  rationale: 自然表达与格所标示的宣告对象。
- source_word: Ἐνευλογηθήσονται
  choice: 必……得福
  rationale: “必”表达将来应许的确定语气，“得福”自然传达被动式“蒙福”。
- source_word: ἐν σοὶ
  choice: 因你
  rationale: 这是创世记应许在汉语中的自然表达，可涵盖亚伯拉罕作为万国得福媒介或关联对象的意义，而不扩写其具体机制。
theological_decisions:
- issue: ἔθνη 应译为“万国”还是“外族人”
  choice: 两处均译“万国”
  alternative: 第一处译“外族人”，引文中译“万国”
  rationale: “万国”保留同一希腊词在论述与引文中的重复，使因信称义与亚伯拉罕应许之间的联系清晰可见；词义上的另一可能由脚注保留。
- issue: ἐκ πίστεως 如何表达称义与信的关系
  choice: 因信称义
  alternative: 本于信称义；以信为基础称义
  rationale: “因信”在现代汉语中简洁自然，可表达根据或途径，同时不额外界定信与称义之间全部神学机制。
- issue: ἐν σοὶ 如何表达亚伯拉罕与万国得福的关系
  choice: 因你得福
  alternative: 在你里面得福；借着你得福
  rationale: “因你”既符合汉语引文表达，也不将该介词明确限定为联合或工具意义，因而保留原文关系的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“圣经”作为拟人化主语，并以“预先看明……就预先……”呈现原文的先见与预告关系；“称义”“福音”沿用广为理解的核心圣经术语。
