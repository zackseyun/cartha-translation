  text: Ἀδελφοί, κατὰ ἄνθρωπον λέγω· ὅμως ἀνθρώπου κεκυρωμένην διαθήκην οὐδεὶς ἀθετεῖ ἢ ἐπιδιατάσσεται.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/015.yaml
  text: 'Brothers[a], I am speaking in human terms: even a covenant ratified by a man[b], no one sets aside or adds to it.'
translation:
  language: zh_hans
  text: 弟兄们[a]，我照人的常理来说：即使是人所立、已经正式确认的约[b]，也没有人废除它，或在其上另加条款。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”译自阳性复数词 adelphoi；保罗是在称呼同信者，很可能也包括女性。
    reason: cultural_note
  - marker: b
    text: “约”也可译作“遗嘱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊文阳性复数呼语的形式；此处是保罗对同信者的称呼，而听众很可能也包括女性，故在脚注说明。
- source_word: κατὰ ἄνθρωπον λέγω
  choice: 我照人的常理来说
  rationale: 这是引入日常人事类比的惯用表达。“照人的常理来说”既传达人的层面或通常做法，也符合现代汉语表达。
- source_word: ὅμως
  choice: 即使
  rationale: 在此加强论证：即使只看人与人之间已经确认的约，以下原则仍然成立。
- source_word: ἀνθρώπου
  choice: 经人
  rationale: 保留单数属格所表达的人为层面，同时避免在汉语中不自然地强调性别。
- source_word: κεκυρωμένην
  choice: 确认的
  rationale: 完成时被动分词表示该约已经正式确认并具有约束力；“确认”自然且保留法律语气。
- source_word: διαθήκην
  choice: 约
  rationale: 上下文讨论神给亚伯拉罕的应许，译作“约”最能保持论证的连续性；“遗嘱”是词义上的真实可能，列入脚注。
- source_word: ἀθετεῖ
  choice: 废除
  rationale: 表达使之失效、取消其效力的法律含义，比口语性的“撇开”更准确。
- source_word: ἐπιδιατάσσεται
  choice: 在其上另加条款
  rationale: 该动词指进一步附加规定；补出“条款”使法律语境在汉语中清楚，而不改变原意。
theological_decisions:
- issue: διαθήκη应译为“约”还是“遗嘱”
  choice: 约
  alternative: 遗嘱
  rationale: 本章围绕神对亚伯拉罕所立的约和所赐的应许展开，因此“约”最符合上下文及保罗的神学论证；同时，人的法律类比使“遗嘱”这一词义仍值得在脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“照人的常理来说”自然地引出日常法律类比；后半句保留原文并列结构，并以“另加条款”显明其法律语境。
