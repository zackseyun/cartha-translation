  to: 这些应许是向亚伯拉罕和他的后裔[a]说的。他不是说：“和众后裔[b]”，指着许多人；而是指着一个人说：“和你的后裔。”这后裔就是弥赛亚[c]。
  rationale: 修订“好像是指”为“指着”，以准确表达原文的所指关系，避免引入不确定意味；删去原文未明说的“经上”；并微调首句搭配。其余术语、单复数论证、引文和脚注锚点均保留。
