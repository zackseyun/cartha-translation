source:
  edition: SBLGNT
  text: τῷ δὲ Ἀβραὰμ ἐρρέθησαν αἱ ἐπαγγελίαι καὶ τῷ σπέρματι αὐτοῦ· οὐ λέγει· Καὶ τοῖς σπέρμασιν, ὡς ἐπὶ πολλῶν, ἀλλ’ ὡς ἐφ’ ἑνός· Καὶ τῷ σπέρματί σου, ὅς ἐστιν Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/016.yaml
  text: The promises were spoken to Abraham and to his offspring[a]. It does not say, “And to offsprings,” as referring to many, but as referring to one[c][b], “And to your offspring,” who is Messiah.
translation:
  language: zh_hans
  text: 这些应许是向亚伯拉罕和他的后裔[a]说的。他不是说：“和众后裔[b]”，指着许多人；而是指着一个人说：“和你的后裔。”这后裔就是弥赛亚[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后裔”也可译作“种子”。本节希腊语使用一个可作集合名词的单数形式，这是保罗论证的关键。
    reason: lexical_alternative
  - marker: b
    text: 希腊语直译为“和众种子”；保罗在这里强调原话使用的是单数形式，而不是复数形式。
    reason: lexical_alternative
  - marker: c
    text: “弥赛亚”也可译作“基督”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρρέθησαν
  choice: 是……说的
  rationale: 自然表达被动语态，保留“说出、宣告”的言语行为，不增添原文没有的时间副词。
- source_word: ἐπαγγελίαι
  choice: 应许
  rationale: 这是保罗书信中清楚、通行的神学用语，也贴近原词的复数形式；汉语可由“这些”明确其复数。
- source_word: σπέρμα / σπέρματι
  choice: 后裔
  rationale: “后裔”在现代汉语中自然，并且与希腊语一样可作集合性单数，适合保留保罗论证所依赖的语义张力。
- source_word: τοῖς σπέρμασιν
  choice: 众后裔
  rationale: 用“众”把希腊语刻意使用的复数形式显明出来，同时避免不自然的“后裔们”；脚注说明原文为复数。
- source_word: ὡς ἐπὶ πολλῶν
  choice: 好像是指许多人
  rationale: 以自然汉语表达该短语的所指关系，并与下句形成平衡。
- source_word: ἀλλ’ ὡς ἐφ’ ἑνός
  choice: 好像是指一个人
  rationale: 保留单复数对照；“一个人”将阳性关系代词ὅς所确认的人格指向表达清楚。
- source_word: Χριστός
  choice: 弥赛亚
  rationale: 此处是对所应许后裔身份的称号性认定，“弥赛亚”能显明“受膏者”的头衔含义。
theological_decisions:
- issue: 集合名词“后裔”的单数形式与多人所指之间的张力
  choice: 正文保留“后裔”，并以“众后裔”显出保罗所强调的复数假设
  alternative: 种子／后裔们
  rationale: 不替保罗化解其释经论证，而是在现代汉语中尽可能呈现他对单数和复数形式的强调。
- issue: Χριστός在身份认定句中的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 这里该词作为受膏君王的称号发挥作用；译作“弥赛亚”保留称号意义，同时脚注给出传统译法。
- issue: ὅς ἐστιν Χριστός的表达
  choice: 这一个人就是弥赛亚
  alternative: 这后裔就是弥赛亚
  rationale: 关系代词ὅς为阳性单数，与中性名词σπέρμα在语法性别上并不一致，显示所指是一个人；译文把这一转折表达出来而不改变认定内容。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。引语中用“众后裔”刻意显出复数对照；分号把语法论证与对所指者的认定连接起来。所有脚注标记均置于相关词语之后。
