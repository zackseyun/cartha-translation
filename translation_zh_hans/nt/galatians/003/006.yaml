  text: καθὼς Ἀβραὰμ ἐπίστευσεν τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/006.yaml
  text: Just as Abraham believed God[a], and it was counted to him as righteousness,
translation:
  language: zh_hans
  text: 正如亚伯拉罕信上帝，这就给他算作义[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“公义”。
    reason: 保留δικαιοσύνη可指公义、正义的词义可能，同时正文采用更符合本句归算语境的“义”。
lexical_decisions:
- source_word: καθὼς
  choice: 正如
  rationale: 保留比较和引证的衔接作用，并自然承接保罗下文的论证。
- source_word: Ἀβραὰμ
  choice: 亚伯拉罕
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: ἐπίστευσεν
  choice: 信了
  rationale: 直接表达简单过去时的相信行动，既符合《创世记》引文传统，也不额外加入“信靠”等解释性意味。
- source_word: τῷ θεῷ
  choice: 上帝
  rationale: πιστεύω所带与格在此表示相信上帝所说的话；中文“信了上帝”可保留这一重点，而不译成较具一般宗教信仰意味的“信上帝”。
- source_word: ἐλογίσθη
  choice: 算为
  rationale: 体现λογίζομαι的归算、认定意味，也符合现代中文中熟悉而简洁的引文表达。
- source_word: αὐτῷ
  choice: 他的
  rationale: “算为他的义”自然表达该义被归算给亚伯拉罕；语义相当于“给他算作义”。
- source_word: εἰς δικαιοσύνην
  choice: 为……义
  rationale: 保留被算作义、获得义之地位的结果性表达，不进一步界定其完整的保罗神学含义。
theological_decisions:
- issue: 保罗引文中δικαιοσύνη的译法
  choice: 义
  alternative: 公义
  rationale: “义”最贴合本句归算与身份认定的语境，也延续《创世记》引文的中文表达；“公义”可体现该词与正义、公正相关的语义范围，故列入脚注，而不在正文中消解其张力。
translation_notes:
  register: 采用庄重、简洁而通顺的现代标准汉语。“正如”保留比较关系；句末用逗号，反映希腊文句法在下一节继续。
