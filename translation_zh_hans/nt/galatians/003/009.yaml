  text: ὥστε οἱ ἐκ πίστεως εὐλογοῦνται σὺν τῷ πιστῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/009.yaml
  text: So then[a], those who are of faith are blessed along with Abraham, the faithful one.
translation:
  language: zh_hans
  text: '所以，那些以信为本的人，都和有信心的亚伯拉罕[a]一同蒙福。


    [a] “有信心的亚伯拉罕”也可译作“信实的亚伯拉罕”或“信徒亚伯拉罕”。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有信心的亚伯拉罕”也可译作“信实的亚伯拉罕”或“信徒亚伯拉罕”。
    reason: 原文πιστός既可表示相信、有信心，也可表示忠信、信实。
lexical_decisions:
- source_word: ὥστε
  choice: 所以
  rationale: 表达承接上文论证所得出的推论，简洁自然。
- source_word: οἱ ἐκ πίστεως
  choice: 那些以信为本的人
  rationale: 保留ἐκ πίστεως所表达的身份和归属特征，不仅泛指一次相信的行为。
- source_word: πίστεως
  choice: 信
  rationale: 本段围绕亚伯拉罕相信神展开，“信”准确、简洁，并与上下文的论证相连。
- source_word: εὐλογοῦνται
  choice: 蒙福
  rationale: 自然地保留被动含义，表明福是人所领受的，并可体现希腊语现在时陈述的一般现实。
- source_word: σὺν
  choice: 和……一同
  rationale: 清楚表达这些人与亚伯拉罕共同领受福分。
- source_word: τῷ πιστῷ Ἀβραάμ
  choice: 有信心的亚伯拉罕
  rationale: 在本章以亚伯拉罕之信为中心的语境中，πιστός较自然地指相信、信靠；同时以脚注保留“信实”的词义可能。
theological_decisions:
- issue: πιστός形容亚伯拉罕时，是指“有信心”还是“信实”
  choice: 有信心的亚伯拉罕
  alternative: 信实的亚伯拉罕；信徒亚伯拉罕
  rationale: πιστός既可描述相信，也可描述忠信、信实。紧接上文亚伯拉罕相信神的论证，正文采用“有信心的”；脚注保留另一真实语义，避免消除原文的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“以信为本”保留原文身份性表达；“蒙福”符合当代中文圣经语体，且不显陈旧。
