  text: ὅσοι γὰρ εἰς Χριστὸν ἐβαπτίσθητε, Χριστὸν ἐνεδύσασθε·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/027.yaml
  text: For as many of you as were baptized into Messiah have put on Messiah[a][b].
translation:
  language: zh_hans
  text: 因为你们凡受洗归入基督的，都披戴了基督。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “披戴了基督”直译为“穿上了基督”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι
  choice: 你们凡……的，都
  rationale: 以自然的现代汉语保留ὅσοι所表达的周延对应关系，并明确这是对加拉太信徒的直接称呼。
- source_word: γὰρ
  choice: 因为
  rationale: 保留本句对前文论述的解释和依据关系。
- source_word: εἰς
  choice: 归入
  rationale: “归入”符合汉语基督教语境，又保留进入、联合或归属基督的含义，不把它弱化为仅仅“与……有关”。
- source_word: Χριστόν
  choice: 基督
  rationale: “基督”是现代汉语中Χριστός最通行且庄重的称谓，在本节两处保持一致。
- source_word: ἐβαπτίσθητε
  choice: 受洗
  rationale: 准确保留被动形式，并避免用“浸”预先裁定洗礼方式。
- source_word: ἐνεδύσασθε
  choice: 披戴了
  rationale: “披戴”简洁保留穿上衣服的隐喻，也能表达以基督为衣的形象；完成性由“了”体现。
theological_decisions:
- issue: 洗礼措辞是否应暗示某种特定的圣礼功效观或施洗方式
  choice: 受洗归入基督
  alternative: 受浸进入基督；受洗而与基督相关
  rationale: 原文以εἰς表达朝向、进入或归入基督的关系，却未在此单独裁定后世关于洗礼功效及方式的争论；译文保留这种神学张力。
- issue: “披戴基督”的隐喻是否应解释为某种特定的称义、成圣或身份教义
  choice: 披戴了基督
  alternative: 与基督联合了；有了基督的身份
  rationale: 保留原文衣着隐喻，不将其缩减或扩写为某一套教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“你们凡……的，都……”自然呈现希腊文的周延结构；“归入”与“披戴”保留原文的联合意象和衣着隐喻。
