  text: εἰ γὰρ ἐκ νόμου ἡ κληρονομία, οὐκέτι ἐξ ἐπαγγελίας· τῷ δὲ Ἀβραὰμ δι’ ἐπαγγελίας κεχάρισται ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/018.yaml
  text: For if the inheritance is from the law[a], it is no longer from a promise; but God has graciously given it to Abraham through a promise.
translation:
  language: zh_hans
  text: 因为产业若是出于律法，就不再是出于应许；但神已经借着应许把产业恩赐给亚伯拉罕。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κληρονομία
  choice: 承受的产业
  rationale: 表达作为继承者所得之物，符合保罗在本段关于应许、后裔和承受产业的论述，也比单用“遗产”更自然地涵盖盟约语境。
- source_word: ἐκ νόμου
  choice: 出于律法
  rationale: 保留ἐκ所表达的来源或依据，并与后文“出于应许”形成对称对比；“律法”在上下文中指讨论中的摩西律法。
- source_word: ἐξ ἐπαγγελίας
  choice: 出于应许
  rationale: 保留来源关系，与“出于律法”平行；汉语无需用不定冠词限定“应许”。
- source_word: δι’ ἐπαγγελίας
  choice: 借着应许
  rationale: 体现διά的媒介或凭借含义，并与前半句的来源表达有所区别。
- source_word: κεχάρισται
  choice: 已经……恩赐
  rationale: “恩赐”保留χαρίζομαι所含的施恩、白白赐予意味，“已经”适度体现完成时所表示的既成行动及其持续效力。
- source_word: τῷ Ἀβραὰμ
  choice: 给亚伯拉罕
  rationale: 清楚表达与格所标示的领受者。
theological_decisions:
- issue: 是否明示χαρίζομαι的恩典色彩
  choice: 译作“恩赐给”
  alternative: 译作“赐给”或“授予”
  rationale: 原词本身带有出于恩惠而赐予的语义；明确表达这一点强化律法与应许之间的原文对比，却不额外加入特定宗派解释。
- issue: 如何处理产业究竟“出于”律法还是应许的排他关系
  choice: 保留“若……就不再……”的条件与排他结构
  alternative: 解释性地译成“不能同时靠律法和应许”
  rationale: 原文直接陈述来源上的排除，译文不进一步界定律法与应许在整个救恩论中的所有关系，以保留保罗论证本身的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“承受的产业”兼顾准确性与普通读者的可理解性；两次使用“出于”保留原文严整的对照，“借着”则呈现διά与ἐκ的区别。后半句补出“这产业”，使中文指代清晰而不增添新的内容。
