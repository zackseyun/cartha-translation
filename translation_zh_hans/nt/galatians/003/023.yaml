id: GAL.3.23
reference: Galatians 3:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Πρὸ τοῦ δὲ ἐλθεῖν τὴν πίστιν ὑπὸ νόμον ἐφρουρούμεθα ⸀συγκλειόμενοι εἰς τὴν μέλλουσαν πίστιν ἀποκαλυφθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/023.yaml
  text: But before faith came[a], we were being guarded under the law[d][c][b], confined until the faith that was about to be revealed.
translation:
  language: zh_hans
  text: 但在信[a]来到以前，我们被看守在律法之下[b]，被拘禁[c]，直到那将要被显明的信。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这信”。希腊文有冠词，可能指随着基督来到而开启的信之时代。
    reason: alternative_reading
  - marker: b
    text: “被看守”也可译作“被羁押”。
    reason: lexical_alternative
  - marker: c
    text: “被拘禁”也可译作“被关住”或“被圈禁”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸ τοῦ ... ἐλθεῖν
  choice: 在……来到以前
  rationale: 带冠词的不定式与 πρό 构成时间表达；此译自然地保留“在……以前”的从句意义。
- source_word: δὲ
  choice: 但
  rationale: δέ 承接上文并带有轻微转折，“但”符合本节论证的推进。
- source_word: τὴν πίστιν
  choice: 信
  rationale: πίστις 在本段最适合译为“信”；冠词及语境又可能指基督来到后开启的信之时代，此层含义留在脚注说明。
- source_word: ὑπὸ νόμον
  choice: 在律法之下
  rationale: 保留保罗常用的空间隐喻，表达处于律法的管辖或权势之下。
- source_word: ἐφρουρούμεθα
  choice: 我们被看守
  rationale: 未完成时被动态表示过去持续的状态；“被看守”既保留守护义，也容许羁押义。
- source_word: συγκλειόμενοι
  choice: 被拘禁
  rationale: 分词表达被围住、关住的限制状态；“被拘禁”简明并保留较强的约束色彩。
- source_word: εἰς
  choice: 直到
  rationale: 在此语境中指向信将被显明的未来时点；“直到”清楚呈现律法之下的拘束延续至该时刻。
- source_word: τὴν μέλλουσαν πίστιν ἀποκαλυφθῆναι
  choice: 直到那将要显明的信来到
  rationale: “将要显明”保留 μέλλουσαν 与被动不定式 ἀποκαλυφθῆναι 的未来及启示意味；补出“来到”使“直到”结构在现代汉语中完整，并与前句形成呼应。
theological_decisions:
- issue: πίστις 是一般的主观信心，还是与基督来临相连的救赎历史现实
  choice: 正文译作“信”，并借“来到”“将要显明”保留其救赎历史维度。
  alternative: 译作“信仰”“那信仰”，或解释为“信的时代”。
  rationale: 本段对照基督来临前后，带冠词的 πίστις 可能不只指个人相信；然而正文若加入“时代”会过度解释，因此维持“信”的开放性。
- issue: 律法的作用是保护还是羁押
  choice: 以“被看守”配合“被拘禁”，同时呈现看护与限制的张力。
  alternative: 将两词统一解释为“蒙保守”，或都强化为“被监禁”。
  rationale: φρουρέω 可有守卫或看押之意，而 συγκλείω 明确强化封闭限制；分别翻译可避免只保留单一神学色彩。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“在律法之下”保留保罗原有隐喻；两个相邻的被动表达刻意保留原文持续受管束的语气。
