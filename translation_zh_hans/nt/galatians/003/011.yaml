source:
  edition: SBLGNT
  text: ὅτι δὲ ἐν νόμῳ οὐδεὶς δικαιοῦται παρὰ τῷ θεῷ δῆλον, ὅτι Ὁ δίκαιος ἐκ πίστεως ζήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/011.yaml
  text: It is evident that no one is justified before God by the law[b][a], because "The righteous will live by faith."
translation:
  language: zh_hans
  text: 显然，没有一个人能靠律法在上帝面前被称为义，因为经上说：“义人必因信[a]而活。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因信”也可译作“因忠信”；整句话也可理解为“因信成为义的人必活”。
    reason: 词义及句法存在可保留的解释空间。
  - marker: b
    text: 保罗在这里引用《哈巴谷书》2:4。
    reason: 交代引文出处。
lexical_decisions:
- source_word: ὅτι δὲ
  choice: 显然……因为
  rationale: δὲ在这里轻微推进论述，不必生硬译出为“但是”；两个ὅτι分别引出所断定的内容和支持该断定的理由，按现代汉语语序自然重组。
- source_word: ἐν νόμῳ
  choice: 靠律法
  rationale: ἐν在此处表达称义的途径或依据；“靠律法”比直译“在律法中”更清楚，也符合本段司法性论述。
- source_word: οὐδεὶς δικαιοῦται
  choice: 没有一个人能……被称为义
  rationale: οὐδεὶς保留全面否定；δικαιοῦται采用司法性表达“被称为义”，避免将其弱化为一般的道德改善。“能”使汉语表达自然，表示这种途径不能使任何人获得该地位。
- source_word: παρὰ τῷ θεῷ
  choice: 在上帝面前
  rationale: 表达人在上帝判断中的地位，保留原文的审判和关系色彩。
- source_word: δῆλον
  choice: 显然
  rationale: 简洁、自然地表达“不言而明、清楚可见”的论证语气。
- source_word: Ὁ δίκαιος
  choice: 义人
  rationale: 自然保留形容词名词化的含义，即“那义者／义人”，并与所引经文的传统措辞相称。
- source_word: ἐκ πίστεως
  choice: 因信
  rationale: ἐκ表示根源、依据或途径；“因信”简洁地保留保罗论述中的关联。πίστις也可能表示“忠信”，故在脚注中保留该词义选择。
- source_word: ζήσεται
  choice: 必……活
  rationale: “必”自然表达将来时在引文中的确定意味；“活”保留其简洁性，不擅自限定为今生、永生或属灵生命。
theological_decisions:
- issue: Ὁ δίκαιος ἐκ πίστεως ζήσεται中ἐκ πίστεως的词义
  choice: 义人必因信而活
  alternative: 义人必因忠信而活
  rationale: 正文采用πίστις在保罗此处最常见且与上下文相符的“信”，但不排除“忠信”这一词义，故列入脚注。
- issue: ἐκ πίστεως在引文中的句法归属
  choice: 将“因信”与“活”相连
  alternative: 因信成为义的人必活
  rationale: 希腊语词序最自然地容许“义人因信而活”，但“因信”也可能修饰“义人”的身份界定。正文不展开改写，避免消除原文的神学张力；相关可能性随词义提示一并说明。
- issue: ζήσεται所指的生命
  choice: 译作“必活”而不加限定
  alternative: 必得生命／必永远活着
  rationale: 原文只用“活”，没有明确添加“永生”等限定，因此保留开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“被称为义”保留司法性含义；引文使用“义人必因信而活”这一简洁句式。脚注标记均置于正文对应位置：[a]紧随“信”，[b]置于整段引文之后。
