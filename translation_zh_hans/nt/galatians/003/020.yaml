  yaml_path: translation/nt/galatians/003/020.yaml
  text: A mediator is not of one[b][a], but God is one.
translation:
  language: zh_hans
  text: 中保不是一方的[a]，但上帝是独一的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译：“中保不是一个的。”原文表达简略，亦可理解为“中保并不是只为一方”或“中保并不代表一方单独行事”。
    reason: alternative_reading
  - marker: b
    text: “上帝是独一的”很可能呼应以色列关于上帝独一的信仰告白；参申命记6:4。
    reason: cross_reference
lexical_decisions:
- source_word: μεσίτης
  choice: 中保
  rationale: “中保”是现代中文圣经语境中准确而庄重的对应词，表达居于双方之间、促成或确立约定的人。
- source_word: ἑνὸς
  choice: 一方
  rationale: 原文直译为“一个的”，表达极其凝练且含义有争议；结合“中保”的关系性语境译作“一方”，作最小限度的明示，同时以脚注保留更直译的形式和其他可能理解。
- source_word: οὐκ ἔστιν
  choice: 不是属于
  rationale: 以“不是属于”对应系词与属格结构，保留原句压缩、略显隐晦的性质，不把它扩展成完整的神学解释。
- source_word: δὲ
  choice: 然而／但
  rationale: 两个 δέ 分别译作“然而”和“但”，使前后推进与对照关系在中文中清楚自然；其功能并非时间性的“现在”。
- source_word: θεὸς εἷς ἐστιν
  choice: 上帝是一位
  rationale: 直接保留原文关于上帝为一的简洁宣告；“一位”在现代中文中既自然，也维持其可能呼应以色列独一神信仰告白的意味。
theological_decisions:
- issue: 首句中保与“一个／一方”的关系
  choice: 译作“中保不是属于一方的”，不进一步说明是哪一方或具体怎样“不属于”。
  alternative: 可更直译为“中保不是一个的”，或解释为“中保并不是只为一方”。
  rationale: 本节论证素来难解。正文仅作关系语境所需的最低限度明示，不将其限定为摩西、基督、律法或某种特定圣约体系，从而保留原文的张力。
- issue: “上帝是一位”的神学回声
  choice: 保留简洁的独一性宣告，并以脚注提示可能的经文呼应。
  alternative: 译作“上帝是独一的”或“只有一位上帝”。
  rationale: “上帝是一位”更贴近 θεὸς εἷς ἐστιν 的形式，也不预先判定这句话在保罗论证中的全部功能。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“中保”保留法律与圣约语境；正文刻意维持原文的凝练和歧义，脚注提供直译及可能理解。所有脚注标记均置于对应正文之后。
