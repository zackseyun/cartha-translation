  text: τοῦτο δὲ λέγω· διαθήκην προκεκυρωμένην ὑπὸ τοῦ ⸀θεοῦ ὁ μετὰ ⸂τετρακόσια καὶ τριάκοντα ἔτη⸃ γεγονὼς νόμος οὐκ ἀκυροῖ, εἰς τὸ καταργῆσαι τὴν ἐπαγγελίαν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/017.yaml
  text: 'This is what I mean: the law[a], which came four hundred and thirty years later, does not invalidate a covenant previously ratified by God[b], so as to abolish the promise.'
translation:
  language: zh_hans
  text: 我的意思是：四百三十年后才有的律法，不能使上帝先前确立的约失效，从而废掉应许[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使……失效”也可译作“废止”；“废掉”也可译作“使……失去效力”或“搁置”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ λέγω
  choice: 我的意思是
  rationale: 以自然的现代汉语引出保罗对前文的解释；δέ的承接作用由句式体现，不额外加入带时间意味的“现在”。
- source_word: διαθήκην
  choice: 约
  rationale: 本段围绕上帝赐给亚伯拉罕的应许展开，“约”最符合其盟约语境，也避免将其限缩为遗嘱。
- source_word: προκεκυρωμένην
  choice: 先前确立的
  rationale: 既表达该约已经获得确认和效力，也保留προ-所含的先在时间关系及完成时分词的既成状态。
- source_word: ὑπὸ τοῦ θεοῦ
  choice: 上帝
  rationale: 在“上帝先前确立的约”这一主动式汉语结构中清楚表达原文的施事者，不添加原文没有的强调。
- source_word: ὁ ... γεγονὼς νόμος
  choice: 才有的律法
  rationale: 按现代汉语自然表达律法后来进入历史的意思；“才”突出它相对于先前之约的后出性。
- source_word: μετὰ τετρακόσια καὶ τριάκοντα ἔτη
  choice: 四百三十年后
  rationale: 准确、简洁地表达两者之间的时间间隔。
- source_word: οὐκ ἀκυροῖ
  choice: 并不能使它失效
  rationale: 体现ἀκυρόω使某项具有约束力的安排失去效力的法律语感；“它”回指前置的“约”，使汉语句法清楚。
- source_word: εἰς τὸ καταργῆσαι
  choice: 从而废掉
  rationale: “从而”可涵盖目的与结果之间的语义关联，不强行判定其中一种；“废掉”表达使之不再生效。
- source_word: τὴν ἐπαγγελίαν
  choice: 应许
  rationale: 延续本章关于上帝向亚伯拉罕所作应许的核心用语。
theological_decisions:
- issue: διαθήκη在保罗论证中的含义
  choice: 约
  alternative: 遗嘱；法律处分
  rationale: 上下文所论的是上帝先前向亚伯拉罕所作的应许及其持久效力，“约”最能保留这段救赎历史论证，同时不加入特定宗派解释。
- issue: εἰς τὸ καταργῆσαι所表达的目的或结果关系
  choice: 从而废掉
  alternative: 以致废掉；为要废掉
  rationale: 原结构可表达目的或结果。“从而”保留两者之间的逻辑联系，而不把歧义单方面定为主观目的。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留原文将“约”前置的论证重点，以“它”明确回指；两个近义动词分别译作“使……失效”和“废掉”，避免抹平原文ἀκυρόω与καταργέω的措辞差别。
