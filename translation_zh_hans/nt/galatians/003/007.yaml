  text: Γινώσκετε ἄρα ὅτι οἱ ἐκ πίστεως, οὗτοι ⸂υἱοί εἰσιν⸃ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/007.yaml
  text: Know, then, that those of faith—these are Abraham’s sons.
translation:
  language: zh_hans
  text: 所以，你们要知道：出于信的人，他们才是亚伯拉罕的子孙。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γινώσκετε
  choice: 你们要知道
  rationale: 该形式既可理解为陈述式“你们知道”，也可理解为命令式“你们要知道”。结合ἄρα引出的推论语气，正文采用自然且有劝告力度的“你们要知道”，同时不额外添加原文没有的内容。
- source_word: ἄρα
  choice: 所以
  rationale: 明确表达由前文所得出的推论。
- source_word: οἱ ἐκ πίστεως
  choice: 出于信的人
  rationale: 较贴近ἐκ πίστεως的来源或归属表达，保留“信”在本段中的神学张力，不扩译为某一特定教派式定义。
- source_word: οὗτοι
  choice: 他们才是
  rationale: 保留原文重复指示代词所形成的强调；用“才是”自然传达‘正是这些人’的排他性焦点。
- source_word: υἱοί ... Ἀβραάμ
  choice: 亚伯拉罕的子孙
  rationale: υἱοί字面为“儿子们”，但此处论及因信而归属亚伯拉罕的群体；“子孙”在现代汉语中自然涵盖群体成员，同时与亚伯拉罕后裔主题相符。
theological_decisions:
- issue: “出于信”与亚伯拉罕子孙身份的关系
  choice: 保留原文直接断言：“出于信的人，他们才是亚伯拉罕的子孙”
  alternative: 扩译为“凭信心称义的人才是真正属灵的亚伯拉罕后裔”
  rationale: 替代译法加入了“称义”“真正属灵”等原文此节未明说的解释，可能过早消解上下文中的神学论证。
- issue: υἱοί的性别与亲属含义
  choice: 译为“子孙”
  alternative: 译为“儿子”
  rationale: “子孙”能自然表达与亚伯拉罕的后裔关系，并避免现代读者误以为断言只限男性；但不将其扩展成某种命名的教义范畴。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“所以，你们要知道”承接上文推论；冒号与“他们才是”保留希腊文οὗτοι的突出强调。
