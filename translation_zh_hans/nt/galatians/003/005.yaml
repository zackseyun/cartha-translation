id: GAL.3.5
reference: Galatians 3:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ οὖν ἐπιχορηγῶν ὑμῖν τὸ πνεῦμα καὶ ἐνεργῶν δυνάμεις ἐν ὑμῖν ἐξ ἔργων νόμου ἢ ἐξ ἀκοῆς πίστεως;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/005.yaml
  text: So then[a], does the one who supplies the Spirit to you and works miracles among you do so by works of the law[b], or by hearing with faith?
translation:
  language: zh_hans
  text: 那么，那位把圣灵赐给你们、又在你们中间[a]施行神迹的，是因律法的行为，还是因你们听见而信呢？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在你们里面”。
    reason: lexical_alternative
  - marker: b
    text: “听见而信”也可译为“信心的听闻”，或“凭信心听见所传的信息”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιχορηγῶν
  choice: 不断……赐给
  rationale: 现在时分词表达持续的供应；“赐给”在现代汉语中自然，并保留供应者慷慨给予的意味。
- source_word: τὸ πνεῦμα
  choice: 圣灵
  rationale: 原文直译为“那灵”；在保罗此处的论述中所指明确，汉语用“圣灵”可避免普通读者误解为人的灵，同时不改变所指。
- source_word: ἐνεργῶν δυνάμεις
  choice: 施行神迹
  rationale: δυνάμεις在此指彰显超自然能力的大能作为；“施行神迹”比直译“运行大能”更符合现代汉语，也切合上下文。
- source_word: ἐν ὑμῖν
  choice: 在你们中间
  rationale: 适合描述加拉太众教会群体中可见的大能作为；“在你们里面”在语法上仍有可能，故列入脚注。
- source_word: ἐξ ἔργων νόμου
  choice: 因为你们遵行律法
  rationale: 以自然汉语表达“出于律法的行为”这一途径或依据，并补出语境中隐含的施行者“你们”，使反问清晰。
- source_word: ἀκοῆς πίστεως
  choice: 因为你们听见而信
  rationale: 表达听见与信心相伴的意思，并与“遵行律法”形成清楚对照；原文属格结构的其他可能关系保留在脚注中。
- source_word: πίστεως
  choice: 信
  rationale: 此处指对所听见之信息的信心或信靠；在“听见而信”这一汉语结构中，用动词“信”最自然。
theological_decisions:
- issue: ἐξ ἔργων νόμου所指的依据或途径
  choice: 因为你们遵行律法
  alternative: 出于律法的行为
  rationale: 所选译法自然呈现保罗关于领受圣灵之途径的对比，但不暗中限定为某一类特定律例，也不加入宗派性解释。
- issue: ἀκοῆς πίστεως这一紧凑属格结构的关系
  choice: 因为你们听见而信
  alternative: 因信心的听闻；因为凭信心听见所传的信息
  rationale: 主文选择最符合上下文反问和现代汉语习惯的理解，同时用脚注保留原文可能表示“与信心有关的听闻”或“以信心领受所听信息”的张力。
- issue: ἐν ὑμῖν描述神迹发生的范围
  choice: 在你们中间
  alternative: 在你们里面
  rationale: 群体性的“在你们中间”较符合语境，但原介词也可表达内在发生，故不将后者排除。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以完整反问句保留原文修辞；“不断”体现两个现在时分词所描写的持续行动。脚注标记均置于其所说明的词句之后。
