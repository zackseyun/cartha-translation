  text: ἵνα εἰς τὰ ἔθνη ἡ εὐλογία τοῦ Ἀβραὰμ γένηται ἐν ⸂Χριστῷ Ἰησοῦ⸃, ἵνα τὴν ἐπαγγελίαν τοῦ πνεύματος λάβωμεν διὰ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/014.yaml
  text: so that the blessing of Abraham might come to the Gentiles in Messiah Jesus[c][b][a], so that we might receive the promise of the Spirit through faith.
translation:
  language: zh_hans
  text: 为的是使亚伯拉罕的福在弥赛亚耶稣里[b]临到外邦人[a]，也为的是使我们借着信领受圣灵的应许[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“列国”。
    reason: lexical_alternative
  - marker: b
    text: 传统译法：“在基督耶稣里”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“领受所应许的圣灵”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα … ἵνα
  choice: 为的是……也为的是
  rationale: 保留原文两个并列的目的从句，同时采用自然、清楚的现代汉语表达。
- source_word: εἰς τὰ ἔθνη
  choice: 临到外族人
  rationale: 在保罗此处的犹太人与非犹太人语境中，ἔθνη主要指犹太人以外的族群；“外族人”比地缘政治意义的“列国”更贴合上下文，同时将“列国”保留在脚注中。
- source_word: ἡ εὐλογία τοῦ Ἀβραὰμ
  choice: 亚伯拉罕的福
  rationale: 简明保留属格结构，指与亚伯拉罕相关的应许之福。
- source_word: γένηται
  choice: 临到
  rationale: γίνομαι在此与εἰς τὰ ἔθνη连用，汉语译为“临到”能自然表达这福归及外族人的意思，又不添加原文没有的施予主体。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: 在弥赛亚耶稣里
  rationale: 保留保罗常用的“在……里”联合性表达，并将Χριστός按仍具称号意义的“弥赛亚”翻译；传统译法收入脚注。
- source_word: τὴν ἐπαγγελίαν τοῦ πνεύματος
  choice: 圣灵的应许
  rationale: 依照希腊文保留属格形式，不在正文中断定是关于圣灵的应许、圣灵所赐的应许，还是所应许的圣灵；语境中很可能的“所应许的圣灵”列入脚注。
- source_word: λάβωμεν
  choice: 使我们……领受
  rationale: 在ἵνα目的从句中以“使我们……领受”自然表达虚拟语气所承载的目的。
- source_word: διὰ τῆς πίστεως
  choice: 借着信
  rationale: 忠实表达διά加属格的途径意义，并以“信”对应πίστις，保持本段论证中的关键词一致。
theological_decisions:
- issue: Χριστῷ在ἐν Χριστῷ Ἰησοῦ中应译作称号还是名称化形式
  choice: 弥赛亚耶稣
  alternative: 基督耶稣
  rationale: 在亚伯拉罕之福与应许的论证中，Χριστός的受膏者称号内涵仍然明显，因此正文译出“弥赛亚”；考虑到“基督耶稣”是历史悠久且广为人知的译法，将其列入脚注。
- issue: τοῦ πνεύματος的属格含义
  choice: 圣灵的应许
  alternative: 所应许的圣灵
  rationale: 正文维持原文的属格张力，不把解释直接写入译文；“所应许的圣灵”在上下文中很有可能，但属于较明确的解释性译法，故置于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“为的是……也为的是”呈现原文重复的目的结构；“在……里”保留保罗神学表达的形式；避免用额外词语消解“圣灵的应许”所含的属格歧义。
