  source_fidelity: 原文的εἰς Χριστόν字面上表达朝向弥赛亚的方向／目标；在本段上下文中也可带有终点性的理解。草稿把它译为“直到弥赛亚”，在汉语中缺少可由“直到”支配的事件或谓语，造成句法悬置，并且较强地固定了时间性解释。改为“引领我们归向弥赛亚”，使παιδαγωγός的照管、引导职能与εἰς的方向性在正文中自然衔接；脚注保留“直到弥赛亚来临”的上下文理解。γέγονεν、ἵνα和被动的δικαιωθῶμεν均得到保留。
