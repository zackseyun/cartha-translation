base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/024.yaml
  text: So then[a], the law has become our guardian until Messiah[b], so that we might be justified by faith.
translation:
  language: zh_hans
  text: 这样看来，律法成了我们的监护人[a]，引领我们归向弥赛亚[b]，为要使我们因信称义。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“看管者”；传统上有时译作“启蒙师”。希腊语παιδαγωγός指负责看管和约束孩童的家内照管者或监护者，并非主要指课堂教师。
    reason: lexical_alternative
  - marker: b
    text: 直译“归向／到弥赛亚”。结合上下文，这句话也可理解为“直到弥赛亚来临”。
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: 这样看来
  rationale: 此处承接上文作推论；“这样看来”自然表达由前文得出的结论，而不误作目的。
- source_word: ὁ νόμος
  choice: 律法
  rationale: 在本段语境中指作为明确范畴的摩西律法；“律法”是准确且通行的译法。
- source_word: παιδαγωγὸς
  choice: 监护人
  rationale: 该词在希腊罗马社会主要指负责看管、约束未成年人的家仆或监护者，并非主要指课堂教师；“监护人”较贴切地传达其社会角色。
- source_word: ἡμῶν
  choice: 我们的
  rationale: 属格代词表示与“监护人”的所属或关系，直译为“我们的”。
- source_word: γέγονεν
  choice: 成了
  rationale: 完成时表示先前形成而在论述时仍具意义的状态；汉语“成了”简洁自然，并保留状态转变之意。
- source_word: εἰς Χριστόν
  choice: 直到弥赛亚
  rationale: 结合上下文，εἰς可表达律法监护作用所指向的目标或终点；正文采用时间—终点性的“直到”，同时以脚注保留方向性理解。
- source_word: Χριστόν
  choice: 弥赛亚
  rationale: 此处保留Χριστός的称号意义，译为“弥赛亚”，而不把它仅作为姓名处理。
- source_word: ἵνα
  choice: 好使
  rationale: 引出目的；“好使”在现代汉语中自然、庄重，并清楚表达目的关系。
- source_word: ἐκ πίστεως
  choice: 因信
  rationale: 该短语在保罗论述中表达称义的凭借或依据；“因信”简洁、惯用，并保留πίστις的核心含义。
- source_word: δικαιωθῶμεν
  choice: 我们称义
  rationale: 被动虚拟式在ἵνα目的从句中表达预期目的；汉语“称义”是法律—宣告性用语，整句“使我们因信称义”也保留被动含义。
theological_decisions:
- issue: 如何理解律法与εἰς Χριστόν所表达的关系
  choice: 译作“直到弥赛亚”，突出律法监护职分以弥赛亚为终点的暂时性。
  alternative: “归向弥赛亚”或“引到弥赛亚那里”
  rationale: 加拉太书3章的上下文强调律法在信来到以前的监护作用；但εἰς本身也可带有朝向目标的含义，因此正文不加入“来到”等原文没有明说的成分，并在脚注保留方向性的理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“监护人”避免把古代παιδαγωγός误解为一般教师；“称义”保留保罗用语的法律—宣告色彩。正文脚注标记均紧随相关词语。
