  to: 这样看来，律法成了我们的监护人[a]，引领我们归向弥赛亚[b]，为要使我们因信称义。
  rationale: 修订解决了“直到弥赛亚”的汉语句法不完整，同时优先反映εἰς Χριστόν的方向／目标意义。由于该短语在加拉太书3章的语境中可合理地理解为律法监护职分的终点，脚注明确保留“直到弥赛亚来临”的读法，而不在正文中把争议解释当作唯一含义。其余关键术语及脚注锚点均保留并对应正文。
