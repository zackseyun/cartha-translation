  text: Χριστὸς ἡμᾶς ἐξηγόρασεν ἐκ τῆς κατάρας τοῦ νόμου γενόμενος ὑπὲρ ἡμῶν κατάρα, ⸂ὅτι γέγραπται⸃· Ἐπικατάρατος πᾶς ὁ κρεμάμενος ἐπὶ ξύλου,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/013.yaml
  text: 'The Messiah redeemed us from the curse of the law by becoming a curse for us[d][c][b][a], because it is written: “Cursed is everyone who hangs on a tree.”'
translation:
  language: zh_hans
  text: 弥赛亚[a]把我们从律法的咒诅中赎了出来，为我们[b]成了咒诅，因为经上记着[c]：“凡挂在木头[d]上的人，都是受咒诅的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。
    reason: lexical_alternative
  - marker: b
    text: “为我们”也可理解为“代表我们”，并可能含有“代替我们”的意思。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“原来经上记着”。
    reason: alternative_reading
  - marker: d
    text: “木头”原文也可指“树”或木制物；这里沿用经文引语的措辞。
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστός
  choice: 弥赛亚
  rationale: 译出其称号含义；本句语境中的称号意味鲜明。“基督”作为常见音译形式收入脚注。
- source_word: ἐξηγόρασεν
  choice: 赎了出来
  rationale: 既保留以代价赎取的商业意象，也自然表达从辖制之下获得释放的含义。
- source_word: ἐκ τῆς κατάρας τοῦ νόμου
  choice: 从律法的咒诅中
  rationale: 保持介词和属格结构的朴素表达，不在译文中额外界定咒诅的具体施行方式。
- source_word: γενόμενος
  choice: 亲自……成了
  rationale: “成了”直接保留分词的强烈表述；加入“亲自”使其与主语的关系在现代汉语中清楚，但不改变事件内容。
- source_word: ὑπὲρ ἡμῶν
  choice: 为我们
  rationale: 保留ὑπέρ可表达的受益、代表及可能的代替意味，不在正文中把它限缩为某一种赎罪模式。
- source_word: κατάρα
  choice: 咒诅
  rationale: 按原文保留名词性断言“成了咒诅”，不弱化为“受了咒诅”或形容词表达。
- source_word: ὅτι γέγραπται
  choice: 因为经上记着
  rationale: 以自然汉语表达引文对前句的论证或解释作用，同时保留“已经写下并仍具效力”的经文惯用语感。
- source_word: Ἐπικατάρατος
  choice: 受咒诅的
  rationale: 符合现代汉语和经文引语风格，也保留该词的强烈判断。
- source_word: κρεμάμενος
  choice: 挂在
  rationale: 采用概括性的关系表达，符合引文的普遍陈述。
- source_word: ξύλου
  choice: 木头
  rationale: ξύλον可指木、树或木制物；“木头”在此自然，并保留申命记引文的传统措辞及其具体意象。
theological_decisions:
- issue: ὑπὲρ ἡμῶν在赎罪表述中的范围
  choice: 为我们
  alternative: 代表我们；代替我们
  rationale: 原文明确表达基督的行动是为了我们，并可能含有代表或代替意味；但介词本身不要求译者在正文中限定为单一的神学模式。
- issue: γενόμενος κατάρα的名词性力度
  choice: 成了咒诅
  alternative: 成了受咒诅的；受了咒诅
  rationale: 原文以无冠词谓语名词“咒诅”作出令人震撼的断言。直译能够保留保罗有意形成的神学张力，而不将其缓和为仅仅承受咒诅。
- issue: ὅτι引出经文的逻辑关系
  choice: 因为经上记着
  alternative: 因为有经文记载；原来经上记着
  rationale: 这里可理解为给前述断言提供经文根据。“因为”保留因果或论证关系；其他表达也可体现解释语气。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“赎了出来”“律法的咒诅”“成了咒诅”保留原文的救赎、盟约及名词性冲击力；不以教派术语扩写。引文使用现代读者易懂、同时带有经文庄重感的句式。
