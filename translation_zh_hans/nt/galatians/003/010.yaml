  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ὅσοι γὰρ ἐξ ἔργων νόμου εἰσὶν ὑπὸ κατάραν εἰσίν, γέγραπται γὰρ ⸀ὅτι Ἐπικατάρατος πᾶς ὃς οὐκ ⸀ἐμμένει πᾶσιν τοῖς γεγραμμένοις ἐν τῷ βιβλίῳ τοῦ νόμου τοῦ ποιῆσαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/010.yaml
  text: For all who are of works of the law are under a curse[a], for it is written, “Cursed is everyone who does not remain in all the things written in the book of the law[b], to do them.”
translation:
  language: zh_hans
  text: 因为凡以律法的行为为本的人，都在咒诅之下[a]；因为经上记着：“凡不持守律法书上所写的一切、以便遵行这些规定的人，都是受咒诅的。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡倚靠律法行为的人”。
    reason: 说明ἐξ ἔργων νόμου也可解释为以律法行为作为倚靠。
  - marker: b
    text: 直译：“凡不持守律法书上所写的一切、以便实行它们的人，都是受咒诅的。”
    reason: 呈现ἐμμένει，以及目的性不定式τοῦ ποιῆσαι αὐτά与其所指对象的较严格形式对应。
lexical_decisions:
- source_word: Ὅσοι γὰρ
  choice: 因为凡……的人
  rationale: 既保留ὅσοι所指的一整类人，也体现γάρ承接上文的解释作用。
- source_word: ἐξ ἔργων νόμου
  choice: 以律法的行为为本
  rationale: 中文若直译为“属于律法行为”十分生硬；“以……为本”保留其立场或根基由律法行为所界定的含义，同时不把它完全收窄为主观的“倚靠”。
- source_word: ὑπὸ κατάραν
  choice: 在咒诅之下
  rationale: 自然地表达处于咒诅的支配或判定之下；希腊文无冠词，不特指某一个已界定的咒诅。
- source_word: γέγραπται
  choice: 经上记着
  rationale: 符合现代中文引用圣经的惯用表达，也保留完成时所含“已经写下且仍然有效”的意味。
- source_word: Ἐπικατάρατος πᾶς ὃς
  choice: 凡……的人，都是受咒诅的
  rationale: 以自然中文传达πᾶς ὃς的普遍范围及Ἐπικατάρατος的宣告语气。
- source_word: ἐμμένει
  choice: 持守
  rationale: 表达持续遵守、坚守的含义，比直译“留在……之中”更合乎现代中文，同时保留持续性。
- source_word: πᾶσιν τοῖς γεγραμμένοις ἐν τῷ βιβλίῳ τοῦ νόμου
  choice: 律法书上所写的一切
  rationale: 准确保留“一切”的完整范围，并用中文惯用的“书上所写”表达原文结构。
- source_word: τοῦ ποιῆσαι αὐτά
  choice: 并遵行
  rationale: 表达律法要求付诸实行的目的或要求；“遵行”在此比机械的“做它们”自然而庄重。
theological_decisions:
- issue: ἐξ ἔργων νόμου的解释
  choice: 以律法的行为为本
  alternative: 倚靠律法的行为
  rationale: “倚靠”明确加入主观信赖的解释；“以……为本”在中文中较自然，又能保留该短语是指人的身份、立场或根基由律法行为界定的张力。
- issue: 引文中持续遵守与实际遵行的双重表达
  choice: 不持守……并遵行
  alternative: 不持续遵行律法书上所写的一切
  rationale: 分别呈现ἐμμένει与τοῦ ποιῆσαι αὐτά，避免把原文的两个表达合并而丢失其强调。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“律法的行为”保留保罗书信中的关键措辞；引文使用略带经文宣告色彩但不古奥的表达。所有脚注标记均置于正文相应位置。
