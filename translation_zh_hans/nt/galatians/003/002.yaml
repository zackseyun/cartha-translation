  text: τοῦτο μόνον θέλω μαθεῖν ἀφ’ ὑμῶν, ἐξ ἔργων νόμου τὸ πνεῦμα ἐλάβετε ἢ ἐξ ἀκοῆς πίστεως;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/002.yaml
  text: 'This only I want to learn from you: did you receive the Spirit by works of the law[b][a], or by hearing with faith?'
translation:
  language: zh_hans
  text: 我只想从你们得知这一件事：你们领受圣灵，是靠行律法，还是靠听信[a][b]呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因着信而听”；这句话也可能指怀着信心听见所传的信息。
    reason: alternative_reading
  - marker: b
    text: 这里的“信”也有人理解为“忠信”，但这种意思的可能性较小；原文的结构十分简略。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο μόνον
  choice: 只……这一件事
  rationale: 保留原文前置所表达的强调，同时采用自然的现代汉语句式。
- source_word: θέλω μαθεῖν ἀφ’ ὑμῶν
  choice: 想从你们这里知道
  rationale: μαθεῖν 本有“得知、弄清”的意思；此处译为“知道”更符合汉语质问语气，也保留 ἀφ’ ὑμῶν 的来源含义。
- source_word: ἐξ ἔργων νόμου
  choice: 靠遵行律法
  rationale: 将压缩的希腊语表达转换为普通读者易懂的现代汉语，并以“靠”体现它与后半句在途径或依据上的对比。
- source_word: τὸ πνεῦμα
  choice: 圣灵
  rationale: 上下文明确指神赐给信徒的灵；汉语通常以“圣灵”清楚指称这一位格，虽原文此处仅有“灵”。
- source_word: ἐλάβετε
  choice: 领受了
  rationale: “领受”准确表达接受神所赐之物，并用“了”体现不定过去时所指向的既成经历。
- source_word: ἐξ ἀκοῆς πίστεως
  choice: 因听见而相信
  rationale: 自然表达听闻与信之间的关系，同时借脚注保留压缩的属格结构可能具有的其他解释。
- source_word: πίστεως
  choice: 相信
  rationale: 此处用动词“相信”符合现代汉语习惯；其基本语义仍是“信”，而较不可能的“忠信”义在脚注中保留。
theological_decisions:
- issue: τὸ πνεῦμα 的所指
  choice: 圣灵
  alternative: 一般性的属灵经历或属灵能力
  rationale: 加拉太书第三章的直接语境谈到信徒领受神的灵，因此指圣灵最为合理；没有把它泛化为某种能力。
- issue: ἐξ ἀκοῆς πίστεως 的关系
  choice: 因听见而相信
  alternative: 因信而听；因听见信仰的信息
  rationale: 原文属格结构简略，可表达带着信而听，也可能涉及所听见的信息；正文采用通顺且符合上下文对比的译法，其他可能性以脚注保留。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“靠遵行律法”避免生硬直译“出于律法的行为”，同时保留保罗所强调的途径对比；问句维持尖锐的反问语气。
