  yaml_path: translation/nt/galatians/003/004.yaml
  text: Did you suffer so many things in vain?—if indeed it really was in vain[a].
translation:
  language: zh_hans
  text: 你们受了这么多苦，难道都是徒然的吗？——若果真是徒然的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοσαῦτα
  choice: 这么多
  rationale: 中性复数概括加拉太人所经历的诸多事情；“这么多”自然保留其数量与广泛所指。
- source_word: ἐπάθετε
  choice: 受了……苦
  rationale: πάσχω既可泛指“经历”，也常指“受苦”；本句很可能指因信仰而遭受的苦难，正文采用“受苦”，脚注保留较宽泛的可能。
- source_word: εἰκῇ
  choice: 徒然
  rationale: 表达无结果、无意义或归于虚空，并在前后两处重复，以保留保罗的修辞力度。
- source_word: εἴ γε
  choice: 如果真的
  rationale: 保留带有强调和保留意味的条件语气，没有把保罗的判断说成既定事实。
- source_word: καὶ
  choice: 也
  rationale: 在重复的“徒然”前保留其附加强调作用，同时使中文仍然顺畅。
theological_decisions:
- issue: 这些经历是否最终徒然
  choice: 以条件句“如果真的也是徒然的”保留悬而未决的语气
  alternative: 断定这些苦难已经徒然
  rationale: εἴ γε引入带保留的修正；保罗提出严厉警告，却没有直接断言他们先前的一切已经毫无意义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“难道”传达反问语气；破折号保留后半句对前问的补充与修正。
