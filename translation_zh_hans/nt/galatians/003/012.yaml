  text: ὁ δὲ νόμος οὐκ ἔστιν ἐκ πίστεως, ἀλλ’· Ὁ ποιήσας ⸀αὐτὰ ζήσεται ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/012.yaml
  text: But the law is not from faith[a]; rather[b], “The one who does them will live by them.”
translation:
  language: zh_hans
  text: 律法却不是出于信；相反，“遵行这些事的人，必靠这些事活着[a]。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在这些事中活着。”
    reason: lexical_alternative
  - marker: b
    text: 引自《利未记》18:5。
    reason: cross_reference
lexical_decisions:
- source_word: νόμος
  choice: 律法
  rationale: 采用保罗书信中自然且庄重的常用译法；上下文表明摩西律法在视野之内，同时不额外添加原文没有的限定语。
- source_word: ἐκ πίστεως
  choice: 出于信
  rationale: 较直接地保留ἐκ所表达的来源或原则，并维持律法与信之间未经解释化处理的对照。
- source_word: ἀλλά
  choice: 相反
  rationale: 清楚体现强烈转折，并自然引出后面的经文引语。
- source_word: ὁ ποιήσας αὐτά
  choice: 遵行这些事的人
  rationale: 以现代汉语表达实词化分词的泛指单数含义；“这些事”保留代词所指的律法规定，不作过度明说。
- source_word: ζήσεται
  choice: 必……活着
  rationale: “必”自然表达将来时在引文中的确定语气，同时避免古雅措辞。
- source_word: ἐν αὐτοῖς
  choice: 靠这些事
  rationale: 此处ἐν可表达凭借或依据；“靠这些事活着”符合上下文中遵行律法而活的含义。较直译的空间性表达保留于脚注。
theological_decisions:
- issue: 律法与信的对照
  choice: 律法“并非出于信”，其引文则以“遵行”来陈述
  alternative: 律法“不以信为原则”或“不以信为基础”
  rationale: 选择贴近原文的表达，保留保罗所提出的神学张力，不把“出于”解释成某种预先确定的神学体系。
- issue: “活着”与遵行律法的关系
  choice: 译作“靠这些事活着”
  alternative: 译作“在这些事中活着”
  rationale: 主文体现ἐν在本引文语境中可能具有的凭借或依据含义，但借脚注保留较形式对应的另一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“律法”“信”“遵行”等词符合经文语域；句式尽量贴近希腊文的对照结构，同时用分号和“相反”使汉语衔接自然。
