id: 1TI.3.16
reference: 1 Timothy 3:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ὁμολογουμένως μέγα ἐστὶν τὸ τῆς εὐσεβείας μυστήριον· ⸀Ὃς ἐφανερώθη ἐν σαρκί, ἐδικαιώθη ἐν πνεύματι, ὤφθη ἀγγέλοις, ἐκηρύχθη ἐν ἔθνεσιν, ἐπιστεύθη ἐν κόσμῳ, ἀνελήμφθη ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/016.yaml
  text: 'And undeniably[a], great is the mystery of godliness:

    He was revealed in flesh,

    was vindicated in spirit,

    was seen by angels,

    was proclaimed among the nations,

    was believed on in the world[d][c][b],

    was taken up in glory.'
translation:
  language: zh_hans
  text: '众所公认，敬虔的奥秘极其伟大：


    他[a]在肉身中被显明，


    在灵里被证明是义的[b]，


    被天使看见，


    在列国中被传扬[c]，


    在世上被人信靠，


    在荣耀中被接上去[d]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“神在肉身中被显明”。这里所依据的希腊文本作“那一位／他”。
    reason: textual_variant
  - marker: b
    text: 也可译作“借着圣灵被证明是义的”或“在圣灵里被证明是义的”。希腊文十分简洁，既可能指圣灵的施行，也可能指属灵生命或领域。
    reason: alternative_reading
  - marker: c
    text: “列国”也可译作“外邦人”。
    reason: lexical_alternative
  - marker: d
    text: 也可译作“被接到荣耀里”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμολογουμένως
  choice: 无可否认
  rationale: 该副词表示公开承认、众所公认之事。“无可否认”是自然的现代汉语，也保留了其确定而郑重的语气。
- source_word: μέγα ἐστὶν
  choice: 是伟大的
  rationale: “伟大”表达 μέγα 在此对奥秘之重大、崇高的强调；汉语采用自然语序，仍以判断句突出这一宣告。
- source_word: τὸ τῆς εὐσεβείας μυστήριον
  choice: 敬虔的奥秘
  rationale: “奥秘”保留保罗书信中 μυστήριον 所指曾隐藏而今显明的神圣真理；“敬虔”对应教牧书信中 εὐσέβεια 所指向神而活的虔敬生命。
- source_word: Ὃς
  choice: 他
  rationale: SBLGNT 采用阳性关系代词“那一位／他”，所指为基督。汉语用“他”自然引出随后诗歌式的六个分句，又不把异文“神”写入正文。
- source_word: ἐφανερώθη ἐν σαρκί
  choice: 在肉身中被显明
  rationale: “被显明”保留动词的被动形式和彰显、公开显露之意；“肉身”指真实的人性与有身体的生存状态，而非比喻性的罪性。
- source_word: ἐδικαιώθη ἐν πνεύματι
  choice: 在灵里被证明是义的
  rationale: 此处 δικαιόω 是被证实、被宣告为正，而不是由不义变为义。“在灵里”保留介词短语的简洁及 πνεῦμα 所指与语法功能上的含混。
- source_word: ὤφθη ἀγγέλοις
  choice: 被天使看见
  rationale: 忠实保留被动结构；在本段基督论颂词的语境中，ἄγγελοι 最自然地指天上的天使。
- source_word: ἐκηρύχθη ἐν ἔθνεσιν
  choice: 在列国中被传扬
  rationale: “传扬”体现 κηρύσσω 的公开宣告含义；“列国”保留 ἔθνη 的广度，同时可包含“外邦人”之义。
- source_word: ἐπιστεύθη ἐν κόσμῳ
  choice: 在世上被人信靠
  rationale: 被动式 ἐπιστεύθη 以基督为信仰和信靠的对象；汉语补出泛指的“人”，使被动表达自然清楚。
- source_word: ἀνελήμφθη ἐν δόξῃ
  choice: 在荣耀中被接升
  rationale: “被接升”表达被接上去的被动动作；“在荣耀中”按 ἐν 的通常含义译出，同时不排除“被接到荣耀里”的理解。
theological_decisions:
- issue: 颂词开头的异文：Ὃς、θεός 或 ὅ
  choice: 正文按 SBLGNT 的 Ὃς 译作“他”
  alternative: 有些抄本作“神在肉身中被显明”；另有中性关系代词异文
  rationale: 原文优先要求正文采用所给批判文本。阳性代词在上下文中指基督，但不应以具有重要传统地位的异文“神”取代正文；该异文在脚注中说明。
- issue: ἐν πνεύματι 中 πνεῦμα 的所指及 ἐν 的功能
  choice: 正文译作“在灵里”
  alternative: “借着圣灵”或“在圣灵里”
  rationale: 无冠词的简短短语可能指圣灵的施行，也可能指属灵的领域或生命状态。正文保留这种神学与语法张力，不以大写或增词武断限定。
- issue: ἐδικαιώθη 用于基督时的含义
  choice: 译作“被证明是义的”
  alternative: “被称义”或“被证实为正”
  rationale: 这里不是说基督从不义变成义，而是说他被公开证实、判明为义；这样的译法避免误引入关于罪人称义的含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语，并以分行形式呈现原文可能具有的颂词或信仰告白节奏。正文尽量保持六个并列被动分句；对于文本异文、圣灵所指和介词含义，不在正文中作超出原文证据的神学限定。
