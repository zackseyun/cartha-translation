  text: μὴ νεόφυτον, ἵνα μὴ τυφωθεὶς εἰς κρίμα ἐμπέσῃ τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/006.yaml
  text: He must not be a recent convert[a], so that he may not become puffed up and fall into the judgment of the devil.
translation:
  language: zh_hans
  text: 不可是初信者，免得他自高自大，落入魔鬼的审判[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“落入魔鬼所受的同样定罪”；也可理解为：“落入与魔鬼有关的审判。”
    reason: 原文“魔鬼的审判”中的属格关系含义不完全确定。
lexical_decisions:
- source_word: νεόφυτον
  choice: 初信的人
  rationale: 原意为“新近栽种的”，在此比喻刚刚归入信仰群体的人。“初信的人”用现代汉语清楚表达这一教会语境，同时避免“新手”过于宽泛。
- source_word: τυφωθεὶς
  choice: 自高自大
  rationale: 该词在此指因骄傲而自负、膨胀。“自高自大”自然庄重，传达其道德警告；被动形式在汉语中无需机械照译。
- source_word: κρίμα
  choice: 审判
  rationale: κρίμα既可指审判，也可偏重定罪。“审判”范围较广，保留原文没有完全确定的含义。
- source_word: τοῦ διαβόλου
  choice: 魔鬼的
  rationale: 属格关系存在歧义，可能指魔鬼所受的审判，也可能指与魔鬼有关或由魔鬼带来的审判。直译为“魔鬼的”可在正文中保留这种张力。
- source_word: ἐμπέσῃ
  choice: 落入
  rationale: 保留原文“陷入、落入某种危险处境”的意象，在现代汉语中也自然。
- source_word: ἵνα μὴ
  choice: 免得
  rationale: 简洁自然地表达原文的目的或所要避免的结果。
theological_decisions:
- issue: εἰς κρίμα ἐμπέσῃ τοῦ διαβόλου的含义
  choice: 正文译作“落入魔鬼的审判”，保留属格歧义
  alternative: “落入魔鬼所受的同样定罪”；或“落入与魔鬼有关的审判”
  rationale: τοῦ διαβόλου既可理解为魔鬼自己所受的审判，也可较宽泛地表示与魔鬼相关的审判。正文不武断选定其中一种解释，脚注列出主要理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不可是初信的人”承接本段监督任职资格的语境；正文尽量简洁，并以脚注说明末句真实存在的语义歧义。
