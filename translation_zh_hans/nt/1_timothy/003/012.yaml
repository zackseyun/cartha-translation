  text: διάκονοι ἔστωσαν μιᾶς γυναικὸς ἄνδρες, τέκνων καλῶς προϊστάμενοι καὶ τῶν ἰδίων οἴκων·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/012.yaml
  text: Deacons must be husbands of one wife[a], managing their children and their own households well.
translation:
  language: zh_hans
  text: 执事必须只作一个妻子的丈夫[a]，妥善带领自己的儿女，管理自己的家。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“只忠于一个女人的男人。”这句话可能着重婚姻上的忠贞；也有人更具体地理解为排除多妻或再婚。
    reason: 保留希腊文短语的真实歧义及主要解释可能。
lexical_decisions:
- source_word: διάκονοι
  choice: 执事
  rationale: 在教会职分资格的语境中，此词指受认可的职分，而非泛指服事者；“执事”是现代中文教会语境中准确、通行的名称。
- source_word: ἔστωσαν
  choice: 必须
  rationale: 现在时命令语气在资格清单中具有规范性；“必须”自然地表达明确要求。
- source_word: μιᾶς γυναικὸς ἄνδρες
  choice: 只作一个妻子的丈夫
  rationale: 尽量贴近希腊文“一位妇人的男人／丈夫”这一紧凑表达，保留其男性限定以及关于婚姻忠贞、一夫一妻或再婚等问题的解释空间；“只作”比生硬的“一个妻子的丈夫”更符合中文，同时不直接将其释为某一种观点。
- source_word: τέκνων
  choice: 儿女
  rationale: 在家庭语境中，“儿女”自然表达其子女；所属关系可由后面的“自己的家”及句法关系明确。
- source_word: καλῶς
  choice: 好好
  rationale: 自然表达“良好地、妥善地”的意思，并同时统摄后面并列的家庭责任。
- source_word: προϊστάμενοι
  choice: 带领……管理
  rationale: 该分词表示站在前面、负责照管或领导。中文按两个并列宾语分别用“带领”和“管理”，既自然，又保留负责任监督的含义。
- source_word: τῶν ἰδίων οἴκων
  choice: 自己的家
  rationale: οἶκος在此指家庭或家户整体，不是房屋建筑；“自己的家”是现代中文最自然的表达，并能涵盖家庭成员与家务秩序。
theological_decisions:
- issue: 教会职分资格中 μιᾶς γυναικὸς ἄνδρες 的解释
  choice: 正文译为“只作一个妻子的丈夫”，不判定该短语仅指婚姻忠贞、一夫一妻，还是排除再婚。
  alternative: 可译作“对妻子忠贞的男人”“只结过一次婚的男人”或较直译的“一个妇人的男人”。
  rationale: 希腊文表达紧凑且带有习语色彩，具体范围存在争议。正文保留形式与神学张力，脚注列出主要理解，避免把某一宗派性结论写进经文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“执事”保留教会职分含义；“好好带领儿女，管理自己的家”避免古旧的“治理”，同时表达实际的家庭领导责任。脚注标记[a]已在正文对应位置出现。
