lexical_decisions:
- source_word: Ταῦτά
  choice: 这些事
  rationale: 保留中性复数指示词的复数含义，指向前文及正在写下的一系列指示。
- source_word: σοι
  choice: 给你
  rationale: 与“写”搭配，按书信语境自然表达领受者。
- source_word: γράφω
  choice: 我把……写给你
  rationale: 以现代汉语自然表达书信中的现在时写作行为，同时保持陈述的庄重和清晰。
- source_word: ἐλπίζων
  choice: 盼望
  rationale: 表达与主要动词同时伴随的期待，但不把尚未实现之事说成确定计划。
- source_word: ἐλθεῖν πρὸς σὲ
  choice: 到你那里去
  rationale: 准确表达朝向收信人的移动；汉语用“到你那里去”比逐字重复“到你”更自然。
- source_word: ἐν τάχει
  choice: 不久就
  rationale: 在此书信语境中优先表达时间上的临近；同时以脚注保留“很快地”这一方式含义的可能性。
