  text: καὶ οὗτοι δὲ δοκιμαζέσθωσαν πρῶτον, εἶτα διακονείτωσαν ἀνέγκλητοι ὄντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/010.yaml
  text: And these also must first be tested[a]; then let them serve[b], being beyond reproach.
translation:
  language: zh_hans
  text: 这些人也应当先受考察；然后，若无可指责[a]，就让他们服事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无可指责”指没有能够成立的指控，并非指完全无罪。
    reason: lexical_alternative
  - marker: b
    text: “服事”也可按本段讨论执事资格的语境理解为“作执事服事”。希腊文在本句使用的是动词“服事”，没有再次使用名词“执事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: 这些人
  rationale: 保留复数指示代词的指称作用；其所指由上下文确定，不在译文中额外加入原文没有的身份名词。
- source_word: καὶ … δὲ
  choice: 也
  rationale: 此处两个连接成分共同表示承接和增补；现代汉语用“也”自然地表达“这些人同样如此”。
- source_word: δοκιμαζέσθωσαν
  choice: 应当受考察
  rationale: 该动词在这里指通过检验来判定是否合格。“受考察”比“受考验”更贴合任职资格审查的语境，同时保留被动语态；“应当”传达第三人称命令语气。
- source_word: πρῶτον
  choice: 先
  rationale: 明确表示考察必须在服事之前进行。
- source_word: εἶτα
  choice: 然后
  rationale: 保留原文所标明的先后次序。
- source_word: διακονείτωσαν
  choice: 让他们服事
  rationale: 直译该动词“服事”，并以“让”表达第三人称命令语气。上下文虽涉及执事资格，但本分句没有再次出现“执事”这一名词，因此正文不把职分含义绝对化。
- source_word: ἀνέγκλητοι ὄντες
  choice: 若无可指责
  rationale: 将分词结构自然地译作服事的条件，表示没有可成立的指控，而非毫无罪过。
theological_decisions:
- issue: διακονείτωσαν应译为一般性的“服事”，还是明确译为“作执事”
  choice: 服事
  alternative: 作执事服事
  rationale: 动词本身意为“服事”，而上下文确实是执事资格。正文保留动词本义，脚注说明其职分语境，既不抹去上下文，也不把名词“执事”直接加入本分句。
- issue: ἀνέγκλητοι是否表示绝对无罪
  choice: 无可指责
  alternative: 无可非议；无可控告
  rationale: 该词表示没有能够成立的指控，尤其适用于资格审查，并不要求一个人达到绝对无罪的状态。
- issue: ἀνέγκλητοι ὄντες与主要动词的关系
  choice: 译作条件：“若无可指责”
  alternative: 保留伴随结构：“在无可指责的情况下服事”
  rationale: 希腊语分词在此可表达伴随状态或隐含条件。汉语采用“若”能自然说明考察合格后才可服事，但不把“无可指责”理解为无罪的绝对状态。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“受考察”符合资格审查语境；分号和“然后”清楚呈现先考察、后服事的次序。脚注标记依其在中文正文中的出现顺序排列。
