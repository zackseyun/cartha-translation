id: 1TI.3.13
reference: 1 Timothy 3:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἱ γὰρ καλῶς διακονήσαντες βαθμὸν ἑαυτοῖς καλὸν περιποιοῦνται καὶ πολλὴν παρρησίαν ἐν πίστει τῇ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/013.yaml
  text: For those who have served well obtain for themselves a good standing and great boldness in the faith that is in Messiah Jesus[a][b][c].
translation:
  language: zh_hans
  text: 因为那些服事得好的人，为自己赢得美好的地位，并在弥赛亚[c]耶稣里的信仰[b]中大有胆量[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“充足的信心”；希腊语词παρρησία可表示胆量、信心或坦然直言。
    reason: lexical_alternative
  - marker: b
    text: 或译：“在弥赛亚耶稣里的忠信中。”希腊语πίστις可表示信仰、信靠或忠信；正文采用“信仰”。
    reason: alternative_reading
  - marker: c
    text: 希腊语作“基督”；这里译作“弥赛亚”，因为该词在此用作称号。
    reason: lexical_alternative
lexical_decisions:
- source_word: διακονήσαντες
  choice: 服事
  rationale: 该动词本身意为服事、服务；上下文虽论及执事，却不宜把职分名称直接加进动词。
- source_word: καλῶς
  choice: 好好
  rationale: 自然地修饰“服事”，表达做得好、尽责之意。
- source_word: βαθμὸν ... καλὸν
  choice: 美好的地位
  rationale: βαθμός可指台阶、层级或地位；此处采用比喻义“地位”，既保留原文表达，又不把它限定为教会中的晋升或品级。
- source_word: περιποιοῦνται
  choice: 为自己赢得
  rationale: 体现中间语态所含的自身受益意味，也符合现代汉语表达。
- source_word: παρρησίαν
  choice: 胆量
  rationale: 该词可表示放胆、信心或坦然；“胆量”保留此处较强的勇敢、无惧意味。
- source_word: πίστει
  choice: 信仰
  rationale: πίστις在此可指信仰、信靠，也可能含忠信之意；正文采用“信仰”，同时以脚注保留另一可能。
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: 在弥赛亚耶稣里的
  rationale: 保留定冠词加介词短语对πίστει的修饰关系，即“在弥赛亚耶稣里的信仰”。
- source_word: Χριστῷ
  choice: 弥赛亚
  rationale: Χριστός在这里具有称号功能；“弥赛亚”直接传达其“受膏者”的称号意义。
theological_decisions:
- issue: ἐν πίστει τῇ ἐν Χριστῷ Ἰησοῦ中πίστις的含义
  choice: 信仰
  alternative: 忠信
  rationale: 此短语较自然地指向以弥赛亚耶稣为归属和中心的信仰，但πίστις仍可能表达忠信；正文不将后一可能无声排除，而以脚注保存。
- issue: βαθμὸν καλὸν是否指教会职级晋升
  choice: 美好的地位
  alternative: 美好的台阶；良好的声望
  rationale: 原文没有明确说明晋升为某一职分，因此采用较宽泛的“地位”，避免加入特定教会制度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“好好服事”自然表达καλῶς διακονήσαντες；“美好的地位”刻意保留βαθμός的宽泛比喻义，不解释成固定职级或属灵奖赏。脚注标记均置于正文相应句末。
