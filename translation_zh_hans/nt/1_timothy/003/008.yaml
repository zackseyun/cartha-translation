  text: Διακόνους ὡσαύτως σεμνούς, μὴ διλόγους, μὴ οἴνῳ πολλῷ προσέχοντας, μὴ αἰσχροκερδεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/008.yaml
  text: Deacons likewise must be dignified[a], not double-tongued, not devoted to much wine, not greedy for shameful gain[c][b],
translation:
  language: zh_hans
  text: 执事也同样必须庄重，不说两面话[a]，不沉湎于多量的酒[b]，不贪图不光彩的利益[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不一口两舌”，即不对不同的人说不同的话。
    reason: lexical_alternative
  - marker: b
    text: 或译：“不沉迷于多饮酒”；直译：“不专注于许多酒”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“不贪图卑劣所得”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Διακόνους
  choice: 执事
  rationale: 本节与前文监督的资格要求平行，所指是在教会中承担特定职分的人；“执事”既符合语境，也不额外引入后世宗派制度的细节。
- source_word: ὡσαύτως
  choice: 也同样
  rationale: 承接前文对监督的要求，同时引出另一类教会职分；“也同样”在现代汉语中自然清楚。
- source_word: σεμνούς
  choice: 庄重
  rationale: 表达品格端正、举止可敬，而不是性情严厉或不苟言笑。
- source_word: μὴ διλόγους
  choice: 不说两面话
  rationale: 保留原文“说两种话”的形象含义，指对不同的人说相互矛盾或不真诚的话；比生硬直译“一口两舌”更符合现代汉语。
- source_word: μὴ οἴνῳ πολλῷ προσέχοντας
  choice: 不贪杯
  rationale: προσέχω在这里表示持续留恋、沉迷或专注于某物，πολλῷ修饰酒；“不贪杯”自然地表达对多饮酒的迷恋，又不引入现代临床意义上的“成瘾”诊断。
- source_word: μὴ αἰσχροκερδεῖς
  choice: 不贪图可耻的利益
  rationale: 该词兼有贪求利益及其方式或所得在道德上卑劣、可耻的含义；此译保留原文强烈的道德评价，同时避免只将其缩窄为金钱。
theological_decisions:
- issue: διάκονος在本节是否为教会职分名称
  choice: 译作“执事”
  alternative: 仆人；服事者
  rationale: 本段先列监督的资格，继而以“也同样”列出另一组人的资格，语境支持将其理解为已获认可的教会职分。此译不进一步规定该职分在后世教制中的权限或等级。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“庄重”保持资格清单的伦理语气；“不说两面话”和“不贪杯”使用普通读者容易理解的表达，并以脚注保留希腊语较直译的措辞。
