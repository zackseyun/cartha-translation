id: 1TI.3.5
reference: 1 Timothy 3:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: (εἰ δέ τις τοῦ ἰδίου οἴκου προστῆναι οὐκ οἶδεν, πῶς ἐκκλησίας θεοῦ ἐπιμελήσεται;)
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/005.yaml
  text: But if someone does not know how to manage his own household[c][b][a], how will he care for God’s church?
translation:
  language: zh_hans
  text: 可是，一个人若不知道怎样管理自己的家[a]，又怎能照料上帝的教会呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “家”在这里指家庭或整个家户，不是房屋建筑。
    reason: lexical_clarification
lexical_decisions:
- source_word: εἰ δέ
  choice: 可是……若
  rationale: 既保留条件关系，也自然表达δέ与上文形成的轻微转折。
- source_word: τις
  choice: 一个人
  rationale: 保留不定单数所指，不把τις本身过度具体化；本节的任职语境由上下文说明。
- source_word: τοῦ ἰδίου οἴκου
  choice: 自己的家
  rationale: 这里的οἶκος指由此人负责的家庭或家户，而非仅指房屋；“自己的家”在现代汉语中自然，并能涵盖这一社会单位。
- source_word: προστῆναι
  choice: 管理
  rationale: 表达承担领导、安排和负责之意，但不采用可能强化专断色彩的“统治”。
- source_word: οὐκ οἶδεν
  choice: 不知道怎样
  rationale: οἶδα接不定式在此表示“不知道怎样做”，不只是缺少相关知识。
- source_word: πῶς
  choice: 又怎能
  rationale: 以自然的汉语反问表达从管理家庭推及照料教会的论证；“又”承接两者之间的推论。
- source_word: ἐκκλησίας θεοῦ
  choice: 上帝的教会
  rationale: 忠实表达属格关系；“教会”是本语境中ἐκκλησία通行且清楚的译法。
- source_word: ἐπιμελήσεται
  choice: 照料
  rationale: 突出用心关顾和照看，与前半句的“管理”相区别，保留原文两个不同动词的语义差异。
theological_decisions:
- issue: 家庭管理与教会照料之间的关系
  choice: 前句译“管理”，后句译“照料”
  alternative: 两句都译作“带领”，或把前句译作“治理”、后句译作“照管”
  rationale: 原文分别使用προΐστημι与ἐπιμελέομαι。采用不同译词可保留家庭责任与对上帝教会之关顾之间的联系和区别，避免把教会职分单纯表述为管辖。
- issue: 不定主语的性别表达
  choice: 译作“一个人”，后句省略汉语中不必出现的代词
  alternative: 明确译作“一个男人……他”，或采用复数化的中性表达
  rationale: τις本身是不定代词，而直接上下文谈论监督的资格。汉语“一个人”忠实保留本句措辞的概括性，又不借不必要的代词增加原句没有明说的性别标记；具体任职语境仍由上下文保留。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。反问句“又怎能……呢”清楚呈现原文论证；“管理”与“照料”刻意区分两个希腊动词，同时避免行政化或专断化的措辞。
