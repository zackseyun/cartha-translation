  text: γυναῖκας ὡσαύτως σεμνάς, μὴ διαβόλους, νηφαλίους, πιστὰς ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/011.yaml
  text: Women likewise must be dignified[a], not slanderers, sober-minded, faithful in all things.
translation:
  language: zh_hans
  text: 妇女[a]也同样要庄重，不毁谤人，清醒自守，在一切事上都忠信。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“妻子也同样要庄重……”希腊语γυναῖκας在这里既可指“妇女”，也可指“妻子”；原文没有明确说“他们的妻子”。
    reason: alternative_reading
lexical_decisions:
- source_word: γυναῖκας
  choice: 妇女
  rationale: γυνή在本语境中既可指“妇女”，也可指“妻子”。原文没有冠词，也没有“她们的”等所属语，因此正文采用较宽泛的“妇女”，并以脚注保留“妻子”的可能。
- source_word: ὡσαύτως
  choice: 也同样
  rationale: 表明这一组要求与上文的资格要求相平行；“也同样”简洁自然，并保留原文的结构联系。
- source_word: σεμνάς
  choice: 庄重
  rationale: 表达品格端庄、可敬、严肃稳重，符合现代汉语的尊严语体，又不显古奥。
- source_word: μὴ διαβόλους
  choice: 不毁谤人
  rationale: 此处διάβολος作描述品格的用语，意为毁谤、恶意指控，并非专名“魔鬼”；译作“不毁谤人”直接清楚。
- source_word: νηφαλίους
  choice: 清醒自守
  rationale: νηφάλιος可含不醉酒、头脑清醒及行为节制之意；“清醒自守”兼顾其字面背景和伦理含义。
- source_word: πιστὰς
  choice: 忠信
  rationale: πιστός在此描述可靠、忠诚的品格；“忠信”既保留忠诚含义，也传达值得信赖。
- source_word: ἐν πᾶσιν
  choice: 在一切事上都
  rationale: 保留原文全面而概括的范围，现代汉语表达自然。
theological_decisions:
- issue: 资格要求中γυναῖκας所指的人
  choice: 妇女
  alternative: 妻子；她们的妻子
  rationale: 保罗可能指参与某种服事的妇女，也可能指男性执事的妻子。γυνή本身容许“妇女”或“妻子”两义，但原文没有明说“她们的”。正文采用较宽泛的“妇女”，脚注注明“妻子”的读法，以保留经文的歧义和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“清醒自守”兼顾νηφάλιος的清醒与克制含义；“忠信”保持品格清单的凝练语体。
