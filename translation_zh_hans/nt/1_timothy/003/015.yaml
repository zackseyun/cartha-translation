revisions:
- from: 但我若耽搁，便是要使你知道，人在神的家中应当怎样行事；这家就是永活神的会众[a]，是真理的柱石和支撑[b]。
  to: 但我若迟延，好叫你知道人在神的家中应当怎样行事；神的家——就是永活的神的会众[a]——是真理的柱石和支撑[b]。
  rationale: 修订仅消除目的从句在汉语中的逻辑歧义，改善同位语结构，并使“永活的神”和脚注b更自然、准确。保留“会众”“柱石”“支撑”及原文对会众作为真理之柱石和支撑的高位述谓，不弱化或扩展其神学含义。
