id: 1TI.3.15
reference: 1 Timothy 3:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐὰν δὲ βραδύνω, ἵνα εἰδῇς πῶς δεῖ ἐν οἴκῳ θεοῦ ἀναστρέφεσθαι, ἥτις ἐστὶν ἐκκλησία θεοῦ ζῶντος, στῦλος καὶ ἑδραίωμα τῆς ἀληθείας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/015.yaml
  text: But if I am delayed[a], I write so that you may know how one ought to conduct oneself in the household of God, which is the assembly of the living God[b], the pillar and support of the truth.
translation:
  language: zh_hans
  text: 但我若迟延，好叫你知道人在神的家中应当怎样行事；神的家——就是永活的神的会众[a]——是真理的柱石和支撑[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“教会”。
    reason: lexical_alternative
  - marker: b
    text: “支撑”也可译作“根基”；整个短语也可译作“真理的柱石和保障”。
    reason: lexical_alternative
lexical_decisions:
- source_word: βραδύνω
  choice: 耽搁
  rationale: 这里是不及早来到、受到延误之意，并非指品格上的迟钝；“耽搁”符合现代汉语，也保留主动形式可能表达的语感。
- source_word: ἵνα εἰδῇς
  choice: 便是要使你知道
  rationale: 明确表达目的从句，同时与前面的条件句自然衔接。
- source_word: δεῖ
  choice: 应当
  rationale: 表达规范性的必要，语气庄重自然，不把措辞强化为绝对命令。
- source_word: ἐν οἴκῳ θεοῦ
  choice: 在神的家中
  rationale: οἶκος既可指房屋，也可指家或家人；下文以会众加以说明，因此“神的家”保留原有比喻及其群体含义。
- source_word: ἀναστρέφεσθαι
  choice: 行事
  rationale: 此词在这里指生活和行为方式；“行事”简洁、庄重，适合教牧语境。
- source_word: ἥτις ἐστίν
  choice: 这家就是
  rationale: 将关系代词所引出的解释性同位关系明示出来，使“神的家”与“永活神的会众”的对应在汉语中清楚自然。
- source_word: ἐκκλησία
  choice: 会众
  rationale: 突出由神召聚的群体，而非建筑物；同时以脚注保留传统译法“教会”。
- source_word: θεοῦ ζῶντος
  choice: 永活神的
  rationale: “永活神”是自然而庄重的汉语表达，保留原文对神是活着之神的强调；“永”在汉语中表达持续存活，并未改变其所指。
- source_word: στῦλος
  choice: 柱石
  rationale: 保留建筑性隐喻；“柱石”在现代汉语中可自然表示承担和维系作用者。
- source_word: ἑδραίωμα
  choice: 支撑
  rationale: 此罕见名词表示使某物稳固的支承；“支撑”保留宽泛含义，不把隐喻过早限定为地基或防御工事。
- source_word: τῆς ἀληθείας
  choice: 真理的
  rationale: 定冠词所指的特定真理在汉语中以“真理”自然表达，无须另加指示词。
theological_decisions:
- issue: ἐκκλησία在教会论语境中的译法
  choice: 会众
  alternative: 教会；会堂；聚会
  rationale: “会众”首先呈现神子民群体的含义，避免读者误解为建筑，同时不否认其教会论意义；传统译法列入脚注。
- issue: “真理的柱石和ἑδραίωμα”的关系与含义
  choice: 将整个短语述说为永活神的会众，并把ἑδραίωμα译为“支撑”
  alternative: 真理的柱石和根基；真理的柱石和堡垒
  rationale: 原文语法对会众作出高度肯定，称其为真理的柱石和使真理稳固的支承。正文不削弱这一宣称，也不进一步断定会众是真理的来源；脚注保留该罕见名词的主要译法。
- issue: πῶς δεῖ ἀναστρέφεσθαι的主语范围
  choice: 人在神的家中应当怎样行事
  alternative: 你在神的家中应当怎样行事；人应当怎样管理神的家
  rationale: 原文以非人称δεῖ配合不定式，没有明说行事者只限于提摩太；“人”保留这一较宽泛的规范性表达，也避免把“行事”解释成专指治理。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“这家就是”使解释性同位关系清晰；分号保留前后两部分的紧密逻辑联系。正文中的[a]、[b]均与脚注准确对应。
