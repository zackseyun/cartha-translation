review_pass:
  verdict: revise
  source_fidelity: 正文准确把握了βραδύνω的到达迟延、δεῖ的规范性必要、οἶκος θεοῦ与ἐκκλησία的解释性同位关系，以及“真理的柱石和支撑”对会众的述谓。惟“便是要使你知道”在汉语中把条件从句本身说成“使你知道”的主体，句法和逻辑均不够贴合原文目的结构；改为“好叫你知道”更直接。将“永活神”调整为“永活的神”，更清楚地表达θεὸς ζῶντος的修饰关系，且不将“永活”误读成专有神名。
  naturalness: 原稿整体庄重易懂，但“但我若耽搁，便是要使你知道”略显生硬，且“这家就是……，是……”的连续判断结构不如破折号标示同位说明自然。修订后以“神的家——就是……会众——”清晰呈现原文关系，语气仍适合书信体。
  terminology: “会众”可作为ἐκκλησία的非传统、群体导向译法，脚注保留“教会”即可。“柱石”和“支撑”恰当保留建筑隐喻及ἑδραίωμα的语义开放性。脚注中将“堡垒”直接作为“支撑”的单项替译不够精确：它较适合整个隐喻性短语中的“保障/壁垒”意象，故改为说明短语的另一种译法。
  issues:
  - severity: medium
    issue: “便是要使你知道”误使条件从句承担目的从句的施事角色。
    rationale: ἵνα εἰδῇς是与前文“写这些事”的隐含目的相连的目的从句；中文以“好叫你知道”可保留其目的功能，而不产生“我的耽搁使你知道”的歧义。
  - severity: low
    issue: “永活神”缺少结构助词，修饰关系略显压缩。
    rationale: “永活的神”更自然、清晰地对应θεοῦ ζῶντος，未增添“永恒”或其他神学含义。
  - severity: low
    issue: 脚注b将“堡垒”列为ἑδραίωμα的直接替译，表达不够严谨。
    rationale: “根基”是该词常见的可能译法；“堡垒/保障”较适合作为“柱石和支撑”整体隐喻的替代表达，宜如此注明。
  revised_text: 但我若迟延，好叫你知道人在神的家中应当怎样行事；神的家——就是永活的神的会众[a]——是真理的柱石和支撑[b]。
