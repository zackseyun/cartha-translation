  text: Πιστὸς ὁ λόγος· εἴ τις ἐπισκοπῆς ὀρέγεται, καλοῦ ἔργου ἐπιθυμεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/001.yaml
  text: 'This saying is trustworthy: if anyone aspires to oversight[b][a], he desires a good work.'
translation:
  language: zh_hans
  text: 这话可信：若有人渴望监督的职分[a]，便是向往一项美好的工作[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“监督的职责”或“监督”；传统译作“主教职”。
    reason: alternative_reading
  - marker: b
    text: 或译“一项崇高的任务”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πιστὸς ὁ λόγος
  choice: 这话可信
  rationale: 这是教牧书信中宣告某句话可靠的惯用表达。“这话可信”简洁自然，也保留了原文的公式性语气。
- source_word: εἴ τις
  choice: 若有人
  rationale: τις是不定代词，本身指“任何人/有人”，不应仅据此译成男性限定语。
- source_word: ἐπισκοπῆς
  choice: 承担监督的职分
  rationale: ἐπισκοπή可指监督、督导，也可指承担这种职责的职分。此译保留其功能性含义，并避免直接套用后世固定的教会等级称谓。
- source_word: ὀρέγεται
  choice: 渴望承担
  rationale: ὀρέγομαι本有伸向、追求之意，这里表示立志寻求承担某项职责；“渴望承担”符合现代汉语表达。
- source_word: καλοῦ ἔργου
  choice: 一件美好的工作
  rationale: 直译为“美好的工作”，突出这是应当实际付出的工作，而不只是身份或地位。
- source_word: ἐπιθυμεῖ
  choice: 所向往的是
  rationale: ἐπιθυμέω表示渴望、向往。这样处理既体现其积极含义，也与前面的ὀρέγεται形成自然的语义呼应。
theological_decisions:
- issue: ἐπισκοπῆς是否采用后世固定的教会职阶术语
  choice: 承担监督的职分
  alternative: 监督；监督者的职分；主教职
  rationale: 原词的范围包括监督的职责及其职分，并不必然等同于后世制度化的“主教职”。正文采用功能性译法，以免带入特定宗派的教制。
- issue: εἴ τις是否译成男性限定语
  choice: 若有人
  alternative: 若有男人
  rationale: 不定代词τις在此本身是泛指。译文不从这个词单独推导性别限制，同时保留后续经文对监督者资格的具体描述所形成的文学与神学张力。
- issue: καλοῦ ἔργου强调地位还是工作
  choice: 一件美好的工作
  alternative: 一项崇高的任务
  rationale: “工作”更直接对应ἔργον，表明所追求的是实际服事，而非单纯的身份、权力或荣誉。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“这话可信”保留原文公式化表达；“监督的职分”避免后世教制术语过度限定；两个动词分别译作“渴望承担”和“向往”，呈现原文近义呼应而不显重复生硬。
