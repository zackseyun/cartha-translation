  text: μὴ πάροινον, μὴ ⸀πλήκτην, ἀλλὰ ἐπιεικῆ, ἄμαχον, ἀφιλάργυρον,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/003.yaml
  text: not given to drunkenness[a], not violent, but gentle, peaceable, free from the love of money[d][c][b],
translation:
  language: zh_hans
  text: 不酗酒[a]，不暴力[b]，却要宽和，不好争斗[c]，不贪爱钱财[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不沉迷于酒”。
    reason: lexical_alternative
  - marker: b
    text: 或译“不动手打人”，更突出身体上的攻击行为。
    reason: lexical_alternative
  - marker: c
    text: 或译“不好争吵”。
    reason: lexical_alternative
  - marker: d
    text: 或译“不爱钱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάροινον
  choice: 不酗酒
  rationale: 该词指惯常沉溺于酒或常与醉酒相伴的人。“不酗酒”在现代汉语中自然简洁，表达一种持续的品格倾向，而非禁止一切饮酒。
- source_word: πλήκτην
  choice: 不暴力
  rationale: 该词本义为“打人的人”，并可指好动武、具有攻击性的人。“不暴力”以现代汉语概括其品格含义，同时由脚注保留“动手打人”的具体色彩。
- source_word: ἐπιεικῆ
  choice: 宽和
  rationale: 该词兼有温和、宽容、通情达理、不苛刻之意。“宽和”简洁而庄重，比单纯的“温柔”更能体现克制与宽厚。
- source_word: ἄμαχον
  choice: 不好争斗
  rationale: 该词否定好斗、好争吵的倾向。“不好争斗”保留原文的否定形式，也同时涵盖争吵与争斗。
- source_word: ἀφιλάργυρον
  choice: 不贪爱钱财
  rationale: 该复合词直接否定对银钱的爱恋。“不贪爱钱财”明确指向内在的爱财倾向，不仅指借不正当手段牟利。
theological_decisions: []
