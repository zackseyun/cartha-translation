base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/004.yaml
  text: managing his own household well[a], having his children in submission with all dignity[c][b];
translation:
  language: zh_hans
  text: 好好管理自己的家[a]，儿女顺服，并且满有庄重[c][b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“好好带领自己的家”，或“好好治理自己的家”。
    reason: lexical_alternative
  - marker: b
    text: 或译“有顺服的儿女”，或“管束好儿女”。
    reason: lexical_alternative
  - marker: c
    text: “满有庄重”可能指儿女顺服时的态度，也可能指他管理整个家庭的方式。
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ ἰδίου οἴκου
  choice: 自己的家
  rationale: οἶκος在这里指其照管之下的家庭或家中成员，而不只是房屋。“自己的家”在现代汉语中自然涵盖家庭生活，也保留ἰδίου所强调的“自己的”。
- source_word: καλῶς
  choice: 好好
  rationale: καλῶς说明管理的方式和质量。“好好”简洁自然，表达妥善、称职之意。
- source_word: προϊστάμενον
  choice: 管理
  rationale: προΐστημι在此指承担带领、照管和治理家庭的责任。“管理”既表达实际权责，又避免“统治”可能带来的过强或生硬语气。
- source_word: τέκνα ἔχοντα
  choice: 使儿女
  rationale: 希腊文直译近于“有儿女处于……之中”，但现代汉语用“使儿女……”更自然，并在上下文中呈现良好家庭管理所产生和维持的秩序。
- source_word: ἐν ὑποταγῇ
  choice: 顺服
  rationale: ὑποταγή表示处于服从、有秩序的关系中。“顺服”保留其权柄关系含义，不把它缩减为外在的“管住”，也不局限为某一次具体的听从。
- source_word: μετὰ πάσης σεμνότητος
  choice: 凡事庄重
  rationale: σεμνότης含庄重、端正、可敬之意；πάσης表示充分或全面。“凡事庄重”简明而有尊严，并尽量不限定这种庄重只属于父亲、儿女或整个家庭秩序。
theological_decisions:
- issue: 家庭管理语言的范围
  choice: 把本句译为监督者候选人对自己家庭负责任的管理，不扩展为关于一切权柄形式的普遍教义。
  alternative: 强化为家长式的“统治”，或弱化为不含权柄的单纯照料。
  rationale: προϊστάμενον和ὑποταγή都表明确有带领、权责与秩序，但本节是在列举监督者资格，并非完整阐述家庭制度。
- issue: “凡事庄重”的所指
  choice: 保留其修饰关系上的开放性，不在正文中指定唯一主体。
  alternative: 明确只指儿女顺服时的态度，或明确只指此人管理家庭的方式。
  rationale: μετὰ πάσης σεμνότητος在句法上可以较近地联系儿女的顺服，也可以概括整项家庭管理。“凡事庄重”尽量保留这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“管理自己的家”符合当代用语，同时保留家庭带领中的实际权责；末句以省略明确主语的表达保留原文的句法歧义。分号承接本段连续列举监督者资格的结构。
