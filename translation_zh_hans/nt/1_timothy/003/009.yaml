  text: ἔχοντας τὸ μυστήριον τῆς πίστεως ἐν καθαρᾷ συνειδήσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/009.yaml
  text: holding the mystery of the faith with a clear conscience[a].
translation:
  language: zh_hans
  text: 要以清洁的良心持守信仰的奥秘[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以纯洁的良心持守信心的奥秘。”
    reason: “清洁”也可译为“纯洁”；“信仰”也可理解为主观的“信心”。
lexical_decisions:
- source_word: ἔχοντας
  choice: 持守
  rationale: 现在时主动分词承接上一节所说的执事，表达持续持有并忠于之意；“持守”比单纯“有”更能体现这种持续性。
- source_word: τὸ μυστήριον
  choice: 奥秘
  rationale: 保留保罗书信中的惯用表达，指上帝曾隐藏而如今启示的真理；不在正文中加上“已经显明”，以免过度解释。
- source_word: τῆς πίστεως
  choice: 信仰的
  rationale: 带冠词的 πίστις 在教会职分语境中很可能指所信的基督信仰及其内容；中文“信仰的奥秘”自然地保留这一客观含义，同时不像“教义”那样过度技术化。
- source_word: ἐν καθαρᾷ συνειδήσει
  choice: 以清洁的良心
  rationale: ἐν 在此可表达伴随状态或方式；“以……良心”符合现代汉语。“清洁”较贴近 καθαρός 的纯净、无玷污之义，并保留其道德色彩。
theological_decisions:
- issue: τῆς πίστεως 是指信仰内容还是主观相信
  choice: 正文采用较可能的客观含义，即基督信仰及其内容
  alternative: 也可理解为人的信心，即“信心的奥秘”
  rationale: 定冠词及教会职分资格的上下文较支持客观意义，但原短语本身允许“信心”的理解，因此以脚注保留该歧义。
- issue: μυστήριον 的含义
  choice: 译为“奥秘”，不增补“已经显明”
  alternative: 译为“已经启示的奥秘”或“隐秘真理”
  rationale: 保罗所说的“奥秘”通常是从前隐藏、如今启示的神圣真理，但本节没有明说启示过程；直译可避免把语境外的信息写入正文。
translation_notes:
  register: 采用现代、庄重且易懂的教会语体。“要”补足希腊语分词在中文中与前文资格要求的衔接；“清洁的良心”和“信仰的奥秘”保留原文的神学用语而不过度阐释。
