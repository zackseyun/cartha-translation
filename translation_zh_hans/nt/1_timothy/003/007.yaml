  terminology: “魔鬼”对应带冠词的διάβολος，符合本段及新约通常用法；脚注保留“毁谤者”的词义可能性，未将有争议的替代解释排除。“网罗”恰当保留παγίς的捕捉性比喻。“耻辱”可涵盖ὀνειδισμός的公开蒙羞，脚注所列“责难”“羞辱”适当地保留语义范围。
