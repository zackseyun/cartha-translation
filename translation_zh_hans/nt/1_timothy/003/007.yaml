source:
  edition: SBLGNT
  text: δεῖ ⸀δὲ καὶ μαρτυρίαν καλὴν ἔχειν ἀπὸ τῶν ἔξωθεν, ἵνα μὴ εἰς ὀνειδισμὸν ἐμπέσῃ καὶ παγίδα τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/007.yaml
  text: And he must also have a good testimony from those outside, so that he may not fall into reproach and the devil’s snare.
translation:
  language: zh_hans
  text: 他还必须获得教会以外之人的好评[a]，免得陷入耻辱[b]和魔鬼的网罗[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“从外面的人那里得到好的见证”；“外面的人”指基督徒群体以外的人。
    reason: 说明原文措辞及语境所指。
  - marker: b
    text: 或译“责难”或“羞辱”。
    reason: 保留ὀνειδισμός在外界责难与公开蒙羞之间的语义幅度。
  - marker: c
    text: 若将διάβολος按其一般词义理解，也可译作“毁谤者的网罗”；这里将它理解为“魔鬼”。
    reason: 保留该词可能的泛指意义，同时说明正文采用的理解。
lexical_decisions:
- source_word: δεῖ δὲ καὶ
  choice: 还必须
  rationale: “必须”保留必要和义务的语气；“还”自然表达本项与前文各项资格相连并有所增添。
- source_word: μαρτυρίαν καλὴν ἔχειν
  choice: 有好名声
  rationale: 原文指得到他人良好的见证或评价；在此语境中，“有好名声”是现代汉语中自然、清楚的表达，同时保留公开评价的含义。
- source_word: ἀπὸ τῶν ἔξωθεν
  choice: 在教会外的人中
  rationale: “外面的人”在此指基督徒群体以外的人。“教会外的人”明确传达语境所指，又不把他们贬称为异类。
- source_word: ἵνα μὴ
  choice: 免得
  rationale: 简洁表达原文否定性的目的或结果关系。
- source_word: εἰς ὀνειδισμὸν ἐμπέσῃ
  choice: 陷入耻辱
  rationale: “陷入”保留ἐμπίπτω的落入意象；“耻辱”涵盖ὀνειδισμός所含的责难、羞辱和公开失去体面的意味。
- source_word: παγίδα
  choice: 网罗
  rationale: “网罗”保留捕捉猎物的比喻，也符合庄重而易懂的圣经汉语表达。
- source_word: τοῦ διαβόλου
  choice: 魔鬼的
  rationale: 结合新约及教牧书信的惯常用法，将διάβολος理解为那位邪恶者；汉语所有格结构直接而自然。
theological_decisions:
- issue: τοῦ διαβόλου所指为何
  choice: 魔鬼的网罗，即将διάβολος理解为魔鬼撒但
  alternative: 毁谤者的网罗；或由毁谤形成的网罗
  rationale: διάβολος本可泛指“毁谤者”，但带冠词的表达及新约惯常用法更支持这里指魔鬼。译文采用这一较可能的理解，同时以脚注保留泛指毁谤者的词义可能性。
- issue: ὀνειδισμός的社会性与结果性
  choice: 耻辱
  alternative: 责难；羞辱
  rationale: 该词既可着重外界的责难，也可着重由此造成的羞耻或失去体面。“耻辱”在本句中能自然地与“陷入”搭配，同时不排除其源于公开责难。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“他还必须”承接前文监督者资格；“在教会外的人中有好名声”比逐字译法更符合现代汉语，同时脚注交代原文“从外面的人那里得到好的见证”。正文保留“陷入……网罗”的意象及两项并列结构。
