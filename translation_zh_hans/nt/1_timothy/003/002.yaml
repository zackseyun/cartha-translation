  text: δεῖ οὖν τὸν ἐπίσκοπον ἀνεπίλημπτον εἶναι, μιᾶς γυναικὸς ἄνδρα, νηφάλιον, σώφρονα, κόσμιον, φιλόξενον, διδακτικόν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/002.yaml
  text: Therefore an overseer must be above reproach[a], the husband of one wife, sober-minded, self-controlled, respectable, hospitable, able to teach,
translation:
  language: zh_hans
  text: 所以，监督必须无可指责，只作一个妻子的丈夫[a]，头脑清醒，自我节制，端庄得体，乐意接待客旅，善于教导。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“忠于妻子的男人”；直译为“一个女人的男人”。这句话可能着重强调婚姻忠贞，而不只是婚姻状况。
    reason: 保留 μιᾶς γυναικὸς ἄνδρα 的惯用语含义及其解释上的开放性。
lexical_decisions:
- source_word: δεῖ
  choice: 必须
  rationale: 表达资格要求中的必要性，而不只是劝勉。
- source_word: οὖν
  choice: 所以
  rationale: 自然地保留本句与上文之间的推论关系。
- source_word: ἐπίσκοπον
  choice: 监督
  rationale: 按职分的基本含义翻译，避免直接套用后期教会制度中的特定头衔。
- source_word: ἀνεπίλημπτον
  choice: 无可指责
  rationale: 指没有可成立的指控，并不暗示绝对无罪或毫无缺点。
- source_word: μιᾶς γυναικὸς ἄνδρα
  choice: 一个妻子的丈夫
  rationale: 贴近希腊文的男性特指表达，保留其究竟侧重婚姻状况还是婚姻忠贞的解释空间。
- source_word: νηφάλιον
  choice: 头脑清醒
  rationale: 体现清醒、节制和警觉的引申义，不把含义局限于不醉酒。
- source_word: σώφρονα
  choice: 自我节制
  rationale: 表达在判断和行为上能约束自己，并与前面的“头脑清醒”有所区分。
- source_word: κόσμιον
  choice: 端庄得体
  rationale: 自然表达举止有秩序、合宜、值得尊重的社会伦理含义。
- source_word: φιλόξενον
  choice: 乐意接待客旅
  rationale: 明示原词所含接待客人和外来者之意，比单说“好客”更清楚。
- source_word: διδακτικόν
  choice: 善于教导
  rationale: 表达具备教导的能力和素质，而不只是愿意教导。
theological_decisions:
- issue: 教会监督资格中 μιᾶς γυναικὸς ἄνδρα 的解释
  choice: 正文译作“一个妻子的丈夫”
  alternative: “忠于妻子的男人”或“只忠于一个女人的男人”
  rationale: 该短语可能强调婚姻忠贞，也可能涉及一夫多妻、再婚或婚姻状况。正文采用较形式对应的译法，脚注列出忠贞层面的理解，不替读者消除经文本身的解释张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。资格列表保持简洁并列；“监督”使用透明的职分称谓；脚注标记已在相关短语后标出。
