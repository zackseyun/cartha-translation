  yaml_path: translation/nt/1_timothy/006/018.yaml
  text: to do good, to be rich in good works, to be generous, ready to share,
translation:
  language: zh_hans
  text: 要行善，在善事上富足，慷慨施予，乐意分享。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθοεργεῖν
  choice: 要行善
  rationale: 不定式承接上文吩咐的内容；“行善”简洁自然，并保留动词的行动意味。
- source_word: πλουτεῖν ἐν ἔργοις καλοῖς
  choice: 在善事上富足
  rationale: 保留“富足”的财富意象，与上下文所说的物质财富形成刻意对照；“在善事上”也表达了介词短语所限定的领域。
- source_word: εὐμεταδότους
  choice: 慷慨施予
  rationale: 该词强调乐于把自己的资源给予别人；“慷慨施予”比单说“慷慨”更明确地传达给予的行动倾向。
- source_word: κοινωνικούς
  choice: 乐意分享
  rationale: 该词在此表示愿意与人分享、使人有分的性情；“乐意分享”自然清楚，也避免“合群”等现代含义造成误解。
- source_word: εὐμεταδότους εἶναι, κοινωνικούς
  choice: 慷慨施予，乐意分享
  rationale: 两个形容词意义相近却并非完全重复：前者侧重慷慨给予，后者侧重愿意与人分享。译文分别保留两层意思，并维持原文并列的节奏。
