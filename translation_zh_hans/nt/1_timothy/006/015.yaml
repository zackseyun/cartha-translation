  text: ἣν καιροῖς ἰδίοις δείξει ὁ μακάριος καὶ μόνος δυνάστης, ὁ βασιλεὺς τῶν βασιλευόντων καὶ κύριος τῶν κυριευόντων,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/015.yaml
  text: which he will display in his own times—the blessed and only Sovereign[a], the King of those who reign and Lord of those who rule[b],
translation:
  language: zh_hans
  text: 到了他所定的时候[a]，那位有福、独一的掌权者，就是作王之人的王、掌权之人的主[b]，必显明这显现。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在他自己的各个时机”；指由他掌握并指定的时机。
    reason: lexical_alternative
  - marker: b
    text: 传统译法是“万王之王，万主之主”。希腊文这里使用分词，直译为“作王之人的王、掌权之人的主”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἣν
  choice: 这显现
  rationale: 阴性单数关系代词回指14节的ἐπιφάνειαν（“显现”）。汉语补出所指，比直译为“这事”更清楚，也不误作人物宾语。
- source_word: καιροῖς ἰδίοις
  choice: 到了他所定的时候
  rationale: καιρός指合宜或指定的时机；ἰδίοις表示这些时机属于主语、由他掌握。汉语用集合性的“时候”自然表达希腊语复数，并以“所定”传达指定时机的含义。
- source_word: δείξει
  choice: 必使……显现出来
  rationale: δείκνυμι在此指使某事公开可见。“使……显现出来”既保留其使役和可见性，也与前文的“显现”自然衔接。
- source_word: ὁ μακάριος
  choice: 那位可称颂
  rationale: μακάριος在这里名词化，用作神圣称号。“可称颂”比现代汉语的“快乐”庄重，也避免把重点缩减为主观情绪。
- source_word: μόνος δυνάστης
  choice: 独一的掌权者
  rationale: δυνάστης指拥有统治权柄者；“掌权者”清楚、庄重，μόνος则译为“独一的”，保留排他性的强调。
- source_word: βασιλεὺς τῶν βασιλευόντων
  choice: 作王之人的王
  rationale: βασιλευόντων是分词，直指“正在作王的人”，而不是名词“诸王”。此译保留希腊文的动词意味。
- source_word: κύριος τῶν κυριευόντων
  choice: 掌权之人的主
  rationale: κύριος译作“主”；κυριευόντων是“掌权、施行统治”的分词。“掌权之人”保留其动词意味，同时符合现代汉语表达。
theological_decisions:
- issue: 使这显现出来的主语是谁
  choice: 不在正文中补出专名，只按希腊文以一连串尊称指明主语。
  alternative: 根据上下文明确译作父神使耶稣基督显现。
  rationale: 本节没有直接写出专名，而以“可称颂、独一的掌权者”等称号介绍主语。译文保留这种表达方式，不替经文提前解决其在上下文中的具体指称。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句首先交代时机，句末安置主要动词，使较长的尊称结构易于理解；“就是”说明后两个称号与“独一的掌权者”同位。
