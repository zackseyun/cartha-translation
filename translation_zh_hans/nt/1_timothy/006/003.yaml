  text: εἴ τις ἑτεροδιδασκαλεῖ καὶ μὴ προσέρχεται ὑγιαίνουσι λόγοις, τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, καὶ τῇ κατ’ εὐσέβειαν διδασκαλίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/003.yaml
  text: If anyone teaches a different doctrine and does not agree with sound words[a], those of our Lord Jesus the Messiah, and with the teaching that accords with godliness[b],
translation:
  language: zh_hans
  text: 如果有人传授不同的教义，不接受健全的话语，也就是我们的主耶稣基督[a]的话语，也不接受合乎敬虔的教导，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基督”是称号，意为“受膏者”；相应的希伯来语称号是“弥赛亚”。
    reason: 说明Χριστός的称号含义，并保留另一种常见表达。
lexical_decisions:
- source_word: ἑτεροδιδασκαλεῖ
  choice: 传授不同的教义
  rationale: 保留“教导与既有教训不同”的含义，不把原文未明说的评价强化为“异端”或“错误教义”。
- source_word: προσέρχεται
  choice: 接受
  rationale: 该词本义为“走近”，在这里指接受、归附或认同某种话语和教导；“接受”在现代汉语中自然，也能同时支配后面的两个与格宾语。
- source_word: ὑγιαίνουσι λόγοις
  choice: 健全的话
  rationale: “健全”保留ὑγιαίνω所含的健康隐喻，“话”则贴近λόγοις，没有将其直接释义为“教义”。
- source_word: τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: 也就是我们主耶稣基督的话
  rationale: 此同位语说明前面的“健全的话”；汉语补出“话”使所指清楚，同时保留属格可能表示出自主或属于主的话。
- source_word: κατ’ εὐσέβειαν
  choice: 合乎敬虔的
  rationale: κατά在这里表达相符、相称的关系；“合乎”不额外断定教导与敬虔之间是单向的因果关系。
- source_word: διδασκαλίᾳ
  choice: 教导
  rationale: 可兼指教导的行为及其内容；“教导”比“教义”涵盖面更广，也符合现代汉语。
- source_word: εὐσέβειαν
  choice: 敬虔
  rationale: 指向对神的敬畏、委身及由此表现出的生活；“敬虔”是教牧书信语境中简洁而庄重的表达。
- source_word: Χριστοῦ
  choice: 基督
  rationale: “基督”是现代中文圣经和基督教语境中通行的称号，脚注说明其称号意义及与“弥赛亚”的对应。
theological_decisions:
- issue: “我们主耶稣基督的话”与“健全的话”的句法关系
  choice: 以“也就是”表达同位说明
  alternative: 将其理解为与“健全的话”并列的另一项
  rationale: 重复的定冠词最自然地将τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ理解为对ὑγιαίνουσι λόγοις的进一步限定；译文明确这一主导句法，同时没有限定这些话究竟是主亲口所说，还是更广义上源自主、属于主的话。
- issue: κατ’ εὐσέβειαν所表达的关系
  choice: 合乎敬虔
  alternative: 引向敬虔
  rationale: 原文明确表达教导与敬虔相称，却未明确规定因果方向，因此避免译成只表示结果的“使人敬虔”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留本节与下文相连的条件从句形式及句末逗号；避免使用带有额外定罪色彩的“异端”等词。
