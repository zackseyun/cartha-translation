id: 1TI.6.17
reference: 1 Timothy 6:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Τοῖς πλουσίοις ἐν τῷ νῦν αἰῶνι παράγγελλε μὴ ὑψηλοφρονεῖν μηδὲ ἠλπικέναι ἐπὶ πλούτου ἀδηλότητι, ἀλλ’ ⸀ἐπὶ ⸀θεῷ τῷ παρέχοντι ἡμῖν πάντα πλουσίως εἰς ἀπόλαυσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/017.yaml
  text: Command those who are rich in the present age not to be arrogant[a], nor to set their hope on the uncertainty of riches, but on God[b], who richly provides us with everything for enjoyment.
translation:
  language: zh_hans
  text: 要嘱咐今世[a]富足的人，不可自高，也不要把希望寄托在无定的钱财上[b]，而要寄托在上帝身上；他丰富地把万物供给我们享用。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“现今的时代”。原文词语可指“时代”，也可延伸指现今的世界秩序。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“不可靠的财富”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς πλουσίοις
  choice: 富足的人
  rationale: 带冠词的与格复数形容词作名词用，指拥有财富的人；此译自然，也避免把他们固化为一个带贬义的标签。
- source_word: ἐν τῷ νῦν αἰῶνι
  choice: 今世
  rationale: αἰών在这里主要指现今的时代或世代秩序；“今世”简洁保留了保罗话语中的时间与末世性对比。
- source_word: παράγγελλε
  choice: 要嘱咐
  rationale: 该命令式具有权威性的吩咐意味。“要嘱咐”符合教牧语境，力度强于一般的“劝告”，同时比现代汉语中的“命令”更自然。
- source_word: μὴ ὑψηλοφρονεῖν
  choice: 不可自高
  rationale: 该动词表示自视甚高、骄傲；“不可自高”准确、凝练且庄重。
- source_word: μηδὲ ἠλπικέναι
  choice: 也不要把希望寄托
  rationale: 完成时不定式可表达已经形成或稳定维持的倚靠；“把希望寄托”清楚呈现其对象关系。
- source_word: ἐπὶ πλούτου ἀδηλότητι
  choice: 在无定的钱财上
  rationale: ἀδηλότης表示不确定、不可靠；此结构把钱财刻画为无定而不可倚靠，也保留原文略为凝缩的表达。
- source_word: ἀλλ’ ἐπὶ θεῷ
  choice: 而要寄托在上帝身上
  rationale: 重复的ἐπί与前句形成鲜明平行，指出希望真正应当倚靠的对象；补出“寄托”使汉语完整。
- source_word: τῷ παρέχοντι ἡμῖν
  choice: 他……供给我们
  rationale: 分词短语描述上帝持续供应的行动；“供给”准确表达提供、供应之意。
- source_word: πάντα
  choice: 万物
  rationale: 保留πάντα的广泛范围，不擅自缩限为生活必需品；“万物”在此庄重而自然。
- source_word: πλουσίως
  choice: 丰丰富富地
  rationale: 既表达充裕、慷慨，又呼应本节关于富足与钱财的词汇主题。
- source_word: εἰς ἀπόλαυσιν
  choice: 享用
  rationale: 该短语说明上帝供应万物是供人享受、使用；“供给我们享用”在现代汉语中简洁顺畅。
theological_decisions:
- issue: αἰών在伦理与末世语境中的含义
  choice: 今世
  alternative: 现今的世界
  rationale: “今世”保留时间性的时代对比，不把重点缩减为物质世界或空间意义上的世界。
- issue: πάντα所指的范围
  choice: 万物
  alternative: 一切所需之物
  rationale: 原文没有把范围明说为仅限必需品，因此译文保留其宽广表述，同时不额外引入财富必然增长之类的主张。
- issue: 财富与享用之间的张力
  choice: 既禁止倚靠钱财，又保留上帝供应万物供人享用的陈述
  alternative: 把“享用”弱化为仅供维生
  rationale: 原文并非谴责一切享用，而是反对骄傲和把希望寄托在无定的钱财上；译文不消解这两方面并存的张力。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“今世”“不可自高”保持经文语体的凝练；“把希望寄托在……身上”和“供给我们享用”则确保现代读者容易理解。
