  text: διαπαρατριβαὶ διεφθαρμένων ἀνθρώπων τὸν νοῦν καὶ ἀπεστερημένων τῆς ἀληθείας, νομιζόντων πορισμὸν εἶναι τὴν ⸀εὐσέβειαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/005.yaml
  text: constant friction among people whose minds are corrupted and who have been deprived of the truth[b][a], imagining that godliness is a means of gain.
translation:
  language: zh_hans
  text: 以及心思败坏、被剥夺了真理的人之间不断的争执[a]；他们以为敬虔是得利的途径[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不断的争吵”或“持续的纷争”。希腊语原词带有一再彼此摩擦的意象。
    reason: lexical_alternative
  - marker: b
    text: 或译“以为敬虔就是收益”或“以为敬虔是获利的途径”。意思是他们把对上帝的敬虔当作谋取物质利益的工具。
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπαρατριβαὶ
  choice: 无休止的争执
  rationale: 该复数名词描绘持续彼此摩擦，转指不断发生的争论和冲突。“无休止的争执”在现代汉语中自然清楚，并保留其持续性；脚注补充原词的摩擦意象。
- source_word: διεφθαρμένων … τὸν νοῦν
  choice: 心思已经败坏
  rationale: 完成时被动分词表示败坏所造成的持续状态；“心思”涵盖 νοῦς 的思想、理解和判断层面，“已经败坏”保留明确的负面判断而不额外强化为特定教义术语。
- source_word: ἀπεστερημένων τῆς ἀληθείας
  choice: 真理也被夺去
  rationale: 完成时被动分词表达被剥夺后所处的状态。“被夺去”保留原文的被动语态，同时不擅自说明施事者；“真理”按定冠词所指的特定真理来理解。
- source_word: νομιζόντων
  choice: 以为
  rationale: “以为”自然地表达他们所持的错误看法，并由上下文显出其判断有误。
- source_word: πορισμὸν
  choice: 牟利的门路
  rationale: πορισμός 可指收益，也可指取得收益的途径；在该表语结构中，“牟利的门路”清楚表达把敬虔当作谋取利益的工具。
- source_word: εὐσέβειαν
  choice: 敬虔
  rationale: 在教牧书信中，该词通常指向着上帝的敬畏与相称的生活。“敬虔”保留词语本身的正面含义，把问题准确落在这些人利用敬虔牟利的态度上。
theological_decisions:
- issue: εὐσέβεια 是指真实的敬虔，还是仅指外在宗教形式
  choice: 译为“敬虔”，保留该词本身的正面含义；上下文说明错误在于把敬虔当作牟利工具。
  alternative: 宗教；虔诚；宗教活动
  rationale: 原词不必然含有虚假或纯外在之意。译文不应把滥用敬虔与敬虔本身混为一谈。
- issue: διεφθαρμένων 的道德判断应表达多强
  choice: 译为“心思已经败坏”。
  alternative: 心术邪恶；思想堕落；理智毁坏
  rationale: “败坏”足以保留原文严厉的道德与认知判断，又不引入比原词更强或带有特定体系色彩的措辞。
- issue: ἀπεστερημένων 的被动施事者是否应明确
  choice: 保留“被夺去”的被动表达，不说明是谁夺去真理。
  alternative: 他们丢弃了真理；上帝夺去了他们的真理
  rationale: 希腊文使用被动式却未明说施事者；明确归因会消除原文保留的开放性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“无休止的争执”避免生硬直译，同时由脚注保存希腊词的摩擦意象；“敬虔”和“牟利的门路”兼顾教牧书信的核心用语与普通读者的可理解性。句首“以及”反映本节在上下文中承接前文列举的句法性质。
