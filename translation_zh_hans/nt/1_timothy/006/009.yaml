id: 1TI.6.9
reference: 1 Timothy 6:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἱ δὲ βουλόμενοι πλουτεῖν ἐμπίπτουσιν εἰς πειρασμὸν καὶ παγίδα καὶ ἐπιθυμίας πολλὰς ἀνοήτους καὶ βλαβεράς, αἵτινες βυθίζουσι τοὺς ἀνθρώπους εἰς ὄλεθρον καὶ ἀπώλειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/009.yaml
  text: But those who want to be rich fall into temptation[a], a snare, and many foolish and harmful desires[c][b], which plunge people into ruin and destruction.
translation:
  language: zh_hans
  text: 但那些想要发财的人，会陷入诱惑、网罗，以及许多愚昧而有害的欲望；这些欲望把人沉入毁灭和败亡之中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ βουλόμενοι πλουτεῖν
  choice: 但那些想要发财的人
  rationale: βουλόμενοι 表示意愿或趋向，πλουτεῖν 可指富有或变得富有；“想要发财”自然表达追求财富的意图，并不把警告泛化为已经富有的人。
- source_word: ἐμπίπτουσιν εἰς πειρασμὸν
  choice: 会陷入诱惑
  rationale: ἐμπίπτω 带有落入不利境地的比喻色彩；在本段伦理警告中，πειρασμός 指引人犯罪的诱惑，而非中性的考验。
- source_word: παγίδα
  choice: 网罗
  rationale: 保留捕捉猎物的形象及道德危险的含义；“陷阱”也是可行译法，但“网罗”更能与“陷入”形成生动而庄重的表达。
- source_word: ἐπιθυμίας πολλὰς ἀνοήτους καὶ βλαβεράς
  choice: 许多愚昧而有害的欲望
  rationale: ἐπιθυμίαι 在此指强烈欲望；ἀνοήτους 与 βλαβεράς 分别表达缺乏明智和造成伤害，译文完整保留两个修饰语。
- source_word: αἵτινες
  choice: 这些欲望
  rationale: 明确回指最近的复数先行词“欲望”，避免中文关系结构产生所指含混。
- source_word: βυθίζουσι τοὺς ἀνθρώπους
  choice: 把人沉入
  rationale: βυθίζω 表示使下沉、淹没，采用“沉入”保留原文强烈的下沉意象；ἄνθρωποι 为泛指，译作“人”而非特指男性。
- source_word: ὄλεθρον καὶ ἀπώλειαν
  choice: 毁灭和败亡
  rationale: 以两个近义而不完全相同的词保留原文并列强化；“败亡”表达彻底毁坏，却不擅自限定为永恒定罪。
theological_decisions:
- issue: ὄλεθρον καὶ ἀπώλειαν 是否应明确译成永恒沉沦
  choice: 译为“毁灭和败亡”，不在译文中限定后果的时间或终末性质
  alternative: 译为“毁灭和永远沉沦”
  rationale: 原文严厉强调追逐财富所导致的毁坏性后果，但本节词语本身并未明确加入“永远”等限定；保留宽广而严肃的措辞，可避免把特定教义解释写入正文。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“发财”准确传达变得富有或追求财富的动态意味；分号使后半句清楚说明这些欲望的作用。
