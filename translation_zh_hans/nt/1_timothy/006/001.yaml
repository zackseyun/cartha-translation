  text: Ὅσοι εἰσὶν ὑπὸ ζυγὸν δοῦλοι, τοὺς ἰδίους δεσπότας πάσης τιμῆς ἀξίους ἡγείσθωσαν, ἵνα μὴ τὸ ὄνομα τοῦ θεοῦ καὶ ἡ διδασκαλία βλασφημῆται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/001.yaml
  text: All who are slaves under a yoke should regard their own masters as worthy of all honor[c][b][a], so that the name of God and the teaching may not be slandered.
translation:
  language: zh_hans
  text: 凡在轭下作奴隶的，都应当认为自己的主人配受一切尊重[a]，免得上帝的名和教导[b]遭人毁谤[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴隶”或译“奴仆”；希腊文δοῦλοι。这里因有“在轭下”一语，奴役状态十分明确。
    reason: alternative_reading
  - marker: b
    text: “教导”或译“教义”。
    reason: lexical_alternative
  - marker: c
    text: “毁谤”或译“亵渎”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅσοι εἰσὶν ὑπὸ ζυγὸν δοῦλοι
  choice: 凡负轭作奴隶的
  rationale: 保留“轭”的受辖制隐喻；在这一搭配中，δοῦλοι明确指处于奴役身份的人，因此译作“奴隶”而非较含混的“仆人”。
- source_word: τοὺς ἰδίους δεσπότας
  choice: 自己的主人
  rationale: “自己的”体现ἰδίους所指各人所属的特定主人；“主人”自然表达δεσπότας在奴隶制家庭关系中的权威身份。
- source_word: πάσης τιμῆς ἀξίους ἡγείσθωσαν
  choice: 都要认为……配受充分的尊重
  rationale: ἡγείσθωσαν是命令语气，译作“都要认为”；“充分的尊重”自然传达πάσης τιμῆς的全面程度，又避免把“尊重”误解为各种具体礼仪。
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: 上帝的名
  rationale: 保留原文的圣经表达，兼有上帝的身份与声誉之意。
- source_word: ἡ διδασκαλία
  choice: 这教导
  rationale: διδασκαλία可指教导或教义；此处用通俗自然的“教导”，定冠词结合语境译为“这”，指信仰所传的教导。
- source_word: βλασφημῆται
  choice: 遭人毁谤
  rationale: 该动词同时支配“上帝的名”和“这教导”，这里指被恶意辱骂、诋毁；“毁谤”可自然适用于两个并列对象，并保留较强烈的负面含义。
theological_decisions:
- issue: 如何翻译带有社会与道德敏感性的δοῦλοι
  choice: 奴隶
  alternative: 仆人；奴仆
  rationale: “负轭”使受奴役的法律社会身份十分突出，故直译“奴隶”。这是描述经文所面对的社会现实，并不表示认可奴隶制度。
- issue: 如何翻译διδασκαλία
  choice: 这教导
  alternative: 这教义
  rationale: “教导”准确且易懂，不额外赋予后世较技术化的教义体系含义，同时仍可指基督信仰的信息。
- issue: 如何翻译βλασφημῆται
  choice: 遭人毁谤
  alternative: 遭人亵渎
  rationale: 由于动词同时用于“上帝的名”和“这教导”，“毁谤”在现代汉语中对两者都适用；“亵渎”尤其适用于上帝，却不如前者自然地修饰“教导”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“负轭”保留原文鲜明隐喻；“作奴隶”明确历史社会身份。“充分的尊重”比生硬的“所有的尊荣”更自然。脚注标记均置于正文相关词语之后。
