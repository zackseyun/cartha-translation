source:
  edition: SBLGNT
  text: ἀποθησαυρίζοντας ἑαυτοῖς θεμέλιον καλὸν εἰς τὸ μέλλον, ἵνα ἐπιλάβωνται τῆς ⸀ὄντως ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/019.yaml
  text: storing up for themselves a good foundation for the future[a], so that they may take hold of the life that is truly life.
translation:
  language: zh_hans
  text: 为将来给自己积存美好的根基[a]，好使他们能抓住那真正的生命。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “将来”也可译作“将要发生的事”；这里可能含有来世的意味，但原文没有明说“世代”。
    reason: lexical_alternative
  - marker: b
    text: 有些抄本作“永恒的生命”。
    reason: textual_variant
lexical_decisions:
- source_word: ἀποθησαυρίζοντας
  choice: 积存
  rationale: 保留“储蓄、积聚财宝”的意象，并以现代汉语自然承接上文的劝勉。
- source_word: ἑαυτοῖς
  choice: 为自己
  rationale: 表达反身代词的受益含义，即所积存的最终使他们自己受益。
- source_word: θεμέλιον καλὸν
  choice: 美好的根基
  rationale: 保留原文由“积存”转到“根基”的混合意象；“美好的”兼顾 καλός 所含良善、可贵、稳妥的意味。
- source_word: εἰς τὸ μέλλον
  choice: 预备将来
  rationale: 表达面向未来、为将来作准备的方向性，同时不擅自把原文明确化为“来世”或“将来的世代”。
- source_word: ἐπιλάβωνται
  choice: 抓住
  rationale: 保留动词“紧紧拿住、抓住”的鲜明动作感，而不弱化为单纯“获得”。
- source_word: τῆς ὄντως ζωῆς
  choice: 那真正的生命
  rationale: 明确保留 ζωή“生命”这一名词，并以“真正的”表达 ὄντως 的强调，呈现表面富足与真实生命之间的对照。
theological_decisions:
- issue: εἰς τὸ μέλλον 是否应明确译为末世性的“来世”
  choice: 预备将来
  alternative: 为来世预备
  rationale: 上下文具有末世指向，但原文只说“将来／将要发生的”，没有明说“世代”；因此正文保留较宽的前瞻含义。
- issue: τῆς ὄντως ζωῆς 如何表达真实生命的强调
  choice: 那真正的生命
  alternative: 那才是真正的生命
  rationale: 所选译法保留定冠词、名词“生命”及 ὄντως 的强调，又不额外断定这种生命与现世生命之间的具体神学关系。
- issue: 抄本中 ὄντως 与 αἰωνίου 的差异
  choice: 正文采用 SBLGNT 的 ὄντως，译作“真正的”
  alternative: 永恒的生命
  rationale: 遵循指定底本，同时用脚注呈现具有神学意义的抄本异文，不把“真正的”与“永恒的”静默合并。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“积存……根基”保留原文略显交错的财宝与建筑意象；“抓住”保持劝勉语气的力度。
