source:
  edition: SBLGNT
  text: ὁ μόνος ἔχων ἀθανασίαν, φῶς οἰκῶν ἀπρόσιτον, ὃν εἶδεν οὐδεὶς ἀνθρώπων οὐδὲ ἰδεῖν δύναται· ᾧ τιμὴ καὶ κράτος αἰώνιον· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/016.yaml
  text: who alone has immortality[a], dwelling in unapproachable light, whom no one among men has seen nor is able to see. To him be honor and eternal dominion[b]. Amen.
translation:
  language: zh_hans
  text: 唯独他拥有不死性，居住在不可接近的光中；没有人曾见过他，也没有人能看见他。愿尊荣和永恒的权能归给他[a]。阿们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按上下文，本节最自然是继续描述上帝，并把颂赞归给他；也有人认为这些描述和颂赞更直接指向主耶稣基督。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ μόνος ἔχων ἀθανασίαν
  choice: 唯有他是不死不灭的
  rationale: 以自然庄重的现代汉语表达独一性及内在具有不死性的意思，避免生硬的“拥有不死性”。
- source_word: φῶς οἰκῶν ἀπρόσιτον
  choice: 住在人不能靠近的光中
  rationale: 保留“居住”意象，并将ἀπρόσιτον明确表达为人无法接近，而不弱化为一般性的明亮或神秘。
- source_word: οὐδεὶς ἀνθρώπων
  choice: 没有人
  rationale: 准确传达部分属格所表达的“人类中没有一人”；现代汉语的“人”自然涵盖全人类，无须刻意标示性别。
- source_word: οὐδὲ ἰδεῖν δύναται
  choice: 也没有人能见他
  rationale: 保留δύναται所强调的不能或无能力，而不只陈述尚未发生。
- source_word: τιμὴ καὶ κράτος αἰώνιον
  choice: 尊荣和永恒的权能
  rationale: “尊荣”符合颂赞语境；κράτος在颂赞中指彰显出来的权力与威势，“权能”兼顾此义，也避免把经文过度限定为政治性的统治权。
- source_word: ἀμήν
  choice: 阿们
  rationale: 采用现代中文基督教文本中通行的音译。
theological_decisions:
- issue: 关系从句及颂赞所指的对象
  choice: 正文保留代词“他”，按前文最自然理解为继续描述上帝并向他颂赞
  alternative: 也有人因较广语境中提到主耶稣基督，而认为这些描述和颂赞更直接指向基督
  rationale: 本节关于无人见过、也无人能见的措辞最自然指向上帝；但希腊文只用关系代词和代词，未在本节重述名号，因此以脚注保留上下文中可能产生的另一种理解，不在正文中强行消除张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不死不灭”比术语化的“不死性”更适合普通读者；“人不能靠近的光”清楚保留原文的超越性意象。正文不补出“上帝”或“基督”，以维持希腊文代词所留下的指称张力。
