  text: τηρῆσαί σε τὴν ἐντολὴν ἄσπιλον ἀνεπίλημπτον μέχρι τῆς ἐπιφανείας τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/014.yaml
  text: that you keep the commandment unstained and above reproach until the appearing of our Lord Jesus the Messiah[c][b][a],
translation:
  language: zh_hans
  text: 要持守这诫命，毫无玷污，无可指责，直到我们的主耶稣弥赛亚显现之时[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“耶稣基督”。希腊语称号Χριστός既可译作“弥赛亚”，也可采用较像专名的传统译法“基督”。
    reason: alternative_reading
  - marker: b
    text: “毫无玷污，无可指责”既可理解为描述“这诫命”，也可理解为描述提摩太持守诫命的方式或状态；希腊语的表达十分紧凑，没有完全展开两者的关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρῆσαί
  choice: 持守
  rationale: 此不定式承接上一节的嘱咐，表达忠实遵行并持续守住所领受的命令；“持守”兼有遵行与守护之意，又不把其中任何一面说得过满。
- source_word: τὴν ἐντολὴν
  choice: 这诫命
  rationale: 定冠词结合上下文，指向刚才郑重交付的命令。“诫命”保留原词的权威性和伦理分量；“这”在现代汉语中自然体现其特指性。
- source_word: ἄσπιλον
  choice: 毫无玷污
  rationale: 表达没有污点或瑕疵。“毫无玷污”庄重而清楚，并与后面的“无可指责”形成自然对应。
- source_word: ἀνεπίλημπτον
  choice: 无可指责
  rationale: 指没有可据以责难之处；这一译法是自然的现代汉语，也符合教牧书信中的用法。
- source_word: μέχρι τῆς ἐπιφανείας
  choice: 直到……显现之时
  rationale: μέχρι标明持续到某一将来事件；ἐπιφάνεια在此指主将来公开可见的显现。“显现”没有擅自加入“再次”或“第二次”等原文未明说的成分。
- source_word: τοῦ κυρίου ἡμῶν
  choice: 我们的主
  rationale: 按基督论称号译出κύριος，并自然保留第一人称复数所有关系。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣弥赛亚
  rationale: Χριστός在此庄严的末世性称谓中仍有“受膏者、弥赛亚”的称号意味，因此译出其意义；汉语不使用冠词，故不另加相当于英语“the”的成分。
theological_decisions:
- issue: ἄσπιλον和ἀνεπίλημπτον所修饰的对象
  choice: 采用紧凑的“持守这诫命，毫无玷污，无可指责”，不在正文中明定是形容诫命，还是形容提摩太持守诫命的方式或状态
  alternative: 译作“持守这毫无玷污、无可指责的诫命”，明确让两个形容词修饰“诫命”
  rationale: 希腊语中两个宾格形容词在语法上与“诫命”一致，但紧凑表达在意义上也容许它们描述提摩太如何持守。正文保留这种压缩关系，并用脚注提示。
- issue: Χριστοῦ在Ἰησοῦ Χριστοῦ中的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 在“我们的主……显现”这一庄严的末世语境中，Χριστός的称号意义仍清晰可闻；译作“弥赛亚”较透明地表达其含义，同时在脚注保留传统译名。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“持守”“诫命”“显现”保留经文的郑重语气，但不使用文言句式。正文以两个短语“毫无玷污，无可指责”保持原文的并列力度及其修饰关系上的压缩性。
