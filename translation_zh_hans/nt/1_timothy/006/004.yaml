id: 1TI.6.4
reference: 1 Timothy 6:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τετύφωται, μηδὲν ἐπιστάμενος, ἀλλὰ νοσῶν περὶ ζητήσεις καὶ λογομαχίας, ἐξ ὧν γίνεται φθόνος, ἔρις, βλασφημίαι, ὑπόνοιαι πονηραί,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/004.yaml
  text: he is puffed up[a], understanding nothing, but sick with a craving for controversies and word-battles, from which come envy, strife, slanders, and evil suspicions[c][b],
translation:
  language: zh_hans
  text: 他自高自大[a]，其实一无所知，反而病态地迷恋争论和字词之争[b]；由此产生嫉妒、纷争、毁谤[c]和恶意猜疑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“变得自负”。希腊文带有因骄傲而膨胀的意象。
    reason: lexical_alternative
  - marker: b
    text: 或译“为字词争吵”或“争辩字眼”。
    reason: lexical_alternative
  - marker: c
    text: 这里的“毁谤”指侮辱、诋毁人的言语；这个希腊词在其他语境中也可指“亵渎”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τετύφωται
  choice: 自高自大
  rationale: 该完成时形式表达因骄傲而膨胀、如今处于自负状态。中文用“自高自大”自然传达其骄傲自负的含义；膨胀的字面意象置于脚注说明。
- source_word: μηδὲν ἐπιστάμενος
  choice: 其实一无所知
  rationale: 表达对真理毫无真正认识或领会；“其实”凸显其自负与无知之间的反差，却不增添新的命题内容。
- source_word: νοσῶν
  choice: 病态地迷恋
  rationale: 保留νοσέω的疾病隐喻，同时以现代汉语自然表达对争论的不健康执迷。
- source_word: περὶ ζητήσεις
  choice: 争论
  rationale: ζητήσεις在此指引起争议的探究、争辩；“争论”简明通顺，并适合作为“迷恋”的对象。
- source_word: λογομαχίας
  choice: 字词之争
  rationale: 该复合词指围绕言辞或字词展开的争斗。“字词之争”既保留λόγος的词语成分，也传达μάχη的争竞性质。
- source_word: ἐξ ὧν γίνεται
  choice: 由此产生
  rationale: 清楚标明后列恶行是前述争论与字词之争造成的结果。
- source_word: φθόνος
  choice: 嫉妒
  rationale: 准确表达因他人所有而产生的怨恨性羡妒。
- source_word: ἔρις
  choice: 纷争
  rationale: 表达争竞、不和与冲突，适合此处恶行列表的简洁文体。
- source_word: βλασφημίαι
  choice: 毁谤
  rationale: 在这组人际争竞所生恶行的语境中，主要指侮辱、诋毁他人的言语；“毁谤”准确而庄重。该词在其他语境也可指亵渎，故以脚注保留其语义范围。
- source_word: ὑπόνοιαι πονηραί
  choice: 恶意猜疑
  rationale: ὑπόνοιαι指猜测或怀疑，πονηραί表明其邪恶、有害性质；“恶意猜疑”比生硬的“邪恶的怀疑”更符合现代汉语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“病态地迷恋”保留疾病隐喻而避免古奥表达；分号呈现原因与结果的结构。所有脚注标记均置于对应词语之后。
