base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/007.yaml
  text: For we brought nothing into the world[a], and we are not able to carry anything out.
translation:
  language: zh_hans
  text: 因为我们没有带任何东西到世上来[a]，也不能带任何东西出去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“因为我们没有带任何东西到世上来，因为（或：也）不能带任何东西出去。”原文连接词可表示原因，也可引出与前句相呼应的第二个陈述。
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲν
  choice: 没有……什么
  rationale: 在否定句中自然表达绝对否定，作“带到……来”的宾语，相当于“什么也没有”。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文并说明理由；现代汉语中“因为”能清楚保留其解释、论证作用。
- source_word: εἰσηνέγκαμεν
  choice: 带……来
  rationale: 表达 εἰσφέρω“带入”的含义；与“到世上”搭配自然，并保留人生进入世界的意象。
- source_word: εἰς τὸν κόσμον
  choice: 到世上
  rationale: κόσμος 在此指人出生所进入的世界；“到世上来”是自然、庄重的现代汉语表达。
- source_word: ὅτι
  choice: 也
  rationale: 按两句对应并列的理解处理，使“没有带来”与“不能带走”形成格言式平行；其可能的因果含义在脚注中保留。
- source_word: οὐδὲ
  choice: 也不能……什么
  rationale: 与前句否定相呼应，在汉语中用“也不能”自然呈现附加的否定。
- source_word: ἐξενεγκεῖν
  choice: 带……出去
  rationale: 保留 ἐκφέρω“带出”的方向性，并与前句“带……到世上来”形成对应。
- source_word: τι
  choice: 什么
  rationale: 在否定结构“不能带什么出去”中自然表达不定代词的非特指含义，即任何东西都不能带走。
- source_word: δυνάμεθα
  choice: 不能
  rationale: 简明、自然地表达“不具备能力”，语义与原文相符。
theological_decisions:
- issue: ὅτι 引出的第二分句与第一分句的逻辑关系
  choice: 译作并列呼应：“也不能带什么出去”
  alternative: 译作因果关系：“因为我们也不能带什么出去”
  rationale: 原文 ὅτι 可以表示原因，但本句也可理解为两个相称的格言式陈述。正文采用自然的并列表达，脚注明确保留因果解读，避免消除原文歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“到世上来／带什么出去”保留原文的方向对照；正文流畅简洁，原文连接词的歧义由脚注呈现。
