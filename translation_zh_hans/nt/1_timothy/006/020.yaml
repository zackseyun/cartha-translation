id: 1TI.6.20
reference: 1 Timothy 6:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ὦ Τιμόθεε, τὴν παραθήκην φύλαξον, ἐκτρεπόμενος τὰς βεβήλους κενοφωνίας καὶ ἀντιθέσεις τῆς ψευδωνύμου γνώσεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/020.yaml
  text: O Timothy[a], guard the deposit entrusted to you[b], turning away from the profane empty talk and contradictions of what is falsely called knowledge.
translation:
  language: zh_hans
  text: 提摩太啊，你要守护所托付给你的[a]，避开不敬虔的空谈，以及那被错误地称为“知识”的对立说法[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“那托付之物”。
    reason: 保留παραθήκη“交托保管之物”的名词隐喻，并提示正文为自然汉语所作的展开。
  - marker: b
    text: “对立说法”也可译作“反对意见”或“矛盾论调”；“被错误地称为‘知识’”也可译作“所谓的知识”。
    reason: ἀντιθέσεις可指对立、反对或相互抵触的主张；ψευδώνυμος指名称不实。脚注保留这两个词的词义幅度，且不将其所指思想体系具体化。
lexical_decisions:
- source_word: Ὦ Τιμόθεε
  choice: 提摩太啊
  rationale: “啊”自然传达呼语助词Ὦ所带的郑重、恳切语气，又符合现代汉语表达。
- source_word: τὴν παραθήκην
  choice: 所托付给你的
  rationale: παραθήκη指交托他人保管之物。此译自然表达其受托保管的含义，同时不擅自限定为福音、使徒教训或职分。
- source_word: φύλαξον
  choice: 守护
  rationale: 表达警醒看守、妥善保全受托之物的意味，力度比一般的“持守”更贴近原文。
- source_word: ἐκτρεπόμενος
  choice: 避开
  rationale: 该分词表示转身离开、回避；在现代汉语中以“避开”衔接主命令最为自然。
- source_word: βεβήλους
  choice: 世俗的
  rationale: βεβήλους本指非神圣、凡俗之物；“世俗的”保留与圣洁相对的宗教意味，且比“亵渎的”更符合该词本身的语义范围。
- source_word: κενοφωνίας
  choice: 空谈
  rationale: 准确传达内容空洞、毫无价值的话语，简洁而符合现代汉语。
- source_word: ἀντιθέσεις
  choice: 种种对立说法
  rationale: ἀντιθέσεις可指对立、反对或相互抵触的主张。“对立说法”保留其宽泛性，不强行断定这些话在逻辑上自相矛盾。
- source_word: τῆς ψευδωνύμου γνώσεως
  choice: 那被假称为“知识”的
  rationale: ψευδώνυμος意为名称不实、被错误命名；此译明确表明作者否定“知识”这一称号的真实性，引号帮助现代读者识别其受质疑的标签性质。
theological_decisions:
- issue: παραθήκη所指的内容
  choice: 译为“所托付给你的”，不具体说明所托付的内容
  alternative: 福音信息；使徒教训；提摩太所领受的职分
  rationale: 上下文很可能指所领受的使徒信息，但本节名词本身未明确界定内容；译文保留这种开放性，避免加入特定教义解释。
- issue: “知识”与对立说法之间的关系
  choice: 将ἀντιθέσεις理解为被假称为“知识”之事所包含或产生的对立说法
  alternative: 把“对立说法”视为独立于“知识”的第二类对象
  rationale: 属格τῆς ψευδωνύμου γνώσεως最自然地修饰ἀντιθέσεις，但其与前面的“空谈”也可能形成较宽泛的关联；译文维持紧密修饰关系而不进一步界定其思想体系。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话书面语。“提摩太啊”保留郑重呼告；“守护”“避开”形成清晰劝诫语气。避免用过于古雅的“虚妄言语”或容易过度强化的“亵渎”。
