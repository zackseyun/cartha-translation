id: 1TI.6.21
reference: 1 Timothy 6:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἥν τινες ἐπαγγελλόμενοι περὶ τὴν πίστιν ἠστόχησαν. Ἡ χάρις ⸂μεθ’ ὑμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/021.yaml
  text: By professing it[a], some have missed the mark concerning the faith[c][b]. Grace be with you.
translation:
  language: zh_hans
  text: 有些人自称有这种知识[a]，却在信仰[b]上偏离了目标。愿恩典与你们[c]同在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有些人宣称持有这种知识，便在信仰上走偏了。”希腊文明确使用关系代词回指上一节的“所谓的知识”；相关动词也可译为“走偏”或“犯了错误”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“信仰”很可能指基督信仰这一整体，不过也可能较宽泛地指个人的信心。
    reason: alternative_reading
  - marker: c
    text: 希腊文的“你们”是复数，表明这句祝福不一定只给提摩太一人。
    reason: grammatical_clarification
lexical_decisions:
- source_word: ἥν
  choice: 这种知识
  rationale: 阴性单数关系代词回指上一节的“所谓的知识”。汉语将所指对象明说为“这种知识”，既自然，也保留上下文联系。
- source_word: ἐπαγγελλόμενοι
  choice: 自称有
  rationale: 此处中间语态分词表示宣称拥有或以某事自居，并非“应许”；“自称有”适合其论辩语境。
- source_word: περὶ τὴν πίστιν
  choice: 在信仰上
  rationale: περί加宾格表示所涉及的范围或方面；“在……上”是自然的现代汉语表达。
- source_word: πίστιν
  choice: 信仰
  rationale: 本段讨论虚假的教导，因此这里很可能指基督信仰这一整体，而不只是个人内心的信心；“信仰”也仍容许较宽泛的理解。
- source_word: ἠστόχησαν
  choice: 偏离了目标
  rationale: ἀστοχέω带有未击中目标、偏离目标的意象；此译保留比喻，同时符合现代汉语。
- source_word: Ἡ χάρις
  choice: 恩典
  rationale: 这是书信结尾的祝福语；汉语无需译出希腊语冠词。
- source_word: μεθ’ ὑμῶν
  choice: 与你们同在
  rationale: 补出祝愿语气中的“愿”，并明确保留ὑμῶν的复数含义。
theological_decisions:
- issue: “信仰”（πίστις）的含义
  choice: 主要按作为整体的基督信仰理解
  alternative: 个人对上帝或基督的信心
  rationale: 紧接上一节对“冒牌知识”的警告，且教牧书信常以πίστις指共同持守的基督信仰；脚注保留个人信心这一可能。
- issue: 结尾祝福的对象
  choice: 保留复数“你们”
  alternative: 按本信直接收信人译成单数“你”
  rationale: 所给希腊文本是复数ὑμῶν，可能表明祝福也临到提摩太所在的信徒群体，不应为行文顺畅而改成单数。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“自称有这种知识”清楚承接上一节；“偏离了目标”保留原文的射靶比喻。祝福语简洁，并明确呈现复数受词。
