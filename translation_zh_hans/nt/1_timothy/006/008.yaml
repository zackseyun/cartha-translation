  text: But if we have food and covering[a], we will be content with these.
translation:
  language: zh_hans
  text: 不过，若有食物和遮蔽之物[a]，我们便会对这些感到满足。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“衣物”；希腊语原词泛指遮蔽或覆盖之物，也可能包括住所。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχοντες
  choice: 只要有
  rationale: 该分词为状语，说明主句成立的处境或条件。译作“只要有”符合现代汉语表达，也保留近似条件性的语气，不强化为因果关系。
- source_word: δὲ
  choice: 不过
  rationale: δέ承接上文并表示较轻的转折；“不过”比“但是”稍缓，适合这里的语篇关系。
- source_word: διατροφὰς
  choice: 食物
  rationale: 该词指维持生活所需的供养，尤其是食物；“食物”自然、明确。
- source_word: σκεπάσματα
  choice: 遮身之物
  rationale: 该词泛指覆盖之物，语境中至少可指衣物，也可能包含住所。“遮身之物”比单译“衣服”略宽，同时在现代汉语中尚属自然。
- source_word: τούτοις
  choice: 以这些
  rationale: 与格指回前述基本生活所需；“以这些为满足”保留指示词的回指作用。
- source_word: ἀρκεσθησόμεθα
  choice: 我们就会……为满足
  rationale: 该形式为将来时，被动形式在此表达知足、满足。译文保留陈述性的将来语气，不改成劝勉式的“我们应当知足”。
theological_decisions:
- issue: σκεπάσματα的范围
  choice: 采用较宽的“遮身之物”，并以脚注说明可特指衣物，也可能包括住所
  alternative: 仅译作“衣服”或仅译作“住所”
  rationale: 原词的语义范围并不完全确定。正文避免人为限定其所指，保留经文关于基本生活所需的广度。
- issue: ἀρκεσθησόμεθα的语气
  choice: 保留将来陈述：“我们就会……为满足”
  alternative: 采用劝勉语气：“我们就应当知足”
  rationale: 希腊文是将来直陈式；尽管语境具有伦理劝导作用，翻译不应把语法形式直接改为命令或劝勉。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“遮身之物”用于保留原词较宽的语义；脚注交代常见的较窄译法及可能范围。
