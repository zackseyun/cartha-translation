  source_fidelity: 译文忠实传达了原文的主要句法和语义：πιστούς δεσπότας译为“主人是信徒的”，禁令“不可……轻看”对应καταφρονείτωσαν，“反而要越发服侍他们”保留了μᾶλλον及δουλεύω所含的服役意味。后半句以“领受这益处的”对应οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι，没有在正文中越过原文的压缩、争议性结构而明确补出“主人”或“服侍”。“信徒，是蒙爱的人”准确表达πιστοί καὶ ἀγαπητοί。末句“这些事，你要教导，也要劝勉”完整对应两个现在时命令语气。
