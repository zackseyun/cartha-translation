id: 1TI.6.2
reference: 1 Timothy 6:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οἱ δὲ πιστοὺς ἔχοντες δεσπότας μὴ καταφρονείτωσαν, ὅτι ἀδελφοί εἰσιν· ἀλλὰ μᾶλλον δουλευέτωσαν, ὅτι πιστοί εἰσιν καὶ ἀγαπητοὶ οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι. Ταῦτα δίδασκε καὶ παρακάλει.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/002.yaml
  text: And those who have believing masters must not despise them because they are brothers[a]; rather, they must serve them all the more, because those who partake of the benefit are believers and beloved[b]. Teach and urge these things.
translation:
  language: zh_hans
  text: 至于那些主人是信徒的，不可因为他们是弟兄[a]就轻看他们；反而要越发服侍他们，因为领受这益处的是信徒，是蒙爱的人[b]。这些事，你要教导，也要劝勉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姊妹”；希腊文直译为“弟兄”。
    reason: lexical_alternative
  - marker: b
    text: “领受这益处的”这一短语不易确定。它最可能指那些从奴仆的服侍中受益的信主主人。
    reason: alternative_reading
lexical_decisions:
- source_word: πιστοὺς
  choice: 信徒
  rationale: 在“主人”的语境中，指相信基督的人，而非仅指可靠或忠诚的人。
- source_word: δεσπότας
  choice: 主人
  rationale: 此词指在奴隶制家庭关系中拥有支配权的人；现代汉语以“主人”最自然，也保留当时的社会现实。
- source_word: καταφρονείτωσαν
  choice: 不可……轻看
  rationale: 表达因轻视而不尊重或怠慢；“轻看”简洁自然，并保留禁令的力度。
- source_word: ἀδελφοί
  choice: 弟兄
  rationale: 保留希腊文阳性复数形式及初期教会中同信者的家人意象；脚注说明也可按群体用法理解为“弟兄姊妹”。
- source_word: μᾶλλον δουλευέτωσαν
  choice: 反而要越发服侍他们
  rationale: δουλεύω在此指处于奴仆身份而服役；上下文已显明主仆关系，因此“服侍”自然，同时“越发”对应μᾶλλον。
- source_word: πιστοί
  choice: 信徒
  rationale: 此处名词化使用，指相信基督的人，与本节开头的πιστούς呼应。
- source_word: ἀγαπητοὶ
  choice: 蒙爱的人
  rationale: 既表达他们是被爱者，也保留早期基督徒群体中的亲爱意味，且现代汉语自然庄重。
- source_word: οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι
  choice: 领受这益处的
  rationale: “领受这益处”贴近该压缩且有争议的结构，不在正文中擅自补入“服侍”，从而保留一定歧义。
- source_word: Ταῦτα δίδασκε καὶ παρακάλει
  choice: 这些事，你要教导，也要劝勉
  rationale: 两个现在时命令语气均直接指向提摩太；“教导”“劝勉”清楚体现训导语境。
theological_decisions:
- issue: ἀδελφοί在教会群体语境中的性别范围
  choice: 弟兄
  alternative: 弟兄姊妹；同为弟兄
  rationale: 正文保留源文阳性复数和属灵家人的称谓，不无声地中性化；脚注交代该复数在群体用法中也可能涵盖女性。
- issue: 奴隶制语境中的身份用语
  choice: 主人……服侍
  alternative: 主人……作奴仆服侍；奴隶主……服役
  rationale: 本节有δεσπότης和δουλεύω，却没有直接出现δοῦλος。译文准确呈现不平等的主仆关系，同时避免加入源文没有明说的名词。
- issue: οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι所指对象
  choice: 正文不明说对象，语序倾向指信主的主人
  alternative: 指服侍的奴仆；指双方共同得益
  rationale: 语境最自然地将领受益处者理解为因服侍而受益的主人，但希腊文结构紧缩且存在争议，因此正文保持相对开放，并在脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“至于”承接前文并体现δέ的转折推进；以“主人是信徒”避免“有信徒作主人”的生硬表达。正文保留受益者短语的解释张力，脚注提示最可能的所指。
