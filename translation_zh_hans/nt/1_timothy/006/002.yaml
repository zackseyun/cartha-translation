  terminology: “信徒”“主人”“弟兄”“服侍”“劝勉”等术语一致且符合本段社会和教会语境。“主人”准确对应δεσπότας；本节并未出现δοῦλος名词，故不在正文强加“奴隶”一词是审慎的。“弟兄”保留原文阳性复数，脚注适当地交代群体语境下“弟兄姊妹”的可能理解。“蒙爱的人”可表达ἀγαπητοί的被爱和亲爱意味。
