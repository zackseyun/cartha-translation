source:
  edition: SBLGNT
  text: παραγγέλλω σοι ἐνώπιον τοῦ θεοῦ τοῦ ⸀ζῳογονοῦντος τὰ πάντα καὶ Χριστοῦ Ἰησοῦ τοῦ μαρτυρήσαντος ἐπὶ Ποντίου Πιλάτου τὴν καλὴν ὁμολογίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/013.yaml
  text: I charge you before God[a], who gives life to all things, and Messiah Jesus, who testified to the good confession before Pontius Pilate[c][b],
translation:
  language: zh_hans
  text: 我在那使万物存活的上帝[a]和基督耶稣[b]面前，郑重嘱咐你；基督耶稣曾在本丢·彼拉多面前作了那美好的宣认[c]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使万物存活”也可译作“赐生命给万物”或“保全万物的生命”。希腊语可侧重赋予生命，也可侧重维持生命。
    reason: lexical_alternative
  - marker: b
    text: “基督”意为“弥赛亚”，是称号。也可译作“弥赛亚耶稣”。
    reason: title_clarification
  - marker: c
    text: “作了那美好的宣认”也可译作“为那美好的宣认作见证”。“在本丢·彼拉多面前”也可能指“在本丢·彼拉多执政期间”。
    reason: source_ambiguity
lexical_decisions:
- source_word: παραγγέλλω σοι
  choice: 郑重嘱咐你
  rationale: παραγγέλλω表示带权威的命令或严肃指示；结合“在……面前”的起誓式语境，“郑重嘱咐”既传达分量，也符合现代汉语表达。
- source_word: ἐνώπιον
  choice: 在……面前
  rationale: 保留在上帝和基督耶稣临在之下发出严肃嘱咐的意味。
- source_word: τοῦ θεοῦ τοῦ ζῳογονοῦντος τὰ πάντα
  choice: 那使万物存活的上帝
  rationale: ζῳογονέω可指赋予生命，也可指保存生命；“使万物存活”在汉语中可涵盖两者，不把语义限定为一次性的创造或持续的保全。
- source_word: Χριστοῦ Ἰησοῦ
  choice: 基督耶稣
  rationale: Χριστός在此仍是称号，但“基督耶稣”是现代中文圣经语体中自然、清楚的表达；脚注说明称号的含义。
- source_word: τοῦ μαρτυρήσαντος
  choice: 曾……作出
  rationale: 该分词与ὁμολογία组合，指耶稣在受审场景中公开作出见证或宣认；中文用“作出……宣认”自然表达这一公开见证行为。
- source_word: ἐπὶ Ποντίου Πιλάτου
  choice: 在本丢·彼拉多面前
  rationale: 结合μαρτυρήσαντος及受审语境，理解为在彼拉多面前作见证最为贴切；ἐπί加属格也可能表示彼拉多执政期间，故在脚注保留。
- source_word: τὴν καλὴν ὁμολογίαν
  choice: 那美好的宣认
  rationale: ὁμολογία指公开承认或宣告信仰内容；“宣认”比“认罪”更准确，也保留与上下文中提摩太之宣认的呼应。καλή直译为“美好的”。
theological_decisions:
- issue: ζῳογονοῦντος是强调赐予生命还是保全生命
  choice: 使万物存活
  alternative: 赐生命给万物；保全万物的生命
  rationale: 原词的语义范围容许“使活”和“保活”。正文采用兼容性较强的措辞，脚注明确列出两种侧重，不将其限定为某一神学命题。
- issue: Χριστός作为称号的表达
  choice: 基督耶稣
  alternative: 弥赛亚耶稣
  rationale: “基督”是Χριστός的传统中文音义称号，在现代中文基督教语境中最自然；脚注指出其意为“弥赛亚”，避免将其纯粹当作名字。
- issue: 耶稣与“美好的宣认”的关系
  choice: 作出那美好的宣认
  alternative: 为那美好的宣认作见证
  rationale: 希腊文以μαρτυρέω直接支配ὁμολογία，既有见证行为，也有公开宣认的内容。正文采取自然汉语，脚注保留较贴近形式的译法。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“郑重嘱咐”体现原文命令的权威与起誓式语气；“宣认”避免把ὁμολογία误解为认罪，并与上下文的公开信仰宣告相呼应。末尾用冒号，表明本节的嘱咐内容在下一节继续。
