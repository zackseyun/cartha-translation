id: 1TI.6.12
reference: 1 Timothy 6:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀγωνίζου τὸν καλὸν ἀγῶνα τῆς πίστεως, ἐπιλαβοῦ τῆς αἰωνίου ζωῆς, εἰς ἣν ἐκλήθης καὶ ὡμολόγησας τὴν καλὴν ὁμολογίαν ἐνώπιον πολλῶν μαρτύρων.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/012.yaml
  text: Fight the good fight of the faith[b][a]; take hold of the eternal life to which you were called and about which you made the good confession before many witnesses.
translation:
  language: zh_hans
  text: 要为信仰打那美好的仗[a]；要持定永生。你蒙召，正是要得着这永生；你也曾在许多见证人面前作出那美好的宣认[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要凭着信心打那美好的仗。”希腊语可指为基督信仰而争战，也可指以信心为特征的争战。
    reason: alternative_reading
  - marker: b
    text: 也可译：“你蒙召，正是要得着这永生；你也曾为此在许多见证人面前作出那美好的宣认。”原文没有明说宣认的内容，不过上下文使这宣认与蒙召得永生紧密相连。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγωνίζου τὸν καλὸν ἀγῶνα
  choice: 打那美好的仗
  rationale: 保留动词与名词同源所形成的强烈争战意象；“打……仗”在现代汉语中自然有力。“美好”兼顾 καλός 所含的良善、可贵和高尚意味。
- source_word: τῆς πίστεως
  choice: 为信仰
  rationale: 结合冠词及教牧书信语境，正文采用较明确的客观含义，即为基督信仰而争战；希腊语也可能指以信心为特征的争战，因此脚注保留这一可能。
- source_word: ἐπιλαβοῦ
  choice: 持定
  rationale: 表达主动、坚决地抓住并不放开的意象，同时保持经文语体的庄重和简洁。
- source_word: τῆς αἰωνίου ζωῆς
  choice: 永生
  rationale: “永生”是准确而通行的现代汉语圣经用语；汉语无需以冠词形式另行标示其特指性。
- source_word: εἰς ἣν ἐκλήθης
  choice: 你蒙召，正是要得着这永生
  rationale: εἰς 表示蒙召所指向的目标；补出“这永生”使关系代词的指向在汉语中清楚自然，而不规定蒙召的神学机制。
- source_word: ὡμολόγησας τὴν καλὴν ὁμολογίαν
  choice: 作出那美好的宣认
  rationale: “宣认”表现公开承认、郑重表明的含义，也避免把 ὁμολογία 误解为单指承认罪过的“认罪”；“美好”保留与前文 καλός 的修辞呼应。
- source_word: ἐνώπιον πολλῶν μαρτύρων
  choice: 在许多见证人面前
  rationale: 直接传达公开发生于多人在场见证之下的含义；这里的 μάρτυρες 指见证人，并非后来的专门称谓“殉道者”。
- source_word: καί
  choice: 你也曾
  rationale: 按希腊语明示的并列连接来译，不在正文中额外规定宣认的具体内容；“也曾”自然连接蒙召与过去公开宣认这两件事。
theological_decisions:
- issue: τῆς πίστεως 指主观的信心，还是客观意义上的信仰
  choice: 正文译作“为信仰”，取较明确的客观意义
  alternative: “凭着信心打那美好的仗”，即以信心为特征或动力的争战
  rationale: 冠词和教牧书信中 πίστις 的用法支持“基督信仰”这一理解，但属格本身不能排除主观意义，故以脚注保留真实歧义。
- issue: 公开宣认与永生或蒙召之间的关系
  choice: 正文按 καί 译为并列的“你也曾……作出”
  alternative: 把宣认理解为关于永生，或与蒙召进入永生紧密相连的宣认
  rationale: 希腊文没有明说宣认的内容。上下文次序使它很可能与蒙召和永生有关，但若在正文加入“为此”或“关于这永生”，便会把隐含联系变成明说，因此在脚注说明。
- issue: “持定永生”是否暗示人靠行为获得永生
  choice: 保留命令式的“持定”，不另加获得方式的解释
  alternative: 将其弱化为“珍惜永生”或扩写为某种特定救恩机制
  rationale: 原文以强烈命令要求提摩太抓住永生，同时又说他已经蒙召；应保留这两者之间的张力，不用译文建立额外的功德论或特定宗派解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“打那美好的仗”保留原文争战意象和修辞力度；“持定”较凝练，表达坚决抓住；“宣认”避免“认罪”的窄义，并突出公开、郑重的承认。标点将两个命令分开，再以分号呈现蒙召与公开宣认的紧密并列关系。
