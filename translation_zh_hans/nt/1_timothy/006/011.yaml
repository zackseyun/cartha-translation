language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Σὺ δέ, ὦ ἄνθρωπε ⸀θεοῦ, ταῦτα φεῦγε· δίωκε δὲ δικαιοσύνην, εὐσέβειαν, πίστιν, ἀγάπην, ὑπομονήν, ⸀πραϋπαθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/011.yaml
  text: But you[a], man of God, flee these things; but pursue righteousness, godliness, faith, love, steadfastness[c][b], gentleness.
translation:
  language: zh_hans
  text: 但你这属上帝的人，要逃避这些事，却要追求公义[a]、敬虔、信心[b]、爱、坚忍和温柔[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“正义”。
    reason: lexical_alternative
  - marker: b
    text: 或译“忠信”或“信靠”。
    reason: lexical_alternative
  - marker: c
    text: 这个罕见的希腊词也可译作“谦柔”“忍让”或“耐心的温柔”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ δέ
  choice: 但你
  rationale: 保留强调的第二人称，并显明与上文所述之人的强烈对比。
- source_word: ὦ ἄνθρωπε θεοῦ
  choice: 你这属上帝的人
  rationale: 这是对提摩太的直接称呼；译文保留单数指向及“属于上帝”的圣经性身份含义，同时避免“神人”在现代汉语中可能产生的超凡人物歧义。
- source_word: ταῦτα φεῦγε
  choice: 要逃避这些事
  rationale: ταῦτα回指上文的恶行与贪财谬误；“逃避”保留命令的持续性和紧迫感。
- source_word: δίωκε δὲ
  choice: 却要追求
  rationale: “却”体现δέ的对比，“追求”与“逃避”形成有力对应，表达主动而持续地趋向这些品格。
- source_word: δικαιοσύνην
  choice: 公义
  rationale: 在保罗书信及基督教汉语语境中，“公义”能涵盖正直和合宜关系；“正义”作为可能侧重社会公平的译法列入脚注。
- source_word: εὐσέβειαν
  choice: 敬虔
  rationale: 指向对上帝的敬畏以及由此形成的生活方式；“敬虔”简洁且为现代信仰语境所熟悉。
- source_word: πίστιν
  choice: 信心
  rationale: 保留πίστις的基本信仰与信靠义；本处处于品格清单中，也可能指忠信，故在脚注注明。
- source_word: ἀγάπην
  choice: 爱
  rationale: 直接、自然地表达ἀγάπη，在品格清单中含义清楚。
- source_word: ὑπομονήν
  choice: 坚忍
  rationale: 表达在压力和患难中持久不退的品格，比单纯“耐心”更能体现坚韧与恒常。
- source_word: πραϋπαθίαν
  choice: 温柔
  rationale: 这是罕见词，兼有温和、谦柔和耐心克制的意味；“温柔”最简明自然，其他可能含义以脚注保留。
theological_decisions:
- issue: ὦ ἄνθρωπε θεοῦ的身份称呼与性别表达
  choice: 你这属上帝的人
  alternative: 神人；上帝的人
  rationale: 原文以阳性单数直接称呼提摩太，但ἄνθρωπος在该固定称谓中着重其属于上帝的身份。汉语“人”本身不排除提摩太的男性身份，也不额外扩大或中性化原文的指称。
- issue: δικαιοσύνη的语义范围
  choice: 公义
  alternative: 正义
  rationale: 本处品格清单适合采用涵盖道德正直和合宜关系的“公义”，同时以脚注保留其可强调公平、正义的一面。
- issue: 品格清单中πίστις的含义
  choice: 信心
  alternative: 忠信；信靠
  rationale: 该词既可指信心或信靠，也可能在品格清单中指忠诚可靠；正文不武断改译为“忠信”，而以脚注保留歧义。
- issue: 罕见词πραϋπαθία的范围
  choice: 温柔
  alternative: 谦柔；忍让；耐心的温柔
  rationale: 该罕见词不能仅凭一个汉语词穷尽其温和与克制意味，因此采用自然正文译词，并在脚注呈现其他合理理解。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“但……却……”清楚呈现上下文及两个命令之间的对比；品格清单使用简洁并列结构。称呼采用“属上帝的人”，避免“神人”在现代汉语中的歧义。
