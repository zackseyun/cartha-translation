  text: ῥίζα γὰρ πάντων τῶν κακῶν ἐστιν ἡ φιλαργυρία, ἧς τινες ὀρεγόμενοι ἀπεπλανήθησαν ἀπὸ τῆς πίστεως καὶ ἑαυτοὺς περιέπειραν ὀδύναις πολλαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/010.yaml
  text: For the love of money is a root of all kinds of evils[a]; by craving it[c][b], some have wandered away from the faith and pierced themselves with many pains.
translation:
  language: zh_hans
  text: 因为贪爱钱财是各样恶事的一个根源[a]。有些人因一味贪求钱财而偏离了信仰[b]，用许多苦痛刺透了自己[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统上也译作“贪爱钱财是万恶之根”。原文更自然地可理解为“各样恶事的一个根源”，并非断言每一种恶都只有这一个根源。
    reason: alternative_reading
  - marker: b
    text: 或译“偏离了信心”。这里的“信仰”很可能指人所持守的基督信仰，而不只是个人内心的信靠。
    reason: lexical_alternative
  - marker: c
    text: “苦痛”也可译作“忧伤”或“愁苦”；原词可包括剧烈的痛楚和内心的煎熬。
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζα
  choice: 一个根源
  rationale: ῥίζα在系动词前作无冠词的表语，此处译为不定的“一个根源”，既符合希腊语句法，也避免说成一切恶事都只有同一个根源。
- source_word: πάντων τῶν κακῶν
  choice: 各样恶事
  rationale: 复数κακῶν可指各种恶事或恶的事物；“各样恶事”在现代汉语中自然地表达其广泛、分类性的范围，不把经文绝对化为毫无例外的“一切罪恶”。
- source_word: φιλαργυρία
  choice: 贪爱钱财
  rationale: 该词指对银钱、财富的爱。“贪爱钱财”保留了“爱钱”的具体含义，又比单说“贪婪”范围更准确。
- source_word: ἧς…ὀρεγόμενοι
  choice: 一味贪求钱财
  rationale: 关系代词回指“贪爱钱财”，分词表示强烈地向往、追求。汉语若直译为“追求这种贪爱”十分生硬，因此按其所指自然表达为“一味贪求钱财”，并保留持续而强烈的欲求意味。
- source_word: ἀπεπλανήθησαν ἀπὸ τῆς πίστεως
  choice: 偏离了信仰
  rationale: 动词描绘受迷惑而走离原有道路；“偏离”保留离开的动态。结合冠词及教牧书信语境，“信仰”主要指基督信仰这一客观内容。
- source_word: περιέπειραν
  choice: 使自己被……刺透了
  rationale: 该动词有刺穿、刺透之意，并带反身宾语。“使自己被……刺透了”保留原文强烈的穿刺意象。
- source_word: ὀδύναις πολλαῖς
  choice: 许多苦痛
  rationale: ὀδύνη可涵盖剧痛、忧伤和内心煎熬。“苦痛”保持较宽的语义范围，不将其只限于情绪上的悲伤。
theological_decisions:
- issue: 贪爱钱财与恶事之间的范围关系
  choice: 贪爱钱财是各样恶事的一个根源
  alternative: 贪爱钱财是万恶之根
  rationale: 原文ῥίζα无冠词，而πάντων τῶν κακῶν为复数。“一个根源”与“各样恶事”较好地反映句法和语境，也不把这句话解释成每一种恶都只源于爱钱。
- issue: τῆς πίστεως的所指
  choice: 信仰，即基督信仰的客观内容
  alternative: 信心，即个人主观的信靠
  rationale: 教牧书信常以带冠词的“信仰”指使徒所传的基督信仰；不过“信心”的理解仍有词义上的可能，故在脚注中保留。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“贪爱钱财”“各样恶事”“偏离了信仰”便于普通读者理解；末句保留“刺透”这一鲜明隐喻，不将其弱化为一般性的“遭受痛苦”。
