  text: ἔστιν δὲ πορισμὸς μέγας ἡ εὐσέβεια μετὰ αὐταρκείας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/006.yaml
  text: But godliness with contentment is great gain[a][b].
translation:
  language: zh_hans
  text: 然而，敬虔与知足[b]，就是极大的收益[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“极大的利润”或“极大的获利之道”。希腊文所用的词与“收益、获利”有关，呼应上一节。
    reason: lexical_alternative
  - marker: b
    text: 或译“自足”。这里更可能指知足或对已有的感到满足，而非独立自恃。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: 然而
  rationale: 作为温和的转折连接上文，反衬有人把敬虔当作牟利门路的想法。
- source_word: πορισμὸς
  choice: 收益
  rationale: 此词可指所得、利润或获利的门路；“收益”在本句中自然，也保留了与上一节“牟利”观念的呼应，而不限定为物质财富。
- source_word: μέγας
  choice: 极大的
  rationale: 表达原文对这种收益的强调；“极大的收益”符合现代汉语表达。
- source_word: εὐσέβεια
  choice: 敬虔
  rationale: 指向神的敬畏、虔诚及由此而来的生活方式；“敬虔”是教牧书信中自然且稳定的对应词。
- source_word: μετὰ
  choice: 加上
  rationale: 表达伴随、相联的关系，使“敬虔”与“知足”共同构成句子的主项。
- source_word: αὐταρκείας
  choice: 知足
  rationale: 该词虽可指自足或充足，但下文以有衣有食便当知足来说明其含义；“知足”可避免让人误解为脱离神的独立自恃。
theological_decisions:
- issue: 基督徒语境中 αὐτάρκεια 的含义
  choice: 知足
  alternative: 自足；充足
  rationale: 紧接着的第7—8节从基本生活供应说明这一态度，重点是满足于所有，而不是斯多葛式的自主独立。
- issue: 敬虔与收益的关系
  choice: 敬虔加上知足，本身就是极大的收益
  alternative: 伴有知足的敬虔是极大的获利之道
  rationale: 希腊文谓语结构容许“所得”与“获利手段”两种侧重。正文采用身份判断，既保留与上一节的文字呼应，也避免把敬虔说成谋取其他利益的工具；脚注保留另一可能。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。“然而”承接上文形成温和转折；“极大的收益”保留原文的经济性比喻和上下文的反讽张力。脚注标记紧随各自所说明的词语。
