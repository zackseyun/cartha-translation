  text: χεῖρας ταχέως μηδενὶ ἐπιτίθει, μηδὲ κοινώνει ἁμαρτίαις ἀλλοτρίαις· σεαυτὸν ἁγνὸν τήρει.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/022.yaml
  text: Do not lay hands on anyone hastily[a], nor share in the sins of others; keep yourself pure.
translation:
  language: zh_hans
  text: 不要急着给任何人按手[a]，也不要与别人的罪有份；要保持自己的纯洁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按本段语境更具体地译作：“不要仓促任命（或按立）任何人。”希腊原文直译为“按手”，这个表达常与委任或认可某人承担服事职分有关。
    reason: lexical_alternative
lexical_decisions:
- source_word: χεῖρας ... ἐπιτίθει
  choice: 给……按手
  rationale: 原文直译为“把手按在……上”。在本段讨论长老与责任的语境中，很可能指借按手委任或认可某人承担职分；正文保留原有表达，避免把含义限定为某一种教会程序。
- source_word: ταχέως
  choice: 急着
  rationale: 此处不是单指动作迅速，而是警告不要未经充分考察便贸然行事。“急着”符合现代汉语，也传达不应仓促的意味。
- source_word: μηδενὶ
  choice: 任何人
  rationale: 与否定命令搭配译为“不要……任何人”，自然表达原文涵盖所有人的范围。
- source_word: μηδὲ κοινώνει
  choice: 也不要……有份
  rationale: κοινωνέω在这里表示参与、分担或因牵连而承担责任。“有份”既自然，又保留参与乃至连带责任的幅度。
- source_word: ἁμαρτίαις ἀλλοτρίαις
  choice: 别人的罪
  rationale: ἀλλότριος指属于他人的；“别人的罪”简明自然，不预先限定参与这些罪的具体方式。
- source_word: σεαυτὸν
  choice: 自己
  rationale: 准确表达反身代词，指提摩太本人。
- source_word: ἁγνὸν
  choice: 纯洁
  rationale: ἁγνός在此指广义的道德纯正；“纯洁”比“贞洁”范围更广，也比礼仪性的“洁净”更符合语境。
- source_word: τήρει
  choice: 保持
  rationale: 现在时命令语气含持续维持之意；“保持自己的纯洁”在现代汉语中自然，并体现持续性的要求。
theological_decisions:
- issue: “按手”在本节中的具体含义
  choice: 正文保留“给任何人按手”这一表达
  alternative: 译为“任命任何人”或“按立任何人”
  rationale: 上下文涉及长老及其问责，因此这里很可能是指委任、按立或公开认可某人承担服事职分。然而原文没有直接使用“任命”或“按立”的专门动词，保留“按手”可避免把经文限定为某一宗派的职分制度或礼仪。
- issue: 两个禁令之间的关系
  choice: 保留并列关系，不在正文中明说按手会如何导致在他人的罪上有份
  alternative: 明确译成因仓促按立而分担受任者的罪责，或视为完全无关的一般劝诫
  rationale: 两句相邻，可能暗示仓促认可不合适的人会使提摩太承担连带责任，但原文没有把逻辑关系明说。译文因此保留张力，不强行确定两句之间的具体因果关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“急着”比“仓促地”更自然，“有份”保留参与和连带责任的含义。脚注标记[a]已置于正文相应位置。
