  text: Χήρα καταλεγέσθω μὴ ἔλαττον ἐτῶν ἑξήκοντα γεγονυῖα, ἑνὸς ἀνδρὸς γυνή,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/009.yaml
  text: Let a widow be enrolled only if she is not less than sixty years old[a], having been the wife of one husband,
translation:
  language: zh_hans
  text: 寡妇须年满六十岁，且曾为一位丈夫的妻子[a]，才可列入名册。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“一位丈夫的妻子”。这句话可能指她在婚姻中的忠贞和名声；也有人理解为“只结过一次婚”。
    reason: 保留原文惯用语的多种可能理解，避免在正文中消除其真实歧义。
lexical_decisions:
- source_word: Χήρα
  choice: 寡妇
  rationale: 这是该词的通常含义，指丈夫已经去世的女人；本节谈的是被正式列入名册的寡妇所须具备的条件。
- source_word: καταλεγέσθω
  choice: 列入名册
  rationale: 此处指登记在正式名单上；“列入名册”保留了原文的行政性含义，也符合现代汉语表达。
- source_word: μὴ ἔλαττον ἐτῶν ἑξήκοντα
  choice: 年龄不得低于六十岁
  rationale: 原短语规定最低年龄；此译法准确保留限制语气，同时自然易懂。
- source_word: γεγονυῖα
  choice: 年龄……（并且）曾是
  rationale: 该分词与年龄短语连用时表示已经达到某一年龄；其完成状态也与后面的婚姻描述自然衔接。汉语按语境分别用“年龄不得低于”和“曾是”表达，不机械重复原文形式。
- source_word: ἑνὸς ἀνδρὸς γυνή
  choice: 一个丈夫的妻子
  rationale: 采用较贴近原文结构的表达，以保留这句惯用语的解释空间；它可能强调婚姻忠贞和名声，也可能被理解为只结过一次婚，正文不把争议单方面定论。
theological_decisions:
- issue: ἑνὸς ἀνδρὸς γυνή 的含义
  choice: 正文保留为“曾是一个丈夫的妻子”，不明确限定为只结过一次婚或泛指对丈夫忠贞。
  alternative: “对丈夫忠贞的女人”或“只结过一次婚的女人”
  rationale: 这句资格用语在解释上存在真实争议。保留较形式对应的说法，并以脚注列出主要理解，可避免引入特定宗派立场或把原文没有明确解决的问题强行定论。
translation_notes:
  register: 采用现代、庄重而清楚的标准普通话。“若要列入名册”使命令所表达的资格限制在汉语中更自然；“不得低于六十岁”清楚传达最低年龄要求。婚姻资格短语刻意保持较形式化的措辞，并用脚注说明歧义。
