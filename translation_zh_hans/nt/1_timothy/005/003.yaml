  yaml_path: translation/nt/1_timothy/005/003.yaml
  text: Honor widows who are truly widows[a].
translation:
  language: zh_hans
  text: 要敬重那些真正的寡妇[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要供养那些真正的寡妇。”按上下文，“敬重”很可能包括物质上的照顾。
    reason: 词义备选；说明τιμάω在本段语境中可能包含实际供养，而不把正文词义缩窄为金钱支持。
lexical_decisions:
- source_word: Χήρας
  choice: 寡妇
  rationale: χήρα直接指丈夫已经去世的妇女；此处为复数宾格，作命令式动词的宾语。译作“寡妇”准确、自然。
- source_word: τίμα
  choice: 敬重
  rationale: τιμάω的基本含义是尊敬、看重或给予应有的尊荣。结合本章照顾寡妇的语境，这种敬重很可能也包含实际供养，但该词本身不限于物质支持，因此正文保留较宽的“敬重”。
- source_word: τὰς ὄντως χήρας
  choice: 真正的寡妇
  rationale: ὄντως表示“确实、真正”，在这里构成有实际区分作用的限定；随后经文将进一步说明哪些寡妇确实处于需要教会照顾的境况。译文保留原文略显强调的重复概念，不提前把其具体标准写入本节。
- source_word: ὄντως
  choice: 真正
  rationale: 该副词并非单纯加强语气，而是标明一种需要辨别的类别。“真正”既保留这一限定作用，也让后文对其含义作进一步说明。
theological_decisions:
- issue: 语境中τιμάω的范围
  choice: 正文译作“敬重”，既涵盖尊重，也容许按上下文包含物质照顾。
  alternative: 译作“供养”，把重点明确落在物质支持上。
  rationale: 提摩太前书5章的上下文确实讨论家庭和教会对寡妇的实际供养，但希腊词τιμάω的语义比“供养”更广。正文不将其缩窄，脚注则说明语境中可能包含的实际照顾。
- issue: “真正的寡妇”的具体含义
  choice: 保留原文的限定表达，让随后经文界定其所指。
  alternative: 直接译为“真正无依无靠的寡妇”或“符合救济条件的寡妇”。
  rationale: 这些替代译法能够说明上下文含义，却会提前加入本节没有明说的条件。保留“真正的寡妇”可维持原文的张力与后文展开的空间。
translation_notes:
  register: 采用现代、庄重而简洁的普通话。“敬重”比“尊荣”更自然，又能保留尊敬与实际关怀的宽泛含义；“真正的寡妇”刻意保留原文的限定性，由后文进一步解释。
