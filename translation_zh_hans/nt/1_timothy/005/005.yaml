  text: ἡ δὲ ὄντως χήρα καὶ μεμονωμένη ἤλπικεν ἐπὶ ⸀θεὸν καὶ προσμένει ταῖς δεήσεσιν καὶ ταῖς προσευχαῖς νυκτὸς καὶ ἡμέρας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/005.yaml
  text: She who is truly a widow[a], and is left all alone[c][b], has set her hope on God and continues in petitions and prayers night and day.
translation:
  language: zh_hans
  text: 但那真正的寡妇，孤身无依[a]，已经把盼望寄托在上帝身上[b]，并且昼夜不断地祈求、祷告[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “孤身无依”也可译作“独自一人”或“被留下独自生活”；希腊语强调她被留下而独处的状态，在本段语境中可能指没有家人扶助。
    reason: lexical_alternative
  - marker: b
    text: 或译：“已经仰望上帝。”希腊语完成时可强调已经确立、并持续至今的盼望。
    reason: lexical_alternative
  - marker: c
    text: 原文分别使用“祈求”和“祷告”两个词：前者较侧重具体的恳求，后者是较宽泛的祷告用语。
    reason: lexical_distinction
lexical_decisions:
- source_word: ὄντως χήρα
  choice: 真正是寡妇
  rationale: ὄντως 表明这里所说的是上下文所界定的真正符合条件的寡妇，而不只是泛指丧偶妇女。
- source_word: μεμονωμένη
  choice: 孤身无依
  rationale: 完成时被动分词强调她已被留下、现今没有亲属扶助的处境；“孤身无依”自然表达独处及缺乏支持两层含义。
- source_word: ἤλπικεν ἐπὶ θεόν
  choice: 已经把盼望寄托在上帝身上
  rationale: 完成时表达已经形成并持续至今的坚定取向；“寄托在……身上”也保留介词 ἐπί 的依靠意味。
- source_word: προσμένει
  choice: 恒切
  rationale: 该动词表示持续坚持；在祈祷语境中用“恒切”简洁而自然，体现持续性而不过度增添含义。
- source_word: ταῖς δεήσεσιν καὶ ταῖς προσευχαῖς
  choice: 祈求、祷告
  rationale: 分别保留具体恳求与较宽泛祷告的两个希腊词，而不将二者合并。
- source_word: νυκτὸς καὶ ἡμέρας
  choice: 昼夜
  rationale: 符合现代汉语惯用表达，也传达持续不断的生活习惯；汉语通常说“昼夜”，不必机械照搬希腊语的夜—日顺序。
- source_word: δὲ
  choice: 但
  rationale: 承接前文并形成对照；在本节上下文中译作“但”比省略更清楚。
theological_decisions:
- issue: “真正是寡妇”的性质
  choice: 将其译为上下文所界定、孤身无依且仰望上帝的寡妇
  alternative: 仅将其理解为一般意义上的丧偶妇女
  rationale: ὄντως 及本章上下文显示保罗正在区分一种特定处境中的寡妇；译文保留这种限定作用，却不引入任何特定教派的制度解释。
- issue: 完成时所表达的盼望
  choice: 表达已经确立并持续至今的盼望
  alternative: 仅译作一般现在状态“仰望上帝”
  rationale: ἤλπικεν 的完成时兼有既成行动和持续结果；“已经把盼望寄托”保留这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“孤身无依”传达社会处境，“把盼望寄托在上帝身上”保留完成时的持续结果；“祈求、祷告”保留原文两个近义词。所有脚注标记均置于对应正文成分之后。
