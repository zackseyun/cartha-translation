  text: νεωτέρας δὲ χήρας παραιτοῦ· ὅταν γὰρ καταστρηνιάσωσιν τοῦ Χριστοῦ, γαμεῖν θέλουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/011.yaml
  text: But refuse younger widows[a], for when they become sensual against the Messiah, they desire to marry[c][b],
translation:
  language: zh_hans
  text: 但较年轻的寡妇，你要拒绝[a]；因为她们一旦不顾弥赛亚而任由情欲支配[b]，就想嫁人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按上下文，指拒绝把她们列入前文所说的寡妇名册，并非拒绝与她们来往或给予一切帮助。
    reason: contextual_clarification
  - marker: b
    text: 原文较直译为“针对（或反对）弥赛亚”；可能是说，她们的欲望与先前对他的委身发生冲突。传统译法常作“违背基督”。
    reason: alternative_reading
  - marker: c
    text: “不顾弥赛亚而任由情欲支配”也可译作“情欲冲动，违背弥赛亚”或“变得放纵，反对弥赛亚”。本句并非明确说嫁人本身就是所受谴责的事。
    reason: lexical_alternative
lexical_decisions:
- source_word: νεωτέρας χήρας
  choice: 较年轻的寡妇
  rationale: 形容词直接修饰“寡妇”，并与上下文所谈的年长寡妇形成对照。“较年轻”保留了比较级意味，又不擅自规定年龄界线。
- source_word: δὲ
  choice: 但
  rationale: δέ在这里表示与前文接纳寡妇登记的规定之间的轻微转折。
- source_word: παραιτοῦ
  choice: 你要拒绝
  rationale: 该中间语态命令式要求提摩太不予接纳；正文保留简洁的“拒绝”，脚注说明按上下文指不列入相关名册，而不是断绝一般来往。
- source_word: ὅταν γὰρ
  choice: 因为……一旦
  rationale: 同时表达γάρ的解释原因和ὅταν所指的一般性、条件性时机。
- source_word: καταστρηνιάσωσιν
  choice: 情欲冲动
  rationale: 这个罕见动词含有感官或性欲变得强烈、从而牵引其行动的意味。“情欲冲动”比生僻的贬义词更易懂，同时保留其道德张力。
- source_word: τοῦ Χριστοῦ
  choice: 违背弥赛亚
  rationale: 该属格与动词之间的关系较难确定；“违背弥赛亚”自然地表达欲望与对他的委身发生冲突，同时在脚注保留原文较直译的“针对／反对弥赛亚”。Χριστός在此作为称号，译作“弥赛亚”。
- source_word: γαμεῖν θέλουσιν
  choice: 就想嫁人
  rationale: θέλω加不定式表达愿望或意愿；按主语为女性寡妇，现代汉语用“嫁人”自然清楚。
theological_decisions:
- issue: Χριστοῦ的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: Χριστός在此作为称号使用；“弥赛亚”直接呈现其称号意义，而不是把它处理为人名的一部分。
- issue: καταστρηνιάσωσιν τοῦ Χριστοῦ的含义
  choice: 情欲冲动，违背弥赛亚
  alternative: 情欲使她们偏离弥赛亚／她们不顾弥赛亚而任由欲望支配
  rationale: 希腊文表达的是欲望与对弥赛亚的委身发生冲突，但属格关系及具体所指并不完全明确。正文保留这种张力，不把本节写成对再婚本身的谴责，也不把上下文推测的先前承诺写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“较年轻”保留比较级；“情欲冲动”避免文言或过度羞辱性的措辞；分号清楚划分命令与理由。脚注只解释上下文和希腊文歧义，不在正文中补入未明说的名册誓约理论。
