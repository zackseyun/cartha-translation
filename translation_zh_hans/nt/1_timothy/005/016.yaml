id: 1TI.5.16
reference: 1 Timothy 5:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἴ ⸀τις πιστὴ ἔχει χήρας, ⸀ἐπαρκείτω αὐταῖς, καὶ μὴ βαρείσθω ἡ ἐκκλησία, ἵνα ταῖς ὄντως χήραις ἐπαρκέσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/016.yaml
  text: If any believing woman has widows[a], let her provide for them, and let the church not be burdened, so that it may provide for those who are truly widows.
translation:
  language: zh_hans
  text: 如果有信主的妇女家中有寡妇[a]，她应当供养她们，免得教会受累，好供养那些真正的寡妇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“如果有信主的男人或女人家中有寡妇”，或“如果有信徒家中有寡妇”，使这项吩咐的对象不限于妇女。
    reason: textual_variant
lexical_decisions:
- source_word: τις πιστὴ
  choice: 有信主的妇女
  rationale: πιστή为阴性单数，在本抄本正文中明确指女性；在教牧书信语境中，这里最自然地表示信徒身份，译作“信主的”比“忠信的”更清楚。
- source_word: χήρας
  choice: 寡妇
  rationale: χήρα的复数宾格，指本章所论及、可能需要物质供养的寡妇。
- source_word: ἔχει χήρας
  choice: 家中有寡妇
  rationale: 直译“有寡妇”在现代汉语中关系不够明确；结合本章家庭供养的语境，补出“家中”使表达自然，但不进一步限定具体亲属关系。
- source_word: ἐπαρκείτω / ἐπαρκέσῃ
  choice: 供养
  rationale: ἐπαρκέω在此表示给予足够的实际、物质支持；两处采用同一译词，以保留原文的词汇呼应。
- source_word: βαρείσθω
  choice: 负担重担
  rationale: 被动命令式表示不要使教会承受供养责任；此译保留“重压、负担”的形象，也符合经济支持的上下文。
- source_word: ἡ ἐκκλησία
  choice: 教会
  rationale: 在教牧书信中指基督徒群体或会众；“教会”是现代中文最清楚、通行的对应词。
- source_word: ταῖς ὄντως χήραις
  choice: 那些真正无依无靠的寡妇
  rationale: ὄντως强调符合本章前文所界定状况的寡妇，即独自一人、没有家属供养者；加入“无依无靠”传达语境意义，避免中文“真正的寡妇”被误解为质疑其婚姻身份。
theological_decisions:
- issue: 开头主语的性别
  choice: 具体女性：“有信主的妇女”
  alternative: 按其他抄本传统译作“有信主的男人或女人”，或概括为“有信徒”
  rationale: 所给SBLGNT正文为τις πιστή，πιστή是阴性单数，因此正文保留女性指称；较宽泛的异文放入脚注，不纳入正文。
- issue: “真正的寡妇”的含义
  choice: 译作“真正无依无靠的寡妇”
  alternative: 较形式对应地译作“真正的寡妇”
  rationale: 本章上下文以是否独居、是否有亲属供养来界定教会应承担供养责任的人；此译澄清其处境含义，而不把它理解为婚姻身份真伪的判断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“她就应当”传达第三人称命令式；“家中”仅明确家庭供养语境，不指定寡妇与该妇女的具体亲属关系。脚注标记[a]已置于正文对应位置。
