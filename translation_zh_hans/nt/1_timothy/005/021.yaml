id: 1TI.5.21
reference: 1 Timothy 5:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: διαμαρτύρομαι ἐνώπιον τοῦ θεοῦ καὶ ⸂Χριστοῦ Ἰησοῦ⸃ καὶ τῶν ἐκλεκτῶν ἀγγέλων, ἵνα ταῦτα φυλάξῃς χωρὶς προκρίματος, μηδὲν ποιῶν κατὰ πρόσκλισιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/021.yaml
  text: I solemnly charge you in the presence of God and Messiah Jesus and the chosen angels[a], that you keep these things without prejudice[c][b], doing nothing according to partiality.
translation:
  language: zh_hans
  text: 我在上帝、基督耶稣和蒙拣选的天使[a]面前郑重嘱咐你：要遵守这些事[b]，不可先入为主，也不可因偏袒而行任何事[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被选中的天使”。
    reason: lexical_alternative
  - marker: b
    text: “遵守这些事”也可译为“持守这些事”。“不可先入为主”也可译为“不预先判断”或“不存成见”。
    reason: lexical_alternative
  - marker: c
    text: “因偏袒而行任何事”也可译为“偏向任何一方”。
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμαρτύρομαι
  choice: 郑重嘱咐
  rationale: 该词在书信劝诫中表示严肃而有见证者在场的嘱托；“郑重嘱咐”既保留庄严语气，也符合现代汉语表达。
- source_word: ἐνώπιον
  choice: 在……面前
  rationale: 此处表示在上帝、基督耶稣和天使的临在与见证之下；“在……面前”简洁自然，并保留庄严的见证意味。
- source_word: Χριστοῦ Ἰησοῦ
  choice: 基督耶稣
  rationale: “基督”是现代汉语圣经语境中对 Χριστός 的通行称谓，在此仍具有头衔意味，与“耶稣”连用自然庄重。
- source_word: ἐκλεκτῶν ἀγγέλων
  choice: 蒙拣选的天使
  rationale: ἐκλεκτός 表示被选择、蒙拣选；“蒙拣选”保留其被动含义及神学张力，不进一步说明是谁拣选或为何拣选。
- source_word: ταῦτα
  choice: 这些事
  rationale: 指向上文的相关吩咐，但原文没有将其明确限定为“这些指示”，故采用较宽泛的“这些事”。
- source_word: φυλάξῃς
  choice: 遵守
  rationale: φυλάσσω 在此指忠实持守并实行所吩咐的事；“遵守”比字面的“看守”更符合本段语境。
- source_word: χωρὶς προκρίματος
  choice: 不存成见
  rationale: πρόκριμα 可指预先作出的判断或偏见；“不存成见”在现代汉语中自然，同时避免把该词狭窄处理为正式判决。
- source_word: μηδὲν ποιῶν κατὰ πρόσκλισιν
  choice: 做任何事都不可偏袒
  rationale: πρόσκλισις 指倾向某一方、偏私或偏袒。将希腊语分词结构转为汉语并列劝诫，使句意清楚而不改变其范围。
theological_decisions:
- issue: Χριστός 的译法
  choice: 基督耶稣
  alternative: 弥赛亚耶稣
  rationale: “基督”是简体中文中 Χριστός 最通行、自然且庄重的称谓，在“基督耶稣”这一固定组合中仍保留受膏者头衔的功能；“弥赛亚”更直接显示其希伯来背景，但与“耶稣”这样连用在现代汉语中较不自然。
- issue: ἐκλεκτῶν ἀγγέλων 所指
  choice: 蒙拣选的天使
  alternative: 被选中的天使
  rationale: 原文只称这些天使为“蒙拣选的”，没有解释其拣选的性质、时间或目的，因此译文不作神学扩展。
- issue: 两种司法伦理要求的关系
  choice: 分别译为“不存成见”和“不可偏袒”
  alternative: 合并译为“不偏不倚”
  rationale: πρόκριμα 与 πρόσκλισις 虽语义相近，却分别强调预先判断与倾向某一方；分开表达可保留原文的并列张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“郑重嘱咐”体现宣告的严肃性；冒号后的两项要求清楚对应希腊原文。“蒙拣选”略带圣经语体，但在此比“被选中”更庄重，且仍为普通读者所能理解。
