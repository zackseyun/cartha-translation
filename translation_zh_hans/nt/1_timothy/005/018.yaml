base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/018.yaml
  text: For the Scripture says[a], “You shall not muzzle an ox while it is threshing,” and[b], “The laborer is worthy of his wages.”
translation:
  language: zh_hans
  text: 因为经上说：“牛正在踩谷时，不可给它套上嘴笼[a]。”又说：“做工的人配得他的工钱[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “踩谷”也可译作“打谷”。希腊文分词指牛正在从事脱粒作业。
    reason: lexical_alternative
  - marker: b
    text: “工钱”也可译作“报酬”。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει γὰρ ἡ γραφή
  choice: 因为经上说
  rationale: “因为”体现γάρ与上文的解释关系；“经上”自然表达ἡ γραφή所指具有权威的圣经文字；“说”保留现在时所表达的持续见证。
- source_word: Βοῦν ἀλοῶντα
  choice: 牛在踩谷的时候
  rationale: βοῦς在这里泛指用于农作的牛；ἀλοῶντα指牛正在进行脱粒作业。“踩谷”既呈现古代用牛踏压谷物脱粒的具体情景，也比单说“打谷”更准确。
- source_word: οὐ φιμώσεις
  choice: 不可笼住它的嘴
  rationale: 将具有禁止效力的将来直陈式译为庄重而自然的禁令“不可”；“笼住……的嘴”准确表达给牲畜套嘴笼、使其不能吃食。
- source_word: καί
  choice: 又说
  rationale: καί连接第二句引文；中文用“又说”既体现并列，也清楚表明后面是另一句引语。
- source_word: Ἄξιος ὁ ἐργάτης
  choice: 工人配得
  rationale: ἐργάτης泛指做工的人；“工人”现代、清楚。“配得”保留ἄξιος所表达的应得或相称之意。
- source_word: τοῦ μισθοῦ αὐτοῦ
  choice: 他的工钱
  rationale: μισθός在此是劳动所得的报酬，“工钱”比抽象的“奖赏”准确；“他的”保留希腊文阳性单数形式，同时整句仍可作为一般原则理解。
theological_decisions:
- issue: “经上说”是否统摄两句引文
  choice: 将两句都直接置于“经上说”所引出的陈述之下
  alternative: 只把第一句视为圣经引文，把第二句标为格言或主的话
  rationale: 希腊文本以同一引介语开始，并用καί连接第二句。译文如实保留这种结构，不在翻译中预先裁定其更广泛的正典含义。
- issue: αὐτοῦ的性与数
  choice: 他的工钱
  alternative: 应得的工钱；他们的工钱
  rationale: 原文是阳性单数。保留“他的”忠实反映形式，同时不排除该陈述具有普遍适用性。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。“经上说”“不可”“配得”保留经文引述的正式语体；“踩谷”和“工钱”则使古代农作场景及劳动报酬的含义清楚自然。
