  text: ἐν ἔργοις καλοῖς μαρτυρουμένη, εἰ ἐτεκνοτρόφησεν, εἰ ἐξενοδόχησεν, εἰ ἁγίων πόδας ἔνιψεν, εἰ θλιβομένοις ἐπήρκεσεν, εἰ παντὶ ἔργῳ ἀγαθῷ ἐπηκολούθησεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/010.yaml
  text: 'well attested for good works: if she has raised children[a], if she has shown hospitality, if she has washed the feet of the saints, if she has helped those under affliction[c][b], if she has followed every good work.'
translation:
  language: zh_hans
  text: 因善行而有好名声：她若养育过儿女，若接待过客旅[a]，若洗过圣徒的脚[b]，若救助过受患难的人，若追求各样善事[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “接待客旅”也可译作“接待陌生人”；原文特指把客旅或外来者接到家中款待。
    reason: lexical_alternative
  - marker: b
    text: “圣徒”在这里指属神的圣洁子民，也就是同信的人。
    reason: lexical_alternative
  - marker: c
    text: “追求”直译为“紧随”或“追随”；原文强调主动追求并坚持行善。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἔργοις καλοῖς μαρτυρουμένη
  choice: 因善行有好名声
  rationale: 该分词结构表示别人根据她的善行给她作正面见证；译文保留被他人认可的含义，同时符合现代汉语表达。
- source_word: εἰ
  choice: 若……过
  rationale: 重复的 εἰ 引出一系列资格条件。汉语以一个“若”统领并列动词，避免机械重复而不改变条件结构。
- source_word: ἐτεκνοτρόφησεν
  choice: 养育过儿女
  rationale: 该动词指抚养、培育孩子，并未限定必须是亲生子女；“养育过儿女”自然且保留这一开放性。
- source_word: ἐξενοδόχησεν
  choice: 接待过旅客
  rationale: 该词具体指接纳外来者或客旅，通常包括让其进入家中并予以款待；比笼统的“好客”更贴近词义。
- source_word: ἁγίων πόδας ἔνιψεν
  choice: 洗过圣徒的脚
  rationale: 直译这一具体的谦卑服侍行为，保留其历史文化形态及象征力量。
- source_word: θλιβομένοις ἐπήρκεσεν
  choice: 救助过患难中的人
  rationale: θλιβομένοις 泛指承受压力、困苦或患难的人，不限于受迫害者；ἐπήρκεσεν 表示给予实际援助。
- source_word: παντὶ ἔργῳ ἀγαθῷ ἐπηκολούθησεν
  choice: 竭力行各样善事
  rationale: ἐπακολουθέω 本义为紧随、追随，在伦理语境中表达积极投入和坚持追求。“竭力行”既体现主动追求，又避免生硬的“跟随善事”；παντί 在此译为“各样”，自然表达全面性。
theological_decisions:
- issue: ἁγίων 所指的人群
  choice: 主文译作“圣徒”，脚注说明指属神的圣洁子民，即同信的人
  alternative: 信徒；圣洁的人
  rationale: 保留保罗书信中的重要称谓及其“被分别为圣”的神学内涵，同时用脚注防止现代读者误解为少数具有特殊地位的人。
- issue: ἐτεκνοτρόφησεν 是否限定亲生儿女
  choice: 不限定，译作“养育过儿女”
  alternative: 生养过儿女；抚养过自己的孩子
  rationale: 希腊词强调养育而非生育，也没有明说孩子与她的血缘关系，因此不作额外限定。
- issue: 洗脚是具体行为还是泛指服侍
  choice: 保留具体行为“洗过……的脚”
  alternative: 谦卑服侍过圣徒
  rationale: 原文明确提到洗脚；将其概括为服侍会消除文本的历史文化具体性，并加入解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。各项资格以并列短句呈现，并用“过”表达已经得到见证的生活经历；保留“圣徒”和“洗脚”等关键、具体的原文意象，必要说明置于脚注。
