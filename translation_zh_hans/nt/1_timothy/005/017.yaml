  text: Οἱ καλῶς προεστῶτες πρεσβύτεροι διπλῆς τιμῆς ἀξιούσθωσαν, μάλιστα οἱ κοπιῶντες ἐν λόγῳ καὶ διδασκαλίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/017.yaml
  text: Let the elders who lead well be considered worthy of double honor[c][b][a], especially those who labor in word and teaching.
translation:
  language: zh_hans
  text: 那些带领得好的长老，应当被认为配得加倍的尊荣[a]，尤其是[b]那些在讲道[c]和教导上辛劳的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “加倍的尊荣”也可译作“双重的尊荣”。结合下一节来看，这种尊荣可能既包括敬重，也包括物质上的供养。
    reason: lexical_alternative
  - marker: b
    text: “尤其是”也有人理解为“也就是”，把后面的话看作对这里所说长老的具体说明。
    reason: alternative_reading
  - marker: c
    text: “讲道”原文直译为“话语”或“言语”；这里很可能指言语方面的事奉，如宣讲和教导。
    reason: cultural_note
lexical_decisions:
- source_word: πρεσβύτεροι
  choice: 长老
  rationale: 在《提摩太前书》的语境中，该词指教会中受认可的带领者，并非泛指年长的男子；“长老”是现代中文中清楚而通行的对应词，也不必然带入后世特定的教制。
- source_word: καλῶς προεστῶτες
  choice: 善于带领
  rationale: προΐστημι 在此表示承担领导、照管或督导的职责。“善于带领”自然易懂，保留实际的领导权责，同时避免“统治”可能产生的强硬意味。
- source_word: διπλῆς τιμῆς
  choice: 加倍的尊荣
  rationale: 直译其“加倍”之意，并以“尊荣”保留 τιμή 可涵盖敬重与实际供养的语义范围，不在正文中把它缩减为单纯的尊敬或报酬。
- source_word: ἀξιούσθωσαν
  choice: 应当被看为配得
  rationale: 保留被动命令语气，表达群体应当认可并如此对待这些长老；措辞庄重而符合现代汉语。
- source_word: μάλιστα
  choice: 尤其是
  rationale: 最自然地表示在前述群体中特别受到强调的一类人，同时不强行将其解释为“也就是”。
- source_word: κοπιῶντες
  choice: 劳苦的人
  rationale: κοπιάω 强调付出艰辛努力；“劳苦”简洁、庄重，并保留这种辛劳感。
- source_word: ἐν λόγῳ
  choice: 在传讲上
  rationale: λόγος 在此很可能指言语方面的服事，包括宣讲；“传讲”比生硬的“在话语上”自然，又不把含义限定为某一种正式讲道形式。
- source_word: διδασκαλίᾳ
  choice: 教导
  rationale: “教导”是自然、通俗且准确的译法，既能表示教导活动，也不具有“教义”一词较强的技术色彩。
theological_decisions:
- issue: “加倍的尊荣”对教会带领者所包含的意义
  choice: 正文保留宽泛的“加倍的尊荣”，不限定为尊敬或经济供养中的任何一项。
  alternative: 可译为“加倍的敬重”“双重的尊荣”或明确解释为“尊敬并供养”。
  rationale: 下节明显涉及物质供养，但 τιμή 本身也可指敬重。保留较宽的表达，既符合近处语境，也避免把某种教会制度或薪酬观念写入正文。
- issue: μάλιστα 的语气
  choice: 译作“尤其是”。
  alternative: 译作“也就是”，将后半句视为对全部长老的同位说明。
  rationale: “尤其是”保留最可能的强调作用，也不封闭关于这里是强调长老中的一部分，还是进一步说明所有相关长老的解释空间。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“善于带领”避免过度行政化或强权化；“加倍的尊荣”有意保留尊敬与物质支持之间的语义张力；“传讲和教导”在中文中自然，并通过脚注交代 λόγος 较宽的原文表达。
