id: 1TI.5.13
reference: 1 Timothy 5:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἅμα δὲ καὶ ἀργαὶ μανθάνουσιν, περιερχόμεναι τὰς οἰκίας, οὐ μόνον δὲ ἀργαὶ ἀλλὰ καὶ φλύαροι καὶ περίεργοι, λαλοῦσαι τὰ μὴ δέοντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/013.yaml
  text: At the same time[a], they also learn to be idle, going around from house to house; and not only idle, but also gossips and busybodies[b], saying what they ought not to say.
translation:
  language: zh_hans
  text: 同时，她们还学会了游手好闲，挨家挨户地走动；她们不但游手好闲，而且说长道短[a]、好管闲事[b]，说些不该说的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“说空话”。原文一词可泛指愚妄、空洞的闲谈；在本语境中很可能也包括说人闲话。
    reason: lexical_alternative
  - marker: b
    text: 或译：“爱插手别人的事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα δὲ καὶ
  choice: 同时……还
  rationale: 兼顾同时性和递进补充之意，并自然承接上文。
- source_word: ἀργαὶ
  choice: 游手好闲
  rationale: 表达无所事事、闲懒的状态；两处采用同一译法，以保留原文的重复。
- source_word: μανθάνουσιν
  choice: 学会了
  rationale: 这里指逐渐养成一种习惯，并非接受正式教导；与“游手好闲”连用符合现代汉语表达。
- source_word: περιερχόμεναι τὰς οἰκίας
  choice: 挨家挨户地走动
  rationale: 准确表达在各家之间来回走动的分配性含义，又不过度加入“闲逛”等评价。
- source_word: φλύαροι
  choice: 说长道短
  rationale: 在本语境中指空泛、不谨慎且涉及他人的闲谈；“说长道短”自然地传达闲话或流言的意味，同时以脚注保留较宽泛的词义。
- source_word: περίεργοι
  choice: 好管闲事
  rationale: 表达不当地介入与自己无关之事，符合该词在本句中的贬义。
- source_word: λαλοῦσαι
  choice: 说
  rationale: 采用简洁的一般言说动词，与后面的宾语性短语自然衔接。
- source_word: τὰ μὴ δέοντα
  choice: 些不该说的话
  rationale: δέοντα涉及合宜或应当之事；结合λαλοῦσαι，明确这里所指的是不合宜的言语。
theological_decisions:
- issue: 阴性复数形式所指的性别与对象
  choice: 她们
  alternative: 这些妇女
  rationale: 原文的形容词和分词均为阴性复数，语境所指是上文谈到的年轻寡妇；使用“她们”既保持性别准确，也避免不必要地重复身份称谓。
- issue: “学会”与“游手好闲”的句法关系
  choice: 她们还学会了游手好闲
  alternative: 她们还成了闲懒的人
  rationale: 保留μανθάνουσιν“学习、学会”的措辞及其可能带有的习惯养成意味，不把过程改写成单纯的身份判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“游手好闲”保留原文两次ἀργαὶ的重复；“说长道短”和“好管闲事”为自然且仍具书面尊严的表达。脚注标记紧随各自对应的词语，避免把词义说明误附于句首。
