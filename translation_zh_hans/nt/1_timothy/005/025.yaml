  text: ὡσαύτως καὶ τὰ ⸂ἔργα τὰ καλὰ⸃ ⸀πρόδηλα, καὶ τὰ ἄλλως ἔχοντα κρυβῆναι οὐ δύνανται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/025.yaml
  text: Likewise also[a], good works are evident, and those that are otherwise cannot remain hidden.
translation:
  language: zh_hans
  text: 同样地，善行也显而易见；那些情况不同的行为[a]也不能被隐藏。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那些不同的行为”或“那些不是这样的行为”。有人根据上一节的类比，认为这里特指恶行。
    reason: 说明原文含蓄表达的可译范围，并保留是否特指恶行的解释空间。
lexical_decisions:
- source_word: ὡσαύτως καί
  choice: 同样……也
  rationale: 既承接上一节，又在汉语中自然体现ὡσαύτως与καί所形成的平行关系。
- source_word: ἔργα τὰ καλά
  choice: 善行
  rationale: 简洁、自然地表达具有良善性质的行为，也符合保罗书信的伦理语境。
- source_word: πρόδηλα
  choice: 显而易见
  rationale: 表达公开可见、明显可知之意，并与后文“隐藏”形成清楚对照。
- source_word: τὰ ἄλλως ἔχοντα
  choice: 那些并非如此的行为
  rationale: 保留原文含蓄的对比，不擅自断定这些行为必然是恶行；“如此”可指并非同样显而易见，也容许语境中更强的道德对比。
- source_word: κρυβῆναι οὐ δύνανται
  choice: 也无法隐藏
  rationale: 直接传达“不能被隐藏”的意思，中文简洁自然，并保留这些行为终究不会隐而不显的语境含义。
theological_decisions:
- issue: τὰ ἄλλως ἔχοντα是特指恶行，还是泛指情形不同、尚不明显的行为
  choice: 采用较宽泛的“那些并非如此的行为”
  alternative: 明确译作“恶行”
  rationale: 希腊文没有明说“恶”，而是以含蓄表达与前面的善行相对。正文保留这种歧义，脚注说明按上一节类比理解为恶行的可能性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“显而易见”与“无法隐藏”构成自然对照；分号呈现原文两个并列分句。
