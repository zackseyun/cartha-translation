id: 1TI.5.14
reference: 1 Timothy 5:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: βούλομαι οὖν νεωτέρας γαμεῖν, τεκνογονεῖν, οἰκοδεσποτεῖν, μηδεμίαν ἀφορμὴν διδόναι τῷ ἀντικειμένῳ λοιδορίας χάριν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/014.yaml
  text: Therefore I want younger widows to marry[a], to bear children, to manage their households[b], and to give the opponent no opportunity for slander.
translation:
  language: zh_hans
  text: 所以，我愿年轻的寡妇结婚[a]，生儿育女，操持家务，不给敌对者[b]任何毁谤的机会。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文只说“结婚”；由于这里谈的是寡妇，按上下文就是再婚。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“仇敌”；这里可能是指撒但。
    reason: alternative_reading
lexical_decisions:
- source_word: βούλομαι
  choice: 我愿
  rationale: 表达保罗本人的意愿或主张；“我愿”简洁庄重，并保留第一人称的意志色彩。
- source_word: οὖν
  choice: 所以
  rationale: 承接上文并引出推论；“所以”比“因此”更符合现代汉语经文的自然表达，同时清楚保留逻辑关系。
- source_word: νεωτέρας
  choice: 年轻的寡妇
  rationale: 该词本身意为“较年轻的女性”，但本段上下文明确讨论寡妇，因此补出“寡妇”，避免把所指范围误扩展到所有年轻女性。
- source_word: γαμεῖν
  choice: 结婚
  rationale: 原词只表达“结婚”，并未明说“再婚”；因对象是寡妇，再婚之意可由上下文推知，脚注加以说明。
- source_word: τεκνογονεῖν
  choice: 生儿育女
  rationale: 原词指生育儿女；“生儿育女”是自然、庄重的现代汉语表达，也能体现建立家庭和养育子女的语境。
- source_word: οἰκοδεσποτεῖν
  choice: 操持家务
  rationale: 该动词表示负责料理、管理家庭事务；“操持家务”体现主动承担家庭管理责任，又避免译成过强的“统治家庭”。
- source_word: μηδεμίαν ἀφορμὴν διδόναι
  choice: 不给……任何……的机会
  rationale: 保留“不给任何机会或可乘之机”的含义，汉语句式自然清楚。
- source_word: τῷ ἀντικειμένῳ
  choice: 敌对者
  rationale: 原文是“敌对、反对的那一位”，单数所指并不明确；“敌对者”既可指敌意批评者，也不排除指撒但的可能。
- source_word: λοιδορίας χάριν
  choice: 毁谤的机会
  rationale: 该短语表示借机辱骂、诋毁或毁谤；结合ἀφορμή译作“毁谤的机会”，准确表达敌对者借题攻击的意思。
theological_decisions:
- issue: τῷ ἀντικειμένῳ所指为何
  choice: 正文译为泛指且保持开放的“敌对者”
  alternative: 译作“仇敌”，并明确理解为撒但
  rationale: 希腊文没有直接点明撒但，眼前语境也可能指寻找把柄、公开诋毁信徒的敌意人士；正文不将歧义提前消除，脚注保留可能指撒但的解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“生儿育女”和“操持家务”符合汉语习惯；正文保留“敌对者”所指的开放性。所有脚注标记均放在对应词语之后。
