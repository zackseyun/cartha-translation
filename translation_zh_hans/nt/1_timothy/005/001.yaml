id: 1TI.5.1
reference: 1 Timothy 5:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Πρεσβυτέρῳ μὴ ἐπιπλήξῃς, ἀλλὰ παρακάλει ὡς πατέρα, νεωτέρους ὡς ἀδελφούς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/001.yaml
  text: Do not rebuke an older man[a], but appeal to him as a father, and to younger men as brothers,
translation:
  language: zh_hans
  text: 不要严厉斥责年长的男子[a]，却要把他当作父亲来劝；对年轻的男子，要当作弟兄来劝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要严厉斥责长老。”希腊语这个词既可指“年长的男子”，也可指教会的“长老”；但上下文按年龄和性别所作的对照更支持前一种理解。
    reason: 保留原词可能指教会职分的另一种读法，同时说明正文选择年龄含义的语境依据。
lexical_decisions:
- source_word: Πρεσβυτέρῳ
  choice: 年长的男子
  rationale: 该词在此为名词化的阳性单数形容词，并与同节的 νεωτέρους（年轻的男子）形成对照；下一节又按年龄和性别继续列举，因此这里以年龄含义最自然，而非教会职分“长老”。
- source_word: μὴ ἐπιπλήξῃς
  choice: 不要严厉斥责
  rationale: ἐπιπλήσσω 带有以言语猛烈责难、痛斥的意味。“严厉斥责”既表达其较强语气，也与后面的劝说方式形成清楚对比。
- source_word: ἀλλὰ παρακάλει
  choice: 倒要劝他
  rationale: παρακαλέω 可表示劝勉、劝告、请求或鼓励。此处与严厉斥责相对，又配合家庭关系的比喻，译作“劝”简洁自然，并保留较宽的语义范围；宾语“他”由上下文补明。
- source_word: ὡς πατέρα
  choice: 如同劝父亲
  rationale: ὡς 表示比较。汉语补出重复的“劝”，使关系明确，表达应以对待父亲的尊重来劝年长者。
- source_word: νεωτέρους
  choice: 年轻的男子
  rationale: 这是名词化的阳性复数形容词；紧接着的 ἀδελφούς 也是阳性复数，且下一节另行提到女性，因此保留性别明确的表达。
- source_word: ὡς ἀδελφούς
  choice: 如同劝弟兄
  rationale: 此处按年龄和性别分组，ἀδελφούς 特指男性，故译为“弟兄”，不扩展为“弟兄姊妹”，也不添加原文未明说的“主内”等限定。
theological_decisions:
- issue: Πρεσβυτέρῳ 是指教会职分“长老”，还是指年长男性
  choice: 按年龄理解为“年长的男子”
  alternative: “长老”
  rationale: 本节及下一节依次形成“年长男子／父亲、年轻男子／弟兄、年长女子／母亲、年轻女子／姊妹”的对称结构，因此年龄含义更符合语境。不过希腊词本身也可指教会长老，故以脚注保留这一可能。
- issue: ἀδελφούς 是否采用包容性译法
  choice: “弟兄”
  alternative: “弟兄姊妹”
  rationale: 这里并非泛指全体信徒，而是与下一节女性群体相对应的男性类别；保留阳性表达更准确。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“年长的男子／年轻的男子”准确呈现年龄与性别类别；“倒要”清楚表达 ἀλλά 的转折。“劝他如同劝父亲”以适度补词形成自然汉语，并避免把 παρακαλέω 过窄地限定为命令、安慰或请求。
