base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/019.yaml
  text: Do not accept an accusation against an elder[b][a], except on the basis of two or three witnesses.
translation:
  language: zh_hans
  text: 不可受理对长老[a]的控告，除非有两三个见证人[b]作证。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “长老”或译“年长的男子”；原词既可指教会中的长老，也可按年龄指年长者。
    reason: alternative_reading
  - marker: b
    text: “两三个见证人”沿用旧约的法律原则：一件事须凭两三个见证人的口才可成立（参申命记19:15）。
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ πρεσβυτέρου
  choice: 控告长老的事
  rationale: πρεσβύτερος在本段有关教会治理和劝戒的语境中最可能指承担带领职责的“长老”；κατά与κατηγορίαν合用，表示针对某人的控告。
- source_word: κατηγορίαν
  choice: 控告
  rationale: 该词指指控或罪状，带有正式、程序性的意味；“控告”在现代汉语中清楚而庄重。
- source_word: μὴ παραδέχου
  choice: 不要受理
  rationale: 该命令不是简单要求不要相信，而是不要接纳并进入处理程序；“受理”准确传达这种程序性含义。
- source_word: ἐκτὸς εἰ μὴ
  choice: 除非
  rationale: 这一固定表达引出例外条件，“除非”在汉语中简洁自然。
- source_word: ἐπὶ δύο ἢ τριῶν μαρτύρων
  choice: 有两三个见证人作证
  rationale: ἐπί在这里表达证据基础；此译法自然呈现必须由两三名见证人提供证言的法律原则，同时避免生硬直译。
theological_decisions:
- issue: πρεσβυτέρου在本节是职分称谓还是年龄称谓
  choice: 长老，即教会中的带领者
  alternative: 年长的男子
  rationale: 紧邻语境涉及长老的尊荣、教导和犯罪后的责备，因此职分意义更可能；但原词确实也可按年龄理解，故以脚注保留这一可能。
translation_notes:
  register: 采用现代、庄重而易懂的法律程序用语。“受理”比“接受”更能表达παραδέχου在此处对控告进入审理程序的限制。脚注标记按相关短语的顺序置于正文末，正文中完整出现[a]、[b]。
