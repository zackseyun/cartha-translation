id: 1TI.5.23
reference: 1 Timothy 5:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μηκέτι ὑδροπότει, ἀλλὰ οἴνῳ ὀλίγῳ χρῶ διὰ τὸν ⸀στόμαχον καὶ τὰς πυκνάς σου ἀσθενείας.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/023.yaml
  text: No longer drink only water[a], but use a little wine because of your stomach and your frequent illnesses.
translation:
  language: zh_hans
  text: 不要再只喝水[a]；要因你的胃和你常有的病痛，用一点酒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更直译为：“不要再作一个喝水的人。”这里是说，不要继续只喝水。
    reason: 说明ὑδροπότει的字面表达及语境中所含的“只喝水”之意。
lexical_decisions:
- source_word: μηκέτι
  choice: 不要再
  rationale: 表达停止先前持续做法的命令语气，符合现代汉语习惯。
- source_word: ὑδροπότει
  choice: 只喝水
  rationale: 该动词本义是“喝水”；结合ἀλλά所引出的对比，语境指不再仅仅喝水，而不是完全停止饮水。
- source_word: ἀλλὰ
  choice: 要
  rationale: 在“不要……要……”结构中自然表达强烈转折；其对比功能由整句句式清楚体现。
- source_word: οἴνῳ ὀλίγῳ
  choice: 一点酒
  rationale: 保留οἶνος的具体所指“酒”和ὀλίγος所表达的少量、节制之意。
- source_word: χρῶ
  choice: 用
  rationale: χράομαι意为“使用、采用”；译作“用”既贴近原文，也不额外限定其用途或饮用方式。
- source_word: διὰ
  choice: 因
  rationale: διά接宾格在此表示原因，“因”简洁准确。
- source_word: στόμαχον
  choice: 胃
  rationale: 采用普通、直接的现代汉语身体部位名称，不扩展为较宽泛的“消化系统”。
- source_word: πυκνάς
  choice: 屡次
  rationale: 表达反复、频繁发生，与患病自然搭配。
- source_word: ἀσθενείας
  choice: 患病
  rationale: 在胃部问题和用酒的身体健康语境中，指反复出现的疾病或不适；动词化处理使中文自然，同时保留身体病弱的含义。
theological_decisions:
- issue: 是否明说提摩太先前只喝水
  choice: 不要再只喝水
  alternative: 不要再喝水
  rationale: 与后面的“用一点酒”形成对照，表明所停止的是只喝水的做法，而非完全禁止饮水；这样可避免中文误读。
- issue: 是否把οἶνος直译为酒
  choice: 酒
  alternative: 药酒／有酒精的饮料
  rationale: 原文明确使用οἶνος，不应因文化或教义考虑而淡化、专门化或扩展；“一点”已保留数量上的节制。
- issue: 是否把用酒明确解释为医疗处方
  choice: 保留“因你的胃和屡次患病”的因果关系，不另加“治病”
  alternative: 喝一点酒治病
  rationale: 原文说明原因，却没有明确使用“治疗”一词；译文保留其健康语境，同时避免超出文本断定具体医疗机制。
translation_notes:
  register: 采用现代、庄重而易懂的劝告语气。“不要再……要……”清楚呈现原文的命令与转折；“稍微用一点酒”保留χρῶ“使用”的措辞，同时避免把本节改写成一般性的饮酒许可。
