  text: And command these things[b][a], so that they may be above reproach.
translation:
  language: zh_hans
  text: 你也要就这些事作出吩咐，使他们可以无可指责。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: 也要
  rationale: 承接上文并推进劝令；“也要”自然体现并列联系，不额外加强语气。
- source_word: ταῦτα
  choice: 这些事
  rationale: 保留中性复数指示词对前述及相关指示的概括，避免具体化为“这些规定”。
- source_word: παράγγελλε
  choice: 吩咐
  rationale: 现在时命令式表达持续作出具有权威性的指示；“吩咐”在现代汉语中自然，并保留其权威力度。
- source_word: ἵνα
  choice: 好使
  rationale: 清楚引出目的或预期结果，符合庄重而自然的现代汉语。
- source_word: ἀνεπίλημπτοι
  choice: 无可指责
  rationale: 表达没有正当把柄、经得起责难，并避免“毫无过错”可能带来的绝对化含义。
- source_word: ὦσιν
  choice: 他们
  rationale: 汉语需补出复数主语；采用泛指代词，但不在正文中限定其具体所指。
theological_decisions:
- issue: ἵνα从句中隐含复数主语的所指
  choice: 正文用“他们”，不明确限定具体群体
  alternative: 明确译为前文所谈的寡妇及其家人，或理解为更广泛的教会群体
  rationale: 希腊文没有明说主语。上下文最可能指前述指示所涉及的人，尤其寡妇及其家人；但为保留原文的含混性，正文不作进一步限定。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“吩咐”保留命令的权威性；“无可指责”准确表达伦理上不留下正当责难把柄。两个“他们”分别是汉语补出的受词和原文隐含的复数主语，借脚注加以区分。
