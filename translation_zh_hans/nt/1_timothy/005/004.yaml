id: 1TI.5.4
reference: 1 Timothy 5:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰ δέ τις χήρα τέκνα ἢ ἔκγονα ἔχει, μανθανέτωσαν πρῶτον τὸν ἴδιον οἶκον εὐσεβεῖν καὶ ἀμοιβὰς ἀποδιδόναι τοῖς προγόνοις, τοῦτο γάρ ἐστιν ἀπόδεκτον ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/004.yaml
  text: But if any widow has children or grandchildren[a], let them first learn to show godliness to their own household and to repay their forebears[c][b], for this is acceptable before God.
translation:
  language: zh_hans
  text: 但寡妇若有儿女或孙辈[a]，他们就要先学习在自己的家中践行敬虔[b]，回报自己的长辈[c]；因为这样做在上帝面前是蒙悦纳的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“儿女或后代”。希腊语ἔκγονα的范围可比“孙辈”更广；在这里的家庭照料语境中，可能特别指孙辈。
    reason: lexical_alternative
  - marker: b
    text: 或译“向自己的家实践敬虔”。原文把对家庭的照料责任与敬虔联系起来。
    reason: lexical_alternative
  - marker: c
    text: 或译“父母”或“祖辈”。希腊语原意为“先辈”或“前代的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: 寡妇
  rationale: 本段持续谈论丈夫去世的妇女，“寡妇”是现代汉语中准确、通行的对应词。
- source_word: τέκνα ἢ ἔκγονα
  choice: 儿女或孙辈
  rationale: τέκνα指儿女；ἔκγονα可泛指后代，但在本节家庭照料的语境中，很可能指下一代后裔，即孙辈。脚注保留其较宽的词义。
- source_word: μανθανέτωσαν
  choice: 他们就要先学习
  rationale: 第三人称复数现在时命令语气，主语最自然地承接“儿女或孙辈”；“就要”保留命令力度，“学习”对应μανθάνω。
- source_word: πρῶτον
  choice: 先
  rationale: 表示优先次序，即敬虔首先应在家庭责任中得到实践。
- source_word: τὸν ἴδιον οἶκον
  choice: 自己的家人
  rationale: οἶκος在此指家庭或家人，而非单指房屋；“自己的”体现ἴδιον。
- source_word: εὐσεβεῖν
  choice: 尽敬虔的本分
  rationale: 既保留该词的敬虔、虔敬含义，也以自然汉语表明这种敬虔落实为对家人的照料与责任。
- source_word: ἀμοιβὰς ἀποδιδόναι
  choice: 报答
  rationale: 该短语表示回报所得的恩惠；在这里是儿孙回报父母祖辈先前的养育照顾。
- source_word: τοῖς προγόνοις
  choice: 父母祖辈
  rationale: πρόγονοι泛指前辈或祖先；本节所说的是仍在家庭照料范围内的上一代，可能包括父母和祖父母。“父母祖辈”既自然，又不把所指限于单一辈分。
- source_word: ἀπόδεκτον
  choice: 蒙悦纳的
  rationale: 表达这种行为得到上帝认可和接纳；“蒙悦纳”符合庄重而通俗的圣经语体。
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: 在上帝面前
  rationale: 贴近原文惯用语，表示处于上帝的鉴察和评判之下。
theological_decisions:
- issue: 复数命令语气μανθανέτωσαν的所指
  choice: 命令针对寡妇的儿女或孙辈
  alternative: 命令针对寡妇，视为数的转换或省略了主语
  rationale: 最近且语法上最自然的复数先行词是τέκνα ἢ ἔκγονα；这也符合下文由后辈照料家人、报答上一代的内容。
- issue: εὐσεβεῖν与家庭照料的关系
  choice: 家庭责任是敬虔的具体实践
  alternative: 该词只表示履行家庭义务，基本不带宗教含义
  rationale: εὐσεβεῖν本身具有明确的虔敬含义，而且经文以“在上帝面前蒙悦纳”为依据，因此译文同时保留其属灵维度和实际家庭责任。
- issue: τοῖς προγόνοις所涵盖的对象
  choice: 保留父母及祖辈的宽泛范围
  alternative: 只译作“父母”或泛化为所有“祖先”
  rationale: 原词可指先辈或祖先，而语境聚焦于家中需要实际照料的上一代；“父母祖辈”避免只限于父母，也避免让人误以为仅指已故祖先。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“尽敬虔的本分”保留宗教含义，同时使其与家庭责任的实际语境自然结合；“父母祖辈”避免“先人”在现代汉语中常指死者的歧义。所有脚注标记均在正文中按[a]、[b]、[c]出现。
