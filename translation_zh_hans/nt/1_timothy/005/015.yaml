  yaml_path: translation/nt/1_timothy/005/015.yaml
  text: For some have already turned aside to follow Satan.
translation:
  language: zh_hans
  text: 因为有些人已经偏离，转而跟随撒但了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为有些人已经偏离，转到撒但后面去了。”
    reason: 保留ὀπίσω τοῦ Σατανᾶ较为字面的“在撒但后面／跟在撒但之后”的空间意象。
lexical_decisions:
- source_word: ἤδη
  choice: 已经
  rationale: 保留时间副词的意义，表明这种偏离在当时已经发生。
- source_word: γάρ
  choice: 因为
  rationale: 承接上文并说明前述指示的理由；现代汉语中“因为”自然地表达其解释性连接作用。
- source_word: τινες
  choice: 有人
  rationale: 表达不确定的一部分人，不额外限定其身份或人数。
- source_word: ἐξετράπησαν
  choice: 偏离正道
  rationale: 保留离开正确道路的比喻；“正道”属于为使汉语语义完整而作的明示，并不加入被他人诱导的含义。
- source_word: ὀπίσω τοῦ Σατανᾶ
  choice: 跟随撒但去了
  rationale: ὀπίσω加属格字面为“在……后面／跟在……之后”，此处表达转而跟随撒但；“去了”与“偏离”相呼应，呈现方向和结果。
- source_word: Σατανᾶ
  choice: 撒但
  rationale: 采用现代中文圣经语境中通行的人名／称号译写。
theological_decisions:
- issue: ὀπίσω τοῦ Σατανᾶ应直译为“在撒但后面”，还是按其语境表达为“跟随撒但”。
  choice: 跟随撒但去了
  alternative: 转到撒但后面去了
  rationale: 原文保留了行路方向的意象，同时语境指向跟随或归附；正文采用自然汉语传达此意，脚注保留更贴近字面的表达，避免把隐喻的细节完全抹平。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“偏离正道”保留道路隐喻，“跟随撒但去了”自然表达行动的方向与现今结果；不进一步说明这种跟随的具体性质，以保存原文的简洁和张力。
