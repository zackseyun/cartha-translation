  text: ⸀τοὺς ἁμαρτάνοντας ἐνώπιον πάντων ἔλεγχε, ἵνα καὶ οἱ λοιποὶ φόβον ἔχωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/020.yaml
  text: Rebuke those who are sinning before everyone[b][a], so that the rest also may have fear.
translation:
  language: zh_hans
  text: 要在众人面前责备那些犯罪的人[b][a]，使其余的人也有所惧怕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些持续犯罪的人”；现在时分词可能暗示持续的犯罪行为。
    reason: lexical_alternative
  - marker: b
    text: 紧接上文来看，这里可能特别指犯罪的长老；但本节本身只说“那些犯罪的人”。
    reason: cross_reference
lexical_decisions:
- source_word: τοὺς ἁμαρτάνοντας
  choice: 那些正在犯罪的人
  rationale: 该现在时实词化分词直译为“那些正在犯罪的人”，自然表达正在发生或持续的行为；“执意犯罪的人”更强调持续性，略带解释性，故列入脚注。
- source_word: ἐνώπιον πάντων
  choice: 在众人面前
  rationale: 贴近原文“在所有人面前”，同时是现代汉语中自然、清楚的公开场合表达。
- source_word: ἔλεγχε
  choice: 责备
  rationale: ἐλέγχω可指揭露、指出过错或责备；在纪律劝诫的语境中，“责备”既自然，又保留纠正过犯的重点。
- source_word: οἱ λοιποὶ
  choice: 其余的人
  rationale: 保留原文未明确限定对象的概括表达，指犯罪者之外的其他人。
- source_word: φόβον ἔχωσιν
  choice: 有所惧怕
  rationale: 保留“有惧怕”的词义，不把它限定为单纯的惊恐或敬畏；“有所”使现代汉语表达更自然。
theological_decisions:
- issue: 本节所说犯罪者的范围
  choice: 正文仅译为“那些正在犯罪的人”，不明加“长老”。
  alternative: 紧接上文第19节，有人认为这里特指犯罪的长老；也有人把原则广泛用于教会纪律。
  rationale: 本节希腊文本本身只说“那些正在犯罪的人”，但上下文确实正在谈论长老。正文保留原文的宽泛措辞，脚注说明语境所提供的较窄理解，以保存这一张力。
- issue: φόβος的性质
  choice: 译为“惧怕”，不进一步限定为敬畏或恐惧。
  alternative: 可按劝戒效果理解为警惕、敬畏，或因惩戒而害怕。
  rationale: 原文只说“有惧怕”，其具体性质并未明说；采用较开放的译法，避免替文本作神学限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在众人面前责备”兼顾原文形式与汉语自然度；脚注标记按正文相关信息的出现顺序置于“他们”之后，并保留用户资料中的[b][a]次序。
