id: 1TI.5.8
reference: 1 Timothy 5:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰ δέ τις τῶν ἰδίων καὶ ⸀μάλιστα οἰκείων οὐ ⸀προνοεῖ, τὴν πίστιν ἤρνηται καὶ ἔστιν ἀπίστου χείρων.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/008.yaml
  text: But if anyone does not provide for his own[a], and especially for members of his household[b], he has denied the faith and is worse than an unbeliever.
translation:
  language: zh_hans
  text: 但若有人不供养自己的亲属[a]，尤其不供养自己家里的人，他就是背弃了信仰[b]，比不信的人还不如。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “自己的亲属”原文直译为“自己的人”，可包括亲属及自己负有照顾责任的人；下句“自己家里的人”是其中尤其应当照顾的一部分。
    reason: 说明两个近义短语之间由宽到窄的关系。
  - marker: b
    text: “背弃了”也可译作“否认了”。
    reason: 保留ἤρνηται在行为性背弃与直接否认之间的表达幅度。
lexical_decisions:
- source_word: τῶν ἰδίων
  choice: 自己的亲属
  rationale: 该短语指属于自己这一方的人，即自己的亲属或有责任照顾的人，范围比同住的一家人更广；译作“自己的亲属”既自然，也保留了与后句范围递进的关系。
- source_word: μάλιστα
  choice: 尤其
  rationale: 突出较大群体中责任格外直接的一部分，与后面的“自己家里的人”自然衔接。
- source_word: οἰκείων
  choice: 自己家里的人
  rationale: 指属于某人家庭或家户的人，较“家人”更能保留家户成员这一具体含义。
- source_word: προνοεῖ
  choice: 供养
  rationale: 本段语境涉及对寡妇及家人的实际生活保障；“供养”准确传达预先顾念并提供生活所需的责任。
- source_word: τὴν πίστιν
  choice: 信仰
  rationale: 此处指当事人所承认的基督信仰，而非泛指信任或忠诚。现代汉语中“信仰”比“这信”更自然。
- source_word: ἤρνηται
  choice: 背弃了
  rationale: 完成时表达已经作出否认且其结果仍然成立；“背弃了”能自然传达行为上否认、抛弃自己所承认之信仰的严肃含义。
- source_word: ἀπίστου
  choice: 不信的人
  rationale: 在此对比中指没有这信仰的人；“不信的人”清楚自然，又不额外加入身份标签。
- source_word: χείρων
  choice: 还不如
  rationale: 表达道德评价上的比较，语气有力而符合现代汉语习惯。
theological_decisions:
- issue: τὴν πίστιν所指为何
  choice: 理解为当事人所承认的基督信仰
  alternative: 理解为个人的信心或忠诚
  rationale: 定冠词及教牧书信中的常见用法支持“所承认的信仰”；经文强调，不履行供养责任在行为上等于背弃其信仰宣认。
- issue: ἤρνηται是言语否认还是行为背弃
  choice: 译作“背弃了”，涵盖由行为显出的否认
  alternative: 译作“否认了”
  rationale: 上下文谈的是不供养家人的实际行为。“背弃”保留否认信仰的严重性，也避免使读者误以为这里只指口头否认。
- issue: 泛指结构的性别范围
  choice: 用“有人……自己的”表达不限性别的普遍对象
  alternative: 显式译为“任何男人……他的”
  rationale: 希腊语τις在这里具有泛指作用，经文义务适用于任何负有相关责任的人；现代汉语无需借助阳性代词表达这种泛指。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“供养”呼应本段对寡妇生活保障的具体语境；通过“亲属—自己家里的人”的递进，保留原文两个群体范围上的区别。
