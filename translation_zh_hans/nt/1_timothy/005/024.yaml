- from: 有些人的罪是显而易见的[a]，先他们而到审判那里[b]；但另一些人的罪却随后才显露。
  to: 有些人的罪是显而易见的[a]，先于他们到达审判之处[b]；另一些人的罪却随后跟来。
  rationale: 修订使中文更自然，同时更严格地保留原文的拟人化行进图像和末句的语义开放性。没有把“跟随”具体化为“显露”，也没有在正文中判定κρίσις究竟是当前考察还是终末审判。
