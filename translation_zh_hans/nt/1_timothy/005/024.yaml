source:
  edition: SBLGNT
  text: Τινῶν ἀνθρώπων αἱ ἁμαρτίαι πρόδηλοί εἰσιν, προάγουσαι εἰς κρίσιν, τισὶν δὲ καὶ ἐπακολουθοῦσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/024.yaml
  text: The sins of some people are obvious[a], going before them to judgment[b], but for others they follow after.
translation:
  language: zh_hans
  text: 有些人的罪是显而易见的[a]，先于他们到达审判之处[b]；另一些人的罪却随后跟来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “显而易见”或译“明显”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“审判”在上下文中可以指当下对人的考察和评断，也可能含有更广的上帝审判之意。
    reason: alternative_reading
lexical_decisions:
- source_word: Τινῶν ἀνθρώπων αἱ ἁμαρτίαι
  choice: 有些人的罪
  rationale: 按希腊语属格关系直译为罪属于某些人；ἄνθρωπος在此泛指人，不限定性别。
- source_word: πρόδηλοί
  choice: 显而易见
  rationale: 表达罪已经公开、明显可见的意思，现代汉语自然清楚。
- source_word: προάγουσαι
  choice: 先他们而到
  rationale: 分词与“罪”一致，并把罪拟人化为走在当事人前面；补出语境隐含的“他们”，使中文关系清楚。
- source_word: εἰς κρίσιν
  choice: 到审判那里
  rationale: 保留εἰς的方向性及原文“走向审判”的形象，同时不限定审判的具体性质。
- source_word: τισὶν δὲ καὶ ἐπακολουθοῦσιν
  choice: 但另一些人的罪却随后才显露
  rationale: 延续“罪”为主语；“随后”体现ἐπακολουθέω的跟随、后来出现之意，“才显露”使省略关系在中文中自然可懂，但不把何时显露说得过细。
theological_decisions:
- issue: κρίσις所指的审判范围
  choice: 笼统译作“审判”
  alternative: 当前教会对人选的考察；末后的神圣审判
  rationale: 上下文涉及对人、尤其对领袖人选的审慎评估，但该词也可承载更广的神圣审判含义，因此不在正文中消除这种张力。
- issue: 末句罪如何“随后”
  choice: 表达为罪后来才显露
  alternative: 严格保留拟人说法，译作“却跟在后面”
  rationale: 原文以罪为主语并延续前句的行进形象；中文若只说“跟在后面”容易不清楚，因此适度显明其语用含义，同时以脚注之外的简洁措辞避免过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“先他们而到审判那里”刻意保留原文把罪拟人化并走在当事人前面的形象；末句稍作显化，以免现代中文读者误解主语。
