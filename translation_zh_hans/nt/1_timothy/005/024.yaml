review_pass:
  verdict: revise
  source_fidelity: 正文前半准确表达了“有些人的罪”及其公开显明的状态，也保留了罪先于当事人走向审判的拟人图像。可是“先他们而到审判那里”不合现代汉语；末句的“随后才显露”把ἐπακολουθοῦσιν（跟随、随后而来）解释为“显露”，增添了原文未明说的意思，且削弱了前后连贯的行进拟人法。
  naturalness: “先他们而到审判那里”语序生硬，且“审判那里”搭配不自然。“先于他们到达审判之处”虽保留图像，中文更通顺；“随后跟来”则能自然延续以“罪”为主语的拟人表达。
  terminology: “罪”“审判”“有些人”均恰当。“神圣审判”不是现代标准汉语中最自然的表述，脚注宜改为“上帝的审判”或“神的审判”。为不预设特定神学传统，采用较中性的“上帝的审判”。
  issues:
  - severity: medium
    issue: “先他们而到审判那里”不自然。
    rationale: 该表达逐字摹仿原文方向性，却不符合现代汉语常规。改作“先于他们到达审判之处”可保留罪先行、走向审判的形象。
  - severity: medium
    issue: 末句“随后才显露”过度解释ἐπακολουθοῦσιν。
    rationale: 原文说罪“随后跟随/跟来”，并未直接说罪此时才显露。译为“随后跟来”既保留省略和拟人，也避免将一种可能的语用含义写入正文。
  - severity: low
    issue: 脚注中的“神圣审判”措辞不够自然。
    rationale: “上帝的审判”是现代汉语更常用、清楚的表达，并仍只作为可能的较广理解提出。
  revised_text: 有些人的罪是显而易见的[a]，先于他们到达审判之处[b]；另一些人的罪却随后跟来。
