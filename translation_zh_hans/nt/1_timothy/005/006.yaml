  yaml_path: translation/nt/1_timothy/005/006.yaml
  text: But she who lives for pleasure is dead even while she lives[a].
translation:
  language: zh_hans
  text: 但那贪图享乐的女人，虽然活着，却已经死了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “贪图享乐”也可译作“放纵自己”。
    reason: lexical_alternative
lexical_decisions:
- source_word: σπαταλῶσα
  choice: 贪图享乐
  rationale: 该现在分词表示持续沉溺于安逸享乐、自我放纵的生活方式，而非一般意义上的享受；“贪图享乐”自然易懂，也保留其负面意味及持续性的生活取向。
- source_word: ζῶσα
  choice: 虽然活着
  rationale: 该分词与后面的完成时动词形成让步性的悖论；“虽然活着”清楚表达肉身仍活着与另一意义上的死亡之间的张力。
- source_word: τέθνηκεν
  choice: 已经死了
  rationale: 完成时强调死亡所造成的现存状态；“已经死了”兼顾先前发生及当前结果，又不在正文中明确限定这是属灵、道德或社会意义上的死亡。
- source_word: ἡ ... σπαταλῶσα
  choice: 那贪图享乐的女人
  rationale: 阴性单数冠词加分词作名词使用。上下文谈论寡妇，但本句没有重复“寡妇”；译作“女人”保留阴性指称，同时避免过度补明。
- source_word: δὲ
  choice: 但
  rationale: δέ与前文那仰望神、恒切祈求的真寡妇形成对比，“但”准确标示这一转折。
theological_decisions:
- issue: “死了”的性质
  choice: 保留比喻性的死亡，不在正文中进一步界定
  alternative: 明确译为“在灵性上已经死了”或“在道德上已经死了”
  rationale: “虽然活着，却已经死了”是刻意形成的悖论，表明并非肉身死亡，但原文没有进一步限定其性质。直译这一张力可避免加入超出经文的教义说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“贪图享乐”较“纵欲”宽泛，也较“奢华度日”更贴近自我放纵、以享乐为生活取向的核心含义。正文以“虽然……却……”自然呈现原文悖论。
