  yaml_path: translation/nt/1_timothy/005/002.yaml
  text: older women as mothers[a], younger women as sisters, in all purity.
translation:
  language: zh_hans
  text: 劝年长的妇女，要像劝母亲一样；劝年轻的妇女，要像劝姐妹一样，要以完全纯洁的态度[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在一切纯洁中。”这里的“纯洁”也可带有很强的贞洁或两性相处合宜之意。
    reason: 说明ἐν πάσῃ ἁγνείᾳ可直译的表达，并保留ἁγνεία在本语境中广义道德纯洁及强烈性伦理含意。
lexical_decisions:
- source_word: πρεσβυτέρας
  choice: 年长的妇女
  rationale: 此处为阴性复数、名词化用法，并与“年轻的妇女”相对，指年龄而非教会职分。
- source_word: ὡς μητέρας
  choice: 像劝母亲一样
  rationale: ὡς表示比较；结合上文所支配的动词“劝”，补出“劝”使现代汉语自然，同时保留母亲这一家庭关系比喻。
- source_word: νεωτέρας
  choice: 年轻的妇女
  rationale: 阴性复数、名词化用法，按年龄与“年长的妇女”构成对照。
- source_word: ὡς ἀδελφὰς
  choice: 像劝姐妹一样
  rationale: 保留原文的家庭关系比喻，不擅自加入“你的”。
- source_word: ἐν πάσῃ ἁγνείᾳ
  choice: 凡事都要纯洁
  rationale: ἁγνεία可泛指道德上的纯洁，并在本语境中强烈包含贞洁和两性相处合宜之意；“凡事都”体现πάσῃ的全面性，而不把含义限缩为性方面。
theological_decisions:
- issue: ἁγνεία的含义范围
  choice: 正文采用较宽泛的“纯洁”
  alternative: “完全贞洁”或“在两性关系上完全纯洁”
  rationale: 原词既可泛指纯洁，也常含贞洁、性方面端正的意味。宽泛译法保留完整语义范围，脚注则说明本语境中的强烈含意。
- issue: ἐν πάσῃ ἁγνείᾳ与前文的关系
  choice: 置于对年轻妇女的劝勉之后，同时用独立语气表达全面要求
  alternative: 明确译为“要以完全纯洁的态度劝年轻的妇女”
  rationale: 该短语位置上最自然地与如何对待年轻妇女相关，但原文的简洁结构允许理解为方式或伴随要求；正文避免过度限定其句法关系。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。因本节语法承接上一节的“劝”，在两个平行分句中补出“劝”，以避免中文残句；保持“母亲—姐妹”的家庭关系比喻和原文的平行结构。
