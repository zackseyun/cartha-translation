    reason: alternative_reading
lexical_decisions:
- source_word: ἔχουσαι
  choice: 招致
  rationale: 该分词直译为“有着”，但与 κρίμα 搭配时表示使自己处于审判之下；“招致”在现代汉语中自然地表达这一含义，并承接上文。
- source_word: κρίμα
  choice: 审判
  rationale: κρίμα 可指审判、定罪或判决；“审判”保留其严肃性，又不把经文本身未明说的永恒定罪强加进去。
- source_word: ὅτι
  choice: 因为
  rationale: ὅτι 在这里引出招致审判的原因，“因为”清楚而自然。
- source_word: τὴν πρώτην πίστιν
  choice: 起初的信
  rationale: πρώτην 在此具有时间意义；πίστιν 通常可译为“信”或“信心”，但在本语境中也可能指先前所作的承诺。“起初的信”保留主文本的基本词义，并以脚注呈现有根据的另一理解。
- source_word: ἠθέτησαν
  choice: 背弃了
  rationale: ἀθετέω 可表示拒绝、废弃或置之不顾；在“信”或“承诺”的语境中，“背弃”自然表达对先前所持之信或所作承诺的否弃，同时不将其限定为技术性的违约。
theological_decisions:
- issue: τὴν πρώτην πίστιν 在本段中的含义
  choice: 起初的信
  alternative: 先前的誓约；原先的承诺
  rationale: πίστις 的基本含义支持“信”，但本段论及寡妇名册及年轻寡妇再婚，因此也可能指与登记为寡妇有关的先前誓约或承诺。正文不武断消除这一张力，脚注保留另一种合理解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“招致审判”准确传达法律性语气；“起初的信”较贴近希腊语措辞，并借脚注保存语境中的真实歧义。
