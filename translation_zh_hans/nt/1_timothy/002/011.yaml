  yaml_path: translation/nt/1_timothy/002/011.yaml
  text: A woman must learn in quietness[b][a], in all submission.
translation:
  language: zh_hans
  text: 女人[a]应当安静地[b]学习，以完全顺服的态度。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“妻子”；希腊语这个词按上下文可指“女人”或“妻子”。
    reason: alternative_reading
  - marker: b
    text: 或译“静默地”；希腊语这个词也可表示安静、沉静，不一定指完全不说话。
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ
  choice: 女人
  rationale: γυνή可指“女人”或“妻子”。本句没有明确限定婚姻关系，且单数可作泛指，因此正文采用“女人”，并以脚注保留“妻子”的可能。
- source_word: ἐν ἡσυχίᾳ
  choice: 安静地
  rationale: ἡσυχία可表示安静、沉静或不扰乱的状态，不一定要求完全不发声。“安静地”符合现代汉语，也不把语义收窄为绝对沉默。
- source_word: μανθανέτω
  choice: 要……学习
  rationale: 这是现在时主动命令语气第三人称单数。“要……学习”自然传达指令语气，同时保留本句正面吩咐女人学习的重点。
- source_word: ἐν πάσῃ ὑποταγῇ
  choice: 凡事顺服
  rationale: ὑποταγή表示顺服或服从，πάσῃ强调完全或全面。原文没有明说顺服的对象；“凡事顺服”保留其广度，也不擅自补出对象。
theological_decisions:
- issue: ἡσυχία是指绝对沉默，还是安静的态度
  choice: 安静地
  alternative: 默默地／沉默地
  rationale: 该词虽可指沉默，但也常指安静、沉着、不扰乱的状态。正文不将命令绝对化，脚注则保留“沉默”的词义可能。
- issue: γυνή应译为“女人”还是“妻子”
  choice: 女人
  alternative: 妻子
  rationale: 上下文虽可能容许婚姻语境，但本句本身没有明确标示“妻子”。采用较宽的“女人”，并在脚注注明另一可能，以保存原文的歧义。
- issue: 顺服的对象是否应在译文中明确补出
  choice: 不补出对象
  alternative: 补作“顺服教导者”等
  rationale: 原文只说“在完全的顺服中”，没有明说顺服谁或什么。译文避免用解释性补语消除这一开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“要……学习”清楚表达命令语气；“安静地”比“静默”更自然，也保留词义范围。脚注标记依正文出现顺序排列。
