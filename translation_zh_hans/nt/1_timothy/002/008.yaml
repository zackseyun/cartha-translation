  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Βούλομαι οὖν προσεύχεσθαι τοὺς ἄνδρας ἐν παντὶ τόπῳ, ἐπαίροντας ὁσίους χεῖρας χωρὶς ὀργῆς καὶ ⸀διαλογισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/008.yaml
  text: Therefore I want the men in every place to pray[a], lifting up holy hands without anger or quarreling.
translation:
  language: zh_hans
  text: 所以，我希望男人们在各处祷告，举起圣洁的手，不发怒，也不争论。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不发怒，也不疑惑。”这个希腊语词也可指内心的思量或疑惑；这里与“发怒”并列，可能主要是指会众中带有纷争的争辩。
    reason: 词义存在真实歧义，正文采用较符合群体祷告语境的含义，脚注保留“疑惑”这一可能译法。
lexical_decisions:
- source_word: Βούλομαι
  choice: 我希望
  rationale: 表达意愿和带有指示性的愿望；“我希望”符合现代汉语，又不过度强化为命令。
- source_word: οὖν
  choice: 所以
  rationale: 承接上文并表示推论；“所以”自然清楚。
- source_word: προσεύχεσθαι
  choice: 祷告
  rationale: 准确表达该动词的通常含义，并与“我希望”构成自然的汉语句式。
- source_word: τοὺς ἄνδρας
  choice: 男人们
  rationale: ἀνήρ在这里特指男性；上下文分别论及男人和女人，不宜泛化为“众人”，也没有足够依据译作“丈夫们”。
- source_word: ἐν παντὶ τόπῳ
  choice: 在各处
  rationale: 保留分布性的“每一处”含义，同时比“在每一个地方”更自然简洁。
- source_word: ἐπαίροντας
  choice: 举起
  rationale: 表达祷告时伴随的举手动作。
- source_word: ὁσίους χεῖρας
  choice: 圣洁的手
  rationale: 直接保留ὅσιος关于敬虔、蒙神悦纳之圣洁的含义，避免改译为另一词义色彩较强的“洁净”。
- source_word: χωρὶς
  choice: 不
  rationale: 在并列短语中用“不……也不……”自然表达“没有、远离”的意思。
- source_word: ὀργῆς
  choice: 发怒
  rationale: 以动词化表达使现代汉语流畅，并保留人际处境中的愤怒含义。
- source_word: διαλογισμοῦ
  choice: 争论
  rationale: 该词可指思量、疑惑或争辩；与“发怒”并列并置于群体祷告语境中，“争论”较可能，但脚注保留“疑惑”的可能性。
theological_decisions:
- issue: τοὺς ἄνδρας的性别特指
  choice: 男人们
  alternative: 众人；丈夫们
  rationale: 原文使用特指男性的ἀνήρ，且下文对女人另有教导；译文保留这一差异，不将其泛化，也不在缺乏婚姻语境标记时限定为丈夫。
- issue: διαλογισμοῦ在祷告语境中的含义
  choice: 争论
  alternative: 疑惑；争辩
  rationale: 与“发怒”并列时，很可能指群体中带有纷争性的争论；但该词也可表示内心推想或疑惑，因此以脚注保存真实的词义歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“男人们”明确保留原文的男性所指；句式简洁，并以“不……也不……”自然呈现两个应当排除的状态。
