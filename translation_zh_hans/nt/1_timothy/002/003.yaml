  yaml_path: translation/nt/1_timothy/002/003.yaml
  text: This is good and acceptable before God our Savior,
translation:
  language: zh_hans
  text: 这在我们救主上帝面前是美好的，也是蒙悦纳的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο
  choice: 这
  rationale: 中性单数指示代词回指上文关于祷告的吩咐；译作“这”自然简洁，不额外限定其所指。
- source_word: καλὸν
  choice: 好的
  rationale: 在此表示道德上良善、合宜；“好的”保留其宽泛含义，并符合现代汉语。
- source_word: ἀπόδεκτον
  choice: 所悦纳的
  rationale: 表示受到欢迎或赞许；“所悦纳的”在以上帝为评价主体的语境中自然庄重，也表达主动接纳之意。
- source_word: ἐνώπιον
  choice: 上帝所……
  rationale: 此处表示在上帝看来或按上帝的评判；转换为“上帝所悦纳的”，使汉语流畅，同时保留评价关系。
- source_word: σωτῆρος
  choice: 救主
  rationale: 作为称号，表示施行拯救者；“救主”是清楚且通行的新约用语。
- source_word: ἡμῶν
  choice: 我们的
  rationale: 直接保留属格代词，修饰“救主”。
- source_word: θεοῦ
  choice: 上帝
  rationale: 与“救主”构成同位关系，表明上帝就是我们的救主；采用“上帝”作为现代标准汉语中自然、庄重的译名。
theological_decisions:
- issue: τοῦ σωτῆρος ἡμῶν θεοῦ 的同位关系
  choice: 我们的救主上帝
  alternative: 我们的救主，就是上帝
  rationale: 希腊语各属格成分自然构成同位关系，称上帝为“我们的救主”。直译为“我们的救主上帝”既简洁，也不增加原文以外的教义说明。
- issue: ἐνώπιον 所表达的关系
  choice: 上帝所悦纳的
  alternative: 在上帝面前可蒙悦纳的
  rationale: 这里主要表达上帝的认可与接纳，而非单纯空间性的“在……面前”；所选译法以自然汉语传达这一评价关系。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“这是好的，也是……”保留原文两个并列形容词的结构；“所悦纳的”具有适度的经文语体色彩，但仍为普通读者所熟悉。
