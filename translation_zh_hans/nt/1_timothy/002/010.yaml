- from: 而要以敬称自己敬畏上帝的妇女所当有的来妆饰自己，就是借着善行[a][b][c]。
  to: 反要以善行[c]来妆饰自己；这是自称敬畏上帝[a]的妇女所相宜的[b]。
  rationale: 修订将误写的“敬称”改为“自称”，并重新组织语序，使中文自然地表达本节承接第9节而省略的“妆饰自己”：善行是妇女自称敬畏上帝时所相宜的妆饰。此处理没有把善行表述为获得救恩或蒙上帝接纳的功德，也没有将“自称”解释为正式立誓。脚注内容保留原有替代译法，但将锚点移至对应词语。
