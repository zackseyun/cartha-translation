  text: ἀλλ’ ὃ πρέπει γυναιξὶν ἐπαγγελλομέναις θεοσέβειαν, δι’ ἔργων ἀγαθῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/010.yaml
  text: 'but with what is proper for women professing godliness: good works[a][b][c].'
translation:
  language: zh_hans
  text: 反要以善行[c]来妆饰自己；这是自称敬畏上帝[a]的妇女所相宜的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬畏上帝”也可译作“虔敬上帝”或“对上帝的敬虔”。
    reason: lexical_alternative
  - marker: b
    text: “所相宜的”也可译作“所合宜的”或“所当有的”。
    reason: lexical_alternative
  - marker: c
    text: 直译“借着善行”；这里善行是这种合宜妆饰的具体表现。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: 而要
  rationale: 承接第9节，与外在妆饰形成转折；“而要”自然表达正面的对比要求。
- source_word: ὃ πρέπει
  choice: 所当有的
  rationale: 表达“合宜、相称之事”，并与上下文中省略而可补出的“妆饰”关系自然衔接。
- source_word: γυναιξὶν
  choice: 妇女
  rationale: 此处泛指聚会中的女性，并非专指已婚妇女。
- source_word: ἐπαγγελλομέναις
  choice: 声称自己
  rationale: 保留该分词“公开宣称、以某种身份自居”的含义，不加强为许愿或承诺。
- source_word: θεοσέβειαν
  choice: 敬畏上帝
  rationale: θεοσέβεια指向对上帝的敬畏与虔敬；此译清楚自然，也保留其明确的神本指向。
- source_word: δι’ ἔργων ἀγαθῶν
  choice: 借着善行
  rationale: 较直接保留διά加属格所表达的途径或方式；在语境中，善行是这种合宜妆饰的具体表现。
theological_decisions:
- issue: 善行与所宣称之敬虔的关系
  choice: 把善行译为敬畏上帝之妇女合宜的外在表现
  alternative: 把善行理解为人在上帝面前获得接纳或救恩的功德基础
  rationale: 句法和上下文聚焦于与外在妆饰相对的合宜行为，并未说明善行是否构成得救功德，因此不在译文中加入该结论。
- issue: ἐπαγγελλομέναις的语气
  choice: 声称自己敬畏上帝
  alternative: 立誓敬畏上帝
  rationale: 原词可表示公开宣称或自称；本处没有足够依据把它限定为正式誓愿。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“妆饰自己”由第9节的语境补出，以使本节在中文中完整自然；同时用“借着善行”保留原文介词结构及其一定的解释空间。
