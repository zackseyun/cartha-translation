  text: εἷς γὰρ θεός, εἷς καὶ μεσίτης θεοῦ καὶ ἀνθρώπων ἄνθρωπος Χριστὸς Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/005.yaml
  text: For there is one God[a], and one mediator between God and men, the man Messiah Jesus[c][b],
translation:
  language: zh_hans
  text: 因为只有一位上帝，在上帝和人类之间也只有一位中保，就是身为人的弥赛亚耶稣。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἷς
  choice: 一位
  rationale: 两处均译作“一位”，既符合汉语对有位格者的称谓，也保留“一位上帝／一位中保”的强调和平行结构。
- source_word: γὰρ
  choice: 因为
  rationale: 标明本句对上文的解释或依据；现代汉语中“因为”比句首“原来”更直接自然。
- source_word: θεός
  choice: 上帝
  rationale: 采用现代标准汉语中庄重、通行的对应词。
- source_word: καὶ
  choice: 也
  rationale: 在第二个“一位”前译作“也”，自然呈现希腊文递进并列：只有一位上帝，也只有一位中保。
- source_word: μεσίτης
  choice: 中保
  rationale: “中保”是汉语圣经传统中准确且凝练的术语，指居于双方之间、促成关系或和解者。
- source_word: θεοῦ καὶ ἀνθρώπων
  choice: 在上帝和人类之间
  rationale: 原文虽使用属格，汉语与“中保”搭配时用“在……之间”可清楚表达双方关系；复数ἀνθρώπων在此泛指全人类。
- source_word: ἄνθρωπος
  choice: 成为人的
  rationale: 原文无冠词，具有性质性和同位说明作用，强调这位中保真实属于人类。“成为人的”在现代汉语中自然地保留其人性重点，但不暗示他仅仅是人。
- source_word: Χριστὸς
  choice: 弥赛亚
  rationale: 此处作为耶稣的职衔，翻译其含义为“弥赛亚”，而不把它处理成姓氏式的音译。
- source_word: Ἰησοῦς
  choice: 耶稣
  rationale: 采用该人名在现代汉语中的标准译法。
theological_decisions:
- issue: ἀνθρώπων与ἄνθρωπος之间的词汇联系
  choice: 译为“人类……成为人的”
  alternative: “众人……那人”或“人……人基督耶稣”
  rationale: 汉语无法像英语用men/man那样自然地复现单复数词形对应；本译通过“人类／成为人的”保留共同的人性语义，并避免“那人”可能造成的指示性误读。
- issue: Χριστός的职衔性质
  choice: 弥赛亚耶稣
  alternative: 基督耶稣
  rationale: 此处Χριστός具有职衔作用；“弥赛亚”把职衔意义表达出来，同时保留原文“职衔＋人名”的次序。
- issue: ἄνθρωπος Χριστὸς Ἰησοῦς的基督论张力
  choice: 就是成为人的弥赛亚耶稣
  alternative: 就是那人弥赛亚耶稣
  rationale: 明确保留经文对中保真实人性的强调，但不添加经文本身未明说的结论，也不暗示对其神性的否定。
- issue: 两个εἷς的排他性和对应关系
  choice: 只有一位……也只有一位
  alternative: 一位……一位
  rationale: “只有”自然表达数词在此处的强调和排他意味，并使上帝与中保之间的平行结构清晰可闻。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“中保”和“弥赛亚”保留必要的圣经术语色彩；句法简明，适合普通现代读者。原文末尾逗号属于跨节标点，本节作为独立引文时以句号收束。
