lexical_decisions:
- source_word: γὰρ
  choice: 因为
  rationale: 引出本句作为前文论述的理由或根据；“因为”自然保留了解释性的逻辑关系。
- source_word: Ἀδὰμ
  choice: 亚当
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: πρῶτος
  choice: 先
  rationale: 在与“然后”相配的结构中清楚表达形成的时间先后，中文自然简洁。
- source_word: ἐπλάσθη
  choice: 被塑造
  rationale: 这是πλάσσω的被动形式，含塑成、塑造之意，并呼应《创世记》中上帝塑造人的叙述；比宽泛的“被创造”更具体。
- source_word: εἶτα
  choice: 然后才是
  rationale: 表明随后发生的次序；加入“才是”使省略重复谓语的中文结构自然，同时仍只陈述时间顺序。
- source_word: Εὕα
  choice: 夏娃
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions:
- issue: 在有关教会角色的争议语境中，本句与《创世记》创造次序的关系
  choice: 仅陈述时间次序：亚当先被塑造，然后才是夏娃。
  alternative: 在译文中加入有关权柄或角色差异的推论。
  rationale: 希腊文本本身在本节只说明受造的先后，并未明说这一顺序所蕴含的全部神学结论；译文不越过原文替读者作出教义推断。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“塑造”保留原动词的具体形象；“先……然后才是……”准确表达简洁的时间次序，不额外引入角色或权柄方面的解释。
