  text: καὶ Ἀδὰμ οὐκ ἠπατήθη, ἡ δὲ γυνὴ ⸀ἐξαπατηθεῖσα ἐν παραβάσει γέγονεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/014.yaml
  text: And Adam was not deceived[a], but the woman, having been deceived[b], came to be in transgression.
translation:
  language: zh_hans
  text: 亚当并没有受骗；但那女人受了迷惑[a]，已经陷在过犯之中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受了迷惑”也可译作“被彻底欺骗”。这里的希腊语动词与前面的“受骗”不同，可能带有较强的“彻底受骗”之意。
    reason: lexical_alternative
  - marker: b
    text: “已经陷在过犯之中”也可译作“已经处在过犯之中”。希腊语的完成时可突出由先前事件造成、延续至今的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδὰμ
  choice: 亚当
  rationale: 按现代中文圣经人名的通行译法音译。
- source_word: ἠπατήθη
  choice: 没有受骗
  rationale: 忠实表达 ἀπατάω 的简单过去时被动形式；“受骗”自然直接，也与后面的复合动词形成可辨认的对应。
- source_word: ἡ γυνή
  choice: 女人
  rationale: γυνή 可指“女人”或“妻子”；本句回顾《创世记》并与亚当对举，译作“女人”较少加入婚姻身份这一层解释。
- source_word: ἐξαπατηθεῖσα
  choice: 受了蒙骗
  rationale: 以完成性的表达体现先于主句状态的动作；“蒙骗”与前面的“受骗”略有区别，同时不在正文中过度断定复合前缀必然具有强化作用。
- source_word: ἐν παραβάσει
  choice: 在过犯之中
  rationale: 保留 ἐν 加与格所表达的状态或处境，也保留抽象名词 παράβασις，而不改写为“成了犯罪的人”。
- source_word: γέγονεν
  choice: 已落在
  rationale: 兼顾 γίνομαι 的进入某种状态之意与完成时所突出的现存结果；中文“已落在……之中”自然表达事件及其结果状态。
- source_word: δὲ
  choice: 却
  rationale: 明确传达亚当与女人之间的对比关系。
- source_word: καὶ
  choice: 并且
  rationale: 承接上一节的论述，不额外加入推论色彩。
theological_decisions:
- issue: 如何表达女人与“过犯”的关系，而不扩大为关于女性本质或普遍罪责的结论
  choice: 按经文叙述译为“女人却受了蒙骗，已落在过犯之中”
  alternative: “妻子受骗，成了过犯者”
  rationale: 所选译法保留本节与《创世记》事件的联系及原文的抽象名词，不把“过犯”改成人的固定身份，也不加入本节未明说的普遍性结论。
- issue: 是否在正文中把 ἐξαπατάω 明确译成“完全受骗”
  choice: 正文采用较克制的“受了蒙骗”，脚注说明可能的加强语气
  alternative: “彻底受了欺骗”
  rationale: 复合动词可能比前面的 ἀπατάω 语气更强，但这种强化程度并非必须在正文中定死；脚注可保留真实的词义可能性。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“却”清楚呈现对比；分号使两个对举分句层次鲜明。“过犯”保留原文的神学与法律色彩，同时避免更生硬的“违犯”。所有脚注标记均紧随其所说明的正文表达。
