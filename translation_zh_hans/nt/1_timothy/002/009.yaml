id: 1TI.2.9
reference: 1 Timothy 2:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὡσαύτως ⸀καὶ γυναῖκας ἐν καταστολῇ κοσμίῳ μετὰ αἰδοῦς καὶ σωφροσύνης κοσμεῖν ἑαυτάς, μὴ ἐν πλέγμασιν ⸀καὶ ⸀χρυσίῳ ἢ μαργαρίταις ἢ ἱματισμῷ πολυτελεῖ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/009.yaml
  text: Likewise also[a], women are to adorn themselves in respectable clothing, with modesty and self-control, not with braided hair and gold or pearls or expensive clothing[b],
translation:
  language: zh_hans
  text: 同样，妇女也应当以端庄得体的衣着，以庄重和自制妆饰自己；不要以编发、黄金、珍珠或昂贵的衣服为妆饰[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “编发、黄金、珍珠或昂贵的衣服”很可能是指炫耀性的妆饰，而不一定是在所有情形下一概禁止编发或佩戴首饰。
    reason: 文化背景说明，并保留对禁令范围的解释空间。
lexical_decisions:
- source_word: ὡσαύτως καὶ
  choice: 照样……也
  rationale: 明确保留两个词所表达的承接和附加关系，并使现代汉语自然流畅。
- source_word: γυναῖκας
  choice: 女人
  rationale: γυνή 可指“女人”或“妻子”；本处没有婚姻关系的限定标志，且语境是一般性劝勉，故采用较宽泛的“女人”。
- source_word: ἐν καταστολῇ κοσμίῳ
  choice: 以端庄的衣着
  rationale: καταστολή 在此指衣着、服饰，κόσμιος 表达合宜、整齐、可敬的意味；“端庄的衣着”简明而符合现代汉语。
- source_word: μετὰ αἰδοῦς
  choice: 并有含蓄
  rationale: αἰδώς 指因顾及体面与他人眼光而产生的内敛、知耻和不逾矩；“含蓄”在衣着和举止语境中比单指外观的词更能保留其内在态度。
- source_word: σωφροσύνης
  choice: 自制
  rationale: 该词兼有心智健全、审慎和克制之意；“自制”简洁呈现其在此处的约束意味。
- source_word: κοσμεῖν ἑαυτάς
  choice: 妆饰自己
  rationale: 保留 κοσμέω 的“装饰、整理”含义，也维持与后面各种外在妆饰方式的对比。
- source_word: μὴ ἐν πλέγμασιν
  choice: 不以编发……为妆饰
  rationale: πλέγματα 指编结的发式；“编发”准确而简洁，不擅自加入“华丽”等解释性限定。
- source_word: χρυσίῳ
  choice: 黄金
  rationale: 按原文保留宽泛的物质名称，不将其过度具体化为某一种首饰。
- source_word: μαργαρίταις
  choice: 珍珠
  rationale: 采用该词标准而清楚的对应词。
- source_word: ἱματισμῷ πολυτελεῖ
  choice: 昂贵的衣服
  rationale: ἱματισμός 指衣服，πολυτελής 指价格高昂、奢侈；此译法自然地保留原文对高价服饰的指称。
theological_decisions:
- issue: 本节所说的是一般女人还是特指妻子
  choice: 一般的女人
  alternative: 妻子
  rationale: 复数 γυναῖκας 本身可有两义，但上下文没有丈夫或婚姻关系等限定标志；采用“女人”可避免无根据地缩窄所指范围。
- issue: 本节是否绝对禁止任何编发、黄金、珍珠或昂贵衣服
  choice: 正文保留原文直接的否定式，脚注说明其语境可能针对炫耀性的妆饰
  alternative: 理解为在所有情形下对所列各项的绝对禁令
  rationale: 句法将端庄、含蓄、自制的妆饰与所列奢华外饰相对照。正文不添加原文没有的“炫耀”一词，以保留劝诫的力度；脚注则交代这一列举在历史社会语境中的可能用意，避免译文擅自裁定适用范围。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“端庄”体现 κόσμιος 的合宜与可敬；“含蓄和自制”分别呈现 αἰδώς 与 σωφροσύνη 的不同侧重。句末保留逗号，因为原文该句在下一节继续。
