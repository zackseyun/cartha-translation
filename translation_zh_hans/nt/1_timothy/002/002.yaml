  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὑπὲρ βασιλέων καὶ πάντων τῶν ἐν ὑπεροχῇ ὄντων, ἵνα ἤρεμον καὶ ἡσύχιον βίον διάγωμεν ἐν πάσῃ εὐσεβείᾳ καὶ σεμνότητι.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/002.yaml
  text: for kings and all who are in high positions[a], so that we may lead a tranquil and quiet life in all godliness and dignity.
translation:
  language: zh_hans
  text: 为君王和所有身居高位的人[a]祷告，使我们可以在完全的敬虔和庄重中，过安宁平静的生活。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所有掌权的人”。希腊语直译为“所有处于显要地位的人”。
    reason: 说明原短语既可侧重地位，也可按语境理解为权柄；正文采用较宽的表达，以免把范围限得过窄。
lexical_decisions:
- source_word: ὑπὲρ
  choice: 为……祷告
  rationale: 本节在句法上承接前文所说的祈求、祷告和代求；汉语若只译“为”会显得悬空，因此补出语境中已明示的“祷告”，准确表达为这些人代求之意。
- source_word: βασιλέων
  choice: 君王
  rationale: 该词具体指君王或最高统治者；“君王”既保留词义，也不把它泛化为所有统治者。
- source_word: πάντων τῶν ἐν ὑπεροχῇ ὄντων
  choice: 所有身居高位的人
  rationale: 原短语直指处于显要或较高地位的人，范围可能比正式掌权者更广；“身居高位”保留这种宽度。
- source_word: ἵνα
  choice: 使
  rationale: 清楚表达祷告所指向的目的或结果，符合现代汉语表达。
- source_word: ἤρεμον καὶ ἡσύχιον
  choice: 安宁平静
  rationale: 两个近义形容词共同描写不受扰乱、安静稳定的生活；分别译作“安宁”和“平静”，保留原文的并列表达。
- source_word: βίον διάγωμεν
  choice: 我们可以……过……的生活
  rationale: διάγω与βίος连用，意为度过或过某种生活；此译自然地表现生活方式与处境。
- source_word: ἐν πάσῃ εὐσεβείᾳ
  choice: 凡事敬虔
  rationale: εὐσέβεια指对神的敬畏与委身在生活中的表现；“敬虔”简洁而准确，“凡事”表达πάσῃ所强调的全面性。
- source_word: σεμνότητι
  choice: 庄重
  rationale: 该词表示值得尊重的严肃、端正品格；“庄重”是清楚、现代且不过分道德化的表达。
theological_decisions:
- issue: 为君王及身居高位者祷告的范围与目的
  choice: 译文表明应为统治者及其他身居高位者祷告，所求的是使信徒能过安宁、敬虔而庄重的生活。
  alternative: 将本节译得更强调对政权的顺服，或把对象限于正式掌权者。
  rationale: 希腊文说明代祷的对象和所期望的生活处境，却没有在本节中宣告对每一位统治者的无条件认同，也没有把“身居高位的人”严格限定为依法掌权者；译文不额外引入政治神学立场。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“凡事敬虔、庄重”避免生硬直译“在一切敬虔和庄重中”；正文补出承接上一节的“祷告”，使本节单独诵读时语法完整。
