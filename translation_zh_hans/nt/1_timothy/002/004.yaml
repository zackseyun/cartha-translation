  text: ὃς πάντας ἀνθρώπους θέλει σωθῆναι καὶ εἰς ἐπίγνωσιν ἀληθείας ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/004.yaml
  text: who desires all people to be saved and to come to the knowledge of the truth[a][b].
translation:
  language: zh_hans
  text: 他愿意[a]所有人都得救，并且都认识真理[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “愿意”或译“意欲”。原文动词也可表达“想要”的意思；这里不对神学争论作超出原文措辞的判定。
    reason: lexical_alternative
  - marker: b
    text: “认识真理”或译“充分认识真理”。原文名词可以带有更充分、更完整之认识的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: 他
  rationale: 关系代词回指上文的神。现代汉语用“他”自然承接前句，同时保留原文的句法联系。
- source_word: πάντας ἀνθρώπους
  choice: 所有人
  rationale: 此处指全体人，并非专指男性；“所有人”直接表达原文的普遍范围，也不擅自缩窄为“各类人”。
- source_word: θέλει
  choice: 愿意
  rationale: θέλω可表示愿、想要或意欲。“愿意”在现代汉语中自然，并避免把该词强化为关于神之预定旨意的技术性表述。
- source_word: σωθῆναι
  choice: 都得救
  rationale: σῴζω的被动不定式在此具有救恩含义；“得救”是清楚、通行且贴合语境的表达。“都”与“所有人”呼应。
- source_word: εἰς ἐπίγνωσιν ἀληθείας
  choice: 认识真理
  rationale: ἐπίγνωσις可指认识，也可带有充分认识的意味。“认识真理”符合现代汉语习惯，同时不在正文中过度强调“充分”的语义色彩。
- source_word: ἐλθεῖν
  choice: 认识
  rationale: 原文以ἔρχομαι加εἰς表达进入某种状态，直译“来到对真理的认识”在汉语中生硬；结合介词短语译为“认识真理”，自然传达达到认识这一状态的意思。
theological_decisions:
- issue: πάντας ἀνθρώπους的范围及神拯救人的意愿
  choice: 译作“愿意所有人都得救”
  alternative: “定意使所有人得救”；“愿意各类人得救”
  rationale: 原文最自然地具有普遍范围。译文既不把“所有人”限制为“各类人”，也不把θέλει处理成关于神决定性旨意的专门术语，从而保留经文本身的神学张力。
- issue: ἐπίγνωσις是否必须强化为完全的知识
  choice: 正文译作“认识”，脚注注明“充分认识”
  alternative: 正文译作“充分认识”
  rationale: 该名词可能含有更充分或更深入认识的意味，但在本句中并不必然要求强化；正文采用自然且不过度界定的表达，脚注保留词义上的可能性。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“所有人”避免把ἄνθρωποι误解为仅指男性；整体语序简洁，并以脚注保留θέλω与ἐπίγνωσις的词义幅度。
