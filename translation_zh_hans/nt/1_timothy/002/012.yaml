  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸂διδάσκειν δὲ γυναικὶ⸃ οὐκ ἐπιτρέπω, οὐδὲ αὐθεντεῖν ἀνδρός, ἀλλ’ εἶναι ἐν ἡσυχίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/012.yaml
  text: But I do not permit a woman to teach or to exercise authority over a man[a]; instead[c][b], she is to be in quietness.
translation:
  language: zh_hans
  text: 但我不准女人教导，也不准她对男人[a]行使权柄[b]，而要安静[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“妻子……丈夫。”希腊语中的这两个词既可泛指“女人／男人”，也可按婚姻关系指“妻子／丈夫”。
    reason: alternative_reading
  - marker: b
    text: 或译：“掌权”；也可能是“辖制”。这里的希腊语动词十分罕见，其确切语气和含义有争议。
    reason: lexical_alternative
  - marker: c
    text: 或译：“静默”。这里的希腊语词可按语境表示安静、沉静或不出声。
    reason: lexical_alternative
lexical_decisions:
- source_word: διδάσκειν
  choice: 教导
  rationale: 作ἐπιτρέπω的补足语，直译为“教导”自然准确，无须在中文中另行标示现在时体。
- source_word: δὲ
  choice: 但
  rationale: 表示与上文指示之间的轻微转折；“但”简明保留这一语篇关系。
- source_word: γυναικί
  choice: 女人
  rationale: γυνή既可指一般的“女人”，也可指“妻子”。本段语境较广，正文采用“女人”，婚姻义置于脚注。
- source_word: οὐκ ἐπιτρέπω
  choice: 我不准
  rationale: 自然表达一般性的现在时禁令；“不准”在现代汉语中清楚有力，又不额外解释禁令的范围或时限。
- source_word: οὐδὲ
  choice: 也不准
  rationale: 承接前一否定，并列第二个不被准许的行动；补出“不准”使中文句法清楚。
- source_word: αὐθεντεῖν
  choice: 行使权柄
  rationale: 该动词罕见，语义色彩有争议。“行使权柄”保留中性的权柄含义，不擅自加入“专横辖制”等负面意味；其他可能译法见脚注。
- source_word: ἀνδρός
  choice: 男人
  rationale: ἀνήρ可指“男人”或“丈夫”。正文采用一般义，并在脚注保留婚姻义。
- source_word: ἀλλ’
  choice: 而
  rationale: 引出与前述禁令相对的正面要求；“而要”在现代汉语中自然表达鲜明对照。
- source_word: εἶναι
  choice: 要
  rationale: 以“要安静”自然表达不定式所承载的要求，不生硬直译为“是”。
- source_word: ἐν ἡσυχίᾳ
  choice: 安静
  rationale: ἡσυχία可表示安静、沉静，也可能侧重不出声。“安静”避免将其无根据地绝对化为完全沉默，并与本段语境相称。
theological_decisions:
- issue: 罕见动词αὐθεντεῖν在这一教会秩序经文中的含义
  choice: 行使权柄
  alternative: 掌权；辖制
  rationale: 正文采用较中性的权柄表达，既不把该词限定为滥用权力，也不消除其可能带有较强支配意味的争议；脚注保留主要词义选择。
- issue: γυνή与ἀνήρ应理解为女人／男人，还是妻子／丈夫
  choice: 女人……男人
  alternative: 妻子……丈夫
  rationale: 两个词在希腊语中都兼有一般性别义和婚姻关系义。上下文较广地谈论女人，且本节没有明确的婚姻限定语，因此正文采用一般义，同时以脚注保留婚姻义，避免替读者消除真实歧义。
- issue: ἡσυχία表示安静还是完全沉默
  choice: 安静
  alternative: 静默；不出声
  rationale: 该词可指安静、沉静或沉默。正文“安静”保留较宽的语义范围，不把要求扩张为绝对不发声；脚注说明另一可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我不准……也不准……”清楚保留原文两个并列的不定式结构；“而要安静”自然呈现ἀλλά引出的对照。正文不擅自限定为婚姻关系，也不把αὐθεντεῖν解释为必然的专横行为，从而保留原文的词义与神学张力。
