  text: εἰς ὃ ἐτέθην ἐγὼ κῆρυξ καὶ ἀπόστολος— ἀλήθειαν ⸀λέγω, οὐ ψεύδομαι— διδάσκαλος ἐθνῶν ἐν πίστει καὶ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/007.yaml
  text: For this I was appointed a herald and an apostle—I am telling the truth[c][b][a]; I am not lying—a teacher of the Gentiles in faith and truth.
translation:
  language: zh_hans
  text: 为此[a]，我被任命为宣讲者和使徒——我说的是实话，并不撒谎——作外邦人[b]的教师，在信心和真理中[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为此”也可译作“为这事”或“为了这目的”。
    reason: lexical_alternative
  - marker: b
    text: “外邦人”也可译作“列国”或“各国的人”。
    reason: lexical_alternative
  - marker: c
    text: “在信心和真理中”也可理解为“以信实和真理”，或“在信仰和真理方面”。
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς ὃ
  choice: 为此
  rationale: 回指上文所说的见证或宣告，并保留“为了这事／为此目的”的指向；“为此”在现代汉语中简洁自然。
- source_word: ἐτέθην
  choice: 我被立为
  rationale: 这里的被动式表示受委任承担职分，不是单纯被放置在某处；“被立为”既保留被动语态，也符合使徒受差派的语境。
- source_word: κῆρυξ
  choice: 宣讲者
  rationale: κῆρυξ指奉命公开宣告信息的人。“宣讲者”比宗派色彩较强的“传道人”更中性，也比字面的“传令官”更符合本段语境。
- source_word: ἀπόστολος
  choice: 使徒
  rationale: 在保罗自述中，这是公认的职分称谓；“使徒”是准确而通行的译法。
- source_word: ἀλήθειαν λέγω, οὐ ψεύδομαι
  choice: 我说的是真话，并没有撒谎
  rationale: 用自然的现代汉语保留原文先正面申明、再否定说谎的双重强调。
- source_word: διδάσκαλος ἐθνῶν
  choice: 外族人的教师
  rationale: 保罗语境中的ἔθνη通常指犹太人以外的各族。“外族人”表达这一所指，同时以脚注保留“列国”的较宽泛可能。
- source_word: ἐν πίστει καὶ ἀληθείᾳ
  choice: 以信心和真理
  rationale: ἐν在这里可表达施教或履行职分的领域、方式或特征。“以”在中文中自然，并避免过度限定它究竟修饰“教师”还是更广泛的受任使命。
theological_decisions:
- issue: ἐθνῶν所指的范围
  choice: 外族人
  alternative: 列国／各国的人
  rationale: 保罗用语和上下文较支持非犹太各族之意，但名词本身也可作“列国”，故在脚注中保留较宽泛译法。
- issue: πίστις在ἐν πίστει καὶ ἀληθείᾳ中的含义
  choice: 信心
  alternative: 信实
  rationale: “信心”是πίστις在此处合宜且通行的译法，但其语义范围也容许“信实”，不宜在正文中排除这一可能。
- issue: ἐν πίστει καὶ ἀληθείᾳ的句法作用
  choice: 以信心和真理作……教师
  alternative: 在信仰和真理方面作……教师
  rationale: 原文可描述保罗施教的方式、领域或其职分的特征。正文采用较自然且不强行锁定的表达，脚注说明另一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“宣讲者”避免把κῆρυξ直接套入现代教会职位名称；破折号保留保罗插入的郑重申明。正文尽量维持ἐν短语的语义与句法张力，不把它仅限定为施教方式或教导内容。
