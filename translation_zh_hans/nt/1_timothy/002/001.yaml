id: 1TI.2.1
reference: 1 Timothy 2:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν πρῶτον πάντων ποιεῖσθαι δεήσεις, προσευχάς, ἐντεύξεις, εὐχαριστίας, ὑπὲρ πάντων ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/001.yaml
  text: Therefore[a], first of all, I urge that petitions, prayers, intercessions, and thanksgivings be made for all people[c][b],
translation:
  language: zh_hans
  text: 所以，我劝勉，首先要为所有人[a][b][c]献上恳求、祷告、代求和感谢。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为”也可译作“代表”或“为了……的益处”。
    reason: lexical_alternative
  - marker: b
    text: “所有人”所译的希腊语泛指人类，并非只指男性。
    reason: lexical_alternative
  - marker: c
    text: 有人把这里的“所有人”理解为“各种人”或“各类人”；希腊文本身直译是“所有人”。
    reason: alternative_reading
lexical_decisions:
- source_word: Παρακαλῶ
  choice: 我劝勉
  rationale: 该词在此引出郑重而恳切的使徒教导。“劝勉”既保留其力度，也符合庄重、自然的现代汉语。
- source_word: οὖν
  choice: 所以
  rationale: 该词承接上文并表示推论或过渡；“所以”清楚保留这种逻辑联系，又比“因此”略为自然。
- source_word: πρῶτον πάντων
  choice: 首先
  rationale: 这一表达强调优先性，不一定表示一个编号清单中的第一项；“首先”简洁自然地传达此意。
- source_word: ποιεῖσθαι
  choice: 献上
  rationale: 这是现在时中间语态不定式，与四个祷告类名词搭配。“献上”在汉语中可自然统摄恳求、祷告、代求和感谢，同时不把表达限定为某种特定礼仪。
- source_word: δεήσεις
  choice: 恳求
  rationale: δέησις常指因需要而发出的迫切请求；“恳求”保留其恳切意味，且为普通读者所熟悉。
- source_word: προσευχάς
  choice: 祷告
  rationale: προσευχή是祷告的一般用语；“祷告”是直接、通行的对应。
- source_word: ἐντεύξεις
  choice: 代求
  rationale: 该词可指向神提出请求或恳求；在此处与“为所有人”相连，“代求”自然表达为他人祈求的语境含义。
- source_word: εὐχαριστίας
  choice: 感谢
  rationale: εὐχαριστία指感恩或感谢。“感谢”用语自然，并与前三项形成清楚并列；汉语无需借复数形态表达希腊语复数。
- source_word: ὑπὲρ
  choice: 为
  rationale: ὑπέρ接属格，在此表示为了某人的益处或代表某人。“为”最简洁自然，较完整的“代表”含义列入脚注。
- source_word: πάντων ἀνθρώπων
  choice: 所有人
  rationale: ἄνθρωπος在这里泛指人类，并非专指男性。“所有人”准确、自然，也不预先把范围缩窄为“各种人”。
theological_decisions:
- issue: πάντων ἀνθρώπων的范围
  choice: 所有人
  alternative: 各种人／各类人
  rationale: 希腊文直接说“所有人”。至于这里指每一个人，还是强调各类人，原句本身并未把相关神学争议完全解决，因此正文保留其宽泛直译，并在脚注说明另一种理解。
- issue: ἐντεύξεις是否明确指替别人代求
  choice: 代求
  alternative: 请求／恳求
  rationale: 该词本身可有较宽泛的“请求”含义，但在本句“为所有人”的语境中，“代求”能自然表达其指向他人的祷告功能；同时不借此规定代求的礼仪形式。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“我首先劝勉：要……”避免补出希腊文未明说的宾语，同时在汉语中保持劝告语气。四个祷告类名词保持并列，以呈现原文的修辞累积。脚注标记集中放在“所有人”之后，因为三条注释均涉及ὑπέρ πάντων ἀνθρώπων这一短语。
