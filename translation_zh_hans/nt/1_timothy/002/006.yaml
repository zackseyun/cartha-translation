  yaml_path: translation/nt/1_timothy/002/006.yaml
  text: who gave himself as a ransom for all[c][b][a], the testimony at the proper times.
translation:
  language: zh_hans
  text: 他献出自己，作所有人的赎价[a]——这是在适当时候所作的见证[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所有人的”也可译作“为所有人”或“代表所有人”。原文保持宽广范围，并未在此说明是指每一个人，还是各类人。
    reason: alternative_reading
  - marker: b
    text: 原文直译近于“在适当时候的见证”，结构十分简洁；也可理解为“在适当时候作出的见证”或“在适当时候得到传扬的见证”。原文未说明见证者或具体方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: δοὺς ἑαυτὸν
  choice: 献出自己
  rationale: 分词 δοὺς 修饰上文的“基督耶稣”；“献出自己”自然表达主动、自愿的自我交付，又不把分词生硬译成汉语状语。
- source_word: ἀντίλυτρον
  choice: 赎价
  rationale: 该词指使人得释放的赎价，ἀντί-也带有代替、交换的意味；“赎价”保留核心的救赎含义，而不在正文中扩写为解释性的神学术语。
- source_word: ὑπὲρ πάντων
  choice: 所有人的
  rationale: ὑπέρ可表示“为、为了、代表”，πάντων的措辞范围广。“所有人的赎价”在现代汉语中简洁自然，并保留原文的普遍性，不裁定它是指每一个人还是各类人。
- source_word: τὸ μαρτύριον
  choice: 这就是……所作的见证
  rationale: 定冠词短语可作为前述自我献出的同位说明。“这就是”显明其回指关系；“所作的”使高度压缩的希腊语名词结构成为自然汉语，但相关句法歧义保留在脚注中。
- source_word: καιροῖς ἰδίοις
  choice: 在适当时候
  rationale: 该短语指合宜或指定的时机。汉语不必机械标出复数；“在适当时候”既自然，也不明说是谁指定这些时候。
theological_decisions:
- issue: πάντων所指的救赎范围
  choice: 译为“所有人”，保留原文宽广的措辞
  alternative: 每一个人；各类人
  rationale: 本节没有明确裁定后世关于救赎范围的争论，因此不把“所有人”缩窄为某一特定教义解释。
- issue: ἀντίλυτρον的代替意味
  choice: 正文译为“赎价”
  alternative: 代赎的价；作为交换的赎价
  rationale: 该词确有代替或交换的色彩，但直接扩写可能把词义解释变成正文；“赎价”足以表达核心含义。
- issue: τὸ μαρτύριον与前句的句法关系
  choice: 理解为回指基督献上自己的同位说明
  alternative: 理解为后来在适当时候对这件事所作或显明的见证
  rationale: 希腊语表达高度压缩。正文采用可读的同位关系，但不把“见证”的实施者或具体方式写入经文，并用脚注说明另一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“献出自己”表达自愿的自我交付；分号和“这就是”帮助读者辨明压缩的同位结构。脚注保留救赎范围及“见证”短语的真实歧义。
