id: 1TI.2.15
reference: 1 Timothy 2:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: σωθήσεται δὲ διὰ τῆς τεκνογονίας, ἐὰν μείνωσιν ἐν πίστει καὶ ἀγάπῃ καὶ ἁγιασμῷ μετὰ σωφροσύνης.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/015.yaml
  text: Yet she will be saved through childbearing[c][b][a], if they continue in faith and love and holiness with self-control.
translation:
  language: zh_hans
  text: 然而，女人必借着生育得救[a][b]，只要她们常存于信心[c]、爱和圣洁之中，并有自制。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“借着那次生育”。有人认为这是指某一次特定的降生，可能是弥赛亚的降生；但原文也可以泛指生育。
    reason: alternative_reading
  - marker: b
    text: 希腊原文从单数“女人必……得救”转为复数“只要她们常存”。
    reason: lexical_alternative
  - marker: c
    text: “信心”也可理解为“忠信”。
    reason: lexical_alternative
lexical_decisions:
- source_word: σωθήσεται
  choice: 必……得救
  rationale: 该词是σῴζω的将来时被动态；保罗书信中通常表达“得救”。译作“得保全”或“平安度过”会把含义限于身体安全，而原文并未如此限定。
- source_word: δὲ
  choice: 然而
  rationale: δέ在此承接上文并带有温和的转折意味；“然而”自然地保留这一语气。
- source_word: διὰ τῆς τεκνογονίας
  choice: 借着生育
  rationale: τεκνογονία指生育、生产儿女。“借着生育”在现代汉语中自然，也保留διά所表达但未进一步解释的媒介关系；冠词既可作类指，也可能被理解为特指，后者收入脚注。
- source_word: ἐὰν
  choice: 只要
  rationale: ἐάν引出条件从句。“只要”能清楚表达条件关系，同时不预先界定这一条件在救恩论上的具体性质。
- source_word: μείνωσιν
  choice: 她们常存
  rationale: μένω在此表示持续处于某种状态。“常存”既自然庄重，也保留坚持、持续的含义；复数主语明确译为“她们”。
- source_word: ἐν πίστει
  choice: 于信心……之中
  rationale: πίστις主要译作“信心”，符合本项目惯例；“忠信”也是语义上可能的理解，收入脚注。
- source_word: ἀγάπῃ
  choice: 爱
  rationale: ἀγάπη的标准而自然的对应词。
- source_word: ἁγιασμῷ
  choice: 圣洁
  rationale: ἁγιασμός可指成圣或圣洁；在这一德行并列结构中，“圣洁”自然清楚，且避免不必要的神学术语化。
- source_word: μετὰ σωφροσύνης
  choice: 并有自制
  rationale: σωφροσύνη涵盖自制、审慎和心智健全。“自制”在现代汉语中清晰，并符合本段的伦理语境。
theological_decisions:
- issue: “女人必得救”的单数与“只要她们常存”的复数之间的人称数目转换
  choice: 正文保留单数“女人”与复数“她们”的转换，并以脚注提示。
  alternative: 将两处都顺译为复数“女人们……只要她们”，或把单数专指夏娃、复数泛指众女人。
  rationale: 希腊文确实由单数σωθήσεται转为复数μείνωσιν。保留这一转换，不替读者判定单数究竟承接一般意义上的“女人”还是上文的夏娃。
- issue: “借着生育得救”的含义
  choice: 保留“得救”与“借着生育”的开放关系，不说明这是属灵得救、末世得救，还是在生育或母职中得保全。
  alternative: 译作“在生产时得保全”“借着承担母职得救”或“借着那一次生产〔弥赛亚降生〕得救”。
  rationale: 原文没有明说身体安全、母职使命或某次特定降生；这些解释均有争议，不宜写入正文。
- issue: τῆς τεκνογονίας中的冠词是否指某一次特定的生育
  choice: 正文采用自然的类指译法“生育”，脚注保留“那次生育”的可能。
  alternative: 正文译为“借着那次生育”，并将其理解为某次特定的降生，可能是弥赛亚的降生。
  rationale: 希腊语冠词可以用于类指，未必要求特指；但特指读法确实存在，故以脚注呈现而不作定论。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“借着生育得救”有意保留原文的难解性，不添加“安全生产”“履行母职”等解释。正文保留单数到复数的突变。脚注标记均置于相关语句之后；其中[a]说明冠词可能的特指读法，[b]说明数的转换，[c]说明πίστις的词义选择。
