  text: πιστὸς ὁ λόγος καὶ πάσης ἀποδοχῆς ἄξιος,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/009.yaml
  text: The saying is trustworthy and worthy of full acceptance,[a]
translation:
  language: zh_hans
  text: 这话可信，值得完全接受。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这话”也可译作“这句话”或“这项陈述”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστὸς
  choice: 可信
  rationale: 在“πιστὸς ὁ λόγος”这一固定表达中，πιστός说明这话可靠、值得信赖；“可信”简洁自然，并符合此处的表语用法。
- source_word: ὁ λόγος
  choice: 这话
  rationale: 此处 λόγος 指一项具体的话语或陈述，而不是广义或具有专门神学含义的“道”；“这话”在现代汉语中自然，也保留了所指内容与上下文衔接上的开放性。
- source_word: πάσης
  choice: 完全
  rationale: πάσης 修饰 ἀποδοχῆς，表达接受的充分、毫无保留；译作“完全”比直译为“所有”更符合现代汉语搭配。
- source_word: ἀποδοχῆς
  choice: 接受
  rationale: ἀποδοχή 表示接纳或接受；“接受”清楚、通行，也避免“赞同”所带来的较窄含义。
- source_word: ἄξιος
  choice: 值得
  rationale: ἄξιος 加属格表示配得或值得某种回应；“值得完全接受”是准确而自然的现代汉语表达。
theological_decisions:
- issue: ὁ λόγος 所指的具体内容
  choice: 不在正文中明确限定其指向
  alternative: 通过增补说明，将其明确指向前文或后文的某一句话
  rationale: 原文这一公式本身没有在本节内明说“这话”的范围；译文保留其与上下文关系上的真实解释空间，避免替读者预先裁定。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“这话可信”保留教牧书信中这一公式化表达的简洁力度；“值得完全接受”忠实呈现 πάσης ἀποδοχῆς ἄξιος 的整体含义。
