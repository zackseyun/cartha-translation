id: 1TI.4.10
reference: 1 Timothy 4:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰς τοῦτο ⸀γὰρ κοπιῶμεν καὶ ⸀ὀνειδιζόμεθα, ὅτι ἠλπίκαμεν ἐπὶ θεῷ ζῶντι, ὅς ἐστιν σωτὴρ πάντων ἀνθρώπων, μάλιστα πιστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/010.yaml
  text: For to this end we labor and are reproached[a], because we have put our hope in the living God, who is the Savior of all people[c][b], especially of believers.
translation:
  language: zh_hans
  text: 我们正是为此劳苦，也受人辱骂[a]，因为我们已经把盼望寄托在活着的上帝身上[b]；他是所有人的救主，尤其是信徒的救主[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们辛勤劳作，也遭受毁谤。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“我们已经把希望寄托在活着的上帝身上。”
    reason: lexical_alternative
  - marker: c
    text: “所有人的救主，尤其是信徒的救主”依原文直译。对于这里的“救主”是着重指上帝对所有人的保全、为所有人预备的拯救，还是特别施行在信徒身上的救恩，解释者看法不一。
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: 正是为此
  rationale: 该短语指向上文所说的目标或目的。“正是为此”在现代汉语中自然地保留了目的性和强调意味。
- source_word: γὰρ
  choice: 由“正是”及全句的解释关系体现
  rationale: γάρ引出对上文的说明。若直译为“因为”，会与后面的ὅτι形成生硬的双重“因为”；因此通过“正是为此”和句际逻辑表达其解释功能。
- source_word: κοπιῶμεν
  choice: 我们劳苦
  rationale: κοπιάω指付出艰辛的劳动。“劳苦”简洁、庄重，并保留劳作费力的意味。
- source_word: ὀνειδιζόμεθα
  choice: 受人辱骂
  rationale: 该被动形式表示遭受言语羞辱或毁谤。“受人辱骂”清楚保留被动和公开受辱的意味。
- source_word: ἠλπίκαμεν ἐπὶ
  choice: 我们已经把盼望寄托在……身上
  rationale: 完成时表达已经作出的行动及其持续结果；“已经把盼望寄托在”兼顾这种既成而持续的信靠状态。
- source_word: θεῷ ζῶντι
  choice: 活着的上帝
  rationale: 直译ζῶντι的“活着”之意，不额外加入“永恒”等原文未明说的观念；“上帝”符合现代标准汉语的庄重宗教语体。
- source_word: σωτὴρ
  choice: 救主
  rationale: σωτήρ可指拯救者或保全者，但在教牧书信中具有明确的神学分量；“救主”既简洁又保留其传统与语境意义。
- source_word: πάντων ἀνθρώπων
  choice: 所有人
  rationale: ἄνθρωποι在此泛指全人类。“所有人”是现代汉语中自然、包容且准确的表达。
- source_word: μάλιστα
  choice: 尤其
  rationale: μάλιστα最自然的意义是“尤其、特别”。此译法保留上帝与所有人的关系以及他与信徒的特殊关系之间的张力，不把二者合并或改写。
- source_word: πιστῶν
  choice: 信徒
  rationale: 此处指以信为特征的人。“信徒”在现代汉语中明确、简洁，并符合上下文。
theological_decisions:
- issue: “所有人的救主，尤其是信徒的救主”的含义
  choice: 照原文同时保留“所有人”和“尤其是信徒”两层陈述，不在正文中限定“所有人”为“各种人”，也不据此断言普世得救。
  alternative: 可理解为上帝保全所有人而以救赎意义拯救信徒；或理解为普世救恩；或把“所有人”解释为“各种人”。
  rationale: 希腊文本本身并列普遍性（πάντων ἀνθρώπων）与特殊性（μάλιστα πιστῶν）。译文应保存这一真实的神学张力，而不替读者选择某一教派性的解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“我们正是为此……”避免两个“因为”连续出现的生硬结构；分号使“他是……”清楚承接“活着的上帝”。“活着的上帝”虽较直白，却比“永活的上帝”更严格地避免添加ζῶντι本身未明确表达的永恒性。
