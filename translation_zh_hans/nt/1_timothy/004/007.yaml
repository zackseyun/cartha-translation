  text: τοὺς δὲ βεβήλους καὶ γραώδεις μύθους παραιτοῦ. γύμναζε δὲ σεαυτὸν πρὸς εὐσέβειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/007.yaml
  text: But reject profane and old-womanish myths[a], and train yourself for godliness.
translation:
  language: zh_hans
  text: 至于那些世俗的、老妇人式的传说，你要拒绝；要操练自己，追求敬虔。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βεβήλους
  choice: 世俗
  rationale: 该词表示与神圣相对、缺乏敬畏的凡俗性质；“世俗”保留了神圣与凡俗的对照，且比“无神”更贴近原词范围。
- source_word: γραώδεις
  choice: 老妇人的
  rationale: 原词意为“老妇式的、具有老妇人特点的”，带有贬义。“老妇人的”在现代汉语中较自然，具体的修辞色彩由“荒诞”及脚注进一步说明。
- source_word: μύθους
  choice: 荒诞传说
  rationale: μῦθος在此指虚构、臆造或不可靠的故事。“传说”表达故事性质，加“荒诞”传达上下文中的贬斥语气，又避免让“神话”被误解为特定文学体裁。
- source_word: παραιτοῦ
  choice: 要拒绝
  rationale: 中间语态命令式要求提摩太拒斥、不接受这类传说；“拒绝”简洁而有力。
- source_word: γύμναζε
  choice: 要操练
  rationale: 该动词带有体育训练的意象；“操练”既保留比喻，也适合以敬虔为目标的持续实践。
- source_word: σεαυτόν
  choice: 自己
  rationale: 直接保留反身代词，明确提摩太既是操练的施行者也是对象。
- source_word: πρὸς εὐσέβειαν
  choice: 以敬虔为目标
  rationale: πρός加宾格在此表示趋向或目标；“以……为目标”清楚表达目的。εὐσέβεια指以敬畏神为中心的生活，“敬虔”是准确而通行的译法。
- source_word: δὲ … δὲ
  choice: 至于……；却……
  rationale: 第一个δέ承接并转向前文所提的另一类事，译作“至于”；第二个δέ把消极禁戒与积极命令相对照，译作“却”。
theological_decisions:
- issue: 如何翻译带贬义的短语 γραώδεις μύθους
  choice: 正文译为“老妇人的荒诞传说”，并用脚注说明其字面形式和贬义色彩。
  alternative: 老妇式的传说；老妇人的无稽之谈；愚妄的传说
  rationale: 原文刻意使用带文化色彩的尖锐说法。仅译成“愚妄”会抹去老妇人的具体意象，而“老妇式的”虽更贴字面，在现代汉语正文中却很生硬。正文采用自然但仍保留该意象的表达，脚注则保存其严格字面意义和修辞性质。
translation_notes:
  register: 采用现代、庄重且易懂的劝诫语体。“操练”保留体育训练隐喻；分号突出拒绝传说与追求敬虔之间的对照。脚注标记[a]已置于相关短语之后。
