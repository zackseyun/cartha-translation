  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: κωλυόντων γαμεῖν, ἀπέχεσθαι βρωμάτων ἃ ὁ θεὸς ἔκτισεν εἰς μετάλημψιν μετὰ εὐχαριστίας τοῖς πιστοῖς καὶ ἐπεγνωκόσι τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/003.yaml
  text: forbidding marriage and requiring abstinence from foods that God created to be received with thanksgiving by those who believe and have come to know the truth[a].
translation:
  language: zh_hans
  text: 他们禁止人结婚，又要求人禁戒食物[a]；这些食物是神所创造，供那些信而且已经认识真理的人怀着感谢的心领受。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译：“禁止人结婚，禁戒食物。”原文在“禁戒食物”前没有明说“要求人”；这里按上下文补明假教师是在命令人禁戒食物。
    reason: 说明原文省略的支配关系，以及正文为避免歧义所作的显明化处理。
lexical_decisions:
- source_word: κωλυόντων
  choice: 禁止
  rationale: 现在时分词承接上文，描述假教师持续施加的禁令；“禁止”准确而自然。
- source_word: γαμεῖν
  choice: 人结婚
  rationale: 不定式直指结婚这一行为；“禁止人结婚”比名词化的“禁止婚姻”更贴近希腊语，也符合现代汉语。
- source_word: ἀπέχεσθαι
  choice: 要求人禁戒
  rationale: 该词本义为“禁戒、避开”。原句在此省略了支配性词语，按语境补出“要求”，清楚表达假教师强令人禁戒食物的意思，同时以脚注保留原文结构。
- source_word: βρωμάτων
  choice: 食物
  rationale: 复数属格表示供人食用之物；汉语集合名词“食物”自然涵盖其复数意义。
- source_word: ἃ
  choice: 这些食物
  rationale: 关系代词回指前面的“食物”；汉语重复先行词可使指代清晰。
- source_word: ὁ θεὸς ἔκτισεν
  choice: 神创造的
  rationale: κτίζω具有明确的创造含义；“创造”保留其神学分量。
- source_word: εἰς μετάλημψιν
  choice: 要让……领受
  rationale: εἰς在此表达创造食物的目的，μετάλημψις指取用、享用或领受；该译法兼顾目的含义和自然汉语。
- source_word: μετὰ εὐχαριστίας
  choice: 存感谢的心
  rationale: 表达在领受时向神感谢；比生硬的“带着感谢”更符合现代汉语。
- source_word: τοῖς πιστοῖς
  choice: 信……的人
  rationale: 此处指相信之人；用动词性表达既自然，也避免把它误解为仅指品格忠信的人。
- source_word: ἐπεγνωκόσι τὴν ἀλήθειαν
  choice: 已经认识真理
  rationale: 完成时分词表达由认识真理而形成、延续至今的状态；“已经认识”保留这一结果状态。
theological_decisions:
- issue: τοῖς πιστοῖς καὶ ἐπεγνωκόσι τὴν ἀλήθειαν 是指同一群人还是两群人
  choice: 同一群人，由“信”和“已经认识真理”两个并列特征描述
  alternative: 两群人：信的人，以及已经认识真理的人
  rationale: 一个共同的冠词统领两个并列成分，最自然地指向同一群人；译作“信并已经认识真理的人”保留这种语法关系，不另设两类领受者。
- issue: 是否在正文中补明禁戒食物是教师所要求的
  choice: 补出“要求人”
  alternative: 按表面结构直译为“禁止人结婚，禁戒食物”
  rationale: κωλυόντων直接支配γαμεῖν，而ἀπέχεσθαι在现存结构中需要按上下文理解其施令作用。正文补明隐含关系可避免把“禁戒食物”误读成作者自己的命令；脚注同时交代较直译的形式。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“禁止人结婚”保留动词结构，以“存感谢的心领受”自然表达领受食物时的感恩；正文中的脚注标记[a]与脚注对应。
