  yaml_path: translation/nt/1_timothy/004/011.yaml
  text: Command these things and teach them[a].
translation:
  language: zh_hans
  text: 你要吩咐并教导这些事。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你要指示这些事，并教导这些事。”
    reason: 词汇替代；“指示”可表达παράγγελλε较不强的指令义，但正文“吩咐”更能保留原文的权威语气。
lexical_decisions:
- source_word: Παράγγελλε
  choice: 你要吩咐
  rationale: 该词为现在时主动命令语气，表达带有权威的持续指示。“吩咐”保留了命令、指令的力度，又符合现代汉语表达。
- source_word: ταῦτα
  choice: 这些事
  rationale: 中性复数指示代词回指上文所述的教导和要求；“这些事”既保留复数含义，也自然清楚。
- source_word: καὶ
  choice: 并
  rationale: 用“并”直接连接两个并列的命令，与希腊文的简单连接关系相符。
- source_word: δίδασκε
  choice: 教导人
  rationale: 该词为现在时主动命令语气，要求持续施教。希腊文未明说受教对象，汉语补出泛指的“人”，使句子自然，但不限定具体群体。
theological_decisions:
- issue: Παράγγελλε所体现的牧养权威
  choice: 译作“吩咐”，保留其权威性和指令性
  alternative: 译作“劝导”或“指示”，语气较弱
  rationale: 原文使用带指令意味的命令式；采用“吩咐”忠实呈现其力度，同时不据此添加经文未明说的教会职权范围。
- issue: 两个现在时命令语气的持续意味
  choice: 以自然汉语的“要……并……”表达，不额外加入“不断”
  alternative: 译作“要不断吩咐……不断教导”
  rationale: 现在时形式可含持续或反复行动，但本句未必着重强调时间方式；汉语命令句可由语境体现持续性，避免过度明释。
translation_notes:
  register: 采用简洁、庄重而通行的现代标准汉语。“吩咐”体现原文的权威语气；“教导人”补足汉语所需的泛指受事者，但不把对象限定为某一特定群体。
