  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἡ γὰρ σωματικὴ γυμνασία πρὸς ὀλίγον ἐστὶν ὠφέλιμος, ἡ δὲ εὐσέβεια πρὸς πάντα ὠφέλιμός ἐστιν, ἐπαγγελίαν ἔχουσα ζωῆς τῆς νῦν καὶ τῆς μελλούσης.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/008.yaml
  text: For bodily training is beneficial for a little while[a], but godliness is beneficial for all things[c][b], since it holds promise for the present life and the coming one.
translation:
  language: zh_hans
  text: 因为身体的操练有一点益处[a]，但敬虔在各方面都有益处，因为它带着今生和来生的应许。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有一点益处”也可译作“在短时间内有益处”；希腊语可表示益处的程度有限，也可表示持续的时间有限。
    reason: lexical_alternative
lexical_decisions:
- source_word: σωματικὴ γυμνασία
  choice: 身体的操练
  rationale: 既保留σωματική“身体的”这一限定，也以现代汉语自然表达γυμνασία所指的训练或锻炼，不将含义局限为竞技运动。
- source_word: πρὸς ὀλίγον
  choice: 有一点益处
  rationale: 希腊语可指益处有限，也可指持续时间短。正文采用范围上的理解，中文简洁自然；脚注保留时间解释的可能。
- source_word: ὠφέλιμος
  choice: 有益处
  rationale: 用语通俗、准确，并在两个对比小句中保持一致，避免“有利可图”一类经济色彩。
- source_word: εὐσέβεια
  choice: 敬虔
  rationale: 在教牧书信中指敬畏神、以神为中心的生活；“敬虔”是庄重而通行的对应词，也不把含义缩减为外在宗教礼仪。
- source_word: πρὸς πάντα
  choice: 在各方面
  rationale: 表达该短语的全面范围，同时比生硬的“对一切”更符合现代汉语。
- source_word: ἐπαγγελίαν ἔχουσα
  choice: 因为它带着……的应许
  rationale: 将分词短语理解为说明敬虔在各方面有益的理由；“带着应许”保留“拥有应许”的结构，又较自然。
- source_word: ζωῆς τῆς νῦν
  choice: 今生
  rationale: 自然表达“现在的生命／生活”，并与“来生”形成清楚对照。
- source_word: τῆς μελλούσης
  choice: 来生
  rationale: 原文省略了前文已有的ζωή；中文补出约定俗成的“来生”，清楚传达“将来的生命”。
theological_decisions:
- issue: 身体操练之益处的范围
  choice: 正文译作“有一点益处”，表达其价值有限，却并非毫无价值
  alternative: 译作“只在短时间内有益处”，强调效用持续的时间有限
  rationale: πρὸς ὀλίγον本身容许程度和时间两种理解。正文保留身体操练确有益处，同时突出敬虔益处更全面；脚注避免把歧义暗中消除。
- issue: 敬虔之应许与今生、来生的关系
  choice: 将“今生和来生”都理解为“应许”所涉及的生命
  alternative: 将分词短语较直译为“有现在和将来之生命的应许”
  rationale: 原文属格结构与省略关系清楚，但没有具体说明应许在今生以何种方式实现；译文不进一步加入物质昌盛、永生细节或其他教派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“身体的操练—敬虔”保持原文对比；“在各方面”自然呈现πρὸς πάντα的广泛范围。脚注标记紧随存在歧义的短语，正文中已出现[a]。
