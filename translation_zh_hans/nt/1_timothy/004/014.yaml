  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μὴ ἀμέλει τοῦ ἐν σοὶ χαρίσματος, ὃ ἐδόθη σοι διὰ προφητείας μετὰ ἐπιθέσεως τῶν χειρῶν τοῦ πρεσβυτερίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/014.yaml
  text: Do not neglect the gift that is in you[b][a], which was given to you through prophecy with the laying on of the hands of the eldership.
translation:
  language: zh_hans
  text: 不要忽视你里面的恩赐；这恩赐是借着预言[a]，伴随长老团[b]的按手赐给你的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“借着预言性的话”。这里的“预言”可能是赐下恩赐时所说的预言性话语，也可能表示恩赐借此而赐下。
    reason: lexical_alternative
  - marker: b
    text: “长老团”指由众长老组成的集体；也可译作“众长老”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἀμέλει
  choice: 不要忽视
  rationale: 现在时命令式与 μή 构成禁令，要求持续留意、不加轻忽；“不要忽视”在现代汉语中自然明确。
- source_word: τοῦ ἐν σοὶ χαρίσματος
  choice: 你里面的恩赐
  rationale: 保留 ἐν σοὶ“在你里面”的明确方位表达；“恩赐”既体现 χάρισμα 与恩典所赐之物的关联，也不擅自限定其具体类型。
- source_word: ἐδόθη σοι
  choice: 赐给你的
  rationale: 忠实表达不定过去时被动语态，不补明原文未明说的赐予者。
- source_word: διὰ προφητείας
  choice: 借着预言
  rationale: διά 加属格可表达途径或媒介；此译法保留预言在恩赐授予过程中究竟是媒介还是伴随性言说的张力。
- source_word: μετὰ ἐπιθέσεως τῶν χειρῶν
  choice: 伴随……的按手
  rationale: μετά 加属格表示伴随；“按手”是现代汉语中清楚而简洁的礼仪用语，避免把伴随关系过度解释为原因或唯一媒介。
- source_word: τοῦ πρεσβυτερίου
  choice: 长老团
  rationale: 该词指由长老构成的集体；“长老团”简明自然，同时避免套用后世特定宗派的组织名称。
theological_decisions:
- issue: 是否把 χάρισμα 明确译作某一种属灵或事奉能力
  choice: 恩赐
  alternative: 属灵恩赐；事奉的恩赐
  rationale: 上下文很可能涉及提摩太用于服事的恩赐，但原文没有相应修饰语；仅译“恩赐”可避免过度限定。
- issue: 预言与恩赐授予之间的关系
  choice: 借着预言，并用脚注说明也可理解为预言性话语
  alternative: 借着预言性的话；在说预言时
  rationale: διὰ προφητείας 可能表示预言作为媒介，也可能指授予恩赐时所发的预言性话语；正文保留其工具性表达，脚注提示语义范围。
- issue: πρεσβυτέριον 所指的教会群体及其制度含义
  choice: 长老团
  alternative: 众长老；长老会
  rationale: 原文明确是长老组成的集体，却不足以证明后世任何特定宗派体制；“长老团”传达集体意义而不引入额外制度主张。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“你里面的恩赐”保留原文措辞；“伴随……的按手”既体现 μετά 的伴随意义，也避免把预言与按手之间的关系解释得过于确定。
