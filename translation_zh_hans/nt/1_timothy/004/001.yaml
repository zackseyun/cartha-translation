id: 1TI.4.1
reference: 1 Timothy 4:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Τὸ δὲ πνεῦμα ῥητῶς λέγει ὅτι ἐν ὑστέροις καιροῖς ἀποστήσονταί τινες τῆς πίστεως, προσέχοντες πνεύμασι πλάνοις καὶ διδασκαλίαις δαιμονίων
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/001.yaml
  text: The Spirit explicitly says that in later times some will depart from the faith[a], paying attention to deceitful spirits and teachings of demons[c][b],
translation:
  language: zh_hans
  text: 但圣灵明确地说，在后来的时期，有些人会离弃信仰，听从迷惑人的灵和鬼魔的教导。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὸ ... πνεῦμα
  choice: 圣灵
  rationale: 定冠词及保罗书信中的预言语境最自然地指向圣灵；中文明确译出所指对象。
- source_word: δὲ
  choice: 但
  rationale: δέ表示轻微转折或话题推进；本节与前文相接时，“但”自然保留其连接和对照作用。
- source_word: ῥητῶς
  choice: 明确地
  rationale: 表达说话方式明确、直截了当；现代中文自然且保留原文力度。
- source_word: λέγει
  choice: 说
  rationale: 保留希腊文现在时的陈述方式，适合引出圣灵的预告。
- source_word: ἐν ὑστέροις καιροῖς
  choice: 后来
  rationale: 指相对于作者当下的后续时期，不必限定为末世最后阶段；“后来”简洁自然。
- source_word: ἀποστήσονταί
  choice: 必有……离弃
  rationale: 未来时表示将要发生，动词表达离开、背离；“离弃”保留主动背离的语义而不过度体系化。
- source_word: τινες
  choice: 一些人
  rationale: 自然对应不定复数代词，未指定具体人群。
- source_word: τῆς πίστεως
  choice: 这信仰
  rationale: 定冠词及教导语境倾向于指共同持守的信仰内容；“这信仰”既体现特指，也避免使用过度术语化的表达。
- source_word: προσέχοντες
  choice: 听从
  rationale: 该分词表示留心、听信并依从；在错误灵与教导的宾语前，“听从”比单纯“注意”更符合中文并保留其实际趋附之意。
- source_word: πνεύμασι πλάνοις
  choice: 迷惑人的灵
  rationale: πλάνος可指欺骗或使人走迷；译为“迷惑人的”清楚体现这些灵主动使人受骗的作用。
- source_word: διδασκαλίαις δαιμονίων
  choice: 鬼魔的教导
  rationale: 属格可表达来源或关联；此译保留两者之间的关系，不强行限定为单一属格类别。
theological_decisions:
- issue: “灵”的所指
  choice: 圣灵
  alternative: 某种预言之灵或人的灵
  rationale: 带定冠词的表达及保罗式预言语境最自然地指圣灵，但没有额外说明启示的具体方式。
- issue: “信仰”的含义
  choice: 共同信奉的信仰内容
  alternative: 个人的信靠或忠信
  rationale: 定冠词及上下文中与错误教导的对照支持客观的信仰内容之意，同时不在译文中引入特定宗派的背道理论。
- issue: διδασκαλίαις δαιμονίων中属格的关系
  choice: 以“鬼魔的教导”保留来源或关联的开放性
  alternative: 明确译作“源自鬼魔的教导”或“有关鬼魔的教导”
  rationale: 希腊文属格本身可表达来源或关联；简洁的所有格结构避免超出原文明定范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“明确地说”“离弃这信仰”“鬼魔的教导”保持经文的严肃警告语气；不使用古雅的“明说”“听从那引诱人的邪灵”等较传统措辞。
