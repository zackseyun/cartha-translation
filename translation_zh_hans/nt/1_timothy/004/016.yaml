  text: ἔπεχε σεαυτῷ καὶ τῇ διδασκαλίᾳ· ἐπίμενε αὐτοῖς· τοῦτο γὰρ ποιῶν καὶ σεαυτὸν σώσεις καὶ τοὺς ἀκούοντάς σου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/016.yaml
  text: Pay close attention to yourself and to the teaching[a]; persist in these things[b]. For by doing this you will save both yourself and those who listen to you.
translation:
  language: zh_hans
  text: 你要留心自己和所教导的事；要在这些事上坚持下去。[a]因为你这样做，就会救自己，也会救那些听你教导的人。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要继续持守这些事”或“要恒心行这些事”。
    reason: lexical_alternative
  - marker: b
    text: “救”也可译作“保全”；希腊语此词按语境可指拯救、保全或使人得救。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεχε
  choice: 留心
  rationale: 该命令要求持续、审慎地关注，而非一时注意。“留心”在现代汉语中自然地涵盖警醒察看和持续关注。
- source_word: σεαυτῷ
  choice: 自己
  rationale: 反身代词与ἔπεχε连用，指提摩太应当关注的对象，即他自身的生活与行为。
- source_word: τῇ διδασκαλίᾳ
  choice: 自己的教导
  rationale: διδασκαλία可指教导的行为或内容；这里既涉及提摩太所教导的内容，也与其教导职分相连。“自己的教导”比“教义”更通俗，并保留两者之间的空间。
- source_word: ἐπίμενε αὐτοῖς
  choice: 在这些事上持之以恒
  rationale: ἐπίμενε表达持续坚守，αὐτοῖς自然回指前述对自身和教导的关注。“持之以恒”传达持续且坚定的实践。
- source_word: τοῦτο γὰρ ποιῶν
  choice: 因为你这样做
  rationale: 现在分词结构在这里表达方式或伴随情形；“这样做”自然回指前面的整项劝勉。
- source_word: σώσεις
  choice: 会救
  rationale: 保留σῴζω的核心意义及其神学分量，不预先把它限缩为今生的保全，也不在译文中说明救恩如何成就。
- source_word: τοὺς ἀκούοντάς σου
  choice: 那些听你的人
  rationale: 现在分词指持续听提摩太教导的人；此译法自然、清楚，并保留持续聆听的含义。
theological_decisions:
- issue: 牧养劝勉中“救”的含义
  choice: 正文保留“救”，不将其限定为永恒救恩或现实中的保全。
  alternative: 译作“保全”或明确解释为末世性的“得救”。
  rationale: 经文把提摩太在生活和教导上的恒心，与他自己及听众的得救联系起来。译文应保留这种因果表达和神学张力，而不暗示人靠自身功劳施行救恩，也不把词义削弱为单纯的现实安全。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“留心自己和自己的教导”保留原文并列结构；“持之以恒”体现持续坚守的命令语气。两个分句都用“救”以保留原文重复和修辞力度。
