id: 1TI.4.6
reference: 1 Timothy 4:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ταῦτα ὑποτιθέμενος τοῖς ἀδελφοῖς καλὸς ἔσῃ διάκονος ⸂Χριστοῦ Ἰησοῦ⸃, ἐντρεφόμενος τοῖς λόγοις τῆς πίστεως καὶ τῆς καλῆς διδασκαλίας ᾗ παρηκολούθηκας,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/006.yaml
  text: By putting these things before the brothers[a], you will be a good servant of Messiah Jesus[c][b], being nourished by the words of the faith and of the good teaching that you have followed.
translation:
  language: zh_hans
  text: 你把这些事摆在弟兄们[a]面前，就会成为弥赛亚耶稣[b]的好仆人，并从信仰的话语[c]和你一向所遵从的美好教导中得到滋养。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”在这里可能泛指同属信徒群体的人，包括女性。
    reason: 说明希腊文阳性复数称呼在群体语境中的可能涵盖范围。
  - marker: b
    text: 或译：“基督耶稣”。“弥赛亚”和“基督”都源自“受膏者”这一称号。
    reason: 保留Χριστός的传统中文译法及其称号内涵。
  - marker: c
    text: 或译：“信心的话语”。这里的“信仰”很可能指信徒共同承认的信仰内容。
    reason: 保存τῆς πίστεως可指主观信心或客观信仰内容的语义张力。
lexical_decisions:
- source_word: Ταῦτα
  choice: 这些事
  rationale: 保留中性复数所指，承接上文的各项提醒和教导。
- source_word: ὑποτιθέμενος
  choice: 把……摆在……面前
  rationale: 既保留“放在面前”的具体意象，也自然表达向群体提出、说明这些事。
- source_word: τοῖς ἀδελφοῖς
  choice: 弟兄们
  rationale: 忠实保留希腊文阳性复数形式；在早期基督徒用语中，此称呼按语境可以泛指信徒群体，故另加脚注说明。
- source_word: καλὸς
  choice: 好
  rationale: 简明自然地表达对服事品质的肯定，不额外强化为“杰出”或“高尚”。
- source_word: διάκονος
  choice: 仆人
  rationale: 此处是对提摩太服事身份的功能性描述，并非明确指正式职分“执事”。
- source_word: Χριστοῦ Ἰησοῦ
  choice: 弥赛亚耶稣
  rationale: Χριστός在此仍保有称号意义，译为“弥赛亚”可显明其“受膏者”内涵；传统译法收入脚注。
- source_word: ἐντρεφόμενος
  choice: 得到滋养
  rationale: 表达这个分词所含的持续受喂养、受培育之意，并避免误译成主动的“滋养自己”。
- source_word: τοῖς λόγοις τῆς πίστεως
  choice: 信仰的话语
  rationale: 保留λόγοις的“话语”及πίστις的“信仰”；属格的具体关系仍有一定开放性。
- source_word: τῆς καλῆς διδασκαλίας
  choice: 美好教导
  rationale: 直接体现καλῆς的正面评价，并以现代汉语自然表达διδασκαλία。
- source_word: ᾗ παρηκολούθηκας
  choice: 你一向所遵从的
  rationale: 关系代词为阴性单数，最直接地修饰“教导”；παρακολουθέω在此兼有持续密切跟随和持守之意，“一向所遵从”能自然传达这一点。
theological_decisions:
- issue: Χριστός的称号意义
  choice: 弥赛亚耶稣
  alternative: 基督耶稣
  rationale: 主文显明Χριστός作为“受膏者”称号的含义，同时在脚注保留中文教会惯用表达。
- issue: τοῖς ἀδελφοῖς的性别与指称范围
  choice: 弟兄们
  alternative: 弟兄姊妹们／信徒们
  rationale: 主文保留原文阳性复数形式，不在译文中先行扩大；脚注说明该称呼在语境中可能包括女性信徒。
- issue: τῆς πίστεως中πίστις的含义
  choice: 信仰
  alternative: 信心
  rationale: 定冠词及其与“教导”的并列关系较支持公认信仰内容这一客观含义，但原文也可较一般地理解为“信心的话语”，故以脚注保存可能性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“摆在……面前”保留原文意象；“得到滋养”自然呈现持续受培育的含义。句法略作汉语化处理，但维持两个希腊文分词与主句之间的逻辑联系。
