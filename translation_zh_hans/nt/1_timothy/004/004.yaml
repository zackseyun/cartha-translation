id: 1TI.4.4
reference: 1 Timothy 4:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅτι πᾶν κτίσμα θεοῦ καλόν, καὶ οὐδὲν ἀπόβλητον μετὰ εὐχαριστίας λαμβανόμενον,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/004.yaml
  text: For every creation of God is good[a], and nothing is to be rejected if it is received with thanksgiving[b],
translation:
  language: zh_hans
  text: 因为上帝所造的无不美好[a]；只要怀着感恩的心领受，就没有一样是应当弃绝的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上帝所造的”也可译作“上帝所造的每一个受造之物”。希腊语κτίσμα既可指“受造物”，也可较广泛地指“所造之物”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“怀着感恩的心领受时，没有一样是可弃绝的。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 承接上文，为禁止食物不当的论断提供理由；现代汉语用“因为”能自然保留其解释和因果作用。
- source_word: πᾶν κτίσμα θεοῦ
  choice: 上帝所造的无不
  rationale: πᾶν与单数κτίσμα构成周遍表达；“上帝所造的无不……”既涵盖每一个受造之物，又避免把κτίσμα限缩为有生命的“生物”或直接改写成“食物”。
- source_word: καλόν
  choice: 美好
  rationale: 表达受造之物本有的良善，并自然呼应创造叙事的语言；此处不是说味道或品质“不错”。
- source_word: οὐδὲν ἀπόβλητον
  choice: 没有一样是应当弃绝的
  rationale: 保留绝对否定以及ἀπόβλητον“可弃绝、该拒绝”的含义；“弃绝”比“扔掉”更适合庄重语体和本段关于禁戒食物的语境。
- source_word: μετὰ εὐχαριστίας
  choice: 怀着感恩的心
  rationale: 自然表达伴随领受的感恩态度，同时保留εὐχαριστία的感谢含义。
- source_word: λαμβανόμενον
  choice: 只要……领受
  rationale: 将现在时被动分词转为汉语条件结构，清楚表达在感恩中领受这一相关情形；“只要”比单纯的“当……时”更显出此处的条件关系，但不另加教义判断。
theological_decisions:
- issue: κτίσμα的范围及其与禁戒食物语境的关系
  choice: 译作“上帝所造的”，保持广义
  alternative: 上帝所造的每一种生物；一切食物
  rationale: 上下文直接涉及食物，但原文κτίσμα意为受造之物，并未明确限于食物或生物。广义译法保留保罗以创造之善回应禁戒食物的论证。
- issue: λαμβανόμενον与μετὰ εὐχαριστίας的关系
  choice: 译为“只要怀着感恩的心领受”
  alternative: 当怀着感恩的心领受时；怀着感恩的心领受的
  rationale: 分词表达伴随领受的情形，可具有条件意味。“只要”使现代汉语关系清楚，同时未将感恩与受造之善的关系扩展为原文没有明说的系统性主张。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“无不美好”简洁保留πᾶν的周遍意义；分号呈现两个彼此紧密相连的论断。脚注标记均置于正文对应位置。
