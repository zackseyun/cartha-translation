  text: ἕως ἔρχομαι πρόσεχε τῇ ἀναγνώσει, τῇ παρακλήσει, τῇ διδασκαλίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/013.yaml
  text: Until I come[a], devote yourself to the public reading, to exhortation, to teaching.
translation:
  language: zh_hans
  text: 在我来以前，你要专心于宣读[a]、劝勉和教导。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“宣读圣经”。希腊原文只说“宣读”；按上下文，很可能是指在会众聚会中公开宣读圣经。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως
  choice: 在……以前
  rationale: 表示提摩太应持续履行这些职责，直至保罗来到；这一表达符合现代汉语习惯，并保留时间界限。
- source_word: ἔρχομαι
  choice: 我来
  rationale: 该形式在这里具有面向将来的意义；“我来”直接、自然地传达保罗预期到访。
- source_word: πρόσεχε
  choice: 要专心于
  rationale: 这里的命令要求持续投入和留意，而非一时注意；“专心于”能体现这种持久的牧养责任。
- source_word: τῇ ἀναγνώσει
  choice: 当众宣读
  rationale: ἀνάγνωσις本义为“宣读、阅读”；在教会事奉的语境中，很可能指聚会中的公开宣读。“当众宣读”表达这一语境含义，但不在正文中补入原文未明说的宾语“圣经”。
- source_word: τῇ παρακλήσει
  choice: 劝勉
  rationale: παράκλησις可指鼓励、劝勉或劝告；在宣读与教导并列的事奉语境中，“劝勉”兼具牧养关怀和劝导意味。
- source_word: τῇ διδασκαλίᾳ
  choice: 教导
  rationale: διδασκαλία在此指教导的行动或内容；“教导”是清楚自然的现代汉语，也避免把它局限为系统化的“教义”。
theological_decisions:
- issue: 是否在正文中明确把ἀνάγνωσις的对象写成“圣经”
  choice: 当众宣读
  alternative: 宣读圣经；宣读
  rationale: 上下文强烈暗示这是在会众聚会中公开宣读圣经，但希腊原文本身没有明说宾语。正文采用“当众宣读”，既反映教会聚会的可能场景，又不补入原文未写出的“圣经”；较明确的理解保留在脚注中。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“在我来以前”自然呈现时间关系；三个并列名词短语保持原文简洁的事奉指令结构。
