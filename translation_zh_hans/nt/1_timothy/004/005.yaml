  text: ἁγιάζεται γὰρ διὰ λόγου θεοῦ καὶ ἐντεύξεως.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/005.yaml
  text: for it is sanctified through the word of God and prayer[a][b].
translation:
  language: zh_hans
  text: 因为它是借着上帝的话和祷告[a]而被分别为圣的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “祷告”也可译作“祈求”或“代求”。
    reason: lexical_alternative
  - marker: b
    text: “被分别为圣”也可译作“成为圣洁”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁγιάζεται
  choice: 成为圣洁
  rationale: 现在时被动语态；主语承接上文的食物。“成为圣洁”保留被动含义与圣洁用语，同时不把它限定为道德洁净、救恩或某种特定礼仪观念。
- source_word: γὰρ
  choice: 因为
  rationale: 引出对上文所述理由的解释，现代汉语用“因为”自然清楚。
- source_word: διὰ
  choice: 借着
  rationale: διά接属格表示途径或媒介；“借着”保留这种工具性关系。
- source_word: λόγου θεοῦ
  choice: 上帝的话
  rationale: 直接表达属格结构，并保留其所指的开放性；经文本身没有进一步限定这里具体指创造宣告、经文话语，还是上帝的授权。
- source_word: ἐντεύξεως
  choice: 祷告
  rationale: 该词可指祈求或代求；在领受食物并感谢的语境中，“祷告”最自然，也不把词义过度收窄，较具体的含义列入脚注。
theological_decisions:
- issue: 上下文中“成为圣洁”的范围
  choice: 保留圣洁语言，让上下文表明所说的是食物因上帝的话和祷告而被分别出来、可以领受。
  alternative: 可直译为“被分别为圣”，或将其解释性地译成“成为可蒙悦纳的”。
  rationale: 4:3—4讨论怀着感谢领受食物。本译文既保留ἁγιάζεται的神学张力，也不擅自引入道德净化、救恩功效或特定圣礼立场。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“这是”承接上文所说的食物；语序尽量贴近希腊文的因果关系和媒介结构。
