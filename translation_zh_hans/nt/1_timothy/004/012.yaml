id: 1TI.4.12
reference: 1 Timothy 4:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μηδείς σου τῆς νεότητος καταφρονείτω, ἀλλὰ τύπος γίνου τῶν πιστῶν ἐν λόγῳ, ἐν ἀναστροφῇ, ἐν ⸀ἀγάπῃ, ἐν πίστει, ἐν ἁγνείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/012.yaml
  text: Let no one look down on your youth[a], but be an example for the believers in speech, in conduct, in love, in faith, in purity.
translation:
  language: zh_hans
  text: 不要让任何人因你年轻而轻视你；总要在言语、行为、爱心、信心[a]和纯洁上，作信徒的榜样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“忠信”。这里的希腊词既可指信心，也可指忠信。
    reason: 保留 πίστις 在此语境中的词义歧义，避免武断地限定为内在信仰或外在忠诚。
lexical_decisions:
- source_word: μηδείς ... καταφρονείτω
  choice: 不要让任何人……轻视你
  rationale: 以自然的现代汉语表达第三人称现在时命令式的禁止性劝勉；“轻视”准确传达因年轻而看低或蔑视的社会含义。
- source_word: σου τῆς νεότητος
  choice: 因你年轻
  rationale: 属格指出受轻视的缘由或方面；“因你年轻”比直译“你的青春”更符合现代汉语，也清楚表达年龄因素。
- source_word: ἀλλὰ τύπος γίνου
  choice: 总要……作……的榜样
  rationale: ἀλλά形成强烈转折，γίνου要求提摩太成为可供效法的典范；“总要”在汉语中自然承接前面的禁止命令。
- source_word: τῶν πιστῶν
  choice: 信徒的
  rationale: 这里指相信基督的人群；属格可表示提摩太要成为该群体可效法的榜样。“信徒的榜样”简洁自然。
- source_word: ἐν λόγῳ
  choice: 在言语……上
  rationale: λόγος在此德目清单中指说话或言谈；“言语”庄重且易懂。
- source_word: ἐν ἀναστροφῇ
  choice: 在……行为……上
  rationale: ἀναστροφή指生活表现或行事为人；“行为”简明地保留其广义伦理内涵。
- source_word: ἐν ἀγάπῃ
  choice: 在……爱心……上
  rationale: “爱心”在汉语基督教语境和普通现代汉语中均自然，表达作为生活品质的爱。
- source_word: ἐν πίστει
  choice: 在……信心……上
  rationale: πίστις在此既可指对神的信，也可指忠信可靠；正文采用涵盖信靠含义的“信心”，并以脚注保留另一可能。
- source_word: ἐν ἁγνείᾳ
  choice: 在……纯洁上
  rationale: ἁγνεία表示道德上的纯洁，可能尤其涉及性方面，但原文未将范围限定于贞洁；“纯洁”保留其广度。
theological_decisions:
- issue: 德目清单中 πίστις 的含义
  choice: 信心
  alternative: 忠信
  rationale: 该词在此可指内在的信靠，也可指外在的忠诚可靠。正文不将其解释为特定教义公式，采用“信心”，并在脚注注明“忠信”这一真实可能。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“言语、行为、爱心、信心和纯洁”保持原文五项并列结构；分号突出“不要……；总要……”的对照。
