lexical_decisions:
- source_word: ἐν
  choice: 出于
  rationale: 此处ἐν承接上文，表示媒介或途径；“出于”在现代汉语中自然地表达这些教导借说谎者的虚伪而来。
- source_word: ὑποκρίσει
  choice: 虚伪
  rationale: ὑπόκρισις指假装、虚假不诚；“虚伪”准确且符合现代汉语宗教伦理语境。
- source_word: ψευδολόγων
  choice: 说谎之人
  rationale: 该属格复数修饰“虚伪”，指以虚假言语为特征的人；“说谎之人”比“骗子”更贴近其言语层面的含义，也较庄重。
- source_word: κεκαυστηριασμένων
  choice: 如同被烙铁烙过
  rationale: 该完成时被动分词描绘烙印或烧灼后留下的状态。“如同被烙铁烙过”保留具体意象，又不武断判定重点究竟是被标记还是因烧灼而麻木。
- source_word: τὴν ἰδίαν συνείδησιν
  choice: 他们自己的良心
  rationale: 保留ἰδίαν的强调意味。希腊文“良心”为单数，在这里可作逐一分配理解；现代汉语用单数“良心”自然。
theological_decisions:
- issue: κεκαυστηριασμένων的隐喻含义
  choice: 保留“被烙铁烙过”的烧灼意象，不在正文中明说良心已经麻木或永久败坏。
  alternative: 译作“良心已经麻木”“良心被烙上印记”或“良心被烧灼”。
  rationale: 原文意象可能包含烙上标记或烧灼致失去知觉的意味，但没有明确限定其中一种。正文保留意象，脚注说明可能含义，以免加入不可逆沉沦等体系化结论。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“说谎之人”避免口语化的“骗子”；分号清楚显示后半句描述这些人。
