  text: ταῦτα μελέτα, ἐν τούτοις ἴσθι, ἵνα σου ἡ προκοπὴ φανερὰ ⸀ᾖ πᾶσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/015.yaml
  text: Practice these things; be in them[a], so that your progress may be evident to all.
translation:
  language: zh_hans
  text: 这些事你要勤加操练，全心投入其中[a]，使众人都能看出你的长进。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“要在这些事中”，表示深入参与、全心投入。
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: 这些事
  rationale: 复数指示代词回指前文保罗对提摩太的各项嘱咐；“这些事”自然、清楚，并保留回指范围。
- source_word: μελέτα
  choice: 勤加操练
  rationale: 此命令可涵盖用心思考与持续实践；结合教牧语境，“勤加操练”突出有意识、持续的投入，而不把含义缩减为内在默想。
- source_word: ἐν τούτοις ἴσθι
  choice: 全心投入其中[a]
  rationale: 希腊文直译为“要在这些事中”，表达深度参与和专注。“全心投入其中”在现代汉语中自然，同时以脚注保留原文意象。
- source_word: ἵνα
  choice: 使
  rationale: 表达目的或预期结果，简洁自然，不强行排除目的与结果之间的语义关联。
- source_word: σου ἡ προκοπή
  choice: 你的长进
  rationale: προκοπή表示向前推进、进步；“长进”适用于品格、教导和服事等多方面，不把范围局限于某一项。
- source_word: φανερὰ ᾖ πᾶσιν
  choice: 众人都能看出
  rationale: 自然表达“对所有人显明、可见”，保留进步具有公开可察性的含义。
theological_decisions:
- issue: 提摩太“长进”的范围
  choice: 宽泛地指他在前述教导、品行和服事职责上的可见进步
  alternative: 仅指属灵成熟，或仅指事工能力的提升
  rationale: 原文及上下文没有把 προκοπή 限定为单一方面，因此采用宽泛的“长进”，保留其综合性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“勤加操练”与“全心投入”形成递进，既传达持续实践，也传达深度专注；脚注保留希腊文较独特的空间性表达。
