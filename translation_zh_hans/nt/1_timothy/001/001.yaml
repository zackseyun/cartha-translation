base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/001.yaml
  text: Paul[a], an apostle of Messiah Jesus by the command of God our Savior and Messiah Jesus our hope[b],
translation:
  language: zh_hans
  text: 保罗，弥赛亚耶稣[a]的使徒，奉上帝——我们的救主——和弥赛亚耶稣——我们的盼望——之命，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚耶稣”两处也可译作“基督耶稣”。希腊语称号Χριστός既可按其称号含义译为“弥赛亚”，在有些语境中也可采用更像专名的传统译法“基督”。
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: 保罗
  rationale: 采用该人名在现代汉语《新约》中的通行译名。
- source_word: ἀπόστολος
  choice: 使徒
  rationale: 这是保罗自称职分的早期基督教专门用语；“使者”或“使节”过于宽泛，不能充分保留其正式职分色彩。
- source_word: Χριστοῦ Ἰησοῦ
  choice: 弥赛亚耶稣
  rationale: Χριστός在此仍带有称号意义，因此译出为“弥赛亚”；Ἰησοῦ采用通行人名“耶稣”。
- source_word: κατ’ ἐπιταγὴν
  choice: 奉……之命
  rationale: 表达按权威命令而受差遣的依据；“奉……之命”既自然庄重，也保留神圣授权的意味。
- source_word: θεοῦ σωτῆρος ἡμῶν
  choice: 我们的救主上帝
  rationale: 将σωτῆρος ἡμῶν作为θεοῦ的同位称号，明确“救主”用于上帝，同时符合现代汉语语序。
- source_word: Χριστοῦ Ἰησοῦ τῆς ἐλπίδος ἡμῶν
  choice: 我们的盼望弥赛亚耶稣
  rationale: 把“我们的盼望”作为弥赛亚耶稣的同位称号，并以自然汉语语序保留二者直接等同的紧凑表达。
- source_word: ἐλπίδος
  choice: 盼望
  rationale: “盼望”兼有期待与信靠的意味，是保罗书信中该词最稳妥且富有神学内涵的通行译法。
theological_decisions:
- issue: Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 在本节的书信开头中，该词仍可听出受膏者称号的语义，故译为“弥赛亚”；脚注保留汉语传统译名“基督”。
- issue: “我们的盼望”与弥赛亚耶稣的关系
  choice: 采用同位表达“我们的盼望弥赛亚耶稣”
  alternative: 扩展为“弥赛亚耶稣，他是我们的盼望”
  rationale: 希腊文以同格属格直接称弥赛亚耶稣为“我们的盼望”；紧凑表达可避免把原文扩写成解释性关系从句。
- issue: 命令的来源
  choice: “奉我们的救主上帝和我们的盼望弥赛亚耶稣之命”
  alternative: 仅把“之命”直接连于上帝，并将后项另行理解
  rationale: καί连接两个属格短语，最自然地表明命令来自“上帝”和“弥赛亚耶稣”这两个并列项。
translation_notes:
  register: 采用现代、庄重而易懂的书信起首语体。基本保留希腊文“保罗—使徒—奉命”的信息次序，同时按汉语习惯把“我们的”置于称号之前。句末逗号表明本节是延续至下一节的书信问安句开头。
