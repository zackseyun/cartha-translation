id: 1TI.1.18
reference: 1 Timothy 1:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ταύτην τὴν παραγγελίαν παρατίθεμαί σοι, τέκνον Τιμόθεε, κατὰ τὰς προαγούσας ἐπὶ σὲ προφητείας, ἵνα ⸀στρατεύῃ ἐν αὐταῖς τὴν καλὴν στρατείαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/018.yaml
  text: This charge I entrust to you[a], child Timothy, in accordance with the prophecies previously made about you, so that by them you may wage the good warfare[c][b],
translation:
  language: zh_hans
  text: 提摩太，我的孩子，我把这项嘱咐托付给你，是照着从前关于你[a]的那些预言，使你能凭着这些预言[b]进行那美好的征战[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“指向你”；也可能有“在你身上所说”的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译“借着这些预言”或“在这些预言中”；希腊语既可表示凭借的手段，也可表示所处的范围。
    reason: lexical_alternative
  - marker: c
    text: 传统常译“打那美好的仗”。希腊语更直译为“进行那美好的征战”，含有持续作战或参与战役的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγγελίαν
  choice: 嘱咐
  rationale: 这里指带有权威和责任的指示。“嘱咐”在现代汉语中庄重而自然，既保留郑重托付的意味，也不显得像生硬的行政命令。
- source_word: παρατίθεμαί
  choice: 托付
  rationale: 该中间语态在这里表示把某事交给对方承担和保守；“托付”能体现个人关系与责任。
- source_word: τέκνον
  choice: 我的孩子
  rationale: τέκνον直指“孩子”，在此是亲切的属灵称呼。汉语称呼中补出关系性的“我的”较自然，同时不把原文具体化为“儿子”。
- source_word: κατὰ
  choice: 照着
  rationale: κατά加宾格在此表达依据或符合；“照着”自然地把当前嘱咐与先前的预言联系起来。
- source_word: προαγούσας
  choice: 从前……的
  rationale: 该分词本义为“先行的”，在语境中具有时间意义，指此前已经发出的预言；“从前”简洁明白。
- source_word: ἐπὶ σὲ
  choice: 关于你
  rationale: ἐπί加宾格与“预言”连用，可表达指向或涉及某人。“关于你”是最清楚的现代汉语，同时以脚注保留“向着你／在你身上”的可能语感。
- source_word: προφητείας
  choice: 预言
  rationale: 复数名词指先前发出的多项或多次先知性信息；汉语“那些预言”可自然体现复数。
- source_word: στρατεύῃ
  choice: 进行
  rationale: στρατεύομαι带有从军、作战或参与战役的意象，并与同源名词στρατείαν构成同源宾语结构；汉语用“进行……征战”保留持续投身战事的意味。
- source_word: ἐν αὐταῖς
  choice: 凭着这些预言
  rationale: ἐν在此既可能表示凭借这些预言，也可能表示在其范围或引导中。“凭着”在正文中自然表达工具意义，脚注保留其他可能。
- source_word: τὴν καλὴν στρατείαν
  choice: 那美好的征战
  rationale: “征战”比惯用的“仗”更能保留στρατεία所含战役、服役或持续作战的军事意象；“美好的”对应καλήν，避免擅自缩减为单次搏斗。
theological_decisions:
- issue: 预言与提摩太受托使命的关系
  choice: 译文表明先前关于提摩太的预言是保罗这项嘱咐的依据，并可成为提摩太征战时所凭借的指引。
  alternative: 把这些预言明确解释为正式按立提摩太，或仅解释为对他的私人鼓励。
  rationale: 原文确实把先前的预言、当前的嘱咐和提摩太的征战紧密相连，却没有具体说明某种按立礼理论或把预言限定为私人鼓励，因此不在译文中补入这些解释。
- issue: ἐν αὐταῖς所表达的关系
  choice: 正文采用工具性较强的“凭着这些预言”，并在脚注中保留范围或处境意义。
  alternative: 译作“在这些预言中”，把重点完全放在征战所处的范围。
  rationale: ἐν可表达手段，也可表达领域；上下文容许两者，故以自然正文配合脚注保存歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“提摩太，我的孩子”保留亲切的师徒／属灵亲属称呼；“嘱咐”“托付”体现权威与责任而不过度行政化；“美好的征战”刻意保留原文持续性的军事隐喻。所有脚注标记均置于正文相应词语之后。
