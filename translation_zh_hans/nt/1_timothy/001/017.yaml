id: 1TI.1.17
reference: 1 Timothy 1:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τῷ δὲ βασιλεῖ τῶν αἰώνων, ἀφθάρτῳ, ἀοράτῳ, ⸀μόνῳ θεῷ, τιμὴ καὶ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/017.yaml
  text: To the King of the ages[a], immortal, invisible, the only God, be honor and glory forever and ever. Amen.
translation:
  language: zh_hans
  text: 愿尊贵和荣耀归给万世之王——那不朽的、不可见的、独一的上帝[a]，直到永永远远。阿们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“独一全智的上帝”。
    reason: textual_variant
lexical_decisions:
- source_word: βασιλεῖ τῶν αἰώνων
  choice: 万世之王
  rationale: 保留αἰών复数所表达的历世历代，同时以自然、庄重的中文传达上帝统管一切世代；避免直接化约为较具解释性的“永恒之王”。
- source_word: ἀφθάρτῳ
  choice: 永不朽坏
  rationale: 表达不受腐朽与死亡辖制；“永不朽坏”既贴近原义，也比单用较抽象的“不朽”更清楚地保留“不腐坏”的含义。
- source_word: ἀοράτῳ
  choice: 不能看见
  rationale: 自然表达上帝不可见的属性，并与上下文的属性列举相协调。
- source_word: μόνῳ θεῷ
  choice: 独一的上帝
  rationale: 直接反映SBLGNT的读法，保持经文明说的一神信仰；不把异文中的“全智”纳入正文。
- source_word: τιμὴ καὶ δόξα
  choice: 尊贵和荣耀
  rationale: “尊贵”对应τιμή，“荣耀”对应δόξα，符合现代中文颂赞语体。
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 直到永永远远
  rationale: 以通顺而庄重的中文传达该惯用语所表示的无穷久远。
- source_word: ἀμήν
  choice: 阿们
  rationale: 采用中文圣经与基督徒敬拜中通行的音译。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处δὲ轻微承接前文并引出颂赞；中文直接用“愿”开启颂赞更自然，不必增添可能过度强调转折或时间关系的连接词。
theological_decisions:
- issue: 如何表达μόνῳ θεῷ的一神论力度而不加入正文没有的教义解释
  choice: 独一的上帝
  alternative: 唯有上帝
  rationale: “独一的上帝”直接保留原文的明确宣认，不额外加入用来调和其他经文的限定，也不削弱经文本身的神学张力。
- issue: μόνῳ之后是否包括σοφῷ（“有智慧的／全智的”）
  choice: 正文省略“全智”
  alternative: 独一全智的上帝
  rationale: 所给SBLGNT正文没有σοφῷ，因此正文依此翻译；较长读法作为抄本异文收入脚注。
- issue: “万世之王”与“独一的上帝”的句法关系
  choice: 用破折号将后者作为同位说明
  alternative: 万世之王，就是那……独一的上帝
  rationale: 原文各与格成分共同指向同一位受颂赞者；破折号自然呈现同位关系，而不把属性拆分成不同对象。
translation_notes:
  register: 采用现代、庄重而易懂的颂赞语体。破折号清楚连接“万世之王”与其后的属性和同位称谓；正文中的[a]紧随异文所涉及的“独一的上帝”。
