    rationale: 中文‘不能看见’通常表示某人没有看见能力或未能看见，原文ἀοράτῳ则描述上帝为不可见的。‘不可见的’明确保留原文属性。
  - severity: low
    issue: ‘永不朽坏’略不合现代中文惯用搭配
    rationale: ἀφθάρτῳ指不朽坏、不腐败；‘不朽的’在现代庄重中文中自然且语义充分。
