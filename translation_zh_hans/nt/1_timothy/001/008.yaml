  text: Οἴδαμεν δὲ ὅτι καλὸς ὁ νόμος ἐάν τις αὐτῷ νομίμως χρῆται,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/008.yaml
  text: We know that the law is good[a], if one uses it lawfully,
translation:
  language: zh_hans
  text: 但我们知道，律法是好的，只要有人以合乎律法的方式使用它[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以合乎律法的方式”也可译作“正确地”“合宜地”或“正当地”。
    reason: 说明νομίμως的词义范围；正文保留它与“律法”的词根呼应，脚注则呈现较自然的其他译法。
lexical_decisions:
- source_word: Οἴδαμεν
  choice: 我们知道
  rationale: οἶδα虽为完成时形式，通常表达当前已经确立的认识；“我们知道”自然、准确。
- source_word: δὲ
  choice: 但
  rationale: δὲ在这里表示较轻的转折或承接；结合上文对错误教导的论述，“但”简洁地保留了这一语篇关系，不把它强化为强烈对立。
- source_word: καλὸς ὁ νόμος
  choice: 律法是好的
  rationale: καλός在此肯定律法本身的正面价值；“好的”保留其宽泛含义，不额外限定为道德高尚、优良或有益。定冠词结构译为“律法”，不在正文中擅自缩窄为“摩西律法”。
- source_word: ἐάν τις
  choice: 只要有人
  rationale: 该结构提出一般性的条件；“有人”自然表达不特指任何人的单数泛指，而“只要”在现代汉语中清楚表达条件关系。
- source_word: αὐτῷ … χρῆται
  choice: 使用它
  rationale: χράομαι意为使用、运用，αὐτῷ回指“律法”；“使用它”简明自然。
- source_word: νομίμως
  choice: 合乎律法地
  rationale: νομίμως可指合乎律法、正当或合宜；“合乎律法地”既保留其基本意义，也尽可能呈现它与νόμος（律法）的词根呼应。
theological_decisions:
- issue: “律法”的具体范围
  choice: 正文仅译作“律法”
  alternative: “摩西律法”或一般意义的“法律”
  rationale: 上下文很可能尤其涉及摩西律法，但希腊文只说ὁ νόμος。译文不替读者预先限定其神学范围。
- issue: νομίμως与νόμος的关系
  choice: 译作“合乎律法地”，保留词根呼应及其张力
  alternative: 译作“正确地”“合宜地”或“正当地”
  rationale: 原文刻意使用与“律法”同词根的副词。正文保留这种修辞关系，同时用脚注说明其较宽的语义可能，避免把意思仅限于现代法律意义上的“合法”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“合乎律法地使用它”略带修辞张力，这是为保留原文νόμος与νομίμως之间的词根呼应；脚注帮助普通读者理解其亦有“正确、合宜、正当”的意思。
