  text: ἔχων πίστιν καὶ ἀγαθὴν συνείδησιν, ἥν τινες ἀπωσάμενοι περὶ τὴν πίστιν ἐναυάγησαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/019.yaml
  text: holding faith and a good conscience[a], which some, having rejected[b], have suffered shipwreck concerning the faith.
translation:
  language: zh_hans
  text: 持守信心[b]和正直的良心[a]；有些人弃绝了这良心，就在信仰上遭遇了船难。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这良心”直译为“它”；原文的阴性单数代词最自然地指“良心”，也有人认为它较宽泛地概括“信心和正直的良心”。
    reason: alternative_reading
  - marker: b
    text: “信心”也可译作“信靠”；在这里译作“忠信”的可能性较小。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχων
  choice: 持守
  rationale: 现在时分词承接上一节隐含的主语，表示持续保有并坚守；“持守”既体现主动性，也符合劝勉语境。
- source_word: πίστιν
  choice: 信心
  rationale: 此处可指对基督的信靠，也可涵盖基督徒所持守的信仰；“信心”自然保留了这种语义幅度。
- source_word: ἀγαθὴν συνείδησιν
  choice: 良善的良心
  rationale: 直接体现ἀγαθή的道德意味，不把它缩窄为仅仅主观上“无愧”或“清白”。
- source_word: ἥν
  choice: 这良心
  rationale: 阴性单数关系代词在语法上最自然地回指最近的阴性单数名词συνείδησιν；中文明确回指，以免“将它丢弃”指代不清，同时用脚注保留较宽泛的理解。
- source_word: τινες
  choice: 有些人
  rationale: 自然表达不定复数所指，不增加原文没有的身份信息。
- source_word: ἀπωσάμενοι
  choice: 丢弃
  rationale: 表达主动而坚决地推开、拒绝；“丢弃”在现代汉语中简洁自然，也保留故意摒弃的意味。
- source_word: περὶ τὴν πίστιν
  choice: 在信仰上
  rationale: περί加宾格在此表示遭遇船难的领域或方面；定冠词使这里较自然地指向所信奉的基督徒信仰。
- source_word: ἐναυάγησαν
  choice: 遭了船难
  rationale: 保留原文鲜明的航海灾难隐喻，同时使用普通现代读者容易理解的表达。
theological_decisions:
- issue: ἥν的回指对象
  choice: 正文将其具体回指“良心”。
  alternative: 也可将它概括地理解为前面的“信心和良善的良心”两者。
  rationale: ἥν是阴性单数，最自然地与最近的阴性单数名词συνείδησιν一致；不过语义上较宽泛的概括性回指仍有可能，因此在脚注中保留。
- issue: 两处πίστις的表达
  choice: 第一处译作“信心”，第二处带冠词的短语译作“在信仰上”。
  alternative: 两处都译作“信心”，或都译作“信仰”。
  rationale: 第一处可突出持续信靠，第二处περὶ τὴν πίστιν较自然地指信仰领域。这样的区别符合上下文，但不主张两个希腊词本身具有截然不同的固定含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“良善的良心”略带圣经语体，但能直接保留原文的道德评价；“遭了船难”保留隐喻而不使用古雅的“信仰破船”等表达。
