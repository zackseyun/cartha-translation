  text: Τιμοθέῳ γνησίῳ τέκνῳ ἐν πίστει· χάρις, ἔλεος, εἰρήνη ἀπὸ θεοῦ ⸀πατρὸς καὶ Χριστοῦ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/002.yaml
  text: 'To Timothy[a], my true child in the faith: grace, mercy[b], and peace from God the Father and Messiah Jesus our Lord.'
translation:
  language: zh_hans
  text: 致提摩太——我在信仰中真正的孩子[a]：愿恩典、怜悯、平安从父神和我们的主弥赛亚耶稣[b]而来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“我在信心中真正的孩子”或“我在共同信仰中真正的孩子”。
    reason: 保留 ἐν πίστει 可指信心，也可指共同信仰领域的语义空间。
  - marker: b
    text: “弥赛亚耶稣”传统译作“基督耶稣”。
    reason: 说明 Χριστός 作为称号的译法及中文传统对应。
lexical_decisions:
- source_word: γνησίῳ
  choice: 真正的
  rationale: 表达这属灵亲子关系的真实、可靠，不暗示生理血缘；现代汉语自然易懂。
- source_word: τέκνῳ
  choice: 孩子
  rationale: 保留原文的亲子隐喻，也不把本来较宽泛的词缩窄为“儿子”。
- source_word: ἐν πίστει
  choice: 在信仰中
  rationale: 保留介词短语的领域或共同信仰之意，同时不排除“在信心中”的理解。
- source_word: χάρις
  choice: 恩典
  rationale: 准确保留保罗书信问安中惯用的神学词语。
- source_word: ἔλεος
  choice: 怜悯
  rationale: 是该词直接而庄重的现代汉语对应，也保留教牧书信问安语的特色。
- source_word: εἰρήνη
  choice: 平安
  rationale: 符合圣经问安语境，并兼具完整、安宁的含义。
- source_word: θεοῦ πατρὸς
  choice: 父上帝
  rationale: 以自然简洁的汉语表达上帝作为父的称谓关系。
- source_word: Χριστοῦ Ἰησοῦ
  choice: 弥赛亚耶稣
  rationale: 将 Χριστός 按其称号意义译为“弥赛亚”，并保留“耶稣”作为人名。
- source_word: κυρίου
  choice: 主
  rationale: 保留该称号在本句中的权柄含义和基督论分量。
theological_decisions:
- issue: ἐν πίστει 的语义范围
  choice: 在信仰中
  alternative: 在信心中；在共同的信仰中
  rationale: 译文保留它既可指信仰领域或共同信仰，也可能涉及信靠这一行动的张力，不增加原文没有的限定。
- issue: Χριστοῦ Ἰησοῦ 的译法
  choice: 弥赛亚耶稣
  alternative: 基督耶稣
  rationale: 原词仍具有称号意味，因此译出“弥赛亚”；脚注同时注明中文传统译法。
- issue: 问安句中省略的谓语
  choice: 愿……而来
  alternative: 恩典、怜悯、平安……
  rationale: 原文是无谓语的书信问安语；汉语补出愿望语气，使句子自然，但不改变恩典、怜悯和平安来自父上帝及主耶稣的内容。
translation_notes:
  register: 采用现代、庄重而易懂的书信体。“致提摩太”简洁呈现收信人；破折号连接同位说明。“愿……而来”补足汉语问安句所需的愿望语气。
