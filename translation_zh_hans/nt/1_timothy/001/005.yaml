  text: τὸ δὲ τέλος τῆς παραγγελίας ἐστὶν ἀγάπη ἐκ καθαρᾶς καρδίας καὶ συνειδήσεως ἀγαθῆς καὶ πίστεως ἀνυποκρίτου,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/005.yaml
  text: The goal of the instruction is love from a pure heart and a good conscience and sincere faith[c][b][a],
translation:
  language: zh_hans
  text: 这项嘱咐[b]的目标[a]是爱；这爱发自纯洁的心、良善的良心和真诚的信心[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “目标”也可译作“目的”或“结果”。
    reason: lexical_alternative
  - marker: b
    text: “嘱咐”也可译作“命令”或“吩咐”。
    reason: lexical_alternative
  - marker: c
    text: “真诚的信心”直译为“无伪的信心”；“信心”在此也可能有“忠信”或“信赖”的含义。
    reason: alternative_reading
lexical_decisions:
- source_word: τέλος
  choice: 目标
  rationale: 此处表示嘱咐所要达到的目的，而不是时间上的终止；“目标”在现代汉语中清楚自然。
- source_word: παραγγελίας
  choice: 嘱咐
  rationale: 该词可指命令、托付或训示；结合上下文保罗交托提摩太制止异样教导的任务，“嘱咐”既保留权威性，也适合牧养语境。
- source_word: ἀγάπη
  choice: 爱
  rationale: 直接表达本节的伦理核心，并符合该词通常的现代汉语译法。
- source_word: ἐκ
  choice: 发自
  rationale: ἐκ在此表示来源；“发自”自然地说明爱由随后列出的三项内在素质而来。
- source_word: καθαρᾶς καρδίας
  choice: 纯洁的心
  rationale: 保留心在道德和内在层面的洁净含义，语言现代而庄重。
- source_word: συνειδήσεως ἀγαθῆς
  choice: 良好的良心
  rationale: 贴近ἀγαθῆς“好的、良善的”这一基本含义，避免用“无愧”或“清白”过早限定其具体所指。
- source_word: πίστεως
  choice: 信心
  rationale: 保留πίστις最常见且在此合理的含义；“忠信”或“信赖”仍属可能，列入脚注。
- source_word: ἀνυποκρίτου
  choice: 真诚的
  rationale: 该词字面指不虚伪；“真诚的”是修饰“信心”的自然现代汉语，同时保留真伪之间的对比。
- source_word: δὲ
  choice: 而
  rationale: δὲ在此承接前文并带有轻微转折；“而”简洁地保留其篇章连接作用，不误作时间副词。
theological_decisions:
- issue: πίστις在πίστεως ἀνυποκρίτου中的含义
  choice: 信心
  alternative: 忠信；信赖
  rationale: 上下文可理解为真实无伪的信仰或信心，是爱产生的内在根源之一；但πίστις也可能侧重忠信或信赖，因此不在正文中武断排除其他语义。
- issue: 爱与后三项素质的句法关系
  choice: 将爱表述为“发自”纯洁的心、良好的良心和真诚的信心
  alternative: 将后三项理解为并列描述爱
  rationale: 希腊文三个属格短语均由ἐκ统领，最自然地共同表示爱的来源；中文分成两个分句，可清楚保留这一关系而不改变神学重点。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“而”保留δὲ的轻微承接和转折功能。为避免连续多重定语造成歧义，将希腊文单句自然拆为两个分句；分号后的“这爱”明确回指ἀγάπη，并保留ἐκ所表达的来源关系。所有脚注标记均置于正文对应词语之后。
