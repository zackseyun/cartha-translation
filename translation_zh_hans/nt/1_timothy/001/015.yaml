id: 1TI.1.15
reference: 1 Timothy 1:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: πιστὸς ὁ λόγος καὶ πάσης ἀποδοχῆς ἄξιος, ὅτι Χριστὸς Ἰησοῦς ἦλθεν εἰς τὸν κόσμον ἁμαρτωλοὺς σῶσαι· ὧν πρῶτός εἰμι ἐγώ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/015.yaml
  text: 'The saying is trustworthy and worthy of full acceptance: that Messiah Jesus came into the world to save sinners[b][a], of whom I am the foremost.'
translation:
  language: zh_hans
  text: 这话可信，值得完全接受：弥赛亚耶稣[a]来到世上，是要拯救罪人；在罪人中，我是居首的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“基督耶稣”。
    reason: 保留Χριστός可能已名称化的传统译法。
  - marker: b
    text: “居首的”也可理解为“最坏的”，或译作“罪魁”。
    reason: πρῶτος可指次序或地位上的第一；在本语境中也常被理解为罪人中最坏的。
lexical_decisions:
- source_word: πιστὸς ὁ λόγος
  choice: 这话可信
  rationale: 这是教牧书信中的固定表达，ὁ λόγος 在此指接下来所引述的可靠宣言；“这话可信”简洁、自然，并保留原文判断句的力度。
- source_word: πάσης ἀποδοχῆς ἄξιος
  choice: 值得完全接受
  rationale: ἀποδοχή 指接受、认可，πάσης 在这里加强其程度；“完全接受”既符合现代汉语，也保留原文充分、毫无保留地接受之意。
- source_word: ὅτι
  choice: 冒号引出宣言内容
  rationale: ὅτι 在此引出“可信之话”的内容，而非表达原因；汉语用冒号比直译为“即”或“因为”更自然清楚。
- source_word: Χριστὸς Ἰησοῦς
  choice: 弥赛亚耶稣
  rationale: Χριστός 在这句宣言中仍具有受膏者、弥赛亚的称号意味；译作“弥赛亚”显明称号含义，同时以脚注保留传统译法“基督耶稣”。
- source_word: ἦλθεν εἰς τὸν κόσμον
  choice: 来到世上
  rationale: 准确保留“进入世界”的行动及其神学意味；“来到世上”是现代汉语中自然庄重的表达。
- source_word: ἁμαρτωλοὺς σῶσαι
  choice: 拯救罪人
  rationale: ἁμαρτωλούς 是名词化形容词，指罪人；σῶσαι 在此具有明确的救赎语境，“拯救”准确而通行。
- source_word: ὧν πρῶτός εἰμι ἐγώ
  choice: 我就是其中居首的
  rationale: πρῶτος 可表示第一、居首或首要者，不宜在正文中直接收窄为道德评价性的“最坏”；“我就是”也传达句末 ἐγώ 的强调语气。
theological_decisions:
- issue: Χριστός 是称号还是近似专名
  choice: 正文译作“弥赛亚耶稣”
  alternative: 基督耶稣
  rationale: 原文次序为 Χριστὸς Ἰησοῦς，在宣言中可保留其称号含义；但因“基督耶稣”是历史悠久且可能反映名称化用法的译法，故列入脚注。
- issue: 保罗所说 πρῶτος 的性质
  choice: 居首的
  alternative: 最坏的；罪魁
  rationale: “最坏的”明确解释为罪恶程度最高，“罪魁”则带有强烈的既定神学和汉语修辞色彩；正文保留原词关于次序或地位的张力，脚注说明常见理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“这话可信”保持教牧书信公式的简洁；分号呈现救赎宣言与保罗自我陈述之间的紧密转折。“我就是”传达原文显式代词 ἐγώ 的强调。
