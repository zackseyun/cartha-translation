revisions:
- from: 我从前是亵渎上帝的、逼迫人的、凌辱人的[a]；然而，我蒙了怜悯[b]，因为我是在不信[c]、无知的情况下[d]做的。
  to: 我从前是亵渎者、逼迫者和施暴者[a]；然而，我蒙了怜悯[b]，因为我是在不信中[c]无知而行[d]。
  rationale: 将三个带“人的”短语改为自然、平行的名词列举；将后句改为“是在不信中无知而行”，以自然中文保留原文“在不信中”与“无知地行事”的关系，同时避免为 ποιέω 补出原文没有说明的对象。脚注也相应改为真正的词义替代译法，并保留所有正文锚点。
