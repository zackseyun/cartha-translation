  text: ⸀τὸ πρότερον ὄντα βλάσφημον καὶ διώκτην καὶ ὑβριστήν· ἀλλὰ ἠλεήθην, ὅτι ἀγνοῶν ἐποίησα ἐν ἀπιστίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/013.yaml
  text: formerly a blasphemer and a persecutor and a violent man[a]; but I was shown mercy, because I acted ignorantly in unbelief[d][c][b],
translation:
  language: zh_hans
  text: 我从前是亵渎者、逼迫者和施暴者[a]；然而，我蒙了怜悯[b]，因为我是在不信中[c]无知而行[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“横暴的人”“凶暴的人”。原词指以侮辱、蛮横的方式伤害或施暴的人，并非仅指内心骄傲。
    reason: lexical_alternative
  - marker: b
    text: 或译“我得了怜悯”。
    reason: lexical_alternative
  - marker: c
    text: 或译“失信”或“不忠”。本处更可能指没有信，而不是对盟约不忠。
    reason: lexical_alternative
  - marker: d
    text: 或译“在无知中”或“无知地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πρότερον ὄντα
  choice: 我从前是
  rationale: 承接上一节中的保罗，以自然中文表达其过去的状态，同时保留时间和分词所含的状态意味。
- source_word: βλάσφημον
  choice: 亵渎上帝的
  rationale: 在此作指人的名词性用法；中文补出通常隐含的亵渎对象“上帝”，使普通读者明确其含义。
- source_word: διώκτην
  choice: 逼迫人的
  rationale: 准确表达主动迫害他人的身份和行为，并与同列的描述保持句式平行。
- source_word: ὑβριστήν
  choice: 凌辱人的
  rationale: 该词兼有侮辱、欺凌和暴烈侵害之意；“凌辱人的”比单说“狂傲”更能保留其针对他人的恶劣行为。
- source_word: ἠλεήθην
  choice: 我蒙了怜悯
  rationale: 自然而庄重地保留希腊文被动语态，暗示施怜悯者而不擅自补明。
- source_word: ὅτι
  choice: 因为
  rationale: 保留最自然的因果或解释关系，不将无知解释为配得怜悯的功劳。
- source_word: ἀγνοῶν ἐποίησα
  choice: 我是在……无知的情况下做的
  rationale: 既表达分词所指的无知状态，也保留 ποιέω 宽泛的“做”及原文未明说宾语的特点。
- source_word: ἐν ἀπιστίᾳ
  choice: 在不信……的情况下
  rationale: 本处主要指缺乏信仰或不相信；“不信”简洁自然，同时脚注保留“失信”的词义可能。
theological_decisions:
- issue: ὅτι 所引出内容与“蒙怜悯”的关系
  choice: 译作“因为”，保留无知和不信作为保罗所得怜悯的原因或解释背景
  alternative: 译成较弱的解释关系，如“原来我……”
  rationale: ὅτι 在这里自然可表原因；直译这种关系，但不增添“无知使他配得怜悯”或其他化解张力的说明。
- issue: ἀπιστία 的含义
  choice: 不信
  alternative: 失信
  rationale: 上下文讲保罗尚未相信时的敌对行动，“不信”更切合；但该词也可表达不忠或失信，因此以脚注保留。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“亵渎上帝的、逼迫人的、凌辱人的”形成平行列举；后半句保留原文“因为”的神学张力。所有脚注标记均在正文中出现。
