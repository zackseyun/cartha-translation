  text: θέλοντες εἶναι νομοδιδάσκαλοι, μὴ νοοῦντες μήτε ἃ λέγουσιν μήτε περὶ τίνων διαβεβαιοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/007.yaml
  text: wanting to be teachers of the law[b][a], though they understand neither what they are saying nor the things about which they speak so confidently.
translation:
  language: zh_hans
  text: 想要作律法教师[b]，却既不明白自己所说的是什么，也不明白自己断然主张的是关于什么事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不明白自己在说什么，也不明白自己对什么事作出坚定的断言。”
    reason: lexical_alternative
  - marker: b
    text: “律法教师”很可能指自称有权教导犹太律法（妥拉）的人。
    reason: cultural_note
lexical_decisions:
- source_word: θέλοντες
  choice: 想要
  rationale: 保留现在分词所表达的持续意愿，并自然承接上一节隐含的主语。
- source_word: εἶναι
  choice: 做
  rationale: 与“想要”构成自然的现代汉语补语结构，表达“想要成为、充任”。
- source_word: νομοδιδάσκαλοι
  choice: 律法教师
  rationale: 准确保留该复合名词“教导律法的人”之义；正文不直接限定为“摩西律法”，脚注说明其很可能所指。
- source_word: μὴ νοοῦντες
  choice: 却不明白
  rationale: 该分词在语境中带让步或反差意味；“却”清楚传达他们企图教导而实际不懂的张力。
- source_word: μήτε ... μήτε
  choice: 也不……也不……
  rationale: 用自然汉语表达希腊文并列的双重否定。
- source_word: ἃ λέγουσιν
  choice: 自己所说的
  rationale: 指他们言说的内容；“自己”使中文指代清晰，但不增添实质信息。
- source_word: περὶ τίνων
  choice: 自己所……的
  rationale: 与后面的断言动词合译为“自己所断然主张的”，自然表达他们强烈断言所涉及的事项。
- source_word: διαβεβαιοῦνται
  choice: 断然主张
  rationale: 体现该动词强烈肯定、坚决断言的语气，比单纯“很有信心地说”更凝练，也保留批评意味。
theological_decisions:
- issue: νομοδιδάσκαλοι中“律法”的所指
  choice: 正文译作“律法教师”，不在正文中明确加上“摩西”或“妥拉”
  alternative: 摩西律法教师；妥拉教师
  rationale: 上下文很可能指犹太律法（妥拉），但希腊文本身仅用“律法”构成复合词；正文保留原文范围，脚注提供文化背景。
- issue: 两个否定分句所指内容的关系
  choice: 译为“自己所说的”与“自己所断然主张的”，保留两个并列对象
  alternative: 译作“不明白自己说的是什么，也不明白自己为何如此断言”
  rationale: 原文区分他们说出的内容与他们强烈断言所涉及的事项；不把后者解释成理由或动机，以免化解原文可能存在的重叠与张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“想要做”自然表达其企图；“却”凸显愿望与无知之间的反差；“断然主张”传达διαβεβαιοῦνται的强烈断言语气。所有脚注标记均已在正文出现。
