  text: κατὰ τὸ εὐαγγέλιον τῆς δόξης τοῦ μακαρίου θεοῦ, ὃ ἐπιστεύθην ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/011.yaml
  text: according to the gospel of the glory of the blessed God[a], which was entrusted to me.
translation:
  language: zh_hans
  text: 这与那位有福的神荣耀的福音相符；这福音是托付给我的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那位有福的神那荣耀的福音。”
    reason: “荣耀的”可将希腊文“荣耀之福音”的属格关系理解为描述性的；正文保留较开放的属格表达。
lexical_decisions:
- source_word: κατὰ
  choice: 照着……说的
  rationale: κατά加宾格在这里表示衡量前文所述之事的准则或规范。补出“说的”使中文能自然承接上文，同时保留“按照、符合”的关系。
- source_word: εὐαγγέλιον
  choice: 福音
  rationale: “福音”是保罗书信语境中通行且易懂的对应词，也保留了该词在基督教宣讲中的特定分量。
- source_word: τῆς δόξης
  choice: 荣耀之
  rationale: 采用“荣耀之福音”，尽量保留希腊文属格结构，不直接把它定解为形容词性的“荣耀的福音”。
- source_word: μακαρίου
  choice: 可称颂的
  rationale: 用于神时，μακάριος不是指侥幸或一般情绪上的快乐；“可称颂的”在现代中文中庄重自然，并表达神配受赞颂、福乐圆满的含义。
- source_word: θεοῦ
  choice: 神
  rationale: θεός在此为属格，修饰“荣耀”；译作现代中文圣经语体中自然明确的“神”。
- source_word: ὃ
  choice: 这福音
  rationale: 关系代词回指“福音”。中文重复名词比直译为关系从句更自然，也清楚标明所托付的对象。
- source_word: ἐπιστεύθην
  choice: 已经托付给我了
  rationale: 这里πιστεύω的被动式表示“受托、被交付”，而不是“相信”。译文以中文的受事结构表达其不定过去时所指的既成托付。
- source_word: ἐγώ
  choice: 我
  rationale: 保留希腊文明确出现的第一人称代词；“给我”自然表达保罗本人是受托者。
theological_decisions:
- issue: τὸ εὐαγγέλιον τῆς δόξης τοῦ μακαρίου θεοῦ中属格的关系
  choice: 那可称颂之神的荣耀之福音
  alternative: 那可称颂之神荣耀的福音
  rationale: 正文用“荣耀之福音”保留“福音—荣耀”的属格关系，避免无声地把它完全化为形容词“荣耀的”。脚注给出更符合日常中文、也可能表达描述性属格的译法。
- issue: ἐπιστεύθην的语义
  choice: 已经托付给我了
  alternative: 我相信了
  rationale: 此处被动式结合“福音”作所托付之物，表示保罗领受了传扬福音的委托；按“相信”理解不合该句法和上下文。
translation_notes:
  register: 采用现代、庄重而可理解的普通话。“这是……说的”使本节能承接前文；分号则清楚分开福音所依据的准则与保罗受托的陈述。正文保留略带书面色彩的“荣耀之福音”，以保存原文结构及其可能的神学张力。
