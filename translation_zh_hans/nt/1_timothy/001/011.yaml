  naturalness: “那可称颂之神的荣耀之福音”偏重且属格连缀不够自然。“那位有福的神荣耀的福音”在保持原文属格关系的同时更合现代庄重汉语。“这福音是托付给我的”清楚自然。
  terminology: 保留“福音”“荣耀”“神”。将μακάριος由“可称颂的”改为“有福的”，避免与“称颂／受颂赞”这一不同的希腊语词义混同。
