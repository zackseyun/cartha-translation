- from: 然而，我之所以蒙了怜悯，正是要让弥赛亚耶稣在我这个罪魁身上彰显他全部的恒久忍耐，使我成为后来那些信靠他而得永生之人的范例。
  to: 然而，我之所以蒙怜悯，是要让弥赛亚耶稣在我这罪魁身上充分彰显他所有的忍耐，作为给后来那些信靠他以得永生之人的范例。
  rationale: 修订仅处理范例短语的指向和中文搭配：以“作为给……的范例”避免将原文较宽的范例意义限定为“使保罗成为范例”，并以更自然的中文表达ἅπασαν μακροθυμίαν。保留被动式“蒙怜悯”、承接上文的“罪魁”、称号性“弥赛亚耶稣”、以及信靠所指向永生的关系。
