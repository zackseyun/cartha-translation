source:
  edition: SBLGNT
  text: ἀλλὰ διὰ τοῦτο ἠλεήθην, ἵνα ἐν ἐμοὶ πρώτῳ ἐνδείξηται ⸂Χριστὸς Ἰησοῦς⸃ τὴν ⸀ἅπασαν μακροθυμίαν, πρὸς ὑποτύπωσιν τῶν μελλόντων πιστεύειν ἐπ’ αὐτῷ εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/016.yaml
  text: But for this reason I received mercy[a], so that in me, as the foremost[d][c][b], Messiah Jesus might display all his patience as a pattern for those who were going to believe in him for eternal life.
translation:
  language: zh_hans
  text: 然而，我之所以蒙怜悯，是要让弥赛亚耶稣在我这罪魁身上充分彰显他所有的忍耐，作为给后来那些信靠他以得永生之人的范例。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠλεήθην
  choice: 蒙了怜悯
  rationale: 保留被动语态及施怜悯者未明说的特点，同时符合现代汉语的庄重表达。
- source_word: πρώτῳ
  choice: 罪魁
  rationale: 本词本义为“首要的、居首的”；结合15节“罪人中的罪魁”，这里补出“罪”使中文所指清楚，但不将其扩写为一种额外的神学判断。
- source_word: ἐνδείξηται
  choice: 彰显
  rationale: 表达公开显明、展示之意，并保留目的从句的语气。
- source_word: Χριστὸς Ἰησοῦς
  choice: 弥赛亚耶稣
  rationale: Χριστός在此保有称号意味；“弥赛亚”直接传达“受膏者”的职分含义。
- source_word: ἅπασαν μακροθυμίαν
  choice: 他全部的恒久忍耐
  rationale: “全部”体现ἅπασαν的强调；“恒久忍耐”兼顾μακροθυμία的长久忍耐与克制意味。
- source_word: ὑποτύπωσιν
  choice: 范例
  rationale: 表达供后来者参照的模式或样本，中文自然且不暗示必须机械模仿每一细节。
- source_word: τῶν μελλόντων πιστεύειν
  choice: 后来那些……之人
  rationale: μέλλω加不定式表示相对于保罗蒙怜悯之时的未来；“后来那些”比“将要”更自然地保持这一时间视角。
- source_word: πιστεύειν ἐπ’ αὐτῷ
  choice: 信靠他
  rationale: ἐπί加与格在此不仅是认同事实，也带有将信赖置于其上的意味；“信靠”简洁自然。
- source_word: εἰς ζωὴν αἰώνιον
  choice: 而得永生
  rationale: 表达εἰς所指向的目标或结果，但不进一步界定信与永生之间超出本句的系统关系。
theological_decisions:
- issue: Χριστός的译法
  choice: 弥赛亚耶稣
  alternative: 基督耶稣
  rationale: 此处将Χριστός作为带有职分含义的称号处理；“基督耶稣”是熟悉且可接受的传统译法，但较不直接显出称号本义。
- issue: 怜悯的施行者与忍耐的彰显者
  choice: 保留“蒙了怜悯”的未明说施事者，同时明确弥赛亚耶稣彰显忍耐
  alternative: 直接译成“弥赛亚耶稣怜悯了我”
  rationale: 原文被动式未明说怜悯的施行者，而目的从句明确以弥赛亚耶稣为彰显忍耐者；译文不将两者强行合并或分开。
- issue: πρῶτος的语境含义
  choice: 罪魁
  alternative: 首要的／第一个
  rationale: 承接15节时，πρῶτος最自然地指保罗自称在罪人中居首；“第一个”也可能与下文的范例意义形成呼应，但若仅如此翻译，现代中文容易误解为时间上的第一人。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“恒久忍耐”比单用“忍耐”更充分传达μακροθυμία的长久克制；句式按中文信息结构调整，同时保留因果、目的、范例及未来信徒之间的逻辑关系。
