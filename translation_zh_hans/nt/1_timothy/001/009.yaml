id: 1TI.1.9
reference: 1 Timothy 1:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰδὼς τοῦτο, ὅτι δικαίῳ νόμος οὐ κεῖται, ἀνόμοις δὲ καὶ ἀνυποτάκτοις, ἀσεβέσι καὶ ἁμαρτωλοῖς, ἀνοσίοις καὶ βεβήλοις, πατρολῴαις καὶ μητρολῴαις, ἀνδροφόνοις,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/009.yaml
  text: 'understanding this: the law is not laid down for a righteous man, but for the lawless and rebellious, the ungodly and sinful, the unholy and profane, those who kill their fathers and those who kill their mothers, murderers,'
translation:
  language: zh_hans
  text: 要知道，律法不是为义人设立的，而是为不法和悖逆的人、不敬神和犯罪的人、不圣洁和亵渎的人、弑父和弑母的人[a]、杀人者设立的，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弑父和弑母的人”也可能译作“殴打父亲和母亲的人”；这里的两个希腊词可指暴力攻击父母，不过在本段语境中，“杀害”较为可能。
    reason: 保留罕见希腊词在“殴打”与“杀害”之间的词义歧义。
lexical_decisions:
- source_word: εἰδὼς τοῦτο
  choice: 要知道
  rationale: 以自然的现代汉语表达分词的认知含义，并承接上文所述教导的根据。
- source_word: δικαίῳ
  choice: 义人
  rationale: 保留单数、代表性的称谓；汉语“义人”自然且不必额外标明性别。
- source_word: νόμος οὐ κεῖται
  choice: 律法不是……设立的
  rationale: κεῖται在此有被制定、设置之意；“设立”既保留法律语境，也避免把它直接解释为“不适用”。
- source_word: ἀνόμοις
  choice: 不法的人
  rationale: 表达无视或违背律法的道德—法律含义。
- source_word: ἀνυποτάκτοις
  choice: 悖逆的人
  rationale: 体现不肯顺服、抗拒权柄之意，且符合庄重的经文语体。
- source_word: ἀσεβέσι
  choice: 不敬神的人
  rationale: 明确表达对神缺乏敬畏的含义，并与后面的“不圣洁”“亵渎”有所区分。
- source_word: ἁμαρτωλοῖς
  choice: 犯罪的人
  rationale: 在并列的人群称谓中自然对应ἁμαρτωλοῖς，也保留其“罪人”的语义。
- source_word: ἀνοσίοις
  choice: 不圣洁的人
  rationale: 表达违背圣洁、虔敬秩序的含义。
- source_word: βεβήλοις
  choice: 亵渎的人
  rationale: 传达把神圣之事视为凡俗、加以冒犯的意味，并与ἀνόσιος区分。
- source_word: πατρολῴαις καὶ μητρολῴαις
  choice: 弑父和弑母的人
  rationale: 上下文紧接“杀人者”，因此采用较强的“杀害父母”义；罕见词也可能指殴打父母，故以脚注保留。
- source_word: ἀνδροφόνοις
  choice: 杀人者
  rationale: 简洁表达故意夺取人命者；比现代汉语中偏书面的“凶手”更贴近名词的概括性。
theological_decisions:
- issue: δικαίῳ的代表性阳性单数
  choice: 义人
  alternative: 一个义人；正义的人
  rationale: 希腊语为阳性单数，但在此具有代表性。汉语“义人”保留单数概念和神学用语习惯，而不强行加入原文在此未必强调的男性性别。
- issue: πατρολῴαις / μητρολῴαις的语义范围
  choice: 弑父和弑母的人
  alternative: 殴打父亲和母亲的人
  rationale: 这两个罕见词可指击打，也可指杀害父母。鉴于其所在恶行清单及后接“杀人者”，正文采用“弑”义，同时以脚注保留真实的词义歧义。
- issue: νόμος οὐ κεῖται的关系含义
  choice: 律法不是为义人设立的
  alternative: 律法不适用于义人
  rationale: 采用较贴近原文的“设立”，不把该句过早解释成律法对义人完全没有任何适用性，从而保留其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。以成对结构呈现恶行清单，保留原文节奏；末尾逗号表明句子在下一节继续。
