source:
  edition: SBLGNT
  text: ὑπερεπλεόνασεν δὲ ἡ χάρις τοῦ κυρίου ἡμῶν μετὰ πίστεως καὶ ἀγάπης τῆς ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/014.yaml
  text: But the grace of our Lord overflowed all the more[a], with faith and love that are in Messiah Jesus.
translation:
  language: zh_hans
  text: 然而，我们主的恩典格外丰盛，并伴随着在弥赛亚耶稣[a]里的信心和爱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“基督耶稣”。“弥赛亚”和“基督”都意为“受膏者”。
    reason: 说明 Χριστός 的另一种通行译法，并交代两种译名的同一含义。
lexical_decisions:
- source_word: ὑπερεπλεόνασεν
  choice: 格外丰盛
  rationale: 该复合动词强化“增多、丰盛”之意；“格外丰盛”既表达恩典极其充盈，也符合现代汉语的庄重表达。
- source_word: δὲ
  choice: 然而
  rationale: 此处与上文保罗的不信和罪形成转折；“然而”清楚呈现其对比作用。
- source_word: ἡ χάρις τοῦ κυρίου ἡμῶν
  choice: 我们主的恩典
  rationale: 忠实保留属格关系，并以基督教汉语中自然、通行的方式表达 χάρις 和 κύριος。
- source_word: μετὰ πίστεως καὶ ἀγάπης
  choice: 并伴随着……信心和爱
  rationale: μετά 加属格表示“同……一起”；“伴随着”明确保留信心和爱与丰盛恩典相伴的句法关系，同时不额外断定因果关系。
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: 在弥赛亚耶稣里的
  rationale: 定冠词引出的介词短语共同限定“信心和爱”。“在……里”保留保罗此处具有神学含义而又较为宽广的关系表达，不将其窄化为“来自”或“由……产生”。
- source_word: Χριστῷ Ἰησοῦ
  choice: 弥赛亚耶稣
  rationale: Χριστός 本义为“受膏者”，对应“弥赛亚”；此处保留其称号意义，而脚注注明汉语中常见的“基督耶稣”译法。
theological_decisions:
- issue: “信心和爱”与“恩典”的关系
  choice: 译为恩典丰盛，并伴随着信心和爱
  alternative: 将信心和爱明确译成恩典在保罗里面产生的结果
  rationale: 原文 μετὰ 最直接表达相伴关系；译文保留这一语法关系，不排除恩典产生信心和爱的神学含义，却不把该推论写进正文。
- issue: ἐν Χριστῷ Ἰησοῦ 的关系含义
  choice: 在弥赛亚耶稣里的
  alternative: 来自弥赛亚耶稣的／藉弥赛亚耶稣而有的
  rationale: ἐν 的含义可能涉及领域、联合或关系；直译“在……里”保留原文的丰富性和一定程度的开放性。
- issue: Χριστός 的称号意义
  choice: 弥赛亚
  alternative: 基督
  rationale: “弥赛亚”直接表达“受膏者”这一称号含义；鉴于“基督”是汉语传统且熟悉的译法，脚注同时列出。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“格外丰盛”传达强化动词的力度；“并伴随着”避免生硬直译，也不擅自说明恩典与信心、爱之间的因果关系。脚注标记紧接“弥赛亚耶稣”，使其所解释的对象清晰。
