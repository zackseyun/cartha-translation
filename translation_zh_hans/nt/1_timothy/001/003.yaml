  terminology: “以弗所”“马其顿”均为通行译名。“吩咐”恰当地表达παραγγείλῃς的权威性，未过度强化为“命令”。“别样的教义”保留ἑτεροδιδασκαλεῖν所含的差异/偏离含义，而不预先解释为“异端”或“错误教义”。
