source:
  edition: SBLGNT
  text: Καθὼς παρεκάλεσά σε προσμεῖναι ἐν Ἐφέσῳ, πορευόμενος εἰς Μακεδονίαν, ἵνα παραγγείλῃς τισὶν μὴ ἑτεροδιδασκαλεῖν
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/003.yaml
  text: Just as I urged you to remain in Ephesus when I was going into Macedonia[a], so that you might instruct certain people not to teach different doctrine,
translation:
  language: zh_hans
  text: 我往马其顿去的时候，曾劝你留在以弗所，好吩咐某些人不可传讲别样的教义，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καθὼς
  choice: （不单独译出，以“曾……好……”承接）
  rationale: 本节的“正如”结构在希腊文中尚未完结，后文也没有明确对应成分。汉语若直译“正如”会形成悬空句式，因此以自然的回顾语气表达其承接作用，同时保留本句未完待续的性质。
- source_word: παρεκάλεσά
  choice: 曾劝
  rationale: 表达恳切劝请，而不提升为直接命令；“曾”也清楚标示先前发生的劝请。
- source_word: προσμεῖναι ἐν Ἐφέσῳ
  choice: 留在以弗所
  rationale: 自然准确地表达继续停留在该地。
- source_word: πορευόμενος εἰς Μακεδονίαν
  choice: 我往马其顿去的时候
  rationale: 该分词最自然地修饰主语保罗，并在此表示时间背景。
- source_word: ἵνα
  choice: 好
  rationale: 简洁自然地表达目的关系。
- source_word: παραγγείλῃς
  choice: 吩咐
  rationale: 该词带有权威性的指示意味；“吩咐”比“劝告”更有力度，又比某些语境下的“命令”稍自然。
- source_word: τισὶν
  choice: 某些人
  rationale: 指特定但没有具名的人，保留希腊文的不确定指称。
- source_word: ἑτεροδιδασκαλεῖν
  choice: 传讲别的教导
  rationale: 保留“不同、别样的教导”这一词义，不直接强化为“异端”或“错误教义”；“传讲”在此明确是教导他人，而非仅持有某种观点。
theological_decisions:
- issue: παραγγείλῃς 在纠正教会教导的语境中应译得多强
  choice: 吩咐
  alternative: 命令；嘱咐；劝告
  rationale: 上下文涉及受托制止偏离的教导，因此需要体现权威性。“吩咐”保留这层力度，同时符合现代汉语的自然表达。
- issue: ἑτεροδιδασκαλεῖν 是否应明确译为错误或虚假的教义
  choice: 传讲别的教导
  alternative: 传讲错误的教义；传异教；作不同的教导
  rationale: 复合动词直接突出教导与既定规范不同。译为“错误的教义”虽符合上下文评价，却比词形本身更明确；本译保留原文的含义范围和神学张力。
- issue: Καθὼς 引出的比较结构是否在汉语中明示
  choice: 不使用悬空的“正如”，以回顾语气表达
  alternative: 正如我……劝过你；我曾……劝你
  rationale: 希腊文句法可能是后续论述中的省略或未完整对应结构。现代汉语若保留“正如”会显得句法残缺；本译不虚构比较的后半部，也不妨碍本节作为跨节长句的开头。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。经文按原文保留句末逗号，表明句意延续到下一节。没有设置脚注，因为正文已直接采用较强且合乎语境的“吩咐”，而真正需要保留的词义张力体现在“别的教导”中。
