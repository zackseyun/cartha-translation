  text: ὧν τινες ἀστοχήσαντες ἐξετράπησαν εἰς ματαιολογίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/006.yaml
  text: Some[a], having missed these things, have turned aside to empty talk[b],
translation:
  language: zh_hans
  text: 有些人偏离了这些，就转向空洞的言谈[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 或译：“虚妄的议论”或“无益的话”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν
  choice: 这些
  rationale: 属格复数关系代词回指第5节所述的爱、清洁的心、无亏的良心和无伪的信心。“这些”在现代汉语中自然地保留回指关系，又不把所指范围限定得过窄。
- source_word: τινες
  choice: 有些人
  rationale: 不定代词指未具体说明的一部分人；“有些人”自然清楚，并保留原文的非特指性。
- source_word: ἀστοχήσαντες
  choice: 偏离了
  rationale: 该词含有未击中目标、未达到或偏离之意。结合其属格宾语，译作“偏离了这些”既自然，也保留目标或正轨的意象。
- source_word: ἐξετράπησαν
  choice: 转向
  rationale: 该形式在此表示离开正确方向而转入另一途径；“转向”保留方向性的比喻，并与后面的 εἰς 自然衔接。
- source_word: εἰς
  choice: 向
  rationale: 表示行动所趋向的结果或领域；融入“转向”来表达，符合现代汉语习惯。
- source_word: ματαιολογίαν
  choice: 空洞的言谈
  rationale: 指徒然、无益、缺乏实质的言语。“空洞的言谈”庄重而易懂，也不额外限定为正式讨论或毫无语义的讲话。
theological_decisions:
- issue: 关系代词 ὧν 的所指
  choice: 用“这些”概括回指第5节紧邻的伦理与属灵目标。
  alternative: 明确限定为“清洁的心、无亏的良心和无伪的信心”，或更逐字地译作“从这些事上”。
  rationale: 原文依赖上文，但未在本节重列具体项目；概括回指可使句意清楚，同时不强行缩窄其范围。
- issue: ἀστοχέω 与 ἐκτρέπομαι 两个方向性动词的关系
  choice: 译为“偏离了这些，就转向……”，保留先偏离目标、继而转入空谈的推进。
  alternative: 将两词合并意译为“离开这些而陷入……”。
  rationale: 分别表达两个动词能保留原文的修辞层次及因果推进，不把人的主动偏离解释成外力所致。
translation_notes:
  register: 采用现代、庄重而通俗的书面汉语。“偏离……转向……”保留原文连续的方向性比喻；“空洞的言谈”简洁且适合教牧书信的劝诫语气。
