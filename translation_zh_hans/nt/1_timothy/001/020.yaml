id: 1TI.1.20
reference: 1 Timothy 1:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὧν ἐστιν Ὑμέναιος καὶ Ἀλέξανδρος, οὓς παρέδωκα τῷ Σατανᾷ ἵνα παιδευθῶσι μὴ βλασφημεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/020.yaml
  text: among whom are Hymenaeus and Alexander[b][a], whom I have handed over to Satan so that they may be taught not to blaspheme.
translation:
  language: zh_hans
  text: 其中有许米乃和亚历山大。我已经把他们交给撒但[a]，使他们受管教[b]，不再亵渎。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“交付撒但”。这句话很可能指严厉而以纠正为目的的管教，并不必然表示最终定罪。
    reason: lexical_alternative
  - marker: b
    text: “受管教”也可译作“受教导”“受训练”或“受纠正”；希腊语这个词包含借着纠正来塑造人的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν ἐστιν
  choice: 其中有
  rationale: 承接上文所说的一群人，保留属格关系所表达的“在这些人当中”之意，同时符合现代汉语表达。
- source_word: Ὑμέναιος καὶ Ἀλέξανδρος
  choice: 许米乃和亚历山大
  rationale: 采用现代中文圣经语境中通行且易于辨认的人名译法。
- source_word: παρέδωκα
  choice: 我已经把他们交给
  rationale: 保留“交出、交付”的强烈动作含义；“已经”自然地体现不定过去时所指的既成行动，但不把其具体执行方式写入正文。
- source_word: τῷ Σατανᾷ
  choice: 撒但
  rationale: 此处是专名性称谓，采用现代中文通行译名，不改释为“敌对者”。
- source_word: ἵνα παιδευθῶσι
  choice: 使他们受管教
  rationale: παιδεύω在此兼有教导、训练和纠正性惩戒的含义；“受管教”既切合严厉而具纠正目的的语境，也不限定为肉体刑罚。
- source_word: μὴ βλασφημεῖν
  choice: 不再亵渎
  rationale: “亵渎”保留该动词在本段宗教语境中的严重性；原文没有明说亵渎的对象，译文也不擅自补出。“不再”自然表达管教旨在停止这种行为。
theological_decisions:
- issue: “交给撒但”的含义
  choice: 正文按原文直译为“交给撒但”，并以脚注说明其很可能指严厉而以纠正为目的的管教。
  alternative: 明确译成逐出教会、神奇地使其身体受苦，或宣告其最终沉沦。
  rationale: 目的从句表明此举旨在使他们停止亵渎，因此带有纠正性质；但原文没有交代具体机制，正文不应替读者作单一化解释。
- issue: παιδευθῶσι所含的管教与教导张力
  choice: 译作“受管教”，脚注保留“受教导、训练、纠正”等可能含义。
  alternative: 仅译作“受教导”或“受惩罚”。
  rationale: 语境具有严厉纪律处分的色彩，而该词本身又指向塑造和纠正；“受管教”较能同时保存这两面。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“其中有”简洁承接上文；正文保留“交给撒但”的原文张力，并用脚注说明而不在正文中锁定具体教会纪律机制。所有脚注标记均置于对应短语之后。
