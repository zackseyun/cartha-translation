  text: πόρνοις, ἀρσενοκοίταις, ἀνδραποδισταῖς, ψεύσταις, ἐπιόρκοις, καὶ εἴ τι ἕτερον τῇ ὑγιαινούσῃ διδασκαλίᾳ ἀντίκειται,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/010.yaml
  text: the sexually immoral, men who have sex with men,[a] slave traders, liars, perjurers, and whatever else is opposed to sound teaching,
translation:
  language: zh_hans
  text: 淫乱的人、与男人发生性关系的男人[a]、拐卖人口为奴的人、说谎的人、起假誓的人，以及其他一切违背健全教导的事，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“行同性性行为的男人”。希腊词ἀρσενοκοῖται较为罕见，其确切范围存在争议；该词通常被理解为指男性之间的性行为。
    reason: alternative_reading
lexical_decisions:
- source_word: πόρνοις
  choice: 淫乱的人
  rationale: 该词泛指从事不道德性行为的人。“淫乱的人”在现代汉语中简明自然，也不把含义局限于某一种性行为。
- source_word: ἀρσενοκοίταις
  choice: 与男人发生性关系的男人
  rationale: 这是一个罕见的复合词，由表示“男性”和“床榻／性交”的成分构成，很可能呼应《七十士译本》利未记的措辞。此译法明确表达男性之间的性行为，同时避免把现代性取向或身份类别强加给原文；其确切范围存在争议，故加脚注说明。
- source_word: ἀνδραποδισταῖς
  choice: 拐卖人口为奴的人
  rationale: 该词指掳掠、奴役或贩卖人口的人。“拐卖人口为奴的人”既保留奴隶制度的明确含义，也比仅译作“绑匪”更完整。
- source_word: ψεύσταις
  choice: 说谎的人
  rationale: 直译为说谎者；此表达是自然、清楚的现代汉语。
- source_word: ἐπιόρκοις
  choice: 起假誓的人
  rationale: 该词指虚假起誓或违背誓言的人。“起假誓的人”保留誓言语境，不把含义局限于现代法庭上的伪证罪。
- source_word: καὶ εἴ τι ἕτερον
  choice: 以及其他一切……的事
  rationale: 该习语把清单开放性地扩展到其他同类事项；“其他一切”自然传达这种概括作用。
- source_word: τῇ ὑγιαινούσῃ διδασκαλίᾳ
  choice: 健全教导
  rationale: ὑγιαίνω本义与健康有关，在此比喻正确、健全。“健全教导”保留这一含义，又比术语化较强的“纯正教义”更易为普通读者理解。
- source_word: ἀντίκειται
  choice: 违背
  rationale: 该词表示处于对立或抵触状态。“违背”适合描述行为与教导之间的冲突，汉语表达简洁自然。
theological_decisions:
- issue: 如何翻译在词义及教义讨论中有争议的ἀρσενοκοίταις
  choice: 与男人发生性关系的男人
  alternative: 行同性性行为的男人；与男性同寝的人
  rationale: 主译聚焦原文所指的行为及其男性限定，不引入原文没有明确表达的现代身份或心理类别。鉴于该罕见词的确切范围仍有争议，脚注保留替代译法并说明词义问题。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。清单各项尽量保持“……的人”的平行结构；末项转为“……的事”，以自然表达原文对其他一切相违事项的概括。保留句末逗号，因为本节原文在此处仍未结束。
