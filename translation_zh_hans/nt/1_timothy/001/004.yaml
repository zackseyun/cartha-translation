revisions:
- from: 也不可专注于荒诞传说和无穷无尽的家谱；这些只会引发无益的探究[a]，并不能推进那凭着信而有的、出于上帝的安排[b][c]——
  to: 也不可留意虚构的传说和无穷无尽的家谱；这些引起徒然的探究[a]，而不是上帝在信中所施行的安排[b][c]——
  rationale: 修订以“而不是”保留 μᾶλλον ἢ 的比较性对照，避免把它扩展为绝对不能。“引起……探究，而不是……安排”尽量对应 παρέχουσι 所支配的两项结果。“上帝在信中所施行的安排”使中文句法清晰，同时保留 οἰκονομία 的开放语义，并借脚注呈现替代理解。
