source:
  edition: SBLGNT
  text: μηδὲ προσέχειν μύθοις καὶ γενεαλογίαις ἀπεράντοις, αἵτινες ⸀ἐκζητήσεις παρέχουσι μᾶλλον ἢ οἰκονομίαν θεοῦ τὴν ἐν πίστει—
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/004.yaml
  text: nor to pay attention to myths and endless genealogies[c][b][a], which promote speculations rather than the stewardship from God that is by faith—
translation:
  language: zh_hans
  text: 也不可留意虚构的传说和无穷无尽的家谱；这些引起徒然的探究[a]，而不是上帝在信中所施行的安排[b][c]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “徒然的探究”也可译作“争论”“质疑”或“查究”。原词可指查究或争辩；在这里的语境中带有无成效、徒然猜测的负面意味。
    reason: lexical_alternative
  - marker: b
    text: “上帝在信中所施行的安排”也可理解为“上帝的管理”“上帝的计划”，或“上帝所托付的管家职分”。原词可指管家职分、管理或有秩序的安排。
    reason: lexical_alternative
  - marker: c
    text: “在信中”也可译作“凭着信”；这里的“信”也可能带有“信靠”或“忠信”的意味。
    reason: alternative_reading
lexical_decisions:
- source_word: προσέχειν
  choice: 专注于
  rationale: 承接上一节的嘱咐，表达把注意力持续放在某事上；比单纯“注意”更能体现投入其中的语气。
- source_word: μύθοις
  choice: 荒诞传说
  rationale: μῦθος指缺乏可靠根据的故事或传说；加“荒诞”传达本处的负面语境，又避免“神话”在现代汉语中可能仅指特定文化传统的狭义。
- source_word: γενεαλογίαις ἀπεράντοις
  choice: 无穷无尽的家谱
  rationale: 保留“家谱”的具体含义，并以自然汉语表达ἀπέραντος所含没有尽头、纠缠不休的贬义色彩。
- source_word: ἐκζητήσεις
  choice: 无益的探究
  rationale: 该词可指深入查究，也可在本处带有争议、猜测的负面意味。“无益的探究”保留行为性质而不把它限缩为争论或臆测；其他可能见脚注。
- source_word: παρέχουσι
  choice: 引发
  rationale: 表达这些传说和家谱产生、造成探究的作用，符合παρέχω在此处的使生义。
- source_word: μᾶλλον ἢ
  choice: 只会……并不能……
  rationale: 以自然汉语呈现两个结果之间的强烈对比；“只会”传达μᾶλλον的比较强调，并与“并不能”对应。
- source_word: οἰκονομίαν θεοῦ
  choice: 出于上帝的安排
  rationale: οἰκονομία可指管理、职分或有秩序的安排；“安排”在现代汉语中较自然，并保留其范围。将θεοῦ译作来源性的“出于上帝”，同时在脚注保留其他理解。
- source_word: τὴν ἐν πίστει
  choice: 那凭着信而有的
  rationale: 将该短语作为对“安排”的限定；“凭着信”自然表达ἐν可能具有的领域或方式含义，而不把πίστις明确改释为忠信。
theological_decisions:
- issue: οἰκονομίαν θεοῦ的含义及属格关系
  choice: 出于上帝的安排
  alternative: 上帝的管理；上帝的计划；上帝所托付的管家职分
  rationale: 原文既可能指上帝所施行的有序安排，也可能指源自上帝、托付给人的管理职分。正文采用较宽泛的表达，脚注说明其他可能，以免预先锁定一种教义解释。
- issue: τὴν ἐν πίστει中πίστις的语义
  choice: 信
  alternative: 信靠；忠信
  rationale: “信”是本处最直接且不偏狭的译法。原词在语义上可能侧重信靠或忠信，因此以脚注保留这一张力。
- issue: 对比结构μᾶλλον ἢ的力度
  choice: 只会引发……并不能推进……
  alternative: 所引起的……多于……
  rationale: 语境不是对两个结果作中性数量比较，而是谴责前者妨碍后者；但译文仍以结果对比呈现，没有添加原文未明说的具体教会论结论。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“荒诞传说”避免“寓言”的儿童故事色彩；“无穷无尽的家谱”保留原文的具体意象和贬义。“推进”与后面的上帝之安排搭配，表现这些无益探究与信仰中上帝工作的对立。破折号保留该节在句法上向下文延续的形式。
