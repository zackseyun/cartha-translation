  terminology: “家谱”“信”“上帝”均合适。“传说”保留 μύθοι 的故事性；以“虚构的”表达本处贬义，比“荒诞”稍少额外的修辞强化。οἰκονομία 译为“安排”可行，但脚注应保留“管理、计划、管家职分”等语义范围。
