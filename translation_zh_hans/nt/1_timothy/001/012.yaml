id: 1TI.1.12
reference: 1 Timothy 1:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀Χάριν ἔχω τῷ ἐνδυναμώσαντί με Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν, ὅτι πιστόν με ἡγήσατο θέμενος εἰς διακονίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/012.yaml
  text: I give thanks to Messiah Jesus our Lord[a], who has strengthened me, because he considered me faithful, appointing me to ministry[b],
translation:
  language: zh_hans
  text: 我感谢我们的主弥赛亚耶稣[a]，就是那赐我力量的；因为他认为我忠信，便委派我承担服事[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督耶稣”。希腊语称号Χριστός既可按含义译作“弥赛亚”，也可按传统译作“基督”。
    reason: alternative_reading
  - marker: b
    text: 或译“派我去服事”或“委派我承担职事”。希腊语διακονία泛指服务、服事或职事。
    reason: lexical_alternative
lexical_decisions:
- source_word: Χάριν ἔχω
  choice: 我感谢
  rationale: 这是表达感恩的惯用语；“我感谢”自然、简洁，也保留了动作性。
- source_word: ἐνδυναμώσαντί με
  choice: 那赐我力量的
  rationale: 表达基督使保罗有能力、得力量的意思，同时避免把这种能力限定为某一种特殊恩赐或职权。
- source_word: Χριστῷ Ἰησοῦ
  choice: 弥赛亚耶稣
  rationale: Χριστός在此仍具有称号含义；译为“弥赛亚”可传达“受膏者”的身份，而不只把它当作固定名字。
- source_word: τῷ κυρίῳ ἡμῶν
  choice: 我们的主
  rationale: “主”是κύριος在此处自然且沿用已久的基督论称号，保留其权柄含义。
- source_word: πιστόν
  choice: 忠信
  rationale: πιστός在此可指忠诚、可靠、值得信赖；“忠信”保留这种语义幅度，不把重点仅限于能力或资格。
- source_word: ἡγήσατο
  choice: 认为
  rationale: 准确表达“看作、视为、认定”，且符合现代汉语表达。
- source_word: θέμενος
  choice: 委派
  rationale: 原义为“安置、放置”；在被置于服事中的语境里，“委派”自然传达任用和安排之意，但不暗示后期教会的特定职阶。
- source_word: εἰς διακονίαν
  choice: 承担服事
  rationale: διακονία广指服务或职事；“承担服事”既体现受托的行动，也避免把它缩窄为某种正式圣职。
theological_decisions:
- issue: Χριστός的译法
  choice: 弥赛亚耶稣
  alternative: 基督耶稣
  rationale: 此处称号意义仍然鲜明，译出“弥赛亚”能保留其语义内容；脚注同时注明传统译法。
- issue: 保罗受委派的性质
  choice: 委派我承担服事
  alternative: 把我安置在职事中；派我去服事
  rationale: 译文表达主把保罗置于服事中的行动，却不把διακονία解释成后期制度中的特定教会职位。
- issue: πιστός所表达的评价
  choice: 忠信
  alternative: 可信；可靠
  rationale: “忠信”既可表示忠诚，也含值得信赖之意，保留原词在受托服事语境中的张力；不据此断定保罗是因自身功德而被任命。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“赐我力量”比直译“使我刚强”更自然；“忠信”保留πιστός兼具忠诚与可信的含义。句末保留逗号，以反映希腊文本在下一节继续说明保罗从前的状况。
