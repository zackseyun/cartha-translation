  text: ὃν ἔπεμψα πρὸς ὑμᾶς εἰς αὐτὸ τοῦτο ἵνα γνῶτε τὰ περὶ ἡμῶν καὶ παρακαλέσῃ τὰς καρδίας ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/022.yaml
  text: 'I sent him to you for this very purpose: that you may know how we are[a], and that he may encourage your hearts.'
translation:
  language: zh_hans
  text: 我派他到你们那里去，正是为了这事：好让你们知道我们的情况[a]，并让他鼓励你们的心。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有关我们的事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: 他
  rationale: 阳性单数关系代词，承接上一节的推基古；汉语用“他”自然清楚。
- source_word: ἔπεμψα πρὸς ὑμᾶς
  choice: 我……派他到你们那里去
  rationale: 准确表达差派及朝向收信人的意思；不强行把书信体不定过去时译成完成体。
- source_word: εἰς αὐτὸ τοῦτο
  choice: 特意……为要
  rationale: 兼顾该短语所强调的明确目的，并使现代汉语句式自然。
- source_word: γνῶτε τὰ περὶ ἡμῶν
  choice: 让你们知道我们的近况
  rationale: τὰ περὶ ἡμῶν泛指与保罗及同伴有关的情形；“近况”简明自然，但原文也可较宽泛地理解，故加脚注。
- source_word: παρακαλέσῃ
  choice: 鼓励
  rationale: παρακαλέω可指鼓励、安慰或劝勉；与“你们的心”连用时，“鼓励”能较好保留牧养和坚固的意味，而不过度缩窄。
- source_word: τὰς καρδίας ὑμῶν
  choice: 你们的心
  rationale: 保留圣经常见的人论表达，在现代汉语中也自然可懂。
theological_decisions:
- issue: τὰ περὶ ἡμῶν的范围
  choice: 译作“我们的近况”
  alternative: “有关我们的事”或“我们的情形”
  rationale: 原文既可包括个人状况，也可包括周遭处境；正文采用自然表达，脚注保留其较宽泛的语义。
- issue: παρακαλέσῃ的语义
  choice: 译作“鼓励”
  alternative: “安慰”或“劝勉”
  rationale: 此处语境侧重坚固收信人的内心；“鼓励”较能涵盖支持与振奋，同时不引入特定教派解释。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“特意……为要”体现目的的强调；保留“你们的心”这一圣经意象。
