  text: 使你会顺利，并在地上长寿[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在那地”，呼应出埃及记20:12和申命记5:16中第五条诫命的措辞。
    reason: 说明ἐπὶ τῆς γῆς按本节可译为“在地上”，也可能因十诫背景理解为“在那地”。
lexical_decisions:
- source_word: ἵνα
  choice: 使
  rationale: 引出前述命令所附带的目的或结果；“使”简洁自然，也保留应许与命令之间的联系。
- source_word: εὖ σοι γένηται
  choice: 你凡事顺利
  rationale: 这是表示境况良好的惯用结构。“凡事顺利”符合现代汉语表达，又不过度具体化福祉的内容。
- source_word: καὶ
  choice: 并
  rationale: 连接两个并列的应许结果，语气庄重流畅。
- source_word: ἔσῃ μακροχρόνιος
  choice: 长寿
  rationale: 字面为“成为长久活着的人”；汉语“长寿”准确、自然地表达其谓语意义。
- source_word: ἐπὶ τῆς γῆς
  choice: 在世上
  rationale: 按本节希腊文本的宽泛措辞翻译为“在世上”，不擅自补入旧约诫命较具体的应许之地含义；“地上”亦可，但“世上”与“长寿”搭配更自然。
theological_decisions:
- issue: ἐπὶ τῆς γῆς 与第五条诫命中土地应许的关系
  choice: 在世上
  alternative: 在那地
  rationale: 以本节现存希腊措辞为准，保留其较宽泛的范围，不把出埃及记20:12和申命记5:16的具体土地表述直接补入正文；同时用脚注说明其对第五条诫命措辞的呼应。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“凡事顺利”表达希腊语惯用结构，“长寿”凝练地传达谓语形容词的含义。
