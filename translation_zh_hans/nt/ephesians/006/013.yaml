  text: διὰ τοῦτο ἀναλάβετε τὴν πανοπλίαν τοῦ θεοῦ, ἵνα δυνηθῆτε ἀντιστῆναι ἐν τῇ ἡμέρᾳ τῇ πονηρᾷ καὶ ἅπαντα κατεργασάμενοι στῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/013.yaml
  text: Therefore take up the full armor of God[a], so that you may be able to withstand in the evil day, and having done everything[d][c][b], to stand firm.
translation:
  language: zh_hans
  text: 所以，要拿起上帝的全副军装[a]，使你们在邪恶的日子[c]能够抵挡[b]，并且在完成一切之后[d]站立。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“完整的军装”。希腊语指士兵的全套装备。“上帝的”也可理解为属于上帝或由上帝提供的。
    reason: lexical_alternative
  - marker: b
    text: 或译“抗拒”或“站住抵抗”。
    reason: lexical_alternative
  - marker: c
    text: “邪恶的日子”可泛指邪恶或考验特别强烈的时期，不一定只指某个特定的末世事件。
    reason: alternative_reading
  - marker: d
    text: 或译“做完一切之后”或“成就了一切之后”。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 所以
  rationale: 简洁自然地承接上文，保留推论关系。
- source_word: ἀναλάβετε
  choice: 拿起
  rationale: 该命令式动词表示拿起、取用；“拿起”贴合士兵装备自己的军事意象，又不与表示“穿上”的其他动词混同。
- source_word: τὴν πανοπλίαν τοῦ θεοῦ
  choice: 上帝的全副军装
  rationale: “全副军装”表达πανοπλία所指士兵的完整装备；“上帝的”保留属格的宽度，不限定为上帝亲自穿戴的军装或上帝赐下的军装。
- source_word: ἵνα δυνηθῆτε
  choice: 使你们……能够
  rationale: 同时表达目的和能力，符合现代汉语表达。
- source_word: ἀντιστῆναι
  choice: 抵挡
  rationale: 在军事语境中表示抗拒、迎敌并守住阵地；“抵挡”自然地保留这种对抗意味。
- source_word: ἐν τῇ ἡμέρᾳ τῇ πονηρᾷ
  choice: 在邪恶的日子
  rationale: 较贴近原文，并保留其所指的开放性，可泛指邪恶势力集中显现或严峻考验的时期。
- source_word: ἅπαντα κατεργασάμενοι
  choice: 在做完一切之后
  rationale: κατεργάζομαι可指完成、办成或实行；“做完一切”保持宽泛，不擅自加入得胜或克服一切的含义。
- source_word: στῆναι
  choice: 仍站立得稳
  rationale: 在军装和抵挡的语境中，该动词具有守住阵地的意味；“站立得稳”用自然汉语传达这种坚定，“仍”体现经过一切之后依然站立的语境关系。
theological_decisions:
- issue: “邪恶的日子”的所指
  choice: 保留为一般性的邪恶或属灵冲突时期
  alternative: 专指末世的某一日，或仅指个人受试炼的一天
  rationale: 原文没有明确把该短语限定为单一的末世事件或个人经历，因此译文不缩窄其范围。
- issue: “上帝的军装”中属格的含义
  choice: 译作“上帝的”，不进一步界定
  alternative: “上帝所穿的军装”或“上帝所赐的军装”
  rationale: 希腊语属格可包含归属、来源等相关意味；保留宽泛表达可避免超出原文作神学限定。
- issue: κατεργασάμενοι的结果意味
  choice: 译作“做完一切”，不明确加入得胜含义
  alternative: “战胜一切”或“成就一切”
  rationale: 该分词可表示完成所需之事，但本句未明说其宾语具体为何；宽泛译法保留原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“全副军装—抵挡—站立得稳”维持原文连贯的军事意象；语序稍作汉语化处理，同时保留目的从句和末尾的强调。
