  text: Τὰ τέκνα, ὑπακούετε τοῖς γονεῦσιν ὑμῶν ἐν κυρίῳ, τοῦτο γάρ ἐστιν δίκαιον·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/001.yaml
  text: Children[a], obey your parents in the Lord, for this is right.
translation:
  language: zh_hans
  text: 儿女们，你们要在主里[a]听从父母，因为这是合宜的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在主里”也可理解为“作为属主的人”或“与主联合”。这句话可能说明听从父母所处的范围或方式，也可能暗示这种听从以忠于主为界限。
    reason: 说明ἐν κυρίῳ的词义及修饰范围存在真实歧义。
lexical_decisions:
- source_word: Τὰ τέκνα
  choice: 儿女们
  rationale: 复数呼格直接称呼家庭中的子女。“儿女们”自然、准确地表达亲子关系，也明确包含男女。
- source_word: ὑπακούετε
  choice: 听从
  rationale: 现在时主动命令语气要求持续、响应性的顺服。“听从”在现代汉语中既保留“听”的词义背景，也清楚表达服从命令。
- source_word: τοῖς γονεῦσιν ὑμῶν
  choice: 你们的父母
  rationale: γονεῦσιν为复数，统称父母；加上“你们的”对应ὑμῶν。汉语正文中因语境可简作“父母”，但此处保留所属关系以贴近原文。
- source_word: ἐν κυρίῳ
  choice: 在主里
  rationale: 保留保罗书信中紧凑而富神学含义的表达，不预先限定它究竟强调与主联合的身份、听从的范围或方式。
- source_word: δίκαιον
  choice: 对的
  rationale: 此处指道德上正确、合宜。“对的”是普通现代读者易懂且符合本句伦理语境的表达。
theological_decisions:
- issue: “在主里”（ἐν κυρίῳ）的修饰范围
  choice: 将其放在命令之内，译作“在主里听从父母”，同时不进一步解释其确切含义。
  alternative: 可理解为“属于主的儿女要听从父母”，或“要以在主里合宜的方式听从父母”。
  rationale: 希腊文最自然地使ἐν κυρίῳ与命令相关，但它可能表示听从所处的属灵范围或方式，也可能暗示对主的忠诚界定这种听从。直译可保留原文的开放性和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“儿女们”保留直接称呼；“听从”比单纯“听”更准确，又比“顺服”更日常。脚注标记置于相关短语之后，以便脚注明确解释“在主里”，而非“父母”。
