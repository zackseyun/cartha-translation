  to: 为了让你们也知道关于我的事[a]和我在做什么，推基古——这位亲爱的弟兄、在主里忠心的服事者[b]——会把一切告诉你们。
  rationale: 修订保留原文的目的关系、收信人“也”的强调，以及τὰ κατ’ ἐμέ与τί πράσσω两个并列的认知内容；同时避免把δέ强化为转折，并以现代汉语自然的同位语结构呈现推基古的称谓。脚注锚点和脚注内容均保留并与正文对应。
