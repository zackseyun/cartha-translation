  text: Ἵνα δὲ ⸂εἰδῆτε καὶ ὑμεῖς⸃ τὰ κατ’ ἐμέ, τί πράσσω, πάντα ⸂γνωρίσει ὑμῖν⸃ Τυχικὸς ὁ ἀγαπητὸς ἀδελφὸς καὶ πιστὸς διάκονος ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/021.yaml
  text: So that you also may know the things concerning me[a], what I am doing, Tychicus, the beloved brother and faithful minister in the Lord[b], will make everything known to you.
translation:
  language: zh_hans
  text: 为了让你们也知道关于我的事[a]和我在做什么，推基古——这位亲爱的弟兄、在主里忠心的服事者[b]——会把一切告诉你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“关于我的事”。
    reason: lexical_alternative
  - marker: b
    text: “服事者”也可译作“仆人”；在某些语境中，该词可指“执事”。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἵνα δὲ
  choice: 但为了让
  rationale: ἵνα引出目的，δὲ带有轻微的转折或承接作用；“但为了让”既保留连接语气，也自然引出目的。
- source_word: εἰδῆτε καὶ ὑμεῖς
  choice: 你们也知道
  rationale: καί与明确的ὑμεῖς共同强调收信人“也”应当知道，译文保留这一附加意味。
- source_word: τὰ κατ’ ἐμέ
  choice: 我的情况[a]
  rationale: 该希腊语表达字面指“关于我的事”，在此自然指保罗的处境或近况；“我的情况”简洁自然，同时以脚注保留较字面的表达。
- source_word: τί πράσσω
  choice: 我在做什么
  rationale: 直译并保留其可指保罗正在从事什么、近来如何行动的开放性。
- source_word: πάντα γνωρίσει ὑμῖν
  choice: 会把一切都告诉你们
  rationale: γνωρίζω意为使人知道、告知；此译法在现代汉语中自然，并保留πάντα“一切”的范围。
- source_word: Τυχικὸς
  choice: 推基古
  rationale: 采用中文圣经传统中通行且易辨认的人名译法。
- source_word: ὁ ἀγαπητὸς ἀδελφὸς
  choice: 亲爱的弟兄
  rationale: 既表达ἀγαπητός的深厚情感，也保留早期基督徒彼此称为“弟兄”的群体用语。
- source_word: πιστὸς διάκονος
  choice: 忠心的服事者[b]
  rationale: διάκονος在此未必指正式职分；“服事者”保留其服务和事奉的功能含义，又避免预先断定为“执事”。
- source_word: ἐν κυρίῳ
  choice: 在主里
  rationale: 保留保罗书信中常见的关系或领域表达，不将其化约为普通的身份修饰。
theological_decisions:
- issue: 推基古的διάκονος身份
  choice: 服事者
  alternative: 仆人；执事
  rationale: 上下文强调推基古是可信赖的同工和传信者，却没有明确指出正式教会职分。“服事者”既反映实际服事，也不导入后期教会体制。
- issue: ἀδελφός的性别与群体称谓
  choice: 弟兄
  alternative: 手足；兄弟
  rationale: 这里指男性同工推基古，因此“弟兄”在性别和早期信徒群体语境中都准确。
- issue: ἐν κυρίῳ与πιστὸς/διάκονος的关系
  choice: 在主里忠心的服事者
  alternative: 主里忠信的执事；服事主的忠心仆人
  rationale: 保留“在主里”的关系性和一定的修饰歧义，不把它明确改写成“服事主”，也不把διάκονος职分化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。为避免汉语长句中主语与插入性同位语过度堆叠，将希腊文单句自然分为两句；信息次序与逻辑关系保持不变。
