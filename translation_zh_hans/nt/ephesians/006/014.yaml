  text: στῆτε οὖν περιζωσάμενοι τὴν ὀσφὺν ὑμῶν ἐν ἀληθείᾳ, καὶ ἐνδυσάμενοι τὸν θώρακα τῆς δικαιοσύνης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/014.yaml
  text: Stand[a], therefore, having fastened your waist with truth and having put on the breastplate of righteousness[b],
translation:
  language: zh_hans
  text: 所以，要站立：以真理束好你们的腰，穿上公义的胸甲[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”也可译作“正义”。原文所用的词可同时包含正直和公正的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: στῆτε
  choice: 要站稳
  rationale: 该词是第二人称复数不定过去时主动命令式，要求众人采取坚定的站立姿态。结合上下文反复出现的“站立”主题，译作“站稳”自然明确；不另加“坚定地”等更强解释。
- source_word: οὖν
  choice: 所以
  rationale: 表示由前文劝勉所得出的推论；“所以”在现代汉语中自然地保留逻辑衔接。
- source_word: περιζωσάμενοι τὴν ὀσφὺν ὑμῶν
  choice: 束紧你们的腰
  rationale: 分词描写与站立命令相关的预备动作。原文直接以“你们的腰”为宾语，并未出现“腰带”一词，因此不在正文中增补“真理的腰带”。“束紧”既传达束腰动作，也符合披挂军装的意象。
- source_word: ἐν ἀληθείᾳ
  choice: 用真理
  rationale: ἐν 可表达凭借、手段或范围；“用真理”在汉语中自然，同时不把原文明确改写成“真理的腰带”。ἀλήθεια 也可能涵盖真实、诚实，正文保留较宽的“真理”。
- source_word: ἐνδυσάμενοι
  choice: 穿上
  rationale: 这是穿戴衣服或军装的常用动词；“穿上”简洁、自然，并保留装备意象。
- source_word: θώρακα
  choice: 胸甲
  rationale: 指保护胸部和躯干的军用护甲。“胸甲”是清楚、凝练且符合经文意象的现代汉语名称。
- source_word: δικαιοσύνης
  choice: 公义
  rationale: 在保罗书信中该词可涉及正直、义与公正。“公义”在此既适合属灵军装的比喻，也比单译“正义”更能保留其较广的神学和伦理范围。
theological_decisions:
- issue: δικαιοσύνη在属灵军装比喻中的含义
  choice: 公义
  alternative: 正义
  rationale: “公义”可涵盖与神正确的关系、正直品格和合宜行为，而原文也可能突出公正、正义的一面；正文不限定公义究竟专指神所赐的地位还是信徒的伦理实践，脚注保留“正义”这一词义可能。
- issue: ἀλήθεια是客观真理还是诚实品格
  choice: 真理
  alternative: 真实／诚实
  rationale: 原文简洁，可能同时指福音真理及由真理塑造的真实、诚实。正文采用“真理”，不把两者强行二选一。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“所以，要站稳”保留主命令及其与前文的推论关系；两个动作短语用汉语并列表达，使句子流畅。保留句末逗号，以反映本节句法在下一节继续。
