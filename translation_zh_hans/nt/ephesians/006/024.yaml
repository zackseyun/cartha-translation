  text: ἡ χάρις μετὰ πάντων τῶν ἀγαπώντων τὸν κύριον ἡμῶν Ἰησοῦν Χριστὸν ἐν ⸀ἀφθαρσίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/024.yaml
  text: Grace be with all who love our Lord Jesus the Messiah with incorruptibility[a].
translation:
  language: zh_hans
  text: 愿恩典与所有爱我们主耶稣弥赛亚的人同在，在不朽中[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿恩典与所有以不朽之爱爱我们主耶稣弥赛亚的人同在”；也可理解为“真诚地爱”或“以永不止息的爱来爱”。希腊语“在不朽中”措辞简练，所修饰的对象和确切含义并不完全确定。
    reason: 保留ἐν ἀφθαρσίᾳ在句法和语义上的真实歧义，并提供较自然的解释性译法。
lexical_decisions:
- source_word: χάρις
  choice: 恩典
  rationale: 保留保罗书信结尾祝福语的惯用神学词汇；句中补出“愿”，自然表达希腊语省略动词的祝愿语气。
- source_word: μετὰ πάντων
  choice: 与所有……的人同在
  rationale: μετά加属格表示“与……同在”；按现代汉语语序，把“所有”与后面的分词关系从句组合起来。
- source_word: ἀγαπώντων
  choice: 爱……的人
  rationale: 将现在时主动分词按名词性关系结构处理，表达这些人持续而具有特征性的爱。
- source_word: κύριον ἡμῶν
  choice: 我们的主
  rationale: κύριος在此是基督论称号，译作“主”比“主人”更贴合上下文；同时保留“我们的”。
- source_word: Ἰησοῦν Χριστόν
  choice: 耶稣弥赛亚
  rationale: 把Χριστός作为称号按其含义译作“弥赛亚”，而非仅作固定姓名的音译“基督”；汉语无需另加冠词。
- source_word: ἐν ἀφθαρσίᾳ
  choice: 在不朽坏中
  rationale: 采用较形式对应的表达，保留原文短语在句法所指和语义上的含混，不在正文中限定它只修饰“爱”或只指“真诚”。“朽坏”与ἀφθαρσία所否定的败坏、衰残概念直接对应。
theological_decisions:
- issue: ἐν ἀφθαρσίᾳ所修饰的对象及含义
  choice: 正文保留“在不朽坏中”这一简练而有意保持开放的表达
  alternative: 可理解为“以不朽之爱”、“真诚地”或“以永不止息的爱”
  rationale: 希腊语没有明确说明ἀφθαρσία只描述信徒的爱，也可能涉及祝福所处的境界或特质。若正文直接译成“不朽的爱”或“真诚地爱”，便会排除其他真实可能性，因此将较顺畅的解释列入脚注。
translation_notes:
  register: 采用现代、庄重而可诵读的书信祝福语体。“愿……同在”符合现代汉语宗教文本的自然表达；末尾较不寻常的“在不朽坏中”是为保留原文歧义而有意采用，并以脚注帮助普通读者理解。
