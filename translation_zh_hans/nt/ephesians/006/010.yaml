base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/010.yaml
  text: Finally[a], be strengthened in the Lord and in the strength of his might.
translation:
  language: zh_hans
  text: 最后[a]，你们要在主里，凭着他大能的力量得以刚强。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“最后，你们要在主里刚强起来。”原文动词也可作这种较习惯的表达；“得以刚强”则较明显地保留了领受力量的语感。
    reason: 词义与语态的翻译选择
lexical_decisions:
- source_word: Τοῦ λοιποῦ
  choice: 最后
  rationale: 在这里用作篇章转换语，引出书信末段的劝勉；“最后”自然、简洁，也符合上下文结构。
- source_word: ἐνδυναμοῦσθε
  choice: 得着刚强
  rationale: 该动词为现在时被动／中间语态命令式。“得着刚强”保留领受力量的意味，避免把劝勉仅仅表达为凭自身意志“刚强起来”。
- source_word: ἐν κυρίῳ
  choice: 在主里
  rationale: 保留保罗常用的关系或领域表达，不将ἐν过度限定为单纯的施事或工具含义。κύριος按此处语境译为“主”。
- source_word: ἐν τῷ κράτει τῆς ἰσχύος αὐτοῦ
  choice: 凭着他大能的力量
  rationale: 中文以“凭着”自然表达此处力量的凭借；“大能的力量”保留κράτος与ἰσχύς叠加形成的强调，同时避免生硬重复。
- source_word: αὐτοῦ
  choice: 他
  rationale: 代词自然回指前面的“主”，无需重复名词。
theological_decisions:
- issue: ἐνδυναμοῦσθε的语态与力量来源
  choice: 译作“得着刚强”，突出受劝者从主领受力量
  alternative: 译作“刚强起来”或“要刚强”
  rationale: 被动／中间语态容许较习惯化的主动式理解，但此处上下文明确把刚强与主及其能力相连；正文保留领受力量的语感，同时不进一步规定具体的神学机制。
- issue: ἐν κυρίῳ中ἐν的关系含义
  choice: 译作“在主里”
  alternative: 译作“靠着主”
  rationale: “在主里”保留原文可能包含的关系、联合或领域意味；“靠着主”虽自然，却会更明确地限定为工具或依靠关系。
- issue: κύριος的所指与译法
  choice: 译作“主”
  alternative: 译作“主人”
  rationale: 在保罗书信语境中，“主”是自然且庄重的称谓，并可由上下文指向基督，无需在正文中增补解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在主里”保留保罗式关系语言；“凭着他大能的力量”使叠加的能力词在中文中可读，同时维持原文的强调。
