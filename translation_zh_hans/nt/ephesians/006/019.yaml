  text: καὶ ὑπὲρ ἐμοῦ, ἵνα μοι δοθῇ λόγος ἐν ἀνοίξει τοῦ στόματός μου, ἐν παρρησίᾳ γνωρίσαι τὸ μυστήριον τοῦ εὐαγγελίου
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/019.yaml
  text: and for me[a], that words may be given to me in opening my mouth, to make known with boldness the mystery of the gospel[e][d][c][b],
translation:
  language: zh_hans
  text: 也请为我祷告，愿我开口时有话语赐给我，好让我放胆讲明福音的奥秘。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ὑπὲρ ἐμοῦ
  choice: 也请为我祷告
  rationale: 本句承接上一节的祷告请求；补出“祷告”使汉语句意完整，“为我”准确表达ὑπέρ加属格在此处“为……代求”的意思。
- source_word: ἵνα μοι δοθῇ λόγος
  choice: 使……有话赐给我
  rationale: 保留“赐给”的被动表达及神所赐予的含义；λόγος在这里指说话的内容，用“有话”比“一个信息”更自然，也不把它限定为专门术语。
- source_word: ἐν ἀνοίξει τοῦ στόματός μου
  choice: 我开口的时候
  rationale: 既保留“开口”的原文意象，也以自然汉语表达开始说话之时。
- source_word: ἐν παρρησίᾳ
  choice: 放胆
  rationale: 表达公开、坦然且勇敢发言的意味；“放胆”在现代圣经语体中庄重而易懂。
- source_word: γνωρίσαι
  choice: 讲明
  rationale: 兼顾“使人知道”的基本意义和口头传讲的语境，且与前面的“开口”“有话”衔接自然。
- source_word: τὸ μυστήριον τοῦ εὐαγγελίου
  choice: 福音的奥秘
  rationale: 保留属格关系和保罗书信中的核心术语；“奥秘”指先前隐藏、如今显明的神圣旨意，并非难以破解的谜题。
theological_decisions:
- issue: λόγος所指的是措辞、话语还是信息
  choice: 译为“有话赐给我”
  alternative: “有信息赐给我”或“赐我当说的话”
  rationale: 原文单数λόγος可指话语或所说的内容。“有话赐给我”保留一定语义宽度，既不只指发声能力，也不把它过度确定为一篇完整的信息。
- issue: παρρησία的语气
  choice: 译为“放胆”
  alternative: “坦然无惧地”或“坦率地”
  rationale: 该词兼有公开坦率和勇敢无惧的意味；本段处于受捆锁仍传福音的语境，“放胆”能体现这种张力，而不把它缩减为主观自信。
- issue: “福音的奥秘”的属格关系
  choice: 保留为“福音的奥秘”
  alternative: “奥秘，就是福音”或“关于福音的奥秘”
  rationale: 原文属格可容纳关联、内容等细微关系；直译保留其真实含混性，不擅自将二者解释为同位关系。
translation_notes:
  register: 采用现代、庄重而自然的普通话。补出承上省略的“祷告”，避免汉语残句；其余尽量保留原文的赐予、开口、放胆及奥秘等意象和神学张力。
