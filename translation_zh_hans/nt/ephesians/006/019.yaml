  rationale: 修订仅处理汉语句法与语体。“愿……有话语赐给我”保留 δοθῇ 的被动及其未明说的施事，不额外明定为“神”；“开口时”对应 ἐν ἀνοίξει τοῦ στόματός μου；“好让我放胆讲明”自然表达赐下话语与 γνωρίσαι 之间的目的关系，未缩窄 παρρησία 或 μυστήριον 的含义。
