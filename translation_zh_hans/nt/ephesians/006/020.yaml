base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/020.yaml
  text: for which I am an ambassador in chains[a], so that in it I may speak boldly[c][b], as I ought to speak.
translation:
  language: zh_hans
  text: 我为此[a]作使者，身陷锁链之中[b]，好让我能在其中[c]放胆说话，照我所当说的去说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “此”最可能指上一节的“福音的奥秘”；也可较宽泛地理解为福音或福音的宣讲。希腊文关系代词为中性。
    reason: alternative_reading
  - marker: b
    text: 希腊文直译为“在一条锁链中”。这里以锁链的形象表示受囚禁；中文译作“身陷锁链之中”。
    reason: lexical_alternative
  - marker: c
    text: 直译为“在其中”。这个中性代词很可能仍指福音或福音的奥秘；也可理解为“在传讲这事时”。
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ οὗ
  choice: 为此
  rationale: οὗ是中性单数关系代词，最自然地回指上一节“福音的奥秘”。“为此”既表达ὑπέρ所含“为了、为着”的意思，也避免在正文中把所指过度限定死。
- source_word: πρεσβεύω
  choice: 作……使者
  rationale: 该动词指以使者或特使的身份履行使命；“作使者”保留正式代表的含义，同时符合现代汉语表达。
- source_word: ἐν ἁλύσει
  choice: 带锁链
  rationale: 希腊文直译为“在一条锁链中”，以锁链形象表示受囚禁；“带锁链”在汉语中自然，并保留具体意象。
- source_word: ἵνα
  choice: 好让
  rationale: ἵνα引出目的；“好让”以自然的现代汉语清楚表达这一目的关系。
- source_word: ἐν αὐτῷ
  choice: 在这事上
  rationale: αὐτῷ在此为中性单数，最可能回指福音或福音的奥秘。“在这事上”保留中性所指及关联范围，且不误译为人格性的“在他里面”。
- source_word: παρρησιάσωμαι
  choice: 放胆发言
  rationale: 该动词兼有坦然、公开和勇敢说出的意思；“放胆发言”保留言说行为及勇气色彩。
- source_word: ὡς δεῖ με λαλῆσαι
  choice: 照我所当说的去说
  rationale: δεῖ表达必要或责任；“所当说的”保留应当如此的责任意味，并保留原文与前一言说动词的重复。
theological_decisions:
- issue: 两个中性代词的所指
  choice: 将ὑπὲρ οὗ和ἐν αὐτῷ理解为回指福音或“福音的奥秘”，正文分别译作“为此”和“在这事上”。
  alternative: 可在语境中明确译为“为这奥秘”及“在传讲这奥秘时”；也有人把后者理解为“在他里面”，但其人格性解释与这里的中性语法形式不相称。
  rationale: 关系代词οὗ和代词αὐτῷ均为中性单数，强烈支持回指上一节中性的“奥秘”或更广义的福音之事。正文采用不过度明确的表达，以保留其具体所指和关联方式上的余地。
- issue: 使者身份与受囚禁状态的张力
  choice: 保留“带锁链的使者”这一并置形象。
  alternative: 可意译为“我虽被囚，仍作使者”，但会加入原文未明说的让步关系。
  rationale: 原文直接把使者身份与锁链并列，形成神学和修辞上的张力；不应通过增添“虽然”而替作者解释这种关系。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“作带锁链的使者”刻意保留原文中正式使者身份与囚禁状态的鲜明并置；末句保留“发言／说”的重复，以体现希腊文παρρησιάσωμαι与λαλῆσαι的双重言说表达。
