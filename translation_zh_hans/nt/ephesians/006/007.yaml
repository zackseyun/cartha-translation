  text: μετ’ εὐνοίας δουλεύοντες, ὡς τῷ κυρίῳ καὶ οὐκ ἀνθρώποις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/007.yaml
  text: serving with goodwill[a], as to the Lord and not to men,
translation:
  language: zh_hans
  text: 要甘心服事，像是服事主，而不是服事人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετ’ εὐνοίας
  choice: 甘心
  rationale: μετά加属格表示伴随的态度或方式；εὔνοια指善意、乐意或良好意愿。译作“甘心”自然简洁，并突出服事时内在的乐意态度。
- source_word: δουλεύοντες
  choice: 服事
  rationale: δουλεύω本可指“作奴隶、服劳役”。本段上文已明确受话者是奴隶，此处重在他们如何履行服役，因此译作“服事”既符合语境，也避免生硬重复身份称谓。
- source_word: ὡς
  choice: 像是
  rationale: ὡς在这里引出服事所指向的比较或态度。译作“像是”保留比较表达，不额外强化为纯粹假设。
- source_word: τῷ κυρίῳ
  choice: 服事主
  rationale: κύριος在此与属人的对象形成对比，并在《以弗所书》的语境中自然指向主耶稣。译作“主”保留其基督论称号；补出“服事”使中文关系清楚。
- source_word: ἀνθρώποις
  choice: 服事人
  rationale: ἄνθρωποι为泛指的人类，与“主”相对。现代汉语的“人”准确涵盖这一含义，无须加入性别限定；补出“服事”形成清楚而自然的对照。
theological_decisions:
- issue: κύριος与地上主人的对比
  choice: 主
  alternative: 主人
  rationale: “主”保留了对基督的称号，也避免与上下文中的地上主人混淆。
- issue: δουλεύοντες所含奴役语义的表达强度
  choice: 服事
  alternative: 像奴隶一样服役
  rationale: 上下文已经明确交代受话者的奴隶身份，本节采用自然的“服事”表达其行动，不掩盖语境，也不在此处增加原文未明说的重复说明。
- issue: 人所接受的服事与主所接受的服事之间的关系
  choice: 像是服事主，而不是服事人
  alternative: 仿佛是给主做的，不是给人做的
  rationale: 保留ὡς带出的比较方式，同时维持“主”与“人”的鲜明对照，不把句意扩展为否认地上主人实际接受其劳动。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“甘心服事”简洁传达内在意愿；“主”与“人”的对照清楚，并与本段奴隶和主人的社会语境相容。
