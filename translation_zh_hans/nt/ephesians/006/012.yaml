id: EPH.6.12
reference: Ephesians 6:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅτι οὐκ ἔστιν ἡμῖν ἡ πάλη πρὸς αἷμα καὶ σάρκα, ἀλλὰ πρὸς τὰς ἀρχάς, πρὸς τὰς ἐξουσίας, πρὸς τοὺς κοσμοκράτορας τοῦ ⸀σκότους τούτου, πρὸς τὰ πνευματικὰ τῆς πονηρίας ἐν τοῖς ἐπουρανίοις.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/012.yaml
  text: For our struggle is not against flesh and blood[a], but against the rulers, against the authorities, against the world-rulers of this darkness[c][b], against the spiritual forces of evil in the heavenly realms.
translation:
  language: zh_hans
  text: 因为我们所进行的搏斗，不是针对血肉之人[a]，而是针对执政的、针对掌权的、针对这黑暗的世界统治者[b]，以及针对天上领域中邪恶的属灵势力[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “搏斗”也可译作“争战”；“血肉之人”直译为“血和肉”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“管辖这黑暗世界的”。也可理解为“管辖现今这黑暗世界的”，但原文没有明说“现今”。
    reason: lexical_alternative
  - marker: c
    text: “天上领域中”也可译作“在天上各处”或“在天上之处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλη
  choice: 争战
  rationale: 本词本指摔跤、近身搏斗；“争战”在现代中文中自然庄重，也保留了激烈对抗的意味。脚注补出更贴近字面的“搏斗”。
- source_word: πρὸς αἷμα καὶ σάρκα
  choice: 对象不是血肉之人
  rationale: 希腊文直译为“对着血和肉”，是指有血有肉的人。中文“血肉之人”既保留原有意象，也清楚表达这里所指的人类对手。
- source_word: ἀρχάς
  choice: 执政的
  rationale: 在保罗书信的语境中，本词可指具有统治地位的权势；“执政的”保留其统治含义，并与下文“掌权的”形成对应。
- source_word: ἐξουσίας
  choice: 掌权的
  rationale: 本词表示权柄或具有权柄者；“掌权的”自然地指向拥有权势的存在。
- source_word: κοσμοκράτορας τοῦ σκότους τούτου
  choice: 管辖这黑暗世界的
  rationale: κοσμοκράτορας 是“世界统治者”的复合词。此译表达其管辖世界的含义，同时把 τοῦ σκότους τούτου 与其统治范围联系起来；脚注保留另一种较贴近语法表面的译法。
- source_word: τὰ πνευματικὰ τῆς πονηρίας
  choice: 邪恶的属灵势力
  rationale: 中性复数形容词在此作名词使用，结合上下文指属灵的邪恶存在或势力；“属灵势力”清楚传意而不过度具体化为某一类灵体。
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: 天上领域里
  rationale: 本短语在《以弗所书》中反复出现，表示属天的领域；“天上领域里”是现代中文中清楚而宽广的表达，避免把它窄化为某个具体地点。
theological_decisions:
- issue: 本节所列敌对者的性质
  choice: 译文将它们呈现为超越人类的邪恶属灵势力。
  alternative: 这些称谓主要指人间统治者和制度，或同时包括属灵权势及其在人间的表现。
  rationale: “管辖世界的”与“邪恶的属灵势力”等词语累积出现，直接指向超人类的属灵敌对者；译文没有进一步断定这些势力是否也借人间制度表现出来。
- issue: σάρξ 在本节中的含义
  choice: 在“血和肉”这一组合中理解为有血有肉的人，而非“罪性”。
  alternative: 把 σάρξ 解释为“罪性”或“犯罪本性”。
  rationale: 这里的固定组合 αἷμα καὶ σάρκα 指人类有限而具身体的生命，不是保罗在其他语境中用 σάρξ 表达的伦理或神学意义。
- issue: τοῦ σκότους τούτου 与 κοσμοκράτορας 的关系
  choice: 正文译为“管辖这黑暗世界的”，把黑暗理解为这些统治者所管辖的世界之特征。
  alternative: 译为“这黑暗的世界统治者”，把“这黑暗”理解为其所属或性质。
  rationale: 希腊语属格可以表达范围、归属或特征，中文正文采用较自然且符合语境的表达，脚注保留较形式对应的译法，以免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以“那些执政的、掌权的”保留原文反复使用 πρὸς 所形成的列举节奏；后两项用“是……”延续强调。避免传统但较难懂的“执政的、掌权的、管辖幽暗世界的天空属灵气”等压缩表达，并以脚注保留关键词语和句法上的可译空间。
