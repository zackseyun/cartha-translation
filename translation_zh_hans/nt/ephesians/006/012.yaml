revisions:
- from: 因为我们争战的对象不是血肉之人[a]，而是那些执政的、掌权的，是管辖这黑暗世界的[b]，是天上领域里邪恶的属灵势力[c]。
  to: 因为我们所进行的搏斗，不是针对血肉之人[a]，而是针对执政的、针对掌权的、针对这黑暗的世界统治者[b]，以及针对天上领域中邪恶的属灵势力[c]。
  rationale: 修订将“这黑暗”重新与“世界统治者”直接关联，避免把原文未明说的“黑暗世界”为其统治范围写入正文；同时逐项重复“针对”，以反映 πρὸς 的连续列举。其余关键术语保持草稿的现代、庄重表达，并以脚注保留可行的替代译法。
