  text: Οἱ δοῦλοι, ὑπακούετε τοῖς ⸂κατὰ σάρκα κυρίοις⸃ μετὰ φόβου καὶ τρόμου ἐν ἁπλότητι τῆς καρδίας ὑμῶν ὡς τῷ Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/005.yaml
  text: Slaves[a], obey your masters according to the flesh with fear and trembling, in sincerity of your heart, as to Messiah[b],
translation:
  language: zh_hans
  text: 奴隶们[a]，你们要顺服按肉身说的主人[b]，以恐惧战兢、真诚的心，如同顺服弥赛亚[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴隶”也可译作“奴仆”，指处于主人权下、受奴役的人，并非一般受雇的仆人。
    reason: lexical_alternative
  - marker: b
    text: 直译“按肉身说的主人”，指只在现世、属人的关系中作主人的人。
    reason: lexical_alternative
  - marker: c
    text: 希腊文为Χριστός，意为“受膏者”；传统常译作“基督”。
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλοι
  choice: 作奴隶的
  rationale: 在这一家庭关系语境中，该词指处于主人权下、受奴役的人；译为“奴隶”可避免用“仆人”淡化原有的社会现实。
- source_word: ὑπακούετε
  choice: 顺服
  rationale: 这里是现在时命令语气，要求持续听从并服从；“顺服”自然地表达这种关系中的服从要求。
- source_word: κατὰ σάρκα κυρίοις
  choice: 肉身关系上的主人
  rationale: κατὰ σάρκα限定主人与奴隶之间属于现世、人的层面的关系，并与对弥赛亚的关系形成对照；此译法保留“肉身”的原文意象，同时避免误解为“有罪本性”。
- source_word: μετὰ φόβου καὶ τρόμου
  choice: 怀着恐惧战兢
  rationale: 保留保罗固定表达的强烈修辞力度，不把φόβος弱化为单纯的“尊敬”。
- source_word: ἐν ἁπλότητι τῆς καρδίας ὑμῶν
  choice: 以真诚的心
  rationale: ἁπλότης在此表示真诚、不虚假和内心专一；“真诚的心”是清楚自然的现代汉语。
- source_word: ὡς τῷ Χριστῷ
  choice: 如同顺服弥赛亚
  rationale: ὡς保留比较意义，并未把地上的主人等同于弥赛亚；补出“顺服”符合汉语表达，也承接本句主要动词。
theological_decisions:
- issue: Χριστῷ的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: Χριστός在这里具有称号功能；“弥赛亚”直接传达“受膏者”这一称号意义。脚注同时注明传统译法，以免遮蔽术语对应关系。
- issue: δοῦλοι在奴隶制度语境中的译法
  choice: 奴隶
  alternative: 仆人；奴仆
  rationale: 上下文明确涉及主人与受其权辖者的家庭制度关系，因此不宜用较温和的词掩盖受奴役的身份。
- issue: κατὰ σάρκα所限定的权柄范围
  choice: 肉身关系上的
  alternative: 属世的；按肉身说的
  rationale: 该短语说明这些人只是在现世、人际层面作主人。译文保留“肉身”意象，但不把它解释成“罪性”，也不暗示这种权柄与弥赛亚的权柄相同。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“恐惧战兢”保留原文固定表达的力度；“肉身关系上的主人”略带原文色彩，并由脚注说明，以保存κατὰ σάρκα的真实张力和范围限制。
