  text: τίμα τὸν πατέρα σου καὶ τὴν μητέρα, ἥτις ἐστὶν ἐντολὴ πρώτη ἐν ἐπαγγελίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/002.yaml
  text: Honor your father and mother—which is the first commandment with a promise—[a]
translation:
  language: zh_hans
  text: “要尊敬你的父亲和母亲。”这是第一条带着应许的诫命[a]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“这是在应许中的第一条诫命。”这里的意思可能是：这是第一条伴有应许的诫命。
    reason: 说明 ἐν ἐπαγγελίᾳ 的字面结构及通常的语境理解，同时保留一定的解释余地。
lexical_decisions:
- source_word: τίμα
  choice: 要尊敬
  rationale: 该词为命令语气，要求人以实际行动尊崇父母，不仅是内心敬重；“尊敬”自然、庄重，也保留十诫引文的伦理分量。
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: 你的父亲和母亲
  rationale: 直接对应亲属称谓，并保留单数第二人称所有关系；现代汉语表达清楚自然。
- source_word: ἥτις
  choice: 这是
  rationale: 回指刚引用的整条诫命；汉语用“这是”比直译关系代词更自然，并清楚引出保罗的说明。
- source_word: ἐντολὴ
  choice: 诫命
  rationale: 上下文引用十诫，“诫命”比一般性的“命令”更能保留其经文和盟约背景。
- source_word: πρώτη
  choice: 第一条
  rationale: 保留序数含义，不译作“最重要的”，以免加入原文未明确表达的价值排序。
- source_word: ἐν ἐπαγγελίᾳ
  choice: 带着应许的
  rationale: 希腊文形式上是“在应许中”，在此自然理解为这条诫命伴有应许；该译法简明，同时以脚注保留原文结构及其解释空间。
theological_decisions:
- issue: “第一条诫命”与十诫次序的关系
  choice: 这是第一条带着应许的诫命
  alternative: 这是第二块法版中的第一条诫命；这是带着应许的首要诫命
  rationale: 译文保留“第一”的序数意义，并把 ἐν ἐπαγγελίᾳ 自然表达为“带着应许”，但不引入特定的十诫分组或编号体系，也不把“第一”解释成“最重要”。脚注说明较直译的形式，以保留原文的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“要尊敬”体现命令语气；引文后以句号和“这是”引出解释，末尾破折号承接下一节对应许的内容。脚注标记已置于正文相应位置。
