base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/008.yaml
  text: knowing that each one[a], whatever good he does, this he will receive back from the Lord[b], whether slave or free.
translation:
  language: zh_hans
  text: 你们知道，每个人无论做什么善事，都必从主那里领受相应的报偿[a]，无论是奴隶还是自由人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“都必从主那里领受这善事所应得的”或“都必从主那里得到”。原文动词可指领受或得到与所行之事相应的结果。
    reason: 词义说明；保留原文“领受／得到”的较宽泛表达，并说明其与所行善事的对应关系。
lexical_decisions:
- source_word: εἰδότες
  choice: 你们知道
  rationale: 该词是复数分词，在句中承接并支持前文的劝勉。“你们知道”在现代汉语中自然，也保留了认知基础；不直接译成“因为你们知道”，以免把隐含的因果意味说得过满。
- source_word: ἕκαστος
  choice: 每个人
  rationale: 保留逐一、无一例外的分配性重点，同时用现代汉语自然表达其代表性用法。
- source_word: ὃ ἂν ποιήσῃ ἀγαθόν
  choice: 无论做了什么善事
  rationale: 关系从句与ἄν表达不确定、概括性的“无论什么”；“善事”自然传达ἀγαθόν所指行为的道德性质。
- source_word: τοῦτο κομίσεται
  choice: 都必……得回相应的回报
  rationale: κομίσεται可指得到、领回与行为相应的结果；结合回指前述善事的τοῦτο，以“得回相应的回报”表达对应和回报之意，同时用脚注保留较贴近形式的译法。
- source_word: παρὰ κυρίου
  choice: 从主那里
  rationale: παρά加属格表示来源；“主”保留保罗语境中很可能指向基督的称谓，不因家仆语境而改译为“主人”。
- source_word: δοῦλος
  choice: 奴隶
  rationale: 本节明确与ἐλεύθερος对举，社会身份上的受奴役状态是重点；“奴隶”比“仆人”更准确地保留历史现实。
- source_word: ἐλεύθερος
  choice: 自由人
  rationale: 指与奴隶相对、具有自由社会身份的人；“自由人”在汉语中清楚完整。
theological_decisions:
- issue: 家规语境中δοῦλος的译法
  choice: 奴隶
  alternative: 仆人；奴仆
  rationale: 本节以“奴隶”和“自由人”直接对举，不能淡化其中受奴役与自由身份的区别。
- issue: κυρίου的所指与译法
  choice: 主
  alternative: 主人
  rationale: 虽然上下文涉及地上的主人，但此处报偿的来源是“主”，很可能指升高的基督；译作“主”既保留这一神学分量，也不把所指局限为人间主人。
- issue: 善行所得结果的表述
  choice: 得回相应的回报
  alternative: 得回他所做的；从主那里得到报偿
  rationale: 原文强调人将从主领受与所行善事相应的结果，但没有具体说明回报的形态；译文保留对应关系，不进一步界定为今世报酬或末世奖赏。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“你们知道”自然承接前文；“奴隶”和“自由人”准确保留古代社会身份的鲜明对比。
