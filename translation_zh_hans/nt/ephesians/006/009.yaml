id: EPH.6.9
reference: Ephesians 6:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Καὶ οἱ κύριοι, τὰ αὐτὰ ποιεῖτε πρὸς αὐτούς, ἀνιέντες τὴν ἀπειλήν, εἰδότες ὅτι καὶ ⸂αὐτῶν καὶ ὑμῶν⸃ ὁ κύριός ἐστιν ἐν οὐρανοῖς, καὶ προσωπολημψία οὐκ ἔστιν παρ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/009.yaml
  text: And masters[a], do the same things toward them, giving up threatening, knowing that both their Master and yours is in heaven[c][b], and there is no partiality with him.
translation:
  language: zh_hans
  text: 你们作主人的，也要同样待他们[a]，不要再威吓他们[b]；因为你们知道，他们和你们同有一位在天上的主[c]，他并不偏待人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也要照样对待他们。”原文紧密呼应上一节的吩咐，强调主人也须以相应的态度待奴仆。
    reason: lexical_alternative
  - marker: b
    text: 或译：“停止威胁他们”或“放弃威吓人的做法。”
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“在诸天之中”；这里按现代汉语习惯译作“在天上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριοι
  choice: 作主人的
  rationale: 这里承接前文奴仆与主人的家庭关系，指现实社会中的主人；译作“作主人的”既自然，也与后文指神的“主”形成清楚而不失原文呼应的对照。
- source_word: τὰ αὐτὰ ποιεῖτε πρὸς αὐτούς
  choice: 也要同样待他们
  rationale: “同样待他们”保留与前文训诫的呼应和彼此相应的伦理要求，比逐字译作“向他们做同样的事”更符合现代汉语。
- source_word: ἀνιέντες τὴν ἀπειλήν
  choice: 不要再威吓他们
  rationale: ἀνίημι在此表示停止、放弃某种做法；与ἀπειλή合译为“不要再威吓”，自然表达停止以威胁相待的命令。
- source_word: εἰδότες
  choice: 因为你们知道
  rationale: 分词在此说明命令的根据；用“因为”明示其因果功能，符合自然汉语，同时不增加原文没有的神学判断。
- source_word: καὶ αὐτῶν καὶ ὑμῶν ὁ κύριος
  choice: 他们和你们同有一位……主
  rationale: 保留双方都在同一位主之下的重点，并将神圣称号κύριος译为“主”。“同有一位”自然传达原文两个καί所强调的双方共同归属。
- source_word: ἐν οὐρανοῖς
  choice: 在天上的
  rationale: 原文为复数“诸天”，但这里是常见的空间性宗教表达；“在天上的”是现代汉语自然对等说法。
- source_word: προσωπολημψία οὐκ ἔστιν παρ’ αὐτῷ
  choice: 他并不偏待人
  rationale: προσωπολημψία指按外在身份偏私待人。“不偏待人”是清楚、庄重且惯用的现代汉语表达；将παρ’ αὐτῷ自然转为以“他”为主语。
theological_decisions:
- issue: 同一节中κύριος用于地上的主人和天上的主
  choice: 前者译“作主人的”，后者译“主”
  alternative: 两处都译作“主人”
  rationale: 汉语需要区分社会身份与神圣称号，但“主人／主”的共同词根仍能保留原文的修辞对照：地上的主人自己也在天上的主权之下。
- issue: 如何表达双方与天上之主的关系
  choice: 他们和你们同有一位在天上的主
  alternative: 他们的主人和你们的主人都在天上
  rationale: 所选译法准确反映单数的ὁ κύριος，避免使人误以为双方各有一位不同的主人，同时突出身份高低不同的人共同受同一位主统辖。
- issue: 古代家庭制度中的身份用语
  choice: 作主人的
  alternative: 雇主；所有者
  rationale: “雇主”会将古代奴仆关系现代化，“所有者”则过度突出法律所有权；“作主人的”较完整保留历史语境和经文的伦理锋芒。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“不要再威吓他们”直接有力；分号划分命令与理由。“同有一位……主”既清晰表达单一共同的主，也保留地上主人受天上之主约束的张力。所有脚注标记均置于对应正文之后。
