source:
  edition: SBLGNT
  text: ⸀ἐν πᾶσιν ἀναλαβόντες τὸν θυρεὸν τῆς πίστεως, ἐν ᾧ δυνήσεσθε πάντα τὰ βέλη τοῦ ⸀πονηροῦ πεπυρωμένα σβέσαι·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/016.yaml
  text: In all circumstances[a], taking up the shield of faith[c][b], with which you will be able to extinguish all the flaming arrows of the evil one.
translation:
  language: zh_hans
  text: 无论在什么情况下[a]，都要拿起信心的盾牌；借着这盾牌，你们就能扑灭那恶者[b]的一切燃烧的箭[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“此外”或“在这一切之上”。希腊语短语也可理解为在前述各件军装之外再拿起盾牌。
    reason: alternative_reading
  - marker: b
    text: 或译：“邪恶”。希腊语既可指有位格的“那恶者”，也可作抽象意义理解。
    reason: alternative_reading
  - marker: c
    text: “箭”所译的希腊语泛指射出的武器或投射物，也可译作“镖”。传统上有译作“火箭”的，但现代汉语中容易产生别的联想。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πᾶσιν
  choice: 在各种情况下
  rationale: 该短语可作副词性表达，意为“在一切情形中”。结合整段劝勉，译作“在各种情况下”自然清楚；“此外／在这一切之上”这一结构性理解保留于脚注。
- source_word: ἀναλαβόντες
  choice: 还要拿起
  rationale: 不定过去时分词承接前文的劝勉，表达伴随的行动。汉语用“还要拿起”既衔接军装清单，也避免生硬复制分词形式。
- source_word: θυρεὸν
  choice: 盾牌
  rationale: θυρεός指盾牌，常指能遮护身体的大盾；正文用通行、易懂的“盾牌”，不额外强化其尺寸。
- source_word: τῆς πίστεως
  choice: 信心的
  rationale: πίστις在此最自然地指信靠，作为盾牌这一比喻的属灵对应。“信心”是现代汉语基督教语境中清楚而通行的表达。
- source_word: ἐν ᾧ
  choice: 靠着它
  rationale: 介词短语在此表达手段，关系代词回指盾牌；“靠着它”自然传达“借此／用它”的工具意义。
- source_word: δυνήσεσθε
  choice: 你们就能
  rationale: 保留将来能力的含义；汉语“就能”与前述拿起盾牌的行动构成自然结果关系。
- source_word: βέλη
  choice: 箭
  rationale: βέλος泛指射出的武器或投射物。在此军事图像中译作“箭”直观自然，同时在脚注说明其词义范围。
- source_word: τοῦ πονηροῦ
  choice: 那恶者
  rationale: 带冠词的阳性／中性属格形式可理解为有位格的“那恶者”，也可抽象理解为“邪恶”。属灵争战和攻击者的语境较支持有位格的读法。
- source_word: πεπυρωμένα
  choice: 燃烧的
  rationale: 该完成时被动分词本义为“已经点燃的”。“燃烧的”既保留火焰图像，也避免现代汉语“火箭”容易让人联想到火箭弹的歧义。
- source_word: σβέσαι
  choice: 扑灭
  rationale: σβέννυμι表示熄灭火焰；“扑灭”与燃烧之箭的形象搭配自然，并准确表达使其失去作用。
theological_decisions:
- issue: τοῦ πονηροῦ是指有位格的恶者还是抽象的邪恶
  choice: 那恶者
  alternative: 邪恶
  rationale: 属灵争战及敌方攻击的上下文更适合有位格的理解，但希腊语形式容许抽象读法，因此在脚注保留另一可能。
- issue: πίστις在盾牌比喻中的含义
  choice: 信心
  alternative: 信靠；忠信
  rationale: 此处重点是信徒倚靠上帝以抵挡攻击，故“信心”最贴合上下文；“信靠”可表达其动态内涵，而“忠信”虽属可能词义，却不如前者适合本句。
- issue: ἐν πᾶσιν与前文军装项目的关系
  choice: 在各种情况下
  alternative: 此外；在这一切之上
  rationale: 该短语可被理解为涵盖所有处境，也可理解为在前述军装之外再拿起盾牌。正文采用副词性读法，脚注保留真实的句法歧义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“还要”使本节与前文军装清单自然衔接；用“燃烧的箭”而不用“火箭”，以免现代读者误解为火箭弹。标点以分号分隔拿起盾牌与其功用，使句意清晰。
