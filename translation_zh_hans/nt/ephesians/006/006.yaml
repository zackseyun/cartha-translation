  text: μὴ κατ’ ὀφθαλμοδουλίαν ὡς ἀνθρωπάρεσκοι ἀλλ’ ὡς ⸀δοῦλοι Χριστοῦ ποιοῦντες τὸ θέλημα τοῦ θεοῦ, ἐκ ψυχῆς
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/006.yaml
  text: not by eye-service[a], as people-pleasers, but as slaves of Messiah[c][b], doing the will of God from the soul.
translation:
  language: zh_hans
  text: 不要只在有人看着时才做工[a]，像那些讨好人的人一样；却要像弥赛亚的奴隶[b]一样，发自内心地[c]遵行上帝的旨意。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“按眼前服事”；指只在别人看着时才服事，或只做表面工夫。
    reason: lexical_alternative
  - marker: b
    text: “弥赛亚”也常译作“基督”；希腊文为 Christos，意为“受膏者”。“奴隶”也可译作“奴仆”或“仆人”。
    reason: alternative_reading
  - marker: c
    text: 或译“全心全意”或“从心里”；希腊文直译为“从魂／心灵深处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀφθαλμοδουλίαν
  choice: 只在有人看着时才做工
  rationale: 这个罕见复合词直译为“眼前的服役”，指只在受人监督时才认真做工。正文采用自然的现代汉语表达其实际含义，脚注保留原文的形象。
- source_word: ἀνθρωπάρεσκοι
  choice: 讨好人的人
  rationale: 准确表达为求人的认可而迎合人的贬义，现代汉语自然易懂。
- source_word: δοῦλοι
  choice: 奴隶
  rationale: 本段直接谈及奴隶，且这里借此说明他们归属于弥赛亚；“奴隶”保留了原词所含的隶属和受约束意味，力度强于“仆人”。
- source_word: Χριστοῦ
  choice: 弥赛亚
  rationale: Χριστός意为“受膏者”，此处保留其称号含义；脚注说明传统音译“基督”。
- source_word: ποιοῦντες
  choice: 遵行
  rationale: 与“上帝的旨意”搭配时，“遵行”比机械直译“做”更符合现代汉语，同时仍表达将旨意付诸行动。
- source_word: θέλημα
  choice: 旨意
  rationale: 指上帝所要人实行的事；“上帝的旨意”是庄重、清楚而通行的表达。
- source_word: ἐκ ψυχῆς
  choice: 发自内心
  rationale: 表达行动源于人的内在生命和真诚意愿，汉语自然；脚注保留“从魂里”的字面信息及“全心全意”的可能表达。
theological_decisions:
- issue: 家庭训令语境中δοῦλοι的译法
  choice: 弥赛亚的奴隶
  alternative: 弥赛亚的仆人／奴仆
  rationale: 上下文所面对的是实际的奴隶，而本句又以他们对弥赛亚的归属重新界定其服役。“奴隶”保留这种现实处境及归属关系，没有以较弱的“仆人”淡化张力。
- issue: Χριστοῦ作为称号还是惯用名称的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: “弥赛亚”传达“受膏者”这一称号的意义；“基督”是通行的音译形式，列入脚注，以保留两种表达传统。
- issue: ἐκ ψυχῆς所涉及的人论措辞
  choice: 发自内心
  alternative: 从魂里／全心全意
  rationale: 正文不把ψυχή解释为独立的人论术语，而按此处表示内在真诚的功能来译；脚注明示其字面措辞，避免完全抹去原文用“魂”的特点。
translation_notes:
  register: 采用现代、庄重且口语可懂的普通话。“只在有人看着时才做工”将罕见复合词的意思直接呈现；“奴隶”有意保留本段的社会现实和归属张力；分号呈现“不要……却要……”的鲜明对比。
