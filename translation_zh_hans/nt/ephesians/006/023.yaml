  text: Εἰρήνη τοῖς ἀδελφοῖς καὶ ἀγάπη μετὰ πίστεως ἀπὸ θεοῦ πατρὸς καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/023.yaml
  text: Peace to the brothers[a], and love with faith[c][b], from God the Father and the Lord Jesus the Messiah.
translation:
  language: zh_hans
  text: 愿弟兄们得享平安、爱和信心；这一切都从父上帝和主耶稣弥赛亚而来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰρήνη
  choice: 平安
  rationale: 保留名词式祝福语的简洁形式；中文以“愿……归给”自然表达希腊文省略动词的祝愿语气。
- source_word: τοῖς ἀδελφοῖς
  choice: 归给弟兄们
  rationale: ἀδελφοῖς在语法上是阳性复数，也可在保罗书信中统称整个信徒群体；正文保留源语形式，包容性所指见脚注。
- source_word: ἀγάπη
  choice: 爱
  rationale: 采用ἀγάπη的常规对应词，并保持与本书相关用语的词汇联系。
- source_word: μετὰ πίστεως
  choice: 与信心
  rationale: μετά加属格表示伴随；πίστις在此优先译作“信心”，同时不排除“信实”或“信靠”的语义可能。
- source_word: ἀπὸ
  choice: 从……而来
  rationale: 明确表达祝福的来源；原文此介词短语共同修饰前述平安、爱与信心。
- source_word: θεοῦ πατρὸς
  choice: 父上帝
  rationale: 原文没有“我们的”，因此不增译；“父上帝”准确表达θεοῦ πατρὸς，并符合现代中文圣经语体。
- source_word: κυρίου
  choice: 主
  rationale: κύριος用于耶稣的常规尊称，译为“主”。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣弥赛亚
  rationale: 耶稣是名字，Χριστός是具有实义的称号；译作“弥赛亚”以呈现其受膏者含义，而非仅作音译式名称。
theological_decisions:
- issue: Χριστοῦ在结尾祝福语中的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: Χριστός在此仍可保有称号意义；译作“弥赛亚”呈现其语义，同时不额外加入希腊文没有的冠词。
- issue: ἀδελφοῖς的性别与群体所指
  choice: 弟兄们
  alternative: 弟兄姊妹们
  rationale: 正文对应希腊文阳性复数形式；鉴于该词可能包括全体信徒，以脚注说明其包容性所指。
- issue: πίστις的语义
  choice: 信心
  alternative: 信实；信靠
  rationale: “信心”是此处最自然的默认译法，但该词本身也可表示“信实”或“信靠”，故在脚注保留这些可能。
- issue: 祝福来源短语的范围
  choice: 使“从父上帝和主耶稣弥赛亚而来”共同关联平安、爱与信心
  alternative: 仅关联临近的“爱与信心”
  rationale: 句法上ἀπό短语自然说明整组祝福的来源；中文句式保持这种整体关联，不把来源限制于最后一项。
translation_notes:
  register: 采用现代、庄重而易懂的祝福语体。“愿……归给……并愿……而来”补出中文所需的祝愿结构，同时不把原文名词式祝福改成陈述句。为避免“爱与信心从……而来”在中文中成为残句，第二个“愿”承接前一分句。
