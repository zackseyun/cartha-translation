id: EPH.6.17
reference: Ephesians 6:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ τὴν περικεφαλαίαν τοῦ σωτηρίου ⸀δέξασθε, καὶ τὴν μάχαιραν τοῦ πνεύματος, ὅ ἐστιν ῥῆμα θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/017.yaml
  text: And receive the helmet of salvation[a], and the sword of the Spirit, which is the word of God[b],
translation:
  language: zh_hans
  text: 还要领受救恩的头盔[a]和圣灵的剑；这剑就是上帝的话[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“拿起”救恩的头盔。
    reason: lexical_alternative
  - marker: b
    text: 或译：“上帝的言语”；希腊语ῥῆμα可侧重说出的话或信息。
    reason: lexical_alternative
lexical_decisions:
- source_word: δέξασθε
  choice: 领受
  rationale: 这是第二人称复数、简单过去时中间语态命令式。“领受”既表达接受所赐之物，也符合拿起军装的语境；“拿起”作为可能译法列入脚注。
- source_word: περικεφαλαίαν
  choice: 头盔
  rationale: 这是指保护头部的标准军事装备；“头盔”直接、自然地保留军装比喻。
- source_word: τοῦ σωτηρίου
  choice: 救恩的
  rationale: 该属格短语可表达“救恩”或“拯救”；“救恩的”在此既贴近原文，也与保罗书信的用语及上下文的军装意象相称，而不进一步限定属格关系。
- source_word: μάχαιραν
  choice: 剑
  rationale: 该词指有刃的兵器，常可指较短的剑；正文译作“剑”最清楚自然，也避免加入原文未明确限定的尺寸。
- source_word: τοῦ πνεύματος
  choice: 圣灵的
  rationale: 在此语境中最自然地指圣灵，而非人的灵或泛指的属灵性质；“圣灵的”保留了该剑属于、出自或由圣灵赐予等属格关系的开放性。
- source_word: ὅ ἐστιν
  choice: 这剑就是
  rationale: 原文关系从句具有解释作用。汉语明确补出“这剑”，使指代自然清楚，同时不改变其与后文“上帝的话”的同位说明关系。
- source_word: ῥῆμα θεοῦ
  choice: 上帝的话
  rationale: ῥῆμα可侧重说出的话、言语或信息；“上帝的话”在现代汉语中自然、庄重，并保留较宽的语义范围，较具体的“言语”列入脚注。
theological_decisions:
- issue: τοῦ πνεύματος中“灵”的所指
  choice: 圣灵
  alternative: 人的灵；泛指属灵性质或灵界
  rationale: 在“上帝所赐的全副军装”这一语境中，“圣灵的剑”最自然地指与圣灵有关、由圣灵供应的剑；随后以“上帝的话”加以说明，也支持这一理解。译文不进一步断定该属格究竟表示所有、来源还是施予。
- issue: “救恩的头盔”中属格的关系
  choice: 保留“救恩的”这一开放表达
  alternative: 带来拯救的头盔；作为救恩的头盔；保护救恩的头盔
  rationale: 原文没有明确规定属格关系；直译式的自然汉语能够保留其神学张力，避免把比喻限定为某一种解释。
- issue: “剑”与“上帝的话”的关系
  choice: 译为“这剑就是上帝的话”
  alternative: 这剑象征上帝的话；这剑来自上帝的话
  rationale: 原文使用“就是”式的解释结构，而非明说“象征”或“来自”；译文保留其直接认定的力度，不另加诠释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“领受”保留所赐军装的意味，“头盔”和“剑”保持鲜明的军事比喻；用分号把命令与解释句分开，使汉语关系清楚。所有脚注标记均置于正文相应词组之后。
