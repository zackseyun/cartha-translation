  text: ἐνδύσασθε τὴν πανοπλίαν τοῦ θεοῦ πρὸς τὸ δύνασθαι ὑμᾶς στῆναι πρὸς τὰς μεθοδείας τοῦ διαβόλου·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/011.yaml
  text: Put on the full armor of God[b][a], so that you may be able to stand against the schemes of the devil.
translation:
  language: zh_hans
  text: 要穿上上帝的全副军装[a]，好使你们能在抵挡魔鬼的诡计[b]时站立得住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “全副军装”也可译作“整套军装”。希腊语原词指士兵全部齐备的装备。
    reason: lexical_alternative
  - marker: b
    text: “诡计”也可译作“奸计”或“狡猾的手段”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδύσασθε
  choice: 要穿上
  rationale: 这是第二人称复数的不定过去时中间语态命令式；“要穿上”在现代汉语中自然地表达穿戴军装的命令，也保留了主体亲自采取行动的意味。
- source_word: πανοπλίαν
  choice: 全副军装
  rationale: 该词指重装士兵整套齐全的装备，不只是狭义的护甲；“全副军装”既体现完整性，也保留军事意象。
- source_word: τοῦ θεοῦ
  choice: 上帝的
  rationale: 属格可兼含属于上帝和由上帝供应的意味；“上帝的”保持这种宽泛性，不把来源或所有权单独定死。
- source_word: πρὸς τὸ δύνασθαι ὑμᾶς στῆναι
  choice: 好使你们……仍能站立得住
  rationale: 介词加带冠词的不定式在此表示目的；“好使”自然传达目的，“仍能站立得住”保留站立的军事画面及坚守不倒的语境含义。
- source_word: μεθοδείας
  choice: 诡计
  rationale: 该名词指狡猾、欺骗性的手段或谋划；“诡计”是清楚、现代且带有敌对欺骗色彩的表达。
- source_word: τοῦ διαβόλου
  choice: 魔鬼
  rationale: 在本段属灵争战的语境中，διάβολος是对那位邪恶敌对者的固定称谓，而不是泛指某个毁谤者；“魔鬼”是现代汉语中通行而明确的译法。
theological_decisions:
- issue: διάβολος所指及其译法
  choice: 把它译为作为有位格邪恶敌对者的“魔鬼”
  alternative: 毁谤者
  rationale: 以弗所书6章属灵争战的直接语境支持将其理解为特定的超自然敌对者；此译法不加入本节之外的教义细节。
- issue: τοῦ θεοῦ所表达的关系
  choice: 上帝的
  alternative: 上帝所赐的
  rationale: 希腊语属格本身没有明确限定为来源、所有权或两者兼有；主文采用较宽泛的“上帝的”，避免把合理但更具体的来源解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“面对……仍能站立得住”按汉语语序重组原文“站立对抗”的结构，既保留目的关系和站立意象，也清楚表达抵御魔鬼计谋之意。
