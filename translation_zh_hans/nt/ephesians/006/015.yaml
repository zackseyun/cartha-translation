  text: καὶ ὑποδησάμενοι τοὺς πόδας ἐν ἑτοιμασίᾳ τοῦ εὐαγγελίου τῆς εἰρήνης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/015.yaml
  text: and having shod your feet with the readiness of the gospel of peace,[a]
translation:
  language: zh_hans
  text: 又以和平福音的预备[a]装备双脚，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “预备”也可译作“准备就绪”。这短语也可能指“为传扬和平的福音所作的准备”，或“和平福音所提供的稳固立足”。
    reason: 原文ἑτοιμασία及其与后面属格短语的关系存在真实的语义和句法歧义。
lexical_decisions:
- source_word: ὑποδησάμενοι
  choice: 当作鞋穿在脚上
  rationale: 该词是ὑποδέομαι的不定过去时中间语态分词，指穿上鞋履。此译保留穿鞋的装备意象，并以现代汉语自然表达其伴随性的命令含义。
- source_word: τοὺς πόδας
  choice: 脚
  rationale: 原文直接说“脚”，而不是“鞋”；保留身体部位可维持整副军装的具体比喻。
- source_word: ἐν
  choice: 用……当作
  rationale: 此处ἐν可表示所凭借或配备之物。“用……当作鞋”自然地呈现工具或装备关系。
- source_word: ἑτοιμασίᾳ
  choice: 预备
  rationale: 该名词可指预备、准备就绪，也可能带有稳固立足的意味。正文采用较少解释性的“预备”，不擅自限定为传福音的意愿或稳固根基。
- source_word: εὐαγγελίου
  choice: 福音
  rationale: “福音”是现代中文基督教语境中通行且清楚的对应词，也保留保罗书信中这一术语的神学内涵。
- source_word: εἰρήνης
  choice: 和平
  rationale: 此处属格最自然地修饰“福音”，即以和平为内容或特征的福音；“和平”在此比“平安”更能表达关系和好的向度，同时二者均有可能。
theological_decisions:
- issue: ἐν ἑτοιμασίᾳ τοῦ εὐαγγελίου τῆς εἰρήνης这一短语的含义
  choice: 脚以和平福音所带来的或与之相关的“预备”为装备
  alternative: 预备好去传和平的福音；以和平福音所提供的稳固立足点为鞋
  rationale: 希腊语结构凝练，属格链没有明确说明“预备”是传扬福音的准备，还是福音所赐的稳固状态。正文以“所带来的预备”保留主要关联而不明说传扬行动，脚注列出其他合理理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“当作鞋穿在脚上”保留军装中的鞋履意象；句末逗号反映本节在原句中仍与上下文相连。
