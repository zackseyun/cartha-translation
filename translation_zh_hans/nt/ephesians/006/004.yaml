  text: Καὶ οἱ πατέρες, μὴ παροργίζετε τὰ τέκνα ὑμῶν, ἀλλὰ ἐκτρέφετε αὐτὰ ἐν παιδείᾳ καὶ νουθεσίᾳ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/004.yaml
  text: And fathers[a], do not provoke your children to anger[c][b], but bring them up in the discipline and instruction of the Lord.
translation:
  language: zh_hans
  text: 父亲们，不要惹儿女生气[a]，却要以主的[c]管教和劝诫[b]养育他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要激怒儿女”或“不要使儿女愤懑”。原文动词指激起怒气或怨愤。
    reason: lexical_alternative
  - marker: b
    text: “管教和劝诫”也可译作“训练和训诫”。前一词包括培育和纠正，后一词侧重言语上的提醒与告诫。
    reason: lexical_alternative
  - marker: c
    text: “主的”可能指从主而来的、属于主的、具有主所定性质的，或由主引导的管教和劝诫。
    reason: alternative_reading
lexical_decisions:
- source_word: πατέρες
  choice: 父亲们
  rationale: 原词为阳性复数，明确指“父亲”，因此不扩大译为泛指父母的“家长”或“父母”。加“们”可自然表达复数和直接称呼。
- source_word: παροργίζετε
  choice: 惹……生气
  rationale: 该动词表示使人发怒、激起怨愤；“惹……生气”在现代汉语中自然清楚，也保留其使动含义。
- source_word: τέκνα
  choice: 儿女
  rationale: 原词是家庭语境中对子女的普通称呼；“儿女”兼指儿子和女儿，符合此处关系语境。
- source_word: ἐκτρέφετε
  choice: 养育
  rationale: 该词本可指滋养，在育儿语境中指抚养、培育成人；“养育”简洁自然，并包含持续照料和培育之意。
- source_word: παιδείᾳ
  choice: 管教
  rationale: 此词涵盖塑造性的训练、教育和纠正；“管教”保留其培育与纠正两方面的含义。
- source_word: νουθεσίᾳ
  choice: 劝诫
  rationale: 此词指借言语给予提醒、告诫和纠正；“劝诫”比单纯“教导”更能体现其规劝与警戒色彩。
- source_word: κυρίου
  choice: 主的
  rationale: 属格可表达来源、归属、性质或导向。“主的”保持原文的简练和语义宽度，不把它限定为其中一种关系。
theological_decisions:
- issue: πατέρες在家庭训示中的指称范围
  choice: 译作“父亲们”，保留原文明确的男性复数称呼。
  alternative: 父母；家长
  rationale: 虽然这项教导可被理解为对养育儿女者具有更广泛意义，但原文直接称呼父亲，翻译不应在正文中扩大其指称范围。
- issue: ἐν παιδείᾳ καὶ νουθεσίᾳ κυρίου中κυρίου的关系
  choice: 译作“主的”，不进一步限定属格含义。
  alternative: 从主而来的；关于主的；按照主的
  rationale: 原文属格可能表示管教和劝诫来自主、属于主、具有主所定的性质，或由主引导。保留“主的”可避免消除原文真实存在的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“惹儿女生气”口吻自然但不随便；“管教和劝诫”保留育儿语境中的塑造、纠正和言语指导。“以……养育”自然表达希腊语ἐν在此处的方式或范围含义。
