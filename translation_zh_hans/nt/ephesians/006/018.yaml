id: EPH.6.18
reference: Ephesians 6:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: διὰ πάσης προσευχῆς καὶ δεήσεως, προσευχόμενοι ἐν παντὶ καιρῷ ἐν πνεύματι, καὶ εἰς ⸀αὐτὸ ἀγρυπνοῦντες ἐν πάσῃ προσκαρτερήσει καὶ δεήσει περὶ πάντων τῶν ἁγίων,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/018.yaml
  text: with every prayer and petition, praying at all times in the Spirit, and for this very thing staying alert with all perseverance in petition for all the saints,
translation:
  language: zh_hans
  text: 要借着各样的祷告和祈求，时时在圣灵里[a]祷告；也要为此警醒，坚持不懈地为众圣徒[b]祈求。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在灵里”。希腊文也可作较一般的理解，但结合上下文，这里更可能是指圣灵。
    reason: alternative_reading
  - marker: b
    text: 这里的“圣徒”是指神所有圣洁的子民，也就是全体信徒。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ πάσης προσευχῆς καὶ δεήσεως
  choice: 借着各样的祷告和祈求
  rationale: διά加属格在这里表示方式或手段。“借着”保留其工具性；“祷告”对应较概括的προσευχή，“祈求”对应较具体的δέησις。πάσης译作“各样的”，自然表达祷告与祈求的全面性。
- source_word: προσευχόμενοι ἐν παντὶ καιρῷ
  choice: 时时……祷告
  rationale: 现在时分词承接上文劝勉，表达持续伴随的行动；“时时”简洁地传达ἐν παντὶ καιρῷ所指的每一时刻或场合。
- source_word: ἐν πνεύματι
  choice: 在圣灵里
  rationale: 结合以弗所书的用法及紧邻上文“圣灵的剑”，这里最可能指圣灵；保留“在……里”的表达，以免把关系过度解释为单纯的能力来源。希腊文仍容许“在灵里”的理解，故加注说明。
- source_word: εἰς αὐτὸ ἀγρυπνοῦντες
  choice: 也要为此警醒
  rationale: εἰς αὐτό指向上述祷告之事或目的，并带强调；“为此”在现代汉语中自然。ἀγρυπνοῦντες表示保持清醒、警觉，译为“警醒”既准确又符合经文语域。
- source_word: ἐν πάσῃ προσκαρτερήσει καὶ δεήσει
  choice: 始终坚持……祈求
  rationale: προσκαρτέρησις表示持久、坚忍；此处与δέησις结合，整体可自然理解为在祈求上坚持不懈。“始终坚持……祈求”用流畅汉语传达πάσῃ的全面力度，同时脚注保留把两项并列理解的可能。
- source_word: περὶ πάντων τῶν ἁγίων
  choice: 为众圣徒
  rationale: περί在祈求语境中表示“为、关于”；πάντων译入“众”。ἅγιοι是保罗对全体属神信徒的常用称呼，“圣徒”保留其传统且准确的群体含义。
theological_decisions:
- issue: πνεύματι的所指
  choice: 圣灵（“在圣灵里”）
  alternative: 人的灵或属灵状态（“在灵里”）
  rationale: 以弗所书的语境，尤其第17节刚提到圣灵，使圣灵成为较可能的所指；但希腊文没有冠词，语法本身并未完全排除较一般的理解，因此以脚注保留歧义。
- issue: ἅγιοι的范围
  choice: 全体信徒（“众圣徒”）
  alternative: 后世教会制度中特别册封的一小类圣人
  rationale: 在保罗书信中，ἅγιοι通常指整个位于基督里的信徒群体，而非后世受册封的少数人。正文保留“圣徒”，脚注澄清其范围。
- issue: ἐν πάσῃ προσκαρτερήσει καὶ δεήσει的结构
  choice: 把恒忍理解为持续祈求的方式（“始终坚持……祈求”）
  alternative: 把“恒忍”和“祈求”作为两个并列项目
  rationale: 两个名词由καί连接，形式上可并列；但在“警醒”的语境中，也可自然理解为以恒忍来修饰持续的祈求。正文采用较通顺且语义连贯的表达，脚注保留较形式对应的并列译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“祷告／祈求”保留两个希腊词的区别；“圣灵”“圣徒”“警醒”属于当代中文基督教读者熟悉且仍可理解的用语。分号呈现本节内部从持续祷告转到警醒坚持的层次，同时保留其承接上文军装劝勉的句法功能。
