  text: καὶ αὐτὸς ἔδωκεν τοὺς μὲν ἀποστόλους, τοὺς δὲ προφήτας, τοὺς δὲ εὐαγγελιστάς, τοὺς δὲ ποιμένας καὶ διδασκάλους,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/011.yaml
  text: And he himself gave some as apostles[a], some as prophets, some as evangelists, and some as shepherds and teachers[b],
translation:
  language: zh_hans
  text: 他亲自赐下一些人作使徒，一些人作先知，一些人作传福音者，另一些人作牧人[a]和教师[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“牧师”。希腊文直译为“牧人”。
    reason: lexical_alternative
  - marker: b
    text: “牧人”和“教师”在希腊文中共用一个冠词，可能表示这两种角色关系特别密切，但不一定表示它们是同一个职分。
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: 并且
  rationale: 保留与上文的连接关系，同时符合现代汉语行文习惯。
- source_word: αὐτὸς
  choice: 他亲自
  rationale: 原文代词带有强调意味，突出赐下这些人的正是他本人。
- source_word: ἔδωκεν
  choice: 赐下
  rationale: δίδωμι在此基本义为“给、赐下”；“任命”会把原文较宽的含义过度限定为职务委任。
- source_word: τοὺς μὲν ἀποστόλους
  choice: 一些人作使徒
  rationale: 反复出现的冠词配合μέν/δέ构成分配式列举；译成“一些人作……，一些人作……”既表达这些人被赐下，也说明其服事身份。
- source_word: προφήτας
  choice: 先知
  rationale: προφήτης的直接、通行译法。
- source_word: εὐαγγελιστάς
  choice: 传福音者
  rationale: 准确表达εὐαγγελιστής所指传扬福音的人，并比音译或较制度化的称谓更易为现代普通读者理解。
- source_word: ποιμένας
  choice: 牧人
  rationale: 保留ποιμήν本有的“牧羊人”隐喻；传统教会称谓“牧师”作为可能译法列入脚注。
- source_word: καὶ διδασκάλους
  choice: 和教师
  rationale: 直接保留两个并列名词；不在正文中断定“牧人”和“教师”是同一职分还是彼此有别的职能。
theological_decisions:
- issue: ποιμένας应保留牧养隐喻，还是译作传统教会职称
  choice: 牧人
  alternative: 牧师（也可作“牧者”）
  rationale: “牧人”最直接保留希腊文的隐喻，避免把后来的制度化职称直接带入正文；传统译法则在脚注中说明。
- issue: “牧人和教师”指一个合并群体，还是两个不同群体
  choice: 照原文译作“牧人和教师”，不作定论
  alternative: 牧人兼教师；或两个彼此有别的群体
  rationale: 两个名词共用一个冠词，可能显示二者关系特别密切，但句法本身不足以强制判定为单一职分。正文保留这种张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“赐下一些人作……”兼顾原文“赐下”的基本义和汉语对角色的表达；分项重复“一些人作”，清楚呈现μέν/δέ列举结构。
