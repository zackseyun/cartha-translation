  text: σπουδάζοντες τηρεῖν τὴν ἑνότητα τοῦ πνεύματος ἐν τῷ συνδέσμῳ τῆς εἰρήνης·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/003.yaml
  text: making every effort to keep the unity of the Spirit in the bond of peace[a][b].
translation:
  language: zh_hans
  text: 竭力[a]在和平的纽带中持守圣灵的合一[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “竭力……持守”也可译作“殷勤保持”或“努力维护”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“灵的合一”。这里的“灵”最可能指圣灵；也有人理解为信徒共有的心灵或共同精神。原文的属格关系也没有明说是“所赐的”“所产生的”还是“所属的”。
    reason: alternative_reading
lexical_decisions:
- source_word: σπουδάζοντες
  choice: 竭力
  rationale: 现在时主动分词承接4:1—2的劝勉，表达认真、殷勤地付诸行动；“竭力”简洁自然，并保留积极努力的力度。
- source_word: τηρεῖν
  choice: 持守
  rationale: τηρέω在此指保持、维护或守护已经存在的事物，而非创造合一；“持守”兼顾持续维护和谨慎守护之意。
- source_word: τὴν ἑνότητα
  choice: 合一
  rationale: ἑνότης指一体、统一；“合一”是现代中文基督教语境中自然且易懂的表达，也符合本段群体性的上下文。
- source_word: τοῦ πνεύματος
  choice: 圣灵所赐的
  rationale: 在《以弗所书》的近邻语境中，带冠词的πνεῦμα最可能指圣灵。属格本身可容纳来源、所属或特征等关系；正文采用自然中文表达其最可能的来源关系，同时以脚注保留另一理解。
- source_word: ἐν
  choice: 在……中
  rationale: 保留介词的范围或媒介含义，不将其过度限定为单一语义。
- source_word: τῷ συνδέσμῳ
  choice: 联结
  rationale: σύνδεσμος指把事物系在一起的纽带或联结。“联结”在中文中自然，并保留其维系合一的比喻。
- source_word: τῆς εἰρήνης
  choice: 和平的
  rationale: 按简单属格表达为“和平的”，让和平作为联结的性质或构成因素；不把关系进一步解释为“和平所产生的”。
theological_decisions:
- issue: πνεύματος的所指
  choice: 圣灵
  alternative: 信徒共有的心灵或共同精神
  rationale: 《以弗所书》4:4及4:30等近邻经文强烈支持圣灵这一所指；但词组本身仍可被较一般地理解，因此在脚注中保留备选解释。
- issue: 合一的性质
  choice: 已经存在、需要持守的合一
  alternative: 由信徒创造的合一
  rationale: τηρεῖν表示保持或守护已有之物，因此译文避免暗示信徒负责创造这种合一。
- issue: τοῦ πνεύματος的属格关系
  choice: 圣灵所赐的合一
  alternative: 属于圣灵的合一／由圣灵产生的合一
  rationale: 上下文支持圣灵是合一的来源，但希腊语属格没有明说关系类型。正文采用自然中文“所赐的”，同时脚注说明原文较为简略，以免把解释绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“竭力”保留劝勉的力度，“持守”表明合一已存在而需要维护。“和平的联结”既贴近原文结构，又避免使用较陈旧的“和平的纽带”。所有脚注标记均已置于正文相应位置。
