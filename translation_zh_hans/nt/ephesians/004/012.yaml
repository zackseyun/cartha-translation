  yaml_path: translation/nt/ephesians/004/012.yaml
  text: for the equipping of the saints for the work of ministry[a], for the building up of the body of Messiah[c][b],
translation:
  language: zh_hans
  text: 为装备圣徒，为服事的工作[a]，为建造弥赛亚[b]的身体[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “服事”也可译作“事工”。希腊语διακονία可指服事或事工。
    reason: lexical_alternative
  - marker: b
    text: “弥赛亚”也可译作“基督”。希腊语Χριστός是称号，意思是“受膏者”。
    reason: alternative_reading
  - marker: c
    text: 这几个短语也可按递进关系理解：“为装备圣徒去做服事的工作，从而建造弥赛亚的身体。”
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς τὸν καταρτισμὸν
  choice: 为要装备
  rationale: καταρτισμός指预备、装备或使之胜任；“装备”简洁地表达使圣徒能够承担工作的含义。πρός在此目的结构中译为“为要”。
- source_word: τῶν ἁγίων
  choice: 圣徒
  rationale: 这是保罗对归属上帝之信徒的惯常称呼；“圣徒”保留其群体性和分别为圣的含义，并非特指后来获封圣的人。
- source_word: εἰς ἔργον διακονίας
  choice: 为要做服事的工作
  rationale: ἔργον为单数“工作”；διακονία可指服事或事工。“服事”涵盖教会中各种服务，不把此工作限于专职教牧人员。
- source_word: εἰς οἰκοδομὴν
  choice: 为要建立
  rationale: οἰκοδομή在此沿用建筑隐喻，表示建造并使群体成长；“建立”自然且保留该意象。
- source_word: τοῦ σώματος τοῦ Χριστοῦ
  choice: 弥赛亚的身体
  rationale: σῶμα按保罗的群体隐喻译为“身体”；Χριστός在此作为称号，译作“弥赛亚”，同时以脚注保留传统译法“基督”。
theological_decisions:
- issue: 三个介词短语之间的句法关系
  choice: 正文按三个并列的目的表达：装备圣徒、做服事的工作、建立弥赛亚的身体。
  alternative: 也可理解为递进关系：装备圣徒去做服事的工作，从而建立弥赛亚的身体。
  rationale: 希腊文πρός…εἰς…εἰς…既可能表示并列目标，也可能表示从装备到服事、再到建造身体的进程。正文贴近表层结构，脚注保留另一种合理理解，不借此裁定服事主要属于领袖还是全体圣徒。
- issue: Χριστός的称号含义
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处属格短语说明身体属于谁，Χριστός仍具有称号性质；“弥赛亚”显明其受膏者含义，“基督”作为传统且自然的译法列于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“为要”重复三次，以显出原文目的短语的并列形式；“圣徒”保留保罗书信中的惯用群体称谓；标点补足为独立经节呈现。
