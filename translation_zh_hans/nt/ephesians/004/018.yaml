id: EPH.4.18
reference: Ephesians 4:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀ἐσκοτωμένοι τῇ διανοίᾳ ὄντες, ἀπηλλοτριωμένοι τῆς ζωῆς τοῦ θεοῦ, διὰ τὴν ἄγνοιαν τὴν οὖσαν ἐν αὐτοῖς, διὰ τὴν πώρωσιν τῆς καρδίας αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/018.yaml
  text: being darkened in their understanding[a], alienated from the life of God because of the ignorance that is in them, because of the hardness of their hearts[e][d][c][b],
translation:
  language: zh_hans
  text: 他们的悟性昏暗[a]，与上帝的生命隔绝[b][c]；这是因为他们里面的无知，也因为他们的心刚硬[d][e]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “悟性”也可译作“心思”。
    reason: lexical_alternative
  - marker: b
    text: “隔绝”也可译作“疏离”或“被排除在……之外”。
    reason: lexical_alternative
  - marker: c
    text: “上帝的生命”既可指上帝所具有的生命，也可指从上帝而来的生命。
    reason: alternative_reading
  - marker: d
    text: “刚硬”也可译作“麻木”；原词含有变硬、迟钝而失去感受的意思。
    reason: lexical_alternative
  - marker: e
    text: 原文“心”为单数，与指向众人的“他们”连用，是集合性的表达。
    reason: grammatical_note
lexical_decisions:
- source_word: ἐσκοτωμένοι τῇ διανοίᾳ ὄντες
  choice: 他们的悟性昏暗
  rationale: 完成时被动分词描述已经形成并持续存在的状态；汉语以主谓结构自然表达。“悟性”传达 διάνοια 的认知层面，同时保留“心思”这一可能译法。
- source_word: ἀπηλλοτριωμένοι
  choice: 隔绝
  rationale: 完成时被动分词表示处于疏离、被隔开的状态。“隔绝”在现代汉语中简洁自然，既可表达关系上的疏离，也不把含义限定为法律意义的排除。
- source_word: τῆς ζωῆς τοῦ θεοῦ
  choice: 与上帝的生命
  rationale: 保留属格结构的开放性，不明确限定为上帝自身所具有的生命，还是从上帝而来的生命。
- source_word: διὰ τὴν ἄγνοιαν τὴν οὖσαν ἐν αὐτοῖς
  choice: 因为他们里面的无知
  rationale: διά 加宾格表示原因；“他们里面的”自然反映修饰 ἄγνοια 的短语 τὴν οὖσαν ἐν αὐτοῖς。
- source_word: διὰ τὴν πώρωσιν τῆς καρδίας αὐτῶν
  choice: 因为他们的心刚硬
  rationale: πώρωσις 带有变硬、迟钝而失去感受的比喻。“心刚硬”保留该比喻及 καρδία 所指的内在人格，同时符合现代圣经语体。
theological_decisions:
- issue: “上帝的生命”（τῆς ζωῆς τοῦ θεοῦ）的属格含义
  choice: 保留“上帝的生命”，不进一步界定
  alternative: “从上帝而来的生命”或“上帝自己的生命”
  rationale: 希腊语属格可表达生命属于上帝，也可指上帝所赐、从上帝而来的生命；正文不消除这一真实歧义。
- issue: καρδίας 的单数形式与复数所指
  choice: 译作“他们的心”
  alternative: 按每个个体展开理解为“他们各人的心”
  rationale: 原文“心”为单数而物主代词指向复数群体。汉语“他们的心”既自然，又能保留这种集合性表达，不额外强化某一人类学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“上帝”作为 θεός 的标准称呼；用两个并列状态分句和两个原因短语清楚呈现原文结构。正文避免生硬复制希腊语分词形式，但保留其持续状态、被动含义及因果关系。
