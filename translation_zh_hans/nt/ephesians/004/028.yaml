source:
  edition: SBLGNT
  text: ὁ κλέπτων μηκέτι κλεπτέτω, μᾶλλον δὲ κοπιάτω ἐργαζόμενος ⸂ταῖς ἰδίαις χερσὶν τὸ ἀγαθόν⸃, ἵνα ἔχῃ μεταδιδόναι τῷ χρείαν ἔχοντι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/028.yaml
  text: The one who steals must steal no longer[a], but rather must labor, doing good work with his own hands[b], so that he may have something to share with the one who has need.
translation:
  language: zh_hans
  text: 偷窃的人不要再偷了，倒要亲手辛勤做正当的工作[a]，好有东西可以分给有需要的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“亲手做有益的工作。”
    reason: τὸ ἀγαθόν可广义指“善的事”或“好的事”；在劳动语境中，也可理解为有益、良善的工作。
  - marker: b
    text: 或译：“与有需要的人分享。”
    reason: μεταδιδόναι与与格连用可表达“分给某人”，也可自然理解为“与某人分享”。
lexical_decisions:
- source_word: ὁ κλέπτων
  choice: 偷窃的人
  rationale: 定冠词加现在分词作名词使用，指正在或惯常偷窃的人；这样既保留行为特征，也避免用“贼”给人贴上过强的身份标签。
- source_word: μηκέτι κλεπτέτω
  choice: 不要再偷了
  rationale: μηκέτι 表示停止先前的行为；第三人称现在命令式在现代汉语中自然表达为“不要再……了”。
- source_word: μᾶλλον δὲ
  choice: 倒要
  rationale: 表达强烈的转折和纠正：不仅停止偷窃，更要转向与之相反的正当劳动。
- source_word: κοπιάτω
  choice: 辛勤劳动
  rationale: κοπιάω 含费力、辛劳之意，比普通的“工作”更强；“辛勤劳动”兼顾命令语气和努力程度。
- source_word: ἐργαζόμενος ταῖς ἰδίαις χερσὶν
  choice: 亲手做
  rationale: 分词说明劳动的方式；“亲手”自然传达 ταῖς ἰδίαις χερσὶν 所强调的亲自、诚实劳作。
- source_word: τὸ ἀγαθόν
  choice: 正当的事
  rationale: 中性形容词名词化，可指善的、好的或有益的事物；在与偷窃相对的劳动语境中，“正当的事”突出其正直性质，同时脚注保留“有益的工作”这一生产性理解。
- source_word: ἵνα ἔχῃ
  choice: 好让自己有东西
  rationale: ἵνα 加虚拟式表示目的；“东西”是汉语中为衔接后面的分享动作而自然补出的泛指宾语。
- source_word: μεταδιδόναι
  choice: 可以分给
  rationale: 该词表示把自己所有的分给别人；“分给”清楚表达给予和共享资源的含义。
- source_word: τῷ χρείαν ἔχοντι
  choice: 有需要的人
  rationale: 与格的名词性分词短语指接受者，即处于缺乏或需要中的人；此译简明自然，不限定其需要的具体种类。
theological_decisions:
- issue: 劳动的伦理目的
  choice: 诚实劳动既是偷窃的正面替代，也是使人能够帮助有需要者的途径。
  alternative: 主要强调自给自足，或主要强调对受害者作出赔偿。
  rationale: 经文明确用目的从句说明劳动是为了有可分给有需要之人的东西。自给自足可以视为含意，赔偿也可能符合更广泛的伦理背景，但本节没有明说，因此不把任何一项提升为主要意思。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不要再偷了……倒要……”保留命令和鲜明对比；“辛勤劳动”体现 κοπιάτω 的费力意味。脚注标记均置于所说明的短语之后。
