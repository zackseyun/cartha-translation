  yaml_path: translation/nt/ephesians/004/006.yaml
  text: one God and Father of all[b][a], who is over all and through all and in all.
translation:
  language: zh_hans
  text: 只有一位上帝，就是万有的父[a]；他在万有之上，贯穿万有，也在万有之中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “万有”也可理解为“所有人”或“一切事物”。本节反复出现的“万有”，希腊文都没有明说它所修饰或指代的名词。
    reason: lexical_alternative
  - marker: b
    text: “在万有之中”也可译作“在每个人之中”。有些抄本作“在你们众人之中”。
    reason: textual_variant
lexical_decisions:
- source_word: εἷς
  choice: 只有一位
  rationale: 保留上下文反复强调的“一”与排他性的统一主题；汉语用“只有一位”比孤立的“一位”更自然，也清楚表达此处的认信语气。
- source_word: θεὸς καὶ πατὴρ πάντων
  choice: 上帝，就是万有的父
  rationale: 将“父”保留为对上帝的位格性称谓；用“就是”表明“上帝”与“父”是同一位，而不是并列的两个对象。“万有”在现代汉语中可概括所有受造存在，同时不在正文中明定只指人或只指事物。
- source_word: ὁ ἐπὶ πάντων
  choice: 他在万有之上
  rationale: ἐπί加属格在此表达居于其上、统管或超越；译文保持空间意象及主权含义，不额外加入解释。
- source_word: διὰ πάντων
  choice: 贯通万有
  rationale: διά加属格可表示经过、媒介或施行作用。“贯通”使汉语句子完整自然，并保留上帝的作为遍及万有这一意象，避免增添“运行”等原文未明说的动词。
- source_word: ἐν πᾶσιν
  choice: 在万有之中
  rationale: 直承ἐν的“在……之中”意义，并与前两个介词短语形成平行结构；“万有”保留未明说所指名词的宽广范围。
theological_decisions:
- issue: πάντων／πᾶσιν反复出现时所指的范围
  choice: 正文统一译作“万有”，不限定为信徒、所有人或所有事物中的某一类
  alternative: 译作“众人”“所有信徒”或“一切事物”
  rationale: 希腊文三次使用πᾶς的复数形式而未附明说的名词。虽然上下文谈教会的合一，措辞本身仍然宽广；正文不把这一神学张力缩窄，脚注提示可能的理解。
- issue: 末句的抄本异文
  choice: 正文采用SBLGNT的ἐν πᾶσιν，译作“在万有之中”
  alternative: 部分抄本作ἐν ὑμῖν πᾶσιν，可译“在你们众人之中”
  rationale: 以指定的SBLGNT正文为翻译依据，同时在脚注中交代具有解释意义的异文。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“只有一位”延续以弗所书4:4—6的合一排比；“万有”使三处对应词保持一致，“在……之上／贯通……／在……之中”则尽量再现原文紧凑的三重结构。
