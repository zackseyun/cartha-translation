  text: εἴ γε αὐτὸν ἠκούσατε καὶ ἐν αὐτῷ ἐδιδάχθητε, καθώς ἐστιν ἀλήθεια ἐν τῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/021.yaml
  text: if indeed you heard him and were taught in him[a], just as truth is in Jesus[b],
translation:
  language: zh_hans
  text: 如果你们确实听见了他，也在他里面受过教导[a]——正如真理是在耶稣里面[b]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “听见了他”也可理解为“听说过他”。希腊文直译是“听见他”，可能表示他们借着使徒所传的信息，犹如听见基督亲自说话。
    reason: alternative_reading
  - marker: b
    text: “在他里面”和“在耶稣里面”可表达领域、联合或密切关联；希腊文所含的意味比单纯的“借着他”更宽广。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: 如果……确实
  rationale: 保留条件句形式和γε的强调语气；上下文可能暗含说话者相信条件成立，但不直接改译为因果性的“既然”。
- source_word: αὐτὸν ἠκούσατε
  choice: 听见了他
  rationale: 原文以αὐτόν作直接宾语，直译为“听见了他”；这种不寻常的表达可暗示信徒在使徒所传的信息中听见基督本人，同时不排除“听说过他”的理解。
- source_word: ἐν αὐτῷ
  choice: 在他里面
  rationale: 保留ἐν的空间、领域、联合或密切关联等宽广含义，不将其收窄为表示施事的“受他教导”。
- source_word: ἐδιδάχθητε
  choice: 受过教导
  rationale: 以自然中文表达不定过去时被动语态，并保留“被教导”的意义。
- source_word: καθώς
  choice: 正如
  rationale: 保留比较和对应关系，将所受教导与在耶稣里面的真理相连。
- source_word: ἀλήθεια
  choice: 真理
  rationale: 对应无冠词名词ἀλήθεια，既可指真理，也带有真实、实情的意味；“真理”在此庄重而自然。
- source_word: ἐν τῷ Ἰησοῦ
  choice: 在耶稣里面
  rationale: 保留个人名“耶稣”及重复的ἐν结构，不解释性地改成“借着耶稣”或“在与耶稣联合中”。
theological_decisions:
- issue: αὐτὸν ἠκούσατε是指“听见他”还是“听说过他”
  choice: 听见了他
  alternative: 听说过他
  rationale: 直接宾语结构支持“听见他”，也保留基督借福音宣讲亲自向人说话的可能意涵；脚注列出符合一般语言习惯的另一理解。
- issue: 两个ἐν短语应表达施事、领域还是联合
  choice: 在他里面／在耶稣里面
  alternative: 受他教导／与耶稣联合
  rationale: 原文没有明确限定ἐν的具体关系；直译保留领域、联合及密切关联之间的神学张力。
- issue: εἴ γε是否应按语用改成“既然”
  choice: 如果……确实
  alternative: 既然
  rationale: 保留希腊文条件形式，同时由“确实”传达γε所带的强调和说话者预设条件大概成立的语气。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在他里面受过教导”和“真理是在耶稣里面”略带原文的陌生感，属有意保留保罗重复的ἐν结构及其开放含义。破折号标明本节是承接上文且句意尚待下文完成。
