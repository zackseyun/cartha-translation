source:
  edition: SBLGNT
  text: ἵνα μηκέτι ὦμεν νήπιοι, κλυδωνιζόμενοι καὶ περιφερόμενοι παντὶ ἀνέμῳ τῆς διδασκαλίας ἐν τῇ κυβείᾳ τῶν ἀνθρώπων ἐν πανουργίᾳ πρὸς τὴν μεθοδείαν τῆς πλάνης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/014.yaml
  text: so that we may no longer be children[a], tossed by waves and carried about by every wind of teaching, by human trickery, by craftiness in the scheming of error[c][b],
translation:
  language: zh_hans
  text: 为使我们不再作小孩子[a]，被波浪颠簸，被各样教导之风吹来吹去；因人的骗术[b]和诡诈，被引向迷误的诡计[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “小孩子”也可译作“婴幼儿”；这里比喻尚未成熟的人。
    reason: lexical_alternative
  - marker: b
    text: “骗术”所译的原文词字面指掷骰子的游戏，并可引申指其中的作弊或欺诈。
    reason: cultural_note
  - marker: c
    text: 原文此短语结构简练，πρός的关系和“迷误的诡计”的属格关系均有不同理解。也可译作“朝向迷误的谋划”、“被引向欺骗的计谋”或“为要施行使人迷误的谋划”。“迷误”也可译作“错谬”、“迷惑”或“欺骗”。
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: ἵνα μηκέτι ὦμεν
  choice: 这样，我们就不再作
  rationale: ἵνα承接上文，表达目的或结果；“这样……就……”在现代汉语中自然地保留这种衔接。μηκέτι表明不再处于从前的状态。
- source_word: νήπιοι
  choice: 小孩子
  rationale: 本词本可指婴幼儿，此处比喻不成熟。“小孩子”自然易懂，又保留成长主题。
- source_word: κλυδωνιζόμενοι
  choice: 被波浪颠簸
  rationale: 保留动词鲜明的海浪意象及被动意味，不把它泛化为单纯的动摇。
- source_word: περιφερόμενοι παντὶ ἀνέμῳ τῆς διδασκαλίας
  choice: 给各样教导之风吹来吹去
  rationale: 保留风的比喻，并将διδασκαλία译作普通而宽泛的“教导”，不局限为制度化的教义。
- source_word: ἐν τῇ κυβείᾳ τῶν ἀνθρώπων
  choice: 受人的欺骗手段摆布
  rationale: κυβεία原指掷骰子的活动，并因作弊联想到欺诈；正文传达其语境义，文化意象留在脚注中。
- source_word: ἐν πανουργίᾳ
  choice: 和诡诈摆布
  rationale: πανουργία指带有不道德意味的狡猾、奸诈；与前一介词短语合译，形成自然汉语，同时保留负面道德色彩。
- source_word: πρὸς τὴν μεθοδείαν τῆς πλάνης
  choice: 落入错谬所设的圈套
  rationale: μεθοδεία表示有计划的手段、谋划或圈套；πλάνη兼有错谬、迷惑和欺骗的意义。此译表达趋向圈套的动态，但用脚注保留另一种句法和词义理解。
theological_decisions:
- issue: διδασκαλία的范围
  choice: 教导
  alternative: 教义
  rationale: 原词可指教导或所教的内容；“教导”较宽，不把警告限定于正式教义体系。
- issue: πλάνη的语义
  choice: 错谬
  alternative: 欺骗／迷惑
  rationale: 原词既可侧重偏离真理的错谬，也可侧重使人偏离的欺骗。正文采用“错谬”，避免断定其唯一侧重点，脚注保留其他可能。
- issue: πρὸς τὴν μεθοδείαν τῆς πλάνης的关系
  choice: 落入错谬所设的圈套
  alternative: 被引向欺骗的计谋／为要施行使人迷误的谋划
  rationale: 希腊语短语高度压缩，πρός可表示趋向或目的，属格也有多种关系。正文给出可读译法，脚注明确保留歧义。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。保留“波浪”和“风”的连续意象；后半句以“摆布、落入、圈套”表达受操控和被诱入的动态。分号帮助读者辨认两个并列的危险来源，而不削弱原句的连贯性。
