  text: Παρακαλῶ οὖν ὑμᾶς ἐγὼ ὁ δέσμιος ἐν κυρίῳ ἀξίως περιπατῆσαι τῆς κλήσεως ἧς ἐκλήθητε,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/001.yaml
  text: Therefore I[a], the prisoner in the Lord, urge you to walk worthily of the calling with which you were called[b],
translation:
  language: zh_hans
  text: 所以，我这在主里被囚的，劝你们行事为人，要与所蒙的呼召相称[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“生活要配得上你们所蒙的呼召”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: 劝
  rationale: 这里的动词表达带有牧养意味的郑重劝勉；“劝”自然明白，同时保留其恳切而非命令式的语气。
- source_word: οὖν
  choice: 所以
  rationale: 该词承接前文并引出由此前论述所得的实践结论；“所以”在现代汉语中自然地保留这一推论关系。
- source_word: δέσμιος
  choice: 囚犯
  rationale: 直接表达被囚之人的身份，比“被捆绑的人”简洁，也不额外解释被囚的原因。
- source_word: ἐν κυρίῳ
  choice: 在主里
  rationale: 沿用保罗特有且含义宽广的关系性表达，不把它限定为所属关系或被囚的原因。
- source_word: ἀξίως
  choice: 相称
  rationale: 表示生活行为应当符合所蒙呼召，而不是宣称人凭行为赚得或配受呼召；“与……相称”准确而自然。
- source_word: περιπατῆσαι
  choice: 行事为人
  rationale: 该词在此以“行走”比喻生活方式；“行事为人”在现代汉语中清楚传达这一惯用的伦理含义，又保留“行”的意象。
- source_word: κλήσεως
  choice: 呼召
  rationale: “呼召”既能表达神的召唤，也能承载保罗书信中这一词的神学分量，优于较弱的“邀请”。
- source_word: ἧς ἐκλήθητε
  choice: 所蒙的呼召
  rationale: “蒙”自然表达希腊文被动语态，并把呼召呈现为领受之事；汉语无需机械重复“呼召你们的呼召”。
theological_decisions:
- issue: ὁ δέσμιος ἐν κυρίῳ 中保罗自称与主的关系
  choice: 在主里的囚犯
  alternative: 主的囚犯；为主被囚的人
  rationale: 正文保留介词短语“在主里”的开放含义，不将其单一定义为归属、原因或目的。
- issue: ἀξίως 所表达的伦理关系
  choice: 与所蒙的呼召相称
  alternative: 配得上所蒙的呼召
  rationale: “相称”强调行为符合呼召，避免“配得上”可能令人误解为靠行为取得受召资格，同时仍保留原文对合宜生活的要求。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“在主里”保留保罗式表达的神学张力；“行事为人”使“行走”的生活隐喻在汉语中自然可懂。
