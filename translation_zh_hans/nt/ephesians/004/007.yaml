  text: Ἑνὶ δὲ ἑκάστῳ ἡμῶν ἐδόθη ⸀ἡ χάρις κατὰ τὸ μέτρον τῆς δωρεᾶς τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/007.yaml
  text: But grace was given to each one of us according to the measure of Messiah’s gift[a].
translation:
  language: zh_hans
  text: 但恩典已经赐给我们每一个人，是照着弥赛亚的恩赐的分量。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”也可译作“基督”。希腊文 Χριστός 意为“受膏者”；此处用“弥赛亚”来保留这一称号的含义。
    reason: 提供传统译名，并说明正文保留原文称号语义的依据。
lexical_decisions:
- source_word: Ἑνὶ ... ἑκάστῳ ἡμῶν
  choice: 我们每一个人
  rationale: ἑνὶ与ἑκάστῳ连用，构成强调性的逐一分配表达；“我们每一个人”比“我们各人”更清楚地保留这种强调。
- source_word: δὲ
  choice: 但
  rationale: δέ从前文对教会合一的强调转向恩典在各人身上的不同分配；“但”自然地标示这一轻微转折。
- source_word: ἐδόθη
  choice: 领受了
  rationale: 希腊文为简单过去时被动式，直译可作“被赐予了”；中文用“领受了”更自然，同时仍表明恩典来自赐予，而非个人取得。
- source_word: ἡ χάρις
  choice: 恩典
  rationale: 保留保罗常用的神学词汇，不把本节语境中的服事能力或恩赐含义直接写进正文，从而避免缩窄χάρις的语义。
- source_word: κατὰ τὸ μέτρον
  choice: 按着……的分量
  rationale: κατά加宾格在此表达尺度或比例；“按着……的分量”兼顾原文结构与现代中文可读性。
- source_word: τῆς δωρεᾶς
  choice: 恩赐
  rationale: δωρεά指白白赐下的礼物；“恩赐”在此既自然，也适合随后有关教会职分与服事的语境。
- source_word: τοῦ Χριστοῦ
  choice: 弥赛亚
  rationale: Χριστός在此仍保有称号“受膏者”的含义，故译作“弥赛亚”；属格结构保留为“弥赛亚恩赐”，不过度限定为弥赛亚所赐或属于弥赛亚。
theological_decisions:
- issue: 本节“恩典”的具体含义
  choice: 正文保留“恩典”，由上下文显示其与各人所得的服事恩赐和能力有关
  alternative: 明确译作“服事的恩赐”或仅理解为使人得救的恩典
  rationale: 4:7—11从合一转向不同的服事恩赐，但χάρις本身仍是“恩典”；保留该词可避免把保罗的表达缩窄为单一教义类别。
- issue: τοῦ Χριστοῦ的属格关系
  choice: 译作较开放的“弥赛亚恩赐”
  alternative: “弥赛亚所赐的恩赐”或“赐给弥赛亚的恩赐”
  rationale: 上下文强烈支持恩赐由弥赛亚赐下，但希腊文属格本身较为简洁；正文不额外补入“所赐”，以保存其形式上的开放性。
- issue: Χριστοῦ的称号含义
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处译作“弥赛亚”可直接传达Χριστός作为“受膏者”称号的语义；脚注提供传统译名。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“我们每一个人”保留原文逐一强调；“按着……的分量”略具经文语体但仍易懂。正文避免用解释性增补消除“恩典”及属格结构所保有的神学张力。
