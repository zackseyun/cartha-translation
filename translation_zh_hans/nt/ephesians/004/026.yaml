  text: ὀργίζεσθε καὶ μὴ ἁμαρτάνετε· ὁ ἥλιος μὴ ἐπιδυέτω ⸀ἐπὶ παροργισμῷ ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/026.yaml
  text: Be angry[a], and do not sin. Do not let the sun go down on your anger[c][b],
translation:
  language: zh_hans
  text: 你们要发怒，却不要犯罪；不可让太阳在你们仍怀着怒气时落下[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可理解为：“如果你们发怒，不要犯罪。”希腊文形式上是命令式，但有人按上下文将其理解为让步性的说法。
    reason: alternative_reading
  - marker: b
    text: 这里很可能呼应《诗篇》4:4（七十士译本4:5），把发怒与不可犯罪的命令联系起来。“怒气”所译的希腊词也可指“激愤”或“恼怒”，并可能指使人发怒的“激惹”。
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: ὀργίζεσθε
  choice: 你们要发怒
  rationale: 保留希腊文命令式及其与《诗篇》4:4（七十士译本4:5）的呼应，不把它直接改写为条件句；复数“你们”也体现动词的人称和数。
- source_word: καὶ μὴ ἁμαρτάνετε
  choice: 却不要犯罪
  rationale: “不要犯罪”直接表达否定命令；καί在此连接一个限制前句的命令，译作“却”使现代汉语关系自然，同时不消除原文的张力。
- source_word: ὁ ἥλιος μὴ ἐπιδυέτω
  choice: 不可让太阳落下时
  rationale: 以汉语使役式表达第三人称否定命令，并保留“太阳落下”的具体意象。
- source_word: ἐπὶ παροργισμῷ ὑμῶν
  choice: 你们还在气头上
  rationale: παροργισμός可指愤怒、激愤或受激惹后的恼怒状态；“还在气头上”自然表达怒气持续到日落的含义，也避免将它误解为单指惹怒人的原因。
theological_decisions:
- issue: 开头是命令人发怒，还是对发怒作条件性让步
  choice: 正文按命令式译为“你们要发怒”，并由“却不要犯罪”立刻加以限制。
  alternative: “即使生气，也不要犯罪”或“如果你们发怒，不要犯罪”。
  rationale: ὀργίζεσθε在形式上是命令式，并呼应《诗篇》希腊文；保留命令语气最忠实于原文，也保留怒气与犯罪之间没有被简单等同、却受到道德和时间约束的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“气头上”属于通行现代汉语，具体表达怒气仍在持续；句法保留原文两重命令的力度。脚注兼顾命令式的另一种语境理解、旧约呼应及παροργισμός的词义范围。
