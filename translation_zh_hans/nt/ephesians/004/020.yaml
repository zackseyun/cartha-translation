  yaml_path: translation/nt/ephesians/004/020.yaml
  text: But you did not learn Messiah in this way,[a]
translation:
  language: zh_hans
  text: 但你们并不是这样学习弥赛亚[a]的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”也可译作“基督”。
    reason: 保留 Χριστός 作为称号或近似专名的两种表达可能。
lexical_decisions:
- source_word: ὑμεῖς
  choice: 你们
  rationale: 第二人称复数代词在原文中明确出现，并带有与前文所述外邦人生活方式相对照的强调；译作“你们”自然且准确。
- source_word: δὲ
  choice: 然而
  rationale: 表示与前文的鲜明转折；“然而”适合庄重而自然的现代书面语。
- source_word: οὐχ οὕτως
  choice: 并不是这样
  rationale: 保留否定及方式含义，指向前文所描述的生活方式，不把所指解释得过窄。
- source_word: ἐμάθετε
  choice: 学习
  rationale: 按 μανθάνω 的基本意义译作“学习”，不提前引入下一节较明确的“受教”含义，也不意译为“认识”。
- source_word: τὸν Χριστόν
  choice: 弥赛亚
  rationale: Χριστός 在此指具有称号意义的那一位；译作“弥赛亚”保留其受膏者含义。原文不寻常的“学习弥赛亚”结构予以保留，不擅自改成只学习某套教义。
theological_decisions:
- issue: Χριστόν 应按称号还是近似专名表达
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处可理解为称号，同时该词在早期基督徒用语中也可能具有近似专名的性质。正文采用“弥赛亚”以显出称号意义，并用脚注保留传统译法“基督”。
- issue: “学习弥赛亚”这一不寻常表达是否意译
  choice: 保留“学习弥赛亚”
  alternative: 认识弥赛亚／学习有关弥赛亚的道理
  rationale: 原文以“弥赛亚”为 μανθάνω 的直接宾语，表达刻意而不寻常；意译为“认识”或补入“有关……的道理”都会消除原有张力并增加解释。
translation_notes:
  register: 采用现代、庄重且易懂的普通话书面语。“学习弥赛亚”在中文中略显不寻常，但这是对原文刻意结构的保留；逗号帮助读者把“并不是这样”理解为对学习方式的否定。
