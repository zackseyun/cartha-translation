  text: μηδὲ δίδοτε τόπον τῷ διαβόλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/027.yaml
  text: and do not give place to the devil[a].
translation:
  language: zh_hans
  text: 也不可给魔鬼留地步[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“余地”或“机会”；希腊文直译为“不可给魔鬼地方”。
    reason: 词义选择：τόπον既可按字面理解为“地方”，在此也可指可供行动的余地或机会。
lexical_decisions:
- source_word: μηδὲ
  choice: 也不可
  rationale: 承接上文的劝诫，并保持否定命令的语气；“也不可”在现代汉语中自然表达连续的禁令。
- source_word: δίδοτε
  choice: 给……留
  rationale: δίδωμι本义为“给”；与τόπον连用时，汉语习惯表达为“给……留地步”，既保留“给”的动作，也使句子自然。
- source_word: τόπον
  choice: 地步
  rationale: τόπος字面义为“地方、位置”，此处指可供对方行动或乘隙而入的余地。“留地步”保留原文的空间意象，又避免用“机会”过度解释。
- source_word: τῷ διαβόλῳ
  choice: 魔鬼
  rationale: 带冠词的διάβολος在此是对那位邪恶敌对者的称谓；“魔鬼”是现代汉语中准确而通行的对应词。
theological_decisions:
- issue: διάβολος应理解为普通名词“毁谤者”，还是指那位邪恶者“魔鬼”
  choice: 魔鬼
  alternative: 毁谤者
  rationale: 在保罗书信的劝诫语境中，这一带冠词的单数形式通常指那位具有位格的敌对者，而不只是泛指某个毁谤人的人；译作“魔鬼”反映最可能的所指，却不增添原文没有的信息。
- issue: τόπον是否应明确解释为“机会”
  choice: 地步
  alternative: 机会
  rationale: 原文保有空间隐喻，也可引申为行动的余地或机会。正文采用“地步”以保存这种含义张力，脚注说明可能的理解。
translation_notes:
  register: 采用简洁、庄重而通行的现代书面汉语。“给魔鬼留地步”是自然且易懂的表达，同时保留原文τόπον的空间意象。
