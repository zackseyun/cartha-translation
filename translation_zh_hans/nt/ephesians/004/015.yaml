  text: ἀληθεύοντες δὲ ἐν ἀγάπῃ αὐξήσωμεν εἰς αὐτὸν τὰ πάντα, ὅς ἐστιν ἡ κεφαλή, ⸀Χριστός,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/015.yaml
  text: but speaking truth in love[a], let us grow in every way into him who is the head, Messiah[c][b],
translation:
  language: zh_hans
  text: 相反，我们要在爱中说真话[a]，在各方面[b]向着他长进；他是头，就是弥赛亚[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“为人诚实”或“践行真理”；希腊语动词既可指说诚实的话，也可包括按真理行事。
    reason: lexical_alternative
  - marker: b
    text: 或译“在一切事上”；直译为“所有的事”。
    reason: lexical_alternative
  - marker: c
    text: 希腊语为 Christos，意为“受膏者”；此处译作称号“弥赛亚”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀληθεύοντες
  choice: 说真话
  rationale: 该分词可涵盖诚实言语和按真理行事；结合上文所说的错误教导、诡诈与欺骗，正文采用自然且符合语境的“说真话”，并以脚注保留较宽的含义。
- source_word: δὲ
  choice: 相反
  rationale: 此处表示与前文随从错误、受人欺骗的情形形成温和对比；“相反”在现代汉语中清楚自然。
- source_word: ἐν ἀγάπῃ
  choice: 在爱中
  rationale: 既可表达行事的方式，也保留处于爱之领域中的意味，且没有把原文缩减为单纯的语气修饰。
- source_word: αὐξήσωμεν
  choice: 我们要……长进
  rationale: 第一人称复数虚拟式在此具有劝勉语气；“我们要”自然表达共同的 exhortation，而“长进”符合生命成长的语境。
- source_word: εἰς αὐτὸν
  choice: 向着他
  rationale: 保留 εἰς 的方向性，表达成长以他为目标，同时避免在正文中过度确定其是否含有更强的联合或归入意味。
- source_word: τὰ πάντα
  choice: 在各方面
  rationale: 字面为“所有的事”，在“长进”的搭配中最自然地表达全面、各方面的成长；脚注保留更贴近字面的可能译法。
- source_word: κεφαλή
  choice: 头
  rationale: 直接保留身体的比喻，不在译文中预先解释为“源头”“领袖”或“掌权者”。
- source_word: Χριστός
  choice: 弥赛亚
  rationale: 此处位于“头”之后作同位说明，具有称号功能；“弥赛亚”比音译式或名称化的表达更清楚地保留“受膏者”称号的性质。
theological_decisions:
- issue: ἀληθεύοντες 的语义范围
  choice: 正文译为“说真话”
  alternative: “为人诚实”或“践行真理”
  rationale: 直接语境涉及错误教导、诡诈与欺骗，因此言语层面的译法最为顺畅；但该动词可能也包括诚实生活与实行真理，故以脚注保留这一张力。
- issue: κεφαλή 的解释力度
  choice: 只译作“头”
  alternative: “源头”“领袖”或“掌权者”
  rationale: 原文使用身体比喻；直译可避免将有关来源或权柄的特定神学解释写入正文。
- issue: εἰς αὐτόν 的方向与联合意象
  choice: 译为“向着他”
  alternative: “归入他”或“长到他里面”
  rationale: “向着他”保留明确的方向性，并与汉语“长进”自然搭配；其他译法虽可能表现联合意象，却会比原文在此处更明确地限定解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“说真话”比传统表达“说诚实话”更符合当代习惯；“头”虽略显直译，却有意保留上下文的身体意象，不用容易预先解释为权位的“元首”。分号使后半句的同位说明清楚自然。
