id: EPH.4.13
reference: Ephesians 4:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μέχρι καταντήσωμεν οἱ πάντες εἰς τὴν ἑνότητα τῆς πίστεως καὶ τῆς ἐπιγνώσεως τοῦ υἱοῦ τοῦ θεοῦ, εἰς ἄνδρα τέλειον, εἰς μέτρον ἡλικίας τοῦ πληρώματος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/013.yaml
  text: until we all attain to the unity of the faith and of the knowledge of the Son of God[a], to a mature man, to the measure of the stature of the fullness of Messiah[e][d][c][b],
translation:
  language: zh_hans
  text: 直到我们众人都在信仰[a]和对上帝儿子的认识[b]上达到合一，成为一个成熟的男人[c]，达到弥赛亚[e]丰满身量[d]的尺度。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信仰”也可译作“信心”。这里可能侧重信徒共同持守的信仰内容，也可能泛指信徒的信靠。
    reason: alternative_reading
  - marker: b
    text: “认识”也可译作“充分认识”或“深入认识”。
    reason: lexical_alternative
  - marker: c
    text: 希腊文直译为“一个成熟的男人”，以阳性单数的形象描写整个教会共同达到成熟；也可译作“达到成人的成熟地步”。
    reason: lexical_alternative
  - marker: d
    text: “身量”也可理解为“成熟程度”。
    reason: lexical_alternative
  - marker: e
    text: 希腊文为 Christos，即“受膏者”；传统上常译作“基督”。这里译为“弥赛亚”，以突出其称号含义。
    reason: alternative_reading
lexical_decisions:
- source_word: μέχρι καταντήσωμεν οἱ πάντες
  choice: 直到我们众人都达到
  rationale: “直到”标明上一节所述装备工作的目标；“我们众人”保留 οἱ πάντες 对整个信徒群体的明确包含。
- source_word: εἰς τὴν ἑνότητα τῆς πίστεως
  choice: 达到信仰上的合一
  rationale: 保留 εἰς 的目标含义和 ἑνότης 的“合一”；“信仰”既可指共同持守的信仰内容，也不排除信靠的层面。
- source_word: καὶ τῆς ἐπιγνώσεως τοῦ υἱοῦ τοῦ θεοῦ
  choice: 和认识上帝儿子上的合一
  rationale: 两个属格短语共同修饰“合一”；译文把“合一”理解为同时关乎信仰和对上帝儿子的认识，并避免把 ἐπίγνωσις 的强化意味过度具体化。
- source_word: εἰς ἄνδρα τέλειον
  choice: 成为一个成熟的人
  rationale: τέλειος 在成长语境中主要指成熟、长成，而非毫无缺陷；保留单数“一个……人”，呈现全体教会共同长成一人的形象。
- source_word: εἰς μέτρον ἡλικίας
  choice: 达到……身量的尺度
  rationale: “身量”保留成长和人体的比喻，“尺度”对应 μέτρον；ἡλικία 也可能侧重成熟程度。
- source_word: τοῦ πληρώματος τοῦ Χριστοῦ
  choice: 弥赛亚丰满
  rationale: “丰满”保留 πλήρωμα 在保罗书信中的厚重含义；Χριστός 在此作为称号，译为“弥赛亚”。
theological_decisions:
- issue: τῆς πίστεως 的含义
  choice: 信仰，主要可理解为群体共同持守的信仰
  alternative: 信徒所怀的信心或信靠
  rationale: 定冠词和群体合一的语境较支持共同信仰的含义，但正文采用可兼容两种理解的“信仰”，不把争议完全消解。
- issue: εἰς ἄνδρα τέλειον 的群体性单数形象
  choice: 成为一个成熟的人
  alternative: 达到成人的成熟地步；长大成人
  rationale: 希腊文用阳性单数 ἀνήρ 描绘整个群体共同成熟；正文保留“一人”的集体形象，脚注说明其所指。
- issue: Χριστοῦ 的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处 Χριστός 具有称号和神学含义，译作“弥赛亚”；“基督”作为通行音意译在脚注中保留。
- issue: μέτρον ἡλικίας τοῦ πληρώματος 的关系
  choice: 弥赛亚丰满身量的尺度
  alternative: 弥赛亚的丰满所达到的成熟程度
  rationale: 正文尽量保留原文连续属格结构及身体成长的比喻，不将“身量”抽象化为单一的“成熟程度”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“达到……合一／成为……／达到……”保留原文三个 εἰς 短语层层推进的目标结构；“丰满身量的尺度”刻意保留原文较浓缩的成长比喻和神学张力。
