source:
  edition: SBLGNT
  text: πᾶς λόγος σαπρὸς ἐκ τοῦ στόματος ὑμῶν μὴ ἐκπορευέσθω, ἀλλὰ εἴ τις ἀγαθὸς πρὸς οἰκοδομὴν τῆς χρείας, ἵνα δῷ χάριν τοῖς ἀκούουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/029.yaml
  text: Let no rotten word come out of your mouth[a], but only such as is good for building up according to the need[d][c][b], so that it may give grace to those who hear.
translation:
  language: zh_hans
  text: 你们口中一句败坏的话也不可说出[a]；却要说合乎需要、能造就人的好话[b]，使听见的人得着恩惠[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “败坏的话”也可译作“不健康的话”或“腐烂的话”。希腊语字面意思是“腐烂的话”。
    reason: lexical_alternative
  - marker: b
    text: “合乎需要、能造就人”也可译作“按需要造就人”或“按当时的需要造就人”。
    reason: lexical_alternative
  - marker: c
    text: “使听见的人得着恩惠”也可译作“使听见的人得到益处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς λόγος σαπρὸς
  choice: 腐坏的话一句也不可
  rationale: 否定词与单数结构合起来表示全面禁止，相当于“一句也不可”。σαπρός本义为腐烂、败坏；“腐坏”保留鲜明比喻，同时在现代汉语中可自然形容有害言语。
- source_word: ἐκ τοῦ στόματος ὑμῶν μὴ ἐκπορευέσθω
  choice: 不可从你们口中说出来
  rationale: 保留言语从口中出来的身体意象，并以自然的现代汉语表达希腊语命令式的禁止语气。
- source_word: ἀλλὰ εἴ τις ἀγαθὸς
  choice: 只要说……好话
  rationale: 原文为省略结构，所指仍是λόγος。汉语补出“说”和“话”，清楚表达与前半句的对比；“只要”体现这里只许可合宜的好话。
- source_word: πρὸς οἰκοδομὴν τῆς χρείας
  choice: 按需要造就人的
  rationale: “造就”保留οἰκοδομή的建造比喻及其使人得到建立的意义；“按需要”保留压缩的属格关系，不将其完全改写为“适合场合”。
- source_word: ἵνα δῷ χάριν
  choice: 使……得恩惠
  rationale: χάρις在此既可指恩惠、恩泽，也可侧重益处。“得恩惠”保留保罗用语的神学与人际温度，同时不明确断定恩惠的来源。
- source_word: τοῖς ἀκούουσιν
  choice: 听见的人
  rationale: 简洁对应现在分词，指实际听到这些话的人，也可泛指听者。
theological_decisions:
- issue: 伦理劝勉语境中χάρις的译法
  choice: 恩惠
  alternative: 益处
  rationale: “恩惠”保留χάρις与保罗常用“恩典／恩惠”词汇之间的联系，也容许理解为言语给听者带来的善意与福益；脚注注明“益处”这一语境义，避免把此处限定为某项系统神学概念。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“腐坏”保留原文的腐烂比喻；“一句也不可”体现全面禁止。“造就”虽带一定书面色彩，但在此清楚保留建造比喻并符合经文劝勉语体。所有代词均按原文复数译为“你们”。
