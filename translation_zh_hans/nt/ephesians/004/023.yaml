  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“借着圣灵在你们心思上得到更新。”不过，“你们心思的内在精神”更可能是指你们心思的内在取向，而不是直接指圣灵。
    reason: 保留将τῷ πνεύματι理解为圣灵、并按工具性理解与格的替代读法，同时说明较可能的语法和语义理解。
lexical_decisions:
- source_word: ἀνανεοῦσθαι
  choice: 要……得到更新
  rationale: 保留现在时被动不定式的被动意义，并以“要”承接上下文“脱去—更新—穿上”的劝勉结构；不在正文中强行明说持续过程。
- source_word: δὲ
  choice: 并且
  rationale: 此处是同一组不定式之间的轻度连接，不宜译成表示强烈转折的“但是”。
- source_word: τῷ πνεύματι
  choice: 在……灵里
  rationale: 将与格理解为更新发生的范围或层面，并保留“灵”与“心思”之间不寻常的属格关系，避免直接把它解释成圣灵。
- source_word: νοὸς
  choice: 心思
  rationale: “心思”自然表达 νοῦς 所指的思想、理解与内在思维领域，也能与“灵”构成较为贴近原文的表达。
- source_word: ὑμῶν
  choice: 你们的
  rationale: 明确保留第二人称复数所有关系。
theological_decisions:
- issue: πνεύματι 是指圣灵，还是人的内在之灵或心思取向
  choice: 正文译作“在你们心思的灵里”，较自然地指人的内在精神状态或心思取向
  alternative: 由那位与圣灵相关、并作用于你们心思的灵来更新
  rationale: τοῦ νοὸς ὑμῶν 最自然地限定 πνεύματι，形成一个关于人的内在构造或取向的表达；但原文与“圣灵”的关联并非语法上绝对不可能，因此以脚注保留另一种理解。
translation_notes:
  register: 采用现代、庄重而可理解的普通话。“心思的灵”虽不是日常固定搭配，却有意保留原文独特而含混的表达；脚注说明主要解释与替代读法。
