  text: one Lord[a], one faith, one baptism;
translation:
  language: zh_hans
  text: 一位主，一个信仰[a]，一个洗礼；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信仰”所译的希腊语词（πίστις）也可译作“忠信”或“信靠”；不过，本节强调信徒共有的合一，“信仰”最符合这里的语境。
    reason: 保留πίστις的真实词义范围，同时说明正文选择。
lexical_decisions:
- source_word: εἷς / μία / ἓν
  choice: 一位／一个／一个
  rationale: 三个词是同一数词配合不同语法性别的形式，均表达“一个”，重复用语以保留本节对合一的强调；“主”按现代汉语习惯搭配量词“位”。
- source_word: κύριος
  choice: 主
  rationale: 在以弗所书4:4–6的上下文中，这是基督论称号，最自然地指耶稣；“主”也保留原文称号的庄重性。
- source_word: πίστις
  choice: 信仰
  rationale: 此处最可能指信徒共同持守的信仰或信靠的回应。“信仰”在现代汉语中清楚自然，也适合本节强调群体合一的语境。
- source_word: βάπτισμα
  choice: 洗礼
  rationale: 这是该词所指入门礼仪的标准、明确译法；不另行限定其方式、功效或神学性质。
theological_decisions:
- issue: “主”的所指
  choice: 保留为基督论称号“主”，在上下文中最自然地指耶稣
  alternative: 泛指上帝
  rationale: 4:4–6依次提到一位圣灵、一位主以及一位上帝和父，因此“主”最自然地指向圣子；译文不在正文中增添所指。
- issue: “一个洗礼”的含义
  choice: 中性地译作“一个洗礼”
  alternative: 特指圣礼功效；或主要指属灵、隐喻性的洗礼
  rationale: 原文宣告洗礼的唯一性和合一意义，却没有在本节说明施洗方式、功效或具体神学机制，因此不替读者解决宗派争议。
- issue: πίστις在此处的意义
  choice: 信仰
  alternative: 忠信；信靠
  rationale: 该词确可表达“忠信”或“信靠”，但本节列举信徒共有的合一要素，“信仰”最契合这一语境，同时以脚注保留词义范围。
translation_notes:
  register: 采用现代、简洁而庄重的标准普通话。保留原文三个“一”的并列结构；为使汉语自然，“主”使用量词“位”，其余两项使用“个”。标点以分号承接上下文的整组列举。
