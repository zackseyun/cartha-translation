source:
  edition: SBLGNT
  text: Διὸ ἀποθέμενοι τὸ ψεῦδος λαλεῖτε ἀλήθειαν ἕκαστος μετὰ τοῦ πλησίον αὐτοῦ, ὅτι ἐσμὲν ἀλλήλων μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/025.yaml
  text: Therefore[a], having put away falsehood, let each one speak truth with his neighbor, because we are members of one another.
translation:
  language: zh_hans
  text: 所以，你们既已除去虚假[a]，各人要与邻舍说真话，因为我们彼此互为肢体。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“谎言”。
    reason: 原文τὸ ψεῦδος既可概括指“虚假”，也可较形式地译为“谎言”；保留这一词义选择。
lexical_decisions:
- source_word: Διὸ
  choice: 所以
  rationale: 表示由上文推出结论，现代汉语中“所以”自然清楚，也保留了推论关系。
- source_word: ἀποθέμενοι
  choice: 既已除去
  rationale: 不定过去时中间语态分词依附于主要命令；“既已”体现先行或作为前提的弃绝行动，“除去”传达脱下、丢弃之意。
- source_word: τὸ ψεῦδος
  choice: 虚假
  rationale: 带冠词的单数名词在此可概括说谎、虚假这一类伦理恶行；“虚假”与下文“真话”形成自然对照，同时以脚注保留“谎言”这一较形式对应的理解。
- source_word: λαλεῖτε ἀλήθειαν
  choice: 要……说真话
  rationale: 现在时命令语气表达持续适用的命令；“说真话”是现代汉语中直接自然的表达。
- source_word: ἕκαστος
  choice: 各人
  rationale: 保留针对群体中每一个人的分配意义，且在汉语中自然并具有普遍涵盖性。
- source_word: μετὰ τοῦ πλησίον αὐτοῦ
  choice: 对邻舍
  rationale: μετά加属格本义为“与”，但汉语“对邻舍说真话”更自然，也准确表达说话所面向的人；“邻舍”保留其伦理和群体关系含义。
- source_word: ὅτι
  choice: 因为
  rationale: 明确引出命令的理由，保留原文因果关系。
- source_word: ἐσμὲν ἀλλήλων μέλη
  choice: 我们彼此互为肢体
  rationale: “肢体”保留μέλη的身体隐喻；“彼此互为”表达共同体成员之间相互联结、相互归属的关系，而不补入原文未明说的解释。
theological_decisions:
- issue: ψεῦδος的范围
  choice: 正文译作“虚假”
  alternative: “谎言”或“那谎言”
  rationale: 本段伦理劝勉主要将一般性的虚假与说真话相对照，因此“虚假”较符合语境；但冠词和单数形式容许较具体或集合性的“谎言”，故以脚注保留。
- issue: ἀλλήλων μέλη的身体与共同体隐喻
  choice: 译作“我们彼此互为肢体”
  alternative: “我们都是彼此的肢体”或“我们彼此相属，同为肢体”
  rationale: 正文尽量保留原文浓缩而略带张力的身体隐喻，不擅自补出“一个身体”或将其完全解释为一般性的彼此归属。
- issue: ἕκαστος……αὐτοῦ的性别表达
  choice: 译作不标性别而具普遍涵盖性的“各人……邻舍”
  alternative: 加入男性代词的形式
  rationale: 希腊语阳性单数在此具有代表性和泛指功能；现代汉语无需用性别代词即可准确保留逐一适用于全体会众的意义。
translation_notes:
  register: 采用现代、庄重而通顺的劝勉语体。“既已……就要……”清楚呈现分词与主命令的关系；“邻舍”“肢体”保留圣经语境中熟悉且仍可理解的关系与身体意象。
