  text: ἀποθέσθαι ὑμᾶς κατὰ τὴν προτέραν ἀναστροφὴν τὸν παλαιὸν ἄνθρωπον τὸν φθειρόμενον κατὰ τὰς ἐπιθυμίας τῆς ἀπάτης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/022.yaml
  text: to put off[a], with respect to your former way of life, the old man, which is being corrupted according to deceitful desires[b],
translation:
  language: zh_hans
  text: 就你们从前的生活方式而言，脱去那被欺骗性的欲望支配、正在败坏的旧人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “旧人”直译原文；这里不是专指男性，而是指与从前生活方式相连的旧有为人，也可译作“旧我”。原文直译为“欺骗的欲望”；可指带有欺骗性、使人受迷惑的欲望。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποθέσθαι
  choice: 脱去
  rationale: 保留脱下衣物的比喻，并与第24节的“穿上”相呼应；不添加“必须”或明确命令语气，以免消除不定式在上下文中既可表示所受教导的内容、又带有劝勉意味的张力。
- source_word: κατὰ τὴν προτέραν ἀναστροφὴν
  choice: 就你们从前的生活方式而言
  rationale: ἀναστροφή指人的行为方式或生活样式；此处κατά较自然地表示所论及的范围。“就……而言”既符合现代汉语，也避免把它误解为遵照旧生活的规范。
- source_word: τὸν παλαιὸν ἄνθρωπον
  choice: 那旧人
  rationale: “旧人”贴近ἄνθρωπος的字面形象，也保留保罗表达中可能具有的代表性、群体性含义；“那”使其在汉语句中自然，并指向与从前生活相连的旧有为人。
- source_word: φθειρόμενον
  choice: 正……不断败坏
  rationale: 以“正……不断”表达现在时被动分词所描写的持续过程；“败坏”兼有道德腐化和走向毁坏的意味。
- source_word: κατὰ τὰς ἐπιθυμίας
  choice: 随着……欲望
  rationale: κατά在这里表明败坏过程与这些欲望相应并受其影响；“随着”在汉语中自然，同时没有把关系收窄为单纯的工具或原因。
- source_word: τῆς ἀπάτης
  choice: 迷惑人的
  rationale: 原文是属格结构，字面为“欺骗的欲望”。译作“迷惑人的欲望”自然表达这些欲望带有欺骗性，但脚注保留原结构及可能的关系张力。
theological_decisions:
- issue: τὸν παλαιὸν ἄνθρωπον所指的范围
  choice: 旧人
  alternative: 旧我
  rationale: “旧人”保留原文ἄνθρωπος的人论用语及其可能的代表性或群体性回响，并非专指男性；“旧我”虽较易懂，却可能把含义限定为个人心理层面的自我。
- issue: ἀποθέσθαι在上下文中的语力
  choice: 脱去
  alternative: 要脱去
  rationale: 原文不定式承接前文，说明他们所领受教导的内容，同时可含劝勉力量。省去明确的“要”，让汉语短语保留这种开放性，而不武断地译成直接命令或已经完成的事件。
- issue: φθειρόμενον的时间与状态
  choice: 正……不断败坏
  alternative: 已经败坏
  rationale: 现在时分词着重持续中的败坏过程；译文不把“旧人”处理成仅在过去已经完成的状态。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“脱去—穿上”的衣着意象予以保留；句式仍显出本节承接前文的性质。用“欲望”而不用较窄的“情欲”，以免把范围限定为性欲。
