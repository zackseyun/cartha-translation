  text: ὁ καταβὰς αὐτός ἐστιν καὶ ὁ ἀναβὰς ὑπεράνω πάντων τῶν οὐρανῶν, ἵνα πληρώσῃ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/010.yaml
  text: The one who descended is himself also the one who ascended far above all the heavens[b][a], so that he might fill all things.
translation:
  language: zh_hans
  text: 那降下的，正是也升到一切诸天之上的那一位，为要充满万有[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “充满”或可译作“成全”。希腊语动词在某些语境中有“成全、应验”的意思，但这里按上下文译作“充满”。
    reason: lexical_alternative
  - marker: b
    text: “万有”也可译作“一切”。原文范围广泛，没有进一步说明具体所指。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καταβὰς
  choice: 那降下的
  rationale: 带冠词的简单过去时分词作名词用；译为“那降下的”，既保留指称作用，也以简洁自然的现代汉语表达已经发生的行动。
- source_word: αὐτός ἐστιν καὶ
  choice: 正是……也……的
  rationale: αὐτός在此具有强调作用，突出降下者与升上者是同一位；“正是”自然地保留这一身份强调。
- source_word: ὁ ἀναβὰς
  choice: 那升到……的
  rationale: 与ὁ καταβὰς平行，同样按名词化分词处理，以保持原文结构上的对应。
- source_word: ὑπεράνω πάντων τῶν οὐρανῶν
  choice: 升到诸天之上、远超一切诸天
  rationale: ὑπεράνω兼有空间上的“在上方”和超越、尊高之意；此译法保留复数“诸天”及πάντων的全面范围，同时以自然汉语表达其强调意味。
- source_word: ἵνα
  choice: 为要
  rationale: 表达目的关系，较明确地保留ἵνα在此的目的意味，并符合庄重而通顺的经文语体。
- source_word: πληρώσῃ
  choice: 充满
  rationale: 在本段语境中，“充满”最直接地反映πληρόω的基本意义，并与下文“丰满”概念相呼应；“成全”仍是可保留的词义可能。
- source_word: τὰ πάντα
  choice: 万有
  rationale: “万有”是现代中文宗教与庄重语体中可理解的概括表达，保留中性复数短语的广泛、未限定范围，不将其缩窄为人群或具体解释为宇宙。
theological_decisions:
- issue: 降下者与升上者的身份关系
  choice: 用“正是”明确保留二者为同一位的强调
  alternative: 仅译为“那降下的也是那升上的”，弱化身份强调
  rationale: 原文的αὐτός及两个平行的带冠词分词着重表明降下者就是升上者；译文保留这一基督论重点，却不增添经文本身未说明的细节。
- issue: τὰ πάντα的范围
  choice: 译为“万有”
  alternative: “一切”“所有人”或“整个宇宙”
  rationale: 原文范围广泛而未进一步限定；“万有”保留其全面性和神学张力，避免将其限制为所有人，也避免用解释性措辞径直等同于物质宇宙。
- issue: πληρώσῃ的语义
  choice: 译为“充满”
  alternative: “成全”
  rationale: “充满”更贴近本段关于丰满、充盈的语境；脚注保留“成全”这一在其他语境中可能成立的理解，不在正文中彻底排除。
translation_notes:
  register: 采用现代、庄重且便于普通读者理解的汉语。“正是”保留原文对同一身份的强调；“诸天”和“万有”保留原文复数宇宙性表达及开放范围。正文避免加入关于“降下”具体所指或“充满”实现方式的解释。
