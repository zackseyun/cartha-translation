  text: πᾶσα πικρία καὶ θυμὸς καὶ ὀργὴ καὶ κραυγὴ καὶ βλασφημία ἀρθήτω ἀφ’ ὑμῶν σὺν πάσῃ κακίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/031.yaml
  text: Let all bitterness and wrath and anger and clamor and slander be taken away from you[a], along with all malice.
translation:
  language: zh_hans
  text: 一切苦毒、暴怒、愤怒、喧嚷和毁谤[a]，连同一切恶意，都要从你们中间除掉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“辱骂”；传统译作“亵渎”。按本节语境，这个希腊词很可能指伤害他人的言语。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα
  choice: 一切
  rationale: 修饰整组恶行，表达彻底、全面除去之意；“一切”在现代汉语中自然，并保留其概括力。
- source_word: πικρία
  choice: 苦毒
  rationale: 指内心积存的尖刻怨恨；“苦毒”是清楚而庄重的圣经伦理用语。
- source_word: θυμός
  choice: 暴怒
  rationale: 侧重激烈、爆发性的怒气，以便与后面的 ὀργή 区分。
- source_word: ὀργή
  choice: 愤怒
  rationale: 泛指持续或较一般的怒气；与“暴怒”并列，可自然保留两个近义词之间的差别。
- source_word: κραυγή
  choice: 喧嚷
  rationale: 在此指敌意冲突中的高声叫嚷；“喧嚷”比单纯“喊叫”更能体现扰乱群体关系的意味。
- source_word: βλασφημία
  choice: 毁谤
  rationale: 此处处于人际伦理恶行清单中，最可能指伤害他人的诋毁性言语；同时以脚注保留“辱骂”等较宽泛的可能。
- source_word: ἀρθήτω ἀφ’ ὑμῶν
  choice: 都要从你们中间除掉
  rationale: 保留被动命令的除去含义；“从你们中间”自然表达这些恶行应离开信徒个人及群体生活。
- source_word: σὺν πάσῃ κακίᾳ
  choice: 连同一切恶意也要除掉
  rationale: κακία 在此更具体地指恶毒、害人之心，而非抽象的一切邪恶；补出“也要除掉”，使中文句意完整，并承接前面的命令。
theological_decisions:
- issue: βλασφημία 在伦理恶行清单中的含义
  choice: 理解为人际间的“毁谤”
  alternative: “辱骂”或传统译法“亵渎”
  rationale: 上下文聚焦于破坏群体关系的态度和言语，因此人际性的“毁谤”最符合语境；脚注保留词义范围，避免把本词不必要地限定为对上帝的亵渎。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“暴怒／愤怒”保留 θυμός 与 ὀργή 的并列差别；“喧嚷”维持较正式的经文语体，但仍为普通读者所理解。脚注标记已在正文相应位置标出。
