  rationale: 修订仅改善“εἰς ἡμέραν ἀπολυτρώσεως”的中文可读性并澄清句法。正文采用自然的“直到得赎的日子”，脚注保留目标／归向的语义范围；未对受印记的机制或其神学含义作任何扩写。
