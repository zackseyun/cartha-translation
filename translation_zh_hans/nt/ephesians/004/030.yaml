  text: καὶ μὴ λυπεῖτε τὸ πνεῦμα τὸ ἅγιον τοῦ θεοῦ, ἐν ᾧ ἐσφραγίσθητε εἰς ἡμέραν ἀπολυτρώσεως.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/030.yaml
  text: And do not grieve the Holy Spirit of God[a], in whom you were sealed for the day of redemption.
translation:
  language: zh_hans
  text: 也不要使上帝的圣灵忧伤；你们是在他里面受了印记，直到得赎的日子[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为着得赎的日子”或“归向得赎的日子”。希腊文εἰς ἡμέραν ἀπολυτρώσεως直译可作“为着／归向得赎的日子”；此处“直到”表达其面向将来得赎之日的含义。
    reason: εἰς可表达目标、归向，并在此语境中带有面向未来终点的意味；脚注保留较贴近原文的替代译法。
lexical_decisions:
- source_word: λυπεῖτε
  choice: 使……忧伤
  rationale: μή加现在时命令式构成禁止语气。“使……忧伤”自然保留了λυπέω的情感与关系意味，也呼应圣灵是可被忧伤的位格性对象。
- source_word: πνεῦμα τὸ ἅγιον τοῦ θεοῦ
  choice: 上帝的圣灵
  rationale: 保留τοῦ θεοῦ所表达的所属关系；“上帝的圣灵”是现代汉语中自然、庄重且完整的表达。
- source_word: ἐν ᾧ
  choice: 在他里面
  rationale: 保留ἐν的基本空间性隐喻，同时用“他”指向圣灵，避免把圣灵表达成非位格的事物；不改译为较具解释性的“借着他”。
- source_word: ἐσφραγίσθητε
  choice: 你们……受了印记
  rationale: 体现不定过去时被动语态，并保留印记所含的认证、归属或保障隐喻，而不在正文中限定其具体机制。
- source_word: εἰς ἡμέραν ἀπολυτρώσεως
  choice: 为得赎的日子
  rationale: “为”保留εἰς所能表达的目标和未来指向；“得赎的日子”在上下文中指向特定的终末性日子，中文无需另加冠词。
theological_decisions:
- issue: 关系从句中对圣灵的位格性指称
  choice: 用“在他里面”
  alternative: 在它里面；借着他
  rationale: 希腊语关系代词因πνεῦμα的语法性别而为中性，但所指的圣灵在本句中能被“忧伤”。中文用“他”忠实表达其位格性，同时“在……里面”比“借着……”更直接保留ἐν。
- issue: 受印记与得赎之日的关系
  choice: 为得赎的日子
  alternative: 直到得赎的日子
  rationale: 正文保留εἰς的目标、归向意味，不把它完全收窄为时间终点，也不由此推导经文本身未明说的教义体系；脚注交代常见的时间性理解。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“也不要”承接上文；分号呈现禁止命令与随后说明之间的紧密关系。正文刻意保留“印记”和“为……日子”的源语隐喻与目标意味，不作教义性扩写。
