  to: 整个身体从他而来，借着每一处供应的连接，彼此联结、凝聚在一起；各个部分都按自己的分量发挥作用，使身体生长，在爱中建造自己。
  rationale: 修订澄清“从他”与基督作为身体来源的关系，改善中文长句的可读性，并删除无原文依据的“渐渐”。“彼此联结、凝聚在一起”分别体现“配合／联结”和“使之凝聚／维系”的并列身体意象；脚注保留ἁφή与ἐπιχορηγία在“连接、关节、韧带”和“供应、支持”之间的可译弹性。
