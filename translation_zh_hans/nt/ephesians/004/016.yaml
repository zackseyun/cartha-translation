    rationale: 该表达在中文中容易理解为“需要供给的关节”，而非“带来供应的连接／关节”。
  revised_text: 整个身体从他而来，借着每一处供应的连接，彼此联结、凝聚在一起；各个部分都按自己的分量发挥作用，使身体生长，在爱中建造自己。
