  naturalness: 原句开头搭配不自然，且“供给所需的关节”不符合现代汉语常用表达。“每一处供应的连接”较通顺，并保留该短语在“关节／连接处”与“供应”之间的语义弹性。
  terminology: 将“建立自己”改为“建造自己”，更直接保留οἰκοδομή的建造比喻；“在爱中”保留不变。“各个部分都按自己的分量发挥作用”自然表达κατ’ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους，未加入“适当”等解释性限定。
