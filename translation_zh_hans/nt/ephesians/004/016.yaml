  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐξ οὗ πᾶν τὸ σῶμα συναρμολογούμενον καὶ συμβιβαζόμενον διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας κατ’ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους τὴν αὔξησιν τοῦ σώματος ποιεῖται εἰς οἰκοδομὴν ἑαυτοῦ ἐν ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/016.yaml
  text: from whom the whole body[a], being joined together and held together through every supporting joint, according to the working in measure of each individual part[d][c][b], causes the growth of the body for building itself up in love.
translation:
  language: zh_hans
  text: 整个身体从他而来，借着每一处供应的连接，彼此联结、凝聚在一起；各个部分都按自己的分量发挥作用，使身体生长，在爱中建造自己。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξ οὗ
  choice: 都从他
  rationale: 上文的先行词是基督（15节），因此采用指人的“他”；“从”保留基督作为身体生长之源的含义。
- source_word: πᾶν τὸ σῶμα
  choice: 全身
  rationale: 自然简洁地表达单数集合意义的“整个身体”。
- source_word: συναρμολογούμενον καὶ συμβιβαζόμενον
  choice: 联结并结合在一起
  rationale: 保留两个并列分词所表达的配合与凝聚，也反映其被动意义，同时避免中文重复累赘。
- source_word: διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας
  choice: 借着每一个供给所需的关节
  rationale: 保留具体的身体意象；ἐπιχορηγία的供给意义修饰ἁφή，但两者关系在希腊文中有一定弹性，因此用脚注列出可行译法。
- source_word: κατ’ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους
  choice: 照着各部分各自分量的运作
  rationale: 既保留ἐνέργεια的活动、运作之意，也表达每一部分按其分量发挥作用；不加入原文未明说的“适当”。
- source_word: τὴν αὔξησιν τοῦ σώματος ποιεῖται
  choice: 使身体渐渐长大
  rationale: 以自然中文表达“促成身体的增长”，并让“全身”保持为语法上的行动主体。
- source_word: εἰς οἰκοδομὴν ἑαυτοῦ
  choice: 建立自己
  rationale: 保留οἰκοδομή的建造隐喻和ἑαυτοῦ的反身意义。
- source_word: ἐν ἀγάπῃ
  choice: 在爱中
  rationale: 直接保留保罗在本段反复强调的爱之范围或氛围。
theological_decisions:
- issue: 教会成长的来源与参与者
  choice: 身体从基督得以联结，并借各部分按其分量运作而成长。
  alternative: 把ἐξ οὗ理解为非人格的“从它”，或只强调各关节和肢体是成长的来源。
  rationale: 上下文支持“他”指基督；同时，本节也明确保留全身各部分参与运作的次级作用，不将两者彼此排除。
- issue: 身体意象中ἁφή与ἐπιχορηγία的关系
  choice: 正文译为“供给所需的关节”，保留关节及供给的双重意象。
  alternative: “供应的关节”“起支持作用的关节”“提供供应的连接处”或“韧带”。
  rationale: 原短语可侧重接合点、关节或供应功能；正文保持具体身体比喻，脚注则保留真实的词义与结构弹性。
- issue: 身体是否参与自身的建造
  choice: 译作“使身体渐渐长大，在爱中建立自己”。
  alternative: 将基督单独处理为“使身体长大”的直接语法主语。
  rationale: 句法上πᾶν τὸ σῶμα最自然地作ποιεῖται的主语；但ἐξ οὗ仍清楚表明这一切源于基督，从而保留经文中的双重张力。
translation_notes:
  register: 采用现代、庄重且可朗读的标准普通话。“各部分各自分量的运作”略带形式对应，以保留希腊文“按运作、在分量中”的结构和含义；整体句法则适度调整，使长句在中文中仍然清楚。
