  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ πάσης
  choice: 以完全的
  rationale: μετά加属格表示伴随的方式；πάσης加强其完整、充分的程度。译作“以完全的”既保留修饰力度，也符合现代汉语表达。
- source_word: ταπεινοφροσύνης
  choice: 谦卑
  rationale: 该词指心思与态度上的自谦、不自高；“谦卑”在现代汉语中清楚、庄重，也符合这里的伦理含义。
- source_word: πραΰτητος
  choice: 温柔
  rationale: 该词表示受约束、不粗暴的温和态度；“温柔”自然易懂，并不暗示软弱。
- source_word: μακροθυμίας
  choice: 忍耐
  rationale: 该词侧重面对他人时长久忍耐、不轻易发怒；“忍耐”简洁地传达这一含义。
- source_word: ἀνεχόμενοι
  choice: 彼此包容
  rationale: 现在分词表达持续容忍、承受彼此不足的行动；“包容”比“忍受”少一些负面色彩，又保留关系中的容让之意。
- source_word: ἀλλήλων
  choice: 彼此
  rationale: 这是相互代词；“彼此”是现代汉语中自然、准确的对应表达。
- source_word: ἐν ἀγάπῃ
  choice: 在爱中
  rationale: ἐν加与格可表示行动发生的领域或方式；“在爱中”保留这一开放性，不限定为单纯的工具或动机。
theological_decisions:
- issue: ἀγάπη的译法
  choice: 爱
  alternative: 仁爱
  rationale: “爱”是该词直接、广泛且自然的现代汉语译法；“仁爱”可能增添特定伦理色彩。此处不进一步限定爱的种类，以保留原文的宽度。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。保留原文作为上文劝勉之延续的短语结构，并以逗号结尾；不擅自补入命令词。“以完全的谦卑和温柔”对应首个μετά短语，“存着忍耐”对应第二个μετά短语，尽量显出原文的平行层次。
