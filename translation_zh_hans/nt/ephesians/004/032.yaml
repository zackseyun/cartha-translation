id: EPH.4.32
reference: Ephesians 4:32
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀γίνεσθε εἰς ἀλλήλους χρηστοί, εὔσπλαγχνοι, χαριζόμενοι ἑαυτοῖς καθὼς καὶ ὁ θεὸς ἐν Χριστῷ ἐχαρίσατο ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/032.yaml
  text: And be kind to one another[a], tenderhearted, forgiving one another[b], just as God in Messiah forgave you.
translation:
  language: zh_hans
  text: 你们要彼此友善，心存怜悯，彼此饶恕，正如上帝在弥赛亚里饶恕了你们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在弥赛亚里”也可理解为“借着弥赛亚”。
    reason: 保留 ἐν Χριστῷ 在中文中可能具有的联合／领域义与工具义之间的解释空间。
lexical_decisions:
- source_word: γίνεσθε
  choice: 要
  rationale: 以“要”表达现在时命令语气，作为持续品格与行为的劝勉；中文不必生硬译为“成为”。
- source_word: εἰς ἀλλήλους
  choice: 彼此
  rationale: 自然表达关系的相互性；方向含义已由上下文充分体现。
- source_word: χρηστοί
  choice: 友善
  rationale: 符合人际伦理语境，也与后面的内在怜悯有所区分。
- source_word: εὔσπλαγχνοι
  choice: 心存怜悯
  rationale: 表达发自内心的体恤与慈悲，比单译“善良”更能保留该词的情感力度。
- source_word: χαριζόμενοι
  choice: 饶恕
  rationale: 下文以上帝的行动作比较，明确支持“宽免过犯、饶恕”的语境义。
- source_word: ἑαυτοῖς
  choice: 彼此
  rationale: 复数反身代词在此具有相互意义，现代汉语自然译作“彼此”。
- source_word: καθὼς καὶ
  choice: 正如
  rationale: 自然表达对应比较；希腊文 καί 的强调不另加“也”，避免中文累赘。
- source_word: ὁ θεὸς
  choice: 上帝
  rationale: 直接译出主语，并采用庄重而通行的现代汉语称谓。
- source_word: ἐν Χριστῷ
  choice: 在弥赛亚里
  rationale: 保留介词 ἐν 的联合或领域表达，不擅自窄化为工具性的“借着”；Χριστός 在此按称号译为“弥赛亚”。
- source_word: ἐχαρίσατο
  choice: 饶恕了
  rationale: 在本句指上帝已经施行的饶恕；“了”自然体现不定过去时所指向的既成行动。
- source_word: ὑμῖν
  choice: 你们
  rationale: 明确保留第二人称复数受事者。
theological_decisions:
- issue: ἐν Χριστῷ 的表达
  choice: 在弥赛亚里
  alternative: 借着弥赛亚；在基督里
  rationale: “在弥赛亚里”最直接保留 ἐν 的措辞及其可能包含的联合、领域或代表性含义，不把它径直解释成工具关系；“弥赛亚”则保留 Χριστός 的称号性质。
- issue: 信徒彼此饶恕与上帝饶恕的比较
  choice: 正如上帝……饶恕了你们
  alternative: 因为上帝……饶恕了你们
  rationale: καθὼς 表达范式性的对应比较，而非单纯因果；译作“正如”保留两者之间的神学张力，不额外说明其关系。
translation_notes:
  register: 采用现代、庄重而易懂的劝勉语体。三个并列要求以“彼此友善，心存怜悯，彼此饶恕”呈现；末句保留原文的比较结构。所有脚注标记均已置于正文。
