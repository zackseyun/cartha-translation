  text: καὶ ἐνδύσασθαι τὸν καινὸν ἄνθρωπον τὸν κατὰ θεὸν κτισθέντα ἐν δικαιοσύνῃ καὶ ὁσιότητι τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/024.yaml
  text: and to put on the new man[d][c][b][a], created according to God in righteousness and holiness of the truth.
translation:
  language: zh_hans
  text: 并且穿上新人[a]；这新人是照着神受造的，在真理的公义[c]和圣洁中[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“新的自我”或“新的人”。希腊文直译为“新人”，与上下文的“旧人”相呼应。
    reason: lexical_alternative
  - marker: c
    text: “公义”也可译作“正义”。
    reason: alternative_reading
  - marker: d
    text: “真理的公义和圣洁”也可理解为“真实的公义和圣洁”或“出于真理的公义和圣洁”。原文的“真理的”可能同时关联“公义”和“圣洁”。
    reason: ambiguity
lexical_decisions:
- source_word: ἐνδύσασθαι
  choice: 穿上
  rationale: 承接上下文“脱下／穿上”的衣着比喻；简洁自然，并保留希腊文的主动意象。
- source_word: τὸν καινὸν ἄνθρωπον
  choice: 新人
  rationale: “新人”与上文“旧人”形成明确对应，也保留ἄνθρωπος的代表性人论表达；“新的自我”虽较口语化，却会削弱这一词语联系。
- source_word: κατὰ θεὸν
  choice: 照着神
  rationale: 尽量保留κατά加宾格所表达的依照、符合之意，不在正文中直接限定为“神的形像”。
- source_word: κτισθέντα
  choice: 创造的
  rationale: 保留被动分词的创造用语及其神学呼应，并明确修饰“新人”。
- source_word: δικαιοσύνῃ
  choice: 公义
  rationale: 在保罗书信语境中，“公义”是δικαιοσύνη稳妥且通行的译法；“正义”作为语义范围内的可能译法收入脚注。
- source_word: ὁσιότητι
  choice: 圣洁
  rationale: 自然表达ὁσιότης所指向的敬虔、合乎神的圣洁品格。
- source_word: τῆς ἀληθείας
  choice: 真理的
  rationale: 保留属格结构及其一定程度的开放性，避免在正文中强行判定为“真实的”或“出于真理的”；中文虽较凝练，仍可理解为真理所具有或产生的公义与圣洁。
theological_decisions:
- issue: “新人”的人论表达
  choice: 保留“新人”
  alternative: 新的自我；新造的人
  rationale: 希腊文使用阳性单数ἄνθρωπος，并与上下文的“旧人”相对。“新人”既是现代汉语中可理解的圣经表达，也避免把群体性或代表性含义缩减为个人心理层面的“自我”。
- issue: κατὰ θεὸν的关系
  choice: 照着神
  alternative: 照着神的形像；按照神的样式
  rationale: 原文没有明说“形像”或“样式”。正文保留较宽泛的“照着神”，脚注说明其可能表示符合神或神的样式。
- issue: τῆς ἀληθείας修饰范围和语义
  choice: 译作“真理的”，让它自然关联“公义和圣洁”两项
  alternative: 真实的公义和圣洁；出于真理的公义和圣洁
  rationale: 属格可作性质、来源或归属等理解。直译能保留这种张力；脚注提供较自然但更具解释性的读法。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“穿上新人”保留上下文的衣着隐喻；分号和“这新人”使长修饰结构在中文中更清楚。对“真理的公义和圣洁”保留原文属格的凝练与歧义，并用脚注解释可能读法。
