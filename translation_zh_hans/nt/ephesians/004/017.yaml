  text: Τοῦτο οὖν λέγω καὶ μαρτύρομαι ἐν κυρίῳ, μηκέτι ὑμᾶς περιπατεῖν καθὼς καὶ ⸀τὰ ἔθνη περιπατεῖ ἐν ματαιότητι τοῦ νοὸς αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/017.yaml
  text: 'Therefore I say this and testify in the Lord: you must no longer walk as the Gentiles walk[a], in the futility of their minds,'
translation:
  language: zh_hans
  text: 所以，我这样说，并在主里郑重声明：你们不可再像外邦人[a]那样，带着虚妄的心思行事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“列国”；ἔθνη在此常指非犹太人，即“外邦人”。有些译本译作“异教徒”，但这较原词加入更强的宗教色彩。
    reason: 词义替代：说明ἔθνη的基本词义及其在本处的语境用法，并提示“异教徒”这一较强的解释性译法。
lexical_decisions:
- source_word: Τοῦτο οὖν λέγω
  choice: 所以，我这样说
  rationale: οὖν承接上文并引出推论，译为“所以”；Τοῦτο作为λέγω的宾语，按现代汉语自然表达为“这样说”。
- source_word: μαρτύρομαι
  choice: 郑重作证
  rationale: 该词在这里带有庄严申明、见证的语气；“郑重作证”既保留见证含义，也体现劝诫的严肃性。
- source_word: ἐν κυρίῳ
  choice: 在主里
  rationale: 保留原文介词结构及其可能同时涉及所属范围和权柄依据的张力，不窄化为“奉主之名”或“在主面前”。
- source_word: μηκέτι ὑμᾶς περιπατεῖν
  choice: 你们不可再……行事
  rationale: μηκέτι表示停止从前的行为；不定式在λέγω与μαρτύρομαι之后具有劝诫力量。“不可再”自然传达禁令，“行事”则在汉语中保留περιπατέω作为生活行为隐喻的惯用圣经表达。
- source_word: καθὼς καὶ τὰ ἔθνη περιπατεῖ
  choice: 像外族人那样行事
  rationale: ἔθνη在保罗语境中常指犹太人以外的各族。“外族人”保留族群及盟约语境，又避免“异教徒”额外加入原词未明说的宗教贬义；καί在此不必机械译出。
- source_word: ἐν ματαιότητι τοῦ νοὸς αὐτῶν
  choice: 存着虚妄的心思
  rationale: ματαιότης指空虚、无益、徒然的状态；“虚妄”兼具空洞与偏离真实之意。νοῦς译为“心思”，指人的思想和判断能力，并避免提前混同下一节的διάνοια。
theological_decisions:
- issue: 在写给主要由外族信徒组成的教会时如何翻译ἔθνη
  choice: 外族人
  alternative: 列国；外邦人；异教徒
  rationale: “外族人”保留保罗笔下相对于犹太人的族群与盟约类别，同时不把经文理解为对所有非犹太人在每一方面的本体性判断。“异教徒”则会加入更强的宗教评价。
- issue: λέγω καὶ μαρτύρομαι之后不定式περιπατεῖν的劝诫力度
  choice: 你们不可再……行事
  alternative: 要你们不再……行事；你们不再……行事
  rationale: 上下文中的不定式承载庄重劝诫，现代汉语需明确其规范性力量；“不可再”表达使徒劝令的迫切性，但不额外引入原文之外的神学范畴。
- issue: ἐν κυρίῳ所表达的是范围还是权柄
  choice: 在主里
  alternative: 凭着主；在主面前
  rationale: 原文可涉及说话者与主联合的范围，也可暗含从主而来的权柄。直译“在主里”保存这层开放性，不替原文单方面作出解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“行事”保留本节重复出现的περιπατέω伦理隐喻；“在主里”沿用新约核心表达。句末使用完整陈述句标点，以适合单节出版呈现。
