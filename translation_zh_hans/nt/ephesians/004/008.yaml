  text: διὸ λέγει· Ἀναβὰς εἰς ὕψος ᾐχμαλώτευσεν αἰχμαλωσίαν, ⸀ἔδωκεν δόματα τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/008.yaml
  text: Therefore it says[a], “Having ascended on high[b], he led captivity captive and gave gifts to men.”
translation:
  language: zh_hans
  text: 所以经上说：“他升上高处，掳获了被掳的人[a]，把礼物赐给人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“掳掠了被掳的（人）。”希腊文以同源的动词和名词组成鲜明的表达，呼应《诗篇》68:18；也可理解为“带走一群俘虏”。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: 所以
  rationale: 保留承接上文论证的推论关系；“所以”在现代汉语中自然、清楚。
- source_word: λέγει
  choice: 经上说
  rationale: 希腊文为无明示主语的现在时引文公式；此处显然引述《诗篇》，译作“经上说”符合汉语习惯，同时不把说话者具体认定为某一位。
- source_word: Ἀναβὰς εἰς ὕψος
  choice: 他升上高处
  rationale: 以顺畅的汉语表达先于主要动作发生的上升，并保留“高处”的空间及尊荣意味，不进一步限定为某个地点。
- source_word: ᾐχμαλώτευσεν αἰχμαλωσίαν
  choice: 掳掠了俘虏
  rationale: 动词与宾语在希腊文中同源，形成强烈而富有诗意的表达；“掳掠了俘虏”尽量保留这种重复呼应，同时仍可为现代读者理解。
- source_word: ἔδωκεν δόματα
  choice: 把礼物赐给
  rationale: “礼物”直接对应 δόματα；用“赐给”体现给予者的尊荣身份，却不把礼物预先解释为某一种特定属灵恩赐。
- source_word: τοῖς ἀνθρώποις
  choice: 人
  rationale: 此处复数名词泛指人类或众人；汉语“人”自然包含这一普遍意义，无须加入男性限定。
theological_decisions:
- issue: 如何翻译保罗改述《诗篇》68:18时关于俘虏的同源表达
  choice: 正文采用“掳掠了俘虏”
  alternative: “把一群俘虏掳来”或“将被掳的掳来”
  rationale: 正文保留希腊文的修辞力度和《诗篇》的回响，不把“俘虏”具体解释为仇敌、得救者、罪、死亡或其他对象；脚注提供较自然的理解方式。
- issue: τοῖς ἀνθρώποις 的性别与范围
  choice: 译作泛指的“人”
  alternative: “众人”或“人类”
  rationale: 希腊词在此可泛指人，中文“人”准确而自然，也避免误导读者以为礼物只赐给男性。
- issue: λέγει 的隐含主语
  choice: 译作“经上说”
  alternative: “他说”或“有话说”
  rationale: 上下文是经文引语；“经上说”符合保罗常见的引经方式，但不把隐含主语神学化为某个明确位格。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留引文的诗性力度，不以解释性词语指明俘虏的身份；“礼物”较“恩赐”更贴近本节 δόματα 的普通词义，并让下文自行说明其含义。
