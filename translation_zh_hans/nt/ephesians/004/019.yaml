base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/019.yaml
  text: who[a], having become callous[c][b], gave themselves over to sensuality for the practice of every kind of impurity with greediness.
translation:
  language: zh_hans
  text: 这些人已经麻木不仁[a]，任凭自己陷入放荡[b]，以贪婪之心行各样污秽[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“失去一切感觉”或“变得毫无知觉”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“淫荡”或“放纵无度”。
    reason: lexical_alternative
  - marker: c
    text: 也可译为“贪得无厌地”或“在贪婪中”。
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: 这些人
  rationale: 承接上文所说的外邦人；汉语用“这些人”比直译关系代词更自然，也不额外加强语气。
- source_word: ἀπηλγηκότες
  choice: 已经麻木不仁
  rationale: 完成时主动分词表示进入并持续处于失去道德敏感的状态；“已经麻木不仁”兼顾结果状态与伦理语境。
- source_word: ἑαυτοὺς παρέδωκαν
  choice: 竟放纵自己，沉溺于
  rationale: 反身代词与παραδίδωμι表达主动把自己交付给某种恶行；此译体现自愿屈从，同时保持现代汉语自然。
- source_word: τῇ ἀσελγείᾳ
  choice: 淫荡
  rationale: ἀσέλγεια指无耻而不受约束的放纵，常带性方面含义；“淫荡”在本节污秽语境中清楚有力，但脚注保留较宽泛译法。
- source_word: εἰς ἐργασίαν
  choice: 做出
  rationale: 这里表示从事、实行或追求，而非字面的劳动；与“各样污秽的事”搭配自然，并传达实际行出来。
- source_word: ἀκαθαρσίας πάσης
  choice: 各样污秽的事
  rationale: 表达πάσης所涵盖的全面、分布性范围；补出“的事”使抽象名词在现代汉语中顺畅。
- source_word: ἐν πλεονεξίᾳ
  choice: 贪得无厌地
  rationale: πλεονεξία表示不断想多得的贪欲；在此按方式修饰从事污秽，译为副词短语能表现无餍的程度，同时保留“出于贪欲”的可能于脚注。
theological_decisions:
- issue: ἀπηλγηκότες的道德与心理含义
  choice: 译作“已经麻木不仁”，侧重道德感丧失
  alternative: “丧失了一切感觉”或“毫无知觉”
  rationale: 上下文描述伦理上的昏暗与向污秽屈从，不宜使读者只理解为一般情感迟钝或临床性麻木。
- issue: ἀσέλγεια的范围
  choice: 正文译“淫荡”，结合本节污秽语境表达无耻放纵
  alternative: “放荡”或“放纵无度”
  rationale: 该词常含性方面的无耻行为，却也可泛指不受约束的自我放纵；正文依语境选用明确措辞，脚注保留较宽含义。
- issue: ἐν πλεονεξίᾳ的句法关联
  choice: 理解为方式，修饰他们从事各样污秽
  alternative: 理解为“出于贪欲”，或将贪婪视为并列罪恶
  rationale: 介词短语最自然地描述其实行污秽时贪得无厌的方式，但希腊文容许动机色彩，因此不把另一理解排除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“竟”传达前一状态与主动自我交付之间的推进，但不添加新的神学判断。脚注标记均紧随相关表达；正文保留原句由麻木、自我交付到实行污秽的逻辑进展。
