  text: τὸ δὲ Ἀνέβη τί ἐστιν εἰ μὴ ὅτι καὶ ⸀κατέβη εἰς τὰ κατώτερα μέρη τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/009.yaml
  text: What does “he ascended” mean except that he also descended into the lower parts of the earth?[a]
translation:
  language: zh_hans
  text: “他升上去”这句话，除了表示他也曾降到地的低处以外，还能是什么意思呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“降到较低之处，即地上。”这句话可能只是指他降到地上，也可能更具体地指他降到死者所在的领域。
    reason: 保留τῆς γῆς可能的同位解释，并说明这一有争议短语的主要理解。
lexical_decisions:
- source_word: Ἀνέβη
  choice: 他升上去了
  rationale: 采用完成性的自然汉语表达，保留向上移动的意象，并与后文“降到”形成对应。
- source_word: τί ἐστιν εἰ μὴ ὅτι
  choice: 除了表明……还能是什么意思呢
  rationale: 以现代汉语自然表达该反问推论结构，保留“升上去”意味着此前有下降这一论证力量。
- source_word: καὶ κατέβη
  choice: 他也曾降到
  rationale: “也”明确保留καί的附加意义；“曾”符合不定过去时在此所指的既成下降，同时不额外规定其具体时间。
- source_word: τὰ κατώτερα μέρη
  choice: 低处
  rationale: 简洁保留比较性的低下空间意象，不在正文中直接解释为阴间、坟墓或单指地上。
- source_word: τῆς γῆς
  choice: 地的
  rationale: 以属格结构“地的低处”保留原文可能具有的分部关系；另一种同位解释置于脚注。
theological_decisions:
- issue: εἰς τὰ κατώτερα μέρη τῆς γῆς的含义
  choice: 正文译作“降到地的低处”，不明确限定所指
  alternative: “降到较低之处，就是地上”；或特指降到死人所在之处
  rationale: 原文属格既可能理解为“地的低处”，也可能具有同位意味，即“较低之处，也就是地上”。正文保留这种神学张力，脚注说明主要解释，不把经文预先限定为某一教义性结论。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“除了……还能是什么意思呢”清楚传达原文反问推论；正文不添加原文没有的时间性“现在”。
