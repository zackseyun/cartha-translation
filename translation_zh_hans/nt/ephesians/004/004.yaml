  text: ἓν σῶμα καὶ ἓν πνεῦμα, καθὼς καὶ ἐκλήθητε ἐν μιᾷ ἐλπίδι τῆς κλήσεως ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/004.yaml
  text: There is one body and one Spirit[a], just as you also were called in one hope of your calling.
translation:
  language: zh_hans
  text: 一个身体，一位圣灵[a]，正如你们是在同一个盼望中蒙召的；这盼望与你们所蒙的召唤相关。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一个灵”。希腊语原词既可指“灵”，也可指“圣灵”；按本段宣告合一的上下文，这里最可能指圣灵。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἓν
  choice: 一个
  rationale: 在“身体”“圣灵”和“盼望”前一致译为“一个”，保留原文反复强调合一的结构。
- source_word: σῶμα
  choice: 身体
  rationale: 保留原文的身体隐喻；在上下文中指信徒合一的群体，但不在正文中展开解释。
- source_word: πνεῦμα
  choice: 圣灵
  rationale: 以弗所书4:4–6的合一宣认依次提到一个身体、一位灵、一位主和一位上帝与父，因此这里最可能指圣灵；希腊文自身不以大小写区分，故用脚注保留另一种可能。
- source_word: καθὼς καὶ
  choice: 正如……也
  rationale: 保留比较关系及καί的附加意味，同时按现代汉语语序自然表达。
- source_word: ἐκλήθητε
  choice: 你们蒙召
  rationale: 用“蒙召”表达被动语态，并保留施事者未明说的特点。
- source_word: ἐν
  choice: 在……中
  rationale: 保留介词的空间性表达，不把它明确改释为“为要得着”或“归入”。
- source_word: μιᾷ ἐλπίδι
  choice: 一个盼望
  rationale: “盼望”是ἐλπίς在此处自然且传统的对应词；“一个”延续经文的合一主题。
- source_word: τῆς κλήσεως ὑμῶν
  choice: 你们蒙召所共有的
  rationale: 用关系结构表达该属格所指的关联，并通过“蒙召”保留ἐκλήθητε与κλῆσις的词根呼应；“共有”使汉语明确此盼望属于全体受召者，而不是每人各自不同的盼望。
theological_decisions:
- issue: πνεῦμα的所指
  choice: 圣灵
  alternative: 共同的灵或属灵心志
  rationale: 本段“一”的宣认结构以及随后“一位主”“一位上帝与父”的措辞，使“圣灵”成为最可能的所指；但希腊文没有大小写提示，故脚注注明词义上的另一可能。
- issue: “一个盼望”与“蒙召”的关系
  choice: 你们蒙召所共有的一个盼望
  alternative: 你们蒙召所要得着的一个盼望
  rationale: 原文属格可表达与呼召相关或所属的盼望，并未明确规定目的关系；正文避免将其收窄为“所要得着的”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“一个身体，一个圣灵”保留原文简洁的并列结构；后半句略作汉语化处理，以避免“在你们呼召的一个盼望中”这类生硬表达，同时保留“蒙召”与“呼召/召唤”同词根的语义联系。
