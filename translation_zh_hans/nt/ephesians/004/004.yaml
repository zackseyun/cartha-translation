  to: 一个身体，一位圣灵[a]，正如你们是在同一个盼望中蒙召的；这盼望与你们所蒙的召唤相关。
  rationale: 修订消除了后半句的汉语病句，并撤除“所共有的”这一超出原文明确程度的限定。正文保留ἐν的“在……中”、ἐκλήθητε的被动“蒙召”、μιᾷ的“同一个”，以及κλήσεως与“蒙召”的语义关联。采用“一位圣灵”是现代汉语中自然、尊重且不改变原文合一断言的表达。
