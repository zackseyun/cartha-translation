  terminology: “身体”“圣灵”“蒙召”“盼望”均为稳定且合宜的经文用语。“一位圣灵”比“一个圣灵”更符合汉语对神圣位格的通常称谓，同时仍保留“一个／同一”的合一强调。脚注的“一个灵”可保留为词义替代，说明大小写／所指判断并非由希腊文形式直接决定。
