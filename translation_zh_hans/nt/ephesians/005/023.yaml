  text: ὅτι ἀνήρ ἐστιν κεφαλὴ τῆς γυναικὸς ὡς καὶ ὁ Χριστὸς κεφαλὴ τῆς ἐκκλησίας, ⸀αὐτὸς σωτὴρ τοῦ σώματος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/023.yaml
  text: For the husband is the head of the wife[a], as the Messiah also is the head of the church[d][c][b], himself the Savior of the body.
translation:
  language: zh_hans
  text: 因为丈夫是妻子的头[a]，正如弥赛亚也是教会的头；弥赛亚自己是这身体的救主。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “头”保留了希腊文的隐喻。对此处的含义，解释者有不同理解，包括权柄、居首地位或源头。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 承接上一节，为前面的劝勉说明理由；现代汉语中“因为”能自然保留其因果、解释作用。
- source_word: ἀνήρ / γυνή
  choice: 丈夫 / 妻子
  rationale: 家庭训诫的上下文明确指婚姻关系，不宜译作泛指的“男人 / 女人”。
- source_word: κεφαλή
  choice: 头
  rationale: 保留希腊文的身体隐喻，不在正文中将其缩窄解释为“领袖”“掌权者”或“源头”。
- source_word: ὡς καὶ
  choice: 正如……也
  rationale: 清楚表达丈夫与妻子的关系同弥赛亚与教会的关系之间的类比，同时不暗示两者完全等同。
- source_word: Χριστός
  choice: 弥赛亚
  rationale: 此处称号意义鲜明；“弥赛亚”传达受膏者称号的含义，而不只将其当作名字。
- source_word: ἐκκλησία
  choice: 教会
  rationale: 此处指属于弥赛亚的信徒群体，“教会”是现代汉语中清楚且通行的对应词。
- source_word: αὐτός
  choice: 他自己
  rationale: 保留代词的强调作用，将救主身份明确归于弥赛亚本人。
- source_word: σωτήρ
  choice: 救主
  rationale: 准确表达施行拯救者的含义，并符合本节的基督论语境。
- source_word: σῶμα
  choice: 身体
  rationale: 保留保罗关于教会的身体隐喻；不增添原文没有明说的“他的”。
theological_decisions:
- issue: κεφαλή在丈夫—妻子及弥赛亚—教会类比中的含义
  choice: 正文保留“头”的隐喻
  alternative: 源头；领袖；掌权者
  rationale: 该词在此处是否侧重权柄、居首地位或源头存在解释争议。直译隐喻可保留原文的神学张力，避免把某一种解释写入正文。
- issue: Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处该词具有称号功能；译作“弥赛亚”能直接呈现其受膏君王的称号意义。
- issue: αὐτὸς σωτὴρ τοῦ σώματος的句法关系
  choice: 另起分句译作“他自己是这身体的救主”
  alternative: “他自己作为身体的救主”；“他自己就是身体的救主”
  rationale: 希腊文是简洁的同位性名词结构。汉语补出判断词“是”可自然表达其断言，同时“他自己”保留强调；“这身体”指回刚提到的教会，却不擅自添加所有关系。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“因为”承接上文的论证；分号使末句对弥赛亚救主身份的强调清楚可读。正文只设置一条确有必要的释义脚注，并确保标记[a]出现在相应词语之后。
