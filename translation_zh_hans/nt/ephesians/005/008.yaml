  text: ἦτε γάρ ποτε σκότος, νῦν δὲ φῶς ἐν κυρίῳ· ὡς τέκνα φωτὸς περιπατεῖτε,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/008.yaml
  text: For you were once darkness[a], but now you are light in the Lord. Walk as children of light,
translation:
  language: zh_hans
  text: 因为你们从前是黑暗，但如今在主里是光；你们要作为光明的儿女行事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“你们要作为光明的儿女行走”。“行走”是保罗常用的比喻，指一个人的生活方式。
    reason: 说明περιπατεῖτε的字面意义及其伦理隐喻。
lexical_decisions:
- source_word: ἦτε γάρ ποτε
  choice: 因为你们从前是
  rationale: ἦτε表示过去持续的状态，ποτε表示从前；γάρ承接上文，说明前面劝勉的理由，译作“因为”自然清楚。
- source_word: σκότος
  choice: 黑暗
  rationale: 原文以名词作表语，直陈“你们是黑暗”，而非仅仅“在黑暗中”；保留这一强烈的身份与状态隐喻。
- source_word: νῦν δὲ
  choice: 但如今
  rationale: 保留过去与现在之间鲜明的转折对比。
- source_word: φῶς
  choice: 光
  rationale: 原文同样以名词作表语，译作“是光”，不弱化为“在光中”或“得了光照”。
- source_word: ἐν κυρίῳ
  choice: 在主里面
  rationale: 保留保罗书信中常见的联合或所属领域表达，表明他们如今“是光”的身份是在与主的关系中成立的。
- source_word: ὡς τέκνα φωτός
  choice: 像光明的儿女
  rationale: τέκνα是包含男女的“儿女”；“光明的儿女”保留属格隐喻，ὡς则表达与这种身份相称的行事方式。
- source_word: περιπατεῖτε
  choice: 行事
  rationale: 该词字面为“行走”，在这里是保罗常用的伦理隐喻，指日常生活方式；正文译作现代汉语自然的“行事”，脚注保留其字面意象。
theological_decisions:
- issue: “从前是黑暗，但如今是光”的身份隐喻
  choice: 保留“是黑暗”与“是光”的直接表述
  alternative: 从前在黑暗中，但如今在光中；从前昏暗，如今蒙了光照
  rationale: 希腊文使用无介词的表语名词，强调人的身份和道德属灵状态发生转变；不把它弱化为所处环境或个人体验。
- issue: κύριος的译法
  choice: 主
  alternative: 主人
  rationale: “主”符合新约惯用译法，也保留此处的神学含义而不把语义缩窄为一般主仆关系。
- issue: “在主里面”的关系含义
  choice: 保留原文关系性表达，不明确限定为原因或工具
  alternative: 靠着主；借着主
  rationale: ἐν κυρίῳ可表达领域、联合或关系；“在主里面”保存这种丰富性，避免只解释成手段或原因。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在主里面”保留保罗式关系表达；“行事”比照搬“行走”更符合现代汉语，但借脚注保存原文隐喻。脚注标记置于其实际说明的“光明的儿女”及整项行事劝勉之后。
