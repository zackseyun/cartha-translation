  text: τὸ μυστήριον τοῦτο μέγα ἐστίν, ἐγὼ δὲ λέγω εἰς Χριστὸν καὶ εἰς τὴν ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/032.yaml
  text: This mystery is great[c][b][a], but I am speaking with reference to Messiah and the church.
translation:
  language: zh_hans
  text: 这个奥秘[c]是极大的[a]；但我所说的是关于弥赛亚[b]和教会的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “极大的”也可译作“伟大的”“重大的”或“深奥的”。希腊文直译为“大”，可以表示伟大、重大或意义深远，不一定只强调难以理解。
    reason: lexical_alternative
  - marker: b
    text: 希腊文是“基督”，意思是“受膏者”，相当于“弥赛亚”；这里按称号译出。
    reason: alternative_reading
  - marker: c
    text: “这个奥秘”可能指前文所说的一体之关系、所引用的《创世记》2:24，或婚姻所指向的弥赛亚与教会的关系；原文没有进一步限定。
    reason: theological_ambiguity
lexical_decisions:
- source_word: μυστήριον
  choice: 奥秘
  rationale: 保留保罗书信中这一词的特有分量，指上帝曾隐藏、如今显明的真理，并非仅指令人费解的谜团。
- source_word: μέγα
  choice: 重大的
  rationale: μέγα的基本义是“大”，在此可表达重大或重要；“重大的”比生硬的“大的”更符合现代汉语，同时不把含义局限为思想上的“深奥”。
- source_word: δὲ
  choice: 不过
  rationale: 体现从宣告奥秘重大转到说明所指对象的轻微转折，也避免使用语气过强的“但是”。
- source_word: λέγω
  choice: 我所说的
  rationale: 以自然汉语保留现在时话语行为和解释性语气；不直接译作“我的意思是”，以免增加释义色彩。
- source_word: εἰς
  choice: 是指
  rationale: 这里的εἰς与λέγω连用，表示话语所涉及或指向的对象，并非空间方向。
- source_word: Χριστόν
  choice: 弥赛亚
  rationale: Χριστός在这里具有称号功能；“弥赛亚”清楚传达“受膏者”的称号性质。
- source_word: ἐκκλησίαν
  choice: 教会
  rationale: 此处指上帝子民的群体身份；“教会”符合保罗语境，也比“集会”更准确自然。
theological_decisions:
- issue: “这个奥秘”的具体所指
  choice: 正文不限定它专指婚姻、创世记2:24的引文，还是婚姻所预表的弥赛亚与教会的关系。
  alternative: 明确译成“婚姻的奥秘”或“这预表的奥秘”。
  rationale: 希腊原文先说“这个奥秘是重大的”，再说明保罗的话指向弥赛亚和教会；保持这一推进可保留原文真实的解释空间。
- issue: Χριστός在本节是称号还是近似专名
  choice: 译作“弥赛亚”。
  alternative: 译作“基督”。
  rationale: 在“弥赛亚和教会”这一神学关系中，称号含义明显；脚注同时保留传统译名。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“这个奥秘是重大的”略带正式语体，以贴近希腊文的判断句结构；后半句用“我所说的，是指……”自然表达解释关系，并保留弥赛亚与教会之间的并列。
