  text: always giving thanks for everything to God the Father in the name of our Lord Jesus the Messiah[b][a],
translation:
  language: zh_hans
  text: 要常常奉我们主耶稣弥赛亚[a]的名，为一切[b]感谢父神。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统译作“耶稣基督”。
    reason: alternative_reading
  - marker: b
    text: “为一切”也可较直译为“为万事”；原文形式也可能指“为所有人”，但上下文较支持涵盖各种事情或境遇的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστοῦντες
  choice: 感谢
  rationale: 现在时主动分词承接前文的劝勉，表达持续的行动；汉语用“要常常……感谢”自然地体现这种延续和劝勉关系。
- source_word: πάντοτε
  choice: 常常
  rationale: 表达持续而反复的感恩；现代汉语中“常常”比“总是”更自然，也避免被误解为机械性的绝对陈述。
- source_word: ὑπὲρ πάντων
  choice: 为一切
  rationale: πάντων在形式上可指事物或人；上下文较支持涵盖各种事情、境遇的“一切”，同时保留简洁、宽泛的表达。
- source_word: ἐν ὀνόματι
  choice: 在……的名里
  rationale: 保留原文“在名中”的圣经表达及其代表、凭借和归属意味，不以解释性措辞将其限定为单一含义。
- source_word: κυρίου
  choice: 主
  rationale: 作为对耶稣的称号，译为现代中文基督教语境中通行且准确的“主”。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣弥赛亚
  rationale: 将Ἰησοῦ音译为“耶稣”，并将仍具称号意义的Χριστοῦ译作“弥赛亚”；脚注保留传统译法。
- source_word: τῷ θεῷ καὶ πατρί
  choice: 父神
  rationale: 两个单数名词由同一冠词统摄，指同一位受感谢者；“父神”是自然、凝练的现代汉语表达。
theological_decisions:
- issue: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ中Χριστοῦ的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处Χριστός仍可理解为称号，主文译“弥赛亚”以显明其“受膏者”身份；传统且名称化的“基督”列入脚注，不排除该理解。
- issue: ὑπὲρ πάντων所指的范围
  choice: 为一切
  alternative: 为所有人
  rationale: 该形式本身可作中性或阳性理解，存在真实歧义；本段强调信徒生活中全面、持续的感恩，故主文采用事物和境遇意义更宽的“为一切”，并在脚注说明另一可能。
- issue: τῷ θεῷ καὶ πατρί的关系
  choice: 父神
  alternative: 神和父
  rationale: 共同冠词和单数与格结构最自然地指同一位，即既是神又是父；避免把两者误读为两个对象。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“要”使本节承接前文劝勉的句法功能更清楚；“在……的名里”有意保留原文惯用语的多重含义。所有脚注标记均置于主文相应位置。
