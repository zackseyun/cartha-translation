translation:
  language: zh_hans
  text: 怀着对弥赛亚的畏惧[a][b]，彼此顺服。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “畏惧”或译“敬畏”或“畏敬”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文Χριστοῦ常译“基督”；这里译作“弥赛亚”，因为Χριστός在此可理解为称号。
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποτασσόμενοι
  choice: 顺服
  rationale: 现在时中间/被动形态分词，在上下文中延续前文的劝勉。中文用“顺服”自然表达服从、置于秩序之下的意思；不增添原文未明说的反身成分。“怀着……，彼此顺服”也保留了它与前文相连、并非独立限定动词的开放性。
- source_word: ἀλλήλοις
  choice: 彼此
  rationale: 与格复数相互代词，清楚表达群体成员之间的相互关系。
- source_word: ἐν
  choice: 怀着
  rationale: ἐν与φόβῳ连用，可表达行为的情态或所处范围。汉语“怀着……畏惧”比机械直译为“在……中”更自然，同时未将其明确改成原因关系。
- source_word: φόβῳ
  choice: 畏惧
  rationale: 保留φόβος“惧怕”的词义力度及其神学张力，不直接弱化为单纯的尊敬；“敬畏”等语境性理解列入脚注。
- source_word: Χριστοῦ
  choice: 弥赛亚
  rationale: Χριστός在此仍可作为称号理解，意为受膏者、弥赛亚；属格在短语中最自然地理解为畏惧所指向的对象。传统译法“基督”列入脚注。
theological_decisions:
- issue: φόβος Χριστοῦ中属格的关系及φόβος的力度
  choice: 指向弥赛亚的畏惧
  alternative: 弥赛亚所引起的畏惧；对基督的敬畏
  rationale: 最直接的理解是信徒怀着指向弥赛亚的畏惧而彼此顺服。正文用“畏惧”保留原词较强的表达，不把它化约为礼貌或尊重；脚注同时说明“敬畏、畏敬”是合乎语境的译法。
- issue: Χριστοῦ的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处称号含义仍然可感，因此译出“弥赛亚”；但“基督”是通行且可能更具姓名化色彩的译法，故在脚注保留。
- issue: ὑποτασσόμενοι与上下文的句法关系
  choice: 用无显式主语的承接性短句“彼此顺服”
  alternative: 译成独立命令“你们要彼此顺服”
  rationale: 希腊文使用分词，并非在本节另起一个明确的命令式。中文正文避免增添“你们要”，从而保留它依附前文劝勉的句法联系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“怀着对……的畏惧”自然表达情态；语序以“彼此顺服”收束，清楚突出本节核心行动。正文保留“畏惧”的力度，并以脚注呈现较柔和而常见的“敬畏”理解。
