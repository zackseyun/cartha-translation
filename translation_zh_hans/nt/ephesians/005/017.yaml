  text: διὰ τοῦτο μὴ γίνεσθε ἄφρονες, ἀλλὰ ⸀συνίετε τί τὸ θέλημα τοῦ κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/017.yaml
  text: For this reason[a], do not become foolish, but understand what the will of the Lord is.
translation:
  language: zh_hans
  text: 因此[a]，不要变得愚昧，反要明白主的旨意是什么。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所以，不要作愚昧人。”希腊语动词也可按较偏状态的方式表达，但“变得”更能体现γίνεσθε的动态意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 因此
  rationale: 该短语回指前文，并引出由此而来的劝勉；“因此”在现代汉语中简洁、自然地保留了推论性的连接作用。
- source_word: μὴ γίνεσθε
  choice: 不要变得
  rationale: γίνομαι含有“成为、变成”的动态意味；“不要变得”比单纯的“不要愚昧”更准确地保留进入某种状态的语义，同时不武断地暗示读者已经处于该状态。
- source_word: ἄφρονες
  choice: 愚昧
  rationale: ἄφρων指缺乏理解力或实际判断力；“愚昧”既自然庄重，也与下文“明白”形成清楚对照，并避免与前文的“智慧”用词完全重合。
- source_word: ἀλλὰ
  choice: 反要
  rationale: “反要”鲜明表达否定命令与肯定命令之间的强烈转折，比单用“但”更符合汉语劝诫句式。
- source_word: συνίετε
  choice: 明白
  rationale: συνίημι表示理解、领会；“明白”通俗自然，也容纳在语境中审慎领悟的意味。
- source_word: τί
  choice: 是什么
  rationale: τί引出需要明白的内容；汉语以“是什么”置于句末，准确而自然地表达该间接问句。
- source_word: τὸ θέλημα
  choice: 旨意
  rationale: θέλημα在此指意愿、所要成就或要求之事；“旨意”是现代中文圣经语体中清楚而庄重的对应词，适用于主的意愿而不额外限定其范围。
- source_word: τοῦ κυρίου
  choice: 主的
  rationale: κύριος译作“主”，属格自然处理为“主的”；不在正文中补出“耶稣”或“神”，以保留希腊文本本身的指称空间。
theological_decisions:
- issue: “主”（τοῦ κυρίου）的所指
  choice: 正文仅译作“主”，不明确补为“主耶稣”。
  alternative: 主耶稣；神
  rationale: 以弗所书的语境常以“主”指耶稣，但本节仅有κυρίου。译文保留原文表达，避免加入原文未明说的具体所指。
- issue: 禁令μὴ γίνεσθε的力度与状态意味
  choice: 译作“不要变得”，保留进入某种状态的动态意味。
  alternative: 不要愚昧；不要作愚昧人；别再愚昧
  rationale: “不要变得”不预设受众已经完全处于愚昧状态，也不把一般禁令擅自解释为“停止现有行为”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“因此”衔接前文；“反要”强化两项命令的对照；“主的旨意”保留常见且自然的经文表达。
