  text: so that he might sanctify her[a], having cleansed her by the washing of water with the word[c][b],
translation:
  language: zh_hans
  text: 为要使她成圣，借着水的洗涤和话语洁净了她[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “话语”也可译作“所宣告的信息”。希腊词可指话、言说或信息。
    reason: alternative_reading
  - marker: b
    text: “水的洗涤”很可能使人联想到洗礼，但单凭希腊文措辞，不能断定这里所指的圣礼性质有多具体。
    reason: cultural_note
lexical_decisions:
- source_word: ἵνα
  choice: 为要
  rationale: 明确表达目的，符合现代汉语书面语，也保留希腊文的目的从句功能。
- source_word: αὐτὴν
  choice: 她
  rationale: 阴性单数代词在上下文中指教会；用“她”保留原文的拟人化表达。
- source_word: ἁγιάσῃ
  choice: 使她成为圣洁
  rationale: 表达“使之圣洁、分别为圣”的语义，同时比单用较术语化的“圣化”更便于普通读者理解。
- source_word: καθαρίσας
  choice: 洁净她
  rationale: 保留洁净之义，并补出上下文已知的宾语“她”。希腊文不定过去时分词可表达先行或伴随的行动；汉语句式将其自然地置于主要动作之后，不强行限定精确时序。
- source_word: τῷ λουτρῷ τοῦ ὕδατος
  choice: 借着水的洗涤
  rationale: “借着”体现工具性与方式，“水的洗涤”贴近原文属格结构，并保留洗浴、洗净的意象。
- source_word: ἐν ῥήματι
  choice: 以话语
  rationale: “以”可表达方式或伴随因素；“话语”既可指所说的话，也可指信息，不把含义过早限定为某一特定宣告、福音信息或礼仪用语。
- source_word: ῥήματι
  choice: 话语
  rationale: ῥῆμα可指话、言说或信息。“话语”在现代中文中庄重自然，并保留其语义宽度。
theological_decisions:
- issue: 洁净、水洗与话语之间可能具有的圣礼关联
  choice: 保留“水的洗涤”和“话语”的并列表达，不在正文中明确指定某种圣礼机制。
  alternative: 明确译作洗礼及洗礼时所宣告的话，或完全按非圣礼性的比喻解释。
  rationale: 措辞很可能唤起洗礼意象，但希腊文本本身并未完整界定其圣礼性质及具体运作方式，因此不应在翻译中加入宗派性结论。
- issue: καθαρίσας与ἁγιάσῃ的时序关系
  choice: 用自然汉语表达两者密切相联，而不以“先……然后……”锁定严格时序。
  alternative: 译为“洁净了她以后，使她成为圣洁”，明确将洁净限定为先行动作。
  rationale: 不定过去时分词常可表示先行行动，但在此也与主要目的紧密相连；正文应避免赋予其超过语法证据的严格时间次序。
- issue: ῥήματι的具体所指
  choice: 译为较宽泛的“话语”。
  alternative: 译为“信息”“福音之道”或“洗礼宣言”。
  rationale: 上下文可能指与基督救赎工作相关的宣告或信息，但原词本身容许较宽的理解，应保存这一开放性。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“使她成为圣洁”兼顾可读性与ἁγιάζω的神学含义；句法尽量贴近原文，同时避免生硬直译。所有注脚标记均已置于正文。
