  text: πᾶν γὰρ τὸ φανερούμενον φῶς ἐστιν. διὸ λέγει· Ἔγειρε, ὁ καθεύδων, καὶ ἀνάστα ἐκ τῶν νεκρῶν, καὶ ἐπιφαύσει σοι ὁ Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/014.yaml
  text: For everything that is made visible is light[a]. Therefore it says, “Wake up, sleeper, and rise from the dead[c][b], and Messiah will shine on you.”
translation:
  language: zh_hans
  text: 因为一切被显明的都是光。[a]因此有话说：“醒来吧，沉睡的人哪；从死人中起来，弥赛亚必光照你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被显明的”也可译作“被揭露的”或“显露出来的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν
  choice: 一切
  rationale: 中性单数配合带冠词的分词，泛指一切处于所述状态的事物，不强行限定为人。
- source_word: φανερούμενον
  choice: 被显明的
  rationale: 保留被动含义及“显露、揭露”的语义空间，并与上文光使事物显露的语境衔接。
- source_word: φῶς
  choice: 光
  rationale: 直译并保留其比喻张力，不另作抽象解释。
- source_word: διὸ
  choice: 所以
  rationale: 自然表达由前句引出的推论。
- source_word: λέγει
  choice: 有话说
  rationale: 希腊文未明说主语；此译法不擅自认定说话者或引文来源。
- source_word: Ἔγειρε
  choice: 醒来吧
  rationale: 自然表达对沉睡者发出的命令，并保留醒睡意象。
- source_word: ὁ καθεύδων
  choice: 沉睡的人哪
  rationale: 将名词化分词译为带呼语语气的自然现代汉语。
- source_word: ἀνάστα
  choice: 起来
  rationale: 既符合命令语气，也保留与“从死人中”结合时复起的含义。
- source_word: ἐκ τῶν νεκρῶν
  choice: 从死人中
  rationale: 较明确地保留复数名词和“从……中”的结构，也维持复活意象。
- source_word: ἐπιφαύσει
  choice: 就要光照
  rationale: 保留光照意象，并以“就要”自然表达将来结果。
- source_word: ὁ Χριστός
  choice: 弥赛亚
  rationale: 此处带冠词，称号功能明显；译出称号的含义，而不将其仅当作名字。
theological_decisions:
- issue: 引文来源的性质
  choice: 译作“有话说”，不指明来源
  alternative: “经上说”或“他说”
  rationale: λέγει的主语未明，引文究竟来自经文传统还是早期诗歌也不确定，故保留开放性。
- issue: Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: ὁ Χριστός在这里具有称号性质；“弥赛亚”传达“受膏者”这一称号，而脚注不必重复常见音译。
- issue: “被显明的都是光”的含义
  choice: 保留原句的简洁断言
  alternative: 解释为“凡被光揭露的，就变得显明”
  rationale: 希腊文本确实说“都是光”，其逻辑和神学张力不宜在正文中改写消解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“沉睡的人哪”保留呼语色彩；“从死人中起来”较“从死里复活”更贴近原文，也避免提前限定为技术性的复活表述。所有脚注标记均置于相关正文之后。
