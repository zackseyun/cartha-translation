  to: 因为一切被显明的都是光。[a]因此有话说：“醒来吧，沉睡的人哪；从死人中起来，弥赛亚必光照你。”
  rationale: 仅作两项安全的文体与语义微调：以“因此有话说”自然地保留未指明的引文来源；以“必”对应普通将来时，避免“就要”所增加的临近意味。脚注内容保留，并将以赛亚书引文格式规范为中文常用的章节写法。
