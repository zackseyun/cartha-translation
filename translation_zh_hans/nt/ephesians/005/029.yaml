  text: οὐδεὶς γάρ ποτε τὴν ἑαυτοῦ σάρκα ἐμίσησεν, ἀλλὰ ἐκτρέφει καὶ θάλπει αὐτήν, καθὼς καὶ ὁ ⸀Χριστὸς τὴν ἐκκλησίαν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/029.yaml
  text: For no one ever hated his own flesh[a], but nourishes and cherishes it, just as the Messiah also does the church[c][b],
translation:
  language: zh_hans
  text: 因为从来没有人恨恶自己的肉身，反而保养、顾惜它，正如弥赛亚[a]也保养、顾惜教会一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。希腊语Χριστός意为“受膏者”；此处按其称号含义译为“弥赛亚”。
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδεὶς γάρ ποτε
  choice: 因为从来没有人
  rationale: γάρ承接上文并说明理由，译作“因为”；οὐδεὶς与ποτε合起来表达无一例外的经验，译作“从来没有人”自然准确。
- source_word: τὴν ἑαυτοῦ σάρκα
  choice: 自己的身体
  rationale: σάρξ在这里指人自身的肉身或身体，并非伦理意义上的“罪性”。现代汉语用“身体”最自然，也适合本段身体与教会的类比。
- source_word: ἐμίσησεν
  choice: 恨恶
  rationale: 保留μισέω强烈而直接的否定含义，语体庄重。
- source_word: ἀλλὰ ἐκτρέφει καὶ θάλπει αὐτήν
  choice: 反而总是养育、爱护它
  rationale: ἀλλά构成鲜明转折；ἐκτρέφει表示供养、培育，θάλπει表示温柔照料。“养育、爱护”保留两个并列动作；补出“总是”使现在时所表达的惯常行为在汉语中清楚。
- source_word: καθὼς καὶ ὁ Χριστὸς τὴν ἐκκλησίαν
  choice: 正如基督也养育、爱护教会一样
  rationale: 原文末句省略前述动词，汉语为完整自然需将“养育、爱护”补出。Χριστός采用现代中文圣经传统且通行的称谓“基督”；ἐκκλησία译为“教会”。
theological_decisions:
- issue: σάρξ在本节的含义
  choice: 身体
  alternative: 肉身；肉体
  rationale: 这里谈的是人对自身身体的照料，并延续夫妻与身体的比喻，不涉及保罗书信中可能具有伦理色彩的“肉体”。“身体”既不引入罪性含义，也最符合现代汉语。
- issue: Χριστός的译法
  choice: 基督
  alternative: 弥赛亚
  rationale: Χριστός在此带冠词并具有称号性质，但“基督”在现代标准汉语中是该称号固定、广为理解的译名，并非普通读者眼中的纯粹音译；使用“弥赛亚”会无必要地改变本段熟悉而庄重的表达。
- issue: 末句动词省略
  choice: 补出“养育、爱护”
  alternative: 正如基督对教会一样
  rationale: 希腊文由前句共享动词。汉语若完全保留省略会显得语义悬空；补出两个动词没有改变所指行动，并清楚表达基督对教会的照料。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“恨恶”保持经文语体，“养育、爱护”则清楚易懂。句末用“正如……一样”完整呈现比较关系，不机械复制希腊语语序。
