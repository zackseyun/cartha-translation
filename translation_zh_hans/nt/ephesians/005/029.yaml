  naturalness: “养育自己的身体”在现代汉语中略不自然，且“养育”通常用于抚养子女。以“保养、顾惜”表达对自身肉身的供养照料与珍爱，庄重、自然，并能分别对应ἐκτρέφει和θάλπει。
  terminology: 将σάρξ译为“肉身”避免不必要地将其等同于σῶμα（身体），同时不引入“罪性”含义。将Χριστός译为“弥赛亚”与本项目英文底稿的标题翻译原则一致；以脚注保留通行称谓“基督”。
