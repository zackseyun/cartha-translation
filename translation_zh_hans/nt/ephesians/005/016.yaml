id: EPH.5.16
reference: Ephesians 5:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐξαγοραζόμενοι τὸν καιρόν, ὅτι αἱ ἡμέραι πονηραί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/016.yaml
  text: making the most of the time[a], because the days are evil.
translation:
  language: zh_hans
  text: 要把握时机[a]，因为现今的日子邪恶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“赎回光阴”；希腊语这一表达也可理解为“买尽机会”，即充分利用时机。
    reason: 保留ἐξαγοράζω的买卖意象，以及καιρός可指机会或合宜时刻的词义范围。
lexical_decisions:
- source_word: ἐξαγοραζόμενοι
  choice: 把握
  rationale: 该分词本有“买尽、买下”的意象，在此语境中表示充分利用；“把握”是自然的现代汉语表达，并与“时机”搭配，传达积极善用机会之意。
- source_word: τὸν καιρόν
  choice: 时机
  rationale: καιρός常指合宜、可利用的时刻或机会，而非抽象的时间流逝；“时机”比“时间”更直接保留其机会性。
- source_word: ὅτι
  choice: 因为
  rationale: 清楚引出前述劝勉的理由。
- source_word: αἱ ἡμέραι
  choice: 现今的日子
  rationale: 原文直译为“这些日子/日子”；补出“现今的”是符合上下文的最小显化，使现代汉语自然，同时不将其扩展为特定末世阶段。
- source_word: πονηραί
  choice: 邪恶
  rationale: 保留该词的道德意味及敌对、败坏色彩；“艰难”或“不好”会削弱原文力度。
theological_decisions:
- issue: ἐξαγοραζόμενοι是否应译成带救赎含义的“赎回”
  choice: 按语境译为“把握”，表示充分善用时机
  alternative: 赎回光阴；买尽机会
  rationale: 本句是生活劝勉，动词虽保留买卖意象，却不必然指救恩意义上的救赎。正文采用自然的功能对等表达，脚注保留较直译的可能。
- issue: “日子邪恶”是指道德败坏还是仅指环境艰难
  choice: 保留“邪恶”的道德及敌对意味
  alternative: 日子艰难；世道险恶
  rationale: πονηρός不只描述困难，也含邪恶、败坏之意；不宜将其弱化为单纯的不利处境。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“要把握时机”承接上一节的劝勉语气；正文中的[a]与脚注对应。
