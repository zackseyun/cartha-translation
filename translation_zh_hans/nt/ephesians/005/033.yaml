  text: πλὴν καὶ ὑμεῖς οἱ καθ’ ἕνα ἕκαστος τὴν ἑαυτοῦ γυναῖκα οὕτως ἀγαπάτω ὡς ἑαυτόν, ἡ δὲ γυνὴ ἵνα φοβῆται τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/033.yaml
  text: Nevertheless[a], you also—each one individually—must love his own wife as himself[b], and the wife must fear her husband.
translation:
  language: zh_hans
  text: 不过，你们也要各自[b]这样爱自己的妻子，如同爱自己；妻子也要敬重[a]丈夫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬重”所译的词可直译为“惧怕”；在这里的夫妻关系劝勉中，带有敬畏、尊敬的意思，并非指因威吓而恐惧。
    reason: lexical_alternative
  - marker: b
    text: “各自”译自一个强调逐一适用的表达，意思是这项劝勉临到每一位丈夫本人。
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: 不过
  rationale: 标示从前文论述转入总结性劝勉，保留转折和收束作用，同时符合现代汉语表达。
- source_word: καὶ ὑμεῖς
  choice: 你们……也
  rationale: 保留καί所表达的追加与强调，指出听众同样应把前述原则付诸实践。
- source_word: οἱ καθ’ ἕνα ἕκαστος
  choice: 每一个人
  rationale: 这一叠加强调的分配性表达指向所有丈夫中的每一位；现代汉语以“每一个人”自然传达逐一适用的语气。
- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: 自己的妻子
  rationale: 婚姻语境确定γυνή意为“妻子”，而ἑαυτοῦ的反身、所属意味由“自己的”明确保留。
- source_word: οὕτως ἀγαπάτω
  choice: 要这样爱
  rationale: “这样”保留οὕτως向前指涉的方式意义，“要爱”则自然表达第三人称命令式ἀγαπάτω的劝令力度。
- source_word: ὡς ἑαυτόν
  choice: 如同爱自己
  rationale: 补出汉语比较句中自然需要的动词“爱”，同时忠实保留以自身为比较标准的含义。
- source_word: ἡ δὲ γυνὴ
  choice: 妻子也
  rationale: γυνή在此为“妻子”；δέ在配对式总结中用“也”自然衔接第二项劝勉，不刻意强化对立。
- source_word: ἵνα φοβῆται
  choice: 要敬重
  rationale: φοβέομαι的基本语义包括“惧怕”，但在本段夫妻关系的劝勉中具有敬畏、尊重之意；“敬重”既保留庄重的尊敬意味，也避免现代读者误解为恐惧或受威吓。
- source_word: τὸν ἄνδρα
  choice: 丈夫
  rationale: ἀνήρ在婚姻语境中指“丈夫”；汉语无需另加物主代词即可清楚表达其配偶关系。
theological_decisions:
- issue: 婚姻劝勉中φοβῆται的译法
  choice: 敬重
  alternative: 惧怕；敬畏
  rationale: 原词存在从惧怕到敬畏、尊重的语义范围。此处直译“惧怕”容易在现代汉语中被理解为因威胁而害怕；“敬重”较自然地表达关系中的郑重尊敬，同时以脚注保留原词较直译的可能。
- issue: 对丈夫和妻子的性别特指
  choice: 自己的妻子……妻子……丈夫
  alternative: 自己的配偶……配偶
  rationale: 希腊文明确采用丈夫与妻子的性别特指和单数形式，译文不将其改写为中性化的“配偶”。
- issue: οὕτως向前指涉的意义
  choice: 这样
  alternative: 只用命令语气而不明译
  rationale: “这样”明确承接前文所描述的爱妻方式，避免把本节从此前基督与教会及爱妻如己的论述中割裂出来。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“要这样爱”兼顾命令语气和对前文的回指；“敬重”比“惧怕”更符合当代婚姻语境中的自然理解。两个脚注标记均置于正文：词义脚注紧随“敬重”，分配性表达的说明置于全句末，以免打断主句。
