  text: οὕτως ὀφείλουσιν ⸀καὶ οἱ ἄνδρες ἀγαπᾶν τὰς ἑαυτῶν γυναῖκας ὡς τὰ ἑαυτῶν σώματα· ὁ ἀγαπῶν τὴν ἑαυτοῦ γυναῖκα ἑαυτὸν ἀγαπᾷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/028.yaml
  text: In the same way, husbands also ought to love their own wives as their own bodies. He who loves his own wife loves himself,
translation:
  language: zh_hans
  text: 同样，丈夫也应当爱自己的妻子，如同爱自己的身体。爱自己妻子的丈夫，就是爱自己。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: 同样
  rationale: 承接上文基督爱教会的榜样，并引出相应的劝勉；“同样”在现代汉语中自然地保留了关联和推论作用。
- source_word: ὀφείλουσιν
  choice: 应当
  rationale: 表达道德上的责任和义务，同时保留陈述式劝勉的语气，不强化为生硬的绝对命令。
- source_word: καὶ οἱ ἄνδρες
  choice: 丈夫也
  rationale: καί译为“也”，体现附加关系；在婚姻家庭语境中，ἄνδρες明确指“丈夫”，不是泛指男人。
- source_word: ἀγαπᾶν
  choice: 爱
  rationale: 直接保留ἀγαπάω的核心意义，并与本节后半重复出现的同一动词保持一致。
- source_word: τὰς ἑαυτῶν γυναῖκας
  choice: 自己的妻子
  rationale: 将γυναῖκας按婚姻语境译为“妻子”，并用“自己的”保留反身代词的强调。
- source_word: ὡς τὰ ἑαυτῶν σώματα
  choice: 如同爱自己的身体
  rationale: 原文直译为“如同自己的身体”，汉语为明确比较中省略的动作，补出“爱”更自然，且不改变原意；“身体”保留σώματα的具体意象。
- source_word: ὁ ἀγαπῶν τὴν ἑαυτοῦ γυναῖκα
  choice: 爱自己妻子的
  rationale: 用汉语“……的”结构自然表达带冠词的实词化分词，并保留所爱的对象及反身强调。
- source_word: ἑαυτὸν ἀγαπᾷ
  choice: 就是爱自己
  rationale: 准确表达反身代词与重复动词；“就是”自然呈现原文断言的逻辑关系，但不将其扩展为形而上的同一命题。
theological_decisions:
- issue: 家庭训诫中的性别特指
  choice: 将οἱ ἄνδρες译为“丈夫”
  alternative: “男人”或性别中性的表达
  rationale: 上下文明确谈论婚姻关系，γυναῖκες与ἄνδρες在此分别指妻子与丈夫；译为“丈夫”既准确又避免把劝勉泛化到所有男人。
- issue: 妻子与丈夫身体之间的比较性质
  choice: 保留“如同爱自己的身体”的类比，并译出“爱自己”的结论
  alternative: 把它解释为妻子与丈夫在形而上完全等同，或在正文中加入“一体”的解释
  rationale: 本节以身体为类比，并断言爱妻子就是爱自己；译文保留其伦理与神学张力，不额外规定这一关系的形而上含义。
- issue: “应当”的义务强度
  choice: 译为“应当”
  alternative: “必须”或“有义务”
  rationale: “应当”足以传达ὀφείλουσιν的道德责任，又符合保罗在此陈述式劝勉的语气；避免无根据地减弱或增强命令力度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式简洁，保留原文中“爱”的重复和“自己的”反身强调；比较语中补出第二个“爱”，使汉语表达完整自然。
