  text: καὶ μὴ μεθύσκεσθε οἴνῳ, ἐν ᾧ ἐστιν ἀσωτία, ἀλλὰ πληροῦσθε ἐν πνεύματι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/018.yaml
  text: And do not get drunk with wine[a], in which there is debauchery, but be filled with the Spirit,
translation:
  language: zh_hans
  text: 不要醉酒，酒会使人放荡；倒要被圣灵充满[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要在圣灵里得着充满。”也有人把这里的“灵”较一般地理解为人的心灵。
    reason: 原文ἐν πνεύματι可理解为“被圣灵充满”或“在圣灵里得着充满”；πνεύματι也有较一般理解为“灵”的可能。
lexical_decisions:
- source_word: μεθύσκεσθε
  choice: 醉酒
  rationale: 现在时被动形式在此具有不及物意义，与 μή 构成禁令。“不要醉酒”是现代汉语最自然、简洁的表达，也涵盖进入并处于醉酒状态的意思。
- source_word: οἴνῳ
  choice: 醉酒（由上下文表达“因酒而醉”）
  rationale: 酒是导致醉酒的媒介。汉语“醉酒”本身已明确指饮酒致醉，避免生硬的“被酒灌醉”，同时没有泛化为其他形式的沉醉。
- source_word: ἐν ᾧ ἐστιν ἀσωτία
  choice: 因为醉酒会使人放荡
  rationale: 原句直译近于“其中有放荡”。关系代词在语法上可回指“酒”，但语义上指饮酒致醉的情形。译文以自然汉语表达其理由和后果，同时保留放纵失序的伦理含义。
- source_word: ἀσωτία
  choice: 放荡
  rationale: 该词表示挥霍、放纵、缺乏节制而失序的生活。“放荡”通俗而庄重，比“荒宴”更现代，也比单纯的“浪费”更完整地传达道德含义。
- source_word: πληροῦσθε
  choice: 要被……充满
  rationale: 保留现在时被动命令的基本形式；汉语虽不显明持续体，“要被……充满”仍可在劝勉语境中表达持续接受充满的要求。
- source_word: ἐν πνεύματι
  choice: 被圣灵充满
  rationale: 在 πληροῦσθε 后，ἐν 加与格可表达内容、媒介或范围；“被圣灵充满”是自然汉语，并与前面的酒形成鲜明对照。原文在“圣灵”“在圣灵里”及一般性的“灵”之间仍有一定解释空间，故以脚注说明。
theological_decisions:
- issue: πνεύματι 所指及 ἐν 的功能
  choice: 圣灵，并译为“被圣灵充满”
  alternative: “在圣灵里得着充满”；或较一般地理解为“灵里充盈”
  rationale: 保罗书信的语境和酒与灵的对照，使“圣灵”最为可能；但希腊文 πνεύματι 没有冠词，ἐν 也可侧重范围而非充满的内容或施事者。因此正文采用最可能且自然的译法，脚注保留真实的语义和句法张力。
translation_notes:
  register: 采用现代、庄重而易懂的劝勉语体。“因为醉酒会使人放荡”比逐字译作“其中有放荡”更符合现代汉语，同时没有弱化原文的伦理警告；分号呈现禁令与正面命令之间的对照。
