  text: καὶ αἰσχρότης καὶ μωρολογία ἢ εὐτραπελία, ⸂ἃ οὐκ ἀνῆκεν⸃, ἀλλὰ μᾶλλον εὐχαριστία.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/004.yaml
  text: And obscenity and foolish talk or crude joking[a], which are not fitting[b], but rather thanksgiving.
translation:
  language: zh_hans
  text: 还有淫秽、愚妄的话或粗俗的玩笑[a]，这些都不合宜[b]；倒要说感谢的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“粗鄙的戏谑”。希腊词εὐτραπελία在一般用法中也可指机智诙谐，但这里与不合宜的言语并列，带有贬义。
    reason: lexical_alternative
  - marker: b
    text: 或译“这些都不得体”或“这些都不恰当”。
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰσχρότης
  choice: 淫秽
  rationale: 该词指可耻、卑下或不雅之事；在本节以言语为主的语境中，“淫秽”既保留道德上的负面评价，也自然指向不雅的表达。
- source_word: μωρολογία
  choice: 愚妄的话
  rationale: 该复合词表示愚蠢、无意义的言谈；“愚妄的话”清楚自然，并保留其言语性质和伦理分量。
- source_word: ἢ
  choice: 或
  rationale: 按其通常的选择连词义直译为“或”，连接清单中的末项；上下文仍清楚表明这些项目都受到否定。
- source_word: εὐτραπελία
  choice: 粗俗的玩笑
  rationale: 此词在其他语境中可指机智诙谐，但在这里与其他不合宜之事并列，须表达贬义；“粗俗的玩笑”自然传达不雅、不得体的戏谑。
- source_word: ἃ οὐκ ἀνῆκεν
  choice: 这些都不合宜
  rationale: 中性复数关系代词总括前述各项；“这些都不合宜”准确表达不恰当、不相称的道德判断，也符合现代汉语表达。
- source_word: ἀλλὰ μᾶλλον
  choice: 倒要
  rationale: “倒要”简洁表达强烈转折及取而代之的意味，对应“而是更应当”。
- source_word: εὐχαριστία
  choice: 说感谢的话
  rationale: 该名词表示感谢、感恩的表达。汉语补出“说……的话”，使它与前述言语恶习的对比清楚自然，同时不限定感谢的具体对象。
theological_decisions:
- issue: αἰσχρότης在本节中是泛指不端行为，还是主要指不雅言语
  choice: 结合上下文译作“淫秽”，并让整句呈现以言语为主的恶习清单
  alternative: 译作范围更广的“可耻的事”或“不端行为”
  rationale: 其后的μωρολογία与εὐτραπελία明确涉及言语，末尾又以感谢的表达形成对照；因此按言语语境理解最为顺畅，但“淫秽”本身仍保留一定的概括性。
- issue: εὐτραπελία的褒贬色彩
  choice: 按贬义译作“粗俗的玩笑”
  alternative: 译作中性的“机智话”或“诙谐”
  rationale: 虽然该词在其他希腊文语境中可有正面含义，但这里它与淫秽和愚妄的话并列，并被明确评为“不合宜”，因此本处必须体现负面含义。
- issue: εὐχαριστία是否应明确为对上帝的感谢
  choice: 译为“说感谢的话”，不在正文中补出感谢的对象
  alternative: 译为“向上帝献上感谢”
  rationale: 以弗所书整体语境常将感谢指向上帝，但本节希腊文本没有明说对象；不补出“上帝”可避免消除原文的语法开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“淫秽”“愚妄的话”“粗俗的玩笑”形成清晰的并列；分号突出负面言语与感谢之言之间的强烈转折。所有脚注标记均已置于正文对应位置。
