  text: 但一切被光所揭露的，都显露出来[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一切被光所揭露的，都变得可见。”希腊文的分词和动词关系紧密，重点既可落在被揭露的过程，也可落在显露、变得可见的结果上。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ... πάντα
  choice: 一切
  rationale: 带冠词的中性复数范围广泛；“一切”既简洁自然，也保留其概括性。
- source_word: δὲ
  choice: 但
  rationale: δέ承接上文并带有轻微转折；“但”能体现这里由暗昧之事转向光之揭露作用的语气。
- source_word: ἐλεγχόμενα
  choice: 受……揭露的
  rationale: ἐλέγχω可指责备、揭发或使真相暴露；在ὑπὸ τοῦ φωτός及φανεροῦται的光明意象中，“揭露”最贴合语境，并保留被动含义。
- source_word: ὑπὸ τοῦ φωτὸς
  choice: 受光
  rationale: ὑπό加属格表示施事者；“受光揭露”自然表达光施行揭露的作用，同时保留定冠词所指向的上下文中的“光”。
- source_word: φανεροῦται
  choice: 都会显明出来
  rationale: φανερόω的被动形式表示变得可见或被显露；“显明出来”符合光照意象，并表达揭露所产生的结果。
theological_decisions:
- issue: “光”的具体所指
  choice: 仅译作“光”，不在正文中限定其所指
  alternative: 基督、福音、道德真理或信徒群体的见证
  rationale: 本节没有明确界定“光”的单一所指；保留这一意象的广度，可避免把上下文中的神学张力过早收窄。
- issue: 分词与主要动词之间的句法关系
  choice: 正文理解为“一切受光揭露的，都会显明出来”
  alternative: “一切显明出来的，都是光”或“凡被光照明的，就显露出来”
  rationale: ἐλεγχόμενα可作条件或描述性分词，与φανεροῦται形成“被揭露—显明”的紧密关系；正文采用现代汉语中较自然的结果表达，同时以脚注保留相关句法理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“揭露”表达光使暗中之事暴露，“显明出来”保留光照后变得可见的结果。句末逗号依照本节与下一句在希腊文中的连续关系保留。
