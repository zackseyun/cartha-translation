id: EPH.5.2
reference: Ephesians 5:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ περιπατεῖτε ἐν ἀγάπῃ, καθὼς καὶ ὁ Χριστὸς ἠγάπησεν ⸀ἡμᾶς καὶ παρέδωκεν ἑαυτὸν ὑπὲρ ⸀ἡμῶν προσφορὰν καὶ θυσίαν τῷ θεῷ εἰς ὀσμὴν εὐωδίας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/002.yaml
  text: and walk in love[a], just as the Messiah also loved us and gave himself up for us[c][b], an offering and sacrifice to God for a fragrant aroma.
translation:
  language: zh_hans
  text: 也要在爱中行事，正如基督[a]爱了我们，为我们[b]舍了自己，献给上帝作供物和祭物，成为馨香之气[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基督”意为“受膏者”，也可译作“弥赛亚”；这里用作称号。
    reason: lexical_alternative
  - marker: b
    text: “为我们”也可理解为“代表我们”或“为了我们的益处”；这里的希腊语表达本身不必限定为其中一种。
    reason: lexical_alternative
  - marker: c
    text: “馨香之气”沿用旧约献祭用语，描写献给上帝、蒙他喜悦的祭物。
    reason: cross_reference
lexical_decisions:
- source_word: περιπατεῖτε
  choice: 行事
  rationale: 保留保罗以“行走”比喻生活方式的意象，同时用现代汉语中自然的“行事”表达持续的生活实践。
- source_word: ἐν ἀγάπῃ
  choice: 在爱中
  rationale: 保留介词结构，可同时表达爱是行事的范围、氛围和方式，不将其收窄为单纯的情感或某一种行动。
- source_word: ὁ Χριστός
  choice: 基督
  rationale: “基督”是现代汉语中对希腊称号 Χριστός 最通行且庄重的表达；脚注说明其称号含义及可译形式。
- source_word: ἠγάπησεν ἡμᾶς
  choice: 爱了我们
  rationale: 直接表达不定过去时所指向的实际行动，并与本节前面的“爱”保持词根呼应。
- source_word: παρέδωκεν ἑαυτὸν
  choice: 舍了自己
  rationale: 自然表达主动交出、献上自己的含义，也符合本句的献祭语境；不额外规定交付的具体机制。
- source_word: ὑπὲρ ἡμῶν
  choice: 为我们
  rationale: 保留 ὑπέρ 在此处可有的受益性和代表性含义，不在正文中将其限定为更窄的替代公式。
- source_word: προσφορὰν καὶ θυσίαν
  choice: 供物和祭物
  rationale: 分别保留两个献祭术语，不将它们合并为一个概念；“供物”侧重所献之物，“祭物”明确祭祀语境。
- source_word: τῷ θεῷ
  choice: 献给上帝
  rationale: 结合 παρέδωκεν 及献祭名词，将与格所表达的承受者或方向自然译出。
- source_word: εἰς ὀσμὴν εὐωδίας
  choice: 成为馨香之气
  rationale: 保留具体的香气意象及旧约献祭用语；“成为”自然传达 εἰς 在此处表示的结果或作用，而不把馨香仅抽象化为“蒙悦纳”。
theological_decisions:
- issue: Χριστός 的称号性质
  choice: 基督
  alternative: 弥赛亚；受膏者
  rationale: 原词在此带冠词，具有称号性质。“基督”是汉语中成熟、通行的称号形式；脚注补明其意义，避免把它仅仅当作人名理解。
- issue: ὑπὲρ ἡμῶν 在献祭语境中的含义
  choice: 为我们
  alternative: 代表我们；代替我们
  rationale: 上下文明确表达基督为众人自我献上，但介词本身可以承载受益性或代表性。“为我们”保存这种神学分量和张力，不擅自将其限定为单一解释。
- issue: 馨香意象与上帝悦纳的关系
  choice: 成为馨香之气
  alternative: 成为蒙上帝悦纳的祭物
  rationale: 原文以具体的献祭香气意象表达，不直接使用“悦纳”一词；正文保留原有比喻，脚注说明其旧约背景，而不以解释取代意象。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“在爱中行事”保留原文的生活道路隐喻；“舍了自己”简洁自然；后半句维持“供物和祭物”两个并列术语及“馨香之气”的具体祭祀意象。所有脚注标记均按正文出现顺序设置。
