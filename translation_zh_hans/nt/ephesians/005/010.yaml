  text: testing what is pleasing to the Lord;[a]
translation:
  language: zh_hans
  text: 要察验什么是主所喜悦的；[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “察验”也可译作“辨明”或“查明”。
    reason: 词义备选：δοκιμάζοντες含考察、检验并据此辨明之意。
lexical_decisions:
- source_word: δοκιμάζοντες
  choice: 察验
  rationale: 现在时主动分词，承接上下文的劝勉语气，表达持续考察并判断的行动。“察验”兼顾检验与辨明之意，又适合庄重、自然的现代汉语。
- source_word: τί
  choice: 什么
  rationale: 在间接问句中作疑问代词；译作“什么”最自然，也忠实保留原文结构。
- source_word: ἐστιν
  choice: 是
  rationale: 系词功能由“什么是……”直接体现，无须增译。
- source_word: εὐάρεστον
  choice: 所喜悦的
  rationale: 表达令某一对象喜悦、蒙其悦纳之意。“所喜悦的”比单纯“可接受的”更能保留关系性色彩。
- source_word: τῷ κυρίῳ
  choice: 主所
  rationale: 与“喜悦”构成自然的汉语领属式表达“主所喜悦的”；保留κύριος为“主”，不进一步指明所指。
theological_decisions:
- issue: κύριος所指为何
  choice: 主
  alternative: 主耶稣；神
  rationale: 希腊文仅使用“主”这一称号。上下文可能具有基督论指向，但译文不作原文未明说的扩展，以保留其张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“要察验”使独立经节能自然承接上下文的劝勉；分号与所给段落流向一致。
