  yaml_path: translation/nt/ephesians/005/007.yaml
  text: Therefore[a], do not become partners with them.
translation:
  language: zh_hans
  text: 所以，不要与他们一同有份。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与他们一同有份”也可译作“成为他们的同伴”或“与他们共同参与者”。按上下文，这可指参与他们的罪恶行为，或与他们同受其后果；但原文在本句没有明确说明共同参与的具体事项。
    reason: 说明συμμέτοχοι αὐτῶν的词汇替代译法，并保留原文未明说参与对象的概括性。
lexical_decisions:
- source_word: μὴ
  choice: 不要
  rationale: 与命令式动词连用，现代汉语自然表达为禁止性的“不要”。
- source_word: οὖν
  choice: 所以
  rationale: 承接5:3–6的警告并引出推论；“所以”清楚自然地保留这一逻辑联系。
- source_word: γίνεσθε
  choice: 成为
  rationale: 保留γίνομαι所表达的“进入或形成某种状态”，比单纯译作“作”或“是”更准确。
- source_word: συμμέτοχοι
  choice: 一同有份的人
  rationale: 该词指与别人共同参与或分享的人；“一同有份”既保留共同参与之意，也避免用“同伙”预先限定其贬义色彩和参与范围。
- source_word: αὐτῶν
  choice: 与他们
  rationale: 代词指向上文所说的人；译作“与他们”符合汉语搭配，同时不擅自补成“在他们的行为上”。
theological_decisions:
- issue: συμμέτοχοι αὐτῶν所指共同参与的范围
  choice: 正文保留“与他们一同有份”的概括表达，不明确限定为行为或结局。
  alternative: 不要参与他们的恶行；不要与他们同受结局。
  rationale: 上下文暗示不可参与悖逆之人的罪恶生活，也可能包含与其结局有份的意味；但本节希腊文只明确说“他们”，没有明说参与何事，因此不在正文中消除这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“成为与他们一同有份的人”略带经文语体，以保留“成为”的动态含义和原句对参与范围的含蓄表达；不用“同流合污”，因为该成语会把含义完全限定为参与恶行。
