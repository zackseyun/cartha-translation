id: EPH.5.15
reference: Ephesians 5:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Βλέπετε οὖν ⸂ἀκριβῶς πῶς⸃ περιπατεῖτε, μὴ ὡς ἄσοφοι ἀλλ’ ὡς σοφοί,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/015.yaml
  text: Therefore[b][a], watch carefully how you walk—not as unwise but as wise—
translation:
  language: zh_hans
  text: 所以，你们要仔细留意自己怎样行事[a]，不要像无智慧的人，却要像有智慧的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“自己怎样行走”；“行走”在这里比喻一个人的生活和行为方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε
  choice: 要……留意
  rationale: 这是现在时主动命令语气、第二人称复数，表达持续而警醒的关注；“要留意”在现代汉语中自然，并保留劝诫力度。
- source_word: οὖν
  choice: 所以
  rationale: 承接上文并引出推论；“所以”清楚保留其逻辑连接作用。
- source_word: ἀκριβῶς πῶς
  choice: 仔细……怎样
  rationale: ἀκριβῶς强调审慎、精确的态度，πῶς指向生活方式；此译法保留原文对行为方式的强调，又符合现代汉语语序。
- source_word: περιπατεῖτε
  choice: 行事
  rationale: 原义为“行走”，在这里比喻一个人的生活方式。“行事”自然传达语境含义，脚注保留原文的行走意象。
- source_word: μὴ ὡς ἄσοφοι
  choice: 不要像无智慧的人
  rationale: ὡς表达“像……一样”，ἄσοφοι与σοφοί形成直接反义对照。“无智慧”比“愚蠢”更贴近该词的基本意义；“人”在汉语中自然涵盖全体信徒。
- source_word: ἀλλ’ ὡς σοφοί
  choice: 却要像有智慧的人
  rationale: 保留与前半句平行的鲜明对比；“却要”自然表达ἀλλά的转折和劝勉语气。
theological_decisions:
- issue: ἄσοφοι与σοφοί的阳性复数形式是否应作男性限定
  choice: 译为泛指的“无智慧的人……有智慧的人”
  alternative: 无智慧的男人……有智慧的男人
  rationale: 希腊语阳性复数形容词在此可代表泛指群体，语境中的劝勉面向整个信徒群体。现代汉语“人”准确保留这种泛指意义，不额外加入原文没有的男性限定。
- issue: περιπατεῖτε的行走隐喻
  choice: 正文译为“行事”，脚注说明直译
  alternative: 正文直译为“行走”
  rationale: 这里的“行走”指生活和行为方式。正文采用自然清楚的现代汉语，同时借脚注保存保罗原有的隐喻，避免读者误解为实际步行。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“仔细留意自己怎样行事”保持劝诫语气；“无智慧的人……有智慧的人”保留原文的对称对比，不作性别限定。
