  text: Therefore[a], become imitators of God, as beloved children,
translation:
  language: zh_hans
  text: 所以，你们要效法上帝[a]，像蒙爱的儿女一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所以，你们要成为效法上帝的人，像蒙爱的儿女一样。”希腊语命令式也可强调持续成为或持续如此。
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεσθε
  choice: 要效法（与 μιμηταὶ 合译）
  rationale: γίνεσθε 是现在时命令式，与表语名词 μιμηταὶ 构成“要成为效法者／要效法”的劝勉。现代汉语直译“成为效法者”略显生硬，因此正文采用自然的动词表达“要效法”，并以脚注保留“成为”及持续性语气。
- source_word: οὖν
  choice: 所以
  rationale: 表示根据上文所得出的推论；“所以”既清楚承接前文，又符合现代汉语经文语体。
- source_word: μιμηταὶ
  choice: 效法
  rationale: 该名词指模仿、仿效的人。与 γίνεσθε 合译为“要效法”，保留明确的模仿含义，避免较宽泛的“跟随”。
- source_word: τοῦ θεοῦ
  choice: 上帝
  rationale: 作“效法”的对象。采用现代标准汉语中庄重且通行的“上帝”，不额外表达希腊语冠词。
- source_word: ὡς
  choice: 像……一样
  rationale: 保留方式或身份基础之间的紧凑关系，不擅自明确为纯因果性的“因为你们是”。
- source_word: τέκνα
  choice: 儿女
  rationale: τέκνα 包含男女，强调亲子关系；“儿女”在中文中自然、性别涵盖准确，也比“孩子们”更适合庄重语体。
- source_word: ἀγαπητά
  choice: 蒙爱的
  rationale: 表达处于被爱状态、为人所珍爱的含义；“蒙爱的”简洁庄重，并保留被动意味。
theological_decisions:
- issue: 劝勉与上帝儿女身份之间的关系
  choice: 译作“要效法上帝，像蒙爱的儿女一样”，把“蒙爱的儿女”呈现为效法的身份或方式背景，而不暗示人靠效法才成为上帝的儿女。
  alternative: 可译为“既是蒙爱的儿女，就要效法上帝”，明确将身份处理为命令的因由。
  rationale: ὡς 可承载方式、身份或隐含根据；正文保留其比较式和一定的开放性，不把隐含的因果关系完全明说。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“要效法”比“要成为效法者”更自然；脚注则保留 γίνεσθε 可能具有的“成为”及持续性语气。正文中的脚注标记置于整句末尾。
