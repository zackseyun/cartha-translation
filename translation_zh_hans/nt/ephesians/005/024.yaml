id: EPH.5.24
reference: Ephesians 5:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀλλὰ ⸀ὡς ἡ ἐκκλησία ὑποτάσσεται τῷ Χριστῷ, οὕτως καὶ αἱ γυναῖκες ⸀τοῖς ἀνδράσιν ἐν παντί.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/024.yaml
  text: But as the church submits to Messiah[a], so also wives to their husbands in everything.
translation:
  language: zh_hans
  text: 然而，教会怎样顺服弥赛亚[a]，妻子也要照样在凡事上顺服自己的丈夫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。希腊文Χριστός在这里用作称号。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: 然而
  rationale: 承接并转折于上文；“然而”在现代汉语中自然、庄重，又不过度加强转折。
- source_word: ὡς ... οὕτως καὶ
  choice: 怎样……也要照样
  rationale: 保留希腊文对应比较结构，并使汉语关系清楚。
- source_word: ἡ ἐκκλησία
  choice: 教会
  rationale: 在保罗书信语境中指基督徒群体；“教会”是现代汉语中通行且清楚的表达。
- source_word: ὑποτάσσεται
  choice: 顺服
  rationale: 表达自处于秩序之下的关系含义，不额外加入强迫或支配的解释。
- source_word: τῷ Χριστῷ
  choice: 弥赛亚
  rationale: Χριστός在此作为称号使用；“弥赛亚”能较明显地保留其称号性质，传统译法“基督”列入脚注。
- source_word: αἱ γυναῖκες
  choice: 妻子
  rationale: 本段是家庭关系教导，并与ἀνδράσιν相对，因此此处是“妻子”而非泛指“妇女”。
- source_word: τοῖς ἀνδράσιν
  choice: 自己的丈夫
  rationale: 家庭语境要求取“丈夫”之义；“自己的”在汉语中自然表达原文所隐含的婚姻配对关系。
- source_word: ἐν παντί
  choice: 在凡事上
  rationale: 直接保留原文表达的广泛范围，不添加原文没有的限制语。
- source_word: 第二分句省略的ὑποτάσσεται
  choice: 顺服
  rationale: 希腊文第二分句从前一分句承接谓语；汉语明说“顺服”可避免残缺和歧义，同时不增加新的语义。
theological_decisions:
- issue: Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 该词在本句中具有称号功能，正文用“弥赛亚”凸显这一点；“基督”是根深蒂固的传统译法，故以脚注保留。
- issue: 婚姻顺服范围的表达
  choice: 保留“在凡事上”，不加限定语
  alternative: 在合宜的凡事上／在适当的事上
  rationale: 原文仅说ἐν παντί。加入“合宜”或“适当”等词会在翻译中预先解决原文留下的神学张力。
- issue: 第二分句省略谓语
  choice: 在汉语中补出“顺服”
  alternative: 妻子对自己的丈夫也要凡事如此
  rationale: 原文的谓语可由上文明确补足；汉语复现谓语只是显明句法承接，不改变其陈述内容。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。“顺服”沿用读者熟悉的圣经用语，同时避免增添“绝对”“无条件”等原文没有的限定；“在凡事上”保持原句的张力。
