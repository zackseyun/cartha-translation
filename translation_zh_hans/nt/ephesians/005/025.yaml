source:
  edition: SBLGNT
  text: Οἱ ἄνδρες, ἀγαπᾶτε τὰς ⸀γυναῖκας, καθὼς καὶ ὁ Χριστὸς ἠγάπησεν τὴν ἐκκλησίαν καὶ ἑαυτὸν παρέδωκεν ὑπὲρ αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/025.yaml
  text: Husbands[a], love your wives, just as Messiah also loved the church and gave himself up for her[b],
translation:
  language: zh_hans
  text: 作丈夫的，要爱自己的妻子，正如弥赛亚[a]也爱教会，为她舍了自己[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。希腊语Χριστός在这里是称号，意为“受膏者”，与“弥赛亚”同义。
    reason: alternative_reading
  - marker: b
    text: 或译“为她把自己交出去”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ ἄνδρες
  choice: 作丈夫的
  rationale: 在以婚姻关系为主题的上下文中，ἄνδρες与γυναῖκας相对，指丈夫，而非泛指男人；“作丈夫的”是自然、明确的直接称呼。
- source_word: ἀγαπᾶτε
  choice: 要爱
  rationale: 以“要”表达现在时命令语气，并以普通动词“爱”保留与后文ἠγάπησεν的词汇呼应。
- source_word: τὰς γυναῖκας
  choice: 自己的妻子
  rationale: 婚姻语境确定γυναῖκας指妻子；“自己的”自然显明所指是受话者各自的妻子，而非泛指妇女。
- source_word: καθὼς καὶ
  choice: 正如……也
  rationale: “正如……也”同时传达καθώς的比较关系和καί的附加、强调作用，表明弥赛亚的爱是丈夫之爱的范式。
- source_word: ὁ Χριστός
  choice: 弥赛亚
  rationale: 此处有冠词，称号意味清楚；“弥赛亚”直接表达Χριστός作为“受膏者”称号的意义。
- source_word: ἠγάπησεν
  choice: 爱
  rationale: 中文动词通常不标过去时；上下文及后接的舍己行动足以呈现所指，并保留与前句“爱”的直接呼应。
- source_word: τὴν ἐκκλησίαν
  choice: 教会
  rationale: 此处指上帝子民的共同体；“教会”是现代汉语中清楚、通行且符合保罗语境的对应词。
- source_word: ἑαυτὸν παρέδωκεν
  choice: 舍了自己
  rationale: “舍了自己”自然表达主动、自愿的自我交付，并保留牺牲意味，却不加入本分句未明说的赎罪解释。
- source_word: ὑπὲρ αὐτῆς
  choice: 为她
  rationale: “为”简洁表达ὑπέρ加属格的“为了、代表”含义；“她”承接被拟人化的教会，符合本段婚姻类比。
theological_decisions:
- issue: 婚姻—教会类比中Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处ὁ Χριστός的称号功能鲜明；译作“弥赛亚”保存希腊称号的语义，同时以脚注给出汉语教会传统中通行的“基督”。
- issue: παρέδωκεν ὑπὲρ αὐτῆς所含牺牲意味的范围
  choice: 为她舍了自己
  alternative: 为她把自己交出去
  rationale: 正文体现自愿舍己及为教会而行的意义，但不添加原文在此分句中未明确陈述的代赎术语；脚注保留更贴近παραδίδωμι基本意象的译法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“作丈夫的”保持直接劝勉的语气；“正如……也……”保留原文的比较结构；“教会”以“她”承接，延续本段把教会置于婚姻类比中的拟人表达。
