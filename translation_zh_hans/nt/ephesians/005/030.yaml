  text: because we are members of his body[a].
translation:
  language: zh_hans
  text: 因为我们是他身体的肢体[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本加上：“出于他的肉和他的骨。”
