lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 引出前文所述行动的根据，保留希腊文的因果关系；“因为”自然、清楚。
- source_word: μέλη
  choice: 肢体
  rationale: 指身体的组成部分；在保罗关于基督身体的比喻中，“肢体”既保留身体意象，也表达各成员归属于同一身体。
- source_word: ἐσμὲν
  choice: 我们是
  rationale: 直接呈现现在时直陈语气，表达当前的身份与关系。
- source_word: τοῦ σώματος
  choice: 身体的
  rationale: 直译身体意象，并与上下文中基督和教会的关系相符。
- source_word: αὐτοῦ
  choice: 他
  rationale: 该代词在上下文中指基督；用人称代词“他”自然明确，又不额外添加原文没有的称谓。
theological_decisions:
- issue: 是否把较长的拜占庭文本“属于他的肉、他的骨”纳入正文
  choice: 正文只翻译SBLGNT的较短读法：“因为我们是他身体的肢体。”
  alternative: “因为我们是他身体的肢体，属于他的肉、他的骨。”
  rationale: 所给希腊文正文采用较短读法。较长读法可能受《创世记》2:23措辞及本段上下文影响，因此不纳入正文，但以脚注透明说明文本异文。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“肢体”是现代中文基督身体意象中自然且准确的表达；句式简洁，保留原文的因果连接及比喻张力。
