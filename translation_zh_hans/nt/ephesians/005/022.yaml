  text: Αἱ γυναῖκες τοῖς ἰδίοις ⸀ἀνδράσιν ὡς τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/022.yaml
  text: Wives[a], to your own husbands as to the Lord,
translation:
  language: zh_hans
  text: 作妻子的[a]，对自己的丈夫，如同对主。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希腊原文没有明写动词，句法上承接第21节的“顺服”。因此可按其承接的意思译作：“作妻子的，要顺服自己的丈夫，如同顺服主一样。”
    reason: 说明原文的省略结构及可供理解的补译。
lexical_decisions:
- source_word: Αἱ γυναῖκες
  choice: 作妻子的
  rationale: 在夫妻关系的劝勉语境中，γυναῖκες 指“妻子”，而不是泛指“女人”；“作妻子的”也自然引出对特定群体的 خطاب。
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: 对自己的丈夫
  rationale: ἀνήρ 在这里依婚姻语境指“丈夫”；保留 ἰδίοις 为“自己的”，强调各自具体的婚姻关系。介词“对”承接上文隐含的动作，使汉语关系清楚。
- source_word: ὡς
  choice: 如同……一样
  rationale: 保留比较关系，不把它扩展解释为“仿佛”或“完全以同样方式”。
- source_word: τῷ κυρίῳ
  choice: 对主
  rationale: κύριος 在保罗书信的此处指主耶稣，译作“主”；与前面的“对”形成自然对应。
- source_word: implicit verb from ὑποτασσόμενοι in v. 21
  choice: 要（顺服）
  rationale: 本节希腊文本没有明写动词，语意承接21节的 ὑποτασσόμενοι。中文若完全省去动作会极不自然，因此用“要”维持句法承接，并在脚注说明所隐含的是“顺服”，避免把该动词当成本节明文。
theological_decisions:
- issue: 是否在正文明确补出“顺服”
  choice: 正文不明写“顺服”，以“要对自己的丈夫”保留承接上文的省略，并用脚注交代隐含语意
  alternative: 作妻子的，要顺服自己的丈夫，如同顺服主一样。
  rationale: SBLGNT 本节本身是省略句，动作由21节“彼此顺服”带入。现代汉语需要最低限度的句法补足，但不宜让读者误以为“顺服”在第22节中再次明写。此处理同时保存原文结构和可读性。
- issue: “如同对主一样”所表达的比较范围
  choice: 保留简洁比较，不说明它意味着程度、方式或身份等同
  alternative: 像顺服主那样顺服丈夫
  rationale: ὡς 的具体比较范围须由上下文判断；译文不把丈夫等同于主，也不预先限定比较的全部含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“作妻子的”明确婚姻语境；正文尽量保存希腊文省略句。不过汉语“要对自己的丈夫，如同对主一样”仍带有刻意的未完句效果，分号表示语意将由后文继续展开。
