id: EPH.5.6
reference: Ephesians 5:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Μηδεὶς ὑμᾶς ἀπατάτω κενοῖς λόγοις, διὰ ταῦτα γὰρ ἔρχεται ἡ ὀργὴ τοῦ θεοῦ ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/006.yaml
  text: Let no one deceive you with empty words[a], for because of these things the wrath of God comes upon the sons of disobedience.
translation:
  language: zh_hans
  text: 不要让任何人用空洞的话欺骗你们，因为神的愤怒正因这些事临到那些悖逆的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“悖逆之子”，是指那些以悖逆、不顺从为特征的人。
    reason: 说明闪语式习语的字面形式及实际含义，避免将其误解为血缘关系或只指男性。
lexical_decisions:
- source_word: Μηδεὶς … ἀπατάτω
  choice: 不要让任何人……欺骗你们
  rationale: 以现代汉语自然表达第三人称现在时禁令，同时保留对受众“你们”的直接警告。
- source_word: κενοῖς λόγοις
  choice: 用空洞的话
  rationale: “空洞”保留κενοῖς所含缺乏实质、虚妄无效的意象；“话”可涵盖说辞或论调，不将含义限缩为论证。
- source_word: διὰ ταῦτα
  choice: 正因这些事
  rationale: διά加宾格在此表示原因；“这些事”保留其对上文所列行为的指涉，“正”凸显因果关系而不增添新的内容。
- source_word: ἔρχεται
  choice: 临到
  rationale: “临到”自然表达愤怒落在某些人身上，并保留希腊文现在时可能具有的现实性、惯常性或临近性，不明确限定时间。
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: 神的愤怒
  rationale: 直接保留ὀργή的愤怒含义，不弱化为较笼统的“审判”。
- source_word: τοὺς υἱοὺς τῆς ἀπειθείας
  choice: 那些悖逆的人
  rationale: 这是闪语式特征归属表达，指以不顺从为特征的人；汉语直译“悖逆之子”容易被误解为血缘或男性限定，正文采用自然且准确的意义表达，并以脚注说明原文字面形式。
- source_word: ἀπειθείας
  choice: 悖逆
  rationale: 该词表示不服从、拒绝顺从；“悖逆”兼具伦理上的不顺从和较庄重的经文语域，也不强行将其限定为单纯的“不信”。
theological_decisions:
- issue: 神愤怒的表述
  choice: 神的愤怒
  alternative: 神的审判
  rationale: 原文明确使用ὀργή，译文保留神圣愤怒的力度与神学张力，不以更宽泛的“审判”加以软化。
- issue: υἱοὺς τῆς ἀπειθείας这一习语
  choice: 那些悖逆的人
  alternative: 悖逆之子
  rationale: 原文的“……之子”是表示人物特征或归属的习语。现代汉语正文传达其实际所指，避免制造仅指男性或血缘关系的误解；脚注保留字面形式，未消除原文意象。
- issue: ἔρχεται的时间与体貌
  choice: 临到
  alternative: 将要临到
  rationale: 希腊文使用现在时，可能表达正在发生、确定会发生或一般性的事实；不加“将要”可避免仅将其解释为未来事件。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“空洞的话”保留原文比喻；“临到”符合警告和审判语境。正文使用“那些悖逆的人”准确传达习语含义，脚注同时保存原文“……之子”的形式。
