id: EPH.5.5
reference: Ephesians 5:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τοῦτο γὰρ ⸀ἴστε γινώσκοντες ὅτι πᾶς πόρνος ἢ ἀκάθαρτος ἢ πλεονέκτης, ⸀ὅ ἐστιν εἰδωλολάτρης, οὐκ ἔχει κληρονομίαν ἐν τῇ βασιλείᾳ τοῦ Χριστοῦ καὶ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/005.yaml
  text: For you know this[a], understanding that every sexually immoral or unclean or greedy person, who is an idolater[b], has no inheritance in the kingdom of Messiah and God.
translation:
  language: zh_hans
  text: 因为你们确实知道，也明白：凡是淫乱的、污秽的或贪婪的人——这样的人就是拜偶像的人[a]——在弥赛亚[b]和上帝的国里都没有基业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这就是拜偶像。”原文的表达在语法上也可能特别指贪婪这种恶行。
    reason: alternative_reading
  - marker: b
    text: “弥赛亚”原文为“基督”，在这里作为称号使用。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴστε γινώσκοντες
  choice: 确实知道，也明白
  rationale: 兼顾两个相叠的认知动词：ἴστε表达“知道”，γινώσκοντες进一步带出明白、认识的意味；“确实”体现其强调语气，同时保持现代汉语自然。
- source_word: πόρνος
  choice: 淫乱的（人）
  rationale: 指以性方面的不道德行为为特征的人；“淫乱”在现代中文圣经语体中清楚且庄重，并不把含义缩窄为某一种性行为。
- source_word: ἀκάθαρτος
  choice: 污秽的（人）
  rationale: 保留该词在保罗伦理语境中的道德不洁含义，也保留“洁净／污秽”的隐喻关联。
- source_word: πλεονέκτης
  choice: 贪婪的人
  rationale: 表示受贪欲支配、不断攫取的人；“贪婪”是自然且明确的现代汉语。
- source_word: ὅ ἐστιν εἰδωλολάτρης
  choice: 也就是拜偶像的人
  rationale: 依上下文将此句用于刚提到的人，尤其是贪婪的人；同时用脚注保留中性关系代词可能指向前述恶行、译作“这就是拜偶像”的语法张力。
- source_word: κληρονομίαν
  choice: 产业
  rationale: “产业”保留保罗书信中承受产业的圣约与末世色彩，比单纯的“份”更能传达继承意象。
- source_word: βασιλείᾳ
  choice: 国
  rationale: “国”是清楚而传统的对应，既可包含统治领域，也可承载王权统治的含义。
- source_word: Χριστοῦ
  choice: 弥赛亚
  rationale: 此处Χριστός作为称号使用，译作“弥赛亚”能明确呈现其称号意义。
- source_word: τοῦ Χριστοῦ καὶ θεοῦ
  choice: 弥赛亚和上帝的
  rationale: 直接保留两个并列属格，不在译文中强行裁定这一结构可能涉及的基督论句法问题。
theological_decisions:
- issue: ὅ ἐστιν εἰδωλολάτρης的指向
  choice: 正文译作“也就是拜偶像的人”，在语境中尤其修饰贪婪的人。
  alternative: 译作“这就是拜偶像”，使中性关系代词指向前述恶行，尤其是贪婪。
  rationale: 关系代词ὅ为中性，而前面的三个指人的名词均为阳性，因此存在真实的句法张力。歌罗西书3:5的平行说法支持把贪婪视为拜偶像；正文采用较自然的人称表达，脚注保留较贴近语法形式的另一译法。
- issue: 无权承受国度产业的时态
  choice: 译作现在状态“没有产业”。
  alternative: 译作将来事件“不能承受／将不能承受国度”。
  rationale: 原文使用现在时οὐκ ἔχει，译文保留当前状态的陈述，不把警告改成纯粹将来的事件。
- issue: “弥赛亚和上帝的国”的关系
  choice: 按字面保留并列属格“弥赛亚和上帝的国”。
  alternative: 采用明确断定某一特定基督论句法结论的解释性译法。
  rationale: 单一冠词与两个单数属格人称名词形成紧密联系，但译文不应超出原文，强行解决其具体句法与神学关系。
translation_notes:
  register: 采用现代、庄重且易懂的普通话书面语。“确实知道，也明白”保留原文重复强调的认知表达；并列形容词最后补出“人”，使中文自然。“产业”保留继承意象。“上帝”与“弥赛亚”采用清楚的称谓形式。所有脚注标记均已置于正文相应位置。
