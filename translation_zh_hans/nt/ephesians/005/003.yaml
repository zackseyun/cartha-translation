id: EPH.5.3
reference: Ephesians 5:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Πορνεία δὲ καὶ ⸂ἀκαθαρσία πᾶσα⸃ ἢ πλεονεξία μηδὲ ὀνομαζέσθω ἐν ὑμῖν, καθὼς πρέπει ἁγίοις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/003.yaml
  text: But sexual immorality and every impurity or greed must not even be named among you[a], as is proper for saints[c][b],
translation:
  language: zh_hans
  text: 可是，淫乱、各样污秽或贪婪[b]，在你们中间连提都不该提[a]；这与圣徒[c]的身份相称。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在你们中间，甚至不该有人提起这些事。”
    reason: lexical_alternative
  - marker: b
    text: “贪婪”也可译作“贪心”，指贪求更多、贪得无厌，并不限于性方面的欲望。
    reason: lexical_alternative
  - marker: c
    text: 这里的“圣徒”指归属上帝、蒙召成为圣洁子民的信徒，并非后世经册封的特殊阶层。
    reason: cultural_note
lexical_decisions:
- source_word: Πορνεία
  choice: 淫乱
  rationale: 该词广指不合乎正当伦理规范的性行为；“淫乱”是现代中文圣经语境中简洁且涵盖面较广的表达，并未把含义缩窄为某一种性行为。
- source_word: δὲ
  choice: 可是
  rationale: δέ在此承接上文并带有轻微转折；“可是”既保留转折，也不过度强化对立。
- source_word: ἀκαθαρσία πᾶσα
  choice: 各样污秽
  rationale: πᾶσα强调范围周全；“各样污秽”自然地表达各种不洁的言行与状态，而不擅自限定为某一类污秽。
- source_word: ἢ
  choice: 或
  rationale: 按其通常的析取作用连接另一项恶行，保留原文列举关系。
- source_word: πλεονεξία
  choice: 贪婪
  rationale: 该词表示贪求更多、攫取不止的欲望；“贪婪”是通行现代汉语，且不因上下文涉及性伦理就把词义限缩为性欲。
- source_word: μηδὲ ὀνομαζέσθω
  choice: 连提都不该提
  rationale: μηδέ与被动命令式共同构成强烈禁令；此译保留“甚至不”的强调，并以自然中文表达“被提及、被说起”的基本意义。
- source_word: ἐν ὑμῖν
  choice: 在你们中间
  rationale: 这里着眼于信徒群体，故采用群体性的“在你们中间”，而非解释为个人内心。
- source_word: καθὼς πρέπει
  choice: 这才合乎……的身份
  rationale: 该短语说明与某种身份相称、合宜；此译在现代中文中自然体现伦理上的相称性。
- source_word: ἁγίοις
  choice: 圣徒
  rationale: 这是保罗对归属上帝、被分别为圣之信徒的常用称呼；保留简洁的传统术语，并以脚注防止读者误解为后世册封的特殊阶层。
theological_decisions:
- issue: πλεονεξία在与性方面恶行并列时的范围
  choice: 译作较宽泛的“贪婪”
  alternative: “贪心”；或限定为“淫欲上的贪求”
  rationale: 虽然上下文涉及性伦理，但该希腊词本身通常指广义的贪得无厌；原文没有充分依据把它专门限定为性欲，故保留较宽含义。
- issue: μηδὲ ὀνομαζέσθω是禁止谈论，还是以修辞方式要求恶行不得存在
  choice: 正文保留“连提都不该提”的言说意象
  alternative: “在你们中间连影子都不该有”或“连听都不该听说”
  rationale: 原文直接使用“命名、提及”一词，但在伦理劝勉中也可能暗含这些事不应存在于群体中的意思；正文不将这一张力单向解释，脚注提供较贴近原文的另一说法。
- issue: ἁγίοις所指的人群
  choice: “圣徒”，指归属上帝的全体信徒
  alternative: “圣洁的人”或“上帝圣洁的子民”
  rationale: 该词在保罗书信中通常是信徒群体的身份称谓，不是指后来经册封的少数人物；正文保留传统称谓，脚注澄清。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“可是”表达轻微转折；“连提都不该提”保留原文的强调和言说意象；“合乎……的身份”使结句自然易懂，同时忠实呈现行为应与圣徒身份相称的含义。标点使用分号，以清楚区分禁令与合宜性说明。
