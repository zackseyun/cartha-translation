  text: τὰ γὰρ κρυφῇ γινόμενα ὑπ’ αὐτῶν αἰσχρόν ἐστιν καὶ λέγειν·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/012.yaml
  text: For it is shameful even to speak of the things done by them in secret[a].
translation:
  language: zh_hans
  text: 因为他们暗中所做的事，就是提起也是可耻的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们暗中所行的事。”
    reason: 为“他们暗中所做的事”提供词汇层面的替代译法，对应原文名词性分词短语；“所行的事”保留行为／作为的含义。
lexical_decisions:
- source_word: γὰρ
  choice: 因为
  rationale: γάρ承接上文，为前面的劝勉提供理由；“因为”自然地保留了解释关系。
- source_word: τὰ ... γινόμενα
  choice: 所做的事
  rationale: 冠词加分词在此作名词性结构，指所进行的事情或行为；“所做的事”既自然，也保留了原文概括性的表达。
- source_word: κρυφῇ
  choice: 暗中
  rationale: 该副词性与格形式表示行为是在隐蔽、不为人知的情形下进行；“暗中”简洁而准确。
- source_word: γινόμενα
  choice: 所做的
  rationale: 该现在分词在结构中描述正在发生或进行的事；汉语“所做的”无需生硬标出进行体，也不削弱其行为含义。
- source_word: ὑπ’ αὐτῶν
  choice: 他们……所做的
  rationale: ὑπό加属格标明施事者；在汉语中将“他们”置于“所做的事”之前，直接保留代词而不补明其所指。
- source_word: αἰσχρόν
  choice: 可耻的
  rationale: αἰσχρόν表示在道德上令人羞耻、丢脸；“可耻的”符合现代汉语，也保留明确的伦理评价。
- source_word: καὶ λέγειν
  choice: 就是提起也是
  rationale: καί在这里有递进、强调作用，可译为“甚至”；“就是提起也是”在汉语中自然表达连谈及这些事都可耻的意思。
theological_decisions:
- issue: αὐτῶν所指的范围
  choice: 正文仅译为“他们”，不明确补出先行对象
  alternative: 译为“那些悖逆的人”或“行黑暗之事的人”
  rationale: 原文只用代词，其所指由上下文提供。正文不补明对象，可避免把语境解释直接写入本节，并保留原文的简洁与指代关系。
- issue: αἰσχρόν ἐστιν καὶ λέγειν的语义重点
  choice: 译为“就是提起也是可耻的”
  alternative: 译为“连说出来都不合宜”
  rationale: “可耻”保留原文较强的道德评价；“不合宜”可能弱化语气。此处不将经文解释为禁止揭露罪恶，而只是忠实表达：这些隐秘行为本身恶劣到连提起都令人羞耻。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“暗中所做的事”保留原文名词性分词结构的概括性；“就是提起也是可耻的”兼顾递进强调和汉语自然度。脚注标记已在正文中对应出现。
