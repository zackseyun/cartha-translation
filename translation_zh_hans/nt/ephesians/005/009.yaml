id: EPH.5.9
reference: Ephesians 5:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ γὰρ καρπὸς τοῦ ⸀φωτὸς ἐν πάσῃ ἀγαθωσύνῃ καὶ δικαιοσύνῃ καὶ ἀληθείᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/009.yaml
  text: for the fruit of the light is in all goodness and righteousness and truth[c][b][a],
translation:
  language: zh_hans
  text: 因为光[b]所结的果子，表现在一切良善、公义[a]和真实之中[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”或译“正义”。这里的希腊词可兼有这两方面的含义。
    reason: lexical_alternative
  - marker: b
    text: 有些抄本作“圣灵所结的果子”，而不是“光所结的果子”。
    reason: textual_variant
  - marker: c
    text: “表现在……之中”直译为“在……之中”；也可理解为“在于……”。
    reason: translation_alternative
lexical_decisions:
- source_word: γὰρ
  choice: 因为
  rationale: 承接第8节，说明为何应当行事为人像光明的儿女；“因为”自然保留了解释和论证关系。
- source_word: καρπὸς
  choice: 所结的果子
  rationale: 保留保罗以“果子”喻指生命所产生品格与行为的意象；在汉语中补出“所结的”使“光的果子”更自然。
- source_word: τοῦ φωτός
  choice: 光所结的
  rationale: 忠实采用SBLGNT的“光”，并与第8节“光明”的语境相连；属格在此自然转化为主谓式定语。
- source_word: ἐν
  choice: 表现在……之中
  rationale: ἐν可表示果子出现或显明的范围。此译比生硬的“在……中”自然，同时以脚注保留“在于”等理解。
- source_word: πάσῃ
  choice: 一切
  rationale: 与抽象名词连用时表达完备、全面的意义；这里统摄并列的三项品格。
- source_word: ἀγαθωσύνῃ
  choice: 良善
  rationale: 涵盖道德上的善与使人得益处的善行，不缩窄为单纯的“仁慈”。
- source_word: δικαιοσύνῃ
  choice: 公义
  rationale: 保留该词在保罗书信中兼具正直和正义的宽广含义；“正义”作为可行译法列入脚注。
- source_word: ἀληθείᾳ
  choice: 真实
  rationale: 既可指与真理相符，也可指品格与行为的真诚可靠；“真实”在此品格清单中比抽象的“真理”更自然，又不把词义限于“诚实”。
theological_decisions:
- issue: 属格短语的文本异读
  choice: 光所结的果子
  alternative: 圣灵所结的果子
  rationale: SBLGNT正文作φωτός（“光”），且紧接第8节“在主里是光”“行事为人要像光明的儿女”的语境；“圣灵”异读具有重要抄本与译本传统，故收入脚注而不取代正文。
- issue: δικαιοσύνη的语义范围
  choice: 公义
  alternative: 正义
  rationale: “公义”能自然表达合乎正直准则的品格，“正义”则更突出公平公正的社会维度；正文不排除后者，并以脚注保留。
- issue: ἐν与三项品格的关系
  choice: 表现在……之中
  alternative: 在于……；存在于……之中
  rationale: 原文没有明说这些品格是果子的组成、领域还是表现方式。正文采用自然且较开放的“表现在……之中”，脚注保留更贴近形式的译法，避免把关系限定为严格的构成关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“所结的果子”保留原文隐喻并符合汉语习惯；“良善、公义和真实”形成简洁整齐的三项并列。脚注标记分别紧随相关词语或短语，正文中的[a]、[b]、[c]与脚注完全对应。
