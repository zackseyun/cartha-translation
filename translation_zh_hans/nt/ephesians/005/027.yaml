  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἵνα παραστήσῃ ⸀αὐτὸς ἑαυτῷ ἔνδοξον τὴν ἐκκλησίαν, μὴ ἔχουσαν σπίλον ἢ ῥυτίδα ἤ τι τῶν τοιούτων, ἀλλ’ ἵνα ᾖ ἁγία καὶ ἄμωμος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/027.yaml
  text: so that he himself might present the church to himself in splendor[a], not having spot or wrinkle or anything like that[c][b], but so that she might be holy and blameless.
translation:
  language: zh_hans
  text: 为要他亲自把教会呈献给自己，使她成为荣耀的[a]，没有污点、皱纹或任何类似的东西[b]，而是圣洁、无可指责。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“荣美的”。希腊语形容词可译为“荣耀的”，也可表达教会处于荣美光辉的状态。
    reason: lexical_alternative
  - marker: b
    text: 直译：“或任何这类的东西”。
    reason: lexical_alternative
lexical_decisions:
- source_word: παραστήσῃ
  choice: 献给
  rationale: 此处指把教会带到自己面前并归给自己；在婚姻意象中，“献给”比单纯“呈现”更自然，同时保留正式呈献的意味。
- source_word: αὐτὸς
  choice: 亲自
  rationale: 保留显明代词的强调作用，突出基督本人施行这一行动。
- source_word: ἑαυτῷ
  choice: 给自己
  rationale: 直接保留反身关系，不将其解释为献在上帝面前或仅仅为自己预备。
- source_word: ἔνδοξον
  choice: 满有荣光
  rationale: 该形容词直接修饰教会，可表示“荣耀的”或处于荣美光辉之中；“满有荣光”在现代汉语中自然庄重，也保留其状态和品质两方面。
- source_word: ἐκκλησίαν
  choice: 教会
  rationale: 这里指上帝子民的整体；“教会”是保罗书信语境中通行且准确的译法。
- source_word: μὴ ἔχουσαν
  choice: 没有
  rationale: 以自然汉语表达分词所描述的教会状态。
- source_word: σπίλον
  choice: 污点
  rationale: 保留具体的洁净与外观意象，并能与“皱纹”自然并列。
- source_word: ῥυτίδα
  choice: 皱纹
  rationale: 是该词直接而自然的现代汉语对应，保留新妇荣美的意象。
- source_word: ἤ τι τῶν τοιούτων
  choice: 或任何类似的缺陷
  rationale: 表达开放性的同类事物范围；补出“缺陷”使汉语清楚，并承接污点和皱纹所代表的不完美。
- source_word: ἀλλ’ ἵνα ᾖ
  choice: 而是
  rationale: 第二个目的从句与前面的否定状态构成鲜明对照；汉语以“而是”简洁自然地呈现这一关系。
- source_word: ἁγία
  choice: 圣洁
  rationale: 采用标准且具有经文分量的译法，不缩减为单纯“分别出来”。
- source_word: ἄμωμος
  choice: 无可指责
  rationale: 该词可指无瑕疵或无可责备；此译法避免与前面的具体缺陷意象重复，并保留伦理层面的含义。
theological_decisions:
- issue: 基督把教会献给自己的反身意象
  choice: 保留“他亲自……献给自己”
  alternative: 简化为“把教会献上”，或明确解释为把教会献在上帝面前
  rationale: 希腊文同时有强调性的 αὐτός 和反身代词 ἑαυτῷ。译文保留这种不寻常而有神学张力的表达，不替原文确定其更广泛的末世或位格关系解释。
- issue: 教会的洁净与无瑕意象
  choice: 译作“没有污点、皱纹……而是圣洁、无可指责”
  alternative: 译作“没有斑点、皱纹……而是圣洁、毫无瑕疵”
  rationale: 原文把新妇外观的具体意象、洁净意象和伦理性的圣洁并置；当前译法使这些层面都可见，而不将其限定为单一的祭牲或婚礼解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“献给自己”保留原文反身结构；以阴性代词“她”承接教会，也使上下文中的婚姻意象清晰。所有脚注标记均已置入正文。
