    reason: lexical_alternative
lexical_decisions:
- source_word: λαλοῦντες
  choice: 交流
  rationale: 此处为与后续分词并列的现在分词；“交流”自然表达会众彼此以诗歌发声相通的宽泛含义，不把它限定为正式讲话。
- source_word: ἑαυτοῖς
  choice: 彼此
  rationale: 复数反身代词在这里通常具有相互意义；“彼此”符合群体语境，同时以脚注保留“在你们中间／对自己”的可能表达。
- source_word: ψαλμοῖς
  choice: 诗篇
  rationale: 这是标准对应词，既可指《诗篇》中的诗，也可泛指诗篇式歌曲；译文不进一步限定。
- source_word: ὕμνοις
  choice: 颂歌
  rationale: 保留与“诗篇”和“歌曲”有别的三项并列结构；“颂歌”在现代汉语中自然且庄重。
- source_word: ᾠδαῖς πνευματικαῖς
  choice: 属灵的歌曲
  rationale: πνευματικαῖς直接修饰“歌曲”；此译法保留“属灵”之意，却不额外断言这些歌曲必然具有特定形式的圣灵默示。
- source_word: ᾄδοντες
  choice: 歌唱
  rationale: 直接表达唱歌之意，并与后面的ψάλλοντες构成相关而不完全重叠的动作。
- source_word: ψάλλοντες
  choice: 颂扬
  rationale: 新约语境中可指歌唱赞美或奏出旋律，并不必然规定乐器；“颂扬”保留赞美和音乐语境，又避免导入有关乐器的立场。
- source_word: τῇ καρδίᾳ ὑμῶν
  choice: 从心里
  rationale: 与格可表达范围或方式；“从心里”是自然现代汉语，强调歌唱与颂扬出于内心，而不把“心”误解为发声对象。
- source_word: τῷ κυρίῳ
  choice: 向主
  rationale: 与格在此自然表示歌唱和颂扬所指向的对象；保留“主”，不在本节中额外明确为“主耶稣”。
theological_decisions:
- issue: ψάλλοντες是否规定敬拜中的乐器使用
  choice: 译作“颂扬”，不指明是否有乐器伴奏。
  alternative: 译作“奏乐”或“歌唱赞美”。
  rationale: 该词历史上可含拨弦或奏乐之意，但在通用希腊语及本语境中并不必然要求乐器。译文不导入赞成或反对乐器的宗派立场，脚注保留其音乐性。
- issue: “主”的所指
  choice: 保留“主”。
  alternative: 明确译作“主耶稣”或“基督”。
  rationale: 以弗所书语境可能指向基督，但本节原文仅用κύριος；译文保留原文措辞，让上下文说明其所指。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“诗篇、颂歌和属灵的歌曲”保留原文三项并列；“从心里”自然表达内在、真诚的方式。句末逗号保留本节作为5:18起连续句法的一部分。
