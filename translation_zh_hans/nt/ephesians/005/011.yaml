  text: καὶ μὴ συγκοινωνεῖτε τοῖς ἔργοις τοῖς ἀκάρποις τοῦ σκότους, μᾶλλον δὲ καὶ ἐλέγχετε,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/011.yaml
  text: And do not participate in the unfruitful works of darkness[a], but instead even expose them[b],
translation:
  language: zh_hans
  text: 不要参与[a]那些属于黑暗、没有果效的行为，反倒还要揭露它们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “参与”也可译作“有份于”或“与……一同有份”。
    reason: lexical_alternative
  - marker: b
    text: “揭露”也可译作“责备”或“指正”。这个希腊词可以包括用言语纠正；在本段上下文中，也有使这些行为显露出来的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: συγκοινωνεῖτε
  choice: 参与
  rationale: 该动词表示与人一同有份或参与某事。“参与”是自然、明确的现代汉语，能够表达实际卷入其中的意思。
- source_word: ἔργοις
  choice: 行为
  rationale: 这里指具有道德性质的所作所为。“行为”符合现代汉语表达，也保留了保罗伦理用语的广度。
- source_word: ἀκάρποις
  choice: 结不出果子的
  rationale: 采用具体的结果意象，保留希腊文的果实隐喻，并与上下文关于光明之果的说法相呼应。
- source_word: σκότους
  choice: 属于黑暗
  rationale: 将属格理解为这些行为与黑暗的归属关系，既保留黑暗的道德隐喻，也避免将意思限缩为只是在暗处做的事。
- source_word: μᾶλλον δὲ καὶ
  choice: 反倒还要
  rationale: “反倒”表达强烈转折，“还要”体现καί所加强的递进：不仅不可参与，而且必须进一步采取行动。
- source_word: ἐλέγχετε
  choice: 揭露
  rationale: 上下文以光明使事物显露为主题，因此“揭露”最能体现使黑暗行为显明的意思，同时仍含有道德指斥的意味。
theological_decisions:
- issue: ἐλέγχετε针对黑暗行为的含义
  choice: 揭露它们
  alternative: 责备它们；谴责它们
  rationale: 第13节谈到一切受光责备或照明的事都会显露，因此此处宜保留使恶行显明的语境联系；脚注同时说明该词也可指言语上的责备，以免排除其纠正意味。
- issue: 两个命令之间的力度
  choice: 不要参与……反倒还要揭露
  alternative: 不要有份……而要责备
  rationale: 原文不只要求远离恶行，还要求采取积极的相反行动。“反倒还要”保留这种递进张力，却不擅自规定揭露的具体方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“属于黑暗”保留归属关系和道德隐喻；“结不出果子的”保留原文意象；句式简洁，适合公开诵读。
