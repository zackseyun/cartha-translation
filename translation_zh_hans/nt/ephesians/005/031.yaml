  text: ἀντὶ τούτου καταλείψει ἄνθρωπος ⸀τὸν ⸀πατέρα καὶ ⸀τὴν μητέρα καὶ προσκολληθήσεται ⸂τῇ γυναικὶ⸃ αὐτοῦ, καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/031.yaml
  text: For this reason a man will leave his father and mother and be joined to his wife[a], and the two will become one flesh.
translation:
  language: zh_hans
  text: “正因如此[a]，男人要离开父母，与妻子连合，二人要成为一体。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译为“为此”。希腊语ἀντὶ τούτου在这里引出《创世记》的引文，起因果承接作用。
    reason: 说明原文短语在此处的因果用法及可选译法。
lexical_decisions:
- source_word: ἀντὶ τούτου
  choice: 正因如此
  rationale: 此处引述《创世记》2:24，短语在上下文中起因果承接作用；“正因如此”既自然，又能衔接前文。
- source_word: καταλείψει
  choice: 要离开
  rationale: 将来时在引文中表达婚姻形成时的典型行动；“离开”指离开父母的家庭而建立新的婚姻联合，不额外加入“抛弃”的负面含义。
- source_word: ἄνθρωπος
  choice: 男人
  rationale: 虽然该词可泛指“人”，但此处与“妻子”相对应，具体指婚姻中的男性一方。
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: 父母
  rationale: 希腊文逐项说“父亲和母亲”；现代汉语合称“父母”简洁自然，关系归属由语境清楚表明。
- source_word: προσκολληθήσεται
  choice: 与……结合
  rationale: 该被动形式表示紧密连结或联合；“结合”在现代汉语中自然庄重，也保留婚姻联合的含义。
- source_word: τῇ γυναικὶ αὐτοῦ
  choice: 妻子
  rationale: γυνή可指“女人”或“妻子”，婚姻语境明确要求译作“妻子”。
- source_word: ἔσονται οἱ δύο
  choice: 二人成为
  rationale: 动词字面为“将是”，但与εἰς结构合用表示达到某种联合状态；“成为”准确传达结果意义，并保留“二人”的明确表述。
- source_word: εἰς σάρκα μίαν
  choice: 一体
  rationale: 字面意为“一个肉身”；汉语圣经传统及现代通顺表达常用“一体”，能传达婚姻中二人联合为一的关系，而不把σάρξ误解为罪性。
theological_decisions:
- issue: 婚姻引文中的性别用语
  choice: 男人……妻子
  alternative: 人……配偶
  rationale: 原文借“妻子”明确呈现男女婚姻双方，因此保留性别明确的表达，不将其改为中性称谓。
- issue: εἰς σάρκα μίαν中σάρξ的表达
  choice: 成为一体
  alternative: 成为一个肉身
  rationale: 这里沿用《创世记》的婚姻联合用语，并非指保罗书信中所谓的罪性；“一体”是自然且已有广泛圣经语感的汉语表达，同时保留二人联合为一的意象。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；以“正因如此”自然承接上下文，用“要”保留引文中将来时的规范性语气，并以“一体”表达“一肉身”的婚姻联合意象。
