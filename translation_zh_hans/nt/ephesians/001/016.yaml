  text: οὐ παύομαι εὐχαριστῶν ὑπὲρ ὑμῶν ⸀μνείαν ποιούμενος ἐπὶ τῶν προσευχῶν μου,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/016.yaml
  text: I do not cease giving thanks for you[a], making mention of you in my prayers,
translation:
  language: zh_hans
  text: 我不断为你们献上感谢，在我的祷告中提到你们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在我的祷告中记念你们。”希腊语习语直译为“在我的祷告中提到〔你们〕”。
    reason: 说明 μνείαν ποιούμενος 可译为“提到”或“记念”，并保留“你们”由上下文补出的事实。
lexical_decisions:
- source_word: οὐ παύομαι
  choice: 我不断
  rationale: 表达现在时所呈现的持续不停止状态；比“我从未停止”更贴合此处持续进行的语气，也符合现代汉语表达。
- source_word: εὐχαριστῶν
  choice: 献上感谢
  rationale: 保留“感谢”的明确含义；“献上”自然表达感谢所指向上帝的祷告语境，而不在正文中增添希腊文未明说的宾语。
- source_word: ὑπὲρ ὑμῶν
  choice: 为你们
  rationale: 在感恩语境中，ὑπέρ加属格表示因这些人或为这些人而感谢；“为你们”简洁自然，并保留原文关系上的一定宽度。
- source_word: μνείαν ποιούμενος
  choice: 提到你们
  rationale: 对应“作提及”这一希腊语习语；“你们”由上下文补明，在现代汉语中不可或缺。另一个可能意思“记念你们”收入脚注。
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: 在祷告中
  rationale: 准确表达提及发生的场合或范围；“在祷告中”是现代汉语最自然的说法。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“我不断……”保持保罗长句中持续行动的语势；正文不显式增添“上帝”作为感谢的对象，以免超出本节措辞。
