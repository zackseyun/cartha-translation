  to: 正如他在创世以前在他里面拣选了我们，使我们[c]在爱中[a]、在他面前成为圣洁、无可指摘[b]。
  rationale: 修订删除原文未明示的强调语“就”，以“在爱中”替换会缩窄语义的“怀着爱心”，并相应调整脚注a，使其保留ἐν ἀγάπῃ的句法及语义开放性。保留“使我们”及其脚注，以表达不定式与“拣选”之间的目的／结果关系，而不将其体系化。
