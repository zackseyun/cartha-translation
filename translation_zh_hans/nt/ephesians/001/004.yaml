  text: καθὼς ἐξελέξατο ἡμᾶς ἐν αὐτῷ πρὸ καταβολῆς κόσμου, εἶναι ἡμᾶς ἁγίους καὶ ἀμώμους κατενώπιον αὐτοῦ ἐν ἀγάπῃ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/004.yaml
  text: just as he chose us in him before the foundation of the world[a], to be holy and blameless before him in love[c][b],
translation:
  language: zh_hans
  text: 正如他在创世以前在他里面拣选了我们，使我们[c]在爱中[a]、在他面前成为圣洁、无可指摘[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在爱中”也可与下一节相连，译作：“在爱中，他预定了我们……”
    reason: alternative_reading
  - marker: b
    text: “无可指摘”或译“毫无瑕疵”。
    reason: lexical_alternative
  - marker: c
    text: “使我们”或译“为要我们”。
    reason: previous_rendering
lexical_decisions:
- source_word: καθὼς
  choice: 正如
  rationale: 承接上一节的颂赞内容，保留比较兼说明根据的连接作用。
- source_word: ἐξελέξατο
  choice: 拣选了
  rationale: 准确表达神主动选择的行动；“拣选”是现代汉语圣经语境中清楚而庄重的常用词，又不额外引入后世神学体系。
- source_word: ἐν αὐτῷ
  choice: 在他里面
  rationale: 保留保罗简洁而丰富的联合性表达，不扩写为“与他联合”，也保留原文代词。
- source_word: πρὸ καταβολῆς κόσμου
  choice: 在创世以前
  rationale: 以自然现代汉语表达世界被奠基、受造以前的时间意义；避免较生硬的“世界奠基以前”。
- source_word: εἶναι ἡμᾶς
  choice: 使我们
  rationale: 自然承接“拣选了我们”，表达不定式所指向的目的或结果，同时用脚注保留另一种较明确的目的性译法。
- source_word: ἁγίους
  choice: 圣洁
  rationale: 兼顾分别归神与道德纯洁的含义，是该词最直接、庄重的对应。
- source_word: ἀμώμους
  choice: 无可指摘
  rationale: 自然表达在神面前无可责备的状态，同时以脚注保留带有祭牲意象的“毫无瑕疵”。
- source_word: κατενώπιον αὐτοῦ
  choice: 在他面前
  rationale: 简洁保留处于神临在和鉴察之下的关系含义。
- source_word: ἐν ἀγάπῃ
  choice: 怀着爱心
  rationale: 作为与前句相连的读法，在现代汉语中较“在爱中”自然；原文也可能与下一节相连，故以脚注说明。
theological_decisions:
- issue: ἐξελέξατο在预定语境中可能被体系化解读
  choice: 拣选了我们
  alternative: 选择了我们；选定了我们
  rationale: 原文明说神的选择，但本译法不把后世任何宗派对拣选的完整理论带入经文。
- issue: ἐν ἀγάπῃ的句法归属
  choice: 在本节末译作“怀着爱心”
  alternative: 与下一节相连：“他本着爱预定我们……”
  rationale: 希腊文可使该短语修饰前面的圣洁无可指摘，也可使其引出下一节。正文依原有位置保留在本节，脚注明确另一种可能，不以教义判断消除歧义。
- issue: εἶναι ἡμᾶς所表达的目的或结果
  choice: 使我们
  alternative: 为要我们；好叫我们
  rationale: 不定式可从目的或结果角度理解；正文采用自然且不过度限定的表达，脚注保留更明确的目的性译法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“在他里面”刻意保留保罗原文紧凑的表达；其余句法尽量顺应现代汉语。所有脚注标记均置于正文相应词语之后。
