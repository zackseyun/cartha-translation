  rationale: 仅作安全的语体与句法调整：删除生硬的“这件事上”，用自然的结果性表达呈现祈求智慧、启示与认识上帝之间的关系；没有把 ἐπίγνωσις 的可能强化含义译成“更深”或“完全认识”。以破折号厘清“荣耀之父”是对“上帝”的同位称谓。
