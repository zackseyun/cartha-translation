source:
  edition: SBLGNT
  text: ἵνα ὁ θεὸς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ πατὴρ τῆς δόξης, δώῃ ὑμῖν πνεῦμα σοφίας καὶ ἀποκαλύψεως ἐν ἐπιγνώσει αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/017.yaml
  text: that the God of our Lord Jesus the Messiah[a], the Father of glory, may give you a spirit of wisdom and revelation in the knowledge of him[c][b],
translation:
  language: zh_hans
  text: 愿我们主耶稣弥赛亚[a]的上帝——荣耀之父[b]——赐给你们智慧和启示的灵[c]，使你们认识他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统译作“耶稣基督”。希腊语 Χριστός 意为“弥赛亚”，即“受膏者”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“荣耀之父”；也可理解为“荣耀的父”。
    reason: lexical_alternative
  - marker: c
    text: “灵”既可指上帝所赐、有智慧和启示的灵性或心志，也可指赐人智慧和启示的圣灵。原文在此没有冠词，所指存在歧义。
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: 愿
  rationale: 本节承接前文保罗的祷告内容；“愿”在中文中自然表达祈求语气，而不把从句误作独立陈述。
- source_word: ὁ θεὸς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: 我们主耶稣弥赛亚的上帝
  rationale: 保留“我们主”及属格关系；将 Χριστός 按其称号含义译为“弥赛亚”。
- source_word: ὁ πατὴρ τῆς δόξης
  choice: 荣耀之父
  rationale: 贴近原文属格结构，保留“荣耀”与“父”之间可能具有的丰富关系，不直接限定为单纯的性质形容。
- source_word: δώῃ ὑμῖν
  choice: 赐给你们
  rationale: “赐”符合祷告语境中的神圣恩赐，也准确表达间接受词 ὑμῖν。
- source_word: πνεῦμα σοφίας καὶ ἀποκαλύψεως
  choice: 智慧和启示的灵
  rationale: 中文“灵”可在一定程度上保留这是圣灵还是上帝所赐属灵心志的歧义；两个属格均自然地修饰“灵”。
- source_word: ἐν ἐπιγνώσει αὐτοῦ
  choice: 在认识他这件事上
  rationale: 保留 ἐν 所表达的领域或关联，避免径直改写为明确的目的从句；“认识”在中文中兼顾知识与关系性的认知。
theological_decisions:
- issue: πνεῦμα 是指圣灵，还是上帝所赐的灵性、心志
  choice: 智慧和启示的灵
  alternative: 赐人智慧和启示的圣灵；或有智慧和启示的心志
  rationale: 原文 πνεῦμα 没有冠词，两种理解均有可能。正文采用不加“圣”也不改译为“心志”的“灵”，尽量保留歧义，并以脚注说明。
- issue: Χριστός 的称号含义
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处与“耶稣”连用，但仍承载受膏者的称号意义；译作“弥赛亚”使普通读者能看见其称号性质，同时脚注保留传统译法。
- issue: ὁ πατὴρ τῆς δόξης 中属格的理解
  choice: 荣耀之父
  alternative: 荣耀的父；荣耀的源头之父
  rationale: 原文关系可理解为父具有荣耀、属于荣耀，或是荣耀的源头。正文维持形式较近且庄重的表达，不把其中一种解释定为唯一含义。
translation_notes:
  register: 采用现代、庄重而易懂的祷告用语。“荣耀之父”保留经文凝练的神学表达；“在认识他这件事上”略带正式色彩，用来保留原文 ἐν 的关联范围，避免把它过度明确为目的或结果。
