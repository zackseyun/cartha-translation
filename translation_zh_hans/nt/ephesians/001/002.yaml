  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b].
translation:
  language: zh_hans
  text: 愿恩典和平安从我们的父神和主耶稣基督临到你们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基督”意为“受膏者”，相当于“弥赛亚”；本句也可译作“主耶稣弥赛亚”。
    reason: 说明Χριστός既可作为称号理解，也可在这一组合中呈现为名称化的“基督”。
lexical_decisions:
- source_word: χάρις
  choice: 恩典
  rationale: 在保罗书信的问安中，该词既承载问候功能，也表达来自神的恩惠；“恩典”保留了这种神学分量。
- source_word: ὑμῖν
  choice: 临到你们
  rationale: 与句首补出的祝愿语气配合，以现代汉语自然表达希腊文中“给你们”的与格关系。
- source_word: εἰρήνη
  choice: 平安
  rationale: 既保留一般意义上的安宁，也能承载犹太传统中“平安”的丰富内涵。
- source_word: ἀπὸ
  choice: 从
  rationale: 直接表达恩典和平安的来源。
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: 我们的父神
  rationale: 将“神”与“我们的父”理解为同位关系；“我们的父神”是自然、庄重的现代汉语表达，没有添加原文所无的并列关系。
- source_word: κυρίου
  choice: 主
  rationale: 保留κύριος在此处作为对耶稣的尊称及其基督论分量。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣基督
  rationale: “耶稣基督”是现代汉语中自然且广为理解的固定表达；脚注说明Χριστός本有“受膏者／弥赛亚”的称号含义，避免遮蔽其语义。
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ中Χριστοῦ应译作固定称呼还是显明其称号含义
  choice: 正文采用“耶稣基督”
  alternative: “耶稣弥赛亚”或“耶稣这位弥赛亚”
  rationale: 在现代汉语里，“耶稣基督”最自然，也符合该书信问安语中名称化程度较高的用法；但Χριστός仍可被理解为“弥赛亚”这一称号，因此在脚注中保留这一真实语义。
- issue: 希腊文省略祝愿动词的问安结构
  choice: 译为“愿……临到你们”
  alternative: “恩典和平安给你们”
  rationale: 原文是书信问安中的省略表达；补出“愿……临到”可在不改变祝福性质的前提下形成自然完整的现代汉语句子。
translation_notes:
  register: 采用现代、庄重而易懂的书信祝福语体。“愿……临到你们”使希腊文省略式问安在汉语中完整自然；不在“主”与“耶稣基督”之间加停顿，以清楚表明这是同一位。
