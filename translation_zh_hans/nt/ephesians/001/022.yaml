id: EPH.1.22
reference: Ephesians 1:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ πάντα ὑπέταξεν ὑπὸ τοὺς πόδας αὐτοῦ, καὶ αὐτὸν ἔδωκεν κεφαλὴν ὑπὲρ πάντα τῇ ἐκκλησίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/022.yaml
  text: And he subjected all things under his feet[a], and gave him as head over all things to the church[b],
translation:
  language: zh_hans
  text: 又把万有都置于他的脚下[a]，并把他赐给教会，作统管万有的元首[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的措辞呼应《诗篇》8:6，描绘万有都被置于统治者脚下的经文意象。
    reason: cross_reference
  - marker: b
    text: “赐给教会”也可译作“为了教会”；希腊文与格 τῇ ἐκκλησίᾳ 既可表示领受者，也可表示受益者。
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: 万有
  rationale: 中性复数在这里指一切受造之物的总体；“万有”简洁、庄重，也保留了基督权柄的宇宙性范围。
- source_word: ὑπέταξεν
  choice: 置于……之下
  rationale: 该动词表示使某物处于从属地位。结合“脚下”的意象，译作“置于他的脚下”既自然又保留原文的支配含义。
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: 在他的脚下
  rationale: 直译保留了征服和统治的形象，并显出与《诗篇》8:6的经文呼应。
- source_word: αὐτὸν ἔδωκεν
  choice: 把他赐给
  rationale: 保留 δίδωμι“给予、赐下”的基本意义，而不缩窄为“任命”；这也让后面的与格可自然理解为领受者或受益者。
- source_word: κεφαλήν
  choice: 元首
  rationale: 此处是关于权柄与居首地位的比喻。“元首”在现代中文圣经语境中庄重且清楚，避免被误解为身体部位的单纯直述。
- source_word: ὑπὲρ πάντα
  choice: 统管万有
  rationale: ὑπέρ在此表达高于并掌权于万有之上的地位；“统管万有”自然呈现权柄关系，同时避免生硬的“在万有之上作头”。
- source_word: τῇ ἐκκλησίᾳ
  choice: 给教会
  rationale: 与格可表示领受者，也可表示受益者。正文采用“赐给教会”，最直接地连接 ἔδωκεν，同时以脚注保留“为了教会”的可能理解。
theological_decisions:
- issue: 基督的元首地位与教会及万有的关系
  choice: 神把基督赐给教会；这位基督是统管万有的元首。
  alternative: 神为了教会的益处，使基督作统管万有的元首。
  rationale: 原文最自然地把 κεφαλὴν ὑπὲρ πάντα 连在一起，并把 τῇ ἐκκλησίᾳ 理解为与“赐给”相关的领受者或受益者。正文与脚注共同保留基督对万有的普遍权柄，以及他与教会的特殊关系，不强行排除与格的另一种功能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“万有”“元首”保持保罗书信的宏阔语域；以“统管万有”清楚表达 ὑπὲρ πάντα 的权柄含义。正文中的[a]、[b]与脚注内容准确对应，并纠正咨询层中脚注标记与脚注内容次序不一致的问题。
