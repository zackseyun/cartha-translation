id: EPH.1.13
reference: Ephesians 1:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐν ᾧ καὶ ὑμεῖς ἀκούσαντες τὸν λόγον τῆς ἀληθείας, τὸ εὐαγγέλιον τῆς σωτηρίας ὑμῶν, ἐν ᾧ καὶ πιστεύσαντες ἐσφραγίσθητε τῷ πνεύματι τῆς ἐπαγγελίας τῷ ἁγίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/013.yaml
  text: In him[a], you also, after hearing the word of truth, the good news of your salvation, in him, and after believing, were sealed with the Holy Spirit of promise[d][c][b],
translation:
  language: zh_hans
  text: 在他里面[a]，你们也听见了真理之道，就是你们得救的福音[b]；又在他里面信了以后，就受了所应许的圣灵[c]作为印记[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”指上文的基督；也可译为“在这位（基督）里面”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“使你们得救的福音”；直译为“你们救恩的福音”。
    reason: genitive_ambiguity
  - marker: c
    text: 直译：“应许的圣灵”或“应许之圣灵”，即神所应许赐下的圣灵。
    reason: alternative_reading
  - marker: d
    text: 也可译：“就被所应许的圣灵盖上了印。”第二个“在他里面”也可与“受印”联系起来理解。
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ἐν ᾧ
  choice: 在他里面
  rationale: 关系代词承接上文的基督；此译既符合现代汉语，也保留保罗书信中“在基督里面”的联合含义。原文在本节重复此语，正文也予以保留。
- source_word: καὶ ὑμεῖς
  choice: 你们也
  rationale: 保留καί的附加意味，表明“你们”也被包括在上文所说的人当中。
- source_word: ἀκούσαντες
  choice: 听见了
  rationale: 用完成体“了”表达不定过去时分词，并让后文“信了以后”明确呈现其与主要动词之间的先后关系，而不把这一语法次序扩展成特定宗派的救恩程序。
- source_word: τὸν λόγον τῆς ἀληθείας
  choice: 真理之道
  rationale: “道”兼具话语、信息之义，保留λόγος的传统互文色彩；“真理之道”在现代中文中仍清楚而庄重。
- source_word: τὸ εὐαγγέλιον τῆς σωτηρίας ὑμῶν
  choice: 关于你们得救的福音
  rationale: “福音”准确对应εὐαγγέλιον；“关于”以自然中文表达属格可指福音的内容，同时避免把它仅限定为结果或工具。
- source_word: πιστεύσαντες
  choice: 信了以后
  rationale: 将不定过去时分词理解为主要动词“受了……作为印记”之前的行动；“以后”清楚表达次序，但不额外界定圣灵受印与归信在教义上的精确时间关系。
- source_word: ἐσφραγίσθητε
  choice: 受了……作为印记
  rationale: 以自然中文保留被动受印的图像和被标记、确认为属神子民的含义；脚注同时给出更贴近字面的“被……盖上印”。
- source_word: τῷ πνεύματι τῆς ἐπαγγελίας τῷ ἁγίῳ
  choice: 所应许的圣灵
  rationale: 将压缩的属格短语理解为神所应许赐下的圣灵；中文自然明确，同时在脚注保留较形式对应的表达。
theological_decisions:
- issue: 听见、相信与受印之间的关系
  choice: “听见了……信了以后……受了……作为印记”
  alternative: “当你们听见……并相信时，就受了印”
  rationale: 两个不定过去时分词位于限定动词之前，适合表达先行或伴随的行动。正文呈现自然的先后次序，却不据此建立关于归信和领受圣灵之时间关系的宗派性体系。
- issue: 第二个ἐν ᾧ的归属
  choice: 保留为“你们也在他里面信了以后”
  alternative: 可理解为“你们信了以后，也在他里面受了印”
  rationale: 希腊语中该介词短语既可自然地与“信”相连，也处于受印陈述的框架之内。正文保留“在他里面”，不消除其联合于基督的含义；脚注提示句法上的可能理解。
- issue: “应许之灵”的含义
  choice: “所应许的圣灵”
  alternative: “应许的圣灵”或“与应许有关的圣灵”
  rationale: τῆς ἐπαγγελίας是压缩的属格表达，最自然地指神曾应许赐下的圣灵；同时不把它扩展为“保证应许的圣灵”等原文未明说的解释。
- issue: 圣灵与“受印”的关系
  choice: “受了所应许的圣灵作为印记”
  alternative: “被所应许的圣灵盖上了印”或“借着所应许的圣灵受了印”
  rationale: 与格可表达作为印记、媒介或施动关系。正文以“作为印记”贴合封印意象又避免过度限定句法，脚注保留其他可能表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“真理之道”“福音”“圣灵”“印记”保留重要的经文互文和神学意象；用分号梳理希腊长句，并保留原文两次“在他里面”，不以流畅为由删去其结构与张力。
