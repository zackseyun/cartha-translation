  to: 在他里面[a]，你们也听见了真理之道，就是你们得救的福音[b]；又在他里面信了以后，就受了所应许的圣灵[c]作为印记[d]。
  rationale: 修订仅处理安全且必要的语法和文体问题：以“又”对应后一个καί的连接功能，避免将其误读为第二个“也”；将属格短语压缩为自然的“你们得救的福音”；并校正脚注a对替代措辞的说明。修订保留原文两次“在他里面”、听见—相信—受印的表达次序，以及圣灵与受印关系的句法开放性。
