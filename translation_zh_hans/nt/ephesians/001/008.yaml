  yaml_path: translation/nt/ephesians/001/008.yaml
  text: which he lavished on us in all wisdom and insight[b][a],
translation:
  language: zh_hans
  text: 这恩典是他照着一切智慧和悟性，丰丰富富地赐给我们的。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他使这恩典丰丰富富地临到我们。”
    reason: lexical_alternative
  - marker: b
    text: “照着一切智慧和悟性”也可能指随着恩典赐给信徒的智慧和悟性，而不是神施恩的方式。
    reason: alternative_reading
lexical_decisions:
- source_word: ἧς
  choice: 这恩典
  rationale: 关系代词为阴性单数属格，回指第7节“他恩典的丰富”。汉语若直译为“这恩典的”不自然，因此明确承接为“这恩典”，使本节可独立理解，同时保留与上文的联系。
- source_word: ἐπερίσσευσεν
  choice: 丰丰富富地赐给
  rationale: 此处为不定过去时主动直说语气，在句中可作使动、及物理解，表达神使恩典充盈地临到我们。“丰丰富富地赐给”自然传达超量、洋溢的意味。
- source_word: εἰς ἡμᾶς
  choice: 赐给我们的
  rationale: εἰς 表示行动朝向接受者；结合“赐给”，自然表达恩典临到“我们”。
- source_word: ἐν πάσῃ σοφίᾳ καὶ φρονήσει
  choice: 照着一切智慧和悟性
  rationale: ἐν 在此可表达方式、范围或伴随情形。“照着”能自然修饰神丰厚施恩的行动，但希腊语结构也可能与赐给信徒的智慧和悟性相关，故以脚注保留歧义。
- source_word: σοφίᾳ
  choice: 智慧
  rationale: σοφία 的标准、清楚译法，既可指神的智慧，也可指所赐的智慧。
- source_word: φρονήσει
  choice: 悟性
  rationale: φρόνησις 指理解、洞察或审慎判断。“悟性”与“智慧”有所区分，又适合现代庄重语体。
theological_decisions:
- issue: “ἐν πάσῃ σοφίᾳ καὶ φρονήσει”所修饰的对象
  choice: 正文按较自然的汉语语序，将其读作神施恩的方式，即神照着一切智慧和悟性厚赐恩典；脚注明示句法上的另一可能。
  alternative: 这短语可指随着恩典赐给信徒的“一切智慧和悟性”。
  rationale: 希腊语允许该短语修饰神使恩典丰盛的行动，也可能与信徒所得之物相连。正文不能完全复制希腊语的附着歧义，因此采用自然而不过度解释的主读法，并在脚注保留另一读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“丰丰富富地赐给”传达 περισσεύω 的充盈意味；“智慧和悟性”保持两个近义词之间的区别。正文中的脚注标记均已出现，并按词汇替代与句法歧义分别说明。
