  naturalness: 修订句子保持现代庄重的普通话；“保证”比“凭据”更准确传达 ἀρραβών 作为预先赐下、担保未来完全实现之物，而不局限于“证据”。
  terminology: 保留“圣灵”“基业”“赎回”“荣耀”“颂赞”等稳定的圣经语域术语。“保证”对应 ἀρραβών；其“预先交付的一部分”的具体比喻意义在脚注中说明。
