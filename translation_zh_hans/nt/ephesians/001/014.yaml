revisions:
- from: 这圣灵是我们得基业的凭据，直到上帝赎回他所得的子民，使他的荣耀得着颂赞。
  to: 这圣灵是我们基业的保证[a]，为要赎回所拥有的产业[b]，使他的荣耀受到颂赞。
  rationale: 修订纠正了对两个 εἰς 短语的过度语义明确化，并以脚注保留“产业/子民”的解释张力。句中“他的荣耀”仍依上下文指上帝；关系代词所指的圣灵在独立经节中明示，属自然且不改变原意。
