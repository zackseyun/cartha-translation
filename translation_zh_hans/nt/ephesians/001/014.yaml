source:
  edition: SBLGNT
  text: ⸀ὅ ἐστιν ἀρραβὼν τῆς κληρονομίας ἡμῶν, εἰς ἀπολύτρωσιν τῆς περιποιήσεως, εἰς ἔπαινον τῆς δόξης αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/014.yaml
  text: who is the down payment of our inheritance, toward the redemption of the possession, to the praise of his glory.
translation:
  language: zh_hans
  text: 这圣灵是我们基业的保证[a]，为要赎回所拥有的产业[b]，使他的荣耀受到颂赞。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “保证”原指预先交付的一部分，用以保证其余部分日后会完全兑现。
    reason: 说明 ἀρραβών 的具体担保含义，避免将其误解为单纯的证据。
  - marker: b
    text: “所拥有的产业”所译原词可指所取得、归属的产业，也可在此语境中指属上帝的子民。
    reason: 保留 τῆς περιποιήσεως 的词义及所指范围，不将正文限定为单一解释。
lexical_decisions:
- source_word: ὅ
  choice: 这圣灵
  rationale: 关系代词承接上一节的“所应许的圣灵”；汉语明示先行词，可避免孤立经节中“他”所指不清，同时保留圣灵的位格性。
- source_word: ἀρραβών
  choice: 凭据
  rationale: 指预先交付、保证日后全部兑现之物；“凭据”在现代汉语中自然庄重，也表达圣灵既是已得之份又是未来基业的保证。
- source_word: κληρονομία
  choice: 基业
  rationale: 保留圣经语境中承受产业的意象，不窄化为一般的“遗产”。
- source_word: εἰς ἀπολύτρωσιν
  choice: 直到……赎回
  rationale: εἰς 表示凭据所指向的终点或目标；“直到”贴合圣灵作为保证持续至最终救赎的语境，不把短语仅处理成抽象目的。
- source_word: τῆς περιποιήσεως
  choice: 他所得的子民
  rationale: περιποίησις 可指所得之物、产业或属上帝的群体；结合旧约“特属的子民”背景及本句的赎回对象，正文采用自然且较明确的群体性表达，但原文存在词义张力。
- source_word: εἰς ἔπαινον τῆς δόξης αὐτοῦ
  choice: 使他的荣耀得着颂赞
  rationale: 传达目标意义，并以现代汉语自然表达“为要颂赞他的荣耀”。
theological_decisions:
- issue: 圣灵作为ἀρραβών的性质
  choice: 凭据
  alternative: 定金；保证
  rationale: 避免把圣灵非人格化为纯粹款项，同时保留已经赐下的一部分保证将来完全实现这一神学张力。
- issue: τῆς περιποιήσεως的所指
  choice: 上帝所得的子民
  alternative: 所得之物；产业；我们完全归属上帝
  rationale: 所有格结构本身简练而有歧义。正文依据圣经中上帝取得并救赎其子民的惯用背景作语境化表达，但不将其解释为某一宗派特有教义。
- issue: 两处εἰς的功能
  choice: 分别译为时间终点“直到”和目的结果“使”
  alternative: 均译为“为要”或“为了”
  rationale: 汉语按各自语境区分表达，可呈现圣灵的凭据指向最终救赎，而整件救赎之工归于上帝荣耀受颂赞。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。句式延续以弗所书1:13的圣灵主题；“基业”“赎回”“荣耀”“颂赞”保留经文的救赎与敬拜语域。
