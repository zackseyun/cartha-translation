revisions:
- from: 他使这大能运行在弥赛亚[a]身上，使他从死人中复活，又使他在天上[b]坐在自己的右边。
  to: 这能力就是他在弥赛亚[a]身上所施行的：他使弥赛亚从死人中复活，又使他坐在天上[b]神的右边。
  rationale: 修订以“所施行的”准确、自然地表达ἐνήργηκεν，并保留关系代词对上文能力的承接。“使……复活，又使……坐在”继续以并列使动结构表达两个不定过去时分词，不强行限定其为纯时间或手段关系。将原文中指神的“他的右边”译为“神的右边”，仅为避免汉语反身指代歧义。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:52:01Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿总体准确传达神在弥赛亚身上施行能力、使其复活并高举的内容。但“使这大能运行”不够自然，且较弱地表达了ἐνήργηκεν（神实际施行／发挥这能力）；“在自己的右边”在汉语中可能暂时被理解为弥赛亚自己的右边。
  naturalness: 建议将关系从句改为“这能力就是他在弥赛亚身上所施行的”，这既自然地承接上文，也清楚表达神是施行者。以“神的右边”消除现代汉语中反身代词的歧义；这只是将上下文明确的指代显明出来，并未增加意义。
  terminology: “弥赛亚”符合此处Χριστός作为称号的用法，保留“基督”作脚注替译合宜。“属天的领域”可作为ἐν τοῖς ἐπουρανίοις的脚注说明；正文“天上”自然，但较为概括，脚注保留其范围性。
  issues:
  - severity: medium
    issue: “使这大能运行”表达不自然且未充分体现神施行能力。
    rationale: ἐνήργηκεν是以神为主语的有效行动；中文“使……运行”容易把“大能”处理成自主运行的对象，也不如“所施行的”自然。
  - severity: medium
    issue: “使他在天上坐在自己的右边”中“自己的”可能产生反身指代歧义。
    rationale: 原文αὐτοῦ指神；在现代汉语中，紧邻“他”的“自己的右边”可能被读作弥赛亚自己的右边。明确为“神的右边”能忠实消除汉语语法造成的歧义。
  revised_text: 这能力就是他在弥赛亚[a]身上所施行的：他使弥赛亚从死人中复活，又使他坐在天上[b]神的右边。
  revised_footnotes:
  - marker: a
    text: “弥赛亚”或译“基督”。
    reason: alternative_reading
  - marker: b
    text: “在天上”或译“在属天的领域”。
    reason: lexical_alternative
  revision_rationale: 修订以“所施行的”准确、自然地表达ἐνήργηκεν，并保留关系代词对上文能力的承接。“使……复活，又使……坐在”继续以并列使动结构表达两个不定过去时分词，不强行限定其为纯时间或手段关系。将原文中指神的“他的右边”译为“神的右边”，仅为避免汉语反身指代歧义。
