  text: ἣν ⸀ἐνήργηκεν ἐν τῷ Χριστῷ ἐγείρας αὐτὸν ⸀ἐκ νεκρῶν, καὶ ⸀καθίσας ἐν δεξιᾷ αὐτοῦ ἐν τοῖς ἐπουρανίοις
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/020.yaml
  text: which he worked in the Messiah when he raised him from the dead and seated him at his right hand in the heavenly places[b][a],
translation:
  language: zh_hans
  text: 这能力就是他在弥赛亚[a]身上所施行的：他使弥赛亚从死人中复活，又使他坐在天上[b]神的右边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”或译“基督”。
    reason: alternative_reading
  - marker: b
    text: “在天上”或译“在属天的领域”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν
  choice: 这大能
  rationale: 关系代词回指上文阴性名词所指的“大能”；汉语补出所指，使本节衔接清楚。
- source_word: ἐνήργηκεν
  choice: 使……运行
  rationale: 表达能力实际发挥作用、产生功效的含义，也保留神是行动主体。
- source_word: ἐν τῷ Χριστῷ
  choice: 在弥赛亚身上
  rationale: ἐν在此可表示神的大能以弥赛亚为作用对象和彰显所在；“弥赛亚”保留Χριστός在此的称号意味。
- source_word: ἐγείρας αὐτὸν ἐκ νεκρῶν
  choice: 使他从死人中复活
  rationale: 以自然汉语表达复活用语，并保留“从死人中”的群体背景。
- source_word: καὶ καθίσας
  choice: 又使他……坐
  rationale: 与前一分词并列，表达神使弥赛亚复活并使其就座的连续行动。
- source_word: ἐν δεξιᾷ αὐτοῦ
  choice: 在自己的右边
  rationale: 这是尊荣与权柄位置的惯用表达；用“自己的”明确反身所指为神。
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: 在天上
  rationale: 该名词化形容词复数指属天的范围或领域；“在天上”简洁自然，同时保留空间意味。
theological_decisions:
- issue: Χριστῷ作为称号还是近似专名
  choice: 弥赛亚
  alternative: 基督
  rationale: 本句谈论神使其复活并高举，称号意味鲜明；脚注保留传统音译。
- issue: ἐν τοῖς ἐπουρανίοις所指范围
  choice: 在天上
  alternative: 在属天的领域
  rationale: 原文是名词化的中性复数形容词，可指属天领域而未明说“地方”；正文采用自然汉语，脚注保留较形式对应的译法。
- issue: 两个不定过去时分词与主句的关系
  choice: 译作两个“使”字结构
  alternative: 译作“当他使……复活并使……坐下时”
  rationale: 分词可表达手段或伴随情形；中文用并列使动结构呈现大能如何运行，不将其关系限定为纯时间先后。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“使这大能运行”承接上文并保留原文能力实际发生功效的动态感；两个“使”字结构清楚呈现复活与高举，同时不过度判定分词的时间或手段关系。
