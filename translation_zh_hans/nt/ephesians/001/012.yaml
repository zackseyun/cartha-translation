id: EPH.1.12
reference: Ephesians 1:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰς τὸ εἶναι ἡμᾶς εἰς ἔπαινον δόξης αὐτοῦ τοὺς προηλπικότας ἐν τῷ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/012.yaml
  text: so that we who had already hoped in Messiah might be for the praise of his glory[a][b].
translation:
  language: zh_hans
  text: 好使他的荣耀因我们这些早已在弥赛亚里怀有盼望的人得着颂赞。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“最先在弥赛亚里怀有盼望的人”。
    reason: 原文可强调这群人是先有盼望或最先有盼望的人。
  - marker: b
    text: 较直译：“好使我们这些早已在弥赛亚里怀有盼望的人，成为对他荣耀的颂赞。”
    reason: 保留原文“成为……颂赞”的句法形式，供读者看见正文流畅表达背后的结构。
lexical_decisions:
- source_word: εἰς τὸ εἶναι
  choice: 好使……
  rationale: 介词εἰς与带冠词的不定式共同表达目的或结果；“好使”在现代汉语中自然地保留这种目的指向。
- source_word: ἡμᾶς
  choice: 我们这些……的人
  rationale: ἡμᾶς是不定式的逻辑主语；用“我们这些……的人”可让后面的分词短语清楚界定这里所说的“我们”。
- source_word: εἰς ἔπαινον δόξης αὐτοῦ
  choice: 使他的荣耀得着颂赞
  rationale: 这是符合现代汉语习惯的表达，保留“荣耀”和“颂赞”两个关键概念，也传达这群人的存在使神的荣耀受到颂赞这一目的或结果。
- source_word: τοὺς προηλπικότας
  choice: 预先……怀有盼望的人
  rationale: προ-表示时间上的在先，完成时分词又表明这盼望具有持续关联；“预先”不强行断定他们必然是最先盼望的一群人。
- source_word: ἐν τῷ Χριστῷ
  choice: 在弥赛亚里
  rationale: Χριστός在这里保留称号含义，译为“弥赛亚”；“在……里”也保留保罗原文中关系或联合层面的表达，而不将其简化为“盼望弥赛亚”。
theological_decisions:
- issue: προηλπικότας是泛指先前已有盼望，还是特指最先怀有盼望的一群人
  choice: 正文译作“预先……怀有盼望的人”
  alternative: “最先在弥赛亚里怀有盼望的人”
  rationale: 前缀προ-明确含有在先之意，但原文本身不足以完全确定是单纯指先前，还是指某一群体首先盼望；正文采用较审慎的译法，较强的群体性理解放入脚注。
- issue: εἰς ἔπαινον δόξης αὐτοῦ如何表达人的存在与神荣耀受颂赞之间的关系
  choice: 功能性地译为“使他的荣耀得着颂赞”
  alternative: 较贴近形式地译为“成为对他荣耀的颂赞”
  rationale: 原文并非直接命令“我们颂赞”，而是说“我们”的存在归向他荣耀的颂赞；正文避免把它改成单纯的人类行动，同时用自然汉语表达其目的或结果。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“怀有盼望”比单说“盼望”更适合完成时分词所表达的持续状态；“得着颂赞”保持经文语体的尊严，又能为普通读者理解。
