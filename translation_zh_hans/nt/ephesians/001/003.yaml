id: EPH.1.3
reference: Ephesians 1:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ εὐλογήσας ἡμᾶς ἐν πάσῃ εὐλογίᾳ πνευματικῇ ἐν τοῖς ἐπουρανίοις ἐν Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], who has blessed us with every spiritual blessing in the heavenly realms in Messiah[c][b],
translation:
  language: zh_hans
  text: 愿我们主耶稣弥赛亚[c]的上帝和父受颂赞！他已经在弥赛亚里，把天上的领域[b]中一切属灵的福分[a]赐给我们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一切与圣灵有关的福分。”希腊语形容词既可泛指“属灵的”，也可指“与圣灵有关的”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“天上的地方”。
    reason: lexical_alternative
  - marker: c
    text: “弥赛亚”意为“受膏者”，传统译作“基督”。本节下文的“在弥赛亚里”也是同一个希腊语称号。
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: 愿……受颂赞
  rationale: 这是用于颂赞上帝的表述。译作“愿……受颂赞”既保留祈愿式的庄重语气，也符合现代汉语敬拜用语。
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: 上帝和父
  rationale: 保留两个并列称谓及其共同所指，不将关系含义简化。
- source_word: κυρίου
  choice: 主
  rationale: 在此为耶稣的尊称，“主”符合新约语境和现代汉语惯用表达。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣弥赛亚
  rationale: “耶稣”作为名字音译；Χριστός在此保留其称号含义，译作“弥赛亚”。
- source_word: ὁ εὐλογήσας
  choice: 已经……赐给了我们
  rationale: 希腊语分词指上帝已经施行的赐福行动；汉语用“已经……赐给了”自然表达其完成且持续相关的意义。
- source_word: ἐν πάσῃ εὐλογίᾳ πνευματικῇ
  choice: 一切属灵的福分
  rationale: πάσῃ在这里表达各种、一切福分；“属灵的”保留πνευματικῇ可泛指灵性或特指圣灵所赐的语义宽度。
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: 天上领域中
  rationale: 这一以中性复数形容词名词化的独特表达指天上的范围或领域；“天上领域”自然且不过分具体化为空间地点。
- source_word: ἐν Χριστῷ
  choice: 在弥赛亚里
  rationale: 保留保罗书信中紧凑而重要的“在……里”表达，同时将Χριστός按称号译作“弥赛亚”。
theological_decisions:
- issue: Χριστός在保罗书信公式中的译法
  choice: 两处均译作“弥赛亚”
  alternative: 两处均译作“基督”
  rationale: 这里的称号意义仍然存在。“弥赛亚”直接传达“受膏者”称号所承载的犹太背景；脚注同时说明传统译法。
- issue: πνευματικῇ的所指
  choice: 属灵的
  alternative: 圣灵所赐的
  rationale: 该形容词既可泛指属灵性质，也可指与圣灵有关。正文采用范围较宽的译法，避免把原文未完全明说的所指单一化。
- issue: ἐν Χριστῷ所表达的关系
  choice: 在弥赛亚里
  alternative: 借着弥赛亚
  rationale: 直译“在……里”保留原文可能涉及联合、归属和行动范围的神学张力，不将其缩减为单纯工具关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。首句以颂赞祈愿式呈现原文的祝颂语气；后句保持“在弥赛亚里”的紧凑表达，并用脚注保留关键词的真实语义选择。
