revisions:
- from: 在他里面，我们也成了上帝的产业[a]；我们是照着那位按自己旨意所定的计划、使万事运行者的目的而被预定的。
  to: 在他里面，我们也成了上帝的产业[a]；我们是照着上帝的目的被预定的。上帝按自己旨意的筹划成就万事。
  rationale: 修订将原文的分词关系以两个清楚的汉语陈述表达：信徒成为上帝的产业，并按上帝的目的被预定；“成就万事”进一步说明这位上帝按自己旨意的筹划行事。此处理保留ἐκληρώθημεν的争议，未把脚注中的替代解读纳入正文，也没有增添特定神学体系。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:51:54Z'
review_pass:
  verdict: revise
  source_fidelity: 正文准确保留了“在他里面”、ἐκληρώθημεν的“成为上帝的产业”解读，以及“被预定”的被动意义；脚注也保留了“得了产业”的可行替代。不过，原译把“照着那位按自己旨意所定的计划、使万事运行者的目的”堆叠为多重修饰，较难明确看出“目的”属于那位成就万事者，并且“所定的计划”不够直接地表达“按自己旨意的筹划”。
  naturalness: 原句分号后的“我们是照着……的目的而被预定的”虽可理解，但定语链过长且“目的—计划—旨意”的关系不够清楚。将神作为先行词明示，并分成两个汉语分句，能保持原文逻辑而更自然清晰。
  terminology: “上帝”“产业”“被预定”“旨意”均合适。“成就万事”比“使万事运行”更直接对应ἐνεργῶν，且不额外限定其运作方式。“筹划”适切表达βουλή，并与“旨意”相区分。
  issues:
  - severity: medium
    issue: 后半句的修饰关系过度压缩
    rationale: “那位按自己旨意所定的计划、使万事运行者的目的”在现代汉语中难以立即辨明“目的”归属于谁，也模糊了“按……筹划”修饰“成就万事”的关系。
  - severity: low
    issue: “使万事运行”略带额外的宇宙运行意味
    rationale: ἐνεργέω意为施行、成就、作工；“成就万事”更宽泛，避免将其限缩为“运行”的意象。
