  text: ἐν ᾧ καὶ ἐκληρώθημεν προορισθέντες κατὰ πρόθεσιν τοῦ τὰ πάντα ἐνεργοῦντος κατὰ τὴν βουλὴν τοῦ θελήματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/011.yaml
  text: In him we also were made an inheritance[a], having been predestined according to the purpose of the one who works all things according to the counsel of his will,
translation:
  language: zh_hans
  text: 在他里面，我们也成了上帝的产业[a]；我们是照着上帝的目的被预定的。上帝按自己旨意的筹划成就万事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们也得了产业。”希腊语动词既可理解为得到产业，也可理解为被分配作上帝的产业。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: 在他里面
  rationale: 关系代词承接上文的基督；“在他里面”自然表达与基督联合的含义。
- source_word: ἐκληρώθημεν
  choice: 我们也成了上帝的产业
  rationale: 被动形式可指被分配为产业，即成为上帝所得的子民；补出“上帝的”使汉语语义完整，同时以脚注保留“得了产业”的可能解释。
- source_word: προορισθέντες
  choice: 被预定
  rationale: 表达事先决定之意，同时不把特定神学体系带入经文。
- source_word: κατὰ πρόθεσιν
  choice: 照着……目的
  rationale: πρόθεσις指有意图的目的或筹划；“目的”贴近词义，并与下文“计划”有所区分。
- source_word: τοῦ τὰ πάντα ἐνεργοῦντος
  choice: 那位……使万事运行者
  rationale: 保留上帝为主动者及τὰ πάντα的全面范围；“使万事运行”自然表达ἐνεργέω的施行、运作之意。
- source_word: κατὰ τὴν βουλὴν τοῦ θελήματος αὐτοῦ
  choice: 按自己旨意所定的计划
  rationale: βουλή含审慎决定、筹划之意；此译保留它与θέλημα“旨意”的属格关系，并符合现代汉语表达。
theological_decisions:
- issue: ἐκληρώθημεν的含义
  choice: 信徒成为上帝的产业，即归他所得的子民。
  alternative: 信徒得了产业。
  rationale: 该动词的被动形式容许两种理解；旧约中上帝子民是他产业的背景支持正文译法，但“得产业”也有充分的语言依据，因此用脚注保留，不消除经文的真实歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“产业”保留圣经传统中的承受与归属意象；句法稍作调整，以免多层修饰在汉语中产生歧义。
