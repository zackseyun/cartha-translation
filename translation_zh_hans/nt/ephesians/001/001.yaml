  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ τοῖς ἁγίοις τοῖς οὖσιν ⸂[ἐν Ἐφέσῳ]⸃ καὶ πιστοῖς ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/001.yaml
  text: 'Paul[a], an apostle of Messiah Jesus by the will of God[c][b], to the saints who are [in Ephesus] and faithful in Messiah Jesus:'
translation:
  language: zh_hans
  text: 奉上帝旨意作弥赛亚耶稣使徒的保罗，写信给那些在[以弗所][a]的圣徒和在弥赛亚耶稣里忠信的人[b]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些早期抄本没有“在以弗所”这几个词。因此，有人认为这封信原本可能供较广范围的众教会传阅，而不只写给以弗所的教会。
    reason: textual_variant
  - marker: b
    text: “忠信的人”也可译作“信徒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστολος
  choice: 使徒
  rationale: 此处是保罗蒙差遣之职分与权柄的称谓；“使徒”保留其早期基督教语境中的专门含义。
- source_word: Χριστοῦ Ἰησοῦ
  choice: 弥赛亚耶稣的
  rationale: Χριστός在此仍具有称号意味；译作“弥赛亚”比音译称谓“基督”更直接传达“受膏者”的身份。
- source_word: διὰ θελήματος θεοῦ
  choice: 奉上帝旨意
  rationale: διά加属格在此表示保罗受差遣所依据的神圣旨意与授权；“奉上帝旨意”自然、庄重，也符合中文书信起首语序。
- source_word: ἁγίοις
  choice: 圣徒
  rationale: 指分别归给上帝的群体，而非少数具有特殊功德的人；“圣徒”是简洁且通行的群体称谓。
- source_word: τοῖς οὖσιν
  choice: 那些……的
  rationale: 该结构用于界定收信人；中文不机械译出“存在”，而以关系从句自然表达。
- source_word: '[ἐν Ἐφέσῳ]'
  choice: '[在以弗所]'
  rationale: 依照所给希腊文本保留方括号，明确显示这几个词存在抄本疑问。
- source_word: πιστοῖς
  choice: 忠信的人
  rationale: πιστός既可指忠诚可靠，也可指相信的人；正文用“忠信”保留其形容性的忠诚含义，并在脚注列出“信徒”这一可行理解。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: 在弥赛亚耶稣里
  rationale: 保留ἐν的联合与归属表达，不将其弱化为单纯的“信奉”；“在……里”也承接保罗书信中的重要关系性措辞。
theological_decisions:
- issue: 保罗书信问安语中Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处Χριστός与“耶稣”连用，但称号意味仍清楚；“弥赛亚”直接传达受膏君王的身份，同时不把称号默认为姓名的一部分。
- issue: ἐν Ἐφέσῳ的文本地位
  choice: 在正文中以方括号保留“在以弗所”
  alternative: 省略“在以弗所”
  rationale: 若干早期重要抄本没有这几个词。正文依所给SBLGNT形式保留但加括号，脚注说明异文，不暗中裁定。
- issue: πιστοῖς的语义
  choice: 忠信的人
  alternative: 信徒
  rationale: 该词可表达忠信，也可表达相信者的身份；正文选择前者以保存形容词色彩，脚注保留后者，避免过度消解歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书信体。中文按自然语序先交代保罗的身份，再说明收信人；保留“在弥赛亚耶稣里”这一具有保罗书信特色的关系表达。所有文本异文和词义歧义均在正文标记或脚注中保留。
