  text: εἰς ἔπαινον δόξης τῆς χάριτος αὐτοῦ ⸀ἧς ἐχαρίτωσεν ἡμᾶς ἐν τῷ ἠγαπημένῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/006.yaml
  text: to the praise of the glory of his grace[a], with which he has favored us in the Beloved[b],
translation:
  language: zh_hans
  text: 为要使他恩典的荣耀得到颂赞，他在蒙爱的那一位[b]里，以这恩典恩待了我们[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以这恩典恩待了我们”也可译作“将这恩典赐给了我们”或“施恩给了我们”。“恩待”所译的希腊语动词与“恩典”同源，强调上帝以恩典待我们。
    reason: lexical_alternative
  - marker: b
    text: “蒙爱的那一位”指上帝所爱的那一位，即基督；原文在本节没有明说“儿子”。
    reason: cross_reference
lexical_decisions:
- source_word: εἰς ἔπαινον
  choice: 使……得到颂赞
  rationale: εἰς在这里表示目的或结果；这一译法在现代汉语中自然地表达“归于颂赞”的含义。
- source_word: δόξης τῆς χάριτος αὐτοῦ
  choice: 他恩典的荣耀
  rationale: 保留“荣耀”与“恩典”之间的属格结构，不径直化解为“荣耀的恩典”，从而保存原文可能表达“恩典所显出的荣耀”或“荣耀无比的恩典”的张力。
- source_word: ἧς ἐχαρίτωσεν ἡμᾶς
  choice: 他……以这恩典恩待了我们
  rationale: ἧς回指“恩典”，ἐχαρίτωσεν与χάρις同源；“以这恩典恩待”既表达赐予恩惠的行动，也尽量保留原文同源词的呼应。
- source_word: ἐν
  choice: 在……里
  rationale: 采用该介词最基本的空间或领域表达，不预先限定为“借着”或“与……联合”，以保留其神学含义的丰富性。
- source_word: τῷ ἠγαπημένῳ
  choice: 蒙爱的那一位
  rationale: 原文是作名词使用的完成时被动分词，指向基督，却未在本节明说“儿子”；这一译法保留其称号性质和被爱者的含义。
theological_decisions:
- issue: χάρις与χαριτόω的同源联系
  choice: 以这恩典恩待了我们
  alternative: 将这恩典赐给了我们；施恩给了我们
  rationale: 原文有意并用“恩典”及其同源动词。正文以“恩典—恩待”再现这一联系，同时避免不自然的“以恩典使我们有恩”。
- issue: τῷ ἠγαπημένῳ所指的基督论含义
  choice: 蒙爱的那一位
  alternative: 爱子；他所爱的那一位
  rationale: 该称号在语境中指基督，但本节本身没有明说“儿子”。正文不增补原文没有的亲属称谓，并由脚注说明所指。
- issue: δόξης τῆς χάριτος的属格关系
  choice: 他恩典的荣耀
  alternative: 他荣耀的恩典
  rationale: 较形式地保留属格关系，避免只采用性质属格的理解；脚注列出自然且常见的另一种分析。
translation_notes:
  register: 采用现代、庄重而可理解的普通话。“恩典—恩待”保留希腊语同源词呼应；“蒙爱的那一位”稍具称号色彩，但仍属自然现代汉语。分号显示目的短语与解释其“恩典”的关系从句之间的层次。
