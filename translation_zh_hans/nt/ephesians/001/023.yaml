  yaml_path: translation/nt/ephesians/001/023.yaml
  text: which is his body[b][a], the fullness of the one who fills all things in all.
translation:
  language: zh_hans
  text: 教会是他的身体，是那位在万有中充满万有者[a]的丰满[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在万有中充满万有者”也可理解为“在万有中正被充满的那位”；原文分词在形态上可作中间／被动理解，但此处通常按主动意义理解。
    reason: alternative_reading
  - marker: b
    text: “丰满”也可译作“充满”或“完满”。原文未明确说明教会是那位的“丰满”这一表达具体指被他充满，还是在某种意义上与他的完满有关。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥτις
  choice: 这教会
  rationale: 关系代词回指第22节的“教会”。中文补出所指对象，比直译为“她”或“它”更自然，也不削弱其承接作用。
- source_word: τὸ σῶμα αὐτοῦ
  choice: 他的身体
  rationale: 保留保罗用“身体”描述教会与基督关系的核心比喻。
- source_word: τὸ πλήρωμα
  choice: 完满
  rationale: “完满”保留 πλήρωμα 所表达的丰满、充盈或完成状态，同时避免直接解释为“被充满的”，从而保留原文在教会与基督之关系上的张力。
- source_word: τοῦ ... πληρουμένου
  choice: 那位……充满……者
  rationale: 该现在分词形态上可作中间或被动理解，但上下文较自然地支持主动意义“充满者”；被动理解保留在脚注中。
- source_word: τὰ πάντα
  choice: 万有
  rationale: 用“万有”表达中性复数的宇宙性、全包性范围，比单说“一切”更清楚地指向所有受造存在。
- source_word: ἐν πᾶσιν
  choice: 在万有中
  rationale: 贴近原文压缩而含混的“在一切中”，不把它限定为“在所有人中”或解释成“以各种方式”。
theological_decisions:
- issue: πλήρωμα 如何描述教会与基督的关系
  choice: 译作“完满”，不进一步说明教会是基督所充满的，还是在某种意义上作为他的补足或完满。
  alternative: 译作“被他充满的”或“使他完满的”。
  rationale: 原文措辞神学含义浓厚且存在真实歧义；名词性译法能避免把某一种解释写入正文。
- issue: πληρουμένου 的语态和意义
  choice: 按主动意义译为“充满万有者”。
  alternative: 按被动意义译为“正被充满的那位”。
  rationale: 尽管该分词在形态上属于中间/被动语态，结合宾语性短语 τὰ πάντα 及上下文，主动或类中间意义更为顺畅；脚注保留被动可能。
- issue: ἐν πᾶσιν 的范围
  choice: 译为“在万有中”，保留其形式上的宽泛与含混。
  alternative: 译为“以各种方式”或“在所有人中”。
  rationale: 原文未明确限定 πᾶσιν 指方式、事物还是人，因此不在正文中缩窄其范围。
translation_notes:
  register: 采用庄重而可理解的现代书面语。“万有”承载保罗语境中的宇宙性范围；“完满”虽略具抽象色彩，却能保留 πλήρωμα 的名词形式和神学张力。脚注标记均置于其所说明的正文词语之后。
