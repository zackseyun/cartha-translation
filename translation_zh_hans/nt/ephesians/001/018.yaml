source:
  edition: SBLGNT
  text: πεφωτισμένους τοὺς ὀφθαλμοὺς τῆς καρδίας ὑμῶν εἰς τὸ εἰδέναι ὑμᾶς τίς ἐστιν ἡ ἐλπὶς τῆς κλήσεως αὐτοῦ, ⸀τίς ὁ πλοῦτος τῆς δόξης τῆς κληρονομίας αὐτοῦ ἐν τοῖς ἁγίοις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/018.yaml
  text: having the eyes of your heart enlightened[a], so that you may know what is the hope of his calling, what is the wealth of the glory of his inheritance among the saints[b],
translation:
  language: zh_hans
  text: 使你们心中的眼睛得蒙光照，以便你们知道：他的呼召所带来的盼望是怎样的盼望，他在圣徒中的基业的荣耀何等丰富[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “丰富”也可译为“财富”。
    reason: 词汇替代：πλοῦτος可指丰富、富足或财富。
  - marker: b
    text: “他在圣徒中的基业”也可理解为“他在圣徒身上所得的基业”，或“他赐给圣徒的基业”。
    reason: 原文的属格和介词短语容许不同理解：基业可能指神以圣徒为自己的产业，也可能指神赐给圣徒的产业。
lexical_decisions:
- source_word: πεφωτισμένους
  choice: 已经蒙了光照
  rationale: 保留完成时被动分词所表达的既成行动及其持续结果，也明确光照是领受的，而非人自行获得的。
- source_word: τοὺς ὀφθαλμοὺς τῆς καρδίας ὑμῶν
  choice: 你们心里的眼睛
  rationale: 保留“心的眼睛”这一鲜明隐喻，不将其解释性地简化为“悟性”或“心智”。“心里的眼睛”比“心眼”更庄重，也较少引发现代汉语中的其他联想。
- source_word: εἰς τὸ εἰδέναι ὑμᾶς
  choice: 好让你们知道
  rationale: 以自然现代汉语表达该不定式结构的目的意味。
- source_word: ἡ ἐλπὶς τῆς κλήσεως αὐτοῦ
  choice: 他的呼召带来怎样的盼望
  rationale: “他的呼召”保留保罗的神学用语；加入“带来”使属格关系在汉语中自然，同时不把呼召仅限定为过去的动作。
- source_word: ὁ πλοῦτος τῆς δόξης
  choice: 何等丰盛的荣耀
  rationale: πλοῦτος在此强调荣耀的丰富、充盈程度；译为“丰盛的荣耀”比逐字的“荣耀的财富”更符合现代汉语，同时保留数量与价值上的充盈感。
- source_word: τῆς κληρονομίας αὐτοῦ
  choice: 他的基业
  rationale: “基业”保留圣经语境中产业、承受之份的内涵；“他的”不强行判定这是神所拥有的产业，还是神所赐的产业。
- source_word: ἐν τοῖς ἁγίοις
  choice: 在圣徒中
  rationale: 保留ἐν可表示“在……中”或“在……身上”的空间及群体性张力；“圣徒”准确保留保罗对属神群体的称呼。
theological_decisions:
- issue: “他在圣徒中的基业”究竟指神以圣徒为自己的产业，还是神赐给圣徒的产业
  choice: 他在圣徒中的基业
  alternative: 他在圣徒身上所得的基业；他赐给圣徒的基业
  rationale: 希腊文αὐτοῦ的属格和ἐν τοῖς ἁγίοις并未明确排除任何一种理解。正文采用较开放的表达，脚注列出主要理解，避免替原文消除神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“心里的眼睛”“呼召”“圣徒”“基业”等关键圣经意象和术语；通过“带来”和“具有”使密集的希腊文属格结构在汉语中顺畅。
