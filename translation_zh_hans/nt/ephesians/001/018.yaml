  rationale: 修订使汉语表达更自然，并更紧密对应原文的完成时被动分词、目的结构和“荣耀的丰富”这一连续属格表达。正文仍以“他在圣徒中的基业”保留原文关于基业归属及ἐν τοῖς ἁγίοις的歧义；脚注列出可行理解而不裁定其神学含义。
