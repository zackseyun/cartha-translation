  text: προορίσας ἡμᾶς εἰς υἱοθεσίαν διὰ Ἰησοῦ Χριστοῦ εἰς αὐτόν, κατὰ τὴν εὐδοκίαν τοῦ θελήματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/005.yaml
  text: having predestined us for adoption through Jesus the Messiah to himself[a], according to the good pleasure of his will[c][b],
translation:
  language: zh_hans
  text: 他照着自己旨意中的美意，预定我们借着耶稣弥赛亚[c]得儿子的名分[a]，归向他自己[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被收养”或“被收纳为儿子”。原词指被置于儿子的身份，着重于法律地位和承受产业的权利；这里所说的身份适用于所有信徒。
    reason: lexical_alternative
  - marker: b
    text: 或译“为他自己”；原文既可表示归向他，也可带有为了他自己的目的意味。
    reason: lexical_alternative
  - marker: c
    text: 传统译作“耶稣基督”。“弥赛亚”翻译了希腊语Χριστός这一称号，意思是“受膏者”。
    reason: alternative_reading
lexical_decisions:
- source_word: προορίσας
  choice: 预先定下
  rationale: 保留 προορίζω“预先决定、预定”的明确时间与决定含义，同时以分词所表达的附属动作承接本段较长的颂赞句，不扩展为任何完整的预定论体系。
- source_word: εἰς υἱοθεσίαν
  choice: 被收纳为儿子
  rationale: υἱοθεσία 指被置于儿子的法律身份，兼有收养和承受产业的意味。“被收纳为儿子”比单说“被收养”更能保留原词的身份色彩；脚注说明其适用于所有信徒。
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: 借着耶稣弥赛亚
  rationale: διά 加属格表示媒介或施行途径；Χριστός 在此作为称号，译为“弥赛亚”，而不是当作普通姓名成分。
- source_word: εἰς αὐτόν
  choice: 归于他自己
  rationale: 保留 εἰς 的趋向含义和语境中的反身指向；该短语也可能带有“为他自己”的目的意味，故在脚注中保留另一译法。
- source_word: κατὰ τὴν εὐδοκίαν τοῦ θελήματος αὐτοῦ
  choice: 照着自己旨意中的美意
  rationale: κατά 表示“按照”；εὐδοκία 可指喜悦、恩惠性的意愿或美意。“旨意中的美意”在现代汉语中自然庄重，也不把 θέλημα 另行解释成更具体的神学概念。
theological_decisions:
- issue: 在教义争议语境中如何翻译 προορίσας
  choice: 预先定下
  alternative: 预先决定；预定
  rationale: 原文明确使用 προορίζω，因此保留“预先”和“定下”的词义力度，不为追求宗派中立而淡化，也不借译文规定其完整神学机制。
- issue: υἱοθεσία 的性别与法律身份意味
  choice: 被收纳为儿子
  alternative: 被收养；得儿子的名分
  rationale: 保留原词中“儿子”的性别形式及其法律继承身份；脚注同时澄清，这一身份在上下文中并非只给男性。
- issue: Χριστοῦ 的称号性质
  choice: 弥赛亚
  alternative: 基督
  rationale: Χριστός 是“受膏者”的希腊语称号，与“弥赛亚”相应；译出称号意义，而不将其仅作为耶稣姓名的一部分。
- issue: εἰς αὐτόν 的趋向或目的含义
  choice: 归于他自己
  alternative: 为他自己
  rationale: 正文采用较直接的趋向理解，但原文 εἰς 也可表达目的，因此不在正文中排除“为他自己”的理解。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“预先定下”避免过度术语化却保留原文力度；“被收纳为儿子”略具法律身份色彩，借脚注补足现代读者可能不熟悉的继承含义。语序将“照着自己旨意中的美意”前置，使汉语流畅，同时未改变其修饰预先定下这一行动的关系。
