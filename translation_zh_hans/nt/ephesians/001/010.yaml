id: EPH.1.10
reference: Ephesians 1:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἰς οἰκονομίαν τοῦ πληρώματος τῶν καιρῶν, ἀνακεφαλαιώσασθαι τὰ πάντα ἐν τῷ Χριστῷ, τὰ ἐπὶ τοῖς οὐρανοῖς καὶ τὰ ἐπὶ τῆς γῆς· ἐν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/010.yaml
  text: for the administration of the fullness of the times[a], to sum up all things in the Messiah—the things in the heavens and the things on the earth—in him,
translation:
  language: zh_hans
  text: 为着在所定的时期满足时所施行的安排，使万有都在弥赛亚里归于一体[a]，无论天上的、地上的，都在他里面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在弥赛亚里把万有总括起来”；也可理解为“使万有归于弥赛亚这一位元首之下”。希腊语动词可含总括、汇聚或归于一个元首之下的意思。
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκονομίαν
  choice: 施行他的安排
  rationale: 该词在这里指有秩序的经营、实施或安排；用动词性表达贴合汉语，也避免把意义收窄为抽象的“计划”。
- source_word: τοῦ πληρώματος τῶν καιρῶν
  choice: 在所定的时期成熟时
  rationale: καιροί 指合宜或所定的时期，πλήρωμα 表示达到充足、完满；“成熟时”比生硬的“时期的丰满”更自然，并保留时机达到完满的含义。
- source_word: ἀνακεφαλαιώσασθαι
  choice: 归于一体
  rationale: 该动词可指总括、汇聚，也可能带有归于一个元首之下的意味；正文采用自然且不过度限定的表达，另一层含义留在脚注。
- source_word: τὰ πάντα
  choice: 万有
  rationale: 中性复数涵盖一切受造范围；“万有”在庄重的现代汉语中简洁地保留宇宙性范围。
- source_word: ἐν τῷ Χριστῷ
  choice: 在弥赛亚里
  rationale: Χριστός 在此具有称号功能；“弥赛亚”明确传达“受膏者”的称号意义。
- source_word: τὰ ἐπὶ τοῖς οὐρανοῖς καὶ τὰ ἐπὶ τῆς γῆς
  choice: 无论天上的、地上的
  rationale: 简洁保留天上与地上的对举及其包举性。
- source_word: ἐν αὐτῷ
  choice: 都在他里面
  rationale: 保留原文末尾对“在他里面”的重复和强调，代词自然回指弥赛亚。
theological_decisions:
- issue: ἀνακεφαλαιώσασθαι 的含义
  choice: 使万有都在弥赛亚里归于一体
  alternative: 在弥赛亚里把万有总括起来；使万有归于弥赛亚这一位元首之下
  rationale: 原词兼有总括、汇聚以及可能的“归于头之下”色彩。正文不把它单限定为行政上的元首关系，脚注则保留词义张力。
- issue: Χριστῷ 的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 这里该词作为称号使用，“弥赛亚”较直接显明其称号性质。
- issue: ἐν Χριστῷ 与末尾 ἐν αὐτῷ 的重复
  choice: 两处都明确翻出
  alternative: 省略末尾重复以求简练
  rationale: 重复是原文结构和强调的一部分，可能同时表达万有归一的范围与所在，因此予以保留。
translation_notes:
  register: 采用现代、庄重而可理解的普通话。“施行他的安排”以汉语动词结构承接 οἰκονομία；“所定的时期成熟时”避免直译腔，同时保留多个合宜时期达到完满的时间观。“万有”“在他里面”保留经文的宇宙性和神学分量。
