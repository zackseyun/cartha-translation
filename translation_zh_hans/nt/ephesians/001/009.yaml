revisions:
- from: 他使我们知道他旨意的奥秘；这是照着他的美意，就是他在他里面预先定下的[a]。
  to: 他使我们知道他旨意的奥秘，是照着他的美意；这美意是他在他里面所定意的[a]。
  rationale: 修订删除“预先”，避免将προέθετο译得超过原文所明示的程度；并将关系从句明确回指“美意”，使汉语句法更自然。正文仍保留“在他里面”，脚注继续呈现其可能指基督或反身指神自己的解释分歧。
