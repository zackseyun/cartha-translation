  naturalness: 原文“他在他里面预先定下的”在现代汉语中重复且指代不清，读起来较为拗口。将关系从句明确连接回“美意”，可改善句法可读性，同时不消除原文歧义。
  terminology: “奥秘”“旨意”“美意”均合乎保罗书信语域，也准确保留神学词汇的密度。“定意”比“预先定下”更贴近προέθετο在此处的筹划／定意含义，且避免与预定论术语发生不必要的强化关联。
