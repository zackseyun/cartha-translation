  text: γνωρίσας ἡμῖν τὸ μυστήριον τοῦ θελήματος αὐτοῦ, κατὰ τὴν εὐδοκίαν αὐτοῦ ἣν προέθετο ἐν αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/009.yaml
  text: having made known to us the mystery of his will[a], according to his good pleasure, which he purposed in himself
translation:
  language: zh_hans
  text: 他使我们知道他旨意的奥秘，是照着他的美意；这美意是他在他里面所定意的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在他里面”或指“在基督里面”；也有人把这里的“他”理解为反身用法，意为“在自己里面”。
    reason: 说明ἐν αὐτῷ所指对象的真实歧义，避免正文武断选定基督或神自己。
lexical_decisions:
- source_word: γνωρίσας
  choice: 使我们知道
  rationale: 该词是简单过去时主动分词，承接上文并说明神所做的事。中文若机械译成分词结构会显得生硬，因此用“使……知道”自然表达“使人知晓、显明”的含义，同时保留与上文的从属关系感。
- source_word: ἡμῖν
  choice: 我们
  rationale: 与“使……知道”组成兼语结构，准确表达间接受词“向我们／使我们知道”。
- source_word: μυστήριον
  choice: 奥秘
  rationale: 在保罗书信中，该词指先前隐藏、如今由神显明的旨意；“奥秘”既保留隐藏性，也不暗示它永远不可知。
- source_word: τοῦ θελήματος αὐτοῦ
  choice: 他旨意的
  rationale: 直译其属格关系；“旨意”比“愿望”更符合这里神主动计划和意愿的语境，也避免与后面的“预先定下”混同。
- source_word: κατὰ τὴν εὐδοκίαν αὐτοῦ
  choice: 照着他的美意
  rationale: κατά加宾格表示准则或一致性；“照着”自然表达这一关系。“美意”兼具良善意愿与所喜悦之意，符合εὐδοκία的语义范围。
- source_word: ἣν προέθετο
  choice: 就是他……预先定下的
  rationale: 关系代词ἣν回指阴性名词εὐδοκίαν。“就是”使中文读者清楚后句进一步说明“美意”；“预先定下”表达προτίθεμαι在此处筹定、立意的含义。
- source_word: ἐν αὐτῷ
  choice: 在他里面
  rationale: 原文只用第三人称代词，所指可能是基督，也有人将其理解为反身指神自己。正文保留代词形式，不擅自消除这一释义张力，并以脚注说明。
theological_decisions:
- issue: ἐν αὐτῷ所指为何
  choice: 正文译作“在他里面”，保留原文第三人称代词
  alternative: “在基督里面”或“在自己里面”
  rationale: 上下文频繁出现“在基督里”的观念，因此可理解为指基督；但也可将该短语理解为反身地指神自己。正文不替读者裁定，脚注列出两种主要理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“奥秘”“旨意”“美意”保留经文的神学密度；以分号划分“显明奥秘”与“照着美意”两层意思。为保留原文代词歧义，正文中的“他在他里面”虽略有重复，但脚注随即澄清其缘由。
