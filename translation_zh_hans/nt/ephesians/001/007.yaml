  text: ἐν ᾧ ἔχομεν τὴν ἀπολύτρωσιν διὰ τοῦ αἵματος αὐτοῦ, τὴν ἄφεσιν τῶν παραπτωμάτων, κατὰ ⸂τὸ πλοῦτος⸃ τῆς χάριτος αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/007.yaml
  text: In him we have redemption through his blood[a], the forgiveness of trespasses[b], according to the riches of his grace
translation:
  language: zh_hans
  text: 在他里面[a]，我们借着他的血得蒙救赎，就是过犯得蒙赦免[b]，照着他恩典的丰盛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在他里面的那一位里面。”
    reason: lexical_alternative
  - marker: b
    text: “过犯”也可译作“过错”或“违犯”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: 在他里面
  rationale: 关系代词指向上一节的“爱子”；“在他里面”在现代汉语中自然，并保留保罗书信中与基督联合的空间性表达。
- source_word: ἔχομεν
  choice: 我们……得了
  rationale: 表达现在已经拥有的现实；汉语用“得了救赎”比“拥有救赎”更自然，同时不把时态理解为仅限过去。
- source_word: ἀπολύτρωσιν
  choice: 救赎
  rationale: 保留该词借代价获得释放的含义及其在保罗书信中的神学分量。
- source_word: διὰ τοῦ αἵματος αὐτοῦ
  choice: 借着他的血
  rationale: διά加属格表示途径或凭借；直译“血”以保留献祭、死亡和圣约意象，不改写为“死亡”。
- source_word: τὴν ἄφεσιν τῶν παραπτωμάτων
  choice: 就是过犯得蒙赦免
  rationale: 第二个宾格短语与“救赎”同位；加入“就是”使汉语关系清楚，但不把二者的全部神学关系扩展为经文未明说的解释。
- source_word: παραπτωμάτων
  choice: 过犯
  rationale: 指偏离正道所造成的过错或冒犯；“过犯”简洁、庄重，也比“罪过”更能保持与一般罪词的词汇区别。
- source_word: κατὰ τὸ πλοῦτος
  choice: 照着……丰盛
  rationale: κατά加宾格表示准则或尺度；“照着”保留恩典的丰盛作为施予尺度，而非仅表示来源。SBLGNT所印τὸ πλοῦτος虽呈性别不一致，语义仍为恩典的丰盛。
- source_word: χάριτος
  choice: 恩典
  rationale: “恩典”是现代汉语圣经语域中对保罗核心词χάρις最准确、也最易懂的对应，兼含不配得的恩惠与慷慨施予。
theological_decisions:
- issue: “救赎”与“过犯得蒙赦免”的关系
  choice: 以“就是”明确同位说明
  alternative: 保留并列形式：“救赎，过犯得蒙赦免”
  rationale: 希腊文第二个带冠词的宾格短语最自然地与“救赎”同位。汉语若完全照排容易被误读为两个并列项目，因此用“就是”显明语法关系，但不进一步断言赦免穷尽了救赎的一切含义。
- issue: “借着他的血”的赎罪意象
  choice: 保留具体的“血”
  alternative: 译作“借着他的死”或“借着他的牺牲”
  rationale: 原文明确使用“血”，兼具献祭、生命与死亡的意象；改为“死”会缩窄并解释原文。
- issue: “照着他丰盛的恩典”的尺度含义
  choice: 用“照着”表达准则或尺度
  alternative: 译作“出于他丰盛的恩典”
  rationale: κατά在此不仅说明来源，也表明救赎与赦免与神恩典的丰盛相称；“照着”更完整地保留这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“在他里面”“借着他的血”“恩典”等保留保罗原文的重要意象和术语；用分号整理长句节奏。所有脚注标记均置于对应正文词组之后。
