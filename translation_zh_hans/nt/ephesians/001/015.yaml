id: EPH.1.15
reference: Ephesians 1:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Διὰ τοῦτο κἀγώ, ἀκούσας τὴν καθ’ ὑμᾶς πίστιν ἐν τῷ κυρίῳ Ἰησοῦ καὶ τὴν ⸂ἀγάπην τὴν⸃ εἰς πάντας τοὺς ἁγίους,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/015.yaml
  text: For this reason[a], I also, having heard of your faith in the Lord Jesus and your love for all the saints[b],
translation:
  language: zh_hans
  text: 因此，我也听说了你们在主耶稣里的信心[a]，以及你们对所有圣徒的爱[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信心”也可译作“信靠”；希腊词在某些语境中也可有“忠信”的意思。
    reason: lexical_alternative
  - marker: b
    text: 直译“向着所有圣徒的爱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: 因此
  rationale: 该短语承接前文，说明保罗下文回应的缘由；“因此”简洁自然地保留了推论和因由关系。
- source_word: κἀγώ
  choice: 我也
  rationale: κἀγώ是καί与ἐγώ的缩合，带有添加意味；“我也”既保留这一强调，又符合现代汉语表达。
- source_word: ἀκούσας
  choice: 听说了
  rationale: 该词为修饰保罗的简单过去分词。在汉语中用“听说了”自然表达先于后文主要动作发生的听闻，同时本节末尾保留逗号，与下一节的主要谓语相接。
- source_word: τὴν καθ’ ὑμᾶς πίστιν
  choice: 你们……的信心
  rationale: καθ’ ὑμᾶς指属于或见于受信者的信；译作“你们的信心”比机械地译为“在你们中间的信”更自然。
- source_word: πίστιν
  choice: 信心
  rationale: 在此指读者与主耶稣之间的信靠关系。“信心”是清楚且为普通读者熟悉的译法；“信靠”及“忠信”等可能语义在脚注中说明。
- source_word: ἐν τῷ κυρίῳ Ἰησοῦ
  choice: 在主耶稣里
  rationale: 保留ἐν的“在……里”及保罗书信中常见的联合性表达，不将其直接改释为“对主耶稣”。
- source_word: κυρίῳ
  choice: 主
  rationale: κύριος在这里是耶稣的称号；“主”保留其基督论分量，也符合现代中文圣经语体。
- source_word: ἀγάπην
  choice: 爱
  rationale: “爱”准确、自然地表达ἀγάπη，无须采用带有古旧或特殊宗教色彩的其他说法。
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: 对所有圣徒
  rationale: εἰς表示爱所指向的对象；“对”在现代汉语中自然表达这种方向。“所有”明确保留πάντας。
- source_word: ἁγίους
  choice: 圣徒
  rationale: 这里是保罗对信徒群体的惯常称呼。“圣徒”保留“分别为圣之人”的含义；上下文并不表示后来经特别册封的少数人。
theological_decisions:
- issue: πίστις在本节中的语义
  choice: 信心
  alternative: 信靠；忠信
  rationale: 与“在主耶稣里”连用时，主要指读者对主耶稣的相信和信靠。“忠信”属于该词可能具有的语义范围，但在此并非首选；脚注保留这种语义张力。
- issue: κύριος作为耶稣的称号
  choice: 主
  alternative: 主人
  rationale: “主”准确保留该称号在保罗语境中的神学分量；“主人”容易把含义缩窄为一般社会关系。
- issue: ἅγιοι所指的群体
  choice: 圣徒
  alternative: 圣洁的人；属上帝的圣洁子民
  rationale: “圣徒”保留保罗对全体信徒的群体称呼，不把它限制为经后世制度认定的特殊人物，也不在正文中加入原文未明说的“上帝的”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“在主耶稣里”保留保罗惯用表达；句末用逗号，因为本节的分词结构要到下一节才接上主要谓语。
