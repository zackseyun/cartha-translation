revisions:
- from: 也知道，他的能力向着我们这些信的人，是何等超越一切地浩大[a]；这是照着他大能大力的运行。
  to: 并且知道，他的能力向着我们这些信的人是何等浩大；这能力是照着他大能大力的运行。
  rationale: 删除“超越一切”，避免为ὑπερβάλλον补出原文未指明的比较对象；以“何等浩大”保留其强调。将“这是照着”改为“这能力是照着”，使κατά明确修饰“能力”。其余措辞及脚注均可保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:52:09Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿准确保留了本节承接前文祈求认识的结构、能力指向信的人（εἰς ἡμᾶς）、以及能力／运行／大能／力量的层叠。惟“超越一切”给ὑπερβάλλον补出了“超越所有事物”的明确比较对象，原文并未说明对象；“这是照着”则使“照着”的修饰关系略显松散。
  naturalness: “他的能力向着我们这些信的人，是何等超越一切地浩大”中“超越一切地浩大”不够自然。改为“他的能力向着我们这些信的人是何等浩大”是现代庄重汉语，且以“何等”表达原文的强调。将末句改为“这能力是照着……”可清楚显示κατά所修饰的是神的能力。
  terminology: 保留“能力／运行／大能／力量”来对应δύναμις／ἐνέργεια／κράτος／ἰσχύς，能呈现原文的修辞累积。“大能大力”虽是熟悉搭配，但会略压缩原文属格层次；“他大能的力量所运行的”不自然。因此保留“他大能大力的运行”作为通顺、庄重且可接受的表达。
  issues:
  - severity: medium
    issue: “超越一切”增添了未明言的比较对象。
    rationale: ὑπερβάλλον表达超越、卓越的强调，但没有明示“超越一切”。译文不宜把隐含的修辞强化固定为对所有事物的比较。
  - severity: low
    issue: “这是照着……”的指代和修饰关系稍松散。
    rationale: κατὰ τὴν ἐνέργειαν应说明神向信者所显的能力与其大能大力之运行相称；明确说“这能力是照着……”更清楚。
  revised_text: 并且知道，他的能力向着我们这些信的人是何等浩大；这能力是照着他大能大力的运行。
  revised_footnotes:
