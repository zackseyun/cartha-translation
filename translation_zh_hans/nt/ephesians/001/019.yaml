  text: καὶ τί τὸ ὑπερβάλλον μέγεθος τῆς δυνάμεως αὐτοῦ εἰς ἡμᾶς τοὺς πιστεύοντας κατὰ τὴν ἐνέργειαν τοῦ κράτους τῆς ἰσχύος αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/019.yaml
  text: and what is the surpassing greatness of his power toward us who believe[a], according to the working of the might of his strength
translation:
  language: zh_hans
  text: 并且知道，他的能力向着我们这些信的人是何等浩大；这能力是照着他大能大力的运行。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερβάλλον
  choice: 超越一切
  rationale: 该现在分词在此作形容词使用，表达超过、胜过之意；“超越一切”保留其比较和强调意味，又不把它强化为原文未必要求的“无法衡量”。
- source_word: μέγεθος
  choice: 浩大
  rationale: “浩大”自然地表达抽象名词所指的巨大程度，并与“超越一切”顺畅搭配。
- source_word: δύναμις
  choice: 能力
  rationale: 这是保罗书信中常见的用语，指实际有效的能力；译作“能力”也可与后面的“运行、大能、力量”相区分。
- source_word: εἰς ἡμᾶς
  choice: 向着我们
  rationale: εἰς在这里具有方向或指向的意味。“向着我们”最直接地保留原文介词的力度，不预先限定为内在运行或外在施恩。
- source_word: τοὺς πιστεύοντας
  choice: 我们这些信的人
  rationale: 现在分词在此名词化；“信的人”既自然，也比单纯译作“信徒”更明显地保留动词意味。
- source_word: κατά
  choice: 照着
  rationale: κατά表示相称、依据或对应关系；“照着”简明保留这一关系。
- source_word: ἐνέργεια
  choice: 运行
  rationale: 该词指有效发挥作用的活动；“运行”保留其主动而有功效的含义，并避免现代汉语中“能量”的物理学联想。
- source_word: κράτος
  choice: 大能
  rationale: 在这一连串近义词中，κράτος侧重彰显出来的强劲威力；“大能”既有庄重感，又能与“能力”和“力量”区分。
- source_word: ἰσχύς
  choice: 力量
  rationale: ἰσχύς常指力量或内在强度；“力量”是现代汉语中清楚自然的表达，并保留原文近义词的层叠。
- source_word: καὶ τί
  choice: 也知道……是何等
  rationale: 本节承接前文祷告内容，原文省略的认知性谓语须从上文补足；“也知道……是何等”在现代汉语中清楚自然。
theological_decisions:
- issue: 如何翻译δύναμις、ἐνέργεια、κράτος、ἰσχύς这一组能力用语
  choice: 分别译作“能力……运行……大能……力量”，保留层叠修辞。
  alternative: 合并为“他能力的充分彰显”等较简洁的说法。
  rationale: 原文有意堆叠相关但不完全相同的词，以强调上帝能力的浩大和功效；分别翻译可保留修辞张力，同时不把各词设定为专门的神学术语。
- issue: εἰς ἡμᾶς所表达的能力指向
  choice: 译作“向着我们这些信的人”。
  alternative: 译作“在我们这些信的人里面”或“为着我们这些信的人”。
  rationale: 原文使用εἰς而不是ἐν。“向着我们”最能保留方向性，也避免擅自判定这里专指信徒里面的内在运行或单指为信徒带来的益处。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“向着我们……是何等”略带原文结构的张力，旨在保留εἰς的方向性；以“能力、运行、大能、力量”呈现保罗连续使用近义词的强调效果。
