  text: ὑπεράνω πάσης ἀρχῆς καὶ ἐξουσίας καὶ δυνάμεως καὶ κυριότητος καὶ παντὸς ὀνόματος ὀνομαζομένου οὐ μόνον ἐν τῷ αἰῶνι τούτῳ ἀλλὰ καὶ ἐν τῷ μέλλοντι·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/021.yaml
  text: far above every rule and authority and power and dominion[a], and every name that is named[c][b], not only in this age but also in the one to come.
translation:
  language: zh_hans
  text: 远远超越一切统治、权柄、能力和主权[a]，以及一切被称呼的名号[b]，不但在今世，也在来世。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一切执政、掌权、有能和主治的权势。”这些希腊词可以指权力的类别、领域或等级，包括宇宙性或属灵的权势。
    reason: lexical_alternative
  - marker: b
    text: 或译：“一切被赋予的称号。”
    reason: lexical_alternative
  - marker: c
    text: 直译：“不但在这个世代，也在那将要来的世代。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπεράνω
  choice: 远远超越
  rationale: 既表达位置上的“在……之上”，也自然传达语境中的至高与超越。
- source_word: πάσης ἀρχῆς
  choice: 一切执政的
  rationale: 在此指具有统治地位或权柄者；采用名词化表达，保留其可能涵盖属灵或宇宙性权势的广度。
- source_word: ἐξουσίας
  choice: 掌权的
  rationale: 突出所拥有或施行的权柄，并与表示能力的 δύναμις 保持区别。
- source_word: δυνάμεως
  choice: 有能力的
  rationale: 保留力量、能力这一核心意义，同时顺应前后名词化类别的并列结构。
- source_word: κυριότητος
  choice: 居首位的
  rationale: 表达主权、统辖地位，又避免直接译作“主”而与神圣称号混淆。
- source_word: παντὸς ὀνόματος ὀνομαζομένου
  choice: 一切被称说的名号
  rationale: 保留“名—称名”的修辞联系，并使“名”可涵盖称号、地位或名分，而不将含义限定为某一种。
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: 不但……也……
  rationale: 自然对应希腊文的递进关联结构。
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: 在今世
  rationale: 保留 αἰών 的时代性含义，并与来世形成末世论对照。
- source_word: ἐν τῷ μέλλοντι
  choice: 在来世
  rationale: 补出希腊文省略但由上文可知的 αἰών，使现代汉语清楚自然。
theological_decisions:
- issue: ἀρχή、ἐξουσία、δύναμις、κυριότης所指权势的性质
  choice: 在正文中用宽泛的统治和权势类别表达，不明确限定为人间、天使或邪灵势力。
  alternative: 明确译成宇宙性权势或天使等级。
  rationale: 上下文很可能包含属灵或宇宙性的权势，但希腊文本身并未明说其本体类别；宽泛表达可保留原文的包容性与神学张力。
- issue: παντὸς ὀνόματος ὀνομαζομένου中“名”的范围
  choice: 译为“一切被称说的名号”，兼容名字、称号、名分和地位。
  alternative: 窄化为“一切授予的头衔”。
  rationale: 原文的措辞十分宽广，不宜只理解为正式头衔；同时“名号”比单独的“名字”更能传达其可能涉及身份与地位。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。正文延续上一节的句法，因此以“远远超越”起句；并列项采用名词化的“……的”，既保持节奏，也避免过早断定这些权势的具体性质。所有脚注标记均在正文中出现。
