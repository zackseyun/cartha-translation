  text: ἐμοὶ τῷ ἐλαχιστοτέρῳ πάντων ἁγίων ἐδόθη ἡ χάρις αὕτη— ⸀τοῖς ἔθνεσιν εὐαγγελίσασθαι ⸂τὸ ἀνεξιχνίαστον πλοῦτος⸃ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/008.yaml
  text: To me[a], the very least of all the saints, this grace was given—to proclaim to the Gentiles the unsearchable riches of Messiah[c][b],
translation:
  language: zh_hans
  text: 我这众圣徒中最微不足道的人，蒙赐了这恩典，就是向外邦人[a]传扬弥赛亚[b]那测不透的丰富。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“列国”。在这里主要指非犹太人。
    reason: lexical_alternative
  - marker: b
    text: 传统译作“基督”；希腊语意为“受膏者”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλαχιστοτέρῳ
  choice: 最微不足道
  rationale: 这是一个带强化意味的比较级形式，表达保罗极深的自谦；“最微不足道”在现代汉语中自然，也保留其修辞力度。
- source_word: ἁγίων
  choice: 圣徒
  rationale: 保罗常用此词指分别归给上帝的信徒群体；“圣徒”简洁，并与原文的名词形式相应。
- source_word: χάρις
  choice: 恩典
  rationale: 此处既指上帝白白赐下的恩惠，也包含所托付的使命；“恩典”保留了保罗书信中的词汇连贯性。
- source_word: ἔθνεσιν
  choice: 外族人
  rationale: 在本段犹太人与非犹太人的语境中，指非犹太各族，而非现代政治意义上的“国家”；“外族人”能清楚传达这一点。
- source_word: εὐαγγελίσασθαι
  choice: 传扬
  rationale: 该不定式表示宣告好消息的使命；因其宾语紧接在后，“传扬”在汉语中简练自然。
- source_word: ἀνεξιχνίαστον
  choice: 测不透
  rationale: 原词表示无法追索到底、不能穷尽；“测不透”保留不可完全探明的意象，同时通俗庄重。
- source_word: πλοῦτος
  choice: 丰富
  rationale: 此处为集合性单数，喻指在弥赛亚里丰盛而无穷的福分；汉语用“丰富”比字面的“财富”更贴合这一抽象用法。
- source_word: Χριστοῦ
  choice: 弥赛亚
  rationale: Χριστός在这里是受膏者的称号；译出其含义为“弥赛亚”，同时以脚注提供传统译名“基督”。
theological_decisions:
- issue: Χριστοῦ的称号如何表达
  choice: 弥赛亚
  alternative: 基督
  rationale: 原词意为“受膏者”，此处保留称号意义，不把它默认为人名；“基督”作为广为使用的传统译法列入脚注。
- issue: πλοῦτος所指的范围
  choice: 保持为“丰富”，不具体列举其内容
  alternative: 福分／财富
  rationale: 原文没有说明这些“丰富”具体包括什么；采用概括表达，以保留其开放性和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我这……的人”保留原句对“我”的强调；“就是”自然引出恩典所包含的使命。未加入原文没有明说的因果、转折或具体福分内容。
