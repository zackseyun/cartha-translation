  text: that the mystery was made known to me by revelation[a], as I wrote before briefly[c][b],
translation:
  language: zh_hans
  text: 那奥秘借着启示让我得知，正如我先前已经简略写过的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那奥秘是按着启示让我得知的”；“借着启示”也可译为“通过启示”。希腊文此处为被动式，意为“那奥秘被使我知道”或“被告知给我”。“简略”也可译为“用寥寥数语”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ ἀποκάλυψιν
  choice: 借着启示
  rationale: κατά加宾格在这里可表达方式或依据；“借着启示”在现代汉语中自然地表明这奥秘是通过启示而得知，同时保留原文可能具有的方式意味。
- source_word: ἐγνωρίσθη μοι
  choice: 使我知道
  rationale: γνωρίζω的不定过去时被动式直指“被使知道／被告知”。汉语用“使我知道”可保留使役含义，又不明确补出原文未明说的施事者。
- source_word: τὸ μυστήριον
  choice: 这奥秘
  rationale: 冠词所指的奥秘承接上下文；“奥秘”保留保罗书信中指从前隐藏、如今显明之神圣旨意的术语性质，不在本节提前解释其内容。
- source_word: καθὼς
  choice: 正如
  rationale: 表达比较并连接保罗当前的陈述与先前所写的内容；“正如”庄重而自然。
- source_word: προέγραψα
  choice: 我先前……写过
  rationale: 在本语境中指此前已经写下，而非公开张贴或描绘；译法保留其时间上的先行意义。
- source_word: ἐν ὀλίγῳ
  choice: 简略
  rationale: 该短语表示篇幅简短或言辞不多；“简略写过”符合现代汉语表达，也避免限定为严格意义上的“几个字”。
theological_decisions:
- issue: 保罗用语μυστήριον的含义
  choice: 保留“奥秘”，不在本节中展开说明
  alternative: 秘密；神隐藏的计划
  rationale: 本节只提到这一概念，随后语境才加以说明。保留“奥秘”既维持保罗的神学用语，也避免把后文内容提前加入本节。
- issue: 启示与使人知道之间的关系
  choice: 译为“借着启示使我知道”
  alternative: 按着启示使我知道；向我启示了
  rationale: 此译保留κατὰ ἀποκάλυψιν与ἐγνωρίσθη的分别：前者说明方式或依据，后者说明奥秘被使其知道；不把两者合并成单一的“启示”动词。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“这奥秘”承接上下文；“借着启示使我知道”尽量保留原文被动／使役表达及未明说的施事者；语序略作汉语化处理。
