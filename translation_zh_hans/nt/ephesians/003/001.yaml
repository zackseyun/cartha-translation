  text: Τούτου χάριν ἐγὼ Παῦλος ὁ δέσμιος τοῦ Χριστοῦ Ἰησοῦ ὑπὲρ ὑμῶν τῶν ἐθνῶν—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/001.yaml
  text: For this reason I[a], Paul[c][b], the prisoner of Messiah Jesus on behalf of you Gentiles—
translation:
  language: zh_hans
  text: 因此，我保罗，身为弥赛亚耶稣的囚徒，为了你们外邦人——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τούτου χάριν
  choice: 因此
  rationale: 这是承接上文并引出推论的惯用语；“因此”简洁自然，也保留了与前文的因果联系。
- source_word: ἐγὼ Παῦλος
  choice: 我保罗
  rationale: 保留显式代词所带的强调；现代汉语用“我保罗”可自然表达郑重的自我指称。
- source_word: ὁ δέσμιος
  choice: 囚徒
  rationale: 直接表达被拘禁之人的身份，比“戴锁链的人”少一层具体化解释。
- source_word: τοῦ Χριστοῦ Ἰησοῦ
  choice: 弥赛亚耶稣
  rationale: Χριστός在此是附于耶稣的称号，译为“弥赛亚”可显明其称号含义；属格所含的归属或服事关系由“作……囚徒”保留，不限定为“被耶稣囚禁”。
- source_word: ὑπὲρ ὑμῶν
  choice: 为了你们
  rationale: 这里表达保罗被囚与读者所得益处之间的关系；“为了你们”自然涵盖受益、缘故等语义，而不强行限定为代理意义。
- source_word: τῶν ἐθνῶν
  choice: 外族人
  rationale: 在“你们”的同位说明中，所指是非犹太人，而非地缘政治意义上的列国；“外族人”在现代汉语中清楚表达这一身份。
theological_decisions:
- issue: Χριστοῦ应译作称号还是沿用传统音译形式
  choice: 弥赛亚耶稣
  alternative: 基督耶稣
  rationale: 此处Χριστός仍具有受膏者称号的功能，正文译作“弥赛亚”以呈现其含义；脚注保留中文圣经传统中常见的“基督”。
- issue: “基督耶稣的囚徒”所表达的关系
  choice: 作弥赛亚耶稣囚徒
  alternative: 被弥赛亚耶稣囚禁的人
  rationale: 希腊语属格可以表达归属、效忠或关联；不宜把它窄化为耶稣是实施拘禁者。
- issue: 本节未完句的处理
  choice: 以破折号保留中断
  alternative: 补足为完整句
  rationale: 原文在此转入插叙，主句直到后文才重新开始；保留破折号可呈现保罗思路的中断，不擅自补足其句法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“就是”标明“囚徒”与“我保罗”的同位关系；句末破折号刻意保留原文在本节形成的未完句。
