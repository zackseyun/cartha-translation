  text: εἴ γε ἠκούσατε τὴν οἰκονομίαν τῆς χάριτος τοῦ θεοῦ τῆς δοθείσης μοι εἰς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/002.yaml
  text: assuming indeed that you have heard of the stewardship of God's grace that was given to me for you[b][a],
translation:
  language: zh_hans
  text: 如果你们确实听说过，我受托管理上帝赐给我、为你们的恩典[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“想必你们确实听说过。”希腊文保留条件句形式；按上下文，保罗很可能预期这件事是真的。
    reason: alternative_reading
  - marker: b
    text: “受托管理”也可译作“管家职分”“管理职责”或“所受的托付”。希腊词可指受托进行管理或执行安排。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: 想必……确实
  rationale: 保留说话者预期此事为真的语气；希腊文形式上带条件意味，因此另以脚注列出较直译的表达。
- source_word: ἠκούσατε
  choice: 你们听说过
  rationale: 不定过去时将听闻视为整体事件；“听说过”符合现代汉语，并表达其对当前论述的关联。
- source_word: οἰκονομίαν
  choice: 管家职分
  rationale: 此处侧重保罗受托管理、执行与上帝恩典有关的使命；“管家职分”兼顾受托责任与职务含义，而不将其抽象化为单纯的计划。
- source_word: χάριτος τοῦ θεοῦ
  choice: 上帝……的恩典
  rationale: “恩典”保持保罗书信中的词汇连贯性，并清楚表明这恩典源于并属于上帝。
- source_word: τῆς δοθείσης μοι
  choice: 赐给我
  rationale: 保留被动赐予的含义；按上下文，上帝是隐含的施予者。希腊文阴性分词在语法上修饰“恩典”，中文据此安排为“上帝赐给我……的恩典”。
- source_word: εἰς ὑμᾶς
  choice: 为你们而设
  rationale: 表达这项受托职分面向读者、使他们受益；避免仅译作方向性的“向着你们”。
theological_decisions:
- issue: “上帝恩典的οἰκονομία”所指为何
  choice: 指上帝赐给保罗、使他为读者执行恩典使命的受托职分
  alternative: 指上帝救恩安排或计划本身
  rationale: 本章上下文强调保罗向外族人尽职事；译作“管家职分”保留个人受托责任，同时不否定其背后的上帝计划。
- issue: εἴ γε的语气
  choice: 译作说话者预期为真的推定：“想必……确实”
  alternative: 按形式直译为“如果你们确实听说过”
  rationale: 上下文较可能不是表达真实怀疑，而是以条件形式提出预期读者知道的事实；脚注保留其形式上的条件可能。
- issue: τῆς δοθείσης的修饰对象
  choice: 按语法将“赐给我”理解为修饰“恩典”
  alternative: 在语义上将整个“恩典的管家职分”理解为赐给保罗的托付
  rationale: 分词与χάριτος在性、数、格上一致，直接修饰“恩典”；但整句语义也使这恩典体现为保罗受托的职分，正文尽量保留二者的紧密关系。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“想必……确实”传达带条件形式的肯定预期；“管家职分”虽略具书面色彩，却能较准确保留受托管理的意象。脚注标记按相关短语依次置于正文末尾。
