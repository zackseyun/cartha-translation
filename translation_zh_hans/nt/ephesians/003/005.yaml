  text: ὃ ἑτέραις γενεαῖς οὐκ ἐγνωρίσθη τοῖς υἱοῖς τῶν ἀνθρώπων ὡς νῦν ἀπεκαλύφθη τοῖς ἁγίοις ἀποστόλοις αὐτοῦ καὶ προφήταις ἐν πνεύματι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/005.yaml
  text: which was not made known to the sons of men in other generations as it has now been revealed to his holy apostles and prophets in the Spirit[b][a],
translation:
  language: zh_hans
  text: 这奥秘在从前的各世代中，没有向世人[a]显明，正如如今在圣灵里[b]向他的圣使徒和先知启示一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“人的儿子们”；这是泛指人类的闪语式表达。
    reason: lexical_alternative
  - marker: b
    text: 或译“借着圣灵”；原文短语既可表示所在的范围，也可表示所借的媒介。
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ
  choice: 这奥秘
  rationale: 中性关系代词回指第4节的“奥秘”。汉语若只译“这/它”衔接较含混，明示所指可自然承接上文，但不增加新的解释。
- source_word: ἑτέραις γενεαῖς
  choice: 在以往的世代中
  rationale: 与 νῦν（如今）形成时间对比；“以往”比直译“其他”更符合现代汉语，同时保留历代的含义。
- source_word: οὐκ ἐγνωρίσθη
  choice: 没有让……知道
  rationale: 保留 γνωρίζω 被动式所表达的“使人知道、使人得知”之意；汉语用处置式表达更自然。
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: 世人
  rationale: 该闪语式表达泛指人类。“世人”在现代汉语中简洁、庄重且自然；脚注保留原文的字面形式。
- source_word: ὡς νῦν
  choice: 像如今……那样
  rationale: 保留 ὡς 的比较力度，表明从前并非以如今这种方式或程度被启示，避免绝对化为此前完全无人知晓。
- source_word: ἀπεκαλύφθη
  choice: 启示给
  rationale: “启示”是保罗书信中 ἀποκαλύπτω 的常用对应词，并保留神主动揭示的语义。
- source_word: τοῖς ἁγίοις ἀποστόλοις αὐτοῦ καὶ προφήταις
  choice: 他的圣使徒和先知
  rationale: “圣”自然地共同修饰“使徒”和“先知”；“他的”保留 αὐτοῦ，而不超出本节指定其所指。
- source_word: ἐν πνεύματι
  choice: 在圣灵里
  rationale: 启示的语境强烈指向圣灵；“在……里”保留 ἐν 对范围或媒介均可表达的含混性，脚注列出工具性译法。
theological_decisions:
- issue: πνεύματι 的所指
  choice: 圣灵
  alternative: 人的灵；属灵的范围或方式
  rationale: 在神向使徒和先知启示奥秘的语境中，最可能指圣灵；译作“在圣灵里”同时避免把 ἐν 的功能只限定为工具。
- issue: ὡς 所表达的历史比较
  choice: 像如今……那样
  alternative: 从前完全未曾让任何人知道
  rationale: 原文使用比较结构，重点可能是启示的方式或程度不同；译文保留这种张力，不把它改写成绝对否定。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“这奥秘”承接上文；“像如今……那样”虽略带原文句法色彩，却有意保存比较结构及其神学张力。脚注标记均置于相关词语之后。
