  text: Τῷ δὲ δυναμένῳ ὑπὲρ πάντα ποιῆσαι ὑπερεκπερισσοῦ ὧν αἰτούμεθα ἢ νοοῦμεν κατὰ τὴν δύναμιν τὴν ἐνεργουμένην ἐν ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/020.yaml
  text: To the one who is able to do far beyond all that we ask or think[a], according to the power at work in us[b],
translation:
  language: zh_hans
  text: 愿那位能照着运行在我们里面的能力，成就远远超过[a]我们所求所想[b]的一切，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“极其丰盛地超过”或“无限地超过”；希腊文以强化形式突出远超的程度。
    reason: lexical_alternative
  - marker: b
    text: “想”也可译作“想象”，强调心里所能构想的。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῷ ... δυναμένῳ
  choice: 愿那位能……的
  rationale: 带冠词的与格分词指颂赞所归给的对象，并与下一节共同构成颂赞句。中文补出“愿”以自然承接颂赞结构，同时不把原文未在本节明说的“神”直接加入译文。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处主要标示转入颂赞的语篇衔接，并非强烈转折；中文以句式转换自然体现，若硬译“但”或“现在”反而容易增添原文没有的对比或时间意味。
- source_word: ποιῆσαι
  choice: 成就
  rationale: 在此指有能力使事情实现。“成就”比“做”更符合庄重颂赞语境，又没有把动作限定得过窄。
- source_word: ὑπὲρ πάντα ... ὑπερεκπερισσοῦ
  choice: 成就一切，远远超过
  rationale: ὑπέρ与强化副词共同表达超越的程度。“远远超过”自然传达叠加强调；“一切”保留πάντα的概括性。
- source_word: ὧν αἰτούμεθα ἢ νοοῦμεν
  choice: 我们所求所想的
  rationale: αἰτέομαι译作“求”，νοέω在这里指心中所能思及或构想的，译作“想”简洁自然，并在脚注保留“想象”的可能表达。
- source_word: κατὰ τὴν δύναμιν
  choice: 照着……的能力
  rationale: κατά加宾格表示标准、尺度或相称关系；“照着”比单纯工具性的“借着”更能保留这一含义。
- source_word: τὴν ἐνεργουμένην ἐν ἡμῖν
  choice: 运行在我们里面的
  rationale: 现在分词表示持续而有效的活动。“运行”传达能力正在发挥作用；“在我们里面”保留ἐν ἡμῖν最直接的内部及群体性含义，而不限定其具体神学机制。
theological_decisions:
- issue: 颂赞对象在本节中的称呼
  choice: 译作“那位”，不补入“神”
  alternative: 译作“那位神”或“神”
  rationale: 上下文清楚指向神，但本节希腊文没有重述θεός。保留“那位”既顺应实体化分词，也避免把上下文所指直接改写为本节明说的名词。
- issue: 神能在信徒中的作用方式
  choice: “运行在我们里面的能力”
  alternative: “运行在我们中间的能力”
  rationale: 此译法保留神的能力在信徒里面实际发挥功效的陈述，同时不进一步规定这能力与成圣、恩赐或群体生活之间的具体教义关系。
- issue: 本节与下一节共同组成未完的颂赞句
  choice: 以“愿”引出，并以逗号结束
  alternative: 逐字保留为悬置的“给那位……”
  rationale: 与格结构要到下一节才取得完整的颂赞谓语。中文用“愿”标明颂赞句式，并保留句末逗号，既使本节自然可读，也显示句法仍向下一节延续。
translation_notes:
  register: 采用现代、庄重而易懂的颂赞语体。“愿那位”保持敬虔语感而不显古奥；“所求所想”简洁匀称。译文保留与下一节相连的未完句式，并将两个脚注标记放在各自所解释的词语之后。
