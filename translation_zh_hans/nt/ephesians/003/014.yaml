  text: Τούτου χάριν κάμπτω τὰ γόνατά μου πρὸς τὸν ⸀πατέρα,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/014.yaml
  text: For this reason I bend my knees to the Father,
translation:
  language: zh_hans
  text: 因此，我向父屈膝，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τούτου χάριν
  choice: 因此
  rationale: 该结构表示下文行动的缘由，并承接前文。“因此”在现代汉语中自然简洁，也保留了论述上的因果联系。
- source_word: κάμπτω τὰ γόνατά μου
  choice: 我……屈膝
  rationale: κάμπτω本义为“弯曲”，与“我的膝”连用，描绘祷告时跪下的姿态。“屈膝”既保留身体意象，又比“弯下我的膝盖”更符合庄重自然的汉语表达。
- source_word: πρὸς
  choice: 向
  rationale: πρός在此表示祷告所朝向、所针对的对象；“向”准确保留方向性，不额外加入“在……面前”的空间意味。
- source_word: τὸν πατέρα
  choice: 父
  rationale: 上下文表明所指是保罗祷告的对象——上帝；汉语圣经语体中“父”可自然作为称谓，并为下一节的父性用语保留衔接。
theological_decisions:
- issue: πατέρα是否按神圣称谓处理
  choice: 父
  alternative: 父亲
  rationale: 语境明确指保罗祷告所向的上帝。“父”体现称谓性质，庄重而自然；“父亲”虽可表达亲属关系，却在此较偏日常称呼。译文不补出原文未明说的“天父”或“父神”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“向父屈膝”保留原文的祷告姿态与方向性；句末逗号反映本节在3:15中继续展开，属于未完句。
