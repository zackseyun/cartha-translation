  text: διὸ αἰτοῦμαι μὴ ⸀ἐγκακεῖν ἐν ταῖς θλίψεσίν μου ὑπὲρ ὑμῶν, ἥτις ἐστὶν δόξα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/013.yaml
  text: Therefore I ask you not to lose heart because of my afflictions for your sake[b][a], which are your glory.
translation:
  language: zh_hans
  text: 所以，我求你们不要因我为你们所受的患难而灰心[a]；这些患难正是你们的荣耀[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灰心”也可译作“丧胆”或“气馁”。
    reason: lexical_alternative
  - marker: b
    text: “荣耀”也可译作“光荣”或“尊荣”。这里把保罗为他们所受的患难视为一个整体；也可能更广泛地指他为他们服事并受苦这整件事。
    reason: referent_and_lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: 所以
  rationale: 承接上文并引出由此而来的劝请；“所以”简洁自然，保留推论关系。
- source_word: αἰτοῦμαι
  choice: 我求你们
  rationale: 原文直译为“我请求”，受词由语境补出；此处补出“你们”，使现代汉语表达完整，同时不改变劝请的对象。
- source_word: μὴ ἐγκακεῖν
  choice: 不要……灰心
  rationale: ἐγκακέω表示失去勇气、气馁或灰心。“灰心”是现代汉语中自然且庄重的对应词，也保留内在勇气衰退的意味。
- source_word: ἐν ταῖς θλίψεσίν μου
  choice: 因我……所受的患难
  rationale: 介词ἐν在这里表示令人灰心的缘由或处境；译作“因”符合汉语习惯。θλῖψις译为“患难”，保留其受压迫、遭困苦的分量。
- source_word: ὑπὲρ ὑμῶν
  choice: 为你们
  rationale: ὑπέρ在此表示为了对方的益处、代表对方或因服事对方而受苦；“为你们”简明，并保留这些可能相互关联的意味。
- source_word: ἥτις ἐστὶν δόξα ὑμῶν
  choice: 这些患难正是你们的荣耀
  rationale: 关系代词为阴性单数，而前面的“患难”为复数；可理解为把保罗为他们所受的患难视作一个整体。中文用“这些患难”明确承接近处内容，并以“正是”传达其性质和意义。
- source_word: δόξα
  choice: 荣耀
  rationale: δόξα可指荣耀、尊荣或光荣。“荣耀”保留原文较强的神学与修辞分量，未将其缩窄为个人自夸。
theological_decisions:
- issue: ἥτις ἐστὶν δόξα ὑμῶν所指为何
  choice: 理解为保罗为他们所受的患难整体，正是他们的荣耀。
  alternative: 也可理解为更广泛地指保罗为他们服事并受苦这整件事。
  rationale: 最近的语义先行内容是“我为你们所受的患难”，但关系代词的单数形式也容许把整个受苦处境看作一个整体。正文依近处所指翻译，脚注说明其意义，却不进一步限定其救恩论机制。
- issue: 受苦如何成为收信人的“荣耀”
  choice: 保留“你们的荣耀”这一张力较强的原文表达。
  alternative: 可释义为“使你们得尊荣的事”或“你们的光荣”。
  rationale: 原文直接将保罗的患难与他们的δόξα相连，并未在本节详述其中机制；因此正文不添加因果解释，也不把“荣耀”弱化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“患难”“荣耀”保留经文的分量；句中用分号清楚呈现劝请及其出人意料的解释。所有脚注标记均置于正文相应词句之后。
