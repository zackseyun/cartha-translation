  text: αὐτῷ ἡ δόξα ἐν τῇ ἐκκλησίᾳ ⸀καὶ ἐν Χριστῷ Ἰησοῦ εἰς πάσας τὰς γενεὰς τοῦ αἰῶνος τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/021.yaml
  text: To him be glory in the church and in Messiah Jesus through all generations forever and ever[a]. Amen.
translation:
  language: zh_hans
  text: 愿他在教会中，也在弥赛亚耶稣[a]里得荣耀，世世代代，直到永永远远。阿们！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督耶稣”。希腊语称号Χριστός意为“弥赛亚（受膏者）”，正文按其称号含义翻译。
    reason: 提供传统译名，并说明正文为何保留该称号的语义。
lexical_decisions:
- source_word: αὐτῷ ἡ δόξα
  choice: 愿他……得着荣耀
  rationale: 原文是没有明示动词的颂赞语。中文用“愿他得着荣耀”自然表达归荣耀给他的祈愿兼宣认语气，又不把隐含关系硬译成陈述式“荣耀属于他”。
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: 在教会中
  rationale: ἐκκλησία在此指属神的信徒群体；“教会”是现代汉语中自然、通行的对应词。“在……中”保留ἐν的表达，并与下句形成平行。
- source_word: καὶ ἐν Χριστῷ Ἰησοῦ
  choice: 也在弥赛亚耶稣里
  rationale: καί译作“也”，清楚呈现两个ἐν短语的并列；Χριστός按其称号意义译为“弥赛亚”，Ἰησοῦ按名称译为“耶稣”，“在……里”保留保罗书信中ἐν Χριστῷ的关系性表达。
- source_word: εἰς πάσας τὰς γενεὰς
  choice: 直到世世代代
  rationale: εἰς在时间表达中表示延续所及；“直到世世代代”既自然，又保留所有世代不断延续的意思。
- source_word: τοῦ αἰῶνος τῶν αἰώνων
  choice: 永永远远
  rationale: 这是强调无尽久远的惯用表达；“永永远远”符合现代中文颂赞文体，并传达其加强语气。
- source_word: ἀμήν
  choice: 阿们
  rationale: 采用中文基督教传统中通行的音译，表达礼仪性的确认与赞同。
theological_decisions:
- issue: Χριστός在Χριστῷ Ἰησοῦ中作为称号还是名称化成分
  choice: 弥赛亚耶稣
  alternative: 基督耶稣
  rationale: Χριστός本义是“受膏者”，在此仍可视为具有意义的称号；译作“弥赛亚”保留称号含义，同时用脚注提供中文传统译法，不改变所指对象。
- issue: 颂赞句中省略动词的语气
  choice: 愿他……得着荣耀
  alternative: 荣耀归给他
  rationale: 希腊文未明说动词，既可理解为颂愿，也有归荣耀的宣认意味。“愿他……得着荣耀”保留颂赞语境中的祈愿力量，而不扩展为因果或教义性说明。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，保持颂赞句的礼仪感。用“也在”显明两个介词短语的平行关系；时间短语不加逗号拆断其连续意义。脚注标记紧接“弥赛亚耶稣”，使注释对象明确。
