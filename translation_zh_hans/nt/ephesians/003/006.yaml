  text: εἶναι τὰ ἔθνη συγκληρονόμα καὶ σύσσωμα καὶ συμμέτοχα τῆς ἐπαγγελίας ⸂ἐν Χριστῷ Ἰησοῦ⸃ διὰ τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/006.yaml
  text: that the Gentiles are fellow heirs[a], fellow members of the body, and fellow partakers of the promise in Messiah Jesus through the gospel[c][b],
translation:
  language: zh_hans
  text: 就是外邦人[a]借着福音，在弥赛亚耶稣[b]里同为后嗣、同属一个身体[c]、并同享这应许。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“列国”。这里特指犹太人以外、如今一同被纳入上帝救恩应许的各族人。
    reason: lexical_alternative
  - marker: b
    text: 传统译法为“在基督耶稣里”。希腊语“基督”在这里仍带有“弥赛亚”（受膏者）这一称号的意味。
    reason: alternative_rendering
  - marker: c
    text: “同属一个身体”也可译为“同为一体”；希腊原文用一个罕见的复合词表达共同属于同一身体。
    reason: lexical_explanation
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: 外族人
  rationale: 此处不是泛指地缘政治意义上的“各国”，而是特指犹太人以外、如今一同被纳入上帝应许的人；“外族人”在现代汉语中清楚而不含贬义。
- source_word: συγκληρονόμα
  choice: 同为后嗣
  rationale: 保留 σύν- 所表达的共同关系，也保留承受产业的继承意象；“同为”与本句另外两个并列成分形成呼应。
- source_word: σύσσωμα
  choice: 同属一个身体
  rationale: 这个罕见的复合词表达共同构成或归属于同一身体；此译既保留身体隐喻，也比生硬的“同身体”更符合现代汉语。
- source_word: συμμέτοχα
  choice: 同享
  rationale: 表达共同有分、共同参与；与“同为”“同属”形成简洁有力的三重平行。
- source_word: τῆς ἐπαγγελίας
  choice: 这应许
  rationale: 保留希腊文单数，并以“这”承接上下文所揭示的特定应许；它依附于 συμμέτοχα，表示共同有分于应许。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: 在弥赛亚耶稣里
  rationale: ἐν 的联合或领域关系以“在……里”表达；此处 Χριστός 在救赎历史语境中仍有受膏君王的称号意味，因此译作“弥赛亚”。
- source_word: διὰ τοῦ εὐαγγελίου
  choice: 借着福音
  rationale: διά 加属格表示途径或媒介；“借着福音”简明地表达外族人得以共同有分的媒介。
- source_word: εἶναι
  choice: 就是……同为／同属／同享
  rationale: 此不定式承接上一节对“奥秘”的说明；汉语用“就是”自然引出奥秘的具体内容。
theological_decisions:
- issue: Χριστῷ 在此译为称号还是沿用名称化形式
  choice: 弥赛亚耶稣
  alternative: 基督耶稣
  rationale: 本段论述外族人被纳入上帝应许的奥秘，Χριστός 的弥赛亚称号意义仍然活跃；脚注保留教会传统译法。
- issue: ἔθνη 的具体所指
  choice: 外族人
  alternative: 列国／万族
  rationale: 上下文强调非犹太人与原先承受应许者共同有分；“外族人”比“列国”更准确传达此处的人群对比，同时不额外断定关于以色列与教会关系的体系性结论。
- issue: 三个 σύν- 复合词的关系
  choice: 以“同为、同属、同享”保持三重平行
  alternative: 分别扩展为“共同承受产业的人、同一身体的成员、共同有分的人”
  rationale: 原文用三个 σύν- 复合形容词构成强烈的并列节奏；简洁平行的汉语既忠实于修辞，也没有削弱共同继承、同一身体和共同参与三方面的含义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以“同为后嗣、同属一个身体、同享这应许”重现原文三个 σύν- 复合词的节奏；“后嗣”虽略具经文语体，但比“继承人”更能保留应许与产业的圣经意象。标点与语序使本节可自然承接3:5关于“奥秘”的说明。
