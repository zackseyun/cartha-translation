base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/004.yaml
  text: By reading this[a], you are able to understand my insight into the mystery of Messiah,
translation:
  language: zh_hans
  text: 你们读这些话时，就能明白我对弥赛亚[a]的奥秘的领悟。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。希腊语称号Χριστός既可译为“弥赛亚”，也可按传统译为“基督”。
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς ὃ … ἀναγινώσκοντες
  choice: 读了这些话
  rationale: πρὸς ὃ回指保罗刚才所写的内容，并与分词ἀναγινώσκοντες共同表达读者借着阅读而明白；译为“读了这些话”既保留衔接，也符合现代汉语表达。
- source_word: δύνασθε … νοῆσαι
  choice: 就能明白
  rationale: δύνασθε表示能力，νοῆσαι表示心智上的领会；“就能明白”自然呈现阅读与领会之间的关系。
- source_word: τὴν σύνεσίν μου
  choice: 我……有怎样的领悟
  rationale: σύνεσις指理解力、领悟或洞见。这样译可避免与νοῆσαι重复使用“明白”，并清楚表达这是保罗本人的领悟。
- source_word: ἐν τῷ μυστηρίῳ
  choice: 对……的奥秘
  rationale: ἐν在此标明领悟所涉及的领域或对象；汉语用“对……有领悟”比直译“在奥秘中”更自然。
- source_word: τοῦ Χριστοῦ
  choice: 弥赛亚的
  rationale: Χριστός在此作为称号，译为“弥赛亚”；属格用“的”保留“弥赛亚的奥秘”可指关于弥赛亚或与他相关之奥秘的语义张力。
theological_decisions:
- issue: Χριστοῦ的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处Χριστός仍可理解为称号，故正文译“弥赛亚”，同时脚注保留传统译法“基督”。
- issue: τοῦ Χριστοῦ的属格关系
  choice: 弥赛亚的奥秘
  alternative: 关于弥赛亚的奥秘
  rationale: 直译式的“弥赛亚的奥秘”不强行判定属格只表示内容，也可保留归属或关联的可能；“关于弥赛亚的奥秘”虽更明确，却会缩窄原文。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“这些话”明确承接上文；句式避免生硬直译，同时保留“弥赛亚的奥秘”在属格关系上的开放性。
