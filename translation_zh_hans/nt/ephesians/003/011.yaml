  text: κατὰ πρόθεσιν τῶν αἰώνων ἣν ἐποίησεν ἐν ⸀τῷ Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/011.yaml
  text: according to the eternal purpose that he accomplished in Messiah Jesus our Lord[c][b][a],
translation:
  language: zh_hans
  text: 这是照着他在我们的主弥赛亚耶稣里[b][c]所成就的永恒旨意[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“诸世代的旨意。”希腊文直译如此。
    reason: lexical_alternative
  - marker: b
    text: 或译：“借着弥赛亚耶稣。”希腊文介词是“在……里”，在本语境中也可按工具意义理解。
    reason: alternative_reading
  - marker: c
    text: 希腊文为Christos，传统音译“基督”；这里译作“弥赛亚”，因为该词在此用作称号。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ πρόθεσιν τῶν αἰώνων
  choice: 照着……永恒旨意
  rationale: κατά加宾格表示依照或符合；πρόθεσις指有意定下的旨意或计划。τῶν αἰώνων直译为“诸世代的”，在此表达跨越万世、永恒的性质；正文采用自然清楚的“永恒旨意”，并以脚注保留原文形式。
- source_word: ἣν ἐποίησεν
  choice: 他……所成就的
  rationale: 关系代词ἣν回指“旨意”；ποιέω本义宽泛，可指“做、实行”。与“旨意”搭配时，“成就”自然表达使旨意付诸实现，同时不把句意扩展为更具体的事件。
- source_word: ἐν
  choice: 在……里
  rationale: 保留介词ἐν最直接的空间—联合性表达。上下文也容许工具性理解“借着”，故在脚注中列出，而不在正文中消除歧义。
- source_word: Χριστῷ Ἰησοῦ
  choice: 弥赛亚耶稣
  rationale: Χριστός在这里仍带有称号意义，译作“弥赛亚”可保留其受膏者背景；Ἰησοῦ按通行中文译名译作“耶稣”。
- source_word: τῷ κυρίῳ ἡμῶν
  choice: 我们的主
  rationale: κύριος译为“主”，保留新约中这一称号的通常意义；ἡμῶν为所属关系，译作“我们的”。
theological_decisions:
- issue: πρόθεσιν τῶν αἰώνων的含义
  choice: 正文译作“永恒旨意”，脚注注明直译形式
  alternative: 诸世代的旨意；万世以来的旨意
  rationale: 属格复数τῶν αἰώνων字面为“诸世代的”，通常表示这旨意具有永恒性质。正文使用现代汉语较自然的表达，同时用脚注保留原文意象和可核查性。
- issue: ἐν τῷ Χριστῷ Ἰησοῦ的介词含义
  choice: 在弥赛亚耶稣里
  alternative: 借着弥赛亚耶稣
  rationale: ἐν最直接译为“在……里”，也可能在语境中带工具性。正文不替读者预先裁定，脚注列出另一种可能。
- issue: Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处该词作为耶稣的称号，译作“弥赛亚”能显明“受膏者”的称号功能及犹太背景；脚注给出传统音译“基督”。
- issue: ἐποίησεν与神永恒旨意的关系
  choice: 成就
  alternative: 制定；实行
  rationale: “成就”可表达神使其旨意成为现实，但原动词本身较宽泛。因此不在译文中进一步指定这成就是制定旨意还是借某一具体事件完成旨意。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句子承接上下文，以“这是”明确其指代关系；“我们的主”置于“弥赛亚耶稣”之前，符合汉语称号组合习惯，同时准确表达同位关系。
