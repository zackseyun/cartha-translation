  text: ἐν ᾧ ἔχομεν τὴν παρρησίαν ⸀καὶ προσαγωγὴν ἐν πεποιθήσει διὰ τῆς πίστεως αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/012.yaml
  text: in whom we have boldness and access with confidence through faith in him[a].
translation:
  language: zh_hans
  text: 我们在他里面，借着信靠他，得以坦然无惧、满有把握地进到上帝面前。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“借着他的信实。”希腊语短语既可指信靠他，也可指他本身的信实。
    reason: 保留 πίστεως αὐτοῦ 中客观属格与主观属格两种可能的解释。
lexical_decisions:
- source_word: ἐν ᾧ
  choice: 在他里面
  rationale: 关系代词为阳性单数，最自然地回指上文的基督；译作“在他里面”既保留其人称所指，也保留与基督联合的表达。
- source_word: παρρησίαν
  choice: 坦然无惧
  rationale: 该词表示公开、直率和无所畏惧；此处指来到上帝面前时的坦然，且不与后面的 πεποίθησις 简单合并。
- source_word: προσαγωγὴν
  choice: 来到上帝面前
  rationale: 该词在保罗书信中表示得以进到上帝面前。“来到上帝面前”比直译“通路”更自然，并清楚表达此处隐含的目标。
- source_word: ἐν πεποιθήσει
  choice: 满有信心地
  rationale: 表达带着确信、笃定而来的方式；这样既符合现代汉语，也与 παρρησίαν 所强调的坦然无惧有所区分。
- source_word: διὰ τῆς πίστεως αὐτοῦ
  choice: 借着对他的信
  rationale: 将 αὐτοῦ 理解为客观属格，即以基督为信心对象；这是上下文中较自然的主文读法，同时以脚注保留“借着他的信实”这一真实可能。
theological_decisions:
- issue: διὰ τῆς πίστεως αὐτοῦ 中属格的解释
  choice: 借着对他的信
  alternative: 借着他的信实
  rationale: 希腊语可将 αὐτοῦ 理解为客观属格，指人对基督的信，也可理解为主观属格，指基督的信实。主文采用与信徒得以进到上帝面前这一语境相称的前一种读法，脚注保留后一种，不消除原文的神学张力。
- issue: προσαγωγή 所指的对象
  choice: 来到上帝面前
  alternative: 得以进到他面前／有通路
  rationale: 原文未明说所到之处，但以弗所书中该词的语境指借基督进到父面前。译文补出“上帝”以使现代汉语完整清楚，而不把“他”误解为基督；并未加入宗派性解释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“坦然无惧、满有信心地”分别呈现 παρρησία 与 πεποίθησις 的相近但不完全相同的含义；脚注标记已置于主文相关短语之后。
