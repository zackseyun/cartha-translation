source:
  edition: SBLGNT
  text: οὗ ⸀ἐγενήθην διάκονος κατὰ τὴν δωρεὰν τῆς χάριτος τοῦ θεοῦ ⸂τῆς δοθείσης⸃ μοι κατὰ τὴν ἐνέργειαν τῆς δυνάμεως αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/007.yaml
  text: of which I became a servant according to the gift of God's grace given to me according to the working of his power—[a]
translation:
  language: zh_hans
  text: 我成了[a]这福音的服事者，照着神恩典的恩赐；这恩典是照着他能力的运行赐给我的——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我被立为这福音的服事者”。
    reason: 原文ἐγενήθην可带被动意味；διάκονος也可译为“仆役”或“服事者”。
lexical_decisions:
- source_word: οὗ
  choice: 这福音的
  rationale: 关系代词为中性单数属格，回指上文的εὐαγγέλιον（福音）。中文以“这福音的”自然表达“作这福音的仆役”，避免误解为指人。
- source_word: ἐγενήθην
  choice: 我成了
  rationale: γίνομαι的不定过去时在此表示进入一种身份或职分。“成了”自然，也保留其可能含有的被动意味，而不在正文中把施事者明说出来。
- source_word: διάκονος
  choice: 仆役
  rationale: 此词指承担服事的人；“仆役”保留服务、受差遣的功能意义，同时避免“执事”所可能带入的正式教会职衔。
- source_word: κατὰ τὴν δωρεὰν
  choice: 照着……恩赐
  rationale: κατά加宾格表达所依据的准则、尺度或基础。“照着”保留原文关系，也避免仅译成单纯因果。
- source_word: τῆς χάριτος τοῦ θεοῦ
  choice: 神恩典的
  rationale: 保留属格链，使“恩赐”与神的恩典紧密相连；中文简洁而庄重。
- source_word: τῆς δοθείσης μοι
  choice: 这恩赐……赐给了我
  rationale: 将修饰“恩典”的被动分词结构在中文中重述为独立分句，使受赐关系清楚，也保留神圣被动的表达，不另行补出主语。
- source_word: κατὰ τὴν ἐνέργειαν
  choice: 照着……运行
  rationale: ἐνέργεια指实际发挥作用、产生果效的活动。“运行”保留保罗用语中的动力与实效意味，并与前一个“照着”形成原文的平行。
- source_word: τῆς δυνάμεως αὐτοῦ
  choice: 他大能的
  rationale: δύναμις在此指神的能力；“大能”符合现代中文圣经语体，并自然表达这种能力的强盛。
theological_decisions:
- issue: 保罗作为διάκονος的身份性质
  choice: 仆役
  alternative: 服事者；执事
  rationale: 上下文说的是保罗为福音受托服事，并未明确指后来制度化的教会职分。因此不用“执事”，以免加入原文未明说的教会体制含义。
- issue: ἐγενήθην中的施事与被动意味
  choice: 我成了
  alternative: 我被立为
  rationale: 原词形式容许被动意味，但γίνομαι也常直接表示“成为”。正文不把神的施事作用硬加进动词，不过随后“恩赐”“赐给”“他大能的运行”已清楚显示这一服事源于神。脚注保留较明确的被动译法。
- issue: 两个κατά短语的关系
  choice: 两处都译作“照着”
  alternative: 由于……；借着……
  rationale: 重复“照着”保留原文的平行结构，并让恩赐与神大能的运行之间究竟偏重依据、尺度还是方式的张力保持开放。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“仆役”比“执事”更少制度色彩；两个“照着”略带保罗书信式的凝练结构，以保存原文重复和神学关联。句末破折号保留本节与下文句法和论述上的延续。
