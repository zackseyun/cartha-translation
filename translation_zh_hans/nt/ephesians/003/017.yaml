  text: κατοικῆσαι τὸν Χριστὸν διὰ τῆς πίστεως ἐν ταῖς καρδίαις ὑμῶν ἐν ἀγάπῃ· ἐρριζωμένοι καὶ τεθεμελιωμένοι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/017.yaml
  text: so that Messiah may dwell in your hearts through faith[a], being rooted and grounded in love[c][b],
translation:
  language: zh_hans
  text: 使弥赛亚[a]借着信[b]住在你们心里，又使你们在爱中[c]扎根、根基稳固，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。希腊语Χριστός是称号，意为“受膏者”。
    reason: alternative_reading
  - marker: b
    text: “信”也可译作“信靠”；希腊语πίστις在某些语境中也可表示“信实”，但这里以“信”最为贴切。
    reason: lexical_alternative
  - marker: c
    text: “在爱中”最自然地与后面的“扎根、根基稳固”相连；也有人认为它与前面的“住在你们心里”相连。
    reason: alternative_reading
lexical_decisions:
- source_word: κατοικῆσαι
  choice: 住在
  rationale: 此不定式承接上文的祈求，表示目的或结果；“住在”自然地表达持续、安定的居住，而不弱化为暂时停留。
- source_word: τὸν Χριστόν
  choice: 弥赛亚
  rationale: Χριστός在这里带有称号意味；译作“弥赛亚”可保留“受膏者”这一称号的含义，同时符合现代中文表达。
- source_word: διὰ τῆς πίστεως
  choice: 借着信
  rationale: διά加属格表示途径或媒介；本句中的πίστις最自然地指“信”，故译为“借着信”。
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: 住在你们心里
  rationale: “心”在此指人的内在生命，不只指情感；直译既符合源语意象，也为现代中文读者熟悉。
- source_word: ἐν ἀγάπῃ
  choice: 在爱中
  rationale: 保留介词结构及ἀγάπη的基本意义，并将其主要连接于后面的两个分词，表示扎根和立基所在的领域。
- source_word: ἐρριζωμένοι
  choice: 扎根
  rationale: 保留农业比喻；其完成时被动分词所表达的既成而持续状态，在中文中结合“使你们”可自然表达。
- source_word: τεθεμελιωμένοι
  choice: 立稳根基
  rationale: 保留与“扎根”并列的建筑比喻，也表达完成时被动分词所强调的稳固状态；“立稳根基”比单说“建立”更清楚呈现源语意象。
theological_decisions:
- issue: Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处将该词按称号翻译，以显明“受膏者”的含义；“基督”是通行的音译性传统译法，意义相同，列入脚注而不据此引入额外教义。
- issue: πίστις在διὰ τῆς πίστεως中的含义
  choice: 信
  alternative: 信靠；信实
  rationale: 语境最自然地指人借以让弥赛亚住在心里的“信”；该词在别处可有“信靠”或“信实”的语义，但本句不足以要求改用这些译法。
- issue: ἐν ἀγάπῃ的句法连接
  choice: 主要连接“扎根，并立稳根基”
  alternative: 连接“住在你们心里”
  rationale: 词序和语流较支持它修饰随后的两个分词，但希腊文仍容许将其与前面的“住在你们心里”相连，因此以脚注保存这一真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“扎根”与“立稳根基”刻意保留原文农业和建筑两个并列比喻。经文是承接上文的句子片段，末尾保留逗号以反映其继续进入下一节的结构。
