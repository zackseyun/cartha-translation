  text: from whom every family in heaven and on earth is named,[a]
translation:
  language: zh_hans
  text: 天上地上的各家，都是从他得名的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“天上地上的整个家族，都是从他得名的”；也可较具解释性地译为：“天上地上一切父性，都从他得名。”
    reason: 原文πᾶσα πατριά既可理解为分配性的“各家”，也可能指整体的“整个家族”；同时，πατριά与上一节的“父”可能形成文字呼应，因而可作较抽象的理解。
lexical_decisions:
- source_word: ἐξ οὗ
  choice: 从他
  rationale: ἐκ加属格关系代词表示来源，可自然译为“从他”。结合后面的“得名”，既传达来源关系，又不把经文扩写成更强的解释。
- source_word: πᾶσα
  choice: 各
  rationale: πᾶσα修饰单数名词时可有分配义“每一个”，中文用“各家”比逐字式的“每一个家族”更自然，也不预先断定是一个整体的家。
- source_word: πατριὰ
  choice: 家
  rationale: πατριά通常指家族、宗族或血缘群体。“家”简洁自然，并保留它与上一节“父”之间可能存在的词源呼应；抽象译作“父权”或“父性”则解释过度。
- source_word: ἐν οὐρανοῖς
  choice: 天上
  rationale: 希腊文虽用复数οὐρανοῖς，现代汉语在此通常说“天上”，准确指天界。
- source_word: ἐπὶ γῆς
  choice: 地上
  rationale: 这是自然、准确的处所表达，与“天上”形成对称。
- source_word: ὀνομάζεται
  choice: 得名
  rationale: 现在时被动语态直指“被命名、被称名”。“得名”在中文中同时保留命名和名称来源的意味，但不强行阐明具体的派生方式。
theological_decisions:
- issue: πᾶσα πατριὰ与上一节“父”的关系
  choice: 各家
  alternative: 全家；一切父性（或父权）
  rationale: “各家”保留πᾶσα可能的分配义以及πατριά通常所指的家族群体，也避免预先断定保罗所说的是天上地上合成的一个“全家”。原文可能借πατήρ与πατριά形成文字呼应，但把它抽象化为“一切父性”会超出该名词最通常的语义，因此仅在脚注中提示。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“天上地上的各家”保持原文紧凑结构；“得名”比“被命名”更自然，也保留来源意味。脚注呈现“全家”和抽象的父系关系两种可能，避免在正文中消除原文的语义张力。
