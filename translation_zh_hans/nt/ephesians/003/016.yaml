id: EPH.3.16
reference: Ephesians 3:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἵνα ⸀δῷ ὑμῖν κατὰ ⸂τὸ πλοῦτος⸃ τῆς δόξης αὐτοῦ δυνάμει κραταιωθῆναι διὰ τοῦ πνεύματος αὐτοῦ εἰς τὸν ἔσω ἄνθρωπον,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/016.yaml
  text: that he may grant you[a], according to the riches of his glory, to be strengthened with power through his Spirit in the inner man,
translation:
  language: zh_hans
  text: 求他照着他荣耀的丰盛，借着他的灵，以大能使你们内在的人[a]刚强起来，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “内在的人”也可译作“里面的人”，指人的内在自我。希腊原文采用代表性单数，并非只指男性。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δῷ ὑμῖν
  choice: 求他……使你们
  rationale: ἵνα承接前文祷告的内容，δῷ为虚拟语气；中文以“求他”自然表达保罗的祈求，并以“使你们”承接所赐的结果。
- source_word: κατὰ τὸ πλοῦτος τῆς δόξης αὐτοῦ
  choice: 照着他荣耀的丰盛
  rationale: κατά加宾格表示尺度或准则；“照着”保留此义，避免“从……中”可能暗示只取一部分。πλοῦτος虽为单数，却表达丰富充裕，译作“丰盛”较符合现代汉语。
- source_word: δυνάμει
  choice: 以大能
  rationale: 与κραταιωθῆναι紧密相连，表示使人刚强的能力或凭借；“以大能”既自然，也保留δύναμις的力度。
- source_word: κραταιωθῆναι
  choice: 刚强起来
  rationale: 该被动不定式表示得到力量、变得强壮；结合“使”构成中文使动表达，既体现外来施力，也避免生硬的被动句。
- source_word: διὰ τοῦ πνεύματος αὐτοῦ
  choice: 借着他的灵
  rationale: διά加属格表示媒介或施行者；“借着”准确表达此关系。上下文指向上帝的灵。
- source_word: εἰς τὸν ἔσω ἄνθρωπον
  choice: 内在的人
  rationale: εἰς在此指刚强所达到的内在人格或内在自我。“内在的人”保留ἄνθρωπος的代表性单数和保罗用语的具体意象，同时不误解为只指男性。
theological_decisions:
- issue: πνεῦμα的所指
  choice: 他的灵，即上帝的灵
  alternative: 泛指来自上帝的非人格性属灵力量
  rationale: “他的”回指上帝，且保罗书信的用法和此处神圣行动的语境强烈支持上帝之灵为施行者；译文仍仅按原文写“他的灵”，不额外加入“圣”字。
- issue: ἔσω ἄνθρωπον的含义
  choice: 内在的人
  alternative: 内心；里面的人
  rationale: 该短语指人的内在自我，不是男性专称。“内在的人”保留原文人物化、代表性单数的表达，也避免把含义缩减为情感意义上的“内心”。
- issue: 能力、圣灵与刚强之间的关系
  choice: 借着他的灵，以大能使人刚强
  alternative: 把“大能”直接理解为“灵”的同位说明
  rationale: 语法上δυνάμει最自然地修饰“使刚强”，而διὰ τοῦ πνεύματος说明媒介或施行者；译文维持二者相关但不等同的关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“荣耀的丰盛”保留保罗式神学表达；“刚强起来”比“被加强”自然，并借助“使”保留被动含义。句末逗号表明本节在原文中仍属于跨节延续的祷告句。
