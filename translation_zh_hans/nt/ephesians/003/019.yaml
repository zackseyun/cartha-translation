  text: γνῶναί τε τὴν ὑπερβάλλουσαν τῆς γνώσεως ἀγάπην τοῦ Χριστοῦ, ἵνα πληρωθῆτε εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/019.yaml
  text: and to know the love of Messiah that surpasses knowledge[b][a], so that you may be filled unto all the fullness of God.
translation:
  language: zh_hans
  text: 也知道那超越知识的弥赛亚的爱[a]，使你们得以充满，达到上帝一切的丰盛[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按传统译作“基督的爱”。
    reason: alternative_reading
  - marker: b
    text: 或译：“被上帝一切的丰盛充满。”希腊文在“被充满”之后用“进入／达到”引出“上帝一切的丰盛”，是浓缩的表达，可能强调朝向上帝丰盛的完全程度。
    reason: lexical_alternative
lexical_decisions:
- source_word: γνῶναί
  choice: 知道
  rationale: 直接对应γινώσκω，并保留在语境中既可指认知、也可含亲身认识的意味。
- source_word: τε
  choice: 也
  rationale: 轻度连接本句与前文祷告中的并列事项；“也”符合现代汉语表达。
- source_word: ὑπερβάλλουσαν τῆς γνώσεως
  choice: 超越知识
  rationale: 保留“知道”与“知识”之间有意形成的悖论，也不把超越的范围解释性地限缩为人的理解能力。
- source_word: ἀγάπην τοῦ Χριστοῦ
  choice: 弥赛亚那……的爱
  rationale: Χριστός在此保留其称号意义，译作“弥赛亚”；属格结构不在正文中明确限定为弥赛亚对人的爱或人对弥赛亚的爱。
- source_word: ἵνα
  choice: 使
  rationale: 自然表达此从句的目的或结果关系。
- source_word: πληρωθῆτε
  choice: 得以充满
  rationale: 用自然汉语表达被动的“被充满”之意，避免生硬直译。
- source_word: εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ
  choice: 达到上帝一切的丰盛
  rationale: “达到”体现εἰς朝向目标或程度的方向性；“上帝一切的丰盛”保留原文浓缩而宏大的表达。
theological_decisions:
- issue: Χριστοῦ的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: Χριστός在此仍具有称号含义；正文译出其“受膏者／弥赛亚”的意义，同时以脚注注明传统译法。
- issue: “弥赛亚的爱”的属格关系
  choice: 保留为“弥赛亚……的爱”
  alternative: 弥赛亚对人的爱；人对弥赛亚的爱
  rationale: 上下文较支持弥赛亚对信徒的爱，但原文属格本身未明说其主客关系，因此不在正文中彻底消除这一张力。
- issue: εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ的含义
  choice: 充满，达到上帝一切的丰盛
  alternative: 被上帝一切的丰盛充满
  rationale: 保留εἰς的方向和目标意味，不将其直接化为表示内容的“以……充满”，也避免引入关于信徒与上帝本体关系的额外断言。
translation_notes:
  register: 采用庄重而可懂的现代标准汉语。“超越知识”刻意保留保罗“知道那超越知识之爱”的悖论；“得以充满，达到”兼顾汉语自然度与原文的被动、目标性表达。
