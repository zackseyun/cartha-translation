id: EPH.3.10
reference: Ephesians 3:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἵνα γνωρισθῇ νῦν ταῖς ἀρχαῖς καὶ ταῖς ἐξουσίαις ἐν τοῖς ἐπουρανίοις διὰ τῆς ἐκκλησίας ἡ πολυποίκιλος σοφία τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/010.yaml
  text: so that now[a], through the church, the manifold wisdom of God might be made known to the rulers and the authorities in the heavenly realms[c][b],
translation:
  language: zh_hans
  text: 为要使上帝丰富多样的智慧[a]，如今借着教会，显明给天上[c]的执政者和掌权者[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“上帝百般多样的智慧”。原文用词强调这智慧具有许多层面，丰富多彩。
    reason: lexical_alternative
  - marker: b
    text: “执政者和掌权者”在这里很可能指宇宙性或属灵的权势，而不只是人间的当权者。
    reason: cultural_note
  - marker: c
    text: 也可译作“属天的领域中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα γνωρισθῇ
  choice: 为要使……显明给
  rationale: ἵνα引出目的，γνωρισθῇ为不定过去时被动虚拟语气；此译保留目的关系和被动含义，同时符合现代汉语表达。
- source_word: νῦν
  choice: 如今
  rationale: 直接表达当前时点，并与本段所述现今展开的神圣计划相衔接。
- source_word: ταῖς ἀρχαῖς καὶ ταῖς ἐξουσίαις
  choice: 执政者和掌权者
  rationale: 保留两个并列称谓及其权柄语义，不在正文中进一步限定其具体类别；上下文中的“天上”表明这里主要指宇宙性的属灵权势。
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: 天上
  rationale: 这是《以弗所书》反复使用的表达，指属天的领域；“天上”自然简洁，脚注保留较明确的空间性译法。
- source_word: διὰ τῆς ἐκκλησίας
  choice: 借着教会
  rationale: διά加属格表示途径或媒介；“借着”准确传达工具性含义。
- source_word: ἡ πολυποίκιλος σοφία τοῦ θεοῦ
  choice: 上帝丰富多样的智慧
  rationale: πολυποίκιλος表示多样、多方面而丰富；“丰富多样”既通顺，又保留其多重层面的意象。
theological_decisions:
- issue: “执政者和掌权者”的身份
  choice: 正文保留权势称谓，并由“天上”提示其为宇宙性或属灵权势
  alternative: 专指人间统治者；或广泛包括人间与属灵的一切权势
  rationale: 保罗常将ἀρχαί与ἐξουσίαι并用来指超越人类的权势，而ἐν τοῖς ἐπουρανίοις进一步支持属天或属灵的所指；但正文不擅自将其具体化为某一类天使或邪灵。
- issue: 教会在智慧显明中的作用
  choice: 教会是上帝显明其智慧所借用的媒介
  alternative: 教会主动向这些权势宣讲上帝的智慧
  rationale: διὰ τῆς ἐκκλησίας明确表达媒介，γνωρισθῇ则为被动形式；译文不额外规定教会以何种具体行动完成这一作用。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“执政者和掌权者”延续圣经语域，但仍可由一般读者理解；以脚注说明其属灵语境和关键词的可选译法。
