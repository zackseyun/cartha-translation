id: EPH.3.18
reference: Ephesians 3:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἵνα ἐξισχύσητε καταλαβέσθαι σὺν πᾶσιν τοῖς ἁγίοις τί τὸ πλάτος καὶ μῆκος καὶ ⸂ὕψος καὶ βάθος⸃,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/018.yaml
  text: so that you may be strong enough to comprehend[a], together with all the saints, what is the width and length and height and depth[b],
translation:
  language: zh_hans
  text: 使你们能有足够的力量，与众圣徒一同领会那宽度[a]、长度、高度和深度究竟是什么[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宽度”也可译作“广度”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文没有明说这些维度描述的是什么；许多人认为，下节所说弥赛亚的爱补全了这里的意思。
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: 使
  rationale: 引出承接上文祷告的目的或结果，简洁保留其目的性。
- source_word: ἐξισχύσητε
  choice: 能有足够的力量
  rationale: 该动词强调具备足以完成随后行动的力量或能力；此译法保留“足以”的含义。
- source_word: καταλαβέσθαι
  choice: 领会
  rationale: 此处指在心智与属灵层面把握、理解；“领会”庄重自然，又不把意义缩减为单纯获取知识。
- source_word: σὺν πᾶσιν τοῖς ἁγίοις
  choice: 与众圣徒一同
  rationale: 保留 σύν 所表达的共同参与，也沿用保罗书信中对信徒的惯常称谓“圣徒”。
- source_word: τί
  choice: 究竟是什么
  rationale: 明确表达间接问句的内容，同时让四个维度所描述的对象保持未明说；“究竟”使现代汉语句式自然，但不指定答案。
- source_word: τὸ πλάτος
  choice: 那宽度
  rationale: “宽度”是现代汉语中直接、自然的维度用语；定指词“那”对应希腊文冠词，并提示这是有待领会的所指。
- source_word: μῆκος
  choice: 长度
  rationale: 直接对应表示维度的 μῆκος，并与其余三个名词构成整齐并列。
- source_word: ὕψος
  choice: 高度
  rationale: 直接对应表示维度的 ὕψος。
- source_word: βάθος
  choice: 深度
  rationale: 直接对应表示维度的 βάθος。
theological_decisions:
- issue: 四个维度所描述的对象
  choice: 正文不补出这些维度属于什么，只译为“那宽度、长度、高度和深度”。
  alternative: 补译为“弥赛亚之爱的宽度、长度、高度和深度”，或理解为上帝的救赎计划或丰盛。
  rationale: 本节希腊文本没有明说这四个维度的所指。虽然下节提到弥赛亚的爱，但在这里补出该对象会提前解决原文保留的解释张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“能有足够的力量”保留能力充足之意；“与众圣徒一同”突出共同领会。四个维度统一用“度”结尾，以符合现代汉语表达，同时不在正文中补明其所指。
source_grounding:
  english_pob_role: consult_only
