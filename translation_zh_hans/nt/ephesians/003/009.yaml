  text: καὶ φωτίσαι ⸀πάντας τίς ἡ οἰκονομία τοῦ μυστηρίου τοῦ ἀποκεκρυμμένου ἀπὸ τῶν αἰώνων ἐν τῷ θεῷ τῷ τὰ πάντα ⸀κτίσαντι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/009.yaml
  text: and to bring to light for everyone what is the administration of the mystery hidden from the ages in God[a], who created all things[b],
translation:
  language: zh_hans
  text: 并使众人都看明：这历世以来一直隐藏在创造万物的上帝里面的奥秘，究竟有怎样的安排[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安排”或译“管理”“经管”，也可理解为“计划”。
    reason: lexical_alternative
lexical_decisions:
- source_word: φωτίσαι
  choice: 使……看明
  rationale: 保留“照亮、使显明”的意象，同时以现代汉语自然表达使人认识后接内容的意思。
- source_word: πάντας
  choice: 众人都
  rationale: 明确其所指为所有人，并在汉语中自然表达普遍范围。
- source_word: τίς ἡ οἰκονομία
  choice: 究竟有怎样的安排
  rationale: οἰκονομία可指管理、施行安排或计划；“安排”保留其具体实施层面，又不引入后世的专门神学体系。
- source_word: μυστήριον
  choice: 奥秘
  rationale: 符合保罗书信中指上帝曾隐藏、如今显明之旨意的惯常用法，也保留其神学内涵。
- source_word: ἀποκεκρυμμένου
  choice: 一直隐藏
  rationale: 表达完成时被动分词所含的持续隐藏状态；“一直”也与时间短语自然衔接。
- source_word: ἀπὸ τῶν αἰώνων
  choice: 历世以来
  rationale: 贴近原文“从诸世代以来”的表达，既体现长久隐藏，又不把它明确解释为抽象的“永恒”。
- source_word: ἐν τῷ θεῷ
  choice: 在……上帝里面
  rationale: 直接保留ἐν的空间性隐喻，避免弱化为仅仅“在上帝那里”。
- source_word: τῷ τὰ πάντα κτίσαντι
  choice: 创造万物的上帝
  rationale: 将带冠词的分词短语自然处理为修饰“上帝”的定语，并按τὰ πάντα译作“万物”。
theological_decisions:
- issue: οἰκονομία与奥秘的关系
  choice: 安排
  alternative: 管理；管家职分；计划
  rationale: 原词既可侧重管理施行，也可指安排或计划。“安排”在现代汉语中较自然，并保留究竟指计划本身还是其施行方式的张力。
- issue: ἀπὸ τῶν αἰώνων的时间含义
  choice: 历世以来
  alternative: 历世以来一直；从永恒以来
  rationale: 原文明确提到“诸世代”，却没有直接使用“永恒”一词，因此不将时间含义解释得更绝对。
- issue: 奥秘隐藏之所在
  choice: 隐藏在……上帝里面
  alternative: 藏在上帝那里
  rationale: 保留原文ἐν τῷ θεῷ较强的“在上帝里面”措辞，不替保罗消解其神学表达。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“使众人都看明”保留光照与显明的意象；全句调整为符合汉语习惯的主题—述说结构，同时维持“奥秘—隐藏—安排”之间的修饰关系。
