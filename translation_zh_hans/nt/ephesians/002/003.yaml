id: EPH.2.3
reference: Ephesians 2:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐν οἷς καὶ ἡμεῖς πάντες ἀνεστράφημέν ποτε ἐν ταῖς ἐπιθυμίαις τῆς σαρκὸς ἡμῶν, ποιοῦντες τὰ θελήματα τῆς σαρκὸς καὶ τῶν διανοιῶν, καὶ ⸀ἤμεθα τέκνα φύσει ὀργῆς ὡς καὶ οἱ λοιποί·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/003.yaml
  text: among whom we all also once lived in the desires of our flesh[a], fulfilling the desires of the flesh and of the mind, and we were by nature children of wrath[e][d][c][b], just as the rest were.
translation:
  language: zh_hans
  text: 我们从前也都在他们中间[a]，随着自己肉体的欲望行事，实行肉体和心思的意愿；我们本性上是愤怒之子[b]，和其余的人一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“在其中”。希腊文可指前文所说悖逆的人，也可指与他们相关的境况或范围；此处按上下文译作“在他们中间”。
    reason: 保留关系代词 ἐν οἷς 的可能指涉。
  - marker: b
    text: “愤怒之子”是希腊文习语，也可译作“承受愤怒的人”或“愤怒的对象”。
    reason: 说明 τέκνα ὀργῆς 的习语，并提供不预断其神学细节的替代译法。
lexical_decisions:
- source_word: ἐν οἷς
  choice: 在他们中间
  rationale: 将关系代词理解为回指上一节的“悖逆之子”，在中文中自然表达其人称所指；希腊文也可能回指前述境况，另以脚注保留。
- source_word: ἀνεστράφημέν ποτε
  choice: 从前……生活
  rationale: ἀναστρέφω在这里指人的生活方式，ποτε标明过去的状态；“从前……生活”自然且准确。
- source_word: ἐπιθυμίαις
  choice: 欲望
  rationale: 涵盖各种失序的渴求，不把含义缩窄为性欲。
- source_word: σάρξ
  choice: 肉体
  rationale: 保留保罗的关键用语及其伦理和人论张力，不直接解释为“罪性”。
- source_word: ποιοῦντες τὰ θελήματα
  choice: 行……所想要的
  rationale: 既表达ποιοῦντες的实际实行，又让现代中文读者自然理解θελήματα所含的意愿、意向之义。
- source_word: τῶν διανοιῶν
  choice: 各种意念
  rationale: 复数形式指多种思想、意向或心思活动；“各种意念”保留复数意味并适合上下文。
- source_word: τέκνα φύσει ὀργῆς
  choice: 生来就是可怒之子
  rationale: “可怒之子”保留希腊文闪语式表达，不径直化约为“受愤怒的对象”；“生来”在自然中文中表达φύσει，同时保留其先天状态的力度。
- source_word: οἱ λοιποί
  choice: 其余的人
  rationale: 自然表达基督之外其余人类的比较范围。
theological_decisions:
- issue: 伦理语境中σάρξ的译法
  choice: 肉体
  alternative: 罪性
  rationale: 此处虽有明确伦理意味，但译作“罪性”会预先限定保罗的人论；“肉体”保留原词及其神学张力。
- issue: τέκνα φύσει ὀργῆς的含义
  choice: 生来就是可怒之子
  alternative: 本是震怒的对象
  rationale: 主文保留“……之子”的原文习语，不替读者裁定它主要强调人的性质、处境，还是承受审判的身份。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“随从……欲望生活”避免生硬直译，“行……所想要的”区分前面的“欲望”与θελήματα的意愿含义。主文只设一处脚注，并确保标记[a]已出现在正文中。
