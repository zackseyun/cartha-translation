id: EPH.2.12
reference: Ephesians 2:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅτι ⸀ἦτε τῷ καιρῷ ἐκείνῳ χωρὶς Χριστοῦ, ἀπηλλοτριωμένοι τῆς πολιτείας τοῦ Ἰσραὴλ καὶ ξένοι τῶν διαθηκῶν τῆς ἐπαγγελίας, ἐλπίδα μὴ ἔχοντες καὶ ἄθεοι ἐν τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/012.yaml
  text: that at that time you were without Messiah[a], alienated from the commonwealth of Israel and strangers to the covenants of the promise[c][b], having no hope and without God in the world.
translation:
  language: zh_hans
  text: 那时，你们与弥赛亚无分[a]，与以色列共同体隔绝，对于那应许的诸约，你们是外人[b]，没有盼望，在世上也没有上帝[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“与基督无分”。希腊语Χριστός既可译作“基督”，也可按其称号含义译作“弥赛亚”；这里的以色列和诸约语境使“弥赛亚”的含义较为突出。
    reason: alternative_reading
  - marker: b
    text: “那应许的诸约”也可译作“应许之约”。原文“诸约”为复数，“应许”为单数。
    reason: lexical_alternative
  - marker: c
    text: 或译“无神”。这里可能是说他们与真神无分，并非特指现代意义上的哲学无神论。
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς Χριστοῦ
  choice: 与弥赛亚无分
  rationale: Χριστός在这里具有称号意味，并处于以色列及诸约的语境中；“弥赛亚”保留其犹太背景。“无分”自然表达χωρίς所指的分离状态，同时不把它窄化为地理上的远离。
- source_word: ἀπηλλοτριωμένοι τῆς πολιτείας τοῦ Ἰσραήλ
  choice: 与以色列共同体隔绝
  rationale: 完成时被动分词描述一种已经形成并持续的隔绝状态；πολιτεία在这里可指以色列的公民共同体或社会政治秩序。“共同体”比单纯的个人“公民权”更能保留其群体含义。
- source_word: ξένοι τῶν διαθηκῶν τῆς ἐπαγγελίας
  choice: 对于那应许的诸约，你们是外人
  rationale: 保留διαθηκῶν的复数和ἐπαγγελίας的单数，并以“外人”表达不属于这些约所界定范围的身份。
- source_word: ἐλπίδα μὴ ἔχοντες
  choice: 没有盼望
  rationale: 用自然简洁的现代汉语表达分词所描述的伴随状态。
- source_word: ἄθεοι ἐν τῷ κόσμῳ
  choice: 在世上也没有上帝
  rationale: 这里重点是他们与真神无分的处境，不宜直接套用现代哲学意义上的“无神论者”；译文保留原语简洁而尖锐的表述。
- source_word: ὅτι ἦτε τῷ καιρῷ ἐκείνῳ
  choice: 那时，你们……
  rationale: ὅτι承接前文“要记得”，本节汉语省去不自然的从属连词，以“那时”清楚标明过去的处境。
theological_decisions:
- issue: Χριστός在保罗书信此处的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 上下文紧接以色列、诸约和应许，称号含义突出；“弥赛亚”能显明受膏者称号的犹太—圣约背景，同时脚注保留传统译法。
- issue: ἄθεοι的含义
  choice: 没有上帝
  alternative: 无神；不敬神
  rationale: 不将该词无依据地限定为现代意义上的哲学无神论，也不把它完全解释成道德上的不敬虔；正文保留“没有神”的关系性与神学张力。
- issue: διαθηκῶν τῆς ἐπαγγελίας的属格关系
  choice: 那应许的诸约
  alternative: 应许之约；带着应许的诸约
  rationale: 保留“约”的复数与“应许”的单数，不将两者改写为多个“约中应许”，从而避免消除原文属格结构的含蓄性。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。句式保留原文连续列举外邦人从前处境的力度；“共同体”“外人”“诸约”兼顾公共身份与圣约语境。所有脚注标记均按正文出现次序列出。
