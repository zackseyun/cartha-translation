    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἐξ
  choice: 不是出于
  rationale: οὐκ否定ἐξ ἔργων；“不是出于”自然保留ἐξ所表达的来源、根源含义，并与上下文衔接。
- source_word: ἔργων
  choice: 行为
  rationale: “行为”简洁对应ἔργων，且不擅自限定为“律法的行为”“善行”或泛化为“人的努力”。
- source_word: ἵνα μή
  choice: 免得
  rationale: “免得”自然表达否定性的目的或结果，同时不必强行判定二者中的一种。
- source_word: τις
  choice: 有人
  rationale: 在“免得”之后，“有人”准确传达不定代词的泛指意义，不带性别限定。
- source_word: καυχήσηται
  choice: 自夸
  rationale: “自夸”准确传达καυχάομαι在此处的夸耀含义，也符合现代汉语表达；虚拟语气由“免得”所引出的结构体现。
theological_decisions:
- issue: “行为”的范围
  choice: 保留宽泛的“行为”，不在正文中进一步限定。
  alternative: 译作“律法的行为”“善行”或“人的努力”。
  rationale: 希腊文本仅有ἔργων。增加限定会把释义带入译文，并消解原文简洁表述所保留的解释空间。
- issue: ἵνα μή所表达的逻辑关系
  choice: 译作“免得”，保留否定目的及其可能兼有的结果意味。
  alternative: 明确译作“为要使任何人都不能自夸”或“结果就没有人自夸”。
  rationale: ἵνα可表达目的或结果；“免得”在中文中自然且不必过度判定。
translation_notes:
  register: 采用现代、简洁而庄重的标准普通话。“不是出于行为”保留原文来源性的表达；“免得有人自夸”自然清楚，并适合作为紧接上文的短句。
