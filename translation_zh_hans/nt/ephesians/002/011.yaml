  text: Διὸ μνημονεύετε ὅτι ⸂ποτὲ ὑμεῖς⸃ τὰ ἔθνη ἐν σαρκί, οἱ λεγόμενοι ἀκροβυστία ὑπὸ τῆς λεγομένης περιτομῆς ἐν σαρκὶ χειροποιήτου,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/011.yaml
  text: Therefore remember that formerly you[a], the Gentiles in the flesh[d][c][b], who are called “uncircumcision” by what is called “circumcision,” made by hands in the flesh—
translation:
  language: zh_hans
  text: 所以你们要记得：从前你们按肉身是外邦人，被那所谓“受割礼的人”称为“未受割礼的人”；他们所受的割礼是在肉身上由人手施行的——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὸ
  choice: 所以
  rationale: 承接上文作推论，现代汉语中自然清楚。
- source_word: μνημονεύετε
  choice: 要记得
  rationale: 表达现在时复数命令的持续劝诫意味，同时避免生硬直译。
- source_word: ποτὲ ὑμεῖς
  choice: 从前你们
  rationale: 保留时间对比，并以自然汉语凸显“你们”。
- source_word: τὰ ἔθνη ἐν σαρκί
  choice: 按肉身说是外族人
  rationale: ἔθνη在此指非犹太人；“按肉身说”保留身体与族群身份层面的限定，不赋予σάρξ道德含义。
- source_word: οἱ λεγόμενοι ἀκροβυστία
  choice: 被……称为“未受割礼的”
  rationale: 保留被动的社会标签；用引号表明这是群体称谓，不只是身体描述。
- source_word: ὑπὸ τῆς λεγομένης περιτομῆς
  choice: 被那所谓“受割礼的”称为
  rationale: 将抽象名词按其群体指称功能译出，并以“所谓”保留λεγομένης所传达的修辞距离。
- source_word: ἐν σαρκὶ χειροποιήτου
  choice: 他们的割礼是在肉身上由人手施行的
  rationale: 明确该短语修饰“割礼”，保留“肉身”和“人手所作”的双重强调，同时符合现代汉语表达。
theological_decisions:
- issue: σάρξ在非道德语境中的译法
  choice: 肉身
  alternative: 身体；肉体
  rationale: 这里谈的是身体可见的族群与礼仪身份，不是罪性；“肉身”既保留原词，又不替保罗消解其与后文的呼应。
- issue: λεγομένης περιτομῆς的语气
  choice: 所谓“受割礼的”
  alternative: 那称为“割礼”的；受割礼的人
  rationale: “所谓”保留两个“被称为/所谓”之间的修辞对称及对外在标志的审视，但不强化为讥讽或反犹太语气。
- issue: περιτομή与ἀκροβυστία作为群体标签
  choice: “受割礼的”与“未受割礼的”
  alternative: “割礼”与“未割礼”
  rationale: 汉语若照搬抽象名词会晦涩；用“……的”自然表达以礼仪标志指称群体，同时由脚注说明其盟约与族群内涵。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。本节在希腊文中是未完句，结尾保留破折号以衔接下一节；重复“肉身”以保持原文刻意的首尾呼应。
