revisions:
- from: 所以你们要记得：从前你们按肉身说是外族人，被那所谓“受割礼的”称为“未受割礼的”；他们的割礼是在肉身上由人手施行的[a]——
  to: 所以你们要记得：从前你们按肉身是外邦人，被那所谓“受割礼的人”称为“未受割礼的人”；他们所受的割礼是在肉身上由人手施行的——
  rationale: 将τὰ ἔθνη修订为“外邦人”，使其符合本节的犹太—非犹太族群语境；调整语序和群体称谓，使现代汉语更完整自然。保留“肉身”、两组带引号的社会标签、“所谓”及“由人手施行”，并保留原文未完句的破折号。
