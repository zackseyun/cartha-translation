review_pass:
  verdict: revise
  source_fidelity: “外族人”未能准确体现此处τὰ ἔθνη在犹太—非犹太族群对照中的通常含义，宜译为“外邦人”。原译以分号另起“他们的割礼……”虽传达了χειροποιήτου修饰割礼的意思，但使原文附属于“割礼”的修饰语显得过于独立；修订以“他们所受的割礼”使其与称谓者明确关联。
  naturalness: “从前你们按肉身说是外族人”略显拗口；“从前你们按肉身是外邦人”更自然、庄重。将群体标签明确作“受割礼的人／未受割礼的人”，也比单用“……的”更完整易懂。
  terminology: 采用“外邦人”对应此处指非犹太人的ἔθνη；保留“肉身”“割礼”及“由人手施行”。“所谓”对应λεγομένης所保留的修辞距离，但不把它解释为确定的讥讽。
  issues:
  - severity: medium
    issue: “外族人”不够准确
    rationale: 在本节犹太人与非犹太人的语境中，τὰ ἔθνη应译为“外邦人”，而非泛指其他族群的“外族人”。
  - severity: low
    issue: 末句的修饰关系在汉语中不够紧密
    rationale: “他们的割礼是在肉身上由人手施行的”作为分号后的独立分句，弱化了原文中该语对“割礼”称谓的限定；调整措辞可改善关联，同时不牺牲可读性。
  revised_text: 所以你们要记得：从前你们按肉身是外邦人，被那所谓“受割礼的人”称为“未受割礼的人”；他们所受的割礼是在肉身上由人手施行的——
  revised_footnotes:
  - marker: a
