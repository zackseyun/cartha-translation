  text: ἄρα οὖν οὐκέτι ἐστὲ ξένοι καὶ πάροικοι, ἀλλὰ ⸀ἐστὲ συμπολῖται τῶν ἁγίων καὶ οἰκεῖοι τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/019.yaml
  text: So then[a], you are no longer strangers and resident foreigners, but you are fellow citizens with the saints and members of God's household[c][b],
translation:
  language: zh_hans
  text: 因此，你们不再是外人和寄居者[a]，而是与圣徒[b][c]同享公民身份，也是上帝家中的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄居者”指住在当地、却没有完全公民身份的人；也可译作“侨居者”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“与圣徒同为公民”。原文强调如今与上帝的圣洁子民共享公民身份。
    reason: lexical_alternative
  - marker: c
    text: 这里的“圣徒”是指归给上帝的圣洁子民，并非专指后来经封圣的一类人。
    reason: cultural_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: 因此
  rationale: 两个推论性连接词共同引出由上文所得的结论；“因此”在现代汉语中自然、庄重，也保留了明确的承接和推论作用。
- source_word: οὐκέτι
  choice: 不再
  rationale: 准确表达身份或处境已经发生改变的时间性否定。
- source_word: ξένοι
  choice: 外人
  rationale: 表示不属于某一群体的人；“外人”既保留疏离感，也与后文“上帝家里的人”形成鲜明对照。
- source_word: πάροικοι
  choice: 寄居者
  rationale: 指住在当地却没有完整公民身份的人。“寄居者”保留居住与非正式归属这两层含义；脚注补明其社会法律色彩。
- source_word: συμπολῖται
  choice: 同为公民
  rationale: 该复合词强调共同享有公民身份。“同为公民”既准确又符合现代汉语表达。
- source_word: τῶν ἁγίων
  choice: 与圣徒
  rationale: 属格在此可自然理解为共同关系，即“与圣徒同为公民”；同时以脚注保留较贴近形式的“圣徒的同胞公民”这一可能表达。
- source_word: οἰκεῖοι
  choice: 家里的人
  rationale: 指属于一个家或家族共同体的人。“上帝家里的人”自然地传达归属和亲密关系，比抽象的“家庭成员”更能保留原文的家庭隐喻。
- source_word: τοῦ θεοῦ
  choice: 上帝
  rationale: 作为属格限定οἰκεῖοι，表示这个家属于上帝；汉语用“上帝家里的人”自然表达这一关系。
theological_decisions:
- issue: “圣徒”（τῶν ἁγίων）的所指
  choice: 正文保留“圣徒”，泛指分别归给上帝的圣洁子民，不进一步限定其范围
  alternative: 专指天使、犹太信徒，或明确解释为所有信徒
  rationale: 上下文强调原先在外的外族信徒如今被纳入上帝的子民和家中，但本节本身没有把“圣徒”的范围明确限定为某一较窄群体；保留该称谓可避免替原文消除其解释张力。
- issue: τῶν ἁγίων与συμπολῖται的关系
  choice: 译为“与圣徒同为公民”
  alternative: 译为“圣徒的同胞公民”或“圣徒中的公民”
  rationale: 属格可表达共同归属；“与……同为公民”最自然地呈现读者与上帝圣洁子民共享公民身份的意思，同时在脚注中保留更贴近希腊语形式的译法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“外人—公民—家里的人”依次保留原文从社会疏离、公民归属到家庭归属的双重隐喻；避免使用现代政治色彩过强或过度制度化的措辞。
