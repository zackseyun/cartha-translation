id: EPH.2.18
reference: Ephesians 2:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅτι δι’ αὐτοῦ ἔχομεν τὴν προσαγωγὴν οἱ ἀμφότεροι ἐν ἑνὶ πνεύματι πρὸς τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/018.yaml
  text: For through him we both have access in one Spirit to the Father[a][b][c].
translation:
  language: zh_hans
  text: 因为[a]借着他，我们双方都在同一位圣灵里[c]，得以来到[b]父面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因为”也可译作“原来”；这里的连接词说明前一句所述和平与和好的根据。
    reason: lexical_alternative
  - marker: b
    text: “得以来到”也可译作“得以亲近”或“得以被引到”。原词既可表示通达，也可表示被引见到尊者面前。
    reason: lexical_alternative
  - marker: c
    text: “在同一位圣灵里”也可译作“借着同一位圣灵”；“在……里”保留了希腊文的措辞，既可能表示途径，也可能表示双方共同参与的范围。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 本词在上下文中说明前一句所述和平与和好的根据；“因为”在现代汉语中自然地表达这种因由或解释关系。
- source_word: δι’ αὐτοῦ
  choice: 借着他
  rationale: διά加属格表示途径或中介；“借着他”保留基督作为中保、使人得以到父面前的含义。
- source_word: ἔχομεν
  choice: 得以
  rationale: 结合汉语表达“来到父面前”，“得以”自然传达当前已经享有的资格和可能性，而不是仅指将来的行动。
- source_word: τὴν προσαγωγὴν
  choice: 得以来到……面前
  rationale: προσαγωγή可指获准接近、进入某位尊者面前；此译既表达所享有的通达，也保留朝向父同在的意象。
- source_word: οἱ ἀμφότεροι
  choice: 我们双方都
  rationale: 指上文原本分隔的犹太人与外族人；“我们双方都”保留第一人称的共同身份，又不把所指对象直接增补进正文。
- source_word: ἐν ἑνὶ πνεύματι
  choice: 在同一位圣灵里
  rationale: 上下文中“他—圣灵—父”的结构表明πνεῦμα最可能指圣灵；“在……里”保留ἐν的措辞及其可能兼具范围与途径的含义，“同一位”也自然表达双方共享一位圣灵。
- source_word: πρὸς τὸν πατέρα
  choice: 到父面前
  rationale: πρός加宾格表示朝向并进入一位有位格者的临在；“到父面前”比单纯“到父那里”更能呈现获准亲近的语境，同时不增添原文没有的“神”字。
theological_decisions:
- issue: “同一位圣灵”的所指
  choice: 指圣灵
  alternative: 指双方共有的心灵或精神
  rationale: 以弗所书第二章的近距语境形成“借着他（子）—在同一位圣灵里—到父面前”的结构，因此指圣灵最为自然；不过正文仍保留原文简洁的表达，没有增添解释性称号。
- issue: προσαγωγή的含义
  choice: 双方共同享有来到父面前的通达
  alternative: 由人正式引见到父面前
  rationale: 该词可带有宫廷引见或敬拜中进到神面前的色彩，但本节主要强调两方如今共同获准亲近父；正文避免把意象限定为一次性的正式引见。
- issue: ἐν所表达的关系
  choice: 保留“在……里”，不限定为单纯的工具或途径
  alternative: 译作“借着同一位圣灵”
  rationale: ἐν在这里可能表达途径，也可能表达共同参与的范围；直译为“在同一位圣灵里”可保留这种神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我们双方”承接上文的犹太人与外族人而不在正文中明说；“父”保留原文简洁、亲近的称谓。标点将“在同一位圣灵里”作为共同通达的关键成分突出出来。
