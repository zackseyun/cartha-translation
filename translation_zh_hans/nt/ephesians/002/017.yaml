base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/017.yaml
  text: And he came and proclaimed peace to you who were far away[b][a], and peace to those who were near.
translation:
  language: zh_hans
  text: 他来了，向你们这些远处的人[a]宣告和平[b]，也向那些近处的人宣告和平。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “远处的人”和“近处的人”按上下文分别指从前远离的外邦人和近处的犹太人（参2:11–13）。
    reason: cross_reference
  - marker: b
    text: “宣告和平”也可译作“传报和平的好消息”。原文动词通常指“传报好消息”，但这里的直接宾语是“和平”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: 他来
  rationale: 以自然汉语表达不定过去时分词所带的先行动作或伴随情形，同时保留“来到”的动态意象。
- source_word: εὐηγγελίσατο
  choice: 把……的好消息传给
  rationale: 该动词指传报好消息；此处宾语为“和平”，译作“把和平的好消息传给”既体现动词的福音性含义，也符合现代汉语表达。[b]保留较简练的另一译法。
- source_word: εἰρήνην
  choice: 和平
  rationale: 直接对应原词，并能在上下文中承载人与上帝、群体彼此和好的丰富含义，而不把这些含义全部明说出来。
- source_word: ὑμῖν
  choice: 给你们
  rationale: 按间接受格译出对读者的直接称呼；上下文表明主要指先前远离的外族信徒，但正文不直接替换为该解释。
- source_word: τοῖς μακρὰν
  choice: 这些远方的人
  rationale: 保留“远”的空间隐喻及其关系和圣约层面的意味；“这些”使其与前面的“你们”自然同位。
- source_word: τοῖς ἐγγύς
  choice: 那些近处的人
  rationale: 与“远方的人”形成对称，保留原文的隐喻，不在正文直接解释为犹太人。
- source_word: καὶ ... καὶ
  choice: ……，也……
  rationale: 用现代汉语自然的并列结构表达同一和平信息临到两个群体。
theological_decisions:
- issue: “远方的人”和“近处的人”的身份
  choice: 正文保留远近隐喻，脚注说明按上下文分别指外族人和犹太人。
  alternative: 在正文直译为“你们这些远离的外族人”和“那些亲近的犹太人”。
  rationale: 以弗所书2:11–13清楚支持这一群体对应关系，但本节本身采用“远”“近”的修辞。保留原有措辞可避免把上下文解释直接并入正文。
- issue: 和平的内涵
  choice: 译为“和平”，不在正文限定为人与上帝和好或犹太人与外族人和好中的任何一种。
  alternative: 译为“和好”或扩译为“与上帝和好”。
  rationale: 上下文同时涉及垂直与群体层面的和好；宽广的“和平”保留原词的神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“远方／近处”保留原文对称意象；“把和平的好消息传给”清楚呈现εὐαγγελίζομαι的语义，又避免使用可能让普通读者误以为仅指正式讲道活动的“讲道”。
