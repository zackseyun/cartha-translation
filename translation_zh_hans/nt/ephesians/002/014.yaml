id: EPH.2.14
reference: Ephesians 2:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: αὐτὸς γάρ ἐστιν ἡ εἰρήνη ἡμῶν, ὁ ποιήσας τὰ ἀμφότερα ἓν καὶ τὸ μεσότοιχον τοῦ φραγμοῦ λύσας, τὴν ἔχθραν ἐν τῇ σαρκὶ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/014.yaml
  text: For he himself is our peace[a], who made both one and broke down the dividing wall of the barrier—the hostility—in his flesh[d][c][b],
translation:
  language: zh_hans
  text: 因为他自己就是我们的和平；他使双方合而为一，并在自己的肉身中拆毁了隔断的墙，也就是那敌意[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的语序和标点也可理解为：“并拆毁了隔断的墙，就是在他的肉身中废除了敌意……”，句意延续到下一节。
    reason: syntactic_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: 他自己
  rationale: 保留强调代词的力度，突出基督亲自就是和平，而不只是带来和平的中介。
- source_word: γάρ
  choice: 因为
  rationale: 承接上文并说明理由；现代汉语中“因为”比单独使用“原来”更直接清楚。
- source_word: ἡ εἰρήνη ἡμῶν
  choice: 我们的和平
  rationale: 保留“和平”的名词表达及“我们的”关系，呈现基督本身就是使人和好的和平。
- source_word: τὰ ἀμφότερα
  choice: 双方
  rationale: 原文为“二者／双方”，上下文指犹太人与外族人；正文不额外补入群体名称，以保留原文的简洁。
- source_word: ἓν
  choice: 合而为一
  rationale: 自然表达使双方成为一体的结果，又不把“一”具体解释为某一制度或组织。
- source_word: τὸ μεσότοιχον τοῦ φραγμοῦ
  choice: 隔断的墙
  rationale: μεσότοιχον与φραγμός共同构成隔离屏障的意象；汉语采用凝练表达，避免生硬重复为“屏障的中墙”。
- source_word: λύσας
  choice: 拆毁了
  rationale: 用于墙体时，“拆毁”自然体现解除、破除的动作。
- source_word: τὴν ἔχθραν
  choice: 那敌意
  rationale: “敌意”是现代汉语中清楚而庄重的表达，可涵盖双方之间的敌对状态。
- source_word: ἐν τῇ σαρκὶ αὐτοῦ
  choice: 在自己的肉身中
  rationale: 保留σάρξ的具体身体性和ἐν的形式，不解释成“罪性”；反身领属语在汉语中自然指回主语基督。
theological_decisions:
- issue: “双方”的所指
  choice: 正文译作“双方”，由上下文指向犹太人与外族人
  alternative: 明确译作“犹太人和外族人”
  rationale: 原文只说“二者／双方”；保留简洁措辞，同时上下文已能确定所指。
- issue: σάρξ的译法
  choice: 肉身
  alternative: 身体；借着肉身
  rationale: 此处指基督真实的身体存在及其受死，不是“罪性”；“肉身”既保留词汇形式，也维持神学上的具体性。
- issue: τὴν ἔχθραν的句法关系
  choice: 用“也就是”将“敌意”理解为对隔断之墙的解释，并使“在自己的肉身中”修饰“拆毁”
  alternative: 将“敌意”与后文连接；或理解为位于基督肉身中的敌意
  rationale: 同位解释符合本节语流，也避免误读为敌意存在于基督的肉身之内；同时承认希腊语连续结构可在标点上有不同处理。[a]
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“和平”“肉身”“敌意”保留原文的重要神学词汇；分号呈现理由句内两个紧密相连的宣告。
