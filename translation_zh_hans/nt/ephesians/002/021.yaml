revisions:
- from: 在他里面，整座建筑[a]彼此联结，渐渐长成在主里的圣殿。
  to: 在他里面，整座建筑[a]正被联结在一起，渐渐在主里面长成一座圣殿。
  rationale: 修订仅澄清原文现在时被动分词“被配合／被连接”的语态，并改善“在主里面”在中文句中的附着关系；不改变对基督为先行词、对πᾶσα οἰκοδομή作集合性理解，或对“在主里面”之神学含义所保留的开放性。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:52:06Z'
review_pass:
  verdict: revise
  source_fidelity: 原译准确保留了“在他里面”、集合性“整座建筑”、成长至圣殿以及“在主里”的基本要素，且脚注恰当地保留了πᾶσα οἰκοδομή的分配性读法。不过“彼此联结”未清楚表达现在时被动分词συναρμολογουμένη所含的“被连接／被配合”的语态。
  naturalness: 原句整体可懂，但“整座建筑彼此联结”略显不合中文搭配：建筑整体本身不能很自然地“彼此”联结。改为“正被联结在一起”更自然，也更准确表达组成部分持续被结合的过程。将“在主里面”置于“长成”之前，可避免它在中文中只被理解为紧邻修饰“圣殿”。
  terminology: “他”回指基督、“主”、“圣殿”均合乎现代庄重的圣经汉语用语。“一座圣殿”对应原文不定的ναὸν ἅγιον；“圣殿”在中文中自然包含其神圣属性，无须生硬重复为“神圣的圣殿”。
  issues:
  - severity: medium
    issue: “彼此联结”没有明确表达συναρμολογουμένη的被动语态，且与“整座建筑”的搭配略不自然。
    rationale: συναρμολογουμένη是现在时被动分词，描述建筑的各部分正在被配合、连接成整体。使用“正被联结在一起”既保留进行性和被动性，也使中文句法更清楚。
  - severity: low
    issue: “在主里的圣殿”在中文中可理解，但其与“长成”的关系不如原文清晰。
    rationale: 将其表述为“渐渐在主里面长成一座圣殿”，保留ἐν κυρίῳ的开放性，同时明确其与成长过程的关联，而不把它限缩为“圣殿”的单纯定语。
