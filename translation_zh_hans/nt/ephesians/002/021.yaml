  text: ἐν ᾧ ⸀πᾶσα οἰκοδομὴ συναρμολογουμένη αὔξει εἰς ναὸν ἅγιον ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/021.yaml
  text: in whom the whole building[a], being fitted together, grows into a holy temple in the Lord,
translation:
  language: zh_hans
  text: 在他里面，整座建筑[a]正被联结在一起，渐渐在主里面长成一座圣殿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“每一座建筑”。希腊语可理解为各座建筑，也可理解为一座完整的建筑；正文依照上下文中合一的圣殿意象译作“整座建筑”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: 在他里面
  rationale: 关系代词最自然地回指上一节的基督耶稣；用人格化的“他”保留基督论指向，并以“在……里面”保留保罗措辞的范围与联合含义。
- source_word: πᾶσα οἰκοδομὴ
  choice: 整座建筑
  rationale: 无冠词的单数短语可作“每一座建筑”或“整座建筑”；上下文强调犹太人与外族人在基督里成为一个整体，因此正文采用集合性的理解。
- source_word: συναρμολογουμένη
  choice: 彼此联结
  rationale: 现在时被动分词描写各部分持续被严密组合成一体的过程；“彼此联结”自然地保留建筑意象和整体关系。
- source_word: αὔξει
  choice: 渐渐长成
  rationale: 现在时动词表示持续发展；“渐渐长成”既保留成长意象，也适合中文对建筑最终成为圣殿这一过程的表达。
- source_word: εἰς
  choice: 长成
  rationale: εἰς在此表示目标或结果；将其融入“长成”，自然表达建筑发展而成为圣殿的方向。
- source_word: ναὸν ἅγιον
  choice: 圣殿
  rationale: ναός特指圣所或殿本身，而非整个圣殿区域；中文“圣殿”兼顾其神圣性质，并避免生硬重复为“神圣的圣殿”。
- source_word: ἐν κυρίῳ
  choice: 在主里的
  rationale: 直译保留“主”的称号，也保留该短语可能表达范围、关系或联合的神学宽度。
theological_decisions:
- issue: ᾧ的先行词是基督本人，还是建筑／房角石意象
  choice: 按人格指向译为“在他里面”
  alternative: 按非人格指向译为“在其中”
  rationale: 上一节明确提到基督耶稣自己是房角石，而本段反复使用“在他里面”的基督论表达，因此人格指向最为自然，同时建筑比喻仍然完整。
- issue: πᾶσα οἰκοδομὴ是集合性还是分配性
  choice: 集合性：“整座建筑”
  alternative: 分配性：“每一座建筑”
  rationale: 2:14—22强调双方合为一体，并共同成为神的居所；集合性理解更符合这一文学和神学脉络，但希腊语形式确实容许分配性理解，故列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“整座建筑—彼此联结—渐渐长成—圣殿”保留建筑与成长交叠的比喻；“在主里的圣殿”维持原文结构及其神学张力。
