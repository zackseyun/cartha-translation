  text: καὶ ὄντας ἡμᾶς νεκροὺς τοῖς παραπτώμασιν συνεζωοποίησεν τῷ Χριστῷ— χάριτί ἐστε σεσῳσμένοι—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/005.yaml
  text: even when we were dead in our trespasses[a], he made us alive together with Messiah—by grace you have been saved—
translation:
  language: zh_hans
  text: 即使我们死在过犯中，他仍使我们与弥赛亚[a]一同活过来——你们已经靠着恩典得救了——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。希腊语 Χριστός 意为“受膏者”，相当于“弥赛亚”。
    reason: 说明称号译法，并提供中文圣经传统中的常见译名。
lexical_decisions:
- source_word: ὄντας ἡμᾶς νεκροὺς
  choice: 在我们死……的时候
  rationale: 以时间性表达分词结构，同时“甚至……也”保留语境中隐含的让步意味；“死”如实保留原文的强烈比喻。
- source_word: τοῖς παραπτώμασιν
  choice: 死在过犯中
  rationale: 将与格理解为范围或处境，保留“处于过犯之中而死”的表达，不明确改写为单一的因果关系。
- source_word: συνεζωοποίησεν
  choice: 使我们……一同活过来
  rationale: 兼顾复合动词中“使活”与“一同”的语义，并让后面的与格指出是与谁一同活过来。
- source_word: τῷ Χριστῷ
  choice: 与弥赛亚一同
  rationale: 此处 Χριστός 仍具有称号意义；“弥赛亚”直接呈现“受膏者”的身份，“与”则表达联合、伴同关系。
- source_word: χάριτί
  choice: 靠着恩典
  rationale: 按工具性与格处理；“恩典”是准确且为现代中文读者熟悉的用语。
- source_word: ἐστε σεσῳσμένοι
  choice: 你们已经……得救了
  rationale: “已经……了”表达完成行动所产生的现今状态，并保留被动的“得救”，不擅自说明施救者或方式之外的细节。
theological_decisions:
- issue: Χριστῷ 的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处将 Χριστός 作为具有实际含义的称号来译，显明其弥赛亚身份；脚注同时提供中文圣经传统常用的“基督”。
- issue: χάριτί ἐστε σεσῳσμένοι 的插入语性质
  choice: 保留破折号括出的插入语
  alternative: 不用破折号，将其顺接为主句的一部分
  rationale: 原文突然插入这一陈述，并在后文进一步展开；保留破折号可呈现其修辞突显，而不把神学重点平滑化。
- issue: τοῖς παραπτώμασιν 的与格功能
  choice: 按处境或范围译作“在过犯中”
  alternative: 按原因译作“因过犯”
  rationale: 原文与格可容纳范围、关联乃至原因色彩；正文避免只锁定因果解释，以保留其语义张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“甚至……也”承接上文并体现让步意味；破折号保留保罗插入强调恩典的语气。
