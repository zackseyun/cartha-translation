  text: τῇ γὰρ χάριτί ἐστε σεσῳσμένοι ⸀διὰ πίστεως· καὶ τοῦτο οὐκ ἐξ ὑμῶν, θεοῦ τὸ δῶρον·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/008.yaml
  text: For by grace you have been saved through faith[a], and this is not from yourselves[b]; it is the gift of God.
translation:
  language: zh_hans
  text: 因为你们得救是因着恩典，借着信；这[a]不是出于你们自己，而是上帝的礼物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这”很可能概括前面整件事，即因着恩典、借着信而得救，并非只指“信”本身。
    reason: alternative_reading
lexical_decisions:
- source_word: χάριτί
  choice: 恩典
  rationale: 在保罗书信中，χάρις常指上帝白白赐下的恩惠。“恩典”既保留其惯用的神学含义，也符合现代中文表达。
- source_word: ἐστε σεσῳσμένοι
  choice: 已经得救了
  rationale: 这一迂回完成时结构表达已经成就、其结果持续至今的拯救；“已经得救了”兼顾了已完成的行动和现今仍然有效的状态。
- source_word: διὰ πίστεως
  choice: 借着信
  rationale: διά加属格在这里表示途径或媒介；“借着”准确表达这一关系。πίστις译作“信”，保留保罗常用表达，同时脚注说明“信靠”等可能含义。
- source_word: τοῦτο
  choice: 这
  rationale: 中性指示代词很可能概括前面“靠着恩典、借着信得救”这一整件事，而非仅指阴性名词“恩典”或“信”中的一个。“这”保留原文的简洁及指向上的张力。
- source_word: οὐκ ἐξ ὑμῶν
  choice: 并不是出于你们自己
  rationale: ἐκ表示来源。“出于你们自己”自然地传达这得救的事实并非以读者自身为源头。
- source_word: θεοῦ τὸ δῶρον
  choice: 而是上帝的礼物
  rationale: 原文这一省略系词的名词短语把前述事实认定为来自上帝的礼物；补出“而是”使中文流畅，并与前面的否定形成清楚对照。
theological_decisions:
- issue: τοῦτο（“这”）所指的是恩典、信，还是前述整个得救事实
  choice: 正文保留“这”的概括表达，并在脚注说明它很可能指靠着恩典、借着信得救这一整体事实。
  alternative: 把“这”专指“信”，理解为信本身是上帝的礼物；或把“这”专指“恩典”。
  rationale: τοῦτο是中性，而χάρις和πίστις都是阴性，因此从语法和语篇看，它较自然地概括前面的整句话。不过正文不扩写其所指，以免把一种解释直接写进经文，并保留原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“靠着恩典，借着信”清楚区分根源与途径；“已经得救了”体现希腊文完成时结构所表达的已成就行动及持续结果。脚注标记按其实际说明对象分别置于“这”和“信”之后。
