  rationale: 修改“靠着恩典”为“因着恩典”，以更自然且更精确地表达原文的恩典与信之间的关系；相应更新脚注a中的引文。保留“已经”以外的表述并不否定原文完成时所含的持续结果，因为“得救”在此语境中可表明已进入的得救状态。脚注b仍应置于正文“信”之后。
