  text: ἐποικοδομηθέντες ἐπὶ τῷ θεμελίῳ τῶν ἀποστόλων καὶ προφητῶν, ὄντος ἀκρογωνιαίου αὐτοῦ ⸂Χριστοῦ Ἰησοῦ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/020.yaml
  text: having been built on the foundation of the apostles and prophets[a], Messiah Jesus himself being the cornerstone[b],
translation:
  language: zh_hans
  text: 你们也被建造在使徒和先知的根基上[a]，弥赛亚耶稣自己就是房角石[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使徒和先知的根基”也可理解为“使徒和先知所奠定的根基”或“以使徒和先知为根基”；希腊语属格没有进一步明确是哪一种意思。
    reason: lexical_alternative
  - marker: b
    text: “弥赛亚耶稣”或译“基督耶稣”。希腊语Χριστός意为“受膏者”，即“弥赛亚”。
    reason: alternative_translation
lexical_decisions:
- source_word: ἐποικοδομηθέντες
  choice: 也被建造在
  rationale: 保留不定过去时被动分词的被动意义和建筑意象；“也”自然承接上文同一长句，避免把分词误作独立的新动作。
- source_word: ἐπὶ τῷ θεμελίῳ
  choice: 在……的根基上
  rationale: ἐπί与与格在此表示建筑所依托的位置；“在……根基上”是现代汉语中自然、清楚的建筑表达。
- source_word: τῶν ἀποστόλων καὶ προφητῶν
  choice: 使徒和先知的
  rationale: 保留希腊语属格的宽泛关系，不擅自限定为“他们所奠定的”或“由他们构成的”。
- source_word: ὄντος
  choice: 就是
  rationale: 在汉语中以判断句自然表达属格独立结构所说明的身份关系，同时不增添因果或时间含义。
- source_word: ἀκρογωνιαίου
  choice: 房角石
  rationale: 准确保留建筑比喻；“房角石”是通行且易懂的圣经用语，比“顶石”更符合此处根基与建筑的语境。
- source_word: αὐτοῦ
  choice: 自己
  rationale: 与“弥赛亚耶稣”相呼应，表达希腊语代词的强调作用。
- source_word: Χριστοῦ Ἰησοῦ
  choice: 弥赛亚耶稣
  rationale: Χριστός在此仍具有称号意义；译作“弥赛亚”可显明“受膏者”的身份含义，而脚注保留读者熟悉的传统译法。
theological_decisions:
- issue: “使徒和先知的根基”的属格关系
  choice: 保留为“使徒和先知的根基”
  alternative: “使徒和先知所奠定的根基”或“以使徒和先知为根基”
  rationale: 希腊语属格本身没有明确说明根基是由他们奠定、与其见证相关，还是由他们构成；正文保留这种真实的诠释张力。
- issue: Χριστός的译法
  choice: 弥赛亚耶稣
  alternative: 基督耶稣
  rationale: 此处称号意义清楚，采用“弥赛亚”保存其语义；脚注列出传统且常见的“基督耶稣”。
- issue: 弥赛亚耶稣与房角石的关系
  choice: 弥赛亚耶稣自己就是房角石
  alternative: 以弥赛亚耶稣自己为房角石
  rationale: 正文直接表达希腊语属格独立结构，并保留αὐτοῦ的强调，不额外解释房角石在建筑中的具体功能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“被建造”“根基”“房角石”保持整节建筑比喻的一致性；“自己就是”清楚传达强调，又适合普通读者朗读和理解。
