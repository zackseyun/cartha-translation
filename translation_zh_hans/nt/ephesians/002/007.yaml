  text: ἵνα ἐνδείξηται ἐν τοῖς αἰῶσιν τοῖς ἐπερχομένοις ⸂τὸ ὑπερβάλλον πλοῦτος⸃ τῆς χάριτος αὐτοῦ ἐν χρηστότητι ἐφ’ ἡμᾶς ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/007.yaml
  text: so that in the coming ages he might display the surpassing riches of his grace in kindness toward us in Messiah Jesus[a][b][c].
translation:
  language: zh_hans
  text: 为要在将来的世代中[a]，在他于弥赛亚耶稣里[c]向我们所施的恩慈中，显明他恩典无比的丰富[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在要来的世代中”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他恩典那无可测度的丰富”。
    reason: lexical_alternative
  - marker: c
    text: 希腊文为“在基督耶稣里”；“基督”（Χριστός）意为“受膏者”，故译为“弥赛亚”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: 为要
  rationale: 承接上文，表达目的，也不排除由此产生的结果；“为要”简洁而庄重。
- source_word: ἐνδείξηται
  choice: 显明
  rationale: 表达公开展示、使人看见并认识的意思；比单纯的“显示”更适合此处语体。
- source_word: ἐν τοῖς αἰῶσιν τοῖς ἐπερχομένοις
  choice: 在将来的世代中
  rationale: 保留 αἰῶσιν 的复数和时间跨度；“世代”在现代汉语中可指延续的时代。
- source_word: τὸ ὑπερβάλλον πλοῦτος
  choice: 无比的丰富
  rationale: ὑπερβάλλον 指超越、远胜，πλοῦτος 指丰富或财富；此译自然表达恩典丰富到无可比拟。
- source_word: τῆς χάριτος αὐτοῦ
  choice: 他恩典
  rationale: “恩典”准确保留保罗语境中 χάρις 的核心含义，并以汉语所属结构表达。
- source_word: ἐν χρηστότητι
  choice: 借着……所施的恩慈
  rationale: χρηστότης 指仁慈、厚道和善意；“借着”将其理解为彰显恩典的方式，且“所施的恩慈”使其与“向我们”自然衔接。
- source_word: ἐφ’ ἡμᾶς
  choice: 向我们
  rationale: 保留 ἐπί 加宾格在此表示朝向、施及对象的意义。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: 在弥赛亚耶稣里
  rationale: 保留保罗“在……里”的联合性表达；Χριστός 在此仍具有称号“弥赛亚”的语义。
theological_decisions:
- issue: Χριστῷ 在固定短语中应译作称号还是近似专名
  choice: 弥赛亚耶稣
  alternative: 基督耶稣
  rationale: Χριστός 本义为“受膏者”，在此仍可作为耶稣的称号理解；采用“弥赛亚”使称号含义明示，同时脚注保留传统译法。
- issue: ἐν Χριστῷ Ἰησοῦ 所表达的关系
  choice: 在弥赛亚耶稣里
  alternative: 借着弥赛亚耶稣
  rationale: 直译“在……里”保留保罗关于信徒与弥赛亚联合或处于其关系领域中的神学张力，不将其缩减为单纯的工具关系。
- issue: ἐν χρηστότητι 与彰显恩典的关系
  choice: 借着……恩慈
  alternative: 在恩慈中
  rationale: “借着”自然表达恩慈是恩典得以彰显的方式；但原文 ἐν 也可能带有领域色彩，因此不进一步限定为功效或原因。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。为使主干清楚，将“向我们所施的恩慈”前置为方式短语，同时保留“在弥赛亚耶稣里”的原文意象；避免把“在……里”解释成单一的工具关系。
