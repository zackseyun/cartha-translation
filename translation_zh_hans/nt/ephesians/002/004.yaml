  text: ὁ δὲ θεὸς πλούσιος ὢν ἐν ἐλέει, διὰ τὴν πολλὴν ἀγάπην αὐτοῦ ἣν ἠγάπησεν ἡμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/004.yaml
  text: But God[a], being rich in mercy, because of his great love with which he loved us,
translation:
  language: zh_hans
  text: 然而，神满有怜悯[a]，因着他爱我们的那份大爱，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“在怜悯上是丰富的。”
    reason: 说明“满有怜悯”所对应的希腊语表达，并保留“丰富”的比喻性措辞。
lexical_decisions:
- source_word: δὲ
  choice: 然而
  rationale: 承接上文人死在过犯中并处于震怒之下的景况，表达鲜明转折；“然而”在现代汉语中庄重而自然。
- source_word: πλούσιος ὢν ἐν ἐλέει
  choice: 满有怜悯
  rationale: 表达神在怜悯上的丰盛，并以自然汉语体现分词结构的描述性含义；脚注保留希腊语“在怜悯上丰富”的字面表达。
- source_word: διὰ τὴν πολλὴν ἀγάπην αὐτοῦ
  choice: 因着他……的大爱
  rationale: διά加宾格在此表示原因；“因着”准确保留因由关系，“大爱”自然传达 πολλὴν ἀγάπην 的丰盛和分量。
- source_word: ἣν ἠγάπησεν ἡμᾶς
  choice: 他爱我们
  rationale: 与“大爱”连用为“他爱我们的大爱”，保留 ἀγάπη 与 ἀγαπάω 同源词的刻意重复，同时维持可懂的现代汉语。
theological_decisions:
- issue: “爱……爱了”同源表达的保留
  choice: 因着他爱我们的大爱
  alternative: 因着他对我们深厚的爱／因着他向我们显出的大爱
  rationale: 原文以名词 ἀγάπην 和动词 ἠγάπησεν 重复“爱”这一词根以加强语气；译文保留“大爱／爱”的呼应，不将其简化为单一表达。
- issue: 怜悯与爱的关系
  choice: 分别译作“满有怜悯”和“因着……大爱”
  alternative: 合并为“因着他怜悯的爱”
  rationale: 原文将怜悯和爱并列呈现为相关却有区别的概念；不把二者合并，以保留经文的神学张力和结构。
- issue: 本节与下一节的句法衔接
  choice: 以逗号收束，保留未完句式
  alternative: 补出“使我们活过来”等下一节内容
  rationale: 本节的分词和原因短语在希腊文中修饰下一节的主要动词；保留句末逗号可忠实体现跨节延续，不提前加入第5节内容。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“满有怜悯”兼顾原文丰盛意象与汉语自然度；“他爱我们的大爱”略带修辞重复，刻意保留保罗原文的同源词强调。
