  text: καὶ ἀποκαταλλάξῃ τοὺς ἀμφοτέρους ἐν ἑνὶ σώματι τῷ θεῷ διὰ τοῦ σταυροῦ ἀποκτείνας τὴν ἔχθραν ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/016.yaml
  text: and might reconcile both to God in one body through the cross, having put the hostility to death by it.
translation:
  language: zh_hans
  text: 并且借着十字架，在一个身体里使双方与上帝和好，从而除灭了敌意。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκαταλλάξῃ
  choice: 使……与……和好
  rationale: 表达该动词使关系恢复、达成和好的使役含义，也自然体现人与上帝之间的关系方向。
- source_word: τοὺς ἀμφοτέρους
  choice: 双方
  rationale: 紧扣上下文所指的犹太人与外族人，同时保留原文简洁的回指表达。
- source_word: ἐν ἑνὶ σώματι
  choice: 在一个身体里
  rationale: 保留“身体”的比喻及介词结构，不擅自明确为基督的身体或教会，以保存原文的表达张力。
- source_word: διὰ τοῦ σταυροῦ
  choice: 借着十字架
  rationale: 准确表达十字架作为实现和好的途径或媒介。
- source_word: ἀποκτείνας τὴν ἔχθραν
  choice: 除灭了敌意
  rationale: “除灭”传达字面“杀死”的强烈终结意味，又符合现代汉语搭配；“敌意”兼顾双方之间的敌对状态。
- source_word: ἐν αὐτῷ
  choice: 借此
  rationale: 希腊语代词的所指及介词功能有歧义；结合近邻的“十字架”理解为借着十字架，译为“借此”可自然承接且不作过度展开。
theological_decisions:
- issue: “一个身体”所指为何
  choice: 保留“在一个身体里”
  alternative: “使双方合成一个身体，与上帝和好”或明确译为“在基督的一个身体里”
  rationale: 原文没有在本节明说“基督的”或“教会”，应保留身体意象及其可能关联，不把解释写入正文。
- issue: ἐν αὐτῷ的指代与功能
  choice: 译作“借此”，主要回指十字架
  alternative: “在其中”，可能回指一个身体；或“在他里面”，回指基督
  rationale: 近接先行词为“十字架”，且英语审校层采用“by it”；但原文存在语法指代空间，因此使用较概括的“借此”，避免重复或把所指说得过死。
- issue: 敌意是双方之间还是人与上帝之间
  choice: 只译“敌意”，不补足对象
  alternative: “他们彼此的敌意”或“对上帝的敌意”
  rationale: 原文未明示敌意的对象；上下文容许多层关系，正文应保存这一神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“双方”简洁承接前文群体；语序尽量体现原句中十字架既是和好的途径，也是敌意被除灭的凭借。
