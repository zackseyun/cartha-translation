  text: καὶ συνήγειρεν καὶ συνεκάθισεν ἐν τοῖς ἐπουρανίοις ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/006.yaml
  text: and raised us up with him and seated us with him in the heavenly places in Messiah Jesus[b][a],
translation:
  language: zh_hans
  text: 又使我们与他一同复活，并使我们在天上的领域[a]与他一同坐在——在弥赛亚耶稣[b]里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“天上”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“基督耶稣”。
    reason: alternative_reading
lexical_decisions:
- source_word: συνήγειρεν
  choice: 使我们与他一同复活
  rationale: συν- 表明与基督共同参与；宾语“我们”由上文承接而来。“复活”在此比单纯“使起来”更准确地表达 ἐγείρω 在语境中的含义。
- source_word: συνεκάθισεν
  choice: 使我们……与他一同坐下
  rationale: 保留“共同坐下”的基本意义及 συν- 所表达的共同参与，不把经文进一步解释为“共同登基”。
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: 在属天的领域
  rationale: 该形容词以复数中性形式名词化，指属天的范围或领域；此译法自然且不强行限定为具体地点。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: 在弥赛亚耶稣里
  rationale: 保留介词 ἐν 所表达的联合关系，并将 Χριστός 的称号意义译为“弥赛亚”。
- source_word: καὶ
  choice: 又……又……
  rationale: 以现代汉语自然的累加结构呈现两个重复的 καὶ，承接上文神的作为。
theological_decisions:
- issue: 复合动词中的与基督联合含义
  choice: 两处均明确译出“与他一同”
  alternative: 只译作“使我们复活，使我们坐下”，把共同参与留作隐含意义
  rationale: 两个动词的 συν- 前缀都明确表达共同参与；译出“与他一同”既忠于原文，也不超出词义。
- issue: Χριστός 是称号还是名称化表达
  choice: 弥赛亚耶稣
  alternative: 基督耶稣
  rationale: “弥赛亚”传达 Χριστός 的受膏者称号意义；脚注保留华人教会中更传统的译法。
- issue: ἐπουρανίοις 的空间含义
  choice: 属天的领域
  alternative: 天上
  rationale: 原词是名词化的形容词，可指属天的地方、范围或领域；正文避免把它过度具体化，脚注保留简洁的空间译法。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“这一切都”是为使句末“在……里”自然地统摄前述两个动作而作的轻度显化；破折号帮助读者辨明其修饰范围。
