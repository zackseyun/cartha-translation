  yaml_path: translation/nt/ephesians/002/022.yaml
  text: in whom you also are being built together into a dwelling place for God in the Spirit[a][b].
translation:
  language: zh_hans
  text: 你们也在他里面一同被建造，成为上帝在圣灵里的居所[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在其中”；若关系代词所指的是整座建筑，而不是直接指基督。
    reason: alternative_reading
  - marker: b
    text: 或译：“在灵里”或“借着圣灵”。这短语可指上帝居住的范围，也可指圣灵的作用。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: 在他里面
  rationale: 关系代词最自然地承接上下文中的基督；中文用“他”保留其人格指向及“在基督里”的表达。由于语法上也可能承接整体建筑意象，另以脚注说明。
- source_word: καὶ ὑμεῖς
  choice: 你们也
  rationale: 显明原文代词的强调，并用“也”表达受信者与上文所述整体一同被纳入建造。
- source_word: συνοικοδομεῖσθε
  choice: 一同被建造
  rationale: 保留现在时被动态及 σύν- 的共同含义；中文无需另加“正在”也可自然表达持续过程。
- source_word: εἰς κατοικητήριον
  choice: 成为……居住的所在
  rationale: εἰς 表示建造所趋向的结果；“居住的所在”清楚保留圣殿与居所意象，又比“居所”稍具体。
- source_word: τοῦ θεοῦ
  choice: 上帝……居住的
  rationale: 属格在此最自然地说明上帝是居住者；调整为中文关系结构，避免生硬的“上帝的居所”可能兼有所有权歧义。
- source_word: ἐν πνεύματι
  choice: 借着圣灵
  rationale: 上下文最可能指圣灵；ἐν 可有范围或工具意味。正文采用自然中文的工具性表达，脚注保留“在圣灵里”等可能，以免消除原文张力。
theological_decisions:
- issue: ἐν ᾧ 的所指
  choice: 理解为基督，译作“在他里面”
  alternative: 理解为整座建筑，译作“在其中”
  rationale: 上下文连续以基督为建筑得以联结和成长的中心，故人格所指较为自然；但关系代词的形式和建筑比喻容许另一理解，故保留脚注。
- issue: ἐν πνεύματι 的含义
  choice: 理解为圣灵的作用，译作“借着圣灵”
  alternative: “在圣灵里”或“在灵里”
  rationale: 以弗所书的圣殿和上帝居住意象支持圣灵所指；不过介词短语可表示范围或凭借，正文选取自然且合乎语境的表达，并在脚注保存歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一同被建造”保留共同建造及被动态；“居住的所在”延续上下文的建筑和圣殿意象。正文中的[a][b]与脚注逐一对应。
