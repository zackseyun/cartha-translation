id: EPH.2.10
reference: Ephesians 2:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: αὐτοῦ γάρ ἐσμεν ποίημα, κτισθέντες ἐν Χριστῷ Ἰησοῦ ἐπὶ ἔργοις ἀγαθοῖς οἷς προητοίμασεν ὁ θεὸς ἵνα ἐν αὐτοῖς περιπατήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/010.yaml
  text: For we are his workmanship[a], created in Messiah Jesus for good works[b], which God prepared beforehand so that we might walk in them.
translation:
  language: zh_hans
  text: 因为我们是上帝的作品，是在弥赛亚耶稣里受造的，为要行善；这些善行是上帝预先预备的，以便我们行在其中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “行”在这里是比喻说法，指一个人的生活方式和行为。
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοῦ…ποίημα
  choice: 上帝的杰作
  rationale: ποίημα指所造、所成之物；“杰作”自然地表达我们是上帝亲自造成的成果，并避免“工作”在中文中的歧义。代词所指在上下文中是上帝，明说“上帝”更清楚。
- source_word: κτισθέντες
  choice: 受造
  rationale: 保留κτίζω的创造含义和被动语态，同时以简洁的现代汉语衔接“我们是……”。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: 在弥赛亚耶稣里
  rationale: “弥赛亚”呈现Χριστός在此作为称号的意义；“在……里”保留保罗关于与弥赛亚联合的表达，不将关系进一步解释化。
- source_word: ἐπὶ ἔργοις ἀγαθοῖς
  choice: 为要行善
  rationale: ἐπί加与格在此表示目的或指向。“行善”是自然现代汉语，同时保持善行而非泛指良好状态。
- source_word: οἷς προητοίμασεν ὁ θεός
  choice: 这些善行是上帝预先安排的
  rationale: οἷς回指善行；προητοίμασεν含“预先”之意。“安排”在此比“预备善行”更自然，但不具体说明上帝如何预备。
- source_word: ἵνα ἐν αὐτοῖς περιπατήσωμεν
  choice: 为要使我们行在其中
  rationale: 保留ἵνα的目的意味，并保留περιπατέω“行走”的保罗式隐喻；“其中”回指上帝预先安排的善行。
- source_word: γάρ
  choice: 因为
  rationale: 明确本节对前文因恩典得救之陈述的解释关系。
theological_decisions:
- issue: Χριστός应译作称号还是沿用音译形式
  choice: 弥赛亚耶稣
  alternative: 基督耶稣
  rationale: 此处Χριστός仍具有受膏者称号的意义；译作“弥赛亚”使普通读者看见这一称号的语义，而不把它仅当作名字的一部分。
- issue: 上帝预先安排与人的善行之间的关系
  choice: 这些善行是上帝预先安排的，为要使我们行在其中
  alternative: 上帝预先安排我们去行这些善事
  rationale: 所选译法让关系代词继续回指“善行”，也同时保留上帝的主动作为与信徒实际生活的目的，不把经文扩展成某种预定论或协同论体系。
- issue: περιπατέω的生活隐喻
  choice: 行在其中
  alternative: 照着这些善行生活
  rationale: 保留原文“行走”的隐喻及其开放性；脚注说明它涉及生活方式，避免正文过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“上帝的杰作”具可读性和具体感；“受造”“行在其中”保留原文的创造语言和行走隐喻。两个脚注标记均在正文中出现。
