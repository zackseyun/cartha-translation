source:
  edition: SBLGNT
  text: ἐν αἷς ποτε περιεπατήσατε κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου, κατὰ τὸν ἄρχοντα τῆς ἐξουσίας τοῦ ἀέρος, τοῦ πνεύματος τοῦ νῦν ἐνεργοῦντος ἐν τοῖς υἱοῖς τῆς ἀπειθείας·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/002.yaml
  text: in which you once walked[a], according to the age of this world, according to the ruler of the authority of the air[c][b], the spirit now at work in the sons of disobedience.
translation:
  language: zh_hans
  text: 你们从前在这些过犯和罪恶中行事为人，随从这个世界的时代潮流[a]，随从掌管空中权势的统治者[b]，就是如今在悖逆之子[c]中运行的灵。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译为“随从这个世界的世代”。希腊词αἰών指一个时代及其特有的风气或模式。
    reason: lexical_alternative
  - marker: b
    text: “空中”保留古代宇宙观的说法；当时人常把空中看作与敌对属灵势力相关的领域。
    reason: cultural_note
  - marker: c
    text: “悖逆之子”是闪语式说法，指以悖逆为特征的人，并非只指男性或生理上的儿子。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αἷς
  choice: 在这些过犯和罪恶中
  rationale: 关系代词回指上一节的“过犯和罪恶”。中文补出所指，使独立经节清楚，同时保留“在……中”的范围意味。
- source_word: ποτε περιεπατήσατε
  choice: 从前……行事为人
  rationale: ποτε表示过去的生活状态；περιπατέω在此比喻人的生活方式。“行事为人”既保留行为意象，也符合现代庄重中文。
- source_word: κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου
  choice: 随从这个世界的时代潮流
  rationale: κατά表达依循、顺应；“时代潮流”传达αἰών在此所指的时代及其支配性模式，同时仍与κόσμος“世界”有所区别。脚注注明较直译的表达。
- source_word: ἄρχοντα τῆς ἐξουσίας τοῦ ἀέρος
  choice: 掌管空中权势的统治者
  rationale: “统治者”准确表达ἄρχων的管辖地位；“权势”表达ἐξουσία的权柄或势力含义；“空中”保留ἀήρ的古代宇宙观用语，不在正文中解释性改写。
- source_word: τοῦ πνεύματος τοῦ νῦν ἐνεργοῦντος
  choice: 就是如今……运行的灵
  rationale: “灵”采用小写概念，语境指敌对的属灵存在或势力，而非圣灵；“如今……运行”保留现在时主动分词所表达的持续活动。“就是”呈现同位关联，但不进一步界定这灵与统治者的本体关系。
- source_word: ἐν τοῖς υἱοῖς τῆς ἀπειθείας
  choice: 在悖逆之子中
  rationale: 保留闪语式“……之子”和源文阳性名词υἱοί；“悖逆”作为抽象名词，表达这些人以不顺服为特征。脚注说明该习语的实际所指。
theological_decisions:
- issue: “如今运行的灵”与“掌管空中权势的统治者”的关系
  choice: 以“就是”呈现同位或紧密说明关系，使“灵”继续描述前述敌对权势。
  alternative: 将其明确解释为撒但本人，或解释为受该统治者支配的另一种非人格力量。
  rationale: 希腊文连续的属格结构容许同位理解，却没有充分界定二者在本体上完全相同还是有所区别。译文保留紧密关联，不加入源文未明说的系统性解释。
- issue: υἱοῖς的性别及闪语式表达
  choice: 正文采用“悖逆之子”。
  alternative: 译作“悖逆的儿女”或“悖逆的人”。
  rationale: “悖逆之子”保留源文的阳性形式和“以某特征为标志的一类人”这一习语；脚注澄清其所指，避免误解为只限男性或生理血缘。
translation_notes:
  register: 采用现代、庄重而可理解的书面语。“行事为人”保留保罗“行走”的生活方式隐喻；“时代潮流”使较生硬的属格结构自然化，并以脚注保留更直译形式。正文重复“随从”，对应两个κατά短语，维持原句的平行推进。
