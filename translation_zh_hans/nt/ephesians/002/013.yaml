base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/013.yaml
  text: But now in Messiah Jesus[d][c][b][a], you who once were far away have become near by the blood of the Messiah.
translation:
  language: zh_hans
  text: 但如今，在弥赛亚[a]耶稣里，你们这些从前在远处[b]的人，已经借着弥赛亚的血[c]变得亲近了[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”希腊文作Χριστός，传统译作“基督”；这是一个称号，意思是“受膏者”。
    reason: lexical_alternative
  - marker: b
    text: “在远处”也可译作“远离”。原文没有在这里明说所远离的对象。
    reason: lexical_alternative
  - marker: c
    text: “借着弥赛亚的血”也可译作“在弥赛亚的血中”或“借由弥赛亚的血”。
    reason: lexical_alternative
  - marker: d
    text: “变得亲近了”也可译作“成为近的了”或“被带近了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: 但如今
  rationale: 既表达 δέ 的转折，也保留 νυνί 所强调的今昔对比。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: 在弥赛亚耶稣里
  rationale: 保留保罗“在……里”的联合、归属语言；Χριστός 在此按称号译为“弥赛亚”。
- source_word: ὑμεῖς οἵ ποτε ὄντες
  choice: 你们这些从前……的人
  rationale: 用自然的现代汉语表达代词加关系分句，并保留从前状态与如今状态的对比。
- source_word: μακρὰν
  choice: 在远处
  rationale: 保留原文未明说相对于谁或什么而“远”的开放性，也避免擅自补出“离神”。
- source_word: ἐγενήθητε ἐγγὺς
  choice: 已经得以亲近了
  rationale: 以自然汉语表达由远至近的状态转变；“得以”可含受惠或被动意味，但脚注保留更直接的“成为亲近的人”。
- source_word: ἐν τῷ αἵματι
  choice: 借着……的血
  rationale: 按上下文将 ἐν 理解为手段，说明亲近如何实现；脚注保留“在……的血中”这一较形式对应的可能译法。
- source_word: τοῦ Χριστοῦ
  choice: 弥赛亚的
  rationale: Χριστός 在此仍具称号功能，故译出其意义，而不只音译为“基督”。
theological_decisions:
- issue: Χριστός 的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处 Χριστός 具有称号意义；“弥赛亚”直接传达“受膏者”这一身份，同时在脚注注明传统译法。
- issue: ἐν τῷ αἵματι τοῦ Χριστοῦ 的语义作用
  choice: 手段义：“借着弥赛亚的血”
  alternative: 范围或领域义：“在弥赛亚的血中”
  rationale: 上下文主要说明从远处到亲近所凭借的途径，因此正文采用手段义；但不把“血”进一步解释成某一特定赎罪理论，并以脚注保留介词的另一种理解。
- issue: ἐγενήθητε 的施事与语态意味
  choice: 得以亲近
  alternative: 成为亲近的人
  rationale: 原文明确陈述状态转变，却没有在本句明说施事者；“得以”适合汉语并略带受惠意味，而脚注保留不凸显施事者的直译，避免把隐含施事过度确定化。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“在弥赛亚耶稣里”刻意保留保罗特有的表达，不改写为单纯的“借着”或“由于”；全句保持今昔对照，并不补出原文未明说的亲近对象或施事者。
