  source_fidelity: “死在……之中”可恰当地保留原文与格所呈现的状态／领域隐喻，而不将其限定为单纯的因果关系。μως，“罪恶”较容易指泛称的邪恶或恶行，未如“罪”直接对应ἁμαρτίαις；“本来”也可带有“原本如此”的意味，不如“曾”清楚表达此处在后文语境中所指的既往状态。
  naturalness: “至于你们，你们……”虽有重复，但能自然地表现前置的“你们”及与前文的转折／承接。将“本来”改为“曾”，并将“罪恶”改为“罪”，全句更简洁自然。保留逗号，因为希腊文的句法延续至后文。
  terminology: “过犯”和“罪”是现代汉语圣经语境中稳妥、彼此可区分的对应语，分别传达παραπτώματα与ἁμαρτίαι。保留“死”，不增添“属灵”等原文未明说的限定。
