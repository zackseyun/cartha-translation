  yaml_path: translation/nt/ephesians/002/001.yaml
  text: And you were dead in your trespasses and sins,
translation:
  language: zh_hans
  text: 至于你们，你们曾死在自己的过犯和罪中，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ὑμᾶς
  choice: 至于你们
  rationale: 本节在希腊文中承接后文，ὑμᾶς为前置宾语。“至于你们”既体现话题转换和强调，也保留句子尚未完结的结构感。
- source_word: ὄντας νεκροὺς
  choice: 本来死在……之中
  rationale: νεκρούς表示“死的”状态，ὄντας是分词。中文以“本来”表达先前状态，同时避免把这里误译成一次肉身死亡事件。
- source_word: τοῖς παραπτώμασιν καὶ ταῖς ἁμαρτίαις
  choice: 在……过犯和罪恶之中
  rationale: 与格可表达所处领域，也可能含有原因意味；采用“在……之中”保留这种空间隐喻及一定的语义张力，不单方面限定为“因为”。
- source_word: ὑμῶν
  choice: 自己的
  rationale: 明确过犯和罪恶属于“你们”，符合现代汉语指代习惯。
theological_decisions:
- issue: “死”是状态还是肉身死亡
  choice: 保留“死”的神学隐喻，并用“本来死在……之中”呈现状态
  alternative: 因自己的过犯和罪恶而死亡
  rationale: 原文称受众为νεκρούς，并未在本节中解释这种死亡的具体性质；译文不把它窄化为肉身死亡，也不额外加入“属灵”等解释性术语。
- issue: 过犯和罪恶与死亡之间的关系
  choice: 译作“死在……之中”
  alternative: 因……而死
  rationale: 原文与格既可让人理解为所处领域，也可含原因关系；“在……之中”更能保存原文的隐喻和开放性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。本节原文是跨节长句的一部分，因此以逗号收尾，并用“至于你们”提示其与后文的句法联系。
