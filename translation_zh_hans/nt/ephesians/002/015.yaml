id: EPH.2.15
reference: Ephesians 2:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τὸν νόμον τῶν ἐντολῶν ἐν δόγμασιν καταργήσας, ἵνα τοὺς δύο κτίσῃ ἐν ⸀αὑτῷ εἰς ἕνα καινὸν ἄνθρωπον ποιῶν εἰρήνην,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/015.yaml
  text: having abolished the law of commandments expressed in decrees, so that he might create the two into one new man in himself, making peace,
translation:
  language: zh_hans
  text: 废除了那由诫命组成、以规条表达的律法[a]，为要在自己里面把双方创造成一个新人[b]，从而成就和平，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以规条表达”也可译作“在规条中”或“由规条构成”。
    reason: 保留ἐν δόγμασιν与“律法／诫命”之间真实存在的句法和语义歧义。
  - marker: b
    text: “一个新人”是单数的群体形象，也可译作“一个新的人类”。
    reason: 说明ἄνθρωπος在此既保持单数人物隐喻，又具有犹太人与外族人合一的群体指向。
lexical_decisions:
- source_word: νόμον τῶν ἐντολῶν
  choice: 由诫命组成……的律法
  rationale: 保留属格结构的限定作用，所指是以诫命为内容的律法，而不是抽象原则。
- source_word: ἐν δόγμασιν
  choice: 以规条表达
  rationale: δόγμα可指法令、规条；此处介词短语与前面的“律法”和“诫命”关系略有歧义。正文采用自然且不过度限缩为礼仪条例的表达，脚注保留其他可能。
- source_word: καταργήσας
  choice: 废除了
  rationale: 体现不定过去时分词所表达的决定性行动，并保留原文的强烈措辞；其宾语受后续限定，不扩展为对一切神圣旨意的概括。
- source_word: τοὺς δύο
  choice: 双方
  rationale: 自然表达明确的“两者”，承接上下文中的犹太人与外族人。
- source_word: κτίσῃ
  choice: 创造成
  rationale: 保留κτίζω的创造、新创造意味，并自然表达由双方成为一个新人的结果。
- source_word: ἐν αὑτῷ
  choice: 在自己里面
  rationale: 体现反身代词，表明联合与新创造发生在基督自己里面。
- source_word: εἰς ἕνα καινὸν ἄνθρωπον
  choice: 成一个新人
  rationale: 保留单数的代表性、群体性人物形象；“新人类”虽能显明群体含义，却会提前解释隐喻。
- source_word: ποιῶν εἰρήνην
  choice: 从而成就和平
  rationale: 表达分词与前述创造行动的伴随及结果关系；“成就和平”在中文中自然而庄重。
theological_decisions:
- issue: “一个新人”的群体性含义
  choice: 一个新人
  alternative: 一个新的人类
  rationale: 原文用单数ἄνθρωπος构成代表双方合一的群体形象。“一个新人”既保留这一隐喻，也不把其含义直接改写为抽象的“新人类”。
- issue: καταργήσας对律法的作用强度
  choice: 废除了
  alternative: 使之失效
  rationale: 保留保罗强烈的动词，同时让限定语“由诫命组成、以规条表达的律法”界定其宾语，避免在译文中加入超出本节的系统神学说明。
- issue: ἐν αὑτῷ的句法归属
  choice: 在自己里面把双方创造成一个新人
  alternative: 把双方创造成在自己里面的一个新人
  rationale: 介词短语在希腊文中位于“双方”与结果短语之间，可理解为创造行动发生的领域，也可与所形成的新人联系。正文按较自然的行动领域理解，仍保留原文的核心关联。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“规条”比“条例”更能保留δόγμα的法令性而不局限于礼仪规定；“双方”承接上下文，避免生硬的“那两个”。经文是句中片段，因此末尾保留逗号。
