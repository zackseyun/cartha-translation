- from: 以利亚是与我们性情相同的人[a]。他恳切祷告，求不要下雨，地上就三年零六个月没有下雨。
  to: 以利亚是一个和我们一样的人[a]；他恳切祷告，求不下雨，而地上三年零六个月没有下雨。
  rationale: 修订以“和我们一样的人”替代可能被理解为“脾性相同”的“与我们性情相同的人”，从而更准确、自然地保留原文对以利亚与读者共同人性／共同处境的强调。保留脚注以呈现该词可指感受或情欲的较具体解释。其余句义与原文一致。
