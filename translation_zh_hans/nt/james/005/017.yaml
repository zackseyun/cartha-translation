  text: Ἠλίας ἄνθρωπος ἦν ὁμοιοπαθὴς ἡμῖν, καὶ προσευχῇ προσηύξατο τοῦ μὴ βρέξαι, καὶ οὐκ ἔβρεξεν ἐπὶ τῆς γῆς ἐνιαυτοὺς τρεῖς καὶ μῆνας ἕξ·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/017.yaml
  text: Elijah was a man with a nature like ours[a], and he prayed earnestly that it would not rain, and it did not rain on the land for three years and six months.
translation:
  language: zh_hans
  text: 以利亚是一个和我们一样的人[a]；他恳切祷告，求不下雨，而地上三年零六个月没有下雨。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以利亚是一个与我们有同样感受或情欲的人。”原词也可广指与我们同具人的处境或经验。
    reason: 词义选择：ὁμοιοπαθής可指共同的人性处境，也可较具体地指相同的感受或情欲。
lexical_decisions:
- source_word: Ἠλίας
  choice: 以利亚
  rationale: 采用现代中文圣经与基督教语境中通行的先知名译法。
- source_word: ἄνθρωπος
  choice: 人
  rationale: 指出以利亚虽是先知，却是普通的人；中文用“人”自然且准确，无须重复标明其男性身份。
- source_word: ὁμοιοπαθὴς ἡμῖν
  choice: 与我们性情相同
  rationale: ὁμοιοπαθής表示同受人类共同处境、感受和软弱所影响；“性情相同”保留较宽的语义，不将其限定为情绪或欲望。
- source_word: προσευχῇ προσηύξατο
  choice: 恳切祷告
  rationale: 以自然中文表达同源名词与动词构成所带出的强调语气，避免生硬直译为“以祷告祷告”。
- source_word: τοῦ μὴ βρέξαι
  choice: 求不要下雨
  rationale: 在祷告语境中自然表达该不定式结构所指向的祈求内容，同时不强行排除目的意味。
- source_word: οὐκ ἔβρεξεν
  choice: 没有下雨
  rationale: 采用现代汉语描述降雨的惯用无人称表达。
- source_word: ἐπὶ τῆς γῆς
  choice: 地上
  rationale: γῆ可指地、土地或大地；“地上”贴近原文并避免明确断定为全球范围或仅某一地区。
- source_word: ἐνιαυτοὺς τρεῖς καὶ μῆνας ἕξ
  choice: 三年零六个月
  rationale: 准确、自然地表达持续时间。
theological_decisions:
- issue: ὁμοιοπαθὴς所强调的以利亚与读者之共同性
  choice: 译为“与我们性情相同”，强调以利亚同样具有普通人的性情与处境
  alternative: 译为“和我们一样的人”或“和我们有同样的感受／情欲”
  rationale: 原词的范围比单指情绪或情欲更宽。正文保留其人性共同性的重点，脚注列出较概括的替代译法，以免把经文的劝勉意义局限于某一种心理层面。
- issue: 禁雨祷告中不定式结构的内容与目的关系
  choice: 译为“求不要下雨”
  alternative: 译为“为要不下雨”
  rationale: 属格冠词不定式在此可表达祷告所求的内容，并带目的色彩；中文“求”最自然地保留其作为祷告请求的功能，不额外断定更细的语法分类。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“恳切祷告”体现原文同源词结构的强调；“地上”刻意保留γῆ在“土地／大地”之间的范围弹性。
