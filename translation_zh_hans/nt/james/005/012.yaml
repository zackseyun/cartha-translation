source:
  edition: SBLGNT
  text: Πρὸ πάντων δέ, ἀδελφοί μου, μὴ ὀμνύετε, μήτε τὸν οὐρανὸν μήτε τὴν γῆν μήτε ἄλλον τινὰ ὅρκον· ἤτω δὲ ὑμῶν τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ, ἵνα μὴ ⸂ὑπὸ κρίσιν⸃ πέσητε.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/012.yaml
  text: But above all[a], my brothers, do not swear, either by heaven or by earth or by any other oath. Instead, let your yes be yes and your no, no[b], so that you may not fall under judgment.
translation:
  language: zh_hans
  text: 但尤其要紧的是，我的弟兄们[a]，不要起誓：不可指着天，不可指着地，也不可起任何别的誓。你们说“是”，就应当是；说“不是”，就应当不是[b]，免得你们落在审判之下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”很可能是对整个信徒群体的称呼，也可译作“弟兄姊妹们”。
    reason: lexical_alternative
  - marker: b
    text: “落在审判之下”也可译作“被定罪”。
    reason: alternative_reading
lexical_decisions:
- source_word: Πρὸ πάντων
  choice: 最要紧的是
  rationale: 此短语在这里强调劝勉的优先性或重要性；译为“最要紧的是”自然、庄重，也保留强调语气，而不拘泥于字面的“在万事之前”。
- source_word: ἀδελφοί μου
  choice: 我的弟兄们
  rationale: 保留希腊文阳性复数称呼的形式；在当时共同体语境中，这一称呼很可能包括全体信徒，故以脚注说明。
- source_word: μὴ ὀμνύετε
  choice: 不要起誓
  rationale: 语境涉及指着天、地以及其他誓言起誓，故“起誓”比现代汉语中可能被理解为说脏话的“发誓/咒骂”更明确。现在时命令式配 μή 在此表达一般性禁止。
- source_word: μήτε τὸν οὐρανὸν μήτε τὴν γῆν μήτε ἄλλον τινὰ ὅρκον
  choice: 不可指着天，也不可指着地，或起任何别的誓
  rationale: 汉语中的“指着天/地起誓”自然传达省略的起誓关系；末项明确译出“起……誓”，保留全面禁止的范围。
- source_word: ἤτω δὲ ὑμῶν τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ
  choice: 你们说“是”，就应当是；说“不是”，就应当不是
  rationale: 保留原文简洁而格言式的重复，同时用现代汉语清楚表达言语应当真实可靠。将 Οὔ 译为“不是”，比孤立的“不”更符合普通话应答习惯。
- source_word: ἵνα μὴ ὑπὸ κρίσιν πέσητε
  choice: 免得你们落在审判之下
  rationale: “落在……之下”保留 πέσητε 的隐喻；“审判”忠实保留 κρίσις 较宽的语义，不擅自限定为定罪。
theological_decisions:
- issue: κρίσις 应译为较宽泛的“审判”，还是较强的“定罪”
  choice: 审判
  alternative: 定罪
  rationale: κρίσις 本身可泛指审判，未必必然表示最终定罪。正文采用“审判”以免缩窄原文的神学含义，并在脚注保留“定罪”这一可能表达。
- issue: ἀδελφοί 在可能包含男女的信徒群体中如何翻译
  choice: 我的弟兄们
  alternative: 我的弟兄姊妹们
  rationale: 正文保留原文阳性复数称呼的形式，不将解释直接写入正文；脚注说明该称呼很可能面向整个信徒群体。
- issue: 本节是否将一切誓言作绝对而无条件的神学分类
  choice: 按原文直接保留禁止起誓的劝诫，不增添适用范围的教义说明
  alternative: 在正文中限定为禁止轻率、虚假或日常性的誓言
  rationale: 本节措辞广泛，正文不应借翻译加入原文未明说的例外或限定；相关系统神学问题应由更广语境讨论，而非在本节中被静默解决。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“起誓”避免“发誓”在部分现代语境中的随意色彩；引号和分号凸显原文格言式的“是/不是”对举。正文保留原文的简洁、重复和 κρίσις 的语义张力。
