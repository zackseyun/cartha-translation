  text: κατεδικάσατε, ἐφονεύσατε τὸν δίκαιον. οὐκ ἀντιτάσσεται ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/james/005/006.yaml
  text: You condemned[a], you murdered the righteous one[b]. He does not resist you.
translation:
  language: zh_hans
  text: 你们定了义人的罪[a]，又杀害了他。他岂不反抗你们吗？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “义人”可指一位具有代表性的、受富人压迫的正直之人；也有人认为这里可能呼应耶稣“那义者”的称号。
    reason: 保留“义人”在代表性人物与可能的基督论呼应之间的开放性。
  - marker: b
    text: 直译：“他不反抗你们吗？”SBLGNT将希腊文末句标作问句；以οὐκ（“不”）引导的此类问句通常带有期待肯定回答的修辞意味。由于古代手稿原无现代标点，也有人按陈述句断为：“他没有反抗你们。”
    reason: 保留SBLGNT的问句形式及其通常修辞力度，同时说明无标点手稿所容许的陈述式断句。
lexical_decisions:
- source_word: κατεδικάσατε
  choice: 你们定了……的罪
  rationale: 该词为简单过去时、主动语态、直陈语气、第二人称复数，带有司法判罪的意味。“定了……的罪”在现代汉语中自然有力，也保留了原文的审判色彩。
- source_word: ἐφονεύσατε
  choice: 又杀害了他
  rationale: φονεύω通常指应受道德谴责的杀人行为。“杀害”比中性的“杀死”更能传达控诉的力度；补出“他”是汉语为避免重复“义人”而采用的自然回指。
- source_word: τὸν δίκαιον
  choice: 义人
  rationale: 带冠词的阳性单数形容词在此作名词用，可指“那义人”或具有代表性的“义人”。“义人”简洁、庄重，并保留其可能泛指受富人压迫的正直之人、也可能令人联想到耶稣这一称号的开放性。
- source_word: οὐκ ἀντιτάσσεται ὑμῖν
  choice: 他没有反抗你们
  rationale: ἀντιτάσσομαι意为起来抵挡、反对或反抗。“反抗”适合受压迫者面对强权的语境。正文按语境译为陈述句，脚注同时保留SBLGNT所采用的疑问句标点，以免掩盖句法与语气上的歧义。
theological_decisions:
- issue: “义人”的所指
  choice: 正文不将其明确限定为耶稣，而保留为受压迫义人的代表性单数
  alternative: 把“义人”视为耶稣的称号和隐含指称
  rationale: 上下文是在谴责富有的压迫者，单数“义人”可以代表遭受压迫的正直之人；但此称呼也可能使读者联想到耶稣。正文不替原文消除这层张力，脚注说明另一种理解。
- issue: 末句的语气
  choice: 译作陈述句：“他没有反抗你们。”
  alternative: 依SBLGNT标点译作疑问句：“他不是反抗你们吗？”或“他没有反抗你们吗？”
  rationale: 希腊文抄本原无现代标点，SBLGNT将此句标为问句；然而上下文常被理解为描述义人不作抵抗。正文采用语意较连贯的陈述式，脚注保留疑问式读法，不强行消除其语气歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“定了……的罪”保留司法意味，“杀害”保留强烈的道德控诉。“义人”沿用现代中文圣经语体中仍通行且容易理解的表达。
