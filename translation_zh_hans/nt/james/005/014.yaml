  text: ἀσθενεῖ τις ἐν ὑμῖν; προσκαλεσάσθω τοὺς πρεσβυτέρους τῆς ἐκκλησίας, καὶ προσευξάσθωσαν ἐπ’ αὐτὸν ἀλείψαντες ⸀αὐτὸν ἐλαίῳ ἐν τῷ ὀνόματι τοῦ κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/014.yaml
  text: Is anyone among you sick? Let him call for the elders of the church[a], and let them pray over him[b], anointing him with oil in the name of the Lord.
translation:
  language: zh_hans
  text: 你们中间有人病了吗[a]？他就应当请教会的长老来，让他们为他祷告，并奉主的名用油抹他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “病了”按原文也可译为“软弱了”；但本节及下一节提到祷告、抹油、医治和使人起来的语境，主要指身体患病。
    reason: lexical_alternative
  - marker: b
    text: 这里的抹油可能具有药用、象征意义，或兼有两者；经文本身没有说明其作用机制。
    reason: cultural_note
lexical_decisions:
- source_word: ἀσθενεῖ
  choice: 病了
  rationale: 该词可泛指软弱，但本节的请长老、祷告、抹油以及下节医治的语境，主要指身体患病；“病了”是自然清楚的现代汉语。
- source_word: τις ἐν ὑμῖν
  choice: 你们中间有人
  rationale: 保留不定、面向整个受信群体的表达，不限定性别。
- source_word: προσκαλεσάσθω
  choice: 他就该请……来
  rationale: 表达第三人称命令的劝令语气，也传达病人主动请长老前来的含义。
- source_word: τοὺς πρεσβυτέρους τῆς ἐκκλησίας
  choice: 教会的长老
  rationale: 这里指教会中受认可的带领者，而非泛指年长男子；“教会的长老”是通行且透明的译法。
- source_word: προσευξάσθωσαν ἐπ’ αὐτόν
  choice: 请他们为他祷告
  rationale: ἐπί在医治祷告语境中可有“在他上方/对着他”的空间色彩，但现代汉语“为他祷告”最自然，也清楚表达祷告以病人为对象，避免生硬的“在他上面祷告”。
- source_word: ἀλείψαντες αὐτὸν ἐλαίῳ
  choice: 用油抹他
  rationale: 准确表达把油涂抹在病人身上的动作；不预先判定其为药用、象征或圣礼。
- source_word: ἐν τῷ ὀνόματι τοῦ κυρίου
  choice: 奉主的名
  rationale: 这是现代汉语圣经语体中自然、庄重的表达，保留以主的名义和权柄行事的含义。
- source_word: κυρίου
  choice: 主
  rationale: 保留κύριος的称号，不在译文中进一步指定所指，从而维持希腊文的表达。
theological_decisions:
- issue: ἀσθενεῖ在本段中的性质
  choice: 正文译为身体“病了”
  alternative: 软弱了；衰弱了
  rationale: 上下文中的长老、祷告、抹油以及下一节的医治/使其起来，都支持身体疾病为主要含义；脚注保留该词较宽的语义范围。
- issue: 抹油的功能
  choice: 中性地译作“用油抹他”
  alternative: 明确解释为药用、象征性行动或圣礼
  rationale: 原文只陈述抹油这一行动，并未说明其作用机制；译文和脚注都不引入宗派性结论。
- issue: ἐπ’ αὐτόν的表达
  choice: 正文采用自然汉语“为他祷告”
  alternative: 在他上方祷告；对着他祷告
  rationale: “为他祷告”最符合现代汉语，同时保留祷告指向病人的核心意思；脚注说明原文介词所具有的较直译色彩。
- issue: 奉主的名与抹油、祷告的关系
  choice: 按汉语自然语序置于“用油抹他”之前，同时不排除其修饰整个行动
  alternative: 明确限定为仅修饰抹油，或仅修饰祷告
  rationale: 希腊文中该短语紧随抹油而来，却也可能涵盖长老整体的祷告与抹油行动；不应在翻译中强行缩窄。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“他”承接单数病人，仅用于保持叙述连贯，不表示患病者只限男性。正文避免生硬直译介词结构，也不把抹油解释成特定宗派的礼仪。
