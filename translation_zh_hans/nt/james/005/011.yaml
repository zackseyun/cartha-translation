id: JAS.5.11
reference: James 5:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἰδοὺ μακαρίζομεν τοὺς ⸀ὑπομείναντας· τὴν ὑπομονὴν Ἰὼβ ἠκούσατε, καὶ τὸ τέλος κυρίου ⸀εἴδετε, ὅτι πολύσπλαγχνός ἐστιν ⸂ὁ κύριος⸃ καὶ οἰκτίρμων.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/011.yaml
  text: Behold, we count those who have endured as blessed. You have heard of Job’s endurance, and you have seen the Lord’s outcome, that the Lord is very compassionate and merciful.
translation:
  language: zh_hans
  text: 看哪，我们称那些忍耐到底的人为有福。你们听说过约伯的忍耐，也看见了主所带来的结局[a]，知道主满有怜悯，极其慈悲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主所带来的结局”也可理解为“主所定的终局”或“主的目的”。原文可指主使约伯的经历最终达到的结果，也可强调主在其中的目的或安排。
    reason: 说明τέλος的语义范围，保留“结果”与“目的/安排”两种可行理解，同时明确正文为语境性表达。
lexical_decisions:
- source_word: μακαρίζομεν
  choice: 我们称……为有福
  rationale: 保留动词“认定、称为有福”的陈述作用，不仅表达一般性的赞赏。
- source_word: ὑπομείναντας / ὑπομονὴν
  choice: 忍耐到底的人 / 忍耐
  rationale: 同一词根前后呼应；前者用“忍耐到底”体现分词所指已经持守过来的人，后者以自然的名词形式描述约伯的坚忍。
- source_word: τὸ τέλος κυρίου
  choice: 主所带来的结局
  rationale: τέλος在本语境中首先指最终结果或结局；用“所带来的”避免“主的结局”在中文中被误解为主自身的终结，同时不把它收窄为抽象的“旨意”。
- source_word: πολύσπλαγχνος
  choice: 满有怜悯
  rationale: 表达强烈、深厚的怜悯之情，符合该复合形容词的力度。
- source_word: οἰκτίρμων
  choice: 富有慈悲
  rationale: 与前一形容词形成相近而不完全重复的并列表达，保留原文对主怜悯属性的双重强调。
theological_decisions:
- issue: “主的τέλος”是结果还是目的
  choice: 正文译为“主所带来的结局”
  alternative: “主的目的”或“主的旨意”
  rationale: 约伯故事的语境侧重主最终使事情达到的结果；τέλος虽可含目标意味，但直译成“目的”会将原文较宽的表达过早限定。脚注保留另一种理解。
- issue: ὅτι与前句的关系
  choice: 译为“知道主……”
  alternative: “因为主……”
  rationale: ὅτι既可引出所看见或所明白的内容，也可说明原因；“知道”在现代汉语中自然承接“听说过、看见了”，同时不排除因果意味。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留ἰδού的劝诫和强调语气；全句维持“听说—看见—知道”的推进，并避免使用带有特定宗派色彩的术语。
