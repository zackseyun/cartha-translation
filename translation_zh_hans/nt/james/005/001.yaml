  text: Ἄγε νῦν οἱ πλούσιοι, κλαύσατε ὀλολύζοντες ἐπὶ ταῖς ταλαιπωρίαις ὑμῶν ταῖς ἐπερχομέναις.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/001.yaml
  text: Come now[a], you rich, weep[b], wailing over the miseries that are coming upon you.
translation:
  language: zh_hans
  text: 你们这些富有的人哪，听着：哭泣吧，放声哀号[a]，因为苦难[b]将要临到你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “放声哀号”也可译作“号啕”或“高声哀哭”；希腊语表达强烈、高声的哀悼。
    reason: lexical_alternative
  - marker: b
    text: “苦难”也可译作“灾祸”“困厄”或“悲惨境遇”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγε νῦν
  choice: 现在听着
  rationale: 这是引出严厉呼告或斥责的话语标记；译为“现在听着”自然有力，保留直接召唤的语气。
- source_word: οἱ πλούσιοι
  choice: 你们富足的人哪
  rationale: 形式上虽为主格，在此具有呼格功能；“富足的人”直接点明对象，又不限定他们是否属于信徒群体。
- source_word: κλαύσατε
  choice: 要哭泣
  rationale: 不定过去时命令式要求公开哀哭；“哭泣”庄重而通俗。
- source_word: ὀλολύζοντες
  choice: 放声哀号
  rationale: 现在分词加强“哭泣”的命令，强调高声、外显的悲号；“放声哀号”比单纯“哀哭”更能体现其强烈程度。
- source_word: ἐπὶ ταῖς ταλαιπωρίαις
  choice: 为……苦难
  rationale: ἐπί加与格在此表示哀哭的缘由；“为”符合现代汉语表达，也保留因将临苦难而悲号的关系。
- source_word: ταλαιπωρίαις
  choice: 苦难
  rationale: 该词指严重的困苦、灾祸或悲惨处境；“苦难”自然、庄重，并未过度限定其具体形式。
- source_word: ταῖς ἐπερχομέναις
  choice: 将要临到你们的
  rationale: 现在分词修饰“苦难”，表达正在逼近；“临到你们”准确呈现这些苦难以他们为承受对象，同时不把时间紧迫性说得超过原文。
theological_decisions:
- issue: 对富足之人的称呼及将临苦难的性质
  choice: 保留对“富足的人”的广泛、先知式斥责，并表达苦难将临到他们
  alternative: 明确译成对压迫人的非信徒地主，或对教会内富有信徒的警告
  rationale: 本节本身没有明确说明这些富人的信仰身份；译文不借上下文推断将其范围缩窄，也不额外界定苦难的具体末世性质。
translation_notes:
  register: 采用现代、庄重而可懂的普通话。“你们……哪”保留先知式直接呼告；“现在听着”避免古雅的“来吧”，并传达严厉召唤；全句节奏紧迫，符合谴责语气。
