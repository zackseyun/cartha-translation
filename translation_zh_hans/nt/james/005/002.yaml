  yaml_path: translation/nt/james/005/002.yaml
  text: Your wealth has rotted, and your clothes have become moth-eaten.
translation:
  language: zh_hans
  text: 你们的财富已经腐烂，衣服也已被虫蛀了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλοῦτος
  choice: 财富
  rationale: 指积聚的物质财物；“财富”在现代汉语中自然、宽泛，也符合本段对富足者的斥责。
- source_word: σέσηπεν
  choice: 已经腐烂
  rationale: 完成时表达腐坏已经发生并留下当前结果；“已经腐烂”兼顾过程和现状，也保留具体而强烈的意象。
- source_word: ἱμάτια
  choice: 衣服
  rationale: 泛指衣物；“衣服”是现代汉语中最自然、易懂且范围合适的表达。
- source_word: σητόβρωτα
  choice: 被虫蛀了
  rationale: 该复合词本义是被蛾虫吃坏；汉语惯用“虫蛀”描述衣物遭蛀蚀，形象清楚而不生硬。
- source_word: γέγονεν
  choice: 已……了
  rationale: 以“已”和句末“了”体现衣服进入被虫蛀坏的结果状态，比单说“被虫蛀”更能传达完成时的结果意味。
theological_decisions:
- issue: 陈述是实际现状、预示性描述还是先知式审判宣告
  choice: 保留完成时的直接陈述，不添加“将要”等解释
  alternative: 译作“必将腐烂／必被虫蛀”
  rationale: 希腊文使用完成时，将腐烂和虫蛀呈现为已经形成、结果仍在的状态；即使语境可能带有先知式或末世审判色彩，译文也不应把这种张力直接改写为将来时。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“财富”与“衣服”自然明白；“腐烂”和“被虫蛀了”保留原文具体、尖锐的财物败坏意象。
