reference: James 5:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀γινωσκέτω ὅτι ὁ ἐπιστρέψας ἁμαρτωλὸν ἐκ πλάνης ὁδοῦ αὐτοῦ σώσει ψυχὴν ⸀αὐτοῦ ἐκ θανάτου καὶ καλύψει πλῆθος ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/020.yaml
  text: let him know that whoever turns a sinner back from the error of his way will save his soul from death and will cover a multitude of sins[a][b].
translation:
  language: zh_hans
  text: 他就该知道：使一个罪人从自己迷误的道路上回转的人，必救他的灵魂脱离死亡，并遮盖许多罪。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“必救他的性命脱离死亡”。希腊语这个词既可指“灵魂”，也可指“性命”。
    reason: lexical_alternative
  - marker: b
    text: “他的”可能指被挽回的罪人；也有人理解为指使罪人回转的人。
    reason: alternative_reading
lexical_decisions:
- source_word: γινωσκέτω
  choice: 要知道
  rationale: 这是第三人称单数现在时命令式；结合19—20节的语境，用简洁的劝告语气表达其命令效力。
- source_word: ὁ ἐπιστρέψας
  choice: 那使……回转的人
  rationale: 带冠词的过去时分词作名词用，泛指使偏离者转回的人；“回转”保留恢复、转回的含义，又避免加入后来的专门术语色彩。
- source_word: ἁμαρτωλὸν
  choice: 一个罪人
  rationale: 无冠词的单数名词在此作泛称；“一个罪人”符合现代汉语表达。
- source_word: ἐκ πλάνης ὁδοῦ αὐτοῦ
  choice: 从所走的迷途上
  rationale: πλάνη可指迷误或偏离，ὁδός以道路喻生活方式。“所走的迷途”兼顾错误与道路意象，并自然表明这是罪人所走的路。
- source_word: σώσει
  choice: 必救
  rationale: 保留将来时陈述的确定语气及σῴζω的救拔含义。
- source_word: ψυχὴν αὐτοῦ
  choice: 他的灵魂
  rationale: ψυχή可指“灵魂”或“性命”；正文采用较贴近词形且保留属灵分量的“灵魂”。“他的”不明定所指，使原文中可能指罪人、也可能指使他回转者的歧义得以保留。
- source_word: ἐκ θανάτου
  choice: 脱离死亡
  rationale: 直译介词短语，不限定为肉身死亡或属灵死亡。
- source_word: καλύψει
  choice: 遮盖
  rationale: 保留καλύπτω的圣经性意象，不在正文中解释其具体机制。
- source_word: πλῆθος ἁμαρτιῶν
  choice: 许多罪
  rationale: 自然表达集合名词πλῆθος所强调的大量，同时保持庄重清晰。
theological_decisions:
- issue: ψυχὴν αὐτοῦ中αὐτοῦ的所指
  choice: 正文用“他的灵魂”，不明确指定所指
  alternative: 明确译为“那个罪人的灵魂”或“使他回转之人的灵魂”
  rationale: 希腊文代词通常可理解为指被挽回的罪人，但也有人理解为指使他回转的人；正文以可保留歧义的代词表达，并在脚注中说明。
- issue: ψυχή与θάνατος的意义范围
  choice: 译作“灵魂”与“死亡”，保持宽泛含义
  alternative: 译作“性命……免于死亡”，或明确解释为灵魂脱离属灵死亡
  rationale: 经文可能涉及性命得保全、属灵拯救，或兼含两者；译文不将其收窄到某一特定教义解释。
- issue: “遮盖许多罪”的主体与所指
  choice: 保留原文的简练陈述，不说明这些罪属于谁或如何被遮盖
  alternative: 明确解释为被挽回者的罪蒙赦免，或挽回者自己的罪被遮盖
  rationale: 原文没有明说罪的归属，也没有展开“遮盖”的具体含义；译文保留这种开放性，避免加入经文本身未明言的教义推断。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“迷途”保留道路隐喻；“回转”“遮盖”保留原文及圣经传统中的核心意象。两个脚注标记均置于正文末尾，与其涉及的整句歧义相对应。
