source:
  edition: SBLGNT
  text: ὁ χρυσὸς ὑμῶν καὶ ὁ ἄργυρος κατίωται, καὶ ὁ ἰὸς αὐτῶν εἰς μαρτύριον ὑμῖν ἔσται καὶ φάγεται τὰς σάρκας ὑμῶν· ὡς πῦρ ἐθησαυρίσατε ἐν ἐσχάταις ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/003.yaml
  text: Your gold and silver have rusted[a], and their corrosion will be evidence against you and will eat your flesh like fire[b]. You have stored up treasure in the last days.
translation:
  language: zh_hans
  text: 你们的金银已经锈蚀了[a]；它们的锈蚀将成为控告你们的证据，并像火一样吞吃你们的肉[b]。你们在末后的日子积蓄了财宝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “锈蚀”也可译作“腐蚀”。希腊文在这里可泛指金属受腐蚀或失去光泽，并不要求按现代科学意义理解为铁锈。
    reason: lexical_alternative
  - marker: b
    text: “像火一样”也可与后一句相连，理解为你们在末后的日子积蓄了如同火一般的财宝，或积蓄了火；这种连结在句法和含义上较难确定。
    reason: alternative_reading
lexical_decisions:
- source_word: κατίωται
  choice: 已经锈蚀了
  rationale: 完成时表达先前发生而延续至今的状态。“锈蚀”可涵盖金属的腐蚀或失去光泽，也保留财富败坏的鲜明意象。
- source_word: ὁ ἰὸς αὐτῶν
  choice: 它们的锈迹
  rationale: 在金属语境中，ἰός指锈或腐蚀产物；“锈迹”在现代汉语中自然，也能作为显明罪责的证据。
- source_word: εἰς μαρτύριον ὑμῖν
  choice: 将成为控告你们的证据
  rationale: 该短语带有司法色彩；此译法自然表达不利于受话者的见证或证据。
- source_word: φάγεται τὰς σάρκας ὑμῶν
  choice: 吞吃你们的肉
  rationale: 保留原文具体而骇人的审判意象；“肉”对应复数 σάρκας，不将其抽象化为道德意义上的“肉体”。
- source_word: ἐθησαυρίσατε
  choice: 积蓄了财宝
  rationale: 该动词含有储存财宝之意；“积蓄财宝”贴近词义，而不以“囤积”额外强化贬义。
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: 在末后的日子
  rationale: 采用清楚、常见的末世性表达，不添加原文没有明说的“这些”。
theological_decisions:
- issue: ὡς πῦρ（像火一样）在句中的修饰关系
  choice: 连接前面的“吞吃你们的肉”
  alternative: 连接后面的“在末后的日子积蓄了财宝”，意为“积蓄火”或“所积蓄的如同火”
  rationale: 就相邻位置和语意而言，将其理解为腐蚀“像火一样”吞吃肉最为顺畅；但希腊文的断句容许另一种历史悠久的理解，因此以脚注保留歧义。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“吞吃你们的肉”刻意保留原文强烈而具体的审判意象；分号呈现前后两层指控的推进关系。
