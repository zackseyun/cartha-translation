  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐτρυφήσατε ἐπὶ τῆς γῆς καὶ ἐσπαταλήσατε, ἐθρέψατε τὰς καρδίας ⸀ὑμῶν ἐν ἡμέρᾳ σφαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/005.yaml
  text: You have lived in luxury on the earth and indulged yourselves[d][c][b][a]; you have fattened your hearts in a day of slaughter.
translation:
  language: zh_hans
  text: 你们在世上过着奢华的生活[a]，纵情享乐[b]；你们在宰杀的日子[c]养肥了自己的心[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “过着奢华的生活”也可译作“过着享乐的生活”。
    reason: lexical_alternative
  - marker: b
    text: “纵情享乐”也可译作“放纵自己”。
    reason: lexical_alternative
  - marker: c
    text: “在宰杀的日子”也可译作“为宰杀的日子”。
    reason: alternative_reading
  - marker: d
    text: 这里的图像是牲畜在被宰杀前养肥，很可能暗示将临的审判。
    reason: cultural_note
lexical_decisions:
- source_word: ἐτρυφήσατε
  choice: 过着奢华的生活
  rationale: 该动词指奢华、以享乐为中心的生活；此译自然清楚，并保留责备意味。希腊语不定过去时在这里概括受责备者的既往生活方式，汉语无需机械添加完成体标记。
- source_word: ἐπὶ τῆς γῆς
  choice: 在世上
  rationale: γῆ可指“大地”或“土地”；这里是对富人在现世生活方式的概括，“在世上”既贴近原文，也符合现代汉语表达。
- source_word: ἐσπαταλήσατε
  choice: 纵情享乐
  rationale: 该动词比前一动词更强调放纵和自我满足。“纵情享乐”保留其加强语气及道德责备，又避免生僻或过度古雅的措辞。
- source_word: ἐθρέψατε
  choice: 养肥了
  rationale: τρέφω通常可译为“喂养、滋养”，但与后面的“宰杀”连用时形成牲畜被养肥待宰的反讽意象，因此译为“养肥了”最能传达上下文张力。
- source_word: τὰς καρδίας ὑμῶν
  choice: 自己的心
  rationale: 保留“心”的圣经性人体隐喻，不将其解释性改写为“内在的自己”。用“自己的”自然表达行为主体与所养肥之心的所属关系。
- source_word: ἐν ἡμέρᾳ σφαγῆς
  choice: 在宰杀的日子
  rationale: 直译介词ἐν为“在”，保留“宰杀之日”的鲜明意象及其指向审判的含蓄性，不在正文中把它明确解释为某一种审判场景。
theological_decisions:
- issue: “宰杀的日子”的隐喻所指
  choice: 正文保留宰杀的意象，不明说是上帝的审判
  alternative: 直接译明为面临上帝审判的日子
  rationale: 上下文强烈暗示将临的审判，但原文用待宰牲畜的图像表达，并未在本句明说其具体所指；保留图像可维持原文的神学张力。
- issue: ἐν的时间关系
  choice: 译作“在宰杀的日子”
  alternative: 译作“为宰杀的日子”
  rationale: “为”能更明确表达养肥是为了待宰，却把语境推论直接写入正文；“在”形式上更贴近希腊文，并保留究竟是“身处宰杀之日”还是“为那日养肥”的修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“过着奢华的生活，纵情享乐”形成递进；“养肥了自己的心”刻意保留原文突兀而有力的隐喻。标点以分号呈现前后两组指控之间的紧密关系。
