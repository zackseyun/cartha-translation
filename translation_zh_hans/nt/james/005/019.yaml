  text: Ἀδελφοί ⸀μου, ἐάν τις ἐν ὑμῖν πλανηθῇ ἀπὸ τῆς ἀληθείας καὶ ἐπιστρέψῃ τις αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/james/005/019.yaml
  text: My brothers[a], if anyone among you wanders from the truth and someone turns him back[c][b],
translation:
  language: zh_hans
  text: 我的弟兄们[a]，你们中间若有人偏离真理，又有人使他回转，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”是希腊文的阳性复数称呼；在这里可指整个群体，包括弟兄姊妹。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί μου
  choice: 我的弟兄们[a]
  rationale: 保留希腊文阳性复数呼语及 μου“我的”；此称呼在语境中可包括整个信徒群体，故以脚注说明。
- source_word: ἐάν τις ἐν ὑμῖν
  choice: 你们中间若有人
  rationale: 自然地保留条件句、群体内部范围和不定单数的含义。
- source_word: πλανηθῇ ἀπὸ τῆς ἀληθείας
  choice: 偏离真理
  rationale: πλανηθῇ 为不定过去被动虚拟式，但在此可表达走迷、受迷惑而离开正道；“偏离”在现代汉语中自然，并保留主体误入歧途与受误导之间的开放性，不额外指定行为者。
- source_word: καὶ ἐπιστρέψῃ τις αὐτόν
  choice: 又有人使他回转
  rationale: ἐπιστρέφω 在此指使人从错误中转回；“使他回转”保留及物结构、方向意象及阳性单数代词，并与下一节衔接。
theological_decisions:
- issue: 复数称呼的性别与涵盖范围
  choice: 正文作“我的弟兄们”，脚注说明也可理解为“弟兄姊妹”
  alternative: 我的弟兄姊妹们
  rationale: 希腊文采用阳性复数称呼，但在共同体语境中通常涵盖男女；正文保留形式，脚注交代实际范围。
- issue: πλανηθῇ 的被动形态和语义开放性
  choice: 偏离
  alternative: 被引入歧途；受迷惑而离开；走迷
  rationale: 被动形态可能强调受迷惑，但此类形式也可描述人走入迷途。“偏离”避免武断确定外在施动者，同时保留离开真理的核心意思。
- issue: ἐπιστρέψῃ 的使动含义
  choice: 使他回转
  alternative: 把他带回来；使他归回
  rationale: 保留原文及物性及“转回”的意象，又不把“真理”过度具体化为某一教义体系。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“回转”保留圣经语境中的方向性，又不显陈旧。经文在下一节才完成句意，因此末尾保留逗号。
