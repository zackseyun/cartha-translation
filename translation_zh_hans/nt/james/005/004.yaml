source:
  edition: SBLGNT
  text: ἰδοὺ ὁ μισθὸς τῶν ἐργατῶν τῶν ἀμησάντων τὰς χώρας ὑμῶν ὁ ⸀ἀφυστερημένος ἀφ’ ὑμῶν κράζει, καὶ αἱ βοαὶ τῶν θερισάντων εἰς τὰ ὦτα Κυρίου Σαβαὼθ ⸀εἰσεληλύθασιν·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/004.yaml
  text: Look[a], the wages of the workers who harvested your fields, which have been withheld by you, are crying out, and the cries of those who did the harvesting have entered into the ears of the Lord of Hosts.
translation:
  language: zh_hans
  text: 看哪，你们田地里那些收割工人的工钱，被你们扣下了，正在呼喊；收割者的呼声已经传入万军之主[a]的耳中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“主撒巴俄特”。希腊文保留了源自希伯来文的称号“撒巴俄特”，意思是“万军”。
    reason: 提供该神圣称号的传统音译，并说明正文意译的原文依据。
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 以现代中文仍可理解的庄重警示语引起注意，并保留原文的强调力度。
- source_word: μισθὸς
  choice: 工钱
  rationale: 指应付给雇工的劳动报酬；“工钱”贴合农业雇工语境，也比“工资”更自然。
- source_word: ἐργατῶν
  choice: 工人
  rationale: 直接表达从事劳动的人，符合田间收割的语境。
- source_word: ἀμησάντων
  choice: 收割
  rationale: 该词在此指收割庄稼；“收割”准确、常用，并与后文同义词 θερισάντων 的农业语境呼应。
- source_word: χώρας
  choice: 田
  rationale: 在上下文中指地主所属、供人收割的耕地；“田”简洁自然。
- source_word: ἀφυστερημένος ἀφ’ ὑμῶν
  choice: 被你们扣下的
  rationale: 保留被动表达和直接指控，传达工资遭不当扣留，而不额外加入“欺诈”等解释。
- source_word: κράζει
  choice: 正在呼喊
  rationale: 保留工钱被拟人化、不断呼求公义的鲜明形象；“正在”使场景更具即时性。
- source_word: βοαὶ
  choice: 呼声
  rationale: 表达收割者迫切求助、申诉的声音，庄重且自然。
- source_word: θερισάντων
  choice: 收割之人
  rationale: 忠实呈现分词所指的收割者，并用简洁庄重的中文避免冗长复述。
- source_word: εἰς τὰ ὦτα
  choice: 传入……的耳中
  rationale: 保留原文“进入耳中”的闪族式生动意象，同时使中文通顺。
- source_word: Κυρίου Σαβαὼθ
  choice: 万军之主
  rationale: Σαβαώθ 是源于希伯来文的神圣称号，意为“万军”；译出称号含义，既承接旧约背景，也便于现代读者理解。
- source_word: εἰσεληλύθασιν
  choice: 已经传入
  rationale: “已经”体现完成时所表达的既成事实及其当前效力；“传入”保留进入耳中的意象。
theological_decisions:
- issue: 神圣称号 Κυρίου Σαβαὼθ 的译法
  choice: 万军之主
  alternative: 主撒巴俄特
  rationale: 该短语是源自旧约希伯来传统的神的称号。正文译出“万军”的意义，使普通读者能够理解；脚注保留音译形式，呈现希腊文本保存希伯来称号读音这一事实。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“看哪”保留先知式警告的力度；“工钱……正在呼喊”保留原文的拟人手法；“传入……的耳中”保留其鲜明的圣经意象。
