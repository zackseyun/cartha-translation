source:
  edition: SBLGNT
  text: καὶ πάλιν προσηύξατο, καὶ ὁ οὐρανὸς ⸂ὑετὸν ἔδωκεν⸃ καὶ ἡ γῆ ἐβλάστησεν τὸν καρπὸν αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/018.yaml
  text: And he prayed again[a], and the sky gave rain[b], and the earth produced its fruit.
translation:
  language: zh_hans
  text: 他又祷告，天[a]就降下雨来，地也长出了果实[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天”也可译作“天空”。这里说的是降雨。
    reason: lexical_alternative
  - marker: b
    text: 或译：“地也出产了作物”或“土地也结出果实”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: 又
  rationale: 表示动作再次发生；“又”在现代汉语中简洁自然，并承接前文以利亚先前的祷告。
- source_word: προσηύξατο
  choice: 祷告
  rationale: 该动词在此仅表示祷告；不把第17节“恳切”的意味额外带入本节。
- source_word: ὁ οὐρανὸς
  choice: 天
  rationale: 在降雨语境中指天空；汉语“天”自然贴切，也保留该词可指“天、天空”的语义幅度。
- source_word: ὑετὸν ἔδωκεν
  choice: 降下雨来
  rationale: 原文直译为“给了雨”。汉语以“天降下雨来”表达最自然，同时保留以“天”为主语的原文形象，不另加“上帝赐下”等解释。
- source_word: ἡ γῆ
  choice: 地
  rationale: 可指地、土地或地面；此处与“天”平行，“地”既简洁又能涵盖农业语境。
- source_word: ἐβλάστησεν
  choice: 长出了
  rationale: 该词表示萌芽、生长或产出；与“果实”搭配时，“长出了”自然，并较好保留生长的具体意象。
- source_word: τὸν καρπὸν αὐτῆς
  choice: 果实
  rationale: 原文是“它的果实”，在此指地里的出产；汉语省去可由语境明白的所属成分更自然，“果实”也比“庄稼”保留更宽的语义。
theological_decisions:
- issue: 以利亚祷告之后的神圣回应
  choice: 按原文描述可见的结果：天降雨，地长出果实，不明说行动者是上帝。
  alternative: 译成“上帝就从天降雨，使地出产”。
  rationale: 上下文清楚暗示这是上帝对祷告的回应，但本节本身以“天”和“地”为主语。译文不加入原文未明说的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“天就降下雨来，地也长出了果实”保留原文天与地的平行结构及拟人化表达；两个“也/就”的衔接使连续结果在汉语中流畅。
