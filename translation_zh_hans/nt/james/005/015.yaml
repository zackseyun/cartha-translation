  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἡ εὐχὴ τῆς πίστεως σώσει τὸν κάμνοντα, καὶ ἐγερεῖ αὐτὸν ὁ κύριος· κἂν ἁμαρτίας ᾖ πεποιηκώς, ἀφεθήσεται αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/015.yaml
  text: And the prayer of faith will save the one who is sick[a], and the Lord will raise him up. And if he has committed sins[c][b], he will be forgiven.
translation:
  language: zh_hans
  text: 出于信心[b]的祷告必拯救[a]那患病的人，主必使他起来。即使他犯过罪[c]，也必蒙赦免。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拯救”在这里也可译作“医治”或“使……康复”；希腊文直译为“拯救”。
    reason: lexical_alternative
  - marker: b
    text: “出于信心的祷告”也可理解为“以信靠为特征的祷告”；在这里理解为“出于忠信的祷告”的可能性较小。
    reason: lexical_alternative
  - marker: c
    text: 或译：“如果他犯过罪”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχὴ
  choice: 祷告
  rationale: 上文谈到长老为病人祷告（5:14），因此这里指向神的祷告，而不是“许愿”。
- source_word: πίστεως
  choice: 信心
  rationale: “出于信心的祷告”自然表达属格所表示的特征，即以对神的信靠为特征的祷告，同时保留“信心”这一核心用语。
- source_word: σώσει
  choice: 拯救
  rationale: σῴζω在患病语境中可指医治、使人康复，但“拯救”保留原词较宽的含义，并让上下文显明身体得恢复也在视野之内。
- source_word: τὸν κάμνοντα
  choice: 那患病的人
  rationale: κάμνω可表示疲惫、衰弱或患病；本段提到疾病、抹油和使人起来，因此“患病的人”最符合语境。
- source_word: ἐγερεῖ
  choice: 使他起来
  rationale: 保留ἐγείρω“使……起来”的具体意象；在这里首先可理解为使病人从病榻起来，同时不排除更广的神圣恢复意味。
- source_word: ὁ κύριος
  choice: 主
  rationale: 这是新约中κύριος指神圣主权者的标准、庄重译法。
- source_word: κἂν ἁμαρτίας ᾖ πεποιηκώς
  choice: 即使他犯过罪
  rationale: κἄν带有条件兼让步色彩；“即使”清楚表达：罪在此被作为可能情形提出，并非断言所有疾病都由个人犯罪造成。完成时结构用“犯过”自然呈现既成行为。
- source_word: ἀφεθήσεται αὐτῷ
  choice: 也必蒙赦免
  rationale: 用“蒙赦免”自然保留神学被动语态，即施行赦免者虽未明说，却可理解为神。
theological_decisions:
- issue: σώσει在这里应窄译为身体得医治，还是保留较广的拯救含义
  choice: 正文译作“拯救”，并由“患病的人”和“使他起来”的语境显出医治、康复之意。
  alternative: 译作“医治”或“使……康复”。
  rationale: 本节确实聚焦疾病，但雅各使用的是可兼具拯救与恢复含义的σῴζω。正文保留词义宽度，脚注说明语境中的医治含义。
- issue: 本节是否应被译成祷告必然自动带来每一次身体医治
  choice: 照原文将来时的直接陈述译为“必拯救”“必使……起来”，不另加弱化或绝对化的解释。
  alternative: 加译为“可能使他康复”，或解释成“每一次都必定立刻痊愈”。
  rationale: 译文既不削弱原文的应许，也不加入关于医治方式、时间或机制的宗派性结论。
- issue: 赦罪是否意味着一切疾病都由患者个人犯罪引起
  choice: 以“即使他犯过罪”保留条件和让步关系。
  alternative: 译成断言病人必定犯了导致其疾病的罪，或完全割裂赦罪与本句条件结构的关系。
  rationale: 原文把犯罪作为可能存在的情况提出，并未宣称个人犯罪是所有疾病的普遍原因。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“出于信心的祷告”比生硬的“信心的祷告”更自然；“使他起来”保留原文意象；“蒙赦免”兼顾现代可懂性与经文语体。脚注标记均置于正文对应词语之后。
