  text: μακροθυμήσατε καὶ ὑμεῖς, στηρίξατε τὰς καρδίας ὑμῶν, ὅτι ἡ παρουσία τοῦ κυρίου ἤγγικεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/008.yaml
  text: You also be patient; strengthen your hearts[a], because the coming of the Lord has drawn near.
translation:
  language: zh_hans
  text: 你们也要忍耐，坚定你们的心，因为主的来临[a]已经近了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “来临”或译“同在”。希腊语παρουσία可指“同在”或“来临”；在本段语境中，它指主在末世的到来。
    reason: lexical_alternative
lexical_decisions:
- source_word: μακροθυμήσατε
  choice: 要忍耐
  rationale: 该词为第二人称复数不定过去时主动命令式，指在艰难中持久忍耐；“要忍耐”简明自然，也承接上文农夫耐心等候的比喻。
- source_word: καὶ ὑμεῖς
  choice: 你们也
  rationale: 既保留连接作用，也体现显式代词的强调，使读者与上文所举的榜样相联系。
- source_word: στηρίξατε
  choice: 坚定
  rationale: 该词为第二人称复数不定过去时主动命令式，可指使之坚固、稳固；“坚定你们的心”在现代汉语中自然，并保留内在坚毅的含义。
- source_word: τὰς καρδίας ὑμῶν
  choice: 你们的心
  rationale: 直译并保留圣经中的“心”这一比喻；此处涵盖人的内在意志、勇气和决心。
- source_word: ὅτι
  choice: 因为
  rationale: 引出前述两个命令的理由，“因为”清楚表达因果关系。
- source_word: ἡ παρουσία
  choice: 来临
  rationale: παρουσία既可指“同在”，也可指“到来、来临”；雅各书5:7–8的末世性语境表明这里主要指主的到来，同时以脚注保留其词义幅度。
- source_word: τοῦ κυρίου
  choice: 主的
  rationale: κύριος在此为称号；“主”符合新约惯常用语，也适合本段关于末世来临的语境。
- source_word: ἤγγικεν
  choice: 已经近了
  rationale: 该词为完成时主动直说语气第三人称单数，表达已经临近并处于近在眼前的状态；“已经近了”兼顾完成时意味与现代汉语的自然表达。
theological_decisions:
- issue: παρουσία在有关主的末世性陈述中的含义
  choice: 主的来临
  alternative: 主的同在
  rationale: παρουσία在词义上可以表示“同在”，但雅各书5:7–8以等候主为主题，语境指向主将来的末世性到来。正文采用“来临”，脚注则保留“同在”这一真实的词汇可能性，不将词义范围抹平。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“坚定你们的心”保留原文的圣经性比喻；“已经近了”自然表达希腊语完成时所呈现的临近状态。脚注标记紧随其实际说明的“来临”之后。
