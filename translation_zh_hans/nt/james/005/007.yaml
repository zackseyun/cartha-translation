id: JAS.5.7
reference: James 5:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Μακροθυμήσατε οὖν, ἀδελφοί, ἕως τῆς παρουσίας τοῦ κυρίου. ἰδοὺ ὁ γεωργὸς ἐκδέχεται τὸν τίμιον καρπὸν τῆς γῆς, μακροθυμῶν ἐπ’ ⸀αὐτῷ ἕως ⸀λάβῃ πρόϊμον καὶ ὄψιμον.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/007.yaml
  text: Be patient[a], therefore, brothers, until the coming of the Lord. Look, the farmer waits for the precious fruit of the earth[b], being patient over it until it receives the early and late rains.
translation:
  language: zh_hans
  text: 所以，弟兄们[a]，你们要耐心等候，直到主来临[b]。看哪，农夫耐心地等候地里宝贵的出产，直到秋雨和春雨来到。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姊妹们”；希腊原文作“弟兄们”，这种称呼常用来指整个信徒群体。
    reason: 说明原文的性别形式及实际称呼范围。
  - marker: b
    text: “来临”也可译作“临在”；这里很可能是指主将来的到来。
    reason: 保留παρουσία的词义范围及其在本节中的语境含义。
lexical_decisions:
- source_word: Μακροθυμήσατε
  choice: 要耐心等候
  rationale: 该不定过去时命令式要求人在延宕和困苦中持久忍耐；“耐心等候”既符合上下文，也能与下文农夫的耐心相呼应。
- source_word: οὖν
  choice: 所以
  rationale: 表明本节是根据上文所得出的劝勉；“所以”在现代汉语中自然地保留了推论关系。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊语阳性复数称呼的形式；在早期信徒群体中，这一称呼常涵盖整个群体，其范围以脚注说明。
- source_word: παρουσίας
  choice: 来临
  rationale: 在这里指所期待的主未来来到；“来临”自然且庄重，同时不排除该词本有“临在”之义。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留引人注意并引出例证的语气；“看哪”虽庄重，却仍为现代读者熟悉。
- source_word: γεωργὸς
  choice: 农夫
  rationale: 泛指耕种土地的人，“农夫”简洁自然，符合农业比喻。
- source_word: ἐκδέχεται
  choice: 等候
  rationale: 表达带着期待持续等待；与全节关于忍耐的主题相合。
- source_word: τίμιον καρπὸν τῆς γῆς
  choice: 地里宝贵的出产
  rationale: καρπός在农业语境中指土地所结的成果；“出产”比直译“果子”更自然，也不把所种作物限定为果树。
- source_word: μακροθυμῶν ἐπ’ αὐτῷ
  choice: 为它耐心守候
  rationale: 重复μακροθυμ-的耐心主题，并将代词自然理解为前述出产；“守候”避免与前半句机械重复而保留持续忍耐之意。
- source_word: πρόϊμον καὶ ὄψιμον
  choice: 秋雨和春雨
  rationale: 原文省略“雨”，按固定农业用语补出；所指是播种季节较早降下的秋雨和成熟前较晚降下的春雨，而不是一天中的早晚。
theological_decisions:
- issue: ἀδελφοί所称呼的群体范围
  choice: 正文译作“弟兄们”，脚注说明可包括弟兄姊妹
  alternative: 正文直接译作“弟兄姊妹们”
  rationale: 既保留原文的语法形式，也避免让现代读者误以为劝勉必然只针对男性。
- issue: παρουσία τοῦ κυρίου的末世含义
  choice: 主来临
  alternative: 主临在
  rationale: 本段劝人等候一个未来时点，“来临”最符合语境；同时以脚注保留παρουσία可表示“临在”的词义，不进一步规定末世事件的具体次序。
- issue: λάβῃ的主语
  choice: 译作“直到它得了”，以地里的出产为主语
  alternative: 译作“直到他得了”，以农夫为主语
  rationale: 希腊语动词主语未明说，语法上可承接农夫，也可按意义理解为出产；雨直接滋养作物，因此正文采用后者，但不据此建立额外教义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留经文引出例证的修辞力度；“秋雨和春雨”按古代巴勒斯坦农业季节表达早雨与晚雨。
