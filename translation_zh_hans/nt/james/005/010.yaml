id: JAS.5.10
reference: James 5:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὑπόδειγμα λάβετε, ⸀ἀδελφοί, τῆς κακοπαθίας καὶ τῆς μακροθυμίας τοὺς προφήτας, οἳ ἐλάλησαν ⸀ἐν τῷ ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/010.yaml
  text: Brothers[a], take the prophets who spoke in the name of the Lord as an example of suffering and patience.
translation:
  language: zh_hans
  text: 弟兄们[a]，你们要以奉主的名说话的众先知为受苦和忍耐的榜样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”译自希腊语阳性复数 ἀδελφοί；在这里，雅各很可能是在称呼包括女性在内的整个信徒群体。
    reason: 说明原文的语法性别与语境中的可能指称范围。
lexical_decisions:
- source_word: ὑπόδειγμα
  choice: 榜样
  rationale: 该词指可供效法的范例；“榜样”符合本节劝勉的语气，也是自然、通行的现代汉语。
- source_word: λάβετε
  choice: 要以……为
  rationale: 这是不定过去时命令式；结合 ὑπόδειγμα 和宾语，汉语用“以……为……的榜样”准确表达“拿……作为榜样”的意思。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊语阳性复数呼语的形式；其在书信语境中很可能泛指包括女性在内的整个信徒群体，故在脚注中说明。
- source_word: κακοπαθίας
  choice: 受苦
  rationale: 该词表示遭受苦难或困苦；“受苦”简洁自然，并保留先知所经历之苦难的广泛含义。
- source_word: μακροθυμίας
  choice: 忍耐
  rationale: 该词表示在艰难处境或面对他人时恒久忍耐；“忍耐”是普通读者容易理解且贴合语境的表达。
- source_word: τοὺς προφήτας
  choice: 众先知
  rationale: 这是命令所涉及的宾语，指作为榜样的先知群体；“众先知”简明而庄重。
- source_word: ἐλάλησαν
  choice: 说话
  rationale: λαλέω 是普通的“说”；译作“说话”不额外加入“宣告”或“传讲”等原文未明说的正式色彩。
- source_word: ἐν τῷ ὀνόματι κυρίου
  choice: 奉主的名
  rationale: 这是圣经中表示代表主并凭其权柄行事的惯用语；“奉主的名”既保留原文意象，也符合自然汉语。
- source_word: κυρίου
  choice: 主
  rationale: κύριος 译为“主”；在“奉主的名”这一汉语结构中无需另加定冠词。
theological_decisions:
- issue: 会众称呼 ἀδελφοί 的性别形式与指称范围
  choice: 正文译作“弟兄们”，脚注说明可能包括女性
  alternative: 弟兄姊妹；众弟兄姊妹
  rationale: 原词在语法形式上是阳性复数，但书信中的这类称呼通常可指整个信徒群体。正文保留形式上的性别信息，脚注则避免读者误以为明确排除女性。
- issue: 众先知与“榜样”之间的句法和语义关系
  choice: 以众先知为受苦和忍耐的榜样
  alternative: 在受苦和忍耐方面，要以众先知为榜样
  rationale: 原文以“众先知”为 λάβετε 的宾语，并以两个属格说明他们在哪些方面构成榜样。所选表达保留这一关系，同时使汉语简洁顺畅。
- issue: ἐν τῷ ὀνόματι κυρίου 所表达的代表与权柄含义
  choice: 保留“奉主的名”这一圣经惯用语
  alternative: 代表主说话；凭主的权柄说话
  rationale: 原文可同时包含代表和权柄的意味；若在正文中只选其中一种解释，会缩窄其含义，因此保留较为开放的惯用表达。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“以……为……的榜样”体现原文的劝勉结构；“奉主的名”保留圣经惯用表达及其代表、权柄两方面的含义。脚注标记 [a] 已置于正文相应称呼之后。
