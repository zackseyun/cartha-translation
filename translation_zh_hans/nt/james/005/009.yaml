  text: μὴ στενάζετε, ⸂ἀδελφοί, κατ’ ἀλλήλων⸃, ἵνα μὴ κριθῆτε· ἰδοὺ ὁ κριτὴς πρὸ τῶν θυρῶν ἕστηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/009.yaml
  text: Do not grumble against one another[a], brothers, so that you may not be judged. Look, the Judge is standing at the doors.
translation:
  language: zh_hans
  text: 弟兄们[a]，不要彼此埋怨，免得你们受审判。看哪，审判者已经站在门前了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”译自希腊文 adelphoi；按语境，这个称呼可以统指同属信仰群体的男女。
    reason: lexical_alternative
lexical_decisions:
- source_word: στενάζετε
  choice: 埋怨
  rationale: 该动词本可表示“叹息、呻吟”，但与 κατ’ ἀλλήλων（彼此相向、彼此针对）连用时，重点是对群体中其他人的不满和怨言；“埋怨”自然地传达这种人际和伦理意味。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊文阳性复数称呼的形式；在当时基督徒群体的语境中，此词可统称男女信徒，因此以脚注说明其涵盖范围。
- source_word: κατ’ ἀλλήλων
  choice: 彼此
  rationale: κατά 加属格在此表示针对或敌对的方向；与“埋怨”搭配时，“彼此埋怨”简洁自然，并保留群体内部相互针对的含义。
- source_word: κριθῆτε
  choice: 受审判
  rationale: 保留 κρίνω 的宽泛审判含义，不提前强化为“被定罪”；“免得”恰当地表达 ἵνα μή 所引出的目的或结果。
- source_word: κριτής
  choice: 审判者
  rationale: 译出其施行审判者的身份，却不在正文中擅自指明是父神还是基督，从而保留原文在末世审判语境中的指称张力。
- source_word: πρὸ τῶν θυρῶν
  choice: 在门前
  rationale: 这是表达迫近的惯用语。希腊文“门”为复数，但现代汉语“在门前”不必标示数，既自然，也保留审判者已经临近的核心意象。
- source_word: ἕστηκεν
  choice: 已经站着
  rationale: 希腊文完成时强调先前站定而形成的当前状态；“已经站在门前了”用自然汉语同时体现动作已成和如今仍在的临场感。
theological_decisions:
- issue: “审判者”的所指
  choice: 正文只译“审判者”，不进一步明确身份
  alternative: 明确译作“主”或“基督”
  rationale: 上下文中的临近审判语言最自然地使人想到将临的主，但希腊文本节只说“审判者”。保留这一称谓可传达神圣、末世性的审判，同时避免消除原文留有的指称空间。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“彼此埋怨”比直译“彼此叹息”更清楚地表达针对他人的怨言；“看哪”保留 ἰδού 的警醒和强调语气。
