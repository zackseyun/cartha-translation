  text: Κακοπαθεῖ τις ἐν ὑμῖν; προσευχέσθω· εὐθυμεῖ τις; ψαλλέτω.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/013.yaml
  text: Is anyone among you suffering? Let him pray[a]. Is anyone cheerful? Let him sing praise.
translation:
  language: zh_hans
  text: 你们中间有人受苦吗？就应当祷告。有人心情舒畅吗？就应当歌唱颂赞[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“吟唱诗篇”；这个希腊语动词既可特指吟唱诗篇，也可泛指歌唱颂赞。
    reason: lexical_alternative
lexical_decisions:
- source_word: Κακοπαθεῖ
  choice: 受苦
  rationale: κακοπαθέω指经历苦难、困苦或逆境。“受苦”简洁自然，也没有把范围缩窄为疾病或受迫害。
- source_word: τις
  choice: 有人
  rationale: 不定代词τις在两个问句中均为单数泛指；“有人……吗”是现代汉语表达这种泛指最自然的方式，也不限定性别。
- source_word: ἐν ὑμῖν
  choice: 你们中间
  rationale: 准确表达此人属于受信群体；“你们中间”自然、清楚。
- source_word: προσευχέσθω
  choice: 就应当祷告
  rationale: 现在时第三人称命令式表达持续有效的劝勉。“应当”保留命令和劝勉的力度；省略代词符合汉语习惯，同时仍承接单数泛指的“有人”。
- source_word: εὐθυμεῖ
  choice: 心情舒畅
  rationale: εὐθυμέω表示振作、心境良好或精神愉快。“心情舒畅”自然地呈现这种良好心境，并与前句的受苦形成对照。
- source_word: ψαλλέτω
  choice: 就应当歌唱颂赞
  rationale: ψάλλω在此指以歌唱表达对上帝的颂赞，也可能特指吟唱诗篇。“歌唱颂赞”清楚表达敬拜方向，同时不把经文限定为只唱诗篇；较窄含义置于脚注。
theological_decisions:
- issue: 单数命令式的泛指表达
  choice: 用“有人……就应当……”保持单数泛指，不另加性别代词
  alternative: 译为“他就应当……”或改用复数表达
  rationale: 希腊文以τις搭配第三人称单数命令式，所指是群体中的任何一个人。汉语无需借助带性别的代词即可自然保留单数泛指和劝勉力度。
- issue: ψαλλέτω的含义范围
  choice: 歌唱颂赞
  alternative: 吟唱诗篇；歌唱；奏乐
  rationale: 此词可以指吟唱诗篇，也可较广泛地指歌唱颂赞。正文采用自然且符合语境的广义表达，脚注保留较窄的词义可能，避免把经文解释成特定的礼仪规定。
translation_notes:
  register: 采用现代、简洁而庄重的劝勉语体。两个平行问句及其回应保持对称；以“就应当”传达命令式，不使用生硬的“让他”。脚注标记置于“歌唱颂赞”之后，因为脚注解释的是ψαλλέτω。
