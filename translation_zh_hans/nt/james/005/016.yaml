id: JAS.5.16
reference: James 5:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐξομολογεῖσθε ⸀οὖν ἀλλήλοις ⸂τὰς ἁμαρτίας⸃ καὶ ⸀εὔχεσθε ὑπὲρ ἀλλήλων, ὅπως ἰαθῆτε. πολὺ ἰσχύει δέησις δικαίου ἐνεργουμένη.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/016.yaml
  text: Therefore[a], confess your sins to one another and pray for one another, so that you may be healed. The prayer of a righteous person is very powerful as it is at work.
translation:
  language: zh_hans
  text: 所以，你们要彼此承认自己的罪，并为彼此祷告，好使你们得医治。义人的祈求发挥作用时，大有力量。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“义人的祈求在发挥作用时，效力极大。”
    reason: ἐνεργουμένη与πολὺ ἰσχύει的组合在句法和表达上可理解为祈求正在运作而大有力量，也可着重其显著功效；脚注保留这一措辞差异。
lexical_decisions:
- source_word: ἐξομολογεῖσθε
  choice: 承认
  rationale: 该词在这里与“罪”连用，表示公开承认；译作“承认”既保留彼此坦承的道德分量，也不把经文限定为某种正式的宗教礼仪。
- source_word: οὖν
  choice: 所以
  rationale: 承接上文关于祷告、罪与恢复的论述，表达推论关系；“所以”符合现代汉语表达。
- source_word: ἀλλήλοις
  choice: 彼此
  rationale: 清楚表达相互、对等的行动，与本节两项命令的群体性相符。
- source_word: τὰς ἁμαρτίας
  choice: 自己的罪
  rationale: 原文直译为“罪”；在“彼此承认”的结构中，汉语补出“自己的”可自然、准确地说明各人所承认的是自己的罪，而非彼此指控。
- source_word: εὔχεσθε ὑπὲρ ἀλλήλων
  choice: 为彼此祷告
  rationale: ὑπέρ加属格表示“为、代表”；此译简明保留代求含义。
- source_word: ὅπως ἰαθῆτε
  choice: 好使你们得医治
  rationale: “好使”保留目的或结果关系；“得医治”不把医治范围擅自缩窄为单指身体或灵性。
- source_word: δέησις
  choice: 祈求
  rationale: 该词特指带有恳求、请求性质的祷告；“祈求”比笼统的“祷告”更贴近其词义。
- source_word: δικαίου
  choice: 义人
  rationale: 希腊文形容词在此作名词使用，泛指一个义人；现代汉语“义人”不必然限定性别，并保留经文的箴言式语气。
- source_word: πολὺ ἰσχύει
  choice: 大有力量
  rationale: 表达祈求具有很大的效力或能力，同时避免把结果具体化为原文没有明说的某种成就。
- source_word: ἐνεργουμένη
  choice: 发挥作用时
  rationale: 该现在分词修饰“祈求”，语态和句法存在解释空间；此译自然表达其正在运作、产生效力之意，又不明确限定为纯主动或被动。
theological_decisions:
- issue: 本节是否规定向神职人员作圣礼性的告解
  choice: 译为信徒“彼此”承认自己的罪
  alternative: 译成由受按立的神职人员居中听取告解
  rationale: ἀλλήλοις明确表示相互性；译文忠实呈现受信群体中的彼此认罪，但不对不同传统如何在教会生活中应用本节另作裁断。
- issue: ἰαθῆτε所指医治的范围
  choice: 保留宽泛的“得医治”
  alternative: 限定为身体痊愈，或限定为灵性复原
  rationale: 上下文突出疾病，同时本句又提到罪；因此不应把原文张力缩窄为单一层面。
- issue: δικαίου的性别表达
  choice: 义人
  alternative: 义男或一个公义的男人
  rationale: 阳性单数形式在此以箴言式方式泛指人；汉语“义人”准确且不额外引入男性限定。
- issue: ἐνεργουμένη的语态与祈祷功效
  choice: 发挥作用时
  alternative: 被运行时，或本身有效的
  rationale: 该分词可按中间或被动色彩理解，译文不指定力量必然以某一特定机制临到祷告，脚注保留另一种顺畅表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“彼此承认自己的罪”比单说“彼此认罪”更透明，也避免被误读为彼此指控；“祈求”与前句较宽泛的“祷告”形成合乎原文的词汇区别。
