id: JAS.2.11
reference: James 2:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ γὰρ εἰπών Μὴ ⸀μοιχεύσῃς εἶπεν καί Μὴ ⸀φονεύσῃς· εἰ δὲ οὐ ⸂μοιχεύεις φονεύεις⸃ δέ, γέγονας παραβάτης νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/011.yaml
  text: For he who said, “Do not commit adultery,” also said, “Do not murder.” Now if you do not commit adultery but do murder, you have become a transgressor of the law.
translation:
  language: zh_hans
  text: 因为那位说“不可奸淫”的，也说“不可杀人”。你若不奸淫，却杀人，便成了违犯律法的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... εἰπών
  choice: 那位说……的
  rationale: 带冠词的分词作名词使用，指颁布诫命的那一位。译文保留其人称指向，却不把原文未明说的“上帝”直接补入正文。
- source_word: Μὴ μοιχεύσῃς
  choice: 不可奸淫
  rationale: μή加不定过去时虚拟语气表达禁令，并呼应十诫措辞。“不可奸淫”在现代汉语中简洁、庄重，也准确表达婚姻关系中的性不忠。
- source_word: καί
  choice: 也
  rationale: 强调两条诫命出自同一位说话者，承接雅各论证律法具有整体性的重点。
- source_word: Μὴ φονεύσῃς
  choice: 不可杀人
  rationale: φονεύω指非法夺取人命；“不可杀人”是汉语中清楚而庄重的诫命表达，在此伦理语境中自然指凶杀，而非对所有致死行为作额外扩张。
- source_word: εἰ δὲ
  choice: 你若……却……
  rationale: εἰ引出假设，δὲ在条件内部形成鲜明对比；汉语用“若……却……”自然呈现这一论证关系。
- source_word: οὐ μοιχεύεις ... φονεύεις δέ
  choice: 不奸淫，却杀人
  rationale: 两个现在时直陈语气在假设中描述一般情形；简洁的汉语动词结构保留两种行为之间的对照。
- source_word: γέγονας
  choice: 便成了
  rationale: γίνομαι的完成时表达因行为而进入并处于某种身份或状态；“便成了”既保留结果意味，也符合汉语条件句的自然表达。
- source_word: παραβάτης νόμου
  choice: 违犯律法的人
  rationale: παραβάτης指越界、违反规定者；“违犯律法的人”保持法律与伦理语域，并比生硬的名词化表达更适合现代普通读者。
- source_word: νόμου
  choice: 律法
  rationale: 此处指前文所谈、并由所引诫命体现的上帝律法；汉语无需另加指示词也能明确其特指意义。
theological_decisions:
- issue: 颁布诫命者的身份
  choice: 译作“那位说……的”，不在正文中直接补出“上帝”
  alternative: 译作“因为上帝说……”
  rationale: 上下文清楚暗示说话者是上帝，但希腊文只写“那位说……的”。保留原文表达可避免把隐含信息改成明说，同时不削弱论证。
- issue: 违犯律法的范围
  choice: 译作“违犯律法的人”
  alternative: 译作“违犯那条诫命的人”
  rationale: 原文是παραβάτης νόμου，所指是违犯律法，而不只是触犯某一条孤立的诫命；这样也保留雅各在上下文中对律法整体性的论证。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“不可奸淫”“不可杀人”保留诫命式语气；后半句用“若……却……便……”清楚呈现假设、对比和结果。
