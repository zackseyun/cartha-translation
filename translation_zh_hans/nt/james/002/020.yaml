  text: θέλεις δὲ γνῶναι, ὦ ἄνθρωπε κενέ, ὅτι ἡ πίστις χωρὶς τῶν ἔργων ⸀ἀργή ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/020.yaml
  text: But do you want to know[a], O foolish man[b], that faith apart from works is useless?
translation:
  language: zh_hans
  text: 可是，虚浮的人哪，你愿意知道，信心离了行为是无效的[a]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无效”或译“闲置”“不产生果效”。原文一词表示不活动、不起作用或没有产出。
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλεις δὲ γνῶναι
  choice: 可是……你愿意明白
  rationale: θέλω加不定式表达意愿；δέ在此承接并带转折意味，译作“可是”。γνῶναι译作“明白”，符合这里要求对方认识一个道理的语境。
- source_word: ὦ ἄνθρωπε κενέ
  choice: 虚浮的人哪
  rationale: ἄνθρωπε是单数呼格；κενέ本义为“空的”，用于人时指内里空洞、缺乏实质或见识。“虚浮”既保留空洞之意，也比直译“空的人”更符合现代汉语。
- source_word: ὅτι
  choice: （引出问句内容）
  rationale: ὅτι引出γνῶναι的内容；汉语将整句自然组织为“你愿意明白……吗”，无需另译“即”。
- source_word: ἡ πίστις
  choice: 信心
  rationale: 在雅各讨论信与行为的语境中，“信心”是πίστις准确、通行且不过度解释的译法。
- source_word: χωρὶς τῶν ἔργων
  choice: 没有行为
  rationale: χωρίς加属格表示“没有、离开”；ἔργων译作“行为”。“没有行为”在现代汉语中自然地表达信心与行为相分离。
- source_word: ἀργή ἐστιν
  choice: 是无效的
  rationale: ἀργός在此表示闲置、不起作用、不产生果效；“无效”清楚表达其实际不起作用的含义，同时不误译成邻近经文的“死”。
theological_decisions:
- issue: 雅各论述中信心与行为的关系
  choice: 直译为“信心没有行为是无效的”，不附加宗派性解释。
  alternative: 可译作“闲置的”或“不产生果效的”；也有人可能受上下文影响译作“死的”。
  rationale: 本节用的是ἀργή，而不是νεκρά。译文应保留本节自身的措辞和张力，不把它改写成邻近经文或后世神学体系的用语。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“虚浮的人哪”保留单数呼语和κενός“空洞、缺乏实质”的形象；全句用反问形式，保持原文质询语气。
