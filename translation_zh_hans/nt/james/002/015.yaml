base_translation:
  language: en
  yaml_path: translation/nt/james/002/015.yaml
  text: If a brother or sister is poorly clothed and lacking daily food,[a]
translation:
  language: zh_hans
  text: 如果有弟兄或姊妹衣不蔽体[a]，又缺少每天的食物，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“赤身裸体”；希腊语原词可指完全没有穿衣服，但在这里更可能指衣物不足。
    reason: 词义存在字面与语境义两种可能，需保留原文的真实歧义。
lexical_decisions:
- source_word: ἐὰν
  choice: 如果有
  rationale: 引出假设条件；加“有”符合现代汉语表达，也与后面的存在状态自然衔接。
- source_word: ἀδελφὸς ἢ ἀδελφὴ
  choice: 弟兄或姊妹
  rationale: 直接保留原文明确的阳性、阴性并列，也保留雅各在语境中对信徒使用的亲属称谓。
- source_word: γυμνοὶ
  choice: 衣不蔽体
  rationale: 此词本可指赤身裸体；在与缺少日用食物并列的贫困语境中，更可能表示衣着严重不足。“衣不蔽体”既自然庄重，又不把含义弱化为一般的穿着寒酸。
- source_word: ὑπάρχωσιν
  choice: 有……衣不蔽体
  rationale: 该动词在此表达所处状态；汉语以“有”引出假设人物，再用谓语说明其境况，最为自然。
- source_word: λειπόμενοι
  choice: 缺少
  rationale: 表达持续处于不足、匮乏的状态，简洁且贴近原文。
- source_word: τῆς ἐφημέρου τροφῆς
  choice: 每天的食物
  rationale: ἐφήμερος 指当日或日常所需，τροφή 指食物、养生之物；此译准确表达维持日常生活的食物。
theological_decisions:
- issue: ἀδελφὸς ἢ ἀδελφή 所指群体的范围
  choice: 译作“弟兄或姊妹”，保留信仰群体中的亲属语言
  alternative: 泛译为“有人”或“同胞”
  rationale: 上下文很可能指信徒群体中的成员，但本节本身没有进一步界定范围；直译亲属称谓可保留原文措辞而不扩大或缩小其所指。
- issue: γυμνοί 是完全赤裸还是衣着不足
  choice: 正文译“衣不蔽体”，脚注保留“赤身裸体”的可能
  alternative: 正文译“赤身裸体”或“衣着单薄”
  rationale: 词义可以是完全无衣，但贫困与缺粮的语境较可能指衣物严重不足；采用较符合语境而仍具强度的表达，并用脚注保存字面可能性。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“衣不蔽体”虽属成语，但仍通行且准确传达严重缺衣的境况。本节在希腊文中是条件句的前半部分，因此保留句末逗号，与下一节衔接。
