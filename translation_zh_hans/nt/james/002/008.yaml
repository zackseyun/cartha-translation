  text: Εἰ μέντοι νόμον τελεῖτε βασιλικὸν κατὰ τὴν γραφήν Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν, καλῶς ποιεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/james/002/008.yaml
  text: If[a], however, you are fulfilling the royal law according to the Scripture, “You shall love your neighbor as yourself,” you are doing well.
translation:
  language: zh_hans
  text: 不过，你们若照着经上所说：“要爱邻舍如同自己”，履行这皇家律法[a]，你们就做得好。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“君王的律法”或“王家的律法”。也有人理解为“至高的律法”或“国度的律法”。希腊文为“皇家（或君王的）律法”，可能强调它属于或出于君王，也可能强调它的至高地位。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ μέντοι
  choice: 不过……若
  rationale: 保留 εἰ 的条件语气和 μέντοι 轻微转折、补充说明的作用；这一语序符合现代汉语表达。
- source_word: νόμον ... βασιλικὸν
  choice: 那君王的律法
  rationale: βασιλικός 的基本含义是“属于君王的、王家的”。“君王的律法”自然且贴近原文，同时不把它限定为“最重要的律法”或直接释作“国度的律法”。
- source_word: τελεῖτε
  choice: 履行
  rationale: 表达 τελέω 在此处实行、贯彻律法要求的含义，比单纯“遵守”更能体现落实完成的意味。
- source_word: κατὰ τὴν γραφήν
  choice: 照着圣经所说
  rationale: 既表达“按照、符合”的关系，也自然引出后面的经文引语；单数带冠词的 γραφή 在此指所引用的圣经话语。
- source_word: Ἀγαπήσεις
  choice: 要爱
  rationale: 这是未来时形式承担命令功能的经文引语；现代汉语用“要爱”可清楚传达命令语气，同时保持庄重。
- source_word: τὸν πλησίον σου
  choice: 邻舍
  rationale: “邻舍”是现代中文圣经语境中成熟且简洁的伦理用语，准确对应 πλησίον。
- source_word: ὡς σεαυτόν
  choice: 如同自己
  rationale: 保留希腊文简洁的比较结构，不补入原文未明说的“爱”。
- source_word: καλῶς ποιεῖτε
  choice: 就是做得好
  rationale: 自然表达对正确行为的肯定，并由“就是”清楚承接条件句的结论。
theological_decisions:
- issue: “君王的律法”的含义
  choice: 保留为“君王的律法”，可指属于君王、出于君王或带有王权性质的律法
  alternative: “至高的律法”或“国度的律法”
  rationale: βασιλικός 可以涉及君王来源、王权性质或卓越地位；正文不强行判定其中一种解释，脚注提示真实的词义空间。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。引文使用“要爱邻舍如同自己”，既有经文语体，又能被普通读者直接理解；条件句按汉语习惯重排，但保留原文的转折、条件和结论关系。
