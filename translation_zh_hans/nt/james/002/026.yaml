id: JAS.2.26
reference: James 2:26
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὥσπερ ⸀γὰρ τὸ σῶμα χωρὶς πνεύματος νεκρόν ἐστιν, οὕτως καὶ ἡ πίστις ⸀χωρὶς ἔργων νεκρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/026.yaml
  text: For just as the body without the spirit is dead[b][a], so also faith without works is dead.
translation:
  language: zh_hans
  text: 因为，正如身体没有灵[a]是死的，照样，信心[b]没有行为也是死的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“气息”。希腊词可指“灵”，也可指“气息”。
    reason: lexical_alternative
  - marker: b
    text: 或译“信实”；这个希腊词也可表示“信靠”或“信实”，正文按通常译法作“信心”。
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ
  choice: 正如（由“身体……；照样……”的对应结构表达）
  rationale: 引出比喻的前半部分；汉语以“……；照样……”构成清楚自然的对应关系。
- source_word: γὰρ
  choice: 因为
  rationale: 保留本节对上文论证所作的解释性连接。
- source_word: τὸ σῶμα
  choice: 身体
  rationale: 直接指人的肉身，采用现代汉语的通常对应词。
- source_word: χωρὶς πνεύματος
  choice: 没有灵
  rationale: χωρίς表示“没有、离开”；πνεῦμα在此可指使身体有生命的“灵”，也可能指“气息”，后者收入脚注以保留词义歧义。
- source_word: νεκρόν ἐστιν
  choice: 是死的
  rationale: 直接保留谓语形容词的力度，并与后半句重复对应。
- source_word: οὕτως καὶ
  choice: 照样……也
  rationale: 清楚标明比喻后半部分与前半部分的对应，并保留καί的递进对应意味。
- source_word: ἡ πίστις
  choice: 信心
  rationale: 在本段论证中采用πίστις通常且自然的中文译法；“信实”这一可能词义以脚注保留。
- source_word: χωρὶς ἔργων
  choice: 没有行为
  rationale: “行为”既能表达ἔργα的具体行动含义，也能维持本章围绕信心与行为的核心用语。
- source_word: νεκρά ἐστιν
  choice: 是死的
  rationale: 与前半句相同措辞，保留原文严整的类比和重复产生的修辞力度。
theological_decisions:
- issue: 比喻中πνεύματος的含义
  choice: 灵
  alternative: 气息
  rationale: “灵”保留该希腊词常见的属灵和生命动力语义，不把比喻限定为呼吸现象；“气息”在语境中同样可通，因此列入脚注。
- issue: 雅各书2:26中πίστις的译法
  choice: 信心
  alternative: 信实（亦可理解为信靠）
  rationale: “信心”是此处最自然并与本章上下文连贯的译法；由于πίστις也可表示“信实”，脚注保留这一可能性，不借翻译消解神学张力。
- issue: 信心与行为的关系
  choice: 按原文直译为“信心没有行为也是死的”
  alternative: 不增译为某一特定救恩论解释
  rationale: 原句以身体与灵的关系作类比，但没有在本节进一步界定行为如何关联信心；译文保留其强烈判断而不添加宗派性阐释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以分号呈现原文前后两部分的紧密类比，并用“照样……也”保留平行结构；不作教派性扩写。
