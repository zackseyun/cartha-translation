  rationale: 修订以“指证”更完整反映 ἐλέγχω 的揭露和证实过错之意，并以“违背律法的人”更贴近 παραβάται，避免“犯法的人”可能带出的狭义刑事联想。将“在犯罪”改为“犯了罪”是汉语中对条件句结果更自然的表达，不改变希腊语现在时在此处所表达的概括性、持续性行为。
