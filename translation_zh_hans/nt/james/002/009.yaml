base_translation:
  language: en
  yaml_path: translation/nt/james/002/009.yaml
  text: But if you show partiality[d][c][b][a], you commit sin and are convicted by the law as transgressors.
translation:
  language: zh_hans
  text: 但如果你们偏待人[a]，就是犯了罪，并被律法指证为违背律法的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“徇私偏袒”。希腊语指按照人的外表、身份或地位来判断或对待人。
    reason: lexical_alternative
  - marker: b
    text: “指证”也可译作“判定”或“揭露”，指律法揭露过错并显明有罪；“违背律法的人”也可译作“犯法的人”或“违犯律法的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: 但如果
  rationale: 保留εἰ的条件意味和δέ与上文形成的轻微转折。
- source_word: προσωπολημπτεῖτε
  choice: 偏待人
  rationale: 表达按照人的外在身份或地位区别对待之意；现代汉语自然，也保留经文语体。
- source_word: ἁμαρτίαν ἐργάζεσθε
  choice: 就是在犯罪
  rationale: 该搭配意为行出或犯下罪；译文以持续性表述呈现希腊语现在时，并使条件句结果自然连贯。
- source_word: ἐλεγχόμενοι
  choice: 被……判定
  rationale: 兼顾被动语态以及律法揭露过错、证实有罪的司法性语境。
- source_word: ὑπὸ τοῦ νόμου
  choice: 被律法
  rationale: 不擅自限定为摩西律法或加入“上帝的”，保留原文在本段论证中的范围。
- source_word: ὡς παραβάται
  choice: 为犯法的人
  rationale: 指出越过并违反规范的人；与“律法”搭配清楚，同时避免过度古雅。
theological_decisions:
- issue: 雅各伦理论述中νόμος的性质
  choice: 译作“律法”，不进一步限定
  alternative: 摩西律法；上帝的律法；法律
  rationale: 原文把律法呈现为揭露偏待人为罪的标准，但本节本身没有要求采用更狭窄的圣约或宗派性解释。
- issue: ἐλεγχόμενοι与主句的关系
  choice: 用“并被律法判定”呈现与主句并列的自然汉语效果
  alternative: 译作附带情形：“在被律法指证为犯法之人的情况下”
  rationale: 希腊语使用被动分词，既可强调随之发生的指证，也可在汉语中自然展开为并列谓语；此译法不改变律法为施事者的关系。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“偏待人”简洁承接上文语境；“律法”保留圣经论述中的法律与伦理色彩。所有脚注标记均置于正文对应位置。
