  text: ⸀ὁρᾶτε ὅτι ἐξ ἔργων δικαιοῦται ἄνθρωπος καὶ οὐκ ἐκ πίστεως μόνον.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/024.yaml
  text: You see that a man is justified by works and not by faith alone[a][b][c].
translation:
  language: zh_hans
  text: 你们看，人是因行为称义，不是单凭信心。[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “称义”或可译作“被显明为义”或“被证明为义”。这里保留雅各的措辞，不预先判定它与保罗所说“称义”的关系。
    reason: alternative_reading
  - marker: b
    text: 原文作“人”，在这里是泛指，指一般的人，并非只指男性。
    reason: cultural_note
  - marker: c
    text: “信心”也可译作“信实”或“信靠”；本译本通常将希腊语πίστις译为“信心”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁρᾶτε
  choice: 你们看
  rationale: 这是第二人称复数、现在时直陈语气，在此根据上文的例证直接诉诸读者的认识。“你们看”自然地保留了陈述语气，也没有改成较强的命令。
- source_word: ἐξ ἔργων
  choice: 因行为
  rationale: ἐξ加属格在这里表达来源或根据。汉语“因行为”既简洁自然，也与下文“因信心”形成清楚对照。
- source_word: δικαιοῦται
  choice: 称义
  rationale: δικαιόω可表示宣告为义、使之显为义或证明为正。“称义”保留了该词的核心神学用语和与其他经文的词汇联系，同时不在正文中预先解决其具体语义争议。
- source_word: ἄνθρωπος
  choice: 人
  rationale: 此处阳性单数名词作泛指，指一般的人。现代汉语“人”准确、自然地表达这种代表性和普遍性，并不限定为男性。
- source_word: πίστεως
  choice: 信心
  rationale: πίστις在此与行为相对，默认译为“信心”；“信实”或“信靠”虽在词义范围内，但不是本句首选。
- source_word: μόνον
  choice: 单
  rationale: “单因信心”自然表达μόνον所强调的排他性，并紧密修饰“因信心”这一短语。
theological_decisions:
- issue: δικαιοῦται在称义论语境中的含义
  choice: 正文保留“称义”，不消解雅各原有的措辞和神学张力。
  alternative: 被显明为义；被证明为义
  rationale: 历来对雅各在此使用δικαιόω是否偏重显明或证明为义，以及它与保罗相关用法的关系，存在解释争论。正文采用词义核心且具有传统连续性的“称义”，脚注列出语境上可能的译法，而不替读者作出神学调和。
- issue: ἄνθρωπος的泛指范围
  choice: 译作“人”，指一般的人。
  alternative: 一个人；世人
  rationale: 原文虽为语法上的阳性单数，但在此具有代表性和泛指功能。汉语“人”既忠实于其单数泛指意义，也不会误导读者以为只论男性。
- issue: πίστις的译法
  choice: 正文译作“信心”。
  alternative: 信实；信靠
  rationale: “信心”最直接保留本段关于信与行为的论述及其术语连续性；其他词义可能性列入脚注，但不在正文中取代默认译法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“因行为称义”与“单因信心”形成紧凑对照，并保留原文的神学张力；脚注标记全部置于正文句末。
