source:
  edition: SBLGNT
  text: ὁμοίως δὲ καὶ Ῥαὰβ ἡ πόρνη οὐκ ἐξ ἔργων ἐδικαιώθη, ὑποδεξαμένη τοὺς ἀγγέλους καὶ ἑτέρᾳ ὁδῷ ἐκβαλοῦσα;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/025.yaml
  text: And likewise[b][a], was not Rahab the prostitute also justified by works when she welcomed the messengers and sent them out by another way?
translation:
  language: zh_hans
  text: 照样，妓女喇合接待了使者[b]，又把他们从另一条路送走，不也是因行为称义[a]的吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “称义”也可理解为“被显明为义”或“被宣告为义”。原文使用“称义”一词；正文不在这里判定其具体神学含义。
    reason: lexical_alternative
  - marker: b
    text: 原文为“使者”。这里指喇合所接待的那些人（见《约书亚记》第2章），不是天使。
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως δὲ καὶ
  choice: 照样，……也
  rationale: 承接亚伯拉罕的例子，并引出喇合作为另一个同类例证；中文以“照样……也”自然保留比较和附加的语气。
- source_word: Ῥαὰβ
  choice: 喇合
  rationale: 采用现代中文圣经中广为通行的人名译法。
- source_word: ἡ πόρνη
  choice: 妓女
  rationale: 直接表达 πόρνη 的通常含义，语言现代、清楚，也保留原文对其身份的明确描述。
- source_word: οὐκ ἐξ ἔργων ἐδικαιώθη
  choice: 不也是因行为被称为义吗
  rationale: “因行为”表达 ἐξ ἔργων 在此所指的根据或途径；“被称为义”保留 δικαιόω 的被动形式及称义术语，同时不在正文中把它限定为“显明为义”或某一特定神学机制。
- source_word: ὑποδεξαμένη
  choice: 接待了
  rationale: 表达带有接纳、款待意味的行动，符合喇合叙事的具体情境。
- source_word: τοὺς ἀγγέλους
  choice: 使者
  rationale: ἄγγελος 可指天使或人间使者；此处上下文明指喇合所接待的人，因此译为不误导读者的“使者”，但不把原词具体化为“探子”。
- source_word: καὶ ἑτέρᾳ ὁδῷ ἐκβαλοῦσα
  choice: 又让他们从另一条路离开
  rationale: ἐκβάλλω 在这里指送出、使之离开，并非强行赶出；此译符合中文习惯，也保留 ἑτέρᾳ ὁδῷ 的路线对比。
theological_decisions:
- issue: 雅各书2:25中 δικαιόω 与行为的关系
  choice: 正文译为“被称为义”，不进一步界定其神学机制
  alternative: 被显明为义；被宣告为义
  rationale: 原文把 δικαιόω 与“因行为”直接相连，翻译应保留这一张力，而不替读者判定此处专指法庭式宣告还是后来显明。脚注列出主要语义可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“妓女”直译其身份；反问句保留希腊文 οὐκ 所预期的肯定回答。脚注标记均置于正文相关句末。
