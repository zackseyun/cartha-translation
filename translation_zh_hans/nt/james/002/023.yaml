id: JAS.2.23
reference: James 2:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ἐπληρώθη ἡ γραφὴ ἡ λέγουσα· Ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην, καὶ φίλος θεοῦ ἐκλήθη.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/023.yaml
  text: And the Scripture was fulfilled that says[a], “Abraham believed God, and it was counted to him as righteousness,” and he was called a friend of God.
translation:
  language: zh_hans
  text: 这就应验了经上所说的话：“亚伯拉罕信上帝，这就算为他的义[a]。”他又被称为“上帝的朋友”。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “算为”也可译作“归算为”；这里的希腊语动词有“计算、记在账上”的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπληρώθη
  choice: 应验了
  rationale: 这是新约引用经文时常见的表达，既准确传达“得到成全、实现”，也符合现代汉语的圣经语体；不进一步解释信心与行为如何共同构成这里的“应验”。
- source_word: ἡ γραφὴ ἡ λέγουσα
  choice: 经上所说的话
  rationale: γραφή在此指具有权威的圣经经文；合并表达为“经上所说的话”，比逐字译作“那说话的经文”更自然，同时保留引文公式的功能。
- source_word: Ἐπίστευσεν ... τῷ θεῷ
  choice: 亚伯拉罕信上帝
  rationale: πιστεύω接与格在这里侧重相信上帝、接受上帝所说的话。“信上帝”简洁而贴近原文，也不擅自扩展为特定的信仰体系。
- source_word: ἐλογίσθη αὐτῷ
  choice: 这就算为他的
  rationale: λογίζομαι的被动形式带有计算、归算的意味。“算为他的”保留这一语义，又是普通读者能够理解的自然表达；其他可能译法收入脚注。
- source_word: εἰς δικαιοσύνην
  choice: 义
  rationale: δικαιοσύνη在创世记引文及本段论证中宜译为“义”，保留其被上帝认定为正直或合宜的神学与关系性内涵，不缩窄为社会层面的“正义”。
- source_word: φίλος θεοῦ
  choice: 上帝的朋友
  rationale: 直译所有格关系，表达自然清楚，并避免额外界定这一称号来自何处或具体包含什么身份。
- source_word: ἐκλήθη
  choice: 被称为
  rationale: 保留καλέω被动式所容许的宽度，既可指被赋予称号，也可指被公认为具有这一身份。
theological_decisions:
- issue: 亚伯拉罕的信心、行为与经文“应验”之间的关系
  choice: 保留“经文应验了”的直接陈述，不在译文中说明称义的机制
  alternative: 将“应验”解释为行为证明先前的信心，或解释为行为成为称义的独立根据
  rationale: 雅各把创世记15:6与亚伯拉罕后来的顺服行动联系起来，但本节没有系统化解释二者关系。译文应保留这一张力，不代替作者解决后来的宗派争论。
- issue: δικαιοσύνη的译法
  choice: 义
  alternative: 正义；正直；被算为义人
  rationale: “义”最能保持原文名词的简洁和神学开放性；译成“被算为义人”会把抽象名词改成人的身份判断，略微增加原文没有明说的解释。
- issue: φίλος θεοῦ所表达的关系
  choice: 上帝的朋友
  alternative: 蒙上帝喜爱的人；与上帝亲近的人
  rationale: 采用关系明确而不过度解释的直译，避免把“朋友”缩减为情感喜爱或一般亲近。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“这就应验了经上所说的话”是自然的引经表达；保留“信上帝”“义”和“上帝的朋友”等简洁措辞。引文中的δέ未单独译出，因为在此主要承担叙述衔接作用，汉语省略后更自然，语义无实质损失。
