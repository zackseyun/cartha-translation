id: JAS.2.13
reference: James 2:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἡ γὰρ κρίσις ἀνέλεος τῷ μὴ ποιήσαντι ἔλεος· κατακαυχᾶται ⸀ἔλεος κρίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/013.yaml
  text: For judgment is without mercy to the one who has shown no mercy[a]; mercy triumphs over judgment.
translation:
  language: zh_hans
  text: 因为那不施怜悯的人，必受无怜悯的审判；怜悯胜过审判。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“怜悯向审判夸胜。”希腊语动词含有“向……夸胜、胜而欢跃”的意思；正文按其语境译为“胜过”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσις / κρίσεως
  choice: 审判
  rationale: 指带有司法和神圣评断意味的审判；前后采用同一译词，以保留经文内部的对应与对比。
- source_word: ἀνέλεος
  choice: 无怜悯的
  rationale: 作表语描述审判的性质，并与本节重复出现的ἔλεος形成清楚的词语呼应。
- source_word: τῷ μὴ ποιήσαντι ἔλεος
  choice: 那不施怜悯的人
  rationale: ποιέω与ἔλεος连用是“施行、表现怜悯”的惯用表达；此译自然简洁，也保留行为与审判之间的对应。
- source_word: κατακαυχᾶται
  choice: 胜过
  rationale: 该中间态动词本义可表达“向……夸胜、胜而欢跃”；在本语境中译为“胜过”能自然传达其修辞力量，同时由脚注保留较直译的意象。
- source_word: ἔλεος
  choice: 怜悯
  rationale: 这是现代汉语中自然且庄重的对应词，并能在全节中保持词汇重复。
theological_decisions:
- issue: 末句“κατακαυχᾶται ἔλεος κρίσεως”的所指与神学关系
  choice: 译作概括性的“怜悯胜过审判”
  alternative: “怜悯向审判夸胜”；或明确解释为蒙审判者所施的怜悯在审判中使其得胜
  rationale: 原句简短而带格言性质，没有明说这里主要指上帝的怜悯、怜悯在审判中的作用，还是信徒所施怜悯的见证。正文不补出主语归属或功德机制，以保留警告与盼望之间的神学张力。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。“必受”将希腊语省略的判断关系自然表达出来，但不把κρίσις窄化为“定罪”。脚注标记置于其所说明的末句之后。
