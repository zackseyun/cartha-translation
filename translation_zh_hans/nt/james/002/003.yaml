source:
  edition: SBLGNT
  text: ⸂ἐπιβλέψητε δὲ⸃ ἐπὶ τὸν φοροῦντα τὴν ἐσθῆτα τὴν λαμπρὰν καὶ ⸀εἴπητε· Σὺ κάθου ὧδε καλῶς, καὶ τῷ πτωχῷ εἴπητε· Σὺ στῆθι ⸂ἢ κάθου ἐκεῖ⸃ ὑπὸ τὸ ὑποπόδιόν μου,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/003.yaml
  text: and if you pay attention to the one wearing the bright clothing and say[a], “You sit here in a good place,” and say to the poor man, “You stand there[b], or sit under my footstool,”
translation:
  language: zh_hans
  text: 你们若特别留意那穿着华美的衣服的人[a]，对他说：“请坐在这里的好位子上。”却对那个穷人说：“你站在那里，或坐在我的脚凳下面[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “华美的衣服”也可译作“鲜亮的衣服”或“华丽的衣服”。
    reason: lexical_alternative
  - marker: b
    text: 有些抄本省略“或坐在那里”这句话的一部分，因而读作：“你站在那里，或坐在我的脚凳下面。”所采用的希腊文正文包括“或坐在那里”。
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιβλέψητε
  choice: 特别留意
  rationale: 该动词在此不只是“看见”，而是注意、看重某人。“特别留意”自然地表现优待意味，同时没有直接把上下文所谴责的行为解释成“偏心”。
- source_word: φοροῦντα
  choice: 穿着
  rationale: 该分词用于衣物时通常指穿戴；“穿着”是现代汉语中直接自然的表达。
- source_word: ἐσθῆτα τὴν λαμπράν
  choice: 华美衣服
  rationale: ἐσθής指衣服，λαμπρός可指明亮、华美或显贵。“华美衣服”能自然表现引人注目、体面的衣着，同时在脚注保留“鲜亮”的词义可能。
- source_word: Σὺ κάθου ὧδε καλῶς
  choice: 请坐在这里的好位子上
  rationale: κάθου是命令式，καλῶς在此表示有利、体面的座位安排。“请坐在这里的好位子上”清楚呈现对比中的礼遇；加入“请”传达话语中的优待口吻，而非改变命令性质。
- source_word: τῷ πτωχῷ
  choice: 那个穷人
  rationale: 带冠词的阳性单数形容词在此实体化，指场景中的一个贫穷男子；译作“那个穷人”保留单数指称和与前一人的对照。
- source_word: στῆθι
  choice: 你站着
  rationale: 这是ἵστημι的命令式，在这里是叫对方保持站立；“站着”比孤立的“站”更符合现代汉语命令表达。
- source_word: ἢ κάθου ἐκεῖ
  choice: 或坐到那边……去
  rationale: 保留另一项命令以及ἐκεῖ所表达的疏远感；“那边”与给富足者的“这里”形成鲜明对照。
- source_word: ὑπὸ τὸ ὑποπόδιόν μου
  choice: 我脚凳下面
  rationale: ὑπό接宾格在此自然表示“在……下面”。即使画面刻意显得屈辱且不寻常，也不改译成较缓和的“旁边”。
theological_decisions:
- issue: 社会偏待的表达
  choice: 具体叙述对衣着华美者的留意以及对穷人的不同命令
  alternative: 在正文直接译为“偏爱”或“特别优待”
  rationale: 上下文明确谴责偏心，但本节主要用具体言行展现这种差别待遇。保留场景本身，可让神学含义从上下文显明，而不把解释性术语提前放入本节。
- issue: πτωχῷ的性别与单数指称
  choice: 那个穷人
  alternative: 那个贫穷的人
  rationale: 原文为阳性单数并指场景中的特定来访者。“那个穷人”简洁自然，也不把个体场景泛化。
- issue: 贫穷者座位命令的屈辱意味
  choice: 保留“我脚凳下面”
  alternative: 弱化为“我脚凳旁边”或“我脚边”
  rationale: 原文ὑπό的空间表达十分尖锐，正借不体面的安排显出差别待遇；译文不应为求顺口而消除这种张力。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。“请坐”与较生硬的“你站着”形成礼遇和轻慢的语气对照；“这里／那边”以及“好位子／脚凳下面”保留原文的空间与社会地位反差。标点按现代中文直接引语规范处理。
