    rationale: 脚注称“有些抄本采用不同的词序”，但英语审校轨迹说明异文是有些抄本省略“或坐在那里”，而不是词序差异。脚注须明确所涉短语，并准确说明所采用正文包含该短语。
  - severity: low
    issue: 贫穷者所受命令中的地点表达略显黏连。
    rationale: “或坐到那边我脚凳下面去”会使“那边”和“脚凳下面”形成不够清晰的复合地点。译作“你站在那里，或坐在我的脚凳下面”既自然，又维持原文及英语审校文本的两种不体面安排。
  - severity: low
    issue: “华美衣服”可作更自然的定语结构。
    rationale: “华美的衣服”在现代标准汉语中更自然，不改变λαμπράν所表达的华美、显眼之意。
