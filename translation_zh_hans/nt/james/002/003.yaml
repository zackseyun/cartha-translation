review_pass:
  verdict: revise
  source_fidelity: 正文总体准确保留了对衣着华美者的优待和对穷人的轻慢，也保留了“脚凳下面”的尖锐空间意象。不过，脚注 b 将异文误述为“不同的词序”；所给英语审校资料表明，异文实际涉及是否省略“或坐在那里”（ἢ κάθου ἐκεῖ）这一短语。正文中“那边”与“我脚凳下面”的组合也略显黏连，宜按该短语所表达的地点对照更清楚地处理。
  naturalness: “特别留意”“好位子”和“脚凳下面”均属自然、现代的书面汉语。“你站着，或坐到那边我脚凳下面去”语法上可解，但地点成分堆叠，读者容易误解为“那边”专门修饰脚凳下面。改为“你站在那里，或坐在我的脚凳下面”更顺畅，也保留轻慢的对照。
  terminology: “华美衣服”可以理解，但“华美的衣服”更合乎现代汉语定语结构。“穷人”准确保留原文阳性单数的场景指称；不宜改成带神学解释色彩的“受歧视者”等表达。
  issues:
