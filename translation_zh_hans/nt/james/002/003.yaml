revisions:
- from: 你们若特别留意那穿着华美衣服的人[a]，对他说：“请坐在这里的好位子上。”却对那个穷人说：“你站着，或坐到那边我脚凳下面去[b]。”
  to: 你们若特别留意那穿着华美的衣服的人[a]，对他说：“请坐在这里的好位子上。”却对那个穷人说：“你站在那里，或坐在我的脚凳下面[b]。”
  rationale: 修订仅澄清地点表达、使名词短语更合乎现代汉语，并更正脚注 b 对异文性质的说明。正文继续具体呈现两人所受不同对待，不将上下文的“偏待”主题解释性地加入本节。
