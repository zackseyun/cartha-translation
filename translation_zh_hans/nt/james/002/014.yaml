id: JAS.2.14
reference: James 2:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀Τί ὄφελος, ἀδελφοί μου, ἐὰν πίστιν λέγῃ τις ἔχειν ἔργα δὲ μὴ ἔχῃ; μὴ δύναται ἡ πίστις σῶσαι αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/014.yaml
  text: What good is it[a], my brothers[c][b], if someone says he has faith but does not have works? Can that faith save him?
translation:
  language: zh_hans
  text: 我的弟兄们[a]，若有人说自己有信心[b]，却没有行为，这有什么益处呢？这样的信心[c]能救他吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”是希腊文的阳性复数称呼，在这里代表性地称呼整个信徒群体，包括姐妹。
    reason: lexical_alternative
  - marker: b
    text: “信心”也可译作“信靠”；在有些语境中，原词也可表示“忠信”。这里指一个人所说自己拥有的信心。
    reason: lexical_alternative
  - marker: c
    text: 直译为“这信心”或“那信心”，回指上文所说没有行为的信心；也可译作“这种信心”。
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ὄφελος
  choice: 这有什么益处呢
  rationale: 用现代汉语自然表达反问，同时保留“益处、实际效用”的含义。
- source_word: ἀδελφοί μου
  choice: 我的弟兄们
  rationale: 保留希腊文阳性复数的称呼形式；此处是对信徒群体的代表性称呼，其涵盖范围在脚注说明。
- source_word: πίστιν
  choice: 信心
  rationale: 在“说自己有……”的结构中，指所自称拥有的信仰或信靠；“信心”既自然，也能维持本段“信心与行为”的关键词联系。
- source_word: λέγῃ τις ἔχειν
  choice: 若有人说自己有
  rationale: 贴近原文“有人说有”的措辞，不以较具判断色彩的“声称”预先否定其说法。
- source_word: ἔργα
  choice: 行为
  rationale: 保留雅各书本段中与“信心”相对并反复出现的关键词；“行为”比“善行”更少增添原文未明说的限定。
- source_word: μὴ ἔχῃ
  choice: 却没有
  rationale: 直接表达否定拥有，并以“却”自然呈现信心宣称与缺少行为之间的对照。
- source_word: μὴ δύναται
  choice: 能……吗
  rationale: μή引导预期否定答案的反问；汉语用“能……吗”即可让语境传达这一倾向，无须把答案明说出来。
- source_word: ἡ πίστις
  choice: 这样的信心
  rationale: 定冠词具有回指作用，指前面所说那种只有口头宣称却没有行为的信心；这样译可避免泛指一切信心。
- source_word: σῶσαι αὐτόν
  choice: 救他
  rationale: “救”保留σῴζω在此处的救赎分量，也维持原文第三人称单数阳性代词。
theological_decisions:
- issue: 信心与行为的关系
  choice: 将ἡ πίστις译为“这样的信心”，回指刚才所描述的、有人自称拥有却没有行为的信心。
  alternative: 译作“信心”或“那信心”。
  rationale: 原文定冠词自然回指前述信心；这一译法既不把问题扩大为一切信心能否拯救，也不在本节中预先解决雅各随后展开的神学论证。
- issue: 反问所预期的答案
  choice: 保留“能救他吗”的反问形式。
  alternative: 译作“当然不能救他”或“岂能救他呢”。
  rationale: μή表明预期否定答案，但原文仍以问题提出；保留问句可维持其修辞力度和神学张力。
- issue: 群体称呼与单数代词的性别形式
  choice: 正文采用“我的弟兄们”和“救他”。
  alternative: 采用“弟兄姐妹们”和“救这样的人”。
  rationale: 正文保留原文阳性代表形式，同时以脚注说明称呼实际面向整个信徒群体；不将原文单数人物改成复数或抽象表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这有什么益处呢”与“能救他吗”保留连续反问的力度；“行为”维持雅各书上下文的术语一致性。所有脚注标记均置于正文相关词语之后。
