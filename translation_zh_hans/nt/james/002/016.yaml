id: JAS.2.16
reference: James 2:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἴπῃ δέ τις αὐτοῖς ἐξ ὑμῶν· Ὑπάγετε ἐν εἰρήνῃ, θερμαίνεσθε καὶ χορτάζεσθε, μὴ δῶτε δὲ αὐτοῖς τὰ ἐπιτήδεια τοῦ σώματος, ⸀τί ὄφελος;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/016.yaml
  text: and one of you says to them[a], “Go in peace; keep warm and be filled,” but you do not give them the necessities of the body, what benefit is that?
translation:
  language: zh_hans
  text: 你们中间若有人对他们说：“平平安安地去吧，愿你们暖和，愿你们吃饱”[a]，却不给他们身体所需的东西，这有什么益处呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们要得到温暖，得以饱足。”希腊语动词形式可按被动或中间意义理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπῃ δέ τις ... ἐξ ὑμῶν
  choice: 你们中间若有人……说
  rationale: 以自然的现代汉语表达假设情形，并保留“你们中间”的部分关系；δέ在上下文中的推进和轻微转折由整句结构体现，不另作生硬对应。
- source_word: Ὑπάγετε ἐν εἰρήνῃ
  choice: 平平安安地去吧
  rationale: 这是惯用的送别或祝福语；采用汉语中自然、庄重的表达，也保留上下文中的反讽力量。
- source_word: θερμαίνεσθε
  choice: 愿你们暖和
  rationale: 希腊语形式可按被动或中间意义理解。用愿望式汉语传达只说祝愿而不实际帮助的语境，同时避免断定是“自己取暖”还是“被人温暖”。
- source_word: χορτάζεσθε
  choice: 愿你们吃饱
  rationale: 该词表示吃得饱足；“吃饱”在现代汉语中具体自然，并与缺乏日用食物的上下文吻合。
- source_word: μὴ δῶτε δὲ αὐτοῖς
  choice: 却不给他们
  rationale: “却”清楚呈现口头祝愿与拒绝实际供应之间的强烈反差。
- source_word: τὰ ἐπιτήδεια τοῦ σώματος
  choice: 身体所需的东西
  rationale: 既保留身体层面的具体需要，也比“身体的必需品”更符合现代汉语习惯。
- source_word: τί ὄφελος;
  choice: 这有什么益处呢？
  rationale: 贴近原文的“益处、效用”，并以自然反问表达实际毫无帮助的意思。
theological_decisions:
- issue: θερμαίνεσθε和χορτάζεσθε的语态与施事关系
  choice: 正文译作“愿你们暖和，愿你们吃饱”，不明确指定他们是自己取暖吃饱，还是由别人使其暖和吃饱。
  alternative: “你们要暖和，要吃饱”；或“愿你们得到温暖，得以饱足”。
  rationale: 雅各的论点在于没有实际援助的善意话语毫无益处，而不在于确定这两个动词的施事者。正文保留语态张力，脚注交代较直译的可能。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。引语使用自然的祝愿口吻，以凸显空洞祝福与实际不施援手之间的反差；正文脚注标记[a]已完整对应。
