  text: Ἀδελφοί μου, μὴ ἐν προσωπολημψίαις ἔχετε τὴν πίστιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τῆς δόξης;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/001.yaml
  text: My brothers[d][c][b][a], do not hold the faith of our Lord Jesus the Messiah with partiality.
translation:
  language: zh_hans
  text: 我的弟兄们[a]，你们信奉我们荣耀的主耶稣基督[b][c]，不可偏待人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可按这里所指的整个信徒群体译作“我的弟兄姊妹们”；希腊文直译为“我的弟兄们”。
    reason: lexical_alternative
  - marker: b
    text: 也可直译为“持守我们主耶稣基督、荣耀之主的信仰”。希腊文的属格关系可有不止一种理解。
    reason: alternative_reading
  - marker: c
    text: “我们荣耀的主耶稣基督”也可译作“我们的主耶稣基督——荣耀之主”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί μου
  choice: 我的弟兄们
  rationale: 保留阳性复数称呼的字面形式；雅各实际面向整个信徒群体，因此在脚注说明其语境中的广泛所指。
- source_word: μὴ ... ἔχετε
  choice: 就不可……
  rationale: μή与现在时ἔχετε在这里表达禁止；结合中文句法，用“既……就不可……”自然呈现信仰身份与行为禁令之间的关系。
- source_word: ἐν προσωπολημψίαις
  choice: 偏待人
  rationale: προσωπολημψία指根据身份、外在条件等区别待人。“偏待人”简洁、自然，并保留其伦理力度；希腊文复数在中文中按习惯统摄表达。
- source_word: τὴν πίστιν
  choice: 信奉
  rationale: 中文若直译为“持有信仰”较生硬；“信奉”能自然表达持守并承认这信仰，但不把重点弱化为一时的心理相信。
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: 我们……的主耶稣基督
  rationale: κύριος译为“主”。Χριστός在中文圣经与现代基督教语境中以“基督”作为具有称号内涵的标准译法；正文按最自然的对象属格理解为信奉主耶稣基督，同时用脚注保留属格关系的其他可能理解。
- source_word: τῆς δόξης
  choice: 荣耀的主
  rationale: 将δόξης理解为修饰κύριος的性质属格，以自然中文译作“荣耀的主”；“荣耀之主”的同位称号式理解保留在脚注中。
theological_decisions:
- issue: πίστις与τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ之间的属格关系
  choice: 正文译作“信奉……主耶稣基督”，按指向对象的属格理解
  alternative: “我们主耶稣基督的信仰”，可理解为属于他、由他界定或与他相关的信仰
  rationale: 上下文最自然地谈信徒对耶稣基督的信仰，但希腊文属格本身不只允许一种语义关系，故脚注保留真实的语法张力。
- issue: τῆς δόξης的句法归属
  choice: 荣耀的主
  alternative: 我们的主耶稣基督——荣耀之主
  rationale: 该属格很可能与“主”构成性质或称号关系；正文采用自然的定语结构，脚注保存更具同位称号色彩的译法。
- issue: Ἀδελφοί的性别与群体范围
  choice: 弟兄们
  alternative: 弟兄姊妹们
  rationale: 正文保留希腊文阳性复数称呼，脚注说明在混合信徒群体中可具有包含女性的语用范围，避免把语法形式与实际受众混为一谈。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“既……就不可……”使希腊文禁止句在中文中连贯有力；“偏待人”比“按外貌待人”更直接涵盖本段所谴责的身份与财富偏见。所有真实的词法和句法歧义均以脚注保留。
