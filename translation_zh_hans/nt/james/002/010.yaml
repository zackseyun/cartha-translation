  text: ὅστις γὰρ ὅλον τὸν νόμον ⸂τηρήσῃ, πταίσῃ⸃ δὲ ἐν ἑνί, γέγονεν πάντων ἔνοχος.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/010.yaml
  text: For whoever keeps the whole law but stumbles in one point has become guilty of all of it[a][b].
translation:
  language: zh_hans
  text: 因为，凡遵守整部律法、却在一条诫命上跌倒的，就对整部律法负有罪责[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在一条诫命上跌倒”也可译作“在一件事上失败”或“违犯其中一条”。希腊文使用“跌倒”这个比喻来表达道德上的过失。
    reason: lexical_alternative
  - marker: b
    text: “对整部律法负有罪责”也可译作“须对整部律法负责”。意思是，违犯其中一条，就使人相对于整部律法承担罪责；这不一定是说他已经逐条犯了每一条诫命。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅστις
  choice: 凡……的
  rationale: 不定关系代词引出普遍原则；“凡……的”在现代汉语中自然，并保留其普遍适用的意味。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文并说明理由；“因为”清楚表达解释和论证关系。
- source_word: ὅλον τὸν νόμον
  choice: 全部律法
  rationale: 保留ὅλον所强调的整体性；“全部律法”自然清楚。
- source_word: τηρήσῃ
  choice: 遵守
  rationale: τηρέω在律法语境中指持守、遵行；“遵守”是现代汉语常用且准确的表达。
- source_word: πταίσῃ
  choice: 跌倒
  rationale: 保留πταίω由身体绊跌引申为道德失败的生动比喻，而上下文足以表明这里所说的是违犯律法。
- source_word: ἐν ἑνί
  choice: 在一条上
  rationale: 按律法的语境将未明说的单项理解为一条规定；既表达“在一个方面”，又不把它误解为只犯一次。
- source_word: γέγονεν
  choice: 就成了
  rationale: 保留完成时所表达的结果状态：一次违犯使人处于对整体律法负罪责的状态。
- source_word: πάντων
  choice: 对全部律法
  rationale: 其所指承接前面的整体律法；在汉语中明说“律法”可避免“对全部有罪”的生硬和歧义。
- source_word: ἔνοχος
  choice: 有罪的人
  rationale: ἔνοχος兼有有罪、负有责任之意；此译法保留司法和道德上的罪责意味，并与“对……”自然搭配。
theological_decisions:
- issue: 违犯一条与整部律法之间的罪责范围
  choice: 译为“对全部律法有罪”，表明违犯一条便使人对整部律法负有罪责。
  alternative: 理解为每一次违犯都等于逐条犯了所有诫命，或仅限于本章所谈的偏待人问题。
  rationale: πάντων ἔνοχος自然表示相对于整体而有罪或负有责任，并不必然断言各种罪的严重程度完全相同，也没有说此人实际逐条犯了每一项规定。译文保留经文的力度与张力，不引入后来的教义体系。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“跌倒”保留原文比喻；“一条”依据律法语境补足汉语所需的量词和所指。两个脚注分别说明词义选择及“对全部律法有罪”的责任范围。
