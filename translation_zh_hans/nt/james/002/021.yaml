  text: Ἀβραὰμ ὁ πατὴρ ἡμῶν οὐκ ἐξ ἔργων ἐδικαιώθη, ἀνενέγκας Ἰσαὰκ τὸν υἱὸν αὐτοῦ ἐπὶ τὸ θυσιαστήριον;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/021.yaml
  text: Was not Abraham our father justified by works when he offered up Isaac his son on the altar?[a]
translation:
  language: zh_hans
  text: 我们的父亲亚伯拉罕把自己的儿子以撒献在祭坛上，岂不是因行为称义的吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被显明为义”或“被证实为义”。希腊语这个动词按语境可指被宣告为义，也可指被显明或被证实为义。
    reason: alternative_reading
lexical_decisions:
- source_word: πατὴρ ἡμῶν
  choice: 我们的祖先
  rationale: 直译“我们的父亲”在现代汉语中容易被误解为直系父亲；“我们的祖先”自然表达亚伯拉罕作为共同先祖的身份，同时保留群体认同。
- source_word: ἐξ ἔργων
  choice: 因行为
  rationale: ἐξ加属格在此表示依据或缘由；“因行为”简洁自然，也保留本段有关行为与称义的核心措辞。
- source_word: ἐδικαιώθη
  choice: 得称为义
  rationale: 保留δικαιόω与“称义”议题的词汇联系及其神学张力，不在正文中限定为纯宣告或纯显明之意。
- source_word: ἀνενέγκας
  choice: 把……献在……上
  rationale: 该分词在此结合祭坛语境，表示亚伯拉罕献上以撒这一行动；汉语用前置事件短语自然地表达其情境或依据关系。
- source_word: θυσιαστήριον
  choice: 祭坛
  rationale: 祭祀语境中的标准、明确译法。
- source_word: οὐκ ... ἐδικαιώθη;
  choice: 不是……得称为义吗？
  rationale: 保留希腊文期待肯定回答的反问语气，并符合现代汉语表达。
theological_decisions:
- issue: 雅各书2:21中δικαιόω与行为的关系
  choice: 正文译作“得称为义”
  alternative: 显明为义；证实为义；被宣告为义
  rationale: “得称为义”保留本节与更广泛称义讨论的词汇联系，也不预先消解行为与称义之间的神学张力；其他可能语义列入脚注。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。将“我们的父亲”译为“我们的祖先”，避免现代读者按直系亲属关系误读；保留“因行为得称为义”这一紧凑而具有神学张力的表述。
