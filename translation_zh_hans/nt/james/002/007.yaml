base_translation:
  language: en
  yaml_path: translation/nt/james/002/007.yaml
  text: Do not they themselves blaspheme the good name that was called upon you?[a][b]
translation:
  language: zh_hans
  text: 不正是他们自己亵渎那被称在你们身上的尊贵之名吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那被称在你们之上的尊贵之名”。这措辞指信徒所带有、藉以被认定的名；可能呼应圣约或洗礼中的称名用语，但经文没有明确指定具体场景。
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ αὐτοὶ
  choice: 不正是他们自己……吗
  rationale: οὐκ引导预期肯定回答的反问，αὐτοὶ强调前文所说的那些人；此译法在现代汉语中自然地保留反问和强调。
- source_word: βλασφημοῦσιν
  choice: 亵渎
  rationale: 该词可指诽谤、辱骂或亵渎。这里的宾语是信徒所蒙受的尊贵之名，具有明显的宗教意味，因此“亵渎”比“诽谤”更能保留其强烈语气。
- source_word: τὸ καλὸν ὄνομα
  choice: 那尊贵的名
  rationale: καλός在此含尊贵、可敬、美善之意。“尊贵的名”既自然庄重，又不把所指对象过早限定为基督或上帝。
- source_word: τὸ ἐπικληθὲν ἐφ’ ὑμᾶς
  choice: 就是你们所蒙受的名
  rationale: 该结构直译为“被称在你们身上／之上的名”，表达某名加在一群人身上，使他们由此得到身份。“所蒙受的名”以自然汉语传达被动和归属之意，同时由脚注保存更贴近形式的译法。
theological_decisions:
- issue: “尊贵的名”所指为何
  choice: 在正文中保留宽泛表达，不明确补出“耶稣”或“基督”
  alternative: 直接译为“基督尊贵的名”或“主的尊名”
  rationale: 希腊文没有明说该名是谁的；雅各书2:1使人很可能联想到主耶稣基督，但也可广义理解为上帝的名或信徒所承受的群体身份。正文不补明所指，以保留原文的含蓄和神学张力。
- issue: ἐπικληθὲν ἐφ’ ὑμᾶς是否具有礼仪或圣约含义
  choice: 正文仅表达这名加在信徒身上、成为其身份标志
  alternative: 明确译成洗礼时“称在你们身上的名”或圣约归属用语
  rationale: 此措辞可能呼应圣约或洗礼中称名的语言，但经文本身没有明确指出具体场景，因此不在正文中将这种可能性定为唯一解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“不正是……吗”保留希腊文反问的力度；“蒙受的名”避免生硬直译，同时脚注交代原文措辞及其可能含义。
