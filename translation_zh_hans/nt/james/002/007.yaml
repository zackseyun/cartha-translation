  source_fidelity: 原译正确保留了反问、αὐτοὶ的强调、“尊贵的名”及不明说该名所指的处理。但“就是你们所蒙受的名”将定语结构处理为较强的解释性同位语，且“蒙受”没有充分体现ἐπικληθὲν（被称／被叫）的被动称名动作及ἐφ’ ὑμᾶς（在你们身上／之上）的空间性习语。
