id: JAS.2.19
reference: James 2:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: σὺ πιστεύεις ὅτι ⸂εἷς ἐστιν ὁ θεός⸃; καλῶς ποιεῖς· καὶ τὰ δαιμόνια πιστεύουσιν καὶ φρίσσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/019.yaml
  text: You believe that God is one[a]; you do well[b]. Even the demons believe—and shudder.
translation:
  language: zh_hans
  text: 你信上帝是独一的[a]吗？你做得好。连鬼魔也信，而且战栗[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上帝是独一的”或译“只有一位上帝”。古代抄本原无现代标点，首句也可理解为陈述句：“你信上帝是独一的。”
    reason: alternative_reading
  - marker: b
    text: “战栗”或译“发抖”。
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ
  choice: 你
  rationale: 保留第二人称单数的直接称呼；希腊文显式使用代词而带有一定强调，但中文无需加“你自己”，以免强调过度。
- source_word: πιστεύεις / πιστεύουσιν
  choice: 信
  rationale: 两处均译作“信”，保留雅各论证中关键的词语重复；这里由ὅτι引出所信的内容，因此“信”比“信靠”更贴切。
- source_word: εἷς ἐστιν ὁ θεός
  choice: 上帝是独一的
  rationale: 贴近希腊文的表述结构，也保留其可能呼应以色列独一神信仰告白的意味；不把这句话扩展为原文没有明说的内容。
- source_word: καλῶς ποιεῖς
  choice: 你做得好
  rationale: 自然而简洁地表达该惯用语，并保留这句表面肯定与下句尖锐对比之间的张力。
- source_word: καὶ τὰ δαιμόνια
  choice: 连鬼魔也
  rationale: 此处καί有递进意味；“连……也”自然传达鬼魔同样具有这种信念所造成的修辞冲击。
- source_word: τὰ δαιμόνια
  choice: 鬼魔
  rationale: 这是δαιμόνια直接且通行的中文对应；“邪灵”会增加解释色彩。
- source_word: φρίσσουσιν
  choice: 战栗
  rationale: 表达因惧怕而产生的强烈身体反应，力度与φρίσσω相称；脚注列出较口语的替代译法。
theological_decisions:
- issue: 独一神告白εἷς ἐστιν ὁ θεός的译法
  choice: 上帝是独一的
  alternative: 只有一位上帝
  rationale: 正文较贴近希腊文谓语式表达，并保留可能对犹太独一神信仰告白的呼应；脚注保留同样合乎语法的存在式译法。
- issue: “信”与鬼魔反应之间的张力
  choice: 连鬼魔也信，而且战栗
  alternative: 鬼魔也信，也发抖
  rationale: “连……也”传达καί的递进作用，同时重复“信”，不把这种认知上的相信直接等同于救恩性的信靠，从而保留雅各有意形成的神学张力。
- issue: 首句的语气
  choice: 按SBLGNT标点译为问句
  alternative: 你信上帝是独一的；你做得好。
  rationale: 所给SBLGNT文本以希腊文问号标示首句，因此正文采用反问式读法；古代抄本原无现代标点，陈述式断句仍属可能，故在脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你做得好”保留简短肯定的字面力度，不额外标明讽刺；“连鬼魔也”则让上下文自行显出反讽和责问。所有脚注标记均置于正文相应位置。
