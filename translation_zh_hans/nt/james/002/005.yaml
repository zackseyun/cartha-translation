language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀκούσατε, ἀδελφοί μου ἀγαπητοί. οὐχ ὁ θεὸς ἐξελέξατο τοὺς πτωχοὺς ⸂τῷ κόσμῳ⸃ πλουσίους ἐν πίστει καὶ κληρονόμους τῆς βασιλείας ἧς ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/005.yaml
  text: 'Listen[c][b][a], my beloved brothers: has not God chosen those who are poor in the world to be rich in faith and heirs of the kingdom that he promised to those who love him?'
translation:
  language: zh_hans
  text: 我亲爱的弟兄们[a]，请听：上帝岂不是拣选了世上贫穷的人[b]，使他们在信心[c]上富足，并成为他应许给爱他之人的国的继承人吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”也可按其包容性的书信称呼译作“弟兄姊妹们”；希腊文直译为“弟兄们”，但可能指整个信徒群体。
    reason: alternative_reading
  - marker: b
    text: “世上贫穷的人”也可译作“按世人的标准贫穷的人”或“世人眼中的穷人”。
    reason: lexical_alternative
  - marker: c
    text: “信心”也可译作“信靠”；在这里译作“忠信”的可能性较小。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσατε
  choice: 请听
  rationale: 复数不定过去时命令式，用直接而自然的现代汉语唤起听者注意；“请”使语气在中文中庄重而不生硬。
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: 我亲爱的弟兄们
  rationale: 保留阳性复数“弟兄”和ἀγαπητοί的亲爱语气；此书信称呼很可能涵盖整个信徒群体，故在脚注注明包容性用法。
- source_word: οὐχ ... ἐξελέξατο
  choice: 岂不是拣选了
  rationale: οὐχ引出预期肯定答案的反问；“岂不是”准确传达修辞力度，“拣选”保留神主动选择的经文用语而不附加系统神学解释。
- source_word: τοὺς πτωχοὺς τῷ κόσμῳ
  choice: 世上贫穷的人
  rationale: 以简洁自然的中文保留τῷ κόσμῳ在范围或参照方面的含义；该短语也可能指“按世人的标准贫穷”，故以脚注保存歧义。
- source_word: πλουσίους ἐν πίστει
  choice: 在信心上富足
  rationale: ἐν πίστει表示富足所在的领域；“信心”是此处πίστις最自然的译法，同时在脚注保留“信靠”等词义可能。
- source_word: κληρονόμους τῆς βασιλείας
  choice: 承受……国
  rationale: 中文圣经语体中“承受”自然表达κληρονόμος的继承人含义，也避免生硬的名词结构“国的继承人”。
- source_word: ἧς ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν
  choice: 他应许给爱他之人的国
  rationale: 明确保留“国”为应许的对象，并用“爱他之人”表达现在分词所描述的群体特征。
theological_decisions:
- issue: 上帝“拣选”的教义含义
  choice: 直译为“拣选”，不进一步界定其系统神学范围。
  alternative: 加入预定、救恩次序等解释性措辞。
  rationale: 本节直接论述上帝对贫穷者的看重，以反衬偏待人的错误；译文应保留神主动拣选的表述，却不代替经文解决后来的教义争议。
- issue: ἀδελφοί的指称范围
  choice: 正文译为“弟兄们”，脚注说明可能包括姊妹。
  alternative: 正文译为“弟兄姊妹们”。
  rationale: 希腊文在语法上是阳性复数，但书信称呼很可能面向全体信徒；正文与脚注共同保存形式和语用范围。
- issue: πίστις的含义
  choice: 正文译为“信心”。
  alternative: “信靠”或较不可能的“忠信”。
  rationale: 在“富足”这一结构及上下文中，“信心”最自然；但πίστις本身具有一定语义幅度，因此以脚注保存替代译法。
- issue: 贫穷与承受国之间的关系
  choice: 依照句法译为上帝拣选贫穷者，使其在信心上富足并承受国。
  alternative: 将贫穷本身解释为获得国度的功德或充分条件。
  rationale: 经文突出上帝的拣选及他对爱他之人的应许，并未说物质贫穷本身自动带来救恩；译文不增添这种因果关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“岂不是……吗”保留原文预期肯定回答的反问；“在信心上富足”与“世上贫穷”形成清楚对比。所有脚注标记均置于所解释的词语之后。
