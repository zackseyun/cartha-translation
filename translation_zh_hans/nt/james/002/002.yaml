  text: ἐὰν γὰρ εἰσέλθῃ ⸀εἰς συναγωγὴν ὑμῶν ἀνὴρ χρυσοδακτύλιος ἐν ἐσθῆτι λαμπρᾷ, εἰσέλθῃ δὲ καὶ πτωχὸς ἐν ῥυπαρᾷ ἐσθῆτι,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/002.yaml
  text: For if a man wearing gold rings and bright clothing enters into your assembly[a], and a poor man in filthy clothing also enters,
translation:
  language: zh_hans
  text: 因为，若有一个手戴金戒指、身穿华美衣服的男子进入你们的聚会[a]，又有一个身穿肮脏衣服的穷人也进来，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“会堂”。希腊文 συναγωγή 可指“会堂”或“聚会”。
    reason: lexical_alternative
lexical_decisions:
- source_word: συναγωγήν
  choice: 会堂
  rationale: 此词可指“会堂”或一般的“聚会”。译作“会堂”保留雅各所用词语的犹太背景及其具体场所感；脚注说明也可理解为聚会。
- source_word: ἀνὴρ
  choice: 一个……的人
  rationale: 原文为阳性单数，指例子中的一名男子；汉语以“一个……的人”自然表达个体，同时不额外强化性别。
- source_word: χρυσοδακτύλιος
  choice: 手戴金戒指
  rationale: 该形容词字面涉及手指上的黄金饰物，可指戴金戒指；这一译法自然并保留显富的形象。
- source_word: ἐσθῆτι λαμπρᾷ
  choice: 身穿华美衣服
  rationale: λαμπρός兼有光亮、华美、显眼之意；在衣着与贫富对比的语境中，“华美”较自然，又不把词义局限为颜色明亮。
- source_word: πτωχὸς
  choice: 一个……穷人
  rationale: 原文为实体化的阳性单数形容词，与前面的富裕男子形成平行对照。
- source_word: ῥυπαρᾷ ἐσθῆτι
  choice: 身穿污秽衣服
  rationale: ῥυπαρός语气强于一般的破旧，表示肮脏、污秽；“污秽衣服”保留原文鲜明的负面观感。
- source_word: εἰσέλθῃ ... εἰσέλθῃ
  choice: 进了……又有……进来
  rationale: 保留同一动词的重复和两人进入的平行结构，同时使现代汉语流畅。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文不可按外貌待人的劝诫，引出解释性的假设例证。
theological_decisions:
- issue: 基督徒语境中 συναγωγή 的译法
  choice: 会堂
  alternative: 聚会
  rationale: 原词本义和早期犹太基督徒背景容许“会堂”，但也可能泛指信徒的聚会。正文采用较具体、贴近词形的“会堂”，脚注保留“聚会”，不据此推定教会制度或聚会场所。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。句子保留原文未完的条件结构，以逗号结束，等待下一节续接；“华美”与“污秽”形成清楚而不过度解释的社会反差。
