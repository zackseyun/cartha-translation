    rationale: 该词可指会堂，亦可指聚集、集会；雅各书此处的“你们的 συναγωγή”未要求译文断定为特定犹太会堂建筑。以“聚会”为正文、以“会堂”为脚注替代译法，更能保留语境中的开放性。
  - severity: low
    issue: “一个……的人”未明确 ἀνήρ 所指的男子。
    rationale: 原文的 ἀνήρ 明确指一名男子；译为“男子”在此自然且不造成不必要的强调。
  - severity: low
    issue: “身穿污秽衣服”不够自然。
    rationale: “肮脏的衣服”是现代汉语对 ῥυπαρᾷ ἐσθῆτι 更顺畅的表达，仍保留其强烈的负面外观描述。
