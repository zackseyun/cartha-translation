revisions:
- from: 因为若有一个手戴金戒指、身穿华美衣服的人进了你们的会堂[a]，又有一个身穿污秽衣服的穷人进来，
  to: 因为，若有一个手戴金戒指、身穿华美衣服的男子进入你们的聚会[a]，又有一个身穿肮脏衣服的穷人也进来，
  rationale: 修订以“聚会”表达 συναγωγή 在本节中可泛指会众集会的含义，同时在脚注保留“会堂”这一字面且历史上可能的译法，避免对聚会制度或地点作超出原文的判断。另以“男子”反映 ἀνήρ，并将“污秽衣服”调整为更自然的“肮脏衣服”。保留原文两次“进入”的平行及未完结的条件句。
