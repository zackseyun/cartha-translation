id: JAS.2.6
reference: James 2:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ ἠτιμάσατε τὸν πτωχόν. οὐχ οἱ πλούσιοι καταδυναστεύουσιν ὑμῶν, καὶ αὐτοὶ ἕλκουσιν ὑμᾶς εἰς κριτήρια;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/006.yaml
  text: But you have dishonored the poor man[b][a]. Is it not the rich who oppress you and themselves drag you into courts?
translation:
  language: zh_hans
  text: 可是，你们竟羞辱那穷人[a]。欺压你们的，不正是富人吗？把你们硬拉到法庭[b]去的，不也正是他们吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“穷人”。原文为单数，可能承接上文所举的那个穷人，也可代表一般的穷人。
    reason: lexical_alternative
  - marker: b
    text: 或译“审判庭”。原文指司法审理的场所。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠτιμάσατε
  choice: 竟羞辱
  rationale: ἀτιμάζω表示使人受辱、不给应有的尊重；“羞辱”保留荣辱层面的含义，“竟”则自然凸显δέ所带出的反差。
- source_word: τὸν πτωχόν
  choice: 那穷人
  rationale: 带冠词的阳性单数承接2:2–3所描写的具体穷人，同时也具有代表性；“那穷人”在现代汉语中简洁自然，并保留单数。
- source_word: οἱ πλούσιοι
  choice: 富人
  rationale: 实词化形容词指富有的人这一群体；“富人”准确、简洁且符合现代汉语。
- source_word: καταδυναστεύουσιν
  choice: 欺压
  rationale: 该动词指仗势施加严酷权力；“欺压”既传达压迫，也带出权势不对等。
- source_word: ἕλκουσιν
  choice: 硬拉
  rationale: ἕλκω在此具有强行拉扯的生动画面；“硬拉”比一般的“带”更能保留强制意味，又不额外断定拘捕程序。
- source_word: κριτήρια
  choice: 法庭
  rationale: 此处指司法审理场所；“法庭”是清楚、通行的现代汉语表达。
- source_word: καὶ αὐτοὶ
  choice: 不也正是他们
  rationale: 将καί与强调代词αὐτοί的递进和强调作用融入第二个反问，突出做这事的正是那些富人。
- source_word: οὐχ ... ;
  choice: 不正是……吗？
  rationale: οὐχ引导预期肯定回答的反问；汉语“不正是……吗”自然保留这一语用力量。
theological_decisions:
- issue: 单数“那穷人”的所指
  choice: 承接会堂场景中的一个穷人，同时可代表更广泛的穷人群体
  alternative: 把单数直接译为集合意义的“穷人”
  rationale: 上下文刚描写一个衣着破旧的穷人进入聚会，因此正文保留单数和指示意味；但不把其代表性限死，脚注说明也可作一般性理解。
- issue: 对富人的反问是否构成对所有富人的绝对判断
  choice: 保留原文带定冠词的群体性反问，不增添“所有”等绝对化限定
  alternative: 明确译成“所有富人都欺压你们”或弱化为“有些富人”
  rationale: 原文以“富人”为一类提出具有现实针对性的反问，却没有量词；译文既不普遍化为每一位富人，也不擅自缩窄为少数人。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“可是”承接并转折上文；将一个希腊语反问在汉语中分成两个并列反问，以清楚呈现“欺压”和“硬拉到法庭”两个动作，同时借“正是”保留αὐτοί的强调。所有脚注标记均置于对应词语之后。
