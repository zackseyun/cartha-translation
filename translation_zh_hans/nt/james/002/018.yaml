source:
  edition: SBLGNT
  text: Ἀλλ’ ἐρεῖ τις· Σὺ πίστιν ἔχεις κἀγὼ ἔργα ἔχω. δεῖξόν μοι τὴν πίστιν σου ⸀χωρὶς τῶν ⸀ἔργων, κἀγώ ⸂σοι δείξω⸃ ἐκ τῶν ἔργων μου τὴν ⸀πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/018.yaml
  text: But someone will say[a], “You have faith, and I have works.” Show me your faith apart from works[c][b], and I will show you my faith by my works.
translation:
  language: zh_hans
  text: 可是，有人会说[a]：“你有信心，我有行为。”你把你那没有行为的信心显给我看[b]，我也会借着我的行为，把我的信心显给你看[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文原稿没有现代引号；从这里开始的引语到哪里结束，可以有不同理解。正文把“你有信心，我有行为”视为那人的话，把后面的挑战视为作者的回应。
    reason: quotation_scope
  - marker: b
    text: “没有行为”也可译作“离开行为”或“在行为以外”。希腊语χωρίς可表达分离或缺少。这里的“信心”也有“信靠”的含义。
    reason: lexical_alternative
  - marker: c
    text: “借着我的行为”直译可作“从我的行为”。希腊语介词ἐκ既可表示来源，在这里也可表示信心是由行为显明的。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλ’
  choice: 可是
  rationale: 承接上文并引出反方设问，保留明显的转折语气，同时符合现代汉语论辩表达。
- source_word: ἐρεῖ τις
  choice: 有人会说
  rationale: 保留将来时形式所带出的假设性发言，也呈现雅各书常见的论辩问答风格。
- source_word: πίστιν / πίστιν
  choice: 信心
  rationale: 在本段“信心与行为”的论述中，“信心”既自然又能保持核心术语的一致性；不改译为“忠信”，以免预先消解经文本身的神学张力。
- source_word: ἔργα / ἔργων
  choice: 行为
  rationale: “行为”是现代中文中清楚而庄重的表达，也能在本段反复出现时保持概念连贯。
- source_word: δεῖξόν μοι
  choice: 指给我看
  rationale: 直接体现命令语气和可见证明的意味，但没有采用解释性更强的“证明”。
- source_word: χωρὶς τῶν ἔργων
  choice: 没有行为
  rationale: χωρίς可表示“离开、没有”；此处用自然中文表达信心与行为分离的状态，并以脚注保留较贴近形式的译法。
- source_word: κἀγώ σοι δείξω
  choice: 我也要……指给你看
  rationale: 保留κἀγώ的对应和强调，并与前一句“指给我看”形成修辞上的平行。
- source_word: ἐκ τῶν ἔργων μου
  choice: 借着我的行为
  rationale: ἐκ本义可为“从”，在此也可表达依据或媒介；“借着”清楚传达行为使信心显明，同时不把行为说成信心的成因。
theological_decisions:
- issue: πίστις在信心与行为争论中的译法
  choice: 信心
  alternative: 信靠；忠信
  rationale: “信心”保留雅各所讨论的宣称之信与可由行为显出的信之间的张力；译成“忠信”会过早把意义导向人的品格或表现。
- issue: ἐκ τῶν ἔργων μου所表达的关系
  choice: 借着我的行为
  alternative: 从我的行为
  rationale: 正文表达行为是信心显明的媒介或依据，但不进一步断言行为产生信心；脚注保留介词的来源性直译。
- issue: 本节引语的范围
  choice: 将“你有信心，我有行为”作为假设发言者的话，后两句作为作者的回应
  alternative: 把后面的挑战也纳入假设发言者的话，或采用其他说话者划分
  rationale: 希腊文原稿没有现代引号，标点与引语范围需要由上下文判断；正文采用常见且通顺的划分，脚注明确保留其他理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“可是……有人会说”保留论辩感；两次“指给……看”维持原文平行结构。正文避免添加“真正的”“仅仅”等解释性词语，以免替读者解决本节关于信心与行为的张力。
