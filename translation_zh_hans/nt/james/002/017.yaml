base_translation:
  language: en
  yaml_path: translation/nt/james/002/017.yaml
  text: So also faith[a], if it does not have works, is dead by itself.
translation:
  language: zh_hans
  text: 同样，信心[a]若没有行为，单独存在就是死的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“信赖”；此处译作“信实”的可能性较小。希腊语πίστις可有这些含义，但“信心”最符合雅各在本节的论述。
    reason: 词义备选
lexical_decisions:
- source_word: οὕτως καὶ
  choice: 同样
  rationale: 承接上文的比喻并作对应推论；“同样”简洁自然，保留论证衔接。
- source_word: ἡ πίστις
  choice: 信心
  rationale: 本节指所宣称的信或相信；“信心”最符合雅各此处的论证，同时不把词义限定为主观信赖或忠信。
- source_word: ἐὰν μὴ ἔχῃ
  choice: 如果没有
  rationale: 直接表达ἐάν μή加现在时虚拟语气所构成的条件，现代汉语自然清楚。
- source_word: ἔργα
  choice: 行为
  rationale: 指外在所行之事，并与本章上下文中信心与行为的讨论保持术语一致；不进一步解释这些行为的性质。
- source_word: νεκρά
  choice: 死的
  rationale: 保留原文强烈而直接的隐喻，不弱化为“没有活力”。
- source_word: καθ’ ἑαυτήν
  choice: 本身
  rationale: 表达这种信心在没有行为、单独存在的情况下即为死的；措辞简明，未额外加入解释。
theological_decisions:
- issue: 在信心与行为争议语境中如何翻译πίστις
  choice: 信心
  alternative: 信赖；忠信
  rationale: “信心”最能保留雅各对所宣称之信及其与行为关系的论述，也不预先以某一宗派体系化解经文本身的张力。
- issue: καθ’ ἑαυτήν与“没有行为”的关系
  choice: 本身就是死的
  alternative: 单独存在就是死的；就其本身而言是死的
  rationale: 采用自然汉语保留信心与行为相隔离时为死的判断，同时避免扩写为关于称义机制的教义说明。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“同样”承接上文，“信心—行为—死的”保留原文简洁有力的论证结构。
