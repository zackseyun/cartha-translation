  text: βλέπεις ὅτι ἡ πίστις συνήργει τοῖς ἔργοις αὐτοῦ καὶ ἐκ τῶν ἔργων ἡ πίστις ἐτελειώθη,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/022.yaml
  text: You see that faith was working together with his works[b][a], and by the works faith was brought to completion.
translation:
  language: zh_hans
  text: 你看，信心同他的行为一起发挥作用；信心也借着这些行为得以成全。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “得以成全”也可译作“达到成熟”或“达到完满”；希腊文动词可指达到预期的终点或完整状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπεις
  choice: 你看
  rationale: 保留第二人称单数的直接修辞呼语，现代汉语自然简洁。
- source_word: πίστις
  choice: 信心
  rationale: 在雅各书本段论证中采用通行且不预先化解争议的译法；“忠信”或“信靠”等相关义项可由语境讨论，但此处不宜替换正文。
- source_word: συνήργει
  choice: 一同起作用
  rationale: 未完成时表达过去持续发生的配合作用；“一同”也保留 συνεργέω 中共同运作的含义。
- source_word: τοῖς ἔργοις αὐτοῦ
  choice: 与他的行为
  rationale: 与 συνεργέω 搭配译作“与……”，αὐτοῦ 指亚伯拉罕；“行为”在现代汉语中比“功德”中性，并与本段主题相符。
- source_word: ἐκ τῶν ἔργων
  choice: 借着行为
  rationale: ἐκ 在此可表达促成结果的途径或根据；“借着”自然传达行为在信心得以完全之中的作用，同时不扩展为系统神学解释。
- source_word: ἐτελειώθη
  choice: 得以完全
  rationale: 保留不定过去时被动语态以及 τελειόω 达到完整、成熟或预期终点的含义，不暗示此前的信心具有道德瑕疵。
theological_decisions:
- issue: 信心与行为之间的关系
  choice: 信心与行为一同起作用，且借着行为得以完全
  alternative: 行为只在人面前证明信心；行为使信心成熟；行为是信心不可缺少的表现
  rationale: 原文明确表达共同作用和达到完全，却未在本节给出完整的称义体系；译文保留这种神学张力，不代入宗派性解释。
- issue: πίστις 的译法
  choice: 信心
  alternative: 忠信；信靠
  rationale: “信心”符合本段语篇及现代中文圣经术语，也保留其所指究竟侧重相信、信靠还是忠信表现的讨论空间。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“行为”保持雅各书论述中的关键词一致性；句式保留原文前后两个分句的并列推进。脚注标记置于所解释的“得以完全”之后。
