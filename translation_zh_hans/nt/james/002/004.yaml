  text: have you not made distinctions among yourselves and become judges with evil thoughts?[a][b]
translation:
  language: zh_hans
  text: 你们岂不是在彼此之间加以区别[a]，并且成了按着邪恶的心思作判断的审判者[b]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在彼此之间加以区别”也可译作“在你们自己里面作了分别”，或按另一种理解译作“在你们里面有了分裂”。这个动词在别处也可表示“疑惑”，但这里的上下文更侧重按贫富作出带有歧视性的区别。
    reason: lexical_alternative
  - marker: b
    text: 直译：“邪恶意念（或‘邪恶思量’）的审判者。”此处也可理解为“怀着邪恶意念的审判者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: διεκρίθητε
  choice: 在彼此之间加以区别
  rationale: 这里的语境是聚会中按贫富区别待人（2:1—3），因此取“加以区别、分别对待”之意，而不取本词在其他语境中可有的“疑惑”之意。措辞保留了中间/被动形式可能蕴含的群体内部张力。
- source_word: ἐν ἑαυτοῖς
  choice: 在彼此之间
  rationale: 原短语既可偏向“在你们里面”，也可指“你们彼此之间”。本段描写群体中的差别待遇，故正文采用较自然的群体性表达，同时以脚注保留内在分裂的可能。
- source_word: ἐγένεσθε
  choice: 成了
  rationale: γίνομαι 表示前述行为所造成的结果；“成了”简洁自然，也保留结果性的语气。
- source_word: κριταὶ
  choice: 审判者
  rationale: κριτής 的基本意义是“审判者、法官”。此处不是正式司法职位，而是指他们擅自评断人的角色；“审判者”保留原文的司法和道德力度。
- source_word: διαλογισμῶν πονηρῶν
  choice: 心怀邪恶意念
  rationale: 原文直译为“邪恶意念/思量的审判者”，属领属格结构。正文用“心怀”表达这些审判者受邪恶思想或盘算支配，读来较自然；脚注保留原文结构及“思量”的词义幅度。
- source_word: οὐ
  choice: 岂不是……吗
  rationale: οὐ 引导的反问预期肯定回答。“岂不是……吗”在现代汉语中自然地传达责问和反诘的力度。
theological_decisions:
- issue: διακρίνω 与偏待人的关系
  choice: 本节责备信徒在群体中按外在条件区别待人。
  alternative: 本节主要指他们内心分裂、摇摆或疑惑。
  rationale: 紧接2:1—3按衣着和贫富差别接待人的场景，社会性的区别待遇是首要含义；不过词形和ἐν ἑαυτοῖς仍容许“自身陷入分裂”的语意回响，因此在脚注中保留。
- issue: διαλογισμῶν πονηρῶν 的关系
  choice: 将其理解为审判者心怀或受邪恶意念支配。
  alternative: 严格按领属格译作“邪恶意念的审判者”，其关系可理解为以邪恶推想作判断，或审断邪恶的意念。
  rationale: 上下文谴责偏待人的判断，最自然的是这些人的判断出于邪恶的思量；但原文领属格关系简约，脚注保留其字面形式，避免完全消除语法张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“岂不是……吗”保留原文反问和责备语气；“加以区别”避免过度口语化，也不直接把解释性较强的“歧视”放入正文。所有脚注标记均已置于正文。
