base_translation:
  language: en
  yaml_path: translation/nt/james/002/012.yaml
  text: So speak and so act as those who are going to be judged through the law of freedom.
translation:
  language: zh_hans
  text: 你们要这样说话，也要这样行事，如同将要藉着自由的律法受审判的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως λαλεῖτε καὶ οὕτως ποιεῖτε
  choice: 就该这样说话，这样行事
  rationale: 保留两次οὕτως形成的平行与劝勉语气；汉语补出“该”，自然表达希腊语现在时命令式的持续规范意味。
- source_word: νόμου ἐλευθερίας
  choice: 使人自由的律法
  rationale: 属格短语可直译为“自由的律法”，但现代汉语容易被理解为律法本身享有自由；“使人自由的律法”清楚传达该律法与自由的关联，同时不额外限定其运作方式。
- source_word: διὰ νόμου
  choice: 藉着……律法
  rationale: διά加属格通常表示媒介或途径；采用“藉着”保留英文审定层所强调的through，而不改成更易暗示直接施动者的“被……审判”。
- source_word: μέλλοντες κρίνεσθαι
  choice: 既然将要……受审判
  rationale: 准确表达μέλλω所指向的将来，以及κρίνεσθαι的被动含义；“既然”使ὡς所引出的身份与行事根据在汉语中自然连贯。
theological_decisions:
- issue: 律法在审判中的关系
  choice: 藉着使人自由的律法受审判
  alternative: 被使人自由的律法审判
  rationale: 原文διά加属格更直接表示媒介或途径。译作“藉着”避免把律法明确人格化为审判主体，也保留审判者未明说的空间。
- issue: “自由”属格的语义
  choice: 使人自由的律法
  alternative: 自由的律法
  rationale: 选择通顺的功能性表达，但不进一步解释自由是脱离罪、定罪或礼仪约束，以免导入原句未明说的教义限定。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“这样说话，这样行事”保留原文整齐的平行结构；将原因/身份从句前置，符合汉语信息组织习惯，并突出将来受审判是当前言行的依据。
