review_pass:
  verdict: revise
  source_fidelity: 原文以两个现在时命令式“要这样说话、要这样行事”开头，并以ὡς引出“如同将要……受审判的人”的方式／身份限定。草稿准确保留将来被动审判及διά（藉着）的媒介含义，但把ὡς译为“既然”，使其成为明确的因果前提，弱化了原文的“如同……的人”表述。
  naturalness: 草稿汉语通顺，但将条件性／身份性从句前置并使用“既然……就该……”会比原文更具推论色彩。修订后维持现代汉语自然庄重的劝勉语气，也保留原文的平行结构。
  terminology: “自由的律法”较贴近νόμου ἐλευθερίας的简洁属格结构，并避免“使人自由的”所加入的功能性释义；“藉着”恰当保留διά加属格的媒介意义，不把律法指定为审判的施行者。
  issues:
  - severity: medium
    issue: “既然”将ὡς处理为因果连词。
    rationale: ὡς在此将读者的言行方式比作／规定为将要受审判者应有的方式；虽然可蕴含劝勉理由，但原文并未明确使用“既然……就……”的因果句式。
  - severity: low
    issue: “使人自由的律法”带入功能性解释。
    rationale: 该表达可以成立，但νόμου ἐλευθερίας本身未明确说明律法如何使人自由。“自由的律法”既自然，也较完整保留属格关系的开放性。
  revised_text: 你们要这样说话，也要这样行事，如同将要藉着自由的律法受审判的人。
