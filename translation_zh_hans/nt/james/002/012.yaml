revisions:
- from: 你们既然将要藉着使人自由的律法受审判，就该这样说话，这样行事。
  to: 你们要这样说话，也要这样行事，如同将要藉着自由的律法受审判的人。
  rationale: 将命令式及其双重“这样”置于句首，保留原文平行；以“如同……的人”对应ὡς μέλλοντες，避免把身份／方式限定改作明确因果。将“使人自由的律法”收为“自由的律法”，以减少原文未明说的功能性阐释，同时保留“藉着”所表达的审判媒介。
  reviewer_model: gpt-5.6-terra
