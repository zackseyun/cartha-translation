  text: οὐκ ἔστιν αὕτη ἡ σοφία ἄνωθεν κατερχομένη, ἀλλὰ ἐπίγειος, ψυχική, δαιμονιώδης·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/015.yaml
  text: This wisdom is not coming down from above[a], but is earthly, unspiritual, demonic.
translation:
  language: zh_hans
  text: 这样的智慧不是从上面降下来的，而是属地的、不属灵的[a]、属鬼魔的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“属天然生命的”。这个希腊词可指仅属于天然生命层面的事物，与属灵的事物相对。
    reason: 保留ψυχική的词义选择及其与属灵领域相对的含义。
lexical_decisions:
- source_word: αὕτη ἡ σοφία
  choice: 这样的智慧
  rationale: 指向上文所描述的那一种“智慧”；“这样的智慧”在现代汉语中自然，也保留了指示语的作用。
- source_word: ἄνωθεν
  choice: 从上面
  rationale: 直译其空间意象，并保留其暗示来自上帝的神学内涵；译作“从天上”会更明确，却也更具解释性。
- source_word: κατερχομένη
  choice: 降下来的
  rationale: 保留现在分词所表达的“从上面下来”这一动态意象，同时符合现代汉语表达。
- source_word: ἐπίγειος
  choice: 属地的
  rationale: 与“从上面”形成直接对照；比“世俗的”更贴近原词所指的地上领域，也避免额外加入世俗主义的含义。
- source_word: ψυχική
  choice: 不属灵的
  rationale: 清楚表达此词在新约语境中与属灵领域的对照；原词也可指仅属于天然生命层面的事物，因此用脚注保留这一词义幅度。
- source_word: δαιμονιώδης
  choice: 属鬼魔的
  rationale: 准确表达与鬼魔有关、带有鬼魔性质或来源的含义；比“邪恶的”更具体，也没有把鬼魔误作单数的魔鬼。
theological_decisions:
- issue: ψυχική所表达的属灵与天然生命之对照
  choice: 正文译作“不属灵的”，并以脚注说明“属天然生命的”这一可能译法。
  alternative: 属天然生命的；属血气的
  rationale: “不属灵的”便于现代读者理解本节的负面对照，却可能弱化ψυχική与天然生命层面的词源联系；脚注保留这种真实的词义张力，不把它限定为某一套神学体系。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。三个并列形容词统一译作“属地的、不属灵的、属鬼魔的”，既保留原文的递进式负面评价，也使句式简洁清楚。脚注标记依其实际所释词语置于“不属灵的”之后。
