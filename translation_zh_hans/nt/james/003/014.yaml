  text: εἰ δὲ ζῆλον πικρὸν ἔχετε καὶ ἐριθείαν ἐν τῇ καρδίᾳ ὑμῶν, μὴ κατακαυχᾶσθε καὶ ψεύδεσθε κατὰ τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/014.yaml
  text: But if you have bitter jealousy and selfish ambition in your hearts[d][c][b][a], do not boast and lie against the truth.
translation:
  language: zh_hans
  text: 但你们心里[d]若怀着苦毒的嫉妒[a]和自私的野心[b]，就不要自夸，也不要说谎抵挡真理[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “苦毒的嫉妒”也可译作“苦毒的热心”或“苦毒的妒忌”。
    reason: lexical_alternative
  - marker: b
    text: “自私的野心”也可译作“争竞”或“结党纷争”。
    reason: lexical_alternative
  - marker: c
    text: “说谎抵挡真理”也可译作“说违背真理的谎话”。
    reason: lexical_alternative
  - marker: d
    text: 原文直译为“在你们的心中”；“心”为单数，用来逐一指向你们各人的内心。
    reason: source_form
lexical_decisions:
- source_word: ζῆλον πικρὸν
  choice: 苦毒的嫉妒
  rationale: ζῆλος可指热心、嫉妒或妒忌；这里与具有负面含义的ἐριθείαν并列，因此采用“嫉妒”。“苦毒的”保留πικρόν的强烈负面色彩。
- source_word: ἐριθείαν
  choice: 自私的野心
  rationale: 该词可表达自利的进取心、争竞或结党倾向；“自私的野心”在现代汉语中清楚传达其内在动机，同时不排除由此产生的分裂后果。
- source_word: ἐν τῇ καρδίᾳ ὑμῶν
  choice: 你们心里
  rationale: 原文καρδίᾳ为单数，ὑμῶν为复数，是常见的逐一分配式表达。汉语“你们心里”自然涵盖群体中每个人的内心，无须强行标示单复数。
- source_word: μὴ κατακαυχᾶσθε
  choice: 不要自夸
  rationale: 该动词指夸耀、自高，也可含对着或胜过别人夸口的意味；“自夸”简洁自然，并由上下文显明其傲慢性质。
- source_word: ψεύδεσθε κατὰ τῆς ἀληθείας
  choice: 不要说谎抵挡真理
  rationale: ψεύδεσθε表达说谎或作假，κατά加属格表达敌对、相违的关系；“说谎抵挡真理”同时保留说谎的动作与反对真理的方向。
- source_word: εἰ δὲ
  choice: 但……若
  rationale: δέ承接上文并形成对比；汉语用“但……若”自然地标示与前述从上头来的智慧相反的情形。
theological_decisions:
- issue: “真理”的范围
  choice: 保留宽泛的“真理”，不进一步限定
  alternative: 福音真理；真正的智慧之道；言语上的诚实
  rationale: ἀλήθεια在本节中没有被限定为某套教义、某种智慧观或单纯的诚实品格。保留“真理”可涵盖这些关联，并避免加入经文本身没有明说的解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“怀着”使内在态度与“心里”的关系自然明确；两个“不要”对应原文两个并列的命令，避免将自夸和说谎合并成一个动作。
