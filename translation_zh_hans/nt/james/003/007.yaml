source:
  edition: SBLGNT
  text: πᾶσα γὰρ φύσις θηρίων τε καὶ πετεινῶν ἑρπετῶν τε καὶ ἐναλίων δαμάζεται καὶ δεδάμασται τῇ φύσει τῇ ἀνθρωπίνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/007.yaml
  text: For every kind of beast and bird[a], of reptile and sea creature, is being tamed and has been tamed by humankind.
translation:
  language: zh_hans
  text: 因为各类走兽、飞鸟、爬行动物和海中生物，都在被人类驯服，并且已经被人类[a]驯服了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被人类”也可译作“借着人的本性”或“借着人性”。希腊语短语 τῇ φύσει τῇ ἀνθρωπίνῃ 既可集合性地指人类，也可较抽象地指人的本性或人类所具有的能力；正文采用前一种理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ... φύσις
  choice: 各类
  rationale: 此处 φύσις 用于动物类别，表达“种类”而非抽象的“本性”；“各类”自然地体现 πᾶσα 的周遍意义。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ承接上文，对前一句作解释；“因为”清楚保留这一逻辑关系。
- source_word: θηρίων
  choice: 走兽
  rationale: θηρίον指兽类，常带非家养或野生动物的意味；在与飞鸟、爬行动物和海中生物并列的传统分类中，“走兽”简洁、庄重且易懂。
- source_word: πετεινῶν
  choice: 飞鸟
  rationale: 该词指有翼飞行的生物，语境中即鸟类；“飞鸟”与整组动物分类的文体协调。
- source_word: ἑρπετῶν
  choice: 爬行动物
  rationale: 该词广义可指爬行之物；“爬行动物”是现代汉语中清楚自然的对应，不过不刻意限于严格的现代生物分类学。
- source_word: ἐναλίων
  choice: 海中生物
  rationale: 该名词化形容词指生活在海里的生物；“海中生物”既自然又保持原词的宽泛范围。
- source_word: δαμάζεται
  choice: 都能被人类驯服
  rationale: 现在时被动语态表示普遍、持续发生的驯服过程。汉语用“能被……驯服”自然表达这种一般事实，并与后面的完成状态相区别。
- source_word: δεδάμασται
  choice: 也已经被人类驯服了
  rationale: 完成时被动语态强调驯服已经发生并产生现存结果；“已经……了”保留其完成意味。
- source_word: τῇ φύσει τῇ ἀνθρωπίνῃ
  choice: 被人类
  rationale: 此处工具格/施事表达最自然地理解为人类整体实施驯服；汉语“人类”简明呈现其集合意义。
theological_decisions:
- issue: τῇ φύσει τῇ ἀνθρωπίνῃ 的所指
  choice: 正文按集合意义译为“人类”
  alternative: 译为“人的本性”或“人性”
  rationale: 在驯服各种动物的语境中，集合性的施事理解最为顺畅；但希腊语 φύσις 仍容许较抽象的“人的本性/人类属性”理解，因此以脚注保留该歧义。
translation_notes:
  register: 采用现代、庄重且通俗的书面汉语。“走兽、飞鸟、爬行动物和海中生物”保留原文四类生物的列举；“都能……也已经……”体现现在时与完成时两个被动动词之间的修辞推进。脚注标记置于整句之后，因为所说明的是句末施事短语“被人类”。
