base_translation:
  language: en
  yaml_path: translation/nt/james/003/018.yaml
  text: And the fruit of righteousness is sown in peace by those who make peace[a][b].
translation:
  language: zh_hans
  text: 并且，公义的果实，是由促成和平的人在和平中撒下的[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“正义的果实”。这里的希腊词既可指道德上的正直，也可带有关系、社会或法律层面的公正含义。
    reason: lexical_alternative
  - marker: b
    text: 或译“为促成和平的人”。这里的希腊语与格可以有不同理解；不过与本句的被动动词相配时，译作“由促成和平的人”较为自然。
    reason: alternative_reading
lexical_decisions:
- source_word: καρπὸς
  choice: 果子
  rationale: 保留原文单数名词及其结果、出产的比喻；“收成”虽符合农耕语境，却会提前强化收获阶段。
- source_word: δὲ
  choice: 并且
  rationale: 这里是温和的承接，而非强烈转折；“并且”自然连接上文关于从上头来的智慧的描述。
- source_word: δικαιοσύνης
  choice: 正义
  rationale: δικαιοσύνη兼有道德上的正直及关系、社会或法律层面的公正含义；本句谈促成和平的行为，“正义”较能保留这种宽度，而“义”是可行的传统译法，列入脚注。
- source_word: ἐν εἰρήνῃ
  choice: 在和平中
  rationale: 较贴近原文，保留其既可表达撒种的环境，也可表达撒种方式的开放性。
- source_word: σπείρεται
  choice: 撒种
  rationale: 以中文被动结构“由……撒种”表达现在时被动态，同时保留播种意象；原文现在时在此无需硬译为持续进行。
- source_word: τοῖς ποιοῦσιν εἰρήνην
  choice: 由促成和平的人
  rationale: 与被动动词相配时，施事用法最自然；“促成和平”比字面的“做和平”符合现代汉语，也比单称“和平缔造者”更明确保留动作。
theological_decisions:
- issue: “正义的果子”的属格关系
  choice: 保留“正义的果子”这一结构，不限定它究竟是以正义为性质的果子、作为正义的收成，还是产生正义的果子。
  alternative: 明确译作“结出正义的果实”或“正义这一收成”。
  rationale: δικαιοσύνης的属格关系在本句中可以有描述、同位或结果等相近理解；直译式结构能保留原文的神学张力。
- issue: τοῖς ποιοῦσιν εἰρήνην的与格功能
  choice: 按被动动词的施事理解，译作“由促成和平的人”。
  alternative: 按受益者理解，译作“为促成和平的人”。
  rationale: 施事解读在σπείρεται这一被动形式旁较自然，但与格形式本身允许其他理解，因此以脚注保存另一读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在和平中”有意保留原文略显凝练的表达及其修饰范围；“由促成和平的人撒种”既保持被动句式，也避免宗派化术语。
