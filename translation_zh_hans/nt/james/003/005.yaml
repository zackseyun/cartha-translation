  text: οὕτως καὶ ἡ γλῶσσα μικρὸν μέλος ἐστὶν καὶ ⸂μεγάλα αὐχεῖ⸃. Ἰδοὺ ⸀ἡλίκον πῦρ ἡλίκην ὕλην ἀνάπτει·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/005.yaml
  text: So also the tongue is a small member[a], and yet it boasts of great things[b]. See how small a fire sets ablaze so great a forest.
translation:
  language: zh_hans
  text: 同样，舌头虽是个小肢体，却夸口说大话。看哪，一点小火[a]竟能点燃偌大的树林[b]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“看哪，何等大的火点燃何等大的树林！”希腊语ἡλίκον可作感叹性的“何等大”理解；正文按上下文译为小火造成巨大后果，与舌头虽小却影响甚大的比喻相应。
    reason: alternative_reading
  - marker: b
    text: “树林”也可译作“木材”“柴草”或“可燃物”。原文ὕλη可泛指林木或可燃材料。
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσα
  choice: 舌头
  rationale: 直译为身体部位“舌头”，保留本节与“小肢体”相呼应的具体比喻；不直接释为“言语”。
- source_word: μικρὸν μέλος
  choice: 小肢体
  rationale: “肢体”保留身体意象以及与上文身体各部分的联系，也符合庄重而自然的现代汉语表达。
- source_word: μεγάλα αὐχεῖ
  choice: 夸口大事
  rationale: 保留动词“夸口”及中性复数形容词所表达的“大事”；既可指夸说宏大的事，也带有自大的语气，不进一步限定其具体内容。
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 保留引人注意的提示作用；“看哪”比“看”更能传达原文的强调，又不至于过分古雅。
- source_word: ἡλίκον πῦρ
  choice: 一点小火
  rationale: 结合舌头虽小却影响巨大的紧邻比喻，将ἡλίκον理解为火虽小；“一点小火”自然地表达小因造成大果的反差，同时以脚注保留另一种语法理解。
- source_word: ἡλίκην ὕλην
  choice: 偌大的树林
  rationale: ὕλη可指林木、木材或可燃物；此处译作“树林”最能在现代汉语中形成鲜明的野火图景，“偌大”则保留与小火之间的强烈反差。
- source_word: ἀνάπτει
  choice: 点燃
  rationale: “点燃”简洁、现代，并准确表达使某物燃烧起来的动作；副词“竟”在句中体现原文比较所强调的惊人反差。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“虽……却……”明确呈现小肢体与大夸口之间的让步反差；“竟”强化小火与大树林之间的悬殊效果，但不添加新的命题内容。脚注均置于相关火与树林的比喻之后，以免错误地附着于前半句。
