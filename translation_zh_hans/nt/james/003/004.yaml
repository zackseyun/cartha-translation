  - severity: low
    issue: 末句后半的船只主语未明示。
    rationale: 补出“它们”可明确是船只随掌舵者所欲的方向转向，同时不增加原文意义。
  - severity: low
    issue: 脚注的“意向愿往哪里”说明尚可更准确地呈现原文的异常主谓搭配。
    rationale: ὁρμή是βούλεται的语法主语；以“意向愿意（去）哪里”说明，能保留其刻意生硬性并避免把它误解为常规的“掌舵者想去哪里”。
