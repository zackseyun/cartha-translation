  text: ἰδοὺ καὶ τὰ πλοῖα, τηλικαῦτα ὄντα καὶ ὑπὸ ⸂ἀνέμων σκληρῶν⸃ ἐλαυνόμενα, μετάγεται ὑπὸ ἐλαχίστου πηδαλίου ὅπου ⸂ἡ ὁρμὴ τοῦ εὐθύνοντος βούλεται⸃·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/004.yaml
  text: 'Look also at the ships: though they are so large and are driven by strong winds[a], they are steered by a very small rudder wherever the inclination of the one steering wills.'
translation:
  language: zh_hans
  text: 再看船只：它们虽然如此巨大，又被强风驱赶，却由极小的舵操纵；掌舵者想往哪里，它们就往哪里转。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文此处较直译为“掌舵者的意向愿意（去）哪里”。“意向”也可译为“冲动”或“倾向”。
    reason: 说明ἡ ὁρμή作βούλεται主语的特殊表达，并保留其词义范围。
lexical_decisions:
- source_word: ἰδοὺ καὶ τὰ πλοῖα
  choice: 再看船只
  rationale: 用自然的现代汉语引出与上节平行的第二个例证，保留ἰδοὺ的提示作用和καί的承接意义。
- source_word: τηλικαῦτα ὄντα
  choice: 船虽然那么大
  rationale: τηλικαῦτα强调船体庞大；结合后文“极小的舵”所形成的反差，用“虽然”表达语境中的让步关系。
- source_word: ὑπὸ ἀνέμων σκληρῶν ἐλαυνόμενα
  choice: 又被猛烈的风催动
  rationale: 保留被动结构；σκληρός形容风时表示强劲、猛烈，“催动”也传达ἐλαύνω使之行进的动态含义。
- source_word: μετάγεται
  choice: 转向
  rationale: 该词表示被带往另一方向；在舵的语境中译为“转向”，准确呈现船只方向受控的图景。
- source_word: ὑπὸ ἐλαχίστου πηδαλίου
  choice: 由一片极小的舵操纵
  rationale: “极小”保留ἐλάχιστος的最高级强化意味，并与船的庞大形成鲜明对比；“舵”准确对应πηδάλιον。
- source_word: ὅπου ἡ ὁρμὴ τοῦ εὐθύνοντος βούλεται
  choice: 掌舵者想往哪里，就转向哪里
  rationale: 以通顺汉语表达目的地方向和掌舵者的意愿；同时用脚注保留希腊语将“意向”作为βούλεται主语的特殊措辞。
theological_decisions:
- issue: 掌舵者意愿短语的直译程度
  choice: 正文译作“掌舵者想往哪里，就转向哪里”
  alternative: “掌舵者的意向愿往哪里，就转向哪里”
  rationale: 直译会在现代汉语中显得生硬，且容易妨碍理解。正文清楚保留小舵依掌舵者意愿控制大船的比喻重点，脚注则交代原文独特的名词结构，不把ὁρμή的含义完全隐去。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“再看”承接上节例证；“猛烈的风”“极小的舵”突出力量与大小的反差。正文避免古奥的“看哪”和不自然的机械直译，同时以脚注保存原文措辞的张力。
