  text: Μὴ πολλοὶ διδάσκαλοι γίνεσθε, ἀδελφοί μου, εἰδότες ὅτι μεῖζον κρίμα λημψόμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/001.yaml
  text: Not many of you should become teachers[a], my brothers, knowing that we will receive a greater judgment.
translation:
  language: zh_hans
  text: 我的弟兄们[a]，你们中间不要有太多人成为教师；要知道，我们将受更重的审判。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“弟兄们”很可能是对整个群体的称呼，也包括姊妹。
    reason: 说明ἀδελφοί在此处可能具有的群体性、包容性用法。
lexical_decisions:
- source_word: Μὴ πολλοὶ
  choice: 不要有许多人
  rationale: μή与现在时命令式γίνεσθε构成劝阻；译文保留“人数不宜多”的重点，而不改写成绝对禁止。
- source_word: διδάσκαλοι
  choice: 教师
  rationale: 直译教师或教导者；“教师”自然、明确，也不把它限定为某种制度化职分。
- source_word: γίνεσθε
  choice: 成为
  rationale: 保留γίνομαι表示进入某种身份或角色的动态含义。
- source_word: ἀδελφοί μου
  choice: 我的弟兄们
  rationale: 保留原文阳性复数称呼；其在群体称谓中可能包含女性的范围另以脚注说明。
- source_word: εἰδότες
  choice: 因为知道
  rationale: 将分词所表达的理由自然地译出，同时不增添原文没有的具体解释。
- source_word: μεῖζον
  choice: 更重的
  rationale: μεῖζον表示比较程度；与“审判”搭配时，“更重的”既自然，也传达更大、更严的分量。
- source_word: κρίμα
  choice: 审判
  rationale: 保留其较宽泛的判断、裁决含义，不提前限定为最终定罪。
- source_word: λημψόμεθα
  choice: 我们将受
  rationale: 自然表达“将要领受”，并保留第一人称复数，即作者把自己包括在承担教导责任的人中。
theological_decisions:
- issue: ἀδελφοί μου是否包括群体中的女性
  choice: 正文译作“我的弟兄们”，脚注说明可能包括姊妹
  alternative: 弟兄姊妹们
  rationale: 正文保留希腊文的语法形式，同时借脚注呈现这一群体称谓很可能具有的包容范围。
- issue: κρίμα所指审判的性质
  choice: 审判
  alternative: 定罪
  rationale: 本节明确强调教师要承担更重的责任，却没有要求把κρίμα限定为最终定罪；“审判”保留原文的神学张力。
- issue: μεῖζον κρίμα的比较含义
  choice: 更重的审判
  alternative: 更严厉的审判
  rationale: “更重”较贴近μεῖζον的宽泛比较意义，同时在中文中能自然表达加重的问责，不把比较范围过度解释为单指严厉程度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不要有许多人成为教师”保留原文对人数的限制，而非绝对禁止教导；“因为知道”承接希腊文分词的理由含义。
