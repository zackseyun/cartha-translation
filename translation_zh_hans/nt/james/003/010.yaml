base_translation:
  language: en
  yaml_path: translation/nt/james/003/010.yaml
  text: From the same mouth come blessing and cursing. My brothers[a], these things ought not to be so.
translation:
  language: zh_hans
  text: 祝福和咒诅都从同一张口中出来。我的弟兄们[a]，这些事不应当是这样的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的弟兄姐妹们”。希腊文直译为“我的弟兄们”，但在这里，雅各很可能是在称呼整个信徒群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ αὐτοῦ στόματος
  choice: 从同一张口里
  rationale: 保留“口”作为言语来源的具体意象；“从……里”符合现代汉语表达。
- source_word: ἐξέρχεται
  choice: 出来
  rationale: 直接表达言语从口中发出，简洁自然；希腊文虽用单数动词，汉语无需标示数的一致。
- source_word: εὐλογία καὶ κατάρα
  choice: 祝福和咒诅
  rationale: 两个名词在语境中都指口中说出的言语或行为；此译保留二者鲜明的对照。“咒诅”也比单指某一句话的“诅咒”更能与“祝福”平行。
- source_word: οὐ χρή
  choice: 不应当
  rationale: 表达道德上不合宜、不可如此的判断，同时避免把它强化为绝对不可能。
- source_word: ἀδελφοί μου
  choice: 我的弟兄们
  rationale: 正文保留希腊文阳性复数亲属称谓的形式；其在本信语境中可能包括整个信徒群体，另以脚注说明。
- source_word: ταῦτα οὕτως γίνεσθαι
  choice: 这样的事……发生
  rationale: “这样的事”自然承接前述祝福与咒诅同出一口的现象，并保留 οὕτως 所表达的“这样”以及 γίνεσθαι 的“发生”之意。
theological_decisions:
- issue: ἀδελφοί μου 的性别范围
  choice: 我的弟兄们
  alternative: 我的弟兄姐妹们
  rationale: 希腊文形式为阳性复数“弟兄们”，正文据此直译；但雅各很可能以此称呼整个信徒群体，因此在脚注保留包容性理解，不把范围在正文中定死。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“同一张口”保留原文具体而有冲击力的身体意象；后句用“这样的事不应当发生”，比“事情不该这样”更清楚地对应复数指示语及“不应发生”的结构。
