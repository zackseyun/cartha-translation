source:
  edition: SBLGNT
  text: ⸂εἰ δὲ⸃ τῶν ἵππων τοὺς χαλινοὺς εἰς τὰ στόματα βάλλομεν ⸀εἰς τὸ πείθεσθαι αὐτοὺς ἡμῖν, καὶ ὅλον τὸ σῶμα αὐτῶν μετάγομεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/003.yaml
  text: If we put bits into the mouths of horses so that they obey us[a], we also guide their whole bodies.
translation:
  language: zh_hans
  text: 我们若把嚼环[a]放进马嘴里，使它们顺从我们，也就能驾驭它们的全身。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“马勒”；不过这里更确切地说，是指放在马嘴里的嚼环。
    reason: 词义存在较宽泛的译法，但上下文中的“放进马嘴里”支持较具体的“嚼环”。
lexical_decisions:
- source_word: εἰ δὲ
  choice: 若
  rationale: 保留条件关系；δέ在这里仅有轻微的承接作用，现代汉语无需另加“但”或“如今”，句意仍自然连贯。
- source_word: χαλινοὺς
  choice: 嚼环
  rationale: 所指是放进马嘴、用来控制马匹的衔具部分，比泛指整套马勒更准确。
- source_word: εἰς τὰ στόματα βάλλομεν
  choice: 把……放进马嘴里
  rationale: “放进”自然表达εἰς所含的进入方向，也符合现代汉语把字句的习惯。
- source_word: εἰς τὸ πείθεσθαι αὐτοὺς ἡμῖν
  choice: 使它们顺从我们
  rationale: 表达该结构的目的或结果意味；“顺从”准确传达πείθεσθαι与间接受词连用时的服从含义，同时不过度强化强制因果。
- source_word: μετάγομεν
  choice: 驾驭
  rationale: 该词表示使其转向、引导其行动；在马匹语境中，“驾驭”自然贴切，并呼应以小物控制全身的比喻。
- source_word: ὅλον τὸ σῶμα αὐτῶν
  choice: 它们的全身
  rationale: 保留“整个身体”的强调；汉语以“全身”自然表达希腊文在复数对象中作分配理解的单数σῶμα。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙述语体。“嚼环”为通行的马具用语，并以脚注帮助不熟悉该词的读者；句式保留原文的条件关系和后半句“也”的递进呼应。
