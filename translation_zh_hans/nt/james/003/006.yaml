source:
  edition: SBLGNT
  text: καὶ ἡ γλῶσσα πῦρ, ὁ κόσμος τῆς ⸀ἀδικίας ἡ γλῶσσα καθίσταται ἐν τοῖς μέλεσιν ἡμῶν, ἡ σπιλοῦσα ὅλον τὸ σῶμα καὶ φλογίζουσα τὸν τροχὸν τῆς γενέσεως καὶ φλογιζομένη ὑπὸ τῆς γεέννης.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/006.yaml
  text: And the tongue is a fire. The tongue is set among our members as a world of unrighteousness, staining the whole body and setting on fire the wheel of birth, and being set on fire by Gehenna.
translation:
  language: zh_hans
  text: 舌头就是火。在我们的肢体中，舌头成了一个不义的世界，玷污全身[a]，点燃出生之轮[b]，自己也被革赫拿点燃[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使全身污秽。”
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“出生之轮”；也可理解为“生命的历程”或“生命的循环”。
    reason: lexical_alternative
  - marker: c
    text: “革赫拿”是希腊语术语，传统上常译作“地狱”。
    reason: alternative_reading
lexical_decisions:
- source_word: γλῶσσα
  choice: 舌头
  rationale: 保留具体的身体器官意象，同时让上下文所指的言语功能自然显明。
- source_word: πῦρ
  choice: 火
  rationale: 汉语判断句“舌头也是火”自然有力，保留原文的毁灭性比喻，无须添加量词。
- source_word: ὁ κόσμος τῆς ἀδικίας
  choice: 一个不义的世界
  rationale: 保留原文突兀而强烈的“世界”意象；“不义”涵盖广泛的道德败坏，不缩窄为社会层面的“不公”。
- source_word: καθίσταται ἐν τοῖς μέλεσιν ἡμῶν
  choice: 在我们的肢体中……成了
  rationale: “肢体”维持身体各部分的语境；“成了”表达该动词在此所述的地位或状态，同时避免强行指定是谁安置了舌头。
- source_word: ἡ σπιλοῦσα ὅλον τὸ σῶμα
  choice: 玷污全身
  rationale: 表达污点及道德污染的双重意象，且符合现代汉语圣经语体。
- source_word: φλογίζουσα
  choice: 点燃
  rationale: 简洁保留火的连续意象，并清楚表达主动作用。
- source_word: τὸν τροχὸν τῆς γενέσεως
  choice: 生命运转之轮
  rationale: 保留τροχός的“轮”这一陌生而鲜明的比喻，同时以“生命运转”传达γένεσις在此可能指生命进程或存在历程；脚注列出更直译和更通顺的可能译法。
- source_word: φλογιζομένη
  choice: 自己也被……点燃
  rationale: 清楚保留被动分词，表明舌头点燃别物，其本身又从另一源头受燃；“自己也”使两个分词之间的关系在汉语中明晰。
- source_word: ὑπὸ τῆς γεέννης
  choice: 被欣嫩子谷之火
  rationale: γέεννα源于欣嫩子谷，但此处置于火的语境中；“欣嫩子谷之火”既保留专名的历史形态，也使汉语句意成立，并以脚注说明传统译法。
theological_decisions:
- issue: γέεννα的译法
  choice: 欣嫩子谷之火
  alternative: 地狱之火；革赫拿
  rationale: 不直接用后世概括性较强的“地狱”取代特定希腊词，也不采用普通读者难以理解的纯音译；正文保留其地名背景，脚注交代传统译法，避免超出经文解决其完整神学内涵。
- issue: τὸν τροχὸν τῆς γενέσεως的解释
  choice: 生命运转之轮
  alternative: 生命的历程；出生之轮
  rationale: 原短语罕见且意义有争议。正文兼顾“轮”的具体意象与整个人生进程的可能含义，不把它完全平化为单一解释；脚注保留其他可能。
translation_notes:
  register: 采用现代、庄重而可理解的普通话。保留“不义的世界”和“轮”等原文中强烈甚至陌生的意象；用“玷污全身”“点燃”保持紧凑并延续火与污染的修辞。所有脚注标记均已置于相关正文之后。
