  text: Τίς σοφὸς καὶ ἐπιστήμων ἐν ὑμῖν; δειξάτω ἐκ τῆς καλῆς ἀναστροφῆς τὰ ἔργα αὐτοῦ ἐν πραΰτητι σοφίας.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/013.yaml
  text: Who is wise and understanding among you? Let him show his works by his good conduct[b][a], in the meekness of wisdom.
translation:
  language: zh_hans
  text: 你们中间谁有智慧、有见识呢？他[a]就当借着美好的品行，以智慧的温柔[b]，显出自己所行的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文用阳性单数形式“他”，在这里可泛指群体中任何这样的人。
    reason: cultural_note
  - marker: b
    text: 或译：“以智慧所带来的温柔”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς σοφὸς καὶ ἐπιστήμων ἐν ὑμῖν
  choice: 你们中间谁有智慧、有见识呢
  rationale: “谁……呢”自然地表达修辞性问句；“有智慧、有见识”分别传达 σοφός 的实践与道德智慧，以及 ἐπιστήμων 所指的明辨和理解。
- source_word: δειξάτω
  choice: 他就该……显出
  rationale: 保留第三人称单数命令语气；“就该”在现代汉语中自然表达劝诫性的命令。
- source_word: ἐκ τῆς καλῆς ἀναστροφῆς
  choice: 从美好的品行中
  rationale: ἐκ 可表示来源，ἀναστροφή 指生活表现或行为方式；此译法保留“作为从美好品行中显明”的关系。
- source_word: τὰ ἔργα αὐτοῦ
  choice: 自己的作为
  rationale: “作为”可表达 ἔργα 的行为、所做之事之义，同时避免把它预先限定为“善行”；“自己的”清楚对应 αὐτοῦ。
- source_word: ἐν πραΰτητι σοφίας
  choice: 以智慧的温柔
  rationale: “温柔”表达 πραΰτης 所指受约束、不争竞的谦和品格；“智慧的温柔”保留属格 σοφίας 在性质、归属或来源上的一定开放性。
theological_decisions:
- issue: 阳性单数命令式的代表性用法
  choice: 他就该
  alternative: 这样的人就该
  rationale: 原文以阳性单数形式指向问题中所说的人；正文保留单数形式，并用脚注说明其可代表群体中任何符合描述的人。
- issue: “智慧”与“温柔”的属格关系
  choice: 智慧的温柔
  alternative: 智慧所带来的温柔
  rationale: 原文 σοφίας 可理解为描述温柔的性质，也可理解为温柔的来源；正文采用较凝练且保留张力的译法，脚注列出来源性理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“有智慧、有见识”适合公开诵读；“美好的品行”和“自己的作为”既易懂，也保留雅各书对实际行为的强调。
