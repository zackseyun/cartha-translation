  text: τὴν δὲ γλῶσσαν οὐδεὶς ⸂δαμάσαι δύναται ἀνθρώπων⸃· ⸀ἀκατάστατον κακόν, μεστὴ ἰοῦ θανατηφόρου.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/008.yaml
  text: But no one among men is able to tame the tongue[a]. It is a restless evil[b], full of deadly poison.
translation:
  language: zh_hans
  text: 但在人类中，没有人能驯服舌头[a]；舌头是躁动不安的恶物[b]，充满致命的毒液。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但人无法驯服舌头。”
    reason: alternative_reading
  - marker: b
    text: “躁动不安的”也可译为“不安定的”或“难以约束的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσαν
  choice: 舌头
  rationale: 保留身体器官的字面意象；在上下文中，它指人的言语，并与本段前文的比喻保持连贯。
- source_word: οὐδεὶς … ἀνθρώπων
  choice: 人的……没有人
  rationale: ἀνθρώπων是与οὐδείς相连的部分属格，意思是“人类中没有一个人”。中文采用自然表达，同时明确限定在人类能力范围内。
- source_word: δαμάσαι δύναται
  choice: 能制伏
  rationale: δαμάζω在前文用于驯服动物；“制伏”既保留控制、驯服之意，也适合“舌头”这一比喻。脚注列出更贴近驯兽意象的译法。
- source_word: ἀκατάστατον
  choice: 躁动不安的
  rationale: 该词可表示不安定、动荡、难以约束；“躁动不安”在此能自然描写舌头无法安定、难受控制的特性，同时不将其仅解释为一般的“不稳定”。
- source_word: κακόν
  choice: 恶物
  rationale: 保留κακόν的道德性和实体化描述；“恶物”比单说“祸害”更少偏向结果，也自然承接系词省略句。
- source_word: μεστὴ ἰοῦ θανατηφόρου
  choice: 充满致命的毒液
  rationale: μεστή译为“充满”；ἰός在此结合“致命的”显然指毒物。“毒液”保留鲜明意象，而不限定为某一种动物的毒液。
theological_decisions:
- issue: “没有人能制伏舌头”是否表达绝对的人类无能
  choice: 保留“人的舌头，没有人能制伏”
  alternative: 舌头是人无法制伏的
  rationale: 原文明确把否定限定于ἀνθρώπων，即人类中无人有此能力；译文保留这一张力，不擅自加入神能制伏、信徒可完全制伏或只能部分控制等解释。
- issue: κακόν的道德力度
  choice: 恶物
  alternative: 祸害
  rationale: “恶物”保留道德上的“恶”，避免只把舌头描述为造成损害的工具。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。主句前置“人的舌头”，既保留原文强调次序，也避免生硬地直译为“人中没有一人”。分号呈现原文由能力陈述转入性质描述的停顿。所有脚注标记均已置入正文。
