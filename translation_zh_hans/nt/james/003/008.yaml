  to: 但在人类中，没有人能驯服舌头[a]；舌头是躁动不安的恶物[b]，充满致命的毒液。
  rationale: 修订仅改善中文句法清晰度和与上下文的词汇连贯性：以“在人类中，没有人”准确、自然地表达οὐδεὶς … ἀνθρώπων；以“驯服”对应δαμάσαι并呼应3:7。后半句及其词义歧义维持不变，未加入任何神学性解释。
