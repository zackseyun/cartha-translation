  text: ἡ δὲ ἄνωθεν σοφία πρῶτον μὲν ἁγνή ἐστιν, ἔπειτα εἰρηνική, ἐπιεικής, εὐπειθής, μεστὴ ἐλέους καὶ καρπῶν ἀγαθῶν, ⸀ἀδιάκριτος, ἀνυπόκριτος·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/017.yaml
  text: But the wisdom from above is first pure[a], then peaceable, gentle, open to reason, full of mercy and good fruits, impartial, sincere.
translation:
  language: zh_hans
  text: 但从上头来的智慧，首先是纯洁的，其次是爱好和平、温和、乐于听劝，满有怜悯和美善的果子，不偏不倚[a]，真诚无伪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不分裂（或专一）”，也可能指“毫不疑惑（或动摇）”。希腊语ἀδιάκριτος在这里的含义并不完全确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνωθεν
  choice: 从上头来的
  rationale: 保留原文“从上面、从上头”的空间隐喻，并与3:15“属地的”智慧形成对照；不直接译成“从天上来的”，以免过度明确其所指。
- source_word: σοφία
  choice: 智慧
  rationale: 这是该词在本段语境中的常规、自然对应词，指一种具有特定来源和品格的智慧。
- source_word: πρῶτον μὲν … ἔπειτα
  choice: 首先……其次……
  rationale: 体现原文先后次序；“首先”也可暗示纯洁在这些特质中的首要地位。
- source_word: ἁγνή
  choice: 纯洁的
  rationale: 表达道德上的纯正、未受玷污，比“贞洁”更适合描述智慧，也更容易为现代读者理解。
- source_word: εἰρηνική
  choice: 爱好和平
  rationale: 表达主动倾向和平的品格，而不只是处于安静、平和的状态。
- source_word: ἐπιεικής
  choice: 温和
  rationale: 简明传达温柔、宽厚、不苛刻的伦理含义；该词所含的体谅与让步意味由语境承载。
- source_word: εὐπειθής
  choice: 乐于听从
  rationale: 该罕见形容词表示愿意听取、接受合理劝导而不固执；此译法避免把它误解为轻信或盲从。
- source_word: μεστὴ ἐλέους
  choice: 满有怜悯
  rationale: 保留μεστή所表达的充满和丰盛，也符合现代中文的庄重表达。
- source_word: καρπῶν ἀγαθῶν
  choice: 美善的果子
  rationale: 保留原文复数“果子”的结果隐喻，不将其限定解释为“善行”；“美善”体现ἀγαθῶν的道德价值。
- source_word: ἀδιάκριτος
  choice: 不偏不倚
  rationale: 在怜悯、善果和真诚等伦理特质的语流中，可理解为不偏待人；但该词也可能表示不分裂或不疑惑，因此以脚注保存歧义。
- source_word: ἀνυπόκριτος
  choice: 真诚无伪
  rationale: 直接表达没有假冒、伪善或虚假的意思，既自然又保留该词的否定性语义。
theological_decisions:
- issue: ἀδιάκριτος的解释
  choice: 不偏不倚
  alternative: 专一而不分裂；毫不疑惑或动摇
  rationale: 雅各书2:1–4对偏待人的责备支持“不偏不倚”，而1:6–8及4:8关于疑惑和心怀二意的论述也使“不分裂”或“不疑惑”具有语境依据。正文采用较符合本节社会伦理品格清单的译法，同时用脚注保留真实的词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“从上头来的”保留原文隐喻；并列成分尽量简洁、有节奏。脚注标记紧随其实际对应的“不偏不倚”，而不是置于“纯洁”之后。
