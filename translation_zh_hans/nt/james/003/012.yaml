  text: μὴ δύναται, ἀδελφοί μου, συκῆ ἐλαίας ποιῆσαι ἢ ἄμπελος σῦκα; ⸂οὔτε ἁλυκὸν⸃ γλυκὺ ποιῆσαι ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/012.yaml
  text: My brothers[a], can a fig tree produce olives[c][b], or a grapevine figs? Neither can salt water produce fresh water.
translation:
  language: zh_hans
  text: 我的弟兄们[a]，无花果树能结出橄榄吗？葡萄树能结出无花果吗？咸水也不能产生淡水[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的弟兄姊妹们”。希腊文直译为“弟兄们”，使用阳性复数形式，也可用来称呼男女混合的群体。
    reason: lexical_alternative
  - marker: b
    text: “淡水”直译为“甜水”；这里与咸水相对，意思是“淡水”。
    reason: lexical_alternative
  - marker: c
    text: 希腊文末句有所省略。正文将“咸的”补作“咸水”；若承接上一节泉源的意象，也可理解为“咸泉不能涌出淡水”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφοί μου
  choice: 我的弟兄们
  rationale: 保留希腊文阳性复数呼语的形式；在本信的语境中，这一称呼可以面向整个群体，因此以脚注说明包容性译法。
- source_word: μὴ δύναται
  choice: 能……吗？
  rationale: μή引导的反问预期否定回答；现代汉语用“能……吗”自然地保留反问力度。
- source_word: συκῆ
  choice: 无花果树
  rationale: 该词指树木而非果实，译作“无花果树”准确且自然。
- source_word: ἐλαίας ποιῆσαι
  choice: 结出橄榄
  rationale: ποιέω在果树语境中表示产出果实；汉语通常说树“结出”果实。
- source_word: ἄμπελος
  choice: 葡萄树
  rationale: 明确指结葡萄的藤本植物；“葡萄树”是普通现代汉语中自然易懂的表达。
- source_word: σῦκα
  choice: 无花果
  rationale: 直接表达该复数果实名词；汉语名词在此无需另行标示复数。
- source_word: οὔτε ἁλυκὸν
  choice: 咸的也不能
  rationale: ἁλυκόν是形容词名词化用法，原文省略了所指之物。正文以“咸的”保留这种压缩和歧义，不擅自限定为咸水或咸泉。
- source_word: γλυκὺ ποιῆσαι ὕδωρ
  choice: 产生淡水
  rationale: γλυκύς字面为“甜”，用于水时与咸水相对，现代汉语通常表达为“淡水”；“产生”对应ποιέω，同时适用于水或泉的理解。
theological_decisions:
- issue: 末句中ἁλυκόν所指对象的省略
  choice: 正文译作“咸的”，保留名词化形容词及原文省略
  alternative: “咸水不能产生淡水”或“咸泉不能涌出淡水”
  rationale: 原文没有明说ἁλυκόν修饰“水”还是承接上一节的“泉源”。不在正文中补定对象，可保留真实的语法歧义；脚注列出两种合乎上下文的理解。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“结出”符合汉语描述果树结果的习惯；末句刻意保留希腊文的省略结构，并借脚注解释可能的补足方式。
