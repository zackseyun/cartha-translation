  text: Does a spring pour out both sweet and bitter water from the same opening?[a]
translation:
  language: zh_hans
  text: 难道泉会从同一个泉眼涌出甜水和苦水吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译：难道泉会从同一个孔口涌出“甜的”和“苦的”吗？原文这两个形容词作名词使用，所指为水。
    reason: 保留ὀπή较字面的“孔口”，并说明希腊文名词化形容词的用法。
lexical_decisions:
- source_word: μήτι
  choice: 会……吗？
  rationale: μήτι引出预期否定回答的反问。现代汉语用“会……吗？”能自然表达这种反问语气，无须添加生硬的否定附加问句。
- source_word: ἡ πηγή
  choice: 泉水
  rationale: πηγή指天然涌水之泉；此处用“泉水”作主语，既符合现代汉语习惯，也保留水源的意象。
- source_word: ἐκ τῆς αὐτῆς ὀπῆς
  choice: 从同一个泉眼
  rationale: ὀπή本义为孔口或开口。在泉水语境中，“泉眼”是自然准确的汉语表达，比“孔口”更符合实际意象。
- source_word: βρύει
  choice: 涌出
  rationale: βρύω表示涌流、喷涌；“涌出”简洁地保留泉水从出口流出的动态画面。
- source_word: τὸ γλυκύ
  choice: 甜水
  rationale: γλυκύ为名词化形容词，字面意为“甜的”，所指的“水”由语境省略。译作“甜水”既明确又保留与“苦水”的直接对照。
- source_word: τὸ πικρόν
  choice: 苦水
  rationale: πικρόν为名词化形容词，意为“苦的”；补出“水”符合现代汉语，并与“甜水”形成整齐对照。
