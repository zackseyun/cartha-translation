id: JAS.3.2
reference: James 3:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: πολλὰ γὰρ πταίομεν ἅπαντες. εἴ τις ἐν λόγῳ οὐ πταίει, οὗτος τέλειος ἀνήρ, δυνατὸς χαλιναγωγῆσαι καὶ ὅλον τὸ σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/002.yaml
  text: For we all stumble in many ways[a]. If anyone does not stumble in word, this one is a mature man[c][b], able also to bridle the whole body.
translation:
  language: zh_hans
  text: 因为我们都在许多方面跌倒[a]。若有人在言语上不跌倒[b]，这样的人就是成熟的人[c]，也能驾驭整个身体。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “跌倒”在这里是比喻说法，指犯错或有过失。
    reason: metaphor_clarification
  - marker: b
    text: 原文直译为“在话语中”，意思是在说话或所说的话上。
    reason: lexical_alternative
  - marker: c
    text: “成熟”也可译作“完全”或“完美”。原文此处用“男子”一词，在这里用于普遍性的陈述。
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: πολλὰ
  choice: 在许多方面
  rationale: 此处为中性复数作副词用，表示“在许多方面／许多情形中”，而不是把“许多事”当作直接宾语。
- source_word: γὰρ
  choice: 因为
  rationale: 承接并说明上文对作教师者的警告；“因为”清楚表达其解释和论证作用。
- source_word: πταίομεν / πταίει
  choice: 跌倒
  rationale: 保留原文由实际绊跌引申为言行过失的比喻，不直接窄化为“犯罪”或泛化为“失败”。
- source_word: ἅπαντες
  choice: 我们众人
  rationale: 表达强调性的全体范围，也保留作者把自己包括在内的语气。
- source_word: εἴ τις
  choice: 若有人
  rationale: 自然表达不定条件，适用于任何人。
- source_word: ἐν λόγῳ
  choice: 在言语上
  rationale: λόγος在此指人的言说；这一译法既自然，又保留原文概括性的范围。
- source_word: οὗτος
  choice: 这样的人
  rationale: 保留指示词对前述假设之人的强调，同时符合现代汉语表达。
- source_word: τέλειος
  choice: 成熟
  rationale: 在本段伦理语境中指品格达到完整、成熟；避免“完美”在现代汉语中容易产生绝无过失的含义，同时以脚注保留词义张力。
- source_word: ἀνήρ
  choice: 人
  rationale: 原词形式上指成年男子，但在这一普遍性判断中具有代表性用法；正文用自然的泛指表达，脚注说明原文形式。
- source_word: δυνατὸς
  choice: 能
  rationale: 直接表达能力或胜任。
- source_word: χαλιναγωγῆσαι
  choice: 勒住
  rationale: 保留以辔头约束、驾驭的形象，并与下文马嚼环的比喻衔接。
- source_word: καὶ
  choice: 也
  rationale: 表达从约束言语进一步推及约束全身的附加关系。
- source_word: ὅλον τὸ σῶμα
  choice: 全身
  rationale: 简洁对应原文“整个身体”，在语境中涵盖人的全部行动。
theological_decisions:
- issue: τέλειος在伦理语境中的含义
  choice: 译作“成熟”
  alternative: “完全”或“完美”
  rationale: 雅各书以该词表达完整、成熟的品格（参1:4）；紧邻的“我们众人都会跌倒”使绝对无罪的理解不大可能。但脚注保留“完全／完美”的词义可能性，不消除原文张力。
- issue: ἀνήρ的代表性阳性表达
  choice: 正文译作泛指的“人”，脚注注明原文为“男子”
  alternative: 正文译作“男子”或“男人”
  rationale: 条件句“若有人”表明论断普遍适用。现代汉语若直译“成熟的男子”容易被理解为只针对男性，因此正文采用泛指，同时以脚注保留原文的阳性形式。
- issue: “勒住全身”的伦理含义
  choice: 保留驾驭牲畜的比喻，不释义为抽象的“控制”
  alternative: “控制全身”或“管束全身”
  rationale: 原文使用与辔头有关的动词，并引向下文的马匹意象；保留比喻可呈现言语自制与全人自制之间的关联，而不另加神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“在言语上”保持经文语体但不古奥；“勒住全身”刻意保留原文辔头意象。标点和代词安排使句子适合公开诵读。
