id: JAS.3.9
reference: James 3:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐν αὐτῇ εὐλογοῦμεν τὸν ⸀κύριον καὶ πατέρα, καὶ ἐν αὐτῇ καταρώμεθα τοὺς ἀνθρώπους τοὺς καθ’ ὁμοίωσιν θεοῦ γεγονότας·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/009.yaml
  text: With it we bless the Lord and Father[b][a], and with it we curse people who have been made according to the likeness of God.
translation:
  language: zh_hans
  text: 我们用舌头颂赞主和父[a]，也用舌头咒诅那些照着上帝的样式受造的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主和父”也可理解为“主，就是父”；原文既可能是同位表达，也可能是对上帝的两个并列称谓。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν αὐτῇ
  choice: 用舌头
  rationale: 阴性代词承接上文的“舌头”；汉语明确补出所指，比直译“用它”更自然，也准确表达工具意义。
- source_word: εὐλογοῦμεν
  choice: 颂赞
  rationale: 此处受词是上帝，意为向上帝称颂；“颂赞”既保留祝颂用语的庄重感，也符合现代汉语表达。
- source_word: τὸν κύριον καὶ πατέρα
  choice: 主和父
  rationale: 贴近并列结构，不擅自断定“父”是对“主”的同位解释，保留原文可能的语法张力。
- source_word: καταρώμεθα
  choice: 咒诅
  rationale: 直接呈现与“颂赞”相反的言语行为及其强烈道德分量。
- source_word: τοὺς ἀνθρώπους
  choice: 人
  rationale: 原词在此泛指全人类；现代汉语“人”自然且不限定性别。
- source_word: καθ’ ὁμοίωσιν θεοῦ
  choice: 照着上帝的样式
  rationale: 保留 καθ’ 的对应、规范意味，并呼应创造叙事中的“样式”用语。
- source_word: γεγονότας
  choice: 受造
  rationale: 完成时分词指向已经形成且持续有效的状态；在上帝样式的创造语境中，“受造”自然表达隐含的神圣施事者。
theological_decisions:
- issue: “主和父”的关系
  choice: 主和父
  alternative: 主，就是父；主和那位父
  rationale: 原文可将两个称谓理解为同位关系，也可视为成对称谓；正文保留简洁并列，脚注说明歧义，不强行消解。
- issue: ἀνθρώπους 的泛指范围
  choice: 人
  alternative: 人类；众人
  rationale: 经文所指是所有照上帝样式受造的人，并非仅指男性；“人”在现代汉语中准确涵盖全人类。
- issue: γεγονότας 的创造含义
  choice: 受造
  alternative: 成为；被造成
  rationale: “受造”切合创世背景和结果状态，但不进一步加入原文未明说的创造方式或时间。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“舌头”从上文补出，使代词所指清楚；“颂赞／咒诅”保持鲜明对照；“照着上帝的样式受造”保留创造语汇及神学张力。
