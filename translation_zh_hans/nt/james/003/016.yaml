id: JAS.3.16
reference: James 3:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅπου γὰρ ζῆλος καὶ ἐριθεία, ἐκεῖ ἀκαταστασία καὶ πᾶν φαῦλον πρᾶγμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/016.yaml
  text: For where jealousy and selfish ambition are[b][a], there is disorder and every vile practice.
translation:
  language: zh_hans
  text: 因为哪里有嫉妒[a]和自私的野心，哪里就有混乱和一切卑劣的事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “嫉妒”也可译作“妒忌”。原词还可表示“热心”，但这里的上下文显然是负面的。
    reason: lexical_alternative
  - marker: b
    text: 或译“一切恶行”或“各种恶事”。直译为“一切卑劣的事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ... ἐκεῖ
  choice: 哪里……哪里就……
  rationale: 保留原文相互呼应的处所结构，同时在现代汉语中自然地表达普遍性的因果情形。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文，对前述属地智慧所结的恶果作出解释。
- source_word: ζῆλος
  choice: 嫉妒
  rationale: 该词也可指“热心”，但本节承接3:14的“苦毒的嫉妒”，语境明确要求负面意义；“嫉妒”是现代汉语中清楚、自然的恶德用语。
- source_word: ἐριθεία
  choice: 自私的野心
  rationale: 表达为谋求个人利益而争竞、自我抬举的动机，兼顾该词所含的自利与争竞色彩。
- source_word: ἀκαταστασία
  choice: 混乱
  rationale: 指失序、动荡的状态；“混乱”适合本段所关注的群体关系后果。
- source_word: πᾶν φαῦλον πρᾶγμα
  choice: 一切卑劣的事
  rationale: 较贴近原文“一切/每一件卑劣之事”的表述，既保留概括性，也传达 φαῦλον 的道德贬义，而不把 πρᾶγμα 过度限定为某一种行为。
theological_decisions:
- issue: ζῆλος在本节中的道德性质
  choice: 按负面恶德译为“嫉妒”
  alternative: 按中性或正面意义译为“热心”；或译“妒忌”
  rationale: 3:14—15将这种ζῆλος与自私争竞及属地、属情欲、属鬼魔的智慧相连，因此不能在此译成正面的“热心”；“妒忌”则是可接受的同义表达。
- issue: πᾶν φαῦλον πρᾶγμα的范围
  choice: 译为“一切卑劣的事”
  alternative: 译为“一切恶行”或“各种恶事”
  rationale: 原文用宽泛的πρᾶγμα，并未只限定为惯常行为；采用“事”可保留其范围，而“卑劣”体现φαῦλον的道德低劣含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“哪里……哪里就……”保留原文警句式的对应结构；“自私的野心”明确表达自利争竞，不加入宗派性解释。
