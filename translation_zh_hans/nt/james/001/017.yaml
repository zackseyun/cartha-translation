base_translation:
  language: en
  yaml_path: translation/nt/james/001/017.yaml
  text: Every good gift and every perfect gift is from above[a], coming down from the Father of lights[b], with whom there is no variation or shadow of turning.
translation:
  language: zh_hans
  text: 一切美好的赐予和一切完美的礼物[a]，都是从上头来的，是从众光之父那里降下来的；在他那里没有变化，也没有转动的阴影[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一切美好的礼物和一切完美的恩赐。”第一个名词可以侧重赐予的行动，也可以指所给的礼物；第二个名词更侧重所赐之物。
    reason: lexical_alternative
  - marker: b
    text: 或译：“也没有因转动而产生的阴影”或“也没有变动的影子。”这句话很可能让人想到天上众光在运行时所伴随的变化和阴影。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσα δόσις ἀγαθὴ
  choice: 各样美好的给予
  rationale: δόσις既可指给予的行动，也可指所给之物。译作“给予”保留它与随后δώρημα“恩赐”的词义区别；“各样”自然表达Πᾶσα的分配意义。
- source_word: πᾶν δώρημα τέλειον
  choice: 各样完美的恩赐
  rationale: δώρημα侧重所赐之物；“恩赐”在庄重而现代的中文中自然。τέλειον可表达完整、毫无欠缺，译作“完美”保留原文力度。
- source_word: ἄνωθέν ἐστιν, καταβαῖνον
  choice: 都是从上面……降下来的
  rationale: 合并系词结构与现在分词，使中文流畅，同时保留“从上面”这一来源和“降下”这一动态意象。
- source_word: ἀπὸ τοῦ πατρὸς τῶν φώτων
  choice: 从众光之父那里
  rationale: 保留“光”与“父”的原文隐喻，不在正文中直接限定为天体；“众光”自然暗示多重受造之光。
- source_word: παρ’ ᾧ οὐκ ἔνι παραλλαγὴ
  choice: 在他那里没有变化
  rationale: παρ’ ᾧ表达与他同在或在他那里；παραλλαγή译作“变化”，清楚而不失与天体变动意象的联系。
- source_word: ἢ τροπῆς ἀποσκίασμα
  choice: 也没有转动造成的阴影
  rationale: 在否定句中将ἢ自然译作“也没有”；属格τροπῆς可表示与转动相关或由转动造成，正文采用自然中文，同时用脚注保留另一种较形式对应的理解。
theological_decisions:
- issue: “众光之父”的意象与神的不改变
  choice: 保留“众光之父”及没有变化和阴影的具体意象
  alternative: 把“众光”明确解释为日月星辰，并把末句概括为“他永不改变”
  rationale: 原文借会转动、会产生变化阴影的光体与神形成对照。正文应保留这种诗性意象和神学张力，而不以抽象教义释义取代它。
- issue: δόσις与δώρημα的关系
  choice: 分别译为“给予”和“恩赐”
  alternative: 两者都译为“礼物”或“恩赐”
  rationale: 分别翻译可体现前者可能侧重给予行动、后者侧重所赐之物；脚注说明前者也可理解为具体礼物，避免把有意歧义绝对化。
translation_notes:
  register: 采用现代、庄重且可朗读的简体中文。“各样”保留原文两次πᾶς的排比；分号划分恩赐来源与神不改变的陈述。未把“众光”在正文中解释为特定天体，也未将末句抽象改写为教义性措辞。
