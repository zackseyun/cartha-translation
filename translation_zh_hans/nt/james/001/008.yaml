  text: ἀνὴρ δίψυχος, ἀκατάστατος ἐν πάσαις ταῖς ὁδοῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/008.yaml
  text: a double-minded man[a], unstable in all his ways.
translation:
  language: zh_hans
  text: 一个心怀二意的人[a]，在他所行的一切道路上都摇摆不定。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文为阳性单数，但这里很可能是泛指，代表任何这样的人，并非只指男性。
    reason: 说明原文的语法性别及其代表性用法。
lexical_decisions:
- source_word: ἀνὴρ
  choice: 人
  rationale: 这里是阳性单数，但承接上文泛指求告者；现代汉语用“人”既自然，也能表达其代表性，而不把经文误解为只限男性。
- source_word: δίψυχος
  choice: 心怀二意
  rationale: 该词字面含有“有两个魂/心”的意象，表示内心分裂、忠诚不专并因而摇疑；“心怀二意”是自然且庄重的汉语表达。
- source_word: ἀκατάστατος
  choice: 摇摆不定
  rationale: 在此描述缺乏稳定、一贯的状态；“摇摆不定”既呼应上文的疑惑，也避免把词义过度解释成社会秩序方面的“混乱”。
- source_word: ἐν πάσαις ταῖς ὁδοῖς αὐτοῦ
  choice: 在他所行的一切道路上
  rationale: 保留“道路”的比喻，指一个人生活与行为的各方面；此译比直接释作“所作所为”更贴近原文意象。
theological_decisions:
- issue: 阳性单数表达的代表性
  choice: 正文译作“人”，并保留单数代词“他”
  alternative: 译作“男人”，或完全改用无性别代词结构
  rationale: 希腊文采用阳性单数，但语境中的指称具有代表性，并非把这项警告限制于男性。汉语“人”准确传达泛指意义，而“他”保留单数衔接；脚注说明原文形式，以免隐藏其语法特征。
- issue: δίψυχος所表达的内在分裂
  choice: 译作“心怀二意”
  alternative: 译作“有两个心的人”或“内心分裂”
  rationale: “心怀二意”保留人在信靠上不专一、摇疑的张力，却不进一步断定这种分裂的具体神学对象或成因。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“心怀二意”与“摇摆不定”读来顺畅，并保留“道路”这一圣经中常见的生活比喻。
