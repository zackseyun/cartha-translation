id: JAS.1.6
reference: James 1:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: αἰτείτω δὲ ἐν πίστει, μηδὲν διακρινόμενος, ὁ γὰρ διακρινόμενος ἔοικεν κλύδωνι θαλάσσης ἀνεμιζομένῳ καὶ ῥιπιζομένῳ·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/006.yaml
  text: But let him ask in faith[a], doubting nothing, for the one who doubts is like a wave of the sea, driven by the wind and tossed about.
translation:
  language: zh_hans
  text: 但他要凭着信心[a]祈求，丝毫不要疑惑；因为疑惑的人就像海里的波浪，被风吹动，翻腾不定。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“怀着信靠的心”。这里的“信心”含有信赖、倚靠神的意思。
    reason: 保留 πίστις 在本语境中“信靠”的词义色彩，同时不取代主文较通行的“信心”。
lexical_decisions:
- source_word: αἰτείτω
  choice: 要……祈求
  rationale: 第三人称现在时命令语气，承接上一节向神求智慧的语境；“要……祈求”自然表达劝勉和持续祈求之意。
- source_word: δὲ
  choice: 但
  rationale: 表示与上一节应许之间的轻微转折：神固然赐下，祈求者却应当凭信心求。
- source_word: ἐν πίστει
  choice: 凭着信心
  rationale: 既保留 πίστις 的“信心”用语，也以现代汉语自然表达祈求时信靠神的方式或状态。
- source_word: μηδὲν διακρινόμενος
  choice: 丝毫不要疑惑
  rationale: διακρίνομαι 在此指内心迟疑、摇摆；“丝毫不要”准确体现 μηδέν 的全称否定，同时符合汉语表达。
- source_word: ὁ γὰρ διακρινόμενος
  choice: 因为疑惑的人
  rationale: 将实词化分词作泛指处理，不添加原文并未强调的性别限定，并重复“疑惑”以保留原文词汇呼应。
- source_word: ἔοικεν κλύδωνι θαλάσσης
  choice: 就像海里的波浪
  rationale: κλύδων 指海上的涌浪或波涛；此译清楚、形象，且适合普通现代读者。
- source_word: ἀνεμιζομένῳ
  choice: 被风吹动
  rationale: 保留被动含义及风力作用的意象，不额外强化为原文未明说的特定方向。
- source_word: ῥιπιζομένῳ
  choice: 翻腾不定
  rationale: 表达受风搅动、摇荡的动态与不稳定性；与“被风吹动”并列而不作生硬重复。
theological_decisions:
- issue: πίστις 在祈求语境中的译法
  choice: 信心
  alternative: 信靠
  rationale: 主文采用圣经汉语中通行且具有神学连续性的“信心”；此处确有倚靠、信赖神的语义色彩，因此以脚注保留“信靠”这一可行理解。
- issue: διακρινόμενος 的语义
  choice: 疑惑
  alternative: 摇摆不定
  rationale: 上下文强调祈求者对神的迟疑，故“疑惑”最直接；随后的波浪比喻也带出摇摆不定的结果，但不宜在主文首处将该词只解释成情绪或意志不坚定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“凭着信心祈求”承接上一节向神求智慧的语境；后半句保持海浪受风搅动的鲜明意象。脚注标记[a]已在主文对应出现。
