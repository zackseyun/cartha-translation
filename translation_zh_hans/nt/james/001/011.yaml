id: JAS.1.11
reference: James 1:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀνέτειλεν γὰρ ὁ ἥλιος σὺν τῷ καύσωνι καὶ ἐξήρανεν τὸν χόρτον, καὶ τὸ ἄνθος αὐτοῦ ἐξέπεσεν καὶ ἡ εὐπρέπεια τοῦ προσώπου αὐτοῦ ἀπώλετο· οὕτως καὶ ὁ πλούσιος ἐν ταῖς πορείαις αὐτοῦ μαρανθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/011.yaml
  text: For the sun rose with its scorching heat and dried up the grass[a], and its flower fell off and the beauty of its appearance perished[b]; so also the rich man will wither away in the midst of his pursuits.
translation:
  language: zh_hans
  text: 因为太阳升起，伴着灼热[a]，使草枯干；草上的花凋落了，它美丽的容貌也消失了。同样，富足的人也会在他所行的路上[b]衰残。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灼热”也可译作“热风”；希腊词可指炙热，在某些语境中也指伴随炙热而来的热风。
    reason: lexical_alternative
  - marker: b
    text: “所行的路上”也可译作“在他的行程中”。希腊词既可指实际的旅程，也可较广义地指一个人的活动历程。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέτειλεν
  choice: 升起
  rationale: 以简明过去性叙述呈现不定过去时在比喻中的生动画面；现代汉语不必另加时态助词。
- source_word: σὺν τῷ καύσωνι
  choice: 带着灼热
  rationale: καύσων可指炙热，也可指带来热气的热风；正文采用较宽泛的“灼热”，并以脚注保留“热风”的可能。
- source_word: ἐξήρανεν τὸν χόρτον
  choice: 使草枯干
  rationale: 既表达热力使植物干枯的具体结果，也保持与后文“衰残”的植物意象。
- source_word: τὸ ἄνθος αὐτοῦ ἐξέπεσεν
  choice: 草上的花凋落
  rationale: αὐτοῦ回指草；“凋落”自然表达花从草上落下，同时保留衰败的画面。
- source_word: ἡ εὐπρέπεια τοῦ προσώπου αὐτοῦ
  choice: 花容的美丽
  rationale: πρόσωπον字面为“面貌”；“花容”既保留面貌意象，又符合现代汉语对花之外观的表达。
- source_word: ἀπώλετο
  choice: 消逝了
  rationale: 此处指花之外在美丽消失；“消逝”比“灭亡”更贴合所修饰的抽象名词。
- source_word: ὁ πλούσιος
  choice: 富足的人
  rationale: 希腊文阳性单数在此是代表性称谓；汉语“富足的人”自然且不额外限定性别，同时保留单数类别指称。
- source_word: ἐν ταῖς πορείαις αὐτοῦ
  choice: 在他奔波经营时
  rationale: πορεία本可指行程，也可延伸指一连串活动；“奔波经营”兼顾行走动态与现实事务，但以脚注保留“行程”的字面可能。
- source_word: μαρανθήσεται
  choice: 会……衰残
  rationale: 延续植物枯萎的比喻，也适用于人；“衰残”表达逐渐失去荣盛的未来结局。
theological_decisions:
- issue: ὁ πλούσιος的性别与代表范围
  choice: 富足的人
  alternative: 富足的男人／富足者
  rationale: 原文使用阳性单数作代表性人物，并非明确把警告限于男性；现代汉语无须添加“男人”，而“富足的人”仍保持单数类别指称。
- issue: πορείαις所指的范围
  choice: 奔波经营
  alternative: 行程／所行的路／各种活动
  rationale: 原词可直指旅行，也可指人的活动历程。正文避免将警告缩窄为字面旅行或单指商业活动，脚注则明示词义张力。
- issue: 富足者衰残的意象
  choice: 会在他奔波经营时衰残
  alternative: 会在他的行程中枯萎
  rationale: 保留本节由草木转用于富足者的枯萎意象，不把它进一步解释为死亡、审判或财富损失，从而避免超出原文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式保留原文连续推进的枯萎图景；“花容的美丽”略带文学色彩，但语义透明。“奔波经营”不专指经商，而表示富足者忙于其各样事务。
