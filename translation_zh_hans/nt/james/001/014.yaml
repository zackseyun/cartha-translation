  text: ἕκαστος δὲ πειράζεται ὑπὸ τῆς ἰδίας ἐπιθυμίας ἐξελκόμενος καὶ δελεαζόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/014.yaml
  text: But each one is tempted by his own desire[b][a], being drawn away and enticed.
translation:
  language: zh_hans
  text: 但每个人受诱惑，都是被自己的欲望[a]牵引、诱骗的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “欲望”也可译作“贪欲”或“强烈的渴望”。希腊词可泛指强烈欲望，并不只指性欲。
    reason: lexical_alternative
  - marker: b
    text: “牵引、诱骗”这一对词带有猎物被引出、鱼儿被饵引诱的形象。
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστος
  choice: 每个人
  rationale: 保留希腊文逐一指向个体的分配意义，同时符合现代汉语表达。
- source_word: δὲ
  choice: 但
  rationale: 承接第13节，标明轻微对比：诱惑并非来自上帝，而与各人自己的欲望有关。
- source_word: πειράζεται
  choice: 受诱惑
  rationale: 在第13—15节的语境中，此词指引诱人犯罪，而非一般意义上的考验。
- source_word: ὑπὸ τῆς ἰδίας ἐπιθυμίας
  choice: 被自己的欲望
  rationale: “自己的”保留归属于当事人的强调；“欲望”涵盖面较广，不把词义局限于性欲。被动结构也反映ὑπό所标示的作用来源。
- source_word: ἐξελκόμενος
  choice: 牵引
  rationale: 保留被拉出、引离的动态意象，又避免用“拖走”过度加强语气。
- source_word: δελεαζόμενος
  choice: 诱惑
  rationale: 自然表达以诱饵引诱的含义；具体的捕猎或捕鱼意象在脚注中说明。
theological_decisions:
- issue: 诱惑的直接来源及其与上帝的关系
  choice: 按经文将人受诱惑与其自己的欲望直接相连。
  alternative: 淡化为人受到外在环境的一般考验。
  rationale: 紧接第13节否认上帝诱惑人；本节则指出诱惑在人里面发挥作用的直接来源，但不据此扩展经文未说明的完整因果论。
- issue: 代表性单数的汉语表达
  choice: 译作“每个人……自己的”，以自然汉语保持个体化和反身归属。
  alternative: 译作“各人……他自己的”。
  rationale: 汉语“自己的”已经清楚回指“每个人”，无需添加有性别色彩且较生硬的“他”，同时仍保留希腊文单数及个人责任的重点。
- issue: 两个现在时被动分词的关系
  choice: 并列译作“牵引、诱惑”，共同说明受诱惑的过程。
  alternative: 将其中一个明确处理为先于另一个发生的阶段。
  rationale: 原文并未明说严格的先后次序；并列翻译保留两幅相互关联的意象和语法张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“每个人”保持逐一个体的强调；两个动词简洁并列，使句子自然，同时以脚注补足原文的诱饵意象。所有脚注标记均已置于正文对应位置。
