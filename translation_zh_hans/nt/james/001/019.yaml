  text: ⸀Ἴστε, ἀδελφοί μου ἀγαπητοί. ἔστω ⸀δὲ πᾶς ἄνθρωπος ταχὺς εἰς τὸ ἀκοῦσαι, βραδὺς εἰς τὸ λαλῆσαι, βραδὺς εἰς ὀργήν,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/019.yaml
  text: 'Know this[a], my beloved brothers: let every man be quick to hear, slow to speak, slow to anger[c][b],'
translation:
  language: zh_hans
  text: 你们要知道[a]，我亲爱的弟兄们[b]：每个人[c]都要快快地听，慢慢地说，慢慢地动怒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你们要知道”也可译作“你们知道”；希腊语动词在这里既可能是命令式，也可能是陈述式。
    reason: alternative_reading
  - marker: b
    text: “弟兄们”在这里很可能是对全体信徒的称呼，包括弟兄和姊妹。
    reason: audience_clarification
  - marker: c
    text: “每个人”也可译作“人人”；希腊语用阳性单数形式泛指任何人。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἴστε
  choice: 你们要知道这一点
  rationale: 该形式在此可理解为命令式“要知道”，也可理解为陈述式“你们知道”。正文按劝勉语境取命令式；“这一点”是为衔接下文而作的自然补充。
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: 我亲爱的弟兄们
  rationale: 保留ἀδελφοί的阳性复数形式及ἀγαπητοί所表达的亲爱之意；此称呼在当时可包括整个信徒群体，另以脚注说明。
- source_word: ἔστω δὲ πᾶς ἄνθρωπος
  choice: 每个人……要
  rationale: ἔστω是第三人称命令式，以汉语“要”表达劝勉；δέ在这里是轻微的承接词，汉语中不必硬译为强烈转折。πᾶς ἄνθρωπος在此具有泛指意义，译作自然且准确的“每个人”。
- source_word: ταχὺς εἰς τὸ ἀκοῦσαι
  choice: 听要快
  rationale: 保留“快”与下文两个“慢”的鲜明对照，同时用简洁、自然的汉语表达乐于并及时聆听。
- source_word: βραδὺς εἰς τὸ λαλῆσαι
  choice: 说要慢
  rationale: 直接保留“慢”与“说”的组合，并与“听要快”形成平行句式；含有说话谨慎、不急于发言之意。
- source_word: βραδὺς εἰς ὀργήν
  choice: 动怒也要慢
  rationale: ὀργή在此指愤怒；“动怒”比“发义怒”或“震怒”更符合语境。“也”凸显原文连续两个βραδύς所形成的平行关系。
theological_decisions:
- issue: 开头Ἴστε的语气
  choice: 按命令式译为“你们要知道这一点”
  alternative: 按陈述式译为“我亲爱的弟兄们，你们知道这一点”
  rationale: 上下文是一连串劝勉，命令式理解与随后ἔστω的命令语气衔接顺畅；但希腊语形式容许陈述式理解，因此在脚注保留该歧义。
- issue: ἀδελφοί与πᾶς ἄνθρωπος的性别涵盖范围
  choice: 称呼译作“弟兄们”，泛指表达译作“每个人”
  alternative: 称呼可意译为“弟兄姊妹们”；πᾶς ἄνθρωπος也可译作“人人”
  rationale: “弟兄们”保留称呼的阳性复数形式，并以脚注说明其很可能包括姊妹；ἄνθρωπος在该结构中是泛指人类个体，现代汉语“每个人”既不缩小适用范围，也不增添原文没有的性别限定。
translation_notes:
  register: 采用现代、简洁而庄重的普通话。用“听要快，说要慢，动怒也要慢”再现原文“快—慢—慢”的三重平行结构；避免过度古雅的“敏于聆听、慎于言语”，也避免把“慢”解释性改写为正文中的特定行为规范。
