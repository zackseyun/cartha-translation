id: JAS.1.23
reference: James 1:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅτι εἴ τις ἀκροατὴς λόγου ἐστὶν καὶ οὐ ποιητής, οὗτος ἔοικεν ἀνδρὶ κατανοοῦντι τὸ πρόσωπον τῆς γενέσεως αὐτοῦ ἐν ἐσόπτρῳ,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/023.yaml
  text: For if anyone is a hearer of the word and not a doer, this one is like a man carefully looking at the face of his birth[a] in a mirror,
translation:
  language: zh_hans
  text: 因为，若有人是听道的人，却不是行道的人，这人就像一个男子，对着镜子仔细端详自己天生的面貌[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“他出生的脸”。这个希腊语短语也可理解为“他与生俱来的面貌”。
    reason: 保留 τὸ πρόσωπον τῆς γενέσεως αὐτοῦ 的字面形式及其较自然的语境含义。
lexical_decisions:
- source_word: ἀκροατὴς λόγου
  choice: 听道的人
  rationale: 以名词性短语保留“听者”的身份表述，并用“道”承接上下文中指向上帝所传之道的 λόγος。
- source_word: ποιητής
  choice: 行道的人
  rationale: 与“听道的人”构成清楚而自然的听与行之对照；补出“道”是汉语表达所需，并未另加新的宾语。
- source_word: ἔοικεν
  choice: 就像
  rationale: 自然表达该完成时形式在此处的现在意义，同时保留明喻结构。
- source_word: ἀνδρί
  choice: 一个男人
  rationale: 原文使用明确为阳性的 ἀνήρ，因此正文保留男性形象，而不改写为无性别的“一个人”。
- source_word: κατανοοῦντι
  choice: 仔细端详
  rationale: “端详”表达专注观察，“仔细”进一步体现 κατανοέω 在此不只是随意看一眼。
- source_word: τὸ πρόσωπον τῆς γενέσεως αὐτοῦ
  choice: 自己天生的面貌
  rationale: 以自然现代汉语表达“与出生相关的面貌”，同时用脚注保留原文较不寻常的属格措辞。
- source_word: ἐν ἐσόπτρῳ
  choice: 在镜子里
  rationale: 采用现代汉语对照镜观察这一动作的惯常说法。
theological_decisions:
- issue: ἀνδρί 的性别明确性与比喻的普遍适用性
  choice: 一个男人
  alternative: 一个人
  rationale: 原文在比喻中明确使用阳性名词 ἀνήρ，故保留男性人物；“若有人”已表明劝诫的适用范围不限于男性。
- issue: λόγος 在上下文中的所指
  choice: 道
  alternative: 话语；信息
  rationale: “道”既直接对应 λόγος，也与雅各书上下文中所领受、所听见并应当实行的上帝之道保持联系，而不进一步限定其神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“听道的人／行道的人”保留原文平行结构；“仔细端详”使镜中观察的动作清楚有力。
