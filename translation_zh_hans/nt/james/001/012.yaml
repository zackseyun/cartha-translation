id: JAS.1.12
reference: James 1:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Μακάριος ἀνὴρ ὃς ὑπομένει πειρασμόν, ὅτι δόκιμος γενόμενος λήμψεται τὸν στέφανον τῆς ζωῆς, ὃν ⸀ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/012.yaml
  text: Blessed is the man who endures trial[a], because after he has been approved, he will receive the crown of life[b], which he promised to those who love him.
translation:
  language: zh_hans
  text: 在试炼[a]中坚忍的人是有福的，因为他经过考验、得到认可之后，必领受生命的冠冕[b]，那是他应许给爱他之人的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “试炼”也可译作“试探”或“考验”。希腊词可涵盖这几层意思；本节语境侧重在考验中坚忍。
    reason: lexical_alternative
  - marker: b
    text: 这里的“冠冕”可指比赛得胜者所得的花冠，并不一定是君王所戴的王冠。
    reason: cultural_note
lexical_decisions:
- source_word: Μακάριος
  choice: 有福的
  rationale: 保留祝福宣告的语气和神学分量，比“快乐”更贴近原文，也符合现代中文圣经语体。
- source_word: ἀνὴρ
  choice: 人
  rationale: 希腊文为阳性单数，但此处具有泛指作用；现代汉语的“人”自然涵盖任何符合所述情形的人，不必生硬地译作“男人”。
- source_word: ὑπομένει
  choice: 坚忍
  rationale: 表达在压力和苦难之下持续忍耐、坚定不移，不只是被动忍受。
- source_word: πειρασμόν
  choice: 试炼
  rationale: 本节的坚忍、考验与认可语境侧重人在患难或测试中的经历；同时以脚注保留“试探/考验”的语义可能。
- source_word: δόκιμος γενόμενος
  choice: 经过考验、得到认可之后
  rationale: 同时表达分词的时间关系，以及δόκιμος指经检验而获认可的含义，避免只译成一般性的“被认可”。
- source_word: λήμψεται
  choice: 必领受
  rationale: 准确表达将来时和接受所应许赏赐的意义；“必”自然体现此处应许的确定性。
- source_word: στέφανον
  choice: 冠冕
  rationale: 采用庄重且通行的中文表达；脚注说明它可指得胜者所得的花冠，并非必然指王冠。
- source_word: τῆς ζωῆς
  choice: 生命的
  rationale: 保留原文属格结构及其一定程度的含义开放性，不擅自明确为“就是生命”或“赐下生命”。
- source_word: ἐπηγγείλατο
  choice: 应许
  rationale: 符合该动词在神作主语时的常见中文表达，且保留原文简单过去时所指的既有应许。
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: 给那些爱他之人的
  rationale: 自然表达间接受词及现在分词所体现的持续、特征性的爱。
theological_decisions:
- issue: πειρασμός在本节的语义
  choice: 试炼
  alternative: 试探；考验
  rationale: 上下文强调坚忍、经受检验和领受冠冕，因此正文用“试炼”；但该词也能涉及诱惑犯罪的“试探”，故以脚注保留原文张力。
- issue: ἐπηγγείλατο隐含主语的识别
  choice: 主
  alternative: 他（不明确指出所指）
  rationale: 希腊文动词仅以第三人称单数形式表达主语，并未在本句明说其身份；语境和常见表述指向神或主。正文补出“主”使现代中文清楚，同时承认这是由语境确定的隐含主语。
- issue: “生命的冠冕”中属格的关系
  choice: 保留“生命的冠冕”
  alternative: 以生命为冠冕；赐生命的冠冕
  rationale: 原文τῆς ζωῆς可有同位、内容或关联等理解；直译结构能保存这种神学与语法上的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“在试炼中坚忍”比“忍受试炼”更能体现持续坚定；分号使应许关系清晰。所有脚注标记均置于正文对应词后。
