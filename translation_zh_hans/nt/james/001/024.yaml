  text: κατενόησεν γὰρ ἑαυτὸν καὶ ἀπελήλυθεν καὶ εὐθέως ἐπελάθετο ὁποῖος ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/024.yaml
  text: For he looked at himself and went away[a], and immediately forgot what kind of person he was.
translation:
  language: zh_hans
  text: 因为他端详了自己，离开之后，立刻忘了自己是什么样子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“自己是怎样的人。”希腊语表达侧重一个人属于怎样的类型或具有怎样的特质。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατενόησεν
  choice: 端详了
  rationale: κατανοέω可表示留意、观察或仔细察看。在照镜子的比喻中，“端详”既符合具体动作，也保留了他虽看过却很快忘记的反差。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ承接上文，为前一节的比喻作解释；“因为”在现代汉语中清楚自然地表达这一说明关系。
- source_word: ἑαυτὸν
  choice: 自己
  rationale: 原文直接使用反身代词，并未在本节重复“脸”；译作“自己”忠实于措辞，也与上文镜子的语境自然衔接。
- source_word: ἀπελήλυθεν
  choice: 转身离去
  rationale: ἀπέρχομαι意为离开、走开。其完成时形式在这里位于连续动作之中；汉语以“离去”自然表达动作，“转身”使照镜后离开的场景流畅，但不增添实质信息。
- source_word: εὐθέως
  choice: 随即
  rationale: εὐθέως强调动作紧接着发生；“随即”庄重而自然，准确传达即时性。
- source_word: ἐπελάθετο
  choice: 就忘了
  rationale: ἐπιλανθάνομαι表示忘记、不再记得；“忘了”是现代汉语中直接自然的对应，“就”与“随即”共同体现迅速发生。
- source_word: ὁποῖος ἦν
  choice: 自己原来是什么样子
  rationale: ὁποῖος指性质、样态或类别，而非单纯身份。“是什么样子”在镜子语境中自然，并保留它既可指所见样貌、也可引申为自己是怎样之人的开放性；“原来”对应回顾照镜时所见的状态。
theological_decisions:
- issue: 镜子比喻中阳性单数表达的泛指意义
  choice: 自己原来是什么样子
  alternative: 自己原来是怎样的人
  rationale: 原文虽采用阳性单数形式，但此处是代表所有听道而不行道之人的一般例子，并非专指男性。汉语用“自己”可准确保留泛指意义，避免无根据地限定性别。
- issue: ὁποῖος ἦν所指是外貌还是人的性质
  choice: 正文采用“是什么样子”，保留语义张力
  alternative: 明确译作“是怎样的人”或“长什么样”
  rationale: 在照镜子的直接语境中，这一表达可自然指所见的样子；在整段劝勉中，又可能带有对自身真实状况的更深含义。正文不把它限定为纯粹外貌或道德身份。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“端详—离去—忘了”的连续动作简洁有力；脚注标记置于其所解释的短语之后。
