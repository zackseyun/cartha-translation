  text: μηδεὶς πειραζόμενος λεγέτω ὅτι Ἀπὸ θεοῦ πειράζομαι· ὁ γὰρ θεὸς ἀπείραστός ἐστιν κακῶν, πειράζει δὲ αὐτὸς οὐδένα.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/013.yaml
  text: Let no one who is being tempted say[a], “I am being tempted by God,” for God is untemptable by evil, and he himself tempts no one.
translation:
  language: zh_hans
  text: 人在受诱惑时，不可说：“我是被上帝诱惑的。”因为上帝不受恶的诱惑[a]，而他自己不诱惑任何人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为上帝不能被恶诱惑。”原文较直译为：“上帝是不可被恶诱惑的。”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεὶς ... λεγέτω
  choice: 不可说
  rationale: 以现代汉语的禁止式表达第三人称命令；主语“人”与后面的情境短语结合，避免生硬直译为“不要让任何人说”。
- source_word: πειραζόμενος
  choice: 在受诱惑的时候
  rationale: 保留现在被动分词的受事与进行意味；本节语境涉及恶欲和犯罪，因此译为“受诱惑”，而非较宽泛的“受试验”。
- source_word: Ἀπὸ θεοῦ πειράζομαι
  choice: 我是被上帝诱惑的
  rationale: ἀπό在此表示来源或施事；用被动句清楚呈现说话者把诱惑归因于上帝的主张。
- source_word: ἀπείραστός ... κακῶν
  choice: 不受恶的诱惑
  rationale: 罕见形容词ἀπείραστός在上下文中指不受诱惑、不会被恶所引诱；“恶”自然表达中性复数κακῶν的集合或抽象意义。
- source_word: πειράζει
  choice: 诱惑
  rationale: 与本节前两处πειράζω保持词语呼应，并依据下文私欲与罪的语境表达引诱人作恶，而不是一般意义的试验。
- source_word: αὐτὸς οὐδένα
  choice: 他自己也不……任何人
  rationale: “他自己”保留αὐτός的强调，“任何人”与否定词搭配，自然表达οὐδένα。
theological_decisions:
- issue: 本节πειράζω词群的译法
  choice: 各处统一译为“诱惑”
  alternative: 译作“试验”，或在不同出现处分别译作“试探/诱惑”
  rationale: 紧接着的经文把过程关联于私欲和犯罪，本节所否定的是上帝引诱人行恶，并非否定圣经其他地方所说的考验；统一用“诱惑”也保留原文的重复。
- issue: ἀπείραστός ἐστιν κακῶν的含义
  choice: 上帝不受恶的诱惑
  alternative: 上帝不能被恶诱惑；上帝不曾经历恶；不可用恶试探上帝
  rationale: 原短语罕见且存在解释空间；此译采取最符合后句“他自己也不诱惑任何人”的语境含义，同时用“不受”而非绝对能力措辞，避免不必要地扩展原文论断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“人在……的时候，不可……”符合普通读者的阅读习惯；保留“诱惑”的三重词根呼应和“他自己”的强调。
