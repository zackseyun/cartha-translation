source:
  edition: SBLGNT
  text: Εἰ δέ τις ὑμῶν λείπεται σοφίας, αἰτείτω παρὰ τοῦ διδόντος θεοῦ πᾶσιν ἁπλῶς καὶ ⸀μὴ ὀνειδίζοντος, καὶ δοθήσεται αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/005.yaml
  text: But if any of you lacks wisdom[a], let him ask of God, who gives to all generously and without reproach[b], and it will be given to him.
translation:
  language: zh_hans
  text: 但你们中间若有人缺少智慧，就应当向那位慷慨赐给众人、又不责备人的上帝求；上帝必把智慧赐给他[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“他”是代表性单数，泛指你们中间任何一个人，并不限于男性。
    reason: cultural_note
lexical_decisions:
- source_word: Εἰ δέ
  choice: 但……若
  rationale: δέ承接上文并带有轻微转折；“但……若”在现代汉语中自然地保留这一连接作用。
- source_word: τις ὑμῶν
  choice: 你们中间若有人
  rationale: 保留不定代词与部分属格所表达的“你们当中的任何人”，同时维持直接的牧养语气。
- source_word: λείπεται σοφίας
  choice: 缺少智慧
  rationale: λείπεται在此表示有所欠缺；“缺少智慧”简洁自然，也不把σοφία过度限定为某一种具体能力。
- source_word: αἰτείτω παρὰ τοῦ ... θεοῦ
  choice: 就应当向……上帝求
  rationale: 第三人称命令式用“应当”表达劝勉和命令；παρά加属格在αἰτέω之后表示所求的对象或来源，汉语用“向……求”最自然。
- source_word: τοῦ διδόντος θεοῦ
  choice: 那位……赐给……的上帝
  rationale: 保留定冠词与现在分词对上帝持续性品格的描述，并使中文定语结构清楚流畅。
- source_word: πᾶσιν
  choice: 众人
  rationale: 保留πᾶσιν广泛而不特加限定的范围，不擅自缩窄为某一群体。
- source_word: ἁπλῶς
  choice: 慷慨
  rationale: 在赐予的语境中，ἁπλῶς最可能表示不吝惜、宽厚地给予；“慷慨”自然易懂，又不过度引申。
- source_word: μὴ ὀνειδίζοντος
  choice: 不责备人
  rationale: ὀνειδίζω可表示责难、斥责或使人蒙羞；“不责备人”准确而通俗，并保留上帝不因人的缺乏而羞辱求告者之意。
- source_word: δοθήσεται αὐτῷ
  choice: 上帝必赐给他
  rationale: 将希腊文神学被动式自然地显明为上帝的行动；“他”保留原文代表性单数形式，所赐之物由上文可知是智慧。
theological_decisions:
- issue: 代表性单数与性别表达
  choice: 若有人……赐给他
  alternative: 若有人……赐给那人／他们若有人……就赐给他们
  rationale: 原文以单数不定代词、第三人称单数命令式和阳性单数代词泛指任何人。现代汉语的“有人……他”可自然表达这种代表性单数，同时不把适用范围限定为男性。
- issue: ἁπλῶς所描述的上帝赐予方式
  choice: 慷慨
  alternative: 单纯地／不存二心地／毫不保留地
  rationale: 在“赐给众人”的直接语境中，词义重点最自然地落在宽厚、不吝惜地给予；但不把本节扩展成物质兴旺的应许。
- issue: 未来被动式的施事者
  choice: 上帝必赐给他
  alternative: 就必有赐给他的
  rationale: δοθήσεται是神学被动式，施事者由前句明确为上帝。中文直说“上帝必赐给他”可避免生硬，又没有增加原文没有的施事者。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“上帝”与项目用语保持一致。句子保留上文到本节的轻微转折，并以分号呈现命令与应许之间的关系。未沿用英文材料中脚注标记与脚注内容明显错位的安排；仅为本译文中实际需要说明的代表性单数设置脚注。
