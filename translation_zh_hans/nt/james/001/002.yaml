lexical_decisions:
- source_word: Πᾶσαν χαρὰν
  choice: 完全的喜乐
  rationale: 该宾格短语作ἡγήσασθε的表语补足成分，表达把所遭遇之事认定为“完全的喜乐”。此译法保留πᾶσαν的整体、完全意味，也避免把它自由改写成仅仅“非常喜乐”。
- source_word: ἡγήσασθε
  choice: 要把这看作
  rationale: 该词为不定过去时中间语态命令式复数，在此要求读者作出判断和评估。“要把这看作”既保留命令语气，也符合现代汉语表达。
- source_word: ἀδελφοί μου
  choice: 我的弟兄们
  rationale: 原文使用阳性复数呼格。正文保留其形式特征；鉴于此书信称呼很可能包括整个信徒群体，在脚注中说明可按包含性意义理解为“弟兄姊妹们”。
- source_word: ὅταν
  choice: 每当
  rationale: ὅταν与虚拟语气περιπέσητε连用，表示不定或反复发生的时间情形；“每当”准确传达这一意味。
- source_word: πειρασμοῖς
  choice: 试炼
  rationale: 此处上下文指考验信心的各样困境，而不是引诱人犯罪的内在诱惑。“试炼”最切合紧接着关于信心受考验的论述，同时脚注保留该词更广的语义范围。
- source_word: περιπέσητε
  choice: 陷入
  rationale: 该动词有“落入、碰上、遭遇”之意。“陷入”保留原文生动的意象，也自然表达并非主动选择而进入困境。
- source_word: ποικίλοις
  choice: 各种
  rationale: 该形容词强调种类繁多、形态不一；“各种”简洁、自然，并与希腊文意义相符。
theological_decisions:
- issue: 书信称呼ἀδελφοί的包含范围
  choice: 正文译作“我的弟兄们”，脚注说明也可理解为“我的弟兄姊妹们”
  alternative: 正文直接译作“我的弟兄姊妹们”
  rationale: 这样既保留原文阳性复数称呼的形式，又不掩盖它在群体性书信语境中很可能包含女性信徒的实际指向。
- issue: πειρασμοῖς在本节指“试炼”还是“诱惑”
  choice: 译作“试炼”，理解为考验信心的外在困境
  alternative: 译作“诱惑”或“考验”
  rationale: 第3节随即谈到信心受考验，支持“试炼”的语境义；但同一词族在本章后文也可涉及诱惑，因此以脚注保留词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“陷入”保留原文动词的生动感；“完全的喜乐”尽量贴近Πᾶσαν χαρὰν的结构，同时保持汉语可读性。
