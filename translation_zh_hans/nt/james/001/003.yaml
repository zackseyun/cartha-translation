base_translation:
  language: en
  yaml_path: translation/nt/james/001/003.yaml
  text: because you know that the testing of your faith produces endurance[a][b].
translation:
  language: zh_hans
  text: 因为你们知道，对你们信心的考验[a]产生忍耐[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们信心经考验所显明的真实性。”希腊词既可指考验的过程，也可指经考验后所显明的品质。
    reason: lexical_alternative
  - marker: b
    text: 或译：“坚忍”或“恒忍”。
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκοντες
  choice: 因为你们知道
  rationale: 该现在主动分词承接第2节的劝勉，并在语境中说明原因；译为“因为你们知道”既自然，也清楚表达因果联系。
- source_word: ὅτι
  choice: （引出“知道”的内容）
  rationale: ὅτι在此引出所知道的内容。现代汉语不必另译“即”，后接分句即可自然表达。
- source_word: τὸ δοκίμιον
  choice: 经过考验
  rationale: δοκίμιον既可指考验的过程，也可指经考验所显出的真实或合格。正文采用“经过考验”，贴合试炼语境；另一种可能由脚注保留。
- source_word: ὑμῶν τῆς πίστεως
  choice: 你们的信心
  rationale: 该属格结构表示受考验的是读者的πίστις；“信心”是此处自然、通行的译法。
- source_word: κατεργάζεται
  choice: 产生
  rationale: 该动词表示促成或带来某种结果；“产生”简明地保留其结果性。
- source_word: ὑπομονήν
  choice: 忍耐
  rationale: ὑπομονή指人在困难之下坚定持守、持续不退；“忍耐”在现代汉语中简洁自然，其他语义侧重见脚注。
theological_decisions:
- issue: πίστις的译法
  choice: 信心
  alternative: 信靠；忠信
  rationale: 这里指读者在试炼中受到考验的信；“信心”最符合上下文和现代中文习惯，不需将其特定化为人的“忠信”。
- issue: δοκίμιον是考验过程还是考验结果
  choice: 正文按考验过程表达
  alternative: 你们信心经考验所显出的真实
  rationale: 原词可以指考验本身，也可以指经考验后显明的合格或真实性。上下文首先谈遭遇试炼，过程义较顺；但不应消除结果义，故以脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“经过考验，就会产生”使句法自然，并保留考验带来忍耐的逻辑关系；两个脚注标记均置于正文相应词语之后。
