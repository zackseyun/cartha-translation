source:
  edition: SBLGNT
  text: ὁ δὲ παρακύψας εἰς νόμον τέλειον τὸν τῆς ἐλευθερίας καὶ παραμείνας, ⸀οὐκ ἀκροατὴς ἐπιλησμονῆς γενόμενος ἀλλὰ ποιητὴς ἔργου, οὗτος μακάριος ἐν τῇ ποιήσει αὐτοῦ ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/025.yaml
  text: But the one who has looked intently into the perfect law[a], the law of freedom[c][b], and has continued in it—not becoming a forgetful hearer but a doer of the work—this one will be blessed in his doing.
translation:
  language: zh_hans
  text: 但那仔细察看那完全的律法，就是自由的律法[a]，又持守其中的人——不是听了就忘的人，而是实行的人[b]——这样的人必在所做的事上蒙福。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“那自由的完全律法”。
    reason: lexical_alternative
  - marker: b
    text: 直译作“行为的实行者”；也可译作“实际去做的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακύψας
  choice: 仔细察看
  rationale: 该词带有俯身探看、专注察看的形象；“仔细察看”在现代汉语中自然，并保留了并非随意一瞥的意味。
- source_word: νόμον τέλειον τὸν τῆς ἐλευθερίας
  choice: 那完美的律法，就是自由的律法
  rationale: 保留希腊文同位语结构，不把“自由”解释为律法所产生的结果；“完美”直接对应 τέλειον，也不缩窄为“成熟”。
- source_word: παραμείνας
  choice: 持守到底
  rationale: 表达持续留在并坚持所察看之律法中的意思；“持守”兼具持续和遵行的意味，“到底”凸显延续性，但不另加具体时限。
- source_word: οὐκ ἀκροατὴς ἐπιλησμονῆς γενόμενος
  choice: 不是听了就忘的人
  rationale: 将希腊文较不寻常的“遗忘的听者”按现代汉语习惯表达，清楚保留听见却忘记的对比。
- source_word: ποιητὴς ἔργου
  choice: 付诸行动的人
  rationale: ἔργου 明指行动或行为，而不是重复上文的“道”；此译自然保留从听见转向实际行动的重点。脚注列出较形式对应的译法。
- source_word: μακάριος
  choice: 蒙福
  rationale: “蒙福”保留该词在圣经语境中的神学分量，比单纯的“快乐”或“幸运”更合适。
- source_word: ἐν τῇ ποιήσει αὐτοῦ
  choice: 在自己的实践中
  rationale: “实践”对应 ποίησις 的实行、行动之意，并与前面的“付诸行动”相呼应，同时避免生硬的“在他的做中”。
- source_word: ὁ ... οὗτος
  choice: 那……的人……他
  rationale: 以汉语自然的关联结构保留单数代表性用法；这里泛指任何这样的人，并非只限男性。
theological_decisions:
- issue: “自由的律法”的含义
  choice: 保留“自由的律法”，不进一步解释
  alternative: 赐人自由的律法；作为释放人的律法；福音或得到成全的道德律法
  rationale: 希腊文允许丰富的神学理解，却没有在本节中明确限定是哪一种；直译核心短语可保留其张力。
- issue: 泛指阳性单数的表达
  choice: 使用“那……的人……他”的汉语泛指结构
  alternative: 那男人；凡……的人
  rationale: 原文阳性单数在此具有代表性，并不排除女性；译文保留单数焦点而不误导为仅指男性。
- issue: 行为与蒙福的关系
  choice: 译作“必在自己的实践中蒙福”
  alternative: 必因自己的行为蒙福；他所做的必蒙福
  rationale: ἐν 表达在其行动或实践之中的处境，未必明确表示功劳性的原因；避免用“因”替原文裁定更强的因果或称义含义。
translation_notes:
  register: 采用现代、庄重且便于朗读的普通话。“仔细察看—持守到底—付诸行动—实践”呈现本节由观察到坚持再到实行的推进。脚注标记均已置于正文相应位置。
