  text: But let the lowly brother boast in his exaltation[b][a],
translation:
  language: zh_hans
  text: 但处境卑微的弟兄[a]，应当以自己的高升[b]为荣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”原文为阳性单数；在这里也可能具有代表性，指处境卑微的弟兄或姊妹，即同信的人。
    reason: lexical_alternative
  - marker: b
    text: “高升”也可译作“高位”。这可能指卑微信徒在上帝面前所享有的尊荣，也可能包含当前和将来处境反转的意味。
    reason: alternative_reading
lexical_decisions:
- source_word: Καυχάσθω
  choice: 应当……为荣
  rationale: 现在时中间语态命令式表达劝勉。“以……为荣”保留καυχάομαι以某事为夸耀的语义，同时在现代汉语中比“夸口”更自然，也避免让读者误解为自我吹嘘。
- source_word: δὲ
  choice: 但
  rationale: δέ在此引出温和的转折，并开启9—10节卑微者与富足者的对照；“但”能自然体现这一衔接。
- source_word: ὁ ἀδελφὸς
  choice: 弟兄
  rationale: 原文为阳性单数，指信仰群体中的一位弟兄；正文保留其性别和数，脚注说明它在语境中可以具有代表性。
- source_word: ὁ ταπεινὸς
  choice: 处境卑微的
  rationale: ταπεινός在这里与下一节的富足者相对，主要涉及低下的社会或经济处境，但也带有卑微的广泛意味；“处境卑微”避免将其只解释为主观谦卑或绝对贫穷。
- source_word: ἐν τῷ ὕψει αὐτοῦ
  choice: 以自己所得的高升
  rationale: ὕψος意为高度、高位或升高。“高升”保留反转意象；加入“所得的”以自然表达这不是自我抬举，而是他所处或所得的尊荣，但不限定为今世地位、属灵身份或末世升高中的任何一种。
theological_decisions:
- issue: 卑微弟兄“高升”的含义
  choice: 保留为宽泛的“所得的高升”，可指他在上帝面前所得的尊荣，并容纳当前身份与未来反转的意味。
  alternative: 明确译为今世社会地位的提高、在上帝面前的属灵尊位，或将来的末世升高。
  rationale: 上下文把卑微者与富足者并列，形成反转张力；原文没有将ὕψος限定在单一时间层面或某一种地位上，因此正文不作窄化。
- issue: ἀδελφός的性别表达
  choice: 正文译为阳性单数“弟兄”，并以脚注交代可能的代表性用法。
  alternative: 译为“弟兄姊妹”或“信徒”。
  rationale: 原文明确为阳性单数；保留形式更贴近源文，而脚注可以说明在共同体语境中也可能泛指同信者。
- issue: καυχάομαι是否带有负面的自夸意味
  choice: 译为“以……为荣”，让其对象——所得的高升——界定这种夸耀。
  alternative: 译为“夸口”或弱化为“欢喜”。
  rationale: “夸口”虽较直译，却在现代汉语中常带明显贬义；“欢喜”又削弱了词义。“以……为荣”较好地兼顾词义力度和正面劝勉。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“处境卑微”清楚表达社会处境而不排除更广的含义；“以……为荣”通顺且保留劝勉力度。脚注标记按内容分别紧随“弟兄”与“高升”，以便读者准确对应。
