  text: μὴ γὰρ οἰέσθω ὁ ἄνθρωπος ἐκεῖνος ὅτι λήμψεταί τι παρὰ τοῦ κυρίου
base_translation:
  language: en
  yaml_path: translation/nt/james/001/007.yaml
  text: For that man must not suppose that he will receive anything from the Lord,[a]
translation:
  language: zh_hans
  text: 因为那个人不该以为自己会从主那里得到任何东西。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主”：原文在本节没有进一步说明具体所指。
    reason: 保留κύριος所指的开放性，避免将译文明确化为“神”或其他称谓。
lexical_decisions:
- source_word: μὴ γὰρ
  choice: 因为……不要
  rationale: γάρ承接上文，说明心怀二意者为何不应期待得着；“因为”保留解释关系。μή与命令式构成禁止语气，现代汉语用“不要”表达自然明确。
- source_word: οἰέσθω
  choice: 以为
  rationale: οἴομαι表示认为、设想；“以为”准确表达其心理判断，也符合本句警告的语气，不把词义提前解释成“期待”。
- source_word: ὁ ἄνθρωπος ἐκεῖνος
  choice: 那个人
  rationale: 指回上一节所描述的疑惑者。“那个人”保留单数和指示意味；现代汉语的“人”本身不标示语法性别，适合表达这里具有代表性的个体。
- source_word: ὅτι
  choice: （以为）……
  rationale: ὅτι引出所想的内容。汉语借“以为”后直接接内容从句即可，无须另译连接词。
- source_word: λήμψεταί
  choice: 会……得到
  rationale: 未来时表示将要领受；“会……得到”在现代汉语中自然保留未来指向。
- source_word: τι
  choice: 什么
  rationale: 在“不要以为”所支配的否定语境中，“得到什么”自然表达“不可能得到任何东西”的全面意味。
- source_word: παρὰ τοῦ κυρίου
  choice: 从主那里
  rationale: παρά加属格表示来源；“从主那里”保留来源关系，并将κύριος译为传统而自然的“主”，不擅自明确其所指。
theological_decisions:
- issue: “主”（τοῦ κυρίου）的所指
  choice: 主
  alternative: 神；主神
  rationale: 希腊文只使用κύριος，未在本节进一步指明所指。译作“主”既忠实于原文称谓，也保留可能指神或更具体指向的开放性。
- issue: ὁ ἄνθρωπος ἐκεῖνος的性别表达
  choice: 那个人
  alternative: 那个男人；那人
  rationale: 原文名词和冠词在语法上为阳性单数，但ἄνθρωπος可泛指人，此处代表上一节所说的疑惑者。汉语没有相应的语法性别标记；译成“那个男人”会加入原文未必具有的生理性别强调。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“因为”明确连接上文；“不要以为自己会……”保持劝诫语气。“那个人”略具指回功能，与前一节的疑惑者衔接。
