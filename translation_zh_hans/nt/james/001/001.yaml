id: JAS.1.1
reference: James 1:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἰάκωβος θεοῦ καὶ κυρίου Ἰησοῦ Χριστοῦ δοῦλος ταῖς δώδεκα φυλαῖς ταῖς ἐν τῇ διασπορᾷ χαίρειν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/001.yaml
  text: 'James[a], a slave of God and of the Lord Jesus the Messiah[c][b], to the twelve tribes in the Dispersion: greetings.'
translation:
  language: zh_hans
  text: 雅各——上帝和主耶稣基督[a]的奴仆[b]——向散居各地[c]的十二支派问安。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基督”意为“弥赛亚”，也就是“受膏者”。
    reason: lexical_alternative
  - marker: b
    text: 或译“奴隶”。原词指属于主人、受主人支配的人；这里译作“奴仆”，同时保留其强烈的归属意味。
    reason: lexical_alternative
  - marker: c
    text: 原文所用词常指散居在以色列地以外各国的犹太人；这里具体涵盖哪些人，原文没有进一步说明。
    reason: cultural_note
lexical_decisions:
- source_word: Ἰάκωβος
  choice: 雅各
  rationale: 采用现代中文圣经传统中对该新约人物的通行译名；该希腊名字在词源和形式上也对应“雅各布”，但此处用“雅各”最自然且易于辨认。
- source_word: θεοῦ
  choice: 上帝
  rationale: 按属格直接修饰“奴仆”，译为“上帝的奴仆”，不作扩充。
- source_word: κυρίου
  choice: 主
  rationale: 在耶稣的称号中保留 κύριος 的权柄含义及新约惯用表达。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣基督
  rationale: “基督”是现代中文中 Χριστός 的通行圣经称号；脚注说明其含义为“弥赛亚”，以保留称号性质。
- source_word: δοῦλος
  choice: 奴仆
  rationale: 兼顾该词所含的从属、归属意味和现代中文书信自称的庄重自然；脚注注明较直译可作“奴隶”，避免削弱原词力度。
- source_word: ταῖς δώδεκα φυλαῖς
  choice: 向……十二支派
  rationale: 保留以色列十二支派的传统和盟约性表达，不泛化为“十二个群体”。
- source_word: διασπορᾷ
  choice: 散居各地
  rationale: 用自然现代汉语表达犹太人分散居住的半专门性概念；脚注补足其历史文化所指。
- source_word: χαίρειν
  choice: 问安
  rationale: 按希腊书信开头的固定问候语处理；若直译为“喜乐”会误解其语用功能。
theological_decisions:
- issue: Χριστοῦ 在称谓中的表达
  choice: 基督
  alternative: 弥赛亚；受膏者
  rationale: 中文“基督”既是通行称号，也保持庄重和辨识度；以脚注说明其意为“弥赛亚”，避免把它完全当作无意义的姓名组成部分。
- issue: 雅各自称 δοῦλος 的力度
  choice: 奴仆
  alternative: 奴隶；仆人
  rationale: “奴仆”在现代中文中较自然，又能表达完全隶属于上帝和主耶稣的意味；“仆人”可能过度弱化原词，“奴隶”虽更直截，却容易把古代身份称谓仅理解为现代制度语境。
- issue: “十二支派”所指范围
  choice: 保留“十二支派”，不在正文限定其对象
  alternative: 散居在外的犹太人；上帝散居各地的子民
  rationale: 原文沿用以色列十二支派的称呼，但没有明说作者仅指族裔犹太人还是借此称呼更广的上帝子民；正文保留原有张力，不替作者作神学限定。
translation_notes:
  register: 采用现代、庄重而易懂的书信开头。破折号清楚标出雅各的自我身份说明，使较长的属格结构在中文中自然顺畅；“问安”简洁传达古希腊书信开头的惯用问候。
