  text: ὀργὴ γὰρ ἀνδρὸς δικαιοσύνην θεοῦ ⸂οὐκ ἐργάζεται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/020.yaml
  text: For a man's anger does not produce God's righteousness.
translation:
  language: zh_hans
  text: 因为人的愤怒并不能成就上帝的义。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀργὴ ἀνδρός
  choice: 人的愤怒
  rationale: 既保留属格结构的基本含义，也以现代汉语自然表达泛指人类或人的怒气；不将 ἀνήρ 不必要地限定为成年男性。
- source_word: δικαιοσύνην θεοῦ
  choice: 上帝的义
  rationale: 保留属格短语的凝练与潜在张力，不擅自限定为上帝所要求的义行、上帝施行的公义或上帝所赐的义。
- source_word: οὐκ ἐργάζεται
  choice: 并不能成就
  rationale: ἐργάζομαι 在此指产生、实现或促成某种结果；“成就”能自然连接“义”，而“不能”表达这种愤怒无法带来该结果。
- source_word: γάρ
  choice: 因为
  rationale: 明确承接上一节的劝诫，保留原文的解释性因果关系。
theological_decisions:
- issue: “上帝的义”的属格含义
  choice: 保留“上帝的义”
  alternative: “上帝所要求的义”或“上帝所认可的正义”
  rationale: 原文 δικαιοσύνη θεοῦ 可涉及属于上帝、出于上帝或合乎上帝的义；正文不替读者消除这一真实歧义。
- issue: 人的愤怒与义的关系
  choice: 表述为不能成就上帝的义
  alternative: 绝对断言任何愤怒本身都是罪
  rationale: 经文本身关注人的愤怒所产生的结果，并未在本句中系统界定一切愤怒的道德性质。
translation_notes:
  register: 采用简洁、庄重而通顺的现代标准汉语。“人的愤怒”适合普通读者，“上帝的义”保留原文神学密度；全句维持原文因果结构。
