  text: διὸ ἀποθέμενοι πᾶσαν ῥυπαρίαν καὶ περισσείαν κακίας ἐν πραΰτητι δέξασθε τὸν ἔμφυτον λόγον τὸν δυνάμενον σῶσαι τὰς ψυχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/021.yaml
  text: Therefore, having put away all filthiness and the overflow of wickedness, receive with meekness the implanted word, which is able to save your souls.
translation:
  language: zh_hans
  text: 所以，你们要除去一切污秽和泛滥的邪恶[a]，以温柔[b]领受那已栽种的道[c]；这道能够拯救你们的灵魂[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“充斥的恶”或“过多的恶意”。
    reason: lexical_alternative
  - marker: b
    text: 或译“以柔和的态度”或“存谦卑的心”。
    reason: lexical_alternative
  - marker: c
    text: 或译“那内生的道”；传统译法为“所栽接的道”。
    reason: lexical_alternative
  - marker: d
    text: 或译“你们的生命”或“你们自己”。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: 所以
  rationale: 承接上文并引出推论；“所以”在现代汉语中自然、清楚地保留逻辑联系。
- source_word: ἀποθέμενοι
  choice: 要除去
  rationale: 分词在此伴随主要命令，表示领受之前或同时应有的行动。汉语用“要除去……领受……”自然呈现其劝诫力，而不生硬复制希腊语结构。
- source_word: πᾶσαν ῥυπαρίαν
  choice: 一切污秽
  rationale: 保留ῥυπαρία由肮脏引申为道德污秽的鲜明意象。
- source_word: περισσείαν κακίας
  choice: 泛滥的邪恶
  rationale: περισσεία可指过量、充斥或有余；“泛滥”保留其充溢意象，κακία译为范围较广的“邪恶”，不缩窄为恶意。
- source_word: ἐν πραΰτητι
  choice: 以温柔谦和的心
  rationale: πραΰτης兼有温柔、不强硬和谦卑受教的意味；此译法用自然汉语表达领受时的态度。
- source_word: δέξασθε
  choice: 领受
  rationale: 准确保留命令语气；“领受”适合道被接纳的语境，也具有庄重而通晓的现代汉语风格。
- source_word: τὸν ἔμφυτον λόγον
  choice: 那栽种在你们里面的道
  rationale: ἔμφυτος可指植入、内生；“栽种在……里面”保留农业意象和已在听者里面的含义，同时不说明栽种的具体机制。
- source_word: τὸν δυνάμενον σῶσαι
  choice: 这道能够拯救
  rationale: 明确关系分句所修饰的是“道”，并保留能力陈述，不额外解释拯救如何发生。
- source_word: τὰς ψυχὰς ὑμῶν
  choice: 你们的灵魂
  rationale: ψυχή可指灵魂、生命或人自身；正文保留救恩语境中的传统表达，同时以脚注呈现真实词义范围。
theological_decisions:
- issue: 救恩语境中ψυχὰς ὑμῶν的含义
  choice: 你们的灵魂
  alternative: 你们的生命；你们自己
  rationale: “灵魂”保留该词在救恩语境中的神学分量；脚注明示它也可整体指人的生命或本人，避免把希腊词义过度限定为与身体分离的一部分。
- issue: ἔμφυτον λόγον的含义
  choice: 那栽种在你们里面的道
  alternative: 那内生的道；传统译法“所栽接的道”
  rationale: 正文保留“植入”和“在里面生长”的意象，不断定这道如何进入听者里面，也不把词义解释成某一特定救恩机制。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“污秽”“泛滥”“栽种”保留原文的具体意象；“领受”“道”“拯救”维持经文语体，但避免古奥句法。脚注标记均紧随相关表达。
