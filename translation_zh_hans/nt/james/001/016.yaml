  text: μὴ πλανᾶσθε, ἀδελφοί μου ἀγαπητοί.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/016.yaml
  text: Do not be deceived[a], my beloved brothers.
translation:
  language: zh_hans
  text: 不要受迷惑，我亲爱的弟兄们[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”也可译作“弟兄姊妹”；这里的希腊语称呼可统指包括女性在内的信徒群体。
    reason: 说明原文阳性复数称呼在此可能具有包括男女信徒的群体性用法。
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: 不要受迷惑
  rationale: μή与现在时命令式构成禁止语气。πλανᾶσθε在此可表达“受欺骗、被引入错误”，上下文主要警告读者不要对试探与上帝的关系抱有错误认识。“不要受迷惑”自然简洁，也保留了希腊语中被动或中间语态所具有的张力，未擅自明确迷惑者是谁。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 该词为阳性复数呼格，直译为“弟兄们”；在早期基督徒群体的称呼中，也可概括包括女性在内的众信徒。正文保留原文的性别形式，并用脚注说明其群体性用法。
- source_word: μου
  choice: 我亲爱的
  rationale: μου表示“我的”，与ἀγαπητοί合译为现代汉语自然的“我亲爱的”，传达作者与受众之间亲近的牧养关系。
- source_word: ἀγαπητοί
  choice: 亲爱的
  rationale: ἀγαπητοί是带有深厚感情的称呼。“亲爱的”在现代汉语中庄重而自然，较“蒙爱的”少加一层未由本句明确指出的施爱者含义。
theological_decisions:
- issue: 对基督徒群体的性别化称呼
  choice: 正文将ἀδελφοί译为“弟兄们”，并以脚注说明可包含女性信徒。
  alternative: 正文译为“弟兄姊妹”或“众弟兄姊妹”。
  rationale: 希腊语形式为阳性复数，但在群体称呼中可能具有包括男女信徒的代表性。正文保留原文形式，脚注则避免现代读者误以为受众仅限男性。
- issue: πλανᾶσθε的语态与含义
  choice: 译为“受迷惑”。
  alternative: 译为“自欺”“被欺骗”或“误入歧途”。
  rationale: 该形式可按被动或中间语态理解；“受迷惑”保留这种开放性，同时符合上下文对错误认识的警告。“自欺”会明确加入反身含义，“被欺骗”较强地预设外在施事者，“误入歧途”则更偏向行为道路。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。保留原文先发出禁令、后以亲切呼格称呼受众的语序；“我亲爱的弟兄们”既传达牧养情感，也不过度宗派化。
