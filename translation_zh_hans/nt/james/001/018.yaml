  text: βουληθεὶς ἀπεκύησεν ἡμᾶς λόγῳ ἀληθείας, εἰς τὸ εἶναι ἡμᾶς ἀπαρχήν τινα τῶν αὐτοῦ κτισμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/018.yaml
  text: Having willed it[a], he gave birth to us by the word of truth[b], so that we might be a kind of firstfruits of his creatures.
translation:
  language: zh_hans
  text: 他按自己的旨意，借着真理的道生了我们，为要使我们在他所造的万物中可算是初熟的果子[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “初熟的果子”指收成中首先成熟、分别献给上帝的部分；这里描绘信徒在上帝所造的万物中，作为首先归给他的一部分。
    reason: cultural_note
lexical_decisions:
- source_word: βουληθεὶς
  choice: 他既然定意
  rationale: 这个不定过去时分词表达上帝的意愿先于并促成主句的行动。“既然……就……”自然地呈现其很可能具有的原因意味，同时不把经文扩展成某一特定的预定论体系。
- source_word: ἀπεκύησεν
  choice: 生了我们
  rationale: 保留“生产、诞生”的意象，并与1:15中私欲“生出”罪的表述形成呼应；不采用可能额外突出父系生育观念的“生育了”。
- source_word: λόγῳ ἀληθείας
  choice: 借着真理的道
  rationale: 将与格理解为工具或媒介。“真理的道”保留了原文的属格结构，也自然指向传达真理的信息，而不把它仅仅改写为一句真实的话。
- source_word: εἰς τὸ εἶναι ἡμᾶς
  choice: 使我们……可以说是
  rationale: “使”表达该结构的目的或结果；具体是目的还是结果，中文不作过度限定。
- source_word: ἀπαρχήν
  choice: 初熟的果子
  rationale: 保留收成中最先成熟并献给上帝之部分的祭献意象及其经文关联，比“第一部分”更能传达原有比喻。
- source_word: τινα
  choice: 可以说是
  rationale: τινα在这里对表语作缓和限定，并非表示数量。“可以说是”比生硬的“某种初熟果子”更符合现代汉语，同时保留近似或代表性的语气。
- source_word: τῶν αὐτοῦ κτισμάτων
  choice: 在他所造的万物中
  rationale: 保留复数所涵盖的广大受造范围，不把它擅自缩窄为人类；“他所造的万物”比“他的被造物”更自然。
theological_decisions:
- issue: 新生出于上帝的主动意愿
  choice: 用“他既然定意……就……生了我们”表明上帝的意愿先于并促成这一行动。
  alternative: “他按自己的旨意生了我们”或加入特定重生、预定教义的解释。
  rationale: 希腊文明确强调上帝的意愿和主动行动，却没有在本节中交代完整的教义体系；译文保留这一重点而不作宗派性扩充。
- issue: κτισμάτων所指的范围
  choice: 译为“他所造的万物”，保持广义。
  alternative: 限定为“他所造的人”或概括为抽象的“受造界”。
  rationale: 原文使用复数名词，可涵盖上帝所造的众多受造物；将其限定为人类会加入原文未明说的范围。
- issue: εἰς τὸ εἶναι的目的与结果张力
  choice: 译作“使我们……”，容纳目的和所达成结果的语义。
  alternative: 明确译作“为要叫我们……”或“结果使我们……”。
  rationale: 该结构可以着重目的，也可带有结果意味；较宽的中文表达避免无必要地排除其中一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“生了我们”刻意保留雅各书上下文中的生产意象；“可以说是”自然呈现τινα的限定语气。
