  rationale: 修订明确保留“遵行者”与“仅仅听者”的对照，避免把经文误读为禁止听道；同时以现代标准汉语更自然地表达自我蒙骗。脚注仍锚定在对应 παραλογιζόμενοι ἑαυτούς 的“自欺”之后，并保留其“错误推理”的词汇色彩。
