  - severity: low
    issue: “要做遵行这道的人，……自己欺骗自己”措辞略重叠，逻辑衔接不够自然。
    rationale: “成为遵行这道的人”较顺畅地表达 Γίνεσθε 的劝勉；“免得自欺”以自然汉语表达该分词所说明的自我蒙骗后果，且不改变经文的警告。
