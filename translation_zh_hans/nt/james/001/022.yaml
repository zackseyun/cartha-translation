  text: Γίνεσθε δὲ ποιηταὶ λόγου καὶ μὴ ⸂ἀκροαταὶ μόνον⸃ παραλογιζόμενοι ἑαυτούς.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/022.yaml
  text: But be doers of the word[a], and not hearers only, deceiving yourselves.
translation:
  language: zh_hans
  text: 然而，你们要成为遵行这道的人，不要只作听道的人，免得自欺[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “自欺”也可译为“蒙骗自己”；原文含有因错误推理而使自己陷入错谬的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: Γίνεσθε
  choice: 要做
  rationale: 现在时命令语气要求持续形成并保持一种生活实践；“要做”在现代汉语中自然地保留劝勉和持续实践的意味。
- source_word: δὲ
  choice: 但是
  rationale: 承接上文并形成轻微转折，指出仅仅领受或听见还不够。
- source_word: ποιηταὶ λόγου
  choice: 遵行这道的人
  rationale: ποιηταί 指实行者；“遵行”清楚表达按所听见的道去做。“这道”承接雅各书1:21的 λόγος，保留其圣经语境中的分量，又不把含义限定为某一项教义。
- source_word: ἀκροαταὶ μόνον
  choice: 单单听道
  rationale: 自然表达 μόνον 的限制作用，并与“遵行这道”构成鲜明对比；虽未机械保留名词形式，却完整传达“只是听者”的意思。
- source_word: παραλογιζόμενοι
  choice: 欺骗
  rationale: 该分词表示因错误推理而陷入自我蒙骗；正文采用清楚自然的“欺骗”，脚注补明其推理失误的语义色彩。
- source_word: ἑαυτούς
  choice: 自己
  rationale: 直接表达反身宾语，指出受骗者正是他们自己。
theological_decisions:
- issue: λόγος 在雅各书1:22中的含义
  choice: 译作“这道”，指上文所领受的道，并保留其圣经神学意涵
  alternative: “这信息”或“这教导”
  rationale: 雅各书1:21刚提到栽种在人心里的“道”；“这道”既保持上下文连续，也不擅自把所指缩窄为某一特定教义体系。
- issue: Γίνεσθε 的命令语气所表达的实践性质
  choice: “要做”表达持续成为并活出遵行者的劝勉
  alternative: “要成为”可较突出进入某种状态
  rationale: 现在时命令语气侧重持续的生活模式；汉语“要做遵行这道的人”兼顾命令力和长期实践。
- issue: 听道与行道的关系
  choice: 保留经文对二者的直接对比，不扩写为靠行为得救或否定听道的重要性
  alternative: 加入有关称义、得救或功德的解释
  rationale: 本节重点是警告只听而不实行所造成的自欺；译文不应导入经文本身未明说的教派性结论。
translation_notes:
  register: 采用现代、庄重而通俗的书面语。“遵行这道”比单说“行道”更便于普通读者即时理解，同时保留 λόγος 与上文的联系。脚注标记置于其实际说明的“欺骗自己”之后。
