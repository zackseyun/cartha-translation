base_translation:
  language: en
  yaml_path: translation/nt/james/001/010.yaml
  text: and the rich man in his humiliation[b][a], because like a flower of grass he will pass away.
translation:
  language: zh_hans
  text: 富足的人却要以自己被降卑为荣[a]，因为他必像草的花一样消逝[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “要以……为荣”承接第9节的动词；本节希腊原文省略了这个动词。较贴近原文形式可译作：“富足的人却在自己被降卑的处境中……”。
    reason: alternative_reading
  - marker: b
    text: “草的花”直译希腊文的意象，指草本植物所开的花，强调富足之人像开花的草木一样迅速消逝。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πλούσιος
  choice: 富足的人却
  rationale: πλούσιος在此作名词使用，指“富足的人”；δὲ承接第9节，同时形成对照，因此译作“却”，但不把对照强化为彼此敌对。
- source_word: ἐν τῇ ταπεινώσει αὐτοῦ
  choice: 以自己被降卑为荣
  rationale: ταπείνωσις可指卑微处境、受屈辱或被降低。结合后文财富与生命的短暂性，“被降卑”保留了地位降低和受挫的意味，避免误解为单指谦逊这种美德；“为荣”承接第9节省略的καυχάσθω。
- source_word: ὅτι
  choice: 因为
  rationale: ὅτι引出富足之人应当以被降卑为荣的理由，译作“因为”清楚保留因果关系。
- source_word: ὡς ἄνθος χόρτου
  choice: 像草上的花一样
  rationale: 直译并保留草木开花却迅速凋残的经文意象；“草上的花”比“野花”更贴近希腊文，也不添入原文没有的“田野”。
- source_word: παρελεύσεται
  choice: 他必……消逝
  rationale: παρέρχομαι在此强调人的短暂和终将不复存在；“消逝”自然表达这一含义，并与花草易逝的比喻相称。
theological_decisions:
- issue: 第9节谓语在本节中的省略
  choice: 正文为使现代汉语完整，承接第9节补出“要以……为荣”，并用脚注说明原文省略。
  alternative: 逐字保留为不完整结构：“富足的人却在自己被降卑时……”
  rationale: 希腊文第10节没有重写καυχάσθω，但句法上承接第9节。补出谓语不是另立解释，而是明示原有句法关系；脚注使读者仍可核查这一省略。
- issue: “被降卑”的含义
  choice: 保留富足之人地位降低、财富与生命归于消逝的含义，不限定其具体方式。
  alternative: 理解为富足之人主动谦卑，或仅指一般的低下社会地位。
  rationale: 后面的理由强调富足之人如草花般消逝，较支持受降低或终归卑微的含义；但正文不规定这是今生遭遇、死亡，还是末后的逆转，从而保留经文的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“富足的人”通俗且准确；“被降卑”保留社会地位降低、受挫与终归卑微的多重可能；“消逝”既适用于花草，也适用于人的生命和显赫地位。正文中的[a]、[b]均与脚注对应。
