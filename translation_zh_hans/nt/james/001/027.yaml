source:
  edition: SBLGNT
  text: θρησκεία καθαρὰ καὶ ἀμίαντος παρὰ ⸀τῷ θεῷ καὶ πατρὶ αὕτη ἐστίν, ἐπισκέπτεσθαι ὀρφανοὺς καὶ χήρας ἐν τῇ θλίψει αὐτῶν, ἄσπιλον ἑαυτὸν τηρεῖν ἀπὸ τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/027.yaml
  text: 'Religion that is pure and undefiled before God the Father is this: to care for orphans and widows in their affliction[b][a], and to keep oneself unstained from the world.'
translation:
  language: zh_hans
  text: 在父神面前，纯洁而没有玷污的虔诚就是：照顾在患难中的孤儿寡妇[a]，并且保守自己不受这世界的玷污[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“探望在患难中的孤儿寡妇”；希腊语动词既可表示探望，也可包含实际关怀和照料。
    reason: lexical_alternative
  - marker: b
    text: 这里的“世界”是指与神相对、会使人受到道德玷污的秩序，并不是说受造界本身是邪恶的。
    reason: cultural_note
lexical_decisions:
- source_word: θρησκεία
  choice: 虔诚
  rationale: 这里指表现于外在行动的宗教敬虔，而非抽象的信仰体系。“虔诚”在现代汉语中自然，也切合上下文对实践的强调。
- source_word: καθαρὰ καὶ ἀμίαντος
  choice: 纯洁而没有玷污
  rationale: 保留两个并列形容词及洁净、污染的意象；“没有玷污”比单用“无瑕”更清楚易懂。
- source_word: παρὰ τῷ θεῷ καὶ πατρὶ
  choice: 在父神面前
  rationale: παρά加与格表示在某位面前、按其评判；θεῷ καὶ πατρὶ指同一位既是神又是父的对象。“父神”简洁自然，不增添原文没有明说的“我们”。
- source_word: ἐπισκέπτεσθαι
  choice: 照顾
  rationale: 该动词可指探望，也包含关怀、援助之意；在孤儿寡妇遭患难的语境中，“照顾”更充分表达实际关怀，并以脚注保留“探望”的词义可能。
- source_word: ὀρφανοὺς καὶ χήρας
  choice: 孤儿寡妇
  rationale: 直接、惯用地表达两类缺乏社会保障的弱势者。
- source_word: ἐν τῇ θλίψει αὐτῶν
  choice: 在患难中的
  rationale: θλῖψις可指困苦、压迫或患难；“患难”庄重而易懂，并保留其较强语气。
- source_word: ἄσπιλον ἑαυτὸν τηρεῖν
  choice: 保守自己不受……的玷污
  rationale: 保留主动警醒、自我持守以及不被污染的意象；“自己”自然表达原文在普遍劝诫中的泛指作用。
- source_word: ἀπὸ τοῦ κόσμου
  choice: 不受这世界的玷污
  rationale: ἀπό表达与污染来源隔绝；保留“世界”这一神学用语，不把它直接改释为物质受造界或世俗社会。汉语补出“玷污”使ἄσπιλον的关系自然明确。
theological_decisions:
- issue: κόσμος在伦理语境中的含义
  choice: 正文保留“这世界”，以其为可能造成道德玷污的领域或秩序。
  alternative: 译作“败坏的世界”或“世俗社会”。
  rationale: 原文没有把κόσμος明确扩写为“败坏”或“世俗社会”。保留“世界”可避免把受造界本身视为邪恶，也不把经文收窄为某一种社会隔离观。
- issue: ἑαυτόν的泛指作用
  choice: 译作“自己”。
  alternative: 译作“他自己”。
  rationale: 阳性单数形式在此用于普遍性的道德劝诫；现代汉语“自己”准确表达泛指，不限定男性。
- issue: θρησκεία所指的宗教实践
  choice: 译作“虔诚”，并让后文具体说明其行动表现。
  alternative: 译作“宗教”或“敬拜”。
  rationale: “宗教”容易被理解为制度或信仰体系，“敬拜”则可能过度限于礼仪；“虔诚”较好保留外显宗教实践与内在敬神之间的张力。
translation_notes:
  register: 采用现代、庄重而通俗的书面汉语。“父神”简洁表达同一位既是神又是父；句式保留原文先定义、后列举两项实践的结构。脚注标记依相关词语顺序置于正文中。
