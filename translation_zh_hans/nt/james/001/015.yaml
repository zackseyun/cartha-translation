  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἶτα ἡ ἐπιθυμία συλλαβοῦσα τίκτει ἁμαρτίαν, ἡ δὲ ἁμαρτία ἀποτελεσθεῖσα ἀποκύει θάνατον.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/015.yaml
  text: Then desire[a], after it has conceived, gives birth to sin; and sin, when it is fully grown[b], brings forth death.
translation:
  language: zh_hans
  text: 随后，私欲怀了胎，就生出罪来；罪长成了[a]，就生出死亡来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“达到完全”或“成熟了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: 随后
  rationale: 承接上一节所述受诱惑的过程，标明从私欲到罪、再到死亡的递进次序；“随后”自然且庄重。
- source_word: ἐπιθυμία
  choice: 私欲
  rationale: 在本段语境中指诱惑人的错误欲望，并不限于性欲。“私欲”是现代中文圣经语境中清楚而简练的表达，也保留其道德负面含义。
- source_word: συλλαβοῦσα
  choice: 怀了胎
  rationale: 保留原文受孕的生育意象，并表达分词动作先于“生出”的时间关系。
- source_word: τίκτει
  choice: 生出
  rationale: 自然保留生产、生育的比喻，同时避免过于生硬的措辞。
- source_word: ἁμαρτίαν
  choice: 罪
  rationale: 直接对应原文，指由私欲所生出的道德恶。
- source_word: δὲ
  choice: 就
  rationale: 此处主要推进叙述而非形成强烈转折；中文以“就”连接前后阶段，更清楚呈现递进结果。
- source_word: ἀποτελεσθεῖσα
  choice: 长成了
  rationale: 原词可指完成、达到成熟；结合贯穿本句的生命与生育意象，“长成了”既自然又保留成熟发展的含义。
- source_word: ἀποκύει
  choice: 生出
  rationale: 继续保留原文的生产意象。中文重复“生出”能强化私欲—罪—死亡的连锁结构，并不显累赘。
- source_word: θάνατον
  choice: 死亡
  rationale: 原文没有限定为肉体、属灵或永恒的死亡，因此直译并保留其宽广而沉重的含义。
theological_decisions:
- issue: 私欲、罪与死亡之间的生育比喻
  choice: 保留“怀胎—生出—长成—生出”的人格化、生育性意象
  alternative: 意译为“私欲导致罪，罪导致死亡”
  rationale: 抽象的因果表述会削弱原文鲜明的修辞力量；译文应呈现诱惑逐步发展并结出死亡的过程。
- issue: θάνατος的范围
  choice: 仅译为“死亡”
  alternative: 译为“属灵的死亡”或“永远的死亡”
  rationale: 原文没有进一步限定死亡的性质；不应在译文中加入特定教义解释。
- issue: ἀποτελεσθεῖσα的含义
  choice: 正文采用“长成了”，脚注保留“达到完全”的可能表达
  alternative: 正文译为“完成了”或“达到完全”
  rationale: “长成了”更贴合上下文的生命、生育意象，但该词本身也含完成、达到完全之意，故以脚注保留词义幅度。
translation_notes:
  register: 采用现代、简洁而庄重的普通话。“私欲”避免把ἐπιθυμία窄化为性欲；整句保留原文层层推进的生育意象。脚注标记[a]已置于正文对应词语之后。
