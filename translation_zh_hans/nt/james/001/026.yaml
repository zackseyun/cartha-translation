id: JAS.1.26
reference: James 1:26
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Εἴ τις δοκεῖ θρησκὸς ⸀εἶναι μὴ χαλιναγωγῶν γλῶσσαν ⸀αὐτοῦ ἀλλὰ ἀπατῶν καρδίαν ⸀αὐτοῦ, τούτου μάταιος ἡ θρησκεία.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/026.yaml
  text: If anyone thinks he is religious while not bridling his tongue but deceiving his heart[c][b][a], this person's religion is worthless.
translation:
  language: zh_hans
  text: 若有人自以为虔诚[a]，却不勒住自己的舌头[b]，反而欺骗自己的心，这人的虔诚就是徒然的[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“看来是虔诚的。”
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“给自己的舌头套上辔头”，保留以辔头驾驭牲畜的意象。
    reason: lexical_alternative
  - marker: c
    text: “徒然的”也可译为“毫无价值的”或“无用的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκεῖ
  choice: 自以为
  rationale: 在此语境中表达当事人对自己宗教状况的判断；同时保留“看来是”的可能性，并在脚注中注明。
- source_word: θρησκὸς
  choice: 虔诚
  rationale: 表达对宗教礼仪和实践的认真态度，不将含义收窄为某一宗派身份；并与句末 θρησκεία 的译法形成词语呼应。
- source_word: χαλιναγωγῶν
  choice: 勒住
  rationale: 保留给牲畜套上辔头、加以驾驭的具体意象，也与雅各书3:2的相关比喻相呼应。
- source_word: γλῶσσαν αὐτοῦ
  choice: 自己的舌头
  rationale: 按原文保留“舌头”这一具体说法，指向人的言语，同时维持后文讨论舌头时的主题联系。
- source_word: ἀπατῶν καρδίαν αὐτοῦ
  choice: 欺骗自己的心
  rationale: 保留“欺骗”和“心”的原文意象；“心”在此指人的内在自我，而不是仅作生理意义理解。
- source_word: τούτου
  choice: 这人的
  rationale: 自然地表达指示代词回指前述那一类人的作用。
- source_word: μάταιος
  choice: 徒然的
  rationale: 传达空洞、不能产生应有效果的评价；脚注补充“毫无价值、无用”等可选表达。
- source_word: ἡ θρησκεία
  choice: 虔诚
  rationale: 在现代汉语中以名词方式回扣前面的“虔诚”，保留 θρησκός 与 θρησκεία 的词义联系；这里具体指所表现和实行的宗教虔诚，而非对所有宗教的笼统判断。
theological_decisions:
- issue: δοκεῖ 所表达的是自我判断还是外在表象
  choice: 自以为虔诚
  alternative: 看来是虔诚的
  rationale: 上下文着重揭露人对自己的错误判断，因此正文采用“自以为”；但希腊词也可表达“看来、似乎”，故以脚注保留歧义。
- issue: θρησκός／θρησκεία 的含义与词义联系
  choice: 虔诚／虔诚
  alternative: 虔敬宗教／宗教实践
  rationale: 重复“虔诚”能在自然汉语中保留原文同词根的呼应，并让批评集中于声称和实行的宗教虔诚；不把本节误解为对“宗教”这一概念本身的全面否定。
- issue: 泛指人物的性别表达
  choice: 若有人……自己的
  alternative: 若有人……他的
  rationale: 希腊语以语法上的阳性单数作泛指。汉语“有人”和反身代词“自己”无需标示性别，既准确表达普遍范围，也避免凭空强化男性限定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“勒住舌头”保留原文鲜明比喻，同时在汉语中容易理解；“欺骗自己的心”保留圣经语境中的具体表达。正文三处脚注标记均按出现次序列出。
