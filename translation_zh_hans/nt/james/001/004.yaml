  text: ἡ δὲ ὑπομονὴ ἔργον τέλειον ἐχέτω, ἵνα ἦτε τέλειοι καὶ ὁλόκληροι, ἐν μηδενὶ λειπόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/004.yaml
  text: And let endurance have its perfect work[a], so that you may be mature and complete, lacking in nothing.
translation:
  language: zh_hans
  text: 要让坚忍充分发挥功效[a]，使你们成熟、完整，毫无欠缺。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“完全的工作”。“充分发挥功效”表示坚忍的作用充分达到应有的结果；这里“完全”所对应的希腊词与译作“成熟”的词相关，都含有达到预定终点、臻于完整的意思；“完整”则强调各方面齐全。
    reason: 说明ἔργον τέλειον的译法，并保留τέλειον与τέλειοι的词汇呼应及其与ὁλόκληροι的语义区别。
lexical_decisions:
- source_word: ὑπομονὴ
  choice: 坚忍
  rationale: 指人在考验中坚定持守、持续不退；“坚忍”比可能显得被动的“耐心”更切合上下文。
- source_word: ἔργον τέλειον
  choice: 完全的功效
  rationale: 表达坚忍所产生的作用达到预定结果；既避免生硬直译“有完全的工作”，也保留 τέλειον 所含的完整、达到终点之意。
- source_word: ἐχέτω
  choice: 要让……发挥
  rationale: 保留第三人称命令式的劝勉语气，并使中文自然。
- source_word: ἵνα ἦτε
  choice: 使你们
  rationale: 简洁表达目的或结果关系，不强行限定二者之一。
- source_word: τέλειοι
  choice: 成熟
  rationale: 用于人时可指达到应有的成熟或完整状态；“成熟”避免把经文直接限定为绝对无罪的完全。
- source_word: ὁλόκληροι
  choice: 完整
  rationale: 强调各部分齐全、整体无缺，并与 τέλειοι 的“成熟”保持词义区别。
- source_word: ἐν μηδενὶ λειπόμενοι
  choice: 毫无欠缺
  rationale: 自然表达在任何方面都不缺少的全面含义。
- source_word: δὲ
  choice: 并且
  rationale: 此处承接上一节的论述，属于温和推进，不宜译成强烈转折。
theological_decisions:
- issue: 成圣语境中 τέλειοι 的含义
  choice: 成熟
  alternative: 完全
  rationale: 雅各强调坚忍达到其目的后，信徒趋于成熟和完整；译作“成熟”可避免擅自断定本节教导今生达到绝对无罪，同时脚注保留“完全”这一词义关联与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“坚忍”贴合试炼中的持续持守；“发挥完全的功效”兼顾中文自然度和原文目的性。主句保留劝勉语气，结尾用“成熟、完整，毫无欠缺”呈现原文层层加强的修辞。
