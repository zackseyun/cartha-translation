source:
  edition: SBLGNT
  text: Ἄγε νῦν οἱ λέγοντες· Σήμερον ⸀ἢ αὔριον ⸀πορευσόμεθα εἰς τήνδε τὴν πόλιν καὶ ⸀ποιήσομεν ἐκεῖ ⸀ἐνιαυτὸν καὶ ⸀ἐμπορευσόμεθα καὶ ⸀κερδήσομεν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/013.yaml
  text: Come now[a], you who say, “Today or tomorrow we will go into this city and spend a year there and do business and make a profit.”
translation:
  language: zh_hans
  text: 现在听着！你们这些人说：“今天或明天，我们要到这座城去，在那里住一年，做生意赚钱。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄγε νῦν
  choice: 现在听着
  rationale: 这是引起注意并带有责备意味的惯用语。“现在听着”在现代汉语中直接自然，保留了原文劝诫、质问的力度。
- source_word: οἱ λέγοντες
  choice: 你们这些说……的人
  rationale: 带冠词的分词在此具有呼语功能，雅各直接面对所责备的人；这一译法比“那些说……的人”更能体现直接称呼。
- source_word: Σήμερον ἢ αὔριον
  choice: 今天或明天
  rationale: ἢ 是表示选择的连词，应译为“或”，保留说话者对近期行程作出确定规划的语气。
- source_word: πορευσόμεθα
  choice: 我们要……去
  rationale: πορεύομαι 在此表示前往某地；“要……去”是自然的现代汉语，也传达将来计划。
- source_word: εἰς τήνδε τὴν πόλιν
  choice: 到这座城
  rationale: τήνδε 是指示词，指说话者计划中的某座特定城市。“到这座城”既贴近原文，也符合现代汉语表达。
- source_word: ποιήσομεν ἐκεῖ ἐνιαυτόν
  choice: 在那里住一年
  rationale: ποιέω 加时间宾语在这里是“度过一段时间”的习语；结合前往某城经商的语境，“住一年”清楚自然，不机械直译为“做一年”。
- source_word: ἐμπορευσόμεθα
  choice: 做生意
  rationale: 该动词指从事贸易或商业活动；“做生意”准确且为普通现代读者熟悉。
- source_word: κερδήσομεν
  choice: 赚钱
  rationale: 在商业语境中，该词指获得经济收益。“赚钱”简洁自然；相较“获利”，更贴近日常计划中的直接口吻。
theological_decisions:
- issue: 责备性呼语的语气
  choice: 采用直接称呼“你们这些说……的人”
  alternative: 译作较为客观的“那些说……的人”
  rationale: 原文以带冠词的分词配合“Ἄγε νῦν”直接责备听众。保留直接称呼可呈现雅各当面对自恃计划者发言的修辞力量，而不额外引入神学判断。
- issue: 计划者话语的确定语气
  choice: 用连续的“要……住……做……”表达自信安排
  alternative: 加入“打算”“可能”等较弱表达
  rationale: 一连串将来时表达说话者笃定的计划，而下一节才揭示其对明日的无知。本节不宜提前弱化这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“现在听着”体现责备性的开场；引语保持商旅计划的口语流畅度。原文“这座城”予以保留，不改成较具解释性的“某某城”。
