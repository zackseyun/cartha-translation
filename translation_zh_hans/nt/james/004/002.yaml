  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐπιθυμεῖτε, καὶ οὐκ ἔχετε· φονεύετε καὶ ζηλοῦτε, καὶ οὐ δύνασθε ἐπιτυχεῖν· μάχεσθε καὶ πολεμεῖτε. οὐκ ἔχετε διὰ τὸ μὴ αἰτεῖσθαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/002.yaml
  text: You desire and do not have[a]; you murder and envy and are not able to obtain; you fight and wage war[d][c][b]. You do not have because you do not ask.
translation:
  language: zh_hans
  text: 你们贪求[a]，却得不到；你们杀人[b]，又嫉妒[c]，却不能得着；你们争斗，又交战。你们得不到，是因为你们不求[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “贪求”也可译作“渴求”；原文表示强烈欲望，在这里的语境中通常含有不正当欲求的意味。
    reason: lexical_alternative
  - marker: b
    text: “杀人”也可译作“杀害”。原文用词通常特指非法夺取人命；有些人把这里理解为修辞性的强烈说法，但正文保留了原词的力度。
    reason: lexical_alternative
  - marker: c
    text: “嫉妒”也可译作“妒忌”。
    reason: lexical_alternative
  - marker: d
    text: 从上下文看，“求”是指向神祈求，但本节原文没有明说所求的对象。
    reason: cross_reference
lexical_decisions:
- source_word: ἐπιθυμεῖτε
  choice: 贪求
  rationale: 该词表示强烈欲望；本节的冲突语境使其带有不正当欲求的意味。“贪求”自然传达这种负面色彩，同时不像“贪恋”那样容易被限定为情欲或特定对象。
- source_word: οὐκ ἔχετε
  choice: 得不到
  rationale: ἔχω本义为“有”，但这里与欲求某物及后文“得着”相连；中文用“得不到”能自然表达求而不得，又不必补出原文未明说的宾语。
- source_word: φονεύετε
  choice: 杀人
  rationale: φονεύω通常指非法夺取人命，语义强烈。现代汉语“杀人”保留其直截了当的力度；是否为修辞性或比喻性说法留给解释，不在正文中软化。
- source_word: ζηλοῦτε
  choice: 嫉妒
  rationale: ζηλόω可表示热心，也可表示嫉妒；在欲求落空、杀人和争战的负面语境中，“嫉妒”最为贴切。
- source_word: οὐ δύνασθε ἐπιτυχεῖν
  choice: 却不能得着
  rationale: ἐπιτυγχάνω表示达到、获得所追求的目标。“得着”保留取得目标之意，并与前面的“得不到”形成自然呼应。
- source_word: μάχεσθε
  choice: 争斗
  rationale: μάχομαι可指打斗或争吵。“争斗”既可涵盖言语冲突，也可涵盖实际冲突，避免过早缩窄。
- source_word: πολεμεῖτε
  choice: 交战
  rationale: πολεμέω带有战争、敌对作战的较强意味。“交战”与“争斗”并列，保留原文冲突程度的加强。
- source_word: διὰ τὸ μὴ αἰτεῖσθαι ὑμᾶς
  choice: 是因为你们不求
  rationale: διά加带冠词不定式表达原因。“求”在此自然指祈求；所求对象从上下文可知是神，但原文在本节没有明说，因此正文不补出。
theological_decisions:
- issue: 是否弱化φονεύετε的严厉措辞
  choice: 正文保留“杀人”
  alternative: 杀害；心里杀人；彼此仇恨
  rationale: 原词本身强烈，翻译不应因可能存在的夸张、修辞或比喻解释而预先弱化，也不应加入“心里”等原文没有的限定。
- issue: 是否在“不求”后明确补出神为对象
  choice: 不在正文补出对象
  alternative: 不向神祈求
  rationale: 上下文表明神是隐含的祈求对象，但本节希腊文没有明说。保留隐含状态，避免把合乎语境的推论写入正文。
- issue: ζηλοῦτε在此是“热心”还是“嫉妒”
  choice: 采用负面意义“嫉妒”
  alternative: 热切追求；妒忌
  rationale: 它与贪求、杀人以及争战并列，明显处于负面伦理语境；“嫉妒”既符合语义，也不额外指定嫉妒的对象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。分号保留希腊文连续指控的推进关系；“争斗、交战”保留两个近义动词及后者更强的战争色彩。脚注标记均紧随相关正文，其中[b][c]分别说明“杀人”和“嫉妒”。
