revisions:
- from: 所以，人若知道该行的善，却不去行，这对他就是罪。[a]
  to: 所以，人若知道该做的善事，却不去做，这对他就是罪。[a]
  rationale: 修订仅改善现代普通话的自然度并澄清“知道”的对象：不是仅知道如何行善，而是知道某善事是自己该做的。正文仍保留原文的推论连接、泛指单数、个人参照和“罪”的广泛伦理判断；脚注提供较贴近原文分词结构的替代译法。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:56:48Z'
review_pass:
  verdict: revise
  source_fidelity: 译文准确传达了οὖν的推论关系，以及“明知善而不行即为罪”的一般性原则。不过“该行的善”在现代汉语中搭配不够自然；将其改为“该做的善事”可更清楚地表达καλὸν ποιεῖν所指的应行之善，同时不把范围限定于某一具体情境。
  naturalness: “人若知道该行的善”略显生硬，尤其“行的善”不合现代普通话的常用搭配。“人若知道该做的善事，却不去做”庄重、清晰且自然。
  terminology: “罪”准确对应ἁμαρτία，并保留其性质性判断；“这对他就是罪”恰当地表达αὐτῷ的个人参照。避免使用带特定神学体系色彩的术语是合宜的。
  issues:
  - severity: medium
    issue: “该行的善”搭配不自然，且“行”重复使用造成表达滞涩。
    rationale: 现代汉语通常说“该做的善事”或“应当行的善事”。改为“该做的善事……不去做”既保留知而不行的对照，也提高可读性。
  - severity: low
    issue: 脚注的“知道行善”可能被理解为“知道如何行善”，未充分显出所知的是应当实行的善。
    rationale: 脚注宜改为以句法替换为主的译法，如“知道该行善而不去行的人”，以保留原文分词结构及泛指个人的含义。
  revised_text: 所以，人若知道该做的善事，却不去做，这对他就是罪。[a]
  revised_footnotes:
