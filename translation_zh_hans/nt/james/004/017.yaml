  text: εἰδότι οὖν καλὸν ποιεῖν καὶ μὴ ποιοῦντι, ἁμαρτία αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/017.yaml
  text: So[a], for the one who knows to do good and does not do it, it is sin for him.
translation:
  language: zh_hans
  text: 所以，人若知道该做的善事，却不去做，这对他就是罪。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所以，知道该行善而不去行的人，这对他就是罪。”
    reason: 以“知道……的人”呈现原文作实体用法的单数分词，并保留“知而不行”的概括性表达。
lexical_decisions:
- source_word: εἰδότι
  choice: 人若知道
  rationale: 该词是与格单数分词，在此作实体用法，泛指任何知道者。汉语用“人若知道”自然表达其一般性，并与后面的条件性陈述顺畅衔接。
- source_word: οὖν
  choice: 所以
  rationale: 表示从上文所得出的推论；“所以”既清楚连接前文，也符合现代汉语表达。
- source_word: καλὸν ποιεῖν
  choice: 该行的善
  rationale: καλόν 指道德上美善、正确之事，ποιεῖν 表示实行。译作“该行的善”保留“善”的广泛伦理含义，同时传达所知道的善具有应当实行的意味；这一义理上的显化另以脚注说明。
- source_word: μὴ ποιοῦντι
  choice: 却不去行
  rationale: 与前面的“知道”形成鲜明对照，并承接“该行的善”；“却”自然呈现知而不行的反差。
- source_word: ἁμαρτία
  choice: 罪
  rationale: 此处为无冠词的表语名词，可带性质性的意味；译作“罪”直接说明这种不作为属于罪，而不把含义缩窄为某一种特定罪行。
- source_word: αὐτῷ ἐστιν
  choice: 这对他就是
  rationale: αὐτῷ 是关系或参照与格，意为就此人而言；“对他就是”保留个人适用性。“这”回指明知善而不行之事。
theological_decisions:
- issue: 明知善而不行这一陈述的范围
  choice: 译文表达一个广泛适用的伦理原则，同时以“所以”保留其与上文自夸式筹划的推论关系。
  alternative: 只把本节限定为针对上文自负地规划未来；或明确将其术语化为一套“疏忽之罪”的教义。
  rationale: 上下文直接涉及忽视主旨意、自负筹划，但本句措辞具有概括性。译文不将其限制于单一情境，也不加入原文没有的宗派性或系统神学术语。
- issue: “该行”是否属于原文明说
  choice: 正文采用“该行的善”以自然表达知道某善而负有实行责任的语境，并用脚注保留较直译的可能。
  alternative: 译作“知道行善”，不明确表达“应当”的意味。
  rationale: 原文直译接近“知道去行善”，并无独立的“应当”一词；但全句将明知而不行判定为罪，蕴含责任。脚注使读者看见形式上更贴近原文的译法，避免把隐含义当作明文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“知善而不行”虽简练，但略带文言色彩，故正文展开为“知道该行的善，却不去行”。保留单数泛指的个人指向，以“人若……对他……”表达。
