  text: ἢ δοκεῖτε ὅτι κενῶς ἡ γραφὴ λέγει· Πρὸς φθόνον ἐπιποθεῖ τὸ πνεῦμα ὃ ⸀κατῴκισεν ἐν ἡμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/005.yaml
  text: Or do you think that the Scripture speaks in vain? The Spirit whom he caused to dwell in us yearns jealously[a].
translation:
  language: zh_hans
  text: 你们难道以为，经上说这话是徒然的吗？“他使住在我们里面的圣灵切切渴慕，怀着嫉妒之情[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他使住在我们里面的灵，带着妒忌切切渴望。”希腊文的“灵”既可能指圣灵，也可能指人的灵；译作“怀着嫉妒之情”的短语也可表示负面的“带着妒忌”。
    reason: 保留原文在“灵”的所指及φθόνος相关措辞的道德色彩上的真实歧义。
lexical_decisions:
- source_word: κενῶς
  choice: 徒然
  rationale: 这里修饰“说”，表示经上的话并非空洞、无效或毫无目的；“徒然”简洁庄重，也保留反问的力度。
- source_word: ἡ γραφὴ
  choice: 经上
  rationale: 这是现代汉语圣经语体中自然且易懂的表达，指具有权威性的圣经话语；结合后面的引文译作“经上这话”。
- source_word: Πρὸς φθόνον
  choice: 怀着嫉妒
  rationale: 该短语含义困难，可表示带着嫉妒或趋向嫉妒。正文按圣灵为所指者理解为强烈而专一的嫉妒之爱，但不消除其也可指负面“妒忌”的词义，另在脚注说明。
- source_word: ἐπιποθεῖ
  choice: 切切渴慕
  rationale: 该动词表示强烈的向往、渴望；“切切渴慕”既传达强度，也保持庄重而自然的经文语体，并未补出希腊文没有明说的宾语。
- source_word: τὸ πνεῦμα
  choice: 圣灵
  rationale: 正文采用圣灵的理解，因为“他使住在我们里面”自然令人想到上帝使圣灵内住；但希腊文也可能指人的灵，因此用脚注保留这一真实歧义。
- source_word: κατῴκισεν
  choice: 使住
  rationale: 保留 κατοικίζω 的使役意义，而不是仅译为“住”；同时避免在原文没有明说之处直接补出施事者“上帝”。
- source_word: ἐν ἡμῖν
  choice: 在我们里面
  rationale: 按内住来理解，比“在我们中间”更符合正文所采用的圣灵内住之义。
theological_decisions:
- issue: τὸ πνεῦμα 所指的是谁
  choice: 正文译为“圣灵”，指上帝使之住在信徒里面的圣灵。
  alternative: 也可译为“他使住在我们里面的灵”，指上帝所赋予人的灵。
  rationale: 语法容许两种理解。正文采用圣灵的读法，因为使其住在我们里面的措辞与新约的圣灵内住语言相合；但不把这一判断说成毫无歧义，故在脚注中保留人的灵这一读法。
- issue: φθόνος 相关措辞的道德色彩
  choice: 译为“怀着嫉妒”，在圣灵读法下表达对属他之人的专一而强烈的渴慕。
  alternative: 也可理解为人的灵“带着妒忌渴望”，含负面的羡慕、嫉妒之意。
  rationale: φθόνος 通常可有负面意义，但本句与 πνεῦμα 的所指一样存在争议。正文不以解释性增译消除张力，脚注则明确另一种可能。
translation_notes:
  register: 采用现代、庄重且普通读者可懂的书面汉语。“徒然说”“切切渴慕”保留经文语体而不过度古雅；不补出渴慕的宾语，也不在正文直接补称“上帝”，以免超出希腊文。
