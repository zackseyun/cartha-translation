id: JAS.4.3
reference: James 4:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: αἰτεῖτε καὶ οὐ λαμβάνετε, διότι κακῶς αἰτεῖσθε, ἵνα ἐν ταῖς ἡδοναῖς ὑμῶν δαπανήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/003.yaml
  text: You ask and do not receive[a], because you ask wrongly[b], so that you may spend it on your pleasures.
translation:
  language: zh_hans
  text: 你们祈求，却得不到；因为你们祈求不当[a]，是想把所得的花在自己的享乐上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“怀着错误的动机祈求”。原词也可表示“以错误的方式”。
    reason: lexical_alternative
  - marker: b
    text: “享乐”也可指自我放纵的欲望或情欲；本句也可译作“耗费在自己的私欲中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτεῖτε / αἰτεῖσθε
  choice: 祈求
  rationale: 两处动词均指提出请求；上下文表明这是祷告中的祈求。“祈求”在现代汉语中自然地传达这一语境，同时不在正文中明说受求者是上帝，并保留原文的重复。
- source_word: οὐ λαμβάνετε
  choice: 却得不到
  rationale: λαμβάνω在此表示领受、得到所求之物。“得不到”是现代汉语中与“祈求”搭配最自然的表达。
- source_word: διότι
  choice: 因为
  rationale: 清楚表达原文说明未能得到之原因的因果关系。
- source_word: κακῶς
  choice: 不当
  rationale: κακῶς表示以错误、不好的方式行事。“不当”保留其较宽泛的道德和方式含义，不把它过早限定为仅指动机；后面的目的从句进一步说明问题所在。
- source_word: ἵνα
  choice: 是想
  rationale: 此处引出祈求背后的目的。“是想”符合现代汉语表达，也保留目的意味。
- source_word: δαπανήσητε
  choice: 把所得的花在
  rationale: 该动词表示花费、耗用。原文没有明说宾语，但语境所指是他们想得到之物；汉语补出“所得的”可使句子完整自然，而不增加新的所指。“花在”比“挥霍”更中性，避免加入动词本身未必具有的强化评价。
- source_word: ἐν ταῖς ἡδοναῖς ὑμῶν
  choice: 在自己的享乐上
  rationale: ἡδονή可指享乐，也可带有放纵欲望的意味。“享乐”保留基本词义；“自己的”自然表达复数第二人称所属关系。
theological_decisions:
- issue: 是否明说祈求的对象是上帝
  choice: 不在正文中补出“上帝”，译作“你们祈求”
  alternative: 你们向上帝祈求
  rationale: 上下文强烈暗示祷告，但本节希腊文没有明说对象；保持含蓄可避免在正文中加入原文没有的词。
- issue: 是否把κακῶς限定为错误动机
  choice: 正文译作“祈求不当”
  alternative: 怀着错误的动机祈求
  rationale: 该副词的意义比“动机错误”更宽；随后“是想……”的目的从句已经说明这种祈求为何不当。
- issue: 如何表达ἡδοναῖς的负面色彩
  choice: 正文用“享乐”，由上下文和脚注呈现其自我放纵的可能含义
  alternative: 私欲；放纵的欲望
  rationale: “私欲”会把词义直接收窄到欲望并加强道德判断；“享乐”更贴近基本词义，同时仍让本节的负面语境发挥作用。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号呈现“祈求—得不到”与原因说明之间的关系；重复“祈求”以保留希腊文平行结构。
