id: JAS.4.12
reference: James 4:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἷς ⸀ἐστιν νομοθέτης ⸂καὶ κριτής⸃, ὁ δυνάμενος σῶσαι καὶ ἀπολέσαι· σὺ δὲ τίς εἶ, ⸂ὁ κρίνων⸃ τὸν ⸀πλησίον;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/012.yaml
  text: There is one Lawgiver and Judge, the one who is able to save and to destroy. But who are you, judging your neighbor?
translation:
  language: zh_hans
  text: 立法者和审判者只有一位，就是那能拯救、也能毁灭的。可是，你是谁，竟审判邻舍呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νομοθέτης
  choice: 立法者
  rationale: 直接表达制定律法并拥有权威者，符合本节司法语境，也保留与前文“律法”的联系。
- source_word: κριτής
  choice: 审判者
  rationale: 与后文“审判”保持词根层面的呼应，并体现作出裁决者的身份。
- source_word: σῶσαι
  choice: 拯救
  rationale: 保留其广泛而带有神学分量的含义，不限缩为脱离某一种具体危险。
- source_word: ἀπολέσαι
  choice: 毁灭
  rationale: 表达使之灭亡的强烈含义，与“拯救”形成原文中的鲜明对照。
- source_word: πλησίον
  choice: 邻舍
  rationale: 采用现代中文圣经语域中通行且含义宽广的称谓，指与自己相关的他人，并非仅指住处相邻者。
- source_word: ὁ κρίνων
  choice: 竟审判
  rationale: 以“竟”体现原文分词短语所带的责问意味，同时不把它改写成单纯的能力或权利命题。
theological_decisions:
- issue: “一位”所指的身份
  choice: 不补出“神”或其他专名
  alternative: 只有神是立法者和审判者
  rationale: 原文以“一位”及其能力描述身份，并未在本句明说名称；直译可保留其修辞力度及上下文推断空间。
- issue: 拯救与毁灭的范围
  choice: 不限定为今生、末世或永恒结局
  alternative: 能使人得救，也能使人永远灭亡
  rationale: 原文动词本身未明示时间和范围，译文应保留这种开放性。
- issue: 末句责问的句法力度
  choice: 译为“你是谁，竟审判邻舍呢？”
  alternative: 你有什么资格审判邻舍呢？
  rationale: 前者保留原文“你是谁”的直接责问，也以“竟”自然传达分词“审判着”的谴责意味，避免把原文完全解释为抽象的资格问题。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“立法者—审判者—审判”保持司法语义链；“邻舍”延续经文语域，但整句结构仍便于普通读者理解。
