  text: οἵτινες οὐκ ἐπίστασθε ⸀τὸ τῆς αὔριον ⸀ποία ἡ ζωὴ ὑμῶν· ἀτμὶς γάρ ⸀ἐστε ⸀ἡ πρὸς ὀλίγον φαινομένη, ⸀ἔπειτα καὶ ἀφανιζομένη·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/014.yaml
  text: You do not know what tomorrow will bring[a]. What is your life? For you are a mist that appears for a little while and then vanishes.
translation:
  language: zh_hans
  text: 你们不知道明天会发生什么。你们的生命是怎样的呢？你们是一阵雾气[a]，暂时显现，随后便消散。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“蒸汽”。
    reason: 保留ἀτμίς的主要词义替代，并反映其可指雾气或蒸汽的语义范围。
lexical_decisions:
- source_word: ἐπίστασθε
  choice: 知道
  rationale: 该动词表示知道或明白；这里强调人无法预知未来，“知道”最自然直接。
- source_word: τὸ τῆς αὔριον
  choice: 明天会发生什么
  rationale: 原文是省略式表达，指明天的情形或将发生的事；此译符合现代汉语，又没有过度扩展原意。
- source_word: ποία ἡ ζωὴ ὑμῶν
  choice: 你们的生命是什么呢？
  rationale: ποία询问生命的性质；保留简洁的反问形式，使下文的比喻直接作答。
- source_word: ἀτμὶς
  choice: 雾气
  rationale: 该词可指雾气或蒸气；“雾气”在现代汉语中形象自然，能表现生命短暂、难以持存的特点，并以脚注保留另一译法。
- source_word: πρὸς ὀλίγον
  choice: 片刻
  rationale: 该短语表示很短的一段时间；“片刻”简洁而有庄重感。
- source_word: φαινομένη
  choice: 出现
  rationale: 分词描写雾气暂时显现；“出现”自然地保留这一可见性意象。
- source_word: ἔπειτα καὶ ἀφανιζομένη
  choice: 随后就消散了
  rationale: ἔπειτα表达先后次序，ἀφανιζομένη表示不再可见；对于雾气，“消散”比一般的“消失”更贴合比喻。
theological_decisions:
- issue: 以雾气比喻人生的短暂与不确定
  choice: 保留“雾气”这一具体比喻，不把它改写为抽象的“生命转瞬即逝”
  alternative: 解释性地译作“你们的生命转瞬即逝”
  rationale: 上下文针对人夸口安排未来，重点在人的有限和生命的短暂；保留原有意象，既维持修辞力度，也不额外加入有关死亡或审判的教义解释。
translation_notes:
  register: 采用现代、自然而庄重的普通话。“其实”承接上下文并突出人的无知；“原是”引出反问的答案，但不增加原文以外的教义判断。
