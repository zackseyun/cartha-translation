id: JAS.4.4
reference: James 4:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀μοιχαλίδες, οὐκ οἴδατε ὅτι ἡ φιλία τοῦ κόσμου ἔχθρα τοῦ θεοῦ ἐστιν; ὃς ⸀ἐὰν οὖν βουληθῇ φίλος εἶναι τοῦ κόσμου, ἐχθρὸς τοῦ θεοῦ καθίσταται.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/004.yaml
  text: Adulteresses[a], do you not know that friendship with the world is hostility toward God? Therefore[d][c][b], whoever wants to be a friend of the world makes himself an enemy of God.
translation:
  language: zh_hans
  text: 你们这些犯奸淫的妇人们[a]！你们岂不知道，与世界为友，就是与上帝为敌吗？所以，凡想要作世界之友的[b]，就成为上帝的仇敌。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犯奸淫的妇人们”很可能是比喻说法，沿用先知书中以婚姻不忠描写人对上帝不忠的语言。
    reason: lexical_alternative
  - marker: b
    text: 这里的“世界”指与上帝敌对的人类秩序和价值，并非指上帝所造的万物本身。
    reason: cultural_note
  - marker: c
    text: “成为”也可理解为“使自己成为”；此处指人选择作世界之友所导致的身份与关系结果。
    reason: alternative_reading
lexical_decisions:
- source_word: μοιχαλίδες
  choice: 淫妇们
  rationale: 保留阴性复数呼格的具体、尖锐表达，不在正文中改写为“对上帝不忠的人”；此处很可能沿用先知传统，以婚姻不忠比喻属灵或盟约上的不忠。
- source_word: οὐκ οἴδατε
  choice: 你们岂不知道
  rationale: 自然传达否定疑问句的反问语气，比单纯的“你们不知道吗”更符合庄重而有力的中文表达。
- source_word: ἡ φιλία τοῦ κόσμου
  choice: 与世界为友
  rationale: 按中文习惯将抽象名词“友谊”转为关系性表达，同时保留其与后文 φίλος“朋友”的词义呼应。
- source_word: ἔχθρα τοῦ θεοῦ
  choice: 与上帝为敌
  rationale: τοῦ θεοῦ 可表达针对上帝的敌对，也可理解为与上帝处于敌对关系；此译自然，并避免将其收窄为主观的“憎恨上帝”。
- source_word: ὃς ἐὰν οὖν
  choice: 所以，凡……的
  rationale: “所以”传达 οὖν 的推论作用，“凡……的”传达不定关系从句的普遍范围。
- source_word: βουληθῇ
  choice: 想要
  rationale: 准确表达 βούλομαι 的意愿和意向，不额外强化为已经作出的正式选择。
- source_word: φίλος εἶναι τοῦ κόσμου
  choice: 作世界之友
  rationale: 保留“朋友”的名词形式及其与前句的呼应；“之友”简洁庄重，又不至于过度古雅。
- source_word: καθίσταται
  choice: 使自己成为
  rationale: 在此语境中表达因所愿意采取的立场而进入某种身份或关系状态；同时以脚注保留较中性的“成为”。
theological_decisions:
- issue: μοιχαλίδες 的比喻意义与阴性形式
  choice: 正文直译为“淫妇们”，脚注说明其很可能比喻对上帝不忠。
  alternative: 不忠的人；属灵淫乱的人
  rationale: 直译保留原文刻意使用的阴性复数称呼和先知性冲击力；解释性替换会抹平其婚姻与盟约意象，也可能过早限定读者如何理解。
- issue: κόσμος 在本节中的所指
  choice: 正文译作“世界”，脚注说明这里并非指上帝所造的万物本身。
  alternative: 敌对上帝的世界体系；现今邪恶的秩序
  rationale: 原文只用 κόσμος，正文应保留其宽度；上下文表明这里所指的是与上帝敌对的人类价值和秩序，而不是受造界本身。
- issue: ἔχθρα τοῦ θεοῦ 的属格关系
  choice: 译作“与上帝为敌”。
  alternative: 敌视上帝；成为上帝敌视的对象
  rationale: 属格可容许“针对上帝的敌意”或“与上帝敌对”的关系性理解；中文“与上帝为敌”保留这种关系张力，不武断指定敌意仅从哪一方发出。
- issue: καθίσταται 的主体责任与状态变化
  choice: 正文译作“使自己成为”，脚注列出“成为”。
  alternative: 成为上帝的仇敌
  rationale: 上下文的 βουληθῇ 强调个人意愿，因此正文适度呈现其选择所导致的身份；但 καθίσταται 本身也可较中性地表示进入或处于某状态，故以脚注保留。
translation_notes:
  register: 采用现代、庄重而直接的普通话。“淫妇们”保留原文突兀而严厉的呼语；“岂不知道”体现反问力度；“作世界之友”与“上帝的仇敌”形成清楚对照。脚注标记均置于正文相关位置。
