revisions:
- from: 淫妇们[a]！你们岂不知道，与世界为友就是与上帝为敌吗？所以，凡想要作世界之友的，就是使自己成为上帝的仇敌。[b]
  to: 你们这些犯奸淫的妇人们[a]！你们岂不知道，与世界为友，就是与上帝为敌吗？所以，凡想要作世界之友的[b]，就成为上帝的仇敌。[c]
  rationale: 修订以“犯奸淫的妇人们”更准确表达 μοιχαλίδες 的词汇意义、阴性复数和严厉呼语，同时以脚注保留其很可能具有盟约不忠的比喻功能。末句改译为“就成为”以避免把 καθίσταται 的反身主动含义写得过强；脚注仍说明该译法的可能结果性。脚注锚点现分别对应称呼、‘世界’和末句动词。
