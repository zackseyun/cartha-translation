  text: μείζονα δὲ δίδωσιν χάριν· διὸ λέγει· Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται ταπεινοῖς δὲ δίδωσιν χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/006.yaml
  text: But he gives greater grace. Therefore it says[a], “God opposes the proud, but gives grace to the humble.”
translation:
  language: zh_hans
  text: 但他赐下更大的恩典。因此说[a]：“上帝敌挡骄傲的人，却赐恩典给谦卑的人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文没有明说“说”的主语；也可译作“因此他说”或“因此经上说”。
    reason: alternative_reading
lexical_decisions:
- source_word: μείζονα
  choice: 更大的
  rationale: 保留比较级的明确力度，并与“恩典”自然搭配；相较“更多”，也较少把恩典表达成可计量之物。
- source_word: δίδωσιν χάριν
  choice: 赐下恩典／赐恩典
  rationale: “赐”符合现代庄重汉语，也保留本节两次出现的“给予恩典”这一重复；首句加“下”使行文自然，引文中用“赐恩典”保持凝练。
- source_word: διὸ
  choice: 因此
  rationale: 清楚表达由前一句引出的推论关系。
- source_word: λέγει
  choice: 经上说
  rationale: 这是自然的经文引述语，但希腊文没有明说主语，故以脚注注明也可理解为“他说”或“有话说”。
- source_word: ὑπερηφάνοις
  choice: 骄傲的人
  rationale: 表达此处形容词名词化的群体指称，并与“谦卑的人”构成清楚对照。
- source_word: ἀντιτάσσεται
  choice: 敌挡
  rationale: 传达主动站在对立面、加以抗拒的力度；语体庄重而仍为现代读者所理解。
- source_word: ταπεινοῖς
  choice: 谦卑的人
  rationale: 在本段伦理语境中自然表达谦卑者，避免“卑微的人”过度偏向社会地位。
- source_word: δὲ
  choice: 但／却
  rationale: 分别以“但”和“却”呈现本节开头及引文内部的转折对比，使中文流畅而保留修辞结构。
theological_decisions:
- issue: λέγει的引述公式主语
  choice: 正文采用“经上说”，并加脚注说明主语未明说
  alternative: “他说”或“有话说”
  rationale: 上下文显然引入经文引述，但希腊文只写“说”，主语隐含。正文采用自然清楚的汉语引述公式，同时借脚注保存原文的语法歧义，避免把某一主语解释绝对化。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“上帝”用于ὁ θεός；引文保持“骄傲的人／谦卑的人”的平行对照。正文中的[a]与脚注对应。
