  text: ἐγγίσατε τῷ θεῷ, καὶ ⸀ἐγγιεῖ ὑμῖν. καθαρίσατε χεῖρας, ἁμαρτωλοί, καὶ ἁγνίσατε καρδίας, δίψυχοι.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/008.yaml
  text: Draw near to God[a], and he will draw near to you. Cleanse your hands, sinners, and purify your hearts, double-minded people.
translation:
  language: zh_hans
  text: 你们要亲近上帝，上帝就会亲近你们。罪人哪，要洁净你们的手；三心二意的人哪[a]，要净化你们的心。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按原文构词，直译为“有两个灵魂的人”，指内心的忠诚或委身摇摆、分裂的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίσατε
  choice: 亲近
  rationale: 第二人称复数不定过去时主动命令式。这里不只是空间上的靠近，也表达人与上帝关系上的趋近；“亲近”自然庄重，并可与下句同一动词形成呼应。
- source_word: τῷ θεῷ
  choice: 上帝
  rationale: ἐγγίζω所支配的与格对象，直接译出。采用现代汉语中清楚、通行的称谓“上帝”。
- source_word: ἐγγιεῖ
  choice: 会亲近
  rationale: 第三人称单数将来时主动直陈式，主语承接前句的“上帝”。重复“亲近”以保留原文鲜明的平行结构；“会”表达应许性的将来结果。
- source_word: καθαρίσατε
  choice: 洁净
  rationale: 第二人称复数不定过去时主动命令式。“洁净”既保留洁净礼仪的语感，也可承载道德含义，不把意象解释性改写为行为。
- source_word: χεῖρας
  choice: 你们的手
  rationale: 保留“手”的身体意象及其可能指向外在行为的象征意义；汉语补出领属语“你们的”更自然。
- source_word: ἁμαρτωλοί
  choice: 罪人哪
  rationale: 复数呼格，保留直接而尖锐的责备。“哪”清楚标示呼语，并符合庄重的劝诫语体。
- source_word: ἁγνίσατε
  choice: 使……纯洁
  rationale: 与καθαρίσατε有所区别，以保留雅各的用词变化。“使……纯洁”自然表达内在净化，同时避免两处都译作“洁净”。
- source_word: καρδίας
  choice: 你们的心
  rationale: “心”在此指人的内在生命、动机和忠诚。现代汉语通常以单数集合表达复数对象各自的心，且保留原文意象。
- source_word: δίψυχοι
  choice: 三心二意的人
  rationale: 该复数呼格形容内在忠诚分裂、摇摆不定的人。“三心二意”是现代汉语易懂的惯用表达；脚注保留原文更形象的字面构词。
theological_decisions:
- issue: 洁净命令中的身体意象与伦理含义
  choice: 保留“手”和“心”的意象，不在正文中解释为外在行为和内在动机。
  alternative: 意译为“改正你们的行为，洁净你们的动机”。
  rationale: 原文的洁净语言可能兼有礼仪与道德回响。保留身体意象，可避免把其神学张力缩减为单一解释。
- issue: δίψυχοι所表达的内在分裂
  choice: 正文译为“三心二意的人”，脚注说明其字面构词。
  alternative: 译为“心怀二意的人”或“有两个灵魂的人”。
  rationale: “三心二意”能让普通现代读者立即理解忠诚或内心委身的分裂；脚注则保存希腊词“两魂”的鲜明形象，避免完全抹平原文特色。
- issue: 上帝亲近人的陈述性质
  choice: 按将来时直译为“上帝就会亲近你们”。
  alternative: 解释为无条件的普遍临在，或特定的救恩次序。
  rationale: 正文保留命令与应许之间的原文关系，不额外建构因果机制，也不导入宗派性的救恩解释。
translation_notes:
  register: 采用自然、庄重且适合公开诵读的现代标准普通话。以分号呈现“洁净手／使心纯洁”的平行劝诫，并用两个呼语保持原文直接的责备语气。正文脚注标记[a]紧随其所解释的“三心二意的人哪”。
