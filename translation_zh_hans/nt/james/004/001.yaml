  text: Πόθεν πόλεμοι καὶ ⸀πόθεν μάχαι ἐν ὑμῖν; οὐκ ἐντεῦθεν, ἐκ τῶν ἡδονῶν ὑμῶν τῶν στρατευομένων ἐν τοῖς μέλεσιν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/001.yaml
  text: From where come wars and from where come fights among you? Is it not from here—from your pleasures that wage war in your members?[a][b][c]
translation:
  language: zh_hans
  text: 你们中间的争战从哪里来，争斗又从哪里来？[a][b]不正是从那些在你们肢体中交战的享乐而来的吗？[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “争战……争斗”也可译作“冲突……争吵”。希腊文使用的两个词本义带有军事色彩，在这里用于描述群体内部的纷争。
    reason: lexical_alternative
  - marker: b
    text: “你们中间”也可译作“你们里面”。希腊文可以指读者彼此之间，也可以指他们里面；全节把外在纷争与内在欲望联系起来。
    reason: alternative_reading
  - marker: c
    text: “肢体”是直译，可以指身体各部分，也可较广义地指人在身体中发挥作用的各种能力。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πόθεν
  choice: 从哪里来
  rationale: 保留询问来源的语义，并以“又”自然呈现原文重复使用该疑问副词所形成的修辞力度。
- source_word: πόλεμοι
  choice: 争战
  rationale: 保留军事性意象及其强烈语气，同时在现代汉语中可自然用于群体内部的严重冲突。
- source_word: μάχαι
  choice: 争斗
  rationale: 与“争战”形成有区别而相互呼应的词组，既保留原文的军事色彩，也符合本节群体纷争的语境。
- source_word: ἐν ὑμῖν
  choice: 你们中间
  rationale: 此处首先指读者群体中的人际冲突；脚注同时保留“你们里面”这一可能理解。
- source_word: οὐκ ἐντεῦθεν
  choice: 不正是从……来的吗
  rationale: 以汉语反问句表达原文预期肯定回答的语气，并自然引出随后说明的根源。
- source_word: ἡδονῶν
  choice: 享乐欲
  rationale: 兼顾ἡδονή的“享乐、快感”语义及这里能发动争战的欲求性质；避免采用带有特定神学传统色彩、含义过宽的“私欲”。
- source_word: στρατευομένων
  choice: 交战
  rationale: 保留持续进行的军事意象，并与前面的“争战”相呼应。
- source_word: ἐν τοῖς μέλεσιν ὑμῶν
  choice: 在肢体中
  rationale: 保留μέλη的身体隐喻，不把它预先收窄为肉体器官，也不直接释义为抽象的内心活动。
theological_decisions:
- issue: 开头的冲突应理解为群体纷争，还是人内在的冲突
  choice: 正文将第一个ἐν ὑμῖν译为“你们中间”，将后面的ἐν τοῖς μέλεσιν ὑμῶν译为“在肢体中”，从而把外在纷争与内在欲望联系起来。
  alternative: 两处都作内在理解，分别译为“在你们里面”和“在你们里面”。
  rationale: 上下文指向信徒群体中的争斗，同时又追溯其在人里面的根源；译文保留这两层之间的张力，不将本节简化为纯粹社会性的冲突或纯粹心理性的斗争。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“争战／争斗／交战”维持原文贯穿全句的军事意象；“享乐欲”比单用“享乐”更能在汉语中表达这些享乐正在驱动人的行动，同时仍紧扣原词的享乐、快感语义。所有歧义均在正文或脚注中保留。
