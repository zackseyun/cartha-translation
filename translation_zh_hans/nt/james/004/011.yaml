source:
  edition: SBLGNT
  text: Μὴ καταλαλεῖτε ἀλλήλων, ἀδελφοί· ὁ καταλαλῶν ἀδελφοῦ ⸀ἢ κρίνων τὸν ἀδελφὸν αὐτοῦ καταλαλεῖ νόμου καὶ κρίνει νόμον· εἰ δὲ νόμον κρίνεις, οὐκ εἶ ποιητὴς νόμου ἀλλὰ κριτής.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/011.yaml
  text: Do not speak against one another[a], brothers. The one who speaks against a brother or judges his brother speaks against the law and judges the law. But if you judge the law[b], you are not a doer of the law but a judge.
translation:
  language: zh_hans
  text: 弟兄们[b]，不要彼此诋毁[a]。诋毁弟兄或评断自己弟兄的人，就是诋毁律法、评断律法的人。你若评断律法，就不是遵行律法的人，而是评判者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“说彼此的坏话”；希腊文动词可指以损害他人名誉的方式说人坏话。
    reason: lexical_alternative
  - marker: b
    text: 这里的“弟兄们”在希腊文中是阳性复数形式，很可能是对整个群体的称呼，包括弟兄和姊妹。
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλαλεῖτε / καταλαλῶν / καταλαλεῖ
  choice: 诋毁
  rationale: 原词指以敌意或损害名誉的方式说人坏话。“诋毁”自然、庄重，并在本节三处保持同一用词，从而保留作者刻意的重复；同时不像法律意义上的“诽谤”那样过窄。
- source_word: ἀλλήλων
  choice: 彼此
  rationale: 准确表达相互关系，也符合现代汉语劝诫语体。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊文阳性复数称呼及雅各书中的家庭隐喻；其所指很可能包括整个信徒群体，故以脚注说明。
- source_word: ἀδελφοῦ / τὸν ἀδελφὸν αὐτοῦ
  choice: 弟兄 / 自己弟兄
  rationale: 保留原文单数形式和家人隐喻，并与开头的称呼一致；不解释性地改写为“信徒”。
- source_word: ἢ
  choice: 或
  rationale: 按所给SBLGNT文本作选择关系，呈现诋毁弟兄与评断弟兄这两个平行行为。
- source_word: κρίνων / κρίνει / κρίνεις / κριτής
  choice: 评断 / 评断……的人
  rationale: “评断”既能用于弟兄，也能用于律法，因而保留本节反复出现的词根联系。末句用“评断律法的人”自然表达名词κριτής，并清楚呈现与“遵行律法的人”的对比，而不把含义缩窄为正式司法审判。
- source_word: νόμου / νόμον
  choice: 律法
  rationale: 上下文所指是具有规范性的神圣律法，而不是抽象的一般法律；不在正文进一步限定为摩西律法、至尊的律法或神的律法。
- source_word: ποιητὴς
  choice: 遵行……的人
  rationale: 用现代汉语自然表达“实行者、行道者”的含义，并保留雅各书所强调的遵行与仅仅评断之间的对照。
theological_decisions:
- issue: ἀδελφοί所称呼的群体范围
  choice: 正文译作“弟兄们”，脚注说明很可能包括姊妹。
  alternative: 弟兄姊妹；众弟兄姊妹
  rationale: 原文形式为阳性复数，但在当时的群体称呼中很可能涵盖男女。正文保留原文形式，脚注帮助现代读者理解其包容范围。
- issue: “律法”的具体所指
  choice: 只译作“律法”，不在正文进一步界定。
  alternative: 摩西律法；至尊的律法；神的律法
  rationale: 雅各书的上下文可能特别令人想到爱邻舍的诫命及神的道德要求，但本节本身没有明确缩小范围，因此保留原文的神学张力和广度。
- issue: “评断律法”的含义
  choice: 保留原文措辞，不解释为废除、定罪或凌驾于律法之上。
  alternative: 定律法的罪；把自己置于律法之上
  rationale: 这些解释可能说明作者的论证，却超过本节明说的内容；直译能够保留读者对其逻辑关系的思考空间。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“诋毁—评断—律法”的重复尽量对应原文论证链条。末句将κριτής展开为“评断律法的人”，以避免“审判者”在现代汉语中造成正式司法身份或专指神的误解。
