id: JAS.4.15
reference: James 4:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀντὶ τοῦ λέγειν ὑμᾶς· Ἐὰν ὁ κύριος ⸀θελήσῃ, καὶ ⸀ζήσομεν καὶ ⸀ποιήσομεν τοῦτο ἢ ἐκεῖνο.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/015.yaml
  text: Instead, you ought to say, “If the Lord wills, we will live and also do this or that.”
translation:
  language: zh_hans
  text: 你们倒应当说[a]：“主若愿意，我们就会活着，也会做这事或那事。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更直译为“而不是你们说”。
    reason: 保留 ἀντὶ τοῦ 加不定式结构的字面形式，同时正文采用符合汉语习惯的纠正性表达。
lexical_decisions:
- source_word: ἀντὶ τοῦ λέγειν ὑμᾶς
  choice: 你们倒应当说
  rationale: 该结构直译为“而不是你们说”，承接上一节并带有纠正意味。译作“你们倒应当说”在现代汉语中自然地表达原文隐含的劝正语气；脚注保留较直译的形式。
- source_word: Ἐὰν
  choice: 若
  rationale: 与虚拟语气动词连用，引出真实可能的条件；“若”简洁、庄重，符合本节语体。
- source_word: ὁ κύριος
  choice: 主
  rationale: κύριος 按其通常宗教语境译为“主”，不进一步限定所指。
- source_word: θελήσῃ
  choice: 愿意
  rationale: θέλω 在此表达意愿。“愿意”既准确又是自然的现代汉语，没有额外强化为预定或命令。
- source_word: καὶ ζήσομεν
  choice: 我们就会活着
  rationale: 未来时表明能否继续活着也取决于主的意愿；“就会”自然承接条件句。
- source_word: καὶ ποιήσομεν
  choice: 也会做
  rationale: ποιέω 在此泛指实行计划，译作“做”最直接；“也”体现第二个 καί，并把活着与行事并列。
- source_word: τοῦτο ἢ ἐκεῖνο
  choice: 这事或那事
  rationale: 保留原文不特指的并列表达，指各种计划中的活动；“这事或那事”自然清楚。
theological_decisions:
- issue: 条件句中“主”的所指及神学力度
  choice: 译作“主”，不具体说明是父神还是主耶稣；保留人的生命和行动取决于主意愿的重点。
  alternative: 译作“神”或明确译作“主耶稣”
  rationale: 希腊文只有 ὁ κύριος。直接译为“主”既忠于措辞，也避免替原文消除可能存在的指称张力。
- issue: θελήσῃ 是否应译成具有更强预定色彩的用语
  choice: 愿意
  alternative: 命定、旨意如此
  rationale: 原词在此明确表达主的意愿，但本身不要求译文加入有关预定方式的进一步神学解释。
translation_notes:
  register: 采用简洁、庄重而通顺的现代标准汉语。“若”与“主若愿意”符合经文语体但不显古奥；“会活着，也会做”清楚保留两个未来动作及其共同条件。
