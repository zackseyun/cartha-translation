  text: Humble yourselves before the Lord[b][a], and he will exalt you.
translation:
  language: zh_hans
  text: 你们要在主面前[a]谦卑自己，他必高举你们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在主的同在中”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“抬举你们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ταπεινώθητε
  choice: 谦卑自己
  rationale: 该词虽为不定过去时被动命令式，但在本段劝勉语境中可带反身或中动态含义。“谦卑自己”既符合现代汉语习惯，也表达主动降卑的呼召，同时不将其处理成单纯被外力羞辱。
- source_word: ἐνώπιον
  choice: 在……面前
  rationale: ἐνώπιον可表示“在……面前”或“在……的临在中”。“在主面前”简洁自然，并保留关系性与临在意味。
- source_word: κυρίου
  choice: 主
  rationale: κύριος按通常对应译为“主”；不进一步指定为“神”或“主耶稣”，以保留原文在此处的指称空间。
- source_word: ὑψώσει
  choice: 必高举
  rationale: ὑψόω在此为比喻性用法，指降卑之后被提升或尊荣。“高举”保留其庄重的神学与伦理意味；“必”体现将来陈述所带的应许语气。
- source_word: ὑμᾶς
  choice: 你们
  rationale: 原文为第二人称复数宾格；“你们”明确保留复数群体指向。
theological_decisions:
- issue: “主”的所指
  choice: 正文仅译为“主”，不明确限定所指
  alternative: 译为“神”或“主耶稣”
  rationale: 雅各书中的κύριος可指神，也可指耶稣；本句本身不足以要求更具体的判定。保留“主”可忠实保存原文的可能张力。
- issue: 高举的性质
  choice: 采用概括性的“高举”，不限定为现世尊荣、属灵恢复或末世升高
  alternative: 明确译成“使你们得尊荣”“使你们振作起来”或“在末日使你们升高”
  rationale: 原文没有明说高举发生的时间和具体形式；概括译法避免将一种神学解释写入正文。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“谦卑自己”适合劝勉语体；“高举”与前半句形成清楚对照。所有代词和动词均保留对复数听众的直接劝告与应许。
