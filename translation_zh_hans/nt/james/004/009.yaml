id: JAS.4.9
reference: James 4:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ταλαιπωρήσατε καὶ πενθήσατε καὶ κλαύσατε· ὁ γέλως ὑμῶν εἰς πένθος ⸀μετατραπήτω καὶ ἡ χαρὰ εἰς κατήφειαν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/009.yaml
  text: Be miserable and mourn and weep[b][a]. Let your laughter be turned into mourning and your joy into gloom.
translation:
  language: zh_hans
  text: 你们要愁苦[a]、哀恸、哭泣；你们的欢笑要变为哀恸，喜乐要变为愁闷[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “愁苦”也可译作“陷于悲苦”。希腊语动词可指处于困苦、悲惨或痛苦之中。
    reason: lexical_alternative
  - marker: b
    text: “愁闷”也可译作“垂头丧气”。希腊语名词指低沉、阴郁的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: ταλαιπωρήσατε
  choice: 要愁苦
  rationale: 该不定过去时主动命令式严厉地要求听者进入或正视困苦悲惨的状态。“愁苦”简洁自然，又不与后面的“哀恸”和“哭泣”完全重叠。
- source_word: πενθήσατε
  choice: 哀恸
  rationale: 表达因严重之事而悲痛哀悼，保留本节悔改呼召的沉重语气。
- source_word: κλαύσατε
  choice: 哭泣
  rationale: 准确表达流泪哀哭，比口语化的“哭”更庄重，并与“哀恸”有所区分。
- source_word: ὁ γέλως ὑμῶν εἰς πένθος
  choice: 你们的欢笑要变为哀恸
  rationale: 保留“欢笑”这一具体名词及由欢笑转为哀恸的强烈反差；“哀恸”也与同词根动词 πενθήσατε 的译法相呼应。
- source_word: μετατραπήτω
  choice: 要变为
  rationale: 反映不定过去时被动命令式所要求的状态转变；汉语无需生硬地复制被动形式。
- source_word: ἡ χαρὰ εἰς κατήφειαν
  choice: 喜乐要变为愁闷
  rationale: 按前一分句的平行结构补出领属意义，并以“愁闷”表达低沉、阴郁、垂头丧气的状态，避免把它误解为现代医学诊断。
theological_decisions:
- issue: 悔改呼召的情感力度
  choice: 保留连续命令的严厉语气，将本节译作对悲痛悔改的强烈呼召。
  alternative: 弱化为一般性的严肃或克制劝告。
  rationale: 雅各书4:6–10的语境要求人在上帝面前谦卑；原文三个命令及两组反转都具有强烈力度，但译文不额外加入原文未明说的教义解释。
- issue: μετατραπήτω 的被动施事者
  choice: 译作“要变为”，不指明是谁促成这一转变。
  alternative: 明确译成“你们要把……变为”或“让上帝把……变为”。
  rationale: 希腊文采用被动命令式而未说明施事者；译文保留这一开放性，不把责任主体或神圣施事者强加进文本。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。三个并列动词“愁苦、哀恸、哭泣”保留原文层层加重的节奏；后半句以对称结构呈现“欢笑／哀恸”和“喜乐／愁闷”的反转。
