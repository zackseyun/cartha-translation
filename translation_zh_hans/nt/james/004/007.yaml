id: JAS.4.7
reference: James 4:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὑποτάγητε οὖν τῷ θεῷ· ἀντίστητε δὲ τῷ διαβόλῳ, καὶ φεύξεται ἀφ’ ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/007.yaml
  text: Submit yourselves[a], therefore, to God. But resist the devil, and he will flee from you.
translation:
  language: zh_hans
  text: 所以，你们要顺服上帝[a]；但要抵挡魔鬼，他就会从你们面前逃走。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要服在上帝之下”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποτάγητε
  choice: 要顺服
  rationale: 该词为命令式，被动形式在此具有反身意味，要求读者自愿置于上帝的权柄之下。“顺服”在现代汉语中自然、庄重，也保留了服从权柄的含义。
- source_word: οὖν
  choice: 所以
  rationale: 表示由上文引出的推论；“所以”清楚而自然地保留逻辑衔接。
- source_word: τῷ θεῷ
  choice: 上帝
  rationale: 作ὑποτάγητε的与格补语；汉语以“顺服上帝”自然表达。
- source_word: ἀντίστητε
  choice: 要抵挡
  rationale: 表示站出来反抗、抵制；“抵挡”简洁地保留命令语气和属灵争战的语境。
- source_word: δὲ
  choice: 但
  rationale: 标示轻微对比或推进，将顺服上帝与抵挡魔鬼并置。
- source_word: τῷ διαβόλῳ
  choice: 魔鬼
  rationale: 此处带冠词，指作为位格性敌对者的魔鬼，而非泛指毁谤者；“魔鬼”是现代汉语中通行且符合语境的译法。
- source_word: καὶ
  choice: 就
  rationale: 在命令之后引出预期结果；汉语用“就”比机械译作“并且”更自然，同时不强化为超出原文的因果关系。
- source_word: φεύξεται
  choice: 会……逃走
  rationale: 将来时表达抵挡之后的应许性结果；主语承接前文的“魔鬼”。
- source_word: ἀφ’ ὑμῶν
  choice: 从你们面前
  rationale: ἀπό加属格表示离开；“从你们面前逃走”是自然汉语，并清楚表达远离读者之意。
theological_decisions:
- issue: διάβολος的所指
  choice: 译作“魔鬼”，理解为位格性的超自然敌对者
  alternative: 译作“毁谤者”，或理解为泛指、非位格性的邪恶力量
  rationale: 该词在此带冠词，并处于抵挡与逃走的个人行动语境中，支持将其理解为位格性的魔鬼；同时译文不增添原文未明说的身份细节。
- issue: ὑποτάγητε的语态与责任
  choice: 译作主动意味的“你们要顺服上帝”
  alternative: 译作“你们要服在上帝之下”
  rationale: 希腊语虽为被动形式，但在劝勉语境中具有反身意义；译文既表达读者应主动回应，也保留置身上帝权柄之下的含义。
translation_notes:
  register: 采用现代、庄重、易懂的劝勉语体。“所以”承接上文；分号保留两项命令的紧密关系，“但”呈现顺服上帝与抵挡魔鬼之间的对照。脚注标记[a]置于相关短语之后。
