  yaml_path: translation/nt/james/004/016.yaml
  text: But as it is[a], you boast in your arrogance. All such boasting is evil.
translation:
  language: zh_hans
  text: 但如今，你们却在自己的狂妄中夸口[a]；凡这样的夸口都是邪恶的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “狂妄”也可译作“妄自尊大”“虚妄自信”或“自夸的妄言”。希腊词可泛指狂妄自大的虚假自信；在这里很可能特指上文所说那些自以为能掌控未来的计划。
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: 但如今……却
  rationale: 既保留表示当前处境的“如今”，也用“但……却”传达与上文所要求的谦卑态度之间的转折。
- source_word: καυχᾶσθε
  choice: 自负
  rationale: 此处指因自以为能够掌控未来而夸耀；“自负”在现代汉语中自然，并与其后的名词“夸口”形成语义呼应。
- source_word: ἐν ταῖς ἀλαζονείαις ὑμῶν
  choice: 以自己的狂妄
  rationale: ἀλαζονεία可指狂妄、自大的妄言或虚妄自信；译文不把它限定为“计划”，从而保留原词较宽的语义，同时上下文仍使读者联想到13—15节自以为能掌控未来的筹划。
- source_word: πᾶσα καύχησις τοιαύτη
  choice: 凡这样的夸口
  rationale: “凡”体现πᾶσα的概括或分配意味，“这样的”保留τοιαύτη对前述那一类自负的回指。
- source_word: πονηρά
  choice: 恶的
  rationale: 此处作明确的道德判断，“恶的”比“坏的”更能表达πονηρός的伦理力度。
theological_decisions:
- issue: 受谴责的夸口具有何种范围
  choice: 译文谴责脱离对主旨意之顺服、以为自己能掌控未来的狂妄自负，同时保留可概括到同类夸口的措辞。
  alternative: 把本节理解为谴责一切形式的自信，或仅限于商业计划。
  rationale: 4:13—15的直接语境是对未来行程和经营成果的自信筹划；但“凡这样的夸口”又把判断推广到同一性质的行为。因此不宜扩大为对所有自信的否定，也不宜缩窄为仅针对经商。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“以自己的狂妄自负”略带书面色彩，但能保留希腊文“在/以你们的狂妄中夸耀”的结构关联；后句以“夸口”呈现同根名词，避免中文重复显得生硬。
