    rationale: ἢ在此不是单独的反问强化词，而是承接前文论证的“或/还是”。译为“还是你们不知道……”可同时保留反问和论证流程。
  - severity: medium
    issue: 正文将ἓν σῶμα与εἰς σάρκα μίαν一律译为“一体”。
    rationale: 原文先以“一个身体”说明与妓女的联合，后引用“成为一体/一个肉身”。两词并非完全同一；中文可用“一个身体”与“成为一体”自然地区分，而不必作生硬的“一个肉身”。
  - severity: low
    issue: “娼妓”略偏旧式，且“与娼妓结合的，就是……”句法不够完整。
    rationale: “妓女”是现代普通话更常用的准确词。改为“与妓女结合的人，就与她成为一个身体”使主语和谓语关系清晰。
  - severity: low
    issue: 脚注a置于“说”后，内容同时涉及φησίν和出处，但正文“经上说”已经将未明示的主语具体化。
    rationale: 译作“正如他说”更贴近φησίν；脚注可说明直译为“他说”、所引为《创世记》2:24。
