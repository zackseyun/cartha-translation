  verdict: revise
  source_fidelity: 译文基本准确传达反问、与妓女发生联合、成为一个身体，以及《创世记》引文。惟“难道”没有呈现ἢ在保罗论证中承接前项的“还是/或者”；“与娼妓结合的，就是……”的主谓结构略显悬置。并且正文两处都译“一体”，虽可读，却遮蔽了保罗先说“一个身体”（ἓν σῶμα）、后引“一个肉身”（σὰρξ μία）的刻意词汇差异。
  naturalness: “妓女”是现代标准汉语中准确、自然且庄重的对应词；“娼妓”虽可理解，但稍带旧式色彩。“还是你们不知道……吗？”自然保留原文的衔接性反问。“一个身体”和“成为一体”在汉语中均通顺，且可保留原文对照。
  terminology: 将πόρνη译为“妓女”准确，不泛化为“淫乱的女人”。κολλώμενος译为“与妓女结合的人”适合本节性联合语境，未擅加婚姻含义。σῶμα宜译“一个身体”，σάρξ在创世记引文中宜维持既定、自然的“成为一体”；脚注说明词汇区别即可。φησίν不宜在正文无必要地扩展为“经上说”，可译“正如他说”，并在脚注说明引文出处及原文的未明示主语。
  issues:
