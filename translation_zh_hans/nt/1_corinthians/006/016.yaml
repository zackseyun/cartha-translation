  text: ⸀ἢ οὐκ οἴδατε ὅτι ὁ κολλώμενος τῇ πόρνῃ ἓν σῶμά ἐστιν; Ἔσονται γάρ, φησίν, οἱ δύο εἰς σάρκα μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/016.yaml
  text: Or do you not know that the one who joins himself to a prostitute is one body with her? For[a], as he says[b], “The two will become one flesh.”
translation:
  language: zh_hans
  text: 还是你们不知道，与妓女结合的人，就与她成为一个身体吗？因为，正如他说[a]：“二人要成为一体。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“他说”；这里引用《创世记》2:24。前句“一个身体”的希腊文为ἓν σῶμα，引文“成为一体”的希腊文为εἰς σάρκα μίαν（直译“成为一个肉身”）。
    reason: cross_reference; lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: 难道
  rationale: 承接上文并引出反问；汉语用“难道”自然体现保罗论证中的质问语气，虽未逐字译出“或”。
- source_word: οὐκ οἴδατε
  choice: 你们不知道
  rationale: 保留保罗书信中常见的反问公式，并与“难道”组成自然现代汉语。
- source_word: ὁ κολλώμενος
  choice: 与……结合的
  rationale: κολλάομαι可指黏合、依附或联合；此处涉及性关系，“结合”既清楚又保持庄重，且不额外限定为婚姻。
- source_word: τῇ πόρνῃ
  choice: 娼妓
  rationale: πόρνη特指从事卖淫的女子；“娼妓”准确、简洁，也符合经文的庄重语体。
- source_word: ἓν σῶμά ἐστιν
  choice: 与她成为一体
  rationale: 直译为“是一个身体”在现代汉语中生硬；“成为一体”表达实际的身体联合，并由“与她”明示希腊语语境中隐含的关系。
- source_word: Ἔσονται γάρ
  choice: 因为……要成为
  rationale: γάρ说明前述论断的依据；未来式ἔσονται与εἰς连用，在引文中自然译作“要成为”。
- source_word: φησίν
  choice: 经上说
  rationale: 希腊文直译为“他说”，主语未明示；鉴于其后引用创世记，汉语译作“经上说”可自然标明引文性质，同时脚注保留原文形式。
- source_word: οἱ δύο
  choice: 二人
  rationale: 简洁对应“这两个/二人”，并与创世记引文的传统汉语表达相符。
- source_word: εἰς σάρκα μίαν
  choice: 成为一体
  rationale: σάρξ在此指身体和关系层面的联合；“一体”是现代汉语中自然且庄重的表达，避免误解为抽象的组织统一。
theological_decisions:
- issue: 创世记引文对婚外性结合的含义
  choice: 直陈与娼妓结合的人与她成为一体，并以创世记2:24为依据，不增加婚姻教义说明。
  alternative: 把引文限制为只适用于婚姻，或在译文中加入超出本节明说内容的伦理结论。
  rationale: 保罗在此将创世记2:24类比应用于与娼妓发生性关系，强调这种行为造成真实的身体联合；译文应保留这一张力，不将其弱化，也不作过度阐释。
- issue: σῶμα与σάρξ在本节中的对应
  choice: 两处均译为“一体”，并以脚注说明原文分别为“身体”和“肉身”。
  alternative: 正文分别译作“一个身体”和“一个肉身”。
  rationale: 分别直译虽能显示词汇差异，却会使现代汉语引文生硬；统一译为“一体”更自然，同时脚注保存原文的重要差别。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“娼妓”准确对应πόρνη；“结合”清楚表达本段的性联合语境而不显粗俗。正文以“一体”保持流畅，脚注则保留σῶμα与σάρξ的词汇差异。
