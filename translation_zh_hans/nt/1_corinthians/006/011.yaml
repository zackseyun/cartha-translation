  text: καὶ ταῦτά τινες ἦτε· ἀλλὰ ἀπελούσασθε, ἀλλὰ ἡγιάσθητε, ἀλλὰ ἐδικαιώθητε ἐν τῷ ὀνόματι τοῦ κυρίου ⸀Ἰησοῦ καὶ ἐν τῷ πνεύματι τοῦ θεοῦ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/011.yaml
  text: And such were some of you[a]. But you washed yourselves, but you were sanctified[c][b], but you were justified in the name of the Lord Jesus and in the Spirit of our God.
translation:
  language: zh_hans
  text: 你们中间也有人从前是这样；但你们已经洗净了[a]；但你们已经成圣了；但你们已经奉主耶稣的名，靠我们上帝的灵称义了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “洗净了”所对应的希腊语动词是中间语态，也可译作“把自己洗净了”。它与随后“成圣”和“称义”并列，因此也常被理解为上帝施行的洁净。
    reason: alternative_reading
  - marker: b
    text: 这里的“奉……的名，靠……的灵”也可按较形式对应的方式译作“在主耶稣的名里，并在我们上帝的灵里”。希腊语的两个“在”可带有关联、范围或凭借／媒介等意义。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ταῦτά τινες ἦτε
  choice: 你们中间也有人从前是这样
  rationale: 自然表达其回指上一节所列各类人的作用，同时保留“你们中间有些人过去如此”的时间与身份对比。
- source_word: ἀλλὰ（重复三次）
  choice: 但……已经……，已经……，已经……
  rationale: 以“但”标明强烈转折，并用三个并列的“已经”再现原文三重ἀλλά所形成的强调节奏；逐次重复“但”在现代汉语中较生硬。
- source_word: ἀπελούσασθε
  choice: 你们已经洗净了
  rationale: 采用结果性、近被动的表达，使其与随后两个明确的被动式相连；同时以脚注保留中间语态可能具有的反身理解。
- source_word: ἡγιάσθητε
  choice: 已经成圣
  rationale: “成圣”是简明且通行的保罗书信术语，兼具被分别归属上帝和成为圣洁的含义。
- source_word: ἐδικαιώθητε
  choice: 已经称义
  rationale: “称义”保留δικαιόω在保罗语境中司法性与关系性的张力，不扩写为单一解释。
- source_word: ἐν τῷ ὀνόματι τοῦ κυρίου Ἰησοῦ
  choice: 在主耶稣的名里
  rationale: 保留ἐν可指范围、关联或凭借的开放性，也保存“名”所含的权柄与身份意涵。
- source_word: ἐν τῷ πνεύματι τοῦ θεοῦ ἡμῶν
  choice: 在我们上帝的灵里
  rationale: 与前一ἐν短语保持形式对应，不预先限定为纯工具意义；“上帝的灵”在此自然指向圣灵。
theological_decisions:
- issue: ἀπελούσασθε的语态与行动主体
  choice: 正文译作“你们已经洗净了”，按结果性、近被动意义理解
  alternative: “你们已经洗了自己”或“你们已经把自己洗净了”
  rationale: 该动词形态为中间语态，可以作反身理解；但它与“成圣”“称义”两个被动式并列，语境也支持将其理解为施于信徒的拯救行动。脚注保留语态张力。
- issue: 两个ἐν短语的语义关系
  choice: 正文均以“在……里”呈现，并补出“成就的”使汉语完整
  alternative: “借着主耶稣的名，并借着我们上帝的灵”
  rationale: ἐν可表达范围、关联或工具。对应翻译可避免将两个短语都过早限定为单一的工具意义；脚注说明另一种自然理解。
- issue: πνεύματι的所指
  choice: “我们上帝的灵”，理解为圣灵
  alternative: 较宽泛的属灵范围或状态
  rationale: “上帝的灵”在保罗语境中最自然指圣灵，但正文不添加原文没有的“圣”字。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“从前是这样”自然回指前文恶行清单；三个“已经”保持原文的强调和完成感。正文保留中间语态以及ἐν短语的真实歧义，不将行动主体或介词关系绝对化。
