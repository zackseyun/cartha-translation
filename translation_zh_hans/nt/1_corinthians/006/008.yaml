  yaml_path: translation/nt/1_corinthians/006/008.yaml
  text: But you yourselves do wrong and defraud—and this to your brothers[a].
translation:
  language: zh_hans
  text: 但你们自己反倒行不义、欺诈人；而且你们这样对待的，竟是弟兄[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“弟兄姊妹”；希腊文直译为“弟兄”，在这里也可广指同信者。
    reason: 说明希腊文阳性复数名词在本处信徒群体语境中可能具有的广义指称。
lexical_decisions:
- source_word: ἀλλὰ
  choice: 但……反倒
  rationale: 承接上文形成强烈转折；“反倒”自然地突出哥林多人实际行为与应有做法相反。
- source_word: ὑμεῖς
  choice: 你们自己
  rationale: 希腊文显式使用代词，带有强调意味；译文保留对受众自身行为的着重。
- source_word: ἀδικεῖτε
  choice: 行不义
  rationale: 保留该动词广泛的道德与公义含义，不把受害对象或具体行为限定得过窄。
- source_word: ἀποστερεῖτε
  choice: 亏负人
  rationale: 该词指剥夺他人应得之物或欺诈；结合诉讼语境，“亏负人”兼顾财物侵害的含义与现代汉语的自然表达。
- source_word: καὶ τοῦτο
  choice: 而且所亏负的竟是
  rationale: 这一结构加重语气，突出行为对象竟是信徒群体中的弟兄；“竟”传达其修辞震撼力。
- source_word: ἀδελφούς
  choice: 弟兄
  rationale: 保留希腊文阳性复数的形式，同时以脚注说明在此可广指同一信仰群体中的男女信徒。
theological_decisions:
- issue: 混合性别的教会处境中如何翻译 ἀδελφούς
  choice: 弟兄
  alternative: 弟兄姊妹；同信的信徒
  rationale: 原词为阳性复数，但在保罗书信中可代表性地泛指信徒群体。正文保留词形所体现的“弟兄”，脚注交代其语境中可能具有的广义范围，避免暗中缩窄或扩大。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“行不义”保留经文的道德力度，“亏负人”则清楚表达使人蒙受应得权益或财物上的损失。用“竟是”再现原文 καὶ τοῦτο 的加重语气。
