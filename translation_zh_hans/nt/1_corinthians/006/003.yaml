  text: οὐκ οἴδατε ὅτι ἀγγέλους κρινοῦμεν, μήτιγε βιωτικά;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/003.yaml
  text: Do you not know that we will judge angels? How much more[a], the things of this life!
translation:
  language: zh_hans
  text: 难道你们不知道，我们将要审判天使吗？何况[a]今生的事呢！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“更不用说今生的事了”，或“何况今生的事务呢”。
    reason: 词义与表达方式的可选译法；μήτιγε可用不同汉语结构表达由大及小的递进推论。
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: 难道你们不知道
  rationale: 保留保罗惯用反问句的力度；“难道……不知道”在现代汉语中自然，也能体现原文预期肯定答案的语气。
- source_word: ὅτι
  choice: （由后续分句直接引出所知内容）
  rationale: 希腊语在“知道”后以ὅτι引出内容从句；汉语无须另译连接词，直接接“我们将要……”最自然。
- source_word: ἀγγέλους
  choice: 天使
  rationale: 在此末世审判语境中指属天的灵界存在，而不是人间的使者。
- source_word: κρινοῦμεν
  choice: 我们将要审判
  rationale: 以“将要”体现未来直陈语气，并用“审判”保留κρίνω的司法含义，不把具体方式扩释为治理或定罪。
- source_word: μήτιγε
  choice: 何况
  rationale: 该词强化由较大之事推及较小之事的论证；“何况”简洁自然地表达“更不用说”的递进语势。
- source_word: βιωτικά
  choice: 今生的事
  rationale: 该词是形容词的名词性用法，泛指属于现世日常生活的事务；此译法宽泛而自然，不把它过度限定为诉讼案件。
theological_decisions:
- issue: 信徒“审判天使”的性质
  choice: 直译为“我们将要审判天使”而不作解释性扩充
  alternative: 我们将要治理天使；我们将要审判堕落的天使
  rationale: 原文没有说明审判的方式、范围，也没有明确限定为堕落天使；保留原句可避免以特定末世论体系消除经文本身的张力。
- issue: μήτιγε所表达的大小推论方向
  choice: 译作“何况今生的事呢”
  alternative: 更不用说今生的事；今生的事岂不更能审断
  rationale: 上下文是从审判天使这一较大的事推及今生事务这一较小的事。“何况”保留推论关系，同时不补入原文省略的具体谓语。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“难道……不知道”保留反问力度；“今生的事”贴近βιωτικά的广义范围。正文保留省略式反问，不擅自补明审判天使的对象范围或方式。
