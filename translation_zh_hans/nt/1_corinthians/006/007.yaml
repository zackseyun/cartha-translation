  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἤδη μὲν ⸀οὖν ὅλως ἥττημα ὑμῖν ἐστιν ὅτι κρίματα ἔχετε μεθ’ ἑαυτῶν· διὰ τί οὐχὶ μᾶλλον ἀδικεῖσθε; διὰ τί οὐχὶ μᾶλλον ἀποστερεῖσθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/007.yaml
  text: Indeed[a], then, it is already altogether a defeat for you that you have lawsuits among yourselves[c][b]. Why not rather be wronged? Why not rather be defrauded?
translation:
  language: zh_hans
  text: 所以，你们彼此之间有诉讼，这本身已经是你们完全的失败了[a][b]。为什么不宁可受不义的对待？为什么不宁可被亏负[c]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “失败”也可译作“损失”或“缺失”。希腊词 ἥττημα 可指失败、损失或缺失；这里强调，彼此诉讼这件事本身已经构成失败。
    reason: lexical_alternative
  - marker: b
    text: “彼此之间有诉讼”也可译作“彼此告上法庭”。希腊词 κρίματα 在这里按上下文指提交法庭处理的争端或诉讼案件。
    reason: lexical_alternative
  - marker: c
    text: “被亏负”也可译作“被欺骗”或“被剥夺”。希腊词 ἀποστερεῖσθε 可指财物或权益被夺走、被骗取。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: 已经
  rationale: 表明无论诉讼结果如何，失败的状态现今已经成立。
- source_word: μὲν οὖν
  choice: 所以
  rationale: 自然表达承接上文并作出结论的推论作用；其轻微强调不宜在中文中生硬叠加。
- source_word: ὅλως
  choice: 彻底
  rationale: 保留其加强整体判断的功能，说明仅仅出现这种诉讼就构成完全的失败。
- source_word: ἥττημα
  choice: 失败
  rationale: 既能表达损失、败局之意，也保留保罗强烈的修辞判断，而不额外限定其为法律上的败诉。
- source_word: ὑμῖν ἐστιν
  choice: 是你们……的失败
  rationale: 以自然中文表达关系与归属，不加入原文未明说的“羞耻”。
- source_word: ὅτι
  choice: 这本身
  rationale: 用中文主语化结构自然引出构成失败的事实，即信徒彼此诉讼。
- source_word: κρίματα
  choice: 告上法庭
  rationale: 结合上下文，指彼此之间诉诸法庭的案件；动词化表达比直译“有审判”更清楚自然。
- source_word: μεθ’ ἑαυτῶν
  choice: 彼此
  rationale: 准确表达群体内部互相争讼的关系。
- source_word: διὰ τί οὐχὶ μᾶλλον
  choice: 为什么不宁可
  rationale: 保留连续反问及“反倒选择”的比较意味。
- source_word: ἀδικεῖσθε
  choice: 受委屈
  rationale: 自然表达遭受不公或侵害的被动含义；脚注提示更形式对应的译法。
- source_word: ἀποστερεῖσθε
  choice: 吃亏
  rationale: 在诉讼及财物争端语境中自然表达被剥夺、遭欺骗而蒙受损失，同时脚注保留较具体的词义范围。
theological_decisions:
- issue: 保罗对信徒彼此诉讼的评价性质
  choice: 译作“彻底的失败”，把诉讼行为本身视为群体已经遭遇的失败
  alternative: “损失”或“过失”
  rationale: ἥττημα 可指失败、损失或缺失；“失败”最能保留本节的修辞力度，同时不擅自把它界定为法律败诉或某一特定教义范畴。
- issue: 两个被动反问是否带有劝勉意味
  choice: 保留为“为什么不宁可……”的反问
  alternative: 改写为直接命令“你们应当甘愿……”
  rationale: 原文以反问提出尖锐挑战；保留其形式可避免把隐含劝勉强化为明确命令。
translation_notes:
  register: 采用现代、庄重而口语可懂的中文。“彼此告上法庭”明确法律语境；“受委屈／吃亏”形成自然、紧凑的平行反问。所有词义上的重要备选均以脚注保留。
