source:
  edition: SBLGNT
  text: βιωτικὰ μὲν οὖν κριτήρια ἐὰν ἔχητε, τοὺς ἐξουθενημένους ἐν τῇ ἐκκλησίᾳ, τούτους καθίζετε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/004.yaml
  text: So if you have courts for matters of this life[c][b][a], do you appoint as judges those who are of no standing in the church?
translation:
  language: zh_hans
  text: 所以，你们若有今生事务的案件[a]，竟让在教会中被轻视的人[b]作审判者吗？[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“日常生活事务上的案件”。这里指普通的现世或民事事务。
    reason: lexical_alternative
  - marker: b
    text: 或译：“在教会中不被看重的人”。原文也可能指从教会的角度看没有地位的人，因此既可能是教会内被视为无足轻重者，也可能是教会外的人。
    reason: alternative_reading
  - marker: c
    text: 有人把这句话理解为带讽刺意味的命令：“就让在教会中被轻视的人来作审判者吧。”
    reason: alternative_reading
lexical_decisions:
- source_word: βιωτικὰ
  choice: 今生事务上的
  rationale: 指日常、现世或民事方面的事务；“今生事务”保留现世层面的含义，又避免“属世”可能带出的道德贬义。
- source_word: κριτήρια
  choice: 案件
  rationale: 该词可指法庭、审判机关或审理的案件。结合“若有”以及本段信徒之间争讼的语境，译作“案件”在现代汉语中自然，也保留司法语境。
- source_word: ἐὰν ἔχητε
  choice: 你们若有
  rationale: 直接保留希腊文的条件结构，表达自然简洁。
- source_word: τοὺς ἐξουθενημένους
  choice: 被轻视的人
  rationale: 该分词指被看作无足轻重、遭轻蔑的人。“被轻视”忠实保留其被动和贬抑色彩，同时不强行判定这些人是教会内地位低微者还是教会所轻看的外人。
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: 教会中
  rationale: 直译其群体定位，同时保留两种可能：在教会群体内部被轻视，或从教会的角度看不具地位。
- source_word: τούτους καθίζετε
  choice: 竟让……作审判者吗
  rationale: καθίζω本义为使人坐下，在司法语境中可指让人就审判席或任命其审理。“作审判者”明确司法职能；“竟……吗”传达反问中的责备语气。
theological_decisions:
- issue: 本节是反问还是讽刺性的命令，以及“被轻视的人”指谁
  choice: 正文按反问理解：“竟让……作审判者吗？”并不限定“被轻视的人”的具体身份。
  alternative: 可按讽刺性的命令理解为：“就让教会中被轻视的人来作审判者吧。”也有人认为这些人特指教会外的世俗审判者。
  rationale: 希腊文句法存在争议；SBLGNT的标点及上下文的责备语气支持反问读法。正文采用反问，同时用“教会中被轻视的人”保留其身份和评价来源上的张力，其他读法列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“今生事务”保持经文的现世视角而不附加道德判断；“案件”和“作审判者”使司法场景清楚。“竟……吗”自然呈现保罗反问责备的力度。
