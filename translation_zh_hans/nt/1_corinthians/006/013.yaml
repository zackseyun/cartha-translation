id: 1CO.6.13
reference: 1 Corinthians 6:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τὰ βρώματα τῇ κοιλίᾳ, καὶ ἡ κοιλία τοῖς βρώμασιν· ὁ δὲ θεὸς καὶ ταύτην καὶ ταῦτα καταργήσει. τὸ δὲ σῶμα οὐ τῇ πορνείᾳ ἀλλὰ τῷ κυρίῳ, καὶ ὁ κύριος τῷ σώματι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/013.yaml
  text: Food is for the stomach[a], and the stomach for food—but God will do away with both it and them. But the body is not for sexual immorality, but for the Lord[c][b], and the Lord for the body.
translation:
  language: zh_hans
  text: 食物是为肚腹，肚腹是为食物[a][b]；上帝却要把肚腹和食物都废去[c]。但身体不是为淫乱，而是为主；主也是为身体。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“食物”是复数，也可译作“各样食物”。
    reason: lexical_alternative
  - marker: b
    text: 许多解释者认为，“食物是为肚腹，肚腹是为食物”是保罗引用的哥林多人说法，随后他对这说法加以限制或纠正；但希腊文本身没有明确标出这是引语。
    reason: alternative_reading
  - marker: c
    text: “废去”也可译作“毁灭”“废除”或“使……失去作用”。
    reason: lexical_alternative
lexical_decisions:
- source_word: βρώματα
  choice: 食物
  rationale: 原文使用复数，直译可作“各样食物”；现代汉语以集合名词“食物”表达这一概括性说法更自然，同时不改变所指。
- source_word: κοιλίᾳ / κοιλία
  choice: 肚腹
  rationale: 此处指承受食物、满足饮食需要的身体部位。“肚腹”既符合上下文，也比“腹中”或“内心”更不易引起误解。
- source_word: καταργήσει
  choice: 要……废去
  rationale: 该动词可表示使某物终止、失去效用或被废除。“废去”保留其语义幅度，不将意思限定为物质上的毁灭。
- source_word: ταύτην καὶ ταῦτα
  choice: 把肚腹和食物都
  rationale: 希腊文分别以阴性单数和中性复数代词回指“肚腹”和“食物”。汉语明确重述二者，指代更清楚。
- source_word: σῶμα
  choice: 身体
  rationale: 此处指人的具体身体，并带有神学意义；“身体”是现代汉语最直接、稳妥的对应词。
- source_word: πορνείᾳ
  choice: 淫乱
  rationale: 该词概括不合正当规范的性行为。“淫乱”在现代中文圣经语体中简洁、庄重，且不把范围缩窄为某一种行为。
- source_word: κυρίῳ / κύριος
  choice: 主
  rationale: 此处的“主”指耶稣，保留保罗用语中的权柄含义及基督论分量。
- source_word: δὲ
  choice: 却 / 但
  rationale: 两处连接词均带出对照：上帝将废去饮食与肚腹的暂时关系，而身体的归属不可据此类推到淫乱。按汉语行文分别译为“却”和“但”。
theological_decisions:
- issue: 开头一句是否明确标为哥林多人所说的口号
  choice: 正文不加引号，也不补出“你们说”等引介语
  alternative: 将“食物是为肚腹，肚腹是为食物”加上引号，明确视为哥林多人的口号
  rationale: 希腊文本身没有引号或引介公式。许多解释者认为这是保罗引用的口号，但正文不应把这一可能解释变成唯一读法；脚注说明即可保留歧义。
- issue: καταργήσει 对食物和肚腹所表达的结果
  choice: 译作“废去”，表达其作用或存在安排将被终止
  alternative: 译作“毁灭”或“使……失去作用”
  rationale: 该动词并不必然表示物质上的彻底消灭。“废去”能表达上帝使二者终止，同时避免过度确定其形而上的含义。
- issue: “主也是为身体”的含义
  choice: 保留简洁、对称的互为关系
  alternative: 扩译为“主关怀身体”或“主为身体的益处”
  rationale: 希腊文刻意与“身体……为主”形成紧凑平行。保留原有措辞，可避免擅自限定主与身体之间关系的具体性质。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“食物”“身体”“主”等用词简明稳定；“肚腹”保留经文语体的凝练感，又能清楚指向饮食和消化。分号呈现原文两组紧密对称的命题，并以“却”“但”显出保罗论证中的转折。
