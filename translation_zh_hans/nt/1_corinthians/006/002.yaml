id: 1CO.6.2
reference: 1 Corinthians 6:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀ἢ οὐκ οἴδατε ὅτι οἱ ἅγιοι τὸν κόσμον κρινοῦσιν; καὶ εἰ ἐν ὑμῖν κρίνεται ὁ κόσμος, ἀνάξιοί ἐστε κριτηρίων ἐλαχίστων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/002.yaml
  text: Or do you not know that the saints will judge the world? And if the world is judged by you[b][a], are you unworthy of the smallest courts?
translation:
  language: zh_hans
  text: 难道你们不知道，圣徒将要审判世界吗？如果世界由你们审判[a]，难道你们竟不配审理最小的案件[b]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在你们中间受审判”。原文介词短语可以这样直译；按上下文，其意思是圣徒参与审判世界。
    reason: lexical_alternative
  - marker: b
    text: “最小的案件”或译“最小的法庭”。原词既可指审判的场所，也可指交付审理的事项。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: 难道
  rationale: ἢ承接上一节，提出尖锐的反问。汉语以“难道”自然体现这种论证推进；不另译“或者”，以免句子生硬。
- source_word: οὐκ οἴδατε
  choice: 你们不知道
  rationale: 保留保罗常用的反问句式，并贴近οἶδα“知道”的基本意义。
- source_word: οἱ ἅγιοι
  choice: 圣徒
  rationale: 在保罗书信中通常指归属于上帝、被分别为圣的信徒群体。“圣徒”简洁庄重，且不限定为少数特别敬虔或经册封的人。
- source_word: τὸν κόσμον
  choice: 世界
  rationale: κόσμος在此广泛指将受审判的世界；“世界”既自然，也不额外限定其范围。
- source_word: κρινοῦσιν
  choice: 将要审判
  rationale: 保留将来时和κρίνω的司法、末世性含义，而不具体说明圣徒参与审判的方式。
- source_word: ἐν ὑμῖν
  choice: 由你们
  rationale: 在审判语境中按工具性或关联性理解，清楚表达圣徒参与审判；脚注保留更贴近字面的“在你们中间”这一可能。
- source_word: κρίνεται
  choice: 审判
  rationale: 条件句中的现在时可指向前句所说的未来审判。汉语不强行标出时态，以保留原句的简练和关联。
- source_word: ἀνάξιοί ἐστε
  choice: 你们竟不配
  rationale: “不配”保留ἀνάξιος的价值判断和反问的刺痛感；“竟”自然呈现保罗由大及小论证中的惊讶语气。
- source_word: κριτηρίων ἐλαχίστων
  choice: 最小的案件
  rationale: κριτήριον可指审判场所，也可指交付裁断的事项。结合上下文信徒之间的纠纷，“案件”在现代汉语中更自然；脚注保留“最小的法庭”这一形式上可能的译法。
theological_decisions:
- issue: “圣徒”的身份
  choice: 泛指属于上帝的信徒群体
  alternative: 仅指少数格外圣洁的信徒
  rationale: 保罗通常以οἱ ἅγιοι称信徒整体。译文保留“圣徒”，不把它解释为一个精英阶层。
- issue: 圣徒审判世界的方式
  choice: 真实参与将来的审判，但不说明具体方式
  alternative: 仅作象征性的道德评价，或拥有完全独立的审判权
  rationale: 经文明说圣徒将审判世界，却未交代其机制；译文既保留其真实和未来性，也不增添正文没有说明的细节。
- issue: ἐν ὑμῖν的关系
  choice: 由你们审判
  alternative: 在你们中间审判
  rationale: 主文采用符合上下文论证的工具性理解，但以脚注保存介词短语可能表达的处所或群体关联，避免消除原文歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以两个“难道”保持保罗连续反问的力度；“竟不配”凸显从审判世界推论到处理小事的反差。标点和语序按现代汉语调整，同时保留条件句及原文的神学张力。
