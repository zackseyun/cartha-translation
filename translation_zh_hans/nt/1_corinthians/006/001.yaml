  text: Τολμᾷ τις ὑμῶν πρᾶγμα ἔχων πρὸς τὸν ἕτερον κρίνεσθαι ἐπὶ τῶν ἀδίκων, καὶ οὐχὶ ἐπὶ τῶν ἁγίων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/001.yaml
  text: Does any one of you dare[a], when he has a case against another[b], to be judged before the unrighteous and not before the saints?
translation:
  language: zh_hans
  text: 你们中间若有人与别人有了纠纷，竟敢把案件交给不义的人[a]审理，而不交给圣徒[b]审理吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不公正的人”。有些译本按语境解释为“不信的人”，但希腊文直译是“不义的人”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“圣徒”指属神的圣洁子民，也就是信徒群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τολμᾷ
  choice: 竟敢
  rationale: 保留保罗反问中的责难语气；“竟敢”自然表达了此处近乎放肆的大胆。
- source_word: τις ὑμῶν
  choice: 你们中间若有人
  rationale: 兼顾不定单数 τις、部分属格 ὑμῶν 和汉语条件式反问的自然表达。
- source_word: πρᾶγμα ἔχων
  choice: 有了纠纷
  rationale: πρᾶγμα 在司法语境中指需要裁断的案件或争端；“纠纷”不把具体性质限定得过窄。
- source_word: πρὸς τὸν ἕτερον
  choice: 与别人
  rationale: 表达当事人与另一方之间的争议关系；汉语“与别人有纠纷”比直译“反对另一个人”自然。
- source_word: κρίνεσθαι
  choice: 把案件交给……审理
  rationale: 以自然汉语呈现司法性的被审理含义，同时明确所审理的是前述案件，而非对当事人作道德评判。
- source_word: ἐπὶ τῶν ἀδίκων
  choice: 交给不义的人审理
  rationale: ἀδίκων 直指“不义的人”；不以解释性的“不信的人”替代原文带有道德和神学色彩的称谓。ἐπί 在司法语境中表示来到某些审判者面前。
- source_word: καὶ οὐχὶ
  choice: 而不
  rationale: 简明保留两个审理场域之间的鲜明对比。
- source_word: ἐπὶ τῶν ἁγίων
  choice: 交给圣徒审理
  rationale: ἅγιοι 是保罗对属神群体的常用称呼；“圣徒”保留这一术语，并与“不义的人”形成原文的张力。
theological_decisions:
- issue: ἀδίκων 与 ἁγίων 的对照
  choice: 不义的人……圣徒
  alternative: 不信的人……信徒；不公正的人……圣徒
  rationale: 经文语境可能指教会外的审判者，但希腊文使用的是带评价色彩的“不义者”，并与“圣徒”对照。译文不把这层含义直接化约为“非信徒与信徒”。
- issue: ἔχων 的阳性单数形式
  choice: 若有人……有了纠纷
  alternative: 若他们有纠纷；若有弟兄与人发生纠纷
  rationale: 汉语“有人”可自然表达代表性的单数，不必添加原文没有的性别标记，也不把当事人特定解释为“弟兄”。
- issue: κρίνεσθαι 的司法含义
  choice: 把案件交给……审理
  alternative: 在……面前受审；到……那里打官司
  rationale: 原文形式为被动不定式，但语境是让争议接受裁断。“把案件交给……审理”在现代汉语中清楚自然，又不额外断定诉讼的具体程序。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“竟敢……吗”保留责问语气；重复“交给……审理”，使司法对照清楚。脚注标记紧跟其实际解释的词语，避免歧义。
