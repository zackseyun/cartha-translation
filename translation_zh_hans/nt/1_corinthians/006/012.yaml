source:
  edition: SBLGNT
  text: Πάντα μοι ἔξεστιν· ἀλλ’ οὐ πάντα συμφέρει. πάντα μοι ἔξεστιν· ἀλλ’ οὐκ ἐγὼ ἐξουσιασθήσομαι ὑπό τινος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/012.yaml
  text: “All things are lawful for me,” but not all things are beneficial[c][b][a]. “All things are lawful for me,” but I will not be mastered by anything.
translation:
  language: zh_hans
  text: “凡事我都可以做”[a]，但并非凡事都有益处[b]。“凡事我都可以做”，但我绝不受任何事物辖制[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可不加引号，译作：凡事我都可以做。许多人认为这是保罗引用哥林多人常说的一句话，然后加以限定。原文没有现代标点，因此两种理解都有可能。
    reason: alternative_reading
  - marker: b
    text: “有益处”也可译作“有利”或“有帮助”。
    reason: lexical_alternative
  - marker: c
    text: “不受任何事物辖制”也可译作“不落在任何事物的权势之下”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα μοι ἔξεστιν
  choice: 凡事我都可以做
  rationale: ἔξεστιν表示获准、可行或合乎许可；“可以做”是现代汉语中自然、简洁的表达，也保留了这句话作为口号时的概括性。Πάντα译作“凡事”，并在两处重复，以对应原文结构。
- source_word: ἀλλ’ οὐ πάντα συμφέρει
  choice: 但并非凡事都有益处
  rationale: συμφέρει在此指有利、有益或带来好处。“有益处”避免了“有利润”的商业色彩，也比单纯的“有帮助”更能体现保罗对行为后果的评估。
- source_word: οὐκ ἐγὼ ἐξουσιασθήσομαι
  choice: 但我绝不受……辖制
  rationale: ἐξουσιασθήσομαι是将来时被动形式，表示受权势控制或支配；“绝不受……辖制”既体现说话者坚定的意志，也保留权柄、支配方面的语义。
- source_word: ὑπό τινος
  choice: 受任何事物
  rationale: τινος本身可以宽泛地指任何人或事物；结合上下文所谈的行为、欲望和可做之事，正文采用“任何事物”，同时不把原则限制在某一种具体对象上。
theological_decisions:
- issue: 是否把“Πάντα μοι ἔξεστιν”标为哥林多人所说的口号
  choice: 正文用引号标出两次重复的话，并以脚注说明其解释性质
  alternative: 不加引号，把整句话直接视为保罗自己的陈述，再由后半句加以限定
  rationale: 许多解释者认为保罗在引用哥林多人常说的话，然后予以限制；但希腊文抄本本身没有现代引号，因此无法仅凭标点确定。正文采用很可能符合修辞结构的引号，同时在脚注中保留不加引号的可能。
- issue: 如何表达ἐξουσιάζω与ἔξεστιν之间可能存在的词根呼应
  choice: 分别译为“可以做”和“受……辖制”，优先保证现代汉语自然且准确
  alternative: 译成类似“凡事我都有权做……但我不让任何事物有权支配我”，更明显地复现“权”的呼应
  rationale: 原文两个词属于相关词族，带有“许可／权势”的呼应；然而在汉语正文中强行重复“有权”容易使前句被理解为主张个人权利，而不是谈某事是否获准。脚注补充“落在权势之下”的译法，以保存这一语义层面。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“凡事……但……”的重复保留了希腊文鲜明的对照与口号式节奏；“绝不”传达显式主语ἐγώ及否定结构所体现的坚定语气。
