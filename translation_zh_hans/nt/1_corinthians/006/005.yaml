id: 1CO.6.5
reference: 1 Corinthians 6:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: πρὸς ἐντροπὴν ὑμῖν λέγω. οὕτως οὐκ ἔνι ἐν ὑμῖν ⸂οὐδεὶς σοφὸς⸃ ὃς δυνήσεται διακρῖναι ἀνὰ μέσον τοῦ ⸀ἀδελφοῦ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/005.yaml
  text: I say this to your shame[a]. Is it really so[b], that there is not among you even one wise man who will be able to judge between his brothers?
translation:
  language: zh_hans
  text: 我说这话，是要叫你们羞愧。难道你们中间竟没有一个有智慧的人，能在弟兄之间作出判断吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρὸς ἐντροπὴν ὑμῖν
  choice: 是要叫你们羞愧
  rationale: 表达这句话指向听众羞愧的目的或结果，保留保罗责备的力度，同时符合现代汉语表达。
- source_word: οὕτως
  choice: 难道……竟
  rationale: 在此引出带有愤慨意味的反问；用“难道……竟”自然传达其修辞力度，而不是机械译作“这样”。
- source_word: οὐκ ἔνι ἐν ὑμῖν
  choice: 你们中间……没有
  rationale: 明确指哥林多信徒群体内部不存在这样的人，贴合ἔνι与ἐν ὑμῖν的群体语境。
- source_word: οὐδεὶς σοφὸς
  choice: 没有一个有智慧的人
  rationale: 保留“连一个也没有”的强调，同时汉语“人”可自然涵盖全会众，不必把希腊语阳性语法形式误解为仅限男性。
- source_word: δυνήσεται
  choice: 能
  rationale: 汉语情态动词“能”在反问中自然表达预期能力；若直译为“将能”反而生硬。
- source_word: διακρῖναι
  choice: 作出判断
  rationale: 上下文涉及信徒间的诉讼纠纷，此动词指辨断并裁决争议；“作出判断”保留司法语境，又不过度限定为正式仲裁。
- source_word: ἀνὰ μέσον τοῦ ἀδελφοῦ αὐτοῦ
  choice: 在弟兄之间
  rationale: 希腊语在“之间”之后只明说单数“他的弟兄”，另一方由结构和上下文隐含。汉语“在弟兄之间”自然表达信徒彼此间的争议，避免增添原文没有明说的“另一个人”。
theological_decisions:
- issue: 混合会众中的阳性单数代表性用语
  choice: 一个有智慧的人……弟兄之间
  alternative: 一个有智慧的男人……他的弟兄和另一个人之间
  rationale: 希腊语使用阳性单数，但保罗面向整个会众发问。现代汉语用“人”准确保留代表性范围；“弟兄”则保留信徒群体的亲属称谓，而“之间”不擅自补足椭圆结构的另一方。
- issue: διακρῖναι在诉讼语境中的含义
  choice: 作出判断
  alternative: 仲裁；辨别
  rationale: 前后文讨论信徒彼此争讼，因此这里具有裁断纠纷的含义；“作出判断”既体现法律语境，也不把该行为制度化为特定教会职分。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“难道……竟……吗”传达保罗尖锐的反问语气；句式保持紧凑。“弟兄”保留早期信徒群体的亲属性称呼，在此按语境泛指同为信徒的人。
