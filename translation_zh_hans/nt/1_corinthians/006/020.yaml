  text: ἠγοράσθητε γὰρ τιμῆς· δοξάσατε δὴ τὸν θεὸν ἐν τῷ σώματι ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/020.yaml
  text: For you were bought with a price[b][a]; therefore glorify God in your body.
translation:
  language: zh_hans
  text: 因为你们是付了价钱买来的[a]；所以[b]，要在你们的身体里荣耀上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为你们是以买价购得的。”希腊文保留了付出买价的意象。
    reason: lexical_alternative
  - marker: b
    text: “所以”也可译作“那么”，或不单独译出；这里的语气词也加强了命令的迫切感。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγοράσθητε
  choice: 是……买来的
  rationale: 保留ἀγοράζω明确的买卖意象和被动语态，同时使用自然的现代汉语表达。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ承接上文，为此前的劝诫说明理由；“因为”清楚呈现其因果连接作用。
- source_word: τιμῆς
  choice: 付了价钱
  rationale: 此处属表示买价的属格；译文保留实际付出价钱的商业意象，却不擅自添加“重”或“高”等原文未明说的程度。
- source_word: δοξάσατε
  choice: 要……荣耀
  rationale: 保留δοξάζω的神学分量；“要”配合命令语气，形成庄重而自然的劝令。
- source_word: δὴ
  choice: 所以
  rationale: 在此表达由前述理由引出的劝令，也带有催促语气；“所以”自然呈现推论关系，语气上的细微差别另以脚注说明。
- source_word: ἐν τῷ σώματι ὑμῶν
  choice: 在你们的身体上
  rationale: 具体保留σῶμα“身体”，契合上下文关于身体行为的论述；“在……上”也避免把ἐν仅限定为工具用法。
theological_decisions:
- issue: 买价与救赎的商业意象
  choice: 保留“付了价钱买来”的表述
  alternative: 付上代价得蒙救赎
  rationale: 原文直接采用买卖用语，却未在本节说明买价为何；保留该意象可避免把经文提前收窄为某一套解释。
- issue: 身体伦理
  choice: 将σῶμα具体译作“身体”
  alternative: 自己／生命
  rationale: 紧邻语境讨论身体与性行为，因此不将其泛化为整个人或生活。
- issue: ἐν的语义范围
  choice: 译作“在你们的身体上”
  alternative: 用你们的身体
  rationale: 此译法保留身体作为荣耀上帝得以体现之领域的含义，不单独断定其仅为工具用法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“付了价钱”避免传统“重价”可能附加原文未明说的高昂程度；分成两句，使理由与命令的推进清晰。所有脚注标记均已置入正文。
