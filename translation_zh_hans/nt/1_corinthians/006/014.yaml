  text: ὁ δὲ θεὸς καὶ τὸν κύριον ἤγειρεν καὶ ἡμᾶς ἐξεγερεῖ διὰ τῆς δυνάμεως αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/014.yaml
  text: And God raised the Lord and will also raise us by his power.
translation:
  language: zh_hans
  text: 神既使主复活，也要借着自己的能力使我们复活。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: 既……也……
  rationale: δὲ在这里是温和的承接词，不表示强烈转折。汉语用“既……也……”自然衔接上下文，并与两个καί所表达的并列呼应。
- source_word: θεὸς
  choice: 神
  rationale: θεός的标准译法；本句明确以神为施行复活的主体。
- source_word: τὸν κύριον
  choice: 主
  rationale: κύριος在此指耶稣，并作为基督论称号使用；译作“主”准确且符合现代中文圣经语体。
- source_word: ἤγειρεν
  choice: 使……复活
  rationale: ἐγείρω在此指神使耶稣从死人中复活。译作“使……复活”比单译“叫……起来”更清楚地传达本句含义。
- source_word: ἡμᾶς
  choice: 我们
  rationale: 第一人称复数宾格，在上下文中包括保罗及其信徒读者。
- source_word: ἐξεγερεῖ
  choice: 要使……复活
  rationale: ἐξεγείρω的将来时，与前面的ἤγειρεν平行，指神将来使我们复活；现代汉语无需刻意表现词首ἐξ-与ἐγείρω之间的细微形式差异。
- source_word: διὰ τῆς δυνάμεως αὐτοῦ
  choice: 借着自己的能力
  rationale: διά加属格表示凭借的途径或手段。“借着自己的能力”自然表达神以其能力成就复活；“自己的”清楚回指本句主语神。
theological_decisions:
- issue: 将来时分句所指的复活
  choice: 信徒将来身体复活
  alternative: 泛指神的伸冤，或比喻性的属灵兴起
  rationale: 直接上下文集中谈论身体（林前6:13—20），而“使我们复活”与神已经“使主复活”平行，因此最自然地指信徒将来真实的身体复活；译文不另加“身体”或“从死人中”，以免超出原文措辞。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“既……也……”保持句子的承接和对称；“使……复活”明确传达复活语义，同时不在正文中加入原文没有明说的解释。
