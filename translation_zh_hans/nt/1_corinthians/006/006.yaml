  text: ἀλλὰ ἀδελφὸς μετὰ ἀδελφοῦ κρίνεται, καὶ τοῦτο ἐπὶ ἀπίστων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/006.yaml
  text: But brother goes to court against brother[b][a], and this before unbelievers?
translation:
  language: zh_hans
  text: 可是，弟兄竟与弟兄打官司[b]，而且是在不信的人面前[a]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在那些不信的人面前。”这里很可能指由教会之外的人主持的世俗法庭，但希腊原文只说“在不信的人面前”。
    reason: lexical_alternative
  - marker: b
    text: 这里重复说“弟兄”，指基督徒群体中同属一家的成员。
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλὰ
  choice: 可是
  rationale: 承接上文形成强烈转折，指出实际情形与本应在教会内部审断的做法相反。
- source_word: ἀδελφὸς μετὰ ἀδελφοῦ
  choice: 弟兄竟与弟兄
  rationale: 保留原文重复的亲属称谓及单数阳性形式；“与”在“对簿公堂”的语境中自然表达双方对立。“竟”传达本句责问中的震惊意味。
- source_word: κρίνεται
  choice: 对簿公堂
  rationale: 该词在上下文中具有诉讼含义；此译法用庄重而通行的现代汉语表达彼此打官司，而不误解为单纯受审。
- source_word: καὶ τοῦτο
  choice: 而且是
  rationale: 体现递进和强调：不仅弟兄彼此诉讼，更是在不信的人面前进行。
- source_word: ἐπὶ ἀπίστων
  choice: 在不信的人面前
  rationale: 保留原文较宽泛的表述，不擅自补入“法官”；结合诉讼语境，可理解为由教会之外不信的人审理。
theological_decisions:
- issue: ἀδελφός在教会群体中的代表性用法
  choice: 弟兄
  alternative: 信徒／弟兄姊妹
  rationale: 保留原文阳性单数及保罗刻意重复的家人称谓；注释说明这里指基督徒群体中的成员，避免在正文中消除原文形式。
- issue: ἀπίστων所指的范围
  choice: 不信的人
  alternative: 不信的法官／教外人
  rationale: 原文只明说“不信的人”。诉讼语境很可能指教会外审理案件的人，但正文不将这一推断窄化为“法官”。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“对簿公堂”准确传达司法诉讼语境；保留“弟兄……弟兄”的重复，以呈现保罗责问的修辞力度。正文中的脚注标记与注释逐一对应。
