id: 1CO.6.17
reference: 1 Corinthians 6:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ κολλώμενος τῷ κυρίῳ ἓν πνεῦμά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/017.yaml
  text: But the one who joins himself to the Lord is one spirit with him[a][b][c].
translation:
  language: zh_hans
  text: 但与主联合的人，就是与他成为一灵[a][b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使自己与主联合。”希腊语动词既可带反身意味，也可作近似被动的表达。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“就是一灵”；“与他”是根据上下文补出的。
    reason: lexical_alternative
  - marker: c
    text: “灵”也可能被理解为“圣灵”；不过，这句话更自然地表示信徒与主联合，成为一灵。
    reason: alternative_reading
lexical_decisions:
- source_word: κολλώμενος（κολλάομαι）
  choice: 与……联合
  rationale: 这个词表示紧密依附或结合。此处紧接上一节身体成为“一体”的说法，用“联合”既保留强烈的结合意味，也符合现代汉语表达；其语态可含“使自己联合”或“被联合”的意味。
- source_word: τῷ κυρίῳ（κύριος）
  choice: 与主
  rationale: 在保罗书信的语境中，“主”指复活的耶稣，并具有超出一般主人或掌权者的神学分量。
- source_word: ἓν
  choice: 一
  rationale: 直译数词“一个／一”，表达真实的合一，而不只是意见一致或彼此和谐。
- source_word: πνεῦμα
  choice: 灵
  rationale: 这里最自然地指人与主联合而成为“一灵”。简体中文没有大小写之分，因此在脚注中保留其也可能被理解为“圣灵”的解释空间。
- source_word: ὁ δὲ ... ἐστιν
  choice: 但……的人，就是……
  rationale: 冠词加分词构成名词性表达，意为“那与主联合的人”；译作“……的人”自然且具有代表性。“就是”清楚呈现系词结构。
theological_decisions:
- issue: “一灵”所表达的联合性质
  choice: 表达信徒与主真实而深刻的属灵联合，同时不暗示二者本体混同。
  alternative: 可理解为更强的神秘同一，或仅指共同的心志与目的。
  rationale: 上下文把与娼妓成为“一体”同与主成为“一灵”相对照，因此必须保留联合语言的力度，也不应把“一”解释为信徒与主失去区别。
- issue: 补出“与他”
  choice: 正文补出“与他”，明确成为一灵的双方。
  alternative: 按希腊文表面形式只译“就是一灵”。
  rationale: 希腊文可由上下文隐含关系对象；现代汉语若只说“是一灵”容易显得突兀。补出“与他”不改变所指，并在脚注中注明。
- issue: πνεῦμα是否特指圣灵
  choice: 正文译“灵”，主要理解为信徒在灵里与主联合。
  alternative: 将πνεῦμα理解为圣灵，即与主在同一位圣灵里联合。
  rationale: 希腊文原稿没有大小写区别，语法本身不能完全排除圣灵的解释；然而与上一节“一体”的平行关系更自然地支持“成为一灵”的联合含义。中文正文保持“灵”，脚注保留歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“与主联合”保持经文的关系性和神学力度；“一灵”略带经文体色彩，但准确保留了原文与上一节“一体”的对应。所有解释性补足与真实歧义均以脚注标明。
