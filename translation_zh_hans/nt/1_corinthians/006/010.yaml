base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/010.yaml
  text: nor thieves[a], nor the greedy, nor drunkards, nor revilers[c][b], nor swindlers will inherit the kingdom of God.
translation:
  language: zh_hans
  text: 偷窃的人、贪婪的人、醉酒的人、辱骂人的、强取财物的人[a]，都不能承受上帝的国。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “强取财物的人”或译“勒索财物的人”“掠夺的人”。
    reason: lexical_alternative
  - marker: b
    text: “承受”指作为继承人得到；亦可译“继承”。
    reason: inheritance_idiom
lexical_decisions:
- source_word: κλέπται
  choice: 偷窃的
  rationale: 指以偷窃为特征的人；“偷窃的”自然易懂，也保持恶行清单中对人的指称。
- source_word: πλεονέκται
  choice: 贪婪的
  rationale: 指贪得无厌、总想占有更多的人，常含物质利益层面的意味；“贪婪的”是现代汉语中清楚而准确的表达。
- source_word: μέθυσοι
  choice: 醉酒的
  rationale: 指惯常沉醉于酒的人，而非仅仅曾有一次喝醉；在清单结构中，“醉酒的”简洁自然。
- source_word: λοίδοροι
  choice: 辱骂人的
  rationale: 该词指以侮辱、恶言攻击他人的人；“辱骂人的”比“诽谤人的”范围更准确，因为原词不限于虚假指控。
- source_word: ἅρπαγες
  choice: 勒索人的
  rationale: 该词含强取、掠夺或利用他人牟利之意；“勒索人的”能体现掠夺性获利，同时以脚注保留较宽的译法。
- source_word: βασιλείαν θεοῦ
  choice: 上帝的国
  rationale: 保留保罗用语中“国度／统治”的神学内涵，并采用现代中文基督教语境中通行、庄重的表达。
- source_word: κληρονομήσουσιν
  choice: 承受
  rationale: 原词指作为继承者得着产业；“承受上帝的国”保留继承和末世性的含义，也符合庄重自然的中文表达。
theological_decisions:
- issue: 恶行清单对人的指称及承受国度的含义
  choice: 直译为这些类别的人“都不能承受上帝的国”，不在正文中加入“惯常”“不悔改”等解释性限定。
  alternative: 明确译成“持续这样做而不悔改的人不能承受上帝的国”，或把清单理解为任何一次孤立行为。
  rationale: 希腊文以复数名词指称具有这些特征的人，但没有明说频率或悔改状况。译文保留其严肃判断及神学张力，不把解释性结论写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。各项统一用“……的／……人的”构成并列清单；避免较生僻的“辱骂者”“勒索者”，也不在正文中加入原文没有明说的行为频率或悔改条件。
