id: 1CO.6.19
reference: 1 Corinthians 6:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἢ οὐκ οἴδατε ὅτι τὸ σῶμα ὑμῶν ναὸς τοῦ ἐν ὑμῖν ἁγίου πνεύματός ἐστιν, οὗ ἔχετε ἀπὸ θεοῦ; καὶ οὐκ ἐστὲ ἑαυτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/019.yaml
  text: Or do you not know that your body is a temple of the Holy Spirit within you[a], whom you have from God? And you are not your own[b],
translation:
  language: zh_hans
  text: 还是你们不知道吗？你们的身体是住在你们里面的圣灵的殿[a]；这圣灵是你们从上帝那里得来的。你们并不属于自己[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们的身体是圣灵的殿；圣灵住在你们里面。”
    reason: 原文属格与介词短语在汉语中可用不同句法安排表达；此译法同样保留身体属于圣灵之殿以及圣灵在信徒里面两层意思。
  - marker: b
    text: 原文的“身体”是单数，“你们”是复数；可理解为逐一指你们每个人的身体，也可理解为代表性地指整体。
    reason: 保留原文单复数搭配所产生的真实歧义，不在正文中将其限定为某一种理解。
lexical_decisions:
- source_word: ἢ
  choice: 还是
  rationale: 承接上文，引出尖锐的反问和另一层论证；现代汉语以“还是……吗”自然保留这种修辞转折。
- source_word: οὐκ οἴδατε
  choice: 你们不知道吗
  rationale: 保留保罗常用的反问句式，也直接对应“知道”的基本义。
- source_word: τὸ σῶμα ὑμῶν
  choice: 你们的身体
  rationale: 保留原文“身体”为单数而“你们”为复数的形式，不擅自判定它是逐一分配还是代表整体。
- source_word: ναὸς
  choice: 殿
  rationale: ναός指神圣的殿或圣所；“殿”简洁庄重，并能自然承载圣灵居住其中的比喻。
- source_word: τοῦ ἐν ὑμῖν ἁγίου πνεύματός
  choice: 住在你们里面的圣灵的
  rationale: 明确该属格短语修饰“殿”，并将ἐν ὑμῖν自然表达为“住在你们里面”，不改变其基本空间隐喻。
- source_word: οὗ ἔχετε ἀπὸ θεοῦ
  choice: 这圣灵是你们从上帝那里得来的
  rationale: 汉语若逐字译为“你们从上帝那里有的”较生硬；“得来的”表达其来源，同时以“这圣灵”清楚保留关系代词所指。
- source_word: καὶ οὐκ ἐστὲ ἑαυτῶν
  choice: 你们并不属于自己
  rationale: 准确表达反身属格的归属含义，在现代汉语中比“你们不是自己的”更自然，也保留为下一节理由铺垫的简洁力度。
theological_decisions:
- issue: 关系代词οὗ的所指及圣灵的位格性
  choice: 以“这圣灵”承接，并说“这圣灵是你们从上帝那里得来的”
  alternative: 译为非位格性的“这是你们从上帝那里得来的”
  rationale: οὗ在语法上回指“圣灵”。汉语用“这圣灵”既消除所指歧义，又不添加原文以外的神学陈述。
- issue: 单数“身体”与复数受众之间的张力
  choice: 保留“你们的身体”
  alternative: 译作“你们各人的身体”或“你们的身体（复数意义）”
  rationale: 原文以单数τὸ σῶμα搭配复数ὑμῶν，既可作逐一分配理解，也可能具有代表性；正文保留这种张力，不替读者作决定。
- issue: “殿”的归属与圣灵内住的关系
  choice: 译为“住在你们里面的圣灵的殿”
  alternative: 译为“圣灵在你们里面的殿”
  rationale: 所选语序清楚表明身体是圣灵的殿，同时保留圣灵“在你们里面”的陈述，避免把介词短语误解为修饰“殿”的位置。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“还是……不知道吗”保留保罗反问的力度；“殿”保持经文意象的神圣感；用分号拆开较长的希腊句法，使“这圣灵”的所指在汉语中清楚。末尾保留逗号，因为本句论述在下一节继续。
