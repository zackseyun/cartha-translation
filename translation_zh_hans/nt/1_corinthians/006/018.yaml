  text: φεύγετε τὴν πορνείαν· πᾶν ἁμάρτημα ὃ ἐὰν ποιήσῃ ἄνθρωπος ἐκτὸς τοῦ σώματός ἐστιν, ὁ δὲ πορνεύων εἰς τὸ ἴδιον σῶμα ἁμαρτάνει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/018.yaml
  text: Flee sexual immorality. Every sin that a person may commit is outside the body[a], but the one who commits sexual immorality sins against his own body.
translation:
  language: zh_hans
  text: 你们要逃避淫乱。人所犯的任何罪都在身体以外[a]；但行淫的人，是得罪自己的身体。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在身体以外”按字面译自希腊文。本句的范围和修辞作用历来有不同理解；希腊文本没有明说这是引语。
    reason: 删除“都与身体无关”这一过强且非等值的释义，同时保留原文表达的张力及引语归属未明的事实。
lexical_decisions:
- source_word: φεύγετε
  choice: 你们要逃避
  rationale: 现在时主动命令语气、第二人称复数，表达持续而迫切的躲避；“要逃避”在现代汉语中简洁自然，并保留命令力度。
- source_word: πορνείαν
  choice: 淫乱
  rationale: πορνεία泛指不合正当规范的性行为；“淫乱”是简明、庄重且范围较广的现代中文圣经用语，不限于未婚性行为。
- source_word: πᾶν ἁμάρτημα ὃ ἐὰν ποιήσῃ ἄνθρωπος
  choice: 人所犯的任何罪
  rationale: “任何罪”自然表达πᾶν的概括性；ἄνθρωπος在这里是泛指人类个体，并非特指男性，因此译作“人”；“所犯的”简洁传达ποιήσῃ在此与罪搭配时的含义。
- source_word: ἐκτὸς τοῦ σώματός ἐστιν
  choice: 都在身体以外
  rationale: 保留原文空间性隐喻及其与下句的鲜明对照，不在正文中解释这一有争议的断言。
- source_word: ὁ δὲ πορνεύων
  choice: 但行淫的人
  rationale: 实词化的现在分词指从事该行为的人；“行淫的人”保留动作性，并与前面的“淫乱”形成词义呼应。
- source_word: εἰς τὸ ἴδιον σῶμα ἁμαρτάνει
  choice: 是得罪自己的身体
  rationale: εἰς在这里表达罪所指向的对象；中文“得罪自己的身体”自然传达“对自己的身体犯罪”的意思，同时保留ἴδιον的反身强调。
theological_decisions:
- issue: ἄνθρωπος在概括性陈述中的译法
  choice: 人
  alternative: 男人／一个人
  rationale: 原词虽为语法上的阳性单数，在此却具有代表性、泛指意义。现代汉语的“人”既准确又自然，不引入仅限男性的含义。
- issue: “任何罪都在身体以外”的解释力度
  choice: 按原文直接翻译，保留其张力
  alternative: 把它明确标作哥林多人所说的口号，或在正文中加以限制和调和
  rationale: 希腊文本直接陈述此句，却没有明示引语标记；其范围和修辞作用存在争议，因此正文不替读者预先解决。
- issue: εἰς τὸ ἴδιον σῶμα所表达的关系
  choice: 得罪自己的身体
  alternative: 在自己的身体里面犯罪／就自己的身体犯罪
  rationale: “得罪”清楚表达罪指向自身身体，同时避免把εἰς机械地译成物理上的“进入”。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“你们”明确复数命令对象；分号保留两句之间的强烈对照。正文避免性别误读，也不把有争议的“身体以外”解释为某一特定神学立场。
