  text: Ἢ οὐκ οἴδατε ὅτι ἄδικοι ⸂θεοῦ βασιλείαν⸃ οὐ κληρονομήσουσιν; μὴ πλανᾶσθε· οὔτε πόρνοι οὔτε εἰδωλολάτραι οὔτε μοιχοὶ οὔτε μαλακοὶ οὔτε ἀρσενοκοῖται
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/009.yaml
  text: 'Or do you not know that the unrighteous will not inherit the kingdom of God? Do not be deceived: neither the sexually immoral[a], nor idolaters, nor adulterers, nor effeminate men[b], nor men who have sex with men'
translation:
  language: zh_hans
  text: 难道你们不知道，不义的人不能承受上帝的国吗？不要受骗：无论是淫乱的人、拜偶像的人、通奸的人、阴柔的男子[a]，还是与男性发生性关系的男人[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴柔的男子”所译的希腊词 μαλακοί 本义为“柔软的”。它可指阴柔、道德上软弱或放纵的人；在这里也可能特指男妓，或男男性行为中作被动方的人。
    reason: lexical_alternative
  - marker: b
    text: “与男性发生性关系的男人”所译的希腊词 ἀρσενοκοῖται 十分罕见，确切范围有争议。许多学者认为它与《利未记》希腊译文中“男人”和“同寝”的措辞有关；也可译作“与男性行淫的人”或“从事男男性行为的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: 难道
  rationale: 结合反问句式表达保罗承接上文的尖锐反问；汉语不必机械译出句首“或”。
- source_word: οὐκ οἴδατε
  choice: 你们不知道……吗
  rationale: 保留保罗惯用的反问公式，也自然体现复数第二人称。
- source_word: ἄδικοι
  choice: 不义的人
  rationale: 保留该词对人的道德定性及其神学分量，不缩减为个别恶行。
- source_word: θεοῦ βασιλείαν
  choice: 上帝的国
  rationale: 采用清楚、通行的圣经表达，准确反映属格结构。
- source_word: οὐ κληρονομήσουσιν
  choice: 不能承受
  rationale: “承受”保留继承产业的意象以及末世和圣约意味；在此将将来否定自然译为“不能承受”。
- source_word: μὴ πλανᾶσθε
  choice: 不要受骗
  rationale: 保留被动命令的开放性，既不限定欺骗者，也不擅自改成“不要自欺”。
- source_word: πόρνοι
  choice: 淫乱的人
  rationale: 用现代读者易懂的概括性表达指涉各种性方面的不道德行为，避免古奥或过窄的说法。
- source_word: εἰδωλολάτραι
  choice: 拜偶像的人
  rationale: 直接、自然地表达偶像崇拜者。
- source_word: μοιχοὶ
  choice: 通奸的人
  rationale: 明确保留该词所指的婚姻关系中的性不忠。
- source_word: μαλακοὶ
  choice: 柔弱的男人
  rationale: 以较贴近字面的措辞保留“柔软、柔弱”这一基本语义，不在正文中断定它必然专指男男性行为中的被动一方；争议语境义见脚注。
- source_word: ἀρσενοκοῖται
  choice: 与男人发生性关系的男人
  rationale: 以行为描述而非现代身份类别来表达该罕见复合词通常被理解的男性同性性行为含义，同时在脚注中说明其范围仍有争议。
theological_decisions:
- issue: 争议性恶行清单中 μαλακοὶ 与 ἀρσενοκοῖται 的翻译
  choice: 正文分别译作“柔弱的男人”和“与男人发生性关系的男人”，并以脚注交代语义争议
  alternative: 将二词分别解释为“在男男性行为中作被动方的人”和“与男性行淫的人”，或译作传统但含义易误解的“娈童”和“亲男色者”
  rationale: μαλακοὶ 的基本义是“柔软的”，在此可能指阴柔、缺乏节制、男妓，或男男性行为中的被动方；ἀρσενοκοῖται 很可能与《利未记》希腊译文的用语有关，但作为罕见词，其确切范围仍有争议。正文避免套用现代性取向身份，也不把两词未经说明地合并为同一概念。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文反问的力度和清单式节奏。末尾使用逗号，因为原文的恶行清单在下一节继续，避免把第9节误作完整收束。
