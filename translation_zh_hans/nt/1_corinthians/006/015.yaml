  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι τὰ σώματα ὑμῶν μέλη Χριστοῦ ἐστιν; ἄρας οὖν τὰ μέλη τοῦ Χριστοῦ ποιήσω πόρνης μέλη; μὴ γένοιτο.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/015.yaml
  text: Do you not know that your bodies are members of Messiah? Shall I then take the members of Messiah and make them members of a prostitute? May it never be[a][b].
translation:
  language: zh_hans
  text: 难道你们不知道，你们的身体是基督的肢体吗？那么，我岂可把基督的肢体拿去，使它们成为娼妓的肢体吗？绝对不可！[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基督”也可译作“弥赛亚”；希腊语Χριστός既可作为“受膏者”的称号，也可具有近似专名的用法。
    reason: alternative_reading
  - marker: b
    text: “绝对不可”也可译作“断乎不可”或“万万不可”；希腊语μὴ γένοιτο表示强烈的否定和斥绝。
    reason: lexical_alternative
lexical_decisions:
- source_word: σώματα
  choice: 身体
  rationale: 复数指信徒真实、有形的身体；中文以“你们的身体”自然表达群体中各人的身体，也与本段有关淫乱的论述相合。
- source_word: μέλη
  choice: 肢体
  rationale: “肢体”既保留身体各部分的意象，也能表达归属于更大整体的成员关系，适合保罗在此的身体隐喻。
- source_word: Χριστοῦ
  choice: 基督的
  rationale: 现代中文圣经语境中，“基督”是Χριστός自然且庄重的通行译法，并仍保留“受膏者”的称号背景。
- source_word: ἄρας
  choice: 拿去
  rationale: 该不定过去时分词与后面的修辞疑问结合，表示设想中的行动；“拿去”兼具取用和移作他用的意味。
- source_word: ποιήσω
  choice: 使它们成为
  rationale: 明确表达“使……成为”的使役关系，并补出复数代词，使中文所指清楚而不增加实质内容。
- source_word: πόρνης
  choice: 娼妓的
  rationale: πόρνη在此具体指从事卖淫的女人；“娼妓”准确、庄重，也比泛称“淫乱的女人”更具词义针对性。
- source_word: μὴ γένοιτο
  choice: 绝对不可
  rationale: 这是强烈否定并厌弃前述推论的惯用语；“绝对不可”在现代中文中简洁有力，保留其斥绝语气。
- source_word: οὐκ οἴδατε
  choice: 难道你们不知道
  rationale: 保留诉诸听众本应知道之事的反问语气，并符合自然现代汉语。
theological_decisions:
- issue: Χριστός在信徒与基督肢体关系中的译法
  choice: 基督
  alternative: 弥赛亚
  rationale: 此处既可感受到称号背景，也已在保罗书信中呈现近似专名的用法。正文采用中文读者最自然熟悉的“基督”，脚注保留“弥赛亚”这一称号性译法，避免抹平词语功能上的可能张力。
- issue: μὴ γένοιτο的斥绝力度
  choice: 绝对不可
  alternative: 断乎不可／万万不可
  rationale: 该短语不仅是否定，更是对设想的强烈拒斥。“绝对不可”保持力度，同时采用现代、易懂而不失庄重的表达。
- issue: 身体与基督之联合的隐喻
  choice: 身体是基督的肢体
  alternative: 身体是基督身体的部分
  rationale: 原文没有明说“基督的身体”，只说“基督的肢体”。正文不补入“身体”，以保留原文凝练而具张力的联合表述。
translation_notes:
  register: 采用现代、庄重、易懂的标准普通话。两个反问保留保罗论证的冲击力；以“肢体”贯穿重复意象。正文中的[a][b]均置于相应强烈否定句之后，脚注分别说明Χριστός与μὴ γένοιτο的译法。
