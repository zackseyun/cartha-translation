  text: ἵνα καὶ ὑμεῖς ὑποτάσσησθε τοῖς τοιούτοις καὶ παντὶ τῷ συνεργοῦντι καὶ κοπιῶντι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/016.yaml
  text: that you also submit yourselves to such people[b][a], and to everyone who works and labors.
translation:
  language: zh_hans
  text: 也要顺服这样的人，以及每一个一同做工、辛勤劳苦的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα καὶ ὑμεῖς
  choice: 也要
  rationale: ἵνα承接上一节的劝告内容，καὶ ὑμεῖς强调哥林多人也应如此回应；汉语用“也要”自然地表达这一承接和劝勉语气。
- source_word: ὑποτάσσησθε
  choice: 顺服
  rationale: 该词在此要求听众自愿置身于这类服事者的带领和秩序之下；“顺服”保留其力度，又不额外加入绝对服从的含义。
- source_word: τοῖς τοιούτοις
  choice: 这样的人
  rationale: 指上文司提反一家那样献身服事圣徒的人，重点是这一类人，并非性别。
- source_word: παντὶ τῷ συνεργοῦντι
  choice: 每一个同工的人
  rationale: συνεργέω表示共同工作、协力做工；译作“同工”简洁自然，并保留共同参与工作的含义。
- source_word: καὶ κοπιῶντι
  choice: 同劳的人
  rationale: κοπιάω强调辛勤、劳苦地工作；“同劳”与前面的“同工”形成自然并列，也体现劳苦的意味。
theological_decisions:
- issue: 所要求的顺服具有什么性质
  choice: 对上文所述那类忠心服事者及其他共同劳作之人的顺服
  alternative: 对制度性权威无条件、普遍性的服从
  rationale: 上下文聚焦司提反一家及一切参与并劳苦服事的人；译文保留“顺服”的命令力度，却不把经文扩展为它没有明说的绝对或制度化主张。
- issue: 两个分词所指人员的关系
  choice: 将共同做工和劳苦工作理解为可共同修饰同一概括群体
  alternative: 明确分作两个彼此不同的群体
  rationale: 希腊文παντὶ τῷ συνεργοῦντι καὶ κοπιῶντι在语法上自然允许两个分词共同描述“每一个”人；译文不强行把他们拆成两个群体。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“同工同劳”简洁地再现两个并列分词，但可能被读作凝练的教会用语，因此以脚注给出展开译法。脚注标记置于正文相应句末。
