  text: Ἐὰν δὲ ἔλθῃ Τιμόθεος, βλέπετε ἵνα ἀφόβως γένηται πρὸς ὑμᾶς, τὸ γὰρ ἔργον κυρίου ἐργάζεται ὡς ⸀κἀγώ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/010.yaml
  text: If Timothy comes[a], see that he may be with you without fear, for he is doing the Lord’s work[b], as I also am.
translation:
  language: zh_hans
  text: 如果提摩太来了，你们务要使他在你们那里不必惧怕[a]，因为他在做主的工作[b]，我也是如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使他在你们中间不必惧怕。”希腊语表达可着重指提摩太身处他们中间时免于恐惧。
    reason: lexical_alternative
  - marker: b
    text: 或译：“因为他做主的工，正如我也在做一样。”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν δὲ ἔλθῃ Τιμόθεος
  choice: 如果提摩太来了
  rationale: ἐάν加虚拟语气表达将来可能发生的条件；“如果……来了”是自然的现代汉语。δέ在这里是轻微的语篇衔接，不必强译为带明显转折意味的“但是”。
- source_word: βλέπετε
  choice: 你们务要使
  rationale: 该命令要求哥林多人主动留意并采取行动；结合后面的ἵνα从句，“务要使”比单纯的“看”更准确、自然。
- source_word: ἵνα ἀφόβως γένηται πρὸς ὑμᾶς
  choice: 使他在你们那里无所惧怕
  rationale: 保留γένηται πρὸς ὑμᾶς所表达的处境和同在关系，也保留ἀφόβως“没有惧怕”的含义，不将其缩减为纯粹的内心感受。
- source_word: τὸ γὰρ ἔργον κυρίου ἐργάζεται
  choice: 因为他在做主的工作
  rationale: 用“在做”体现现在时所表达的持续活动；“主的工作”自然地保留属格结构。
- source_word: ὡς κἀγώ
  choice: 我也是如此
  rationale: κἀγώ意为“我也”；用承接式表达补足希腊语省略的谓语，指保罗也在做主的工作，同时避免汉语中生硬的重复。
theological_decisions:
- issue: κυρίου中“主”的所指
  choice: 保留“主”，不在正文中进一步指明
  alternative: 明确译为“主耶稣”
  rationale: 保罗书信中的所指很可能是主耶稣，但希腊文本这里只写“主”；正文保留原文的措辞，不加入解释性限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“务要”保留使徒命令的郑重语气；“无所惧怕”比“毫不害怕”略为庄重，但仍属现代常用表达。
