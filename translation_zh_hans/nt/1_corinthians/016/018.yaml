  text: ἀνέπαυσαν γὰρ τὸ ἐμὸν πνεῦμα καὶ τὸ ὑμῶν. ἐπιγινώσκετε οὖν τοὺς τοιούτους.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/018.yaml
  text: For they refreshed my spirit and yours[a]. Therefore acknowledge such men.
translation:
  language: zh_hans
  text: 因为他们使我和你们的心灵都得到了舒畅。所以，你们要看重这样的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看重”也可译作“认可”或“赏识”。原文所说“这样的人”在这里具体指前面提到的那几位男子。
    reason: 说明ἐπιγινώσκετε的语义范围，以及τοὺς τοιούτους在上下文中的具体所指。
lexical_decisions:
- source_word: ἀνέπαυσαν
  choice: 使……得到振奋
  rationale: 此处是比喻用法，表示使人的内在状态得到舒缓、恢复和鼓舞，并非指身体上的休息。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文，说明保罗为何看重前述几人；现代汉语以“因为”自然表达其理由关系。
- source_word: πνεῦμα
  choice: 心灵
  rationale: 这里指人的内在精神和情感状态，并非圣灵；“心灵”比单用“灵”更不易引起误解。
- source_word: τὸ ἐμὸν πνεῦμα καὶ τὸ ὑμῶν
  choice: 我和你们的心灵
  rationale: 希腊文在“你们的”之后省略了“心灵”；译文补足共同成分，并保留保罗与哥林多人并列的结构。
- source_word: ἐπιγινώσκετε
  choice: 赏识
  rationale: 这里不只是辨认或知道这些人，而是要求会众承认其价值并给予应有的肯定；“赏识”自然表达这层正面认可，又不强化为正式尊荣。
- source_word: οὖν
  choice: 所以
  rationale: 标明由前述事实引出的劝勉，在现代汉语中简洁自然。
- source_word: τοὺς τοιούτους
  choice: 这样的人
  rationale: 指像司提法那、福徒拿都和亚该古这样的具体人物；汉语“人”本身不标语法性别，既自然，也不否认上下文所指的几位男性。
theological_decisions:
- issue: τοὺς τοιούτους的性别表达
  choice: 这样的人
  alternative: 这样的弟兄／这样的男子
  rationale: 该短语在上下文中确实回指刚提到的几位男性，但现代汉语“人”可以准确回指他们，并不构成性别中和；若译作“男子”会显得生硬，“弟兄”则会加入原文未明说的称谓。
- issue: πνεῦμα所指
  choice: 人的心灵
  alternative: 圣灵／灵
  rationale: 所有格“我的”和“你们的”表明这里说的是保罗及哥林多人的内在精神状态，不是圣灵。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“得到振奋”传达内在恢复与鼓舞；“赏识”表达应有的认可，同时避免过度解释为正式授予荣誉。脚注标记置于其所说明的劝勉之后。
