  terminology: “心灵”在本节适切地表达πνεῦμα所指的人内在状态，而不误指圣灵。“这样的人”自然回指上文列名的男性同工；脚注说明具体所指，既保留汉语自然表达，也不掩盖原文及上下文的男性指涉。
