  text: χαίρω δὲ ἐπὶ τῇ παρουσίᾳ Στεφανᾶ καὶ Φορτουνάτου καὶ Ἀχαϊκοῦ, ὅτι τὸ ⸀ὑμέτερον ὑστέρημα οὗτοι ἀνεπλήρωσαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/017.yaml
  text: And I rejoice at the coming of Stephanas and Fortunatus and Achaicus[a], because these men have made up for your absence.
translation:
  language: zh_hans
  text: 我因司提法那、福徒拿都和亚该古来到而欢喜，因为他们补足了你们所缺少的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按语境也可理解为：“他们弥补了你们不能亲自前来的缺憾。”这里的“所缺少的”很可能是指哥林多人无法亲自陪伴保罗，并不一定是在责备他们有道德上的过失。
    reason: 说明τὸ ὑμέτερον ὑστέρημα的语境性解释，同时保留正文中较宽泛的措辞。
lexical_decisions:
- source_word: χαίρω
  choice: 我……欢喜
  rationale: 保留第一人称现在时的直接个人表达；“欢喜”庄重而自然，也比单纯的“高兴”更贴近该词的语气。
- source_word: δὲ
  choice: 句间顺接，不单独译出
  rationale: δέ在这里是轻微的承接词，并非强烈转折；现代汉语无需机械译作“但”或“而”。
- source_word: ἐπὶ τῇ παρουσίᾳ
  choice: ……来了，我为此
  rationale: παρουσία在此指三人的来到或亲临，而非末世论意义上的“降临”；拆译为自然汉语句式，清楚表达保罗因他们到来而欢喜。
- source_word: Στεφανᾶ καὶ Φορτουνάτου καὶ Ἀχαϊκοῦ
  choice: 司提法那、福徒拿都和亚该古
  rationale: 依常见现代中文圣经人名音译处理三个专名，并用汉语列举结构连接。
- source_word: ὅτι
  choice: 因为
  rationale: 明确引出保罗欢喜的原因。
- source_word: τὸ ὑμέτερον ὑστέρημα
  choice: 你们这方面所欠缺的
  rationale: 保留ὑστέρημα“欠缺、缺少之处”的基本意义，也保留其具体所指的语境歧义，不在正文中直接限定为道德缺失或仅指不能亲临。
- source_word: οὗτοι
  choice: 他们
  rationale: 指刚刚列出的三人；汉语代词已经足以清楚指代，无需生硬地译作“这些人”。
- source_word: ἀνεπλήρωσαν
  choice: 补足了
  rationale: 准确表达“填满、补上所缺”的完成性动作，并与“所欠缺的”自然搭配。
theological_decisions:
- issue: “你们所欠缺的”具体指什么
  choice: 正文保留为“你们这方面所欠缺的”
  alternative: 释义为“你们不能亲自前来的缺憾”
  rationale: 希腊文本本身未明说所欠缺的是亲自到场、服事、供应或其他事项。上下文很可能涉及哥林多人不能亲临保罗，但正文不应把这一推断写成唯一解释；脚注提供较可能的语境理解。
translation_notes:
  register: 采用现代、庄重而易懂的书信语体。正文以自然汉语重组“因他们的到来而欢喜”的结构；对关键短语“所欠缺的”则保持较贴近原文的表达，以免消除原有歧义。
