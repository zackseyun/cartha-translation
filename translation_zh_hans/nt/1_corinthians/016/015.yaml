  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί· οἴδατε τὴν οἰκίαν Στεφανᾶ, ὅτι ἐστὶν ἀπαρχὴ τῆς Ἀχαΐας καὶ εἰς διακονίαν τοῖς ἁγίοις ἔταξαν ἑαυτούς·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/015.yaml
  text: 'I urge you[a], brothers: you know the household of Stephanas, that they are the firstfruits of Achaia[b], and they devoted themselves to the service of the saints.'
translation:
  language: zh_hans
  text: 弟兄们[a]，我劝你们：你们知道司提法那一家是亚该亚初熟的果子[b]，而且他们投身于服事圣徒的工作。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”也可理解为“弟兄姊妹们”；希腊文直译为“弟兄们”，这是当时常用的称呼，可以包括全体会众。
    reason: lexical_alternative
  - marker: b
    text: “初熟的果子”很可能指亚该亚最早信主的一批人，同时保留了把最先收获的一份分别出来归给上帝的比喻。
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: 我劝你们
  rationale: 此处引出郑重而恳切的劝勉；“劝”在现代汉语中自然，也保留了使徒呼吁的力度。
- source_word: δὲ
  choice: 不单独译出
  rationale: δέ在此是轻微的语篇转换。中文若加“现在”容易产生时间含义；本句承接语气无需显性连接词也很自然。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊文阳性称呼形式；在保罗书信的会众称呼中，它可包括全体会众，另以脚注说明。
- source_word: οἴδατε
  choice: 你们知道
  rationale: 该完成时形式在此具有现在意义，直译为“知道”准确自然。
- source_word: τὴν οἰκίαν Στεφανᾶ
  choice: 司提法那一家
  rationale: οἰκία在此指家户或全家，不仅是房屋，也未必只限于血亲；“一家”是现代汉语中自然的集体表达。
- source_word: ἀπαρχὴ τῆς Ἀχαΐας
  choice: 亚该亚初熟的果子
  rationale: 保留ἀπαρχή的初熟果实意象及其可能包含的归给上帝之含义，同时可指当地最早的一批信徒。
- source_word: εἰς διακονίαν τοῖς ἁγίοις
  choice: 服事圣徒
  rationale: διακονία表示服事或服务；此译法简洁自然，也避免把它限定为后来的教会职分。τοῖς ἁγίοις按保罗惯用语译为“圣徒”。
- source_word: ἔταξαν ἑαυτούς
  choice: 专心
  rationale: 反身结构表达他们主动使自己投身于这项服事；“专心服事”传达有意而持续的委身，而不暗示正式任命。
theological_decisions:
- issue: 会众称呼ἀδελφοί的范围
  choice: 正文译“弟兄们”，脚注说明可包括姊妹
  alternative: 弟兄姊妹们
  rationale: 正文保留原文的阳性称呼形式，同时不否认该称呼在当时可用于包括男女的全体会众。
- issue: ἀπαρχή的比喻含义
  choice: 初熟的果子
  alternative: 最早信主的人
  rationale: 保留保罗的农业及献祭性比喻，不将其含义完全化约为时间先后；脚注交代其在本处很可能指亚该亚最早的一批信徒。
- issue: οἰκία作为集体名词后的代词关系
  choice: 用“他们”指司提法那一家
  alternative: 用“这一家”保持形式上的单数
  rationale: 希腊文先以单数ἐστίν指整个家户，随后以复数ἔταξαν ἑαυτούς指其中成员。中文用“他们”自然体现后半句的复数语义，而不抹去家户的整体性。
translation_notes:
  register: 采用现代、庄重而易懂的书信语体。“司提法那”沿用常见中文圣经人名译法，“亚该亚”“圣徒”保留通行的圣经术语。句式尽量顺畅，同时保留原文从家户整体转向家中成员的语义变化。
