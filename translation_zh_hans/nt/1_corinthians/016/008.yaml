lexical_decisions:
- source_word: ἐπιμενῶ
  choice: 我要留
  rationale: ἐπιμένω的将来时主动语态在旅行计划的语境中表示继续留在某地一段时间；“我要留在”自然、清楚地传达这一含义。
- source_word: δὲ
  choice: 但
  rationale: δέ在此承接上文并带有轻微转折；“但”能简洁体现保罗当前安排与前述行程计划之间的对照。
- source_word: ἐν Ἐφέσῳ
  choice: 在以弗所
  rationale: ἐν加与格在此表示地点；“以弗所”采用现代中文圣经中通行的地名译法。
- source_word: ἕως τῆς πεντηκοστῆς
  choice: 直到五旬节
  rationale: ἕως加属格表示时间延续至某一点；“五旬节”是πεντηκοστή在新约语境中的通行名称，同时保留其犹太节期背景。
