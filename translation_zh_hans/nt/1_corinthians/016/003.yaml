  yaml_path: translation/nt/1_corinthians/016/003.yaml
  text: And when I arrive[b][a], I will send with letters those whom you approve to carry your gift to Jerusalem.
translation:
  language: zh_hans
  text: 等我到了，你们写信认可的人，我就派他们把你们的捐赠[a]送到耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你们慷慨的馈赠”。原文所用的词也可表示“恩典”或“恩惠”，这里指送往耶路撒冷的捐赠。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ παραγένωμαι
  choice: 我到了以后
  rationale: ὅταν加不定过去时虚拟语气指将来发生之时；“到了以后”符合现代汉语，也不把将来的到访说成带有不确定意味。δέ在此承接上文，汉语无需生硬译出。
- source_word: οὓς ἐὰν δοκιμάσητε
  choice: 你们认可的人
  rationale: δοκιμάζω可指经过考察而认定合格；在选派代表的语境中，“认可”简洁自然，同时保留由哥林多人审定人选的意思。
- source_word: δι’ ἐπιστολῶν
  choice: 带着书信
  rationale: διά加属格在此表示伴随的凭据或方式。译作“带着书信”清楚表明书信随获认可的人一同带去，而不擅自限定为“推荐信”。
- source_word: τούτους πέμψω
  choice: 就会让……人……送到
  rationale: τούτους回指前面的获认可者，πέμπω表示差派。汉语用兼语结构“让……人……送”比逐字译作“我会差派这些人”更顺畅，并保留保罗负责派遣之意。
- source_word: ἀπενεγκεῖν
  choice: 送到
  rationale: 不定式表示派遣的目的，即把款项运送至目的地；“送到”自然表达从哥林多送往耶路撒冷。
- source_word: τὴν χάριν ὑμῶν
  choice: 你们的馈赠
  rationale: χάρις在本段募捐语境中指所捐赠的款项，同时带有恩惠、慷慨施予的意味。“馈赠”比“恩典”更具体，又比单纯的“捐款”较能保留该词的恩惠色彩。
- source_word: εἰς Ἰερουσαλήμ
  choice: 到耶路撒冷
  rationale: εἰς在城市名称前表示移动的目的地，现代汉语自然译作“到耶路撒冷”。
theological_decisions:
- issue: 募捐语境中χάρις的含义
  choice: 具体的馈赠，即为耶路撒冷信徒募集的款项
  alternative: 恩典；恩惠之举；慷慨的馈赠
  rationale: 本章上下文明确谈到为圣徒收集款项，因此这里首先指实际馈赠；但脚注保留χάρις所含“恩惠、慷慨施予”的词义余韵，避免把它仅仅处理成中性的财务术语。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我到了以后”承接上一节的行程安排；“带着书信”紧贴获认可的代表，避免误解为保罗借书信进行远程差派。主文保留一处必要脚注，以说明χάρις在具体馈赠与恩惠色彩之间的语义张力。
