  text: κατὰ μίαν ⸀σαββάτου ἕκαστος ὑμῶν παρ’ ἑαυτῷ τιθέτω θησαυρίζων ὅ τι ⸀ἐὰν εὐοδῶται, ἵνα μὴ ὅταν ἔλθω τότε λογεῖαι γίνωνται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/002.yaml
  text: On the first day of every week[a], each of you is to set something aside, storing up whatever he may prosper in[c][b], so that collections will not be made when I come.
translation:
  language: zh_hans
  text: 每周的第一日[a]，你们各人都要各自留存一些钱[b]，照着自己所蒙的顺利积存起来[c]，免得我来的时候才进行募捐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“每逢一周的第一日”。原文在这里表示每周反复实行的做法。
    reason: lexical_alternative
  - marker: b
    text: 直译“在自己身边”或“在自己那里”；可能指各人自行把钱留存，也可能特指存放在家中。
    reason: lexical_alternative
  - marker: c
    text: 也可译“照自己所得的顺利”或“按自己兴旺的程度”。意思是各人照实际所得或所蒙的兴旺，积存相称的数额。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ μίαν σαββάτου
  choice: 每周第一日
  rationale: κατά加宾格在此具有分配、反复的意味，所吩咐的是每周定期实行的做法；“每周第一日”在现代汉语中简洁自然，同时保留“第一日”的原文表达。
- source_word: ἕκαστος ὑμῶν
  choice: 你们各人
  rationale: 准确表达分配意义，说明这项吩咐分别适用于群体中的每一个人。
- source_word: παρ’ ἑαυτῷ
  choice: 在自己那里
  rationale: 较直接地保留“在自己身边／自己那里”的空间或个人性含义，不武断判定一定是在家中，也不把它完全融入“留出”而使原短语消失。
- source_word: τιθέτω
  choice: 都要……留出一些
  rationale: 现在时第三人称命令式表示持续实行的吩咐；“都要”传达命令语气，“留出一些”符合筹备款项的汉语习惯。
- source_word: θησαυρίζων
  choice: 积存起来
  rationale: 保留该分词所表达的持续储存、逐步累积之意，并自然说明“留出”的款项如何处理。
- source_word: ὅ τι ἐὰν εὐοδῶται
  choice: 按所得的进益
  rationale: 该不定条件表达各人所积存的数额应与其所得的顺利或进益相称。“进益”既不局限为工资，也避免把原文被动／中间语态过度解释成某一种收入来源。
- source_word: ἵνα μὴ ὅταν ἔλθω τότε
  choice: 免得我来的时候才
  rationale: 自然表达目的从句及时间从句，保留 τότε 所强调的“到那时才”。
- source_word: λογεῖαι γίνωνται
  choice: 进行募捐
  rationale: λογεῖαι 在本段指为捐助而募集款项；“进行募捐”自然表达 γίνωνται 所指的募捐行动发生。
theological_decisions:
- issue: παρ’ ἑαυτῷ所指的存放地点
  choice: 正文译作“在自己那里”，不明确限定为家中或会众聚会处
  alternative: “各自在家里”或“各自留存”
  rationale: 原文可指个人自行保存，可能是在家中，但并未明确说明具体地点；译文保留这种开放性，避免据此建立特定的奉献程序。
- issue: εὐοδῶται与奉献数额的关系
  choice: 译作“按所得的进益”，表达数额与实际所得相称
  alternative: “照他怎样蒙福”或“按他的收入”
  rationale: 原词含顺利、兴旺之意，语境中涉及可积存的款项；所选译法既体现相称关系，也不把它限定为神学化的“蒙福”措辞或单一的工资收入。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“募捐”明确本节所说的是款项募集；“进益”比“进项”更通行于现代标准汉语，又比单说“收入”更能保留 εὐοδῶται 所含的顺利、兴旺意味。脚注依次处理每周反复性、个人存放地点及按所得积存这三处需要保留的语义空间。
