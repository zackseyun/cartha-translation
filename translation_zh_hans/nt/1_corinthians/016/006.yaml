base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/006.yaml
  text: and perhaps I will stay with you[a], or even spend the winter, so that you may send me on my way wherever I may go.
translation:
  language: zh_hans
  text: 至于我，或许会在你们那里停留，或者甚至在那里过冬，好让你们送我上路[a]，无论我往哪里去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “送我上路”也可译作“帮助我继续旅程”。这个希腊语动词可包括陪送启程，或为旅客提供旅途所需的帮助。
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ὑμᾶς
  choice: 在你们那里
  rationale: 与表示停留的动词连用时，πρός加宾格表示与这些人在一起或在他们所在地；“在你们那里”自然地表达保罗留在哥林多信徒当中的意思。
- source_word: δὲ
  choice: 也
  rationale: 此处是温和的承接，继续说明行程安排，并非强烈转折；“也许”中的“也”使上下文衔接自然。
- source_word: τυχὸν
  choice: 也许
  rationale: 该词在此作副词，表示可能性和未定性；“也许”简洁而符合现代汉语。
- source_word: παραμενῶ
  choice: 住一段时间
  rationale: παραμένω意为继续停留；结合后文“过冬”，译作“住一段时间”既自然，也清楚呈现短期停留与较长期过冬之间的递进。
- source_word: ἢ καὶ
  choice: 甚至
  rationale: 这一组合加强后一种可能，表示不只短暂停留，也可能整个冬季都住在那里；“甚至”准确体现递进。
- source_word: παραχειμάσω
  choice: 在那里过冬
  rationale: 该动词特指在某地度过冬季；补出“在那里”符合汉语表达，并明确承接“在你们那里”。
- source_word: ἵνα
  choice: 好让
  rationale: ἵνα引出目的；“好让”自然保留目的关系。
- source_word: προπέμψητε
  choice: 为我送行
  rationale: προπέμπω在旅行语境中可指送行、陪送或为下一程提供帮助；正文采用范围较宽且自然的“为我送行”，脚注说明可能包含的实际协助。
- source_word: οὗ ἐὰν πορεύωμαι
  choice: 无论我要往哪里去
  rationale: 关系副词与ἐάν及虚拟语气共同表达目的地未定；此译保留不确定性和将来指向。
