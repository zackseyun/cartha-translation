  text: Ἀσπάζονται ὑμᾶς αἱ ἐκκλησίαι τῆς Ἀσίας. ⸀ἀσπάζεται ὑμᾶς ἐν κυρίῳ πολλὰ Ἀκύλας καὶ ⸀Πρίσκα σὺν τῇ κατ’ οἶκον αὐτῶν ἐκκλησίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/019.yaml
  text: The churches of Asia greet you[a]. Aquila and Prisca, together with the church in their house[b], greet you warmly in the Lord.
translation:
  language: zh_hans
  text: 亚细亚的各教会都问候你们[a]。亚居拉和百基拉[b]，以及在他们家里的教会，都在主里热切地问候你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“亚细亚”指罗马帝国在小亚细亚西部的亚细亚行省，不是现代所说的亚洲。
    reason: cultural_note
  - marker: b
    text: 原文作“普里斯卡”（Πρίσκα），即通常译作“百基拉”之名的较短形式；她在其他经文中也以较长的名字形式出现（如徒18:2、18、26；罗16:3）。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζονται / ἀσπάζεται
  choice: 问候
  rationale: ἀσπάζομαι在书信问安语境中指问候或致意；“问候”自然、庄重，并保留两处动词的一致性。
- source_word: αἱ ἐκκλησίαι
  choice: 各教会
  rationale: 复数形式指亚细亚境内多个基督徒群体；“各教会”比生硬的“众教会”更符合现代汉语。
- source_word: τῆς Ἀσίας
  choice: 亚细亚的
  rationale: 此处Ἀσία是罗马帝国在小亚细亚西部的行省。正文沿用圣经地名“亚细亚”，以脚注区别于现代所说的亚洲。
- source_word: ἐν κυρίῳ
  choice: 在主里
  rationale: 保留保罗常用表达的神学与群体关系内涵，不将其释义为较窄的“作为主内信徒”。
- source_word: πολλὰ
  choice: 热切地
  rationale: πολλὰ作副词性宾格，加强问候的程度。“热切地”在现代汉语中自然地表达殷切、深厚的问候，又不误解为“多次”。
- source_word: Ἀκύλας καὶ Πρίσκα
  choice: 亚居拉和百基拉
  rationale: 采用现代中文圣经读者较熟悉的人名译法。Πρίσκα是该名字的较短形式；其与“百基拉/百基拉之昵称形式”的关系在脚注说明。
- source_word: σὺν τῇ κατ’ οἶκον αὐτῶν ἐκκλησίᾳ
  choice: 以及在他们家里的教会
  rationale: 贴近原文结构，表达以他们家为聚集处的教会，同时不在正文中明加原文没有的“聚会”一词。
theological_decisions:
- issue: 家庭场景中ἐκκλησία的含义
  choice: “在他们家里的教会”指以亚居拉和百基拉的家为聚集处的当地基督徒群体
  alternative: 把它理解为他们的家庭本身，或作为制度性名称的“家庭教会”
  rationale: κατ’ οἶκον与ἐκκλησία的组合最自然地指在私人住宅中聚集的信徒群体，而不只是家庭成员；正文保留原文简洁表达，避免附加现代制度色彩。
- issue: κύριος的译法
  choice: 主
  alternative: 主人
  rationale: “主”保留保罗用语中的信仰告白和关系内涵；“主人”在此会把含义不当地世俗化、狭窄化。
translation_notes:
  register: 采用现代、庄重且易懂的书信问安语体。“各教会”“问候”符合当代普通话；保留“在主里”这一具有保罗特色的表达。脚注标记均置于正文相关处。
