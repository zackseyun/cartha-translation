id: 1CO.16.4
reference: 1 Corinthians 16:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐὰν δὲ ⸂ἄξιον ᾖ⸃ τοῦ κἀμὲ πορεύεσθαι, σὺν ἐμοὶ πορεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/004.yaml
  text: And if it is worthwhile for me to go also, they will go with me.
translation:
  language: zh_hans
  text: 如果我也去是合宜的[a]，他们就会和我一同去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如果我也去是值得的。”希腊语可表示在当时情形下是合宜的、适当的或值得的。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: 如果
  rationale: ἐάν引出条件，δέ在此是轻微的承接词；汉语无需另译“而/但”，即可自然承接上文。
- source_word: ἄξιον ᾖ
  choice: 是合宜的
  rationale: 中性形容词ἄξιον与ᾖ构成无人称表达，表示在当时情形下适当、合宜，而非评价保罗个人是否配得。
- source_word: τοῦ κἀμὲ πορεύεσθαι
  choice: 我也去
  rationale: 带冠词的不定式说明何事被视为合宜；κἀμέ保留“我也”的附加意味。
- source_word: σὺν ἐμοὶ
  choice: 和我一同
  rationale: 忠实表达同行之意，并以自然现代汉语呈现。
- source_word: πορεύσονται
  choice: 他们就会……去
  rationale: 未来时表示他们届时将前往；保留与前一分句“去”的动词呼应，不增添“护送”等原文没有的含义。
theological_decisions:
- issue: 保罗关于自己是否随代表团前往的条件陈述
  choice: 是否合宜的是保罗也前往这件事；若合宜，代表们便与他同行。
  alternative: 礼物是否贵重到值得保罗亲自前往；或保罗本人是否配得前往。
  rationale: ἄξιον是无人称用法，后接不定式说明被衡量的行动；上下文讨论的是捐款送交安排。不过“合宜”仍保留按实际情况作判断的弹性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“合宜”简洁表达实际情形中的适当性；“和我一同去”清楚保留同行关系。
