  text: ἀσπάζονται ὑμᾶς οἱ ἀδελφοὶ πάντες. ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/020.yaml
  text: All the brothers greet you[b][a]. Greet one another with a holy kiss.
translation:
  language: zh_hans
  text: 众弟兄[a]都向你们问安。你们要以圣洁的吻[b]彼此问安。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”也可指“弟兄姊妹”，即全体信徒。
    reason: lexical_alternative
  - marker: b
    text: “圣洁的吻”是当时信徒之间惯常的问安方式，表达圣洁与彼此相交。
    reason: cultural_note
lexical_decisions:
- source_word: ἀσπάζονται / ἀσπάσασθε
  choice: 问安
  rationale: 该动词在书信语境中表示致意、问候；两处均译作“问安”，既自然简洁，也保留原文的词语呼应。
- source_word: οἱ ἀδελφοὶ πάντες
  choice: 众弟兄
  rationale: ἀδελφοί在形式上是阳性复数，直译为“弟兄”；“众”与πάντες相应。此词在信徒群体中也可能统指男女信徒，因此在脚注中保留这一含义。
- source_word: ἀλλήλους
  choice: 彼此
  rationale: 准确表达相互性的动作，符合现代汉语书面表达。
- source_word: ἐν φιλήματι ἁγίῳ
  choice: 以圣洁的亲吻
  rationale: ἐν在此表示方式或媒介；“圣洁的亲吻”保留实际亲吻这一问安举动及其分别为圣的性质，未将其泛化为普通礼节。
theological_decisions:
- issue: 会众语境中ἀδελφοί的性别涵盖范围
  choice: 正文译作“弟兄”
  alternative: “弟兄姊妹”或“全体信徒”
  rationale: 正文保留希腊语阳性复数的形式，不直接扩写；同时，鉴于该词可集体指男女信徒，以脚注说明其可能的包容性含义。
- issue: “圣洁的亲吻”是固定仪式还是带有圣洁性质的群体问安
  choice: 保留“圣洁的亲吻”的具体表达，并以文化脚注说明
  alternative: 意译为“以圣洁的方式彼此亲切问候”
  rationale: 原文明确使用“亲吻”，不宜在正文中抽象化；但其文化功能可在脚注中说明，而不判定其是否构成跨文化中形式不变的仪式规定。
translation_notes:
  register: 采用现代、庄重而易懂的书信语体。“向你们问安”与“彼此问安”自然区分单向致意和相互问候，同时保留原文同一动词的呼应。脚注标记分别紧随所解释的词语。
