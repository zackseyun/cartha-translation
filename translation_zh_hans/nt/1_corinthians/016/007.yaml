  text: οὐ θέλω γὰρ ὑμᾶς ἄρτι ἐν παρόδῳ ἰδεῖν, ἐλπίζω ⸀γὰρ χρόνον τινὰ ἐπιμεῖναι πρὸς ὑμᾶς, ἐὰν ὁ κύριος ⸀ἐπιτρέψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/007.yaml
  text: For I do not want to see you now in passing[a], for I hope to remain with you for some time, if the Lord permits.
translation:
  language: zh_hans
  text: 因为我不愿现在在路过时见你们[a]；我盼望能在你们那里住一段时间，如果主准许。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“顺路去看你们”或“在途中见你们”。
    reason: ἐν παρόδῳ可指路过、顺路或旅途中短暂相见；这些译法共同突出这不是一次较长的停留。
lexical_decisions:
- source_word: οὐ θέλω
  choice: 我不愿
  rationale: 这里表达保罗个人的愿望和打算；“不愿”自然、庄重，又不过分强化为坚决拒绝。
- source_word: ἄρτι
  choice: 现在
  rationale: 准确表达当前时刻或目前情形。
- source_word: ἐν παρόδῳ
  choice: 在路过时
  rationale: 表达途中短暂停留的意思，同时保留原文可指“顺路”或“在途中”的空间意象。
- source_word: ἰδεῖν
  choice: 见
  rationale: 保留“看见、见到”的基本意义；上下文自然使读者理解为探访。
- source_word: ἐλπίζω
  choice: 我盼望
  rationale: 既表达期待和愿望，也不将其说成确定计划。
- source_word: χρόνον τινά
  choice: 一段时间
  rationale: 表达未明确限定、但并非匆匆一见的时日。
- source_word: ἐπιμεῖναι
  choice: 住
  rationale: 在探访语境中，“住一段时间”比“停留”更自然地表达继续与对方同在。
- source_word: πρὸς ὑμᾶς
  choice: 和你们
  rationale: 与表示居留的动词连用时，表达在对方那里、与对方相处；“和你们住”符合现代汉语习惯。
- source_word: ἐὰν ὁ κύριος ἐπιτρέψῃ
  choice: 如果主准许的话
  rationale: 忠实保留条件语气，并表达保罗的计划取决于主的许可。
- source_word: κύριος
  choice: 主
  rationale: 沿用新约中对 κύριος 的通常译法，不额外限定所指。
theological_decisions:
- issue: “主”的具体所指
  choice: 仅译为“主”
  alternative: “主耶稣”或“上帝”
  rationale: 希腊文没有进一步说明所指；译文保留这一开放性，不在正文中作超出原文的限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“只在路过时见你们”与后文“住一段时间”形成清楚对比；破折号使末尾条件语自然，同时不削弱其限定作用。
