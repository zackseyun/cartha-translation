  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们的一切，都要在爱中进行。”
    reason: 原文πάντα ὑμῶν较直译为“你们的一切”，可指属于你们、在你们中间发生或由你们所做的一切；正文按劝勉语境译作“你们所做的一切”。
lexical_decisions:
- source_word: πάντα
  choice: 一切
  rationale: 中性复数在此作概括性用法，涵盖所有事；“一切”自然、庄重，并保留原文的普遍范围。
- source_word: ὑμῶν
  choice: 你们所做的
  rationale: 原文直译近于“你们的一切”，属省略表达；结合劝勉语境，译为“你们所做的一切”可自然表达由哥林多人而出的全部行为，同时不明显缩窄其范围。
- source_word: ἐν ἀγάπῃ
  choice: 在爱中
  rationale: ἐν可表示方式或领域；“在爱中”贴近原文，并保留二者之间未被限定的张力。
- source_word: γινέσθω
  choice: 都要……成就
  rationale: γίνομαι的第三人称单数现在时中/被动命令式，在此表达持续性的劝勉。“成就”兼顾“发生、成为、做成”的语义，并与中文句式自然衔接。
