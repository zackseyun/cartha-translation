  yaml_path: translation/nt/1_corinthians/016/024.yaml
  text: My love be with all of you in Messiah Jesus[a].
translation:
  language: zh_hans
  text: 愿我的爱在弥赛亚耶稣里[a]与你们众人同在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“基督耶稣”。希腊语Χριστός是称号，意为“受膏者”，传统上常译作“基督”，也可译作“弥赛亚”。
    reason: 说明称号的另一常用译法，并保留原词的称号含义。
lexical_decisions:
- source_word: ἡ ἀγάπη μου
  choice: 我的爱
  rationale: 直译保罗对收信人的个人之爱；“爱”在现代汉语中自然清楚，也保留ἀγάπη在此处亲爱、舍己之爱的宽广含义。
- source_word: μετὰ πάντων ὑμῶν
  choice: 与你们众人同在
  rationale: μετά与属格连用表示“与……同在”；“你们众人”明确保留πάντων的全体范围。
- source_word: ἐν
  choice: 在……里
  rationale: 保留保罗常用的领域或联合表达，不改释为“借着”等较具体的关系。
- source_word: Χριστῷ Ἰησοῦ
  choice: 弥赛亚耶稣
  rationale: Χριστός在这里仍具有“弥赛亚”这一称号的意义；按希腊语次序置于“耶稣”之前，同时以脚注提供华语基督徒熟悉的传统译法。
theological_decisions:
- issue: 无动词结语应表达为祝愿还是陈述
  choice: 愿……同在
  alternative: 我的爱……与你们众人同在
  rationale: 希腊文没有明说动词；上下文是书信结语，译作祝愿最合语用。“愿”属于汉语为表达该结语语气所需的补足，不把原文硬判为带明确时态的陈述。
- issue: ἐν Χριστῷ Ἰησοῦ的修饰范围
  choice: 在弥赛亚耶稣里与你们众人同在
  alternative: 我在弥赛亚耶稣里对你们众人的爱，与你们同在
  rationale: 把介词短语置于“同在”结构中，尽量保留它既可描述爱的属灵领域、也可描述彼此在弥赛亚里同在的张力；不将其单独锁定为修饰“爱”。
- issue: Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: “弥赛亚”较直接显出其称号性质；“基督”是传统且自然的华语教会用语，故列于脚注，不把两者处理为不同人物或不同教义。
translation_notes:
  register: 采用现代、庄重而简明的书信祝福语体。“你们众人”比口语化的“你们大家”更适合经文语域，同时清楚表达全体收信人。
