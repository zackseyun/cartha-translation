  text: θύρα γάρ μοι ἀνέῳγεν μεγάλη καὶ ἐνεργής, καὶ ἀντικείμενοι πολλοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/009.yaml
  text: For a great and effective door has opened to me[a], and there are many opponents.
translation:
  language: zh_hans
  text: 因为有一扇又大又有成效的门为我敞开了[a]，而反对的人很多。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为一个重大而有成效的机会向我敞开了。”保罗以“门”比喻开展服事的机会。
    reason: 词义替代译法，并说明原文比喻。
lexical_decisions:
- source_word: θύρα
  choice: 门
  rationale: 保留原文“门”的比喻，不直接将其解释为“机会”；上下文可使读者领会这是开展服事的门路。
- source_word: γάρ
  choice: 因为
  rationale: 说明保罗此前所述行程安排的原因；“因为”在现代汉语中衔接清楚自然。
- source_word: μοι
  choice: 为我
  rationale: 表达与保罗个人有关或对他有利的关系；与“门……敞开”搭配自然。
- source_word: ἀνέῳγεν
  choice: 敞开了
  rationale: 表达先前开启所形成的当前开放状态，同时不额外指明开门者。
- source_word: μεγάλη
  choice: 大
  rationale: 既保留门的形象，也可表达这一开端在规模或意义上的重大，避免把它窄化为空间意义的“宽”。
- source_word: ἐνεργής
  choice: 有成效
  rationale: 在语境中表示这扇门能产生实际成果；“有成效”比“活跃”或“有能力”更符合现代汉语表达。
- source_word: ἀντικείμενοι
  choice: 反对的人
  rationale: 该分词作名词使用，指抵挡保罗及其工作的人；此译法自然，并不夸大其敌意程度。
- source_word: πολλοί
  choice: 很多
  rationale: 直接、自然地表达人数众多。
theological_decisions:
- issue: “门”作为服事机会的比喻
  choice: 正文保留“门”的比喻
  alternative: 把它解释性地译作“一个大有成效的机会”
  rationale: 原文采用保罗常用的“门”之意象。保留该意象可避免把比喻直接化约为解释，同时由脚注说明其语境含义。
- issue: 开放的门与众多反对者之间的关系
  choice: 用“而”连接两个事实
  alternative: 用“但是”明确译成转折
  rationale: 原文以καί连接，既并列开放的门与众多反对者，也在语境中形成张力；“而”能自然呈现这种张力，又不把连接词过度明确为强转折。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“又大又有成效的门”略带比喻性的张力，旨在忠实保留原文意象；“反对的人”比“敌人”更准确地对应主动抵挡者，而不额外强化敌对色彩。
