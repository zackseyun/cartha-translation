  text: The grace of the Lord Jesus be with you.
translation:
  language: zh_hans
  text: 愿主耶稣的恩典与你们同在。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: 恩典
  rationale: 这是保罗书信祝福语中的惯用词，指主所赐白白的恩惠与福分；“恩典”既保留其神学分量，也符合现代中文基督教语境。
- source_word: κύριος
  choice: 主
  rationale: “主”准确体现该称号在新约中的通常用法及其基督论分量，也比“主人”更适合祝福语。
- source_word: Ἰησοῦ
  choice: 耶稣
  rationale: 按现代标准中文通行形式音译该人名。
- source_word: μεθ’ ὑμῶν
  choice: 与你们同在
  rationale: 原文直译为“与你们同在”，其中ὑμῶν是复数；中文祝福语需借“愿”自然表达原文省略动词的祈愿语气。
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: 主耶稣的
  rationale: 保留属格名词短语的结构，使其可理解为属于或源自主耶稣的恩典，不必在正文中将其关系限定为单一类别。
theological_decisions:
- issue: 原文祝福语省略了显式动词
  choice: 以“愿……同在”表达祈愿语气
  alternative: 主耶稣的恩典与你们同在。
  rationale: 希腊文是无动词的祝福公式；添加“愿”不是增添新的神学内容，而是以自然、庄重的现代中文明确其祝愿功能。
- issue: 属格τοῦ κυρίου Ἰησοῦ的语义关系
  choice: 译作“主耶稣的恩典”
  alternative: 从主耶稣而来的恩典
  rationale: “的”保留原文属格可能兼具归属与来源的张力，避免将其无必要地限定为仅指来源。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“你们”准确保留第二人称复数；句式符合书信结尾的祝福语体。
