  text: Γρηγορεῖτε, στήκετε ἐν τῇ πίστει, ἀνδρίζεσθε, κραταιοῦσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/013.yaml
  text: Stay alert[a], stand firm in the faith, act courageously[b], be strong.
translation:
  language: zh_hans
  text: 你们要警醒，在信仰上站立得稳；要勇敢[a]，要刚强[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文动词字面带有“像男子一样行事”的意象，在这里是“勇敢、刚毅”的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译：“要得着刚强。”原文动词为被动形式。
    reason: lexical_alternative
lexical_decisions:
- source_word: Γρηγορεῖτε
  choice: 要警醒
  rationale: 现在时主动命令语气复数，要求持续保持警觉；“警醒”在现代汉语圣经语体中自然、庄重，也保留了守望和不松懈的含义。
- source_word: στήκετε
  choice: 站立得稳
  rationale: στήκω在此是比喻用法，强调坚定不移，而非单指身体站立；“站立得稳”兼顾原文意象和自然表达。
- source_word: ἐν τῇ πίστει
  choice: 在信仰上
  rationale: 介词短语带冠词，较自然地指基督徒所持守的信仰领域或内容；译作“在信仰上”保留这一理解，同时不把含义限定为某套后来的教义体系。
- source_word: ἀνδρίζεσθε
  choice: 要勇敢
  rationale: 该动词源于ἀνήρ（男人），字面意象是“像男子一样行事”，但在希腊语习用意义中是勇敢、刚毅。现代汉语若直译为“像男人一样”容易被误解为排斥女性或强调性别表现，因此正文采用其语境意义，并以脚注保留原文的男性意象。
- source_word: κραταιοῦσθε
  choice: 要刚强
  rationale: 现在时被动命令语气可有“要得着刚强”的形式含义；“要刚强”在汉语中简洁自然，符合连续命令句的节奏，脚注则保留被动语态的可能表达。
theological_decisions:
- issue: πίστις在带冠词短语中的含义
  choice: 在信仰上
  alternative: 在信心中
  rationale: 定冠词及语境支持把它理解为所持守的信仰或信仰立场，而不仅是当下主观信靠的行为；“信仰”较能表达这一点，但不进一步规定其教义范围。
- issue: ἀνδρίζεσθε的性别意象与习用意义
  choice: 要勇敢
  alternative: 要像男子一样行事
  rationale: 原文确有男性词源和意象，但命令的实际语用重点是勇气。正文传达对全体收信人的劝勉，脚注说明字面形式，从而既不抹去原文特色，也避免现代汉语直译造成错误限定。
- issue: κραταιοῦσθε的被动语态
  choice: 要刚强
  alternative: 要得着刚强
  rationale: 被动形式可能暗示力量是领受的，也可能具有不及物或中间意义的习惯用法。正文不明确补出施力者，以免过度解释；脚注保留较显性的被动译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，以四个简短劝勉再现原文的紧凑节奏。正文使用“你们”显明复数对象；以分号划分前后两组命令。所有脚注标记均已置于正文相应词语之后。
