  text: Περὶ δὲ τῆς λογείας τῆς εἰς τοὺς ἁγίους, ὥσπερ διέταξα ταῖς ἐκκλησίαις τῆς Γαλατίας, οὕτως καὶ ὑμεῖς ποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/001.yaml
  text: Concerning the collection for the saints[a], as I directed the churches of Galatia, so you also are to do.
translation:
  language: zh_hans
  text: 关于为圣徒募集的捐款[a]，我怎样吩咐加拉太各教会，你们也要怎样做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“关于为上帝子民募集的捐款。”
    reason: 提供“圣徒”的意义型替代译法，帮助现代读者避免将其误解为后来经册封的少数圣人。
lexical_decisions:
- source_word: Περὶ δὲ
  choice: 至于……的事
  rationale: 保留保罗书信中转入新话题的功能；不添加原文没有的时间副词“现在”。
- source_word: λογείας
  choice: 募集捐款
  rationale: 此词指为特定用途收集钱款；“募集捐款”在现代汉语中自然，也避免将其过度限定为礼仪性的“奉献”。
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: 为圣徒
  rationale: 表示募集钱款的受益对象；“圣徒”保留保罗对信徒群体的一贯称呼。
- source_word: διέταξα
  choice: 吩咐
  rationale: 传达使徒作出明确指示的权威语气，同时避免“命令”在现代汉语中可能显得过于严厉。
- source_word: ἐκκλησίαις
  choice: 各教会
  rationale: 此处指加拉太地区多个基督徒会众；“各教会”准确表达复数。
- source_word: Γαλατίας
  choice: 加拉太
  rationale: 采用该地理名称在中文圣经传统中的通行译名。
- source_word: οὕτως καὶ ὑμεῖς ποιήσατε
  choice: 你们也要照……去做
  rationale: 保留比较关系和不定过去时命令式的指令语气，并使中文句式自然清楚。
theological_decisions:
- issue: 在赈济捐款语境中如何翻译 ἅγιοι
  choice: 圣徒
  alternative: 上帝的子民；圣洁的人
  rationale: 保罗常以 ἅγιοι 称呼信徒。“圣徒”保留其关键词的一致性和群体身份含义，也不表示后世意义上经特别册封的人。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“至于……的事”自然标示话题转换；整体语序适度调整，使“照我吩咐加拉太各教会的”修饰“去做”，同时保留原文的权威语气和比较结构。
