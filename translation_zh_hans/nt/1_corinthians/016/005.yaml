  text: Ἐλεύσομαι δὲ πρὸς ὑμᾶς ὅταν Μακεδονίαν διέλθω, Μακεδονίαν γὰρ διέρχομαι,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/005.yaml
  text: But I will come to you when I have gone through Macedonia[a], for I am going through Macedonia.
translation:
  language: zh_hans
  text: 不过，等我经过马其顿以后[a]，我会到你们那里去；因为我要经过马其顿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当我经过马其顿时”。这里的希腊语不定过去时虚拟语气把经过马其顿看作一个整体事件；按本句行程的语境，这事在保罗到访哥林多之前完成。
    reason: 提供 ὅταν Μακεδονίαν διέλθω 的自然译法，并说明其在本句语境中的时序与体貌含义，避免将“经过”误解为“走遍”。
lexical_decisions:
- source_word: Ἐλεύσομαι
  choice: 我……就会到
  rationale: 未来时表达保罗前往哥林多信徒那里的计划；结合 πρὸς ὑμᾶς，用“到你们那里去”符合现代汉语的方位表达。
- source_word: δὲ
  choice: 不过
  rationale: 表示从上文安排转入另一项行程说明，带有轻微转折，语气不宜过强。
- source_word: πρὸς ὑμᾶς
  choice: 到你们那里去
  rationale: πρός 加宾格与移动动词连用，表示朝向某些人；如此翻译自然清楚。
- source_word: ὅταν
  choice: ……以后
  rationale: 与不定过去时虚拟语气 διέλθω 连用，指将来的时序情形；“以后”在汉语中自然表达先经过马其顿、随后探访哥林多的关系。
- source_word: Μακεδονίαν
  choice: 马其顿
  rationale: 采用该罗马行省名称通行的中文译名。
- source_word: διέλθω
  choice: 走遍
  rationale: 不定过去时虚拟语气在此将经过马其顿视为先于主要动作而完成的整体；“走遍”也保留 διά 所含穿行其间的意味，但可能被理解为走访全境，故加注说明另一译法。
- source_word: γὰρ
  choice: 因为
  rationale: 引出保罗如此安排探访时间的理由，现代汉语用“因为”关系明确。
- source_word: διέρχομαι
  choice: 正要经过
  rationale: 现在时在行程计划语境中可表示已确定或即将展开的路线；“正要”避免误示保罗写信时已经身在马其顿，同时保留计划的现实迫近感。
