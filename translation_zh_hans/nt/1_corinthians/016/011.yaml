source:
  edition: SBLGNT
  text: μή τις οὖν αὐτὸν ἐξουθενήσῃ. προπέμψατε δὲ αὐτὸν ἐν εἰρήνῃ, ἵνα ἔλθῃ πρός ⸀με, ἐκδέχομαι γὰρ αὐτὸν μετὰ τῶν ἀδελφῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/011.yaml
  text: So then[a], let no one despise him. But send him on his way in peace, so that he may come to me, for I am expecting him with the brothers.
translation:
  language: zh_hans
  text: 所以，谁也不要轻视他。你们要平安地送他上路，使他来到我这里；因为我正在等候他同众弟兄前来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他同众弟兄前来”也可理解为保罗“同众弟兄一起等候他”。“弟兄”可能泛指包括姊妹在内的信徒或同工群体。
    reason: 保留μετὰ τῶν ἀδελφῶν可能的句法归属，以及ἀδελφῶν所指群体范围的不确定性。
lexical_decisions:
- source_word: μή τις οὖν
  choice: 所以，谁也不要
  rationale: μή与不定过去时虚拟语气构成禁令；“所以”自然保留οὖν承接上文的推论关系。
- source_word: ἐξουθενήσῃ
  choice: 轻视
  rationale: 该词指把人看作无足轻重、加以鄙视；“轻视”在现代汉语中简洁自然，也符合保罗担心提摩太遭人小看的语境。
- source_word: προπέμψατε
  choice: 让他……上路
  rationale: 该动词在旅行语境中常指为人送行并协助其继续行程；此译法比单纯“差遣”更能表达支持其上路的含义。
- source_word: ἐν εἰρήνῃ
  choice: 平安地
  rationale: 表达他离开时应当没有纷争或阻碍，并得到友善接待和支持；译法自然且保留“平安”的核心意象。
- source_word: ἵνα ἔλθῃ πρός με
  choice: 好使他到我这里来
  rationale: ἵνα加虚拟语气表达目的；“好使”明确保留目的关系。
- source_word: ἐκδέχομαι
  choice: 我正……等候
  rationale: 现在时表达持续等候；“正……等候”在现代汉语中自然，并传达期待之意。
- source_word: μετὰ τῶν ἀδελφῶν
  choice: 同众弟兄一起
  rationale: 介词短语最自然地修饰“等候”，即保罗与众弟兄一同等候提摩太。ἀδελφῶν为阳性复数，正文保留“弟兄”，其可能包含更广泛信徒或同工的用法在脚注说明。
theological_decisions:
- issue: μετὰ τῶν ἀδελφῶν的句法归属
  choice: 理解为保罗同众弟兄一起等候提摩太
  alternative: 理解为保罗等候提摩太与同行的弟兄们一起来
  rationale: 希腊语中介词短语紧随αὐτόν，句法上存在一定歧义；但更自然的理解是μετά短语修饰ἐκδέχομαι，表示保罗与弟兄们一同等候。脚注保留另一种可能。
- issue: ἀδελφῶν是否包含女性信徒
  choice: 正文译作“弟兄”
  alternative: 弟兄姊妹；信徒同伴
  rationale: 希腊词为阳性复数，可专指男性弟兄，也可泛指一群信徒或同工。正文不先行消解这种含混，脚注说明其可能具有包容性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“让他平安地上路”兼顾送行、协助继续旅程与无纷争离开的语义；避免古旧的“藐视”“送行”等可能过窄或生硬的表达。
