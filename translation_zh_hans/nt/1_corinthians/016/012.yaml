source:
  edition: SBLGNT
  text: Περὶ δὲ Ἀπολλῶ τοῦ ἀδελφοῦ, πολλὰ παρεκάλεσα αὐτὸν ἵνα ἔλθῃ πρὸς ὑμᾶς μετὰ τῶν ἀδελφῶν· καὶ πάντως οὐκ ἦν θέλημα ἵνα νῦν ἔλθῃ, ἐλεύσεται δὲ ὅταν εὐκαιρήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/012.yaml
  text: Concerning Apollos our brother[a], I strongly urged him to come to you with the brothers; but it was not at all his will to come now[b]. Yet he will come when he has opportunity.
translation:
  language: zh_hans
  text: 至于亚波罗弟兄[a]，我再三劝他同弟兄们一起到你们那里去；但他目前实在不愿意去[b]。等有合适的机会，他就会去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译作“那弟兄”，没有明说“我们的”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文较直译为“他目前实在没有意愿去”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: 至于
  rationale: 自然引出新的话题，保留书信中的转换功能，又不在句首添加原文此处没有的时间副词“现在”。
- source_word: Ἀπολλῶ τοῦ ἀδελφοῦ
  choice: 亚波罗弟兄
  rationale: “亚波罗”采用通行中文译名；τοῦ ἀδελφοῦ直译为“这位弟兄”，中文称“亚波罗弟兄”自然得体，也不必补入原文未明说的“我们的”。
- source_word: πολλὰ παρεκάλεσα
  choice: 我再三劝他
  rationale: πολλά加强παρεκάλεσα的语气，可表示恳切或多次劝说；“再三劝”在现代汉语中自然地传达强烈、反复敦促的意味。
- source_word: ἵνα ἔλθῃ πρὸς ὑμᾶς μετὰ τῶν ἀδελφῶν
  choice: 同弟兄们一起到你们那里去
  rationale: 准确表达劝说的内容、移动方向和同行关系；这里的“弟兄们”指具体同行者，无须扩展为泛指的会众。
- source_word: καὶ πάντως οὐκ ἦν θέλημα ἵνα νῦν ἔλθῃ
  choice: 但他目前实在不愿意去
  rationale: πάντως强化否定，“实在不”传达其力度；将名词θέλημα自然转述为“不愿意”，同时明确最自然的主语是亚波罗。“目前”准确表达νῦν，避免生硬的“现在去”。
- source_word: ἐλεύσεται δὲ ὅταν εὐκαιρήσῃ
  choice: 等有合适的机会，他就会去
  rationale: εὐκαιρέω表示有适当时机或有利机会；“有合适的机会”避免把意思弱化为仅仅出于个人方便。δέ所含的转折承接由“就”在汉语语流中自然体现。
theological_decisions:
- issue: οὐκ ἦν θέλημα的意愿主体
  choice: 理解为亚波罗目前不愿意去
  alternative: 理解为上帝不愿意让他现在去，或作无明确主体的“没有意愿”
  rationale: 上下文最近且最自然的所指是刚刚受保罗劝说的亚波罗；原文没有任何信号表明主体转为上帝，因此不加入原文未表达的神意或神圣禁止。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“亚波罗弟兄”符合中文基督徒称谓习惯，但脚注保留希腊文冠词结构与未明说所有格这一细节；正文把θέλημα转为自然的“不愿意”，脚注呈现较形式对应的表达。
