  text: If anyone does not love the Lord[a], let him be accursed[b]. Marana tha.
translation:
  language: zh_hans
  text: 若有人不爱主，就当受咒诅[a]。马拉纳他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“成为阿那忒玛”；意思是受咒诅。
    reason: lexical_alternative
  - marker: b
    text: 亚兰语。可能意为“我们的主啊，请来！”也可能意为“我们的主已经来了。”
    reason: alternative_reading
lexical_decisions:
- source_word: φιλεῖ
  choice: 爱
  rationale: φιλέω在这里表示对主的个人之爱；“爱”在现代汉语中自然明确，也不把词义过度限定为友谊或情感上的喜爱。
- source_word: κύριον
  choice: 主
  rationale: κύριος在保罗书信的这一语境中指耶稣，并具有称号和基督论分量；“主”既符合新约惯用译法，也保留这一层含义。
- source_word: ἤτω
  choice: 就当
  rationale: εἰμί的现在时命令式在此具有祈使或宣告性质；“就当”能简洁表达这句严肃的裁断语气。
- source_word: ἀνάθεμα
  choice: 受咒诅
  rationale: ἀνάθεμα指处于咒诅之下，甚至有被交付毁灭之意；“受咒诅”是清楚、庄重的现代汉语表达，并避免使用普通读者不熟悉的音译术语。
- source_word: Μαράνα θά
  choice: 马兰纳塔
  rationale: 这是以希腊字母保存的亚兰语表达，其分词和确切含义存在争议；正文采用音译，以保留原文形式及其礼仪性呼喊色彩，主要释义另列脚注。
theological_decisions:
- issue: 亚兰语表达 Μαράνα θά 的含义
  choice: 正文保留音译“马兰纳塔”
  alternative: “我们的主啊，请来！”或“我们的主已经来了。”
  rationale: 该表达如何划分亚兰语词组及其所指时态存在真实争议。音译不预先裁定其含义，并以脚注呈现主要解释。
- issue: ἀνάθεμα 的裁断力度
  choice: 译为“受咒诅”
  alternative: 音译为“阿那忒玛”，或译作“被交付毁灭”
  rationale: “受咒诅”保留神圣裁断的严肃性，同时没有把原词可能涉及的毁灭含义解释得过满。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“若……就当……”保留原句简洁而严厉的条件与裁断结构；末句加感叹号，以体现其呼喊性质。所有脚注标记均已置于正文相应位置。
