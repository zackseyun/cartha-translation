base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/011.yaml
  text: These things happened to them as examples[a], but they were written for our instruction[c][b], on whom the ends of the ages have come.
translation:
  language: zh_hans
  text: 这些事发生在他们身上，作为鉴戒[a]；又被记下来，为要劝诫我们[b]——诸世代的终局已经临到我们[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“作为预表”或“以预表的方式”；保罗把这些事件看作对后来信徒具有教训意义的模式。
    reason: lexical_alternative
  - marker: b
    text: 或译“教导我们”或“警告我们”；希腊词同时含有纠正性的教导与警告之意。
    reason: lexical_alternative
  - marker: c
    text: 或译“世代的终局已经临到”。希腊原文的“终局”和“世代”均为复数；正文尽量保留保罗独特的救赎历史表述。
    reason: alternative_reading
lexical_decisions:
- source_word: τυπικῶς
  choice: 作为鉴戒
  rationale: 这个副词说明那些事件具有模式、范例的作用。“作为鉴戒”既承接上文的警戒语境，也比技术性的“预表性地”更容易为现代读者理解。
- source_word: συνέβαινεν
  choice: 发生
  rationale: 未完成时描写过去发生的事；中文用“发生”自然简洁，复数主语“这些事”已能表达一连串事件。
- source_word: ἐκείνοις
  choice: 在他们身上
  rationale: 指上文旷野中的那一代人，并以自然中文表达事件临到他们。
- source_word: ἐγράφη
  choice: 被记下来
  rationale: 希腊文为单数被动式，但语义上指前述事件被写成经文；中文无需标明数，“被记下来”清楚表达成文记录。
- source_word: πρὸς νουθεσίαν
  choice: 为了劝诫我们
  rationale: νουθεσία兼有教导、纠正和警告的意味。“劝诫”保留其纠正与警戒的力度，又符合现代庄重中文。
- source_word: εἰς οὓς
  choice: 我们正是……临到的人
  rationale: 保留末世现实已经临到这些人的方向性和结果性，没有改写成他们主动抵达终点。
- source_word: τὰ τέλη τῶν αἰώνων
  choice: 诸世代的终点
  rationale: “诸世代”保留αἰώνων的复数，“终点”尽量保留τέλη的复数性与保罗救赎历史表述中的张力。
- source_word: κατήντηκεν
  choice: 已经临到
  rationale: “已经临到”表达完成时所指的既成到达及其当前效力，也自然搭配“终点”与“人”。
theological_decisions:
- issue: τὰ τέλη τῶν αἰώνων的救赎历史与末世含义
  choice: 诸世代的终点已经临到
  alternative: 世代的终局已经来到；诸世代已经成全
  rationale: 正文保留两个名词的复数意涵以及“临到我们”的结构，不把它解释为单一终末，也不直接释义为“成全”，从而保留保罗话语中已经实现而仍具末世张力的表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“鉴戒”和“劝诫”保持经文警告性的语气；破折号使“我们”与后面的关系从句清楚衔接，同时不消解原文的末世张力。
