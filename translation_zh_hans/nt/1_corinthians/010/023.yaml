base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/023.yaml
  text: “All things are permitted,” but not all things are beneficial[a]. “All things are permitted,” but not all things build up.
translation:
  language: zh_hans
  text: “凡事都可行”，但不是凡事都有益处。[a]“凡事都可行”，却不是凡事都造就人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡事都合乎律法。”希腊语可指获准或合乎律法。引号表示这句话很可能是哥林多人所说的口号，保罗随后加以限制；原文没有引号。
    reason: 词义选择及解释性标点
lexical_decisions:
- source_word: Πάντα
  choice: 凡事
  rationale: 中性复数作名词用，范围广泛；“凡事”简洁庄重，也保留两次重复所形成的口号式表达。
- source_word: ἔξεστιν
  choice: 都可以做
  rationale: 该词表示获准、许可或合乎规定；“可以做”符合现代汉语习惯，并避免“合法”可能带来的狭义法律色彩。
- source_word: ἀλλ’
  choice: 但
  rationale: 直接呈现简洁有力的转折关系。
- source_word: συμφέρει
  choice: 有益处
  rationale: 该词在这里指有利、有帮助；“有益处”自然清楚，也不带“有利润”的商业意味。
- source_word: οἰκοδομεῖ
  choice: 造就人
  rationale: 保留保罗常用的建造隐喻，同时以“人”点明其群体伦理语境；比单说“建造”更符合现代汉语表达。
theological_decisions:
- issue: 是否把 Πάντα ἔξεστιν 标为哥林多人所说的口号
  choice: 用引号译作“凡事都可以做”
  alternative: 不用引号，将其作为保罗本人未加标示的陈述
  rationale: 重复的短语很可能是保罗引用并加以限制的哥林多人言论；但希腊文原稿没有现代引号，因此这属于解释性标点，而非文本异文。脚注明示这种不确定性。
- issue: οἰκοδομεῖ 的对象是否明说
  choice: 译作“造就人”
  alternative: 译作“建造”或“使人得造就”
  rationale: 原文未明说宾语，但保罗在此语境中的隐喻通常关乎群体和他人的成长。“造就人”以自然汉语表达隐含对象，不把范围限定为某一特定个人。
translation_notes:
  register: 采用现代、简洁而庄重的标准普通话。“凡事……但不是凡事……”保留原文两组平行对照；“造就人”沿用基督教语境中通行且易懂的建造隐喻。
