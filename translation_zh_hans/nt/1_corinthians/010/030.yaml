  text: If I partake with thankfulness[a], why am I denounced for that for which I give thanks?
translation:
  language: zh_hans
  text: 我若怀着感恩的心[a]吃，为什么因我所感谢的而受人毁谤呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我若靠着恩典吃，为什么因我所感谢的而受人毁谤呢？”希腊语“χάριτι”也可译为“靠着恩典”；但在这里，许多人因下文的“感谢”而理解为“怀着感恩的心”。
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτι
  choice: 怀着感恩的心
  rationale: 此处与下文“我所感谢的”紧密呼应，表示吃的时候心存感谢；这样译比“靠着恩典”更符合饮食语境，同时以脚注保留原词可能表示“恩典”的歧义。
- source_word: μετέχω
  choice: 吃
  rationale: 该词本义为“有分、分享”，但本段具体讨论食物，现代汉语用“吃”最自然清楚；若直译“有分于”则显得生硬。
- source_word: βλασφημοῦμαι
  choice: 受人毁谤
  rationale: 被动形式指说话攻击或诋毁保罗；对象是人，并非对上帝的亵渎，因此译作“受人毁谤”既保留言语伤害的力度，也避免误解。
- source_word: ὑπὲρ οὗ
  choice: 因……食物
  rationale: 这里表达遭受毁谤的缘由。结合饮食语境补出“食物”，使关系从句在汉语中自然明确。
- source_word: εὐχαριστῶ
  choice: 我所感谢的
  rationale: 保留“感谢”的动作，不明说感谢的对象是上帝，因为希腊文在本句中没有明示。
- source_word: ἐγὼ ... ἐγὼ
  choice: 我若……我所……
  rationale: 保留两个第一人称成分，以传达原文重复显式代词所带的强调和对比。
- source_word: τί
  choice: 为什么
  rationale: 在此修辞问句中，τί表示询问原因，现代汉语自然译为“为什么”。
theological_decisions:
- issue: χάριτι在饮食与感谢语境中的含义
  choice: 怀着感恩的心
  alternative: 靠着恩典
  rationale: 紧接着的εὐχαριστῶ（“感谢”）支持“感恩”之义；但χάρις也可表示“恩典”，因此不把另一可能性从读者面前隐去，而在脚注中说明。
- issue: 感谢的对象是否明说为上帝
  choice: 不补出“上帝”
  alternative: 我为此感谢上帝
  rationale: 上下文可使读者自然理解感谢是向上帝而发，但本句希腊文未明说宾语；正文不作超出原文的补充。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“怀着感恩的心吃”符合日常饮食语境；“受人毁谤”保持原文言语攻击的力度。正文以“呢”自然呈现修辞问句。
