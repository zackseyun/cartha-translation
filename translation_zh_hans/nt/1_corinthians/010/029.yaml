source:
  edition: SBLGNT
  text: συνείδησιν δὲ λέγω οὐχὶ τὴν ἑαυτοῦ ἀλλὰ τὴν τοῦ ἑτέρου· ἱνατί γὰρ ἡ ἐλευθερία μου κρίνεται ὑπὸ ἄλλης συνειδήσεως;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/029.yaml
  text: I mean the other person's conscience[a], not your own[b]. For why is my freedom judged by another conscience?
translation:
  language: zh_hans
  text: 我所说的良心，不是你自己的良心，而是别人的良心[a]。毕竟，我的自由为什么要受别人的良心评判呢？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 更直译为“不是他自己的，而是另一个人的”。上下文支持理解为“不是你自己的，而是另一个人的”。
    reason: lexical_alternative
  - marker: b
    text: 这个反问既可理解为保罗本人的质问，也可理解为他代述的一种异议；希腊文没有用引号或其他明确标记表示说话者转换。
    reason: alternative_reading
lexical_decisions:
- source_word: συνείδησιν / συνειδήσεως
  choice: 良心
  rationale: 这里指人用来衡量行为是否合宜的道德意识。“良心”是现代汉语中准确、自然且符合保罗语境的对应词。
- source_word: δὲ λέγω
  choice: 我说的
  rationale: 此处是在澄清上文所指的“良心”，不是引入时间意义上的“现在”。“我说的”简洁表达了说明和限定作用。
- source_word: οὐχὶ τὴν ἑαυτοῦ ἀλλὰ τὴν τοῦ ἑτέρου
  choice: 不是你自己的，而是另一个人的
  rationale: 希腊文在形式上是“不是他自己的，而是另一个人的”，但上下文是保罗直接教导读者顾及另一人的良心。用“你自己的”使现代汉语中的指代清楚，同时以脚注保留原文形式。
- source_word: ἱνατί γὰρ
  choice: 因为……为什么
  rationale: ἱνατί引出反问“为什么”，γάρ则承接并说明前面的澄清。“因为”保留其论证连接，问句保留反问语气。
- source_word: ἐλευθερία
  choice: 自由
  rationale: “自由”准确表达在可行之事上的行动权利，现代、清楚，也不预先加入特定神学解释。
- source_word: κρίνεται
  choice: 来评判
  rationale: κρίνω在此可指评断或判断，不一定特指定罪。“评判”保留其较宽泛的语义。
- source_word: ὑπὸ ἄλλης συνειδήσεως
  choice: 由别人的良心
  rationale: 保留被动结构中施事者的作用，并以“别人的”自然表达ἄλλης所指的另一个人的良心。
theological_decisions:
- issue: 首句反身代词所指
  choice: 正文按上下文译为“不是你自己的，而是另一个人的”
  alternative: 按希腊文形式直译为“不是他自己的，而是另一个人的”
  rationale: ἑαυτοῦ在形式上是第三人称单数，但上下文面向哥林多信徒，所作区分是读者自己的良心与另一人的良心。正文采用自然清楚的语篇指向，脚注则保留原文形式上的差异。
- issue: 后半句反问的发言者与论证作用
  choice: 保留为没有引号的反问，不在正文中判定它是保罗本人的质问还是他代述的异议
  alternative: 明确视为哥林多人提出的异议，或明确视为保罗自己的论断
  rationale: 希腊文没有显式的换说话者标记。保持反问形式可保存原文的解释空间，避免把某一种神学论证结构写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“我说的”体现对上文的澄清；“评判”避免把κρίνεται过度限定为“定罪”。正文保留反问及其解释张力，两个脚注标记均置于相关句子之后。
