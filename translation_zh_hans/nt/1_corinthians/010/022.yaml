  yaml_path: translation/nt/1_corinthians/010/022.yaml
  text: Or are we provoking the Lord to jealousy? Surely we are not stronger than he is, are we?
translation:
  language: zh_hans
  text: 难道我们惹主嫉妒吗？我们不可能比他更强吧？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραζηλοῦμεν
  choice: 惹……嫉妒
  rationale: 保留该动词“激起嫉妒、使之妒忌”的核心含义，也自然承接本段有关偶像崇拜与对主不忠的语境。
- source_word: τὸν κύριον
  choice: 主
  rationale: 按保罗书信中 κύριος 的通常称谓译为“主”，不擅自把所指进一步明确为某一专名。
- source_word: ἰσχυρότεροι αὐτοῦ
  choice: 比他更强
  rationale: 准确表达比较级 ἰσχυρότεροι 及属格比较对象 αὐτοῦ，同时保持原文对人的狂妄所作的反问。
theological_decisions:
- issue: “主的嫉妒”是否应弱化为一般的“惹怒”
  choice: 保留“嫉妒”
  alternative: 惹主发怒
  rationale: παραζηλόω 明确含有激起嫉妒之意；此处与参与偶像祭宴造成的关系性不忠相关，不应把这一神学张力泛化为单纯发怒。
- issue: 第二问的预期否定语气
  choice: 译为“我们不可能比他更强吧？”
  alternative: 难道我们比他更强吗？
  rationale: μή 引导的问题预期否定回答；“不可能……吧”自然传达强烈否定预期，又保留反问形式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。两个反问均予保留；第二句以“不可能……吧”体现 μή 所标示的否定预期。
