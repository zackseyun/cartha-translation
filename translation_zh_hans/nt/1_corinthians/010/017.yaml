base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/017.yaml
  text: Because there is one bread[a], we who are many are one body, for we all partake of the one bread.
translation:
  language: zh_hans
  text: 因为饼只有一个[a]，我们虽多，却是一个身体，因为我们都同享这一个饼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“只有一块饼”；本节后面的“这一个饼”亦同。希腊语ἄρτος可指“饼”，也可指一整个饼；后一译法较具体地突显众人分享同一个来源。
    reason: 词义替代
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 在此承接上文并说明理由；“因为”自然地表达其因果作用。
- source_word: εἷς ἄρτος
  choice: 饼只有一个
  rationale: ἄρτος既可泛指饼，也可指作为一个整体的一只饼。“饼只有一个”既保留圣餐语境，也突出数目上的“一”。
- source_word: ἓν σῶμα
  choice: 一个身体
  rationale: 直译σῶμα，并保留信徒群体合一以及上下文中与饼相联的多重意味。
- source_word: οἱ πολλοί ἐσμεν
  choice: 我们虽多，却是
  rationale: 忠实呈现“众多的人”与“一个身体”的鲜明对照；汉语用“虽……却……”表达原文虽未明说却清楚存在的对比关系。
- source_word: γὰρ
  choice: 因为
  rationale: 引出前一陈述的根据；现代汉语中再次使用“因为”清楚而自然。
- source_word: οἱ πάντες
  choice: 我们都
  rationale: 保留πάντες所强调的全体共同参与。
- source_word: ἐκ τοῦ ἑνὸς ἄρτου
  choice: 这一个饼
  rationale: 介词ἐκ在μετέχω的结构中表示共同取用或有分于同一来源；配合“同享”，汉语无需另译“从”。
- source_word: μετέχομεν
  choice: 同享
  rationale: 表达众人共同取用并有分于同一饼，比单纯“吃”更充分保留共享与参与的含义。
theological_decisions:
- issue: 一个饼与一个身体之间的关系
  choice: 保留共同分享一个饼与众信徒成为一个身体之间的因果联系，不进一步界定圣餐的本体性质。
  alternative: 可偏重象征性的群体合一，或偏重借着饼所实现的圣礼性相交。
  rationale: 希腊文明确把众人同享一个饼作为众人成为一个身体的根据，但本节本身并未解决后世关于圣餐性质的各项教义争论。译文因此保留其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“同享”兼顾共同进食与共同有分的语境；“我们虽多，却是一个身体”突出原文中多与一的对照。
