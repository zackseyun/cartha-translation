  text: μηδὲ ἐκπειράζωμεν τὸν ⸀Χριστόν, ⸀καθώς τινες αὐτῶν ἐπείρασαν, καὶ ὑπὸ τῶν ὄφεων ⸀ἀπώλλυντο.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/009.yaml
  text: Nor should we put Messiah to the test[b][a], as some of them tested him and were being destroyed by the snakes.
translation:
  language: zh_hans
  text: 我们也不要试探弥赛亚[a]，像他们中有些人试探他，结果被蛇害死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“主”，而不是“弥赛亚”。
    reason: textual_variant
lexical_decisions:
- source_word: μηδὲ
  choice: 也不要
  rationale: 承接上下文一连串劝诫式禁令；“也不要”在现代汉语中自然，并保留第一人称复数劝勉的语气。
- source_word: ἐκπειράζωμεν
  choice: 试探
  rationale: 指以不当方式考验或检验对方；“试探”既符合圣经语境，也比“诱惑”更准确，因为弥赛亚是该动词的宾语。
- source_word: τὸν Χριστόν
  choice: 弥赛亚
  rationale: Χριστός在这里是称号；译作“弥赛亚”既体现其称号性质，也避免把它仅当作音译姓名。
- source_word: καθώς
  choice: 像
  rationale: 自然引出与旷野世代行为的比较。
- source_word: τινες αὐτῶν
  choice: 他们中有些人
  rationale: 清楚指向旷野中的以色列人群体内的一部分人。
- source_word: ἐπείρασαν
  choice: 试探他
  rationale: 承接前句动词，并把原文语境中省略却可明确补出的宾语表达出来。
- source_word: ὑπὸ τῶν ὄφεων
  choice: 被蛇咬死
  rationale: 原文直指蛇为施害者；现代汉语通常以蛇的典型致死行为“咬”来自然表达，而不采用生硬的“被蛇毁灭”。
- source_word: ἀπώλλυντο
  choice: 死了
  rationale: 在此语境中表示遭毁灭、丧命；与“被蛇咬”组合为自然的现代汉语“被蛇咬死了”。原文未完成时的过程性在汉语中不宜机械译为“正在被毁灭”。
theological_decisions:
- issue: τὸν Χριστόν的所指及异文
  choice: 正文译作“弥赛亚”
  alternative: “主”
  rationale: SBLGNT正文采用Χριστόν，保留保罗将旷野中受试探者称为弥赛亚所形成的神学张力，不将其弱化或改写。部分抄本作“主”，属于重要异文，列入脚注。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“我们也不要”保留群体劝勉语气；“结果”明确后半句是其后果。未为ὄφεων另设“蛇类”之类脚注，因为现代汉语中的“蛇”已准确覆盖该词，另列近义表达不会提供实质信息。
