  text: μηδὲ εἰδωλολάτραι γίνεσθε, καθώς τινες αὐτῶν· ὥσπερ γέγραπται· Ἐκάθισεν ὁ λαὸς φαγεῖν καὶ πεῖν, καὶ ἀνέστησαν παίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/007.yaml
  text: Do not become idolaters[a], as some of them were; just as it is written, “The people sat down to eat and drink, and rose up to play.”
translation:
  language: zh_hans
  text: 不要成为拜偶像的人，像他们中有些人那样；正如经上所记：“百姓坐下吃喝，起来玩乐[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“狂欢作乐”。这里引自《出埃及记》32:6；当时的“玩乐”与以色列人在金牛犊前举行的偶像筵席有关。
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: 不要
  rationale: 承接上下文的一连串禁令，用现代汉语直接的否定祈使表达最自然。
- source_word: εἰδωλολάτραι
  choice: 拜偶像的人
  rationale: 准确表达参与偶像崇拜者，且比名词化较强的“偶像崇拜者”更通俗自然。
- source_word: γίνεσθε
  choice: 成为
  rationale: 保留 γίνομαι 所表达的“成为、变成”之意，而不弱化为单纯的“是”。
- source_word: καθώς τινες αὐτῶν
  choice: 像他们中有些人那样
  rationale: 自然呈现比较关系，并明确指向旷野时期以色列人中的一部分。
- source_word: ὥσπερ γέγραπται
  choice: 正如经上所记
  rationale: 采用庄重而通行的引经公式，同时保留比较语气及已写下之经文的持续权威感。
- source_word: Ἐκάθισεν ὁ λαὸς φαγεῖν καὶ πεῖν
  choice: 百姓坐下吃喝
  rationale: 简洁、忠实地呈现集体主语及两个目的不定式，符合现代汉语引文节奏。
- source_word: ἀνέστησαν
  choice: 起来
  rationale: 准确表达叙事动作，与前面的“坐下”形成鲜明对应。
- source_word: παίζειν
  choice: 玩乐
  rationale: 保留“玩、嬉戏”的基本词义，同时较单独的“玩”更能承载宴饮庆乐的语境，但不在正文中直接限定为放纵狂欢。
theological_decisions:
- issue: 如何呈现出埃及记32:6引文中 παίζειν 的含义
  choice: 正文译作“玩乐”，脚注说明也可理解为“狂欢作乐”
  alternative: 正文直接译作“狂欢作乐”
  rationale: 该词有玩耍、嬉戏之义，而金牛犊事件的语境又使其带有偶像筵席中庆乐或狂欢的意味。正文保留较宽的词义，脚注交代语境内涵，可避免把解释直接写死。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“拜偶像的人”直白清楚；引文保持简洁的经文节奏。脚注标记已置于其所说明的“玩乐”之后。
