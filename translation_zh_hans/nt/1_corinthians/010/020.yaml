  text: ἀλλ’ ὅτι ἃ ⸀θύουσιν, δαιμονίοις ⸂καὶ οὐ θεῷ θύουσιν⸃, οὐ θέλω δὲ ὑμᾶς κοινωνοὺς τῶν δαιμονίων γίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/020.yaml
  text: No[a], but what they sacrifice, they sacrifice to demons and not to God, and I do not want you to become sharers with demons.
translation:
  language: zh_hans
  text: 我的意思是，他们所献的祭物是献给鬼魔，不是献给上帝；我不愿意你们成为与鬼魔有分的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与鬼魔有分的人”也可译作“与鬼魔一同有分的人”或“与鬼魔相交的人”。
    reason: 说明 κοινωνός 所包含的共同参与、分享和相交等相近含义。
lexical_decisions:
- source_word: ἀλλ’ ὅτι
  choice: 不；而是说
  rationale: 承接上文，表达纠正误解的转折：保罗不是说偶像本身算得什么，而是进一步说明祭物所指向的对象。这样的译法比生硬的“但那”更符合现代汉语。
- source_word: ἃ θύουσιν
  choice: 他们所献的祭
  rationale: 中性关系代词指祭献之物或祭献行为；“所献的祭”自然保留祭祀语境，又不额外限定祭物种类。
- source_word: θύουσιν
  choice: 献
  rationale: 在祭祀语境中表示献祭；与名词“祭”搭配，简洁而清楚。
- source_word: δαιμονίοις
  choice: 给鬼魔
  rationale: 新约语境中的 δαιμόνιον 指邪灵性的鬼魔，而非中性的次级神祇；“鬼魔”也能与“上帝”形成清楚对照。
- source_word: καὶ οὐ θεῷ
  choice: 不是献给上帝
  rationale: 上下文是在鬼魔与独一真神之间作对照；无冠词的 θεῷ 在此按确定意义理解。
- source_word: οὐ θέλω δὲ
  choice: 我不愿意
  rationale: δέ 在此轻微推进论述，汉语无需机械译出连接词；“不愿意”准确表达保罗的意愿和劝戒。
- source_word: κοινωνοὺς
  choice: 有分的人
  rationale: κοινωνός 表示共同参与、分享或相交者；“有分的人”保留真实参与的分量，又不把含义过度限定为社会交往或完全效忠。
- source_word: τῶν δαιμονίων
  choice: 与鬼魔
  rationale: 属格与 κοινωνούς 连用，表示参与或相交的对象；现代汉语以“与……有分”最自然。
- source_word: γίνεσθαι
  choice: 成为
  rationale: 保留 γίνομαι 所表达的进入某种状态之意，而不弱化为静态的“是”。
theological_decisions:
- issue: 异教祭献所指向的属灵对象
  choice: 祭是献给鬼魔，不是献给上帝
  alternative: 仅指偶像宴席的社会意义，或把“鬼魔”理解为纯粹修辞性的假神
  rationale: 经文本身明确将“鬼魔”与“上帝”对照，因此保留这一直接而严肃的神学判断，不加以淡化，也不进一步推测鬼魔活动的方式。
- issue: κοινωνοὺς τῶν δαιμονίων 的参与性质
  choice: 与鬼魔有分
  alternative: 仅仅与拜偶像者有社交往来，或完全归顺鬼魔
  rationale: 上下文以“有分”论述祭坛和敬拜中的真实参与；译文保持这种关系性与参与性的张力，但不把它夸大为完全效忠。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“所献的祭”保留礼仪语境；“与鬼魔有分”呼应本段有关参与和相交的论述。分号帮助读者看出对上文误解的否定与随后解释之间的关系。
