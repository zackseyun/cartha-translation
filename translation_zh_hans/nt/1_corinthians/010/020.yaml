  naturalness: “他们所献的祭，是献给……”略显重复但可理解；改为“他们所献的祭物是献给……”更顺畅，也清楚保留关系代词所指的祭献之物。其余措辞庄重、现代且清晰。“与鬼魔有分的人”自然，并适合本段参与／相交的语境。
