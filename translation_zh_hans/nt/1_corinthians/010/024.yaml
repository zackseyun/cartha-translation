  text: μηδεὶς τὸ ἑαυτοῦ ζητείτω ἀλλὰ τὸ τοῦ ⸀ἑτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/024.yaml
  text: Let no one seek his own good[a], but that of the other person.
translation:
  language: zh_hans
  text: 谁也不要寻求自己的益处[a]，而要寻求他人的益处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更直译：“谁也不要寻求自己的事，而要寻求他人的事。”
    reason: 原文使用省略结构，没有明确说出“益处”。
lexical_decisions:
- source_word: μηδεὶς
  choice: 谁也不要
  rationale: 与第三人称命令式连用，表达普遍性的禁止；现代汉语中“谁也不要”自然、清楚。
- source_word: ζητείτω
  choice: 寻求
  rationale: 保留 ζητέω“寻求、力求”的宽泛含义，不把行动限缩为物质利益或内心愿望。
- source_word: τὸ ἑαυτοῦ
  choice: 自己的益处
  rationale: 原文是中性冠词加反身代词所有格构成的省略表达，直译近于“自己的事物”。结合10:23—33为他人益处行事的语境，补出“益处”可自然传达伦理含义；脚注保留较直译的可能。
- source_word: ἀλλὰ
  choice: 而要
  rationale: 表达由禁止转向正面要求的强烈对比，符合现代汉语句法。
- source_word: τὸ τοῦ ἑτέρου
  choice: 他人的益处
  rationale: 原文同样省略中心名词；ἕτερος在这里指自身以外的另一个人。“他人”简洁地保留自我与别人之间的对照。
theological_decisions:
- issue: 如何处理 τὸ ἑαυτοῦ / τὸ τοῦ ἑτέρου 的省略结构
  choice: 正文补出“益处”，译作“自己的益处……他人的益处”
  alternative: 较直译为“自己的事……他人的事”或“属于自己的……属于他人的”
  rationale: 希腊文没有明说所寻求的具体对象。上下文强调不只求自己的便利或权利，而要使别人得益，因此“益处”准确呈现语境中的伦理指向，同时以脚注保留原文的开放性，避免把含义限缩为财物或所有权。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“谁也不要……而要……”清楚呈现普遍禁令与正面要求；“他人”比“另一个人”更符合汉语伦理劝诫的表达习惯。
