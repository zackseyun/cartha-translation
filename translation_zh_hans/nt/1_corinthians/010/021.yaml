id: 1CO.10.21
reference: 1 Corinthians 10:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: οὐ δύνασθε ποτήριον κυρίου πίνειν καὶ ποτήριον δαιμονίων· οὐ δύνασθε τραπέζης κυρίου μετέχειν καὶ τραπέζης δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/021.yaml
  text: You cannot drink the cup of the Lord and the cup of demons[a]; you cannot partake of the table of the Lord and the table of demons.
translation:
  language: zh_hans
  text: 你们不能既喝主的杯，又喝鬼魔的杯；也不能既有分于主的筵席，又有分于鬼魔的筵席。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ δύνασθε
  choice: 你们不能
  rationale: 直接表达能力或可能性上的否定，并保留保罗所强调的绝对不相容性；两处重复译出。
- source_word: ποτήριον
  choice: 杯
  rationale: 是该词直接、自然且为读者熟悉的对应词，也保留饮用及共同参与的语境。
- source_word: κυρίου
  choice: 主的
  rationale: 按属格关系直译，并与“鬼魔的”构成鲜明平行。
- source_word: πίνειν
  choice: 喝
  rationale: 以现代汉语中最自然的动词表达不定式含义，无须添加进行体意味。
- source_word: δαιμονίων
  choice: 鬼魔
  rationale: 准确保留该词所指邪恶灵界存在的位格性，比泛化为“邪灵”更贴近新约通常用语。
- source_word: τραπέζης
  choice: 筵席
  rationale: 在祭祀及共同饮食的语境中，“筵席”比字面的“桌子”更自然，同时保留围桌共享和宗教参与的意象。
- source_word: μετέχειν
  choice: 有分于
  rationale: 表达实际参与、分享其中的含义，措辞庄重而仍为现代读者所理解。
- source_word: καὶ
  choice: 既……又……
  rationale: 用自然汉语呈现两个彼此不相容的并列对象，并保留原文的平行修辞。
theological_decisions:
- issue: 参与主的筵席与参与鬼魔筵席之间的关系
  choice: 译为绝对不能并存的两种参与
  alternative: 仅视为劝人避免这种行为，而非断言二者根本不相容
  rationale: 原文连续两次使用οὐ δύνασθε，并以严格平行的句式陈述；译文重复“不能”，不将其弱化为一般性的劝告，也不额外解释这种不相容的教义机制。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“既……又……”使希腊文的并列关系符合汉语习惯；重复“不能”保留原文的强调。“有分于”略带礼仪语域，适合本节祭祀与共同饮食的背景，同时避免加入“圣餐”或“祭坛”等原文未明说的解释。
