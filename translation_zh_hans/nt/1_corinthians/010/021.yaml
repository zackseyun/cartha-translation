  naturalness: 行文庄重、清楚，符合现代标准普通话的圣经语域。“有分于”和“筵席”在共同饮食及宗教参与的上下文中自然通顺；重复结构也保留了原文的修辞力度。
  terminology: “主”对应 κυρίου 一贯且恰当；“鬼魔”可准确表达 δαιμονίων 的人格性邪灵含义，并保有汉语圣经的常用庄重语域。“筵席”是 τραπέζης 在此上下文中可接受且自然的意译，未不当落实为“祭坛”或“圣餐”。
