  text: ⸀εἴ τις καλεῖ ὑμᾶς τῶν ἀπίστων καὶ θέλετε πορεύεσθαι, πᾶν τὸ παρατιθέμενον ὑμῖν ἐσθίετε μηδὲν ἀνακρίνοντες διὰ τὴν συνείδησιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/027.yaml
  text: If one of the unbelievers invites you and you want to go[a], eat whatever is set before you[b], asking no questions for the sake of conscience.
translation:
  language: zh_hans
  text: 若有一个不信的人邀请你们，而你们愿意去，就凡摆在你们面前的，都只管吃，不要为了良心[b]的缘故查问[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “查问”也可译作“调查”或“追问”。这里的意思是不要追查食物的来历。
    reason: lexical_alternative
  - marker: b
    text: 这里没有说明是谁的“良心”；下一节进一步提到另一个人的良心，并把它与自己的良心区别开来。
    reason: cross_reference
lexical_decisions:
- source_word: ἀπίστων
  choice: 不信的人
  rationale: 该带冠词的复数属格指以不信为特征的人，在本段中特指非基督徒的主人；“不信的人”简明自然，也保留了保罗所作的群体区分而不增添敌意。
- source_word: καλεῖ
  choice: 请你们吃饭
  rationale: καλέω 在这里的宴饮语境中意为“邀请”；补出“吃饭”能以自然汉语明确邀请的场景，而不改变原意。
- source_word: θέλετε πορεύεσθαι
  choice: 你们也愿意去
  rationale: 该短语表达接受邀请的意愿；“愿意去”保留了行为取决于受邀者意愿的条件性。
- source_word: πᾶν τὸ παρατιθέμενον ὑμῖν
  choice: 凡摆在你们面前的
  rationale: 带冠词的分词结构指席间端上来的食物；“凡……的”保留 πᾶν 的广泛范围，并在汉语中自然地承接“都只管吃”。
- source_word: ἐσθίετε
  choice: 都只管吃
  rationale: 现在时命令式在此给出一般性指示；“只管吃”清楚传达许可兼吩咐的语气，又不刻意扩大希腊语时体的意义。
- source_word: μηδὲν ἀνακρίνοντες
  choice: 不要……查问
  rationale: ἀνακρίνω 可指审查、调查或询问；此处重点是不追查食物的来历。“查问”既保留调查意味，也符合用餐情境。
- source_word: διὰ τὴν συνείδησιν
  choice: 因良心的缘故
  rationale: διά 加宾格在此表示缘由或所顾念的因素；这一译法保留原文的简略表达，不在本节中预先断定是谁的良心。
theological_decisions:
- issue: 本节中 συνείδησις（良心）具体指谁的良心
  choice: 正文只译作“良心”，保留泛指和语境上的开放性，由下一节进一步说明。
  alternative: 明确译成信徒自己的良心，或明确译成另一个人的良心。
  rationale: 本节措辞简短，下一节才特别区分“那另一个人的良心”和“自己的良心”；若在本节直接补出所属者，就会提前消除原文的张力与含混。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“请你们吃饭”明确宴饮语境；“凡……都只管吃”自然传达概括性命令。脚注标记分别紧随“查问”和“良心”，与各自说明准确对应。
