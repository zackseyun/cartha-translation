  naturalness: 修订后的句子简洁、庄重，符合现代标准汉语；以“或”连接三个并列对象，明确三者均是劝诫所及的对象。
  terminology: “犹太人”“希腊人”“上帝的教会”均恰当。保留“希腊人”而不在正文泛化为“非犹太人”，符合原文的具体措辞。
