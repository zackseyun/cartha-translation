  text: ἀπρόσκοποι ⸂καὶ Ἰουδαίοις γίνεσθε⸃ καὶ Ἕλλησιν καὶ τῇ ἐκκλησίᾳ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/032.yaml
  text: Give no offense either to Jews or to Greeks or to the church of God[b][a],
translation:
  language: zh_hans
  text: 你们不要冒犯[a]犹太人、希腊人[b]或上帝的教会。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要使人跌倒”或“要无可指责”。
    reason: lexical_alternative
  - marker: b
    text: “希腊人”在保罗当时的语境中很可能泛指非犹太人；希腊原文直译为“希腊人”。
    reason: cultural_note
lexical_decisions:
- source_word: ἀπρόσκοποι
  choice: 不要使人跌倒
  rationale: 该词在这里指不使别人受阻、跌倒或被冒犯。结合上下文关于顾念他人益处的劝勉，译为“不要使人跌倒”既表达其关系性含义，也保留保罗常用的“跌倒”意象。
- source_word: γίνεσθε
  choice: 你们都不要……
  rationale: 这是现在时命令语气，要求持续保持某种行事方式。汉语用否定劝诫句自然表达其持续性的命令含义，无须生硬直译为“要成为”。
- source_word: Ἰουδαίοις
  choice: 对犹太人
  rationale: 这里指作为族群及宗教群体的犹太人，并非特指犹太地区的居民。
- source_word: Ἕλλησιν
  choice: 希腊人
  rationale: 原文明确使用“希腊人”；在保罗当时的语境中可能泛指非犹太人，但正文保留原词，不直接概括为“外族人”。
- source_word: ἐκκλησίᾳ τοῦ θεοῦ
  choice: 上帝的教会
  rationale: 该词组指属于上帝的信徒群体；“上帝的教会”是准确、通顺并沿用成熟汉语圣经用语的表达。
theological_decisions:
- issue: 劝诫所涉及群体的划分
  choice: 保留犹太人、希腊人和上帝的教会三个原文明列的对象
  alternative: 把“希腊人”直接解释并译为所有非犹太人，或把本句限定为宣教策略
  rationale: 经文本身明确列出三个群体，却没有在本节内进一步界定其社会或神学关系；译文因此保留这种划分，不扩大或缩小其范围。
- issue: ἀπρόσκοποι所表达的是不使人跌倒还是自身无可指责
  choice: 正文采用“不使人跌倒”
  alternative: “无可指责”或“不要冒犯人”
  rationale: 上下文强调不求自己的益处、而求众人的益处，因此使他人不致跌倒的关系性含义较为突出；脚注同时保留该词可指自身无可指责或不冒犯人的词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“无论……还是……”自然统摄原文三个并列对象；“使人跌倒”保留圣经伦理语境中的形象，同时由脚注说明其他可能译法。
