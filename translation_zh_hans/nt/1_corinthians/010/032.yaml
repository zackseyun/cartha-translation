  to: 你们不要冒犯[a]犹太人、希腊人[b]或上帝的教会。
  rationale: 修订以“不要冒犯”表达ἀπρόσκοποι ... γίνεσθε在本节中“不成为冒犯或阻碍”的宽泛关系性含义，避免把原文限定为使人陷入属灵或道德上的“跌倒”。三个原文并列的群体及其范围均予保留；脚注a保留“使人跌倒”与“无可指责”两种可行表达，脚注b继续说明“希腊人”的历史语境而不改动正文词义。
