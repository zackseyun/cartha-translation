  source_fidelity: 正文对ἀλλ’、‘大多数人’、εὐδοκέω、旷野及κατεστρώθησαν的基本处理恰当。“倒毙”在此警戒和死亡语境中可成立，并且没有擅自指定具体死亡方式。不过γάρ在本句引出上帝不喜悦他们的理由，译作“因此”将原文的解释性逻辑倒置，应改为“因为”或“因他们……”。
