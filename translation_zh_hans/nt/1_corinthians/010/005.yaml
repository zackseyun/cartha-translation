  text: ἀλλ’ οὐκ ἐν τοῖς πλείοσιν αὐτῶν ηὐδόκησεν ὁ θεός, κατεστρώθησαν γὰρ ἐν τῇ ἐρήμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/005.yaml
  text: Nevertheless[a], God was not pleased with most of them, for they were struck down in the wilderness.
translation:
  language: zh_hans
  text: 然而，上帝并不喜悦他们中大多数人，因为他们倒毙[a]在旷野。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被击倒”或“横陈”。
    reason: κατεστρώθησαν可描绘被击倒，也可着重尸身倒卧、横陈于地的图像；正文采用符合死亡语境的“倒毙”，脚注保留其词汇幅度。
lexical_decisions:
- source_word: ἀλλ’
  choice: 然而
  rationale: 承接前文众人同享属灵恩惠的叙述，表达鲜明转折；现代汉语自然且庄重。
- source_word: οὐκ ἐν τοῖς πλείοσιν αὐτῶν
  choice: 他们中大多数人并不蒙……喜悦
  rationale: 保留“绝大多数/大多数”的数量含义，并按汉语习惯与εὐδοκέω合译。
- source_word: ηὐδόκησεν ὁ θεός
  choice: 蒙上帝喜悦
  rationale: 准确表达上帝并不以他们为喜悦、悦纳他们的意思，同时避免把含义窄化为单纯的行政性“认可”。
- source_word: γὰρ
  choice: 因此
  rationale: 本句后半说明上帝不喜悦他们所显出的结果或印证；汉语用“因此”能自然呈现上下文中的因果联系。
- source_word: κατεστρώθησαν
  choice: 倒毙
  rationale: 该被动动词描绘他们被击倒、尸身倒卧旷野；“倒毙”简洁传达死亡与审判语境，同时脚注保留较贴近字面的图像。
- source_word: ἐν τῇ ἐρήμῳ
  choice: 在旷野
  rationale: “旷野”是出埃及及漂流背景中自然且有经文呼应的标准译法。
theological_decisions:
- issue: κατεστρώθησαν所描述的审判性质
  choice: 译作“倒毙”，表明这些以色列人在旷野死亡，并保留上下文中的审判警戒意味。
  alternative: 较中性地译为“倒卧”或“横陈”，主要突出尸身遍布旷野的图像。
  rationale: 上下文以以色列人的失败及后果警戒哥林多人；“倒毙”不额外指明死亡方式或具体施行者，却能传达原文在此处的死亡和审判意味。
- issue: “不蒙上帝喜悦”的范围
  choice: 明确限定为“他们中大多数人”。
  alternative: 译成“上帝对他们并不喜悦”，可能使范围听来涵盖所有人。
  rationale: 原文τοῖς πλείοσιν明确指大多数而非全体，翻译应保留这一限定，避免消除少数例外。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“蒙上帝喜悦”保留经文语体但不过分古雅；“倒毙”有力度，适合本段警戒性的语境。脚注标记紧随其所解释的动词，而非置于转折词之后。
