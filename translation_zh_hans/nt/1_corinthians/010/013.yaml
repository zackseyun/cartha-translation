id: 1CO.10.13
reference: 1 Corinthians 10:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: πειρασμὸς ὑμᾶς οὐκ εἴληφεν εἰ μὴ ἀνθρώπινος· πιστὸς δὲ ὁ θεός, ὃς οὐκ ἐάσει ὑμᾶς πειρασθῆναι ὑπὲρ ὃ δύνασθε, ἀλλὰ ποιήσει σὺν τῷ πειρασμῷ καὶ τὴν ἔκβασιν τοῦ ⸀δύνασθαι ὑπενεγκεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/013.yaml
  text: No temptation has overtaken you except what is common to man[a]. But God is faithful, who will not allow you to be tempted beyond what you are able, but with the temptation will also provide the way out[c][b], so that you may be able to endure it.
translation:
  language: zh_hans
  text: 你们所遭遇的诱惑，无非是人所共有的[a]。但神是信实的；他不会容许你们受诱惑超过你们所能承受的，反而会在这诱惑中也为你们预备出路[b]，使你们能够忍受得住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“无非是人的”，或“无非是人类所共有的”。
    reason: lexical_alternative
  - marker: b
    text: “诱惑／受诱惑”也可译作“试验／受试验”或“考验／受考验”；“出路”也可译作“脱离之路”或“结果”。这里强调神的预备使人能够忍受。
    reason: lexical_alternative
lexical_decisions:
- source_word: πειρασμός / πειρασθῆναι
  choice: 诱惑／受诱惑
  rationale: 该词组可指诱惑、试验或考验。鉴于上文警戒恶欲、拜偶像和犯罪，正文采用“诱惑”，同时以脚注保留“试验／考验”的可能。
- source_word: εἴληφεν
  choice: 所遭遇的
  rationale: 完成时形式表达诱惑已经临到并攫住读者的经历；“遭遇”在现代汉语中自然，也保留了事情临到人的意味。
- source_word: εἰ μὴ ἀνθρώπινος
  choice: 无非是人所共有的
  rationale: ἀνθρώπινος意为“人的、人类所共有的”，表明这种诱惑并非超乎一般人类经验；此译文自然且涵盖所有人。
- source_word: πιστός
  choice: 信实的
  rationale: 用于神时，“信实”突出其可靠、守信，符合本句应许的重点。
- source_word: οὐκ ἐάσει
  choice: 不会容许
  rationale: 准确表达“不让、不许可”，语体庄重而现代。
- source_word: ὑπὲρ ὃ δύνασθε
  choice: 超过你们所能承受的
  rationale: 按上下文补出“承受”，使汉语清楚，并与末尾ὑπενεγκεῖν“忍受、承受”呼应。
- source_word: ποιήσει
  choice: 预备
  rationale: ποιέω本义宽泛，可指“作成、带来”；与ἔκβασις连用时，“预备”自然表达神使出路成为可能，但不额外规定其具体形式。
- source_word: σὺν τῷ πειρασμῷ
  choice: 在诱惑临到时，也
  rationale: 保留出路与诱惑相伴而来的关系，不暗示诱惑必定立刻消失。
- source_word: ἔκβασιν
  choice: 一条出路
  rationale: 该词可指出口、脱离之路或结果；“出路”符合语境，又能与随后“忍受得住”并存，避免理解为单纯逃避。
- source_word: τοῦ δύνασθαι ὑπενεγκεῖν
  choice: 使你们能够忍受得住
  rationale: 将属格冠词不定式表达为目的或结果；“忍受得住”准确传达在压力下坚持、承受的意思。
theological_decisions:
- issue: πειρασμός是否指道德诱惑或一般试验
  choice: 正文译作“诱惑／受诱惑”
  alternative: “试验／受试验”或“考验／受考验”
  rationale: 紧接上文对恶欲、拜偶像和犯罪的警告，道德诱惑是此处较突出的含义；但希腊词本身范围较宽，因此脚注保留一般试验或考验的读法，不把经文限定于单一神学解释。
- issue: “出路”与“忍受”的关系
  choice: 译为神预备出路，“使你们能够忍受得住”
  alternative: 可将ἔκβασις理解为“脱离”或“结果”
  rationale: 原文没有说神必定立即除去诱惑，反而明确以能够忍受为目的或结果。译文保留这种张力：神所预备的出路可以是使人经受并走过诱惑的途径。
- issue: 神的信实与允许受诱惑
  choice: 保留“神不会容许”的原文陈述
  alternative: 不改写为神主动施加诱惑，也不将被动式行为者具体化
  rationale: 原文强调神为受诱惑设限并预备出路，却没有明确诱惑的直接来源；译文不替原文解决这一神学张力。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“无非是人所共有的”避免古旧的泛指男性措辞；“反而”清楚体现ἀλλά的转折；整体保留希腊文从诱惑、神的信实到出路与忍耐的论证结构。
