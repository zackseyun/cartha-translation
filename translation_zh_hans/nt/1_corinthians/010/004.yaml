  text: καὶ πάντες τὸ αὐτὸ ⸂πνευματικὸν ἔπιον πόμα⸃, ἔπινον γὰρ ἐκ πνευματικῆς ἀκολουθούσης πέτρας, ἡ ⸂πέτρα δὲ⸃ ἦν ὁ Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/004.yaml
  text: and all drank the same spiritual drink[a], for they were drinking from a spiritual rock that followed them[b], and the rock was the Messiah.
translation:
  language: zh_hans
  text: 他们也都喝了同样的属灵饮料，因为他们不断饮用从一块一直随着他们的属灵磐石而来的水；那磐石就是弥赛亚。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”意为“受膏者”；希腊语作“基督”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πνευματικὸν ... πόμα
  choice: 属灵饮料
  rationale: 保留保罗与上一节“属灵食物”的平行表达；“属灵”既不被缩减为“象征性的”，也不被限定为“超自然的”或“神奇的” 。
- source_word: ἔπιον
  choice: 喝了
  rationale: 以完成性表达概括旷野群体共同有过的经历，并与后面的未完成时形成区别。
- source_word: ἔπινον
  choice: 不断……喝
  rationale: 体现未完成时所表达的持续或反复动作，同时保持现代汉语自然。
- source_word: ἐκ πνευματικῆς ἀκολουθούσης πέτρας
  choice: 从一块随着他们的属灵磐石那里
  rationale: “一块”反映 πέτρα 在此无冠词；“随着他们”保留现在分词的持续意味，又避免过度解释其方式。
- source_word: πέτρα
  choice: 磐石
  rationale: πέτρα 指岩石或磐石而非小石头；“磐石”也保留本段意象及其预表张力。
- source_word: ἡ πέτρα δὲ ἦν
  choice: 那磐石就是
  rationale: “那”回指前述磐石；“就是”直接保留希腊文系词判断句的认同力度，分号则自然呈现 δέ 的推进和解释作用。
- source_word: ὁ Χριστός
  choice: 基督
  rationale: “基督”是现代中文圣经及基督教语境中 Χριστός 的通行称谓，在此仍可承担称号含义；不将其改写为解释性较强的“受膏者”。
- source_word: πάντες τὸ αὐτὸ
  choice: 都……同样的
  rationale: 保留保罗对全体共享同一经历的强调。
theological_decisions:
- issue: “那磐石就是基督”的身份判断
  choice: 直译为“那磐石就是基督”
  alternative: “那磐石象征基督”或“那磐石代表基督”
  rationale: 原文使用直接的系词判断句。译文不把它削弱为纯粹象征，也不进一步说明物质磐石与基督之间的哲学关系，从而保留保罗表述本身的神学张力。
- issue: “属灵”对饮料和磐石的限定
  choice: 两处均保留“属灵”
  alternative: “神奇的”“超自然的”或“象征性的”
  rationale: πνευματικός 在上下文中反复出现并具有神学分量；保留原词可避免把神所赐、属圣灵领域及预表性的多重意味缩窄为单一解释。
- issue: 磐石“随着他们”
  choice: 保留磐石随行的陈述
  alternative: 将其解释为仅指磐石所供应的水持续伴随他们，或明确诉诸某种流动磐石传统
  rationale: 原文直接修饰“磐石”，译文应保留这一不寻常说法，不把潜在传统背景或具体机制写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“饮料”与“食物”形成自然平行；“不断……喝”呈现希腊文未完成时。“随着他们的属灵磐石”虽有意保留原文的不寻常意象，但整体句法仍符合现代汉语。
