revisions:
- from: 也都喝了同样的属灵饮料，因为他们不断从一块随着他们的属灵磐石那里喝；那磐石就是基督。[a]
  to: 他们也都喝了同样的属灵饮料，因为他们不断饮用从一块一直随着他们的属灵磐石而来的水；那磐石就是弥赛亚。[a]
  rationale: 修订解决原句“从……磐石那里喝”的结构错误，同时以“从……而来的水”忠实而自然地表达ἐκ的来源关系。保留两处“属灵”、磐石“随着他们”的不寻常陈述、未完成时的持续意味，以及“那磐石就是……”的直接判断。将称号性Χριστός译作“弥赛亚”，并以脚注交代常见的“基督”形式。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:51:26Z'
review_pass:
  verdict: revise
  source_fidelity: 原译正确保留了“都”“同样的”“属灵”以及磐石随行和磐石与基督的直接认同。不过“从一块随着他们的属灵磐石那里喝”在汉语中句法不成立，且未能清楚表达ἐκ所标示的饮用来源。修订以“从……磐石而来的水”自然表达从磐石而饮；“水”由磐石饮用的语境必然蕴含，并未增添对其机制的解释。
  naturalness: “属灵饮料”在现代汉语中可以理解，但略有商品化色彩；保留它可维持与上一节的平行。将后半句改为“不断饮用从……而来的水”，既自然，也能体现ἔπινον的持续／反复意味。“一直随着他们”保留原文分词的进行性，不说明磐石如何随行。
  terminology: “磐石”恰当对应πέτρα，并维持本段意象。“弥赛亚”直接呈现ὁ Χριστός在此的称号意义，也与英文审校轨迹一致；脚注简要说明其“受膏者”之义，不将身份判断弱化为象征。
  issues:
  - severity: high
    issue: “从一块随着他们的属灵磐石那里喝”句法不自然且来源关系不清。
    rationale: 汉语中“从……那里喝”通常需要明确的饮用对象或可供饮用的容器／来源；用于“磐石”会造成病句。原文明确说他们从磐石而饮，修订须清楚且自然地呈现该关系。
  - severity: medium
    issue: 正文用“基督”，但脚注将其释为“弥赛亚”，未在正文呈现该处称号用法。
    rationale: ὁ Χριστός在直接判断句中具有称号性；译为“弥赛亚”能清楚保留此点，且不改变保罗直接的认同陈述。
  revised_text: 他们也都喝了同样的属灵饮料，因为他们不断饮用从一块一直随着他们的属灵磐石而来的水；那磐石就是弥赛亚。[a]
  revised_footnotes:
