base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/019.yaml
  text: What then am I saying? That food sacrificed to idols is anything[b][a], or that an idol is anything?
translation:
  language: zh_hans
  text: 那么，我是在说什么呢？难道是说，祭过偶像的食物算得了什么[a][b]，或是说，偶像算得了什么吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“献给偶像的祭物算得了什么。”
    reason: lexical_alternative
  - marker: b
    text: 也就是说，保罗并不是断言偶像具有真实的神性，也不是说献祭的食物本身具有内在的属灵意义。
    reason: cross_reference
lexical_decisions:
- source_word: τί οὖν φημι
  choice: 那么，我是在说什么呢？
  rationale: 保留οὖν承接上文的推论作用、φημί的第一人称现在时，以及原句自问自答式的修辞语气；现代汉语自然明白。
- source_word: ὅτι
  choice: 难道是说／或是说
  rationale: ὅτι引出保罗可能被误解为正在主张的内容。首处用“难道是说”显出反问，第二处用“或是说”保留两个并列选项。
- source_word: εἰδωλόθυτόν
  choice: 祭过偶像的食物
  rationale: 该词在哥林多前书8—10章的语境中指与偶像祭祀有关、可供食用之物；此译比字面化的“偶像祭物”更容易为现代普通读者理解，同时不限定只指肉。
- source_word: τί ἐστιν
  choice: 算得了什么
  rationale: 此处τί与εἰμί构成简短的反问，涉及是否具有实际分量、意义或实在性。“算得了什么”保留这种开放性，不把它收窄为单纯的存在问题。
- source_word: ἢ
  choice: 或是
  rationale: 保留两个平行内容从句之间的选择关系。
- source_word: εἴδωλον
  choice: 偶像
  rationale: 在本段祭祀和敬拜的语境中明确指偶像，而非一般图像。
theological_decisions:
- issue: 保罗是否在本句中承认偶像或祭偶像之物具有某种真实存在或属灵效力
  choice: 将两个分句都译成开放而带否定预期的反问：“算得了什么”。
  alternative: 明确译为“有真实的存在／有任何属灵效力”。
  rationale: 原文τί ἐστιν语义简练，可关乎实在性、地位或效力。正文不加入哲学定义，也不提前消解下一节关于献祭对象的张力；脚注仅说明本句没有断言偶像具有真实的神性，或食物本身具有内在的属灵意义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“那么”衔接论证，“难道”传达反问预期；两个“算得了什么”保留原文的平行结构及有意未加界定的语义张力。脚注标记[a][b]均已置于正文相关短语之后。
