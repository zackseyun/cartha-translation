  text: Therefore[a], let the one who thinks he stands watch out lest he fall.
translation:
  language: zh_hans
  text: 所以，以为自己站得住的人要当心，免得跌倒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: 所以
  rationale: 该连词承接上文以色列人的失败事例，引出推论或劝诫；“所以”简洁自然，并保留其推论作用。
- source_word: ὁ δοκῶν
  choice: 自以为……的人
  rationale: 带冠词的现在分词作名词用，指具有这种想法的人。“自以为”在现代汉语中自然地表达主观判断，也贴合本节对自信者的警戒，但不直接断言其判断必然错误。
- source_word: ἑστάναι
  choice: 站得稳
  rationale: ἵστημι的完成时不定式表达处于站立的状态。汉语“站得稳”能自然表达保持站立、尚未跌倒的状态；不进一步限定为属灵坚定或得救地位。
- source_word: βλεπέτω
  choice: 要当心
  rationale: 现在时命令式发出持续警醒的劝告。“要当心”是现代、清楚而庄重的警戒语。
- source_word: μὴ πέσῃ
  choice: 免得跌倒
  rationale: μή加不定过去时虚拟式在命令语之后表示所要防范的结果。“免得跌倒”保留警告语气及πέσῃ的宽泛含义。
theological_decisions:
- issue: “跌倒”的性质
  choice: 保留笼统的“跌倒”，不说明是犯罪、受审判还是背道。
  alternative: 译为“陷入罪中”“落在审判之下”或“离弃信仰”。
  rationale: 上下文借以色列人的失败警戒过度自信，但πέσῃ本身没有明确限定跌倒的具体性质。宽泛译法保留经文的神学张力。
- issue: 希腊文阳性单数的代表性表达
  choice: 采用汉语无性别标记的“……的人”，并省略后续代词。
  alternative: 使用“他”，或改用复数“他们”。
  rationale: 希腊文阳性单数在此具有代表性；现代汉语可凭“……的人”忠实保留单数代表意义，无须增添原文并未要求的性别代词，也不必改成复数。
translation_notes:
  register: 采用现代标准普通话，语气简洁、庄重而直接。“站得稳—跌倒”保留原文的站立隐喻及对照；全句不添加具体教义解释。
