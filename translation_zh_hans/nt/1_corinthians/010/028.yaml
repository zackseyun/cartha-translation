  text: ἐὰν δέ τις ὑμῖν εἴπῃ· Τοῦτο ⸀ἱερόθυτόν ἐστιν, μὴ ἐσθίετε δι’ ἐκεῖνον τὸν μηνύσαντα καὶ τὴν ⸀συνείδησιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/028.yaml
  text: But if someone says to you, “This has been offered in sacrifice,” do not eat it, for the sake of the one who informed you and for conscience’ sake.
translation:
  language: zh_hans
  text: 但若有人对你们说：“这是献过祭的食物[a]。”你们就不要吃，为了那位告诉你们的人，也为了良心[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这是祭肉。”希腊文形容词指献作祭物的东西。
    reason: lexical_alternative
  - marker: b
    text: 这里指对方的良心，不是你自己的良心；见下一节。
    reason: cross_reference
lexical_decisions:
- source_word: ἐὰν δέ τις ὑμῖν εἴπῃ
  choice: 但若有人对你们说
  rationale: ἐὰν加虚拟语气提出一种可能情形；τις译为“有人”，保留不定意味；δέ用“但”承接并转折于上文。ὑμῖν为复数，译作“你们”。
- source_word: Τοῦτο ἱερόθυτόν ἐστιν
  choice: 这是献过祭的食物
  rationale: ἱερόθυτος指献作祭物的东西，在本段语境中是食物。译文明确其祭献性质，却不把原词本身没有明说的“偶像”加入正文。“献过祭”也比“祭肉”更直接呈现谓语结构。
- source_word: μὴ ἐσθίετε
  choice: 你们就不要吃
  rationale: μή加现在时命令语气表达禁止；中文从条件句自然承接为“就不要吃”，宾语由前文的食物清楚可知，无须重复。
- source_word: δι’ ἐκεῖνον τὸν μηνύσαντα
  choice: 这是为了那告诉你们的人
  rationale: διά加宾格在此表示因某人而有的顾念；μηνύσαντα指将此事告知或披露的人。“为了”自然表达行为是出于对那人的考虑。
- source_word: καὶ τὴν συνείδησιν
  choice: 也是为了良心
  rationale: 希腊文是简洁的并列表达，中文补出“也是为了”以显明与前句的关系，同时不在正文中提前指明是谁的良心，让下一节作出说明。
theological_decisions:
- issue: τὴν συνείδησιν所指的是谁的良心
  choice: 正文只译“良心”，不提前明说所属者；脚注说明按下一节是对方的良心。
  alternative: 直接译作“也是为了那人的良心”或理解为吃者自己的良心。
  rationale: 本节单独看时名词没有所有格，保留简洁表达可避免过度解释；下一节随即说明“不是指你自己的，而是指别人的”，因此脚注可帮助读者把握上下文，同时保留保罗论述的推进。
- issue: ἱερόθυτος是否应明确译为献给偶像
  choice: 译为“献过祭的食物”，不在正文加入“偶像”。
  alternative: 译为“献给偶像的肉”。
  rationale: 本段大语境涉及偶像祭物，但ἱερόθυτος本身表示献祭之物，并未在这个词中明说对象。正文保持原词范围，避免把语境解释写进词义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“献过祭的食物”兼顾原文词义与本段饮食语境；“这是为了……也是为了……”使希腊文省略式并列在中文中清楚自然。所有脚注标记均置于正文相应位置。
