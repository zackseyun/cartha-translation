  text: τοῦ ⸂κυρίου γὰρ⸃ ἡ γῆ καὶ τὸ πλήρωμα αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/026.yaml
  text: For the earth is the Lord’s[a], and all that fills it.
translation:
  language: zh_hans
  text: 因为大地和其中的一切都属于主。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 引自《诗篇》24:1。较贴近原文形式，也可译作：“大地和充满其中的一切，都是主的。”
    reason: cross_reference
lexical_decisions:
- source_word: κυρίου
  choice: 属于主
  rationale: 希腊文属格 τοῦ κυρίου 表示归属。汉语用“属于主”比直译成“主的”更自然，也清楚表达大地归主所有。
- source_word: γάρ
  choice: 因为
  rationale: γάρ 为上文的论述引入经文根据；“因为”自然保留其解释和论证作用。
- source_word: γῆ
  choice: 大地
  rationale: 此处引自诗篇24:1，γῆ 指整个大地，而非某一片土地；“大地”既有广阔含义，也符合庄重的经文语体。
- source_word: πλήρωμα
  choice: 其中的一切
  rationale: τὸ πλήρωμα αὐτῆς 指充满大地的一切事物。“其中的一切”比生硬的“其丰满”或“其充满”更符合现代汉语，同时保留所指范围的完整性。
- source_word: αὐτῆς
  choice: 其中
  rationale: 阴性代词回指 γῆ；在“其中的一切”中自然表达“大地之中”的关系。
theological_decisions:
- issue: 在具有盟约和神学分量的经文引语中如何翻译 κύριος
  choice: 主
  alternative: 耶和华
  rationale: 保罗的希腊文使用 κύριος，并未在本句直接写出希伯来神名；译作“主”既忠实于新约希腊文本，也保留与诗篇24:1的互文关系，而不把旧约底本的神名形式直接代入正文。
- issue: 归属结构是否可能只修饰“大地”
  choice: 将“大地”和“其中的一切”共同置于“属于主”的范围内
  alternative: “大地属于主，其中也充满万物”
  rationale: 希腊文由并列主语“ἡ γῆ καὶ τὸ πλήρωμα αὐτῆς”共同配合省略的系词及属格谓语，最自然的理解是二者都属于主。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“大地”保留诗篇引语的宏阔语感；“其中的一切”避免生硬照搬“丰满/丰盛”，清楚传达 πλήρωμα 在此指充满大地的万有。
