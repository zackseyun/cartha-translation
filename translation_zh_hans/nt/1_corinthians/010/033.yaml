base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/033.yaml
  text: just as I also please everyone in everything[a], not seeking my own advantage but that of the many[b], so that they may be saved.
translation:
  language: zh_hans
  text: 正如我也在一切事上使众人喜悦[a]，不求自己的益处，而求许多人的益处[b]，好叫他们得救。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡事迁就众人。”原文直译近于“在一切事上使众人喜悦”，表达为他人的益处而作广泛的迁就。
    reason: lexical_alternative
  - marker: b
    text: 或译：“不求自己的好处，而求许多人的好处。”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς κἀγὼ
  choice: 正如我也
  rationale: 保留比较关系和“我也”的强调，承接上文的劝勉，并表明保罗以自身为榜样。
- source_word: πάντα πᾶσιν
  choice: 在一切事上……众人
  rationale: 尽量保留原文“凡事／众人”的广泛范围，同时采用自然的现代汉语语序；不直接套用9:22的不同措辞。
- source_word: ἀρέσκω
  choice: 求……喜悦
  rationale: 表达“使人满意、讨人喜悦”的基本意义；结合下文“不求自己的益处”，这里指为他人的益处而迁就，并非谄媚或无原则地讨好。
- source_word: μὴ ζητῶν
  choice: 不求
  rationale: 现在分词说明保罗行事时的方式或动机；简洁地保留“寻求、谋求”的含义。
- source_word: τὸ ἐμαυτοῦ σύμφορον
  choice: 自己的益处
  rationale: σύμφορον指有益、有利之事；“益处”既自然，也与后面的平行结构相称。
- source_word: ἀλλὰ τὸ τῶν πολλῶν
  choice: 而求许多人的益处
  rationale: 补出原文省略但由上句可知的“求”和“益处”，使汉语清楚；“许多人”保留οἱ πολλοί的措辞，不扩大为“所有人”。
- source_word: ἵνα σωθῶσιν
  choice: 为要使他们可以得救
  rationale: 保留目的含义和“得救”的被动形式，不把施救者在译文中具体化。
theological_decisions:
- issue: σωθῶσιν的范围和意义
  choice: 译作“他们可以得救”，取保罗书信中通常的救恩含义
  alternative: “他们可以得到帮助”或“他们可以获保全”
  rationale: 本段关注为他人的终极益处而行事，且《哥林多前书》中σῴζω常有救恩意义；保留被动表达，不额外说明施救者。
- issue: 保罗“求众人喜悦”的含义
  choice: 保留“喜悦”，由“不求自己的益处，而求许多人的益处”限定为造就他人的迁就
  alternative: 译成“迎合众人”或理解为寻求人的认可
  rationale: ἀρέσκω的基本意义应予保留，但紧随其后的动机说明排除了自利、谄媚和无原则讨好的理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“求众人喜悦”保留原文的张力，并让后半句明确其利他的动机；两个脚注标记均已置于正文对应位置。
