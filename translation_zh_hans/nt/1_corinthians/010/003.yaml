base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/003.yaml
  text: and all ate the same spiritual food[a]
translation:
  language: zh_hans
  text: 也都吃了一样的属灵食物[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“超自然的食物”；这里可能指以色列人在旷野所得的吗哪，并且在上下文中可能带有预表意义。
    reason: 提供 πνευματικόν 的词义替代，并说明可能的旷野背景与预表意味，而不在正文中限定解释。
lexical_decisions:
- source_word: καὶ
  choice: 也
  rationale: 承接上文并补充同一群体共同经历的另一件事；现代汉语中“也”比机械译作“并且”更自然。
- source_word: πάντες
  choice: 都
  rationale: 与承前省略的主语搭配，明确表达全体无一例外，保留原文的普遍性强调。
- source_word: τὸ αὐτὸ
  choice: 一样的
  rationale: 准确表达共同享用同一种食物；在此句中比“相同的”更自然。
- source_word: πνευματικὸν
  choice: 属灵
  rationale: 保留保罗用语的神学张力，既不将其缩窄为“圣灵所赐”，也不直接释作“超自然”。
- source_word: βρῶμα
  choice: 食物
  rationale: 直接、自然地表达泛指的可食之物，并与旷野吗哪的背景相符而不把该解释写入正文。
- source_word: ἔφαγον
  choice: 吃了
  rationale: 以现代汉语完成体自然叙述过去发生的动作。
theological_decisions:
- issue: “属灵食物”在旷野预表语境中的含义
  choice: 正文保留“属灵食物”，不明说是吗哪，也不把圣餐联系写入正文。
  alternative: 可理解为“超自然的食物”“圣灵所赐的食物”，或明确解释为旷野的吗哪及其预表意义。
  rationale: 原文 πνευματικόν 既指向上帝所赐、具有属灵意义的供应，也处于保罗的预表论述中；直译可保留其真实的语义宽度和神学张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“也都吃了”承接上文的共同经历；“属灵”是当代中文基督教语境中通行且简洁的表达，脚注帮助普通读者理解其也可能含有“超自然”的意思。
