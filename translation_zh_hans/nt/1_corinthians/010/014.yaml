  text: Therefore[a], my beloved, flee from idolatry.
translation:
  language: zh_hans
  text: 所以，我所亲爱的，你们要逃避拜偶像[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“偶像崇拜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Διόπερ
  choice: 所以
  rationale: 承接上文并引出结论；“所以”在现代汉语中自然清楚，也保留了推论关系。
- source_word: ἀγαπητοί μου
  choice: 我亲爱的弟兄姊妹
  rationale: 该复数呼语表达保罗对全体信徒的亲爱之情；汉语以“弟兄姊妹”明确指向会众，兼顾温暖语气与自然表达。
- source_word: φεύγετε
  choice: 你们要逃避
  rationale: 现在时主动命令语气，带有迫切而持续远离危险的意味；“要逃避”比“避免”更能传达命令的力度。
- source_word: ἀπὸ
  choice: 逃避……的事
  rationale: ἀπό与φεύγω连用，表示远离所要躲避的对象；汉语用“逃避……的事”形成自然搭配。
- source_word: τῆς εἰδωλολατρίας
  choice: 拜偶像的事
  rationale: εἰδωλολατρία指对偶像的敬拜或相关崇拜行为；“拜偶像的事”通俗自然，并保留其行为与实践层面的广度。
theological_decisions:
- issue: 禁令的范围
  choice: 直接命令信徒远离拜偶像及其相关实践
  alternative: 仅警告人不可在内心敬奉偶像
  rationale: 上下文涉及参与异教祭祀筵席及相关礼仪；原词所指不限于内心态度。译文保持概括性，不把禁令缩窄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我亲爱的弟兄姊妹”传达亲切的会众称呼；“逃避”保留命令的迫切力度。脚注提供较抽象、术语化的对应表达。
