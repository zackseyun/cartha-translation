  text: πᾶν τὸ ἐν μακέλλῳ πωλούμενον ἐσθίετε μηδὲν ἀνακρίνοντες διὰ τὴν συνείδησιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/025.yaml
  text: Eat whatever is sold in the meat market[a], asking no questions for the sake of conscience,
translation:
  language: zh_hans
  text: 凡肉市上所卖的，你们只管吃，不要为了良心的缘故查问什么。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶν τὸ ... πωλούμενον
  choice: 所卖的……都
  rationale: 中性单数冠词化短语具有概括性，指一切正在出售之物；用“所卖的……都”自然表达其全面范围。
- source_word: ἐν μακέλλῳ
  choice: 肉市上
  rationale: μάκελλον特指售卖肉类的市场，并非泛指市场；“肉市”准确保留本节与祭偶像之肉相关的具体场景。
- source_word: ἐσθίετε
  choice: 你们都可以吃
  rationale: 这是第二人称复数现在时命令式。在本段许可性的劝告语境中，“可以吃”比生硬的“要吃”更自然，同时仍表达保罗明确的指示；“你们”体现复数。
- source_word: μηδὲν ἀνακρίνοντες
  choice: 不必查问什么
  rationale: ἀνακρίνω可指查问、审查或调查；这里是不追查肉的来源或背景。“不必查问什么”既自然，也保留该词较宽的调查意味。
- source_word: διὰ τὴν συνείδησιν
  choice: 为了良心的缘故
  rationale: διά加宾格在此表示缘由或所顾及的目的。“为了良心的缘故”保留伦理动机，又不擅自说明是谁的良心。
theological_decisions:
- issue: “良心”的所指
  choice: 只译作“良心”，不加“你们的”或“别人的”
  alternative: “你们的良心”或“别人的良心”
  rationale: 希腊文本仅用定冠词说“良心”，本节本身并未明说所指；译文保留这种含混，让下文进一步说明。
- issue: 命令式的语用力量
  choice: 译作许可性指示“都可以吃”
  alternative: 直译为“都要吃”或“都吃吧”
  rationale: 虽然ἐσθίετε在形式上是命令式，但上下文重点是基督徒无需因肉的来源而自我限制，而非强令他们必须吃下市场上的一切；许可性表达更符合汉语语用，又不削弱指示。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“肉市上”具体清楚；分号呈现“可以吃”与“不必查问”两项紧密相连的指示。未设置脚注，因为“查问”已能自然涵盖询问和调查两层意思。
