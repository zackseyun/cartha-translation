  text: μηδὲ πορνεύωμεν, καθώς τινες αὐτῶν ἐπόρνευσαν, καὶ ἔπεσαν μιᾷ ἡμέρᾳ εἴκοσι τρεῖς χιλιάδες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/008.yaml
  text: Nor should we commit sexual immorality[a], as some of them committed sexual immorality[b], and twenty-three thousand fell in one day.
translation:
  language: zh_hans
  text: 我们也不可犯淫乱，像他们中有些人所犯的那样；一天之内就有二万三千人[a]倒下了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《民数记》25:9记载死于那场灾祸的共有二万四千人；保罗这里说一天之内倒下了二万三千人。这可能分别指当天死亡的人数和死亡总数，但本译文保留保罗在此所说的数字，不作强行协调。
    reason: cross_reference
  - marker: b
    text: “倒下”在这里指死亡，也可译作“死了”或“被击杀了”。希腊文直译为“倒下”，这是描述人在审判中死亡的常见说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: 我们也不可
  rationale: μηδέ承接上文一连串劝诫；“也不可”既保留连接作用，也以自然的现代汉语表达劝阻语气。
- source_word: πορνεύωμεν / ἐπόρνευσαν
  choice: 行淫乱的事／所行的
  rationale: πορνεύω泛指从事不合宜的性行为。“行淫乱的事”比“通奸”范围更广，也比音译式或古旧表达更易懂；后半句以“所行的”自然承接，保留原文同词重复所形成的对应。
- source_word: καθώς
  choice: 像……那样
  rationale: 清楚表达保罗将读者可能的行为与旷野世代的行为相比较。
- source_word: τινες αὐτῶν
  choice: 他们中有些人
  rationale: 直接、自然地指以色列旷野世代中的一部分人。
- source_word: ἔπεσαν
  choice: 倒下了
  rationale: 保留πίπτω“倒下”的形象及原文没有明说“死”的措辞；在本处审判语境中，该词指死亡，脚注予以说明。
- source_word: μιᾷ ἡμέρᾳ
  choice: 一天之内
  rationale: 表达限定时段，突出灾祸集中发生于同一天。
- source_word: εἴκοσι τρεῖς χιλιάδες
  choice: 二万三千人
  rationale: 直接依照希腊文本译出人数，不与《民数记》25:9的数字强行协调。
theological_decisions:
- issue: 与《民数记》25:9所载人数的关系
  choice: 正文保留保罗所说的“二万三千人”
  alternative: 改成“二万四千人”，或在正文中将二者解释为当日人数与总人数
  rationale: SBLGNT本文明确作“二万三千”。翻译应如实保留哥林多前书的措辞，不在正文中消解两处经文之间的表面张力；可能的解释仅放入脚注。
- issue: ἔπεσαν在审判语境中的含义
  choice: 正文译作“倒下了”，脚注说明这里指死亡
  alternative: 正文直接译作“死了”或“被击杀了”
  rationale: “倒下”保留原文意象与表达上的含蓄，同时脚注让普通读者明白此处所指的实际结果。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“我们也不可”与上下文的劝诫相连；分号保留行为与后果之间的紧密关系。正文不以解释性措辞消除数字差异，也不将πορνεύω缩窄为单指通奸。所有脚注标记均已置于正文相应位置。
