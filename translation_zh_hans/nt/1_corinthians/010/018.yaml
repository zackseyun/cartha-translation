  text: βλέπετε τὸν Ἰσραὴλ κατὰ σάρκα· ⸀οὐχ οἱ ἐσθίοντες τὰς θυσίας κοινωνοὶ τοῦ θυσιαστηρίου εἰσίν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/018.yaml
  text: 'Consider Israel according to the flesh: are not those who eat the sacrifices participants in the altar?[a][b][c]'
translation:
  language: zh_hans
  text: 你们想想那按肉身而论的以色列[a]：那些吃祭物的人，不是有份于祭坛吗？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “按肉身而论的以色列”也可译作“血统上的以色列”或“按天然血统而属以色列的人”。这里的“肉身”不是指“罪性”。
    reason: lexical_alternative
  - marker: b
    text: “有份于祭坛”也可译作“与祭坛相交”或“分享祭坛所代表的祭祀”。
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: 你们想想
  rationale: 这里是复数命令式，要求读者留意并思考保罗所举的例子；“想想”比单指视觉动作的“看”更符合论证语境。
- source_word: τὸν Ἰσραὴλ κατὰ σάρκα
  choice: 那按肉身而论的以色列
  rationale: 保留保罗“肉身”的措辞及其与其他层面之以色列可能形成的张力；本节语境主要指天然血统上的以色列，而不是“罪性”。
- source_word: οἱ ἐσθίοντες τὰς θυσίας
  choice: 那些吃祭物的人
  rationale: 具体保留“吃”的动作；θυσίας在此指献作祭物的东西，译作“祭物”比“牺牲”更自然明确。
- source_word: κοινωνοὶ τοῦ θυσιαστηρίου
  choice: 有份于祭坛
  rationale: κοινωνοί表示实际分享、参与或相交；“有份于”既自然，又保留属格结构所表达的参与关系，不把它窄化为仅与其他敬拜者交往。
- source_word: οὐχ ... εἰσίν;
  choice: 不是……吗？
  rationale: 保留οὐχ引出的反问语气，预期读者作肯定回答。
theological_decisions:
- issue: “按肉身而论的以色列”所指为何
  choice: 正文保留“肉身”，在注释中说明可理解为天然血统上的以色列。
  alternative: 直接译作“血统上的以色列”或“以色列民族”。
  rationale: κατὰ σάρκα在这里最自然地指民族、血统层面的以色列，但直译能保留保罗用语本身的张力，也避免在本节中扩展为关于以色列与教会关系的系统性论断。
- issue: “有份于祭坛”的关系性质
  choice: 译为“有份于祭坛”。
  alternative: “与祭坛相交”或“分享祭坛所代表的祭祀”。
  rationale: 保罗以吃祭物说明参与祭坛所代表的敬拜和祭祀关系；译文应表达真实参与，同时不额外界定这种参与的全部神学内涵。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们想想”体现论证性的命令语气；“按肉身而论”有意保留原文较凝练的保罗式表达，并用脚注帮助普通读者理解。“有份于祭坛”沿用现代汉语宗教语境中清楚且简练的参与表达。
