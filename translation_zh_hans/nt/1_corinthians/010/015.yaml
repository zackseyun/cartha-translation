  text: I speak as to sensible people[b][a]; judge for yourselves what I say.
translation:
  language: zh_hans
  text: 我把你们当作明理的人来讲这话；你们自己判断我所说的吧。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς
  choice: 把……当作
  rationale: 这里表示保罗以听众具有辨别能力的身份向他们说话；此译法自然传达“作为、视为”的关系。
- source_word: φρονίμοις
  choice: 明理的人
  rationale: φρόνιμος侧重实际的明智、审慎和良好判断力。“明理”符合现代汉语表达，又不把含义强化为全面的“智慧”。
- source_word: λέγω
  choice: 说话
  rationale: 在“把你们当作……说话”的结构中，“说话”自然表达保罗对听众发言。
- source_word: κρίνατε
  choice: 判断吧
  rationale: 保留κρίνω在此处作出评断、衡量的命令语气；句末“吧”使现代汉语中的劝令自然，但不削弱其呼吁力度。
- source_word: ὑμεῖς
  choice: 你们自己
  rationale: 原文显式主语带有强调作用，“你们自己”直接保留这种强调，比仅译“你们”更充分。
- source_word: ὅ
  choice: ……的
  rationale: 以汉语关系结构“我所说的”自然表达中性关系代词ὅ所指的内容。
- source_word: φημι
  choice: 我所说的
  rationale: φημί在这里指保罗所陈述的内容；“我所说的”简洁自然，也保留与前句λέγω的词语呼应。
theological_decisions:
- issue: 对听众的修辞性称呼
  choice: 译为“明理的人”，正面但适度地承认他们具备判断能力，不断定这是讽刺，也不表示保罗全面认可他们的行为。
  alternative: 可译“聪明人”或“审慎的人”；也可能把这句话理解为带有反讽。
  rationale: 上下文是在邀请哥林多人评断保罗接下来的论证。原句本身没有明确标示反讽，因此译文保留其修辞张力，不替读者预先裁定。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“我把你们当作明理的人说话”贴近原文句法，同时可为普通读者理解；分号保留两个分句之间紧密的论证关系。
