  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ταῦτα δὲ τύποι ἡμῶν ἐγενήθησαν, εἰς τὸ μὴ εἶναι ἡμᾶς ἐπιθυμητὰς κακῶν, καθὼς κἀκεῖνοι ἐπεθύμησαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/006.yaml
  text: These things became examples for us[a], so that we might not be people who desire evil things, just as they also desired them.
translation:
  language: zh_hans
  text: 这些事成了我们的鉴戒[a]，使我们不贪恋恶事，像他们那样贪恋。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “鉴戒”也可译作“范例”或“模式”；另有人译作“预表”。
    reason: 保留 τύποι 的词义幅度，避免正文用词被误解为唯一可能的含义。
lexical_decisions:
- source_word: Ταῦτα
  choice: 这些事
  rationale: 指前文所述旷野中的事件；“这些事”直接自然，也不加入原文没有的时间副词。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处主要承接并转入说明；汉语句际衔接已足够，硬译“现在”或“但是”会造成不必要的时间感或转折感。
- source_word: τύποι
  choice: 鉴戒
  rationale: 本段着重这些往事对信徒的警示和训诫作用。“鉴戒”比技术性的“预表”更符合语境，同时保留其作为可供参照之模式的含义；其他可能译法见脚注。
- source_word: ἡμῶν
  choice: 我们的
  rationale: 表达这些事对保罗及其读者所组成群体的关联；“我们的鉴戒”是自然的现代汉语。
- source_word: ἐγενήθησαν
  choice: 成了
  rationale: 保留 γίνομαι 所含“成为、起到某种作用”的动态意味，而非仅译为静态的“是”。
- source_word: εἰς τὸ μὴ εἶναι
  choice: 使我们不
  rationale: 以自然汉语表达该结构的目的或结果意味；不强行区分原文在此保留的目的与结果张力。
- source_word: ἐπιθυμητὰς
  choice: 贪恋
  rationale: 该名词直指“渴求者”，汉语若译成“成为贪恋……的人”较生硬；用动词“贪恋”自然地表达持续以恶事为欲求对象的意思。
- source_word: κακῶν
  choice: 恶事
  rationale: 中性复数表示所欲求的恶的事物；“恶事”简洁并保留道德性质。
- source_word: καθὼς κἀκεῖνοι
  choice: 像他们那样
  rationale: 自然表达“正如他们也……”的比较；“他们”指前述旷野世代。
- source_word: ἐπεθύμησαν
  choice: 贪恋
  rationale: 与前面的 ἐπιθυμητάς 使用同一词根，汉译重复“贪恋”以保存原文刻意的词语呼应；无需另补代词宾语。
theological_decisions:
- issue: τύποι 对以色列旷野经历的意义
  choice: 正文译作“鉴戒”
  alternative: “范例”“模式”或“预表”
  rationale: 近处语境强调伦理警告，未要求将其限定为某一套技术性的预表论；“鉴戒”清楚传达保罗劝戒教会的功能，而脚注保留该词较宽的语义范围。
- issue: ἐπιθυμία 词群的强度与范围
  choice: 译作“贪恋”
  alternative: “渴望”“贪求”或“动淫念”
  rationale: 这里是对恶事的广义罪性欲求，并非专指性欲。“贪恋”保留负面道德力度，又不把范围不当地缩窄。
- issue: εἰς τὸ 所表达的目的或结果
  choice: 译作“使我们不”
  alternative: “为要叫我们不”或“结果使我们不”
  rationale: 原结构可带目的并兼有结果意味；正文采用兼容两者的自然表达，不作超出原文的神学定断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“鉴戒”虽较书面，但在现代宗教及一般劝诫语境中仍易懂；句式简洁，并以重复“贪恋”再现希腊文名词与动词之间的词根呼应。
