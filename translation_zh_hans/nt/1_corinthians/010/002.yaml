  text: καὶ πάντες εἰς τὸν Μωϋσῆν ⸀ἐβαπτίσαντο ἐν τῇ νεφέλῃ καὶ ἐν τῇ θαλάσσῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/002.yaml
  text: and all were baptized into Moses in the cloud and in the sea[b][a],
translation:
  language: zh_hans
  text: 并且都在云里、在海里受洗归入摩西[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “归入摩西”也可理解为“与摩西认同”或“归顺摩西”。希腊文直译是“进入摩西”，保留了保罗与洗礼之间的预表性对应。
    reason: alternative_reading
  - marker: b
    text: 这里原文是“在海里”，不是“穿过海”，与“在云里”构成平行。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: 都
  rationale: 承接上文所指的全体以色列人；“都”自然简洁，也保留保罗在上下文中反复强调“全都”的表达。
- source_word: εἰς τὸν Μωϋσῆν
  choice: 归入摩西
  rationale: “归入”保留εἰς所表达的趋向或关系，并维持与基督徒受洗语言的预表性对应；不把这一不寻常的说法直接解释成认同、效忠或接受领导。
- source_word: ἐβαπτίσαντο
  choice: 受洗
  rationale: 中间语态在此用现代汉语惯常的“受洗”表达最自然，也保留βαπτίζω在保罗预表论述中的宗教用语；译作“浸入”可能过度限定具体方式。
- source_word: ἐν τῇ νεφέλῃ
  choice: 在云里
  rationale: 直译ἐν，保留它可能表示范围、凭借或关联的弹性，并再现出埃及记中的云彩意象。
- source_word: ἐν τῇ θαλάσσῃ
  choice: 在海里
  rationale: 保留ἐν，而不改译为“穿过海”；同时保持它与“在云里”的平行结构。
theological_decisions:
- issue: 以色列人“受洗归入摩西”的含义
  choice: 保留“归入摩西”这一预表性、代表性表达，不在正文中进一步解释。
  alternative: 译作“与摩西认同”或“归顺摩西”。
  rationale: 保罗以出埃及经历类比基督徒的洗礼；直陈这种不寻常的关系用语，能保留其神学张力，而不把它限定为领导关系、身份认同或效忠中的任何一种。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在云里、在海里”用顿号形成紧密平行；“受洗归入摩西”沿用现代中文圣经语域，同时有意保留原文不寻常且带张力的表达。
