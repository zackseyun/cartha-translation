  text: Εἴτε οὖν ἐσθίετε εἴτε πίνετε εἴτε τι ποιεῖτε, πάντα εἰς δόξαν θεοῦ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/031.yaml
  text: Therefore, whether you eat or drink, or whatever you do, do everything for the glory of God.
translation:
  language: zh_hans
  text: 所以，你们无论是吃，是喝，还是做什么，都要为上帝的荣耀而做。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἴτε ... εἴτε ... εἴτε
  choice: 无论……或……，无论……
  rationale: 这一组关联词列举不同情形。中文用“无论……或……，无论……”既自然，也保留原文层层展开的修辞结构。
- source_word: οὖν
  choice: 所以
  rationale: οὖν 表明本句是从上文讨论得出的结论；“所以”在现代汉语中清楚、自然，又符合劝勉语气。
- source_word: ἐσθίετε
  choice: 吃
  rationale: 此处现在时表达一般性、经常性的行为，并非特指正在吃；中文简单动词“吃”恰当传达这种泛指。
- source_word: πίνετε
  choice: 喝
  rationale: 与“吃”平行，表达一般性行为；“喝”简洁自然。
- source_word: τι
  choice: 什么
  rationale: 在“无论做什么”这一结构中，不定代词扩大了范围，涵盖吃喝之外的任何行动。
- source_word: ποιεῖτε
  choice: 做／而做
  rationale: ποιέω 含义宽泛，指各种行动。前一处译为“做什么”，后一处在劝勉句中译为“而做”，自然地保留共同的语义核心。
- source_word: πάντα
  choice: 一切
  rationale: 该中性复数具有全面涵盖的意思。“一切”在现代中文中庄重自然，并与前面的“无论做什么”相呼应。
- source_word: εἰς δόξαν
  choice: 为荣耀
  rationale: εἰς 在这里表示行动的目的或指向。“为荣耀上帝”清楚表达使上帝得荣耀这一目标。
- source_word: θεοῦ
  choice: 上帝
  rationale: 属格与 δόξαν 组成“上帝的荣耀”这一关系；因中文目的结构采用“为荣耀上帝”，将属格关系自然地转化为动宾表达，而不改变意义。
theological_decisions:
- issue: 保罗劝勉的范围
  choice: 本句提出普遍性的伦理原则：包括日常行为在内的一切行动都应以荣耀上帝为目的。
  alternative: 这项吩咐仅限于饮食问题。
  rationale: 本句虽承接关于饮食的具体讨论，却从“吃或喝”推进到“无论做什么”和“一切”，显示其原则超越眼前争议，同时仍扎根于该语境。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“为荣耀上帝而做”比“为上帝的荣耀而做”更直接地表达行动使上帝得荣耀的目的，也避免将“荣耀”误解为上帝所拥有的一项抽象属性。
