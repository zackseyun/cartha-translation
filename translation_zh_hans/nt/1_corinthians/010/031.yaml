  source_fidelity: 草案整体准确传达了οὖν的推论关系、吃喝与其他行为的扩展，以及以神的荣耀为行动目标。可是“为荣耀上帝而做”将“上帝的荣耀”（δόξαν θεοῦ）的属格结构改写为“荣耀上帝”的动宾结构；二者含义密切，但前者更直接对应原文，也更能保留原文的措辞。
  naturalness: “无论吃或喝，无论做什么”可以理解，但“无论是吃，是喝，还是做什么”更符合现代汉语中三项关联选择的自然节奏。“都要为上帝的荣耀而做”庄重、通顺，并避免“一切都要……而做”与“无论做什么”的轻微重复负担。
  terminology: “上帝”及“荣耀”均合适；建议固定为“上帝的荣耀”，以准确表达δόξαν θεοῦ，而不把名词性短语转为动宾短语。
