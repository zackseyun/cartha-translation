  text: τὸ ποτήριον τῆς εὐλογίας ὃ εὐλογοῦμεν, οὐχὶ κοινωνία ⸂ἐστὶν τοῦ αἵματος τοῦ Χριστοῦ⸃; τὸν ἄρτον ὃν κλῶμεν, οὐχὶ κοινωνία τοῦ σώματος τοῦ Χριστοῦ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/016.yaml
  text: The cup of blessing that we bless—is it not a sharing in the blood of Messiah? The bread that we break—is it not a sharing in the body of Messiah?[a][b]
translation:
  language: zh_hans
  text: 我们所祝福的福杯，岂不是有分于弥赛亚的血吗？我们所掰开的饼，岂不是有分于弥赛亚的身体吗？[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有分于”也可译作“同享”或“参与”；传统上也常译作“相交”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文为“Χριστοῦ”，意为“弥赛亚（受膏者）的”；传统译作“基督的”。
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ ποτήριον τῆς εὐλογίας
  choice: 福杯
  rationale: “福杯”自然凝练地表达“祝福之杯”，保留 εὐλογία 的祝福含义及其礼仪背景；不是将其具体化为“感恩之杯”。
- source_word: ὃ εὐλογοῦμεν
  choice: 我们所祝福的
  rationale: 保留 εὐλογία 与 εὐλογοῦμεν 的词根呼应，也不把动作单一解释为“感谢”。
- source_word: οὐχὶ
  choice: 不是……吗
  rationale: 保留期待肯定回答的反问形式和语气。
- source_word: κοινωνία
  choice: 同享
  rationale: 表达共同有分、参与其中的含义，比单纯的“交谊”更符合本句，同时避免以某种后期圣礼术语预断其具体方式。
- source_word: τοῦ αἵματος
  choice: ……的血
  rationale: 直接保留其献祭及立约意涵，不作解释性扩写。
- source_word: τοῦ Χριστοῦ
  choice: 弥赛亚的
  rationale: 此处 Χριστός 仍具有称号功能；“弥赛亚”呈现“受膏者”的头衔意义。传统译法“基督”列入脚注。
- source_word: τὸν ἄρτον
  choice: 饼
  rationale: “饼”是圣经语境中自然而准确的表达；本节本身不要求具体译为“一块饼”或“一个饼”。
- source_word: ὃν κλῶμεν
  choice: 我们所擘开的
  rationale: “擘开”准确保留具体动作，也符合现代中文圣经语体而不过分古奥。
- source_word: τοῦ σώματος
  choice: ……的身体
  rationale: 直接呈现原文，保留其圣餐和基督论张力，不限定参与的具体方式。
theological_decisions:
- issue: 圣餐语境中的 κοινωνία
  choice: 同享
  alternative: 一同有分；参与；相通
  rationale: “同享”兼具共同参与和真实有分的意味，既不削弱为单纯纪念或社交团契，也不规定弥赛亚临在的具体方式。
- issue: Χριστός 的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 在“弥赛亚的血／身体”中，称号意义仍然可辨，因此正文采用“弥赛亚”；同时以脚注保留中文教会传统所熟悉的“基督”。
- issue: 血与身体的关系
  choice: 保留“同享……的血／身体”的直接措辞
  alternative: 解释为象征、领受功效或实体临在
  rationale: 原文断言 κοινωνία，却未在本节说明这种参与的机制；译文因此保留其真实参与的力度和神学张力，不替任何宗派作进一步界定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“福杯”与“擘开”保留熟悉的经文语感；两个平行反问句严格对应原文结构。脚注标记均置于正文末尾。
