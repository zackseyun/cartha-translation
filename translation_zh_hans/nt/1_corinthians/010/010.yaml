  text: μηδὲ γογγύζετε, ⸀καθάπερ τινὲς αὐτῶν ἐγόγγυσαν, καὶ ἀπώλοντο ὑπὸ τοῦ ὀλοθρευτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/010.yaml
  text: And do not grumble[a], just as some of them grumbled and were destroyed by the destroyer.
translation:
  language: zh_hans
  text: 也不要发怨言，正如他们中有些人曾发怨言，被那毁灭者[a]毁灭了一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那施行毁灭的天使。”希腊文直译为“那毁灭者”，可能暗指以色列人在旷野受审判时施行毁灭的使者。
    reason: alternative_reading
lexical_decisions:
- source_word: μηδὲ
  choice: 也不要
  rationale: 承接上文一连串的禁令，以现代汉语自然表达其连接和禁止作用。
- source_word: γογγύζετε / ἐγόγγυσαν
  choice: 发怨言 / 发了怨言
  rationale: 表达因不满而抱怨的含义，并在命令与历史事例之间保留词语呼应。
- source_word: καθάπερ
  choice: 像
  rationale: 自然地引出以色列人的反面先例，保留比较和警戒意味。
- source_word: τινὲς αὐτῶν
  choice: 他们中有些人
  rationale: 准确体现部分关系，所指为上文提到的以色列人。
- source_word: ἀπώλοντο
  choice: 被……毁灭了
  rationale: 结合随后的施事短语，用被动表达外在毁灭者所施行的结果。
- source_word: ὑπὸ τοῦ ὀλοθρευτοῦ
  choice: 被那毁灭者
  rationale: 按希腊文保留实体化称号“毁灭者”，不在正文中进一步认定其身份。
theological_decisions:
- issue: ὁ ὀλοθρευτής的身份
  choice: 那毁灭者
  alternative: 施行毁灭的天使
  rationale: 原文只以“毁灭者”称呼该施事者，并未明确说是天使；正文保留这种未确定性，将较具体的理解列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“发怨言”比“喃喃抱怨”简洁，比传统的“发怨语”自然；重复“发怨言”和“毁灭”以保留原文的词汇呼应与警告力度。
