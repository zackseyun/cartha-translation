id: 1CO.10.1
reference: 1 Corinthians 10:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Οὐ θέλω ⸀γὰρ ὑμᾶς ἀγνοεῖν, ἀδελφοί, ὅτι οἱ πατέρες ἡμῶν πάντες ὑπὸ τὴν νεφέλην ἦσαν καὶ πάντες διὰ τῆς θαλάσσης διῆλθον,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/001.yaml
  text: For I do not want you to be unaware[a], brothers, that our fathers were all under the cloud, and all passed through the sea,
translation:
  language: zh_hans
  text: 弟兄们[a]，我不愿意你们不知道这件事：我们的先祖都曾在云下，也都从海中经过。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为“弟兄们”；这里可指包括姊妹在内的全体信徒。
    reason: 说明阳性复数称呼在混合会众中的代表性用法。
lexical_decisions:
- source_word: Οὐ θέλω ... ἀγνοεῖν
  choice: 我不愿意你们不知道
  rationale: 保留原文“愿意”加否定“不知道”的保罗式表达，同时采用自然、清楚的现代汉语；没有改写成较顺畅却削弱原文形式的“我要你们知道”。
- source_word: γὰρ
  choice: 由本句承接上文的解释关系表达
  rationale: γὰρ说明本句与上文的解释性联系。现代汉语若在此机械加入“因为”，容易形成悬空的从句，因此不另加生硬的连接词，而由语序和上下文承载其衔接功能。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留原文阳性复数的称呼形式；在这里它面向整个会众，包括姊妹，这一点以脚注说明。
- source_word: οἱ πατέρες ἡμῶν
  choice: 我们的先祖
  rationale: “先祖”既保留家族与历史上的承继关系，也比“我们的父亲们”更符合现代汉语，表达保罗把哥林多信徒纳入以色列历史叙事的修辞。
- source_word: πάντες
  choice: 都……也都
  rationale: 原文两次重复πάντες，强调所有人共同经历这些事；译文用两个“都”保留这一反复和强调。
- source_word: ὑπὸ τὴν νεφέλην ἦσαν
  choice: 都曾在云下
  rationale: 按原文保留“在云下”的空间意象，并以“曾”自然标明所述为出埃及时期的历史经历。
- source_word: διὰ τῆς θαλάσσης διῆλθον
  choice: 都从海中经过
  rationale: “从海中经过”准确表达διά与διέρχομαι所表示的穿行，保留出埃及的图景而不作额外解释。
theological_decisions:
- issue: ἀδελφοί在包含男女的教会群体中的称呼范围
  choice: 正文译作“弟兄们”，脚注说明可包括姊妹
  alternative: 弟兄姊妹们
  rationale: 正文保留原文阳性复数的形式，同时不使读者误以为保罗只对男性说话。
- issue: 外邦信徒占相当比例的教会与以色列历史在“我们的先祖”中的共同认同
  choice: 我们的先祖
  alternative: 以色列人的祖先
  rationale: “我们的”保留保罗有意建立的共同体认同，不把所指仅客观化为另一个群体的历史；“先祖”则自然表达πατέρες的祖辈含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“不知道这件事”使否定表达在汉语中完整自然；冒号清楚引出保罗不愿读者忽略的内容。
