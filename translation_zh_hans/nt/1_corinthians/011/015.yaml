base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/015.yaml
  text: But if a woman has long hair[a], it is her glory[b], because her hair has been given to her instead of a covering.
translation:
  language: zh_hans
  text: 但女人[a]若留着长发，这对她是荣耀；因为长发是赐给她作遮盖物的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “女人”也可译作“妻子”；希腊词γυνή须按语境确定含义。
    reason: lexical_alternative
  - marker: b
    text: “作遮盖物”也可译作“代替遮盖物”。这里的希腊介词可表示替代或对应关系；单凭此短语不能断定保罗是说头发本身就是遮盖物，还是说头发与遮盖物具有某种对应关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: 女人
  rationale: γυνή可指“女人”或“妻子”。本节以一般性陈述论及女性，译作“女人”最符合直接语境，同时以脚注保留“妻子”的可能。
- source_word: κομᾷ
  choice: 留长发
  rationale: κομάω表示留着或蓄着长发，并非仅指有头发。“留长发”是自然、准确的现代汉语表达。
- source_word: δόξα
  choice: 荣耀
  rationale: δόξα在此指带来尊荣、光彩之事。“荣耀”既保留原词的修辞力度，也与本段相关用语保持联系。
- source_word: κόμη
  choice: 长发
  rationale: κόμη指头发，常含蓄长或长发的意味。汉语在因果从句中再次译作“长发”，可清楚承接前面的κομᾷ，避免单说“头发”而削弱原意。
- source_word: ἀντί
  choice: 代替
  rationale: ἀντί通常表示替代，也可表达对应或功用关系。正文用“代替”呈现其常见语义，脚注保留“作”的可能，以免过度裁定头发与遮盖物的具体关系。
- source_word: περιβολαίου
  choice: 遮盖物
  rationale: περιβόλαιον泛指披在身上或用于遮盖之物。“遮盖物”比“帕子”或“面纱”宽泛，未加入希腊文没有明确限定的物件种类。
- source_word: δέδοται
  choice: 是赐给她……的
  rationale: 完成时被动语态表示已经赐下并形成现有状态。此结构在现代汉语中自然地保留了被动含义与结果状态。
theological_decisions:
- issue: περιβόλαιον是否应具体译作“帕子”或“面纱”，并由此断定头发本身就是本段所要求的蒙头物。
  choice: 采用宽泛的“遮盖物”，不在正文中裁定它具体指哪一种物件。
  alternative: 帕子；面纱；披巾
  rationale: 该希腊名词本身比“面纱”宽泛。译作“遮盖物”保留词义范围，也避免把有关天然长发与另加遮盖物之关系的特定解释写入正文。
- issue: ἀντί在本句表达严格替代，还是功用或对应关系。
  choice: 正文译作“代替”，脚注说明也可译作“作”。
  alternative: 作遮盖物；与遮盖物相对应
  rationale: “代替”反映ἀντί常见的替代义，但介词在此也可能表达对应或功用。脚注保留这种真实歧义，不据此解决整段关于蒙头的神学争议。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“然而”承接前文对比；重复“长发”使指代清楚。正文保持简洁，脚注承载“女人／妻子”及ἀντί语义范围所形成的真实歧义。
