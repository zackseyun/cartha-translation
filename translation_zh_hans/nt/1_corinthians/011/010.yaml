id: 1CO.11.10
reference: 1 Corinthians 11:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: διὰ τοῦτο ὀφείλει ἡ γυνὴ ἐξουσίαν ἔχειν ἐπὶ τῆς κεφαλῆς διὰ τοὺς ἀγγέλους.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/010.yaml
  text: For this reason the woman ought to have authority on her head[b][a], because of the angels.
translation:
  language: zh_hans
  text: 因此，女人应当在头上有权柄[a]，因为天使的缘故[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较具解释性地译作：“应当在头上戴着权柄的标记。”希腊原文只说“权柄”，并没有明确出现“标记”或“蒙头之物”等词。
    reason: alternative_reading
  - marker: b
    text: “天使”也可译作“使者”，但这里更可能是指天使。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 因此
  rationale: 自然表达由上文推导出的结果，保留原文的推论力度。
- source_word: ὀφείλει
  choice: 应当
  rationale: 表达道德上或合宜性上的义务，不将语气强化为绝对法令。
- source_word: ἡ γυνὴ
  choice: 女人
  rationale: 按上下文保留泛指的单数形式；译作“妻子”会不必要地把范围限于婚姻关系。
- source_word: ἐξουσίαν
  choice: 权柄
  rationale: 原文明确使用“权柄”，并未出现“标记”或“蒙头之物”等词；正文保留这一难解而有张力的措辞。
- source_word: ἔχειν
  choice: 有
  rationale: 直接对应“拥有、具有”，避免把上下文推断的“戴着”写进正文。
- source_word: ἐπὶ τῆς κεφαλῆς
  choice: 在头上
  rationale: 保留介词短语较宽泛的空间含义，不预先判定所指为何物。
- source_word: διὰ τοὺς ἀγγέλους
  choice: 因为天使的缘故
  rationale: διά加宾格在此表示原因；ἄγγελοι通常指天上的使者，但不进一步解释天使为何被提及。
theological_decisions:
- issue: ἐξουσίαν ἔχειν ἐπὶ τῆς κεφαλῆς的含义
  choice: 在头上有权柄
  alternative: 在头上戴着权柄的标记；以蒙头作为权柄的标记
  rationale: 希腊文没有“标记”或“蒙头之物”等词。由于此短语的解释存在争议，正文保留原文的词汇形式，并在脚注列出常见的解释性译法。
- issue: ἀγγέλους的所指
  choice: 天使
  alternative: 使者
  rationale: ἄγγελος虽可指一般使者，但保罗书信中不加限定的复数形式通常指天上的使者；不据此引入有关天使角色的特定理论。
- issue: γυνή的范围
  choice: 女人
  alternative: 妻子
  rationale: 本节置于更广泛的男人与女人论述中，因此不把含义收窄为妻子。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在头上有权柄”在中文中同样显得不寻常，但这是有意保留原文真实的歧义和神学张力；脚注提供必要说明而不替正文作出解释性裁决。
