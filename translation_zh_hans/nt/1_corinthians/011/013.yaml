  yaml_path: translation/nt/1_corinthians/011/013.yaml
  text: 'Judge for yourselves: is it proper for a woman to pray to God with her head uncovered?[a]'
translation:
  language: zh_hans
  text: 你们自己判断吧：女人不蒙头向上帝祷告，合宜吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 若将γυνή按婚姻关系理解，也可译作“妻子”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ὑμῖν αὐτοῖς
  choice: 你们自己
  rationale: 这个短语加强对哥林多人亲自作出判断的呼吁；“你们自己”在现代汉语中自然地保留了反身强调。
- source_word: κρίνατε
  choice: 判断吧
  rationale: 不定过去时命令语气要求听者作出评断；“判断吧”既保留直接命令的力度，也符合汉语劝请语气。
- source_word: πρέπον ἐστὶν
  choice: 合宜吗
  rationale: 该表达询问某事是否得体、适宜；“合宜”简洁庄重，也保留社会礼仪与规范层面的含义。
- source_word: γυναῖκα
  choice: 女人
  rationale: γυνή可指“女人”或“妻子”。本节没有明说丈夫，问题的表述较为泛指，因此正文采用“女人”，并在脚注保留婚姻语境下“妻子”的可能。
- source_word: ἀκατακάλυπτον
  choice: 不蒙着头
  rationale: 该形容词意为“未遮盖的”。上下文谈论头部遮盖，汉语明确补出“头”可自然表达原文在语境中隐含的对象。
- source_word: τῷ θεῷ
  choice: 向上帝
  rationale: προσεύχομαι之后的与格表示祷告所指向的对象；“向上帝”是自然、准确的汉语表达。
- source_word: προσεύχεσθαι
  choice: 祷告
  rationale: 该不定式表示“祷告”，依附于“是否合宜”的问句结构；采用教会内外均易理解且庄重的常用词。
theological_decisions:
- issue: 蒙头讨论中γυνή的含义
  choice: 女人
  alternative: 妻子
  rationale: 本节没有明确提到丈夫，修辞问句也以较一般的方式谈论女性祷告是否合宜。为避免将本节本身未限定的意义缩窄为婚姻关系，正文译作“女人”，同时以脚注保留更广段落语境中“妻子”的可能。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“判断吧”保留使徒直接呼吁的语气；“合宜吗”保留原文修辞问句及其得体、适宜的语义，不进一步断定其依据属于礼俗、伦理或神学规范。
