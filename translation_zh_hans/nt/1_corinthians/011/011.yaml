base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/011.yaml
  text: Nevertheless[a], in the Lord woman is not apart from man, nor man apart from woman.
translation:
  language: zh_hans
  text: 然而，在主里面，女人并非离了男人，男人也并非离了女人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“妻子并非离了丈夫，丈夫也并非离了妻子。”希腊语中的这两个词既可指“女人、男人”，也可指“妻子、丈夫”。这里正文采用较宽泛的译法，因为这句话似乎是在概括男女之间的关系，而不只限于婚姻。
    reason: alternative_reading
lexical_decisions:
- source_word: πλὴν
  choice: 然而
  rationale: 表示对前文论述的转折与平衡；“然而”自然、庄重，并保留让步性语气。
- source_word: γυνή
  choice: 女人
  rationale: 该词既可指“女人”也可指“妻子”；上下文涉及创造、敬拜及男女之间的一般关系，因此正文采用较宽泛的“女人”。
- source_word: ἀνήρ
  choice: 男人
  rationale: 该词既可指“男人”也可指“丈夫”；与 γυνή 对举，并用于概括在主里面的相互关系，故译作“男人”。
- source_word: χωρίς
  choice: 与……分开
  rationale: 表达分离、离开或不相依的关系；此译法保留关系层面的含义，又不额外加入“独立”等较强解释。
- source_word: ἐν κυρίῳ
  choice: 在主里面
  rationale: 保留保罗书信中常见的表达，指向以主为范围或与主联合的关系，同时不强行限定其具体神学层面。
- source_word: οὔτε ... οὔτε
  choice: 不可……也不可……
  rationale: 再现两个彼此平衡的否定分句。结合 χωρίς，中文用“不可与……分开”表达双方并非彼此隔绝；“不可”在此表达关系上的否定，而非单纯发布禁令。
theological_decisions:
- issue: γυνή / ἀνήρ 应译为“女人／男人”还是“妻子／丈夫”
  choice: 女人／男人
  alternative: 妻子／丈夫
  rationale: 紧邻上下文讨论创造与敬拜中的男女关系，本节是关于双方在主里面彼此关联的平衡性概括，不宜将范围预先限定为婚姻；脚注保留婚姻称谓的真实词义可能。
- issue: χωρίς 是否应解释为“不能独立于”
  choice: 不可与……分开
  alternative: 不能独立于……／没有……就不成其为……
  rationale: 原词表达分离或离开，但未明确界定这种相互关系的性质；采用“分开”可避免把经文进一步解释为社会、存在或权柄意义上的依赖。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“在主里面”保留保罗惯用语的神学张力；句式保持两半对称。脚注标记置于正文句末。
