  text: εἰ δέ τις δοκεῖ φιλόνεικος εἶναι, ἡμεῖς τοιαύτην συνήθειαν οὐκ ἔχομεν, οὐδὲ αἱ ἐκκλησίαι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/016.yaml
  text: But if anyone seems to be contentious[a], we have no such custom[b], nor do the churches of God.
translation:
  language: zh_hans
  text: 但若有人显得爱争辩[a]，我们没有这样的惯例[b]，神的众教会也没有。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“喜欢争竞”“好纷争”。
    reason: lexical_alternative
  - marker: b
    text: “这样的惯例”可能指好争辩的作风，也可能指前几节所讨论、引起争议的做法。
    reason: alternative_reading
lexical_decisions:
- source_word: δοκεῖ
  choice: 显得
  rationale: 在与不定式 εἶναι 连用的结构中，可表示“看来、显得”，也可能带有“自认为”的意味。“显得”保留了原文措辞的开放性，没有把它明确解释为主观意愿。
- source_word: φιλόνεικος
  choice: 好争辩
  rationale: 该形容词指喜好争竞、倾向于挑起争论的人。“好争辩”简洁自然，既表达持续的性情倾向，也不过度限定争论的具体形式。
- source_word: τοιαύτην
  choice: 这样的
  rationale: 该指示词表示“这一类、这样的”，向前指涉，却没有明确说明所指究竟是争辩的作风还是前文讨论的做法。
- source_word: συνήθειαν
  choice: 惯例
  rationale: 该词可指习惯、惯常做法或共同体中通行的规例。“惯例”适合群体语境，也保留其所指对象的不确定性。
- source_word: οὐκ ἔχομεν
  choice: 我们没有
  rationale: 直接对应原文“我们不具有”，避免增译为“我们不准许”或“我们不遵行”等较强的解释。
- source_word: ἐκκλησίαι τοῦ θεοῦ
  choice: 神的众教会
  rationale: 保留属格关系和复数形式，表达各地属于神的会众；“众教会”在庄重的现代汉语经文中简洁清楚。
theological_decisions:
- issue: “没有这样的惯例”所指为何
  choice: 译文保留“这样的惯例”这一宽泛表达，不明确指定其所指。
  alternative: 可理解为没有好争辩的惯例；也可理解为神的教会没有前文争议中某一方所主张的做法。
  rationale: τοιαύτην συνήθειαν 在句法上简略，语境中的指涉存在真实争议。正文不替读者消除这一歧义，并用脚注说明两种主要理解。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“但若”承接前文并保持经文语体；“显得好争辩”较贴近原文结构，同时不把 δοκεῖ 明确解释成“想要”或“执意”。所有脚注标记均已置于正文相应位置。
