  yaml_path: translation/nt/1_corinthians/011/004.yaml
  text: Every man who prays or prophesies with something on his head dishonors his head[a][b].
translation:
  language: zh_hans
  text: 凡祷告或说预言时头上有遮盖的男人，都羞辱自己的头[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“蒙着头。”原文直译近于“有东西在头上／从头上垂下”，没有说明具体是哪一种遮盖物。
    reason: lexical_alternative
  - marker: b
    text: “自己的头”可以按字面指他身体的头，也可能呼应上下文中关系意义上的“头”。
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ἀνὴρ
  choice: 凡……的男人
  rationale: ἀνήρ可指“男人”或“丈夫”；本节与第5节的“女人”相对，采用泛指男性且较少附加解释的“男人”。
- source_word: προσευχόμενος
  choice: 祷告
  rationale: 现在分词描写正在从事祷告；汉语用“凡……的”结构自然表达。
- source_word: προφητεύων
  choice: 说预言
  rationale: 保留“发预言、作先知性宣告”的基本含义；“说预言”对现代普通读者较透明，也不额外界定其具体形式。
- source_word: κατὰ κεφαλῆς ἔχων
  choice: 头上有遮盖
  rationale: 原文直译近于“有东西从头上垂下／在头上”，并未说明具体物件。“有遮盖”表达其语境意义，同时避免擅自指定面纱、帽子或其他物品。
- source_word: καταισχύνει
  choice: 羞辱
  rationale: 该动词表示使蒙羞、使失去尊荣；“羞辱”能自然呈现本段的荣辱语境。
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: 自己的头
  rationale: 按字面保留“头”，既可首先指身体的头，也可能呼应第3节关系意义上的“头”；不在正文中消解这种双关或张力。
theological_decisions:
- issue: 末句κεφαλή应明确解释为身体的头，还是关系意义上的“头”
  choice: 以“自己的头”保留歧义
  alternative: 明确译作“他身体的头”或“那位作他头的”
  rationale: 原文容许身体部位与上下文中关系性“头”的修辞呼应；正文不应替读者排除其中一种可能。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“凡……若……”保持格言式陈述的概括性；“遮盖”不具体化物件；两处“头”保留原文的重复及可能的修辞关联。
