  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: δεῖ γὰρ καὶ αἱρέσεις ἐν ὑμῖν εἶναι, ἵνα ⸀καὶ οἱ δόκιμοι φανεροὶ γένωνται ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/019.yaml
  text: For there must also be factions among you[b][a], so that those who are approved may also become evident among you.
translation:
  language: zh_hans
  text: 因为你们中间也必有派系[a]，好让那些经受考验而得到认可的人[b]也在你们中间显明出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“分党”“分裂”或“宗派”；这个词在后来的用法中也可指“异端”。这里最可能是指会众内部结成彼此对立的派系。
    reason: lexical_alternative
  - marker: b
    text: “经受考验而得到认可的人”也可译作“经得起考验的人”或“被证实为真实可靠的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: 必有
  rationale: 表达原文的强烈必要性，同时不说明这种必要性究竟出于上帝的安排、现实中的不可避免，还是兼有二者。
- source_word: γὰρ
  choice: 因为
  rationale: 保留本句对上文的解释关系，符合现代汉语表达。
- source_word: καὶ αἱρέσεις
  choice: 也有派系
  rationale: 本段语境所指主要是会众内部结党分派，而不是后世专指教义错误的“异端”。“派系”能自然表达群体内部的阵营分化。
- source_word: ἐν ὑμῖν
  choice: 在你们中间
  rationale: 自然表达这些派系存在于哥林多信徒群体内部，并保留原文首尾重复的群体范围。
- source_word: ἵνα
  choice: 好让
  rationale: 保留目的与结果之间未被明确限定的关系，不强行判定为纯粹目的或纯粹结果。
- source_word: καὶ οἱ δόκιμοι
  choice: 那些经受考验而得到认可的人也
  rationale: δόκιμοι 指经过检验后被证实可靠、得到认可的人；译文把这种“受验而获认可”的含义明确表达出来，并以“也”对应第二个 καί。
- source_word: φανεροὶ γένωνται
  choice: 显明出来
  rationale: 既表达从不明显到公开可见的过程，也保持庄重而自然的现代汉语。
theological_decisions:
- issue: αἱρέσεις 的含义
  choice: 派系
  alternative: 分裂、宗派、异端
  rationale: 上下文讨论哥林多会众内部的结党与分裂，原词在这里不必带有后来“教义异端”的专门含义，因此不把后世神学术语倒置进经文。
- issue: δεῖ 所表达的必要性
  choice: 必有
  alternative: 必须有、免不了会有
  rationale: 原文断言其必要性，却没有明说这是神圣旨意、现实中的必然，还是两者兼有。“必有”保留这一张力，避免把经文译成命令，也避免单纯化为经验判断。
- issue: ἵνα 的目的或结果色彩
  choice: 好让
  alternative: 为要、以致
  rationale: 原文可兼具目的和结果意味；“好让”保留关联而不对其逻辑性质作过度限定。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“必有”简洁保留必要性的力度；“派系”贴合会众内部结党的语境；句末重复“在你们中间”，以保存原文的修辞框架。所有脚注标记均置于对应词语之后。
