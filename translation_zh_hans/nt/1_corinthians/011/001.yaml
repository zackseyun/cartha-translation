id: 1CO.11.1
reference: 1 Corinthians 11:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: μιμηταί μου γίνεσθε, καθὼς κἀγὼ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/001.yaml
  text: Become imitators of me[b][a], just as I also am of the Messiah.
translation:
  language: zh_hans
  text: 你们要成为效法我的人，正如我也效法弥赛亚[a]一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。
    reason: 保留Χριστός的传统汉语译法。
lexical_decisions:
- source_word: μιμηταί
  choice: 效法……的人
  rationale: 该名词指以别人为榜样、仿效其言行的人。“效法……的人”直接保留了仿效之意，又比单说“跟随者”更准确。
- source_word: μου
  choice: 我
  rationale: 属格表示效法的对象；在现代汉语“效法我的人”中自然表达。
- source_word: γίνεσθε
  choice: 要成为
  rationale: 该命令式不仅可表达持续状态，也保留“成为、做起”的动态意味；“要成为”兼顾原文语气和现代汉语表达。
- source_word: καθὼς
  choice: 正如……一样
  rationale: 明确表达保罗与读者之间的类比关系。
- source_word: κἀγὼ
  choice: 我也
  rationale: κἀγώ由καί与ἐγώ合成，“也”保留其附加和对应的强调。
- source_word: Χριστοῦ
  choice: 弥赛亚
  rationale: Χριστός在此指耶稣作为受膏者的身份。“弥赛亚”在现代汉语中可辨识其称号性质；传统译法“基督”列于脚注。
theological_decisions:
- issue: Χριστοῦ作为称号的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处可理解为指耶稣的弥赛亚身份，而不仅是姓名组成部分；正文采用“弥赛亚”，同时以脚注保留传统且广为人知的“基督”。
- issue: 末句省略成分的处理
  choice: 补出“效法”以形成“我也效法弥赛亚”
  alternative: 按形式译作“正如我也是弥赛亚的（效法者）”
  rationale: 希腊文在κἀγὼ Χριστοῦ中省略了由前句可知的μιμητής。汉语若机械保留省略，容易被误解为归属关系；补出“效法”不改变所指，且清楚保留保罗只有在效法弥赛亚这一对应关系中的榜样地位。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“成为效法我的人”保留γίνεσθε与名词μιμηταί的结构和动态意味；后半句为避免汉语歧义，明示原文承前省略的“效法”。
