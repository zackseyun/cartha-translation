id: 1CO.11.9
reference: 1 Corinthians 11:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ γὰρ οὐκ ἐκτίσθη ἀνὴρ διὰ τὴν γυναῖκα, ἀλλὰ γυνὴ διὰ τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/009.yaml
  text: For indeed[a], man was not created for the woman, but woman for the man.
translation:
  language: zh_hans
  text: 因为男人确实不是为女人而创造的，女人却是为男人而创造的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为女人／为男人”也可译作“因女人的缘故／因男人的缘故”。希腊语介词διά加宾格可以表示原因或目的；这里按创造语境译作“为”。
    reason: 说明διά加宾格在原因与目的之间的词义可能，避免正文消除原文的语义张力。
lexical_decisions:
- source_word: καὶ γὰρ
  choice: 因为……确实
  rationale: γάρ承接并说明上一节的论证，译作“因为”；καί在此略带强调，以“确实”自然表达，避免生硬直译为“并且因为”。
- source_word: ἐκτίσθη
  choice: 被创造／创造的
  rationale: κτίζω的通常含义是“创造”。中文采用“为……而创造的”这一被动结构，既忠实于希腊语，也切合保罗诉诸创造叙事的语境。
- source_word: ἀνὴρ / γυνὴ
  choice: 男人／女人
  rationale: 两词虽可按语境指“丈夫／妻子”，但本句明确谈到“创造”，指向《创世记》的男女受造叙事，因此采用范围较广的“男人／女人”，不把论述限于婚姻身份。
- source_word: διὰ τὴν γυναῖκα / διὰ τὸν ἄνδρα
  choice: 为女人／为男人
  rationale: διά加宾格可表达原因、目的或所关涉的对象。这里的创造论证较自然地指向目的或取向，简洁的“为”保留一定语义空间；脚注说明可能的原因性理解。
- source_word: ἀλλὰ
  choice: 却
  rationale: 表达前后两个平行分句之间的鲜明转折；中文用“却”比机械重复“而是”更自然，同时不改变对比关系。
theological_decisions:
- issue: ἀνήρ与γυνή应译为“男人／女人”还是“丈夫／妻子”
  choice: 男人／女人
  alternative: 丈夫／妻子
  rationale: “被创造”使本句直接指向创造叙事，因此保留一般性的男女指称较为稳妥；译作“丈夫／妻子”会把原文可能具有的受造范围预先收窄为婚姻关系。
- issue: διά在两个平行短语中应突出目的还是原因
  choice: 正文译作“为”，并用脚注保留原因性可能
  alternative: 因女人的缘故／因男人的缘故
  rationale: 创造语境使目的或取向的理解自然，但διά加宾格本身容许原因含义。正文不把关系细化为“为了服事”或其他神学结论，以免超出原文。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“因为……确实”兼顾解释性连接与轻微强调；两个分句保持对称，第二句自然省去重复的被动标记，但补出中文所需的“创造的”。
