  text: But if we judged ourselves[a], we would not be judged.
translation:
  language: zh_hans
  text: 但我们若审察自己[a]，就不会受审判。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“判断自己”或“分辨自己”。希腊语动词可指审察、分辨或作出判断；正文译作“审察”，以表达自我省察、评断之意，并保留它与后半句“受审判”的语义呼应。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: 但……若
  rationale: εἰ引出条件，δὲ表示与上文的轻微转折；“但……若”在现代汉语中自然地保留两者。
- source_word: ἑαυτοὺς
  choice: 自己
  rationale: 这是复数反身代词的宾格，在“我们”之后用“自己”最符合现代汉语习惯。
- source_word: διεκρίνομεν
  choice: 判断
  rationale: διακρίνω在这里可指分辨、察验或作出判断；译作“判断”既保留自我评断之意，也与后句κρίνω形成可感知的呼应。
- source_word: οὐκ ἂν
  choice: 就不会
  rationale: 与未完成时态配合，构成非现实条件句的结果部分；“就不会”自然表达这一条件关系。
- source_word: ἐκρινόμεθα
  choice: 受审判
  rationale: 被动态κρίνω表示受到判断或审判。译作“受审判”保留与前句的词义联系，又不强化为最终的“定罪”。
theological_decisions:
- issue: 后半句是指最终定罪，还是主的审判与管教
  choice: 不明说审判的终极性质，译作“受审判”
  alternative: 译作“被定罪”或明确译为“受主的管教性审判”
  rationale: 紧接着的11:32将主的审判和世人的定罪加以区分。本节不宜把ἐκρινόμεθα强化为“被定罪”，也不应在正文中添加原文未明说的解释；“受审判”保留上下文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“判断自己”略带刻意的措辞呼应，旨在呈现原文διακρίνω与κρίνω之间的语义关联；脚注补充自然可行的其他译法。
