  naturalness: “就是吃喝对自己的审判”不符合自然的现代汉语搭配，容易造成句法理解困难。改为“就是吃喝，使自己受审判”保留原文“吃、喝”重复，同时清楚表达该人招致审判。
  terminology: “审判”“分辨”“身体”均适切。“身体”应避免译成“这身体”，以免不必要地限定或强化指称。脚注b宜说明“分辨”的另一种可能译法及“身体”的两种主要语境指向，但不应把其中一种解释写成正文含义。
  issues:
