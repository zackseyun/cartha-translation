  text: ὁ γὰρ ἐσθίων καὶ ⸀πίνων κρίμα ἑαυτῷ ἐσθίει καὶ πίνει μὴ διακρίνων τὸ ⸀σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/029.yaml
  text: For the one who eats and drinks eats and drinks judgment on himself[b][a], not discerning the body.
translation:
  language: zh_hans
  text: 因为那吃喝的人，不分辨身体[a]而吃喝，就是吃喝，使自己受审判。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“主的身体”，而不是“身体”。
    reason: textual_variant
  - marker: b
    text: “分辨”也可译作“区别对待”。这里可能指认清主餐的意义、辨认聚集的信徒群体（作为基督的身体），或兼指二者。
    reason: alternative_reading
lexical_decisions:
- source_word: κρίμα
  choice: 审判
  rationale: κρίμα指司法性的判决或审判；本段下文谈到主的管教，并与“同世人一起被定罪”相区别，因此不译作含义更强的“定罪”。
- source_word: ἑαυτῷ
  choice: 对自己
  rationale: 反身代词的与格表明，这人使自己招致审判；“对自己的审判”在现代汉语中清楚表达其不利后果。
- source_word: διακρίνων
  choice: 分辨
  rationale: 该词可指作出区别、辨明或正确评断；“分辨”保留其认知和道德分量，同时不限定具体如何理解“身体”。
- source_word: τὸ σῶμα
  choice: 这身体
  rationale: 所据希腊文本只作“身体”，没有“主的”；指示成分由希腊冠词在语境中的特指功能体现。“这身体”既自然指向圣餐语境，又保留它可能指基督的身体、信徒群体或兼指二者的张力。
- source_word: ὁ ... ἐσθίων καὶ πίνων
  choice: 那吃喝的人
  rationale: 将名词化的单数分词译为泛指的人，贴近希腊结构，也符合庄重而自然的现代汉语。
- source_word: μὴ διακρίνων
  choice: 若不分辨
  rationale: 希腊语否定分词说明招致审判的情形；用条件式汉语自然呈现其逻辑关联，但不改变其因由性质。
theological_decisions:
- issue: “身体”的所指
  choice: 正文保留“这身体”，不明定是基督在圣餐中的身体、作为基督身体的信徒群体，还是兼指二者。
  alternative: 主的身体；信徒组成的身体
  rationale: 希腊正文仅为τὸ σῶμα。本章语境同时涉及主的晚餐和哥林多人对群体成员的轻慢，因此不应在译文中消除原有的神学张力。
- issue: κρίμα的力度
  choice: 审判
  alternative: 定罪
  rationale: 第32节将信徒所受的管教与随世人被定罪区分开来；“审判”既忠实于词义，也避免暗示这里必然指最终沉沦。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“吃喝对自己的审判”有意保留原文“吃、喝”的重复修辞；脚注标记均置于正文相关句末。
