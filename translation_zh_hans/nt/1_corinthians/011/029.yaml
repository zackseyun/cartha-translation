revisions:
- from: 因为那吃喝的人，若不分辨这身体，就是吃喝对自己的审判。[a][b]
  to: 因为那吃喝的人，不分辨身体[a]而吃喝，就是吃喝，使自己受审判。[b]
  rationale: 修订仅解决汉语句法并移除“这”所带来的额外指示性。“不分辨身体而吃喝”自然表达否定分词所说明的伴随情形；“吃喝，使自己受审判”对应“吃喝审判归给自己”，同时保留原文重复的修辞。正文继续不界定“身体”的所指，文本异读和主要解释可能性均在脚注中保留。
