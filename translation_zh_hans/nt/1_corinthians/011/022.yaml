  text: μὴ γὰρ οἰκίας οὐκ ἔχετε εἰς τὸ ἐσθίειν καὶ πίνειν; ἢ τῆς ἐκκλησίας τοῦ θεοῦ καταφρονεῖτε, καὶ καταισχύνετε τοὺς μὴ ἔχοντας; τί ⸂εἴπω ὑμῖν⸃; ἐπαινέσω ὑμᾶς; ἐν τούτῳ οὐκ ἐπαινῶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/022.yaml
  text: For do you not have houses for eating and drinking? Or do you despise the church of God and shame those who have nothing? What should I say to you? Should I praise you? In this I do not praise you[a].
translation:
  language: zh_hans
  text: 难道你们没有家可以吃喝吗？还是你们藐视上帝的教会，使那些一无所有的人蒙羞？我该对你们说什么呢？该称赞你们吗？在这件事上，我不称赞你们[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一无所有的人”也可译作“穷人”或“没有食物的人”；希腊文直译为“那些没有的人”，所缺何物未明说。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκίας
  choice: 自己的家
  rationale: 指私人居所，与聚集的上帝教会形成对照；加入“自己的”自然表达希腊文问句所隐含的对比，但不改变所指。
- source_word: εἰς τὸ ἐσθίειν καὶ πίνειν
  choice: 可以在那里吃喝
  rationale: 保留目的含义，并以自然现代汉语说明家是可供吃喝的地方。
- source_word: ἐκκλησίας τοῦ θεοῦ
  choice: 上帝的教会
  rationale: 指属于上帝、聚集在一起的信徒群体；“教会”是保罗书信中清楚且通行的译法，同时不将其过度制度化。
- source_word: καταφρονεῖτε
  choice: 藐视
  rationale: 表达把某对象看得无足轻重、以轻蔑态度对待的强烈责备。
- source_word: καταισχύνετε
  choice: 使……蒙羞
  rationale: 直接传达使人感到羞耻或受到羞辱的致使意义。
- source_word: τοὺς μὴ ἔχοντας
  choice: 那些一无所有的人
  rationale: 贴近字面“那些没有的人”，保留其对象未明说的概括性；上下文可使读者理解为缺乏食物或物质资源的人。
- source_word: τί εἴπω ὑμῖν;
  choice: 我该对你们说什么呢？
  rationale: 自然表达商议性虚拟语气所带的反问和责难。
- source_word: ἐπαινέσω ὑμᾶς;
  choice: 该称赞你们吗？
  rationale: 保留商议性反问及其预期的否定答案。
- source_word: ἐν τούτῳ οὐκ ἐπαινῶ
  choice: 在这件事上，我不称赞你们
  rationale: “这件事”明确指向当前所论行为，并与前一句重复“称赞”，保留原文修辞呼应。
theological_decisions:
- issue: 主餐语境中“那些没有的人”的具体所指
  choice: 主文译作“那些一无所有的人”
  alternative: “穷人”或“没有食物的人”
  rationale: 上下文强烈指向物质匮乏的信徒，但希腊文本身只说“那些没有的人”。主文保留这一概括性，不将其限定为特定社会身份或仅仅缺少食物。
translation_notes:
  register: 采用现代、庄重而口语可懂的普通话。连续反问保留保罗责备的力度；“称赞”前后重复，以反映原文的修辞结构。
