  text: ὁσάκις γὰρ ⸀ἐὰν ἐσθίητε τὸν ἄρτον τοῦτον καὶ τὸ ⸀ποτήριον πίνητε, τὸν θάνατον τοῦ κυρίου καταγγέλλετε, ἄχρι ⸀οὗ ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/026.yaml
  text: For as often as you eat this bread and drink the cup[b][a], you proclaim the Lord’s death until he comes.
translation:
  language: zh_hans
  text: 因为你们每逢吃这饼、喝这杯[a]，就宣告主的死，直到他来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为定指的“那杯／该杯”；本节没有“这”字，但上下文明确所指的是哪一杯。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁσάκις ... ἐὰν
  choice: 每逢
  rationale: 表示不定而反复发生的情形，即每一次这样行的时候；“每逢”在现代汉语中自然且保留反复义。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文，为此前的吩咐提供解释；“因为”清楚呈现其说明性关系。
- source_word: ἐσθίητε
  choice: 吃
  rationale: 在不定时间从句中，希腊语现在时虚拟式表达反复发生的行动，汉语用普通动词即可自然传达。
- source_word: τὸν ἄρτον τοῦτον
  choice: 这饼
  rationale: 保留指示词“这”；ἄρτος在此指所吃的饼，“饼”符合中文圣餐语境，也简洁自然。
- source_word: τὸ ποτήριον
  choice: 这杯
  rationale: 原文直译是“那杯／这杯所指的杯”，本节没有指示词，但定冠词结合紧邻上文明确指向刚提到的杯；正文采用自然汉语“这杯”，并以脚注注明形式上的差异。
- source_word: καταγγέλλετε
  choice: 宣告
  rationale: 表达公开宣扬、传告之意；“宣告”保留正式而明确的陈述力度，不额外解释其方式。
- source_word: τὸν θάνατον τοῦ κυρίου
  choice: 主的死
  rationale: 直接保留属格关系及庄重、凝练的表达。
- source_word: κυρίου
  choice: 主
  rationale: 符合保罗书信语境中κύριος的通常译法，并自然指向耶稣。
- source_word: ἄχρι οὗ ἔλθῃ
  choice: 直到他来
  rationale: 表达这一宣告持续到某一时间界限；隐含主语由紧邻的“主”自然补出。
theological_decisions:
- issue: ἄχρι οὗ ἔλθῃ中隐含主语的所指
  choice: 以“他”指主耶稣
  alternative: 重复译作“直到主来”
  rationale: 前句的“主”是最近且最自然的先行对象；采用“他”既对应原文省略主语的简洁性，也不增加额外教义说明。
- issue: 圣餐相关措辞
  choice: 直接陈述吃饼、喝杯是在宣告主的死
  alternative: 加入更圣礼化或纯纪念论式的解释
  rationale: 经文本身说明这一行动宣告主的死，却未在本节完整界定圣餐神学；译文保留这一陈述，不向任何宗派立场扩展。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“每逢……就是……”自然呈现反复行动与其意义之间的关系；保留“主的死”和“直到他来”的凝练力度。脚注标记已置于正文对应词语之后。
