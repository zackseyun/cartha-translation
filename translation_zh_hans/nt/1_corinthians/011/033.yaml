  text: Ὥστε, ἀδελφοί μου, συνερχόμενοι εἰς τὸ φαγεῖν ἀλλήλους ἐκδέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/033.yaml
  text: So then[a], my brothers, when you come together to eat, wait for one another.
translation:
  language: zh_hans
  text: 所以，我的弟兄们，你们聚在一起吃饭的时候，要彼此等候。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”也可译作“弟兄姐妹们”；希腊文是阳性复数，在这里很可能用来称呼包括女性在内的全体会众。
    reason: 说明希腊文阳性称呼在会众语境中的涵盖用法。
lexical_decisions:
- source_word: Ὥστε
  choice: 所以
  rationale: 表示从前文对主餐混乱现象的责备中引出结论；“所以”在现代汉语中自然，并保留推论关系。
- source_word: ἀδελφοί μου
  choice: 我的弟兄们
  rationale: 忠实保留希腊文阳性复数呼语及所属代词；这里很可能是对包括女性在内的全体会众说话，故以脚注说明其涵盖用法。
- source_word: συνερχόμενοι
  choice: 你们聚在一起……的时候
  rationale: 将与命令语气连用的现在时分词译为时间情境，既自然，也呼应本章反复出现的共同聚会语境。
- source_word: εἰς τὸ φαγεῖν
  choice: 吃饭
  rationale: 介词加冠词化不定式表示目的；在聚餐语境中，“吃饭”比单用“吃”自然，同时不将所吃之餐过度限定为某种礼仪形式。
- source_word: ἀλλήλους
  choice: 彼此
  rationale: 准确表达相互代词的互惠关系，是简洁自然的现代汉语。
- source_word: ἐκδέχεσθε
  choice: 等候
  rationale: 鉴于21节所说有人抢先吃自己的饭，此处最自然的实际纠正是等候其他人后再吃；该词也可含接待或接纳之意，但上下文主要支持“等候”。
theological_decisions:
- issue: ἀδελφοί 的代表性阳性称呼
  choice: 正文译作“弟兄们”，脚注说明可包括姐妹。
  alternative: 正文译作“弟兄姐妹们”。
  rationale: 希腊文形式明确为阳性复数，但在书信中常用来称呼包括女性在内的全体会众；正文保留形式特征，脚注交代实际涵盖范围。
- issue: ἐκδέχεσθε 在主餐语境中的含义
  choice: 译作“等候”。
  alternative: 译作“接待”或“接纳”。
  rationale: 前文的具体问题是有人抢先吃喝，甚至有人饥饿、有人醉酒，因此“彼此等候”最直接对应保罗的纠正；同时不否认该动词在其他语境可有接待之义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“聚在一起吃饭的时候”自然呈现分词和目的结构；“要彼此等候”保留命令语气及群体互顾的重点。
