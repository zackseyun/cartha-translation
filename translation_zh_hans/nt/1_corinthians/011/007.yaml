reference: 1 Corinthians 11:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀνὴρ μὲν γὰρ οὐκ ὀφείλει κατακαλύπτεσθαι τὴν κεφαλήν, εἰκὼν καὶ δόξα θεοῦ ὑπάρχων· ⸀ἡ γυνὴ δὲ δόξα ἀνδρός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/007.yaml
  text: For a man ought not to cover his head[a], since he is the image and glory of God[b]; but the woman is the glory of man.
translation:
  language: zh_hans
  text: 男人[a]本不该蒙住头[b]，因为他是神的形象和荣耀；女人却是男人的荣耀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节的希腊词 ἀνήρ 和 γυνή 也可分别译作“丈夫”和“妻子”，具体含义取决于上下文。
    reason: alternative_reading
  - marker: b
    text: 也可译作“遮盖头部”；原文只笼统地说把头遮盖起来，并未说明具体用什么遮盖。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ / ἀνδρός
  choice: 男人
  rationale: 这里的论述以男性和女性作对照，并诉诸创造中的“形象”和“荣耀”，因此采用泛指的“男人”；原词也可按语境指“丈夫”，故以脚注保留这一可能。
- source_word: ὀφείλει
  choice: 该
  rationale: 表达规范性或道德上的义务，语气自然，同时不把原文强化为绝对命令。与否定词连用译作“不该”。
- source_word: κατακαλύπτεσθαι τὴν κεφαλήν
  choice: 蒙住头
  rationale: 保留“遮盖头部”的具体动作，却不限定遮盖物的确切样式；“蒙头巾”或“戴面纱”都比原文更具体。
- source_word: εἰκὼν
  choice: 形象
  rationale: 这是 εἰκών 的常规神学用语，也保留了对《创世记》创造叙事的可能呼应。
- source_word: δόξα
  choice: 荣耀
  rationale: 两处均译为“荣耀”，既保持句内对应，也保留该词的神学和关系性分量；“尊荣”会缩窄语义。
- source_word: ὑπάρχων
  choice: 因为他是
  rationale: 分词在此说明前一句的理由；用“因为他是”清楚表达其因果作用，并符合现代汉语。
- source_word: ἡ γυνὴ
  choice: 女人
  rationale: 与前面的“男人”构成泛指的男女对照；原词也可能按语境指“妻子”，这一歧义在脚注中保留。
theological_decisions:
- issue: ἀνήρ／γυνή应译为“男人／女人”还是“丈夫／妻子”
  choice: 正文采用“男人／女人”
  alternative: 丈夫／妻子
  rationale: 上下文以男女、蒙头和创造神学展开论述，范围似乎不只限于婚姻关系；但希腊词本身可有婚姻义，因此不排除另一读法，并在脚注中注明。
- issue: 如何处理“女人是男人的荣耀”这一不对称陈述
  choice: 直接保留“女人却是男人的荣耀”
  alternative: 女人彰显男人的荣耀／女人是男人的尊荣
  rationale: 原文以系词 ἐστιν 直接作出陈述，并重复使用 δόξα。正文不弱化、不解释性改写，以保留原文的神学张力。
- issue: “神的形象和荣耀”中两个名词与“男人”的关系
  choice: 保留并列结构“他是神的形象和荣耀”
  alternative: 他有神的形象，并彰显神的荣耀
  rationale: 原文把 εἰκών 与 δόξα 并列作表语；不将其拆解为“拥有”和“彰显”两种不同关系，以免加入原文未明说的解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“本不该”传达原文的规范性语气；“蒙住头”简洁具体，却不把遮盖物限定为头巾或面纱。保留分号前后的对照结构及“荣耀”的重复，以呈现原文的修辞和神学张力。
