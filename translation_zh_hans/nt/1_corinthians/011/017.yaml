  text: Τοῦτο δὲ ⸂παραγγέλλων οὐκ ἐπαινῶ⸃ ὅτι οὐκ εἰς τὸ κρεῖσσον ἀλλὰ εἰς τὸ ἧσσον συνέρχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/017.yaml
  text: But in giving this instruction[a], I do not praise you, because you come together not for the better but for the worse.
translation:
  language: zh_hans
  text: 但我就下面所吩咐的事，并不称赞你们；因为你们聚在一起，带来的不是更好的结果，反而是更坏的结果。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τοῦτο
  choice: 以下这件事
  rationale: 中性指示代词在这里前指保罗即将提出的事项；译作“以下这件事”，既符合汉语表达，也清楚显示其承接下文。
- source_word: δὲ
  choice: 但
  rationale: 表示话题转换并带有轻微转折，由前文转入责备；“但”能自然体现这一语气。
- source_word: παραγγέλλων
  choice: 吩咐
  rationale: 该动词可表示指示、嘱咐或命令。此处是使徒针对聚会作出的权威性指示，“吩咐”保留其权威语气，又不过分强化为严厉命令。
- source_word: οὐκ ἐπαινῶ
  choice: 并不称赞你们
  rationale: ἐπαινέω意为称赞或嘉许；此译也与本章2节保罗称赞他们形成呼应。
- source_word: ὅτι
  choice: 因为
  rationale: 在此引出保罗不称赞他们的原因，按因果关系译为“因为”自然明确。
- source_word: οὐκ εἰς τὸ κρεῖσσον
  choice: 带来的不是更好的结果
  rationale: εἰς加比较级可表达趋向、目的或结果。结合聚会造成的实际后果，用“带来的……结果”使现代汉语通顺，同时保留“更好”的比较含义。
- source_word: ἀλλὰ εἰς τὸ ἧσσον
  choice: 反而是更坏的结果
  rationale: 与前半句形成鲜明对照，保留原文“更好／更坏”的比较结构，并用“反而”体现转折。
- source_word: συνέρχεσθε
  choice: 你们聚在一起
  rationale: 该形式在这里是不及物用法，指信徒共同聚集；“聚在一起”清楚自然，并符合教会聚会的语境。
theological_decisions:
- issue: παραγγέλλων的权威语气
  choice: 吩咐
  alternative: 命令；嘱咐；指示
  rationale: “吩咐”体现保罗作出权威性教导，却不把语气强化为严厉的强制命令；不影响经文的教义内容。
- issue: εἰς τὸ κρεῖσσον／εἰς τὸ ἧσσον表示目的、趋向还是结果
  choice: 译为聚会带来的“更好的结果／更坏的结果”
  alternative: 为了变得更好／更坏；向着更好／更坏
  rationale: 希腊文结构可涉及目的、趋向或结果；上下文强调他们聚会的实际负面效果。正文采用自然的结果表达，但仍保留比较性的张力，不具体断定究竟是谁或什么变得更坏。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“称赞”与本章前文相呼应；“更好的结果／更坏的结果”保留原文的比较对照，并避免加入具体的宗派性解释。
