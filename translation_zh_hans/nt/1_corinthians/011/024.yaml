  text: καὶ εὐχαριστήσας ἔκλασεν καὶ ⸀εἶπεν· Τοῦτό μού ἐστιν τὸ σῶμα τὸ ὑπὲρ ⸀ὑμῶν· τοῦτο ποιεῖτε εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/024.yaml
  text: And after giving thanks[a], he broke it and said, “This is my body, which is for you[b]. Keep doing this in remembrance of me.”
translation:
  language: zh_hans
  text: 他献上感谢后，就把饼掰开，说：“这是我的身体，是为你们的[a][b]。你们要继续这样做，以此记念我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为你们”也可译作“为了你们的缘故”或“为你们的益处”。
    reason: lexical_alternative
  - marker: b
    text: 有些抄本在“为你们”之后加上“掰开的”，即：“这是我的身体，是为你们掰开的。”
    reason: textual_variant
lexical_decisions:
- source_word: εὐχαριστήσας
  choice: 献上感谢后
  rationale: 不定过去时分词表示先于主要动作发生的行动；此译自然表达“感谢之后”的时序，同时不明加原文未明说的受谢对象。
- source_word: ἔκλασεν
  choice: 把饼掰开
  rationale: 动词意为“掰开、折断”；中文从上文语境补出宾语“饼”，使动作清楚自然。
- source_word: Τοῦτό μού ἐστιν τὸ σῶμα
  choice: 这是我的身体
  rationale: 直接保留原文的系词结构，不译成“这代表我的身体”，以免预先裁定圣餐意义上的神学争议。
- source_word: τὸ ὑπὲρ ὑμῶν
  choice: 是为你们的
  rationale: ὑπέρ加属格可表达受益或代表关系；“为你们”简洁保留这种含义，而不加入原文未明确说明的赎罪理论。
- source_word: τοῦτο ποιεῖτε
  choice: 你们要继续这样做
  rationale: 现在时命令语气在设立圣餐的语境中自然具有持续或反复实行的意味；“继续这样做”将这一语用力量清楚表达出来。
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: 以此记念我
  rationale: ἀνάμνησις指记念、追念的行动；“以此记念我”表达所命令行动的记念目的，并避免把它缩减为单纯的心理回想。
theological_decisions:
- issue: 圣餐语境中“这是我的身体”的含义
  choice: 直译为“这是我的身体”，不加解释性限定。
  alternative: 译作“这代表我的身体”，从而突出象征或纪念层面的理解。
  rationale: 原文使用直接的系词结构，却没有进一步界定基督临在的方式；译文应保留这一措辞及其神学张力。
- issue: ὑπὲρ ὑμῶν的效力
  choice: 译为受益性且可含代表意味的“为你们”。
  alternative: “代表你们”或“为了你们的缘故”。
  rationale: 原短语清楚表明身体是为受话者而有，但并未在此详述其机制，因此不采用更技术化的教义表述。
- issue: ποιεῖτε的持续或反复意味
  choice: 译为“要继续这样做”。
  alternative: 仅译为“要这样做”。
  rationale: 现在时命令语气结合圣餐设立语境，支持持续、反复实行的理解；译文表达这一力量，但不规定实行频率。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“献上感谢”避免明加原文没有写出的“向上帝”；“把饼掰开”则依据紧邻语境补明中文所需宾语。“记念”保留经文语体中主动追念、纪念的意味。两个脚注标记都放在其共同所说明的“为你们”之后。
