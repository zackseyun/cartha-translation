base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/032.yaml
  text: But when we are judged by the Lord[a], we are disciplined, so that we may not be condemned along with the world.
translation:
  language: zh_hans
  text: 但我们受主审判[a]时，乃是受管教，免得和世人一同被定罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们受主审判时，正在受管教。”希腊文使用现在时形式，可以强调持续进行的行动。
    reason: 词义与句法的另一种表达
lexical_decisions:
- source_word: κρινόμενοι
  choice: 我们受……审判
  rationale: 现在时被动分词在此可按时间或伴随情形理解；译文以简洁的“受……审判”保留司法意味，并由后面的“受管教”说明其纠正性质。
- source_word: δὲ
  choice: 但
  rationale: 表示与上一节所说的受审判形成轻微转折，用“但”自然清楚。
- source_word: ὑπὸ κυρίου
  choice: 受主
  rationale: ὑπό加属格表示施事者；κύριος按上下文译为“主”，不擅自补出“耶稣”。
- source_word: παιδευόμεθα
  choice: 受管教
  rationale: 该词可指教育、训练或纠正性的惩戒；此处“受管教”既自然，也凸显补救而非单纯惩罚的作用。
- source_word: ἵνα μὴ
  choice: 为的是不
  rationale: 保留目的或预期结果的语气，符合现代汉语表达。
- source_word: σὺν τῷ κόσμῳ
  choice: 和世人一同
  rationale: σύν表达共同遭遇；κόσμος在此指与神敌对的世人整体。译作“世人”比“世界”更自然地表达共同被定罪的对象。
- source_word: κατακριθῶμεν
  choice: 被定罪
  rationale: 该词指受到不利判决或定罪，与前面的κρίνω形成有意区别，保留当前纠正性审判与最终定罪之间的对照。
theological_decisions:
- issue: 主当前的审判与最终定罪之间的关系
  choice: 译文区分主对“我们”的纠正性管教和世人所受的定罪。
  alternative: 也可较笼统地理解为现世惩罚，而不明确涉及信徒与非信徒的区别。
  rationale: κρινόμενοι与κατακριθῶμεν的词义对照，加上παιδευόμεθα和目的从句，表明当前的审判具有纠正作用，目的在于免受定罪；译文不进一步引入有关坚忍或圣餐功效的教义体系。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“受管教”保留经文的纠正性语气；“和世人一同”避免把κόσμος误解为物质宇宙。
