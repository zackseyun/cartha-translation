  text: πρῶτον μὲν γὰρ συνερχομένων ὑμῶν ἐν ἐκκλησίᾳ ἀκούω σχίσματα ἐν ὑμῖν ὑπάρχειν, καὶ μέρος τι πιστεύω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/018.yaml
  text: For[a], in the first place, when you come together in assembly, I hear that divisions exist among you, and in part I believe it.
translation:
  language: zh_hans
  text: 首先，当你们以会众的身分聚集[a]时，我听说你们中间有分裂；我对此也相信几分。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以会众的身分聚集”也可译作“聚集作教会”或“在会众中聚集”。希腊文ἐκκλησία在这里指聚集起来的会众，并非特指某座建筑物。
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτον μὲν γὰρ
  choice: 首先
  rationale: 引出保罗论述的第一点；中文用“首先”即可自然承载顺序和承接语气，不必生硬补出未明确展开的“因为”。
- source_word: συνερχομένων ὑμῶν
  choice: 你们聚集……的时候
  rationale: 按时间关系处理独立属格，并与本章反复出现的聚集语境相呼应。
- source_word: ἐν ἐκκλησίᾳ
  choice: 聚集成为教会
  rationale: 这里指会众共同聚集的状态，而非进入某座教堂建筑；此译法保留ἐκκλησία的群体含义。
- source_word: σχίσματα
  choice: 分裂
  rationale: 表达群体内部的裂痕或分争，同时不把它过度具体化为已正式形成的派系。
- source_word: καὶ μέρος τι πιστεύω
  choice: 这话我也有几分相信
  rationale: 表明保罗对所听见的报告并非毫无保留地全盘接受；“有几分”自然保留程度上的限定。
theological_decisions:
- issue: ἐκκλησία在此处的含义
  choice: 共同聚集的教会群体
  alternative: 教堂建筑；抽象的宗教机构
  rationale: 上下文谈的是信徒为共同聚会和主餐而集合，因此重点是聚集起来的会众，并非建筑物。
- issue: 保罗相信报告的程度
  choice: 有几分相信
  alternative: 完全相信；只相信报告的一部分具体内容
  rationale: μέρος τι修饰相信的程度，其具体范围并未说明，译文保留这种开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“聚集成为教会”突出会众共同聚集的意义；脚注说明可接受的其他表达，并避免现代汉语中“在教会里”可能引起的建筑物联想。
