source:
  edition: SBLGNT
  text: πᾶσα δὲ γυνὴ προσευχομένη ἢ προφητεύουσα ἀκατακαλύπτῳ τῇ κεφαλῇ καταισχύνει τὴν κεφαλὴν ⸀αὐτῆς, ἓν γάρ ἐστιν καὶ τὸ αὐτὸ τῇ ἐξυρημένῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/005.yaml
  text: But every woman who prays or prophesies with her head uncovered dishonors her head[b][a], for that is one and the same as having been shaved.
translation:
  language: zh_hans
  text: 但凡女人[a]祷告或说预言时，头没有遮盖[b]，就羞辱她的头；因为这与剃光了头是一样的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “女人”也可译作“妻子”；“她的头”既可指她身体的头，也可能指关系意义上作为她之“头”的丈夫或男人。希腊原文容许这些理解。
    reason: alternative_reading
  - marker: b
    text: “没有遮盖”本身没有说明遮盖物究竟是什么；有人理解为面纱或头巾，也有人作其他理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: 女人
  rationale: γυνή可指“女人”或“妻子”。本句“凡……祷告或说预言的”在表层语法上是泛指，译作“女人”较自然，同时在脚注保留“妻子”的可能。
- source_word: προσευχομένη ἢ προφητεύουσα
  choice: 祷告或说预言时
  rationale: 两个现在时分词描述正在进行的活动；用“……时”表达伴随情形，符合现代汉语，也保留动作意义。
- source_word: ἀκατακαλύπτῳ τῇ κεφαλῇ
  choice: 头若没有遮盖
  rationale: 该短语说明头处于未被遮盖的状态；译文不具体指定面纱、头巾、头发或其他遮盖物。
- source_word: καταισχύνει
  choice: 羞辱
  rationale: 此词表示使人蒙羞、受辱；“羞辱”能传达荣辱语境中的公开失 honor，而不只表示内心羞愧。
- source_word: τὴν κεφαλὴν αὐτῆς
  choice: 自己的头
  rationale: 直译为“她的头”。“自己的”使汉语所指清楚，却仍可按上下文理解为身体的头，也可理解为关系意义上的“头”。
- source_word: ἓν γάρ ἐστιν καὶ τὸ αὐτό
  choice: 因为这样与……没有两样
  rationale: 原文习语强调两者等同；“没有两样”是自然的现代汉语，并保留强调语气。
- source_word: τῇ ἐξυρημένῃ
  choice: 剃光了头
  rationale: 完成时分词指剃过之后所处的状态；“剃光了头”比一般的“剪了头发”更准确地表达剃除头发的形象。
theological_decisions:
- issue: “羞辱自己的头”中第二个“头”（κεφαλή）的含义
  choice: 正文保留“自己的头”，不判定是身体的头还是关系意义上的“头”。
  alternative: 明确译作她身体的头；或明确译作她的丈夫／作为她之头的男人。
  rationale: 希腊文本本身可按字面理解，而上下文又容许关系性的理解；保留原有措辞，避免消除经文中的解释张力。
- issue: “没有遮盖”所指的具体遮盖方式
  choice: 笼统译作“头若没有遮盖”。
  alternative: 明确译作没有戴面纱、没有蒙头巾，或头发处于某种状态。
  rationale: ἀκατακάλυπτος只说明未被遮盖，并未自行指定遮盖物或具体习俗；正文不加入原文未明说的细节。
- issue: γυνή在本节是“女人”还是“妻子”
  choice: 正文采用较宽泛的“女人”。
  alternative: 译作“妻子”。
  rationale: 这个词兼有两义；本句的泛指结构支持“女人”，但婚姻关系的读法仍可能与上下文相合，因此列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“但凡”表达πᾶσα的普遍范围；“说预言”沿用清楚而不过度解释的宗教用语；避免把遮盖物具体化，也不在正文中解决“头”的双重可能含义。
