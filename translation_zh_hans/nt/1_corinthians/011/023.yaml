  text: Ἐγὼ γὰρ παρέλαβον ἀπὸ τοῦ κυρίου, ὃ καὶ παρέδωκα ὑμῖν, ὅτι ὁ κύριος Ἰησοῦς ἐν τῇ νυκτὶ ᾗ ⸀παρεδίδετο ἔλαβεν ἄρτον
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/023.yaml
  text: 'For I received from the Lord what I also delivered to you: that the Lord Jesus[a], on the night when he was being handed over, took bread'
translation:
  language: zh_hans
  text: 我从主领受的，也传给了你们：主耶稣在他被交付的那一夜[a]，拿起饼来，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统译法：“在他被出卖的那一夜”。
    reason: alternative_reading
lexical_decisions:
- source_word: παρέλαβον
  choice: 领受
  rationale: 表示保罗接受了有关主餐的传统或教导，并与下文“传给”形成清楚、庄重的领受—传承关系。
- source_word: ἀπὸ τοῦ κυρίου
  choice: 从主
  rationale: 按希腊文保留来源含义，不提前扩展为“从主耶稣”，让后句自行明确主的身份。
- source_word: παρέδωκα
  choice: 传给
  rationale: 在传承教导的语境中自然清楚；同时不与后文同一词根的被动形式机械地译成相同汉语，以免产生不自然或误导性的表达。
- source_word: ὅτι
  choice: ：
  rationale: 此处引出所传内容，现代汉语以冒号比直译“就是”或“即”更自然，也准确呈现说明关系。
- source_word: ὁ κύριος Ἰησοῦς
  choice: 主耶稣
  rationale: 保留κύριος的基督论与尊称意味，并忠实表达专名。
- source_word: ἐν τῇ νυκτὶ ᾗ
  choice: 在……的那一夜
  rationale: 以自然的现代汉语表达希腊文的时间关系从句。
- source_word: παρεδίδετο
  choice: 被交出去
  rationale: 保留παραδίδωμι被动式“被交付、被交出”的较宽语义，不在正文中把行动仅限定为犹大的背叛；未完成时的过程性在汉语中由语境自然承载。
- source_word: ἔλαβεν ἄρτον
  choice: 拿起饼来
  rationale: “拿起……来”自然表达礼仪叙事中的动作；“饼”准确而简洁，不把无冠词名词过度具体化为“一块饼”。
theological_decisions:
- issue: 设立主餐叙事中παρεδίδετο的译法
  choice: 被交出去
  alternative: 被出卖
  rationale: 该动词可指交付、交出，也可在具体语境中指背叛或出卖。正文采用较宽的译法，以保留人间背叛与耶稣被交付之间的神学张力；传统译法列入脚注。
translation_notes:
  register: 采用现代、庄重且适合公开诵读的普通话。“领受—传给”保留保罗传承语言的对应关系；句末逗号表明本节句法和叙事将在下一节继续。
