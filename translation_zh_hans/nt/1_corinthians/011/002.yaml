  text: Ἐπαινῶ δὲ ⸀ὑμᾶς ὅτι πάντα μου μέμνησθε καὶ καθὼς παρέδωκα ὑμῖν τὰς παραδόσεις κατέχετε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/002.yaml
  text: I praise you because you remember me in everything and hold firmly to the traditions just as I delivered them to you[a].
translation:
  language: zh_hans
  text: 我称赞你们，因为你们在各方面都记得我，并且照我传给你们的那样，持守这些传统[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“教导”或“训诲”；希腊文为“传统”，指所传递下来的内容。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπαινῶ
  choice: 我称赞
  rationale: 直译为“称赞”，自然表达保罗在本段开头的肯定语气。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处是轻微的篇章衔接词；汉语无需机械加上“现在”或“但是”，省译更自然，也不制造原文没有的强烈转折。
- source_word: ὑμᾶς
  choice: 你们
  rationale: 明确体现第二人称复数。
- source_word: ὅτι
  choice: 因为
  rationale: 在此引出称赞的原因，采用因果表达最为自然。
- source_word: πάντα
  choice: 凡事都
  rationale: 保留表达的广泛范围，同时符合现代汉语习惯。
- source_word: μου μέμνησθε
  choice: 记得我
  rationale: 准确传达持续把保罗放在心上的意思，不额外强化为更具体的行为。
- source_word: καθὼς παρέδωκα ὑμῖν
  choice: 照我传给你们的
  rationale: “传给”体现把内容交付、传递给他人的语义，也与后文“传下来”形成词义呼应。
- source_word: τὰς παραδόσεις
  choice: 所传下来的教导
  rationale: παράδοσις指被交付并传承下来的内容。“所传下来的教导”既保留传递这一核心语义，又避免现代汉语“传统”可能令人误解为后世形成的习俗。脚注保留较直译的选择。
- source_word: κατέχετε
  choice: 坚守
  rationale: 表达持守、牢牢保留并遵行的意思，简洁而有力度。
theological_decisions:
- issue: 教会语境中 παραδόσεις 的译法
  choice: 所传下来的教导
  alternative: 传统；训诲；所传下来的内容
  rationale: 原文所指是保罗交付给哥林多信徒、由他们持守的内容。正文用“所传下来的教导”避免把它限定为后世宗派意义上的“传统”，同时保留其传承性质；脚注明示希腊文的字面类别，以保存原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“称赞”“坚守”保持经文的正式语气；句式简洁，并通过“传给／传下来”保留 παραδίδωμι 与 παράδοσις 之间的词根关联。
