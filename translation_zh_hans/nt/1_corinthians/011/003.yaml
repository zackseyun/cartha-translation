  text: θέλω δὲ ὑμᾶς εἰδέναι ὅτι παντὸς ἀνδρὸς ἡ κεφαλὴ ὁ Χριστός ἐστιν, κεφαλὴ δὲ γυναικὸς ὁ ἀνήρ, κεφαλὴ δὲ ⸀τοῦ Χριστοῦ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/003.yaml
  text: But I want you to know that the head of every man is Messiah[a], and the head of a woman is the man[b], and the head of Messiah is God.
translation:
  language: zh_hans
  text: 但我想让你们知道：每一个男人的头是弥赛亚[a]，女人的头是男人[b]，弥赛亚的头是上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “头”也可能理解为“源头”或“权威”；正文保留希腊文的隐喻。
    reason: lexical_alternative
  - marker: b
    text: 这里的“女人”和“男人”也可理解为“妻子”和“丈夫”。
    reason: alternative_reading
lexical_decisions:
- source_word: θέλω δὲ ὑμᾶς εἰδέναι
  choice: 但我愿意你们知道
  rationale: 保留保罗表达意愿的直接语气；“但”自然标示与上文之间的轻微转折，“知道”直接对应 εἰδέναι。
- source_word: παντὸς ἀνδρὸς
  choice: 每个男人
  rationale: ἀνήρ 可指“男人”或“丈夫”；首个分句采用一般性的“男人”，既对应 παντός，也不预先限定为婚姻关系。
- source_word: κεφαλή
  choice: 头
  rationale: 保留希腊文的身体隐喻及其解释张力，不在正文中擅自确定为“源头”或“权柄”。
- source_word: ὁ Χριστός / τοῦ Χριστοῦ
  choice: 弥赛亚
  rationale: Χριστός 在此具有称号作用，译作“弥赛亚”，并在本节两处保持一致。
- source_word: γυναικός
  choice: 女人
  rationale: γυνή 可指“女人”或“妻子”；正文采用较宽泛的“女人”，婚姻关系的读法置于脚注。
- source_word: ὁ ἀνήρ
  choice: 男人
  rationale: 与 γυνή 平行，保留一般性的男女称谓；“丈夫”的可能读法另见脚注。
- source_word: ὁ θεός
  choice: 上帝
  rationale: θεός 的标准现代汉语译法；按原文直陈最后一个平行分句。
theological_decisions:
- issue: 三个平行分句中 κεφαλή 的含义
  choice: 正文保留“头”这一隐喻
  alternative: “源头”或“掌权者”
  rationale: 原文使用同一隐喻，且其具体关系历来存在解释分歧；直保留“头”可避免把某一种神学解释写入正文。
- issue: ἀνήρ 与 γυνή 是泛指男女还是特指夫妻
  choice: 正文译作“男人／女人”
  alternative: “丈夫／妻子”
  rationale: 句法上的广泛平行结构支持一般性称谓，但上下文和词义也容许夫妻读法，因此以脚注保留。
- issue: “弥赛亚的头是上帝”的神学张力
  choice: 不加解释，照原文直译
  alternative: 增译为仅指职分、秩序或本源关系
  rationale: 任何限定性扩译都会超出本节明说的内容；直译既保存原文，也不把后来的教义解释强加进正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我愿意你们知道”略带书面色彩，以保留使徒劝导的郑重语气；三个分句尽量维持原文平行结构。
