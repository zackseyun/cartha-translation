source:
  edition: SBLGNT
  text: ὡσαύτως καὶ τὸ ποτήριον μετὰ τὸ δειπνῆσαι, λέγων· Τοῦτο τὸ ποτήριον ἡ καινὴ διαθήκη ἐστὶν ἐν τῷ ἐμῷ αἵματι· τοῦτο ποιεῖτε, ὁσάκις ⸀ἐὰν πίνητε, εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/025.yaml
  text: In the same way also[a], after supper, he took the cup, saying, “This cup is the new covenant in my blood. Keep doing this, whenever you drink it[b], in remembrance of me.”
translation:
  language: zh_hans
  text: 同样，他在晚饭后也拿起杯来，说：“这杯是用我的血所立的新约[a]。你们每逢喝这杯时[b]，都要这样做，为的是记念我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里译作“约”的希腊词也可以指“遗嘱”；但本处以血立约的圣经背景更适合译作“约”。
    reason: alternative_reading
  - marker: b
    text: “每逢喝”表明这是在一次又一次饮用时所要做的事；希腊原文没有明说“这杯”这个宾语，但可由上文自然补出。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσαύτως καὶ
  choice: 同样……也
  rationale: 承接上一节关于饼的行动，保留“照样、也”的对应关系，同时符合现代汉语表达。
- source_word: τὸ ποτήριον
  choice: 杯
  rationale: 采用普通、直接的词义，不加入原文没有要求的礼仪性称谓。
- source_word: μετὰ τὸ δειπνῆσαι
  choice: 晚饭后
  rationale: 这个带冠词的不定式结构表示时间；“晚饭后”简洁自然，也符合宴席语境。
- source_word: λέγων
  choice: 拿起杯来，说
  rationale: “说”是分词本义；“拿起”由本句与上一节平行结构中省略的主要动词补出，使汉语句子完整，但不增添新的情节。
- source_word: ἡ καινὴ διαθήκη
  choice: 新约
  rationale: 本处呼应圣经中以血立约的背景；“约”比“遗嘱”更符合语境。“新约”虽也是固定神学用语，在此仍按“新的约”理解。
- source_word: ἐν τῷ ἐμῷ αἵματι
  choice: 我血中的
  rationale: 贴近介词ἐν的表达，保留原文“这杯—新约—我的血”之间直接而浓缩的关系，不擅自展开成“借我的血设立”或其他解释。
- source_word: τοῦτο ποιεῖτε
  choice: 都要这样做
  rationale: 现在时命令式结合下文反复发生的饮用场合，表示持续、重复遵行；“都要”在“每逢”结构中自然体现这一点。
- source_word: ὁσάκις ἐὰν πίνητε
  choice: 每逢喝这杯时
  rationale: 表达每一次发生时的重复条件。“这杯”是根据上文补出的隐含宾语，使现代汉语清楚自然。
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: 为的是记念我
  rationale: ἀνάμνησις指记念或纪念的行动；“为的是”清楚表达εἰς在此的目的指向，而不把它缩减为纯粹心理回想。
theological_decisions:
- issue: 圣餐设立语境中διαθήκη的含义
  choice: 约
  alternative: 遗嘱
  rationale: 以血立约及旧约经文背景支持“约”；“遗嘱”虽是该词可能具有的法律含义，却不是本处最合适的理解。
- issue: 杯、血与新约的关系
  choice: 保留“这杯就是我血中的新约”的直接陈述
  alternative: “这杯代表用我的血所立的新约”或“这杯就是借我的血确立的新约”
  rationale: 希腊文直接使用“是”，并以ἐν连接“我的血”；译文不加入“代表”，也不把介词关系明确解释成确立方式，从而保留经文本身的神学张力。
- issue: 命令是否指向重复的实践
  choice: 用“每逢……都要”表达反复遵行
  alternative: 仅译作一次性的“这样做”
  rationale: 现在时命令式与ὁσάκις ἐὰν共同指向一次又一次发生的饮用场合，但译文不进一步规定次数或礼仪形式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我血中的”略带凝练的经文语体，用来忠实保留原文介词结构及其未被解释完的神学张力；其余句式力求普通读者容易理解。
