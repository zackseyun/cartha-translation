id: 1CO.11.20
reference: 1 Corinthians 11:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: συνερχομένων οὖν ὑμῶν ἐπὶ τὸ αὐτὸ οὐκ ἔστιν κυριακὸν δεῖπνον φαγεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/020.yaml
  text: Therefore[a], when you come together in the same place, it is not to eat the Lord’s supper,
translation:
  language: zh_hans
  text: 所以，你们聚在一处时，你们所吃的并不能算是主的晚餐。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们并不是在吃主的晚餐。”希腊原文句式简练，也可理解为：他们的行为使这顿饭不再配称为主的晚餐。
    reason: alternative_reading
lexical_decisions:
- source_word: συνερχομένων
  choice: 聚在……时
  rationale: 与ὑμῶν构成时间性表达，意为“当你们聚集时”；“聚”自然地表达信徒共同集会的意思。
- source_word: οὖν
  choice: 所以
  rationale: 承接上文关于分裂的责备，表明这里是由前文得出的结论；“所以”在现代汉语中清楚自然。
- source_word: ἐπὶ τὸ αὐτό
  choice: 在一处
  rationale: 保留众人在同一地点、同一聚会中集合的空间意味，同时避免与“聚”完全重复。
- source_word: οὐκ ἔστιν ... φαγεῖν
  choice: 所吃的并不能算是
  rationale: 希腊文结构简练且略有歧义。结合下文对其进食方式的责备，这里是说他们所吃的不能恰当地称为主的晚餐，而非断言他们在物理意义上无法进食。译文传达这种评断意味，脚注保留较贴近表层结构的译法。
- source_word: κυριακὸν
  choice: 主的
  rationale: 该形容词表示“属于主的”；“主的”是现代汉语中准确、简洁且通行的表达。
- source_word: δεῖπνον
  choice: 晚餐
  rationale: 指当时共同享用的正餐；在本语境中，“主的晚餐”既保留用餐含义，也符合清楚而庄重的基督教用语。
- source_word: κυριακὸν δεῖπνον
  choice: 主的晚餐
  rationale: 准确表达“属于主的筵席/晚餐”，并与本段关于共同用餐的语境自然衔接。
theological_decisions:
- issue: 保罗是在否定他们能够吃这顿饭，还是在否定他们的做法配称为主的晚餐
  choice: 他们分裂、自私的行为使所吃的不能算作主的晚餐
  alternative: 你们并不是在吃主的晚餐；或，并不是为了吃主的晚餐
  rationale: 11:21–22表明保罗责备的是他们共同进食的方式。正文因此表达资格与性质上的否定，而不是形而上的不可能；脚注则保留希腊文压缩句式可能产生的其他理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“聚在一处”保留共同集会及同处一地的意味；“并不能算是”使上下文中的责备清楚，同时借脚注保留原文句法上的张力。
