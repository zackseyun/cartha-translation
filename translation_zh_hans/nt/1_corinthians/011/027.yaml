  text: Ὥστε ὃς ἂν ἐσθίῃ τὸν ⸀ἄρτον ἢ πίνῃ τὸ ποτήριον τοῦ κυρίου ⸀ἀναξίως, ἔνοχος ἔσται τοῦ σώματος καὶ τοῦ αἵματος τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/027.yaml
  text: Therefore[b][a], whoever eats the bread or drinks the cup of the Lord in an unworthy manner will be guilty concerning the body and blood of the Lord.
translation:
  language: zh_hans
  text: 所以，无论谁以不合宜的方式[a]吃这饼，或喝主的杯，就要为主的身体和血负罪责。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以不合宜的方式”译自一个副词，说明人是怎样吃或喝，并不是说领受者本身毫无价值或必须先成为“配得的人”。
    reason: lexical_alternative
  - marker: b
    text: 也可较直译为：“就干犯了主的身体和血。”原文中“罪责”后接“主的身体和血”，表明罪责所关涉的对象；正文译法保留这一严肃含义，而不把具体含义解释得过窄。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: 所以
  rationale: 承接上文有关主餐的论述，引出推论；“所以”自然地保留了推论语气。
- source_word: ὃς ἂν
  choice: 无论谁
  rationale: 关系代词与ἄν构成不定、概括性的表达，“无论谁”准确传达其开放范围。
- source_word: ἐσθίῃ τὸν ἄρτον
  choice: 吃这饼
  rationale: 现在时虚拟语气处于概括性条件中，汉语用一般动词即可；“这饼”自然回指上文所说的饼，没有把它误写成“主的饼”。
- source_word: ἢ
  choice: 或
  rationale: 原文是明确的选择连词，表明不当地进行其中任何一项都在警告范围之内，不应按礼仪习惯改成“和”。
- source_word: πίνῃ τὸ ποτήριον τοῦ κυρίου
  choice: 喝主的杯
  rationale: 保留原文以“杯”代指杯中之物的转喻表达，也保留“主的”这一所属关系。
- source_word: ἀναξίως
  choice: 以不合宜的方式
  rationale: 该词是副词，修饰“吃”和“喝”的方式，并非直接判定领受者本人是否配得；此译法在现代汉语中清楚表达这一语法关系。
- source_word: ἔνοχος ἔσται
  choice: 都会……担当罪责
  rationale: 表达将要承担罪咎或法律责任的严肃含义；“担当罪责”比单说“有罪”更能呈现其责任指向。
- source_word: τοῦ σώματος καὶ τοῦ αἵματος τοῦ κυρίου
  choice: 在主的身体和血这件事上
  rationale: ἔνοχος后的属格指出罪责所关涉的对象；此译法保留“就……而言、在……方面”的宽度，避免擅自限定具体的法律或神学机制。
theological_decisions:
- issue: ἀναξίως所指的是参与方式还是参与者本身的价值
  choice: 译作“以不合宜的方式”，指向吃喝的方式
  alternative: 译成“不配的人”或暗示只有本身配得者才可领受
  rationale: ἀναξίως是副词，直接修饰“吃”和“喝”。译文不把后来的有关个人资格的神学判断加入经文。
- issue: 吃饼与喝杯之间ἢ的效力
  choice: 保留为“或”，警告适用于不当地进行其中任何一项
  alternative: 按固定礼仪组合处理为“和”
  rationale: 希腊文明确使用选择连词ἢ；原文证据应优先于礼仪上的惯常搭配。
- issue: ἔνοχος与“身体和血”之间属格的含义
  choice: 译为“在……这件事上担当罪责”，保留责任所关涉对象的宽度
  alternative: 译为“干犯主的身体和血”或进一步解释为某种特定罪行
  rationale: 该结构明确表达罪责，却没有完全说明责任的具体法律比喻或神学机制；主文应保留这种张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“无论谁……都会……”传达概括性警告；“以不合宜的方式”避免较旧且可能误解为个人不配的说法；保留“或”以及“主的身体和血”的神学张力。
