source:
  edition: SBLGNT
  text: εἰ γὰρ οὐ κατακαλύπτεται γυνή, καὶ κειράσθω· εἰ δὲ αἰσχρὸν γυναικὶ τὸ κείρασθαι ἢ ξυρᾶσθαι, κατακαλυπτέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/006.yaml
  text: For if a woman does not cover her head[a], she should also have her hair cut off; but if it is disgraceful for a woman to have her hair cut off or to be shaved[b], she should cover her head.
translation:
  language: zh_hans
  text: 因为女人[a]若不蒙头，就也该剪短头发；但若女人剪短头发或剃光头是可耻的，她就该蒙头。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “女人”也可译作“妻子”；希腊文γυνή可依上下文表示两者。
    reason: alternative_reading
  - marker: b
    text: “蒙头”也可译作“被遮盖”或“蒙着”；希腊文只说被遮盖，所遮盖的是头由上下文表明。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακαλύπτεται / κατακαλυπτέσθω
  choice: 蒙着头 / 该蒙着头
  rationale: 该动词表示遮盖或蒙住；本段语境指向头部。译文补出“头”，既使现代汉语清楚自然，又不限定具体遮盖物。
- source_word: γυνή
  choice: 女人
  rationale: γυνή可指“女人”或“妻子”。本节没有明确提到丈夫，故正文采用范围较宽的“女人”，并在脚注保留“妻子”的可能。
- source_word: κειράσθω / κείρασθαι
  choice: 把头发剪去 / 剪去头发
  rationale: 该词指剪短、剪除或像剪羊毛一样剪去头发。译作“剪去”比一般的“剪头发”力度更强，同时与下文“剃光头”保持区别。
- source_word: ξυρᾶσθαι
  choice: 剃光头
  rationale: 该词表示用剃刀剃除头发；“剃光头”在现代汉语中明确表达这一动作，并与剪去头发相区别。
- source_word: καί
  choice: 也
  rationale: 保留论证中的递进关系：若不遮盖，就也应接受把头发剪去这一结果。
- source_word: αἰσχρόν
  choice: 为羞耻
  rationale: 该词包含羞耻、失体面和有辱名声的社会评价；“以……为羞耻”能保留这种荣辱语境。
- source_word: γὰρ ... δέ
  choice: 因为……但
  rationale: 分别呈现保罗在上下文中的解释关系和本句内部的转折关系。
theological_decisions:
- issue: 本节的γυνή应译为“女人”还是“妻子”
  choice: 女人
  alternative: 妻子
  rationale: 原词本身兼有两义，而本节并未明确出现丈夫。正文用“女人”避免无根据地把适用范围限定为已婚女性；脚注保留“妻子”，以呈现上下文仍容许的另一种理解。
- issue: κατακαλύπτεσθαι是否限定为佩戴某种特定头巾
  choice: 蒙着头
  alternative: 蒙上帕子／戴面纱
  rationale: 希腊文表达的是被遮盖，语境暗示所遮盖的是头，但未在本节指定遮盖物的样式。译文因此不加入特定服饰，以免把文化形式解释得过窄。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“剪去头发”与“剃光头”形成清楚对比；句式保留原文“因为……但……”的论证推进。
