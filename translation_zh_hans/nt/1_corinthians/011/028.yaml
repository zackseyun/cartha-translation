  text: δοκιμαζέτω δὲ ἄνθρωπος ἑαυτόν, καὶ οὕτως ἐκ τοῦ ἄρτου ἐσθιέτω καὶ ἐκ τοῦ ποτηρίου πινέτω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/028.yaml
  text: But let a man examine himself, and in this way let him eat from the bread and drink from the cup.
translation:
  language: zh_hans
  text: 但人应当省察自己，然后吃这饼、喝这杯。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοκιμαζέτω
  choice: 应当省察
  rationale: 该动词含检验、察验之意；“省察”在此自然表达对自己的审视，同时保留命令语气。
- source_word: ἄνθρωπος
  choice: 人
  rationale: 此处泛指参与者，并非强调男性；现代汉语用“人”准确涵盖其一般性。
- source_word: οὕτως
  choice: 然后才
  rationale: 结合上下文表达经过自我省察后再领受的方式与次序；“才”传达省察作为领受前提，但不额外规定其结果。
- source_word: ἐκ τοῦ ἄρτου ἐσθιέτω
  choice: 吃这饼
  rationale: 希腊语直译为“从饼中吃”；现代汉语通常说“吃这饼”，既自然又保留特指的圣餐语境。
- source_word: ἐκ τοῦ ποτηρίου πινέτω
  choice: 喝这杯
  rationale: 原文是“从杯中喝”；汉语“喝这杯”属自然的转喻表达，并与“吃这饼”形成平行。
theological_decisions:
- issue: 省察与领受的关系
  choice: 然后才吃这饼、喝这杯
  alternative: 这样吃这饼、喝这杯
  rationale: οὕτως既可指方式，也可在语境中体现次序。“然后才”清楚表达先省察、再领受，同时没有把经文改成省察后禁食禁饮；两个命令仍然都得到保留。
- issue: ἄνθρωπος的性别范围
  choice: 人
  alternative: 男人
  rationale: 该词在此为泛指的人，句子适用于所有领受者；译作“男人”会在中文中造成原文未必具有的性别限制。
translation_notes:
  register: 采用现代、庄重且适合公开诵读的简体中文。“省察”保留圣经语体而仍为普通读者可懂；句式简洁，并保持两个并列命令。
