  text: ⸀οὐδὲ ⸂ἡ φύσις αὐτὴ⸃ διδάσκει ὑμᾶς ὅτι ἀνὴρ μὲν ἐὰν κομᾷ, ἀτιμία αὐτῷ ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/014.yaml
  text: Does not even nature itself teach you that if a man wears long hair[a], it is a dishonor to him[b],
translation:
  language: zh_hans
  text: 难道连本性本身[b]也没有教导你们：男子若留长发[a]，对他而言就是羞辱吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“蓄长发”或“有长发”。希腊文动词指留着或蓄着长发。
    reason: lexical_alternative
  - marker: b
    text: “本性本身”可能指受造秩序、人共有的自然判断，或某种文化认为自然合宜的事；这里的希腊文没有作更明确的限定。
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ
  choice: 难道连……也没有
  rationale: 承接上文并构成带否定意味的反问；“连……也”体现强调语气。
- source_word: ἡ φύσις αὐτὴ
  choice: 本性本身
  rationale: 保留 αὐτή 的强调，也让 φύσις 的具体所指保持宽泛，不限定为生物秩序或社会习俗。
- source_word: διδάσκει ὑμᾶς
  choice: 教导你们
  rationale: 直接表达动词的教导含义，符合庄重而自然的现代汉语。
- source_word: ἀνὴρ
  choice: 男人
  rationale: 本节与下一节形成男女对照，并非特指丈夫。
- source_word: ἐὰν κομᾷ
  choice: 若留长发
  rationale: κομάω 指留着或蓄着长发；“留长发”简洁自然，并保留持续状态或做法的含义。
- source_word: ἀτιμία αὐτῷ ἐστιν
  choice: 就是他的羞辱
  rationale: ἀτιμία 可指羞辱、不光彩；此表达自然保留其荣辱语境以及与当事人的关系。
theological_decisions:
- issue: φύσις 在保罗论述中的含义
  choice: 译作“本性本身”，不进一步限定
  alternative: 受造秩序；人共有的自然判断；文化中被视为合宜之事
  rationale: 原文没有在此明确区分这些可能含义，因此正文保留解释空间，并在脚注中说明。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“难道……吗”呈现反问语气；“本性本身”有意保留原文的强调和语义张力。
