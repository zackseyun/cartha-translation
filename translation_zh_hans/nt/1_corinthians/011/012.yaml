  text: ὥσπερ γὰρ ἡ γυνὴ ἐκ τοῦ ἀνδρός, οὕτως καὶ ὁ ἀνὴρ διὰ τῆς γυναικός· τὰ δὲ πάντα ἐκ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/012.yaml
  text: For just as the woman is from the man[a], so also the man is through the woman; but all things are from God.
translation:
  language: zh_hans
  text: 因为，正如女人是从男人而出，男人也照样是借着女人而生；但万有都是出于上帝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: 因为……怎样……也照样
  rationale: 既保留γάρ承接上文的解释作用，也自然表达ὥσπερ…οὕτως καί的对应比较结构。
- source_word: ἡ γυνὴ
  choice: 女人
  rationale: γυνή既可指女人，也可指妻子；本节同时涉及创造与生育，采用泛指的“女人”更符合较广的语境。
- source_word: ἐκ τοῦ ἀνδρός
  choice: 从男人而出
  rationale: ἐκ表示来源；“从男人而出”保留女人在创造中取自男人的暗示，并与后面的“借着女人而生”有意区分。
- source_word: ὁ ἀνὴρ
  choice: 男人
  rationale: ἀνήρ可指男人或丈夫；这里与“女人”形成普遍性的对应，故译作“男人”。
- source_word: διὰ τῆς γυναικός
  choice: 借着女人而生
  rationale: διά加属格表示媒介或途径；补出“而生”使现代汉语清楚表达男人经由女人出生，同时不把διά与ἐκ混同。
- source_word: τὰ δὲ πάντα
  choice: 但万有
  rationale: δέ在此形成温和转折，将人的相互来源转向最终的神圣来源；“万有”简洁涵盖一切受造存在。
- source_word: ἐκ τοῦ θεοῦ
  choice: 都是出于上帝
  rationale: ἐκ表示最终来源；“出于上帝”是自然庄重的现代汉语表达。
theological_decisions:
- issue: γυνή与ἀνήρ在本节中的含义
  choice: 译作泛指的“女人”和“男人”
  alternative: 译作“妻子”和“丈夫”
  rationale: 本节把创造时女人由男人而出与日常生育中男人借女人而生并列，范围不限于婚姻关系；泛指译法也保留两性的相互关联。
- issue: 男女来源关系的不同介词
  choice: 分别译为“从男人而出”和“借着女人而生”
  alternative: 两处都笼统译作“来自”
  rationale: 原文刻意区分ἐκ所表示的来源与διά所表示的媒介，分别指向创造与生育；保留这一区别可避免抹平经文中的互补张力。
- issue: 最终来源的神学重心
  choice: 保留转折“但”，译作“但万有都是出于上帝”
  alternative: 弱化为并列的“而万有来自上帝”
  rationale: 此句把男女之间相互关联的论述归于上帝这一终极来源；保留温和转折可显出原文的收束与重心。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“怎样……也照样”保留原文平衡结构；“而出／而生”既增强汉语流畅度，也清楚区分创造来源与生育途径。
