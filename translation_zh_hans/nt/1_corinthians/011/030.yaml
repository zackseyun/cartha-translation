  text: διὰ τοῦτο ἐν ὑμῖν πολλοὶ ἀσθενεῖς καὶ ἄρρωστοι καὶ κοιμῶνται ἱκανοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/030.yaml
  text: For this reason many among you are weak and sick[a], and a good number have fallen asleep.
translation:
  language: zh_hans
  text: 因此，你们中间有许多人软弱、患病，也有不少人睡着了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“睡着了”是“死了”的委婉说法；保罗很可能沿用早期基督徒以睡眠比喻死亡的惯常表达。
    reason: 说明死亡隐喻，避免现代读者误解为普通睡眠。
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 因此
  rationale: 承接上文对主餐的错误对待，明确表达因果关系；“因此”简洁自然，不把因果弱化为一般推论。
- source_word: ἐν ὑμῖν
  choice: 你们中间
  rationale: 指哥林多信徒群体中出现的情形，而不是个人身体内部的状态。
- source_word: πολλοὶ
  choice: 有许多人
  rationale: 准确表达人数众多，并符合现代汉语习惯。
- source_word: ἀσθενεῖς
  choice: 身体软弱
  rationale: 在此语境中指身体衰弱；加上“身体”可避免被理解为信心或品格软弱，同时与后面的“患病”保持区别。
- source_word: ἄρρωστοι
  choice: 患病
  rationale: 表达实际疾病，并与较广义或程度较轻的“身体软弱”区分。
- source_word: κοιμῶνται
  choice: 睡着了
  rationale: 保留原文以睡眠指死亡的委婉比喻，不在正文中直接改写成“死了”；脚注说明其语境含义。
- source_word: ἱκανοί
  choice: 也不少
  rationale: 表示相当可观的数目，既自然，又避免机械重复前面的“许多人”。
theological_decisions:
- issue: κοιμῶνται应直译为睡眠，还是明确译为死亡
  choice: 正文保留“睡着了”的死亡隐喻
  alternative: 直接译作“死了”或按字面理解为普通睡眠
  rationale: 上下文谈到临到哥林多教会的审判，而“软弱—患病—睡着”形成递进，表明这里很可能委婉指死亡。保留隐喻可忠实呈现保罗的措辞，同时由脚注澄清。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“身体软弱、患病”保留两个希腊词的层次差异；“睡着了”保留原文隐喻，脚注标记紧接相关措辞。
