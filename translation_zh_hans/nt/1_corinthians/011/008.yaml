  yaml_path: translation/nt/1_corinthians/011/008.yaml
  text: For man is not from woman[a], but woman from man.
translation:
  language: zh_hans
  text: 因为男人不是出于女人[a]，女人却是出于男人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为丈夫不是出于妻子，妻子却是出于丈夫。”希腊语中的这两个词既可指“男人、女人”，也可指“丈夫、妻子”；这里采用较宽泛的、与创造有关的含义。
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: 因为
  rationale: 承接上文，为前述论点提供理由；现代汉语中“因为”自然、清楚。
- source_word: ἀνὴρ / ἀνδρός
  choice: 男人
  rationale: 在诉诸创造起源的语境中，指男性，与“女人”成对；同时保留其也可指“丈夫”的词义可能。
- source_word: γυναικός / γυνὴ
  choice: 女人
  rationale: 在创造起源的语境中，指女性，与“男人”成对；同时保留其也可指“妻子”的词义可能。
- source_word: ἐκ / ἐξ
  choice: 出于
  rationale: 表达来源或起源，比单用“从”更适合本句简洁而庄重的论述。
- source_word: ἀλλὰ
  choice: 却
  rationale: 清楚呈现两个分句之间的强烈对比，且符合自然现代汉语。
- source_word: ἐστιν
  choice: 是（融入“不是出于”结构）
  rationale: 希腊文系词在汉语中自然体现为“不是出于”，无需机械独译。
theological_decisions:
- issue: ἀνήρ/γυνή应译为“男人/女人”还是“丈夫/妻子”
  choice: 男人/女人
  alternative: 丈夫/妻子
  rationale: 上下文以创造中的来源为论据，因此较宽泛的“男人/女人”更能保留其创造论范围，不把陈述限缩为婚姻关系；脚注说明希腊词本身也容许配偶义。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“出于”准确表达起源关系；用“却”强化原文ἀλλά的对照。
