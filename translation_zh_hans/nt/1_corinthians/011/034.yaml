  text: ⸀εἴ τις πεινᾷ, ἐν οἴκῳ ἐσθιέτω, ἵνα μὴ εἰς κρίμα συνέρχησθε. Τὰ δὲ λοιπὰ ὡς ἂν ἔλθω διατάξομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/034.yaml
  text: If anyone is hungry[a], let him eat at home, so that you may not come together for judgment. And I will give directions about the rest when I come.
translation:
  language: zh_hans
  text: 若有人饿了，就该在家里吃，免得你们聚在一起招致审判[a]。其余的事，我来的时候再作安排。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“定罪”。希腊语κρίμα可指“审判”或“定罪”；这里译作“审判”，较符合紧邻的上下文，因为保罗所说的是主现今的管教，而不是最终的定罪（29—32节）。
    reason: lexical_alternative
lexical_decisions:
- source_word: πεινᾷ
  choice: 饿了
  rationale: 现在时直陈语气描述饥饿的状态；“饿了”是现代汉语自然、直接的表达。
- source_word: ἐν οἴκῳ
  choice: 在家里
  rationale: 这里指在个人的居所进食，与教会聚会时用餐相对；“在家里”符合现代汉语习惯。
- source_word: ἐσθιέτω
  choice: 就该……吃
  rationale: 第三人称现在时命令语气；“就该”在汉语中自然地表达劝令和规范性要求，同时承接“若有人”的条件句。
- source_word: εἰς κρίμα
  choice: 招致审判
  rationale: εἰς在此表达聚会所导致的结果，κρίμα可指审判或定罪；“招致审判”既传达警告的严肃性，也不把含义限定为最终定罪。
- source_word: συνέρχησθε
  choice: 你们聚在一起
  rationale: 该动词在本段反复用于信徒共同聚集；此译法自然，并保留与上下文中聚会主题的联系。
- source_word: Τὰ δὲ λοιπὰ
  choice: 其余的事
  rationale: 指尚未处理的其他事项；这一表达简明、庄重，也符合书信语境。
- source_word: ὡς ἂν ἔλθω
  choice: 等我来的时候
  rationale: 该结构表示将来时间未完全确定，但语境所指是保罗预期的来访；“等我来的时候”保留这种将来的时间关系。
- source_word: διατάξομαι
  choice: 我再作安排
  rationale: διατάσσω在此指安排、规定应当怎样处理；“作安排”适合尚待亲自处理的实际事务，“再”体现这些事项被留到来访时处理。
theological_decisions:
- issue: 圣餐聚会警告中κρίμα的含义
  choice: 译为“审判”，不明确限定为最终定罪
  alternative: 译为“定罪”或较宽泛的“裁决”
  rationale: 紧邻上文（29—32节）谈到主当前的审判与管教，并将之同“和世人一同被定罪”区别开来。“审判”保留原词的语义范围及经文本身的张力，避免加入原文未明说的最终定罪含义。
- issue: 不定代词τις与第三人称单数命令语气的表达
  choice: 用“若有人……就该……”的单数泛指结构
  alternative: 明说“就让他吃”或改用复数泛指
  rationale: 现代汉语可省略后句中已知的泛指主语；此结构忠实保留单数条件句和命令意味，同时避免不自然或容易被误解为专指男性的“他”。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“反倒招致审判”清楚呈现聚会本应造就人，却可能因不当行为带来审判的反向结果；“其余的事”与“再作安排”保持书信指示的简洁语气。脚注标记置于实际涉及歧义的“审判”之后。
