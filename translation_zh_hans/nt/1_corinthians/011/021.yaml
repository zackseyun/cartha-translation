  text: ἕκαστος γὰρ τὸ ἴδιον δεῖπνον προλαμβάνει ἐν τῷ φαγεῖν, καὶ ὃς μὲν πεινᾷ, ὃς δὲ μεθύει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/021.yaml
  text: For each one goes ahead with his own supper when it is time to eat, and one is hungry while another gets drunk.
translation:
  language: zh_hans
  text: 因为在用餐的时候，各人都先吃自己的饭[a]；有人挨饿，有人却喝醉了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“各人都在别人之前取用自己的饭。”希腊文动词既可强调预先取用，也可指不等别人便抢先进行。
    reason: lexical_alternative
  - marker: b
    text: 或译：“有人饿着，有人却已经醉了。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: 各人
  rationale: 保留希腊文逐一分配的单数意味，强调参与者各自的行为；现代汉语“各人”简洁自然，也不必添加原文没有明说的性别代词。
- source_word: γὰρ
  choice: 因为
  rationale: 本节说明上一节责备的缘由；“因为”在汉语中清楚表达这种解释关系。
- source_word: τὸ ἴδιον δεῖπνον
  choice: 自己的晚餐
  rationale: ἴδιον突出各人私有的食物，与共同聚餐的背景形成反差；δεῖπνον可指正餐或晚餐，此处译作“晚餐”既保留其通常时段，也呼应主的晚餐这一上下文。
- source_word: προλαμβάνει
  choice: 先吃
  rationale: 该动词可表示预先取用，也可表示抢先、不等别人便行动；“先吃”保留时间上的优先，同时不把究竟是‘在别人之前吃’还是‘不顾别人自行吃’限定得过死，另以脚注说明。
- source_word: ἐν τῷ φαγεῖν
  choice: 吃的时候
  rationale: 介词ἐν加冠词化不定式在这里表达时间；“吃的时候”贴近原文，又是自然的现代汉语。
- source_word: ὃς μὲν ... ὃς δὲ
  choice: 有人……有人却……
  rationale: 用汉语对应结构呈现群体中两类人彼此悬殊的处境，“却”突出反差。
- source_word: πεινᾷ
  choice: 挨饿
  rationale: 现在时描述有人在聚餐中仍然饥饿的状态；“挨饿”比单纯“饿了”更能自然表达因食物分配失衡而没有吃到，但不补充具体原因。
- source_word: μεθύει
  choice: 喝醉了
  rationale: μεθύω表示醉酒或变得醉酒；“喝醉了”直接呈现实际醉酒，不将其弱化为一般的吃喝过量。
theological_decisions:
- issue: 各自用餐与共同聚餐之间的张力
  choice: 各人都先吃自己的晚餐
  alternative: 各人都把自己的饭先吃了
  rationale: 译文保留ἴδιον所强调的私人占有，也保留προλαμβάνει可能指抢先或预先取用的语义空间，不额外断定当时聚餐的具体程序。
- issue: 圣餐聚会中醉酒行为的性质
  choice: 有人却喝醉了
  alternative: 有人却已经醉了
  rationale: 原文μεθύει明确涉及醉酒，不应淡化为一般的过量饮食；但其形式既可侧重进入醉态，也可侧重处于醉态，因此正文采用自然的动态表达，并在脚注保留状态性译法。
- issue: 分配性阳性单数在汉语中的表达
  choice: 各人……自己的
  alternative: 各人……他自己的
  rationale: 希腊文以阳性单数作泛指性的逐一陈述；现代汉语无需使用“他”也能准确保留单数分配关系，因而避免制造不必要的男性限定。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“晚餐”保留δεῖπνον的常见含义及上下文呼应；“先吃”避免过度解释聚餐程序。正文中的[a]、[b]均紧邻相关措辞，脚注顺序与正文一致。
