  text: τί γάρ ⸀μοι τοὺς ἔξω κρίνειν; οὐχὶ τοὺς ἔσω ὑμεῖς κρίνετε,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/012.yaml
  text: For what is it to me to judge outsiders? Is it not those inside that you are to judge?[a][b]
translation:
  language: zh_hans
  text: 审判教会外的人，与我有什么相干呢？[a] 教会内的人，岂不是你们应当审判的吗？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我何必审判教会外的人呢？”
    reason: lexical_alternative
  - marker: b
    text: “教会内的人”指属于教会群体的人。
    reason: cultural_note
lexical_decisions:
- source_word: τί γάρ μοι
  choice: 我何必
  rationale: 该习语询问某事与说话者有何关系、为何应由他说了算；“我何必”在现代汉语中自然地保留反问语气。γάρ承接上文的解释关系，在本句中无需机械译作“因为”。
- source_word: τοὺς ἔξω
  choice: 教会外的人
  rationale: 带冠词的ἔξω在此指基督徒群体之外的人；明说“教会”可避免被误解为物理空间之外，并与上下文的群体界线吻合。
- source_word: κρίνειν / κρίνετε
  choice: 审判
  rationale: κρίνω在本段涉及群体纪律与裁断。“审判”保留原词的力度和重复；“评判”较轻，“定罪”则过度限定。
- source_word: οὐχὶ
  choice: 岂不是……吗
  rationale: οὐχί引出预期肯定回答的反问；“岂不是……吗”准确保留这一语用力量，并符合庄重而通顺的书面汉语。
- source_word: τοὺς ἔσω
  choice: 教会内的人
  rationale: 与“教会外的人”形成清楚对照，所指是教会群体成员，而非单纯处于某个地点内部的人。
- source_word: ὑμεῖς κρίνετε
  choice: 你们……要审判
  rationale: 希腊文直陈式可作事实陈述，也可在语境中带责任或应当之意；“要审判”体现本段纪律责任，同时不把语气强化为绝对命令。
theological_decisions:
- issue: 内外之分是否专指教会纪律的范围
  choice: 将“内/外”明确呈现为教会群体内外，并保留“审判”的纪律性含义。
  alternative: 把本节理解为关于一切道德判断的普遍准则。
  rationale: 林前5:9–13的直接语境是教会如何处理群体内部公开而严重的罪，并将群体外的人交由神审判；译文不将其扩展为关于所有道德辨别的普遍断言。
- issue: ὑμεῖς κρίνετε是描述还是责任表达
  choice: 译为“你们……要审判”，保留反问中所含的责任意味。
  alternative: 译为“你们不是审判……吗”，较偏向描述既有实践。
  rationale: 直陈式本身允许描述性理解，但上下文的劝诫与纪律行动赋予其规范性；“要”能表达这一点，又不另加“必须”等更强措辞。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“教会外的人／教会内的人”使原文的群体性对照清楚；脚注标记均置于正文末尾。
