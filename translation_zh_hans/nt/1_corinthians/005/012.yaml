  naturalness: “审判教会外的人，与我有什么相干呢？”是现代标准汉语中自然、庄重的反问表达。“教会内的人，岂不是你们应当审判的吗？”语序清楚，保留反问所预期的肯定回答。
  terminology: 保留“审判”，以对应 κρίνειν／κρίνετε 在本段有关教会纪律的裁断含义；“教会外的人／教会内的人”恰当呈现 τοὺς ἔξω／τοὺς ἔσω 的群体对照，且不把它理解为物理位置。
  issues:
