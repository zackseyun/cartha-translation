  terminology: “逾越节”“羔羊”“献为祭”“弥赛亚”等术语一致且适切。“旧酵”和“无酵”保留逾越节及面团的关联，优于将其泛化为“旧酵母”。脚注b提供“基督”这一传统译名，处理得当。
