source:
  edition: SBLGNT
  text: ἐκκαθάρατε τὴν παλαιὰν ζύμην, ἵνα ἦτε νέον φύραμα, καθώς ἐστε ἄζυμοι. καὶ γὰρ τὸ πάσχα ⸀ἡμῶν ἐτύθη Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/007.yaml
  text: Clean out the old leaven[a], so that you may be a new batch, just as you are unleavened. For Messiah, our Passover lamb[b], has been sacrificed.
translation:
  language: zh_hans
  text: 你们要彻底清除旧酵，好使你们成为新的面团，正如你们本是无酵的。因为我们逾越节的羔羊[a]，就是弥赛亚[b]，已经被献为祭了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“我们的逾越节”；这里可理解为逾越节的羔羊或逾越节祭牲。
    reason: lexical_alternative
  - marker: b
    text: 希腊文 Christos，意为“受膏者”，传统译作“基督”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκκαθάρατε
  choice: 要彻底清除
  rationale: 该词是第二人称复数、不定过去时主动命令式，要求彻底除去某物；“要彻底清除”既体现命令语气，也传达前缀所加强的彻底性。
- source_word: παλαιὰν ζύμην
  choice: 旧酵
  rationale: “酵”保留逾越节与无酵饼的意象，也能自然承载败坏群体的隐喻；“旧”对应 παλαιὰν。
- source_word: ἵνα ἦτε νέον φύραμα
  choice: 好使你们成为新的面团
  rationale: ἵνα 引出目的或预期结果；φύραμα 指揉合成的一团面或面团。“新的面团”在现代汉语中清楚地延续发酵隐喻。
- source_word: καθώς ἐστε ἄζυμοι
  choice: 正如你们本是无酵的
  rationale: “正如”直接对应 καθώς；加入“本”自然表达现有身份，并保留命令他们成为新人团体与宣告他们已经无酵之间的张力。
- source_word: τὸ πάσχα ἡμῶν
  choice: 我们逾越节的羔羊
  rationale: πάσχα 字面为“我们的逾越节”，也可借代逾越节祭牲。因下文使用“被献为祭”，正文补出“羔羊”以使汉语明确，脚注保留原文的简约表达及其范围。
- source_word: ἐτύθη
  choice: 已经被献为祭了
  rationale: θύω 在这里指宰杀并献祭；被动式译为“被献为祭”，清楚保留祭祀含义。“已经……了”表达事件已经发生。
- source_word: Χριστός
  choice: 弥赛亚
  rationale: 在逾越节献祭的语境中，Χριστός 的称号意味突出；“弥赛亚”比名称化的“基督”更直接显明其称号意义。
theological_decisions:
- issue: πάσχα 与弥赛亚的关系
  choice: 我们逾越节的羔羊
  alternative: 我们的逾越节；我们逾越节的祭牲
  rationale: 原文只说“我们的逾越节”，但“被献为祭”表明这里指向逾越节祭牲。正文补出“羔羊”以符合自然汉语，脚注则说明原文措辞，避免把隐含内容误当作明说。
- issue: 伦理命令与既有身份的张力
  choice: 成为新的面团，正如你们本是无酵的
  alternative: 成为新的面团，因为你们是无酵的
  rationale: 保留 καθώς 的比较意味，也不消解保罗一面命令群体除去旧酵、一面宣告他们已经无酵的神学张力。
- issue: Χριστός 的称号意义
  choice: 弥赛亚
  alternative: 基督
  rationale: 本节的逾越节背景使受膏者称号的意义较为突出，因此译作“弥赛亚”；脚注提供传统译名。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“旧酵—新的面团—无酵”连续保留原文的烘焙与逾越节意象；用“彻底清除”体现命令的力度，用“本是”自然呈现劝诫与身份宣告并存的张力。
