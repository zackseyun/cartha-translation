  source_fidelity: 正文准确传达命令式“彻底清除”、目的/结果“好使……成为”、以及“正如……无酵”的比照关系。将τὸ πάσχα ἡμῶν在正文中译为“我们逾越节的羔羊”虽含有语境性补足，但与ἐτύθη（被献为祭）及上下文的逾越节意象相称；脚注也明确保留原文较简约的“我们的逾越节”。“弥赛亚”恰当地表达Χριστός在此的称号意义。
