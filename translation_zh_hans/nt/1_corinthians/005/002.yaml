  text: καὶ ὑμεῖς πεφυσιωμένοι ἐστέ, καὶ οὐχὶ μᾶλλον ἐπενθήσατε, ἵνα ⸀ἀρθῇ ἐκ μέσου ὑμῶν ὁ τὸ ἔργον τοῦτο ⸀ποιήσας;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/002.yaml
  text: And you are puffed up[a], and should you not rather have mourned, so that the one who did this deed might be removed from among you?
translation:
  language: zh_hans
  text: 你们竟然自高自大！难道不更应该哀痛，好让做这事的人从你们中间被除去[a]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从你们当中被带走。”按上下文，这很可能是指通过教会纪律将他从群体中除去。
    reason: 说明ἀρθῇ可指“被带走／除去”；结合本章上下文交代其较可能指向群体纪律，但不将正文限定为单一机制。
lexical_decisions:
- source_word: πεφυσιωμένοι
  choice: 自高自大
  rationale: 该词描写一种已经形成并持续的骄傲状态，字面含“膨胀”意象。现代汉语若直译为“膨胀”较生硬；“自高自大”自然、庄重，并保留保罗责备其骄傲的力度。
- source_word: οὐχὶ μᾶλλον
  choice: 难道不该反而
  rationale: 用反问表达责备和预期答案，并清楚对照他们实际的骄傲与本应有的悲痛。
- source_word: ἐπενθήσατε
  choice: 悲痛
  rationale: 此词指如同哀悼般强烈的忧伤；“悲痛”比一般的“难过”更能体现其严重程度，又适合群体性的反应。
- source_word: ἵνα ἀρθῇ
  choice: 好让……被除去
  rationale: 保留ἵνα所表达的目的或预期结果，也保留被动形式；“除去”既符合上下文，又没有在正文中把行动机制解释得过窄。
- source_word: ἐκ μέσου ὑμῶν
  choice: 从你们中间
  rationale: 直接保留群体内部的空间性表达，在上下文中自然指向此人不再留在群体之中。
- source_word: ὁ τὸ ἔργον τοῦτο ποιήσας
  choice: 做这事的人
  rationale: 自然简洁地表达实词化分词，指明行为人而不增加原文未明说的细节。
theological_decisions:
- issue: 对犯罪者所要求采取的行动性质
  choice: 从你们中间被除去
  alternative: 被逐出教会；被上帝取去
  rationale: ἀρθῇ本身可以较宽泛地表示“被拿走／除去”。本章后文强烈指向群体纪律和排除，但正文不直接加入“逐出教会”或认定这是上帝使其死亡，从而保留原文措辞的宽度与神学张力。
translation_notes:
  register: 采用现代标准普通话，语气庄重而直接。“竟然还”加强καί在责备语境中的反差；以感叹句接反问句，呈现保罗强烈的斥责。脚注标记置于“被除去”之后，与脚注实际解释的词语对应。
