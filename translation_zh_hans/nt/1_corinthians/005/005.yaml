  text: παραδοῦναι τὸν τοιοῦτον τῷ Σατανᾷ εἰς ὄλεθρον τῆς σαρκός, ἵνα τὸ πνεῦμα σωθῇ ἐν τῇ ἡμέρᾳ τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/005.yaml
  text: to hand such a man over to Satan for the destruction of the flesh[b][a], so that the spirit may be saved in the day of the Lord.
translation:
  language: zh_hans
  text: 把这样的人交给撒但，为了肉体的毁灭[a]，好让灵在主[b]的日子得救。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为了肉体的败坏。”这句话可能指身体受到严厉审判，也可能较具比喻性，指这人属肉体的、犯罪的取向被摧毁。
    reason: lexical_alternative
  - marker: b
    text: 有些抄本作“我们主耶稣的日子”或“主耶稣的日子”，而非仅作“主的日子”。
    reason: textual_variant
lexical_decisions:
- source_word: παραδοῦναι
  choice: 交给
  rationale: 准确表达把某人移交给另一方处置的含义；不额外说明具体执行方式。
- source_word: τὸν τοιοῦτον
  choice: 这样的人
  rationale: 既指向前文所说的具体犯错者，也保留原文带有归类意味的说法。
- source_word: τῷ Σατανᾷ
  choice: 撒但
  rationale: 采用现代中文圣经中通行的专名音译。
- source_word: εἰς ὄλεθρον
  choice: 使……遭到毁灭
  rationale: ὄλεθρος可指毁灭或败坏；此译保留其强烈语气，同时不限定毁灭的具体形式。
- source_word: τῆς σαρκός
  choice: 肉体
  rationale: 原文在身体受审判与属肉体、犯罪取向被摧毁之间存在真实歧义，因此不释作“罪性”等较明确的解释性用语。
- source_word: ἵνα
  choice: 好让
  rationale: 自然地表达原文的目的或预期结果。
- source_word: τὸ πνεῦμα
  choice: 灵
  rationale: 原文没有明说“他的”；中文省略所属关系，可避免加入原文未明示的代词。
- source_word: σωθῇ
  choice: 可以得救
  rationale: 保留被动语态及目的从句中所含的可能、预期意味。
- source_word: ἐν τῇ ἡμέρᾳ
  choice: 在……的日子
  rationale: 忠实表达末世性的时间短语，同时符合现代中文表达。
- source_word: τοῦ κυρίου
  choice: 主
  rationale: 依照SBLGNT正文译出，不将异文中的“耶稣”或“我们的”加入正文。
theological_decisions:
- issue: “肉体遭到毁灭”的含义
  choice: 正文保留“肉体遭到毁灭”这一有歧义的表达。
  alternative: 可理解为身体受到严厉审判甚至死亡，或这人属肉体、犯罪取向被摧毁。
  rationale: 原文没有明确限定是哪一种含义；译文不应替读者消除这项神学张力。
- issue: “灵”的所指
  choice: 译作“灵”，不补入“他的”。
  alternative: 译作“他的灵”。
  rationale: 上下文很可能指犯错者的灵最终得救，但希腊文没有使用明确的所有格代词。
- issue: “主的日子”的经文形式
  choice: 按正文译作“主的日子”。
  alternative: 部分抄本作“我们主耶稣的日子”或“主耶稣的日子”。
  rationale: 遵循所给SBLGNT正文，同时以脚注交代有意义的抄本异文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“这样的人”“交给撒但”“主的日子”清楚易懂；正文刻意不解释“肉体”和“灵”的确切所指，以保存原文的歧义。脚注标记分别紧接相关词语。
