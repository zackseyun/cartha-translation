id: 1CO.5.10
reference: 1 Corinthians 5:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ⸀οὐ πάντως τοῖς πόρνοις τοῦ κόσμου τούτου ἢ τοῖς πλεονέκταις ⸀καὶ ἅρπαξιν ἢ εἰδωλολάτραις, ἐπεὶ ⸀ὠφείλετε ἄρα ἐκ τοῦ κόσμου ἐξελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/010.yaml
  text: not at all meaning the sexually immoral of this world[a], or the greedy and swindlers, or idolaters[b], since then you would have to go out of the world.
translation:
  language: zh_hans
  text: 我所说的并不是泛指这世上的淫乱的人，或贪婪的人和掠夺者[a]，或拜偶像的人[b]；否则，你们就不得不离开这个世界了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “掠夺者”（ἅρπαξιν）也可译作“强盗”或“勒索者”；这个词可指以强力或剥削手段夺取他人财物的人。
    reason: lexical_alternative
  - marker: b
    text: 保罗是在澄清：他并不是说信徒必须避开教会外所有行为不道德的人。参哥林多前书5:11。
    reason: cross_reference
lexical_decisions:
- source_word: οὐ πάντως
  choice: 当然不是指
  rationale: 结合上文，这是保罗对先前吩咐范围的澄清，而非笼统否定；“当然不是指”自然表达强调和解释作用。
- source_word: πόρνοις
  choice: 淫乱的人
  rationale: 保留πόρνος所指的性方面的不道德行为，也采用现代中文圣经语体中清楚、简洁的表达。
- source_word: τοῦ κόσμου τούτου
  choice: 这世上
  rationale: κόσμος在此指教会之外的人类社会；“这世上”自然地保留其社会范围。
- source_word: πλεονέκταις
  choice: 贪婪的人
  rationale: 表示贪得无厌、企图多占的人；“贪婪的人”通俗明确，并可包含剥削意味。
- source_word: ἅρπαξιν
  choice: 掠夺者
  rationale: 该词可指凭强力或剥削夺取他人财物的人。“掠夺者”保留强取、侵占的核心意象，避免将含义限缩为单纯欺诈。
- source_word: εἰδωλολάτραις
  choice: 拜偶像的人
  rationale: 比名词化的“偶像崇拜者”更口语自然，同时准确表达敬拜偶像者。
- source_word: ἐπεὶ
  choice: 不然
  rationale: 在此引出若将前述要求绝对化便会产生的结果；“不然”简洁呈现反事实推论。
- source_word: ὠφείλετε
  choice: 你们就得
  rationale: 未完成时直陈语气在此论证中表达实际必要性；“就得”自然传达‘将不得不’的意思。
- source_word: ἐκ τοῦ κόσμου ἐξελθεῖν
  choice: 离开这个世界
  rationale: 保留原文鲜明而近乎夸张的说法：若完全避开社会中这类人，就只能退出世界。
theological_decisions:
- issue: 上下文中分别来往之命令的范围
  choice: 保罗澄清，他先前的吩咐并非要求信徒与社会中所有行为不道德的人彻底断绝来往。
  alternative: 保罗要求信徒与所有行为不道德的人完全隔绝。
  rationale: 本节以“当然不是指”及“否则就得离开世界”的推论明确限制先前吩咐的范围；译文保留这一澄清，不加入宗派性的社会隔绝主张。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“淫乱的人”保留性方面的明确含义；“拜偶像的人”避免生硬抽象名词；分号呈现理由与结论之间的推论关系。所有脚注标记均已置入正文。
