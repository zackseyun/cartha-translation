source:
  edition: SBLGNT
  text: τοὺς δὲ ἔξω ὁ θεὸς ⸀κρίνει; ⸀ἐξάρατε τὸν πονηρὸν ἐξ ὑμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/013.yaml
  text: But God judges those outside[c][b][a]. Remove the evil person from among yourselves.
translation:
  language: zh_hans
  text: 至于教会以外的人[a]，神审判他们[b]。你们要把那恶人从你们中间除掉[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“外人”。这里指教会群体以外的人。
    reason: lexical_alternative
  - marker: b
    text: 希腊文动词是现在时（“审判”）；有些译本按语境译作“将要审判”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“你们要把那邪恶的人从你们当中赶出去。”这句话呼应《申命记》中从盟约群体清除恶人的惯用公式。
    reason: cross_reference
lexical_decisions:
- source_word: τοὺς δὲ ἔξω
  choice: 至于教会以外的人
  rationale: 带冠词的副词ἔξω在这里作名词使用，指不属于教会群体的人。结合上一节，δὲ引出内外之别；“至于”在现代汉语中自然地承接这一对比，又不过度强化转折。补出“教会”是依据上下文作出的必要明示。
- source_word: κρίνει
  choice: 审判
  rationale: 保留希腊文现在时直陈语气，可理解为概括性的陈述：“神审判他们”；不因上下文而改译为将来时“神将要审判”。
- source_word: ἐξάρατε
  choice: 除掉
  rationale: 不定过去时命令语气要求采取明确、果断的行动。“除掉”既呼应申命记中的盟约清除用语，也没有添加原文未明说的后世教会程序术语。
- source_word: τὸν πονηρὸν
  choice: 那恶人
  rationale: 带冠词的单数阳性形容词名词化，结合本章具体事件，指那名作恶的人；“那恶人”保留具体指称及道德评价，并与申命记公式相呼应。
- source_word: ἐξ ὑμῶν αὐτῶν
  choice: 从你们中间
  rationale: 这是表示从群体内部移除的惯用表达。“从你们中间”清楚、自然，并保留群体性的含义。
theological_decisions:
- issue: 本节命令与教会纪律的性质
  choice: 译文表达会众应把那名作恶者从群体中除去，同时把对教会以外之人的审判留给神。
  alternative: 也可较宽泛地理解为从群体中清除邪恶，而不明确指正式排除某个人。
  rationale: 哥林多前书第5章的上下文针对教会内部一宗具体的淫乱事件，并将教会应判断的内部成员与由神审判的外人相对照。因此，这项命令涉及群体纪律；但译文不引入希腊原文没有的后世制度性术语。
- issue: 神审判外人的时间指向
  choice: 按κρίνει的现在时译为“神审判他们”。
  alternative: 依语境理解为末后审判，译作“神将要审判他们”。
  rationale: 希腊文形式是现在时，既可作概括性陈述，也可能在语境中含未来指向。正文保留其形式上的现在时，不排除末世审判的神学含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“教会以外的人”使上下文所指清楚，脚注保留更简练的“外人”。“除掉”语气明确，但避免添加“革除教籍”等制度性术语。各脚注标记均紧随其所说明的正文内容。
