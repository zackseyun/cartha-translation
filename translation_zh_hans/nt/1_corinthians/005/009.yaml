  text: 我曾在信中写给你们说，不要与淫乱的人交往。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔγραψα
  choice: 我……写过
  rationale: 不定过去时直陈语气表示已经发生的书写行为；“写过”在现代汉语中自然，同时不强行判定这是先前的一封信还是本信前文。
- source_word: ὑμῖν
  choice: （由语境隐含）给你们
  rationale: 希腊语与格代词指收信的哥林多人。汉语“我在信中写过”在当前语境下已自然包含写给受众之意，若直译为“我给你们在信中写过”则较生硬。
- source_word: ἐν τῇ ἐπιστολῇ
  choice: 在信中
  rationale: 保留特指书信的意思，却不加入原文没有的“先前那封”，从而不裁定究竟指一封较早的书信还是本信。
- source_word: μὴ συναναμίγνυσθαι
  choice: 不要……交往
  rationale: 该现在时中间语态不定式表达保罗所写吩咐的内容。“交往”自然地传达与人混在一起、保持往来的含义，又不将其限定为偶然接触。
- source_word: πόρνοις
  choice: 淫乱的人
  rationale: 该阳性复数名词指以性方面的不道德行为为特征的人。“淫乱的人”清楚、庄重，也比容易被理解为仅指某一种性行为的狭义译法更贴近原词范围。
theological_decisions:
- issue: “信”所指的是哪一封信
  choice: 正文译作“在信中”，不明确指定为先前遗失的信或《哥林多前书》本身
  alternative: 译作“在我先前的信中”或“在这封信中”
  rationale: ἐν τῇ ἐπιστολῇ 虽带定冠词，却不足以单独解决历史所指问题；译文应保留这一真实歧义。
translation_notes:
  register: 采用现代、庄重而通俗的书面汉语。“写过”保持叙述自然；“交往”避免古旧的“相交”，也不把命令夸大为禁止一切接触。所有原文的重要歧义均在正文与脚注中保留。
