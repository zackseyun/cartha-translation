  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: νῦν δὲ ἔγραψα ὑμῖν μὴ συναναμίγνυσθαι ἐάν τις ἀδελφὸς ὀνομαζόμενος ᾖ πόρνος ἢ πλεονέκτης ἢ εἰδωλολάτρης ἢ λοίδορος ἢ μέθυσος ἢ ἅρπαξ, τῷ τοιούτῳ μηδὲ συνεσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/011.yaml
  text: But now I wrote to you not to associate with anyone who is called a brother if he is sexually immoral or greedy or an idolater or abusive or a drunkard or a swindler—not even to eat with such a person.
translation:
  language: zh_hans
  text: 但如今我曾写信给你们：若有称为弟兄的人是淫乱的、贪婪的、拜偶像的、辱骂人的、醉酒的或掠夺人的，就不可与这样的人交往，甚至不可与他一同吃饭。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ ἔγραψα
  choice: 但现在我写信告诉你们
  rationale: 不定过去时ἔγραψα可指当前书信行为，汉语以“现在我写信”自然表达书信式过去时，同时保留νῦν δέ的转折。
- source_word: συναναμίγνυσθαι
  choice: 交往
  rationale: 指与人密切来往、混在一起；“交往”简洁自然，且由末句“一同吃饭”具体说明其边界。
- source_word: ἀδελφὸς ὀνομαζόμενος
  choice: 称为弟兄的人
  rationale: 保留“被称作/号称”的语义，不擅自判定此人是真信徒还是仅自称信徒。
- source_word: πόρνος
  choice: 淫乱的
  rationale: 指从事不合宜性行为的人；沿用庄重且为现代读者熟悉的圣经用语。
- source_word: πλεονέκτης
  choice: 贪婪的
  rationale: 表达贪得无厌、企图占有更多的品性，范围不局限于金钱。
- source_word: λοίδορος
  choice: 辱骂人的
  rationale: 该词指以侮辱、毁谤性言语攻击他人者；译为“辱骂人的”比抽象的“毁谤者”更直接易懂。
- source_word: μέθυσος
  choice: 醉酒的
  rationale: 在罪行清单中指惯于醉酒者；汉语形容结构与其他项目一致。
- source_word: ἅρπαξ
  choice: 勒索人的
  rationale: 指以强取、剥削或欺诈手段夺取他人财物的人；“勒索人的”突出掠夺性，避免与πλεονέκτης的“贪婪”重复。
- source_word: μηδὲ συνεσθίειν
  choice: 甚至不可与这样的人一同吃饭
  rationale: μηδέ有递进加强作用；直译共同进食，不预先把范围限定为圣餐或泛化为所有社交活动。
theological_decisions:
- issue: “称为弟兄”是否表示此人只是假冒信徒
  choice: 保留为“称为弟兄的人”
  alternative: “自称弟兄的人”
  rationale: 希腊文使用被动分词ὀνομαζόμενος，并未明确说是本人自称；保留措辞可维持其教会身份真伪上的张力。
- issue: “一同吃饭”是否专指圣餐
  choice: 按字面译作“一同吃饭”
  alternative: “一同领圣餐”
  rationale: 正文没有明确限定为主餐；不将可能的具体应用写成唯一解释。
- issue: 禁止交往的范围
  choice: 以条件句明确限于“称为弟兄”而持续具有所列恶行者
  alternative: 泛指所有犯过这些罪的人
  rationale: 句法重点在ἐάν τις ἀδελφὸς ὀνομαζόμενος ᾖ及其表语清单，不应扩展到教会外所有人或偶然跌倒者。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。罪行清单保持平行结构；“甚至不可”体现末句的强调。“但现在”承接上下文对先前书信的澄清。
