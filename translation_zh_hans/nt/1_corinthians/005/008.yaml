  text: ὥστε ἑορτάζωμεν, μὴ ἐν ζύμῃ παλαιᾷ μηδὲ ἐν ζύμῃ κακίας καὶ πονηρίας, ἀλλ’ ἐν ἀζύμοις εἰλικρινείας καὶ ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/008.yaml
  text: Therefore let us keep the feast[a], not with old leaven, nor with the leaven of malice and wickedness[b], but with the unleavened bread of sincerity and truth.
translation:
  language: zh_hans
  text: 所以，让我们守节[a]，不可用旧酵，也不可用恶意和邪恶的酵，而要用真诚和真理的无酵饼[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“让我们庆祝”或“让我们过节”。希腊文延续了上一节的逾越节意象。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译“真诚和真理的无酵之物”；这里按逾越节语境补出“饼”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: 所以
  rationale: 承接上一节作出推论；“所以”自然清楚地保留了逻辑关系。
- source_word: ἑορτάζωμεν
  choice: 让我们守这节期
  rationale: 现在时劝勉虚拟语气表达共同劝勉；“守这节期”既符合现代汉语，也保留上下文的逾越节意象。
- source_word: ζύμῃ παλαιᾷ
  choice: 用旧酵
  rationale: “酵”准确保留逾越节及除酵的经文意象；介词 ἐν 在这里按汉语习惯译为“用”。
- source_word: κακίας
  choice: 恶意
  rationale: 在恶德语境中可指恶念、恶意；此译法也与后面的 πονηρίας 保持区别。
- source_word: πονηρίας
  choice: 邪恶
  rationale: 表达广义的道德败坏，与“恶意”形成相关但不完全重叠的一对。
- source_word: ἀζύμοις
  choice: 无酵饼
  rationale: 原文为名词化形容词“无酵的〔东西〕”；结合逾越节语境，正文补出“饼”以使意象在汉语中清楚，并用脚注说明。
- source_word: εἰλικρινείας
  choice: 纯真
  rationale: 表达纯正、不掺杂和真诚的品格，与酵所象征的败坏形成对照。
- source_word: ἀληθείας
  choice: 真理
  rationale: 直接保留该词既可涉及真实、诚实，也可涉及真理的语义张力；此处不缩窄为单纯“诚实”。
theological_decisions:
- issue: 保罗劝勉中的逾越节和守节意象
  choice: 将 ἑορτάζωμεν 译为“守这节期”，将 ἀζύμοις 译为“无酵饼”
  alternative: 译作“让我们庆祝”，并将后半句抽象化为“以纯真和真理”
  rationale: 上一节提到逾越节的祭牲，故本节继续运用守节和无酵的意象。保留该意象能呈现保罗论证的连贯性，同时不把劝勉限定为实际遵守某一宗教节期。
- issue: εἰλικρινείας καὶ ἀληθείας 的范围
  choice: 译为“纯真和真理”
  alternative: 译为“诚恳和诚实”
  rationale: 原文既描述与败坏相反的品格，也保留“真理”的客观意味；译文不将两词都缩减为主观诚实。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“守这节期”保留经文意象但避免古奥；“酵／无酵饼”沿用汉语圣经语境中清楚且熟悉的表达。所有补足和主要词义替代均以脚注交代。
