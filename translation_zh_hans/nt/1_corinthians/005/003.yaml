id: 1CO.5.3
reference: 1 Corinthians 5:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν γάρ, ⸀ἀπὼν τῷ σώματι παρὼν δὲ τῷ πνεύματι, ἤδη κέκρικα ὡς παρὼν τὸν οὕτως τοῦτο κατεργασάμενον
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/003.yaml
  text: For I[a], though absent in body but present in spirit, have already judged, as though present[b], the one who has done this thing.
translation:
  language: zh_hans
  text: 因为我身体虽不在场，灵里却在场[a]，已经像亲自在场一样，审判了[b]那个做出这种事的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灵里却在场”很可能是指保罗自己的灵，而不是圣灵。
    reason: lexical_alternative
  - marker: b
    text: 或译：“已经作出了判决。”
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: 因为
  rationale: 保留本句对上文的解释性连接，并符合现代汉语的自然表达。
- source_word: ἀπὼν τῷ σώματι
  choice: 身体虽不在场
  rationale: 以“身体”表达所指方面，以“不在场”保持与后文“在场”的鲜明对照，同时避免让人误解为死亡或灵魂离体。
- source_word: παρὼν δὲ τῷ πνεύματι
  choice: 灵里却在场
  rationale: 保留原文“身体／灵”的简洁对照；不在正文中明确判定是保罗自己的灵还是圣灵。
- source_word: ἤδη κέκρικα
  choice: 已经……审判了
  rationale: “已经”体现完成时所表达的判断已经作出且仍然有效；“审判”紧贴κρίνω在教会纪律语境中的司法性语气。
- source_word: ὡς παρὼν
  choice: 像亲自在场一样
  rationale: 自然传达ὡς的比较意味，并说明保罗的审判如同他本人在场时所作；“亲自”在汉语中明确这里所说的是本人在场。
- source_word: τὸν ... κατεργασάμενον
  choice: 那个……做出……的人
  rationale: 将实词化分词译为“那个……的人”，不额外加入原文没有明说的性别称谓。
- source_word: οὕτως τοῦτο
  choice: 这种事
  rationale: “这种事”在现代汉语中自然地兼顾τοῦτο所指的行为和οὕτως所含“如此”的性质，避免生硬的“以这种方式做了这事”。
- source_word: μὲν ... δὲ
  choice: 虽……却……
  rationale: 自然呈现身体不在场与灵里在场之间的对照，不机械照搬希腊语虚词结构。
theological_decisions:
- issue: “灵里却在场”的所指
  choice: 正文保留“灵里”的表达，不明说是保罗自己的灵还是圣灵；脚注说明前者较为可能。
  alternative: 译成“借着圣灵却在场”，或把它解释为一种更强的神秘临在。
  rationale: 身体与灵的直接对照最自然地指保罗本人虽身体缺席，却在灵里与会众同在；但原文没有冠词，译文不应把这一解释绝对化或把特定的临在理论写进正文。
- issue: 保罗所作判断的力度
  choice: 译作“审判了”，保留司法性和教会纪律语境。
  alternative: 译作较弱的“判断了”或较明确的“已经作出了判决”。
  rationale: κρίνω在本段具有纪律处分的语境，但具体执行方式由后文说明，本节不宜过度展开。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“身体虽不在场，灵里却在场”保留原文的平行对照；整句维持保罗已经作出判断的坚定语气，同时不把“灵里在场”的性质解释得超过原文。
