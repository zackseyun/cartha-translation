review_pass:
  verdict: revise
  source_fidelity: 草稿基本传达了“奉……的名”、会众聚集、保罗的灵参与，以及主耶稣的能力。然而，σὺν τῇ δυνάμει更直接表示与该能力相伴／凭借该能力，而非“能力也同在”；且属格独立结构将“你们”和“我的灵”并列在同一聚集情境中，正文宜更清楚保留这一紧凑关系。
  naturalness: “并有我们主耶稣的能力同在”在现代汉语中重复“同在”，并容易将能力表述为另一位临在者，读来不够自然。改为“凭着我们主耶稣的能力”更顺畅，也更贴合此处为下一节行动提供的能力／凭借语境。
  terminology: “奉我们主耶稣的名”“主”“耶稣”“我的灵”均合乎庄重、通行的现代汉语圣经用语。保留“我的灵”，不把πνεῦμα解释为“心意”。
  issues:
  - severity: medium
    issue: 将σὺν τῇ δυνάμει译为“并有……能力同在”。
    rationale: σύν在此连接聚集情境与“我们主耶稣的能力”，更自然地表达伴随或凭借；“能力同在”既弱化这种句法关系，也在汉语中造成与“我的灵同在”的不必要重复。
  - severity: low
    issue: “我的灵也与你们同在”未充分显出原文与“你们聚集”共享的紧凑属格独立结构。
    rationale: 该译法本身可成立，也与英文审计轨迹一致；但改作“你们聚集、我的灵也在场时”能更清楚显示两项都构成时间性聚集场景，同时不界定保罗非肉身参与的机制。
  revised_text: 奉我们主耶稣的名，当你们聚集、我的灵也在场时，凭着我们主耶稣的能力，
