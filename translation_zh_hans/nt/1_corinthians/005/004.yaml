- from: 奉我们主耶稣的名，你们聚集的时候，我的灵也与你们同在[a]，并有我们主耶稣的能力同在，
  to: 奉我们主耶稣的名，当你们聚集、我的灵也在场时，凭着我们主耶稣的能力，
  rationale: 修订以“当你们聚集、我的灵也在场时”呈现原文并列的属格独立结构，以“凭着我们主耶稣的能力”表达σὺν τῇ δυνάμει的伴随／凭借关系。句末保留逗号，因为本节在原文中继续引向下一节的主要行动。
