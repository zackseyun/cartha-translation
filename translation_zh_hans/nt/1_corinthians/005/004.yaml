  text: ἐν τῷ ὀνόματι τοῦ κυρίου ἡμῶν ⸀Ἰησοῦ, συναχθέντων ὑμῶν καὶ τοῦ ἐμοῦ πνεύματος σὺν τῇ δυνάμει τοῦ κυρίου ἡμῶν ⸁Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/004.yaml
  text: In the name of our Lord Jesus[a], when you are assembled, and my spirit is with you, with the power of our Lord Jesus,
translation:
  language: zh_hans
  text: 奉我们主耶稣的名，当你们聚集、我的灵也在场时，凭着我们主耶稣的能力，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῷ ὀνόματι
  choice: 奉……的名
  rationale: 这是现代汉语中自然、庄重的圣经用语，既保留“名”的表达，也可承载凭其权柄行事的含义，而不将该含义直接释入正文。
- source_word: κυρίου
  choice: 主
  rationale: “主”准确保留 κύριος 在新约中的称号性质及其基督论分量。
- source_word: Ἰησοῦ
  choice: 耶稣
  rationale: 采用现代汉语通行的人名译法。
- source_word: συναχθέντων ὑμῶν
  choice: 你们聚集的时候
  rationale: 将不定过去时被动分词的属格独立结构译为时间从句，符合汉语习惯，也保留聚集举行共同会议的程序性语境。
- source_word: τοῦ ἐμοῦ πνεύματος
  choice: 我的灵也与你们同在
  rationale: 原文以“我的灵”与“你们”并列，表达紧缩；补出“与你们同在”可在汉语中清楚表达保罗非肉身的参与，同时不界定其具体机制。
- source_word: σὺν
  choice: 并有……同在
  rationale: 在此表达伴随关系；用“并有……同在”自然连接主耶稣的能力与聚集中的行动。
- source_word: δυνάμει
  choice: 能力
  rationale: “能力”保留 δύναμις 所指实际发挥作用的力量，不将其限缩为单纯的正式权柄。
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: 我们主耶稣的
  rationale: 保留属格的宽泛关系，不强行判定为来源、所有或代理中的某一种。
theological_decisions:
- issue: 保罗的灵如何参与哥林多信徒的聚集
  choice: 译作“我的灵也与你们同在”，肯定一种非肉身的同在，却不解释其形而上机制。
  alternative: 可理解为保罗的心意或态度与他们一致，也可理解为更强意义上的属灵临在。
  rationale: 原文宣称保罗虽不在现场，他的灵仍参与其中，但没有说明这种参与具体如何发生；译文保留这一神学张力。
- issue: “奉我们主耶稣的名”与上下文的句法连接
  choice: 按本节标点将其置于聚集场景之前，同时保留未完句式，使其可与下一节的主要行动衔接。
  alternative: 该短语也可更直接修饰“聚集”，或修饰下一节“交付”一类的主要动词。
  rationale: 希腊文词序和连续句法容许不同的修饰范围；不在译文中增添解释性动词，以免消除这种歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“奉……的名”沿用普通读者熟悉的表达；“我的灵”避免把 πνεῦμα 弱化为单纯的“心意”。本节在希腊文中是跨节延续的未完结构，因此结尾保留逗号。
