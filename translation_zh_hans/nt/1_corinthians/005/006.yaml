id: 1CO.5.6
reference: 1 Corinthians 5:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Οὐ καλὸν τὸ καύχημα ὑμῶν. οὐκ οἴδατε ὅτι μικρὰ ζύμη ὅλον τὸ φύραμα ζυμοῖ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/006.yaml
  text: Your boasting is not good[a]. Do you not know that a little leaven leavens the whole batch of dough?
translation:
  language: zh_hans
  text: 你们的自夸并不好。难道你们不知道，一点酵能使整团面[a]都发起来吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“全团面团”。
    reason: φύραμα 可译作“面团”；正文采用较自然简洁的“整团面”，脚注列出更明确的词汇表达。
lexical_decisions:
- source_word: καλὸν
  choice: 好
  rationale: 这里的 καλόν 是对哥林多人自夸之举的评价；“好”直接、自然，并保留原文较宽泛的道德与实际判断。
- source_word: καύχημα
  choice: 自夸
  rationale: 该名词可指夸耀的行为或所夸的事；本句重在责备他们的态度，“自夸”在现代汉语中简洁自然。
- source_word: οὐκ οἴδατε
  choice: 难道你们不知道
  rationale: 保留保罗常用的反问句式及责问语气，不弱化为单纯的“没有意识到”。
- source_word: μικρὰ ζύμη
  choice: 一点酵
  rationale: “一点”体现微小的量，“酵”保留古代发面的意象及其比喻色彩，比直接释作罪恶或败坏更忠于本节措辞。
- source_word: ὅλον τὸ φύραμα
  choice: 整团面
  rationale: φύραμα 指揉和成团的面；“整团面”既表达其具体所指，也保留 ὅλον 所强调的整体性。
- source_word: ζυμοῖ
  choice: 使……都发起来
  rationale: 该动词意为使面受酵而发；汉语用“使……发起来”比生硬仿造“酵化”自然，“都”进一步传达作用遍及全团。
theological_decisions:
- issue: 酵的比喻所指
  choice: 保留酵使整团面发起来的比喻，不在正文中明说它等同于罪或败坏。
  alternative: 解释性扩译为“一点罪就会败坏整个教会”。
  rationale: 原文本身采用一句格言式比喻，其具体应用由上下文说明；不在本节中替作者补出单一解释，可保留原文的形象、张力和适用范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“并不好”保留责备而不过度强化；“难道你们不知道”呈现原文反问语气。脚注标记紧跟其所说明的“整团面”。
