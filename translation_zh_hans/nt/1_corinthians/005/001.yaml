revisions:
- from: 竟然听说你们中间有淫乱的事，而且是连非犹太人[a]中也没有的那种淫乱：有人竟占有自己父亲的妻子。[b]
  to: 确实听说你们中间有淫乱的事，而且是连非犹太人[a]中也没有的那种淫乱：有人与自己父亲的妻子有性关系。[b]
  rationale: 仅修正“占有”这一不自然且可能失真的表达，并相应调整脚注以说明原文“有”的委婉说法。将开头改为“确实听说”，更清楚地呈现ὅλως对传闻事实性的强调；不改变经文关于行为性质、妇人身份或关系形式所保留的不确定性。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:51:52Z'
review_pass:
  verdict: revise
  source_fidelity: “占有自己父亲的妻子”将ἔχειν误导为所有权或支配关系，在现代汉语中既不自然，也未能准确传达此处委婉指涉的性关系。改为“与自己父亲的妻子有性关系”明确表达上下文所指，且不擅自断定婚姻或同居状态。其余主要对应关系忠实：ὅλως译为“确实”表达强调，ἀκούεται译为“听说”，ἔθνεσιν译为中性的“非犹太人”，并保留“父亲的妻子”而不在正文断定为继母。
  naturalness: 修订后的句子在现代庄重书面汉语中通顺。“确实听说”比“竟然听说”更清晰地区分消息确实流传与说话者的震惊；震惊和谴责仍由“连……也没有的那种淫乱”充分体现。
  terminology: “淫乱”可对应此处广义的πορνεία，语体庄重且与经文传统用语相容。“非犹太人”准确、中性；脚注保留“外邦人”“列国的人”和“异教徒”等替代译法的说明。“父亲的妻子”避免将γυναῖκα…τοῦ πατρὸς过度具体化为“继母”。
  issues:
  - severity: medium
    issue: “占有自己父亲的妻子”不适合作为ἔχειν的汉语表达。
    rationale: 汉语“占有”通常表示财产、资源或支配性拥有，容易把人客体化，并不能自然表达此处由πορνεία界定的性关系。原文虽使用委婉的“有”，但语境明确其性含义；正文宜译出“有性关系”，同时不添加婚姻、同居等未明说的细节。
  - severity: low
    issue: “竟然听说”对ὅλως与ἀκούεται的关系略显含混。
    rationale: 它可被理解为说话者意外地得知消息，而不只是强调该消息确实在流传。“确实听说”更直接反映“actually/in fact is reported”；全句的比较结构仍保留原文的震惊语气。
  revised_text: 确实听说你们中间有淫乱的事，而且是连非犹太人[a]中也没有的那种淫乱：有人与自己父亲的妻子有性关系。[b]
