  text: Ὅλως ἀκούεται ἐν ὑμῖν πορνεία, καὶ τοιαύτη πορνεία ἥτις οὐδὲ ἐν τοῖς ⸀ἔθνεσιν, ὥστε γυναῖκά τινα τοῦ πατρὸς ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/001.yaml
  text: 'It is actually reported that there is sexual immorality among you, and sexual immorality of such a kind as is not even found among the Gentiles: a man has his father’s wife.'
translation:
  language: zh_hans
  text: 确实听说你们中间有淫乱的事，而且是连非犹太人[a]中也没有的那种淫乱：有人与自己父亲的妻子有性关系。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“外邦人”或“列国的人”；这里指非犹太人。有些译本译作“异教徒”。
    reason: lexical_alternative
  - marker: b
    text: 直译“有自己父亲的妻子”；这里指与父亲的妻子有性关系。她可能是他的继母。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅλως
  choice: 竟然
  rationale: 此处用来加强语气，表达保罗对所听之事的震惊；“竟然”比数量意义的“完全”更符合上下文，也符合现代汉语。
- source_word: ἀκούεται
  choice: 听说
  rationale: 这个被动式表示有关此事的消息已经传开；汉语用无主句“听说”自然简洁。
- source_word: ἐν ὑμῖν
  choice: 你们中间
  rationale: 指事情发生在哥林多信徒群体之内，保留其群体性的含义。
- source_word: πορνεία
  choice: 淫乱的事
  rationale: πορνεία泛指不合正当规范的性行为；“淫乱”庄重、明确，也不把含义缩窄为某一种特定行为。
- source_word: τοιαύτη πορνεία
  choice: 那种淫乱
  rationale: 保留τοιαύτη强调其性质和严重程度的作用，同时避免生硬重复。
- source_word: οὐδὲ ἐν τοῖς ἔθνεσιν
  choice: 连非犹太人中也没有
  rationale: ἔθνη在保罗的犹太—基督徒语境中通常指非犹太民族。“非犹太人”是现代汉语中清楚而中性的表达；“没有”自然补足希腊文省略的谓语，但不增添“普遍找不到”等更强含义。
- source_word: ὥστε
  choice: 冒号
  rationale: 这里引出前述淫乱的具体内容，汉语用冒号最自然；若译作“以致”容易误解为结果关系。
- source_word: γυναῖκά τινα τοῦ πατρὸς
  choice: 自己父亲的妻子
  rationale: 忠实保留希腊文的亲属表达，不直接改成“继母”，因为原文没有使用专门的继亲称谓。
- source_word: ἔχειν
  choice: 占有
  rationale: ἔχω在此并非普通的财物所有，而是以某女子为性伴侣或妻子的委婉表达。“占有”保留原文简短而强烈的措辞；脚注说明其语境含义，以免按一般所有关系理解。
theological_decisions:
- issue: ἔθνεσιν应译作族群称谓还是带评价色彩的宗教称谓
  choice: 非犹太人
  alternative: 外邦人；异教徒；列国的人
  rationale: 原词在此主要标明犹太人与其他民族之间的区别，本身不必带有“异教徒”的贬义。“非犹太人”在现代汉语中最清楚、中性。
- issue: 是否在正文中把父亲的妻子明确称为继母
  choice: 自己父亲的妻子
  alternative: 自己的继母
  rationale: 她很可能是此人的继母，但原文只说“父亲的妻子”。保留原有说法，避免加入文本未明说的家庭关系细节。
- issue: 是否把ἔχειν完全解释为同居或发生性关系
  choice: 占有，并以脚注解释
  alternative: 与……同居；与……有性关系；娶了……
  rationale: 上下文明确涉及性关系，但原词没有具体说明婚姻手续、居住状态或行为形式。正文保留委婉和张力，脚注提供必要说明。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“竟然”传达保罗的震惊，“淫乱”保留伦理分量；句式尽量贴近希腊文的递进和揭示结构。所有解释性增补均限于汉语表达所需，涉及身份和关系的不确定处放入脚注。
