  text: βλέπετε δὲ μή πως ἡ ἐξουσία ὑμῶν αὕτη πρόσκομμα γένηται τοῖς ⸀ἀσθενέσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/009.yaml
  text: But take care that this right of yours does not somehow become a stumbling block to the weak[a][b].
translation:
  language: zh_hans
  text: 不过，你们要谨慎，以免你们的这项权利成为软弱之人的绊脚石[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你们的这项自由”。这里的希腊词可指“权柄”“权利”或“自由”；本节是指一些信徒所主张的、吃与偶像有关之食物的自由。
    reason: lexical_alternative
  - marker: b
    text: 这里的“软弱之人”，是指在这件事上良心软弱的人。
    reason: cultural_note
lexical_decisions:
- source_word: βλέπετε
  choice: 要谨慎
  rationale: 该命令式要求警醒防范；“要谨慎”在现代汉语中自然，并保留劝诫语气。
- source_word: δὲ
  choice: 不过
  rationale: 表示从前文转入带有轻微转折的警告；“不过”比强烈的“但是”更贴合此处语气。
- source_word: μή πως
  choice: 免得……竟
  rationale: 引出应当防范的可能结果；“免得”准确表达否定性预防，“竟”传达πως所含的意外或某种可能性。
- source_word: ἡ ἐξουσία ὑμῶν αὕτη
  choice: 你们的这项权利
  rationale: 上下文指一些信徒所主张的、吃与偶像有关之食物的自由或权利。“这项权利”具体而自然，同时以脚注保留“自由”等词义可能。
- source_word: πρόσκομμα
  choice: 绊脚石
  rationale: 保留原文使人绊倒的隐喻，指促使人在信仰或良心上跌倒的事物，也是现代中文可理解的表达。
- source_word: γένηται
  choice: 成了
  rationale: 简洁表达“成为、变成”，符合警戒从句中的可能结果。
- source_word: τοῖς ἀσθενέσιν
  choice: 软弱之人
  rationale: 保持原文简洁，不在正文中把软弱明确限定为身体、灵性或良心层面；本章语境及脚注说明其所指。
theological_decisions:
- issue: ἐξουσία在本节中的含义
  choice: 指哥林多人就祭偶像之物所主张的权利
  alternative: 泛指权柄、能力，或译为自由
  rationale: 本章直接讨论是否可以吃与偶像有关的食物；“权利”能呈现具体伦理主张，又不暗示制度性权柄。脚注保留“自由”这一真实词义可能。
- issue: τοῖς ἀσθενέσιν所指
  choice: 正文译作“软弱之人”，由上下文和脚注说明是此事上良心软弱的人
  alternative: 在正文直接译作“良心软弱的人”或泛指所有软弱者
  rationale: 原文本身只说“软弱的人”，但本章上下文将这种软弱与良心相连。正文保留简洁和一定程度的含混，脚注提供语境说明，避免把解释完全写入译文。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“免得……竟”保留警告某种可能后果的语气；“绊脚石”保留保罗原有的道德与属灵跌倒隐喻。所有脚注标记均已置于正文。
