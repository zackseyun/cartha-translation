  text: ἐὰν γάρ τις ἴδῃ σὲ τὸν ἔχοντα γνῶσιν ἐν εἰδωλείῳ κατακείμενον, οὐχὶ ἡ συνείδησις αὐτοῦ ἀσθενοῦς ὄντος οἰκοδομηθήσεται εἰς τὸ τὰ εἰδωλόθυτα ἐσθίειν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/010.yaml
  text: For if someone sees you[a], who have knowledge, reclining in an idol’s temple, will not his conscience, being weak, be built up to eat food sacrificed to idols?
translation:
  language: zh_hans
  text: 因为，若有人看见你这有知识的人在偶像庙里坐席，那软弱之人的良心岂不会被造就[a]，以致去吃祭过偶像的食物吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被造就”也可按语境意译为“受到鼓动”或“壮起胆来”。原文直译为“被建造”，沿用保罗常说的“建造、造就”用语，在这里可能带有反讽意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: 因为
  rationale: 承接上文，为先前的警告提供理由或具体说明，保持论证关系。
- source_word: ἐὰν…τις ἴδῃ
  choice: 如果有人看见
  rationale: ἐὰν加虚拟语气构成假设条件；现代汉语用“如果……看见”自然表达。
- source_word: σὲ τὸν ἔχοντα γνῶσιν
  choice: 你这有知识的人
  rationale: 保留定冠词分词结构对受话者的指认和强调，也维系本章“知识”这一主题词。
- source_word: ἐν εἰδωλείῳ
  choice: 在偶像庙里
  rationale: εἰδωλεῖον指与偶像祭祀有关的庙宇或神殿；“偶像庙”简明且符合中文表达。
- source_word: κατακείμενον
  choice: 坐席
  rationale: 该词描写用餐时斜倚席上的姿态；“坐席”在现代中文中自然传达在筵席上用餐的场景，又不必生硬直译古代姿势。
- source_word: ἡ συνείδησις αὐτοῦ ἀσθενοῦς ὄντος
  choice: 他既然软弱，他的良心
  rationale: 把ἀσθενοῦς理解为描述那个人，而非直接修饰“良心”；中文调整语序以清楚表达其状态，同时保留“良心”这一关键词。
- source_word: οὐχὶ
  choice: 岂不会
  rationale: 保留预期肯定回答的反问语气。
- source_word: οἰκοδομηθήσεται
  choice: 被“建造”起来
  rationale: 保留字面的建造/造就用语及其在此处的反讽张力；引号提示这里不是正面的属灵造就，脚注补充语境义。
- source_word: εἰς τὸ τὰ εἰδωλόθυτα ἐσθίειν
  choice: 去吃祭过偶像的食物
  rationale: 表达该结构所含的结果或趋向，并准确传达εἰδωλόθυτα。
theological_decisions:
- issue: 在有害模仿的语境中如何翻译οἰκοδομηθήσεται
  choice: 被“建造”起来
  alternative: 受到鼓动／壮起胆来
  rationale: 原文使用保罗通常表示建造、造就的词，在这里很可能带反讽。正文保留这一词汇和神学张力，不把它直接化解为解释性译法；脚注说明实际效果。
- issue: ἀσθενοῦς ὄντος所描述的对象
  choice: 他既然软弱
  alternative: 他软弱的良心
  rationale: 属格形式首先与αὐτοῦ所指的人一致，可理解为那人处于软弱状态；本译文不把语法关系收窄为仅仅“良心软弱”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你这有知识的人”保留原文对自认有知识者的直接指认；“坐席”清楚呈现庙中筵席场景。正文中的脚注标记置于整句之后。
