revisions:
- from: 然而，并不是人人都有这种知识。有些人直到如今对偶像仍有旧习[a][b]，吃的时候仍把这食物当作祭过偶像的；他们的良心既然软弱，就被玷污了。
  to: 然而，并不是人人都有这种知识。有些人由于至今仍保留着与偶像有关的旧习[a]，就把这食物当作祭给偶像之物来吃；他们软弱的良心就被玷污了[b]。
  rationale: 修改“旧习”短语，使现代汉语搭配自然，并以“与偶像有关”保留原文属格短语的歧义；脚注继续交代更直译的可能及语境解释。将“良心既然软弱”改为“软弱的良心”，更贴近原文分词作描述性定语的功能。
