  text: Ἀλλ’ οὐκ ἐν πᾶσιν ἡ γνῶσις· τινὲς δὲ τῇ ⸀συνηθείᾳ ⸂ἕως ἄρτι τοῦ εἰδώλου⸃ ὡς εἰδωλόθυτον ἐσθίουσιν, καὶ ἡ συνείδησις αὐτῶν ἀσθενὴς οὖσα μολύνεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/007.yaml
  text: But not everyone has this knowledge[a]. Some, through familiarity with the idol until now, eat it as food sacrificed to an idol, and their conscience, being weak[b], is defiled.
translation:
  language: zh_hans
  text: 然而，并不是人人都有这种知识。有些人由于至今仍保留着与偶像有关的旧习[a]，就把这食物当作祭给偶像之物来吃；他们软弱的良心就被玷污了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “由于至今仍保留着与偶像有关的旧习”：原文结构较难理解，也可较直译为“由于直到如今对偶像的习惯（或熟悉）”。意思可能是他们至今仍受从前与偶像崇拜之关系的影响。
    reason: lexical_alternative
  - marker: b
    text: 有些抄本在这里读作“对偶像的良心（或意识）”，或有相关异文；正文依照SBLGNT所采用的读法。
    reason: textual_variant
lexical_decisions:
- source_word: γνῶσις
  choice: 知识
  rationale: 保留保罗在上下文中反复使用的“知道／知识”这一概念，指认识到偶像算不得什么等真理。
- source_word: συνήθεια
  choice: 旧习
  rationale: 此词可指习惯、惯常联系或熟悉；结合偶像崇拜的语境，“旧习”简洁表达他们至今仍受以往与偶像之关系的影响，同时以脚注保留原文的难解之处。
- source_word: ἕως ἄρτι τοῦ εἰδώλου
  choice: 直到如今对偶像仍有
  rationale: 明确保留ἕως ἄρτι“直到如今”的时间含义，并把属格短语自然地连接到“旧习”，不把困难句法解释得过死。
- source_word: εἰδωλόθυτον
  choice: 祭过偶像的
  rationale: 表达该食物曾用于献祭偶像，也与“把……当作”结合，显示这里涉及进食者对食物祭祀性质的看法。
- source_word: συνείδησις
  choice: 良心
  rationale: 采用保罗伦理论述中的常用译法，指人的道德意识与判断。
- source_word: ἀσθενής
  choice: 软弱
  rationale: 保留本章“软弱”这一核心用语，指良心在此事上尚不坚固，并非泛指性格脆弱。
- source_word: μολύνεται
  choice: 被玷污
  rationale: 保留被动语态和道德污染的意象，语气庄重而自然。
theological_decisions:
- issue: 如何描述祭偶像之物而不暗示偶像是真神
  choice: 吃的时候仍把这食物当作祭过偶像的
  alternative: 吃祭偶像的食物
  rationale: “把……当作”保留进食者所赋予食物的祭祀意义，而不表示保罗承认偶像具有真实神性；这样也保留本章中“偶像算不得什么”与良心仍可能受伤之间的张力。
- issue: “软弱”与良心被玷污之间的关系
  choice: 他们的良心既然软弱，就被玷污了
  alternative: 他们软弱的良心被玷污了
  rationale: 前者较清楚地体现ἀσθενὴς οὖσα的分词结构，同时不额外断定这种软弱本身是否有罪。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“旧习”避免生硬的“对偶像的熟悉”，脚注则交代原文词义及句法上的不确定性；全句保留保罗论述中的“知识—良心—软弱—玷污”词汇链。
