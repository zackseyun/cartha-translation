  text: εἰ δέ τις ἀγαπᾷ τὸν θεόν, οὗτος ἔγνωσται ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/003.yaml
  text: But if anyone loves God[a], this one is known by him.
translation:
  language: zh_hans
  text: 但若有人爱神，这人是神所认识的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“蒙神认可”或“已为神所认识”。希腊文使用完成时被动语态，可能强调这人因先前被神认识而形成、现今仍存的状态。
    reason: 说明ἔγνωσται的词义选择及完成时所表达的持续状态。
lexical_decisions:
- source_word: εἰ δέ
  choice: 但若
  rationale: εἰ构成条件句，δέ承接上文并带有温和的转折意味；“但若”在现代汉语中同时保留这两层作用。
- source_word: τις
  choice: 有人
  rationale: 泛指任何人，不限定性别；“有人”简洁自然。
- source_word: ἀγαπᾷ
  choice: 爱
  rationale: 直译ἀγαπάω的现在时形式，表达持续而现实的爱，不额外限定其性质。
- source_word: τὸν θεόν
  choice: 神
  rationale: 在此为动词“爱”的确定宾语；现代汉语无需对应希腊语冠词另加措辞。
- source_word: οὗτος
  choice: 这人
  rationale: 保留指示代词的强调作用，明确指向前述“爱神”的人，又比生硬的“这一个”自然。
- source_word: ἔγνωσται
  choice: 是……所认识的
  rationale: 该词为γινώσκω的完成时被动语态，译文着重表达由先前行动形成、如今仍持续的“被认识”状态，同时不把其关系性含义窄化为“赞许”或“拣选”。
- source_word: ὑπ’ αὐτοῦ
  choice: 神所
  rationale: 希腊文代词所指为前面的神。汉语若直译“他所认识的”，可能产生指代含混，因此复现“神”，不改变原意。
theological_decisions:
- issue: 神“认识”人的含义
  choice: 译作“是神所认识的”，保留关系性认识、承认或认可等可能内涵
  alternative: 译作“蒙神认可”或“是神所悦纳的”
  rationale: 神作γινώσκω的施事者时，含义可能超过单纯知悉，涉及关系性的认识或承认；但本句没有迫使译者选定更窄的教义解释，因此正文保留原文的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这人”保留希腊文指示代词的强调；正文复现“神”以避免汉语代词指代不清。
