base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/001.yaml
  text: 'Concerning food sacrificed to idols: we know that we all have knowledge[a]. Knowledge puffs up[b], but love builds up.'
translation:
  language: zh_hans
  text: 至于祭过偶像的食物[a]，我们知道我们都拥有知识[b]。知识使人自高自大，爱却造就人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“祭过偶像的肉”，或“献给偶像的东西”。
    reason: lexical_alternative
  - marker: b
    text: “我们都拥有知识”可能是保罗引用或呼应哥林多人的一句口号；原文也可不作引语理解。
    reason: alternative_reading
lexical_decisions:
- source_word: Περὶ δὲ
  choice: 至于
  rationale: 作为书信中转入新话题的表达，“至于”自然、简洁，也不加入原文没有的时间副词。
- source_word: τῶν εἰδωλοθύτων
  choice: 祭过偶像的食物
  rationale: 涵盖献祭给偶像之物在本语境中的食物含义，同时不将范围过早限定为肉。
- source_word: οἴδαμεν ὅτι πάντες γνῶσιν ἔχομεν
  choice: 我们知道：“我们都有知识。”
  rationale: 保留“知道”与“知识”的词义联系及第一人称复数。引号提示这句话可能是保罗引用或呼应哥林多人的说法，但不在正文中断定其性质。
- source_word: φυσιοῖ
  choice: 使人自高自大
  rationale: 表达其使人膨胀、骄傲的比喻性含义；比直译“使人膨胀”更符合现代汉语，同时仍保留动态结果。
- source_word: ἡ δὲ ἀγάπη
  choice: 爱却
  rationale: 以“却”清楚呈现 δέ 的对照关系，“爱”保持概括性。
- source_word: οἰκοδομεῖ
  choice: 造就人
  rationale: “造就”在现代中文基督教语境中易懂，并保留建筑隐喻的延伸意义；补出宾语“人”使汉语完整自然，而不限定具体对象。
theological_decisions:
- issue: “我们都有知识”是保罗直接断言，还是在引用或呼应哥林多人的口号
  choice: 正文保留原句，并用引号提示可能的引语性质
  alternative: 不加引号，译作“我们知道我们都有知识”
  rationale: 希腊文本没有显式引语标记，因此不能断定；但上下文和修辞结构容许将其视为哥林多人的说法。正文用引号呈现这一可能性，脚注明确保留另一种读法。
- issue: πάντες 是否表达不受限制的普遍断言
  choice: 译作“我们都”
  alternative: 译作“人人都”或“我们所有人都”
  rationale: “我们都”直接对应第一人称复数语境，不额外扩大范围，也保留保罗与收信人之间的修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“自高自大”自然传达 φυσιοῖ 的骄傲含义；“造就人”与之形成鲜明对照。所有脚注标记均置于正文相应位置。
