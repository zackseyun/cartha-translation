id: 1CO.8.13
reference: 1 Corinthians 8:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: διόπερ εἰ βρῶμα σκανδαλίζει τὸν ἀδελφόν μου, οὐ μὴ φάγω κρέα εἰς τὸν αἰῶνα, ἵνα μὴ τὸν ἀδελφόν μου σκανδαλίσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/013.yaml
  text: Therefore, if food causes my brother to stumble, I will certainly never eat meat forever, so that I may not cause my brother to stumble.
translation:
  language: zh_hans
  text: 所以，如果食物使我的弟兄跌倒，我就永远不吃肉，免得使我的弟兄跌倒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διόπερ
  choice: 所以
  rationale: 自然表达由前文论证得出的强结论。
- source_word: βρῶμα
  choice: 食物
  rationale: 保留泛指，与后文较具体的“肉”形成对应。
- source_word: σκανδαλίζει / σκανδαλίσω
  choice: 使……跌倒
  rationale: 表达因自己的行为诱使信徒在信仰或良心上失足的含义，并保留两次重复。
- source_word: ἀδελφόν
  choice: 弟兄
  rationale: 在本段信徒群体的语境中沿用亲属式称呼。
- source_word: οὐ μὴ φάγω
  choice: 我就……不吃
  rationale: 结合强否定结构，以明确坚决的承诺表达；“永远”进一步承载其强调意味。
- source_word: κρέα
  choice: 肉
  rationale: 指供食用的肉，与泛称“食物”区别开来。
- source_word: εἰς τὸν αἰῶνα
  choice: 永远
  rationale: 直接保留原文强烈而不设期限的表达，不弱化为“再也”。
- source_word: ἵνα μὴ
  choice: 免得
  rationale: 简洁自然地表达避免某结果的目的。
theological_decisions:
- issue: 保罗的承诺是否仅限于特定场合
  choice: 保留“永远不吃肉”的绝对措辞
  alternative: 译作“再也不吃肉”或解释为只在弟兄面前不吃
  rationale: 原文 εἰς τὸν αἰῶνα 使用强烈的永久性表达；译文不替作者缩小承诺范围，也不另加情境限定。
- issue: σκανδαλίζω 所指的伤害
  choice: 译作“使……跌倒”
  alternative: “冒犯”或“使……不高兴”
  rationale: 上下文关乎软弱者的良心和信仰受损，不只是情感上的冒犯。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；保留原文“食物—肉”之别、两次“使我的弟兄跌倒”的修辞重复，以及结论中强烈的自我约束。
