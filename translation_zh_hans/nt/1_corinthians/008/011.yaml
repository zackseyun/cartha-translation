source:
  edition: SBLGNT
  text: ⸂ἀπόλλυται γὰρ⸃ ὁ ἀσθενῶν ⸀ἐν τῇ σῇ γνώσει, ⸂ὁ ἀδελφὸς⸃ δι’ ὃν Χριστὸς ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/011.yaml
  text: For the weak one is destroyed by your knowledge—the brother for whom Messiah died[a][b][c].
translation:
  language: zh_hans
  text: 因为那软弱的人因你的知识而毁灭——他就是那位弟兄，弥赛亚为他而死。 [a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “毁灭”也可译作“败坏”或“灭亡”。希腊文可以表示严重的败坏或毁灭；本节没有明确限定保罗所指的是今世属灵上的重创、末世性的毁灭，还是二者兼有。
    reason: alternative_reading
  - marker: b
    text: “弟兄”在这里指同为信徒的人；按上下文，其实际应用也可包括信仰中的姊妹。
    reason: lexical_alternative
  - marker: c
    text: 希腊文为“基督”；这里按其称号含义译作“弥赛亚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόλλυται
  choice: 毁灭了
  rationale: 该动词为现在时被动/中动态，表达严重的败坏或毁灭。汉语“毁灭了”保留其强烈程度，同时不在正文中断定这是今世属灵上的重创、末世性的灭亡，还是二者兼有。
- source_word: γάρ
  choice: 因为
  rationale: 承接上文并说明理由；现代汉语中“因为”自然明确。
- source_word: ὁ ἀσθενῶν
  choice: 那软弱的人
  rationale: 将名词化的现在分词按单数译出，不提前加入后文才出现的“弟兄”。
- source_word: ἐν τῇ σῇ γνώσει
  choice: 因你的知识
  rationale: ἐν 在这里表示相关的作用范围或手段；“因”自然传达那人的毁灭是由对方运用所谓“知识”所造成的。
- source_word: γνῶσις
  choice: 知识
  rationale: 保留本章反复出现的关键词，也保留保罗的反讽张力：自称的“知识”竟伤害弟兄。
- source_word: ὁ ἀδελφός
  choice: 弟兄
  rationale: 保留希腊文阳性单数的形式；此处指信仰群体中的同伴，应用范围可包括女性信徒，见脚注。
- source_word: δι’ ὃν
  choice: 为他
  rationale: διά 加宾格在此表示受益或代替关系；“为他死”是简洁自然的中文表达。
- source_word: Χριστός
  choice: 弥赛亚
  rationale: 此处 Χριστός 具有称号功能，译作“弥赛亚”能显明其称号意义，而不只作为姓名式称呼。
- source_word: ἀπέθανεν
  choice: 死
  rationale: 以汉语简单过去事件的自然表达对应希腊文简单过去时。
theological_decisions:
- issue: ἀπόλλυται 是否必然指真信徒最终永远沉沦
  choice: 正文译作“毁灭了”，不进一步限定毁灭的性质
  alternative: 败坏了；正在毁灭；灭亡
  rationale: 原词表达严重毁坏，却仅凭本节不足以判定保罗专指今世属灵重创、末世灭亡，还是兼指二者；译文保留这一神学张力，脚注列出其他可能译法。
- issue: ἀδελφός 是否在正文中改为性别中性的称呼
  choice: 正文保留“弟兄”
  alternative: 信徒同伴；弟兄或姊妹
  rationale: 希腊文为阳性单数，正文据实保留；脚注说明在语境中指同为信徒的人，实际应用可包括弟兄或姊妹。
- issue: Χριστός 作为称号还是姓名式称呼
  choice: 译作“弥赛亚”
  alternative: 基督
  rationale: 这里的称号意义与其为弟兄受死的救赎性陈述相连；译作“弥赛亚”明确保留该称号功能。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“竟”突出知识反而造成毁灭的反常结果；破折号后的同位说明尽量保留原文把“那软弱的人”重新点明为“弟兄”的修辞力量。所有脚注标记均置于正文句末。
