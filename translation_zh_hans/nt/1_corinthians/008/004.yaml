  text: Περὶ τῆς βρώσεως οὖν τῶν εἰδωλοθύτων οἴδαμεν ὅτι οὐδὲν εἴδωλον ἐν κόσμῳ, καὶ ὅτι οὐδεὶς ⸀θεὸς εἰ μὴ εἷς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/004.yaml
  text: Therefore[a], concerning the eating of food sacrificed to idols, we know that an idol is nothing in the world[b], and that there is no God except one.
translation:
  language: zh_hans
  text: 所以，关于吃献给偶像的祭物，我们知道，世上的偶像算不得什么[a]，并且除了一位神以外，没有别的神[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“偶像在世上并没有真实的存在。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“除了一位以外，再没有任何神明。”
    reason: lexical_alternative
lexical_decisions:
- source_word: βρώσεως
  choice: 吃……这件事
  rationale: 该名词指吃的行为；用“吃……这件事”保留其动作含义，并自然承接περὶ。
- source_word: εἰδωλοθύτων
  choice: 祭过偶像的食物
  rationale: 此词泛指与献给偶像的祭物有关的食物；“食物”不把范围无根据地限于肉类。
- source_word: οἴδαμεν
  choice: 我们知道
  rationale: 直译该完成时形式在此所表达的现在状态，也保留保罗诉诸共同认知的语气。
- source_word: οὐδὲν εἴδωλον
  choice: 偶像……算不得什么
  rationale: 以自然现代汉语传达偶像的虚无或无实质地位，同时用脚注保留“没有真实存在”的可能表达。
- source_word: ἐν κόσμῳ
  choice: 在世上
  rationale: κόσμος在此指现实世界或受造界；“在世上”简洁自然。
- source_word: οὐδεὶς θεὸς εἰ μὴ εἷς
  choice: 除了一位神以外，再没有神
  rationale: 贴近希腊文的排他结构，明确表达神的独一性；汉语不以大小写区分“神／god”，故在脚注说明另一种措辞。
- source_word: οὖν
  choice: 所以
  rationale: 表示从上文推衍而来的过渡；“所以”比“因此”更符合自然现代汉语，同时保留推论关系。
theological_decisions:
- issue: 偶像的虚无与独一神信仰
  choice: 保留“偶像在世上算不得什么”与“除了一位神以外，再没有神”这两个并列断言
  alternative: 把前句明确译为“偶像在世上并没有真实的存在”，或把后句译为“只有一位神”
  rationale: 正文维持希腊文简洁而有张力的说法，不把偶像之“无”完全解释成某一种形而上判断，也不在独一神宣告中加入经文未明说的后期神学表述。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“祭过偶像的食物”避免误限为肉类；“算不得什么”保留原文紧凑表达，并以脚注呈现其存在论意味。
