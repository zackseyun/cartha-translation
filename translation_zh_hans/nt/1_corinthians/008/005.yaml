source:
  edition: SBLGNT
  text: καὶ γὰρ εἴπερ εἰσὶν λεγόμενοι θεοὶ εἴτε ἐν οὐρανῷ εἴτε ἐπὶ γῆς, ὥσπερ εἰσὶν θεοὶ πολλοὶ καὶ κύριοι πολλοί,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/005.yaml
  text: For even if there are so-called gods[b][a], whether in heaven or on earth—as indeed there are many gods and many lords—
translation:
  language: zh_hans
  text: 因为，即使有所谓的神[a]，无论在天上还是在地上——正如确实有许多神和许多主[b]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被称为神的”。希腊语分词可以表示“被称为”；在本语境中译作“所谓的”，能体现保罗与这些被宣称为神的对象之间的距离。
    reason: lexical_alternative
  - marker: b
    text: “主”所译的希腊词，是第6节通常译作“主”的同一个词的复数。这里指人们以这一称号承认的众多存在或权势，并不是第6节所说的那一位独一的主。
    reason: cross_reference
lexical_decisions:
- source_word: καὶ γὰρ
  choice: 因为，即使
  rationale: γάρ承接上文作解释，καί与随后表示让步的εἴπερ合起来，汉语用“因为，即使”自然地保留解释与强调作用。
- source_word: εἴπερ
  choice: 即使有
  rationale: 这里是为论证暂作承认的让步条件；“即使”既自然，也避免把这些所谓神明的真实神性当作作者的直接断言。
- source_word: λεγόμενοι θεοὶ
  choice: 所谓的神
  rationale: λεγόμενοι表示被如此称呼或认定；“所谓的”保留这种称谓意义，并体现上下文中作者与这些神明主张的距离。
- source_word: εἴτε ἐν οὐρανῷ εἴτε ἐπὶ γῆς
  choice: 无论在天上还是在地上
  rationale: 保留两个领域的并列选择及其涵盖天地的范围；“天上”比“天空中”更适合此处有关神灵领域的语境。
- source_word: ὥσπερ
  choice: 事实上，确实
  rationale: 此处引入一个带确认意味的插入说明，承认现实中确有许多被人视为神和主的对象；这一表达在现代汉语中自然清楚。
- source_word: θεοὶ πολλοὶ καὶ κύριοι πολλοί
  choice: 许多神、许多主
  rationale: 保留原文两组平行结构，以及θεοί与κύριοι之间的区别；不把κύριοι改译为“主人”，以维持它与第6节“主”的词汇呼应。
theological_decisions:
- issue: 保罗与异教神明之间的修辞距离
  choice: 将λεγόμενοι θεοὶ译为“所谓的神”
  alternative: “被称为神的”
  rationale: 第4至6节的上下文否认偶像与独一上帝具有同等的神性。“所谓的”既反映分词所表达的称谓，也不把这些对象的真实本体性质解释得超过原文。
- issue: 许多“主”与第6节独一之主的对照
  choice: 译作“许多主”
  alternative: “许多主人”或“许多主宰”
  rationale: κύριοι是κύριος的复数；保留“主”能显出与第6节“独一的主”的有意对照，同时上下文已表明这里指人们所承认的众多权势或受崇拜者。
- issue: “确实有许多神、许多主”的存在性陈述
  choice: 保留原文表面的确认语气，不在正文中改写为“有许多被称为神和主的”
  alternative: 明确补出“被人称为”或“被人奉为”
  rationale: ὥσπερ εἰσὶν的措辞确有确认意味，而λεγόμενοι及上下文又使其身份受到限定。正文保留这种张力，避免替作者彻底判定这些对象究竟只是名号、属灵权势，还是崇拜对象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“因为，即使”承接上文并引出让步；破折号保留原文插入说明及句子向第6节延续的结构。正文不加引号，以免用中文标点额外强化原文没有明说的讽刺意味；修辞距离主要由“所谓的”表达。
