base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/002.yaml
  text: If anyone thinks he knows something[a], he does not yet know as he ought to know.
translation:
  language: zh_hans
  text: 如果有人自以为知道了什么[a]，他还不知道应当怎样知道。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如果有人自以为已经认识了什么，他还不知道应当怎样认识。”
    reason: 保留ἐγνωκέναι的完成体（“已经认识”）以及γινώσκω在本句连续出现可译为“认识”的较正式表达。
lexical_decisions:
- source_word: εἴ τις
  choice: 如果有人
  rationale: 以自然的现代汉语表达泛指条件句，不把所指限于男性。
- source_word: δοκεῖ
  choice: 自以为
  rationale: 此处表示主观判断；“自以为”贴合上下文中对自信自满的警戒，又不等于断言其判断必然全错。
- source_word: ἐγνωκέναι
  choice: 知道
  rationale: 完成时不定式表示自认为已经处于有所认识的状态；正文用“知道”最自然，完成体意味在脚注中保留。
- source_word: τι
  choice: 什么
  rationale: 在“知道”之后以“什么”自然表达不定对象，并保留原文泛指意味。
- source_word: οὔπω ἔγνω
  choice: 还没有……知道
  rationale: “还没有”保留οὔπω所表达的尚未达到之意；不把批评扩大为绝对否定一切知识。
- source_word: καθὼς δεῖ γνῶναι
  choice: 按着应当知道的方式去知道
  rationale: 保留καθὼς既可指方式也可指标准的张力，并表达δεῖ的规范性；避免简化成仅仅欠缺知识量。
theological_decisions:
- issue: 保罗批评的性质
  choice: 批评自满而不完全否定人的知识
  alternative: 把本句理解为绝对否定人拥有任何知识
  rationale: “还没有……按着应当……的方式”指出认识尚未达到应有的方式或标准，重点是认识上的谦卑与不足。
- issue: καθὼς所指的是方式还是程度/标准
  choice: 正文用“按着……的方式”，同时让“应当”保留规范标准
  alternative: 译作“达到应有的程度”
  rationale: 原文可以涉及认识的方式与应有标准；正文不将其单一化为知识数量或程度。
- issue: 泛指主体
  choice: 有人……他
  alternative: 任何人……他们
  rationale: τις是泛指单数；现代汉语中的“有人……他”可自然维持单数连贯，且“有人”本身不限定性别。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“自以为”传达主观自信，“按着应当知道的方式去知道”略带修辞重复，以保留希腊文同一词根连续出现及其论辩力度。
