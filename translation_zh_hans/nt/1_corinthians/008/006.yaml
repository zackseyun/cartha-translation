id: 1CO.8.6
reference: 1 Corinthians 8:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἀλλ’ ἡμῖν εἷς θεὸς ὁ πατήρ, ἐξ οὗ τὰ πάντα καὶ ἡμεῖς εἰς αὐτόν, καὶ εἷς κύριος Ἰησοῦς Χριστός, δι’ οὗ τὰ πάντα καὶ ἡμεῖς δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/006.yaml
  text: yet for us there is one God[a], the Father, from whom are all things and we for him, and one Lord, Jesus the Messiah[c][b], through whom are all things and we through him.
translation:
  language: zh_hans
  text: 然而，对我们来说，只有一位上帝，就是父；万有都出于他，我们也归于他[a]。也只有一位主，就是耶稣弥赛亚[b]；万有都借着他而有，我们也借着他而有。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “归于他”也可译作“向着他”或“为他而存在”。原文介词可表示方向、归宿或目的。
    reason: lexical_alternative
  - marker: b
    text: “弥赛亚”也可译作“基督”。希腊语Χριστός既可作为称号，意为“受膏者、弥赛亚”，也可在某些语境中具有近似名字的用法。
    reason: alternative_reading
  - marker: c
    text: “万有都出于他”与“万有都借着他而有”彼此对应：前者以父为来源，后者以耶稣弥赛亚为媒介；译文保留了原文的这一区分。
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: 然而
  rationale: 承接上文并形成转折；现代汉语中自然、庄重。
- source_word: ἡμῖν
  choice: 对我们来说
  rationale: 表达关系与立场的与格用法，表明这是信徒所持的认信。
- source_word: εἷς θεὸς ὁ πατήρ
  choice: 只有一位上帝，就是父
  rationale: 保留“一位”的数目强调，并将同位语“父”清楚呈现出来。
- source_word: ἐξ οὗ τὰ πάντα
  choice: 万有都出于他
  rationale: ἐξ表示来源；“万有”保留τὰ πάντα的整体性和保罗书信中的庄重语感。
- source_word: καὶ ἡμεῖς εἰς αὐτόν
  choice: 我们也归于他
  rationale: εἰς可表达方向、归宿或目的；“归于他”保留这种朝向终极目标的含义，而不把它限定为单一解释。
- source_word: εἷς κύριος
  choice: 只有一位主
  rationale: 与“只有一位上帝”保持平行，并保留κύριος在此处的认信分量。
- source_word: Ἰησοῦς Χριστός
  choice: 耶稣弥赛亚
  rationale: Χριστός在这一认信结构中具有称号意味；“弥赛亚”比音译式的“基督”更直接显出其称号含义。
- source_word: δι’ οὗ τὰ πάντα
  choice: 万有都借着他而有
  rationale: διά加属格表示媒介或施行途径；补出“而有”使汉语完整，同时不把作用进一步限定为创造、维系或救赎中的某一种。
- source_word: καὶ ἡμεῖς δι’ αὐτοῦ
  choice: 我们也借着他而有
  rationale: 原文为省略结构，与前句平行；汉语补出“而有”以传达隐含谓语，同时保留所指可以涵盖存在、生命或救恩的开放性。
theological_decisions:
- issue: “一位上帝”与“一位主”在同一认信中的关系
  choice: 保留“只有一位上帝，就是父……也只有一位主，就是耶稣弥赛亚”的平行结构。
  alternative: 弱化“主”的分量，或直接加入后期教义术语来解释父与耶稣的关系。
  rationale: 原文既把父与耶稣置于紧密平行的独一认信中，也没有抹去二者的区分。译文不削弱任何一方，也不越过经文本身作系统化说明。
- issue: 父与耶稣所对应的介词关系
  choice: 分别译为“出于他／归于他”和“借着他”。
  alternative: 将这些介词统一泛译，或把“归于他”明确限定为“为他而活”。
  rationale: ἐξ、εἰς和διά分别表达来源、方向或目的、以及媒介。保留差异可呈现经文的神学张力，避免把父与子的关系扁平化。
- issue: 末句省略结构的含义
  choice: 译作“我们也借着他而有”。
  alternative: 明确译成“我们借着他得救”或“我们借着他被创造”。
  rationale: 原文没有明说所省略谓语究竟专指存在、生命还是救恩；“而有”使中文可读，同时避免把含义缩窄为某一种神学解释。
translation_notes:
  register: 采用现代、庄重且适合公开诵读的普通话。“万有”“出于”“归于”“借着”等词保留认信式节奏和介词关系；用分号呈现两组平行句式。
