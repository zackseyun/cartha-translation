  text: βρῶμα δὲ ἡμᾶς οὐ ⸀παραστήσει τῷ θεῷ· οὔτε ⸂γὰρ ἐὰν φάγωμεν, περισσεύομεν, οὔτε ἐὰν μὴ φάγωμεν, ὑστερούμεθα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/008.yaml
  text: But food will not commend us to God[a]; for neither if we eat do we abound[b], nor if we do not eat do we lack.
translation:
  language: zh_hans
  text: 但食物不能使我们在上帝面前得蒙悦纳[a]；因为我们吃，并不会有所增益；不吃，也不会有所缺少[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“食物不能使我们来到上帝面前”，或“食物不能把我们呈到上帝面前”。
    reason: παραστήσει τῷ θεῷ可指带到或呈到上帝面前；在本语境中也可指使人得到上帝的称许。
  - marker: b
    text: 或译：“我们吃，并不会更好；不吃，也不会更坏。”
    reason: περισσεύομεν与ὑστερούμεθα在这里可按处境上的优势与劣势作较意译的表达。
lexical_decisions:
- source_word: βρῶμα
  choice: 食物
  rationale: 泛指所吃的东西，并非特指肉类或某一餐；“食物”准确、自然，也符合上下文的一般原则。
- source_word: παραστήσει τῷ θεῷ
  choice: 使我们在上帝面前更蒙悦纳
  rationale: παρίστημι在这里涉及人在上帝面前的地位或认可，而非单纯物理意义上的“呈到面前”。加入“更”与后文得失对照呼应，同时不把食物本身说成决定人与上帝关系的媒介。
- source_word: οὔτε γὰρ ἐὰν φάγωμεν, περισσεύομεν
  choice: 因为我们吃，也不会更有所得
  rationale: περισσεύω在此可指占优、增益或有余；“更有所得”保留其较宽泛的正面增益含义，避免限定为道德上“更好”。
- source_word: οὔτε ἐὰν μὴ φάγωμεν, ὑστερούμεθα
  choice: 不吃，也不会有所亏缺
  rationale: ὑστερέω表示缺少、欠缺或处于不足；“有所亏缺”与“更有所得”形成自然对照，并保留原文未明确说明亏缺为何物的开放性。
- source_word: δὲ
  choice: 但
  rationale: 承接前文并表达温和转折，现代汉语用“但”清楚自然。
- source_word: γὰρ
  choice: 因为
  rationale: 引出前句的解释或根据，明确保留原文逻辑关系。
theological_decisions:
- issue: 食物是否改变人在上帝面前的属灵地位
  choice: 译为食物不能使人“在上帝面前更蒙悦纳”
  alternative: 食物不能把我们带到上帝面前／食物不能把我们呈献给上帝
  rationale: 上下文表明，吃或不吃本身并不给人带来属灵增益或亏损。“更蒙悦纳”表达认可与地位层面的含义，但不把经文扩大为对所有礼仪或圣约范畴的系统性断言。
- issue: περισσεύομεν与ὑστερούμεθα所指的得失范围
  choice: 保留为未明确限定的“更有所得／有所亏缺”
  alternative: 明确译作“并不会更好／并不会更坏”
  rationale: 原文没有明说究竟在哪一方面占优或欠缺；较开放的表达保留语义张力，让上下文说明这是人在上帝面前的得失。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“蒙悦纳”具有一定经文语体色彩，但在现代教会及一般宗教语境中仍清楚可懂；句式保留原文吃与不吃、增益与亏缺的平行对照。
