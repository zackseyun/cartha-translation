source:
  edition: SBLGNT
  text: οὕτως δὲ ἁμαρτάνοντες εἰς τοὺς ἀδελφοὺς καὶ τύπτοντες αὐτῶν τὴν συνείδησιν ἀσθενοῦσαν εἰς Χριστὸν ἁμαρτάνετε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/012.yaml
  text: And so[a], by sinning against the brothers in this way and wounding their weak conscience[c][b], you are sinning against Messiah.
translation:
  language: zh_hans
  text: 你们这样得罪弟兄[a]，伤害他们软弱的良心，也就是得罪弥赛亚[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“弟兄”指同信的人；按上下文，可能包括男性和女性。
    reason: lexical_alternative
  - marker: b
    text: 或译“基督”。希腊文Χριστός是一个称号。
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως δὲ
  choice: 这样
  rationale: οὕτως回指上文所述的行事方式；汉语把“这样”置于“得罪弟兄”之前，既自然，也清楚表明它修饰这一行为。δέ在此仅作轻微衔接，无须另译为强转折。
- source_word: ἁμαρτάνοντες εἰς τοὺς ἀδελφοὺς
  choice: 得罪弟兄
  rationale: ἁμαρτάνω与εἰς连用表示对人犯罪、冒犯人；“得罪”在现代汉语中简洁自然，并保留道德过犯的含义。ἀδελφούς按其阳性复数形式译作“弟兄”，其在群体语境中的广泛所指以脚注说明。
- source_word: τύπτοντες
  choice: 伤害
  rationale: 该词本义为“击打”，此处以良心为受词，属于形象化用法；“伤害”保留造成损伤的力度，同时比“击打良心”更符合现代汉语习惯。
- source_word: αὐτῶν τὴν συνείδησιν ἀσθενοῦσαν
  choice: 他们软弱的良心
  rationale: 保留原文“他们”与单数“良心”的组合，按分配意义理解；“软弱的”准确表达ἀσθενοῦσαν对良心的修饰。
- source_word: εἰς Χριστὸν ἁμαρτάνετε
  choice: 也就是得罪弥赛亚
  rationale: 再次用“得罪”呈现ἁμαρτάνω与εἰς的敌对、指向关系；“也就是”清楚表达伤害弟兄等同于得罪弥赛亚。Χριστός按其称号意义译为“弥赛亚”。
theological_decisions:
- issue: ἀδελφούς在教会群体语境中的范围
  choice: 正文译“弟兄”，脚注说明可泛指同信者
  alternative: 弟兄姊妹；信徒
  rationale: 原文为阳性复数，但在此语境中可能包括男女信徒。正文保留形式特征，脚注避免读者误解为仅指男性。
- issue: Χριστόν的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: Χριστός在这里仍可作为受膏者的称号理解；“弥赛亚”保留称号含义，同时以脚注提供汉语教会传统常用译法“基督”，不排除其在保罗书信中近似专名的用法。
- issue: 得罪弟兄与得罪弥赛亚的关系
  choice: 用“也就是”表达两者的等同关系
  alternative: 也在得罪弥赛亚
  rationale: 原句以两个同词根结构ἁμαρτάνοντες与ἁμαρτάνετε建立直接而有力的神学关联；“也就是”不削弱这一关系，也不额外解释其机制。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“得罪”重复出现，呼应原文同一动词的重复；“伤害良心”符合汉语表达，同时保留原文强烈的损伤意象。
