  text: κἀγὼ ἐν ἀσθενείᾳ καὶ ἐν φόβῳ καὶ ἐν τρόμῳ πολλῷ ἐγενόμην πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/003.yaml
  text: And I was with you in weakness[a], in fear, and in great trembling,
translation:
  language: zh_hans
  text: 而我在你们中间时，处于软弱、惧怕和极其战兢之中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我来到你们那里时，处于软弱、惧怕和极其战兢之中。”
    reason: ἐγενόμην πρὸς ὑμᾶς可指保罗在收信人中间的状态，也可较侧重其来到他们那里；正文采用前者，脚注保留后者。
lexical_decisions:
- source_word: κἀγώ
  choice: 我……又
  rationale: κἀγώ是καὶ ἐγώ的缩合，承接上文并明确保罗的自指；汉语用句中的“又”自然体现连接作用，避免不必要地加强为“我自己”。
- source_word: ἐν ἀσθενείᾳ
  choice: 软弱
  rationale: ἀσθένεια可指软弱、脆弱；“软弱”简明自然，并保留其身体、处境或个人能力方面的宽泛含义。
- source_word: ἐν φόβῳ
  choice: 惧怕
  rationale: 直译φόβος所表达的恐惧状态，不将其弱化或限定为“敬畏”或“谨慎”。
- source_word: ἐν τρόμῳ πολλῷ
  choice: 战战兢兢得厉害
  rationale: “战战兢兢”自然表达τρόμος的颤抖和畏惧，末尾“得厉害”传达πολλῷ的强烈程度。
- source_word: ἐγενόμην πρὸς ὑμᾶς
  choice: 我在你们那里时
  rationale: 按哥林多前书2:1—3的语境，表达保罗身处哥林多人中间时的状态；此结构也可理解为“来到你们那里”，故在脚注保留该可能。
theological_decisions:
- issue: “惧怕”和“战战兢兢”的对象与性质
  choice: 不补明惧怕的对象，也不解释为敬畏
  alternative: 因敬畏神而恐惧战兢，或因传道处境而害怕
  rationale: 希腊文本只陈述保罗的状态，未明说对象或成因；正文保留这种开放性，避免导入特定神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“又……又……又……”保留原文三个并列介词短语的累积力度；“战战兢兢得厉害”比“极其战兢”更贴近日常现代汉语，同时不削弱原文强度。
