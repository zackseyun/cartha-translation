  source_fidelity: 正文准确保留了保罗在哥林多人中间时的软弱、惧怕和强烈战兢，且没有擅自说明惧怕的对象。原译将ἐγενόμην πρὸς ὑμᾶς理解为“在你们那里时”是可行的；脚注保留“来到你们那里”的可能也合乎原文的语义范围。
  naturalness: 原文“又软弱，又惧怕，又战战兢兢得厉害”虽可理解，但重复的“又”和句末“得厉害”略显口语、拖沓；尤其脚注中的“战战兢兢得厉害地来到”会在语法上使“得厉害地”修饰“来到”，表达不够自然。改为并列名词性状态和“极其战兢”，更庄重、流畅，并与原文三个ἐν短语相称。
  terminology: “软弱”“惧怕”恰当。“极其战兢”自然传达τρόμος πολλῷ的强烈程度，且不将其解释为敬畏、心理疾病或特定传道处境。
