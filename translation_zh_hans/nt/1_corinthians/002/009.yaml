  text: ἀλλὰ καθὼς γέγραπται· Ἃ ὀφθαλμὸς οὐκ εἶδεν καὶ οὖς οὐκ ἤκουσεν καὶ ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη, ⸀ὅσα ἡτοίμασεν ὁ θεὸς τοῖς ἀγαπῶσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/009.yaml
  text: But just as it is written[a], “What no eye has seen, and no ear has heard[b], and what has not entered into the heart of man—what God has prepared for those who love him.”
translation:
  language: zh_hans
  text: 但正如经上所记：“眼睛未曾看见，耳朵未曾听见，人的心也未曾想到的[a]——就是上帝为爱他的人所预备的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人的心也未曾想到”直译可作“也未曾上到人的心”；也可译作“也未曾进入人心”或“也没有人想到过”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: 但
  rationale: 承接上文形成转折，用“但”简洁自然。
- source_word: καθὼς γέγραπται
  choice: 正如经上所记
  rationale: 保留引述圣经的固定表达，并以“所记”体现完成状态在当下仍然有效。
- source_word: Ἃ ... ὅσα
  choice: ……的——就是……的
  rationale: 希腊文先列举人未曾感知或想到之事，再以ὅσα复指其内容；中文用“——就是”清楚保留这种复指与诗性推进。
- source_word: ὀφθαλμὸς οὐκ εἶδεν
  choice: 眼睛未曾看见
  rationale: 保留单数泛指及视觉意象。
- source_word: οὖς οὐκ ἤκουσεν
  choice: 耳朵未曾听见
  rationale: 保留单数泛指，并与“眼睛”构成平行。
- source_word: ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη
  choice: 人的心也未曾想到
  rationale: 原文直译近于“未曾上到人的心”；在圣经语境中指未在人的内心产生或为人所构想。“心……想到”既保留“心”的意象，也符合现代汉语。
- source_word: ἡτοίμασεν
  choice: 所预备的
  rationale: “预备”准确表达事先安排妥当；“所……的”与前面的复指结构自然衔接。
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: 为爱他的人
  rationale: 自然表达现在分词所描述的持续性身份，并保留受益对象。
theological_decisions:
- issue: ἀνθρώπου的泛指范围
  choice: 人的心
  alternative: 男人的心；人心
  rationale: ἀνθρώπου在这里是单数泛指，所指为人类而非男性。“人的心”既忠实呈现属人格形式，又不会误导为仅指男人。
- issue: καρδία的表达
  choice: 心
  alternative: 头脑；思想
  rationale: 保留圣经中“心”作为内在认知、意念与意愿中心的宽广意象，不将其缩窄为纯理性思维。
- issue: 本节所预备之事的具体所指
  choice: 维持笼统表达，不在译文中限定
  alternative: 明确解释为天堂、救恩福分或属灵启示
  rationale: 本节自身没有把“所预备的”限定为某一单一教义概念；译文应保留其语境张力，避免加入解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话；保留引文的三重平行节奏，并用破折号呈现ὅσα对前文内容的复指。脚注标记置于引述公式之后，说明主要的词义与意象选择。
