  text: οὐ γὰρ ἔκρινά ⸂τι εἰδέναι⸃ ἐν ὑμῖν εἰ μὴ Ἰησοῦν Χριστὸν καὶ τοῦτον ἐσταυρωμένον·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/002.yaml
  text: For I decided to know nothing among you except Jesus the Messiah—and him crucified[a].
translation:
  language: zh_hans
  text: 因为我决意在你们中间，除了耶稣弥赛亚——就是那位被钉十字架的——以外，什么也不知道。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶稣弥赛亚”也可译作“耶稣基督”。希腊文为“耶稣弥赛亚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκρινά
  choice: 已经决意
  rationale: 这里的 κρίνω 表示经过判断后作出的坚定决定，并非司法意义上的“审判”。“已经决意”自然地传达其意志和完成性。
- source_word: τι εἰδέναι
  choice: 什么也不知道
  rationale: 在 οὐ…εἰ μὴ 的限制结构中，这一短语表示除所述对象外，不以任何别的事为自己所知和宣讲的中心。
- source_word: ἐν ὑμῖν
  choice: 在你们中间
  rationale: 保留空间和群体关系的双重意味，指保罗身处哥林多人当中并在那里服事。
- source_word: εἰ μὴ
  choice: 除了……以外
  rationale: 这是标准的排除性结构；此译清楚表达唯一例外。
- source_word: Ἰησοῦν Χριστόν
  choice: 耶稣弥赛亚
  rationale: Χριστός 在此与耶稣相连，仍带有称号“弥赛亚”的意义；中文不加“这位”或系词，表达简洁而庄重。
- source_word: καὶ τοῦτον ἐσταυρωμένον
  choice: 并他被钉十字架
  rationale: τοῦτον 回指并强调耶稣本人；完成时被动分词凸显他作为那位已被钉十字架者。保留原文紧缩而有力的表达，不将其弱化为单指一件往事。
theological_decisions:
- issue: Χριστός 的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 这里可理解为耶稣的受膏者称号，而不只是姓名的一部分，因此正文采用“弥赛亚”；传统译名“基督”列入脚注，以保留中文读者熟悉的对应形式。
- issue: ἐσταυρωμένον 的时态与神学重心
  choice: 他被钉十字架
  alternative: 他曾被钉十字架
  rationale: 完成时分词既指向已经发生的受难，也呈现耶稣作为被钉者的持续身份和意义；不加入“曾”可避免把重点限缩为纯粹过去的事件。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“决意”比“决定”稍具郑重感，符合保罗所表达的坚定取向；整体保留原文排除结构及末尾对被钉十字架之耶稣的强调。
