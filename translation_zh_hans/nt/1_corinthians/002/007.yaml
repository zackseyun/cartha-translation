  text: ἀλλὰ λαλοῦμεν ⸂θεοῦ σοφίαν⸃ ἐν μυστηρίῳ, τὴν ἀποκεκρυμμένην, ἣν προώρισεν ὁ θεὸς πρὸ τῶν αἰώνων εἰς δόξαν ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/007.yaml
  text: But we speak God's wisdom in a mystery[c][b][a], the hidden wisdom that God predestined before the ages for our glory.
translation:
  language: zh_hans
  text: 但我们讲的是上帝的奥秘智慧[a]，就是那隐藏的智慧；上帝在万世以前[c]预定了这智慧[b]，为要使我们得荣耀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奥秘智慧”也可按字面译作“在奥秘中的上帝智慧”，或理解为“以奥秘的方式讲上帝的智慧”。保罗常用“奥秘”指上帝曾经隐藏、后来显明的计划，并非指无法理解的谜团。
    reason: lexical_alternative
  - marker: b
    text: “预定”也可译作“预先决定”或“预先命定”。此处所预定的直接宾语是这智慧。
    reason: lexical_alternative
  - marker: c
    text: “万世以前”也可译作“众世代以前”或“世界开始以前”。
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλοῦμεν
  choice: 我们所讲的
  rationale: 采用“讲”表达 λαλέω 的普通言说义，并与上文的论述形成自然对照，不额外强化为正式“宣告”。
- source_word: θεοῦ σοφίαν
  choice: 上帝智慧
  rationale: 自然表达属格关系，保留这智慧属于并出于上帝的含义。
- source_word: ἐν μυστηρίῳ
  choice: 奥秘中的
  rationale: “奥秘”保留保罗用语中上帝旨意曾经隐藏、如今显明的含义；“中的”尽量保留介词结构，同时避免仅译作一般性的“秘密”。
- source_word: τὴν ἀποκεκρυμμένην
  choice: 就是那隐藏的智慧
  rationale: 阴性分词回指“智慧”；补出“智慧”，并以“就是”清楚呈现同位关系。
- source_word: προώρισεν
  choice: 已经预定
  rationale: “预定”直接表达在先决定或指定的词义；“已经”帮助现代汉语自然呈现不定过去时在此所指的既成决定，而不引入特定宗派体系。
- source_word: πρὸ τῶν αἰώνων
  choice: 在万世以前
  rationale: “万世”保留 αἰῶνες 的时代、世代性宇宙时间框架，也符合庄重而易懂的中文表达。
- source_word: εἰς δόξαν ἡμῶν
  choice: 要使我们得荣耀
  rationale: 按目的或结果方向自然译出 εἰς；“得荣耀”比生硬的“为了我们的荣耀”更符合现代汉语，同时不将其窄化为仅仅“得尊荣”。
theological_decisions:
- issue: 如何翻译具有教义分量的 προώρισεν
  choice: 预定
  alternative: 预先决定；预先命定
  rationale: 原词确实表达上帝事先作出的决定。“预定”保留其力度，但本节所预定的直接宾语在语法上是这隐藏的智慧或计划，而非在此明确讨论个别人的命运，因此不作进一步教义化解释。
- issue: εἰς δόξαν ἡμῶν 所指的荣耀
  choice: 使我们得荣耀
  alternative: 为了我们的荣耀；使我们得尊荣
  rationale: 保留“荣耀”的神学分量及目的性，同时不在正文中具体界定这种荣耀实现的时间和方式。
- issue: ἐν μυστηρίῳ 与“隐藏”的关系
  choice: 奥秘中的上帝智慧，就是那隐藏的智慧
  alternative: 以奥秘的方式讲上帝的智慧；讲上帝奥秘的智慧
  rationale: 希腊语可让介词短语修饰“智慧”或言说行为，语义也与随后“隐藏的”相连。正文采用最贴近词序并较自然的理解，脚注保留其他可能。
translation_notes:
  register: 采用现代、庄重且适合公开诵读的标准普通话。“上帝智慧”简洁自然；用分号标明同位说明之后转入上帝的行动。所有脚注标记均置于相关正文成分之后。
