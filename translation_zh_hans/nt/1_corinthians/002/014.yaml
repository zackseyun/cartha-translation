id: 1CO.2.14
reference: 1 Corinthians 2:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ψυχικὸς δὲ ἄνθρωπος οὐ δέχεται τὰ τοῦ πνεύματος τοῦ θεοῦ, μωρία γὰρ αὐτῷ ἐστίν, καὶ οὐ δύναται γνῶναι, ὅτι πνευματικῶς ἀνακρίνεται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/014.yaml
  text: But the natural person does not accept the things of the Spirit of God[a], for they are foolishness to him, and he is not able to know them[b], because they are spiritually discerned.
translation:
  language: zh_hans
  text: 然而，属血气的人[a]不接受上帝之灵的事，因为这些事对他来说是愚拙的；他也不能明白这些事，因为这些事要以属灵的方式来辨明[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不属灵的人”。
    reason: lexical_alternative
  - marker: b
    text: “辨明”也可译作“评断”或“查验”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ψυχικὸς
  choice: 属血气的
  rationale: 此词在上下文中与“属灵的”形成对照，指局限于普通人性生命层面的人。“属血气的”保留这一对照，同时不把希腊文进一步解释成明确的教义陈述。
- source_word: ἄνθρωπος
  choice: 人
  rationale: 这里虽为阳性单数，却泛指一类人，并非特指男性；现代汉语用“人”自然准确。
- source_word: δέχεται
  choice: 接受
  rationale: 不仅表示接收信息，也包含认可、接纳之意，符合本节语境。
- source_word: τὰ τοῦ πνεύματος τοῦ θεοῦ
  choice: 上帝之灵的事
  rationale: 保留希腊文宽泛的所属结构，不限定为恩赐、话语或启示等某一类别。
- source_word: μωρία
  choice: 愚拙的
  rationale: 与《哥林多前书》中上帝的智慧和人的判断之间反复出现的对照相呼应；作为表语译成“是愚拙的”符合自然汉语。
- source_word: γνῶναι
  choice: 明白
  rationale: 此处指领会、认识这些属灵之事，而非仅仅知道有关事实；“明白”在现代汉语中较为清楚自然。
- source_word: πνευματικῶς
  choice: 以属灵的方式
  rationale: 保留副词所表达的方式或领域，也避免直接把它释义为“靠圣灵”，因希腊文本身未如此明说。
- source_word: ἀνακρίνεται
  choice: 辨明
  rationale: 该词可指查验、评断或辨别；“辨明”适合本段关于属灵认识的语境，同时以脚注保留其他语义可能。
theological_decisions:
- issue: ψυχικὸς ἄνθρωπος与属灵辨明之间的对照
  choice: 属血气的人
  alternative: 不属灵的人；只凭本性而活的人
  rationale: “属血气的人”保留与πνευματικός的鲜明对照，却不把原文扩展为“没有圣灵的人”等更明确的神学解释。
- issue: πνευματικῶς的施事者或方式
  choice: 以属灵的方式
  alternative: 靠着圣灵
  rationale: 原文使用副词，并未明确说“由圣灵”；正文保留方式上的开放性，避免消除原文的神学张力。
- issue: ἀνακρίνεται的语义范围
  choice: 辨明
  alternative: 评断；查验
  rationale: 上下文偏重正确领会属灵之事，但该动词仍有评断和查验的意味，因此在脚注中保留替代译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“属血气”具有一定圣经语体色彩，但能简洁保留ψυχικός与πνευματικός的词义对照；句式按汉语习惯补出“这些事”，使所指清楚。
