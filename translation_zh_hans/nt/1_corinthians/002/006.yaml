  text: Σοφίαν δὲ λαλοῦμεν ἐν τοῖς τελείοις, σοφίαν δὲ οὐ τοῦ αἰῶνος τούτου οὐδὲ τῶν ἀρχόντων τοῦ αἰῶνος τούτου τῶν καταργουμένων·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/006.yaml
  text: Yet we do speak wisdom among the mature[a], but not a wisdom of this age or of the rulers of this age[c][b], who are being brought to nothing.
translation:
  language: zh_hans
  text: 然而，我们在成熟的人中讲的是智慧[a]；但不是这个时代的智慧，也不是这个时代的掌权者[c]的智慧；他们正在归于无有[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “成熟的人”或译“完全的人”；这里较可能指属灵上成熟的人。
    reason: lexical_alternative
  - marker: b
    text: “正在归于无有”也可译作“正在消逝”、“正被废除”或“正失去效力”。
    reason: lexical_alternative
  - marker: c
    text: “这个时代的掌权者”可能指人间的统治者、属灵权势，或两者兼指。
    reason: alternative_reading
lexical_decisions:
- source_word: Σοφίαν
  choice: 智慧
  rationale: 采用σοφία的常用对应词，并在本节两处保持一致，以保留原文的重复和强调。
- source_word: δὲ
  choice: 然而／但
  rationale: 原文两次δὲ均有转折作用；首处译作“然而”，次处译作“但”，使现代汉语自然，同时保留论述中的对比。
- source_word: λαλοῦμεν
  choice: 我们也讲
  rationale: λαλέω的基本义是“说、讲”，不必强化为“宣告”；“也”结合上下文表现原文带有强调的转折：保罗并非完全不讲智慧。
- source_word: ἐν τοῖς τελείοις
  choice: 在成熟的人中
  rationale: ἐν在这里自然译作“在……中”；τέλειοις在语境中较可能指成熟者，但脚注保留“完全的人”这一较形式对应的可能译法。
- source_word: οὐ τοῦ αἰῶνος τούτου
  choice: 不是这个时代的智慧
  rationale: αἰών译作“时代”，保留其时代性含义，不与κόσμος的“世界”混同；汉语补出“智慧”，使重复关系清楚。
- source_word: ἀρχόντων
  choice: 掌权者
  rationale: 该词泛指拥有统治或权柄者；“掌权者”可同时容纳人间权势与属灵权势的可能指向。
- source_word: τῶν καταργουμένων
  choice: 正归于无有
  rationale: 保留现在分词所表达的进行过程，并传达καταργέω在此处“失去效力、被废除、归于无有”的语义范围，而不把方式说得过窄。
theological_decisions:
- issue: “这个时代的掌权者”所指为何
  choice: 正文宽泛译作“掌权者”，不限定其为人间统治者或属灵权势。
  alternative: 可理解为人间政治或宗教领袖、属灵权势，或两者兼指。
  rationale: 希腊语本身未明确限定所指；保留这一歧义可避免在译文中预先解决有争议的神学问题。
- issue: τέλειοις是否指绝对完全
  choice: 正文译作“成熟的人”。
  alternative: “完全的人”。
  rationale: 上下文较支持生命或属灵上的成熟，而非无罪的绝对完美；脚注仍保留字面可能性。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“然而……也讲”体现上下文中的反转；用分号区分智慧的来源与掌权者的结局，避免末尾关系含混。所有脚注标记均已置于正文相应位置。
