  text: ἵνα ἡ πίστις ὑμῶν μὴ ᾖ ἐν σοφίᾳ ἀνθρώπων ἀλλ’ ἐν δυνάμει θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/005.yaml
  text: so that your faith might not be in the wisdom of men[a], but in the power of God.
translation:
  language: zh_hans
  text: 为要使你们的信心不在于人的智慧，而在于上帝的能力。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: 为要使
  rationale: 引出目的从句，保留希腊文的目的意味，同时符合现代汉语表达。
- source_word: ἡ πίστις ὑμῶν
  choice: 你们的信心
  rationale: 此处指哥林多人对福音的相信与信靠；“信心”比“忠信”更切合语境。
- source_word: μὴ ᾖ ἐν
  choice: 不在于
  rationale: 这里的ἐν表达信心所依凭的基础；汉语用“不在于”自然地呈现这种关系。
- source_word: σοφίᾳ ἀνθρώπων
  choice: 人的智慧
  rationale: ἀνθρώπων泛指人类，并非专指男性；“人的智慧”准确、简洁，也与后面的“上帝的能力”形成平行对照。
- source_word: δυνάμει θεοῦ
  choice: 上帝的能力
  rationale: 保留属格结构及与“人的智慧”的鲜明对比；“能力”在此指上帝实际施行作为的大能。
theological_decisions:
- issue: 信心“在”智慧或能力中的含义
  choice: 译作“不在于……而在于……”，保留所依凭之基础的含义
  alternative: 不依靠人的智慧，而依靠上帝的能力
  rationale: 直译“在……中”在现代汉语里略显生硬；“在于”既自然，又避免把原文明确收窄为单一的心理行动“依靠”。
- issue: ἀνθρώπων的性别范围
  choice: 译作“人的”，按泛指全人类理解
  alternative: 世人的；人类的
  rationale: 该词在本句中泛指人，不限于男性；现代汉语“人的”无需另加性别说明，也不引入原文没有的“世界”色彩。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。句式保持原文目的从句以及“人的智慧／上帝的能力”的平行对照；本节无须脚注。
