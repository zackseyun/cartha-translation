  text: ἣν οὐδεὶς τῶν ἀρχόντων τοῦ αἰῶνος τούτου ἔγνωκεν, εἰ γὰρ ἔγνωσαν, οὐκ ἂν τὸν κύριον τῆς δόξης ἐσταύρωσαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/008.yaml
  text: which none of the rulers of this age has known[a], for if they had known it, they would not have crucified the Lord of glory.
translation:
  language: zh_hans
  text: 今世的掌权者中，没有一个知晓这智慧[a]；因为他们若知晓，就不会把荣耀之主钉在十字架上了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “今世的掌权者”可能指人间的统治者、属灵权势，或二者兼指。
    reason: 保留原文关于掌权者身份的多重可能，不在正文中预先裁定。
lexical_decisions:
- source_word: ἣν
  choice: 这智慧
  rationale: 阴性单数关系代词回指上文的“智慧”。汉语不宜机械译作关系代词，重提“这智慧”能自然衔接并明确所指。
- source_word: ἀρχόντων
  choice: 掌权者
  rationale: 既表达行使权柄者，也保留其可能指人间统治者、属灵权势或二者兼有的宽度。
- source_word: αἰῶνος τούτου
  choice: 今世
  rationale: 保留 αἰών 的时代性含义；“今世”简洁自然，也符合保罗关于现今时代的表达。
- source_word: ἔγνωκεν / ἔγνωσαν
  choice: 知晓
  rationale: 较直接地表达 γινώσκω 的“知道、认识”，又比口语化的“知道”略显庄重；两处采用同一词，以保留原文重复。
- source_word: κύριον
  choice: 主
  rationale: 采用 κύριος 的常规译法，保留其称号及神学分量。
- source_word: δόξης
  choice: 荣耀
  rationale: “荣耀”是 δόξα 在此处准确而通行的译法。
- source_word: κύριον τῆς δόξης
  choice: 荣耀的主
  rationale: 保留属格结构及其庄严语气，不将其改释为单纯的“荣耀之主”以外的解释性表达。
- source_word: ἐσταύρωσαν
  choice: 钉在十字架上
  rationale: 准确体现 σταυρόω 所指的具体处刑方式，也是现代汉语圣经语体中清楚自然的表达。
theological_decisions:
- issue: “今世的掌权者”的身份
  choice: 在正文中笼统译作“今世的掌权者”，不限定其身份
  alternative: 明确译为人间政治或宗教领袖；明确译为邪灵或宇宙权势；解释为两者兼指
  rationale: 希腊语表达本身允许人间统治者、属灵权势或双重指涉。正文保留这种真实歧义，脚注提示主要可能性。
- issue: “知晓”的含义范围
  choice: 用“知晓”保留一般认知与较深认识之间的张力
  alternative: 译作“明白”，明确强调领悟神智慧的意义
  rationale: γινώσκω 在语境中可能含有领会之意，但原词并未迫使译文限定为“明白”；“知晓”更直接，也保留语义空间。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这智慧”自然承接上文；分号呈现原文因果论证。“他们若知晓，就不会……”用汉语条件句自然表达希腊语与事实相反的假设。
