  text: ἃ καὶ λαλοῦμεν οὐκ ἐν διδακτοῖς ἀνθρωπίνης σοφίας λόγοις, ἀλλ’ ἐν διδακτοῖς ⸀πνεύματος, πνευματικοῖς πνευματικὰ συγκρίνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/013.yaml
  text: These things we also speak[a], not in words taught by human wisdom, but in those taught by the Spirit, interpreting spiritual things to spiritual people.
translation:
  language: zh_hans
  text: 这些事，我们也讲，不是用人的智慧所教导的话，而是用圣灵所教导的话，用属灵的话表达属灵的事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向属灵的人解释属灵的事。”希腊语“属灵的”（πνευματικοῖς）在这里可作阳性复数与格，指属灵的人；也可作中性复数与格，并可补出“话”，指属灵的话。两种用法在此词形相同。
    reason: alternative_reading
lexical_decisions:
- source_word: ἃ
  choice: 这些事
  rationale: 承接上文所说神所赐、所启示的事；现代汉语中“这些事”自然清楚。
- source_word: λαλοῦμεν
  choice: 我们也讲
  rationale: 保留λαλέω表达说出、宣讲的口头意味，也与后文对“话”的讨论相呼应。
- source_word: οὐκ ἐν διδακτοῖς ἀνθρωπίνης σοφίας λόγοις
  choice: 不是用人的智慧所教导的话
  rationale: 以“用”表达ἐν在此的工具意义，同时保留“人的智慧”是这些话语之教导来源的结构。
- source_word: ἀλλ’ ἐν διδακτοῖς πνεύματος
  choice: 而是用圣灵所教导的话
  rationale: 从前句补出省略的λόγοις（话），使汉语完整；根据本章上下文将πνεύματος理解为神的圣灵。
- source_word: πνευματικοῖς πνευματικὰ συγκρίνοντες
  choice: 把属灵的事用属灵的话解释出来
  rationale: 将中性的πνευματικά译为“属灵的事”，并把πνευματικοῖς理解为省略“话”的工具格，与本句前面对两类话语的对照衔接。由于πνευματικοῖς也可作阳性、指“属灵的人”，另在脚注保留该读法。
theological_decisions:
- issue: πνεύματος所指为何
  choice: 圣灵
  alternative: 一般意义上的灵或属灵来源
  rationale: 哥林多前书2章的近距离上下文反复谈到神的灵启示并教导神的事，因此此处最自然地指圣灵。
- issue: πνευματικοῖς的性与所指
  choice: 中性，隐含“话”，即“用属灵的话”
  alternative: 阳性，指“属灵的人”，即“向属灵的人”
  rationale: 主译衔接前文关于“话”的鲜明对照，但希腊语的形态允许阳性理解，不能在翻译中抹去这一真实歧义，故收入脚注。
- issue: συγκρίνοντες的语义
  choice: 解释出来
  alternative: 配合、比较，或向属灵的人阐释
  rationale: 该词在此可表示结合、比较或解释；“解释出来”在语境中通顺，但不把与πνευματικοῖς相关的句法歧义当作已经确定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“人的智慧”比“人类的智慧”更贴近本段对属人智慧与圣灵教导的对照；重复“所教导的话”是为保留原文论述焦点并使省略成分在汉语中清楚。
