  source_fidelity: 主句准确呈现了ἃ καὶ λαλοῦμεν、两次διδακτοῖς的对照，以及πνεύματος在本段中指圣灵。末句的希腊文句法和συγκρίνω的具体含义均有争议；以“用属灵的话表达属灵的事”作为主译，可保留其与前文“话语”的连贯性，而不把“解释”这一较窄的语义定为唯一含义。
  naturalness: “这些事，我们也讲”及两次“用……所教导的话”庄重、清楚且符合现代标准汉语。“表达”比“解释出来”更简洁，也避免将原文有争议的动词过度具体化。
  terminology: “圣灵”“人的智慧”“属灵的事／属灵的话”一致且合乎本段语境。脚注须说明πνευματικοῖς的阳性与中性复数与格形式相同；原脚注将阳性理解与“中性形式”对立，容易造成形态学上的误解。
