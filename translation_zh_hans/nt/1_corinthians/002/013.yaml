revisions:
- from: 这些事，我们也讲，不是用人的智慧所教导的话，而是用圣灵所教导的话，把属灵的事用属灵的话解释出来[a]。
  to: 这些事，我们也讲，不是用人的智慧所教导的话，而是用圣灵所教导的话，用属灵的话表达属灵的事[a]。
  rationale: 保留原译对圣灵及“属灵的话”的主译判断，同时以较不限定的“表达”处理συγκρίνοντες。修订脚注以准确说明πνευματικοῖς的同形句法歧义，并完整保留“向属灵的人解释属灵的事”的替代读法。
