id: 1CO.2.4
reference: 1 Corinthians 2:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ ὁ λόγος μου καὶ τὸ κήρυγμά μου οὐκ ἐν ⸂πειθοῖ σοφίας⸃ ἀλλ’ ἐν ἀποδείξει πνεύματος καὶ δυνάμεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/004.yaml
  text: And my speech and my proclamation were not with persuasive wisdom, but with a demonstration of the Spirit and of power,
translation:
  language: zh_hans
  text: 我的言语和宣讲，不是凭着智慧的说服力[a]，而是凭着圣灵[b]和能力的明证。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“用智慧劝服人的话。”
    reason: lexical_alternative
  - marker: b
    text: “圣灵”或译“灵”。
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: 言语
  rationale: 这里指保罗说话的表达，与“宣讲”并列；“言语”既保留其一般含义，也符合上下文关于修辞方式的对比。
- source_word: κήρυγμα
  choice: 宣讲
  rationale: 体现公开传扬信息的含义，并与“言语”相区别；现代汉语中自然、庄重。
- source_word: πειθοῖ σοφίας
  choice: 凭着智慧的说服力
  rationale: 希腊文没有明说“话语”，主文因此不补入该名词；此译法保留“智慧”与“说服”之间略显紧密且可能多解的关系。
- source_word: ἀποδείξει
  choice: 明证
  rationale: 表达显明、证实或有力展示之意，并与单靠修辞说服形成对照。
- source_word: πνεύματος
  choice: 圣灵
  rationale: 本章上下文反复谈到从神而来的启示及神的灵，因此主文采用“圣灵”；同时在脚注保留泛指“灵”的可能。
- source_word: δυνάμεως
  choice: 能力
  rationale: 准确传达 δύναμις，并自然地与“圣灵”共同修饰“明证”。
theological_decisions:
- issue: πνεύματος 是指圣灵，还是泛指灵
  choice: 圣灵
  alternative: 灵
  rationale: 哥林多前书2章的论述指向神的灵及其工作，故主文译作“圣灵”；但词形本身并不带大小写区别，脚注保留“灵”这一可能，以免消除原文张力。
- issue: “明证”与“圣灵和能力”的关系
  choice: 保留“圣灵和能力的明证”这一紧密结构
  alternative: 圣灵所显出的能力明证
  rationale: 原文以两个属格名词并列，既可理解为圣灵与能力共同构成或带来明证，也可能强调圣灵所施展的能力；主文不将二者明确合并，以保留语法张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“言语和宣讲”保留两个近义词的并列；“智慧的说服力”刻意不增补原文没有的“话语”，并以脚注提供较顺畅的另一译法。
