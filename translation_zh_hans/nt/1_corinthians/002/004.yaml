  source_fidelity: 译文准确保留了 λόγος 与 κήρυγμα 的并列，以及“不是……而是……”的修辞对照。‘凭着智慧的说服力’可表达 πειθοῖ σοφίας 所指的、与智慧相关的劝服性修辞，而未在主文中增添‘话语’。‘凭着圣灵和能力的明证’对应 ἐν ἀποδείξει πνεύματος καὶ δυνάμεως，并保留两个并列属格之间未被原文完全限定的关系。
