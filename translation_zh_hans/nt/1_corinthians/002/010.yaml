id: 1CO.2.10
reference: 1 Corinthians 2:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἡμῖν ⸀γὰρ ⸂ἀπεκάλυψεν ὁ θεὸς⸃ διὰ τοῦ ⸀πνεύματος, τὸ γὰρ πνεῦμα πάντα ἐραυνᾷ, καὶ τὰ βάθη τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/010.yaml
  text: For God has revealed these things to us through the Spirit[a], for the Spirit searches all things[b], even the depths of God.
translation:
  language: zh_hans
  text: 因为上帝已经借着圣灵向我们启示了这些事[a]；圣灵察究万事，甚至上帝的深处[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文没有明说“这些事”；所指内容由上文补足。也可译作“向我们启示了它们”。
    reason: alternative_reading
  - marker: b
    text: “上帝的深处”也可译作“上帝深奥的事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμῖν
  choice: 向我们
  rationale: 将与“启示”搭配的与格译为领受启示的对象，符合现代汉语表达。
- source_word: ἀπεκάλυψεν
  choice: 已经……启示了
  rationale: 表达不定过去时所指的实际启示行动，并用“已经”自然凸显其现今仍然有效的结果，而不把时态机械化。
- source_word: '[ἀπεκάλυψεν的隐含宾语]'
  choice: 这些事
  rationale: 希腊文未明说直接宾语；“这些事”承接上文，使汉语完整清楚，同时以脚注说明原文的省略。
- source_word: διὰ τοῦ πνεύματος
  choice: 借着圣灵
  rationale: διά加属格表示媒介或施行方式；“借着”保留圣灵作为启示媒介的含义。
- source_word: πνεῦμα
  choice: 圣灵
  rationale: 上下文把启示归于这位灵，并说他察究上帝的深处，因此两处均指圣灵，而非一般人的灵。
- source_word: ἐραυνᾷ
  choice: 察究
  rationale: 既保留主动探察、彻底查考的语义力度，又比“搜索”更符合庄重自然的现代汉语。
- source_word: πάντα
  choice: 万事
  rationale: 简洁保留原文所指的广泛范围，并维持经文论述的庄重语体。
- source_word: καὶ
  choice: 甚至
  rationale: 此处具有递进强调作用，引出达到高潮的对象——上帝的深处。
- source_word: τὰ βάθη τοῦ θεοῦ
  choice: 上帝的深处
  rationale: 保留原文“深处”的空间隐喻及其开放性，不将其直接解释为奥秘、思想或计划。
theological_decisions:
- issue: πνεῦμα在两处是指圣灵还是人的灵
  choice: 两处均译为“圣灵”
  alternative: 译为一般意义的“灵”或“人的灵”
  rationale: 本节说启示是借着这位灵赐下的，又说这位灵察究万事、包括上帝的深处；紧邻语境强烈指向圣灵。
- issue: “圣灵察究”是否暗示圣灵原本不知道
  choice: 保留原文“察究”的主动表述
  alternative: 解释性地译成“完全知道”
  rationale: 原文使用ἐραυνᾷ，重点在彻底探察；不应为消除潜在神学张力而改写成单纯的“知道”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“借着圣灵”“察究万事”保持论述的凝练节奏；“上帝的深处”刻意保留希腊文隐喻，并由脚注提供更明白的词汇替代。两个脚注标记均置于正文相应位置。
