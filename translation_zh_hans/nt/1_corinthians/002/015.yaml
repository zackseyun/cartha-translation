id: 1CO.2.15
reference: 1 Corinthians 2:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὁ δὲ πνευματικὸς ἀνακρίνει ⸀τὰ πάντα, αὐτὸς δὲ ὑπ’ οὐδενὸς ἀνακρίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/015.yaml
  text: But the spiritual person evaluates all things[b][a], yet he himself is evaluated by no one.
translation:
  language: zh_hans
  text: 但属灵的人[a]察验万事[b]，自己却不受任何人察验。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “属灵的人”原文是一个作名词使用的阳性单数形容词，在这里泛指以圣灵为特征的人，并非只指男性。
    reason: cultural_note
  - marker: b
    text: “察验”也可译作“审察”、“辨明”或“判断”；本节两处使用的是同一个希腊动词。
    reason: lexical_alternative
lexical_decisions:
- source_word: πνευματικὸς
  choice: 属灵的人
  rationale: 该阳性单数形容词在此作名词使用，泛指以圣灵为特征的人；“属灵的人”在现代中文中自然简洁，也不把所指局限于男性。
- source_word: ἀνακρίνει / ἀνακρίνεται
  choice: 察验 / 受……察验
  rationale: ἀνακρίνω在上下文中指审察并作出判断。“察验”兼顾仔细考察与辨别判断的含义，并在主动句和被动句中保留原文的词语重复。
- source_word: τὰ πάντα
  choice: 万事
  rationale: 保留原文概括而不加限制的表达；“万事”庄重、自然，且不在正文中擅自限定为“属灵的事”。
- source_word: αὐτὸς
  choice: 自己
  rationale: 体现代词的强调作用，同时与中文泛指的“属灵的人”自然衔接。
- source_word: ὑπ’ οὐδενὸς
  choice: 不受任何人
  rationale: 准确保留原文绝对否定的语气，并构成自然的中文被动表达。
theological_decisions:
- issue: 保罗所说“属灵的人”之察验范围及其不受人察验的绝对表述
  choice: 正文保留“万事”和“不受任何人”的无条件措辞。
  alternative: 在正文中明确限定为“属灵的事”，或将“不受任何人察验”弱化为较有限的说法。
  rationale: 希腊文本本身采用概括性、绝对性的措辞，其具体范围应由上下文说明；正文若另加限制，就会过早消解原文保留的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“察验”略带经文语体色彩，但仍可理解，并能同时承载审察与判断两层意思；前后重复该词，以对应原文。
