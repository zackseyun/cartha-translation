  text: τίς γὰρ ἔγνω νοῦν κυρίου, ὃς συμβιβάσει αὐτόν; ἡμεῖς δὲ νοῦν Χριστοῦ ἔχομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/016.yaml
  text: For who has known the mind of the Lord[b][a], that he may instruct him? But we have the mind of Messiah.
translation:
  language: zh_hans
  text: 因为谁曾知道主的心意[a]，以致能教导他呢？但我们有弥赛亚的心意[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 保罗在这里呼应《以赛亚书》40:13。
    reason: cross_reference
  - marker: b
    text: 或译：“基督的心意。”
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γὰρ ἔγνω
  choice: 因为，谁曾知道
  rationale: “谁”直接保留反问；“因为”承接上文的论证关系；“曾知道”自然表达过去时在此引文中的概括性和现实关联。
- source_word: νοῦν κυρίου
  choice: 主的心意
  rationale: “心意”在现代汉语中能同时涵盖思想、认识和意向，比单用“心”或“思想”更自然，并保留νοῦς的丰富含义；“主”保持以赛亚书引文的经文回响。
- source_word: ὃς συμβιβάσει αὐτόν
  choice: 可以教导他
  rationale: 保留关系从句的反问结构；“教导”符合συμβιβάζω在此处指导、指教之义，“他”依原文指向“主”，不擅自明确化。
- source_word: ἡμεῖς δὲ
  choice: 但我们
  rationale: 明确表达保罗在无人能教导主与“我们”所拥有之心意之间所作的强烈转折。
- source_word: νοῦν Χριστοῦ ἔχομεν
  choice: 我们有弥赛亚的心意
  rationale: “有”直接对应ἔχομεν；重复“心意”保留与前半句νοῦν的词语呼应；“弥赛亚”体现Χριστός在此作为称号的意义。
theological_decisions:
- issue: Χριστοῦ在νοῦν Χριστοῦ中的译法
  choice: 弥赛亚的心意
  alternative: 基督的心意
  rationale: 此处Χριστός可理解为称号，译作“弥赛亚”保留其受膏者背景；脚注同时列出汉语教会传统中更常见的“基督”，不改变本句的神学主张。
- issue: “他”（αὐτόν）的所指
  choice: 保留代词“他”
  alternative: 明确译为“主”
  rationale: 原文使用代词，所指在语法和引文语境中是“主”；正文保留代词可维持原文形式，并避免不必要的解释性展开。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“谁曾知道……可以教导他呢？”保留原文反问及其张力；前后两次νοῦν均译为“心意”，使论证中的关键词呼应清楚可见。
