id: 1CO.2.1
reference: 1 Corinthians 2:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Κἀγὼ ἐλθὼν πρὸς ὑμᾶς, ἀδελφοί, ἦλθον οὐ καθ’ ὑπεροχὴν λόγου ἢ σοφίας καταγγέλλων ὑμῖν τὸ ⸀μαρτύριον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/001.yaml
  text: And I[a], when I came to you, brothers, did not come with lofty speech or wisdom[b], proclaiming to you the testimony of God.
translation:
  language: zh_hans
  text: 弟兄们[a]，我到你们那里去时，并没有凭着高超的言辞或智慧，向你们宣讲上帝的见证[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”在这里可泛指同信的人，包括会众中的女性。
    reason: cultural_note
  - marker: b
    text: 有些抄本作“上帝的奥秘”。
    reason: textual_variant
lexical_decisions:
- source_word: Κἀγὼ
  choice: 我
  rationale: καί承接上文，并以显明的第一人称代词略加突出；汉语借上下文和语序自然体现承接关系，不生硬加上“而我”。
- source_word: ἐλθὼν … ἦλθον
  choice: 我到你们那里去的时候，并不是……
  rationale: 将分词与主句动词的组合译为自然的时间从句和主句，同时保留原文重复“来/到”的结构意义。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊文阳性呼语的传统、庄重表达；其在混合会众中可泛指同信者，另以脚注说明。
- source_word: καθ’ ὑπεροχὴν λόγου ἢ σοφίας
  choice: 凭高超的言辞或智慧
  rationale: “高超”表达ὑπεροχή所含的卓越、凌驾之意，又能自然指向引人注目的修辞和智慧；“凭”体现κατά在此所表示的方式。
- source_word: καταγγέλλων
  choice: 向你们宣讲
  rationale: “宣讲”保留公开传扬、郑重宣布的语义，并在汉语中自然地与主句相连。
- source_word: μαρτύριον
  choice: 见证
  rationale: 依据SBLGNT正文的μαρτύριον翻译；“见证”既保留该名词的正式分量，也不把它缩窄为某一种具体内容。
- source_word: τοῦ θεοῦ
  choice: 上帝的
  rationale: 使用未加解释的属格结构，保留它可能表示来自上帝、关于上帝或属于上帝之见证的歧义。
theological_decisions:
- issue: μαρτύριον处的异文
  choice: 上帝的见证
  alternative: 上帝的奥秘
  rationale: SBLGNT正文采用μαρτύριον（“见证”）；部分抄本作μυστήριον（“奥秘”），这一有意义的异文在脚注中保留。
- issue: τοῦ θεοῦ的属格关系
  choice: 上帝的见证
  alternative: 来自上帝的见证／关于上帝的见证
  rationale: 原文属格可有不同理解，因此不在正文中限定为来源或内容，以保留其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“高超的言辞或智慧”保留保罗所否定的炫目修辞与智慧色彩；整体句法稍具书面感，以符合使徒书信的公开宣讲语域。
