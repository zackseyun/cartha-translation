  text: ἡμεῖς δὲ οὐ τὸ πνεῦμα τοῦ κόσμου ἐλάβομεν ἀλλὰ τὸ πνεῦμα τὸ ἐκ τοῦ θεοῦ, ἵνα εἰδῶμεν τὰ ὑπὸ τοῦ θεοῦ χαρισθέντα ἡμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/012.yaml
  text: But we have not received the spirit of the world[a], but the Spirit from God[b], so that we may know the things graciously given to us by God.
translation:
  language: zh_hans
  text: 但我们所领受的，不是世界的灵，而是从上帝而来的圣灵，为要使我们知道上帝出于恩典赐给我们的一切。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“明白”。
    reason: lexical_alternative
  - marker: b
    text: “出于恩典赐给”也可译作“白白赐给”或“作为礼物赐给”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα τοῦ κόσμου
  choice: 世界的灵
  rationale: 保留原文“灵”与后文“圣灵”的直接对照；“世界”在这里指与上帝相对的现今人类秩序及其支配性影响。
- source_word: ἐλάβομεν
  choice: 我们所领受的
  rationale: “领受”自然表达接受从上帝而来的赐予，并以“所……的”结构配合原文所强调的宾语。
- source_word: τὸ πνεῦμα τὸ ἐκ τοῦ θεοῦ
  choice: 从上帝来的圣灵
  rationale: ἐκ 表明来源，译作“从上帝来的”；上下文最自然地指上帝赐下的圣灵。
- source_word: ἵνα εἰδῶμεν
  choice: 为使我们知道
  rationale: 明确保留目的从句；“知道”贴近 οἶδα，同时脚注列出语境中可通顺表达的“明白”。
- source_word: χαρισθέντα
  choice: 本着恩典赐给
  rationale: χαρίζομαι 不只是一般的“给”，还含恩惠、白白赐予之意；该译法在现代汉语中保留这一语义。
- source_word: τὰ ... χαρισθέντα ἡμῖν
  choice: 上帝本着恩典赐给我们的事
  rationale: 中性复数 τὰ 所指范围宽泛，不应收窄为特定的“属灵恩赐”，因此译作“事”。
theological_decisions:
- issue: πνεῦμα τὸ ἐκ τοῦ θεοῦ 是否特指圣灵
  choice: 译作“从上帝来的圣灵”
  alternative: “从上帝来的灵”
  rationale: 紧邻上下文将其与“世界的灵”对照，并论及信徒从上帝所领受、使人认识上帝恩赐的灵，最自然是指圣灵；译作“圣灵”清楚传达这一所指。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“可是”自然承接上文的转折；以“世界的灵／从上帝来的圣灵”保留原文平行对照，并避免把宽泛的中性复数误解为仅指某类属灵恩赐。
