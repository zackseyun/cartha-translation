id: 1CO.2.11
reference: 1 Corinthians 2:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τίς γὰρ οἶδεν ἀνθρώπων τὰ τοῦ ἀνθρώπου εἰ μὴ τὸ πνεῦμα τοῦ ἀνθρώπου τὸ ἐν αὐτῷ; οὕτως καὶ τὰ τοῦ θεοῦ οὐδεὶς ⸀ἔγνωκεν εἰ μὴ τὸ πνεῦμα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/011.yaml
  text: For who among people knows the things of a person except the spirit of the person that is in him? In the same way[b][a], no one has known the things of God except the Spirit of God.
translation:
  language: zh_hans
  text: 因为，除了人里面的灵[b]，人中有谁知道人的事[a]呢？同样，除了神的灵，也没有谁知道神的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“人的心思”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“在人里面的、人的灵”；也可译：“那人里面的灵”。
    reason: translation_clarity
lexical_decisions:
- source_word: ἀνθρώπων / ἀνθρώπου
  choice: 人中 / 人的
  rationale: 原文泛指人类，并无男性限定；“人中”保留“在人当中”的范围，“人的”则自然表达单数泛指。
- source_word: τὰ τοῦ ἀνθρώπου
  choice: 人的事
  rationale: 这一表达范围较广，可包括人的思想和内在情形；“人的事”既不把含义缩窄为“心思”，也与后文“神的事”保持对应。
- source_word: πνεῦμα τοῦ ἀνθρώπου τὸ ἐν αὐτῷ
  choice: 人里面的灵
  rationale: 保留“人的灵”与“神的灵”的对照，并以自然中文表达该灵在人里面。
- source_word: οὕτως καὶ
  choice: 同样
  rationale: 简洁而清楚地标明前后两句之间的类比。
- source_word: ἔγνωκεν
  choice: 知道
  rationale: 希腊语完成时在此具有延续到现在的结果意义；现代汉语用“知道”最自然，也与前句的 οἶδεν 对应。
- source_word: τὰ τοῦ θεοῦ
  choice: 神的事
  rationale: 保留原文宽泛的指涉，不将其限缩为“神的心思”，同时维持与“人的事”的平行。
- source_word: πνεῦμα τοῦ θεοῦ
  choice: 神的灵
  rationale: 直译所有格结构，并按上下文指向神自己的灵，不额外加入原文未明说的教义术语。
theological_decisions:
- issue: πνεῦμα τοῦ θεοῦ 是指神自己的灵，还是泛指一种来自神的灵
  choice: 神的灵
  alternative: 属神的灵
  rationale: 上下文说这灵洞察并启示神的事，因此“神的灵”最直接地保留所属关系和人格性指向；“属神的灵”可能被理解为某个来自神的受造之灵。
- issue: 是否把 τὰ τοῦ ἀνθρώπου 和 τὰ τοῦ θεοῦ 解释为“心思”
  choice: 人的事 / 神的事
  alternative: 人的心思 / 神的心思
  rationale: 原文结构本身宽泛，虽在语境中涉及内在认知，却不宜在正文中把范围默默缩窄。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“人中有谁”保留原文“人当中谁”的结构；前后均用“……的事”，突出保罗论证中的严格平行。
