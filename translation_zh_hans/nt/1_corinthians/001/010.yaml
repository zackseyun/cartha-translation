source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἵνα τὸ αὐτὸ λέγητε πάντες, καὶ μὴ ᾖ ἐν ὑμῖν σχίσματα, ἦτε δὲ κατηρτισμένοι ἐν τῷ αὐτῷ νοῒ καὶ ἐν τῇ αὐτῇ γνώμῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/010.yaml
  text: I urge you[a], brothers, by the name of our Lord Jesus the Messiah, that you all say the same thing, and that there be no divisions among you[e][d][c][b], but that you be joined together in the same mind and in the same judgment.
translation:
  language: zh_hans
  text: 弟兄们，我奉我们主耶稣基督的名劝你们：你们众人都要说同样的话；你们中间不可有分裂，反要在同一心思和同一判断上得以完全合一。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “得以完全合一”也可译作“被修复”“被整合”或“重新配合得当”；原词可指修补、复原，或使事物处于合宜完整的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: 劝
  rationale: 表达带着关切和权威的恳切劝勉，比单纯的命令更符合此处语气。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊文阳性复数的形式；在当时会众语境中可代表全体信徒，现代汉语教会语域中也自然。
- source_word: διὰ τοῦ ὀνόματος
  choice: 借着……的名
  rationale: διά加属格可表示凭借或依据；此译兼顾耶稣之名所代表的权柄。
- source_word: Χριστοῦ
  choice: 基督
  rationale: “基督”是现代中文中通行且可理解的称号，指“受膏者／弥赛亚”，并非在此改作普通姓名。
- source_word: τὸ αὐτὸ λέγητε πάντες
  choice: 你们大家都要说同样的话
  rationale: 较直接保留原文的言说意象，不将其完全抽象化为“意见一致”。
- source_word: σχίσματα
  choice: 分裂
  rationale: 清楚表达群体内部的裂痕，且不采用较技术化的“宗派分裂”。
- source_word: κατηρτισμένοι
  choice: 彼此契合
  rationale: 在分裂的语境中表达被调整、修复而重新合宜地联结；中文采用状态性表达，避免生硬直译。
- source_word: νοῒ
  choice: 心思
  rationale: 指思维、理解和思想取向，与下文的 γνώμη 保持区别。
- source_word: γνώμῃ
  choice: 判断
  rationale: 可指意见、判断或定意；“判断”保留其认知和实践取向，而不武断限定为单一共同目标。
theological_decisions:
- issue: Χριστός作为基督论称号的译法
  choice: 基督
  alternative: 弥赛亚
  rationale: 中文“基督”是 Χριστός 的传统称号译法，仍具有“受膏者”的称号功能；采用“弥赛亚”也可，但会把希腊称号改用其希伯来／亚兰语对应词的音译。
- issue: ἀδελφοί是否显明包括女性信徒
  choice: 正文译“弟兄们”
  alternative: “弟兄姊妹们”
  rationale: 原文形式为阳性复数，而语境所指很可能是全体会众。正文保留形式准确性，不另加原文未明说的“姊妹”；中文读者可按群体称呼理解其涵盖范围。
- issue: 保罗所要求的一致程度
  choice: 保留“说同样的话”“同样的心思和同样的判断”
  alternative: 概括译作“完全同心合意”
  rationale: 较具体的译法保留原文对言语、思想和判断的三重强调，同时不把它系统化为所有事项上毫无差异。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“弟兄们”保持书信中的直接称呼；句子以分号划分禁止分裂与积极合一两面，使长句便于普通读者理解。唯一脚注标记[a]已置于正文相应句末。
