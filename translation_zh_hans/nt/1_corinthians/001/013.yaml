  to: 弥赛亚被分割了吗？难道保罗是为你们被钉十字架的吗？还是你们受洗归入了保罗的名下吗？[a][b]
  rationale: 修正第二问的被动语态，使保罗成为“被钉十字架”的承受者，而非执行钉十字架者；同时润色问句和脚注b。修订保留“弥赛亚”的称号译法、反问的否定预期，以及“归入……名下”所表达的洗礼归属方向。
