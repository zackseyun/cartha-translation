  text: μεμέρισται ὁ Χριστός; μὴ Παῦλος ἐσταυρώθη ὑπὲρ ὑμῶν, ἢ εἰς τὸ ὄνομα Παύλου ἐβαπτίσθητε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/013.yaml
  text: Has Messiah been divided? Was Paul crucified for you? Or were you baptized into the name of Paul?[a][b]
translation:
  language: zh_hans
  text: 弥赛亚被分割了吗？难道保罗是为你们被钉十字架的吗？还是你们受洗归入了保罗的名下吗？[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”也可译作“基督”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你们是奉保罗的名受洗的吗？”
    reason: lexical_alternative
lexical_decisions:
- source_word: μεμέρισται
  choice: 是被分割了吗
  rationale: 以“被分割”保留完成时被动语态所呈现的既成状态，并直接呼应哥林多信徒结党的语境。
- source_word: ὁ Χριστός
  choice: 弥赛亚
  rationale: 定冠词使称号意味较为突出；“弥赛亚”传达“受膏者”的称号含义，同时在脚注列出传统译法。
- source_word: μὴ
  choice: 难道
  rationale: 在第二个反问中用“难道”自然表达μή所提示的否定预期；首句的否定预期则由反问语气本身体现。
- source_word: ἐσταυρώθη ὑπὲρ ὑμῶν
  choice: 为你们钉了十字架
  rationale: 自然保留被钉十字架及ὑπέρ“为了、代表”的宽泛关系，不进一步限定其神学机制。
- source_word: εἰς τὸ ὄνομα Παύλου
  choice: 归入了保罗的名下
  rationale: “归入……名下”较自然地保留εἰς的方向性，以及受洗所表达的归属或关联；脚注提供更形式对应的译法。
- source_word: ἐβαπτίσθητε
  choice: 你们受洗
  rationale: “受洗”是现代汉语中清楚、通行的被动性表达，适合此处反问。
theological_decisions:
- issue: ὁ Χριστός在保罗反问中的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处带定冠词，称号意义明显，因此正文译作“弥赛亚”；传统且熟悉的“基督”保留在脚注中，避免抹去词汇层面的可选译法。
- issue: εἰς τὸ ὄνομα的洗礼表达
  choice: 归入……名下
  alternative: 奉……的名受洗／受洗归入……的名
  rationale: 正文力求在自然汉语中保留εἰς所含的归入、归属方向，又不把其神学内涵限定为单一解释；脚注列出较直译的表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。三个连续反问保留原文的责问力度；“分割”比“分裂”更直接保留被动形式及把弥赛亚分割开来的强烈意象。
