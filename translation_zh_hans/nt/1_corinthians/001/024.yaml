id: 1CO.1.24
reference: 1 Corinthians 1:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: αὐτοῖς δὲ τοῖς κλητοῖς, Ἰουδαίοις τε καὶ Ἕλλησιν, Χριστὸν θεοῦ δύναμιν καὶ θεοῦ σοφίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/024.yaml
  text: But to those who are called[a], both Jews and Greeks, Messiah is the power of God and the wisdom of God.
translation:
  language: zh_hans
  text: 但对那些蒙召的人，无论是犹太人还是希腊人，弥赛亚[a]是上帝的能力和上帝的智慧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κλητοῖς
  choice: 蒙召的人
  rationale: 该形容词在此作名词使用，指由上帝呼召的一群人；“蒙召的人”自然保留了呼召这一动作及被动含义。
- source_word: Ἰουδαίοις
  choice: 犹太人
  rationale: 与“希腊人”并列时，主要指犹太民族及其宗教身份；“犹太人”是现代汉语中最清楚自然的表达。
- source_word: Ἕλλησιν
  choice: 希腊人
  rationale: 原文明确使用“希腊人”，故不扩大解释为较宽泛的“外族人”。
- source_word: Χριστόν
  choice: 弥赛亚
  rationale: Χριστός在这里作为称号，译为“弥赛亚”可传达“受膏者”的称号意义；脚注列出汉语中惯用的另一译法“基督”。
- source_word: θεοῦ δύναμιν
  choice: 上帝的能力
  rationale: 直译属格结构，清楚保留其与后文“上帝的智慧”的平行和重复。
- source_word: θεοῦ σοφίαν
  choice: 上帝的智慧
  rationale: 保留原文第二次出现的θεοῦ，不以代词或省略方式弱化修辞上的平行。
- source_word: implicit copula / verbless predicate relation
  choice: 弥赛亚是上帝的能力和上帝的智慧
  rationale: 希腊文为承接上文的省略结构；汉语补出“是”，可自然、准确地表达其谓语关系。
theological_decisions:
- issue: 基督论称号Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处称号意义鲜明，译出“弥赛亚”可传达其语义内容，同时以脚注保留传统音译“基督”，不额外引入教派性解释。
- issue: “上帝的能力和上帝的智慧”的谓语关系
  choice: 补出系词“是”
  alternative: 不补系词，译作“弥赛亚——上帝的能力和上帝的智慧”
  rationale: 原句虽无明示系词并承接上一节，但谓语关系明确；补出“是”使本节在现代汉语中完整易懂，又不增加超出原文的神学判断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“但对……无论……还是……”保留原文的转折及犹太人／希腊人的并列结构；重复“上帝的”以呈现原文修辞。
