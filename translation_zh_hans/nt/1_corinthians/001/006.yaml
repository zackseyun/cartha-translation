  text: καθὼς τὸ μαρτύριον τοῦ Χριστοῦ ἐβεβαιώθη ἐν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/006.yaml
  text: just as the testimony about Messiah was confirmed among you[b][a],
translation:
  language: zh_hans
  text: 正如有关弥赛亚的见证[a]在你们中间[b]得到了证实，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“弥赛亚的见证”。
    reason: 保留τοῦ Χριστοῦ可能具有的不同属格关系。
  - marker: b
    text: 或译：“在你们里面”。
    reason: 保留ἐν ὑμῖν可表达内在范围的可能性。
lexical_decisions:
- source_word: καθὼς
  choice: 正如
  rationale: 引出与上文所述情况的对应关系；“正如”自然地保留了比较和承接作用。
- source_word: μαρτύριον
  choice: 见证
  rationale: 该词指具有作证性质的宣告或证言；“见证”既保留其证据意味，也避免将其过度释义为一般的“信息”。
- source_word: τοῦ Χριστοῦ
  choice: 有关弥赛亚的
  rationale: 正文按宾语属格理解，即见证的内容是弥赛亚；Χριστός在此具有称号含义，故译为“弥赛亚”。
- source_word: ἐβεβαιώθη
  choice: 得到了证实
  rationale: 该被动动词表示被确认、坚固或确立；“得到了证实”在现代汉语中自然，并保留被动含义。
- source_word: ἐν ὑμῖν
  choice: 在你们中间
  rationale: 受话者为复数，结合哥林多群体的语境，此处可自然理解为见证在他们这个群体中得到证实。
theological_decisions:
- issue: τοῦ Χριστοῦ的属格关系
  choice: 宾语属格：“有关弥赛亚的见证”
  alternative: 主语属格或未明确关系的属格：“弥赛亚的见证”
  rationale: 上下文较可能指使徒所传、内容关乎弥赛亚的见证，并且这见证在哥林多人中得到印证；但希腊文属格本身也可容许“弥赛亚的见证”，因此以脚注保留这一真实歧义。
- issue: ἐν ὑμῖν的范围
  choice: 群体意义：“在你们中间”
  alternative: 内在意义：“在你们里面”
  rationale: 复数代词及教会群体语境支持群体性的表达，但介词短语也可能强调见证在他们里面得到坚立，故以脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“正如”承接上文；“得到了证实”清楚表达过去时被动语态。保留句末逗号，以反映本节与上下文尚未结束的句法关系。
