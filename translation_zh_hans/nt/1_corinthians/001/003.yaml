  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: zh_hans
  text: 愿恩典与平安从我们的父神和主耶稣弥赛亚[a]临到你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“主耶稣基督”。
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: 恩典
  rationale: 保留保罗问安语中该词的神学分量及惯用含义，比“恩惠”更符合现代中文圣经语域。
- source_word: ὑμῖν
  choice: 临到你们
  rationale: 与“愿”构成自然的中文祝福表达，准确传达书信问安中与格所指的领受者。
- source_word: εἰρήνη
  choice: 平安
  rationale: 既自然，也保留该词在人际、整体福祉及圣约背景中的丰富含义。
- source_word: ἀπὸ
  choice: 从
  rationale: 直接标明恩典与平安的来源，并让同一个介词统领后面并列的两者。
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: 我们的父神
  rationale: 自然表达 θεοῦ 与 πατρὸς ἡμῶν 的同位关系，避免译成可能暗示不同希腊结构的“我们的神和父”。
- source_word: κυρίου
  choice: 主
  rationale: 这是 κύριος 作为尊称时庄重、通行且能保留神学分量的译法。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣弥赛亚
  rationale: 将 Χριστός 作为仍具称号意义的词译为“弥赛亚”；正文采用现代中文可理解的称号表达，并以脚注保留传统译法。
theological_decisions:
- issue: 是否保留恩典与平安共同来自父神和耶稣的并列来源关系
  choice: 只使用一次“从”，使其同时统领“我们的父神”和“主耶稣弥赛亚”
  alternative: 在“主耶稣弥赛亚”前重复“从”，或改写句子以弱化并列
  rationale: 希腊文以同一个 ἀπό 统领两个并列对象；照此翻译保留原文关系，而不额外作教义解释。
- issue: Χριστός 在此处译作称号还是采用传统音义形式
  choice: 正文译作“弥赛亚”
  alternative: 译作“基督”
  rationale: 该问安公式虽已高度固定，但 Χριστός 的受膏者称号意义仍可辨认；“弥赛亚”保留这一意义，同时在脚注提供传统译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“愿……临到你们”补出中文祝福句所需的语法成分，并未增加新的实质内容；全句保持原文简洁的书信问安风格。
