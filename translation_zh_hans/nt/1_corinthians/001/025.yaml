  text: ὅτι τὸ μωρὸν τοῦ θεοῦ σοφώτερον τῶν ἀνθρώπων ἐστίν, καὶ τὸ ἀσθενὲς τοῦ θεοῦ ἰσχυρότερον τῶν ⸀ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/025.yaml
  text: Because the foolishness of God is wiser than people, and the weakness of God is stronger than people.
translation:
  language: zh_hans
  text: 因为上帝的愚拙比人更有智慧，上帝的软弱比人更刚强。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 承接上文，表达原因或说明关系；与英文审校层的“Because”一致。
- source_word: τὸ μωρὸν τοῦ θεοῦ
  choice: 上帝的愚拙
  rationale: 保留原文刻意形成的悖论式表达，不将其解释性改写为“看似愚拙的事”。
- source_word: σοφώτερον τῶν ἀνθρώπων
  choice: 比人有智慧
  rationale: 自然表达比较关系；ἄνθρωποι泛指人类，不限于男性。
- source_word: τὸ ἀσθενὲς τοῦ θεοῦ
  choice: 上帝的软弱
  rationale: 保留与“上帝的愚拙”平行的名词化表达及其修辞张力。
- source_word: ἰσχυρότερον τῶν ἀνθρώπων
  choice: 比人刚强
  rationale: “刚强”体现ἰσχυρός的力量含义，并与“软弱”形成鲜明对照；“人”泛指人类。
theological_decisions:
- issue: “上帝的愚拙／软弱”是否应解释为仅在人看来如此
  choice: 保留原文直接的悖论式措辞
  alternative: 上帝看似愚拙的，比人的智慧更有智慧；上帝看似软弱的，比人的力量更强大
  rationale: 原文没有明说“看似”或“在人看来”；直译可保留保罗有意制造的神学与修辞张力，同时上下文会限定其含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“有智慧／刚强”形成自然的比较句，并保留原文两分句的平行结构。
