  text: I also baptized the household of Stephanas[a]; beyond that[b], I do not know if I baptized anyone else.
translation:
  language: zh_hans
  text: 我也给司提法那一家施过洗[a]；除此以外，我不知道是否还给别人施过洗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“司提法那的家户”。这里的希腊词指一个家庭或家户共同体，不只是房屋。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβάπτισα
  choice: 施过洗
  rationale: 该不定过去时动词指为人施行洗礼；“施洗”是现代汉语中标准、清楚且不预设具体方式的译法。“过”自然表达已经发生的往事。
- source_word: δὲ καὶ
  choice: 也
  rationale: δέ在此是轻微承接，καί表示追加；合译为“也”符合保罗补充回忆的语气，避免不必要的转折。
- source_word: τὸν Στεφανᾶ οἶκον
  choice: 司提法那一家
  rationale: οἶκος在此主要指以司提法那为中心的家庭或家户共同体，而非房屋建筑；“一家”自然易懂，也保留成员范围未明的特点。
- source_word: λοιπὸν
  choice: 除此以外
  rationale: 该词引出上述例外之外的其余情况；“除此以外”准确体现保罗补充后作出的范围限定。
- source_word: οὐκ οἶδα
  choice: 我不知道
  rationale: 按希腊文直译为“不知道”；上下文虽涉及记忆，但不将其明确改译为“不记得”，以免缩窄原文表达。
- source_word: εἴ τινα ἄλλον ἐβάπτισα
  choice: 还给谁施过洗
  rationale: εἰ引出间接疑问，τινα ἄλλον指任何其他人；汉语用“不知道还给谁……”自然表达是否另有其人的不确定性。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语流畅的标准普通话。“司提法那一家”比“司提法那的家”更能避免被理解为建筑物；全句保留保罗临时补充并承认所知有限的语气。
