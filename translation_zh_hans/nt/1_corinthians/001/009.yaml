  text: πιστὸς ὁ θεὸς δι’ οὗ ἐκλήθητε εἰς κοινωνίαν τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/009.yaml
  text: God is faithful[a], by whom you were called into fellowship with his Son[c][b], Jesus the Messiah our Lord.
translation:
  language: zh_hans
  text: 神是信实的；你们借着他[a]蒙召，得以与他的儿子——我们的主耶稣弥赛亚[c]——相交[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们被他呼召。”
    reason: lexical_alternative
  - marker: b
    text: “相交”也可译作“团契”或“一同有分”。
    reason: lexical_alternative
  - marker: c
    text: 希腊文作“耶稣基督”；“弥赛亚”译出Χριστός作为“受膏者”的称号意义，传统常译作“基督”。
    reason: alternative_reading
lexical_decisions:
- source_word: πιστὸς
  choice: 信实的
  rationale: 此处为表语形容词，强调神可靠、守信的品格；“信实”既符合保罗书信的神学语境，也保持庄重自然。
- source_word: δι’ οὗ
  choice: 借着他
  rationale: διά加属格通常表示媒介或施事途径；“借着他”贴近希腊文结构，同时保留“由他”的施事含义。
- source_word: ἐκλήθητε
  choice: 蒙召
  rationale: 被动语态表明呼召来自神；“蒙召”是自然凝练的现代宗教汉语，也保留保罗用语的神学分量。
- source_word: κοινωνίαν
  choice: 相交
  rationale: κοινωνία兼有关系上的团契和共同参与之意；“相交”在本句中自然表达与神儿子的关系，同时以脚注保留“一同有分”的参与义。
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: 与他的儿子
  rationale: 该属格依附于κοινωνία；现代汉语宜按关系义表达为“与……相交”，不机械译为“他儿子的相交”。
- source_word: Χριστοῦ
  choice: 弥赛亚
  rationale: Χριστός在此仍保有称号意义；译作“弥赛亚”明确传达“受膏者”这一头衔，而不只沿用名称化的“基督”。
- source_word: κυρίου
  choice: 主
  rationale: “主”是κύριος在此基督论称号中的准确、通行译法。
theological_decisions:
- issue: Χριστοῦ应译作名称化的“基督”，还是表达称号意义的“弥赛亚”
  choice: 弥赛亚
  alternative: 基督
  rationale: 在“耶稣—Χριστός—我们的主”这一称号序列中，Χριστός的受膏者称号意义仍然存在；正文采用“弥赛亚”，脚注说明传统译名，避免把解释性含义隐藏起来。
- issue: κοινωνίαν主要表达关系上的相交，还是共同参与
  choice: 相交
  alternative: 一同有分
  rationale: 上下文指向信徒被召进入与神儿子的共同关系；“相交”最自然，但希腊词同时可以强调参与，因此在脚注中保留另一译法。
- issue: δι’ οὗ表达媒介还是直接施事
  choice: 借着他
  alternative: 由他
  rationale: διά加属格首先可表达“借着、通过”；在此神也显然是呼召者。正文保留希腊文的媒介结构，脚注给出符合汉语习惯的施事表达。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“神是信实的”保留原文句首的强调；破折号清楚标示“我们的主耶稣弥赛亚”与“他的儿子”为同位关系。
