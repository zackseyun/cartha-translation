source:
  edition: SBLGNT
  text: Βλέπετε γὰρ τὴν κλῆσιν ὑμῶν, ἀδελφοί, ὅτι οὐ πολλοὶ σοφοὶ κατὰ σάρκα, οὐ πολλοὶ δυνατοί, οὐ πολλοὶ εὐγενεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/026.yaml
  text: 'For consider your calling, brothers: not many of you were wise by human standards, not many were powerful, not many were of noble birth.'
translation:
  language: zh_hans
  text: 弟兄们[a]，你们想想自己蒙召的情形：按人的眼光看，你们中间有智慧的不多，有权势的不多，出身尊贵的也不多。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“弟兄们”是对全体会众的称呼，包括信主的女性。
    reason: cultural_note
lexical_decisions:
- source_word: Βλέπετε
  choice: 想想
  rationale: 该形式可理解为命令式“要思想”，也可理解为陈述式“你们看见”。结合上下文，保罗是在促使读者省察自身处境；“想想”自然地传达这种劝勉和修辞力量，又不过度强化语气。
- source_word: κλῆσιν
  choice: 蒙召的情形
  rationale: κλῆσις在这里指上帝对信徒的呼召，而非职业；“蒙召”符合保罗书信的用法，“情形”则使“想想你们的呼召”在现代汉语中更清楚自然，并衔接后面的群体构成。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊文阳性复数的直接称呼；本句实际面向全体会众，其包括女性的语用范围以脚注说明。
- source_word: οὐ πολλοὶ ... σοφοὶ
  choice: 你们中间有智慧的不多
  rationale: 原文省略但语境明确指哥林多信徒；汉语补出“你们中间”，可清楚表达群体中人数不多的意思。
- source_word: κατὰ σάρκα
  choice: 按人的眼光看
  rationale: 此处不是指字面的肉身，也不宜直接解释为“罪性”，而是指依照人的尺度或观点来判断。“按人的眼光看”在现代汉语中自然，并保留评价角度的限定。
- source_word: δυνατοί
  choice: 有权势
  rationale: 此处与智慧和高贵出身并列，主要涉及社会地位及影响力；“有权势”比泛指个人本领的“有能力”更贴合语境，同时不限定为某种具体官职。
- source_word: εὐγενεῖς
  choice: 出身尊贵
  rationale: 该词着重高贵的家世或社会出身；“出身尊贵”比单说“尊贵”更准确地表达血统和家世层面的含义。
theological_decisions:
- issue: κατὰ σάρκα所限定的评价标准
  choice: 译为“按人的眼光看”，并就近限定“有智慧”
  alternative: 译为“按肉体来说”或将其理解为对后三类人的总括限定
  rationale: 希腊语中该短语紧随σοφοί，最自然地修饰“有智慧”；语义上指人的评价标准。译文不把“肉体”神学化为罪性，也不擅自将其明确扩展到全部三个类别。
- issue: κλῆσις的神学所指
  choice: 采用“蒙召”，保留上帝呼召的被动含义
  alternative: 译为“身份”“职业”或明确扩写成“上帝呼召你们时”
  rationale: 保罗在此谈信徒的蒙召，但原文没有明说呼召者；“蒙召”既保留其神学含义，也避免在正文中加入原文未明说的主语。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。三个“不多”形成与原文相应的排比；“想想”保留劝勉语气，“蒙召”保留保罗书信中的神学用语，同时用“的情形”帮助普通读者理解句法。
