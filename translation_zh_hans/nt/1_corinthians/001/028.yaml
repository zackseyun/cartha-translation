id: 1CO.1.28
reference: 1 Corinthians 1:28
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: καὶ τὰ ἀγενῆ τοῦ κόσμου καὶ τὰ ἐξουθενημένα ἐξελέξατο ὁ θεός, ⸀τὰ μὴ ὄντα, ἵνα τὰ ὄντα καταργήσῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/028.yaml
  text: And God chose the lowborn things of the world and the despised things[a], the things that are not, to nullify the things that are[b],
translation:
  language: zh_hans
  text: 神也拣选了世上出身卑微的、受人鄙视的[a]，就是那些无有的，为要使那些有的失去效力[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被看作一无是处的”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“使……归于无有”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγενῆ
  choice: 出身卑微的
  rationale: 该词指没有显赫出身或社会地位低下的人或事物；此译保留其社会身份含义，也符合现代汉语表达。
- source_word: ἐξουθενημένα
  choice: 受人鄙视的
  rationale: 完成时被动分词表示已经被人轻看、视为毫无价值；“受人鄙视的”既体现被动含义，也保留轻蔑的力度。
- source_word: τὰ μὴ ὄντα
  choice: 那些无有的
  rationale: 采用较贴近原文而略带修辞色彩的表达，保留与“那些有的”之间关于‘无有／有’的鲜明对照，不把含义完全限定为社会地位。
- source_word: τὰ ὄντα
  choice: 那些有的
  rationale: 与“那些无有的”构成平衡对照，保留原文刻意而富张力的措辞。
- source_word: καταργήσῃ
  choice: 使……失去效力
  rationale: 该动词在这里表示使之失效、失去作用，而不必指彻底消灭；此译避免过度强化为本体上的毁灭。
- source_word: ἐξελέξατο
  choice: 拣选了
  rationale: “拣选”自然表达神有意作出的选择，并与本段反复出现的措辞相称。
theological_decisions:
- issue: τὰ μὴ ὄντα／τὰ ὄντα应理解为社会身份类别，还是绝对的本体论陈述
  choice: 正文保留“那些无有的／那些有的”的字面对照
  alternative: 意译为“那些算不得什么的人／那些自以为了不起的人”
  rationale: 上下文主要涉及世人眼中的身份和地位，但保罗的措辞更宽广、更尖锐。正文保留其张力，避免把解释直接写进经文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“无有的／有的”有意保留原文不寻常的对称结构和修辞张力；其余措辞尽量自然清晰。
