source:
  edition: SBLGNT
  text: τῇ ἐκκλησίᾳ τοῦ θεοῦ, ⸂ἡγιασμένοις ἐν Χριστῷ Ἰησοῦ, τῇ οὔσῃ ἐν Κορίνθῳ,⸃ κλητοῖς ἁγίοις, σὺν πᾶσιν τοῖς ἐπικαλουμένοις τὸ ὄνομα τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἐν παντὶ τόπῳ ⸀αὐτῶν καὶ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/002.yaml
  text: 'To the church of God that is in Corinth[a], to those sanctified in Messiah Jesus, called to be saints, together with all those who call on the name of our Lord Jesus the Messiah in every place[d][c][b], theirs and ours:'
translation:
  language: zh_hans
  text: 写信给在哥林多的上帝的教会，就是那些在基督耶稣里已经被分别为圣、蒙召作圣徒的人；连同各处所有呼求我们主耶稣基督之名的人——无论是他们的地方，还是我们的地方。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无论是他们的地方，还是我们的地方”原文结构简略，最直接可理解为各处地方同属他们和我们；也可理解为各处信徒都呼求主的名。另有一种解释把“他们和我们”与“主”相连，意为“他们的主，也是我们的主”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκκλησίᾳ τοῦ θεοῦ
  choice: 属于上帝的教会
  rationale: “教会”是现代汉语中自然且通行的群体称谓；以“属于上帝的”表达属格关系，避免将其仅理解为建筑或聚会场所。
- source_word: ἡγιασμένοις
  choice: 已经被分别为圣
  rationale: 保留完成时被动分词所表达的既成行动及其持续结果，也明确这是临到人的行动，而非单指人的道德修养。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: 在基督耶稣里
  rationale: “在……里”保留保罗这一联合性表达；“基督”是现代汉语圣经语域中对 Χριστός 的通行称谓，并仍具有受膏者的头衔内涵。
- source_word: κλητοῖς ἁγίοις
  choice: 蒙召作圣徒
  rationale: 在自然汉语中表达这些人因上帝的呼召而成为归他为圣的人；“蒙召”保留被动意味，“圣徒”在此指整个信徒群体，而非少数受封人物。
- source_word: ἐπικαλουμένοις τὸ ὄνομα
  choice: 呼求……之名的人
  rationale: “呼求……之名”保留敬拜、信靠和祈求的宗教语义，也符合庄重而可懂的现代汉语。
- source_word: ἐν παντὶ τόπῳ αὐτῶν καὶ ἡμῶν
  choice: 各处……无论是他们那里还是我们这里
  rationale: 将压缩的希腊语属格结构转为可懂的汉语，同时以脚注保留该短语所指范围及修饰关系上的不确定性。
theological_decisions:
- issue: Χριστός 的译法
  choice: 基督
  alternative: 弥赛亚
  rationale: “基督”在现代标准汉语中既是通行称谓，也可承载“受膏者”的头衔意义；在“基督耶稣”和“耶稣基督”这两个保罗式组合中，比“弥赛亚耶稣”更自然，并不把它处理成普通姓氏。
- issue: κλητοῖς ἁγίοις 的关系
  choice: 蒙召作圣徒
  alternative: 蒙召的圣徒／蒙召的圣民
  rationale: 希腊语由两个形容性成分并列，关系较为紧凑；正文采用自然汉语所需的“作”来表达蒙召而归圣的意义，但不将“圣徒”限定为后世制度中的特殊阶层。
- issue: αὐτῶν καὶ ἡμῶν 的所指
  choice: 按与“各处”相连处理
  alternative: 按与“主”相连理解，即“他们的主，也是我们的主”
  rationale: 词序最直接支持其与“各处”相连，但希腊语结构高度压缩，另一种理解在解释史上存在，因此不在正文中暗自消除，另以脚注说明。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“属于上帝的教会”避免把教会误解为地点；“分别为圣”保留圣经神学语义，同时以“已经被”呈现原文完成时被动的力度。正文中的脚注标记[a]与脚注完全对应。
