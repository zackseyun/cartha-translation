revisions:
- from: 写信给在哥林多、属于上帝的教会，就是在基督耶稣里已经被分别为圣、蒙召作圣徒的人；也写给各处所有呼求我们主耶稣基督之名的人——无论是他们那里还是我们这里。[a]
  to: 写信给在哥林多的上帝的教会，就是那些在基督耶稣里已经被分别为圣、蒙召作圣徒的人；连同各处所有呼求我们主耶稣基督之名的人——无论是他们的地方，还是我们的地方。[a]
  rationale: 修订以“连同”对应 σὺν，调整开头语序使汉语更自然，并将末尾属格短语译得更贴近字面，以正文和脚注共同保留其可能的关联范围及解释歧义。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:51:07Z'
review_pass:
  verdict: revise
  source_fidelity: 正文基本准确传达了收信对象、"在基督耶稣里"、完成时被动的"被分别为圣"、蒙召及呼求主名等要素。不过“也写给”将 σὺν（“连同／同着”）较强地改成另一组独立收信人；“他们那里还是我们这里”也把 αὐτῶν καὶ ἡμῶν 较明确地限为双方所在之地，宜以更贴近原文属格结构的措辞保留其压缩性和歧义。
  naturalness: 原译整体庄重清楚。“在哥林多、属于上帝的教会”中的并列停顿和“就是”略显拗口；改为“在哥林多的上帝的教会，就是那些……”更符合现代汉语书面语。
  terminology: “上帝”“教会”“基督耶稣”“分别为圣”“蒙召作圣徒”“呼求……之名”均符合现代汉语圣经语域，且没有不当加入教派性释义。
  issues:
  - severity: medium
    issue: “也写给”未充分体现 σὺν 的连接关系。
    rationale: σὺν πᾶσιν 的基本作用是“连同／与所有……一起”，而非明确开启第二个独立的“写给”对象。用“连同”可保留原文句法关系。
  - severity: medium
    issue: “无论是他们那里还是我们这里”对 αὐτῶν καὶ ἡμῶν 的所指作了较窄的解释。
    rationale: 原文在“各处”后以属格并列，虽最自然可关联“地方”，但其句法压缩，且有将其关联“主”的解释传统。正文宜写作“无论是他们的地方，还是我们的地方”，并由脚注说明替代关联，避免把“他们／我们”直接等同于“那里／这里”。
  - severity: low
    issue: 开头的地点和属格短语衔接略不自然。
    rationale: “在哥林多的上帝的教会”较清楚地对应 τῇ οὔσῃ ἐν Κορίνθῳ 与 τοῦ θεοῦ，并避免顿号造成的临时歧义。
