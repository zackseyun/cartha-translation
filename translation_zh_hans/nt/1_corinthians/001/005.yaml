  yaml_path: translation/nt/1_corinthians/001/005.yaml
  text: because in him you were enriched in every way, in all speech and all knowledge,
translation:
  language: zh_hans
  text: 因为你们在他里面凡事都得以富足，在一切言语和一切知识上都是如此。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: 因为
  rationale: 承接上一节保罗感恩的陈述，按因果义理解最合乎语境。
- source_word: ἐν παντὶ
  choice: 凡事
  rationale: 保留中性单数短语的广泛、概括意义，同时符合现代汉语表达。
- source_word: ἐπλουτίσθητε
  choice: 都得以富足
  rationale: 既保留“富足”的比喻，也用“得以”体现被动含义，表明这种丰富是领受而来的。
- source_word: ἐν αὐτῷ
  choice: 在他里面
  rationale: 保留ἐν所表达的范围或联合含义，不改写成“借着他”或“被他”。
- source_word: ἐν παντὶ λόγῳ
  choice: 在一切言语……上
  rationale: λόγος在与γνῶσις并列时较可能指言语表达；“言语”既简洁，也保留一定语义宽度。
- source_word: πάσῃ γνώσει
  choice: 在……一切知识上
  rationale: 按原文与“一切言语”的平行结构直译，并保留知识含义的广度。
theological_decisions:
- issue: ἐν αὐτῷ所表达的与基督之关系
  choice: 在他里面
  alternative: 借着他／被他
  rationale: 原文最自然地可指在基督里的范围或联合；译文保留这一保罗书信中的神学表达，不将其化约为单纯工具或施事关系。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“在一切言语和一切知识上都是如此”使句法自然，并明确后两项说明“凡事都得以富足”的具体方面。
