base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/014.yaml
  text: I am thankful that I baptized none of you except Crispus and Gaius,
translation:
  language: zh_hans
  text: 我感谢[a]，因为除了基利司布和该犹以外，我没有给你们任何人施洗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本作“我感谢我的上帝”；另有些作“我感谢上帝”。
    reason: SBLGNT正文采用未明说感谢对象的较短读法；部分抄本在“我感谢”后加入“我的上帝”或“上帝”。
lexical_decisions:
- source_word: εὐχαριστῶ
  choice: 我感谢上帝
  rationale: εὐχαριστέω在保罗书信中常以省略受词的方式表达向上帝感谢；现代汉语需补出受词才自然。补出“上帝”符合上下文和保罗惯用语，但因部分抄本明确有θεῷ，故用脚注说明文本差异。
- source_word: ὅτι
  choice: 因为
  rationale: 此处引出保罗感谢的缘由；汉语用“因为”比“感谢……这件事”更自然，也保留句间的因果关系。
- source_word: οὐδένα ὑμῶν
  choice: 你们中任何人
  rationale: 与前面的否定词“没有”组合，准确表达“你们当中一个也没有”的意思，同时行文自然。
- source_word: ἐβάπτισα
  choice: 施洗
  rationale: 采用现代汉语基督教语境中通行且中性的译法，不以“浸”预断施洗方式。
- source_word: εἰ μὴ
  choice: 除了……以外
  rationale: 在否定句中自然表达排除后的例外。
- source_word: Κρίσπον
  choice: 基利司布
  rationale: 采用现代中文圣经中较通行的人名音译。
- source_word: Γάϊον
  choice: 该犹
  rationale: 采用现代中文圣经中较通行的人名音译。
theological_decisions:
- issue: εὐχαριστῶ省略的感谢对象
  choice: 正文译作“我感谢上帝”并加文本脚注
  alternative: 仅译“我感谢”或“我很感恩”
  rationale: 按保罗惯用表达，隐含对象是上帝；现代汉语直译“我感谢，因为……”不完整，而“我很感恩”虽可避免补词，却较口语化。部分见证明确加入θεῷ，值得在脚注中交代。
- issue: βαπτίζω所指的施洗方式
  choice: 施洗
  alternative: 施浸／浸入水中
  rationale: 原词在此强调施行洗礼这一行为，句子本身不讨论具体方式；采用中性通行术语，避免加入宗派性判断。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“除了……以外”略显完整正式，适合经文语体；人名沿用中文圣经传统译名。
