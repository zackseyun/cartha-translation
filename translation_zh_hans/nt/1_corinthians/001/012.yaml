id: 1CO.1.12
reference: 1 Corinthians 1:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: λέγω δὲ τοῦτο ὅτι ἕκαστος ὑμῶν λέγει· Ἐγὼ μέν εἰμι Παύλου, Ἐγὼ δὲ Ἀπολλῶ, Ἐγὼ δὲ Κηφᾶ, Ἐγὼ δὲ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/012.yaml
  text: 'What I mean is this: each of you says[a], “I belong to Paul,” or “I belong to Apollos,” or “I belong to Cephas,” or “I belong to Messiah.”'
translation:
  language: zh_hans
  text: 我的意思是：你们各人都说：“我是属保罗的”，或“我是属亚波罗的”，或“我是属矶法的”，或“我是属弥赛亚的”[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥赛亚”或译“基督”。
    reason: 保留Χριστός的传统中文译法，并说明正文称号译法的对应形式。
lexical_decisions:
- source_word: λέγω δὲ τοῦτο ὅτι
  choice: 我的意思是：
  rationale: 以自然现代汉语表达保罗进一步说明的语气，并用冒号引出具体内容。
- source_word: ἕκαστος ὑμῶν λέγει
  choice: 你们各人都说
  rationale: 保留ἕκαστος的逐一、分配含义和λέγει的现在时陈述；这里指各人分别说出随后列举的一种口号，并非每个人说出全部口号。
- source_word: Ἐγὼ μέν εἰμι Παύλου / Ἐγὼ δὲ Ἀπολλῶ / Ἐγὼ δὲ Κηφᾶ / Ἐγὼ δὲ Χριστοῦ
  choice: 我是属保罗的……我是属亚波罗的……我是属矶法的……我是属弥赛亚的
  rationale: 属格与εἰμί表达归属或派别认同；“属……的”既贴近原文，也能自然传达哥林多人结党的口号，不把它过度解释为正式的师徒关系。
- source_word: Κηφᾶ
  choice: 矶法
  rationale: 按保罗此处所用的Κηφᾶς音译，而不改写为“彼得”，从而保留原文的人名形式。
- source_word: Χριστοῦ
  choice: 弥赛亚
  rationale: 将Χριστός按称号处理，以“弥赛亚”呈现其受膏君王的称号性质；传统译名“基督”列入脚注。
theological_decisions:
- issue: 派别口号中Χριστοῦ的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 原文在一连串归属口号中使用Χριστός，其称号意义仍应保留；正文采用“弥赛亚”，同时以脚注保留现代中文圣经读者熟悉的传统形式“基督”，不对声称“属弥赛亚”的这一派是否正当作额外裁断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“我是属……的”保留派别归属口号的重复节奏；人名使用现代中文圣经中通行的“保罗、亚波罗、矶法”。脚注标记紧随“弥赛亚的”，明确其所注释的词语。
