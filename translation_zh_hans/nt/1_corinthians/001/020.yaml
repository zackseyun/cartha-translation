  text: ποῦ σοφός; ποῦ γραμματεύς; ποῦ συζητητὴς τοῦ αἰῶνος τούτου; οὐχὶ ἐμώρανεν ὁ θεὸς τὴν σοφίαν τοῦ ⸀κόσμου;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/020.yaml
  text: Where is the wise man? Where is the scribe? Where is the debater of this age? Has not God made the wisdom of the world foolish?[a][b][c]
translation:
  language: zh_hans
  text: 智者[a]在哪里？文士在哪里？这个世代的辩论者[b]在哪里？上帝岂不是使世界的智慧成了愚拙[c]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “智者”原文为阳性单数，在这里很可能泛指这一类人；也可译作“有智慧的人”。
    reason: lexical_alternative
  - marker: b
    text: “这个世代”的“世代”与后文“世界”的“世界”在原文中是两个不同的词。
    reason: cross_reference
  - marker: c
    text: “使世界的智慧成了愚拙”也可译作“显明世界的智慧是愚拙的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ποῦ
  choice: 在哪里
  rationale: 在连续的修辞问句中译为“在哪里”，既保留原文形式，也自然表达挑战意味。
- source_word: σοφός
  choice: 智慧人
  rationale: 对应阳性单数名词化形容词；“智慧人”在此可代表整个类别，不限定为某一名男子。
- source_word: γραμματεύς
  choice: 经学家
  rationale: 比单纯的“文士”更能让现代读者理解其研习并讲解经典、律法的身份，同时保留历史语境。
- source_word: συζητητής
  choice: 辩士
  rationale: 表达善于辩论、争辩的人，并与本节关于世俗智慧的修辞形成呼应。
- source_word: τοῦ αἰῶνος τούτου
  choice: 这个世代的
  rationale: 将 αἰών 译作“世代”，与后面的 κόσμος“世界”明确区分。
- source_word: οὐχὶ
  choice: 岂不是……吗
  rationale: 准确传达预期肯定回答的修辞问句。
- source_word: ἐμώρανεν
  choice: 使……变成了愚拙
  rationale: 保留动词的使动意味；同时脚注说明也可理解为显明其愚拙。
- source_word: σοφίαν
  choice: 智慧
  rationale: 采用标准对应词，保留保罗刻意形成的“智慧—愚拙”对照。
- source_word: κόσμου
  choice: 世上
  rationale: 自然表达“世界的智慧”，并区别于前面的 αἰών“世代”。
theological_decisions:
- issue: 同一节中 αἰών 与 κόσμος 的区别
  choice: 分别译为“世代”和“世上”
  alternative: 两者都译为“世界”
  rationale: 原文有意使用两个不同词；保留区别可呈现“这个世代”与“世上智慧”之间相关而不完全相同的概念。
- issue: ἐμώρανεν 的使动或显明含义
  choice: 正文译为“使……变成了愚拙”
  alternative: “显明……是愚拙的”
  rationale: 正文保留该动词较直接的使动语气，同时以脚注保存可能的结果性或揭示性理解，不替读者消除张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。连续三个“在哪里”保留原文的排比和修辞挑战；“岂不是……吗”呈现预期肯定回答的语气。“经学家”兼顾历史身份与现代可懂度；“辩士”简洁保留论辩色彩。
