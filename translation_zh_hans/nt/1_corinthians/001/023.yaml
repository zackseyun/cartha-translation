  text: ἡμεῖς δὲ κηρύσσομεν Χριστὸν ἐσταυρωμένον, Ἰουδαίοις μὲν σκάνδαλον ⸀ἔθνεσιν δὲ μωρίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/023.yaml
  text: but we preach the Messiah crucified[a], to Jews a stumbling block and to Gentiles foolishness[b],
translation:
  language: zh_hans
  text: 但我们传扬的是被钉十字架的弥赛亚[a]：对犹太人来说，这是绊脚石；对外邦人来说，这是愚拙[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被钉十字架的基督”。
    reason: 保留Χριστός的传统译名，并反映其可被理解为较固定称谓的可能。
  - marker: b
    text: “外邦人”原文直译为“列国的人”；这里与“犹太人”对举，指非犹太人。
    reason: 说明ἔθνεσιν较宽的字面义及其在本节语境中的所指。
lexical_decisions:
- source_word: κηρύσσομεν
  choice: 传扬
  rationale: 体现公开宣告、传讲的信息活动，比单用“讲”更庄重自然。
- source_word: Χριστόν
  choice: 弥赛亚
  rationale: 此处强调所传之人的身份与称号，译作“弥赛亚”较能显出其头衔含义；“基督”作为传统译法保留于脚注。
- source_word: ἐσταυρωμένον
  choice: 被钉十字架的
  rationale: 保留完成时被动分词所表达的受难事实及其持续关联，同时符合现代汉语定语结构。
- source_word: Ἰουδαίοις
  choice: 犹太人
  rationale: 此处与ἔθνεσιν构成族群及宗教身份上的修辞对照，并非狭义地理称谓。
- source_word: σκάνδαλον
  choice: 绊脚石
  rationale: 保留使人绊倒的具体隐喻，避免以“冒犯”抹平原文形象。
- source_word: ἔθνεσιν
  choice: 外族人
  rationale: 原词字面可指“列国”，在与犹太人对举时指非犹太人；“外族人”以自然汉语表达这一关系，并在脚注交代字面意义。
- source_word: μωρίαν
  choice: 愚拙
  rationale: 与本章反复出现的同一语义场相呼应，也准确表达世人所作的负面判断。
theological_decisions:
- issue: Χριστός应译作头衔还是近似专名
  choice: 弥赛亚
  alternative: 基督
  rationale: 上下文聚焦使徒所传信息的内容，并突出被钉十字架者具有弥赛亚身份所造成的张力，因此正文显明头衔义，同时不排斥传统译名。
- issue: “被钉十字架”与“绊脚石／愚拙”的关系
  choice: 用冒号引出针对两类人的不同判断
  alternative: 仅用逗号连续连接
  rationale: 原文是省略系词的述谓结构；汉语以冒号、分号清楚呈现“对犹太人……对外族人……”的平行关系，而不增添因果解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“传扬的是”自然突出宣告内容；以冒号和分号呈现原文省略系词的两项平行判断。所有脚注标记均已置于正文相应位置。
