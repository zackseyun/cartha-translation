  text: ἐδηλώθη γάρ μοι περὶ ὑμῶν, ἀδελφοί μου, ὑπὸ τῶν Χλόης ὅτι ἔριδες ἐν ὑμῖν εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/011.yaml
  text: For it has been reported to me about you[a], my brothers, by Chloe’s people, that there are quarrels among you.
translation:
  language: zh_hans
  text: 因为，我的弟兄们[a]，革来的人已经把有关你们的事告诉我了：你们中间有纷争。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的弟兄姊妹们”。希腊原文作“弟兄们”，在这里可能是对全体信徒的概括称呼。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδηλώθη
  choice: 已经……告诉了我
  rationale: 希腊文为被动式，表示此事已让保罗得知；中文用主动表达并补出信息来源，更自然，也保留“已经得知”的完成意味。
- source_word: γάρ
  choice: 因为
  rationale: 承接上一节，说明保罗为何劝他们同心合意。
- source_word: περὶ ὑμῶν
  choice: 你们的事
  rationale: 自然表达“关于你们的情况”，不把内容限定得过窄。
- source_word: ἀδελφοί μου
  choice: 我的弟兄们
  rationale: 贴近阳性复数原文，同时以脚注说明在此可能包括全体信徒。
- source_word: ὑπὸ τῶν Χλόης
  choice: 革来家里的人
  rationale: 指与革来有关的一群人；“家里的人”自然易懂，但不像“家人”那样只限定为亲属，也不像“家族”那样过度具体。
- source_word: ἔριδες
  choice: 纷争
  rationale: 表示群体中的争执和冲突；“纷争”庄重而通俗，并与上下文所谈的结党分争相称。
- source_word: ἐν ὑμῖν εἰσιν
  choice: 你们中间有
  rationale: 符合现代汉语存在句的自然表达。
theological_decisions:
- issue: 混合性别教会语境中ἀδελφοί的译法
  choice: 我的弟兄们
  alternative: 我的弟兄姊妹们
  rationale: 正文保留希腊文阳性复数的形式，不掩盖原文措辞；脚注同时说明它在此可能是对整个信徒群体的概括称呼。
- issue: τῶν Χλόης所指群体的身份
  choice: 革来家里的人
  alternative: 革来的人／革来家中的人／革来的家人
  rationale: 原文只明确这些人与革来有关，并未说明他们必定是亲属、奴仆或正式家户成员，因此避免进一步确定其身份。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“革来”沿用常见圣经人名译法；以冒号引出所报告的具体内容，使中文句法清楚。
