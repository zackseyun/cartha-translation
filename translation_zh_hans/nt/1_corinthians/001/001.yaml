  text: Paul[a], a called apostle of Messiah Jesus by the will of God, and Sosthenes our brother,
translation:
  language: zh_hans
  text: 保罗，奉神的旨意蒙召，作弥赛亚耶稣[a]的使徒，和我们的弟兄所提尼，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基督耶稣”。
    reason: Χριστός既可按其称号意义译为“弥赛亚”，也可依中文传统译为“基督”。
lexical_decisions:
- source_word: Παῦλος
  choice: 保罗
  rationale: 采用现代中文圣经与基督教语境中通行的人名译法。
- source_word: κλητὸς ἀπόστολος
  choice: 蒙召作……使徒
  rationale: κλυτός作形容词修饰ἀπόστολος，表达保罗的使徒身份源于呼召；“蒙召作”既自然，也没有把呼召与使徒身份割裂。
- source_word: Χριστοῦ Ἰησοῦ
  choice: 弥赛亚耶稣
  rationale: 保留原文“Χριστοῦ”在“Ἰησοῦ”之前的次序，并将其作为称号译为“弥赛亚”；同时以脚注提供中文更惯用的“基督耶稣”。
- source_word: διὰ θελήματος θεοῦ
  choice: 奉神的旨意
  rationale: διά加属格在此表示使徒职分所依据的神圣旨意；“奉神的旨意”是自然、庄重的中文表达。
- source_word: Σωσθένης
  choice: 所提尼
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: ὁ ἀδελφὸς
  choice: 我们的弟兄
  rationale: 原文有定冠词而无物主代词；在书信联名问候中，“我们的弟兄”自然表达其属于共同信仰群体的关系，避免生硬的“那弟兄”。
theological_decisions:
- issue: 保罗问候语中Χριστός的译法
  choice: 弥赛亚耶稣
  alternative: 基督耶稣
  rationale: 此处Χριστός仍指向耶稣的受膏者身份，故正文采用意义较透明的“弥赛亚”；考虑到该组合也可能已呈固定称号或名号化用法，脚注保留“基督耶稣”。
- issue: κλητὸς与使徒身份的关系
  choice: 蒙召作……使徒
  alternative: 蒙召的……使徒
  rationale: 两种译法都可反映形容词结构；“蒙召作使徒”在现代中文中更清楚地表达呼召与职分的关系，同时不增添呼召发生过程的细节。
translation_notes:
  register: 采用现代、庄重而易懂的书信起首语体。保留本节未完句的逗号，以衔接下一节收信人部分；“奉神的旨意”与“蒙召作……使徒”符合自然中文语序。
