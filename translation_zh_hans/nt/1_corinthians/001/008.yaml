  text: ὃς καὶ βεβαιώσει ὑμᾶς ἕως τέλους ἀνεγκλήτους ἐν τῇ ἡμέρᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/008.yaml
  text: who will also establish you to the end[c][b][a], blameless in the day of our Lord Jesus the Messiah.
translation:
  language: zh_hans
  text: 他也必坚固[a]你们到底，使你们在我们主耶稣弥赛亚[c]的日子无可指责[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使……坚定”，或“使……稳固”。
    reason: lexical_alternative
  - marker: b
    text: 或译“不受指控”，或“无可控告”。
    reason: lexical_alternative
  - marker: c
    text: 希腊文作“基督”；这里译作“弥赛亚”，以保留这一称号“受膏者”的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβαιώσει
  choice: 必坚固
  rationale: 该将来时动词表示使人坚定、稳固；“坚固”既保留其力量与稳固之意，也符合现代中文的圣经语体。
- source_word: ἕως τέλους
  choice: 直到末了
  rationale: 保留该短语持续至终末时点的时间含义；“末了”也能承载上下文中的末世意味，而不擅自限定具体事件。
- source_word: ἀνεγκλήτους
  choice: 无可指责
  rationale: 该词指不受指控、没有可据以控告之处；“无可指责”自然简洁，并由脚注补出其法律性语感。
- source_word: ἐν τῇ ἡμέρᾳ
  choice: 在……的日子
  rationale: 保留新约中指向末世审判之日的惯用表达，同时使中文句法自然。
- source_word: κυρίου
  choice: 主
  rationale: “主”是 κύριος 在此处最自然且具有称号分量的中文对应词。
- source_word: Χριστοῦ
  choice: 弥赛亚
  rationale: Χριστός 在此仍是称号；译作“弥赛亚”可显明其“受膏者”的身份意义，避免被理解为姓名的一部分。
theological_decisions:
- issue: 关系代词 ὃς 的所指
  choice: 以“他”承接上一节最近的先行词“我们的主耶稣弥赛亚”
  alternative: 理解为承接更早上下文中的上帝
  rationale: 就紧邻句法而言，上一节末尾阳性单数的“我们的主耶稣弥赛亚”是最自然的先行词。中文使用“他”承接，不额外重复名字，也不加入超出原文的解释。
- issue: ἀνεγκλήτους 与主句的关系
  choice: 译作“使你们……无可指责”，表达坚固所指向的结果
  alternative: 并列译作“你们……无可指责”或“成为无可指责的”
  rationale: 原文以形容词作补语，中文若机械并列会显得生硬；加入“使”清楚表达其补语关系，但不把“无可指责”解释为道德完美。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“直到末了”保留终末指向，“在……的日子”保留圣经惯用语；脚注标记均置于正文相应词语之后。
