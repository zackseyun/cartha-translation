source:
  edition: SBLGNT
  text: οὐ γὰρ ἀπέστειλέν με Χριστὸς βαπτίζειν ἀλλὰ εὐαγγελίζεσθαι, οὐκ ἐν σοφίᾳ λόγου, ἵνα μὴ κενωθῇ ὁ σταυρὸς τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/017.yaml
  text: For Messiah did not send me to baptize[a], but to proclaim the good news—not in wisdom of speech[c][b], so that the cross of Messiah might not be emptied.
translation:
  language: zh_hans
  text: 因为弥赛亚[a]差遣我，不是要我施洗，而是要我传扬福音——不是凭言语的智慧[b]，免得弥赛亚的十字架落空[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文 Χριστός，意为“受膏者”；传统译作“基督”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“用言辞的智慧”或“凭巧妙的口才”。原文直译近于“言语的智慧”。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“归于无效”或“失去效力”。原文使用“被变为空”或“被掏空”的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς / τοῦ Χριστοῦ
  choice: 弥赛亚 / 弥赛亚的
  rationale: 把 Χριστός 作为具有实义的称号来翻译，并在本节两处保持一致；“弥赛亚”在现代汉语基督教语境中自然且易于识别。
- source_word: βαπτίζειν
  choice: 施洗
  rationale: 采用现代汉语中明确、通行的教会用语，不把具体施行方式提前解释进正文。
- source_word: εὐαγγελίζεσθαι
  choice: 传扬福音
  rationale: 表达该动词“宣告好消息”的主动含义，同时保持现代汉语圣经语域的自然与庄重。
- source_word: σοφίᾳ λόγου
  choice: 凭言语的智慧
  rationale: 保留原文“智慧”和“言语”两个要素；“凭”自然表达 ἐν 在此所指的方式或手段，而不把它窄化为单纯的口才。
- source_word: κενωθῇ
  choice: 落了空
  rationale: 用自然汉语保留“成为空、归于无效”的意象和结果，避免在正文直接增添原文未明说的“能力”。
- source_word: σταυρὸς
  choice: 十字架
  rationale: 这是该词在保罗语境中准确、通行且具有相应神学分量的译法。
theological_decisions:
- issue: Χριστός 应译作实义称号，还是采用传统汉语称谓“基督”。
  choice: 弥赛亚
  alternative: 基督；受膏者
  rationale: 原文仍可感受到称号意味；“弥赛亚”比“基督”更能向普通读者提示这一点，同时没有把称号完全解释性地改写为“受膏者”。
- issue: “十字架落了空”具体指什么。
  choice: 正文保留较为开放的“落了空”
  alternative: 十字架失去效力；十字架被掏空
  rationale: κενόω 的比喻可涉及使之无效或使之失去能力；正文不把这种神学张力限定为某一种解释，脚注说明可能含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。为避免前一句“传扬福音”之后的否定修饰产生歧义，后一句补出“我传福音”，清楚表明“不凭言语的智慧”修饰传福音的方式。分号呈现原文主句、方式说明与目的从句之间的结构。
