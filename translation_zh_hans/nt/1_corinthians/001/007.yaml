  text: ὥστε ὑμᾶς μὴ ὑστερεῖσθαι ἐν μηδενὶ χαρίσματι, ἀπεκδεχομένους τὴν ἀποκάλυψιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/007.yaml
  text: so that you do not lack any gift as you eagerly await the revelation of our Lord Jesus the Messiah[a][b][c].
translation:
  language: zh_hans
  text: 以致你们在任何恩赐上都不缺少，同时热切等候我们的主耶稣基督显现[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “显现”或译“启示”“显露”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: 以致
  rationale: 承接上文神所赐的恩典及其结果；“以致”自然保留结果义。
- source_word: ὑμᾶς μὴ ὑστερεῖσθαι
  choice: 你们……都不缺少
  rationale: 表达没有欠缺或不足，并符合现代汉语习惯。
- source_word: ἐν μηδενὶ χαρίσματι
  choice: 在任何恩赐上
  rationale: χαρίσμα指由恩典赐下的礼物或能力；“恩赐”既简洁，也保留其与恩典的词义联系，而不限定为某一类属灵能力。
- source_word: ἀπεκδεχομένους
  choice: 同时热切等候
  rationale: 分词表示持续而殷切的期待；“同时”保留与主句动作并行的关系，“热切等候”体现加强的期待意味。
- source_word: τὴν ἀποκάλυψιν
  choice: 显现
  rationale: 该词本义为揭示、显露；在此末世语境中指主耶稣基督公开被显明。“显现”在中文中比“启示”更清楚地指向这一事件，同时脚注保留较形式对应的译法。
- source_word: τοῦ κυρίου ἡμῶν
  choice: 我们的主
  rationale: 按新约常用法将 κύριος 译为“主”，并保留第一人称复数所属关系。
- source_word: Ἰησοῦ Χριστοῦ
  choice: 耶稣基督
  rationale: 此处是固定、姓名化的称谓；现代中文圣经语域通常译作“耶稣基督”，自然且庄重。
theological_decisions:
- issue: ἀποκάλυψις在末世语境中的译法
  choice: 显现
  alternative: 启示／显露
  rationale: 这里所等候的是主耶稣基督公开被显明的事件，不只是信息的传达；“显现”表达该语境意义，脚注保留词面的其他可能。
- issue: Χριστός在Ἰησοῦ Χριστοῦ中的处理
  choice: 基督
  alternative: 弥赛亚
  rationale: 在这一固定组合中，Χριστός呈姓名化用法，译作“基督”符合现代中文惯例；“弥赛亚”会更突出其称号意义，而本句未明显前景化该称号。
- issue: χαρίσμα是否明确译为“属灵恩赐”
  choice: 恩赐
  alternative: 属灵恩赐
  rationale: 原文没有相当于“属灵”的修饰语；译作“恩赐”避免添加限定，也保留其范围可能较广的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“恩赐”保留保罗用语中的恩典背景；句式紧凑，并让本节自然承接上文。
