  text: Εὐχαριστῶ τῷ θεῷ ⸀μου πάντοτε περὶ ὑμῶν ἐπὶ τῇ χάριτι τοῦ θεοῦ τῇ δοθείσῃ ὑμῖν ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/004.yaml
  text: I thank my God always for you because of the grace of God given to you in Messiah Jesus[b][a],
translation:
  language: zh_hans
  text: 我常常为你们[a]感谢我的神，因为神在基督[b]耶稣里赐给你们的恩典。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为你们”也可译作“关于你们”。
    reason: lexical_alternative
  - marker: b
    text: “基督”意为“受膏者”，也可译作“弥赛亚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: 感谢
  rationale: 以现代汉语最自然的方式表达现在时直陈语气；结合“常常”，传达保罗持续感恩的意思。
- source_word: τῷ θεῷ μου
  choice: 我的神
  rationale: 保留希腊文明确的第一人称所属代词；“感谢我的神”符合现代汉语习惯。
- source_word: πάντοτε
  choice: 常常
  rationale: 在祷告和感恩语境中，“常常”比绝对化色彩较强的“总是”更自然，同时保留反复、恒常的时间意义。
- source_word: περὶ ὑμῶν
  choice: 为你们
  rationale: περί加属格在感恩套语中表示以某人为关切对象；“为你们”简洁自然。另以脚注保留“因着你们／关于你们”的可能表达。
- source_word: ἐπὶ τῇ χάριτι
  choice: 因为……恩典
  rationale: ἐπί加与格在这里说明感恩的根据或缘由；“因为”清楚传达因由关系。
- source_word: χάριτι τοῦ θεοῦ
  choice: 神……的恩典
  rationale: “恩典”是保罗书信中 χάρις 的常用且合宜的译法；句法调整后仍保留恩典属于并源于神的含义。
- source_word: τῇ δοθείσῃ ὑμῖν
  choice: 赐给你们的
  rationale: “赐给”既保留 δίδωμι 的被给予含义，又自然体现神是施予者。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: 在基督耶稣里
  rationale: 保留 ἐν 的空间隐喻及保罗常用的联合表达，不改写为单一解释；“基督耶稣”是现代中文圣经语域中自然、通行的称谓。
theological_decisions:
- issue: ἐν Χριστῷ Ἰησοῦ 所表达的关系
  choice: 在基督耶稣里
  alternative: 借着基督耶稣／由于基督耶稣
  rationale: 直译“在……里”可保留其可能包含的联合、领域或施恩处境等丰富含义，避免把它限定为工具或原因。
- issue: Χριστός 的称号表达
  choice: 基督
  alternative: 弥赛亚
  rationale: “基督”在现代汉语中是 Χριστός 的通行称号，且与“耶稣”连用自然；脚注提示“弥赛亚”，使其受膏者称号的语义保持可见。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“因为神在基督耶稣里赐给你们的恩典”保留原文因由结构，并避免把“在基督耶稣里”的关系过度解释。脚注标记均置于正文句末，依次对应介词短语和称号的译法说明。
