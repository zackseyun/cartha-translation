reference: 1 Corinthians 1:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Ὁ λόγος γὰρ ὁ τοῦ σταυροῦ τοῖς μὲν ἀπολλυμένοις μωρία ἐστίν, τοῖς δὲ σῳζομένοις ἡμῖν δύναμις θεοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/018.yaml
  text: For the message of the cross is foolishness to those who are perishing[b][a], but to us who are being saved it is the power of God.
translation:
  language: zh_hans
  text: 因为十字架的信息[a]，在那些正在灭亡的人看来是愚拙；但对我们这些正在得救的人来说，却是上帝的大能。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“十字架的话语”。
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  choice: 信息
  rationale: 这里指有关十字架所传讲的内容，而非单个字词；“信息”自然清楚，同时保留“话语”的词义可能性，并以脚注说明。
- source_word: σταυροῦ
  choice: 十字架
  rationale: 按原文保留凝练的表达；这里借十字架指向基督被钉十字架，却不在正文中展开其转喻含义。
- source_word: ἀπολλυμένοις
  choice: 正在灭亡的人
  rationale: 现在分词呈现持续中的状态或过程；“正在灭亡”比“失丧的人”更直接保留其体貌和强烈语义。
- source_word: μωρία
  choice: 愚拙
  rationale: “愚拙”是现代中文圣经语境中自然、庄重的名词，准确表达被视为愚蠢荒谬之意，并与“上帝的大能”形成鲜明对照。
- source_word: σῳζομένοις
  choice: 正在得救的人
  rationale: 保留现在分词所呈现的持续或正在实现的拯救现实，不将其简化为单纯已经完成的事件。
- source_word: δύναμις θεοῦ
  choice: 上帝的大能
  rationale: 自然而贴近原文地表达属格结构，保留其神学分量及与“愚拙”的谓语对比。
theological_decisions:
- issue: σῳζομένοις 所呈现的救恩体貌
  choice: 我们这些正在得救的人
  alternative: 我们这些已经得救的人／我们这些得救的人
  rationale: 希腊文现在分词自然呈现持续中的过程或当前现实；译作“正在得救”保留保罗话语中的张力，不把救恩仅限于过去已经完成的层面。
- issue: 十字架之 λόγος 的含义
  choice: 十字架的信息
  alternative: 十字架的话语
  rationale: 上下文侧重所宣讲的内容；“信息”符合现代汉语，但原词也可较形式化地译作“话语”，故保留脚注以免消除词义空间。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“因为”承接上文的 γὰρ；以“在……看来”和“对……来说”自然表达两个与格群体的鲜明对照。正文明确保留“正在灭亡／正在得救”的平行结构与持续体貌。
