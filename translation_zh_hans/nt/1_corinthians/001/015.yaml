  text: so that no one may say that you were baptized into my name[a].
translation:
  language: zh_hans
  text: 免得有人说，你们是受洗归入我的名下的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“奉我的名受洗。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μή τις εἴπῃ
  choice: 免得有人说
  rationale: ἵνα加否定词μή在此自然表达所要避免的结果或目的；“免得有人说”既符合现代汉语，也保留从属语气所含的可能性。
- source_word: εἰς
  choice: 归入
  rationale: εἰς基本方向义为“进入、归入”。在“受洗—名”的结构中译作“归入”，比单用“奉”更能保留希腊文的方向性及关系含义，同时不替文本预先界定其全部神学内涵。
- source_word: τὸ ἐμὸν ὄνομα
  choice: 我的名
  rationale: 直接保留原文的第一人称所有关系；“我的名”庄重、清楚，并与圣经语体相称。
- source_word: ἐβαπτίσθητε
  choice: 你们……受洗
  rationale: 保留第二人称复数及被动意义。“受洗”是现代中文基督教语境中通行且相对中性的表达，不借“浸入”等措辞限定具体施洗方式。
theological_decisions:
- issue: 如何翻译洗礼语境中的εἰς τὸ ἐμὸν ὄνομα
  choice: 归入我的名受洗
  alternative: 奉我的名受洗
  rationale: “归入”保留εἰς的方向性和洗礼所涉及的归属、关联张力；“奉……的名”在中文中很自然，但也可能使读者主要理解为凭权柄或以某人的名义行事，因此列为脚注异译，而不取代较贴近原文结构的正文。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“免得”准确承接上文并表达所要避免的结果；语序调整为“归入我的名受洗”，符合汉语习惯。正文中的脚注标记[a]与脚注完全对应。
