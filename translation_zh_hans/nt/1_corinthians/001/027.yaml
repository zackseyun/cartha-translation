  text: ἀλλὰ τὰ μωρὰ τοῦ κόσμου ἐξελέξατο ὁ θεός, ἵνα ⸂καταισχύνῃ τοὺς σοφούς⸃, καὶ τὰ ἀσθενῆ τοῦ κόσμου ἐξελέξατο ὁ θεός, ἵνα καταισχύνῃ τὰ ἰσχυρά,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/027.yaml
  text: But God chose the foolish things of the world so that he might shame the wise[c][b][a], and God chose the weak things of the world so that he might shame the strong.
translation:
  language: zh_hans
  text: 然而，神拣选了世上愚拙的[a]，为要使智慧的人蒙羞[b]；神也拣选了世上软弱的[c]，为要使强盛的蒙羞。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“世上愚拙的事物”；希腊文用中性复数形容词作名词，所指可以理解为世上被视为愚拙的人或事物。
    reason: lexical_alternative
  - marker: b
    text: “蒙羞”也可译作“受羞辱”或“显为羞愧”。
    reason: lexical_alternative
  - marker: c
    text: 或译“世上软弱的事物”；这里同样用中性复数形容词作名词，所指不必仅限于人或事物中的一类。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: 然而
  rationale: 承接上文形成鲜明转折；“然而”简洁、庄重，也符合现代书面汉语。
- source_word: τὰ μωρὰ τοῦ κόσμου
  choice: 世上愚拙的
  rationale: μωρά是中性复数形容词作名词用，所指不宜过早限定为人或事物；汉语“愚拙的”可保留这种开放性。τοῦ κόσμου译作“世上”，自然表达在世界范围或世界眼光中的归属。
- source_word: ἐξελέξατο
  choice: 拣选了
  rationale: 表达神有意作出的选择；“拣选”在庄重现代汉语中清楚，也保留该词在保罗论述中的神学分量。
- source_word: ἵνα
  choice: 为要
  rationale: 明确表达目的关系，同时保持句子的庄重和紧凑。
- source_word: καταισχύνῃ
  choice: 使……蒙羞
  rationale: 准确表达使对方受羞辱、显为羞愧的使役含义，比单说“羞辱”更贴近结果性的语气。
- source_word: τοὺς σοφούς
  choice: 智慧的人
  rationale: 阳性复数形容词作名词用，明确指有智慧的人；译出“人”在汉语中自然，也与希腊文的语法性别相符。
- source_word: τὰ ἀσθενῆ τοῦ κόσμου
  choice: 世上软弱的
  rationale: ἀσθενῆ是中性复数形容词作名词用；不补出“人”或“事物”，以保留原文宽泛的所指。
- source_word: τὰ ἰσχυρά
  choice: 强盛的
  rationale: 中性复数形容词作名词用，与“软弱的”构成对应；“强盛”兼具强有力和有势力之意，不把所指局限为身体强壮的人。
theological_decisions:
- issue: “世上愚拙的”和“世上软弱的”究竟指人还是事物
  choice: 正文不补出“人”或“事物”
  alternative: 译为“世上愚拙的人／事物”和“世上软弱的人／事物”
  rationale: 希腊文两处均用中性复数形容词作名词，可能概括人、事或在世人看来具有这些性质的一切；正文保留这种修辞上的宽度，脚注说明语法。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以重复“神……拣选了”保存原文的平行结构，并用分号呈现两组目的句。正文避免把两个中性复数实体化形容词过早限定为“人”或“事物”，同时将明确为阳性复数的“智慧者”译作“智慧的人”。
