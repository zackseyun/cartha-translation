  text: ἐξ αὐτοῦ δὲ ὑμεῖς ἐστε ἐν Χριστῷ Ἰησοῦ, ὃς ἐγενήθη ⸂σοφία ἡμῖν⸃ ἀπὸ θεοῦ, δικαιοσύνη τε καὶ ἁγιασμὸς καὶ ἀπολύτρωσις,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/030.yaml
  text: And it is from him that you are in Messiah Jesus[a], who became for us wisdom from God, and righteousness and sanctification and redemption,
translation:
  language: zh_hans
  text: 但你们在弥赛亚耶稣里，是出于上帝；他为我们成了来自上帝的智慧、公义[a]、成圣和救赎。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公义”或译“正义”。
    reason: 保留 δικαιοσύνη 在此处可能体现的“正义”语义，不在正文中排除该词的法理和伦理维度。
lexical_decisions:
- source_word: ἐξ αὐτοῦ
  choice: 出于上帝
  rationale: ἐξ 表示来源或根源；依上下文将代词所指明示为“上帝”，使现代汉语自然清楚，同时保留信徒在弥赛亚里的身份源于上帝这一重点。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: 在弥赛亚耶稣里
  rationale: 保留保罗“在……里”的联合性表达，不扩写为“与……联合”；Χριστός 按其称号含义译为“弥赛亚”。
- source_word: ἐγενήθη
  choice: 成了
  rationale: 直接表达 γίνομαι 在此处“成为、成了”的意思，并保留其所指状态及上帝作为来源的语境。
- source_word: σοφία ἡμῖν ἀπὸ θεοῦ
  choice: 为我们成了来自上帝的智慧
  rationale: “为我们”对应 ἡμῖν，“来自上帝”保留 ἀπὸ θεοῦ 的来源意义，并最直接地与“智慧”相连。
- source_word: δικαιοσύνη
  choice: 公义
  rationale: 在保罗这一救恩论语境中，“公义”既自然又能承载该词的关系与法庭性含义；另一可能译法列入脚注。
- source_word: ἁγιασμός
  choice: 成圣
  rationale: “成圣”准确表达分别为圣或成为圣洁的含义，并与此处救恩性的名词并列相称。
- source_word: ἀπολύτρωσις
  choice: 救赎
  rationale: “救赎”是现代中文圣经语体中清楚而准确的对应词，保留释放及付出代价的语义背景。
theological_decisions:
- issue: “来自上帝的智慧”与随后三个名词的关系
  choice: 以“也成了”连接“公义、成圣和救赎”，使它们可读为与“智慧”并列，同时保持紧密的解释关系。
  alternative: 将后三项明确处理为“智慧”的同位说明，译作“也就是公义、成圣和救赎”；或让“来自上帝”明确统摄全部四项。
  rationale: 希腊文容许同位解释或并列理解；正文不加入“也就是”等强解释语，避免排除其他合理句法关系。
- issue: ἐξ αὐτοῦ 中代词的所指
  choice: 译为“出于上帝”。
  alternative: 形式上保留为“出于他”。
  rationale: 上文明确谈论上帝的作为，且本节随后出现 ἀπὸ θεοῦ；现代汉语若只写“他”容易误指紧邻的耶稣，明示所指并未改变原文的神学主体。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“得以……是出于上帝”兼顾中文可读性与来源结构；保留“在弥赛亚耶稣里”“成圣”“救赎”等核心保罗用语，避免以解释性意译消解原文张力。
