  text: ἐπειδὴ καὶ Ἰουδαῖοι ⸀σημεῖα αἰτοῦσιν καὶ Ἕλληνες σοφίαν ζητοῦσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/022.yaml
  text: For Jews ask for signs[c][b][a], and Greeks seek wisdom.
translation:
  language: zh_hans
  text: 因为犹太人求神迹[a]，希腊人寻求智慧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “神迹”直译为“记号”，在这里指彰显超自然能力、作为凭证的记号。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδή
  choice: 因为
  rationale: 该词在这里引出对上下文论述的解释或理由；“因为”自然保留其因果意味。
- source_word: Ἰουδαῖοι
  choice: 犹太人
  rationale: 此处与“希腊人”构成文化和宗教群体上的对照，“犹太人”是现代汉语中准确自然的表达。
- source_word: σημεῖα
  choice: 神迹
  rationale: 该词本义为具有指示意义的“记号”；在此语境中指彰显超自然能力、用来印证权威的记号，汉语通常自然地表达为“神迹”，并以脚注保留较直译的可能。
- source_word: αἰτοῦσιν
  choice: 求
  rationale: “求”简洁对应请求、索求之意，又不加入“强求”或“要求”可能带有的过强语气。
- source_word: Ἕλληνες
  choice: 希腊人
  rationale: 保留保罗具体的文化措辞，并与随后的“智慧”形成鲜明关联；译作更宽泛的“外邦人”会削弱这一文化框架。
- source_word: σοφίαν
  choice: 智慧
  rationale: 直接保留原词的宽广含义，不把它过早缩窄为哲学或某种特定思想体系。
- source_word: ζητοῦσιν
  choice: 寻求
  rationale: 自然对应持续追求、寻找之意，并与前半句的“求”在措辞上适度区分。
theological_decisions:
- issue: σημεῖα是否在正文中明确为超自然神迹
  choice: 正文译作“神迹”，脚注注明直译“记号”
  alternative: 正文译作“记号”或“征兆”
  rationale: 上下文中的请求带有求超自然凭证的意味；“神迹”最符合现代中文圣经语境，但脚注保留该词作为具有指示作用之“记号”的基本语义，避免抹平其神学内涵。
- issue: Ἕλληνες的范围
  choice: 译作“希腊人”
  alternative: 译作“外邦人”
  rationale: 这里“希腊人”与“智慧”的并置凸显希腊文化语境；不将其泛化为所有外邦人，以保留原文的具体张力。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。保留原文“犹太人—希腊人”和“神迹—智慧”的平行对照；以“因为”承接上下文中的论证关系。
