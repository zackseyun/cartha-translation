  verdict: approve
  source_fidelity: 准确传达ὅπως引出的目的：“好让”自然地表达“为要使／使得”。“都不能……夸口”恰当反映μή加虚拟式καυχήσηται所表达的排除性目的。“凡有血气的”是汉语圣经语体中泛指全人类的既有表达，并保留了πᾶσα σὰρξ所强调的受造、属血肉的人类处境；没有误译为“罪性”。“在神面前”准确对应ἐνώπιον τοῦ θεοῦ。
