  text: so that no flesh may boast before God[a].
translation:
  language: zh_hans
  text: 好让凡有血气的都不能在神面前夸口[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“任何人都不能在神面前夸口。”原文直译：“所有肉体都不能……”。
    reason: 说明πᾶσα σὰρξ的字面表达及较通顺的意义译法。
lexical_decisions:
- source_word: ὅπως
  choice: 好让
  rationale: 引出目的或结果，保留原文的目的性，同时符合现代汉语表达。
- source_word: μὴ καυχήσηται
  choice: 都不能……夸口
  rationale: μή与虚拟语气动词共同否定该目的从句；结合主语的全称意义，译作“都不能夸口”自然且准确。
- source_word: πᾶσα σὰρξ
  choice: 凡有血气的
  rationale: 原文直译为“所有肉体”，在否定句中表示任何人都不例外。“凡有血气的”既保留肉身受造者的意象，也能让现代读者理解为所有人。
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: 在神面前
  rationale: 简洁保留“处于神面前、面对神”的含义，是自然且庄重的现代汉语表达。
theological_decisions:
- issue: 保罗语境中σάρξ的译法
  choice: 凡有血气的
  alternative: 任何人；所有人；所有肉体
  rationale: 本节的σάρξ不是指人里面的“罪性”，而是从受造、软弱的肉身层面泛指人类。“凡有血气的”保留了保罗的修辞意象，又避免误解为身体物质本身。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“凡有血气的”略带经文语体，但普通读者仍可理解；脚注补充直译和明译，以保留原文意象与语义透明度。
