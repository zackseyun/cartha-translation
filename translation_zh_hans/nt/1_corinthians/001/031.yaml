  yaml_path: translation/nt/1_corinthians/001/031.yaml
  text: 'so that[a], just as it is written: “The one who boasts must boast in the Lord.”'
translation:
  language: zh_hans
  text: 为要如经上所记：“夸口的，要在主里夸口。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“夸口的人，应当以主为夸口。”
    reason: 说明ὁ καυχώμενος的显性表达、ἐν κυρίῳ的对象性译法，以及καυχάσθω的命令语气的另一种自然汉语表达。
lexical_decisions:
- source_word: ἵνα
  choice: 为要
  rationale: 承接上文，表达目的或结果；中文用“为要”既简洁，也保留希腊语的目的意味。
- source_word: καθὼς γέγραπται
  choice: 应验经上所记
  rationale: καθὼς表示与经文所载相符，γέγραπται是引用圣经的完成时被动公式；合译后自然地引出引文。
- source_word: Ὁ καυχώμενος
  choice: 夸口的
  rationale: 用“……的”对应带冠词的分词，泛指任何夸口的人；“夸口”保留καυχάομαι可指自夸或以某者为荣的张力。
- source_word: ἐν κυρίῳ
  choice: 在主里
  rationale: 直译介词ἐν，保留夸口所处的范围、根据或对象之间的语义开放性，并符合保罗书信的表达。
- source_word: καυχάσθω
  choice: 要……夸口
  rationale: 以现代汉语“要”表达第三人称命令语气，兼顾命令或规范意味，不采用较书面的“当”。
theological_decisions:
- issue: 引文中命令语气的表达
  choice: 要在主里夸口
  alternative: 就当在主里夸口
  rationale: “要”在现代汉语中能自然表达规范性命令，同时避免古雅措辞，也不把命令弱化为单纯建议。
- issue: ἐν κυρίῳ的关系
  choice: 在主里
  alternative: 以主为夸口
  rationale: 保留介词原有表达，不限定为单一的对象关系，使“在主里面、以主为根据或以主为所夸”等可能意味继续存在。
- issue: κύριος的称谓
  choice: 主
  alternative: 上主
  rationale: 保罗在此引用经文，但其语境也容许基督论指向；译作“主”可保存这种互文与指称张力，不预先替读者消解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“经上所记”保留圣经引用公式的正式感；正文简洁有力，脚注交代介词结构和命令语气的译法差异。
