  text: γέγραπται γάρ· Ἀπολῶ τὴν σοφίαν τῶν σοφῶν, καὶ τὴν σύνεσιν τῶν συνετῶν ἀθετήσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/019.yaml
  text: 'For it is written: “I will destroy the wisdom of the wise[a], and I will set aside the understanding of the intelligent.”'
translation:
  language: zh_hans
  text: 因为经上记着：“我要摧毁智慧人的智慧，也要废弃[a]明达人的聪明。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “废弃”或译“弃绝”或“使……失效”。
    reason: 原词ἀθετέω在此可表达拒绝、取消效力或置于一旁，中文单一词语难以涵盖全部语义范围。
lexical_decisions:
- source_word: γέγραπται
  choice: 经上记着
  rationale: 这是引出圣经引文的完成时被动表达；“经上记着”自然体现所写之言持续有效，也明确其经文引述功能。
- source_word: γάρ
  choice: 因为
  rationale: 表示本节为前文提供根据；“因为”在现代汉语中清楚保留这一论证关系。
- source_word: Ἀπολῶ
  choice: 我要摧毁
  rationale: 保留ἀπόλλυμι在此处“毁灭、使败亡”的强烈语义，以及将来时的宣告语气。
- source_word: σοφίαν τῶν σοφῶν
  choice: 智慧人的智慧
  rationale: 保留σοφία与σοφός的同根反复及属格结构，维持引文鲜明的修辞效果。
- source_word: σύνεσιν τῶν συνετῶν
  choice: 明达人的聪明
  rationale: 以“明达”表达有辨识、理解能力的人，以“聪明”表达其理解与洞察；同时尽量保留原文同根词形成的对应。
- source_word: ἀθετήσω
  choice: 我要废弃
  rationale: ἀθετέω可指弃绝、废除或使失效；“废弃”简洁地表达上帝使这种聪明不再成立或发挥效力，而不额外解释其方式。
theological_decisions:
- issue: 如何呈现以赛亚书引文中上帝对人的智慧与聪明所采取的行动
  choice: 使用“我要摧毁……也要废弃……”两个直接的将来时表述
  alternative: 译作“我要使……落空”或“我要挫败……”
  rationale: 直译两个未来时动词，保留上帝行动的力度及两分平行结构，同时不将经文具体限定为挫败某项计划或某种教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“智慧人的智慧”和“明达人的聪明”刻意保留原文两组同根反复与平行结构；引号内保持预言式的直接宣告。
