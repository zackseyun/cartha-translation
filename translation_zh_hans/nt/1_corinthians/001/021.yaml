id: 1CO.1.21
reference: 1 Corinthians 1:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐπειδὴ γὰρ ἐν τῇ σοφίᾳ τοῦ θεοῦ οὐκ ἔγνω ὁ κόσμος διὰ τῆς σοφίας τὸν θεόν, εὐδόκησεν ὁ θεὸς διὰ τῆς μωρίας τοῦ κηρύγματος σῶσαι τοὺς πιστεύοντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/021.yaml
  text: For since[a], in the wisdom of God, the world did not know God through wisdom[b], God was pleased through the foolishness of the proclamation to save those who believe.
translation:
  language: zh_hans
  text: 因为，在上帝的智慧中，世人没有凭智慧认识上帝，上帝就乐意借着世人看为愚拙的宣讲[a]，拯救那些相信的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“借着愚拙的传道。”原文也可侧重宣讲这一行动；“愚拙”是世人的看法。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπειδὴ γὰρ
  choice: 因为
  rationale: 以自然的现代汉语承接上文并表达原因；希腊语两个连接成分的解释、因果功能在“因为”中合并呈现。
- source_word: ἐν τῇ σοφίᾳ τοῦ θεοῦ
  choice: 在上帝的智慧中
  rationale: 保留ἐν可能表示范围、处境或安排的含混性，避免明确译成工具性的“借着上帝的智慧”。
- source_word: οὐκ ἔγνω ὁ κόσμος
  choice: 世人没有……认识上帝
  rationale: κόσμος在这里代表人类世界，译作“世人”比“世界”作认知主体更符合现代汉语；“认识”保留γινώσκω兼具认知与关系的宽度。
- source_word: διὰ τῆς σοφίας
  choice: 凭智慧
  rationale: 表达διά加属格所指的途径或手段，同时不擅自补成“人的智慧”或“世上的智慧”。
- source_word: εὐδόκησεν ὁ θεὸς
  choice: 上帝就乐意
  rationale: 保留εὐδοκέω所含的美意和意愿，不弱化为单纯的“决定”。
- source_word: διὰ τῆς μωρίας τοῦ κηρύγματος
  choice: 借着世人看为愚拙的宣讲
  rationale: “宣讲”可兼顾κήρυγμα所指宣告的内容及宣告行为；补出“世人看为”使反讽在中文中清楚，并避免误称上帝的信息本身实质愚拙。
- source_word: σῶσαι
  choice: 拯救
  rationale: 采用保罗救恩语汇在现代汉语中的标准表达。
- source_word: τοὺς πιστεύοντας
  choice: 那些相信的人
  rationale: 清楚表达实词化的现在分词，不额外限定相信的方式或持续性。
theological_decisions:
- issue: διὰ τῆς μωρίας τοῦ κηρύγματος的所指
  choice: 主要指世人视为愚拙的宣讲信息，同时让“宣讲”保留宣告行为的意味
  alternative: 借着愚拙的传道方式
  rationale: κήρυγμα通常侧重所宣告的信息，但语境也可能连带公开宣讲的行动；正文不把二者截然分开，也不把“愚拙”当作上帝对福音的评价。
- issue: ἐν τῇ σοφίᾳ τοῦ θεοῦ的关系
  choice: 在上帝的智慧中
  alternative: 借着上帝的智慧／按照上帝的智慧
  rationale: 原文ἐν可表达范围、处境或安排；直译式表达保留上帝智慧与世人未能认识上帝之间未被完全说明的关系。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“上帝”与本项目用语一致；句式保留原文因果推进和神学张力，避免过度解释。
