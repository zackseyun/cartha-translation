  text: θεμέλιον γὰρ ἄλλον οὐδεὶς δύναται θεῖναι παρὰ τὸν κείμενον, ὅς ἐστιν Ἰησοῦς Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/011.yaml
  text: For no one can lay another foundation besides the one already laid[a], which is Jesus the Messiah.
translation:
  language: zh_hans
  text: 因为，除已经立好的根基以外，谁也不能立别的根基；这根基就是耶稣基督。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基督”意为“受膏者”，也就是“弥赛亚”。
    reason: 说明Χριστός的称号含义，并保留“弥赛亚”这一常见对应表达。
lexical_decisions:
- source_word: θεμέλιον
  choice: 根基
  rationale: 指建筑物的基础，并承接上下文的建造比喻；“根基”是现代汉语圣经语境中自然、庄重且清楚的对应词。
- source_word: γὰρ
  choice: 因为
  rationale: 说明本句是对上文的解释或论证；“因为”明确保留其因由关系。
- source_word: ἄλλον
  choice: 另……
  rationale: 与“立根基”组合为“另立根基”，自然表达另一个或不同的根基。
- source_word: οὐδεὶς δύναται
  choice: 谁也不能
  rationale: 既保留全称否定，也以自然的现代汉语表达能力或可能性上的否定。
- source_word: θεῖναι
  choice: 立
  rationale: 在建筑比喻中，汉语惯用“立根基”；较“放置”简洁自然。
- source_word: παρὰ τὸν κείμενον
  choice: 除了已经立好的
  rationale: παρά在此具有排除意味；κείμενον表示根基处于已经安置妥当的状态，“已经立好的”保留其结果状态。
- source_word: ὅς ἐστιν
  choice: 这根基就是
  rationale: 明确回指前述“根基”，同时保留其与耶稣基督之间的直接认同关系。
- source_word: Ἰησοῦς Χριστός
  choice: 耶稣基督
  rationale: 采用现代汉语中最通行、庄重且容易识别的名称与称号形式；脚注补明“基督”的称号含义。
theological_decisions:
- issue: Χριστός在Ἰησοῦς Χριστός中的表达
  choice: 耶稣基督
  alternative: 耶稣弥赛亚；耶稣——那位受膏者
  rationale: “耶稣基督”是现代标准汉语最自然、最通行的表达，也不把Χριστός降格为普通姓氏；以脚注说明其意为“受膏者”、即“弥赛亚”，保留称号的语义。
- issue: 根基与耶稣基督的关系
  choice: 这根基就是耶稣基督
  alternative: 根基所指的就是耶稣基督
  rationale: 原文用系词直接认同二者；正文不将其弱化为仅仅象征、代表或指向的关系。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“另立根基”简洁承接建筑比喻；分号呈现论断与身份说明之间的紧密关系。避免加入原文没有的主语、施事者或教派性解释。
