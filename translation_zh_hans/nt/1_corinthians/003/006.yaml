  yaml_path: translation/nt/1_corinthians/003/006.yaml
  text: I planted[a], Apollos watered, but God gave the growth.
translation:
  language: zh_hans
  text: 我栽种了，亚波罗浇灌了，但使它生长的是上帝。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但上帝使它生长”或“但上帝赐下生长。”
    reason: 说明ηὔξανεν可直接译为“使它生长”，也可按结果表达为“赐下生长”；原文未完成过去时可暗示持续中的作为，但不宜在正文以“不​​断”作过强限定。
lexical_decisions:
- source_word: ἐγὼ
  choice: 我
  rationale: 保留明确的人称代词及其对比作用；现代汉语以“我”自然地表达即可。
- source_word: ἐφύτευσα
  choice: 栽种了
  rationale: 准确保留农业比喻，并与下文“浇灌”和“生长”自然衔接。
- source_word: Ἀπολλῶς
  choice: 亚波罗
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: ἐπότισεν
  choice: 浇灌了
  rationale: 在栽种的语境中自然表达给植物浇水，也保留原文简洁的农业意象。
- source_word: ἀλλὰ
  choice: 但
  rationale: 清楚表达人的劳作与上帝使其生长之间的强烈转折。
- source_word: ὁ θεὸς
  choice: 上帝
  rationale: 明确保留上帝是使其生长的主体；“上帝”是现代标准汉语中自然、庄重的称谓。
- source_word: ηὔξανεν
  choice: 使它不断生长
  rationale: αὐξάνω在此为及物用法，表示使之生长；未完成过去时可体现持续或反复进行的作用。“使它不断生长”既自然，也保留上帝持续产生长势的意味。
theological_decisions:
- issue: 人的服事与上帝的决定性作为之间的关系
  choice: 保留保罗栽种、亚波罗浇灌的真实劳作，同时以强调句突出上帝才是使其生长的主体。
  alternative: 我栽种了，亚波罗浇灌了，但上帝使它生长。
  rationale: 原文并不否定人的工作，却以ἀλλά形成鲜明对比，把产生生长的决定性作用归于上帝；译文不进一步界定这种作用的机制。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。三个分句保持简洁平行；末句用“使它不断生长的是上帝”凸显原文对上帝这一主体的强调。脚注标记置于正文相应句末。
