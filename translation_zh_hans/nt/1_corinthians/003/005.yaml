  text: ⸀Τί οὖν ἐστιν ⸂Ἀπολλῶς; τί δέ ἐστιν Παῦλος⸃; ⸀διάκονοι δι’ ὧν ἐπιστεύσατε, καὶ ἑκάστῳ ὡς ὁ κύριος ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/005.yaml
  text: What then is Apollos? And what is Paul? Servants through whom you believed[c][b][a], as the Lord gave to each one.
translation:
  language: zh_hans
  text: 那么，亚波罗算什么？保罗又算什么？他们是仆役[b]，你们是借着他们才信的；各人都是照着主所赐的。[a][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那么，亚波罗是谁？保罗又是谁？”希腊文用“什么”，重点在他们的地位和作用，而非身份。
    reason: lexical_alternative
  - marker: b
    text: “仆役”也可译作“服事者”或“仆人”；这里不一定指教会中“执事”的职分。
    reason: lexical_alternative
  - marker: c
    text: 原文后半句结构简略，近于“并且各人照着主所赐的”。“主所赐的”具体指什么，原文没有说明；也可译作“各人照着主给他的”。
    reason: alternative_reading
lexical_decisions:
- source_word: Τί
  choice: 算什么
  rationale: 中性疑问词在这里着眼于亚波罗和保罗的地位或作用，而非询问其身份；“算什么”自然地保留了这一修辞重点。
- source_word: οὖν
  choice: 那么
  rationale: 既承接上文又带有推论意味，符合现代汉语表达。
- source_word: δέ
  choice: 又
  rationale: 连接两个平行的修辞问句，体现轻微对照而不过分强化转折。
- source_word: διάκονοι
  choice: 仆役
  rationale: 此处指为人效力的服事者或代理人，并非特指教会中的执事职分；“仆役”也契合保罗降低领袖地位的语境。
- source_word: δι’ ὧν
  choice: 借着他们
  rationale: 保留διά加属格所表达的媒介或工具意义，表明他们是信主过程中的服事媒介。
- source_word: ἐπιστεύσατε
  choice: 信了主
  rationale: 动词本身直译为“信了”；汉语中补出“主”使句意自然，但受词在希腊文中并未明说，故以脚注说明。
- source_word: καὶ ἑκάστῳ ὡς ὁ κύριος ἔδωκεν
  choice: 各人照着主所赐的而服事
  rationale: 原文省略了“赐”的宾语及与前句的具体句法关系。主文适度补足“而服事”以形成自然汉语，同时用脚注保留“给各人”的较形式对应译法及其开放性。
- source_word: κύριος
  choice: 主
  rationale: 采用新约语境中κύριος的标准译法，不在主文中进一步限定所指。
theological_decisions:
- issue: “主”（κύριος）的所指
  choice: 主文仅译作“主”，不明确补成“主耶稣”或“神”
  alternative: 明确译作“主耶稣”或理解为泛指神
  rationale: 上下文可能指分派服事的主基督，但原文只用κύριος；保留“主”可避免超出文本明确程度。
- issue: “主所赐”的省略结构
  choice: 在汉语主文中补出“而服事”，但不补入具体的“任务”“角色”或“恩赐”
  alternative: 译作“照主分派给各人的”或“照主赐给各人的任务”
  rationale: 希腊文没有明说主赐下什么。译文须可读，却不应把省略处限定为某一种神学概念；脚注交代其直译和歧义。
- issue: 使人相信与神所赐分工的关系
  choice: 领袖只是人借以相信的仆役，各自的服事出自主的赐予
  alternative: 把亚波罗或保罗表述为信仰的最终对象或独立成因
  rationale: διάκονοι及δι’ ὧν把他们界定为服事的媒介，而非信仰的中心。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“算什么”保留修辞力度；“不过是仆役”符合上下文对领袖地位的淡化。分号划分信主的媒介与主所赐的服事，同时避免把后半句误读为主赐下信心。所有脚注标记均置于主文相关句末。
