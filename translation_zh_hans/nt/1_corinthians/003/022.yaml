  text: εἴτε Παῦλος εἴτε Ἀπολλῶς εἴτε Κηφᾶς εἴτε κόσμος εἴτε ζωὴ εἴτε θάνατος εἴτε ἐνεστῶτα εἴτε μέλλοντα, πάντα ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/022.yaml
  text: whether Paul or Apollos or Cephas or the world or life or death or things present or things to come—all are yours,
translation:
  language: zh_hans
  text: 无论保罗、亚波罗、矶法，还是世界、生命、死亡、现在的事、将来的事，全都是你们的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴτε … εἴτε
  choice: 无论……还是……
  rationale: 重复的 εἴτε 串联整组并列项；中文用“无论……还是……”自然保留其修辞推进和涵盖意味。
- source_word: Παῦλος
  choice: 保罗
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: Ἀπολλῶς
  choice: 亚波罗
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: Κηφᾶς
  choice: 矶法
  rationale: 原文使用闪语形式的名字 Κηφᾶς，而非 Πέτρος；译作“矶法”保留这一用名差异，不以“彼得”替换。
- source_word: κόσμος
  choice: 世界
  rationale: “世界”自然且范围足够宽，保留 κόσμος 在此可指世界或受造秩序的广义，不将含义缩窄。
- source_word: ζωή
  choice: 生命
  rationale: 直接对应原文名词，并与“死亡”形成清楚对举。
- source_word: θάνατος
  choice: 死亡
  rationale: 直接对应原文，在并列清单中保留其抽象现实的意味。
- source_word: ἐνεστῶτα
  choice: 现在的事
  rationale: 该分词在此作名词使用，指现今存在的种种现实；“现在的事”清楚自然，并与“将来的事”对应。
- source_word: μέλλοντα
  choice: 将来的事
  rationale: 该分词在此作名词使用，指未来将有的现实；此译法与“现在的事”形成自然对举。
- source_word: πάντα
  choice: 全都
  rationale: πάντα 总括前面包括人物与事物在内的全部项目；“全都”比单说“万物”更能自然涵盖整张清单。
- source_word: ὑμῶν
  choice: 是你们的
  rationale: 属格在此表达归属；“是你们的”直接保留保罗总结性的宣告，同时不额外解释这种归属的具体方式。
theological_decisions:
- issue: “全都是你们的”所表达的归属性质
  choice: 保留直接的归属表达，不加解释
  alternative: 译为“全都为你们效力”或“全都属于你们支配”
  rationale: 原文仅以 ὑμῶν 表达归属，并未说明是所有权、服事关系还是为信徒益处而存在；直译可保留其神学张力，并由上下文进一步界定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文清单式节奏，以逗号推进，末尾用“全都是你们的”形成总结和强调；不添加原文没有的解释性成分。
