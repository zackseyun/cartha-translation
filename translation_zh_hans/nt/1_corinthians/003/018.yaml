  text: Μηδεὶς ἑαυτὸν ἐξαπατάτω· εἴ τις δοκεῖ σοφὸς εἶναι ἐν ὑμῖν ἐν τῷ αἰῶνι τούτῳ, μωρὸς γενέσθω, ἵνα γένηται σοφός,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/018.yaml
  text: Let no one deceive himself[a]. If anyone among you thinks he is wise in this age, let him become foolish[b], so that he may become wise.
translation:
  language: zh_hans
  text: 谁也不要自欺。你们中若有人自以为在这个时代有智慧[a]，就应当变得愚拙[b]，好成为有智慧的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“按这个时代的标准是有智慧的”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“成为愚人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδεὶς ἑαυτὸν ἐξαπατάτω
  choice: 谁也不要自欺
  rationale: 以自然、简洁的现代汉语保留普遍禁止语气和反身含义；ἐξαπατάτω在此译为“欺骗”，不将前缀过度强化。
- source_word: δοκεῖ σοφὸς εἶναι
  choice: 自以为……是有智慧的
  rationale: δοκεῖ在语境中指个人的自我判断；“自以为”也与前句“自欺”自然衔接。
- source_word: ἐν ὑμῖν
  choice: 你们中
  rationale: 准确表达哥林多信徒群体之中的成员身份，符合现代汉语习惯。
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: 在这个时代
  rationale: 保留αἰών的时间与时代色彩，并维持保罗对现今时代之智慧与真正智慧的对照。
- source_word: μωρὸς γενέσθω
  choice: 他就该变得愚拙
  rationale: 以“该”表达第三人称命令的劝令力度；“变得愚拙”保留谓语形容词及悖论，同时脚注提供名词性译法。
- source_word: ἵνα γένηται σοφός
  choice: 好使他成为真正有智慧的人
  rationale: “好使”保留ἵνα目的从句；补入“真正”显明语境中的对比，但不改变智慧一词的核心含义。
theological_decisions:
- issue: αἰών所指的范围
  choice: 译作“时代”
  alternative: 译作“世界”或“按这个时代的标准”
  rationale: “时代”较好保留保罗论证中的时间—末世性对照；脚注同时提示该短语也可表达现今时代的衡量标准。
- issue: “愚拙”的悖论
  choice: 保留“变得愚拙”
  alternative: 译作“成为愚人”
  rationale: 不把“愚拙”解释为缺乏理智，也不消解保罗所刻意保留的神学张力；名词性表达列入脚注。
- issue: 阳性单数的代表性用法
  choice: 译作“有人……他”
  alternative: 改写为完全无代词的复数结构
  rationale: 既保留原文单数代表性表达，也符合现代汉语中泛指个体的自然说法，并不限定对象仅为男性。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“自欺—自以为”形成自然呼应；“有智慧的—愚拙—真正有智慧”保留原文重复与悖论。所有脚注标记均置于正文对应位置。
