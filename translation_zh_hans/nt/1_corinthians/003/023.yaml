  text: and you are Messiah's[b][a], and Messiah is God's.
translation:
  language: zh_hans
  text: 而你们属于弥赛亚[a][b]，弥赛亚属于上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“你们是弥赛亚的，弥赛亚是上帝的。”
    reason: lexical_alternative
  - marker: b
    text: “弥赛亚”传统上常译作“基督”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: 你们
  rationale: 这是第二人称复数代词；“你们”自然、准确地指哥林多信徒群体，不额外加强语气。
- source_word: δὲ
  choice: 而
  rationale: δέ在这里承接上文，同时带出关系上的转折与推进；“而”能简洁地保留这种衔接。
- source_word: Χριστοῦ / Χριστός
  choice: 弥赛亚
  rationale: Χριστός在两处形成刻意的重复和平行，并保有称号含义；统一译作“弥赛亚”，既体现其称号性质，也保留原文修辞。
- source_word: θεοῦ
  choice: 上帝
  rationale: θεός的属格在此表达归属或关系；“属于上帝”以现代汉语清楚表达这一点，而不进一步解释这种关系的性质。
theological_decisions:
- issue: 如何翻译Χριστοῦ和θεοῦ两个属格所表达的归属关系
  choice: 两句都用“属于”明确表达隐含的系词和属格关系：“你们属于弥赛亚，弥赛亚属于上帝。”
  alternative: “你们是弥赛亚的，弥赛亚是上帝的。”
  rationale: 原文简短，只陈述关系而不解释其性质。“属于”在现代汉语中更自然清楚，同时保留两句的平行结构，以及“弥赛亚属于上帝”所含的神学张力，不将其消解为某种特定教义说明。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“而”承接上下文；重复“弥赛亚”以保留希腊文的对称和强调，不以代词替换。
