  text: Οὐκ οἴδατε ὅτι ναὸς θεοῦ ἐστε καὶ τὸ πνεῦμα τοῦ θεοῦ ⸂οἰκεῖ ἐν ὑμῖν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/016.yaml
  text: Do you not know that you are God’s temple and that God’s Spirit dwells in you?[a][b][c]
translation:
  language: zh_hans
  text: 难道你们不知道，你们是上帝的殿[a][b]，上帝的灵住在你们里面[c]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝的圣所”。
    reason: lexical_alternative
  - marker: b
    text: “你们”在原文中是复数；保罗在这里是对整个群体说话。
    reason: cultural_note
  - marker: c
    text: 或译：“住在你们中间”。
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐκ οἴδατε
  choice: 难道你们不知道
  rationale: 保留否定式反问的语气和保罗责问、提醒听众的修辞力度；“你们”也明确反映第二人称复数。
- source_word: ναὸς θεοῦ
  choice: 上帝的殿
  rationale: ναός特指神圣的殿所，而非整个圣殿区域；“殿”简洁庄重，并能自然承接上帝之灵居住其中的意象。
- source_word: ἐστε
  choice: 你们是
  rationale: 准确反映第二人称复数。正文不添加“共同”或“每个人”，避免把原文的群体指向进一步明说或个体化。
- source_word: τὸ πνεῦμα τοῦ θεοῦ
  choice: 上帝的灵
  rationale: 自然表达属格关系，同时准确保留“上帝之灵”的身份。
- source_word: οἰκεῖ
  choice: 住
  rationale: 表达οἰκέω持续居住的基本含义，并与“殿”的空间意象自然呼应。
- source_word: ἐν ὑμῖν
  choice: 在你们里面
  rationale: 按ἐν的常见意义直译，同时保留复数受众所容许的群体性理解；“在你们中间”作为真实可能另列脚注。
theological_decisions:
- issue: 本节主要指个人信徒还是作为群体的教会
  choice: 正文保留复数的“你们”，不添加“共同”或“各自”；脚注说明保罗在此向整个群体说话。
  alternative: 译作“你们共同是上帝的殿”，或个体化为“你们每个人都是上帝的殿”。
  rationale: 希腊文的动词和代词均为复数，语境具有鲜明的群体指向，但原文没有“共同”或“每个人”之类的限定词。如此既显明语法信息，也不把解释写进正文。
- issue: ἐν ὑμῖν表示内住还是处在群体中间
  choice: 正文采用“在你们里面”，脚注保留“在你们中间”。
  alternative: 上帝的灵住在你们中间。
  rationale: 介词ἐν配复数代词可表达“在你们里面”，也可按群体空间理解为“在你们中间”；两者都与本节的群体圣殿意象相容，不宜静默排除其中一种。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“难道……吗”保留反问力度；“殿”与“住”维持原文的圣所—居住意象。所有脚注标记均置于正文相应位置。
