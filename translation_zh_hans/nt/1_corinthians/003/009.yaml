  text: θεοῦ γάρ ἐσμεν συνεργοί· θεοῦ γεώργιον, θεοῦ οἰκοδομή ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/009.yaml
  text: For we are God’s fellow workers; you are God’s field[a], God’s building.
translation:
  language: zh_hans
  text: 因为我们是上帝的同工[a]；你们是上帝的田地、上帝的建筑物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上帝的同工”也可译为“与上帝同工的人”。
    reason: 希腊文θεοῦ συνεργοί中的属格可理解为归属或服事关系，也可能表示与上帝一同作工。
lexical_decisions:
- source_word: γάρ
  choice: 因为
  rationale: 保留本句承接并解释上文论述的作用，现代汉语中自然清楚。
- source_word: συνεργοί
  choice: 同工
  rationale: 准确表达共同劳作的人；“同工”在现代汉语基督教语境中通行，也保持复数所指的共同服事关系。
- source_word: θεοῦ（修饰 συνεργοί）
  choice: 上帝的
  rationale: 首先按所属或服事关系理解该属格，与后面两次“上帝的”形成鲜明平行，也符合上下文中工人属于并服事上帝的重点；另一种语法理解保留于脚注。
- source_word: γεώργιον
  choice: 田地
  rationale: 简明自然地呈现农业比喻，并能表达受耕种的土地。
- source_word: οἰκοδομή
  choice: 房屋
  rationale: 自然呈现建筑物的意象，并为下文建造、根基和材料的比喻作铺垫。
- source_word: ἐστε
  choice: 你们是
  rationale: 明确体现希腊文第二人称复数。
theological_decisions:
- issue: θεοῦ συνεργοί应理解为“上帝的同工”还是“与上帝同工的人”
  choice: 上帝的同工
  alternative: 与上帝同工的人
  rationale: 希腊文属格容许争议。上下文强调保罗和亚波罗是服事上帝、属于上帝的工人，而哥林多人是上帝的产业；正文采用“上帝的同工”以保留这种平行和重点，同时用脚注保存另一种真实可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。重复“上帝的”以保留原文三次θεοῦ所形成的修辞平行；分号体现工人与田地、房屋之间的结构转折。
