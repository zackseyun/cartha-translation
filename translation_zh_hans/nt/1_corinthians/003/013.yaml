  text: ἑκάστου τὸ ἔργον φανερὸν γενήσεται, ἡ γὰρ ἡμέρα δηλώσει· ὅτι ἐν πυρὶ ἀποκαλύπτεται, καὶ ἑκάστου τὸ ἔργον ὁποῖόν ἐστιν τὸ πῦρ ⸀αὐτὸ δοκιμάσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/013.yaml
  text: each one’s work will become evident[a], for the Day will disclose it, because it is revealed in fire[b], and the fire itself will test what sort of work each one has.
translation:
  language: zh_hans
  text: 各人的工程必显露出来，因为那日子[a]要把各人的工程显明；那日子要在火中[b]显露，火本身要检验各人的工程究竟是怎样的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那日子”很可能指将来神施行评估或审判的日子。
    reason: cross_reference
  - marker: b
    text: 或译：“借着火。”希腊语ἐν πυρί既可理解为“在火中”，也可表示“借着火”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκάστου τὸ ἔργον
  choice: 各人的工程
  rationale: ἑκάστου具有逐一分配的意味；结合上文建造的比喻，ἔργον译作“工程”既保留“工作、成果”的宽度，也呼应建造语境。
- source_word: φανερὸν γενήσεται
  choice: 都必显露出来
  rationale: 表达将来必然变得明显、公开可见的结果；“显露出来”自然且保留原文的显明意味。
- source_word: ἡ ἡμέρα
  choice: 那日子
  rationale: 定冠词和上下文指向将来神施行评估或审判的特定日子；汉语用“那日子”可传达特指，而不依赖英文式大写。
- source_word: δηλώσει
  choice: 会把它显明
  rationale: 表示使某事清楚、公开；与后面的ἀποκαλύπτεται略作措辞区分。
- source_word: ἐν πυρὶ
  choice: 在火中
  rationale: 直译ἐν的空间性表达，同时通过脚注保留其也可能表示工具或媒介、即“借着火”的解释。
- source_word: ἀποκαλύπτεται
  choice: 被揭示出来
  rationale: 采用被动表达，保留“揭开、显露”的语义及原文未明说施事者的特点。
- source_word: ὁποῖόν ἐστιν
  choice: 究竟如何
  rationale: 这里关注工程的性质或品质；“究竟如何”在现代汉语中自然，也没有把检验局限为某一种结果。
- source_word: τὸ πῦρ αὐτὸ δοκιμάσει
  choice: 火本身也要检验
  rationale: “本身”保留αὐτό的强调；“检验”准确表达δοκιμάσει对性质、品质或真伪加以考察的含义。
theological_decisions:
- issue: ἡ ἡμέρα是普通的一日，还是将来神评估或审判的特定日子
  choice: 译作“那日子”，并加脚注说明
  alternative: 译作“那一天”或不作特指的“日子”
  rationale: 本段谈各人所建工程最终受检验，语境支持末后神评估或审判之日；“那日子”表达特指，但不额外规定具体末世程序。
- issue: ἀποκαλύπτεται的隐含主语所指
  choice: 保留代词“它”，不在正文中明确限定
  alternative: 明确译为“那日子要在火中显露”或“工程要在火中显露”
  rationale: 希腊文动词为第三人称单数，隐含主语可按近接关系理解为“那日子”，也可能在论述推进中使读者联想到“工程”；正文保留代词，避免替原文消除指代张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“工程”呼应本段建造的比喻；分号保持原句层次。脚注标记均置于正文相应词语之后，并按出现顺序排列。
