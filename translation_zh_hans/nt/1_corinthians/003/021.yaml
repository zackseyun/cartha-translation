id: 1CO.3.21
reference: 1 Corinthians 3:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὥστε μηδεὶς καυχάσθω ἐν ἀνθρώποις· πάντα γὰρ ὑμῶν ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/021.yaml
  text: So then[a], let no one boast in people[b], for all things are yours.
translation:
  language: zh_hans
  text: 所以，谁也不可拿人夸口[a]，因为万有都是你们的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按上下文，也可理解为“拿人的领袖夸口”。原文“人”泛指人类，并非专指男性。
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: 所以
  rationale: 承接上文并引出推论；“所以”自然、清楚地保留推论作用。
- source_word: μηδεὶς
  choice: 谁也不可
  rationale: 与命令式动词结合，表达面向所有人的普遍禁令，符合现代汉语习惯。
- source_word: καυχάσθω
  choice: 夸口
  rationale: 保留该动词“以某事为夸耀、引以为荣”的力度，同时避免加入过度解释。
- source_word: ἐν ἀνθρώποις
  choice: 拿人
  rationale: ἐν在καυχάομαι之后可表示夸口的根据或对象；“拿人夸口”在汉语中简洁自然。ἀνθρώποις泛指人，并不专指男性；上下文虽可能特别涉及人的领袖，但正文不收窄原文。
- source_word: πάντα
  choice: 万有
  rationale: 保留中性复数所表达的广泛、总括含义，也符合保罗此处的修辞语气。
- source_word: γὰρ
  choice: 因为
  rationale: 明确引出前述禁令的理由，现代汉语表达自然。
- source_word: ὑμῶν ἐστιν
  choice: 都是你们的
  rationale: 直接表达属有关系；“都是你们的”既贴近原文，又符合汉语习惯。
theological_decisions:
- issue: “人”在上下文中的指涉范围
  choice: 正文保留泛称“人”
  alternative: 译为“人的领袖”
  rationale: 原文ἀνθρώποις本身泛指人；上下文确实谈到保罗、亚波罗和矶法等领袖，但将其直接译入正文会缩窄原文的开放范围，因此仅在脚注说明。
translation_notes:
  register: 采用现代、庄重而通俗的表达。“谁也不可拿人夸口”保留原文禁令的直接性；“万有”略带经文语体，但现代读者仍易理解，并与下一节的总括列举相协调。
