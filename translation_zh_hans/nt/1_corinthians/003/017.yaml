  text: εἴ τις τὸν ναὸν τοῦ θεοῦ φθείρει, φθερεῖ τοῦτον ὁ θεός· ὁ γὰρ ναὸς τοῦ θεοῦ ἅγιός ἐστιν, οἵτινές ἐστε ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/017.yaml
  text: If anyone destroys God's temple[a], God will destroy him; for God's temple is holy[b], and you are that temple.
translation:
  language: zh_hans
  text: 如果有人毁坏上帝的殿[a]，上帝必毁坏那人；因为上帝的殿是圣洁的，而你们正是这殿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “毁坏”也可译作“败坏”或“玷污”；原文在本句前后两处使用同一个动词。
    reason: lexical_alternative
  - marker: b
    text: “你们”在原文中是复数；保罗把会众整体视为上帝的殿。
    reason: cultural_note
lexical_decisions:
- source_word: ναός
  choice: 殿
  rationale: 此词指上帝神圣的居所；“殿”在本段语境中自然、庄重，也比泛指建筑的说法更准确。
- source_word: φθείρει / φθερεῖ
  choice: 毁坏 / 必毁坏
  rationale: 两处采用同一词根的译法，以保留原文刻意的重复和严厉警告；该词也可按语境理解为败坏或玷污，故以脚注说明。
- source_word: τοῦτον
  choice: 那人
  rationale: 承接前面的单数不定代词“有人”，用现代汉语的“那人”清楚保留单数的人称指向。
- source_word: ἅγιος
  choice: 圣洁
  rationale: “圣洁”是自然且稳定的对应词，同时表达属上帝、分别为圣和神圣不可侵犯的含义。
- source_word: οἵτινές ἐστε ὑμεῖς
  choice: 而你们就是这殿
  rationale: 以自然汉语明确关系从句的指代，保留复数的“你们”与单数的“殿”之间的集体认同。
- source_word: ὑμεῖς
  choice: 你们
  rationale: 明确译出第二人称复数；本节把整个受信群体共同视为上帝的一座殿。
theological_decisions:
- issue: 本节的“上帝的殿”主要指个别信徒，还是指教会群体
  choice: 正文采用群体意义：复数的“你们”共同是单数的“殿”。
  alternative: 有人依据更广泛的圣经神学，将此节引申为个别信徒也是上帝的殿。
  rationale: 原文以单数ναός搭配复数ὑμεῖς，而上下文讨论哥林多群体及建造工程，因此最直接的语法和语境所指是会众整体；译文不排除其他经文中的个人应用。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“上帝的殿”保留圣殿意象；“必”自然表达将来时警告的确定性。脚注标记均在正文中出现。
