id: 1CO.3.4
reference: 1 Corinthians 3:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ὅταν γὰρ λέγῃ τις· Ἐγὼ μέν εἰμι Παύλου, ἕτερος δέ· Ἐγὼ Ἀπολλῶ, ⸂οὐκ ἄνθρωποί⸃ ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/004.yaml
  text: For whenever someone says[a], “I am of Paul,” and another, “I am of Apollos,” are you not merely human?
translation:
  language: zh_hans
  text: 因为每逢有人说：“我是属保罗的”，另一个说：“我是属亚波罗的”，你们岂不只是凡人吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“你们岂不是按人的方式行事吗？”
    reason: 原文直译为“你们岂不是人吗”，在上下文中是责备他们仅按一般人的方式行事。
lexical_decisions:
- source_word: ὅταν
  choice: 每逢
  rationale: 表达不定而反复出现的情形，比单次性的“当……时”更贴近原文。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上文，表明本节是在解释保罗先前的责备。
- source_word: λέγῃ τις
  choice: 有人说
  rationale: 自然表达不定单数结构，同时保留泛指意味。
- source_word: Ἐγὼ μέν εἰμι Παύλου
  choice: 我是属保罗的
  rationale: 以简洁自然的中文表达属格所指的归属或派系认同，不将这种关系进一步限定为门徒、拥护者等。
- source_word: ἕτερος δέ
  choice: 另一个说
  rationale: 呈现 μέν…δέ 的配对对比，并补出中文所需的谓语。
- source_word: Ἐγὼ Ἀπολλῶ
  choice: 我是属亚波罗的
  rationale: 承接前句省略的“是属……的”，保留两句口号式表达的平行结构。
- source_word: οὐκ ἄνθρωποί ἐστε;
  choice: 你们岂不只是凡人吗？
  rationale: 保留原文明确的名词“人”，并以“岂不……吗”表达反问；“只是”传达语境中受责备的、仅按一般人的方式行事这一含义。
theological_decisions:
- issue: “凡人”是身份判断还是对行为方式的责备
  choice: 正文保留“凡人”这一身份式表述
  alternative: 你们岂不是按人的方式行事吗？
  rationale: 希腊文直说“你们不是人吗”，但上下文表明保罗是在责备其嫉妒纷争和结党行为。正文不把名词改写为行为描述，以保存原文的修辞张力；解释性译法列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“属保罗的／属亚波罗的”保留原文简短的归属口号；“凡人”避免加入“世人”“属世”等原文没有明说的神学限定。
