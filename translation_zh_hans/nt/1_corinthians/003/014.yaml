  text: εἴ τινος τὸ ἔργον μενεῖ ὃ ἐποικοδόμησεν, μισθὸν λήμψεται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/014.yaml
  text: If anyone’s work that he built on remains[b][a], he will receive a reward.
translation:
  language: zh_hans
  text: 如果某人在其上所建造的工程得以存留[a]，他就会得到奖赏[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “得以存留”也可译作“仍然存在”或“存续”。
    reason: lexical_alternative
  - marker: b
    text: “奖赏”也可译作“报酬”或“工钱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τινος
  choice: 如果有人……的
  rationale: εἴ引出一般条件句；τινος为不定代词属格，表示工程属于某人。汉语按自然语序译作“如果有人……的工程”。
- source_word: τὸ ἔργον
  choice: 工程
  rationale: 上下文使用建造比喻；“工程”既能指所建成的成果，也保留建筑语境，比单纯的“工作”更自然。
- source_word: μενεῖ
  choice: 存留下来
  rationale: 表示在考验之后仍然存在；“存留下来”贴近“留下、持续存在”的基本义，又不如“经受住考验”那样把上下文解释直接写入正文。
- source_word: ὃ ἐποικοδόμησεν
  choice: 在上面建造的
  rationale: ἐποικοδομέω含有在既有根基上继续建造之意；“在上面建造”保留这一方向性，同时不补出原句未明说的“根基”。
- source_word: μισθὸν
  choice: 报偿
  rationale: μισθός可指工钱、报酬或奖赏。此处“报偿”保留按成果所得回报的含义，避免把它限缩为日常工资，也不过早具体化为某种奖品。
- source_word: λήμψεται
  choice: 会得到
  rationale: 准确表达将来发生的领受；现代汉语中“得到报偿”自然、庄重。
theological_decisions:
- issue: μισθός所指回报的性质
  choice: 报偿
  alternative: 奖赏；工钱；报酬
  rationale: 经文本身没有说明报偿的具体形式或救恩论性质，因此采用较宽的“报偿”，不把它等同于救恩、功德工资或特定末世奖赏。
- issue: 工程如何“存留”
  choice: 存留下来
  alternative: 经受住考验；幸存下来
  rationale: 上下文提到火的检验，但本节动词本身只说“存留”。正文保留这一措辞，不把检验方式或原因嵌入译文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“工程”延续本段的建造比喻；“在上面建造”有意不补明“根基”，以保存原文表达。所有脚注标记均置于对应词语之后。
