  naturalness: 原译“有人在上面建造的工程”可以理解，但“上面”在现代书面汉语中指代不够稳固，语序也略显生硬。“某人在其上所建造的工程得以存留”更自然、庄重，并保持建造比喻。
  terminology: “工程”适合本段建造的比喻。“奖赏”与此处μισθός在神圣评估语境中的常用义相符，也与英文审计文本的“reward”一致；它不界定奖赏的形式或救恩论含义。脚注保留“报酬、工钱”等词汇可能性。“长存”容易引入超过μενεῖ的持久性意味，“经受得住”则补入检验对象，宜改为较中性的词汇替代项。
