  to: 如果某人在其上所建造的工程得以存留[a]，他就会得到奖赏[b]。
  rationale: 修订使中文语序和指代更自然，并保留ἐποικοδομέω所含‘在其上建造’的语义，不在正文补出“根基”。将“报偿”改为“奖赏”以贴合本节语境和英文审计轨迹；脚注则保留μισθός的经济性词义。脚注a改用不添加检验或永恒性含义的替代译法。
