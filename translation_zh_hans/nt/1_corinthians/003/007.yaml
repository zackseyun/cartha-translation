  yaml_path: translation/nt/1_corinthians/003/007.yaml
  text: So neither the one planting is anything[a], nor the one watering, but God who causes the growth.
translation:
  language: zh_hans
  text: 所以，栽种的人算不得什么[a]，浇灌的人也算不得什么；惟有使它生长的上帝才算重要。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不算什么”。原文前半句用“是……什么”的表达，意为人并不算重要；后半句省略相应谓语，以突出上帝使其生长的作为。
    reason: 说明ἐστίν τι的汉语表达及后半句省略谓语所造成的平行与对比。
lexical_decisions:
- source_word: ὥστε
  choice: 所以
  rationale: 承接上文作推论，现代汉语自然清楚。
- source_word: ὁ φυτεύων
  choice: 栽种的
  rationale: 保留实体化分词及其与“浇灌的”之间的平行结构。
- source_word: ἐστίν τι
  choice: 算不得什么
  rationale: 自然表达希腊语“不是任何重要之物”的语用含义，同时避免译成存在意义上的“什么都不是”。
- source_word: ὁ ποτίζων
  choice: 浇灌的
  rationale: 与“栽种的”对称，保留农业意象和行动者身份。
- source_word: ἀλλ’
  choice: 唯有……才重要
  rationale: 在汉语中明确呈现强烈对比，并补足原文省略而由前半句提供的谓语意义。
- source_word: ὁ αὐξάνων θεός
  choice: 使它生长的上帝
  rationale: 将 θεός 作为核心名词，ὁ αὐξάνων 作修饰语；“使……生长”准确表达使役含义，代词“它”按语境指所栽种、浇灌之物。
theological_decisions:
- issue: 人类服事者与上帝之作用的对比
  choice: “栽种的算不得什么，浇灌的也算不得什么；唯有使它生长的上帝才重要”
  alternative: “栽种的和浇灌的都不算什么，只在乎使它生长的上帝”
  rationale: 保留保罗对人的相对贬抑与对上帝决定性作用的强调；不把“算不得什么”解释成人完全没有角色，也不加入特定教派的因果教义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“栽种的／浇灌的”保持修辞平行；分号突出人类工人与上帝之间的转折。脚注标记置于全句末，说明后半句的句法歧义及传统译法。
