  to: 弟兄们[a]，我也未能像对属灵的人那样对你们说话；我只能像对属肉体的人那样，像对在弥赛亚[b]里为婴孩的人那样说话。
  rationale: 修订以“像对……那样对你们说话”重现原文连续的比较表达，并以“未能”表达过去的无能。末一比较译为“在弥赛亚里为婴孩的人”，保留ἐν Χριστῷ与νηπίοις之间的关联，而不额外界定其神学含义。脚注b改为术语级替代译法，并移至“弥赛亚”之后。
