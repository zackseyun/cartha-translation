  text: Κἀγώ, ἀδελφοί, οὐκ ἠδυνήθην ⸂λαλῆσαι ὑμῖν⸃ ὡς πνευματικοῖς ἀλλ’ ὡς ⸀σαρκίνοις, ὡς νηπίοις ἐν Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/001.yaml
  text: And I[a], brothers, was not able to speak to you as spiritual people, but as fleshly people[b], as infants in Messiah.
translation:
  language: zh_hans
  text: 弟兄们[a]，我也未能像对属灵的人那样对你们说话；我只能像对属肉体的人那样，像对在弥赛亚[b]里为婴孩的人那样说话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“弟兄姊妹”；希腊原文作“弟兄”。
    reason: lexical_alternative
  - marker: b
    text: 或译作“基督”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγώ
  choice: 我也
  rationale: 保留καί的承接意味和明确的第一人称，同时采用自然的现代汉语语序。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 对应希腊文阳性复数呼格；该称呼在会众语境中也可能涵盖女性，因此另加脚注说明。
- source_word: οὐκ ἠδυνήθην
  choice: 不能
  rationale: 准确表达过去情境中的无能或不可能；汉语无需另加时态标记。
- source_word: λαλῆσαι ὑμῖν
  choice: 来讲话
  rationale: 结合前面的“把你们当作”自然表达“以某种对象的身份对你们说话”。
- source_word: πνευματικοῖς
  choice: 属灵的人
  rationale: 该形容词在此作名词用；补出“人”使汉语清楚，并保留与“属肉体的人”的对照。
- source_word: σαρκίνοις
  choice: 属肉体的人
  rationale: 保留与“肉体”的词义联系及其与“属灵”的对照，不将其过度解释为“世俗”或“罪恶”。
- source_word: νηπίοις
  choice: 婴孩
  rationale: 保留保罗用幼小婴儿比喻不成熟的意象。
- source_word: ἐν Χριστῷ
  choice: 在弥赛亚里
  rationale: 保留ἐν的联合或领域表达，并将Χριστός按其称号含义译作“弥赛亚”；常见译法另见脚注。
theological_decisions:
- issue: Χριστῷ的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: Χριστός本义为受膏者，此处仍可保留称号意味；“基督”是传统音意结合的常见译法，列入脚注以保留译名选择。
- issue: σαρκίνοις的含义范围
  choice: 属肉体的人
  alternative: 属世的人
  rationale: 希腊词直接源于“肉体”，与“属灵”形成张力；不把它直接等同于道德化程度更强的“属世”或“有罪”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“把你们当作……来讲话”明确呈现两个ὡς所表达的身份比较；“属灵的人／属肉体的人”保持平行结构。“弥赛亚”保留称号含义，同时以脚注交代传统译名“基督”。
