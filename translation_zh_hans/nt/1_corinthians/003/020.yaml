  text: καὶ πάλιν· Κύριος γινώσκει τοὺς διαλογισμοὺς τῶν σοφῶν ὅτι εἰσὶν μάταιοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/020.yaml
  text: And again[a], “The Lord knows the thoughts of the wise[c][b], that they are futile.”
translation:
  language: zh_hans
  text: 又说：“主知道智慧人的思量是虚空的。”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “思量”也可译作“思想”或“推想”。
    reason: lexical_alternative
  - marker: b
    text: 引自《诗篇》94:11；希腊文《七十士译本》为93:11。
    reason: cross_reference
lexical_decisions:
- source_word: καὶ πάλιν
  choice: 又说
  rationale: 承接上一处引文并引出第二处经文依据；“又说”符合现代汉语引用习惯。
- source_word: Κύριος
  choice: 主
  rationale: 直接对应 κύριος，在经文语境中自然、庄重。
- source_word: γινώσκει
  choice: 知道
  rationale: 采用最直接、常用的对应词，不增添“理解”或“识破”等解释意味。
- source_word: διαλογισμοὺς
  choice: 思量
  rationale: 既可指内在思想，也带有推想、盘算或推理的意味，比单纯“思想”更能保留该词的语义范围。
- source_word: τῶν σοφῶν
  choice: 智慧人的
  rationale: 将实词化形容词译为“智慧人”，与本章关于智慧的论述保持词汇呼应，也不限定性别。
- source_word: ὅτι
  choice: 知道这些都是
  rationale: 按内容从句理解；汉语重复“知道”可清楚表达主所知道的内容，避免生硬的“即它们是”。
- source_word: μάταιοι
  choice: 虚空的
  rationale: 表达空洞、无实效和徒然之意，并保留诗篇引文较庄重的语体。
theological_decisions:
- issue: “智慧人”是否带反讽或专指世俗智慧
  choice: 保留为“智慧人”，不在正文中添加“自以为”或“世上的”
  alternative: 自以为有智慧的人；世上的智慧人
  rationale: 原句仅用 σοφῶν；上下文可使读者看出保罗所针对的智慧类型，不宜在本节中加入原文没有的限定。
- issue: ὅτι 的功能
  choice: 理解为引出主所知道的内容
  alternative: 理解为原因：“因为这些都是虚空的”
  rationale: 语法与所引诗篇的表达更自然地支持内容从句，同时避免把句子改写成因果论证。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“思量”保留 διαλογισμοί 的思想与推理色彩；“虚空的”呼应 μάταιοι 的空洞、徒然含义。脚注标记均置于正文引文之后。
