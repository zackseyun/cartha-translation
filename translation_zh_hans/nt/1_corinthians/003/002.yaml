  text: γάλα ὑμᾶς ἐπότισα, ⸀οὐ βρῶμα, οὔπω γὰρ ἐδύνασθε. ἀλλ’ ⸀οὐδὲ ἔτι νῦν δύνασθε,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/002.yaml
  text: I fed you milk[a], not solid food, for you were not yet able. But even now you are still not able[b],
translation:
  language: zh_hans
  text: 我给你们喝的是奶，不是固体食物[a]，因为那时你们还不能；但就是到现在，你们还是不能。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “固体食物”原文是泛指“食物”的词；这里因与“奶”对比而这样翻译。
    reason: lexical_alternative
lexical_decisions:
- source_word: γάλα
  choice: 奶
  rationale: 直译为“奶”，保留保罗关于喂养的比喻，并与后面的食物形成对照。
- source_word: ἐπότισα
  choice: 给……喝
  rationale: 该动词本义是“给人喝”；中文“给你们奶喝”自然，也准确保留饮用的含义。
- source_word: βρῶμα
  choice: 固体食物
  rationale: 该词泛指食物；因这里与“奶”对比，正文用“固体食物”清楚表达语境中的对照，同时以脚注注明其较宽泛的字面意义。
- source_word: οὔπω γὰρ ἐδύνασθε
  choice: 因为那时你们还不能接受
  rationale: οὔπω表示“还不能”，未完成时指向当时持续的能力不足；补出“接受”作为中文所需的宾语，但不具体界定所指教导的内容。
- source_word: ἀλλ’ οὐδὲ ἔτι νῦν δύνασθε
  choice: 即使到如今，你们仍然不能
  rationale: “即使到如今”与“仍然不能”共同体现οὐδέ、ἔτι和νῦν所强调的持续状态，并保留原文末尾未明说宾语的表达。
theological_decisions:
- issue: 保罗喂养比喻的解释
  choice: 保留“奶”和“固体食物”的比喻，不在正文中改写为初级与高深的教导。
  alternative: 解释性地译作“我只教导你们基础的道理，不能教导更深的道理”。
  rationale: 原文以食物喂养作比喻，并未在本节明说具体教导内容；保留比喻可避免把某种神学分级直接写入译文。
- issue: 两处“不能”的宾语
  choice: 前一句以“接受”使中文完整，后一句仍不明说具体对象。
  alternative: 两处都补作“不能吃固体食物”或“不能领受更深的教导”。
  rationale: 希腊文两处δύνασθε都省略了补语。译文只作最低限度的语法补足，并在末句保留其开放性，避免过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“给你们奶喝”既自然又贴近原文；“即使到如今……仍然……”传达原文加强语气的时间对照。
