id: 1CO.3.15
reference: 1 Corinthians 3:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: εἴ τινος τὸ ἔργον κατακαήσεται, ζημιωθήσεται, αὐτὸς δὲ σωθήσεται, οὕτως δὲ ὡς διὰ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/015.yaml
  text: If anyone’s work is burned up[a], he will suffer loss, but he himself will be saved—yet as through fire.
translation:
  language: zh_hans
  text: 如果有人所做的工被烧毁，他就要蒙受损失；他自己却会得救，不过像是从火中经过一样。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不过，只能像经过火一样”；或：“不过，像从火中逃生一样”。
    reason: 原文末句简练而带有比喻性，既可保留为“经过火”，也可理解为强调勉强或险中得救。
lexical_decisions:
- source_word: εἴ τινος
  choice: 如果有人
  rationale: 以自然的现代汉语表达不定条件，不额外加强条件语气。
- source_word: τὸ ἔργον
  choice: 所做的工
  rationale: 保留ἔργον的宽泛含义，并与上下文中建造者劳作的比喻相连；不把它限定为某一种事工成果或行为。
- source_word: κατακαήσεται
  choice: 被烧毁
  rationale: 表达彻底焚烧、以致毁坏的强化含义，也符合上下文检验建筑材料的火焰意象。
- source_word: ζημιωθήσεται
  choice: 要蒙受损失
  rationale: 保留遭受亏损或丧失的含义，不擅自明确为受惩罚或失去奖赏。
- source_word: αὐτὸς δὲ σωθήσεται
  choice: 他自己却会得救
  rationale: 用“自己”体现αὐτός的强调作用，并以“却”呈现人的得救与其工程被毁之间的对比。
- source_word: οὕτως δὲ ὡς διὰ πυρός
  choice: 不过像是从火中经过一样
  rationale: 保留原文简练而形象的比喻，以及究竟指艰难经过还是险中逃生的含混性，不加入净化等解释。
theological_decisions:
- issue: 末句的火是否应被明确解释为炼净、刑罚或仅仅险中逃生
  choice: 不过像是从火中经过一样
  alternative: 不过，只能像经过火一样；不过，像从火中逃生一样
  rationale: 原文没有解释火的具体神学机制。正文保留意象和张力，脚注列出可能的语气与比喻理解，避免导向特定宗派教义。
- issue: “蒙受损失”是否应明确译为失去奖赏
  choice: 蒙受损失
  alternative: 失去奖赏；受到惩罚
  rationale: ζημιόω本身表明遭受损失，但本节没有直接说损失的具体内容；因此不在译文中补足。
translation_notes:
  register: 采用现代、庄重而易懂的表达。“所做的工”避免口语化的“工作”，也不把所指过度限定为建筑物或某类宗教职务；分号清楚呈现工程受损与本人得救的对照。
