  text: ἡ γὰρ σοφία τοῦ κόσμου τούτου μωρία παρὰ τῷ θεῷ ἐστιν· γέγραπται γάρ· Ὁ δρασσόμενος τοὺς σοφοὺς ἐν τῇ πανουργίᾳ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/019.yaml
  text: For the wisdom of this world is foolishness with God[a]. For it is written[b], “He catches the wise in their craftiness.”
translation:
  language: zh_hans
  text: 因为这世界的智慧，在神看来[a]是愚拙。因为经上记着：“他把智者捉在他们自己的诡计[b]中。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在神那里”，意思是按神的眼光或判断。
    reason: lexical_alternative
  - marker: b
    text: 或译“狡猾”；“在……中”也可理解为“借着……”。
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφία
  choice: 智慧
  rationale: “智慧”是该词的常用对应词；这里指这世界自以为是的智慧，与神的判断形成对照。
- source_word: κόσμου τούτου
  choice: 这世界的
  rationale: κόσμος在这里自然指现今属世的秩序；“这世界的”既贴近原文，也符合现代汉语表达。
- source_word: μωρία
  choice: 愚拙
  rationale: “愚拙”保留保罗在上下文中反复使用的智慧与愚拙之对比，语体庄重而清楚。
- source_word: παρὰ τῷ θεῷ
  choice: 在神看来
  rationale: παρά加与格在此表达神的观点或判断；“在神看来”比直译“在神那里”更自然，并准确传达评判意味。
- source_word: γέγραπται
  choice: 经上记着
  rationale: 这是现代中文中自然、庄重的引经公式，也体现希腊文完成时所含的经文持续有效之意。
- source_word: δρασσόμενος
  choice: 捉住
  rationale: 该分词表示抓住、擒住；“捉住”保留动作性，也适合这里神挫败智者计谋的语境。
- source_word: σοφοὺς
  choice: 智者
  rationale: 此处指自认为或被视为有智慧的人；“智者”简洁，并不额外限定性别。
- source_word: πανουργίᾳ
  choice: 诡计
  rationale: 该词在此具有负面含义，指狡诈、不正当的机巧；“诡计”准确体现这种道德色彩。
theological_decisions:
- issue: 如何表达神对世俗智慧的评判
  choice: 在神看来是愚拙
  alternative: 在神那里是愚拙
  rationale: 采用自然汉语明确表达评判视角，不把“世俗智慧”解释成毫无才智，也不削弱神与世界判断之间的张力。
- issue: 如何处理约伯记5:13引文中的冠词化分词和介词短语
  choice: 他在智者自己的诡计中捉住他们
  alternative: 他借着智者自己的诡计捉住他们
  rationale: 用“他”自然表达希腊文冠词化分词所指的神；保留“在……中”的形式，避免把ἐν只限定为工具意义，同时维持神使智者反被自身诡计困住的图景。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这世界的智慧”延续本段核心对比；引文保留鲜明的抓捕意象。脚注说明παρὰ τῷ θεῷ的较直译形式，以及πανουργία和ἐν可能容纳的词义与句法幅度。
