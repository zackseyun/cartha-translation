  text: ὁ φυτεύων δὲ καὶ ὁ ποτίζων ἕν εἰσιν, ἕκαστος δὲ τὸν ἴδιον μισθὸν λήμψεται κατὰ τὸν ἴδιον κόπον,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/008.yaml
  text: The one who plants and the one who waters are one[a], and each will receive his own reward according to his own labor.
translation:
  language: zh_hans
  text: 栽种的和浇灌的原为一体[a]；各人将照自己的劳苦，领受自己的报酬。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“是合一的”或“目标一致”。原文直译为“是一”，强调栽种者与浇灌者的合一，并非说二人身份相同。
    reason: 词义备选；ἕν为中性单数，指合一而非个人身份的同一。
lexical_decisions:
- source_word: ὁ φυτεύων
  choice: 栽种的
  rationale: 带冠词的现在分词在此作名词用；译为“栽种的”自然简洁，并保留农业比喻和持续从事该工作的意味。
- source_word: ὁ ποτίζων
  choice: 浇灌的
  rationale: 与ὁ φυτεύων结构平行；“浇灌的”既保留农业意象，也符合现代汉语表达。
- source_word: ἕν εἰσιν
  choice: 是一
  rationale: 直译保留原文中性单数ἕν的凝练表达及其一定程度的开放性；在上下文中指向二人在事奉上的合一，而非同一身份。
- source_word: ἕκαστος
  choice: 各人
  rationale: 准确表达逐一、个别的分配，并与后面重复出现的“自己的”相呼应。
- source_word: τὸν ἴδιον μισθὸν
  choice: 自己的报酬
  rationale: “报酬”涵盖因工作所得的回报，不把含义局限为金钱工资；“自己的”保留ἴδιον所强调的个别归属。
- source_word: λήμψεται
  choice: 都要……得
  rationale: 以自然的现代汉语表达将来的领受；“得”在此庄重而简明。
- source_word: κατὰ τὸν ἴδιον κόπον
  choice: 照自己的劳苦
  rationale: “照”体现κατά所表达的衡量或对应关系；“劳苦”比一般的“工作”更能传达κόπος所含辛劳、付出之意。
theological_decisions:
- issue: ἕν εἰσιν（“是一”）所表达的合一
  choice: 正文译作“是一”，保留原文简洁而带张力的措辞；脚注说明可理解为同心合一或目标一致。
  alternative: 直接在正文解释为“同心合一”或“目标一致”。
  rationale: 中性单数ἕν表示合一，而不是说二人是同一个人。上下文强调不同服事者都在神的工作中配搭，以此反对结党；直译加脚注既不误导为身份同一，也避免把其含义过早限定为某一种解释。
- issue: 按劳苦得报酬
  choice: 保留“各人”“自己的报酬”“自己的劳苦”的个别对应关系。
  alternative: 概括译为“各人会按所做的工得赏赐”。
  rationale: 原文重复ἴδιον，明确强调每个人的劳苦及相应所得；译文保留这一重复，不进一步界定报酬的性质或计算方式。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“栽种”“浇灌”保持农业比喻；“劳苦”“报酬”兼顾原文语义和经文语域。正文保留“是一”的凝练与神学张力，并用脚注提示其合一、同一目标的语境含义。
