id: 1CO.3.10
reference: 1 Corinthians 3:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Κατὰ τὴν χάριν τοῦ θεοῦ τὴν δοθεῖσάν μοι ὡς σοφὸς ἀρχιτέκτων θεμέλιον ⸀ἔθηκα, ἄλλος δὲ ἐποικοδομεῖ. ἕκαστος δὲ βλεπέτω πῶς ἐποικοδομεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/010.yaml
  text: According to the grace of God given to me[a], like a wise master builder I laid a foundation, and another builds on it[c][b]. But let each one be careful how he builds.
translation:
  language: zh_hans
  text: 我照着神所赐给我的恩典，像一位有智慧的总建筑师[a]，奠定了根基，另有人在上面建造。但各人都要留心自己怎样建造。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “总建筑师”也可译作“总建造师”；希腊语所指的是统筹、监督整个建造工程的首要建造者。
    reason: lexical_alternative
  - marker: b
    text: 也可译作：“自己怎样在根基上建造。”
    reason: translation_alternative
lexical_decisions:
- source_word: Κατὰ
  choice: 照着
  rationale: 表示与神所赐恩典相称、相应，而不只是把恩典说成一种工具；“照着”简洁自然。
- source_word: χάριν
  choice: 恩典
  rationale: 保留保罗书信中该词所承载的神施恩与赋能之意，不作过度解释。
- source_word: σοφὸς ἀρχιτέκτων
  choice: 有智慧的总建筑师
  rationale: σοφός保留“智慧”这一评价色彩；ἀρχιτέκτων在古代指统筹工程的首要建造者，“总建筑师”比现代意义上只负责设计的“建筑师”更接近原意。
- source_word: θεμέλιον ἔθηκα
  choice: 奠定了根基
  rationale: “奠定根基”是自然的现代汉语搭配，也准确表达放置建筑根基的意象。
- source_word: ἄλλος δὲ ἐποικοδομεῖ
  choice: 另有人在上面建造
  rationale: 复合动词表示在已立的根基之上继续建造；“在上面”补出希腊文语境中隐含的对象。
- source_word: ἕκαστος δὲ βλεπέτω
  choice: 但各人都要留心
  rationale: βλεπέτω在这里是警戒性的命令，要求每个人警醒注意；“留心”比字面的“看”更自然地传达其语用力量。
- source_word: πῶς ἐποικοδομεῖ
  choice: 自己怎样建造
  rationale: 保留对建造方式或质量的开放性关注，不把经文收窄为某一种具体标准；“自己”明确各人须为自身的建造负责。
theological_decisions:
- issue: “各人”（ἕκαστος）的指涉范围
  choice: 译作“各人”，不标明性别
  alternative: 译作“每个男人”或“各弟兄”
  rationale: 希腊文阳性单数在此具有概括性，并非限定男性；汉语“各人”既保留逐一分配的语义，也不增加原文没有的性别限制。
- issue: 第二次ἐποικοδομεῖ是否明说“在根基上”
  choice: 正文译作“自己怎样建造”，以脚注说明可补足为“自己怎样在根基上建造”
  alternative: 正文直接译作“自己怎样在根基上建造”
  rationale: 希腊文第二次使用同一复合动词，本身仍带有“在其上建造”之意，但对象由上下文自然承接。正文采用简练汉语，同时借脚注保留较充分的表达。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“照着……恩典”“奠定了根基”“在上面建造”保留原文连续的建筑比喻；避免使用过于口语化的“工头”，也不把ἀρχιτέκτων仅按现代职业分工理解为设计人员。
