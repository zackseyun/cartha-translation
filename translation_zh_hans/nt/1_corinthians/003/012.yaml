  text: εἰ δέ τις ἐποικοδομεῖ ἐπὶ τὸν ⸀θεμέλιον ⸂χρυσόν, ἄργυρον⸃, λίθους τιμίους, ξύλα, χόρτον, καλάμην,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/012.yaml
  text: If anyone builds on the foundation with gold, silver, precious stones, wood, hay, straw,
translation:
  language: zh_hans
  text: 如果有人在这根基上用金、银、宝石、木头、干草、禾秸建造，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δέ τις
  choice: 如果有人
  rationale: εἰ引出条件句，τις具有泛指意味；译作“如果有人”自然准确。δέ在此是轻微承接，不必另译为“但是”，以免造成过强对比。
- source_word: ἐποικοδομεῖ ἐπὶ τὸν θεμέλιον
  choice: 在这根基上……建造
  rationale: 保留“在根基上建造”的建筑隐喻；定冠词结合上文已明确的根基，汉语用“这根基”自然承接。
- source_word: χρυσόν, ἄργυρον
  choice: 金、银
  rationale: 直接对应两种贵重材料，并保持原文列举的简洁节奏。
- source_word: λίθους τιμίους
  choice: 宝石
  rationale: τιμίους表示贵重、珍贵；“宝石”是自然简洁的传统表达，同时保留其可能指贵重建筑石材的空间。
- source_word: ξύλα
  choice: 木头
  rationale: 在建筑材料清单中，“木头”比单字“木”更符合现代普通话，也准确表达木材。
- source_word: χόρτον
  choice: 干草
  rationale: χόρτος可指草；在可燃建筑材料的语境中，“干草”自然呈现与金银宝石的对照。
- source_word: καλάμην
  choice: 禾秸
  rationale: καλάμη可指植物茎秆、秸秆；“禾秸”与“干草”有所区分，也适合建筑材料和燃烧试验的语境。
theological_decisions: []
