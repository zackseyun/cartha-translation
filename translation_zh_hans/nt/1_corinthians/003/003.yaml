id: 1CO.3.3
reference: 1 Corinthians 3:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἔτι γὰρ σαρκικοί ἐστε. ὅπου γὰρ ἐν ὑμῖν ζῆλος καὶ ⸀ἔρις, οὐχὶ σαρκικοί ἐστε καὶ κατὰ ἄνθρωπον περιπατεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/003.yaml
  text: For you are still fleshly. For where there is jealousy and strife among you[a], are you not fleshly and walking according to man?
translation:
  language: zh_hans
  text: 因为你们仍是属肉体的。你们中间既有嫉妒和纷争，难道你们不正是属肉体的，照着人的方式行事吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“像普通人一样生活吗？”
    reason: 说明 κατὰ ἄνθρωπον περιπατεῖτε 的较意译表达；该短语可理解为按一般人的方式生活，而正文保留较贴近原文的结构。
lexical_decisions:
- source_word: ἔτι
  choice: 仍
  rationale: 表示这种状态持续至今；“仍”简洁自然，也保留保罗责备他们尚未改变的语气。
- source_word: γὰρ
  choice: 因为
  rationale: 译出首句对上文的解释作用。第二个 γὰρ 所引出的证据在汉语中借“既有”自然表达，避免连续重复“因为”而使句子生硬。
- source_word: σαρκικοί
  choice: 属肉体的
  rationale: 保留该词与 σάρξ（肉体）的词汇联系及保罗的对比意象，不将其直接解释成“属世的”或“受罪性控制的”。
- source_word: ὅπου
  choice: 中间既有
  rationale: ὅπου 的处所含义由“你们中间”保留；“既有”则自然引出作为反问依据的事实。
- source_word: ζῆλος
  choice: 嫉妒
  rationale: 与“纷争”并列的负面语境表明这里不是正面的“热心”，而是群体关系中的嫉妒。
- source_word: ἔρις
  choice: 纷争
  rationale: 涵盖争竞、冲突和不和，比仅指口头行为的“争吵”更宽，也符合教会群体语境。
- source_word: οὐχὶ
  choice: 难道……不正是……吗
  rationale: 保留预期肯定回答的修辞问句；“不正是”在现代汉语中自然传达其反诘力度。
- source_word: κατὰ ἄνθρωπον
  choice: 照着人的方式
  rationale: 保留 κατά 的规范或方式含义以及 ἄνθρωπον 的单数泛指，不在正文中额外加入“仅仅”等解释性限定。
- source_word: περιπατεῖτε
  choice: 行事
  rationale: 汉语“行事”自然表达该动词在伦理语境中的生活行为含义，同时仍带有“行”的意象，较“生活”更贴近原文惯用比喻。
theological_decisions:
- issue: σαρκικοί 中与 σάρξ 相关的用语
  choice: 属肉体的
  alternative: 属世的；不属灵的；受罪性支配的
  rationale: 正文保留“肉体”这一神学意象及其与上下文的词汇联系，不把保罗的责备扩写成某一种系统神学解释。
- issue: κατὰ ἄνθρωπον περιπατεῖτε 的表达
  choice: 照着人的方式行事
  alternative: 像普通人一样生活
  rationale: 正文较透明地保留“照着人”的结构及“行事”的伦理意象；注释提供更通顺但解释性稍强的可能译法，以保留该短语可指“以仅仅属人的方式生活”的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“属肉体的”保留保罗的核心比喻，用“嫉妒和纷争”呈现群体中的负面行为；反问句保持责备力度。“照着人的方式行事”兼顾原文形式与现代汉语可读性。
