  text: οὐ γὰρ ἐν λόγῳ ἡ βασιλεία τοῦ θεοῦ ἀλλ’ ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/020.yaml
  text: For the kingdom of God is not in word[a], but in power.
translation:
  language: zh_hans
  text: 因为神的国不在于言辞[a]，而在于能力。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“言谈”或“空话”；这里所强调的是言辞与实际能力之间的对比。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: 因为……不
  rationale: γάρ承接上文，说明保罗将亲自察验那些自高之人的原因；现代汉语用“因为”能自然、明确地表达这一因果关系。οὐ否定前半句。
- source_word: ἐν λόγῳ
  choice: 在于言辞
  rationale: λόγος在这里可指话语、言谈或口头声称。“言辞”保留与“能力”的鲜明对照，也避免把它限定为某一种演说形式；“在于”自然表达ἐν在此所指的依据或体现。
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: 神的国
  rationale: 这是该短语准确而惯用的中文译法，既可涵盖神的统治，也不排除其国度层面的含义，避免仅译作“掌权”而缩窄语义。
- source_word: ἀλλ’ ἐν δυνάμει
  choice: 而在于能力
  rationale: ἀλλά构成强烈转折；δύναμις基本义为“能力、权能”。“能力”保留原文的宽泛性，不擅自限定为神迹、生命改变、使徒权柄或圣灵工作的某一种具体表现。
theological_decisions:
- issue: “言辞”与“能力”的对比性质
  choice: 译文将空有言辞与实际彰显的能力相对照，但不具体界定这种能力的表现形式。
  alternative: 将“能力”明确译解为神迹、生命改变与教会管教、使徒权柄，或狭义的圣灵工作。
  rationale: 原文只给出λόγος与δύναμις的宽泛对比，没有在本节中进一步限定能力的所指；译文应保留这种神学开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“神的国”为自然且通行的圣经用语；“不在于……而在于……”清楚再现希腊文的对偶结构。
