source:
  edition: SBLGNT
  text: δοκῶ ⸀γάρ, ὁ θεὸς ἡμᾶς τοὺς ἀποστόλους ἐσχάτους ἀπέδειξεν ὡς ἐπιθανατίους, ὅτι θέατρον ἐγενήθημεν τῷ κόσμῳ καὶ ἀγγέλοις καὶ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/009.yaml
  text: For it seems to me that God has displayed us[a], the apostles, last of all, like men sentenced to death, because we have become a spectacle to the world[c][b], both to angels and to men.
translation:
  language: zh_hans
  text: 因为我想，神把我们这些使徒列在最后，像注定要死的人一样公开示众；因为我们成了世界、天使和世人所观看的景象[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “景象”直译可作“剧场”或“一台戏”；这里指公开展示、供人观看的场面。
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκῶ γάρ
  choice: 因为我想
  rationale: 保留γάρ与上文的解释关系，也保留δοκῶ所表达的保罗个人判断；用现代汉语自然的“我想”而不强化为确定断言。
- source_word: ἡμᾶς τοὺς ἀποστόλους
  choice: 我们这些使徒
  rationale: 体现同位说明，即“我们”具体指保罗所说的使徒群体。
- source_word: ἐσχάτους ἀπέδειξεν
  choice: 列在最后示众
  rationale: 兼顾ἐσχάτους的末后位置和ἀπέδειξεν公开展示的含义，并与下文刑场或竞技场式的公开观看意象衔接。
- source_word: ὡς ἐπιθανατίους
  choice: 好像注定要死的人
  rationale: 表达这些人已被指定走向死亡的意思，同时不把原文可能涉及的判刑、处决或竞技场背景限定得过死。
- source_word: θέατρον ἐγενήθημεν
  choice: 我们成了……观看的景象
  rationale: θέατρον在这里指公开供人观看的场面或景象，不宜只按建筑物直译为“剧场”。
- source_word: τῷ κόσμῳ καὶ ἀγγέλοις καὶ ἀνθρώποις
  choice: 全世界观看……无论天使还是世人
  rationale: 将与格所指的观看者自然地译出，并保留“世界—天使—人类”的宇宙性观众范围；“世人”指人类，并非只指男性。
theological_decisions:
- issue: ἀγγέλοις所指为何
  choice: 天使，即与世人并列、观看使徒遭遇的属天受造者
  alternative: 使者
  rationale: 在“世界”与“世人”的宇宙性观看语境中，译作超自然的“天使”最自然；译文不进一步断定他们是善是恶。
- issue: 神使使徒公开受辱与受死的表达
  choice: 直接保留神为施事者：“神把……列在最后示众”
  alternative: 弱化为神只是容许这事发生
  rationale: 原文明确以ὁ θεός为主语、ἀπέδειξεν为谓语；译文不应为化解神学张力而改成单纯许可。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“列在最后示众”保留公开展示和末后位置的双重意象；末句适度补出“观看”，使汉语明确表达三个与格成分都是观众，而不改变原意。
