revisions:
- from: 因为我想，神把我们这些使徒列在最后示众，好像注定要死的人[a]；因为我们成了全世界观看的景象[b]，无论天使还是世人，都在观看我们。
  to: 因为我想，神把我们这些使徒列在最后，像注定要死的人一样公开示众；因为我们成了世界、天使和世人所观看的景象[b]。
  rationale: 修订仅调整汉语语序并删除重复的“观看”表达，使“最后”“公开展示”和三类观看者的关系更清楚。删除[a]脚注：正文“注定要死的人”已经保留原词的核心含义，而原脚注把“被判死刑的人”作为替代译法，容易把原文未明确限定的法律意义说得过实；[b]保留并压缩为对θέατρον的必要词义说明。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T03:51:22Z'
review_pass:
