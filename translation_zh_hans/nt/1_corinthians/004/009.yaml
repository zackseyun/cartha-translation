  source_fidelity: 译文总体准确保留了保罗的个人判断、神为施事者、使徒被置于最后且如同被指定死亡者的处境，以及世界、天使和人类共同观看的意象。原译末句另加“都在观看我们”，虽是为汉语补足与格含义，却与“全世界观看的景象”重复，并使句法显得拖沓。
  naturalness: “列在最后示众”可理解，但“最后”修饰的位置与“示众”的公开展示动作在汉语中略有黏连不清。改为“列在最后，像……一样公开示众”更清楚。将观众统一处理为“世界、天使和世人所观看的景象”，自然且避免重复。
  terminology: “使徒”“神”“天使”“世人”均合适。“注定要死的人”保留ἐπιθανατίους所含的被指定/走向死亡之意，不把具体背景限定为死刑或竞技场。
  issues:
