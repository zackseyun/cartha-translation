review_pass:
  verdict: revise
  source_fidelity: 译文总体忠实保留了推论、不可过早论断、主的来临、隐情的揭露、内心意图的显明，以及称赞出于上帝等主要内容。不过“只等主来”在汉语中较像附加的劝告，未能清楚承载“不要论断”持续到主来以前的时间界限；宜改为“直到主来”。“暗中隐藏的事”虽可理解，却弱化了τὰ κρυπτὰ τοῦ σκότους中“黑暗”的属格意象，改作“黑暗中隐藏的事”更贴近原文。
  naturalness: 原文庄重流畅。“时候未到”与“不要论断任何事”自然；将分句调整为“不要论断任何事，直到主来”可消除“只等”的句法歧义，并使时间修饰关系更明确。“各人都要从上帝得着称赞”是对末句自然且忠实的现代汉语表达。
  terminology: “主”恰当保留κύριος，未越过原文扩写身份；“上帝”一致对应θεός。“论断”适合本节带有审断意味的κρίνετε。“意图”可对应βουλάς，脚注所列“打算”及“动机”合理。
