revisions:
- from: 所以，时候未到，什么都不要论断，只等主来。他也要把暗中隐藏的事显露出来，并显明人心里的意图[a]。那时，各人所得的称赞必从上帝而来。
  to: 所以，时候未到，不要论断任何事，直到主来；他要把黑暗中隐藏的事显露出来，也要显明人心的意图[a]。那时，各人都要从上帝得着称赞。
  rationale: 修订仅澄清原文句法与意象：以“直到主来”准确连接禁止论断与其时间界限；以“黑暗中隐藏的事”更完整保留σκότους的黑暗意象。末句改为“各人都要从上帝得着称赞”，自然表达ἑκάστῳ与ἀπὸ τοῦ θεοῦ，且不添加行为、责罚或其他解释。
