source:
  edition: SBLGNT
  text: ὥστε μὴ πρὸ καιροῦ τι κρίνετε, ἕως ἂν ἔλθῃ ὁ κύριος, ὃς καὶ φωτίσει τὰ κρυπτὰ τοῦ σκότους καὶ φανερώσει τὰς βουλὰς τῶν καρδιῶν, καὶ τότε ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/005.yaml
  text: Therefore[a], do not judge anything before the time, until the Lord comes, who will also bring to light the hidden things of darkness and reveal the purposes of the hearts[c][b]. Then each one’s praise will come from God.
translation:
  language: zh_hans
  text: 所以，时候未到，不要论断任何事，直到主来；他要把黑暗中隐藏的事显露出来，也要显明人心的意图[a]。那时，各人都要从上帝得着称赞。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “意图”也可译作“打算”或“动机”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: 所以
  rationale: 承接上文作推论，现代汉语自然清楚。
- source_word: μὴ πρὸ καιροῦ τι κρίνετε
  choice: 时候未到，什么都不要论断
  rationale: 保留πρὸ καιροῦ“在时候以前”的时间限制，也以“什么都不要”表达τι所扩展的范围；不擅自加入原文没有明说的“所定”。
- source_word: ἕως ἂν ἔλθῃ ὁ κύριος
  choice: 只等主来
  rationale: 自然表达“直到主来”的界限；“主”保留κύριος的称号及末世语境。
- source_word: φωτίσει τὰ κρυπτὰ τοῦ σκότους
  choice: 把暗中隐藏的事显露出来
  rationale: 用汉语惯用表达传达使隐藏之事进入光明、得以显露的比喻，同时保留黑暗与隐藏的意象。
- source_word: φανερώσει τὰς βουλὰς τῶν καρδιῶν
  choice: 显明人心里的意图
  rationale: βουλαί可指意图、打算或谋算；“意图”较宽泛，不把它收窄为纯粹的动机。汉语集合式“人心”自然涵盖希腊文复数。
- source_word: ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ
  choice: 各人所得的称赞必从上帝而来
  rationale: 明确保留称赞的来源是上帝，并以“各人”表达ἑκάστῳ的逐一分配意味；“必……而来”贴近未来时及γενήσεται的表达。
theological_decisions:
- issue: 论断的范围与时间
  choice: 保留广泛禁令，同时以“时候未到”和“只等主来”限定为主来以前的论断。
  alternative: 理解为绝对禁止一切判断，或仅禁止对使徒的评断。
  rationale: 本节的句法把禁令明确置于主未来来临并揭露隐情的时间框架内；译文不借解释性增补缩窄其范围。
- issue: “主”的身份
  choice: 译作“主”，不在正文中扩写为耶稣。
  alternative: 直接译作“主耶稣”，或泛指上帝。
  rationale: 保罗书信及主来施行最终评断的语境最自然指向耶稣，但原文只有称号ὁ κύριος；保留“主”可忠实呈现原文。
- issue: 最终评断的结果
  choice: 保留“各人所得的称赞必从上帝而来”的正面措辞。
  alternative: 扩写为上帝将按各人行为给予称赞或责罚。
  rationale: 原文此处只明说称赞，不应补入虽可能合乎更广神学语境、却未见于本句的责罚。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“暗中隐藏的事”避免生硬直译“黑暗的隐事”，同时保留原文的黑暗意象；全节仅在存在真实词义幅度处设置脚注。
