  text: ἐὰν γὰρ μυρίους παιδαγωγοὺς ἔχητε ἐν Χριστῷ, ἀλλ’ οὐ πολλοὺς πατέρας, ἐν γὰρ Χριστῷ Ἰησοῦ διὰ τοῦ εὐαγγελίου ἐγὼ ὑμᾶς ἐγέννησα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/015.yaml
  text: For even if you have countless guardians in Messiah[a], yet not many fathers; for in Messiah Jesus, through the gospel[d][c][b], I became your father.
translation:
  language: zh_hans
  text: 因为即使你们在弥赛亚里有成千上万的监护人[a]，父亲却不多；因为我是在弥赛亚耶稣里，借着福音生了你们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “成千上万的”也可直译为“一万名”。希腊文在这里可泛指数量极多。“监护人”指希腊罗马社会中负责看护、督导和管束儿童的人，并不主要指课堂教师。
    reason: 词义与文化背景说明
  - marker: b
    text: “生了你们”也可译作“作了你们的父亲”。这是比喻说法，指保罗借着福音带领他们信从弥赛亚。
    reason: 比喻及译法说明
lexical_decisions:
- source_word: μυρίους
  choice: 上万名
  rationale: 该词本义为“一万”，在此可泛指极多；“上万名”既保留数字意象，也自然表达夸张语气。
- source_word: παιδαγωγοὺς
  choice: 监护人
  rationale: 希腊罗马社会中的 παιδαγωγός 主要负责儿童的看护、约束和督导，并非现代意义上以课堂教学为主的教师。
- source_word: ἐν Χριστῷ / ἐν Χριστῷ Ἰησοῦ
  choice: 在弥赛亚里／在弥赛亚耶稣里
  rationale: 保留保罗惯用的“在……里”表达，并将 Χριστός 作为称号译为“弥赛亚”。
- source_word: πατέρας
  choice: 父亲
  rationale: 直接保留原文父子关系的比喻，不在正文中增添“属灵”等解释性限定。
- source_word: διὰ τοῦ εὐαγγελίου
  choice: 借着福音
  rationale: διά 加属格表示途径或媒介；“借着福音”准确体现福音是使他们得生的媒介。
- source_word: ἐγέννησα
  choice: 生了你们
  rationale: 直译保留 γεννάω 的生育意象，并与前句“父亲”形成明确呼应；脚注说明其比喻意义，避免误解为生理关系。
theological_decisions:
- issue: 如何表达保罗的父子比喻而不加入宗派性含义
  choice: 译作“我……生了你们”，保留原文鲜明的生育和父亲比喻
  alternative: “我成了你们的父亲”或“我使你们得以重生”
  rationale: 原文以 ἐγέννησα 陈述保罗借福音使哥林多人进入信仰的独特角色；直译保留张力，又不把比喻扩展为教阶身份或特定的重生教义。
- issue: “在弥赛亚里”与“借着福音”的关系
  choice: 两者均按原文保留，不把前者改写为工具意义
  alternative: “我靠着弥赛亚耶稣、借着福音……”
  rationale: ἐν 与 διά 在原文中不同；保留“在……里”和“借着……”可避免将二者的语义关系过度合并。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“上万名……却不多”保留原文强烈对比；“监护人”较“导师”更符合古代社会角色；“生了你们”虽具冲击力，却准确保留原文比喻，并以脚注帮助普通读者理解。
