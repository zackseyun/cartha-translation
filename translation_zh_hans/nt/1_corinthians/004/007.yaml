  text: τίς γάρ σε διακρίνει; τί δὲ ἔχεις ὃ οὐκ ἔλαβες; εἰ δὲ καὶ ἔλαβες, τί καυχᾶσαι ὡς μὴ λαβών;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/007.yaml
  text: For who makes you different? And what do you have that you did not receive? And if you did receive it[a], why do you boast as if you had not received it?
translation:
  language: zh_hans
  text: 因为谁使你与众不同呢？[a]你有什么不是领受的呢？如果你确实领受了，为什么还夸口，仿佛这不是你领受的呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“谁把你区分出来呢？”希腊语动词可表示“区分”“使有分别”或“判定有别”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γάρ σε διακρίνει
  choice: 因为，谁使你与众不同呢？
  rationale: γάρ承接上文，说明不可自高的理由；διακρίνει在此为及物用法，可指区分、使有分别或判定有别。“使你与众不同”以自然汉语保留问题的开放性，不明确限定是谁、什么恩赐或何种地位造成差别。
- source_word: τί δὲ ἔχεις ὃ οὐκ ἔλαβες
  choice: 你有什么不是领受的呢？
  rationale: δὲ在连续的反问中是轻微连接词，汉语无需硬译。“领受”准确表达ἔλαβες所指的接受所得，并与下句形成清楚的重复。
- source_word: εἰ δὲ καὶ ἔλαβες
  choice: 如果你确实领受了
  rationale: 保留εἰ的条件形式，不改写成明确因果；“确实”体现καὶ在此加强语气的作用。宾语依上下文自然省略。
- source_word: τί καυχᾶσαι
  choice: 为什么还夸口
  rationale: “夸口”是καυχάομαι在保罗书信语境中自然且稳定的对应；“还”传达既是领受者却仍自夸的反诘张力。
- source_word: ὡς μὴ λαβών
  choice: 仿佛不是领受的呢？
  rationale: ὡς加分词表达所表现出来的方式或姿态。“仿佛”保留其比较和反事实意味；汉语省略重复宾语，仍可清楚回指所有之物。
theological_decisions:
- issue: 保罗责备人以自身的差别和所有之物夸口
  choice: 保留措辞的广泛范围：人的差别和所有之物都是领受的，而非自有的。
  alternative: 把所领受的内容明确限定为属灵恩赐、教会职分，或扩展为一切能力、身份和福分。
  rationale: 上下文涉及使徒服事、结党和夸口，但本节用语本身较为概括。译文不把“所领受的”缩窄到某一类恩赐，也不额外列举其范围。
- issue: εἰ δὲ καὶ ἔλαβες的条件与事实关系
  choice: 译作“如果你确实领受了”，保留原文的条件式反问。
  alternative: 译作“既然你是领受的”，直接表达为已确认的事实。
  rationale: 上下文显然预期肯定答案，但保留“如果”更贴近原文句法，也保存反问推进时的修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。三个连续反问保持原文的节奏；以“领受”重复对应同一希腊词根，不用解释性词语限定所领受之物。
