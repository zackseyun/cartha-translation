  text: ἐμοὶ δὲ εἰς ἐλάχιστόν ἐστιν, ἵνα ὑφ’ ὑμῶν ἀνακριθῶ ἢ ὑπὸ ἀνθρωπίνης ἡμέρας· ἀλλ’ οὐδὲ ἐμαυτὸν ἀνακρίνω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/003.yaml
  text: But to me it is a very small thing that I should be examined by you or by any human court; in fact[a], I do not even examine myself.
translation:
  language: zh_hans
  text: 至于我，被你们考察，或受人的评判[a]，对我来说都是极小的事；我连自己也不考察。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人的评判”原文直译为“人的日子”，是指人的审理、判断或评价的习语。
    reason: 说明ἀνθρωπίνης ἡμέρας的字面表达及正文采用的习语化译法。
lexical_decisions:
- source_word: ἐμοὶ δὲ
  choice: 至于我
  rationale: 将与格所表达的个人立场自然地译出，并保留 δέ 带出的转折和话题转换。
- source_word: εἰς ἐλάχιστόν ἐστιν
  choice: 我都看为极小的事
  rationale: 表达此事在保罗看来无足轻重；“极小的事”保留原文最高级所强调的最低重要性，同时符合现代汉语。
- source_word: ἵνα ὑφ’ ὑμῶν ἀνακριθῶ
  choice: 被你们评断
  rationale: 此处 ἵνα 引出被视为小事的内容。ἀνακρίνω 指审查、评估，不必然指最终定罪；“评断”兼顾上下文中的判断语境和词义强度。
- source_word: ἢ ὑπὸ ἀνθρωπίνης ἡμέρας
  choice: 或被人的法庭评断
  rationale: ἀνθρωπίνη ἡμέρα 字面为“人的日子”，在此语境中指人的审判或评议场合；“人的法庭”以自然汉语传达其习语意义，并与主的审判形成含蓄对照。
- source_word: ἀλλ’ οὐδὲ ἐμαυτὸν ἀνακρίνω
  choice: 其实，我连自己也不评断
  rationale: “其实”传达 ἀλλά 的推进和反转，“连……也不”保留 οὐδέ 的递进强调；重复“评断”以维持两个 ἀνακρίνω 之间的词汇呼应。
theological_decisions:
- issue: ἀνθρωπίνης ἡμέρας 的含义
  choice: 正文译为“人的法庭”
  alternative: “人的日子”或“人的评断”
  rationale: 原语表达字面虽为“人的日子”，但语境指属于人的审理或评价，与随后主的审判相对照。正文采用习语化译法，脚注保留字面形式和更宽泛的语义可能。
- issue: ἀνακρίνω 是否表示终极审判
  choice: 译为“评断”
  alternative: “审问”“察验”或“审判”
  rationale: 该词可指审查和评估，并不必然等同于终局性的定罪。“评断”保留人的评价与司法语感之间的张力，也避免将保罗的话绝对化为拒绝一切自省。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“至于我”突出保罗的个人立场；“看为极小的事”较为凝练。“评断”在本节重复出现，以保留原文同一动词的呼应。脚注标记置于整节末尾，但明确说明其所对应的“人的法庭”。
