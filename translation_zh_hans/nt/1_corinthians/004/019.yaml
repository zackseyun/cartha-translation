id: 1CO.4.19
reference: 1 Corinthians 4:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: ἐλεύσομαι δὲ ταχέως πρὸς ὑμᾶς, ἐὰν ὁ κύριος θελήσῃ, καὶ γνώσομαι οὐ τὸν λόγον τῶν πεφυσιωμένων ἀλλὰ τὴν δύναμιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/019.yaml
  text: But I will come to you soon[a], if the Lord wills, and I will find out not the speech of those who are puffed up[b], but the power.
translation:
  language: zh_hans
  text: 但主若愿意，我很快就会到你们那里去；我要了解的，不是那些自高自大之人的言辞，而是他们的能力。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “能力”也可译作“权能”。这里的“能力”具体指何种表现，原文没有明说。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύσομαι δὲ ταχέως πρὸς ὑμᾶς
  choice: 但……我很快就会到你们那里去
  rationale: 将未来时译为“会到……去”，按哥林多人所在视角表达保罗前往他们那里的行动；“很快”体现 ταχέως 在此所指的近期时间，δὲ 则以“但”承接上文的轻微转折。
- source_word: ἐὰν ὁ κύριος θελήσῃ
  choice: 主若愿意
  rationale: 自然、简洁地保留条件语气以及保罗对主旨意的倚赖；κύριος 只译作“主”，不进一步指定所指。
- source_word: γνώσομαι
  choice: 我要了解的
  rationale: 这里不是单指获得抽象知识，而是保罗亲自到访后查明真实情形；“了解”既自然，也不过度强化审查意味。
- source_word: τὸν λόγον
  choice: 言辞
  rationale: λόγος 在此与 δύναμις 对举，所指是这些人所说的话或言论；“言辞”保持凝练和庄重，又不把它窄化为某一种教导内容。
- source_word: τῶν πεφυσιωμένων
  choice: 那些自高自大之人
  rationale: 该完成时被动分词描述因骄傲而膨胀的持续状态；中文采用自然的惯用表达，传达保罗的贬义意象。
- source_word: τὴν δύναμιν
  choice: 他们的能力
  rationale: δύναμις 与“言辞”形成对比。“能力”保留其宽泛含义，不限定为神迹、使徒权柄或属灵效力；补出“他们的”仅为中文指代清晰。
theological_decisions:
- issue: 条件句中“主”的具体所指
  choice: 仅译作“主”
  alternative: “主耶稣”或“神”
  rationale: 原文只有 ὁ κύριος。保罗书信中此称号可能具有基督论含义，但本节没有明确要求进一步指定，因此保留原文的开放性。
- issue: “言辞”与“能力”的对比范围
  choice: 保留言语与实际能力之间的宽泛对比
  alternative: 明确解释为修辞与使徒权柄、教导与神迹，或空谈与属灵果效之间的对比
  rationale: 上下文确实强调神国不在言语而在能力，但没有将“能力”限定为某一种表现；译文不替原文消除这种神学张力。
translation_notes:
  register: 采用现代、庄重且普通读者易懂的简体中文。“自高自大”自然传达 φυσιόω 的骄傲膨胀意象；整体保留原文紧凑的“言辞—能力”对举。
