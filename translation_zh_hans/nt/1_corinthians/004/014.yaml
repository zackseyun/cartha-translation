  text: Οὐκ ἐντρέπων ὑμᾶς γράφω ταῦτα, ἀλλ’ ὡς τέκνα μου ἀγαπητὰ ⸀νουθετῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/014.yaml
  text: I am not writing these things to shame you[b][a], but admonishing you as my beloved children.
translation:
  language: zh_hans
  text: 我写这些话，不是要使你们羞愧[a]，而是把你们当作我亲爱的儿女来劝诫[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不是要叫你们惭愧”。
    reason: lexical_alternative
  - marker: b
    text: “劝诫”也可译作“警戒”或“劝导”，含有为纠正而提醒、教导的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντρέπων
  choice: 要使你们羞愧
  rationale: 在否定结构中表达保罗写这些话并非以使读者蒙羞为目的；“使你们羞愧”保留了原词的羞耻意味，也符合现代汉语表达。
- source_word: γράφω ταῦτα
  choice: 我写这些话
  rationale: 保留现在时书信表达及ταῦτα的复数指向；“这些话”在中文中自然清楚。
- source_word: ἀλλ’
  choice: 而是
  rationale: 与前面的“不是”构成自然、明确的否定—肯定对照。
- source_word: ὡς
  choice: 把你们当作
  rationale: 自然表达保罗以亲子关系看待并劝诫哥林多人的方式，不把这种关系弱化为纯粹比喻。
- source_word: τέκνα μου ἀγαπητὰ
  choice: 我亲爱的儿女
  rationale: “儿女”具有性别包容性并体现亲子关系；“亲爱的”自然传达ἀγαπητά的温情。
- source_word: νουθετῶν
  choice: 来劝诫
  rationale: 兼顾劝导、警戒和纠正的含义；“劝诫”保持纠正力度，同时不显得纯属惩罚。
theological_decisions:
- issue: 保罗纠正哥林多人的牧养语气
  choice: 不是要使你们羞愧，而是把你们当作我亲爱的儿女来劝诫
  alternative: 不是要叫你们惭愧，而是警戒你们，如同我亲爱的儿女
  rationale: 译文同时保留否定的羞辱目的、正面的纠正行动，以及属灵父亲般的亲爱关系，不将责备淡化为一般建议，也不渲染为严厉定罪。
- issue: ὡς所表达的亲子关系
  choice: 把你们当作我亲爱的儿女
  alternative: 如同对待我亲爱的儿女
  rationale: 上下文呈现保罗实际以属灵儿女看待他们；“当作”在现代汉语中自然，但不额外界定这种父子关系的神学性质。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式以“不是……而是……”清楚呈现希腊文对照；“亲爱的儿女”保留亲密的牧养语气，“劝诫”则维持原文的纠正力度。
