  text: ⸀δυσφημούμενοι παρακαλοῦμεν· ὡς περικαθάρματα τοῦ κόσμου ἐγενήθημεν, πάντων περίψημα ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/013.yaml
  text: When slandered[a], we appeal; we have become like the world's refuse, the scum of all things[b], until now.
translation:
  language: zh_hans
  text: 遭人诽谤时，我们便劝说；直到如今，我们竟成了世上的污物、万物的渣滓。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “污物”和“渣滓”所译的两个希腊词都很少见，可指清扫、擦拭或刮除时去掉的残余污物，因而形容被人视为极其卑贱、应当丢弃的东西。
    reason: cultural_note
lexical_decisions:
- source_word: δυσφημούμενοι
  choice: 遭人诽谤时
  rationale: 被动分词表示受到恶意毁谤或中伤；用时间状语表达其附带情形，符合现代汉语。
- source_word: παρακαλοῦμεν
  choice: 我们仍劝勉
  rationale: παρακαλέω 可表示劝勉、恳求或安抚。上下文强调使徒面对辱骂时不以恶报恶；“劝勉”保留动词本身的语义宽度，不额外加入原文没有明说的“温和地”。“仍”体现上下句的反差，但不规定劝勉的对象。
- source_word: ὡς
  choice: 成了
  rationale: ὡς 带有比较意味。汉语若直译为“像……一样成了”较累赘；“成了世上的污秽”自然有被视作此物的修辞含义，且保留强烈的贬抑效果。
- source_word: περικαθάρματα
  choice: 污秽
  rationale: 该罕见名词指清除、洗净时除掉之物，进而表示被鄙弃的污物；“污秽”庄重而有力度。
- source_word: τοῦ κόσμου
  choice: 世上的
  rationale: 表达与世界的所属或关系，即在世人眼中被当作应当清除的污物。
- source_word: ἐγενήθημεν
  choice: 我们成了
  rationale: 表达进入并持续处于受鄙弃的境况；与“直到如今”连用，自然呈现其延续至写作当下的结果。
- source_word: πάντων
  choice: 万物中的
  rationale: 保留 πάντων 宽泛而未限定为人的范围，并以现代汉语自然表达其极致、全面的语气。
- source_word: περίψημα
  choice: 渣滓
  rationale: 指擦去或刮掉的残余污物，也可比喻极受轻视的人；“渣滓”鲜明、有力，并与前一词形成近义并列。
- source_word: ἕως ἄρτι
  choice: 直到如今
  rationale: 准确表达这种受辱处境一直延续到写信时；置于句首可自然统摄后半句。
theological_decisions:
- issue: περικαθάρματα 与 περίψημα 是否应译出献祭替罪者的含义
  choice: 正文译为“污秽／渣滓”，突出遭世人极度鄙弃的处境
  alternative: 在正文中译成带有替罪、献祭或除灾祭品含义的称谓
  rationale: 两个词确与清除污物的意象相关，古代用法也可能引发仪式背景的联想，但本节并未明确提出代赎教义。正文不将有争议的背景解释写成确定含义，而在脚注说明其原始图像。
- issue: παρακαλοῦμεν 在此处的具体语气
  choice: 译作“劝勉”，保留可指劝说、恳求或安抚的范围
  alternative: 译作“恳求”“温言相劝”或“安慰”
  rationale: 上下文确定这是一种不报复的言语回应，却未明说具体内容或对象；“劝勉”既自然，也避免加入“温和”等原文未明示的方式成分。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“诽谤”“劝勉”保持书面尊严；“污秽／渣滓”保留原文罕见并列词的强烈羞辱感。脚注标记置于相关并列意象之后。
