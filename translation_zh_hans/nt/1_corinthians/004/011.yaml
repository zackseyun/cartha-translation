base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/011.yaml
  text: Up to this present hour we are hungry and thirsty[a], and poorly clothed, and beaten[c][b], and homeless.
translation:
  language: zh_hans
  text: 直到现在这一刻，我们仍然挨饿，仍然口渴，仍然衣不蔽体[a]，仍然遭人殴打，仍然居无定所[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“赤身露体”；希腊语也可指衣着不足，并不一定表示完全赤裸。
    reason: lexical_alternative
  - marker: b
    text: 或译“漂泊不定”或“没有固定住处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι τῆς ἄρτι ὥρας
  choice: 直到现在这一刻
  rationale: 表达“直至当前时刻”的持续时间，并保留ἄρτι与ὥρα所带出的“现在这一刻”的强调。
- source_word: πεινῶμεν
  choice: 挨饿
  rationale: 现在时陈述持续处境；“挨饿”自然地传达缺乏食物的困苦，比单说“饿”更符合此处的患难语境，却不额外夸大。
- source_word: διψῶμεν
  choice: 口渴
  rationale: 与“挨饿”并列，直接表达持续缺水的处境。
- source_word: γυμνιτεύομεν
  choice: 衣不蔽体
  rationale: 该词可指赤身，也常指衣着不足；“衣不蔽体”保留严重匮乏的意味，同时避免武断地限定为完全赤裸。
- source_word: κολαφιζόμεθα
  choice: 遭人殴打
  rationale: 被动现在时表示持续或反复受到身体攻击；“遭人殴打”清楚自然，又不把动作过窄地限定为拳击或掌掴。
- source_word: ἀστατοῦμεν
  choice: 居无定所
  rationale: 表达没有固定住处、生活漂泊不定；比现代社会政策语境中的“无家可归”更能保留原词所含的不安定意味。
- source_word: καὶ … καὶ … καὶ …
  choice: 仍然……仍然……仍然……
  rationale: 以重复的“仍然”配合并列分句，再现原文反复καί所形成的累积节奏，并突出这些苦难一直延续到现在。
theological_decisions:
- issue: 保罗对使徒处境的描述应按实况还是主要按夸张修辞理解
  choice: 按持续发生的贫困、受虐和漂泊处境直译
  alternative: 视为主要出于反讽或夸张的修辞描述
  rationale: 原文用一连串现在时直陈具体困苦；译文保持朴实，不淡化，也不额外强化其程度。
translation_notes:
  register: 采用现代、庄重而通俗的书面汉语。“直到现在这一刻”保留时间强调；连续使用“仍然”呈现原文层层累加的力度。
