id: 1CO.4.21
reference: 1 Corinthians 4:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: τί θέλετε; ἐν ῥάβδῳ ἔλθω πρὸς ὑμᾶς, ἢ ἐν ἀγάπῃ πνεύματί τε πραΰτητος;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/021.yaml
  text: What do you want? Should I come to you with a rod[b][a], or with love and a spirit of gentleness?
translation:
  language: zh_hans
  text: 你们想要怎样呢？是要我带着杖到你们那里去，还是带着爱和温柔的心[a]去呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“带着爱和温柔的灵”。这里的“灵”可以指保罗温柔的心态；也有人理解为圣灵所带来的温柔。
    reason: alternative_reading
lexical_decisions:
- source_word: τί θέλετε
  choice: 你们想要怎样呢？
  rationale: 直译其修辞性问句，同时以现代汉语自然表达保罗要求读者作出选择的语气。
- source_word: ἐν ῥάβδῳ
  choice: 带着杖
  rationale: 保留ῥάβδος的具体意象及其管教意味，不直接意译为“施行管教”，以免消除原文的比喻张力。
- source_word: ἔλθω πρὸς ὑμᾶς
  choice: 要我……到你们那里去
  rationale: 用“要我”表达商议式虚拟语气，使整句在现代汉语中自然，并保留反问和挑战的力度。
- source_word: ἐν ἀγάπῃ
  choice: 带着爱
  rationale: 与前面的“带着杖”形成平衡，表达保罗前来的方式和态度。
- source_word: πνεύματί τε πραΰτητος
  choice: 和温柔的心
  rationale: “心”在现代汉语中自然表示人的内在态度或性情，符合上下文中保罗来访方式的对比；脚注保留“灵”的较形式对应及可能涉及圣灵的理解。
theological_decisions:
- issue: πνεύματι在πνεύματί τε πραΰτητος中的所指
  choice: 正文译作“温柔的心”，主要指保罗温柔的态度或性情
  alternative: “温柔的灵”，并可能理解为圣灵所产生或体现的温柔
  rationale: 上下文直接对比保罗来访的两种方式：持杖的严厉与带着爱和温柔的态度。原文没有冠词，也未明确指称圣灵，因此正文不将其限定为圣灵；脚注则保留原词的语义和神学开放性。
translation_notes:
  register: 采用现代、庄重而口语可懂的表达。“杖”保留原文鲜明的管教意象；句末两个“去”使对举关系在汉语中清楚自然。
