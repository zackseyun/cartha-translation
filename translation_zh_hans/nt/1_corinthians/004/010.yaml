  text: ἡμεῖς μωροὶ διὰ Χριστόν, ὑμεῖς δὲ φρόνιμοι ἐν Χριστῷ· ἡμεῖς ἀσθενεῖς, ὑμεῖς δὲ ἰσχυροί· ὑμεῖς ἔνδοξοι, ἡμεῖς δὲ ἄτιμοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/010.yaml
  text: We are fools for Messiah[a], but you are wise in Messiah; we are weak, but you are strong; you are honored[c][b], but we are dishonored.
translation:
  language: zh_hans
  text: 我们为弥赛亚的缘故[a]愚拙，你们在弥赛亚里[b]却有智慧；我们软弱，你们却强壮；你们受人尊重[c]，我们却蒙受羞辱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为弥赛亚的缘故”或译“因弥赛亚”。希腊语διὰ Χριστόν可表示缘由，也可表示所为的对象。
    reason: lexical_alternative
  - marker: b
    text: “在弥赛亚里”是保罗书信中常见的表达；也可译作“在基督里”。
    reason: lexical_alternative
  - marker: c
    text: 这里的“受人尊重”和“蒙受羞辱”主要涉及人在别人眼中的公开地位、荣誉和羞耻，并非仅指内心感受。
    reason: cultural_note
lexical_decisions:
- source_word: μωροὶ
  choice: 愚拙
  rationale: 保留保罗尖锐而带讽刺意味的对比；作为述语形容词译为“愚拙”，比带有现代辱骂色彩的词更自然庄重。
- source_word: διὰ Χριστόν
  choice: 为弥赛亚的缘故
  rationale: διά加宾格可表达缘由或所为对象；正文采用自然的“为……的缘故”，脚注保留“因……”的可能译法。
- source_word: φρόνιμοι
  choice: 有智慧
  rationale: 与“愚拙”构成直接对照，也适合此处反讽语气。
- source_word: ἐν Χριστῷ
  choice: 在弥赛亚里
  rationale: 保留保罗常用的ἐν Χριστῷ表达，不将其解释性改写为别的关系。
- source_word: ἀσθενεῖς / ἰσχυροί
  choice: 软弱 / 强壮
  rationale: 保留原文简洁的反义平行；这些词可能涵盖身体、社会地位及能力等方面，不在正文中过度限定。
- source_word: ἔνδοξοι / ἄτιμοι
  choice: 受人尊重 / 受人轻视
  rationale: 上下文强调公开声望与羞辱的社会性对比；这一译法比“荣耀／无荣耀”更清楚地传达此处含义。
- source_word: δὲ
  choice: 却
  rationale: 重复使用“却”，表现原文三组鲜明的对照。
- source_word: ἡμεῖς / ὑμεῖς
  choice: 我们 / 你们
  rationale: 保留希腊文显明的强调代词，使使徒与哥林多人的对照保持突出。
theological_decisions:
- issue: Χριστός的译法
  choice: 弥赛亚
  alternative: 基督
  rationale: 此处保留Χριστός的称号意义，并使διὰ Χριστόν与ἐν Χριστῷ中的译法一致；脚注不必借此消除两个介词结构各自的语义张力。
- issue: 保罗话语的反讽性质
  choice: 保留直陈式对比，不在正文中加入“自以为”或“被看作”
  alternative: 你们自以为有智慧；我们被看作愚人
  rationale: 语境明显带有反讽，但原句没有明说“自以为”或“被看作”；直译可保留其修辞张力，避免替读者预先解释。
translation_notes:
  register: 采用现代、庄重而简洁的普通话，保留原文三组平行对照和反复出现的“我们／你们”。分号呈现原句的递进节奏；不补入原文未明说的解释性成分。
