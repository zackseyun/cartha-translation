  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἔπεμψα ὑμῖν Τιμόθεον, ὅς ἐστίν ⸂μου τέκνον⸃ ἀγαπητὸν καὶ πιστὸν ἐν κυρίῳ, ὃς ὑμᾶς ἀναμνήσει τὰς ὁδούς μου τὰς ἐν Χριστῷ ⸀Ἰησοῦ, καθὼς πανταχοῦ ἐν πάσῃ ἐκκλησίᾳ διδάσκω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/017.yaml
  text: For this reason I sent Timothy to you[a], who is my beloved and faithful child in the Lord. He will remind you of my ways in Messiah Jesus[b], just as I teach everywhere in every church.
translation:
  language: zh_hans
  text: 因此，我派提摩太到你们那里去。他是我在主里所亲爱的、忠心的孩子[a]。他会使你们想起我在弥赛亚耶稣里的行事之道[b]，正如我在各处、在每个教会中所教导的一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“儿子”。希腊语τέκνον直译为“孩子”，在这里也可按提摩太的男性身份译作“儿子”。
    reason: lexical_alternative
  - marker: b
    text: “弥赛亚耶稣”或译“基督耶稣”。希腊语Χριστός意为“受膏者”，即“弥赛亚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 因此
  rationale: 自然承接上文，并保留原文的因果关系。
- source_word: ἔπεμψα
  choice: 我派……去
  rationale: 以一般过去时意义表达不定过去时；汉语用“派……去”自然体现差遣某人前往收信人所在地。
- source_word: Τιμόθεον
  choice: 提摩太
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: τέκνον
  choice: 孩子
  rationale: 原词泛指“孩子”，并非专指“儿子”；这里保留保罗属灵亲属关系的比喻。
- source_word: ἀγαπητὸν καὶ πιστὸν
  choice: 所亲爱、忠心的
  rationale: 兼顾保罗对提摩太的深厚情感及其可靠忠诚；“忠心”也符合服事语境。
- source_word: ἐν κυρίῳ
  choice: 在主里
  rationale: 保留保罗书信中常见的关系与生命领域表达，不将其缩减为一般性的宗教归属。
- source_word: ἀναμνήσει
  choice: 会使你们想起
  rationale: 准确传达将来时和使人回想的动作，在现代汉语中清楚自然。
- source_word: τὰς ὁδούς μου
  choice: 我的行事之道
  rationale: “道”保留道路隐喻，“行事”则提示这里并非旅行路线，而是保罗的生活、服事和教导模式。
- source_word: τὰς ἐν Χριστῷ Ἰησοῦ
  choice: 我在弥赛亚耶稣里的
  rationale: 按照希腊语结构修饰“行事之道”，表明这些行事模式以与弥赛亚耶稣的关系为领域和特征。
- source_word: καθὼς πανταχοῦ ἐν πάσῃ ἐκκλησίᾳ διδάσκω
  choice: 正如我在各处、在各教会中所教导的
  rationale: 保留“各处”和“各教会”两个相互强化的范围表达，并以自然汉语呈现对应关系。
theological_decisions:
- issue: Χριστός在ἐν Χριστῷ Ἰησοῦ中的译法
  choice: 弥赛亚耶稣
  alternative: 基督耶稣
  rationale: 此处Χριστός仍具有称号意义；译作“弥赛亚”显明其“受膏者”身份，同时用脚注保留中文教会更熟悉的传统译法。
- issue: “我的道路”的含义
  choice: 我的行事之道
  alternative: 我的道路；我的生活方式
  rationale: 上下文所指是保罗在弥赛亚里的生活、服事与教导模式，而不是旅行路线；译文提示其比喻义，却不把范围限定为单纯行为或教训。
- issue: “在主里”与提摩太品格的关系
  choice: 保留“在主里”对整个亲属与品格描述的开放修饰关系
  alternative: 明确解释为“在主里忠心”或“我在主里的孩子”
  rationale: 原文语序容许“在主里”与“孩子”、亲爱和忠心的整体描述相连；译文不强行缩窄其修饰范围。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“所亲爱、忠心的孩子”保留书信中的亲密与郑重；“行事之道”既让普通读者易懂，也保留原文“道路”的比喻广度。标点和句式避免欧化长句。
