  text: 'Therefore I urge you: become imitators of me[a][b].'
translation:
  language: zh_hans
  text: 所以，我劝你们：要效法我[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要成为我的效法者。”
    reason: lexical_alternative
  - marker: b
    text: 保罗在别处进一步说明：“你们要效法我，像我效法基督一样”（哥林多前书11:1）。
    reason: cross_reference
lexical_decisions:
- source_word: παρακαλῶ
  choice: 我劝
  rationale: 这里是保罗郑重而恳切的劝勉。“我劝”既自然庄重，也保留了劝告、敦促的语气；“我恳求”可能显得过于哀求，“我劝勉”则稍显书面。
- source_word: οὖν
  choice: 所以
  rationale: 该词承接上文并引出推论。“所以”在现代汉语中清楚自然地表达这一逻辑关系。
- source_word: ὑμᾶς
  choice: 你们
  rationale: 原文为第二人称复数宾格；“你们”准确保留复数所指。
- source_word: μιμηταί
  choice: 效法
  rationale: μιμητής指模仿、仿效某人的人。汉语以动词结构“效法我”最自然，也准确表达以保罗为榜样而仿效之意；“作模仿我的人”虽更形式对应，却不够自然。
- source_word: μου
  choice: 我
  rationale: 该属格代词说明效法的对象是保罗本人；在汉语动词结构中自然译作“效法我”。
- source_word: γίνεσθε
  choice: 要
  rationale: 这是γίνομαι的现在时命令语气，含有进入或采取某种状态的意味。汉语“要效法我”自然传达命令和劝勉；将其直译为“要成为效法我的人”虽凸显“成为”，但较为生硬。
theological_decisions:
- issue: 保罗直接要求信徒效法自己；脱离更广的基督中心语境时，这句话可能显得过强。
  choice: 正文直接译为“要效法我”，不作弱化。
  alternative: 要效法我的榜样；要照我的榜样去行。
  rationale: 原文明确以保罗本人为直接效法对象。译文应保留这一神学张力，不在正文中加入原文未明说的限定；同时用脚注提示哥林多前书11:1的相关说明。
translation_notes:
  register: 采用现代、自然而庄重的普通话。“所以，我劝你们”清楚承接上文；冒号凸显后面的劝勉内容。“要效法我”简洁有力，并保留原文直接以保罗为榜样的表达。
