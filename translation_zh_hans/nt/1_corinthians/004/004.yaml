  text: οὐδὲν γὰρ ἐμαυτῷ σύνοιδα, ἀλλ’ οὐκ ἐν τούτῳ δεδικαίωμαι, ὁ δὲ ἀνακρίνων με κύριός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/004.yaml
  text: For I am aware of nothing against myself[a], but I am not justified by this[c][b]; the one who examines me is the Lord.
translation:
  language: zh_hans
  text: 因为我并不察觉自己有什么可责之处[a]，但我并不因此被称义[b]；审察我的是主[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我良心上并不觉得自己有任何可责之处”，或“我不知道自己有什么可责之处”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“但我并不因此被判无罪”，或“并不因此被证明为正当”。希腊文在这里采用司法用语，也是保罗在别处谈到“称义”时所用的词。
    reason: lexical_alternative
  - marker: c
    text: “审察”或译“评断”或“审问”；原词可指在司法情境中审查、调查或评价。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲν γὰρ ἐμαυτῷ σύνοιδα
  choice: 因为我并不觉得自己有什么过错
  rationale: σύνοιδα与反身代词的与格连用，表示自己良心上并未察觉有可指责之事。译文采用现代汉语的自然表达，同时以“过错”保留上下文中的道德和审判意味；完成时在此具有现在状态的意义。
- source_word: ἀλλ’ οὐκ ἐν τούτῳ
  choice: 但我并不因此就
  rationale: ἀλλά标明转折；ἐν τούτῳ在这里指前述自觉无过并非获得判定的根据。“因此”清楚表达这种逻辑关系，“就”加强“不足以据此断定”的语气。
- source_word: δεδικαίωμαι
  choice: 被称义
  rationale: 这是δικαιόω的完成时被动式，带有司法判定色彩。“被称义”保留保罗的重要用语及其神学张力，不把它缩减为单纯的自我辩白；上下文则限定其直接所指为接受审察后的判定。
- source_word: ὁ δὲ ἀνακρίνων με
  choice: 审察我的是
  rationale: ἀνακρίνω可指审查、查问或司法性的评断。“审察”既保留仔细检验的过程，也不提前把它强化为最终定罪。
- source_word: κύριός
  choice: 主
  rationale: 原文只说κύριος，译作“主”，不在正文中补入“耶稣”，从而避免超出本节明说的内容。
theological_decisions:
- issue: δεδικαίωμαι在自我评价语境中的司法含义
  choice: 译作“被称义”
  alternative: 译作“被判无罪”或“被证明为正当”
  rationale: “称义”维持原词的司法和保罗神学用语之间的联系；同时“不因此”表明本节重点是：良心没有自责，并不能成为决定性判词，而不应把本句扩展为本节未明说的完整称义教义。
- issue: κύριος所指的身份
  choice: 正文仅译“主”
  alternative: 译作“主耶稣”
  rationale: 虽可根据保罗书信的较广语境讨论其所指，但本节希腊文没有明说“耶稣”，故不在翻译中补充。
- issue: ἀνακρίνων是审察还是最终审判
  choice: 译作“审察”
  alternative: 译作“审判”或“评断”
  rationale: 该词在本段具有司法评价色彩，但也可着重审查、检验的过程；“审察”保留这一语义幅度，避免把过程与最终判决完全等同。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“觉得自己有什么过错”便于普通读者理解良心自省的含义；“被称义”保留关键司法—神学术语；分号呈现前半句的自我认知与后半句主之审察之间的论证转折。
