  text: ⸀ὧδε λοιπὸν ζητεῖται ἐν τοῖς οἰκονόμοις ἵνα πιστός τις εὑρεθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/002.yaml
  text: In this case[a], moreover[c][b], it is required of stewards that one be found faithful.
translation:
  language: zh_hans
  text: 这样说来[a]，对管家的要求是：必须被认定为忠心。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在这件事上，进一步说”，或“在这里，此外”。
    reason: ὧδε和λοιπὸν的组合既可侧重“这里／这件事”，也可侧重承接上文的推进或推论。
lexical_decisions:
- source_word: ὧδε λοιπὸν
  choice: 这样说来
  rationale: 两词在这里共同承接上文并推进论述；合译为“这样说来”比逐词叠加“在这件事上，此外”更符合现代汉语，同时保留推论和转折推进的作用。
- source_word: ζητεῖται
  choice: 所要求的
  rationale: ζητέω本义为“寻找、寻求”，但此处的被动结构表达对受托者的期待或要求；“所要求的”准确而自然。
- source_word: ἐν τοῖς οἰκονόμοις
  choice: 对管家
  rationale: 介词短语指出这项要求所针对的群体。汉语用“对管家所要求的”自然地表达此义。
- source_word: οἰκονόμοις
  choice: 管家
  rationale: 保留受托管理主人家业的比喻，也与上文“上帝奥秘的管家”相连；“管家”是现代读者易懂的常用称谓。
- source_word: πιστός
  choice: 忠心
  rationale: 此处强调受托者忠于托付、值得信赖。“忠心”既自然，也贴合管家的语境。
- source_word: τις
  choice: 省略不译
  rationale: 希腊文用不定单数泛指任何一位管家。汉语在“对管家……就是要……”的结构中可省略主语，既保留泛指意义，也避免误解为只指男性。
- source_word: εὑρεθῇ
  choice: 显为
  rationale: 保留“被发现、被认定为”的被动评价意味；“显为忠心”比直译“被找到是忠心的”更符合汉语表达。
theological_decisions:
- issue: 泛指单数与性别表达
  choice: 省略代词，用“对管家……就是要显为忠心”表达
  alternative: 就是要他显为忠心
  rationale: τις与阳性形容词在这里是泛指，并非限定男性。汉语省略代词，既不把经文改成复数，也不额外加入男性限定。
- issue: “忠心”是行为可靠还是信仰意义
  choice: 按受托管理的语境译为“忠心”
  alternative: 可信可靠
  rationale: πιστός在此首先指履行托付时忠诚可靠；“忠心”保留其道德和关系层面的分量，而不把它缩减为一般能力上的“可靠”。
translation_notes:
  register: 采用现代、庄重而简洁的书面汉语。“这样说来”自然衔接上文；“管家”保留原文的家庭管理隐喻；省略泛指代词，避免不必要的性别限定。
