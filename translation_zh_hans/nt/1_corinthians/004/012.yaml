  text: καὶ κοπιῶμεν ἐργαζόμενοι ταῖς ἰδίαις χερσίν· λοιδορούμενοι εὐλογοῦμεν, διωκόμενοι ἀνεχόμεθα,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/012.yaml
  text: and we labor[a], working with our own hands. When insulted, we bless; when persecuted, we endure;
translation:
  language: zh_hans
  text: 我们劳苦，亲手做工；遭人辱骂时[a]，我们就祝福；遭受迫害时，我们就忍耐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“遭人毁谤时”。
    reason: 词义涵盖以侮辱性言辞攻击他人；“辱骂”侧重当面恶言，“毁谤”则可侧重损害名誉的言语攻击。正文采用更直接、常用的译法。
lexical_decisions:
- source_word: κοπιῶμεν
  choice: 我们劳苦
  rationale: 该词表示付出艰辛、令人疲惫的劳作；“劳苦”简洁保留了辛劳的意味，又不把它弱化为一般的工作。
- source_word: ἐργαζόμενοι
  choice: 做工
  rationale: 分词说明“劳苦”的具体方式，即从事亲手的劳动；“做工”自然清楚，不额外推断其目的。
- source_word: ταῖς ἰδίαις χερσίν
  choice: 亲手
  rationale: 保留ἰδίαις所强调的“自己的”，以现代汉语惯用的“亲手”表达使徒亲自从事体力劳动。
- source_word: λοιδορούμενοι
  choice: 遭人辱骂时
  rationale: 被动分词在这一连串对照中表达所遭遇的处境；“辱骂”准确指言语侮辱，也比古雅措辞更易懂。
- source_word: εὐλογοῦμεν
  choice: 我们就祝福
  rationale: 保留重要的圣经用语“祝福”，呈现面对辱骂时不以恶言还击、反而祝福的对照。
- source_word: διωκόμενοι
  choice: 遭受迫害时
  rationale: 此处指敌意的逼迫而非中性的追赶；“遭受迫害”符合保罗语境，并与前一个被动分词形成平行。
- source_word: ἀνεχόμεθα
  choice: 我们就忍受
  rationale: 该词在此表示承受、容忍敌对待遇；不补出希腊文没有明说的宾语，以保留原文的简练。
theological_decisions:
- issue: 面对恶待的伦理回应
  choice: 译为使徒们在受辱骂时祝福、受迫害时忍受的实际表现
  alternative: 扩展译成对所有信徒的直接命令
  rationale: 原文以陈述语气描述使徒的行为。译文保留其鲜明的伦理示范，却不把陈述改写成原文未明说的普遍命令。
- issue: “祝福”的对象
  choice: 不明说祝福辱骂他们的人
  alternative: 译为“我们就为辱骂我们的人祝福”
  rationale: 上下文强烈暗示祝福是对辱骂的回应，但原文未明列对象；简洁译法既保留对照，也避免增补。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“劳苦，亲手做工”保留原文先概括辛劳、再说明亲手劳动的结构；后三个分句以“遭……时，我们就……”形成清楚的平行与对照。
