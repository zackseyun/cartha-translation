  text: Some have become puffed up[b][a], as though I were not coming to you.
translation:
  language: zh_hans
  text: 有些人自高自大起来[a][b]，仿佛我不来你们那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有些人变得傲慢，仿佛我不来你们那里。”
    reason: lexical_alternative
  - marker: b
    text: 原文采用“膨胀起来”的形象，指自以为了不起的骄傲；参见林前4:6、4:19、5:2、8:1、13:4。
    reason: cross_reference
lexical_decisions:
- source_word: ὡς
  choice: 仿佛
  rationale: 引出这些人据以自大的假想情形；“仿佛”自然地保留比较和假设语气，并未断言保罗确实不来。
- source_word: μὴ ἐρχομένου ... μου πρὸς ὑμᾶς
  choice: 我不会到你们那里去
  rationale: 该属格分词结构受 ὡς 支配，表达他人所设想的情形。译成现代汉语的完整分句，既通顺，也保留其并非事实陈述的性质。
- source_word: δέ
  choice: 不单独译出
  rationale: δέ 在这里是轻微的承接或转折连接词；本句在上下文中的语流已能体现其功能，硬译“但是”反而可能使汉语显得突兀。
- source_word: ἐφυσιώθησάν
  choice: 自高自大起来
  rationale: 该动词本义带有“膨胀、鼓起来”的形象，在本书中反复用于自负骄傲。正文采用现代汉语中自然且庄重的“自高自大起来”，并以脚注说明原文意象及书内呼应；“起来”也体现进入并呈现这种状态。
- source_word: τινες
  choice: 有些人
  rationale: 指教会群体中的一部分人；“有些人”简明自然，也没有扩大指涉范围。
theological_decisions:
- issue: 如何表达保罗对哥林多人骄傲的批评
  choice: 正文译作“自高自大起来”，脚注保留“膨胀起来”的原文形象。
  alternative: 直译为“膨胀起来”或译作“变得傲慢”。
  rationale: “自高自大”准确传达语境中的骄傲，普通读者也容易理解；脚注则保留保罗在《哥林多前书》中反复使用的形象，避免抹去其修辞联系，同时不额外引入宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“仿佛”保留错误设想的语气；“自高自大起来”符合自然汉语，相关原文意象与书内呼应放入脚注。
