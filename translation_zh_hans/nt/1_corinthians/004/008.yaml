  text: Ἤδη κεκορεσμένοι ἐστέ, ἤδη ἐπλουτήσατε, χωρὶς ἡμῶν ἐβασιλεύσατε· καὶ ὄφελόν γε ἐβασιλεύσατε, ἵνα καὶ ἡμεῖς ὑμῖν συμβασιλεύσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/008.yaml
  text: Already you have had your fill[a]; already you have become rich; apart from us you have become kings. And I wish indeed that you had become kings[c][b], so that we also might reign with you.
translation:
  language: zh_hans
  text: 你们已经饱足了，已经富足了；撇开我们，你们就作王了！我倒真希望你们已经作王，好让我们也和你们一同作王。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节带有反讽意味：哥林多人表现得仿佛自己已经完全饱足、富足，并且已经作王。
    reason: 修辞说明
lexical_decisions:
- source_word: ἤδη
  choice: 已经
  rationale: 在前两句中重复“已经”，保留保罗置于句首的时间强调和反讽节奏。
- source_word: κεκορεσμένοι ἐστέ
  choice: 饱足了
  rationale: 周言式完成结构表达达到饱足后所处的状态；“饱足了”自然简洁，也保留宴席或满足感的意象。
- source_word: ἐπλουτήσατε
  choice: 富足了
  rationale: 保留动词所表达的状态转变及其当前结果，并与“饱足了”形成平行。
- source_word: χωρὶς ἡμῶν
  choice: 不用我们
  rationale: χωρίς可表示“离开、没有”；此处“不用我们”自然传达哥林多人仿佛无需使徒便已登上高位的反讽。
- source_word: ἐβασιλεύσατε
  choice: 作王了
  rationale: 直接保留βασιλεύω的王权意象，不加入原文没有明说的“开始”或将其弱化为一般的成功掌权。
- source_word: ὄφελόν γε
  choice: 我倒真希望
  rationale: “希望”表达未实现的愿望，“真”体现γε的加强语气，“倒”衔接前文反讽，同时容纳其中真实盼望的成分。
- source_word: ἵνα
  choice: 好让
  rationale: 自然表达目的或预期结果，不强行排除两者之间的语义空间。
- source_word: συμβασιλεύσωμεν
  choice: 和你们一同作王
  rationale: 明确呈现συν-的共同含义，并保持与前面βασιλεύω相同的王权意象。
theological_decisions:
- issue: 前三个陈述的语气
  choice: 以断言形式保留反讽，并用感叹号提示其修辞力度
  alternative: 把这些话译成直接、字面的称赞
  rationale: 4:7—13的上下文把哥林多人的自我认知与使徒的卑微受苦相对照；正文不增添“自以为”等解释性措辞，以免把暗含的反讽明说过度。
- issue: 作王语言的含义
  choice: 保留“作王”的王权意象
  alternative: 意译为“掌权”“高高在上”或“飞黄腾达”
  rationale: βασιλεύω与συμβασιλεύω明确使用君王统治的意象，可能带有末世性的张力；泛化会损失原文的神学和修辞联系。
- issue: 愿望句中反讽与真诚的关系
  choice: 译为“我倒真希望”，同时保留反讽转折和真实愿望
  alternative: 纯粹视为讥讽，或纯粹视为不带反讽的愿望
  rationale: ὄφελόν γε表达强烈愿望，而上下文仍有明显反讽；译文不替原文消除这层张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“饱足—富足—作王”保持逐步上升的排比；分号和感叹号呈现保罗尖锐的修辞节奏。脚注标记置于整节末尾，说明全句的反讽语气。
