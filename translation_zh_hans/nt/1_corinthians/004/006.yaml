- from: 弟兄们[a]，这些事我为了你们的缘故，转用在我自己和亚波罗身上，好让你们从我们身上学会这句话：“不可越过所记的话。”[b]这样，你们就不会有人抬举这个、贬低那个，因而自高自大。
  to: 弟兄们[a]，这些事我为了你们的缘故，转而用在我自己和亚波罗身上，好让你们从我们身上学会这句话：“不可越过所记载的。”[b]免得你们中间有人偏袒一个人、反对另一个人，而自高自大。
