  verdict: revise
  source_fidelity: 译文前半准确传达了保罗把前述论述转而用于自己和亚波罗、以使哥林多人学习某项准则的意思。引语采用禁戒式处理，且脚注保留原文省略性，属可接受的处理。不过末句将“自高自大”处理成“抬举这个、贬低那个”所导致的结果，并加入“这样”，弱化并重排了原文“因偏袒一人、反对另一人而自高自大”的修饰关系。
  naturalness: 整体庄重通顺；但“转用在……身上”可调整为更自然的“转而用在……身上”，“所记的话”不如“所记载的”贴合中文经文语体。末句改为直接表达偏袒、反对与自高自大的并合关系，会更清晰自然。
  terminology: “弟兄们”“亚波罗”“自高自大”均恰当。“不可越过所记载的”既保留该省略格言的开放性，也避免把所写内容限缩为“话”。脚注a、b的内容和锚点均合适。
  issues:
