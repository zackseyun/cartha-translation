  text: Ταῦτα δέ, ἀδελφοί, μετεσχημάτισα εἰς ἐμαυτὸν καὶ ⸀Ἀπολλῶν δι’ ὑμᾶς, ἵνα ἐν ἡμῖν μάθητε τό· Μὴ ὑπὲρ ⸀ἃ ⸀γέγραπται, ἵνα μὴ εἷς ὑπὲρ τοῦ ἑνὸς φυσιοῦσθε κατὰ τοῦ ἑτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/006.yaml
  text: 'These things, brothers, I have applied to myself and Apollos for your sake, so that in us you may learn this: “Do not go beyond what is written,” so that none of you may be puffed up in favor of one against another.'
translation:
  language: zh_hans
  text: 弟兄们[a]，这些事我为了你们的缘故，转而用在我自己和亚波罗身上，好让你们从我们身上学会这句话：“不可越过所记载的。”[b]免得你们中间有人偏袒一个人、反对另一个人，而自高自大。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”所译的希腊词是阳性复数，但在这里可用来称呼包括女性在内的全体信徒。
    reason: cultural_note
  - marker: b
    text: 原文十分省略，直译近于“那‘不可越过所记载的’”；这也可能是当时的一句格言或口号。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: 这些事
  rationale: 复数指示词回指前文的整段论述，保留其概括范围。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留希腊文阳性复数称呼；在当时可用于包括女性在内的信徒群体，故加脚注说明。
- source_word: μετεσχημάτισα εἰς ἐμαυτὸν καὶ Ἀπολλῶν
  choice: 转用在我自己和亚波罗身上
  rationale: 该动词表示把前述论说以修辞方式转而套用于保罗和亚波罗；“转用”既体现转移，也避免把意义限定为单纯举例。
- source_word: δι’ ὑμᾶς
  choice: 为了你们的缘故
  rationale: 此处 διά 加宾格在语境中表达受益或目的。
- source_word: ἵνα ἐν ἡμῖν μάθητε
  choice: 好让你们从我们身上学会
  rationale: ἐν ἡμῖν 表示保罗和亚波罗是他们领会功课的实例或范围；中文用“从我们身上”自然传达这一压缩表达。
- source_word: τό· Μὴ ὑπὲρ ἃ γέγραπται
  choice: 这句话：“不可越过所记的话。”
  rationale: 原文省略而紧缩，τό 引出所学内容；“不可”保留禁戒语气，“所记的话”反映 γέγραπται 的书面及经文色彩，同时以脚注保留其可能是格言的形式。
- source_word: φυσιοῦσθε
  choice: 自高自大
  rationale: 该词字面带有膨胀意象，在哥林多前书中指骄傲自大；“自高自大”是现代中文自然而庄重的对应。
- source_word: ὑπὲρ τοῦ ἑνὸς ... κατὰ τοῦ ἑτέρου
  choice: 抬举这个、贬低那个
  rationale: 在结党语境中表达偏袒一人而敌对另一人；此译清楚呈现双方对立，且不额外指定人物。
theological_decisions:
- issue: τό· Μὴ ὑπὲρ ἃ γέγραπται 的省略结构及所指
  choice: 译作禁戒语“不可越过所记的话”，并用脚注说明原文的省略性与格言可能
  alternative: 更形式化地译作“不要超过所记的”，或将其视为口号：“不越过所记的”
  rationale: 该短语最自然地充当信徒要学会的准则，但希腊文并无显明的命令动词，且可能引用一句格言；正文传达劝戒功能，脚注保留形式与解释上的张力，不把“所记的”进一步限定为某一组经文。
- issue: ὑπὲρ τοῦ ἑνὸς ... κατὰ τοῦ ἑτέρου 与 φυσιοῦσθε 的关系
  choice: 译为“抬举这个、贬低那个，因而自高自大”
  alternative: 译为“为这个人反对另一个人而自高自大”
  rationale: 介词短语描述结党式的偏袒和敌对；中文调整语序可清楚表达这种骄傲的具体表现，而不把经文解释成抽象的个人优越感。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“转用在……身上”保留保罗修辞性转用前文论述的含义；末句按中文习惯重排，但保留偏袒、敌对与自高自大之间的逻辑关系。所有脚注标记均已置于正文。
