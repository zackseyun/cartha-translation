  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: SBLGNT
  text: Οὕτως ἡμᾶς λογιζέσθω ἄνθρωπος ὡς ὑπηρέτας Χριστοῦ καὶ οἰκονόμους μυστηρίων θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/001.yaml
  text: 'This is how a person should regard us: as servants of Messiah and stewards of the mysteries of God[a][b].'
translation:
  language: zh_hans
  text: 人应当这样看待我们：把我们看作基督的仆役和上帝奥秘的管家。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὕτως
  choice: 这样
  rationale: 指明应当如何评价保罗及其同工；“这样”自然保留原文的方式与指示意味。
- source_word: ἡμᾶς
  choice: 我们
  rationale: 作“看待”的宾语，按上下文指保罗及与他一同服事的人。
- source_word: λογιζέσθω
  choice: 应当……看待
  rationale: 原文为命令式，表达规范性要求；“应当看待”在现代汉语中自然且保留其劝令力度。
- source_word: ἄνθρωπος
  choice: 人
  rationale: 这里的阳性单数具有泛指作用；汉语“人”既准确又自然，无须人为加入男性限定。
- source_word: ὡς
  choice: 把……看作
  rationale: 表示应以何种身份看待他们；采用汉语兼语式以清楚表达两个并列身份。
- source_word: ὑπηρέτας
  choice: 仆役
  rationale: 该词指在权柄之下执行职务、提供服务的人，不特别强调奴隶身份；“仆役”比“奴隶”准确，也比单纯“仆人”略能体现受差遣履职之意。
- source_word: Χριστοῦ
  choice: 基督的
  rationale: Χριστός在中文圣经语境中以“基督”作为通行的称号译法；此处属格表明他们服事并隶属于基督。
- source_word: οἰκονόμους
  choice: 管家
  rationale: 指受托管理家业或资源的人；“管家”准确保留受托管理及向主人负责的比喻。
- source_word: μυστηρίων
  choice: 奥秘
  rationale: 保留保罗用语所指属于上帝、由上帝启示的隐秘真理，不在正文中把其含义过度解释为“秘密”或“已经启示的奥秘”。
- source_word: θεοῦ
  choice: 上帝
  rationale: 属格自然表达这些奥秘属于上帝并源于上帝；“上帝”是现代标准汉语中清楚而庄重的对应词。
theological_decisions:
- issue: Χριστοῦ作为称号还是名称化表达
  choice: 基督的
  alternative: 弥赛亚的
  rationale: 原词本义为“受膏者”，但在现代中文基督教及圣经语域中，“基督”本身就是该希腊称号的规范译名，并未消除其称号性质；“弥赛亚”通常对应音译自希伯来文/亚兰文的形式，在此反而会模糊希腊原文措辞。
- issue: μυστηρίων θεοῦ的属格关系
  choice: 上帝奥秘的管家
  alternative: 管理上帝所启示之奥秘的人
  rationale: 保留原文简洁且可兼具所属与来源意味的属格结构，不在正文中限定为单一解释。
- issue: ἄνθρωπος的泛指性质
  choice: 人
  alternative: 一个男人
  rationale: 此处不是强调男性，而是泛指任何作出评价的人；现代汉语“人”忠实传达泛指，不涉及以性别中和改写原意。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“人应当这样看待我们”保留命令式的规范语气；补出第二个“我们”形成“把”字结构，使两个身份“仆役”和“管家”清楚并列。未设脚注，因为“基督”和泛指的“人”在中文中均可直接、准确传达原文，无需借脚注纠正正文可能造成的误解。
