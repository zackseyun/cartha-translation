  text: προφῆται δὲ δύο ἢ τρεῖς λαλείτωσαν, καὶ οἱ ἄλλοι διακρινέτωσαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/029.yaml
  text: Let two or three prophets speak[a], and let the others weigh what is said.
translation:
  language: zh_hans
  text: 让两三个先知发言，其他人要加以辨别[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“判断”“评断”或“评估”。希腊词在这里可以指审察、辨别先知性发言。
    reason: 词义存在多个相近选项；脚注说明此处所指的是对先知性发言的评察。
lexical_decisions:
- source_word: προφῆται
  choice: 先知
  rationale: 该名词指先知或作先知性发言的人；译作“先知”最直接，也符合本节对会众聚会中发言秩序的规定。
- source_word: δὲ
  choice: 不单独译出
  rationale: 此处δέ只是从前文转入下一项指示的轻微衔接；现代汉语无需另加连接词，语气更自然，也不会夸大转折意味。
- source_word: δύο ἢ τρεῖς
  choice: 两三个
  rationale: 准确表达“两或三”的人数范围；“两三个”是自然、简洁的现代汉语说法。
- source_word: λαλείτωσαν
  choice: 让……发言
  rationale: 保留第三人称复数命令式的规范语气；“发言”比泛指的“说话”更符合聚会场景。
- source_word: οἱ ἄλλοι
  choice: 其他人
  rationale: 原文没有说明这些人究竟是其他先知、聚会领袖，还是会众中的其余人；“其他人”保留了这一指代上的开放性。
- source_word: διακρινέτωσαν
  choice: 要加以辨别
  rationale: 此处指审察、分辨先知性发言，而不一定是定罪式的判断。“加以辨别”自然表达慎重评察之意，并保留其隐含宾语。
theological_decisions:
- issue: “其他人”的身份
  choice: 笼统译作“其他人”，不限定具体群体
  alternative: 译作“其他先知”或“其余会众”
  rationale: 希腊文仅说“其他人”，没有进一步界定。译文不替原文解决有关聚会权柄或参与者身份的问题。
- issue: διακρίνω所表达的评察性质
  choice: 译作“辨别”，理解为审察先知性发言
  alternative: 译作“判断”“评断”或“评估”
  rationale: 上下文要求对先知性发言作慎重检验；“辨别”避免无根据地强化为司法性定罪，同时脚注保留其他可能译法。
translation_notes:
  register: 采用现代、庄重且适合公开诵读的普通话。“让……发言”保留命令语气，“加以辨别”清楚而不过度解释；句法简洁，并保留原文对“其他人”身份的含混性。
